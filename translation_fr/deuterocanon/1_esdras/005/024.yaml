base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/024.yaml
  text: 'The priests: the sons of Jeddus[a], the son of Jeshua, of the sons of Sanabeis, eight hundred seventy-two; the sons of Emerus[c][b], two hundred fifty-two.'
translation:
  language: fr
  text: 'Les prêtres : les fils de Jeddus, fils de Josué, parmi les fils de Sanabéis[a], huit cent soixante-douze ; les fils d’Érméros[b], deux cent cinquante-deux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « vers les fils de Sanabéis ». La construction est inhabituelle dans cette liste de recensement et semble indiquer l’appartenance à une famille ou à un groupe.
    reason: lexical_alternative
  - marker: b
    text: Le nom grec Érméros pourrait correspondre à la famille sacerdotale appelée Immer dans la tradition hébraïque. Le texte traduit ici suit directement le témoin grec. Le parallèle du texte massorétique fourni pour cet emplacement ne correspond pas étroitement à cette ligne grecque, en raison des réorganisations connues dans 1 Esdras.
    reason: textual_variant
lexical_decisions:
- source_word: οἱ ἱερεῖς
  choice: Les prêtres
  rationale: L’article et le nom introduisent un sous-groupe du recensement. Cette formulation directe conserve clairement la structure de la liste.
- source_word: οἱ υἱοὶ Ἰέδδου
  choice: les fils de Jeddus
  rationale: Dans une liste généalogique, υἱοί peut désigner les descendants, mais « fils de » conserve l’idiome et la forme du grec.
- source_word: τοῦ υἱοῦ Ἰησοῦ
  choice: fils de Josué
  rationale: Ἰησοῦ représente ici le nom porté par Josué dans un contexte généalogique postexilique. La forme française « Josué » évite une association anachronique avec Jésus tout en restant naturelle.
- source_word: εἰς τοὺς υἱοὺς Σαναβείς
  choice: parmi les fils de Sanabéis
  rationale: La préposition εἰς est inhabituelle dans cette formule de recensement. « Parmi » exprime prudemment une affiliation au groupe sans lui imposer un sens directionnel.
- source_word: ὀκτακόσιοι ἑβδομήκοντα δύο
  choice: huit cent soixante-douze
  rationale: Rendu direct du nombre cardinal, selon l’usage orthographique français.
- source_word: υἱοὶ Ἐρμήρου
  choice: les fils d’Érméros
  rationale: La forme française translittère directement le nom grec Ἐρμήρου, le témoin principal, plutôt que de lui substituer une forme hébraïsée issue d’un parallèle non concordant.
- source_word: διακόσιοι πεντήκοντα δύο
  choice: deux cent cinquante-deux
  rationale: Rendu direct et idiomatique du nombre cardinal.
