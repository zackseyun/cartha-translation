base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/046.yaml
  text: When the seventh month had come[a], and the sons of Israel were each in their own places[c][b], they gathered with one accord in the open area of the first gate on the east.
translation:
  language: fr
  text: Lorsque le septième mois arriva, et que les fils d’Israël se trouvaient chacun dans leurs propres lieux[a], ils se rassemblèrent d’un commun accord dans l’espace dégagé de la première porte, du côté de l’est[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « chacun dans ce qui lui était propre ». Le parallèle hébreu présente les Israélites installés dans leurs villes.'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi comprendre : « dans le vaste espace » ou « sur la place ». Le grec désigne un endroit large et ouvert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνστάντος δὲ τοῦ ἑβδόμου μηνός
  choice: Lorsque le septième mois arriva
  rationale: Le génitif absolu situe l’action au commencement du septième mois. « Arriva » est naturel en français et conserve la valeur temporelle sans ajouter un marqueur discursif absent du grec.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: les fils d’Israël
  rationale: Cette traduction conserve l’expression familiale et identitaire explicite du grec, plutôt que de la réduire au collectif « les Israélites ».
- source_word: ἕκαστος ἐν τοῖς ἰδίοις
  choice: chacun chez eux
  rationale: L’expression grecque, littéralement « chacun dans ce qui lui est propre », désigne le lieu propre à chacun sans préciser s’il s’agit de maisons ou de villes. Le tour collectif « chacun chez eux » est idiomatique en français international et évite de surinterpréter le pluriel neutre.
- source_word: συνήχθησαν ὁμοθυμαδόν
  choice: ils se rassemblèrent d’un commun accord
  rationale: « D’un commun accord » rend l’unité d’intention exprimée par ὁμοθυμαδόν, au-delà du simple fait d’être ensemble.
- source_word: εἰς τὸ εὐρύχωρον
  choice: dans l’espace dégagé
  rationale: Le terme désigne un endroit large et ouvert. « Espace dégagé » reste accessible tout en évitant de préciser indûment qu’il s’agissait d’une place urbaine aménagée.
- source_word: τοῦ πρώτου πυλῶνος
  choice: de la première porte
  rationale: Le grec dit littéralement « première porte ». La traduction conserve cette désignation architecturale incertaine sans la transformer en « porte principale ».
- source_word: τοῦ πρὸς τῇ ἀνατολῇ
  choice: du côté de l’est
  rationale: Cette formulation rend l’orientation orientale de la porte sans imposer une relation spatiale plus précise que celle du grec.
theological_decisions:
- issue: Portée du masculin familial dans τῶν υἱῶν Ἰσραήλ
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le texte grec emploie une expression familiale traditionnelle qui peut porter une nuance d’identité collective et d’alliance. La conserver maintient cette texture, tandis que « les Israélites » serait plus idiomatique mais moins transparent lexicalement.
translation_notes:
  register: Français moderne, courant et digne. La syntaxe narrative demeure soutenue sans archaïsmes. « Les fils d’Israël » préserve volontairement la formulation familiale du grec; « chacun chez eux » privilégie un accord selon le sens collectif, naturel dans l’usage contemporain.
