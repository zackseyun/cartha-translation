base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/044.yaml
  text: and to give to the holy treasury for the works one thousand minas of gold[a], and five thousand minas of silver[b], and one hundred priestly garments.
translation:
  language: fr
  text: et de donner au trésor sacré[a] destiné aux travaux mille mines d’or[b], cinq mille mines d’argent et cent vêtements sacerdotaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « trésor du Temple ». L’expression grecque associe l’idée de sacré à celle de trésor ou de dépôt.
    reason: lexical_alternative
  - marker: b
    text: La mine était une ancienne unité de poids et, par extension, de valeur. Le terme ancien est conservé ici sans conversion en unité moderne.
    reason: cultural_note
lexical_decisions:
- source_word: δοῦναι
  choice: donner
  rationale: L’infinitif grec est rendu directement et conserve le lien syntaxique avec le contexte précédent.
- source_word: ἱερὸν γαζοφυλάκιον
  choice: trésor sacré
  rationale: « Trésor » rend le dépôt de biens précieux, et « sacré » conserve explicitement la qualification ἱερόν sans préciser davantage que le grec.
- source_word: τῶν ἔργων
  choice: destiné aux travaux
  rationale: Cette formulation française exprime naturellement la relation de destination portée par le génitif et maintient le pluriel général du grec.
- source_word: χρυσίου μνᾶς χιλίας
  choice: mille mines d’or
  rationale: Le terme ancien de poids et de valeur est conservé plutôt que converti en unité moderne incertaine.
- source_word: ἀργυρίου μνᾶς πεντακισχιλίας
  choice: cinq mille mines d’argent
  rationale: Le parallélisme avec l’or et la quantité exacte du grec sont maintenus dans un ordre naturel en français.
- source_word: στολὰς ἱερατικὰς
  choice: vêtements sacerdotaux
  rationale: « Vêtements » reste accessible et assez large pour στολαί, tandis que « sacerdotaux » indique clairement leur usage par les prêtres.
- source_word: ἑκατόν
  choice: cent
  rationale: Rendu numérique direct conforme au style d’inventaire du verset.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La structure d’inventaire est conservée; « destiné aux travaux » explicite seulement la relation syntaxique du génitif grec. Le parallèle massorétique fourni correspond à un autre élément de liste et ne modifie donc pas la traduction du texte grec principal.
