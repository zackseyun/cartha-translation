  text: And Darius sent with them a thousand horsemen[a], until they had brought them back to Jerusalem in peace and with music,
translation:
  language: fr
  text: Et Darius envoya avec eux mille cavaliers, jusqu’à ce qu’ils les aient ramenés à Jérusalem en paix et avec des musiciens[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec de la musique ». Le grec peut désigner des musiciens ou, plus généralement, un accompagnement musical.
    reason: lexical_alternative
lexical_decisions:
- source_word: συναπέστειλεν
  choice: envoya avec eux
  rationale: 'Le préverbe συν- exprime l’accompagnement : Darius envoie les cavaliers avec le groupe. Cette tournure est naturelle et conserve cette valeur.'
- source_word: ἱππεῖς χιλίους
  choice: mille cavaliers
  rationale: ἱππεῖς désigne ici des hommes montés, vraisemblablement une escorte militaire. « Cavaliers » est précis et courant en français.
- source_word: ἕως τοῦ ἀποκαταστῆσαι αὐτούς
  choice: jusqu’à ce qu’ils les aient ramenés
  rationale: La construction marque l’accompagnement jusqu’à l’accomplissement du retour. « Ramener » rend naturellement l’idée de rétablir quelqu’un dans son lieu antérieur, sans suggérer ici une restauration institutionnelle.
- source_word: εἰς Ἰερουσαλήμ
  choice: à Jérusalem
  rationale: Avec un verbe de retour tel que « ramener », le français emploie naturellement « à » pour indiquer la destination.
- source_word: μετʼ εἰρήνης
  choice: en paix
  rationale: Cette expression conserve l’image grecque et peut englober à la fois la sécurité du trajet et son caractère paisible.
- source_word: μετὰ μουσικῶν
  choice: avec des musiciens
  rationale: Le génitif pluriel μουσικῶν se comprend le plus naturellement comme désignant des personnes liées à la musique. La possibilité plus générale d’un accompagnement musical est conservée en note.
