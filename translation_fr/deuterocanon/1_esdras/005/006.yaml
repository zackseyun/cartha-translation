  text: and from the tribe of Judah[a], who spoke wise words to Darius king of the Persians in the second year of his reign, in the month Nisan, the first month.
translation:
  language: fr
  text: et de la tribu de Juda, celui qui prononça des paroles sages devant Darius[a], roi des Perses, la deuxième année de son règne, au mois de Nisan, le premier mois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «en présence de Darius» ou «à Darius»; dans ce contexte de cour, l’expression grecque ἐπὶ Δαρείου peut se comprendre de plusieurs manières très proches.
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλῆς δὲ Ἰούδα
  choice: et de la tribu de Juda
  rationale: φυλή désigne ici une division tribale; «tribu» est le terme français usuel. δέ assure la liaison avec le contexte précédent, tandis que «Juda» suit la forme française traditionnelle du nom.
- source_word: ὃς ἐλάλησεν
  choice: celui qui prononça
  rationale: Le relatif masculin singulier renvoie à une personne évoquée dans le contexte. «Prononça» rend naturellement l’acte de parler tout en introduisant son contenu.
- source_word: ἐπὶ Δαρείου
  choice: devant Darius
  rationale: Avec le génitif, ἐπί peut ici situer la prise de parole devant le roi, dans un cadre de cour. «Devant Darius» préserve ce sens sans exclure que les paroles lui aient été adressées.
- source_word: τοῦ βασιλέως Περσῶν
  choice: roi des Perses
  rationale: La construction génitive est rendue directement et conformément à l’usage français pour le titre royal.
- source_word: λόγους σοφούς
  choice: des paroles sages
  rationale: Cette formulation conserve le pluriel λόγους et la qualification σοφούς, sans transformer l’expression en catégorie abstraite comme «sagesse».
- source_word: ἐν τῷ δευτέρῳ ἔτει τῆς βασιλείας αὐτοῦ
  choice: la deuxième année de son règne
  rationale: Expression temporelle française naturelle; «règne» est l’équivalent contextuel de βασιλεία.
- source_word: μηνὶ Νισὰν τοῦ πρώτου μηνός
  choice: au mois de Nisan, le premier mois
  rationale: Le texte nomme explicitement le mois et précise par apposition que Nisan est le premier mois.
