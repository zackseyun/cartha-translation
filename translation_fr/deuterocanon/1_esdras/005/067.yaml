base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/067.yaml
  text: Then Zerubbabel and Jeshua and the heads of the fathers’ houses of Israel said to them[b][a], “It is not for you to build the house for the Lord our God.”
translation:
  language: fr
  text: 'Zorobabel, Josué[a] et les chefs des familles d’Israël leur dirent : « Ce n’est pas à vous de bâtir la maison[b] pour le Seigneur notre Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte le nom Ἰησοῦς, qui désigne ici le grand prêtre postexilique appelé Josué; autre forme possible : « Yéchoua ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « le temple »; littéralement « la maison ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ζοροβαβὲλ
  choice: Zorobabel
  rationale: Forme française traditionnelle du nom de ce dirigeant de l’époque postexilique.
- source_word: Ἰησοῦς
  choice: Josué
  rationale: Dans ce contexte, le nom désigne le grand prêtre postexilique; « Josué » est la forme française biblique usuelle et évite la confusion avec Jésus de Nazareth.
- source_word: οἱ ἡγούμενοι τῶν πατριῶν
  choice: les chefs des familles
  rationale: Rend naturellement en français les responsables des groupes familiaux ou maisons ancestrales d’Israël, sans introduire une structure plus précise que le grec.
- source_word: Οὐχ ὑμῖν τοῦ οἰκοδομῆσαι
  choice: Ce n’est pas à vous de bâtir
  rationale: Conserve la tournure elliptique d’exclusion du grec sans importer l’expression plus développée du parallèle d’Esdras 4.3.
- source_word: τὸν οἶκον
  choice: la maison
  rationale: Traduction littérale qui préserve l’expression biblique pour le sanctuaire; le sens contextuel « temple » est indiqué en note.
- source_word: Κυρίῳ θεῷ ἡμῶν
  choice: pour le Seigneur notre Dieu
  rationale: Le datif après « bâtir » se rend naturellement par « pour »; « Seigneur » traduit le grec κύριος, tout en laissant perceptible l’arrière-plan du nom divin dans la tradition hébraïque parallèle.
theological_decisions:
- issue: Traduction de κύριος dans un contexte où le parallèle hébreu porte le nom divin YHWH
  choice: le Seigneur
  alternative: l’Éternel / le SEIGNEUR
  rationale: La source primaire grecque porte Κυρίῳ. « Le Seigneur » traduit directement ce texte sans substituer au grec une convention fondée uniquement sur le parallèle hébreu.
- issue: Portée de l’exclusion adressée aux interlocuteurs
  choice: Ce n’est pas à vous de bâtir
  alternative: Vous n’avez aucune part avec nous dans la construction
  rationale: Le grec de ce verset nie leur rôle dans la construction, mais ne contient pas la formulation plus développée du texte parallèle; la traduction n’ajoute donc pas cette précision.
translation_notes:
  register: Français international moderne, sobre et digne. Le pluriel « dirent » suit l’usage français avec le sujet composé, malgré le singulier formel du verbe grec. « Familles » privilégie la clarté courante tout en gardant la structure sociale ancestrale du passage.
