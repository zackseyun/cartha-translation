base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/057.yaml
  text: And the priests stood arrayed with musicians and trumpets, and the Levites, the sons of Asaph, had the cymbals, praising the Lord and blessing him according to David king of Israel;
translation:
  language: fr
  text: Les prêtres, en tenue d’apparat, prirent place avec les musiciens et les trompettes[a]. Les lévites, fils d’Asaph, tenaient les cymbales ; ils chantaient les louanges du Seigneur et le bénissaient selon David, roi d’Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec les instruments de musique et les trompettes ». Le grec peut désigner des musiciens, l’accompagnement musical ou des instruments.
    reason: lexical_alternative
  - marker: b
    text: Ou « à la manière de David, roi d’Israël » ou « conformément à ce qu’avait établi David, roi d’Israël ». Le grec indique une conformité à David sans préciser s’il s’agit surtout de ses prescriptions, de son exemple ou de sa manière de faire.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστησαν
  choice: prirent place
  rationale: Exprime naturellement la prise de position dans un cadre cérémoniel, sans suggérer qu’ils furent placés par quelqu’un d’autre.
- source_word: ἐστολισμένοι
  choice: revêtus de leurs habits de cérémonie
  rationale: Rend l’idée d’une tenue apprêtée pour le service cultuel sans préciser indûment la nature exacte des vêtements sacerdotaux.
- source_word: μετὰ μουσικῶν καὶ σαλπίγγων
  choice: avec les musiciens et les trompettes
  rationale: μουσικῶν peut désigner des musiciens ou, plus largement, un accompagnement musical. Le texte principal retient les personnes, tout en signalant l’autre possibilité en note.
- source_word: Λευεῖται υἱοὶ Ἀσὰφ
  choice: les lévites, fils d’Asaph
  rationale: Conserve à la fois l’appartenance lévitique et l’identification familiale ou corporative liée à Asaph.
- source_word: ἔχοντες τὰ κύμβαλα
  choice: tenaient les cymbales
  rationale: Rend directement le participe et convient à la scène musicale, sans réduire le sens à une simple possession.
- source_word: ὑμνοῦντες τῷ κυρίῳ
  choice: ils chantaient les louanges du Seigneur
  rationale: ὑμνέω désigne ici une louange chantée; cette formulation française est claire et naturelle.
- source_word: εὐλογοῦντες
  choice: le bénissaient
  rationale: Conserve le sens cultuel de «bénir»; le pronom explicite renvoie naturellement au Seigneur.
- source_word: κατὰ Δαυεὶδ βασιλέα τοῦ Ἰσραήλ
  choice: selon ce qu’avait établi David, roi d’Israël
  rationale: Exprime la conformité à un ordre ou modèle davidique, tout en reconnaissant en note que κατά permet aussi une lecture moins prescriptive.
theological_decisions:
- issue: Traduction de κύριος dans le contexte du culte d’Israël
  choice: le Seigneur
  alternative: Seigneur
  rationale: L’article grec est présent et le titre désigne ici le Dieu d’Israël; «le Seigneur» est la formulation française usuelle et digne.
- issue: Portée de κατὰ Δαυεὶδ βασιλέα τοῦ Ἰσραήλ
  choice: selon ce qu’avait établi David, roi d’Israël
  alternative: à la manière de David, roi d’Israël
  rationale: La phrase évoque une conformité à David, mais le grec ne tranche pas entièrement entre prescription, précédent et manière; la note préserve cette latitude.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe longue du grec est répartie en deux phrases pour la clarté, et les termes du culte restent concrets sans introduire de vocabulaire confessionnel spécialisé.
