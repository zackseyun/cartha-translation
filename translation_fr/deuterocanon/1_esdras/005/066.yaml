base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/066.yaml
  text: For we also[a], like you, listen to your Lord, and we will sacrifice to him from the days of Asbakaphath king of the Assyrians[c][b], who brought us here.
translation:
  language: fr
  text: En effet, tout comme vous, nous écoutons votre Seigneur, et nous lui offrirons des sacrifices[a] à partir des jours d’Asbakaphath, roi des Assyriens[b], qui nous a amenés ici[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte littéralement un futur, « nous lui offrirons des sacrifices », suivi d’une expression signifiant « à partir des jours de ». Cette combinaison temporelle est inhabituelle ; le contexte pourrait laisser attendre « nous lui offrons des sacrifices depuis » ou « nous lui en avons offert depuis ».
    reason: textual_or_grammatical_difficulty
  - marker: b
    text: Asbakaphath est la forme du nom dans le texte grec. Dans le passage parallèle d’Esdras 4.2, le roi est appelé Ésar-Haddon.
    reason: alternative_reading
  - marker: c
    text: Le verbe peut désigner le transfert ou le déplacement d’une population ; dans ce contexte assyrien, il peut évoquer une déportation ou une réinstallation imposée.
    reason: cultural_note
lexical_decisions:
- source_word: ὁμοίως
  choice: tout comme vous
  rationale: Exprime clairement la similitude revendiquée entre les locuteurs et leurs interlocuteurs, sans ajouter d’approbation à cette revendication.
- source_word: ἀκούομεν
  choice: nous écoutons
  rationale: Conserve à la fois l’idée d’entendre et la possible nuance d’attention ou de réponse, sans aller jusqu’au sens plus fort d’« obéir ».
- source_word: τοῦ κυρίου ὑμῶν
  choice: votre Seigneur
  rationale: Rend le possessif explicite et n’ajoute pas « Dieu », absent du texte grec.
- source_word: ἐπιθύσομεν
  choice: nous lui offrirons des sacrifices
  rationale: Le verbe est au futur et désigne spécifiquement l’offrande sacrificielle. Cette formulation est plus naturelle en français que « nous lui sacrifierons » tout en gardant la valeur cultuelle.
- source_word: ἀπὸ ἡμερῶν
  choice: depuis l’époque de
  rationale: L’expression indique un point de départ temporel. Le français « depuis l’époque de » rend l’idiome, même si son association avec le futur grec demeure difficile.
- source_word: Ἀσβακαφὰθ
  choice: Asbakaphath
  rationale: Translittère la forme du nom propre attestée dans le texte grec principal plutôt que de la remplacer silencieusement par l’identification du parallèle hébreu.
- source_word: βασιλέως Ἀσσυρίων
  choice: roi des Assyriens
  rationale: Suit la formulation ethnographique du grec, littéralement « roi des Assyriens ».
- source_word: μετήγαγεν
  choice: a transférés
  rationale: Le verbe exprime le déplacement d’un lieu vers un autre. « Transférés » laisse percevoir l’action d’une puissance impériale sans préciser au-delà du grec s’il s’agissait d’une déportation forcée.
- source_word: ἐνταῦθα
  choice: ici
  rationale: Équivalent français direct et naturel de l’adverbe de lieu.
theological_decisions:
- issue: Les locuteurs prétendent-ils adorer la même divinité que les Judéens revenus d’exil ?
  choice: 'Présenter directement leur affirmation : « tout comme vous, nous écoutons votre Seigneur » et « nous lui offrirons des sacrifices ».'
  alternative: Renforcer leur affirmation par « nous obéissons au Seigneur votre Dieu », ou au contraire marquer une distance sceptique.
  rationale: Le passage rapporte leur propre revendication sans en confirmer ni en nier la sincérité. « Votre Seigneur » respecte le grec, qui ne contient pas ici le mot « Dieu ».
- issue: Rapport temporel entre le futur ἐπιθύσομεν et ἀπὸ ἡμερῶν
  choice: Conserver le futur « nous lui offrirons » et rendre le point de départ par « depuis l’époque de », avec une note signalant la difficulté.
  alternative: 'Employer le présent ou un passé composé à valeur durative : « nous lui offrons / avons offert des sacrifices depuis l’époque de ».'
  rationale: La forme grecque transmise est un futur indicatif. La combinaison avec une expression signifiant normalement « depuis » est toutefois inhabituelle; la traduction ne corrige donc pas silencieusement cette tension.
translation_notes:
  register: Français international actuel, clair et digne. La syntaxe conserve la tension temporelle du grec plutôt que de la résoudre sans indication. Les termes cultuels restent précis, et le discours des locuteurs est rapporté sans validation ni mise en doute théologique.
