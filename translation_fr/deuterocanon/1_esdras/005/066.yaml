  verdict: revise
  source_fidelity: 'Le texte rend fidèlement les éléments grecs principaux : la comparaison (ὁμοίως), « votre Seigneur », le futur sacrificiel, la forme grecque Asbakaphath, « roi des Assyriens » et le déplacement vers « ici ». Toutefois, « offrirons ... depuis l’époque de » est une combinaison peu recevable en français avec un futur. Le grec lui-même présente une tension entre le futur ἐπιθύσομεν et ἀπὸ ἡμερῶν ; il convient de la conserver sans la lisser, mais avec une formulation française qui exprime plus explicitement un point de départ.'
  naturalness: Le registre est clair et actuel. « À partir des jours d’Asbakaphath » est plus idiomatique que « depuis l’époque d’Asbakaphath » après un futur, tout en maintenant l’étrangeté temporelle provenant du grec. « Nous a amenés ici » est plus naturel que « nous a transférés ici » et demeure sémantiquement assez large ; la note conserve la nuance de déplacement collectif.
  terminology: « Seigneur » rend κύριος sans ajouter « Dieu ». « Offrir des sacrifices » rend précisément le verbe cultuel ἐπιθύω. Asbakaphath doit rester dans le texte principal, l’identification à Ésar-Haddon relevant de la note.
