  rationale: La révision conserve le futur grec, y compris sa tension avec l’expression temporelle, mais remplace « depuis » par « à partir des jours de », formulation française compatible avec un futur et proche de ἀπὸ ἡμερῶν. Elle remplace aussi « transférés » par « amenés », plus naturel et moins administratif, sans atténuer la possible réinstallation impériale signalée en note.
