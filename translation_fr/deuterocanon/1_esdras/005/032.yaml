base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/032.yaml
  text: the sons of Dedda[a], the sons of Bachous, the sons of Serar, the sons of Thomthei, the sons of Nasei[b], the sons of Hatepha.
translation:
  language: fr
  text: les descendants de Dedda[a], les descendants de Bachous, les descendants de Serar, les descendants de Thomtheï, les descendants de Naseï[b], les descendants de Hatepha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec énumère ici six familles — Dedda, Bachous, Serar, Thomtheï, Naseï et Hatepha — tandis que le parallèle hébreu approximatif donne trois autres noms : Lebana, Hagaba et Akkoub. La traduction suit le grec sans l’harmoniser avec l’hébreu.'
    reason: alternative_reading
  - marker: b
    text: Plusieurs noms de ce verset sont rares et peuvent refléter des variations de transmission ou de translittération. Ils sont rendus ici avec prudence d’après le texte grec fourni.
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ
  choice: les descendants de
  rationale: Dans cette liste de recensement, le terme désigne des groupes familiaux ou claniques, et non nécessairement des fils au sens biologique immédiat. « Les descendants de » exprime naturellement cette portée en français moderne tout en conservant la structure répétitive du grec.
- source_word: Δεδδά
  choice: Dedda
  rationale: Translittération directe du nom grec, témoin principal. La leçon différente du parallèle hébreu approximatif n’est pas introduite dans le texte.
- source_word: Βαχούς
  choice: Bachous
  rationale: Translittération française proche de la forme grecque, sans harmonisation avec le nom différent du parallèle hébreu.
- source_word: Σεράρ
  choice: Serar
  rationale: Le nom est conservé selon le grec fourni, malgré la divergence de la liste hébraïque approximativement parallèle.
- source_word: Θόμθει
  choice: Thomtheï
  rationale: Translittération prudente de la forme grecque rare; le tréma aide le lecteur français à distinguer les voyelles finales.
- source_word: Νασεί
  choice: Naseï
  rationale: Translittération directe; le tréma indique en français que les voyelles finales ne forment pas une graphie vocalique ordinaire.
- source_word: Ἁτεφά
  choice: Hatepha
  rationale: La translittération conserve le h correspondant à l’esprit rude du grec et rend φ par « ph », sans normalisation conjecturale.
