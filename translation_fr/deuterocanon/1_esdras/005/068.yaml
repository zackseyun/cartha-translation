base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/068.yaml
  text: For we alone will build for the Lord of Israel[a], in accordance with what Cyrus king of the Persians commanded us.
translation:
  language: fr
  text: Car nous seuls construirons pour le Seigneur d’Israël, conformément à ce que nous a ordonné Cyrus, roi des Perses.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡμεῖς γὰρ μόνοι
  choice: Car nous seuls
  rationale: Le pronom explicite et μόνοι marquent ensemble l’exclusivité; « nous seuls » la rend naturellement. γάρ introduit la raison du refus.
- source_word: οἰκοδομήσομεν
  choice: construirons
  rationale: Le futur de οἰκοδομέω signifie simplement « construire ». Le contexte concerne une reconstruction, mais ce complément de sens n’est pas explicite dans le verbe grec.
- source_word: τῷ κυρίῳ τοῦ Ἰσραήλ
  choice: pour le Seigneur d’Israël
  rationale: Le datif indique ici le bénéficiaire ou la dédicace de la construction. « Seigneur » convient au titre divin κύριος, et le génitif est conservé par « d’Israël ».
- source_word: ἀκολούθως οἷς προσέταξεν ἡμῖν
  choice: conformément à ce que nous a ordonné
  rationale: Cette formulation française rend l’idée de conformité portée par ἀκολούθως et le relatif pluriel neutre οἷς sans lourdeur.
- source_word: Κῦρος ὁ βασιλεὺς Περσῶν
  choice: Cyrus, roi des Perses
  rationale: Le pluriel ethnique Περσῶν désigne les Perses, et non directement le territoire de la Perse. L’apposition avec virgules est naturelle en français.
theological_decisions:
- issue: Traduction de κύριος comme titre divin dans la Septante
  choice: Seigneur
  alternative: Maître
  rationale: Dans l’expression « le Seigneur d’Israël », κύριος fonctionne comme un titre divin; « Seigneur » en préserve l’usage biblique sans ajouter d’interprétation confessionnelle.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec tout en évitant un calque lourd. Aucun appel de note n’est requis.
