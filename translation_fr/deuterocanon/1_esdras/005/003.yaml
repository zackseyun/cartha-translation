  text: with tambourines and flutes[a]. And all their brothers were playing[b], and he made them go up with those men.
translation:
  language: fr
  text: avec des tambourins et des flûtes[a]. Tous leurs frères jouaient[b], et il les fit monter avec ceux-là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « instruments à anche ». Le grec αὐλῶν peut désigner plus largement des tuyaux ou d’autres instruments à vent, souvent munis d’une anche.
    reason: lexical_alternative
  - marker: b
    text: Le grec est abrupt et dépend ici du contexte. Le verbe peut aussi évoquer une prestation festive ou la danse; « ceux-là » traduit le démonstratif ἐκείνων, dont le référent doit être compris d’après le récit environnant.
    reason: alternative_reading
lexical_decisions:
- source_word: τυμπάνων
  choice: tambourins
  rationale: Le terme désigne des instruments à percussion tenus à la main; « tambourins » est naturel en français moderne et convient au contexte festif.
- source_word: αὐλῶν
  choice: flûtes
  rationale: αὐλός désigne un instrument à vent, souvent à anche; « flûtes » est immédiatement compréhensible, tandis que la note conserve la portée plus large du grec.
- source_word: ἀδελφοὶ
  choice: frères
  rationale: Le grec emploie un pluriel masculin explicite; « frères » en conserve la forme sans imposer une relation plus précise.
- source_word: παίζοντες
  choice: jouaient
  rationale: παίζω peut évoquer le jeu, la danse ou une prestation festive. Dans le voisinage immédiat d’instruments, « jouaient » garde le sens musical probable sans préciser quels instruments ils jouaient.
- source_word: ἐποίησεν ... συναναβῆναι
  choice: il les fit monter avec
  rationale: La construction est causative. « fit monter » rend directement cette valeur, et « avec » conserve l’idée d’accompagnement portée par συν-.
- source_word: μετʼ ἐκείνων
  choice: avec ceux-là
  rationale: « Ceux-là » préserve la force démonstrative distale de ἐκείνων sans ajouter au texte grec un nom tel que « hommes ».
