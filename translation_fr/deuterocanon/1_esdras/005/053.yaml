revisions:
- from: Ils donnèrent de l’argent aux tailleurs de pierre et aux charpentiers, ainsi que des boissons, de la nourriture et des provisions[a] aux Sidoniens et aux Tyriens, afin qu’ils fassent venir du Liban des pièces de bois de cèdre et les transportent sur des radeaux jusqu’au port de Joppé, conformément au décret écrit que Cyrus, roi des Perses, leur avait accordé.
  to: Ils donnèrent de l’argent aux tailleurs de pierre et aux charpentiers, ainsi que des boissons, de la nourriture et des provisions[a] aux Sidoniens et aux Tyriens, afin qu’ils acheminent du Liban du bois de cèdre, en le transportant sur des radeaux jusqu’au port de Joppé, conformément au décret écrit que Cyrus, roi des Perses, leur avait donné.
  rationale: La révision conserve l’interprétation prudente de χάρα par « provisions » et son ancrage de note. Elle rend plus directement l’action d’acheminer le bois et formule la note de manière à ne pas importer silencieusement dans le grec le produit spécifié par le parallèle.
