base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/053.yaml
  text: And they gave silver to the stonecutters and carpenters[a], and drink and food and provisions to the Sidonians and Tyrians, to bring cedar logs from Lebanon, transporting them by rafts to the harbor of Joppa, according to the written decree given to them by Cyrus king of the Persians.
translation:
  language: fr
  text: Ils donnèrent de l’argent aux tailleurs de pierre et aux charpentiers, ainsi que des boissons, de la nourriture et des provisions[a] aux Sidoniens et aux Tyriens, afin qu’ils acheminent du Liban du bois de cèdre, en le transportant sur des radeaux jusqu’au port de Joppé, conformément au décret écrit que Cyrus, roi des Perses, leur avait donné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « provisions » est difficile ici ; le passage parallèle d’Esdras 3.7 mentionne de l’huile.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργύριον
  choice: argent
  rationale: Le grec désigne littéralement l’argent métal, employé ici comme moyen de paiement; « argent » conserve naturellement les deux nuances en français.
- source_word: λατόμοις
  choice: tailleurs de pierre
  rationale: Le terme désigne ceux qui extraient ou taillent la pierre; cette expression est claire sans les assimiler plus largement à des maçons.
- source_word: τέκτοσι
  choice: charpentiers
  rationale: Dans le contexte de la construction du temple et en parallèle avec les travailleurs de la pierre, le mot désigne naturellement des artisans du bois.
- source_word: ποτὰ καὶ βρωτὰ
  choice: des boissons, de la nourriture
  rationale: Ces équivalents rendent directement les choses à boire et à manger, dans un français courant.
- source_word: χάρα
  choice: provisions
  rationale: La forme transmise est difficile dans ce contexte. « Provisions » conserve le sens probable d’une fourniture pratique sans introduire dans le texte principal l’« huile » précisée par le parallèle d’Esdras 3.7.
- source_word: παράγειν αὐτοὺς
  choice: afin qu’ils fassent venir
  rationale: Le pronom renvoie naturellement aux Sidoniens et aux Tyriens; la tournure causative française exprime le transport du bois depuis le Liban.
- source_word: ξύλα κέδρινα
  choice: des pièces de bois de cèdre
  rationale: Le grec parle de bois de cèdre destiné à la construction. Cette formulation concrète évite de préciser indûment s’il s’agit encore de troncs bruts ou déjà de bois équarri.
- source_word: διαφέρειν σχεδίαις
  choice: les transportent sur des radeaux
  rationale: La formulation rend à la fois le déplacement du bois et le moyen de transport indiqué par le grec.
- source_word: Ἰόππης λιμένα
  choice: port de Joppé
  rationale: « Port » est l’équivalent français naturel de λιμήν; « Joppé » est la forme française traditionnelle et intelligible du toponyme.
- source_word: πρόσταγμα τὸ γραφέν
  choice: décret écrit
  rationale: πρόσταγμα désigne ici un ordre royal officiel, et le participe souligne qu’il avait été mis par écrit.
- source_word: παρὰ Κύρου
  choice: que Cyrus ... leur avait accordé
  rationale: παρά avec le génitif indique la provenance du décret. « Accordé » convient à une autorisation royale, tout en évitant la lourdeur de « venant de Cyrus ».
theological_decisions:
- issue: Rapport entre le texte grec et le parallèle hébreu d’Esdras 3.7
  choice: Prendre le grec comme texte principal et traduire prudemment χάρα par « provisions », avec une note signalant l’« huile » du parallèle.
  alternative: Introduire directement « huile » dans le texte principal, ou rendre littéralement la forme grecque par un terme contextuellement obscur comme « joie ».
  rationale: La primauté revient au témoin grec de 1 Esdras. Le parallèle hébreu éclaire probablement une forme grecque difficile, mais ne justifie pas de remplacer silencieusement celle-ci par un produit précis absent du texte transmis.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve la longue coordination du grec tout en clarifiant les rapports syntaxiques. Le marqueur [a] figure immédiatement après le terme concerné.
