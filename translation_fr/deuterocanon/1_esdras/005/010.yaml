lexical_decisions:
- source_word: υἱοὶ
  choice: les fils de
  rationale: Dans cette liste de recensement, la formule grecque désigne les membres ou descendants d’un groupe familial. « Les fils de » en conserve la forme généalogique sans l’élargir explicitement.
- source_word: Ἀρές
  choice: Arès
  rationale: Le nom propre est directement translittéré d’après le témoin grec principal, avec l’accent usuel en français. Le parallèle massorétique étant très différent à cet endroit, il ne doit pas remplacer la leçon grecque.
- source_word: ἑπτακόσιοι πεντήκοντα ἕξ
  choice: sept cent cinquante-six
  rationale: Cette formulation française restitue exactement le total grec de 756. « Cent » reste invariable puisqu’il est suivi d’un autre nombre.
theological_decisions:
- issue: Choix entre le témoin grec et le parallèle massorétique divergent dans la liste de recensement
  choice: 'Conserver le nom de clan et le nombre du grec : « Arès… sept cent cinquante-six »'
  alternative: Suivre le parallèle massorétique, qui donnerait une autre désignation familiale et un autre total
  rationale: Pour 1 Esdras, le grec constitue ici la source principale. Le parallèle massorétique fourni n’est qu’approximatif et diverge matériellement; la différence est donc signalée plutôt qu’harmonisée.
translation_notes:
  register: Formulation brève et digne, adaptée au style d’une liste de recensement. Le deux-points rend naturellement en français l’ellipse entre le nom du groupe et son effectif.
