base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/058.yaml
  text: And they cried out with hymns[a], blessing the Lord, because his goodness and his glory are forever for all Israel.
translation:
  language: fr
  text: Et ils élevèrent la voix en chantant des hymnes[a] et en bénissant le Seigneur, car sa bonté et sa gloire sont à jamais pour tout Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils proclamèrent par des hymnes, en bénissant le Seigneur, car sa bonté et sa gloire demeurent éternellement pour tout Israël ». La proposition grecque est condensée et permet plusieurs développements naturels en français.'
    reason: Le grec est elliptique, tant pour la relation de δι’ ὕμνων au verbe que pour le verbe sous-entendu et la valeur du datif παντὶ Ἰσραήλ.
lexical_decisions:
- source_word: ἐφώνησαν
  choice: ils élevèrent la voix
  rationale: Le verbe indique une expression publique à voix forte. Cette tournure française conserve cette force sans imposer l’idée plus précise d’un cri.
- source_word: δι’ ὕμνων
  choice: en chantant des hymnes
  rationale: διά avec le génitif exprime ici le moyen. En contexte liturgique, cette formulation est naturelle en français et explicite sobrement que les hymnes sont chantés.
- source_word: εὐλογοῦντες
  choice: en bénissant
  rationale: Rend directement le participe grec tout en maintenant son lien circonstanciel avec le verbe principal.
- source_word: τῷ κυρίῳ
  choice: le Seigneur
  rationale: Rendu usuel et fidèle de κύριος dans ce texte grec liturgique.
- source_word: χρηστότης
  choice: bonté
  rationale: Le terme désigne la qualité bienfaisante du Seigneur; « bonté » en garde l’étendue sémantique.
- source_word: δόξα
  choice: gloire
  rationale: Équivalent biblique courant qui convient à la formule de louange.
- source_word: εἰς τοὺς αἰῶνας
  choice: sont pour toujours
  rationale: Le grec est elliptique et n’exprime pas de verbe. La copule ajoutée est minimale, tandis que « pour toujours » conserve la valeur durative sans introduire explicitement « demeure » ou « dure ».
- source_word: παντὶ Ἰσραήλ
  choice: en faveur de tout Israël
  rationale: Le datif est comprimé et peut marquer le bénéficiaire ou la relation. Cette formulation donne un français intelligible tout en laissant la note signaler l’autre expansion naturelle.
theological_decisions:
- issue: Rendu de κύριος dans un contexte liturgique grec deutérocanonique
  choice: le Seigneur
  alternative: le SEIGNEUR
  rationale: La source immédiate porte κύριος et non le tétragramme hébreu; « le Seigneur » reste donc le rendu le plus directement fondé sur le grec.
- issue: Expansion de la proposition elliptique ὅτι ἡ χρηστότης αὐτοῦ καὶ ἡ δόξα εἰς τοὺς αἰῶνας παντὶ Ἰσραήλ
  choice: car sa bonté et sa gloire sont pour toujours en faveur de tout Israël
  alternative: car sa bonté et sa gloire demeurent éternellement pour tout Israël
  rationale: Le choix fournit seulement la copule requise en français et évite de trancher silencieusement l’ellipse grecque en ajoutant un verbe plus déterminé comme « demeurer ».
translation_notes:
  register: Français international moderne, digne et liturgique sans archaïsmes. « Élevèrent la voix » préserve l’intensité de ἐφώνησαν; « en chantant des hymnes » rend le moyen de façon idiomatique. La note conserve l’ambiguïté réelle de la clause finale.
