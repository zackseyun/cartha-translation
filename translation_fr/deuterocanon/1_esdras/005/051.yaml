base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/051.yaml
  text: And after these[a], the regular offerings[b], and the sacrifices for Sabbaths and new moons and all the consecrated feasts.
translation:
  language: fr
  text: Après cela, les offrandes régulières[a][b], ainsi que les sacrifices pour les sabbats, les nouvelles lunes et toutes les fêtes sacrées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « offrandes continuelles ». Le terme grec peut désigner ce qui se poursuit constamment ou ce qui revient régulièrement selon un ordre fixé.
    reason: lexical_alternative
  - marker: b
    text: Le passage parallèle d’Esdras 3.4 insiste sur l’holocauste offert « chaque jour », selon le nombre prescrit pour ce jour. Ici, 1 Esdras résume plus largement le calendrier des célébrations sacrées.
    reason: cross_reference
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Après cela
  rationale: Cette transition temporelle naturelle renvoie collectivement aux actes précédemment rapportés. En français, le singulier « cela » rend idiomatiquement le pluriel grec neutre ταῦτα.
- source_word: προσφορὰς
  choice: offrandes
  rationale: « Offrandes » est le terme cultuel moderne le plus naturel et conserve la portée générale du grec.
- source_word: ἐνδελεχισμοῦ
  choice: régulières
  rationale: Le mot exprime la continuité ou le retour prescrit des offrandes. « Régulières » convient au calendrier cultuel sans imposer l’idée d’un acte matériellement ininterrompu.
- source_word: θυσίας
  choice: sacrifices
  rationale: Ce choix préserve la distinction lexicale avec le terme plus général προσφοράς, « offrandes ».
- source_word: σαββάτων
  choice: sabbats
  rationale: Le pluriel grec désigne les observances récurrentes du sabbat; le pluriel français le conserve.
- source_word: νουμηνιῶν
  choice: nouvelles lunes
  rationale: Expression biblique claire pour les célébrations mensuelles liées au commencement du mois.
- source_word: ἑορτῶν πασῶν ἡγιασμένων
  choice: toutes les fêtes consacrées
  rationale: Le participe grec présente ces fêtes comme mises à part pour le culte. « Consacrées » en garde la nuance cultuelle.
theological_decisions:
- issue: Terminologie du calendrier cultuel dans le texte grec de 1 Esdras, face au parallèle hébreu approximatif
  choice: 'Suivre la liste plus générale du grec : offrandes régulières, sacrifices des sabbats, des nouvelles lunes et des fêtes consacrées.'
  alternative: Harmoniser avec Esdras 3.4 en parlant explicitement de l’holocauste offert chaque jour selon le nombre prescrit.
  rationale: Le grec est ici le témoin principal et formule un résumé plus large du calendrier sacré. Le parallèle massorétique éclaire la régularité des offrandes, mais ne doit pas remplacer ni restreindre la formulation grecque.
translation_notes:
  register: Français international actuel, sobre et digne. La construction nominale elliptique du grec est conservée plutôt que complétée par un verbe absent du texte. « Sabbats » et « nouvelles lunes » maintiennent le vocabulaire biblique traditionnel tout en restant compréhensibles.
