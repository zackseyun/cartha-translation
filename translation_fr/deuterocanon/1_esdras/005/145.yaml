  yaml_path: translation/deuterocanon/1_esdras/005/145.yaml
  text: And Jeshua son of Josedec arose[a], with his brothers the priests, and Zerubbabel son of Salathiel, with his brothers, and they prepared the altar of the God of Israel[b],
translation:
  language: fr
  text: Josué[a], fils de Josédek, se leva. Lui, ses frères les prêtres, Zorobabel, fils de Salathiel[b], et les frères de ce dernier préparèrent l’autel du Dieu d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte Ἰησοῦς, forme du nom qui peut aussi être rendue par « Jésus » selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Le grec porte Σαλαθιήλ ; la forme issue de l’hébreu est souvent rendue par « Shéaltiel ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καταστὰς
  choice: se leva
  rationale: Le participe aoriste introduit l’entrée en action décidée de Josué. « Se leva » est naturel en français et conserve le mouvement narratif sans préciser davantage la nature de l’action.
- source_word: Ἰησοῦς
  choice: Josué
  rationale: Dans ce contexte postexilique, il s’agit du grand prêtre couramment appelé Josué en français. Une note signale que la forme grecque est également celle qui est traduite par « Jésus » dans d’autres contextes.
- source_word: ὁ τοῦ Ἰωσεδὲκ
  choice: fils de Josédek
  rationale: La tournure grecque d’ascendance, littéralement « celui de Josédek », s’exprime naturellement en français par « fils de Josédek ».
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: ses frères
  rationale: Cette traduction garde le terme familial masculin employé par le grec, sans l’élargir implicitement à des compatriotes ou à des collègues.
- source_word: οἱ ἱερεῖς
  choice: les prêtres
  rationale: L’apposition identifie les frères de Josué comme prêtres.
- source_word: Ζοροβαβὲλ
  choice: Zorobabel
  rationale: Forme française traditionnelle et reconnaissable du nom de ce dirigeant postexilique.
- source_word: ὁ τοῦ Σαλαθιὴλ
  choice: fils de Salathiel
  rationale: La filiation est explicitée selon l’usage naturel du français, et « Salathiel » représente directement la forme grecque du témoin traduit.
- source_word: ἡτοίμασαν
  choice: préparèrent
  rationale: Le verbe signifie « préparer » ou « rendre prêt ». Ce choix demeure général et n’impose pas l’idée plus précise de construire ou de dresser l’autel.
- source_word: τὸ θυσιαστήριον
  choice: l’autel
  rationale: Équivalent français usuel de θυσιαστήριον; le contexte rend inutile l’ajout de « sacrificiel ».
- source_word: τοῦ θεοῦ Ἰσραήλ
  choice: du Dieu d’Israël
  rationale: Le génitif marque naturellement l’appartenance ou la consécration de l’autel au Dieu d’Israël.
theological_decisions:
- issue: Portée du terme familial ἀδελφοί dans un contexte sacerdotal et communautaire
  choice: frères
  alternative: parents; compagnons; compatriotes
  rationale: Le grec emploie explicitement le terme familial masculin. « Frères » préserve cette formulation et la possibilité qu’il désigne des hommes du même groupe familial ou sacerdotal, sans trancher plus précisément.
- issue: Forme française du nom Ἰησοῦς dans ce contexte postexilique
  choice: Josué
  alternative: Jésus; Yéchoua
  rationale: Le référent historique est le grand prêtre généralement appelé Josué en français. Ce choix évite une confusion anachronique avec Jésus de Nazareth, tandis que la note conserve l’information selon laquelle la forme grecque est identique.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase grecque est divisée en deux phrases françaises pour clarifier que le verbe au singulier « se leva » se rapporte à Josué, tandis que « préparèrent » a pour sujet l’ensemble des hommes nommés. Les noms propres suivent les formes françaises bibliques usuelles, avec notes lorsque la forme grecque présente une autre possibilité de rendu.
