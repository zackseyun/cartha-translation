lexical_decisions:
- source_word: υἱοὶ
  choice: les descendants de
  rationale: Dans cette liste de recensement, le terme désigne les membres d’une famille ou d’un clan issu de l’ancêtre nommé. « Les descendants de » exprime ce sens naturellement en français moderne.
- source_word: Ἀννείς
  choice: Anneïs
  rationale: Le nom propre est translittéré d’après le grec, sans l’harmoniser avec le parallèle hébreu approximatif.
- source_word: ἑκατὸν εἷς
  choice: cent un
  rationale: Rendu direct du nombre cardinal grec.
- source_word: Ἀρόμ
  choice: Arom
  rationale: Translittération directe de la forme grecque, conservée malgré l’écart avec la tradition hébraïque parallèle.
- source_word: Βασσαί
  choice: Bassaï
  rationale: Translittération française de Βασσαί. Le nombre qui suit peut grammaticalement porter sur le groupe constitué des descendants d’Arom et de Bassaï.
- source_word: τριακόσιοι εἴκοσι τρεῖς
  choice: trois cent vingt-trois
  rationale: Rendu direct du nombre cardinal grec, selon l’usage orthographique français traditionnel.
- source_word: Ἀρσειφουρείθ
  choice: Arseïphoureïth
  rationale: Translittération proche du témoin grec, dont la forme est incertaine; une possible correspondance hébraïque est signalée en note.
