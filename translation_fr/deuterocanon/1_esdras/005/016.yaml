translation_notes:
  register: Français international moderne, naturel et digne. « Descendants » convient mieux que « fils » au contexte clanique. La coordination grecque entre Arom et Bassaï est conservée sans ajouter un nombre absent après Arom; la ponctuation française rend le nombre commun au groupe, tout en laissant subsister la difficulté de la liste.
