  text: the sons of Anneis[a], one hundred one; the sons of Arom, the sons of Bassai, three hundred twenty-three; the sons of Arseiphoureith[b],
translation:
  language: fr
  text: les descendants d’Anneïs[a], cent un ; les descendants d’Arom ; les descendants de Bassaï, trois cent vingt-trois ; les descendants d’Arseïphoureïth[b],
