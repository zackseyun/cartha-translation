lexical_decisions:
- source_word: οἱ θυρωροί
  choice: les gardiens des portes
  rationale: θυρωρός désigne celui qui garde une porte ou une entrée. « Gardiens des portes » exprime clairement en français moderne la fonction institutionnelle évoquée dans cette liste.
- source_word: τετρακόσιοι
  choice: quatre cents
  rationale: Nombre cardinal se rapportant au groupe qui précède.
- source_word: οἱ Ἰσμαήλου
  choice: les descendants d’Ismaël
  rationale: L’expression génitivale signifie littéralement « ceux d’Ismaël ». Dans une liste généalogique, « les descendants d’Ismaël » est naturel et évite de répéter « fils » avant l’apposition suivante.
- source_word: υἱοὶ Λακουβάτου
  choice: fils de Lakoubatos
  rationale: υἱοί signifie explicitement « fils ». La forme française « Lakoubatos » restitue le nom grec sous sa forme nominative probable, sans l’harmoniser avec des noms rencontrés dans des listes parallèles.
- source_word: χίλιοι
  choice: mille
  rationale: Nombre cardinal rattaché au groupe familial qui le précède immédiatement.
