  text: the sons of the temple singers[a], the sons of Asaph, one hundred twenty-eight.
translation:
  language: fr
  text: 'Les fils des chanteurs du Temple[a], les fils d’Asaph : cent vingt-huit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chantres sacrés ». Le terme grec désigne des chanteurs attachés au culte du Temple.
    reason: Alternative lexicale et précision du cadre cultuel.
lexical_decisions:
- source_word: υἱοὶ
  choice: les fils de
  rationale: Formule généalogique propre à une liste de recensement; « fils de » conserve le registre et évite de préciser de manière interprétative « descendants ».
- source_word: ἱεροψάλται
  choice: chantres du Temple
  rationale: Le composé grec désigne des chanteurs attachés au culte sacré; « chantres du Temple » est naturel, digne et explicite en français moderne.
- source_word: υἱοὶ Ἀσάφ
  choice: les fils d’Asaph
  rationale: La répétition de « fils » reflète celle du grec et présente le groupe des chantres selon sa lignée ancestrale.
- source_word: ἑκατὸν εἴκοσι ὀκτώ
  choice: cent vingt-huit
  rationale: Rendu cardinal courant en français moderne.
