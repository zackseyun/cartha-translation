base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/007.yaml
  text: These are the ones from Judea who came up from the captivity of the exile[a], whom Nebuchadnezzar king of Babylon had carried away to Babylon[b],
translation:
  language: fr
  text: Voici ceux de Judée qui remontèrent de la captivité de l’exil[a], ceux que Nabuchodonosor, roi de Babylone, avait déportés à Babylone[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu parallèle d’Esdras 2.1 porte « les fils de la province » au lieu de « ceux de Judée ». La présente traduction suit le texte grec de 1 Esdras comme source principale.
    reason: alternative_reading
  - marker: b
    text: 'Ou : « ceux que Nabuchodonosor, roi de Babylone, avait emmenés pour les établir à Babylone ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσὶν δὲ οὗτοι
  choice: Voici ceux
  rationale: Introduit naturellement une liste en français; δέ a ici une faible valeur connective qui n’exige pas un « mais » explicite.
- source_word: οἱ ἐκ τῆς Ἰουδαίας
  choice: ceux de Judée
  rationale: Suit le grec, qui nomme explicitement la Judée, plutôt que la formulation différente du parallèle hébreu.
- source_word: οἱ ἀναβάντες
  choice: qui remontèrent
  rationale: Préserve l’image conventionnelle de la montée vers le pays et Jérusalem, sans réduire le verbe au simple sens de « revenir ».
- source_word: ἐκ τῆς αἰχμαλωσίας τῆς παροικίας
  choice: de la captivité de l’exil
  rationale: Conserve la construction redoublée et formelle du grec; παροικία désigne ici la condition de séjour en terre étrangère, donc l’exil.
- source_word: οὓς μετῴκισεν
  choice: ceux que … avait déportés
  rationale: « Déporter » exprime clairement le déplacement forcé et la réinstallation impliqués par μετοικίζω; le plus-que-parfait marque l’antériorité.
- source_word: Ναβουχοδονοσὸρ
  choice: Nabuchodonosor
  rationale: Forme française traditionnelle et largement reconnue du nom du roi.
- source_word: βασιλεὺς Βαβυλῶνος
  choice: roi de Babylone
  rationale: Rendu français idiomatique du titre, défini par le contexte malgré l’absence d’article grec.
- source_word: εἰς Βαβυλῶνα
  choice: à Babylone
  rationale: Exprime simplement la destination indiquée par εἰς.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Voici » convient à l’ouverture d’une liste; « remontèrent » garde l’idiome géographique ancien sans lourdeur excessive. La virgule finale est maintenue puisque le verset se poursuit syntaxiquement dans le contexte.
