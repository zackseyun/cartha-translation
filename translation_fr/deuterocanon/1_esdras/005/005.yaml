base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/005.yaml
  text: 'The priests[a], the sons of Phinehas, the sons of Aaron: Jeshua son of Jozadak son of Seraiah, and Joakim son of Zerubbabel son of Shealtiel, from the house of David, from the family line of Perez[b],'
translation:
  language: fr
  text: 'Les prêtres, descendants[a] de Phinéès, descendants d’Aaron : Josué[b], fils de Josadak, fils de Séraïas, et Joakim, fils de Zorobabel, fils de Salathiel, de la maison de David et de la lignée de Pharès,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « fils de ». Dans une généalogie, cette expression peut désigner des descendants, et non seulement des fils immédiats.
    reason: lexical_alternative
  - marker: b
    text: Le nom grec Ἰησοῦς peut aussi être transcrit « Jésus »; « Josué » est ici la forme française habituelle du nom de ce grand prêtre postexilique.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἱερεῖς
  choice: Les prêtres
  rationale: Le pluriel défini sert d’introduction aux personnages de lignée sacerdotale nommés ensuite.
- source_word: υἱοὶ Φινεὲς υἱοὶ Ἀαρών
  choice: descendants de Phinéès, descendants d’Aaron
  rationale: Dans cette généalogie, υἱοί exprime l’appartenance à une lignée plutôt qu’une filiation immédiate; « descendants » évite une lecture biologique erronée.
- source_word: Ἰησοῦς
  choice: Josué
  rationale: En français biblique, « Josué » est la forme usuelle pour ce nom porté par le grand prêtre de l’époque postexilique; elle évite l’association spontanée avec Jésus de Nazareth.
- source_word: ὁ τοῦ Ἰωσεδὲκ τοῦ Σαραιοῦ
  choice: fils de Josadak, fils de Séraïas
  rationale: Les génitifs généalogiques elliptiques sont explicités naturellement par « fils de », sans nier d’éventuels raccourcis généalogiques.
- source_word: Ἰωακεὶμ
  choice: Joakim
  rationale: Cette forme française reste proche du grec et distingue ce personnage du roi généralement appelé Joïakim.
- source_word: ὁ τοῦ Ζοροβαβὲλ τοῦ Σαλαθιὴλ
  choice: fils de Zorobabel, fils de Salathiel
  rationale: La chaîne de génitifs est rendue comme une succession généalogique claire.
- source_word: ἐκ τοῦ οἴκου τοῦ Δαυείδ
  choice: de la maison de David
  rationale: « Maison de David » est l’expression française consacrée pour la famille ou dynastie davidique.
- source_word: ἐκ τῆς γενεᾶς Φάρες
  choice: de la lignée de Pharès
  rationale: γενεά désigne ici l’ascendance familiale, non une génération chronologique; « lignée » rend précisément ce sens.
theological_decisions:
- issue: Portée de la filiation généalogique
  choice: Employer « descendants » pour les groupes sacerdotaux, mais conserver « fils de » dans les chaînes nominales.
  alternative: Rendre uniformément υἱοί et les génitifs elliptiques par « fils de », ou tout uniformiser par « descendants de ».
  rationale: Cette distinction maintient la structure du grec tout en signalant que Phinéès et Aaron sont des ancêtres éloignés. Dans les chaînes individuelles, « fils de » conserve la formulation généalogique sans trancher la question d’éventuelles générations omises.
- issue: Forme française de Ἰησοῦς
  choice: Josué
  alternative: Jésus
  rationale: Le contexte identifie un grand prêtre postexilique. « Josué » est la convention française correspondant à ce personnage et ne crée pas d’identification christologique étrangère au passage.
translation_notes:
  register: Français moderne, digne et lisible. Les noms propres suivent des formes françaises bibliques courantes. La ponctuation conserve le caractère de liste généalogique et la virgule finale, puisque le verset se poursuit syntaxiquement.
