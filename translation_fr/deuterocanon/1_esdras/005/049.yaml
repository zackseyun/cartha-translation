base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/049.yaml
  text: And they gathered themselves to them from the other nations of the land[a], and they were strengthened at the altar in its place; for they were in hostility toward them. All the nations on the land prevailed against them, and they offered sacrifices at the appointed time, and whole burnt offerings to the Lord[c][b], morning and evening.
translation:
  language: fr
  text: Ils se joignirent à eux, venant des autres nations du pays[a], et ils furent affermis auprès de l’autel, à son emplacement, car ils leur étaient hostiles. Toutes les nations du pays eurent le dessus sur eux, et ils offrirent, au temps fixé, des sacrifices et des holocaustes[c] au Seigneur, matin et soir.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se rassemblèrent auprès d’eux ». Le verbe grec peut indiquer que des personnes venues des autres nations se sont attachées au groupe.
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec est ici plus développé que le parallèle hébreu approximatif d’Esdras 3.2 : il ajoute l’hostilité et la supériorité des nations du pays, ainsi que l’offrande régulière de sacrifices matin et soir.'
    reason: cross_reference
  - marker: c
    text: C’est-à-dire des offrandes entièrement consumées par le feu ; on peut aussi traduire « sacrifices entièrement brûlés ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνήχθησαν αὐτοῖς
  choice: ils se joignirent à eux
  rationale: Le moyen-passif peut exprimer le fait de se rassembler auprès d’un groupe ou de s’y joindre. « Se joignirent à eux » rend naturellement cette nuance sans imposer un passif strict.
- source_word: ἐκ τῶν ἄλλων ἐθνῶν τῆς γῆς
  choice: venant des autres nations du pays
  rationale: « Nations du pays » reste proche du grec et n’ajoute aucune précision géographique ou ethnique absente du texte.
- source_word: κατωρθώθησαν
  choice: ils s’affermirent
  rationale: Le verbe difficile peut évoquer le fait d’être affermi, établi ou mis en bonne position. « S’affermirent » conserve cette largeur de sens dans un contexte d’opposition.
- source_word: ἐπὶ τὸ θυσιαστήριον ἐπὶ τοῦ τόπου αὐτῶν
  choice: auprès de l’autel, à son emplacement
  rationale: La formulation garde l’accent locatif et comprend le second groupe comme une référence à l’emplacement de l’autel, sans reconstruire davantage une phrase grecque difficile.
- source_word: ἐν ἔχθρᾳ ἦσαν αὐτοῖς
  choice: ces nations leur étaient hostiles
  rationale: Le substantif ἔχθρα désigne l’hostilité ou l’inimitié. L’explicitation minimale « ces nations » clarifie en français l’antécédent probable sans ajouter la catégorie plus forte d’« ennemis ».
- source_word: κατίσχυσαν αὐτοὺς
  choice: eurent le dessus sur eux
  rationale: Cette expression française actuelle rend l’idée d’être plus fort que quelqu’un ou de prévaloir contre lui, tout en évitant le sens plus absolu d’« écraser ».
- source_word: κατὰ τὸν καιρὸν
  choice: aux temps fixés
  rationale: Le pluriel idiomatique français communique la régularité prescrite des sacrifices, développée ensuite par « matin et soir ».
- source_word: ὁλοκαυτώματα
  choice: holocaustes
  rationale: Dans le registre biblique français, « holocaustes » désigne avec précision les offrandes entièrement consumées par le feu; une note prévient le sens moderne dominant du mot hors contexte cultuel.
- source_word: Κυρίῳ
  choice: au Seigneur
  rationale: « Seigneur » est la traduction française usuelle et digne de κύριος dans ce contexte.
- source_word: τὸ πρωϊνὸν καὶ τὸ δειλινόν
  choice: matin et soir
  rationale: La formule concise et naturelle rend fidèlement la paire temporelle des sacrifices quotidiens.
theological_decisions:
- issue: Rapport entre le texte grec développé et le parallèle hébreu approximatif d’Esdras 3.2
  choice: Traduire intégralement le grec, y compris les mentions de l’hostilité, de la supériorité des nations et des sacrifices réguliers.
  alternative: Harmoniser le verset avec le parallèle hébreu plus court et omettre ou atténuer ces éléments.
  rationale: Pour 1 Esdras, le grec est le témoin source principal. Le parallèle hébreu sert de contrôle mais ne doit pas remplacer ni raccourcir la leçon grecque.
- issue: Identification des groupes dans une succession grecque de pronoms ambiguë
  choice: Conserver les pronoms pour les participants principaux, tout en précisant seulement « ces nations » à l’endroit où l’antécédent hostile est le plus probable.
  alternative: Nommer partout les rapatriés et les peuples étrangers, ou laisser tous les pronoms sans aucun éclaircissement.
  rationale: Ce choix produit un français compréhensible sans supprimer entièrement la tension du grec ni importer des catégories ethniques ou théologiques supplémentaires.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme coordonné du grec est conservé sans archaïsmes. « Holocaustes » est maintenu comme terme cultuel biblique précis et accompagné d’une note en raison de son sens moderne dominant.
