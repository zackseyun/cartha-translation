  naturalness: Le français est globalement fluide, moderne et d’un registre biblique accessible. « Au temps fixé » est plus proche du singulier grec tout en restant naturel. La formulation pronominale « ils leur étaient hostiles » est claire dans le flux de la phrase tout en évitant une clarification interprétative.
  terminology: « Nations du pays », « autel », « Seigneur » et « holocaustes » sont appropriés. La note sur « holocaustes » fournit utilement le sens cultuel précis du terme. La désignation ne doit pas recevoir de qualification ethnique ou théologique supplémentaire.
