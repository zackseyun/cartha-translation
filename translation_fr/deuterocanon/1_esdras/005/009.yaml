base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/009.yaml
  text: 'The number of those from the nation[a], and their leaders: the sons of Phoros[b], seventy-two thousand.'
translation:
  language: fr
  text: 'Nombre de ceux qui appartenaient au peuple et de leurs chefs : les fils de Phoros[a], soixante-douze mille[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « Phoros ». À cet endroit, la tradition parallèle des listes hébraïques présente un autre nom et un autre nombre ; le texte grec de 1 Esdras semble conserver une forme différente de la liste.
    reason: alternative_reading
  - marker: b
    text: Le grec porte « soixante-douze mille ». Ce chiffre exceptionnellement élevé diffère fortement de celui de la tradition massorétique approximativement parallèle et pourrait provenir d’une altération du texte ou d’une autre tradition de la liste.
    reason: textual_variant
lexical_decisions:
- source_word: ἀριθμὸς
  choice: Nombre
  rationale: Terme de dénombrement servant ici d’intitulé de liste. La formulation nominale conserve le style condensé du grec.
- source_word: τῶν ἀπὸ τοῦ ἔθνους
  choice: de ceux de la nation
  rationale: ἔθνος peut désigner une nation ou un peuple. Cette traduction reste proche de la formule grecque, malgré son caractère abrupt dans ce contexte de liste.
- source_word: οἱ προηγούμενοι αὐτῶν
  choice: leurs chefs
  rationale: Le participe désigne littéralement ceux qui vont devant; dans une liste administrative ou généalogique, il prend naturellement le sens de responsables ou de chefs.
- source_word: υἱοὶ
  choice: les fils de
  rationale: Formule biblique traditionnelle des listes généalogiques ou claniques; elle peut inclure les descendants ou les membres d’une lignée.
- source_word: Φορὸς
  choice: Phoros
  rationale: Translittération directe du nom propre transmis par le témoin grec principal, sans l’harmoniser avec les traditions parallèles.
- source_word: ἑβδομήκοντα δύο χιλιάδες
  choice: soixante-douze mille
  rationale: Sens explicite du texte grec conservé, bien que le chiffre soit exceptionnellement élevé et diverge fortement de la tradition hébraïque parallèle.
