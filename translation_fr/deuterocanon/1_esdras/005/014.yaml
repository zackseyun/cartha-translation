  text: the sons of Adonikam[a], thirty-seven; the sons of Bosai, two thousand six hundred six; the sons of Adilion, four hundred fifty-four;
translation:
  language: fr
  text: les fils d’Adonikam[a], trente-sept ; les fils de Bosaï, deux mille six cent six ; les fils d’Adilion, quatre cent cinquante-quatre ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « trente-sept » pour Adonikam ; le texte massorétique parallèle d’Esdras 2.13 porte « six cent soixante-six ».
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: les fils de
  rationale: Dans cette liste de recensement, la formule désigne les membres d’une lignée familiale. « Les fils de » conserve la structure généalogique du grec tout en restant naturelle en français biblique actuel.
- source_word: Ἀδωνεικάμ
  choice: Adonikam
  rationale: Translittération du nom propre grec, avec une graphie conforme à la forme sémitique parallèle et aisément lisible en français.
- source_word: τριάκοντα ἑπτά
  choice: trente-sept
  rationale: Rend exactement le nombre du texte grec, sans l’harmoniser avec le témoin massorétique parallèle.
- source_word: Βοσαί
  choice: Bosaï
  rationale: Translittération directe de la forme grecque, avec un tréma pour indiquer en français que les deux voyelles se prononcent séparément.
- source_word: δισχίλιοι ἑξακόσιοι ἕξ
  choice: deux mille six cent six
  rationale: Rendu exact du nombre grec selon l’usage orthographique français traditionnel des nombres composés.
- source_word: Ἀδειλίου
  choice: Adilion
  rationale: Le génitif grec est rendu comme nom de famille après « les fils de » ; la translittération préserve la forme propre à ce témoin sans reconstruction hébraïque conjecturale.
- source_word: τετρακόσιοι πεντήκοντα τέσσαρες
  choice: quatre cent cinquante-quatre
  rationale: Rendu exact et naturel du nombre cardinal grec.
theological_decisions:
- issue: Divergence importante entre le nombre du texte grec de 1 Esdras et celui de la tradition massorétique parallèle
  choice: Conserver « trente-sept », selon le grec
  alternative: Harmoniser avec « six cent soixante-six », selon le parallèle massorétique d’Esdras/Néhémie
  rationale: Le grec de 1 Esdras est ici le texte source principal. La divergence textuelle est signalée en note plutôt que résolue silencieusement.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « les fils de » et les nombres écrits en toutes lettres maintiennent le style formel d’une liste de recensement. Les noms propres suivent de près les formes grecques.
