  naturalness: La phrase est fluide et d’un registre moderne approprié. « Fête des Huttes » est l’appellation française courante et immédiatement intelligible pour cette fête; elle correspond bien à l’image de σκηνοπηγία.
  terminology: « Huttes » rend de façon plus établie et concrète le nom de la fête que « Tentes », tout en laissant « Tabernacles » comme appellation traditionnelle en note. « Loi » est recevable dans ce contexte pour le corpus légal.
