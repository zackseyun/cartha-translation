base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/050.yaml
  text: And they kept the Feast of Booths[a], as it is commanded in the law, and offered sacrifices day by day, as was fitting.
translation:
  language: fr
  text: Ils célébrèrent la fête des Huttes[a], comme cela est prescrit dans la Loi, et offrirent chaque jour des sacrifices, comme il se devait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon l’appellation traditionnelle : « fête des Tabernacles ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάγοσαν
  choice: ils célébrèrent
  rationale: Avec une fête pour complément, ἄγω signifie idiomatiquement la célébrer ou l’observer. « Célébrèrent » est naturel en français moderne.
- source_word: τὴν τῆς σκηνοπηγίας ἑορτήν
  choice: la fête des Tentes
  rationale: σκηνοπηγία désigne la fête liée à l’installation de huttes ou de tentes. « Fête des Tentes » conserve l’image concrète et reste immédiatement compréhensible; l’appellation traditionnelle figure en note.
- source_word: ὡς ἐπιτέτακται
  choice: comme cela est prescrit
  rationale: Le parfait passif exprime une prescription qui demeure en vigueur. Le présent français en restitue la portée durable.
- source_word: ἐν τῷ νόμῳ
  choice: dans la Loi
  rationale: La formule situe la prescription dans le corpus légal. La majuscule signale ici la Torah comme corpus reconnu, sans ajouter de précision absente du grec.
- source_word: θυσίας
  choice: les sacrifices
  rationale: θυσία désigne directement des sacrifices ou offrandes sacrificielles. L’article français rend la tournure naturelle dans ce contexte cultuel.
- source_word: καθ’ ἡμέραν
  choice: chaque jour
  rationale: Cette expression distributive marque la répétition quotidienne; « chaque jour » la rend clairement et naturellement.
- source_word: ὡς προσῆκον ἦν
  choice: qui convenaient
  rationale: La formule indique ce qui était approprié ou requis par les circonstances, sans nécessairement répéter l’idée explicite de commandement. La relative rattache naturellement cette qualification aux sacrifices.
theological_decisions:
- issue: Nom de la fête σκηνοπηγία
  choice: fête des Tentes
  alternative: fête des Tabernacles
  rationale: « Tentes » transmet plus directement l’image du grec en français courant. « Tabernacles », appellation traditionnelle et encore répandue, est conservé en note afin de permettre l’identification de la fête.
- issue: Portée de ὡς προσῆκον ἦν
  choice: les sacrifices qui convenaient
  alternative: des sacrifices, comme il se devait
  rationale: Le grec peut qualifier de manière générale ce qui était approprié sans préciser davantage la nature de l’obligation. La traduction conserve cette souplesse et n’en fait pas une seconde prescription légale explicite.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase suit étroitement le grec tout en évitant le calque; « célébrèrent » et « chaque jour » assurent une lecture naturelle. Le marqueur [a] est placé immédiatement après le nom de la fête.
