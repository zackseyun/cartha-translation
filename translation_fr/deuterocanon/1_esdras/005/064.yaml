base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/064.yaml
  text: And they recognized that those from the captivity were building the temple for the Lord God of Israel[a][b].
translation:
  language: fr
  text: Et ils reconnurent que les exilés construisaient le temple pour le Seigneur, Dieu d’Israël[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « ceux qui sont issus de la captivité ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « construisaient le temple au Seigneur, Dieu d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωσαν
  choice: reconnurent
  rationale: L’aoriste de ἐπιγινώσκω exprime ici le fait d’en venir à reconnaître clairement la situation. « Reconnurent » reste proche du grec sans développer davantage la manière dont ils l’ont su.
- source_word: οἱ ἐκ τῆς αἰχμαλωσίας
  choice: ceux qui revenaient de captivité
  rationale: Cette formulation naturelle désigne les déportés revenus au pays tout en conservant l’image grecque de la captivité. Le grec, témoin principal, gouverne ici plutôt que le parallèle massorétique non aligné.
- source_word: οἰκοδομοῦσιν
  choice: construisaient
  rationale: Le présent grec dans le discours indirect décrit une action en cours; l’imparfait français convient au cadre narratif introduit par l’aoriste « reconnurent ».
- source_word: τὸν ναόν
  choice: le temple
  rationale: Dans ce contexte de reconstruction, ναός désigne l’édifice du temple. « Temple » est le terme français courant et précis.
- source_word: τῷ κυρίῳ θεῷ Ἰσραήλ
  choice: pour le Seigneur, Dieu d’Israël
  rationale: Le datif peut indiquer le bénéficiaire ou la destination de la construction. « Pour » est idiomatique en français, tandis que « Seigneur » conserve l’usage biblique de κύριος.
theological_decisions:
- issue: Traduction de κύριος dans la désignation du Dieu d’Israël
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » est la désignation biblique française habituelle dans l’expression « Seigneur, Dieu d’Israël » et maintient la continuité avec l’usage de la Septante sans ajouter de particularité confessionnelle.
- issue: Valeur du datif τῷ κυρίῳ θεῷ Ἰσραήλ
  choice: pour le Seigneur, Dieu d’Israël
  alternative: au Seigneur, Dieu d’Israël
  rationale: Le datif admet les deux nuances. Le texte principal emploie le français le plus naturel pour exprimer que le temple est construit à l’intention de Dieu, et la note conserve l’autre lecture possible.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure proche du grec tout en évitant un calque peu naturel; les deux ambiguïtés lexicales signalées dans la couche de consultation anglaise sont conservées en notes.
