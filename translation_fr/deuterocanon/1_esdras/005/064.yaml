  verdict: revise
  source_fidelity: Le grec désigne « ceux qui sont issus de la captivité », c’est-à-dire les exilés/rapatriés, et non des personnes qui seraient alors en train de revenir. « Reconnurent », l’imparfait « construisaient », « le temple » et « pour le Seigneur, Dieu d’Israël » rendent fidèlement le texte et la valeur contextuelle du datif.
  naturalness: '« Ceux qui revenaient de captivité » est ambigu en français moderne : il peut décrire un retour en cours. « Les exilés » est plus naturel et, dans ce contexte, désigne clairement le groupe issu de la captivité. La note donne la formulation plus littérale.'
  terminology: « Seigneur, Dieu d’Israël » conserve la désignation biblique de κύριος θεὸς Ἰσραήλ sans surcharge confessionnelle. « Temple » convient à ναός. La préposition « pour » exprime naturellement la destination ou le bénéficiaire impliqué par le datif.
