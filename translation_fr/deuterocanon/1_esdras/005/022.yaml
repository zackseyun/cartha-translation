  text: the sons of Kalamokalos and Onous[a], seven hundred twenty-five; the sons of Jericho, two hundred forty-five;
translation:
  language: fr
  text: les fils de Kalamokalos et d’Onous[a], sept cent vingt-cinq ; les fils de Jéricho, deux cent quarante-cinq ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle hébreu dans la tradition d’Esdras-Néhémie diffère nettement ici et porte approximativement : « les hommes de Béthel et d’Aï, deux cent vingt-trois ». Le témoin grec de 1 Esdras conserve d’autres noms et d’autres nombres.'
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: les fils de
  rationale: Dans cette liste de recensement, la formule grecque désigne les membres ou descendants d’un groupe familial. « Les fils de » en préserve la structure généalogique traditionnelle tout en restant claire en français.
- source_word: Καλαμωκάλου
  choice: Kalamokalos
  rationale: Translittération du nom propre grec, sans harmonisation avec le témoin hébreu parallèle, qui diffère fortement ici.
- source_word: Ὠνούς
  choice: Onous
  rationale: Translittération directe de la forme grecque coordonnée à Kalamokalos. Le grec est le texte source principal.
- source_word: ἑπτακόσιοι εἴκοσι πέντε
  choice: sept cent vingt-cinq
  rationale: Rendu direct du nombre cardinal grec selon l’usage français moderne.
- source_word: Ἰερήχου
  choice: Jéricho
  rationale: Forme française usuelle du nom de lieu correspondant au grec Ἰερήχου.
- source_word: διακόσιοι τεσσεράκοντα πέντε
  choice: deux cent quarante-cinq
  rationale: Rendu direct du nombre cardinal grec selon l’usage français moderne.
theological_decisions:
- issue: Rapport entre le témoin grec et le parallèle approximatif du texte massorétique dans cette liste
  choice: 'Traduire tels quels les noms et les nombres du grec : « Kalamokalos et Onous… sept cent vingt-cinq » et « Jéricho… deux cent quarante-cinq ».'
  alternative: 'Harmoniser le verset avec le parallèle hébreu : « les hommes de Béthel et d’Aï, deux cent vingt-trois ».'
  rationale: Le texte grec de 1 Esdras constitue ici la source principale. La divergence importante du parallèle hébreu doit être signalée, non effacée par harmonisation.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe elliptique et répétitive d’une liste de recensement est conservée. Les noms grecs rares sont translittérés, tandis que Jéricho reçoit sa forme française consacrée.
