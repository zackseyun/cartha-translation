  register: Français international moderne, digne et accessible. La structure de liste et l’ellipse du grec sont préservées. Les noms propres sont translittérés d’après le témoin grec; l’accent d’Obbéia et le tréma implicite évité dans Iaddous privilégient une présentation française lisible sans substituer les formes d’autres traditions textuelles.
