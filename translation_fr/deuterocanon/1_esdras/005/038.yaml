base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/038.yaml
  text: 'And from the priests[a], those who claimed the priesthood, but were not found: the sons of Obbeia, the sons of Akbos, the sons of Iaddous, who had taken Augia as a wife from the daughters of Phaexeldai[b],'
translation:
  language: fr
  text: 'Parmi les prêtres[a], ceux qui revendiquaient la prêtrise, mais ne furent pas retrouvés : les fils d’Obbéia, les fils d’Akbos, les fils d’Iaddous, qui avait pris pour femme Augia, l’une des filles de Phaexeldaï[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est elliptique : « ne furent pas retrouvés » signifie probablement que leur inscription généalogique ou leur titre à la prêtrise ne fut pas retrouvé, comme dans le passage parallèle d’Esdras.'
    reason: lexical_alternative
  - marker: b
    text: Les noms propres diffèrent ici de ceux du parallèle approximatif du texte massorétique. La traduction suit le texte grec de 1 Esdras sans l’harmoniser avec Esdras ou Néhémie.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν ἱερέων
  choice: Parmi les prêtres
  rationale: En français, « parmi les prêtres » exprime naturellement l’appartenance de ce groupe à la classe sacerdotale marquée par ἐκ avec le génitif.
- source_word: οἱ ἐμποιούμενοι ἱερωσύνης
  choice: ceux qui revendiquaient la prêtrise
  rationale: Le participe indique qu’ils faisaient valoir un droit à la fonction sacerdotale. « Revendiquaient » conserve cette notion de prétention sans préjuger de sa légitimité.
- source_word: οὐχ εὑρέθησαν
  choice: ne furent pas retrouvés
  rationale: 'Cette formulation reste proche du passif grec et préserve son ellipse : le contexte peut viser les personnes dans un registre ou la preuve de leur filiation, sans que le texte l’explicite.'
- source_word: υἱοὶ Ὀββειά / υἱοὶ Ἀκβώς / υἱοὶ Ἰαδδοὺς
  choice: les fils d’Obbéia / les fils d’Akbos / les fils de Iaddous
  rationale: La formule généalogique « fils de » est conservée; elle peut désigner plus largement des descendants. Les noms suivent les formes grecques plutôt qu’une harmonisation avec un parallèle hébreu.
- source_word: τοῦ λαβόντος Αὐγίαν γυναῖκα
  choice: qui avait pris pour femme Augia
  rationale: L’expression grecque est un idiome matrimonial. Cette traduction en garde la forme tout en restant claire en français.
- source_word: τῶν θυγατέρων Φαηξελδαίου
  choice: l’une des filles de Phaexeldaï
  rationale: Le génitif partitif situe Augia parmi les filles de Phaexeldaï. L’ajout explicatif « l’une des » rend ce rapport naturel en français sans changer le sens.
