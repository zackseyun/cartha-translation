base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/063.yaml
  text: And when the enemies of the tribe of Judah and Benjamin heard[a], they came to find out what the sound of the trumpets was[b],
translation:
  language: fr
  text: Lorsque les ennemis de la tribu de Juda et de Benjamin[a] eurent entendu, ils vinrent pour savoir quel était le son des trompettes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte le singulier « la tribu » avec « Juda et Benjamin » ; on pourrait aussi traduire : « des tribus de Juda et de Benjamin ».'
    reason: alternative_reading
  - marker: b
    text: 'Plus littéralement : « la voix des trompettes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: quand … entendirent
  rationale: Le participe aoriste introduit la circonstance temporelle de l’action principale. Le grec n’exprime aucun complément d’objet; la formulation française le laisse également implicite.
- source_word: οἱ ἐχθροὶ
  choice: les ennemis
  rationale: Le nom désigne clairement des adversaires. Aucun possessif n’étant exprimé en grec, « les ennemis » reste au plus près du texte.
- source_word: τῆς φυλῆς Ἰούδα καὶ Βενιαμεὶν
  choice: de la tribu de Juda et de Benjamin
  rationale: Le grec emploie le singulier φυλῆς devant les deux noms. Le singulier est conservé dans le texte, malgré la possibilité naturelle de comprendre deux tribus.
- source_word: ἦλθοσαν
  choice: ils vinrent
  rationale: Le verbe de mouvement est rendu simplement, conformément à sa fonction narrative.
- source_word: ἐπιγνῶναι
  choice: découvrir
  rationale: 'L’infinitif exprime le but de leur venue: apprendre ou déterminer la nature du bruit entendu.'
- source_word: τίς ἡ φωνὴ τῶν σαλπίγγων
  choice: ce qu’était le son des trompettes
  rationale: φωνή désigne ici naturellement un son, tandis que σάλπιγγες renvoie à des trompettes. La tournure conserve la question indirecte sans préciser si les adversaires cherchaient la source, la nature ou la signification du son.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le tour légèrement soutenu « quand … entendirent » permet de ne pas ajouter un complément absent du grec. Les ambiguïtés du singulier « tribu » et de φωνή sont signalées en notes.
