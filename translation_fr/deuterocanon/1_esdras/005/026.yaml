base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/026.yaml
  text: 'The Levites: the sons of Jesueis[a], Koddelou, Bannou, and Soudiou, seventy-four.'
translation:
  language: fr
  text: 'Les Lévites : les fils de Jésuéis[a], de Koddelou, de Bannou et de Soudiou, soixante-quatorze.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Plusieurs noms de ce verset diffèrent de ceux des passages parallèles mieux connus d’Esdras-Néhémie. La traduction suit ici le texte grec de 1 Esdras, sans l’harmoniser avec la tradition hébraïque.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ Λευεῖται
  choice: Les Lévites
  rationale: Le syntagme sert d’intitulé nominatif dans une liste de recensement. « Les Lévites » est naturel et n’ajoute aucune conjonction absente du grec.
- source_word: υἱοὶ
  choice: les fils de
  rationale: Dans une liste généalogique, le terme peut désigner les fils, les descendants ou les membres d’un clan. « Les fils de » conserve la formulation et l’ambiguïté du grec.
- source_word: Ἰησουείς
  choice: Jésuéis
  rationale: Translittération française de la forme grecque, sans harmonisation avec les noms des parallèles d’Esdras-Néhémie.
- source_word: Κοδδηλοῦ
  choice: Koddelou
  rationale: Translittération directe de la forme grecque au génitif ; « Kadmiel » constituerait une harmonisation avec une autre tradition textuelle.
- source_word: Βάννου
  choice: Bannou
  rationale: La forme française retenue suit le nom grec plutôt que de le ramener à un équivalent hébreu supposé.
- source_word: Σουδίου
  choice: Soudiou
  rationale: Ce nom inhabituel est conservé selon le témoin grec ; une rétroversion telle que « Hodavia » serait interprétative.
- source_word: ἑβδομήκοντα τέσσαρες
  choice: soixante-quatorze
  rationale: Rendu cardinal direct et idiomatique en français moderne.
