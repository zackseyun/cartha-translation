base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/054.yaml
  text: And in the second year[a], when they had come to the house of God in Jerusalem, in the second month, Zerubbabel son of Shealtiel and Jeshua son of Jozadak began, along with their brothers, the priests, the Levites, and all who had come from the captivity to Jerusalem[b],
translation:
  language: fr
  text: La deuxième année, après leur arrivée au temple de Dieu[a] à Jérusalem, au deuxième mois, Zorobabel, fils de Salathiel, et Josué, fils de Josédek, commencèrent avec leurs frères, les prêtres, les lévites et tous ceux qui étaient venus de la captivité à Jérusalem[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au sanctuaire de Dieu ». Le mot grec peut aussi désigner plus largement le lieu sacré ou l’ensemble du complexe du temple.
    reason: lexical_alternative
  - marker: b
    text: Ou « tous ceux qui étaient revenus d’exil à Jérusalem ». Le grec dit plus littéralement « venus de la captivité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ δευτέρῳ ἔτει
  choice: La deuxième année
  rationale: Le datif temporel est rendu de manière naturelle et concise en français.
- source_word: παραγενόμενοι
  choice: après leur arrivée
  rationale: Le participe exprime une arrivée antérieure au commencement de l’action; cette tournure en restitue clairement la séquence.
- source_word: τὸ ἱερὸν τοῦ θεοῦ
  choice: le sanctuaire de Dieu
  rationale: ἱερόν peut désigner le lieu sacré ou l’ensemble du complexe cultuel. « Sanctuaire » évite de supposer trop précisément un édifice déjà achevé dans ce contexte de restauration.
- source_word: μηνὸς δευτέρου
  choice: au deuxième mois
  rationale: Rend simplement le génitif temporel grec dans un français biblique actuel.
- source_word: ἤρξαντο
  choice: commencèrent
  rationale: Le verbe reste sans complément dans ce segment, puisque la phrase et l’action se poursuivent au-delà du verset.
- source_word: Ζοροβαβὲλ ὁ τοῦ Σαλαθιήλ
  choice: Zorobabel, fils de Salathiel
  rationale: Emploie les formes françaises bibliques usuelles et explicite naturellement le patronyme.
- source_word: Ἰησοῦς ὁ τοῦ Ἰωσεδέκ
  choice: Josué, fils de Josédek
  rationale: « Josué » est la forme française traditionnelle du nom de ce grand prêtre et évite une confusion anachronique avec Jésus du Nouveau Testament.
- source_word: οἱ ἀδελφοὶ αὐτῶν
  choice: leurs frères
  rationale: Conserve le terme familial masculin du grec sans le généraliser en « compatriotes ».
- source_word: οἱ ἱερεῖς οἱ Λευεῖται
  choice: les prêtres, les lévites
  rationale: Maintient la succession des deux désignations du texte grec sans les fusionner en un titre composé.
- source_word: πάντες οἱ παραγενόμενοι ἐκ τῆς αἰχμαλωσίας
  choice: tous ceux qui étaient venus de la captivité
  rationale: Préserve l’image concrète de αἰχμαλωσία tout en exprimant l’antériorité du participe.
theological_decisions:
- issue: Portée du terme cultuel ἱερόν dans le contexte de la restauration
  choice: le sanctuaire de Dieu
  alternative: le temple de Dieu; le lieu saint de Dieu
  rationale: Le grec peut viser le lieu ou l’ensemble sacré, sans imposer ici une précision architecturale. « Sanctuaire » maintient cette largeur de sens.
- issue: Sens collectif de ἀδελφοί
  choice: leurs frères
  alternative: leurs compatriotes; les leurs
  rationale: Le masculin familial du texte est conservé, sans définir plus étroitement le lien entre les personnes.
- issue: αἰχμαλωσία comme captivité ou exil
  choice: de la captivité
  alternative: revenus d’exil; venus de l’exil
  rationale: « Captivité » reste proche du grec et garde l’accent sur la condition subie; la note signale la formulation française plus idiomatique possible.
translation_notes:
  register: Français international moderne, digne et lisible. La virgule finale est conservée parce que le verset forme le début d’une phrase dont la construction et l’action se poursuivent dans le verset suivant. Les marqueurs de notes sont placés sur les expressions qu’ils expliquent.
