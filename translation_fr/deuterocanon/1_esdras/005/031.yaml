base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/031.yaml
  text: the sons of Iaeir[a], the sons of Daisan, the sons of Noeba, the sons of Chaseba, the sons of Kazera, the sons of Ozeiou, the sons of Phinoe, the sons of Asara, the sons of Basthai, the sons of Assana, the sons of Manei, the sons of Napheisei, the sons of Akouph, the sons of Acheiba, the sons of Asour, the sons of Pharakem,
translation:
  language: fr
  text: les fils de Iaeir[a], les fils de Daisan, les fils de Noéba, les fils de Chaséba, les fils de Kazéra, les fils d’Ozéiou, les fils de Phinoé, les fils d’Asara, les fils de Basthaï, les fils d’Assana, les fils de Maneï, les fils de Naphéiséï, les fils d’Akouph, les fils d’Achéïba, les fils d’Asour, les fils de Pharakem,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu parallèle de Néhémie 7.46 donne ici d’autres noms : « les Néthiniens : les fils de Tsiha, les fils de Hasoupha, les fils de Tabbaoth ». Comme 1 Esdras conserve à cet endroit une liste grecque nettement différente, la traduction suit le texte grec sans l’harmoniser avec le parallèle hébreu.'
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: les fils de
  rationale: Dans cette liste généalogique, la formule désigne des familles ou des clans. « Les fils de » conserve la structure répétitive et formelle du grec sans remplacer celle-ci par l’interprétation « descendants de ».
- source_word: Ἰαείρου
  choice: Iaeir
  rationale: Translittération de la forme grecque, sans harmonisation avec un nom hébreu plus familier, puisque le parallèle massorétique est seulement approximatif.
- source_word: Δαισάν
  choice: Daisan
  rationale: Translittération directe et prudente du nom propre grec.
- source_word: Νοεβά
  choice: Noéba
  rationale: Translittération française de la graphie grecque, avec accent pour guider naturellement la prononciation.
- source_word: Χασεβά
  choice: Chaséba
  rationale: Le chi grec est rendu par « Ch » selon une translittération transparente; l’accent facilite la lecture française.
- source_word: Καζηρά
  choice: Kazéra
  rationale: Translittération conservatrice d’un nom obscur, sans harmonisation conjecturale avec le parallèle hébreu.
- source_word: Ὀζείου
  choice: Ozéiou
  rationale: La forme grecque est conservée en translittération plutôt que normalisée vers un équivalent plus connu mais incertain.
- source_word: Φινόε
  choice: Phinoé
  rationale: Translittération de la forme grecque; « Ph » représente phi et l’accent final guide la lecture.
- source_word: Ἀσαρά
  choice: Asara
  rationale: Translittération directe de la forme grecque.
- source_word: Βασθαί
  choice: Basthaï
  rationale: Translittération proche du grec; le tréma indique que la finale se prononce distinctement en français.
- source_word: Ἀσσανά
  choice: Assana
  rationale: Translittération directe, avec conservation du double sigma par « ss ».
- source_word: Μανεί
  choice: Maneï
  rationale: Translittération proche du grec, avec tréma pour rendre la succession vocalique lisible en français.
- source_word: Ναφεισεί
  choice: Naphéiséï
  rationale: Translittération française conservatrice de ce nom grec obscur, sans normalisation fondée sur un parallèle différent.
- source_word: Ἀκούφ
  choice: Akouph
  rationale: Translittération proche du grec, avec « ou » pour ου et « ph » pour φ.
- source_word: Ἀχειβά
  choice: Achéïba
  rationale: Translittération de la forme grecque; les signes diacritiques facilitent la lecture française sans identifier conjecturalement le nom.
- source_word: Ἀσούρ
  choice: Asour
  rationale: Translittération directe, avec « ou » pour la voyelle grecque ου.
- source_word: Φαρακέμ
  choice: Pharakem
  rationale: Translittération directe du nom grec, sans harmonisation avec une autre tradition textuelle.
