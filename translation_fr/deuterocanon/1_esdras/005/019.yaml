base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/019.yaml
  text: those from Kartatheireios[a], twenty-five; those from Peiras and Berog, seven hundred.
translation:
  language: fr
  text: ceux de Kartatheireios[a], vingt-cinq ; ceux de Peiras et de Berog, sept cents.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La tradition hébraïque parallèle diffère ici et porte approximativement : « les hommes de Netopha, cinquante-six ». 1 Esdras semble conserver une forme grecque divergente de la liste plutôt que cette formulation hébraïque.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ ἐκ
  choice: ceux de
  rationale: Formule elliptique de liste indiquant l’origine géographique. « Ceux de » reste naturel en français et n’ajoute pas « hommes », absent de cette proposition grecque.
- source_word: Καρταθειαρειός
  choice: Kartatheireios
  rationale: Nom de lieu difficile, translittéré de façon prudente d’après le grec plutôt qu’identifié de manière conjecturale à Netopha dans la tradition hébraïque parallèle.
- source_word: εἴκοσι πέντε
  choice: vingt-cinq
  rationale: Rendu direct du nombre cardinal grec.
- source_word: Πείρας
  choice: Peiras
  rationale: Nom propre translittéré d’après le grec, sans harmonisation spéculative avec une autre liste.
- source_word: Βηρόγ
  choice: Berog
  rationale: Nom propre translittéré d’après le grec ; le gamma final est rendu simplement par « g ».
- source_word: ἑπτακόσιοι
  choice: sept cents
  rationale: Rendu direct du nombre cardinal grec, avec l’accord orthographique français de « cents » lorsqu’il n’est suivi d’aucun autre nombre.
theological_decisions:
- issue: Écart important entre la liste grecque et la tradition hébraïque parallèle
  choice: Traduire les noms de lieux et les nombres du texte grec de Swete, tout en signalant la variante hébraïque en note.
  alternative: 'La tradition hébraïque parallèle porte approximativement : « les hommes de Netopha, cinquante-six ».'
  rationale: Pour 1 Esdras, le grec constitue le texte source principal. Puisque le témoin hébraïque diffère ici tant par le nom que par le nombre, l’harmonisation effacerait une divergence textuelle réelle ; celle-ci est donc conservée avec transparence en note.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe brève et les points-virgules conservent le caractère d’une liste de recensement. Les noms propres suivent prudemment les formes grecques.
