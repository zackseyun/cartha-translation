base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/033.yaml
  text: the sons of Solomon’s servants[a], the sons of Assapheioth, the sons of Phaerida, the sons of Jeelei, the sons of Lozon, the sons of Isdael, the sons of Saphuei,
translation:
  language: fr
  text: 'les fils des serviteurs de Salomon[a] : les fils d’Assaphéioth, les fils de Phareida, les fils de Jééli, les fils de Lozôn, les fils d’Isdaël, les fils de Saphuéi,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec donne ici plusieurs noms de familles qui diffèrent nettement du parallèle approximatif du texte massorétique, où la liste est plus courte : « les fils de Giddel, les fils de Gahar, les fils de Reaya » (Néhémie 7.57).'
    reason: Signaler une importante différence entre le texte grec traduit et le parallèle hébreu approximatif, sans les harmoniser.
lexical_decisions:
- source_word: υἱοὶ
  choice: les descendants de
  rationale: Dans cette liste généalogique, le grec désigne les membres issus d’une famille ou d’un groupe, et pas nécessairement les fils immédiats. « Descendants » restitue naturellement cette portée en français moderne tout en conservant la répétition structurante du texte grec.
- source_word: παίδων Σαλωμών
  choice: des serviteurs de Salomon
  rationale: παῖς peut désigner un serviteur ou un esclave. Ici, l’expression fonctionne comme le nom traditionnel d’une catégorie sociale et généalogique; « serviteurs » convient au contexte sans accentuer indûment la condition juridique.
- source_word: Σαλωμών
  choice: Salomon
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom royal.
- source_word: Ἀσσαφειώθ
  choice: Assaphéioth
  rationale: Transcription proche du témoin grec, avec « ph » pour phi et des accents facilitant la prononciation française; le nom ne doit pas être harmonisé avec le parallèle hébreu.
- source_word: Φαρειδά
  choice: Phareida
  rationale: Transcription directe du grec, qui conserve phi et la suite vocalique ει sans assimiler le nom à une forme hébraïque conjecturale.
- source_word: Ἰεηλεί
  choice: Jééli
  rationale: Le J initial suit l’usage français courant pour de nombreux noms bibliques issus d’un iota grec devant une voyelle; les accents rendent la succession des syllabes lisible.
- source_word: Λοζών
  choice: Lozôn
  rationale: Transcription proche du grec; l’accent circonflexe signale la voyelle longue sans recourir à un macron peu usuel en français courant.
- source_word: Ἰσδαήλ
  choice: Isdaël
  rationale: Transcription fidèle à la forme grecque, avec tréma pour marquer la séparation des voyelles, sans rapprochement artificiel avec un nom plus familier.
- source_word: Σαφυεί
  choice: Saphuéi
  rationale: Transcription étroitement fondée sur le grec; la forme rare est conservée plutôt que normalisée d’après un parallèle différent.
theological_decisions:
- issue: Rapport entre la liste grecque et le parallèle approximatif du texte massorétique
  choice: Traduire intégralement la liste grecque telle qu’elle est attestée.
  alternative: 'Harmoniser la liste avec les trois noms du parallèle massorétique : Guiddel, Gahar et Reaya.'
  rationale: Pour 1 Esdras, le grec de Swete est le texte source principal. La liste hébraïque parallèle est plus courte et sensiblement différente; elle éclaire la tradition textuelle, mais ne justifie pas de remplacer silencieusement les noms grecs.
translation_notes:
  register: Français moderne, sobre et digne. La répétition de « les descendants de » reflète la formule généalogique répétée en grec; les noms propres rares sont transcrits à partir du grec et munis d’accents utiles à la lecture française.
