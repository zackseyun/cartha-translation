review_pass:
  verdict: revise
  source_fidelity: La première proposition rend correctement les anciens issus des prêtres, des lévites et des responsables de leurs groupes de parenté, ainsi que leur souvenir de la maison antérieure. En revanche, « Lorsqu’ils virent construire celle-ci » ajoute l’acte de voir et transforme la référence grecque à la construction en proposition temporelle fondée sur une perception. Le grec rattache simplement leur réaction à « la construction de celle-ci ».
  naturalness: Le français est clair et de registre approprié. « Lors de la construction de celle-ci » est à la fois naturel et plus proche de la concision du grec. « Poussèrent un grand cri et versèrent beaucoup de larmes » restitue plus exactement le singulier de κραυγή et l’intensité de κλαυθμός.
  terminology: « Anciens », « maison », « lévites » et « chefs de leurs groupes familiaux » conviennent. « Maison » conserve délibérément l’idiome cultuel grec sans imposer « temple » dans le texte. La note ne devrait pas qualifier le sanctuaire de « premier temple », précision absente du verset lui-même.
  issues:
  - severity: medium
    issue: Ajout de « ils virent » dans la seconde phrase
    rationale: πρὸς τὴν τούτου οἰκοδομήν renvoie à la construction de l’édifice présent ; il ne dit pas que les anciens ont vu cette construction.
  - severity: low
    issue: La note a qualifie la maison de « premier temple »
    rationale: Le grec désigne seulement « la maison antérieure » ; le contexte peut éclairer le référent, mais cette désignation numérotée n’est pas formulée dans le verset.
  - severity: low
    issue: « De grands cris » et la note associée atténuent la forme singulière de κραυγή
    rationale: Le grec a « un grand cri » (κραυγῆς) et « de grands pleurs » (κλαυθμοῦ μεγάλου). Une formulation au singulier permet de mieux suivre le texte.
  revised_text: Parmi les prêtres, les lévites et les chefs de leurs groupes familiaux vinrent des anciens qui avaient vu la maison d’autrefois[a] ; lors de la construction de celle-ci, ils poussèrent un grand cri et versèrent beaucoup de larmes[b].
