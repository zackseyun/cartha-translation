revisions:
- from: Parmi les prêtres, les lévites et les chefs de leurs familles vinrent des anciens qui avaient vu la maison d’autrefois[a]. Lorsqu’ils virent construire celle-ci, ils poussèrent de grands cris et fondirent en larmes[b].
  to: Parmi les prêtres, les lévites et les chefs de leurs groupes familiaux vinrent des anciens qui avaient vu la maison d’autrefois[a] ; lors de la construction de celle-ci, ils poussèrent un grand cri et versèrent beaucoup de larmes[b].
  rationale: La révision retire l’ajout interprétatif selon lequel les anciens auraient vu la construction, conserve le lien circonstanciel plus sobre du grec, et ajuste le singulier de « cri ». Les deux notes sont conservées à leurs ancres, avec une formulation qui n’ajoute pas la désignation « premier temple ».
