base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/060.yaml
  text: And from the priests[a], the Levites, and the heads of their ancestral houses came the elders who had seen the former house, and at the building of this one they cried out with a loud cry and great weeping[b],
translation:
  language: fr
  text: Parmi les prêtres, les lévites et les chefs de leurs groupes familiaux vinrent des anciens qui avaient vu la maison d’autrefois[a] ; lors de la construction de celle-ci, ils poussèrent un grand cri et versèrent beaucoup de larmes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « maison » désigne ici le sanctuaire antérieur.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « avec un grand cri et de grands pleurs ». Le grec mentionne explicitement à la fois le cri et les pleurs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προκαθημένων
  choice: chefs
  rationale: Le participe substantivé désigne ceux qui président ou sont placés à la tête. « Chefs » convient naturellement avec les groupes familiaux mentionnés ensuite.
- source_word: κατὰ τὰς πατριὰς αὐτῶν
  choice: de leurs familles
  rationale: πατριαί désigne ici des groupes de filiation paternelle. « Familles » est clair en français moderne, sans imposer le sens plus étroit de foyers individuels.
- source_word: οἱ πρεσβύτεροι
  choice: des anciens
  rationale: Le terme peut évoquer à la fois l’âge avancé et le rang communautaire. « Anciens » préserve cette double portée.
- source_word: ἑωρακότες
  choice: qui avaient vu
  rationale: 'Le participe parfait indique une expérience antérieure encore pertinente : ces hommes avaient personnellement connu le premier sanctuaire.'
- source_word: τὸν πρὸ τοῦ οἶκον
  choice: la maison d’autrefois
  rationale: Cette formulation conserve l’image biblique de la « maison » tout en rendant clairement l’antériorité du premier temple.
- source_word: πρὸς τὴν τούτου οἰκοδομήν
  choice: Lorsqu’ils virent construire celle-ci
  rationale: La tournure grecque est condensée et rattache leur réaction à la construction de la maison présente. Cette formulation française explicite seulement le lien circonstanciel nécessaire à une lecture naturelle.
- source_word: μετὰ κραυγῆς καὶ κλαυθμοῦ μεγάλου
  choice: ils poussèrent de grands cris et fondirent en larmes
  rationale: Les deux manifestations, le cri et les pleurs, sont maintenues. La verbalisation produit une phrase française naturelle et restitue l’intensité de la scène.
theological_decisions:
- issue: Sens du mot « maison »
  choice: Conserver « maison » dans le texte
  alternative: Traduire directement par « temple »
  rationale: Le grec emploie οἶκος et oppose la maison d’autrefois à celle que l’on construit. Garder l’image préserve l’idiome cultuel sans masquer son référent.
- issue: Nature de la réaction des anciens
  choice: Présenter des cris accompagnés de pleurs sans en préciser la motivation
  alternative: Les qualifier explicitement de lamentations devant l’infériorité du nouveau temple
  rationale: Le verset décrit une réaction intense, mais n’en formule pas explicitement le jugement théologique ni la cause précise. La traduction préserve cette retenue.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase grecque, très compacte, est répartie en deux phrases pour éviter une construction lourde. « Lévites » est écrit avec une minuscule selon l’usage courant pour le nom de fonction ou de groupe, et « maison » est conservé afin de respecter l’image du texte source.
