  yaml_path: translation/deuterocanon/1_esdras/005/004.yaml
  text: And these are the names of the men who were going up according to their ancestral houses[a], into their tribes[b], each to his own administrative division.
translation:
  language: fr
  text: Et voici les noms des hommes qui montaient, selon leurs lignées[a], vers leurs tribus, chacun vers sa propre circonscription[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon leurs maisons ancestrales ». Le grec πατριαί désigne des groupes de parenté définis par une ascendance commune.
    reason: lexical_alternative
  - marker: b
    text: Le mot grec rare μεριδαρχία peut désigner une circonscription administrative, un district ou une portion de territoire attribuée.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ταῦτα τὰ ὀνόματα
  choice: Et voici les noms
  rationale: Cette tournure française introduit naturellement la liste annoncée tout en conservant le lien narratif exprimé par Καί et la valeur démonstrative de ταῦτα.
- source_word: τῶν ἀνδρῶν
  choice: des hommes
  rationale: ἀνήρ désigne ici explicitement des hommes, probablement les représentants masculins recensés; la traduction conserve cette précision.
- source_word: τῶν ἀναβαινόντων
  choice: qui montaient
  rationale: L’imparfait rend naturellement le participe présent dans le contexte du déplacement vers le pays ou Jérusalem, traditionnellement conçu comme une montée.
- source_word: κατὰ πατριὰς αὐτῶν
  choice: selon leurs lignées
  rationale: πατριά désigne un groupe de parenté défini par l’ascendance. «Lignées» reste clair, distingue ce niveau de celui des tribus et évite l’expression vieillie «maisons paternelles».
- source_word: εἰς τὰς φυλὰς
  choice: vers leurs tribus
  rationale: «Vers» préserve la valeur directionnelle de εἰς sans imposer l’idée plus forte d’une incorporation nouvelle dans les tribus.
- source_word: ἐπὶ τὴν μεριδαρχίαν αὐτῶν
  choice: chacun dans sa propre circonscription
  rationale: μεριδαρχία est un terme administratif rare lié à une portion ou division territoriale. «Circonscription» en transmet le caractère formel; «chacun» explicite en français la portée distributive vraisemblable de αὐτῶν.
