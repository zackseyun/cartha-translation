base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/014.yaml
  text: And they kept the Feast of Unleavened Bread for seven days[a], rejoicing before the Lord,
translation:
  language: fr
  text: Et ils célébrèrent la fête des Pains sans levain pendant sept jours, en se réjouissant devant le Seigneur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle hébreu formule la pensée autrement : ils célébrèrent la fête « dans la joie, car le Seigneur les avait réjouis ».'
    reason: Signaler sobrement la variante du témoin hébreu, qui attribue explicitement leur joie au Seigneur, tandis que le grec dit qu’ils se réjouissaient devant lui.
lexical_decisions:
- source_word: ἤγαγον
  choice: célébrèrent
  rationale: Dans le contexte d’une fête, ἄγω signifie « célébrer » ou « observer ». « Célébrèrent » est naturel en français actuel et garde le caractère festif de l’action.
- source_word: ἑορτὴν τῶν ἀζύμων
  choice: la fête des Pains sans levain
  rationale: Cette formulation française établie désigne clairement la fête religieuse; le parallèle hébreu חַג־מַצּוֹת confirme ce sens.
- source_word: ἑπτὰ ἡμέρας
  choice: pendant sept jours
  rationale: « Pendant » exprime naturellement en français la durée marquée par l’accusatif grec.
- source_word: εὐφραινόμενοι
  choice: en se réjouissant
  rationale: Le participe exprime une action accompagnant la célébration. Cette traduction en conserve la valeur verbale sans la réduire à un simple complément de manière.
- source_word: ἔναντι Κυρίου
  choice: devant le Seigneur
  rationale: « Devant » préserve l’idée de présence exprimée par ἔναντι; « le Seigneur » traduit directement Κυρίου dans ce texte grec.
theological_decisions:
- issue: Traduction de Κυρίου alors que le parallèle hébreu porte le nom divin YHWH
  choice: le Seigneur
  alternative: Yahvé / l’Éternel
  rationale: Le texte source grec porte Κυρίου. « Le Seigneur » le traduit directement, tout en restant cohérent avec l’usage de la Septante pour le nom divin, sans imposer dans le texte français une forme absente du grec.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe suit de près le grec tout en restant naturelle; le participe est conservé sous la forme « en se réjouissant ». Le marqueur [a] est placé après l’expression concernée.
