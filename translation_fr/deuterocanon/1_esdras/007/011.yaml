base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/011.yaml
  text: and all the sons of the captivity[a], because they had purified themselves. For all the Levites together had purified themselves, all of them[b],
translation:
  language: fr
  text: Et tous les fils de la captivité[a], parce qu’ils s’étaient purifiés. En effet, les Lévites s’étaient tous purifiés ensemble, tous sans exception[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les enfants de l’exil » ; plus simplement, « les exilés ».
    reason: lexical_alternative
  - marker: b
    text: Le sens du texte grec est ici incomplet et semble se poursuivre dans la proposition suivante. « S’étaient purifiés » peut aussi se traduire par « avaient été purifiés ».
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ τῆς αἰχμαλωσίας
  choice: fils de la captivité
  rationale: Cette traduction formellement transparente conserve l’expression communautaire traditionnelle du grec. La note propose des formulations françaises plus idiomatiques.
- source_word: ἡγνίσθησαν
  choice: s’étaient purifiés
  rationale: Dans ce contexte cultuel, le verbe désigne une purification rituelle. La forme grecque permet aussi une lecture passive, signalée en note.
- source_word: λευεῖται
  choice: les Lévites
  rationale: Désignation française habituelle de ce groupe cultuel.
- source_word: ἅμα πάντες
  choice: tous purifiés ensemble
  rationale: La formulation préserve à la fois l’idée d’action collective et l’insistance du grec sur la totalité; « tous sans exception » rend la reprise finale de πάντες.
theological_decisions:
- issue: Nature de la purification
  choice: s’étaient purifiés
  alternative: avaient été purifiés
  rationale: Le contexte vise la préparation rituelle au culte, sans transformer cette purification en notion abstraite de renouvellement moral. Le réfléchi est naturel, mais l’ambiguïté grammaticale avec le passif est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le tour « fils de la captivité » est volontairement formel afin de conserver l’expression identitaire grecque; les équivalents idiomatiques figurent en note. La virgule finale signale que la proposition se poursuit dans le verset ou segment suivant.
