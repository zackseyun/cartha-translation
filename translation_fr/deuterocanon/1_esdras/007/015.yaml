base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/015.yaml
  text: because he had turned the counsel of the king of Assyria toward them[a], to strengthen their hands in the work of the Lord, the God of Israel.
translation:
  language: fr
  text: car il avait tourné vers eux le dessein du roi d’Assyrie[a], afin de fortifier leurs mains pour les œuvres du Seigneur, le Dieu d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec et le parallèle hébreu portent tous deux « roi d’Assyrie », bien que le contexte plus large d’Esdras concerne le souverain perse. La traduction conserve le texte des sources sans l’harmoniser.
    reason: Désignation historique susceptible de surprendre le lecteur; la note explique pourquoi elle est maintenue.
lexical_decisions:
- source_word: μετέστρεψεν
  choice: avait infléchi
  rationale: Le verbe exprime ici un changement d’orientation. « Avait infléchi » rend ce retournement dans un français naturel, sans préciser davantage la manière dont il s’est produit.
- source_word: τὴν βουλήν
  choice: la décision
  rationale: βουλή peut désigner un dessein, une résolution ou une décision. Dans le contexte d’un roi dont l’orientation devient favorable, « décision » est clair et conserve la dimension délibérative du terme.
- source_word: τοῦ βασιλέως Ἀσσυρίων
  choice: du roi d’Assyrie
  rationale: Le grec porte littéralement « roi des Assyriens », et le parallèle hébreu « roi d’Assyrie ». La traduction conserve cette désignation sans l’harmoniser avec le cadre perse du récit.
- source_word: ἐπʼ αὐτούς
  choice: en leur faveur
  rationale: La préposition marque une orientation vers eux; la proposition de résultat montre que cette orientation est favorable. Cette formulation est plus naturelle en français que « vers eux » dans ce contexte.
- source_word: κατισχῦσαι τὰς χεῖρας αὐτῶν
  choice: afin de fortifier leurs mains
  rationale: Cette expression correspond à l’idiome sémitique également attesté dans le parallèle hébreu. Elle est conservée pour évoquer le soutien et la capacité d’agir sans réduire l’image à une simple paraphrase comme « les encourager ».
- source_word: ἐπὶ τὰ ἔργα Κυρίου θεοῦ Ἰσραήλ
  choice: dans les travaux du Seigneur, le Dieu d’Israël
  rationale: Le grec présente le pluriel τὰ ἔργα. « Travaux » convient à l’activité concrète décrite dans le contexte, tandis que l’apposition distingue clairement « le Seigneur » et « le Dieu d’Israël » comme deux désignations du même référent.
theological_decisions:
- issue: Traduction de κύριος
  choice: le Seigneur
  alternative: l’Éternel
  rationale: La source grecque porte Κυρίου. « Le Seigneur » traduit directement ce titre sans substituer au grec la forme du nom divin présente dans le parallèle hébreu.
- issue: Titre historique « roi d’Assyrie »
  choice: conserver « roi d’Assyrie » dans le texte
  alternative: roi de Perse
  rationale: Le grec et le parallèle massorétique portent tous deux cette désignation. La remplacer par « roi de Perse » harmoniserait le texte avec son contexte historique au lieu de traduire le témoignage reçu.
- issue: Image des mains fortifiées
  choice: conserver l’image « fortifier leurs mains »
  alternative: les encourager / leur donner de la force
  rationale: L’image concrète est présente dans le grec et le parallèle hébreu. Elle exprime à la fois encouragement, soutien et capacité d’accomplir les travaux; une paraphrase unique réduirait cette richesse.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve la forme causale du fragment. « Infléchi en leur faveur » évite la raideur de « tourné vers eux », tandis que « fortifier leurs mains » maintient volontairement l’image biblique commune au grec et à l’hébreu.
