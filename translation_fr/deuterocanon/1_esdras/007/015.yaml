  terminology: « Seigneur, le Dieu d’Israël » est fidèle à Κυρίου θεοῦ Ἰσραήλ et convient au registre. « Dessein » rend βουλή sans imposer qu’il s’agisse d’une décision formellement arrêtée. « Œuvres » conserve le pluriel grec sans introduire la précision absente du grec (« maison de Dieu ») dans le parallèle hébreu.
