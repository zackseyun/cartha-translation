base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/013.yaml
  text: And the sons of Israel who were from the captivity ate[a], all those who had separated themselves from the abominations of the nations of the land[b], seeking the Lord.
translation:
  language: fr
  text: Et les fils d’Israël issus de la captivité mangèrent[a], tous ceux qui s’étaient séparés des abominations des peuples du pays[b], cherchant le Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire qu’ils mangèrent le repas de la Pâque ; le complément est sous-entendu en grec d’après le contexte précédent.
    reason: cross_reference
  - marker: b
    text: Ou « des nations du pays ». Il s’agit des populations environnantes dont les pratiques étaient considérées comme source de souillure.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφάγοσαν
  choice: mangèrent
  rationale: Le verbe signifie simplement « manger ». Son complément, le repas de la Pâque, reste implicite dans le grec et ressort du contexte précédent.
- source_word: οἱ υἱοὶ Ἰσραήλ οἱ ἐκ τῆς αἰχμαλωσίας
  choice: les fils d’Israël revenus de la captivité
  rationale: « Fils d’Israël » conserve l’expression généalogique et communautaire du grec. « Revenus de la captivité » exprime naturellement en français leur provenance, sans les réduire au seul statut d’exilés.
- source_word: χωρισθέντες
  choice: qui s’étaient séparés
  rationale: 'Le participe passif a ici une valeur réfléchie ou moyenne : ces personnes avaient volontairement rompu avec les pratiques qui souillaient.'
- source_word: βδελυγμάτων
  choice: pratiques abominables
  rationale: Le nom désigne ce qui est tenu pour abominable, notamment sur les plans cultuel et moral. L’ajout de « pratiques » explicite naturellement le référent sans atténuer la force du terme.
- source_word: τῶν ἐθνῶν τῆς γῆς
  choice: des peuples du pays
  rationale: ἐθνῶν peut désigner les nations ou les peuples environnants. Ici, « peuples du pays » est naturel et évite le sens technique ultérieur de « païens ».
- source_word: ζητοῦντες τὸν κύριον
  choice: pour chercher le Seigneur
  rationale: Le participe caractérise l’orientation religieuse des personnes concernées. « Pour chercher » rend clairement en français leur démarche, tout en laissant ouverte sa nuance exacte de but ou de disposition.
theological_decisions:
- issue: Faut-il expliciter le complément de « mangèrent » ?
  choice: 'Laisser le complément implicite : « mangèrent »'
  alternative: « mangèrent le repas de la Pâque » ou « en mangèrent »
  rationale: Le contexte immédiat identifie le repas, mais le verset grec ne nomme pas ici son objet. La note apporte la précision sans l’insérer dans le texte.
- issue: Comment rendre la séparation d’avec les « abominations » ?
  choice: « s’étaient séparés des pratiques abominables des peuples du pays »
  alternative: « s’étaient séparés des abominations des nations du pays »
  rationale: La formulation retenue maintient la gravité morale et cultuelle de βδελύγματα, tout en évitant de présenter la séparation comme purement ethnique ou sociale.
- issue: Valeur de ζητοῦντες
  choice: « pour chercher le Seigneur »
  alternative: « cherchant le Seigneur »
  rationale: La construction française indique naturellement la démarche spirituelle de ce groupe. Le grec participial peut exprimer une orientation ou un but ; la traduction ne développe pas davantage cette relation.
translation_notes:
  register: Français international moderne, digne et accessible. Le tour « fils d’Israël » conserve la texture biblique sans archaïsme excessif ; « revenus de la captivité » clarifie idiomatiquement la provenance du groupe. Les deux marqueurs de note figurent dans le texte.
