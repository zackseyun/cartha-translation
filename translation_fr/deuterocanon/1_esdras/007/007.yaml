base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/007.yaml
  text: And they offered for the dedication of the house of the Lord one hundred bulls, two hundred rams, and four hundred lambs,
translation:
  language: fr
  text: Ils offrirent, pour la dédicace du temple du Seigneur, cent taureaux, deux cents béliers et quatre cents agneaux,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσήνεγκαν
  choice: Ils offrirent
  rationale: Le verbe προσφέρω désigne ici l’action d’apporter et de présenter des animaux en offrande; « offrirent » exprime naturellement cette valeur cultuelle.
- source_word: ἐγκαινισμὸν
  choice: dédicace
  rationale: Le terme désigne l’inauguration ou la consécration d’un édifice; « dédicace » convient au contexte cultuel.
- source_word: ἱεροῦ
  choice: maison
  rationale: Bien que ἱερόν puisse se traduire par « temple » ou « sanctuaire », « maison du Seigneur » conserve la formulation traditionnelle attestée par la couche de consultation et reste naturelle en français biblique.
- source_word: κυρίου
  choice: du Seigneur
  rationale: Rendu français usuel et digne du titre divin κύριος.
- source_word: ταύρους
  choice: taureaux
  rationale: Équivalent direct pour les bovins mâles offerts.
- source_word: κριοὺς
  choice: béliers
  rationale: Équivalent direct pour les ovins mâles adultes.
- source_word: ἄρνας
  choice: agneaux
  rationale: Équivalent direct et non marqué pour les jeunes ovins.
theological_decisions:
- issue: Désignation de l’édifice sacré
  choice: maison du Seigneur
  alternative: temple du Seigneur
  rationale: « Maison » maintient le langage biblique de la demeure consacrée à Dieu sans ajouter une précision doctrinale; « temple » serait également possible lexicalement.
translation_notes:
  register: Français moderne, sobre et liturgiquement digne. La virgule finale est conservée parce que le verset fourni se poursuit syntaxiquement dans le contexte éditorial.
