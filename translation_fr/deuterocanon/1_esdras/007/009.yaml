revisions:
- from: Les prêtres et les lévites prirent place, revêtus de leurs habits et répartis par groupes[a], pour accomplir les œuvres du Seigneur, Dieu d’Israël, conformément au livre de Moïse[b] ; les gardiens des portes se tinrent à chaque entrée.
  to: Les prêtres et les lévites se tinrent, en tenue et répartis par groupes[a], pour les œuvres du Seigneur, Dieu d’Israël, conformément au livre de Moïse[b] ; les gardiens des portes se tenaient à chaque porte.
  rationale: 'La révision suit plus étroitement le grec : les prêtres et les lévites sont décrits comme se tenant en place, parés et organisés, en lien avec les œuvres du Seigneur. Elle évite d’ajouter l’idée qu’ils « accomplissent » explicitement ces œuvres et conserve l’ambiguïté de κατὰ φυλάς grâce à la note. La seconde proposition demeure elliptique comme le grec, avec un imparfait français descriptif naturel pour les gardiens postés aux portes.'
