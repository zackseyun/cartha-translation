base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/009.yaml
  text: And the priests and the Levites stood arrayed by divisions for the works of the Lord God of Israel[a], in accordance with the book of Moses[b], and the gatekeepers at each gate.
translation:
  language: fr
  text: Les prêtres et les lévites se tinrent, en tenue et répartis par groupes[a], pour les œuvres du Seigneur, Dieu d’Israël, conformément au livre de Moïse[b] ; les gardiens des portes se tenaient à chaque porte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon les tribus ». Dans ce contexte, l’expression désigne probablement les groupes organisés de prêtres et de lévites affectés au service.'
    reason: lexical_alternative
  - marker: b
    text: Le parallèle hébreu fourni met l’accent sur le fait que Dieu fortifia leurs mains pour les travaux de sa maison ; le texte grec décrit ici la disposition ordonnée des prêtres et des lévites pour les œuvres du Seigneur.
    reason: cross_reference
lexical_decisions:
- source_word: ἔστησαν
  choice: prirent place
  rationale: Exprime naturellement l’idée de se tenir à la place assignée dans une organisation cultuelle, sans imposer le sens passif de « furent postés ».
- source_word: ἐστολισμένοι
  choice: revêtus de leurs habits
  rationale: Le participe indique qu’ils sont vêtus ou équipés de manière appropriée. Cette formulation garde la dimension cérémonielle sans préciser indûment qu’il s’agit de vêtements sacerdotaux particuliers.
- source_word: κατὰ φυλάς
  choice: répartis par groupes
  rationale: φυλή signifie littéralement « tribu », mais le contexte évoque vraisemblablement des groupes organisés pour le service. La note conserve le sens littéral.
- source_word: ἐπὶ τῶν ἔργων
  choice: pour accomplir les œuvres
  rationale: Rend l’affectation à l’activité ou au service désigné, tout en conservant le terme large « œuvres » du grec.
- source_word: Κυρίου θεοῦ Ἰσραήλ
  choice: du Seigneur, Dieu d’Israël
  rationale: Suit directement le titre divin grec et emploie la ponctuation française pour rendre l’apposition possible.
- source_word: ἀκολούθως τῇ Μωσέως βίβλῳ
  choice: conformément au livre de Moïse
  rationale: Rend clairement l’idée de conformité à une instruction écrite attribuée à Moïse.
- source_word: θυρωροί
  choice: gardiens des portes
  rationale: Terme français moderne et transparent pour les responsables chargés des accès au sanctuaire.
- source_word: ἐφʼ ἑκάστου πυλῶνος
  choice: à chaque entrée
  rationale: Formulation naturelle qui désigne chaque portail ou accès, sans évoquer nécessairement une porte mobile.
theological_decisions:
- issue: Traduction de κύριος dans un récit grec deutérocanonique dont l’arrière-plan hébreu emploie le nom divin
  choice: Seigneur
  alternative: Éternel / SEIGNEUR
  rationale: Le texte-source immédiat porte Κυρίου. « Seigneur » traduit donc le grec sans importer dans le corps du texte une convention typographique propre au tétragramme hébreu.
- issue: Portée de κατὰ φυλάς dans l’organisation des prêtres et des lévites
  choice: répartis par groupes
  alternative: selon les tribus
  rationale: Le contexte cultuel favorise l’idée de groupes de service, mais le sens littéral « tribus » demeure possible et est signalé en note plutôt que supprimé.
translation_notes:
  register: Français international moderne, digne et accessible. « Prirent place » et « répartis par groupes » rendent l’organisation du service sans lourdeur administrative. La syntaxe conserve la coordination finale distincte concernant les gardiens des portes.
