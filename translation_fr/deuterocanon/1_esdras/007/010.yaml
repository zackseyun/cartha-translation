base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/010.yaml
  text: And the sons of Israel from the captivity kept the Passover on the fourteenth day of the first month[b][a], when the priests and the Levites had purified themselves together.
translation:
  language: fr
  text: Les fils d’Israël revenus de captivité célébrèrent la Pâque le quatorzième jour du premier mois, lorsque les prêtres et les lévites se furent purifiés tous ensemble.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit d’une purification rituelle accomplie en préparation de la Pâque.
    reason: cultural_note
lexical_decisions:
- source_word: ἤγαγον
  choice: célébrèrent
  rationale: Avec τὸ πάσχα comme complément dans un contexte cultuel, le verbe exprime l’observance ou la célébration de la Pâque plutôt que l’idée littérale de conduire ou d’apporter.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: les fils d’Israël
  rationale: Cette formulation conserve la désignation collective et ancestrale du grec tout en restant familière dans le registre biblique français.
- source_word: τῶν ἐκ τῆς αἰχμαλωσίας
  choice: revenus de captivité
  rationale: Le grec désigne ceux qui viennent de la captivité. « Revenus » rend explicite dans un français naturel le mouvement impliqué par ἐκ sans remplacer « captivité » par une interprétation plus étroite.
- source_word: τὸ πάσχα
  choice: la Pâque
  rationale: Désignation française usuelle de la fête dans ce contexte biblique.
- source_word: ἐν τῇ τεσσαρεσκαιδεκάτῃ τοῦ πρώτου μηνός
  choice: le quatorzième jour du premier mois
  rationale: Rend naturellement et précisément la date indiquée par le grec.
- source_word: ὅτε
  choice: lorsque
  rationale: Préserve le rapport temporel du grec sans lui imposer une valeur causale.
- source_word: ἡγνίσθησαν
  choice: se furent purifiés
  rationale: Le plus-que-parfait marque l’achèvement préalable de la purification rituelle en vue de la Pâque; la forme pronominale rend ici naturellement le grec passif.
- source_word: οἱ ἱερεῖς καὶ οἱ λευεῖται
  choice: les prêtres et les lévites
  rationale: Équivalents français usuels des deux groupes chargés du service du sanctuaire.
- source_word: ἅμα
  choice: tous ensemble
  rationale: Exprime l’action commune ou simultanée indiquée par l’adverbe; « tous » souligne que les deux groupes sont concernés collectivement.
theological_decisions:
- issue: Désignation collective οἱ υἱοὶ Ἰσραήλ
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le choix conserve l’image généalogique et l’identité corporative de l’expression grecque sans la réduire à un simple ethnonyme.
- issue: Nature de la purification
  choice: se furent purifiés
  alternative: furent purifiés
  rationale: Le contexte cultuel indique une préparation rituelle à la Pâque. La formulation n’ajoute pas une interprétation morale et conserve la possibilité d’une purification accomplie selon les rites prescrits.
- issue: Relation temporelle introduite par ὅτε
  choice: lorsque
  alternative: après que
  rationale: Le grec exprime directement la simultanéité ou la circonstance temporelle; « après que » imposerait une séquence plus nette que le texte ne l’énonce.
translation_notes:
  register: Français international moderne, digne et lisible. Le tour « fils d’Israël » maintient la couleur de la désignation biblique; « célébrèrent » évite le littéralisme obscur de « conduisirent la Pâque ». Le marqueur [a] figure dans le texte principal.
