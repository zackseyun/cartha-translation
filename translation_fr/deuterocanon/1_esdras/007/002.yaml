base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/002.yaml
  text: They supervised the holy works more diligently[a], working together with the elders of the Jews and the temple overseers.
translation:
  language: fr
  text: Ils supervisaient avec plus de soin les travaux sacrés[a], en collaboration avec les anciens des Juifs et les responsables du sanctuaire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les travaux du sanctuaire » ou « les travaux du temple ». Le grec dit littéralement « les travaux sacrés »; le parallèle hébreu parle des « travaux de la maison de Dieu ».
    reason: Alternative lexicale et précision contextuelle.
lexical_decisions:
- source_word: ἐπεστάτουν
  choice: ils supervisaient
  rationale: L’imparfait exprime une activité continue de direction et de surveillance; « supervisaient » est clair et convient à la construction avec le génitif.
- source_word: τῶν ἱερῶν ἔργων
  choice: les travaux sacrés
  rationale: Cette formulation reste proche du grec tout en étant naturelle en français. Dans le contexte, il s’agit des travaux liés au temple, comme le confirme le parallèle hébreu.
- source_word: ἐπιμελέστερον
  choice: avec plus de soin
  rationale: Le comparatif grec indique un soin accru. Cette tournure française en conserve explicitement la valeur comparative.
- source_word: συνεργοῦντες
  choice: en collaboration avec
  rationale: Le participe décrit une coopération active avec les deux groupes qui suivent; cette expression rend le lien de manière fluide.
- source_word: τοῖς πρεσβυτέροις τῶν Ἰουδαίων
  choice: les anciens des Juifs
  rationale: La traduction conserve le génitif grec et désigne les dirigeants reconnus de la communauté juive.
- source_word: ἱεροστάταις
  choice: les responsables du sanctuaire
  rationale: Le terme désigne des personnes préposées aux affaires sacrées. « Responsables du sanctuaire » rend leur fonction sans affirmer qu’ils étaient nécessairement prêtres.
theological_decisions:
- issue: Rapport entre le texte grec et le parallèle massorétique d’Esdras 6.22
  choice: Suivre la formulation grecque, notamment la coopération avec les anciens des Juifs et les responsables du sanctuaire, tout en laissant le parallèle hébreu éclairer le contexte des travaux du temple.
  alternative: 'Traduire librement d’après l’hébreu : « fortifier leurs mains dans les travaux de la maison de Dieu ».'
  rationale: Pour 1 Esdras, le grec est le témoin principal. Son contenu propre ne doit pas être remplacé par celui du parallèle hébreu, qui confirme néanmoins que les travaux sacrés concernent la maison de Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’aspect continu de l’imparfait, la valeur comparative de l’adverbe et l’ambiguïté fonctionnelle de ἱεροστάταις.
