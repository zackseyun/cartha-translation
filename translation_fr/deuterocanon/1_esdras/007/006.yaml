    reason: Préserve l’alternative française idiomatique tout en signalant la voix passive de προσενεχθέντες.
  revision_rationale: La révision restitue la voix passive du participe grec dans le texte principal, rend ἀκολούθως par « conformément à » et traduit sans surinterprétation le contenu du « livre de Moïse ». Elle conserve un français moderne et une note brève, correctement ancrée.
