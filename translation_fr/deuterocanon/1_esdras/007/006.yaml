revisions:
- from: Les Israélites, les prêtres, les lévites et tous les autres revenus de captivité firent ce qui est prescrit dans le livre de Moïse.[a]
  to: Les Israélites, les prêtres, les lévites et les autres qui avaient été ramenés de captivité[a] firent conformément à ce qui se trouve dans le livre de Moïse.
  rationale: La révision restitue la voix passive du participe grec dans le texte principal, rend ἀκολούθως par « conformément à » et traduit sans surinterprétation le contenu du « livre de Moïse ». Elle conserve un français moderne et une note brève, correctement ancrée.
