base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/006.yaml
  text: And the sons of Israel[a], and the priests, and the Levites, and the rest from the captivity who had been brought back[b], did according to what is in the book of Moses.
translation:
  language: fr
  text: Les Israélites, les prêtres, les lévites et les autres qui avaient été ramenés de captivité[a] firent conformément à ce qui se trouve dans le livre de Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de façon plus idiomatique : « revenus de captivité ». Le grec emploie toutefois un participe passif : « qui avaient été ramenés ».'
    reason: Préserve l’alternative française idiomatique tout en signalant la voix passive de προσενεχθέντες.
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: les Israélites
  rationale: Cette formulation rend naturellement en français moderne l’expression grecque littérale « les fils d’Israël », sans en modifier la désignation collective.
- source_word: οἱ λοιποί
  choice: tous les autres
  rationale: Le substantif désigne le reste de la communauté après les groupes déjà nommés ; « tous les autres » est clair et idiomatique.
- source_word: οἱ ἐκ τῆς αἰχμαλωσίας οἱ προσενεχθέντες
  choice: revenus de captivité
  rationale: La formule conserve le cadre du retour après la captivité tout en restant fluide. Le participe grec est passif et peut signifier plus littéralement « qui avaient été ramenés », nuance signalée en note.
- source_word: ἀκολούθως τοῖς ἐν τῇ Μωσέως βίβλῳ
  choice: firent ce qui est prescrit dans le livre de Moïse
  rationale: Le grec exprime une action conforme au contenu du livre de Moïse. « Prescrit » explicite sobrement sa fonction normative, sans substituer le mot « Loi » au mot grec « livre ».
theological_decisions:
- issue: Agentivité des personnes revenues de captivité
  choice: revenus de captivité
  alternative: qui avaient été ramenés de captivité
  rationale: Le contexte évoque naturellement des exilés revenus, tandis que le participe passif προσενεχθέντες laisse entendre qu’ils ont été amenés ou ramenés. Le texte courant privilégie la fluidité française et la note préserve la nuance passive.
- issue: Nature du contenu du livre de Moïse
  choice: ce qui est prescrit dans le livre de Moïse
  alternative: ce qui se trouve dans le livre de Moïse
  rationale: ἀκολούθως indique ici la conformité à une norme écrite. « Prescrit » rend cette force contextuelle sans remplacer « livre » par une désignation théologique plus spécifique.
translation_notes:
  register: Français international moderne, clair et digne. « Israélites » évite le tour aujourd’hui marqué « fils d’Israël ». La coordination est allégée sans supprimer aucun groupe du grec.
