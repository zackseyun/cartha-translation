  text: twelve goats for the sin of all Israel[a], according to the number of the twelve tribal leaders of Israel.
translation:
  language: fr
  text: douze boucs pour le péché de tout Israël[a], selon le nombre des douze chefs de tribu d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, en explicitant l’expression sacrificielle : « douze boucs comme sacrifice pour le péché de tout Israël ».'
    reason: Alternative lexicale et explicitation de l’idiome sacrificiel.
lexical_decisions:
- source_word: χιμάρους
  choice: boucs
  rationale: χίμαρος désigne un bouc, ou jeune bouc mâle. « Boucs » est naturel en français et conserve l’indication de sexe portée par le grec.
- source_word: ὑπὲρ ἁμαρτίας
  choice: pour le péché
  rationale: La formule signifie littéralement « pour le péché » et possède ici un sens sacrificiel. La traduction reste proche du grec, tandis que la note explicite l’interprétation idiomatique possible.
- source_word: παντὸς τοῦ Ἰσραήλ
  choice: de tout Israël
  rationale: Le génitif est conservé dans « le péché de tout Israël », formulation qui préserve la structure et la portée collective du grec.
- source_word: πρὸς ἀριθμόν
  choice: selon le nombre de
  rationale: Cette expression marque une correspondance numérique; « selon le nombre de » la rend clairement et avec dignité.
- source_word: φυλάρχων
  choice: chefs de tribu
  rationale: φυλάρχης désigne le chef d’une tribu. « Chefs de tribu » est précis, courant et naturel en français moderne.
theological_decisions:
- issue: Explicitation de l’idiome sacrificiel ὑπὲρ ἁμαρτίας
  choice: pour le péché de tout Israël
  alternative: comme sacrifice pour le péché de tout Israël
  rationale: Le grec est bref et peut se lire formellement « pour le péché », tout en évoquant dans ce contexte un sacrifice pour le péché. Le texte principal préserve cette formulation et sa tension; la note fournit l’explicitation sacrificielle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure proche du grec sans devenir artificielle; « chefs de tribu » privilégie un terme courant plutôt qu’un titre technique.
