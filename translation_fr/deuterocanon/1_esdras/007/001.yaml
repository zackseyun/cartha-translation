base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/001.yaml
  text: Then Sisinnes[a], governor of Coele-Syria and Phoenicia, and Sathrabuzanes and their associates, following what had been commanded by King Darius[b],
translation:
  language: fr
  text: Alors Sisinnès, gouverneur de la Cœlésyrie[a] et de la Phénicie, Sathrabouzane et leurs associés[b], se conformant aux ordres donnés par le roi Darius,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La Cœlésyrie est le nom officiel d’une région; le grec ne désigne pas simplement une « Syrie creuse ».
    reason: cultural_note
  - marker: b
    text: Ou « les associés ». Le grec peut désigner des associés, des partenaires ou des compagnons.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement en français la transition temporelle qui introduit la suite du récit.
- source_word: Σισίννης
  choice: Sisinnès
  rationale: Translittération française du nom grec, avec accent indiquant la prononciation usuelle.
- source_word: ἔπαρχος
  choice: gouverneur
  rationale: Équivalent clair et actuel d’un titre d’administration provinciale, sans lui imposer une nuance romaine trop précise.
- source_word: κοίλης Συρίας
  choice: Cœlésyrie
  rationale: Nom géographique historique établi en français; une traduction littérale comme « Syrie creuse » serait trompeuse.
- source_word: Φοινίκης
  choice: Phénicie
  rationale: Forme française consacrée du nom géographique.
- source_word: Σαθραβούζανης
  choice: Sathrabouzane
  rationale: Translittération française proche de la forme grecque du nom propre.
- source_word: οἱ συνέταιροι
  choice: leurs associés
  rationale: « Associés » rend le sens de partenaires ou compagnons; le possessif explicite naturellement leur rattachement aux deux responsables nommés, tout en étant signalé comme interprétatif.
- source_word: κατακολουθήσαντες
  choice: se conformant
  rationale: Le participe exprime ici le fait d’agir en accord avec les directives reçues; cette formulation conserve le lien participial.
- source_word: τοῖς ... προσταγεῖσιν
  choice: aux ordres donnés
  rationale: Rend clairement la construction passive désignant ce qui avait été prescrit.
- source_word: τοῦ βασιλέως Δαρείου
  choice: par le roi Darius
  rationale: Complément d’agent naturel en français après « ordres donnés ».
