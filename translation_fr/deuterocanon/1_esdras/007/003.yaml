base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/003.yaml
  text: And the holy works prospered[a], while Haggai and Zechariah the prophets were prophesying.
translation:
  language: fr
  text: Et les travaux sacrés[a] progressaient bien, tandis que les prophètes Aggée et Zacharie prophétisaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les travaux du sanctuaire », c’est-à-dire les travaux du Temple.
    reason: Alternative lexicale et clarification contextuelle de τὰ ἱερὰ ἔργα.
lexical_decisions:
- source_word: εὐόδα ἐγίνετο
  choice: progressaient bien
  rationale: L’expression décrit un déroulement favorable ou une bonne progression. « progressaient bien » est naturel en français et convient au sujet pluriel.
- source_word: τὰ ἱερὰ ἔργα
  choice: les travaux sacrés
  rationale: Rend directement l’expression grecque sans préciser dans le texte principal qu’il s’agit des travaux du Temple, précision fournie par le contexte.
- source_word: προφητευόντων
  choice: tandis que … prophétisaient
  rationale: Le génitif absolu exprime ici une action simultanée et continue; « tandis que » et l’imparfait en rendent la valeur.
- source_word: Ἁγγαίου
  choice: Aggée
  rationale: Forme française biblique usuelle du nom du prophète.
- source_word: Ζαχαρίου
  choice: Zacharie
  rationale: Forme française biblique usuelle du nom du prophète.
- source_word: τῶν προφητῶν
  choice: les prophètes Aggée et Zacharie
  rationale: L’apposition grecque identifie explicitement Aggée et Zacharie comme prophètes; l’antéposition est idiomatique en français.
theological_decisions:
- issue: Faut-il expliciter que les « travaux sacrés » sont ceux du Temple?
  choice: Conserver « les travaux sacrés » dans le texte principal.
  alternative: « les travaux du Temple » ou « les travaux de la maison de Dieu »
  rationale: Le grec dit littéralement « les travaux sacrés » sans nommer le Temple dans ce verset. Le contexte autorise cette identification, mais il vaut mieux ne pas réduire la portée de l’expression dans le texte principal.
translation_notes:
  register: Français international moderne, clair et digne. « Travaux » convient mieux que « œuvres » au contexte de construction ou de restauration; « prophétisaient » conserve le vocabulaire propre du texte grec.
