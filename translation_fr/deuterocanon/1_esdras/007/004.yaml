base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/004.yaml
  text: And they completed these things by the decree of the Lord[a], the God of Israel, and with the approval of Cyrus and Darius and Artaxerxes[b], kings of the Persians.
translation:
  language: fr
  text: Ils achevèrent tout cela par décret du Seigneur, le Dieu d’Israël, et avec l’accord[a] de Cyrus, de Darius et d’Artaxerxès, roi des Perses[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec l’assentiment » ou « conformément à la décision ».
    reason: lexical_alternative
  - marker: b
    text: Le grec dit au singulier « roi des Perses ». Ce titre se rattache formellement à Artaxerxès, mais il peut aussi être compris comme qualifiant collectivement les trois souverains perses.
    reason: alternative_reading
lexical_decisions:
- source_word: συνετέλεσαν
  choice: menèrent … à son terme
  rationale: Cette expression rend l’idée d’achever ou de conduire jusqu’à son accomplissement, dans un français naturel et digne.
- source_word: ταῦτα
  choice: tout cela
  rationale: Le démonstratif pluriel renvoie globalement aux faits ou travaux précédemment évoqués sans imposer le mot interprétatif « travaux ».
- source_word: διὰ προτάγματος
  choice: conformément au décret
  rationale: πρόταγμα désigne ici un ordre officiel ou un décret. La tournure française exprime clairement que l’achèvement s’est fait en vertu de cette décision.
- source_word: τοῦ κυρίου θεοῦ Ἰσραήλ
  choice: du Seigneur, le Dieu d’Israël
  rationale: La formulation conserve « Seigneur » et présente « le Dieu d’Israël » en apposition explicative, conformément au grec.
- source_word: μετὰ τῆς γνώμης
  choice: avec l’accord
  rationale: Dans ce contexte administratif, γνώμη évoque l’assentiment, la décision ou l’approbation des souverains. « Accord » est actuel, clair et suffisamment large pour préserver cette nuance.
- source_word: Κύρου καὶ Δαρείου καὶ Ἀρταξέρξου
  choice: de Cyrus, de Darius et d’Artaxerxès
  rationale: Les noms suivent leurs formes françaises usuelles.
- source_word: βασιλέως Περσῶν
  choice: roi des Perses
  rationale: Le grec porte le singulier « roi » et le génitif pluriel « des Perses ». La traduction conserve cette forme, qui se rattache grammaticalement le plus directement à Artaxerxès, tout en signalant en note la possible portée collective.
theological_decisions:
- issue: Rapport entre le décret divin et l’autorisation impériale
  choice: Présenter l’achèvement comme conforme au décret du Seigneur et réalisé avec l’accord des souverains perses.
  alternative: Comprendre l’accord royal comme un simple moyen subordonné au seul décret divin.
  rationale: Le grec coordonne les deux expressions prépositionnelles sans expliquer davantage leur rapport. La traduction maintient cette double perspective sans réduire l’une à l’autre.
- issue: Portée du titre « roi des Perses »
  choice: Conserver le singulier grec dans le texte principal, avec une note sur son rattachement possible.
  alternative: Employer le pluriel « rois des Perses » en comprenant le titre comme portant collectivement sur les trois souverains.
  rationale: Le singulier s’accorde formellement avec le dernier nom, Artaxerxès, mais le contexte permet de comprendre les trois hommes comme des souverains perses. La note préserve cette ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. « Menèrent … à son terme » évite une formulation raide, tandis que « décret » et « accord » conservent le registre administratif du passage. Les ambiguïtés de γνώμη et du singulier βασιλέως sont maintenues au moyen de notes.
