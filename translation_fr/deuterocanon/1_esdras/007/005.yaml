base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/005.yaml
  text: The house was completed by the twenty-third day of the month Adar[b][a], in the sixth year of King Darius.
translation:
  language: fr
  text: La maison[a] fut achevée au plus tard le vingt-troisième jour[b] du mois d’Adar, dans la sixième année du règne du roi Darius.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire le temple ; le grec dit simplement « la maison ».
    reason: cross_reference
  - marker: b
    text: 'Plus littéralement : « jusqu’au troisième et vingtième du mois d’Adar ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνετελέσθη
  choice: fut achevée
  rationale: L’aoriste passif de συντελέω indique que la construction parvint à son achèvement. « Fut achevée » conserve la voix passive et convient au registre narratif.
- source_word: ὁ οἶκος
  choice: la maison
  rationale: Le grec dit simplement « la maison ». Dans le contexte, il s’agit du temple, mais conserver « maison » respecte la formulation de la source sans expliciter dans le corps du texte ce qui demeure implicite.
- source_word: ἕως τρίτης καὶ εἰκάδος
  choice: au plus tard le vingt-troisième jour
  rationale: La tournure signifie littéralement « jusqu’au troisième et vingtième ». « Au plus tard le vingt-troisième jour » rend la valeur limite de ἕως sans affirmer plus précisément que le grec que l’achèvement eut lieu ce jour-là même.
- source_word: μηνὸς Ἀδὰρ
  choice: du mois d’Adar
  rationale: Cette formule génitivale de datation se rend directement ainsi; Adar est conservé comme nom propre du mois.
- source_word: τοῦ ἕκτου ἔτους
  choice: dans la sixième année du règne
  rationale: L’ajout français « du règne » explicite naturellement le sens de cette datation royale sans ajouter un nouveau contenu historique.
- source_word: βασιλέως Δαρείου
  choice: du roi Darius
  rationale: Le génitif rattache la sixième année au règne de Darius. La formulation française est claire et idiomatique.
theological_decisions: []
