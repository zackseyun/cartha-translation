base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/012.yaml
  text: And they sacrificed the Passover for all the sons of the captivity[a], and for their brothers the priests[b], and for themselves.
translation:
  language: fr
  text: Ils sacrifièrent la Pâque[b] pour tous les fils de la déportation[a], pour leurs frères, les prêtres, et pour eux-mêmes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour tous les exilés ». Le grec dit littéralement « pour tous les fils de la déportation », expression collective désignant la communauté revenue d’exil.
    reason: lexical_alternative
  - marker: b
    text: Ici, « la Pâque » désigne le sacrifice ou la célébration de la Pâque; le grec ne dit pas explicitement « agneau ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθυσαν
  choice: sacrifièrent
  rationale: Le verbe θύω désigne ici l’action d’immoler ou d’offrir un sacrifice. « Sacrifièrent » conserve clairement la dimension cultuelle.
- source_word: τὸ πάσχα
  choice: la Pâque
  rationale: πάσχα peut désigner la fête ou le sacrifice pascal. Objet direct de « sacrifièrent », le terme a ici une valeur sacrificielle, mais « la Pâque » préserve l’ambivalence sans ajouter explicitement « agneau ».
- source_word: πᾶσιν τοῖς υἱοῖς τῆς αἰχμαλωσίας
  choice: pour tous les fils de la déportation
  rationale: Cette traduction formellement proche conserve l’expression collective grecque appliquée à la communauté issue de l’exil. « Déportation » rend naturellement αἰχμαλωσία dans ce contexte historique.
- source_word: ἀδελφοῖς αὐτῶν τοῖς ἱερεῦσιν
  choice: pour leurs frères, les prêtres
  rationale: « Frères » maintient le langage familial et communautaire du grec; « les prêtres » est en apposition et précise quels frères sont concernés.
- source_word: ἑαυτοῖς
  choice: pour eux-mêmes
  rationale: Rendu direct du pronom réfléchi au datif, dans la série des bénéficiaires.
theological_decisions:
- issue: Langage collectif masculin dans υἱοί et ἀδελφοί
  choice: Conserver « fils » et « frères » dans le texte principal
  alternative: « exilés », « membres de la communauté » ou « compatriotes »
  rationale: Les formes masculines du grec peuvent avoir une portée collective, mais leur maintien préserve le langage familial et corporatif du texte sans en préciser davantage l’étendue.
translation_notes:
  register: Français moderne, digne et lisible, avec une proximité assumée envers l’expression collective grecque. La ponctuation clarifie l’apposition « leurs frères, les prêtres ».
