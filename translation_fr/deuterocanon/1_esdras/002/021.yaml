base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/021.yaml
  text: 'Then the king wrote back to Rathymus[a], the recorder of the complaints, and to Beeltethmus, and to Samellius the scribe, and to the rest of their associates who lived in Samaria and Syria and Phoenicia[b], as follows:'
translation:
  language: fr
  text: 'Alors le roi répondit par écrit à Rathymos[a], chargé de consigner les affaires qui lui étaient soumises[b], à Beeltéthmos, à Samellios le secrétaire, ainsi qu’à leurs autres collaborateurs qui résidaient en Samarie, en Syrie et en Phénicie. Voici ce qu’il écrivit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La tradition araméenne parallèle du livre d’Esdras présente ici des noms et une formulation différents. La traduction suit le texte grec de 1 Esdras.
    reason: textual_variant
  - marker: b
    text: L’expression grecque peut aussi se traduire par « celui qui consignait ce qui était rapporté ». Elle désigne une fonction administrative dont le titre précis demeure incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντέγραψεν
  choice: répondit par écrit
  rationale: Le verbe composé désigne ici une réponse écrite. Cette formulation est naturelle en français et conserve la valeur épistolaire.
- source_word: Ῥαθύμῳ
  choice: Rathymos
  rationale: Le nom propre est translittéré d’après la forme grecque de 1 Esdras, sans l’harmoniser avec la tradition araméenne parallèle.
- source_word: τῷ γράφοντι τὰ προσπίπτοντα
  choice: chargé de consigner les affaires qui lui étaient soumises
  rationale: 'L’expression décrit une fonction administrative : γράφοντι évoque la mise par écrit, tandis que τὰ προσπίπτοντα désigne littéralement les affaires portées devant quelqu’un. Cette traduction préserve l’imprécision fonctionnelle du grec sans réduire ces affaires à des plaintes.'
- source_word: Βεελτέθμῳ
  choice: Beeltéthmos
  rationale: La forme du nom suit le témoin grec, qui demeure le texte source principal.
- source_word: Σαμελλίῳ γραμματεῖ
  choice: Samellios le secrétaire
  rationale: Dans ce cadre administratif, γραμματεύς peut désigner un secrétaire ou un scribe. « Secrétaire » exprime clairement la fonction en français moderne.
- source_word: τοῖς λοιποῖς τοῖς συντασσομένοις
  choice: leurs autres collaborateurs
  rationale: Le participe désigne les personnes associées aux responsables nommés, sans préciser leur rang. « Collaborateurs » garde cette portée générale.
- source_word: οἰκοῦσιν
  choice: qui résidaient
  rationale: Le verbe indique le lieu de résidence; cette formulation convient au registre administratif du passage.
- source_word: ἐν Σαμαρείᾳ καὶ Συρίᾳ καὶ Φοινίκῃ
  choice: en Samarie, en Syrie et en Phénicie
  rationale: Les trois régions explicitement nommées dans le grec sont conservées.
- source_word: τὰ ὑπογεγραμμένα
  choice: Voici ce qu’il écrivit
  rationale: La formule introduit le contenu écrit qui suit. Cette traduction française est idiomatique tout en rendant explicitement sa nature épistolaire.
