base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/010.yaml
  text: Then Cyrus king of the Persians brought them out and handed them over to Mithridates[b][a], his treasurer.
translation:
  language: fr
  text: Alors Cyrus, roi des Perses, les[a] sortit et les remit à Mithridate, son trésorier[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire les objets sacrés mentionnés au verset précédent.
    reason: cross_reference
  - marker: b
    text: Ou « le gardien de son trésor ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξήνεγκεν
  choice: fit sortir
  rationale: Le verbe signifie « faire sortir » ou « emporter hors de ». Cette tournure naturelle conserve le mouvement des objets hors de leur lieu de dépôt et correspond au parallèle hébreu הוֹצִיא.
- source_word: Κῦρος ὁ βασιλεὺς Περσῶν
  choice: Cyrus, roi des Perses
  rationale: Rendu proche de la syntaxe grecque et du pluriel ethnique Περσῶν, dans une formulation française claire et digne.
- source_word: παρέδωκεν
  choice: les remit
  rationale: Le verbe exprime ici une remise officielle à la garde d'un responsable; « remit » est plus précis que le simple « donna ».
- source_word: Μιθριδάτῃ
  choice: Mithridate
  rationale: Forme française traditionnelle et transparente du nom propre grec Μιθριδάτης.
- source_word: τῷ ἑαυτοῦ γαζοφύλακι
  choice: son trésorier
  rationale: γαζοφύλαξ désigne le gardien ou responsable du trésor. « Son trésorier » rend de façon concise la fonction administrative et la valeur de ἑαυτοῦ.
- source_word: αὐτά
  choice: les
  rationale: Le pronom neutre pluriel renvoie aux objets mentionnés au verset précédent. Le pronom français évite d'ajouter dans le corps du texte un nom absent du grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La construction « fit sortir » préserve la valeur causative ou transitive du grec, tandis que « remit » suggère une transmission officielle. Les deux reprises pronominales françaises rendent les deux occurrences de αὐτά sans explicitation indue.
