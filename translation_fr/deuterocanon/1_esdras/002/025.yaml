base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/025.yaml
  text: Then[a], when what had been written by King Artaxerxes was read, Rathymus and Samellius the scribe, and those aligned with them[b], hurried up to Jerusalem with horsemen and a battle formation of a crowd.
translation:
  language: fr
  text: Alors, après la lecture de ce qui avait été écrit par le roi Artaxerxès, Rathymos, Samellios[a] le scribe et ceux qui s’étaient rangés à leurs côtés partirent en toute hâte pour Jérusalem, avec des cavaliers et une foule en ordre de bataille[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les formes grecques sont « Rathymos » et « Samellios »; dans le texte araméen parallèle, les formes correspondantes sont Rehoum et Shimshaï.
    reason: alternative_reading
  - marker: b
    text: 'Ou : « avec de la cavalerie et une multitude rangée en ordre de bataille ». L’expression grecque est condensée et peut désigner une escorte armée ou un détachement venu employer la force.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγνωσθέντων τῶν παρὰ τοῦ βασιλέως Ἀρταξέρξου γραφέντων
  choice: après la lecture de ce qui avait été écrit par le roi Artaxerxès
  rationale: Le génitif absolu aoriste passif exprime l’antériorité. Cette formulation naturelle conserve le passif et ne réduit pas les « écrits » grecs à une seule lettre.
- source_word: Ῥάθυμος καὶ Σαμέλλιος
  choice: Rathymos et Samellios
  rationale: Les noms sont translittérés d’après le texte grec principal; les formes du parallèle sémitique sont signalées en note.
- source_word: ὁ γραμματεύς
  choice: le scribe
  rationale: Le terme peut désigner un scribe ou un secrétaire officiel. « Scribe » reste transparent et convient au contexte administratif.
- source_word: οἱ τούτοις συντασσόμενοι
  choice: ceux qui s’étaient rangés à leurs côtés
  rationale: Le participe indique l’association ou le ralliement à ces responsables, sans préciser davantage la nature de leur alliance.
- source_word: ἀναζεύξαντες κατὰ σπουδήν
  choice: partirent en toute hâte
  rationale: Le verbe marque le départ, tandis que κατὰ σπουδήν en souligne l’urgence. La destination rend suffisamment clair le mouvement vers Jérusalem.
- source_word: μεθʼ ἵππου
  choice: avec des cavaliers
  rationale: Le singulier collectif ἵππου évoque ici vraisemblablement une escorte montée; « cavaliers » évite le registre technique plus marqué de « cavalerie ».
- source_word: ὄχλου παρατάξεως
  choice: une foule en ordre de bataille
  rationale: Cette expression conserve à la fois l’idée de multitude portée par ὄχλος et celle d’un dispositif militaire portée par παράταξις, sans éliminer la formulation grecque inhabituelle.
