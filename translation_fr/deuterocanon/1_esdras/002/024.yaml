base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/024.yaml
  text: So now I have ordered that those men be stopped from building the city[a], and that care be taken that nothing further be done beyond this[c][b], and that the evil matter may not advance any more to the harm of kings.
translation:
  language: fr
  text: Maintenant donc, j’ai ordonné qu’on empêche ces hommes de bâtir la ville[a], et qu’on veille à ce que rien ne se fasse au-delà de cet ordre[b], et que le mal ne progresse pas davantage, au point de troubler les rois[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de rebâtir la ville ». Le contexte concerne sa restauration, mais le grec dit simplement « bâtir la ville ».
    reason: lexical_alternative
  - marker: b
    text: Ou « contrairement à cet ordre ». L’expression grecque peut désigner ce qui dépasse l’ordre du roi ou ce qui s’y oppose.
    reason: lexical_alternative
  - marker: c
    text: Ou « au point de porter préjudice aux rois ». Le verbe grec peut évoquer le trouble causé aux rois ou l’atteinte portée à leur autorité.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν ἐπέταξα
  choice: Maintenant donc, j’ai ordonné
  rationale: Reproduit l’enchaînement conclusif et le caractère accompli de la décision royale dans un français administratif naturel.
- source_word: ἀποκωλῦσαι τοὺς ἀνθρώπους ἐκείνους
  choice: qu’on empêche ces hommes
  rationale: Exprime clairement le contenu de l’ordre; «ces hommes» conserve la référence au groupe précis désigné par le grec.
- source_word: τοῦ οἰκοδομῆσαι τὴν πόλιν
  choice: de bâtir la ville
  rationale: Le grec dit simplement «bâtir», même si le contexte historique permet de comprendre «rebâtir».
- source_word: προνοηθῆναι
  choice: qu’on veille
  rationale: Rend l’idée de prendre les dispositions nécessaires et convient au ton d’un décret, sans lourdeur excessive.
- source_word: ὅπως μηθὲν παρὰ ταῦτα γένηται
  choice: à ce que rien ne se fasse au-delà de cet ordre
  rationale: «Au-delà de cet ordre» rend naturellement l’une des valeurs possibles de παρὰ ταῦτα tout en laissant en note le sens concurrent «contrairement à cet ordre».
- source_word: τὰ τῆς κακίας
  choice: le mal
  rationale: Rend sobrement l’expression grecque idiomatique sans ajouter un démonstratif absent du texte; elle peut désigner l’entreprise nuisible en cause.
- source_word: μὴ προβῇ ἐπὶ πλεῖον
  choice: ne progresse pas davantage
  rationale: Conserve l’image d’une action mauvaise qui avance ou prend de l’ampleur.
- source_word: εἰς τὸ βασιλεῖς ἐνοχλῆσαι
  choice: jusqu’à troubler les rois
  rationale: Rend directement ἐνοχλέω, qui signifie causer du trouble, importuner ou porter atteinte; la tournure préserve la visée ou l’aboutissement redouté.
