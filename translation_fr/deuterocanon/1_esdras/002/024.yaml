  source_fidelity: 'La traduction rend fidèlement les principaux éléments du grec : l’ordre royal accompli, l’empêchement de bâtir, la précaution exigée et la crainte d’une aggravation qui troublerait les rois. Les notes conservent à juste titre les ambiguïtés de οἰκοδομῆσαι, de παρὰ ταῦτα et de ἐνοχλέω.'
  naturalness: 'La formulation finale actuelle, « afin que le mal ne progresse pas davantage jusqu’à troubler les rois », est maladroite en français : « jusqu’à » donne une articulation ambiguë avec la négation et la subordination par « afin que » ne reproduit pas bien la coordination grecque. Une coordination directe et « au point de » rendent plus naturellement le résultat redouté.'
  terminology: « Bâtir la ville », « ces hommes », « qu’on veille » et « troubler les rois » conviennent au registre administratif. « Le mal » est possible pour τὰ τῆς κακίας, compris ici comme l’affaire ou l’entreprise mauvaise en cause, sans introduire de démonstratif absent du grec.
