base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/016.yaml
  text: 'To King Artaxerxes our lord: your servants[a], Rathymus, the one over records, and Samellius the scribe, and the rest of their council[c][b], and those in Coele-Syria and Phoenicia.'
translation:
  language: fr
  text: 'Au roi Artaxerxès, notre seigneur : tes serviteurs, Rathymos, chargé des affaires soumises[a], et Samellios[b], le secrétaire, les autres membres de leur conseil, ainsi que ceux qui se trouvent en Cœlé-Syrie[c] et en Phénicie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque est difficile et signifie plus littéralement « celui qui s’occupe des affaires présentées » ; elle désigne probablement un fonctionnaire chargé des questions ou requêtes soumises à l’autorité.
    reason: lexical_alternative
  - marker: b
    text: Dans le texte massorétique parallèle, les noms correspondant approximativement à Rathymos et Samellios sont Rehoum et Shimshaï.
    reason: alternative_reading
  - marker: c
    text: La Cœlé-Syrie est le nom historique de la région dans le texte grec.
    reason: cultural_note
lexical_decisions:
- source_word: Βασιλεῖ Ἀρταξέρξῃ κυρίῳ
  choice: Au roi Artaxerxès, notre seigneur
  rationale: Le datif ouvre une adresse épistolaire. « Seigneur » est ici un titre de cour ; « notre » n’est pas exprimé en grec, mais rend naturellement la déférence collective suggérée par « tes serviteurs ».
- source_word: οἱ παῖδές σου
  choice: tes serviteurs
  rationale: Dans une lettre royale, παῖδες désigne des subordonnés au service du roi, non des enfants ; « serviteurs » conserve le registre officiel sans imposer l’idée d’esclavage.
- source_word: Ῥάθυμος
  choice: Rathymos
  rationale: La forme grecque, témoin principal de 1 Esdras, est conservée et adaptée à une translittération française lisible.
- source_word: ὁ τὰ προσπίπτοντα
  choice: chargé des affaires soumises
  rationale: La tournure désigne vraisemblablement un responsable des questions ou requêtes portées devant l’autorité. Cette formulation reste proche du grec et évite les titres administratifs trop précis comme « archiviste » ou « chancelier ».
- source_word: Σαμέλλιος ὁ γραμματεὺς
  choice: Samellios, le secrétaire
  rationale: Dans ce contexte administratif, γραμματεύς désigne naturellement un secrétaire officiel ; la forme grecque du nom propre est maintenue.
- source_word: οἱ ἐπίλοιποι τῆς βουλῆς αὐτῶν
  choice: les autres membres de leur conseil
  rationale: Cette formulation explicite naturellement en français le sens collectif de βουλή sans ajouter une fonction non indiquée.
- source_word: οἱ ἐν κοίλῃ Συρίᾳ καὶ Φοινίκῃ
  choice: ceux qui se trouvent en Cœlé-Syrie et en Phénicie
  rationale: κοίλη Συρία est un nom géographique historique, rendu par son équivalent français conventionnel « Cœlé-Syrie ».
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible, avec la concision d’une adresse officielle. Les formes grecques des noms propres sont privilégiées, puisque la Septante constitue ici le texte source principal ; les équivalents du parallèle massorétique sont signalés en note.
