base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/017.yaml
  text: And now let it be known to my lord the king that the Judeans who came up from you to us have come to Jerusalem and are living in that rebellious and wicked city[a]; they are repairing its marketplaces and walls[c][b], and are laying the foundation of a temple.
translation:
  language: fr
  text: Et maintenant, que mon seigneur le roi sache que les Judéens[a] qui sont montés de chez vous jusqu’à nous sont arrivés à Jérusalem et habitent cette ville rebelle et mauvaise. Ils en réparent les places publiques[b] et les murailles, et posent les fondations d’un temple[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Juifs ». Le grec Ἰουδαῖοι peut désigner les habitants ou ressortissants de la Judée, ou plus largement les Juifs.
    reason: lexical_alternative
  - marker: b
    text: Ou « places de marché ». Le grec ἀγοραί désigne des places publiques, notamment les espaces où se tenait le marché; certaines traditions parallèles parlent plutôt des rues ou, plus généralement, de la reconstruction de la ville.
    reason: alternative_reading
  - marker: c
    text: 'L’expression grecque est concise et peut aussi se comprendre : « entreprennent la construction d’un temple » ou « reconstruisent le temple ». Dans le contexte, il s’agit du temple de Jérusalem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν ἔστω
  choice: que … sache
  rationale: Formule officielle rendue dans un français moderne et naturel, plutôt que par le calque lourd « qu’il soit connu ».
- source_word: τῷ κυρίῳ βασιλεῖ
  choice: mon seigneur le roi
  rationale: κύριος est ici un titre humain de déférence adressé au souverain, et non un titre divin.
- source_word: Ἰουδαῖοι
  choice: les Judéens
  rationale: Dans le contexte perse, le terme possède une forte dimension ethnogéographique; « Juifs » demeure toutefois possible.
- source_word: ἀναβάντες παρ’ ὑμῶν πρὸς ἡμᾶς
  choice: qui sont montés de chez vous jusqu’à nous
  rationale: Conserve le mouvement ascendant exprimé par ἀναβαίνω ainsi que les deux pôles de provenance et de destination.
- source_word: τὴν πόλιν τὴν ἀποστάτιν καὶ πονηράν
  choice: cette ville rebelle et mauvaise
  rationale: ἀποστάτις désigne ici la rébellion politique; πονηρά conserve l’appréciation hostile de l’accusation sans surcharger le français.
- source_word: οἰκοῦσιν
  choice: habitent
  rationale: Exprime simplement l’occupation durable indiquée par le présent grec.
- source_word: ἀγοράς
  choice: places publiques
  rationale: ἀγορά désigne une place publique servant notamment de marché; ce choix garde une portée plus large que « marchés » et reste distinct de « rues ».
- source_word: θεραπεύουσιν
  choice: réparent
  rationale: Dans ce contexte de travaux urbains, le verbe signifie prendre soin de, remettre en état ou réparer, sans imposer une reconstruction complète.
- source_word: ναὸν ὑποβάλλονται
  choice: entreprennent les fondations d’un temple
  rationale: La tournure grecque est comprimée et évoque le commencement ou la substructure d’un édifice; la traduction préserve l’idée de fondation sans la rendre plus certaine que le grec.
theological_decisions:
- issue: Valeur de κύριος appliqué au roi
  choice: mon seigneur le roi
  alternative: le Seigneur roi
  rationale: Le contexte administratif indique clairement une formule de cour adressée à un monarque humain; une majuscule ou une formulation divine créerait une ambiguïté absente du passage.
- issue: Identification du ναός anarthre
  choice: un temple
  alternative: le Temple
  rationale: Le contexte permet d’identifier le sanctuaire de Jérusalem, mais le grec emploie ναόν sans article. La traduction formelle « un temple » conserve cette forme, tandis qu’une note signale la référence contextuelle.
translation_notes:
  register: Français international moderne, digne et lisible, avec une tonalité de correspondance administrative. La syntaxe grecque a été légèrement fluidifiée sans effacer les ambiguïtés de Ἰουδαῖοι, ἀγοραί et ναὸν ὑποβάλλονται.
