base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/013.yaml
  text: And all the vessels were brought up[a], the gold and silver ones[b], five thousand four hundred and sixty-nine in all.
translation:
  language: fr
  text: 'Tous les objets furent apportés[a], en or et en argent[b] : cinq mille quatre cent soixante-neuf en tout.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec peut aussi se traduire par « furent transportés ». Dans ce contexte, cette formulation peut évoquer l’acheminement des objets du Temple vers Jérusalem.
    reason: lexical_alternative
  - marker: b
    text: L’inventaire parallèle d’Esdras 1.9-10, dans le texte hébreu, présente une répartition et des nombres différents ; la présente traduction suit ici le texte grec de 1 Esdras.
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ δὲ πάντα σκεύη
  choice: Tous les objets
  rationale: Dans ce contexte de trésor du Temple, σκεύη désigne collectivement les objets ou ustensiles sacrés. « Objets » est naturel en français moderne et suffisamment large.
- source_word: ἐκομίσθη
  choice: furent rapportés
  rationale: L’aoriste passif exprime le transport. « Rapportés » suggère avec justesse leur retour, probablement vers Jérusalem, sans rendre explicite une destination que le grec ne nomme pas.
- source_word: χρυσᾶ καὶ ἀργυρᾶ
  choice: ceux d’or et d’argent
  rationale: Les adjectifs neutres renvoient à σκεύη. Cette reprise évite une répétition lourde et conserve la formulation compacte du grec.
- source_word: πεντακισχίλια τετρακόσια ἑξήκοντα ἐννέα
  choice: cinq mille quatre cent soixante-neuf
  rationale: Le grec donne clairement le nombre cardinal 5 469, rendu en toutes lettres conformément au registre narratif.
