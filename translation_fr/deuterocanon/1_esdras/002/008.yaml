base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/008.yaml
  text: And those around them helped in every way[a], with silver and gold, with horses, with livestock, and with very many freewill offerings[c][b], from all whose mind had been stirred.
translation:
  language: fr
  text: 'Ceux qui les entouraient leur vinrent en aide de toutes sortes de manières : avec de l’argent et de l’or, des chevaux[a], du bétail, et par de très nombreuses prières de la part de beaucoup de personnes dont la pensée avait été éveillée[c][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le parallèle hébreu d’Esdras 1.6 parle ici de biens ou de possessions plutôt que de chevaux.
    reason: alternative_reading
  - marker: b
    text: Le grec porte « prières » (ou, selon le sens possible du mot, « vœux »). Le parallèle hébreu mentionne plutôt des objets précieux et, séparément, des offrandes volontaires.
    reason: textual_variant
  - marker: c
    text: 'Littéralement : « dont l’intelligence — ou la pensée — avait été éveillée ». Le parallèle hébreu emploie un idiome que l’on peut rendre par « dont l’esprit avait été poussé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ περικύκλῳ αὐτῶν
  choice: ceux qui vivaient autour d’eux
  rationale: La formule désigne les personnes établies dans leur entourage géographique. Cette traduction reste proche du grec tout en étant plus naturelle que « ceux autour d’eux ».
- source_word: ἐβοήθησαν ἐν πᾶσιν
  choice: leur apportèrent toute sorte d’aide
  rationale: Le verbe exprime l’aide ou le soutien, et ἐν πᾶσιν en souligne le caractère étendu. La tournure française rend naturellement l’ensemble sans surdéterminer la manière.
- source_word: ἐν ἀργυρίῳ καὶ χρυσίῳ
  choice: de l’argent et de l’or
  rationale: Les noms indiquent ici les moyens matériels par lesquels l’aide fut apportée.
- source_word: ἵπποις
  choice: des chevaux
  rationale: Le grec porte explicitement « chevaux »; cette leçon est donc conservée malgré la formulation différente du parallèle hébreu.
- source_word: κτήνεσιν
  choice: du bétail
  rationale: Le terme désigne largement les animaux domestiques possédés par quelqu’un. « Bétail » est courant et suffisamment général dans ce contexte.
- source_word: εὐχαῖς ὡς πλείσταις
  choice: un très grand nombre de dons votifs
  rationale: εὐχή peut désigner une prière ou un vœu et, par métonymie dans une liste de contributions, ce qui est offert en accomplissement d’un vœu. « Dons votifs » respecte cette valeur sans harmoniser silencieusement le grec avec les « présents précieux » du parallèle hébreu.
- source_word: πολλῶν ὧν ὁ νοῦς ἠγέρθη
  choice: offerts par de nombreuses personnes dont l’esprit avait été éveillé
  rationale: πολλῶν est rendu par « de nombreuses personnes », non par « tous ». « Esprit » exprime ici le siège intérieur de la pensée et de la volonté, tandis que la forme passive de ἠγέρθη est conservée par « avait été éveillé ».
theological_decisions:
- issue: Divergence entre la liste grecque et le parallèle hébreu d’Esdras 1.6
  choice: Suivre le témoin grec avec « chevaux » et « dons votifs », tout en signalant les leçons du parallèle hébreu en notes.
  alternative: Harmoniser avec l’hébreu en traduisant « biens » et « présents précieux ».
  rationale: Pour 1 Esdras, le grec est le texte source principal. Ses leçons sont intelligibles et doivent rester visibles; les écarts significatifs du parallèle hébreu sont néanmoins documentés.
- issue: Sens intérieur de νοῦς et rapport avec l’idiome hébreu
  choice: Employer « esprit » dans le texte et préciser le sens plus littéral en note.
  alternative: Traduire « pensée » ou adopter l’idiome du parallèle hébreu, « dont l’esprit avait été poussé ».
  rationale: En français, « esprit » peut désigner la faculté de penser et de vouloir sans imposer une distinction anthropologique doctrinale. La note préserve la valeur lexicale de νοῦς et le rapprochement possible avec l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase explicite légèrement le lien syntaxique entre les dons votifs et leurs nombreux donateurs, tout en conservant le passif et les divergences propres au texte grec.
