  to: 'Ceux qui les entouraient leur vinrent en aide de toutes sortes de manières : avec de l’argent et de l’or, des chevaux[a], du bétail, et par de très nombreuses prières de la part de beaucoup de personnes dont la pensée avait été éveillée[c][b].'
  rationale: La correction rétablit le sens premier, volontairement quelque peu surprenant en contexte, de εὐχαῖς (« prières » ou « vœux »), sans le convertir en dons votifs sous l’influence du parallèle hébreu. Elle supprime aussi l’ajout interprétatif « offerts » et rend νοῦς par « pensée ». Les notes conservent les écarts pertinents entre les traditions grecque et hébraïque et leurs ancrages.
