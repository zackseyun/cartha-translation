    issue: Ajout de « offerts » et attribution des dons
    rationale: « Offerts par de nombreuses personnes » dépend de la réinterprétation de εὐχαῖς comme dons et impose une relation syntaxique qui n’est pas explicitée ainsi en grec.
  - severity: low
    issue: « esprit » pour νοῦς
    rationale: Le terme français est possible, mais « pensée » rend plus directement νοῦς et évite de rapprocher le texte principal de l’idiome du parallèle hébreu.
