base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/003.yaml
  text: 'Thus says Cyrus king of the Persians: The Lord of Israel[a], the Most High Lord, has appointed me king of the world,'
translation:
  language: fr
  text: 'Voici ce que dit Cyrus, roi des Perses : « Le Seigneur d’Israël[a], le Seigneur Très-Haut, m’a établi roi du monde habité, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle hébreu d’Esdras 1.2 porte : « le SEIGNEUR, le Dieu du ciel », au lieu de « le Seigneur d’Israël, le Seigneur Très-Haut ». Ici, 1 Esdras suit la forme grecque de la proclamation.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τάδε λέγει
  choice: Voici ce que dit
  rationale: Formule française naturelle et digne pour introduire une proclamation officielle, tout en conservant la valeur démonstrative du grec.
- source_word: ὁ βασιλεὺς Περσῶν Κῦρος
  choice: Cyrus, roi des Perses
  rationale: Suit l’apposition grecque et rend le pluriel Περσῶν sans l’assimiler au singulier « Perse » du parallèle hébreu.
- source_word: Ἐμὲ ἀνέδειξεν βασιλέα
  choice: m’a établi roi
  rationale: ἀναδείκνυμι désigne ici l’établissement ou la désignation à une charge; « établi roi » convient au contexte d’investiture royale.
- source_word: τῆς οἰκουμένης
  choice: du monde habité
  rationale: Conserve le sens propre d’οἰκουμένη et l’ampleur de la revendication impériale, sans réduire le terme au seul territoire perse.
- source_word: ὁ κύριος τοῦ Ἰσραήλ
  choice: Le Seigneur d’Israël
  rationale: Rend directement le génitif grec sans ajouter « Dieu », absent de ce témoin.
- source_word: Κύριος ὁ ὕψιστος
  choice: le Seigneur Très-Haut
  rationale: Préserve les deux éléments du titre divin et son rapport d’apposition avec le titre précédent, dans une tournure française consacrée et intelligible.
theological_decisions:
- issue: Différence de titre divin entre le grec de 1 Esdras et le parallèle massorétique
  choice: Le Seigneur d’Israël, le Seigneur Très-Haut
  alternative: le SEIGNEUR, le Dieu du ciel
  rationale: Le grec est le texte source principal et porte explicitement ces deux titres. Le parallèle hébreu est signalé en note afin de préserver la différence textuelle sans la résoudre silencieusement.
translation_notes:
  register: Français international moderne, clair et digne. Le ton de proclamation royale est maintenu. La virgule finale indique que la déclaration se poursuit au verset suivant.
