base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/009.yaml
  text: And King Cyrus brought out the holy vessels of the Lord[a], which Nebuchadnezzar had carried away from Jerusalem and deposited in the house of his god.
translation:
  language: fr
  text: Le roi Cyrus fit sortir les objets sacrés du Seigneur, que Nabuchodonosor avait emportés de Jérusalem et déposés dans le sanctuaire de son idole[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « dans son idole »; il peut désigner le sanctuaire ou la maison de l’idole. Le texte hébreu parallèle porte « dans la maison de son dieu ».
    reason: Variante lexicale et différence entre le texte grec principal et le parallèle hébreu.
lexical_decisions:
- source_word: ἐξήνεγκεν
  choice: fit sortir
  rationale: Le causatif français exprime naturellement l’action de tirer ces objets du lieu où ils étaient gardés, sans suggérer que Cyrus les portait lui-même.
- source_word: τὰ ἅγια σκεύη
  choice: les objets sacrés
  rationale: σκεύη désigne des objets ou ustensiles cultuels sans en préciser la forme; « objets sacrés » est clair et évite de limiter le sens à des récipients.
- source_word: τοῦ κυρίου
  choice: du Seigneur
  rationale: Cette traduction suit directement le grec κυρίου et conserve le titre divin usuel dans un contexte lié au temple.
- source_word: μετήγαγεν
  choice: avait emportés
  rationale: Le plus-que-parfait marque l’antériorité et « emporter » rend le transfert des objets hors de Jérusalem dans un contexte de conquête.
- source_word: ἀπηρείσατο
  choice: déposés
  rationale: Le verbe évoque ici la mise en place des objets dans un lieu cultuel; « déposer » garde ce sens sans ajouter l’idée d’un entreposage durable.
- source_word: ἐν τῷ εἰδώλιῳ αὐτοῦ
  choice: dans son temple d’idoles
  rationale: Cette formulation reste ancrée dans le grec εἰδώλιον, qui désigne un sanctuaire ou temple associé à une idole, tout en signalant en note la lecture plus neutre du parallèle hébreu.
theological_decisions:
- issue: Traduction de κύριος dans ce contexte cultuel
  choice: Seigneur
  alternative: YHWH / Éternel
  rationale: Le texte source grec porte κύριος. « Seigneur » le traduit sans substituer au grec une forme reconstruite à partir du parallèle hébreu.
- issue: Rapport entre εἰδώλιον et le parallèle hébreu
  choice: temple d’idoles dans le texte, avec la variante du parallèle en note
  alternative: maison de son dieu
  rationale: Le grec, source principale, emploie un terme plus explicitement péjoratif que l’hébreu. Le texte principal en garde la force, tandis que la note préserve l’écart entre les témoins sans les harmoniser.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe narrative reste proche du grec, tandis que « objets sacrés » évite l’ambiguïté moderne de « vases sacrés ». Le marqueur [a] suit immédiatement l’expression concernée.
