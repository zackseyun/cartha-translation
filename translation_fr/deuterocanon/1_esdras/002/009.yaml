  source_fidelity: Le texte rend correctement ἐξήνεγκεν, τὰ ἅγια σκεύη τοῦ κυρίου, μετήγαγεν et ἀπηρείσατο. En revanche, « temple d’idoles » met indûment le pluriel là où le grec εἰδώλιον est singulier et spécifie « temple » sans le signaler dans le texte. « Sanctuaire de son idole » conserve mieux le singulier et l’ambiguïté cultuelle du grec; la note explicite la formulation grecque et le contraste avec le parallèle hébreu.
