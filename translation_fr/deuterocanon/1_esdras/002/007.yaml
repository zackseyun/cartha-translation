base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/007.yaml
  text: Then the heads of the ancestral houses of the tribes of Judah and Benjamin[a], and the priests and the Levites, and everyone whose spirit the Lord had stirred up, arose to go up to build the house of the Lord that is in Jerusalem.
translation:
  language: fr
  text: Alors les chefs des maisons ancestrales des tribus de Juda et de Benjamin, les prêtres, les lévites et tous ceux dont le Seigneur[a] avait éveillé l’esprit se levèrent pour monter bâtir la maison du Seigneur qui est à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu parallèle d’Esdras 1.5 dit : « Dieu avait éveillé leur esprit. » Ici, 1 Esdras porte : « le Seigneur ».'
    reason: alternative_reading
lexical_decisions:
- source_word: καταστήσαντες / וַיָּקוּמוּ
  choice: se levèrent
  rationale: La forme grecque transmise est difficile dans ce contexte. Le parallèle hébreu porte clairement « se levèrent », sens qui convient aux infinitifs de mouvement et de but qui suivent.
- source_word: οἱ ἀρχίφυλοι τῶν πατριῶν
  choice: les chefs des maisons ancestrales
  rationale: Cette formulation désigne les responsables des grandes unités familiales et conserve la structure de parenté exprimée par le grec.
- source_word: τῆς Ἰούδα καὶ Βενιαμεὶν φυλῆς
  choice: des tribus de Juda et de Benjamin
  rationale: Le grec est condensé et emploie « tribu » au singulier, mais il associe manifestement Juda et Benjamin; le pluriel est nécessaire en français naturel.
- source_word: ἤγειρεν … τὸ πνεῦμα
  choice: avait éveillé l’esprit
  rationale: Cette expression conserve l’image grecque d’une impulsion intérieure suscitée par Dieu tout en restant claire en français contemporain.
- source_word: Κύριος
  choice: le Seigneur
  rationale: Le témoin grec principal lit Κύριος; cette désignation est donc retenue malgré la lecture « Dieu » du parallèle hébreu.
- source_word: ἀναβῆναι
  choice: monter
  rationale: « Monter » préserve l’expression biblique conventionnelle du déplacement vers Jérusalem et demeure idiomatique en français.
- source_word: οἰκοδομῆσαι οἶκον
  choice: bâtir la maison
  rationale: Le grec dit littéralement « bâtir » sans préfixe exprimant une reconstruction; « la maison » désigne ici le sanctuaire connu.
- source_word: τῷ κυρίῳ τὸν ἐν Ἱερουσαλήμ
  choice: la maison du Seigneur qui est à Jérusalem
  rationale: Cette formulation rattache naturellement la maison au Seigneur et précise son emplacement, conformément au sens de la séquence grecque.
theological_decisions:
- issue: La désignation divine diffère entre le texte grec principal et le parallèle hébreu.
  choice: le Seigneur avait éveillé
  alternative: Dieu avait éveillé
  rationale: La traduction suit le grec de 1 Esdras, qui porte Κύριος, tout en signalant en note la lecture différente du parallèle hébreu d’Esdras 1.5.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde l’ampleur de l’énumération grecque sans archaïsmes inutiles; « maisons ancestrales » préserve la structure familiale ancienne, et « monter » conserve l’idiome géographique et biblique lié à Jérusalem.
