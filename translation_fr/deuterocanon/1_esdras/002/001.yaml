base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/001.yaml
  text: In the first year of Cyrus king of Persia[a], for the fulfillment of the word of the Lord by the mouth of Jeremiah,
translation:
  language: fr
  text: La première année de Cyrus, roi de Perse, afin que s’accomplisse la parole du Seigneur[a] par la bouche de Jérémie,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le parallèle hébreu porte ici le nom divin YHWH, que l’on peut rendre par « le SEIGNEUR ».
    reason: Le témoin grec principal lit Κυρίου (« Seigneur »), tandis que le parallèle hébreu présente le tétragramme.
lexical_decisions:
- source_word: Βασιλεύοντος Κύρου Περσῶν ἔτους πρώτου
  choice: La première année du règne de Cyrus, roi de Perse
  rationale: Le génitif absolu situe l’action dans le temps. Cette formulation française naturelle conserve l’idée du règne et, avec l’appui du parallèle hébreu, explicite le titre royal de Cyrus.
- source_word: εἰς συντέλειαν
  choice: afin que s’accomplisse
  rationale: Cette tournure rend la visée ou l’aboutissement exprimé par εἰς et συντέλεια, tout en employant en français l’expression consacrée et claire de l’accomplissement d’une parole prophétique.
- source_word: ῥήματος Κυρίου
  choice: la parole du Seigneur
  rationale: « Parole » rend ῥῆμα dans son contexte prophétique, et « Seigneur » traduit directement le grec Κυρίου, qui constitue ici la source principale.
- source_word: ἐν στόματι Ἰερεμίου
  choice: transmise par la bouche de Jérémie
  rationale: La formulation conserve l’image concrète de la bouche présente en grec, tout en indiquant naturellement en français que Jérémie est le médiateur de la parole.
theological_decisions:
- issue: Traduction de Κυρίου alors que le parallèle hébreu porte le nom divin YHWH
  choice: Seigneur
  alternative: SEIGNEUR
  rationale: Le texte grec principal porte Κυρίου, d’où « Seigneur » dans le texte. Le parallèle hébreu emploie YHWH, ce qui peut être signalé par « SEIGNEUR » dans une traduction suivant explicitement ce témoin.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase reste ouverte par une virgule, conformément au fragment grec fourni, qui se poursuit dans le verset.
