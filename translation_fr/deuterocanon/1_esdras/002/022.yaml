base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/022.yaml
  text: I read the letter that you sent to me. Therefore I gave orders to investigate[a], and it was found that that city has from ancient times set itself in opposition to kings,
translation:
  language: fr
  text: J’ai lu la lettre que vous m’avez envoyée. J’ai donc ordonné qu’une enquête soit menée, et il s’est avéré que cette ville s’oppose aux rois depuis les temps anciens[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « se range contre les rois » ou « se déploie contre les rois ». Le grec évoque une opposition active et persistante, sans nécessairement désigner une révolte précise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνέγνων
  choice: J’ai lu
  rationale: L’aoriste de ἀναγιγνώσκω désigne ici la lecture de la lettre reçue. Le passé composé convient naturellement au style épistolaire moderne.
- source_word: ἐπιστολήν
  choice: la lettre
  rationale: C’est le sens courant du nom dans ce contexte administratif.
- source_word: ἣν πέμψατε πρὸς ἐμέ
  choice: que vous m’avez envoyée
  rationale: Formulation française directe et naturelle qui restitue le destinataire exprimé par πρὸς ἐμέ.
- source_word: ἐπέταξα
  choice: J’ai donc ordonné
  rationale: Le verbe indique qu’une autorité donne un ordre; cette formulation conserve le ton royal et administratif.
- source_word: ἐπισκέψασθαι
  choice: qu’une enquête soit menée
  rationale: Dans ce contexte, le verbe renvoie à un examen officiel. La tournure passive évite d’ajouter un enquêteur absent du grec.
- source_word: εὑρέθη
  choice: il s’est avéré
  rationale: Cette formule impersonnelle restitue naturellement en français le passif grec employé pour présenter le résultat de l’enquête.
- source_word: ἡ πόλις ἐκείνη
  choice: cette ville
  rationale: Le démonstratif renvoie à la ville déjà en question; « cette ville » est idiomatique en français.
- source_word: ἐξ αἰῶνος
  choice: depuis les temps anciens
  rationale: L’expression signale ici une conduite historiquement ancienne, non l’éternité au sens métaphysique.
- source_word: ἀντιπαρατάσσουσα
  choice: se dresse contre
  rationale: Le participe évoque une prise de position hostile ou une opposition active. « Se dresse contre » conserve cette image sans préciser indûment qu’il s’agit d’une rébellion ouverte.
- source_word: βασιλεῦσιν
  choice: les rois
  rationale: Traduction directe du datif pluriel, qui a ici une portée historique et générale.
