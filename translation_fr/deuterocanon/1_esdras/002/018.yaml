base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/018.yaml
  text: Therefore, if this city is rebuilt and the walls are completed, they will certainly not endure to pay tribute, but will even oppose kings.
translation:
  language: fr
  text: Si donc cette ville est reconstruite et ses murailles achevées, ils refuseront catégoriquement de payer le tribut[a] et iront même jusqu’à s’opposer aux rois.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils ne continueront certainement pas à payer le tribut ». Littéralement, le grec peut se comprendre comme « ils ne supporteront certainement pas de payer »; il peut souligner leur refus de rester soumis au tribut impérial.'
    reason: lexical_alternative
  - marker: b
    text: Le texte grec est ici le témoin principal. Sa formulation ne correspond pas étroitement au passage massorétique parallèle fourni; la traduction suit donc directement le grec.
    reason: textual_variant
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Si donc
  rationale: « donc » conserve la valeur inférentielle de οὖν, tandis que « si » rend directement la condition éventuelle introduite par ἐάν.
- source_word: ἡ πόλις αὕτη
  choice: cette ville
  rationale: Le démonstratif proximal αὕτη est rendu naturellement par « cette ».
- source_word: οἰκοδομηθῇ
  choice: est reconstruite
  rationale: Le passif aoriste désigne ici l’édification de nouveau de Jérusalem dans son contexte historique.
- source_word: τὰ τείχη συντελεσθῇ
  choice: ses murailles achevées
  rationale: συντελέω exprime l’achèvement; « murailles » convient aux fortifications d’une ville. Le possessif français évite une coordination lourde sans modifier le référent.
- source_word: φορολογίαν
  choice: le tribut
  rationale: Dans ce cadre impérial, φορολογία désigne une contribution imposée au profit du pouvoir royal plutôt qu’un impôt local ordinaire.
- source_word: οὐ μὴ ὑπομείνωσιν δοῦναι
  choice: ils refuseront catégoriquement de payer
  rationale: La négation emphatique οὐ μή est rendue par « catégoriquement ». ὑπομένω peut évoquer le fait de supporter ou de continuer à subir l’obligation; dans ce contexte politique, la formulation française exprime clairement le refus de s’y soumettre, tandis que la note conserve l’ambiguïté lexicale.
- source_word: ἀλλὰ καὶ
  choice: et iront même jusqu’à
  rationale: 'Cette tournure française rend la progression accusatoire: au non-paiement s’ajouterait une opposition plus grave.'
- source_word: βασιλεῦσιν ἀντιστήσονται
  choice: s’opposer aux rois
  rationale: ἀνθίστημι signifie se dresser contre, résister ou s’opposer; « s’opposer » préserve la portée politique sans préciser indûment la forme de cette résistance.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Tribut » maintient le cadre impérial; « iront même jusqu’à » restitue la montée rhétorique naturelle de l’accusation. Les deux appels de note [a] et [b] figurent dans le texte.
