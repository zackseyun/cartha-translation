base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/002.yaml
  text: the Lord stirred up the spirit of Cyrus king of the Persians[a], and he made a proclamation throughout all his kingdom, and also in writing, saying,
translation:
  language: fr
  text: 'Le Seigneur éveilla l’esprit de Cyrus, roi des Perses[a]. Cyrus proclama dans tout son royaume, et également par écrit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « roi des Perses » ; le parallèle hébreu en Esdras 1.1 porte « roi de Perse ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἤγειρεν
  choice: éveilla
  rationale: Avec « l’esprit » comme complément, le verbe exprime ici une impulsion intérieure suscitée par Dieu. « Éveilla » reste naturel en français tout en conservant l’image grecque.
- source_word: Κύριος
  choice: le Seigneur
  rationale: Le grec porte Κύριος. Dans ce contexte, le titre désigne le Dieu d’Israël, mais la traduction ne remplace pas le terme grec par le nom divin du parallèle hébreu.
- source_word: τὸ πνεῦμα
  choice: l’esprit
  rationale: Le grec ne contient aucun possessif explicite. Le contexte indique qu’il s’agit de la disposition intérieure de Cyrus; « l’esprit » préserve la formulation du texte source.
- source_word: Κύρου
  choice: Cyrus
  rationale: Forme française usuelle du nom royal, confirmée par le parallèle hébreu.
- source_word: βασιλέως Περσῶν
  choice: roi des Perses
  rationale: Le grec emploie le pluriel « des Perses ». Cette formulation est conservée au lieu d’être harmonisée avec « roi de Perse » dans le parallèle hébreu d’Esdras 1.1.
- source_word: ἐκήρυξεν
  choice: fit proclamer
  rationale: Le verbe désigne une annonce publique. « Fit proclamer » convient au contexte d’un décret royal diffusé dans le royaume.
- source_word: ὅλῃ τῇ βασιλείᾳ αὐτοῦ
  choice: dans tout son royaume
  rationale: Cette expression française rend naturellement l’étendue de la diffusion dans l’ensemble du royaume.
- source_word: ἅμα διὰ γραπτῶν
  choice: également par écrit
  rationale: La formule indique que la proclamation fut aussi transmise sous forme écrite. « Par écrit » reste général et n’impose pas un support précis.
- source_word: λέγων
  choice: ':'
  rationale: En français, les deux-points introduisent naturellement les paroles du décret qui suivent, sans la lourdeur de « en disant ».
theological_decisions:
- issue: L’action divine à l’origine du décret de Cyrus
  choice: « le Seigneur éveilla l’esprit de Cyrus » affirme une intervention divine directe dans sa disposition intérieure
  alternative: Comprendre que le Seigneur aurait seulement permis à Cyrus d’agir, ou attribuer le décret à de seuls motifs politiques
  rationale: Le grec présente explicitement le Seigneur comme sujet de l’action exercée sur l’esprit de Cyrus. La traduction conserve cette causalité sans préciser davantage la manière dont elle s’articule avec la volonté du roi.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation française introduit directement le décret du verset suivant. « Celui-ci » clarifie le changement de sujet entre le Seigneur et Cyrus sans ajouter de contenu.
