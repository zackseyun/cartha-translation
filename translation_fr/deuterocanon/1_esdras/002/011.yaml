base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/011.yaml
  text: And through him they were handed over to Sanamassar[c][b][a], governor of Judea.
translation:
  language: fr
  text: Et par son intermédiaire, ils furent remis à Sanamassar[a], gouverneur de la Judée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sanamassar est la forme grecque du nom Sheshbatsar dans le texte hébreu parallèle (Esdras 1.8).
    reason: alternative_reading
  - marker: b
    text: 'Grec : « Judée » ; le texte hébreu parallèle porte « Juda ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ δὲ τούτου
  choice: Et par son intermédiaire
  rationale: La tournure grecque signifie littéralement « par celui-ci / par lui » et exprime ici l’intermédiaire ou l’agent du transfert. Cette formulation reste naturelle en français sans préciser davantage l’identité du référent.
- source_word: παρεδόθησαν
  choice: ils furent remis
  rationale: Le passif de παραδίδωμι exprime la remise ou le transfert de ce dont il est question dans le contexte, à savoir les objets du sanctuaire. « Furent remis » conserve le passif et convient au registre administratif.
- source_word: Σαναμασσάρῳ
  choice: Sanamassar
  rationale: Le nom est translittéré d’après la forme grecque, qui constitue la source principale. La forme du parallèle hébreu est signalée en note.
- source_word: προστάτῃ
  choice: gouverneur
  rationale: Dans ce contexte administratif, προστάτης désigne un responsable placé à la tête d’un territoire. « Gouverneur » rend clairement cette fonction, même si le terme peut aussi signifier plus largement « chef » ou « dirigeant ».
- source_word: τῆς Ἰουδαίας
  choice: de la Judée
  rationale: La source grecque porte Ἰουδαία, normalement rendu en français par « Judée ». Le parallèle hébreu présente « Juda », différence conservée en note.
