- from: et ses habitants y fomentaient des révoltes et des guerres[a]. Des rois puissants et cruels régnaient à Jérusalem et exigeaient un tribut de la Cœlé-Syrie et de la Phénicie.
  to: et ses habitants se livraient à des révoltes et à des guerres[a]. Des rois puissants et durs régnaient à Jérusalem et exigeaient un tribut de la Cœlé-Syrie et de la Phénicie.
  rationale: La révision rend συντελοῦντες par une expression française qui dénote une participation effective sans réduire le sens à l’instigation. Elle atténue aussi, avec prudence, l’interprétation morale de σκληροί. Enfin, elle corrige les renvois de la note au parallèle araméen sans modifier l’information textuelle fournie.
