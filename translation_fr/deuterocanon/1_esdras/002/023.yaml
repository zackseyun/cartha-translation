base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/023.yaml
  text: and its people were carrying out rebellions and wars within it[a], and strong and harsh kings were in Jerusalem, ruling and exacting tribute from Coele-Syria and Phoenicia.
translation:
  language: fr
  text: et ses habitants se livraient à des révoltes et à des guerres[a]. Des rois puissants et durs régnaient à Jérusalem et exigeaient un tribut de la Cœlé-Syrie et de la Phénicie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le passage parallèle d’Esdras 4:15, 19-20 décrit Jérusalem comme une ville rebelle qui causait du tort aux rois et aux provinces, où des révoltes avaient lieu depuis les temps anciens, et sur laquelle des rois puissants avaient régné en percevant un tribut de la Cœlé-Syrie et de la Phénicie. Ici, 1 Esdras développe cette description en mentionnant « des révoltes et des guerres ».
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ ἄνθρωποι
  choice: ses habitants
  rationale: Littéralement « les hommes »; dans ce contexte, l’expression désigne les gens de la ville. « Ses habitants » rend clairement le référent en français naturel.
- source_word: ἀποστάσεις
  choice: des révoltes
  rationale: Le nom désigne des soulèvements ou des actes d’insurrection politique; le pluriel grec est conservé.
- source_word: πολέμους
  choice: des guerres
  rationale: Traduction directe du pluriel, sans le restreindre à des batailles particulières.
- source_word: συντελοῦντες
  choice: fomentaient
  rationale: Le participe exprime ici une participation active à la réalisation de révoltes et de guerres. « Fomentaient » convient au contexte politique et demeure idiomatique.
- source_word: ἰσχυροὶ καὶ σκληροὶ
  choice: puissants et cruels
  rationale: « Puissants » exprime la force politique des rois; dans la caractérisation de gouvernants, σκληροί indique leur dureté impitoyable, rendue naturellement par « cruels ».
- source_word: κυριεύοντες
  choice: régnaient
  rationale: Le verbe indique l’exercice de la domination. Avec des rois et Jérusalem, « régnaient » est la formulation française la plus naturelle.
- source_word: φορολογοῦντες
  choice: exigeaient un tribut de
  rationale: Le verbe évoque la levée d’un impôt ou tribut par une puissance dominante; cette formulation conserve la nuance d’exaction impériale.
- source_word: κοίλην Συρίαν
  choice: la Cœlé-Syrie
  rationale: Nom géographique traditionnel de la région dans le contexte hellénistique; la forme française consacrée est retenue.
- source_word: Φοινίκην
  choice: la Phénicie
  rationale: Forme française standard du nom de cette région.
theological_decisions:
- issue: Rapport entre le texte grec développé et le parallèle araméen d’Esdras 4
  choice: Conserver dans le texte principal les révoltes, les guerres et le tribut imposé à la Cœlé-Syrie et à la Phénicie.
  alternative: Aligner davantage la formulation sur Esdras 4:19-20, où Jérusalem est décrite comme une ville rebelle, nuisible aux rois et aux provinces, dans laquelle des révoltes ont eu lieu depuis les temps anciens.
  rationale: Pour 1 Esdras, le grec est le texte source principal. Il développe et remanie ici la tradition parallèle; cette particularité doit être traduite plutôt qu’harmonisée.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe grecque est répartie en deux phrases pour éviter une coordination lourde. Le premier καί est rendu par « et », car le verset fourni commence au milieu d’une phrase; la répétition suivante de καί est exprimée par une nouvelle phrase.
