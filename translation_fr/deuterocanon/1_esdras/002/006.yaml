    issue: Construction française inachevée avec « pour tous ceux qui habitent... »
    rationale: Après « pour tous ceux », la principale « que les gens... » ne se rattache pas naturellement en français. Le grec emploie une construction distributive qui doit être réorganisée plutôt que reproduite par cette préposition.
