revisions:
- from: Ainsi, pour tous ceux qui habitent dans les différentes localités, que les gens de l’endroit où chacun réside lui viennent en aide avec de l’or et de l’argent, des dons, des chevaux[a] et du bétail, ainsi qu’avec les autres biens ajoutés au titre de vœux pour le temple[b] du Seigneur à Jérusalem.
  to: Ainsi, que les habitants de chaque localité viennent en aide à ceux qui y résident avec de l’or et de l’argent, des dons, des chevaux[a] et du bétail, ainsi qu’avec les autres contributions ajoutées pour accomplir des vœux, pour le temple[b] du Seigneur à Jérusalem.
  rationale: 'La révision corrige la syntaxe de la phrase française en exprimant explicitement la relation distributive présente dans le grec : les habitants de chaque lieu doivent aider les personnes qui y résident. Elle conserve les termes essentiels du témoin grec et les deux ancres de notes. « Contributions » remplace « biens » afin de ne pas ajouter une restriction matérielle non exprimée, tout en restant naturel dans une énumération de dons destinés au temple.'
