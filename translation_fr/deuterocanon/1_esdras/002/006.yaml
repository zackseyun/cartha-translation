base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/006.yaml
  text: Therefore[a], as many as live in the various places, let the men in his place help him with gold and silver, with gifts, with horses and livestock[b], along with the other things added as vowed offerings for the temple of the Lord in Jerusalem.
translation:
  language: fr
  text: Ainsi, que les habitants de chaque localité viennent en aide à ceux qui y résident avec de l’or et de l’argent, des dons, des chevaux[a] et du bétail, ainsi qu’avec les autres contributions ajoutées pour accomplir des vœux, pour le temple[b] du Seigneur à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « chevaux ». Le texte hébreu parallèle d’Esdras 1.4, 6 emploie une formulation différente, qui mentionne des biens et du bétail.
    reason: alternative_reading
  - marker: b
    text: Ou « sanctuaire ». Le mot grec ἱερόν peut désigner le temple ou le sanctuaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι οὖν κατὰ τοὺς τόπους οἰκοῦσιν
  choice: Ainsi, pour tous ceux qui habitent dans les différentes localités
  rationale: « Ainsi » rend la continuité inférentielle de οὖν. La formulation distributive exprime ὅσοι et κατὰ τοὺς τόπους tout en préparant le singulier αὐτῷ appliqué à chacun.
- source_word: βοηθείτωσαν αὐτῷ οἱ ἐν τῷ τόπῳ αὐτοῦ
  choice: que les gens de l’endroit où chacun réside lui viennent en aide
  rationale: Cette tournure conserve l’exhortation de l’impératif et le singulier distributif « lui », sans imposer au français le calque peu naturel « les gens de son lieu ».
- source_word: ἐν χρυσίῳ καὶ ἐν ἀργυρίῳ, ἐν δόσεσιν
  choice: avec de l’or et de l’argent, des dons
  rationale: Les emplois de ἐν indiquent ici les moyens matériels de l’aide. « Dons » reste assez large et n’anticipe pas le caractère votif mentionné ensuite.
- source_word: μεθʼ ἵππων καὶ κτηνῶν
  choice: des chevaux et du bétail
  rationale: La traduction suit littéralement le témoin grec pour ἵππων. κτηνῶν désigne collectivement les animaux domestiques ou le bétail.
- source_word: σὺν τοῖς ἄλλοις τοῖς κατʼ εὐχὰς προστεθειμένοις
  choice: ainsi qu’avec les autres biens ajoutés au titre de vœux
  rationale: « Autres biens » explicite naturellement les éléments matériels sous-entendus; « au titre de vœux » conserve le rapport aux vœux exprimé par κατʼ εὐχάς sans recourir au terme moins courant « votif ».
- source_word: εἰς τὸ ἱερὸν τοῦ κυρίου τὸ ἐν Ἱερουσαλήμ
  choice: pour le temple du Seigneur à Jérusalem
  rationale: Dans ce contexte, ἱερόν désigne le temple de Jérusalem. εἰς marque la destination des contributions, et κυρίου est rendu selon la forme du texte grec par « du Seigneur ».
theological_decisions:
- issue: Traduction de κύριος dans le contexte du temple du Dieu d’Israël
  choice: Seigneur
  alternative: ÉTERNEL
  rationale: Le témoin principal grec porte κυρίου et non le tétragramme hébreu; « Seigneur » respecte donc directement la forme de la source sans masquer l’allusion au Dieu d’Israël.
- issue: Désignation de l’ἱερόν à Jérusalem
  choice: temple
  alternative: sanctuaire
  rationale: « Temple » identifie clairement l’ensemble cultuel de Jérusalem. « Sanctuaire » demeure lexicalement possible, mais pourrait évoquer plus étroitement l’espace sacré intérieur.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la distribution entre le groupe pluriel et l’aide apportée à chacun individuellement, tout en évitant un calque syntaxique obscur du grec.
