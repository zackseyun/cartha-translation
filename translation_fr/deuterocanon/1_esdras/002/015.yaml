base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/015.yaml
  text: 'In the time of Artaxerxes king of the Persians[a], Belemus and Mithradates and Tabelius and Rathymus and Beeltethmus and Samellius the scribe, and the rest who were associated with them, living in Samaria and the other places[b], wrote the following letter against the inhabitants of Judea and Jerusalem:'
translation:
  language: fr
  text: 'À l’époque d’Artaxerxès, roi des Perses, Bélémos, Mithridate, Tabellios, Rathymos, Béeltéthmos, Samellios le scribe et les autres qui leur étaient associés, qui habitaient la Samarie et les autres lieux, rédigèrent la lettre suivante[a] contre les habitants de la Judée et de Jérusalem[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la lettre écrite ci-dessous » ou « la lettre placée à la suite ».'
    reason: lexical_alternative
  - marker: b
    text: La formulation grecque autour de « rédigèrent ... contre les habitants de la Judée et de Jérusalem » est condensée et comporte un pronom dont le rattachement est incertain ; le sens paraît être celui d’un écrit à charge contre ces habitants.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν δὲ τοῖς ἐπʼ Ἀρταξέρξου τοῦ Περσῶν βασιλέως χρόνοις
  choice: À l’époque d’Artaxerxès, roi des Perses
  rationale: « À l’époque de » rend naturellement χρόνοις sans préciser davantage que le grec qu’il s’agit du règne; « roi des Perses » conserve explicitement le génitif pluriel Περσῶν. Le léger lien narratif porté par δέ n’exige pas ici un mot français distinct.
- source_word: κατέγραψεν
  choice: rédigèrent
  rationale: Le verbe désigne une mise par écrit ou un enregistrement. Avec « lettre » comme complément, « rédigèrent » est idiomatique. Le pluriel français s’accorde avec la série de personnes qui constitue manifestement le sujet, malgré la forme verbale grecque au singulier.
- source_word: αὐτῶν κατὰ τῶν κατοικούντων ἐν τῇ Ἰουδαίᾳ καὶ Ἱερουσαλήμ
  choice: contre les habitants de la Judée et de Jérusalem
  rationale: κατά avec le génitif exprime ici l’orientation hostile de l’écrit. Le pronom αὐτῶν est syntaxiquement difficile; il n’est pas développé artificiellement dans le corps du texte, et cette difficulté est signalée en note.
- source_word: Βήλεμος καὶ Μιθραδάτης καὶ Ταβέλλιος καὶ Ῥάθυμος καὶ Βεέλτεθμος καὶ Σαμέλλιος
  choice: Bélémos, Mithridate, Tabellios, Rathymos, Béeltéthmos, Samellios
  rationale: Les noms sont translittérés à partir des formes grecques, avec une forme française courante pour Μιθραδάτης.
- source_word: ὁ γραμματεύς
  choice: le scribe
  rationale: « Scribe » conserve la désignation traditionnelle et littérale d’un professionnel ou fonctionnaire de l’écrit; « secrétaire » resterait possible.
- source_word: οἱ λοιποὶ οἱ τούτοις συντασσόμενοι
  choice: les autres qui leur étaient associés
  rationale: La formulation exprime l’association ou l’alignement avec les personnes nommées sans lui donner nécessairement un sens militaire.
- source_word: οἰκοῦντες δὲ ἐν Σαμαρείᾳ καὶ τοῖς ἄλλοις τόποις
  choice: lesquels habitaient la Samarie et les autres lieux
  rationale: Cette formulation rattache naturellement le participe au groupe précédent et conserve l’expression assez générale « les autres lieux ».
- source_word: τὴν ὑπογεγραμμένην ἐπιστολήν
  choice: la lettre reproduite ci-dessous
  rationale: ὑπογεγραμμένην signifie littéralement « écrite ci-dessous » ou « placée à la suite ». « Reproduite ci-dessous » rend clairement sa fonction dans le récit.
