base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/020.yaml
  text: Now therefore we make known to you[a], lord king, that if this city is built and its walls are raised up, there will no longer be for you passage into Coele-Syria and Phoenicia.
translation:
  language: fr
  text: Maintenant donc, nous te faisons savoir, Seigneur le roi, que si cette ville est bâtie et si ses murailles sont relevées, tu n’auras plus de passage vers la Cœlé-Syrie et la Phénicie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « tu n’auras plus accès à la Cœlé-Syrie et à la Phénicie ». Le grec dit littéralement : « il n’y aura plus pour toi de sortie vers la Cœlé-Syrie et la Phénicie » ; l’expression peut évoquer la perte d’une voie de passage ou de la capacité d’atteindre ces régions.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδεικνύομέν
  choice: nous te faisons savoir
  rationale: Dans ce rapport officiel adressé au roi, le verbe signifie qu’on porte formellement un fait à sa connaissance. Cette formulation est naturelle en français et correspond au ton administratif.
- source_word: κύριε βασιλεῦ
  choice: seigneur roi
  rationale: Le double vocatif grec est conservé sans ajouter un possessif absent du texte.
- source_word: οἰκοδομηθῇ
  choice: est bâtie
  rationale: Le grec dit simplement « bâtie »; « rebâtie » serait contextuellement possible, mais préciserait davantage que la formulation source.
- source_word: τὰ ταύτης τείχη ἀνασταθῇ
  choice: ses murailles sont relevées
  rationale: « Murailles » convient à des fortifications urbaines, et « relevées » restitue l’image de structures remises debout sans imposer explicitement « reconstruites ».
- source_word: ἔξοδος
  choice: passage
  rationale: Dans ce contexte politique et géographique, le mot désigne vraisemblablement une voie de passage ou un accès, plutôt qu’une simple « sortie » physique.
- source_word: κοίλην Συρίαν
  choice: Cœlé-Syrie
  rationale: Il s’agit du nom géographique grec traditionnel de cette région; sa forme française établie est conservée.
- source_word: Φοινίκην
  choice: Phénicie
  rationale: Forme française usuelle du nom régional.
