base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/004.yaml
  text: and he has appointed me to build a house for him in Jerusalem[b][a], which is in Judea.
translation:
  language: fr
  text: et il m’a chargé[a] de lui construire une maison[b] à Jérusalem, qui se trouve en Judée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « m’a ordonné » ou « m’a fait savoir que je devais ». Le verbe grec peut signifier faire connaître quelque chose ou confier une mission ; le parallèle hébreu souligne plus explicitement l’autorisation divine.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « un temple ». Le grec dit littéralement « une maison », expression biblique courante pour désigner le temple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσήμανέν
  choice: m’a chargé
  rationale: Dans cette construction avec un infinitif, le verbe peut exprimer le fait de faire connaître une mission ou d’en charger quelqu’un. « M’a chargé » rend naturellement l’idée de mandat sans imposer la force plus précise de « m’a ordonné ».
- source_word: οἰκοδομῆσαι
  choice: construire
  rationale: Le grec signifie simplement « construire ». Même si le contexte est celui d’une restauration, le verbe n’explicite pas ici l’idée de reconstruction.
- source_word: αὐτῷ
  choice: lui
  rationale: Le datif indique que la maison est construite pour Dieu et lui est destinée ; la tournure française « lui construire » exprime naturellement ce rapport.
- source_word: οἶκον
  choice: une maison
  rationale: Le grec emploie le mot courant pour « maison », qui peut désigner le sanctuaire comme la maison de Dieu. Le maintien de « maison » préserve cette formulation biblique, tandis que « temple » reste une explicitation possible.
- source_word: Ἰερουσαλήμ
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
- source_word: τῇ ἐν τῇ Ἰουδαίᾳ
  choice: qui se trouve en Judée
  rationale: Cette proposition rend la précision appositionnelle par laquelle le grec situe Jérusalem en Judée, dans une formulation française claire et naturelle.
theological_decisions:
- issue: Rendre οἶκον par « maison » ou expliciter « temple »
  choice: maison
  alternative: temple
  rationale: Le texte grec dit « maison » et laisse au contexte le soin d’identifier le sanctuaire. Ce choix conserve l’image biblique de la maison de Dieu sans substituer une explicitation interprétative au terme source.
- issue: Déterminer la force du mandat exprimé par ἐσήμανέν
  choice: m’a chargé
  alternative: m’a ordonné ; m’a fait savoir que je devais
  rationale: Le grec peut évoquer une indication, une communication ou une mission confiée. « M’a chargé » exprime ici l’autorisation et le mandat divins sans transformer nécessairement le verbe en ordre explicite.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec tout en évitant un calque lourd ; « qui se trouve en Judée » conserve la précision géographique explicite.
