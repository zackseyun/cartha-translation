base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/026.yaml
  text: They began to hinder those who were building[a], and the building of the temple in Jerusalem was stopped until the second year of the reign of Darius, king of the Persians.
translation:
  language: fr
  text: Ils se mirent à entraver ceux qui construisaient, et la construction du temple de Jérusalem resta à l’arrêt[a] jusqu’à la deuxième année du règne de Darius, roi des Perses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « demeura inactive ». Le verbe grec indique que les travaux de construction du temple ne se poursuivaient plus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: Ils se mirent à
  rationale: L’aoriste moyen de ἄρχω suivi de l’infinitif marque le commencement de l’action. « Se mirent à » est naturel en français moderne.
- source_word: κωλύειν
  choice: entraver
  rationale: Le verbe exprime une intervention qui gêne ou empêche l’activité. « Entraver » conserve cette idée sans anticiper à lui seul l’arrêt indiqué dans la proposition suivante.
- source_word: τοὺς οἰκοδομοῦντας
  choice: ceux qui construisaient
  rationale: Le participe présent désigne les personnes alors engagées dans les travaux et garde la valeur verbale du grec.
- source_word: ἤργει
  choice: resta à l’arrêt
  rationale: Le verbe décrit une construction qui ne se poursuit plus et demeure inactive. Cette formulation française rend l’état résultant sans préciser une cause grammaticale que le grec n’explicite pas.
- source_word: ἡ οἰκοδομή
  choice: la construction
  rationale: Le nom désigne ici l’activité ou le chantier de construction, et non seulement l’édifice achevé.
- source_word: τοῦ ἱεροῦ
  choice: du temple
  rationale: Dans ce contexte, ἱερόν désigne le temple ou son ensemble cultuel ; « temple » est le terme français le plus clair et usuel.
- source_word: τοῦ ἐν Ἰερουσαλήμ
  choice: de Jérusalem
  rationale: La tournure grecque localise le temple. Le complément français « de Jérusalem » est idiomatique et non ambigu dans ce contexte.
- source_word: μέχρι τοῦ δευτέρου ἔτους
  choice: jusqu’à la deuxième année
  rationale: μέχρι avec le génitif fixe le terme temporel de l’interruption.
- source_word: τῆς βασιλείας Δαρείου
  choice: du règne de Darius
  rationale: βασιλεία désigne ici l’exercice du pouvoir royal, donc le règne, et non le territoire du royaume.
- source_word: τοῦ Περσῶν βασιλέως
  choice: roi des Perses
  rationale: Cette traduction suit directement le génitif grec Περσῶν tout en restant naturelle et digne en français.
