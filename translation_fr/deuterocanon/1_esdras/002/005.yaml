  source_fidelity: 'Le texte français suit fidèlement le grec : « Ainsi donc » rend οὖν ; « appartient à son peuple » exprime ἐκ τοῦ ἔθνους αὐτοῦ sans anachronisme politique ; « que son Seigneur soit avec lui » respecte le possessif αὐτοῦ sans ajouter « Dieu ». La succession singulier (« qu’il monte ») puis pluriel (« qu’ils bâtissent ») reproduit correctement l’anomalie textuelle du participe singulier ἀναβὰς suivi de l’impératif pluriel οἰκοδομείτωσαν. La finale rend bien οὗτος ὁ κύριος ὁ κατασκηνώσας ἐν Ἰερουσαλήμ sans harmonisation avec Esdras MT.'
