base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/005.yaml
  text: Therefore[a], if any of you is from his people, may his Lord be with him[c][b], and let him go up to Jerusalem in Judea and build the house of the Lord of Israel—he is the Lord who dwells in Jerusalem.
translation:
  language: fr
  text: Ainsi donc, si l’un de vous appartient à son peuple, que son Seigneur soit avec lui et qu’il monte à Jérusalem, en Judée ; qu’ils bâtissent[a] la maison du Seigneur d’Israël — c’est lui, le Seigneur qui a établi sa demeure à Jérusalem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec passe du singulier (« l’un de vous », « son Seigneur », « avec lui », « qu’il monte ») au pluriel (« qu’ils bâtissent »). Cette rupture de nombre est conservée.
    reason: textual_variant
  - marker: b
    text: 'Le parallèle hébreu d’Esdras diffère nettement ici : il parle plutôt d’une aide en argent, en or, en biens et en bétail, accompagnée d’une offrande volontaire pour la maison de Dieu à Jérusalem. Le présent texte suit la forme grecque propre à 1 Esdras.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἴ τις ἐστὶν οὖν ὑμῶν
  choice: Ainsi donc, si l’un de vous
  rationale: « Ainsi donc » conserve la valeur déductive de οὖν, tandis que « si l’un de vous » rend naturellement la tournure grecque en français.
- source_word: ἐκ τοῦ ἔθνους αὐτοῦ
  choice: appartient à son peuple
  rationale: Dans le contexte du retour d’exil, ἔθνος désigne ici le peuple auquel appartient l’intéressé, plutôt qu’un État-nation au sens moderne.
- source_word: ἔστω ὁ κύριος αὐτοῦ μετʼ αὐτοῦ
  choice: que son Seigneur soit avec lui
  rationale: La formulation rend la valeur jussive de ἔστω sans ajouter « Dieu », absent du grec.
- source_word: ἀναβὰς εἰς τὴν Ἰερουσαλὴμ τὴν ἐν τῇ Ἰουδαίᾳ
  choice: qu’il monte à Jérusalem, en Judée
  rationale: « Monter » conserve l’expression traditionnelle du déplacement vers Jérusalem ; le participe est intégré à une construction exhortative naturelle en français.
- source_word: οἰκοδομείτωσαν
  choice: qu’ils bâtissent
  rationale: Le verbe grec est un impératif pluriel après une série de formes au singulier. Le français conserve volontairement cette rupture de nombre.
- source_word: τὸν οἶκον τοῦ κυρίου τοῦ Ἰσραήλ
  choice: la maison du Seigneur d’Israël
  rationale: Cette formulation suit le grec, qui ne contient pas θεός (« Dieu »), sans l’harmoniser avec une formule biblique plus familière.
- source_word: οὗτος ὁ κύριος ὁ κατασκηνώσας ἐν Ἰερουσαλήμ
  choice: c’est lui, le Seigneur qui a établi sa demeure à Jérusalem
  rationale: κατασκηνόω évoque le fait de dresser ou d’établir sa demeure. Le passé composé respecte la valeur du participe aoriste sans réduire la clause à une simple localisation.
theological_decisions:
- issue: Traduction de κύριος dans ce contexte grec de la Septante
  choice: Seigneur
  alternative: ÉTERNEL ; Maître
  rationale: Le texte source grec porte κύριος. « Seigneur » est le rendu divin naturel en français ; « ÉTERNEL » supposerait une rétroversion explicite vers le tétragramme, et « Maître » conviendrait moins ici.
- issue: Harmonisation éventuelle avec le parallèle hébreu d’Esdras
  choice: Conserver la formulation grecque sur le Seigneur qui a établi sa demeure à Jérusalem
  alternative: Le Dieu qui est à Jérusalem
  rationale: Le grec de 1 Esdras est la source première et contient une proposition explicite sur la demeure du Seigneur. Le parallèle massorétique diffère sensiblement et ne doit pas remplacer cette lecture.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste fluide tout en conservant l’inhabituelle rupture du singulier au pluriel et la formulation théologiquement marquée de la source grecque.
