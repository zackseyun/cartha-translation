revisions:
- from: Tu trouveras dans les archives ce qui a été écrit à ce sujet, et tu apprendras que cette ville était rebelle, qu’elle causait des troubles aux rois et aux villes, et que les Juifs qui s’y trouvaient étaient des rebelles et y organisaient des sièges depuis les temps anciens[a]. C’est pour cette raison que cette ville a été dévastée.
  to: Tu trouveras dans les archives ce qui a été écrit au sujet de ces faits, et tu sauras que cette ville était rebelle et qu’elle troublait les rois et les villes, que les Juifs étaient des rebelles et qu’ils avaient organisé des opérations de siège dans cette ville depuis les temps anciens[a]. C’est pour cette raison que cette ville a été dévastée.
  rationale: La révision rétablit la valeur accomplie de συνεσταμένοι et rattache explicitement « dans cette ville » aux opérations de siège, conformément à ἐν αὐτῇ. Elle maintient l’accusation politique, le registre moderne soutenu et l’ambiguïté lexicale de πολιορκίας au moyen d’une note ancrée au bon endroit.
