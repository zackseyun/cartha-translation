base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/019.yaml
  text: And you will find in the records what has been written about these things[a], and you will know that that city was rebellious, troubling kings and cities, and that the Jews in it were rebels and had established blockades from of old; for this reason that city was laid waste.
translation:
  language: fr
  text: Tu trouveras dans les archives ce qui a été écrit au sujet de ces faits, et tu sauras que cette ville était rebelle et qu’elle troublait les rois et les villes, que les Juifs étaient des rebelles et qu’ils avaient organisé des opérations de siège dans cette ville depuis les temps anciens[a]. C’est pour cette raison que cette ville a été dévastée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avaient établi des blocus dans cette ville depuis les temps anciens ». Le grec peut désigner plus largement des opérations de siège.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομνηματισμοῖς
  choice: archives
  rationale: Dans ce contexte administratif, le terme désigne des documents officiels conservés et consultables. « Archives » est naturel en français moderne et rend clairement ce cadre.
- source_word: γεγραμμένα
  choice: ce qui a été écrit
  rationale: Le participe parfait renvoie à des faits déjà consignés par écrit; cette formulation en conserve la valeur.
- source_word: ἀποστάτις
  choice: rebelle
  rationale: L’accusation est ici politique, dirigée contre une ville réputée hostile au pouvoir royal, et non une qualification d’apostasie religieuse.
- source_word: ὀχλοῦσα
  choice: causait des troubles
  rationale: Cette expression restitue l’idée d’une action perturbatrice répétée ou durable envers les rois et les villes.
- source_word: ἀποστᾶται
  choice: des rebelles
  rationale: Le contexte administratif et politique favorise le sens de personnes en révolte plutôt que celui d’apostats religieux.
- source_word: πολιορκίας συνεσταμένοι
  choice: organisaient des sièges
  rationale: πολιορκίας désigne des opérations de siège, tandis que συνεσταμένοι exprime leur mise en place ou leur organisation. L’imparfait français rend naturellement une activité établie de longue date.
- source_word: ἔτι ἐξ αἰῶνος
  choice: depuis les temps anciens
  rationale: La formule indique une ancienneté durable; ce rendu est clair, digne et non archaïsant.
- source_word: ἠρημώθη
  choice: a été dévastée
  rationale: Le passif exprime la mise en désolation de la ville. « A été dévastée » est idiomatique et conserve la force de l’accusation.
theological_decisions:
- issue: Nature de l’accusation portée contre la ville et les Juifs
  choice: Rébellion politique et activité hostile
  alternative: Apostasie religieuse
  rationale: Même si ἀποστάτις et ἀποστᾶται peuvent ailleurs prendre une coloration religieuse, la lettre administrative les emploie ici dans un contexte de sédition contre l’autorité royale. Le français « rebelle » préserve ce sens contextuel sans importer une lecture confessionnelle.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le tutoiement singulier correspond aux verbes grecs à la deuxième personne du singulier. La répétition de « cette ville » maintient la structure accusatoire et les démonstratifs du grec.
