base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/012.yaml
  text: 'And this was their number: a thousand gold libation bowls[a], a thousand silver libation bowls, twenty-nine silver censers, thirty gold bowls, two hundred and ten silver bowls[b], and a thousand other vessels.'
translation:
  language: fr
  text: 'En voici le nombre : mille coupes à libations en or, mille coupes à libations en argent, vingt-neuf brûle-parfums en argent, trente coupes en or, deux mille quatre cent dix coupes en argent[a] et mille autres ustensiles[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte une notation numérique correspondant à 2 400, suivie du mot « dix » : le total indiqué est donc 2 410.'
    reason: textual_variant
  - marker: b
    text: Le passage parallèle d’Esdras 1.9-10 dans le texte hébreu donne à cet endroit une liste et des nombres différents. Ici, la traduction suit l’inventaire grec de 1 Esdras.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ τούτων ἀριθμὸς ἦν
  choice: En voici le nombre
  rationale: Formule française naturelle qui introduit l’inventaire tout en conservant le renvoi aux objets déjà mentionnés.
- source_word: σπονδεῖα
  choice: coupes à libations
  rationale: Le terme désigne des récipients liés aux libations; cette formulation explicite leur fonction cultuelle sans employer un vocabulaire archaïque.
- source_word: χρυσᾶ / ἀργυρᾶ
  choice: en or / en argent
  rationale: Formulation idiomatique en français pour indiquer la matière des objets.
- source_word: θυίσκαι ἀργυραῖ
  choice: brûle-parfums en argent
  rationale: θυΐσκη désigne ici vraisemblablement un ustensile servant à brûler l’encens; « brûle-parfums » est clair et convient au contexte du temple.
- source_word: φιάλαι
  choice: coupes
  rationale: φιάλη désigne un récipient large et peu profond. « Coupes » reste compréhensible et évite l’archaïsme de « fioles », qui évoquerait à tort de petites bouteilles.
- source_word: ἀργυραῖ ,βυʹ δέκα
  choice: deux mille quatre cent dix coupes en argent
  rationale: Dans la notation numérique grecque, ,βυʹ représente 2 400; le mot δέκα ajoute dix, soit 2 410. Cette lecture suit directement le texte grec de Swete.
- source_word: ἄλλα σκεύη
  choice: autres ustensiles
  rationale: σκεύη est un terme général pour des objets ou instruments; « ustensiles » convient à cet inventaire du mobilier du temple sans limiter indûment leur forme.
theological_decisions:
- issue: Rapport entre l’inventaire grec de 1 Esdras et le parallèle hébreu d’Esdras 1.9-10
  choice: Traduire intégralement les objets et nombres du grec, y compris 2 410
  alternative: Harmoniser la liste avec le texte hébreu parallèle
  rationale: Le grec est la source primaire de ce passage et présente une liste réordonnée ou développée. L’harmoniser effacerait une différence textuelle réelle qui n’a pas à être résolue dans la traduction.
translation_notes:
  register: Français international moderne, clair et digne. La répétition des matières et des catégories est conservée pour respecter le caractère formel de l’inventaire. « Coupes à libations » distingue les σπονδεῖα fonctionnels des φιάλαι plus génériques, rendues simplement par « coupes ».
