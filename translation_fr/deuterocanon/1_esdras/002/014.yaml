  text: and it was brought up by Sheshbazzar together with those from the captivity[b][a], from Babylon to Jerusalem.
translation:
  language: fr
  text: Cela fut emporté par Sheshbatsar[a], avec les exilés[b], de Babylone à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « Samanassar ». « Sheshbatsar » est la forme employée dans le passage parallèle d’Esdras, généralement identifiée à ce personnage.'
    reason: alternative_reading
  - marker: b
    text: Le grec emploie un verbe au singulier (« fut emporté ») sans répéter ce qui fut emporté, probablement un objet mentionné dans le contexte précédent.
    reason: cross_reference
lexical_decisions:
- source_word: ἀνηνέχθη
  choice: Cela fut transporté
  rationale: L’aoriste passif singulier d’ἀναφέρω indique qu’un objet sous-entendu fut emporté vers Jérusalem. « Cela » conserve l’absence de nom exprimé sans imposer en français le genre de l’objet; « transporté » rend naturellement le déplacement, tandis que la destination explicite préserve l’idée de montée vers Jérusalem.
- source_word: ὑπὸ Σαμανασσάρου
  choice: par Sheshbatsar
  rationale: ὑπό avec le génitif désigne l’agent. « Sheshbatsar » est la forme française courante du personnage correspondant dans Esdras; la forme propre au grec est signalée en note afin de ne pas la masquer.
- source_word: ἅμα τοῖς ἐκ τῆς αἰχμαλωσίας
  choice: avec ceux qui revenaient de captivité
  rationale: ἅμα avec le datif signifie « avec, en même temps que ». La tournure française explicite naturellement que ces personnes venaient de la situation d’exil, sans les identifier plus précisément que le grec.
- source_word: ἐκ Βαβυλῶνος
  choice: de Babylone
  rationale: Rend directement le point de départ introduit par ἐκ.
- source_word: εἰς Ἱερουσαλήμ
  choice: à Jérusalem
  rationale: Rend naturellement la destination introduite par εἰς.
theological_decisions:
- issue: Identification de Σαμανασσάρος
  choice: Sheshbatsar dans le texte, avec la forme grecque en note
  alternative: Samanassar dans le texte
  rationale: Le grec demeure la source principale, mais le contexte parallèle d’Esdras permet d’identifier le personnage connu en français sous le nom de Sheshbatsar. La note conserve la transparence textuelle sans faire passer la forme harmonisée pour la graphie grecque.
- issue: Sujet singulier non exprimé de ἀνηνέχθη
  choice: Employer « Cela » et expliquer l’ellipse en note
  alternative: Nommer explicitement un vase ou un objet du Temple
  rationale: Le verbe grec est au singulier, mais le nom de ce qui fut transporté n’est pas répété. Ne pas préciser l’objet évite de résoudre une ellipse que le verset laisse ouverte.
translation_notes:
  register: Français moderne, sobre et digne. La syntaxe reste proche du grec tout en évitant un pronom français genré pour l’objet sous-entendu. « Revenaient de captivité » est plus idiomatique que le calque « ceux de la captivité ».
