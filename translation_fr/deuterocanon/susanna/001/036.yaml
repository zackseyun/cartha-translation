  text: But the two elders said[a], “We were walking in the garden of her husband,”
translation:
  language: fr
  text: 'Mais les deux anciens dirent : « Nous nous promenions dans le jardin[a] de son mari,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut aussi désigner un verger ou un parc clos ; ici, il s’agit du jardin privé rattaché à la maison de son mari.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ δύο πρεσβύτεροι
  choice: Mais les deux anciens
  rationale: « Anciens » exprime ici le statut reconnu de ces hommes au sein de la communauté, et pas seulement leur âge. « Mais » marque le tournant narratif introduit par δέ.
- source_word: εἶπαν
  choice: dirent
  rationale: Verbe introducteur de parole simple et naturel dans un récit au passé.
- source_word: Ἡμεῖς
  choice: Nous
  rationale: Le pronom grec est explicite et légèrement emphatique ; le français le rend naturellement par le sujet obligatoire « nous », sans ajouter une insistance artificielle.
- source_word: περιεπατοῦμεν
  choice: nous nous promenions
  rationale: L’imparfait rend l’action en cours exprimée par l’imparfait grec. « Se promener » convient au déplacement à pied dans un jardin sans préciser davantage son but.
- source_word: ἐν τῷ παραδείσῳ
  choice: dans le jardin
  rationale: Dans ce contexte domestique, παράδεισος désigne un espace cultivé et clos, non le paradis au sens céleste. « Jardin » est le terme français le plus clair, tandis qu’une note conserve les autres nuances possibles.
- source_word: τοῦ ἀνδρὸς αὐτῆς
  choice: de son mari
  rationale: Dans cette construction, ἀνήρ désigne le mari de Suzanne et le génitif indique l’appartenance du jardin.
