base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/061.yaml
  text: And they rose up against the two elders, because Daniel had convicted them from their own mouth of being false witnesses, and they did to them as they had maliciously planned to do.
translation:
  language: fr
  text: Alors on se souleva contre les deux anciens, car Daniel avait établi, par leurs propres paroles, qu’ils étaient de faux témoins[a]. On leur infligea ce qu’ils avaient projeté avec malveillance de faire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « car Daniel avait démontré, à partir de leur propre témoignage, qu’ils étaient de faux témoins ».'
    reason: lexical_alternative
  - marker: b
    text: 'La dernière proposition exprime une justice rétributive : les anciens subissent la peine qu’ils avaient voulu faire infliger à Suzanne.'
    reason: cross_reference
lexical_decisions:
- source_word: ἀνέστησαν ἐπὶ
  choice: on se souleva contre
  rationale: L’expression indique ici une action hostile et publique contre les anciens, et non le simple fait de se lever.
- source_word: πρεσβύτας
  choice: anciens
  rationale: Dans le récit, ces hommes exercent une autorité reconnue au sein de la communauté; « anciens » rend leur fonction, et pas seulement leur âge.
- source_word: συνέστησεν
  choice: avait établi
  rationale: Dans ce cadre judiciaire, Daniel a démontré leur culpabilité grâce à la contradiction de leurs dépositions. « Avait établi » préserve cette valeur probatoire sans anticiper formellement la sentence.
- source_word: ἐκ τοῦ στόματος αὐτῶν
  choice: par leurs propres paroles
  rationale: Cette formulation française naturelle conserve l’idée vive que leurs déclarations mêmes les ont confondus.
- source_word: ψευδομάρτυρας ὄντας
  choice: qu’ils étaient de faux témoins
  rationale: « Faux témoins » garde le sens spécifiquement judiciaire du grec.
- source_word: ἐποίησαν αὐτοὶ οὗν
  choice: on leur infligea
  rationale: Le grec exprime ce qui leur fut fait en retour. La formulation française rend clairement l’action de l’assemblée sans alourdir la phrase.
- source_word: τὸν τρόπον ἐπονηρεύσαντο
  choice: ce qu’ils avaient projeté avec malveillance de faire
  rationale: Le moyen grec renvoie à leur dessein mauvais contre Suzanne; la traduction conserve à la fois l’intention et sa malveillance.
theological_decisions:
- issue: Réciprocité judiciaire dans la peine
  choice: La communauté inflige aux anciens ce qu’ils avaient projeté de faire à Suzanne.
  alternative: « On agit envers eux de la manière dont ils avaient agi avec méchanceté. »
  rationale: Le contexte met en œuvre le principe juridique selon lequel les faux témoins subissent la peine qu’ils destinaient à l’innocent. La traduction rend cette force sans ajouter ici le nom de Suzanne dans le corps du verset.
translation_notes:
  register: Français international moderne, digne et accessible. Le tour impersonnel « on » représente naturellement l’assemblée évoquée par le contexte. Les deux marqueurs de notes [a] et [b] figurent dans le texte.
