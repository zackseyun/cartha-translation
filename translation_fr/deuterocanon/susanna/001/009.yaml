base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/009.yaml
  text: They twisted their minds and turned away their eyes so as not to look to heaven or remember righteous judgments[a][b].
translation:
  language: fr
  text: Ils corrompirent leur esprit et détournèrent les yeux pour ne pas regarder vers le ciel ni se souvenir des justes jugements[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « déformèrent leur pensée ». Le verbe grec peut évoquer aussi bien la déformation que la corruption morale.
    reason: lexical_alternative
  - marker: b
    text: « Justes jugements » peut aussi se traduire par « décisions justes » ou « justes ordonnances ». Il s’agit vraisemblablement des jugements ou des prescriptions de Dieu, mais le grec ne l’indique pas explicitement.
    reason: lexical_alternative
lexical_decisions:
- source_word: διέστρεψαν
  choice: pervertirent
  rationale: Le verbe exprime ici une déformation morale, un détournement de l’état juste; « pervertirent » conserve cette force sans préciser davantage la nature de la corruption.
- source_word: τὸν νοῦν αὐτῶν
  choice: leur esprit
  rationale: νοῦς désigne la faculté intérieure de pensée et de discernement moral. Le singulier distributif « leur esprit » est naturel en français et suit la formulation grecque.
- source_word: ἐξέκλιναν τοὺς ὀφθαλμοὺς αὐτῶν
  choice: détournèrent les yeux
  rationale: Cette expression française rend naturellement l’image concrète et volontaire du regard écarté.
- source_word: τοῦ μὴ βλέπειν εἰς τὸν οὐρανόν
  choice: pour ne pas regarder vers le ciel
  rationale: L’infinitif articulé avec μή indique ici le but; « vers le ciel » restitue l’orientation exprimée par εἰς sans expliciter Dieu.
- source_word: μηδὲ μνημονεύειν
  choice: ni se souvenir
  rationale: La coordination négative est conservée simplement; μνημονεύειν signifie rappeler ou garder en mémoire.
- source_word: κριμάτων δικαίων
  choice: des justes jugements
  rationale: κρίματα peut désigner des jugements, décisions ou ordonnances, tandis que δικαίων souligne leur justice. La traduction maintient la portée judiciaire et morale ainsi que l’absence de possessif explicite.
theological_decisions:
- issue: Référent du ciel et des justes jugements
  choice: Maintenir « le ciel » et « les justes jugements » sans possessif divin ajouté
  alternative: « regarder vers Dieu et se souvenir de ses justes jugements »
  rationale: Le contexte implique une orientation vers Dieu, mais le grec ne nomme pas Dieu et n’ajoute aucun possessif à « jugements ». La formulation retenue préserve cette implication sans la rendre explicite.
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans être archaïque. La construction reste proche du parallélisme grec tout en étant idiomatique.
