base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/032.yaml
  text: And the lawless men ordered her to be uncovered[a], so that they might satisfy their desire for her beauty.
translation:
  language: fr
  text: Et les hommes sans loi ordonnèrent qu’on la découvre, afin d’assouvir le désir que leur inspirait sa beauté[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « afin d’être remplis du désir de sa beauté »; le grec condense de manière inhabituelle l’idée d’être rassasiés, le désir et sa beauté.'
    reason: La formulation grecque est condensée et son image littérale serait lourde en français; la note en conserve les éléments sans imposer une analyse unique de la relation entre le désir et la beauté.
lexical_decisions:
- source_word: προσέταξαν
  choice: ordonnèrent
  rationale: Le verbe exprime un ordre donné avec autorité; « ordonnèrent » en conserve directement la force.
- source_word: οἱ παράνομοι
  choice: les hommes sans loi
  rationale: L’adjectif substantivé désigne ici les anciens et porte à la fois une condamnation morale et une nuance juridique. « Hommes » explicite naturellement le référent masculin pluriel.
- source_word: ἀποκαλύψαι αὐτήν
  choice: qu’on la découvre
  rationale: Le verbe signifie enlever ce qui couvre ou dévoiler. La tournure impersonnelle française rend l’action ordonnée sans préciser un agent que le grec ne nomme pas et sans suggérer davantage que le texte.
- source_word: ἵνα ἐμπλησθῶσιν
  choice: afin d’assouvir
  rationale: Le grec parle littéralement d’être remplis ou rassasiés. Dans cette construction, « assouvir » exprime en français courant l’idée de chercher à satisfaire un désir, tandis que la note conserve l’image littérale.
- source_word: τοῦ κάλλους
  choice: sa beauté
  rationale: κάλλος désigne la beauté ou l’attrait physique; le possessif français relie naturellement cette beauté à Suzanne.
- source_word: ἐπιθυμίας αὐτῆς
  choice: leur désir pour sa beauté
  rationale: ἐπιθυμία peut désigner un désir intense, y compris une convoitise sexuelle. « Désir » préserve l’étendue lexicale, tandis que le contexte en manifeste le caractère corrompu.
theological_decisions:
- issue: Caractérisation morale de οἱ παράνομοι
  choice: les hommes sans loi
  alternative: les hommes mauvais
  rationale: « Sans loi » maintient ensemble la désobéissance juridique et la condamnation morale présentes dans le terme grec, sans réduire celui-ci à une méchanceté générale.
- issue: Intensité et nature de ἐπιθυμία
  choice: désir
  alternative: convoitise
  rationale: Le contexte est manifestement sexuel et coupable, mais le nom grec possède une gamme de sens plus large. Le choix principal préserve cette latitude sans atténuer ce que la scène révèle.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase garde la qualification juridique et morale des anciens, évite d’expliciter la nature exacte de ce qui est retiré et rend idiomatiquement l’image grecque de satiété tout en la signalant en note.
