  yaml_path: translation/deuterocanon/susanna/001/052.yaml
  text: But when they had been separated[a], one from the other, he called one of them and said to him, “You who have grown old in evil days[b], now the sins that you were doing before have come upon you.”
translation:
  language: fr
  text: 'Mais lorsqu’ils eurent été séparés l’un de l’autre, il appela l’un d’eux et lui dit : « Toi qui as vieilli au fil de jours mauvais[a], maintenant les péchés que tu commettais autrefois[b] sont venus sur toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque est condensée : elle associe littéralement le fait d’avoir vieilli à des « jours mauvais ». La relation exacte entre l’homme et ces jours reste implicite.'
    reason: lexical_alternative
  - marker: b
    text: L’extrait grec de ce verset se termine par l’article τὸ, qui paraît se poursuivre avec le mot suivant pour former l’expression « autrefois » (τὸ πρότερον) au-delà de la limite du verset.
    reason: textual_variant
lexical_decisions:
- source_word: διεχωρίσθησαν
  choice: eurent été séparés
  rationale: L’aoriste passif indique qu’on avait séparé les deux anciens; le passé antérieur s’accorde naturellement avec la proposition temporelle et l’action principale au passé simple.
- source_word: εἷς ἀπὸ τοῦ ἑνός
  choice: l’un de l’autre
  rationale: Cette tournure française exprime clairement l’isolement réciproque des deux hommes tout en conservant l’idée singulière du grec.
- source_word: ἐκάλεσεν τὸν ἕνα αὐτῶν
  choice: il appela l’un d’eux
  rationale: « Appela » rend simplement καλέω; « fit venir » ou « convoqua » ajouterait une nuance plus officielle que le verbe grec n’impose pas.
- source_word: Πεπαιλαιωμένε ἡμερῶν κακῶν
  choice: Toi qui as vieilli dans des jours mauvais
  rationale: La formulation conserve la valeur participiale du parfait et le mot ἡμερῶν, « jours », sans décider si le mal caractérise surtout l’homme, sa conduite ou les jours qu’il a vécus.
- source_word: νῦν ἥκασιν αἱ ἁμαρτίαι σου
  choice: maintenant tes péchés […] sont venus sur toi
  rationale: Le parfait ἥκασιν présente les péchés passés comme désormais arrivés et présents devant lui; « sont venus sur toi » garde cette image judiciaire sans la remplacer par l’expression plus familière « t’ont rattrapé ».
- source_word: ἃς ἐποίεις
  choice: ceux que tu commettais
  rationale: En français, on « commet » des péchés. L’imparfait rend l’action passée répétée ou habituelle exprimée par ἐποίεις.
- source_word: τὸ [πρότερον]
  choice: autrefois
  rationale: L’extrait s’arrête à l’article τὸ, qui semble introduire l’expression adverbiale τὸ πρότερον à cheval sur la limite du verset. « Autrefois » en restitue le sens probable tout en signalant la difficulté dans une note.
theological_decisions:
- issue: Portée morale de l’adresse de Daniel à l’ancien
  choice: Une réprimande visant une longue histoire liée au mal, formulée sans préciser davantage le rapport entre l’homme et ses « jours mauvais ».
  alternative: « Vieillard endurci dans le mal », qui attribuerait explicitement le mal à son caractère et à sa conduite.
  rationale: Le contexte judiciaire donne clairement à l’adresse une force accusatrice, mais la construction grecque condensée πεπαλαιωμένε ἡμερῶν κακῶν ne justifie pas de supprimer « jours » ni de résoudre entièrement son lien syntaxique et moral.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le passé simple et le passé antérieur conviennent au récit biblique sans archaïsme marqué. La phrase conserve l’image des péchés « venus sur » l’accusé ainsi que l’ambiguïté de l’adresse grecque.
