base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/007.yaml
  text: These men saw a woman beautiful in appearance[a], a wife of one of their brothers from the sons of Israel, whose name was Susanna, daughter of Hilkiah, wife of Joakim, walking in her husband's garden in the evening.
translation:
  language: fr
  text: Ces hommes virent une femme belle à voir, l’épouse de l’un de leurs frères parmi les fils d’Israël[a]. Elle s’appelait Suzanne, fille d’Hélcias et femme de Joakim, et se promenait le soir dans le jardin de son mari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la femme de leur frère, d’entre les fils d’Israël ». La construction grecque est difficile ; elle semble présenter le mari de Suzanne comme l’un de leurs compatriotes israélites.'
    reason: Signaler une formulation grecque ambiguë et préserver son vocabulaire de parenté.
lexical_decisions:
- source_word: οὗτοι ἰδόντες
  choice: Ces hommes virent
  rationale: Le démonstratif renvoie aux hommes déjà présents dans le récit. Le participe aoriste reçoit ici naturellement la valeur d’un verbe narratif au passé simple.
- source_word: γυναῖκα ἀστεῖαν τῷ εἴδει
  choice: une femme belle d’apparence
  rationale: ἀστεῖος qualifie ici la beauté ou l’agrément extérieur, explicitement précisé par τῷ εἴδει. La formulation reste proche du grec tout en étant claire en français.
- source_word: γυναῖκα ἀδελφοῦ αὐτῶν ἐκ τῶν υἱῶν Ἰσραήλ
  choice: l’épouse de l’un de leurs frères parmi les fils d’Israël
  rationale: Cette traduction conserve le vocabulaire de fraternité et l’expression « fils d’Israël », tout en évitant de faire croire avec certitude qu’il s’agit du frère biologique commun aux deux hommes.
- source_word: ὄνομα Σουσάνναν
  choice: Elle s’appelait Suzanne
  rationale: Cette tournure rend naturellement en français la formule grecque indiquant le nom.
- source_word: θυγατέρα Χελκίου
  choice: fille d’Helcias
  rationale: Rendu généalogique direct; « Helcias » est la forme française traditionnelle correspondant au grec Χελκίας.
- source_word: γυναῖκα Ἰωακείμ
  choice: femme de Joakim
  rationale: Le génitif relationnel désigne Suzanne comme l’épouse de Joakim; la forme du nom suit le grec.
- source_word: περιπατοῦσαν
  choice: se promenait
  rationale: Dans le cadre d’un jardin, « se promenait » exprime naturellement le déplacement décrit par le participe, sans suggérer une activité supplémentaire.
- source_word: ἐν τῷ παραδείσῳ τοῦ ἀνδρὸς αὐτῆς
  choice: dans le jardin de son mari
  rationale: Dans ce contexte, παράδεισος désigne un jardin ou parc clos, et non le paradis au sens théologique.
- source_word: τὸ δειλινόν
  choice: le soir
  rationale: L’expression temporelle désigne le moment du soir; cette formulation est concise et idiomatique.
theological_decisions:
- issue: Sens du groupe difficile γυναῖκα ἀδελφοῦ αὐτῶν ἐκ τῶν υἱῶν Ἰσραήλ
  choice: l’épouse de l’un de leurs frères parmi les fils d’Israël
  alternative: la femme de leur frère, d’entre les fils d’Israël
  rationale: Le grec transmis est syntaxiquement difficile. Le texte semble souligner que Suzanne est l’épouse d’un homme appartenant, comme eux, au peuple d’Israël. Le rendu retenu préserve toutefois le langage de fraternité plutôt que de le réduire silencieusement à « une Israélite ».
translation_notes:
  register: Français international moderne, narratif et digne. La longue chaîne d’appositions du grec est répartie en deux phrases pour assurer la lisibilité, sans retrancher d’information. Le passé simple convient au récit écrit, tandis que l’imparfait décrit l’action en cours de Suzanne.
