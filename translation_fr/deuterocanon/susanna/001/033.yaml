  text: And all those with her were weeping[a], and all who knew her were weeping.
translation:
  language: fr
  text: Et tous ceux qui étaient avec elle[a] pleuraient, de même que tous ceux qui la connaissaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous ceux qui étaient auprès d’elle » ; l’expression grecque peut désigner largement les personnes qui l’accompagnaient ou faisaient partie de son entourage.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκλαιον
  choice: pleuraient
  rationale: L’imparfait grec exprime ici des pleurs en cours; l’imparfait français en restitue naturellement la durée.
- source_word: οἱ παρ᾽ αὐτῆς πάντες
  choice: tous ceux qui étaient avec elle
  rationale: L’expression désigne largement les personnes qui se trouvaient auprès d’elle ou faisaient partie de son entourage, sans permettre de préciser qu’il s’agissait uniquement de serviteurs ou de membres de sa maison.
- source_word: ὅσοι αὐτὴν ᾔδεισαν πάντες
  choice: tous ceux qui la connaissaient
  rationale: Cette formulation directe rend l’ensemble des personnes qui connaissaient Suzanne, sans ajouter de degré particulier de familiarité.
- source_word: πάντες … πάντες
  choice: tous … tous
  rationale: La répétition de « tous » conserve l’insistance du grec sur l’étendue collective des pleurs.
- source_word: καὶ … καὶ
  choice: Et … de même que
  rationale: Cette coordination française relie clairement les deux groupes tout en évitant une succession maladroite de « et ».
