base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/016.yaml
  text: And after turning back[a], they came to the same place, and when they questioned one another about the reason, they confessed their desire[b]; then together they arranged a time when they would be able to find her alone.
translation:
  language: fr
  text: Après être revenus sur leurs pas, ils se retrouvèrent au même endroit[a]. En se questionnant l’un l’autre sur la raison de leur retour, ils avouèrent leur désir[b]. Alors, ils fixèrent ensemble un moment où ils pourraient la trouver seule.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se réunirent » ; l’expression grecque peut souligner qu’ils se retrouvèrent ensemble plutôt que désigner précisément le même lieu.
    reason: lexical_alternative
  - marker: b
    text: Ici, « désir » désigne, dans le contexte, un désir sexuel coupable ; on pourrait aussi traduire par « convoitise » ou « désir charnel ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακάμψαντες
  choice: Après être revenus sur leurs pas
  rationale: Le participe exprime un retour ou un changement de direction; cette formulation rend clairement le mouvement physique dans un français naturel.
- source_word: ἐπὶ τὸ αὐτό
  choice: au même endroit
  rationale: Dans ce contexte narratif, l’expression désigne vraisemblablement le même lieu où les deux hommes se rejoignent.
- source_word: ἀνετάζοντες ἀλλήλους τὴν αἰτίαν
  choice: En se questionnant l’un l’autre sur la raison de leur retour
  rationale: ἀνετάζω signifie examiner ou questionner; l’ajout explicite « de leur retour » clarifie le référent implicite de « la raison » sans modifier le sens.
- source_word: ὡμολόγησαν τὴν ἐπιθυμίαν αὐτῶν
  choice: ils avouèrent leur désir
  rationale: ὁμολογέω exprime ici un aveu réciproque, tandis que ἐπιθυμία reste lexicalement « désir », avec une connotation sexuelle illicite fournie par le contexte.
- source_word: κοινῇ συνετάξαντο
  choice: ils convinrent ensemble
  rationale: L’adverbe souligne leur action concertée et le verbe moyen leur accord délibéré sur un plan commun.
- source_word: καιρόν
  choice: d’un moment
  rationale: καιρός désigne ici un moment approprié ou une occasion; « un moment » conserve la formulation temporelle tout en laissant le contexte exprimer l’opportunité recherchée.
- source_word: ὅτε αὐτὴν δυνήσονται εὑρεῖν μόνην
  choice: où ils pourraient la trouver seule
  rationale: Le conditionnel transpose naturellement dans un récit au passé la capacité future envisagée, et μόνην indique qu’elle serait sans compagnie.
