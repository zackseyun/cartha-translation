  text: So they sent for her, and she came with her parents and her children and all her relatives.
translation:
  language: fr
  text: Ils envoyèrent la chercher. Elle vint avec ses parents, ses enfants et toute sa parenté.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ils… donc
  rationale: δέ assure ici la progression du récit plutôt qu’une opposition marquée. « donc » relie naturellement la convocation au contexte précédent.
- source_word: ἀπέστειλαν
  choice: firent appeler
  rationale: Dans ce contexte, le verbe exprime l’envoi de quelqu’un pour convoquer Suzanne. « Faire appeler » rend cet emploi idiomatiquement en français.
- source_word: ἦλθεν
  choice: vint
  rationale: Aoriste narratif simple, rendu directement par le passé simple dans ce registre narratif digne.
- source_word: γονεῖς
  choice: parents
  rationale: Le pluriel désigne les parents sans préciser séparément le père et la mère.
- source_word: τέκνα
  choice: enfants
  rationale: Équivalent courant et clair dans cette énumération familiale.
- source_word: πάντες οἱ συγγενεῖς
  choice: tous les membres de sa famille
  rationale: συγγενεῖς désigne largement les personnes apparentées. Cette formulation est naturelle en français moderne et évite le sens parfois plus restreint de « proches ».
