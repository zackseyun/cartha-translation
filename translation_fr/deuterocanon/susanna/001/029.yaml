base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/029.yaml
  text: And it happened on the next day[a], when the people had gathered to her husband Joakim, that the two elders came, full of their lawless intent against Susanna to put her to death, and they said before the people, “Send for Susanna daughter of Hilkiah, who is the wife of Joakim.”
translation:
  language: fr
  text: 'Le lendemain, lorsque le peuple s’était rassemblé auprès de son mari Joakim, les deux anciens vinrent, pleins d’un dessein contraire à la loi contre Suzanne[a], afin de la faire mourir. Ils dirent devant le peuple : « Faites venir Suzanne, fille d’Helcias, la femme de Joakim. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « remplis d’une intention illégale » ou « animés d’un projet criminel ». Le grec souligne un dessein intérieur contraire à la loi et dirigé contre Suzanne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐπαύριον
  choice: Le lendemain
  rationale: Expression temporelle naturelle en français moderne, qui conserve clairement la succession du récit.
- source_word: συνῆλθεν ὁ λαὸς πρὸς τὸν ἄνδρα αὐτῆς Ἰωακείμ
  choice: le peuple se fut rassemblé auprès de son mari Joakim
  rationale: Le plus-que-parfait rend la circonstance antérieure introduite par ὡς; « auprès de » conserve le mouvement ou le rassemblement autour de Joakim sans transformer celui-ci en lieu.
- source_word: οἱ δύο πρεσβῦται
  choice: les deux anciens
  rationale: Dans ce récit judiciaire, le terme désigne des hommes investis d’une autorité communautaire, et non simplement deux hommes âgés.
- source_word: πλήρεις τῆς ἀνόμου ἐννοίας κατὰ Σουσάννης
  choice: pleins d’un dessein contraire à la loi contre Suzanne
  rationale: « Dessein » exprime la pensée devenue intention; « contraire à la loi » maintient la portée juridique de ἀνόμου, tandis que « contre Suzanne » traduit explicitement la valeur hostile de κατά avec le génitif.
- source_word: τοῦ θανατῶσαι αὐτήν
  choice: la faire mourir
  rationale: L’infinitif articularisé précise le but du dessein. « Faire mourir » convient à la mise à mort recherchée dans ce cadre judiciaire.
- source_word: Ἀποστείλατε ἐπὶ Σουσάνναν
  choice: Faites venir Suzanne
  rationale: Cette formulation idiomatique exprime l’ordre d’envoyer quelqu’un chercher Suzanne, sans alourdir la phrase.
- source_word: θυγατέρα Χελκίου
  choice: fille d’Helcias
  rationale: « Helcias » est la forme française biblique traditionnelle correspondant au grec Χελκίου.
- source_word: ἥ ἐστιν γυνὴ Ἰωακείμ
  choice: la femme de Joakim
  rationale: Dans ce contexte, γυνή désigne sans ambiguïté l’épouse; l’apposition française restitue naturellement l’identification publique.
theological_decisions:
- issue: Valeur de πρεσβῦται dans une scène judiciaire
  choice: anciens
  alternative: vieillards
  rationale: Le récit les présente comme des autorités reconnues devant le peuple assemblé. « Anciens » conserve cette fonction sociale et judiciaire, que « vieillards » réduirait à l’âge.
- issue: Portée de ἄνομος
  choice: contraire à la loi
  alternative: criminel; impie; illégal
  rationale: La formulation retenue garde visible la référence à la loi sans préciser abusivement s’il s’agit uniquement d’une illégalité civile ou d’une transgression religieuse.
translation_notes:
  register: 'Français international moderne, narratif et digne. La longue période grecque est divisée en deux phrases pour rester claire à l’oral comme à l’écrit. Les noms propres suivent les formes françaises bibliques usuelles : Suzanne, Joakim et Helcias.'
