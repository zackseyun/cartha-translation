  verdict: revise
  source_fidelity: 'Le sens du grec est globalement bien rendu : le rassemblement auprès de Joakim, la qualité d’anciens, le projet contraire à la loi dirigé contre Suzanne, son but mortel et l’ordre de la faire venir sont tous conservés. La relation de but exprimée par τοῦ θανατῶσαι αὐτήν mérite toutefois une formulation française plus directement rattachée au dessein.'
  naturalness: 'Le registre est digne et naturel dans l’ensemble. La séquence « contre Suzanne : la faire mourir » est néanmoins elliptique et heurtée en français moderne ; « afin de la faire mourir » rend clairement le but sans modifier le sens. « s’était rassemblé » est également plus usuel en français international moderne que le passé antérieur « se fut rassemblé » dans cette phrase narrative.'
  terminology: « Les deux anciens » restitue adéquatement πρεσβῦται dans son cadre communautaire et judiciaire. « Dessein contraire à la loi » préserve la portée de ἄνομος sans imposer une qualification doctrinale ou juridique plus étroite. Les formes Suzanne, Joakim et Helcias sont conservées conformément aux choix rédactionnels fournis.
