  text: Then all the people turned to him and said[a], “What is this word that you have spoken?”
translation:
  language: fr
  text: 'Alors tout le peuple se tourna vers lui et dit : « Quelle est cette parole que tu as prononcée[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que signifie cette parole que tu as prononcée ? » Le grec λόγος peut désigner une parole, une déclaration ou une affaire.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: se tourna
  rationale: Avec πρὸς αὐτόν, le verbe décrit le mouvement du peuple qui se tourne vers Daniel; « se tourna vers lui » est naturel et n’implique pas nécessairement un retour après un départ.
- source_word: πᾶς ὁ λαός
  choice: tout le peuple
  rationale: Cette formulation rend la portée collective et totalisante de πᾶς tout en restant idiomatique en français.
- source_word: Τίς ὁ λόγος οὗτος
  choice: Que signifie cette parole
  rationale: Dans ce contexte, la question porte naturellement sur le sens ou la portée des mots que Daniel vient de prononcer. « Parole » maintient le lien lexical avec λόγος sans imposer le sens plus large d’« affaire ».
- source_word: λελάληκας
  choice: tu viens de prononcer
  rationale: Le parfait grec souligne la pertinence présente de ce qui vient d’être dit. Cette tournure française restitue naturellement cet effet, tandis que « prononcer » convient bien à une parole publique.
