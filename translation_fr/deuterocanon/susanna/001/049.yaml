  text: Return to the court, for these men have borne false witness against her.
translation:
  language: fr
  text: Retournez au tribunal, car ces hommes ont porté un faux témoignage contre elle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστρέψατε
  choice: Retournez
  rationale: Impératif aoriste pluriel demandant aux personnes présentes de revenir au lieu ou à la procédure judiciaire. « Retournez » est direct, naturel et conserve l’idée de mouvement en arrière.
- source_word: κριτήριον
  choice: tribunal
  rationale: Dans ce contexte, le terme désigne le lieu ou l’instance où le jugement est rendu. « Tribunal » exprime clairement le cadre judiciaire en français moderne.
- source_word: ψευδῆ
  choice: faux
  rationale: Le mot qualifie ici le contenu du témoignage comme mensonger. Associé à « témoignage », « faux » donne une formulation juridique idiomatique.
- source_word: κατεμαρτύρησαν
  choice: ont porté un faux témoignage
  rationale: Le verbe signifie témoigner contre quelqu’un; avec ψευδῆ, il indique un témoignage mensonger. Cette tournure conserve la portée juridique et morale de l’accusation.
- source_word: αὐτῆς
  choice: contre elle
  rationale: Le génitif avec καταμαρτυρέω désigne la personne visée par le témoignage. « Contre elle » rend précisément cette force adversative.
theological_decisions:
- issue: Formulation judiciaire du faux témoignage
  choice: ont porté un faux témoignage contre elle
  alternative: ont témoigné faussement contre elle
  rationale: La formulation retenue préserve le caractère juridique de la scène ainsi que la résonance biblique du faux témoignage, tout en restant claire en français actuel.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve l’ordre impératif, le lien causal introduit par γάρ et la tonalité judiciaire du grec, sans archaïsme inutile.
