  yaml_path: translation/deuterocanon/susanna/001/045.yaml
  text: And as she was being led away to be put to death, God stirred up the holy spirit of a younger boy whose name was Daniel.
translation:
  language: fr
  text: Tandis qu’on l’emmenait pour la mettre à mort, Dieu éveilla l’esprit saint d’un jeune garçon nommé Daniel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαγομένης αὐτῆς ἀπολέσθαι
  choice: on l’emmenait pour la faire mourir
  rationale: Rend la construction passive et le but exprimé par l’infinitif, dans un français naturel, sans préciser un mode d’exécution absent du grec.
- source_word: ἐξήγειρεν
  choice: éveilla
  rationale: Conserve l’image d’un éveil ou d’une mise en mouvement intérieure plutôt que de la réduire à une simple inspiration.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: l’esprit saint
  rationale: La minuscule préserve l’ambiguïté entre l’action personnelle de l’Esprit Saint et l’esprit humain rendu saint ou mû par Dieu.
- source_word: παιδαρίου νεωτέρου
  choice: d’un garçon plus jeune
  rationale: Reproduit à la fois le diminutif désignant un jeune garçon et le comparatif νεωτέρου, dont le point de comparaison reste implicite.
- source_word: ᾧ ὄνομα Δανιήλ
  choice: nommé Daniel
  rationale: Formulation française concise et idiomatique pour « dont le nom était Daniel ».
theological_decisions:
- issue: Référent de « l’esprit saint »
  choice: Maintenir « l’esprit saint » sans majuscule interprétative
  alternative: « l’Esprit Saint » ou « son esprit saint »
  rationale: Le grec porte l’article mais ne tranche pas à lui seul entre une désignation pleinement personnelle de l’Esprit Saint et l’esprit du garçon suscité par Dieu; la traduction conserve cette tension.
translation_notes:
  register: Français moderne, clair et digne. La phrase garde le mouvement narratif du grec et évite un vocabulaire confessionnel ajouté.
