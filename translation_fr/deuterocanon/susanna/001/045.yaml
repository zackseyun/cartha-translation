    rationale: Le comparatif grec νεωτέρου a un point de comparaison implicite, mais le reproduire littéralement en français crée une légère lourdeur. « Un jeune garçon » transmet le sens pertinent de παιδάριον νεώτερον dans un français moderne fluide.
