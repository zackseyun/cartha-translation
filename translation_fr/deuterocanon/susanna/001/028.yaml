revisions:
- from: Mais ces hommes qui transgressaient la loi s’en retournèrent, se livrant entre eux à des menaces et lui tendant un piège afin de la faire mourir. Quand ils arrivèrent à l’assemblée de la ville, ils ne restèrent pas à l’écart[a], et tous les fils d’Israël[b] qui étaient là se réunirent.
  to: Mais ces hommes sans loi s’en retournèrent, proférant des menaces entre eux et lui tendant un piège pour la mettre à mort. Quand ils arrivèrent à l’assemblée de la ville, ils ne restèrent pas à l’écart[a], et tous les fils d’Israël[b] qui étaient là se réunirent.
  rationale: 'La révision rend le vocabulaire plus direct et idiomatique en français tout en maintenant l’équivalence formelle : « hommes sans loi » conserve la portée de παράνομοι, « proférant des menaces entre eux » garde prudemment la difficulté de ἀπειλοῦντες ἐν ἑαυτοῖς, et « pour la mettre à mort » rend sans ambiguïté le but meurtrier de ἵνα θανατώσωσιν αὐτήν. Les ancres et le contenu des notes sont conservés, avec une ponctuation française normalisée.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T11:49:47Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : les hommes repartent en nourrissant des menaces et un dessein meurtrier, puis sont présents à l’assemblée, où se réunissent les fils d’Israël. Toutefois, « faire mourir » peut en français suggérer une causalité indirecte et ne rend pas aussi directement θανατώσωσιν que « mettre à mort ».'
  naturalness: « Se livrant entre eux à des menaces » est compréhensible mais pesant et peu idiomatique. « Proférant des menaces entre eux » est plus naturel tout en conservant l’idée, difficile, de menaces échangées ou formulées au sein de leur groupe. « Hommes sans loi » est une formulation française biblique et actuelle, plus resserrée que « hommes qui transgressaient la loi ».
  terminology: « Assemblée », « fils d’Israël » et la note proposant « les Israélites » sont appropriés. « Mettre à mort » préserve le registre juridico-narratif sans imposer une interprétation doctrinale. La note sur la clause δύσκολη οὐ παρῴκουν conserve correctement l’incertitude textuelle et sémantique.
  issues:
  - severity: medium
    issue: « afin de la faire mourir »
    rationale: Cette expression française peut évoquer le fait de faire mourir quelqu’un par l’intermédiaire d’autrui ou par une cause indirecte. Le grec θανατώσωσιν exprime directement l’intention de la mettre à mort.
  - severity: low
    issue: « se livrant entre eux à des menaces »
    rationale: La construction est lourde en français moderne. Une formulation plus directe améliore la lisibilité sans résoudre artificiellement l’ambiguïté de ἐν ἑαυτοῖς.
  revised_text: Mais ces hommes sans loi s’en retournèrent, proférant des menaces entre eux et lui tendant un piège pour la mettre à mort. Quand ils arrivèrent à l’assemblée de la ville, ils ne restèrent pas à l’écart[a], et tous les fils d’Israël[b] qui étaient là se réunirent.
