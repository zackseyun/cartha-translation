base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/028.yaml
  text: But the lawless men turned back[a], threatening among themselves and lying in wait so that they might put her to death. And when they came to the assembly of the city, they did not stay away[b], and all the sons of Israel who were there gathered together.
translation:
  language: fr
  text: Mais ces hommes sans loi s’en retournèrent, proférant des menaces entre eux et lui tendant un piège pour la mettre à mort. Quand ils arrivèrent à l’assemblée de la ville, ils ne restèrent pas à l’écart[a], et tous les fils d’Israël[b] qui étaient là se réunirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La proposition traduite par « ils ne restèrent pas à l’écart » est difficile en grec ; dans ce contexte, elle semble indiquer qu’ils participèrent à l’assemblée de la ville au lieu de s’en tenir éloignés.
    reason: textual_variant
  - marker: b
    text: 'Ou « les Israélites ». Littéralement : « les fils d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παράνομοι ἄνδρες
  choice: ces hommes qui transgressaient la loi
  rationale: Cette formulation française naturelle conserve la portée juridique et morale de παράνομοι, plus précisément que le seul adjectif « méchants ».
- source_word: ἀπέστρεψαν
  choice: s’en retournèrent
  rationale: Le verbe exprime ici un mouvement de retour dans la suite du récit, sans préciser davantage la destination.
- source_word: ἀπειλοῦντες ἐν ἑαυτοῖς
  choice: se livrant entre eux à des menaces
  rationale: La tournure conserve le caractère interne et concerté de leurs menaces tout en rendant naturellement l’expression grecque difficile.
- source_word: ἐνεδρεύοντες
  choice: lui tendant un piège
  rationale: Le choix garde l’idée concrète d’une action secrète et hostile, plutôt que de réduire le terme au sens général de « comploter ».
- source_word: ἵνα θανατώσωσιν αὐτήν
  choice: afin de la faire mourir
  rationale: Cette proposition finale rend clairement le but exprimé par ἵνα et convient au contexte de mise à mort recherchée.
- source_word: συναγωγή
  choice: assemblée
  rationale: Dans ce contexte civique ou judiciaire, le mot désigne le rassemblement de la ville, non nécessairement un édifice religieux.
- source_word: οὐ παρῴκουν
  choice: ils ne restèrent pas à l’écart
  rationale: La clause est difficile. Cette traduction indique prudemment qu’ils prirent part à l’assemblée au lieu de s’en tenir éloignés.
- source_word: συνήδρευσαν
  choice: se réunirent
  rationale: Le verbe désigne le fait de se rassembler en séance; « se réunirent » est courant et précis.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: les fils d’Israël
  rationale: La traduction conserve l’expression familiale masculine explicite du grec; « les Israélites » reste une formulation française possible.
theological_decisions:
- issue: Désignation ethnique genrée
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le grec emploie explicitement l’expression masculine et familiale οἱ υἱοὶ Ἰσραήλ. La conserver évite de neutraliser sans nécessité la forme du texte source.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde la coloration juridique de παράνομοι, le caractère secret de l’action hostile et l’incertitude réelle de οὐ παρῴκουν, signalée en note.
