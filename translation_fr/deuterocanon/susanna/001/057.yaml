revisions:
- from: 'Voilà comment vous agissiez envers les filles d’Israël : prises de peur, elles avaient des relations avec vous[a]. Mais une fille de Juda n’a pas supporté votre mépris de la Loi[b].'
  to: 'C’est ainsi que vous agissiez envers les filles d’Israël : par peur, elles vous fréquentaient[a]. Mais une fille de Juda n’a pas supporté votre conduite sans loi[b].'
  rationale: 'La révision maintient l’aspect habituel de l’imparfait (« agissiez », « fréquentaient »), le singulier représentatif (« une fille de Juda »), ainsi que l’ambiguïté contextuellement chargée de ὁμιλέω. Elle remplace deux formulations qui imposaient un sens plus étroit que le grec : l’une sexuellement, l’autre comme mépris explicite de la Loi.'
