base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/057.yaml
  text: This is how you acted toward the daughters of Israel[a], and they, out of fear, associated with you; but a daughter of Judah did not endure your lawlessness.
translation:
  language: fr
  text: 'C’est ainsi que vous agissiez envers les filles d’Israël : par peur, elles vous fréquentaient[a]. Mais une fille de Juda n’a pas supporté votre conduite sans loi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « elles vous tenaient compagnie ». Le verbe grec peut signifier « fréquenter » ou « être en compagnie de ». Dans ce contexte de contrainte, il peut suggérer davantage que des relations sociales ordinaires, sans désigner explicitement un acte sexuel.
    reason: lexical_alternative
  - marker: b
    text: Ou « votre iniquité » ou « votre violation de la loi ». Le mot grec désigne une conduite mauvaise et contraire à la loi, avec une portée à la fois morale et juridique.
    reason: lexical_clarification
lexical_decisions:
- source_word: οὕτως ἐποιεῖτε
  choice: Voilà comment vous agissiez
  rationale: L’imparfait suggère une conduite répétée ou habituelle; cette tournure rend naturellement l’accusation rétrospective.
- source_word: θυγατράσιν Ἰσραήλ
  choice: les filles d’Israël
  rationale: Conserve l’expression biblique et le contraste rhétorique avec « une fille de Juda ».
- source_word: φοβούμεναι
  choice: prises de peur
  rationale: Rend la valeur causale du participe et souligne que leur conduite résultait de la peur.
- source_word: ὡμίλουν ὑμῖν
  choice: elles avaient des relations avec vous
  rationale: La formule française peut désigner des rapports suivis et, dans ce contexte coercitif, suggérer des relations intimes sans rendre le grec plus explicite qu’il ne l’est.
- source_word: ἀλλ᾽ οὐ θυγάτηρ Ἰούδα
  choice: Mais une fille de Juda n’a pas
  rationale: Préserve le singulier représentatif et l’opposition avec les « filles d’Israël », sans généraliser en « aucune fille de Juda ».
- source_word: ὑπέμεινεν
  choice: n’a pas supporté
  rationale: Rend le sens de subir, endurer ou tolérer, en français moderne et naturel.
- source_word: τὴν ἀνομίαν ὑμῶν
  choice: votre mépris de la Loi
  rationale: Exprime la portée morale et juridique de ἀνομία dans un français plus idiomatique que « illégalité », tout en conservant le rapport à la Loi.
theological_decisions:
- issue: Singulier représentatif dans « une fille de Juda »
  choice: une fille de Juda
  alternative: aucune fille de Juda; les filles de Juda
  rationale: Le singulier grec est maintenu afin que Suzanne soit présentée comme une représentante de Juda sans élargir l’affirmation au-delà du texte.
- issue: Portée morale et juridique de ἀνομία
  choice: mépris de la Loi
  alternative: iniquité; injustice; conduite contraire à la Loi
  rationale: Ce choix conserve ensemble la transgression morale et la référence normative à la Loi, sans réduire le terme à une seule catégorie.
translation_notes:
  register: Français international moderne, digne et accessible. L’imparfait marque la conduite habituelle des anciens. La formulation maintient l’ambiguïté du verbe ὁμιλέω et le poids juridico-moral de ἀνομία; les notes explicitent ces deux points sans résoudre excessivement le texte.
