base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/055.yaml
  text: Then Daniel said[a], “You have lied rightly against your own head; for already an angel of God, having received a sentence from God[b], will split you in two.”
translation:
  language: fr
  text: 'Alors Daniel dit : « Tu as menti pour ta propre perte[a] ! Car déjà un ange de Dieu, ayant reçu de Dieu une sentence[b], te fendra en deux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, « Tu as menti correctement / à juste titre contre ta propre tête. » La formule est probablement ironique : son faux témoignage fait retomber le jugement sur lui-même.'
    reason: lexical_alternative
  - marker: b
    text: Ou « une décision » ou « un ordre ». Le mot grec peut désigner une déclaration ou une décision judiciaire ; « sentence » convient au contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀρθῶς ἔψευσαι εἰς τὴν σεαυτοῦ κεφαλήν
  choice: Tu as menti pour ta propre perte
  rationale: La tournure grecque est fortement ironique et exprime que le mensonge retombe sur son auteur. Une traduction française strictement calquée (« justement contre ta propre tête ») serait peu naturelle; « pour ta propre perte » conserve le sens judiciaire et le retournement contre le faux témoin.
- source_word: ἤδη
  choice: déjà
  rationale: Conserve l'idée que l'exécution du jugement est d'ores et déjà engagée ou imminente.
- source_word: ἄγγελος τοῦ θεοῦ
  choice: un ange de Dieu
  rationale: L'absence d'article devant ἄγγελος favorise naturellement l'indéfini en français.
- source_word: λαβὼν φάσιν παρὰ τοῦ θεοῦ
  choice: a reçu de Dieu la sentence
  rationale: φάσις peut désigner une déclaration, une décision ou une sentence. Le contexte judiciaire favorise « sentence »; la restructuration en verbe principal est idiomatique en français.
- source_word: σχίσει σε μέσον
  choice: de te fendre en deux
  rationale: Rend directement la violence concrète de σχίζω et la division par le milieu exprimée par μέσον.
theological_decisions:
- issue: Nature de l'action angélique
  choice: Un ange de Dieu reçoit et exécute personnellement la sentence divine.
  alternative: Comprendre l'ange comme une manière générale d'annoncer le jugement de Dieu.
  rationale: Le grec nomme explicitement un ange comme agent et Dieu comme source de la sentence; la traduction garde cette représentation concrète sans la réduire à une abstraction.
- issue: Portée de la formule ironique initiale
  choice: Le mensonge entraîne la perte de celui qui l'a prononcé.
  alternative: Traduire littéralement ὀρθῶς par « justement » ou « correctement », au risque de laisser croire que Daniel approuve la véracité du témoignage.
  rationale: 'Le contexte montre une ironie judiciaire : l''accusation mensongère revient contre l''accusateur. La note signale la forme plus littérale et préserve cette tension.'
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe est légèrement restructurée pour éviter un participe lourd (« ayant reçu »), tout en conservant l'origine divine de la sentence, l'action personnelle de l'ange et la violence de l'image finale.
