base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/054.yaml
  text: 'Now then[a], if you saw this woman, tell us: under what tree did you see them talking with each other? And he said, “Under a mastic tree.”'
translation:
  language: fr
  text: 'Alors, si tu l’as vraiment vue, dis : sous quel arbre les as-tu vus s’entretenir l’un avec l’autre ? Il répondit : « Sous un lentisque[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le lentisque est aussi appelé arbre à mastic.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: Maintenant donc
  rationale: Conserve à la fois la transition déductive et l’immédiateté du défi, dans un registre français soutenu mais naturel.
- source_word: ταύτην
  choice: l’
  rationale: Le pronom renvoie sans ambiguïté à Suzanne dans le contexte; répéter « cette femme » serait plus lourd en français.
- source_word: εἴπερ εἶδες
  choice: si tu l’as vraiment vue
  rationale: « Vraiment » restitue la valeur emphatique et conditionnelle de εἴπερ sans transformer la condition en affirmation.
- source_word: εἰπὸν
  choice: dis-nous
  rationale: Rend l’impératif direct; « nous » explicite naturellement l’auditoire public, bien que le complément ne soit pas exprimé en grec.
- source_word: Ὑπὸ τί δένδρον
  choice: sous quel arbre
  rationale: Équivalent locatif direct et idiomatique.
- source_word: ἴδες
  choice: as-tu vus
  rationale: Forme interrogative naturelle, accordée avec le complément pluriel qui suit.
- source_word: ὁμιλοῦντας ἀλλήλοις
  choice: avoir des relations l’un avec l’autre
  rationale: Dans ce contexte d’accusation d’adultère, ὁμιλέω peut désigner des rapports intimes plutôt qu’une simple conversation. La formulation garde une certaine retenue et le réciproque ἀλλήλοις.
- source_word: σχῖνον
  choice: un lentisque
  rationale: Le lentisque (Pistacia lentiscus), aussi appelé arbre à mastic, est le référent botanique précis de σχῖνος; ce choix concis permet aussi de préserver la base lexicale du jeu de mots narratif.
