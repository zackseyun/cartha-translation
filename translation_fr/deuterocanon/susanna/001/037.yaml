  yaml_path: translation/deuterocanon/susanna/001/037.yaml
  text: And as we were going around the enclosed garden, we saw this woman lying with a man, and standing there we watched them talking with one another,
translation:
  language: fr
  text: En faisant le tour du jardin clos, nous avons vu cette femme se reposant avec un homme ; nous nous sommes arrêtés et les avons observés pendant qu’ils parlaient ensemble.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κυκλοῦντες τὸ στάδιον
  choice: en faisant le tour du jardin clos
  rationale: Le participe exprime le déplacement autour du lieu. Dans le contexte de Suzanne, στάδιον désigne l’espace clos du jardin plutôt que l’unité de distance appelée « stade ».
- source_word: ἀναπαυομένην μετὰ ἀνδρός
  choice: étendue auprès d’un homme
  rationale: ἀναπαύομαι indique qu’elle est allongée ou au repos ; « auprès de » conserve la proximité exprimée par μετά sans transformer à lui seul la scène en affirmation explicite d’un rapport sexuel.
- source_word: ἐθεωροῦμεν
  choice: les avons observés
  rationale: Le verbe implique un regard soutenu, mieux rendu par « observer » que par le simple « voir ».
- source_word: ὁμιλοῦντας ἀλλήλοις
  choice: pendant qu’ils parlaient ensemble
  rationale: Rend naturellement l’action simultanée et la réciprocité de ἀλλήλοις.
theological_decisions:
- issue: Nature précise de la proximité entre Suzanne et l’homme selon l’accusation
  choice: « étendue auprès d’un homme »
  alternative: « couchée avec un homme »
  rationale: Le grec décrit une femme au repos avec ou auprès d’un homme, mais ne formule pas explicitement ici l’acte sexuel. La traduction préserve cette marge sémantique sans atténuer le caractère compromettant de l’accusation.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe est fluidifiée sans supprimer la succession des actions rapportées par les témoins.
