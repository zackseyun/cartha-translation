base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/004.yaml
  text: And Joakim was exceedingly rich[a], and he had a garden adjoining his house[c][b]; and the Jews would come to him because he was more esteemed than all of them.
translation:
  language: fr
  text: Joakim[a] était extrêmement riche et possédait un jardin[b] attenant à sa maison. Les Juifs[c] venaient le trouver, parce qu’il était plus estimé que tous les autres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Joachim », selon la forme française traditionnelle; le grec porte Ἰωακείμ.
    reason: lexical_alternative
  - marker: b
    text: Ou « parc » ou « verger »; le mot grec peut désigner un domaine cultivé ou un jardin d’agrément clos.
    reason: lexical_alternative
  - marker: c
    text: Ou « les Judéens », si le terme est compris dans un sens géographique plutôt qu’ethnique ou religieux.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰωακείμ
  choice: Joakim
  rationale: Cette translittération reste proche de la forme grecque tout en étant aisément lisible en français; « Joachim » est la forme française traditionnelle.
- source_word: πλούσιος σφόδρα
  choice: extrêmement riche
  rationale: « Extrêmement » restitue la forte intensification exprimée par σφόδρα dans un français actuel et naturel.
- source_word: παράδεισος
  choice: jardin
  rationale: Dans ce contexte domestique, le terme désigne un domaine cultivé ou un jardin clos attenant à la demeure, et non le paradis au sens théologique.
- source_word: γειτνιῶν τῷ οἴκῳ αὐτοῦ
  choice: attenant à sa maison
  rationale: La tournure rend clairement l’idée de proximité immédiate, voire de contiguïté.
- source_word: πρὸς αὐτὸν προσήγοντο
  choice: venaient le trouver
  rationale: L’imparfait exprime l’action habituelle, et cette formulation française rend naturellement le mouvement vers Joakim sans imposer le sens passif « étaient conduits ».
- source_word: οἱ Ἰουδαῖοι
  choice: les Juifs
  rationale: Le contexte renvoie le plus naturellement à la communauté juive; « les Judéens » demeure possible si le terme est compris géographiquement.
- source_word: ἐνδοξότερον πάντων
  choice: plus estimé que tous les autres
  rationale: Le comparatif indique ici la considération et le rang social de Joakim, qui expliquent que les gens viennent à lui, sans lui attribuer une supériorité morale ou spirituelle.
theological_decisions:
- issue: Portée de la supériorité exprimée par ἐνδοξότερον πάντων
  choice: Une supériorité de réputation et de considération sociale
  alternative: « plus glorieux que tous » ou « plus illustre que tous »
  rationale: Le contexte met en avant le statut public de Joakim comme raison des visites; il ne formule pas de jugement sur sa sainteté ou sa justice.
translation_notes:
  register: Français international moderne, digne et accessible. L’imparfait restitue les états et l’action habituelle du récit. La formulation évite aussi bien un archaïsme excessif qu’une interprétation théologique de la notoriété de Joakim.
