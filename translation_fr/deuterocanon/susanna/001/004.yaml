  source_fidelity: 'Le texte rend fidèlement les éléments du grec : la grande richesse de Joakim (πλούσιος σφόδρα), le jardin jouxtant sa maison (παράδεισος γειτνιῶν τῷ οἴκῳ αὐτοῦ), la venue habituelle des Juifs auprès de lui (πρὸς αὐτὸν προσήγοντο) et sa considération sociale supérieure (ἐνδοξότερον πάντων). « Venaient le trouver » exprime naturellement l’imparfait itératif sans imposer indûment un sens passif. « Plus estimé » conserve la nuance de réputation publique plutôt qu’une excellence morale ou religieuse.'
