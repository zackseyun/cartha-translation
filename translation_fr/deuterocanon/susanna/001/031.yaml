  text: The woman was exceedingly delicate[a].
translation:
  language: fr
  text: La femme était d’une extrême délicatesse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « très raffinée », « très douce » ou « très belle par sa délicatesse » ; le grec τρυφερά peut évoquer la douceur ou un raffinement délicat, sans impliquer nécessairement une faiblesse morale.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: était
  rationale: δέ est ici un léger lien narratif, sans opposition marquée. En français, le rendre explicitement par « or » ou « mais » alourdirait la phrase et risquerait de surinterpréter sa valeur.
- source_word: ἡ γυνή
  choice: la femme
  rationale: γυνή peut signifier « femme » ou « épouse ». Ici, la phrase décrit Suzanne elle-même plutôt que sa relation conjugale; « la femme » conserve donc le sens immédiat du grec.
- source_word: τρυφερὰ
  choice: délicate
  rationale: L’adjectif peut évoquer la douceur, la délicatesse ou un raffinement associé au confort. « Délicate » préserve cette pluralité sans suggérer une faiblesse morale.
- source_word: σφόδρα
  choice: extrêmement
  rationale: σφόδρα renforce fortement l’adjectif; « extrêmement » en restitue l’intensité tout en restant naturel dans un récit de registre soutenu.
