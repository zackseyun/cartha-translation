  text: And no one was there except the two elders[a], hidden and watching her.
translation:
  language: fr
  text: Il n’y avait là personne, sauf les deux anciens, qui étaient cachés et l’observaient.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’épiaient ». Le verbe grec peut désigner une observation attentive, furtive ou hostile ; le texte retient la formulation plus neutre « l’observaient ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἦν οὐδεὶς
  choice: Il n’y avait là personne
  rationale: La double négation grecque exprime idiomatiquement l’absence de toute autre personne. Cette tournure est naturelle en français moderne.
- source_word: πλὴν
  choice: sauf
  rationale: Le terme introduit une exception; « sauf » rend clairement et sobrement cette fonction.
- source_word: οἱ δύο πρεσβύτεροι
  choice: les deux anciens
  rationale: Dans le récit, πρεσβύτεροι désigne des hommes investis du statut d’anciens, et non simplement deux hommes âgés.
- source_word: κεκρυμμένοι
  choice: qui s’étaient cachés
  rationale: Le participe parfait décrit l’état résultant de leur action antérieure; cette formulation française rend à la fois l’action de se cacher et leur dissimulation présente.
- source_word: παρατηροῦντες αὐτήν
  choice: l’observaient
  rationale: Le verbe désigne une surveillance attentive et peut, selon le contexte, comporter une nuance furtive ou hostile. « L’observaient » reste proche du grec sans expliciter excessivement leur intention.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la sobriété narrative du grec tout en rendant explicite, par une relative idiomatique, la relation des deux participes avec « les deux anciens ».
