base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/027.yaml
  text: But when the elders spoke their words[a], the servants were greatly ashamed, because never had such a thing been said about Susanna.
translation:
  language: fr
  text: Mais lorsque les anciens eurent tenu ces propos[a], les serviteurs éprouvèrent une grande honte, car jamais rien de tel n’avait été dit au sujet de Suzanne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « eurent fait ces déclarations » ou « eurent porté ces accusations ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡνίκα δὲ
  choice: Mais lorsque
  rationale: ἡνίκα introduit la circonstance temporelle, tandis que δέ marque ici une légère transition contrastive dans le récit.
- source_word: οἱ πρεσβῦται
  choice: les anciens
  rationale: Dans ce récit, πρεσβῦται désigne des anciens exerçant une autorité dans la communauté, et non simplement des hommes âgés.
- source_word: τοὺς λόγους αὐτῶν
  choice: ces propos
  rationale: λόγους désigne ce qu’ils viennent de déclarer. « Ces propos » est naturel en français et reste moins interprétatif que « ces accusations ».
- source_word: κατῃσχύνθησαν ... σφόδρα
  choice: éprouvèrent une grande honte
  rationale: Cette formulation rend l’état de honte exprimé par le verbe et l’intensification de σφόδρα, dans un français courant et digne.
- source_word: οἱ δοῦλοι
  choice: les serviteurs
  rationale: Dans ce cadre domestique, « serviteurs » convient aux membres de la maison sans imposer une précision de statut que le contexte immédiat ne développe pas.
- source_word: ὅτι πώποτε οὐκ ἐρρέθη
  choice: car jamais ... n’avait été dit
  rationale: La proposition donne la raison de leur honte; « jamais » restitue la négation emphatique et le plus-que-parfait situe naturellement le fait antérieur.
- source_word: λόγος τοιοῦτος
  choice: rien de tel
  rationale: En contexte, λόγος signifie une parole, une déclaration ou une allégation. « Rien de tel » est idiomatique tout en laissant le contenu exact ouvert; la note conserve les possibilités plus explicites.
- source_word: περὶ Σουσάννης
  choice: au sujet de Suzanne
  rationale: Cette expression rend sobrement περί avec le génitif sans renforcer implicitement le sens en « contre Suzanne ».
