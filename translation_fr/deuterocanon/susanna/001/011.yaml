- from: Dès que l’aube paraissait, ils venaient en se cachant l’un de l’autre[a] et se dépêchaient pour savoir lequel des deux se présenterait le premier à elle et lui parlerait.
  to: À l’aube, ils venaient en se cachant l’un de l’autre[a], se hâtant de voir lequel d’entre eux se montrerait le premier à elle et lui parlerait.
  rationale: La révision conserve le caractère habituel et furtif de la conduite des deux hommes, tout en améliorant l’idiomaticité française et en évitant d’ajouter une nuance temporelle ou cognitive non requise par le grec. La note maintient explicitement l’incertitude de l’expression grecque.
