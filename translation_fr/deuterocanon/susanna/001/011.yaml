base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/011.yaml
  text: And when dawn came[a], they would come, stealing away from one another in haste, to see which of them would appear to her first and speak with her.
translation:
  language: fr
  text: À l’aube, ils venaient en se cachant l’un de l’autre[a], se hâtant de voir lequel d’entre eux se montrerait le premier à elle et lui parlerait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie littéralement un verbe associé à l’idée de dérober ou de cacher « l’un l’autre ». Cette expression difficile semble indiquer qu’ils venaient furtivement, chacun à l’insu de l’autre.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐγίνετο ὄρθρος
  choice: Dès que l’aube paraissait
  rationale: L’imparfait inscrit la scène dans une conduite répétée; « l’aube paraissait » rend naturellement ἐγίνετο ὄρθρος en français.
- source_word: ἐρχόμενοι
  choice: ils venaient
  rationale: Le participe, associé à l’imparfait ἔκλεπτον, décrit leur comportement habituel.
- source_word: ἔκλεπτον ἀλλήλους
  choice: en se cachant l’un de l’autre
  rationale: L’expression difficile dérivée de κλέπτω évoque ici une action furtive à l’insu l’un de l’autre, et non un vol littéral.
- source_word: σπεύδοντες
  choice: se dépêchaient
  rationale: Le contexte de rivalité favorise l’idée de hâte, exprimée directement en français.
- source_word: τίς φανήσεται αὐτῇ πρότερος
  choice: lequel des deux se présenterait le premier à elle
  rationale: φανήσεται est pris au sens intransitif de « paraître, se montrer »; « se présenter à elle » est naturel et conserve l’idée d’être le premier à se faire voir de Suzanne.
- source_word: λαλήσει πρὸς αὐτήν
  choice: lui parlerait
  rationale: λαλέω avec πρός indique ici la parole adressée à une personne; « lui parler » en est l’équivalent français direct.
