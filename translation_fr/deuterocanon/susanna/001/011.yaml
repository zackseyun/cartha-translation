review_pass:
  verdict: revise
  source_fidelity: Le sens habituel de l’imparfait est bien rendu, de même que la furtivité réciproque, la hâte et la rivalité pour être le premier auprès de Suzanne. « Pour savoir » risque toutefois d’évoquer une recherche d’information, là où τίς φανήσεται introduit l’enjeu de voir lequel arrivera le premier. « Lequel des deux » dépend du contexte, mais « lequel d’entre eux » est plus directement fidèle à la formulation grecque.
  naturalness: « Dès que l’aube paraissait » est moins naturel et suggère une immédiateté que ὡς n’impose pas. « À l’aube » avec l’imparfait exprime naturellement une action répétée. « Se montrerait le premier à elle » est plus idiomatique que « se présenterait le premier à elle ».
  terminology: Aucun terme théologique n’est en jeu. La note doit éviter « ils se volaient l’un l’autre », formulation française ambiguë et inutilement littérale; elle peut signaler que le grec emploie un verbe lié à l’idée de dérober/cacher, tout en conservant l’incertitude idiomatique.
  issues:
  - severity: medium
    issue: « Dès que » et « pour savoir »
    rationale: « Dès que » ajoute une nuance d’immédiateté, et « pour savoir » peut faire de leur venue une enquête. Le grec décrit plutôt leur empressement à voir lequel se montrerait le premier.
  - severity: low
    issue: Formulation de la note littérale
    rationale: « Ils se volaient l’un l’autre » ne communique pas clairement en français la difficulté de ἔκλεπτον ἀλλήλους et peut être compris comme un vol matériel.
  - severity: low
    issue: « lequel des deux »
    rationale: Le contexte identifie deux anciens, mais le grec emploie simplement τίς; « lequel d’entre eux » évite d’expliciter davantage que nécessaire.
  revised_text: À l’aube, ils venaient en se cachant l’un de l’autre[a], se hâtant de voir lequel d’entre eux se montrerait le premier à elle et lui parlerait.
