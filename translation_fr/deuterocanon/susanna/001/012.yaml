base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/012.yaml
  text: And behold[a], she was walking about as usual, and one of the elders had come, and behold, the other arrived, and he questioned the other, saying[b], “Why did you go out so early without taking me along?”
translation:
  language: fr
  text: 'Et voici, elle se promenait comme d’habitude, et l’un des anciens était arrivé, et voici que l’autre arriva. Il interrogea l’autre[a] : « Pourquoi es-tu sorti de si bon matin sans m’emmener avec toi ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec passe rapidement de « l’un » à « l’autre » et ne précise pas davantage lequel des deux anciens prend ici la parole. La formulation conserve cette brusquerie du récit.
    reason: source_ambiguity
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici
  rationale: Ce marqueur discursif, répété deux fois, attire vivement l’attention sur ce qui se produit. « Voici » en conserve la force dans un français digne et naturel.
- source_word: κατὰ τὸ εἰωθὸς
  choice: comme d’habitude
  rationale: L’expression désigne une pratique habituelle; cette formulation courante en restitue directement le sens.
- source_word: περιεπάτει
  choice: se promenait
  rationale: L’imparfait grec présente une action en cours, et le verbe évoque ici le fait de marcher dans les lieux plutôt qu’un simple déplacement ponctuel.
- source_word: πρεσβυτέρων
  choice: anciens
  rationale: Dans le récit, il s’agit de responsables reconnus de la communauté; « anciens » préserve leur fonction aussi bien que leur âge.
- source_word: ἐλληλύθει
  choice: était arrivé
  rationale: Le plus-que-parfait grec situe cette arrivée avant celle de l’autre ancien.
- source_word: παρεγένετο
  choice: survint
  rationale: Le verbe marque l’arrivée du second ancien sur les lieux; « survint » maintient la vivacité du récit et distingue cette forme de ἐλληλύθει.
- source_word: ἀνέκρινε
  choice: interrogea
  rationale: Le verbe signifie questionner ou examiner. « Interrogea » conserve une nuance plus appuyée que le simple « demanda », sans imposer ici un cadre judiciaire formel.
- source_word: ὄρθρου
  choice: de si bon matin
  rationale: Le terme renvoie au point du jour ou au tout début de la matinée; l’expression française convient naturellement à la question directe.
- source_word: παραλαβὼν με
  choice: sans m’emmener avec toi
  rationale: Le participe exprime le fait de prendre quelqu’un avec soi comme compagnon; cette formulation explicite naturellement la relation implicite.
