  yaml_path: translation/deuterocanon/susanna/001/060.yaml
  text: And the whole assembly cried out with a loud voice[a], and they blessed God, who saves those who hope in him.
translation:
  language: fr
  text: Toute l’assemblée poussa un grand cri et bénit Dieu, qui sauve ceux qui espèrent en lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui mettent leur confiance en lui ». Le verbe grec signifie plus littéralement « espérer », mais, dans l’usage biblique, cette espérance peut comporter l’idée de s’en remettre à Dieu avec confiance.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεβόησεν
  choice: poussa un grand cri
  rationale: Le verbe exprime une forte exclamation. Cette tournure française est naturelle et conserve l’intensité de l’original.
- source_word: πᾶσα ἡ συναγωγή
  choice: toute l’assemblée
  rationale: Dans ce récit, συναγωγή désigne la communauté réunie, non l’institution appelée plus tard « synagogue ».
- source_word: φωνῇ μεγάλῃ
  choice: un grand cri
  rationale: L’idée de la « voix forte » est intégrée idiomatiquement au verbe français « pousser un grand cri », sans en perdre la force.
- source_word: εὐλόγησαν
  choice: bénit
  rationale: « Bénir Dieu » conserve le sens direct du verbe grec et appartient au registre biblique français. Le singulier s’accorde naturellement avec le nom collectif « assemblée ».
- source_word: τῷ θεῷ
  choice: Dieu
  rationale: Le datif désigne l’objet de la bénédiction.
- source_word: τῷ σώζοντι
  choice: qui sauve
  rationale: Le participe présent caractérise Dieu comme celui qui sauve.
- source_word: τοὺς ἐλπίζοντας ἐπ’ αὐτόν
  choice: ceux qui espèrent en lui
  rationale: Le choix conserve le sens premier du verbe ἐλπίζω ainsi que l’orientation de cette espérance vers Dieu.
theological_decisions:
- issue: Traduction de εὐλόγησαν τῷ θεῷ
  choice: bénit Dieu
  alternative: loua Dieu
  rationale: Bien que « louer » explicite le sens contextuel, « bénir Dieu » reflète plus directement εὐλογέω et reste une expression biblique intelligible en français.
- issue: 'Valeur de ἐλπίζοντας : espérer ou mettre sa confiance'
  choice: ceux qui espèrent en lui
  alternative: ceux qui mettent leur confiance en lui
  rationale: Le grec emploie explicitement le vocabulaire de l’espérance. Le texte principal le conserve sans effacer le chevauchement possible avec l’idée de confiance.
translation_notes:
  register: Français international moderne, clair et digne. « Toute l’assemblée » évite le sens institutionnel moderne de « synagogue ». La coordination au singulier est naturelle en français avec le nom collectif, même si le grec passe du singulier ἀνεβόησεν au pluriel εὐλόγησαν.
