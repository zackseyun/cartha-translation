base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/040.yaml
  text: After seizing her[a], we questioned her, ‘Who was the man?’ But she did not tell us who he was. These things we testify.
translation:
  language: fr
  text: 'Nous l’avons alors saisie et lui avons demandé : « Qui était cet homme ? » Mais elle ne nous a pas dit qui il était. Voilà ce dont nous témoignons.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενοι
  choice: Nous l’avons alors saisie
  rationale: Le participe aoriste moyen exprime ici une prise physique. « Saisir » en conserve la force, tandis que « alors » intègre naturellement la relation circonstancielle dans le récit.
- source_word: ἐπηρώτωμεν
  choice: lui avons demandé
  rationale: Dans ce contexte d’accusation, le verbe désigne une question insistante, mais « demander » reste naturel et n’ajoute pas la dureté que pourrait suggérer « interroger ».
- source_word: Τίς ὁ ἄνθρωπος;
  choice: Qui était cet homme ?
  rationale: La question porte sur l’identité du partenaire présumé. L’imparfait français convient au témoignage rétrospectif, et « cet homme » renvoie naturellement à l’homme dont il vient d’être question.
- source_word: οὐκ ἀπήγγειλεν ἡμῖν
  choice: elle ne nous a pas dit
  rationale: ἀπαγγέλλω signifie ici communiquer ou révéler une information. Cette formulation simple et courante n’implique pas davantage que le grec.
- source_word: τίς ἦν
  choice: qui il était
  rationale: La proposition vise l’identité de l’homme, non sa qualité ou son caractère.
- source_word: ταῦτα μαρτυροῦμεν
  choice: Voilà ce dont nous témoignons
  rationale: Cette tournure française naturelle conserve le vocabulaire explicite du témoignage ainsi que la portée judiciaire de μαρτυροῦμεν.
theological_decisions:
- issue: Registre judiciaire de l’accusation des anciens
  choice: Conserver explicitement le verbe « témoigner » dans la conclusion
  alternative: Employer une formule plus lisse telle que « Voilà notre témoignage »
  rationale: Le passage rapporte une accusation formulée devant une assemblée appelée à juger. Le verbe « témoigner » maintient la dimension légale sans renforcer ni atténuer leur prétention.
translation_notes:
  register: Français moderne, clair et digne. Le discours direct demeure naturel, tandis que la dernière phrase conserve le registre judiciaire du grec.
