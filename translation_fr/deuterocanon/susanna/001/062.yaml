  text: to the neighbor[a], to do according to the law of Moses; and they put them to death. And innocent blood was spared on that day.
translation:
  language: fr
  text: Ils leur firent ce qu'ils avaient voulu faire à leur prochain[a], conformément à la loi de Moïse ; ils les mirent à mort. Ce jour-là, le sang innocent fut épargné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec de ce verset continue syntaxiquement la phrase du verset précédent. Littéralement, il commence par « à leur prochain, faire selon la loi de Moïse » ; la traduction reprend explicitement « ce qu'ils avaient voulu faire » pour rendre la construction intelligible en français.
    reason: Précision syntaxique
lexical_decisions:
- source_word: τῷ πλησίον
  choice: à leur prochain
  rationale: Le datif dépend syntaxiquement de la phrase précédente et désigne la personne envers laquelle les anciens projetaient d’agir. La formulation compacte conserve cette dépendance sans préciser abusivement si l’action est faite « à » ou « contre » le prochain.
- source_word: ποιῆσαι κατὰ τὸν νόμον Μωϋσῆ
  choice: pour agir conformément à la loi de Moïse
  rationale: « Agir conformément à » rend naturellement ποιῆσαι κατά dans un contexte juridique tout en maintenant le lien explicite avec la loi mosaïque.
- source_word: ἀπέκτειναν αὐτούς
  choice: ils les mirent à mort
  rationale: Cette expression restitue le sens judiciaire du verbe sans introduire la technicité moderne que pourrait suggérer « exécuter ».
- source_word: ἐσώθη αἷμα ἀναίτιον
  choice: le sang innocent fut épargné
  rationale: La tournure conserve l’image biblique du sang innocent tout en exprimant que son effusion injuste a été empêchée.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: ce jour-là
  rationale: Équivalent temporel idiomatique et précis en français moderne.
theological_decisions:
- issue: Nuance judiciaire de ἀπέκτειναν
  choice: ils les mirent à mort
  alternative: ils les tuèrent ; ils les exécutèrent
  rationale: Le contexte rapporte l’application d’un jugement selon la loi de Moïse. « Mirent à mort » garde cette portée légale sans ajouter une terminologie pénale moderne.
- issue: Image de ἐσώθη αἷμα ἀναίτιον
  choice: le sang innocent fut épargné
  alternative: une effusion de sang innocent fut évitée ; le sang innocent fut sauvé
  rationale: 'Le choix maintient la métaphore biblique et sa gravité théologique, tout en restant compréhensible : Suzanne n’a pas subi une mise à mort injuste.'
- issue: Dépendance syntaxique du début du verset
  choice: conserver une formulation liée au verset précédent
  alternative: 'expliciter : « pour faire à leur prochain ce que prescrit la loi de Moïse »'
  rationale: Le grec commence par un datif rattaché à la proposition précédente. La traduction évite de reconstruire silencieusement une syntaxe plus déterminée que le texte transmis.
translation_notes:
  register: Français international moderne, sobre et digne. Le début volontairement compact reflète le fait que ce verset prolonge syntaxiquement le précédent ; la note empêche que cette construction ne paraisse être une erreur. Le vocabulaire juridique reste biblique sans devenir technique.
