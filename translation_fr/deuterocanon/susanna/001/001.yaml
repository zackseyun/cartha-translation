  text: There was a man living in Babylon[a], and his name was Joakim.
translation:
  language: fr
  text: Il y avait un homme qui habitait à Babylone et qui s’appelait Joakim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ΚΑΙ
  choice: non rendu séparément
  rationale: En tête de récit, καί assure ici une simple continuité narrative. Une traduction par « Et » serait possible, mais lourde dans ce verset français présenté isolément; le lien narratif demeure implicite.
- source_word: ἦν ἀνὴρ
  choice: Il y avait un homme
  rationale: Cette tournure française rend naturellement la construction présentative grecque qui introduit un personnage.
- source_word: οἰκῶν ἐν Βαβυλῶνι
  choice: à Babylone
  rationale: Avec « Il y avait », la localisation « à Babylone » exprime naturellement le fait que l’homme y habitait, sans recourir au plus lourd « qui habitait à Babylone ».
- source_word: καὶ ὄνομα αὐτῷ
  choice: nommé
  rationale: Le participe « nommé » rend de façon concise et idiomatique la formule grecque « et son nom [était] », sans en modifier le sens.
- source_word: Ἰωακείμ
  choice: Joakim
  rationale: « Joakim » représente directement la forme grecque Ἰωακείμ; « Joachim » est une forme française traditionnelle possible, mais moins transparente par rapport au texte source.
theological_decisions:
- issue: Translittération du nom ou forme française traditionnelle
  choice: Joakim
  alternative: Joachim
  rationale: Le choix suit directement la forme grecque et évite de substituer sans nécessité la forme traditionnelle française. Cette décision est onomastique plutôt que doctrinale.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation concise reste accessible et conserve la fonction d’introduction du verset. Aucune note n’est nécessaire, puisqu’aucune variante textuelle ou ambiguïté substantielle n’exige ici d’être signalée.
