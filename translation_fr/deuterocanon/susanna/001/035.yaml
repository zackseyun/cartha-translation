translation:
  language: fr
  text: Mais elle, en pleurs, leva les yeux vers le ciel, car son cœur avait mis sa confiance dans le Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλαίουσα
  choice: tout en pleurs
  rationale: Le participe présent décrit l’état continu de Suzanne; cette tournure française est naturelle et conserve la simultanéité avec le regard levé.
- source_word: ἀνέβλεψεν
  choice: leva les yeux
  rationale: Avec εἰς τὸν οὐρανόν, cette expression rend naturellement le mouvement du regard vers le haut.
- source_word: οὐρανόν
  choice: le ciel
  rationale: Dans ce contexte de confiance en Dieu, « le ciel » garde à la fois le sens spatial et la portée religieuse.
- source_word: καρδία
  choice: cœur
  rationale: Équivalent français usuel pour le siège intérieur de la confiance, de la volonté et des dispositions.
- source_word: πεποιθυῖα
  choice: mettait sa confiance
  rationale: Le parfait participial exprime une confiance établie et persistante; l’imparfait français présente cet état durable au moment du récit.
- source_word: ἐπὶ Κυρίῳ
  choice: dans le Seigneur
  rationale: « Mettre sa confiance dans le Seigneur » est idiomatique en français et exprime clairement l’orientation relationnelle de la confiance.
theological_decisions:
- issue: Traduction de κύριος dans un récit grec deutérocanonique exprimant la confiance religieuse
  choice: le Seigneur
  alternative: le SEIGNEUR
  rationale: Le témoin grec porte Κυρίῳ sans faire apparaître ici un nom divin hébreu distinct; « le Seigneur » traduit donc directement κύριος sans introduire une distinction absente du texte source.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la relation causale introduite par ὅτι et l’état durable de confiance exprimé par le parfait grec.
