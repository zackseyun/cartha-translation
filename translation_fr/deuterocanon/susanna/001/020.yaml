base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/020.yaml
  text: And they did as she said[a], and they shut the doors of the garden and went out by the side doors to bring what had been ordered for them, and they did not see the elders, because they were hidden.
translation:
  language: fr
  text: 'Elles firent comme elle l’avait dit : elles fermèrent les portes du jardin[a] et sortirent par les portes latérales pour apporter ce qui leur avait été demandé. Elles ne virent pas les anciens, car ils étaient cachés.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec désigne ici un jardin clos ou un parc, et non le « paradis » au sens théologique ultérieur.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν καθὼς εἶπεν
  choice: Elles firent ce qu’elle avait dit
  rationale: Le sujet féminin ressort du contexte et de αὐταῖς plus loin dans la phrase. Le plus-que-parfait français situe naturellement les paroles de Suzanne avant leur exécution.
- source_word: ἀπέκλεισαν τὰς θύρας τοῦ παραδείσου
  choice: elles fermèrent les portes du jardin
  rationale: ἀποκλείω exprime ici la fermeture sans indiquer explicitement un verrouillage. παράδεισος désigne dans ce récit un jardin clos, non le paradis au sens théologique ultérieur.
- source_word: κατὰ τὰς πλαγίας θύρας
  choice: par les portes latérales
  rationale: κατά avec l’accusatif indique ici le passage emprunté; «portes latérales» rend clairement les accès secondaires tout en conservant θύρας.
- source_word: ἐνέγκαι τὰ προστεταγμένα αὐταῖς
  choice: pour aller chercher ce qui leur avait été demandé
  rationale: L’infinitif exprime le but de leur sortie. Dans ce contexte, «aller chercher» rend idiomatiquement l’idée de rapporter les objets demandés, tandis que la tournure passive préserve l’absence d’agent explicite.
- source_word: οὐκ εἴδοσαν τοὺς πρεσβυτέρους
  choice: Elles ne virent pas les anciens
  rationale: La traduction conserve le sens concret de «voir». «Les anciens» rend leur statut reconnu dans le récit plutôt que leur seul âge.
- source_word: ὅτι ἦσαν κεκρυμμένοι
  choice: car ils s’étaient cachés
  rationale: 'Cette formulation française naturelle rend l’état résultant exprimé par le participe parfait: les hommes s’étaient dissimulés et demeuraient cachés.'
