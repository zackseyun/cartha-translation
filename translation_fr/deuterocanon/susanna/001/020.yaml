review_pass:
  verdict: revise
  source_fidelity: 'La structure et les principaux référents sont bien rendus : les femmes exécutent l’instruction, ferment les portes du jardin, passent par les portes latérales sans voir les anciens. Toutefois, « aller chercher » interprète ἐνέγκαι (« apporter, amener ») et « ils s’étaient cachés » transforme l’état passif κεκρυμμένοι (« étaient cachés / dissimulés ») en action réflexive.'
  naturalness: Le français est clair, moderne et d’un registre narratif approprié. « Elles firent comme elle l’avait dit » est légèrement plus naturel que « ce qu’elle avait dit » tout en exprimant plus directement καθὼς εἶπεν.
  terminology: « Jardin » rend correctement παράδεισος dans ce contexte, et la note écarte utilement le sens théologique ultérieur de « paradis ». « Les anciens » conserve le statut social de πρεσβύτεροι. « Portes latérales » est naturel et suffisamment précis.
  issues:
  - severity: medium
    issue: « pour aller chercher » pour ἐνέγκαι
    rationale: Le grec emploie l’infinitif de φέρω, « apporter / amener ». Le contexte peut laisser supposer qu’elles vont d’abord chercher les objets, mais cette étape n’est pas exprimée par le verbe et ne doit pas être introduite dans la traduction.
  - severity: medium
    issue: « car ils s’étaient cachés » pour ἦσαν κεκρυμμένοι
    rationale: Le participe parfait passif décrit les anciens comme étant dans un état de dissimulation. La formulation réflexive affirme qu’ils se sont eux-mêmes cachés, ce que la voix passive grecque ne précise pas.
  revised_text: 'Elles firent comme elle l’avait dit : elles fermèrent les portes du jardin[a] et sortirent par les portes latérales pour apporter ce qui leur avait été demandé. Elles ne virent pas les anciens, car ils étaient cachés.'
