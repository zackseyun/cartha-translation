  to: 'Elles firent comme elle l’avait dit : elles fermèrent les portes du jardin[a] et sortirent par les portes latérales pour apporter ce qui leur avait été demandé. Elles ne virent pas les anciens, car ils étaient cachés.'
  rationale: La révision conserve la segmentation claire de la phrase française et tous ses référents, tout en rendant plus exactement l’infinitif ἐνέγκαι par « apporter » et l’état passif κεκρυμμένοι par « étaient cachés ». La note demeure correctement ancrée à « jardin » et conserve sa fonction lexicale.
