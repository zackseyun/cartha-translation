  source_fidelity: Le participe présent φοβουμένη est bien rendu par « elle craignait le Seigneur », expression biblique appropriée. En revanche, l’aoriste ἐδίδαξαν ne justifie pas le plus-que-parfait « avaient instruit », qui introduit une antériorité absente du grec ; le passé simple rend directement l’action narrative. La note doit aussi présenter σφόδρα comme « extrêmement / très », plutôt que comme la locution moins littérale « au plus haut point ».
  naturalness: La première portion reste nécessairement elliptique, puisqu’elle reprend une qualification située dans la proposition précédente. « Très[a], et elle craignait le Seigneur » conserve cette dépendance tout en étant ponctué de façon lisible. Le reste est naturel dans un registre biblique moderne.
  terminology: « Le Seigneur », « justes », « parents », « leur fille » et « conformément à la loi de Moïse » sont exacts et adaptés au français international moderne. « Enseignèrent » est plus direct et source-fidèle que « avaient instruit ».
