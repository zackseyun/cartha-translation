translation:
  language: fr
  text: Très[a], et elle craignait le Seigneur ; ses parents étaient justes, et ils enseignèrent à leur fille conformément à la loi de Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « extrêmement » ou « très » ; cette expression poursuit la description de Suzanne commencée dans la proposition précédente.
    reason: Le début du verset dépend grammaticalement du contexte précédent et pourrait autrement paraître incomplet.
lexical_decisions:
- source_word: σφόδρα
  choice: au plus haut point
  rationale: L’adverbe intensifie une qualité exprimée dans la proposition précédente. Cette formulation conserve sa force sans réintroduire dans ce verset l’adjectif sous-entendu.
- source_word: φοβουμένη
  choice: elle craignait
  rationale: Le participe exprime ici une crainte révérencielle envers Dieu. Une proposition verbale est plus naturelle en français tout en maintenant le lien lexical avec la crainte.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Rend directement le titre grec κύριος lorsqu’il désigne le Dieu d’Israël, sans substituer le nom divin hébreu absent du texte grec.
- source_word: γονεῖς
  choice: parents
  rationale: Désigne collectivement le père et la mère de Suzanne; « parents » est précis et idiomatique.
- source_word: δίκαιοι
  choice: justes
  rationale: Conserve la portée morale et religieuse du terme biblique sans le réduire à son sens judiciaire.
- source_word: ἐδίδαξαν
  choice: avaient instruit
  rationale: Le plus-que-parfait rend naturellement l’instruction antérieure de Suzanne dans ce récit; « instruire » accepte directement la personne comme complément.
- source_word: τὴν θυγατέρα αὐτῶν
  choice: leur fille
  rationale: Préserve explicitement la relation familiale exprimée par le grec.
- source_word: κατὰ τὸν νόμον Μωυσῆ
  choice: conformément à la loi de Moïse
  rationale: κατά avec l’accusatif indique ici la norme à laquelle l’instruction se conformait.
theological_decisions:
- issue: Sens religieux de φοβουμένη
  choice: elle craignait le Seigneur
  alternative: elle révérait le Seigneur
  rationale: « Craindre le Seigneur » garde l’expression biblique et sa tension entre crainte et révérence, plutôt que de n’en retenir que l’aspect dévotionnel.
- issue: Désignation de Dieu par κύριος
  choice: le Seigneur
  alternative: l’Éternel
  rationale: Le texte source porte κύριος et non le tétragramme hébreu; « le Seigneur » respecte donc la primauté du grec.
- issue: Caractère moral exprimé par δίκαιοι
  choice: justes
  alternative: droits
  rationale: « Justes » préserve la résonance éthique et religieuse de la famille lexicale de la justice dans la langue biblique.
translation_notes:
  register: Français international moderne, digne et accessible. La première proposition demeure volontairement dépendante du contexte précédent, comme dans le texte grec; la note signale cette particularité sans compléter silencieusement l’adjectif omis.
