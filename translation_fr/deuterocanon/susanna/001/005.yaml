base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/005.yaml
  text: 'And in that year two elders from the people were appointed as judges[a], concerning whom the Master had spoken: “Lawlessness came out from Babylon, from elders who were judges[b], who seemed to govern the people.”'
translation:
  language: fr
  text: 'Cette année-là, deux anciens du peuple furent désignés comme juges. C’est à leur sujet que le Maître[a] avait déclaré : « L’iniquité est sortie de Babylone, venant d’anciens qui étaient juges et qui semblaient gouverner le peuple[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Seigneur » ou « le Souverain ». Le grec emploie δεσπότης, et non le titre plus courant κύριος.
    reason: lexical_alternative
  - marker: b
    text: 'La fin de la phrase est condensée en grec. On peut aussi comprendre : « qui étaient réputés gouverner le peuple ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεδείχθησαν
  choice: furent désignés
  rationale: Dans ce contexte de charge publique, le verbe indique la désignation à une fonction plutôt qu’une simple manifestation.
- source_word: πρεσβύτεροι
  choice: anciens
  rationale: Le terme désigne ici vraisemblablement des responsables de la communauté, et non simplement des hommes âgés.
- source_word: κριταὶ
  choice: juges
  rationale: Le contexte présente explicitement leur fonction judiciaire.
- source_word: δεσπότης
  choice: le Maître
  rationale: Ce choix conserve la distinction lexicale entre δεσπότης et κύριος tout en convenant au référent divin.
- source_word: ἀνομία
  choice: l’impiété
  rationale: Le terme exprime ici une conduite contraire à la loi et à la justice; « impiété » est dignifié et naturel en français biblique moderne sans réduire le sens à une infraction précise.
- source_word: ἐξῆλθεν ἐκ Βαβυλῶνος
  choice: est sortie de Babylone
  rationale: La formulation conserve directement l’image d’un mal qui émane de Babylone.
- source_word: οἱ ἐδόκουν κυβερνᾷν τὸν λαόν
  choice: qui semblaient gouverner le peuple
  rationale: « Semblaient » préserve l’ambiguïté entre apparence et réputation, ainsi que la distance ironique créée par leur corruption.
theological_decisions:
- issue: Titre divin δεσπότης
  choice: le Maître
  alternative: le Seigneur; le Souverain
  rationale: « Le Maître » maintient le titre distinct de κύριος sans imposer une interprétation confessionnelle particulière.
- issue: Portée de ἐδόκουν
  choice: qui semblaient gouverner le peuple
  alternative: que l’on croyait gouverner le peuple
  rationale: Le grec permet soit une apparence trompeuse, soit l’opinion que le peuple avait d’eux; le texte principal garde la première nuance et la note signale la seconde.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe a été légèrement décomprimée pour la clarté, tout en maintenant la répétition des fonctions d’anciens et de juges ainsi que l’ambiguïté de ἐδόκουν.
