revisions:
- from: 'Cette année-là, deux anciens du peuple furent désignés comme juges. C’est à leur sujet que le Maître[a] avait déclaré : « L’impiété est sortie de Babylone, venant d’anciens qui étaient juges et qui semblaient gouverner le peuple[b]. »'
  to: 'Cette année-là, deux anciens du peuple furent désignés comme juges. C’est à leur sujet que le Maître[a] avait déclaré : « L’iniquité est sortie de Babylone, venant d’anciens qui étaient juges et qui semblaient gouverner le peuple[b]. »'
  rationale: Une correction limitée remplace « impiété » par « iniquité », qui couvre plus justement la portée juridique et morale de ἀνομία. La note b est reformulée afin d’exprimer plus naturellement en français l’alternative selon laquelle les anciens étaient tenus pour gouverner le peuple. Le reste du texte préserve fidèlement le grec, y compris la distinction entre les titres divins et l’ambiguïté de ἐδόκουν.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T11:49:47Z'
review_pass:
  verdict: revise
  source_fidelity: 'La structure et les fonctions sont bien rendues : deux anciens issus du peuple sont désignés juges, et la double qualification « anciens » / « juges » est conservée. « Sembl[aient] gouverner » préserve de façon recevable l’ambiguïté de ἐδόκουν. En revanche, ἀνομία vise d’abord ce qui est contraire à la loi, à la justice ou à l’ordre juste ; « impiété » le réduit trop facilement à l’irréligion. « Iniquité » rend mieux le terme sans imposer une interprétation étroite.'
  naturalness: Le français est fluide, digne et adapté à un registre biblique moderne. La phrase détachée « C’est à leur sujet que… » est naturelle et clarifie la relative grecque. La note b peut toutefois formuler plus exactement l’alternative passive de ἐδόκουν.
  terminology: « Anciens », « juges » et « le Maître » sont des choix cohérents. « Le Maître » maintient utilement la distinction avec κύριος, avec des alternatives signalées en note. Le remplacement d’« impiété » par « iniquité » améliore la précision sémantique de ἀνομία.
  issues:
  - severity: medium
    issue: « L’impiété » pour ἀνομία
    rationale: En français moderne, « impiété » évoque principalement le manque de respect envers Dieu ou le sacré. Le grec ἀνομία désigne plus largement l’absence de loi, l’injustice ou l’iniquité, particulièrement pertinente dans un contexte de juges corrompus.
  - severity: low
    issue: Formulation de l’alternative en note b
    rationale: « Que l’on croyait gouverner le peuple » est grammaticalement possible, mais moins net que « qui étaient réputés gouverner le peuple » pour exprimer la lecture passive possible de ἐδόκουν.
