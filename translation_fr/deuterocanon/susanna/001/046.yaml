  text: And he cried out with a loud voice[a], “I am innocent of this woman’s blood.”
translation:
  language: fr
  text: 'Alors il cria d’une voix forte : « Je suis innocent du sang de cette femme. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβόησεν
  choice: il cria
  rationale: Le verbe βοάω désigne un cri lancé avec force. « Cria » est naturel en français moderne et conserve cette intensité.
- source_word: φωνῇ μεγάλῃ
  choice: d’une voix forte
  rationale: Cette expression au datif indique la manière. « D’une voix forte » en restitue directement et naturellement le sens.
- source_word: Ἀθῷος
  choice: innocent
  rationale: L’adjectif signifie exempt de faute ou de responsabilité. « Innocent » convient au contexte judiciaire et moral.
- source_word: ἀπὸ τοῦ αἵματος ταύτης
  choice: du sang de cette femme
  rationale: Le démonstratif féminin renvoie à la femme, et l’expression biblique du sang désigne ici la responsabilité de sa mort. La formulation française conserve cette image sans l’expliciter dans le corps du texte.
theological_decisions:
- issue: Expression de la culpabilité liée au sang versé
  choice: Je suis innocent du sang de cette femme
  alternative: Je ne suis pas responsable de la mort de cette femme
  rationale: La traduction retenue préserve l’image biblique du sang ainsi que sa portée juridique et morale, sans réduire l’énoncé à une simple pureté rituelle ni expliciter davantage que le grec.
translation_notes:
  register: Français moderne, digne et accessible. La structure reste proche du grec tout en étant idiomatique ; l’expression « innocent du sang » conserve volontairement le langage biblique de la responsabilité pour une mort.
