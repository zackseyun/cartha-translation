base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/022.yaml
  text: And they said[a], “Look, the doors of the garden are shut, and no one sees us, and we are filled with desire for you. Therefore consent to us, and be with us.”
translation:
  language: fr
  text: 'Et ils dirent : « Regarde, les portes du jardin[a] sont fermées, personne ne nous voit, et nous te désirons. Alors, donne-nous ton accord et sois avec nous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec désigne ici un jardin clos ou un parc, et non le « paradis » au sens théologique ultérieur.
    reason: Précision lexicale destinée à éviter une lecture eschatologique de παράδεισος.
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Regarde
  rationale: Cet appel attire directement l’attention de Suzanne. « Regarde » est naturel en français moderne et conserve la force déictique du grec.
- source_word: αἱ θύραι τοῦ παραδείσου
  choice: les portes du jardin
  rationale: Dans ce récit, παράδεισος désigne un jardin clos ou un parc, et non le paradis au sens théologique ultérieur. « Portes » convient à ses accès fermés.
- source_word: κέκλεινται
  choice: sont fermées
  rationale: Le parfait passif exprime l’état présent résultant de la fermeture ; « sont fermées » le rend clairement et naturellement.
- source_word: θεωρεῖ
  choice: voit
  rationale: Le verbe signifie ici voir ou observer. « Voit » est direct et idiomatique dans la déclaration menaçante des anciens.
- source_word: ἐν ἐπιθυμίᾳ σού ἐσμεν
  choice: nous te désirons
  rationale: La tournure grecque exprime un désir dirigé vers Suzanne, sexuel dans ce contexte. Cette formulation française est naturelle sans ajouter l’intensité de « brûler de désir », qui n’est pas explicitement exprimée.
- source_word: διὸ
  choice: Alors
  rationale: Le connecteur introduit la conclusion que les anciens tirent de l’isolement et de leur désir. « Alors » restitue ce mouvement logique dans un dialogue français naturel.
- source_word: συγκατάθου ἡμῖν
  choice: donne-nous ton accord
  rationale: L’impératif demande à Suzanne d’acquiescer à leur proposition. Cette formulation conserve l’idée d’un consentement réclamé, sans masquer le caractère coercitif de la scène.
- source_word: γενοῦ μεθ᾿ ἡμῶν
  choice: sois avec nous
  rationale: La traduction reste proche de l’expression grecque et laisse le contexte porter son implication sexuelle.
theological_decisions:
- issue: Sens de παράδεισος dans un récit non eschatologique
  choice: jardin
  alternative: paradis
  rationale: Le cadre narratif est celui du jardin clos où Suzanne se baigne. « Paradis » introduirait ici une association théologique absente du contexte.
translation_notes:
  register: Français international moderne, clair et digne. Le dialogue demeure direct. La formulation conserve la demande d’acquiescement présente dans le grec tout en laissant le contexte narratif révéler sa nature prédatrice et coercitive.
