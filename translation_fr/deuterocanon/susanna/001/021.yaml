  text: And it happened[a], when the maids had gone out, that the two elders rose up and rushed at her.
translation:
  language: fr
  text: Lorsque les jeunes servantes[a] sortirent, les deux anciens se levèrent et se précipitèrent sur elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les jeunes filles ». Le grec peut désigner de jeunes filles ou de jeunes femmes; le contexte domestique suggère qu’elles étaient au service de Suzanne.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ὡς
  choice: Quand
  rationale: La formule introduit ici la circonstance temporelle. En français moderne, « Quand » rend naturellement la transition narrative sans conserver le calque lourd « il arriva que ».
- source_word: ἐξήλθοσαν
  choice: furent sorties
  rationale: L’aoriste désigne une sortie accomplie avant l’action principale; le passé antérieur marque clairement cette antériorité dans un registre narratif soutenu.
- source_word: τὰ κοράσια
  choice: les jeunes servantes
  rationale: κοράσια peut désigner des filles ou de jeunes femmes; le contexte domestique indique vraisemblablement des personnes au service de Suzanne, tout en laissant perceptible leur jeunesse.
- source_word: ἀνέστησαν
  choice: se levèrent
  rationale: Rend directement le mouvement qui met les anciens en action.
- source_word: οἱ δύο πρεσβῦται
  choice: les deux anciens
  rationale: Dans le récit, πρεσβῦται désigne leur fonction reconnue dans la communauté, et pas seulement leur âge.
- source_word: ἐπέδραμον αὐτῇ
  choice: se précipitèrent sur elle
  rationale: Cette tournure exprime le mouvement soudain et agressif vers Suzanne sans préciser davantage l’agression que ne le fait le grec.
