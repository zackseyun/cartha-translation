base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/038.yaml
  text: And they did not know that we were standing there. Then we rushed together[a], saying, 'Let us find out who these men are.'
translation:
  language: fr
  text: 'Ils ne savaient pas que nous nous tenions là. Alors nous avons accouru les uns vers les autres[a], en disant : « Découvrons qui sont ces hommes[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec associe un mouvement soudain à une expression réciproque, littéralement « les uns vers les autres ». La relation exacte entre les personnes demeure difficile à préciser.
    reason: ambiguïté_lexicale
  - marker: b
    text: 'Littéralement : « qui sont ceux-ci » ; « hommes » est précisé d’après le contexte immédiat.'
    reason: explicitation_contextuelle
lexical_decisions:
- source_word: οὐκ ᾔδεισαν
  choice: ils ne savaient pas
  rationale: Le plus-que-parfait grec de forme mais à valeur d’imparfait exprime ici simplement que les personnes en question ignoraient la présence des locuteurs.
- source_word: εἰστήκειμεν
  choice: nous nous tenions là
  rationale: Le plus-que-parfait de ἵστημι indique une position debout déjà prise; cette tournure française conserve à la fois la posture et la présence sur les lieux.
- source_word: συνεπιτάμεθα ἀλλήλοις
  choice: nous nous sommes élancés ensemble
  rationale: Le verbe composé dénote un mouvement soudain et conjoint. ἀλλήλοις apporte une nuance réciproque difficile à reproduire naturellement en français; « ensemble » la rend sans suggérer à tort que les vieillards se sont attaqués mutuellement.
- source_word: Μάθωμεν
  choice: Découvrons
  rationale: Le subjonctif aoriste a une valeur exhortative; « Découvrons » exprime naturellement ici la volonté de connaître l’identité des personnes.
- source_word: τίνες εἰσὶν οὗτοι
  choice: qui sont ces hommes
  rationale: Le grec dit littéralement « qui sont ceux-ci ». Le nom « hommes » explicite le référent masculin fourni par le contexte immédiat.
