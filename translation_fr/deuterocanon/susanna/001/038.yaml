translation_notes:
  register: Français international moderne, narratif et digne. Le passé composé marque l’action soudaine, tandis que l’imparfait rend l’état d’ignorance et la présence déjà établie. L’ambiguïté de la formulation grecque en συνεπιτάμεθα ἀλλήλοις est signalée plutôt que résolue de manière excessive.
