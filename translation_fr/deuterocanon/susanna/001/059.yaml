revisions:
- from: 'Daniel lui dit : « Toi aussi, tu as menti, et ton mensonge retombera à juste titre sur ta propre tête. Car l’ange de Dieu se tient prêt, l’épée à la main, à te fendre en deux, afin de vous faire périr[a]. »'
  to: 'Daniel lui dit : « Tu as, toi aussi, fort bien menti contre ta propre tête ; car l’ange de Dieu se tient là, l’épée à la main, pour te scier en deux, afin de vous détruire[a]. »'
  rationale: La révision rétablit l’accusation directe au passé et l’ironie mordante de Ὀρθῶς, tout en conservant l’image concrète de la « tête ». Elle rend μένει sans amplification, précise le sens de πρίζω, et préserve dans le texte comme en note le passage intentionnel du singulier au pluriel.
