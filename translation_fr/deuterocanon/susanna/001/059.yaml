base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/059.yaml
  text: Then Daniel said to him[a], “You also have lied rightly against your own head; for the angel of God stands by, holding the sword to split you in two, so that he may destroy you.”
translation:
  language: fr
  text: 'Daniel lui dit : « Tu as, toi aussi, fort bien menti contre ta propre tête ; car l’ange de Dieu se tient là, l’épée à la main, pour te scier en deux, afin de vous détruire[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec passe ici du singulier au pluriel : la menace de destruction vise les deux anciens, et non seulement celui auquel Daniel parle.'
    reason: Le changement de nombre est significatif et doit être rendu explicite pour les lecteurs français.
lexical_decisions:
- source_word: Ὀρθῶς ἔψευσαι ... εἰς τὴν σεαυτοῦ κεφαλήν
  choice: tu as menti, et ton mensonge retombera à juste titre sur ta propre tête
  rationale: Le grec associe ironiquement « correctement/justement » au mensonge dirigé contre la tête du menteur. Une traduction strictement littérale comme « tu as menti justement contre ta propre tête » serait obscure en français. Cette formulation explicite le retour du mensonge contre son auteur tout en conservant l’image concrète de la tête et la portée judiciaire de Ὀρθῶς.
- source_word: μένει
  choice: se tient prêt
  rationale: Dans ce contexte de jugement imminent, μένει présente l’ange comme demeurant là, prêt à agir. « Se tient prêt » est naturel et évite de réduire le verbe à une simple attente temporelle.
- source_word: ὁ ἄγγελος τοῦ θεοῦ
  choice: l’ange de Dieu
  rationale: Rendu direct et solennel de l’expression grecque.
- source_word: τὴν ῥομφαίαν ἔχων
  choice: l’épée à la main
  rationale: Formulation française naturelle qui conserve l’image de l’ange tenant l’arme. ῥομφαία peut désigner une grande épée, mais le contexte ne requiert pas de précision technique.
- source_word: πρίσαι σε μέσον
  choice: te fendre en deux
  rationale: πρίζω signifie proprement « scier » et μέσον indique ici une division par le milieu. « Fendre en deux » préserve la violence de l’image sans produire la maladresse possible de « te scier au milieu ».
- source_word: ἐξολεθρεύσῃ
  choice: faire périr
  rationale: Le verbe exprime une destruction complète. « Faire périr » convient au registre judiciaire et solennel du passage.
- source_word: ὑμᾶς
  choice: vous
  rationale: Le pronom est explicitement pluriel et élargit la menace aux deux anciens, alors que Daniel s’adresse jusque-là à un seul. Le français permet de conserver ce changement de nombre dans le texte.
theological_decisions:
- issue: Portée du pronom final pluriel ὑμᾶς
  choice: conserver « vous » dans le texte et signaler qu’il vise les deux anciens
  alternative: harmoniser avec l’adresse singulière en traduisant « te faire périr »
  rationale: Le passage du singulier au pluriel est présent dans le grec et étend le jugement au-delà de l’homme directement interrogé. Il ne faut pas effacer cette tension grammaticale et narrative.
- issue: Valeur ironique de Ὀρθῶς
  choice: rattacher « à juste titre » au retour du mensonge sur la tête du menteur
  alternative: traduire littéralement « tu as menti correctement »
  rationale: 'La formulation grecque est mordante et paradoxale : le mensonge est « juste » en ce qu’il attire justement la condamnation sur son auteur. Le français retenu préserve cette ironie sans suggérer qu’un mensonge pourrait être moralement juste.'
translation_notes:
  register: Français international moderne, digne et narratif. La syntaxe reste accessible tout en conservant l’imagerie judiciaire et violente du grec. Le passage intentionnel de « te » à « vous » est maintenu.
