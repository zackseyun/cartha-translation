base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/041.yaml
  text: And the whole assembly believed them[a], since they were elders and judges of the people.
translation:
  language: fr
  text: Et toute l’assemblée les crut[a], puisqu’ils étaient anciens et juges du peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur fit confiance ». Le grec indique ici que l’assemblée tint leur témoignage pour vrai.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίστευσεν αὐτοῖς
  choice: les crut
  rationale: Avec le datif αὐτοῖς, πιστεύω signifie ici tenir pour vrai leur témoignage ou leur accusation. « Les crut » exprime directement ce sens en français naturel.
- source_word: ἡ συναγωγὴ πᾶσα
  choice: toute l’assemblée
  rationale: Dans ce récit juif ancien, συναγωγή désigne la communauté rassemblée plutôt qu’un bâtiment ou une institution appelée « synagogue ». « Toute l’assemblée » rend aussi la totalité exprimée par πᾶσα.
- source_word: ὡς
  choice: puisque
  rationale: 'ὡς introduit ici le motif pour lequel l’assemblée les croit : leur qualité d’anciens et de juges. « Puisque » conserve clairement cette valeur causale.'
- source_word: πρεσβυτέρων
  choice: anciens
  rationale: Le mot désigne des responsables reconnus de la communauté, et non simplement des hommes âgés. « Anciens » préserve cette fonction sociale.
- source_word: κριτῶν
  choice: juges
  rationale: Le terme désigne ceux qui exercent une autorité judiciaire; « juges » en est l’équivalent français direct.
- source_word: τοῦ λαοῦ
  choice: du peuple
  rationale: Cette expression désigne la communauté du peuple dans laquelle ils exercent leur charge judiciaire; la traduction littérale est naturelle en français.
theological_decisions:
- issue: Sens de συναγωγή dans un récit juif préchrétien
  choice: assemblée
  alternative: communauté réunie ; synagogue
  rationale: « Assemblée » restitue le groupe rassemblé sans imposer le sens moderne d’un bâtiment ni des connotations institutionnelles postérieures.
translation_notes:
  register: Français moderne, sobre et narratif. « Anciens » conserve la fonction communautaire du terme grec; « puisqu’ils étaient » rend naturellement le lien causal sans atténuer l’ironie tragique du récit.
