base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/026.yaml
  text: But when those from the house heard the outcry in the garden[a], they rushed in through the side door to see what had happened to her.
translation:
  language: fr
  text: Mais lorsque les gens de la maison entendirent le cri dans le jardin, ils se précipitèrent dans le jardin par la porte latérale[a] pour voir ce qui lui était arrivé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’entrée latérale » ; le grec peut désigner une porte ou un portail, sans préciser exactement la nature de cette entrée.
    reason: lexical_alternative
lexical_decisions:
- source_word: κραυγή
  choice: cri
  rationale: Le nom désigne un cri poussé avec force. « Le cri » convient au contexte d’alarme tout en restant naturel en français.
- source_word: παράδεισος
  choice: jardin
  rationale: Dans ce récit, le mot désigne le jardin clos attenant à la maison, et non le paradis au sens eschatologique.
- source_word: οἱ ἐκ τῆς οἰκίας
  choice: les gens de la maison
  rationale: Cette formulation naturelle conserve l’indétermination du grec quant au statut précis des personnes concernées, sans les identifier exclusivement à la famille ou aux serviteurs.
- source_word: εἰσεπήδησαν
  choice: se précipitèrent à l’intérieur
  rationale: Le verbe exprime une entrée soudaine et énergique. Cette tournure française restitue l’urgence sans imposer l’image trop littérale d’un saut.
- source_word: πλαγία θύρα
  choice: porte latérale
  rationale: Cette traduction rend directement les deux éléments grecs, tout en laissant ouverte la nature architecturale exacte de l’entrée.
- source_word: τὸ συμβεβηκὸς αὐτῇ
  choice: ce qui lui était arrivé
  rationale: La tournure idiomatique rend le participe parfait et conserve la relation exprimée par le datif αὐτῇ.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le passé simple convient au registre narratif biblique sans être archaïque. « Les gens de la maison » évite de préciser indûment leur identité, tandis que « porte latérale » garde l’ambiguïté architecturale signalée en note.
