lexical_decisions:
- source_word: καὶ
  choice: et
  rationale: Conjonction de coordination simple qui relie cette proposition au récit précédent.
- source_word: ἐπιθυμήσαντες
  choice: ils la désirèrent
  rationale: Le participe aoriste de ἐπιθυμέω exprime ici, d’après le contexte, un désir sexuel illicite. « Désirèrent » reste concis et proche du grec, tandis que la note explicite la nuance contextuelle.
- source_word: αὐτῆς
  choice: la
  rationale: Pronom féminin au génitif renvoyant à Suzanne. Avec « désirer », le pronom complément direct est la tournure naturelle en français.
