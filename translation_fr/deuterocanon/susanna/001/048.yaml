base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/048.yaml
  text: But he stood in their midst and said[a], “Are you such fools, sons of Israel? Without examining the matter or even learning the facts clearly[b], have you condemned a daughter of Israel?”
translation:
  language: fr
  text: 'Mais il se leva au milieu d’eux et dit : « Êtes-vous à ce point insensés, fils d’Israël ? Sans avoir examiné l’affaire ni établi clairement les faits, avez-vous condamné une fille d’Israël ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στὰς ἐν μέσῳ αὐτῶν
  choice: se tenant au milieu d’eux
  rationale: Le participe aoriste introduit l’action qui précède la parole. Cette tournure française conserve la scène publique et la position de Daniel au milieu de l’assemblée.
- source_word: Οὕτως μωροί
  choice: Êtes-vous insensés à ce point
  rationale: La formulation interrogative restitue la vive réprimande implicite du grec. « Insensés » reste ferme et digne, tandis que « à ce point » rend οὕτως naturellement.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: fils d’Israël
  rationale: Le masculin explicite est conservé, ainsi que la désignation d’alliance qui répond à « une fille d’Israël » à la fin du verset.
- source_word: ἀνακρίναντες
  choice: avoir mené d’enquête
  rationale: 'Le verbe possède ici une tonalité judiciaire : il s’agit d’examiner l’affaire avant de prononcer une condamnation.'
- source_word: τὸ σαφὲς ἐπιγνόντες
  choice: établi clairement les faits
  rationale: Cette expression française rend conjointement l’idée de connaissance assurée portée par ἐπιγινώσκω et celle de clarté portée par σαφές, dans le contexte judiciaire.
- source_word: κατεκρίνατε
  choice: avez-vous condamné
  rationale: Le passé composé souligne en français l’acte judiciaire accompli dont Daniel dénonce l’injustice.
- source_word: θυγατέρα Ἰσραήλ
  choice: une fille d’Israël
  rationale: Cette traduction préserve la désignation féminine, l’absence d’article et le contraste rhétorique avec « fils d’Israël ».
theological_decisions:
- issue: Désignations genrées du peuple d’Israël
  choice: fils d’Israël / une fille d’Israël
  alternative: Israélites / une femme israélite
  rationale: Le grec construit un contraste délibéré entre les hommes interpellés et la femme condamnée, tous membres d’Israël. La traduction conserve ce parallélisme sans le neutraliser.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La réprimande demeure tranchante sans recourir à un terme familier. La tonalité judiciaire est rendue par « mené d’enquête », « établi clairement les faits » et « condamné ».
