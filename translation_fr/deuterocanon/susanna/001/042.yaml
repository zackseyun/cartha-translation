base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/042.yaml
  text: And Susanna cried out with a loud voice and said, “O eternal God, knower of the hidden things, who knows all things before they come to be,”
translation:
  language: fr
  text: 'Et Suzanne poussa un grand cri et dit : « Dieu éternel, toi qui connais les choses cachées[a], toi qui sais toute chose avant qu’elle ne vienne à l’existence[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toi qui connais les secrets ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « avant son existence » ou « avant qu’elle se produise ». Le grec peut désigner largement les réalités avant qu’elles viennent à l’existence ou qu’elles se produisent.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνεβόησεν
  choice: poussa un grand cri
  rationale: Le verbe exprime un cri puissant et chargé d’émotion; cette tournure convient naturellement au contexte de prière.
- source_word: φωνῇ μεγάλῃ
  choice: un grand cri
  rationale: L’idée de la voix forte est intégrée à l’expression française naturelle « pousser un grand cri », sans en affaiblir l’intensité.
- source_word: Ὁ θεὸς ὁ αἰώνιος
  choice: Dieu éternel
  rationale: Le nominatif grec a ici valeur d’apostrophe. « Dieu éternel » rend directement et dignement l’invocation.
- source_word: ὁ τῶν κρυπτῶν γνώστης
  choice: toi qui connais les choses cachées
  rationale: Cette formulation naturelle conserve la portée large de κρυπτά, qui désigne ce qui est caché et pas seulement des secrets au sens étroit.
- source_word: ὁ εἰδὼς τὰ πάντα
  choice: toi qui sais tout
  rationale: Le participe est rendu par une proposition d’adresse parallèle; « sais tout » est idiomatique et préserve l’universalité de τὰ πάντα.
- source_word: πρὶν γενέσεως αὐτῶν
  choice: avant que cela vienne à l’existence
  rationale: Cette traduction garde la référence large à la venue à l’être ou à la réalisation des choses, sans la réduire aux seuls événements.
theological_decisions:
- issue: La prescience divine exprimée par πρὶν γενέσεως αὐτῶν
  choice: avant que cela vienne à l’existence
  alternative: avant que cela arrive
  rationale: La formulation affirme que Dieu connaît tout antérieurement à sa venue à l’être, tout en évitant d’ajouter une systématisation doctrinale étrangère au verset.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « toi qui » soutient le rythme de l’invocation. Le verset demeure syntaxiquement ouvert, conformément au texte source, puisque la prière se poursuit au verset suivant.
