base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/051.yaml
  text: And Daniel said to them[a], “Separate them far from one another, and I will examine them.”
translation:
  language: fr
  text: 'Daniel leur dit : « Séparez-les, à bonne distance l’un de l’autre, et je les examinerai[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je les interrogerai ». Le verbe grec peut désigner un examen judiciaire ou un interrogatoire.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διαχωρίσατε
  choice: Séparez
  rationale: L’impératif pluriel de διαχωρίζω demande que les deux anciens soient physiquement séparés. « Séparez » est direct, naturel et fidèle au contexte judiciaire.
- source_word: ἀπ᾽ ἀλλήλων
  choice: l’un de l’autre
  rationale: Cette expression réciproque indique que les deux hommes doivent être tenus séparés. « L’un de l’autre » convient précisément à deux personnes.
- source_word: μακράν
  choice: en les éloignant bien
  rationale: L’adverbe souligne une séparation à bonne distance. Cette formulation française naturelle conserve l’insistance du grec et évite le tour moins idiomatique « séparez-les loin ».
- source_word: ἀνακρινῶ
  choice: je les interrogerai
  rationale: Dans ce cadre judiciaire, ἀνακρίνω désigne l’examen de personnes par des questions. « Interroger » est clair en français courant, sans imposer les connotations modernes parfois fortes de « soumettre à un interrogatoire ».
- source_word: Δανιήλ
  choice: Daniel
  rationale: Forme française traditionnelle et standard du nom propre.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La formulation garde la brièveté de l’ordre de Daniel et le cadre judiciaire, tout en rendant naturellement l’insistance de μακράν.
