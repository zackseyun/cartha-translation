base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/010.yaml
  text: And both of them were inflamed with desire for her[a], and neither one disclosed to the other the wicked passion that held them concerning her[b], nor did the woman know this matter.
translation:
  language: fr
  text: Tous deux étaient épris d’elle[a], et ni l’un ni l’autre ne révélait à l’autre le mauvais désir qui les tenait à son égard[b] ; la femme ignorait cette affaire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avaient été transpercés à son sujet » ; ici, l’expression décrit le fait d’être profondément épris d’elle.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « le mal qui les tenait à son sujet ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμφότεροι
  choice: Tous deux
  rationale: Désigne explicitement les deux anciens et conserve naturellement leur référence commune.
- source_word: κατανενυγμένοι
  choice: étaient épris
  rationale: Le participe parfait passif évoque littéralement le fait d’être piqué ou transpercé ; dans ce contexte, il exprime une fixation amoureuse ou érotique profonde. « Épris » restitue l’idiome avec dignité, tandis que la note conserve l’image grecque.
- source_word: περὶ αὐτῆς
  choice: d’elle
  rationale: Après « épris », cette construction est idiomatique en français et rend la première occurrence sans lourdeur.
- source_word: ἕτερος τῷ ἑτέρῳ οὐ προσεποιεῖτο
  choice: ni l’un ni l’autre ne révélait à son compagnon
  rationale: La tournure négative rend clairement la réciprocité du grec. « Révélait » convient ici au sens contextuel d’avouer ou de faire connaître ; « son compagnon » évite l’ambiguïté possible de « à l’autre » tout en désignant l’autre ancien.
- source_word: τὸ κακὸν
  choice: le désir mauvais
  rationale: Le substantif neutre « le mal » désigne ici, d’après le contexte et son rapport à Susanna, leur désir moralement mauvais. L’explicitation demeure proche du texte sans introduire une catégorie doctrinale.
- source_word: τὸ ἔχον αὐτοὺς
  choice: qui le tenait
  rationale: Le grec présente ce mal comme exerçant une emprise sur chacun. Le singulier distributif français s’accorde naturellement avec « ni l’un ni l’autre ».
- source_word: περὶ αὐτῆς
  choice: à cause d’elle
  rationale: 'Cette seconde occurrence indique que le désir qui les tient a Susanna pour objet ou occasion. Une note signale l’autre rendu possible, plus formel : « à son sujet ».'
- source_word: ἡ γυνή
  choice: la femme
  rationale: Reprend littéralement la désignation grecque de Susanna et maintient le point de vue narratif extérieur.
- source_word: οὐδὲ ... ἔγνω τὸ πρᾶγμα τοῦτο
  choice: et la femme ignorait tout cela
  rationale: Formulation française naturelle qui exprime son absence de connaissance sans définir prématurément la situation comme un complot.
theological_decisions:
- issue: Caractérisation morale du désir caché des anciens
  choice: « le désir mauvais »
  alternative: « le mal » ; « la passion mauvaise »
  rationale: κακόν porte explicitement un jugement moral. « Désir mauvais » identifie le référent fourni par le contexte sans accentuer le texte par un vocabulaire confessionnel.
- issue: Force idiomatique de κατανενυγμένοι dans ce contexte érotique
  choice: « étaient épris d’elle » avec conservation de l’image littérale en note
  alternative: « étaient transpercés à son sujet » ; « brûlaient de désir pour elle »
  rationale: Le littéralisme serait obscur en français actuel, tandis que « brûlaient » importerait une image absente du grec. « Épris » rend l’état profond et durable suggéré par le parfait, sans atténuer le caractère mauvais du désir, explicitement qualifié dans la proposition suivante.
- issue: Degré d’emprise attribué au désir
  choice: « qui le tenait »
  alternative: « qui le possédait » ; « qui s’était emparé de lui »
  rationale: « Tenait » conserve sobrement la métaphore de l’emprise du participe ἔχον, sans lui donner une connotation technique de possession spirituelle.
translation_notes:
  register: 'Français international moderne, narratif et digne. La phrase garde les trois éléments du grec : le désir partagé, le secret réciproque et l’ignorance de Susanna. Les notes préservent l’image littérale inhabituelle et l’ambiguïté relative de la seconde expression περὶ αὐτῆς.'
