  verdict: revise
  source_fidelity: 'La traduction rend correctement le désir partagé, le secret entre les deux hommes et l’ignorance de Susanna. Toutefois, « à cause d’elle » introduit une relation causale que περὶ αὐτῆς n’exprime pas ici : l’expression renvoie au désir ayant Susanna pour objet. De plus, « qui le tenait » transforme indûment le pluriel αὐτούς (« les tenait ») en singulier distributif.'
  naturalness: La phrase est globalement fluide, mais « à son compagnon » ajoute l’idée de compagnonnage, absente du grec, et « à son égard » permet une formulation naturelle sans suggérer la causalité de « à cause d’elle ».
  terminology: « Épris d’elle » est un rendu moderne et digne de κατανενυγμένοι dans ce contexte; la note conserve utilement l’image littérale. « Mauvais désir » rend le jugement moral de τὸ κακόν sans surinterprétation doctrinale. « Cette affaire » correspond bien à τὸ πρᾶγμα τοῦτο.
  issues:
