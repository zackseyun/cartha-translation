    issue: « à cause d’elle » rend la seconde occurrence de περὶ αὐτῆς de manière causale.
    rationale: περί indique ici le rapport du mauvais désir à Susanna, non qu’elle en soit la cause. « à son égard » conserve une référence neutre et naturelle.
  - severity: medium
    issue: « qui le tenait » ne rend pas le pluriel αὐτούς.
    rationale: Le mauvais désir tient les deux anciens; le français doit employer « les tenait ».
  - severity: low
    issue: « à son compagnon » ajoute une nuance relationnelle non exprimée par ἕτερος τῷ ἑτέρῳ.
    rationale: « à l’autre » rend simplement la réciprocité du grec.
