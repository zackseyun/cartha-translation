  text: And she said to the servant girls[a], “Bring me oil and ointments, and shut the doors of the garden, so that I may bathe.”
translation:
  language: fr
  text: 'Elle dit aux jeunes servantes[a] : « Apportez-moi de l’huile et des onguents, puis fermez les portes du jardin afin que je puisse me baigner. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jeunes filles ». Le terme grec peut désigner des filles ou de jeunes femmes ; dans ce contexte, il s’agit de servantes de la maison.
    reason: lexical_alternative
lexical_decisions:
- source_word: κορασίοις
  choice: jeunes servantes
  rationale: Le diminutif κοράσιον peut désigner des filles ou de jeunes femmes. Dans ce contexte domestique, elles sont au service de Suzanne ; « jeunes servantes » préserve à la fois l’idée d’âge et leur fonction.
- source_word: Ἐνέγκατε δή μοι
  choice: Apportez-moi
  rationale: L’impératif aoriste de φέρω, renforcé par δή, exprime ici une demande directe. « Apportez-moi » est naturel et fidèle sans surcharger la nuance de δή.
- source_word: ἔλαιον
  choice: huile
  rationale: Le grec dit simplement « huile ». Préciser « huile d’olive » ajouterait une information probable, mais non explicite.
- source_word: σμήγματα
  choice: onguents
  rationale: σμήγματα désigne des préparations servant à nettoyer, frictionner ou oindre le corps. « Onguent » conserve cette portée liée aux soins corporels sans imposer l’idée précise de parfum ou de cosmétique.
- source_word: θύρας τοῦ παραδείσου
  choice: les portes du jardin
  rationale: παράδεισος désigne ici un jardin clos ; θύρας signifie littéralement « portes » et convient à cet espace privé fermé.
- source_word: κλείσατε
  choice: fermez
  rationale: Le verbe signifie fermer. « Fermez » est idiomatique en français ; « verrouillez » préciserait indûment le moyen de fermeture.
- source_word: ὅπως λούσωμαι
  choice: afin que je puisse me baigner
  rationale: Le moyen λούσωμαι exprime l’action de se laver ou de se baigner soi-même. Cette formulation est naturelle et rend explicitement la finalité introduite par ὅπως.
