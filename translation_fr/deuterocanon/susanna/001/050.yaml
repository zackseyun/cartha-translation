  text: And all the people returned with haste. And the elders said to him[a], “Come, sit in our midst and tell us, for God has given you eldership.”
translation:
  language: fr
  text: 'Alors tout le peuple revint en hâte. Les anciens lui dirent : « Viens, assieds-toi au milieu de nous et dis-nous, car Dieu t’a accordé le rang d’ancien[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la dignité d’ancien » ou « la prééminence ». Le grec désigne le rang, la dignité ou les prérogatives associés aux anciens, plutôt qu’un âge avancé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέστρεψεν
  choice: revint
  rationale: Le verbe indique ici que le peuple fait demi-tour et revient; « revint » exprime naturellement ce mouvement en français.
- source_word: μετὰ σπουδῆς
  choice: en hâte
  rationale: Dans ce contexte de déplacement immédiat, l’expression souligne surtout la rapidité, sans exclure l’empressement.
- source_word: οἱ πρεσβύτεροι
  choice: les anciens
  rationale: Dans ce cadre communautaire et judiciaire, il s’agit de responsables reconnus, et non simplement d’hommes âgés.
- source_word: Δεῦρο
  choice: Viens
  rationale: Cette interjection a ici valeur d’invitation ou d’ordre bref.
- source_word: ἐν μέσῳ ἡμῶν
  choice: au milieu de nous
  rationale: La formulation conserve à la fois la position spatiale de Daniel dans l’assemblée et son admission parmi ses membres dirigeants.
- source_word: ἀνάγγειλον ἡμῖν
  choice: dis-nous ce qu’il en est
  rationale: Le verbe demande à Daniel de faire connaître ou d’exposer son avis; cette tournure est naturelle dans la scène tout en gardant l’idée d’une déclaration adressée à l’assemblée.
- source_word: τὸ πρεσβεῖον
  choice: le rang d’ancien
  rationale: Le nom désigne la dignité, la prérogative ou le rang associé aux anciens. Comme Daniel est jeune, cette traduction indique un statut d’autorité reconnu sans lui attribuer un âge avancé.
theological_decisions:
- issue: Sens de τὸ πρεσβεῖον accordé par Dieu à Daniel
  choice: Dieu lui a accordé le rang et l’autorité associés à un ancien.
  alternative: Dieu lui a accordé la dignité d’ancien / la prééminence.
  rationale: Le récit met en tension la jeunesse de Daniel et l’autorité que Dieu lui confère. « Le rang d’ancien » préserve cette tension et la dimension sociale et judiciaire du terme, sans transformer celui-ci en affirmation sur son âge.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe narrative reste sobre; le discours direct demeure accessible. « Le rang d’ancien » rend explicitement une dignité reconnue tout en conservant l’étrangeté voulue de son attribution à un jeune homme.
