  text: And the Lord heard her voice.
translation:
  language: fr
  text: Et le Seigneur entendit sa voix.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσήκουσεν
  choice: entendit
  rationale: Le verbe εἰσακούω peut évoquer une écoute favorable, notamment en réponse à une supplication. « Entendit » reste naturel, conserve la simplicité narrative et n’explicite pas encore la forme de la réponse divine.
- source_word: Κύριος
  choice: le Seigneur
  rationale: « Le Seigneur » rend directement le titre divin grec Κύριος sans introduire la convention « l’Éternel », qui suggérerait une représentation explicite du nom divin hébreu absente de ce témoin grec.
- source_word: φωνῆς αὐτῆς
  choice: sa voix
  rationale: Cette expression correspond directement au grec et préserve son élément concret. « Son cri » ou « sa prière » préciserait davantage le contexte que ne le fait la formulation source.
theological_decisions:
- issue: Faut-il expliciter que Dieu répondit favorablement à la prière de Suzanne ?
  choice: « le Seigneur entendit sa voix »
  alternative: « le Seigneur exauça sa prière »
  rationale: Même si εἰσακούω peut impliquer une écoute favorable, le verset affirme ici que le Seigneur entendit sa voix sans encore décrire explicitement sa réponse. La traduction conserve cette retenue théologique.
- issue: Comment rendre Κύριος dans ce récit grec deutérocanonique ?
  choice: « le Seigneur »
  alternative: « l’Éternel »
  rationale: Le témoin source porte Κύριος. « Le Seigneur » traduit ce titre sans laisser entendre que le texte représente ici explicitement le tétragramme hébreu.
translation_notes:
  register: Français moderne, clair et digne. La coordination initiale « Et » est conservée pour refléter καὶ et l’enchaînement narratif. Aucun marqueur de note n’est requis.
