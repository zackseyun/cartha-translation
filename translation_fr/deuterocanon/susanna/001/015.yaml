  text: Après être sortis[a], ils se séparèrent l’un de l’autre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Lorsqu’ils furent sortis, ils se séparèrent l’un de l’autre. » Le participe aoriste grec peut exprimer une nuance temporelle légèrement différente ; il présente la sortie avant la séparation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: Puis ils sortirent
  rationale: Le participe aoriste marque une action antérieure au verbe principal. En français narratif, la coordination avec « puis » exprime naturellement cette succession sans lourdeur.
- source_word: διεχωρίσθησαν
  choice: se séparèrent
  rationale: Cette forme aoriste à valeur intransitive ou réfléchie indique que les deux hommes se quittèrent et partirent chacun de son côté. « Se séparèrent » en rend directement le sens.
- source_word: ἀπ᾿ ἀλλήλων
  choice: l’un de l’autre
  rationale: Cette expression réciproque indique une séparation mutuelle. Avec deux sujets masculins, « l’un de l’autre » est naturel et précis.
