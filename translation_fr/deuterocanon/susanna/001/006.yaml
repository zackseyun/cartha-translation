  text: and legal cases came to them from other cities[a].
translation:
  language: fr
  text: Et des affaires judiciaires leur parvenaient d’autres villes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des jugements leur parvenaient d’autres villes ». Le grec peut désigner soit des décisions judiciaires, soit les affaires soumises à un jugement.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρχοντο
  choice: parvenaient
  rationale: L’imparfait grec présente une action répétée ou en cours dans le passé. « Parvenaient » conserve cette valeur tout en exprimant naturellement le mouvement vers les personnes concernées.
- source_word: κρίσεις
  choice: affaires judiciaires
  rationale: Dans ce contexte où des anciens exercent une fonction de juges, le terme désigne vraisemblablement des affaires soumises à leur décision. Cette formulation rend clairement le cadre judiciaire sans restreindre le sens à des procès formels.
- source_word: ἐξ ἄλλων πόλεων
  choice: d’autres villes
  rationale: Le complément indique simplement l’origine géographique. « Villes » est ici l’équivalent courant de πόλεις.
- source_word: πρὸς αὐτούς
  choice: leur
  rationale: Le pronom indirect rend avec naturel le mouvement orienté vers ces juges, exprimé en grec par πρός avec l’accusatif.
