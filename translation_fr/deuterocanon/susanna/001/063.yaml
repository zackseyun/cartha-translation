revisions:
- from: Helcias et sa femme, ainsi que Joachim, le mari de leur fille, et tous leurs proches, adressèrent des louanges au sujet de leur fille[a], parce qu’aucun acte honteux n’avait été trouvé en elle.
  to: Helcias et sa femme firent des louanges au sujet de leur fille, avec Joachim, son mari, et tous les membres de leur famille, parce qu’on ne trouva en elle aucun acte honteux.[a]
  rationale: La révision maintient l’ambiguïté de l’objet implicite du verbe grec, remplace « proches » par une expression explicitement familiale, et rend la constatation finale avec une valeur narrative et judiciaire plus directe. La note est reformulée pour signaler l’ambiguïté réelle sans proposer une résolution théologique absente du texte.
