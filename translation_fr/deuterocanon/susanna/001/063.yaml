base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/063.yaml
  text: And Hilkiah and his wife praised their daughter[a], along with Joakim her husband and all their relatives, because no shameful deed was found in her.
translation:
  language: fr
  text: Helcias et sa femme firent des louanges au sujet de leur fille, avec Joachim, son mari, et tous les membres de leur famille, parce qu’on ne trouva en elle aucun acte honteux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec ne précise pas l’objet des louanges; il indique seulement qu’elles étaient faites au sujet de leur fille.
    reason: Préserve l’objet implicite de ᾔνεσαν et la portée de περί avec le génitif, sans ajouter « Dieu ».
lexical_decisions:
- source_word: Χελκίας
  choice: Helcias
  rationale: Forme française biblique traditionnelle correspondant au grec Χελκίας, distincte de la translittération anglaise Hilkiah.
- source_word: ᾔνεσαν
  choice: adressèrent des louanges
  rationale: Rend le sens de « louer » sans ajouter un objet absent du grec; cette tournure permet de conserver naturellement l’objet implicite.
- source_word: περὶ τῆς θυγατρὸς αὐτῶν
  choice: au sujet de leur fille
  rationale: περί avec le génitif signifie ici « au sujet de, à propos de »; la formulation évite de décider si la fille est elle-même l’objet direct des louanges.
- source_word: μετὰ Ἰωακεὶμ τοῦ ἀνδρὸς αὐτῆς
  choice: ainsi que Joachim, le mari de leur fille
  rationale: μετά exprime l’accompagnement. Répéter « leur fille » lève en français l’ambiguïté possible du possessif dans une phrase comportant plusieurs référents.
- source_word: τῶν συγγενῶν πάντων
  choice: tous leurs proches
  rationale: « Proches » est actuel et naturel pour désigner l’ensemble de la parenté, sans la connotation masculine de « parents » au sens ancien.
- source_word: οὐχ εὑρέθη ἐν αὐτῇ
  choice: n’avait été trouvé en elle
  rationale: Conserve le passif et la formulation judiciaire du grec, tout en employant le plus-que-parfait naturel après le récit de la réaction familiale.
- source_word: αἰσχρὸν πρᾶγμα
  choice: aucun acte honteux
  rationale: « Acte honteux » restitue à la fois la conduite concrète exprimée par πρᾶγμα et le caractère déshonorant exprimé par αἰσχρόν.
theological_decisions:
- issue: Objet implicite du verbe ᾔνεσαν
  choice: Ne pas ajouter « Dieu » et conserver l’objet des louanges implicite
  alternative: « louèrent Dieu au sujet de leur fille » ou « louèrent leur fille »
  rationale: Le grec ne nomme pas l’objet de la louange. Le contexte peut faire penser à Dieu, mais l’ajouter dans le corps du texte résoudrait une ambiguïté réelle; faire directement de la fille l’objet de la louange irait également au-delà de la syntaxe de περί avec le génitif.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination a été légèrement réorganisée pour éviter que « avec Joachim » ne paraisse dépendre de « leur fille ». La note préserve l’ambiguïté de l’objet des louanges sans importer dans le texte principal une précision absente du grec.
