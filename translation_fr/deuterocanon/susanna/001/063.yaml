review_pass:
  verdict: revise
  source_fidelity: Le grec dit littéralement qu’Helcias et sa femme « louèrent au sujet de leur fille », avec Joachim, son mari, et tous les parents, parce qu’aucune affaire honteuse ne fut trouvée en elle. L’objet de ᾔνεσαν n’est pas exprimé et ne doit pas être identifié à Dieu dans le texte ou présenté comme l’unique sens de la note. La proposition française conserve globalement cette ambiguïté, mais « tous leurs proches » peut inclure des non-apparentés, alors que συγγενῶν désigne les parents/les membres de la parenté. Le plus-que-parfait « n’avait été trouvé » n’est pas requis par l’aoriste et affaiblit légèrement la conclusion judiciaire du récit.
  naturalness: « Adressèrent des louanges au sujet de leur fille » est compréhensible mais assez lourd et moins idiomatique que « firent l’éloge de leur fille » ou « louèrent leur fille ». Cependant, le grec avec περί ne tranche pas simplement l’objet direct; « firent des louanges au sujet de leur fille » conserve mieux la construction tout en restant naturel. « Parce qu’aucun acte honteux n’avait été trouvé en elle » est grammatical, mais « parce qu’on n’avait trouvé en elle aucun acte honteux » est plus français et garde la valeur judiciaire.
  terminology: « Helcias » et « Joachim » sont des formes françaises recevables. « Parents » convient ici au sens de membres de la famille; pour éviter l’ambiguïté moderne avec père et mère, « tous les membres de leur famille » est préférable. « Acte honteux » restitue bien αἰσχρὸν πρᾶγμα. La note doit décrire l’objet implicite sans privilégier indûment « Dieu » comme ajout contextuel.
  issues:
  - severity: medium
    issue: La note suggère de manière orientée que les louanges peuvent être adressées à Dieu.
    rationale: Le grec ne donne aucun complément d’objet à ᾔνεσαν. Dans cette phrase, περί + génitif indique le sujet ou la circonstance (« au sujet de leur fille »), mais ne permet pas de nommer l’objet implicite. Mentionner Dieu comme interprétation contextuelle risque de surdéterminer une ambiguïté textuelle.
  - severity: low
    issue: « Tous leurs proches » est plus large que συγγενῶν.
    rationale: συγγενεῖς désigne des parents, des proches par parenté. « Tous les membres de leur famille » est moderne et plus précis.
  - severity: low
    issue: Le plus-que-parfait « n’avait été trouvé » ajoute une antériorité non marquée.
    rationale: 'L’aoriste passif εὑρέθη conclut l’épisode: « on ne trouva » / « aucun acte honteux ne fut trouvé ». Une formulation au passé simple ou au passé composé préserve mieux cette portée.'
  revised_text: Helcias et sa femme firent des louanges au sujet de leur fille, avec Joachim, son mari, et tous les membres de leur famille, parce qu’on ne trouva en elle aucun acte honteux.[a]
  revised_footnotes:
  - marker: a
    text: Le grec ne précise pas l’objet des louanges; il indique seulement qu’elles étaient faites au sujet de leur fille.
    reason: Préserve l’objet implicite de ᾔνεσαν et la portée de περί avec le génitif, sans ajouter « Dieu ».
  revision_rationale: La révision maintient l’ambiguïté de l’objet implicite du verbe grec, remplace « proches » par une expression explicitement familiale, et rend la constatation finale avec une valeur narrative et judiciaire plus directe. La note est reformulée pour signaler l’ambiguïté réelle sans proposer une résolution théologique absente du texte.
