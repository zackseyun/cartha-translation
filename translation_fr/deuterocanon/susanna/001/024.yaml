base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/024.yaml
  text: And Susanna groaned and said[a], “I am hemmed in on every side. For if I do this, it is death for me; but if I do not do it[b], I will not escape your hands.”
translation:
  language: fr
  text: 'Suzanne poussa un profond gémissement et dit : « Je suis prise au piège de tous côtés[a]. En effet, si je fais cela, c’est la mort pour moi ; mais si je ne le fais pas, je n’échapperai pas à vos mains[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je suis acculée de toutes parts. »'
    reason: lexical_alternative
  - marker: b
    text: L’expression « vos mains » désigne ici leur emprise ou leur pouvoir.
    reason: idiom_clarification
lexical_decisions:
- source_word: ἀνεστέναξεν
  choice: poussa un profond gémissement
  rationale: Le verbe exprime un soupir profond ou un gémissement causé par la détresse. Cette tournure française en conserve la forte charge émotionnelle.
- source_word: Στενά μοι πάντοθεν
  choice: Je suis prise au piège de tous côtés
  rationale: L’expression évoque une situation oppressante sans issue favorable. Cette formulation naturelle rend l’idée de resserrement et d’encerclement.
- source_word: ἐὰν γὰρ τοῦτο πράξω
  choice: si je fais cela
  rationale: Le démonstratif τοῦτο est conservé sans préciser davantage l’acte auquel il renvoie.
- source_word: θάνατός μοί ἐστιν
  choice: c’est la mort pour moi
  rationale: La formulation nominale et abrupte du grec est maintenue plutôt que développée en « je mourrai ».
- source_word: ἐὰν μὴ πράξω
  choice: si je ne le fais pas
  rationale: La répétition du verbe πράσσω est rendue afin de préserver la structure équilibrée du dilemme.
- source_word: οὐκ ἐκφεύξομαι
  choice: je n’échapperai pas
  rationale: Le futur grec est rendu directement, sans le transformer en expression d’incapacité.
- source_word: τὰς χεῖρας ὑμῶν
  choice: à vos mains
  rationale: La métaphore concrète des mains est préservée ; dans ce contexte, elle désigne aussi l’emprise ou le pouvoir des deux hommes.
theological_decisions:
- issue: Rendre le dilemme de Suzanne sans atténuer la contrainte
  choice: Conserver l’alternative brutale entre faire ce qui est exigé, avec la mort pour conséquence, et refuser, sans pouvoir échapper à l’emprise des hommes.
  alternative: Expliciter la mort comme une condamnation légale ou reformuler la menace en termes de honte sociale.
  rationale: Le grec ne précise pas ici le mécanisme de la mort et présente directement une situation coercitive sans bonne issue. La traduction préserve cette tension et n’ajoute aucune explication absente du verset.
translation_notes:
  register: Français international moderne, narratif et digne. Le discours direct reste sobre et tendu. L’image concrète des « mains » et la formulation abrupte « c’est la mort pour moi » sont conservées, tandis que « prise au piège » rend naturellement l’idiome grec.
