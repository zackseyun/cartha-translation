base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/017.yaml
  text: And it happened[a], while they were watching for an opportune day, that she once entered, as yesterday and the third day before, with only two young maids, and desired to bathe in the garden, because it was hot.
translation:
  language: fr
  text: Or, tandis qu’ils guettaient un jour propice, elle entra un jour, comme la veille et l’avant-veille[a], accompagnée de deux jeunes servantes seulement, et elle désira se baigner dans le jardin, car il faisait chaud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus naturellement : « comme les jours précédents ». Le grec compare littéralement cette visite à « hier et au troisième jour en remontant »; l’expression désigne vraisemblablement les visites des jours précédents.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Or
  rationale: La formule narrative grecque introduit ici un nouvel épisode. « Or » en restitue naturellement la transition en français moderne, sans l’archaïsme de « il advint que ».
- source_word: παρατηρεῖν
  choice: guettaient
  rationale: Le verbe désigne une observation attentive et peut comporter une intention hostile. Dans ce contexte de surveillance calculée, « guettaient » rend cette nuance sans ajouter qu’ils étaient déjà physiquement en embuscade.
- source_word: ἡμέραν εὔθετον
  choice: un jour propice
  rationale: L’expression désigne un jour favorable à leur dessein. « Propice » conserve l’idée d’une occasion recherchée et calculée.
- source_word: εἰσῆλθέν ποτε
  choice: elle entra un jour
  rationale: ποτε situe l’action à une occasion particulière. « Un jour » est plus naturel en français narratif que le calque « une fois ».
- source_word: καθὼς ἐχθὲς καὶ τρίτης ἡμέρας
  choice: comme la veille et l’avant-veille
  rationale: Cette formulation conserve la comparaison explicite avec les visites récentes tout en donnant un français intelligible. Le grec est inhabituel et peut être compris plus largement comme « comme les jours précédents ».
- source_word: μετὰ δύο μόνων κορασίων
  choice: accompagnée de deux jeunes servantes seulement
  rationale: κοράσια peut désigner des jeunes filles ou, dans ce cadre domestique, de jeunes servantes. Le contexte favorise le rôle de servantes; « seulement » maintient l’accent de μόνος.
- source_word: ἐπεθύμησε λούσασθαι
  choice: elle désira se baigner
  rationale: ἐπιθυμέω exprime ici un désir ou un souhait. « Désira » préserve cette force davantage que « voulut », tandis que « se baigner » rend naturellement l’infinitif moyen.
- source_word: ἐν τῷ παραδείσῳ
  choice: dans le jardin
  rationale: Dans ce récit, παράδεισος désigne le jardin clos de la propriété, sans portée théologique liée au paradis.
- source_word: ὅτι καῦμα ἦν
  choice: car il faisait chaud
  rationale: Cette tournure idiomatique rend la chaleur comme motif du bain.
