base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/023.yaml
  text: But if not[a], we will testify against you that a young man was with you[b], and for this reason you sent the servant girls away from you.
translation:
  language: fr
  text: Mais sinon, nous témoignerons contre toi en déclarant qu’un jeune homme était avec toi et que c’est pour cela que tu as renvoyé les jeunes servantes[a] loin de toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec κοράσια peut désigner des « filles » ; dans ce contexte, il s’agit des jeunes servantes de Suzanne.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ μή
  choice: Mais sinon
  rationale: Cette tournure restitue naturellement en français la menace conditionnelle elliptique et abrupte qui répond à l’exigence formulée au verset précédent.
- source_word: καταμαρτυρήσομέν σου
  choice: nous témoignerons contre toi
  rationale: Le verbe composé possède ici une portée judiciaire hostile. « Témoigner contre » conserve ce registre sans réduire l’acte à une simple accusation.
- source_word: ὅτι ἦν μετὰ σοῦ νεανίσκος
  choice: en disant qu’un jeune homme était avec toi
  rationale: « Un jeune homme » rend naturellement νεανίσκος. « En disant que » explicite en français le contenu du faux témoignage introduit par ὅτι, sans en modifier le sens.
- source_word: διὰ τοῦτο
  choice: c’est pour cela que
  rationale: Cette expression maintient le lien causal explicite entre la présence prétendue du jeune homme et le renvoi des servantes.
- source_word: ἐξαπέστειλας
  choice: tu as renvoyé
  rationale: « Renvoyer » exprime de façon concise et idiomatique l’idée de faire partir quelqu’un.
- source_word: τὰ κοράσια
  choice: les jeunes servantes
  rationale: Le nom peut désigner des filles ou de jeunes femmes; dans le contexte, il s’agit des personnes qui assistent Suzanne. « Jeunes servantes » conserve à la fois la nuance d’âge et leur fonction contextuelle.
- source_word: ἀπὸ σοῦ
  choice: qui étaient auprès de toi
  rationale: Après « renvoyer », traduire littéralement par « loin de toi » serait pesant. La relative exprime la séparation d’avec Suzanne tout en précisant naturellement le rapport des servantes avec elle.
theological_decisions:
- issue: Nature de la déclaration des anciens
  choice: La rendre comme une menace de témoignage judiciaire mensonger, sans l’atténuer
  alternative: Employer le terme plus général « nous t’accuserons »
  rationale: Le grec emploie un verbe de témoignage à valeur judiciaire. Le récit présente ainsi non une accusation vague, mais la menace délibérée de produire un faux témoignage.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement suit le singulier grec et convient à la parole coercitive adressée directement à Suzanne. La syntaxe conserve l’enchaînement de la menace et de l’accusation fabriquée, tout en évitant un calque lourd.
