base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/058.yaml
  text: 'Now then[a], tell me: under what tree did you catch them talking with one another? And he said, “Under a holm oak.”'
translation:
  language: fr
  text: 'Eh bien, dis-moi : sous quel arbre les as-tu surpris en train de parler ensemble ? Il répondit : « Sous un chêne vert[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou simplement : « chêne ». Le grec désigne une espèce particulière de chêne (πρῖνος).'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: Maintenant donc
  rationale: L’expression marque à la fois l’immédiateté et la progression logique de l’interrogatoire. « Maintenant donc » en conserve les deux nuances dans un registre digne et naturel.
- source_word: λέγε μοι
  choice: dis-moi
  rationale: L’impératif demande une réponse directe ; « dis-moi » est l’équivalent français idiomatique.
- source_word: Ὑπὸ τί δένδρον
  choice: sous quel arbre
  rationale: Rend directement la question portant sur l’arbre précis sous lequel la scène aurait eu lieu.
- source_word: κατέλαβες
  choice: as-tu surpris
  rationale: Dans ce contexte judiciaire, le verbe signifie prendre ou découvrir des personnes sur le fait plutôt que les saisir physiquement.
- source_word: ὁμιλοῦντας ἀλλήλοις
  choice: en train de parler ensemble
  rationale: Cette formulation rend l’action en cours exprimée par le participe et l’interaction réciproque, sans donner au verbe un sens plus intime que ne l’impose le grec.
- source_word: πρῖνον
  choice: chêne vert
  rationale: πρῖνος désigne une espèce précise de chêne, couramment identifiée au chêne vert. La précision est conservée puisque le type d’arbre joue un rôle dans l’interrogatoire.
