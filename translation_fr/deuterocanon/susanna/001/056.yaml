  yaml_path: translation/deuterocanon/susanna/001/056.yaml
  text: And after removing him[a], he ordered the other one to be brought forward. And he said to him, “Offspring of Canaan and not Judah, beauty has deceived you[b], and desire has corrupted your heart.”
translation:
  language: fr
  text: 'Après l’avoir éloigné, il ordonna qu’on fasse avancer l’autre. Il lui dit : « Engeance de Canaan, et non de Juda[a], la beauté t’a trompé, et le désir a perverti ton cœur[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « semence de Canaan, et non de Juda » : cette formule oppose brutalement une ascendance cananéenne à celle de Juda.'
    reason: La note signale l’image généalogique littérale de σπέρμα et éclaire la force de l’apostrophe.
  - marker: b
    text: Ou « a dévoyé ton cœur ».
    reason: Cette variante fait ressortir l’idée de torsion ou de détournement exprimée par le verbe grec.
lexical_decisions:
- source_word: μεταστήσας
  choice: Après l’avoir éloigné
  rationale: Le participe aoriste indique que Daniel écarte le premier ancien avant d’interroger l’autre. « Éloigné » rend le déplacement sans préciser un lieu absent du grec.
- source_word: ἐκέλευσεν προσαγαγεῖν τὸν ἕτερον
  choice: il ordonna qu’on fasse avancer l’autre
  rationale: Cette formulation naturelle conserve l’ordre donné de présenter l’autre homme pour l’interrogatoire.
- source_word: Σπέρμα Χανάαν
  choice: Engeance de Canaan
  rationale: « Engeance » garde la force généalogique et fortement dénonciatrice de σπέρμα dans cette apostrophe, tout en étant plus idiomatique que « semence » en français.
- source_word: καὶ οὐκ Ἰούδα
  choice: et non de Juda
  rationale: L’ajout français de « de » explicite naturellement le parallélisme généalogique sous-entendu, sans atténuer le contraste lapidaire.
- source_word: τὸ κάλλος ἐξηπάτησέν σε
  choice: la beauté t’a trompé
  rationale: Rendu direct qui conserve la beauté comme sujet de l’action et n’explicite pas davantage sa nature physique.
- source_word: ἐπιθυμία
  choice: le désir
  rationale: « Désir » préserve l’étendue lexicale du terme grec; le contexte indique déjà qu’il s’agit d’un désir coupable et sexuel.
- source_word: διέστρεψεν τὴν καρδίαν σου
  choice: a perverti ton cœur
  rationale: « Perverti » exprime la déformation morale portée par διαστρέφω et convient au registre solennel de l’accusation.
theological_decisions:
- issue: Portée de l’apostrophe « Engeance de Canaan, et non de Juda »
  choice: Conserver littéralement l’image de l’ascendance et le contraste entre Canaan et Juda.
  alternative: Tu te conduis en Cananéen, et non en Judéen.
  rationale: Le grec formule une dénonciation en termes d’origine, et non une simple comparaison de conduite. La traduction préserve ainsi la tension rhétorique et identitaire du texte sans l’expliquer à sa place.
- issue: Nuance morale de ἐπιθυμία
  choice: désir
  alternative: convoitise
  rationale: Même si le contexte rend ce désir illicite, le mot grec reste plus large que « convoitise ». Le choix retenu évite de réduire l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, digne et direct. « Engeance » est volontairement soutenu et incisif afin de préserver la violence de l’apostrophe prophétique; le reste de la phrase privilégie une syntaxe courante et limpide.
