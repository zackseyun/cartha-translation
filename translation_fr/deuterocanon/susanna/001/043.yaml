base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/043.yaml
  text: You know that they testified falsely against me; and behold[a], I am dying, having done none of the things that these men wickedly contrived against me.
translation:
  language: fr
  text: Tu sais qu’ils ont porté un faux témoignage contre moi ; voici que je meurs, sans avoir rien fait de ce que ces hommes ont tramé avec malveillance contre moi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sans avoir rien fait de ce que ces hommes ont manigancé contre moi ». Le verbe grec peut souligner soit une machination perverse, soit plus largement une action malveillante dirigée contre Suzanne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίστασαι
  choice: Tu sais
  rationale: Dans cette adresse directe à Dieu, le verbe exprime simplement une connaissance certaine; « Tu sais » est naturel et direct.
- source_word: ψευδῆ μου κατεμαρτύρησαν
  choice: ils ont porté un faux témoignage contre moi
  rationale: La tournure conserve le cadre judiciaire et rend explicitement la fausseté du témoignage dirigé contre Suzanne.
- source_word: ἰδοὺ
  choice: Et voici
  rationale: « Voici » garde la fonction présentative et solennelle de la particule sans recourir à une formulation archaïque.
- source_word: ἀποθνῄσκω
  choice: je vais mourir
  rationale: Dans le contexte d’une condamnation imminente, le présent grec exprime une mort toute proche; cette formulation est plus naturelle en français que « je meurs ».
- source_word: μὴ ποιήσασα μηδὲν ὧν
  choice: sans avoir rien fait de ce que
  rationale: Cette construction rend directement le participe négatif et affirme l’innocence de Suzanne sans ajouter une valeur concessive absente de la forme grecque.
- source_word: οὗτοι
  choice: ces hommes
  rationale: Le démonstratif désigne les accusateurs présents; « ces hommes » en explicite naturellement le référent.
- source_word: ἐπονηρεύσαντο κατ᾽ ἐμοῦ
  choice: ont tramé avec malveillance contre moi
  rationale: Le choix conserve à la fois l’idée d’une machination et la coloration morale du verbe, tout en laissant ouverte la portée exacte de leur action malveillante.
theological_decisions:
- issue: Portée de μὴ ποιήσασα μηδὲν ὧν οὗτοι ἐπονηρεύσαντο κατ᾽ ἐμοῦ
  choice: sans avoir rien fait de ce que ces hommes ont tramé avec malveillance contre moi
  alternative: bien que je n’aie rien fait de ce que ces hommes ont inventé contre moi
  rationale: La traduction retenue suit étroitement la construction participiale et oppose l’innocence de Suzanne à la conduite malveillante des accusateurs, sans préciser indûment si le verbe vise surtout leur complot, leurs accusations fabriquées ou l’ensemble de leur action.
translation_notes:
  register: Français international moderne, digne et accessible. Le ton judiciaire est préservé par « porté un faux témoignage », tandis que « Et voici » maintient la solennité de la prière. La note signale l’amplitude sémantique de ἐπονηρεύσαντο sans résoudre artificiellement son ambiguïté.
