  text: And he took a wife whose name was Susanna[a], the daughter of Hilkiah, beautiful,
translation:
  language: fr
  text: Il épousa une femme nommée Suzanne, fille d’Helcias, qui était belle,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque est très condensée et se poursuit avec la description du verset suivant. Plus littéralement : « Il prit une femme dont le nom était Suzanne, fille d’Helcias, belle… »'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβε γυναῖκα
  choice: Il épousa une femme
  rationale: Dans ce contexte matrimonial, l’expression grecque signifie littéralement qu’il « prit une femme », c’est-à-dire qu’il l’épousa. La formulation choisie est naturelle en français moderne tout en conservant la mention explicite de la femme.
- source_word: ᾗ ὄνομα Σουσάννα
  choice: nommée Suzanne
  rationale: La tournure grecque « dont le nom était Suzanne » est rendue idiomatiquement, sans perte d’information.
- source_word: θυγάτηρ Χελκίου
  choice: fille d’Helcias
  rationale: Le groupe nominal indique simplement la filiation. « Helcias » est la forme française traditionnelle et courante du nom biblique correspondant au grec Χελκίου.
- source_word: καλή
  choice: belle
  rationale: Dans cette présentation de Suzanne, l’adjectif décrit naturellement sa beauté physique. La phrase grecque étant comprimée et se poursuivant au verset suivant, le relatif français explicite le lien syntaxique.
