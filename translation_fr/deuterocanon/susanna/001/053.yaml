  text: formerly[a], while you were rendering unjust judgments and condemning the innocent, but releasing the guilty, though the Lord says[b], ‘You shall not put to death the innocent and righteous.’
translation:
  language: fr
  text: 'Auparavant, tu rendais des jugements injustes[a] : tu condamnais les innocents, mais tu relâchais les coupables, alors que le Seigneur dit[b] : « Tu ne feras pas mourir l’innocent et le juste. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu jugeais des jugements injustes ». Le grec emploie deux mots de même racine pour renforcer l’accusation.'
    reason: lexical_alternative
  - marker: b
    text: 'La citation reprend le langage juridique d’Exode 23.7 dans la tradition grecque : il ne faut pas faire mourir l’innocent et le juste.'
    reason: cross_reference
lexical_decisions:
- source_word: πρότερον
  choice: auparavant
  rationale: L’adverbe renvoie à la conduite passée de l’ancien et s’intègre naturellement à la phrase française.
- source_word: κρίνων κρίσεις ἀδίκους
  choice: tu rendais des jugements injustes
  rationale: « Rendre des jugements » est l’expression judiciaire naturelle en français; la répétition étymologique grecque est signalée en note.
- source_word: τοὺς μὲν ἀθῴους κατακρίνων
  choice: tu condamnais les innocents
  rationale: ἀθῷος désigne ici ceux qui sont exempts de faute, et κατακρίνω leur condamnation judiciaire.
- source_word: ἀπολύων δὲ τοὺς αἰτίους
  choice: mais tu relâchais les coupables
  rationale: « Relâcher » conserve la portée assez large de ἀπολύω sans imposer l’idée plus technique d’un acquittement formel; αἴτιος désigne les personnes coupables.
- source_word: λέγοντος τοῦ κυρίου
  choice: alors que le Seigneur dit
  rationale: Cette tournure rend le génitif absolu et fait entendre le contraste contextuel entre la conduite de l’ancien et le commandement divin.
- source_word: Ἀθῷον καὶ δίκαιον
  choice: l’innocent et le juste
  rationale: Les deux qualificatifs sont maintenus distinctement afin de préserver la formulation juridique de l’écho scripturaire.
- source_word: οὐκ ἀποκτενεῖς
  choice: tu ne feras pas mourir
  rationale: Dans ce contexte judiciaire, la formule désigne la mise à mort plutôt que le fait de tuer au sens général.
theological_decisions:
- issue: Traduction de κύριος dans une citation scripturaire grecque
  choice: le Seigneur
  alternative: l’Éternel
  rationale: Le texte source porte κύριος. « Le Seigneur » en est la traduction directe, sans reconstruire dans le corps du texte le nom divin sous-jacent.
- issue: Valeur de λέγοντος τοῦ κυρίου
  choice: alors que le Seigneur dit
  alternative: puisque le Seigneur dit
  rationale: « Alors que » préserve le contraste contextuel sans transformer explicitement la proposition en justification causale.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe à un seul ancien. La ponctuation explicite la structure d’une phrase grecque fragmentaire sans ajouter de contenu.
