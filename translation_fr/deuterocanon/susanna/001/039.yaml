  text: And when we came near, we saw her; but the young man fled, being covered.
translation:
  language: fr
  text: Quand nous nous sommes approchés, nous l’avons reconnue ; mais le jeune homme s’est enfui, couvert.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « étant couvert » ; le grec ne précise pas ce qui était couvert.'
    reason: Préserver l’ambiguïté du participe grec συγκεκαλυμμένος sans ajouter « le visage » au texte.
lexical_decisions:
- source_word: ἐπέγνωμεν
  choice: nous l’avons reconnue
  rationale: Le verbe ἐπιγινώσκω exprime ici l’identification de Suzanne, et non simplement le fait de la voir.
- source_word: νεανίσκος
  choice: le jeune homme
  rationale: Rendu courant et précis pour désigner un homme jeune.
- source_word: συγκεκαλυμμένος
  choice: le visage couvert
  rationale: Le participe signifie littéralement « couvert » ou « enveloppé ». En contexte de fuite et d’identification, le français naturel appelle la précision implicite « le visage », tout en signalant l’ambiguïté par une note.
theological_decisions:
- issue: Nature de l’identification exprimée par ἐπέγνωμεν
  choice: nous l’avons reconnue
  alternative: nous l’avons vue
  rationale: Le composé ἐπιγινώσκω porte normalement l’idée de reconnaître ou d’identifier. Ce choix conserve la logique du faux témoignage des anciens sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve le contraste marqué par δέ et le ton direct du témoignage rapporté.
