base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/025.yaml
  text: It is preferable for me to fall into your hands without doing it rather than to sin before the Lord[a].
translation:
  language: fr
  text: Il vaut mieux pour moi de tomber entre vos mains sans avoir fait cela que de pécher devant le Seigneur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « n’ayant pas fait [cela] ». Le grec laisse l’acte sous-entendu et renvoie à l’exigence formulée par les anciens.'
    reason: alternative lexicale
lexical_decisions:
- source_word: αἱρετόν μοί ἐστιν
  choice: Il vaut mieux pour moi
  rationale: Cette tournure exprime le choix personnel entre deux issues. « Il vaut mieux pour moi » rend naturellement en français la valeur comparative de αἱρετόν et la nuance personnelle du datif μοί.
- source_word: μὴ πράξασαν
  choice: sans avoir fait cela
  rationale: Le participe aoriste nie l’accomplissement de l’acte exigé auparavant. « Cela » fournit le minimum nécessaire en français tout en laissant l’acte implicite, comme en grec.
- source_word: ἐμπεσεῖν εἰς τὰς χεῖρας ὑμῶν
  choice: tomber entre vos mains
  rationale: Cette expression conserve l’image grecque du fait de tomber au pouvoir de quelqu’un et demeure idiomatique en français moderne.
- source_word: ἢ
  choice: que
  rationale: Après « il vaut mieux », « que » introduit naturellement le second terme de la comparaison.
- source_word: ἁμαρτεῖν
  choice: pécher
  rationale: « Pécher » est l’équivalent direct dans ce contexte de responsabilité morale devant Dieu.
- source_word: ἐνώπιον Κυρίου
  choice: devant le Seigneur
  rationale: Cette formulation préserve l’idée d’un acte commis en présence et sous le regard du Seigneur, sans explicitation interprétative supplémentaire.
theological_decisions:
- issue: Faut-il expliciter la nature de l’acte exigé par les anciens ?
  choice: Conserver l’acte implicite avec le seul démonstratif « cela »
  alternative: Expliciter par « me soumettre à vous » ou « commettre ce péché »
  rationale: Le grec ne nomme pas l’acte et renvoie au contexte précédent. L’expliciter davantage résoudrait une retenue délibérément présente dans le texte source.
translation_notes:
  register: Français international moderne, clair et digne. La structure comparative reste proche du grec, tandis que « tomber entre vos mains » en conserve l’image idiomatique.
