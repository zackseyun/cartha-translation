  text: Then the elders and judges stood up and laid their hands on her head.
translation:
  language: fr
  text: Alors les anciens et les juges se levèrent et posèrent leurs mains sur la tête de Suzanne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστάντες
  choice: se levèrent
  rationale: Le participe aoriste introduit l’action suivante dans le récit. « Se levèrent » restitue naturellement le mouvement exprimé par ἀνίστημι.
- source_word: οἱ πρεσβύτεροι
  choice: les anciens
  rationale: Dans ce contexte, le terme désigne des responsables reconnus de la communauté, et non simplement des hommes âgés.
- source_word: κριταὶ
  choice: les juges
  rationale: Le mot désigne ceux qui exercent ici une fonction judiciaire; « juges » en est l’équivalent français direct.
- source_word: ἐπέθηκαν τὰς χεῖρας αὐτῶν
  choice: posèrent leurs mains
  rationale: Cette formulation décrit clairement le geste concret sans lui donner d’emblée les connotations religieuses que pourrait suggérer en français l’expression figée « imposer les mains ».
- source_word: ἐπὶ τῆς κεφαλῆς αὐτῆς
  choice: sur la tête de Suzanne
  rationale: Le grec dit littéralement « sur sa tête ». La reprise du nom évite en français une légère ambiguïté sur le référent du possessif, sans modifier le sens.
theological_decisions:
- issue: Éventuelles connotations rituelles ou sacramentelles du geste
  choice: « posèrent leurs mains sur la tête de Suzanne », comme geste concret dans une procédure judiciaire
  alternative: « lui imposèrent les mains » ou « posèrent leurs mains sur sa tête »
  rationale: Le texte grec décrit un acte physique accompli dans le cadre du procès. La traduction n’y introduit pas de sens ecclésial ultérieur.
translation_notes:
  register: Français moderne, courant et digne. La coordination simple conserve le rythme narratif du grec. Le nom « Suzanne » est repris à la fin pour assurer une référence limpide.
