  text: And he holds a scepter like a man[a], a judge of a country[b], who will not destroy the one who sins against him.
translation:
  language: fr
  text: Et il tient un sceptre comme un homme, un juge d’un pays, mais il ne mettra pas à mort celui qui pèche contre lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’éliminera pas » ou « ne supprimera pas ». Le verbe grec peut désigner la mise à mort aussi bien que le fait d’enlever ou de faire disparaître quelqu’un.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκήπτρον
  choice: sceptre
  rationale: Le terme désigne un bâton symbolisant l’autorité; « sceptre » conserve naturellement en français l’image royale et judiciaire.
- source_word: ὡς ἄνθρωπος κριτὴς χώρας
  choice: comme un homme qui serait juge d’un pays
  rationale: Cette formulation rattache naturellement « juge d’un pays » à « homme » et rend l’apparence d’autorité que l’idole affiche sans réellement la posséder. Le conditionnel « serait » explicite la comparaison irréelle sans nier l’image.
- source_word: χώρας
  choice: d’un pays
  rationale: χώρα peut désigner un pays, une contrée ou une région. « Un pays » est actuel, clair et suffisamment indéfini pour l’absence d’article en grec.
- source_word: ἀνελεῖ
  choice: ne fera pas mourir
  rationale: Dans ce contexte judiciaire, ἀναιρέω évoque principalement la mise à mort ou l’élimination. « Faire mourir » exprime clairement l’incapacité de l’idole à exécuter une sentence tout en évitant un registre trop abrupt.
- source_word: τὸν εἰς αὐτὸν ἁμαρτάνοντα
  choice: celui qui pèche contre lui
  rationale: La tournure conserve la portée morale de ἁμαρτάνω et la relation hostile exprimée par εἰς αὐτόν, dans un français biblique encore courant et intelligible.
theological_decisions:
- issue: L’idole porte les signes de l’autorité judiciaire humaine sans pouvoir punir
  choice: Conserver l’image du juge et affirmer directement qu’elle ne fera pas mourir celui qui pèche contre elle.
  alternative: Rendre κριτής par « dirigeant » et ἀνελεῖ par « supprimera » ou « éliminera ».
  rationale: Le grec juxtapose un symbole d’autorité, le sceptre, et l’impuissance effective de l’idole. « Juge » préserve la dimension judiciaire, tandis que la note maintient l’étendue sémantique du verbe sans imposer une lecture doctrinale.
translation_notes:
  register: 'Français international moderne, digne et accessible. La phrase privilégie une comparaison naturelle en français tout en conservant l’ironie du grec : l’idole possède l’emblème d’un juge, mais non son pouvoir.'
