    text: Ou « n’éliminera pas » ou « ne supprimera pas ». Le verbe grec peut désigner la mise à mort aussi bien que le fait d’enlever ou de faire disparaître quelqu’un.
    reason: lexical_alternative
  revision_rationale: La révision retire le conditionnel interprétatif, restitue l’apposition grecque entre « homme » et « juge d’un pays », et emploie « mettra à mort » pour la valeur judiciaire immédiate d’ἀνελεῖ. La note conserve les sens alternatifs sans trancher au-delà du grec.
