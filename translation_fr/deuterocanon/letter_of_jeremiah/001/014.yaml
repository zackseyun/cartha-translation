  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/014.yaml
  text: In his right hand he holds a dagger and an axe[a], but he cannot rescue himself from war and robbers. Therefore it is evident that they are not gods[b]; so do not fear them.
translation:
  language: fr
  text: Il tient dans sa main droite un poignard et une hache[a], mais il ne peut pas se sauver lui-même de la guerre et des brigands. Il est donc évident qu’ils ne sont pas des dieux ; ne les craignez donc pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une épée courte » pour « un poignard ». Le grec désigne une arme tenue à la main.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγχειρίδιον
  choice: poignard
  rationale: Le terme désigne une arme tenue à la main, typiquement un poignard ou une épée courte. « Poignard » est naturel en français moderne et convient à son association avec la hache.
- source_word: δεξιᾷ
  choice: dans sa main droite
  rationale: Le datif a ici une valeur locative avec ἔχει ; cette formulation est idiomatique en français.
- source_word: πέλεκυν
  choice: hache
  rationale: « Hache » rend le sens ordinaire du mot grec sans préciser indûment la taille de l’arme.
- source_word: ἐξελεῖται
  choice: se délivrer lui-même
  rationale: Le moyen accompagné de ἑαυτόν exprime la délivrance de soi. « Se délivrer lui-même » préserve clairement cette idée.
- source_word: λῃστῶν
  choice: brigands
  rationale: Le terme évoque des voleurs violents ou des bandits. « Brigands » convient particulièrement au contexte d’une menace parallèle à la guerre.
- source_word: ὅθεν
  choice: donc
  rationale: Le mot introduit la conclusion tirée de l’incapacité de l’idole à se protéger.
- source_word: γνῶριμοί εἰσιν
  choice: on reconnaît
  rationale: Cette tournure garde l’idée grecque qu’ils sont reconnaissables ou connus comme n’étant pas des dieux, sans transformer entièrement l’expression en simple constat abstrait.
- source_word: οὐκ ὄντες θεοί
  choice: qu’ils ne sont pas des dieux
  rationale: La proposition française explicite naturellement le contenu du constat exprimé par le participe grec.
- source_word: μὴ οὖν φοβηθῆτε αὐτούς
  choice: ne les craignez donc pas
  rationale: Cette formulation conserve la prohibition, le lien conclusif et le registre exhortatif du grec.
theological_decisions:
- issue: Passage du singulier dans la description au pluriel dans la conclusion
  choice: Maintenir le singulier pour l’idole décrite (« Il tient… il ne peut… »), puis le pluriel pour l’ensemble des idoles (« ils… les »).
  alternative: Uniformiser tout le verset au pluriel.
  rationale: Le grec présente une idole représentative au singulier, puis étend explicitement la conclusion à toute cette catégorie au pluriel. Conserver ce changement respecte sa progression rhétorique.
translation_notes:
  register: Français international moderne, clair et digne. Le masculin singulier personnifie l’idole comme dans le grec, sans effacer le passage ultérieur au pluriel. « Brigands » exprime ici la menace violente portée par λῃσταί.
