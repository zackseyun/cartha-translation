  text: For the sun and the moon and the stars, being bright and sent out for needs, are obedient.
translation:
  language: fr
  text: Car le soleil, la lune et les étoiles, qui brillent et sont envoyés pour répondre aux besoins,[a] obéissent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour servir » ou « en vue des usages nécessaires » ; l’expression grecque peut évoquer aussi bien la satisfaction des besoins que l’accomplissement de fonctions assignées.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥλιος
  choice: le soleil
  rationale: Équivalent français courant du corps céleste désigné.
- source_word: σελήνη
  choice: la lune
  rationale: Équivalent direct, dans la triade conventionnelle avec le soleil et les étoiles.
- source_word: ἄστρα
  choice: les étoiles
  rationale: Le pluriel grec désigne ici les astres visibles; « étoiles » est naturel et précis.
- source_word: ὄντα λαμπρά
  choice: qui brillent
  rationale: Cette formulation française naturelle rend l’état lumineux exprimé par le participe et l’adjectif, sans lourdeur.
- source_word: ἀποστελλόμενα
  choice: sont envoyés
  rationale: Le passif conserve l’image d’une mission ou d’une fonction assignée, sans nommer explicitement celui qui envoie.
- source_word: ἐπὶ χρείας
  choice: pour répondre aux besoins
  rationale: χρεία peut exprimer le besoin, l’usage ou le service. Cette tournure reste proche du sens tout en étant idiomatique en français.
- source_word: εὐήκοά
  choice: obéissent
  rationale: Le verbe français exprime naturellement la docilité ou l’obéissance attribuée aux corps célestes dans leur fonction.
theological_decisions:
- issue: Agent et finalité des corps célestes
  choice: Le soleil, la lune et les étoiles sont présentés comme envoyés et obéissants, ce qui suggère un ordre reçu sans nommer son auteur.
  alternative: Comprendre ces termes comme une simple évocation impersonnelle de la régularité de la nature.
  rationale: Le participe passif ἀποστελλόμενα et εὐήκοα impliquent ensemble mission et obéissance. La traduction préserve cette implication sans ajouter « Dieu », absent du verset.
translation_notes:
  register: Français moderne, digne et accessible. La relative « qui brillent » évite le calque pesant « étant lumineux ». L’accord masculin pluriel de « envoyés » suit l’ensemble coordonné comprenant « le soleil ».
