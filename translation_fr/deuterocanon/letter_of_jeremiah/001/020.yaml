lexical_decisions:
- source_word: μεμελανωμένον
  choice: noirci
  rationale: 'Le participe parfait passif exprime l’état résultant : le visage a été rendu noir. « Noirci » conserve cet effet concret et visuel.'
- source_word: τὸ πρόσωπον αὐτῶν
  choice: leur visage
  rationale: 'Le grec emploie le singulier avec un possesseur pluriel. Le français peut naturellement garder ce singulier distributif : chacun a le visage noirci.'
- source_word: ἀπὸ τοῦ καπνοῦ
  choice: par la fumée
  rationale: ἀπό indique ici la cause; « par la fumée » rend clairement et naturellement ce rapport.
- source_word: τοῦ ἐκ τῆς οἰκίας
  choice: qui vient de la maison
  rationale: La tournure rend explicite que ἐκ τῆς οἰκίας précise l’origine de la fumée, tout en conservant le sens ordinaire de οἰκία.
theological_decisions:
- issue: Faut-il rendre οἰκία de façon interprétative par « sanctuaire » ou « temple » dans ce contexte d’idoles ?
  choice: maison
  alternative: sanctuaire; temple
  rationale: Le grec emploie le terme courant οἰκία, et non un terme cultuel précis. Le texte principal en conserve donc le sens direct, tandis que la note signale les interprétations possibles dans le contexte.
