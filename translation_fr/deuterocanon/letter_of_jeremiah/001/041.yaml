  source_fidelity: La construction grecque conserve un participe aoriste (νοήσαντες) susceptible d’une lecture temporelle (« après avoir compris ») ou concessive. La valeur concessive est plausible dans le contexte polémique. Toutefois, « s’en rendent compte » introduit en français un complément implicite (« en ») que le grec ne formule pas; « comprennent » rend νοήσαντες plus directement tout en préservant l’ironie avec « perception ».
  naturalness: « Et eux-mêmes ne peuvent pas » et « car ils n’ont aucune perception » sont naturels dans un français moderne de registre scripturaire. « Même s’ils comprennent » est plus net et idiomatique ici que « même s’ils s’en rendent compte », dont le pronom « en » tend à suggérer un référent absent du grec.
  terminology: « Eux-mêmes » restitue l’emphase de αὐτοὶ; « perception » convient à αἴσθησις. Le contraste volontaire entre « comprennent » (νοέω) et « perception » (αἴσθησις) ne doit pas être nivelé.
