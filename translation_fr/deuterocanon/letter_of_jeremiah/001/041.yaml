  text: And they themselves cannot[a], even though they perceive it, leave them behind, for they have no perception.
translation:
  language: fr
  text: Et eux-mêmes ne peuvent pas[a], même s’ils comprennent, les laisser derrière eux, car ils n’ont aucune perception.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « après avoir compris, ils ne peuvent pas les laisser derrière eux » ; le participe grec νοήσαντες peut se comprendre plus littéralement ainsi, bien que sa valeur soit probablement concessive dans ce contexte.'
    reason: Alternative lexicale et syntaxique
lexical_decisions:
- source_word: οὐ δύνανται
  choice: ne peuvent pas
  rationale: Expression française naturelle de l’incapacité indiquée par δύναμαι.
- source_word: αὐτοὶ
  choice: eux-mêmes
  rationale: Conserve l’emphase du pronom grec sur l’incapacité des idoles elles-mêmes.
- source_word: νοήσαντες
  choice: même s’ils s’en rendent compte
  rationale: Rend la valeur concessive probable du participe aoriste dans ce contexte, tout en maintenant la tension ironique avec l’absence de perception affirmée ensuite.
- source_word: καταλιπεῖν
  choice: laisser derrière eux
  rationale: Préserve l’idée spatiale de laisser ou d’abandonner, sans préciser indûment le référent.
- source_word: αὐτά
  choice: les
  rationale: Le pronom neutre pluriel a un référent peu explicite; le pronom français en conserve la concision et l’ambiguïté.
- source_word: αἴσθησιν
  choice: perception
  rationale: « Perception » couvre la faculté de sentir ou de prendre conscience et convient à la dénonciation d’objets inanimés.
- source_word: οὐκ ἔχουσιν
  choice: ils n’ont aucune
  rationale: Formulation idiomatique qui exprime nettement la négation de toute possession.
theological_decisions:
- issue: Référent et force rhétorique dans la polémique contre les idoles
  choice: Le pronom emphatique désigne les idoles elles-mêmes, présentées comme incapables d’agir et dépourvues de perception.
  alternative: 'Traduire simplement αὐτοὶ par « ils » et lire νοήσαντες temporellement : « après s’en être rendu compte ».'
  rationale: Le contexte soutient l’emphase sur l’impuissance des idoles. La traduction concessive préserve l’ironie et la tension interne du grec sans tenter de les résoudre.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition conceptuelle entre « s’en rendent compte » et « perception » est maintenue afin de préserver la tension rhétorique du grec; le référent de « les » reste volontairement indéterminé.
