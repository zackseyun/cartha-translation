  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/057.yaml
  text: From them the strong will strip away the gold and the silver[a], and they will go off with the clothing that is wrapped around them[b]; yet they certainly will not help themselves.
translation:
  language: fr
  text: Les puissants leur enlèveront l’or et l’argent et partiront en emportant le vêtement qui les recouvre ; ces idoles ne se secourront certainement pas elles-mêmes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie ici une négation fortement appuyée, à valeur future : « elles ne se secourront certainement pas elles-mêmes ».'
    reason: Précision sur la force emphatique de οὐ μή.
lexical_decisions:
- source_word: οἱ ἰσχύοντες
  choice: les hommes puissants
  rationale: Le participe substantivé désigne ceux qui disposent de la force ou du pouvoir nécessaire pour dépouiller les idoles. « Les hommes puissants » est naturel et explicite en français.
- source_word: περιελοῦνται
  choice: arracheront
  rationale: Le verbe exprime ici l’action d’enlever ce qui entoure ou recouvre les idoles. Dans ce contexte de pillage, « arracheront » restitue avec concision la vigueur de l’action.
- source_word: τὸ χρυσίον καὶ τὸ ἀργύριον
  choice: l’or et l’argent
  rationale: La formulation conserve les deux objets définis sans introduire un possessif absent du grec.
- source_word: τὸν ἱματισμὸν τὸν περικείμενον αὐτοῖς
  choice: les vêtements qui les enveloppent
  rationale: ἱματισμός désigne l’habillement, tandis que περικείμενον indique qu’il est disposé autour des idoles. « Enveloppent » préserve cette image concrète sans imposer l’idée d’un vêtement ajusté.
- source_word: ἀπελεύσονται ἔχοντες
  choice: ils partiront en emportant
  rationale: Cette tournure rend le verbe de départ et le participe concomitant, qui précise que les pillards repartent en possession des vêtements.
- source_word: οὔτε ἑαυτοῖς οὐ μὴ βοηθήσωσιν
  choice: mais ces idoles ne pourront certainement pas se porter secours à elles-mêmes
  rationale: « Certainement pas » traduit la négation grecque fortement appuyée. Le réfléchi est conservé par « à elles-mêmes » ; « ces idoles » explicite en français le sujet référé par le pronom grec afin d’éviter que « elles-mêmes » soit rapporté aux personnes puissantes.
theological_decisions:
- issue: Référent de la proposition finale
  choice: La proposition décrit l’incapacité des idoles à se secourir elles-mêmes.
  alternative: La proposition pourrait être comprise plus largement comme une affirmation générale de leur impuissance.
  rationale: Dans le contexte de la Lettre de Jérémie, les idoles sont constamment présentées comme incapables d’agir ou de sauver. Le réfléchi ἑαυτοῖς souligne ici leur incapacité à intervenir même en leur propre faveur.
- issue: Force de la négation finale
  choice: « ne pourront certainement pas »
  alternative: « ne se porteront pas secours »
  rationale: La construction οὐ μή porte une négation emphatique à valeur future. La traduction retenue en maintient la force sans transformer l’énoncé en impossibilité métaphysique abstraite.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme oppose nettement le pillage effectué par des personnes puissantes à l’impuissance des idoles. L’explicitation « ces idoles » évite une ambiguïté référentielle artificielle en français, tandis que la note signale l’emphase propre à la négation grecque.
