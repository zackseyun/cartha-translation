revisions:
- from: Les hommes puissants leur arracheront l’or et l’argent, puis ils partiront en emportant les vêtements qui les enveloppent ; mais ces idoles ne pourront certainement pas se porter secours à elles-mêmes.[a]
  to: Les puissants leur enlèveront l’or et l’argent et partiront en emportant le vêtement qui les recouvre ; ces idoles ne se secourront certainement pas elles-mêmes.[a]
  rationale: La révision conserve le référent explicite « ces idoles » et le contraste contextuel, tout en supprimant l’idée supplémentaire d’incapacité introduite par « ne pourront ». Elle rend le participe substantivé sans marquage de genre et respecte le singulier collectif de ἱματισμός.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T11:49:54Z'
review_pass:
  verdict: revise
  source_fidelity: 'La structure principale est bien rendue : des puissants enlèvent les métaux précieux des idoles et partent avec leur vêtement. Toutefois, « ne pourront ... se porter secours » traduit la négation future emphatique οὐ μή par une idée d’incapacité (« ne pourront ») plutôt que par la négation catégorique de l’action (« ne ... pas »). « Hommes » restreint aussi sans nécessité le participe substantivé οἱ ἰσχύοντες.'
  naturalness: La phrase est globalement claire et de registre approprié. « Les puissants » est plus direct et non genré. Au singulier collectif, « le vêtement qui les recouvre » suit de plus près τὸν ἱματισμόν et est plus fluide que le pluriel « les vêtements qui les enveloppent ». « Se secourir elles-mêmes » est naturel et évite la tournure plus lourde « se porter secours à elles-mêmes ».
  terminology: « Idoles » explicite légitimement le référent contextuel de la dernière proposition et prévient une ambiguïté française avec les pillards. « Enlever » rend précisément περιελοῦνται sans surinterpréter son intensité. La note doit refléter la formulation révisée et caractériser οὐ μή comme une négation emphatique à portée future.
  issues:
  - severity: medium
    issue: « ne pourront certainement pas » introduit une modalité d’incapacité.
    rationale: 'οὐ μὴ βοηθήσωσιν exprime une négation emphatique à valeur future : les idoles ne se secourront assurément pas. Le texte grec ne formule pas ici explicitement « elles ne pourront pas ».'
  - severity: low
    issue: « Les hommes puissants » ajoute une précision de genre non exprimée.
    rationale: οἱ ἰσχύοντες est un participe substantivé désignant les personnes puissantes ou les puissants ; « les puissants » conserve la concision et l’indétermination du grec.
  - severity: low
    issue: Le pluriel « les vêtements » s’éloigne du singulier τὸν ἱματισμόν.
    rationale: Le singulier peut désigner le vêtement ou l’habillement comme élément d’apparat. Le conserver maintient l’image du texte sans difficulté en français.
