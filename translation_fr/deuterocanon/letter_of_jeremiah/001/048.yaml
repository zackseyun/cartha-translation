  text: For when war and calamities come upon them[a], the priests consult among themselves where they may hide with them.
translation:
  language: fr
  text: Car, lorsque la guerre et les malheurs fondent sur elles[a], les prêtres se concertent pour savoir où se cacher avec elles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire les idoles ou leurs représentations mentionnées dans le passage environnant.
    reason: cross_reference
lexical_decisions:
- source_word: ὅταν
  choice: lorsque
  rationale: Introduit une éventualité générale à venir; « lorsque » convient à un registre narratif digne et naturel.
- source_word: ἐπέλθῃ
  choice: fondent sur
  rationale: Rend la venue hostile exprimée par le verbe composé avec ἐπί, tout en s’accordant idiomatiquement avec « la guerre et les malheurs ».
- source_word: πόλεμος
  choice: la guerre
  rationale: Équivalent courant et suffisamment large dans ce contexte de crise.
- source_word: κακά
  choice: les malheurs
  rationale: Désigne ici des événements funestes plutôt que le mal moral; « malheurs » préserve la largeur sémantique du grec.
- source_word: βουλεύονται πρὸς ἑαυτούς
  choice: se concertent
  rationale: Exprime avec naturel la délibération réciproque des prêtres.
- source_word: ποῦ
  choice: pour savoir où
  rationale: Introduit idiomatiquement en français le contenu de leur concertation.
- source_word: συγκαρυβῶσι
  choice: se cacher
  rationale: Le verbe rare exprime l’action de se dissimuler; la valeur associative du préfixe σύν est aussi portée par « avec elles ».
- source_word: μετʼ αὐτῶν
  choice: avec elles
  rationale: Conserve le pronom grec et l’ironie des prêtres qui cherchent à se cacher avec les représentations qu’ils servent.
theological_decisions:
- issue: Référent de αὐτά et αὐτῶν
  choice: Conserver les pronoms féminins « elles » dans le texte et préciser leur référent en note.
  alternative: Introduire directement « les idoles » ou « les images » dans le verset.
  rationale: Le grec reste pronominal. Le contexte identifie les idoles ou leurs représentations, mais les nommer dans le corps du verset lèverait une implicitation présente dans la source.
translation_notes:
  register: Français international moderne, clair et digne. « Se concertent » évite la lourdeur de « se consultent entre eux ». Le féminin « elles » correspond naturellement à « idoles » ou « représentations », tout en maintenant le caractère pronominal du grec.
