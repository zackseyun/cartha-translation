  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/010.yaml
  text: They even give some of their things to the prostitutes on the roof[b][a]. And they adorn them with clothing like human beings—silver gods and gold gods and wooden ones.
translation:
  language: fr
  text: Ils en donneront même aux prostituées qui sont sur le toit[a][b]. Ils les parent de vêtements comme on le ferait pour des êtres humains, ces dieux d’argent, ces dieux d’or et ceux de bois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « d’eux » ou « provenant d’eux » ; le pronom renvoie probablement à des objets ou à des biens associés aux idoles dans le contexte.'
    reason: lexical_alternative
  - marker: b
    text: Certains comprennent « les prostituées qui sont sur le toit » comme des prostituées liées à un culte, mais le grec ne dit pas explicitement « prostituées du temple ».
    reason: alternative_reading
lexical_decisions:
- source_word: δώσουσιν
  choice: ils donneront
  rationale: Le futur grec est conservé en français; le sujet indéfini pluriel ressort du contexte.
- source_word: ἀπʼ αὐτῶν
  choice: ils en donneront
  rationale: Le pronom est rendu par « en », ce qui préserve son référent contextuel sans préciser abusivement s’il s’agit d’offrandes, d’ornements ou d’autres biens liés aux idoles.
- source_word: ταῖς ἐπὶ τοῦ στέγους πόρναις
  choice: aux prostituées qui sont sur le toit
  rationale: πόρναι signifie « prostituées » et ἐπὶ τοῦ στέγους les situe sur le toit; aucune fonction cultuelle n’est ajoutée au texte.
- source_word: κοσμοῦσί
  choice: ils les parent
  rationale: « Parer » exprime l’action d’orner ou d’habiller avec soin et convient au registre biblique moderne.
- source_word: ὡς ἀνθρώπους
  choice: comme des êtres humains
  rationale: ἀνθρώπους désigne génériquement les humains, sans restriction au sexe masculin.
- source_word: τοῖς ἐνδύμασιν
  choice: de vêtements
  rationale: 'Le complément rend le datif instrumental: les vêtements sont le moyen employé pour parer les idoles.'
- source_word: θεοὺς ἀργυροῦς καὶ θεοὺς χρυσοῦς καὶ ξυλίνους
  choice: ces dieux d’argent, ces dieux d’or et ceux de bois
  rationale: La formulation garde la répétition de « dieux » pour l’argent et l’or, puis l’ellipse grecque dans « ceux de bois », tout en clarifiant l’apposition en français.
theological_decisions:
- issue: La possibilité d’un sens cultuel pour πόρναι
  choice: prostituées
  alternative: prostituées sacrées / prostituées du temple
  rationale: Le grec ne qualifie pas explicitement ces femmes de personnel cultuel. La traduction principale n’importe donc pas cette interprétation.
- issue: Le référent de ἀπʼ αὐτῶν
  choice: pronom adverbial « en » avec note
  alternative: une partie de leurs biens / de ces objets / de ces offrandes
  rationale: Le référent exact dépend du contexte et demeure sous-spécifié dans cette phrase; la traduction conserve cette ambiguïté plutôt que de la résoudre.
translation_notes:
  register: Français international moderne, clair et digne. Le futur grec est maintenu. « Ils les parent » conserve une tonalité soutenue sans archaïsme, tandis que l’apposition finale rend explicite que les objets parés sont les dieux d’argent, d’or et de bois.
