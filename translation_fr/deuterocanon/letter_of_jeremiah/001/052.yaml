  text: For they will certainly not raise up a king for a land, nor will they certainly give rain to men,
translation:
  language: fr
  text: Car ils ne pourront jamais établir un roi sur un pays[a], ni donner de la pluie aux êtres humains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur une contrée » ou « sur une région ». Le grec χώρα peut désigner un pays, une contrée ou une région.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλέα
  choice: un roi
  rationale: Accusatif singulier, complément de ἀναστήσωσιν. L’article indéfini rend naturellement l’emploi grec sans article.
- source_word: χώρας
  choice: sur un pays
  rationale: χώρα peut désigner un pays, une contrée ou une région. Avec l’établissement d’un roi, « sur un pays » exprime naturellement le rapport politique et territorial; l’absence de préposition en grec laisse ce rapport quelque peu implicite.
- source_word: οὐ μὴ ἀναστήσωσιν
  choice: ils ne pourront jamais établir
  rationale: οὐ μή suivi de l’aoriste subjonctif marque une négation future emphatique. « Ne pourront jamais » souligne ici l’incapacité absolue des idoles, tandis qu’« établir » convient à la mise en place d’un roi.
- source_word: ὑετόν
  choice: de la pluie
  rationale: Équivalent français courant et direct du terme grec désignant la pluie.
- source_word: ἀνθρώποις
  choice: aux êtres humains
  rationale: Le pluriel est générique et vise l’humanité en général. « Êtres humains » conserve explicitement cette portée sans suggérer les seuls hommes de sexe masculin.
- source_word: οὐ μὴ δῶσιν
  choice: ni donner
  rationale: La négation emphatique reste sous la portée de « ne pourront jamais » dans la coordination française, ce qui évite une répétition lourde tout en conservant la force du grec.
- source_word: γάρ
  choice: car
  rationale: Rend la valeur explicative ou argumentative de la particule et son lien avec le contexte précédent.
theological_decisions:
- issue: Portée générique de ἀνθρώποις
  choice: aux êtres humains
  alternative: aux hommes
  rationale: Le propos concerne l’incapacité des idoles à procurer la pluie à l’humanité en général. Le français moderne « êtres humains » communique sans ambiguïté cette portée générique.
- issue: Force de la double négation οὐ μή
  choice: ne pourront jamais
  alternative: ne… certainement pas
  rationale: La construction grecque exprime une forte négation tournée vers l’avenir. La formulation choisie préserve l’idée d’impossibilité absolue sans atténuer l’affirmation.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination compacte maintient les deux incapacités attribuées aux idoles. La virgule finale du texte source n’est pas reproduite, le verset étant présenté ici comme une unité autonome.
