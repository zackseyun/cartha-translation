review_pass:
  verdict: revise
  source_fidelity: 'La tournure impersonnelle « On leur essuie le visage » rend de façon défendable le moyen/passif ἐκμάσσονται dans le contexte où les idoles reçoivent des soins humains. « À cause de la poussière de la maison » traduit fidèlement διὰ ... κονιορτόν ἐκ τῆς οἰκίας. En revanche, « s’accumule » ajoute un procès absent du grec : le texte dit que la poussière est/se trouve en quantité plus grande sur eux.'
  naturalness: La phrase est naturelle en français international moderne. « Se trouve sur eux en plus grande quantité » est un peu plus explicite que le grec, mais reste idiomatique et préserve l’idée quantitative sans introduire l’accumulation.
  terminology: « Visage », « poussière » et « maison » conviennent. Le maintien de « maison » évite de spécifier interprétativement un temple ou un sanctuaire. La note conserve utilement la forme comparative inhabituelle de πλείω et l’absence de point de comparaison explicite.
  issues:
