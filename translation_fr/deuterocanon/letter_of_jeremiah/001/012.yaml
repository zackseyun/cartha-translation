    issue: Ajout aspectuel dans « qui s’accumule sur eux »
    rationale: Le verbe grec ἐστιν (« est/se trouve ») ne décrit pas l’accumulation de la poussière. Il indique son abondance ou sa présence en quantité supérieure sur les idoles. La révision retire cet ajout tout en conservant le sens contextuel.
