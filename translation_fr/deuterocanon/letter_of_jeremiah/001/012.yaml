  text: They wipe off their faces because of the dust from the house[a], which is thick upon them.
translation:
  language: fr
  text: On leur essuie le visage à cause de la poussière de la maison, qui se trouve sur eux en plus grande quantité[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « qui est davantage sur eux » ; la comparaison implicite exprime que la poussière se trouve sur eux en plus grande quantité.'
    reason: La valeur comparative de πλείω est conservée, sans lui attribuer un point de comparaison explicite.
lexical_decisions:
- source_word: ἐκμάσσονται
  choice: On leur essuie
  rationale: La forme moyenne ou passive est rendue par une tournure française à sujet indéfini. Celle-ci exprime naturellement que les idoles subissent l’action, sans leur attribuer à tort la capacité de s’essuyer elles-mêmes.
- source_word: τὸ πρόσωπον αὐτῶν
  choice: le visage
  rationale: Le grec emploie le singulier distributif avec un pronom pluriel. « Leur visage » reste naturel en français et désigne le visage de chacune des idoles.
- source_word: διὰ τὸν … κονιορτόν
  choice: à cause de la poussière
  rationale: διά suivi de l’accusatif a ici un sens causal, et κονιορτός désigne précisément la poussière.
- source_word: ἐκ τῆς οἰκίας
  choice: de la maison
  rationale: « Maison » traduit directement οἰκία sans préciser par interprétation qu’il s’agit d’un temple ou d’un sanctuaire.
- source_word: ὃς ἐστιν πλείω ἐπʼ αὐτοῖς
  choice: qui s’accumule sur eux en abondance
  rationale: 'La formulation rend en français idiomatique l’idée comparative ou quantitative de πλείω : une grande quantité de poussière se trouve sur les idoles. Une note conserve la formulation plus littérale et son étrangeté.'
theological_decisions:
- issue: Référent des pronoms pluriels et agent de l’action
  choice: Les pronoms renvoient aux idoles, et un agent humain non précisé leur essuie le visage.
  alternative: Comprendre la forme moyenne comme signifiant que les idoles s’essuient elles-mêmes le visage.
  rationale: Dans le contexte satirique, les idoles sont des objets impuissants qui nécessitent des soins humains. La tournure « On leur essuie » respecte cette situation tout en laissant l’agent non exprimé, comme dans le grec.
translation_notes:
  register: Français international moderne, simple et digne. La phrase conserve « maison », terme concret du grec, et emploie une tournure impersonnelle naturelle pour faire ressortir l’impuissance des idoles sans ajouter un agent explicitement nommé.
