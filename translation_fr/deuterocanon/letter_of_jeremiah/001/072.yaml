  text: So a righteous man who has no idols is better[b][a], for he will be far from reproach.
translation:
  language: fr
  text: Ainsi, mieux vaut un homme juste qui n’a pas d’idoles[a], car il sera loin de l’opprobre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une personne juste ». Le grec emploie ici le masculin singulier « homme » dans un sens représentatif.
    reason: lexical_alternative
  - marker: b
    text: « Opprobre » peut aussi se traduire par « déshonneur » ou « honte ».
    reason: lexical_alternative
lexical_decisions:
- source_word: κρείσσον οὖν
  choice: Ainsi, mieux vaut
  rationale: οὖν tire la conclusion de l’argument précédent, et « ainsi » l’exprime naturellement. La tournure impersonnelle « mieux vaut » rend avec élégance le comparatif prédicatif κρείσσον.
- source_word: ἄνθρωπος δίκαιος
  choice: un homme juste
  rationale: Le grec emploie le masculin singulier ἄνθρωπος avec δίκαιος. « Homme juste » conserve cette forme et le registre biblique sans rendre la phrase obscure.
- source_word: οὐκ ἔχων εἴδωλα
  choice: qui n’a pas d’idoles
  rationale: Cette proposition relative rend naturellement en français le participe présent qui qualifie l’homme, tout en maintenant la négation de la possession ou de l’association avec des idoles.
- source_word: ἔσται
  choice: il sera
  rationale: Rend directement le futur du verbe εἰμί dans un français moderne.
- source_word: μακρὰν ἀπὸ ὀνειδισμοῦ
  choice: loin de l’opprobre
  rationale: « Opprobre » exprime la honte et le déshonneur publics que peut désigner ὀνειδισμός, tout en conservant le ton solennel du passage.
theological_decisions:
- issue: Masculin singulier représentatif ἄνθρωπος
  choice: un homme juste
  alternative: une personne juste
  rationale: Le texte grec présente un homme au masculin singulier, vraisemblablement avec une portée représentative. Le texte principal garde cette forme, tandis qu’une note signale l’autre formulation française possible sans neutraliser silencieusement le grec.
- issue: Nature de ὀνειδισμός
  choice: l’opprobre
  alternative: la honte ou le déshonneur
  rationale: Le terme peut viser le reproche subi aussi bien que la honte ou le déshonneur qui en résulte. « Opprobre » préserve cette amplitude sans trancher en faveur d’une seule nuance.
translation_notes:
  register: Français international moderne, digne et lisible. La tournure « mieux vaut » est idiomatique; « opprobre », plus soutenu mais courant dans le registre biblique, conserve la densité sémantique du grec.
