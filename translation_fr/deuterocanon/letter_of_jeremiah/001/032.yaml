translation:
  language: fr
  text: Après avoir retiré leurs vêtements[a], les prêtres en habillent leurs femmes et leurs enfants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire les vêtements des idoles; le possessif renvoie aux statues mentionnées dans le contexte.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπὸ τοῦ ἱματισμοῦ αὐτῶν
  choice: leurs vêtements
  rationale: Ἱματισμός désigne collectivement les vêtements, et αὐτῶν renvoie aux idoles dans le contexte. Le possessif français conserve naturellement ce rapport sans nommer explicitement les idoles.
- source_word: ἀφελόμενοι
  choice: après avoir retiré
  rationale: Le participe aoriste exprime une action antérieure à celle du verbe principal; cette tournure en rend clairement la succession.
- source_word: οἱ ἱερεῖς
  choice: les prêtres
  rationale: Traduction directe du nom grec articulé, sans ajout possessif absent du texte.
- source_word: ἐνδύουσιν
  choice: en habillent
  rationale: Le verbe signifie mettre des vêtements à quelqu’un. Le pronom « en » indique avec naturel que les prêtres utilisent les vêtements qu’ils viennent de retirer.
- source_word: τὰς γυναῖκας αὐτῶν καὶ τὰ παιδία
  choice: leurs femmes et leurs enfants
  rationale: « Femmes » rend γυναῖκας ici au sens contextuel d’épouses, tandis que « enfants » rend simplement παιδία. La répétition de « leurs » produit une coordination claire en français.
theological_decisions:
- issue: Référent de αὐτῶν dans « τοῦ ἱματισμοῦ αὐτῶν »
  choice: Conserver le référent sous-entendu au moyen de « leurs vêtements », avec une note précisant qu’il s’agit des idoles.
  alternative: Traduire explicitement « les vêtements des idoles ».
  rationale: Le contexte identifie les idoles comme référent, mais le grec emploie un pronom. La formulation retenue préserve cette anaphore tout en restant naturelle en français.
translation_notes:
  register: Français moderne, clair et digne. La tournure « en habillent » évite une répétition lourde tout en explicitant sobrement l’emploi des vêtements retirés.
