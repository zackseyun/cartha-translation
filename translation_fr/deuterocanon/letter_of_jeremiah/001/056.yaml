  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/056.yaml
  text: How then can it be accepted or supposed that they are gods? Wooden gods overlaid with silver and overlaid with gold will certainly not save themselves from thieves or robbers[a][b].
translation:
  language: fr
  text: Comment donc peut-on admettre ou penser que ce sont des dieux[a] ? Ces dieux de bois, recouverts d’argent et d’or[b], ne pourront certainement échapper ni aux voleurs ni aux brigands.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Comment donc faut-il accepter ou considérer que ce sont des dieux ? » Le grec emploie deux adjectifs verbaux qui renforcent la question rhétorique.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « des dieux de bois, recouverts d’argent et recouverts d’or » ; la formulation souligne ironiquement qu’il s’agit d’objets fabriqués.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς οὖν
  choice: Comment donc
  rationale: Cette tournure naturelle en français conserve la progression logique et la force de la question rhétorique.
- source_word: ἐκδεκτέον ἢ νομιστέον
  choice: peut-on admettre ou penser
  rationale: Les deux adjectifs verbaux expriment ce qu’il faudrait accepter ou tenir pour vrai. La formulation française garde leur parallélisme sans alourdir la phrase.
- source_word: ὅτι εἰσὶν θεοί
  choice: que ce sont des dieux
  rationale: Le grec emploie explicitement θεοί. « Dieux » maintient la prétention que la question tourne en dérision, sans la remplacer par une interprétation comme « idoles ».
- source_word: Οὔτε ἀπὸ κλεπτῶν οὔτε ἀπὸ ληστῶν
  choice: ni aux voleurs ni aux brigands
  rationale: La répétition de οὔτε est rendue par la construction corrélative « ni… ni ». « Voleurs » et « brigands » préservent la distinction entre κλέπται et λῃσταί.
- source_word: οὐ μὴ διασώσωνται
  choice: ne pourront certainement échapper
  rationale: La forte négation οὐ μή est exprimée par « certainement », tandis qu’« échapper » convient au moyen διασώσωνται avec ἀπό et souligne l’impuissance ironique de ces prétendus dieux.
- source_word: θεοὶ ξύλινοι
  choice: Ces dieux de bois
  rationale: La traduction conserve θεοί et rend clairement la matière indiquée par ξύλινοι. « Ces » rattache naturellement le groupe nominal à la question précédente.
- source_word: περιάργυροι καὶ περίχρυσοι
  choice: recouverts d’argent et d’or
  rationale: Les adjectifs composés décrivent des objets revêtus d’argent et d’or. Cette formulation moderne fait ressortir leur caractère fabriqué sans ajouter le mot « seulement », absent du grec.
theological_decisions:
- issue: Rendu de θεοί dans une polémique contre l’idolâtrie
  choice: dieux
  alternative: idoles ; prétendus dieux
  rationale: Le texte grec dit explicitement « dieux », mais le contexte en récuse la divinité par l’ironie. Garder « dieux » préserve cette tension rhétorique sans intégrer l’interprétation au texte principal.
- issue: Capacité des dieux de bois à se préserver
  choice: ne pourront certainement échapper
  alternative: ne se sauveront absolument pas eux-mêmes ; ne seront certainement pas sauvés
  rationale: La forme διασώσωνται peut, selon sa valeur moyenne ou passive, évoquer le fait d’échapper, de se sauver ou d’être préservé. Avec ἀπό, « échapper à » donne un français naturel tout en conservant l’idée centrale de leur impuissance.
translation_notes:
  register: Français international moderne, clair et digne. La question conserve son ton polémique, tandis que « brigands » maintient la distinction lexicale du grec sans paraître excessivement archaïque.
