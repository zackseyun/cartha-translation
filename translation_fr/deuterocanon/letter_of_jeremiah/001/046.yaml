lexical_decisions:
- source_word: αὐτοί
  choice: ceux-là mêmes
  rationale: Le pronom intensif met en relief les fabricants eux-mêmes; «ceux-là mêmes» conserve cette insistance en français naturel.
- source_word: τε
  choice: et
  rationale: La particule relie cette affirmation à l’argument qui précède; «et» est ici le connecteur français le plus naturel.
- source_word: οἱ κατασκευάσαντες
  choice: qui les ont fabriquées
  rationale: Le participe aoriste désigne les artisans qui ont confectionné les idoles; «fabriquer» convient à des objets façonnés et reste immédiatement compréhensible.
- source_word: αὐτά
  choice: les
  rationale: Le pronom renvoie aux idoles évoquées dans le contexte; le féminin pluriel français reprend naturellement cet antécédent implicite.
- source_word: οὐ μὴ γένωνται
  choice: ne vivront certainement pas
  rationale: La construction οὐ μή avec le subjonctif exprime une négation fortement emphatique; «certainement pas» en restitue la force sans lourdeur.
- source_word: πολυχρόνιοι
  choice: longtemps
  rationale: L’adjectif signifie «qui vit ou dure longtemps»; avec «vivront», l’adverbe «longtemps» produit une formulation idiomatique fidèle au sens.
