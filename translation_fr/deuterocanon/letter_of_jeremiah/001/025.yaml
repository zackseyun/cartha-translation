  text: Without feet they are carried on shoulders, showing their own disgrace to men; and even those who serve them are put to shame,
translation:
  language: fr
  text: Dépourvus de pieds, ils sont portés sur les épaules, montrant ainsi aux humains leur propre déshonneur ; même ceux qui les servent ont honte,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνευ ποδῶν
  choice: Dépourvus de pieds
  rationale: Rend directement l’absence de pieds tout en gardant un français naturel et digne.
- source_word: ἐπʼ ὤμοις φέρονται
  choice: ils sont portés sur des épaules
  rationale: Conserve le passif grec et le contraste ironique entre des idoles incapables de marcher et leurs porteurs.
- source_word: ἀτιμίαν
  choice: indignité
  rationale: Exprime le déshonneur et l’état méprisable manifestés par leur impuissance, sans surinterpréter par « honte ».
- source_word: τοῖς ἀνθρώποις
  choice: aux humains
  rationale: Rend le terme grec générique de manière inclusive et actuelle.
- source_word: οἱ θεραπεύοντες αὐτά
  choice: ceux qui les servent
  rationale: Dans ce contexte cultuel, « servir » traduit naturellement le fait de s’occuper des idoles et de leur rendre un service religieux, sans préciser davantage que le grec.
- source_word: αἰσχύνονται
  choice: sont couverts de honte
  rationale: Restitue avec force l’idée d’éprouver ou de subir la honte, en accord avec le contexte de déshonneur.
theological_decisions:
- issue: Nature du service rendu aux idoles
  choice: ceux qui les servent
  alternative: ceux qui les adorent
  rationale: Le grec θεραπεύοντες peut désigner le service ou les soins cultuels ; « servent » préserve cette largeur sémantique sans réduire le terme à l’adoration proprement dite.
translation_notes:
  register: 'Français international moderne, clair et soutenu. La structure conserve l’ironie du grec : des objets sans pieds doivent être portés, révélant ainsi leur indignité et entraînant la honte de leurs serviteurs. La virgule finale est maintenue puisque le verset se poursuit syntaxiquement.'
