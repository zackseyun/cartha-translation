  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/034.yaml
  text: Likewise[a], they are certainly not able to give either wealth or bronze; if someone makes a vow to them and does not pay it back[b], they will certainly not seek it.
translation:
  language: fr
  text: De même, ils ne peuvent en aucun cas donner ni richesse ni bronze[a] ; si quelqu’un leur fait un vœu et ne s’en acquitte pas, ils ne le réclameront certainement pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cuivre » ; le terme peut aussi évoquer de la monnaie ou des objets de valeur faits de ce métal.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ils ne le chercheront certainement pas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως
  choice: De même
  rationale: Introduit naturellement un nouvel exemple parallèle dans l’argumentation contre les idoles.
- source_word: πλοῦτον
  choice: richesse
  rationale: Désigne les biens ou la prospérité matérielle au sens large, sans réduire le terme à la seule monnaie.
- source_word: χαλκὸν
  choice: bronze
  rationale: Conserve le nom du métal donné par le grec, tout en signalant en note que « cuivre » est également possible et qu’une valeur monétaire peut être sous-entendue.
- source_word: οὐ μὴ δύνωνται δοῦναι
  choice: ils ne peuvent absolument donner
  rationale: « Absolument » rend la négation grecque fortement emphatique sans alourdir excessivement la phrase.
- source_word: ἐάν τις αὐτοῖς εὐχὴν εὐξάμενος
  choice: si quelqu’un leur fait un vœu
  rationale: Rend idiomatiquement la construction apparentée εὐχὴν εὐξάμενος, qui désigne ici l’acte de faire un vœu.
- source_word: μὴ ἀποδῷ
  choice: ne s’en acquitte pas
  rationale: Dans le contexte d’un vœu, ἀποδίδωμι signifie s’acquitter de ce qui a été promis ou l’accomplir. Cette formulation française est naturelle et garde l’idée d’une obligation due.
- source_word: οὐ μὴ ἐπιζητήσωσιν
  choice: ils ne le réclameront certainement pas
  rationale: Le contexte appelle le sens de demander ou réclamer l’accomplissement du vœu. « Certainement pas » conserve l’emphase de οὐ μή, tandis qu’une note maintient le sens plus littéral « chercher ».
theological_decisions:
- issue: Impuissance des idoles à l’égard des biens matériels et des vœux
  choice: Le verset affirme que les idoles ne peuvent ni accorder des biens matériels ni réclamer l’accomplissement d’un vœu qui leur a été fait.
  alternative: Le bronze peut être compris plus précisément comme du cuivre ou, par métonymie, comme de la monnaie ; le dernier verbe peut être rendu littéralement par « chercher ».
  rationale: La formulation préserve la dénonciation de l’impuissance des idoles sans préciser au-delà du grec la nature exacte du métal ou le mécanisme par lequel un vœu serait recherché ou réclamé.
translation_notes:
  register: Français international moderne, clair et digne. La double construction négative est formulée de manière idiomatique, avec « absolument » et « certainement pas » pour conserver l’emphase grecque. Les termes liés au vœu restent accessibles tout en gardant l’idée d’une obligation non acquittée.
