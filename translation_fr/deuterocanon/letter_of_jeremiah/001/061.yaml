  text: But when the clouds are commanded by God to move over the whole inhabited world[a], they accomplish what was appointed.
translation:
  language: fr
  text: Mais lorsque Dieu ordonne aux nuages de parcourir toute la terre habitée, ils accomplissent ce qui leur a été assigné.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils exécutent ce qui leur a été ordonné ». Le grec τὸ ταχθέν peut mettre l’accent sur ce qui leur a été assigné ou ordonné.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεφέλαις
  choice: aux nuages
  rationale: Le datif pluriel s’insère dans une construction conditionnelle et temporelle. En français, « aux nuages » devient le complément indirect naturel du verbe « ordonne », avec les nuages comme sujet sous-entendu de l’infinitif.
- source_word: ἐπιταγῇ ὑπὸ τοῦ θεοῦ
  choice: Dieu ordonne
  rationale: La tournure active est plus naturelle en français que « il est ordonné aux nuages par Dieu », tout en conservant explicitement Dieu comme auteur de l’ordre.
- source_word: ἐπιπορεύεσθαι
  choice: de parcourir
  rationale: « Parcourir » exprime naturellement le mouvement des nuages sur toute l’étendue indiquée et évite la raideur de « se mettre en marche ».
- source_word: ἐφʼ ὅλην τὴν οἰκουμένην
  choice: toute la terre habitée
  rationale: Cette expression conserve la valeur de οἰκουμένη comme monde habité, sans la réduire simplement au sol ou au territoire.
- source_word: συντελοῦσι
  choice: ils accomplissent
  rationale: Le présent actif exprime l’exécution effective et complète de la tâche prescrite.
- source_word: τὸ ταχθέν
  choice: ce qui leur a été assigné
  rationale: La formulation rend le participe passif substantivé de τάσσω et explicite naturellement en français que la tâche est assignée aux nuages, sans préciser davantage que le grec l’auteur déjà évident dans le contexte.
theological_decisions:
- issue: Portée de τὸ ταχθέν quant à l’autorité divine
  choice: ce qui leur a été assigné
  alternative: ce qui leur a été ordonné
  rationale: « Assigné » conserve l’idée d’une tâche fixée par Dieu sans charger le verset d’une nuance déterministe étrangère au contexte immédiat. « Ordonné » reste possible et souligne davantage le commandement.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe active évite une construction passive lourde, tandis que « terre habitée » préserve la précision du grec.
