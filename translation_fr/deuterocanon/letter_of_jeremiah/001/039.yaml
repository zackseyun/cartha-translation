  text: How then should they be regarded or called gods?[a]
translation:
  language: fr
  text: Comment donc faut-il les considérer ou les appeler des dieux ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Comment donc doit-on les considérer ou les appeler des dieux ? »'
    reason: Alternative idiomatique qui rend également la valeur déontique des adjectifs verbaux grecs.
lexical_decisions:
- source_word: πῶς οὖν
  choice: Comment donc
  rationale: Rend à la fois l’interrogation rhétorique introduite par πῶς et la conclusion logique marquée par οὖν.
- source_word: νομιστέον
  choice: pourrait-on les considérer
  rationale: Le tour avec « pourrait-on » restitue naturellement en français la valeur impersonnelle et déontique de l’adjectif verbal grec, tout en gardant la force contestataire de la question.
- source_word: ἢ
  choice: ou
  rationale: Conserve la disjonction simple entre les deux désignations évaluatives.
- source_word: κλητέον
  choice: les appeler
  rationale: « Appeler » est le terme français direct et courant pour l’attribution d’un nom ou d’un titre.
- source_word: αὐτούς
  choice: les
  rationale: Le pronom objet renvoie aux idoles mentionnées dans le contexte et s’intègre naturellement aux deux infinitifs français.
- source_word: ὑπάρχειν θεούς
  choice: des dieux
  rationale: Dans cette construction, le français exprime idiomatiquement l’attribution contestée sans rendre séparément ὑπάρχειν; « des dieux » conserve la portée du grec sans ajouter « réellement » ou « exister comme ».
theological_decisions:
- issue: Force rhétorique et déontique de νομιστέον et κλητέον
  choice: Formuler une question contestant qu’on puisse légitimement considérer ou appeler ces idoles des dieux
  alternative: Comment donc faut-il les considérer ou les appeler comme des dieux ?
  rationale: La formulation retenue préserve le caractère rhétorique de l’argument contre les idoles et la question de la légitimité de leur titre, sans transformer explicitement celle-ci en affirmation métaphysique plus forte que le grec.
translation_notes:
  register: Français international moderne, clair et digne. « Comment donc » maintient le lien conclusif avec le contexte; « pourrait-on » donne à la question rhétorique une tournure française naturelle. Le marqueur [a] figure bien dans le texte principal.
