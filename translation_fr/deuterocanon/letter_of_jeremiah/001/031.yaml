  text: But they howl, shouting before their gods, like some at a funeral meal for the dead.
translation:
  language: fr
  text: Mais ils hurlent à grands cris devant leurs dieux, comme certains lors d’un repas funéraire pour un mort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lors d’un repas pour le mort » ou « lors d’un banquet funéraire ». Le grec désigne un repas de deuil ou un repas funéraire lié à une personne décédée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠρύονται
  choice: ils hurlent
  rationale: Le verbe évoque un cri puissant, proche du hurlement animal ou de la lamentation, et conserve ici la vigueur moqueuse du grec.
- source_word: βοῶντες
  choice: à grands cris
  rationale: Le participe précise qu’ils poussent bruyamment la voix. La tournure française évite l’enchaînement moins naturel « hurlent en criant » tout en gardant les deux éléments du grec.
- source_word: ἐναντίον
  choice: devant
  rationale: 'Le sens spatial est premier : ils font entendre leurs cris en présence de leurs dieux, face à eux.'
- source_word: τῶν θεῶν αὐτῶν
  choice: leurs dieux
  rationale: Le grec dit explicitement « leurs dieux ». Cette formulation préserve la désignation polémique sans la remplacer interprétativement par « idoles ».
- source_word: ὥσπερ τινὲς
  choice: comme certains
  rationale: Rend directement la comparaison et le pluriel indéfini, dans un français naturel.
- source_word: ἐν περιδείπνῳ νεκροῦ
  choice: lors d’un repas funéraire pour un mort
  rationale: περίδειπνον désigne un repas lié aux funérailles ou au deuil d’une personne décédée. La formulation rend clairement ce cadre tout en maintenant l’association explicite avec le mort.
theological_decisions:
- issue: Rendu de θεῶν dans un contexte de polémique contre l’idolâtrie
  choice: leurs dieux
  alternative: leurs idoles
  rationale: Même si le contexte identifie ces dieux à des idoles, le grec emploie θεῶν. Garder « dieux » respecte la formulation et la force polémique de la source sans explicitation doctrinale dans le texte principal.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. « Ils hurlent à grands cris » conserve l’intensité et la redondance expressive du grec sans produire le calque maladroit « ils hurlent en criant ». Le marqueur [a] est placé après l’expression qu’il précise.
