base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/054.yaml
  text: For just as a crow is between heaven and earth[a], so also when fire falls into a house of wooden or gold-covered or silver-covered gods, their priests will flee and be saved[b], but they themselves will be burned up like beams in the middle.
translation:
  language: fr
  text: Car, de même qu’une corneille est entre le ciel et la terre[a], de même, lorsqu’un feu tombe dans une maison de dieux de bois, ou bien recouverts d’or ou d’argent[b], leurs prêtres s’enfuiront et auront la vie sauve, mais eux-mêmes seront entièrement consumés, comme les poutres qui se trouvent au milieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La comparaison initiale est elliptique et abrupte en grec.
    reason: cultural_note
  - marker: b
    text: 'Ou : « un temple de dieux de bois, ou bien recouverts d’or ou d’argent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ ... καὶ
  choice: de même que… de même
  rationale: Cette tournure française restitue la comparaison, très elliptique en grec, sans en expliciter le sens.
- source_word: κορώνη
  choice: corneille
  rationale: Le terme grec désigne couramment un corvidé; « corneille » conserve l’image concrète et convient au français moderne.
- source_word: ἀνὰ μέσον τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: entre le ciel et la terre
  rationale: Expression française naturelle qui conserve exactement l’image spatiale.
- source_word: ἐμπέσῃ
  choice: s’abat sur
  rationale: Rend l’irruption soudaine du feu de façon idiomatique, là où le littéral « tombe dans » serait peu naturel en français.
- source_word: οἰκίαν θεῶν
  choice: une maison de dieux
  rationale: Conserve le sens premier de οἰκία, « maison », tout en laissant la note signaler le sens contextuel possible de « temple ».
- source_word: ξύλινων ἢ περιχρύσων ἢ περιηργύρων
  choice: en bois, ou recouverts d’or ou d’argent
  rationale: Maintient les trois descriptions alternatives des dieux et rend clairement les revêtements métalliques.
- source_word: φεύξονται καὶ διασωθήσονται
  choice: s’enfuiront et auront la vie sauve
  rationale: Distingue l’action de fuir de son résultat, tout en donnant à διασῴζω une formulation française naturelle.
- source_word: δοκοὶ μέσοι
  choice: les poutres qui se trouvent au milieu
  rationale: Conserve l’image architecturale et l’indication de position sans imposer le sens plus précis de « poutres maîtresses ».
- source_word: κατακαυθήσονται
  choice: seront entièrement consumés
  rationale: Exprime l’intensité du composé grec et l’idée d’une destruction complète par le feu.
theological_decisions:
- issue: Comparaison elliptique au début du verset
  choice: Conserver la comparaison avec seulement le parallélisme « de même que… de même » ajouté pour la lisibilité.
  alternative: Développer l’image en expliquant que les idoles sont impuissantes ou exposées.
  rationale: Le texte grec reste abrupt et n’énonce pas directement la portée de l’image; la traduction préserve donc cette tension, tandis qu’une note en indique prudemment le sens probable.
- issue: Sens de οἰκίαν θεῶν
  choice: Employer « maison de dieux » dans le texte principal.
  alternative: Employer « temple de dieux ».
  rationale: « Maison » traduit formellement οἰκία, alors que « temple » est une précision contextuelle plausible mais plus interprétative; celle-ci est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe équilibre discrètement la comparaison grecque sans en résoudre l’obscurité. Les reprises « ou… ou… » préservent les catégories du texte source, et « eux-mêmes » maintient le contraste appuyé entre les prêtres qui échappent au feu et les idoles qui y sont consumées.
