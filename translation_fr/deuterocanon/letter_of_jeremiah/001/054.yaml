  verdict: revise
  source_fidelity: 'La traduction rend fidèlement l’opposition entre les prêtres qui fuient et les dieux qui sont consumés, ainsi que l’intensif de κατακαυθήσονται. Toutefois, « le feu s’abat sur une maison » affaiblit et déplace εἰς (« dans ») : le grec décrit le feu qui entre/tombe dans la maison. La formulation révisée conserve cette direction sans recourir à un français inutilement littéral.'
  naturalness: Le français est globalement clair et de registre approprié. « Une maison de dieux en bois, ou recouverts d’or ou d’argent » laisse toutefois une coordination un peu heurtée et une portée adjectivale momentanément ambiguë. « Des dieux de bois, ou bien recouverts d’or ou d’argent » rend plus naturellement les trois catégories.
  terminology: « Corneille », « ciel et terre », « maison », « prêtres », « auront la vie sauve » et « entièrement consumés » conviennent. La note sur la comparaison doit signaler son caractère elliptique sans en fixer la portée interprétative, qui n’est pas explicitée par le grec.
  issues:
