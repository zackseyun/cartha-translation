  to: Car, de même qu’une corneille est entre le ciel et la terre[a], de même, lorsqu’un feu tombe dans une maison de dieux de bois, ou bien recouverts d’or ou d’argent[b], leurs prêtres s’enfuiront et auront la vie sauve, mais eux-mêmes seront entièrement consumés, comme les poutres qui se trouvent au milieu.
