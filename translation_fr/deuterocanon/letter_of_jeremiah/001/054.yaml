    issue: Direction de ἐμπέσῃ εἰς
    rationale: « S’abat sur » signifie que le feu tombe sur la maison, alors que ἐμπέσῃ εἰς indique qu’il tombe ou entre dans la maison.
  - severity: low
    issue: Coordination des qualificatifs des dieux
    rationale: La séquence « dieux en bois, ou recouverts d’or ou d’argent » est compréhensible, mais « ou bien » rend plus clairement les alternatives grecques ξύλινων ἢ περιχρύσων ἢ περιηργύρων.
  - severity: medium
    issue: Note a interprétative
    rationale: La note affirme un sens probable de l’image (« idoles… impuissantes ») que la comparaison grecque elliptique ne formule pas. Une note neutre préserve mieux l’ambiguïté textuelle.
