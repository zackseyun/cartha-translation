  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/066.yaml
  text: They will certainly not show signs in the heavens among the nations[a], nor will they shine like the sun, nor give light like the moon.
translation:
  language: fr
  text: Ils ne montreront certainement aucun signe dans le ciel parmi les nations ; ils ne brilleront pas comme le soleil et ne donneront pas de lumière comme la lune.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σημεῖά
  choice: signes
  rationale: « Signes » rend le sens large de σημεῖα sans préciser indûment qu’il s’agit de présages ou de prodiges.
- source_word: ἐν ἔθνεσιν
  choice: parmi les nations
  rationale: Cette expression conserve la portée collective de ἔθνη et évite le terme « païens », qui ajouterait ici une nuance religieuse plus marquée.
- source_word: ἐν οὐρανῷ
  choice: dans le ciel
  rationale: En français, « ciel » peut désigner aussi bien l’espace visible que la sphère céleste ; ce choix garde donc naturellement l’ambiguïté du grec οὐρανός.
- source_word: οὐ μὴ δείξωσιν
  choice: ne montreront certainement aucun
  rationale: La tournure rend la négation grecque emphatique οὐ μή dans un français actuel et soutenu.
- source_word: λάμψουσιν
  choice: brilleront
  rationale: « Briller » est le verbe français naturel dans une comparaison avec le soleil.
- source_word: φωτιοῦσιν
  choice: donneront de lumière
  rationale: Cette formulation distingue l’action d’éclairer de celle de briller exprimée juste avant.
- source_word: σελήνη
  choice: lune
  rationale: Équivalent français direct du nom de l’astre.
theological_decisions:
- issue: Référent du sujet sous-entendu des verbes au pluriel
  choice: Le pronom « ils » renvoie sobrement aux idoles évoquées dans le contexte.
  alternative: Expliciter « ces dieux » ou « les idoles ».
  rationale: Le grec n’énonce pas de sujet dans ce verset, mais le français en exige un. Le simple pronom maintient le lien contextuel sans ajouter une identification plus explicite que le texte.
- issue: Rapport syntaxique entre « parmi les nations » et « dans le ciel »
  choice: Conserver les deux compléments sans expliciter davantage leur relation.
  alternative: Ajouter « aux yeux des nations » ou rattacher explicitement les nations aux signes célestes.
  rationale: La succession grecque des deux groupes prépositionnels est compacte et laisse leur articulation quelque peu ouverte ; une explicitation dépasserait les données du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme entre le soleil et la lune est conservé, ainsi que la distinction entre « briller » et « donner de lumière ». Le point-virgule évite une accumulation lourde tout en maintenant l’unité de la phrase.
