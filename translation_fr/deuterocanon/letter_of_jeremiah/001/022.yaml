  text: Therefore you will know that they are not gods[a]; therefore do not fear them.
translation:
  language: fr
  text: C’est pourquoi vous saurez qu’ils ne sont pas des dieux[a] ; ne les craignez donc pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « ils ne sont pas des dieux ». Les pronoms renvoient aux images-idoles dont il est question et peuvent, par extension, viser les prétendus dieux qu’elles représentent.'
    reason: Préciser la référence des pronoms tout en préservant l’ambiguïté du grec.
lexical_decisions:
- source_word: ὅθεν
  choice: C’est pourquoi
  rationale: Introduit la conclusion tirée de l’impuissance des idoles exposée dans le contexte précédent, tout en restant naturel en français moderne.
- source_word: γινώσεσθε
  choice: vous saurez
  rationale: Rend directement le futur de γινώσκω et exprime la conclusion à laquelle les destinataires parviendront.
- source_word: θεοί
  choice: des dieux
  rationale: Équivalent courant du pluriel grec, qui conserve toute la force de la négation de leur prétendue divinité.
- source_word: μὴ οὖν φοβεῖσθε
  choice: ne les craignez donc pas
  rationale: Le présent impératif précédé de μή formule une interdiction, tandis que « donc » conserve la valeur conclusive de οὖν.
- source_word: αὐτά
  choice: les
  rationale: Le pronom grec neutre pluriel renvoie aux images-idoles. Le pronom objet « les » est idiomatique en français et évite d’ajouter un nom absent du grec.
theological_decisions:
- issue: Référence des pronoms dans la négation de la divinité et l’interdiction de craindre
  choice: Conserver les pronoms, qui renvoient immédiatement aux images-idoles présentées comme des dieux.
  alternative: Comprendre plus largement les pronoms comme visant les divinités païennes représentées par ces images.
  rationale: Le contexte immédiat dénonce des objets cultuels fabriqués et nie qu’ils soient réellement des dieux. Le texte conserve la formulation pronominale du grec sans trancher plus précisément que la source.
translation_notes:
  register: Français international moderne, clair et digne. La répétition logique du grec est rendue par « C’est pourquoi » puis « donc », sans lourdeur excessive. Le masculin pluriel français est imposé par « dieux », bien que les pronoms grecs soient au neutre pluriel.
