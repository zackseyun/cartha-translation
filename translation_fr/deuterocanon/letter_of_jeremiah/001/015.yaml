lexical_decisions:
- source_word: Ὥσπερ
  choice: de même que
  rationale: Introduit clairement la comparaison dans un français naturel.
- source_word: γὰρ
  choice: car
  rationale: Conserve la valeur explicative du connecteur grec en tête de proposition.
- source_word: σκεῦος
  choice: récipient
  rationale: Rend l’objet destiné à un usage sans préciser indûment qu’il s’agit de poterie; « vase » serait plus littéraire et potentiellement ambigu en français moderne.
- source_word: ἀνθρώπου
  choice: appartenant à quelqu’un
  rationale: Exprime naturellement le génitif grec, probablement possessif, tout en évitant de comprendre sans preuve « fabriqué par l’homme » ou « humain ».
- source_word: συντριβὲν
  choice: une fois brisé
  rationale: Reproduit le participe aoriste passif et présente la rupture comme antérieure à l’état qui en résulte.
- source_word: ἄχρειον
  choice: inutilisable
  rationale: Exprime la perte d’utilité pratique de l’objet brisé, dans un français courant.
- source_word: γίνεται
  choice: devient
  rationale: Conserve le changement d’état exprimé par le verbe grec.
