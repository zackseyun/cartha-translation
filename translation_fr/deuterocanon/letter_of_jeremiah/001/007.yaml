base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/007.yaml
  text: For their tongue has been scraped by a craftsman[a], and they are overlaid with gold and silver[b], but they are false and cannot speak.
translation:
  language: fr
  text: Car leur langue a été raclée par un artisan[a] ; eux-mêmes sont recouverts d’or et d’argent, mais ils sont faux[b] et ne peuvent pas parler.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a été sculptée par un artisan » ou « polie par un artisan ». Le verbe grec évoque le travail de raclage ou de lissage effectué sur l’idole.
    reason: lexical_alternative
  - marker: b
    text: Ou « ils sont des mensonges ». Le grec peut qualifier les idoles de choses fausses ou les présenter comme l’expression même du mensonge.
    reason: alternative_reading
lexical_decisions:
- source_word: Γλῶσσα
  choice: langue
  rationale: Le sens concret de l’organe est au premier plan, puisque la fin du verset souligne l’incapacité des idoles à parler.
- source_word: κατεξυσμένη
  choice: a été raclée
  rationale: Le participe parfait évoque le travail concret de raclage ou de lissage accompli par l’artisan. « Raclée » conserve cette image sans ajouter explicitement le résultat « lisse ».
- source_word: ὑπὸ τέκτονος
  choice: par un artisan
  rationale: τέκτων peut désigner divers ouvriers du bois ou de la construction ; « artisan » convient au contexte général de fabrication des idoles sans restreindre le métier à celui de charpentier.
- source_word: περίχρυσα καὶ περιάργυρα
  choice: recouverts d’or et d’argent
  rationale: Cette formulation naturelle rend les deux adjectifs indiquant que les objets sont couverts extérieurement de ces métaux, tout en préservant leur parallélisme.
- source_word: ψευδῆ
  choice: faux
  rationale: Le neutre pluriel qualifie les objets eux-mêmes de faux, tout en laissant ouverte la nuance selon laquelle ils sont des mensonges ou des réalités trompeuses.
- source_word: οὐ δύνανται λαλεῖν
  choice: ne peuvent pas parler
  rationale: Rendu direct et idiomatique de l’incapacité des idoles à produire la parole.
theological_decisions:
- issue: Portée du prédicat ψευδῆ appliqué aux idoles
  choice: ils sont faux
  alternative: ils sont des mensonges
  rationale: « Faux » conserve la dénonciation des idoles sans préciser indûment si le grec les décrit comme des objets non authentiques, des réalités trompeuses ou des incarnations du mensonge. La variante est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec tout en évitant une tournure artificielle ; « eux-mêmes » explicite le changement entre le singulier collectif de « leur langue » et le pluriel désignant les idoles.
