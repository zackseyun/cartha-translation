  text: But now in Babylon you will see gods of silver and gold and wood[a], being carried on shoulders, showing fear to the nations.
translation:
  language: fr
  text: Mais maintenant, à Babylone, vous verrez des dieux d’argent, d’or et de bois, portés sur les épaules et inspirant la crainte aux nations.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « montrant la crainte aux nations ». La tournure grecque peut désigner ce que ces dieux donnent à voir ou la crainte qu’ils provoquent chez ceux qui les regardent.'
    reason: Préserver l’ambiguïté de l’expression grecque δεικνύντας φόβον τοῖς ἔθνεσιν.
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Mais maintenant
  rationale: « Mais » conserve la nuance de transition ou d’opposition portée par δέ, tandis que « maintenant » rend l’immédiateté de νυνί.
- source_word: ὄψεσθε
  choice: vous verrez
  rationale: Le futur de ὁράω a ici son sens prédictif ordinaire.
- source_word: ἐν Βαβυλῶνι
  choice: à Babylone
  rationale: Tour locatif naturel en français pour situer ce que les destinataires verront.
- source_word: θεοὺς
  choice: des dieux
  rationale: Le grec dit « dieux », non « idoles » ; ce choix préserve la désignation que le passage met ensuite en cause.
- source_word: ἀργυροῦς καὶ χρυσοῦς καὶ ξυλίνους
  choice: d’argent, d’or et de bois
  rationale: Rend clairement et naturellement les trois adjectifs de matière sans omettre un élément de l’énumération.
- source_word: ἐπʼ ὤμων αἰρομένους
  choice: portés sur les épaules
  rationale: Le participe décrit ces objets comme transportés par d’autres ; le passif français conserve cette image.
- source_word: δεικνύντας φόβον
  choice: inspirant la crainte
  rationale: Expression française naturelle pour l’effet redoutable produit sur les observateurs, tout en signalant en note la formulation grecque plus littérale et son ambiguïté.
- source_word: τοῖς ἔθνεσιν
  choice: aux nations
  rationale: Conserve le datif et le sens collectif de ἔθνη sans introduire le terme plus interprétatif « païens ».
theological_decisions:
- issue: Traduire θεοὺς par « dieux » ou par « idoles »
  choice: dieux
  alternative: idoles
  rationale: « Dieux » traduit directement le nom grec et laisse au discours lui-même le soin de dénoncer ces objets, sans anticiper son jugement théologique.
- issue: Interprétation de δεικνύντας φόβον
  choice: inspirant la crainte aux nations
  alternative: montrant la crainte aux nations
  rationale: La traduction principale reste idiomatique en français, tandis que la note conserve le sens formel de « montrer » et reconnaît que la tournure peut évoquer soit ce qui est donné à voir, soit l’effet produit sur les nations.
translation_notes:
  register: Français international actuel, clair et digne. La syntaxe demeure proche du grec, mais « inspirant la crainte » évite une formulation littérale obscure ; l’ambiguïté de l’original est explicitement conservée en note.
