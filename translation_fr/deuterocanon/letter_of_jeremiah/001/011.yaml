  text: But these are not preserved from rust and moths[a], though they are clothed in purple garments.
translation:
  language: fr
  text: Mais ils ne sont préservés ni de la rouille ni des mites[a], alors qu’ils sont vêtus d’un habit de pourpre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ni de la corrosion ni de ce qui les ronge ». Le grec traduit par « mites » a un sens plus large : il désigne ce qui mange ou consume. La mention du vêtement favorise ici « mites ».'
    reason: Alternative lexicale préservant l’étendue sémantique de βρωμάτων et formulation française grammaticalement complète.
lexical_decisions:
- source_word: οὗτοι
  choice: eux
  rationale: Le pronom démonstratif renvoie aux idoles déjà évoquées. « Eux » maintient ce renvoi sans ajouter dans le texte le nom interprétatif « idoles ».
- source_word: οὐ διασώζονται
  choice: ne sont préservés
  rationale: Dans ce contexte de détérioration matérielle, le passif exprime l’incapacité de demeurer intacts, sans la connotation principalement spirituelle que pourrait avoir « sauvés ».
- source_word: ἀπὸ ἰοῦ
  choice: de la rouille
  rationale: Ἰός peut désigner le poison ou la corrosion ; associé ici à d’autres agents de détérioration, il désigne naturellement la rouille.
- source_word: βρωμάτων
  choice: des mites
  rationale: Le terme désigne largement ce qui mange ou ronge. La mention immédiate d’un vêtement rend « mites » naturel en français, tout en signalant le sens plus large en note.
- source_word: περιβεβλημένων αὐτῶν
  choice: alors qu’ils sont revêtus
  rationale: Cette tournure rend le génitif absolu et laisse entendre à la fois la circonstance et le contraste ironique, sans imposer trop fortement une valeur exclusivement concessive.
- source_word: ἱματισμὸν πορφυροῦν
  choice: d’un vêtement de pourpre
  rationale: Le singulier grec est conservé naturellement ; « de pourpre » évoque une étoffe ou une teinture prestigieuse et convient au registre du passage.
theological_decisions:
- issue: Portée de διασώζονται dans la critique des idoles
  choice: préservation physique contre la détérioration
  alternative: délivrance au sens plus général, voire salut
  rationale: La rouille, les agents qui rongent et le vêtement situent clairement l’énoncé dans le domaine de la dégradation matérielle. La traduction évite donc d’introduire une notion de salut spirituel.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation garde le contraste ironique entre la parure prestigieuse des idoles et leur incapacité à résister à la détérioration.
