  text: Ils n’arracheront assurément pas un homme à la mort, ni ne soustrairont le plus faible au plus fort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ θανάτου
  choice: à la mort
  rationale: Avec ῥύομαι, la tournure française « arracher à la mort » exprime naturellement la délivrance hors de la menace ou de l’emprise de la mort, sans préciser si la mort est imminente ou déjà survenue.
- source_word: ἄνθρωπον
  choice: un homme
  rationale: Le singulier grec est générique et grammaticalement masculin. « Un homme » conserve la forme représentative et le relief rhétorique de l’original.
- source_word: οὐ μὴ ῥύσωνται
  choice: ils ne pourront certainement pas arracher
  rationale: οὐ μή suivi du futur porte une négation fortement emphatique. « Certainement pas » en rend l’insistance, tandis que « arracher à la mort » est une expression française naturelle pour ῥύομαι dans ce contexte.
- source_word: ἥττονα
  choice: le plus faible
  rationale: Le comparatif substantivé désigne celui qui est plus faible dans le rapport de forces. En français, « le plus faible » forme une opposition concise et idiomatique avec « le plus fort ».
- source_word: ἀπὸ ἰσχυροῦ
  choice: du plus fort
  rationale: La préposition désigne celui à l’emprise duquel il faudrait soustraire la personne faible. « Du plus fort » préserve l’antithèse comparative de la phrase.
- source_word: μὴ ἐξέλωνται
  choice: ni délivrer
  rationale: Le moyen de ἐξαιρέω peut exprimer le fait de retirer quelqu’un d’un danger ou de le délivrer. « Délivrer » restitue clairement ce sens dans le parallélisme.
