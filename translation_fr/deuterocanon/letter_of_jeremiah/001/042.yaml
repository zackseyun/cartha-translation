translation:
  language: fr
  text: Les femmes, après s’être passé des cordons autour d’elles[a], sont assises dans les rues et brûlent du son[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « après s’être entourées de cordes ». Le grec indique que les femmes ont placé autour d’elles des cordons ou des cordes, sans en préciser ici la signification symbolique.'
    reason: lexical_alternative
  - marker: b
    text: Il s’agit de son brûlé pour produire de la fumée, possiblement dans le cadre d’une offrande. Le grec parle de son, et non d’encens ordinaire.
    reason: cultural_note
lexical_decisions:
- source_word: περιθέμεναι
  choice: après avoir passé … autour d’elles
  rationale: Le participe moyen exprime l’action de placer quelque chose autour de soi. Cette formulation française conserve le sens réfléchi et l’antériorité naturelle du participe.
- source_word: σχοινία
  choice: des cordons
  rationale: Le terme désigne des cordes ou cordons. « Cordons » reste concret sans suggérer de grosses cordes ni attribuer une signification rituelle non explicitée.
- source_word: ἐν ταῖς ὁδοῖς
  choice: dans les rues
  rationale: Dans cette scène publique, « rues » est l’équivalent moderne et idiomatique de ὁδοί.
- source_word: ἐγκάθηνται
  choice: restent assises
  rationale: Le verbe décrit une position assise maintenue. « Restent assises » rend cette nuance plus précisément que le simple « s’assoient ».
- source_word: θυμιῶσα
  choice: font brûler
  rationale: Le verbe évoque l’action de produire une fumée, notamment dans un contexte d’offrande. « Font brûler » décrit l’acte sans transformer le son en encens ordinaire. La formulation française évite aussi de trancher artificiellement l’irrégularité d’accord du participe grec singulier avec le sujet pluriel.
- source_word: τὰ πίτυρα
  choice: du son
  rationale: πίτυρα désigne couramment le son, enveloppe issue de la mouture des céréales, et non la balle ou un encens classique.
theological_decisions:
- issue: Nature et signification du geste des femmes
  choice: Décrire simplement les femmes entourées de cordons, assises en public et faisant brûler du son.
  alternative: Identifier les cordons et la combustion du son comme les éléments d’un rite cultuel ou de fertilité précis.
  rationale: Le grec rapporte les gestes visibles sans en expliquer ici la portée symbolique. La traduction n’importe donc aucune interprétation cultuelle particulière.
translation_notes:
  register: Français international moderne, clair et digne. La construction suit le mouvement descriptif du grec tout en restant naturelle. « Du son » conserve le référent agricole précis, tandis que les notes signalent les ambiguïtés lexicales et culturelles sans les résoudre abusivement.
