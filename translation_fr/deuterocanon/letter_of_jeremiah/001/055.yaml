  text: But they will certainly not withstand a king or enemies.
translation:
  language: fr
  text: Mais ils ne résisteront absolument pas à un roi ni à des ennemis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βασιλεῖ
  choice: à un roi
  rationale: Le singulier grec sans article désigne naturellement un roi quelconque; le singulier est conservé.
- source_word: πολεμίοις
  choice: à des ennemis
  rationale: Le pluriel désigne des adversaires hostiles; «ennemis» est le terme français naturel dans ce contexte.
- source_word: ἀντιστῶσιν
  choice: résister
  rationale: Le verbe signifie se dresser contre, opposer une résistance ou tenir tête; «résister à» rend clairement le datif grec.
- source_word: οὐ μὴ
  choice: ne pourront absolument pas
  rationale: La double négation grecque exprime une négation fortement emphatique. Cette formulation française en restitue la certitude sans lourdeur.
theological_decisions:
- issue: Force de la négation emphatique οὐ μή
  choice: ne pourront absolument pas
  alternative: ne résisteront certainement pas
  rationale: La formulation choisie exprime à la fois l'incapacité pratique de ces idoles et la vigueur de la négation grecque, sans ajouter de précision doctrinale.
translation_notes:
  register: Français moderne, clair et digne. La coordination «à un roi ni à des ennemis» conserve l'opposition entre le singulier βασιλεῖ et le pluriel πολεμίοις.
