lexical_decisions:
- source_word: Τίνι
  choice: Qui
  rationale: Le datif interrogatif désigne la personne pour qui la chose est connue. Dans cette tournure impersonnelle, le français naturel transpose « à qui est-il connu » par « qui sait ».
- source_word: οὖν
  choice: donc
  rationale: « Donc » conserve la valeur de liaison et d’inférence du grec sans la renforcer excessivement.
- source_word: γνωστὸν ἐστὶν
  choice: sait
  rationale: La tournure impersonnelle signifie littéralement « est connu ». Avec Τίνι, « qui sait » en exprime naturellement le sens en français moderne.
- source_word: ὅτι
  choice: que
  rationale: Introduit la proposition qui énonce le contenu de ce qui est su.
- source_word: οὐκ εἰσὶν
  choice: ils ne sont pas
  rationale: Rend directement la copule niée, sans amplifier l’affirmation.
- source_word: θεοί
  choice: des dieux
  rationale: Le pluriel de θεός désigne ici les dieux dans le contexte de la polémique contre les idoles.
theological_decisions:
- issue: Formulation de la polémique contre les idoles
  choice: ils ne sont pas des dieux
  alternative: ce ne sont pas des dieux
  rationale: La formulation retenue conserve directement le sujet pluriel implicite et la négation grecque, sans préciser davantage la nature ou l’existence des idoles.
