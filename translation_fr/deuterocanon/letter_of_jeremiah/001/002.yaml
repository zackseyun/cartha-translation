  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/002.yaml
  text: So when you enter Babylon[a], you will be there for many years and a long time, until seven generations; but after this I will bring you out from there in peace.
translation:
  language: fr
  text: Ainsi, lorsque vous serez entrés à Babylone, vous y serez pendant de nombreuses années et longtemps encore, jusqu’à sept générations[a] ; mais après cela, je vous en ferai sortir en paix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « durant sept générations ». Le grec dit littéralement « jusqu’à sept générations » ; cette expression peut désigner la durée de l’exil de manière arrondie ou stylisée.
    reason: alternative lexicale et préservation d’une ambiguïté temporelle du grec
lexical_decisions:
- source_word: εἰσελθόντες οὖν εἰς Βαβυλῶνα
  choice: Ainsi, lorsque vous serez entrés à Babylone
  rationale: Le participe aoriste, associé au futur du verbe principal, reçoit naturellement une valeur temporelle d’antériorité en français. « Ainsi » conserve la fonction de liaison de οὖν, et « à Babylone » est la tournure idiomatique avec « entrer ».
- source_word: ἔσεσθε ἐκεῖ
  choice: vous y resterez
  rationale: Le grec dit littéralement « vous y serez ». Dans un contexte où une longue durée est immédiatement précisée, « vous y resterez » exprime naturellement cette permanence sans ajouter l’idée d’un retour.
- source_word: ἔτη πλείω καὶ χρόνον μακρόν
  choice: de nombreuses années et longtemps
  rationale: πλείω est compris ici au sens de « nombreuses », faute de terme comparatif explicite. Les deux expressions temporelles sont maintenues afin de préserver l’insistance du grec, malgré leur proximité de sens.
- source_word: ἕως γενεῶν ἑπτά
  choice: jusqu’à sept générations
  rationale: Cette traduction conserve le sens ordinaire de ἕως (« jusqu’à »), le pluriel γενεῶν et le nombre sept, sans transformer la formule en « jusqu’à la septième génération ».
- source_word: μετὰ τοῦτο δὲ
  choice: mais après cela
  rationale: « Mais » rend la transition légèrement contrastive de δέ entre la longue période d’exil et la promesse qui suit.
- source_word: ἐξάξω ὑμᾶς ἐκεῖθεν
  choice: je vous en ferai sortir
  rationale: La construction française avec « en » rend à la fois le mouvement de sortie exprimé par ἐξάξω et la provenance indiquée par ἐκεῖθεν, sans alourdir la phrase par « sortir de là ».
- source_word: μετʼ εἰρήνης
  choice: en paix
  rationale: Expression française idiomatique qui préserve la manière ou la condition paisible de la sortie sans préciser davantage la nature de cette paix.
theological_decisions:
- issue: Portée de la promesse finale
  choice: je vous en ferai sortir en paix
  alternative: je vous délivrerai de là et vous ramènerai en paix
  rationale: Le grec promet que Dieu les fera sortir de cet endroit, mais ne contient explicitement ni le verbe « délivrer » ni l’idée de les « ramener ». La formulation choisie évite donc de renforcer ou de préciser théologiquement la promesse au-delà du texte.
- issue: Interprétation de la durée « sept générations »
  choice: jusqu’à sept générations
  alternative: durant sept générations
  rationale: La traduction principale conserve la préposition ἕως et l’ambiguïté de la formule grecque. La note signale l’interprétation durative possible sans l’imposer dans le texte.
translation_notes:
  register: Français international moderne, clair et digne. La redondance temporelle du grec est volontairement conservée sous une forme idiomatique. Le futur antérieur « serez entrés » marque naturellement l’antériorité de l’entrée à Babylone par rapport au séjour prolongé.
