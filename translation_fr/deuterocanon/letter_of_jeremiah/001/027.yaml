    issue: Restriction de ἀδυνάτῳ
    rationale: « Celui qui est sans ressources » réduit le terme à l’absence de moyens matériels. « La personne démunie » conserve une portée plus large, compatible avec l’incapacité, la faiblesse ou le dénuement.
  - severity: low
    issue: Explicitation de « pour eux-mêmes »
    rationale: Le contexte suggère l’appropriation, mais καταχρῶνται signifie d’abord « font usage de ». Omettre « pour eux-mêmes » reproduit plus exactement l’expression grecque sans perdre la critique contextuelle.
  - severity: low
    issue: Accord référentiel dans la note a
    rationale: La formule « pour son propre usage » ne correspond pas au sujet pluriel « les prêtres »; « pour leur propre usage » corrige cette incohérence.
