  text: And their priests[a], taking back their sacrifices, make use of them; likewise their women, preserving some from them[b], give none to the poor or the helpless.
translation:
  language: fr
  text: Leurs prêtres[a], après avoir repris leurs sacrifices, s’en servent ; de même, leurs femmes en conservent une partie[b], sans rien donner au pauvre ni à la personne démunie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « après avoir reçu en retour leurs sacrifices ». Le participe grec peut désigner le fait de reprendre ou de recevoir les offrandes pour leur propre usage.'
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec désigne la conservation d’aliments, probablement par salage, séchage ou une autre forme de traitement.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποδιδόμενοι
  choice: après avoir repris
  rationale: Le participe moyen peut exprimer le fait de reprendre ou de recevoir en retour les offrandes. « Repris » conserve l’idée de récupération sans préciser indûment le mécanisme.
- source_word: καταχρῶνται
  choice: s’en servent pour eux-mêmes
  rationale: Le verbe indique qu’ils font usage des sacrifices, avec ici une appropriation suggérée par le contexte. Cette formulation rend la portée critique sans employer le terme plus chargé « détournent ».
- source_word: ταριχεύουσαι
  choice: en conservent une partie
  rationale: Le participe désigne la conservation d’aliments, probablement par salage ou séchage. « Conservent » reste exact sans imposer une technique précise; « une partie » explicite naturellement le complément ἀπ’ αὐτῶν.
- source_word: μεταδῶσιν
  choice: donner
  rationale: Le verbe signifie faire part ou donner une part de ce que l’on possède. « Donner » est naturel ici.
- source_word: πτωχῷ
  choice: au pauvre
  rationale: Le singulier grec a une valeur représentative; le singulier français préserve la forme et demeure idiomatique.
- source_word: ἀδυνάτῳ
  choice: à celui qui est sans ressources
  rationale: Dans ce contexte d’absence de partage alimentaire, le terme désigne celui qui n’a pas les moyens ou la capacité de pourvoir à ses besoins. La formulation garde une certaine largeur sémantique sans le réduire au seul sens physique de « faible ».
theological_decisions:
- issue: Portée morale de l’appropriation des sacrifices
  choice: Décrire les actes en laissant le contexte porter la condamnation
  alternative: Traduire καταχρῶνται par « détournent » ou « abusent de »
  rationale: Le grec peut avoir une nuance défavorable, mais ne requiert pas à lui seul une formulation explicitement accusatrice. « S’en servent pour eux-mêmes » rend l’appropriation et préserve la tension du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été divisée en deux phrases pour la clarté. Les reprises pronominales gardent le lien avec les sacrifices, tandis que les notes préservent les principales nuances lexicales.
