review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : les prêtres se réapproprient les sacrifices et les femmes ne partagent pas avec les personnes démunies. Toutefois, « pour eux-mêmes » ajoute une explicitation qui n’est pas formulée par καταχρῶνται, et la note a emploie improprement le singulier (« pour son propre usage ») alors que le sujet est pluriel. « Celui qui est sans ressources » restreint ἀδυνάτῳ à l’indigence matérielle; le grec vise plus largement une personne sans force, sans capacité ou démunie.'
  naturalness: Le français est fluide et de registre approprié. Une seule phrase, comme dans le grec, reste tout à fait naturelle. « En conserver une partie » est idiomatique dans le contexte alimentaire.
  terminology: « Prêtres », « sacrifices », « pauvre » et « conservent » conviennent. Pour ἀδυνάτῳ, « la personne démunie » est plus large et plus naturel que « celui qui est sans ressources », sans imposer un sens exclusivement financier.
  issues:
