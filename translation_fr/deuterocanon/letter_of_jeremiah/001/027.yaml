  rationale: La révision resserre la traduction sur le grec, évite d’ajouter une précision implicite au verbe « s’en servent », et rend ἀδυνάτῳ par un terme français qui préserve son ampleur sémantique. Les ancres de notes demeurent correctement placées et les notes restent pertinentes.
