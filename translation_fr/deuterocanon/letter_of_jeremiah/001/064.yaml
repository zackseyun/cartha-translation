lexical_decisions:
- source_word: γνόντες
  choice: sachant
  rationale: Le participe aoriste de γινώσκω a ici une valeur circonstancielle, probablement causale. « Sachant » reste naturel en français et rattache l’exhortation au constat qui la fonde.
- source_word: οὖν
  choice: ainsi donc
  rationale: La particule marque la conclusion tirée de l’argument précédent. « Ainsi donc » en conserve clairement la force déductive dans un registre digne et actuel.
- source_word: οὐκ εἰσὶν θεοί
  choice: ils ne sont pas des dieux
  rationale: Traduction directe de la proposition négative. L’article partitif après la négation est idiomatique en français, tandis que « dieux » correspond exactement à θεοί et maintient la polémique contre les idoles.
- source_word: μὴ φοβῆσθε
  choice: ne les craignez pas
  rationale: L’impératif présent négatif exprime une interdiction directe. « Ne les craignez pas » est concis et reproduit naturellement en français la construction avec complément d’objet.
- source_word: αὐτούς
  choice: les
  rationale: Le pronom renvoie aux idoles évoquées auparavant. Le pronom français préserve ce renvoi sans introduire dans le texte principal un nom explicatif absent du grec.
theological_decisions:
- issue: Rendu de θεοί dans un contexte de polémique contre l’idolâtrie
  choice: des dieux
  alternative: des êtres divins
  rationale: Le texte nie que les idoles soient réellement des dieux. « Des dieux » conserve la correspondance lexicale et la force rhétorique du grec, sans ajouter l’interprétation plus abstraite qu’impliquerait « êtres divins ».
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe participiale du grec est conservée sans lourdeur excessive. Aucun terme explicatif comme « idoles » n’est ajouté, puisque le pronom grec suffit dans le contexte.
