translation:
  language: fr
  text: Car mon ange est avec vous, et lui-même veille sur vos vies.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « recherche » ou « cherche avec soin » vos vies.'
    reason: Précision sur le sens littéral de ἐκζητῶν, rendu dans le texte selon sa valeur protectrice probable.
  - marker: b
    text: 'Ou : « vos âmes » ou « vos personnes ». Le grec ψυχαί peut désigner les âmes, les vies ou les personnes.'
    reason: Conservation des possibilités lexicales de ψυχή sans imposer une anthropologie particulière.
lexical_decisions:
- source_word: ἄγγελός
  choice: ange
  rationale: Le terme grec peut désigner un messager humain ou un ange. Ici, la parole divine (« mon ange ») et le contexte de protection favorisent « ange », sans préciser davantage sa nature ou son rôle.
- source_word: μεθʼ ὑμῶν
  choice: avec vous
  rationale: Avec le génitif, μετά exprime normalement l’accompagnement ou la présence. « Avec vous » est direct et naturel.
- source_word: αὐτὸς
  choice: lui-même
  rationale: Le pronom est emphatique et souligne que l’ange exerce personnellement l’action décrite.
- source_word: ἐκζητῶν
  choice: veille sur
  rationale: Le verbe signifie littéralement « rechercher, chercher avec soin ». Avec « vos vies » comme complément et dans ce contexte, « veille sur » exprime naturellement en français la sollicitude protectrice suggérée, tandis qu’une note conserve la formulation plus littérale.
- source_word: τὰς ψυχὰς ὑμῶν
  choice: vos vies
  rationale: ψυχή peut désigner l’âme, la vie ou la personne. « Vos vies » convient au contexte de préservation concrète et évite d’imposer une lecture dualiste; « vos âmes » est maintenu en note comme possibilité réelle.
theological_decisions:
- issue: Sens de ψυχή dans un contexte de protection
  choice: vos vies
  alternative: vos âmes; vos personnes
  rationale: Le contexte évoque la présence protectrice de l’ange auprès des destinataires. « Vies » rend le souci de leur préservation sans exclure la portée plus large de ψυχή, dont les autres sens sont signalés en note.
- issue: Portée de ἐκζητῶν
  choice: veille sur
  alternative: recherche; cherche avec soin
  rationale: La traduction principale rend la valeur contextuelle probablement protectrice, mais la note préserve l’image verbale grecque afin de ne pas masquer son ambiguïté.
translation_notes:
  register: Français international moderne, simple et digne. La tournure « lui-même » conserve l’emphase grecque. « Veille sur » est plus idiomatique que « recherche vos vies » en français, et les notes maintiennent la littéralité ainsi que l’ambiguïté lexicale.
