  text: Upon their bodies and upon their heads bats[a], swallows, and the birds alight, and likewise also the cats.
translation:
  language: fr
  text: Des chauves-souris, des hirondelles et les oiseaux se posent sur leur corps et sur leur tête, et les chats aussi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ τὸ σῶμα αὐτῶν καὶ ἐπὶ τὴν κεφαλήν
  choice: sur leur corps et sur leur tête
  rationale: 'Le grec emploie des singuliers distributifs avec αὐτῶν. Le français naturel peut les conserver : chaque idole est envisagée avec son corps et sa tête.'
- source_word: ἐφίπτανται
  choice: viennent se poser
  rationale: Le verbe exprime le mouvement de voler jusqu’à une surface et de s’y poser. Cette tournure convient aux oiseaux et aux chauves-souris tout en restant compréhensible avec les chats dans l’énumération.
- source_word: νυκτερίδες
  choice: des chauves-souris
  rationale: Équivalent zoologique courant et précis.
- source_word: χελιδόνες
  choice: des hirondelles
  rationale: Sens usuel et précis du terme grec.
- source_word: τὰ ὄρνεα
  choice: d’autres oiseaux
  rationale: Après les hirondelles déjà identifiées comme oiseaux, « d’autres » rend explicite en français la portée naturellement générale de la catégorie sans alourdir l’énumération.
- source_word: ὡσαύτως δὲ καὶ οἱ αἴλουροι
  choice: ainsi que des chats
  rationale: Rend l’ajout du dernier groupe avec fluidité. αἴλουροι désigne normalement des chats.
theological_decisions:
- issue: Portée de la satire contre les idoles
  choice: Conserver littéralement l’image d’animaux qui se posent librement sur les idoles.
  alternative: Interpréter les animaux comme des symboles religieux ou développer explicitement l’impuissance des idoles.
  rationale: Le texte présente une scène concrète qui tourne les idoles en dérision. La traduction ne doit ni symboliser les animaux ni ajouter une explication théologique absente du verset.
translation_notes:
  register: Français moderne, digne et direct. La répétition « sur leur corps et sur leur tête » préserve l’insistance spatiale du grec. Aucun marqueur de note n’est requis, car « viennent se poser » exprime clairement ἐφίπτανται sans variante française importante à signaler.
