translation:
  language: fr
  text: Et, comme pour une jeune fille qui aime les parures[a], ils prennent de l’or et fabriquent des couronnes pour les têtes de leurs dieux ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « une vierge » ; le terme peut aussi désigner une jeune fille.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ
  choice: comme pour
  rationale: Introduit une comparaison. « Comme pour » conserve la valeur comparative tout en reliant naturellement en français la figure de la jeune fille à l’action décrite.
- source_word: παρθένῳ
  choice: une jeune fille
  rationale: Le datif désigne littéralement une vierge ou une jeune fille. « Jeune fille » garde cette précision sans mettre au premier plan le statut sexuel.
- source_word: φιλοκόσμῳ
  choice: qui aime les parures
  rationale: L’adjectif composé décrit quelqu’un qui affectionne l’ornement et la parure ; cette formulation est claire et naturelle en français moderne.
- source_word: λαμβάνοντες
  choice: ils prennent
  rationale: Le participe grec est rendu par un verbe coordonné afin d’éviter une construction participiale lourde en français tout en conservant la succession des gestes.
- source_word: χρυσίον
  choice: de l’or
  rationale: Le nom désigne l’or sans préciser qu’il s’agit d’objets ou de bijoux.
- source_word: κατασκευάζουσιν
  choice: fabriquent
  rationale: Le verbe signifie préparer, façonner ou fabriquer ; « fabriquent » convient directement à la confection de couronnes.
- source_word: στεφάνους
  choice: des couronnes
  rationale: Le terme peut désigner des couronnes ou des guirlandes. Puisqu’elles sont en or et destinées à la tête des représentations divines, « couronnes » convient le mieux.
- source_word: ἐπὶ τὰς κεφαλάς
  choice: pour la tête
  rationale: Avec le verbe de fabrication, la préposition indique ici la destination. Le singulier collectif est idiomatique en français et n’altère pas la pluralité des dieux.
- source_word: τῶν θεῶν αὐτῶν
  choice: de leurs dieux
  rationale: La construction au génitif signifie directement « de leurs dieux ». Le contexte vise des idoles, mais le texte grec emploie le mot « dieux ».
theological_decisions:
- issue: Faut-il traduire θεῶν par « dieux » ou l’interpréter comme « idoles » ?
  choice: leurs dieux
  alternative: leurs idoles
  rationale: Bien que le contexte polémique porte sur des idoles, le grec dit simplement « leurs dieux ». La traduction maintient cette formulation et évite d’introduire l’interprétation dans le corps du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe grecque est légèrement dépliée par deux verbes coordonnés. « Parures » restitue le goût de l’ornement sans registre archaïque, tandis que « jeune fille » reste plus proche de παρθένος que le terme générique « femme ».
