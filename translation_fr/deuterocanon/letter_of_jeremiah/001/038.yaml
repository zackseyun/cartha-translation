  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/038.yaml
  text: The wooden things and the gold-covered and silver-covered things are like stones from the mountain[a], and those who serve them will be put to shame.
translation:
  language: fr
  text: Les objets en bois, ceux qui sont recouverts d’or et ceux qui sont recouverts d’argent, sont semblables aux pierres provenant de la montagne, et ceux qui les servent[a] seront couverts de honte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ceux qui leur rendent un culte ». Le verbe grec peut désigner le service ou le culte religieux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς ἀπὸ τοῦ ὄρους λίθοις
  choice: aux pierres provenant de la montagne
  rationale: La formule conserve l’idée de pierres ordinaires tirées ou issues de la montagne sans préciser qu’elles ont été extraites, nuance que le grec n’explicite pas.
- source_word: ὡμοιωμένοι εἰσὶν
  choice: sont semblables
  rationale: Cette tournure française naturelle exprime l’état de ressemblance porté par le participe parfait passif avec εἰμί.
- source_word: τὰ ξύλινα
  choice: les objets en bois
  rationale: L’adjectif substantivé désigne littéralement des choses en bois. « Objets » reste clair sans introduire explicitement « idoles », terme seulement implicite dans cette proposition.
- source_word: τὰ περίχρυσα
  choice: ceux qui sont recouverts d’or
  rationale: Le grec désigne des objets revêtus d’or. Cette formulation moderne évite l’ambiguïté possible de « dorés » tout en conservant l’image du placage.
- source_word: τὰ περιάργυρα
  choice: ceux qui sont recouverts d’argent
  rationale: Le choix reproduit le parallélisme avec les objets recouverts d’or et indique qu’il s’agit d’un revêtement.
- source_word: οἱ δὲ θεραπεύοντες αὐτά
  choice: ceux qui les servent
  rationale: θεραπεύω peut signifier servir, prendre soin de ou, dans un contexte religieux, rendre un culte. « Servent » préserve cette amplitude lexicale et convient au service des idoles.
- source_word: κατασχυνθήσονται
  choice: seront couverts de honte
  rationale: Cette expression idiomatique garde la valeur future et la force passive du grec, plutôt que de réduire le sens à un simple sentiment intérieur de honte.
theological_decisions:
- issue: Sens de θεραπεύοντες dans un contexte d’idolâtrie
  choice: ceux qui les servent
  alternative: ceux qui leur rendent un culte
  rationale: Le contexte permet nettement le sens cultuel, mais « servent » conserve la portée plus large du verbe grec et l’expression biblique du service rendu aux idoles, sans imposer une interprétation plus étroite.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme des trois catégories d’objets est conservé, ainsi que le contraste entre leur apparence précieuse et leur ressemblance à de simples pierres.
