  text: In the same way[a], their wooden gods overlaid with gold and silver are made like a scarecrow in a garden, on which every bird sits, and also like a dead body thrown out in the dark.
translation:
  language: fr
  text: De la même manière, leurs dieux de bois recouverts d’or et d’argent ressemblent à un épouvantail[a] dans un jardin, sur lequel viennent se poser tous les oiseaux, ainsi qu’à un cadavre jeté dans l’obscurité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un poteau » ou « une figure de garde dans un jardin ». Le terme grec est rare; il désigne ici un objet dressé dans un jardin, sur lequel les oiseaux se posent librement.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν αὐτὸν τρόπον
  choice: De la même manière
  rationale: Cette tournure française naturelle conserve la force comparative de l’expression grecque.
- source_word: βάμψῳ
  choice: un épouvantail
  rationale: Dans ce contexte, l’objet dressé dans un jardin et sur lequel les oiseaux se posent évoque un épouvantail. Le terme grec étant rare, une note conserve les autres possibilités lexicales.
- source_word: ἐν κήπῳ
  choice: dans un jardin
  rationale: κήπος désigne couramment un jardin; le contexte ne justifie pas de préciser « verger ».
- source_word: ἐφ’ ἧς πᾶν τὸ ὄρνεον ἐπικάθηται
  choice: sur lequel viennent se poser tous les oiseaux
  rationale: Cette formulation idiomatique restitue l’image d’oiseaux qui se perchent librement sur l’objet inerte.
- source_word: τῷ νεκρῷ ἐρριμμένῳ ἐν σκότει
  choice: à un cadavre jeté dans l’obscurité
  rationale: νεκρός désigne ici concrètement un cadavre, tandis que ἐρριμμένῳ exprime le fait qu’il a été jeté ou abandonné. « Dans l’obscurité » évite une interprétation métaphysique indue.
- source_word: ἀφωμοίωνται
  choice: ressemblent à
  rationale: Le verbe exprime l’assimilation ou la comparaison. « Ressemblent à » est clair et naturel en français, sans suggérer que les idoles ont matériellement été transformées.
- source_word: οἱ θεοὶ αὐτῶν ξύλινοι καὶ περίχρυσοι καὶ περιάργυροι
  choice: leurs dieux de bois recouverts d’or et d’argent
  rationale: ξύλινοι indique que les idoles sont en bois; περίχρυσοι et περιάργυροι indiquent qu’elles sont couvertes ou plaquées d’or et d’argent.
theological_decisions:
- issue: Nature de la comparaison dans la polémique contre les idoles
  choice: 'Le verset compare les idoles à des réalités inertes et impuissantes: un objet dressé dans un jardin et un cadavre abandonné.'
  alternative: L’image du jardin peut être rendue plus littéralement par « poteau » ou « figure de garde » plutôt que par « épouvantail ».
  rationale: La traduction préserve la portée polémique du grec contre l’impuissance des idoles, sans ajouter d’explication doctrinale à l’image.
translation_notes:
  register: Français international moderne, naturel et digne. « Épouvantail » rend immédiatement l’image, tandis que la note signale l’incertitude liée au terme grec rare. La syntaxe française place le sujet avant les comparaisons pour assurer la clarté sans modifier le sens.
