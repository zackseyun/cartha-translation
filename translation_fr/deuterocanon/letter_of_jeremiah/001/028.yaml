  text: They touch their sacrifices while sitting apart and lying with women. Therefore[a], knowing from these things that they are not gods, do not fear them.
translation:
  language: fr
  text: 'Une femme mise à l’écart et une femme en couches touchent leurs sacrifices. Comprenez donc, à partir de cela, qu’ils ne sont pas des dieux : ne les craignez pas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκαθημένη
  choice: une femme ayant ses règles
  rationale: Le participe féminin désigne vraisemblablement une femme mise à l’écart en raison de ses menstruations. Cette formulation naturelle en français rend explicitement le sens rituel suggéré par le terme et le contexte.
- source_word: λεχὼς
  choice: une femme en couches
  rationale: Le nom désigne normalement une accouchée, une femme alitée à la suite d’un accouchement. « Femme en couches » est l’équivalent français le plus précis et le plus courant dans ce registre.
- source_word: ἅπτονται
  choice: touchent à
  rationale: Le verbe signifie ici entrer en contact avec ou manipuler. « Touchent à » conserve le sens concret et convient à l’idée d’un contact tenu pour impur.
- source_word: θυσιῶν
  choice: sacrifices
  rationale: Le terme désigne les offrandes sacrificielles présentées aux idoles.
- source_word: γνόντες
  choice: sachant
  rationale: Le participe introduit la conclusion que les destinataires doivent tirer des faits évoqués.
- source_word: θεοί
  choice: dieux
  rationale: C’est le sens direct du terme dans l’argument contre les idoles.
- source_word: μὴ φοβηθῆτε
  choice: ne les craignez pas
  rationale: L’impératif interdit de redouter les idoles; cette traduction conserve directement la force du grec.
theological_decisions:
- issue: Contact des sacrifices avec des femmes considérées comme rituellement impures
  choice: Le texte évoque une femme menstruée et une femme en couches touchant les sacrifices des idoles.
  alternative: Le grec condensé pourrait être rendu plus littéralement par une femme mise à l’écart et une femme alitée, sans préciser la nature de leur état.
  rationale: Les deux termes renvoient très probablement à des états associés à l’impureté rituelle dans l’Antiquité. La traduction les nomme sans ajouter de jugement général sur les femmes; l’argument du passage porte sur l’incapacité des idoles à empêcher ce contact.
translation_notes:
  register: Français moderne, clair et digne. « Femme en couches » conserve une expression courante de registre soutenu. La tournure « Sachant donc par là » maintient le lien logique du grec sans alourdir la phrase.
