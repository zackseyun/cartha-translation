  source_fidelity: Le projet identifie plausiblement les deux états féminins, mais « ayant ses règles » explicite ἀποκαθημένη au-delà de ce que le grec condensé affirme de façon certaine. Le terme peut évoquer une femme mise à l’écart, probablement dans un contexte d’impureté rituelle. « En couches » pour λεχὼς est solide, tout en laissant le contexte antique s’exprimer sans interprétation excessive.
  naturalness: Le français est globalement clair. « Touchent leurs sacrifices » est plus direct et moins ambigu que « touchent à leurs sacrifices », qui peut aussi suggérer l’idée de modifier ou de s’en prendre à quelque chose. « Comprenez donc, à partir de cela » rend naturellement l’inférence exhortative du participe γνόντες.
  terminology: « Sacrifices », « dieux » et « ne les craignez pas » sont exacts et conviennent au registre. La formulation révisée évite de transformer une implication contextuelle probable en une désignation explicite dans le texte courant.
