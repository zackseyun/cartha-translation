  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/005.yaml
  text: When you see a crowd in front of them and behind them bowing down to them[a], say in your mind, ‘It is you whom one must worship, Master.’
translation:
  language: fr
  text: 'Quand vous verrez, devant et derrière eux, une foule qui se prosterne devant eux[a], dites en vous-mêmes : « C’est devant toi qu’il faut se prosterner, Maître. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les adorer ». Le verbe grec peut désigner le geste de se prosterner aussi bien que l’acte religieux d’adorer.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντας
  choice: Quand vous verrez
  rationale: Le participe a ici une valeur circonstancielle temporelle et reprend les destinataires implicites de l’impératif pluriel εἴπατε. Le futur français convient naturellement après « quand ».
- source_word: ὄχλον
  choice: une foule
  rationale: Équivalent courant et précis de ὄχλος dans ce contexte.
- source_word: ἔμπροσθεν καὶ ὄπισθεν αὐτῶν
  choice: devant et derrière eux
  rationale: Conserve sans ajout l’image spatiale du grec et l’antécédent masculin pluriel désignant les objets idolâtriques.
- source_word: προσκυνοῦντας αὐτά
  choice: se prosterner devant eux
  rationale: προσκυνέω peut désigner aussi bien le geste de prosternation que l’adoration. Cette formulation garde visible le geste tout en laissant entendre sa portée cultuelle.
- source_word: εἴπατε δὲ τῇ διανοίᾳ
  choice: dites en vous-mêmes
  rationale: Expression française naturelle pour une parole intérieure. Le pluriel reflète l’impératif εἴπατε et évite l’expression moins idiomatique « dans votre intelligence ».
- source_word: Σοί
  choice: C’est devant toi que
  rationale: La construction clivée restitue la mise en relief du pronom datif placé en tête. « Devant toi » s’accorde naturellement avec « se prosterner ».
- source_word: δεῖ
  choice: il faut
  rationale: Rend la nécessité impersonnelle sans introduire un sujet absent du grec.
- source_word: προσκυνεῖν
  choice: se prosterner
  rationale: Préserve la répétition du même verbe grec et la tension entre geste corporel et acte cultuel, plutôt que de répartir arbitrairement les sens entre deux traductions différentes.
- source_word: Δέσποτα
  choice: Maître
  rationale: Équivalent direct de Δέσποτα qui maintient sa distinction lexicale avec κύριε, tout en convenant à une adresse révérencieuse.
theological_decisions:
- issue: Sens cultuel de προσκυνέω
  choice: Rendre les deux occurrences par « se prosterner », avec une note signalant le sens possible « adorer »
  alternative: Traduire la première par « se prosterner » et la seconde par « adorer »
  rationale: La répétition lexicale structure le contraste entre les idoles et Dieu. La conserver évite de résoudre silencieusement l’ambivalence du verbe entre geste physique et adoration religieuse.
- issue: Titre divin Δέσποτα
  choice: Maître
  alternative: Seigneur ; Souverain
  rationale: Le grec emploie Δέσποτα et non κύριε. « Maître » respecte cette distinction sans introduire le titre habituellement associé à κύριος.
translation_notes:
  register: 'Français international moderne, digne et accessible. Le vouvoiement pluriel correspond aux formes grecques adressées à plusieurs personnes. La répétition de « se prosterner » est intentionnelle : elle reproduit celle du grec et fait ressortir le contraste entre le culte rendu aux idoles et celui qui revient au Maître.'
