base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/050.yaml
  text: For since they are wooden, overlaid with gold and overlaid with silver, it will afterward be known that they are false; to all the nations and to the kings it will be evident that they are not gods but works of human hands, and there is no work of God in them.
translation:
  language: fr
  text: Car, puisqu’elles sont en bois, recouvertes d’or et recouvertes d’argent, on reconnaîtra par la suite qu’elles sont fausses. Il sera manifeste à toutes les nations et à tous les rois qu’elles ne sont pas des dieux, mais des œuvres façonnées par des mains humaines, et qu’aucune œuvre de Dieu ne se trouve en elles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπάρχοντα ... ξύλινα
  choice: puisqu’elles sont en bois
  rationale: Rend la valeur causale de γάρ et l’état matériel exprimé par ὑπάρχοντα, avec une formulation française naturelle.
- source_word: περίχρυσα καὶ περιάργυρα
  choice: recouvertes d’or et recouvertes d’argent
  rationale: Conserve explicitement les deux adjectifs parallèles, qui désignent un revêtement d’or et d’argent plutôt qu’une composition en métaux précieux.
- source_word: ψευδῆ
  choice: fausses
  rationale: Préserve le jugement direct du grec, sans préciser abusivement s’il s’agit de tromperie, d’inauthenticité ou de fausse divinité.
- source_word: ἔργα χειρῶν ἀνθρώπων
  choice: des œuvres faites de mains humaines
  rationale: Maintient l’image biblique des mains humaines tout en produisant une expression intelligible en français actuel.
- source_word: οὐθὲν θεοῦ ἔργον ἐν αὐτοῖς ἐστίν
  choice: aucune œuvre de Dieu ne se trouve en elles
  rationale: Suit de près la construction grecque et conserve le contraste entre fabrication humaine et œuvre divine.
theological_decisions:
- issue: Portée de ψευδῆ appliqué aux idoles
  choice: qu’elles sont fausses
  alternative: qu’elles sont mensongères / trompeuses
  rationale: « Fausses » conserve l’ambiguïté du terme grec entre fausseté ontologique et caractère trompeur, sans résoudre la tension.
- issue: Sens de « aucune œuvre de Dieu en elles »
  choice: aucune œuvre de Dieu ne se trouve en elles
  alternative: elles ne possèdent aucune puissance divine
  rationale: La traduction retenue ne transforme pas « œuvre de Dieu » en « puissance divine », interprétation théologique plus étroite que le texte.
translation_notes:
  register: Français international moderne, sobre et digne. Le féminin pluriel reprend implicitement les idoles ou représentations évoquées dans le contexte. Le parallélisme « recouvertes d’or et recouvertes d’argent » est volontairement conservé.
