  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/045.yaml
  text: They are made by carpenters and goldsmiths; they can become nothing other than what the craftsmen want them to become.
translation:
  language: fr
  text: Ils sont fabriqués par des charpentiers et des orfèvres ; ils ne peuvent devenir rien d’autre que ce que les artisans veulent qu’ils deviennent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπὸ τεκτόνων καὶ χρυσοχόων
  choice: par des charpentiers et des orfèvres
  rationale: Ὑπό avec le génitif indique les agents de la fabrication. « Charpentiers » conserve le sens concret de τεκτόνων dans ce contexte, et « orfèvres » rend précisément χρυσοχόων.
- source_word: κατεσκευασμένα εἰσίν
  choice: ils sont fabriqués
  rationale: 'La tournure rend la valeur passive et l’état résultant du parfait : ces objets sont le produit d’un travail humain. « Fabriqués » convient naturellement à la confection d’idoles.'
- source_word: οὐθὲν ἄλλο μὴ γένηται
  choice: ils ne peuvent devenir rien d’autre
  rationale: Cette formulation française exprime l’exclusion et la dépendance absolue des objets envers leurs fabricants, tout en conservant l’idée de devenir portée par γένηται.
- source_word: βούλονται
  choice: veulent
  rationale: « Veulent » rend directement la volonté exprimée par le verbe grec sans la préciser indûment comme une intention technique.
- source_word: οἱ τεχνῖται
  choice: les artisans
  rationale: Le terme désigne de manière générale des ouvriers qualifiés ; « artisans » est actuel, naturel et distinct des métiers particuliers déjà nommés.
- source_word: αὐτὰ γενέσθαι
  choice: qu’ils deviennent
  rationale: La reprise de « deviennent » préserve la répétition grecque de γίνομαι et souligne que la forme ou l’état de ces objets dépend du choix des artisans.
theological_decisions:
- issue: Nature de l’affirmation au sujet des idoles
  choice: Le verset présente les idoles comme entièrement fabriquées et déterminées par des artisans humains, sans capacité de devenir autre chose par elles-mêmes.
  alternative: Une traduction plus littérale pourrait seulement dire qu’elles ne deviennent rien d’autre que ce que souhaitent les artisans, sans expliciter la nuance de capacité.
  rationale: Dans ce contexte polémique, l’enchaînement entre fabrication humaine et limitation au vouloir des fabricants justifie « ne peuvent devenir », sans ajouter de conclusion doctrinale étrangère au texte.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le parallélisme ainsi que la répétition de « devenir », tout en employant le point-virgule pour marquer le passage de la fabrication à la dépendance envers les artisans.
