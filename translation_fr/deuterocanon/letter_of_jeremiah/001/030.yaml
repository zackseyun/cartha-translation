  text: And in their houses the priests sit in state[a], having their tunics torn, and their heads and beards shaved, with their heads uncovered,
translation:
  language: fr
  text: Et dans leurs maisons, les prêtres siègent avec apparat[a], leurs tuniques déchirées, la tête et la barbe rasées, la tête découverte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sont assis sur des sièges » ; le verbe grec peut évoquer le fait de s’asseoir sur un siège cérémoniel. Le sens littéral lié à un siège de char paraît moins probable à l’intérieur de maisons.
    reason: Alternative lexicale pour le rare verbe διφρεύουσιν.
lexical_decisions:
- source_word: διφρεύουσιν
  choice: siègent avec apparat
  rationale: Le verbe, lié au siège ou au siège de char, décrit ici, à l’intérieur de maisons, une posture assise qui peut avoir un caractère cérémoniel. Cette formulation naturelle conserve cette nuance sans introduire des chars dans le contexte.
- source_word: χιτῶνας
  choice: tuniques
  rationale: χιτών désigne couramment la tunique, vêtement de base; « tuniques » est plus précis que le terme général « vêtements ».
- source_word: διερρωγότας
  choice: déchirées
  rationale: Le participe parfait décrit des tuniques qui se trouvent dans l’état d’avoir été déchirées.
- source_word: κεφαλὰς καὶ τοὺς πώγωνας ἐξυρημένους
  choice: la tête et la barbe rasées
  rationale: Le participe exprime l’enlèvement des cheveux et des poils par rasage. Le singulier distributif est idiomatique en français pour décrire chaque prêtre.
- source_word: ἀκάλυπτοί
  choice: découverte
  rationale: L’adjectif signifie directement « non couverte » et se rapporte à la tête des prêtres.
- source_word: οἴκοις
  choice: maisons
  rationale: Le grec dit littéralement « maisons ». La traduction évite de préciser « temples » ou « sanctuaires », ce qui interpréterait davantage le référent.
theological_decisions:
- issue: Description cultuelle des prêtres païens
  choice: Conserver les détails visibles sans les qualifier explicitement de rites de deuil ou de pratiques extatiques.
  alternative: Présenter les vêtements déchirés et le rasage comme des rites de deuil explicites, ou faire du verbe une intronisation cérémonielle certaine.
  rationale: Le grec décrit l’apparence et la posture des prêtres sans expliquer formellement la signification du rite. La traduction préserve cette retenue ainsi que la légère ambiguïté du verbe διφρεύουσιν.
translation_notes:
  register: Français international moderne, digne et accessible. « Siègent avec apparat » garde une coloration cérémonielle sans archaïsme excessif. Les participes grecs sont rendus par une construction descriptive fluide; le singulier distributif (« la tête et la barbe ») évite une lourdeur en français.
