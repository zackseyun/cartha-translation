  text: From the purple and the marble rotting upon them it will be known that they are not gods; and in the end they themselves will be eaten[a], and they will become a disgrace in the land.
translation:
  language: fr
  text: Par la pourpre et le marbre qui se décomposent sur eux, on reconnaîtra qu’ils ne sont pas des dieux. Par la suite, ils seront eux-mêmes mangés[a] et deviendront un objet de honte dans le pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « seront eux-mêmes consumés » ou « dévorés ». Le grec dit littéralement « seront mangés » ; cela peut désigner une consommation matérielle due à des créatures ou à la décomposition.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πορφύρας
  choice: pourpre
  rationale: Le nom peut désigner la pourpre comme étoffe ou parure précieuse. « Pourpre » conserve la concision et l’imagerie du grec sans préciser indûment sa forme.
- source_word: μαρμάρου
  choice: marbre
  rationale: Équivalent direct de μάρμαρον dans ce contexte de matériaux décoratifs appliqués aux idoles.
- source_word: τῆς ἐπ’ αὐτοὺς σηπομένης
  choice: qui se dégradent sur eux
  rationale: Le participe exprime la décomposition. « Se dégradent » convient à la fois à la pourpre et au marbre, alors que « pourrissent » serait peu naturel pour ce dernier.
- source_word: γνωσθήσεται
  choice: on reconnaîtra
  rationale: Le futur passif exprime ici le constat rendu manifeste; la tournure impersonnelle française est naturelle et fidèle.
- source_word: θεοί
  choice: des dieux
  rationale: Rend directement la négation de la divinité des idoles.
- source_word: ἐξ ὑστέρου
  choice: finalement
  rationale: Exprime l’aboutissement ultérieur sans imposer nécessairement une portée eschatologique.
- source_word: βρωθήσονται
  choice: seront dévorés
  rationale: Le verbe signifie littéralement « seront mangés ». « Dévorés » conserve l’image concrète tout en pouvant évoquer leur consommation par des créatures ou leur destruction progressive.
- source_word: ὄνειδος
  choice: un objet de honte
  rationale: Formulation française naturelle qui traduit le déshonneur public exprimé par ὄνειδος.
- source_word: ἐν τῇ χώρᾳ
  choice: dans le pays
  rationale: χώρα désigne ici le pays ou le territoire; « pays » est courant, clair et suffisamment large.
theological_decisions:
- issue: Référent de αὐτά dans la dernière proposition
  choice: Les idoles elles-mêmes
  alternative: Les matériaux qui les recouvrent
  rationale: Le neutre pluriel αὐτά peut grammaticalement reprendre les objets idolâtriques, et le contexte polémique général les prend pour cible. La reprise explicite par « eux-mêmes » suit cette lecture, tandis que la note signale l’indétermination quant au mode de leur destruction.
- issue: Nature de la consommation exprimée par βρωθήσονται
  choice: Image concrète de destruction, rendue par « dévorés » sans agent précisé
  alternative: « consumés » ou « mangés », éventuellement par la vermine ou par la décomposition
  rationale: Le grec ne nomme aucun agent. La traduction préserve donc la force de l’image sans déterminer si elle renvoie aux créatures, à la décomposition ou plus largement à la destruction.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure proche du grec, mais « se dégradent » évite l’incongruité de faire littéralement « pourrir » le marbre. Le parallélisme polémique et l’ambiguïté de l’agent de la destruction sont conservés.
