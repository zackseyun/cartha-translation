  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/001.yaml
  text: Because of your sins[a], which you committed against God, you will be carried away captive to Babylon by Nebuchadnezzar king of the Babylonians.
translation:
  language: fr
  text: À cause des péchés[a] que vous avez commis contre Dieu, vous serez emmenés captifs à Babylone par Nabuchodonosor, roi des Babyloniens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, le grec répète la même idée : « les péchés que vous avez péchés ».'
    reason: La note rend visible la construction apparentée ἁμαρτίας … ἡμαρτήκατε, lissée dans le texte français.
lexical_decisions:
- source_word: Διὰ τὰς ἁμαρτίας
  choice: À cause des péchés
  rationale: διά avec l’accusatif exprime ici la cause. « À cause de » rend clairement ce rapport causal, et « péchés » est le terme français courant correspondant à ἁμαρτία.
- source_word: ἃς ἡμαρτήκατε
  choice: que vous avez commis
  rationale: Le grec emploie une construction apparentée, littéralement « les péchés que vous avez péchés ». En français actuel, « commettre des péchés » évite une tournure maladroite tout en conservant le sens; la répétition grecque est signalée en note.
- source_word: ἐναντίον τοῦ θεοῦ
  choice: contre Dieu
  rationale: Dans ce contexte moral, ἐναντίον exprime une faute dirigée contre Dieu, et non seulement une action accomplie devant lui.
- source_word: ἀχθήσεσθε
  choice: vous serez emmenés
  rationale: Le futur passif de ἄγω décrit ici une déportation imposée. « Être emmenés » est naturel en français et garde la valeur passive.
- source_word: εἰς Βαβυλῶνα
  choice: à Babylone
  rationale: εἰς indique la destination; « à Babylone » est la formulation française idiomatique.
- source_word: αἰχμάλωτοι
  choice: captifs
  rationale: L’adjectif attribut indique l’état dans lequel les destinataires seront emmenés. Le pluriel « captifs » correspond au sujet pluriel.
- source_word: ὑπὸ Ναβουχοδονοσὸρ
  choice: par Nabuchodonosor
  rationale: ὑπό avec un verbe passif introduit l’agent. « Nabuchodonosor » est la forme française traditionnelle du nom.
- source_word: βασιλέως τῶν Βαβυλωνίων
  choice: roi des Babyloniens
  rationale: Cette formulation conserve l’expression ethnique explicite du grec plutôt que de la remplacer par « roi de Babylone ».
theological_decisions:
- issue: Construction apparentée ἁμαρτίας … ἡμαρτήκατε
  choice: Employer dans le texte « les péchés que vous avez commis » et signaler la répétition grecque en note.
  alternative: Reproduire « les péchés que vous avez péchés ».
  rationale: La répétition souligne la culpabilité, mais sa reproduction littérale serait peu naturelle en français moderne. La note préserve cette donnée rhétorique sans obscurcir le texte.
- issue: Sens de ἐναντίον τοῦ θεοῦ
  choice: contre Dieu
  alternative: devant Dieu / en présence de Dieu
  rationale: Le contexte de faute entraînant le jugement favorise le sens relationnel et moral de l’opposition à Dieu, tout en évitant d’affaiblir la gravité théologique du propos.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe demeure proche du grec sans reproduire ses lourdeurs; « emmenés captifs » conserve à la fois la déportation forcée et l’état de captivité.
