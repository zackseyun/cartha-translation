  text: For how could they be called gods[b][a], since women set out offerings before silver and gold and wooden gods?
translation:
  language: fr
  text: Comment donc pourrait-on les appeler des dieux[a], puisque des femmes déposent des offrandes devant ces dieux d’argent, d’or et de bois[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « D’où pourraient-ils être appelés dieux ? »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des dieux en argent, en or et en bois ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πόθεν
  choice: Comment donc
  rationale: Dans cette question rhétorique, Πόθεν porte sur la possibilité ou le fondement de l’appellation. « Comment donc » exprime naturellement cette impossibilité en français moderne.
- source_word: κληθείησαν
  choice: pourrait-on les appeler
  rationale: L’optatif aoriste passif exprime ici une possibilité mise en doute dans une question rhétorique.
- source_word: θεοί
  choice: dieux
  rationale: Le grec emploie explicitement « dieux » dans une polémique qui conteste cette appellation; conserver le mot préserve l’ironie argumentative.
- source_word: ὅτι
  choice: puisque
  rationale: La conjonction introduit la raison qui soutient la question rhétorique.
- source_word: γυναῖκες
  choice: des femmes
  rationale: Traduction directe qui conserve la désignation précise du texte.
- source_word: παρατιθέασιν
  choice: déposent des offrandes devant
  rationale: Le verbe signifie placer ou présenter devant. « Des offrandes » explicite sobrement l’objet sous-entendu par le contexte cultuel, tandis que « devant » respecte la construction avec le datif.
- source_word: θεοῖς ἀργυροῖς καὶ χρυσοῖς καὶ ξυλίνοις
  choice: ces dieux d’argent, d’or et de bois
  rationale: Cette formulation conserve « dieux » et présente naturellement en français les trois matières indiquées par les adjectifs grecs.
theological_decisions:
- issue: Rendre θεοί par « dieux » ou par « idoles » dans la polémique contre l’idolâtrie
  choice: dieux
  alternative: idoles
  rationale: '« Dieux » traduit le terme grec et maintient la tension rhétorique: le texte demande précisément comment de tels objets peuvent recevoir ce nom.'
- issue: Degré d’explicitation de l’action cultuelle exprimée par παρατιθέασιν
  choice: déposent des offrandes devant
  alternative: placent devant / présentent à
  rationale: L’ajout d’« offrandes » rend compréhensible l’action rituelle sous-entendue sans identifier davantage ce qui est offert; « devant » garde l’image spatiale du grec.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique et l’ironie du mot « dieux » sont conservées. Les démonstratifs « les » et « ces » rendent clairs les référents implicites dans ce verset isolé.
