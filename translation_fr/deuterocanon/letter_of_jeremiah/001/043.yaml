  to: Mais chaque fois que l’une d’entre elles est entraînée par l’un des passants et couche avec lui[a], elle reproche à celle qui est près d’elle de ne pas avoir été jugée digne comme elle l’avait été[b], ni d’avoir eu son cordon rompu[c].
  rationale: La révision retire deux explicitations interprétatives (« à l’écart » et « du même traitement »), afin de conserver l’ellipse et l’ironie du grec. Elle clarifie en même temps la relation syntaxique entre le reproche, le fait de n’avoir pas été jugée digne et le cordon non rompu.
