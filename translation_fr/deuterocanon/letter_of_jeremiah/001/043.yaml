  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/043.yaml
  text: But whenever one of them is dragged away by one of the passersby and lies with him[a], she reproaches the one next to her because she was not deemed worthy as she was[c][b], nor was her cord broken.
translation:
  language: fr
  text: Mais chaque fois que l’une d’entre elles est entraînée par l’un des passants et couche avec lui[a], elle reproche à celle qui est près d’elle de ne pas avoir été jugée digne comme elle l’avait été[b], ni d’avoir eu son cordon rompu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « est tirée » ou « est emmenée ». Le grec peut désigner le fait d’être tirée ou conduite par quelqu’un. « Couche avec lui » est un euphémisme pour une relation sexuelle.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de ne pas avoir été jugée digne comme elle aussi [l’avait été] ». Le grec ne précise pas ce dont la figure voisine n’a pas été jugée digne.'
    reason: translation_clarity
  - marker: c
    text: Le « cordon » désigne probablement un lien attaché à l’image idolâtrique. La satire représente ces figures comme des femmes rivalisant pour attirer l’attention sexuelle.
    reason: cultural_note
lexical_decisions:
- source_word: ἐφελκυσθεῖσα
  choice: est entraînée à l’écart
  rationale: Le participe passif exprime le fait d’être tirée ou emmenée par quelqu’un. « Entraînée à l’écart » conserve la dimension physique sans imposer aussi fortement que « traînée » l’idée de violence.
- source_word: ὑπό τινος τῶν παραπορευομένων
  choice: par un passant
  rationale: Cette formulation française naturelle restitue l’indéfini grec et désigne l’un de ceux qui passent.
- source_word: κοιμηθῇ
  choice: couche avec lui
  rationale: Le verbe sert ici d’euphémisme sexuel. Cette expression est claire, actuelle et suffisamment sobre.
- source_word: τὴν πλησίον
  choice: celle qui se trouve à côté d’elle
  rationale: Le groupe désigne spatialement la figure voisine; cette traduction évite l’ambiguïté relationnelle de « sa voisine ».
- source_word: ὀνειδίζει
  choice: fait des reproches à
  rationale: Cette expression rend le blâme ou l’affront exprimé par le verbe dans un français courant et digne.
- source_word: οὐκ ἠξίωται ὥσπερ καὶ αὐτή
  choice: n’a pas été jugée digne du même traitement
  rationale: Le parfait passif est conservé, tandis que « du même traitement » explicite seulement le terme implicite de la comparaison sans déterminer positivement sa valeur.
- source_word: τὸ σχοινίον αὐτῆς διεράγη
  choice: son cordon n’a pas été rompu
  rationale: « Cordon » convient à un lien fixé à une image mieux que « corde » et « rompu » restitue directement la déchirure ou rupture exprimée par le verbe.
theological_decisions:
- issue: Référent des formes féminines
  choice: Le texte présente les idoles féminines personnifiées comme des femmes.
  alternative: Il pourrait s’agir de femmes liées à un sanctuaire idolâtre.
  rationale: Le contexte immédiat tourne les images idolâtriques en dérision en leur attribuant un comportement humain; le cordon favorise ce référent matériel, sans rendre toute autre lecture absolument impossible.
- issue: Valeur de la comparaison ὥσπερ καὶ αὐτή
  choice: La figure voisine n’a pas reçu le même traitement que celle qui parle.
  alternative: Traduire littéralement « comme elle aussi », au risque d’un référent pronominal obscur en français.
  rationale: La formulation choisie préserve le contraste et l’ironie du grec tout en rendant la relation comparative intelligible.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le caractère grotesque et satirique du passage, ainsi que l’ambiguïté relative au cordon et au statut exact des figures, sans introduire d’interprétation confessionnelle.
