  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/053.yaml
  text: They cannot judge their own case[a], nor can they rescue one who is wronged, because they are powerless;
translation:
  language: fr
  text: Ils ne peuvent pas juger leur propre cause[a], ni délivrer celui qui subit l’injustice, car ils sont impuissants ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils ne peuvent pas trancher eux-mêmes une affaire, ni délivrer de l’injustice. » Le grec est compact ; ἀδίκημα peut désigner l’injustice ou le tort, et, d’après le contexte, la personne qui en est victime.'
    reason: alternative lexicale et syntaxique
lexical_decisions:
- source_word: κρίσίν
  choice: cause
  rationale: 'Avec διακρίνωσιν, le nom a ici une valeur judiciaire : il s’agit d’une cause ou d’une affaire à trancher. « Cause » est naturel en français et conserve cette nuance.'
- source_word: διακρίνωσιν
  choice: juger
  rationale: Associé à κρίσιν, le verbe signifie décider ou trancher une affaire. « Juger » exprime clairement cette fonction judiciaire.
- source_word: ἑαυτῶν
  choice: leur propre
  rationale: Le pronom réfléchi indique que la cause concerne les idoles elles-mêmes. « Leur propre cause » rend ce rapport de manière idiomatique.
- source_word: ῥύσωνται
  choice: délivrer
  rationale: Le verbe désigne l’action d’arracher quelqu’un à un danger ou à une oppression. « Délivrer » convient au registre biblique tout en restant courant.
- source_word: ἀδίκημα
  choice: celui qui subit l’injustice
  rationale: Le nom désigne normalement une injustice ou un tort. Après ῥύσωνται, la formulation française explicite naturellement la personne lésée, tout en signalant en note que le grec compact peut aussi viser l’injustice elle-même.
- source_word: ἀδύνατοι ὄντες
  choice: car ils sont impuissants
  rationale: Le participe exprime la raison de la double incapacité. « Car ils sont impuissants » restitue nettement cette valeur causale et l’accent polémique du passage.
theological_decisions:
- issue: Nature de l’incapacité des idoles
  choice: Une incapacité concrète à juger et à délivrer
  alternative: Une affirmation métaphysique plus générale sur leur nature
  rationale: Le grec affirme ici leur impuissance pratique et judiciaire. La traduction n’élargit pas cette déclaration au-delà de ce que dit le verset.
- issue: Référent de ἀδίκημα
  choice: La personne qui subit l’injustice, explicitée dans le texte
  alternative: L’injustice ou le tort comme réalité abstraite
  rationale: La construction grecque est compacte et permet de conserver une tension entre le tort et la personne lésée. Le texte principal privilégie une formulation française intelligible, tandis que la note préserve l’autre analyse.
translation_notes:
  register: Français international moderne, clair et digne. La tournure judiciaire « juger leur propre cause » conserve la force du grec sans technicisme excessif ; « impuissants » souligne l’incapacité des idoles sans ajouter d’affirmation doctrinale.
