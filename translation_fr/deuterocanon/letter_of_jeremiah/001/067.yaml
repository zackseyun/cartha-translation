  text: Wild animals are better than they are[a], because they can escape into shelter and help themselves.
translation:
  language: fr
  text: Les bêtes sauvages leur sont supérieures[a], car elles peuvent s’enfuir pour se mettre à l’abri et pourvoir à leur propre bien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « valent mieux qu’elles ».'
    reason: Alternative lexicale et formulation plus idiomatique du comparatif κρείττω; « elles » renvoie aux idoles du contexte.
lexical_decisions:
- source_word: τὰ θηρία
  choice: les bêtes sauvages
  rationale: Le terme désigne des animaux sauvages; « bêtes sauvages » est naturel en français et maintient le contraste avec les idoles.
- source_word: κρείττω
  choice: sont supérieures
  rationale: Le comparatif exprime ici une supériorité pratique plutôt qu’une qualité morale.
- source_word: αὐτῶν
  choice: leur
  rationale: Le pronom renvoie aux idoles évoquées dans le contexte. Le français permet de conserver la forme pronominale sans répéter explicitement le référent.
- source_word: ἃ δύνανται
  choice: car elles peuvent
  rationale: La proposition relative explique en quoi les bêtes sont supérieures; « car » rend clairement cette valeur explicative.
- source_word: ἐκφυγόντα εἰς σκέπην
  choice: s’enfuir vers un abri
  rationale: Cette formulation rend le mouvement de fuite vers un lieu protecteur, malgré la construction participiale resserrée du grec transmis.
- source_word: αὐτὰ ὠφελῆσαι
  choice: agir pour leur propre bien
  rationale: Le grec exprime l’idée que les animaux peuvent eux-mêmes faire ce qui leur est profitable. Cette formulation française est naturelle sans préciser excessivement la nature du bénéfice.
theological_decisions:
- issue: Référent de αὐτῶν dans la comparaison
  choice: Le pronom « leur » renvoie aux idoles du contexte.
  alternative: Répéter explicitement « aux idoles » ou traduire plus littéralement « valent mieux qu’elles ».
  rationale: Le passage poursuit sa satire des idoles. Le pronom conserve le lien contextuel sans ajouter au texte grec un nom absent de ce verset.
translation_notes:
  register: 'Français moderne, clair et digne. La formulation conserve la comparaison satirique ainsi que l’idée centrale : contrairement aux idoles, les animaux peuvent chercher refuge et agir dans leur propre intérêt.'
