  text: They will never show mercy to a widow[b][a], nor do good to an orphan.
translation:
  language: fr
  text: Ils n’auront jamais compassion d’une veuve[a] et ne feront aucun bien à un orphelin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils n’auront certainement pas pitié d’une veuve. » Le grec emploie une négation emphatique (οὐ μή).'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « à une personne privée de père ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χήραν
  choice: d’une veuve
  rationale: Accusatif singulier de χήρα. Le singulier indéfini garde ici la valeur représentative du grec et convient à une affirmation générale en français.
- source_word: οὐ μὴ ἐλεήσωσιν
  choice: Ils n’auront jamais compassion
  rationale: οὐ μή suivi du subjonctif aoriste exprime une négation fortement appuyée. « Jamais » en restitue naturellement la force, tandis que « avoir compassion de » rend ἐλεέω dans un registre actuel et digne.
- source_word: οὔτε
  choice: et ne… aucun
  rationale: οὔτε coordonne la seconde proposition négative à la première. En français, « et ne… aucun » produit une coordination naturelle tout en conservant nettement la négation.
- source_word: ὀρφανῷ
  choice: à un orphelin
  rationale: Le datif singulier de ὀρφανός désigne un orphelin, ou plus précisément une personne privée de père. « Un orphelin » est clair en français moderne et conserve le singulier représentatif.
- source_word: εὖ ποιήσουσιν
  choice: ne feront aucun bien
  rationale: εὖ ποιέω signifie faire du bien ou procurer un bienfait. Cette formulation préserve la structure verbale et, avec « aucun », exprime naturellement la portée négative de la proposition.
theological_decisions:
- issue: Rendu du couple social χήρα / ὀρφανός
  choice: veuve / orphelin
  alternative: veuve / personne privée de père
  rationale: Le couple désigne les personnes vulnérables emblématiques de l’éthique biblique. « Veuve / orphelin » est le rendu moderne le plus immédiatement intelligible, sans ajouter une interprétation confessionnelle.
- issue: Force de la négation οὐ μή
  choice: jamais
  alternative: certainement pas
  rationale: La tournure grecque est emphatique. « Jamais » conserve cette insistance sans transformer l’incapacité dénoncée en affirmation théologique plus précise que le texte.
translation_notes:
  register: Français international moderne, simple et digne. La phrase garde le parallélisme des deux groupes vulnérables et rend explicitement la négation emphatique du premier membre.
