translation:
  language: fr
  text: En effet, ils ne peuvent ni maudire les rois ni les bénir[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie une négation emphatique : « ils ne maudiront certainement pas les rois ni ne les béniront » ; dans le contexte, le sens est qu’ils sont incapables de faire l’un ou l’autre.'
    reason: Préciser la force de la négation grecque derrière la traduction exprimant l’incapacité, tout en conservant la corrélation négative du grec.
lexical_decisions:
- source_word: Οὔτε γὰρ
  choice: En effet, ... ni ... ni
  rationale: γάρ introduit l’explication, rendue naturellement par « En effet » ; οὔτε ouvre la construction corrélative négative « ni… ni ».
- source_word: βασιλεῦσιν
  choice: les rois
  rationale: Le datif pluriel désigne les personnes visées par la malédiction et la bénédiction. En français courant, ces verbes se construisent ici directement avec « les rois ».
- source_word: οὐ μὴ καταράσωνται
  choice: ils ne peuvent ... maudire
  rationale: La négation emphatique οὐ μή avec le subjonctif aoriste exprime une exclusion catégorique. Dans cette polémique sur l’impuissance des idoles, « ne peuvent » communique clairement l’incapacité visée.
- source_word: οὔτε μὴ εὐλογήσωσι
  choice: ni les bénir
  rationale: La seconde proposition est parallèle à la première. Le complément « les » reprend naturellement « les rois », sous-entendu dans le grec.
theological_decisions:
- issue: Valeur de la négation emphatique dans la polémique contre les idoles
  choice: 'Exprimer l’incapacité : « ils ne peuvent ni… ni… »'
  alternative: 'Exprimer une négation catégorique ou future : « ils ne maudiront certainement pas… et ne béniront pas… »'
  rationale: Le grec permet une négation fortement emphatique ; le contexte souligne l’impuissance des idoles. La formulation retenue transmet cette force sans ajouter de capacité ou d’action absente du texte.
translation_notes:
  register: Français international moderne, clair et digne. « En effet » marque le lien explicatif ; la tournure « ne peuvent ni… ni… » reste naturelle tout en conservant la vigueur polémique du grec.
