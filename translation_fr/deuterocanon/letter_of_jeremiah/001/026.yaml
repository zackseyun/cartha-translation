    rationale: « Si l’une d’elles tombe à terre, elles ne peuvent pas se relever » juxtapose un cas singulier et un prédicat pluriel sans formulation collective qui l’explique. Le grec est difficile, mais le français doit rester grammatical et lisible.
  - severity: low
    issue: La note a présente comme littérale une formulation française difficilement intelligible
    rationale: La note peut indiquer la construction condensée et l’alternance de nombre du grec sans donner une pseudo-citation française qui mêle elle-même singulier et pluriel.
  - severity: low
    issue: « Elle ne se redressera » atténue la voix passive de ὀρθωθῇ
    rationale: « Elle ne sera certainement pas redressée » maintient l’idée que l’idole ne peut être remise droite, y compris par une intervention extérieure.
