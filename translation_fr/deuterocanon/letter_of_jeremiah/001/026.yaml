  verdict: revise
  source_fidelity: 'Le sens central est fidèlement rendu : les idoles, incapables de se relever, de se mouvoir ou d’être redressées, reçoivent pourtant des dons comme les morts. Toutefois, la première phrase mélangeait de façon peu cohérente un antécédent singulier (« l’une ») et un sujet pluriel (« elles »). Le grec est lui-même syntaxiquement condensé et présente une tension de nombre ; le français peut la signaler en note sans reproduire une incohérence grammaticale dans le texte. La voix passive de ὀρθωθῇ est mieux préservée par « ne sera certainement pas redressée ».'
  naturalness: La révision emploie un singulier représentatif cohérent dans les trois descriptions de l’idole, puis le pluriel collectif dans la conclusion. « C’est pourquoi » rend plus naturellement l’inférence de διὰ τό, et « des dons sont déposés » conserve avec clarté le passif impersonnel du grec.
  terminology: « Dons » traduit adéquatement δῶρα tout en gardant sa portée générale ; « offrandes » demeure une alternative pertinente dans le contexte cultuel. « Redressée » rend directement ὀρθωθῇ et évite de limiter indûment le sens à une action autonome de l’idole.
