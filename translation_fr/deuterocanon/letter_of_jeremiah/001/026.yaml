  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/026.yaml
  text: Therefore[a], if one of them falls to the ground, they cannot raise themselves up; and if someone sets it upright, it will not move by itself; and if it is tilted, it will certainly not be made straight. Rather[b], gifts are set before them as before the dead.
translation:
  language: fr
  text: C’est pourquoi[a], si l’une d’elles tombe à terre, elle ne peut pas se relever par elle-même. Si quelqu’un la place debout, elle ne bougera pas d’elle-même ; et si elle est inclinée, elle ne sera certainement pas redressée. Mais des dons[b] sont déposés devant elles, comme devant des morts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec est ici condensé et présente une alternance de nombre. Le sens contextuel est que, si une idole tombe, elle ne peut pas se relever par elle-même.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des offrandes », dans ce contexte cultuel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τό
  choice: Ainsi
  rationale: Introduit naturellement la conséquence de la description précédente, tout en évitant une formulation française trop lourde.
- source_word: μή ποτε ἐπὶ τὴν γῆν πέσῃ, δι' αὐτῶν ἀνίστασθαι
  choice: si l’une d’elles tombe à terre, elles ne peuvent pas se relever par elles-mêmes
  rationale: 'La construction grecque est condensée et irrégulière. Cette formulation restitue le sens contextuel : les idoles sont incapables de se remettre debout sans aide.'
- source_word: μήτε ἐὰν τις αὐτὸ ὀρθὸν στήσῃ
  choice: Si quelqu’un en place une debout
  rationale: Exprime clairement l’intervention extérieure nécessaire pour mettre l’idole en position verticale.
- source_word: δι' ἑαυτοῦ κινηθήσεται
  choice: elle ne bougera pas d’elle-même
  rationale: Rend directement l’incapacité de l’idole à se mouvoir par sa propre puissance.
- source_word: μήτε ἐὰν κλιθῇ, οὐ μὴ ὀρθωθῇ
  choice: et si elle penche, elle ne se redressera certainement pas
  rationale: « Penche » conserve l’image de l’inclinaison, tandis que « certainement pas » rend la négation grecque emphatique οὐ μή.
- source_word: ἀλλ' ὥσπερ νεκροῖς
  choice: Au contraire, ... comme devant des morts
  rationale: Marque le contraste et préserve la comparaison explicite avec les morts.
- source_word: τὰ δῶρα αὐτοῖς παρατίθεται
  choice: on dépose devant elles des dons
  rationale: « Dons » garde le sens large de δῶρα ; la note signale la valeur cultuelle possible d’« offrandes ». La tournure impersonnelle française rend naturellement le passif grec.
theological_decisions:
- issue: Référent et nombre des pronoms désignant les idoles
  choice: Employer le pluriel collectif dans la première proposition, puis le singulier représentatif dans les propositions suivantes, et revenir au pluriel dans la conclusion.
  alternative: Employer soit le pluriel, soit le singulier représentatif dans tout le verset.
  rationale: Le grec présente des variations de nombre et de référence. La formulation française conserve cette oscillation de façon compréhensible sans imposer une uniformité absente de la source.
- issue: Nature des δῶρα déposés devant les idoles
  choice: Traduire par « dons » dans le texte et signaler « offrandes » en note.
  alternative: Traduire directement par « offrandes ».
  rationale: δῶρα désigne largement des dons, mais le contexte cultuel autorise « offrandes ». Garder « dons » dans le texte préserve l’étendue lexicale du grec.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme met en relief l’impuissance physique des idoles. Les pronoms féminins renvoient naturellement aux « idoles » du contexte, et la légère variation entre collectif et exemplaire reflète l’irrégularité du grec.
