revisions:
- from: Ainsi[a], si l’une d’elles tombe à terre, elles ne peuvent pas se relever par elles-mêmes. Si quelqu’un en place une debout, elle ne bougera pas d’elle-même ; et si elle penche, elle ne se redressera certainement pas. Au contraire, on dépose devant elles des dons[b], comme devant des morts.
  to: C’est pourquoi[a], si l’une d’elles tombe à terre, elle ne peut pas se relever par elle-même. Si quelqu’un la place debout, elle ne bougera pas d’elle-même ; et si elle est inclinée, elle ne sera certainement pas redressée. Mais des dons[b] sont déposés devant elles, comme devant des morts.
  rationale: La révision corrige l’incohérence singulier/pluriel sans aplanir la difficulté du grec, qui est explicitement signalée en note. Elle améliore aussi la fidélité grammaticale de la dernière proposition relative à l’idole inclinée, tout en conservant le vocabulaire et le registre moderne du projet.
