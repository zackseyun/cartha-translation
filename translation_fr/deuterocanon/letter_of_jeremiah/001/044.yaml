  text: Everything that happens to them is false[a]; how then should one suppose or call them gods?
translation:
  language: fr
  text: Tout ce qui leur arrive est faux[a] ; comment donc les considérer ou les appeler des dieux ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec peut aussi se comprendre : « Tout ce qui est fait pour eux est faux » ou « mensonger ». À la fin de la question, il ajoute explicitement un infinitif signifiant « être » ou « exister » ; son lien exact avec « comme des dieux » et avec les deux verbes précédents est discuté.'
    reason: La relation de αὐτοῖς à γενόμενα et la syntaxe de l’infinitif ὑπάρχειν sont ambiguës ; la note conserve ces possibilités sans donner une paraphrase grammaticalement trompeuse.
lexical_decisions:
- source_word: πάντα τὰ γενόμενα αὐτοῖς
  choice: Tout ce qui leur arrive
  rationale: La tournure garde la portée générale de πάντα et rend naturellement γενόμενα avec αὐτοῖς, sans préciser indûment un agent.
- source_word: ψευδῆ
  choice: est faux
  rationale: L’adjectif prédicatif qualifie collectivement « tout ce qui leur arrive ». « Faux » préserve la formulation concise et la possible idée de tromperie sans la développer.
- source_word: πῶς οὖν
  choice: comment donc
  rationale: Cette expression restitue clairement la conséquence rhétorique tirée de la proposition précédente.
- source_word: νομιστέον
  choice: pourrait-on penser
  rationale: Le conditionnel associé au pronom indéfini rend naturellement la tournure impersonnelle et délibérative du verbal grec.
- source_word: ἢ κλητέον
  choice: ou dire
  rationale: Dans ce contexte, « dire qu’ils sont » exprime en français courant l’acte de les appeler ou de les désigner comme dieux, sans la lourdeur de « les appeler des dieux » après « penser ».
- source_word: ὡς θεοὺς αὐτοὺς ὑπάρχειν
  choice: qu’ils sont des dieux
  rationale: Cette proposition restitue ensemble l’idée de les tenir ou les désigner pour des dieux et le verbe d’existence ὑπάρχειν. Une note signale la structure grecque, dont l’articulation exacte demeure difficile.
theological_decisions:
- issue: Portée de la négation rhétorique concernant les idoles
  choice: La question nie qu’on puisse légitimement penser ou affirmer que les idoles sont des dieux.
  alternative: 'Faire ressortir séparément l’existence : « les appeler des dieux comme s’ils existaient » ou « penser qu’ils existent en tant que dieux ».'
  rationale: Le grec contient explicitement ὑπάρχειν, mais l’expression française « qu’ils sont des dieux » inclut déjà l’affirmation d’existence et évite d’insinuer que les objets eux-mêmes n’existent matériellement pas. La note conserve l’ambiguïté syntaxique et la nuance existentielle.
translation_notes:
  register: Français international moderne, sobre et digne. La question rhétorique reste directe. Le point-virgule conserve le lien logique étroit entre le constat et sa conséquence.
