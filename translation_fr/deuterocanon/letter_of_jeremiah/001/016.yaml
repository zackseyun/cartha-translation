  text: Such are their gods[a], set up in houses. Their eyes are full of dust from the feet of those who enter.
translation:
  language: fr
  text: Tels sont leurs dieux[a], installés dans des maisons. Leurs yeux sont pleins de poussière provenant des pieds de ceux qui entrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs idoles ». Le texte grec dit « leurs dieux », reprenant la manière polémique dont l’auteur désigne les images adorées par les nations.
    reason: Alternative lexicale et clarification de la rhétorique du texte grec.
lexical_decisions:
- source_word: τοιοῦτοι ὑπάρχουσιν
  choice: Voilà ce que sont
  rationale: Cette tournure française naturelle conserve la force démonstrative et récapitulative de τοιοῦτοι, tandis que ὑπάρχουσιν a ici une valeur copulative.
- source_word: οἱ θεοὶ αὐτῶν
  choice: leurs dieux
  rationale: Le grec dit explicitement « leurs dieux ». Cette formulation maintient la désignation polémique des images sans la remplacer dans le texte par l’interprétation « idoles ».
- source_word: καθιδρυμένων αὐτῶν
  choice: installés
  rationale: Le participe passif décrit les dieux placés et établis à un endroit. « Installés » convient à des images disposées dans des bâtiments sans introduire l’idée plus précise d’intronisation.
- source_word: ἐν τοῖς οἴκοις
  choice: dans des maisons
  rationale: « Maisons » traduit οἴκοις sans préciser indûment « temples » ; l’article grec peut avoir ici une valeur générique.
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: leurs yeux
  rationale: Le rendu littéral préserve la satire fondée sur l’apparence corporelle d’images pourtant inertes.
- source_word: πλήρεις εἰσὶν κονιορτοῦ
  choice: sont pleins de poussière
  rationale: Cette formulation directe conserve l’image concrète de la poussière accumulée dans les yeux.
- source_word: ἀπὸ τῶν ποδῶν τῶν εἰσπορευομένων
  choice: soulevée par les pieds de ceux qui entrent
  rationale: ἀπό indique l’origine de la poussière. En français, « soulevée par » exprime clairement qu’elle provient du passage des personnes qui entrent, sans attribuer la poussière aux pieds eux-mêmes.
theological_decisions:
- issue: Référent de « leurs dieux »
  choice: Conserver « leurs dieux » comme désignation polémique des images cultuelles.
  alternative: leurs idoles
  rationale: Bien que le contexte présente ces objets comme des idoles impuissantes, θεοί signifie explicitement « dieux ». Le texte principal garde donc la tension rhétorique de la source, et la note fournit l’autre formulation interprétative.
translation_notes:
  register: Français international moderne, clair et digne. « Voilà ce que sont » rend naturellement le jugement récapitulatif ; « installés » évite une formulation lourde. Le terme concret « maisons » est maintenu plutôt que l’interprétation plus étroite « temples ».
