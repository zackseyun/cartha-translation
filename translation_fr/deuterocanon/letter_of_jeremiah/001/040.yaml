  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/040.yaml
  text: 'Moreover[a], even the Chaldeans themselves dishonor them: whenever they see a mute person unable to speak, they bring him before Bel and ask that he make him speak[c][b], as though he were able to perceive.'
translation:
  language: fr
  text: 'De plus, même les Chaldéens eux-mêmes les déshonorent : chaque fois qu’ils voient une personne muette, incapable de parler, ils l’amènent devant Bel[a] et lui demandent de la faire parler, comme s’il était capable de comprendre[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bel est un nom ou titre divin babylonien associé à Mardouk.
    reason: cultural_note
  - marker: b
    text: 'Ou : « de percevoir » ou « de s’en apercevoir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι δὲ καὶ
  choice: De plus, … eux-mêmes
  rationale: « De plus » rend la progression de l’argument, tandis que l’emphase de καί est exprimée naturellement avec « eux-mêmes ».
- source_word: αὐτῶν τῶν Χαλδαίων
  choice: les Chaldéens eux-mêmes
  rationale: Le pronom intensif αὐτῶν souligne que même les propres adorateurs de ces idoles les traitent sans honneur; rien dans le grec n’impose « certains Chaldéens ».
- source_word: ἀτιμαζόντων αὐτά
  choice: les déshonorent
  rationale: Rend directement l’idée de priver les idoles d’honneur ou de les traiter indignement, tout en conservant le pronom qui renvoie au contexte précédent.
- source_word: ἐνεὸν οὐ δυνάμενον λαλῆσαι
  choice: une personne muette, incapable de parler
  rationale: Formulation actuelle et respectueuse qui conserve l’explication redondante du grec.
- source_word: προσενεγκάμενοι τὸν Βῆλον
  choice: ils l’amènent devant Bel
  rationale: Le contexte exige comme objet sous-entendu la personne muette; « devant Bel » exprime sa présentation rituelle à la divinité ou à son image.
- source_word: ἐξιοῦσιν φωνῆσαι
  choice: lui demandent de la faire parler
  rationale: Dans le contexte, la demande adressée à Bel vise à faire parler la personne muette; les pronoms français rendent explicites les deux référents sans alourdir la phrase.
- source_word: ὡς δυνατοῦ ὄντος αὐτοῦ αἰσθέσθαι
  choice: comme s’il était capable de comprendre
  rationale: αἰσθέσθαι peut exprimer la perception, la prise de conscience ou la compréhension. « Comprendre » est naturel en français et maintient l’ironie portant sur l’incapacité de Bel à prendre connaissance de la demande.
theological_decisions:
- issue: Nature du déshonneur infligé aux idoles par les Chaldéens
  choice: Le texte affirme que les Chaldéens eux-mêmes déshonorent les idoles en sollicitant Bel pour une guérison qu’il est incapable même de percevoir.
  alternative: Le propos pourrait viser plus étroitement le traitement indigne des images, sans formuler un jugement général sur les dieux des Chaldéens.
  rationale: Le contexte polémique met en évidence l’impuissance des idoles, mais la traduction conserve le pronom « les » et ne développe pas l’accusation au-delà de ce que dit le grec.
- issue: Portée de αἰσθέσθαι
  choice: comprendre
  alternative: percevoir; s’en apercevoir; prendre connaissance de la demande
  rationale: Le verbe grec reste assez large. La traduction principale privilégie une expression française naturelle, tandis que la note préserve les autres nuances possibles sans décider si l’accent porte sur la perception sensorielle ou sur l’intelligence.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe a été légèrement restructurée pour éviter la lourdeur du participe grec. « Personne muette » évite un terme vieilli ou péjoratif; les pronoms « lui » et « la » distinguent Bel de la personne amenée devant lui.
