  text: Therefore, it is in no way evident to us that they are gods; so do not fear them.
translation:
  language: fr
  text: Ainsi, il ne nous apparaît nullement qu’ils soient des dieux ; ne les craignez donc pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατʼ οὐδένα ... τρόπον
  choice: rien ne permet
  rationale: Cette tournure française naturelle conserve la négation catégorique de l’expression grecque, sans lourdeur comme « d’aucune manière ».
- source_word: φανερὸν
  choice: voir clairement
  rationale: Le grec exprime ce qui est manifeste ou évident. « Voir clairement » maintient ici l’accent sur ce qui peut être constaté.
- source_word: θεοί
  choice: des dieux
  rationale: Le pluriel ordinaire rend directement θεοί et préserve la force polémique du déni de divinité.
- source_word: μὴ φοβῆσθε
  choice: ne les craignez pas
  rationale: L’impératif français est direct, digne et fidèle à l’interdiction de craindre ces objets.
- source_word: διό
  choice: donc
  rationale: « Donc » marque naturellement la conséquence tirée de l’affirmation précédente.
theological_decisions:
- issue: Référent de αὐτούς dans la dernière proposition
  choice: « les » renvoie aux idoles présentées comme des dieux
  alternative: Expliciter par « ces idoles »
  rationale: Le pronom grec renvoie aux objets discutés dans tout le passage. Garder le pronom respecte la formulation du texte et n’ajoute pas d’explicitation interprétative.
translation_notes:
  register: Français international moderne, clair et digne. La formulation évite le calque peu naturel « il ne nous est d’aucune manière évident » tout en conservant la négation absolue et l’enchaînement logique du grec.
