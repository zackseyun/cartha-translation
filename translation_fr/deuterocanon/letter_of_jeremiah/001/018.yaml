  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/018.yaml
  text: They light lamps for them, more than for themselves, though they cannot see a single one of them.
translation:
  language: fr
  text: On leur allume plus de lampes qu’on n’en allume pour soi-même, mais ils ne peuvent en voir une seule.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύχνους
  choice: lampes
  rationale: Le nom désigne concrètement des lampes, probablement à huile, plutôt que la lumière au sens abstrait; « lampes » conserve l’image du culte rendu aux idoles.
- source_word: καίουσιν
  choice: on allume
  rationale: Avec « lampes » comme complément, « allumer » est le verbe naturel en français et rend ici l’idée de faire brûler ou d’allumer.
- source_word: πλείους ἢ ἑαυτοῖς
  choice: plus de lampes que pour soi-même
  rationale: La comparaison porte sur le nombre de lampes destinées aux idoles par rapport à celles que les adorateurs se réservent; cette formulation conserve la comparaison sans ajouter de précision absente du grec.
- source_word: ὧν οὐδένα
  choice: en voir une seule
  rationale: Le pronom relatif renvoie aux lampes, et οὐδένα souligne l’incapacité d’en voir même une; le pronom « en » reprend naturellement « lampes » en français.
- source_word: δύνανται ἰδεῖν
  choice: ils ne peuvent voir
  rationale: Cette formulation simple et directe exprime l’incapacité visuelle attribuée aux idoles.
theological_decisions:
- issue: Référent du sujet implicite de δύνανται ἰδεῖν
  choice: « ils » désigne les idoles, incapables de voir les lampes allumées pour elles
  alternative: Les adorateurs ne verraient aucun avantage provenant des idoles
  rationale: Dans le contexte immédiat de la Lettre de Jérémie, les idoles sont tournées en dérision comme des objets dépourvus de perception. Elles constituent donc le référent contextuel le plus proche et le plus cohérent, même si le grec n’énonce pas de nouveau le sujet.
translation_notes:
  register: Français international moderne, naturel et digne. L’emploi de « on » rend le sujet humain indéfini de καίουσιν sans lourdeur; le passage à « ils » distingue clairement les idoles, de genre masculin en français. « Mais » exprime naturellement le contraste implicite entre l’abondance des lampes et l’incapacité des idoles à les voir.
