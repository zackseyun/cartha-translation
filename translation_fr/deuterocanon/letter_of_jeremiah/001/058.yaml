base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/058.yaml
  text: So a king who displays his own courage is better than the false gods[a], or a useful vessel in a house, which its owner will use, or a door in a house that keeps safe the things in it, or the false gods, and a wooden pillar in palaces is better than the false gods.
translation:
  language: fr
  text: Ainsi, mieux vaut un roi qui montre sa propre vaillance que les faux dieux[a] ; mieux vaut aussi, dans une maison, un objet utile dont se servira son propriétaire que les faux dieux ; mieux vaut encore une porte qui protège ce qui se trouve dans la maison que les faux dieux ; et mieux vaut un pilier de bois dans un palais que les faux dieux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec répète « que les faux dieux » après chacune des quatre comparaisons, pour insister.
    reason: La note signale la répétition rhétorique inhabituelle que la traduction conserve.
lexical_decisions:
- source_word: ὥστε
  choice: Ainsi
  rationale: Introduit la conclusion tirée de l’argument précédent, dans un français naturel et digne.
- source_word: κρεῖσσον εἶναι
  choice: mieux vaut
  rationale: Rend idiomatiquement la comparaison de supériorité et permet de préserver sa cadence répétée.
- source_word: βασιλέα ἐπιδεικνύμενον τὴν ἑαυτοῦ ἀνδρείαν
  choice: un roi qui montre sa propre vaillance
  rationale: Conserve la valeur générique de « roi », l’idée de manifestation publique et l’insistance réflexive de ἑαυτοῦ.
- source_word: σκεῖος ἐν οἰκίᾳ χρήσιμον
  choice: dans une maison, un objet utile
  rationale: « Objet » garde ici l’extension assez large de σκεῖος sans suggérer nécessairement un récipient, tandis que « utile » maintient le contraste avec les idoles inutiles.
- source_word: ἐφʼ ᾧ χρήσεται ὁ κεκτημένος
  choice: dont se servira son propriétaire
  rationale: Expression française naturelle qui restitue l’usage concret de l’objet par celui qui le possède.
- source_word: οἱ ψευδεῖς θεοί
  choice: les faux dieux
  rationale: Désigne clairement des dieux qui ne sont pas véritables et maintient la portée polémique du grec.
- source_word: θύρα ἐν οἰκίᾳ διασώζουσα τὰ ἐν αὐτῇ ὄντα
  choice: une porte qui protège ce qui se trouve dans la maison
  rationale: Rend la fonction protectrice de la porte tout en évitant en français l’ambiguïté artificielle d’un pronom pouvant désigner la porte elle-même.
- source_word: ξύλινος στύλος ἐν βασιλείοις
  choice: un pilier de bois dans un palais
  rationale: Restitue l’image architecturale concrète ; le singulier générique français convient au pluriel grec désignant les bâtiments royaux.
theological_decisions:
- issue: Structure rhétorique marquée par la répétition de ἢ οἱ ψευδεῖς θεοί
  choice: Répéter explicitement « mieux vaut… que les faux dieux » pour chacune des quatre comparaisons.
  alternative: Regrouper tous les éléments dans une seule proposition comparative.
  rationale: La répétition grecque donne au passage sa cadence polémique. La conserver évite d’atténuer l’opposition entre les objets ou personnes utiles et les faux dieux.
translation_notes:
  register: Français international actuel, clair et digne. La syntaxe a été légèrement réorganisée en quatre propositions parallèles afin de rendre lisible la construction grecque tout en préservant sa répétition emphatique.
