  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/069.yaml
  text: For just as in a cucumber patch there is nothing guarding it[a], so their gods are wooden and overlaid with gold and silver.
translation:
  language: fr
  text: Car, de même qu’un épouvantail dans un champ de concombres ne garde rien, de même leurs dieux sont en bois, recouverts d’or et d’argent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σικυηράτῳ
  choice: champ de concombres
  rationale: Le nom désigne un terrain planté de concombres ou de courges. « Champ de concombres » restitue naturellement l’image agricole sans élargir inutilement le sens.
- source_word: προβάσκάινόν
  choice: rien ne monte la garde
  rationale: La forme transmise est lexicalement et textuellement difficile. Avec οὐδὲν et φυλάσσον, elle évoque ici l’absence de garde ou de surveillance, sans qu’il soit prudent d’imposer une reconstruction plus précise.
- source_word: φυλάσσον
  choice: monte la garde
  rationale: Le participe de φυλάσσω exprime l’action de garder ou de surveiller. Cette tournure française convient à l’image d’un terrain laissé sans protection.
- source_word: θεοὶ
  choice: dieux
  rationale: Le grec dit littéralement « dieux ». Le conserver préserve la force polémique du texte, qui décrit ensuite leur nature matérielle.
- source_word: ξύλινοι
  choice: sont en bois
  rationale: Cette formulation courante et précise exprime directement la matière dont ces dieux sont faits.
- source_word: περίχρυσοι
  choice: recouverts d’or
  rationale: Le composé indique qu’ils sont couverts d’or, et non faits d’or massif.
- source_word: περιάργυροι
  choice: recouverts d’argent
  rationale: Le terme indique pareillement une couverture d’argent; la coordination française « recouverts d’or et d’argent » rend clairement le parallélisme.
theological_decisions:
- issue: Faut-il rendre θεοὶ par « dieux » ou, de manière interprétative, par « idoles » ?
  choice: dieux
  alternative: idoles
  rationale: Le texte emploie « dieux » dans sa polémique, puis dévoile leur composition matérielle. « Idoles » anticiperait cette interprétation au lieu de préserver la formulation de la source.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « de même que… de même » conserve la comparaison grecque. « Champ de concombres » maintient l’image agricole, tandis que la note signale honnêtement l’incertitude du segment difficile.
