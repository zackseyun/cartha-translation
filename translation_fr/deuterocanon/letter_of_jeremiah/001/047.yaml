  text: How then can the things made by them endure? For they have left behind lies and disgrace for those who come after[a][b].
translation:
  language: fr
  text: Comment donc les objets qu’ils ont fabriqués pourraient-ils subsister ? Car ils ont laissé mensonges et déshonneur à ceux qui viendront après eux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Comment donc les objets qu’ils ont fabriqués dureront-ils ? » Le grec pose rhétoriquement la question de leur devenir ou de leur capacité à subsister.'
    reason: alternative_reading
lexical_decisions:
- source_word: πῶς τε δὴ
  choice: Comment donc
  rationale: Rend naturellement la question rhétorique ainsi que la valeur à la fois déductive et emphatique des particules.
- source_word: μέλλει
  choice: pourraient-ils subsister
  rationale: Dans cette question rhétorique, le verbe porte sur le devenir ou la persistance des objets fabriqués. Le conditionnel français exprime naturellement l'impossibilité sous-entendue sans réduire le sens à une simple imminence.
- source_word: τὰ ὑπʼ αὐτῶν κατασκευασθέντα
  choice: les objets fabriqués par eux
  rationale: Le participe substantivé désigne ce qu'ils ont confectionné ou construit. « Objets » convient au référent contextuel sans introduire explicitement « idoles » dans le texte.
- source_word: κατέλιπον
  choice: ils ont laissé en héritage
  rationale: Le verbe indique ici ce qui demeure transmis aux générations suivantes ; cette formulation fait ressortir ce rapport avec τοῖς ἐπιγινομένοις.
- source_word: ψεύδη
  choice: mensonges
  rationale: Traduction directe du pluriel, adaptée à la dénonciation de la fausseté des objets cultuels.
- source_word: ὄνειδος
  choice: déshonneur
  rationale: Le terme évoque l'opprobre et la honte publique ; « déshonneur » conserve cette portée sans l'assimiler simplement à un sentiment intérieur.
- source_word: τοῖς ἐπιγινομένοις
  choice: à ceux qui viennent après eux
  rationale: Rend le participe substantivé en préservant la référence ouverte aux personnes ou générations ultérieures.
theological_decisions:
- issue: Référent des objets fabriqués
  choice: Conserver la désignation générale « les objets fabriqués par eux »
  alternative: Expliciter « les idoles fabriquées par eux »
  rationale: Le contexte désigne clairement les idoles, mais le grec demeure général. La traduction évite donc d'insérer dans le corps du texte une précision seulement contextuelle.
- issue: Portée de μέλλει dans la question
  choice: Exprimer la possibilité de subsister
  alternative: Traduire littéralement par « que va-t-il advenir » ou « comment dureront-ils »
  rationale: La syntaxe grecque est abrupte et peut viser le devenir ou la durée des objets. Le choix retenu communique la force rhétorique sans en faire une affirmation doctrinale plus précise que le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la vigueur polémique et la question rhétorique du grec, tout en évitant le calque maladroit de μέλλει. Le marqueur [a] figure bien dans le texte principal.
