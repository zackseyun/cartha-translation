  text: And there are times when the priests[a], taking gold and silver from their gods, spend it on themselves,
translation:
  language: fr
  text: Il arrive aussi que les prêtres retirent en secret[a] à leurs dieux de l’or et de l’argent, et les dépensent pour eux-mêmes,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dérobent » ou « soustraient ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστι δὲ καὶ ὅτε
  choice: Il arrive aussi que
  rationale: Cette tournure rend naturellement en français l’idée d’une situation qui se produit parfois, tout en conservant la valeur additive de καί.
- source_word: ὑφαιρούμενοι
  choice: retirent en secret
  rationale: Le participe peut désigner le fait de soustraire ou d’enlever furtivement. « Retirent en secret » préserve cette nuance sans imposer la qualification juridique plus forte de « voler ».
- source_word: οἱ ἱερεῖς
  choice: les prêtres
  rationale: Traduction directe et naturelle du groupe nominal grec articulé.
- source_word: ἀπὸ τῶν θεῶν αὐτῶν
  choice: à leurs dieux
  rationale: Après « retirer », le français idiomatique emploie « à » pour indiquer ceux auxquels les biens sont soustraits. « Leurs dieux » maintient l’ironie du texte.
- source_word: χρυσὸν καὶ ἀργύριον
  choice: de l’or et de l’argent
  rationale: Le grec nomme les matières précieuses sans préciser s’il s’agit d’objets ou d’ornements; la traduction conserve cette absence de précision.
- source_word: εἰς ἑαυτοὺς
  choice: pour eux-mêmes
  rationale: La formule indique que l’usage des biens est orienté vers l’intérêt personnel des prêtres.
- source_word: καταναλοῦσιν
  choice: les dépensent
  rationale: Avec l’or et l’argent comme objets, « dépenser » exprime clairement le sens de consommer ou d’épuiser des ressources. Le pronom pluriel reprend naturellement les deux éléments en français.
theological_decisions:
- issue: Présentation de la conduite des prêtres envers les idoles
  choice: Les prêtres soustraient secrètement les métaux précieux à leurs dieux et les dépensent pour leur propre compte.
  alternative: Employer « volent » pour expliciter davantage leur faute.
  rationale: La formulation conserve la satire portant sur l’impuissance des idoles et la corruption de leurs prêtres, tout en évitant de réduire la gamme de sens de ὑφαιρούμενοι à une seule qualification.
translation_notes:
  register: Français moderne, courant et digne. La phrase reste ouverte par une virgule afin de respecter la continuité syntaxique signalée dans la source fournie. Le marqueur de note est placé immédiatement après l’expression concernée.
