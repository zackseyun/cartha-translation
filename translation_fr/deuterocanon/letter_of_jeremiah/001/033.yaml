  text: Whether they suffer some harm from anyone or receive some good[a], they will not be able to repay it[b]; they cannot set up a king or remove one.
translation:
  language: fr
  text: Qu’ils subissent du mal de la part de quelqu’un ou qu’ils reçoivent du bien, ils ne pourront pas rendre la pareille[a] ; ils ne peuvent ni établir un roi ni le retirer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec signifie rendre en retour, qu’il s’agisse d’un mal ou d’un bien.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « établir un roi ou l’enlever ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε ἐὰν ... οὔτε ἐὰν
  choice: Qu’ils… ou qu’ils…
  rationale: Cette tournure française naturelle présente les deux éventualités parallèles sans reproduire lourdement le double οὔτε ἐάν.
- source_word: κακόν τι πάθωσιν ὑπό τινος
  choice: ils subissent un mal de la part de quelqu’un
  rationale: « Subir un mal » conserve l’idée d’une atteinte éprouvée et « de la part de quelqu’un » marque explicitement l’agent indéfini.
- source_word: ἀγαθόν
  choice: un bien
  rationale: « Un bien » répond directement à « un mal » et préserve le contraste général du grec sans préciser indûment la nature du bienfait.
- source_word: δυνήσονται ἀνταποδοῦναι
  choice: ils ne pourront pas le rendre
  rationale: ἀνταποδίδωμι désigne ici le fait de rendre en retour aussi bien le mal que le bien ; « rendre » convient aux deux objets et conserve cette amplitude.
- source_word: καταστῆσαι βασιλέα
  choice: établir un roi
  rationale: « Établir » exprime l’installation ou la mise en fonction d’un roi tout en restant proche du sens politique de καθίστημι.
- source_word: ἀφελέσθαι
  choice: le destituer
  rationale: Dans ce contexte politique, « destituer » rend clairement l’idée de retirer le roi de sa fonction ; le pronom renvoie au roi déjà mentionné.
theological_decisions:
- issue: Étendue de l’impuissance des idoles
  choice: Le verset affirme qu’elles sont incapables de rendre aussi bien le mal que le bien qui leur est fait, et qu’elles ne peuvent ni installer ni destituer un roi.
  alternative: Limiter l’idée de rétribution au seul mal, ou rendre plus littéralement la dernière expression par « enlever un roi ».
  rationale: La syntaxe grecque place le mal et le bien sous la portée du même verbe de réciprocité, puis étend la polémique à la sphère politique. La traduction maintient cette portée sans ajouter d’affirmation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme « un mal… un bien » conserve l’opposition grecque ; « le rendre » maintient volontairement la réciprocité applicable aux deux cas. Les deux marqueurs de note figurent dans le texte.
