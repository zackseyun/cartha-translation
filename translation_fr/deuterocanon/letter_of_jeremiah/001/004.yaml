  text: Therefore be on your guard[a], lest you too, having become like the foreigners, become like them, and fear seize you because of them,
translation:
  language: fr
  text: Soyez donc sur vos gardes, de peur que vous aussi, devenus semblables aux étrangers, vous ne leur deveniez semblables[a], et que la peur ne vous saisisse à cause d’eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec répète ici le même verbe : « devenus semblables aux étrangers… vous ne leur deveniez semblables ». Cette répétition souligne l’avertissement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλαβήθητε
  choice: Soyez sur vos gardes
  rationale: Dans ce contexte d’avertissement, l’impératif appelle à la prudence vigilante. Cette formulation naturelle évite le sens principalement religieux que pourrait suggérer « soyez révérencieux ».
- source_word: οὖν
  choice: donc
  rationale: Le terme marque la conséquence à tirer de l’avertissement précédent.
- source_word: μὴ καὶ ὑμεῖς
  choice: de peur que vous aussi
  rationale: Cette tournure française rend naturellement la construction grecque d’avertissement tout en conservant l’insistance sur les destinataires eux-mêmes.
- source_word: ἀφομοιωθέντες ... ἀφομοιωθῆτε
  choice: devenus semblables ... deveniez semblables
  rationale: La répétition du même verbe grec est maintenue afin de préserver son effet d’insistance, malgré une certaine lourdeur volontaire en français.
- source_word: τοῖς ἀλλοφύλοις
  choice: aux étrangers
  rationale: Le mot désigne littéralement des personnes appartenant à un autre peuple. « Étrangers » reste accessible et n’introduit pas les connotations techniques de « païens » ou de « gentils ».
- source_word: φόβος ὑμᾶς λάβῃ
  choice: que la peur ne vous saisisse
  rationale: Cette formulation conserve l’image vive de la peur qui s’empare des destinataires.
- source_word: ἐπʼ αὐτοῖς
  choice: à cause d’eux
  rationale: Cette traduction exprime naturellement le rapport causal ou circonstanciel indiqué par la préposition, tout en laissant le pronom sans explicitation supplémentaire.
theological_decisions:
- issue: Portée de l’avertissement exprimé par la répétition de ἀφομοιόω
  choice: Un avertissement à ne pas devenir semblables aux peuples étrangers, dans le contexte de leurs pratiques idolâtres
  alternative: Un avertissement général contre toute assimilation sociale ou culturelle
  rationale: Le contexte immédiat porte sur la crainte des idoles et l’imitation des peuples environnants. La traduction conserve néanmoins la formulation générale du grec et ne réduit pas explicitement l’avertissement à une thèse ethnique ou sociale.
- issue: Référent de αὐτοῖς dans ἐπʼ αὐτοῖς
  choice: Conserver le pronom « eux » sans identifier explicitement son référent
  alternative: Expliciter « les étrangers » ou « les idoles »
  rationale: Le pronom grec peut être compris en relation avec les étrangers mentionnés ou, selon le contexte plus large, avec les idoles. L’absence d’explicitation préserve cette ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. La répétition inhabituelle de « devenus/deveniez semblables » est conservée pour refléter l’insistance du grec; la note en explique l’effet.
