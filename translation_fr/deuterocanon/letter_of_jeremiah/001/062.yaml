  naturalness: « Ceux-ci ne leur ressemblent » est grammatical, mais son double référent est inutilement opaque en français isolé. « Ces idoles ne leur sont semblables » est plus naturel dans le contexte polémique explicite de la lettre. « Consumer » et « envoyé d’en haut » conviennent au registre biblique moderne.
  terminology: « Idoles », « aspect » et « puissance » rendent avec justesse le contexte et les termes ἰδέαις et δυνάμεσιν. « Ce qui a été prescrit » restitue τὸ συνταχθέν de façon plus directe que « ce qui lui a été assigné », sans imposer une interprétation doctrinale de l’agent qui prescrit.
