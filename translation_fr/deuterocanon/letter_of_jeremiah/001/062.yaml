  text: And the fire sent from above[a], to consume mountains and forests, does what it was appointed to do[b]; but these are not comparable to it either in appearance or in power.
translation:
  language: fr
  text: Et le feu envoyé d’en haut pour consumer montagnes et forêts accomplit ce qui a été prescrit[a] ; mais ces idoles ne leur sont semblables ni par l’aspect ni par la puissance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « accomplit ce qui a été ordonné ». L’expression grecque peut désigner ce qui a été fixé, prescrit, ordonné ou assigné.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ne sont pas rendues semblables », ni par les aspects ni par les puissances. Le grec emploie des pronoms pluriels ; leur référent précis se comprend d’après le contexte.'
    reason: source_clarification
lexical_decisions:
- source_word: πῦρ
  choice: le feu
  rationale: Sens concret et direct ; le feu est présenté comme une force naturelle qui exécute effectivement sa fonction, contrairement aux idoles.
- source_word: ἐξαποσταλὲν ἄνωθεν
  choice: envoyé d’en haut
  rationale: Cette formulation conserve l’origine supérieure suggérée par le grec sans préciser « du ciel » ou « par Dieu », éléments qui ne sont pas explicitement nommés.
- source_word: ἐξαναλῶσαι
  choice: pour consumer
  rationale: L’infinitif exprime ici la finalité du feu ; « consumer » convient à l’image et rend l’idée de destruction complète.
- source_word: ὄρη καὶ δρυμούς
  choice: montagnes et forêts
  rationale: Traduction naturelle et précise des deux réalités géographiques désignées.
- source_word: ποιεῖ τὸ συνταχθέν
  choice: accomplit ce qui lui a été assigné
  rationale: τὸ συνταχθέν peut désigner ce qui a été fixé, prescrit, ordonné ou assigné. La formulation retenue exprime une fonction déterminée sans imposer l’image plus personnelle d’un ordre verbal.
- source_word: ταῦτα
  choice: ceux-ci
  rationale: Le démonstratif neutre renvoie aux objets de culte évoqués dans le contexte. « Ceux-ci » garde la brièveté du grec sans répéter explicitement « les idoles ».
- source_word: ταῖς ἰδέαις
  choice: par l’aspect
  rationale: ἰδέα désigne ici la forme ou l’apparence visible ; « aspect » est actuel et dignifié.
- source_word: ταῖς δυνάμεσιν
  choice: par la puissance
  rationale: δύναμις désigne la puissance effective ou la capacité d’agir, précisément au cœur du contraste avec les idoles.
- source_word: ἀφωμοιωμένα
  choice: ne leur ressemblent
  rationale: Le parfait passif exprime l’absence d’assimilation ou de ressemblance. Une tournure française active est plus naturelle tout en conservant le rapport comparatif.
- source_word: αὐτῶν
  choice: leur
  rationale: Le pronom grec est au pluriel et renvoie vraisemblablement collectivement aux réalités naturelles mentionnées dans le contexte précédent, plutôt qu’au seul feu, singulier, de la première proposition.
theological_decisions:
- issue: Origine du feu « d’en haut »
  choice: Conserver « d’en haut »
  alternative: « du ciel » ou « envoyé par Dieu »
  rationale: ἄνωθεν suggère une origine supérieure, possiblement céleste ou divine, sans nommer explicitement le ciel ni Dieu. La traduction maintient cette implication sans la préciser doctrinalement.
- issue: Référent pluriel de αὐτῶν
  choice: Rendre le pluriel par « leur », avec une note explicative
  alternative: Rattacher la comparaison au seul feu et traduire « ne lui ressemblent »
  rationale: Le grec porte explicitement le pronom pluriel αὐτῶν. Il paraît reprendre collectivement les phénomènes naturels puissants cités dans le contexte. Le singulier serait plus immédiatement fluide dans ce seul verset, mais effacerait une donnée réelle du texte source.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. « Consumer » conserve la force de l’image biblique ; « assigné » évite une personnification excessive tout en préservant l’idée d’une fonction déterminée. Le pluriel grec de αὐτῶν est maintenu malgré l’ambiguïté qu’il peut créer lorsque le verset est lu isolément.
