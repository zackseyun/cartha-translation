  text: They certainly cannot set a blind man upright for seeing[a], nor can they rescue a man when he is in distress.
translation:
  language: fr
  text: Ils ne pourront absolument pas rendre la vue à un aveugle[a], ni délivrer un homme qui se trouve dans la détresse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mettre un aveugle en état de voir ». Le grec emploie une expression compacte, dont la formulation plus littérale est inhabituelle en français.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπον τυφλὸν
  choice: un aveugle
  rationale: Le grec désigne ici un être humain atteint de cécité. « Un aveugle » est une formulation française naturelle et concise, sans ajouter l’idée d’une affection particulière.
- source_word: εἰς ὅρασιν
  choice: rendre la vue
  rationale: L’expression indique le résultat visé, l’accès à la vision. En français courant, « rendre la vue » exprime naturellement ce sens, tout en signalant en note la formulation grecque compacte.
- source_word: οὐ μὴ
  choice: ne pourront jamais
  rationale: La double négation grecque marque une impossibilité catégorique. « Ne pourront jamais » en restitue la force dans un français actuel.
- source_word: περιστήσωσιν
  choice: rendre
  rationale: Dans cette construction avec εἰς ὅρασιν, le verbe décrit le fait de placer ou rétablir quelqu’un dans l’état de voir. La traduction idiomatique française est « rendre la vue », mais la difficulté lexicale est conservée en note.
- source_word: ἐν ἀνάγκῃ … ὄντα
  choice: qui se trouve dans la détresse
  rationale: ἀνάγκη évoque ici une situation pressante, pénible ou dangereuse. La proposition relative rend naturellement le participe ὄντα.
- source_word: ἐξέλωνται
  choice: délivrer
  rationale: Le moyen de ἐξαιρέω signifie tirer quelqu’un d’un danger ou d’une situation difficile. « Délivrer » convient au registre biblique tout en restant intelligible.
theological_decisions:
- issue: Portée de l’incapacité des idoles
  choice: ne pourront jamais
  alternative: ne peuvent absolument pas
  rationale: Le grec emploie οὐ μή avec le subjonctif aoriste pour nier avec force toute possibilité. La traduction maintient cette incapacité totale sans la réduire à une simple faiblesse.
- issue: Sens précis de l’aide apportée à l’aveugle
  choice: rendre la vue
  alternative: mettre un aveugle en état de voir
  rationale: Le contexte polémique affirme que les idoles sont incapables d’apporter la vision. La note préserve toutefois la construction littérale inhabituelle et évite de présenter l’interprétation idiomatique comme la seule analyse possible.
- issue: Référence humaine générique de ἄνθρωπον
  choice: un aveugle … un homme
  alternative: une personne aveugle … une personne
  rationale: Le premier syntagme se rend naturellement par le substantif « un aveugle »; dans le second, « un homme » conserve la forme représentative au singulier retenue dans la couche de consultation, sans limiter nécessairement l’énoncé aux hommes de sexe masculin.
translation_notes:
  register: Français international moderne, clair et digne. La coordination négative avec « ni » allège la phrase; « délivrer » garde une tonalité biblique accessible. Le pronom sujet « ils » reprend les idoles évoquées dans le contexte.
