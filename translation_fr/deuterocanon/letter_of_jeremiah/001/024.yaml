  text: They are bought at every price[a], but there is no breath in them.
translation:
  language: fr
  text: Ils sont achetés à n’importe quel prix, mais il n’y a en eux aucun souffle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aucun esprit ». Le grec πνεῦμα peut signifier « souffle », « esprit » ou « vent » ; ici, le sens est que les idoles sont sans vie.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ πάσης τιμῆς
  choice: à n’importe quel prix
  rationale: La tournure grecque associe l’achat à tout prix exigé. Cette expression française naturelle conserve l’idée commerciale sans préciser indûment le montant.
- source_word: ἠγορασμένα
  choice: s’achètent
  rationale: Le participe parfait passif de ἀγοράζω présente les idoles comme des objets que l’on acquiert. Le présent à valeur passive est naturel en français et convient à l’énoncé général.
- source_word: πνεῦμα
  choice: souffle
  rationale: Dans cette polémique contre les idoles, « souffle » exprime concrètement leur absence de vie. « Esprit » reste lexicalement possible et figure en note.
- source_word: ἐν οἷς
  choice: en eux
  rationale: Le relatif renvoie aux objets idolâtriques achetés; « en eux » garde le sens locatif et un registre digne.
theological_decisions:
- issue: Sens de πνεῦμα dans une polémique contre les idoles
  choice: souffle
  alternative: esprit
  rationale: Le propos immédiat souligne que les idoles sont inanimées. « Souffle » maintient le lien concret entre respiration et vie sans imposer une affirmation métaphysique plus forte; la polysémie est préservée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le contraste est rendu directement par « mais ». Le pronom masculin pluriel renvoie aux objets idolâtriques évoqués dans le contexte.
