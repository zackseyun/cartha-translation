  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/023.yaml
  text: For the gold with which they are adorned for beauty—unless someone wipes off the rust—it will certainly not shine; for not even when they were being cast did they perceive it.
translation:
  language: fr
  text: Car l’or dont on les couvre pour les embellir ne brillera certainement pas si personne n’en essuie la corrosion[a] ; car ils ne s’en rendaient même pas compte lorsqu’on les fondait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut désigner la rouille, la corrosion ou une couche de ternissure.
    reason: L’or ne rouille pas au sens strict; la note préserve l’étendue sémantique de ἰός et explique le choix de « corrosion ».
lexical_decisions:
- source_word: περιτίθενται εἰς κάλλος
  choice: dont on les couvre pour les embellir
  rationale: Exprime naturellement en français la pose d’or sur les idoles en vue de leur beauté, sans préciser au-delà du grec la technique employée.
- source_word: ἐκμάξῃ τὸν ἰόν
  choice: essuie la corrosion
  rationale: ἐκμάσσω indique l’action d’essuyer ou d’enlever en frottant, tandis que ἰός désigne ici l’altération qui ternit le métal; « corrosion » convient mieux que « rouille » à l’or.
- source_word: οὐ μὴ στίλψωσιν
  choice: ne brillera certainement pas
  rationale: La négation renforcée οὐ μή est conservée par « certainement pas »; le singulier français reprend naturellement « l’or », bien que le grec ait un verbe au pluriel selon le référent collectif ou les objets ornés.
- source_word: ἐχωνεύοντο
  choice: on les fondait
  rationale: Le passif imparfait évoque leur fabrication par fonte; la tournure française garde l’action en cours et le référent pluriel des idoles.
- source_word: ᾐσθάνοντο
  choice: ils ne s’en rendaient pas compte
  rationale: Rend l’absence de perception ou de sensation attribuée aux idoles, au cœur de l’ironie du passage.
theological_decisions:
- issue: Insensibilité des idoles pendant leur fabrication
  choice: ils ne s’en rendaient pas compte
  alternative: ils ne sentaient rien
  rationale: La formulation conserve la personnification ironique et l’idée générale de perception de αἰσθάνομαι, sans réduire nécessairement celle-ci à la seule sensation physique.
translation_notes:
  register: Français moderne, clair et digne. La phrase conserve le lien causal, la forte négation grecque et l’ironie visant des objets incapables de percevoir leur propre fabrication.
