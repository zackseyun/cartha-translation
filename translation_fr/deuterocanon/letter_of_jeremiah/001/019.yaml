  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/019.yaml
  text: They are indeed like a beam from a house[a], but they say that their hearts are licked away; while the creeping things from the ground devour them and their clothing, they do not perceive it.
translation:
  language: fr
  text: Ils sont bien comme une poutre d’une maison, mais on dit que leurs cœurs sont léchés jusqu’à disparaître[a] ; tandis que les créatures rampantes de la terre les dévorent, eux et leurs vêtements, ils ne sentent rien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur intérieur est léché jusqu’à disparaître ». Le grec dit littéralement « leurs cœurs », ce qui conserve l’image anthropomorphique ironique.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκός
  choice: poutre
  rationale: Le mot désigne ici une pièce de bois employée dans la structure d’une maison ; « poutre » rend précisément cette comparaison.
- source_word: καρδίας
  choice: cœur
  rationale: Le singulier collectif français conserve l’image anthropomorphique ironique du grec, qui attribue un « cœur » à ces objets de bois.
- source_word: ἐκλείχεσθαι
  choice: est léché jusqu’à disparaître
  rationale: Cette formulation garde l’image concrète de « lécher » tout en exprimant la consommation complète suggérée par le préverbe ἐκ-.
- source_word: ἑρπετῶν
  choice: bestioles qui rampent
  rationale: ἑρπετά désigne largement les petites créatures rampantes, sans se limiter à la catégorie moderne des reptiles ; « bestioles » convient au contexte de vermine qui ronge les idoles.
- source_word: κατεσθιόντων
  choice: dévorent
  rationale: Le verbe exprime une consommation active et complète ; « dévorent » en conserve la vigueur.
- source_word: ἱματισμόν
  choice: vêtements
  rationale: Terme moderne et naturel pour les étoffes dont les idoles sont revêtues.
- source_word: οὐκ αἰσθάνονται
  choice: ils ne sentent rien
  rationale: La formule française exprime directement l’absence de sensation des idoles, au cœur de la polémique du passage.
theological_decisions:
- issue: Référent du verbe final et des pronoms
  choice: 'Les idoles restent le référent : les créatures rampantes dévorent les idoles et leurs vêtements, sans que celles-ci sentent quoi que ce soit.'
  alternative: Comprendre que les adorateurs sont implicitement sujets d’une partie de la phrase, notamment de « on dit ».
  rationale: Le contexte immédiat dénonce l’insensibilité des idoles. Même si φασίν renvoie à des personnes qui parlent, les pronoms et le verbe final ont naturellement les idoles pour référent.
- issue: Rendu de l’image du « cœur » des idoles
  choice: Conserver « cœur » dans le texte principal.
  alternative: Traduire de manière interprétative par « intérieur » ou « partie intérieure ».
  rationale: 'L’anthropomorphisme participe à l’ironie : les objets ont prétendument un cœur, mais ne sentent pas qu’ils sont dévorés. Le conserver évite d’aplanir cette tension.'
translation_notes:
  register: Français international moderne, naturel et digne. « Ils sont bien » rend μὲν sans alourdir la phrase ; « on dit » restitue le sujet indéfini de φασίν. « Bestioles qui rampent » est concret et immédiatement compréhensible, tout en évitant le sens taxonomique trop étroit de « reptiles ».
