review_pass:
  verdict: revise
  source_fidelity: La comparaison avec une poutre et l’image volontairement anthropomorphique des « cœurs » sont conservées. Toutefois, « tirée d’une maison » introduit l’idée d’une extraction qui n’est pas explicitement exprimée par τῶν ἐκ τῆς οἰκίας ; « d’une maison » rend plus sobrement le rapport à la maison. Le pluriel « leurs cœurs » reflète καρδίας.
  naturalness: La syntaxe générale est claire, mais « bestioles » est trop familier pour le registre sobre et polémique du passage. « Créatures rampantes de la terre » est plus neutre, digne et suffisamment large. Les pluriels rétablissent aussi une cohérence naturelle avec le sujet « ils ».
  terminology: « Poutre », « cœurs », « dévorent », « vêtements » et « ne sentent rien » sont appropriés. « Créatures rampantes » rend ἑρπετά sans le restreindre au sens taxonomique moderne de « reptiles ».
  issues:
  - severity: medium
    issue: « tirée d’une maison » ajoute une nuance non exprimée
    rationale: Le grec qualifie la poutre comme étant « de la maison » / provenant de la maison, sans préciser qu’elle en a été tirée ou extraite.
  - severity: medium
    issue: « bestioles » est de registre trop familier
    rationale: Bien que compréhensible, ce terme affaiblit le ton digne de la critique et n’est pas idéal en français international moderne.
  - severity: low
    issue: Le singulier « leur cœur » ne reproduit pas le pluriel grec
    rationale: Le singulier collectif est possible en français, mais « leurs cœurs » rend directement καρδίας et soutient l’anthropomorphisme appliqué aux idoles multiples.
