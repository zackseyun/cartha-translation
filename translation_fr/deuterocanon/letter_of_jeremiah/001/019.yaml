revisions:
- from: Ils sont bien comme une poutre tirée d’une maison, mais on dit que leur cœur est léché jusqu’à disparaître[a] ; tandis que les bestioles qui rampent sur le sol les dévorent, eux et leurs vêtements, ils ne sentent rien.
  to: Ils sont bien comme une poutre d’une maison, mais on dit que leurs cœurs sont léchés jusqu’à disparaître[a] ; tandis que les créatures rampantes de la terre les dévorent, eux et leurs vêtements, ils ne sentent rien.
  rationale: La révision supprime une précision non explicite (« tirée »), adapte le registre de « bestioles » et aligne le nombre de « cœurs » sur le grec, sans modifier l’ambiguïté ni la force ironique de l’image.
