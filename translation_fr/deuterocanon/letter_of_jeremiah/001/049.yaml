base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/049.yaml
  text: How then can one fail to perceive that they are not gods[b][a], since they neither save themselves from war nor from calamities?
translation:
  language: fr
  text: Comment donc ne pas se rendre compte qu’ils ne sont pas des dieux[a], puisqu’ils ne se sauvent eux-mêmes ni de la guerre ni des malheurs[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Comment donc n’est-il pas possible de se rendre compte qu’ils ne sont pas des dieux… ? » La négation rhétorique grecque souligne que la conclusion est évidente.'
    reason: lexical_alternative
  - marker: b
    text: Le grec peut aussi signifier « maux », « calamités » ou « épreuves ». Ici, le mot semble désigner des événements nuisibles ou désastreux.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς οὖν
  choice: Comment donc
  rationale: Rend naturellement l’interrogation rhétorique et la valeur déductive de οὖν.
- source_word: οὐκ ἔστιν αἰσθέσθαι
  choice: ne pas se rendre compte
  rationale: Dans cette construction rhétorique, la tournure française exprime que la conclusion devrait être évidente, tout en conservant la négation du grec.
- source_word: ὅτι οὐκ εἰσὶν θεοί
  choice: qu’ils ne sont pas des dieux
  rationale: Traduction directe qui maintient la formulation polémique du texte sans remplacer θεοί par « idoles ».
- source_word: οἳ
  choice: puisqu’ils
  rationale: Le relatif introduit ici le motif qui justifie la conclusion ; « puisqu’ils » explicite sobrement cette valeur causale.
- source_word: οὔτε σώζουσιν ἑαυτοὺς
  choice: ils ne se sauvent eux-mêmes ni
  rationale: Conserve le sens de σώζω et l’ironie selon laquelle ces prétendus dieux sont incapables d’assurer leur propre salut, sans ajouter un verbe modal absent du grec.
- source_word: ἐκ πολέμου
  choice: de la guerre
  rationale: Rend directement le sens général de πόλεμος.
- source_word: οὔτε ἐκ κακῶν
  choice: ni des malheurs
  rationale: Dans ce contexte, κακά désigne vraisemblablement des atteintes, désastres ou situations funestes ; « malheurs » reste naturel et assez large pour préserver cette latitude.
theological_decisions:
- issue: Référent de θεοί dans la polémique contre l’idolâtrie
  choice: Traduire par « dieux » tout en laissant le texte nier leur divinité.
  alternative: Traduire directement par « idoles » ou « êtres divins ».
  rationale: Le grec affirme qu’« ils ne sont pas des dieux ». Garder « dieux » préserve à la fois le lexique et la force théologique de cette négation, sans introduire une paraphrase confessionnelle.
translation_notes:
  register: Français international moderne, clair et digne. La question rhétorique est formulée idiomatiquement ; la répétition négative et l’ironie du grec sont conservées sans archaïsme.
