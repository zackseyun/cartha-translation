  text: Therefore they are to be regarded neither as gods nor to be called gods, since they are unable either to judge a case or to do good to people.
translation:
  language: fr
  text: C’est pourquoi on ne doit ni les considérer comme des dieux ni les appeler des dieux, puisqu’ils sont incapables aussi bien de rendre la justice que de faire du bien aux êtres humains.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅθεν
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conclusion tirée de l’argument précédent, tout en conservant la valeur déductive du grec.
- source_word: νομιεῖσθαι
  choice: les considérer comme
  rationale: Exprime le fait de tenir ou reconnaître quelque chose pour ce qu’il prétend être, sans ajouter de précision étrangère au texte.
- source_word: κλητέον ὑπάρχειν αὐτοὺς θεούς
  choice: les appeler ainsi
  rationale: Rend l’idée qu’il ne convient pas de les désigner comme des dieux. « Ainsi » reprend sans lourdeur « comme des dieux » et maintient le parallélisme.
- source_word: θεούς
  choice: des dieux
  rationale: Équivalent direct, courant et approprié dans cette polémique contre les idoles.
- source_word: οὐ δυνατῶν ὄντων αὐτῶν
  choice: puisqu’ils sont incapables
  rationale: Le génitif absolu donne la raison de la conclusion; « puisque » en conserve clairement la valeur causale.
- source_word: κρίσιν κρῖναι
  choice: rendre la justice
  rationale: Cette expression française naturelle restitue la tournure judiciaire intensive du grec sans calque maladroit.
- source_word: εὖ ποιεῖν
  choice: faire du bien
  rationale: Rend directement l’idée de bien agir envers quelqu’un ou de lui procurer un bienfait.
- source_word: ἀνθρώποις
  choice: aux êtres humains
  rationale: Désigne l’humanité de façon générique et inclusive, avec une formulation claire en français international.
theological_decisions:
- issue: Double négation du statut divin des idoles et de leur désignation comme dieux
  choice: on ne doit ni les considérer comme des dieux ni les appeler ainsi
  alternative: on ne doit ni penser qu’ils sont des dieux ni leur donner le nom de dieux
  rationale: 'La formulation conserve les deux volets de la polémique: refus de leur reconnaître le statut de dieux et refus de les désigner comme tels, sans développer une explication métaphysique absente du texte.'
- issue: Portée de κρίσιν κρῖναι
  choice: rendre la justice
  alternative: prononcer un jugement
  rationale: Le contexte attribue aux prétendus dieux une incapacité à exercer une fonction judiciaire. « Rendre la justice » préserve ce sens juridique tout en restant naturel et sans préciser indûment la nature de l’affaire.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la conclusion logique, la double négation et la symétrie entre l’incapacité à rendre la justice et celle à faire du bien.
