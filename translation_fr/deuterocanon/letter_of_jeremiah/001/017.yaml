base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/017.yaml
  text: And just as the courts are secured around one who has wronged a king[a], as one being led away to death, so the priests fortify their houses with doors and locks and bars[b], so that they may not be plundered by robbers.
translation:
  language: fr
  text: De même qu’on met les cours sous bonne garde autour de quelqu’un qui a fait du tort à un roi[a], comme s’il était emmené à la mort, de même les prêtres fortifient leurs maisons[b] avec des portes, des serrures et des barres, afin qu’elles ne soient pas pillées par des brigands.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les cours sont closes autour de quelqu’un qui a offensé le roi ». Le début de la comparaison est syntaxiquement difficile; l’image est celle d’un homme conduit à la mort et placé sous haute surveillance.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « leurs maisons »; dans le contexte, il s’agit des maisons ou édifices cultuels des idoles, que les prêtres protègent.
    reason: cultural_note
lexical_decisions:
- source_word: περιτετράχηλαι εἰσὶν αἱ αὐλαί
  choice: les cours sont fermées autour
  rationale: La tournure grecque est difficile. « Cours » rend αὐλαί et « sont fermées autour » conserve l’idée d’un espace clos et étroitement sécurisé sans préciser indûment l’architecture.
- source_word: τινὶ ἠδικηκότι βασιλέα
  choice: celui qui a fait du tort à un roi
  rationale: ἀδικέω exprime le fait de commettre une injustice ou de causer du tort. Cette formulation garde la valeur juridique sans transformer explicitement l’homme en condamné.
- source_word: ὡς ἐπὶ θάνατον ἀπηγμένῳ
  choice: tel un homme conduit à la mort
  rationale: La formulation préserve l’image d’une personne emmenée sous garde vers la mort, sans ajouter le terme plus interprétatif « exécution ».
- source_word: ὀχυροῦσιν
  choice: fortifient
  rationale: Le verbe signifie rendre fort ou mettre en défense. « Fortifient » maintient la force satirique du passage.
- source_word: τοὺς οἴκους αὐτῶν
  choice: les maisons de leurs idoles
  rationale: Le pronom grec peut être ambigu en français. L’explicitation du référent cultuel évite que « leurs maisons » soit compris comme les habitations personnelles des prêtres, tout en conservant le mot concret « maisons ».
- source_word: θυρώμασιν τε καὶ κλείθροις καὶ μοχλοῖς
  choice: avec des portes, des serrures et des barres
  rationale: Cette série claire en français moderne reproduit l’accumulation des trois dispositifs matériels de protection.
- source_word: συληθῶσι
  choice: soient pillées
  rationale: συλάω désigne le fait de dépouiller ou de piller; « piller » convient au vol des biens conservés dans ces édifices.
- source_word: λῃστῶν
  choice: brigands
  rationale: λῃσταί peut désigner des voleurs violents ou des bandits. « Brigands » restitue mieux cette nuance que le terme général « voleurs ».
theological_decisions:
- issue: Référent de « leurs maisons » dans la polémique contre les idoles
  choice: les maisons de leurs idoles
  alternative: leurs maisons / leurs temples
  rationale: Le contexte indique les édifices où se trouvent les idoles et leurs biens. L’explicitation empêche une lecture erronée visant les domiciles des prêtres, sans imposer le terme spécialisé « temples ».
translation_notes:
  register: Français international moderne, digne et accessible. La structure comparative et l’accumulation des moyens de fermeture sont maintenues. Le choix « maisons de leurs idoles » clarifie un pronom qui serait trompeur en français, tandis que la note conserve la formulation littérale.
