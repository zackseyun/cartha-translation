  text: Likewise[a], when lightning appears, it is clearly seen; and in the same way the wind blows in every land.
translation:
  language: fr
  text: De même, lorsque l’éclair apparaît, il est clairement visible ; il en va de même du vent[a], qui souffle dans toutes les régions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec πνεῦμα peut aussi signifier « esprit » ou « souffle » ; ici, le contexte des phénomènes naturels et le verbe « souffle » favorisent le sens « vent ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως
  choice: De même
  rationale: Cette expression concise conserve la valeur comparative qui relie le verset aux exemples précédents.
- source_word: ἀστραπή
  choice: l’éclair
  rationale: Le nom grec désigne l’éclair ou un éclair ; le singulier défini convient à l’énoncé général en français.
- source_word: ὅταν ἐπιφάνῃ
  choice: lorsque l’éclair apparaît
  rationale: Le verbe exprime ici le fait d’apparaître ou de devenir visible. « Apparaît » reste proche du grec tout en étant naturel.
- source_word: εὔοπτός ἐστιν
  choice: il est clairement visible
  rationale: εὔοπτος signifie « facile à voir, bien visible ». Cette formulation rend nettement l’idée sans lourdeur.
- source_word: τὸ δʼ αὐτό
  choice: il en va de même
  rationale: Cette tournure française naturelle restitue l’idiome grec, littéralement « la même chose », et poursuit la comparaison.
- source_word: πνεῦμα
  choice: vent
  rationale: Dans cette série de phénomènes naturels, avec le verbe πνεῖ (« souffle »), le sens météorologique est nettement favorisé.
- source_word: ἐν πάσῃ χώρᾳ
  choice: en toute région
  rationale: χώρα peut désigner un pays, une contrée ou une région. « En toute région » conserve la portée générale sans suggérer seulement des États modernes.
- source_word: πνεῖ
  choice: souffle
  rationale: Le présent exprime une vérité générale, et « souffler » est le verbe français usuel pour le vent.
theological_decisions:
- issue: Sens de πνεῦμα, terme susceptible d’une lecture théologique
  choice: vent
  alternative: esprit ou souffle
  rationale: Le contexte porte sur des phénomènes naturels observables, et l’association avec πνεῖ (« souffle ») ainsi qu’avec « en toute région » favorise fortement « vent ». Ce choix évite d’introduire une portée pneumatologique étrangère au contexte immédiat, tandis que la note conserve l’éventail lexical.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste proche de la syntaxe comparative du grec, tout en employant l’idiome naturel « il en va de même ». Le marqueur est placé après « vent », le mot auquel la note se rapporte.
