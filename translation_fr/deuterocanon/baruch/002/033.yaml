base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/033.yaml
  text: And they will turn away from their stiff neck and from their evil deeds[a], because they will remember the way of their fathers who sinned before the Lord.
translation:
  language: fr
  text: Ils se détourneront de leur dos raide[a] et de leurs mauvaises actions, car ils se souviendront de la voie de leurs pères, qui ont péché devant le Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leur dos dur ». L’image évoque leur obstination; le grec dit bien « dos », et non « cou ».'
    reason: Signaler l’image inhabituelle du grec et son sens métaphorique sans la remplacer dans le texte.
lexical_decisions:
- source_word: ἀποστρέψουσιν
  choice: ils se détourneront
  rationale: Le futur actif, construit avec ἀπό, exprime ici l’abandon d’une attitude et d’actions antérieures.
- source_word: ἀπὸ τοῦ νώτου αὐτῶν τοῦ σκληροῦ
  choice: de leur dos raide
  rationale: νώτου désigne littéralement le « dos », non le « cou ». « Dos raide » conserve cette image corporelle inhabituelle tout en rendant σκληροῦ de manière intelligible.
- source_word: πονηρῶν πραγμάτων αὐτῶν
  choice: de leurs mauvaises actions
  rationale: Dans ce contexte, πράγματα renvoie à des actes ou à des pratiques; « mauvaises actions » est naturel et garde la portée morale de πονηρῶν.
- source_word: μνησθήσονται
  choice: ils se souviendront
  rationale: Ce futur de μιμνῄσκομαι signifie directement « se souvenir ».
- source_word: τῆς ὁδοῦ
  choice: de la voie
  rationale: « Voie » préserve la métaphore biblique de ὁδός, qui désigne ici une manière de vivre.
- source_word: πατέρων αὐτῶν
  choice: de leurs pères
  rationale: Le grec emploie le masculin pluriel et évoque les pères des générations précédentes; la traduction conserve cette formulation.
- source_word: τῶν ἁμαρτόντων
  choice: qui ont péché
  rationale: La proposition relative rend clairement et naturellement le participe aoriste.
- source_word: ἔναντι Κυρίου
  choice: devant le Seigneur
  rationale: ἔναντι signifie « devant » ou « en présence de ». Cette traduction évite de préciser davantage que le grec la nature du rapport au Seigneur.
theological_decisions:
- issue: Valeur métaphorique de « leur dos raide »
  choice: Conserver l’image corporelle du dos.
  alternative: « leur obstination » ou « leur cou raide »
  rationale: Le texte grec porte νώτου, « dos », et non le terme habituel pour « cou ». Garder cette image respecte la particularité du témoin grec sans réduire la métaphore à une abstraction.
- issue: Traduction de πατέρων αὐτῶν
  choice: « leurs pères »
  alternative: « leurs ancêtres »
  rationale: La formulation masculine du texte source est conservée et désigne les pères des générations antérieures dont la conduite pécheresse est rappelée.
- issue: Traduction de Κυρίου
  choice: « le Seigneur »
  alternative: « l’Éternel »
  rationale: Le texte source grec emploie Κυρίου. « Le Seigneur » le traduit directement sans rétroversion conjecturale vers un nom divin hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec; « dos raide » est volontairement inhabituel afin de préserver son image particulière, explicitée par la note.
