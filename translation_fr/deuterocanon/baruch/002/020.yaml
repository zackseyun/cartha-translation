translation:
  language: fr
  text: parce que tu as fait venir sur nous ta fureur et ta colère, comme tu avais parlé par la main de tes serviteurs, les prophètes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus idiomatique : « par l’intermédiaire de tes serviteurs, les prophètes ». Le grec dit littéralement : « par la main de ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνῆκας
  choice: tu as fait venir sur nous
  rationale: Cette formulation rend le mouvement causatif du verbe et son complément εἰς ἡμᾶς sans préciser davantage la forme du jugement.
- source_word: θυμόν
  choice: fureur
  rationale: « Fureur » exprime l’intensité de θυμός tout en permettant de conserver le doublet avec ὀργή.
- source_word: ὀργήν
  choice: colère
  rationale: « Colère » est le terme français courant et soutenu qui convient ici, distinct de « fureur ».
- source_word: καθάπερ
  choice: comme
  rationale: « Comme » marque naturellement la correspondance entre le jugement subi et l’annonce prophétique antérieure.
- source_word: ἐλάλησας
  choice: tu l’avais annoncé
  rationale: Dans ce contexte prophétique, « annoncer » exprime naturellement la parole préalable de Dieu; le plus-que-parfait explicite son antériorité par rapport au jugement évoqué.
- source_word: ἐν χειρί
  choice: par la main de
  rationale: La locution conserve l’image biblique de la main comme moyen ou agent de transmission.
- source_word: παίδων
  choice: serviteurs
  rationale: Dans l’expression désignant les prophètes mandatés par Dieu, παῖδες signifie naturellement « serviteurs » plutôt que « enfants ».
- source_word: προφητῶν
  choice: les prophètes
  rationale: Le groupe en apposition identifie les serviteurs comme étant les prophètes.
theological_decisions:
- issue: Doublet θυμός et ὀργή décrivant le jugement divin
  choice: « ta fureur et ta colère »
  alternative: « ta colère et ton courroux »
  rationale: Le choix maintient deux termes distincts et leur intensité cumulative, sans réduire la formulation à une seule notion.
- issue: Médiation prophétique exprimée par ἐν χειρί
  choice: « par la main de tes serviteurs, les prophètes »
  alternative: « par l’intermédiaire de tes serviteurs, les prophètes »
  rationale: Le texte principal préserve l’image grecque et la texture scripturaire, tandis que la note en donne le sens idiomatique.
translation_notes:
  register: Français international moderne, digne et accessible. Le doublet « fureur et colère » conserve la force rhétorique du grec; l’idiome « par la main de » est maintenu dans le texte et éclairé en note.
