base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/019.yaml
  text: for it is not on the basis of the righteous deeds of our fathers and of our kings that we lay our plea for mercy before you[a], O Lord our God[b],
translation:
  language: fr
  text: car ce n’est pas en nous appuyant sur les actes justes[a] de nos pères et de nos rois que nous déposons devant toi notre demande de miséricorde[b], Seigneur notre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Actes justes » peut aussi se traduire par « œuvres de justice » ; moins probablement ici, « ordonnances » ou « prescriptions ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la miséricorde ». Le sens est ici celui d’une demande adressée à Dieu pour obtenir sa miséricorde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιώματα
  choice: actes justes
  rationale: Dans cette prière pénitentielle, le complément « de nos pères et de nos rois » désigne plus naturellement leurs actes de justice que des prescriptions légales. La formulation conserve toutefois l’idée d’une justice susceptible de servir de fondement à la requête.
- source_word: καταβάλλομεν
  choice: nous déposons
  rationale: Le verbe garde l’image concrète de quelque chose que l’on place devant Dieu, tout en convenant au registre d’une supplication.
- source_word: τὸν ἔλεον
  choice: notre demande de miséricorde
  rationale: Le grec dit littéralement « la miséricorde », mais le contexte montre que les priants sollicitent la miséricorde de Dieu, plutôt qu’ils ne la lui offrent. Cette explicitation rend l’idiome naturel en français.
- source_word: κατὰ πρόσωπόν σου
  choice: devant toi
  rationale: Cette expression, littéralement « devant ta face », est un idiome signifiant « en ta présence ». « Devant toi » en préserve la relation directe sans produire une tournure artificielle.
- source_word: Κύριε ὁ θεὸς ἡμῶν
  choice: Seigneur notre Dieu
  rationale: Cette forme d’adresse directe est naturelle, digne et fidèle au vocatif grec.
theological_decisions:
- issue: La prière se fonde-t-elle sur les mérites des ancêtres et des rois ?
  choice: Les priants déclarent que leur demande de miséricorde ne repose pas sur les actes justes de leurs pères et de leurs rois.
  alternative: δικαιώματα pourrait être compris plus formellement comme les ordonnances ou les prescriptions associées à leurs ancêtres et à leurs rois.
  rationale: Le contexte pénitentiel favorise le sens d’actes justes pouvant être invoqués comme fondement de la requête, sans transformer cette confession en formulation doctrinale plus générale que le verset.
translation_notes:
  register: Français international moderne, clair et solennel. « Nous déposons devant toi » conserve l’image de la requête placée en présence de Dieu, tandis que « en nous appuyant sur » exprime naturellement la valeur fondatrice de ἐπὶ.
