  text: so that all the earth may know that you[a], Lord, are our God, because your name has been called upon Israel and upon his offspring.
translation:
  language: fr
  text: afin que toute la terre sache que c’est toi, Seigneur, qui es notre Dieu, car ton nom a été invoqué sur Israël et sur sa descendance.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon le sens de l’idiome : « Israël porte ton nom » ou « Israël est appelé de ton nom ». L’expression grecque peut évoquer l’invocation du nom de Dieu, mais aussi l’appartenance d’Israël à Dieu et son identification publique à lui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα γνῷ
  choice: afin que… sache
  rationale: La construction ἵνα avec le subjonctif exprime ici le but ou le résultat. « Afin que… sache » en conserve clairement la force.
- source_word: πᾶσα ἡ γῆ
  choice: toute la terre
  rationale: γῆ peut désigner la terre ou un pays, mais la portée universelle de πᾶσα favorise ici « toute la terre ».
- source_word: σὺ Κύριος ὁ θεὸς ἡμῶν
  choice: c’est toi, Seigneur, qui es notre Dieu
  rationale: Cette tournure française naturelle met en relief le pronom emphatique σύ et conserve le titre Κύριος ainsi que la confession « notre Dieu ».
- source_word: τὸ ὄνομά σου ἐπεκλήθη ἐπὶ
  choice: ton nom a été invoqué sur
  rationale: Cette formulation reste proche de l’idiome grec et préserve ses nuances d’invocation, d’appartenance et d’identification, précisées en note.
- source_word: Ἰσραήλ
  choice: Israël
  rationale: Forme française usuelle du nom propre.
- source_word: τὸ γένος αὐτοῦ
  choice: sa descendance
  rationale: γένος désigne ici la lignée ou la postérité. Le singulier « sa » maintient le renvoi grammatical naturel à Israël.
theological_decisions:
- issue: L’idiome biblique du nom divin « invoqué sur » un peuple
  choice: ton nom a été invoqué sur Israël
  alternative: Israël porte ton nom / Israël est appelé de ton nom
  rationale: La traduction retenue conserve la forme et la tension de l’expression grecque, qui peut évoquer à la fois l’invocation du nom de Dieu et l’appartenance publique d’Israël à Dieu, sans réduire le sens à une seule interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe met en relief « toi » sans lourdeur, et la note explicite l’idiome biblique tout en maintenant son ambiguïté réelle.
