base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/009.yaml
  text: And the Lord kept watch over the calamities and brought them upon us[b][a], because the Lord is righteous in all his works that he commanded us.
translation:
  language: fr
  text: Le Seigneur a veillé sur les calamités[a] et les a fait venir sur nous, car le Seigneur est juste[b] dans toutes ses œuvres qu’il nous a commandées[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les maux » ou « les désastres ». Le grec désigne ici vraisemblablement les calamités du jugement, non le mal moral en lui-même.
    reason: lexical_alternative
  - marker: b
    text: Ou « droit ».
    reason: lexical_alternative
  - marker: c
    text: La formulation grecque, littéralement « toutes ses œuvres qu’il nous a commandées », est condensée; elle peut aussi se comprendre comme « toutes les œuvres qu’il nous a ordonné d’accomplir ».
    reason: source_ambiguity
lexical_decisions:
- source_word: ἐγρηγόρησεν
  choice: a veillé sur
  rationale: Le verbe évoque le fait de rester éveillé et vigilant. « A veillé sur » conserve cette image et, dans le contexte, exprime la vigilance active du Seigneur quant à l’accomplissement du jugement.
- source_word: ἐπὶ τοῖς κακοῖς
  choice: sur les calamités
  rationale: Ici, κακά désigne les malheurs ou désastres du jugement que le Seigneur a fait venir, et non le mal moral pris abstraitement.
- source_word: ἐπήγαγε
  choice: les a fait venir sur nous
  rationale: Cette formulation rend explicitement le mouvement exprimé par le verbe et par ἐφ᾽ ἡμᾶς, tout en restant naturelle en français.
- source_word: δίκαιος
  choice: juste
  rationale: Dans ce contexte de jugement divin, « juste » exprime clairement la rectitude du Seigneur et correspond au français biblique courant.
- source_word: ἐπὶ πάντα τὰ ἔργα αὐτοῦ
  choice: dans toutes ses œuvres
  rationale: La préposition indique ici le domaine dans lequel le Seigneur est déclaré juste; « dans toutes ses œuvres » conserve aussi le possessif grec.
- source_word: ἃ ἐνετείλατο ἡμῖν
  choice: qu’il nous a commandées
  rationale: La proposition relative grecque se rattache grammaticalement aux « œuvres ». La traduction en maintient la formulation condensée sans préciser à la place du texte la relation exacte entre les œuvres de Dieu et ce qu’il a commandé au peuple.
theological_decisions:
- issue: Sens de τὰ κακά lorsque le Seigneur les fait venir
  choice: calamités
  alternative: maux, désastres
  rationale: Le contexte parle de jugements désastreux infligés au peuple, non d’un mal moral accompli par Dieu. La traduction conserve néanmoins l’affirmation forte selon laquelle le Seigneur les a activement fait venir.
- issue: Traduction de δίκαιος appliqué au Seigneur
  choice: juste
  alternative: droit
  rationale: « Juste » est naturel en français moderne et convient à l’affirmation de la rectitude divine au sein du jugement.
- issue: Relation entre « ses œuvres » et « qu’il nous a commandées »
  choice: conserver la construction condensée
  alternative: les œuvres qu’il nous a ordonné d’accomplir
  rationale: Le grec présente ces œuvres comme « ses œuvres » tout en disant qu’il les a commandées au peuple. Une reformulation explicative résoudrait une tension que le texte source laisse subsister.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve l’image de la vigilance divine ainsi que la construction inhabituelle de la dernière proposition; une note signale l’ambiguïté sans la résoudre silencieusement.
