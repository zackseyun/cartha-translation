  text: For I knew that they would certainly not listen to me[a], because they are a stiff-necked people; but in the land of their exile they will return to their heart,
translation:
  language: fr
  text: Car je savais qu’ils ne m’écouteraient certainement pas, puisque c’est un peuple à la nuque raide. Mais dans le pays de leur exil, ils reviendront à leur cœur[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils reviendront à leur cœur ». On peut aussi comprendre : « ils prendront cela à cœur » ou « ils reviendront intérieurement ».'
    reason: L’expression grecque, d’allure sémitique, est inhabituelle en français et peut décrire une prise de conscience ou un retournement intérieur.
lexical_decisions:
- source_word: ἔγνων
  choice: je savais
  rationale: L’aoriste exprime ici la connaissance préalable de Dieu; l’imparfait français s’intègre naturellement à la perspective passée introduite par le contexte.
- source_word: οὐ μὴ ἀκούσωσίν μου
  choice: ils ne m’écouteraient certainement pas
  rationale: La tournure οὐ μή avec le subjonctif porte une négation emphatique. « Écouter » conserve le verbe grec tout en permettant le sens de prêter attention ou d’obéir.
- source_word: λαὸς σκληροτράχηλος
  choice: un peuple à la nuque raide
  rationale: Cette formulation conserve l’image biblique concrète du composé grec sans la réduire au seul sens interprétatif d’« obstiné ».
- source_word: ἐπιστρέψουσιν ἐπὶ καρδίαν αὐτῶν
  choice: ils reviendront à leur cœur
  rationale: La traduction maintient l’expression sémitisante et son ambiguïté entre retour intérieur, prise de conscience et repentance, sans expliciter davantage que le grec.
- source_word: ἐν γῇ ἀποικισμοῦ αὐτῶν
  choice: dans le pays de leur exil
  rationale: « Exil » exprime clairement l’éloignement forcé du pays d’origine que désigne ἀποικισμός, dans un français naturel.
theological_decisions:
- issue: Portée de l’expression « revenir à leur cœur »
  choice: Conserver dans le texte l’image du retour au cœur et en signaler les sens possibles en note.
  alternative: « ils prendront cela à cœur » ou « ils reviendront intérieurement »
  rationale: Le grec évoque un retournement intérieur pouvant impliquer la repentance, mais n’emploie pas ici un terme qui imposerait de traduire explicitement par « se repentir ».
- issue: Articulation entre le refus d’écouter et le futur retournement
  choice: Employer « Mais » pour rendre le contraste contextuel porté par καί.
  alternative: « et »
  rationale: Le sens de base est coordonnant, mais le passage du refus obstiné au retournement en exil crée un contraste réel que le français exprime naturellement par « mais ».
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore biblique « à la nuque raide » et l’expression volontairement singulière « revenir à leur cœur » sont conservées pour préserver la texture et l’ambiguïté du grec.
