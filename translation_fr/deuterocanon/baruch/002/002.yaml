translation:
  language: fr
  text: 'Sous tout le ciel, rien de semblable à ce qu’il a fait à Jérusalem ne s’était produit, conformément à ce qui est écrit dans la loi de Moïse :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἐποιήθη
  choice: Rien de pareil ne s’était produit
  rationale: Le passif grec signifie littéralement « cela n’avait pas été fait ». En français, cette tournure naturelle exprime qu’un tel événement était sans précédent, tout en évitant un passif lourd.
- source_word: ὑποκάτω παντὸς τοῦ οὐρανοῦ
  choice: sous le ciel entier
  rationale: Rend fidèlement l’expression universelle grecque dans un registre biblique clair et actuel.
- source_word: καθὰ ἐποίησεν
  choice: à ce qu’il a fait
  rationale: Conserve le verbe actif et le sujet masculin implicite du grec, sans préciser son référent ni transformer l’expression en passif.
- source_word: κατὰ τὰ γεγραμμένα
  choice: conformément à ce qui est écrit
  rationale: Exprime la conformité aux prescriptions écrites, avec une formulation française naturelle.
- source_word: ἐν τῷ νόμῳ Μωυσῆ
  choice: dans la loi de Moïse
  rationale: Équivalent direct et usuel de l’expression grecque.
theological_decisions:
- issue: Référent du sujet implicite de ἐποίησεν
  choice: Maintenir « il » sans nommer le sujet
  alternative: Expliciter « Dieu » ou reprendre un autre antécédent
  rationale: Le verset grec ne nomme pas ici l’agent. L’expliciter résoudrait une ambiguïté que le texte laisse dépendre du contexte.
- issue: Lien entre la catastrophe de Jérusalem et la loi de Moïse
  choice: « conformément à ce qui est écrit »
  alternative: « comme il est écrit »
  rationale: La préposition κατά marque ici la correspondance entre les événements et les avertissements consignés dans la loi, sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Le deux-points final signale que la phrase se poursuit au verset suivant. « Sous le ciel entier » conserve la portée rhétorique et biblique de l’original.
