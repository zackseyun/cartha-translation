base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/025.yaml
  text: And behold[a], they have been exposed to the heat of the day and to the frost of the night; and they died in grievous sufferings, in famine and by the sword and in exile.
translation:
  language: fr
  text: Et voici qu’ils ont été jetés dehors, exposés à la chaleur du jour et au gel de la nuit. Ils sont morts au milieu de terribles souffrances, par la famine, par l’épée et dans la déportation.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’exil », « dans le bannissement » ou « dans l’éloignement forcé »; le grec désigne littéralement le fait d’être envoyé au loin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδού
  choice: voici
  rationale: « Voici » conserve la fonction d’appel à l’attention de l’interjection grecque dans un registre biblique digne mais encore naturel en français moderne.
- source_word: ἐξεριμμένα
  choice: ont été jetés dehors, exposés
  rationale: Le participe passif exprime d’abord l’action de jeter dehors; l’ajout appositif « exposés » rend clairement la conséquence indiquée par les datifs suivants sans supposer explicitement qu’il s’agit de cadavres.
- source_word: τῷ καύματι τῆς ἡμέρας
  choice: à la chaleur du jour
  rationale: Traduction directe qui garde le parallélisme temporel et l’idée d’exposition.
- source_word: τῷ παγετῷ τῆς νυκτός
  choice: au gel de la nuit
  rationale: « Gel » restitue le sens concret de παγετός et forme un contraste net avec la chaleur du jour.
- source_word: ἐν πόνοις πονηροῖς
  choice: au milieu de terribles souffrances
  rationale: Cette formulation française naturelle exprime l’intensité négative de πονηροῖς tout en conservant le pluriel de πόνοις.
- source_word: ἐν λιμῷ
  choice: par la famine
  rationale: Dans une énumération des causes et circonstances de leur mort, « par » est idiomatique et conserve la famine comme calamité collective.
- source_word: ἐν ῥομφαίᾳ
  choice: par l’épée
  rationale: L’expression française garde l’image concrète de l’arme et son sens conventionnel de mort violente.
- source_word: ἐν ἀποστολῇ
  choice: dans la déportation
  rationale: Dans ce contexte de jugement et d’éloignement forcé, « déportation » reste plus près de l’idée littérale d’un envoi au loin que « exil », tout en étant intelligible en français moderne.
theological_decisions:
- issue: Sens de ἀποστολή dans un contexte de jugement
  choice: dans la déportation
  alternative: dans l’exil; dans le bannissement; dans l’éloignement forcé
  rationale: « Déportation » préserve l’idée d’un déplacement imposé sans réduire le mot à la seule réalité théologique de l’exil. La note signale néanmoins les autres lectures contextuellement possibles.
translation_notes:
  register: Français international moderne, courant et digne. « Voici » maintient la solennité de l’appel à l’attention sans employer l’archaïsant « voici que » seul comme calque. L’image concrète du gel et de l’épée est conservée; la juxtaposition « jetés dehors, exposés » rend à la fois l’action du participe et sa portée contextuelle.
