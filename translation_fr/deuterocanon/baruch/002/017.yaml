  verdict: revise
  source_fidelity: La structure contrastive, l’Hadès et les deux impératifs sont bien rendus. Toutefois, « du plus profond d’eux-mêmes » atténue l’image concrète de σπλάγχνα (« entrailles, parties intérieures »), et « reconnaîtront sa justice » transforme plus nettement que nécessaire le double objet δόξαν καὶ δικαίωμα donné au Seigneur.
  naturalness: Le français proposé est globalement naturel et de registre biblique moderne. « Rendre gloire et justice au Seigneur » est à la fois idiomatique et plus près du parallélisme compact du grec.
  terminology: « Hadès », « souffle », « gloire » et « Seigneur » conviennent. « Justice » préserve ici l’ambiguïté de δικαίωμα mieux que le possessif interprétatif dans « sa justice » ; une note peut indiquer « droiture » comme possibilité.
  issues:
