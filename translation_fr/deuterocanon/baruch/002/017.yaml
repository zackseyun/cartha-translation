    issue: σπλάγχνα est rendu de manière trop abstraite.
    rationale: « Du plus profond d’eux-mêmes » est naturel, mais ne conserve pas suffisamment le sens corporel de « leurs entrailles / parties intérieures » dans l’image grecque du souffle retiré.
  - severity: medium
    issue: Le rendu de δικαίωμα explicite une relation possessive et un acte de reconnaissance absents du grec.
    rationale: « Reconnaîtront sa justice » interprète δώσουσιν comme une reconnaissance et δικαίωμα comme la justice propre au Seigneur. Le grec maintient un double objet donné au Seigneur ; « rendront gloire et justice au Seigneur » le préserve plus directement.
