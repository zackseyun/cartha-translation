base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/017.yaml
  text: 'Open your eyes and see: it is not the dead in Hades, whose breath has been taken from their inward parts, who will give glory and righteousness to the Lord;'
translation:
  language: fr
  text: 'Ouvre les yeux et vois : ce ne sont pas les morts dans l’Hadès, dont le souffle a été retiré de leurs entrailles[a], qui rendront gloire et justice au Seigneur[b] ;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dont l’esprit a été retiré de leurs entrailles ».
    reason: πνεῦμα peut désigner le « souffle » ou l’« esprit » ; le sens de souffle vital convient au contexte de la mort.
  - marker: b
    text: Ou « qui rendront gloire et droiture au Seigneur ».
    reason: δικαίωμα peut évoquer la justice, la droiture ou ce qui est juste.
lexical_decisions:
- source_word: ἄνοιξον ὀφθαλμούς σου καὶ ἴδε
  choice: Ouvre les yeux et vois
  rationale: Les deux impératifs sont conservés simplement et directement dans un français moderne.
- source_word: οὐχ οἱ τεθνηκότες ἐν τῷ ᾅδῃ
  choice: ce ne sont pas les morts dans l’Hadès
  rationale: La tournure présentative rend clairement l’emphase négative du grec, tandis que « l’Hadès » préserve la désignation grecque du séjour des morts.
- source_word: ὧν ἐλήμφθη τὸ πνεῦμα αὐτῶν
  choice: ceux dont le souffle a été retiré
  rationale: Dans ce contexte de mort, πνεῦμα évoque naturellement le souffle vital, sans exclure le sens possible d’« esprit », signalé en note.
- source_word: ἀπὸ τῶν σπλάγχνων αὐτῶν
  choice: du plus profond d’eux-mêmes
  rationale: Cette formulation française naturelle garde l’idée des parties intérieures exprimée par σπλάγχνα sans employer l’anatomique et peu idiomatique « entrailles ».
- source_word: δώσουσιν δόξαν
  choice: rendront gloire
  rationale: « Rendre gloire » est l’expression française biblique naturelle correspondant à l’idée de donner la gloire au Seigneur.
- source_word: δικαίωμα τῷ κυρίῳ
  choice: reconnaîtront sa justice
  rationale: δικαίωμα désigne ici vraisemblablement la rectitude ou la justice reconnue au Seigneur. Le verbe « reconnaîtront », partagé avec « rendront », explicite sobrement la relation idiomatique que le français ne peut reproduire naturellement par « donner justice ».
theological_decisions:
- issue: Sens de πνεῦμα dans le contexte de la mort
  choice: souffle
  alternative: esprit
  rationale: Le retrait du souffle vital convient particulièrement à l’évocation des morts, mais l’ambivalence lexicale et anthropologique de πνεῦμα est maintenue en note.
- issue: Sens de δικαίωμα appliqué au Seigneur
  choice: reconnaîtront sa justice
  alternative: lui rendront ce qui est juste
  rationale: Le texte semble parler de la reconnaissance de la rectitude ou de la justice du Seigneur. La traduction choisie évite le calque obscur « donner la justice » tout en conservant une autre lecture possible en note.
translation_notes:
  register: Français international moderne, digne et accessible. La structure contrastive et l’imagerie de la mort sont conservées ; les notes maintiennent les principales ambiguïtés lexicales du grec.
