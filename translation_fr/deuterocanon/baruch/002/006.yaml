base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/006.yaml
  text: To the Lord our God belongs righteousness[a], but to us and to our fathers belongs shame of face[b], as it is this day.
translation:
  language: fr
  text: Au Seigneur notre Dieu appartient la justice[a] ; à nous, en revanche, ainsi qu’à nos ancêtres, la honte au visage[b], comme c’est le cas aujourd’hui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « la droiture ». Le mot grec peut désigner la rectitude morale aussi bien que la justice : Dieu est reconnu comme étant dans son droit.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement « la honte des visages », expression qui évoque une humiliation visible et publique.
    reason: cultural_note
lexical_decisions:
- source_word: Τῷ κυρίῳ θεῷ ἡμῶν
  choice: Au Seigneur notre Dieu appartient
  rationale: 'Le datif grec exprime ici l’attribution. Cette tournure française préserve le parallélisme implicite : la justice revient à Dieu, tandis que la honte revient au peuple.'
- source_word: δικαιοσύνη
  choice: la justice
  rationale: En français biblique moderne, « justice » exprime à la fois la rectitude de Dieu et le fait qu’il est dans son droit, sans limiter le terme à la seule justice punitive.
- source_word: ἡμῖν δὲ καὶ τοῖς πατράσιν ἡμῶν
  choice: à nous, en revanche, ainsi qu’à nos ancêtres
  rationale: « En revanche » marque clairement le contraste introduit par δέ. « Ancêtres » rend naturellement πατέρες dans ce contexte collectif et historique.
- source_word: ἡ αἰσχύνη τῶν προσώπων
  choice: la honte au visage
  rationale: Cette formulation conserve l’image concrète et sémitisante du grec tout en restant intelligible en français ; elle évoque une humiliation manifeste et publique.
- source_word: ὡς ἡ ἡμέρα αὕτη
  choice: comme c’est le cas aujourd’hui
  rationale: La formule désigne la situation présente comme preuve visible de la confession. Cette traduction en restitue le sens idiomatique sans surinterprétation.
theological_decisions:
- issue: Sens de δικαιοσύνη appliqué à Dieu
  choice: La justice et la rectitude de Dieu sont opposées à la honte du peuple et de ses ancêtres.
  alternative: La justice judiciaire de Dieu est opposée à la disgrâce d’Israël.
  rationale: '« Justice » garde l’étendue du terme grec : Dieu est juste et se trouve dans son droit. La traduction évite de réduire l’énoncé à son seul jugement punitif.'
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme confessionnel du grec est maintenu, de même que l’image concrète de la honte au visage ; « ancêtres » est préféré à « pères » pour éviter une ambiguïté familiale en français courant.
