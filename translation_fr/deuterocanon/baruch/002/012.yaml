base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/012.yaml
  text: We have sinned[a], we have acted ungodly, we have done wrong, O Lord our God, against all your ordinances.
translation:
  language: fr
  text: Nous avons péché, nous avons agi en impies, nous avons agi injustement, Seigneur, notre Dieu, contre toutes tes prescriptions[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à l’égard de toutes tes justes décisions ». La préposition grecque peut indiquer une opposition ou, plus largement, un rapport aux décrets et aux normes établis par Dieu.'
    reason: Ambiguïté lexicale de ἐπί et amplitude sémantique de δικαιώματα.
lexical_decisions:
- source_word: ἡμάρτομεν
  choice: Nous avons péché
  rationale: Le passé composé rend naturellement en français la confession portée par l’aoriste, sans perdre la force de l’aveu.
- source_word: ἠσεβήσαμεν
  choice: nous avons agi avec impiété
  rationale: Cette formulation conserve le caractère verbal du grec et désigne une conduite irrévérencieuse envers Dieu, dans un registre digne et compréhensible.
- source_word: ἠδικήσαμεν
  choice: nous avons fait le mal
  rationale: Le verbe peut signifier faire le mal, commettre une injustice ou léser quelqu’un. En l’absence de complément personnel, cette formulation garde une portée générale.
- source_word: Κύριε ὁ θεὸς ἡμῶν
  choice: Seigneur notre Dieu
  rationale: Rend directement le vocatif et le possessif dans une formule française naturelle de prière.
- source_word: ἐπὶ πᾶσιν τοῖς δικαιώμασίν σου
  choice: contre toutes tes prescriptions
  rationale: Dans cette confession, « contre » exprime naturellement la transgression, tandis que « prescriptions » préserve la portée normative et juridique de δικαιώματα sans la limiter à des verdicts judiciaires.
theological_decisions:
- issue: Sens de δικαιώματα dans une confession pénitentielle
  choice: prescriptions
  alternative: justes décisions ; décrets ; exigences
  rationale: Le terme désigne ici les normes établies par Dieu. « Prescriptions » conserve leur caractère obligatoire sans imposer une catégorie doctrinale plus étroite.
- issue: Rapport exprimé par ἐπί avec le datif
  choice: contre
  alternative: à l’égard de ; en ce qui concerne
  rationale: Le contexte pénitentiel favorise l’idée d’une faute commise contre les normes divines, mais la note maintient la possibilité d’un rapport plus général.
translation_notes:
  register: Français international moderne, solennel mais accessible. La triple confession du grec est conservée, ainsi que l’adresse directe à Dieu. Le tutoiement correspond au registre biblique français courant de la prière.
