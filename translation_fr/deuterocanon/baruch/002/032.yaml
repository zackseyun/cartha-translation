  text: and they will praise me in the land of their exile[a], and they will remember my name[b];
translation:
  language: fr
  text: et ils me loueront dans le pays de leur exil[a], et ils se souviendront de mon nom[b] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le pays où ils ont été déportés ». Le terme grec peut désigner l’éloignement et l’établissement loin de sa patrie ; « exil » convient le mieux ici.
    reason: lexical_alternative
  - marker: b
    text: 'Dans la Bible, « mon nom » peut désigner plus que le nom lui-même : il évoque aussi l’identité révélée et l’honneur de Dieu.'
    reason: idiom_clarification
lexical_decisions:
- source_word: αἰνέσουσίν
  choice: ils me loueront
  rationale: Le futur actif de αἰνέω exprime une louange adressée à Dieu. « Louer » est naturel, actuel et conserve la portée cultuelle du verbe.
- source_word: ἐν γῇ
  choice: dans le pays
  rationale: ἐν est ici locatif. « Pays » convient mieux que « terre » au lieu où les exilés résident, et le complément qui suit permet naturellement l’article défini.
- source_word: ἀποικισμοῦ αὐτῶν
  choice: de leur exil
  rationale: ἀποικισμός désigne l’éloignement et l’établissement hors de la patrie. Dans le contexte de Baruch, « exil » rend clairement cette situation, tout en signalant en note l’alternative plus concrète « déportation ».
- source_word: μνησθήσονται
  choice: ils se souviendront
  rationale: Le futur de μιμνῄσκομαι est rendu idiomatiquement par le verbe pronominal français « se souvenir », sans surinterpréter sa forme grecque.
- source_word: τοῦ ὀνόματός μου
  choice: de mon nom
  rationale: Cette formulation conserve l’idiome biblique et sa richesse sémantique, qui peut englober l’identité révélée et l’honneur de Dieu.
theological_decisions:
- issue: Sens de « mon nom » dans le contexte de l’alliance
  choice: Conserver littéralement l’idiome « mon nom »
  alternative: « qui je suis » ou « ma renommée »
  rationale: Le grec parle explicitement du nom. Garder cet idiome préserve sa portée théologique sans la réduire à une seule interprétation.
- issue: Portée de ἀποικισμός dans un contexte de jugement et de restauration
  choice: Traduire par « exil »
  alternative: « déportation » ou « établissement loin de leur patrie »
  rationale: « Exil » exprime avec naturel la condition imposée loin du pays d’origine et correspond au contexte, sans ajouter de précision absente du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe coordonnée et le futur du grec sont conservés. « Pays » évite l’ambiguïté de « terre » dans ce contexte, tandis que les deux notes préservent les nuances lexicales et théologiques.
