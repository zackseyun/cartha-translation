base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/023.yaml
  text: I will cause the sound of gladness and the sound of rejoicing to cease from the cities of Judah and from the outskirts of Jerusalem[a], the sound of bridegroom and the sound of bride[b], and all the land will become impassable because of its inhabitants.
translation:
  language: fr
  text: Je ferai disparaître des villes de Juda et de l’extérieur de Jérusalem[a] les sons d’allégresse et les sons de joie, la voix du marié et la voix de la mariée, et tout le pays deviendra impraticable à cause de ses habitants[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de l’extérieur de Jérusalem ». Certaines traductions donnent « des rues de Jérusalem » sous l’influence de formules prophétiques parallèles, mais le grec conservé lit ici « de l’extérieur ».'
    reason: alternative_reading
  - marker: b
    text: 'La dernière expression est difficile en grec. On peut aussi comprendre : « tout le pays deviendra impraticable, sans habitants » ou « privé d’habitants ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκλείψειν ποιήσω
  choice: Je ferai disparaître
  rationale: La construction ποιέω + infinitif exprime une action causative. « Je ferai disparaître » garde l’intervention active de Dieu tout en étant naturelle en français.
- source_word: ἐκ πόλεων Ἰούδα καὶ ἔξωθεν Ἰερουσαλήμ
  choice: des villes de Juda et des alentours de Jérusalem
  rationale: ἐκ marque ici le lieu d’où ces sons seront supprimés. ἔξωθεν signifie « au-dehors » ou « à l’extérieur » ; « des alentours de Jérusalem » rend ce sens sans introduire le mot « rues », absent du grec.
- source_word: φωνὴν εὐφροσύνης καὶ φωνὴν χαρμοσύνης
  choice: les cris d’allégresse et les cris de joie
  rationale: φωνή peut désigner une voix, un son ou un cri. Dans ce tableau de réjouissances collectives, « cris » est idiomatique et la répétition conserve le parallélisme grec. Les deux quasi-synonymes restent distincts.
- source_word: φωνὴν νυμφίου καὶ φωνὴν νύμφης
  choice: la voix du marié et la voix de la mariée
  rationale: Le passage des « cris » à la « voix » est naturel puisque des personnes précises sont maintenant nommées. « Marié » et « mariée » sont les équivalents français courants dans le contexte d’une célébration nuptiale.
- source_word: ἔσται πᾶσα ἡ γῆ εἰς ἄβατον
  choice: tout le pays deviendra impraticable
  rationale: ἄβατος désigne ce qui ne peut être parcouru ou traversé. « Impraticable » conserve cette précision, tandis que γῆ désigne ici le pays plutôt que la terre entière.
- source_word: ἀπὸ ἐνοικούντων
  choice: à cause de ses habitants
  rationale: Le grec transmis est difficile. Cette traduction garde une valeur causale possible de ἀπό, sans corriger silencieusement le texte ; l’autre compréhension importante est indiquée en note.
theological_decisions:
- issue: Faut-il harmoniser le verset avec les formules de jugement parallèles de Jérémie ?
  choice: Conserver « des alentours de Jérusalem » et traduire la proposition finale telle qu’elle se présente dans le témoin grec.
  alternative: Lire « des rues de Jérusalem » et comprendre la fin comme « sans habitants » d’après les formules prophétiques parallèles.
  rationale: Le texte grec conservé doit primer sur une harmonisation avec des passages parallèles. Les difficultés réelles sont signalées en notes plutôt que résolues par l’importation d’une formulation plus familière.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé, avec une ponctuation qui rend clairement la progression du jugement. Les deux notes sont appelées dans le texte principal.
