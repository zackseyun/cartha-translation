  verdict: revise
  source_fidelity: La traduction identifie correctement la maison, conserve la formule du nom invoqué, exprime la cause par « à cause de » et maintient la double désignation collective « maison d’Israël … maison de Juda ». Toutefois, « réduire … à l’état » précise indûment une action de dévastation que ἔθηκας (« tu as fait / rendu ») n’explicite pas à lui seul dans ce verset.
  naturalness: La phrase est globalement naturelle, mais « réduire la maison … à l’état où elle se trouve » est plus lourd et plus spécifique que nécessaire. « Tu as rendu la maison … telle qu’elle est aujourd’hui » est idiomatique, sobre et conserve le résultat constaté par ὡς ἡ ἡμέρα αὕτη.
  terminology: « Maison », « ton nom a été invoqué », « méchanceté », « maison d’Israël » et « maison de Juda » conviennent au registre biblique moderne et ne surinterprètent pas la formule de consécration.
