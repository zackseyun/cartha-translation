base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/026.yaml
  text: And you made the house over which your name was called as it is this day[a], because of the wickedness of the house of Israel and the house of Judah.
translation:
  language: fr
  text: Et tu as rendu la maison sur laquelle ton nom a été invoqué telle qu’elle est aujourd’hui[a], à cause de la méchanceté de la maison d’Israël et de la maison de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de façon plus idiomatique : « la maison qui porte ton nom ». Le grec reprend une formule sémitique, littéralement : « la maison sur laquelle ton nom a été invoqué ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθηκας
  choice: tu as réduit… à l’état
  rationale: Dans cette construction, τίθημι exprime le fait de mettre ou d’amener la maison dans l’état constaté aujourd’hui. « Réduire à l’état » rend naturellement en français cette nuance résultative sans préciser davantage la nature de la destruction.
- source_word: τὸν οἶκον
  choice: la maison
  rationale: Le référent contextuel est le Temple, mais « la maison » conserve le terme grec et l’expression biblique désignant la maison de Dieu.
- source_word: οὗ ἐπεκλήθη τὸ ὄνομά σου ἐπ᾽ αὐτῷ
  choice: sur laquelle ton nom a été invoqué
  rationale: Cette formulation garde la voix passive et la tournure sémitique transmise par le grec, qui exprime l’appartenance et la consécration à Dieu. La note donne l’équivalent français plus idiomatique.
- source_word: ὡς ἡ ἡμέρα αὕτη
  choice: à l’état où elle se trouve aujourd’hui
  rationale: La formule signifie que l’état résultant est visible au moment présent. Cette traduction française restitue le sens de l’idiome sans calque obscur.
- source_word: διὰ πονηρίαν
  choice: à cause de la méchanceté
  rationale: διά avec l’accusatif indique ici la cause; πονηρία désigne la perversité ou la conduite moralement mauvaise dans cette prière pénitentielle.
- source_word: οἴκου Ἰσραὴλ καὶ οἴκου Ἰούδα
  choice: de la maison d’Israël et de la maison de Juda
  rationale: La répétition de « maison » préserve la portée collective et historique de la formulation grecque.
theological_decisions:
- issue: Le référent de « la maison » et la formule du nom divin
  choice: Conserver « la maison » et la formule « sur laquelle ton nom a été invoqué » dans le texte principal.
  alternative: Expliciter « le Temple qui porte ton nom ».
  rationale: Le contexte identifie la maison au Temple de Jérusalem, mais le grec maintient le langage de la maison et une formule d’appartenance ou de consécration liée au nom divin. La traduction ne réduit donc pas cette formule à une simple désignation.
translation_notes:
  register: Français moderne, international et digne. La syntaxe évite le calque « comme ce jour » tout en conservant dans le texte principal l’image de la maison, la formule du nom invoqué et la répétition collective « maison d’Israël… maison de Juda ».
