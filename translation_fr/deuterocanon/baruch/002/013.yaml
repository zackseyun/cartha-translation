  text: Let your wrath turn away from us, because we have been left few among the nations where you scattered us there.
translation:
  language: fr
  text: Que ta colère se détourne de nous, car nous ne sommes plus qu’un petit nombre parmi les nations où tu nous as dispersés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυμός
  choice: colère
  rationale: Dans ce contexte de supplication face au jugement divin, « colère » exprime naturellement en français l’indignation intense désignée par le grec, sans surinterprétation.
- source_word: ἀποστραφήτω
  choice: Que… se détourne
  rationale: Le tour optatif français rend l’impératif grec à la troisième personne et conserve l’image d’une colère qui se détourne.
- source_word: κατελείφθημεν ὀλίγοι
  choice: nous ne sommes plus qu’un petit nombre
  rationale: Cette formulation française naturelle restitue le passif et l’idée d’un faible reste survivant, sans ajouter le terme théologique « reste » absent du texte.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: parmi les nations
  rationale: « Nations » convient au contexte des peuples étrangers au milieu desquels les destinataires ont été dispersés.
- source_word: διέσπειρας
  choice: tu nous as dispersés
  rationale: Rend directement l’action passée de répandre un peuple en différents lieux.
theological_decisions:
- issue: Relation exprimée par ὅτι
  choice: car
  alternative: parce que
  rationale: « Car » conserve la relation explicative ou causale sans la préciser davantage et convient au registre de la prière.
- issue: Faible nombre des exilés
  choice: un petit nombre
  alternative: un petit reste
  rationale: Le choix évite d’introduire explicitement la notion théologique de « reste », même si elle peut être évoquée par le contexte.
translation_notes:
  register: Français international moderne, digne et accessible. La redondance grecque οὗ… ἐκεῖ (« où… là ») n’est pas reproduite, car elle serait lourde et peu naturelle en français sans apporter de contenu supplémentaire.
