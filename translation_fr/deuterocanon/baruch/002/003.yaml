lexical_decisions:
- source_word: τοῦ φαγείν ἡμᾶς
  choice: au point que nous mangions
  rationale: L’infinitif articulé au génitif, avec ἡμᾶς comme sujet à l’accusatif, exprime ici une conséquence dans une proposition dépendante. « Au point que » rend cette valeur sans transformer le fragment en phrase autonome.
- source_word: ἄνθρωπον
  choice: un homme
  rationale: Le singulier ἄνθρωπον est repris deux fois. La traduction conserve cette répétition et la référence humaine individuelle, sans la remplacer par « chacun » ou par le couple interprétatif « l’un… l’autre ».
- source_word: σάρκας
  choice: la chair
  rationale: Dans ce contexte, σάρκας désigne concrètement la chair du corps. Le singulier collectif français « la chair » est naturel et maintient toute la gravité de l’expression.
- source_word: υἱοῦ αὐτοῦ
  choice: de son fils
  rationale: Le possessif αὐτοῦ est rendu directement par « son ». L’ajout de « propre » n’est pas nécessaire et introduirait une insistance absente du grec.
- source_word: θυγατρὸς αὐτοῦ
  choice: de sa fille
  rationale: Le génitif possessif est rendu naturellement par « de sa fille », sans ajouter d’emphase.
theological_decisions:
- issue: Caractère fragmentaire du texte grec fourni
  choice: Conserver une proposition dépendante, sans reconstituer la phrase qui la régit
  alternative: Transformer le fragment en phrase complète à partir du contexte plus large
  rationale: Le texte source transmis commence par un infinitif articulé dépendant et ne constitue pas une phrase autonome. La traduction respecte cette incomplétude plutôt que d’importer des mots absents.
- issue: Rapport syntaxique entre ἡμᾶς et les deux occurrences de ἄνθρωπον
  choice: Rendre ἡμᾶς par « nous » et présenter les deux « un homme » comme des précisions distributives après deux-points
  alternative: Traduire « parmi nous, un homme mange… » ou reformuler par « chacun »
  rationale: 'La construction grecque est abrupte : ἡμᾶς est le sujet accusatif de l’infinitif, tandis que ἄνθρωπον est répété. Les deux-points préservent ce rapport sans imposer une reconstruction syntaxique trop assurée.'
translation_notes:
  register: Français moderne, sobre et grave. La formulation demeure volontairement abrupte afin de refléter la syntaxe fragmentaire du grec, tout en utilisant une ponctuation qui la rend lisible.
