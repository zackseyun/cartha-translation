  text: pour que nous mangions chacun la chair de son fils et la chair de sa fille.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec fourni ici est un groupe infinitif dépendant, et non une phrase complète. La traduction conserve cette dépendance sans reconstituer les mots qui l’entouraient.
