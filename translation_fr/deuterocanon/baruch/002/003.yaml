  source_fidelity: Le texte grec fourni contient l’infinitif articulé τοῦ φαγείν avec ἡμᾶς comme sujet à l’accusatif. La version proposée rend bien le pluriel par « nous », mais les deux-points suivis de « un homme » produisent une apposition syntaxiquement artificielle et obscurcissent le rapport distributif entre « nous » et les deux ἄνθρωπον. « Chacun » rend ce rapport en français sans ajouter de contenu contextuel. La valeur précise de τοῦ ne peut pas être définitivement fixée à partir du fragment isolé; « pour que » conserve une dépendance infinitive sans reconstruire la proposition régissante.
  naturalness: '« au point que nous mangions : un homme… » n’est pas naturel en français moderne et les deux-points donnent l’impression que ce qui suit explique ou cite « nous », plutôt que de poursuivre la construction. « pour que nous mangions chacun… » est lisible, reste volontairement dépendant et conserve le caractère grave du passage.'
  terminology: « La chair » est exact pour σάρκας dans ce contexte concret. « Son fils » et « sa fille » rendent les possessifs grecs sans l’emphase ajoutée de « son propre ». Le distributif « chacun » est préférable à la répétition littérale de « un homme », qui serait non idiomatique et ambiguë en français après « nous ».
