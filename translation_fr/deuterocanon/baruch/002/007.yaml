  text: which the Lord spoke against us—all these evils that came upon us[a].
translation:
  language: fr
  text: 'ce que le Seigneur a dit contre nous : tous ces malheurs qui nous sont arrivés[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous ces maux » ou « toutes ces calamités ». Le mot grec désigne ici les événements funestes qui ont frappé le peuple.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: ce que
  rationale: Le pronom relatif reprend naturellement en français le contenu annoncé dans le contexte précédent.
- source_word: ἐλάλησεν
  choice: avait déclaré
  rationale: Le plus-que-parfait exprime l'antériorité de la parole divine par rapport aux malheurs survenus; « déclaré » rend ici une parole annoncée avec autorité sans en faire explicitement un décret.
- source_word: Κύριος
  choice: le Seigneur
  rationale: Le grec porte Κύριος; « le Seigneur » est la traduction française normale sans réintroduire directement le nom divin hébreu.
- source_word: ἐφ᾽ ἡμᾶς
  choice: contre nous
  rationale: Avec le verbe de parole et dans ce contexte de jugement, ἐπί avec l'accusatif a une valeur adversative.
- source_word: πάντα τὰ κακὰ ταῦτα
  choice: tous ces malheurs
  rationale: κακά désigne ici les maux ou calamités éprouvés par le peuple. « Malheurs » est naturel en français et conserve une certaine largeur sémantique.
- source_word: ἦλθεν ἐφ᾽ ἡμᾶς
  choice: qui se sont abattus sur nous
  rationale: Cette tournure française idiomatique rend la venue de calamités sur le peuple et la gravité du contexte, sans ajouter la notion technique d'accomplissement.
theological_decisions:
- issue: Sens moral ou expérientiel de τὰ κακά dans un contexte de jugement
  choice: malheurs
  alternative: maux; calamités
  rationale: Le contexte montre qu'il s'agit de réalités nuisibles survenues comme jugements, et non principalement d'actes moralement mauvais commis par le peuple. « Malheurs » garde toutefois la gravité et la tension du terme grec.
translation_notes:
  register: Français international moderne, naturel et digne. La structure fragmentaire du grec, qui dépend du contexte précédent, est conservée; les deux emplois de ἐφ᾽ ἡμᾶς sont différenciés selon leur construction idiomatique.
