base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/004.yaml
  text: And he gave them over as subjects to all the kingdoms around us[a], for reproach and desolation among all the peoples around whom the Lord scattered them there.
translation:
  language: fr
  text: Il les a livrés au pouvoir de tous les royaumes qui nous entourent, pour qu’ils soient un objet de mépris et de désolation[a] parmi tous les peuples au milieu desquels le Seigneur les a dispersés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un lieu désert et inaccessible ». Le mot grec désigne littéralement ce qui n’est pas foulé ou ce qui est inaccessible.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν αὐτοὺς ὑποχειρίους
  choice: Il les a livrés au pouvoir
  rationale: L’ensemble exprime la remise d’un peuple sous la domination d’autrui. Cette formulation française restitue à la fois l’action de livrer et l’idée d’assujettissement contenue dans ὑποχειρίους.
- source_word: πάσαις ταῖς βασιλείαις ταῖς κύκλῳ ἡμῶν
  choice: de tous les royaumes qui nous entourent
  rationale: Le complément marque les puissances auxquelles ils sont soumis; le pluriel et la portée globale de πάσαις sont conservés.
- source_word: εἰς ὀνειδισμόν
  choice: pour qu’ils soient un objet de mépris
  rationale: ὀνειδισμός désigne l’opprobre public, la honte infligée ou le mépris. « Un objet de mépris » est naturel en français et convient à la situation des personnes dispersées.
- source_word: ἄβατον
  choice: désolation
  rationale: Le terme signifie littéralement ce qui est non foulé, inaccessible ou désert. Dans ce contexte de jugement, « désolation » exprime naturellement l’état de ruine, tandis qu’une note conserve le sens concret du grec.
- source_word: λαοῖς
  choice: peuples
  rationale: « Peuples » garde la pluralité ethnoculturelle de λαοί sans réduire le terme à des États politiques.
- source_word: διέσπειρεν
  choice: a dispersés
  rationale: Le verbe décrit la dispersion d’un peuple en contexte d’exil. « Disperser » est précis et idiomatique en français.
- source_word: Κύριος
  choice: le Seigneur
  rationale: Cette traduction usuelle de Κύριος préserve l’attribution explicite de la dispersion au Seigneur.
- source_word: οὗ … ἐκεῖ
  choice: au milieu desquels
  rationale: Le relatif local et ἐκεῖ sont rendus ensemble par une tournure française naturelle qui situe les dispersés parmi les peuples déjà mentionnés, sans ajouter un « là » redondant.
theological_decisions:
- issue: Attribution de la dispersion à Κύριος
  choice: le Seigneur les a dispersés
  alternative: ils ont été dispersés
  rationale: La voix active et le sujet divin sont maintenus, de sorte que le jugement demeure explicitement attribué au Seigneur sans développement doctrinal supplémentaire.
- issue: Portée de ἄβατον dans le langage du jugement
  choice: désolation
  alternative: lieu inaccessible / désert infranchissable
  rationale: « Désolation » convient à la coordination avec l’opprobre et s’applique naturellement au sort du peuple. La note signale toutefois le caractère concret et potentiellement spatial du mot grec, afin de ne pas effacer son ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le mouvement judiciaire du grec tout en évitant le calque peu naturel « sous la main ». Le relatif final est formulé sans le « là » explicite d’ἐκεῖ, sa valeur locale étant intégrée à « au milieu desquels ».
