base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/018.yaml
  text: But the soul that is grieved over its great misery[a], that goes about bent over and weak, and the eyes that are failing and the soul that is hungry—these will give you glory and righteousness[b], O Lord.
translation:
  language: fr
  text: Mais l’âme affligée par la grandeur de son malheur[a], qui avance courbée et faible, les yeux qui défaillent et l’âme qui a faim te rendront gloire et justice[b], Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « affligée au sujet de la grandeur ». L’expression grecque est condensée; « la grandeur » peut désigner l’ampleur de l’épreuve ou du malheur.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ta droiture ». Le grec dit littéralement : « te donneront gloire et justice »; il peut s’agir d’attribuer à Dieu ou de reconnaître sa rectitude ou sa justice.'
    reason: alternative_reading
lexical_decisions:
- source_word: ψυχή
  choice: âme
  rationale: Le terme revient deux fois et désigne ici la vie intérieure, voire la personne éprouvée. « Âme » conserve la force poétique de la lamentation sans réduire le sens à la seule personne physique.
- source_word: λυπουμένη
  choice: affligée
  rationale: Le participe exprime une douleur persistante. « Affligée » est naturel dans une prière solennelle et peut évoquer à la fois la tristesse et la détresse.
- source_word: ἐπὶ τὸ μέγεθος
  choice: par l’immensité de son malheur
  rationale: 'L’expression grecque est elliptique : elle dit littéralement « au sujet de la grandeur ». Le contexte de faiblesse, de faim et d’épuisement permet d’expliciter prudemment le malheur, tout en signalant l’ellipse en note.'
- source_word: βαδίζει
  choice: avance
  rationale: Le présent décrit la condition durable de l’être affligé. « Avance » s’accorde naturellement avec l’image de quelqu’un qui marche courbé.
- source_word: κύπτον
  choice: courbée
  rationale: Le participe évoque une posture voûtée ou inclinée sous le poids de l’épreuve. « Courbée » est clair, concret et digne.
- source_word: ἀσθενοῦν
  choice: faible
  rationale: Le mot peut renvoyer à la faiblesse ou à la maladie. « Faible » préserve l’étendue du sens sans préciser indûment qu’il s’agit d’une maladie.
- source_word: οἱ ὀφθαλμοὶ οἱ ἐκλείποντες
  choice: les yeux qui défaillent
  rationale: ἐκλείπω suggère ici que les yeux perdent leurs forces ou leur capacité. « Défaillent » maintient l’image de l’épuisement sans imposer la seule idée d’une vue qui baisse.
- source_word: πεινῶσα
  choice: qui a faim
  rationale: Traduction directe de l’état continu exprimé par le participe, sans l’intensifier en « affamée » ou « famélique ».
- source_word: δώσουσίν σοι δόξαν
  choice: te rendront gloire
  rationale: « Rendre gloire » est l’expression française naturelle pour l’attribution à Dieu de l’honneur exprimée par la construction grecque.
- source_word: δικαιοσύνην
  choice: reconnaîtront ta justice
  rationale: La coordination grecque partage le verbe « donner », mais « donner justice » serait obscur en français. « Reconnaîtront ta justice » explicite idiomatiquement l’attribution à Dieu de sa rectitude, tandis qu’une autre nuance est conservée en note.
- source_word: Κύριε
  choice: Seigneur
  rationale: Forme française consacrée et naturelle de l’adresse divine κύριε.
theological_decisions:
- issue: Sens de δικαιοσύνην dans une prière adressée à Dieu
  choice: ta justice
  alternative: ta droiture
  rationale: 'Dans ce contexte, le terme désigne la qualité de Dieu reconnue par les affligés : sa conformité au droit et son action juste. « Justice » est le terme français le plus large et le plus courant; « droiture » souligne davantage la rectitude morale et reste une possibilité réelle.'
- issue: Nature de la gloire et de la justice attribuées à Dieu
  choice: « rendre gloire » et « reconnaître ta justice »
  alternative: « te donner gloire et justice »
  rationale: La traduction ne suggère pas que les êtres humains confèrent à Dieu des qualités qu’il ne posséderait pas. Elle rend idiomatiquement l’idée qu’ils les lui attribuent ou les confessent, sans introduire une formulation doctrinale étrangère au texte.
translation_notes:
  register: Français international actuel, avec un registre digne adapté à une prière de lamentation. La phrase conserve l’accumulation poétique des figures éprouvées et la tension du grec, tout en dépliant légèrement la dernière coordination pour qu’elle soit intelligible en français.
