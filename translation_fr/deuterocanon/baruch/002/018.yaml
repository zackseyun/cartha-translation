    rationale: Cette reprise démonstrative accentue et réorganise les référents de l’énumération, alors que le grec enchaîne directement les sujets avant le verbe au pluriel.
  - severity: low
    issue: « immensité » surinterprète μέγεθος
    rationale: μέγεθος signifie d’abord « grandeur » ou « importance ». Le contexte autorise l’idée d’affliction, mais « immensité » renforce inutilement l’intensité.
  - severity: low
    issue: « reconnaîtront ta justice » dédouble le prédicat grec
    rationale: Le sens est défendable, mais le grec coordonne « gloire » et « justice » sous le même verbe « donner ». Une formulation française solennelle peut conserver cette unité.
