revisions:
- from: Mais l’âme affligée par l’immensité de son malheur[a], qui avance courbée et faible, les yeux qui défaillent et l’âme qui a faim — ce sont eux qui te rendront gloire et reconnaîtront ta justice[b], Seigneur.
  to: Mais l’âme affligée par la grandeur de son malheur[a], qui avance courbée et faible, les yeux qui défaillent et l’âme qui a faim te rendront gloire et justice[b], Seigneur.
  rationale: La révision supprime l’emphase démonstrative ajoutée, modère l’intensification de « immensité » et rétablit un seul prédicat pour les deux compléments coordonnés, conformément au grec. Elle maintient l’explicitation contextuelle de l’affliction en note, sans prétendre lever l’ellipse disputée de ἐπὶ τὸ μέγεθος.
