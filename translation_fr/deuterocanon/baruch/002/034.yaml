base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/034.yaml
  text: and I will bring them back to the land that I swore to their fathers—to Abraham and Isaac and Jacob—and they will rule over it; and I will multiply them[a], and they will certainly not be diminished.
translation:
  language: fr
  text: Je les ramènerai dans le pays que j’ai juré de donner à leurs pères, à Abraham, à Isaac et à Jacob. Ils en seront les maîtres[a]. Je les multiplierai, et leur nombre ne diminuera certainement pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils en prendront possession ». Le verbe grec peut exprimer la maîtrise exercée sur quelque chose ou, dans ce contexte, sa possession.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστρέψω
  choice: Je les ramènerai
  rationale: Le causatif de retour vers un lieu se rend naturellement en français par « ramener », tout en conservant le mouvement exprimé par εἰς.
- source_word: γῆν
  choice: le pays
  rationale: Dans le contexte du serment fait aux patriarches, γῆ désigne le territoire promis plutôt que la terre entière.
- source_word: ὤμοσα
  choice: que j’ai juré de donner
  rationale: Le grec signifie littéralement « que j’ai juré à leurs pères ». L’ajout de « de donner » explicite en français l’objet implicite du serment sans remplacer la notion essentielle de serment.
- source_word: πατράσιν
  choice: leurs pères
  rationale: Les référents sont immédiatement nommés — Abraham, Isaac et Jacob — ; « pères » préserve donc avec justesse la formulation patriarcale.
- source_word: κυριεύσουσιν αὐτῆς
  choice: Ils en seront les maîtres
  rationale: Cette formulation conserve l’idée d’autorité ou de maîtrise portée par κυριεύω et demeure plus naturelle en français que « ils régneront sur lui » à propos d’un pays.
- source_word: πληθυνῶ αὐτούς
  choice: Je les multiplierai
  rationale: La traduction directe maintient l’écho du langage d’alliance relatif à la multiplication des descendants.
- source_word: οὐ μὴ σμικρυνθῶσιν
  choice: leur nombre ne diminuera certainement pas
  rationale: « Certainement pas » restitue la négation emphatique οὐ μή, tandis que « leur nombre » rend explicite le sens numérique suggéré par l’opposition avec πληθυνῶ.
theological_decisions:
- issue: Restauration fondée sur le serment fait aux patriarches
  choice: Conserver le serment explicite ainsi que les noms d’Abraham, d’Isaac et de Jacob
  alternative: Paraphraser par « le pays promis à leurs ancêtres »
  rationale: Le texte rattache directement le retour au serment divin fait aux patriarches. La formulation retenue préserve ce cadre d’alliance sans lui ajouter d’interprétation doctrinale.
- issue: Sens de κυριεύσουσιν appliqué au pays
  choice: « Ils en seront les maîtres » dans le texte, avec « ils en prendront possession » en note
  alternative: Traduire directement par « ils en prendront possession »
  rationale: Le grec exprime d’abord la maîtrise ou la domination, mais le contexte territorial permet aussi un sens possessif. La note conserve cette ambiguïté réelle.
translation_notes:
  register: Français moderne, international et digne. Les phrases ont été légèrement segmentées pour la lisibilité. « Pays » évite l’ambiguïté de « terre », et « leurs pères » maintient la référence explicite aux patriarches.
