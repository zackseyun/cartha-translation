base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/011.yaml
  text: And now[a], O Lord, God of Israel, who brought your people out of the land of Egypt with a mighty hand, with signs and wonders and with great power and with an uplifted arm, and made for yourself a name, as at this day,
translation:
  language: fr
  text: Et maintenant, Seigneur, Dieu d’Israël, toi qui as fait sortir ton peuple du pays d’Égypte par une main puissante, par des signes et des prodiges, avec une grande puissance et le bras levé[a], et qui t’es fait un nom, comme en ce jour,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le bras élevé ». Le grec dit littéralement « le bras haut/levé », plutôt que la formule plus courante « le bras étendu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε ὁ θεὸς Ἰσραήλ
  choice: Seigneur, Dieu d’Israël
  rationale: L’apostrophe divine est rendue dans un français naturel et digne; l’article grec ne se transpose pas dans cette adresse directe.
- source_word: ἐξήγαγες
  choice: as fait sortir
  rationale: Expression claire qui conserve le langage traditionnel de la sortie d’Égypte.
- source_word: ἐν χειρὶ κραταιῷ
  choice: par une main puissante
  rationale: Préserve la métaphore biblique et exprime naturellement en français le moyen par lequel Dieu agit.
- source_word: σημείοις καὶ ἐν τέρασιν
  choice: par des signes et des prodiges
  rationale: Couple lexical courant qui restitue les manifestations extraordinaires associées à l’Exode.
- source_word: ἐν δυνάμει μεγάλῃ
  choice: avec une grande puissance
  rationale: Rend directement l’intensité de δύναμις sans atténuer l’accumulation rhétorique.
- source_word: ἐν βραχίονι ὑψηλῷ
  choice: le bras levé
  rationale: ὑψηλός signifie ici «haut, levé»; cette formulation évite de remplacer le grec par l’expression exodique plus familière «bras étendu».
- source_word: ἐποίησας σεαυτῷ ὄνομα
  choice: t’es fait un nom
  rationale: Expression française idiomatique qui conserve le réfléchi explicite et l’idée d’une renommée acquise.
- source_word: ὡς ἡ ἡμέρα αὕτη
  choice: comme on le voit aujourd’hui
  rationale: 'Rend le sens de la formule temporelle: le nom acquis demeure manifeste au moment où parle l’auteur.'
theological_decisions:
- issue: Accumulation des expressions évoquant la délivrance lors de l’Exode
  choice: 'Conserver toute la série: main puissante, signes, prodiges, grande puissance et bras levé'
  alternative: Réduire ou fusionner la série pour alléger la phrase
  rationale: La répétition souligne la manifestation éclatante de la puissance de Dieu et fait écho au langage scripturaire de l’Exode.
- issue: Sens de βραχίονι ὑψηλῷ
  choice: le bras levé
  alternative: le bras étendu
  rationale: Le texte grec porte littéralement l’idée d’un bras haut ou levé, et non le terme habituellement traduit par «étendu»; la différence est donc maintenue.
translation_notes:
  register: Français international moderne, digne et accessible. La longue période et son accumulation sont conservées, puisque le verset se poursuit syntaxiquement dans le contexte. Le pronom «toi» clarifie naturellement la relative grecque en français.
