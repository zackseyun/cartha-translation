base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/005.yaml
  text: and they became beneath and not above[b][a], because we sinned against the Lord our God by not listening to his voice.
translation:
  language: fr
  text: Et ils se sont retrouvés au-dessous et non au-dessus[a], parce que nous avons péché contre le Seigneur notre Dieu en n’écoutant pas sa voix[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en bas et non en haut ». L’opposition spatiale exprime aussi une situation d’infériorité ou d’humiliation.
    reason: lexical_alternative
  - marker: b
    text: Dans la langue biblique, « écouter sa voix » implique aussi de lui obéir.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενήθησαν
  choice: ils se sont retrouvés
  rationale: Le verbe exprime ici l’aboutissement à une situation. « Se sont retrouvés » rend ce changement d’état plus naturellement en français que le calque « sont devenus », tout en gardant la troisième personne du pluriel du grec.
- source_word: ὑποκάτω … ἐπάνω
  choice: au-dessous et non au-dessus
  rationale: Cette opposition spatiale directe conserve l’image grecque, qui évoque aussi une condition d’infériorité et d’humiliation.
- source_word: ἡμάρτομεν
  choice: nous avons péché
  rationale: Rendu courant et précis de ἁμαρτάνω, sans atténuer sa portée morale et théologique.
- source_word: Κυρίῳ θεῷ ἡμῶν
  choice: contre le Seigneur notre Dieu
  rationale: Le datif régi par le verbe « pécher » s’exprime naturellement en français avec « contre » ; κύριος est rendu par « Seigneur ».
- source_word: πρὸς τὸ μὴ ἀκούειν
  choice: en n’écoutant pas
  rationale: La tournure indique en quoi ou de quelle manière le péché a été commis. Elle préserve le verbe « écouter » plutôt que d’expliciter directement par « désobéir ».
- source_word: τῆς φωνῆς αὐτοῦ
  choice: sa voix
  rationale: Traduction directe de φωνή, qui maintient l’idiome biblique de l’écoute de la voix divine.
theological_decisions:
- issue: Image d’abaissement liée aux malédictions de l’alliance
  choice: ils se sont retrouvés au-dessous et non au-dessus
  alternative: ils ont été humiliés et privés de toute prééminence
  rationale: Le texte grec formule une opposition spatiale qui suggère une perte de statut. La traduction conserve cette image et sa résonance scripturaire sans la réduire à une interprétation abstraite.
- issue: Sens obéissant de l’écoute de la voix de Dieu
  choice: en n’écoutant pas sa voix
  alternative: en ne lui obéissant pas
  rationale: Dans l’usage biblique, écouter la voix de Dieu implique lui obéir ; néanmoins, le texte nomme explicitement l’écoute et la voix. Garder cet idiome préserve sa densité et sa transparence.
- issue: Passage de la troisième personne à la première personne
  choice: ils se sont retrouvés … nous avons péché
  alternative: nous nous sommes retrouvés … parce que nous avons péché
  rationale: Même si l’alternance paraît abrupte, le grec porte bien ἐγενήθησαν à la troisième personne puis ἡμάρτομεν à la première. La traduction conserve cette tension textuelle au lieu de l’harmoniser silencieusement.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste accessible tout en conservant l’opposition imagée du grec et son changement inattendu de personne grammaticale.
