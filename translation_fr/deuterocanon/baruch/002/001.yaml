base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/001.yaml
  text: And the Lord has confirmed his word that he spoke against us and against our judges who judged Israel[a], and against our kings and against our rulers[b], and against the people of Israel and Judah.
translation:
  language: fr
  text: Et le Seigneur a accompli la parole qu’il avait prononcée contre nous, contre nos juges qui jugeaient Israël, contre nos rois, contre nos dirigeants et contre les habitants d’Israël et de Juda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie le singulier ἄνθρωπον (« être humain ») dans un sens collectif, dans une expression resserrée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησεν
  choice: a accompli
  rationale: Le verbe signifie ici que le Seigneur a fait tenir sa parole, donc qu’il lui a donné effet. Dans ce contexte de jugement annoncé puis exécuté, « a accompli » est naturel et conserve le lien explicite avec « la parole ».
- source_word: Κύριος
  choice: le Seigneur
  rationale: Équivalent français usuel de κύριος lorsqu’il désigne Dieu dans la Septante.
- source_word: τὸν λόγον αὐτοῦ
  choice: la parole
  rationale: « Parole » garde l’ampleur de λόγος et renvoie à ce que Dieu avait annoncé sans préciser indûment s’il s’agit d’un décret ou d’une sentence.
- source_word: ἐλάλησεν ἐφ᾽ ἡμᾶς
  choice: qu’il avait prononcée contre nous
  rationale: Le contexte punitif donne à ἐπί avec l’accusatif une valeur adverse. Le plus-que-parfait marque naturellement en français l’antériorité de l’annonce par rapport à son accomplissement.
- source_word: δικαστάς / τοὺς δικάσαντας τὸν Ἰσραήλ
  choice: nos juges qui jugeaient Israël
  rationale: La répétition française reflète celle du grec et distingue ces juges des dirigeants mentionnés ensuite.
- source_word: τοὺς ἄρχοντας
  choice: nos dirigeants
  rationale: « Dirigeants » exprime largement l’autorité politique de ἄρχοντες sans l’archaïsme ni la restriction dynastique de « princes ».
- source_word: ἄνθρωπον Ἰσραὴλ καὶ Ἰούδα
  choice: les gens d’Israël et de Juda
  rationale: Le singulier ἄνθρωπον a ici une portée collective dans une tournure grecque resserrée. « Les gens » reste proche de la désignation humaine tout en étant naturel et inclusif en français.
theological_decisions:
- issue: Effet de la parole divine dans un contexte de jugement
  choice: Le Seigneur a donné effet à la parole de jugement annoncée auparavant.
  alternative: Le Seigneur a confirmé ou établi sa parole dans un sens plus général.
  rationale: La série de compléments introduits par « contre » et le contexte immédiat indiquent l’exécution du jugement, sans qu’il soit nécessaire d’ajouter au texte la nature précise des calamités.
- issue: Portée collective de ἄνθρωπον
  choice: « les gens d’Israël et de Juda » désigne collectivement la population.
  alternative: « l’homme d’Israël et de Juda » ou « les hommes d’Israël et de Juda ».
  rationale: Le singulier grec est collectif et comprimé. Un singulier littéral serait obscur en français, tandis que « les hommes » pourrait être compris comme excluant les femmes alors que la portée contextuelle vise la population.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination répétée du grec est légèrement allégée sans supprimer aucune catégorie. « Accomplir la parole » conserve une tonalité biblique naturelle ; « dirigeants » et « les gens » évitent les archaïsmes.
