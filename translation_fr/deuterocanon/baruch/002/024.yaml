base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/024.yaml
  text: And we did not listen to your voice to serve the king of Babylon[a], and you have fulfilled your words that you spoke by the hands of your servants the prophets[c][b], that the bones of our kings and the bones of our fathers would be brought out from their place.
translation:
  language: fr
  text: 'Nous n’avons pas écouté ta voix, qui nous demandait de servir le roi de Babylone[a], et tu as accompli les paroles que tu avais prononcées par l’intermédiaire de tes serviteurs, les prophètes[b] : les ossements de nos rois et ceux de nos ancêtres seraient retirés de leur lieu[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nous n’avons pas obéi à ta voix ». L’expression grecque parle littéralement d’écouter la voix de Dieu ; dans ce contexte, cette écoute implique l’obéissance.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « par les mains de tes serviteurs, les prophètes », expression signifiant « par l’intermédiaire de tes serviteurs, les prophètes ».'
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire de leur lieu de sépulture ; le grec dit seulement « de leur lieu ».
    reason: cultural_note
lexical_decisions:
- source_word: ἠκούσαμεν τῆς φωνῆς σου
  choice: nous n’avons pas écouté ta voix
  rationale: Conserve l’image auditive grecque tout en laissant entendre, dans le contexte, le refus d’obéir.
- source_word: ἐργάσασθαι τῷ βασιλεῖ Βαβυλῶνος
  choice: servir le roi de Babylone
  rationale: Avec le datif de personne, le verbe désigne ici le service rendu au roi, dans le cadre de la soumission politique exigée.
- source_word: ἔστησας τοὺς λόγους σου
  choice: tu as accompli les paroles
  rationale: Dans ce contexte de jugement annoncé puis réalisé, ἵστημι exprime la confirmation effective des paroles divines.
- source_word: ἐν χερσὶν τῶν παίδων σου τῶν προφητῶν
  choice: par l’intermédiaire de tes serviteurs, les prophètes
  rationale: Rend naturellement en français l’idiome grec d’agence « par les mains de », sans lui donner un sens matériel.
- source_word: παίδων σου
  choice: tes serviteurs
  rationale: Dans ce cadre prophétique, παῖς désigne les personnes chargées d’une mission par Dieu plutôt que des enfants.
- source_word: τοῦ ἐξενεχθῆναι τὰ ὀστᾶ
  choice: les ossements … seraient retirés
  rationale: Le conditionnel exprime naturellement le contenu prospectif des paroles prophétiques, tandis que le passif grec est conservé.
- source_word: τὰ ὀστᾶ τῶν πατέρων ἡμῶν
  choice: ceux de nos ancêtres
  rationale: « Ancêtres » rend ici πατέρες dans son sens générationnel; le pronom évite une répétition lourde d’« ossements ».
- source_word: ἐκ τοῦ τόπου αὐτῶν
  choice: de leur emplacement
  rationale: Maintient l’indétermination de τόπος; le contexte funéraire est expliqué en note plutôt qu’introduit dans le texte.
theological_decisions:
- issue: Expliciter l’obéissance dans la première proposition
  choice: nous n’avons pas écouté ta voix
  alternative: nous n’avons pas obéi à ta voix
  rationale: Le contexte implique la désobéissance, mais le grec conserve l’image de l’écoute; la traduction préserve cette texture biblique.
- issue: Décrire le rapport entre Dieu et la réalisation du jugement annoncé
  choice: tu as accompli les paroles
  alternative: tu as confirmé les paroles / tu as mis à exécution les paroles
  rationale: « Accompli » indique que l’avertissement prophétique s’est réalisé, sans ajouter de précision doctrinale étrangère au verset.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement divin est maintenu. La syntaxe explicite que la voix de Dieu demandait de servir le roi, tandis que les notes conservent les idiomes et les ambiguïtés pertinents du grec.
