revisions:
- from: 'Nous n’avons pas écouté ta voix, qui nous demandait de servir le roi de Babylone[a]. Alors tu as accompli les paroles que tu avais prononcées par l’intermédiaire de tes serviteurs, les prophètes[b] : les ossements de nos rois et ceux de nos ancêtres seraient retirés de leur emplacement[c].'
  to: 'Nous n’avons pas écouté ta voix, qui nous demandait de servir le roi de Babylone[a], et tu as accompli les paroles que tu avais prononcées par l’intermédiaire de tes serviteurs, les prophètes[b] : les ossements de nos rois et ceux de nos ancêtres seraient retirés de leur lieu[c].'
  rationale: La révision remplace la conjonction interprétative « Alors » par « et », conformément au καί grec, et substitue « lieu » à « emplacement » afin de rendre τόπος de manière plus directe et idiomatique. Les notes sont ajustées en conséquence, sans modifier le sens du passage ni lever l’indétermination du grec.
