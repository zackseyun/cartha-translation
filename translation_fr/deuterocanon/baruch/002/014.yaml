lexical_decisions:
- source_word: εἰσάκουσον
  choice: Écoute
  rationale: Impératif de prière naturel en français, exprimant la demande d’une écoute favorable.
- source_word: δέησις
  choice: supplication
  rationale: Conserve la nuance d’une requête pressante et distingue le terme de προσευχή, « prière ».
- source_word: ἐξελοῦ
  choice: délivre-nous
  rationale: Rend le sens de tirer quelqu’un d’une situation de détresse ou de captivité.
- source_word: ἕνεκεν σοῦ
  choice: à cause de toi-même
  rationale: Préserve la formulation centrée sur Dieu sans préciser davantage le motif implicite, tel que son nom ou son honneur.
- source_word: χάριν κατὰ πρόσωπον
  choice: la faveur de
  rationale: Expression française naturelle pour l’idée de recevoir un accueil favorable auprès de quelqu’un.
- source_word: τῶν ἀποικισάντων ἡμᾶς
  choice: ceux qui nous ont déportés
  rationale: Le verbe désigne ici ceux qui ont déplacé la communauté en exil ; « déportés » exprime clairement la contrainte historique.
theological_decisions:
- issue: Motif de la délivrance dans ἕνεκεν σοῦ
  choice: à cause de toi-même
  alternative: pour l’honneur de ton nom
  rationale: Le grec dit littéralement « à cause de toi » et ne mentionne pas explicitement le nom ou l’honneur de Dieu ; la traduction conserve cette ouverture.
