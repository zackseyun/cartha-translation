base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/035.yaml
  text: And I will establish for them an everlasting covenant[a], that I may be their God and they may be my people; and I will no longer remove my people Israel from the land that I gave to them.
translation:
  language: fr
  text: 'J’établirai pour eux une alliance éternelle[a] : je serai leur Dieu et ils seront mon peuple. Je ne déplacerai plus mon peuple Israël hors du pays que je leur ai donné.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une alliance éternelle afin que je sois leur Dieu et qu’ils soient mon peuple ». En grec, une construction à l’infinitif peut indiquer ici le but ou le contenu de l’alliance.'
    reason: ambiguïté syntaxique
lexical_decisions:
- source_word: στήσω
  choice: J’établirai
  rationale: Le futur de ἵστημι désigne ici l’établissement ferme d’une alliance; « établir » est naturel et garde la solennité de la formule.
- source_word: διαθήκην αἰώνιον
  choice: une alliance éternelle
  rationale: Expression biblique usuelle qui rend la durée indéfinie et permanente portée par αἰώνιον.
- source_word: τοῦ εἶναί με αὐτοῖς εἰς θεόν
  choice: je serai leur Dieu
  rationale: Cette formulation française exprime naturellement le contenu ou le but de l’alliance, tout en conservant la formule d’appartenance réciproque.
- source_word: αὐτοὶ ἔσονταί μοι εἰς λαόν
  choice: ils seront mon peuple
  rationale: Rend clairement la réciprocité de la formule d’alliance et la valeur future explicite de ἔσονται.
- source_word: οὐ κινήσω ἔτι
  choice: Je ne déplacerai plus
  rationale: Avec ἀπό et un territoire, κινέω évoque le déplacement ou l’éloignement d’un peuple; « déplacer » reste proche du grec sans ajouter l’image plus forte d’un déracinement.
- source_word: τὸν λαόν μου Ἰσραήλ
  choice: mon peuple Israël
  rationale: Préserve naturellement en français l’apposition grecque et l’accent d’appartenance.
- source_word: ἀπὸ τῆς γῆς
  choice: hors du pays
  rationale: Dans ce contexte, γῆ désigne le territoire donné à Israël; « pays » évite le sens global de « terre » et s’accorde idiomatiquement avec l’idée de déplacement.
- source_word: ἧς ἔδωκα αὐτοῖς
  choice: que je leur ai donné
  rationale: Le passé composé français rend naturellement le don antérieur dont les effets demeurent pertinents.
theological_decisions:
- issue: Valeur de la proposition infinitive τοῦ εἶναί με αὐτοῖς εἰς θεόν
  choice: je serai leur Dieu et ils seront mon peuple
  alternative: afin que je sois leur Dieu et qu’ils soient mon peuple
  rationale: L’infinitif grec peut exprimer le but ou le contenu de l’alliance. La formulation au futur présente naturellement en français son contenu promis, tandis que la note conserve l’autre analyse possible.
- issue: Portée de οὐ κινήσω ἔτι concernant Israël dans le pays
  choice: Je ne déplacerai plus mon peuple Israël hors du pays
  alternative: Je n’arracherai plus mon peuple Israël au pays
  rationale: « Déplacer » traduit la cessation de l’éloignement territorial sans intensifier le grec par une métaphore d’arrachement ni imposer une construction doctrinale ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est fluide tout en conservant la formule solennelle de l’alliance et l’ambiguïté grecque dans une note.
