base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/027.yaml
  text: And you have dealt with us[a], Lord our God, according to all your forbearance and according to all your great compassion[b],
translation:
  language: fr
  text: Et tu as agi à notre égard, Seigneur notre Dieu, selon toute ta clémence[a] et selon toute ta grande compassion,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « indulgence » ou « patience » ; le terme grec évoque une bonté qui fait preuve de retenue.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησας εἰς ἡμᾶς
  choice: tu as agi envers nous
  rationale: La tournure grecque désigne la manière dont Dieu s’est comporté envers son peuple. « Agir envers nous » restitue naturellement l’idiome sans suggérer, comme « faire à notre égard », une action particulière non exprimée.
- source_word: Κύριε ὁ θεὸς ἡμῶν
  choice: Seigneur notre Dieu
  rationale: Cette formule d’adresse directe est rendue de façon traditionnelle, claire et fidèle. Le grec porte κύριος, non le nom divin hébreu.
- source_word: ἐπιεικίαν
  choice: clémence
  rationale: Dans cette prière, le terme évoque la douceur indulgente et la retenue miséricordieuse de Dieu. « Clémence » convient au contexte tout en restant distinct de οἰκτειρμός.
- source_word: οἰκτειρμόν τὸν μέγαν
  choice: ta grande compassion
  rationale: Οἰκτειρμός exprime la compassion ou la miséricorde. « Compassion » en conserve la nuance affective, tandis que « grande » traduit directement τὸν μέγαν.
- source_word: κατὰ πᾶσαν ... καὶ κατὰ πάντα
  choice: avec toute ... et toute
  rationale: Ici, κατὰ indique que l’action divine est conforme à sa clémence et à sa compassion. « Avec toute » est plus idiomatique en français moderne que la répétition littérale de « selon toute », tout en maintenant le parallélisme.
theological_decisions:
- issue: Maintien de deux termes voisins décrivant la bonté divine
  choice: Distinguer « clémence » et « compassion »
  alternative: Traduire les deux termes par « miséricorde » ou employer « indulgence » et « miséricorde »
  rationale: Le grec emploie deux noms différents. Les distinguer préserve l’ampleur rhétorique du texte sans leur attribuer une différence théologique technique.
- issue: Titre divin κύριος
  choice: Seigneur
  alternative: SEIGNEUR
  rationale: Le texte grec présente κύριος en adresse directe et non le tétragramme hébreu ; « Seigneur » est donc la forme appropriée.
translation_notes:
  register: Français moderne, digne et fluide, adapté à une prière confessionnelle. La phrase conserve la coordination et la virgule finale du verset grec, qui se poursuit au verset suivant.
