base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/029.yaml
  text: If you do not listen to my voice[b][a], surely this great and vast multitude will be reduced to a few among the nations where I will scatter them there.
translation:
  language: fr
  text: Si vous n’écoutez pas ma voix, cette foule, grande et nombreuse[a], sera assurément réduite à un petit nombre parmi les nations, là où je les disperserai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut désigner littéralement un « bourdonnement », un « grondement » ou un « tumulte ». Ici, la suite du verset indique vraisemblablement qu’il évoque la foule nombreuse du peuple.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec dit littéralement : « où je les disperserai, là ». La tournure « là où » en conserve l’insistance locative dans un français naturel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν μὴ ἀκούσητε τῆς φωνῆς μου
  choice: Si vous n’écoutez pas ma voix
  rationale: Le verbe ἀκούω suivi du génitif de « voix », dans cet avertissement d’alliance, implique une écoute attentive qui conduit à obéir. La tournure française conserve l’image de la voix divine sans la paraphraser.
- source_word: εἰ μὴν
  choice: assurément
  rationale: Cette locution donne à la conséquence annoncée une force solennelle et certaine.
- source_word: ἡ βόμβησις
  choice: cette foule
  rationale: Le sens premier peut être « bourdonnement », « grondement » ou « tumulte ». Toutefois, le passage d’une réalité « grande et nombreuse » à « un petit nombre » désigne ici, par métonymie, la masse du peuple.
- source_word: ἡ μεγάλη ἡ πολλὴ αὕτη
  choice: grande et nombreuse
  rationale: Les deux adjectifs sont conservés afin de rendre leur insistance cumulative. « Nombreuse » prépare naturellement le contraste avec « un petit nombre ».
- source_word: ἀποστρέψει εἰς μικρὰν
  choice: sera réduite à un petit nombre
  rationale: L’expression grecque, très condensée, indique que la grande foule deviendra peu nombreuse. Cette formulation française en explicite le sens sans ajouter de cause non exprimée.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: parmi les nations
  rationale: Dans le contexte de la dispersion d’Israël, ἔθνη désigne les peuples étrangers. « Nations » évite la connotation religieuse plus marquée de « païens ».
- source_word: οὗ διασπερῶ αὐτοὺς ἐκεῖ
  choice: là où je les disperserai
  rationale: La combinaison française « là où » restitue naturellement l’insistance locative du grec, qui emploie à la fois οὗ (« où ») et ἐκεῖ (« là »), sans produire une redondance artificielle.
theological_decisions:
- issue: Nature de la conséquence annoncée par Dieu
  choice: Comprendre l’énoncé comme l’annonce solennelle d’une forte diminution du peuple au milieu des nations.
  alternative: Prendre ἡ βόμβησις au sens strict de « bruit », « grondement » ou « tumulte », de sorte que ce serait le bruit qui deviendrait faible.
  rationale: Le contraste entre la réalité « grande et nombreuse » et « un petit nombre », ainsi que le pronom pluriel « les » dans l’annonce de la dispersion, favorise nettement une référence à la population. La traduction n’ajoute toutefois aucune précision doctrinale sur les modalités de ce jugement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste solennelle sans archaïsme. « Grande et nombreuse » conserve le double qualificatif grec, tandis que « là où » rend son insistance locative de façon idiomatique.
