translation:
  language: fr
  text: Seigneur, du haut de ta sainte demeure[a], regarde et prête attention à nous ; incline ton oreille, Seigneur, et écoute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « depuis ta sainte maison » ; on pourrait aussi comprendre : « depuis ton saint temple ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Seigneur
  rationale: Vocatif de κύριος. « Seigneur » conserve l’adresse directe et le registre de la prière sans qu’une particule vocative soit nécessaire en français.
- source_word: κάτιδε
  choice: regarde d’en haut
  rationale: L’impératif exprime un regard dirigé depuis le haut. Cette formulation préserve l’image verticale, que confirme la mention de la demeure sainte.
- source_word: ἐκ τοῦ οἴκου τοῦ ἁγίου σου
  choice: depuis ta sainte demeure
  rationale: οἶκος signifie littéralement « maison », mais désigne ici le lieu où Dieu demeure. « Demeure » reste proche du sens lexical tout en étant naturel en français et sans préciser indûment « temple ».
- source_word: ἐννόησον εἰς ἡμᾶς
  choice: porte ton attention sur nous
  rationale: Le verbe demande une considération attentive, et εἰς indique la direction de cette attention vers les suppliants. La tournure française rend cette nuance clairement.
- source_word: κλῖνον τὸ οὖς σου
  choice: incline ton oreille
  rationale: La traduction conserve l’image corporelle traditionnelle de la prière et son ton solennel, tout en restant compréhensible en français moderne.
- source_word: ἄκουσον
  choice: écoute
  rationale: L’impératif « écoute » rend naturellement l’appel adressé à Dieu et suggère une attention active.
theological_decisions:
- issue: Faut-il rendre οἶκος par « maison », « demeure » ou « temple » ?
  choice: demeure
  alternative: maison ; temple
  rationale: Le grec emploie οἶκος, non ναός. « Demeure » préserve l’idée du lieu où Dieu habite sans introduire le terme cultuel plus précis « temple » ; une note signale le sens littéral et l’autre possibilité contextuelle.
- issue: Faut-il conserver l’image de κλῖνον τὸ οὖς σου ?
  choice: incline ton oreille
  alternative: tends l’oreille ; écoute-nous
  rationale: La formulation retenue garde la métaphore et la gravité de la supplication, sans résoudre l’image en une simple paraphrase.
translation_notes:
  register: Français moderne, digne et accessible, avec un registre de prière légèrement élevé. Le tutoiement correspond à l’adresse biblique traditionnelle à Dieu et permet de conserver clairement les formes singulières grecques.
