  text: And we did not listen to his voice[b][a], to walk in the commandments of the Lord that he set before us.
translation:
  language: fr
  text: Et nous n’avons pas écouté sa voix[a], pour marcher selon les commandements du Seigneur qu’il a placés devant nous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous n’avons pas obéi à sa voix ». Le grec dit littéralement « nous n’avons pas écouté sa voix », expression biblique où écouter implique aussi tenir compte de ce qui est dit.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « qu’il a donnés devant notre face » ; c’est-à-dire qu’il les a placés devant nous.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσαμεν
  choice: nous n’avons pas écouté
  rationale: Le verbe ἀκούω peut exprimer le fait d’entendre, d’écouter ou d’obéir. Ici, « écouter » conserve l’image auditive tout en laissant entendre le refus de tenir compte de la parole divine.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: sa voix
  rationale: Cette traduction reprend explicitement l’expression grecque et préserve le caractère personnel de l’appel divin.
- source_word: πορεύεσθαι
  choice: marcher
  rationale: Dans ce contexte moral et scripturaire, « marcher » désigne la conduite de la vie et conserve la métaphore du texte source.
- source_word: τοῖς προστάγμασιν
  choice: selon les commandements
  rationale: πρόσταγμα désigne un ordre ou un commandement. Avec « marcher », la préposition « selon » produit un français naturel tout en exprimant une conduite réglée par ces commandements.
- source_word: Κυρίου
  choice: du Seigneur
  rationale: « Seigneur » est la traduction directe et traditionnelle de κύριος dans ce contexte.
- source_word: οἷς ἔδωκεν κατὰ πρόσωπον ἡμῶν
  choice: qu’il avait placés devant nous
  rationale: Le grec dit littéralement qu’il les a « donnés devant notre face ». « Placés devant nous » conserve l’image spatiale et exprime naturellement leur présentation au peuple.
theological_decisions:
- issue: Faut-il rendre ἠκούσαμεν par une simple perception auditive ou par l’obéissance ?
  choice: nous n’avons pas écouté
  alternative: nous n’avons pas obéi à sa voix
  rationale: « Écouté » maintient l’ambiguïté féconde de l’idiome biblique, où écouter implique prêter attention et obéir, sans remplacer l’image par son seul résultat.
- issue: Comment rendre la métaphore éthique de πορεύεσθαι ?
  choice: marcher selon les commandements
  alternative: vivre conformément aux commandements
  rationale: La formulation retenue conserve la métaphore biblique de la marche comme conduite de vie, tout en restant intelligible en français moderne.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore biblique de l’écoute et celle de la marche sont conservées sans rendre la syntaxe artificielle.
