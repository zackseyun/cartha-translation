base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/021.yaml
  text: 'Thus says the Lord: Bow your shoulder and serve the king of Babylon[c][b][a], and dwell on the land that I gave to your fathers.'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur : Courbez l’épaule[a] et travaillez pour le roi de Babylone ; demeurez[b] dans le pays que j’ai donné à vos pères[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pliez l’épaule. » L’image évoque la soumission à un service imposé.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « installez-vous » ou « restez ». Littéralement : « asseyez-vous » ; le verbe signifie ici résider dans le pays.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « vos ancêtres ». Le grec dit littéralement : « vos pères ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως εἶπεν Κύριος
  choice: Ainsi parle le Seigneur
  rationale: La forme grecque emploie l’aoriste (« a dit »), mais la formule prophétique française consacrée au présent rend naturellement la déclaration divine comme parole actuelle et souveraine.
- source_word: Κλίνατε τὸν ὦμον ὑμῶν
  choice: Courbez l’épaule
  rationale: Le grec nomme explicitement l’épaule. Cette expression concrète évoque la soumission à un service imposé, sans remplacer l’image par celle du cou ou du dos.
- source_word: ἐργάσασθε τῷ βασιλεῖ Βαβυλῶνος
  choice: travaillez pour le roi de Babylone
  rationale: ἐργάζομαι signifie fondamentalement travailler ou œuvrer. Dans ce contexte, « travailler pour » reste proche du grec tout en exprimant le service dû au roi.
- source_word: καθίσατε ἐπὶ τὴν γῆν
  choice: demeurez dans le pays
  rationale: Le verbe signifie littéralement « asseyez-vous », mais il désigne ici le fait de s’établir ou de résider. « Demeurez » restitue cet emploi idiomatique, et « dans le pays » est naturel en français.
- source_word: ἣν δέδωκα
  choice: que j’ai donné
  rationale: Le passé composé correspond bien au parfait grec, qui présente le don comme un acte accompli dont le résultat demeure.
- source_word: τοῖς πατράσιν ὑμῶν
  choice: à vos pères
  rationale: Le grec porte le nom masculin pluriel « pères ». Le conserver respecte la forme familiale explicite du texte ; « ancêtres » reste une possibilité de sens.
theological_decisions:
- issue: Rendu de Κύριος dans la formule prophétique
  choice: le Seigneur
  alternative: Seigneur
  rationale: « Le Seigneur » est le rendu français naturel de κύριος dans cette formule et maintient son autorité divine sans introduire une représentation typographique du tétragramme absente du texte grec fourni.
- issue: Portée du terme ancestral πατέρες
  choice: vos pères
  alternative: vos ancêtres
  rationale: Le choix principal conserve le terme masculin explicite du grec. La note signale la portée collective possible sans neutraliser silencieusement le texte.
- issue: Nature de l’obéissance au roi de Babylone
  choice: travaillez pour
  alternative: servez
  rationale: « Travaillez pour » conserve le sens lexical concret de ἐργάσασθε. « Servez » expliciterait davantage la soumission politique, déjà suggérée par l’image de l’épaule courbée.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La ponctuation distingue les deux impératifs coordonnés. Les images concrètes du grec sont conservées lorsqu’elles restent intelligibles, tandis que l’emploi idiomatique de καθίσατε est rendu naturellement.
