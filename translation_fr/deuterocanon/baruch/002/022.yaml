base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/022.yaml
  text: And if you do not listen to the voice of the Lord[a], to serve the king of Babylon[b],
translation:
  language: fr
  text: Et si vous n’écoutez pas la voix du Seigneur[a] pour servir le roi de Babylone[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « si vous ne prêtez pas attention à la voix du Seigneur » ; l’expression grecque implique l’obéissance, et non la simple perception auditive.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « pour travailler pour le roi de Babylone » ; il s’agit ici de se mettre à son service.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν μὴ ἀκούσητε
  choice: si vous n’écoutez pas
  rationale: Avec le génitif « de la voix », ἀκούω désigne l’écoute qui implique de prêter attention et d’obéir. « Écoutez » conserve l’image auditive grecque sans réduire explicitement l’expression à « obéissez ».
- source_word: τῆς φωνῆς
  choice: la voix
  rationale: Traduction directe de φωνή, qui préserve l’expression biblique plutôt que de l’aplatir en « commandement ».
- source_word: Κυρίου
  choice: du Seigneur
  rationale: Rendu français naturel du génitif Κυρίου dans l’expression définie « la voix du Seigneur ».
- source_word: ἐργάσασθαι
  choice: en servant
  rationale: ἐργάζομαι signifie littéralement « travailler », mais avec le datif d’une personne il exprime ici le fait de travailler pour elle, donc de la servir. Le gérondif relie naturellement ce service au contenu concret de l’écoute demandée.
- source_word: τῷ βασιλεῖ Βαβυλῶνος
  choice: le roi de Babylone
  rationale: Le génitif est rendu directement et clairement par « de Babylone ».
theological_decisions:
- issue: Rendre explicite ou non l’obéissance impliquée par ἀκούσητε
  choice: Conserver « écouter la voix du Seigneur » dans le texte principal
  alternative: « obéir au Seigneur » ou « prêter attention à la voix du Seigneur »
  rationale: L’expression grecque implique l’obéissance, tout en étant explicitement formulée en termes d’écoute. La traduction maintient cette image et son amplitude sémantique.
- issue: Rapport syntaxique de ἐργάσασθαι avec l’écoute de la voix du Seigneur
  choice: « en servant le roi de Babylone »
  alternative: « pour servir le roi de Babylone »
  rationale: L’infinitif précise en contexte la manière concrète d’écouter le Seigneur. « En servant » rend ce rapport sans faire du service un simple but ultérieur.
translation_notes:
  register: Français moderne, digne et accessible. La phrase reste ouverte par une virgule, conformément au caractère incomplet du verset grec isolé et à sa continuation dans le verset suivant.
