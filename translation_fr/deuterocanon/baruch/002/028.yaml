base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/028.yaml
  text: just as you spoke by the hand of your servant Moses[a], on the day when you commanded him to write your law before the sons of Israel, saying[b],
translation:
  language: fr
  text: 'comme tu l’as déclaré par la main de ton serviteur Moïse[a], le jour où tu lui as ordonné d’écrire ta loi devant les fils d’Israël[b], en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Par la main de » est un idiome biblique qui signifie « par l’intermédiaire de » ou « au moyen de ».
    reason: cultural_note
  - marker: b
    text: 'On peut aussi traduire : « les enfants d’Israël » ou « les Israélites ». Le grec dit littéralement « les fils d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὰ
  choice: comme
  rationale: Introduit la correspondance avec la parole divine citée ensuite; « comme » est naturel en français et conserve la relation au contexte précédent.
- source_word: ἐλάλησας
  choice: tu l’as déclaré
  rationale: Le verbe λαλέω signifie ici que Dieu a prononcé la parole qui suit. « Déclaré » convient au registre solennel sans ajouter une nuance doctrinale.
- source_word: ἐν χειρὶ
  choice: par la main de
  rationale: Conserve l’idiome biblique d’agence médiatisée; une note en explicite le sens pour le lectorat moderne.
- source_word: παιδός σου
  choice: ton serviteur
  rationale: Dans ce contexte, παῖς désigne Moïse en qualité de serviteur mandaté par Dieu, plutôt qu’un enfant ou un esclave au sens social strict.
- source_word: ἐν ἡμέρᾳ
  choice: le jour où
  rationale: Expression temporelle claire et idiomatique qui garde la mention explicite du jour.
- source_word: ἐντειλαμένου σου αὐτῷ
  choice: tu lui as ordonné
  rationale: Rend naturellement le génitif absolu et la force de l’ordre donné à Moïse.
- source_word: γράψαι
  choice: d’écrire
  rationale: Traduction directe de l’infinitif dépendant du verbe de commandement.
- source_word: τὸν νόμον σου
  choice: ta loi
  rationale: Dans le cadre mosaïque, « loi » est le sens contextuel le plus reconnaissable de νόμος.
- source_word: ἐναντίον
  choice: devant
  rationale: Avec des personnes, le terme signifie ici « en présence de », et non « contre ».
- source_word: υἱῶν Ἰσραήλ
  choice: les fils d’Israël
  rationale: Préserve la formulation masculine et l’image généalogique explicites du grec; la note signale l’équivalent collectif courant.
- source_word: λέγων
  choice: en disant
  rationale: Conserve le participe qui introduit la citation poursuivie au verset suivant.
theological_decisions:
- issue: Sens de παῖς appliqué à Moïse
  choice: ton serviteur
  alternative: ton enfant; ton esclave
  rationale: « Serviteur » exprime le rôle honorable d’agent mandaté qui convient ici, sans introduire une filiation ni insister indûment sur un statut servile.
- issue: Formulation genrée υἱῶν Ἰσραήλ
  choice: les fils d’Israël
  alternative: les enfants d’Israël; les Israélites
  rationale: La traduction maintient la forme masculine et généalogique du grec, tout en donnant en note l’équivalent collectif possible.
translation_notes:
  register: Français international moderne, digne et lisible, avec maintien mesuré de la texture biblique dans « par la main de » et « les fils d’Israël ». La phrase reste ouverte par les deux-points parce que la citation commence au verset suivant.
