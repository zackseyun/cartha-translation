base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/008.yaml
  text: And we did not entreat the favor of the Lord[b][a], that each one might turn from the thoughts of their evil heart.
translation:
  language: fr
  text: Et nous n’avons pas imploré la faveur du Seigneur[a], afin que le Seigneur détourne chacun des pensées[b] de son cœur mauvais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « nous n’avons pas imploré la face du Seigneur ». Cette expression désigne ici le fait de rechercher son accueil favorable ou sa miséricorde.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des intentions » ou « des desseins ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδεήθημεν τοῦ προσώπου Κυρίου
  choice: imploré la faveur du Seigneur
  rationale: Le verbe exprime une supplication pressante, tandis que « la face du Seigneur » est ici un idiome sémitisant qui évoque son accueil favorable et sa miséricorde. La formulation française conserve à la fois la supplication et la dimension relationnelle de l’expression.
- source_word: τοῦ ἀποστρέψαι
  choice: afin que … se détourne
  rationale: L’infinitif articulé exprime ici le but visé par la supplication. « Afin que » en restitue clairement la valeur, et la forme pronominale « se détourner » convient au mouvement de repentance.
- source_word: ἕκαστον
  choice: chacun
  rationale: « Chacun » préserve la portée distributive et individualisante du singulier grec.
- source_word: νοημάτων
  choice: pensées
  rationale: νόημα peut désigner les pensées, les intentions ou les desseins. « Pensées » garde une portée assez large sans exclure la volonté ni les projets intérieurs.
- source_word: καρδίας … πονηρᾶς
  choice: cœur mauvais
  rationale: « Cœur » conserve l’image anthropologique biblique du centre intérieur de la pensée et de la volonté; « mauvais » rend la qualification morale de πονηρός sans atténuation.
- source_word: αὐτῶν
  choice: son
  rationale: Après le distributif singulier « chacun », le possessif singulier est la tournure naturelle en français. Le pluriel grec renvoie collectivement aux différents membres du groupe.
theological_decisions:
- issue: Sens idiomatique de « la face du Seigneur »
  choice: la faveur du Seigneur
  alternative: la face du Seigneur; la présence du Seigneur
  rationale: Dans le contexte d’une supplication pénitentielle, l’expression désigne l’accueil favorable ou la miséricorde recherchée auprès de Dieu. « Faveur » évite une formulation obscure tout en maintenant cette nuance, signalée en note.
- issue: Le cœur comme siège des pensées mauvaises
  choice: les pensées de son cœur mauvais
  alternative: les intentions de son cœur mauvais; les desseins de son esprit mauvais
  rationale: La traduction garde l’image biblique du cœur sans réduire νόημα à un type précis de pensée ou de projet. La note conserve l’étendue lexicale possible.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le ton pénitentiel, le mouvement individuel de repentance et l’image biblique du cœur, tout en explicitant avec mesure l’idiome grec relatif à la « face » du Seigneur.
