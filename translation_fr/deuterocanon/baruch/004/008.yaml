  text: You forgot the eternal God who nourished you; you also grieved Jerusalem, who reared you.
translation:
  language: fr
  text: Vous avez oublié le Dieu éternel qui vous a nourris, et vous avez aussi attristé Jérusalem, qui vous a élevés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπελάθεσθε
  choice: Vous avez oublié
  rationale: Le verbe signifie oublier ou perdre le souvenir de quelqu’un. Le passé composé exprime naturellement en français moderne le reproche porté par l’aoriste.
- source_word: τὸν τροφεύσαντα ὑμᾶς
  choice: qui vous a nourris
  rationale: τροφεύω évoque l’action de nourrir et, plus largement, de prendre soin en faisant grandir. « Nourris » conserve cette image de sollicitude sans la réduire à la seule éducation.
- source_word: θεὸν αἰώνιον
  choice: le Dieu éternel
  rationale: Cette formulation française naturelle rend l’épithète attributive αἰώνιον et affirme la permanence de Dieu.
- source_word: ἐλυπήσατε
  choice: vous avez attristé
  rationale: λυπέω signifie causer de la tristesse ou du chagrin. « Attristé » est actuel, clair et convient à Jérusalem personnifiée.
- source_word: δὴ καὶ
  choice: et vous avez aussi
  rationale: « Aussi » garde la valeur additive de καί, tandis que l’enchaînement de la phrase porte suffisamment l’insistance de δή.
- source_word: τὴν ἐκθρέψασαν ὑμᾶς
  choice: qui vous a élevés
  rationale: ἐκτρέφω désigne le fait de nourrir jusqu’à la maturité, d’élever. Ce choix distingue le rôle éducateur et maternel de Jérusalem de l’action de nourrir attribuée à Dieu.
- source_word: Ἰερουσαλήμ
  choice: Jérusalem
  rationale: Le nom propre est conservé sous sa forme française habituelle; le participe féminin maintient sa personnification.
theological_decisions:
- issue: Personnification maternelle de Jérusalem
  choice: « Jérusalem, qui vous a élevés »
  alternative: « votre mère Jérusalem »
  rationale: Le participe féminin présente Jérusalem comme une figure personnelle qui élève ses enfants, mais le grec ne contient pas explicitement le mot « mère »; il ne faut donc pas l’ajouter.
- issue: Épithète divine αἰώνιον
  choice: « le Dieu éternel »
  alternative: « le Dieu qui demeure à jamais »
  rationale: « Éternel » est concis, idiomatique et préserve la portée de l’attribut sans en préciser indûment la nuance temporelle.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme entre Dieu qui nourrit et Jérusalem qui élève est préservé. L’accord au masculin pluriel de « nourris » et « élevés » suit l’usage générique traditionnel lorsque le groupe destinataire est mixte ou non précisé.
