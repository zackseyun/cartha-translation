base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/027.yaml
  text: Take courage[a], children, and cry out to God, for you will be remembered by the one who brought this upon you.
translation:
  language: fr
  text: Prenez courage, enfants, et criez vers Dieu, car celui qui a fait venir cela sur vous se souviendra de vous.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « car il y aura souvenir de vous par celui qui fait venir [cela] sur vous ». Le grec laisse l’objet du participe implicite.'
    reason: La note rend compte de la construction nominale ἔσται … μνεία, de la valeur présente du participe ἐπάγοντος et de l’objet non exprimé en grec.
lexical_decisions:
- source_word: Θαρρήσατε
  choice: Prenez courage
  rationale: L’impératif aoriste pluriel appelle les destinataires à retrouver assurance et hardiesse. « Prenez courage » est naturel, actuel et conserve la force exhortative.
- source_word: τέκνα
  choice: mes enfants
  rationale: Le vocatif pluriel signifie « enfants ». En français, « mes enfants » est la forme d’adresse naturelle dans la bouche de la figure maternelle qui parle ici ; le possessif explicite une relation déjà donnée par le contexte sans restreindre le groupe selon le genre.
- source_word: βοήσατε
  choice: criez
  rationale: L’impératif de βοάω désigne un cri intense, ici tourné vers Dieu comme appel au secours. « Criez vers Dieu » en garde la vigueur mieux que « appelez Dieu ».
- source_word: πρὸς τὸν θεόν
  choice: vers Dieu
  rationale: La préposition exprime l’orientation du cri. « Vers Dieu » reste idiomatique en français tout en conservant cette nuance directionnelle.
- source_word: ἔσται ... μνεία
  choice: se souviendra de vous
  rationale: La tournure grecque signifie littéralement « il y aura souvenir de vous ». La reformulation verbale est plus naturelle en français et maintient la promesse future ; la construction littérale est signalée en note.
- source_word: ὑπὸ τοῦ ἐπάγοντος
  choice: celui qui a fait venir tout cela sur vous
  rationale: Le participe substantivé désigne indirectement l’agent qui fait venir l’épreuve ou le malheur. « Tout cela » restitue l’objet sous-entendu d’après le contexte, et le passé composé convient au jugement déjà subi sans nommer explicitement cet agent.
theological_decisions:
- issue: Identité de « celui qui a fait venir [cela] sur vous »
  choice: 'Maintenir la désignation indirecte : « celui qui a fait venir tout cela sur vous »'
  alternative: Nommer explicitement Dieu comme celui qui a envoyé le malheur et qui se souviendra du peuple
  rationale: La proposition précédente nomme Dieu et le contexte présente le malheur comme un jugement divin, mais le grec emploie ici un participe substantivé plutôt que de répéter θεός. La traduction conserve donc cette indirectivité et la tension entre jugement et souvenir miséricordieux.
- issue: Valeur temporelle du participe présent ἐπάγοντος
  choice: « qui a fait venir »
  alternative: « qui fait venir »
  rationale: Le participe présent grec peut caractériser l’agent de l’action sans imposer en français une action strictement simultanée. Dans le contexte d’un malheur déjà survenu, le passé composé est naturel, tandis que l’identité de l’agent et les effets de son action demeurent actuels.
translation_notes:
  register: Français international moderne, digne et accessible. « Mes enfants » constitue une adresse française naturelle dans le contexte maternel ; « criez vers Dieu » conserve l’intensité et l’orientation du grec. La phrase reste fluide tout en reportant en note la syntaxe grecque plus littérale.
