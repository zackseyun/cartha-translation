lexical_decisions:
- source_word: Θάρσει
  choice: Prends courage
  rationale: L’impératif appelle Jérusalem à retrouver courage et confiance. « Prends courage » est naturel en français moderne et conserve la force de l’exhortation.
- source_word: Ἰερουσαλήμ
  choice: Jérusalem
  rationale: Forme française usuelle du nom de la ville, ici personnifiée et directement interpellée.
- source_word: παρακαλέσει
  choice: te consolera
  rationale: Dans le contexte de l’affliction de Jérusalem, le futur de παρακαλέω exprime avant tout la consolation et le réconfort, plutôt qu’un simple encouragement.
- source_word: ὁ ὀνομάσας σε
  choice: celui qui t’a donné ton nom
  rationale: Le participe aoriste substantivé désigne personnellement l’auteur de cette nomination. Cette formulation française rend explicitement l’acte de nommer sans ajouter de titre divin absent du grec.
theological_decisions:
- issue: Identification de « celui qui t’a donné ton nom »
  choice: Conserver une désignation descriptive sans ajouter « Dieu » ni « le Seigneur » dans le texte principal.
  alternative: « le Seigneur qui t’a donné ton nom » ou « Dieu, qui t’a donné ton nom »
  rationale: Le contexte désigne clairement Dieu comme celui qui a nommé Jérusalem et qui la consolera, mais le grec n’emploie ici aucun nom ni titre divin. La formulation descriptive préserve cette particularité et sa portée littéraire.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement correspond à l’adresse directe à Jérusalem personnifiée. « Donner son nom » est plus idiomatique ici que le littéral « nommer », tout en conservant l’idée de l’acte fondateur exprimé par le grec.
