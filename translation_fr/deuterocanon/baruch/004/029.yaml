base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/029.yaml
  text: For the one who brought evils upon you will bring you everlasting gladness with your salvation[a][b].
translation:
  language: fr
  text: Car celui qui a fait venir sur vous les malheurs fera venir pour vous la joie éternelle[a], avec votre salut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’allégresse éternelle ».
    reason: lexical_alternative
  - marker: b
    text: Ou « votre délivrance ». Le mot grec peut désigner le salut ou la délivrance.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ … ἐπαγαγὼν
  choice: celui qui a fait venir
  rationale: Cette tournure rend le participe aoriste substantivé et conserve l’action causative sans atténuer l’intervention de l’agent.
- source_word: τὰ κακὰ
  choice: les malheurs
  rationale: Dans ce contexte de souffrances collectives, « les malheurs » exprime naturellement les calamités visées. L’article grec est rendu sans ajouter le démonstratif « ces », absent du texte source.
- source_word: ἐπάξει
  choice: fera venir
  rationale: 'La reprise de « faire venir » conserve le parallèle délibéré avec ἐπαγαγών : le même agent fait venir les malheurs puis la joie.'
- source_word: τὴν αἰώνιον εὐφροσύνην
  choice: la joie éternelle
  rationale: « Joie » est une formulation française actuelle et digne pour εὐφροσύνη ; « éternelle » rend directement αἰώνιον.
- source_word: μετὰ τῆς σωτηρίας ὑμῶν
  choice: avec votre salut
  rationale: La formulation garde le lien simple exprimé par μετά et la portée théologique possible de σωτηρία, sans exclure son sens contextuel de délivrance.
theological_decisions:
- issue: Agent du jugement et du rétablissement
  choice: Le même agent fait venir les malheurs et fera venir la joie éternelle avec le salut.
  alternative: Atténuer la première action en parlant seulement de malheurs subis ou permis.
  rationale: Le grec attribue explicitement les deux actions au même agent. La traduction maintient cette tension théologique sans la résoudre ni l’adoucir.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition « a fait venir / fera venir » est volontaire afin de reproduire le parallèle verbal grec. « Pour vous » rend le datif ὑμῖν dans la seconde proposition sans suggérer que la joie serait un malheur venant « sur » les destinataires.
