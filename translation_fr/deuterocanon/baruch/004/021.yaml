base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/021.yaml
  text: Take courage[a], children; cry out to God, and he will deliver you from oppression[b], from the hand of enemies.
translation:
  language: fr
  text: Prenez courage, enfants ! Criez vers Dieu, et il vous délivrera de l’oppression, de la main de vos ennemis[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans la Bible, « la main » représente souvent le pouvoir ou l’emprise exercés sur quelqu’un.
    reason: cultural_note
lexical_decisions:
- source_word: Θαρρεῖτε
  choice: Prenez courage
  rationale: L’impératif pluriel exhorte directement à la confiance et au courage. « Prenez courage » est naturel, actuel et conserve cette force exhortative.
- source_word: τέκνα
  choice: enfants
  rationale: Le vocatif pluriel désigne les enfants sans nuance exclusivement masculine. Aucun possessif n’est ajouté, puisqu’il n’y en a pas dans le grec.
- source_word: βοήσατε πρὸς τὸν θεόν
  choice: Criez vers Dieu
  rationale: Le verbe exprime un appel pressant, et πρὸς en indique le destinataire ou la direction. « Criez vers Dieu » convient à une supplication urgente.
- source_word: ἐξελεῖται
  choice: il vous délivrera
  rationale: Le futur moyen de ἐξαιρέω annonce une délivrance ou un sauvetage. « Délivrera » garde le sens clair et le registre biblique sans surinterprétation.
- source_word: ἐκ δυναστείας
  choice: de l’oppression
  rationale: δυναστεία peut désigner la puissance, la domination ou l’exercice oppressif du pouvoir. Dans ce contexte hostile, « oppression » est idiomatique et conserve la valeur négative.
- source_word: ἐκ χειρὸς ἐχθρῶν
  choice: de la main de vos ennemis
  rationale: La formulation conserve l’image biblique concrète de la « main », qui représente ici le pouvoir exercé par les ennemis. Le possessif français explicite naturellement que ce sont les ennemis des destinataires.
theological_decisions:
- issue: Promesse de délivrance divine
  choice: et il vous délivrera
  alternative: et il vous sauvera
  rationale: Le grec promet directement une intervention future de Dieu. « Délivrera » exprime cette action sans préciser davantage sa nature ni lui ajouter une portée doctrinale absente du verset.
- issue: Rapport entre « oppression » et « main des ennemis »
  choice: maintien des deux compléments successifs
  alternative: 'fusion explicative : « de l’oppression exercée par vos ennemis »'
  rationale: Le texte grec juxtapose les deux expressions. Les conserver évite de décider si la seconde reformule précisément la première ou lui ajoute un aspect complémentaire.
translation_notes:
  register: Français international moderne, direct et digne. La ponctuation souligne les deux impératifs, tandis que la répétition « de… de… » respecte la structure grecque et préserve la relation légèrement ouverte entre l’oppression et la main des ennemis.
