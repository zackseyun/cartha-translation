base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/015.yaml
  text: For he brought against them a nation from far away[a], a shameless and foreign-speaking nation, which showed no respect for the old man and had no mercy on the child[b],
translation:
  language: fr
  text: Car il fit venir contre eux une nation lointaine, une nation effrontée et de langue étrangère[a], qui n’eut aucun respect pour le vieillard et aucune pitié pour l’enfant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : «une nation parlant une autre langue».'
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie au singulier «le vieillard» et «l’enfant», comme figures représentatives des personnes vulnérables.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπήγαγεν ἐπʼ αὐτοὺς
  choice: fit venir contre eux
  rationale: Rend le mouvement hostile causé par le sujet tout en restant naturel en français.
- source_word: ἔθνος μακρόθεν
  choice: une nation lointaine
  rationale: Exprime l’origine éloignée de la nation sans alourdir la phrase; «venue de loin» serait également possible.
- source_word: ἀναιδές
  choice: effrontée
  rationale: Conserve l’idée fondamentale d’absence de honte et d’audace insolente, plutôt que de substituer l’effet plus interprétatif de «cruelle».
- source_word: ἀλλόγλωσσον
  choice: de langue étrangère
  rationale: Rend directement le composé grec désignant un peuple qui parle une autre langue.
- source_word: οὐκ ᾐσχύνθησαν πρεσβύτην
  choice: n’eut aucun respect pour le vieillard
  rationale: Communique la portée idiomatique de l’absence de déférence envers une personne âgée.
- source_word: οὐδὲ παιδίον ἠλέησαν
  choice: et aucune pitié pour l’enfant
  rationale: Préserve le parallélisme et le sens d’ἐλεέω, montrer de la pitié ou de la compassion.
theological_decisions:
- issue: Singuliers représentatifs désignant les personnes vulnérables
  choice: le vieillard… l’enfant
  alternative: les vieillards… les enfants; les personnes âgées… les petits enfants
  rationale: Le grec emploie πρεσβύτην et παιδίον au singulier. Le maintien du singulier respecte la force rhétorique représentative et évite d’élargir silencieusement le texte.
- issue: Sujet grammatical de la proposition relative
  choice: qui n’eut aucun respect…
  alternative: eux qui n’eurent aucun respect…
  rationale: L’antécédent immédiat est «une nation» au singulier, tandis que les verbes grecs sont au pluriel selon une construction de sens. Le français peut naturellement reprendre la nation au singulier sans modifier la responsabilité collective.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. «Effrontée» garde la valeur lexicale de l’absence de honte; «vieillard» maintient le masculin singulier précis du grec. La ponctuation finale conserve la continuité syntaxique probable avec le verset suivant.
