  text: For you provoked the one who made you by sacrificing to demons and not to God.
translation:
  language: fr
  text: Car vous avez provoqué celui qui vous a faits en offrant des sacrifices aux démons et non à Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρωξύνατε
  choice: vous avez provoqué
  rationale: L’aoriste actif indique l’offense causée par l’idolâtrie. « Provoqué » conserve la valeur causative du verbe sans préciser davantage l’émotion suscitée.
- source_word: τὸν ποιήσαντα ὑμᾶς
  choice: celui qui vous a faits
  rationale: Cette formulation suit de près le participe substantivé grec tout en restant naturelle. Le pluriel « faits » s’accorde avec le complément « vous », qui désigne plusieurs personnes.
- source_word: θύσαντες
  choice: en offrant des sacrifices
  rationale: Le participe aoriste exprime ici le moyen par lequel ils ont provoqué leur Créateur. Cette tournure explicite naturellement l’acte sacrificiel en français.
- source_word: δαιμονίοις
  choice: aux démons
  rationale: Dans ce contexte juif grec de sacrifice idolâtre, le terme désigne des êtres spirituels hostiles associés aux faux cultes, et non de simples divinités secondaires neutres.
- source_word: καὶ οὐ θεῷ
  choice: et non à Dieu
  rationale: Les datifs parallèles indiquent les destinataires des sacrifices. La traduction conserve directement le contraste grec.
theological_decisions:
- issue: Référent et portée de δαιμονίοις dans le contexte des sacrifices idolâtres
  choice: démons
  alternative: esprits mauvais ; puissances idolâtres
  rationale: « Démons » préserve l’affirmation théologique du texte, qui associe les sacrifices idolâtres à des êtres spirituels opposés à Dieu, sans réduire cette affirmation à une simple métaphore.
translation_notes:
  register: Français international moderne, digne et direct. La structure causale introduite par « Car » et le contraste sacrificiel sont conservés. Aucun terme confessionnel particulier n’est ajouté.
