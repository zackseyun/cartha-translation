lexical_decisions:
- source_word: δείλαιοι
  choice: Malheureux
  rationale: Exprime leur état misérable et donne à la phrase une tonalité de lamentation ou de malheur, sans en faire explicitement une malédiction formelle.
- source_word: οἱ σε κακώσαντες
  choice: ceux qui t’ont fait du mal
  rationale: Rend largement et naturellement l’idée de causer du tort ou de maltraiter, sans limiter le sens à une atteinte physique.
- source_word: ἐπιχαρέντες
  choice: se sont réjouis
  rationale: Équivalent direct qui conserve l’idée de joie prise au malheur d’autrui; le complément « de ta chute » porte la nuance hostile.
- source_word: τῇ σῇ πτώσει
  choice: de ta chute
  rationale: Conserve la métaphore grecque de la chute tout en étant idiomatique en français; dans le contexte, il s’agit de la ruine de Jérusalem.
