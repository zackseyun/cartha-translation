revisions:
- from: Car, de même que les peuples voisins de Sion ont vu maintenant votre captivité, de même ils verront bientôt le salut qui vient de votre Dieu[a] et qui vous arrivera avec une grande gloire et l’éclat de l’Éternel[b].
  to: Car, de même que les voisins de Sion ont maintenant vu votre captivité, de même ils verront bientôt le salut[a] venant de votre Dieu, qui vous parviendra avec une grande gloire et l’éclat de l’Éternel[b].
  rationale: La révision retire l’ajout interprétatif « peuples », distingue explicitement la provenance divine du salut de son arrivée aux destinataires, et replace la note lexicale sur le terme qu’elle explique. Elle conserve le parallélisme, le registre élevé mais accessible et l’ambiguïté sémantique légitime du grec.
  reviewer_model: gpt-5.6-terra
