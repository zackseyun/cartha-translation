review_pass:
  verdict: revise
  source_fidelity: La structure comparative, la captivité, la proximité temporelle, le salut provenant de Dieu, la gloire et le titre divin sont bien rendus. Toutefois, « peuples voisins » ajoute l’idée de peuples, absente de πάροικοι, qui désigne plus simplement les voisins ou habitants des environs. La coordination « le salut qui vient de votre Dieu et qui vous arrivera » affaiblit aussi la distinction grecque entre la provenance du salut (παρὰ τοῦ θεοῦ) et sa venue aux destinataires (ἐπελεύσεται ὑμῖν).
  naturalness: La formulation révisée conserve un français moderne, fluide et digne. « Vous parviendra » exprime naturellement l’arrivée promise sans les connotations potentiellement défavorables de « viendra sur vous ».
  terminology: « Salut », « captivité », « gloire », « éclat » et « l’Éternel » sont appropriés. La note sur σωτηρία doit être ancrée à « salut », et l’alternative proposée pour τοῦ αἰωνίου est rendue plus directement.
  issues:
  - severity: medium
    issue: « les peuples voisins » surinterprète οἱ πάροικοι.
    rationale: Le grec désigne ceux qui habitent près de Sion; il ne spécifie pas qu’il s’agit de peuples distincts. « Les voisins de Sion » préserve l’ambiguïté et correspond à l’audit anglais.
  - severity: medium
    issue: La provenance et l’arrivée du salut sont fusionnées dans « qui vient de votre Dieu et qui vous arrivera ».
    rationale: παρὰ τοῦ θεοῦ ὑμῶν qualifie le salut comme venant de Dieu, tandis que ἣ ἐπελεύσεται ὑμῖν affirme que ce salut parviendra aux destinataires. Une formulation distincte reflète mieux la syntaxe grecque.
  - severity: low
    issue: L’ancre de la note a est placée après « Dieu ».
    rationale: La note porte sur σωτηρία, traduit par « salut »; elle doit donc être attachée à ce mot.
