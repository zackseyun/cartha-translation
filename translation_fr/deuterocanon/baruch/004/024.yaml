base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/024.yaml
  text: For just as the neighbors of Zion have now seen your captivity[b][a], so they will soon see the salvation from your God that will come upon you with great glory and the splendor of the Eternal.
translation:
  language: fr
  text: Car, de même que les voisins de Sion ont maintenant vu votre captivité, de même ils verront bientôt le salut[a] venant de votre Dieu, qui vous parviendra avec une grande gloire et l’éclat de l’Éternel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la délivrance ». Le grec σωτηρία peut désigner le salut, la délivrance ou le secours.
    reason: lexical_alternative
  - marker: b
    text: Ou « Celui qui est éternel ». Le grec emploie ici comme titre un adjectif substantivé signifiant « éternel ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πάροικοι Σειὼν
  choice: les peuples voisins de Sion
  rationale: πάροικοι désigne ici ceux qui habitent auprès de Sion. « Les peuples voisins » exprime naturellement les populations environnantes qui sont témoins de son sort, sans leur attribuer le statut juridique d’étrangers résidents.
- source_word: αἰχμαλωσίαν
  choice: captivité
  rationale: Le nom désigne l’état de ceux qui ont été emmenés captifs. « Captivité » conserve ce sens concret, plus précisément que « exil ».
- source_word: ἐν τάχει
  choice: bientôt
  rationale: Dans cette promesse tournée vers l’avenir, l’expression indique qu’un événement surviendra dans peu de temps.
- source_word: σωτηρίαν
  choice: salut
  rationale: σωτηρία peut désigner le salut, la délivrance ou le secours. « Salut » conserve la portée biblique du terme tout en convenant à la restauration promise dans le contexte.
- source_word: παρὰ τοῦ θεοῦ ὑμῶν
  choice: qui vient de votre Dieu
  rationale: παρά avec le génitif marque ici la provenance. La formulation française rattache clairement cette origine au salut.
- source_word: ἐπελεύσεται ὑμῖν
  choice: qui vous arrivera
  rationale: ἐπέρχομαι signifie venir ou survenir à quelqu’un. « Vous arrivera » garde l’idée d’une intervention qui atteint les destinataires sans suggérer nécessairement une menace.
- source_word: μετὰ δόξης μεγάλης
  choice: avec une grande gloire
  rationale: Dans ce contexte divin, δόξα porte naturellement le sens biblique de « gloire ».
- source_word: λαμπρότητος
  choice: l’éclat
  rationale: λαμπρότης évoque l’éclat, la splendeur ou la magnificence. « Éclat » reste concret et évite une répétition trop proche de « gloire ».
- source_word: τοῦ αἰωνίου
  choice: de l’Éternel
  rationale: L’adjectif substantivé fonctionne comme un titre divin. « L’Éternel » en restitue la force nominale sans répéter le mot « Dieu », absent de ce groupe grec.
theological_decisions:
- issue: Sens de σωτηρία dans un contexte de restauration
  choice: salut
  alternative: délivrance
  rationale: Le contexte immédiat concerne la fin de la captivité, mais le terme grec possède une portée biblique plus large. « Salut » préserve cette tension, tandis qu’une note signale le sens concret possible.
- issue: Valeur de τοῦ αἰωνίου comme titre divin
  choice: l’Éternel
  alternative: Celui qui demeure éternellement
  rationale: Le grec emploie un adjectif substantivé. Le titre français « l’Éternel » est concis, digne et n’ajoute pas explicitement un nom que le texte ne répète pas.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme « de même que… de même… » reproduit la structure grecque. « Peuples voisins » explicite sobrement la portée collective probable de πάροικοι, et les deux notes conservent les principales possibilités lexicales et théologiques.
