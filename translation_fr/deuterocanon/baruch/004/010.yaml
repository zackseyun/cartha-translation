base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/010.yaml
  text: For behold[a], the captivity of my sons and daughters[b], which the Everlasting One brought upon them.
translation:
  language: fr
  text: Car voici la captivité[a] de mes fils et de mes filles, que l’Éternel[b] a fait venir sur eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’exil de mes fils et de mes filles ». Le grec peut désigner plus largement la condition des captifs, notamment leur déportation en exil.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « celui qui est éternel »; le grec emploie ici un titre divin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: Car voici
  rationale: « Car » conserve le lien explicatif de γάρ, tandis que « voici » rend naturellement la particule d’attention ἰδού dans un registre biblique digne mais accessible.
- source_word: τὴν αἰχμαλωσίαν
  choice: la captivité
  rationale: Le terme désigne la captivité résultant d’une conquête et peut inclure la déportation en exil. « Captivité » garde explicitement l’idée de contrainte.
- source_word: τῶν υἱῶν μου καὶ τῶν θυγατέρων
  choice: de mes fils et de mes filles
  rationale: Le grec nomme expressément les fils et les filles; la traduction préserve cette paire au lieu de la réduire à « mes enfants ».
- source_word: ἣν ἐπήγαγεν αὐτοῖς
  choice: que … a fait venir sur eux
  rationale: Cette formulation conserve la valeur causative de ἐπάγω et son complément, sans atténuer l’attribution de l’événement.
- source_word: ὁ αἰώνιος
  choice: l’Éternel
  rationale: 'L’adjectif substantivé fonctionne comme un titre divin: « celui qui est éternel ». « L’Éternel » est concis, naturel en français et n’ajoute pas le nom « Dieu », absent du grec.'
theological_decisions:
- issue: Rendu du titre divin ὁ αἰώνιος
  choice: l’Éternel
  alternative: Celui qui est éternel
  rationale: Le texte emploie un titre distinct plutôt que κύριος ou θεός. « L’Éternel » en préserve la fonction divine et la notion d’éternité, tandis que la note signale un rendu plus littéral.
- issue: Attribution de la captivité à Dieu
  choice: que l’Éternel a fait venir sur eux
  alternative: qui leur est venue de la part de l’Éternel
  rationale: Le sujet grammatical de ἐπήγαγεν est explicitement le titre divin. La traduction maintient cette attribution directe sans l’expliquer ni l’adoucir.
translation_notes:
  register: Français international moderne, digne et lisible. « Car voici » maintient à la fois l’enchaînement explicatif et l’appel à l’attention. La structure demeure proche du grec sans produire de calque pesant.
