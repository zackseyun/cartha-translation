  text: You were sold to the nations, not for destruction; but because you provoked God to anger, you were handed over to your adversaries.
translation:
  language: fr
  text: Vous avez été vendus aux nations, non pour la destruction ; mais, parce que vous avez provoqué la colère de Dieu, vous avez été livrés à vos adversaires.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπράθητε
  choice: vous avez été vendus
  rationale: L’aoriste passif de πιπράσκω exprime le fait d’être vendu. Cette formulation conserve la métaphore du passage sous une domination étrangère sans en préciser indûment le mécanisme.
- source_word: τοῖς ἔθνεσιν
  choice: aux nations
  rationale: Dans ce contexte d’exil et de jugement, ἔθνη désigne les nations étrangères. « Nations » est transparent et évite la coloration théologique que pourrait avoir « païens ».
- source_word: οὐκ εἰς ἀπώλειαν
  choice: non pour votre perte
  rationale: εἰς avec ἀπώλεια peut exprimer le but ou l’aboutissement. « Votre perte » conserve l’idée de ruine ou de destruction sans imposer le sens plus précis d’anéantissement.
- source_word: διὰ δὲ τὸ παροργίσαι ὑμᾶς τὸν θεόν
  choice: mais parce que vous avez provoqué Dieu à la colère
  rationale: La construction διά avec l’infinitif substantivé est causale. « Provoquer Dieu à la colère » restitue la force de παροργίζω tout en gardant Dieu comme objet explicite.
- source_word: παρεδόθητε
  choice: vous avez été livrés
  rationale: Le passif de παραδίδωμι indique qu’ils ont été remis au pouvoir d’autrui. « Livrés » est naturel en français biblique moderne et conserve la nuance de jugement.
- source_word: τοῖς ὑπεναντίοις
  choice: à vos adversaires
  rationale: ὑπεναντίος désigne ceux qui se dressent contre quelqu’un. « Adversaires » rend précisément cette opposition sans généraliser en « ennemis ».
theological_decisions:
- issue: Nature de l’exil et du jugement d’Israël
  choice: Le fait d’avoir été vendus aux nations n’avait pas pour fin leur perte, mais leur remise aux adversaires est présentée comme la conséquence d’avoir provoqué Dieu à la colère.
  alternative: Comprendre explicitement l’exil comme un châtiment disciplinaire destiné à la restauration.
  rationale: Le grec oppose expressément « non pour la perte » à la cause donnée ensuite. La traduction maintient cette tension sans développer une doctrine de la discipline ou de la restauration que le verset n’énonce pas entièrement.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme passif « avez été vendus / avez été livrés » est conservé. « Non pour votre perte » rend la concision du grec tout en indiquant clairement que la perte concerne les destinataires.
