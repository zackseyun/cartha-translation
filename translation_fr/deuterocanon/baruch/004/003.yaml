  text: Do not give your glory to another[b][a], nor what benefits you to a foreign nation.
translation:
  language: fr
  text: Ne donne pas ta gloire à un autre[a], ni ce qui est dans ton intérêt à une nation étrangère[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ton honneur » : le grec peut exprimer l’un ou l’autre sens ici.'
    reason: lexical_alternative
  - marker: b
    text: Ou « ce qui contribue à ton bien-être » ou « tes avantages ».
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δῷς
  choice: Ne donne pas
  rationale: Rend directement la défense exprimée par μή suivi de l’aoriste subjonctif, sans renforcer le verbe en « livrer » ou « abandonner ».
- source_word: ἑτέρῳ
  choice: à un autre
  rationale: Conserve la formulation concise et le contraste du grec ἕτερος.
- source_word: τὴν δόξαν σου
  choice: ta gloire
  rationale: δόξα peut signifier « gloire » ou « honneur ». « Gloire » maintient ici la portée élevée et l’indétermination du référent.
- source_word: τὰ συμφέροντά σοι
  choice: ce qui t’est avantageux
  rationale: Le neutre pluriel substantivé désigne ce qui est profitable ou bénéfique au destinataire, sans préciser s’il s’agit de biens matériels, politiques ou spirituels.
- source_word: ἔθνει ἀλλοτρίῳ
  choice: à une nation étrangère
  rationale: ἔθνος désigne ici une nation, tandis que ἀλλότριος indique qu’elle est étrangère ou extérieure au peuple concerné.
theological_decisions:
- issue: Sens de « ta gloire »
  choice: Conserver « ta gloire » sans en préciser le référent.
  alternative: « ton honneur », « la gloire que Dieu t’a donnée » ou « ton privilège d’alliance »
  rationale: Le grec ne définit pas explicitement cette gloire. La formulation retenue préserve l’ampleur et l’ambiguïté théologiques du texte.
- issue: Sens de τὰ συμφέροντά σοι
  choice: Employer la formulation générale « ce qui t’est avantageux ».
  alternative: « ton bien-être », « tes avantages » ou « ce qui t’est profitable »
  rationale: L’expression grecque reste large; la traduction ne la limite donc ni à la prospérité matérielle ni au bien spirituel.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier reproduit les formes σου et σοι. La structure parallèle de l’interdiction grecque est conservée, avec une légère explicitation française dans « ce qui t’est avantageux ».
