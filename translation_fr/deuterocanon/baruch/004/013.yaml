base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/013.yaml
  text: and they did not know his righteous decrees[a], nor did they walk in the ways of God's commandments[b], nor did they step onto the paths of discipline in his righteousness.
translation:
  language: fr
  text: Ils n’ont pas connu ses justes prescriptions ; ils n’ont pas marché dans les voies des commandements de Dieu, et ils n’ont pas posé le pied sur les sentiers de l’instruction[a] dans sa justice[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « discipline » : le grec παιδεία désigne une formation qui comporte à la fois enseignement et correction.'
    reason: lexical_alternative
  - marker: b
    text: Ou « dans sa droiture ». La relation exacte de cette expression avec les mots précédents demeure compacte en grec.
    reason: alternative_reading
lexical_decisions:
- source_word: δικαιώματα
  choice: justes prescriptions
  rationale: Le terme désigne des prescriptions ou ordonnances normatives. « Justes prescriptions » conserve à la fois sa portée morale et juridique ainsi que l’écho de la racine δικαι-.
- source_word: ἔγνωσαν
  choice: n’ont pas connu
  rationale: Cette formulation garde le sens direct de γινώσκω sans le réduire à une simple compréhension intellectuelle.
- source_word: ἐπορεύθησαν
  choice: n’ont pas marché
  rationale: Avec « voies », le verbe exprime métaphoriquement la conduite; « marcher » préserve cette image biblique tout en restant clair.
- source_word: ὁδοῖς ἐντολῶν θεοῦ
  choice: dans les voies des commandements de Dieu
  rationale: La formulation maintient la structure génitivale du grec et la force morale et religieuse de ἐντολαί.
- source_word: τρίβους
  choice: sentiers
  rationale: « Sentiers » rend l’idée de chemins tracés et distingue τρίβοι du précédent ὁδοί, traduit par « voies ».
- source_word: παιδίας (παιδεία)
  choice: instruction
  rationale: Dans ce contexte sapientiel, παιδεία désigne une formation morale qui comprend enseignement et correction. « Instruction » met en avant cette formation sans la limiter à la punition.
- source_word: ἐν δικαιοσύνῃ αὐτοῦ
  choice: dans sa justice
  rationale: La traduction reste proche de la construction compacte du grec et conserve son ambiguïté d’attachement, tout en employant le français naturel « justice » pour δικαιοσύνη dans ce contexte.
- source_word: ἐπέβησαν
  choice: n’ont pas posé le pied sur
  rationale: Cette expression restitue l’image concrète de ἐπιβαίνω, « monter sur, poser le pied sur », et convient à des sentiers.
theological_decisions:
- issue: Sens de παιδεία
  choice: instruction
  alternative: discipline
  rationale: « Instruction » exprime ici la formation morale et sapientielle; « discipline » demeure possible et souligne davantage la correction.
- issue: Traduction de δικαιοσύνη
  choice: justice
  alternative: droiture
  rationale: « Justice » est le correspondant français le plus direct et courant dans cette expression. « Droiture » ferait davantage ressortir la qualité morale, mais préciserait un sens que la formulation grecque laisse ouvert.
- issue: Rattachement de ἐν δικαιοσύνῃ αὐτοῦ
  choice: maintien de la formule « dans sa justice » après « instruction »
  alternative: rattachement explicite soit aux sentiers, soit à l’action de poser le pied
  rationale: Le grec est compact et n’impose pas de façon absolument univoque la relation syntaxique de ce complément; la traduction évite donc de la résoudre silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme négatif du grec est conservé, ainsi que les images distinctes des « voies » et des « sentiers ». La ponctuation avant « dans sa justice » signale la construction compacte sans imposer un rattachement théologique précis.
