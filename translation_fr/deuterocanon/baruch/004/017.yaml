  text: But as for me, how am I able to help you?
translation:
  language: fr
  text: Mais moi, comment puis-je vous aider ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ
  choice: Mais moi
  rationale: Le pronom explicite ἐγώ est conservé sous la forme détachée « moi », qui porte naturellement l’emphase en français. δέ marque ici un contraste modéré, rendu par « mais ».
- source_word: τί
  choice: comment
  rationale: Dans cette construction avec δυνατή et l’infinitif, τί introduit une question sur la possibilité d’apporter de l’aide ; « comment » restitue naturellement la portée rhétorique plutôt que le littéral « quoi ».
- source_word: δυνατὴ
  choice: pourrais-je
  rationale: L’adjectif exprime la capacité. Le conditionnel dans la question « comment pourrais-je » rend idiomatiquement l’idée d’impuissance suggérée par le contexte, sans ajouter une négation absente du grec.
- source_word: βοηθῆσαι
  choice: aider
  rationale: Le verbe signifie apporter du secours ou de l’aide. « Aider » est direct, courant et fidèle.
- source_word: ὑμῖν
  choice: vous
  rationale: Le pronom datif pluriel désigne les personnes auxquelles la locutrice s’adresse ; « vous » en conserve le nombre selon l’usage français.
