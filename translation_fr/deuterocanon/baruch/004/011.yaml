  text: For I nourished them with gladness, but I sent them away with weeping and mourning.
translation:
  language: fr
  text: Car je les ai nourris dans la joie, mais je les ai envoyés au loin dans les pleurs et le deuil.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθρεψα
  choice: je les ai nourris
  rationale: Le verbe τρέφω peut signifier nourrir, entretenir ou élever. « Nourris » conserve à la fois l’idée de subsistance et celle de soins maternels sans préciser excessivement.
- source_word: μετʼ εὐφροσύνης
  choice: dans la joie
  rationale: Εὐφροσύνη exprime la joie ou l’allégresse. « Dans la joie » rend naturellement en français la circonstance affective introduite par μετά.
- source_word: ἐξαπέστειλα
  choice: je les ai laissés partir
  rationale: Dans ce contexte de séparation douloureuse, ἐξαποστέλλω évoque leur départ loin de la locutrice. « Laissés partir » exprime cette séparation sans suggérer qu’elle les aurait chassés ou congédiés.
- source_word: μετὰ κλαυθμοῦ
  choice: dans les pleurs
  rationale: Κλαυθμός désigne les pleurs ou les lamentations. Cette formulation française est naturelle et maintient le parallélisme avec « dans la joie ».
- source_word: πένθους
  choice: le deuil
  rationale: Πένθος désigne une profonde affliction, souvent manifestée comme un deuil. « Le deuil » conserve la force émotionnelle et la dimension publique du terme.
theological_decisions:
- issue: Voix maternelle de la locutrice et contexte de l’exil
  choice: Les verbes à la première personne sont traduits sans expliciter l’identité de la locutrice ni ajouter une mention de l’exil.
  alternative: Ajouter que la mère voit ses enfants partir en exil.
  rationale: Le grec met directement en contraste la joie avec laquelle les enfants ont été nourris et la douleur de leur départ, mais ne nomme pas l’exil dans ce verset. La traduction préserve cette retenue et la tension du contexte.
translation_notes:
  register: Français international moderne, simple et digne. Le contraste syntaxique entre la joie initiale et les pleurs du départ est maintenu. Aucun marqueur de note n’est requis.
