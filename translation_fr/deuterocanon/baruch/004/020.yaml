base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/020.yaml
  text: I have taken off the robe of peace[a], but I have put on the sackcloth of my supplication[b]; I will cry out to the Eternal One in my days.
translation:
  language: fr
  text: J’ai ôté la robe de paix et revêtu le sac de ma supplication[b] ; je crierai vers l’Éternel[a] durant mes jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « celui qui est éternel ». Le grec emploie ici « l’éternel » comme titre divin.
    reason: lexical_alternative
  - marker: b
    text: Le « sac » était un vêtement grossier porté en signe de deuil, de repentance ou de profonde détresse.
    reason: cultural_note
lexical_decisions:
- source_word: ἐξεδυσάμην
  choice: J’ai ôté
  rationale: L’aoriste moyen exprime ici le fait d’enlever de soi un vêtement. « J’ai ôté » est naturel, digne et maintient la métaphore vestimentaire.
- source_word: τὴν στολὴν τῆς εἰρήνης
  choice: la robe de paix
  rationale: στολή désigne une robe ou un long vêtement ; le génitif « de paix » conserve l’image métaphorique sans la développer.
- source_word: ἐνεδυσάμην
  choice: revêtu
  rationale: Le verbe répond directement à « ôté ». « Revêtu » garde ce parallélisme vestimentaire dans un registre français courant et soutenu.
- source_word: σάκκον τῆς δεήσεώς μου
  choice: le sac de ma supplication
  rationale: « Sac » désigne le vêtement grossier porté dans le deuil ou la détresse. La construction avec « de ma supplication » préserve le génitif et l’image condensée du grec plutôt que de l’expliciter.
- source_word: κεκράξομαι
  choice: je crierai
  rationale: Le futur exprime un appel intense et audible. « Crierai vers » conserve la force de κράζω et l’orientation de l’appel.
- source_word: τὸν αἰώνιον
  choice: l’Éternel
  rationale: L’adjectif substantivé désigne ici Dieu comme « celui qui est éternel ». « L’Éternel » conserve le titre distinctif sans le remplacer par « Dieu » ou « Seigneur ».
- source_word: ἐν ταῖς ἡμέραις μου
  choice: durant mes jours
  rationale: Cette formulation rend la locution temporelle littéralement sans ajouter l’idée de totalité qu’introduirait « tous mes jours ».
theological_decisions:
- issue: Rendu du titre divin τὸν αἰώνιον
  choice: l’Éternel
  alternative: Celui qui est éternel ; l’Éternel à jamais
  rationale: Le grec emploie un adjectif substantivé, sans θεός ni κύριος. Le choix retient donc un titre divin personnel et distinctif, tout en signalant en note son sens littéral.
- issue: Relation exprimée par « le sac de ma supplication »
  choice: Maintien du génitif métaphorique
  alternative: le sac en signe de supplication
  rationale: La relation exacte entre le vêtement de deuil et la supplication reste condensée dans le grec. La traduction ne précise pas artificiellement s’il s’agit du motif, du signe ou de l’accompagnement de la supplication.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme vestimentaire (« ôté… revêtu ») et les génitifs imagés du grec sont conservés. Les marqueurs de note sont placés sur les termes auxquels les notes se rapportent, en corrigeant l’inversion apparente de la couche de consultation anglaise.
