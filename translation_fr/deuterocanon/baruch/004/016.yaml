  source_fidelity: La première proposition rend fidèlement καὶ ἀπήγαγον τοὺς ἀγαπητοὺς τῆς χήρας. Dans la seconde, « privée de ses filles » exprime bien le résultat, mais ne reproduit pas aussi clairement la relation séparative de ἀπὸ τῶν θυγατέρων ni l’ambiguïté de τὴν μόνην. La révision conserve l’image de la veuve, sa désolation et son isolement, sans identifier la personnification.
  naturalness: « Êtres chers » est plus naturel en français international actuel que l’adjectif substantivé « bien-aimés », qui peut évoquer un registre ecclésial ou amoureux. « Loin de ses filles » est fluide, poétique et compréhensible, tout en gardant l’idée de séparation.
  terminology: « Veuve », « êtres chers », « désolée » et « seule » maintiennent le registre poétique et affectif du grec. Aucune explicitation doctrinale de la veuve comme Jérusalem ou Sion n’est introduite.
