  text: And they carried away the widow’s beloved ones[a], and from among her daughters they left her desolate and alone.
translation:
  language: fr
  text: Ils ont emmené les êtres chers de la veuve et, loin de ses filles, ils l’ont laissée désolée et seule.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, la seconde proposition est ambiguë : « et, d’entre ses filles, ils ont rendu désolée la seule [femme] ». Le grec τὴν μόνην peut désigner la veuve comme « seule » ou « l’unique / la seule restante » ; le sens général est qu’elle a été laissée désolée et seule, séparée de ses filles.'
    reason: ambiguïté syntaxique et lexicale
lexical_decisions:
- source_word: ἀπήγαγον
  choice: ont emmené
  rationale: Le verbe exprime le fait de conduire ou d’emmener des personnes, ici vraisemblablement en captivité, sans que le français précise indûment les circonstances.
- source_word: τοὺς ἀγαπητούς
  choice: les bien-aimés
  rationale: L’adjectif substantivé désigne les êtres aimés de la veuve et conserve la force affective du grec.
- source_word: τῆς χήρας
  choice: de la veuve
  rationale: Le génitif est rendu naturellement et maintient sans l’expliciter la personnification poétique de Jérusalem ou de Sion.
- source_word: ἀπὸ τῶν θυγατέρων
  choice: privée de ses filles
  rationale: Avec le verbe de désolation, ἀπό marque ici la séparation ou la privation. Cette formulation française rend clairement le résultat sans ajouter l’idée qu’une seule fille aurait été épargnée.
- source_word: τὴν μόνην
  choice: seule
  rationale: L’expression féminine singulière qualifie la veuve dans son état d’isolement; « seule » est idiomatique tout en préservant la nuance de « l’unique » possible dans la construction grecque.
- source_word: ἠρήμωσαν
  choice: l’ont laissée… privée
  rationale: Le verbe signifie rendre désert, désoler ou priver. La tournure résultative française restitue ici la détresse personnelle de la veuve plutôt qu’une dévastation matérielle.
theological_decisions:
- issue: Personnification de la veuve et de ses filles
  choice: Conserver directement l’image familiale de la veuve et de ses filles.
  alternative: Remplacer la veuve par Jérusalem ou Sion dans le texte principal.
  rationale: Le grec présente une personnification poétique; l’expliciter dans la traduction réduirait la portée de l’image.
- issue: Rapport syntaxique entre « seule », « ses filles » et « laissée dans la désolation »
  choice: Comprendre la veuve comme celle qui est laissée seule et privée de ses filles.
  alternative: Rendre plus littéralement τὴν μόνην par « l’unique » ou rattacher l’expression aux filles.
  rationale: Le féminin singulier renvoie le plus naturellement à la veuve déjà mentionnée, tandis que ἀπὸ τῶν θυγατέρων exprime la séparation; une note conserve toutefois l’ambiguïté formelle du grec.
translation_notes:
  register: Français international actuel, digne et lisible. « Bien-aimés » conserve la tonalité affective et poétique; la seconde proposition est légèrement restructurée pour rendre en français naturel la séparation et la désolation exprimées par le grec.
