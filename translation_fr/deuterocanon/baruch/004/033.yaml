base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/033.yaml
  text: For just as she rejoiced over your fall and was glad over your downfall[b][a], so she will grieve over her own desolation.
translation:
  language: fr
  text: Car, de même qu’elle s’est réjouie de ta chute et s’est réjouie de ta ruine[a][b], de même elle s’attristera de sa propre dévastation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom féminin « elle » renvoie vraisemblablement à la ville ou à la nation ennemie évoquée dans le contexte, traditionnellement identifiée à Babylone.
    reason: cross_reference
  - marker: b
    text: Ou « effondrement ». Ici, le grec πτῶμα désigne une calamité ou une ruine, et non un cadavre.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ ... οὕτως
  choice: Car, de même que… de même
  rationale: Conserve à la fois la valeur explicative de γάρ et la structure comparative explicite de ὥσπερ… οὕτως.
- source_word: ἐχάρη
  choice: s’est réjouie
  rationale: Rend naturellement en français la réaction de joie malveillante exprimée par χαίρω.
- source_word: πτώσει
  choice: chute
  rationale: Préserve la métaphore concise de la chute ainsi que son lien sémantique avec le terme voisin πτώμα.
- source_word: εὐφράνθη
  choice: a éprouvé de la joie
  rationale: Maintient un parallélisme de sens sans reproduire exactement le même verbe français que pour ἐχάρη.
- source_word: πτώματί
  choice: ruine
  rationale: Dans ce contexte de calamité collective, le mot désigne la ruine ou l’effondrement, non un cadavre.
- source_word: λυπηθήσεται
  choice: s’attristera
  rationale: Exprime idiomatiquement la valeur future passive ou déponente et le renversement annoncé.
- source_word: ἑαυτῆς
  choice: sa propre
  rationale: Restitue la force réflexive du pronom grec en soulignant que la dévastation la frappera elle-même.
- source_word: ἐρημίᾳ
  choice: dévastation
  rationale: Dans ce contexte de jugement, le terme évoque un état ravagé et désolé plutôt qu’un désert au sens géographique.
theological_decisions:
- issue: Référent du sujet féminin dans le verset
  choice: Conserver les pronoms féminins « elle » et « sa » sans nommer le référent dans le texte principal.
  alternative: Identifier explicitement le sujet comme Babylone ou comme la ville ennemie.
  rationale: Le grec emploie le féminin singulier sans répéter ici le nom du référent. La formulation retenue préserve cette donnée et évite de trancher dans le corps du texte une identification fournie par le contexte.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme grec est conservé, ainsi que la distinction entre les deux expressions de joie et entre « chute » et « ruine ».
