base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/012.yaml
  text: Let no one gloat over me[a], a widow and abandoned by many; I have been left desolate because of the sins of my children, because they turned aside from the law of God.
translation:
  language: fr
  text: Que personne ne se réjouisse de mon malheur[a], moi qui suis veuve et abandonnée par beaucoup. J’ai été réduite à la désolation à cause des péchés de mes enfants, parce qu’ils se sont détournés de la loi de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne jubile à mes dépens ». Le verbe grec désigne le fait de se réjouir du malheur d’autrui.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεὶς ἐπιχαιρέτω μοι
  choice: Que personne ne se réjouisse de mon malheur
  rationale: Le subjonctif prohibitif est rendu naturellement par « Que personne ne… ». Le composé ἐπιχαίρω désigne ici la joie prise au malheur d’autrui; l’explicitation « de mon malheur » transmet cette nuance hostile sans recourir au familier « jubiler à mes dépens ».
- source_word: τῇ χήρᾳ
  choice: moi qui suis veuve
  rationale: L’apposition féminine décrit la condition de la locutrice. Cette formulation française conserve la personnification et le genre sans nommer explicitement Jérusalem.
- source_word: καταλειφθείσῃ ὑπὸ πολλῶν
  choice: abandonnée par beaucoup
  rationale: Le participe passif exprime le fait d’avoir été délaissée. « Par beaucoup » respecte l’indétermination de πολλῶν, sans la renforcer en « par tous ».
- source_word: ἠρημώθην
  choice: J’ai été laissée dans la désolation
  rationale: Le passif et l’état de dévastation ou d’isolement sont tous deux conservés dans une expression française claire et solennelle.
- source_word: διὰ τὰς ἁμαρτίας τῶν τέκνων μου
  choice: à cause des péchés de mes enfants
  rationale: διά avec l’accusatif marque la cause; τέκνα est inclusif et se traduit naturellement par « enfants ».
- source_word: ἐξέκλιναν ἐκ νόμου θεοῦ
  choice: ils se sont détournés de la loi de Dieu
  rationale: Le verbe exprime un écart hors d’une voie ou d’une norme. « Se détourner de » préserve l’image du mouvement et s’emploie naturellement avec « la loi de Dieu ».
theological_decisions:
- issue: Personnification collective de Jérusalem comme mère veuve et désolée
  choice: Conserver la première personne et les formes féminines sans identifier la locutrice dans le verset.
  alternative: Ajouter explicitement « Jérusalem » ou « Sion ».
  rationale: Le contexte permet d’identifier la locutrice, mais le grec de ce verset ne la nomme pas. Ne pas l’expliciter préserve la personnification telle qu’elle se présente dans le texte.
- issue: Lien causal entre les péchés des enfants et la désolation de la locutrice
  choice: Rendre directement le rapport causal par « à cause de » et « parce que ».
  alternative: Atténuer le rapport en parlant seulement de circonstances concomitantes.
  rationale: Les deux articulations grecques, διά avec l’accusatif puis διότι, expriment nettement la causalité et l’expliquent par l’abandon de la loi divine.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la plainte solennelle et la personnification féminine. « Se réjouir de mon malheur » est préféré dans le texte à « jubiler à mes dépens », plus idiomatique mais aussi légèrement plus expressif et familier.
