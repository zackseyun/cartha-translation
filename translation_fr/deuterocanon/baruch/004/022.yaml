base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/022.yaml
  text: For I have hoped in the Eternal One for your salvation, and joy has come to me from the Holy One because of the mercy that will quickly come to you from your eternal Savior.
translation:
  language: fr
  text: Car j’ai mis mon espérance dans l’Éternel pour votre salut, et la joie m’est venue du Saint à cause de la miséricorde qui vous parviendra rapidement de l’Éternel, votre Sauveur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῷ αἰωνίῳ / τοῦ αἰωνίου
  choice: l’Éternel / de l’Éternel
  rationale: Le même titre divin est rendu de façon cohérente aux deux occurrences; « l’Éternel » exprime ici la désignation substantivée sans alourdir la phrase.
- source_word: ἐπὶ ... τὴν σωτηρίαν ὑμῶν
  choice: pour votre salut
  rationale: La préposition avec l’objet de l’espérance indique ce en vue de quoi l’espérance est placée en Dieu; cette formulation conserve le lien sans préciser davantage la nuance.
- source_word: παρὰ τοῦ ἁγίου
  choice: du Saint
  rationale: Le titre divin substantivé est conservé sous une forme naturelle et digne en français.
- source_word: ἐπὶ τῇ ἐλεημοσύνῃ
  choice: à cause de la miséricorde
  rationale: Dans ce contexte, ἐλεημοσύνη désigne la compassion ou miséricorde divine plutôt que l’aumône.
- source_word: ἐν τάχει
  choice: bientôt
  rationale: L’expression annonce une venue prochaine et peut aussi évoquer la rapidité; « bientôt » est ici le français le plus naturel sans imposer une manière précise d’accomplissement.
- source_word: σωτῆρος ὑμῶν
  choice: votre Sauveur
  rationale: Rend directement le titre σωτήρ tout en maintenant son rapport avec les destinataires.
theological_decisions:
- issue: Rapport entre « l’Éternel » et « votre Sauveur »
  choice: « de l’Éternel, votre Sauveur »
  alternative: « de votre Sauveur éternel »
  rationale: La construction grecque τοῦ αἰωνίου σωτῆρος ὑμῶν peut formellement se lire comme « votre Sauveur éternel », mais la reprise de ὁ αἰώνιος, déjà employé comme titre divin au début du verset, favorise « l’Éternel, votre Sauveur ». La ponctuation explicite cette apposition sans introduire une distinction théologique étrangère au texte.
translation_notes:
  register: Français international moderne, fluide et digne. La répétition des titres divins (« l’Éternel », « le Saint », « votre Sauveur ») est préservée, ainsi que le mouvement entre espérance, joie et miséricorde promise.
