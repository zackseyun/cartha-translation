base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/034.yaml
  text: And I will take away from her the rejoicing of her many people[b][a], and turn her pride into mourning.
translation:
  language: fr
  text: Et je lui enlèverai la joie que lui procure sa nombreuse population[a], et je changerai son orgueil en deuil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la joie de sa grande foule ». Le grec peut désigner soit la joie que la ville tire de sa nombreuse population, soit la joie éprouvée par cette multitude.
    reason: lexical_alternative
  - marker: b
    text: Ou « sa hauteur » ou « son éclat ». Le terme grec peut évoquer aussi bien l’orgueil et l’arrogance qu’une splendeur affichée avec fierté.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιελῶ
  choice: je lui enlèverai
  rationale: Le futur de περιαιρέω exprime ici une action directe de retrait. La tournure française avec pronom indirect désigne naturellement la ville personnifiée.
- source_word: ἀγαλλίαμα
  choice: la joie
  rationale: Le nom désigne une vive allégresse ou jubilation. « La joie » est naturel en français moderne et convient au parallèle avec le deuil.
- source_word: τῆς πολυοχλίας
  choice: que lui procure sa nombreuse population
  rationale: πολυοχλία évoque une grande foule ou le fait d’être très peuplé. Cette formulation rend le génitif comme la source ou le fondement de la joie, sans réduire le sens aux seules foules présentes.
- source_word: ἀγαυρίαμα
  choice: orgueil
  rationale: Le terme peut désigner l’orgueil, la hauteur ou un éclat dont on se glorifie. « Orgueil » conserve la dimension d’exaltation fière sans imposer un sens exclusivement visuel.
- source_word: εἰς πένθος
  choice: en deuil
  rationale: εἰς marque le résultat ou le changement d’état. « Changer … en deuil » exprime clairement cette transformation en français.
theological_decisions:
- issue: Absence de verbe explicite dans le second membre grec
  choice: Expliciter le verbe sous-entendu par « je changerai »
  alternative: 'Conserver une construction elliptique : « et son orgueil en deuil »'
  rationale: Le grec repose sur le parallélisme et omet le second verbe. Son explicitation produit un français naturel tout en conservant l’action divine et le passage de l’orgueil au deuil.
- issue: Rapport du génitif τῆς πολυοχλίας à ἀγαλλίαμα
  choice: Comprendre la population nombreuse comme ce qui procure la joie
  alternative: « la joie de sa grande foule », où la foule serait celle qui se réjouit
  rationale: Le génitif demeure susceptible de plusieurs nuances. Le texte principal retient la joie tirée du caractère populeux de la ville, tandis que la note préserve l’autre lecture plausible.
translation_notes:
  register: Français international moderne, digne et accessible. La ville est personnifiée au féminin. L’explicitation « que lui procure » clarifie le génitif sans dissimuler son ambiguïté, signalée en note.
