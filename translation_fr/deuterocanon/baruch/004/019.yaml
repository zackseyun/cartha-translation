lexical_decisions:
- source_word: βαδίζετε
  choice: Partez
  rationale: Le verbe signifie littéralement « marcher » ou « aller ». Dans cette adresse pressante à des enfants qui s’éloignent, « partez » exprime naturellement l’ordre de se mettre en route; la répétition grecque est conservée.
- source_word: τέκνα
  choice: mes enfants
  rationale: τέκνα désigne les enfants sans distinction de sexe. Le possessif, naturel en français dans une apostrophe maternelle, explicite la relation déjà portée par le vocatif et le contexte.
- source_word: κατελείφθην
  choice: me voilà laissée
  rationale: Le passif indique que la locutrice a été laissée derrière. La tournure « me voilà » rend l’état qui en résulte sans renforcer le verbe jusqu’à « abandonnée ».
- source_word: ἔρημος
  choice: déserte
  rationale: ἔρημος peut évoquer ce qui est déserté, solitaire ou désolé. « Déserte » convient à Jérusalem personnifiée et maintient ensemble l’absence de ses enfants et son état de désolation.
theological_decisions:
- issue: Portée affective et concrète de l’état de la locutrice
  choice: me voilà laissée déserte
  alternative: je suis restée seule; j’ai été abandonnée
  rationale: La formulation retenue préserve la lamentation et l’image de Jérusalem privée de ses habitants, sans réduire ἔρημος à la seule solitude ni introduire la force supplémentaire d’un abandon délibéré.
translation_notes:
  register: Français international moderne, digne et direct. La répétition impérative est maintenue. L’accord féminin de « laissée » et « déserte » correspond à Jérusalem personnifiée comme une mère dans le contexte.
