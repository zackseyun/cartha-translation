  text: Go[a], children, go[b], for I have been left desolate.
translation:
  language: fr
  text: Allez[a], enfants, allez, car on m’a laissée déserte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Marchez, enfants, marchez » ; le verbe grec signifie littéralement « marcher », mais il sert ici d’ordre pressant de partir.
    reason: lexical_alternative
  - marker: b
    text: Ou « on m’a laissée seule » ou « on m’a laissée abandonnée ».
