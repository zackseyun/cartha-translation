base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/028.yaml
  text: For just as your mind was set on going astray from God[a], so, as you return, seek him ten times more.
translation:
  language: fr
  text: Car, de même que votre pensée s’est tournée vers l’égarement loin de Dieu, de même, en revenant à lui, cherchez-le dix fois plus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « multipliez par dix, en revenant pour le chercher » ; le grec laisse implicite ce qui doit être multiplié par dix.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διάνοια
  choice: esprit
  rationale: Le terme désigne ici la disposition intérieure ou l’orientation de la pensée. « Esprit » est naturel en français et maintient l’accent sur l’attitude intérieure du peuple.
- source_word: ἐγένετο … εἰς τὸ πλανηθῆναι
  choice: s’est porté à s’égarer
  rationale: Cette tournure exprime l’orientation prise par leur disposition intérieure. Elle rend le mouvement vers l’égarement sans imposer l’idée qu’une puissance extérieure les aurait nécessairement trompés.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: loin de Dieu
  rationale: Avec « s’égarer », « loin de Dieu » exprime clairement la séparation marquée par ἀπό dans un français idiomatique.
- source_word: δεκαπλασιάσατε
  choice: cherchez-le dix fois davantage
  rationale: Le verbe signifie littéralement « multiplier par dix », mais son complément est sous-entendu. La formulation française rattache naturellement l’intensification à la recherche de Dieu tout en signalant l’ellipse grecque en note.
- source_word: ἐπιστρέφοντες
  choice: en revenant à lui
  rationale: Le participe indique l’action concomitante au commandement et porte l’idée d’un retour vers Dieu ; le complément explicité est fourni par le contexte immédiat.
- source_word: ζητῆσαι αὐτόν
  choice: cherchez-le
  rationale: « Chercher Dieu » est une expression française claire et digne qui correspond au sens religieux courant de ζητέω.
theological_decisions:
- issue: Rapport entre l’impératif « multiplier par dix » et le retour à la recherche de Dieu
  choice: 'Comprendre l’impératif comme une intensification de la recherche de Dieu : « cherchez-le dix fois davantage »'
  alternative: « Multipliez par dix, en revenant pour le chercher »
  rationale: Le grec laisse implicite ce qui doit être multiplié par dix. La traduction principale restitue le sens contextuel sans préciser une pratique religieuse particulière, tandis que la note conserve la forme elliptique de l’original.
translation_notes:
  register: Français moderne, courant et digne. La structure comparative « de même que… de même… » conserve le parallélisme grec, tandis que la note rend visible l’ellipse inhabituelle de δεκαπλασιάσατε.
