base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/001.yaml
  text: This is the book of the commandments of God[a], and the law that endures forever; all who hold fast to it are for life, but those who forsake it will die.
translation:
  language: fr
  text: Voici le livre des commandements de Dieu, la Loi qui demeure pour toujours. Tous ceux qui restent attachés à ce livre vivront[a], mais ceux qui l’abandonnent mourront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tous ceux qui restent attachés à lui, pour la vie » ou « vers la vie ». Le grec emploie une expression elliptique; on peut aussi comprendre : « tous ceux qui restent attachés à lui ont la vie ».'
    reason: Le grec porte εἰς ζωὴν (« pour/vers la vie ») sans verbe exprimé; « vivront » rend l’antithèse de façon idiomatique, et la note conserve l’ellipse ainsi que son ambiguïté.
lexical_decisions:
- source_word: βίβλος
  choice: livre
  rationale: « Livre » est le terme français naturel pour un écrit faisant autorité et convient à l’expression « livre des commandements ».
- source_word: προσταγμάτων
  choice: commandements
  rationale: Le mot désigne des prescriptions revêtues d’autorité ; « commandements » exprime clairement leur origine divine et leur caractère normatif.
- source_word: νόμος
  choice: Loi
  rationale: Dans son parallélisme avec les commandements de Dieu, νόμος désigne la Loi divine plutôt qu’un simple enseignement. La majuscule signale cet emploi déterminé sans ajouter de précision confessionnelle.
- source_word: ὁ ὑπάρχων εἰς τὸν αἰῶνα
  choice: qui demeure pour toujours
  rationale: Cette formulation rend la continuité et la permanence exprimées par ὑπάρχων et εἰς τὸν αἰῶνα dans un français naturel.
- source_word: κρατοῦντες αὐτῆς
  choice: ceux qui s’y attachent
  rationale: κρατέω évoque le fait de tenir fermement et, au sens figuré, de rester fidèlement attaché. Le pronom « y » permet de renvoyer au contenu présenté comme livre et comme Loi sans alourdir la phrase.
- source_word: εἰς ζωὴν
  choice: vont vers la vie
  rationale: Le grec est elliptique, littéralement « vers/pour la vie ». « Vont vers la vie » conserve l’orientation exprimée par εἰς tout en donnant une phrase française intelligible ; la note signale l’ellipse et une autre traduction possible.
- source_word: καταλείποντες αὐτήν
  choice: ceux qui l’abandonnent
  rationale: καταλείπω exprime ici l’abandon de ce qui vient d’être présenté. « Abandonnent » garde la force volontaire du verbe sans archaïsme.
- source_word: ἀποθανοῦνται
  choice: mourront
  rationale: Le futur simple restitue directement le futur grec et maintient la netteté de l’opposition entre la vie et la mort.
theological_decisions:
- issue: Rendre l’ellipse « πάντες οἱ κρατοῦντες αὐτῆς, εἰς ζωὴν » sans supprimer son ambiguïté.
  choice: « Tous ceux qui s’y attachent vont vers la vie », avec une note.
  alternative: « Tous ceux qui s’y attachent vivront » ou, plus littéralement, « tous ceux qui s’y attachent, pour la vie ».
  rationale: La formulation retenue reste compréhensible en français et conserve l’idée d’orientation vers la vie portée par εἰς, sans assimiler silencieusement la proposition au futur explicite « mourront ».
- issue: Préserver l’opposition théologique entre ζωή et ἀποθανοῦνται.
  choice: « la vie … mourront »
  alternative: « le salut … périront »
  rationale: Le texte grec nomme explicitement la vie et l’action de mourir. Garder ces termes évite d’introduire une interprétation supplémentaire sur la nature de cette vie ou de cette mort.
- issue: Déterminer la portée de αὐτῆς / αὐτήν, pronoms féminins.
  choice: Employer « y » puis « l’ », dans un contexte où le livre et la Loi constituent une même réalité textuelle.
  alternative: Répéter explicitement « le livre » ou « la Loi ».
  rationale: Grammaticalement, le féminin grec renvoie naturellement à βίβλος, tandis que le sens vise le contenu normatif présenté aussitôt comme νόμος. La traduction évite de trancher artificiellement entre le document et la Loi qu’il contient.
translation_notes:
  register: Français international moderne, clair et digne. « Voici » introduit naturellement l’identification solennelle du livre. La phrase conserve le parallélisme entre commandements, Loi, vie et mort, sans archaïsmes ni terminologie propre à une confession.
