base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/025.yaml
  text: Children[a], endure patiently the wrath that has come upon you from God. The enemy pursued you, but you will soon see his destruction, and you will step upon their necks.
translation:
  language: fr
  text: Enfants, supportez patiemment la colère qui s’est abattue sur vous de la part de Dieu. L’ennemi t’a poursuivi, mais tu verras bientôt sa perte et tu poseras le pied sur leurs nuques[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec passe de l’adresse plurielle (« vous ») à l’adresse singulière (« t’ », « tu »). Il passe aussi de l’ennemi au singulier (« sa perte ») au pluriel (« leurs nuques »).
    reason: Signaler les changements de nombre inhabituels du texte grec, conservés dans la traduction.
lexical_decisions:
- source_word: τέκνα
  choice: Enfants
  rationale: Vocatif pluriel affectueux. « Enfants » conserve l’appel familial sans ajouter « mes », absent du grec.
- source_word: μακροθυμήσατε
  choice: supportez avec patience
  rationale: L’impératif appelle à une endurance patiente dans l’épreuve, et non à une simple attente passive.
- source_word: τὴν παρὰ τοῦ θεοῦ ἐπελθοῦσαν ὑμῖν ὀργήν
  choice: la colère qui vous est venue de la part de Dieu
  rationale: Cette formulation garde explicitement l’origine divine indiquée par παρὰ τοῦ θεοῦ et la venue de la colère sur les destinataires, sans la réduire à une conséquence impersonnelle.
- source_word: κατεδίωξέν σε
  choice: t’a pris en chasse
  rationale: Expression française actuelle qui rend la poursuite hostile. Le singulier de σε est conservé malgré le pluriel de l’adresse initiale.
- source_word: ὄψει αὐτοῦ τὴν ἀπώλειαν ἐν τάχει
  choice: tu verras bientôt sa perte
  rationale: « Bientôt » exprime naturellement l’imminence de ἐν τάχει; « sa perte » rend l’anéantissement ou la ruine de l’ennemi sans lourdeur.
- source_word: ἐπὶ τραχήλους αὐτῶν ἐπιβήσῃ
  choice: tu poseras le pied sur leurs nuques
  rationale: La traduction maintient l’image concrète de victoire et le pronom pluriel αὐτῶν, au lieu de la remplacer par une abstraction telle que « tu triompheras d’eux ».
theological_decisions:
- issue: Origine divine de la colère subie par le peuple
  choice: la colère est explicitement dite venir de la part de Dieu
  alternative: le châtiment qui vous a frappés
  rationale: Le grec attribue expressément à Dieu l’origine de la colère. La traduction conserve cette tension théologique sans l’atténuer ni interpréter ὀργή comme un simple « châtiment ».
- issue: Image de victoire sur les ennemis
  choice: tu poseras le pied sur leurs nuques
  alternative: tu triompheras d’eux
  rationale: L’image corporelle de domination appartient au texte grec; la conserver évite d’en affaiblir la force par une paraphrase abstraite.
- issue: Variations de nombre dans le verset
  choice: conserver le passage de l’adresse plurielle au singulier ainsi que de l’ennemi singulier aux ennemis pluriels
  alternative: harmoniser tous les pronoms au pluriel
  rationale: Ces variations sont présentes dans le grec et peuvent refléter une adresse collective personnifiée ainsi qu’un ennemi envisagé à la fois comme figure unique et comme groupe. Elles ne doivent pas être résolues silencieusement.
translation_notes:
  register: Français international moderne, digne et direct. « Supportez avec patience » garde la solennité de l’exhortation; « a pris en chasse » reste naturel tout en exprimant une poursuite hostile. Les changements de nombre, volontairement non harmonisés, sont expliqués en note.
