base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/014.yaml
  text: Let the neighboring women of Zion come, let the neighboring women come, and remember the captivity of my sons and daughters, which the Eternal One brought upon them.
translation:
  language: fr
  text: Que les voisines viennent[b], que les voisines de Sion viennent[a], et souvenez-vous de la captivité de mes fils et de mes filles, que l’Éternel a fait venir sur eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les résidentes étrangères de Sion », « celles qui séjournent à Sion » ou « les habitantes des environs de Sion ». Le mot grec peut désigner des personnes qui vivent à proximité ou qui résident en un lieu comme étrangères.
    reason: lexical_alternative
  - marker: b
    text: Le texte grec répète deux fois l’appel à venir, pour insister.
    reason: repetition
lexical_decisions:
- source_word: ἐλθάτωσαν
  choice: qu’elles viennent
  rationale: L’impératif aoriste à la troisième personne exprime ici une invitation pressante; cette tournure en restitue naturellement la valeur jussive en français.
- source_word: αἱ πάροικοι
  choice: les voisines
  rationale: Le féminin pluriel est explicite en grec. πάροικος peut désigner une personne qui habite à proximité, mais aussi une résidente étrangère ou de passage; « voisines » convient au contexte tout en laissant les autres sens en note.
- source_word: Σειών
  choice: Sion
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: μνήσθητε
  choice: souvenez-vous
  rationale: Rend directement l’impératif aoriste pluriel de μιμνῄσκομαι et maintient le passage de la troisième à la deuxième personne.
- source_word: τὴν αἰχμαλωσίαν
  choice: la captivité
  rationale: Le terme évoque le fait d’être emmené et retenu captif; « captivité » en conserve la force concrète.
- source_word: τῶν υἱῶν μου καὶ θυγατέρων
  choice: de mes fils et de mes filles
  rationale: La traduction conserve les deux termes distincts employés par le grec plutôt que de les fondre dans « enfants ».
- source_word: ὁ αἰώνιος
  choice: l’Éternel
  rationale: L’adjectif substantivé fonctionne comme un titre divin, « celui qui est éternel ». « L’Éternel » est ici employé comme titre, sans prétendre restituer un nom divin absent du grec.
- source_word: ἐπήγαγεν αὐτοῖς
  choice: a fait venir sur eux
  rationale: Cette formulation conserve l’idée littérale de faire venir quelque chose sur quelqu’un, sans renforcer le verbe en « infliger ».
theological_decisions:
- issue: Titre divin ὁ αἰώνιος
  choice: l’Éternel
  alternative: Celui qui est éternel; l’Éternel par excellence
  rationale: Le grec présente une épithète divine substantivée et non un nom propre. La traduction garde le poids du titre sans introduire explicitement le nom d’alliance.
- issue: Sens de αἱ πάροικοι
  choice: les voisines
  alternative: les résidentes étrangères; celles qui séjournent à Sion; les habitantes des environs
  rationale: Le contexte permet le sens de femmes vivant à proximité, tandis que le lexème peut également désigner des étrangères résidentes ou des personnes de passage. La note conserve cette ambiguïté.
- issue: Responsabilité divine dans la captivité
  choice: que l’Éternel a fait venir sur eux
  alternative: que l’Éternel leur a infligée
  rationale: La formulation maintient l’affirmation difficile du texte selon laquelle Dieu a fait venir cette captivité, sans l’atténuer ni accentuer sa causalité au-delà du verbe grec.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition du grec est conservée. Le féminin de αἱ πάροικοι est rendu explicitement, et l’ambiguïté lexicale est signalée en note.
