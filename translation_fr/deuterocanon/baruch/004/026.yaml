base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/026.yaml
  text: My pampered ones traveled rough roads[a]; they were carried off like a flock seized by enemies.
translation:
  language: fr
  text: Mes enfants élevés dans la douceur ont parcouru des chemins difficiles[a] ; ils ont été emmenés comme un troupeau arraché par des ennemis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des chemins rudes » ou « des sentiers accidentés ». Le grec peut évoquer à la fois un terrain difficile et un voyage éprouvant.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ τρυφεροί μου
  choice: Mes enfants élevés dans la douceur
  rationale: Le substantif adjectival avec le possessif désigne ceux qui appartiennent à la locutrice, dans ce contexte ses enfants. τρυφερός évoque une vie antérieure de douceur, de délicatesse ou de confort ; la formulation française garde ce contraste sans la nuance péjorative possible de « choyés ».
- source_word: ἐπορεύθησαν
  choice: ont parcouru
  rationale: Le verbe πορεύομαι signifie aller, marcher ou voyager. Avec l’accusatif ὁδοὺς, « parcourir des chemins » rend naturellement le déplacement.
- source_word: ὁδοὺς τραχείας
  choice: des chemins difficiles
  rationale: ὁδός désigne un chemin ou une route, et τραχύς ce qui est rude, accidenté ou pénible. « Chemins difficiles » conserve l’image concrète tout en laissant entendre l’épreuve du trajet.
- source_word: ἤρθησαν
  choice: ont été emmenés
  rationale: Le passif d’αἴρω exprime ici l’enlèvement ou le déplacement forcé, comme le confirme la comparaison avec un troupeau saisi. « Ont été emmenés » reste idiomatique et n’ajoute pas un détail absent du grec.
- source_word: ὡς ποίμνιον
  choice: comme un troupeau
  rationale: ποίμνιον désigne un troupeau, parfois avec une nuance diminutive qui n’a pas besoin d’être explicitée ici.
- source_word: ἡρπασμένον
  choice: arraché
  rationale: Le participe d’ἁρπάζω évoque une saisie violente ou soudaine. « Arraché » souligne la brutalité de l’enlèvement et convient à l’image du troupeau.
- source_word: ὑπὸ ἐχθρῶν
  choice: par des ennemis
  rationale: Le pluriel sans article est rendu directement et sans réduire le référent à un ennemi unique.
theological_decisions:
- issue: Portée métaphorique de l’image du troupeau
  choice: Conserver la comparaison de personnes vulnérables à un troupeau arraché par des ennemis, dans un contexte d’éloignement forcé.
  alternative: Expliciter directement l’exil, la captivité ou une interprétation générale de la souffrance.
  rationale: Le grec formule une comparaison et ne nomme pas explicitement ici l’exil ou la captivité. La traduction préserve donc l’image et sa tension sans en imposer l’interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. « Élevés dans la douceur » restitue la délicatesse ou le confort antérieurs sans la connotation critique que peut porter « choyés ». Le rythme parallèle du grec est conservé.
