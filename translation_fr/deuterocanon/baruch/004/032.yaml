base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/032.yaml
  text: Wretched are the cities to which your children were enslaved[a]; wretched is she who received your sons.
translation:
  language: fr
  text: Malheureuses les villes dont tes enfants ont été les esclaves[a] ! Malheureuse celle qui a reçu tes fils !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « auxquelles tes enfants ont servi comme esclaves ». Le verbe grec peut se traduire plus littéralement par « servir », mais le contexte favorise le sens plus fort d’un asservissement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δείλαιαι / δείλαια
  choice: Malheureuses / Malheureuse
  rationale: L’adjectif exprime ici le malheur et la lamentation tout en portant une nuance de dénonciation. « Malheureuses » reste naturel et digne, sans transformer l’adjectif en une formule interprétative comme « malheur à ».
- source_word: αἱ πόλεις
  choice: les villes
  rationale: L’article défini désigne les villes précises liées à l’asservissement des enfants de Sion.
- source_word: αἷς ἐδούλευσαν
  choice: dont … ont été les esclaves
  rationale: δουλεύω évoque ici le service servile et l’assujettissement. Cette formulation française exprime clairement l’esclavage et rend naturellement le datif relatif, tout en gardant l’action dans le passé.
- source_word: τὰ τέκνα σου
  choice: tes enfants
  rationale: τέκνα est un terme englobant qui ne se limite pas aux garçons.
- source_word: ἡ δεξαμένη
  choice: celle qui a accueilli
  rationale: Le participe féminin singulier personnifie une ville comme une femme. « Celle qui » conserve cette personnification.
- source_word: τοὺς υἱούς σου
  choice: tes fils
  rationale: υἱούς désigne spécifiquement les fils. La traduction préserve le changement lexical par rapport à τέκνα, « enfants ».
theological_decisions:
- issue: Sens de δουλεύω dans le contexte de l’exil et du jugement
  choice: ont été les esclaves
  alternative: ont servi ; ont servi comme esclaves
  rationale: Le contexte est celui de la domination imposée aux enfants de Sion. La formulation retenue rend la gravité de cet assujettissement sans atténuer le vocabulaire de l’esclavage ; la note conserve toutefois la possibilité d’une traduction plus formellement verbale.
translation_notes:
  register: Français international moderne, simple et solennel. La répétition exclamative de « Malheureuses / Malheureuse » reproduit le parallélisme grec, et le féminin de « celle » maintient la personnification de la ville.
