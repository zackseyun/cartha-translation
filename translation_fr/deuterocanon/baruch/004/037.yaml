base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/037.yaml
  text: Look[a], your sons are coming, whom you sent away; they are coming, gathered from east to west at the word of the Holy One[b], rejoicing in the glory of God.
translation:
  language: fr
  text: 'Regarde : tes fils arrivent, ceux que tu avais envoyés au loin. Ils arrivent, rassemblés de l’est à l’ouest à la parole[a] du Saint, se réjouissant de la gloire de Dieu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par la parole du Saint ». Le datif grec peut indiquer le moyen ou la parole à laquelle ils répondent.
    reason: lexical_alternative
  - marker: b
    text: Ou « se réjouissant dans la gloire de Dieu ». Le datif grec permet plusieurs manières de relier leur joie à la gloire de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Regarde
  rationale: Cette interjection attire vivement l’attention sur la scène. « Regarde » est actuel et direct, sans la tonalité archaïque que pourrait avoir « Voici donc » dans ce contexte.
- source_word: οἱ υἱοί σου
  choice: tes fils
  rationale: Le grec emploie explicitement le masculin pluriel « fils ». La traduction le conserve plutôt que de généraliser en « enfants ».
- source_word: οὓς ἐξαπέστειλας
  choice: ceux que tu avais envoyés au loin
  rationale: Le verbe composé exprime l’envoi vers l’extérieur ou au loin. Le plus-que-parfait situe naturellement cet envoi avant leur retour maintenant annoncé.
- source_word: συνηγμένοι
  choice: rassemblés
  rationale: Le participe parfait passif les présente comme ayant été réunis. « Rassemblés » conserve à la fois la valeur passive et le motif du rétablissement.
- source_word: ἀπʼ ἀνατολῶν ἕως δυσμῶν
  choice: de l’est à l’ouest
  rationale: Cette formulation française naturelle garde l’étendue géographique totale exprimée par les deux extrémités.
- source_word: τῷ ῥήματι
  choice: à la parole
  rationale: Le datif peut évoquer soit la parole à laquelle ils répondent, soit le moyen par lequel ils sont rassemblés. « À la parole » maintient le sens de parole ou d’ordre divin sans explicitation excessive.
- source_word: τοῦ ἁγίου
  choice: du Saint
  rationale: L’adjectif grec substantivé sert de titre divin. « Le Saint » conserve cette forme révérencielle sans ajouter le mot « Dieu », absent de l’expression elle-même.
- source_word: χαίροντες
  choice: se réjouissant
  rationale: Le participe décrit leur disposition pendant leur venue et garde la force verbale du grec.
- source_word: τῇ τοῦ θεοῦ δόξῃ
  choice: de la gloire de Dieu
  rationale: Après « se réjouir », « de » exprime naturellement en français l’objet ou le motif de la joie, tout en maintenant le lien direct avec la gloire divine.
theological_decisions:
- issue: Le titre divin τοῦ ἁγίου
  choice: du Saint
  alternative: du Dieu saint
  rationale: Le grec présente « Saint » comme un titre substantivé. La traduction retenue respecte cette désignation divine sans introduire un nom qui n’apparaît pas ici.
- issue: La relation de τῷ ῥήματι avec le rassemblement
  choice: à la parole du Saint
  alternative: par la parole du Saint
  rationale: Le datif permet de comprendre que les fils viennent en réponse à la parole ou qu’ils sont rassemblés par son moyen. Le texte principal privilégie la première nuance, tandis que la note conserve l’autre possibilité.
- issue: La relation entre la joie et la gloire de Dieu
  choice: se réjouissant de la gloire de Dieu
  alternative: se réjouissant dans la gloire de Dieu
  rationale: Le datif peut désigner l’objet ou l’occasion de la joie, voire la sphère dans laquelle elle s’éprouve. La formulation principale est la plus naturelle en français, sans nier l’autre lecture.
translation_notes:
  register: Français international moderne, poétique mais accessible. La répétition « ils arrivent » reproduit l’insistance du grec. La ponctuation clarifie le mouvement de la phrase sans en supprimer le parallélisme.
