base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/023.yaml
  text: For I sent you out with mourning and weeping[a], but God will give you back to me with joy and gladness forever.
translation:
  language: fr
  text: Car je vous ai envoyés au loin dans le deuil et les larmes, mais Dieu vous rendra à moi[a] dans la joie et l’allégresse, pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous ramènera auprès de moi ». Le verbe grec peut signifier rendre ou rétablir.
    reason: Alternative lexicale pour ἀποδώσει, dont le sens peut être formulé comme une restitution ou un rétablissement.
lexical_decisions:
- source_word: ἐξέπεμψα
  choice: je vous ai envoyés au loin
  rationale: Le verbe ἐκπέμπω signifie envoyer au-dehors ou au loin. Cette formulation exprime la séparation sans préciser davantage ses circonstances.
- source_word: μετὰ πένθους καὶ κλαυθμοῦ
  choice: dans le deuil et les larmes
  rationale: πένθος désigne le deuil ou une profonde affliction, et κλαυθμός les pleurs. La tournure française est naturelle tout en conservant les deux termes grecs.
- source_word: ἀποδώσει ... μοι
  choice: vous rendra à moi
  rationale: ἀποδίδωμι peut signifier rendre, restituer ou rétablir. Avec μοι (« à moi »), cette traduction préserve explicitement la relation entre la Jérusalem personnifiée et ses enfants.
- source_word: ὁ θεὸς
  choice: Dieu
  rationale: Le nom grec avec article se traduit ici naturellement par « Dieu » ; aucun nom divin d’alliance ne figure dans le texte.
- source_word: μετὰ χαρμοσύνης καὶ εὐφροσύνης
  choice: dans la joie et l’allégresse
  rationale: Les deux noms, proches mais distincts, forment une paire intensive. « Joie » et « allégresse » en conservent le parallélisme.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Dans ce contexte, l’expression idiomatique indique une durée permanente.
theological_decisions:
- issue: Identité de la locutrice et relation exprimée
  choice: Conserver « à moi », la locutrice étant Jérusalem personnifiée comme une mère dans le contexte.
  alternative: 'Traduire de manière impersonnelle : « Dieu vous rétablira » ou « Dieu vous ramènera ».'
  rationale: Le grec comporte explicitement μοι (« à moi »). Le maintenir préserve l’image familiale et communautaire sans réduire la promesse à une restauration abstraite.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme entre le deuil et les larmes, puis la joie et l’allégresse, est conservé ; la virgule avant « pour toujours » met en relief la durée de la promesse.
