  text: Look toward the east, Jerusalem, and see the joy that is coming to you from God.
translation:
  language: fr
  text: Regarde vers l’est, Jérusalem, et vois la joie qui te vient de Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίβλεψαι
  choice: Regarde vers
  rationale: L’impératif aoriste moyen invite Jérusalem à diriger son regard. « Regarde vers » est naturel en français moderne et convient au complément directionnel.
- source_word: πρὸς ἀνατολάς
  choice: vers l’est
  rationale: Le pluriel grec désigne littéralement les levers, d’où l’orient ou l’est. Ici, le sens directionnel est le plus naturel.
- source_word: Ἰερουσαλήμ
  choice: Jérusalem
  rationale: Forme française usuelle du nom de la ville, conservée en apostrophe directe.
- source_word: ἴδε
  choice: vois
  rationale: L’impératif est rendu distinctement afin de préserver la succession des deux exhortations grecques, sans recourir à l’archaïque « voici ».
- source_word: εὐφροσύνην
  choice: la joie
  rationale: « Joie » rend simplement et directement l’allégresse exprimée par εὐφροσύνη.
- source_word: τὴν παρὰ τοῦ θεοῦ
  choice: de Dieu
  rationale: 'παρά avec le génitif marque ici la provenance : la joie a Dieu pour source.'
- source_word: σοι
  choice: te
  rationale: Le datif renvoie à Jérusalem personnifiée comme destinataire de ce qui vient.
- source_word: ἐρχομένην
  choice: qui te vient
  rationale: Cette formulation rend le participe présent et son mouvement vers Jérusalem. Elle reste actuelle et laisse entendre que la joie est en train d’approcher.
theological_decisions:
- issue: Personnification de Jérusalem
  choice: Maintenir l’adresse directe à Jérusalem personnifiée
  alternative: Transformer l’adresse en formulation abstraite concernant la ville ou ses habitants
  rationale: Le grec interpelle directement Jérusalem et lui adresse deux impératifs. Cette personnification porte la force poétique et prophétique du verset.
- issue: Origine divine de la joie
  choice: Rattacher explicitement « de Dieu » à la joie qui vient
  alternative: Rendre plus librement par « la joie que Dieu t’envoie »
  rationale: La formulation retenue préserve l’indication de provenance sans transformer explicitement Dieu en sujet du verbe « envoyer », absent du grec.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve les deux impératifs successifs et l’apostrophe « Jérusalem ». Aucun marqueur de note n’est requis, puisqu’aucune note n’est proposée.
