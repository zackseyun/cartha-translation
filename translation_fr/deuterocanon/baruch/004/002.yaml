base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/002.yaml
  text: Turn[a], O Jacob, and take hold of her; walk toward the radiance[b], opposite her light.
translation:
  language: fr
  text: Reviens, Jacob, et saisis-la[a] ; avance vers l’éclat, face à sa lumière[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom grec est féminin. Il peut renvoyer à la Loi mentionnée juste avant, tout en maintenant la personnification de la sagesse.
    reason: ambiguïté du référent et personnification
  - marker: b
    text: 'L’expression grecque, rendue ici au plus près, peut aussi se comprendre plus naturellement : « avance vers l’éclat de sa lumière ».'
    reason: autre compréhension syntaxique
lexical_decisions:
- source_word: ἐπιστρέφου
  choice: Reviens
  rationale: L’impératif peut signifier « se retourner » ou « revenir ». « Reviens » exprime ici naturellement le mouvement de retour vers la Loi sans ajouter explicitement une notion de repentance.
- source_word: Ἰακώβ
  choice: Jacob
  rationale: Le nom propre est conservé tel quel, sans le remplacer par « Israël », même s’il désigne collectivement le peuple dans ce contexte.
- source_word: ἐπιλαβοῦ
  choice: saisis
  rationale: Le verbe signifie prendre, saisir ou s’attacher à quelque chose. « Saisis » garde la vigueur concrète de l’impératif.
- source_word: αὐτῆς
  choice: la / sa
  rationale: Les pronoms féminins grecs renvoient à la réalité féminine évoquée dans le contexte, la Loi ou la sagesse personnifiée. Le français permet de conserver ce genre grammatical.
- source_word: διόδευσον
  choice: avance
  rationale: Le verbe désigne le fait de cheminer ou de poursuivre sa route. « Avance » est actuel et naturel tout en maintenant l’image du déplacement.
- source_word: λάμψιν
  choice: éclat
  rationale: Le terme désigne une clarté rayonnante. « Éclat » conserve le registre poétique et reste distinct de « lumière ».
- source_word: κατέναντι
  choice: face à
  rationale: La préposition peut signifier « en face de », « devant » ou « vis-à-vis de ». « Face à » conserve l’orientation spatiale inhabituelle de la formulation grecque.
- source_word: φωτός
  choice: lumière
  rationale: « Lumière » rend le sens courant du mot et préserve la variation poétique avec « éclat ».
theological_decisions:
- issue: Référent féminin de αὐτῆς
  choice: 'Conserver le féminin : « saisis-la » et « sa lumière »'
  alternative: Employer une formulation plus impersonnelle renvoyant explicitement à la Loi
  rationale: Le contexte identifie la sagesse à la Loi tout en lui donnant des traits personnifiés. Le féminin français conserve cette tension sans imposer une identification doctrinale plus précise.
- issue: Rapport entre l’éclat et la lumière
  choice: « vers l’éclat, face à sa lumière »
  alternative: « vers l’éclat de sa lumière »
  rationale: La formulation retenue suit de près la syntaxe grecque et préserve son image spatiale difficile, tandis que la note signale la compréhension idiomatique possible.
translation_notes:
  register: Français international moderne, digne et poétique. Les impératifs sont directs et accessibles. La tournure « face à sa lumière » conserve volontairement l’étrangeté et l’ambiguïté de la construction grecque, éclairées par une note.
