base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/004.yaml
  text: We are blessed[a], O Israel[b], because what is pleasing to God is known to us.
translation:
  language: fr
  text: Nous sommes heureux[a], Israël, car ce qui plaît à Dieu nous est connu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comblés »; le grec désigne une condition heureuse et privilégiée, non seulement un sentiment de bonheur.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les choses qui plaisent à Dieu nous sont connues ».'
    reason: literal_rendering
lexical_decisions:
- source_word: μακάριοί
  choice: heureux
  rationale: Dans ce contexte, le terme exprime une condition enviable et privilégiée, et non une simple émotion. « Heureux » est naturel en français et conserve l’écho biblique des déclarations de bonheur.
- source_word: ἐσμεν
  choice: nous sommes
  rationale: Le présent de εἰμί est rendu directement et explicitement.
- source_word: Ἰσραήλ
  choice: Israël
  rationale: Le nom est compris comme une apostrophe. En français moderne, la virgule suffit à marquer l’adresse directe sans ajouter « ô », plus solennel et archaïsant.
- source_word: τὰ ἀρεστὰ
  choice: ce qui plaît
  rationale: Le neutre pluriel substantivé désigne les choses agréables ou acceptables aux yeux de Dieu. « Ce qui plaît » est idiomatique tout en gardant la portée générale de l’expression.
- source_word: τοῦ θεοῦ
  choice: à Dieu
  rationale: Avec l’idée de plaire, le génitif grec se rend naturellement en français par le complément « à Dieu ».
- source_word: ἡμῖν
  choice: nous
  rationale: Le datif désigne ceux pour qui ces choses sont connues; placé avant « est connu », « nous » est la formulation française naturelle.
- source_word: γνωστά ἐστιν
  choice: est connu
  rationale: L’accord au singulier correspond en français au pronom collectif « ce qui ». La formulation n’ajoute pas l’idée plus précise d’une révélation ou d’une action de faire connaître.
theological_decisions:
- issue: Nature du privilège d’Israël
  choice: Le bonheur d’Israël tient au fait que ce qui plaît à Dieu lui est connu.
  alternative: Identifier explicitement « ce qui plaît à Dieu » à la Loi ou à la Torah.
  rationale: Le contexte de Baruch évoque naturellement l’instruction de l’alliance, mais le grec demeure plus large. La traduction ne réduit donc pas cette expression à la Loi.
translation_notes:
  register: Français international moderne, naturel et digne. L’adresse directe « Israël » est conservée sans le vocatif archaïsant « ô ». La tournure « ce qui plaît à Dieu » privilégie la clarté sans restreindre le sens à la seule Loi.
