base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/035.yaml
  text: For fire will come upon her from the Everlasting One for many days[a], and she will be inhabited by demons for a very long time.
translation:
  language: fr
  text: Car un feu s’abattra sur elle, venant de l’Éternel[a], pendant de longs jours, et elle sera habitée par des démons pendant très longtemps.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « de celui qui est éternel » ; le grec emploie ici comme titre divin un adjectif substantivé.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῦρ
  choice: un feu
  rationale: Le nom grec est sans article. « Un feu » conserve l’image concrète du jugement et son caractère indéfini en français naturel.
- source_word: ἐπελεύσεται αὐτῇ
  choice: s’abattra sur elle
  rationale: Cette tournure française exprime naturellement la venue hostile du feu sur la ville tout en maintenant la personnification féminine du contexte.
- source_word: παρὰ τοῦ αἰωνίου
  choice: venant de l’Éternel
  rationale: La préposition marque l’origine, et l’adjectif substantivé désigne Dieu comme titre. « L’Éternel » est concis et intelligible, sans ajouter explicitement le nom « Dieu ».
- source_word: εἰς ἡμέρας μακράς
  choice: pour de longs jours
  rationale: La traduction garde l’image temporelle du grec et distingue cette première expression de la durée très prolongée de la proposition suivante.
- source_word: κατοικηθήσεται
  choice: elle sera habitée
  rationale: Le futur passif présente la ville comme le lieu qu’occuperont les êtres mentionnés ensuite.
- source_word: δαιμονίων
  choice: des démons
  rationale: Dans ce contexte juif grec de jugement et de ville dévastée, le terme désigne des êtres spirituels hostiles.
- source_word: τὸν πλεῖονα χρόνον
  choice: pendant très longtemps
  rationale: Cette formulation rend idiomatiquement en français l’idée d’une durée particulièrement prolongée, sans le calque obscur « pendant le plus grand temps ».
theological_decisions:
- issue: Valeur du titre divin τοῦ αἰωνίου
  choice: l’Éternel
  alternative: celui qui est éternel
  rationale: Le grec emploie un adjectif substantivé et ne contient pas le nom « Dieu ». Le choix principal conserve une forme de titre divin concise; la note signale la structure littérale et une autre traduction possible.
- issue: Sens de δαιμόνια dans l’oracle de jugement
  choice: démons
  alternative: esprits mauvais
  rationale: Le contexte décrit les habitants surnaturels d’une ville durablement dévastée; « démons » rend clairement la valeur hostile habituelle du terme dans ce cadre.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la personnification féminine de la ville, le parallélisme des deux indications de durée et la sobriété de l’oracle de jugement.
