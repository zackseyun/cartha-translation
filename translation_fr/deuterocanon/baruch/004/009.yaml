  to: 'Car elle a vu la colère qui est venue sur vous de la part de Dieu, et elle a dit : « Écoutez, habitants proches de Sion[a] : Dieu a fait venir sur moi un grand deuil. »'
  rationale: La révision conserve Sion/Jérusalem comme locutrice féminine contextuelle, maintient l’origine divine explicitement exprimée, et emploie pour le deuil une formulation plus proche de ἐπήγαγέ μοι. Elle améliore aussi la fluidité syntaxique et préserve en note l’ambiguïté lexicale de πάροικοι.
