base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/009.yaml
  text: 'For he saw the wrath that came upon you from God[a], and he said, “Hear, you neighbors of Zion: God has brought upon me great mourning.”'
translation:
  language: fr
  text: 'Car elle a vu la colère qui est venue sur vous de la part de Dieu, et elle a dit : « Écoutez, habitants proches de Sion[a] : Dieu a fait venir sur moi un grand deuil. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « résidents étrangers de Sion ». Le grec peut désigner des personnes qui habitent auprès d’un lieu, parfois avec la nuance de résidents étrangers.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: elle a vu
  rationale: Le sujet implicite renvoie à Sion/Jérusalem personnifiée dans le contexte. « A vu » conserve le sens concret et la progression narrative.
- source_word: ἐπελθοῦσαν ὑμῖν ὀργὴν
  choice: la colère venue sur vous
  rationale: Cette formulation garde l’image d’une colère qui survient et atteint les destinataires, sans réduire ὀργή à une simple émotion.
- source_word: παρὰ τοῦ θεοῦ
  choice: de la part de Dieu
  rationale: La préposition marque ici la provenance; cette tournure française préserve l’attribution explicite à Dieu tout en restant naturelle.
- source_word: Ἀκούσατε
  choice: Écoutez
  rationale: Impératif direct et naturel en français moderne, adapté à un appel public solennel.
- source_word: οἱ πάροικοι Σειών
  choice: habitants des environs de Sion
  rationale: πάροικοι peut désigner ceux qui résident auprès d’un lieu, mais aussi des résidents étrangers. La traduction principale rend clairement la proximité géographique, tandis que la note conserve l’autre nuance.
- source_word: ἐπήγαγέ μοι
  choice: m’a plongée dans
  rationale: Avec « deuil », cette tournure idiomatique exprime le fait que Dieu fait venir cette épreuve sur la locutrice. Le féminin correspond à Sion/Jérusalem personnifiée.
- source_word: πένθος μέγα
  choice: un grand deuil
  rationale: πένθος désigne le deuil et sa manifestation dans la lamentation; « grand deuil » en conserve la force et la dimension publique.
theological_decisions:
- issue: L’action divine dans le malheur
  choice: La colère vient explicitement de la part de Dieu, et Dieu plonge Sion dans le deuil.
  alternative: Employer une formulation plus indirecte qui présenterait le malheur comme seulement permis par Dieu.
  rationale: Le grec attribue directement à Dieu la provenance de la colère et la venue du deuil. La traduction maintient cette tension théologique sans l’atténuer.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation met en relief l’appel solennel. Le féminin « plongée » explicite seulement l’accord avec Sion/Jérusalem personnifiée, sujet déjà établi par le contexte.
