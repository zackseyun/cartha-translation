base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/018.yaml
  text: For the one who brought these evils upon you will rescue you from the hand of your enemies[a].
translation:
  language: fr
  text: Car celui qui a fait venir sur vous ces malheurs vous délivrera de la main de vos ennemis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire « ces calamités » ou « ces épreuves ». Le grec τὰ κακὰ peut désigner des maux, des afflictions ou des malheurs graves.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαγαγὼν
  choice: a fait venir sur vous
  rationale: Le participe aoriste de ἐπάγω exprime ici le fait de faire venir quelque chose sur quelqu’un. Cette formulation française conserve la direction du grec sans être artificielle.
- source_word: τὰ κακὰ
  choice: ces malheurs
  rationale: Dans ce contexte d’affliction, κακά désigne naturellement des malheurs ou des calamités. « Ces » rend la référence contextuelle portée par l’article grec.
- source_word: ἐξελεῖται
  choice: vous délivrera
  rationale: Le futur moyen de ἐξαιρέω signifie ici arracher au danger, secourir ou délivrer. « Délivrera » convient au registre biblique tout en restant courant.
- source_word: ἐκ χειρὸς
  choice: de la main de
  rationale: Cette expression biblique évoque le pouvoir ou la domination. La conserver littéralement reste claire en français et préserve l’image du texte.
- source_word: ἐχθρῶν
  choice: ennemis
  rationale: « Ennemis » rend directement le sens ordinaire de ἐχθροί dans ce contexte.
theological_decisions:
- issue: Agent divin du jugement et de la délivrance
  choice: Le même agent implicite qui a fait venir les malheurs délivrera aussi le peuple.
  alternative: Atténuer la causalité en disant seulement que les malheurs sont survenus.
  rationale: 'Le grec attribue explicitement les deux actions à un seul sujet : « celui qui a fait venir… délivrera ». La traduction maintient cette tension théologique sans la résoudre ni l’adoucir.'
translation_notes:
  register: Français moderne, digne et accessible. La structure causale et l’image biblique de « la main » sont conservées; « malheurs » évite de réduire τὰ κακὰ à une qualification exclusivement morale.
