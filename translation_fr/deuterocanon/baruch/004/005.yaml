  text: Take courage[a], my people, the memorial of Israel.
translation:
  language: fr
  text: Prenez courage, mon peuple, le mémorial[a] d’Israël !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le souvenir d’Israël ». Le grec peut désigner soit le souvenir lui-même, soit ce qui en garde la mémoire.
    reason: alternative lexicale
lexical_decisions:
- source_word: Θαρσεῖτε
  choice: Prenez courage
  rationale: L’impératif pluriel de θαρσέω exhorte directement à la confiance et au courage. « Prenez courage » est naturel en français moderne et conserve la force de l’impératif.
- source_word: λαός μου
  choice: mon peuple
  rationale: Rend directement le nom λαός accompagné du possessif, avec sa portée communautaire et relationnelle, sans ajouter d’interjection absente du grec.
- source_word: μνημόσυνον
  choice: le mémorial
  rationale: Le nom peut désigner le souvenir, ce qui entretient le souvenir, ou un mémorial. « Le mémorial » préserve ici la force concrète du substantif et la métaphore énigmatique de l’apposition.
- source_word: Ἰσραήλ
  choice: Israël
  rationale: Transcription française usuelle du nom propre.
theological_decisions:
- issue: Sens de l’apposition μνημόσυνον Ἰσραήλ
  choice: 'Comprendre l’expression comme une seconde désignation en apposition : « mon peuple, le mémorial d’Israël »'
  alternative: « mon peuple, le souvenir d’Israël »
  rationale: Le grec juxtapose une expression nominale sans verbe à « mon peuple ». La traduction conserve cette image et son ambiguïté au lieu de l’expliciter comme « ceux dont Israël se souvient » ou de l’identifier à un reste d’Israël.
translation_notes:
  register: Français international moderne, direct et digne. L’exclamation rend le ton exhortatif sans archaïsme. L’article défini devant « mémorial » donne à l’apposition une forme française naturelle, bien que le nom grec soit sans article.
