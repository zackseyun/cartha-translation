base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/009.yaml
  text: after Nebuchadnezzar king of Babylon had taken Jeconiah and the rulers and the prisoners and the mighty men and the people of the land from Jerusalem into exile[a], and had brought him to Babylon.
translation:
  language: fr
  text: après que Nabuchodonosor, roi de Babylone, eut déporté de Jérusalem Jéconias, les dirigeants, les prisonniers, les puissants et le peuple du pays, et qu’il l’eut emmené à Babylone.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte ici le singulier « lui », qui renvoie apparemment à Jéconias; on peut aussi comprendre le sens plus largement comme visant l’ensemble des déportés.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ τὸ ἀποικίσαι
  choice: après que… eut déporté
  rationale: La construction μετὰ τό suivie de l’infinitif marque l’antériorité. « Déporter » exprime ici clairement le déplacement forcé vers l’exil, avec une tournure française naturelle.
- source_word: Ναβουχοδονοσὸρ βασιλέα Βαβυλῶνος
  choice: Nabuchodonosor, roi de Babylone
  rationale: « Nabuchodonosor » est la forme française traditionnelle et courante du nom; le titre génitif est rendu directement.
- source_word: τὸν Ἰεχονίαν
  choice: Jéconias
  rationale: Cette forme française correspond directement au grec Ἰεχονίας et reste identifiable dans la tradition biblique francophone.
- source_word: τοὺς ἄρχοντας
  choice: les dirigeants
  rationale: Le terme désigne des personnes exerçant l’autorité. « Dirigeants » conserve ce sens politique sans préciser indûment leur fonction.
- source_word: τοὺς δεσμώτας
  choice: les prisonniers
  rationale: δεσμώτης désigne littéralement une personne détenue ou liée. « Prisonniers » maintient cette nuance distincte de la simple condition d’exilé.
- source_word: τοὺς δυνατοὺς
  choice: les puissants
  rationale: Le substantif adjectival peut désigner des hommes influents, socialement ou militairement. « Les puissants » garde cette portée large sans la réduire à une seule catégorie.
- source_word: τὸν λαὸν τῆς γῆς
  choice: le peuple du pays
  rationale: Rendu transparent de l’expression grecque, qui peut avoir une portée sociale particulière sans que celle-ci doive être explicitée dans le texte.
- source_word: ἀπὸ Ἰερουσαλήμ
  choice: de Jérusalem
  rationale: La préposition indique le point de départ de la déportation.
- source_word: καὶ ἤγαγεν αὐτὸν εἰς Βαβυλῶνα
  choice: et qu’il l’eut emmené à Babylone
  rationale: Le singulier αὐτόν est conservé par « l’ » et renvoie le plus naturellement à Jéconias. Le plus-que-parfait antérieur s’accorde avec la proposition temporelle française.
theological_decisions:
- issue: Nombre du pronom dans la dernière proposition
  choice: Conserver le singulier « l’ » dans le texte principal.
  alternative: Employer le pluriel « les » pour désigner l’ensemble des déportés.
  rationale: Le témoin grec fourni porte αὐτόν, au singulier, qui renvoie le plus naturellement à Jéconias. Puisque la suite de la liste peut faire attendre un pluriel, l’autre compréhension est signalée en note plutôt que substituée silencieusement au texte source.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase reste un fragment syntaxique introduit par « après que », conformément à sa fonction dans le contexte. Le passé antérieur convient au registre narratif écrit et marque nettement l’antériorité.
