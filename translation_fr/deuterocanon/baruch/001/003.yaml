base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/003.yaml
  text: And Baruch read the words of this book in the hearing of Jeconiah son of Jehoiakim, king of Judah, and in the hearing of all the people who came to the book,
translation:
  language: fr
  text: Baruch lut les paroles de ce livre devant Jéconias[a], fils de Joakim, roi de Juda, et devant tout le peuple qui venait auprès du livre[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jéconias est la forme du nom employée dans le texte grec ; ce roi est aussi connu sous le nom de Joachin.
    reason: alternative_reading
  - marker: b
    text: 'Ou peut-être : « qui venait assister à la lecture » ou « qui venait auprès du rouleau ». L’expression grecque « venait auprès du livre » est inhabituelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέγνω
  choice: lut
  rationale: Le verbe signifie « lire ». Avec un auditoire explicitement mentionné, le contexte indique une lecture publique et audible sans qu’il soit nécessaire d’ajouter « à haute voix ».
- source_word: τοὺς λόγους τοῦ βιβλίου τούτου
  choice: les paroles de ce livre
  rationale: « Paroles » garde le lien formel avec λόγους, tandis que « livre » est le terme français courant pour le document désigné par βιβλίον.
- source_word: ἐν ὠσὶν
  choice: devant
  rationale: L’expression signifie littéralement « aux oreilles de ». Dans ce contexte de lecture publique, « devant » en restitue naturellement le sens en français, sans tournure artificielle.
- source_word: Ἰεχονίου
  choice: Jékonias
  rationale: « Jékonias » est la forme française traditionnelle correspondant directement au nom grec Ἰεχονίας; l’identification sous le nom de Joachin est indiquée en note.
- source_word: τῶν ἐρχομένων πρὸς τὴν βίβλον
  choice: qui venait auprès du livre
  rationale: Cette formulation conserve le mouvement exprimé par ἐρχομένων et le substantif concret βίβλον, sans trancher l’expression grecque inhabituelle en faveur de « lecture » ou de « rouleau ».
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. « Lut… devant » communique naturellement une lecture publique. La proposition finale demeure volontairement proche de la formulation grecque afin d’en préserver l’ambiguïté. La virgule finale est maintenue puisque la phrase se poursuit au verset suivant.
