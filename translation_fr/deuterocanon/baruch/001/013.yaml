base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/013.yaml
  text: And pray for us to the Lord our God, because we have sinned against the Lord our God, and the anger of the Lord and his wrath has not turned away from us to this day.
translation:
  language: fr
  text: Et priez le Seigneur notre Dieu pour nous, car nous avons péché contre le Seigneur notre Dieu, et la colère du Seigneur et sa fureur ne se sont pas détournées de nous jusqu’à ce jour.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσεύξασθε περὶ ἡμῶν πρὸς Κύριον
  choice: priez pour nous le Seigneur
  rationale: Rend naturellement en français l’intercession demandée et conserve l’orientation de la prière vers le Seigneur.
- source_word: ὁ θυμὸς Κυρίου καὶ ἡ ὀργὴ αὐτοῦ
  choice: la fureur du Seigneur, sa colère
  rationale: Préserve les deux termes grecs apparentés sans produire la coordination française maladroite « la fureur et sa colère »; l’apposition maintient leur étroite association.
- source_word: οὐκ ἀπέστρεψεν … ἀφʼ ἡμῶν
  choice: ne s’est pas détournée de nous
  rationale: Conserve l’image spatiale et l’aspect verbal de la colère qui ne s’est pas retirée.
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: jusqu’à ce jour
  rationale: Formule française courante et digne, correspondant directement à l’expression grecque.
theological_decisions:
- issue: Rapport entre θυμός et ὀργή
  choice: Les deux notions sont conservées sous la forme appositive « la fureur du Seigneur, sa colère » avec un verbe au singulier.
  alternative: « la fureur du Seigneur et sa colère ne se sont pas détournées »
  rationale: Le grec emploie un verbe au singulier après deux expressions étroitement liées. La formulation retenue respecte ce singulier et laisse entendre deux désignations rapprochées de la même réaction divine, sans imposer une distinction doctrinale.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La répétition « le Seigneur notre Dieu » est maintenue, car elle structure la confession et reflète fidèlement le grec.
