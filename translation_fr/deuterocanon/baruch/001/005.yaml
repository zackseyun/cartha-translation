  rationale: « Devant » exprime avec concision l’idée d’agir en présence du Seigneur, sans alourdir la formulation.
- source_word: Κυρίου
  choice: le Seigneur
  rationale: Dans ce contexte juif de la Septante, κύριος désigne révérencieusement le Dieu d’Israël; « le Seigneur » est la formulation française courante et digne.
