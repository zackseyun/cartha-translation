review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : l’instruction au futur, l’attribution de la δικαιοσύνη à Dieu et le contraste avec la honte humaine sont préservés. Toutefois, « comme on le voit aujourd’hui » introduit un observateur absent du grec et affaiblit la formule déictique ὡς ἡ ἡμέρα αὕτη. L’apposition finale doit aussi être rattachée sans ambiguïté au pronom « nous ».'
  naturalness: « La honte au visage » est compréhensible, mais « la honte sur nos visages » est plus idiomatique en français moderne tout en gardant l’image du texte. La reprise explicite de « aux gens de Juda et aux habitants de Jérusalem » après « nous » rend la syntaxe fluide et évite un complément final flottant.
  terminology: « Seigneur notre Dieu » convient à κύριος θεὸς ἡμῶν. « Justice » est un rendu recevable de δικαιοσύνη dans cette confession et conserve une amplitude sémantique utile ; aucune note n’est nécessaire ici. « Gens de Juda » rend naturellement le collectif singulier ἀνθρώπῳ Ἰούδα sans restriction masculine indue.
  issues:
