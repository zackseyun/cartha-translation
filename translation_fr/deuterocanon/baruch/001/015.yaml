    issue: Ajout interprétatif dans « comme on le voit aujourd’hui »
    rationale: Le grec dit littéralement « comme ce jour [le montre / l’atteste] » et ne mentionne pas un sujet observateur. « comme aujourd’hui » conserve la formule elliptique et déictique sans ajouter cet élément.
  - severity: medium
    issue: Rattachement syntaxique imprécis des groupes destinataires
    rationale: Dans la draft, « aux gens de Juda et aux habitants de Jérusalem » suit une proposition déjà complète et peut paraître détaché. Le placer en apposition à « nous » reproduit clairement la structure confessionnelle du grec.
  revised_text: 'Et vous direz : « Au Seigneur notre Dieu appartient la justice ; mais à nous, aux gens de Juda et aux habitants de Jérusalem, la honte sur nos visages, comme aujourd’hui, »'
