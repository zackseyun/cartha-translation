base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/015.yaml
  text: And you shall say[a], ‘To the Lord our God belongs righteousness, but to us shame of face, as it is this day—to the people of Judah and to the inhabitants of Jerusalem,’
translation:
  language: fr
  text: 'Et vous direz : « Au Seigneur notre Dieu appartient la justice ; mais à nous, aux gens de Juda et aux habitants de Jérusalem, la honte sur nos visages, comme aujourd’hui, »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρεῖτε
  choice: vous direz
  rationale: Le futur de l’indicatif a ici une valeur directive dans une instruction liturgique ; le futur français conserve naturellement cette solennité.
- source_word: τῷ κυρίῳ θεῷ ἡμῶν
  choice: au Seigneur notre Dieu
  rationale: Formulation française naturelle et fidèle au grec, sans introduire la graphie « SEIGNEUR », puisque la source immédiate porte κύριος.
- source_word: ἡ δικαιοσύνη
  choice: appartient la justice
  rationale: La proposition grecque est elliptique. « Appartient » explicite la relation sans modifier le contraste confessionnel. « Justice » rend ici δικαιοσύνη de manière idiomatique et peut inclure la rectitude morale de Dieu.
- source_word: αἰσχύνη τῶν προσώπων
  choice: la honte au visage
  rationale: Cette expression conserve l’image sémitisante d’une honte manifestée sur le visage tout en restant compréhensible en français moderne.
- source_word: ὡς ἡ ἡμέρα αὕτη
  choice: comme on le voit aujourd’hui
  rationale: La formule désigne la situation présente qui atteste publiquement cette honte ; cette tournure en communique la valeur idiomatique.
- source_word: ἀνθρώπῳ Ἰούδα
  choice: aux gens de Juda
  rationale: Le singulier ἀνθρώπῳ a une valeur collective. « Les gens de Juda » restitue ce collectif en français naturel sans limiter indûment le groupe aux hommes adultes.
- source_word: τοῖς κατοικοῦσιν Ἰερουσαλήμ
  choice: aux habitants de Jérusalem
  rationale: Rendu courant, précis et naturel du participe substantivé.
theological_decisions:
- issue: Sens de δικαιοσύνη dans la confession qui oppose Dieu au peuple couvert de honte
  choice: justice
  alternative: droiture
  rationale: « Justice » est le correspondant français usuel de δικαιοσύνη et garde ouvertes les dimensions judiciaire, morale et relationnelle du terme. « Droiture » ferait mieux ressortir la rectitude morale, mais réduirait davantage son champ sémantique.
translation_notes:
  register: Français international moderne, digne et adapté à une récitation confessionnelle. La ponctuation garde la phrase ouverte vers le verset suivant. L’expression « honte au visage » préserve volontairement la couleur sémitisante du grec.
