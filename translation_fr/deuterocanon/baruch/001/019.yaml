  naturalness: Le français est globalement naturel et de registre biblique moderne. « Nous avons fait preuve de négligence en n’écoutant pas sa voix » est idiomatique, plus explicite et évite que « négliger d’écouter » soit compris seulement comme l’omission d’une écoute attendue sans reproduire la négation exprimée.
  terminology: « Le Seigneur », « nos pères », « le pays d’Égypte » et « sa voix » sont justes et cohérents avec le grec. Le terme prudent « négligence » convient au verbe rare ἐσχεδιάζομεν sans imposer le sens plus marqué d’obstination.
