base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/019.yaml
  text: From the day when the Lord brought our fathers out from the land of Egypt until this day[a], we have been disobedient to the Lord our God, and we have been negligent in not listening to his voice.
translation:
  language: fr
  text: Depuis le jour où le Seigneur a fait sortir nos pères du pays d’Égypte jusqu’à aujourd’hui, nous avons désobéi au Seigneur notre Dieu et nous avons fait preuve de négligence[a] en n’écoutant pas sa voix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nous avons agi avec insouciance en n’écoutant pas sa voix ». Le verbe grec est rare et peut évoquer la légèreté ou la négligence.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τῆς ἡμέρας ἧς … καὶ ἕως τῆς ἡμέρας ταύτης
  choice: Depuis le jour où … jusqu’à aujourd’hui
  rationale: Cette formulation française naturelle conserve le point de départ passé et la continuité de la conduite confessée jusqu’au présent.
- source_word: ἐξήγαγεν
  choice: a fait sortir
  rationale: Le causatif français exprime clairement que le Seigneur a conduit les pères hors d’Égypte et garde l’écho de l’Exode.
- source_word: Κύριος
  choice: le Seigneur
  rationale: Le grec porte Κύριος. « Le Seigneur » est le titre divin français usuel sans substituer au texte grec la graphie « l’Éternel ».
- source_word: τοὺς πατέρας ἡμῶν
  choice: nos pères
  rationale: Le rendu suit l’expression masculine explicite du grec et son sens de pères d’Israël dans le contexte de l’Exode.
- source_word: ἐκ γῆς Αἰγύπτου
  choice: du pays d’Égypte
  rationale: « Du pays d’Égypte » restitue γῆς Αἰγύπτου et, avec « faire sortir », exprime naturellement le mouvement marqué par ἐκ.
- source_word: ἤμεθα ἀπειθοῦντες
  choice: nous avons désobéi
  rationale: Le passé composé, encadré par « depuis… jusqu’à aujourd’hui », exprime en français la conduite prolongée ou répétée indiquée par la construction périphrastique grecque.
- source_word: πρὸς Κύριον θεὸν ἡμῶν
  choice: au Seigneur notre Dieu
  rationale: Avec « désobéir », la préposition française « à », contractée en « au », rend naturellement la relation exprimée par πρός sans renforcer indûment celle-ci en hostilité ouverte.
- source_word: ἐσχεδιάζομεν
  choice: nous avons négligé
  rationale: Le verbe grec rare semble évoquer l’insouciance, la légèreté ou la négligence. « Négliger » convient à l’infinitif qui suit sans lui attribuer avec certitude le sens plus fort de résistance obstinée.
- source_word: πρὸς τὸ μὴ ἀκούειν τῆς φωνῆς αὐτοῦ
  choice: d’écouter sa voix
  rationale: Après « négliger », l’infinitif français exprime idiomatiquement le fait de ne pas écouter. « Sa voix » conserve l’image biblique du grec plutôt que de l’interpréter par « sa parole » ou « ses commandements ».
theological_decisions:
- issue: Titre divin covenantal Κύριος dans le contexte de l’Exode
  choice: le Seigneur
  alternative: l’Éternel
  rationale: La source immédiate est grecque et porte Κύριος. « Le Seigneur » traduit directement ce titre tout en laissant le contexte manifester son identité covenantale.
- issue: Portée temporelle de la confession
  choice: nous avons désobéi … nous avons négligé
  alternative: nous désobéissions … nous négligions
  rationale: Le cadre « depuis le jour où… jusqu’à aujourd’hui » présente une conduite persistante depuis l’Exode. Le passé composé est naturel en français moderne pour une période passée qui aboutit au présent.
- issue: Degré de volonté exprimé par ἐσχεδιάζομεν
  choice: nous avons négligé
  alternative: nous nous sommes obstinés à ne pas écouter
  rationale: Le verbe est rare et sa nuance exacte reste incertaine. Le texte principal retient la négligence ou l’insouciance plutôt que d’imposer une obstination délibérée plus forte, tandis qu’une note signale une autre formulation possible.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le mouvement temporel du grec, le vocabulaire biblique de l’Exode (« nos pères », « sa voix ») et l’ambiguïté du verbe rare au moyen d’une note.
