  text: ainsi qu’à nos rois, à nos dirigeants, à nos prêtres, à nos prophètes et à nos pères[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ancêtres ». Le grec dit littéralement « pères » et peut désigner ici les générations précédentes du peuple.
