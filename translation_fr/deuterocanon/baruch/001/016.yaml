lexical_decisions:
- source_word: βασιλεῦσιν
  choice: rois
  rationale: Le pluriel désigne directement des monarques; « rois » conserve naturellement leur rang politique.
- source_word: ἄρχουσιν
  choice: dirigeants
  rationale: Le terme désigne de manière générale les personnes qui exercent l’autorité, sans préciser une fonction particulière.
- source_word: ἱερεῦσιν
  choice: prêtres
  rationale: C’est le terme grec courant pour les prêtres chargés du culte.
- source_word: προφήταις
  choice: prophètes
  rationale: Équivalent français direct et établi.
- source_word: πατράσιν
  choice: pères
  rationale: Le mot signifie littéralement « pères » et peut ici désigner les ancêtres du peuple; le texte principal conserve l’expression familiale et sa résonance collective, tandis qu’une note signale l’autre traduction possible.
- source_word: ἡμῶν
  choice: nos
  rationale: Le possessif répété dans chaque groupe en grec est conservé afin de préserver l’insistance rhétorique et l’identification communautaire.
- source_word: καί
  choice: ainsi que / et / à
  rationale: Le premier καί prolonge la liste commencée au verset précédent; « ainsi qu’à » rend clairement cette continuité, tandis que la coordination française naturelle conserve l’effet cumulatif sans répéter mécaniquement « et » devant chaque élément.
theological_decisions:
- issue: Sens de πατράσιν dans une confession communautaire
  choice: pères
  alternative: ancêtres
  rationale: Le grec emploie le terme familial masculin, probablement au sens des pères du peuple. « Pères » préserve cette forme et sa résonance traditionnelle sans exclure le sens plus large, explicité en note.
translation_notes:
  register: Français moderne, digne et accessible. Le verset étant la suite syntaxique de Baruch 1:15, il commence par une minuscule et se termine par une virgule. « Ainsi qu’à » marque la poursuite de l’énumération; la répétition de « nos » reproduit l’insistance du grec.
