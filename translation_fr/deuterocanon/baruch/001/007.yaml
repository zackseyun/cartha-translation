base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/007.yaml
  text: and they sent to Jerusalem[a], to Jehoiakim son of Hilkiah, son of Shallum, the priest, and to the priests, and to all the people who were found with him in Jerusalem,
translation:
  language: fr
  text: et ils envoyèrent à Jérusalem, à Joakim, fils de Helcias, fils de Shallum, le prêtre, aux prêtres et à tout le peuple qui se trouvait avec lui[a] à Jérusalem,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit « avec lui » au singulier. Dans ce verset, l’antécédent n’est pas explicite; on peut aussi comprendre plus généralement qu’il s’agit des personnes présentes à Jérusalem.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπέστειλαν
  choice: ils envoyèrent
  rationale: L’aoriste exprime simplement l’action d’envoyer. Le complément d’objet demeure implicite, comme dans le grec.
- source_word: εἰς Ἰερουσαλήμ
  choice: à Jérusalem
  rationale: Avec un nom de ville, cette formulation rend naturellement le mouvement vers Jérusalem.
- source_word: πρὸς Ἰωακεὶμ ... τὸν ἱερέα
  choice: auprès de Joakim, fils de Helcias, fils de Shallum, le prêtre
  rationale: πρός désigne ici les destinataires. ἱερεύς signifie « prêtre » et non « grand prêtre ».
- source_word: τοὺς ἱερεῖς
  choice: les prêtres
  rationale: Traduction directe et naturelle du pluriel de ἱερεύς.
- source_word: πάντα τὸν λαόν
  choice: tout le peuple
  rationale: Cette tournure conserve la valeur collective du singulier grec et reste idiomatique en français.
- source_word: τοὺς εὑρεθέντας
  choice: qui se trouvait
  rationale: Dans ce contexte, « se trouver » restitue naturellement le participe d’εὑρίσκω et exprime la présence sans lourdeur.
- source_word: μετ᾽ αὐτοῦ
  choice: avec lui
  rationale: Le grec transmis emploie le pronom singulier αὐτοῦ; il est conservé plutôt que normalisé au pluriel.
