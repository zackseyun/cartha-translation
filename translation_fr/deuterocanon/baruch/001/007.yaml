  register: Français moderne, digne et accessible. La longue coordination et la virgule finale sont maintenues parce que le verset se poursuit syntaxiquement au verset suivant. Les formes traditionnelles françaises « Joakim » et « Helcias » sont retenues; « Shallum » reste translittéré pour éviter une francisation moins stable.
