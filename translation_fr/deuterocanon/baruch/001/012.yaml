base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/012.yaml
  text: And the Lord will give us strength and enlighten our eyes[a], and we will live under the shadow of Nebuchadnezzar king of Babylon and under the shadow of Belshazzar his son[b], and we will serve them many days and find favor before them.
translation:
  language: fr
  text: Et le Seigneur nous donnera de la force et éclairera nos yeux. Nous vivrons à l’ombre[a] de Nabuchodonosor, roi de Babylone, et à l’ombre de Balthazar, son fils ; nous les servirons pendant de nombreux jours et trouverons grâce à leurs yeux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sous l’ombre de ». Cette image peut évoquer aussi bien la protection et l’abri que la dépendance et la sujétion.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « trouverons grâce devant eux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰσχὺν
  choice: de la force
  rationale: Rend naturellement la capacité et la vigueur accordées par le Seigneur, sans amplifier le terme en « puissance ».
- source_word: φωτίσει τοὺς ὀφθαλμοὺς ἡμῶν
  choice: éclairera nos yeux
  rationale: Conserve l’image grecque, qui peut évoquer la clarté, le rétablissement et un regain de vitalité.
- source_word: ζησόμεθα
  choice: nous vivrons
  rationale: Traduction directe du futur de ζάω ; « nous survivrons » préciserait excessivement une nuance seulement contextuelle.
- source_word: ὑπὸ τὴν σκιὰν
  choice: à l’ombre de
  rationale: Préserve la métaphore et son ambiguïté entre protection, dépendance et sujétion.
- source_word: Ναβουχοδονοσὸρ
  choice: Nabuchodonosor
  rationale: Forme biblique française traditionnelle et immédiatement reconnaissable.
- source_word: Βαλτασὰρ
  choice: Balthazar
  rationale: Forme biblique française courante correspondant au nom grec.
- source_word: δουλεύσομεν
  choice: nous les servirons
  rationale: Convient au contexte de service politique sous des souverains étrangers, sans imposer ici le sens plus appuyé de « être esclaves ».
- source_word: ἡμέρας πολλὰς
  choice: pendant de nombreux jours
  rationale: Exprime clairement en français la durée indiquée par l’accusatif grec.
- source_word: εὑρήσομεν χάριν ἐναντίον αὐτῶν
  choice: trouverons grâce à leurs yeux
  rationale: Expression biblique française naturelle qui conserve l’idée d’obtenir leur faveur et reflète l’idiome grec « devant eux ».
theological_decisions:
- issue: Portée de la métaphore « sous l’ombre » appliquée à des souverains païens
  choice: à l’ombre de Nabuchodonosor… et à l’ombre de Balthazar
  alternative: sous la protection de… / sous la domination de…
  rationale: La formulation maintient la tension entre abri et sujétion, sans décider si l’accent porte sur la protection impériale ou sur la domination étrangère.
- issue: Sens de δουλεύσομεν dans le contexte de l’exil
  choice: nous les servirons
  alternative: nous serons leurs esclaves / nous leur serons soumis
  rationale: Le contexte concerne le service rendu à des rois étrangers. « Servir » conserve l’étendue du verbe sans mettre au premier plan l’institution de l’esclavage ni réduire le sens à la seule soumission politique.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation allège la longue coordination grecque sans modifier son enchaînement logique. Les expressions imagées « éclairera nos yeux », « à l’ombre de » et « trouverons grâce à leurs yeux » sont conservées parce qu’elles restent intelligibles en français et transmettent la texture biblique du texte source.
