base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/001.yaml
  text: And these are the words of the book that Baruch son of Neriah[a], son of Maaseiah, son of Zedekiah, son of Hasadiah, son of Hilkiah, wrote in Babylon,
translation:
  language: fr
  text: Et voici les paroles du livre qu’écrivit Baruch, fils de Nérias, fils de Maasias, fils de Sédécias, fils d’Asadias[a], fils de Helcias, à Babylone,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « Asadias » ; certaines traductions restituent « Hasadias » d’après une forme sémitique supposée du nom.
    reason: lexical_alternative
lexical_decisions:
- source_word: ΚΑΙ οὗτοι
  choice: Voici
  rationale: En ouverture, « Voici » rend naturellement la construction présentative grecque sans imposer une simple coordination peu idiomatique en français.
- source_word: οἱ λόγοι τοῦ βιβλίου
  choice: les paroles du livre
  rationale: « Paroles » conserve le sens verbal et écrit de λόγοι, tandis que « du livre » reproduit simplement le génitif.
- source_word: οὓς ἔγραψεν
  choice: que … écrivit
  rationale: Le passé simple convient au registre narratif et rend l’aoriste comme un fait passé, sans valeur de plus-que-parfait.
- source_word: υἱὸς
  choice: fils de
  rationale: La formule généalogique répétée est maintenue explicitement plutôt que généralisée en « descendant de ».
- source_word: Νηρίου
  choice: Néria
  rationale: Forme française biblique usuelle du nom sémitique sous-jacent.
- source_word: Μαασαίου
  choice: Maaséya
  rationale: Translittération française lisible de la forme sémitique du nom, plutôt qu’une forme grecque francisée.
- source_word: Σεδεκίου
  choice: Sédécias
  rationale: Forme française biblique traditionnelle et immédiatement reconnaissable.
- source_word: Ἀσαδίου
  choice: Asadia
  rationale: La traduction suit ici directement la forme grecque attestée, Ἀσαδίου, sans ajouter une aspiration absente du texte source.
- source_word: Χελκίου
  choice: Hilqiya
  rationale: Translittération française de la forme sémitique du nom, cohérente avec les autres noms de la généalogie.
- source_word: ἐν Βαβυλῶνι
  choice: à Babylone
  rationale: En français, « à » est la préposition naturelle pour situer l’acte d’écrire dans une ville.
theological_decisions:
- issue: Forme des noms généalogiques dans un livre deutérocanonique grec
  choice: Employer des formes bibliques françaises ou des translittérations sémitiques lisibles, tout en conservant « Asadia » selon le grec
  alternative: Employer partout des formes calquées sur le grec, ou restituer « Hasadia » pour Ἀσαδίου
  rationale: Ce traitement rend la généalogie naturelle pour le lectorat français sans masquer le témoignage grec précis pour Ἀσαδίου. Il s’agit d’une décision textuelle et onomastique, non doctrinale.
translation_notes:
  register: Français moderne, digne et narratif. « Voici » évite l’ouverture lourde « Et voici ». Le passé simple convient à une introduction littéraire. Les noms suivent les usages bibliques français ou une translittération sémitique transparente, avec une note lorsque le grec présente une forme susceptible d’une autre restitution.
