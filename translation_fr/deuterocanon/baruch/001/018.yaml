translation:
  language: fr
  text: Nous lui avons désobéi, nous n’avons pas écouté la voix du Seigneur notre Dieu ni suivi les prescriptions du Seigneur qu’il avait placées devant nous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠπειθήσαμεν
  choice: nous lui avons désobéi
  rationale: Le verbe aoriste ἀπειθέω exprime ici la désobéissance ou le refus d’obéir; cette formulation française est directe et naturelle.
- source_word: οὐκ ἠκούσαμεν τῆς φωνῆς
  choice: nous n’avons pas écouté la voix
  rationale: Cette traduction conserve l’image explicite de l’écoute tout en laissant entendre, sans la remplacer par une paraphrase, la dimension d’obéissance.
- source_word: Κυρίου θεοῦ ἡμῶν
  choice: du Seigneur notre Dieu
  rationale: « Seigneur » rend κύριος dans cette source grecque et conserve le titre divin sans présupposer graphiquement le tétragramme hébreu.
- source_word: πορεύεσθαι
  choice: suivre
  rationale: Dans ce contexte de conduite conforme à des prescriptions, « suivre » est idiomatique en français moderne et évite le calque peu naturel « marcher dans les prescriptions ».
- source_word: τοῖς προστάγμασιν
  choice: les prescriptions
  rationale: πρόσταγμα désigne ce qui est ordonné ou prescrit; « prescriptions » en maintient la nuance juridique et reste compréhensible.
- source_word: ἔδωκεν κατὰ πρόσωπον ἡμῶν
  choice: qu’il avait placées devant nous
  rationale: Cette formulation rend naturellement l’expression grecque, qui présente les prescriptions comme données et mises devant le peuple.
theological_decisions:
- issue: Rendu de κύριος dans une œuvre deutérocanonique transmise en grec
  choice: Seigneur
  alternative: L’ÉTERNEL
  rationale: La source immédiate porte κύριος; « Seigneur » respecte donc la primauté du texte grec sans importer une forme typographique fondée sur un original hébreu non visible ici.
- issue: Nuance d’obéissance dans ἠκούσαμεν τῆς φωνῆς
  choice: n’avons pas écouté la voix
  alternative: n’avons pas obéi à la voix
  rationale: Le choix conserve la métaphore du texte grec ainsi que sa portée implicite d’obéissance, sans réduire l’expression à une seule dimension.
- issue: Relation syntaxique de πορεύεσθαι avec l’absence d’écoute
  choice: qui nous appelait à suivre
  alternative: afin de suivre
  rationale: L’infinitif précise le contenu ou la conséquence attendue de l’écoute. Cette formulation française explicite légèrement le lien sans attribuer à Dieu une idée étrangère au contexte.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve le parallélisme de la confession tout en évitant le calque « marcher dans les prescriptions », peu naturel en français courant.
