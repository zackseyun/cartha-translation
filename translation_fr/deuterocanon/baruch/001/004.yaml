  naturalness: « Devant » est une bonne équivalence française idiomatique de l’expression grecque littérale « aux oreilles de » dans ce contexte de lecture publique. La révision rétablit une syntaxe française claire en faisant de « tous ceux qui habitaient… » une précision appositive du peuple.
