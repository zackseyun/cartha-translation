base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/004.yaml
  text: and in the hearing of the nobles and the sons of kings[a], and in the hearing of the elders, and in the hearing of all the people, from the least to the greatest[d][c][b], all who were dwelling in Babylon by the river Sud.
translation:
  language: fr
  text: devant les puissants et les fils des rois[a], devant les anciens et devant tout le peuple, du plus petit au plus grand, c’est-à-dire tous ceux qui habitaient à Babylone, au bord du fleuve Soud[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les princes ». Le grec dit littéralement « les fils des rois ».
    reason: lexical_alternative
  - marker: b
    text: Le nom « Soud » est transcrit du grec ; l’identification exacte de ce fleuve est incertaine.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ὠσίν / ἐν ὠσὶ
  choice: devant
  rationale: L’expression signifie littéralement « aux oreilles de », mais indique ici que le livre était lu de manière à être entendu par les personnes présentes. « Devant » rend naturellement cette situation en français et s’accorde avec le contexte du verset précédent.
- source_word: τῶν δυνατῶν
  choice: les puissants
  rationale: Le terme désigne des personnes puissantes ou influentes. « Les puissants » conserve sa portée sociale sans lui imposer le titre plus précis de « nobles » ou de « dignitaires ».
- source_word: υἱῶν τῶν βασιλέων
  choice: les fils des rois
  rationale: Cette traduction garde la formulation relationnelle et le pluriel du grec, sans transformer implicitement ces personnes en « princes », titre possible mais non explicitement employé.
- source_word: τῶν πρεσβυτέρων
  choice: les anciens
  rationale: Dans ce contexte communautaire, le mot désigne vraisemblablement des responsables reconnus plutôt que de simples hommes âgés. « Les anciens » est la formulation française traditionnelle et intelligible.
- source_word: παντὸς τοῦ λαοῦ
  choice: tout le peuple
  rationale: Rend directement le collectif grec et l’étendue de l’auditoire.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: du plus petit au plus grand
  rationale: Cette expression globale couvre tous les rangs de la communauté. La traduction préserve cette portée sans la réduire à une distinction d’âge.
- source_word: πάντων τῶν κατοικούντων ἐν Βαβυλῶνι
  choice: tous ceux qui habitaient à Babylone
  rationale: La tournure conserve la valeur descriptive du participe grec dans un français courant.
- source_word: ἐπὶ ποταμοῦ Σούδ
  choice: au bord du fleuve Soud
  rationale: Avec le génitif, ἐπί exprime ici une situation près du cours d’eau. « Au bord de » est naturel en français; Σούδ est translittéré puisque son identification demeure incertaine.
