translation_notes:
  register: Français international moderne, digne et lisible. La répétition de « devant » restitue la structure solennelle de l’énumération grecque tout en explicitant naturellement l’idiome « aux oreilles de ». Le verset demeure syntaxiquement lié à l’action de lecture mentionnée dans le contexte précédent.
