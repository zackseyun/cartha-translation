  - severity: low
    issue: La note a affirme que le verbe « peut aussi se comprendre » comme une confession.
    rationale: Cette formulation sous-évalue le sens confessionnel contextuellement probable. La note doit plutôt signaler que le verbe comporte l’idée d’une déclaration ouverte/publique, si cette nuance doit être conservée.
