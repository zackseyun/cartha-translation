base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/014.yaml
  text: And you shall read this book that we have sent to you[a], to proclaim in the house of the Lord on a feast day and on days of appointed time,
translation:
  language: fr
  text: Vous lirez ce livre que nous vous avons envoyé pour faire confession[a] dans la maison du Seigneur, un jour de fête et aux jours fixés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec évoque une confession ou un aveu exprimé ouvertement; il peut aussi avoir le sens plus général de « déclarer publiquement ». La confession qui suit au verset 15 éclaire le choix de la traduction.
    reason: ambiguïté lexicale et contexte immédiat
  - marker: b
    text: 'Littéralement : « dans des jours de temps fixé ». La formulation grecque transmise est inhabituelle; on peut aussi traduire : « aux temps fixés ».'
    reason: formulation source inhabituelle
lexical_decisions:
- source_word: ἀναγνώσεσθε
  choice: vous lirez
  rationale: Le futur grec a ici valeur d’instruction. « Vous lirez » conserve cette force sans ajouter explicitement « à haute voix », même si le cadre public le suggère.
- source_word: τὸ βιβλίον τοῦτο
  choice: ce livre
  rationale: βιβλίον peut désigner un livre, un rouleau ou un document. « Ce livre » est naturel en français moderne et ne précise pas inutilement le support matériel.
- source_word: ὃ ἀπεστείλαμεν πρὸς ὑμᾶς
  choice: que nous vous avons envoyé
  rationale: Cette formulation rend naturellement l’acte accompli d’envoyer le document et son rapport avec l’instruction présente.
- source_word: ἐξαγορεῦσαι
  choice: afin de le proclamer
  rationale: Le verbe exprime ici le fait de déclarer publiquement; le pronom « le » explicite en français que la proclamation porte sur le livre. Le sens possible de confession est signalé en note.
- source_word: ἐν οἴκῳ Κυρίου
  choice: dans la maison du Seigneur
  rationale: Cette expression biblique désigne le sanctuaire ou le temple tout en conservant l’image du texte grec.
- source_word: ἐν ἡμέρᾳ ἑορτῆς
  choice: un jour de fête
  rationale: ἑορτή désigne une fête religieuse. La tournure retenue est concise et idiomatique.
- source_word: ἐν ἡμέραις καιροῦ
  choice: aux jours fixés
  rationale: καιρός peut désigner un temps déterminé ou opportun. « Aux jours fixés » communique le sens calendaire probable sans reproduire servilement la formulation grecque inhabituelle.
theological_decisions:
- issue: Sens de ἐξαγορεῦσαι dans l’introduction à la confession
  choice: afin de le proclamer
  alternative: afin de faire confession
  rationale: Le verbe peut évoquer une déclaration publique et, selon le contexte, une confession. La traduction principale suit l’action de lecture publique du livre, tandis que la note conserve l’autre compréhension, particulièrement pertinente puisque la confession commence au verset suivant.
- issue: Traduction de Κυρίου
  choice: Seigneur
  alternative: l’Éternel
  rationale: Le texte source porte Κυρίου. « Seigneur » traduit directement le grec sans reconstruire dans le texte français une forme hébraïque sous-jacente.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec, tandis que « aux jours fixés » évite un calque peu naturel. L’expression biblique « maison du Seigneur » est conservée.
