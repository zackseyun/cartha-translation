base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/020.yaml
  text: And the calamities and the curse that the Lord appointed for Moses his servant clung to us[a], on the day when he brought our fathers out to give us a land flowing with milk and honey[c][b], as it is this day.
translation:
  language: fr
  text: Les malheurs[a] et la malédiction que le Seigneur a prescrits[b] à Moïse, son serviteur[c], se sont attachés à nous le jour où il a fait sortir nos pères pour nous donner un pays où coulent le lait et le miel, comme c’est encore le cas aujourd’hui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les maux » ou « les désastres » ; le grec désigne ici vraisemblablement des jugements funestes plutôt que le mal moral.
    reason: lexical_alternative
  - marker: b
    text: Ou « ordonnés », « décrétés » ou « fixés ».
    reason: lexical_alternative
  - marker: c
    text: Le mot grec peut aussi signifier « enfant », mais il désigne ici Moïse en tant que serviteur du Seigneur.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκολλήθη
  choice: se sont attachés à nous
  rationale: Cette expression conserve l’image forte d’un mal qui adhère durablement au peuple, tout en étant naturelle en français.
- source_word: τὰ κακὰ
  choice: les malheurs
  rationale: Dans ce contexte de sanctions liées à l’alliance, le terme désigne des maux subis ou des désastres, non des fautes morales.
- source_word: ἡ ἀρά
  choice: la malédiction
  rationale: Le mot évoque ici la malédiction annoncée comme sanction de la désobéissance.
- source_word: συνέταξεν
  choice: avait prescrits
  rationale: Le verbe exprime le fait d’ordonner ou de fixer. « Prescrits à Moïse » rend directement le datif grec sans préciser au-delà du texte si Moïse est seulement destinataire ou aussi médiateur de cette prescription.
- source_word: Κύριος
  choice: le Seigneur
  rationale: Rendu biblique français naturel et digne de Κύριος.
- source_word: παιδὶ αὐτοῦ
  choice: son serviteur
  rationale: παῖς peut désigner un enfant ou un serviteur ; appliqué à Moïse dans ce contexte, « serviteur » est le sens approprié.
- source_word: ἐξήγαγεν
  choice: a fait sortir
  rationale: Cette tournure conserve la formulation traditionnelle et précise de l’exode.
- source_word: γῆν ῥέουσαν γάλα καὶ μέλι
  choice: un pays où coulent le lait et le miel
  rationale: La formulation garde l’image biblique familière tout en restant idiomatique en français moderne.
- source_word: ὡς ἡ ἡμέρα αὕτη
  choice: comme c’est encore le cas aujourd’hui
  rationale: Cette traduction exprime la réalité persistante indiquée par la formule grecque, sans la réduire au seul moment de l’exode.
theological_decisions:
- issue: Nature des malheurs et de la malédiction
  choice: Des jugements liés à l’alliance et annoncés par le Seigneur à Moïse
  alternative: Des malheurs généraux sans arrière-plan précis d’alliance
  rationale: La réunion des « malheurs », de la « malédiction », de Moïse, de l’exode et du don du pays évoque fortement les sanctions de l’alliance, sans qu’il soit nécessaire de rendre cette allusion explicite dans le corps du texte.
- issue: Fonction de Moïse dans la prescription
  choice: « prescrits à Moïse », conformément au datif grec
  alternative: « prescrits par l’intermédiaire de Moïse » ou « destinés à Moïse »
  rationale: Le datif marque clairement le rapport à Moïse, mais la traduction évite de trancher plus précisément une fonction que la forme grecque ne développe pas ici.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’image concrète de malheurs qui « s’attachent » au peuple ainsi que la résonance traditionnelle du pays où coulent le lait et le miel. Les notes signalent les principales possibilités lexicales sans alourdir le texte.
