    issue: « avait fait fabriquer » pour ἐποίησεν
    rationale: Le grec dit simplement que Sédécias « fit » les objets. Le causatif français suppose qu'il en a chargé des artisans, possibilité historique mais non exprimée par le texte source.
  - severity: low
    issue: « le dix du mois de Sivan »
    rationale: La formulation est compréhensible, mais « le dixième jour de Sivan » est plus naturelle en français international et rend explicitement la formule de date.
