base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/008.yaml
  text: when he received the vessels of the house of the Lord that had been carried out from the temple[a], to return them to the land of Judah, on the tenth of Sivan—silver vessels that Zedekiah son of Josiah, king of Judah, had made—
translation:
  language: fr
  text: au moment où il reçut les objets de la maison du Seigneur qui avaient été emportés hors du Temple, afin de les ramener au pays de Juda, le dixième jour de Sivan — des objets en argent que Sédécias, fils de Josias et roi de Juda, avait faits —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ λαβεῖν
  choice: au moment où il reçut
  rationale: La construction ἐν avec l’infinitif articulé exprime ici la simultanéité temporelle. Cette formulation française rend clairement ce rapport tout en convenant à la phrase inachevée du contexte.
- source_word: τὰ σκεύη οἴκου Κυρίου
  choice: les objets de la maison du Seigneur
  rationale: Dans le contexte du culte, σκεύη désigne divers objets ou ustensiles sacrés. « Objets » est plus naturel et plus large que « vases » en français moderne, tandis que « maison du Seigneur » conserve la désignation littérale du Temple.
- source_word: τὰ ἐξενεχθέντα ἐκ τοῦ ναοῦ
  choice: qui avaient été emportés hors du Temple
  rationale: Le participe aoriste passif indique une action antérieure. « Emportés hors de » exprime le déplacement depuis le sanctuaire; la majuscule à « Temple » identifie naturellement celui de Jérusalem.
- source_word: ἀποστρέψαι εἰς γῆν Ἰούδα
  choice: afin de les ramener au pays de Juda
  rationale: L’infinitif exprime vraisemblablement le but et le verbe implique un retour. « Pays de Juda » préserve la valeur territoriale de γῆ.
- source_word: τῇ δεκάτῃ τοῦ Σειουάν
  choice: le dix du mois de Sivan
  rationale: Il s’agit d’une formule de date. L’ajout explicatif « du mois de » est naturel et immédiatement compréhensible en français.
- source_word: σκεύη ἀργυρᾶ
  choice: des objets en argent
  rationale: Cette expression reprend σκεύη en précisant la matière. « Objets en argent » est idiomatique et évite de limiter indûment le référent à des récipients.
- source_word: ἃ ἐποίησεν Σεδεκίας
  choice: que Sédécias … avait fait fabriquer
  rationale: Dans ce contexte d’objets cultuels royaux, le causatif français est naturel sans exiger que le roi les ait façonnés personnellement. Le plus-que-parfait marque l’antériorité.
theological_decisions:
- issue: Traduction de Κυρίου dans l’expression οἴκου Κυρίου
  choice: Seigneur
  alternative: Éternel
  rationale: Le grec porte Κυρίου, sans reproduire ici directement le tétragramme hébreu. « Seigneur » traduit donc le texte grec sans importer une rétroversion confessionnelle.
- issue: Rapport syntaxique de ἀποστρέψαι
  choice: afin de les ramener
  alternative: qui avaient été emportés hors du Temple pour être ramenés
  rationale: 'L’infinitif de but dépend le plus naturellement de l’action de recevoir: il reçut les objets dans le but de les ramener. La syntaxe grecque reste toutefois quelque peu compacte.'
translation_notes:
  register: Français international moderne, digne et lisible. Le verset est conservé comme segment syntaxique lié au contexte, avec un tiret final correspondant à la poursuite de la phrase. Les noms traditionnels français « Sédécias », « Josias », « Juda » et « Sivan » sont employés.
