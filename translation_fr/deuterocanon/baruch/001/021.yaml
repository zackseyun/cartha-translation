base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/021.yaml
  text: And we did not listen to the voice of the Lord our God[a], according to all the words of the prophets whom he sent to us,
translation:
  language: fr
  text: Et nous n’avons pas écouté la voix du Seigneur notre Dieu[a], selon toutes les paroles des prophètes qu’il nous a envoyés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous n’avons pas obéi à la voix du Seigneur notre Dieu ». Le verbe grec peut exprimer le fait de tenir compte de ce qui est entendu, et non la simple perception auditive.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσαμεν
  choice: n’avons pas écouté
  rationale: Avec le génitif et dans ce contexte de désobéissance, ἀκούω signifie écouter en prêtant attention, voire obéir. « N’avons pas écouté » conserve l’image et la portée morale sans expliciter excessivement par « obéi ».
- source_word: τῆς φωνῆς
  choice: la voix
  rationale: φωνή désigne littéralement la « voix ». L’expression biblique « écouter la voix de » reste claire en français et évite de confondre la voix divine avec les paroles prophétiques mentionnées ensuite.
- source_word: Κυρίου τοῦ θεοῦ ἡμῶν
  choice: du Seigneur notre Dieu
  rationale: Cette formulation rend directement le grec κύριος ὁ θεὸς ἡμῶν dans un registre biblique naturel et digne.
- source_word: κατὰ πάντας τοὺς λόγους
  choice: conformément à toutes les paroles
  rationale: κατά avec l’accusatif exprime ici la conformité. « Conformément à » indique que l’écoute aurait dû s’accorder avec l’ensemble des paroles prophétiques.
- source_word: τῶν προφητῶν
  choice: des prophètes
  rationale: Le génitif est rendu directement; la proposition relative suivante précise que Dieu les a envoyés.
- source_word: ὧν ἀπέστειλεν πρὸς ἡμᾶς
  choice: qu’il nous a envoyés
  rationale: Le pronom relatif masculin pluriel renvoie naturellement aux prophètes. En français, « nous envoyer quelqu’un » rend idiomatiquement πρὸς ἡμᾶς tout en conservant Dieu comme sujet.
theological_decisions:
- issue: Portée d’alliance de l’expression « écouter la voix du Seigneur »
  choice: n’avons pas écouté la voix du Seigneur notre Dieu
  alternative: n’avons pas obéi à la voix du Seigneur notre Dieu
  rationale: Le contexte implique un refus coupable de tenir compte de Dieu. « Écouté » préserve toutefois l’expression biblique et sa tension entre entendre, prêter attention et obéir, sans réduire le sens à une seule nuance.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « écouter la voix » conserve l’idiome biblique; « conformément à » clarifie la valeur de κατά sans alourdir excessivement la phrase.
