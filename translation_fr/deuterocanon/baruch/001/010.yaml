revisions:
- from: 'Ils dirent : « Voici, nous vous avons envoyé de l’argent. Avec cet argent, achetez des offrandes entièrement brûlées, des sacrifices pour le péché et de l’encens. Préparez aussi une offrande de céréales[a] et offrez tout cela sur l’autel du Seigneur notre Dieu. »'
  to: 'Ils dirent : « Voici, nous vous avons envoyé de l’argent. Avec cet argent, achetez des sacrifices entièrement consumés par le feu, des sacrifices pour le péché et de l’encens. Préparez aussi une offrande de céréales[a] et offrez sur l’autel du Seigneur notre Dieu. »'
  rationale: La révision retire le pronom collectif ajouté après « offrez » afin de préserver l’absence de complément explicite dans le grec. Elle remplace également « offrandes entièrement brûlées » par une formulation française plus naturelle qui maintient le trait sémantique de l’offrande consumée tout entière par le feu. La note existante est conservée sans modification.
