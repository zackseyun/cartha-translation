base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/010.yaml
  text: And they said[a], ‘Behold, we have sent you money; and with the money buy burnt offerings and sin offerings and frankincense, and prepare a grain offering and offer them on the altar of the Lord our God,’
translation:
  language: fr
  text: 'Ils dirent : « Voici, nous vous avons envoyé de l’argent. Avec cet argent, achetez des sacrifices entièrement consumés par le feu, des sacrifices pour le péché et de l’encens. Préparez aussi une offrande de céréales[a] et offrez sur l’autel du Seigneur notre Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit ici par « offrande de céréales » est employé dans un sens sacrificiel; il ne désigne pas la nourriture du désert appelée manne.
    reason: Préciser un sens lexical rare et prévenir la confusion avec la manne du désert.
lexical_decisions:
- source_word: ἀργύριον
  choice: argent
  rationale: Le mot peut désigner l’argent métal ou la monnaie; le contexte d’un achat indique clairement ici une somme d’argent.
- source_word: ἀγοράσατε
  choice: achetez
  rationale: Équivalent direct et naturel de l’impératif grec dans ce contexte commercial.
- source_word: ὁλοκαυτώματα
  choice: offrandes entièrement brûlées
  rationale: Cette formulation exprime que les offrandes sont consumées tout entières, tout en évitant les connotations modernes dominantes du mot « holocaustes ».
- source_word: περὶ ἁμαρτίας
  choice: sacrifices pour le péché
  rationale: Dans ce contexte cultuel, l’expression désigne des sacrifices ayant rapport au péché; cette traduction conserve la relation exprimée sans préciser davantage le mécanisme théologique.
- source_word: λίβανον
  choice: encens
  rationale: « Encens » est le terme français courant et digne pour la substance aromatique employée dans le culte; dans ce contexte biblique, il désigne l’encens proprement dit, notamment l’oliban.
- source_word: ποιήσατε μάννα
  choice: préparez aussi une offrande de céréales
  rationale: μάννα a ici un sens sacrificiel et désigne une offrande végétale, non la manne du désert. « Offrande de céréales » est clair en français moderne. « Aussi » rend naturellement la coordination grecque sans ajouter une catégorie nouvelle.
- source_word: ἀνοίσατε
  choice: offrez
  rationale: Dans le contexte sacrificiel, le verbe décrit l’action de faire monter ou de présenter les offrandes sur l’autel; « offrez » en communique naturellement la fonction.
- source_word: θυσιαστήριον
  choice: autel
  rationale: Équivalent français standard du lieu où les sacrifices sont offerts.
- source_word: Κυρίου θεοῦ ἡμῶν
  choice: du Seigneur notre Dieu
  rationale: Cette formulation restitue naturellement la construction grecque et rend κύριος par « Seigneur ».
theological_decisions:
- issue: Traduction de κύριος lorsqu’il désigne le Dieu d’Israël dans ce texte grec deutérocanonique
  choice: Seigneur
  alternative: SEIGNEUR
  rationale: Le témoin source porte Κυρίου. « Seigneur » traduit directement le grec sans présenter typographiquement le mot comme la restitution certaine du tétragramme hébreu.
- issue: Portée de περὶ ἁμαρτίας dans le vocabulaire sacrificiel
  choice: sacrifices pour le péché
  alternative: sacrifices d’expiation
  rationale: « Pour le péché » garde la formulation relationnelle du grec et évite d’imposer à elle seule une interprétation plus précise de la fonction expiatoire du sacrifice.
translation_notes:
  register: Français international moderne, clair et digne. « Voici » conserve la solennité de Ἰδού sans archaïsme marqué. La seconde phrase est divisée pour alléger la longue coordination grecque. « Tout cela » explicite naturellement la portée collective de l’action d’offrir.
