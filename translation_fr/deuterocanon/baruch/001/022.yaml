  text: And each of us went off in the intent of his evil heart[a], to serve other gods, to do evil in the sight of the Lord our God.
translation:
  language: fr
  text: Et chacun de nous s’en est allé, suivant la pensée[a] de son cœur mauvais, pour servir d’autres dieux et faire le mal aux yeux du Seigneur notre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’intention » ou « la disposition intérieure ». Le grec peut désigner la pensée, l’intention ou l’état d’esprit intérieur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠχόμεθα
  choice: a suivi
  rationale: Le verbe οἴχομαι exprime ici le fait de s’en aller ou de s’engager dans une voie. En français, « a suivi » s’accorde naturellement avec les pensées du cœur et rend le mouvement vers la désobéissance sans lourdeur.
- source_word: ἕκαστος
  choice: Chacun de nous
  rationale: Préserve la valeur distributive de ἕκαστος au sein du « nous » porté par le verbe grec.
- source_word: ἐν διανοίᾳ καρδίας αὐτοῦ τῆς πονηρᾶς
  choice: les pensées de son cœur mauvais
  rationale: διάνοια peut désigner la pensée, l’intention ou la disposition intérieure. Cette formulation française conserve l’image biblique du cœur et laisse subsister cette amplitude de sens.
- source_word: ἐργάζεσθαι θεοῖς ἑτέροις
  choice: pour servir d’autres dieux
  rationale: Avec le datif, ἐργάζομαι exprime ici une activité accomplie au service d’autres dieux; « servir » rend clairement le contexte idolâtre.
- source_word: ποιῆσαι τὰ κακὰ
  choice: faire le mal
  rationale: Rendu français idiomatique de l’expression substantivée τὰ κακά, qui désigne ce qui est mauvais.
- source_word: κατʼ ὀφθαλμοὺς Κυρίου θεοῦ ἡμῶν
  choice: sous les yeux du Seigneur notre Dieu
  rationale: Conserve la métaphore des yeux présente dans le grec tout en employant une expression française naturelle.
- source_word: Κυρίου
  choice: Seigneur
  rationale: Dans ce contexte, κύριος désigne le Dieu d’Israël; « Seigneur » est le titre biblique français approprié.
theological_decisions:
- issue: Sens de ἐργάζεσθαι θεοῖς ἑτέροις dans le contexte de l’idolâtrie
  choice: servir d’autres dieux
  alternative: œuvrer pour d’autres dieux
  rationale: « Servir » exprime naturellement l’allégeance idolâtre impliquée par le datif, sans ajouter de précision cultuelle absente du texte.
- issue: Rendu de κύριος appliqué au Dieu d’Israël
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » respecte l’usage biblique et la portée relationnelle de l’expression « le Seigneur notre Dieu ».
- issue: Rapport entre la disposition intérieure et l’action
  choice: a suivi les pensées de son cœur mauvais
  alternative: s’en est allé selon l’intention de son cœur mauvais
  rationale: Le choix conserve le lien entre l’orientation intérieure et la conduite effective, sans réduire διάνοια à la seule intention consciente.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le caractère collectif et distributif de la confession, l’image du cœur comme siège de la pensée et celle des yeux du Seigneur.
