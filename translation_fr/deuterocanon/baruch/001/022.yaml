  source_fidelity: Le sens général est bien rendu, mais « a suivi » remplace le mouvement de départ exprimé par ᾠχόμεθα par l’image, non présente dans le grec, du fait de suivre. De plus, le singulier διάνοια est mieux conservé par « la pensée » que par « les pensées ».
  naturalness: La formulation révisée reste claire et naturelle en français international moderne, tout en gardant une tonalité biblique sobre. « S’en est allé, suivant… » restitue le mouvement et son orientation intérieure sans lourdeur.
  terminology: « Servir d’autres dieux », « faire le mal » et « le Seigneur notre Dieu » sont justes. « Aux yeux du Seigneur » est l’idiome français le plus direct pour l’évaluation divine exprimée par κατʼ ὀφθαλμούς.
