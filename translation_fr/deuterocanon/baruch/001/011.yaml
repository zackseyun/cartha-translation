base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/011.yaml
  text: And pray for the life of Nebuchodonosor king of Babylon[a], and for the life of Baltasar his son[b], so that their days may be like the days of heaven upon the earth.
translation:
  language: fr
  text: Priez aussi pour la vie de Nabuchodonosor, roi de Babylone[a], et pour la vie de Baltasar, son fils[b], afin que leurs jours soient comme les jours du ciel sur la terre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom grec est transcrit ici sous la forme « Nabuchodonosor ».
    reason: alternative_reading
  - marker: b
    text: Le grec porte « Baltasar » ; ce nom est souvent rendu par « Belshatsar » dans les traductions françaises de Daniel.
    reason: alternative_reading
  - marker: c
    text: Cette image peut exprimer plus explicitement le souhait que leurs jours se prolongent aussi longtemps que le ciel demeure au-dessus de la terre.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεύξασθε
  choice: Priez
  rationale: L’impératif aoriste pluriel appelle directement les destinataires à prier. « Priez » en restitue naturellement la force en français moderne.
- source_word: περὶ τῆς ζωῆς
  choice: pour la vie de
  rationale: περί avec le génitif désigne ici l’objet en faveur duquel on prie. Cette formulation conserve explicitement ζωή, sans l’élargir en « bien-être ».
- source_word: Ναβουχοδονοσόρ
  choice: Nabuchodonosor
  rationale: Cette forme française traditionnelle correspond directement à la forme grecque et évite de l’harmoniser avec la forme hébraïque plus courante « Nabuchodonosor » est aussi la graphie française usuelle du nom grec dans la tradition de la Septante.
- source_word: Βαλτασάρ
  choice: Baltasar
  rationale: « Baltasar » représente directement la forme grecque Βαλτασάρ, sans l’assimiler au nom « Belshatsar » connu par Daniel dans la tradition hébraïque.
- source_word: ἵνα ὦσιν αἱ ἡμέραι αὐτῶν
  choice: afin que leurs jours soient
  rationale: « Afin que » exprime clairement la valeur finale de ἵνα tout en gardant une tournure française digne et naturelle.
- source_word: ὡς αἱ ἡμέραι τοῦ οὐρανοῦ ἐπὶ τῆς γῆς
  choice: comme les jours du ciel sur la terre
  rationale: La formulation préserve l’image frappante et l’étrangeté mesurée du grec, au lieu de la réduire à la seule idée d’une longue vie.
theological_decisions:
- issue: Faut-il expliciter la dernière proposition comme un souhait de longue vie ou conserver sa métaphore ?
  choice: 'Conserver la métaphore : « que leurs jours soient comme les jours du ciel sur la terre »'
  alternative: « que leurs jours se prolongent aussi longtemps que le ciel demeure au-dessus de la terre »
  rationale: Le grec exprime vraisemblablement la durée au moyen d’une image biblique. La conserver respecte sa texture poétique et laisse au lecteur l’écho scripturaire sans imposer une paraphrase.
- issue: Faut-il normaliser les noms royaux d’après les formes françaises courantes issues de la tradition hébraïque ?
  choice: 'Employer les formes correspondant au témoin grec : « Nabuchodonosor » et « Baltasar »'
  alternative: « Nabuchodonosor » et « Belshatsar »
  rationale: Le texte source est grec. Garder « Baltasar » rend visible cette forme textuelle et évite une harmonisation silencieuse avec Daniel.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe demeure proche du grec sans devenir artificielle. « Aussi » rend le καί initial dans la continuité du verset précédent. Les noms propres suivent le témoin grec, et une note explique la principale forme parallèle.
