  text: καὶ προσεύξασθε περὶ τῆς ζωῆς Ναβουχοδονοσὸρ βασιλέως Βαβυλῶνος καὶ εἰς ζωὴν Βαλτασὰρ υἱοῦ αὐτοῦ, ἵνα ὦσιν αἱ ἡμέραι αὐτῶν ὡς αἱ ἡμέραι τοῦ οὐρανοῦ ἐπὶ τῆς γῆς.
