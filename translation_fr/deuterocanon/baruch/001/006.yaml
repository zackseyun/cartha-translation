lexical_decisions:
- source_word: συνήγαγον
  choice: ils recueillirent
  rationale: L’aoriste de συνάγω désigne ici la collecte de fonds. « Recueillirent » rend naturellement l’action de rassembler les contributions.
- source_word: ἀργύριον
  choice: de l’argent
  rationale: Le terme signifie littéralement « argent » au sens du métal, mais peut désigner la monnaie. En français, « de l’argent » conserve cette correspondance lexicale tout en exprimant clairement le sens monétaire.
- source_word: καθὰ ἑκάστου
  choice: chacun selon
  rationale: 'La tournure exprime une répartition proportionnelle et individuelle : la contribution varie d’une personne à l’autre.'
- source_word: ἠδύνατο ἡ χείρ
  choice: ses moyens
  rationale: Littéralement, « sa main pouvait ». Il s’agit d’un idiome désignant la capacité ou les ressources de chacun ; « ses moyens » en transmet le sens avec naturel en français.
