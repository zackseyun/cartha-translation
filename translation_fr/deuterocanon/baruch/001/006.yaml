translation:
  language: fr
  text: Et ils recueillirent de l’argent, chacun selon ses moyens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon ce que pouvait la main de chacun » ; cette expression signifie que chacun donnait selon ses capacités ou ses ressources.'
