  text: in the fifth year[a], on the seventh day of the month, at the time when the Chaldeans captured Jerusalem and burned it with fire.
translation:
  language: fr
  text: la cinquième année, le septième jour du mois[a], à l’époque où les Chaldéens s’emparèrent de Jérusalem et y mirent le feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « au septième du mois »; il s’agit vraisemblablement de la formule elliptique courante pour « le septième jour du mois ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ ἔτει τῷ πέμπτῳ
  choice: la cinquième année
  rationale: Dans la continuité syntaxique de Baruch 1:1, cette expression date les événements mentionnés; « la cinquième année » est naturel en français et reste proche du grec.
- source_word: ἐν ἑβδόμῃ τοῦ μηνός
  choice: le septième jour du mois
  rationale: L’ordinal féminin ἑβδόμῃ sous-entend vraisemblablement ἡμέρᾳ (« jour ») dans une formule de datation; « le septième mois » ne correspondrait ni au genre grammatical ni à l’idiome.
- source_word: ἐν τῷ καιρῷ ᾧ
  choice: à l’époque où
  rationale: Cette formulation rend explicitement la valeur temporelle de καιρός tout en restant fluide en français.
- source_word: ἔλαβον
  choice: s’emparèrent de
  rationale: Avec une ville pour objet, λαμβάνω a ici un sens militaire; « s’emparer de » est plus précis que le littéral « prendre ».
- source_word: οἱ Χαλδαῖοι
  choice: les Chaldéens
  rationale: Cette traduction directe de l’ethnonyme grec évite de lui substituer l’explication historique « les Babyloniens ».
- source_word: ἐνέπρησαν αὐτὴν ἐν πυρί
  choice: y mirent le feu
  rationale: Expression française naturelle qui rend l’action d’incendier la ville et intègre sans lourdeur la tournure grecque « par le feu ».
