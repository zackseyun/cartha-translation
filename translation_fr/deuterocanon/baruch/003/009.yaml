base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/009.yaml
  text: Hear[a], O Israel, the commandments of life[b]; give ear to know prudence.
translation:
  language: fr
  text: Écoute, Israël, les commandements de la vie[a] ; prêtez l’oreille afin de connaître le discernement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les commandements qui donnent la vie » ou « les commandements qui conduisent à la vie ». Le grec dit littéralement « les commandements de la vie ».
    reason: alternative lexicale et ambiguïté du génitif
  - marker: b
    text: Ou « l’intelligence pratique » ou « la prudence ».
    reason: alternative lexicale
lexical_decisions:
- source_word: Ἄκουε
  choice: Écoute
  rationale: Impératif singulier adressé à Israël comme entité collective. « Écoute » conserve la solennité de l’appel biblique tout en restant naturel en français moderne.
- source_word: Ἰσραήλ
  choice: Israël
  rationale: Forme française usuelle du nom propre.
- source_word: ἐντολὰς
  choice: les commandements
  rationale: Le terme désigne des prescriptions faisant autorité. « Commandements » en préserve la force et la résonance scripturaire.
- source_word: ζωῆς
  choice: de la vie
  rationale: 'Cette traduction formelle du génitif conserve son ambiguïté : il peut s’agir de commandements qui donnent la vie, qui conduisent à la vie ou qui se rapportent à elle.'
- source_word: ἐνωτίσασθε
  choice: prêtez l’oreille
  rationale: Impératif pluriel exprimant littéralement l’action de tendre ou de prêter l’oreille. La tournure garde l’image et le registre exhortatif du grec.
- source_word: γνῶναι
  choice: afin de connaître
  rationale: L’infinitif a ici une valeur de but. « Afin de connaître » en rend directement le sens sans ajouter explicitement l’idée d’apprentissage ou d’acquisition.
- source_word: φρόνησιν
  choice: le discernement
  rationale: φρόνησις désigne une intelligence pratique, avisée. « Discernement » convient au contexte sapientiel et évite de réduire le terme à la seule prudence comportementale.
theological_decisions:
- issue: Valeur du génitif dans ἐντολὰς ζωῆς
  choice: « les commandements de la vie »
  alternative: « les commandements qui donnent la vie » ou « les commandements qui conduisent à la vie »
  rationale: Le grec ne précise pas si la vie est la source, l’effet, le but ou la qualité de ces commandements. Le texte principal conserve cette ouverture sémantique.
- issue: Passage du singulier au pluriel dans les impératifs
  choice: « Écoute » puis « prêtez »
  alternative: 'Uniformiser au singulier : « Écoute… prête l’oreille »'
  rationale: Le grec passe explicitement de l’impératif singulier Ἄκουε à l’impératif pluriel ἐνωτίσασθε. Le français reproduit cette variation, Israël étant d’abord interpellé collectivement puis envisagé dans la pluralité de ses membres.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve le parallélisme exhortatif, l’image de l’oreille et le passage inhabituel mais significatif du singulier au pluriel.
