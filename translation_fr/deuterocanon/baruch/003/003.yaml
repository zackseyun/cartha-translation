  text: for you remain seated forever, and we are perishing forever.
translation:
  language: fr
  text: Car toi, tu es assis pour toujours[a], et nous, nous périssons pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu sièges pour toujours ». Le grec dit littéralement « étant assis pour toujours »; « siéger » peut suggérer l’exercice de la royauté, mais le texte ne mentionne pas explicitement de trône.
    reason: alternative lexicale et préservation de l’ambiguïté
lexical_decisions:
- source_word: ὅτι
  choice: car
  rationale: Introduit la raison de la supplication dans le contexte et conserve clairement la valeur causale.
- source_word: σὺ
  choice: toi, tu
  rationale: La dislocation emphatique rend explicite le pronom grec et souligne le contraste avec « nous ».
- source_word: καθήμενος
  choice: sièges
  rationale: Rend naturellement l'idée d'être assis tout en permettant, sans l'imposer explicitement, la nuance royale appropriée lorsque le sujet est Dieu.
- source_word: τὸν αἰῶνα
  choice: pour toujours
  rationale: Expression idiomatique de durée indéfinie; sa répétition préserve le parallélisme rhétorique grec.
- source_word: ἡμεῖς
  choice: nous, nous
  rationale: La reprise emphatique conserve l'opposition marquée entre Dieu et la communauté qui parle.
- source_word: ἀπολλύμενοι
  choice: périssons
  rationale: Le présent exprime le processus en cours et laisse ouvertes les nuances de perdition, de ruine ou de destruction.
theological_decisions:
- issue: Faut-il expliciter une image d'intronisation dans καθήμενος ?
  choice: « tu sièges » dans le texte principal
  alternative: « tu es assis » ou « tu règnes sur ton trône »
  rationale: « Siéger » garde l'image de la position assise et peut suggérer l'autorité royale, mais n'ajoute ni trône ni verbe régner, absents du grec.
- issue: Portée de τὸν αἰῶνα dans la seconde proposition
  choice: « pour toujours »
  alternative: « continuellement » ou « à jamais »
  rationale: La traduction identique dans les deux propositions respecte la répétition saisissante du grec et ne réduit pas la tension entre la permanence divine et la perdition humaine.
translation_notes:
  register: Français international moderne, digne et direct. L'emphase des pronoms grecs est rendue par « toi, tu » et « nous, nous »; « tandis que » fait ressortir le contraste sans supprimer la coordination de l'original.
