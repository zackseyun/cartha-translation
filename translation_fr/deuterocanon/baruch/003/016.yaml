  text: Where are the rulers of the nations[a], and those who rule over the beasts on the earth?
translation:
  language: fr
  text: Où sont les dirigeants des nations et ceux qui dominent les bêtes[a] qui sont sur la terre ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les animaux sauvages ». Le grec θηρίων peut désigner des bêtes en général ou, plus précisément, des animaux sauvages.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ
  choice: Où
  rationale: Rend directement l’interrogatif grec sans ajouter une nuance temporelle absente du texte.
- source_word: οἱ ἄρχοντες τῶν ἐθνῶν
  choice: les dirigeants des nations
  rationale: « Dirigeants » exprime naturellement l’autorité politique de ἄρχοντες en français moderne, tandis que « des nations » conserve le sens collectif et politique de ἐθνῶν.
- source_word: οἱ κυριεύοντες
  choice: ceux qui dominent
  rationale: Le participe indique l’exercice d’une maîtrise ou d’un pouvoir sur les animaux ; « dominent » préserve cette force tout en restant idiomatique.
- source_word: τῶν θηρίων
  choice: les bêtes sauvages
  rationale: θηρίον désigne couramment une bête, souvent un animal sauvage. « Bêtes sauvages » est clair, naturel et convient au registre élevé du passage.
- source_word: τῶν ἐπὶ τῆς γῆς
  choice: de la terre
  rationale: Cette tournure rattache naturellement les animaux au domaine terrestre. Le sens plus strictement locatif « qui sont sur la terre » reste possible, mais serait plus lourd.
