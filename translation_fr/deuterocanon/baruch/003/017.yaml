  text: those who make sport with the birds of the sky[a], and who store up silver and gold, in which people trusted, and there is no end to their possessions.
translation:
  language: fr
  text: ceux qui s’amusent avec les oiseaux du ciel[a], qui amassent l’argent et l’or, en quoi les humains plaçaient leur confiance, et il n’y a pas de fin à leurs possessions[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jouent parmi les oiseaux du ciel »; le participe grec peut désigner plus généralement une activité de jeu ou de divertissement et peut ici évoquer un sport lié aux oiseaux.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et il n’y a pas de fin à leur acquisition ». Le mot grec peut désigner ce qui a été acquis, donc « leurs possessions » ou « leurs biens ».'
    reason: formal_equivalence
lexical_decisions:
- source_word: ἐμπαίζοντες
  choice: s’amusent avec
  rationale: Le verbe évoque le fait de jouer ou de se divertir aux dépens de quelque chose. Dans ce contexte, il peut désigner une activité sportive liée aux oiseaux, éventuellement la chasse, sans imposer cette précision.
- source_word: ὀρνέοις τοῦ οὐρανοῦ
  choice: les oiseaux du ciel
  rationale: Équivalent direct, naturel et conforme à l’expression biblique grecque.
- source_word: θησαυρίζοντες
  choice: amassent
  rationale: Exprime clairement l’accumulation de richesses en français moderne.
- source_word: ἀργύριον καὶ τὸ χρυσίον
  choice: l’argent et l’or
  rationale: Le rapprochement des deux termes indique ici les métaux précieux plutôt que l’argent au sens général de monnaie.
- source_word: ᾧ ἐπεποίθεισαν ἄνθρωποι
  choice: auxquels les humains ont fait confiance
  rationale: Le relatif grec singulier reprend collectivement les richesses mentionnées; le pluriel français s’accorde naturellement avec « l’argent et l’or ». « Les humains » rend la portée générique de ἄνθρωποι.
- source_word: οὐκ ἔστιν τέλος τῆς κτήσεως αὐτῶν
  choice: dont les possessions ne cessent de croître
  rationale: Cette formulation rend dans le contexte l’idée d’une acquisition sans fin, tout en évitant l’expression peu naturelle « il n’y a pas de fin à leurs possessions ».
theological_decisions:
- issue: Portée générique de ἄνθρωποι
  choice: les humains
  alternative: les hommes
  rationale: Le terme désigne ici l’être humain en général; « les humains » évite une restriction masculine absente du sens contextuel.
- issue: Référent du relatif ᾧ
  choice: auxquels, reprenant l’argent et l’or collectivement
  alternative: auquel, ne reprenant que l’or
  rationale: La forme grecque est singulière et pourrait grammaticalement renvoyer au seul or, mais le sens permet aussi de viser collectivement la richesse accumulée. La traduction principale suit cette seconde lecture sans dissimuler l’autre.
translation_notes:
  register: Français international moderne, courant et digne. La structure participiale grecque est rendue par une série de relatives coordonnées. Les ambiguïtés de ἐμπαίζοντες et de la proposition finale sont signalées en notes.
