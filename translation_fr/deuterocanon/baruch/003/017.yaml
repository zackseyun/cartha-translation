  naturalness: La révision conserve un français moderne et digne. « Il n'y a pas de fin à leurs possessions » est direct, idiomatique dans un registre biblique moderne et plus fidèle que la paraphrase de croissance. « En quoi les humains plaçaient leur confiance » est naturel et maintient l'ambiguïté référentielle.
  terminology: « Oiseaux du ciel », « argent », « or », « amassent » et « possessions » rendent correctement les termes grecs. « Les humains » exprime de manière naturelle la valeur générique de ἄνθρωποι sans restriction masculine.
