base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/028.yaml
  text: And they perished for lack of understanding[a]; they perished because of their own lack of counsel.
translation:
  language: fr
  text: Ils ont péri faute de discernement[a] ; ils ont péri à cause de leur manque de jugement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de prudence » ou « de bon sens ».
    reason: φρόνησις peut désigner la prudence, le discernement ou l’intelligence pratique.
  - marker: b
    text: Ou « à cause de leur irréflexion » ; littéralement, « à cause de leur absence de conseil ».
    reason: ἀβουλία désigne le manque de délibération ou de jugement avisé.
lexical_decisions:
- source_word: ἀπώλοντο
  choice: ils ont péri
  rationale: Le verbe exprime ici la perte ou la ruine. « Ont péri » conserve le ton solennel sans préciser indûment s’il s’agit de mort ou de destruction, et sa répétition reproduit celle du grec.
- source_word: παρὰ τὸ μὴ ἔχειν
  choice: faute de
  rationale: La construction indique la cause. « Faute de » est une formulation française naturelle et concise qui garde pleinement cette valeur causale.
- source_word: φρόνησιν
  choice: discernement
  rationale: Le terme désigne une compréhension pratique, proche de la prudence ou du bon sens. « Discernement » rend bien sa dimension à la fois intellectuelle et pratique.
- source_word: διὰ τὴν ἀβουλίαν αὐτῶν
  choice: à cause de leur manque de jugement
  rationale: ἀβουλία évoque l’absence de réflexion, de conseil ou de jugement avisé. Cette formulation française exprime le défaut de délibération sans le réduire à une simple ignorance. Le possessif « leur » rend αὐτῶν sans renforcer artificiellement sa valeur.
theological_decisions:
- issue: Cause de leur perte
  choice: La perte est attribuée au défaut de discernement et de jugement.
  alternative: Traduire ces défauts de manière plus interprétative par « folie » ou « manque de sagesse ».
  rationale: Le grec emploie le vocabulaire de la compréhension pratique et de la délibération. La traduction conserve ce registre sans ajouter une explication doctrinale plus large.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « ils ont péri » et le parallélisme des deux causes sont conservés. Les notes signalent l’étendue sémantique des deux termes sapientiaux grecs sans surcharger le texte principal.
