base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/004.yaml
  text: Lord Almighty[a], God of Israel, please hear the prayer of the dead of Israel and of the sons who sinned before you, who did not listen to the voice of you, their God, and the evils have clung to us.
translation:
  language: fr
  text: Seigneur tout-puissant, Dieu d’Israël, daigne écouter la prière des morts d’Israël et des fils qui ont péché devant toi, eux qui n’ont pas écouté ta voix, celle de leur Dieu ; et les malheurs se sont attachés à nous.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les maux se sont attachés à nous » ; on peut aussi comprendre : « les calamités se sont attachées à nous ».'
    reason: La note conserve l’étendue sémantique de τὰ κακά et l’image forte du verbe κολλάω.
lexical_decisions:
- source_word: Κύριε Παντοκράτωρ
  choice: Seigneur, Maître de l’univers
  rationale: « Seigneur » est le titre divin usuel pour Κύριε. « Maître de l’univers » rend naturellement Παντοκράτωρ en français moderne tout en exprimant la souveraineté universelle.
- source_word: ἄκουσον δὴ
  choice: daigne écouter
  rationale: L’impératif accompagné de δή a ici une force suppliante ; « daigne écouter » la restitue dans un registre digne sans ajouter une notion temporelle.
- source_word: τῶν τεθνηκότων Ἰσραήλ
  choice: des morts d’Israël
  rationale: Cette formulation conserve l’expression grecque frappante et sa référence littérale à ceux qui sont morts, sans la transformer en interprétation figurée.
- source_word: υἱῶν τῶν ἁμαρτανόντων ἐναντίον σου
  choice: des fils qui ont péché devant toi
  rationale: « Fils » garde le masculin explicite de υἱῶν. Dans ce contexte rétrospectif, le participe est rendu au passé composé, tandis que « devant toi » préserve la latitude de ἐναντίον σου sans expliciter « contre toi ».
- source_word: οἳ οὐκ ἤκουσαν τῆς φωνῆς σου θεοῦ αὐτῶν
  choice: eux qui n’ont pas écouté ta voix, celle de leur Dieu
  rationale: « Écouter la voix » conserve à la fois l’image auditive et la nuance d’obéissance. La reprise « celle de leur Dieu » rend l’apposition grecque en français naturel.
- source_word: ἐκολλήθη ἡμῖν τὰ κακά
  choice: les malheurs se sont attachés à nous
  rationale: « Se sont attachés » maintient l’image concrète de κολλάω. Dans ce contexte, « malheurs » exprime le sens adverse de τὰ κακά, tandis que le sens plus formel « maux » est signalé en note.
theological_decisions:
- issue: Sens de « des morts d’Israël »
  choice: Conserver une référence littérale aux morts d’Israël.
  alternative: Comprendre l’expression comme une description figurée d’Israël, semblable à un mort, ou comme une référence aux morts spirituels.
  rationale: Le grec désigne directement ceux d’Israël qui sont morts. Une portée rhétorique reste possible, mais la traduction ne doit pas substituer cette interprétation au libellé du texte.
- issue: Portée de ἐναντίον σου
  choice: devant toi
  alternative: contre toi
  rationale: Dans un contexte de péché, l’expression peut impliquer une offense dirigée contre Dieu, mais « devant toi » conserve l’ambiguïté lexicale et l’idée de pécher en sa présence.
- issue: Sens de τὰ κακά
  choice: les malheurs
  alternative: les maux
  rationale: Le contexte favorise les calamités subies comme conséquences de la désobéissance, sans exclure la formulation plus large et plus littérale « les maux », conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Daigne écouter » marque la supplication sans lourdeur archaïque. La syntaxe est légèrement réorganisée afin de rendre clairement l’apposition « leur Dieu » tout en restant proche du grec.
