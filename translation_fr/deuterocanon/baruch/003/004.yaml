    rationale: Le grec porte καί (« et »), sans adverbe équivalant à « alors ». Cet ajout explicite un rapport consécutif que le texte ne formule pas.
  - severity: low
    issue: Rendu du titre Παντοκράτωρ
    rationale: « Maître de l’univers » est défendable, mais « tout-puissant » correspond plus directement au titre grec et constitue le rendu français usuel du titre divin.
