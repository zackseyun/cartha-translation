  text: If you had walked in the way of God, you would have lived in peace forever.
translation:
  language: fr
  text: Si tu avais suivi la voie de Dieu, tu aurais vécu dans la paix pour toujours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ ὁδῷ τοῦ θεοῦ
  choice: la voie de Dieu
  rationale: « Voie » conserve la métaphore morale et religieuse du grec ὁδός ainsi que le complément « de Dieu », sans la réduire à la Loi ou aux commandements.
- source_word: εἰ ἐπορεύθης
  choice: si tu avais suivi
  rationale: Le plus-que-parfait rend la condition passée irréelle. Avec « voie », « suivre » exprime naturellement en français la conduite évoquée par πορεύομαι, sans suggérer un simple déplacement.
- source_word: κατῴκεις ἂν
  choice: tu aurais vécu
  rationale: Le conditionnel passé correspond à l’apodose irréelle avec ἄν. « Vivre » rend ici naturellement l’idée d’une existence durable associée à κατοικέω, sans la raideur de « demeurer ».
- source_word: ἐν εἰρήνῃ
  choice: dans la paix
  rationale: La locution prépositionnelle conserve εἰρήνη comme état substantiel plutôt que de l’affaiblir en adverbe.
- source_word: τὸν αἰῶνα
  choice: pour toujours
  rationale: Dans cet emploi adverbial, l’expression indique une durée sans fin; « pour toujours » est clair et naturel en français moderne.
theological_decisions:
- issue: Valeur irréelle de la construction conditionnelle
  choice: « Si tu avais suivi… tu aurais vécu… »
  alternative: « Si tu suis… tu vivras… »
  rationale: εἰ avec l’aoriste de l’indicatif, puis ἄν dans l’apodose, présente ici une situation passée contraire aux faits. La traduction garde donc la tonalité de regret plutôt que d’en faire une promesse générale.
- issue: Portée métaphorique de « la voie de Dieu »
  choice: Conserver l’image de la voie
  alternative: « Si tu avais obéi à Dieu » ou « suivi la Loi de Dieu »
  rationale: Le grec parle de la « voie de Dieu », image plus large que l’obéissance à un commandement ou à la Loi; la préciser davantage résoudrait indûment sa portée.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reflète les formes verbales grecques à la deuxième personne du singulier. Aucun archaïsme ni marque confessionnelle ajoutée.
