lexical_decisions:
- source_word: μέγας
  choice: Grande
  rationale: Adjectif attribut sans copule exprimée, accordé au référent féminin porté par le contexte, la Sagesse. « Grande » conserve l’idée ample de grandeur sans la réduire à la taille ni à la puissance.
- source_word: οὐκ ἔχει τελευτήν
  choice: sans fin
  rationale: Expression française concise et naturelle correspondant à la formulation littérale « n’a pas de fin », sans introduire l’idée distincte de limite.
- source_word: ὑψηλός
  choice: élevée
  rationale: Rend l’idée de hauteur dans un registre poétique et digne. « Exaltée » ajouterait une nuance évaluative ou cultuelle plus marquée.
- source_word: ἀμέτρητος
  choice: incommensurable
  rationale: Exprime directement ce qui ne peut être mesuré et convient à l’ampleur spatiale évoquée dans le contexte.
theological_decisions:
- issue: Référent repris du contexte
  choice: Maintenir la description poétique sans ajouter de sujet ni de verbe.
  alternative: Commencer par « Elle est » pour expliciter le référent.
  rationale: Le grec juxtapose des adjectifs et une locution attributive sans sujet exprimé. Le contexte fournit le référent; conserver cette ellipse respecte la force poétique et l’ambiguïté syntaxique de la ligne.
translation_notes:
  register: Français international moderne, poétique et digne. L’accord au féminin reprend la Sagesse du contexte sans l’expliciter; le parallélisme et la brièveté du grec sont conservés.
