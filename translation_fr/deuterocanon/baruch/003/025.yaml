translation:
  language: fr
  text: Grand et sans fin[a], élevé et incommensurable.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « grand et il n’a pas de fin, élevé et incommensurable ».'
