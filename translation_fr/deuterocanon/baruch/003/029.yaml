  text: Who has gone up into heaven and taken her[a], and brought her down from the clouds?
translation:
  language: fr
  text: Qui est monté au ciel, l’a prise[a] et l’a fait descendre des nuages ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit de la Sagesse, personnifiée au féminin dans le contexte.
    reason: Clarifie le référent du pronom féminin, qui dépend des versets environnants.
lexical_decisions:
- source_word: τίς
  choice: Qui
  rationale: Introduit directement et naturellement la question rhétorique.
- source_word: ἀνέβη εἰς τὸν οὐρανόν
  choice: est monté au ciel
  rationale: Rend le mouvement ascendant et la destination céleste dans un français idiomatique ; « dans le ciel » risquerait d’évoquer surtout le ciel visible.
- source_word: ἔλαβεν αὐτήν
  choice: pour la saisir
  rationale: « Saisir » exprime ici l’action de prendre et conserve le pronom féminin renvoyant à la Sagesse. L’infinitif de but relie naturellement en français la montée à cette action, sans en modifier le sens contextuel.
- source_word: κατεβίβασεν αὐτήν
  choice: la faire descendre
  rationale: 'Préserve précisément la valeur causative du verbe grec : amener quelqu’un ou quelque chose à descendre.'
- source_word: ἐκ τῶν νεφελῶν
  choice: des nuages
  rationale: Restitue simplement le pluriel et l’image de la provenance céleste.
theological_decisions:
- issue: Genre du pronom renvoyant à la Sagesse
  choice: Employer « la »
  alternative: Employer un pronom neutre ou reformuler par « la sagesse »
  rationale: Le grec emploie le féminin αὐτήν en référence à la Sagesse personnifiée dans le contexte. Le pronom féminin en préserve la texture littéraire sans imposer une interprétation doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la question rhétorique, l’image spatiale et la personnification féminine de la Sagesse.
