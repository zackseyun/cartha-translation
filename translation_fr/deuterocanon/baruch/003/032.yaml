base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/032.yaml
  text: But he who knows all things knows her[a]; he found her out by his understanding. He who prepared the earth for everlasting time filled it with four-footed animals[c][b];
translation:
  language: fr
  text: Mais celui qui sait tout la connaît ; il l’a découverte par son intelligence. Celui qui a préparé la terre pour toujours[a] l’a remplie d’animaux à quatre pattes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour toute la durée des siècles » ; l’expression grecque insiste sur une durée durable et étendue.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εἰδὼς τὰ πάντα
  choice: celui qui sait tout
  rationale: Le participe parfait substantivé décrit Dieu comme celui dont la connaissance embrasse toute chose ; cette formulation est naturelle et complète en français.
- source_word: γινώσκει αὐτήν
  choice: la connaît
  rationale: Le pronom féminin reprend la sagesse dans le contexte et en maintient la personnification sans la rendre artificielle en français.
- source_word: ἐξεῦρεν αὐτήν
  choice: il l’a découverte
  rationale: « Découvrir » rend clairement l’idée d’arriver à connaître ou de trouver pleinement exprimée par ἐξευρίσκω, dans un français actuel.
- source_word: τῇ συνέσει αὐτοῦ
  choice: par son intelligence
  rationale: Le complément rend la valeur instrumentale du datif ; « intelligence » exprime ici la faculté de comprendre et de discerner.
- source_word: ὁ κατασκευάσας τὴν γῆν
  choice: Celui qui a établi la terre
  rationale: Dans ce contexte cosmique, « établir » rend la mise en ordre durable exprimée par κατασκευάζω, sans substituer automatiquement le verbe plus doctrinalement explicite « créer ».
- source_word: εἰς τὸν αἰῶνα χρόνον
  choice: pour toujours
  rationale: Cette expression française naturelle conserve l’idée de durée sans fin portée par la combinaison intensive de αἰών et χρόνος.
- source_word: ἐνέπλησεν αὐτὴν κτηνῶν τετραπόδων
  choice: l’a remplie d’animaux à quatre pattes
  rationale: « Remplir de » reproduit directement la construction grecque ; « animaux à quatre pattes » est plus courant et immédiatement compréhensible que « quadrupèdes ».
theological_decisions:
- issue: Personnification de la sagesse
  choice: Conserver le pronom féminin « la »
  alternative: Employer une tournure impersonnelle ou répéter « la sagesse »
  rationale: Le grec reprend la sagesse au féminin et le passage la personnifie. Le pronom français préserve discrètement cette texture littéraire sans faire de la sagesse une divinité distincte.
- issue: Portée de κατασκευάσας dans l’action divine
  choice: Traduire par « a établi la terre »
  alternative: « a préparé la terre », « a aménagé la terre » ou « a créé la terre »
  rationale: Le verbe peut désigner la préparation, l’aménagement ou l’établissement. « Établi » convient à la durée indiquée ensuite et évite de renforcer le texte par un terme de création plus explicite que le grec.
translation_notes:
  register: Français international moderne, digne et accessible. La structure en deux propositions parallèles est conservée, ainsi que la reprise féminine de la sagesse. « Animaux à quatre pattes » est préféré au terme plus technique « quadrupèdes ».
