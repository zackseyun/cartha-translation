  text: because those who work in silver and are concerned[a], and there is no finding out their works.
translation:
  language: fr
  text: car ceux qui travaillent l’argent et s’en préoccupent, sans qu’on puisse découvrir leurs œuvres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: car
  rationale: Introduit l’explication qui prolonge l’argument du contexte; « car » conserve naturellement la valeur explicative du grec.
- source_word: οἱ τὸ ἀργύριον τεκταίνοντες
  choice: ceux qui travaillent l’argent
  rationale: La construction participiale désigne un groupe par son activité artisanale; ἀργύριον renvoie ici au métal plutôt qu’à la monnaie.
- source_word: μεριμνῶντες
  choice: s’en préoccupent
  rationale: Rend l’idée de souci ou de préoccupation sans imposer une anxiété psychologique plus forte que ne l’exige le contexte.
- source_word: οὐκ ἔστιν ἐξεύρεσις
  choice: on ne peut découvrir
  rationale: Formulation française naturelle qui exprime l’absence de possibilité de découverte indiquée par la tournure nominale grecque.
- source_word: τῶν ἔργων αὐτῶν
  choice: leurs œuvres
  rationale: « Œuvres » maintient l’ambiguïté entre productions artisanales et réalisations, sans réduire le sens à de simples objets.
theological_decisions:
- issue: Rapport des artisans à la recherche de la sagesse
  choice: Ne pas expliciter dans le corps du verset que leurs œuvres ne permettent pas de découvrir la sagesse
  alternative: « leurs œuvres ne permettent pas de la découvrir »
  rationale: Le grec demeure elliptique et dit littéralement qu’il n’y a pas de découverte de leurs œuvres; expliciter l’objet comme étant la sagesse résoudrait une tension que le texte conserve.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste légèrement elliptique afin de respecter la difficulté du grec, tandis que la note expose l’autre lecture possible.
