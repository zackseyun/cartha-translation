revisions:
- from: Voici, aujourd’hui nous sommes dans notre exil, là où tu nous as dispersés, pour être couverts d’opprobre, soumis à la malédiction et tenus de payer[a], à la mesure de toutes les injustices de nos pères, qui se sont détournés du Seigneur notre Dieu.
  to: 'Voici : aujourd’hui, nous sommes en exil, là-bas, où tu nous as dispersés, pour être en butte à l’opprobre, à la malédiction et à l’obligation de payer[a], selon toutes les injustices de nos pères, qui se sont détournés du Seigneur notre Dieu.'
  rationale: La révision restitue explicitement l’adverbe ἐκεῖ, remplace une expression française peu idiomatique et sémantiquement restrictive pour κατά, et ajuste la traduction de ὄφλησιν afin de moins la limiter à un paiement concret. Elle conserve l’ambiguïté lexicale par la note, sans imposer une interprétation doctrinale.
