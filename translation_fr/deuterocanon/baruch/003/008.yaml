base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/008.yaml
  text: Behold[a], today we are in our exile, where you scattered us, for reproach and for a curse and for payment, according to all the wrongdoings of our fathers, who turned away from the Lord our God.
translation:
  language: fr
  text: 'Voici : aujourd’hui, nous sommes en exil, là-bas, où tu nous as dispersés, pour être en butte à l’opprobre, à la malédiction et à l’obligation de payer[a], selon toutes les injustices de nos pères, qui se sont détournés du Seigneur notre Dieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « voués au châtiment » ou « redevables ». Le terme grec désigne une dette ou une obligation encourue et peut, dans ce contexte de jugement, prendre un sens pénal.
    reason: Préserver l’étendue sémantique de ὄφλησιν, difficile à réunir dans une seule expression française naturelle.
lexical_decisions:
- source_word: ἰδοὺ
  choice: Voici
  rationale: Marque avec dignité l’attention portée à la situation présente, sans recourir à une tournure française archaïque.
- source_word: ἀποικίᾳ
  choice: exil
  rationale: Dans ce contexte, le nom désigne la condition de ceux qui ont été déportés et vivent dispersés hors de leur pays.
- source_word: διέσπειρας
  choice: tu nous as dispersés
  rationale: Rend directement l’action de répandre le peuple en divers lieux parmi les nations.
- source_word: ὀνειδισμὸν
  choice: être couverts d’opprobre
  rationale: Exprime la honte publique et les outrages dont le peuple devient l’objet, dans un registre biblique encore intelligible.
- source_word: ἀρὰν
  choice: soumis à la malédiction
  rationale: Conserve le sens direct de malédiction tout en s’intégrant naturellement à la série de compléments grecs introduits par εἰς.
- source_word: ὄφλησιν
  choice: tenus de payer
  rationale: Préserve l’idée première d’une dette ou obligation contractée, tout en laissant ouverte sa portée pénale dans ce contexte de jugement.
- source_word: κατὰ πάσας τὰς ἀδικίας
  choice: à la mesure de toutes les injustices
  rationale: Rend la correspondance exprimée par κατά entre la situation présente et l’ensemble des actes injustes des ancêtres.
- source_word: ἀπέστησαν
  choice: se sont détournés
  rationale: Traduit la défection à l’égard de Dieu sans ajouter explicitement les nuances plus fortes de rébellion ou d’apostasie.
- source_word: Κυρίου θεοῦ ἡμῶν
  choice: du Seigneur notre Dieu
  rationale: Formulation française naturelle qui conserve le titre divin et l’expression d’appartenance collective.
theological_decisions:
- issue: Traduction de κύριος
  choice: Seigneur
  alternative: Maître
  rationale: Dans cette formule d’alliance, κύριος désigne le Dieu d’Israël; « Seigneur » est la traduction française naturelle et traditionnelle sans imposer une vocalisation absente du texte grec.
- issue: Portée de ὄφλησιν dans un contexte de jugement
  choice: tenus de payer
  alternative: voués au châtiment
  rationale: Le terme évoque une dette, une obligation ou une peine encourue. Le texte principal conserve l’image de l’obligation contractée; la note signale la lecture pénale possible sans résoudre indûment l’ambiguïté.
- issue: Lien entre les fautes des pères et la condition présente
  choice: à la mesure de toutes les injustices de nos pères
  alternative: à cause de toutes les injustices de nos pères
  rationale: κατά exprime ici au moins la conformité ou la mesure; « à la mesure de » préserve mieux cette nuance que la seule causalité.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve la progression solennelle du grec, tandis que les expansions « être couverts », « soumis » et « tenus » rendent naturelle en français la triple construction εἰς + nom. Le pronom « tu » maintient l’adresse directe à Dieu présente dans διέσπειρας.
