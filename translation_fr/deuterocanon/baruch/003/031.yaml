  text: There is no one who knows her way, nor one who considers her path.
translation:
  language: fr
  text: Il n’y a personne qui connaisse son chemin, ni qui réfléchisse à son sentier.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔστιν
  choice: Il n’y a personne
  rationale: Cette tournure existentielle naturelle en français exprime nettement l’absence de quiconque répondant à la description.
- source_word: ὁ γινώσκων
  choice: qui connaisse
  rationale: Le participe présent substantivé désigne « celui qui connaît » ; le subjonctif est idiomatique après l’antécédent négatif « personne ».
- source_word: τὴν ὁδὸν αὐτῆς
  choice: son chemin
  rationale: « Chemin » restitue l’image de ὁδός. Le possessif renvoie à la Sagesse personnifiée dans le contexte ; en français, sa forme est déterminée par le nom masculin « chemin ».
- source_word: οὐδὲ
  choice: ni
  rationale: « Ni » maintient le parallélisme négatif et la structure équilibrée des deux propositions.
- source_word: ὁ ἐνθυμούμενος
  choice: qui réfléchisse à
  rationale: Le verbe exprime ici l’attention intérieure ou la réflexion, plutôt qu’un simple souvenir. Cette formulation reste naturelle sans préciser excessivement la nuance.
- source_word: τὴν τρίβον αὐτῆς
  choice: son sentier
  rationale: « Sentier » conserve l’image de la voie et la variation poétique entre τρίβος et ὁδός.
theological_decisions:
- issue: Référent du féminin αὐτῆς
  choice: Comprendre les deux possessifs comme renvoyant à la Sagesse personnifiée.
  alternative: Les comprendre de manière impersonnelle comme renvoyant abstraitement à la sagesse.
  rationale: Le contexte immédiat personnifie la Sagesse. Le français emploie néanmoins « son » devant les noms masculins « chemin » et « sentier » ; cette forme grammaticale ne rend donc pas le référent impersonnel.
translation_notes:
  register: Français international actuel, sobre et digne. Le parallélisme poétique entre « chemin » et « sentier » est conservé, ainsi que la double négation coordonnée.
