  text: He called them[a], and they said, ‘Here we are’[c][b]; they shone with gladness for the one who made them.
translation:
  language: fr
  text: 'Il les appela, et ils répondirent : « Nous voici ! » Ils brillèrent avec joie pour celui qui les a faits.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant celui qui les a faits » ou « à l’intention de celui qui les a faits » ; le datif grec permet plusieurs nuances de relation.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκάλεσεν αὐτούς
  choice: Il les appela
  rationale: Le verbe καλέω signifie ici « appeler » ou « convoquer ». « Appela » reste proche du grec et convient à l’évocation poétique des astres.
- source_word: καὶ εἶπον
  choice: et ils répondirent
  rationale: Littéralement, εἶπον signifie « ils dirent », mais puisque ces paroles suivent immédiatement un appel, « répondirent » exprime naturellement en français la valeur responsive du contexte sans changer le sens.
- source_word: Πάρεσμεν
  choice: Nous voici !
  rationale: La formule exprime la présence et la disponibilité en réponse à un appel. « Nous voici ! » est idiomatique, vivant et digne en français moderne.
- source_word: ἔλαμψαν
  choice: Ils brillèrent
  rationale: Le verbe λάμπω désigne l’action de briller ou de répandre de la lumière. « Brillèrent » convient directement aux astres personnifiés.
- source_word: μετʼ εὐφροσύνης
  choice: avec joie
  rationale: εὐφροσύνη évoque la joie et l’allégresse. « Avec joie » conserve la construction prépositionnelle tout en restant naturel.
- source_word: τῷ ποιήσαντι αὐτούς
  choice: pour celui qui les avait faits
  rationale: Le datif peut exprimer ici l’orientation, la relation ou l’intérêt. « Pour » rend bien le mouvement de leur éclat en réponse à leur Créateur, tandis que le plus-que-parfait situe naturellement leur création avant l’appel dans le récit français.
theological_decisions:
- issue: Personnification des corps célestes répondant à l’appel divin
  choice: 'Conserver directement l’image : ils répondent et brillent avec joie.'
  alternative: Réduire le passage à une description astronomique impersonnelle.
  rationale: Le grec présente poétiquement les astres du contexte précédent comme des êtres qui répondent à celui qui les a faits. La traduction maintient cette tension poétique et théologique.
- issue: Nuance du datif τῷ ποιήσαντι αὐτούς
  choice: pour celui qui les avait faits
  alternative: devant celui qui les avait faits ; à l’intention de celui qui les avait faits
  rationale: Le datif grec ne détermine pas à lui seul une relation unique. Le texte principal adopte la formulation française la plus naturelle, et la note préserve l’ambiguïté authentique.
translation_notes:
  register: Français international moderne, poétique et digne. La ponctuation et le point d’exclamation rendent la disponibilité joyeuse impliquée par Πάρεσμεν, sans alourdir le verset. Le référent masculin pluriel est laissé au contexte précédent, comme dans le grec.
