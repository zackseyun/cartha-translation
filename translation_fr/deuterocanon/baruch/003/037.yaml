  text: He found every way of knowledge[a], and gave it to Jacob his servant and to Israel his beloved.
translation:
  language: fr
  text: Il a découvert toutes les voies de la connaissance et les a données à Jacob, son serviteur[a], et à Israël, son bien-aimé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son enfant » ou « son fils » ; le mot grec παῖς peut aussi avoir ces sens.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεῦρεν
  choice: a découvert
  rationale: Le verbe exprime l’action de trouver après recherche ou de découvrir ; « a découvert » est naturel en français et garde cette force.
- source_word: πᾶσαν ὁδὸν ἐπιστήμης
  choice: toutes les voies de la connaissance
  rationale: « Voies » conserve la métaphore de ὁδός, tandis que le pluriel français rend naturellement la valeur distributive de πᾶσαν. « Connaissance » traduit directement ἐπιστήμης sans le confondre avec σοφία, « sagesse ».
- source_word: ἔδωκεν αὐτήν
  choice: les a données
  rationale: Le pronom grec féminin singulier reprend ὁδόν. Puisque la formulation française emploie le pluriel « toutes les voies », l’accord pluriel est requis.
- source_word: τῷ παιδὶ αὐτοῦ
  choice: à Jacob, son serviteur
  rationale: Dans ce rapport d’alliance entre Dieu et Jacob, « serviteur » convient au sens scripturaire de παῖς, tout en laissant les autres sens possibles en note.
- source_word: τῷ ἠγαπημένῳ ὑπʼ αὐτοῦ
  choice: à Israël, son bien-aimé
  rationale: Cette expression participiale signifie littéralement « celui qui est aimé par lui » ; « son bien-aimé » en donne une formulation française naturelle et fidèle.
- source_word: Ἰακὼβ ... Ἰσραήλ
  choice: Jacob ... Israël
  rationale: Les deux noms sont conservés dans leur parallélisme, sans les réduire à une seule désignation.
theological_decisions:
- issue: Sens de παῖς appliqué à Jacob dans sa relation avec Dieu
  choice: serviteur
  alternative: enfant ou fils
  rationale: παῖς peut désigner un serviteur, un enfant ou un fils. « Serviteur » correspond bien à l’usage d’alliance dans ce contexte, mais la note préserve l’ambiguïté lexicale réelle.
- issue: Parallélisme entre Jacob et Israël
  choice: conserver les deux noms
  alternative: les fondre en une seule désignation, « Jacob-Israël » ou « le peuple d’Israël »
  rationale: Le grec présente explicitement deux membres parallèles. Les conserver respecte la forme littéraire et évite de trancher la portée exacte de ces désignations.
translation_notes:
  register: Français moderne, international et digne. La métaphore des « voies de la connaissance » est conservée, tandis que « ainsi qu’à » rend clairement le parallélisme des deux compléments sans l’alourdir.
