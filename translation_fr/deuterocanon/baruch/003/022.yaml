  text: nor was it heard in Canaan[a], nor was it seen in Teman;
translation:
  language: fr
  text: On n’en a pas entendu parler en Canaan[a], et on ne l’a pas vue à Témân ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit de la sagesse dont parle le contexte ; en grec, le sujet reste implicite dans ce verset.
    reason: Clarifier le référent implicite sans l’ajouter au corps du texte.
lexical_decisions:
- source_word: οὐδὲ
  choice: et… ne… pas
  rationale: La première négation poursuit celle du contexte précédent. Cette tournure est naturelle en français et conserve l’effet cumulatif de la coordination négative.
- source_word: ἠκούσθη
  choice: on n’en a pas entendu parler
  rationale: L’aoriste passif de ἀκούω indique ici que la sagesse n’était ni connue ni signalée dans cette région, plutôt que l’absence d’un simple phénomène sonore. La tournure impersonnelle française rend ce sens naturellement.
- source_word: ἐν Χαναὰν
  choice: en Canaan
  rationale: La préposition a un sens locatif, et « en Canaan » est la formulation géographique française consacrée.
- source_word: οὐδὲ ὤφθη
  choice: et on ne l’a pas vue
  rationale: L’aoriste passif de ὁράω est rendu par « vue », ce qui préserve l’image visuelle et le parallélisme avec le premier membre sans l’interpréter comme « trouvée ».
- source_word: Θαιμάν
  choice: Témân
  rationale: Forme française traditionnelle du nom géographique grec Θαιμάν, avec accentuation facilitant la prononciation.
theological_decisions:
- issue: Référent du sujet implicite des deux verbes passifs
  choice: Employer les pronoms « en » et « l’ », qui renvoient à la sagesse mentionnée dans le contexte, sans répéter le nom dans le verset.
  alternative: 'Introduire explicitement « la sagesse » : « On n’a pas entendu parler de la sagesse… »'
  rationale: Le grec ne répète pas le sujet et dépend du contexte immédiat. Les pronoms conservent cette ellipse tout en produisant une phrase française claire et naturelle.
translation_notes:
  register: Français moderne, digne et accessible. La tournure impersonnelle « on n’en a pas entendu parler » évite le calque peu naturel « elle n’a pas été entendue », tandis que « vue » maintient l’image distincte du second verbe grec.
