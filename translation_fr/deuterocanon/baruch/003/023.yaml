base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/023.yaml
  text: And the sons of Hagar also[a], who seek understanding on the earth—the merchants of Merran and Teman, and the myth-makers and seekers of understanding—did not know the way of wisdom[b], nor did they remember her paths.
translation:
  language: fr
  text: Les fils d’Agar aussi, qui recherchent l’intelligence sur la terre — les marchands de Merran[a] et de Témân, les conteurs de mythes[b] et ceux qui recherchent l’intelligence — n’ont pas connu le chemin de la sagesse et ne se sont pas souvenus de ses sentiers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « Merran », nom de lieu inhabituel dans ce témoin. Certaines traditions l’identifient ou le normalisent autrement.
    reason: textual_variant
  - marker: b
    text: Ou « ceux qui composent des mythes » ; le mot grec désigne des personnes qui s’occupent de récits ou de mythes.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ τε υἱοὶ Ἁγὰρ
  choice: Les fils d’Agar aussi
  rationale: « Fils » reste proche de υἱοί sans expliciter en « descendants ». « Aussi » rend légèrement la valeur additive de τε dans l’énumération.
- source_word: οἱ ἐκζητοῦντες τὴν σύνεσιν
  choice: qui recherchent l’intelligence
  rationale: « Rechercher » exprime la démarche soutenue suggérée par ἐκζητέω, tandis qu’« intelligence » convient ici au discernement désigné par σύνεσις.
- source_word: οἱ ἐπὶ γῆς
  choice: sur la terre
  rationale: La formulation conserve la portée générale et quelque peu abrupte du grec, sans la réduire à un territoire particulier.
- source_word: οἱ ἔμποροι τῆς Μερρὰν καὶ Θαιμάν
  choice: les marchands de Merran et de Témân
  rationale: « Marchands » est le sens naturel de ἔμποροι. Merran est conservé selon le témoin grec, tandis que Témân suit une translittération française usuelle de Θαιμάν.
- source_word: οἱ μυθολόγοι
  choice: les conteurs de mythes
  rationale: Cette expression rend les personnes qui composent ou racontent des récits mythiques, sans employer le terme français moderne « mythologues », qui évoquerait plutôt des spécialistes universitaires.
- source_word: οἱ ἐκζητηταὶ τῆς συνέσεως
  choice: ceux qui recherchent l’intelligence
  rationale: La reprise du même vocabulaire préserve l’écho rhétorique avec la proposition précédente.
- source_word: ὁδὸν δὲ σοφίας
  choice: le chemin de la sagesse
  rationale: « Chemin » conserve la métaphore de ὁδός et permet de distinguer ensuite les τρίβοι, rendus par « sentiers ».
- source_word: οὐκ ἔγνωσαν
  choice: n’ont pas connu
  rationale: Le passé composé est naturel en français contemporain et rend ici l’aoriste sans ajouter l’idée d’un simple échec intellectuel.
- source_word: οὐδὲ ἐμνήσθησαν τὰς τρίβους αὐτῆς
  choice: et ne se sont pas souvenus de ses sentiers
  rationale: La traduction reste proche de μιμνῄσκομαι et conserve l’image des pistes ou sentiers. Le possessif renvoie naturellement à la sagesse, nom féminin en français.
theological_decisions:
- issue: Personnification de la sagesse
  choice: Conserver le renvoi personnel et littéraire par « ses sentiers » après « la sagesse »
  alternative: Employer une formulation impersonnelle telle que « les sentiers qui y conduisent »
  rationale: Le grec renvoie à σοφία par un pronom féminin et le contexte personnifie la sagesse. La syntaxe française préserve ce rapport sans l’expliciter davantage.
- issue: Nom géographique inhabituel dans le témoin grec
  choice: Conserver « Merran »
  alternative: Normaliser ou corriger le nom selon une autre tradition textuelle
  rationale: Le témoin fourni lit Μερρὰν. Garder cette forme translittérée évite une conjecture silencieuse et maintient la transparence textuelle.
translation_notes:
  register: Français international contemporain, digne et lisible. Les tirets dégagent l’apposition développée sans lisser entièrement la construction grecque. Les deux marqueurs sont placés immédiatement après les expressions auxquelles leurs notes se rapportent.
