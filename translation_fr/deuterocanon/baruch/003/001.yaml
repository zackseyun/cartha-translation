base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/001.yaml
  text: Lord Almighty[a], God of Israel, a soul in distress and a discouraged spirit has cried out to you.
translation:
  language: fr
  text: Seigneur tout-puissant, Dieu d’Israël, une âme dans la détresse et un esprit abattu[a] ont crié vers toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, le grec emploie le singulier : « a crié vers toi ». « L’âme » et « l’esprit » peuvent ainsi être compris comme deux expressions de l’être intérieur d’une même personne. « Dans la détresse » peut aussi se traduire par « dans l’affliction », et « abattu » par « découragé » ou « accablé ».'
    reason: ambiguïté grammaticale et alternatives lexicales
lexical_decisions:
- source_word: Κύριε Παντοκράτωρ
  choice: Seigneur tout-puissant
  rationale: Formule française consacrée et naturelle pour l’adresse divine, qui rend κύριος et le titre Παντοκράτωρ, celui qui exerce la puissance sur tout.
- source_word: ὁ θεὸς Ἰσραήλ
  choice: Dieu d’Israël
  rationale: Conserve le titre divin en apposition et sa portée relationnelle, sans article, conformément à l’usage français dans une adresse directe.
- source_word: ψυχὴ
  choice: une âme
  rationale: Dans ce langage de lamentation, le mot désigne l’être intérieur ou la personne. « Âme » préserve le registre anthropologique et le parallélisme avec « esprit ».
- source_word: ἐν στενοῖς
  choice: dans la détresse
  rationale: Rend naturellement l’image d’une situation resserrée, pénible ou sans issue, sans introduire en français une image obscure.
- source_word: πνεῦμα ἀκηδιῶν
  choice: un esprit abattu
  rationale: Le participe exprime l’abattement, la lassitude ou la perte de courage. « Abattu » est actuel, digne et légèrement plus fort que « découragé », sans évoquer nécessairement un diagnostic clinique.
- source_word: κέκραγεν πρὸς σέ
  choice: ont crié vers toi
  rationale: « Crier vers » convient au langage de prière et conserve l’orientation exprimée par πρὸς. Le passé composé rend la valeur accomplie et encore pertinente du parfait grec; le pluriel est requis par la syntaxe française courante avec les deux termes coordonnés.
theological_decisions:
- issue: Association anthropologique de ψυχή et πνεῦμα
  choice: Maintenir les deux termes distincts par « âme » et « esprit »
  alternative: Fondre les deux en une expression comme « tout mon être » ou les remplacer par « cœur et pensée »
  rationale: Le parallélisme poétique emploie deux mots de l’être intérieur. Les conserver respecte la texture théologique du texte sans leur imposer une distinction technique ni les réduire à une seule faculté.
- issue: Verbe grec au singulier après les deux expressions coordonnées
  choice: Employer le pluriel français « ont crié », avec une note signalant le singulier grec
  alternative: Employer « a crié » en traitant « âme » et « esprit » comme une seule réalité
  rationale: Le singulier grec peut présenter les deux expressions comme les aspects d’un même être intérieur, mais son imitation directe semblerait fautive en français moderne. La note préserve cette tension sans sacrifier la lisibilité.
translation_notes:
  register: Français international moderne, sobre et adapté à une prière. Le tutoiement de Dieu suit l’usage biblique français courant. La formulation conserve le parallélisme « âme / esprit » tout en employant un accord verbal naturel en français.
