base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/019.yaml
  text: They vanished and went down to Hades[a], and others rose up in their place.
translation:
  language: fr
  text: Ils disparurent et descendirent dans l’Hadès[a], et d’autres se levèrent à leur place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le séjour des morts » ou « le monde des morts » ; grec : « Hadès », le domaine des morts.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠφανίσθησαν
  choice: ils disparurent
  rationale: L’aoriste passif exprime ici la disparition ou l’effacement. « Disparurent » conserve ce sens sans préciser qu’ils furent physiquement détruits.
- source_word: εἰς ᾅδου
  choice: dans l’Hadès
  rationale: Le grec nomme explicitement l’Hadès, le séjour des morts. « Dans » convient naturellement en français avec le mouvement de descente exprimé par le verbe.
- source_word: κατέβησαν
  choice: descendirent
  rationale: Rend directement le mouvement vers le bas tout en gardant un registre narratif digne et naturel.
- source_word: ἄλλοι
  choice: d’autres
  rationale: Le pluriel indéfini ne précise pas davantage l’identité des personnes; il n’est donc pas nécessaire d’ajouter « hommes ».
- source_word: ἀντανέστησαν
  choice: se levèrent
  rationale: Préserve l’image du fait de se lever et, grâce au complément qui suit, exprime une succession sans imposer l’idée de résurrection.
- source_word: ἀντʼ αὐτῶν
  choice: à leur place
  rationale: ἀντί avec le génitif marque ici le remplacement ou la succession; cette formulation est idiomatique et précise en français.
theological_decisions:
- issue: Traduction de ᾅδης dans ce passage sapientiel deutérocanonique
  choice: l’Hadès
  alternative: le séjour des morts; le monde des morts; la tombe
  rationale: Le témoin grec emploie ᾅδης. Garder « Hadès » respecte la primauté de la langue source et préserve la représentation du domaine des morts, sans l’assimiler à la tombe ni à une conception doctrinale ultérieure de l’enfer.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans archaïsme lexical marqué. L’expression « se levèrent à leur place » maintient l’image grecque et le sens de succession.
