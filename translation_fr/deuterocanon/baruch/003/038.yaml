  text: After this he appeared on the earth[a], and lived among men.
translation:
  language: fr
  text: Après cela, il est apparu sur la terre[a] et a vécu parmi les êtres humains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus littéralement, « a été vu sur la terre et a fréquenté les êtres humains ».
    reason: Signaler la forme passive possible de ὤφθη et la nuance relationnelle possible de συνανεστράφη.
lexical_decisions:
- source_word: μετὰ τοῦτο
  choice: Après cela
  rationale: Cette expression rend directement la succession temporelle explicite du grec.
- source_word: ἐπὶ τῆς γῆς
  choice: sur la terre
  rationale: Le sens cosmique et humain de « terre » convient mieux ici que le sens plus local de « pays ».
- source_word: ὤφθη
  choice: est apparu
  rationale: Bien que la forme puisse se traduire littéralement par « a été vu », « est apparu » en exprime naturellement la valeur intransitive en français sans ajouter d’interprétation.
- source_word: ἐν τοῖς ἀνθρώποις
  choice: parmi les êtres humains
  rationale: ἄνθρωποι désigne ici l’humanité en général; cette formulation moderne évite de restreindre indûment le référent aux hommes de sexe masculin.
- source_word: συνανεστράφη
  choice: a vécu parmi
  rationale: Le verbe évoque la conduite et la vie partagées en société; « a vécu parmi » est naturel et rend la présence durable sans surcharge théologique.
theological_decisions:
- issue: Référent du sujet masculin implicite
  choice: Employer « il » sans expliciter son identité dans ce verset.
  alternative: Employer une tournure neutre ou préciser « la Sagesse » ou une identification christologique.
  rationale: Le grec porte un sujet masculin implicite hérité du contexte. « Il » en conserve le genre grammatical et la tension interprétative, sans imposer une identification doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. « Êtres humains » exprime clairement la portée générique de ἀνθρώποις; la syntaxe reste proche du parallélisme grec.
