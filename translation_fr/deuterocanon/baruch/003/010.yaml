  text: What is it, Israel? Why is it that you are in the land of enemies? You have grown old in a foreign land; you have become defiled with the dead,
translation:
  language: fr
  text: Qu’as-tu donc, Israël[a] ? Pourquoi es-tu au pays des ennemis ? Tu as vieilli sur une terre étrangère ; tu t’es souillé au contact des morts[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Que se passe-t-il, Israël ? » L’expression grecque introduit une question empreinte de lamentation.'
    reason: lexical_alternative
  - marker: b
    text: Cette expression peut évoquer l’impureté rituelle associée aux morts, mais aussi, au sens figuré, la condition d’un peuple exilé devenu comme mort.
    reason: alternative_reading
lexical_decisions:
- source_word: τί ἐστιν
  choice: Qu’as-tu donc
  rationale: Cette tournure française rend naturellement la question plaintive et idiomatique du grec, tandis que le second τί ὅτι est traduit explicitement par « Pourquoi ».
- source_word: ἐν γῇ τῶν ἐχθρῶν
  choice: au pays de tes ennemis
  rationale: Le génitif grec désigne le pays lié aux ennemis. En français courant, le possessif « tes » explicite naturellement leur relation à Israël sans changer le référent.
- source_word: ἐπαλαιώθης
  choice: tu as vieilli
  rationale: Le verbe exprime le fait d’être devenu vieux. Cette formulation conserve l’image d’un exil prolongé.
- source_word: ἐν γῇ ἀλλοτρίᾳ
  choice: sur une terre étrangère
  rationale: ἀλλοτρίᾳ désigne ce qui appartient à autrui ou ce qui est étranger. « Terre étrangère » est clair, actuel et adapté au contexte de l’exil.
- source_word: συνεμιάνθης
  choice: tu t’es souillé
  rationale: Le verbe évoque une souillure, notamment rituelle, sans exclure une portée figurée ou morale. La forme pronominale française exprime l’état acquis sans préciser indûment son mécanisme.
- source_word: τοῖς νεκροῖς
  choice: au contact des morts
  rationale: Le datif associé au verbe composé suggère une contamination par association ou contact. Cette expression française garde la résonance de l’impureté liée aux morts, tout en laissant ouverte la dimension figurée.
theological_decisions:
- issue: Nature de la souillure dans συνεμιάνθης τοῖς νεκροῖς
  choice: Conserver une formulation pouvant évoquer à la fois l’impureté liée aux morts et l’association figurée au domaine de la mort.
  alternative: Traduire exclusivement par une souillure rituelle due au contact de cadavres, ou exclusivement par le fait d’être compté parmi les morts.
  rationale: Le grec permet ces deux résonances. Le texte français ne doit pas réduire cette tension théologique et imagée à une seule interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme interrogatif et plaintif est conservé. « Pays » puis « terre » évite une répétition lourde tout en respectant les deux occurrences de γῆ. La virgule finale signale que la phrase se poursuit au verset suivant.
