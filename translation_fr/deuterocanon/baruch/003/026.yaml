base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/026.yaml
  text: There the giants were born[a], those renowned from the beginning, great in size, skilled in war.
translation:
  language: fr
  text: Là naquirent les géants, ces êtres célèbres, apparus dès le commencement, de grande taille et habiles à la guerre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « les géants, célèbres depuis le commencement, venus à l’existence alors ». Le grec οἱ ὀνομαστοὶ ἀπ’ ἀρχῆς γενόμενοι est condensé : « dès le commencement » peut se rattacher à leur renommée ou à leur venue à l’existence.'
    reason: Préserver l’ambiguïté syntaxique de l’expression grecque condensée, notamment la portée de ἀπ’ ἀρχῆς et du participe γενόμενοι.
lexical_decisions:
- source_word: ἐκεῖ ἐγεννήθησαν
  choice: Là naquirent
  rationale: Rend directement l’adverbe de lieu et l’aoriste passif de γεννάω dans un français naturel et soutenu.
- source_word: οἱ γίγαντες
  choice: les géants
  rationale: Conserve le sens lexical traditionnel sans préciser une identification mythologique ou intertextuelle.
- source_word: οἱ ὀνομαστοὶ
  choice: ces hommes célèbres
  rationale: ὀνομαστός désigne des êtres renommés ou célèbres; «ces hommes» explicite naturellement l’apposition en français sans modifier leur identité.
- source_word: ἀπʼ ἀρχῆς γενόμενοι
  choice: apparus dès les temps anciens
  rationale: Rend à la fois le participe γενόμενοι et la valeur temporelle de ἀπ’ ἀρχῆς, qui évoque ici une antiquité reculée plutôt qu’un commencement métaphysique.
- source_word: εὐμεγέθεις
  choice: d’une taille imposante
  rationale: Exprime leur grande dimension corporelle dans un français actuel et digne.
- source_word: ἐπιστάμενοι πόλεμον
  choice: habiles à la guerre
  rationale: Rend l’idée de connaissance pratique et de compétence guerrière portée par ἐπίσταμαι avec πόλεμον.
theological_decisions:
- issue: Identité et connotations des «géants»
  choice: Conserver «les géants» sans autre identification.
  alternative: «les hommes puissants» ou «les Nephilim»
  rationale: Le grec porte γίγαντες. «Nephilim» imposerait une identification intertextuelle qui n’est pas formulée dans ce verset, tandis que «hommes puissants» atténuerait le sens lexical.
- issue: Rapport entre leur célébrité et leur ancienneté
  choice: Rattacher «apparus dès les temps anciens» aux géants célèbres.
  alternative: «célèbres depuis le commencement» en absorbant le participe γενόμενοι
  rationale: La construction grecque est condensée et permet une certaine hésitation syntaxique. La formulation retenue fait entendre le participe sans transformer «le commencement» en notion théologique absolue.
translation_notes:
  register: Français international moderne, clair et digne. L’inversion «Là naquirent» maintient une légère solennité narrative; le vocabulaire reste accessible et n’importe aucune interprétation confessionnelle.
