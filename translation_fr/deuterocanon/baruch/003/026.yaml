  source_fidelity: La traduction rend correctement ἐκεῖ ἐγεννήθησαν (« Là naquirent »), γίγαντες (« géants »), εὐμεγέθεις (« de grande taille ») et ἐπιστάμενοι πόλεμον (« habiles à la guerre »). Toutefois, « ces hommes célèbres » ajoute « hommes », absent du grec et susceptible de réduire indûment la référence des γίγαντες. « Dès les temps anciens » affaiblit aussi quelque peu ἀπ’ ἀρχῆς (« dès le commencement / depuis le commencement »).
  naturalness: La phrase est claire et d’un registre convenable. La reprise appositionnelle peut être conservée sans l’ajout interprétatif « hommes ». « De grande taille » est légèrement plus direct et plus proche du grec que « d’une taille imposante ».
  terminology: « Géants » est le terme requis et ne doit pas être remplacé par « Nephilim » ni par une paraphrase interprétative. « Êtres célèbres » conserve l’apposition sans déterminer leur nature. « Habiles à la guerre » convient au registre et au sens de ἐπιστάμενοι πόλεμον.
