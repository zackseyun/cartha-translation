translation:
  language: fr
  text: Ne te souviens pas des injustices de nos pères, mais souviens-toi de ta main[a] et de ton nom en ce moment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le langage biblique, la « main » de Dieu peut désigner sa puissance ou son action.
