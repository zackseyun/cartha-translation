lexical_decisions:
- source_word: μὴ μνησθῇς
  choice: Ne te souviens pas
  rationale: Rend directement la demande adressée à Dieu et préserve l’opposition rhétorique avec μνήσθητι dans la seconde proposition.
- source_word: ἀδικιῶν
  choice: des injustices
  rationale: Le terme désigne les actes contraires à la justice ou à la droiture. « Injustices » conserve sa portée morale sans le réduire au terme plus spécifique « péchés ».
- source_word: πατέρων ἡμῶν
  choice: de nos pères
  rationale: Traduction formellement fidèle de l’expression masculine grecque, qui vise ici les pères des générations antérieures.
- source_word: μνήσθητι
  choice: souviens-toi
  rationale: 'La répétition du même verbe français conserve le contraste délibéré : ne pas se souvenir de leurs injustices, mais se souvenir de la main et du nom de Dieu.'
- source_word: χειρός σου
  choice: de ta main
  rationale: La traduction littérale préserve l’image biblique, qui peut évoquer la puissance ou l’action de Dieu sans imposer cette interprétation dans le texte principal.
- source_word: ὀνόματός σου
  choice: de ton nom
  rationale: « Nom » garde les résonances bibliques d’identité, d’honneur et de réputation, sans les expliciter excessivement.
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: en ce temps-ci
  rationale: Expression naturelle qui conserve la référence au moment ou aux circonstances présentes ainsi que la nuance de καιρός.
theological_decisions:
- issue: Sens de « souviens-toi de ta main et de ton nom »
  choice: Conserver littéralement « ta main » et « ton nom », laissant entendre un appel à Dieu pour qu’il agisse selon sa puissance et son identité ou son honneur.
  alternative: 'Expliciter : « souviens-toi de ta puissance et de l’honneur de ton nom ».'
  rationale: Le grec demeure imagé et ne formule pas explicitement toutes les implications théologiques. La traduction préserve donc l’ambiguïté et la densité de la prière.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme de « Ne te souviens pas… mais souviens-toi… » est conservé, ainsi que les images bibliques de la main et du nom.
