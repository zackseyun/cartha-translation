lexical_decisions:
- source_word: ἐγκατέλιπες
  choice: tu as abandonné
  rationale: L’aoriste actif à la deuxième personne du singulier exprime ici l’action d’abandonner. « Tu as abandonné » est naturel en français moderne et conserve une force plus nette que « tu as laissé ».
- source_word: πηγήν
  choice: source
  rationale: πηγή désigne une source d’eau, d’où jaillit un courant. « Source » garde en français l’image concrète tout en exprimant naturellement l’origine de la sagesse.
- source_word: σοφίας
  choice: sagesse
  rationale: Équivalent français direct de σοφία. Le contexte peut évoquer la sagesse divine, mais le texte dit simplement « sagesse » et ne justifie aucune explicitation.
theological_decisions:
- issue: Force métaphorique de « la source de la sagesse »
  choice: Conserver directement la métaphore avec « source »
  alternative: « l’origine de la sagesse » ou « la fontaine de la sagesse »
  rationale: Le grec emploie l’image concrète d’une source d’eau. « Source » préserve cette image en français courant sans réduire le sens à une explication abstraite ni préciser explicitement l’identité de cette source.
translation_notes:
  register: Formulation brève, solennelle et naturelle en français international moderne. Le tutoiement singulier reproduit la deuxième personne du singulier grec.
