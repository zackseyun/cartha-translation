  text: You abandoned the fountain of wisdom[a].
translation:
  language: fr
  text: Tu as abandonné la source de la sagesse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la fontaine de la sagesse » ; le mot grec désigne une source d’eau.
