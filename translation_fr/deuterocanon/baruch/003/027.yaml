  text: God did not choose these[b][a], nor did he give them the way of knowledge.
translation:
  language: fr
  text: Dieu n’a pas choisi ceux-là[a] et ne leur a pas non plus donné le chemin de la connaissance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « eux ». Le grec emploie un démonstratif, qui peut désigner plus précisément les groupes mentionnés dans le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « le chemin qui mène à la connaissance » ou « la voie de l’intelligence » ; littéralement, « le chemin de la connaissance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ τούτους ἐξελέξατο
  choice: Dieu n’a pas choisi ceux-là
  rationale: « Ceux-là » conserve la valeur démonstrative de τούτους et renvoie aux êtres mentionnés dans le contexte précédent; « choisir » rend naturellement ἐξελέξατο.
- source_word: ὁ θεός
  choice: Dieu
  rationale: Équivalent français usuel de ὁ θεός dans ce contexte.
- source_word: οὐδὲ
  choice: et ne… pas non plus
  rationale: Cette tournure coordonne clairement la seconde proposition négative à la première et restitue la force cumulative de οὐδέ.
- source_word: ὁδὸν ἐπιστήμης
  choice: le chemin de la connaissance
  rationale: La formulation conserve l’image du chemin et le rapport génitif du grec, sans introduire explicitement l’idée directionnelle d’un chemin menant à la connaissance.
- source_word: ἔδωκεν αὐτοῖς
  choice: ne leur a… donné
  rationale: « Donner » est l’équivalent direct de ἔδωκεν, tandis que le pronom indirect « leur » rend αὐτοῖς de façon idiomatique.
theological_decisions:
- issue: Valeur démonstrative de τούτους
  choice: ceux-là
  alternative: les
  rationale: Le démonstratif désigne expressément le groupe évoqué dans le contexte. Le simple pronom « les » serait naturel, mais atténuerait cette précision rhétorique.
- issue: Sens de ὁδὸν ἐπιστήμης
  choice: le chemin de la connaissance
  alternative: le chemin qui mène à la connaissance; la voie de l’intelligence
  rationale: Le choix retenu respecte la construction grecque et l’imagerie sapientielle sans trancher si la connaissance caractérise le chemin ou en constitue le but.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste naturelle tout en maintenant le parallélisme des deux propositions négatives et l’expression sapientielle du grec.
