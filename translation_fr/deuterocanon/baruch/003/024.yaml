base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/024.yaml
  text: O Israel[a], how great is the house of God, and how vast is the place of his possession;
translation:
  language: fr
  text: Ô Israël, comme elle est grande, la maison de Dieu, et comme il est vaste, le lieu qui lui appartient[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le lieu de sa création ». Le grec κτήσεως peut désigner une possession, une propriété, et, dans certains contextes, la création ou ce qui a été acquis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ Ἰσραήλ
  choice: Ô Israël
  rationale: Conserve l'apostrophe solennelle et directe du grec dans un français digne et naturel.
- source_word: ὡς μέγας
  choice: comme elle est grande
  rationale: Rend la valeur exclamative de ὡς avec l'adjectif, tout en accordant celui-ci avec « maison ».
- source_word: ὁ οἶκος τοῦ θεοῦ
  choice: la maison de Dieu
  rationale: Traduction formellement proche qui maintient l'ouverture de l'image entre demeure, temple et domaine, sans l'interpréter comme une maisonnée.
- source_word: ἐπιμήκης
  choice: vaste
  rationale: Exprime idiomatiquement la grande étendue spatiale indiquée par le terme grec, qui signifie littéralement long ou étendu.
- source_word: ὁ τόπος
  choice: le lieu
  rationale: Équivalent direct qui préserve le caractère à la fois concret et souple de l'expression spatiale.
- source_word: τῆς κτήσεως αὐτοῦ
  choice: qui lui appartient
  rationale: Rend naturellement le sens de possession ou de propriété et évite le tour français pesant « le lieu de sa possession », tout en conservant l'autre sens possible en note.
theological_decisions:
- issue: Sens de κτήσεως en rapport avec la « maison » et le « lieu » de Dieu
  choice: qui lui appartient
  alternative: le lieu de sa création
  rationale: Le contexte spatial favorise l'idée du domaine appartenant à Dieu. Toutefois, κτῆσις peut aussi désigner la création ou ce qui a été acquis; cette possibilité théologiquement significative est donc maintenue en note.
translation_notes:
  register: Français international moderne, solennel mais accessible. La répétition de « comme » et la dislocation légère des deux groupes nominaux préservent l'élan exclamatif et le parallélisme du grec.
