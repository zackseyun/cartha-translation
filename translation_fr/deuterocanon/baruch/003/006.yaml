lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Dans cette prière, la conjonction introduit le motif de la demande précédente; « Car » conserve clairement ce lien argumentatif.
- source_word: σὺ
  choice: c’est toi… qui
  rationale: La tournure clivée rend en français l’insistance portée par le pronom grec explicitement exprimé.
- source_word: Κύριος
  choice: Seigneur
  rationale: Dans ce contexte divin, « Seigneur » est le titre français naturel et traditionnel.
- source_word: ὁ θεὸς ἡμῶν
  choice: notre Dieu
  rationale: Cette formulation possessive est idiomatique et correspond directement au groupe nominal grec.
- source_word: αἰνέσομέν
  choice: nous te louerons
  rationale: Le futur de l’indicatif est conservé, sans le transformer en exhortation.
- source_word: σε
  choice: te
  rationale: Le pronom objet renvoyant à Dieu se rend naturellement par « te ».
- source_word: Κύριε
  choice: Seigneur
  rationale: La virgule et la position finale signalent clairement l’apostrophe; le français moderne n’exige pas l’interjection « ô ».
theological_decisions:
- issue: Traduction de κύριος comme titre divin et comme apostrophe
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » convient au contexte de prière et maintient le même titre dans l’affirmation puis dans l’adresse directe.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « Seigneur » est maintenue comme dans le grec, et l’emphase de σὺ est rendue par « c’est toi… qui ».
