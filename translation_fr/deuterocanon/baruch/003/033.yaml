  text: He sends out the light[a], and it goes; he called it, and it obeyed him with trembling.
translation:
  language: fr
  text: Il envoie la lumière[a], et elle va ; il l’a appelée, et elle lui a obéi en tremblant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Celui qui envoie la lumière, et elle va. » Le grec commence par un participe précédé de l’article, employé de manière substantive comme une désignation de Dieu.'
    reason: alternative lexicale et syntaxique
lexical_decisions:
- source_word: ὁ ἀποστέλλων
  choice: Il envoie
  rationale: Le participe grec substantivé désigne Dieu dans le contexte. Une proposition française avec un verbe conjugué est naturelle et conserve l’action caractéristique, tandis que la note signale la forme plus littérale.
- source_word: τὸ φῶς
  choice: la lumière
  rationale: L’article grec est naturellement conservé. Il s’agit ici de la lumière cosmique placée sous l’autorité de Dieu.
- source_word: πορεύεται
  choice: elle part
  rationale: Le verbe exprime simplement le mouvement de la lumière envoyée. « Elle part » rend clairement la réponse immédiate à l’envoi tout en maintenant la personnification.
- source_word: ἐκάλεσεν αὐτό
  choice: il l’appelle
  rationale: Le présent français convient à l’enchaînement poétique décrivant l’action caractéristique de Dieu. « Appelle » conserve l’image personnelle sans préciser davantage la nature de cet appel.
- source_word: ὑπήκουσεν αὐτῷ
  choice: elle lui obéit
  rationale: Le verbe exprime ici l’obéissance responsive de la création à Dieu. Cette formulation française est claire et préserve la personnification.
- source_word: τρόμῳ
  choice: en tremblant
  rationale: Le datif a une valeur adverbiale. « En tremblant » restitue l’image vive de la lumière répondant avec crainte révérencielle, sans l’aplanir.
theological_decisions:
- issue: Personnification de la lumière qui obéit à Dieu
  choice: Conserver directement la personnification dans le texte principal.
  alternative: Reformuler comme une description impersonnelle de l’ordre naturel.
  rationale: Le grec présente explicitement la lumière comme partant, étant appelée et obéissant en tremblant. Cette image souligne la souveraineté de Dieu sur la création.
- issue: Référent du participe substantivé ὁ ἀποστέλλων
  choice: Employer le pronom personnel « Il », qui renvoie à Dieu dans le contexte.
  alternative: « Celui qui envoie la lumière »
  rationale: La construction grecque peut se rendre formellement par « celui qui », mais le contexte identifie clairement Dieu. Le pronom donne une phrase française fluide sans ajouter de contenu interprétatif.
- issue: Aspect temporel des aoristes ἐκάλεσεν et ὑπήκουσεν dans l’enchaînement poétique
  choice: 'Employer le présent de narration : « il l’appelle, et elle lui obéit ».'
  alternative: « il l’appela, et elle lui obéit »
  rationale: Le présent maintient en français la description vive et générale de l’autorité créatrice de Dieu, en continuité avec « il envoie » et « elle part », sans nier la forme aoriste grecque.
translation_notes:
  register: Français international moderne, courant et digne. La ponctuation conserve le parallélisme poétique ; les pronoms féminins reprennent naturellement « la lumière ». Le vocabulaire reste concret afin de préserver la personnification du texte grec.
