base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/034.yaml
  text: And the stars shone in their watches and rejoiced;[a]
translation:
  language: fr
  text: Les étoiles brillèrent à leurs postes[a] et se réjouirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans leurs veilles », « à leurs postes de garde » ou, selon le contexte, « dans leurs stations ». L’expression grecque emploie φυλακαί, littéralement « veilles » ou « postes de garde » ; elle évoque poétiquement les places ou les temps qui sont assignés aux étoiles.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀστέρες
  choice: étoiles
  rationale: Équivalent direct et naturel du pluriel grec désignant les astres.
- source_word: ἔλαμψαν
  choice: brillèrent
  rationale: Le verbe λάμπω signifie émettre de la lumière ou briller. Le passé simple restitue ici avec concision la valeur narrative de l’aoriste.
- source_word: ἐν ταῖς φυλακαῖς αὐτῶν
  choice: pendant leurs veilles
  rationale: φυλακή peut désigner une veille, un temps de garde ou un poste de garde. « Pendant leurs veilles » conserve l’image poétique et l’ambiguïté temporelle ou spatiale du grec sans introduire explicitement l’idée de trajectoires astronomiques.
- source_word: εὐφράνθησαν
  choice: se réjouirent
  rationale: Cette forme exprime la joie. « Se réjouirent » préserve la personnification des étoiles et le registre poétique élevé.
theological_decisions:
- issue: Personnification poétique des étoiles
  choice: 'Conserver directement l’attribution de la joie aux étoiles : « se réjouirent »'
  alternative: Reformuler comme une simple description impersonnelle d’un phénomène astronomique
  rationale: Le grec attribue explicitement la joie aux étoiles dans une évocation de la création répondant à l’ordre divin. Il convient de préserver cet effet littéraire et théologique sans le rationaliser.
translation_notes:
  register: Français moderne, clair et digne, avec maintien du parallélisme bref et de la personnification poétique du texte grec.
