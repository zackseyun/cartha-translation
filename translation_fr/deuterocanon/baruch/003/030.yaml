  text: Who has crossed beyond the sea and found her[a], and will bring her for choice gold?
translation:
  language: fr
  text: Qui a traversé la mer, a trouvé la Sagesse[a] et l’apportera pour de l’or de choix ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’a trouvée » ; le pronom grec est féminin parce qu’il renvoie à la Sagesse, personnifiée dans le contexte. La relation exacte exprimée par « pour de l’or de choix » est concise en grec et peut être comprise avec une nuance de prix ou d’échange.'
    reason: Précise le référent féminin et préserve l’ambiguïté syntaxique et sémantique de χρυσίου ἐκλεκτοῦ sans ajouter l’idée d’un retour.
lexical_decisions:
- source_word: τίς
  choice: Qui
  rationale: Introduit naturellement en français la question rhétorique sur l’impossibilité pour l’être humain d’acquérir la Sagesse par ses propres moyens.
- source_word: διέβη πέραν τῆς θαλάσσης
  choice: a traversé la mer
  rationale: Rend l’action accomplie de l’aoriste et l’idée de passage jusqu’à l’autre côté, sans la tournure peu idiomatique « au-delà de la mer ».
- source_word: εὗρεν αὐτήν
  choice: a trouvé la Sagesse
  rationale: Explicite le référent féminin dans un français naturel tout en maintenant la personnification présente dans le contexte.
- source_word: οἴσει αὐτὴν
  choice: la rapportera
  rationale: Le futur de φέρω signifie « apportera/transportera »; dans la scène envisagée, « rapportera » exprime naturellement le retour avec la Sagesse depuis l’autre côté de la mer.
- source_word: χρυσίου ἐκλεκτοῦ
  choice: en échange d’un or de choix
  rationale: Le génitif peut exprimer ici le prix ou l’échange. « Or de choix » conserve l’idée d’un or sélectionné, précieux, avec un registre digne.
theological_decisions:
- issue: Personnification de la Sagesse dans αὐτήν
  choice: Nommer « la Sagesse » puis reprendre par « la »
  alternative: Employer seulement le pronom « elle » ou une formulation impersonnelle
  rationale: Le contexte identifie le référent comme la Sagesse, nom féminin et personnifié. L’explicitation évite en français un pronom sans antécédent immédiat tout en préservant l’image, sans lui imposer une identification doctrinale ultérieure.
- issue: Valeur de χρυσίου ἐκλεκτοῦ
  choice: en échange d’un or de choix
  alternative: avec de l’or de choix
  rationale: La construction est concise et peut admettre une nuance de prix ou de moyen. Le texte principal retient l’échange, cohérent avec l’idée d’obtenir la Sagesse contre une richesse, tout en signalant l’autre possibilité en note.
translation_notes:
  register: Français international moderne, clair et digne. La question rhétorique est conservée en une seule phrase. « Sagesse » prend une majuscule pour rendre visible la personnification contextuelle, non pour imposer une lecture doctrinale particulière.
