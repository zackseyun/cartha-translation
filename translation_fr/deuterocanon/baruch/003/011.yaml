lexical_decisions:
- source_word: προσελογίσθης
  choice: tu as été comptée
  rationale: L’aoriste passif exprime le fait d’être rangée ou comptée comme appartenant à un groupe. Le féminin s’accorde avec Jérusalem, interpellée dans le contexte.
- source_word: μετὰ
  choice: parmi
  rationale: Après le verbe « compter », « parmi » rend naturellement l’idée d’inclusion dans un groupe portée par μετά avec le génitif.
- source_word: τῶν εἰς ᾅδου
  choice: ceux qui sont dans l’Hadès
  rationale: Cette formulation conserve l’expression grecque désignant les personnes qui se trouvent dans le séjour des morts, sans la réduire simplement aux « morts ».
- source_word: ᾅδου
  choice: l’Hadès
  rationale: Le terme grec est conservé afin de distinguer le séjour des morts de l’enfer compris comme lieu du châtiment final.
theological_decisions:
- issue: Traduction de ᾅδου
  choice: l’Hadès
  alternative: le séjour des morts
  rationale: « L’Hadès » préserve le terme grec et son ambiguïté conceptuelle sans l’assimiler à l’enfer du jugement final. Une formulation explicative plus accessible est donnée en note.
translation_notes:
  register: Français moderne, naturel et digne. Le tutoiement correspond à l’adresse au singulier; le participe au féminin reflète Jérusalem, destinataire personnifiée dans le contexte. « Hadès » est conservé avec son article usuel en français et expliqué en note.
