base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/036.yaml
  text: This is our God[a]; no other will be reckoned beside him.
translation:
  language: fr
  text: C’est notre Dieu ; aucun autre ne sera compté auprès de lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aucun autre ne sera compté à côté de lui » ; ou : « aucun autre ne sera considéré en comparaison avec lui ».'
    reason: La construction λογίζομαι πρός peut évoquer le fait de compter quelqu’un auprès d’un autre ou de le considérer par comparaison avec lui.
lexical_decisions:
- source_word: οὗτος
  choice: C’est lui
  rationale: Le démonstratif employé comme prédicat désigne avec insistance celui qui vient d’être évoqué ; « C’est lui » est naturel en français et conserve cette valeur identificatrice.
- source_word: ὁ θεὸς ἡμῶν
  choice: notre Dieu
  rationale: Cette formulation rend directement et naturellement le groupe possessif grec.
- source_word: οὐ λογισθήσεται
  choice: aucun autre ne sera considéré
  rationale: Le futur passif de λογίζομαι exprime ici le fait d’être tenu ou regardé comme tel, sans transformer la phrase en simple affirmation d’existence.
- source_word: ἕτερος
  choice: aucun autre
  rationale: Le terme marque ici l’exclusion de tout autre être mis en relation avec Dieu.
- source_word: πρὸς αὐτόν
  choice: comme son égal
  rationale: Dans cette construction, πρός indique une mise en relation ou une comparaison. Cette tournure française exprime clairement l’idée sans donner au syntagme un sens spatial.
theological_decisions:
- issue: Affirmation de l’unicité de Dieu dans la proposition comparative
  choice: aucun autre ne sera considéré comme son égal
  alternative: aucun autre ne sera compté à côté de lui
  rationale: La traduction conserve la formulation passive et comparative du grec au lieu de l’expliciter en « il n’y a pas d’autre Dieu ». Elle exprime l’exclusivité tout en évitant d’ajouter un complément absent du texte.
translation_notes:
  register: Français moderne, digne et accessible. « C’est lui » garde l’emphase du démonstratif ; « comme son égal » privilégie la clarté idiomatique, tandis que la note conserve les rendus plus formels possibles.
