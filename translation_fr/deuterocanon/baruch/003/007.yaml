base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/007.yaml
  text: For because of this you have put your fear in our hearts[a], that we may call on your name; and we will praise you in our exile[d][c][b], because we have turned away from our hearts every unrighteousness of our fathers who sinned before you.
translation:
  language: fr
  text: Car c’est pour cela que tu as mis ta crainte dans notre cœur[a], afin que nous invoquions ton nom ; et nous te louerons dans notre exil[b], car nous avons écarté de notre cœur toute l’injustice[c] de nos pères, qui ont péché devant toi[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la crainte de toi ». Le grec dit littéralement « ta crainte », expression biblique désignant la crainte dirigée vers Dieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans notre déportation » ou « dans notre captivité ». Le terme grec peut désigner l’état de ceux qui ont été déplacés loin de leur pays.
    reason: lexical_alternative
  - marker: c
    text: Ou « toute la faute » ou « tout le mal » selon la nuance donnée ici au terme grec.
    reason: lexical_alternative
  - marker: d
    text: Ou « qui ont péché contre toi ». Le grec dit plus littéralement « devant toi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: c’est pour cela
  rationale: Cette tournure conserve la valeur causale de l’expression grecque tout en restant naturelle en français.
- source_word: ἔδωκας τὸν φόβον σου ἐπὶ καρδίαν ἡμῶν
  choice: tu as mis ta crainte dans notre cœur
  rationale: « Mis » exprime idiomatiquement l’action de donner ou placer une disposition intérieure. Le singulier « cœur », conforme au grec, présente le peuple priant comme une collectivité.
- source_word: ἐπικαλεῖσθαι τὸ ὄνομά σου
  choice: afin que nous invoquions ton nom
  rationale: La proposition de but rend la fonction probable de l’infinitif ; « invoquer ton nom » conserve le langage biblique de la prière.
- source_word: ἐν τῇ ἀποικίᾳ ἡμῶν
  choice: dans notre exil
  rationale: Dans le contexte de Baruch, ἀποικία désigne la condition d’un peuple déporté loin de son pays ; « exil » est le terme français le plus clair.
- source_word: ἀπεστρέψαμεν ἀπὸ καρδίας ἡμῶν
  choice: nous avons écarté de notre cœur
  rationale: 'Le verbe est compris transitivement avec πᾶσαν ἀδικίαν comme complément : les priants ont ôté de leur cœur l’injustice héritée de leurs pères.'
- source_word: πᾶσαν ἀδικίαν
  choice: toute l’injustice
  rationale: « Injustice » garde la portée morale et religieuse de ἀδικία sans la limiter aux seuls actes judiciaires.
- source_word: πατέρων ἡμῶν
  choice: de nos pères
  rationale: Le grec désigne explicitement les pères du peuple ; cette formulation conserve l’image généalogique et la responsabilité ancestrale.
- source_word: τῶν ἡμαρτηκότων ἐναντίον σου
  choice: qui ont péché devant toi
  rationale: « Devant toi » restitue directement ἐναντίον σου et maintient l’idée d’un péché commis en présence de Dieu, sans l’aplatir en « contre toi ».
theological_decisions:
- issue: Sens de τὸν φόβον σου
  choice: ta crainte
  alternative: la crainte de toi ; le respect pour toi
  rationale: La formulation littérale préserve la tension biblique entre peur, profond respect et obéissance envers Dieu, plutôt que de réduire le terme à la seule révérence.
- issue: Rapport entre l’injustice présente et celle des pères
  choice: nous avons écarté de notre cœur toute l’injustice de nos pères
  alternative: nous nous sommes détournés de tout cœur de toute l’injustice de nos pères
  rationale: La syntaxe permet de prendre πᾶσαν ἀδικίαν comme objet direct du verbe. La formulation retenue conserve aussi l’image explicite d’une injustice retirée du cœur, sans nier la dimension de repentance.
- issue: Traduction de πατέρων
  choice: nos pères
  alternative: nos ancêtres
  rationale: « Nos pères » suit le terme masculin du texte et maintient le langage biblique de la faute héritée des générations antérieures, sans introduire une neutralisation interprétative.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le tutoiement correspond à l’adresse directe traditionnelle à Dieu. La phrase conserve l’enchaînement causal et pénitentiel du grec, tandis que « dans notre cœur » et « afin que nous invoquions » assurent une lecture naturelle.
