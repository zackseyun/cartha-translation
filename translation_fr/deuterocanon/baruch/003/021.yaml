base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/021.yaml
  text: Nor did they understand its paths[a], nor did they take hold of it; their sons became far from their way,
translation:
  language: fr
  text: Ils ne comprirent pas non plus ses sentiers et ne la saisirent pas ; leurs fils s’éloignèrent de leur chemin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leurs fils devinrent loin de leur chemin ». La formulation grecque de cette dernière proposition est difficile ; on pourrait aussi comprendre : « leurs fils s’éloignèrent du chemin ».'
    reason: La note signale la tournure littérale et conserve une autre compréhension possible sans corriger silencieusement le texte principal.
lexical_decisions:
- source_word: συνῆκαν
  choice: comprirent
  rationale: Le verbe συνίημι exprime ici le fait de comprendre ou de saisir intellectuellement ; « comprirent » est naturel et convient à l’image des sentiers de la sagesse.
- source_word: τρίβους
  choice: sentiers
  rationale: τρίβος désigne un sentier ou une piste. « Sentiers » conserve l’image figurée tout en la distinguant légèrement de ὁδός dans la dernière proposition.
- source_word: ἀντελάβοντο
  choice: la saisirent
  rationale: Le moyen de ἀντιλαμβάνομαι peut signifier prendre, saisir ou s’emparer de. Le pronom féminin renvoie naturellement à la sagesse ; « la saisirent » préserve à la fois l’image d’une prise et la possibilité d’une compréhension plus profonde.
- source_word: οἱ υἱοὶ αὐτῶν
  choice: leurs fils
  rationale: Le grec porte explicitement le masculin pluriel « fils » ; la traduction conserve cette précision sans généraliser en « enfants ».
- source_word: πόρρω ἐγενήθησαν
  choice: s’éloignèrent
  rationale: Littéralement, l’expression signifie « devinrent loin ». « S’éloignèrent » rend cette évolution vers la distance dans un français naturel, sans préciser indûment s’il s’agit d’un déplacement ou d’un éloignement moral.
- source_word: ἀπὸ τῆς ὁδοῦ αὐτῶν
  choice: de leur chemin
  rationale: Le texte transmis emploie le possessif pluriel αὐτῶν, le plus directement rendu par « leur ». Malgré la tournure difficile, la traduction ne corrige pas le texte en « son chemin » ou « le chemin ».
theological_decisions:
- issue: Terme filial genré
  choice: leurs fils
  alternative: leurs enfants
  rationale: Le grec dit expressément « fils ». Aucun élément contextuel n’impose ici une formulation englobante ; la précision du texte source est donc conservée.
- issue: Tournure difficile de la proposition finale
  choice: leurs fils s’éloignèrent de leur chemin
  alternative: leurs fils s’éloignèrent du chemin
  rationale: Le possessif pluriel du grec est maintenu afin de ne pas résoudre silencieusement une syntaxe difficile ni de substituer une reconstruction plus fluide au texte attesté.
translation_notes:
  register: Français moderne, digne et accessible. La coordination négative et les métaphores du chemin sont préservées. « S’éloignèrent » évite le calque peu naturel « devinrent loin », tandis que la note rend compte de la difficulté du grec.
