base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/014.yaml
  text: Learn where prudence is[a], where strength is, where understanding is, so that you may know at the same time where length of days and life are[b], where light for the eyes and peace are.
translation:
  language: fr
  text: Apprends où se trouve la sagesse pratique[a], où se trouve la force, où se trouve l’intelligence, afin de savoir en même temps où se trouvent la longévité et la vie, où se trouvent la lumière des yeux[b] et la paix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la prudence ». Le grec désigne la sagesse ou le discernement qui guide le jugement et l’action.
    reason: lexical_alternative
  - marker: b
    text: « La lumière des yeux » traduit littéralement une expression métaphorique qui peut évoquer la vitalité, la joie ou la clarté.
    reason: metaphor_clarification
lexical_decisions:
- source_word: μάθε
  choice: Apprends
  rationale: L’impératif aoriste de μανθάνω exhorte directement le destinataire à acquérir cette connaissance.
- source_word: φρόνησις
  choice: sagesse pratique
  rationale: Le terme désigne une sagesse qui s’exerce dans le jugement et la conduite. Cette formulation évite de réduire le sens à la seule précaution que peut évoquer « prudence » en français moderne.
- source_word: ἰσχύς
  choice: force
  rationale: Équivalent français direct et naturel, sans amplifier le terme en « puissance ».
- source_word: σύνεσις
  choice: intelligence
  rationale: Le mot désigne la faculté de comprendre. « Intelligence » le distingue ici de la sagesse pratique exprimée par φρόνησις.
- source_word: τοῦ γνῶναι
  choice: afin de savoir
  rationale: L’infinitif grec peut exprimer le but; une proposition finale restitue naturellement ce rapport en français.
- source_word: ἅμα
  choice: en même temps
  rationale: La traduction conserve l’idée que ces biens sont reconnus ensemble.
- source_word: μακροβίωσις
  choice: longévité
  rationale: Le nom grec désigne explicitement la durée prolongée de la vie. « Longévité » maintient sa distinction formelle avec ζωή, « vie ».
- source_word: ζωή
  choice: vie
  rationale: Équivalent usuel et direct dans ce contexte.
- source_word: φῶς ὀφθαλμῶν
  choice: lumière des yeux
  rationale: La traduction littérale conserve une métaphore biblique susceptible d’évoquer la vitalité, la joie ou la clarté sans en imposer une seule interprétation.
- source_word: εἰρήνη
  choice: paix
  rationale: Traduction courante qui préserve les résonances bibliques du terme, lequel peut aussi englober le bien-être.
theological_decisions:
- issue: Distinction entre les termes relatifs à la sagesse
  choice: 'Maintenir φρόνησις, ἰσχύς et σύνεσις comme trois réalités distinctes : « sagesse pratique », « force » et « intelligence ».'
  alternative: Employer « sagesse » ou « intelligence » pour plusieurs de ces termes afin d’alléger la phrase.
  rationale: L’énumération grecque présente des biens distincts; les fusionner atténuerait la structure et la tension propres au texte sapientiel.
- issue: Rapport entre μακροβίωσις et ζωή
  choice: Traduire « la longévité et la vie ».
  alternative: Traduire « une longue vie » ou ajouter une idée telle que la prospérité.
  rationale: Le grec coordonne explicitement la durée de la vie et la vie elle-même. La formulation retenue conserve cette apparente proximité sémantique sans importer une notion absente.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « où se trouve » est conservée pour rendre l’insistance rhétorique du grec; « sagesse pratique » explicite un terme dont le simple équivalent « prudence » risquerait d’être compris trop étroitement.
