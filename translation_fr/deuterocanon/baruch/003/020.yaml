base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/020.yaml
  text: The younger men saw the light and lived on the earth[b][a], but they did not know the way of knowledge.
translation:
  language: fr
  text: Les plus jeunes[a] ont vu la lumière[b] et ont vécu sur la terre, mais ils n’ont pas connu le chemin de la connaissance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les jeunes » ou « les hommes plus jeunes ». Le grec emploie un masculin pluriel comparatif.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ont vu lumière ». Cette expression peut évoquer le fait d’être en vie ou de jouir de la vie.
    reason: lexical_alternative
lexical_decisions:
- source_word: νεώτεροι
  choice: les plus jeunes
  rationale: Le comparatif substantivé désigne les membres plus jeunes d’un groupe, en contraste avec les générations évoquées auparavant. Cette formulation française naturelle conserve la comparaison sans préciser « hommes » au-delà de ce qu’exige ici le masculin pluriel grec.
- source_word: εἶδον φῶς
  choice: ont vu la lumière
  rationale: La traduction maintient l’image concrète grecque, qui peut aussi évoquer idiomatiquement le fait d’être en vie, sans réduire cette possible portée à une seule interprétation.
- source_word: κατῴκησαν ἐπὶ τῆς γῆς
  choice: ont vécu sur la terre
  rationale: κατοικέω exprime ici le fait d’habiter ou de vivre, et γῆ a vraisemblablement le sens général de « terre » plutôt que celui d’un territoire particulier.
- source_word: ὁδὸν
  choice: le chemin
  rationale: Le terme conserve la métaphore d’une voie à suivre; malgré l’absence d’article en grec, le complément « de la connaissance » forme une expression conceptuelle définie.
- source_word: ἐπιστήμης
  choice: de la connaissance
  rationale: Dans ce contexte de sagesse, ἐπιστήμη désigne directement la connaissance ou l’intelligence; « connaissance » préserve le lien lexical avec le verbe suivant.
- source_word: οὐκ ἔγνωσαν
  choice: ils n’ont pas connu
  rationale: Cette traduction rend simplement le verbe γινώσκω et fait entendre en français l’écho entre « connaissance » et « connu ».
theological_decisions:
- issue: Portée idiomatique de « voir la lumière »
  choice: Conserver l’expression concrète « ont vu la lumière ».
  alternative: « sont venus à la vie » ou « ont joui de la vie »
  rationale: L’expression peut évoquer le fait d’être vivant, mais le grec présente directement l’image de la lumière. La conserver respecte sa force poétique et son ambiguïté.
- issue: Référence de νεώτεροι
  choice: « les plus jeunes »
  alternative: « les jeunes hommes » ou « la jeune génération »
  rationale: Le grec est un masculin pluriel substantivé, mais le contexte ne permet pas d’établir avec certitude qu’il exclut les femmes. Le masculin français « les plus jeunes » respecte la forme et la comparaison sans ajouter une précision lexicale absente.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme est conservé, ainsi que l’image poétique de la lumière et la métaphore du chemin. Les marqueurs de notes suivent immédiatement les expressions concernées.
