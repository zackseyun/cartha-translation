base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/015.yaml
  text: Who found her place[a], and who entered into her treasuries?
translation:
  language: fr
  text: Qui a trouvé le lieu où elle se trouve, et qui est entré dans ses trésoreries[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « trésors ». Le mot grec peut désigner les richesses mises en réserve ou les lieux où elles sont conservées ; « trésoreries » convient bien au verbe « entrer dans ».
    reason: alternative lexicale
lexical_decisions:
- source_word: τίς εὗρεν
  choice: Qui a trouvé
  rationale: La question rhétorique directe et l’aoriste grec sont rendus naturellement par « Qui a trouvé ».
- source_word: τὸν τόπον αὐτῆς
  choice: son lieu
  rationale: Cette formulation conserve sobrement l’image du lieu propre à la Sagesse, sans préciser s’il s’agit de sa demeure ou simplement de l’endroit où elle se trouve.
- source_word: εἰσῆλθεν εἰς
  choice: est entré dans
  rationale: Le verbe et la préposition expriment un mouvement vers l’intérieur; cette traduction en garde la valeur spatiale.
- source_word: τοὺς θησαυροὺς αὐτῆς
  choice: ses réserves
  rationale: Le grec peut désigner des trésors ou les lieux où ils sont conservés. « Réserves » maintient en français une part de cette ambiguïté et s’accorde naturellement avec « entrer dans ».
theological_decisions:
- issue: Personnification de la Sagesse
  choice: Employer les déterminants féminins « son » et « ses », dont le référent est la Sagesse
  alternative: Expliciter « le lieu de la Sagesse » et « les trésors de la Sagesse »
  rationale: Le contexte personnifie la Sagesse. Le français permet de conserver ce référent sans ajouter une interprétation christologique ou doctrinale absente du verset.
translation_notes:
  register: Français moderne, sobre et dignifié. Le parallélisme des deux questions grecques est conservé, ainsi que l’image spatiale et l’ambiguïté de θησαυρούς.
