base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/004.yaml
  text: For your name will be called by God forever[b][a], “Peace of righteousness and glory of godliness.”
translation:
  language: fr
  text: 'Car Dieu te donnera pour toujours ce nom : « Paix de la justice et gloire de la piété envers Dieu[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « gloire de la révérence envers Dieu »; le terme grec désigne la piété ou le respect religieux dirigé vers Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: κληθήσεται … σου τὸ ὄνομα
  choice: te donnera … ce nom
  rationale: La tournure grecque signifie littéralement « ton nom sera appelé ». En français actuel, « Dieu te donnera ce nom » exprime naturellement l’attribution divine d’un nom sans réduire celui-ci à un simple titre.
- source_word: παρὰ τοῦ θεοῦ
  choice: Dieu te donnera
  rationale: παρά avec le génitif indique ici l’origine ou l’agent du nom attribué. La construction active française rend clairement cette action divine.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Expression française courante et digne pour la permanence exprimée par l’idiome grec.
- source_word: εἰρήνη
  choice: Paix
  rationale: Le mot ouvre le nom solennel donné à Jérusalem; la majuscule signale cette fonction onomastique.
- source_word: δικαιοσύνης
  choice: justice
  rationale: « Justice » couvre ici la droiture conforme à ce qui est juste et forme en français une expression naturelle, « Paix de la justice », tout en conservant la relation génitive du grec.
- source_word: δόξα
  choice: gloire
  rationale: « Gloire » conserve les résonances bibliques d’honneur, de splendeur et d’éclat.
- source_word: θεοσεβείας
  choice: piété envers Dieu
  rationale: Le composé désigne explicitement la révérence ou la dévotion dirigée vers Dieu. L’ajout « envers Dieu » évite que « piété » soit compris comme une simple vertu humaine ou une compassion.
theological_decisions:
- issue: Portée de δικαιοσύνης dans le nom conféré
  choice: justice
  alternative: droiture
  rationale: Le grec peut évoquer à la fois la justice et la rectitude morale. « Justice » reste assez large dans ce contexte poétique; « droiture » demeure une traduction possible, sans qu’il faille imposer une lecture doctrinale particulière.
- issue: Interprétation des deux groupes nominaux finaux
  choice: les présenter entre guillemets comme le contenu du nom donné par Dieu
  alternative: les laisser en apposition sans guillemets
  rationale: Après la formule de nomination, les deux groupes nominaux constituent naturellement le nouveau nom. Les guillemets rendent cette structure manifeste au lecteur français sans ajouter de contenu.
- issue: Sens de θεοσεβείας
  choice: piété envers Dieu
  alternative: crainte respectueuse de Dieu
  rationale: Le terme exprime une attitude religieuse orientée vers Dieu. « Piété envers Dieu » conserve cette orientation sans identifier cette piété à une tradition confessionnelle précise.
translation_notes:
  register: Français international moderne, solennel mais accessible. La syntaxe active évite le calque peu naturel « ton nom sera appelé par Dieu », tandis que les deux éléments du nom sont conservés dans leur parallélisme poétique.
