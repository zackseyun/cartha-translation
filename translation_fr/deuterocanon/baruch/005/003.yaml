  text: For God will show your splendor to all under heaven[a].
translation:
  language: fr
  text: Car Dieu montrera ta splendeur à tous ceux qui sont sous le ciel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression désigne l’ensemble des habitants du monde.
    reason: portée de l’expression
lexical_decisions:
- source_word: ὁ γὰρ
  choice: Car
  rationale: γάρ donne la raison de l’affirmation précédente. « Car » conserve clairement ce lien explicatif dans un registre digne et naturel.
- source_word: θεὸς
  choice: Dieu
  rationale: Le nom désigne sans ambiguïté le Dieu d’Israël dans ce contexte.
- source_word: δείξει
  choice: montrera
  rationale: Le futur actif de δείκνυμι exprime l’action de rendre visible. « Montrera » en est l’équivalent français direct.
- source_word: τῇ ὑπʼ οὐρανὸν πάσῃ
  choice: à tous ceux qui sont sous le ciel
  rationale: Le grec emploie un féminin singulier substantivé qui renvoie vraisemblablement à toute la réalité habitée ou à toute population sous le ciel. Cette formulation française préserve la portée universelle et l’image du texte sans ajouter explicitement « monde » ou « terre ».
- source_word: τὴν σὴν
  choice: ta
  rationale: Le possessif de deuxième personne du singulier maintient l’adresse directe à Jérusalem.
- source_word: λαμπρότητα
  choice: splendeur
  rationale: λαμπρότης évoque à la fois l’éclat visible et la magnificence. « Splendeur » restitue ces deux dimensions sans la charge théologique plus marquée de « gloire ».
theological_decisions:
- issue: Expression de l’honneur restauré de Jérusalem par λαμπρότητα
  choice: splendeur
  alternative: éclat ; gloire
  rationale: « Splendeur » conserve la nuance lumineuse et honorifique du terme grec. « Gloire » serait possible, mais pourrait suggérer plus directement le vocabulaire théologique de δόξα, absent ici.
- issue: Étendue de τῇ ὑπʼ οὐρανὸν πάσῃ
  choice: à tous ceux qui sont sous le ciel
  alternative: au monde entier sous le ciel ; à toute la terre sous le ciel
  rationale: Le choix garde l’universalité de la promesse tout en évitant de préciser au-delà du grec si le référent est l’ensemble des peuples, du monde habité ou de la terre.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme bref du grec et son lien explicatif avec le contexte sont conservés. Le féminin singulier de l’expression universelle est rendu de manière idiomatique, avec l’ambiguïté signalée en note.
