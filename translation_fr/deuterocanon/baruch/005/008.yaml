  text: Les forêts, ainsi que tout arbre odoriférant, ont donné de l’ombre à Israël, sur l’ordre de Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δρυμοί
  choice: les forêts
  rationale: Le pluriel désigne ici des espaces boisés; « forêts » est naturel en français et correspond au sens contextuel.
- source_word: πᾶν ξύλον εὐωδίας
  choice: tous les arbres odoriférants
  rationale: Littéralement « tout arbre de bonne odeur »; « arbres odoriférants » restitue la qualité parfumée dans un registre digne et courant.
- source_word: ἐσκίασαν
  choice: ont donné de l’ombre
  rationale: Rend clairement l’action de couvrir ou d’abriter de son ombre, avec Israël comme bénéficiaire.
- source_word: προστάγματι τοῦ θεοῦ
  choice: sur l’ordre de Dieu
  rationale: 'Le datif exprime la cause ou le moyen: l’action s’accomplit en vertu du commandement divin.'
theological_decisions:
- issue: Agentivité de la création sous le commandement divin
  choice: sur l’ordre de Dieu
  alternative: par le commandement de Dieu
  rationale: « Sur l’ordre de Dieu » exprime naturellement en français que les arbres agissent conformément au décret divin, sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français moderne international, clair et digne. La coordination grecque avec καὶ…καὶ est rendue par « et… aussi », sans alourdir la phrase.
