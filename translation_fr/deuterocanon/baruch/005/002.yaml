base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/002.yaml
  text: Put on the robe of the righteousness that comes from God[d][c][b][a], and place on your head the turban of the glory of the Eternal.
translation:
  language: fr
  text: Revêts le manteau[a] de la justice qui vient de Dieu[b], et pose sur ta tête le turban[c] de la gloire de l’Éternel[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « robe » ou « manteau ample » ; le mot grec désigne un vêtement extérieur, peut-être doublé ou replié.
    reason: lexical_alternative
  - marker: b
    text: Ou « droiture qui vient de Dieu » ; « justice » peut ici inclure la rectitude morale autant que l’action juste de Dieu.
    reason: lexical_alternative
  - marker: c
    text: 'Ou « coiffure » ; traduction traditionnelle : « mitre ». Le mot grec désigne une coiffure faite d’une étoffe ou d’une bande enroulée.'
    reason: lexical_alternative
  - marker: d
    text: La tournure grecque signifie probablement « la gloire de l’Éternel », c’est-à-dire la gloire de Dieu ; elle peut aussi être comprise plus librement comme « la gloire éternelle ».
    reason: alternative_reading
lexical_decisions:
- source_word: περιβαλοῦ
  choice: Revêts
  rationale: L’impératif de περιβάλλω exprime l’action de mettre un vêtement sur soi. « Revêts » conserve l’image vestimentaire dans un français actuel et digne.
- source_word: διπλοΐδα
  choice: manteau
  rationale: Le nom désigne un vêtement extérieur ample, possiblement doublé ou replié. « Manteau » rend clairement cette fonction sans imposer une reconstruction technique du vêtement.
- source_word: τῆς παρὰ τοῦ θεοῦ δικαιοσύνης
  choice: de la justice qui vient de Dieu
  rationale: παρὰ τοῦ θεοῦ indique la provenance. En français biblique courant, « justice » garde l’étendue morale, relationnelle et judiciaire de δικαιοσύνη, tandis que la relative explicite naturellement la source divine.
- source_word: ἐπίθου
  choice: pose
  rationale: L’impératif de ἐπιτίθημι signifie mettre ou poser sur. « Pose » convient au registre poétique et à un objet placé sur la tête.
- source_word: μίτραν
  choice: turban
  rationale: μίτρα désigne une coiffure faite d’une bande ou d’une étoffe enroulée. « Turban » est concret et évite les associations ecclésiastiques modernes de « mitre ».
- source_word: τῆς δόξης τοῦ αἰωνίου
  choice: de la gloire de l’Éternel
  rationale: La construction génitive se comprend le plus naturellement comme la gloire appartenant à celui qui est éternel. « L’Éternel » rend l’adjectif substantivé sans ajouter un nom absent du grec.
theological_decisions:
- issue: Sens de δικαιοσύνη
  choice: justice
  alternative: droiture
  rationale: « Justice » est l’équivalent français large et traditionnel de δικαιοσύνη et peut porter ici les dimensions morale et salvifique. « Droiture » ferait ressortir l’aspect moral, mais réduirait la richesse du terme.
- issue: Fonction de τοῦ αἰωνίου
  choice: 'titre substantivé désignant Dieu : « de l’Éternel »'
  alternative: 'adjectif qualifiant la gloire : « de la gloire éternelle »'
  rationale: L’article et le génitif masculin singulier favorisent la lecture substantivée, « celui qui est éternel ». La lecture où l’éternité qualifie plus librement la gloire reste possible et est signalée en note.
translation_notes:
  register: Français international moderne, poétique et digne. Les impératifs au singulier gardent l’adresse personnifiée à Jérusalem. Le parallélisme vestimentaire du grec est conservé, sans archaïsme inutile ni terminologie confessionnelle spécialisée.
