  text: For God will lead Israel with gladness[a], by the light of his glory, with mercy and righteousness from him.
translation:
  language: fr
  text: Car Dieu conduira Israël dans la joie, à la lumière de sa gloire, avec la miséricorde et la justice[a] qui vient de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la droiture ».'
    reason: Alternative lexicale possible pour δικαιοσύνη.
lexical_decisions:
- source_word: ἡγήσεται
  choice: conduira
  rationale: Le futur de ἡγέομαι exprime ici l’action de mener ou de guider Israël. « Conduira » est naturel en français et conserve l’image de la restauration sous la direction de Dieu.
- source_word: μετʼ εὐφροσύνης
  choice: dans la joie
  rationale: εὐφροσύνη désigne la joie ou l’allégresse. « Dans la joie » rend naturellement la circonstance qui accompagne la conduite d’Israël.
- source_word: τῷ φωτὶ τῆς δόξης αὐτοῦ
  choice: à la lumière de sa gloire
  rationale: Le datif peut exprimer le moyen ou l’accompagnement. « À la lumière de sa gloire » reste fidèle à cette souplesse tout en étant idiomatique en français.
- source_word: ἐλεημοσύνῃ
  choice: miséricorde
  rationale: Dans ce contexte, associé à δικαιοσύνη et rapporté à Dieu, le terme désigne la miséricorde divine plutôt que l’aumône.
- source_word: δικαιοσύνῃ
  choice: justice
  rationale: « Justice » est le correspondant français naturel de δικαιοσύνη dans ce contexte de qualité et d’action divines; le terme peut aussi inclure l’idée de droiture.
- source_word: τῇ παρʼ αὐτοῦ
  choice: qui viennent de lui
  rationale: La tournure grecque qualifie vraisemblablement la miséricorde et la justice comme provenant de Dieu. L’accord au pluriel explicite ce rattachement sans ajouter une idée étrangère.
theological_decisions:
- issue: Portée de δικαιοσύνη dans un contexte de restauration divine
  choice: justice
  alternative: droiture
  rationale: En français biblique moderne, « justice » conserve à la fois l’idée de rectitude divine et celle d’une action juste. « Droiture » reste possible, mais en réduit quelque peu la portée active.
- issue: Rattachement de τῇ παρʼ αὐτοῦ
  choice: à la miséricorde et à la justice
  alternative: à la justice seule
  rationale: Bien que l’article féminin singulier puisse formellement se rattacher plus directement à δικαιοσύνη, le sens permet de comprendre que les deux réalités accompagnant Dieu proviennent de lui. La formulation française conserve cette lecture naturelle sans exclure totalement l’autre analyse grammaticale.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde l’enchaînement poétique du grec sans lourdeur, et « à la lumière » préserve la nuance instrumentale ou associative du datif.
