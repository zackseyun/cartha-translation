base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/007.yaml
  text: For God has ordered that every high mountain and the everlasting hills be made low[a], and the valleys be filled for the leveling of the ground, so that Israel may walk safely in the glory of God.
translation:
  language: fr
  text: Car Dieu a ordonné que toute haute montagne et les collines éternelles soient abaissées, et que les vallées soient comblées pour aplanir le sol, afin qu’Israël marche en sécurité dans la gloire de Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par la gloire de Dieu » ou « grâce à la gloire de Dieu ». Le datif grec peut indiquer aussi bien le moyen que la sphère ou l’accompagnement.
    reason: alternative_reading
lexical_decisions:
- source_word: συνέταξεν
  choice: a ordonné
  rationale: Exprime l’autorité et l’action organisatrice de Dieu dans un français naturel et digne.
- source_word: ταπεινοῦσθαι
  choice: soient abaissées
  rationale: Le contexte topographique appelle un abaissement physique plutôt qu’une humiliation morale.
- source_word: πᾶν ὄρος ὑψηλὸν
  choice: toute haute montagne
  rationale: Conserve la valeur distributive de πᾶν et traduit directement ὑψηλόν.
- source_word: θῖνας αἰωνίους
  choice: les collines séculaires
  rationale: Dans cette série topographique, θῖνας désigne vraisemblablement des hauteurs ou des ondulations de terrain; « séculaires » rend leur ancienneté durable sans suggérer nécessairement l’éternité absolue.
- source_word: φάραγγας
  choice: les vallées
  rationale: Bien que le mot puisse désigner des ravins ou des gorges, « vallées » convient naturellement au contraste entre hauteurs abaissées et creux comblés.
- source_word: πληροῦσθαι
  choice: soient comblées
  rationale: « Combler » rend précisément l’idée de remplir des dépressions du terrain.
- source_word: εἰς ὁμαλισμὸν τῆς γῆς
  choice: pour aplanir le sol
  rationale: Rend clairement le résultat visé par l’abaissement et le comblement, dans un français fluide.
- source_word: ἵνα βαδίσῃ
  choice: afin que … marche
  rationale: Préserve la proposition de but et l’image biblique d’un peuple avançant sur un chemin préparé.
- source_word: ἀσφαλῶς
  choice: en sécurité
  rationale: Traduction idiomatique qui exprime l’absence de danger et la sûreté du parcours.
- source_word: τῇ τοῦ θεοῦ δόξῃ
  choice: dans la gloire de Dieu
  rationale: Maintient l’ouverture du datif grec, susceptible d’évoquer la sphère, l’accompagnement ou le moyen.
theological_decisions:
- issue: Valeur du datif τῇ τοῦ θεοῦ δόξῃ par rapport à la marche d’Israël
  choice: dans la gloire de Dieu
  alternative: par la gloire de Dieu; grâce à la gloire de Dieu
  rationale: Le datif peut être compris comme indiquant la sphère ou l’accompagnement, mais aussi le moyen. Le texte principal conserve cette ampleur sans imposer une lecture exclusivement instrumentale; la note signale les autres possibilités.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve le parallélisme du nivellement du paysage et la proposition finale. « Collines séculaires » garde la tonalité élevée tout en restant compréhensible.
