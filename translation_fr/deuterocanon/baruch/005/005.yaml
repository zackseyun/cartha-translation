base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/005.yaml
  text: Rise up[a], Jerusalem, and stand on the height, and look toward the east, and see your children gathered from the setting of the sun to its rising, at the word of the Holy One[b], rejoicing in the remembrance of God.
translation:
  language: fr
  text: Lève-toi, Jérusalem, tiens-toi sur la hauteur, regarde vers l’orient et vois tes enfants rassemblés du couchant au levant, à la parole du Saint[a], se réjouissant du souvenir de Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par la parole du Saint ». Le datif grec peut indiquer le moyen.
    reason: lexical_alternative
  - marker: b
    text: Ou « parce que Dieu s’est souvenu d’eux » ou « en se souvenant de Dieu ». L’expression grecque, très concise, peut renvoyer soit au souvenir que Dieu garde de son peuple, soit au souvenir que le peuple garde de Dieu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνάστηθι
  choice: Lève-toi
  rationale: L’impératif aoriste adresse à Jérusalem un appel énergique à se mettre debout; « Lève-toi » est naturel en français moderne.
- source_word: στῆθι ἐπὶ τοῦ ὑψηλοῦ
  choice: tiens-toi sur la hauteur
  rationale: Le grec désigne un lieu élevé sans préciser qu’il s’agit d’une montagne; « la hauteur » conserve cette généralité.
- source_word: περίβλεψαι πρὸς ἀνατολάς
  choice: regarde vers l’orient
  rationale: Dans ce contexte, le verbe invite à porter le regard depuis un point élevé, tandis que le complément en précise la direction. « L’orient » rend naturellement le pluriel grec idiomatique.
- source_word: συνηγμένα τὰ τέκνα
  choice: tes enfants rassemblés
  rationale: Le participe parfait passif exprime l’état présent d’enfants qui ont été rassemblés; « enfants » ne restreint pas le sens aux fils.
- source_word: ἀπὸ ἡλίου δυσμῶν ἕως ἀνατολῶν
  choice: du couchant au levant
  rationale: Cette formulation française concise conserve l’image du soleil qui se couche et se lève, plutôt que de la réduire aux points cardinaux.
- source_word: τῷ ῥήματι
  choice: à la parole
  rationale: Le datif peut désigner la circonstance ou le moyen du rassemblement. « À la parole » évoque une parole qui provoque l’action sans expliciter davantage la relation grammaticale.
- source_word: τοῦ ἁγίου
  choice: du Saint
  rationale: L’adjectif substantivé et articulé est rendu comme un titre révérenciel sans ajouter le nom « Dieu », absent à cet endroit du grec.
- source_word: χαίροντες
  choice: se réjouissant
  rationale: Le participe présent se rapporte aux enfants rassemblés et conserve la simultanéité de leur joie.
- source_word: τῇ τοῦ θεοῦ μνείᾳ
  choice: du souvenir de Dieu
  rationale: La construction compacte peut évoquer soit le fait que Dieu se souvient de son peuple, soit le souvenir que son peuple garde de Dieu. La formulation française laisse subsister une part de cette ambiguïté.
theological_decisions:
- issue: Sens de τῇ τοῦ θεοῦ μνείᾳ
  choice: 'Formulation non résolue: « du souvenir de Dieu »'
  alternative: « parce que Dieu s’est souvenu d’eux » ou « en se souvenant de Dieu »
  rationale: Le génitif grec peut orienter le sens vers le souvenir qu’a Dieu de son peuple ou vers le souvenir que le peuple a de Dieu. Le texte ne tranche pas explicitement; la traduction et la note préservent donc cette tension.
- issue: Valeur du datif τῷ ῥήματι
  choice: « à la parole du Saint »
  alternative: « par la parole du Saint »
  rationale: Le datif autorise notamment une lecture instrumentale, mais il peut aussi présenter la parole comme le signal ou le fondement du rassemblement. La traduction principale évite de limiter indûment la construction à un seul rapport.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme impératif et l’imagerie du couchant et du levant sont conservés; aucune précision géographique ou doctrinale absente du grec n’est ajoutée.
