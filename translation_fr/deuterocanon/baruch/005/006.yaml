base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/006.yaml
  text: For they went out from you on foot[a], being led away by enemies, but God brings them to you[b], carried with glory as on a royal throne.
translation:
  language: fr
  text: Car ils sont partis de chez toi à pied, emmenés par des ennemis, mais Dieu les ramène vers toi, portés avec gloire comme sur un trône royal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La fin de la phrase peut aussi se rendre : « élevés avec gloire, comme sur un trône royal ». Le grec présente ici une image poétique condensée.'
    reason: ambiguïté syntaxique et lexicale
lexical_decisions:
- source_word: ἐξῆλθον ... παρὰ σοῦ
  choice: ils étaient partis loin de toi
  rationale: Exprime naturellement le départ hors de Jérusalem personnifiée et la séparation, sans ajouter au verbe l'idée de captivité, déjà portée par la proposition suivante.
- source_word: πεζοὶ
  choice: à pied
  rationale: Rendu français direct qui préserve le contraste avec le retour honorifique où ils sont portés.
- source_word: ἀγόμενοι ὑπʼ ἐχθρῶν
  choice: emmenés par des ennemis
  rationale: Conserve la voix passive et la contrainte exercée par les ennemis sans accentuer la violence au-delà du grec.
- source_word: εἰσάγει ... πρὸς σὲ
  choice: les ramène vers toi
  rationale: Dans le contexte du retour d'exil, « ramène » rend naturellement le mouvement d'entrée en direction de Jérusalem; « vers toi » maintient la formulation directionnelle de πρὸς σέ.
- source_word: αἰρομένους
  choice: portés
  rationale: Préserve l'image d'un transport honorifique et son contraste avec le départ à pied; le sens « élevés » demeure possible.
- source_word: μετὰ δόξης
  choice: avec gloire
  rationale: Rendu formel qui garde la portée honorifique et théologique de δόξα.
- source_word: ὡς θρόνον βασιλείας
  choice: comme sur un trône royal
  rationale: Rend en français naturel l'image grecque condensée d'une élévation royale, sans la réduire à une explication.
theological_decisions:
- issue: Renversement entre l'exil humiliant et le retour glorieux
  choice: Le départ à pied sous la conduite des ennemis est opposé au retour où Dieu les ramène, portés avec gloire.
  alternative: Traduire plus littéralement εἰσάγει par « les fait entrer auprès de toi » ou « les conduit vers toi ».
  rationale: Le contexte établit clairement un retour vers Jérusalem, mais la formulation conserve « vers toi » afin de ne pas effacer la direction exprimée par le grec.
- issue: Image du transport élevé et royal
  choice: Conserver la comparaison « portés avec gloire comme sur un trône royal ».
  alternative: « élevés avec gloire comme un trône royal » ou « portés glorieusement comme sur un trône royal ».
  rationale: La syntaxe grecque est poétique et condensée. Le rendu choisi préserve son image de dignité royale sans déterminer plus précisément le mode de transport.
translation_notes:
  register: Français international moderne, digne et accessible. Le plus-que-parfait situe naturellement le départ antérieur au retour annoncé; la personnification de Jérusalem est maintenue par « toi ».
