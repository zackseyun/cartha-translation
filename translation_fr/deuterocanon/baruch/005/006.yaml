  verdict: revise
  source_fidelity: 'La traduction rend bien l''opposition entre le départ à pied sous la conduite des ennemis et le retour honoré suscité par Dieu. Toutefois, « loin de toi » ajoute une notion de distance qui n''est pas exprimée par παρὰ σοῦ (« de toi / de chez toi »). Le plus-que-parfait (« étaient partis ») présente aussi le départ comme antérieur à un autre passé, alors que le grec emploie un aoriste narratif. La note proposée contient une alternative maladroite : « comme un trône royal » peut faire des rapatriés le comparant, tandis que l''image sous-entend qu''ils sont portés comme sur un trône royal.'
  naturalness: « Ils sont partis de chez toi » est naturel en français moderne dans cette apostrophe à Jérusalem personnifiée. « Dieu les ramène vers toi » est idiomatique et maintient le mouvement de retour vers la destinataire. « Portés avec gloire comme sur un trône royal » préserve la densité poétique de l'image tout en restant compréhensible.
  terminology: « Dieu », « ennemis », « gloire » et « trône royal » sont justes et d'un registre biblique moderne accessible. « Portés » restitue bien αἰρομένους et conserve le contraste avec « à pied ».
