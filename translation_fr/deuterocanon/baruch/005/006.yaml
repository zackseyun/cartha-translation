    rationale: ἐξῆλθον est un aoriste narratif. Le passé composé français rend le fait passé sans créer une antériorité grammaticale supplémentaire.
  - severity: medium
    issue: Alternative de note syntaxiquement trompeuse
    rationale: « élevés avec gloire comme un trône royal » ne rend pas clairement le sens spatial implicite de l'image et peut laisser entendre que les personnes sont comparées à un trône. Une formulation avec « comme sur un trône royal » préserve mieux l'ambiguïté poétique.
  revised_text: Car ils sont partis de chez toi à pied, emmenés par des ennemis, mais Dieu les ramène vers toi, portés avec gloire comme sur un trône royal.[a]
