base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/001.yaml
  text: Take off[a], O Jerusalem, the garment of your mourning and affliction[b], and put on forever the splendor of the glory from God.
translation:
  language: fr
  text: Jérusalem, enlève le vêtement de ton deuil et de ta détresse, et revêts-toi pour toujours de la splendeur de la gloire qui vient de Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « de la beauté de la gloire qui vient de Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔκδυσαι
  choice: enlève
  rationale: Impératif aoriste moyen de ἐκδύω. « Enlève » est naturel en français actuel et maintient clairement l’image du vêtement.
- source_word: στολή
  choice: vêtement
  rationale: Le terme peut désigner une robe ou un vêtement d’apparat. « Vêtement » conserve ici l’image singulière sans préciser indûment sa forme.
- source_word: πένθος
  choice: deuil
  rationale: Le nom désigne le deuil et son expression visible; « deuil » convient particulièrement à la métaphore vestimentaire.
- source_word: κακώσεως
  choice: détresse
  rationale: κάκωσις peut évoquer l’affliction, les mauvais traitements ou une condition misérable. « Détresse » garde cette amplitude sans imposer une cause particulière.
- source_word: ἔνδυσαι
  choice: revêts-toi
  rationale: Impératif aoriste moyen de ἐνδύω, en contraste direct avec Ἔκδυσαι. « Revêts-toi » préserve la symétrie vestimentaire dans un registre digne.
- source_word: εὐπρέπειαν
  choice: splendeur
  rationale: Le mot exprime beauté, dignité et magnificence. « Splendeur » restitue son relief élevé dans le contexte de la restauration.
- source_word: δόξης
  choice: gloire
  rationale: « Gloire » est l’équivalent biblique usuel de δόξα et conserve la portée théologique du terme.
- source_word: παρὰ τοῦ θεοῦ
  choice: qui vient de Dieu
  rationale: παρά avec le génitif marque ici la provenance. Cette formulation française rend explicitement la source divine sans transformer l’expression en « gloire de Dieu ».
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: L’expression indique une durée permanente; « pour toujours » est clair, naturel et fidèle au contexte.
theological_decisions:
- issue: Personnification de Jérusalem
  choice: Jérusalem est directement interpellée et invitée à changer de vêtement.
  alternative: Réduire l’image à une exhortation collective sans personnification.
  rationale: Le vocatif Ἰερουσαλήμ et les impératifs vestimentaires construisent explicitement la ville comme une figure féminine personnifiée; cette image prophétique doit être conservée.
- issue: Origine de la nouvelle splendeur
  choice: « la gloire qui vient de Dieu » marque la provenance divine.
  alternative: « la gloire de Dieu » ou « la gloire divine ».
  rationale: παρά avec le génitif indique la source. La formulation retenue évite de confondre ce que Jérusalem reçoit de Dieu avec une simple désignation possessive de la gloire propre de Dieu.
translation_notes:
  register: Français international moderne, clair et digne. L’adresse directe sans « Ô » évite un archaïsme inutile; « revêts-toi » maintient toutefois le registre élevé et la symétrie poétique des impératifs.
