base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/016.yaml
  text: She entered into the soul of a servant of the Lord[b][a], and stood against fearsome kings with wonders and signs.
translation:
  language: fr
  text: Elle entra dans l’âme d’un serviteur du Seigneur[a] et tint tête à des rois redoutables, par des prodiges et des signes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: D’après le contexte, ce « serviteur du Seigneur » est Moïse.
    reason: cross_reference
  - marker: b
    text: 'Ou : « avec des prodiges et des signes ». La tournure grecque peut exprimer le moyen ou la circonstance concomitante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: entra
  rationale: L’aoriste de εἰσέρχομαι exprime simplement l’entrée; « entra » conserve l’image concrète de la Sagesse pénétrant dans une personne.
- source_word: ψυχὴν
  choice: âme
  rationale: Dans ce contexte d’intériorité et avec εἰς, « âme » préserve la portée anthropologique du grec sans la réduire à l’intellect.
- source_word: θεράποντος Κυρίου
  choice: un serviteur du Seigneur
  rationale: θεράπων désigne un serviteur ou assistant personnel avec une certaine dignité. Le nom commun est maintenu, sans remplacer par « Moïse », identification fournie par le contexte.
- source_word: ἀντέστη
  choice: tint tête à
  rationale: ἀνθίστημι signifie se dresser contre ou résister. « Tint tête à » est naturel en français moderne et conserve l’idée d’une opposition courageuse.
- source_word: βασιλεῦσι φοβεροῖς
  choice: des rois redoutables
  rationale: βασιλεῦσι désigne précisément des rois, et φοβεροῖς les présente comme inspirant la crainte; « redoutables » rend clairement ce sens.
- source_word: ἐν τέρασι καὶ σημείοις
  choice: par des prodiges et des signes
  rationale: ἐν peut ici marquer le moyen ou la circonstance concomitante. « Par » donne une formulation française naturelle tout en conservant le binôme biblique « prodiges et signes ».
theological_decisions:
- issue: Sujet féminin implicite
  choice: Employer « Elle », en référence à la Sagesse personnifiée.
  alternative: Répéter explicitement « la Sagesse » ou employer un sujet neutre.
  rationale: Le verbe grec n’exprime pas le sujet, mais le contexte suivi du chapitre renvoie à la Sagesse, de genre féminin. « Elle » maintient la personnification sans ajouter un nom absent du verset.
- issue: Identité du « serviteur du Seigneur »
  choice: Conserver le nom commun dans le texte principal.
  alternative: Traduire directement par « Moïse ».
  rationale: Le contexte permet d’identifier Moïse, mais le grec dit seulement « un serviteur du Seigneur ». L’identification est donc signalée en note plutôt qu’introduite dans le texte.
- issue: Valeur de ἐν devant « prodiges et signes »
  choice: Retenir le sens instrumental « par ».
  alternative: 'Comprendre la formule comme une circonstance concomitante: « avec des prodiges et des signes ».'
  rationale: Les deux nuances sont possibles. Le texte principal adopte une lecture instrumentale naturelle en français, tandis que la note préserve l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. La personnification féminine de la Sagesse est conservée; la formulation évite d’expliciter dans le corps du texte ce que seul le contexte permet d’identifier.
