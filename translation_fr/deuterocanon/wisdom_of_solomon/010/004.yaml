base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/004.yaml
  text: Because of him[a], when the earth was being flooded, wisdom again saved it, steering the righteous man by means of a humble piece of wood.
translation:
  language: fr
  text: À cause de lui[a], alors que la terre était submergée par le déluge, la sagesse la sauva de nouveau en guidant le juste au moyen d’une modeste pièce de bois[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Par son intermédiaire ». Le grec peut exprimer le moyen, mais le contexte favorise ici le sens causal : l’homme injuste du verset précédent est à l’origine du jugement.'
    reason: ambiguïté syntaxique et identification du référent
  - marker: b
    text: 'Littéralement : « au moyen d’un bois de peu de valeur ». Il s’agit de l’arche; le texte souligne le caractère modeste ou insignifiant du moyen matériel employé. Le verbe grec évoque la conduite ou le pilotage d’une embarcation.'
    reason: nuance lexicale et image nautique implicite
lexical_decisions:
- source_word: δι' ὃν
  choice: À cause de lui
  rationale: Avec l’accusatif, διά exprime ici naturellement la cause. Le pronom renvoie vraisemblablement à l’homme injuste mentionné au verset précédent, présenté comme la cause du jugement du déluge.
- source_word: κατακλυζομένην γῆν
  choice: alors que la terre était submergée par le déluge
  rationale: Le participe présent passif exprime une action en cours subie par la terre. La mention explicite du déluge rend en français la nuance propre au verbe κατακλύζω.
- source_word: πάλιν διέσωσεν
  choice: la sauva de nouveau
  rationale: Le pronom reprend « la terre ». Le composé διασῴζω évoque le fait de préserver et de faire traverser un danger sain et sauf; « sauva » reste naturel et concis.
- source_word: σοφία
  choice: la sagesse
  rationale: Le nom demeure commun, sans majuscule, tout en conservant la personnification active du texte grec.
- source_word: δι' εὐτελοῦς ξύλου
  choice: au moyen d’un simple morceau de bois
  rationale: ξύλον désigne ici le bois comme moyen matériel et évoque l’arche. εὐτελής souligne son caractère modeste ou de peu de valeur; « simple » évite de suggérer une fabrication médiocre.
- source_word: τὸν δίκαιον
  choice: le juste
  rationale: Cette expression masculine singulière désigne Noé sans introduire son nom dans le corps du texte.
- source_word: κυβερνήσασα
  choice: en pilotant
  rationale: Le participe emploie un verbe nautique qui signifie gouverner ou piloter un navire. « Piloter » conserve cette image maritime, même si son complément direct est ici la personne juste.
theological_decisions:
- issue: Personnification de la sagesse
  choice: « la sagesse » agit comme un agent personnifié, sans majuscule
  alternative: « la Sagesse » comme titre quasi propre
  rationale: Le grec personnifie σοφία, mais n’impose pas à lui seul d’en faire un nom propre ni de préciser davantage son statut théologique.
- issue: Référents de « lui » et de « le juste »
  choice: « lui » renvoie vraisemblablement à l’homme injuste du verset précédent; « le juste » désigne Noé
  alternative: Comprendre δι’ ὃν au sens instrumental, « par son intermédiaire », sans fixer aussi nettement son référent
  rationale: La lecture causale correspond à la construction avec l’accusatif et au contraste du contexte immédiat, tout en laissant l’autre possibilité signalée en note.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Pilotant » maintient volontairement l’image nautique du grec; « simple morceau de bois » rend la modestie du moyen sans la connotation moderne négative de « bois bon marché ».
