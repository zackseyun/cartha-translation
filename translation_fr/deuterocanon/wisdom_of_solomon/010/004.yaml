    issue: « simple morceau de bois » ne restitue pas pleinement εὐτελοῦς.
    rationale: « Simple » peut seulement indiquer l’absence de complexité; εὐτελής désigne ce qui est de peu de valeur, modeste ou insignifiant. Une formulation comme « une modeste pièce de bois » conserve mieux cette nuance.
  - severity: low
    issue: « en pilotant le juste » est légèrement heurté en français.
    rationale: Le participe κυβερνήσασα est effectivement nautique, mais en français « piloter » appelle habituellement un véhicule ou une embarcation comme complément. « En guidant le juste » est plus naturel tout en conservant l'idée de conduite à travers le danger; la note peut signaler l'image nautique.
