  verdict: revise
  source_fidelity: Le texte rend correctement la relation causale de δι’ ὃν, l’action en cours de κατακλυζομένην, la personnification de σοφία et la valeur nautique de κυβερνήσασα. Toutefois, « la terre la sauva de nouveau » laisse un antécédent potentiellement maladroit et, surtout, « simple morceau de bois » affaiblit εὐτελοῦς (« de peu de valeur », humble/insignifiant).
  naturalness: La phrase est globalement naturelle en français moderne. « En pilotant le juste » est toutefois moins idiomatique que « en guidant le juste », car on pilote normalement une embarcation; le grec emploie bien l’image nautique, mais son objet direct est ici l’homme juste.
  terminology: « La sagesse », « le juste » et « déluge » sont justes et de registre approprié. « Une pièce de bois modeste » rend plus précisément la nuance dépréciative de εὐτελής sans suggérer une mauvaise qualité de fabrication.
