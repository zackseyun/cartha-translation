  text: But he flooded their enemies[a], and from the depth of the abyss he cast them up.
translation:
  language: fr
  text: Mais elle submergea leurs ennemis et les fit remonter du fond de l’abîme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les fit jaillir des profondeurs de l’abîme ». Le verbe grec peut évoquer quelque chose que l’on fait monter, jaillir ou bouillonner.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέκλυσεν
  choice: submergea
  rationale: Le verbe exprime l’action de recouvrir ou d’engloutir sous les eaux. « Submergea » conserve l’image aquatique sans ajouter explicitement que les ennemis moururent.
- source_word: ἐχθροὺς
  choice: ennemis
  rationale: Équivalent français direct, courant et naturel du nom grec au pluriel.
- source_word: ἐκ βάθους ἀβύσσου
  choice: du fond de l’abîme
  rationale: Cette formulation rend naturellement en français le singulier βάθους et l’image des profondeurs insondables, tout en gardant un registre digne.
- source_word: ἀνέβρασεν
  choice: fit remonter
  rationale: Le causatif rend l’idée de faire jaillir ou monter depuis les profondeurs. « Fit remonter » préserve le mouvement ascendant sans préciser davantage ce qui advient aux ennemis.
- source_word: αὐτούς
  choice: les
  rationale: Le pronom reprend clairement « leurs ennemis » en français.
theological_decisions:
- issue: Image du jugement dans la mer
  choice: Conserver les deux actions concrètes — submerger et faire remonter — sans ajouter « noya » ni « cadavres ».
  alternative: « noya leurs ennemis et rejeta leurs corps des profondeurs »
  rationale: Le contexte évoque le jugement de l’Exode, mais le grec ne nomme explicitement ni la mort ni les corps. La traduction conserve donc la force et la tension de l’image sans l’expliciter doctrinalement.
- issue: Référent du sujet implicite
  choice: Employer « elle » pour reprendre la Sagesse, sujet du passage.
  alternative: Employer « il », comme dans la couche anglaise de consultation.
  rationale: Dans le contexte grec de Sagesse 10, le sujet implicite renvoie à σοφία, nom féminin. Le français reprend naturellement ce référent par « elle ».
translation_notes:
  register: Français international moderne, clair et digne. « Submergea » maintient l’imagerie des eaux; « du fond de l’abîme » est idiomatique sans banaliser le registre poétique. Le marqueur de note suit la proposition qu’il éclaire.
