  text: whose wickedness still has as its witness a smoking wasteland[a], plants bearing fruit that never ripens[b], and a pillar of salt standing as a memorial of an unbelieving soul.
translation:
  language: fr
  text: De sa méchanceté témoignent encore une terre dévastée qui fume, des plantes portant des fruits qui n’arrivent pas à maturité, et une colonne de sel[a] qui se dresse, mémorial d’une âme incrédule[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La colonne de sel fait allusion à la femme de Loth en Genèse 19.26, sans toutefois la nommer explicitement.
    reason: cross_reference
  - marker: b
    text: Ou « infidèle ». Le grec peut désigner le manque de foi ou le manque de fidélité.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἧς … τῆς πονηρίας
  choice: de sa méchanceté
  rationale: Le relatif féminin renvoie à la réalité évoquée dans le contexte précédent. La tournure française « De sa méchanceté témoignent… » conserve le lien génitif et le jugement moral exprimé par πονηρία.
- source_word: μαρτύριον … καθέστηκε
  choice: témoignent encore
  rationale: 'Le parfait a une valeur d’état durable : les éléments énumérés subsistent comme témoignage. La formulation verbale est naturelle en français et maintient la force testimoniale de μαρτύριον.'
- source_word: καπνιζομένη χέρσος
  choice: une terre dévastée qui fume
  rationale: χέρσος désigne ici une terre devenue stérile ou inculte, tandis que le participe présent καπνιζομένη la montre encore en train de fumer. « Dévastée » rend le contexte de jugement sans la confondre avec un désert naturel.
- source_word: ἀτελέστιοι ὥρας καρποφοροῦντα φυτά
  choice: des plantes dont les fruits ne parviennent jamais à maturité
  rationale: L’expression décrit une fructification qui n’atteint pas son accomplissement ou sa maturité. Cette formulation française restitue clairement l’image agricole sans ajouter l’idée non explicite d’une saison déterminée.
- source_word: ἑστηκυῖα στήλη ἁλός
  choice: une colonne de sel qui se dresse
  rationale: Le participe parfait souligne l’état persistant de la colonne. « Qui se dresse » conserve à la fois son aspect visible et sa permanence.
- source_word: μνημεῖον
  choice: mémorial
  rationale: Dans ce contexte, le terme désigne un signe durable qui garde le souvenir de la personne et de son sort, plutôt qu’un tombeau.
- source_word: ἀπιστούσης ψυχῆς
  choice: d’une âme incrédule
  rationale: La traduction reste proche du grec et conserve ψυχή. ἀπιστέω peut exprimer le refus de croire ou le manque de fidélité; l’autre possibilité est signalée en note.
theological_decisions:
- issue: Identité de la colonne de sel et de l’âme incrédule
  choice: Maintenir la description sans nommer la personne dans le corps du texte.
  alternative: Identifier explicitement la femme de Loth dans le texte principal.
  rationale: L’allusion à Genèse 19.26 est claire, mais le grec ne nomme pas la femme de Loth. La note donne le repère intertextuel sans rendre l’explicite plus affirmatif que la source.
- issue: Sens de ἀπιστούσης
  choice: « incrédule », avec « infidèle » en note comme autre traduction possible.
  alternative: Traduire uniquement par « infidèle ».
  rationale: Le mot peut relever du manque de foi ou du manque de fidélité. La traduction et la note préservent cette amplitude sémantique sans trancher une tension réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe place en tête le motif du témoignage afin de garder le lien avec le contexte précédent; l’énumération conserve les trois signes durables de la méchanceté.
