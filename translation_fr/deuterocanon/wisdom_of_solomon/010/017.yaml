  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/017.yaml
  text: He gave the holy ones the reward of their labors[a], guided them in a marvelous way[c][b], and became for them a shelter by day and a flame of stars by night.
translation:
  language: fr
  text: Elle a donné aux saints la récompense de leurs peines, elle les a guidés sur un chemin merveilleux et elle est devenue pour eux un abri le jour et une flamme d’étoiles la nuit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’image évoque la protection et la conduite de Dieu lors de l’Exode, notamment la nuée le jour et le feu la nuit. Toutefois, le grec formule ici cette allusion sans reprendre entièrement l’expression traditionnelle ; « une flamme d’étoiles » traduit littéralement son image condensée.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπέδωκεν
  choice: a donné
  rationale: Le verbe peut signifier rendre, accorder ou rétribuer. Avec μισθὸν κόπων, « a donné » exprime naturellement l’octroi de la récompense sans accentuer indûment une transaction commerciale.
- source_word: ὁσίοις
  choice: aux saints
  rationale: ὅσιος désigne ceux qui sont pieux, consacrés à Dieu. « Les saints » conserve la force adjectivale substantivée et le registre biblique, sans introduire une catégorie technique ultérieure.
- source_word: μισθὸν κόπων αὐτῶν
  choice: la récompense de leurs peines
  rationale: μισθός désigne ici une récompense ou rétribution, tandis que κόπος évoque un effort pénible. « Leurs peines » rend cette fatigue laborieuse dans un français naturel et digne.
- source_word: ὡδήγησεν αὐτοὺς ἐν ὁδῷ θαυμαστῇ
  choice: elle les a guidés sur un chemin merveilleux
  rationale: Le verbe exprime une conduite dirigée, et ὁδός désigne concrètement un chemin. « Sur un chemin merveilleux » est naturel en français et garde le caractère extraordinaire de l’itinéraire.
- source_word: σκέπην ἡμέρας
  choice: un abri pendant le jour
  rationale: σκέπη évoque une couverture protectrice ou un refuge. « Abri » communique clairement cette protection, et le génitif ἡμέρας reçoit ici une valeur temporelle.
- source_word: φλόγα ἄστρων τὴν νύκτα
  choice: une flamme d’étoiles pendant la nuit
  rationale: Cette formulation conserve l’image grecque condensée, littéralement une « flamme d’étoiles », sans la remplacer par la formule plus explicite de la colonne de feu.
theological_decisions:
- issue: Identité du sujet sous-entendu dans la suite verbale
  choice: Employer « elle », avec la Sagesse comme antécédent contextuel
  alternative: Répéter explicitement « la Sagesse »
  rationale: Le grec ne répète pas Σοφία dans ce verset, mais le contexte immédiat en fait le sujet. Le pronom féminin français maintient l’anaphore et la personnification sans ajouter un nom absent du verset.
- issue: Allusion aux traditions de l’Exode sur la nuée et le feu
  choice: Traduire directement les images d’abri diurne et de flamme nocturne
  alternative: Développer en « colonne de nuée le jour et colonne de feu la nuit »
  rationale: L’allusion à l’Exode est nette, mais le grec emploie ici une formulation propre et plus allusive. L’expansion traditionnelle ajouterait des éléments qui ne figurent pas dans le texte.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. La répétition de « elle » suit la série verbale grecque et rend explicite le genre grammatical de la Sagesse en français. La tournure poétique « flamme d’étoiles » est conservée afin de respecter l’ambiguïté et la densité de l’original.
