  source_fidelity: Le sujet féminin implicite est correctement rendu par « Elle », en continuité avec la Sagesse personnifiée du contexte. « fit traverser » rend bien διεβίβασεν, « la mer Rouge » est la désignation française établie de θάλασσαν ἐρυθράν, et « conduisit » restitue adéquatement διήγαγεν. En revanche, « des eaux immenses » transforme le singulier massique ὕδατος πολλοῦ en pluriel et intensifie légèrement l’expression. « beaucoup d’eau » conserve plus exactement la formulation grecque sans perdre la clarté française.
