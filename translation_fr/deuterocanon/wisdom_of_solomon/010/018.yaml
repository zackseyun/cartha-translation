  text: Elle leur fit traverser la mer Rouge et les conduisit à travers beaucoup d’eau;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διεβίβασεν
  choice: fit traverser
  rationale: Le verbe exprime l’action de faire passer d’un côté à l’autre. « Fit traverser » rend naturellement sa valeur causative en français.
- source_word: θάλασσαν ἐρυθράν
  choice: la mer Rouge
  rationale: Cette désignation traditionnelle et géographique rend directement l’allusion au récit de l’Exode.
- source_word: διήγαγεν
  choice: conduisit à travers
  rationale: Le verbe signifie mener ou faire passer à travers. « Conduisit » conserve l’idée d’un passage guidé et le distingue du verbe précédent.
- source_word: διʼ ὕδατος πολλοῦ
  choice: à travers des eaux immenses
  rationale: Le grec dit littéralement « à travers beaucoup d’eau ». Le pluriel collectif « des eaux immenses » est idiomatique et digne en français, tout en exprimant la vaste masse d’eau évoquée.
theological_decisions:
- issue: Référent féminin implicite du sujet verbal
  choice: Elle
  alternative: La Sagesse
  rationale: Dans le contexte du chapitre, les verbes ont pour sujet la Sagesse personnifiée. Le pronom maintient la continuité du discours sans ajouter le nom absent de ce verset.
- issue: Allusion à l’Exode et nom de la mer
  choice: la mer Rouge
  alternative: la mer rouge
  rationale: La majuscule signale le nom géographique conventionnel et rend clairement l’allusion à la traversée lors de l’Exode, sans développer l’interprétation.
