base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/015.yaml
  text: She rescued a holy people and a blameless offspring from a nation of oppressors[a].
translation:
  language: fr
  text: Elle a délivré un peuple saint et une descendance irréprochable d’une nation d’oppresseurs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une nation qui les opprimait » ou « d’une nation oppressive ». Le participe grec peut désigner les oppresseurs ou qualifier la nation par leur action.
    reason: alternative lexicale et syntaxique
lexical_decisions:
- source_word: αὕτη
  choice: Elle
  rationale: Le démonstratif féminin renvoie à la Sagesse personnifiée dans le contexte. « Elle » conserve cette personnification sans expliciter le nom absent du grec.
- source_word: λαὸν
  choice: peuple
  rationale: « Peuple » rend naturellement le collectif et préserve la distinction avec ἔθνος, traduit par « nation ».
- source_word: ὅσιον
  choice: saint
  rationale: Dans ce contexte, ὅσιος caractérise le peuple dans sa relation à Dieu. « Saint » conserve la portée religieuse et communautaire du terme.
- source_word: σπέρμα
  choice: descendance
  rationale: « Descendance » exprime en français courant le sens collectif de σπέρμα sans recourir au littéralisme « semence ».
- source_word: ἄμεμπτον
  choice: irréprochable
  rationale: Le terme désigne ce qui ne donne prise à aucun blâme. « Irréprochable » en préserve clairement la nuance morale.
- source_word: ἐρρύσατο
  choice: a délivré
  rationale: Le verbe exprime l’action d’arracher à un danger ou à une oppression. « Délivrer » convient au registre biblique tout en restant compréhensible en français moderne.
- source_word: ἐξ
  choice: de
  rationale: La préposition marque ici l’éloignement hors d’une puissance oppressive; « délivrer de » est la tournure française naturelle.
- source_word: ἔθνους
  choice: nation
  rationale: « Nation » rend directement ἔθνος et maintient la différence lexicale avec λαός, « peuple ».
- source_word: θλιβόντων
  choice: d’oppresseurs
  rationale: Le participe au génitif pluriel peut être substantivé et désigner ceux qui oppriment. « Une nation d’oppresseurs » rend clairement cette construction tout en signalant en note l’autre analyse possible.
theological_decisions:
- issue: Référent du féminin αὕτη
  choice: Le pronom renvoie à la Sagesse personnifiée et est rendu par « Elle ».
  alternative: Expliciter « La Sagesse » ou traduire littéralement « Celle-ci ».
  rationale: Le contexte identifie déjà l’actrice comme la Sagesse. Le pronom maintient l’enchaînement littéraire et la personnification féminine sans ajouter un nom au texte.
- issue: Qualification du peuple et de sa descendance
  choice: Conserver sans atténuation « saint » et « irréprochable ».
  alternative: Employer « pieux » et « sans reproche ».
  rationale: Ces adjectifs portent la caractérisation religieuse et morale du peuple dans la rhétorique du passage; la traduction n’en réduit ni n’en développe la portée.
- issue: Analyse de θλιβόντων
  choice: 'Le participe est substantivé : « une nation d’oppresseurs ».'
  alternative: 'Le comprendre comme une qualification de la nation : « une nation qui les opprimait » ou « une nation oppressive ».'
  rationale: Le génitif pluriel soutient naturellement la lecture substantive, mais l’expression peut aussi caractériser collectivement la nation. L’ambiguïté est conservée au moyen d’une note.
translation_notes:
  register: Français international moderne, sobre et digne. « A délivré » conserve une tonalité biblique accessible; « descendance irréprochable » rend le collectif singulier avec naturel. Le marqueur [a] figure dans le texte principal.
