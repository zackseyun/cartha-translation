base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/008.yaml
  text: For by passing wisdom by[a], they were harmed not only by not knowing what is good, but they also left behind for life a memorial of their folly, so that in the things in which they went astray they might not even be able to escape notice.
translation:
  language: fr
  text: 'Car, pour avoir passé leur chemin sans se soucier de la Sagesse, ils ont subi un dommage : non seulement ils n’ont pas connu ce qui est bon, mais ils ont aussi laissé pour la vie humaine[a] un mémorial de leur folie, afin que, dans ce en quoi ils se sont égarés, ils ne puissent même pas passer inaperçus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le monde des vivants » ; le grec βίος peut désigner largement la vie parmi les vivants, et non seulement la vie d’un individu.
    reason: lexical_alternative
lexical_decisions:
- source_word: παροδεύσαντες
  choice: pour avoir passé leur chemin sans se soucier de
  rationale: Le participe évoque littéralement le fait de passer à côté. Cette formulation française garde l’image du chemin tout en exprimant clairement la négligence impliquée par le contexte.
- source_word: ἐβλάβησαν
  choice: ils ont subi un préjudice
  rationale: Le passif indique qu’un dommage leur est arrivé. « Subir un préjudice » conserve la portée large du grec, morale et pratique.
- source_word: τοῦ μὴ γνῶναι τὰ καλά
  choice: ils n’ont pas connu ce qui est bon
  rationale: La tournure exprime le domaine dans lequel ils ont subi un dommage. « Ce qui est bon » rend la portée éthique de τὰ καλά sans exclure les nuances de noblesse et de droiture.
- source_word: τῆς ἀφροσύνης
  choice: de leur folie
  rationale: ἀφροσύνη désigne le manque de discernement ou la folie morale. Le possessif français rattache naturellement cette folie à leur conduite.
- source_word: ἀπέλιπον
  choice: ils ont laissé
  rationale: Le verbe signifie laisser derrière soi. Avec « dans le monde des vivants », « ont laissé » exprime naturellement la persistance de ce témoignage.
- source_word: τῷ βίῳ
  choice: dans le monde des vivants
  rationale: Le datif peut viser la vie humaine ou le monde des vivants. Cette formulation est plus naturelle que le calque « à la vie » et rend la dimension publique et durable du monument, tout en signalant l’ambiguïté en note.
- source_word: μνημόσυνον
  choice: un monument
  rationale: Le terme désigne ce qui perpétue le souvenir. « Monument » souligne ici une trace durable et publiquement reconnaissable, sans suggérer nécessairement une construction matérielle.
- source_word: ἔσφαλησαν
  choice: les fautes qu’ils ont commises
  rationale: Le verbe peut signifier trébucher, se tromper ou faillir. La formulation choisie restitue la faute effective sans réduire le sens à une simple erreur intellectuelle.
- source_word: μηδὲ λαθεῖν δυνηθῶσιν
  choice: ils ne peuvent même pas passer inaperçus
  rationale: λανθάνω signifie ici échapper à l’attention. La tournure française est claire et conserve l’idée que leur folie rend leurs fautes impossibles à dissimuler.
theological_decisions:
- issue: Portée morale de τὰ καλά
  choice: ce qui est bon
  alternative: ce qui est noble
  rationale: Le contexte donne probablement à l’expression une valeur morale. « Ce qui est bon » préserve cette portée sans imposer une lecture philosophique plus étroite.
- issue: Force de la proposition finale introduite par ἵνα
  choice: si bien que
  alternative: afin que
  rationale: La proposition peut formellement exprimer un but, mais elle décrit vraisemblablement ici le résultat de la trace durable laissée par leur folie. « Si bien que » rend ce rapport sans attribuer explicitement ce dessein à Dieu ou à un autre agent non nommé.
translation_notes:
  register: Français international moderne, digne et accessible. L’image de passer son chemin est conservée, mais explicitée pour éviter l’obscurité. La phrase maintient la tension entre faute morale, préjudice subi et exposition publique durable.
