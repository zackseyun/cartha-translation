    text: Ou « dans le monde des vivants » ; le grec βίος peut désigner largement la vie parmi les vivants, et non seulement la vie d’un individu.
    reason: lexical_alternative
  revision_rationale: La révision préserve les choix sémantiques solides du projet tout en rétablissant la forme finale de ἵνα avec le subjonctif français. Elle élargit également « les fautes qu’ils ont commises » à « ce en quoi ils se sont égarés », plus proche du grec et moins interprétatif. Les ajustements de « préjudice » et « monument » améliorent le registre sans modifier le sens.
