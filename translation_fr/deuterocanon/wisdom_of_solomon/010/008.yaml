revisions:
- from: 'Car, pour avoir passé leur chemin sans se soucier de la Sagesse, ils ont subi un préjudice : non seulement ils n’ont pas connu ce qui est bon, mais ils ont aussi laissé dans le monde des vivants[a] un monument de leur folie, si bien que, dans les fautes qu’ils ont commises, ils ne peuvent même pas passer inaperçus.'
  to: 'Car, pour avoir passé leur chemin sans se soucier de la Sagesse, ils ont subi un dommage : non seulement ils n’ont pas connu ce qui est bon, mais ils ont aussi laissé pour la vie humaine[a] un mémorial de leur folie, afin que, dans ce en quoi ils se sont égarés, ils ne puissent même pas passer inaperçus.'
  rationale: La révision préserve les choix sémantiques solides du projet tout en rétablissant la forme finale de ἵνα avec le subjonctif français. Elle élargit également « les fautes qu’ils ont commises » à « ce en quoi ils se sont égarés », plus proche du grec et moins interprétatif. Les ajustements de « préjudice » et « monument » améliorent le registre sans modifier le sens.
  reviewer_model: gpt-5.6-terra
