  text: She did not abandon the righteous man when he was sold, but rescued him from sin;
translation:
  language: fr
  text: Elle n’a pas abandonné le juste quand il a été vendu, mais elle l’a arraché au péché ;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὕτη
  choice: Elle
  rationale: Le pronom féminin renvoie à la Sagesse, sujet personnifié du passage ; le pronom préserve la continuité du contexte.
- source_word: πραθέντα
  choice: quand il a été vendu
  rationale: Le participe aoriste passif de πιπράσκω décrit le juste vendu, allusion à Joseph, sans ajouter explicitement ses vendeurs.
- source_word: δίκαιον
  choice: le juste
  rationale: Rend substantivement l’adjectif et conserve sa portée morale et théologique.
- source_word: οὐκ ἐγκατέλιπεν
  choice: n’a pas abandonné
  rationale: Équivalent naturel et précis d’ἐγκαταλείπω dans ce contexte.
- source_word: ἐξ ἁμαρτίας
  choice: au péché
  rationale: Avec « arracher », la préposition française « à » exprime naturellement la délivrance hors du pouvoir ou du danger du péché, tout en conservant le singulier grec.
- source_word: ἐρρύσατο
  choice: a arraché
  rationale: ῥύομαι exprime une délivrance énergique hors d’un danger ; « arracher à » est idiomatique, vif et fidèle.
theological_decisions:
- issue: Nature de la délivrance « hors du péché »
  choice: elle l’a arraché au péché
  alternative: elle l’a préservé du péché
  rationale: Le grec ἐρρύσατο ἐξ indique une délivrance, mais ne précise pas si Joseph est tiré d’un péché déjà commis ou soustrait à sa puissance ou à sa tentation. La formulation retenue préserve cette tension au lieu de la résoudre.
translation_notes:
  register: Français moderne, clair et digne. La personnification féminine de la Sagesse et la concision du grec sont conservées ; l’allusion à Joseph reste implicite comme dans la source.
