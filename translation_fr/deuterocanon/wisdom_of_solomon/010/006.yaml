base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/006.yaml
  text: She rescued a righteous man when the ungodly were perishing[b][a], as he fled the fire descending on the Five Cities.
translation:
  language: fr
  text: Elle sauva un homme juste, alors que les impies périssaient et qu’il fuyait le feu qui descendait[b] sur les Cinq Villes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit de l’ensemble de cinq villes associé à Sodome ; le verset fait allusion à la fuite de Lot.
    reason: cross_reference
  - marker: b
    text: Ou « le feu descendant ». Le grec décrit un feu qui descend sur les Cinq Villes, sans dire explicitement qu’il vient du ciel.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: Elle
  rationale: Le démonstratif féminin reprend la Sagesse personnifiée dans le contexte immédiat. « Elle » maintient cette personnification sans répéter inutilement « la Sagesse ».
- source_word: δίκαιον
  choice: un homme juste
  rationale: L’accusatif masculin singulier désigne celui qui est délivré, sans le nommer. L’absence d’article et le contexte permettent « un homme juste », formulation naturelle qui préserve l’allusion implicite à Lot.
- source_word: ἐξαπολλυμένων ἀσεβῶν
  choice: alors que les impies périssaient
  rationale: Le participe présent exprime une destruction en cours. « Périssaient » en conserve l’aspect sans préciser une action ou un agent que la proposition grecque ne nomme pas; « impies » garde la portée religieuse et morale de ἀσεβῶν.
- source_word: ἐρρύσατο
  choice: sauva
  rationale: Le verbe signifie tirer quelqu’un d’un danger. « Sauva » est courant, digne et adapté au récit, sans ajouter de nuance technique.
- source_word: φυγόντα
  choice: tandis qu’il fuyait
  rationale: Cette tournure relie naturellement le participe aoriste à l’homme juste et présente sa fuite dans le cadre de sa délivrance.
- source_word: πῦρ καταβάσιον
  choice: le feu qui descendait
  rationale: καταβάσιον décrit ce qui descend. La traduction conserve ce mouvement sans ajouter explicitement « du ciel », origine probable dans le récit mais non formulée ici.
- source_word: Πενταπόλεως
  choice: sur les Cinq Villes
  rationale: Le génitif renvoie à la Pentapole, l’ensemble de cinq villes associé à Sodome. « Les Cinq Villes » est transparent en français moderne; la préposition « sur » explicite naturellement le rapport contextuel entre le feu descendant et les villes.
theological_decisions:
- issue: Référent du sujet féminin αὕτη
  choice: Le sujet est la Sagesse personnifiée, reprise par « Elle ».
  alternative: « Celle-ci » ou « Cette Sagesse »
  rationale: Le chapitre attribue successivement des actes de salut à la Sagesse personnifiée. « Elle » respecte cette continuité littéraire sans lui imposer une identification doctrinale ultérieure.
- issue: Identification de l’homme juste et des Cinq Villes
  choice: Conserver l’allusion implicite dans le texte et identifier Lot et le groupe de villes associé à Sodome en note.
  alternative: Nommer explicitement Lot et Sodome dans le corps du verset.
  rationale: Le grec ne donne ni le nom de Lot ni celui de Sodome. La formulation retenue traduit ce qui est affirmé tout en permettant à la note d’éclairer l’allusion narrative.
- issue: Origine du feu descendant
  choice: Dire que le feu descendait, sans préciser qu’il venait du ciel.
  alternative: « le feu qui descendait du ciel »
  rationale: Le récit évoqué permet de comprendre une provenance céleste, mais πῦρ καταβάσιον exprime ici la descente sans en nommer explicitement le point d’origine.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la personnification féminine de la Sagesse, l’allusion non explicitée à Lot et la description sobre du feu descendant. « Impies » maintient la dimension religieuse de ἀσεβῶν, tandis que « Cinq Villes » rend Pentapolis intelligible sans translittération savante.
