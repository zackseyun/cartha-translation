  text: But an unrighteous man, having departed from her, perished in his brother-murdering rage.
translation:
  language: fr
  text: Mais l’injuste, s’étant éloigné d’elle dans sa colère, périt par ses fureurs fratricides.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄδικος
  choice: un homme injuste
  rationale: Le substantif adjectival masculin désigne ici une personne injuste; «un homme injuste» est clair et naturel en français.
- source_word: ἀποστὰς ἀπ’ αὐτῆς
  choice: s’éloigna d’elle
  rationale: Rend le mouvement de séparation exprimé par ἀφίστημι sans expliciter l’identité du référent féminin, donnée par le contexte.
- source_word: ἐν ὀργῇ αὐτοῦ
  choice: dans sa colère
  rationale: Conserve le lien syntaxique le plus immédiat avec l’éloignement ainsi que la nuance forte de ὀργή.
- source_word: ἀδελφοκτόνοις … θυμοῖς
  choice: sous l’effet de fureurs fratricides
  rationale: Préserve le pluriel grec θυμοῖς et la notion de meurtre d’un frère portée par ἀδελφοκτόνοις, tout en restant intelligible en français.
- source_word: συναπώλετο
  choice: périt
  rationale: Le verbe exprime la perte ou la destruction; dans ce contexte, le préfixe συν- ne permet pas d’identifier clairement une autre personne avec laquelle il aurait péri, de sorte que «périt» évite une précision non fondée.
theological_decisions:
- issue: Référent du pronom féminin αὐτῆς
  choice: Maintenir «elle»
  alternative: Expliciter «la Sagesse»
  rationale: Le grec emploie un pronom dont le référent se déduit du contexte; le conserver respecte la cohésion et n’ajoute pas une explicitation absente du verset.
- issue: Allusion à Caïn
  choice: Ne pas nommer Caïn
  alternative: Traduire «Caïn, cet homme injuste»
  rationale: L’allusion est forte, mais le texte grec ne donne pas son nom; la traduction conserve donc la formulation indirecte.
translation_notes:
  register: Français moderne, digne et accessible. La phrase conserve l’allusion narrative implicite, le féminin «elle» et le pluriel expressif «fureurs fratricides» sans surcharge explicative.
