base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/014.yaml
  text: She went down with him into the pit[a], and in chains she did not abandon him, until she brought him the scepter of a kingdom and authority over those who had ruled him; she showed those who had slandered him to be false[b], and gave him everlasting glory.
translation:
  language: fr
  text: Elle descendit avec lui dans la fosse[a] ; elle ne l’abandonna pas dans les fers, jusqu’au jour où elle lui apporta les sceptres de la royauté et l’autorité sur ceux qui l’avaient dominé. Elle montra que ceux qui l’avaient accusé étaient dans le faux[b], et lui donna une gloire éternelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le cachot » ; le grec dit littéralement « dans la fosse », terme qui peut désigner une citerne ou une fosse servant de prison.
    reason: lexical_alternative
  - marker: b
    text: Ou « elle prouva la fausseté des accusations portées contre lui ».
    reason: alternative_reading
lexical_decisions:
- source_word: συγκατέβη
  choice: descendit avec
  rationale: Le composé avec σύν exprime une descente accomplie en compagnie de quelqu’un. « Descendit avec » restitue clairement ce mouvement et la présence fidèle de la Sagesse.
- source_word: εἰς λάκκον
  choice: dans la fosse
  rationale: λάκκος désigne littéralement une fosse et peut, dans ce contexte, évoquer une citerne servant de cachot. Le terme concret « fosse » préserve l’image grecque.
- source_word: ἐν δεσμοῖς
  choice: dans les chaînes
  rationale: δεσμοί désigne des liens ou des entraves. « Dans les chaînes » est compréhensible en français moderne et conserve la formulation imagée du grec.
- source_word: οὐκ ἀφῆκεν αὐτόν
  choice: elle ne l’abandonna pas
  rationale: Dans ce contexte, ἀφίημι signifie laisser derrière soi ou abandonner. Ce choix fait ressortir la présence constante de la Sagesse.
- source_word: ἕως ἤνεγκεν αὐτῷ
  choice: jusqu’à ce qu’elle lui apporte
  rationale: φέρω avec le datif peut exprimer l’action d’apporter ou de conférer. « Lui apporte » garde la force concrète du verbe sans exclure l’idée d’un don de dignité.
- source_word: σκῆπτρα βασιλείας
  choice: les sceptres de la royauté
  rationale: Le grec emploie le pluriel σκῆπτρα avec le singulier βασιλείας. Le français conserve ici ce pluriel réel et rend βασιλεία par « royauté », qui désigne la dignité ou le pouvoir royal sans introduire un royaume déterminé.
- source_word: ἐξουσίαν τυραννούντων αὐτοῦ
  choice: l’autorité sur ceux qui l’avaient dominé
  rationale: τυραννέω peut signifier exercer une domination, gouverner en tyran ou opprimer. « Dominé » rend le renversement de pouvoir tout en évitant le français peu naturel « tyrannisé » et sans réduire le sens à la seule oppression.
- source_word: ψευδεῖς ... ἔδειξεν
  choice: montra ... étaient dans le faux
  rationale: La construction signifie démontrer que des personnes sont fausses ou se trompent. « Étaient dans le faux » est naturel et porte sur la fausseté de leur accusation sans les qualifier nécessairement de menteurs.
- source_word: τοὺς μωμησαμένους αὐτόν
  choice: ceux qui l’avaient accusé
  rationale: μωμάομαι signifie blâmer, censurer ou trouver à redire. « Accusé » convient au contexte de Joseph sans imposer l’idée plus précise de diffamation contenue dans « calomnié ».
- source_word: δόξαν αἰώνιον
  choice: une gloire éternelle
  rationale: « Gloire éternelle » est une expression française digne et courante qui rend directement δόξαν αἰώνιον.
theological_decisions:
- issue: Identification du sujet féminin dans tout le verset
  choice: Employer le pronom « elle », qui renvoie à la Sagesse personnifiée dans le contexte immédiat.
  alternative: Répéter explicitement « la Sagesse » au début du verset.
  rationale: Le grec poursuit avec un sujet féminin implicite déjà identifié par le contexte. Le pronom préserve la continuité littéraire et la personnification sans explicitation superflue.
- issue: Portée de la domination exercée sur Joseph
  choice: Traduire τυραννούντων par « ceux qui l’avaient dominé ».
  alternative: « ses oppresseurs » ou « ceux qui l’avaient tyrannisé ».
  rationale: Le choix conserve à la fois la relation antérieure de pouvoir et son renversement, sans durcir ni atténuer doctrinalement le portrait du récit.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le mouvement du grec et la personnification féminine de la Sagesse. Le pluriel « les sceptres » est maintenu afin de respecter la forme source, tandis que les notes signalent les principales possibilités lexicales sans résoudre abusivement l’ambiguïté.
