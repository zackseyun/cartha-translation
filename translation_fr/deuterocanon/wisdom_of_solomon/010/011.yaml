  text: When others overpowered him in greed[a], she stood by him and made him rich.
translation:
  language: fr
  text: Quand d'autres l'emportaient sur lui par avidité[a], elle s'est tenue près de lui et l'a enrichi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quand ceux qui agissaient avec avidité prévalaient contre lui. » Le participe grec peut aussi se rendre plus formellement par « prévalaient contre lui »; la tournure peut indiquer le cadre ou la manière de leur action.'
    reason: Alternative lexicale et syntaxique
lexical_decisions:
- source_word: ἐν πλεονεξίᾳ
  choice: avides
  rationale: Le nom πλεονεξία désigne l’avidité ou la convoitise. La tournure adjectivale « des gens avides » exprime naturellement en français la disposition dans laquelle agissent les adversaires, sans préciser à tort si ἐν est instrumental ou circonstanciel.
- source_word: κατισχυόντων αὐτόν
  choice: l’ont emporté sur lui
  rationale: Κατισχύω exprime le fait de prévaloir contre quelqu’un ou de prendre le dessus. « L’ont emporté sur lui » reste proche du grec tout en étant idiomatique.
- source_word: παρέστη
  choice: s’est tenue à ses côtés
  rationale: Le verbe παρίστημι évoque ici une présence proche et secourable. Cette formulation conserve l’image de se tenir auprès de quelqu’un sans réduire le sens à une intervention explicitement décrite.
- source_word: ἐπλούτισεν αὐτόν
  choice: l’a enrichi
  rationale: Πλουτίζω signifie rendre riche ou enrichir. « L’a enrichi » est concis, naturel et conserve le sens concret de prospérité accordée.
theological_decisions:
- issue: Sujet implicite de παρέστη et ἐπλούτισεν
  choice: « elle », renvoyant à la Sagesse personnifiée
  alternative: Ne pas expliciter le sujet, comme en grec
  rationale: Le grec laisse le sujet sous-entendu, mais le fil du chapitre présente la Sagesse comme l’actrice personnifiée. Le français exige ici un sujet exprimé ; « elle » restitue cette continuité sans ajout doctrinal.
- issue: Nature de l’hostilité exprimée par ἐν πλεονεξίᾳ κατισχυόντων
  choice: Des gens avides prennent le dessus sur lui
  alternative: Ils agissent par avidité en prévalant contre lui
  rationale: La construction grecque permet une nuance circonstancielle ou instrumentale. Le texte principal demeure naturel, tandis que la note conserve une traduction plus formelle et l’ambiguïté du rapport syntaxique.
translation_notes:
  register: Français international moderne, digne et accessible. « L’ont emporté sur lui » évite le tour plus lourd « ont prévalu contre lui » dans le texte principal ; la note en conserve la valeur formelle. Le féminin « elle » maintient la personnification de la Sagesse donnée par le contexte.
