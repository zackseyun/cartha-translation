  source_fidelity: Le grec ἐν πλεονεξίᾳ κατισχυόντων αὐτόν décrit ceux qui dominaient Jacob « dans/par avidité ». « Des gens avides » est possible, mais atténue le lien circonstanciel ou modal de ἐν πλεονεξίᾳ avec le fait de l'emporter. « L'ont emporté sur lui » traduit correctement κατισχυόντων αὐτόν. Les deux aoristes, avec la Sagesse pour sujet contextuel, sont bien rendus.
  naturalness: Le texte est globalement naturel et de registre approprié. Toutefois, « s'est tenue à ses côtés » est légèrement lourd et moins idiomatique que « s'est tenue près de lui »; cette dernière expression conserve l'image de παρέστη et sa nuance de soutien.
  terminology: « avidité », « l'emporter sur », « enrichir » et le pronom féminin pour la Sagesse sont justes. Employer le substantif « avidité » dans la proposition initiale reflète plus directement πλεονεξία que l'adjectif « avides », tout en préservant l'ambiguïté entre cadre et manière.
