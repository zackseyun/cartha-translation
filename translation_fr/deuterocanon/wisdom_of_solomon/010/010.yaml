  to: Elle guida sur des sentiers droits le juste qui fuyait la colère de son frère ; elle lui montra le royaume de Dieu et lui donna la connaissance des choses saintes[a] ; elle le fit réussir dans ses travaux et multiplia ses travaux[b].
  rationale: La révision rapproche le texte principal de τοὺς πόνους (« travaux », « peines ») sans forcer l’expression à signifier « fruits », notion absente du grec. La note conserve l’effet positif que suggère le contexte sans le présenter comme le sens lexical direct. « Choses saintes » est un français plus courant et demeure volontairement indéterminé; l’autre lecture grammaticalement possible est maintenue en note.
