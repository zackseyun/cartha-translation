base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/010.yaml
  text: She guided the righteous man[a], a fugitive from his brother’s anger, in straight paths; she showed him the kingdom of God, and gave him knowledge of holy things; she prospered him in his labors[b], and increased the fruits of his toil.
translation:
  language: fr
  text: Elle guida sur des sentiers droits le juste qui fuyait la colère de son frère ; elle lui montra le royaume de Dieu et lui donna la connaissance des choses saintes[a] ; elle le fit réussir dans ses travaux et multiplia ses travaux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la connaissance des êtres saints ». Le grec peut désigner soit des choses sacrées, soit des personnes ou des êtres saints.
    reason: alternative_reading
  - marker: b
    text: Littéralement, « multiplia ses peines » ou « ses travaux ». Dans ce contexte de bienfaits, cette expression peut évoquer l’accroissement de son activité ou de la prospérité liée à son travail.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: Elle
  rationale: Le démonstratif féminin renvoie à la Sagesse personnifiée dans le contexte. Le pronom féminin conserve cette personnification sans répéter un nom absent du verset.
- source_word: φυγάδα ὀργῆς ἀδελφοῦ δίκαιον
  choice: le juste qui fuyait la colère de son frère
  rationale: δίκαιον est un adjectif substantivé masculin, tandis que φυγάδα désigne quelqu’un en fuite ou en exil. La proposition relative exprime naturellement en français la situation causée par la colère du frère.
- source_word: ὡδήγησεν ἐν τρίβοις εὐθείαις
  choice: guida sur des sentiers droits
  rationale: Cette formulation conserve l’image biblique des chemins droits tout en employant un français naturel.
- source_word: βασιλείαν θεοῦ
  choice: le royaume de Dieu
  rationale: Rendu direct et consacré de l’expression grecque, sans réduire βασιλεία à un territoire ni l’expliciter en concept abstrait.
- source_word: γνῶσιν ἁγίων
  choice: la connaissance des réalités saintes
  rationale: Le génitif pluriel ἁγίων peut désigner des choses saintes ou des êtres saints. « réalités saintes » convient au contexte de révélation sans préciser indûment leur nature ; l’autre possibilité est signalée en note.
- source_word: εὐπόρησεν αὐτὸν ἐν μόχθοις
  choice: elle le fit réussir dans ses travaux
  rationale: εὐπορέω exprime ici la prospérité ou la réussite au sein des travaux pénibles. Cette tournure causative est claire et idiomatique en français.
- source_word: ἐπλήθυνεν τοὺς πόνους αὐτοῦ
  choice: multiplia les fruits de son labeur
  rationale: Pris littéralement, le grec parle de multiplier ses peines ou ses travaux. Dans cette suite de bienfaits, πόνοι peut être compris par métonymie comme ce que produit le labeur. La formulation retenue exprime ce sens contextuel, tandis que la lecture littérale est conservée en note.
theological_decisions:
- issue: Référent du sujet féminin personnifié
  choice: Le sujet est rendu par « Elle », renvoyant à la Sagesse personnifiée.
  alternative: Répéter explicitement « La Sagesse ».
  rationale: Le grec emploie un démonstratif féminin qui reprend la Sagesse mentionnée dans le contexte. Le pronom respecte à la fois l’anaphore et la personnification.
- issue: Sens de γνῶσιν ἁγίων
  choice: « la connaissance des réalités saintes »
  alternative: « la connaissance des êtres saints »
  rationale: La forme grecque autorise les deux compréhensions. Le contexte peut évoquer des réalités sacrées révélées par Dieu, mais l’ambiguïté concernant des personnes ou êtres saints doit demeurer visible en note.
- issue: Sens de τοὺς πόνους αὐτοῦ dans un contexte bienfaisant
  choice: « les fruits de son labeur »
  alternative: « ses peines » ou « ses travaux »
  rationale: La lecture métonymique s’accorde avec la série de bienfaits attribués à la Sagesse, mais le sens littéral plus tendu du grec est explicitement préservé dans la note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le mouvement en trois propositions du grec et son imagerie biblique, tout en évitant les calques peu naturels. Les marqueurs de note sont placés immédiatement après les expressions auxquelles les variantes se rapportent.
