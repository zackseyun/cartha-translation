base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/005.yaml
  text: She also[a], when the nations were thrown into confusion in their wicked conspiracy, found the righteous man and kept him blameless before God[c][b], and kept him strong against his compassion for his child.
translation:
  language: fr
  text: Elle aussi, lorsque les nations, unies dans le mal[a], furent plongées dans la confusion, trouva l’homme juste[b], le garda irréprochable devant Dieu et le maintint ferme malgré sa tendresse pour son enfant[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans une unanimité mauvaise » ou « dans une concorde mauvaise ». Le grec souligne que les nations partageaient un même dessein mauvais.'
    reason: lexical_alternative
  - marker: b
    text: Dans le contexte, « l’homme juste » désigne probablement Abraham, mais le grec ne le nomme pas ici.
    reason: cross_reference
  - marker: c
    text: 'Ou : « elle le garda ferme face à son affection pour son enfant ». Le grec évoque les sentiments profonds ou la compassion envers un enfant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: Elle
  rationale: Le démonstratif féminin renvoie à la Sagesse personnifiée dans le contexte. « Elle » rend naturellement cette reprise en français.
- source_word: ἐν ὁμονοίᾳ πονηρίᾳ
  choice: alors qu’elles étaient unies dans le mal
  rationale: ὁμόνοια exprime l’unité d’esprit ou de dessein, tandis que πονηρία en précise le caractère mauvais. Cette formulation conserve l’idée paradoxale d’une concorde au service du mal sans imposer la notion plus précise de complot.
- source_word: ἐθνῶν συγχυθέντων
  choice: lorsque les nations furent plongées dans la confusion
  rationale: Le génitif absolu indique la circonstance, et συγχέω évoque ici la confusion ou le bouleversement, vraisemblablement en écho à Babel.
- source_word: εὗρεν τὸν δίκαιον
  choice: trouva l’homme juste
  rationale: Le grec emploie un adjectif substantivé masculin singulier sans donner de nom propre. « L’homme juste » en conserve la forme descriptive.
- source_word: ἐτήρησεν αὐτὸν ἄμεμπτον θεῷ
  choice: le garda irréprochable devant Dieu
  rationale: τηρέω signifie garder ou préserver, et ἄμεμπτος, irréprochable. Le datif θεῷ est rendu de façon relationnelle par « devant Dieu ».
- source_word: ἐπὶ τέκνου σπλάγχνοις
  choice: malgré sa tendresse pour son enfant
  rationale: σπλάγχνα désigne les sentiments profonds, l’affection ou la compassion. « Tendresse » convient ici au lien parental; « enfant » respecte le sens non spécifié de τέκνον.
- source_word: ἰσχυρὸν ἐφύλαξεν
  choice: le maintint ferme
  rationale: Le verbe φυλάσσω exprime l’action de garder ou préserver, et ἰσχυρός décrit ici la fermeté dans l’épreuve. La formulation française est naturelle et conserve cette idée de force soutenue.
theological_decisions:
- issue: Identification de « l’homme juste »
  choice: Le texte principal conserve l’expression descriptive « l’homme juste ».
  alternative: Nommer explicitement Abraham.
  rationale: Le contexte, notamment la mention de l’enfant, oriente vers Abraham, mais le grec ne le nomme pas. La traduction n’explicite donc cette identification qu’en note.
- issue: Portée de la dernière proposition
  choice: La Sagesse le maintient ferme malgré sa tendresse pour son enfant.
  alternative: Elle le maintient fort dans l’exercice de sa compassion envers son enfant.
  rationale: La construction avec ἐπί et σπλάγχνοις est concise et peut recevoir diverses nuances. Dans le contexte de l’épreuve d’Abraham, elle met probablement en tension sa fermeté et son affection paternelle, sans mentionner explicitement le sacrifice.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la personnification féminine de la Sagesse, l’allusion à Babel, la désignation implicite d’Abraham et la tension entre sa fermeté et son affection paternelle.
