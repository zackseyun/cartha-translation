  text: and gave him strength to rule over all things[a].
translation:
  language: fr
  text: et lui donna la force de dominer toutes choses[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : «de se rendre maître de toutes choses». Le verbe grec peut exprimer la maîtrise ou l’exercice d’une domination.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκέν
  choice: donna
  rationale: Le passé simple rend naturellement l’aoriste de δίδωμι dans ce récit au registre soutenu.
- source_word: τε
  choice: et
  rationale: La conjonction enclitique relie cette proposition à la précédente sans qu’il soit nécessaire de la renforcer.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom datif renvoie à l’homme juste mentionné dans le contexte, c’est-à-dire Adam.
- source_word: ἰσχὺν
  choice: la force
  rationale: ἰσχύς désigne la force ou la puissance; «la force» s’emploie naturellement avec l’infinitif qui suit.
- source_word: κρατῆσαι
  choice: de dominer
  rationale: Avec un complément au génitif, κρατέω exprime ici l’exercice d’une maîtrise ou d’une domination. «Dominer» conserve cette idée sans préciser indûment son objet.
- source_word: ἁπάντων
  choice: toutes choses
  rationale: Le génitif pluriel est global et non spécifié. «Toutes choses» en préserve l’ampleur et le registre élevé.
theological_decisions:
- issue: Portée de la domination accordée à Adam
  choice: dominer toutes choses
  alternative: se rendre maître de toutes choses
  rationale: Le grec formule la portée de manière absolue sans ajouter «la création» ni «les créatures». La traduction conserve donc cette généralité et ne détermine pas davantage la nature de la domination.
translation_notes:
  register: Français international moderne, concis et digne. Le passé simple convient à la continuité narrative; «toutes choses» garde la portée générale et la tonalité sapientielle du grec.
