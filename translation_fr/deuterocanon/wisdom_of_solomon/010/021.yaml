lexical_decisions:
- source_word: σοφία
  choice: la sagesse
  rationale: Le nom désigne la sagesse tout en étant personnifié par son rôle d’agent. La minuscule conserve le sens lexical sans imposer une lecture plus déterminée.
- source_word: ἤνοιξεν
  choice: a ouvert
  rationale: Cette traduction directe conserve l’image concrète d’une bouche ouverte pour permettre la parole.
- source_word: στόμα κωφῶν
  choice: la bouche des muets
  rationale: κωφός peut désigner une personne sourde ou muette. Le contexte immédiat de la bouche et de la langue favorise ici « muets ». Le singulier collectif « la bouche » reproduit le grec tout en restant naturel en français.
- source_word: γλώσσας νηπίων
  choice: la langue des tout-petits
  rationale: « Langue » préserve l’image corporelle en parallèle avec « bouche ». νήπιοι évoque de très jeunes enfants, notamment ceux dont la parole n’est pas encore pleinement formée; « tout-petits » est moderne et naturel.
- source_word: ἔθηκεν τρανάς
  choice: rendu éloquente
  rationale: τρανός qualifie ce qui est clair, distinct ou bien articulé. « Rendu éloquente » conserve la construction prédicative du grec et exprime une parole devenue claire et assurée.
theological_decisions:
- issue: Personnification de σοφία
  choice: « la sagesse » avec une minuscule
  alternative: « la Sagesse » avec une majuscule
  rationale: Le verset personnifie nettement la sagesse en lui attribuant une action. La majuscule pourrait toutefois transformer une convention typographique en précision théologique; la syntaxe suffit à rendre la personnification perceptible.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le parallélisme corporel entre la bouche et la langue, ainsi que la personnification discrète de la sagesse.
