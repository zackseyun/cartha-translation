translation:
  language: fr
  text: Car la sagesse a ouvert la bouche des muets[a] et rendu claire la langue des tout-petits[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « des sourds » : le mot grec peut désigner des personnes qui n’entendent pas ou qui ne parlent pas ; le contexte de la parole favorise ici « muets ».'
