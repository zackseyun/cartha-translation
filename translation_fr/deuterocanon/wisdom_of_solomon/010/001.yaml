  text: She guarded the first-formed father of the world[a], when he alone had been created, and she delivered him from his own transgression[b],
translation:
  language: fr
  text: Elle garda le père du monde, formé le premier[a], alors qu’il était seul lors de sa création, et le délivra de sa propre transgression[b],
  philosophy: optimal-equivalence
  footnotes:
