lexical_decisions:
- source_word: Αὕτη
  choice: Elle
  rationale: Le démonstratif féminin renvoie à la Sagesse personnifiée dans le contexte précédent. « Elle » conserve cette reprise sans ajouter le nom absent du verset.
- source_word: πρωτόπλαστον
  choice: formé le premier
  rationale: Cette formulation naturelle conserve à la fois l’antériorité et l’image du façonnement exprimées par le composé grec.
- source_word: πατέρα κόσμου
  choice: le père du monde
  rationale: Traduction formellement proche qui garde la désignation élevée d’Adam comme premier ancêtre, sans expliciter davantage que le grec.
- source_word: μόνον κτισθέντα
  choice: alors qu’il avait été créé seul
  rationale: La proposition temporelle rend naturellement le participe aoriste passif et rattache « seul » à l’état du premier homme lors de sa création.
- source_word: διεφύλαξεν
  choice: garda
  rationale: Le verbe exprime une protection attentive et une préservation; « garda » reste concis et digne.
- source_word: ἐξείλατο
  choice: délivra
  rationale: Le verbe moyen signifie délivrer ou arracher au danger. « Délivra » convient au registre du texte sans préciser indûment le moyen.
- source_word: παραπτώματος ἰδίου
  choice: de sa propre transgression
  rationale: « Transgression » rend la faute ou le faux pas moral sans importer le terme théologique plus interprétatif de « chute »; « propre » préserve l’insistance de ἰδίου.
theological_decisions:
- issue: Identification du « père du monde, formé le premier »
  choice: Laisser Adam implicitement désigné dans le texte principal et l’identifier en note.
  alternative: Insérer directement le nom « Adam » dans le texte.
  rationale: Le grec décrit Adam sans le nommer. La traduction conserve cette manière littéraire tout en permettant au lecteur d’identifier clairement le référent grâce à la note.
- issue: Sens de παραπτώματος
  choice: transgression
  alternative: chute
  rationale: « Chute » pourrait introduire une désignation doctrinale ultérieure plus précise que le nom grec, tandis que « transgression » en conserve la portée morale et l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve le mouvement de la phrase grecque et la personnification féminine de la Sagesse. La virgule finale reflète la continuité syntaxique du passage fourni.
