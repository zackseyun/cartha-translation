base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/012.yaml
  text: She protected him from enemies[a], and from those lying in ambush she kept him safe; and she awarded him a strong contest[b], so that he might know that godliness is stronger than everything.
translation:
  language: fr
  text: Elle le protégea de ses ennemis et le mit à l’abri de ceux qui lui tendaient des pièges. Elle lui décerna le prix d’un rude combat[a], afin qu’il sache que la piété[b] est plus puissante que tout.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec associe l’image d’un rude combat à celle d’un arbitre qui attribue un prix. La formulation peut aussi se comprendre : « elle lui accorda un rude combat » ou « elle lui accorda le prix au terme d’un rude combat ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « dévotion révérencieuse ». Le mot grec désigne une dévotion envers Dieu qui se manifeste dans la manière de vivre.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεφύλαξεν
  choice: protégea
  rationale: Le verbe exprime une protection vigilante contre le danger; « protégea » est naturel et précis en français moderne.
- source_word: ἐχθρῶν
  choice: ennemis
  rationale: Équivalent courant et direct pour désigner des personnes hostiles.
- source_word: ἐνεδρευόντων
  choice: ceux qui lui tendaient des pièges
  rationale: Le participe évoque littéralement ceux qui dressent une embuscade; cette formulation conserve l’idée concrète tout en restant idiomatique.
- source_word: ἠσφαλίσατο
  choice: le mit à l’abri
  rationale: Le moyen exprime l’action de rendre quelqu’un sûr ou hors de danger; la tournure française convient à la progression protectrice du verset.
- source_word: ἀγῶνα ἰσχυρὸν
  choice: un rude combat
  rationale: ἀγών désigne un combat, une lutte ou une épreuve, et ἰσχυρός en souligne l’intensité. « Rude combat » conserve cette force sans réduire l’image au seul domaine sportif.
- source_word: ἐβράβευσεν αὐτῷ
  choice: lui attribua la victoire dans
  rationale: Le verbe appartient au champ du juge qui décerne un prix. En français, « attribua la victoire » rend plus naturellement l’idée d’une décision favorable dans le combat, tandis que la note signale l’ambiguïté entre prix, victoire et combat accordé.
- source_word: ἵνα γνῷ
  choice: afin qu’il sache
  rationale: Rend directement la proposition de but et son verbe de connaissance.
- source_word: παντὸς δυνατωτέρα
  choice: est plus puissant que tout
  rationale: Le comparatif avec génitif affirme une supériorité universelle; cette formulation est claire et proche de la structure grecque.
- source_word: εὐσέβεια
  choice: attachement à Dieu
  rationale: Dans ce contexte, le terme désigne une dévotion respectueuse envers Dieu qui se manifeste dans la vie. « Attachement à Dieu » est accessible et évite les connotations parfois étroites de « piété ».
theological_decisions:
- issue: Référent du sujet féminin sous-entendu
  choice: Employer « Elle », en référence à la Sagesse personnifiée dans le contexte.
  alternative: Répéter explicitement « la Sagesse ».
  rationale: Le grec laisse le sujet féminin implicite. Le pronom préserve à la fois la continuité contextuelle et la personnification littéraire sans ajouter le nom dans ce verset.
- issue: Sens de ἐβράβευσεν avec ἀγῶνα ἰσχυρόν
  choice: Traduire « lui attribua la victoire dans un rude combat », avec une note exposant l’ambiguïté.
  alternative: « lui accorda un rude combat » ou « lui décerna le prix au terme d’un rude combat ».
  rationale: La construction associe le vocabulaire du combat à celui de l’arbitrage ou de l’attribution d’un prix. La formulation principale est idiomatique, mais la note conserve la tension lexicale au lieu de présenter une interprétation comme certaine.
- issue: Portée de εὐσέβεια
  choice: « attachement à Dieu »
  alternative: « piété » ou « fidélité envers Dieu ».
  rationale: Le choix exprime une dévotion révérencieuse vécue sans importer une définition confessionnelle particulière; la note conserve l’équivalent traditionnel.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif des livres sapientiaux. Les deux notes rendent visibles les principales ambiguïtés lexicales sans alourdir le texte.
