  text: But wisdom rescued those who served her from hardships[a].
translation:
  language: fr
  text: Mais la sagesse a délivré des peines ceux qui l’ont servie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des travaux pénibles », « des souffrances » ou « des détresses ». Le terme grec peut désigner le labeur, la douleur ou, plus largement, l’affliction.
    reason: Alternative lexicale reflétant l’étendue de sens de πόνων.
lexical_decisions:
- source_word: σοφία
  choice: la sagesse
  rationale: Le nom commun français correspond directement au grec et permet de conserver la personnification littéraire sans en faire explicitement un nom propre.
- source_word: θεραπεύσαντας
  choice: ceux qui l’ont servie
  rationale: Dans ce contexte, le participe désigne ceux qui se sont consacrés au service de la sagesse. « Servie » exprime cette fidélité avec naturel, sans formulation archaïque.
- source_word: αὐτήν
  choice: l’
  rationale: Le pronom reprend « la sagesse ». En français, sa forme élidée ne marque pas le genre, mais l’accord féminin de « servie » maintient clairement la référence.
- source_word: ἐκ πόνων
  choice: des peines
  rationale: πόνος peut évoquer le labeur pénible, la souffrance ou la détresse. « Peines » conserve cette amplitude dans un français courant et digne.
- source_word: ἐρρύσατο
  choice: a délivré
  rationale: Le verbe grec exprime le fait de tirer quelqu’un hors d’une situation pénible ou dangereuse. « A délivré » rend ce mouvement sans imposer ici un sens doctrinal plus précis.
theological_decisions:
- issue: Personnification de la sagesse
  choice: Conserver « la sagesse » comme nom commun féminin et la présenter comme sujet personnel de l’action.
  alternative: Écrire « la Sagesse » comme un nom propre afin d’accentuer la personnification.
  rationale: Le grec personnifie la sagesse, mais n’exige pas d’en faire un nom propre. La minuscule préserve l’ambiguïté entre qualité divine et figure personnifiée.
translation_notes:
  register: Français international moderne, sobre et digne. La structure légèrement soutenue « a délivré des peines ceux qui… » reste claire tout en évitant d’ajouter un possessif absent du grec.
