base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/020.yaml
  text: Therefore the righteous plundered the ungodly[a], and they sang praise to your holy name, O Lord[b]; and with one accord they praised your defending hand.
translation:
  language: fr
  text: C’est pourquoi les justes dépouillèrent les impies[a] ; ils chantèrent les louanges de ton saint nom, Seigneur, et, d’un commun accord, célébrèrent ta main protectrice[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prirent le butin des impies ». Le verbe grec désigne le fait de dépouiller des ennemis vaincus.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « ta main qui combat pour défendre » ou « ta main championne ».
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Marque clairement la conséquence qui relie ce verset à la délivrance racontée auparavant.
- source_word: δίκαιοι
  choice: les justes
  rationale: Rend l’adjectif substantivé sans préciser l’identité ethnique que le contexte permet de reconnaître.
- source_word: ἐσκύλευσαν
  choice: dépouillèrent
  rationale: Évoque la prise du butin sur des ennemis vaincus et convient ici avec un complément de personne.
- source_word: ἀσεβεῖς
  choice: les impies
  rationale: Conserve la dimension religieuse du terme grec, qui désigne ceux qui manquent de respect envers Dieu.
- source_word: ὕμνησαν
  choice: chantèrent les louanges de
  rationale: Préserve la nuance musicale du verbe, plus précise qu’un simple verbe signifiant « louer ».
- source_word: Κύριε
  choice: Seigneur
  rationale: Rend directement le vocatif adressé à Dieu dans un registre biblique naturel en français.
- source_word: τὸ ὄνομα τὸ ἅγιόν σου
  choice: ton saint nom
  rationale: Expression biblique française claire et établie, qui conserve l’ordre sémantique du grec.
- source_word: τήν τε ὑπέρμαχόν σου χεῖρα
  choice: ta main qui prenait leur défense
  rationale: Conserve la métaphore de la main divine et exprime la nuance active, protectrice et combattante de ὑπέρμαχος.
- source_word: ᾔνεσαν
  choice: célébrèrent
  rationale: Exprime la louange tout en évitant la répétition française après « chantèrent les louanges ».
- source_word: ὁμοθυμαδόν
  choice: d’un commun accord
  rationale: Rend l’unité d’élan et d’intention, plutôt qu’une simple simultanéité.
theological_decisions:
- issue: Référents des « justes » et des « impies »
  choice: Conserver les catégories générales « les justes » et « les impies ».
  alternative: Expliciter « les Israélites justes » et « les Égyptiens impies ».
  rationale: Le contexte évoque Israël et l’Égypte, mais le grec emploie délibérément des qualifications morales et religieuses plutôt que des noms ethniques.
- issue: Action divine exprimée par la « main »
  choice: Conserver l’image de la main et rendre ὑπέρμαχος par « qui prenait leur défense ».
  alternative: « ta puissance protectrice » ou « ta main puissante »
  rationale: La formulation retenue maintient l’image biblique et la nuance d’une intervention qui combat en faveur des justes, sans réduire celle-ci à une puissance abstraite.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le parallélisme des deux actes de louange, la métaphore biblique de la main et les catégories morales du texte grec.
