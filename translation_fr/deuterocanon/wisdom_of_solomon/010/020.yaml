revisions:
- from: C’est pourquoi les justes dépouillèrent les impies[a] ; ils chantèrent les louanges de ton saint nom, Seigneur, et, d’un commun accord, célébrèrent ta main qui prenait leur défense[b].
  to: C’est pourquoi les justes dépouillèrent les impies[a] ; ils chantèrent les louanges de ton saint nom, Seigneur, et, d’un commun accord, célébrèrent ta main protectrice[b].
  rationale: La révision retire l’explicitation du bénéficiaire de l’action défensive, afin de préserver l’implicite du grec, tout en conservant l’image de la main divine. La note b rend compte de la nuance active et martiale de ὑπέρμαχος sans identifier davantage le référent.
