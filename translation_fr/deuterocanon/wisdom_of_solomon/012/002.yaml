base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/002.yaml
  text: Therefore you rebuke those who fall away little by little[a], and by reminding them of the things in which they sin you warn them, so that, having been set free from wickedness, they may put faith in you, Lord.
translation:
  language: fr
  text: C’est pourquoi tu reprends peu à peu ceux qui s’égarent et, en leur rappelant en quoi ils pèchent, tu les avertis, afin que, délivrés du mal, ils mettent leur foi en toi, Seigneur.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre rattachement possible : « tu reprends ceux qui s’égarent peu à peu ».'
    reason: ambiguïté syntaxique de κατ’ ὀλίγον
  - marker: b
    text: 'Ou : « ils mettent leur confiance en toi »; autre traduction possible : « ils croient en toi ».'
    reason: nuance lexicale de πιστεύσωσιν ἐπὶ σέ
lexical_decisions:
- source_word: διό
  choice: C’est pourquoi
  rationale: Marque naturellement en français la conséquence tirée de ce qui précède.
- source_word: τοὺς παραπίπτοντας
  choice: ceux qui s’égarent
  rationale: παραπίπτω désigne ici une déviation morale. « S’égarer » garde cette idée sans suggérer nécessairement une apostasie définitive.
- source_word: κατ’ ὀλίγον
  choice: peu à peu
  rationale: L’expression indique une action graduelle ou mesurée. Sa place permet de la rattacher naturellement à la réprimande divine, conformément au contexte de patience et de correction progressive.
- source_word: ἐλέγχεις
  choice: tu reprends
  rationale: Le verbe exprime la mise en lumière d’une faute en vue de corriger. « Reprendre » est actuel, digne et moins exclusivement punitif que « réprimander ».
- source_word: ἐν οἷς ἁμαρτάνουσιν
  choice: en quoi ils pèchent
  rationale: Rend de manière concise les domaines ou les actes précis dans lesquels ils commettent le péché.
- source_word: ὑπομιμνήσκων
  choice: en leur rappelant
  rationale: Le participe indique le moyen par lequel l’avertissement est donné.
- source_word: νουθετεῖς
  choice: tu les avertis
  rationale: νουθετέω associe avertissement et correction morale. « Avertir » reste clair pour un lectorat moderne.
- source_word: ἀπαλλαγέντες
  choice: délivrés
  rationale: Conserve la valeur passive du participe et l’idée d’être libéré d’un état mauvais.
- source_word: τῆς κακίας
  choice: du mal
  rationale: κακία désigne ici largement le mal moral. « Du mal » est naturel et ne réduit pas le sens à la seule malveillance.
- source_word: πιστεύσωσιν ἐπὶ σέ
  choice: ils mettent leur foi en toi
  rationale: La construction avec ἐπί et l’accusatif exprime une foi ou une confiance dirigée vers Dieu. Cette formulation conserve le vocabulaire de la foi tout en faisant entendre l’appui personnel sur Dieu.
- source_word: Κύριε
  choice: Seigneur
  rationale: Rend directement le vocatif adressé à Dieu, sans ajouter une interjection absente du grec.
theological_decisions:
- issue: Portée de κατ’ ὀλίγον
  choice: « peu à peu » qualifie principalement « tu reprends »
  alternative: « ceux qui s’égarent peu à peu »
  rationale: Dans le contexte, l’expression évoque très probablement la correction graduelle et mesurée de Dieu. La place des mots laisse toutefois possible un rattachement au participe; cette ambiguïté est signalée en note.
- issue: Sens de πιστεύσωσιν ἐπὶ σέ
  choice: « ils mettent leur foi en toi »
  alternative: « ils mettent leur confiance en toi » ou « ils croient en toi »
  rationale: La formulation choisie préserve le registre théologique de la foi et l’orientation personnelle exprimée par ἐπί, sans exclure la nuance concrète de confiance.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve l’adresse directe à Dieu et la progression correction–rappel–avertissement–foi. Les notes maintiennent les deux ambiguïtés réelles sans alourdir le texte principal.
