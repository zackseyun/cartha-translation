base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/012.yaml
  text: For who will say[b][a], “What have you done?” Or who will oppose your judgment? And who will bring a charge against you concerning the nations that you destroyed? Or who will come before you as an avenger against unrighteous men?
translation:
  language: fr
  text: 'Car qui dira : « Qu’as-tu fait ? » Ou qui s’opposera à ton jugement ? Qui portera plainte contre toi au sujet des nations que tu as fait périr[a] ? Ou qui viendra se dresser contre toi, en vengeur contre des hommes injustes[b] ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « au sujet de nations ayant péri, que tu as faites / accomplies ». La construction est condensée; dans ce contexte, elle désigne les nations que Dieu a fait périr.'
    reason: lexical_alternative
  - marker: b
    text: La construction grecque est difficile, surtout dans l’expression rendue par « viendra se dresser contre toi ». « Contre des hommes injustes » traduit directement le grec; l’ensemble peut aussi évoquer une comparution ou une intervention de caractère judiciaire contre Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γὰρ ἐρεῖ
  choice: Car qui dira
  rationale: Conserve la question rhétorique, le futur grec et la valeur explicative de γάρ.
- source_word: Τί ἐποίησας
  choice: Qu’as-tu fait ?
  rationale: Reproduit directement la formule de contestation sans ajouter un « pourquoi » absent du grec.
- source_word: ἀντιστήσεται τῷ κρίματί σου
  choice: s’opposera à ton jugement
  rationale: Exprime clairement la résistance à la décision judiciaire de Dieu tout en gardant le terme général κρίμα.
- source_word: ἐγκαλέσει σοι
  choice: portera plainte contre toi
  rationale: Préserve la coloration juridique du verbe dans un français moderne et naturel.
- source_word: κατὰ ἐθνῶν ἀπολωλότων, ἃ σὺ ἐποίησας
  choice: au sujet des nations que tu as fait périr
  rationale: 'Rend le sens contextuel de la tournure grecque condensée : la plainte viserait le sort des nations dont Dieu a causé la perte.'
- source_word: εἰς κατάστασίν σοι ἐλεύσεται
  choice: viendra se dresser contre toi
  rationale: La locution rare semble décrire une comparution ou une prise de position adverse; cette formulation garde à la fois le mouvement et l’opposition.
- source_word: ἔκδικος κατὰ ἀδίκων ἀνθρώπων
  choice: en vengeur contre des hommes injustes
  rationale: Conserve le caractère personnel et judiciaire de ἔκδικος ainsi que la valeur adversative naturelle de κατά avec le génitif, malgré une articulation difficile.
theological_decisions:
- issue: La possibilité de contester les actes judiciaires de Dieu
  choice: Rendre la série comme des questions rhétoriques affirmant qu’aucun accusateur ne peut valablement contester le jugement divin.
  alternative: Atténuer le propos en parlant seulement d’une impossibilité pratique de résister.
  rationale: La répétition de τίς et le vocabulaire juridique donnent au passage une forte portée judiciaire, sans qu’il soit nécessaire d’ajouter une formulation doctrinale.
- issue: Le rapport entre le vengeur et les hommes injustes
  choice: Conserver « contre des hommes injustes », conformément à la construction grecque la plus directe.
  alternative: « pour venger des hommes injustes », qui ferait du vengeur leur défenseur contre Dieu.
  rationale: Le grec κατὰ ἀδίκων ἀνθρώπων signifie normalement « contre des hommes injustes », mais la syntaxe globale demeure difficile; une note signale donc l’autre compréhension possible sans trancher silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe à Dieu. Le vocabulaire juridique (« jugement », « porter plainte », « vengeur ») maintient la cohérence du verset; les deux tournures grecques les plus obscures sont explicitées en notes plutôt que résolues sans avertissement.
