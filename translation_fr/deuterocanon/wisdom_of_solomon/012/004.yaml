translation:
  language: fr
  text: tu les avais pris en haine parce qu’ils accomplissaient les actes les plus abominables de sorcellerie[a] et des rites impies[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les arts magiques ». Le terme grec peut désigner diverses pratiques magiques et, dans certains contextes, l’emploi de potions ou de poisons.
    reason: lexical_alternative
  - marker: b
    text: Ou « des cérémonies impies » ou « des rites d’initiation impies ». Le terme grec peut désigner des observances cultuelles.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισήσας
  choice: tu les avais pris en haine
  rationale: Le participe aoriste reprend les anciens habitants mentionnés au verset précédent et a Dieu pour sujet. Cette formulation française conserve la force de « haïr » tout en assurant le raccord avec le contexte.
- source_word: ἐπὶ τῷ
  choice: parce que
  rationale: Avec l’infinitif πράσσειν, la construction indique ici le motif de cette haine.
- source_word: ἔχθιστα
  choice: les plus abominables
  rationale: Le superlatif exprime une répulsion extrême. « Abominables » est naturel et vigoureux en français sans atténuer le jugement moral.
- source_word: πράσσειν
  choice: ils se livraient à
  rationale: Le verbe désigne l’accomplissement ou la pratique d’actes, vraisemblablement habituels dans ce contexte.
- source_word: ἔργα
  choice: pratiques
  rationale: Dans l’expression française, « pratiques » rend naturellement les actes cultuels et magiques énumérés ensuite; une traduction plus littérale serait « œuvres » ou « actes ».
- source_word: φαρμακειῶν
  choice: la sorcellerie
  rationale: Dans ce contexte religieux, le terme renvoie vraisemblablement aux pratiques magiques, tout en pouvant inclure l’emploi de drogues, potions ou poisons.
- source_word: τελετὰς
  choice: rites
  rationale: Le mot désigne des cérémonies cultuelles et peut, selon le contexte, viser des rites d’initiation.
- source_word: ἀνοσίους
  choice: impies
  rationale: Le terme qualifie ce qui enfreint la sainteté ou la piété; « impies » convient particulièrement à des rites religieux condamnés.
theological_decisions:
- issue: Sujet et complément implicite de μισήσας
  choice: Dieu est le sujet, et « les » renvoie aux anciens habitants mentionnés au verset précédent.
  alternative: 'Laisser le participe sous une forme plus littérale et moins explicitement rattachée : « les ayant haïs… »'
  rationale: La syntaxe de la phrase commencée au verset précédent établit Dieu comme sujet et les anciens habitants comme objet. Le français explicite seulement le raccord imposé par le contexte, sans ajouter l’idée distincte de « choses que tu haïssais ».
- issue: Relation exprimée par ἐπὶ τῷ avec l’infinitif
  choice: Le motif de la haine est rendu par « parce que ».
  alternative: Employer « pour avoir pratiqué » ou « à cause de leurs pratiques ».
  rationale: La construction grecque indique la raison pour laquelle les habitants sont pris en haine; la formulation causale préserve cette relation sans trancher au-delà de la syntaxe.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste liée au verset précédent par « les » et conserve la virgule finale du fragment. Le deux-points introduit naturellement l’explication des « pratiques ».
