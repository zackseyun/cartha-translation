base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/013.yaml
  text: For there is no god besides you who cares for all[a], so that you should show that you did not judge unjustly[b];
translation:
  language: fr
  text: Car il n’y a pas d’autre dieu que toi, qui prends soin de tous[a], pour que tu montres que tu n’as pas jugé injustement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui veilles sur tout ». Le grec peut désigner tous les êtres ou toutes choses.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, « tu n’as pas jugé injustement » ; autre formulation possible : « tu as jugé avec justice ».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὔτε γὰρ
  choice: Car il n’y a pas
  rationale: γάρ introduit l’explication, rendu par « Car ». Dans cette tournure existentielle, οὔτε se rend naturellement en français par la négation « il n’y a pas ».
- source_word: θεός ... πλὴν σοῦ
  choice: d’autre dieu que toi
  rationale: Cette formulation française naturelle exprime l’exclusion marquée par πλήν avec le génitif. La minuscule à « dieu » convient au nom commun dans la catégorie dont tout autre prétendant est exclu.
- source_word: ᾧ μέλει περὶ πάντων
  choice: qui prends soin de tous
  rationale: La tournure personnelle restitue clairement l’expression grecque impersonnelle μέλει περί. L’accord à la deuxième personne rattache sans ambiguïté la relative à « toi ».
- source_word: πάντων
  choice: tous
  rationale: Le grec peut viser toutes les personnes ou toutes choses. « Tous » conserve ici une certaine ouverture, tout en évoquant naturellement l’ensemble des êtres dont Dieu prend soin.
- source_word: ἵνα δείξῃς
  choice: pour que tu montres
  rationale: La construction « pour que » avec le subjonctif conserve la valeur de but de ἵνα et son lien avec la proposition précédente.
- source_word: οὐκ ἀδίκως ἔκρινας
  choice: tu n’as pas jugé injustement
  rationale: La négation et l’adverbe du grec sont conservés, sans transformer la formule en affirmation positive plus lisse (« tu as jugé avec justice »).
theological_decisions:
- issue: Exclusivité divine exprimée par θεός ... πλὴν σοῦ
  choice: il n’y a pas d’autre dieu que toi
  alternative: il n’y a pas de Dieu en dehors de toi
  rationale: Le choix retenu exprime l’exclusivité sans faire de la majuscule française un élément interprétatif absent du grec.
- issue: Portée de πάντων
  choice: de tous
  alternative: de toutes choses
  rationale: Le genre et la portée précise du pluriel grec restent ouverts. « Tous » évite de limiter explicitement le soin divin soit aux seules personnes, soit aux seules choses.
- issue: Forme négative de οὐκ ἀδίκως
  choice: tu n’as pas jugé injustement
  alternative: tu as jugé avec justice
  rationale: La formulation négative du texte source est préservée afin de ne pas résoudre sa tension rhétorique en une affirmation positive.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde la structure argumentative du grec et sa formulation négative finale, tout en évitant une syntaxe trop calquée.
