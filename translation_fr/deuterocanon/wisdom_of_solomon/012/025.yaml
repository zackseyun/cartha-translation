  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/025.yaml
  text: Therefore[a], as to senseless children, you sent judgment for mockery;
translation:
  language: fr
  text: C’est pourquoi, comme à des enfants dépourvus de discernement, tu as envoyé un jugement pour les tourner en dérision[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un jugement qui faisait d’eux la risée » ou « un jugement en forme de dérision ». Le grec permet de comprendre la dérision comme la visée, le résultat ou la forme du jugement.
    reason: La construction εἰς ἐμπαιγμόν admet plusieurs nuances proches qu’une seule formulation française ne peut rendre simultanément.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Expression déductive naturelle qui relie explicitement ce verset au raisonnement précédent.
- source_word: ὡς παισὶν ἀλογίστοις
  choice: comme à des enfants dépourvus de raison
  rationale: ὡς marque ici la comparaison dans la manière de les traiter; « dépourvus de raison » restitue la portée intellectuelle et morale de ἀλόγιστος sans suggérer qu’il s’agit littéralement d’enfants.
- source_word: τὴν κρίσιν
  choice: un jugement
  rationale: « Jugement » conserve la résonance judiciaire de κρίσις sans la réduire au seul châtiment.
- source_word: εἰς ἐμπαιγμόν
  choice: pour les tourner en dérision
  rationale: Cette formulation française naturelle exprime la valeur de visée ou de résultat de εἰς et la force moqueuse de ἐμπαιγμός; le pronom « les » renvoie aux destinataires déjà exprimés.
- source_word: ἔπεμψας
  choice: tu leur as envoyé
  rationale: Le verbe « envoyer » conserve l’image concrète de πέμπω; « leur » rend explicitement en français le datif παισίν.
theological_decisions:
- issue: La comparaison introduite par ὡς décrit-elle une identité littérale ou une manière de traiter les destinataires?
  choice: Dieu les traite comme des enfants dépourvus de raison.
  alternative: Ils sont eux-mêmes qualifiés littéralement d’enfants dépourvus de raison.
  rationale: La construction comparative avec ὡς porte naturellement sur la manière dont le jugement leur est adressé; la traduction préserve cette comparaison sans transformer l’image en affirmation d’identité.
- issue: Faut-il préciser κρίσις par « châtiment »?
  choice: jugement
  alternative: châtiment
  rationale: Le grec emploie le terme judiciaire plus large κρίσις. « Jugement » maintient cette amplitude et n’impose pas une précision absente du texte.
- issue: Quelle relation εἰς ἐμπαιγμόν établit-il entre le jugement et la dérision?
  choice: 'Une visée ou un résultat: « pour les tourner en dérision ».'
  alternative: 'Une caractérisation du jugement: « un jugement en forme de dérision » ou « qui faisait d’eux la risée ».'
  rationale: εἰς peut exprimer la visée ou le résultat, mais la formulation demeure légèrement ouverte; la note conserve les autres nuances possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’adresse directe à Dieu, l’image de l’envoi du jugement et la comparaison, tout en évitant le faux sens de « jugement dérisoire », qui pourrait suggérer un jugement insignifiant.
