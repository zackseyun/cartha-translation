base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/008.yaml
  text: But even these[a], since they were human beings, you spared, and you sent hornets ahead as forerunners of your army, so that they might destroy them little by little[c][b];
translation:
  language: fr
  text: Mais même ceux-là, parce qu’ils étaient des êtres humains, tu les as épargnés, et tu as envoyé des frelons, précurseurs de ton armée[a], afin qu’ils les exterminent peu à peu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ton camp ». Le grec peut désigner soit un camp, soit une armée.
    reason: lexical_alternative
  - marker: b
    text: Les « frelons » rappellent les insectes piqueurs que Dieu envoie devant Israël contre des peuples ennemis; voir Exode 23.28; Deutéronome 7.20; Josué 24.12.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ καὶ τούτων
  choice: Mais même ceux-là
  rationale: Conserve la valeur à la fois adversative et additive de ἀλλὰ καί, ainsi que le renvoi démonstratif aux peuples évoqués dans le contexte.
- source_word: ὡς ἀνθρώπων
  choice: parce qu’ils étaient des êtres humains
  rationale: ὡς avec le génitif exprime ici la considération motivant la retenue divine; «êtres humains» est inclusif, naturel et souligne leur condition humaine.
- source_word: ἐφείσω
  choice: tu les as épargnés
  rationale: Rend directement l’idée de s’abstenir de faire périr ou de nuire, dans le contexte d’un jugement différé.
- source_word: ἀπέστειλάς τε
  choice: et tu as envoyé
  rationale: Traduction naturelle de l’aoriste, avec reprise du lien établi par τε.
- source_word: προδρόμους
  choice: précurseurs
  rationale: Préserve l’image de ceux qui précèdent et annoncent l’arrivée de la force principale.
- source_word: τοῦ στρατοπέδου σου
  choice: de ton armée
  rationale: στρατόπεδον peut désigner un camp ou une armée; «armée» rend clairement l’image militaire dans ce contexte.
- source_word: σφῆκας
  choice: des frelons
  rationale: Choix français traditionnel et précis dans les passages bibliques parallèles relatifs aux insectes piqueurs envoyés devant Israël.
- source_word: ἵνα αὐτοὺς κατὰ βραχὺ ἐξολεθρεύσωσιν
  choice: afin qu’ils les exterminent peu à peu
  rationale: «Afin que» exprime le but; «peu à peu» rend κατὰ βραχύ, tandis qu’«exterminer» conserve la force de ἐξολεθρεύω.
theological_decisions:
- issue: Motif de la retenue divine
  choice: La retenue de Dieu est motivée par le fait qu’ils sont des êtres humains.
  alternative: 'Comprendre plus largement: «les traitant comme des humains».'
  rationale: La tournure causale française exprime naturellement la valeur circonstancielle de ὡς ἀνθρώπων, sans développer une doctrine étrangère au verset.
- issue: Métaphore militaire de l’action divine
  choice: «ton armée»
  alternative: «ton camp»
  rationale: Le contexte présente les frelons comme des précurseurs envoyés devant le στρατόπεδον de Dieu; «armée» maintient nettement cette image militaire, tandis que la variante est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la progression du grec et son image militaire. «Exterminent peu à peu» maintient volontairement la tension entre la violence du verbe et la gradualité de l’action.
