  text: with how much care you judged your sons[a], to whose fathers you gave oaths and covenants with good promises[c][b];
translation:
  language: fr
  text: Avec quel soin tu as jugé tes fils[a], toi qui avais donné à leurs pères des serments et des alliances accompagnés de bonnes promesses[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec quelle précision » ou « avec quelle rigueur tu as jugé tes fils ». « Tes fils » peut aussi se rendre par « tes enfants », mais le grec dit précisément « fils ».
    reason: lexical_alternative
  - marker: b
    text: Ou « des serments et des alliances comportant de bonnes promesses ».
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ πόσης ἀκριβείας
  choice: Avec quel soin
  rationale: La tournure exclamative grecque souligne le soin exact et rigoureux avec lequel Dieu exerce son jugement. « Avec quel soin » est naturel en français tout en laissant la note signaler les nuances de précision et de rigueur.
- source_word: ἔκρινας
  choice: tu as jugé
  rationale: Le verbe conserve ici son sens judiciaire et moral; « jugé » évite de l’affaiblir en simple gouvernement ou administration.
- source_word: τοὺς υἱούς σου
  choice: tes fils
  rationale: Le grec emploie explicitement le masculin pluriel υἱούς. « Tes fils » préserve aussi le motif filial appliqué au peuple de Dieu.
- source_word: ὧν τοῖς πατράσιν
  choice: toi qui avais donné à leurs pères
  rationale: Cette reformulation française naturelle maintient le lien entre les fils et leurs ancêtres, sans la lourdeur de « aux pères desquels ».
- source_word: ὅρκους
  choice: des serments
  rationale: « Serments » rend directement ὅρκους et le distingue du terme d’alliance qui suit.
- source_word: συνθήκας
  choice: des alliances
  rationale: Dans ce contexte biblique, « alliances » exprime des engagements solennels envers les patriarches mieux que « accords » ou « pactes ».
- source_word: ἀγαθῶν ὑποσχέσεων
  choice: assortis de promesses de bonheur
  rationale: Le génitif qualifie les serments et les alliances par les promesses favorables qu’ils comportent. « Promesses de bonheur » exprime ici le bien promis, tandis que « assortis de » rend clairement le rapport syntaxique.
theological_decisions:
- issue: Langage filial appliqué à Israël
  choice: tes fils
  alternative: tes enfants
  rationale: Le texte grec dit précisément « fils ». Cette formulation conserve le langage filial de l’alliance sans le neutraliser.
- issue: Distinction entre les engagements divins
  choice: des serments et des alliances
  alternative: des engagements solennels
  rationale: Le maintien des deux termes grecs préserve l’accumulation qui souligne la fermeté des engagements pris par Dieu envers les pères.
- issue: Portée de ἀγαθῶν dans les promesses
  choice: promesses de bonheur
  alternative: bonnes promesses
  rationale: « Promesses de bonheur » peut désigner les biens promis, tandis que « bonnes promesses » risquerait en français de qualifier surtout la qualité ou la crédibilité des promesses. La note conserve l’autre lecture possible.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase garde la force exclamative du grec. Le tutoiement correspond à l’adresse directe à Dieu dans le contexte. La structure relative grecque est reformulée avec « toi qui… à leurs pères » pour éviter une construction française pesante tout en préservant la filiation covenantale.
