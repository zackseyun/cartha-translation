    rationale: ἐφʼ οἷς ἥμαρταν se rattache naturellement à l’impunité refusée (« pour les fautes qu’ils avaient commises »), mais la construction reste compacte. Une note formulée avec « au sujet de leurs fautes » préserve mieux cette souplesse.
