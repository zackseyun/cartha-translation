  source_fidelity: La première proposition rend fidèlement σπέρμα ... κατηραμένον ἀπʼ ἀρχῆς. En revanche, la seconde formulation française (« ce n’est pas par égard... que tu leur accordais l’impunité ») ne nie pas sans équivoque l’octroi de l’impunité et peut même présupposer qu’elle a été accordée. Le grec nie explicitement cet octroi (οὐδὲ ... ἄδειαν ἐδίδους).
  naturalness: '« Descendance maudite dès l’origine » est naturel dans un registre biblique moderne. La révision rend la seconde proposition à la fois plus claire et plus idiomatique, en exprimant explicitement la double négation sémantique : absence de crainte envers quiconque et refus d’impunité.'
  terminology: « Descendance » convient pour σπέρμα dans son sens collectif figuré; la note conserve utilement « semence ». « Maudite » est exact pour κατηραμένον. « Impunité » rend bien ἄδεια dans ce contexte judiciaire et évite d’imposer la nuance théologique de « pardon ».
