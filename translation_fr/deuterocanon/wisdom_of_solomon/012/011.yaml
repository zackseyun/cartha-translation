base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/011.yaml
  text: For it was a seed accursed from the beginning[a], and not fearing anyone because of the things in which they sinned[b], you granted them no pardon.
translation:
  language: fr
  text: Car c’était une descendance maudite dès l’origine[a] ; et, ne craignant personne, tu ne leur accordais pas l’impunité pour les fautes qu’ils avaient commises[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une semence maudite dès l’origine » ; le mot grec peut désigner une descendance, une lignée ou un peuple.'
    reason: lexical_alternative
  - marker: b
    text: 'La construction grecque est compacte. On peut aussi traduire : « et, sans égard pour personne, tu ne leur accordais pas d’impunité au sujet de leurs fautes ».'
    reason: alternative_reading
lexical_decisions:
- source_word: σπέρμα
  choice: descendance
  rationale: Le nom peut désigner la « semence » au sens propre, mais ici il évoque collectivement une lignée ou un peuple. « Descendance » restitue naturellement ce sens figuré en français sans préciser davantage le référent.
- source_word: κατηραμένον
  choice: maudite
  rationale: Le participe qualifie cette descendance comme étant sous une malédiction ; « maudite » garde la force et le registre solennel du grec.
- source_word: ἀπʼ ἀρχῆς
  choice: dès l’origine
  rationale: Cette formulation française concise rend la valeur temporelle de l’expression tout en convenant à une lignée ; « depuis le commencement » reste possible.
- source_word: εὐλαβούμενος
  choice: par égard pour
  rationale: Avec τινα, le participe peut exprimer la crainte prudente, la déférence ou les égards envers quelqu’un. Dans ce contexte, « par égard pour qui que ce soit » rend l’idée que Dieu n’a été retenu par aucune considération de personne.
- source_word: ἄδειαν
  choice: l’impunité
  rationale: Le terme désigne ici une exemption ou une immunité à l’égard du châtiment. « Impunité » convient mieux que « pardon », qui ajouterait une nuance de rémission intérieure non exigée par le mot.
- source_word: ἐδίδους
  choice: tu accordais
  rationale: L’imparfait français correspond à l’imparfait grec et présente l’action dans le cadre narratif passé.
- source_word: ἐφʼ οἷς ἥμαρταν
  choice: pour leurs péchés
  rationale: Cette expression idiomatique et claire rend les actes dans lesquels ils avaient péché comme motif de la non-exemption, sans reproduire lourdement la syntaxe grecque.
theological_decisions:
- issue: Identification de la « descendance » avec les peuples cananéens du contexte
  choice: Ne pas nommer explicitement le peuple dans le corps du verset.
  alternative: « Car ils formaient depuis l’origine une race maudite »
  rationale: Le contexte permet d’identifier le référent, mais le verset emploie σπέρμα sans nom propre. La traduction conserve donc la portée collective sans introduire une précision absente du texte.
- issue: Sens de la proposition introduite par οὐδὲ et portée de ἐφʼ οἷς ἥμαρταν
  choice: Comprendre que Dieu n’accordait pas l’impunité par égard pour une personne quelconque, les péchés étant l’objet ou le motif de cette impunité refusée.
  alternative: « et, sans craindre personne à cause des fautes qu’ils avaient commises, tu ne leur accordais aucune impunité »
  rationale: La syntaxe grecque est compacte et permet une certaine hésitation sur le rattachement de ἐφʼ οἷς ἥμαρταν. La formulation principale privilégie la lecture idiomatique où εὐλαβούμενος τινα signifie agir par crainte ou déférence envers quelqu’un, tout en signalant l’autre construction en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’adresse directe à Dieu et le ton judiciaire du passage. « Descendance » évite l’archaïsme d’une traduction littérale par « semence », tandis que « impunité » préserve la nuance d’exemption judiciaire de ἄδεια.
