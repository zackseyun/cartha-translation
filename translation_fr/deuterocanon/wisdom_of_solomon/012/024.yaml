base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/024.yaml
  text: For they wandered even farther in the ways of error[a], supposing as gods even the dishonored creatures among the animals of their enemies[b], having been deceived like foolish infants.
translation:
  language: fr
  text: Car ils se sont égarés encore plus loin sur les chemins de l’erreur[a], prenant pour des dieux même les êtres sans honneur parmi les animaux de leurs ennemis[b], trompés comme des enfants insensés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils ont été entraînés encore plus loin dans l’égarement ». Le grec peut mettre l’accent soit sur leur propre égarement, soit sur le fait qu’ils ont été égarés.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « prenant pour des dieux même les animaux sans honneur de leurs ennemis ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν πλάνης ὁδῶν
  choice: sur les chemins de l’erreur
  rationale: Cette expression conserve l’image grecque des chemins tout en rendant πλάνη par « erreur », terme naturel dans ce contexte d’égarement idolâtre.
- source_word: μακρότερον ἐπλανήθησαν
  choice: ils se sont égarés encore plus loin
  rationale: Le comparatif μακρότερον intensifie ἐπλανήθησαν. La formulation française maintient à la fois le mouvement figuré et le lien avec les « chemins ».
- source_word: θεοὺς ὑπολαμβάνοντες
  choice: prenant pour des dieux
  rationale: ὑπολαμβάνω exprime ici le fait de considérer ou de tenir quelque chose pour ce qu’il n’est pas. « Prendre pour » est clair et idiomatique.
- source_word: τὰ καὶ ἐν ζῴοις τῶν ἐχθρῶν ἄτιμα
  choice: même les êtres sans honneur parmi les animaux de leurs ennemis
  rationale: « Êtres » explicite sobrement le substantif implicite τὰ; « sans honneur » garde la valeur fondamentale de ἄτιμα sans renforcer arbitrairement en « répugnants » ou « méprisables ». La construction avec ἐν est préservée par « parmi ».
- source_word: νηπίων δίκην ἀφρόνων
  choice: comme des enfants insensés
  rationale: La tournure rend directement la comparaison exprimée par δίκην et conserve la réprimande portée par ἀφρόνων. « Enfants » est plus naturel ici que « nourrissons », sans effacer l’idée d’immaturité.
- source_word: ψευσθέντες
  choice: trompés
  rationale: Le participe passif exprime le fait d’avoir été trompés ou induits en erreur. La forme détachée reste naturelle en français et conserve la voix passive.
theological_decisions:
- issue: Évaluation morale de l’idolâtrie
  choice: Conserver les termes négatifs « erreur », « sans honneur », « trompés » et « insensés ».
  alternative: Employer des termes plus neutres tels que « méprise », « modestes » ou « confondus ».
  rationale: Le grec présente explicitement l’idolâtrie comme un égarement, une attribution indue d’honneur divin et une tromperie. Il convient de préserver cette critique sans l’accentuer au-delà du texte.
- issue: Agent de l’égarement et de la tromperie
  choice: Rendre ἐπλανήθησαν par la forme pronominale « se sont égarés », mais ψευσθέντες par le passif « trompés ».
  alternative: Traduire le premier verbe par « ont été entraînés plus loin dans l’égarement » ou faire des deux expressions un égarement volontaire.
  rationale: La forme grecque de ἐπλανήθησαν peut se comprendre comme un égarement ou comme le fait d’être égaré, tandis que ψευσθέντες marque clairement la tromperie subie. La note signale l’ambiguïté du premier verbe au lieu de la résoudre doctrinalement.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la métaphore du chemin et la vigueur critique du grec, tout en évitant une syntaxe excessivement calquée. Les deux notes rendent visibles les principales ambiguïtés syntaxiques et lexicales.
