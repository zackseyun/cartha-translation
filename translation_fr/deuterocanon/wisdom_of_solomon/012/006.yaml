  text: et tu as voulu faire périr, par la main de nos pères, des parents meurtriers d’êtres sans défense.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des parents, meurtriers d’âmes sans secours ». Le grec ψυχῶν peut désigner des « âmes », des « vies » ou, concrètement, des personnes.'
    reason: Alternative lexicale préservant l’ambiguïté de ψυχῶν et la nuance de αὐθέντας.
lexical_decisions:
- source_word: αὐθέντας
  choice: qui avaient tué
  rationale: Dans ce contexte de sacrifices d’enfants, le terme désigne les parents comme auteurs d’un homicide. Cette formulation française est claire sans imposer comme substantif une interprétation plus étroite.
- source_word: γονεῖς
  choice: parents
  rationale: Le nom grec est inclusif et désigne les pères et les mères.
- source_word: ψυχῶν
  choice: des êtres
  rationale: Ici, ψυχή désigne concrètement des êtres vivants victimes de la mise à mort, plutôt que l’âme conçue abstraitement.
- source_word: ἀβοηθήτων
  choice: sans défense
  rationale: L’adjectif décrit ceux qui sont privés d’aide ou de protecteur; « sans défense » restitue naturellement leur vulnérabilité.
- source_word: ἐβουλήθης
  choice: tu as voulu
  rationale: Le verbe exprime une volonté délibérée; cette traduction garde sa force sans surinterpréter la modalité.
- source_word: ἀπολέσαι
  choice: faire périr
  rationale: L’infinitif indique ici la destruction entraînant la mort; « faire périr » convient au registre judiciaire et narratif.
- source_word: διὰ χειρῶν πατέρων ἡμῶν
  choice: par la main de nos pères
  rationale: La formulation conserve l’image instrumentale grecque et le renvoi historique aux ancêtres d’Israël.
theological_decisions:
- issue: Référent de ψυχῶν ἀβοηθήτων
  choice: des êtres sans défense
  alternative: des âmes sans secours / des vies sans défense
  rationale: Le contexte vise les victimes vulnérables des sacrifices humains. « Êtres » évite d’introduire une conception particulière de l’âme tout en conservant la référence concrète aux personnes tuées.
- issue: Force de αὐθέντας
  choice: qui avaient tué
  alternative: meurtriers de
  rationale: Le contexte implique une mise à mort coupable, mais la tournure verbale reste naturelle et ne durcit pas inutilement le grec par un substantif juridique.
translation_notes:
  register: Français international moderne, digne et accessible. L’idiome « par la main de » est conservé pour sa force biblique; « nos pères » garde le lien explicite avec les ancêtres d’Israël.
