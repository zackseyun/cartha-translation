revisions:
- from: Car ta puissance est le principe[a] de la justice[b], et le fait que tu es maître de tous te fait tous épargner.
  to: Car ta puissance est la source[a] de la justice[b], et ta maîtrise sur tous te conduit à tous les épargner.
  rationale: La révision remplace le calque causal maladroit par une tournure française naturelle, sans atténuer le lien de conséquence. Elle rend ἀρχή par « source », plus transparent dans ce contexte, et conserve en note « principe » comme autre possibilité. La structure, la portée universelle et la répétition rhétorique du grec sont préservées.
