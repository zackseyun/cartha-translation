  verdict: revise
  source_fidelity: 'Le sens grec est globalement bien rendu : ἰσχύς est « puissance », δικαιοσύνη peut être « justice », et le parallélisme πάντων … πάντων est conservé. « Principe » est possible pour ἀρχή, mais « source » exprime plus clairement ici le rapport d’origine ou de fondement, sans introduire le sens institutionnel que « principe » peut avoir en français. L’infinitif δεσπόζειν est correctement compris comme une maîtrise universelle, et ποιεῖ marque bien la conséquence.'
  naturalness: La formulation « le fait que tu es maître de tous te fait tous épargner » est lourde et « te fait tous épargner » n’est pas idiomatique en français moderne. « Ta maîtrise sur tous te conduit à tous les épargner » est fluide, soutenu et maintient la répétition emphatique du grec.
  terminology: « Justice » est un choix français naturel et théologiquement non confessional pour δικαιοσύνη dans ce contexte. « Maîtrise » rend adéquatement δεσπόζειν sans recourir à « dominer », qui peut être inutilement péjoratif. « Épargner » est précis pour φείδεσθαι.
