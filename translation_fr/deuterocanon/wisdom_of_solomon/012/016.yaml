  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/016.yaml
  text: For your strength is the beginning of righteousness[b][a], and your mastery over all makes you spare all.
translation:
  language: fr
  text: Car ta puissance est la source[a] de la justice[b], et ta maîtrise sur tous te conduit à tous les épargner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le principe ». Le grec ἀρχή peut désigner le commencement, l’origine ou le principe premier.
    reason: lexical_alternative
  - marker: b
    text: Ou « droiture ». Le grec δικαιοσύνη peut exprimer à la fois la justice et la rectitude morale.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰσχύς
  choice: puissance
  rationale: Le nom désigne la force ou la capacité effective. « Puissance » convient au contexte de la souveraineté divine sans ajouter l’idée d’une violence exercée.
- source_word: ἀρχή
  choice: principe
  rationale: Le terme peut désigner le commencement, l’origine ou le principe premier. « Principe » conserve cette amplitude dans une formulation française naturelle.
- source_word: δικαιοσύνης
  choice: justice
  rationale: Dans ce contexte, δικαιοσύνη évoque la rectitude morale de Dieu et la juste manière dont il exerce sa puissance. « Justice » est le rendu français le plus direct, tandis que « droiture » reste possible.
- source_word: δεσπόζειν
  choice: le fait que tu es maître de tous
  rationale: Cette formulation rend l’infinitif substantivé et exprime une autorité souveraine réelle, sans les connotations abusives que pourrait prendre « dominer » en français contemporain.
- source_word: φείδεσθαι
  choice: épargner
  rationale: Le verbe signifie s’abstenir de détruire ou de faire du mal. « Épargner » en rend précisément la retenue.
- source_word: ποιεῖ
  choice: te fait … épargner
  rationale: Le verbe exprime ici un rapport de cause ou de résultat entre la souveraineté universelle de Dieu et sa retenue.
- source_word: πάντων … πάντων
  choice: de tous … tous
  rationale: La répétition du grec est maintenue afin de préserver le parallélisme et l’universalité de l’affirmation, sans restreindre explicitement la référence à un groupe particulier.
theological_decisions:
- issue: Sens de δικαιοσύνη dans l’affirmation sur le caractère et le gouvernement de Dieu
  choice: justice
  alternative: droiture
  rationale: « Justice » exprime naturellement en français la conformité morale et l’action juste de Dieu. La variante « droiture » est signalée pour préserver l’étendue sémantique du grec sans imposer une lecture doctrinale particulière.
- issue: Rapport entre la souveraineté universelle de Dieu et le fait d’épargner
  choice: 'Lien causal explicite : « te fait tous épargner »'
  alternative: « t’amène à tous les épargner »
  rationale: 'Le grec ποιεῖ présente la maîtrise universelle de Dieu comme la cause de sa retenue. Le rendu retenu conserve cette tension : sa puissance ne mène pas à la destruction arbitraire, mais au fait d’épargner.'
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La répétition « tous … tous », légèrement marquée en français, est conservée parce qu’elle reproduit l’insistance rhétorique du grec.
