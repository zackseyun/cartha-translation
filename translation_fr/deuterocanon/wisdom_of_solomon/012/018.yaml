  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/018.yaml
  text: But you[a], being master of strength, judge with gentleness, and with great forbearance you govern us[b]; for the power is yours whenever you will.
translation:
  language: fr
  text: Mais toi, qui es maître de la force, tu juges avec douceur[a] et tu nous gouvernes avec beaucoup de ménagement[b] ; car tu as la capacité d’agir quand tu le veux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec clémence » ; le grec peut aussi évoquer une équité indulgente.
    reason: lexical_alternative
  - marker: b
    text: Le terme grec désigne le fait d’épargner ou d’agir avec retenue.
    reason: lexical_clarification
  - marker: c
    text: 'Littéralement : « car le fait de pouvoir t’est présent quand tu le veux », c’est-à-dire que la capacité d’agir est toujours à ta disposition.'
    reason: source_idiom
lexical_decisions:
- source_word: δεσπόζων ἰσχύος
  choice: qui es maître de la force
  rationale: Le participe exprime la maîtrise ou la souveraineté, et le génitif en précise l’objet. Cette formulation reste proche du grec tout en distinguant ἰσχύς, « force », de l’idée de capacité exprimée plus loin par τὸ δύνασθαι.
- source_word: ἐν ἐπιεικείᾳ
  choice: avec douceur
  rationale: ἐπιείκεια peut évoquer la douceur, la clémence ou une équité indulgente. « Avec douceur » est naturel et maintient le contraste entre la force divine et la mesure de son jugement.
- source_word: κρίνεις
  choice: tu juges
  rationale: Le verbe garde ici son sens judiciaire ordinaire, sans qu’il soit nécessaire de l’élargir à « gouverner ».
- source_word: μετὰ πολλῆς φειδοῦς
  choice: avec beaucoup de ménagement
  rationale: φειδώ désigne le fait d’épargner, la retenue ou le ménagement. Cette traduction exprime une action mesurée sans transformer le terme en « miséricorde ».
- source_word: διοικεῖς ἡμᾶς
  choice: tu nous gouvernes
  rationale: διοικέω concerne la conduite ou l’administration des affaires, et ἡμᾶς désigne explicitement « nous ». La formulation conserve donc à la fois le gouvernement divin et l’inclusion du locuteur.
- source_word: πάρεστιν γάρ σοι ὅταν θέλῃς τὸ δύνασθαι
  choice: car tu as la capacité d’agir quand tu le veux
  rationale: L’expression grecque dit littéralement que « le pouvoir être capable » est présent ou disponible pour Dieu. Le français explicite idiomatiquement cette capacité effective tout en la reliant à sa volonté.
theological_decisions:
- issue: La force divine associée à un jugement empreint de douceur
  choice: Conserver la juxtaposition entre la maîtrise de la force et l’exercice mesuré du jugement et du gouvernement.
  alternative: Accentuer uniquement la souveraineté par un vocabulaire plus dur, ou rendre φειδώ par « miséricorde ».
  rationale: Le grec maintient ensemble la pleine capacité de Dieu et la retenue avec laquelle il agit. La traduction ne présente ni la douceur comme une faiblesse ni le ménagement comme un terme doctrinal plus précis que le texte.
- issue: L’objet explicite ἡμᾶς
  choice: Traduire littéralement par « nous ».
  alternative: Généraliser en « toutes choses » ou ne pas exprimer d’objet.
  rationale: Le texte source inclut explicitement le locuteur et sa communauté ; cette perspective doit être préservée.
- issue: La capacité divine soumise à sa volonté
  choice: Rendre la proposition comme une capacité d’agir disponible quand Dieu le veut.
  alternative: Interpréter la phrase comme une affirmation abstraite de toute-puissance ou comme l’obligation d’agir.
  rationale: La construction souligne la disponibilité constante de la capacité et sa relation à la volonté divine, sans développer une formulation dogmatique absente du verset.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe au singulier. « Maître de la force » conserve la densité du grec, tandis que « capacité d’agir » rend naturellement l’infinitif substantivé sans confondre les deux termes grecs relatifs à la force et à la capacité.
