base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/022.yaml
  text: So, while disciplining us, you scourge our enemies by the ten thousands, so that when we judge we may reflect on your goodness, and when we are judged we may expect mercy.
translation:
  language: fr
  text: Ainsi, tout en nous corrigeant, tu frappes nos ennemis d’innombrables coups de fouet[a], afin que nous pensions à ta bonté lorsque nous jugeons et que, lorsque nous sommes jugés, nous espérions la miséricorde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, l’expression grecque évoque des coups « par myriades », c’est-à-dire en nombre immense ou avec une extrême sévérité.
    reason: alternative lexicale et conservation de l’image grecque
lexical_decisions:
- source_word: παιδεύων
  choice: tout en nous corrigeant
  rationale: Le verbe exprime une discipline à visée éducative et corrective, et non un simple châtiment. « Corriger » conserve cette nuance en français courant.
- source_word: ἐν μυριότητι μαστιγοῖς
  choice: tu frappes […] d’innombrables coups de fouet
  rationale: La tournure souligne la quantité immense ou l’extrême sévérité des coups. Cette formulation française rend naturellement l’image concrète sans imposer le nombre littéral de dix mille.
- source_word: μεριμνῶμεν
  choice: nous pensions à
  rationale: Dans ce contexte, le verbe désigne l’attention réfléchie portée à la bonté divine. « Penser à » est naturel et n’introduit pas l’idée trompeuse d’anxiété.
- source_word: ἀγαθότητα
  choice: bonté
  rationale: Le terme peut désigner à la fois la qualité morale et la bienveillance; « bonté » préserve cette amplitude.
- source_word: κρίνοντες / κρινόμενοι
  choice: lorsque nous jugeons / lorsque nous sommes jugés
  rationale: Les deux participes sont rendus de façon temporelle et parallèle, tout en maintenant nettement le contraste entre l’actif et le passif.
- source_word: προσδοκῶμεν ἔλεος
  choice: nous espérions la miséricorde
  rationale: προσδοκάω exprime l’attente confiante. « Espérer » convient au français moderne, tandis que « miséricorde » rend le poids théologique de ἔλεος.
theological_decisions:
- issue: Rapport entre la correction de « nous » et le châtiment de « nos ennemis »
  choice: Dieu corrige son peuple, tandis qu’il frappe sévèrement ses ennemis.
  alternative: Comprendre les coups innombrables comme dirigés contre « nous ».
  rationale: La syntaxe grecque rattache le plus naturellement ἡμᾶς à παιδεύων et τοὺς ἐχθροὺς ἡμῶν à μαστιγοῖς, ce qui maintient le contraste rhétorique sans l’amplifier.
- issue: Portée de μεριμνῶμεν devant « ta bonté »
  choice: Une attention réfléchie à la bonté de Dieu doit orienter le jugement humain.
  alternative: Insister sur le souci ou la préoccupation envers la bonté divine.
  rationale: Une traduction évoquant l’inquiétude serait trompeuse en français; « pensions à » préserve l’idée d’une considération attentive.
- issue: Nature de l’attente exprimée par προσδοκῶμεν ἔλεος
  choice: Espérer la miséricorde sans préciser davantage son degré de certitude.
  alternative: Attendre la miséricorde comme une certitude acquise.
  rationale: Le grec exprime une attente orientée vers la miséricorde, mais ne tranche pas ici toutes les questions relatives à son assurance.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier suit l’adresse directe à Dieu. Le parallélisme « lorsque nous jugeons / lorsque nous sommes jugés » est conservé.
