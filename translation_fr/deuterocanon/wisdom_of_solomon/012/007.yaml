translation:
  language: fr
  text: afin que la terre la plus précieuse de toutes à tes yeux[b] reçoive une digne colonie[a] d’enfants de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un digne établissement ». Le grec ἀποικία peut désigner une colonie ou une population établie dans un territoire.
