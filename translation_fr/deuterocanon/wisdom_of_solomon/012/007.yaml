lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Introduit le but visé et conserve naturellement la valeur finale de la proposition grecque.
- source_word: ἀξίαν
  choice: digne
  rationale: Exprime la qualité ou la convenance de la colonie sans préciser abusivement de quoi elle est digne.
- source_word: ἀποικίαν
  choice: colonie
  rationale: Conserve le sens concret d’une population établie dans un territoire; une note signale une formulation française moins marquée.
- source_word: δέξηται
  choice: accueille
  rationale: Rend le subjonctif aoriste régi par ἵνα dans une proposition finale; «accueille» exprime ici le fait de recevoir sans développer davantage l’idée.
- source_word: θεοῦ παίδων
  choice: d’enfants de Dieu
  rationale: Préserve le rapport génitif et le sens familial de παῖς sans introduire une référence exclusivement masculine.
- source_word: ἡ ... γῆ
  choice: la terre
  rationale: Désigne ici le territoire particulier destiné au peuple de Dieu, et non l’ensemble du monde.
- source_word: ἡ παρὰ σοὶ πασῶν τιμιωτάτη
  choice: la plus précieuse de toutes à tes yeux
  rationale: Rend le superlatif τιμιωτάτη et présente παρὰ σοὶ comme l’évaluation portée par Dieu.
theological_decisions:
- issue: Traduction de θεοῦ παίδων
  choice: d’enfants de Dieu
  alternative: de fils de Dieu
  rationale: παῖς peut désigner des enfants sans imposer un sens exclusivement masculin; le contexte présente le peuple établi dans le pays comme appartenant à Dieu dans une relation filiale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. «Colonie» garde l’image concrète du grec malgré ses connotations modernes; la note offre une solution moins marquée. Le tutoiement correspond à l’adresse directe à Dieu dans le contexte.
