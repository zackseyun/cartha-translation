    text: 'Littéralement : « celui qui ne doit pas être puni » ; ou : « celui qui n’est pas passible de punition ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « incompatible avec ta puissance » ou « qui n’appartient pas à ta puissance ».'
    reason: lexical_alternative
  revision_rationale: La révision rend explicite que « le fait de condamner » est ce qui est qualifié d’« étranger à ta puissance », conformément à la syntaxe grecque. Elle remplace aussi la causale plus marquée « puisque » par le participe « étant », plus proche de ὢν. Les deux notes conservent les alternatives lexicales importantes relatives à la responsabilité à la peine et à ἀλλότριον.
