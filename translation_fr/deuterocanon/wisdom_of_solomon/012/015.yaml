base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/015.yaml
  text: But being righteous[a], you govern all things righteously[b], considering it foreign to your power to condemn one who does not deserve to be punished.
translation:
  language: fr
  text: Mais, étant juste, tu gouvernes toutes choses avec justice, considérant comme étranger à ta puissance[b] le fait de condamner celui qui ne mérite pas d’être puni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « celui qui ne doit pas être puni » ; ou : « celui qui n’est pas passible de punition ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « incompatible avec ta puissance » ou « qui n’appartient pas à ta puissance ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιος ... δικαίως
  choice: juste ... avec justice
  rationale: Cette formulation naturelle en français conserve le lien étymologique et rhétorique entre l’adjectif et l’adverbe grecs.
- source_word: τὰ πάντα
  choice: toutes choses
  rationale: Expression globale qui préserve l’ampleur du grec sans lui imposer un sens exclusivement cosmologique.
- source_word: διέπεις
  choice: tu gouvernes
  rationale: Exprime la conduite ordonnée et souveraine de toutes choses.
- source_word: αὐτὸν τὸν μὴ ὀφείλοντα κολασθῆναι
  choice: celui qui ne mérite pas d’être puni
  rationale: Rend idiomatiquement l’idée grecque d’une personne qui n’est pas tenue ou passible d’être punie, tout en signalant le sens plus littéral en note.
- source_word: καταδικάσαι
  choice: condamner
  rationale: Conserve la portée judiciaire et morale du verbe grec.
- source_word: ἀλλότριον
  choice: étranger à
  rationale: Préserve la métaphore grecque de ce qui n’appartient pas en propre à la puissance divine, sans la résoudre en une simple indignité.
- source_word: ἡγούμενος
  choice: estimant
  rationale: Traduit le jugement évaluatif exprimé par le participe grec.
- source_word: τῆς σῆς δυνάμεως
  choice: à ta puissance
  rationale: « Puissance » garde le sens large de δύναμις sans le réduire à la seule autorité juridique.
theological_decisions:
- issue: Rapport entre la puissance divine et la justice
  choice: Condamner celui qui n’est pas passible de punition est présenté comme étranger à la puissance de Dieu.
  alternative: Comprendre l’expression seulement comme « indigne de ta puissance » ou réduire « puissance » au sens d’« autorité » juridique.
  rationale: Le grec relie directement la justice de Dieu, son gouvernement juste et son refus de condamner celui qui ne doit pas être puni. La formulation conserve ce lien et sa tension théologique sans l’expliciter au moyen d’une doctrine ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. Le tour « juste ... avec justice » conserve la répétition voulue du grec. « Étranger à ta puissance » maintient l’image originale, légèrement soutenue mais intelligible.
