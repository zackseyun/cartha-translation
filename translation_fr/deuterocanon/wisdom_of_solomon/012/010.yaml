base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/010.yaml
  text: But in judging them little by little[a], you were giving room for repentance, not being unaware that their origin was evil and their wickedness innate, and that their way of thinking would never change forever[b],
translation:
  language: fr
  text: Mais, en les jugeant peu à peu, tu leur donnais l’occasion de se repentir[a], sans ignorer que leur origine[b] était mauvaise, que leur méchanceté était innée et que leur manière de penser ne changerait jamais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu donnais une place au repentir » ; on peut aussi comprendre : « tu leur laissais le temps de se repentir ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « leur naissance » ou « leur lignée ». Le grec γένεσις peut désigner l’origine, la naissance ou la lignée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνων δὲ κατὰ βραχύ
  choice: Mais, en les jugeant peu à peu
  rationale: Le participe présent conserve le lien circonstanciel avec l’action principale, tandis que « peu à peu » rend la progression exprimée par κατὰ βραχύ sans préciser davantage sa nuance temporelle.
- source_word: ἐδίδους τόπον μετανοίας
  choice: tu leur donnais l’occasion de se repentir
  rationale: L’expression grecque signifie littéralement « donner une place au repentir ». En français courant, « donner l’occasion de se repentir » en restitue clairement le sens tout en maintenant l’idée d’une possibilité réellement offerte.
- source_word: οὐκ ἀγνοῶν
  choice: sans ignorer
  rationale: Cette formulation suit la négation grecque et exprime la pleine connaissance de Dieu sans l’amplifier par une paraphrase.
- source_word: πονηρὰ ἦ γένεσις αὐτῶν
  choice: leur origine était mauvaise
  rationale: γένεσις peut désigner l’origine, la naissance ou la lignée. « Origine » conserve cette amplitude mieux qu’une formulation explicitement biologique.
- source_word: ἔμφυτος ἡ κακία αὐτῶν
  choice: leur méchanceté était innée
  rationale: ἔμφυτος signifie ce qui est implanté dans la nature ou présent dès la naissance. « Innée » rend avec concision la force de l’affirmation.
- source_word: ὁ λογισμὸς αὐτῶν
  choice: leur manière de penser
  rationale: λογισμός peut désigner la pensée, le raisonnement ou la disposition mentale. Ici, « manière de penser » exprime naturellement une orientation durable de l’esprit.
- source_word: οὐ μὴ ἀλλαγῇ ... εἰς τὸν αἰῶνα
  choice: ne changerait jamais
  rationale: La négation emphatique οὐ μή, renforcée par εἰς τὸν αἰῶνα, indique qu’aucun changement n’aurait lieu. « Jamais » en exprime naturellement la portée durable en français.
theological_decisions:
- issue: La portée de l’affirmation sur le mal inné et l’impossibilité d’un changement
  choice: Conserver la forte affirmation du texte au sujet d’une méchanceté innée et d’une manière de penser qui ne changerait jamais.
  alternative: Atténuer en parlant d’une simple inclination au mal, ou renforcer en affirmant explicitement une incapacité métaphysique à se repentir.
  rationale: Le grec juxtapose l’occasion de se repentir et la connaissance que leur disposition ne changerait jamais. La traduction préserve cette tension sans introduire une doctrine ultérieure sur la culpabilité héréditaire ou sur la nécessité métaphysique.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe à Dieu dans le contexte. La syntaxe conserve l’enchaînement serré du grec tout en évitant une tournure artificiellement littérale.
