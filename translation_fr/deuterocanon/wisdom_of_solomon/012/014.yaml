  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/014.yaml
  text: Neither king nor tyrant will be able to look you in the face concerning those whom you punished[a].
translation:
  language: fr
  text: Ni roi ni tyran ne pourra te faire face[a] au sujet de ceux que tu as punis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se tenir devant toi » ou « soutenir ton regard » ; le verbe grec évoque vivement une confrontation directe, face à face.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε … ἢ
  choice: Ni … ni
  rationale: Cette tournure corrélative exprime naturellement en français l’exclusion des deux catégories de dirigeants.
- source_word: βασιλεὺς
  choice: roi
  rationale: Le titre politique ordinaire est conservé sans le généraliser en « dirigeant ».
- source_word: τύραννος
  choice: tyran
  rationale: Ce terme préserve le contraste avec « roi » et désigne un souverain au pouvoir absolu ou oppressif.
- source_word: ἀντοφθαλμῆσαι σοι
  choice: te regarder en face
  rationale: Le verbe rare évoque une confrontation directe, face à face, tout en gardant l’image concrète du grec.
- source_word: δυνήσεταί
  choice: ne pourra
  rationale: Le futur de δύναμαι exprime ici l’incapacité future de tout souverain à affronter Dieu.
- source_word: περὶ ὧν
  choice: au sujet de ceux que
  rationale: Le relatif peut formellement renvoyer à des personnes ou à des choses; le contexte du châtiment favorise ici les personnes punies.
- source_word: ἐκόλασας
  choice: tu as punis
  rationale: Le verbe désigne ici un châtiment judiciaire plutôt qu’une simple correction éducative.
theological_decisions:
- issue: Portée de l’image de la confrontation avec Dieu
  choice: Aucun souverain terrestre ne pourra regarder Dieu en face au sujet de ses châtiments.
  alternative: Aucun souverain ne pourra demander des comptes à Dieu ni s’opposer à son jugement.
  rationale: La traduction conserve l’image du face-à-face sans expliciter entièrement ses implications judiciaires ou adversatives.
translation_notes:
  register: Français moderne, clair et digne. La structure brève et solennelle garde le contraste entre le roi légitime et le tyran, ainsi que l’image concrète de la confrontation avec Dieu.
