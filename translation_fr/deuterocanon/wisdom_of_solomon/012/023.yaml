base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/023.yaml
  text: Therefore you also tormented[a], through their own abominations, those unrighteous men who had lived in the folly of life.
translation:
  language: fr
  text: C’est pourquoi tu as aussi tourmenté[a], au moyen de leurs propres abominations, ces injustes qui avaient vécu dans la folie de leur vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « affligé ». Le verbe grec peut désigner un tourment ou une souffrance sévère.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν καὶ
  choice: C’est pourquoi… aussi
  rationale: Exprime à la fois la conséquence introduite par ὅθεν et la continuité marquée par καί.
- source_word: τοὺς ... ἀδίκους
  choice: ces êtres injustes
  rationale: L’adjectif substantivé désigne des personnes caractérisées par l’injustice; « êtres » évite d’introduire un genre absent du grec.
- source_word: ἐν ἀφροσύνῃ ζωῆς βιώσαντας
  choice: qui avaient vécu dans la folie de leur existence
  rationale: Conserve le lien étymologique entre ζωή et βιόω tout en rendant l’expression compacte du grec dans un français intelligible et digne.
- source_word: διὰ τῶν ἰδίων ... βδελυγμάτων
  choice: au moyen de leurs propres abominations
  rationale: διά avec le génitif marque ici naturellement le moyen; « abominations » conserve l’ampleur référentielle de βδελύγματα sans préciser s’il s’agit d’actes, d’objets ou de pratiques idolâtres.
- source_word: ἐβασάνισας
  choice: tu as tourmenté
  rationale: Le verbe exprime une souffrance ou une affliction sévère dans ce contexte de jugement; « tourmenté » en préserve l’intensité.
theological_decisions:
- issue: Nature de la rétribution divine exprimée par διὰ τῶν ἰδίων βδελυγμάτων
  choice: Dieu les tourmente au moyen de leurs propres abominations.
  alternative: Dieu les punit à cause de leurs abominations, ou par les créatures et objets liés à celles-ci.
  rationale: Le grec exprime plus naturellement l’instrument que la simple cause, mais le verset ne précise pas le mécanisme exact; la formulation conserve cette tension.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le tutoiement divin suit l’adresse grecque au singulier. La formulation préserve l’instrumentalité de διά et l’ambiguïté concrète de βδελύγματα.
