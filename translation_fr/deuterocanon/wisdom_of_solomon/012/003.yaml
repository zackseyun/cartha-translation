lexical_decisions:
- source_word: καὶ γὰρ
  choice: Car même
  rationale: « Car » conserve la valeur explicative de γάρ, tandis que « même » rend l’emphase ajoutée par καί dans un français naturel.
- source_word: τοὺς παλαιοὺς
  choice: les anciens
  rationale: Dans ce contexte, παλαιούς désigne ceux qui habitaient le pays autrefois; « anciens » préserve cette valeur historique sans paraphrase excessive.
- source_word: οἰκήτορας
  choice: habitants
  rationale: Le nom désigne ceux qui résident dans un lieu. « Habitants » est courant, précis et n’ajoute pas l’idée d’une installation récente que pourrait suggérer « colons ».
- source_word: τῆς ἁγίας σου γῆς
  choice: de ta terre sainte
  rationale: γῆ renvoie ici à un territoire déterminé plutôt qu’au monde entier. « Terre sainte » rend directement ἁγίας…γῆ et conserve l’adresse à Dieu exprimée par σου.
theological_decisions:
- issue: Portée géographique de γῆ
  choice: terre
  alternative: monde
  rationale: Le contexte vise le territoire particulier appartenant à Dieu dans le récit d’Israël, non l’ensemble du monde. « Terre » conserve en français la portée territoriale et biblique du terme sans ajouter d’interprétation confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La virgule finale est maintenue parce que le verset forme le début d’une phrase qui se poursuit au verset suivant.
