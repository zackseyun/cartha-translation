base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/001.yaml
  text: For your imperishable Spirit is in all things[a].
translation:
  language: fr
  text: Car ton esprit impérissable est en toutes choses[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en tous » ; le grec peut être rendu plus brièvement, mais « en toutes choses » explicite son sens neutre pluriel probable.
    reason: alternative lexicale
lexical_decisions:
- source_word: γὰρ
  choice: Car
  rationale: La conjonction introduit la raison de l’affirmation précédente et conserve naturellement le lien argumentatif.
- source_word: ἄφθαρτόν
  choice: impérissable
  rationale: L’adjectif désigne ce qui n’est pas sujet à la corruption ou à la disparition. « Impérissable » est actuel, clair et fidèle au sens ontologique.
- source_word: πνεῦμά
  choice: esprit
  rationale: Avec le possessif « ton », le terme désigne ici l’esprit divin présent dans la création. La minuscule évite d’imposer au grec une précision doctrinale postérieure tout en conservant la référence à Dieu.
- source_word: ἐν πᾶσιν
  choice: en toutes choses
  rationale: Cette formulation rend explicitement la valeur probablement neutre du pluriel et exprime une portée universelle à travers la création, sans la restreindre aux personnes.
theological_decisions:
- issue: Référence et graphie de πνεῦμά σου
  choice: ton esprit
  alternative: ton Esprit
  rationale: Le contexte indique l’esprit impérissable de Dieu, mais le grec ne distingue pas les majuscules de la manière des éditions modernes. La minuscule préserve l’ambiguïté entre une désignation plus personnelle et l’esprit divin comme présence vivifiante, sans nier la référence divine.
- issue: Portée de ἐν πᾶσιν
  choice: en toutes choses
  alternative: en tous
  rationale: Le neutre pluriel est vraisemblable et le contexte porte sur l’ensemble de la création. « En tous » resterait plus concis, mais pourrait être compris comme visant seulement les êtres humains.
translation_notes:
  register: Français international moderne, simple et digne. L’ordre des mots reste naturel tout en conservant le lien causal, l’attribut « impérissable » et l’affirmation de la présence universelle de l’esprit de Dieu.
