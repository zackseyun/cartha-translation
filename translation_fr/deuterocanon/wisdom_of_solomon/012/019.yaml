base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/019.yaml
  text: But by such deeds you taught your people that the righteous must be humane[a], and you made your children full of good hope[b], because you grant repentance for sins.
translation:
  language: fr
  text: Mais, par de tels actes, tu as enseigné à ton peuple que le juste doit se montrer bienveillant envers autrui[a], et tu as rendu tes fils pleins d’espérance[b], car tu accordes le repentir après les péchés[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « doit faire preuve de bonté envers les humains ».'
    reason: lexical_alternative
  - marker: b
    text: « Tes fils » peut désigner collectivement les membres du peuple de Dieu.
    reason: semantic_scope
  - marker: c
    text: 'Ou : « tu donnes la possibilité de se repentir après les péchés ».'
    reason: interpretive_alternative
lexical_decisions:
- source_word: διὰ τῶν τοιούτων ἔργων
  choice: par de tels actes
  rationale: διά avec le génitif exprime ici le moyen. « Actes » désigne naturellement les actions de Dieu évoquées dans le contexte et évite la connotation doctrinale possible de « œuvres ».
- source_word: τὸν δίκαιον
  choice: le juste
  rationale: Le substantif masculin singulier a une portée représentative. « Le juste » conserve sa forme et reste idiomatique en français.
- source_word: φιλάνθρωπον
  choice: faire preuve de bonté envers les humains
  rationale: φιλάνθρωπος exprime la bienveillance à l’égard des êtres humains. Cette formulation est claire en français moderne sans réduire le terme à la seule miséricorde.
- source_word: εὐέλπιδας
  choice: rempli d’une belle espérance
  rationale: L’adjectif indique une disposition confiante et positive. « Une belle espérance » rend la force favorable du mot plus naturellement que le calque « bonne espérance ».
- source_word: τοὺς υἱούς σου
  choice: tes fils
  rationale: Le grec dit explicitement « tes fils ». La traduction conserve cette forme, tout en signalant en note sa possible portée collective.
- source_word: διδοῖς ἐπὶ ἁμαρτήμασιν μετάνοιαν
  choice: tu accordes le repentir pour les péchés
  rationale: La formulation préserve l’initiative divine exprimée par διδοῖς sans préciser au-delà du grec s’il s’agit de produire, permettre ou offrir la possibilité du repentir.
theological_decisions:
- issue: Portée du masculin dans « le juste » et « tes fils »
  choice: Conserver les formes masculines du grec dans le texte principal
  alternative: « la personne juste » et « tes enfants »
  rationale: Les formes grecques sont masculines et peuvent avoir une portée représentative. Les conserver respecte la forme rhétorique de la source, tandis que les notes indiquent les nuances pertinentes.
- issue: Action divine et μετάνοια
  choice: « tu accordes le repentir »
  alternative: « tu donnes la possibilité de te repentir » ou « tu permets le repentir »
  rationale: Le grec attribue à Dieu le don du repentir, mais ne définit pas ici précisément le mode de cette action. La traduction maintient cette tension sans imposer une formulation doctrinale plus étroite.
translation_notes:
  register: Français international moderne, digne et accessible. Tutoiement de Dieu cohérent avec le singulier grec. La phrase conserve le mouvement causal du texte et ses formes représentatives sans lourdeur excessive.
