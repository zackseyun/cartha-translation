base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/009.yaml
  text: not because you were unable[a], in battle, to give the ungodly into subjection, or to wipe them out at once by savage beasts or by a sharp word[b];
translation:
  language: fr
  text: Ce n’est pas que tu aies été incapable de soumettre les impies dans la bataille, ou de les anéantir d’un seul coup[a] par des bêtes féroces ou par une parole tranchante[b] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous à la fois ». L’expression grecque souligne une destruction accomplie en une seule action.
    reason: lexical_alternative
  - marker: b
    text: Ou « par une parole sévère », voire « par un ordre implacable ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἀδυνατῶν
  choice: Ce n’est pas que tu aies été incapable
  rationale: 'La tournure française explicite la valeur circonstancielle du participe : la manière progressive de juger ne venait pas d’un manque de puissance de Dieu.'
- source_word: ἐν παρατάξει
  choice: dans la bataille
  rationale: Le terme évoque la mise en ordre de combat ou l’affrontement militaire ; cette formulation moderne conserve ce sens sans lourdeur.
- source_word: ἀσεβεῖς
  choice: les impies
  rationale: « Impies » garde la dimension d’irrévérence envers Dieu propre à ἀσεβεῖς, plutôt que de réduire le terme à une méchanceté générale.
- source_word: ὑποχειρίους δοῦναι
  choice: soumettre
  rationale: L’expression signifie placer sous sa main, sous son pouvoir. « Soumettre » restitue naturellement en français le résultat de cette domination.
- source_word: θηρίοις δεινοῖς
  choice: par des bêtes féroces
  rationale: Cette expression rend à la fois les animaux sauvages désignés par θηρίοις et leur caractère redoutable exprimé par δεινοῖς.
- source_word: λόγῳ ἀποτόμῳ
  choice: par une parole tranchante
  rationale: « Tranchante » préserve l’image de ἀποτόμῳ tout en exprimant la force sévère et décisive de la parole divine.
- source_word: ὑφʼ ἓν
  choice: d’un seul coup
  rationale: L’idiome indique une destruction accomplie en une seule action, tous ensemble, plutôt qu’un processus graduel.
- source_word: ἐκτρῖψαι
  choice: anéantir
  rationale: Le verbe dénote une destruction totale, littéralement l’idée d’effacer par frottement ; « anéantir » en conserve la force dans un registre digne.
theological_decisions:
- issue: Sujet implicite et valeur du participe décrivant la retenue divine
  choice: 'Adresse directe à Dieu : « Ce n’est pas que tu aies été incapable »'
  alternative: 'Traduction plus formelle : « sans être incapable » ou « n’étant pas impuissant »'
  rationale: Le contexte s’adresse directement à Dieu et oppose sa toute-puissance à l’exercice mesuré de son jugement. La formulation retenue rend explicite la relation logique sans faire de la patience divine la conséquence d’une incapacité.
- issue: Portée de λόγῳ ἀποτόμῳ
  choice: Conserver la métaphore avec « une parole tranchante »
  alternative: 'Interpréter fonctionnellement : « un ordre sévère » ou « une sentence implacable »'
  rationale: Le grec peut évoquer une parole incisive, sévère ou un commandement décisif. La traduction maintient cette ambiguïté imagée plutôt que de préciser sans nécessité la nature de l’énoncé divin.
translation_notes:
  register: Français international moderne, clair et digne. La phrase demeure syntaxiquement liée au contexte par le point-virgule final. « Impies » conserve la portée religieuse du grec, tandis que « parole tranchante » en maintient l’image et l’ambiguïté.
