  rationale: 'La révision corrige le verbe principal : le contexte immédiat et la fonction argumentative de la phrase exigent « tu as puni ». Elle maintient le rendu contextuel « indulgence » pour δέησις, qui s’accorde à la modération du jugement, tout en préservant en note son sens lexical littéral. La syntaxe ouverte et l’ambiguïté quant à l’agent de la délivrance sont conservées.'
