base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/020.yaml
  text: For if you honored with such great care and forbearance the enemies of your children[a], even those deserving death, giving them time and opportunity by which they might be freed from wickedness,
translation:
  language: fr
  text: Car si tu as puni avec tant d’attention et d’indulgence[a] les ennemis de tes enfants, qui méritaient la mort, en leur donnant du temps et l’occasion d’être délivrés de leur méchanceté,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec tant d’attention et de supplication » ; les termes grecs désignent littéralement l’attention ou le soin, et la demande instante ou la supplication.
    reason: δέησις signifie littéralement « demande instante » ou « supplication » ; « indulgence » en donne ici le sens contextuel de retenue dans l’exercice du jugement.
lexical_decisions:
- source_word: ἐχθροὺς παίδων σου
  choice: les ennemis de tes enfants
  rationale: « Ennemis » rend naturellement ἐχθρούς. Le terme παῖς peut désigner un enfant, un fils ou un serviteur ; « enfants » conserve ici la relation familiale avec Dieu sans préciser indûment le genre.
- source_word: ὀφειλομένους θανάτῳ
  choice: eux qui méritaient la mort
  rationale: La tournure grecque exprime une dette ou une responsabilité envers la mort. « Méritaient la mort » en restitue clairement la portée judiciaire.
- source_word: ἐτίμησας
  choice: tu as traité avec tant d’égards
  rationale: Le verbe signifie ordinairement honorer ou estimer. En français, « traiter avec égards » en conserve la valeur tout en convenant mieux au traitement mesuré d’ennemis condamnables.
- source_word: μετὰ τοσαύτης προσοχῆς καὶ δεήσεως
  choice: avec tant d’égards et d’indulgence
  rationale: προσοχή évoque l’attention ou le soin ; δέησις signifie littéralement demande ou supplication. Dans ce contexte de jugement différé, « indulgence » exprime naturellement la retenue miséricordieuse, tandis que le sens littéral est signalé en note.
- source_word: δοὺς χρόνους καὶ τόπον
  choice: en leur donnant du temps et l’occasion
  rationale: χρόνοι désigne le temps accordé et τόπος, littéralement « lieu », prend ici le sens idiomatique de marge ou d’occasion.
- source_word: ἀπαλλαγῶσι τῆς κακίας
  choice: d’être délivrés de leur méchanceté
  rationale: La formulation conserve la nuance de délivrance exprimée par ἀπαλλάσσω et rend κακία par « méchanceté », au sens de mal moral.
theological_decisions:
- issue: Sens de δέησις dans la description de la conduite de Dieu envers les méchants
  choice: « indulgence » dans le texte principal
  alternative: « supplication », « prière » ou « demande instante »
  rationale: Le sens lexical littéral est celui d’une supplication, mais appliqué à Dieu dans ce contexte, il pourrait suggérer de manière trop explicite que Dieu implore les condamnés. « Indulgence » maintient l’accent contextuel sur la retenue et le délai accordé, sans effacer l’autre possibilité, conservée en note.
- issue: Valeur de ἐτίμησας appliqué aux ennemis
  choice: « tu as traité avec tant d’égards »
  alternative: « tu as honoré » ou, selon une lecture contextuelle plus judiciaire, « tu as puni »
  rationale: La traduction retient le sens usuel d’honneur ou d’estime sans produire en français l’affirmation abrupte que Dieu les aurait « honorés ». Elle évite aussi d’introduire directement « puni », sens contextuellement possible mais moins transparent dans la forme grecque fournie.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste ouverte par une virgule, conformément à la structure du verset grec, qui se poursuit au verset suivant. « Traité avec tant d’égards » évite le calque peu naturel « honoré les ennemis » tout en préservant la valeur de ἐτίμησας.
