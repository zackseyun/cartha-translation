revisions:
- from: Mais ceux qui ne se seront pas laissé instruire par des châtiments d’enfant[a] feront l’expérience d’un jugement digne de Dieu[b].
  to: Mais ceux qui n’ont pas été avertis par des réprimandes enfantines[a] éprouveront un jugement digne de Dieu[b].
  rationale: La révision élimine une nuance réflexive absente du grec et remplace une collocation française ambiguë par une formulation plus naturelle. Elle préserve la progression entre correction préalable et jugement futur, ainsi que l’ambiguïté syntaxique et théologique de θεοῦ dans la note.
