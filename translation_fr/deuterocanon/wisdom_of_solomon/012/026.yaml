  text: But those who were not instructed by childish punishments will experience a judgment worthy of God[a][b].
translation:
  language: fr
  text: Mais ceux qui n’ont pas été avertis par des réprimandes enfantines[a] éprouveront un jugement digne de Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par des réprimandes en forme de jeu » ou « par de légères mesures correctives ». L’expression grecque est condensée et peut souligner le caractère relativement léger, presque enfantin ou ludique, des corrections précédentes.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « éprouveront un jugement digne de Dieu », c’est-à-dire qu’ils apprendront à le connaître en le subissant. On peut aussi comprendre : « le jugement de Dieu » ou « un jugement venant de Dieu ».'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: παιγνίοις
  choice: d’enfant
  rationale: Dans l’expression condensée παιγνίοις ἐπιτιμήσεως, le terme évoque le caractère relativement léger, presque enfantin, des mesures correctives antérieures, plutôt que des jouets au sens propre.
- source_word: ἐπιτιμήσεως
  choice: châtiments
  rationale: Le nom peut désigner une réprimande ou un blâme, mais le contexte d’une correction divine graduée justifie « châtiments », tout en laissant à « instruire » la nuance pédagogique.
- source_word: μὴ νουθετηθέντες
  choice: qui ne se seront pas laissé instruire
  rationale: Le participe passif exprime une instruction corrective ou un avertissement reçu. La tournure française fait ressortir que ces personnes n’en ont pas tiré la leçon, sans réduire le verbe à une simple transmission de connaissances.
- source_word: ἀξίαν θεοῦ κρίσιν
  choice: un jugement digne de Dieu
  rationale: Cette traduction conserve la construction grecque et comprend θεοῦ comme un génitif qualitatif lié à ἀξίαν, tout en signalant en note les autres analyses possibles.
- source_word: πειράσουσιν
  choice: feront l’expérience
  rationale: Le verbe signifie littéralement « éprouver, mettre à l’épreuve »; ici, il s’agit de connaître le jugement en le subissant, non d’évaluer activement Dieu.
theological_decisions:
- issue: Valeur de θεοῦ dans ἀξίαν θεοῦ κρίσιν
  choice: 'génitif qualitatif : « un jugement digne de Dieu »'
  alternative: 'génitif possessif ou de provenance : « le jugement de Dieu » / « un jugement venant de Dieu »'
  rationale: La proximité de ἀξίαν favorise l’idée d’un jugement qui convient à Dieu. La note préserve toutefois l’ambiguïté réelle de l’expression grecque sans imposer une lecture doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. « Châtiments d’enfant » conserve l’image grecque tout en restant compréhensible; les notes rendent compte de la formulation condensée et de l’ambiguïté du génitif.
