    issue: La tournure réflexive « ne se seront pas laissé instruire » ajoute une nuance non exprimée.
    rationale: 'μὴ νουθετηθέντες est un participe aoriste passif : « n’ayant pas été avertis/admonestés ». Le réfléchi français peut suggérer qu’ils ont refusé de recevoir l’instruction.'
  - severity: medium
    issue: « Châtiments d’enfant » est ambigu et peu naturel.
    rationale: Cette expression peut se comprendre comme des châtiments destinés aux enfants. Le grec qualifie plutôt les réprimandes comme enfantines, légères ou de l’ordre du jeu; la note doit maintenir cette incertitude.
  - severity: low
    issue: Le futur antérieur français n’est pas requis.
    rationale: Le participe grec situe les réprimandes avant le jugement futur, mais ne nécessite pas la forme française « se seront laissé ». Le passé composé dans une relative désignant les personnes concernées est plus direct.
