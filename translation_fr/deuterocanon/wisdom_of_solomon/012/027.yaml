base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/027.yaml
  text: For in the very things by which they themselves suffered and were indignant—those things they thought were gods—by these[a], while being punished, they saw and recognized as the true God the one whom they had formerly refused to know. Therefore also the final end of condemnation came upon them.
translation:
  language: fr
  text: Car c’est précisément par les choses dont ils souffraient et s’indignaient — celles qu’ils tenaient pour des dieux — que, châtiés par elles, ils virent et reconnurent comme le vrai Dieu celui qu’autrefois ils refusaient de connaître.[a] C’est pourquoi l’ultime issue de la condamnation vint aussi sur eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils reconnurent véritablement Dieu, celui qu’autrefois ils refusaient de connaître ». Le grec permet de comprendre le mot traduit par « vrai » dans un sens adverbial : « véritablement ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφʼ οἷς
  choice: à cause de ceux-là mêmes
  rationale: Rend naturellement le lien de cause ou de moyen introduit par ἐπί et prépare la reprise insistante des mêmes êtres dans la suite de la phrase.
- source_word: πάσχοντες ἠγανάκτουν
  choice: ils souffraient et s’indignaient
  rationale: 'Préserve les deux éléments du grec : l’épreuve subie et la vive indignation qu’elle suscite, sans préciser davantage la nature de la souffrance.'
- source_word: οὓς ἐδόκουν θεούς
  choice: qu’ils prenaient pour des dieux
  rationale: Expression française courante qui conserve l’idée d’une estimation erronée et l’ironie de la polémique contre l’idolâtrie.
- source_word: ἐν αὐτοῖς κολαζόμενοι
  choice: punis par leur moyen
  rationale: 'Exprime la valeur instrumentale probable : leur punition leur venait précisément par les êtres qu’ils divinisaient.'
- source_word: ἰδόντες
  choice: ils virent
  rationale: Le participe est rendu par un verbe coordonné afin de produire une phrase française fluide tout en gardant la progression de l’expérience vers la reconnaissance.
- source_word: ὧν πάλαι ἠρνοῦντο εἰδέναι θεὸν
  choice: celui qu’autrefois ils refusaient de connaître
  rationale: Conserve la portée temporelle de πάλαι et la dimension volontaire du refus exprimé par ἠρνοῦντο.
- source_word: ἐπέγνωσαν ἀληθῆ
  choice: reconnurent comme le vrai Dieu
  rationale: 'ἐπιγινώσκω exprime ici une reconnaissance pleine; dans le contraste avec les prétendus dieux, ἀληθῆ se comprend probablement comme qualifiant Dieu : le Dieu véritable.'
- source_word: τὸ τέρμα τῆς καταδίκης
  choice: l’ultime terme de la condamnation
  rationale: Préserve l’image d’un point final ou d’un aboutissement extrême sans réduire καταδίκη au seul prononcé juridique ni l’identifier simplement au châtiment.
- source_word: ἐπʼ αὐτοὺς ἐπῆλθεν
  choice: vint aussi sur eux
  rationale: Formulation sobre qui conserve l’image biblique du jugement arrivant sur ses destinataires.
theological_decisions:
- issue: Fonction de ἀληθῆ dans θεὸν ἐπέγνωσαν ἀληθῆ
  choice: Ils reconnurent comme le vrai Dieu celui qu’ils refusaient de connaître.
  alternative: Ils reconnurent véritablement Dieu, celui qu’ils refusaient de connaître.
  rationale: La position de ἀληθῆ permet de l’entendre comme un adjectif qualifiant θεόν ou, possiblement, avec une valeur adverbiale. Le contraste contextuel entre les faux dieux et Dieu favorise « le vrai Dieu », tandis que la note conserve l’autre analyse grammaticale.
translation_notes:
  register: Français international moderne, digne et accessible. La longue période grecque est divisée en deux phrases pour éviter une construction artificielle, tout en maintenant la répétition rhétorique des mêmes êtres comme prétendus dieux et instruments de punition.
