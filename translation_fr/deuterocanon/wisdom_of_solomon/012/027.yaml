revisions:
- from: Car ils souffraient et s’indignaient à cause de ceux-là mêmes qu’ils prenaient pour des dieux. Punis par leur moyen, ils virent et reconnurent comme le vrai Dieu celui qu’autrefois ils refusaient de connaître.[a] C’est pourquoi l’ultime terme de la condamnation vint aussi sur eux.
  to: Car c’est précisément par les choses dont ils souffraient et s’indignaient — celles qu’ils tenaient pour des dieux — que, châtiés par elles, ils virent et reconnurent comme le vrai Dieu celui qu’autrefois ils refusaient de connaître.[a] C’est pourquoi l’ultime issue de la condamnation vint aussi sur eux.
  rationale: La révision rétablit la répétition voulue des mêmes choses, considérées comme des dieux et devenant les instruments du châtiment. Elle maintient la lecture principale de ἀληθῆ comme adjectif de « Dieu » et préserve l’ambiguïté grammaticale dans la note. La dernière expression est rendue dans un français plus naturel sans modifier son sens.
