  source_fidelity: « Car tu manifestes ta force » rend bien ἰσχὺν γὰρ ἐνδείκνυσαι et conserve utilement la distinction entre « force » (ἰσχύς) et « puissance » (δύναμις). « On refuse de croire » introduit toutefois une idée de refus volontaire qui n’est pas exigée par ἀπιστούμενος, lequel exprime plus largement le fait de n’être pas cru ou d’être mis en doute. « Mettre en doute » préserve cette portée sans résoudre l’ambiguïté grammaticale signalée par la note. « Démasquer l’insolence » rend de façon plus directe ἐξελέγχεις, avec son idée de mise en évidence et de réprobation.
  naturalness: Le français est globalement moderne, clair et d’un registre approprié. « Mettre en doute la plénitude de ta puissance » est plus idiomatique et moins interprétatif que « refuser de croire à ». « Parmi ceux qui la connaissent » demeure une manière naturelle de rendre le groupe introduit par ἐν, le pronom reprenant la puissance implicite.
  terminology: « Plénitude de ta puissance » traduit bien τελειότης et évite de réduire l’expression à une qualité morale. « Insolence » convient au sens négatif de θράσος dans ce contexte. « Démasquer » reflète mieux que « confondre » le champ de ἐλέγχω/ἐξελέγχω, sans imposer le registre juridiquement plus fort de « convaincre de faute ».
  issues:
  - severity: medium
    issue: Nuance volitive ajoutée par « refuse de croire »
    rationale: Le grec ἀπιστούμενος indique que Dieu ou la perfection de sa puissance n’est pas cru(e), mais n’explicite pas nécessairement un refus délibéré. « Mettre en doute » maintient le sens plus large de l’incrédulité.
  - severity: low
    issue: « Confonds » est moins précis pour ἐξελέγχεις
    rationale: En français moderne, « confondre » évoque souvent le fait de couvrir de honte ou de déconcerter. « Démasquer » exprime plus nettement l’exposition réprobatrice présente dans le verbe grec.
  revised_text: Car tu manifestes ta force quand on met en doute la plénitude de ta puissance[a], et, parmi ceux qui la connaissent, tu démasques l’insolence[b].
