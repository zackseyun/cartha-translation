base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/017.yaml
  text: For you show your strength when your perfect power is disbelieved[b][a], and among those who know it you expose boldness.
translation:
  language: fr
  text: Car tu manifestes ta force quand on met en doute la plénitude de ta puissance[a], et, parmi ceux qui la connaissent, tu démasques l’insolence[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quand on ne te croit pas au sujet de la plénitude de ta puissance ». Le grec est condensé et peut mettre l’accent soit sur le fait que Dieu n’est pas cru, soit sur le doute concernant la plénitude de sa puissance.'
    reason: alternative_reading
  - marker: b
    text: 'Le mot grec désigne ici une audace négative : l’arrogance ou la présomption.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰσχὺν
  choice: ta force
  rationale: « Force » rend ἰσχύς et maintient sa distinction avec δύναμις, traduit ensuite par « puissance ».
- source_word: ἐνδείκνυσαι
  choice: tu manifestes
  rationale: Le verbe signifie montrer ou démontrer ; « manifester » convient au registre et souligne la mise en évidence de la force divine.
- source_word: ἀπιστούμενος ἐπὶ δυνάμεως τελειότητι
  choice: quand on refuse de croire à la plénitude de ta puissance
  rationale: Cette formulation française exprime le doute visant la pleine puissance de Dieu, tout en signalant en note la construction grecque condensée, où Dieu lui-même est grammaticalement celui qu’on ne croit pas.
- source_word: δυνάμεως τελειότητι
  choice: la plénitude de ta puissance
  rationale: « Plénitude » rend τελειότης comme état d’accomplissement ou de perfection, sans laisser entendre une simple puissance moralement parfaite.
- source_word: ἐν τοῖς εἰδόσι
  choice: parmi ceux qui la connaissent
  rationale: La préposition ἐν avec le pluriel désigne ici le groupe ou la sphère. Le pronom « la » reprend naturellement la puissance divine, objet implicite dans le grec.
- source_word: τὸ θράσος
  choice: l’insolence
  rationale: 'Dans ce contexte de réprimande, θράσος a une valeur négative : audace présomptueuse plutôt que courage légitime.'
- source_word: ἐξελέγχεις
  choice: tu confonds
  rationale: ἐλέγχω peut signifier démasquer, convaincre de faute ou reprendre. « Confondre » réunit ici l’idée de mettre en évidence et de condamner l’insolence.
theological_decisions:
- issue: Référent et portée de l’incrédulité à l’égard de la puissance divine
  choice: Le texte dit que Dieu manifeste sa force quand on refuse de croire à la plénitude de sa puissance.
  alternative: 'Le grec peut se comprendre plus littéralement : Dieu manifeste sa force quand lui-même n’est pas cru quant à la plénitude de sa puissance.'
  rationale: Le participe ἀπιστούμενος se rapporte grammaticalement à Dieu, tandis que la locution prépositionnelle précise le domaine de l’incrédulité. Le texte principal privilégie un français naturel sans effacer l’autre accent, conservé en note.
translation_notes:
  register: Français international actuel, digne et lisible. Le parallélisme entre « force » et « puissance » conserve la distinction lexicale du grec. « Confondre l’insolence » garde une légère solennité sapientielle sans devenir archaïque.
