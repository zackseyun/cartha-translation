  text: Let us crown ourselves with rosebuds before they wither[a].
translation:
  language: fr
  text: Couronnons-nous de boutons de rose avant qu’ils ne se fanent[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Parons-nous de fleurs de rose avant qu’elles ne se flétrissent. » Le grec associe les « roses » à un mot pouvant désigner les boutons ou les calices floraux, évoquant ainsi des roses encore fraîches.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στεψώμεθα
  choice: Couronnons-nous
  rationale: Le subjonctif aoriste a ici une valeur exhortative. « Couronnons-nous » conserve l’image festive d’une parure faite en forme de couronne ou de guirlande.
- source_word: ῥόδων κάλυξιν
  choice: de boutons de rose
  rationale: Le génitif pluriel ῥόδων (« roses »), associé à κάλυξιν (« boutons », « calices floraux »), désigne naturellement de jeunes fleurs de rosier. « Boutons de rose » est précis et courant, sans le technicisme de « calices ».
- source_word: πρὶν ἢ
  choice: avant que
  rationale: Cette locution introduit l’événement qu’il faut devancer ; « avant que » est son équivalent temporel naturel en français.
- source_word: μαρανθῆναι
  choice: qu’ils ne se fanent
  rationale: L’infinitif aoriste passif de μαραίνω exprime le flétrissement des fleurs. « Se faner » est le verbe français idiomatique ; le « ne » explétif convient au registre soutenu après « avant que » sans exprimer une négation.
