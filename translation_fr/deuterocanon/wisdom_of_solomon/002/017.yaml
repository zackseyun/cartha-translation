  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/017.yaml
  text: Let us see whether his words are true[a], and let us test what will happen at his end.
translation:
  language: fr
  text: Voyons si ses paroles sont vraies, et mettons à l’épreuve ce qui adviendra à sa fin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quelle sera son issue ». L’expression grecque peut désigner le dénouement, le résultat ou la fin qui lui adviendra.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδωμεν
  choice: Voyons
  rationale: Le subjonctif exhortatif à la première personne du pluriel est rendu naturellement par « Voyons », qui conserve le ton de défi délibéré.
- source_word: οἱ λόγοι αὐτοῦ
  choice: ses paroles
  rationale: « Paroles » reste proche de λόγοι tout en pouvant désigner ici ses affirmations.
- source_word: ἀληθεῖς
  choice: vraies
  rationale: L’adjectif porte sur la vérité du contenu des paroles, plutôt que sur la sincérité de celui qui parle.
- source_word: πειράσωμεν
  choice: mettons à l’épreuve
  rationale: Cette formulation exprime clairement l’idée d’un test hostile dans le contexte.
- source_word: τὰ ἐν ἐκβάσει αὐτοῦ
  choice: ce qui arrivera à la fin de sa vie
  rationale: La tournure française rend l’expression grecque idiomatique, qui peut viser ce qui survient à quelqu’un lors de son dénouement ou l’issue qui lui est réservée.
theological_decisions:
- issue: Sens de ἐκβάσις par rapport aux affirmations du juste
  choice: ce qui arrivera à la fin de sa vie
  alternative: quelle sera son issue
  rationale: Le texte évoque la vérification finale des paroles du juste. La traduction garde la tension entre la fin de sa vie et l’issue qui lui adviendra, sans préciser davantage la nature de l’intervention divine.
translation_notes:
  register: Français international moderne, naturel et digne. L’impératif exhortatif conserve le ton collectif et hostile des locuteurs; la note préserve l’ambiguïté de ἐκβάσις.
