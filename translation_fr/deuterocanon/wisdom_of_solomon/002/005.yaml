base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/005.yaml
  text: For our life is the passing of a shadow, and there is no turning back from our end, because it has been sealed, and no one returns.
translation:
  language: fr
  text: Car notre vie n’est que le passage d’une ombre, et il n’y a pas de retour après notre mort, car elle est scellée, et personne ne revient.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκιᾶς … πάροδος
  choice: passe comme une ombre
  rationale: Rend naturellement l’image grecque d’une vie aussi fugitive que le passage d’une ombre, tout en conservant la métaphore.
- source_word: ἀναποδισμὸς
  choice: retour
  rationale: Le terme désigne ici la possibilité de revenir en arrière; dans le contexte de la mort, «retour» est clair et idiomatique.
- source_word: τῆς τελευτῆς ἡμῶν
  choice: après notre fin
  rationale: Le génitif dépend sémantiquement de l’idée de retour; «après notre fin» exprime en français le retour depuis l’état final, c’est-à-dire la mort.
- source_word: κατεσφραγίσθη
  choice: elle a été scellée
  rationale: Conserve le passif et l’image du sceau, qui évoque une fin fixée et irrévocable sans préciser l’agent.
- source_word: ἀναστρέφει
  choice: revient
  rationale: Dans ce contexte, le verbe signifie revenir; cette formulation évite le peu naturel «se retourne» et maintient l’affirmation absolue.
theological_decisions:
- issue: Caractère irrévocable de la mort dans le discours des impies
  choice: 'Conserver l’affirmation sans l’atténuer: «personne ne revient».'
  alternative: Reformuler comme une affirmation doctrinale générale sur l’absence de résurrection.
  rationale: Le verset rapporte le raisonnement des impies dans son contexte littéraire; la traduction doit préserver leur affirmation sans l’harmoniser ni l’ériger explicitement en doctrine du livre.
- issue: Agent du scellement
  choice: Maintenir le passif sans nommer l’agent.
  alternative: Ajouter «par Dieu» ou attribuer le scellement à la nature.
  rationale: Le grec ne précise pas qui ou quoi a scellé la fin; nommer un agent résoudrait indûment cette ambiguïté.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve le parallélisme du grec et son imagerie, avec une syntaxe naturelle pour un lectorat courant.
