  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/020.yaml
  text: Let us condemn him to a shameful death[a], for there will be an examination of him according to his words.
translation:
  language: fr
  text: Condamnons-le à une mort infamante[a], car il y aura pour lui une intervention conforme à ses paroles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « une mort honteuse ». Pour la suite : « car on s’occupera de lui conformément à ses paroles », « car il sera justifié conformément à ses paroles » ou « car ce qui lui arrivera mettra ses paroles à l’épreuve ». Le grec désigne largement une attention, une inspection ou une intervention, notamment divine.'
    reason: La portée de ἐπισκοπή et son rapport avec ἐκ λόγων αὐτοῦ restent ambigus.
lexical_decisions:
- source_word: θανάτῳ ἀσχήμονι
  choice: à une mort infamante
  rationale: Le datif exprime la peine à laquelle il est condamné. « Infamante » rend le déshonneur et l’indignité associés à ἀσχήμονι dans un français naturel et soutenu.
- source_word: καταδικάσωμεν
  choice: Condamnons-le
  rationale: Le subjonctif exhortatif à la première personne du pluriel appelle une exhortation délibérative; le verbe conserve aussi sa portée judiciaire.
- source_word: ἐπισκοπή
  choice: intervention
  rationale: Le nom peut désigner le fait de porter son attention sur quelqu’un, de l’examiner ou d’intervenir à son égard. « Intervention » garde ouverte la nature de cette action, notamment divine, sans imposer secours, justification ou châtiment.
- source_word: ἐκ λόγων αὐτοῦ
  choice: conforme à ses paroles
  rationale: La préposition ἐκ relie l’intervention attendue à ce que l’homme a déclaré. Cette formulation française conserve ce rapport sans préciser indûment s’il s’agit d’un fondement judiciaire, d’une mise à l’épreuve ou de l’accomplissement de ses propos.
theological_decisions:
- issue: Nature de l’ἐπισκοπή attendue à l’égard du juste
  choice: intervention
  alternative: examen; attention; justification; châtiment
  rationale: Le contexte suggère que les adversaires mettent à l’épreuve les affirmations du juste au sujet de l’attention de Dieu, mais le grec ne détermine pas explicitement l’issue ni la forme de cette visitation. La traduction principale préserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. « Mort infamante » conserve la dimension publique de déshonneur; « intervention » est volontairement large afin de ne pas résoudre l’ambiguïté théologique du grec.
