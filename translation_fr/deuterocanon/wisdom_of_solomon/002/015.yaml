  text: for his life is unlike that of others[a], and his ways are different.
translation:
  language: fr
  text: car sa vie ne ressemble pas à celle des autres[a], et ses sentiers sont différents.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « car sa manière de vivre ne ressemble pas à celle des autres ».
    reason: βίος peut désigner la vie elle-même ou la manière de vivre.
lexical_decisions:
- source_word: ἀνόμοιος
  choice: ne ressemble pas à
  rationale: Exprime naturellement en français la dissemblance marquée par l’adjectif grec, avec son complément τοῖς ἄλλοις.
- source_word: βίος
  choice: vie
  rationale: Le mot peut désigner la vie ou la manière de vivre. « Vie » reste direct et laisse le parallélisme avec les sentiers préciser qu’il s’agit aussi de la conduite.
- source_word: ἐξηλλαγμέναι
  choice: sont tout différents
  rationale: Le parfait passif décrit un état de différence résultant d’un changement. Dans ce contexte comparatif, « tout différents » rend cet état de façon idiomatique sans imposer l’idée d’une modification récente.
- source_word: τρίβοι
  choice: sentiers
  rationale: Conserve l’image concrète des chemins battus, employée métaphoriquement pour la conduite.
theological_decisions:
- issue: Faut-il expliciter le sens moral de βίος et τρίβοι ?
  choice: Conserver « vie » et l’image des « sentiers » sans ajouter « conduite » ou « manière de vivre » dans le texte principal.
  alternative: car sa manière de vivre ne ressemble pas à celle des autres, et ses voies sont différentes.
  rationale: Le grec laisse l’image et le parallélisme porter le sens moral. Une explicitation dans le corps du texte réduirait cette richesse et trancherait inutilement entre vie et manière de vivre.
translation_notes:
  register: Français moderne, courant et digne. « Sentiers » maintient la métaphore biblique sans être obscur ; « tout différents » restitue la forte opposition de manière naturelle.
