translation:
  language: fr
  text: Car nous sommes venus à l’existence par pur hasard, et après cela nous serons comme si nous n’avions pas existé ; car le souffle dans nos narines est une fumée, et la raison est une étincelle dans le mouvement de notre cœur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτοσχεδίως
  choice: par pur hasard
  rationale: L’adverbe exprime ici, dans le discours des impies, une venue à l’existence improvisée ou fortuite; «par pur hasard» restitue naturellement cette affirmation.
- source_word: πνοή
  choice: souffle
  rationale: Désigne le souffle respiratoire dans les narines, en cohérence avec l’image de la fumée.
- source_word: λόγος
  choice: raison
  rationale: Dans ce contexte anthropologique, λόγος désigne vraisemblablement la faculté rationnelle ou la pensée plutôt que la parole prononcée; «raison» conserve le contraste avec le souffle.
- source_word: ἐν κινήσει καρδίας
  choice: produite par les battements de notre cœur
  rationale: κίνησις désigne le mouvement du cœur; la formulation française explicite naturellement le rapport de l’étincelle à ce mouvement sans changer l’image.
theological_decisions:
- issue: Statut des affirmations matérialistes du verset
  choice: Les traduire directement sans les corriger théologiquement
  alternative: Atténuer «par pur hasard» ou reformuler selon une doctrine de la création
  rationale: Ces propos appartiennent au raisonnement des impies dans le contexte; la traduction doit en préserver la force sans les faire passer pour l’enseignement propre du livre.
- issue: Sens de λόγος
  choice: raison
  alternative: parole
  rationale: Les deux sens sont lexicalement possibles, mais l’association avec le mouvement du cœur et l’anthropologie du passage favorisent la faculté de raisonner; aucune note n’est indispensable dans le texte courant.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le parallélisme causal du grec tout en évitant une tournure artificielle. Aucun marqueur de note n’est requis.
