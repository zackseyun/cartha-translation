  text: He claims to have knowledge of God[a], and calls himself a child of the Lord;
translation:
  language: fr
  text: Il prétend avoir la connaissance de Dieu et se dit enfant du Seigneur[a] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fils du Seigneur » ou « serviteur du Seigneur » ; le mot grec peut avoir ces différents sens.
    reason: Conserver l’ambiguïté lexicale de παῖς entre relation filiale et statut de serviteur.
lexical_decisions:
- source_word: ἐπαγγέλλεται
  choice: prétend
  rationale: Dans les propos hostiles des impies, le verbe présente ce que le juste affirme à son propre sujet. « Prétend » convient au contexte sans décider pour le lecteur si l’affirmation est vraie ou fausse.
- source_word: γνῶσιν ἔχειν θεοῦ
  choice: avoir la connaissance de Dieu
  rationale: Cette formulation conserve le substantif γνῶσις et la construction littérale « avoir la connaissance de Dieu », tout en restant intelligible dans un registre soutenu.
- source_word: θεοῦ
  choice: Dieu
  rationale: Le génitif sans article se rend naturellement par « de Dieu », sans introduire de distinction absente du grec.
- source_word: παῖδα
  choice: enfant
  rationale: παῖς peut désigner un enfant, un fils ou un serviteur. Ici, le contexte met surtout en avant une relation filiale revendiquée avec le Seigneur ; « enfant » en préserve la portée sans préciser davantage que le grec.
- source_word: Κυρίου
  choice: du Seigneur
  rationale: « Seigneur » est la traduction usuelle de κύριος ; la construction française exige ici l’article contracté « du ».
- source_word: ἑαυτὸν ὀνομάζει
  choice: se donne le nom de
  rationale: Cette expression française rend clairement l’acte d’auto-désignation exprimé par la construction réflexive grecque, tout en gardant la nuance explicite du verbe « nommer ».
theological_decisions:
- issue: Sens de παῖδα Κυρίου entre filiation et service
  choice: enfant du Seigneur
  alternative: fils du Seigneur ; serviteur du Seigneur
  rationale: La relation filiale paraît la plus naturelle dans ce contexte, mais παῖς possède aussi le sens de « serviteur ». Le texte principal conserve la largeur de « enfant », et la note signale les autres lectures possibles sans résoudre abusivement l’ambiguïté.
- issue: Traduction de κύριος
  choice: le Seigneur
  alternative: Seigneur
  rationale: La forme avec article est naturelle en français dans cette construction et maintient le titre traditionnel sans ajouter « Dieu ».
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste proche de la syntaxe grecque, notamment en conservant le substantif « connaissance » et l’idée explicite de se donner un nom.
