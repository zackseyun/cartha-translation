base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/006.yaml
  text: Come then[a], let us enjoy the good things that exist, and let us make use of creation eagerly, as in youth[c][b];
translation:
  language: fr
  text: Allons donc, jouissons des biens qui existent[a], et usons de la création[b] avec ardeur, comme au temps de la jeunesse[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des biens présents » ou « des biens à notre portée ». Le grec dit littéralement « les biens existants ».
    reason: lexical_alternative
  - marker: b
    text: Ou « du monde créé ».
    reason: lexical_alternative
  - marker: c
    text: La formule « comme au temps de la jeunesse » évoque probablement la vigueur ou la fougue associée à la jeunesse.
    reason: cultural_note
lexical_decisions:
- source_word: δεῦτε οὖν
  choice: Allons donc
  rationale: Cette tournure idiomatique rend à la fois l’appel collectif de δεῦτε et la valeur de continuation ou de conséquence de οὖν.
- source_word: ἀπολαύσωμεν
  choice: jouissons
  rationale: Le verbe exprime le fait de profiter avec plaisir; « jouissons » conserve ici la force hédoniste du propos sans la paraphraser.
- source_word: τῶν ὄντων ἀγαθῶν
  choice: des biens qui existent
  rationale: Rendu proche du grec, littéralement « les biens existants »; il laisse ouverte la nuance contextuelle de biens présents ou disponibles.
- source_word: χρησώμεθα
  choice: usons de
  rationale: Cette formulation garde le sens de « faire usage de » et maintient la distinction avec ἀπολαύσωμεν, rendu par « jouissons ».
- source_word: τῇ κτίσει
  choice: de la création
  rationale: κτίσις désigne ici largement ce qui a été créé ou l’ordre créé; « création » en préserve l’étendue.
- source_word: σπουδαίως
  choice: avec ardeur
  rationale: L’expression transmet l’idée d’empressement et d’intensité, tout en s’accordant naturellement avec l’image de la jeunesse.
- source_word: ὡς νεότητι
  choice: comme au temps de la jeunesse
  rationale: La formule grecque est condensée. Ce rendu français exprime la comparaison avec la vigueur ou l’élan propres à la jeunesse sans introduire explicitement le possessif « notre ».
theological_decisions:
- issue: Sens de τῶν ὄντων ἀγαθῶν
  choice: des biens qui existent
  alternative: des biens présents / des biens à notre portée
  rationale: Le choix conserve la formulation ontologique du grec tout en laissant le contexte suggérer qu’il s’agit des biens actuellement disponibles.
- issue: Portée de τῇ κτίσει
  choice: de la création
  alternative: du monde créé
  rationale: « Création » garde la portée générale du terme et évite de le réduire à certaines ressources matérielles.
- issue: Interprétation de ὡς νεότητι
  choice: comme au temps de la jeunesse
  alternative: comme si nous étions jeunes / avec la fougue de la jeunesse
  rationale: Le grec est elliptique; le texte retient une comparaison temporelle sobre, tandis que la note signale la nuance probable de vigueur ou d’abandon.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme exhortatif et la tonalité hédoniste du discours sont conservés. Les répétitions de sens sont évitées afin de maintenir la distinction entre jouir des biens et faire usage de la création.
