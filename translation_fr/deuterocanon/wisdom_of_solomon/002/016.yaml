base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/016.yaml
  text: We were considered by him to be counterfeit[a], and he keeps away from our ways as from uncleannesses; he calls the end of the righteous blessed[c][b], and boasts that God is his father.
translation:
  language: fr
  text: Il nous tient pour de la fausse monnaie[a], et il se tient loin de nos chemins comme de choses impures. Il proclame heureux le sort final des justes[b] et se vante d’avoir Dieu pour père[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des êtres faux », « sans valeur » ou « non authentiques ». Le grec évoque notamment une monnaie ou un métal falsifié.
    reason: lexical_alternative
  - marker: b
    text: Ou « la fin des justes », « leur état final » ou « l’issue réservée aux justes ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement, la formulation grecque est condensée : « se vante [d’]avoir Dieu pour père ». Il s’agit de la prétention que les impies attribuent au juste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κίβδηλον
  choice: de la fausse monnaie
  rationale: Le terme désigne ce qui est falsifié ou non authentique, notamment une monnaie ou un métal altéré. Cette image concrète rend l’accusation de fausseté portée contre les impies.
- source_word: ἐλογίσθημεν
  choice: À ses yeux, nous ne sommes que
  rationale: Le passif exprime ici le jugement ou l’évaluation du juste à leur égard. Cette formulation française naturelle conserve la perspective subjective des locuteurs.
- source_word: ἀπέχεται
  choice: il se tient loin de
  rationale: Le verbe indique une séparation volontaire, sans imposer le sens technique d’abstinence.
- source_word: ὁδῶν
  choice: chemins
  rationale: « Chemins » conserve la métaphore biblique de la conduite et du mode de vie.
- source_word: ἀκαθαρσιῶν
  choice: choses impures
  rationale: Le pluriel grec désigne des réalités qui souillent. La formulation maintient le langage de pureté tout en restant idiomatique en français.
- source_word: μακαρίζει
  choice: proclame heureux
  rationale: Le verbe signifie déclarer ou tenir pour heureux, bienheureux. « Proclame heureux » garde sa force évaluative.
- source_word: ἔσχατα δικαίων
  choice: le sort final des justes
  rationale: Le pluriel substantivé ἔσχατα peut viser les réalités dernières, l’issue ou l’état final. « Sort final » rend ce sens sans préciser davantage la nature de cette destinée.
- source_word: ἀλαζονεύεται πατέρα θεόν
  choice: se vante d’avoir Dieu pour père
  rationale: La tournure grecque condensée présente, dans la bouche des impies, la prétention orgueilleuse du juste à une relation filiale avec Dieu.
theological_decisions:
- issue: Portée de πατέρα θεόν avec ἀλαζονεύεται
  choice: se vante d’avoir Dieu pour père
  alternative: se vante de Dieu comme père
  rationale: Le verset rapporte l’accusation des impies contre le juste, non une affirmation directe du narrateur. La traduction explicite la relation revendiquée sans lui attribuer une portée christologique ultérieure.
- issue: Sens de ἔσχατα δικαίων
  choice: le sort final des justes
  alternative: la fin des justes
  rationale: Le grec reste ouvert entre la fin, l’issue et l’état ultime. « Sort final » préserve cette amplitude eschatologique sans la résoudre en doctrine précise.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore monétaire de κίβδηλον est conservée; le langage biblique des « chemins » et la tension autour de la destinée finale et de la filiation divine ne sont pas aplatis.
