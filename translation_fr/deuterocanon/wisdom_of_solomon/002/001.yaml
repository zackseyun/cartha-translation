base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/001.yaml
  text: For they said among themselves[a], reasoning wrongly, “Our life is short and sorrowful, and there is no remedy at the end of a man's life[b], and no one has been known to return from Hades.”
translation:
  language: fr
  text: 'Car ils se sont dit en eux-mêmes, en raisonnant à tort : « Notre vie est courte et pénible ; il n’y a aucun remède lorsqu’un être humain arrive à sa fin[a], et on n’a jamais connu quelqu’un qui soit revenu de l’Hadès[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à la fin d’un être humain » ; le singulier grec a une portée générale.'
    reason: lexical_alternative
  - marker: b
    text: L’Hadès est le séjour des morts. Le participe grec peut aussi évoquer quelqu’un qui soit sorti de l’Hadès ou qui en ait été délivré.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπον γὰρ ἐν ἑαυτοῖς
  choice: Car ils se sont dit en eux-mêmes
  rationale: Le tour pronominal français rend naturellement la parole intérieure ou concertée exprimée par ἐν ἑαυτοῖς, tandis que « car » conserve la valeur explicative de γάρ.
- source_word: λογισάμενοι οὐκ ὀρθῶς
  choice: après avoir raisonné de travers
  rationale: Cette formulation garde le jugement explicite porté sur leur raisonnement et rend clairement le participe antérieur sans le réduire à une simple erreur involontaire.
- source_word: ὀλίγος ἐστὶν καὶ λυπηρὸς ὁ βίος ἡμῶν
  choice: Notre vie est courte et pénible
  rationale: Avec βίος, ὀλίγος concerne la durée. « Pénible » couvre la détresse, la peine et le caractère douloureux de λυπηρός sans le limiter à la douleur physique.
- source_word: ἴασις
  choice: remède
  rationale: Dans le contexte de la mort, « remède » est plus naturel que « guérison » tout en conservant l’image d’une situation à laquelle aucune restauration ne peut être apportée.
- source_word: ἐν τελευτῇ ἀνθρώπου
  choice: lorsqu’un être humain arrive à sa fin
  rationale: La formulation exprime la fin de la vie humaine et rend le singulier générique ἀνθρώπου sans suggérer que l’affirmation ne concernerait que les hommes de sexe masculin.
- source_word: οὐκ ἐγνώσθη
  choice: on n’a jamais connu quelqu’un
  rationale: 'Le tour impersonnel français rend le passif grec et sa portée générale : aucune expérience connue n’atteste un tel cas.'
- source_word: ὁ ἀναλύσας ἐξ ᾅδου
  choice: quelqu’un qui soit revenu de l’Hadès
  rationale: Le contexte indique un mouvement hors du séjour des morts. « Revenu » en donne le sens contextuel naturel, tandis que la note conserve l’autre nuance possible du participe.
- source_word: ᾅδου
  choice: l’Hadès
  rationale: La translittération préserve le nom grec du séjour des morts et évite de le réduire à la seule tombe ou d’y substituer la notion distincte d’enfer.
theological_decisions:
- issue: Portée du singulier générique ἀνθρώπου
  choice: un être humain
  alternative: un homme
  rationale: Le grec vise ici la condition humaine en général, non les seuls individus masculins. « Un être humain » conserve le singulier représentatif sans ambiguïté de genre.
- issue: Désignation de ᾅδης
  choice: l’Hadès
  alternative: le séjour des morts
  rationale: Garder le terme grec préserve le cadre conceptuel du texte sans l’assimiler à la tombe ni à l’enfer. Une note en explicite le sens ordinaire.
- issue: Sens de ὁ ἀναλύσας
  choice: quelqu’un qui soit revenu
  alternative: quelqu’un qui en ait été délivré
  rationale: Le mouvement « hors de l’Hadès » implique contextuellement un retour parmi les vivants, mais le participe peut aussi évoquer le fait d’être délié ou libéré. La traduction principale reste naturelle et la note préserve cette tension lexicale.
translation_notes:
  register: Français international actuel, digne et accessible. La ponctuation met en relief les trois affirmations successives. « Raisonner de travers » reste courant sans être familier ; « Hadès » conserve le terme source, immédiatement expliqué en note.
