  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : l’extinction conduit le corps à devenir cendre et le πνεῦμα à se disperser. Toutefois, la note a affirme trop précisément que l’antécédent est « l’étincelle » : le grec emploie un pronom dont le renvoi dépend de l’image précédente et ne justifie pas cette identification catégorique dans ce verset isolé.'
  naturalness: « Une fois celui-ci éteint » est lourd et peu idiomatique en français contemporain, et « comme un air ténu » sonne artificiel. « À son extinction » conserve l’antécédent implicite du grec avec une formulation fluide ; « comme de l’air sans consistance » rend clairement l’image sans forcer une tournure insolite.
