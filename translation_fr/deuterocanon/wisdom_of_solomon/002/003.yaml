  text: when it is extinguished[a], the body will become ashes[b], and the spirit will be dispersed like thin air.
translation:
  language: fr
  text: À son extinction[a], le corps deviendra cendre, et l’esprit[b] se dispersera comme de l’air sans consistance[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie un pronom renvoyant à l’image immédiatement précédente, sans préciser davantage son antécédent dans ce verset.
    reason: contextual_antecedent
  - marker: b
    text: Ou « souffle » ou « souffle vital ». Le grec peut avoir ces différents sens ici.
    reason: lexical_alternative
  - marker: c
    text: Le grec évoque un air léger, diffus ou sans consistance.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ σβεσθέντος
  choice: une fois celui-ci éteint
  rationale: Le génitif absolu exprime l’extinction de ce qui vient d’être évoqué, probablement l’« étincelle » du verset précédent. Le pronom conserve le renvoi contextuel sans répéter ni préciser davantage l’antécédent.
- source_word: τέφρα ἀποβήσεται
  choice: deviendra cendre
  rationale: ἀποβαίνω signifie ici « devenir, aboutir à », et le singulier collectif « cendre » correspond directement à τέφρα tout en restant naturel en français.
- source_word: τὸ σῶμα
  choice: le corps
  rationale: Traduction directe du nom grec singulier avec article, sans introduire « notre » ni interpréter le corps comme un cadavre.
- source_word: τὸ πνεῦμα
  choice: l’esprit
  rationale: πνεῦμα peut désigner l’esprit, le souffle ou le souffle vital. « L’esprit » maintient le contraste avec le corps, tandis qu’une note conserve les autres sens possibles.
- source_word: διαχυθήσεται
  choice: se dispersera
  rationale: Le futur passif de διαχέω décrit ici une diffusion ou une dispersion; la tournure pronominale est idiomatique en français et convient à l’image de l’air.
- source_word: ὡς χαῦνος ἀήρ
  choice: comme un air ténu
  rationale: χαῦνος évoque ce qui est léger, lâche, vide ou sans consistance. « Air ténu » rend l’idée d’une substance diffuse et peu consistante sans ajouter l’expression idiomatique française « disparaître dans la nature ».
theological_decisions:
- issue: Sens anthropologique de πνεῦμα dans un discours sceptique sur la mort
  choice: l’esprit
  alternative: le souffle ou le souffle vital
  rationale: Le grec met en regard le corps et le πνεῦμα, mais compare ensuite ce dernier à un air qui se disperse. « Esprit » préserve cette opposition sans transformer le propos des locuteurs en affirmation doctrinale sur l’immortalité de l’âme; la note maintient l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du grec, tandis que « se dispersera » et « air ténu » rendent l’image de façon naturelle. Le singulier collectif « cendre » évite une formulation artificielle.
