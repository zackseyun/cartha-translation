  text: They reasoned these things, and were led astray; for their own wickedness blinded them,
translation:
  language: fr
  text: Ils ont raisonné ainsi, et ils se sont égarés, car leur propre méchanceté les a aveuglés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: Voilà ce qu’
  rationale: Cette tournure française naturelle reprend les raisonnements exposés dans le contexte précédent, tout en rendant la valeur rétrospective du démonstratif pluriel.
- source_word: ἐλογίσαντο
  choice: ont raisonné
  rationale: Le verbe exprime ici une réflexion délibérée ou un raisonnement; « ont raisonné » conserve cette dimension sans réduire le sens à une simple pensée.
- source_word: ἐπλανήθησαν
  choice: se sont égarés
  rationale: Le passif grec peut exprimer l’entrée dans l’erreur sans agent précisé. Le pronominal français est idiomatique et préserve cette indétermination mieux que « ont été trompés », qui suggérerait un trompeur.
- source_word: ἀπετύφλωσεν
  choice: a aveuglés
  rationale: Le terme décrit une perte de discernement sous l’image de l’aveuglement; cette traduction est claire, directe et conforme au registre sapientiel.
- source_word: κακία
  choice: méchanceté
  rationale: Le mot désigne ici une corruption morale active. « Méchanceté » conserve la portée éthique et personnelle du grec, là où « mal » serait plus général.
- source_word: αὐτῶν
  choice: leur propre
  rationale: L’ajout idiomatique de « propre » met en relief que la méchanceté leur appartient et constitue la cause interne de leur aveuglement, sans introduire d’agent extérieur.
theological_decisions:
- issue: Cause morale de l’aveuglement
  choice: leur propre méchanceté les a aveuglés
  alternative: la méchanceté les a aveuglés
  rationale: Le texte attribue l’aveuglement à leur corruption morale. La formulation n’y ajoute ni endurcissement divin ni tromperie exercée par un agent extérieur.
- issue: Nature de leur égarement
  choice: ils se sont égarés
  alternative: ils ont été trompés
  rationale: Le passif grec laisse la cause ou l’agent immédiat indéterminé. Le français pronominal exprime leur entrée dans l’erreur sans résoudre cette ambiguïté en postulant un trompeur.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde le mouvement causal du grec et le contraste entre raisonnement humain et aveuglement moral. Aucun vocabulaire confessionnel particulier n’est introduit.
