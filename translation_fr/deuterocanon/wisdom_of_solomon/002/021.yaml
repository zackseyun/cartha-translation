    issue: « Voilà ce qu’ils ont raisonné » est peu idiomatique.
    rationale: En français, on ne dit normalement pas « raisonner quelque chose » dans cette construction. La formulation entrave la lisibilité sans apporter une précision du grec.
  - severity: low
    issue: « mais » traduit καί.
    rationale: Le grec coordonne simplement les deux propositions; l’adversatif renforce un contraste interprétatif qui n’est pas explicitement marqué.
