base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/024.yaml
  text: But through the devil’s envy death entered into the world[a], and those who belong to his portion test it.
translation:
  language: fr
  text: Mais par la jalousie du diable, la mort est entrée dans le monde, et ceux qui sont de son parti l’éprouvent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Plus littéralement, « ceux qui sont de son lot [ou de sa part] la mettent à l’épreuve » ou « l’essaient ». L’expression grecque est difficile ; elle désigne probablement ceux qui se rangent du côté du diable et font l’expérience de la mort.
    reason: Préserver l’ambiguïté de πειράζουσιν et indiquer explicitement que « de son lot » rend μερίς de façon plus littérale.
lexical_decisions:
- source_word: φθόνῳ
  choice: par la jalousie
  rationale: Le datif exprime ici la cause ou le moyen. « Par la jalousie » conserve ce rapport sans préciser plus que le grec.
- source_word: διαβόλου
  choice: du diable
  rationale: Dans ce contexte de sagesse juive en grec, διάβολος désigne vraisemblablement la figure personnelle du mal, et non un simple accusateur humain.
- source_word: θάνατος
  choice: la mort
  rationale: Équivalent direct et naturel de θάνατος.
- source_word: εἰσῆλθεν εἰς τὸν κόσμον
  choice: est entrée dans le monde
  rationale: Cette formulation conserve l’image de l’entrée exprimée par εἰσέρχομαι tout en étant idiomatique en français.
- source_word: πειράζουσιν
  choice: éprouvent
  rationale: « Éprouver » peut exprimer le fait de faire l’expérience de la mort tout en gardant un écho du sens premier de πειράζω, « mettre à l’épreuve, essayer ».
- source_word: αὐτὸν
  choice: l’
  rationale: Le pronom renvoie le plus naturellement à θάνατος, « la mort » ; son genre devient féminin en français.
- source_word: οἱ τῆς ἐκείνου μερίδος ὄντες
  choice: ceux qui sont de son parti
  rationale: L’expression grecque signifie littéralement ceux qui sont de sa part ou de son lot. « Être de son parti » rend clairement l’idée d’appartenance ou d’alignement sans la paraphraser excessivement.
theological_decisions:
- issue: Identité de διάβολος
  choice: une figure personnelle du mal, rendue par « le diable »
  alternative: un accusateur ou calomniateur au sens générique
  rationale: La mise en relation de sa jalousie avec l’entrée de la mort dans le monde favorise ici la lecture traditionnelle d’une figure personnelle du mal, sans ajouter d’identification absente du verset.
- issue: Sens de πειράζουσιν αὐτόν
  choice: ceux qui sont du parti du diable éprouvent la mort
  alternative: ils la mettent à l’épreuve ou l’essaient
  rationale: Le sens fondamental du verbe est « essayer, éprouver, mettre à l’épreuve », mais avec la mort pour objet, le contexte suggère qu’ils en font l’expérience. Le choix français « l’éprouvent » garde une part de la tension lexicale, tandis que la note signale la difficulté.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du grec, tandis que « de son parti » évite le calque peu naturel « de son lot » dans le corps du texte. « L’éprouvent » maintient autant que possible l’ambiguïté du verbe grec.
