base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/022.yaml
  text: And they did not know his mysteries[a], nor did they hope for the reward of holiness[c][b], nor did they consider blameless souls worthy of honor.
translation:
  language: fr
  text: Ils n’ont pas connu ses mystères[a], ni espéré la récompense de la sainteté[b], ni estimé que les âmes irréprochables méritaient d’être honorées[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ses réalités cachées » ou « ses secrets ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la récompense de la piété ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « ni jugé l’honneur des âmes irréprochables » ; le grec est condensé. Le mot traduit par « être honorées » peut aussi désigner une marque d’honneur, un privilège ou un prix.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνωσαν
  choice: n’ont pas connu
  rationale: Le verbe γινώσκω exprime ici l’absence de connaissance ou de compréhension. « N’ont pas connu » reste proche du grec tout en étant clair en français.
- source_word: μυστήρια
  choice: mystères
  rationale: Le terme désigne des réalités ou desseins cachés. « Mystères » en conserve la portée religieuse sans préciser indûment leur contenu.
- source_word: αὐτοῦ
  choice: ses
  rationale: Le pronom grec est conservé comme tel. Dans le contexte, il renvoie vraisemblablement à Dieu, sans que son nom soit ajouté au texte.
- source_word: μισθὸν
  choice: récompense
  rationale: Dans ce contexte moral et religieux, « récompense » rend naturellement μισθός sans la connotation commerciale de « salaire ».
- source_word: ἤλπισαν
  choice: espéré
  rationale: ἐλπίζω indique l’espérance ou l’attente confiante d’une réalité à venir. « Espéré » en restitue directement le sens.
- source_word: ὁσιότητος
  choice: sainteté
  rationale: ὁσιότης peut désigner la sainteté, la piété ou la fidélité religieuse. « Sainteté » préserve ici la portée morale et religieuse générale du terme.
- source_word: ἔκριναν
  choice: estimé
  rationale: κρίνω a ici le sens d’évaluer ou de porter un jugement. « Estimé que » permet une formulation française naturelle de la construction grecque condensée.
- source_word: γέρας
  choice: méritaient d’être honorées
  rationale: γέρας désigne un honneur, une marque d’honneur ou un privilège. La tournure française explicite la relation elliptique entre cet honneur et les âmes irréprochables.
- source_word: ψυχῶν
  choice: âmes
  rationale: ψυχή peut signifier âme, vie ou personne. « Âmes » conserve la résonance anthropologique et eschatologique du contexte.
- source_word: ἀμώμων
  choice: irréprochables
  rationale: ἀμώμων signifie sans défaut ou sans reproche. « Irréprochables » est un qualificatif moral naturel appliqué aux âmes.
theological_decisions:
- issue: Référent de « ses » dans « ses mystères »
  choice: Conserver le pronom « ses », compris dans le contexte comme renvoyant probablement à Dieu
  alternative: Expliciter « les mystères de Dieu »
  rationale: Le contexte soutient le référent divin, mais le grec emploie un pronom. Le conserver évite d’expliciter dans le corps du texte ce que l’original laisse implicite.
- issue: Sens de ψυχῶν
  choice: âmes
  alternative: vies ou personnes
  rationale: « Âmes » préserve la portée du passage concernant le destin des justes, sans développer une doctrine anthropologique absente du verset.
- issue: Relation exprimée par γέρας ψυχῶν ἀμώμων
  choice: les âmes irréprochables méritaient d’être honorées
  alternative: l’honneur réservé aux âmes irréprochables / la récompense des âmes irréprochables
  rationale: La construction grecque est très condensée. La formulation retenue exprime naturellement en français l’évaluation impliquée par ἔκριναν, tout en signalant en note la littéralité et les autres nuances possibles de γέρας.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination avec « ni » reproduit le parallélisme négatif du grec sans alourdir la phrase. La dernière proposition est légèrement explicitée pour rendre intelligible en français la construction nominale condensée de l’original.
