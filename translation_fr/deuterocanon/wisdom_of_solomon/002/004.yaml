  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/004.yaml
  text: and our name will be forgotten in time[a], and no one will remember our works; and our life will pass by like the trace of a cloud, and will be scattered like mist[b], driven off by the sun’s rays and weighed down by its heat.
translation:
  language: fr
  text: Et notre nom tombera dans l’oubli avec le temps, et personne ne se souviendra de nos œuvres ; notre vie passera comme la trace d’un nuage[a] et se dissipera comme la brume, chassée par les rayons du soleil et alourdie par sa chaleur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les traces d’un nuage ».'
    reason: Précision sur le pluriel concret ἴχνη, rendu par un singulier collectif plus naturel en français.
lexical_decisions:
- source_word: ἐπιλησθήσεται ἐν χρόνῳ
  choice: tombera dans l’oubli avec le temps
  rationale: Cette formulation française naturelle conserve le passif de sens et l’idée d’un oubli progressif au fil du temps.
- source_word: μνημονεύσει τῶν ἔργων ἡμῶν
  choice: se souviendra de nos œuvres
  rationale: « Se souvenir » correspond au parallélisme avec l’oubli du nom, tandis que « œuvres » maintient le registre digne et la portée générale de ἔργα.
- source_word: παρελεύσεται ὁ βίος ἡμῶν
  choice: notre vie passera
  rationale: Le verbe exprime le passage; cette traduction préserve simplement l’image de mouvement sans expliciter davantage la mort.
- source_word: ἴχνη νεφέλης
  choice: la trace d’un nuage
  rationale: Le grec emploie le pluriel « traces », mais le singulier collectif est plus naturel en français pour évoquer la marque fugitive laissée par un nuage.
- source_word: ὡς ὁμίχλη διασκεδασθήσεται
  choice: se dissipera comme la brume
  rationale: « Se dissipera » rend idiomatiquement la dispersion d’une vapeur légère sous l’action du soleil.
- source_word: διωχθεῖσα ὑπὸ ἀκτίνων ἡλίου
  choice: chassée par les rayons du soleil
  rationale: La tournure conserve la force du participe passif et l’image des rayons qui repoussent la brume.
- source_word: ὑπὸ θερμότητος αὐτοῦ βαρυνθεῖσα
  choice: accablée par sa chaleur
  rationale: « Accablée » préserve la métaphore de ce qui est rendu lourd ou oppressé, tout en restant intelligible pour décrire l’action de la chaleur solaire.
