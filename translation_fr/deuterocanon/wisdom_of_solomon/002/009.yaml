base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/009.yaml
  text: Let none of us be without a share in our revelry; everywhere let us leave tokens of our merriment[a], because this is our portion, and this our lot.
translation:
  language: fr
  text: Que nul d’entre nous ne soit privé de sa part dans nos réjouissances[a] ; partout, laissons des signes de notre joie, car telle est notre part, tel est notre lot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « notre orgueil » ou « notre arrogance ». Le terme grec peut évoquer une attitude hautaine, mais le contexte met ici au premier plan des réjouissances marquées par la recherche effrénée du plaisir.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄμοιρος
  choice: privé de sa part
  rationale: Cette formulation conserve l’idée d’absence de part et prépare le parallèle avec μερὶς (« part ») à la fin du verset.
- source_word: ἀγερωχίας
  choice: réjouissances
  rationale: Dans le discours hédoniste de Sagesse 2, le terme désigne ici le débordement festif et complaisant auquel tous sont invités. La note conserve ses sens possibles d’orgueil et d’arrogance.
- source_word: πανταχῇ
  choice: partout
  rationale: Équivalent direct et naturel de l’adverbe grec.
- source_word: καταλίπωμεν
  choice: laissons
  rationale: Le subjonctif d’exhortation grec est rendu par un impératif français à la première personne du pluriel.
- source_word: σύμβολα
  choice: signes
  rationale: Le mot désigne des marques reconnaissables laissées comme témoignages de la fête ; « signes » reste proche du grec sans imposer leur forme matérielle.
- source_word: εὐφροσύνης
  choice: joie
  rationale: Le terme exprime ici la gaieté et le plaisir festifs ; « joie » est clair, courant et digne dans ce contexte.
- source_word: μερὶς
  choice: part
  rationale: Ce choix garde l’image d’une portion attribuée et reprend le vocabulaire du début du verset.
- source_word: κλῆρος
  choice: lot
  rationale: « Lot » préserve le parallèle avec « part » et l’idée d’une condition attribuée, sans préciser indûment qu’il s’agit d’un héritage.
theological_decisions:
- issue: Sens de ἀγερωχίας dans le discours des impies
  choice: nos réjouissances
  alternative: notre orgueil / notre arrogance
  rationale: Le contexte immédiat exhorte à jouir des plaisirs avant la mort, ce qui favorise un sens festif. Comme le grec peut aussi exprimer la hauteur orgueilleuse, cette ambiguïté moralement significative est signalée en note plutôt qu’effacée.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « part » maintient la cohésion de l’image grecque, tandis que « telle est notre part, tel est notre lot » conserve le parallélisme final.
