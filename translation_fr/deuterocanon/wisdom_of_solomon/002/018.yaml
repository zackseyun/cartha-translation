  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/018.yaml
  text: For if the righteous man is God's son, he will help him and rescue him from the hand of those who oppose him.
translation:
  language: fr
  text: Car si le juste est fils de Dieu[a], Dieu viendra à son aide et le délivrera de la main de ses adversaires.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « un fils de Dieu » ou « le Fils de Dieu ». La construction grecque permet ces différentes formulations; le texte principal n’impose pas un titre christologique ultérieur.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δίκαιος
  choice: le juste
  rationale: L’adjectif substantivé désigne ici un homme caractérisé par sa justice. « Le juste » est naturel dans le registre biblique français et conserve la forme représentative au masculin singulier.
- source_word: υἱὸς θεοῦ
  choice: fils de Dieu
  rationale: La construction prédicative sans article permet cette formulation naturelle. La minuscule évite d’imposer au texte un titre christologique ultérieur, tout en maintenant pleinement l’affirmation filiale.
- source_word: ἀντιλήμψεται αὐτοῦ
  choice: Dieu viendra à son aide
  rationale: Le verbe exprime l’action de soutenir ou de secourir. La répétition explicite de « Dieu », sujet implicite repris de l’expression précédente, évite en français une ambiguïté référentielle.
- source_word: ῥύσεται αὐτόν
  choice: le délivrera
  rationale: Le verbe désigne l’arrachement à un danger ou à une puissance hostile. « Délivrer » convient au registre biblique tout en restant clair en français moderne.
- source_word: ἐκ χειρὸς ἀνθεστηκότων
  choice: de la main de ses adversaires
  rationale: « De la main de » conserve l’image biblique de la puissance exercée, tandis que « ses adversaires » rend avec concision le participe désignant ceux qui se dressent contre lui.
theological_decisions:
- issue: Faut-il comprendre υἱὸς θεοῦ comme un titre christologique et mettre une majuscule à « Fils » ?
  choice: « fils de Dieu », sans majuscule
  alternative: « le Fils de Dieu » ou « un fils de Dieu »
  rationale: Dans ce contexte, les impies rapportent la prétention du juste. Le grec permet plusieurs nuances et n’exige pas la lecture titulaire; la traduction principale préserve donc l’affirmation sans importer une interprétation christologique postérieure.
- issue: Identification du sujet de ἀντιλήμψεται et ῥύσεται
  choice: Expliciter « Dieu » comme sujet
  alternative: Employer simplement « il », comme dans le grec
  rationale: En grec, le sujet se comprend naturellement à partir de θεοῦ. En français, « il » risquerait de renvoyer au juste et de produire un contresens; expliciter « Dieu » préserve le sens sans résoudre une tension théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’image biblique « de la main de » et explicite Dieu comme sujet des verbes afin d’éviter une ambiguïté pronominale absente ou moins forte en grec.
