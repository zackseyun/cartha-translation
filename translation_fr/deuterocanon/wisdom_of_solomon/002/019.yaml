base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/019.yaml
  text: Let us test him with insolence and torture[b][a], so that we may know his gentleness and test his forbearance.
translation:
  language: fr
  text: Éprouvons-le par l’outrage et la torture, afin de connaître sa douceur et d’évaluer sa patience à supporter le mal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕβρει
  choice: par l’outrage
  rationale: ὕβρις désigne ici un traitement outrageant, insolent et abusif. « Outrage » conserve la force du terme grec et s’accorde naturellement avec « torture ».
- source_word: βασάνῳ
  choice: et la torture
  rationale: βάσανος peut désigner un tourment infligé comme moyen d’épreuve. « Torture » rend concrètement le procédé, sans répéter l’idée d’éprouver déjà portée par ἐτάσωμεν.
- source_word: ἐτάσωμεν
  choice: Éprouvons-le
  rationale: Le subjonctif exhortatif exprime une proposition collective. « Éprouvons-le » rend à la fois l’examen et la mise à l’épreuve par la souffrance.
- source_word: ἐπιείκειαν
  choice: douceur
  rationale: ἐπιείκεια évoque une disposition douce, mesurée et non agressive. « Douceur » est naturel en français moderne et convient à la réaction du juste face aux sévices.
- source_word: δικάσωμεν
  choice: mettre à l’épreuve
  rationale: Bien que δικάζω puisse signifier « juger », le contexte indique ici une évaluation obtenue par l’épreuve. Cette formulation préserve le parallélisme avec le premier verbe sans suggérer un verdict judiciaire définitif.
- source_word: ἀνεξικακίαν
  choice: patience à supporter le mal
  rationale: Le nom désigne précisément l’endurance patiente des torts sans représailles. La formulation explicite cette nuance, que le seul mot « patience » pourrait laisser trop générale.
theological_decisions:
- issue: Caractérisation morale de la réaction du juste persécuté
  choice: Distinguer « douceur » de « patience à supporter le mal ».
  alternative: « mansuétude » et « patience »
  rationale: 'Le grec présente deux qualités proches mais distinctes : une disposition douce et la capacité d’endurer le mal subi. Les distinguer préserve la tension éthique et le parallélisme sans leur imposer une interprétation confessionnelle.'
translation_notes:
  register: Français international moderne, digne et accessible. « Éprouvons-le » garde le ton délibératif des adversaires; « outrage » et « torture » rendent la violence morale et physique, tandis que la dernière expression explicite la portée particulière de ἀνεξικακία.
