  source_fidelity: Le premier impératif délibératif (« Éprouvons-le ») rend bien ἐτάσωμεν, et « par l’outrage et la torture » restitue correctement les deux instrumentaux ὕβρει καὶ βασάνῳ. « Douceur » est une traduction recevable de ἐπιείκεια. En revanche, « mettre à l’épreuve » pour δικάσωμεν efface la différence voulue avec ἐτάσωμεν, déjà rendu par « Éprouvons-le » ; le verbe grec conserve ici le sens d’évaluer ou de juger après observation.
