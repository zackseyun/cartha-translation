base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/023.yaml
  text: For God created man for incorruptibility[b][a], and made him in the image of his own nature.
translation:
  language: fr
  text: Car Dieu a créé l’être humain pour l’incorruptibilité[a], et il a fait de lui une image de sa propre nature[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour l’immortalité » ou « pour qu’il soit impérissable ». Le terme grec désigne ce qui n’est pas soumis à la corruption, à la destruction ou à la mort.
    reason: lexical_alternative
  - marker: b
    text: Ou « de son être propre » ou « de ce qui le caractérise en propre ». L’expression grecque est inhabituelle et peut recevoir plusieurs traductions proches.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκτισε
  choice: a créé
  rationale: Le verbe κτίζω désigne ici l’acte de faire venir à l’existence ; « créer » est naturel et précis dans ce contexte.
- source_word: τὸν ἄνθρωπον
  choice: l’être humain
  rationale: Le singulier grec a une portée représentative et désigne l’humanité. « L’être humain » conserve le singulier sans restreindre l’énoncé au sexe masculin.
- source_word: ἐπʼ ἀφθαρσίᾳ
  choice: pour l’incorruptibilité
  rationale: ἀφθαρσία exprime l’état de ce qui n’est soumis ni à la corruption ni à la destruction. « Incorruptibilité » maintient cette ampleur sémantique, tandis qu’« immortalité » mettrait davantage l’accent sur la seule absence de mort.
- source_word: εἰκόνα
  choice: une image
  rationale: « Image » conserve l’écho au récit de la création, et l’article indéfini rend naturellement le nom grec sans article.
- source_word: τῆς ἰδίας ἰδιότητος
  choice: de sa propre nature
  rationale: La formule grecque inhabituelle désigne ce qui est propre ou particulier à Dieu. « Sa propre nature » est intelligible en français tout en laissant les autres nuances possibles à la note.
- source_word: ἐποίησεν αὐτόν
  choice: il a fait de lui
  rationale: 'Cette construction française exprime directement le double accusatif grec : Dieu a fait de l’être humain une image.'
theological_decisions:
- issue: Portée anthropologique de τὸν ἄνθρωπον
  choice: Le singulier générique « l’être humain », qui renvoie à l’humanité
  alternative: « l’homme »
  rationale: Le verset formule une affirmation générale sur l’humanité dans le cadre de la création. « L’être humain » préserve le singulier représentatif et évite une ambiguïté moderne sur le sexe visé.
- issue: Sens de ἀφθαρσία
  choice: « incorruptibilité »
  alternative: « immortalité » ou « caractère impérissable »
  rationale: Le terme inclut l’absence de décomposition, de corruption et de mort. Le choix retenu ne réduit pas l’affirmation à une doctrine plus précise de l’immortalité de l’âme.
- issue: Sens de τῆς ἰδίας ἰδιότητος
  choice: « de sa propre nature »
  alternative: « de son être propre » ou « de ce qui le caractérise en propre »
  rationale: L’expression grecque est rare et difficile. Le texte principal adopte une formulation française claire, tandis que la note signale l’ambiguïté réelle sans définir plus précisément en quoi consiste l’image de Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec sans devenir artificielle. « Incorruptibilité » est un terme légèrement soutenu, mais il est conservé pour sa précision et expliqué en note.
