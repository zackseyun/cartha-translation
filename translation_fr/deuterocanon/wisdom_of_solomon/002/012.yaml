base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/012.yaml
  text: But let us lie in wait for the righteous man, because he is troublesome to us and opposes our deeds, and reproaches us for sins against the law, and charges us with sins against our training.
translation:
  language: fr
  text: Mais tendons un piège au juste[a], car il nous gêne et s’oppose à nos actes ; il nous reproche nos péchés contre la Loi et nous accuse de fautes contre l’éducation que nous avons reçue[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’homme juste ». Le singulier grec peut désigner une figure représentative du juste.
    reason: lexical_alternative
  - marker: b
    text: Le grec peut aussi se traduire par « des fautes contre notre formation » ou « contre notre discipline ». Le terme désigne l’éducation et la formation morale, et peut aussi comporter l’idée de discipline.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεδρεύσωμεν
  choice: tendons un piège
  rationale: Le subjonctif d’exhortation appelle une première personne du pluriel. « Tendre un piège » exprime le dessein hostile et secret sans limiter la scène à une embuscade physique.
- source_word: τὸν δίκαιον
  choice: au juste
  rationale: L’article et le singulier désignent ici une figure représentative. « Le juste » est naturel en français biblique moderne et conserve la forme masculine singulière du grec.
- source_word: δύσχρηστος
  choice: il nous gêne
  rationale: Dans ce contexte, l’adjectif signifie qu’il est incommode, pénible ou difficile à supporter pour les impies, plutôt qu’« inutile ».
- source_word: ἐναντιοῦται τοῖς ἔργοις ἡμῶν
  choice: s’oppose à nos actes
  rationale: Cette formulation conserve l’opposition active et la portée morale de ἔργα.
- source_word: ὀνειδίζει ἡμῖν
  choice: il nous reproche
  rationale: « Reprocher » rend la censure verbale sans ajouter l’idée de moquerie.
- source_word: ἁμαρτήματα νόμου
  choice: nos péchés contre la Loi
  rationale: Le génitif est compris comme indiquant des péchés commis contre la Loi. La majuscule signale ici la Loi comme norme religieuse reconnue dans le contexte.
- source_word: ἐπιφημίζει ἡμῖν
  choice: nous accuse de
  rationale: Le verbe exprime l’imputation d’une faute ou une accusation ; cette tournure est claire et naturelle en français.
- source_word: ἁμαρτήματα παιδείας ἡμῶν
  choice: des fautes contre l’éducation que nous avons reçue
  rationale: παιδεία peut désigner l’éducation, la formation ou la discipline. L’explicitation « que nous avons reçue » rend naturellement le possessif grec et met en évidence la formation morale trahie, sans effacer l’ambiguïté lexicale signalée en note.
theological_decisions:
- issue: Portée du singulier τὸν δίκαιον
  choice: le juste
  alternative: l’homme juste
  rationale: « Le juste » préserve le singulier masculin et permet une lecture représentative sans identifier explicitement le personnage à une figure particulière.
- issue: Sens moral de παιδεία
  choice: l’éducation que nous avons reçue
  alternative: notre formation / notre discipline
  rationale: Le contexte porte sur une faute éthique envers une formation reçue. « Éducation » reste assez large pour inclure l’instruction, l’éducation morale et la discipline, tandis que la note conserve les autres possibilités.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde la progression accusatoire du grec, tandis que le point-virgule allège la longue coordination. « Loi » est employé dans son sens religieux, sans préciser davantage l’identité des locuteurs ni résoudre la portée représentative du « juste ».
