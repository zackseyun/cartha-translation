base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/011.yaml
  text: But let our strength be the law of justice[a], for what is weak is shown to be useless.
translation:
  language: fr
  text: Mais que notre force soit la loi de la justice, car ce qui est faible se révèle inutile.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστω
  choice: que … soit
  rationale: L’impératif à la troisième personne de εἰμί se rend naturellement en français par « que … soit » dans cette déclaration exhortative.
- source_word: ἡμῶν ἡ ἰσχὺς
  choice: notre force
  rationale: ἰσχύς désigne la force ou la puissance; « force » conserve ici toute la portée du terme sans préciser indûment sa nature.
- source_word: νόμος
  choice: loi
  rationale: νόμος désigne une loi ou une norme directrice. « Loi » maintient la formulation provocatrice par laquelle les impies érigent leur force en principe du juste.
- source_word: τῆς δικαιοσύνης
  choice: de la justice
  rationale: Dans ce contexte social et normatif, δικαιοσύνη désigne naturellement la justice ou l’ordre juste. « Justice » convient au français courant et préserve l’ironie du propos.
- source_word: τὸ ἀσθενὲς
  choice: ce qui est faible
  rationale: L’adjectif neutre substantivé exprime une généralité; cette formulation française évite de le limiter arbitrairement à des personnes.
- source_word: ἄχρηστον
  choice: inutile
  rationale: ἄχρηστος signifie « sans utilité »; « inutile » exprime clairement le jugement cynique formulé par les locuteurs.
- source_word: ἐλέγχεται
  choice: se révèle
  rationale: Le passif de ἐλέγχω peut signifier être démontré, dévoilé ou reconnu. « Se révèle » rend naturellement le constat sans imposer une nuance judiciaire.
theological_decisions:
- issue: Sens de δικαιοσύνη dans la formule νόμος τῆς δικαιοσύνης
  choice: justice
  alternative: droiture
  rationale: 'Le contexte porte sur la norme qui détermine ce qui est juste dans les rapports humains. « Justice » est donc le rendu français le plus naturel, tout en laissant intacte la tension ironique: les impies prétendent faire de leur force la loi même de la justice.'
translation_notes:
  register: Français moderne, international et digne. La syntaxe conserve le parallélisme sentencieux du grec et le raisonnement brutal des locuteurs, sans expliciter davantage leur idéologie.
