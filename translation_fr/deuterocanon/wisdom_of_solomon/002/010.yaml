base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/010.yaml
  text: Let us oppress the righteous poor man[a]; let us not spare the widow[b], nor show regard for the gray hairs of an old man advanced in years.
translation:
  language: fr
  text: Opprimons le pauvre juste[a] ; n’épargnons pas la veuve et ne respectons pas les cheveux blancs d’un vieillard très âgé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le juste pauvre ». En grec, « pauvre » et « juste » qualifient étroitement la même personne.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les cheveux blancs d’un vieillard, [cheveux] de nombreuses années ». L’adjectif grec est formellement accordé avec « cheveux blancs » et souligne le grand âge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταδυναστεύσωμεν
  choice: Opprimons
  rationale: Le verbe exprime l’exercice abusif et dominateur du pouvoir sur autrui. « Opprimons » en conserve la force coercitive dans un français naturel.
- source_word: πένητα δίκαιον
  choice: le pauvre qui est juste
  rationale: Les deux adjectifs qualifient le même homme. La relative rend clairement cette double qualification tout en préservant l’ordre d’idée du grec.
- source_word: μὴ φεισώμεθα χήρας
  choice: n’épargnons pas la veuve
  rationale: φείδομαι signifie ici épargner, c’est-à-dire s’abstenir de faire du mal. Le singulier défini représente la veuve comme figure d’une catégorie vulnérable.
- source_word: μηδὲ ... ἐντραπῶμεν
  choice: et n’ayons aucun respect pour
  rationale: Dans ce contexte, ἐντρέπομαι évoque le respect ou la déférence plutôt qu’un simple sentiment intérieur de honte.
- source_word: πρεσβύτου
  choice: un vieillard
  rationale: Le terme désigne ici un homme âgé, non le titulaire d’une fonction. « Vieillard » convient au registre digne du passage.
- source_word: πολιάς πολυχρονίους
  choice: les cheveux blancs d’un vieillard chargé d’années
  rationale: La formulation conserve l’image concrète des cheveux blanchis et l’insistance de πολυχρονίους sur le grand âge.
theological_decisions:
- issue: Sens de δίκαιον dans le contraste entre les impies et leur victime
  choice: juste
  alternative: droit
  rationale: « Juste » maintient la dimension morale et religieuse de δίκαιος ainsi que son lien avec le champ lexical de la justice, sans limiter le mot au seul domaine judiciaire.
translation_notes:
  register: Français international moderne, clair et digne. Les impératifs exhortatifs rendent les subjonctifs délibératifs grecs. La formulation conserve le parallélisme, les catégories vulnérables visées et l’image concrète des cheveux blancs.
