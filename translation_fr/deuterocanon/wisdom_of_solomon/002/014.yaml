lexical_decisions:
- source_word: ἐγένετο
  choice: est devenu
  rationale: L’aoriste de γίνομαι indique ici qu’il en est venu à constituer un reproche pour eux ; « est devenu » rend naturellement en français cet état résultant.
- source_word: εἰς ἔλεγχον
  choice: un reproche vivant
  rationale: ἔλεγχος désigne un reproche qui met la faute en lumière. L’ajout idiomatique de « vivant » explicite que sa personne même fait office de reproche, sans donner au terme un sens judiciaire excessif.
- source_word: ἐννοιῶν
  choice: pensées
  rationale: ἐννοίαι peut désigner les pensées, les intentions ou les raisonnements intérieurs. « Pensées » est naturel et conserve l’étendue sémantique du grec.
- source_word: βαρύς
  choice: pénible
  rationale: Employé métaphoriquement, βαρύς exprime ce qui pèse et devient difficile à supporter ; « pénible » convient au français courant dans cette construction.
- source_word: βλεπόμενος
  choice: sa seule vue
  rationale: Le participe passif signifie littéralement « étant vu ». « Sa seule vue » exprime naturellement que le simple fait de le voir leur est difficile à supporter.
theological_decisions:
- issue: Référent du sujet sous-entendu
  choice: Il
  alternative: le juste / cet homme
  rationale: Le sujet est fourni par le contexte précédent et demeure implicite dans le grec. Le pronom « il » préserve cette continuité sans ajouter ici une désignation interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. « Reproche vivant » rend idiomatiquement la fonction personnelle exprimée par εἰς ἔλεγχον ; les notes conservent les possibilités plus littérales. La virgule finale respecte la continuité syntaxique avec le verset suivant.
