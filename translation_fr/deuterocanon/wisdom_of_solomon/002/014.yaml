  text: He became a reproof to our thoughts[a]; even being seen is burdensome to us[b],
translation:
  language: fr
  text: Il est devenu pour nous un reproche qui met à nu nos pensées[a] ; même le voir nous est pénible[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il est devenu pour nous un reproche à l’égard de nos raisonnements intérieurs. » Le grec ἔλεγχος peut désigner un reproche qui dévoile la faute ; ἐννοίαι peut désigner des pensées ou des raisonnements intérieurs.'
    reason: lexical_alternative
