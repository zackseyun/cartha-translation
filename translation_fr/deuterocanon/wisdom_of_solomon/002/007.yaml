    issue: La formulation « ne passe sans que nous en profitions » ajoute une proposition interprétative.
    rationale: Le grec μὴ παροδευσάτω ἡμᾶς dit littéralement que la fleur ne les dépasse/passe à côté d’eux ; il n’énonce pas explicitement le fait d’en profiter. Une formulation plus sobre préserve l’image et l’ambiguïté.
  - severity: low
    issue: « Vin coûteux » est un peu peu idiomatique dans ce contexte littéraire français.
    rationale: « Vin de grand prix » exprime naturellement la valeur élevée de πολυτελοῦς sans réduire le terme à une simple dépense.
