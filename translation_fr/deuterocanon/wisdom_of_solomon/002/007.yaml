base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/007.yaml
  text: Let us fill ourselves with costly wine and perfumes[a], and let no flower of spring pass us by.
translation:
  language: fr
  text: Rassasions-nous de vin de grand prix et de parfums[a] ; qu’aucune fleur du printemps ne nous échappe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’huiles parfumées » ou « d’onguents parfumés ». Le mot grec μύρων peut désigner diverses huiles ou préparations parfumées, associées ici au luxe.
    reason: Préciser l’étendue du sens de μύρων, que « parfums » ne restitue pas entièrement.
lexical_decisions:
- source_word: οἴνου πολυτελοῦς
  choice: vin coûteux
  rationale: Le génitif dépend de πλησθῶμεν et πολυτελοῦς exprime le prix élevé ou le caractère précieux du vin. « Vin coûteux » reste direct et souligne le luxe recherché.
- source_word: μύρων
  choice: parfums
  rationale: μύρον désigne une huile parfumée ou un onguent odorant. « Parfums » communique naturellement en français moderne le luxe et la sensualité du contexte, tandis qu’une note conserve les référents matériels possibles.
- source_word: πλησθῶμεν
  choice: rassasions-nous de
  rationale: Le subjonctif exhortatif à la première personne du pluriel appelle une invitation collective. « Rassasions-nous de » rend l’idée d’en prendre pleinement son plaisir sans suggérer seulement l’action physique de remplir.
- source_word: μὴ παροδευσάτω ἡμᾶς
  choice: qu’aucune … ne passe sans que nous en profitions
  rationale: La tournure grecque signifie littéralement qu’ils ne veulent laisser aucune fleur passer à côté d’eux. Cette formulation française restitue idiomatiquement leur volonté de ne manquer aucun plaisir.
- source_word: ἄνθος ἔαρος
  choice: fleur du printemps
  rationale: La traduction conserve l’image poétique et l’ordre conceptuel du grec, dans un registre digne mais accessible.
