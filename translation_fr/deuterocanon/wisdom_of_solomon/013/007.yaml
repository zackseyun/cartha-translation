base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/007.yaml
  text: For while moving among his works[a], they examine them closely, and they are persuaded by what they see, because the things being seen are beautiful.
translation:
  language: fr
  text: Car, vivant au milieu de ses œuvres, ils les examinent avec soin et se laissent convaincre par ce qu’ils voient, parce que les choses visibles sont belles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bonnes ». Le mot grec peut exprimer aussi bien la beauté que la bonté ; ici, « belles » convient au contexte centré sur la vue.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστρεφόμενοι
  choice: vivant au milieu de
  rationale: Le participe évoque la conduite ou la vie de personnes qui évoluent parmi les œuvres du Créateur. « Vivant au milieu de » conserve cette dimension concrète et expérientielle dans un français naturel.
- source_word: διεραυνῶσιν
  choice: ils les examinent avec soin
  rationale: Le verbe exprime une recherche approfondie et attentive. Cette formulation rend son intensité sans employer un terme trop technique.
- source_word: πείθονται
  choice: se laissent convaincre
  rationale: 'Cette tournure garde la valeur moyenne ou passive du verbe : les observateurs sont gagnés par l’évidence visuelle.'
- source_word: τῇ ὄψει
  choice: par ce qu’ils voient
  rationale: Le datif désigne ici le moyen de la persuasion, la vue ou l’apparence. La formulation retenue est idiomatique et maintient l’accent sur l’expérience visuelle.
- source_word: καλά
  choice: belles
  rationale: καλός peut signifier « beau » ou « bon ». Puisque le contexte immédiat insiste sur la vue, le sens esthétique est ici privilégié, tandis que l’autre possibilité est signalée en note.
- source_word: τὰ βλεπόμενα
  choice: les choses visibles
  rationale: Le participe substantivé désigne les réalités qui se donnent à voir. « Les choses visibles » est clair, naturel et proche du grec.
theological_decisions:
- issue: Référent de αὐτοῦ
  choice: « ses œuvres », avec Dieu ou le Créateur comme référent personnel
  alternative: Comprendre le possessif de façon plus abstraite selon le contexte
  rationale: L’argument environnant remonte des réalités créées à leur auteur. Le possessif masculin conserve ce référent personnel sans ajouter de précision doctrinale absente du verset.
- issue: Portée de καλά
  choice: « belles »
  alternative: « bonnes »
  rationale: La mention explicite de la vue favorise la nuance esthétique, mais la polysémie du grec demeure réelle et est conservée dans une note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase suit étroitement le mouvement du grec tout en évitant les calques peu naturels.
