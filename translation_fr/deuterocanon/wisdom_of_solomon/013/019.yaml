base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/019.yaml
  text: But concerning provision and work and success of his hands[b][a], he asks strength from that thing most inactive with his hands.
translation:
  language: fr
  text: Mais, pour ses moyens de subsistance, son travail et la réussite de ses mains[a], il demande à ce qui est le plus inerte[b] de donner de l’efficacité à ses mains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « la réussite des mains », c’est-à-dire la réussite dans ce qu’il fait ou fabrique.
    reason: lexical_alternative
  - marker: b
    text: Ou « ce qui est totalement incapable d’agir ». Le superlatif grec souligne l’impuissance absolue de l’idole.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορισμοῦ
  choice: moyens de subsistance
  rationale: Le nom désigne l’acquisition ou les ressources que l’on se procure. « Moyens de subsistance » exprime naturellement l’idée sans la réduire au profit financier.
- source_word: ἐργασίας
  choice: travail
  rationale: Équivalent français courant et suffisamment large pour le travail, l’activité ou l’ouvrage.
- source_word: χειρῶν ἐπιτυχίας
  choice: réussite de ses mains
  rationale: Cette formulation proche du grec conserve l’image des mains et l’ironie du contexte; elle désigne la réussite de ce que la personne fait ou fabrique.
- source_word: τὸ ἀδρανέστατον
  choice: ce qui est le plus inerte
  rationale: Le neutre et le superlatif présentent l’idole comme un objet totalement incapable d’agir. « Inerte » préserve cette force sans expliciter davantage que le grec.
- source_word: ταῖς χερσὶν
  choice: pour ses mains
  rationale: Le datif indique vraisemblablement les mains auxquelles l’efficacité demandée doit profiter. Cette lecture conserve aussi la répétition intentionnelle de « mains » dans le verset.
- source_word: εὐδράνειαν
  choice: efficacité
  rationale: Ce nom rare évoque l’aptitude à agir efficacement et forme un contraste lexical avec ἀδρανέστατον, « le plus inerte ».
- source_word: αἰτεῖται
  choice: il demande … à
  rationale: Le verbe signifie demander ou solliciter; la construction française distingue naturellement ce qui est demandé de l’objet auquel la demande est adressée.
theological_decisions:
- issue: Référent de la désignation neutre τὸ ἀδρανέστατον
  choice: L’expression désigne l’idole comme l’objet inerte auquel l’homme adresse sa demande.
  alternative: Une désignation plus générale d’une image divine inactive, sans insistance sur son inertie matérielle.
  rationale: 'Le contexte immédiat critique les images fabriquées, et le neutre superlatif souligne l’ironie: l’homme attend une capacité d’action d’un objet qui ne peut absolument pas agir.'
- issue: Rapport de ταῖς χερσὶν avec εὐδράνειαν
  choice: L’homme demande de l’efficacité pour ses mains.
  alternative: L’homme formule sa demande avec ses mains.
  rationale: La proximité syntaxique et le contraste entre εὐδράνεια et ἀδρανέστατον favorisent une efficacité sollicitée pour les mains; la formulation garde toutefois la répétition du grec sans développer la nature exacte de cette efficacité.
translation_notes:
  register: Français international moderne, clair et digne. La structure reste proche du grec afin de préserver la répétition de « mains » et l’opposition ironique entre l’efficacité demandée et l’inertie de l’idole.
