translation:
  language: fr
  text: ou bien il le façonna à l’image de quelque animal de peu de valeur[a], l’enduisit d’ocre rouge et d’un colorant rouge, en rougit la surface et recouvrit toute imperfection qui s’y trouvait[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quelque animal commun » ou « quelque animal bon marché » ; le grec souligne le caractère bas, commun ou peu coûteux de l’animal représenté.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec nomme deux matières colorantes : l’« ocre rouge » (μίλτος) et le φῦκος, un colorant ou fard rouge dont l’identification précise reste incertaine.'
    reason: cultural_note
lexical_decisions:
- source_word: ζώῳ τινὶ εὐτελεῖ
  choice: quelque animal de peu de valeur
  rationale: ζῷον désigne un animal ou être vivant, tandis que εὐτελής évoque ce qui est commun, vil ou de faible valeur. Cette formulation conserve la nuance dépréciative sans suggérer nécessairement une indignité morale.
- source_word: ὡμοίωσεν αὐτό
  choice: il lui donna la forme de
  rationale: Le verbe ὁμοιόω signifie rendre semblable ou assimiler. Dans le contexte du travail d’un artisan, « donner la forme de » exprime naturellement la fabrication d’une image ressemblant à un animal.
- source_word: καταχρίσας
  choice: il l’enduisit / recouvrit
  rationale: Le participe décrit l’application d’une substance sur une surface. « Enduire » convient aux pigments, tandis que « recouvrir » rend naturellement la seconde occurrence appliquée aux taches, sans connotation rituelle.
- source_word: μίλτῳ
  choice: ocre rouge
  rationale: μίλτος désigne une terre ou un pigment rouge, généralement l’ocre rouge.
- source_word: φύκει
  choice: pigment
  rationale: φῦκος peut désigner une matière colorante rouge, notamment un fard ou pigment historiquement associé à une origine marine. « Pigment » conserve ici la fonction matérielle sans imposer une identification incertaine.
- source_word: ἐρυθῆνας χρῶαν αὐτοῦ
  choice: en rougit la surface
  rationale: χρόα peut désigner la peau, le teint, l’aspect extérieur ou la surface. Pour une effigie, « surface » est idiomatique et évite une personnification excessive.
- source_word: πᾶσαν κηλῖδα τὴν ἐν αὐτῷ
  choice: toute tache qui s’y trouvait
  rationale: κηλίς signifie tache, marque ou défaut visible. La tournure française préserve ἐν αὐτῷ sans trancher artificiellement entre une tache « sur » l’objet et une imperfection « dans » sa matière.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. Le point-virgule clarifie la succession des gestes de l’artisan. Les deux occurrences de καταχρίω sont rendues selon leur complément pour éviter une répétition maladroite tout en conservant l’idée d’un revêtement appliqué.
