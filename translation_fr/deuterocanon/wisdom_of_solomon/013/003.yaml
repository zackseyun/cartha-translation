base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/003.yaml
  text: If, then, delighting in their beauty, they supposed them to be gods, let them know how much better than these is their Master; for the creator of beauty created them.
translation:
  language: fr
  text: Si donc, charmés par leur beauté, ils les ont pris pour des dieux, qu’ils sachent de combien le Maître de ces réalités leur est supérieur, car le Créateur de la beauté les a créées.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ καλλονῇ τερπόμενοι
  choice: charmés par leur beauté
  rationale: Rend naturellement en français le plaisir et l’émerveillement suscités par la beauté des réalités créées.
- source_word: θεοὺς ὑπελάμβανον
  choice: ils les ont pris pour des dieux
  rationale: Exprime clairement le jugement erroné indiqué par ὑπολαμβάνω, sans surcharger le texte.
- source_word: ὁ δεσπότης
  choice: leur Maître
  rationale: Préserve l’idée de souveraineté et la relation implicite entre les choses créées et celui qui les domine.
- source_word: βελτίων
  choice: supérieur
  rationale: Dans cette comparaison entre le Créateur et les créatures, « supérieur » rend mieux la portée qualitative de βελτίων que le littéral « meilleur ».
- source_word: ὁ τοῦ κάλλους γενεσιούργης
  choice: celui qui a donné naissance à la beauté
  rationale: Conserve l’image rare et forte de γενεσιούργης, plus précise ici que le simple « créateur de la beauté », tout en restant intelligible.
- source_word: ἔκτισεν αὐτά
  choice: qui les a créés
  rationale: Rend directement l’acte créateur; l’accord masculin renvoie en français aux objets pris pour « des dieux ».
theological_decisions:
- issue: Rapport entre la beauté créée et son auteur
  choice: celui qui a donné naissance à la beauté
  alternative: le créateur de la beauté
  rationale: Le choix retenu maintient la distinction entre les belles réalités créées et l’origine même de leur beauté, sans développer une doctrine absente du verset.
- issue: Titre divin δεσπότης
  choice: Maître
  alternative: Seigneur
  rationale: « Maître » conserve le sens de possession et d’autorité de δεσπότης, tandis que « Seigneur » pourrait être confondu avec d’autres titres grecs usuels.
translation_notes:
  register: 'Français moderne, soutenu mais accessible. La phrase garde la progression argumentative du grec : admiration de la beauté, erreur d’identification, puis remontée vers la supériorité du Créateur.'
