    text: 'Littéralement : « les présidents du monde », c’est-à-dire ceux qui y président ou le gouvernent.'
    reason: πρυτάνεις est un terme de présidence et d’autorité dont aucun équivalent français courant ne restitue seul toutes les nuances.
  revision_rationale: La révision préserve l’ordre global du grec, rend la série de ἤ par « soit … soit … », améliore l’idiomaticité de la désignation de l’air, et place explicitement « maîtres du monde » en apposition à « dieux ».
