base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/002.yaml
  text: Instead[a], they considered either fire, or wind, or swift air, or the circle of the stars, or violent water, or the lights of heaven, to be gods[c][b], rulers of the world.
translation:
  language: fr
  text: Mais ils ont pris soit le feu, soit le vent, soit l’air en mouvement rapide, soit le cercle des étoiles[a], soit l’eau impétueuse, soit les luminaires du ciel, pour des dieux, maîtres du monde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la course circulaire des étoiles ».'
    reason: Le grec κύκλον peut désigner aussi bien un cercle qu’un parcours circulaire.
  - marker: b
    text: 'Littéralement : « les présidents du monde », c’est-à-dire ceux qui y président ou le gouvernent.'
    reason: πρυτάνεις est un terme de présidence et d’autorité dont aucun équivalent français courant ne restitue seul toutes les nuances.
lexical_decisions:
- source_word: ἀλλʼ ἢ
  choice: Mais ... ou
  rationale: Le grec marque le contraste avec le verset précédent et ouvre une énumération de possibilités. « Mais » conserve le lien adversatif, tandis que « ou » rend naturellement la série.
- source_word: πῦρ
  choice: le feu
  rationale: Terme élémentaire direct, rendu sans développement.
- source_word: πνεῦμα
  choice: le vent
  rationale: Dans cette liste de réalités naturelles divinisées, « vent » convient mieux que « esprit » ou « souffle » et évite une connotation personnelle étrangère au contexte.
- source_word: ταχινὸν ἀέρα
  choice: l’air rapide
  rationale: Cette formulation maintient la distinction grecque entre πνεῦμα et ἀήρ et conserve l’idée de vitesse exprimée par ταχινόν.
- source_word: κύκλον ἄστρων
  choice: le cercle des étoiles
  rationale: Rendu formel qui préserve l’image cosmologique sans décider s’il s’agit de leur disposition circulaire ou de leur course.
- source_word: βίαιον ὕδωρ
  choice: l’eau impétueuse
  rationale: « Impétueuse » exprime la puissance violente de βίαιον dans un français naturel et digne.
- source_word: φωστῆρας οὐρανοῦ
  choice: les luminaires du ciel
  rationale: « Luminaires » désigne avec précision les corps célestes qui donnent de la lumière et préserve le registre élevé du texte.
- source_word: πρυτάνεις κόσμου
  choice: les maîtres du monde
  rationale: Le syntagme est gardé en apposition à « dieux » et exprime ceux qui président au monde ou le gouvernent, sans transformer l’apposition en proposition verbale.
- source_word: θεοὺς ἐνόμισαν
  choice: ils ont pris pour des dieux
  rationale: Expression française naturelle qui rend le jugement erroné exprimé par ἐνόμισαν avec son attribut à l’accusatif.
theological_decisions:
- issue: Sens de πνεῦμα dans l’énumération
  choice: le vent
  alternative: l’esprit ; le souffle
  rationale: Le contexte rassemble des éléments, forces naturelles et corps célestes pris pour des dieux. « Vent » préserve ce sens contextuel sans introduire l’idée d’un être spirituel.
- issue: Rapport entre πρυτάνεις κόσμου et θεούς
  choice: des dieux ... les maîtres du monde
  alternative: des dieux qui gouvernent le monde
  rationale: 'L’apposition française conserve la tension syntaxique du grec : les réalités énumérées sont tenues pour des dieux et, en apposition, pour les autorités présidant au monde.'
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe en apposition respecte la structure grecque. « Luminaires » est légèrement soutenu, mais précis et bien établi dans le registre biblique français.
