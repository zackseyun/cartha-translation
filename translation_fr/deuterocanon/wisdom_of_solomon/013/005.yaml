base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/005.yaml
  text: For from the greatness and beauty of created things[a], their Creator is seen by analogy.
translation:
  language: fr
  text: Car c’est à partir de la grandeur et de la beauté des choses créées que leur Créateur est perçu par analogie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « leur Créateur est discerné de manière correspondante ». Le grec exprime une connaissance par correspondance : les qualités des choses créées permettent de discerner leur Créateur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: à partir de
  rationale: 'Exprime la source ou le fondement de la perception : la réflexion part des réalités créées.'
- source_word: μεγέθους
  choice: grandeur
  rationale: Rend l’ampleur et la majesté perceptibles dans les œuvres, sans limiter le sens à leur taille physique.
- source_word: καλλονῆς
  choice: beauté
  rationale: Équivalent français direct, naturel et suffisamment large.
- source_word: κτισμάτων
  choice: choses créées
  rationale: Conserve le pluriel et n’enferme pas le référent dans les seuls êtres vivants.
- source_word: ἀναλόγως
  choice: par analogie
  rationale: Préserve l’idée d’une connaissance correspondante, inférée des qualités des œuvres à leur auteur.
- source_word: ὁ γενεσιουργὸς αὐτῶν
  choice: celui qui les a créées
  rationale: Rend naturellement le rare γενεσιουργός et rattache clairement αὐτῶν aux choses créées, sans imposer un titre technique.
- source_word: θεωρεῖται
  choice: on peut contempler
  rationale: Le verbe désigne une perception attentive ou intellectuelle; la tournure française exprime l’accessibilité de cette contemplation sans suggérer une vision physique.
theological_decisions:
- issue: Portée de la révélation naturelle
  choice: on peut, par analogie, contempler celui qui les a créées
  alternative: leur Créateur se laisse voir par analogie
  rationale: La formulation maintient l’affirmation que l’auteur des réalités créées est discernable à partir d’elles, sans préciser la portée salvifique de cette connaissance ni transformer l’analogie en démonstration exhaustive.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation évite à la fois le calque lourd « le générateur de celles-ci » et une lecture purement visuelle de θεωρεῖται.
