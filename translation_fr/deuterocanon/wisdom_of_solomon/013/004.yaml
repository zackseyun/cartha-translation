base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/004.yaml
  text: But if they were astonished by their power and activity[a], let them understand from them how much more powerful is the one who made them;
translation:
  language: fr
  text: Mais si leur puissance et leur activité[a] les ont frappés d’étonnement, qu’ils comprennent, à partir de ces choses, à quel point celui qui les a faites est plus puissant encore.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur puissance et leur action ». Le grec associe δύναμις à ἐνέργεια pour évoquer à la fois la force de ces réalités et leur fonctionnement effectif.
    reason: alternative_lexicale
lexical_decisions:
- source_word: δυνάμει
  choice: puissance
  rationale: Le terme désigne ici la force impressionnante des réalités créées et maintient le lien avec le comparatif δυνατώτερός, rendu par « plus puissant ».
- source_word: ἐνεργείᾳ
  choice: activité
  rationale: Le nom évoque leur action effective ou leur fonctionnement. « Activité » est naturel en français et forme avec « puissance » un couple distinct sans imposer un sens philosophique technique.
- source_word: ἐκπλαγέντες
  choice: les ont frappés d’étonnement
  rationale: Cette tournure restitue la vive impression exprimée par le participe grec tout en restant idiomatique.
- source_word: νοησάτωσαν
  choice: qu’ils comprennent
  rationale: L’impératif invite à tirer rationnellement une conclusion à partir des réalités observées.
- source_word: ἀπʼ αὐτῶν
  choice: à partir de ces choses
  rationale: La formulation explicite sobrement que les réalités précédemment mentionnées servent de point de départ au raisonnement, sans préciser davantage leur identité.
- source_word: πόσῳ
  choice: à quel point … plus … encore
  rationale: Cette construction française exprime clairement l’intensité comparative et l’inférence du créé à son auteur.
- source_word: ὁ κατασκευάσας αὐτὰ
  choice: celui qui les a façonnées
  rationale: « Façonner » rend l’idée d’une réalisation intentionnelle sans introduire dans la proposition le nom « Dieu » ni le titre « Créateur », absents du grec.
- source_word: δυνατώτερός
  choice: plus puissant encore
  rationale: Le comparatif reprend directement la « puissance » des choses et souligne la supériorité de celui qui les a façonnées.
theological_decisions:
- issue: Identification implicite de celui qui a façonné les réalités
  choice: celui qui les a façonnées
  alternative: Dieu, leur Créateur
  rationale: Le grec désigne cet agent par une proposition descriptive plutôt que par un nom ou un titre explicite. La traduction conserve ainsi le mouvement argumentatif qui va des réalités observées à celui qui les a faites.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve le raisonnement comparatif du grec et son référent descriptif, sans explicitation doctrinale.
