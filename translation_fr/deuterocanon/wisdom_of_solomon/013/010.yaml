base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/010.yaml
  text: But miserable are they[a], and their hopes are among the dead, who called gods the works of human hands—gold and silver, the product of skill, and images of animals, or a useless stone[b], the work of an ancient hand.
translation:
  language: fr
  text: 'Mais ils sont malheureux, et leurs espoirs sont parmi les morts[a], eux qui ont appelé dieux des œuvres faites par des mains humaines : de l’or et de l’argent façonnés avec art, des représentations d’animaux, ou une pierre inutile, œuvre d’une main d’autrefois[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « leurs espoirs reposent sur des choses mortes » ou « leurs espoirs sont avec les morts ». La formule grecque, très concise, peut évoquer à la fois les idoles sans vie et la vanité liée à la mort.'
    reason: alternative_reading
  - marker: b
    text: L’expression « œuvre d’une main d’autrefois » peut désigner une idole de pierre façonnée il y a longtemps, en soulignant à la fois son ancienneté et son origine purement humaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταλαιπώροι
  choice: malheureux
  rationale: Rend l’état misérable et la force dénonciatrice du grec dans un français moderne, sans archaïsme excessif.
- source_word: ἐν νεκροῖς αἱ ἐλπίδες αὐτῶν
  choice: leurs espoirs sont parmi les morts
  rationale: Conserve l’image frappante et l’ambiguïté du pluriel νεκροῖς, qui peut évoquer les réalités sans vie aussi bien que les morts.
- source_word: οἵτινες ἐκάλεσαν θεοὺς
  choice: eux qui ont appelé dieux
  rationale: Préserve la force directe de ἐκάλεσαν et le lien prédicatif avec les objets énumérés.
- source_word: ἔργα χειρῶν ἀνθρώπων
  choice: des œuvres faites par des mains humaines
  rationale: Reproduit l’image biblique de la fabrication humaine tout en rendant explicitement le sens générique de ἀνθρώπων.
- source_word: τέχνης ἐμμελέτημα
  choice: ouvrages d’un art habile
  rationale: Exprime une réalisation soigneusement travaillée par le savoir-faire humain, sans réduire τέχνη aux beaux-arts.
- source_word: ἀπεικάσματα ζώων
  choice: des représentations d’animaux
  rationale: Rend clairement des figures ou images reproduisant des êtres vivants, ici naturellement compris comme des animaux.
- source_word: λίθον ἄχρηστον
  choice: une pierre inutile
  rationale: Traduit directement l’absence d’utilité soulignée par ἄχρηστον et maintient la pointe polémique contre l’idole.
- source_word: χειρὸς ἔργον ἀρχαίας
  choice: œuvre d’une main d’autrefois
  rationale: Conserve la construction compacte du grec et l’idée d’une fabrication remontant à une époque ancienne, dans une formulation française intelligible.
theological_decisions:
- issue: Référent de « leurs espoirs sont parmi les morts »
  choice: Maintenir la métaphore sans préciser si « les morts » désigne surtout des idoles inertes ou les morts eux-mêmes.
  alternative: « leurs espoirs reposent sur des choses mortes » ou « leurs espoirs sont avec les morts »
  rationale: La formulation grecque est concise et peut délibérément associer l’inertie des idoles à la vanité mortelle de l’espérance placée en elles.
- issue: Portée de ἀνθρώπων dans l’expression relative aux mains
  choice: Employer « mains humaines ».
  alternative: « mains d’hommes »
  rationale: Le terme désigne ici les êtres humains en général, et non spécifiquement des personnes de sexe masculin.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe garde la vigueur de l’accusation et l’énumération grecque. « Parmi les morts » et « une main d’autrefois » préservent les formulations inhabituelles du texte source, accompagnées de notes explicatives.
