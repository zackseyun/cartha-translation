base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/011.yaml
  text: Or if some woodcutter[a], a carpenter, has sawed down a manageable tree and skillfully stripped off all its bark, and with proper craftsmanship made a useful vessel for the service of life[b],
translation:
  language: fr
  text: Ou encore, un bûcheron, qui est aussi charpentier, a scié un arbre facile à travailler[a], en a habilement enlevé toute l’écorce et, le façonnant avec soin, en a fait un objet utile pour les besoins de la vie[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « facile à manier » ; l’adjectif grec peut désigner un arbre ou un bois que l’on manipule ou travaille aisément.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « pour le service de la vie » ; l’expression désigne les besoins pratiques de la vie humaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑλοτόμος
  choice: bûcheron
  rationale: Le composé désigne celui qui coupe du bois; « bûcheron » est le terme français moderne et naturel.
- source_word: τέκτων
  choice: qui est aussi charpentier
  rationale: Dans ce contexte de travail du bois, le sens spécialisé de « charpentier » convient; la tournure appositive explicite que les deux termes désignent la même personne.
- source_word: εὐκίνητον φυτὸν
  choice: un arbre facile à travailler
  rationale: φυτὸν désigne ici naturellement un arbre, tandis que εὐκίνητον évoque un matériau maniable ou aisément ouvrable sans imposer le seul sens physique de « facile à déplacer ».
- source_word: ἐκπρίσας
  choice: scie
  rationale: Le verbe indique une coupe effectuée à la scie; le présent de narration s’intègre naturellement à la longue construction conditionnelle du passage.
- source_word: περιέξυσεν εὐμαθῶς πάντα τὸν φλοιὸν αὐτοῦ
  choice: en enlève habilement toute l’écorce
  rationale: Le verbe exprime l’action de racler ou retirer tout autour; avec l’écorce comme objet, « enlever » rend clairement le résultat, et « habilement » conserve la compétence suggérée par l’adverbe.
- source_word: τεχνησάμενος εὐπρεπῶς
  choice: le façonnant avec soin
  rationale: La formulation rend à la fois l’exercice du savoir-faire artisanal et l’idée d’un travail convenable ou soigné, sans exagérer la dimension esthétique.
- source_word: κατεσκεύασεν χρήσιμον σκεῦος
  choice: en fait un objet utile
  rationale: σκεῦος reste générique et peut désigner divers ustensiles ou récipients; « objet » évite de préciser indûment sa forme ou sa fonction.
- source_word: εἰς ὑπηρεσίαν ζωῆς
  choice: aux besoins de la vie quotidienne
  rationale: L’expression vise le service pratique de la vie humaine; cette traduction idiomatique en communique le sens ordinaire sans donner à « service » une nuance religieuse.
theological_decisions:
- issue: Description du travail humain ordinaire préparant l’argument ultérieur sur la fabrication des idoles
  choice: Conserver ici une description neutre et pratique du travail du bois.
  alternative: Introduire un vocabulaire péjoratif annonçant explicitement la critique de l’idolâtrie.
  rationale: Ce verset décrit encore la fabrication légitime d’un objet utile. La critique théologique se développe dans la suite et ne doit pas être anticipée dans la traduction.
translation_notes:
  register: Français international moderne, fluide et digne. La phrase conserve la succession des gestes artisanaux et la virgule finale, puisque le raisonnement se poursuit au verset suivant. Les marqueurs [a] et [b] figurent bien dans le texte principal.
