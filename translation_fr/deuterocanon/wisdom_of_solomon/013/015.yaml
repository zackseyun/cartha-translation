  source_fidelity: Le grec indique que l’artisan place l’image/idole dans le mur et la sécurise avec du fer. Dans le projet, « il la plaça » peut grammaticalement reprendre « demeure », et la décision lexicale affirme même à tort que ce pronom reprend l’emplacement. Cela obscurcit, voire inverse, l’objet placé. Une reprise explicite de « l’idole » rétablit sans ambiguïté l’objet sous-entendu par les pronoms grecs.
