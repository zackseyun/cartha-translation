  text: And after making for it a dwelling fit for it[a], he set it in a wall, securing it with iron.
translation:
  language: fr
  text: Après avoir fait pour l’idole une demeure qui lui convenait[a], il installa l’idole dans un mur et la fixa avec du fer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une demeure digne d’elle » ou « une demeure adaptée à l’idole ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσας
  choice: Après lui avoir fait
  rationale: Le participe aoriste exprime une action antérieure au verbe principal; cette tournure la restitue naturellement en français.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom renvoie à l’idole fabriquée. Le français exige ici un pronom selon le genre grammatical de ce référent, sans lui attribuer pour autant une personnalité réelle.
- source_word: αὐτοῦ ἄξιον
  choice: qui lui convenait
  rationale: ἄξιος peut signifier « digne de » ou « approprié à ». « Qui lui convenait » exprime l’adéquation tout en gardant l’ironie du contexte.
- source_word: οἴκημα
  choice: demeure
  rationale: Le terme désigne un lieu d’habitation; « demeure » conserve cette image sans préciser indûment qu’il s’agit d’un sanctuaire.
- source_word: ἐν τοίχῳ
  choice: dans un mur
  rationale: ἐν suivi du datif indique naturellement le lieu, probablement un emplacement ou une niche dans le mur.
- source_word: ἔθηκεν
  choice: il la plaça
  rationale: « Placer » rend simplement l’installation de l’objet. Le pronom féminin reprend naturellement « demeure » comme emplacement immédiat, tout en laissant comprendre que l’objet y est installé.
- source_word: ἀσφαλισάμενος
  choice: la fixa
  rationale: Le participe indique que l’artisan rend l’objet stable ou sûr lors de sa mise en place; « fixer » est idiomatique dans ce contexte.
- source_word: σιδήρῳ
  choice: avec du fer
  rationale: Le datif est instrumental. Cette formulation garde la concision du grec sans spécifier le type de ferrure.
theological_decisions:
- issue: Pronom employé pour l’idole
  choice: Pronoms déterminés par le genre grammatical français, sans personnification intentionnelle
  alternative: Employer systématiquement une désignation explicite comme « l’objet » ou « l’idole »
  rationale: Contrairement à l’anglais, le français ne possède pas de pronom neutre ordinaire équivalent à « it ». La reprise pronominale respecte donc le genre grammatical sans conférer de personnalité à l’image fabriquée.
- issue: Valeur de αὐτοῦ ἄξιον
  choice: « qui lui convenait »
  alternative: « digne d’elle »
  rationale: Le grec permet une lecture évaluative (« digne de ») ou fonctionnelle (« approprié à »). Le texte principal retient une formulation française naturelle, tandis que la note préserve l’autre nuance et l’ironie possible.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la succession du participe puis du verbe principal. « Demeure » maintient l’ironie d’un logement construit pour une image inerte; la note signale l’ambiguïté de ἄξιος.
