base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/009.yaml
  text: For if they had power to know so much that they could speculate about the age, how did they not more quickly find its Master?
translation:
  language: fr
  text: Car, s’ils ont été capables d’en savoir assez pour pouvoir conjecturer sur le monde[a], comment n’ont-ils pas trouvé plus tôt le Maître de toutes ces choses ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’âge ». Le mot grec peut désigner un âge, le monde ou l’univers.'
    reason: Préserve l’ambiguïté sémantique de αἰών sans ajouter l’idée absente de « présent »; le contexte cosmologique rend « monde » naturel dans le texte principal.
lexical_decisions:
- source_word: τοσοῦτον ἴσχυσαν εἰδέναι
  choice: ont été capables d’en savoir assez
  rationale: Rend la capacité exprimée par ἴσχυσαν et le degré indiqué par τοσοῦτον dans un français naturel.
- source_word: στοχάσασθαι
  choice: explorer
  rationale: Le verbe désigne ici une recherche intellectuelle fondée sur l’observation et le raisonnement; « explorer » reste accessible sans réduire le sens à une simple conjecture.
- source_word: τὸν αἰῶνα
  choice: l’univers
  rationale: Dans ce contexte cosmologique, αἰών désigne vraisemblablement l’ordre du monde ou l’univers plutôt qu’une période temporelle; une note conserve l’ambiguïté lexicale.
- source_word: τὸν τούτων δεσπότην
  choice: celui qui en est le Maître
  rationale: Conserve le titre δεσπότης et explicite naturellement en français le rapport entre le Maître et les réalités observées.
- source_word: τάχιον
  choice: plus vite
  rationale: Préserve la valeur comparative de l’adverbe grec.
theological_decisions:
- issue: Identification du Maître de l’univers
  choice: celui qui en est le Maître
  alternative: leur Souverain
  rationale: La formulation maintient la référence implicite à Dieu sans ajouter de titre divin absent du grec.
- issue: Portée de αἰών
  choice: l’univers avec note
  alternative: le siècle / l’âge
  rationale: Le contexte immédiat porte sur la connaissance de la création; le texte principal privilégie donc le sens cosmologique tout en signalant le sens littéral et l’ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. La question rhétorique et le contraste entre connaissance du cosmos et méconnaissance de son Maître sont conservés.
