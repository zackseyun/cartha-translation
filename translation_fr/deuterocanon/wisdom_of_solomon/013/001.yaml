base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/001.yaml
  text: For all men are by nature futile, in whom there was ignorance of God; and from the good things that are seen they were not able to know the One who is, nor by paying attention to his works did they recognize the craftsman.
translation:
  language: fr
  text: 'En effet, tous les êtres humains sont vains par nature : ils étaient dans l’ignorance de Dieu et, à partir des biens visibles, n’ont pas pu connaître Celui qui est ; ils n’ont pas non plus reconnu l’Artisan en prêtant attention à ses œuvres.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μάταιοι
  choice: vains
  rationale: Le terme exprime ici la vacuité et l’inanité du raisonnement humain, plutôt qu’un simple manque d’intelligence.
- source_word: φύσει
  choice: par nature
  rationale: Traduction directe, sans préciser davantage si la formule vise la condition humaine ou une disposition inhérente.
- source_word: πάντες ἄνθρωποι
  choice: tous les êtres humains
  rationale: Formulation inclusive et naturelle qui rend l’universalité de ἄνθρωποι.
- source_word: τὸν ὄντα
  choice: Celui qui est
  rationale: Conserve la tournure substantivée et sa possible résonance théologique, sans la réduire à « Dieu » ou à « celui qui existe ».
- source_word: τοῖς ἔργοις προσχόντες
  choice: en considérant ses œuvres
  rationale: Rend l’idée d’appliquer son attention aux œuvres; le possessif explicite naturellement le lien avec l’Artisan dans ce contexte.
- source_word: τὸν τεχνίτην
  choice: l’Artisan
  rationale: « Artisan » rend la personne habile qui façonne ses ouvrages et préserve la métaphore créatrice.
theological_decisions:
- issue: Portée de τὸν ὄντα
  choice: Celui qui est
  alternative: celui qui existe
  rationale: La formulation retenue préserve à la fois le sens ontologique et l’éventuelle allusion au langage biblique du nom divin, sans trancher entre eux.
- issue: Sens de φύσει
  choice: par nature
  alternative: naturellement
  rationale: « Par nature » maintient l’ambiguïté du grec concernant la condition humaine, au lieu d’en faire seulement un adverbe de manière.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure rhétorique grecque est conservée, avec une ponctuation française fluide. Les majuscules à « Celui » et « Artisan » signalent leur référent divin sans ajouter de titre absent du texte.
