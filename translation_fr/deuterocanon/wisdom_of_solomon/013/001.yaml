revisions:
- from: 'Oui, vains par nature sont tous les êtres humains chez qui se trouve l’ignorance de Dieu : à partir des biens visibles, ils n’ont pas été capables de connaître Celui qui est, et, en considérant ses œuvres, ils n’ont pas reconnu l’Artisan.'
  to: 'En effet, tous les êtres humains sont vains par nature : ils étaient dans l’ignorance de Dieu et, à partir des biens visibles, n’ont pas pu connaître Celui qui est ; ils n’ont pas non plus reconnu l’Artisan en prêtant attention à ses œuvres.'
  rationale: La révision rend la syntaxe française plus naturelle, exprime l’imparfait grec par « étaient », et restitue plus précisément l’attention portée aux œuvres. Elle maintient les choix prudents « vains », « par nature », « Celui qui est » et « Artisan », sans résoudre de manière doctrinale la portée de τὸν ὄντα.
