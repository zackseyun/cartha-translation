revisions:
- from: Pour obtenir la vie, il juge digne ce qui est mort ; pour obtenir de l’aide, il supplie celui qui est le plus dépourvu d’expérience ; et pour un voyage[a], celui qui est incapable même de se servir de ses pieds,
  to: Pour demander la vie, il s’adresse à ce qui est mort ; pour obtenir de l’aide, il supplie celui qui est le moins expérimenté ; et pour un voyage[a], celui qui est incapable même de se servir de ses pieds,
  rationale: La révision remplace l’ellipse peu naturelle de « juge digne » par « s’adresse à », qui restitue la requête implicite adressée à l’objet mort tout en respectant le complément « pour demander la vie ». Elle allège aussi le rendu du superlatif. La ponctuation finale est conservée, car la phrase grecque se poursuit au verset suivant.
