    issue: La formulation « il juge digne ce qui est mort » est elliptique au point de paraître fautive ou obscure en français.
    rationale: Bien que ἀξιοῖ puisse avoir une valeur évaluative, son emploi contextuel exprime la demande adressée à l’idole. Une formulation française qui explicite l’objet demandé rend le sens et le parallélisme sans ajouter de contenu doctrinal.
  - severity: low
    issue: « Celui qui est le plus dépourvu d’expérience » est lourd en français.
    rationale: « Celui qui est le moins expérimenté » rend naturellement le superlatif ἀπειρότατον et maintient l’ironie de l’incapacité de l’idole.
