base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/018.yaml
  text: But for life he considers the dead thing worthy; for help he begs the one most inexperienced; and for a journey[a], the one unable even to use its foot,
translation:
  language: fr
  text: Pour demander la vie, il s’adresse à ce qui est mort ; pour obtenir de l’aide, il supplie celui qui est le moins expérimenté ; et pour un voyage[a], celui qui est incapable même de se servir de ses pieds,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « celui qui est incapable même de se servir de son socle ». Le grec βάσις peut évoquer le pied ou le pas, mais aussi la base ou le socle d’une statue ; la phrase tourne en dérision l’idole, incapable de se déplacer par elle-même.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζωῆς
  choice: obtenir la vie
  rationale: Avec περὶ, le génitif indique ici ce qui fait l’objet de la demande. « Pour obtenir la vie » rend clairement le sens en français courant.
- source_word: τὸ νεκρόν
  choice: ce qui est mort
  rationale: Le neutre singulier désigne l’idole comme une chose inanimée. Cette formulation conserve sa force polémique sans la confondre avec une personne décédée.
- source_word: ἀξιοῖ
  choice: il juge digne
  rationale: Le choix conserve le sens évaluatif courant d’ἀξιόω, « juger digne », même si l’ellipse demeure volontairement tendue dans le contexte.
- source_word: ἐπικουρίας
  choice: de l’aide
  rationale: « Aide » est direct, naturel et suffisamment large pour exprimer le secours sollicité.
- source_word: τὸν ἀπειρότατον
  choice: celui qui est le plus dépourvu d’expérience
  rationale: Cette formulation préserve le superlatif et l’idée fondamentale d’absence d’expérience, tout en restant intelligible en français.
- source_word: ἱκετεύει
  choice: il supplie
  rationale: Le verbe exprime une demande insistante ou une supplication ; « supplie » convient au registre et à l’ironie du passage.
- source_word: ὁδοιπορίας
  choice: un voyage
  rationale: Le nom désigne le fait de voyager ou un déplacement ; « un voyage » s’insère naturellement dans le parallélisme.
- source_word: τὸ μηδὲ βάσει χρῆσθαι δυνάμενον
  choice: celui qui est incapable même de se servir de ses pieds
  rationale: La formulation met en relief l’incapacité de l’idole à se déplacer. Le pluriel est idiomatique en français ; l’autre sens possible de βάσις, « base » ou « socle », est signalé en note.
theological_decisions:
- issue: Variation grammaticale dans les désignations de l’idole
  choice: Rendre d’abord le neutre par « ce qui est mort », puis conserver la personnification dans « celui qui… ».
  alternative: Uniformiser toutes les désignations par « l’idole » ou par un pronom impersonnel.
  rationale: 'La variation grecque participe à la satire : l’image est à la fois un objet sans vie et un prétendu destinataire de supplications. La conserver évite d’aplanir cette tension rhétorique.'
- issue: Sens de ἀξιοῖ dans la première proposition
  choice: Conserver le sens « juger digne ».
  alternative: Expliciter contextuellement par « demander à » ou « invoquer ».
  rationale: « Juger digne » maintient la valeur lexicale évaluative du verbe et l’étrangeté accusatrice de la proposition, sans résoudre silencieusement son ellipse.
translation_notes:
  register: Français international moderne, digne et lisible. Le parallélisme ternaire et la satire de l’idolâtrie sont maintenus. La virgule finale signale que la phrase se poursuit au verset suivant.
