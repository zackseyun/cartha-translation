  text: Yet even for these there is only slight blame, for they too perhaps go astray while seeking God and wanting to find him;
translation:
  language: fr
  text: Pourtant, le reproche qu’on peut leur faire est léger, car eux aussi s’égarent peut-être en cherchant Dieu[a] et en souhaitant le trouver.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « un dieu » : le grec n’emploie pas d’article devant θεόν, mais, dans ce contexte, il désigne très probablement le vrai Dieu que ces personnes cherchent, bien qu’elles s’égarent.'
    reason: Lecture alternative découlant de l’absence d’article devant θεόν.
lexical_decisions:
- source_word: ἀλλʼ ὅμως
  choice: Pourtant
  rationale: Rend naturellement la transition à la fois adversative et concessive.
- source_word: ἐπὶ τούτοις ἐστὶν μέμψις ὀλίγη
  choice: même eux ne méritent qu’un léger reproche
  rationale: Le tour français exprime clairement que ces personnes ne font l’objet que d’un blâme limité; « reproche » évite de donner à μέμψις un sens judiciaire trop lourd.
- source_word: καὶ γὰρ αὐτοὶ
  choice: car peut-être eux aussi / même eux (réparti dans la phrase)
  rationale: La formulation française répartit les éléments de liaison et de reprise pour éviter une phrase pesante, tout en conservant l’idée que ces personnes sont elles aussi concernées.
- source_word: τάχα
  choice: peut-être
  rationale: Conserve explicitement la nuance d’incertitude du grec.
- source_word: πλανῶνται
  choice: s’égarent-ils
  rationale: Préserve l’image de l’errance intellectuelle ou spirituelle sans préciser indûment une cause extérieure.
- source_word: θεὸν ζητοῦντες
  choice: en cherchant Dieu
  rationale: Dans le contexte, le singulier vise vraisemblablement le vrai Dieu, même si l’absence d’article permet grammaticalement « un dieu »; cette ambiguïté est signalée en note.
- source_word: θέλοντες εὑρεῖν
  choice: en voulant le trouver
  rationale: Rend simplement la volonté réelle exprimée par θέλοντες et reprend Dieu par un pronom.
theological_decisions:
- issue: Faut-il rendre θεόν par « Dieu » ou par « un dieu » ?
  choice: Dieu
  alternative: un dieu
  rationale: Le contexte de Sagesse 13 présente des personnes qui, à partir de la création, cherchent le Créateur sans parvenir à le reconnaître. Toutefois, comme le grec n’emploie pas l’article, l’autre lecture demeure possible et est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. L’inversion « peut-être s’égarent-ils » maintient une cadence littéraire mesurée; le point-virgule final de la source éditoriale n’est pas reproduit isolément, le verset étant présenté comme une unité française complète.
