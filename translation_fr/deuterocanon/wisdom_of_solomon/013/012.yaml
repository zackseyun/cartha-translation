  text: But after using up the scraps from his work to prepare food, he was filled.
translation:
  language: fr
  text: Mais, après avoir utilisé les chutes de son travail[a] pour préparer de la nourriture, il fut rassasié[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les morceaux rejetés », « les débris » ou « les restes de son travail ». Le grec désigne ce qui est rejeté au cours du travail de l’artisan.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « il fut rempli »; il s’agit probablement de la faim qu’il apaisa après avoir employé les matériaux restants pour préparer son repas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποβλήματα
  choice: chutes
  rationale: Le nom désigne ce qui est rejeté ou tombe comme résidu du travail. Dans le contexte du travail du bois, « chutes » évoque naturellement les morceaux restants.
- source_word: ἐργασίας
  choice: travail
  rationale: Terme général désignant l’activité ou le labeur; « travail » convient au contexte artisanal sans le préciser davantage que le grec.
- source_word: εἰς ἑτοιμασίαν τροφῆς
  choice: pour préparer sa nourriture
  rationale: La tournure exprime le but. Le possessif rend naturellement en français la nourriture grâce à laquelle l’artisan se rassasie, sans modifier le sens.
- source_word: ἀναλώσας
  choice: utilisa
  rationale: Le participe indique qu’il emploie ou consume les chutes. « Utilisa » reste naturel et n’explicite pas indûment qu’elles furent brûlées.
- source_word: ἐνεπλήσθη
  choice: il fut rassasié
  rationale: Le passif signifie littéralement qu’il fut rempli; dans ce contexte alimentaire, « fut rassasié » en exprime clairement le sens tout en conservant la forme passive.
- source_word: τὰ δὲ
  choice: Mais
  rationale: δέ marque ici une transition contrastive avec la description précédente; « Mais » restitue ce mouvement.
theological_decisions: []
