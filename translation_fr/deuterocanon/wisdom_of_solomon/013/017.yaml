  text: But concerning his possessions and his marriage and children[a], while praying he is not ashamed to address the lifeless thing; and concerning health, he calls on what is weak[c][b],
translation:
  language: fr
  text: Mais quand il prie au sujet de ses biens, de ses mariages[a] et de ses enfants, il n’a pas honte de s’adresser à ce qui est sans vie[b] ; et pour sa santé, il invoque ce qui est faible[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ses affaires matrimoniales ». Le grec emploie le pluriel « mariages ».
    reason: lexical_alternative
  - marker: b
    text: L’auteur ne nomme pas directement l’idole, mais la décrit comme dépourvue de vie.
    reason: lexical_alternative
  - marker: c
    text: Ou « ce qui est sans force ». L’expression décrit avec mépris l’impuissance de l’idole.
    reason: lexical_alternative
lexical_decisions:
- source_word: κτημάτων
  choice: biens
  rationale: Le terme désigne largement ce que quelqu’un possède. « Biens » est naturel en français moderne et n’en restreint pas le sens aux seules terres.
- source_word: γάμων
  choice: mariages
  rationale: Le pluriel grec est conservé afin de ne pas trancher entre plusieurs mariages et, plus largement, les affaires matrimoniales.
- source_word: τέκνων
  choice: enfants
  rationale: Traduction directe, courante et claire du terme grec.
- source_word: προσευχόμενος
  choice: quand il prie
  rationale: Cette tournure rend naturellement la valeur circonstancielle du participe grec et relie la prière aux sujets mentionnés.
- source_word: οὐκ αἰσχύνεται
  choice: il n’a pas honte
  rationale: Formulation française directe qui conserve la portée morale et polémique de l’expression.
- source_word: τῷ ἀψύχῳ
  choice: ce qui est sans vie
  rationale: Cette expression conserve le neutre descriptif et souligne l’absence de vie sans introduire explicitement le mot « idole ».
- source_word: προσλαλῶν
  choice: s’adresser à
  rationale: Rend précisément l’action de parler à quelque chose dans le contexte de la prière.
- source_word: ὑγείας
  choice: santé
  rationale: Sens usuel du nom grec dans ce contexte, où la santé recherchée contraste avec la faiblesse de l’objet invoqué.
- source_word: τὸ ἀσθενές
  choice: ce qui est faible
  rationale: Le neutre substantivé et la caractérisation méprisante sont préservés sans ajouter un nom absent du grec.
- source_word: ἐπικαλεῖται
  choice: il invoque
  rationale: « Invoquer » convient au contexte religieux de l’appel adressé à une puissance supposée et reste intelligible en français courant.
theological_decisions:
- issue: Polémique contre l’idole dans τῷ ἀψύχῳ et τὸ ἀσθενές
  choice: Conserver les descriptions « ce qui est sans vie » et « ce qui est faible » sans nommer l’idole dans le corps du texte.
  alternative: « l’idole sans vie » et « l’objet impuissant »
  rationale: Le grec emploie deux expressions neutres descriptives. Les préserver maintient la rhétorique de mépris de l’auteur sans ajouter une identification explicite absente de ce vers.
- issue: Portée du pluriel γάμων
  choice: mariages
  alternative: « mariage » ou « affaires matrimoniales »
  rationale: 'Le pluriel formel demeure authentiquement ambigu : il peut viser plusieurs mariages ou le domaine des affaires matrimoniales. Le texte principal le conserve et la note indique l’autre possibilité.'
translation_notes:
  register: 'Français international moderne, digne et accessible. La phrase grecque est légèrement réorganisée pour une syntaxe française naturelle, tout en conservant son parallélisme : les biens, les mariages et les enfants d’une part, la santé d’autre part. Les désignations neutres de l’idole et le pluriel de γάμων sont maintenus.'
