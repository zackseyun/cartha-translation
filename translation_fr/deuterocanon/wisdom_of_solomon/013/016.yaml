base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/016.yaml
  text: So then[a], lest it fall, he made provision for it, knowing that it is unable to help itself; for it is an image and has need of help.
translation:
  language: fr
  text: Ainsi donc, pour qu’elle ne tombe pas, il a pris des mesures pour elle, sachant qu’elle est incapable de se secourir elle-même ; car c’est une image[a] et elle a besoin d’aide.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « idole ». Le mot grec signifie littéralement « image » ou « représentation », mais le contexte désigne un objet fabriqué auquel un culte est rendu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὲν οὖν μὴ καταπέσῃ
  choice: Ainsi donc, pour qu’elle ne tombe pas
  rationale: ἵνα avec μή et le subjonctif exprime ici le but préventif. Cette formulation naturelle conserve le sens de « afin qu’elle ne tombe pas ».
- source_word: προενόησεν αὐτοῦ
  choice: il a pris ses précautions pour elle
  rationale: προνοέω évoque la prévoyance et les mesures prises d’avance. Dans ce contexte, l’homme veille concrètement à empêcher l’image de tomber.
- source_word: εἰδὼς ὅτι ἀδυνατεῖ ἑαυτῷ βοηθῆσαι
  choice: sachant qu’elle est incapable de se porter secours à elle-même
  rationale: La formulation conserve le participe εἰδὼς, l’idée d’impuissance exprimée par ἀδυνατεῖ et la valeur réfléchie de ἑαυτῷ.
- source_word: εἰκὼν
  choice: image
  rationale: Le mot grec signifie littéralement « image » ou « représentation ». Le contexte désigne une idole, mais « image » préserve le choix lexical et l’ironie du texte.
- source_word: χρείαν ἔχει βοηθείας
  choice: elle a besoin d’aide
  rationale: Rendu français direct et naturel de l’expression « avoir besoin d’aide », tout en maintenant le contraste ironique avec l’objet censé secourir son adorateur.
theological_decisions:
- issue: Sens de εἰκὼν dans le contexte de la critique de l’idolâtrie
  choice: image
  alternative: idole
  rationale: Le contexte cultuel permet « idole », mais le grec emploie le terme plus général εἰκών. « Image » maintient l’ambiguïté lexicale et laisse le contexte produire lui-même la critique.
translation_notes:
  register: Français moderne, digne et accessible. Le féminin des pronoms reprend naturellement « image ». La tournure « se porter secours à elle-même » préserve l’ironie appuyée du grec sans ajouter l’idée non exprimée de « simple » image.
