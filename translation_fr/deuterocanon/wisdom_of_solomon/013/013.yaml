base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/013.yaml
  text: But the refuse from these[a], useful for nothing, a crooked piece of wood and full of knots—taking it, he carved it with the diligence of his idleness, and with the skill of his leisure he shaped it, and made it like the image of a man[b],
translation:
  language: fr
  text: Mais il prit le rebut[a] de ces morceaux, bon à rien — un morceau de bois tordu et noueux —, le sculpta avec le soin de son oisiveté et, avec l’habileté de son loisir[b], lui donna forme et le fit ressembler à l’image d’un homme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « déchet », « reste rejeté » ou « rognure ». Le grec désigne ce qui est jeté de côté comme sans valeur.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, « avec le soin de son oisiveté » et « avec l’habileté de son loisir ». La formulation est ironique : un travail soigneux est consacré à la fabrication d’une idole durant le temps d’oisiveté.'
    reason: cultural_note
lexical_decisions:
- source_word: ἀπόβλημα
  choice: rebut
  rationale: Le nom désigne ce qui est rejeté comme sans valeur. « Rebut » convient à un reste de bois inutilisable sans préciser indûment sa forme.
- source_word: εἰς οὐδὲν εὔχρηστον
  choice: qui n’est bon à rien
  rationale: Cette tournure française naturelle conserve l’idée d’une inutilité totale.
- source_word: ξύλον σκολιὸν καὶ ὅζοις συμπεφυκός
  choice: un bois tordu et noueux
  rationale: La formulation concise décrit naturellement une pièce de bois déformée par les nœuds provenant des branches.
- source_word: ἐγλύψεν
  choice: le sculpte
  rationale: Le verbe désigne ici le travail de taille du bois ; « sculpter » convient au façonnage d’une idole.
- source_word: ἐν ἐπιμελείᾳ ἀργίας αὐτοῦ
  choice: avec le soin que lui permet son oisiveté
  rationale: Cette formulation garde l’association ironique entre application et oisiveté tout en restant intelligible en français actuel.
- source_word: ἐμπειρίᾳ ἀνέσεως
  choice: avec l’habileté acquise dans ses loisirs
  rationale: ἀνέσεως évoque ici le relâchement ou le loisir ; la traduction préserve l’idée d’un savoir-faire exercé pendant le temps libre.
- source_word: ἐτύπωσεν αὐτό
  choice: il lui donne forme
  rationale: Le verbe exprime l’action de former ou de façonner ; la tournure évite une répétition lourde après « sculpte ».
- source_word: ἀπεικάσεν αὐτὸ εἰκόνι ἀνθρώπου
  choice: le fait ressembler à l’image d’un homme
  rationale: La traduction conserve la construction de ressemblance et le singulier ἀνθρώπου sans généralisation abstraite.
theological_decisions:
- issue: Portée de ἀνθρώπου dans εἰκόνι ἀνθρώπου
  choice: l’image d’un homme
  alternative: une forme humaine
  rationale: Le grec permet le sens générique « humain », mais la formulation concrète au singulier peut être rendue naturellement par « un homme ». Une note signale l’autre possibilité sans imposer une détermination excessive.
- issue: Ironie visant le travail de l’idolâtre pendant son oisiveté
  choice: conserver le rapprochement entre soin, habileté, oisiveté et loisirs
  alternative: avec beaucoup de soin pendant son temps libre
  rationale: Le grec juxtapose volontairement application et loisir. La traduction garde cette tension satirique plutôt que de la réduire à une simple indication temporelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme conserve l’accumulation descriptive et l’ironie du grec, tout en évitant un calque obscur tel que « le soin de son oisiveté ».
