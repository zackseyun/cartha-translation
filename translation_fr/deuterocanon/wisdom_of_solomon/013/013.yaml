revisions:
- from: Mais le rebut de ces morceaux[a], qui n’est bon à rien — un bois tordu et noueux —, il le prend et le sculpte avec le soin que lui permet son oisiveté ; avec l’habileté acquise dans ses loisirs, il lui donne forme et le fait ressembler à l’image d’un homme[b].
  to: Mais il prit le rebut[a] de ces morceaux, bon à rien — un morceau de bois tordu et noueux —, le sculpta avec le soin de son oisiveté et, avec l’habileté de son loisir[b], lui donna forme et le fit ressembler à l’image d’un homme.
