    issue: Les expressions relatives à l’oisiveté et aux loisirs ajoutent une relation causale ou permissive.
    rationale: « Le soin que lui permet son oisiveté » et « l’habileté acquise dans ses loisirs » ne correspondent pas exactement aux formulations grecques ἐν ἐπιμελείᾳ ἀργίας αὐτοῦ et ἐμπειρίᾳ ἀνέσεως. Elles atténuent le rapprochement ironique direct entre application et loisir.
  - severity: low
    issue: Ancre de la note lexicale a mal placée.
    rationale: La note explique ἀπόβλημα (« rebut ») ; elle doit donc être ancrée à ce mot plutôt qu’à « ces morceaux ».
  - severity: low
    issue: La note b ne reflète pas l’intérêt principal de la note source.
    rationale: L’ambiguïté éventuelle de « homme » n’exige pas de note ici. Le point notable est l’ironie du soin et de l’habileté consacrés à une idole pendant l’oisiveté.
