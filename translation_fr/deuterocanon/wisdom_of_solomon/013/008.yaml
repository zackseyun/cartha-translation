  text: Yet again[a], not even they are excusable;
translation:
  language: fr
  text: Là encore, eux non plus ne sont pas excusables[a] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne sont pas pardonnables » ou « ne méritent pas d’indulgence ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν δʼ
  choice: Pourtant
  rationale: Dans ce contexte, πάλιν reprend l’argument et δέ lui donne une légère nuance adversative. « Pourtant » restitue naturellement cette transition en français sans surcharger la phrase d’un « de nouveau » peu idiomatique.
- source_word: οὐδʼ
  choice: non plus ne… pas
  rationale: Cette tournure française exprime la négation renforcée de οὐδέ et conserve l’accent porté sur les personnes visées.
- source_word: αὐτοὶ
  choice: eux
  rationale: Le pronom tonique rend la valeur intensive de αὐτοί et renvoie clairement aux personnes dont il vient d’être question.
- source_word: συγγνωστοί
  choice: excusables
  rationale: L’adjectif indique que ces personnes ne peuvent légitimement bénéficier d’une excuse ou d’une indulgence. « Excusables » convient au contexte de responsabilité morale.
theological_decisions:
- issue: Degré de culpabilité exprimé par συγγνωστοί
  choice: ne sont pas excusables
  alternative: ne sont pas pardonnables / ne méritent pas l’indulgence
  rationale: « Excusables » maintient l’accent contextuel sur la responsabilité et l’absence de motif valable d’excuse, sans transformer l’énoncé en affirmation plus générale sur la possibilité du pardon.
translation_notes:
  register: Français international moderne, sobre et digne. Le point-virgule conserve le caractère continu de l’argument, puisque le verset grec est une brève proposition liée à la suite.
