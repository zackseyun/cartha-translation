base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/011.yaml
  text: For she knows all things and understands[a], and she will guide me prudently in my actions, and will guard me by her glory.
translation:
  language: fr
  text: Car elle connaît tout et comprend ; elle me guidera avec prudence dans mes actions et me gardera par sa gloire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans sa gloire ». Le grec peut indiquer ici le lieu ou le moyen.
    reason: La préposition ἐν admet dans cette expression une lecture locative ou instrumentale.
lexical_decisions:
- source_word: οἶδε
  choice: connaît
  rationale: Le verbe exprime ici la connaissance ; « connaît » maintient sa distinction avec συνίει, rendu par « comprend ».
- source_word: ἐκείνη
  choice: elle
  rationale: Le pronom renvoie à la Sagesse personnifiée au féminin ; « elle » conserve naturellement cette personnification.
- source_word: πάντα
  choice: tout
  rationale: L’accusatif pluriel a une portée globale ; « tout » est idiomatique en français moderne et en préserve l’étendue.
- source_word: συνίει
  choice: comprend
  rationale: Ce verbe désigne l’intelligence ou la compréhension et complète « connaît » sans confondre les deux notions.
- source_word: ὁδηγήσει
  choice: guidera
  rationale: Le verbe évoque l’action de conduire ou d’orienter ; « guidera » convient au rôle actif de la Sagesse.
- source_word: ἐν ταῖς πράξεσί μου
  choice: dans mes actions
  rationale: πράξεις désigne les actes, les entreprises ou la conduite pratique ; « actions » est clair, actuel et suffisamment large.
- source_word: σωφρόνως
  choice: avec prudence
  rationale: L’adverbe exprime une conduite sensée, maîtrisée et judicieuse ; « avec prudence » rend naturellement cette sagesse pratique.
- source_word: φυλάξει
  choice: gardera
  rationale: Le verbe indique une protection vigilante ; « gardera » en conserve le sens protecteur dans un registre biblique naturel.
- source_word: ἐν τῇ δόξῃ αὐτῆς
  choice: par sa gloire
  rationale: ἐν peut ici marquer le moyen aussi bien que la sphère. « Par sa gloire » retient le sens instrumental dans le texte, tandis que l’interprétation locative est signalée en note.
theological_decisions:
- issue: Valeur de ἐν dans ἐν τῇ δόξῃ αὐτῆς
  choice: 'Sens instrumental : « par sa gloire »'
  alternative: 'Sens locatif : « dans sa gloire » ; autre formulation possible du moyen : « au moyen de sa gloire »'
  rationale: Le contexte présente la Sagesse comme agissant pour guider et protéger, ce qui favorise une lecture instrumentale. Cependant, le grec permet aussi de comprendre la gloire comme la sphère dans laquelle la protection s’exerce ; cette ambiguïté est donc conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La personnification féminine de la Sagesse est conservée. L’ordre « connaît tout et comprend » suit de près la structure grecque sans attribuer explicitement « tout » au second verbe. Le point-virgule rend clairement la progression de la phrase.
