base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/010.yaml
  text: Send her out from the holy heavens[a], and send her from the throne of your glory, so that, being present with me, she may labor with me[c][b], and I may know what is pleasing to you.
translation:
  language: fr
  text: Envoie-la depuis les cieux saints, envoie-la depuis le trône de ta gloire, afin que, présente auprès de moi, elle peine et que je sache ce qui t’est agréable[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « elle travaille » ou « elle peine avec moi ». Le verbe grec évoque un travail pénible; « avec moi » est explicitement associé à la présence de la Sagesse auprès du priant.
    reason: lexical_alternative
  - marker: b
    text: Ou « ce qui est agréable à tes yeux » ou « ce qui est acceptable devant toi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαπόστειλον αὐτὴν ἐξ ἁγίων οὐρανῶν
  choice: Fais-la venir des cieux saints
  rationale: Cette formulation naturelle en français conserve le mouvement depuis les cieux exprimé par le verbe composé et ἐξ, tout en maintenant le pluriel « cieux » et la personnification féminine de la Sagesse.
- source_word: ἀπὸ θρόνου δόξης σου πέμψον αὐτήν
  choice: envoie-la du trône de ta gloire
  rationale: Le rendu préserve le parallélisme des deux impératifs ainsi que la structure génitivale littérale « trône de ta gloire », sans la transformer en « ton trône glorieux ».
- source_word: συνπαροῦσά μοι
  choice: présente à mes côtés
  rationale: Le participe indique que la Sagesse se trouve avec le priant. « À mes côtés » exprime naturellement cette présence conjointe sans lui attribuer une fonction supplémentaire.
- source_word: κοπιάσῃ
  choice: elle peine avec moi
  rationale: Le verbe désigne un travail pénible ou une peine. « Peiner avec moi » garde l’image forte d’une Sagesse qui partage le labeur du priant.
- source_word: γνῶ
  choice: je sache
  rationale: Le subjonctif français après « afin que » rend directement l’aoriste subjonctif grec dans la proposition de but.
- source_word: τί εὐάρεστόν ἐστιν παρὰ σοί
  choice: ce qui t’est agréable
  rationale: Cette expression française idiomatique rend ici la valeur de εὐάρεστον et de παρὰ σοί sans forcer l’image spatiale de « devant toi ».
theological_decisions:
- issue: Personnification féminine de la Sagesse envoyée depuis les cieux et le trône divin
  choice: Conserver les pronoms féminins « la » et « elle »
  alternative: Traiter la sagesse comme une abstraction ou répéter explicitement « la Sagesse »
  rationale: Les formes grecques αὐτήν et συνπαροῦσά sont féminines et poursuivent la personnification littéraire. Le français permet de la conserver sans identifier cette figure à une réalité doctrinale ultérieure non explicitée dans le verset.
- issue: Participation de la Sagesse au labeur du priant
  choice: elle peine avec moi
  alternative: elle travaille avec moi
  rationale: Le choix conserve la force de κοπιάω et l’étonnante image de coopération, sans l’atténuer ni en tirer une conclusion théologique supplémentaire.
translation_notes:
  register: Français international moderne, digne et priant. Le parallélisme des deux demandes est conservé; « fais-la venir » évite le tour moins naturel « fais-la sortir » tout en gardant le mouvement depuis les cieux. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
