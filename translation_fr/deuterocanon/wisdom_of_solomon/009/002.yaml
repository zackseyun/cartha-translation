translation:
  language: fr
  text: et par ta sagesse, tu as fait l’être humain[a] pour qu’il exerce son autorité[b] sur les créatures auxquelles tu as donné l’existence,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
