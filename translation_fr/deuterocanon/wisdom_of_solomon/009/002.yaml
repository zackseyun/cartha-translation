lexical_decisions:
- source_word: σοφίᾳ
  choice: sagesse
  rationale: 'Le datif exprime ici le moyen : Dieu fait l’être humain « par » sa sagesse. « Sagesse » conserve en outre le poids littéraire et théologique du terme dans le livre.'
- source_word: κατεσκεύασας
  choice: tu as fait
  rationale: Le verbe peut signifier faire, préparer ou façonner. « Tu as fait » est clair et naturel dans ce contexte de création, sans connotation mécanique.
- source_word: ἄνθρωπον
  choice: l’être humain
  rationale: Le singulier grec désigne vraisemblablement l’humanité sous la figure représentative d’un être humain. Cette traduction garde le singulier sans restreindre le sens au sexe masculin.
- source_word: ἵνα δεσπόζῃ
  choice: pour qu’il exerce son autorité
  rationale: La proposition en ἵνα exprime le but, tandis que δεσπόζῃ indique l’exercice d’une autorité sur la création. Cette formulation est actuelle et conserve la force du verbe.
- source_word: τῶν ... κτισμάτων
  choice: sur les créatures
  rationale: κτίσματα désigne ce qui a été créé. « Créatures » est idiomatique en français et convient au contexte du mandat confié à l’humanité.
- source_word: ὑπὸ σοῦ γενομένων
  choice: venues à l’existence par toi
  rationale: Le participe de γίνομαι souligne l’accès à l’existence, et ὑπό avec le génitif désigne Dieu comme agent. La formulation évite de répéter simplement « fait ».
theological_decisions:
- issue: Portée représentative de ἄνθρωπον dans le langage de la création
  choice: l’être humain
  alternative: l’homme ; un être humain
  rationale: Le singulier est maintenu, mais sa portée représentative et universelle est rendue explicitement sans transformer le terme en abstraction collective.
- issue: Force de δεσπόζῃ en écho au mandat de la création
  choice: pour qu’il exerce son autorité
  alternative: pour qu’il domine ; afin qu’il règne sur
  rationale: Le grec exprime une véritable autorité sur la création. « Exercer son autorité » préserve cette force sans ajouter une interprétation particulière sur la manière dont cette autorité doit s’exercer.
translation_notes:
  register: Français international moderne, naturel et digne. Le verset demeure syntaxiquement lié au précédent, d’où l’initiale en minuscule et la virgule finale. Le singulier représentatif est conservé avec « l’être humain », et l’écho au mandat de la création est signalé sans imposer une terminologie confessionnelle.
