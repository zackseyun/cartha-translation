  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/013.yaml
  text: For what man can know the counsel of God? Or who can discern what the Lord wills?[a]
translation:
  language: fr
  text: Quel être humain, en effet, peut connaître le dessein de Dieu ? Qui peut saisir ce que veut le Seigneur ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qui réfléchira à ce que veut le Seigneur ? »'
    reason: Le grec ἐνθυμηθήσεται peut désigner le fait de réfléchir intérieurement ou de parvenir à concevoir et saisir quelque chose.
lexical_decisions:
- source_word: τίς γὰρ ἄνθρωπος
  choice: Quel être humain, en effet
  rationale: ἄνθρωπος est ici singulier et générique. « Être humain » exprime naturellement cette portée en français moderne, tandis que « en effet » rend la valeur explicative de γάρ.
- source_word: γνώσεται
  choice: peut connaître
  rationale: Dans cette question rhétorique, le futur grec met en cause la capacité humaine. « Peut connaître » restitue clairement cette impossibilité implicite en français idiomatique.
- source_word: βουλὴν θεοῦ
  choice: le dessein de Dieu
  rationale: βουλή peut désigner le conseil, le projet, le dessein ou l’intention. « Dessein » conserve ici la nuance de volonté délibérée sans imposer un système théologique particulier.
- source_word: ἐνθυμηθήσεται
  choice: peut saisir
  rationale: Le verbe évoque une réflexion intérieure visant à concevoir ou comprendre. Dans le parallélisme, « saisir » exprime l’accès effectif à ce que veut le Seigneur, tout en restant naturel.
- source_word: τί θέλει ὁ κύριος
  choice: ce que veut le Seigneur
  rationale: θέλει exprime la volonté ou le désir. « Veut » est direct et digne en français contemporain; κύριος reçoit son titre divin habituel, « le Seigneur ».
theological_decisions:
- issue: Portée générique de ἄνθρωπος
  choice: être humain
  alternative: homme
  rationale: Le grec désigne ici toute personne humaine, sans opposition particulière entre les sexes. « Être humain » préserve explicitement cette portée générique en français actuel.
- issue: Rapport entre βουλή et θέλει
  choice: dessein… veut
  alternative: conseil… désire
  rationale: Cette formulation maintient la distinction entre le dessein divin et ce que le Seigneur veut, sans les fusionner ni préciser davantage leur rapport.
- issue: Valeur de ἐνθυμηθήσεται
  choice: peut saisir
  alternative: réfléchira à
  rationale: Le contexte souligne les limites de l’intelligence humaine. Le texte principal rend donc l’aboutissement implicite de la réflexion, tandis que la note conserve la lecture plus littérale de l’activité mentale.
translation_notes:
  register: Français international moderne, clair et digne. Les deux questions rhétoriques sont conservées, ainsi que leur parallélisme. La formulation évite l’archaïsme de « conseil de Dieu » et le tour potentiellement ambigu « quel homme ».
