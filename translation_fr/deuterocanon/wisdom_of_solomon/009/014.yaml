  text: For the reasonings of mortals are timid, and our thoughts are uncertain;
translation:
  language: fr
  text: 'Car les raisonnements des mortels sont timides,

    et nos pensées sont peu sûres.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λογισμοὶ
  choice: raisonnements
  rationale: Le nom désigne ici l’activité de réflexion ou de délibération, plutôt que de simples pensées; « raisonnements » le distingue aussi de ἐπίνοιαι.
- source_word: θνητῶν
  choice: des mortels
  rationale: Le terme souligne la condition humaine soumise à la mort, sans connotation masculine.
- source_word: δειλοί
  choice: timides
  rationale: L’adjectif exprime des raisonnements craintifs, hésitants et dépourvus d’assurance; « timides » préserve l’image sans renforcer indûment le blâme moral.
- source_word: ἐπισφαλεῖς
  choice: peu sûres
  rationale: Le mot évoque ce qui manque de stabilité et de fiabilité. « Peu sûres » est naturel en français et conserve cette double nuance.
- source_word: ἐπίνοιαι
  choice: pensées
  rationale: Le terme peut désigner des conceptions, desseins ou pensées élaborées. « Pensées » convient au parallélisme tout en restant distinct de « raisonnements ».
- source_word: ἡμῶν
  choice: nos
  rationale: Le possessif maintient directement la première personne du pluriel par laquelle le locuteur s’inclut parmi les mortels.
theological_decisions:
- issue: Portée anthropologique de θνητῶν
  choice: des mortels
  alternative: des humains
  rationale: « Mortels » maintient l’accent du grec sur la condition humaine vouée à la mort et sur ses limites face à la sagesse divine.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme grec est conservé, ainsi que la distinction entre le processus de raisonnement (λογισμοί) et les pensées ou conceptions (ἐπίνοιαι).
