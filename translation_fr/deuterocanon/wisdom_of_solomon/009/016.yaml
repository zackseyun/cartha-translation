base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/016.yaml
  text: And we can scarcely guess the things on earth[a], and we find the things at hand with labor[b]; but who has traced out the things in the heavens?
translation:
  language: fr
  text: Nous avons peine à nous faire une idée de ce qui est sur la terre, et ce qui est à portée de main, nous ne le découvrons qu’au prix d’efforts ; mais ce qui est dans les cieux, qui en a suivi la trace jusqu’au bout ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μόλις εἰκάζομεν
  choice: nous avons peine à nous faire une idée
  rationale: Cette formulation naturelle exprime à la fois la difficulté indiquée par μόλις et le caractère conjectural, non certain, de εἰκάζομεν.
- source_word: τὰ ἐπὶ γῆς
  choice: ce qui est sur la terre
  rationale: Rend directement l’opposition spatiale avec « ce qui est dans les cieux », sans transformer la phrase en catégorie abstraite.
- source_word: τὰ ἐν χερσὶν
  choice: ce qui est à portée de main
  rationale: L’expression grecque désigne littéralement ce qui est « dans les mains », avec le sens contextuel de ce qui est proche ou accessible. La tournure française conserve discrètement l’image tout en restant idiomatique.
- source_word: εὑρίσκομεν μετὰ πόνου
  choice: nous ne le découvrons qu’au prix d’efforts
  rationale: La restriction française rend la difficulté du processus, tandis que « au prix d’efforts » exprime le labeur et la peine contenus dans πόνος.
- source_word: τὰ δὲ ἐν οὐρανοῖς
  choice: mais ce qui est dans les cieux
  rationale: Le pluriel « les cieux » reflète οὐρανοῖς et maintient le contraste cosmologique avec la terre.
- source_word: τίς ἐξιχνίασεν
  choice: qui en a suivi la trace jusqu’au bout ?
  rationale: Cette traduction conserve la métaphore de la piste ou de la trace propre à ἐξιχνιάζω ainsi que l’idée d’une recherche menée à son terme.
theological_decisions:
- issue: Limitation humaine devant les réalités célestes
  choice: Conserver la question rhétorique qui oppose la difficulté de connaître les réalités terrestres à l’incapacité humaine d’explorer pleinement celles des cieux.
  alternative: Expliciter les réalités célestes comme les desseins de Dieu ou les mystères divins.
  rationale: Le verset grec ne nomme pas ici explicitement les desseins de Dieu. La traduction préserve donc sa portée et sa tension sans anticiper sur le contexte suivant.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme en trois membres et l’opposition terre/cieux sont conservés ; le vocabulaire évite aussi bien la technicité philosophique que la familiarité.
