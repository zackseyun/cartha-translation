  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/015.yaml
  text: For a perishable body weighs down the soul[a], and the earthly tent burdens a mind full of cares.
translation:
  language: fr
  text: Car un corps périssable alourdit l’âme, et la tente faite de terre pèse sur l’esprit aux multiples préoccupations[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’esprit rempli de multiples pensées ».",
    reason: L’adjectif πολυφρόντιδα peut mettre l’accent soit sur les nombreuses préoccupations et les soucis, soit plus largement sur la multiplicité des pensées.
lexical_decisions:
- source_word: φθαρτὸν
  choice: périssable
  rationale: Le terme désigne ce qui est sujet à la corruption et au dépérissement. « Périssable » conserve cette fragilité sans réduire le sens à la seule mortalité.
- source_word: σῶμα
  choice: corps
  rationale: Équivalent français courant et précis pour le corps physique.
- source_word: βαρύνει
  choice: alourdit
  rationale: Le verbe exprime l’action de rendre lourd ou pesant. « Alourdit » garde l’image concrète et son effet sur l’âme.
- source_word: ψυχήν
  choice: âme
  rationale: Dans ce parallélisme, « âme » préserve la distinction entre le corps et la vie intérieure sans la confondre avec l’esprit rationnel désigné ensuite par νοῦς.
- source_word: βρίθει
  choice: accable
  rationale: Le verbe évoque un poids qui pèse lourdement. « Accable » rend naturellement cette pression en français tout en variant le verbe du premier membre.
- source_word: γεῶδες
  choice: faite de terre
  rationale: Cette formulation explicite le sens matériel de l’adjectif, « terrestre » ou « fait de terre », sans introduire l’image plus étroite de l’argile.
- source_word: σκῆνος
  choice: tente
  rationale: Le mot désigne une tente ou demeure provisoire. La traduction littérale conserve la métaphore du corps comme habitation temporaire.
- source_word: νοῦν
  choice: esprit
  rationale: Ici, le terme désigne la faculté de penser et de comprendre. « Esprit » est naturel en français et reste distinct de « âme ».
- source_word: πολυφρόντιδα
  choice: aux multiples préoccupations
  rationale: L’adjectif peut évoquer de nombreux soucis, préoccupations ou pensées. Cette expression garde l’idée d’un esprit absorbé par beaucoup de choses sans lui attribuer nécessairement une anxiété clinique.
theological_decisions:
- issue: Distinction anthropologique entre ψυχή et νοῦς dans le parallélisme avec le corps
  choice: Traduire ψυχή par « âme » et νοῦς par « esprit ».
  alternative: Traduire ψυχή par « vie » ou « personne », et νοῦς par « intelligence ».
  rationale: Le verset distingue poétiquement l’âme et la faculté pensante sans définir précisément leur rapport. Des termes différents maintiennent cette tension au lieu de fusionner les deux notions.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La métaphore de la tente est conservée, ainsi que le parallélisme entre le poids du corps et celui de l’habitation terrestre.
