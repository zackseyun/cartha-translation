  text: God of the fathers and Lord of your mercy[a], who made all things by your word,
translation:
  language: fr
  text: Dieu des pères et Seigneur de ta miséricorde, toi qui as fait toutes choses par ta parole[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par ton commandement ». Le grec dit littéralement « par ta parole ».
    reason: Alternative lexicale contextuelle pour λόγος.
lexical_decisions:
- source_word: θεὲ πατέρων
  choice: Dieu des pères
  rationale: Le vocatif s’adresse directement à Dieu. « Des pères » conserve le génitif grec sans ajouter le possessif absent « nos » et maintient la portée ancestrale traditionnelle.
- source_word: Κύριε τοῦ ἐλέους σου
  choice: Seigneur de ta miséricorde
  rationale: Cette formulation conserve la construction génitive et le possessif explicite σου (« ta »), malgré son caractère inhabituel en français, sans la réduire à l’adjectif interprétatif « miséricordieux ».
- source_word: ὁ ποιήσας τὰ πάντα
  choice: toi qui as fait toutes choses
  rationale: « Toi qui » rend naturellement le participe grec rattaché à une adresse directe. « Fait toutes choses » respecte le sens large de ποιέω et le registre élevé de τὰ πάντα.
- source_word: ἐν λόγῳ σου
  choice: par ta parole
  rationale: ἐν a ici une valeur instrumentale. « Parole » préserve le sens et les résonances possibles de λόγος sans imposer la précision contextuelle « commandement ».
theological_decisions:
- issue: Sens de λόγος dans le contexte de la création
  choice: parole
  alternative: commandement
  rationale: « Parole » suit directement le grec et en conserve l’éventuelle portée intertextuelle, sans imposer une lecture doctrinale ultérieure. « Commandement » est contextuellement possible, mais plus restrictif.
- issue: Relation exprimée par « Seigneur de ta miséricorde »
  choice: conserver le possessif et le génitif
  alternative: Seigneur miséricordieux
  rationale: Le grec comporte explicitement σου (« ta »). La reformulation adjectivale serait plus idiomatique, mais elle effacerait cette construction singulière et résoudrait une tension réelle du texte.
translation_notes:
  register: Français moderne, digne et adapté à la prière. La tournure inhabituelle « Seigneur de ta miséricorde » est maintenue par fidélité à la formulation grecque; « toi qui » clarifie naturellement le lien du participe avec les deux vocatifs.
