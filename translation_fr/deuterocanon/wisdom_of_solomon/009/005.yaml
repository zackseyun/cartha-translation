  text: for I am your servant and the son of your female servant[a], a weak man and short-lived, and lacking in understanding of judgment and laws[b];
translation:
  language: fr
  text: car je suis ton esclave et le fils de ta servante[a], un homme faible, à la vie brève, et limité dans sa compréhension du jugement et des lois[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie pour « esclave » et « servante » des termes qui désignent tous deux une condition servile.
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « ayant peu de discernement en matière de jugement et de lois ». L’expression peut désigner l’aptitude insuffisante à juger et à gouverner selon les lois.'
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: esclave
  rationale: Le grec désigne une condition servile, et non simplement l’accomplissement d’un service. « Esclave » conserve la force de l’abaissement du locuteur devant Dieu.
- source_word: υἱὸς τῆς παιδίσκης σου
  choice: le fils de ta servante
  rationale: παιδίσκη peut désigner une jeune esclave ou une servante. « Ta servante » est naturel et digne en français, tandis que la note signale explicitement la condition servile sous-jacente.
- source_word: ἄνθρωπος ἀσθενής
  choice: un homme faible
  rationale: Le locuteur masculin parle de sa propre fragilité et de son incapacité; cette formulation rend directement les deux termes grecs.
- source_word: ὀλιγόχρονιος
  choice: dont la vie est brève
  rationale: Le composé indique que le locuteur ne dispose que de peu de temps ou de peu d’années. Cette tournure est plus naturelle en français que « de courte vie ».
- source_word: ἐλάσσων ἐν συνέσει
  choice: peu capable de comprendre
  rationale: Le comparatif exprime ici l’insuffisance de la capacité intellectuelle. La formulation française communique cette déficience sans introduire un comparant absent.
- source_word: κρίσεως καὶ νόμων
  choice: le jugement et les lois
  rationale: La traduction maintient le singulier de κρίσις et le pluriel de νόμοι, ainsi que l’ambiguïté entre compréhension théorique et aptitude royale à juger selon les lois.
theological_decisions:
- issue: Langage de condition servile dans une prière d’humilité
  choice: Employer « esclave » pour δοῦλος et « servante » pour παιδίσκη, avec une note sur la condition servile de cette dernière
  alternative: « serviteur » et « servante », ou « esclave » et « femme esclave »
  rationale: « Esclave » préserve la force sociale de δοῦλος. Pour παιδίσκη, « femme esclave » serait plus explicite mais lourd et peu naturel; « servante » accompagné d’une note garde à la fois la dignité du registre et l’information lexicale.
- issue: Portée de κρίσεως καὶ νόμων
  choice: Conserver « le jugement et les lois » dans le texte, en explicitant seulement en note l’application possible à l’exercice du gouvernement
  alternative: « rendre la justice et appliquer les lois »
  rationale: L’alternative préciserait utilement le contexte royal, mais résoudrait une formulation grecque plus large. Le texte principal préserve donc sa tension et son abstraction.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve la structure d’une prière et l’humilité appuyée de l’original, tout en évitant des formulations peu idiomatiques comme « moindre en intelligence ».
