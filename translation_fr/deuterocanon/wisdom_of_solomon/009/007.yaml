  text: You chose me beforehand as king of your people and as judge of your sons and daughters;[a]
translation:
  language: fr
  text: C’est toi qui m’as choisi d’avance comme roi de ton peuple et comme juge de tes fils et de tes filles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « m’as établi » ou « m’as choisi par avance » ; le verbe grec comporte l’idée d’un choix préalable.
    reason: lexical_alternative
lexical_decisions:
- source_word: σύ
  choice: C’est toi qui
  rationale: La tournure détachée conserve l’insistance du pronom grec placé en tête tout en restant naturelle en français.
- source_word: προείλω
  choice: m’as choisi d’avance
  rationale: Cette formulation rend à la fois l’idée de choix personnel et la valeur d’antériorité portée par le préverbe προ-.
- source_word: βασιλέα
  choice: roi
  rationale: « Roi » est le titre politique direct et usuel correspondant au grec.
- source_word: λαοῦ σου
  choice: de ton peuple
  rationale: Le génitif est rendu directement, sans ajouter une relation absente du texte.
- source_word: δικαστὴν
  choice: juge
  rationale: Le terme conserve précisément la fonction judiciaire plutôt que de l’élargir à celle de dirigeant.
- source_word: υἱῶν σου καὶ θυγατέρων
  choice: de tes fils et de tes filles
  rationale: Le grec nomme explicitement les deux groupes; la traduction préserve cette distinction plutôt que de la réduire à « enfants ».
theological_decisions:
- issue: Nature du choix royal de Salomon
  choice: m’as choisi d’avance
  alternative: m’as établi / m’as choisi
  rationale: La traduction préserve l’antériorité exprimée par le verbe sans lui imposer une affirmation doctrinale plus large sur la prédestination.
- issue: Langage filial différencié selon le sexe
  choice: tes fils et tes filles
  alternative: tes enfants
  rationale: Le texte source mentionne explicitement fils et filles; les deux termes sont donc maintenus.
translation_notes:
  register: Français moderne, international et digne. « C’est toi qui » marque naturellement l’emphase initiale; le tutoiement correspond à l’adresse directe à Dieu dans le contexte de la prière.
