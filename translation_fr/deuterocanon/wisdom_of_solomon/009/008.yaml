base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/008.yaml
  text: You said to build a temple on your holy mountain[a], and an altar in the city of your dwelling, an imitation of the holy tent that you prepared from the beginning.
translation:
  language: fr
  text: Tu as dit de bâtir un temple sur ta montagne sainte et, dans la ville où tu demeures, un autel, image de la tente sainte[a] que tu avais préparée dès le commencement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le saint tabernacle ». Le mot grec peut désigner une tente ou, dans l’usage biblique, le tabernacle, c’est-à-dire la tente-sanctuaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπας
  choice: Tu as dit
  rationale: Rend directement l’aoriste de λέγω et conserve l’adresse à Dieu sans transformer implicitement le verbe en « ordonner ».
- source_word: οἰκοδομῆσαι
  choice: de bâtir
  rationale: Après « tu as dit », l’infinitif français exprime naturellement le contenu de la parole; « bâtir » convient au temple comme à l’autel.
- source_word: ναὸν
  choice: un temple
  rationale: ναός désigne ici le temple ou sanctuaire; l’indéfini respecte l’absence d’article en grec tout en restant naturel en français.
- source_word: ἐν ὄρει ἁγίῳ σου
  choice: sur ta montagne sainte
  rationale: Pour situer un édifice par rapport à une montagne, le français emploie naturellement « sur »; « montagne » rend directement ὄρος.
- source_word: πόλει κατασκηνώσεώς σου
  choice: la ville où tu demeures
  rationale: Cette formulation actuelle et claire exprime la ville caractérisée par la demeure ou la présence de Dieu, sans imposer le terme technique « tabernacle ».
- source_word: θυσιαστήριον
  choice: un autel
  rationale: Équivalent français usuel du terme grec désignant l’autel sacrificiel.
- source_word: μίμημα
  choice: à l’image de
  rationale: Cette tournure exprime une réalisation faite d’après un modèle. Elle évite la connotation péjorative que peut avoir « imitation » en français moderne, sans préciser davantage la nature du rapport entre le sanctuaire terrestre et son modèle.
- source_word: σκηνῆς ἁγίας
  choice: la tente sainte
  rationale: « Tente » rend le sens concret de σκηνή dans un français accessible; une note signale le terme biblique traditionnel « tabernacle ».
- source_word: ἣν προητοίμασας
  choice: que tu avais préparée
  rationale: Le plus-que-parfait marque clairement que cette préparation précède la construction demandée; le préverbe προ- est en outre soutenu par « dès le commencement ».
- source_word: ἀπʼ ἀρχῆς
  choice: dès le commencement
  rationale: Rend la profondeur temporelle de l’expression et souligne que la préparation remonte à l’origine, sans lui ajouter une définition philosophique.
theological_decisions:
- issue: Rapport entre le sanctuaire terrestre et la tente sainte préparée par Dieu
  choice: à l’image de la tente sainte
  alternative: une copie du saint tabernacle
  rationale: « À l’image de » maintient l’idée de correspondance exprimée par μίμημα, tout en laissant ouverte la nature précise du modèle et sans importer un cadre doctrinal ultérieur.
- issue: Nature de la σκηνή sainte
  choice: la tente sainte
  alternative: le saint tabernacle
  rationale: Le sens concret du grec est conservé dans le texte; la terminologie cultuelle traditionnelle reste disponible en note sans décider si le référent doit être compris exclusivement comme le tabernacle biblique.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement suit l’adresse directe de la prière. La phrase conserve le parallélisme entre le temple sur la montagne et l’autel dans la ville, tout en évitant un vocabulaire artificiellement technique.
