  text: Give me the wisdom that sits beside your thrones, and do not reject me from among your children.
translation:
  language: fr
  text: Donne-moi la sagesse qui siège auprès de tes trônes[a], et ne me rejette pas du nombre de tes enfants[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la sagesse qui siège auprès de ton trône ». Le grec emploie « tes trônes » au pluriel.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « du nombre de tes serviteurs » : le mot grec peut désigner des enfants ou des serviteurs selon le contexte.'
    reason: alternative_reading
lexical_decisions:
- source_word: δός
  choice: Donne-moi
  rationale: L’impératif direct de δίδωμι appelle une formulation simple et naturelle; « accorde-moi » serait possible, mais plus soutenu.
- source_word: πάρεδρον
  choice: qui siège auprès de
  rationale: πάρεδρος désigne quelqu’un qui est assis auprès d’un autre. Cette formulation conserve à la fois la personnification de la Sagesse et l’image spatiale liée aux trônes.
- source_word: σοφίαν
  choice: la sagesse
  rationale: Le terme désigne ici la Sagesse personnifiée, thème central du livre. La minuscule conserve le sens lexical tout en laissant la personnification ressortir de la phrase.
- source_word: τῶν σῶν θρόνων
  choice: tes trônes
  rationale: Le grec porte explicitement le pluriel. Le conserver évite de normaliser silencieusement le texte au singulier et maintient son possible arrière-plan royal ou céleste.
- source_word: ἀποδοκιμάσῃς
  choice: ne me rejette pas
  rationale: Le verbe exprime le rejet à la suite d’une appréciation ou d’une mise à l’épreuve. « Rejeter » est ici clair, idiomatique et sans surinterprétation.
- source_word: ἐκ παίδων σου
  choice: du nombre de tes enfants
  rationale: La tournure rend naturellement ἐκ, qui marque l’exclusion hors d’un groupe. παῖδες peut désigner des enfants ou des serviteurs; « enfants » convient au contexte tout en laissant l’autre sens en note.
theological_decisions:
- issue: Sens de παῖδες dans la relation à Dieu
  choice: enfants
  alternative: serviteurs
  rationale: παῖδες admet les deux sens. Dans cette prière, « enfants » met en valeur la relation filiale suggérée par le contexte, sans effacer l’interprétation possible « serviteurs », signalée en note.
- issue: Pluriel de θρόνων
  choice: tes trônes
  alternative: ton trône
  rationale: Le texte grec est au pluriel. Même si le singulier est plus attendu dans une adresse à Dieu, conserver le pluriel respecte la forme transmise et préserve son ambiguïté imagée.
translation_notes:
  register: Français international moderne, clair et digne. « Siège auprès de » conserve l’image de la Sagesse assise aux côtés des trônes sans introduire l’idée plus interprétative d’une intronisation. Les deux ambiguïtés principales du grec sont maintenues dans le texte ou documentées en note.
