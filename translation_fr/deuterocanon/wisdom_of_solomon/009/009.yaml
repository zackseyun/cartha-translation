base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/009.yaml
  text: And with you is wisdom[a], who knows your works, and was present when you made the world, and understands what is pleasing in your eyes and what is right according to your commandments.
translation:
  language: fr
  text: Avec toi se trouve la sagesse, qui connaît tes œuvres, qui était présente lorsque tu créais le monde[a] et qui sait ce qui est agréable à tes yeux et ce qui est droit selon tes commandements.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le monde ordonné ». Le grec κόσμος peut mettre l’accent sur l’ordre de l’ensemble créé.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ σοῦ
  choice: avec toi
  rationale: Rend directement l’association étroite exprimée par la préposition, sans lui imposer une nuance spatiale plus précise.
- source_word: ἡ σοφία ἡ εἰδυῖα
  choice: la sagesse, elle qui connaît
  rationale: « La sagesse » est le sens courant de σοφία. La reprise par « elle qui » conserve nettement sa personnification et l’accord féminin du participe grec.
- source_word: τὰ ἔργα σου
  choice: tes œuvres
  rationale: Cette formulation garde l’étendue de ἔργα, qui peut désigner l’ensemble des actes et réalisations de Dieu.
- source_word: παροῦσα
  choice: qui était présente
  rationale: Le participe indique que la sagesse était là auprès de Dieu, sans ajouter l’image plus forte d’une collaboratrice.
- source_word: ὅτε ἐποίεις τὸν κόσμον
  choice: lorsque tu faisais le monde
  rationale: L’imparfait « faisais » reflète l’imparfait grec ἐποίεις. « Le monde » est naturel en français, tandis que la note signale la nuance d’ordre inhérente à κόσμος.
- source_word: ἐπισταμένη
  choice: qui sait
  rationale: Le verbe exprime une connaissance assurée et éclairée. « Sait » reste naturel tout en distinguant légèrement cette proposition du premier « connaît ».
- source_word: τί ἀρεστὸν ἐν ὀφθαλμοῖς σου
  choice: ce qui est agréable à tes yeux
  rationale: Conserve l’image biblique du jugement porté « aux yeux » de Dieu, tout en restant compréhensible en français moderne.
- source_word: τί εὐθὲς ἐν ἐντολαῖς σου
  choice: ce qui est droit selon tes commandements
  rationale: « Droit » préserve l’image morale de rectitude portée par εὐθές; « selon » exprime naturellement la valeur normative des commandements.
theological_decisions:
- issue: Personnification de la sagesse
  choice: Conserver « la sagesse » en minuscule, puis employer « elle qui » et des propositions personnelles.
  alternative: Employer une formulation impersonnelle, ou écrire « Sagesse » avec une majuscule pour suggérer plus fortement une identité personnelle.
  rationale: Les participes féminins grecs personnifient clairement la sagesse, mais le verset ne tranche pas à lui seul la question d’une identification doctrinale ultérieure. La formulation choisie maintient cette tension.
- issue: Sens de κόσμος
  choice: le monde
  alternative: le cosmos; l’univers; le monde ordonné
  rationale: « Le monde » est le terme français courant et couvre ici la création organisée. Une note conserve la nuance possible d’ordre sans donner au texte principal une coloration scientifique moderne.
- issue: Rôle de la sagesse lors de la création
  choice: qui était présente lorsque tu faisais le monde
  alternative: qui collaborait avec toi à la création du monde
  rationale: Le grec affirme sa présence, mais ne précise pas ici la nature exacte de son rôle. La traduction évite donc de transformer la présence en causalité ou en coopération explicite.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme coordonné du grec est conservé sans lourdeur excessive; le tutoiement correspond au singulier adressé à Dieu dans le texte source.
