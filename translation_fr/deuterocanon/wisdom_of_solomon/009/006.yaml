base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/006.yaml
  text: For even if someone is perfect among the sons of men[a], apart from the wisdom that comes from you, he will be regarded as nothing.
translation:
  language: fr
  text: Car même si quelqu’un est parfait parmi les fils des hommes[a], sans la sagesse qui vient de toi, il sera compté pour rien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi les êtres humains ». Le grec dit littéralement « parmi les fils des hommes », expression traditionnelle désignant l’humanité.
    reason: alternative lexicale et clarification de la portée collective
lexical_decisions:
- source_word: κἂν γάρ τις ᾖ
  choice: Car même si quelqu’un était
  rationale: κἄν (καί + ἐάν) introduit une concession, tandis que γάρ relie cette affirmation à son contexte par une valeur explicative. La construction française à l’imparfait, suivie du conditionnel, exprime naturellement cette hypothèse concessive.
- source_word: τέλειος
  choice: parfait
  rationale: τέλειος peut signifier « parfait », « accompli » ou « parvenu à maturité ». « Parfait » conserve ici la force évaluative et le contraste absolu avec l’indispensable sagesse venant de Dieu.
- source_word: ἐν υἱοῖς ἀνθρώπων
  choice: parmi les fils des hommes
  rationale: Cette expression de tournure sémitique désigne les êtres humains. La traduction principale en conserve l’image masculine et traditionnelle, tandis qu’une note en explicite la portée collective.
- source_word: τῆς ἀπὸ σοῦ σοφίας ἀπούσης
  choice: en l’absence de la sagesse qui vient de toi
  rationale: ἀπό indique que la sagesse a sa source en Dieu, et ἀπούσης exprime son absence. Cette formulation rend clairement le génitif absolu sans transformer l’absence en simple insuffisance.
- source_word: εἰς οὐδὲν λογισθήσεται
  choice: il serait tenu pour rien
  rationale: Le passif de λογίζομαι signifie ici « être compté, estimé ou considéré ». « Être tenu pour rien » est une formulation française actuelle et digne qui garde la force du jugement exprimé.
theological_decisions:
- issue: Expression anthropologique au masculin
  choice: Conserver « parmi les fils des hommes » dans le texte principal
  alternative: « parmi les êtres humains »
  rationale: Le grec emploie une expression masculine traditionnelle à portée humaine générale. La conserver maintient la forme et la coloration du texte source, sans nier sa portée inclusive, précisée en note.
- issue: Nécessité de la sagesse venant de Dieu
  choice: « en l’absence de la sagesse qui vient de toi »
  alternative: « sans ta sagesse »
  rationale: La formulation retenue préserve à la fois l’idée d’absence et l’origine divine explicitement marquée par ἀπό, sans réduire la phrase à une simple possession.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La tournure « tenu pour rien » conserve la gravité sapientielle du verset; « fils des hommes » maintient l’image traditionnelle du grec et fait l’objet d’une note explicative.
