  text: and govern the world in holiness and righteousness, and judge with uprightness of soul.
translation:
  language: fr
  text: afin que je gouverne le monde dans la sainteté et la justice, et que je rende la justice avec droiture de cœur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διέπῃ
  choice: qu’il gouverne
  rationale: Le verbe exprime ici l’action d’administrer ou de gouverner le monde; le subjonctif français conserve la dépendance syntaxique à la demande formulée au verset précédent.
- source_word: ἐν ὁσιότητι καὶ δικαιοσύνῃ
  choice: dans la sainteté et la justice
  rationale: «Sainteté» rend ὁσιότης dans son sens de piété conforme à Dieu, tandis que «justice» traduit naturellement δικαιοσύνη sans confondre les deux qualités.
- source_word: κρίσιν κρίνῃ
  choice: qu’il rende ses jugements
  rationale: La tournure grecque associe le nom et le verbe de même racine; cette formulation française naturelle en conserve le sens judiciaire sans la répétition peu idiomatique «juger un jugement».
- source_word: ἐν εὐθύτητι ψυχῆς
  choice: avec droiture de cœur
  rationale: ψυχή désigne ici l’intériorité morale de la personne. «Cœur» est plus naturel en français actuel que «âme» dans cette expression et communique bien la rectitude intérieure.
theological_decisions:
- issue: Portée morale de ὁσιότης et δικαιοσύνη
  choice: 'Conserver deux qualités distinctes: «sainteté et justice».'
  alternative: «Piété et équité».
  rationale: Le grec juxtapose deux notions complémentaires, l’une relative à la fidélité pieuse et l’autre à la conduite juste; la traduction retenue préserve cette tension sans l’expliquer doctrinalement.
- issue: Sens de ψυχή
  choice: Rendre l’intériorité morale par «cœur».
  alternative: «âme».
  rationale: Dans ce contexte, il ne s’agit pas d’affirmer une anthropologie particulière, mais de qualifier la disposition intérieure avec laquelle le jugement est exercé.
translation_notes:
  register: Français international moderne, digne et fluide. La formulation reste liée au contexte de prière du verset précédent par deux subjonctifs. Aucun marqueur de note n’est requis.
