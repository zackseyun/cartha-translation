  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/017.yaml
  text: And who has known your counsel[a], unless you have given wisdom and sent your holy Spirit from on high?
translation:
  language: fr
  text: Mais qui a connu ton dessein, à moins que tu n’aies donné la sagesse et envoyé ton esprit saint d’en haut[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton Esprit Saint ». Le grec signifie littéralement « ton esprit saint » ; l’emploi des majuscules relève de l’interprétation et non d’une différence dans le texte source.
    reason: alternative_reading
lexical_decisions:
- source_word: βουλήν
  choice: dessein
  rationale: « Dessein » exprime ici le projet ou l’intention de Dieu sans réduire le terme à un simple conseil ni le préciser comme un décret.
- source_word: ἔγνω
  choice: a connu
  rationale: Le passé composé rend naturellement l’aoriste dans cette question rhétorique et souligne que nul n’est parvenu à connaître le dessein divin par lui-même.
- source_word: σοφίαν
  choice: sagesse
  rationale: Équivalent français établi, qui conserve la portée intellectuelle, morale et théologique du terme dans la littérature sapientielle.
- source_word: τὸ ἅγιόν σου πνεῦμα
  choice: ton esprit saint
  rationale: La locution signifie littéralement « ton esprit saint ». La minuscule préserve l’ambiguïté du grec quant à l’identification personnelle et doctrinale, tandis que « esprit » convient mieux que « souffle » dans ce contexte.
- source_word: ἀπὸ ὑψίστων
  choice: d’en haut
  rationale: Formulation française naturelle désignant l’origine céleste, sans reproduire lourdement le pluriel substantivé grec « des hauteurs ».
theological_decisions:
- issue: Faut-il écrire « Esprit Saint » comme titre personnel divin ?
  choice: ton esprit saint
  alternative: ton Esprit Saint
  rationale: Le grec ne comporte pas de distinction de majuscules qui imposerait un titre personnel. La minuscule évite d’introduire rétrospectivement une détermination doctrinale, tout en laissant ouverte la profondeur théologique de l’expression.
translation_notes:
  register: Français moderne, courant et digne. La syntaxe interrogative reste proche du grec, tandis que « dessein » et « d’en haut » assurent une formulation naturelle et accessible.
