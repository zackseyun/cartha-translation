translation:
  language: fr
  text: Ainsi, les sentiers de ceux qui sont sur la terre furent redressés, et les humains furent instruits de ce qui t’est agréable.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διωρθώθησαν
  choice: furent redressés
  rationale: Le passif exprime la rectification. « Redressés » conserve l’image concrète des sentiers tout en pouvant évoquer la conduite rendue droite.
- source_word: τρίβοι
  choice: les sentiers
  rationale: Le terme désigne des chemins ou pistes frayées. « Sentiers » préserve la métaphore sapientielle sans l’abstraire en simple « conduite ».
- source_word: τῶν ἐπὶ γῆς
  choice: de ceux qui sont sur la terre
  rationale: La tournure substantivée désigne largement les êtres humains vivant sur terre; cette formulation reste proche du grec et naturelle en français.
- source_word: τὰ ἀρεστά σου
  choice: ce qui t’est agréable
  rationale: Le grec emploie un adjectif neutre pluriel substantivé pour les choses qui plaisent à Dieu. Le singulier collectif idiomatique « ce qui » rend naturellement cette idée en français.
- source_word: ἐδιδάχθησαν
  choice: apprirent
  rationale: Bien que la forme grecque soit passive (« furent instruits »), « apprirent » restitue ici naturellement le résultat de l’enseignement sans préciser un agent absent de la proposition.
- source_word: ἄνθρωποι
  choice: les humains
  rationale: Le nom désigne ici l’humanité de façon générique, sans opposition de sexe. « Les humains » est précis, actuel et évite que « les hommes » soit compris comme exclusivement masculin.
theological_decisions:
- issue: Portée générique de ἄνθρωποι
  choice: les humains
  alternative: les hommes
  rationale: Dans ce contexte, ἄνθρωποι renvoie aux êtres humains en général. Le choix inclusif traduit directement cette portée générique sans introduire de distinction théologique entre hommes et femmes.
- issue: Nature de ce qui plaît à Dieu
  choice: ce qui t’est agréable
  alternative: tes volontés
  rationale: Le texte parle littéralement des « choses agréables » à Dieu et ne les identifie pas explicitement à des commandements ou à des volontés déterminées; la traduction conserve cette ouverture.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe parallèle du grec est conservée. Le passé simple convient au registre narratif et poétique du contexte; « sentiers… redressés » maintient la métaphore concrète.
