base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/006.yaml
  text: For when the proud giants were being destroyed at the beginning[a], the hope of the world, taking refuge on a raft, left to the age to come a seed of generation[b], steered by your hand.
translation:
  language: fr
  text: Car, au commencement, tandis que les géants orgueilleux étaient détruits, l’espérance du monde, s’étant réfugiée sur un radeau[a], a laissé à l’âge à venir une semence de postérité[b], pilotée par ta main.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur une embarcation » ou « sur une petite embarcation ». Le grec dit littéralement « radeau », terme rhétoriquement marqué plutôt que le mot habituel pour un navire ou une arche.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour la postérité » ou « pour l’âge ». Le grec distingue ici « monde » (κόσμος), employé plus tôt dans le verset, et « âge » (αἰών).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχῆς
  choice: au commencement
  rationale: Rend le génitif à valeur temporelle et renvoie aux temps primordiaux du jugement, sans lui donner une portée métaphysique.
- source_word: ἀπολλυμένων
  choice: tandis que… étaient détruits
  rationale: Conserve la valeur durative du participe présent et son sens passif dans le contexte du déluge.
- source_word: ὑπερηφάνων γιγάντων
  choice: les géants orgueilleux
  rationale: « Géants » correspond à l’usage juif hellénistique lié aux traditions de la Genèse; « orgueilleux » garde la portée morale de l’adjectif.
- source_word: ἡ ἐλπὶς τοῦ κόσμου
  choice: l’espoir du monde
  rationale: Préserve la personnification et ne tranche pas explicitement entre Noé et le reste humain sauvé en lui.
- source_word: ἐπὶ σχεδίας
  choice: sur un radeau
  rationale: Rend le terme grec marqué, qui désigne normalement un radeau ou une embarcation sommaire plutôt que le mot habituel pour un navire ou une arche.
- source_word: καταφυγοῦσα
  choice: réfugié
  rationale: Exprime la recherche d’un abri protecteur. L’accord masculin est une syllepse naturelle en français, orientée vers le référent personnel implicite de « l’espoir », tandis que le grec accorde grammaticalement le participe avec ἐλπίς.
- source_word: ἀπέλιπεν
  choice: a laissé
  rationale: Garde le sens direct du verbe sans expliciter par « a préservé » ce que le texte laisse sous forme d’image.
- source_word: τῷ αἰῶνι
  choice: à l’âge à venir
  rationale: Maintient la distinction avec κόσμος, rendu plus tôt par « monde », et fait ressortir l’orientation vers la durée future de l’humanité.
- source_word: σπέρμα γενέσεως
  choice: une semence de génération
  rationale: Conserve l’image de la semence et la formulation condensée du grec, sans ajouter « nouvelle », absent du texte.
- source_word: τῇ σῇ κυβερνηθείσῃ χειρί
  choice: piloté par ta main
  rationale: Préserve la métaphore nautique de κυβερνάω et l’action directrice de Dieu. Le participe se rattache naturellement au référent personnel de « l’espoir du monde ».
theological_decisions:
- issue: Référent de « l’espoir du monde »
  choice: Conserver la personnification, avec un référent personnel implicite pouvant évoquer Noé ou le reste humain sauvé en lui
  alternative: Paraphraser comme l’espoir abstrait survivant au déluge
  rationale: Le participe grec s’accorde avec ἐλπίς, mais le contexte donne à cette expression une portée concrète. La traduction maintient cette tension au lieu de la résoudre.
- issue: Distinction entre αἰών et κόσμος
  choice: Rendre αἰών temporellement par « l’âge à venir »
  alternative: Employer de nouveau « monde » ou traduire « la postérité »
  rationale: Le grec emploie deux termes différents. La solution retenue évite de les confondre et garde l’idée de la continuation de l’humanité dans le temps futur.
- issue: Portée de la main divine
  choice: Rattacher « piloté par ta main » à l’espoir personnifié et à son sauvetage sur le radeau
  alternative: Rattacher grammaticalement la formule au seul acte de laisser une semence
  rationale: La construction grecque associe le participe féminin à ἐλπίς; la traduction conserve donc l’image de l’espoir personnellement conduit par Dieu.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure périodique et les images de « l’espoir », du « radeau », de la « semence » et du pilotage divin sont conservées. La formulation volontairement dense « semence de génération » reflète l’expression grecque sans introduire l’adjectif « nouvelle ».
