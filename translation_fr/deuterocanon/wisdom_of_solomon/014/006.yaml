revisions:
- from: Car, au commencement, tandis que les géants orgueilleux étaient détruits, l’espoir du monde, réfugié sur un radeau[a], a laissé à l’âge à venir une semence de génération[b], piloté par ta main.
  to: Car, au commencement, tandis que les géants orgueilleux étaient détruits, l’espérance du monde, s’étant réfugiée sur un radeau[a], a laissé à l’âge à venir une semence de postérité[b], pilotée par ta main.
  rationale: La révision préserve l’ambiguïté personnifiée du grec en choisissant « espérance », féminin, et en accordant avec elle les deux participes. Elle remplace le calque difficile « semence de génération » par « semence de postérité », sans introduire une « nouvelle » génération. Le registre reste moderne et soutenu, tandis que « pilotée » maintient l’écho nautique de la main divine.
