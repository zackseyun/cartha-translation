  text: showing that you are able to save from every peril[b][a], so that even someone without skill may embark.
translation:
  language: fr
  text: montrant que tu peux sauver de tout danger[a], afin que même quelqu’un sans savoir-faire[b] puisse embarquer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sauver de tout ». Le grec est plus large que le seul contexte maritime ; « de tout danger » en explicite ici le sens.
    reason: lexical_alternative
  - marker: b
    text: Ou « sans compétence » ou « sans compétence technique ». Dans ce contexte, il peut s’agir du savoir-faire nécessaire à la navigation.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεικνὺς
  choice: montrant
  rationale: Le participe présent prolonge la phrase précédente et conserve la valeur démonstrative du grec.
- source_word: δύνασαι
  choice: tu peux
  rationale: Exprime directement la capacité de Dieu dans un français actuel, naturel et digne.
- source_word: ἐκ παντὸς
  choice: de tout danger
  rationale: Littéralement « de tout » ; le contexte maritime indique toute situation périlleuse, sans épuiser la portée plus large de l’expression grecque.
- source_word: σώζειν
  choice: sauver
  rationale: Rend le sens fondamental du verbe et préserve à la fois l’idée de délivrance concrète et sa résonance théologique.
- source_word: ἵνα κἂν
  choice: afin que même
  rationale: Conserve la relation de but ou de résultat introduite par ἵνα et la force intensive de κἄν.
- source_word: ἄνευ τέχνης
  choice: qui ne maîtrise pas l’art de naviguer
  rationale: Dans ce contexte, τέχνη désigne le savoir-faire pratique requis en mer ; cette formulation est plus claire en français que le calque « sans art ».
- source_word: τις
  choice: quelqu’un
  rationale: Reproduit naturellement la valeur indéfinie et générale du pronom.
- source_word: ἐπιβῇ
  choice: puisse embarquer
  rationale: Dans le contexte nautique, le verbe signifie monter à bord ; « embarquer » est précis et idiomatique.
theological_decisions:
- issue: Portée de la puissance salvatrice dans ἐκ παντὸς σώζειν
  choice: sauver de tout danger
  alternative: sauver de tout
  rationale: Le texte affirme la puissance divine dans le cadre concret de la navigation, mais le grec demeure plus large. Le texte principal explicite le péril suggéré par le contexte, tandis que la note préserve l’étendue littérale de l’expression.
translation_notes:
  register: Français international moderne, clair et digne. La tournure conserve le mouvement de la phrase grecque et son affirmation générale, tout en rendant explicite le contexte nautique sans en faire une limitation doctrinale.
