  text: And the ambition of the craftsman urged on even those who were ignorant toward an intensification of worship[a].
translation:
  language: fr
  text: Et l’ambition de l’artisan poussa même ceux qui ne savaient pas à intensifier le culte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à développer la religion » ou « à renforcer les pratiques religieuses ».
    reason: Alternative lexicale pour ἐπίτασιν θρησκείας, qui peut désigner l’accroissement de la religion ou le renforcement de l’observance religieuse.
lexical_decisions:
- source_word: ἐπίτασιν
  choice: intensifier
  rationale: Le nom désigne un renforcement ou un accroissement. La tournure verbale « à intensifier » exprime naturellement en français le mouvement indiqué par εἰς sans en modifier le sens.
- source_word: θρησκείας
  choice: le culte
  rationale: Dans cette polémique contre l’idolâtrie, le terme vise avant tout les pratiques cultuelles. « Le culte » est ici plus concret que « la religion » et plus naturel que « l’observance religieuse ».
- source_word: ἀγνοοῦντας
  choice: ceux qui ne savaient pas
  rationale: Cette formulation conserve l’absence de complément dans le grec et évite de préciser arbitrairement ce que ces personnes ignoraient.
- source_word: τεχνίτου
  choice: l’artisan
  rationale: Le mot désigne celui qui fabrique l’image et souligne son savoir-faire manuel.
- source_word: προετρέψατο
  choice: poussa
  rationale: Le verbe exprime ici l’action d’inciter ou d’entraîner vers quelque chose. « Poussa » convient à la construction avec « à » sans suggérer nécessairement la contrainte.
- source_word: φιλοτιμία
  choice: l’ambition
  rationale: Le terme évoque littéralement le désir d’honneur ou de distinction. « Ambition » rend ce mobile de façon concise et naturelle dans le contexte.
theological_decisions:
- issue: Sens de θρησκεία dans une polémique contre l’idolâtrie
  choice: le culte
  alternative: la religion ; les pratiques religieuses
  rationale: « Le culte » met en avant la dévotion et les pratiques liées aux images dans le contexte immédiat, sans transformer le terme en catégorie théologique abstraite.
translation_notes:
  register: Français moderne, international et digne. La formulation conserve l’ambiguïté de « ceux qui ne savaient pas » et adopte une syntaxe fluide sans expliciter l’objet de leur ignorance.
