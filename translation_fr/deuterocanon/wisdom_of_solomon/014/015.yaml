base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/015.yaml
  text: For a father[a], worn down by untimely grief for the child quickly taken away, made an image of the one then dead, and now honored him as a god, and handed down mysteries and rites to those under his authority[b];
translation:
  language: fr
  text: En effet, un père, accablé par le deuil prématuré de son enfant qui lui avait été rapidement enlevé[a], fit une image de cette personne alors morte et l’honora désormais comme un dieu ; il transmit aussi à ceux qui étaient sous son autorité des mystères et des rites[b] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « soudainement emporté ». Le grec peut souligner la rapidité de la disparition, dans le cadre d’une mort survenue avant le temps attendu.
    reason: lexical_alternative
  - marker: b
    text: Les « mystères et rites » désignent ici des pratiques religieuses, notamment secrètes ou initiatiques, liées à un culte.
    reason: cultural_note
lexical_decisions:
- source_word: ἀώρῳ πένθει
  choice: le deuil prématuré
  rationale: ἀώρῳ exprime ce qui survient avant le temps attendu. En français, « deuil prématuré » rend de façon concise le deuil causé par une mort trop précoce.
- source_word: τρυχόμενος
  choice: accablé
  rationale: Le participe décrit le père comme épuisé ou consumé par son deuil. « Accablé » est naturel en français et conserve l’intensité sans exagérer la dimension physique.
- source_word: τοῦ ταχέως ἀφαιρεθέντος τέκνου
  choice: de son enfant trop tôt emporté
  rationale: τέκνον reste non genré avec « enfant ». Dans ce contexte de mort prématurée, « trop tôt emporté » restitue à la fois ταχέως et ἀφαιρεθέντος, sans préciser la manière de mourir.
- source_word: εἰκόνα
  choice: une image
  rationale: « Image » garde le sens premier et n’anticipe pas, par le mot « idole », le jugement développé dans le contexte.
- source_word: τὸν τότε νεκρὸν ἄνθρωπον
  choice: celui qui venait de mourir
  rationale: La formulation française renvoie naturellement à l’enfant et maintient le contraste temporel avec νῦν, rendu dans la phrase suivante par « Puis ».
- source_word: νῦν ὡς θεὸν ἐτίμησεν
  choice: Puis il l’honora comme un dieu
  rationale: « Comme un dieu » exprime le statut divin attribué au défunt, sans cautionner cette divinisation. « Puis » rend naturellement la progression de τότε à νῦν dans le récit.
- source_word: παρέδωκεν
  choice: transmit
  rationale: Le verbe désigne ici la transmission de pratiques cultuelles. « Transmit » convient mieux en français courant que le calque « livra » et n’ajoute pas explicitement l’idée d’institution.
- source_word: τοῖς ὑποχειρίοις
  choice: à ceux qui étaient sous son autorité
  rationale: Cette expression large conserve l’idée de dépendance ou de contrôle sans déterminer s’il s’agit de sujets politiques, de serviteurs ou de membres d’une maisonnée.
- source_word: μυστήρια καὶ τελετάς
  choice: des mystères et des rites
  rationale: « Mystères » conserve le terme cultuel lié à des observances secrètes ou initiatiques, tandis que « rites » rend le caractère cérémoniel de τελετάς.
theological_decisions:
- issue: Traduction de θεός dans un contexte polémique sur l’idolâtrie
  choice: un dieu
  alternative: comme divin
  rationale: Le texte décrit l’honneur divin accordé à un être humain mort. La minuscule et l’article indéfini préservent l’affirmation de sa divinisation sans suggérer qu’il s’agit du vrai Dieu.
- issue: Identification de τὸν τότε νεκρὸν ἄνθρωπον
  choice: celui qui venait de mourir
  alternative: l’homme qui était alors mort
  rationale: Le grec souligne que la personne désormais honorée comme un dieu n’était auparavant qu’un être humain mort. Le français choisi maintient le lien avec l’enfant sans introduire un référent masculin absent de τέκνον.
translation_notes:
  register: Français international moderne, digne et accessible. La division en deux phrases allège la longue période grecque tout en conservant sa progression causale et temporelle. Le point-virgule final maintient le lien syntaxique avec la suite du passage.
