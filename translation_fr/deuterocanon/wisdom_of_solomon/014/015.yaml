  rationale: La correction préserve la portée de τέκνον (« enfant », sans genre), rend le contraste τότε/νῦν par « alors » / « désormais », et évite de présenter la mort comme venant nécessairement de se produire. Les ancres de notes demeurent correctement placées et les notes restent conformes au texte source.
