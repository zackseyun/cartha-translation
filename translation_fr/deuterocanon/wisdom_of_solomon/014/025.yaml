  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/025.yaml
  text: 'and everything is mixed together: blood and murder, theft and deceit, corruption, faithlessness, turmoil, perjury, and confusion over what is good,'
translation:
  language: fr
  text: 'tout est mêlé : le sang et le meurtre[a], le vol et la tromperie, la corruption, l’infidélité, le désordre, le parjure et la confusion sur ce qui est bon[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le sang versé et le meurtre »; le grec dit littéralement « le sang et le meurtre ».
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque est difficile; elle peut aussi signifier « le bouleversement des biens » ou « le tumulte autour des bienfaits ».
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα δʼ ἐπιμὶξ ἔχει
  choice: tout s’y mêle
  rationale: Cette formulation française naturelle conserve à la fois la portée totale de πάντα et l’image d’un mélange indistinct exprimée par ἐπιμίξ.
- source_word: αἷμα καὶ φόνος
  choice: le sang et le meurtre
  rationale: « Sang » traduit littéralement αἷμα, qui évoque ici probablement le sang versé, tandis que « meurtre » rend la portée morale de φόνος.
- source_word: κλοπὴ καὶ δόλος
  choice: le vol et la tromperie
  rationale: Ces noms abstraits gardent le rythme de l’énumération grecque et expriment clairement les deux vices.
- source_word: φθορά
  choice: la corruption
  rationale: Dans ce catalogue moral et social, « corruption » préserve les idées de dégradation et de ruine sans les préciser excessivement.
- source_word: ἀπιστία
  choice: l’infidélité
  rationale: Le contexte favorise l’idée d’un manquement à la fidélité ou à la confiance plutôt que celle, plus étroite, d’une absence de croyance.
- source_word: τάραχος
  choice: le désordre
  rationale: Le terme désigne l’agitation et le trouble; « désordre » convient au tableau d’une société désorganisée.
- source_word: ἐπιορκία
  choice: le parjure
  rationale: Le mot grec désigne précisément le faux serment ou la violation d’un serment.
- source_word: θόρυβος ἀγαθῶν
  choice: la confusion sur ce qui est bon
  rationale: La formule grecque est difficile. Cette traduction exprime une désorientation concernant le bien tout en signalant en note les autres constructions possibles du génitif.
theological_decisions:
- issue: Sens de ἀπιστία dans la liste des vices
  choice: l’infidélité
  alternative: l’incrédulité
  rationale: L’environnement immédiat décrit surtout l’effondrement des relations et de l’ordre moral. « Infidélité » conserve ce sens éthique sans exclure toute résonance religieuse.
- issue: Interprétation de θόρυβος ἀγαθῶν
  choice: la confusion sur ce qui est bon
  alternative: le bouleversement des biens / le tumulte autour des bienfaits
  rationale: Le rapport exact entre θόρυβος et le génitif ἀγαθῶν reste incertain. Le texte principal présente une lecture éthique plausible, tandis que la note maintient ouvertes les autres possibilités.
