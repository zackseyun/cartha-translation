base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/027.yaml
  text: For the worship of nameless idols is the beginning and cause and end of every evil[a][b].
translation:
  language: fr
  text: Car le culte des idoles sans nom est le commencement, la cause et la fin de tout mal.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des idoles qui n’ont pas de nom ». L’adjectif grec peut souligner que ces idoles sont dépourvues d’un nom véritable ou digne.
    reason: lexical_alternative
  - marker: b
    text: La suite « commencement, cause et fin » peut aussi se comprendre comme « origine, cause et aboutissement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: θρησκεία
  choice: culte
  rationale: Dans ce contexte, le terme désigne les pratiques religieuses adressées aux idoles plutôt que la religion au sens large. « Culte » est naturel et précis en français.
- source_word: ἀνωνύμων
  choice: sans nom
  rationale: 'L’adjectif signifie littéralement « sans nom » ou « non nommé ». Cette formulation conserve l’ambiguïté : ces idoles peuvent être présentées comme dépourvues d’un nom véritable ou digne.'
- source_word: εἰδώλων
  choice: idoles
  rationale: Dans ce contexte polémique, le mot désigne de faux dieux représentés par des images. « Idoles » rend directement cette portée religieuse.
- source_word: παντὸς ... κακοῦ
  choice: de tout mal
  rationale: Le singulier collectif français « tout mal » exprime naturellement la portée universelle de la formule grecque.
- source_word: ἀρχὴ
  choice: commencement
  rationale: « Commencement » préserve la structure rhétorique ternaire du grec et évite d’interpréter d’emblée le terme comme « origine ».
- source_word: αἰτία
  choice: cause
  rationale: Le nom exprime ici la causalité. « Cause » maintient la formulation concise du grec.
- source_word: πέρας
  choice: fin
  rationale: Le terme peut signifier fin, terme, limite ou aboutissement. « Fin » conserve la force et l’ambiguïté de la triade.
theological_decisions:
- issue: Rendu de la triade ἀρχὴ ... καὶ αἰτία καὶ πέρας
  choice: le commencement, la cause et la fin de tout mal
  alternative: l’origine, la cause et l’aboutissement de tout mal
  rationale: Le choix retenu reproduit la structure compacte et emphatique du grec, tout en laissant « fin » évoquer aussi bien le terme que l’aboutissement, sans atténuer l’affirmation globale du texte.
- issue: Portée de ἀνωνύμων appliqué aux idoles
  choice: idoles sans nom
  alternative: idoles anonymes
  rationale: Le grec ne précise pas si ces idoles manquent d’identité véritable, de nom stable ou d’un nom digne. « Sans nom » préserve cette tension sans imposer une interprétation théologique particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la triade rhétorique du grec. « Culte » évite le sens trop large de « religion », et « sans nom » est plus naturel ici que « anonymes ».
