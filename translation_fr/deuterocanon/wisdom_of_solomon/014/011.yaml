base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/011.yaml
  text: Therefore there will also be a visitation upon the idols of the nations[a], because among God’s creatures they became an abomination, and a stumbling block to the souls of men[b], and a snare for the feet of fools.
translation:
  language: fr
  text: C’est pourquoi les idoles des nations feront, elles aussi, l’objet d’une visitation[a], car, au sein de la création de Dieu, elles sont devenues une abomination, des occasions de chute pour les âmes humaines et un piège pour les pieds des insensés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « feront, elles aussi, l’objet d’une intervention judiciaire ». Le terme grec traduit par « visitation » peut désigner une inspection ou une intervention, ici dans un contexte punitif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Rend naturellement le lien de conséquence avec l’argument précédent.
- source_word: ἐν εἰδώλοις ἐθνῶν ἐπισκοπὴ ἔσται
  choice: les idoles des nations subiront, elles aussi, une visitation
  rationale: « Visitation » conserve la portée de ἐπισκοπή, qui désigne ici une intervention d’examen à caractère judiciaire, sans la réduire explicitement au seul « jugement ».
- source_word: ἐν κτίσματι θεοῦ
  choice: parmi les créatures de Dieu
  rationale: Le singulier collectif κτίσμα peut désigner l’ensemble de ce qui est créé; cette formulation française exprime clairement que les idoles ont pris place parmi les choses créées par Dieu.
- source_word: εἰς βδέλυγμα ἐγενήθησαν
  choice: elles sont devenues une abomination
  rationale: Préserve la force religieuse et morale de βδέλυγμα.
- source_word: εἰς σκάνδαλα ψυχαῖς ἀνθρώπων
  choice: une occasion de chute pour les êtres humains
  rationale: Rend le sens métaphorique de σκάνδαλα dans un français actuel; « êtres humains » traduit le générique ἀνθρώπων. Le pluriel grec est rendu par un singulier collectif naturel.
- source_word: εἰς παγίδα ποσὶν ἀφρόνων
  choice: un piège pour les pieds des insensés
  rationale: Conserve l’image concrète du piège et des pieds; « insensés » garde la dimension morale propre au vocabulaire sapientiel.
theological_decisions:
- issue: Portée de ἐπισκοπή dans un contexte judiciaire
  choice: visitation
  alternative: jugement, intervention punitive
  rationale: Le contexte implique une action divine défavorable, mais le terme grec lui-même reste plus large que « jugement ». Le texte principal conserve cette tension et la note explicite le sens contextuel.
- issue: Sens de ψυχαῖς ἀνθρώπων
  choice: pour les êtres humains
  alternative: pour les âmes humaines
  rationale: Ici ψυχή peut désigner la personne ou la vie humaine; éviter « âmes » empêche d’imposer une lecture anthropologique plus étroite, tandis qu’une note signale la formulation littérale.
translation_notes:
  register: Français international moderne, digne et accessible. La structure ternaire « abomination… occasion de chute… piège » et les métaphores du texte grec sont conservées. « Visitation » est volontairement formel et expliqué en note.
