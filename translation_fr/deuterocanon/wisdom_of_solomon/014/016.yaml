  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/016.yaml
  text: Then[a], as time passed, that ungodly custom grew strong and was kept as a law[b], and by the commands of tyrants the carved images were worshiped.
translation:
  language: fr
  text: Puis, avec le temps[a], cette coutume impie s’affermit et fut observée comme une loi ; par les ordres des tyrans, les images sculptées[b] faisaient l’objet d’un culte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au fil du temps ». L’expression grecque indique une évolution progressive.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les objets sculptés » ; dans ce contexte, il s’agit d’images auxquelles un culte est rendu.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα ἐν χρόνῳ
  choice: Puis, avec le temps
  rationale: « Puis » marque la progression du raisonnement, tandis que « avec le temps » exprime clairement le développement graduel indiqué par ἐν χρόνῳ.
- source_word: κρατυνθὲν
  choice: s’affermit
  rationale: Le verbe κρατύνω indique que la coutume devint ferme ou solidement établie. La forme pronominale française conserve naturellement cette évolution.
- source_word: τὸ ἀσεβὲς ἔθος
  choice: cette coutume impie
  rationale: « Impie » préserve le jugement religieux et moral de ἀσεβές, et « cette » rattache la coutume à la pratique décrite dans le contexte.
- source_word: ὡς νόμος ἐφυλάχθη
  choice: fut observée comme une loi
  rationale: φυλάσσω peut signifier garder ou observer ; ici, la coutume est respectée comme si elle avait force de loi.
- source_word: τυράννων ἐπιταγαῖς
  choice: sur l’ordre des tyrans
  rationale: Cette formulation française rend l’autorité causale des ordres, tout en conservant la valeur négative de τύραννος.
- source_word: ἐθρησκεύετο
  choice: furent l’objet d’un culte
  rationale: Le verbe désigne l’accomplissement d’un culte ou d’une vénération religieuse. Cette expression est naturelle en français et évite de suggérer que les objets accomplissent eux-mêmes l’action.
- source_word: τὰ γλυπτά
  choice: les images sculptées
  rationale: Le substantif désigne littéralement des objets façonnés par sculpture. « Images sculptées » garde ce détail matériel sans employer le terme plus interprétatif « idoles ».
theological_decisions:
- issue: Rendre τυράννων par un terme neutre ou évaluatif
  choice: tyrans
  alternative: dirigeants
  rationale: Le grec τύραννος porte ici une appréciation négative dans un contexte qui dénonce l’imposition politique du culte des images. « Tyrans » en conserve la force.
- issue: Rendre τὰ γλυπτά de manière matérielle ou interprétative
  choice: les images sculptées
  alternative: les idoles
  rationale: Le grec met l’accent sur la fabrication des objets. Leur caractère idolâtrique ressort déjà du fait qu’ils reçoivent un culte ; il n’est donc pas nécessaire de l’introduire dans le nom.
- issue: Rendre ἐθρησκεύετο par « furent adorées » ou par une expression plus large
  choice: furent l’objet d’un culte
  alternative: furent adorées
  rationale: Le verbe peut désigner le culte religieux sans préciser à lui seul la nuance exacte entre adoration et vénération. La formulation retenue préserve cette amplitude.
translation_notes:
  register: 'Français international moderne, soutenu mais accessible. Le rythme de la phrase conserve la progression du grec : établissement graduel de la coutume, assimilation à une loi, puis imposition politique du culte.'
