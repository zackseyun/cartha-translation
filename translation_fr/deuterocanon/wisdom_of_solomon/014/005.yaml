base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/005.yaml
  text: But you intend that the works of your wisdom should not be idle[a]; therefore even with the smallest piece of wood men entrust their lives, and passing through the waves on a raft[b], they were brought safely through.
translation:
  language: fr
  text: Mais tu veux que les œuvres de ta sagesse ne restent pas inactives. C’est pourquoi les êtres humains confient leur vie[a] même à un tout petit morceau de bois et, après avoir traversé les flots sur un radeau, ils ont été sauvés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « leurs âmes ». Dans ce contexte, le mot grec désigne vraisemblablement leur vie exposée au danger.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλεις
  choice: tu veux
  rationale: Le présent exprime ici la volonté délibérée de Dieu. « Tu veux » est direct, naturel et ne réduit pas le verbe à un simple futur.
- source_word: μὴ ἀργὰ εἶναι
  choice: ne restent pas inactives
  rationale: ἀργός peut désigner ce qui est inactif, oisif ou sans effet. « Ne restent pas inactives » conserve l’image d’œuvres qui ne demeurent pas sans agir.
- source_word: τὰ τῆς σοφίας σου ἔργα
  choice: les œuvres de ta sagesse
  rationale: Cette formulation garde le rapport génitif et la portée théologique de la sagesse divine sans préciser davantage son statut.
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Ce connecteur rend clairement le lien logique entre la volonté divine et l’exemple maritime qui suit.
- source_word: ἐλαχίστῳ ξύλῳ
  choice: au plus petit morceau de bois
  rationale: Le superlatif ἐλαχίστῳ souligne l’extrême faiblesse du support. Avec πιστεύουσιν et ψυχάς, le datif se comprend naturellement comme ce à quoi les humains confient leur vie.
- source_word: πιστεύουσιν
  choice: confient
  rationale: Avec ψυχάς comme objet, le verbe signifie remettre ou confier sa vie à quelque chose plutôt que simplement croire.
- source_word: ψυχάς
  choice: leur vie
  rationale: Dans ce contexte de péril en mer, ψυχή désigne la vie exposée au danger. Le singulier distributif français est idiomatique.
- source_word: κλύδωνα
  choice: la houle
  rationale: κλύδων désigne l’agitation ou le soulèvement des flots. « La houle » restitue naturellement l’image maritime.
- source_word: σχεδίᾳ
  choice: sur un radeau
  rationale: σχεδία désigne précisément un radeau ou une embarcation rudimentaire.
- source_word: διεσώθησαν
  choice: ils ont été conduits sains et saufs
  rationale: Le passif et le préverbe δια- évoquent une préservation au cours de la traversée. Cette formulation conserve l’idée d’une délivrance reçue sans expliciter l’agent.
theological_decisions:
- issue: Portée de « ta sagesse » et action providentielle de Dieu
  choice: Conserver l’adresse directe à Dieu et parler des « œuvres de ta sagesse », sans définir la sagesse comme une personne distincte.
  alternative: Rendre la sagesse comme un agent pleinement personnifié, ou réduire l’expression à la sage organisation de Dieu.
  rationale: Le grec attribue des œuvres à la sagesse de Dieu, mais ce verset seul ne tranche pas la nature exacte de cette personnification. La traduction maintient cette tension.
- issue: Agent implicite du salut maritime
  choice: 'Maintenir une tournure passive : « ils ont été conduits sains et saufs ».'
  alternative: Employer une tournure active telle que « ils sont arrivés sains et saufs » ou nommer explicitement Dieu comme agent.
  rationale: Le passif grec laisse l’agent inexprimé tout en permettant, dans le contexte, d’entendre l’action providentielle de Dieu. Il ne convient ni de l’effacer ni de la rendre plus explicite que le texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Les êtres humains » rend ἄνθρωποι de façon inclusive et naturelle. La phrase conserve le contraste entre la fragilité extrême du bois et l’action efficace de la sagesse divine.
