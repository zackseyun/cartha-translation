base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/017.yaml
  text: Since men were not able to honor them in person because they lived far away[a], they reproduced the distant appearance and made a visible image of the honored king[b], so that by their zeal they might flatter the absent one as though present.
translation:
  language: fr
  text: Comme les gens ne pouvaient pas les honorer en personne à cause de l’éloignement, ils reproduisirent l’aspect qu’ils en avaient de loin et firent une image visible du roi honoré, afin que, par leur zèle, ils flattent l’absent comme s’il était présent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « afin que, par leur zèle, ils cherchent à gagner la faveur de l’absent comme s’il était présent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ὄψει
  choice: en personne
  rationale: L’expression évoque littéralement la vue, mais marque ici la présence physique, en contraste avec l’éloignement et l’absence.
- source_word: τιμᾶν
  choice: honorer
  rationale: Le terme exprime l’honneur social ou politique rendu au roi sans introduire prématurément la notion explicite de culte.
- source_word: τὴν πόρρωθεν ὄψιν
  choice: leur apparence vue de loin
  rationale: Cette formulation conserve la nuance visuelle de ὄψις et l’éloignement exprimé par πόρρωθεν, tout en laissant ouverte la manière dont cette apparence était connue.
- source_word: ἀνατυπωσάμενοι
  choice: ils reproduisirent
  rationale: Le verbe désigne la production d’une représentation d’après un modèle; « reproduisirent » convient naturellement au contexte de fabrication d’une image.
- source_word: ἐμφανῆ εἰκόνα
  choice: une image visible
  rationale: La formulation préserve le contraste entre l’image matériellement présente et le roi absent.
- source_word: τοῦ τιμωμένου βασιλέως
  choice: du roi honoré
  rationale: Le participe présente le roi comme objet de l’honneur; cette traduction concise garde son sens passif.
- source_word: τὸν ἀπόντα ὡς παρόντα
  choice: l’absent comme s’il était présent
  rationale: La traduction maintient l’antithèse structurante entre absence et présence.
- source_word: κολακεύωσιν
  choice: ils flattent
  rationale: « Flatter » conserve la tonalité critique du verbe, qui implique la recherche intéressée de la faveur du souverain.
- source_word: διὰ τῆς σπουδῆς
  choice: par leur empressement
  rationale: « Empressement » exprime à la fois le zèle, l’ardeur et les efforts déployés pour complaire au roi.
theological_decisions:
- issue: Faut-il rendre τιμᾶν par un terme explicitement cultuel ?
  choice: honorer
  alternative: adorer; vénérer
  rationale: Le contexte immédiat décrit d’abord l’honneur politique rendu aux souverains, avant le développement idolâtre dénoncé dans l’ensemble du passage. « Honorer » respecte cette progression sans renforcer le grec.
- issue: Force critique de κολακεύωσιν
  choice: flatter
  alternative: chercher à gagner la faveur de
  rationale: « Flatter » rend directement la réprobation implicite du texte, tandis que l’alternative explicite davantage le motif intéressé sans être nécessaire dans le corps du verset.
translation_notes:
  register: Français moderne, international et digne. La phrase suit le mouvement argumentatif du grec tout en évitant une syntaxe excessivement lourde. « Les gens » rend ἄνθρωποι de manière inclusive et naturelle; les pronoms renvoient aux souverains mentionnés dans le contexte précédent.
