base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/024.yaml
  text: They no longer keep either lives or marriages pure[a]; instead, one kills another by treachery[b], or by adultery causes grief.
translation:
  language: fr
  text: 'Ils ne gardent plus pures ni leurs vies ni leurs mariages : l’un tue l’autre en lui tendant une embuscade[a], ou lui cause de la douleur en commettant l’adultère[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « en le guettant » : le grec évoque le fait de se tenir caché pour attaquer.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou « en corrompant le mariage » : le verbe grec peut désigner le fait d’altérer ou de violer la fidélité conjugale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βίους
  choice: leur vie
  rationale: βίος peut désigner la vie ou la manière de vivre. Dans cette liste de désordres moraux, « leur vie » exprime naturellement la conduite personnelle et sociale sans restreindre le sens aux moyens d’existence.
- source_word: γάμους
  choice: leur mariage
  rationale: γάμος peut désigner le mariage, les noces ou le lit conjugal. Avec φυλάσσουσιν et καθαρούς, il s’agit ici de préserver l’intégrité des unions conjugales.
- source_word: καθαρούς
  choice: la pureté
  rationale: Le terme désigne ce qui est pur ou sans souillure. La tournure nominale française permet de l’appliquer clairement à la vie comme au mariage.
- source_word: φυλάσσουσιν
  choice: préservent
  rationale: Le verbe signifie garder, protéger ou conserver. « Préserver » convient idiomatiquement à la pureté et maintient l’idée d’une intégrité à sauvegarder.
- source_word: λοχῶν
  choice: en lui tendant une embuscade
  rationale: Le participe évoque l’action de guetter ou de se tenir en embuscade. Cette traduction conserve l’image concrète d’une attaque dissimulée plutôt que de la généraliser en simple trahison.
- source_word: ἀναιρεῖ
  choice: tue
  rationale: Le verbe signifie couramment tuer ou supprimer. « Tue » est direct et n’ajoute aucune qualification juridique absente du grec.
- source_word: νοθεύων
  choice: en commettant l’adultère
  rationale: νοθεύω signifie falsifier, corrompre ou rendre illégitime et peut, dans ce contexte conjugal, évoquer la violation de la fidélité matrimoniale. Le rendu explicite le sens sexuel probable tout en signalant en note l’image plus large de corruption.
- source_word: ὀδυνᾷ
  choice: fait souffrir
  rationale: Le verbe signifie causer de la douleur, affliger ou tourmenter. « Fait souffrir » reste naturel et conserve la portée générale, physique ou affective, du terme.
theological_decisions:
- issue: Portée de la pureté dans βίους ... γάμους καθαρούς
  choice: Le verset condamne l’incapacité à préserver la pureté de la vie et du mariage.
  alternative: Comprendre plus étroitement βίους comme les moyens d’existence, ou lire la pureté dans un sens rituel.
  rationale: Le contexte décrit le désordre moral engendré par l’idolâtrie. Une lecture éthique est donc première, mais la formulation ne précise pas davantage la nature de cette pureté.
- issue: Sens conjugal de νοθεύων
  choice: Rendre le participe par « en commettant l’adultère ».
  alternative: « en corrompant le mariage » ou « en falsifiant » au sens plus général.
  rationale: La proximité immédiate de γάμους favorise le sens de violation de la fidélité conjugale. Une note conserve toutefois l’ambiguïté lexicale du verbe grec.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme grec est conservé par « l’un… l’autre », tandis que les notes maintiennent les nuances de l’embuscade et de la corruption du mariage.
