    issue: « un bois » pour ξύλον
    rationale: En français actuel, l’article indéfini avec « bois » désigne normalement une étendue boisée, une essence ou le matériau de manière non dénombrable. Le grec vise ici une chose en bois ; « un morceau de bois » est requis pour une lecture naturelle et concrète.
  - severity: low
    issue: 'Note lexicale : « plus vermoulu »'
    rationale: Cette option spécialise indûment le sens vers le bois attaqué par les insectes. Le champ de σαθρότερον inclut plus généralement ce qui est délabré, dégradé ou peu solide.
