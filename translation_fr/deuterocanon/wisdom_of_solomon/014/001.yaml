review_pass:
  verdict: revise
  source_fidelity: 'Le sens de la construction est globalement conservé : τις est rendu par un indéfini masculin, πάλιν introduit un nouvel exemple, et le comparatif σαθρότερον est maintenu. Cependant, ξύλον désigne ici un objet ou une pièce de bois, et non naturellement le matériau abstrait « un bois » en français. « Un morceau de bois » rend mieux le concret de l’image sans résoudre artificiellement son caractère quelque peu abrupt.'
  naturalness: « Monter sur un bois » n’est pas une formulation idiomatique en français moderne et peut faire comprendre un arbre ou une essence de bois. « Monter sur un morceau de bois » est clair, naturel et conserve l’effet paradoxal voulu. La phrase reste fluide avec cette correction.
  terminology: '« Navire », « vagues déchaînées » et « le porte » sont appropriés au registre. La note « plus vermoulu » est trop spécifique : vermoulu évoque spécialement les dégâts causés par les vers/insectes, alors que σαθρός peut plus largement indiquer un état de dégradation, de faiblesse ou de manque de solidité. Une alternative comme « plus dégradé » conserve mieux cette latitude.'
  issues:
