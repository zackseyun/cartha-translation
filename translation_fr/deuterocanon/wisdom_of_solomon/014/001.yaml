  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/001.yaml
  text: Again[a], someone preparing to sail and about to pass through wild waves boards more fragile wood than the ship that carries him.
translation:
  language: fr
  text: De nouveau, un homme qui se prépare à prendre la mer et s’apprête à traverser des vagues déchaînées monte sur un morceau de bois plus fragile[a] que le navire qui le porte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « plus dégradé ». Le mot grec peut désigner ce qui manque de solidité ou ce qui est détérioré.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στελλόμενος
  choice: qui se prépare à prendre la mer
  rationale: Dans ce contexte nautique, le participe moyen exprime la préparation au départ; cette formulation rend naturellement l’action en français.
- source_word: τις
  choice: un homme
  rationale: L’indéfini masculin singulier présente un cas humain représentatif; « un homme » conserve cette forme sans identifier une personne précise.
- source_word: πάλιν
  choice: De nouveau
  rationale: L’adverbe introduit un nouvel exemple dans la suite de l’argument.
- source_word: ἄγρια κύματα
  choice: des vagues déchaînées
  rationale: Cette expression française courante restitue le caractère violent et menaçant des vagues.
- source_word: διοδεύειν
  choice: traverser
  rationale: Le verbe indique le passage à travers les vagues.
- source_word: τοῦ φέροντος αὐτὸν πλοίου
  choice: le navire qui le porte
  rationale: La relative conserve l’image du navire servant de moyen de transport.
- source_word: σαθρότερον
  choice: plus fragile
  rationale: Le comparatif décrit un matériau moins solide ou plus dégradé, sans imposer l’idée précise de pourriture.
- source_word: ξύλον
  choice: un bois
  rationale: Le terme désigne ici le matériau ou l’objet de bois sur lequel l’homme embarque; la formulation maintient l’ironie de la comparaison avec le navire.
- source_word: ἐπιβᾶται
  choice: monte sur
  rationale: Le verbe signifie mettre le pied sur ou embarquer; « monte sur » convient au complément concret « un bois ».
theological_decisions:
- issue: Sujet humain représentatif au masculin
  choice: un homme
  alternative: quelqu’un; une personne
  rationale: Le grec emploie un indéfini masculin singulier. La traduction conserve ce trait grammatical tout en présentant un exemple général.
- issue: Portée de σαθρότερον ξύλον
  choice: un bois plus fragile que le navire qui le porte
  alternative: un bois plus pourri que le navire qui le porte
  rationale: « Plus fragile » préserve le comparatif et l’opposition ironique sans réduire le champ du mot grec à la seule pourriture physique.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve le contraste rhétorique entre le bois embarqué et le navire, ainsi que l’ambiguïté de σαθρότερον grâce à une note.
