base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/012.yaml
  text: For the beginning of sexual immorality is the devising of idols[b][a], and the invention of them is the corruption of life.
translation:
  language: fr
  text: Car l’origine de l’immoralité sexuelle est la conception des idoles[a], et leur invention est la corruption de la vie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le fait d’imaginer des idoles ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la ruine de la vie » ou « la destruction de la vie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀρχὴ
  choice: l’origine
  rationale: Ἀρχή peut désigner le commencement, l’origine ou la cause première. « L’origine » exprime ici naturellement en français la portée à la fois initiale et causale du terme.
- source_word: πορνείας
  choice: de l’immoralité sexuelle
  rationale: πορνεία désigne largement les conduites sexuelles illicites. Cette formulation moderne préserve le sens direct sans réduire le mot à la prostitution ni l’interpréter d’emblée comme une métaphore de l’idolâtrie.
- source_word: ἐπίνοια
  choice: la conception
  rationale: ἐπίνοια évoque une idée élaborée, une conception ou un dessein. « La conception » conserve l’idée d’une invention pensée et répond au parallélisme avec εὕρεσις.
- source_word: εἰδώλων
  choice: des idoles
  rationale: Dans ce contexte juif grec, εἴδωλα désigne des objets de culte idolâtre, et non de simples images neutres.
- source_word: εὕρεσις
  choice: leur invention
  rationale: Bien que εὕρεσις puisse signifier « découverte », le contexte et son parallélisme avec ἐπίνοια indiquent ici l’invention humaine des idoles.
- source_word: φθορὰ
  choice: la corruption
  rationale: φθορά peut exprimer la corruption, la ruine, la déchéance ou la destruction. « Corruption » maintient ensemble les dimensions morale et existentielle du terme.
- source_word: ζωῆς
  choice: de la vie
  rationale: Le génitif ζωῆς est rendu directement. La formule reste concise et conserve sa portée générale.
theological_decisions:
- issue: Faut-il comprendre πορνεία au sens propre ou comme une métaphore de l’infidélité religieuse ?
  choice: « immoralité sexuelle », au sens lexical direct
  alternative: « infidélité » ou « idolâtrie »
  rationale: Le verset distingue l’immoralité sexuelle de la conception des idoles en établissant un rapport entre elles. Traduire πορνεία par « idolâtrie » effacerait cette tension et la logique de l’énoncé, même si le contexte peut aussi faire résonner l’idée d’infidélité spirituelle.
- issue: Faut-il préciser φθορὰ ζωῆς comme une destruction physique ou humaine ?
  choice: « la corruption de la vie »
  alternative: « la ruine de la vie » ou « la destruction de la vie »
  rationale: La formule grecque est brève et sémantiquement large. « Corruption » permet de garder à la fois la dégradation morale et les conséquences destructrices, sans restreindre le propos à la mort physique.
translation_notes:
  register: Français international moderne, sobre et sentencieux. La structure parallèle du grec est conservée, tout en choisissant « origine » pour une formulation française plus naturelle que « commencement » dans ce rapport causal.
