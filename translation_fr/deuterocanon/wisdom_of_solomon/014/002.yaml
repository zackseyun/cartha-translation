  text: For it was desire for profit that devised that one[a], and skillful wisdom constructed it;
translation:
  language: fr
  text: Car c’est le désir du gain qui l’a conçu[a], et une habile sagesse l’a construit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte le démonstratif neutre « celui-là », qui renvoie probablement au navire mentionné au verset précédent.
    reason: Le pronom français évite de rendre le référent plus explicite que ne le fait le grec, tandis que la note signale la valeur démonstrative et le référent probable.
lexical_decisions:
- source_word: ἐκείνο
  choice: ce navire
  rationale: Le démonstratif neutre renvoie vraisemblablement au navire mentionné au verset précédent. La reprise explicite est naturelle en français et évite l’ambiguïté d’un simple « cela ».
- source_word: ὄρεξις πορισμῶν
  choice: le désir du gain
  rationale: ὄρεξις exprime le désir, tandis que πορισμῶν désigne ici le gain ou les profits recherchés, dans un contexte de navigation commerciale.
- source_word: ἐπενόησεν
  choice: a conçu
  rationale: Le verbe indique l’action d’imaginer ou de concevoir mentalement; « concevoir » prépare le contraste avec la construction effective.
- source_word: τεχνῖτις σοφία
  choice: une sagesse habile
  rationale: « Sagesse » conserve la valeur lexicale et thématique de σοφία, tandis que « habile » rend la dimension technique et artisanale de τεχνῖτις.
- source_word: κατεσκεύασεν
  choice: l’a construit
  rationale: Le verbe désigne ici la fabrication concrète du navire et contraste avec sa conception préalable.
theological_decisions:
- issue: Valeur de σοφία dans un contexte artisanal
  choice: sagesse
  alternative: savoir-faire
  rationale: Le maintien de « sagesse » préserve un terme majeur du livre sans nier la nuance pratique, exprimée par l’adjectif « habile ».
translation_notes:
  register: Français moderne, courant et digne. La structure met en relief les deux causes personnifiées et le contraste entre la conception du navire et sa construction.
