base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/030.yaml
  text: But justice will pursue them both[a], because they thought wrongly about God by giving heed to idols, and they swore unjustly in deceit[c][b], despising holiness.
translation:
  language: fr
  text: Mais la justice les poursuivra dans les deux cas[a], car ils ont eu une fausse conception de Dieu en prêtant attention aux idoles[b], et ils ont prêté des serments injustes avec tromperie, méprisant la sainteté[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec peut aussi se comprendre : « la justice les poursuivra tous les deux ». Les « deux cas » peuvent renvoyer aux deux fautes mentionnées dans le verset ou, selon le contexte, à deux personnes ou groupes. τὰ δίκαια peut également désigner « les exigences de la justice » ou « de justes châtiments ».'
    reason: ambiguïté syntaxique et lexicale
  - marker: b
    text: 'C’est-à-dire : ils ont conçu Dieu de manière erronée en tournant leur attention vers les idoles. On peut aussi traduire : « en s’attachant aux idoles ».'
    reason: explicitation lexicale
  - marker: c
    text: 'Ou : « méprisant la piété » ou « au mépris de ce qui est saint ».'
    reason: alternative lexicale
lexical_decisions:
- source_word: ἀμφότερα
  choice: pour ces deux fautes
  rationale: Le neutre pluriel renvoie vraisemblablement aux deux transgressions précisées ensuite. Cette formulation rend ce double motif intelligible en français, tout en signalant en note l’autre analyse possible.
- source_word: μετελεύσεται
  choice: poursuivra
  rationale: Le verbe évoque une poursuite à portée punitive. « Poursuivra » conserve cette image sans préciser indûment la forme du châtiment.
- source_word: τὰ δίκαια
  choice: la justice
  rationale: Le neutre pluriel peut désigner ce qu’exige la justice ou les justes conséquences des actes. Le collectif français « la justice » préserve cette amplitude.
- source_word: κακῶς ἐφρόνησαν περὶ θεοῦ
  choice: ils se sont fait une idée fausse de Dieu
  rationale: L’expression concerne une conception erronée de Dieu plutôt qu’un simple sentiment mauvais. La formulation est naturelle et précise en français moderne.
- source_word: προσχόντες εἰδώλοις
  choice: en s’attachant aux idoles
  rationale: Le participe exprime l’attention ou l’adhésion accordée aux idoles et explique en quoi leur conception de Dieu était fausse.
- source_word: ἀδίκως ὤμοσαν
  choice: ils ont juré de manière injuste
  rationale: ἀδίκως qualifie moralement l’acte de jurer comme injuste ou fautif, sans le réduire à la seule fausseté factuelle.
- source_word: ἐν δόλῳ
  choice: et trompeuse
  rationale: La tournure coordonnée « de manière injuste et trompeuse » rend idiomatiquement la manière frauduleuse dont les serments ont été prononcés.
- source_word: καταφρονήσαντες ὁσιότητος
  choice: au mépris de ce qui est saint
  rationale: ὁσιότης peut désigner la sainteté, la piété ou le respect dû au sacré. Cette formulation concrète conserve la dimension religieuse sans la réduire à une attitude subjective.
theological_decisions:
- issue: Référent de ἀμφότερα et portée de τὰ δίκαια
  choice: « ces deux fautes » renvoie aux deux transgressions énoncées ensuite, tandis que « la justice » désigne les justes conséquences qui poursuivent leurs auteurs
  alternative: Comprendre « tous deux » comme deux groupes de personnes mentionnés dans le contexte, ou expliciter τὰ δίκαια par « les justes châtiments »
  rationale: 'L’enchaînement explicatif introduit par ὅτι favorise le renvoi aux deux fautes : une conception fausse de Dieu liée aux idoles et des serments injustes. « La justice » garde ouverte la nature exacte de la rétribution, tandis que la note préserve l’ambiguïté syntaxique.'
- issue: Sens de ὁσιότης
  choice: « ce qui est saint »
  alternative: « la piété » ou « la sainteté »
  rationale: Le grec peut viser la conduite pieuse, la sainteté ou le respect des réalités sacrées. La traduction retenue exprime ce champ sans imposer une interprétation confessionnelle particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’image judiciaire de la justice qui poursuit les coupables. Les deux motifs sont clairement parallèles, sans préciser au-delà du grec la forme de la rétribution.
