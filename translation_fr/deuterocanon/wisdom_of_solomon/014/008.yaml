  text: But the thing made by hands is accursed[a], both it and the one who made it, because the one made it[b], but the perishable thing was called god.
translation:
  language: fr
  text: 'Mais ce qui est fait de main humaine est maudit[a], aussi bien l’objet que celui qui l’a fait : celui-ci parce qu’il l’a façonné, et cet objet parce que, chose périssable, il a été appelé « dieu »[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « est sous le coup d’une malédiction ». Dans le contexte, « ce qui est fait de main humaine » désigne l’idole fabriquée.'
    reason: Précision lexicale sur ἐπικατάρατον et sur le référent implicite de χειρόποιητον.
  - marker: b
    text: 'Ou : « a été appelé un dieu ».'
    reason: Autre manière possible de rendre le nom θεὸς sans article.
lexical_decisions:
- source_word: χειρόποιητον
  choice: ce qui est fait de main humaine
  rationale: Cette formulation conserve le sens littéral de « fait par des mains » sans introduire explicitement le nom « idole », que le contexte suggère mais que le grec n’emploie pas ici.
- source_word: ἐπικατάρατον
  choice: maudit
  rationale: Le terme indique que l’objet est sous le coup d’une malédiction. « Maudit » est direct, naturel et garde la force religieuse et judiciaire du grec.
- source_word: ὁ ποιήσας αὐτό
  choice: celui qui l’a fait
  rationale: La tournure personnelle suit le participe grec sans préciser un genre que la forme grecque n’impose pas explicitement.
- source_word: ἠργάζετο
  choice: l’a façonné
  rationale: Dans ce contexte artisanal, le verbe désigne le travail par lequel l’objet a été produit. « Façonner » rend ce travail de fabrication plus naturellement en français que « travailler dessus ».
- source_word: φθαρτὸν
  choice: chose périssable
  rationale: Cette expression souligne que l’objet est destructible et met ainsi en relief le contraste polémique avec le nom divin qui lui est attribué.
- source_word: θεὸς ὠνομάσθη
  choice: a été appelé « dieu »
  rationale: Le français sans article préserve l’idée qu’un objet périssable a reçu le titre même de « dieu », sans décider qu’il serait simplement classé parmi plusieurs dieux.
theological_decisions:
- issue: Faut-il expliciter que l’objet fabriqué est une idole ?
  choice: Conserver « ce qui est fait de main humaine » dans le texte principal.
  alternative: Traduire « l’idole faite de main humaine ».
  rationale: Le contexte vise clairement une idole, mais χειρόποιητον désigne formellement ce qui est fabriqué par des mains. La traduction retenue préserve la portée rhétorique du grec sans ajouter un substantif absent.
- issue: Faut-il traduire θεὸς par « dieu » ou « un dieu » ?
  choice: Employer « dieu » sans article.
  alternative: Employer « un dieu ».
  rationale: 'La construction grecque peut permettre la seconde formulation, mais l’absence d’article en français met mieux en valeur le scandale dénoncé : une chose périssable reçoit le nom de « dieu ». La note conserve l’autre possibilité.'
- issue: Comment rendre la corrélation ὁ μὲν… τὸ δὲ ?
  choice: Employer « l’un… l’autre » et expliciter la relation causale pour chacun.
  alternative: Rendre plus littéralement « car l’un l’a façonné, tandis que la chose périssable a été appelée dieu ».
  rationale: La structure française choisie manifeste clairement que la malédiction atteint à la fois le fabricant pour son acte et l’objet pour le nom divin qui lui est donné, tout en gardant l’opposition du grec.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation évite le terme confessionnellement chargé « ouvrage des mains » et conserve l’opposition entre le fabricant et l’objet fabriqué. Les guillemets autour de « dieu » signalent qu’il s’agit du nom attribué à l’objet, non d’une approbation de cette désignation.
