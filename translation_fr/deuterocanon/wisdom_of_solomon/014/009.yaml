  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/009.yaml
  text: For the ungodly man and his ungodliness are equally hateful to God;[a]
translation:
  language: fr
  text: Car l’homme impie et son impiété sont également odieux à Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car l’impie et son impiété sont pareillement haïs par Dieu. »'
    reason: Alternative lexicale et syntaxique rendant μισητά par une tournure verbale passive.
lexical_decisions:
- source_word: ἐν ἴσῳ
  choice: également
  rationale: L’expression signifie « à égalité » ou « au même degré » ; « également » en conserve clairement la force comparative.
- source_word: μισητά
  choice: odieux
  rationale: Cet adjectif prédicatif indique que l’homme comme son impiété sont objets de la haine divine. « Odieux à Dieu » préserve la construction adjectivale sans l’atténuer.
- source_word: θεῷ
  choice: à Dieu
  rationale: Le datif désigne ici celui aux yeux de qui, ou pour qui, les deux réalités sont odieuses ; la construction française naturelle est « odieux à Dieu ».
- source_word: ὁ ἀσεβῶν
  choice: l’homme impie
  rationale: Le participe substantivé masculin singulier désigne celui qui agit avec impiété. « L’homme impie » rend sa forme masculine et permet de conserver le lien lexical avec « impiété ».
- source_word: ἡ ἀσέβεια αὐτοῦ
  choice: son impiété
  rationale: « Impiété » rend directement ἀσέβεια et maintient la parenté lexicale avec « impie » ; « son » reprend sans ambiguïté le référent masculin singulier.
theological_decisions:
- issue: La haine divine vise à la fois l’impie et son impiété
  choice: Le verset affirme que l’homme impie et son impiété sont également odieux à Dieu.
  alternative: Limiter la haine divine à l’impiété seule, ou reformuler en simple désapprobation morale.
  rationale: Le grec coordonne explicitement ὁ ἀσεβῶν et ἡ ἀσέβεια αὐτοῦ sous le même prédicat μισητά θεῷ. La traduction conserve cette tension sans l’adoucir ni en tirer une doctrine plus générale que le verset.
translation_notes:
  register: Français moderne, digne et accessible. La répétition « impie / impiété » reproduit la parenté lexicale du grec ; « odieux à Dieu » conserve la valeur adjectivale de μισητά θεῷ.
