base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/010.yaml
  text: For the thing done[a], together with the one who did it, will be punished.
translation:
  language: fr
  text: Car ce qui a été fait[a] sera puni avec celui qui l’a fait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui a été fabriqué ». Dans le contexte, il s’agit de l’idole fabriquée et de son fabricant.
    reason: La tournure grecque peut désigner généralement ce qui a été fait ou, selon le contexte immédiat, l’objet fabriqué.
lexical_decisions:
- source_word: καὶ γάρ
  choice: Car
  rationale: La locution introduit l’explication de l’affirmation précédente; « Car » en restitue naturellement la valeur explicative.
- source_word: τὸ πραχθέν
  choice: ce qui a été fait
  rationale: Le participe passif substantivé peut désigner largement ce qui a été accompli ou, dans ce contexte, l’objet fabriqué. Cette formulation française conserve cette amplitude sans ajouter explicitement « idole ».
- source_word: σὺν
  choice: avec
  rationale: La préposition exprime ici l’association dans le châtiment. « Avec » est clair et naturel; la construction de la phrase suffit à exprimer le sort commun.
- source_word: τῷ δράσαντι
  choice: celui qui l’a fait
  rationale: Le participe substantivé désigne l’auteur de l’action. Le verbe « faire » maintient le lien lexical et sémantique avec « ce qui a été fait », tout en laissant le contexte préciser qu’il s’agit du fabricant.
- source_word: κολασθήσεται
  choice: sera puni
  rationale: Le futur passif exprime un châtiment à venir; « sera puni » est la formulation française moderne la plus directe.
theological_decisions:
- issue: Faut-il nommer explicitement l’idole et son fabricant dans le texte principal ?
  choice: Conserver la formulation générale « ce qui a été fait » et « celui qui l’a fait ».
  alternative: « l’idole » et « celui qui l’a fabriquée »
  rationale: Le contexte indique une idole fabriquée et son fabricant, mais le grec de cette proposition emploie des termes plus généraux. La traduction préserve donc cette généralité et son ambiguïté authentique sans imposer dans le texte un référent seulement fourni par le contexte.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « fait » reflète le parallélisme grec et préserve l’ambiguïté entre l’acte accompli et l’objet fabriqué.
