  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/019.yaml
  text: For he[a], perhaps wishing to please the ruler, forced the likeness by his skill into a more beautiful form[b];
translation:
  language: fr
  text: Car l’artiste, peut-être désireux de plaire au souverain[a], força par son savoir-faire la ressemblance à devenir plus belle[b] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à celui qui détenait le pouvoir » ou « au dirigeant ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « força la ressemblance vers le plus beau » ; le grec suggère que l’artiste a poussé la représentation au-delà de la simple ressemblance pour l’idéaliser.
    reason: lexical_alternative
lexical_decisions:
- source_word: τάχα
  choice: peut-être
  rationale: Dans ce contexte, l’adverbe exprime vraisemblablement une supposition sur le motif de l’artiste, plutôt que la rapidité.
- source_word: κρατοῦντι
  choice: au souverain
  rationale: Le participe désigne celui qui détient ou exerce le pouvoir. « Souverain » convient au cadre politique sans préciser indûment son titre.
- source_word: βουλόμενος ἀρέσαι
  choice: désireux de plaire
  rationale: Cette formulation naturelle conserve à la fois la volonté exprimée par βουλόμενος et le sens direct de ἀρέσαι.
- source_word: ἐξεβιάσατο
  choice: força
  rationale: Le verbe évoque une action poussée au-delà de ce qui est naturel. « Força » préserve cette vigueur sans ajouter explicitement l’idée morale de déformation.
- source_word: τῇ τέχνῃ
  choice: par son savoir-faire
  rationale: τέχνη désigne ici le métier, l’art ou l’habileté technique de l’artiste ; « savoir-faire » exprime clairement le moyen employé.
- source_word: τὴν ὁμοιότητα
  choice: la ressemblance
  rationale: Le terme grec désigne directement la similitude ou ressemblance et ne doit pas être précisé d’emblée comme une idole.
- source_word: ἐπὶ τὸ κάλλιον
  choice: à devenir plus belle
  rationale: La tournure indique une orientation vers une beauté supérieure ; cette formulation rend naturellement en français le résultat recherché.
theological_decisions:
- issue: Présentation de l’action de l’artiste dans le contexte de la critique de l’idolâtrie
  choice: Décrire l’embellissement artistique destiné à plaire au souverain sans ajouter de condamnation morale explicite.
  alternative: Traduire ἐξεβιάσατο par « déforma » afin de faire ressortir plus directement la critique.
  rationale: Le contexte général condamne l’idolâtrie, mais ce verset décrit le procédé artistique et le motif politique. La traduction conserve cette tension sans introduire dans la phrase une qualification morale qui n’y est pas explicitement formulée.
translation_notes:
  register: Français international moderne, digne et accessible. « L’artiste » explicite le référent contextuel de ὁ μὲν ; « savoir-faire » évite l’ambiguïté moderne de « art » tout en conservant l’idée de maîtrise technique.
