base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/031.yaml
  text: For it is not the power of the things by which they swear[a], but the punishment of those who sin[b], that always pursues the transgression of the unrighteous.
translation:
  language: fr
  text: Car ce n’est pas la puissance de ce par quoi l’on jure[a], mais le châtiment de ceux qui pèchent[b], qui poursuit toujours la transgression des injustes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la puissance des serments » ou « la puissance de ce que l’on invoque en jurant ». L’expression grecque est condensée et peut désigner soit le serment lui-même, soit les réalités invoquées dans le serment.
    reason: lexical_alternative
  - marker: b
    text: Ou « mais le châtiment des pécheurs poursuit toujours la transgression des injustes ».
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Car ce n’est pas
  rationale: « Car » conserve la valeur explicative de γάρ et introduit naturellement le motif de l’affirmation précédente.
- source_word: ἡ τῶν ὀμνυμένων δύναμις
  choice: la puissance de ce par quoi l’on jure
  rationale: Le participe substantivé au génitif est condensé et peut viser ce qui est invoqué dans le serment. Cette formulation française reste naturelle tout en préservant l’ambiguïté entre la réalité invoquée et, par extension, le serment.
- source_word: ἀλλ᾽ ἡ τῶν ἁμαρτανόντων δίκη
  choice: mais le châtiment de ceux qui pèchent
  rationale: Dans ce contexte de rétribution, δίκη désigne la sanction qui atteint les pécheurs. « Châtiment » exprime clairement cette dimension judiciaire sans préciser indûment son mode ou son auteur.
- source_word: ἐπεξέρχεται
  choice: poursuit
  rationale: Le verbe évoque le fait d’aller à la poursuite de quelqu’un ou de quelque chose; « poursuit » maintient cette image active.
- source_word: ἀεὶ
  choice: toujours
  rationale: Équivalent direct, courant et idiomatique.
- source_word: τὴν τῶν ἀδίκων παράβασιν
  choice: la transgression des injustes
  rationale: « Transgression » conserve le registre moral et juridique de παράβασις; « les injustes » rend substantivement ἀδίκων sans ajouter la notion distincte de méchanceté.
theological_decisions:
- issue: Portée de δίκη dans l’affirmation sur la rétribution
  choice: le châtiment de ceux qui pèchent
  alternative: la justice qui frappe ceux qui pèchent; la sanction des pécheurs
  rationale: Le contexte oppose la prétendue puissance de ce qui est invoqué dans un serment à la sanction effective attachée au péché. « Châtiment » rend ici le sens rétributif de δίκη sans développer une doctrine particulière du jugement.
- issue: Référent de τῶν ὀμνυμένων
  choice: ce par quoi l’on jure
  alternative: les serments; ce que l’on prend à témoin en jurant
  rationale: Le grec permet de comprendre soit les réalités invoquées, soit plus largement les serments. Le texte principal privilégie la construction la plus proche du participe, et la note maintient l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe contrastive du grec est conservée, avec une ponctuation qui clarifie que « qui poursuit » a pour antécédent « le châtiment ». Les termes « transgression » et « injustes » maintiennent le registre moral et judiciaire du passage.
