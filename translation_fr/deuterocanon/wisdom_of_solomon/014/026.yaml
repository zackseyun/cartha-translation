  text: forgetfulness of favors[a], defilement of souls, perversion of birth, disorder in marriages[b], adultery and debauchery.
translation:
  language: fr
  text: oubli des bienfaits[a], souillure des âmes, altération de la naissance[b], désordre dans les mariages, adultère et débauche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « oubli de la grâce ». Le grec χάρις peut désigner une faveur, un bienfait, la grâce ou la gratitude selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « changement de la naissance » ou « de la génération ». Cette expression condensée désigne probablement une corruption ou une inversion de l’ordre naturel lié à la procréation.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτος ἀμνησία
  choice: oubli des bienfaits
  rationale: « Bienfaits » exprime ici les faveurs reçues, tandis qu’« oubli » conserve le sens direct d’ἀμνησία sans expliciter l’ingratitude seulement sous-entendue.
- source_word: ψυχῶν μιασμός
  choice: souillure des âmes
  rationale: Cette formulation préserve les dimensions morale et spirituelle, voire cultuelle, de μιασμός ainsi que le registre de ψυχή.
- source_word: γενέσεως ἐναλλαγή
  choice: altération de la naissance
  rationale: Le grec est condensé et littéralement proche de « changement de la naissance/génération ». « Altération » rend la valeur négative suggérée par la liste sans préciser abusivement la nature exacte du dérèglement.
- source_word: γάμων ἀταξία
  choice: désordre dans les mariages
  rationale: « Désordre » est le sens courant d’ἀταξία; « dans les mariages » produit une expression française naturelle sans réduire γάμων aux seules cérémonies nuptiales.
- source_word: μοιχεία
  choice: adultère
  rationale: Équivalent français précis et usuel.
- source_word: ἀσέλγεια
  choice: débauche
  rationale: Le terme désigne une conduite sensuelle effrénée et éhontée; « débauche » en restitue la force dans un français actuel.
theological_decisions:
- issue: Sens de χάριτος dans χάριτος ἀμνησία
  choice: bienfaits
  alternative: grâce
  rationale: Dans cette liste de vices, les faveurs ou bienfaits reçus sont probablement en vue. « Grâce » reste lexicalement possible, mais pourrait introduire ici une portée doctrinale que le contexte n’impose pas.
- issue: Portée anthropologique de ψυχῶν
  choice: âmes
  alternative: personnes ou vies
  rationale: « Âmes » maintient la gravité morale et spirituelle du texte sans trancher une anthropologie systématique.
- issue: Interprétation de γενέσεως ἐναλλαγή
  choice: altération de la naissance
  alternative: changement de la génération; perversion de la procréation
  rationale: La tournure grecque demeure obscure et peut viser une inversion de l’ordre naturel ou procréateur. Le texte principal reste proche de la formulation source, et la note signale l’interprétation contextuelle possible.
translation_notes:
  register: Français international moderne, sobre et soutenu. La structure nominale de la liste grecque est conservée. Les formulations évitent à la fois l’explicitation doctrinale de « grâce » et une interprétation trop précise de l’expression obscure γενέσεως ἐναλλαγή.
