review_pass:
  verdict: revise
  source_fidelity: La construction causale/instrumentale « par la vaine gloire des humains » rend bien κενοδοξίᾳ γὰρ ἀνθρώπων, et le sujet implicite de εἰσῆλθεν est correctement signalé sans être imposé. En revanche, « une fin rapide » privilégie l'idée de vitesse, alors que σύντομον avec τέλος désigne plus directement une fin brève/courte. « a été réservée » conserve un passif, mais atténue le sens de ἐπενόηθη (« fut conçue, projetée, imaginée »).
  naturalness: Le français est globalement naturel et de registre approprié. « Leur fin brève a été conçue » est un peu solennel, mais reste clair, idiomatique dans une traduction biblique moderne et plus proche du grec que « une fin rapide leur a été réservée ».
  terminology: « Vaine gloire » est un bon équivalent précis de κενοδοξία. « Humains » convient au français international et préserve la valeur générique de ἀνθρώπων. Le pronom féminin « elle » demeure acceptable, avec une note qui explicite seulement le contexte.
  issues:
  - severity: medium
    issue: « une fin rapide » pour σύντομον ... τέλος
    rationale: « Rapide » peut qualifier le déroulement ou la survenue de la fin. Le grec souligne plus sûrement la brièveté de la fin elle-même ; « fin brève » préserve cette nuance sans la réduire à l'imminence.
  - severity: medium
    issue: « a été réservée » pour ἐπενόηθη
    rationale: Cette expression française évoque surtout une attribution ou un sort destiné. ἐπενόηθη est un passif de « concevoir/projeter » ; « a été conçue » rend la délibération implicite tout en laissant l'agent non nommé.
  revised_text: Car c’est par la vaine gloire des humains qu’elle est entrée dans le monde[a], et c’est pourquoi leur fin brève a été conçue[b].
