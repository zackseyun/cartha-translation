base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/014.yaml
  text: For by human vanity it entered into the world, and because of this their end was devised to be brief.
translation:
  language: fr
  text: Car c’est par la vaine gloire des humains qu’elle est entrée dans le monde[a], et c’est pourquoi leur fin brève a été conçue[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sujet de « elle est entrée » n’est pas exprimé en grec ; d’après le contexte, il s’agit de l’apparition des idoles ou de l’idolâtrie.
    reason: alternative_reading
  - marker: b
    text: Le grec est au passif et ne précise pas qui a conçu cette fin brève.
    reason: alternative_reading
lexical_decisions:
- source_word: κενοδοξίᾳ ἀνθρώπων
  choice: par la vaine gloire des humains
  rationale: Le datif exprime ici vraisemblablement le moyen ou la cause. « Vaine gloire » rend le sens d’une recherche de gloire vide et illusoire plus précisément que le terme général « vanité » ; « des humains » conserve la portée générique de ἀνθρώπων.
- source_word: εἰσῆλθεν εἰς κόσμον
  choice: elle est entrée dans le monde
  rationale: Le verbe est au singulier et son sujet, non exprimé en grec, doit être repris par un pronom en français. Le féminin « elle » peut renvoyer au phénomène évoqué dans le contexte, notamment l’idolâtrie, sans le nommer explicitement dans le texte.
- source_word: διὰ τοῦτο
  choice: c’est pourquoi
  rationale: Cette tournure française exprime naturellement le rapport de conséquence indiqué par le grec.
- source_word: σύντομον ... τέλος
  choice: une fin rapide
  rationale: σύντομος peut désigner ce qui est bref ou survient rapidement. Avec τέλος et ἐπενόηθη, « une fin rapide » est idiomatique et conserve l’idée d’une terminaison qui ne tardera pas.
- source_word: αὐτῶν
  choice: leur
  rationale: Le pluriel renvoie le plus naturellement aux idoles ou images évoquées dans le contexte. La traduction préserve ce pluriel sans préciser davantage le référent.
- source_word: ἐπενόηθη
  choice: a été réservée
  rationale: Le passif indique qu’une fin a été conçue ou arrêtée pour elles, sans nommer l’agent. « A été réservée » exprime une destination arrêtée de façon naturelle en français, sans ajouter explicitement un auteur divin.
theological_decisions:
- issue: Sujet implicite de εἰσῆλθεν
  choice: Un pronom féminin, « elle », dont le référent demeure implicite et se déduit du contexte.
  alternative: Expliciter « l’idolâtrie est entrée » ou employer un pluriel renvoyant aux idoles.
  rationale: Le grec ne nomme pas le sujet. Le pronom permet au contexte de déterminer le référent et évite d’inscrire dans le texte une explicitation interprétative.
- issue: Agent du passif ἐπενόηθη
  choice: 'Maintenir un passif sans agent : « a été réservée ».'
  alternative: Nommer Dieu comme agent, ou traduire impersonnellement par « leur fin devait être rapide ».
  rationale: Le texte ne précise pas qui a arrêté cette fin. Nommer Dieu résoudrait indûment l’ambiguïté ; le passif la préserve.
translation_notes:
  register: Français international moderne, digne et accessible. « Vaine gloire » conserve la nuance précise de κενοδοξία ; les deux passifs et référents implicites sont rendus sans ajout doctrinal.
