revisions:
- from: Car c’est par la vaine gloire des humains qu’elle est entrée dans le monde[a], et c’est pourquoi une fin rapide leur a été réservée[b].
  to: Car c’est par la vaine gloire des humains qu’elle est entrée dans le monde[a], et c’est pourquoi leur fin brève a été conçue[b].
  rationale: La révision maintient les référents et l’agent implicites tels que le grec les laisse, tout en rétablissant la valeur de brièveté de σύντομον et le sens de conception/projet de ἐπενόηθη. La note b est simplifiée afin d’expliquer l’ambiguïté réelle sans présenter le texte principal comme une simple alternative.
