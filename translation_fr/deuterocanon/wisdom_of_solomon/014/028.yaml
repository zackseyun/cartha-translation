    text: 'Autre traduction possible : « en faisant la fête, ils sont pris de folie ». Le participe grec suivi d’un parfait permet de nuancer différemment l’aspect de l’action et l’état qui en résulte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ils se parjurent sans hésiter ». Le verbe grec désigne le fait de jurer faussement ou de se rendre coupable de parjure.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐφραινόμενοι
  choice: quand ils font la fête
  rationale: Le participe exprime ici une activité festive, vraisemblablement liée au contexte cultuel. Cette formulation est naturelle en français moderne et ne suppose pas que la joie soit condamnée en elle-même.
- source_word: μεμήνασιν
  choice: ils sombrent dans la folie
  rationale: Le parfait de μαίνομαι décrit un état de folie ou de frénésie atteint et désormais manifeste. « Sombrent dans la folie » rend avec naturel le passage à cet état et son résultat présent.
- source_word: προφητεύουσιν ψευδῆ
  choice: ils prophétisent des mensonges
  rationale: La construction verbe-objet est conservée, ainsi que la vigueur de l’accusation grecque, sans l’atténuer en simple qualification adverbiale.
- source_word: ζῶσιν ἀδίκως
  choice: ils vivent dans l’injustice
  rationale: Cette expression garde la dimension à la fois morale et sociale de ἀδίκως, sans lui imposer un sens doctrinal plus étroit.
- source_word: ἐπιορκοῦσιν
  choice: faire de faux serments
  rationale: Le verbe désigne le fait de jurer faussement ou de se parjurer. La formulation retenue rend explicitement le vocabulaire du serment et reste immédiatement compréhensible.
- source_word: ταχέως
  choice: ils s’empressent de
  rationale: Dans ce contexte, l’adverbe évoque moins la vitesse mesurable qu’une prompte disposition à jurer faussement. Cette tournure française exprime cette facilité empressée.
theological_decisions:
- issue: Portée de ἀδίκως dans le contexte éthique de la Sagesse
  choice: ils vivent dans l’injustice
  alternative: ils vivent dans l’impiété / ils vivent de manière injuste
  rationale: « Dans l’injustice » préserve le chevauchement entre faute morale et comportement injuste, sans réduire le terme à l’impiété religieuse ni en faire un terme technique.
translation_notes:
  register: Français international moderne, naturel et digne. La série répétée « ou bien » reproduit la structure grecque et son effet d’accumulation. Le point-virgule final du texte source est rendu ici par un point, le verset étant présenté isolément.
