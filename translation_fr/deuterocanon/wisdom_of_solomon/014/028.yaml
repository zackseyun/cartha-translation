translation:
  language: fr
  text: Car soit qu’ils deviennent fous en faisant la fête[a], soit qu’ils prophétisent des mensonges, soit qu’ils vivent injustement, soit qu’ils jurent faussement sans hésiter[b].
  philosophy: optimal-equivalence
  footnotes:
