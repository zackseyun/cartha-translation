revisions:
- from: Car, ou bien, quand ils font la fête, ils sombrent dans la folie[a], ou bien ils prophétisent des mensonges, ou bien ils vivent dans l’injustice, ou bien ils s’empressent de faire de faux serments[b].
  to: Car soit qu’ils deviennent fous en faisant la fête[a], soit qu’ils prophétisent des mensonges, soit qu’ils vivent injustement, soit qu’ils jurent faussement sans hésiter[b].
  rationale: La correction améliore la syntaxe française de la série disjonctive et rend plus précisément les valeurs adverbiales de ἀδίκως et ταχέως. Les notes restent correctement ancrées et présentent des alternatives légitimes sans trancher au-delà de ce que permet le grec.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T10:20:30Z'
review_pass:
  verdict: revise
  source_fidelity: La structure disjonctive répétée et les quatre accusations sont bien rendues. Toutefois, « ils vivent dans l’injustice » transforme l’adverbe ἀδίκως (« injustement ») en un complément de situation, et « s’empressent de faire de faux serments » est moins direct et moins idiomatique que le grec pour l’acte de jurer faussement. La révision rend ces deux éléments plus exactement, tout en conservant la nuance de promptitude de ταχέως.
  naturalness: « Car, ou bien … ou bien » est lourd en français moderne. La tournure corrélative « soit que …, soit qu’… » reproduit naturellement la série grecque. « Devenir fous en faisant la fête » est plus direct et moins métaphorique que « sombrer dans la folie ».
  terminology: « Prophétiser des mensonges » préserve le verbe et son objet. « Vivre injustement » rend ἀδίκως sans imposer la connotation spatiale de « dans l’injustice ». « Jurer faussement sans hésiter » explicite le parjure et la disponibilité prompte indiquée par ταχέως.
  issues:
  - severity: medium
    issue: Rendu de ζῶσιν ἀδίκως
    rationale: « Ils vivent dans l’injustice » peut décrire un milieu ou un état social; le grec emploie l’adverbe ἀδίκως et qualifie leur manière de vivre. « Ils vivent injustement » est plus fidèle.
  - severity: low
    issue: Tournure « Car, ou bien … ou bien »
    rationale: La répétition de « ou bien » après « Car » est pesante en français. « Soit que …, soit qu’… » conserve clairement l’alternative accumulative du grec.
  - severity: low
    issue: Expression du faux serment
    rationale: « S’empressent de faire de faux serments » est compréhensible, mais « jurent faussement sans hésiter » est plus idiomatique et correspond plus directement à ἐπιορκοῦσιν ταχέως.
