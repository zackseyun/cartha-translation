review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèle, notamment la servitude causée par le malheur ou la tyrannie et l’attribution indue du nom aux réalités matérielles. Toutefois, « à la pierre » efface sans nécessité le pluriel grec λίθοις. « Nom incommunicable » rend plus exactement et plus idiomatiquement, dans ce registre, ἀκοινώνητον que « nom qui ne se partage pas ».
  naturalness: « Un piège tendu à la vie » est compréhensible, mais « un piège tendu contre la vie » exprime plus nettement et naturellement la direction hostile de l’image. Le reste de la phrase demeure fluide dans un français international soutenu.
  terminology: « Asservis », « malheur », « tyrannie » et « attribuèrent » conviennent. « Le nom incommunicable » est un terme français établi dans ce contexte et préserve l’exclusivité sans décider au-delà du texte si le référent précis est le nom divin ou l’honneur divin.
  issues:
  - severity: medium
    issue: Singulier « à la pierre » pour λίθοις
    rationale: Le grec emploie le pluriel « aux pierres », tandis que « bois » peut naturellement rester collectif au singulier en français. Il est préférable de conserver le pluriel sans motif contextuel de le neutraliser.
  - severity: low
    issue: Rendu de ἀκοινώνητον par « qui ne se partage pas »
    rationale: La formulation est accessible, mais elle est moins précise et moins idiomatique dans le registre théologique que « incommunicable », qui rend l’idée d’un nom non communicable aux idoles.
  - severity: low
    issue: Orientation de « piège tendu à la vie »
    rationale: « Contre la vie » rend plus explicitement la valeur hostile de l’expression grecque εἰς ἔνεδρον τῷ βίῳ, sans ajouter de contenu.
