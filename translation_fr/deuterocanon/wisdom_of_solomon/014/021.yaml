base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/021.yaml
  text: And this became an ambush against life[a], because men, enslaved by calamity or by tyranny, bestowed the incommunicable name on stones and wood.
translation:
  language: fr
  text: 'Et cela devint un piège tendu contre la vie : des humains, asservis par le malheur ou par la tyrannie, attribuèrent aux pierres et au bois le nom incommunicable[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « le nom qui n’est pas partagé ». Dans ce contexte, il s’agit du nom divin, ou de l’honneur qui n’appartient qu’à Dieu et ne doit pas être attribué aux idoles.
    reason: Précise la valeur de ἀκοινώνητον et l’arrière-plan anti-idolâtrique sans transformer l’implicite contextuel en paraphrase dans le texte.
lexical_decisions:
- source_word: ἔνεδρον
  choice: un piège tendu
  rationale: Le nom évoque d’abord une embuscade ou le fait de se tenir à l’affût. « Un piège tendu » conserve cette image hostile tout en étant naturel en français avec « à la vie ».
- source_word: τῷ βίῳ
  choice: à la vie
  rationale: Dans la construction εἰς ἔνεδρον, le datif désigne ce que menace le piège. « À la vie » préserve la formulation générale du grec sans la réduire explicitement à la seule vie physique.
- source_word: συμφορᾷ
  choice: le malheur
  rationale: Le terme désigne une circonstance adverse, un malheur ou une calamité. « Malheur » est clair, digne et suffisamment large.
- source_word: τυραννίδι
  choice: la tyrannie
  rationale: Traduction directe de la domination tyrannique, qui conserve la dimension politique et coercitive du grec.
- source_word: δουλεύσαντες
  choice: asservis
  rationale: Le participe exprime la servitude. « Asservis » rend sa force coercitive et s’accorde naturellement avec le malheur comme avec la tyrannie.
- source_word: τὸ ἀκοινώνητον ὄνομα
  choice: le nom qui ne se partage pas
  rationale: Cette formulation rend le sens littéral de ce qui n’est pas commun ou ne peut être partagé, tout en restant plus accessible que le terme technique « incommunicable ».
- source_word: λίθοις καὶ ξύλοις
  choice: à la pierre et au bois
  rationale: Le singulier collectif français rend naturellement les matériaux mentionnés sans ajouter au texte la notion explicite de statues ou d’images.
- source_word: περιέθεσαν
  choice: attribuèrent
  rationale: Dans ce contexte, le verbe signifie placer ou conférer quelque chose à quelqu’un ou à quelque chose. « Attribuèrent » exprime clairement le transfert indu du nom.
theological_decisions:
- issue: Sens de τὸ ἀκοινώνητον ὄνομα dans le contexte de l’idolâtrie
  choice: le nom qui ne se partage pas
  alternative: le nom incommunicable
  rationale: La traduction maintient l’exclusivité suggérée par le grec sans définir dans le corps du texte s’il s’agit strictement du nom divin ou, plus largement, de l’honneur propre à Dieu. La note signale cette portée contextuelle sans l’imposer comme paraphrase.
translation_notes:
  register: Français international actuel, clair et digne. La phrase conserve l’image vive du piège, la force de la servitude et le caractère concret de « la pierre et du bois », sans expliciter davantage que le grec la nature des objets idolâtriques.
