  text: For blessed is the wood through which righteousness comes[a].
translation:
  language: fr
  text: Car le bois est béni, par lequel la justice se réalise[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la droiture ». Le grec δικαιοσύνη peut désigner la justice ou la droiture morale.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλόγηται
  choice: béni est
  rationale: 'Le parfait passif exprime l’état résultant du bois : il est tenu pour béni. L’ordre « béni est » garde une dignité littéraire sans être archaïque.'
- source_word: γὰρ
  choice: car
  rationale: Conserve le lien explicatif avec l’énoncé précédent.
- source_word: ξύλον
  choice: le bois
  rationale: Le terme peut désigner le bois, un arbre ou un objet en bois. Ici, « le bois » préserve le terme matériel sans préciser indûment l’objet.
- source_word: δι’ οὗ
  choice: par lequel
  rationale: Le pronom relatif neutre renvoie à ξύλον et présente le bois comme moyen ou instrument.
- source_word: γίνεται
  choice: advient
  rationale: Le verbe désigne ce qui vient à l’existence ou se réalise. « Advient » préserve cette nuance tout en convenant au registre sapientiel.
- source_word: δικαιοσύνη
  choice: la justice
  rationale: En français, « justice » couvre naturellement ici la droiture morale, l’ordre juste et l’action salvatrice, tandis que « droiture » reste une possibilité plus explicitement morale.
theological_decisions:
- issue: Sens de δικαιοσύνη
  choice: justice
  alternative: droiture
  rationale: Le grec peut évoquer aussi bien la qualité morale de droiture que la justice réalisée. « Justice » maintient cette amplitude en français sans imposer une lecture doctrinale particulière.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation concise conserve la structure explicative et la tension du grec; « advient » relève légèrement le registre sans l’archaïser.
