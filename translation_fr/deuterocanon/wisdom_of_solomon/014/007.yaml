  source_fidelity: 'Le projet rend correctement les éléments essentiels : γάρ (« Car »), ξύλον (« le bois »), le relatif instrumental δι’ οὗ (« par lequel ») et δικαιοσύνη (« la justice »). Toutefois, « advient la justice » est une tournure peu idiomatique en français contemporain et ne rend pas naturellement le sens de γίνεται, ici celui d’une réalité qui se produit ou se réalise par ce moyen.'
