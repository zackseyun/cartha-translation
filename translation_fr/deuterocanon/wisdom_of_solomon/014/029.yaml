base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/029.yaml
  text: For because they trusted in lifeless idols[b][a], after swearing wickedly they do not expect to be harmed.
translation:
  language: fr
  text: Car, puisqu’ils mettent leur confiance dans des idoles sans vie[a], ils ne s’attendent pas, après avoir juré de manière coupable[b], à subir un tort[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des idoles vaines » ou « des idoles sans consistance ». L’adjectif grec souligne qu’elles sont dépourvues de vie ou de réalité effective.
    reason: lexical_alternative
  - marker: b
    text: Ou « après avoir prêté un faux serment ». Le grec porte un jugement moral qui peut, dans ce contexte, viser un serment mensonger.
    reason: lexical_alternative
  - marker: c
    text: Ou « à être lésés » ou « à être punis ». Le grec peut désigner largement le fait de subir un tort ; dans le contexte, il peut s’agir des conséquences du serment coupable.
    reason: alternative_reading
lexical_decisions:
- source_word: αἴγνιοι
  choice: sans vie
  rationale: D’après la leçon validée et son contexte, l’adjectif qualifie les idoles comme dépourvues de vie et de puissance réelle. « Sans vie » est clair, concret et naturel en français.
- source_word: πεποιθότες
  choice: mettent leur confiance
  rationale: Le participe parfait exprime une confiance établie et persistante. Cette tournure française en restitue naturellement la portée.
- source_word: εἰδώλοις
  choice: idoles
  rationale: Le mot désigne ici des images cultuelles considérées comme des divinités ; « idoles » conserve la portée polémique du passage.
- source_word: κακῶς
  choice: de manière coupable
  rationale: L’adverbe porte un jugement moral sur l’acte de jurer sans le limiter explicitement au seul faux serment.
- source_word: ὀμόσαντες
  choice: après avoir juré
  rationale: Le participe a ici une valeur temporelle ; la formulation française reste directe sans ajouter un complément absent du grec.
- source_word: ἀδικηθῆναι
  choice: subir de tort
  rationale: La formule demeure assez large pour évoquer un dommage, un tort subi ou une sanction, sans imposer une interprétation unique.
- source_word: οὐ προσδέχονται
  choice: ils ne s’attendent pas
  rationale: Cette expression rend clairement, en français courant, l’idée d’une conséquence qu’ils n’anticipent pas.
theological_decisions:
- issue: Sens de la conséquence redoutée
  choice: Ils ne s’attendent pas à subir de tort après avoir juré de manière coupable.
  alternative: Ils ne s’attendent pas à être punis pour un faux serment, ou à être lésés par les idoles elles-mêmes.
  rationale: Le contexte suggère l’absence de crainte d’une rétribution de la part d’idoles impuissantes, mais ἀδικηθῆναι reste plus général. La traduction conserve cette amplitude.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe causale du grec est conservée, tout en évitant une formulation lourde. Les notes maintiennent les ambiguïtés lexicale et théologique du texte source.
