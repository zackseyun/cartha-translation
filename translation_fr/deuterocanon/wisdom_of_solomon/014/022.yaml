base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/022.yaml
  text: Then it was not enough for them to go astray concerning the knowledge of God[a], but also, living in a great war of ignorance[b], they call such great evils peace.
translation:
  language: fr
  text: Ensuite, il ne leur a pas suffi de s’égarer au sujet de la connaissance de Dieu[a] ; vivant dans une grande guerre d’ignorance[b], ils donnent aussi à de si grands maux le nom de paix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’être égarés au sujet de la connaissance de Dieu ». La forme grecque peut recevoir une nuance plus passive.'
    reason: lexical_alternative
  - marker: b
    text: 'L’expression « une grande guerre d’ignorance » conserve la métaphore grecque : l’ignorance y apparaît comme un état de guerre ou de profond conflit.'
    reason: cultural_note
lexical_decisions:
- source_word: Εἶτʼ
  choice: Ensuite
  rationale: Marque une nouvelle étape dans la progression du raisonnement, sans imposer un lien causal plus fort que le grec.
- source_word: οὐκ ἤρκεσεν
  choice: il ne leur a pas suffi
  rationale: Rend naturellement en français la tournure impersonnelle grecque et explicite le référent humain impliqué par l’infinitif.
- source_word: τὸ πλανᾶσθαι
  choice: de s’égarer
  rationale: Exprime la déviation intellectuelle et morale tout en laissant ouverte la nuance moyenne ou passive de la forme grecque.
- source_word: περὶ τὴν τοῦ θεοῦ γνῶσιν
  choice: au sujet de la connaissance de Dieu
  rationale: Conserve la formulation substantivale et son poids théologique sans réduire γνῶσις au seul acte subjectif de connaître.
- source_word: μεγάλῳ ... ἀγνοίας πολέμῳ
  choice: dans une grande guerre d’ignorance
  rationale: Préserve la métaphore forte de la guerre ainsi que l’ambiguïté du génitif, qui peut évoquer une guerre caractérisée ou produite par l’ignorance.
- source_word: ζῶντες
  choice: vivant
  rationale: Le participe français maintient le rapport circonstanciel avec le verbe principal.
- source_word: τὰ τοσαῦτα κακὰ
  choice: de si grands maux
  rationale: Rend l’intensité de τοσαῦτα dans un français naturel et soutenu.
- source_word: εἰρήνην προσαγορεύουσιν
  choice: ils donnent ... le nom de paix
  rationale: Restitue clairement l’acte paradoxal de nommer ces maux « paix », avec plus de naturel que « ils les appellent paix ».
theological_decisions:
- issue: Nuance moyenne ou passive de πλανᾶσθαι
  choice: s’égarer
  alternative: être égarés
  rationale: « S’égarer » met l’accent sur l’état de déviation sans attribuer explicitement celle-ci à un agent extérieur ; la possibilité passive est signalée en note.
- issue: Portée de εἰρήνην
  choice: paix
  alternative: sécurité ou ordre
  rationale: Le grec emploie simplement « paix ». Le conserver maintient l’ironie morale du texte et évite une expansion politique ou doctrinale.
- issue: Relation exprimée par ἀγνοίας dans la métaphore
  choice: guerre d’ignorance
  alternative: guerre causée par l’ignorance
  rationale: La formulation retenue préserve la tension du génitif grec au lieu de préciser sans nécessité si l’ignorance caractérise, constitue ou provoque la guerre.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la structure grecque, tandis que « ils donnent … le nom de paix » assure une formulation française naturelle. Les deux marqueurs de note figurent dans le texte.
