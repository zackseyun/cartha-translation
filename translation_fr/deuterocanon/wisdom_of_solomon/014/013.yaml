  text: For it was not from the beginning[a], nor will it be forever.
translation:
  language: fr
  text: Car cela n’existait pas dès le commencement[a] et n’existera pas pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec laisse le sujet implicite d’après le contexte ; il peut s’agir des idoles ou de l’idolâtrie.
    reason: alternative_reading
lexical_decisions:
- source_word: οὔτε γὰρ ... οὔτε
  choice: Car ... ne ... pas ... et ne ... pas
  rationale: γάρ introduit l’explication donnée par ce verset, d’où « Car ». La négation corrélative οὔτε... οὔτε est rendue par une coordination négative naturelle en français.
- source_word: ἦν
  choice: cela n’existait pas
  rationale: « Exister » exprime clairement ici l’être dans le temps, tandis que « cela » maintient le sujet implicite sans trancher entre l’idole et l’idolâtrie.
- source_word: ἀπ’ ἀρχῆς
  choice: dès le commencement
  rationale: Cette formulation naturelle restitue l’idée d’une existence remontant au commencement.
- source_word: εἰς τὸν αἰῶνα
  choice: éternellement
  rationale: Dans ce contraste entre origine et durée future, l’expression signifie que la réalité évoquée ne subsistera pas pour toujours.
- source_word: ἔσται
  choice: n’existera pas
  rationale: Le futur reprend « existait » et préserve le parallélisme temporel du grec dans un français idiomatique.
theological_decisions:
- issue: Sujet implicite dans le grec
  choice: Employer « cela » sans nommer explicitement le référent.
  alternative: « les idoles » ou « l’idolâtrie »
  rationale: Le grec ne formule aucun sujet et dépend du contexte précédent. « Cela » conserve cette indétermination authentique plutôt que de choisir entre l’idole et l’idolâtrie.
translation_notes:
  register: Français moderne, international et digne. « Dès le commencement » conserve la portée temporelle de l’expression grecque ; la répétition d’« exister » rend explicite et fluide le parallélisme entre passé et avenir.
