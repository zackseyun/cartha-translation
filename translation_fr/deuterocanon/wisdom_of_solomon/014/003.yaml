lexical_decisions:
- source_word: διακυβερνᾷ
  choice: gouverne
  rationale: Le verbe possède ici une nette couleur nautique et renvoie au navire du contexte. « Gouverne » conserve cette image tout en exprimant la conduite active exercée par la providence divine.
- source_word: πρόνοια
  choice: providence
  rationale: « Providence » réunit l’idée de prévoyance et celle de sollicitude divine agissante, sans réduire le terme à une simple planification.
- source_word: πάτερ
  choice: Père
  rationale: Le vocatif s’adresse directement à Dieu. « Père » est naturel, personnel et digne, sans ajout archaïsant.
- source_word: ἔδωκας
  choice: tu as donné
  rationale: Cette traduction directe de l’aoriste préserve l’expression du grec et reste idiomatique en français.
- source_word: ὁδὸν
  choice: un chemin
  rationale: « Chemin » convient à l’image biblique d’une voie dans la mer et se distingue du terme rendu ensuite par « sentier ».
- source_word: τρίβον
  choice: un sentier
  rationale: « Sentier » maintient le parallélisme tout en distinguant τρίβον de ὁδόν.
- source_word: ἀσφαλῆ
  choice: sûr
  rationale: L’adjectif indique que le passage est à l’abri du danger; « sûr » est clair et concis.
- source_word: ἐν θαλάσσῃ
  choice: dans la mer
  rationale: La formulation garde la préposition grecque et la force poétique d’un chemin situé dans la mer.
- source_word: ἐν κύμασι
  choice: au milieu des vagues
  rationale: Cette tournure française naturelle exprime la localisation parmi les vagues tout en conservant le parallélisme maritime.
theological_decisions:
- issue: Sens de πρόνοια appliqué à Dieu
  choice: providence
  alternative: prévoyance; sollicitude
  rationale: Le verset attribue à Dieu une conduite prévoyante et active. « Providence » en conserve la portée théologique sans développer une doctrine étrangère au texte.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La métaphore maritime est maintenue par « gouverne », et la structure poétique parallèle est conservée avec « chemin » et « sentier ».
