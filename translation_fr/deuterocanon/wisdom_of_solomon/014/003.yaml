  text: But your providence[a], Father, steers it, because you gave a way even in the sea, and a safe path in the waves,
translation:
  language: fr
  text: Mais ta providence, Père, le pilote[a], car tu as donné un chemin même dans la mer, et un sentier sûr dans les vagues.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le gouverne » ou « le dirige » ; le verbe grec a un sens nautique, en accord avec l’image du navire dans le contexte.
