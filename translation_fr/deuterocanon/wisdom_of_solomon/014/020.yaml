base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/020.yaml
  text: And the multitude[a], drawn by the charm of the workmanship, now regarded as an object of worship the man who a little before had been honored.
translation:
  language: fr
  text: Mais la foule, attirée par le charme de l’œuvre, considéra à présent comme un objet de culte[a] l’homme qui, peu auparavant, avait été honoré.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une idole », « une image sacrée » ou « un objet de vénération ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πλῆθος
  choice: la foule
  rationale: Désigne ici collectivement le grand nombre; « la foule » est naturel en français moderne tout en gardant la portée collective.
- source_word: ἐφελκόμενον
  choice: séduite
  rationale: Le participe exprime l’attraction exercée sur la foule; « séduite » rend cette force d’attrait dans un français idiomatique, en lien avec le charme de l’œuvre.
- source_word: διὰ τὸ εὔχαρι τῆς ἐργασίας
  choice: par le charme de l’œuvre
  rationale: εὔχαρι évoque une qualité plaisante et attirante, tandis que ἐργασία désigne ici le travail réalisé, l’ouvrage façonné.
- source_word: τὸν πρὸ ὀλίγου τιμηθέντα ἄνθρωπον
  choice: l’homme qui, peu auparavant, avait été honoré
  rationale: Conserve explicitement le contraste temporel et la progression entre l’honneur accordé à un être humain et sa vénération religieuse.
- source_word: νῦν
  choice: désormais
  rationale: Marque le nouvel état qui contraste avec « peu auparavant »; « désormais » souligne naturellement ce basculement.
- source_word: σέβασμα
  choice: un objet de culte
  rationale: Rend l’objet de vénération religieuse sans imposer le terme plus interprétatif « idole » ni limiter le référent à une simple image sacrée.
- source_word: ἐλογίσαντο
  choice: considéra comme
  rationale: Rend directement le sens de juger, tenir ou regarder quelqu’un comme quelque chose.
theological_decisions:
- issue: Nature de l’acte condamné exprimé par σέβασμα
  choice: L’homme naguère honoré est désormais considéré comme un objet de culte.
  alternative: On pourrait rendre σέβασμα par « idole », « image sacrée » ou « objet de vénération ».
  rationale: « Objet de culte » préserve le passage de l’honneur humain à la vénération religieuse sans préciser au-delà de ce qu’exige le grec la nature exacte de l’objet.
translation_notes:
  register: Français moderne, fluide et digne. La syntaxe maintient le contraste rhétorique entre l’honneur récent rendu à l’homme et son élévation ultérieure au rang d’objet de culte.
