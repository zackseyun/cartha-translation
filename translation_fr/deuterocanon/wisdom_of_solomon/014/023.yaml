base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/023.yaml
  text: For they were conducting either child-killing rites, or secret mysteries, or frenzied revelries with strange customs,
translation:
  language: fr
  text: Car ils célébraient soit des rites où l’on tuait des enfants, soit des mystères secrets, soit des fêtes délirantes aux coutumes insolites,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τεκνοφόνους τελετάς
  choice: des rites où l’on tuait des enfants
  rationale: Rend explicitement le caractère meurtrier de τεκνοφόνος tout en conservant τελεταί comme « rites ».
- source_word: κρύφια μυστήρια
  choice: des mystères secrets
  rationale: Conserve les deux éléments grecs, le caractère caché et la nature initiatique ou cultuelle des « mystères ».
- source_word: ἐμμανεῖς ... κώμους
  choice: des fêtes délirantes
  rationale: κῶμοι désigne des célébrations bruyantes et débridées; « fêtes » est naturel en français, tandis que « délirantes » restitue l’intensité de ἐμμανεῖς.
- source_word: ἐξάλλων θεσμῶν
  choice: aux coutumes insolites
  rationale: θεσμοί peut désigner des règles, usages ou coutumes; ἐξάλλων indique ici leur caractère hors norme ou étrange. « Aux » laisse ouverte la relation syntaxique avec les fêtes.
theological_decisions:
- issue: Nature des τελεταί
  choice: rites où l’on tuait des enfants
  alternative: rites meurtriers d’enfants
  rationale: La formulation retenue évite de suggérer que les enfants eux-mêmes seraient les agents du meurtre et exprime clairement l’accusation du texte.
- issue: Portée de ἐξάλλων θεσμῶν
  choice: coutumes insolites associées aux fêtes
  alternative: célébrations délirantes de rites étrangers
  rationale: Le grec permet une certaine souplesse dans le rapport entre κώμους et θεσμῶν; la traduction conserve cette tension sans transformer θεσμοί en prescriptions divines ou en doctrine particulière.
translation_notes:
  register: Français moderne, courant et digne. La structure ternaire « soit… soit… soit… » reproduit l’énumération grecque. La virgule finale est conservée parce que le verset forme syntaxiquement une transition vers la suite.
