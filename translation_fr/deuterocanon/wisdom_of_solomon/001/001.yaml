base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/001.yaml
  text: Love righteousness[a], you who judge the earth; think about the Lord with goodness[c][b], and seek him with singleness of heart.
translation:
  language: fr
  text: Aimez la justice[a], vous qui jugez la terre[b] ; pensez au Seigneur avec bonté[c], et cherchez-le d’un cœur sincère[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut désigner à la fois la justice exercée et la droiture morale.
    reason: lexical_ambiguity
  - marker: b
    text: 'Ou : « vous qui gouvernez la terre ». Littéralement : « vous qui jugez la terre ».'
    reason: referent_nuance
  - marker: c
    text: 'Ou : « avec une disposition bienveillante » ou « dans la bonté ».'
    reason: lexical_alternative
  - marker: d
    text: 'Littéralement : « dans la simplicité du cœur » ; l’expression peut aussi évoquer un cœur sans partage et sans duplicité.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: Ἀγαπήσατε
  choice: Aimez
  rationale: L’impératif « Aimez » rend directement et naturellement la force exhortative de l’aoriste grec.
- source_word: δικαιοσύνην
  choice: la justice
  rationale: En français biblique et courant, « justice » peut couvrir à la fois l’exercice équitable du jugement et la droiture morale, ce qui convient à la polysémie de δικαιοσύνη.
- source_word: οἱ κρίνοντες τὴν γῆν
  choice: vous qui jugez la terre
  rationale: Cette formulation suit littéralement le participe grec sans le réduire au sens plus interprétatif de « dirigeants ».
- source_word: φρονήσατε περὶ τοῦ κυρίου
  choice: pensez au Seigneur
  rationale: Rend simplement l’appel à orienter sa pensée vers le Seigneur; « au sujet du Seigneur » serait plus explicite mais moins naturel ici.
- source_word: ἐν ἀγαθότητι
  choice: avec droiture
  rationale: ἀγαθότης désigne ici la qualité bonne et droite de la disposition intérieure. « Avec droiture » est idiomatique en français et évite que « avec bonté » paraisse seulement affectif.
- source_word: ἐν ἁπλότητι καρδίας
  choice: d’un cœur sincère
  rationale: Cette expression française actuelle restitue l’idée d’un cœur simple, sans duplicité; la note conserve les nuances de simplicité et d’absence de partage.
- source_word: ζητήσατε αὐτόν
  choice: cherchez-le
  rationale: Traduction directe de l’impératif ζητήσατε, qui conserve l’idée d’une recherche active et résolue.
theological_decisions:
- issue: Portée de δικαιοσύνη
  choice: la justice
  alternative: la droiture
  rationale: « Justice » garde en français la dimension judiciaire particulièrement pertinente pour ceux qui jugent la terre, tout en pouvant désigner la rectitude morale. La note explicite cette double portée sans la trancher.
- issue: Identité de ceux qui « jugent la terre »
  choice: vous qui jugez la terre
  alternative: vous qui gouvernez la terre
  rationale: Le contexte peut viser les gouvernants, mais le texte grec emploie explicitement le verbe « juger »; la traduction conserve donc cette formulation et laisse l’interprétation politique en note.
- issue: Traduction de κύριος
  choice: le Seigneur
  alternative: le maître
  rationale: « Le Seigneur » est la désignation naturelle dans ce contexte théologique; rien dans le verset n’impose le sens social plus restreint de « maître ».
- issue: Nuance de ἁπλότης καρδίας
  choice: d’un cœur sincère
  alternative: d’un cœur sans partage
  rationale: « Sincère » exprime clairement l’absence de duplicité, tandis que la note préserve aussi la nuance possible d’un cœur simple ou indivis.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation demeure proche de la syntaxe grecque tout en évitant des tours artificiels; les ambiguïtés importantes sont conservées dans les notes.
