  text: because he is found by those who do not test him[b][a], and he reveals himself to those who do not distrust him.
translation:
  language: fr
  text: car il se laisse trouver par ceux qui ne le mettent pas à l’épreuve[a], et il se manifeste à ceux qui ne se défient pas de lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne le tentent pas ». Selon le contexte, le verbe grec peut signifier essayer, mettre à l’épreuve ou tenter.
    reason: lexical_alternative
  - marker: b
    text: Ou « ne doutent pas de lui », « ne refusent pas de le croire » ou « ne manquent pas de foi en lui ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: car
  rationale: Introduit naturellement en français la raison qui fonde l’exhortation du verset précédent.
- source_word: εὑρίσκεται
  choice: il se laisse trouver
  rationale: Rend le passif grec dans un français naturel tout en gardant Dieu comme personne rencontrée, sans préciser indûment comment il devient accessible.
- source_word: τοῖς μὴ πειράζουσιν αὐτόν
  choice: par ceux qui ne le mettent pas à l’épreuve
  rationale: πειράζω peut signifier essayer, éprouver ou tenter. « Mettre à l’épreuve » conserve ici l’idée d’un test imposé à Dieu sans choisir la nuance morale plus forte de « tenter ».
- source_word: ἐμφανίζεται
  choice: il se manifeste
  rationale: Correspond directement à l’idée de devenir manifeste ou de se faire connaître, dans un registre digne et courant.
- source_word: τοῖς μὴ ἀπιστοῦσιν αὐτῷ
  choice: à ceux qui ne lui refusent pas leur foi
  rationale: Préserve la portée de ἀπιστέω entre incrédulité et manque de confiance, tout en exprimant naturellement en français la relation à Dieu marquée par le datif.
theological_decisions:
- issue: Nuance relationnelle ou intellectuelle de ἀπιστοῦσιν αὐτῷ
  choice: ne lui refusent pas leur foi
  alternative: ne doutent pas de lui / ne se défient pas de lui / ne refusent pas de le croire
  rationale: La formulation principale maintient ensemble foi, confiance et croyance sans réduire le terme à un simple doute intellectuel ni imposer une définition doctrinale particulière.
translation_notes:
  register: Français international moderne, clair et digne. « Il se laisse trouver » évite le passif peu idiomatique « il est trouvé »; « il se manifeste » conserve le parallélisme verbal. Les deux notes maintiennent les principales ambiguïtés lexicales du grec.
