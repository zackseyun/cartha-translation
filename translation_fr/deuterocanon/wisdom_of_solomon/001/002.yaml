  source_fidelity: 'Le premier membre rend fidèlement ὅτι εὑρίσκεται τοῖς μὴ πειράζουσιν αὐτόν : « se laisse trouver » est un bon français pour le passif et « mettre à l’épreuve » conserve la valeur de πειράζω. Dans le second membre, « ne lui refusent pas leur foi » est interprétatif et introduit une idée de refus volontaire qui n’est pas explicite dans ἀπιστοῦσιν. « Ne se défient pas de lui » rend plus directement la nuance relationnelle d’absence de confiance/défiance, tout en laissant les autres possibilités à la note.'
