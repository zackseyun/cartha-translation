base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/007.yaml
  text: For the Spirit of the Lord has filled the inhabited world[b][a], and that which holds all things together has knowledge of every utterance.
translation:
  language: fr
  text: Car l’Esprit du Seigneur a rempli le monde habité, et ce qui tient toutes choses ensemble a connaissance de toute parole.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « a connaissance de voix ». Le mot grec peut désigner la voix, le son ou la parole prononcée. « Ce qui tient toutes choses ensemble » peut aussi se traduire par « ce qui contient toutes choses » ou « celui qui tient toutes choses ensemble ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα Κυρίου
  choice: l’Esprit du Seigneur
  rationale: La majuscule signale que le souffle ou esprit évoqué est celui de Dieu, sans préciser davantage son statut personnel selon des catégories doctrinales postérieures.
- source_word: πεπλήρωκεν
  choice: remplit
  rationale: Le parfait grec exprime un état présent résultant d’un accomplissement antérieur. Le présent français rend naturellement cet état durable; « a rempli » serait également possible, mais pourrait suggérer une action seulement passée.
- source_word: τὴν οἰκουμένην
  choice: le monde habité
  rationale: Cette formulation conserve le sens propre de οἰκουμένη, la terre ou le monde en tant qu’il est habité.
- source_word: τὸ συνέχον τὰ πάντα
  choice: ce qui maintient toutes choses ensemble
  rationale: Le participe substantivé est neutre. « Ce qui » préserve cette forme et l’ambiguïté entre ce qui contient, soutient ou assure la cohésion de toutes choses, sans en faire explicitement une personne.
- source_word: γνῶσιν ἔχει φωνῆς
  choice: connaît toute parole
  rationale: L’expression signifie littéralement « a connaissance de voix ». Dans ce contexte, « connaît toute parole » exprime naturellement la connaissance de tout ce qui est prononcé, tout en signalant l’alternative littérale en note.
theological_decisions:
- issue: Le caractère personnel ou impersonnel de πνεῦμα Κυρίου
  choice: l’Esprit du Seigneur
  alternative: l’esprit du Seigneur; le souffle du Seigneur
  rationale: Le contexte attribue à l’Esprit la présence universelle et la connaissance de la parole. La majuscule convient au référent divin, sans imposer une définition trinitaire ultérieure.
- issue: L’identité de τὸ συνέχον τὰ πάντα
  choice: ce qui maintient toutes choses ensemble
  alternative: celui qui maintient toutes choses ensemble; ce qui contient toutes choses
  rationale: Le neutre grec ne tranche pas explicitement entre une reprise personnelle de l’Esprit et une désignation plus abstraite de la puissance qui contient ou soutient l’univers. La traduction conserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme conserve la portée cosmique de la phrase grecque. « Monde habité » est volontairement plus précis que le simple « monde », et « toutes choses » maintient le registre élevé du texte.
