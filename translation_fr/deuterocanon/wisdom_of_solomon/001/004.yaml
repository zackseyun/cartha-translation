base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/004.yaml
  text: For wisdom will not enter a soul that devises evil[b][a], nor dwell in a body enslaved to sin.
translation:
  language: fr
  text: Car la sagesse n’entrera pas dans une âme qui trame le mal[a], et elle n’habitera pas dans un corps asservi au péché[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « habile à faire le mal », « perfide » ou « méchante ». Le grec évoque littéralement une âme qui sait concevoir ou fabriquer le mal.
    reason: lexical_alternative
  - marker: b
    text: Ou « soumis au péché », « redevable au péché » ou « débiteur du péché ». Le grec décrit un corps placé sous l’obligation ou l’emprise du péché.
    reason: lexical_alternative
lexical_decisions:
- source_word: κακότεχνον
  choice: qui trame le mal
  rationale: L’adjectif évoque l’habileté à concevoir ou à fabriquer le mal. « Qui trame le mal » restitue cette idée d’une activité intérieure calculée, plus précisément que le simple qualificatif « méchante ».
- source_word: ψυχὴν
  choice: âme
  rationale: Le grec désigne ici la vie intérieure de la personne. « Âme » préserve aussi le contraste explicite avec le « corps » dans la seconde proposition.
- source_word: εἰσελεύσεται
  choice: n’entrera pas
  rationale: Traduction directe du futur, qui conserve la métaphore spatiale de l’entrée de la sagesse dans la personne.
- source_word: σοφία
  choice: sagesse
  rationale: Équivalent français habituel et exact dans la littérature sapientielle.
- source_word: κατοικήσει
  choice: n’habitera pas
  rationale: Le verbe exprime une résidence durable, par contraste avec la simple entrée. « Habiter » est naturel tout en gardant cette nuance.
- source_word: σώματι
  choice: corps
  rationale: Traduction directe qui maintient le contraste littéraire entre l’âme et le corps.
- source_word: κατάχρεῳ
  choice: asservi à
  rationale: Le mot évoque une situation d’obligation, de dette ou de sujétion. Dans ce contexte, « asservi à » rend clairement l’emprise exercée par le péché sans effacer les autres nuances possibles.
- source_word: ἁμαρτίας
  choice: péché
  rationale: Le génitif se rend simplement par « péché » ; une formulation abstraite telle que « état de péché » ajouterait une interprétation absente du grec.
theological_decisions:
- issue: Contraste anthropologique entre l’âme et le corps
  choice: Conserver les termes distincts « âme » et « corps ».
  alternative: Rendre ψυχή par « personne » ou « être intérieur ».
  rationale: Le grec établit explicitement ce contraste. Le conserver respecte le texte sans en déduire ni lui imposer une doctrine dualiste complète.
- issue: Force de κατάχρεῳ ἁμαρτίας
  choice: « corps asservi au péché »
  alternative: « corps soumis au péché », « redevable au péché » ou « débiteur du péché »
  rationale: « Asservi » exprime de façon intelligible la forte relation de dépendance ou de sujétion, tandis que la note préserve l’ambiguïté lexicale liée à l’obligation et à la dette.
translation_notes:
  register: Français international moderne, clair et digne. La coordination « et elle » explicite naturellement le sujet de la seconde proposition. « Trame le mal » garde la nuance active de κακότεχνον, tandis que « asservi au péché » communique la force morale de κατάχρεῳ sans exclure ses nuances de dette ou d’obligation.
