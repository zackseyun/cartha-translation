  text: For God did not make death[a], nor does he delight in the destruction of the living;
translation:
  language: fr
  text: Car Dieu n’a pas créé la mort[a] et il ne prend pas plaisir à la destruction des vivants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « n’a pas fait la mort ». Le verbe grec peut se traduire des deux façons ; « créé » est plus naturel ici en français.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Introduit l’explication ou le fondement de l’affirmation précédente; « Car » conserve naturellement cette valeur causale.
- source_word: ὁ θεὸς
  choice: Dieu
  rationale: Rendu direct du sujet grec.
- source_word: θάνατον
  choice: la mort
  rationale: Conserve le nom abstrait sans développement interprétatif.
- source_word: οὐκ ἐποίησεν
  choice: n’a pas fait
  rationale: Reste proche du sens courant de ποιέω et évite de préciser davantage que le grec la nature de l’acte divin ni l’origine cosmologique de la mort.
- source_word: οὐδὲ
  choice: et… ne… pas
  rationale: Dans cette coordination négative, cette tournure est plus naturelle en français moderne que « ni » après une première proposition déjà négative.
- source_word: τέρπεται
  choice: prend plaisir
  rationale: Exprime clairement l’idée de plaisir ou de satisfaction portée par le verbe, dans un registre digne et courant.
- source_word: ἐπʼ ἀπωλείᾳ
  choice: à la perte
  rationale: « Perte » préserve la portée de ἀπώλεια, qui peut évoquer la ruine, la destruction ou la disparition, sans imposer un mécanisme particulier.
- source_word: ζώντων
  choice: des vivants
  rationale: Rend de façon concise le participe substantivé et en conserve la portée générique.
theological_decisions:
- issue: Rendu de ἐποίησεν dans l’affirmation sur le rapport de Dieu à la mort
  choice: n’a pas fait la mort
  alternative: n’a pas créé la mort
  rationale: « Fait » correspond directement à ποιέω et préserve la tension de l’énoncé sans le transformer explicitement en formulation technique sur la création.
- issue: Portée de ἀπωλείᾳ à propos des vivants
  choice: la perte des vivants
  alternative: la destruction des vivants
  rationale: « Perte » maintient une certaine amplitude sémantique entre disparition, ruine et destruction, tandis que « destruction » pourrait paraître plus étroitement causative.
translation_notes:
  register: Français international moderne, clair et digne. La coordination a été légèrement idiomatisée sans atténuer les deux négations du grec.
