base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/008.yaml
  text: Therefore no one who speaks unrighteous things will escape notice[b][a], nor will convicting justice pass him by.
translation:
  language: fr
  text: C’est pourquoi personne qui profère des paroles injustes ne passera inaperçu[a], et la justice qui le convainc de faute ne passera pas à côté de lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « nul, en proférant des choses injustes, n’échappera à l’attention ».'
    reason: λανθάνω exprime le fait de passer inaperçu ou d’échapper à l’attention.
  - marker: b
    text: '« La justice » peut aussi désigner le jugement personnifié : « le jugement qui le convainc de faute ne passera pas à côté de lui ».'
    reason: δίκη, avec le participe ἐλέγχουσα, peut évoquer à la fois la justice, l’action judiciaire et une personnification.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Connecteur conclusif naturel qui rattache l’avertissement à l’affirmation précédente.
- source_word: φθεγγόμενος ἄδικα
  choice: prononcera des paroles injustes
  rationale: Le participe désigne l’acte de parler, et le neutre pluriel ἄδικα son contenu moralement injuste. « Paroles injustes » est clair et conserve le champ lexical de la justice.
- source_word: οὐδεὶς μὴ λάθῃ
  choice: personne… sans être démasqué
  rationale: La construction exprime une forte négation tournée vers l’avenir. λανθάνω indique qu’on n’échappe pas à l’attention; « être démasqué » s’accorde ici à l’idée d’exposition présente dans la suite.
- source_word: οὐδὲ μὴ παροδεύσῃ αὐτόν
  choice: ne passera pas à côté de lui
  rationale: Rend l’image concrète de παροδεύω, « passer près de/au-delà », sans réduire le sens à un simple oubli.
- source_word: ἐλέγχουσα
  choice: qui confond le coupable
  rationale: ἐλέγχω peut signifier mettre en lumière, réfuter ou convaincre de faute. « Confond » conserve cette force judiciaire et morale; « le coupable » explicite le complément implicite sans identifier δίκη à une peine.
- source_word: ἡ δίκη
  choice: la justice
  rationale: « Justice » préserve à la fois l’ordre moral, la portée judiciaire et la possible personnification du grec δίκη.
theological_decisions:
- issue: Articulation entre ἄδικα et δίκη
  choice: Employer « paroles injustes » puis « la justice »
  alternative: « des paroles mauvaises » puis « le jugement »
  rationale: La répétition du champ grec de la justice doit rester perceptible. « Justice » maintient en outre l’ambiguïté entre principe moral, jugement actif et figure personnifiée.
- issue: Portée de ἐλέγχουσα ἡ δίκη
  choice: « la justice, qui confond le coupable »
  alternative: « le jugement qui convainc de faute » ou « la justice accusatrice »
  rationale: Cette formulation présente la justice comme agissante sans trancher si δίκη désigne abstraitement la justice, le jugement ou une personnification.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve l’image de la justice qui ne passe pas à côté du fautif et évite de réduire δίκη à la seule punition.
