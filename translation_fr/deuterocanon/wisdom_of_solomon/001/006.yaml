base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/006.yaml
  text: For wisdom is a spirit that loves humanity[a], and it will not acquit a blasphemer because of his lips; for God is witness of his inner motives[b], and a true observer of his heart and a hearer of his tongue.
translation:
  language: fr
  text: Car la sagesse est un esprit qui aime les êtres humains, et elle ne tiendra pas pour innocent celui qui blasphème à cause des paroles de ses lèvres[a] ; car Dieu est témoin de son être intérieur[b] ; il scrute véritablement son cœur et entend les paroles de sa langue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « elle ne tiendra pas pour innocent celui qui blasphème pour ce qui sort de ses lèvres ». Après « celui qui blasphème », l’expression grecque est condensée et peut être comprise avec une valeur causale.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « de ses reins ». Dans le langage biblique, les reins représentent les profondeurs cachées de la personne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλάνθρωπον
  choice: qui aime les êtres humains
  rationale: L’adjectif exprime la bienveillance et l’amour envers l’humanité. Cette formulation conserve sa valeur active dans un français actuel et inclusif.
- source_word: πνεῦμα σοφία
  choice: la sagesse est un esprit
  rationale: Le grec présente πνεῦμα sans article dans une construction prédicative avec σοφία. Le nom commun « esprit » préserve cette formulation sans imposer une identification explicite avec l’Esprit saint.
- source_word: οὐκ ἀθῳώσει
  choice: elle ne tiendra pas pour innocent
  rationale: 'Le verbe a une portée judiciaire : déclarer innocent, absoudre ou laisser sans sanction. La tournure retenue est claire et conserve cette tonalité.'
- source_word: βλάσφημον
  choice: celui qui blasphème
  rationale: Cette formulation naturelle désigne la personne coupable de parole blasphématoire sans recourir au substantif plus marqué « blasphémateur ».
- source_word: ἀπὸ χειλέων αὐτοῦ
  choice: à cause des paroles de ses lèvres
  rationale: La préposition est comprise ici avec une valeur causale. L’ajout explicatif de « paroles » rend en français ce qui sort des lèvres, tout en gardant l’image corporelle.
- source_word: τῶν νεφρῶν αὐτοῦ
  choice: de son être intérieur
  rationale: 'Littéralement « de ses reins » : dans l’anthropologie biblique, les reins représentent les profondeurs cachées de la personne. « Être intérieur » transmet l’idiome sans le réduire aux seuls motifs.'
- source_word: μάρτυς
  choice: témoin
  rationale: Ce terme conserve l’image judiciaire et l’affirmation que Dieu connaît directement l’intériorité humaine.
- source_word: ἐπίσκοπος ἀληθής
  choice: il scrute véritablement
  rationale: La reformulation verbale est naturelle en français et exprime l’observation exacte et pénétrante du cœur, sans introduire le sens ecclésiastique ultérieur d’ἐπίσκοπος.
- source_word: τῆς γλώσσης ἀκουστής
  choice: entend sa langue
  rationale: La traduction préserve l’image concrète de la langue et le parallélisme entre l’intériorité, le cœur et la parole.
theological_decisions:
- issue: Identification éventuelle de πνεῦμα σοφία avec l’Esprit saint
  choice: « la sagesse est un esprit », avec une minuscule
  alternative: « la sagesse est l’Esprit saint » ou « la Sagesse est un Esprit »
  rationale: Le verset personnifie la sagesse et la qualifie d’esprit, mais n’exige pas à lui seul une identification explicite avec l’Esprit saint. La traduction conserve cette tension théologique.
- issue: Portée anthropologique de τῶν νεφρῶν αὐτοῦ
  choice: « son être intérieur »
  alternative: « ses reins » ou « ses motivations profondes »
  rationale: L’expression affirme que Dieu connaît les profondeurs cachées de la personne. Une traduction littérale serait opaque en français moderne, tandis que « motivations » restreindrait indûment la portée de l’image.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la progression judiciaire du grec — innocence, témoignage, examen et audition — tout en transformant deux noms d’agent en verbes pour éviter une formulation lourde ou artificielle en français.
