base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/011.yaml
  text: Therefore guard yourselves against useless grumbling[a], and spare your tongue from slander; for no secret utterance goes out empty[b], and a lying mouth destroys a soul.
translation:
  language: fr
  text: Gardez-vous donc des murmures inutiles et préservez votre langue de la médisance, car aucune parole dite en secret ne reste sans effet[a], et une bouche qui ment fait périr une âme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ne s’en va pas vide ». L’expression souligne qu’une parole cachée n’est pas vaine : elle produit des effets et entraîne des conséquences.'
    reason: lexical_alternative
  - marker: b
    text: Ou « fait périr une vie » ou « fait périr une personne ». Le mot grec peut désigner l’âme, la vie ou la personne.
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλάξασθε
  choice: Gardez-vous
  rationale: L’impératif aoriste moyen appelle à une vigilance active sur soi-même. « Gardez-vous » en conserve la force et la nuance réfléchie.
- source_word: τοίνυν
  choice: donc
  rationale: La particule marque une conclusion tirée de ce qui précède ; « donc » exprime naturellement ce lien logique.
- source_word: γογγυσμὸν ἀνωφελῆ
  choice: des murmures inutiles
  rationale: γογγυσμός désigne des plaintes murmurées ou des récriminations, et ἀνωφελής ce qui est inutile ou sans profit. « Murmures inutiles » garde la tonalité sapientielle sans archaïsme excessif.
- source_word: ἀπὸ καταλαλιᾶς φείσασθε γλώσσης
  choice: retenez votre langue de toute médisance
  rationale: Cette formulation française naturelle conserve l’image concrète de la langue et rend l’appel à s’abstenir de paroles malveillantes visant autrui. « Médisance » correspond au champ de καταλαλιά sans limiter nécessairement le propos à une accusation juridiquement diffamatoire.
- source_word: φθέγμα λαθραῖον
  choice: parole dite en secret
  rationale: φθέγμα est une parole ou une émission de voix, et λαθραῖον indique son caractère caché. La tournure choisie est claire et courante en français.
- source_word: κενὸν οὐ πορεύεται
  choice: ne reste sans effet
  rationale: L’expression signifie littéralement que la parole « ne va pas vide ». Le rendu explicite en français l’idée qu’une parole cachée n’est ni vaine ni dépourvue de conséquences, tandis que la note conserve l’image grecque.
- source_word: στόμα ... καταψευδόμενον
  choice: une bouche qui ment
  rationale: Le participe décrit une bouche qui profère le mensonge. La proposition relative est plus naturelle en français que « une bouche mensongère » et maintient l’image proverbiale.
- source_word: ἀναιρεῖ ψυχήν
  choice: fait périr une âme
  rationale: ἀναιρέω peut signifier supprimer, détruire ou tuer. « Fait périr » garde la gravité de l’avertissement sans le réduire explicitement à la seule mort physique.
- source_word: ψυχήν
  choice: une âme
  rationale: ψυχή peut désigner l’âme, la vie ou la personne. « Âme » préserve ici l’ampleur anthropologique et morale du grec ; les autres possibilités sont signalées en note.
theological_decisions:
- issue: Sens de ψυχή dans la dernière proposition
  choice: « âme » dans le texte principal
  alternative: « vie » ou « personne »
  rationale: Le contexte d’exhortation morale permet une portée plus profonde que le seul dommage social ou la seule mort physique. « Âme » préserve cette profondeur tout en laissant ouvertes, dans la note, les autres valeurs lexicales du terme.
- issue: Portée de κενὸν οὐ πορεύεται
  choice: la parole secrète ne reste pas sans effet
  alternative: 'traduction littérale : « ne s’en va pas vide »'
  rationale: Le texte affirme que même une parole cachée entraîne des conséquences. Le français principal rend ce sens sans préciser la nature de ces conséquences, afin de ne pas résoudre davantage que le grec la tension morale et théologique.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme proverbial est conservé, de même que les images de la langue, de la bouche et de l’âme. Les tournures inutilement archaïques ont été évitées.
