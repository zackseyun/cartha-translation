    rationale: « l’Hadès n’exerce aucune domination » explicite légitimement le sens, mais « ni domination de l’Hadès sur la terre » suit plus directement le substantif βασίλειον et maintient l’ambiguïté entre pouvoir et royaume signalée en note.
