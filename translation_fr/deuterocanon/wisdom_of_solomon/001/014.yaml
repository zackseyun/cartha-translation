    issue: « les êtres engendrés dans le monde »
    rationale: 'La formule est à la fois peu naturelle et plus interprétative que le grec αἱ γενέσεις τοῦ κόσμου : elle transforme le génitif « du monde » en complément spatial. « Les créatures du monde », avec note d’alternatives, rend le contexte sans effacer l’ambiguïté lexicale.'
  - severity: low
