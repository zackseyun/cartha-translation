base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/014.yaml
  text: For he created all things so that they might exist[a], and the generations of the world are health-giving, and in them there is no poison of destruction, nor the dominion of Hades upon the earth[b];
translation:
  language: fr
  text: Car il a créé toutes choses pour qu’elles existent, et les créatures du monde sont salutaires[a] ; il n’y a en elles aucun poison de destruction, ni domination de l’Hadès sur la terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les productions du monde sont salutaires », « les origines du monde sont bienfaisantes » ou, plus littéralement, « les générations du monde sont salutaires ». L’expression grecque est large et peut désigner ce qui vient à l’existence dans l’ordre du monde.
    reason: lexical_alternative
  - marker: b
    text: Ou « royaume de l’Hadès ». Le grec peut désigner soit un domaine, soit un pouvoir souverain.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκτισεν
  choice: il a créé
  rationale: Le verbe κτίζω désigne ici l’acte de faire venir à l’existence. « Créer » exprime clairement l’origine divine de toutes choses.
- source_word: εἰς τὸ εἶναι
  choice: pour qu’elles existent
  rationale: Cette construction indique le but, avec une possible nuance de résultat. La formulation française exprime naturellement que la création est orientée vers l’existence.
- source_word: τὰ πάντα
  choice: toutes choses
  rationale: Cette expression rend la totalité de ce qui est créé, dans un registre à la fois clair et digne.
- source_word: σωτήριοι
  choice: salutaires
  rationale: « Salutaires » conserve l’idée large de ce qui favorise la vie, la santé ou la sauvegarde, sans réduire le terme à la santé physique ni lui imposer un sens sotériologique développé.
- source_word: αἱ γενέσεις τοῦ κόσμου
  choice: les êtres engendrés dans le monde
  rationale: Le pluriel γενέσεις peut désigner les origines, les productions ou les êtres venus à l’existence. Cette formulation reste intelligible en français tout en conservant l’idée d’engendrement et l’ampleur sémantique du grec.
- source_word: φάρμακον ὀλέθρου
  choice: poison destructeur
  rationale: Dans le contraste entre existence et destruction, φάρμακον désigne vraisemblablement une substance nocive. « Poison destructeur » rend le sens sans atténuer le lien avec ὄλεθρος.
- source_word: ᾅδου βασίλειον
  choice: l’Hadès n’exerce aucune domination
  rationale: La tournure verbale est naturelle en français et rend βασίλειον comme pouvoir souverain ou domination. « Hadès » conserve le terme grec plutôt que de le réduire à « la tombe » ou à « la mort ».
- source_word: ἐπὶ γῆς
  choice: sur la terre
  rationale: Cette formulation situe explicitement la domination niée dans la sphère terrestre et préserve le mouvement solennel de la phrase.
theological_decisions:
- issue: Portée de σωτήριοι dans le contexte de la création
  choice: « salutaires », au sens de favorables à la vie et à la sauvegarde
  alternative: « qui sauvent », « porteurs de salut » ou « bons pour la santé »
  rationale: Le contexte oppose l’intention créatrice de Dieu à la destruction et à l’Hadès. « Salutaires » maintient cette tension et la largeur du terme sans limiter celui-ci à la santé corporelle ni introduire une doctrine du salut plus précise que le verset.
- issue: Sens de ᾅδου βασίλειον
  choice: la domination exercée par l’Hadès
  alternative: le royaume de l’Hadès ou le séjour des morts
  rationale: Le grec peut évoquer aussi bien un domaine qu’un pouvoir royal. La traduction retient l’idée de domination dans le texte et signale l’autre possibilité en note, tout en conservant le nom grec « Hadès ».
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la structure cumulative du grec, tout en employant une ponctuation française lisible. « Hadès » maintient le concept du texte source ; « êtres engendrés » et la note préservent l’ambiguïté de γενέσεις.
