base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/016.yaml
  text: But the ungodly[a], with their hands and their words, called for him; considering him a friend, they wasted away, and they made a covenant with him[c][b], because they are worthy to belong to his portion.
translation:
  language: fr
  text: Mais les impies, par leurs mains et leurs paroles, l’ont appelé à eux[a]. Le considérant comme un ami, ils se sont consumés et ont conclu une alliance avec lui[b], car ils sont dignes d’avoir part à son lot[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom renvoie à la Mort, personnifiée dans le contexte précédent.
    reason: cross_reference
  - marker: b
    text: 'Ou : « ont conclu un pacte avec lui ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « de faire partie de ce qui lui revient ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσεβεῖς
  choice: les impies
  rationale: « Impies » conserve la portée religieuse et morale du grec, plus précisément que le terme général « méchants ».
- source_word: ταῖς χερσὶ καὶ τοῖς λόγοις
  choice: par leurs gestes et leurs paroles
  rationale: Le grec dit littéralement « par leurs mains et leurs paroles ». En français actuel, « gestes » exprime naturellement les actes accomplis avec les mains tout en maintenant le parallélisme avec les paroles.
- source_word: προσεκαλέσαντο αὐτόν
  choice: l’ont appelé à eux
  rationale: Cette formulation rend la valeur moyenne du verbe, qui suggère qu’ils le font venir auprès d’eux, sans préciser excessivement s’il s’agit d’un appel ou d’une invitation.
- source_word: φίλον ἡγησάμενοι αὐτόν
  choice: le considérant comme un ami
  rationale: La construction signifie directement « considérer quelqu’un comme »; « ami » garde la personnification saisissante de la Mort.
- source_word: ἐτάκησαν
  choice: ils se sont consumés
  rationale: Le verbe évoque le fait de fondre ou de dépérir. « Se consumer » préserve cette image de dépérissement et convient au registre sapientiel.
- source_word: συνθήκην ἔθεντο πρὸς αὐτόν
  choice: ont conclu une alliance avec lui
  rationale: « Conclure une alliance » restitue le caractère solennel et contraignant de συνθήκη, tout en restant naturel en français; « pacte » demeure une possibilité.
- source_word: ἄξιοί εἰσιν
  choice: ils sont dignes
  rationale: La traduction formelle maintient l’idée de correspondance ou de mérite exprimée par ἄξιοι, ainsi que la dure ironie de l’énoncé.
- source_word: τῆς ἐκείνου μερίδος εἶναι
  choice: d’avoir part à son lot
  rationale: μερίς peut désigner une part, une portion ou un lot. La formule exprime leur appartenance au domaine qui revient à la Mort sans transformer l’image en explication.
theological_decisions:
- issue: Référent des pronoms masculins αὐτόν / ἐκείνου
  choice: Maintenir les pronoms « l’ », « lui » et « son » dans le texte, avec une note identifiant la Mort personnifiée.
  alternative: Remplacer le premier pronom par « la Mort » pour expliciter immédiatement l’antécédent.
  rationale: Le grec poursuit la personnification commencée dans le contexte précédent, mais emploie ici des pronoms. La traduction garde cette cohésion littéraire sans dissimuler le référent au lecteur.
- issue: Portée de συνθήκη
  choice: « une alliance »
  alternative: « un pacte » ou « un accord »
  rationale: Le terme décrit ici un engagement solennel envers la Mort, sans qu’il s’agisse pour autant d’une alliance divine. « Alliance » conserve la gravité et l’ironie de l’image; la note signale l’autre rendu naturel.
- issue: Sens de ἄξιοί εἰσιν
  choice: « ils sont dignes »
  alternative: « ils méritent » ou « ils sont faits pour »
  rationale: Le rendu retenu préserve la formulation grecque et laisse subsister la tension entre constat d’adéquation, conséquence morale et mérite, sans la résoudre en paraphrase.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme grec est rendu de façon idiomatique par « gestes et paroles ». La personnification de la Mort et l’ironie morale du texte sont conservées; les notes suivent l’ordre d’apparition des marqueurs.
