  text: For crooked thoughts separate from God, and when his power is tested, it exposes the foolish.
translation:
  language: fr
  text: Car les raisonnements tortueux éloignent de Dieu[a], et la puissance, mise à l’épreuve, confond[b] les insensés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les raisonnements pervers séparent de Dieu ».'
    reason: Alternative lexicale et formulation plus littérale de σκολιοὶ λογισμοὶ χωρίζουσιν ἀπὸ θεοῦ.
  - marker: b
    text: 'Ou : « démasque les insensés » ; ou encore : « convainc les insensés de leur erreur ».'
    reason: ἐλέγχει peut signifier exposer, réfuter ou convaincre de faute.
lexical_decisions:
- source_word: σκολιοὶ λογισμοὶ
  choice: les raisonnements tortueux
  rationale: « Raisonnements » rend l’activité intérieure, réfléchie ou calculatrice de λογισμοί, tandis que « tortueux » exprime la déviation morale portée par σκολιοί.
- source_word: χωρίζουσιν ἀπὸ θεοῦ
  choice: éloignent de Dieu
  rationale: Cette formulation française naturelle exprime la séparation d’avec Dieu sans ajouter un complément d’objet absent du grec.
- source_word: δοκιμαζομένη
  choice: mise à l’épreuve
  rationale: Le participe, accordé à « la puissance », indique que celle-ci est soumise à l’épreuve ou contestée; la tournure conserve cette valeur sans préciser qui l’éprouve.
- source_word: ἡ δύναμις
  choice: la puissance
  rationale: Le grec dit littéralement « la puissance ». Garder l’article défini préserve la possibilité contextuelle qu’il s’agisse de la puissance de Dieu sans transformer cette inférence en possessif explicite.
- source_word: ἐλέγχει
  choice: confond
  rationale: « Confond » peut exprimer le fait de révéler l’erreur, de convaincre de faute ou de réfuter, et convient au registre sapientiel sans imposer un cadre strictement judiciaire.
- source_word: τοὺς ἄφρονας
  choice: les insensés
  rationale: « Les insensés » désigne ceux qui manquent de discernement ou de sagesse et maintient le ton digne de la littérature sapientielle.
theological_decisions:
- issue: Référent de ἡ δύναμις
  choice: Conserver « la puissance » sans possessif explicite.
  alternative: « sa puissance » ou « la puissance de Dieu »
  rationale: La proximité de θεοῦ suggère fortement la puissance divine, mais le grec emploie l’article et non un possessif. La traduction préserve donc cette légère implicitation.
- issue: Portée de ἐλέγχει
  choice: « confond » les insensés
  alternative: « démasque », « convainc de faute » ou « réfute » les insensés
  rationale: Le verbe peut évoquer l’exposition de l’erreur, la réfutation ou la conviction de faute. « Confond » maintient cette amplitude sans réduire l’action à un verdict judiciaire.
translation_notes:
  register: Français international actuel, sobre et digne. La phrase garde la densité de la maxime grecque; « la puissance » préserve l’implicite du texte source, tandis que « mise à l’épreuve » et « confond » restent accessibles à un lectorat général.
