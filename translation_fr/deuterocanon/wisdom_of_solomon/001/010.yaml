  text: for the ear of jealousy hears all things[b][a], and the sound of murmurings is not hidden.
translation:
  language: fr
  text: car l’oreille de la jalousie[a] entend tout, et le bruit des murmures[b] ne reste pas caché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’oreille du zèle entend tout ». Le grec peut exprimer aussi bien le zèle que la jalousie.
    reason: lexical_alternative
  - marker: b
    text: Ou « le chuchotement des plaintes » ou « la rumeur des récriminations ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖς
  choice: l’oreille
  rationale: Le terme concret conserve l’image personnifiée d’une écoute qui perçoit même les paroles dissimulées.
- source_word: ζηλώσεως
  choice: de la jalousie
  rationale: Le génitif grec qualifie l’oreille. « Jalousie » en garde la force aiguë et la tension théologique, sans l’adoucir silencieusement en « zèle ».
- source_word: ἀκροᾶται
  choice: entend
  rationale: Ce verbe exprime l’action d’entendre ou d’écouter ; « entend » est ici direct, naturel et cohérent avec l’image de l’oreille.
- source_word: τὰ πάντα
  choice: tout
  rationale: « Tout » rend avec naturel la portée exhaustive de l’expression grecque.
- source_word: θροῦς
  choice: le bruit
  rationale: Le nom désigne un son, un bruit ou une rumeur. « Bruit » maintient nettement le champ auditif du verset.
- source_word: γογγυσμῶν
  choice: des murmures
  rationale: Le mot évoque des plaintes prononcées à voix basse ou des récriminations ; « murmures » conserve à la fois la nuance sonore et la portée morale.
- source_word: οὐκ ἀποκρύπτεται
  choice: ne reste pas caché
  rationale: Cette formulation passive suit de près le grec tout en restant idiomatique en français.
theological_decisions:
- issue: Sens de ζηλώσεως appliqué à la perception divine
  choice: la jalousie
  alternative: le zèle ; une vigilance jalouse
  rationale: Dans le contexte, il s’agit d’une vigilance moralement exigeante qui décèle toute parole. « Jalousie » préserve la métaphore forte et son ambiguïté possible, tandis que la note signale le sens également attesté de « zèle ».
translation_notes:
  register: Français international moderne, sobre et élevé. La syntaxe parallèle du grec et son image auditive sont conservées, avec des notes pour les principales ambiguïtés lexicales.
