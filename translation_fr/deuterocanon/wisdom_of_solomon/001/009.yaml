    rationale: Cette expression n’est pas idiomatique dans ce sens en français et déplace l’objet de l’ἔλεγχος. Les alternatives « établir la culpabilité » ou « réprouver » rendent mieux les nuances possibles de preuve, conviction et réprimande.
