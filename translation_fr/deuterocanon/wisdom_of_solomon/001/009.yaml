  rationale: La révision supprime l’ajout interprétatif « aux oreilles » et remplace « l’homme impie » par « l’impie », plus directement conforme au singulier générique grec. Elle conserve la tension d’ἔλεγχος par « mettre en lumière » et corrige les alternatives de note pour un français exact et naturel.
