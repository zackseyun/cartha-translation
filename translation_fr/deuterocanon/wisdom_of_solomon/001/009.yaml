  text: For an inquiry will be made into the schemes of the ungodly[c][b][a], and a report of his words will come to the Lord for the exposing of his lawless deeds.
translation:
  language: fr
  text: Car les desseins de l’impie feront l’objet d’un examen, et le bruit de ses paroles parviendra au Seigneur[a], pour mettre en lumière ses actes contraires à la loi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’audition de ses paroles parviendra au Seigneur ». Le grec peut aussi évoquer ce qui est entendu ou rapporté de ses paroles.'
    reason: La note explicite le sens nominal de ἀκοή sans ajouter l’image des « oreilles ».
  - marker: b
    text: 'Ou : « pour établir la culpabilité de ses actes contraires à la loi » ou « pour les réprouver ».'
    reason: ἔλεγχος peut désigner la mise au jour, la preuve ou conviction de faute, ainsi que la réprimande.
lexical_decisions:
- source_word: διαβουλίοις
  choice: desseins
  rationale: Le terme désigne des délibérations ou des projets mûris. « Desseins » reste naturel et digne en français, tout en laissant le contexte marquer leur caractère mauvais.
- source_word: ἀσεβοῦς
  choice: de l’homme impie
  rationale: Le génitif singulier désigne de façon générique une personne qui manque de respect envers Dieu. « L’homme impie » conserve le singulier et la dimension religieuse du terme grec.
- source_word: ἐξέτασις
  choice: feront l’objet d’un examen
  rationale: ἐξέτασις évoque un examen attentif, voire judiciaire. Cette formulation française restitue naturellement la construction grecque sans préciser indûment qui mène l’examen.
- source_word: λόγων
  choice: paroles
  rationale: « Paroles » rend directement le pluriel et convient au contexte immédiat, centré sur ce que dit l’impie.
- source_word: ἀκοὴ
  choice: parviendront aux oreilles
  rationale: Le nom signifie littéralement « audition » ou « ce qui est entendu ». La locution française conserve l’image de l’écoute tout en exprimant naturellement que les paroles arrivent jusqu’au Seigneur.
- source_word: Κύριον
  choice: Seigneur
  rationale: « Seigneur » est l’équivalent français traditionnel et transparent de Κύριος dans ce contexte divin.
- source_word: ἔλεγχον
  choice: mettre en lumière
  rationale: Le terme peut évoquer la mise au jour, la réfutation, la réprimande ou l’établissement d’une faute. « Mettre en lumière » exprime ici l’exposition des actes sans trancher entièrement entre constat et condamnation.
- source_word: ἀνομημάτων
  choice: actes contraires à la loi
  rationale: Le pluriel désigne des actes qui enfreignent la loi. Cette traduction garde le caractère concret des actes et le rapport explicite à la loi.
theological_decisions:
- issue: Singulier générique de ἀσεβοῦς et αὐτοῦ
  choice: Conserver le singulier avec « l’homme impie », « ses paroles » et « ses actes ».
  alternative: Employer un pluriel générique (« les impies… leurs paroles… leurs actes ») ou une formulation épicène plus explicative.
  rationale: Le grec présente une figure individuelle au singulier. Le français « l’homme impie » préserve cette forme générique et la cohérence des possessifs sans transformer le nombre grammatical.
- issue: Portée judiciaire de ἔλεγχον
  choice: Traduire par « mettre en lumière », qui conserve l’idée d’exposition probante.
  alternative: « Réprouver », « confondre », « convaincre de faute » ou « dénoncer ».
  rationale: Le contexte permet à la fois l’idée de révélation, de preuve et de réprimande. Une traduction moins étroitement judiciaire préserve cette tension sémantique.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme marqué. La phrase conserve la tonalité sapientielle et judiciaire du grec. Les marqueurs [a] et [b] figurent dans le texte principal et correspondent exactement aux notes.
