    rationale: La locution est française et compréhensible, mais le grec dit que l’ἀκοή des paroles « parviendra au Seigneur »; il ne mentionne pas ses oreilles. Une traduction plus directe préserve mieux l’image nominale sans anthropomorphisme ajouté.
  - severity: medium
