base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/012.yaml
  text: Do not court death by the error of your life[b][a], nor draw destruction upon yourselves by the works of your hands.
translation:
  language: fr
  text: Ne recherchez pas la mort par l’égarement de votre vie[a], et n’attirez pas sur vous la destruction par les œuvres de vos mains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’égarement de votre vie ». Le grec peut évoquer l’erreur, l’illusion ou l’errance, et la préposition peut indiquer soit le moyen, soit la situation dans laquelle la mort est recherchée.
    reason: ambiguïté lexicale et syntaxique
  - marker: b
    text: L’expression « les œuvres de vos mains » peut désigner largement vos actes; sa formulation concrète peut aussi évoquer ce que les êtres humains fabriquent.
    reason: note culturelle et littéraire
lexical_decisions:
- source_word: ζηλοῦτε
  choice: recherchez
  rationale: Avec « la mort » pour complément, le verbe exprime une aspiration ou une poursuite ardente. « Recherchez » rend cette orientation volontaire en français naturel sans imposer l’image particulière de « courtiser ».
- source_word: θάνατον
  choice: la mort
  rationale: Équivalent direct et naturel du nom grec.
- source_word: ἐν πλάνῃ
  choice: par l’égarement
  rationale: πλάνη peut désigner l’égarement, l’erreur ou l’illusion. La préposition ἐν peut ici avoir une valeur instrumentale; « par » exprime naturellement le moyen par lequel la mort est recherchée.
- source_word: ζωῆς ὑμῶν
  choice: de votre vie
  rationale: Le singulier grec est conservé. Dans cette adresse au pluriel, le français peut employer « votre vie » distributivement, pour la conduite de chacun.
- source_word: ἐπισπᾶσθε
  choice: n’attirez pas sur vous
  rationale: La forme moyenne indique que les destinataires font venir la destruction sur eux-mêmes. Cette formulation conserve clairement la portée réflexive.
- source_word: ὄλεθρον
  choice: la destruction
  rationale: Le terme désigne une ruine ou une destruction grave, sans exiger ici un sens théologique technique.
- source_word: ἔργοις χειρῶν ὑμῶν
  choice: par les œuvres de vos mains
  rationale: La formulation concrète du grec est conservée; elle peut viser largement les actes humains tout en laissant subsister une éventuelle évocation de ce que les mains fabriquent.
theological_decisions:
- issue: Faut-il rendre ζηλοῦτε littéralement par une expression de zèle ou idiomatiquement comme une poursuite volontaire de la mort?
  choice: Ne recherchez pas la mort
  alternative: N’aspirez pas à la mort; ne désirez pas ardemment la mort
  rationale: « Recherchez » communique la poursuite active impliquée par le verbe sans produire l’étrangeté de « ne soyez pas zélés pour la mort » ni réduire nécessairement le sens à un simple désir intérieur.
- issue: Comment rendre la valeur réflexive de ἐπισπᾶσθε?
  choice: n’attirez pas sur vous la destruction
  alternative: ne faites pas venir sur vous la destruction; ne vous attirez pas la ruine
  rationale: La formulation choisie montre que les destinataires participent eux-mêmes à l’arrivée de leur destruction, conformément à la voix moyenne, sans ajouter une causalité doctrinale étrangère au texte.
translation_notes:
  register: Français international moderne, sobre et digne. La coordination et les images concrètes du grec sont conservées. « Œuvres de vos mains » maintient la possible résonance biblique sans préciser indûment qu’il s’agirait d’idoles.
