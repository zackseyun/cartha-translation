lexical_decisions:
- source_word: δικαιοσύνη
  choice: justice
  rationale: En français biblique et courant, « justice » peut désigner à la fois la conformité morale à ce qui est juste et l’exercice équitable du droit. Ce choix conserve ici la portée éthique et théologique du grec.
- source_word: γάρ
  choice: car
  rationale: La conjonction introduit le fondement de l’affirmation précédente ; « car » en rend naturellement la valeur explicative dans une formule brève et solennelle.
- source_word: ἀθάνατος
  choice: immortelle
  rationale: L’adjectif signifie « qui n’est pas sujet à la mort ». « Immortelle » est précis, naturel et respecte la formulation lapidaire du grec.
- source_word: ἐστιν
  choice: est
  rationale: La copule grecque appelle une traduction simple, sans explicitation supplémentaire.
theological_decisions:
- issue: Portée de δικαιοσύνη
  choice: justice
  alternative: droiture
  rationale: Le grec peut évoquer aussi bien la justice que la droiture morale. « Justice » garde en français une portée suffisamment large, tandis que « droiture » est signalé en note afin de préserver l’ambiguïté lexicale sans réduire le verset à un sens seulement juridique.
translation_notes:
  register: Formulation brève, actuelle et digne, qui conserve la structure aphoristique du grec ainsi que le lien logique exprimé par γάρ.
