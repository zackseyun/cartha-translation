base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/005.yaml
  text: For a holy spirit of discipline will flee deceit[a], and it will depart from senseless thoughts[c][b], and it will be rebuked when unrighteousness comes upon it.
translation:
  language: fr
  text: Car un esprit saint de discipline fuira la tromperie[a] ; il se retirera des raisonnements insensés et sera repris lorsque surviendra l’injustice[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Saint-Esprit de discipline ». Le grec dit littéralement « esprit saint de discipline », sans article ; l’expression peut donc être comprise de manière qualitative plutôt que comme un nom propre établi.
    reason: alternative_reading
  - marker: b
    text: Ou « sera convaincu de faute » ou « sera démasqué ».
    reason: lexical_alternative
  - marker: c
    text: Ou « lorsque surviendra l’iniquité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅγιον ... πνεῦμα
  choice: un esprit saint
  rationale: L’absence d’article en grec favorise une expression qualitative sans imposer un nom propre, tout en conservant la portée spirituelle du texte.
- source_word: παιδείας
  choice: de discipline
  rationale: Le terme englobe l’éducation, la formation morale et la correction. « Discipline » préserve cette gamme de sens, malgré une légère raideur voulue dans l’expression.
- source_word: φεύξεται
  choice: fuit
  rationale: Le présent français à valeur générale exprime naturellement l’affirmation sapientielle, là où le grec emploie le futur, tout en gardant l’image vive de la fuite.
- source_word: δόλον
  choice: la tromperie
  rationale: Ce terme français courant rend clairement l’idée de ruse, de fraude ou de duplicité portée par δόλος.
- source_word: ἀπαναστήσεται
  choice: se retirera
  rationale: Le verbe composé exprime un éloignement marqué. « Se retirera » restitue cette séparation en français naturel sans forcer l’image littérale de se lever.
- source_word: λογισμῶν ἀσυνέτων
  choice: des raisonnements insensés
  rationale: λογισμοί désigne ici des pensées raisonnées, calculs ou raisonnements ; ἀσύνετοι les qualifie de dépourvus d’intelligence ou de discernement.
- source_word: ἐλεγχθήσεται
  choice: sera confondu
  rationale: Le passif peut évoquer le fait d’être démasqué, convaincu de faute, réprimandé ou couvert de confusion. « Sera confondu » maintient cette tension sans préciser indûment l’agent.
- source_word: ἐπελθούσης ἀδικίας
  choice: lorsque surviendra l’injustice
  rationale: Le génitif absolu indique une circonstance concomitante, et ἐπέρχομαι exprime la survenue ou l’approche. « Injustice » rend ici le sens éthique large d’ἀδικία.
theological_decisions:
- issue: Faut-il comprendre ἅγιον ... πνεῦμα comme le nom propre « le Saint-Esprit » ?
  choice: un esprit saint de discipline
  alternative: le Saint-Esprit de discipline
  rationale: La construction grecque sans article ne contraint pas à lire un titre divin fixe. La formulation retenue conserve l’ambiguïté qualitative et évite d’importer dans ce texte sapientiel une précision doctrinale postérieure.
- issue: Sens du passif ἐλεγχθήσεται appliqué à l’esprit saint
  choice: sera confondu
  alternative: sera repris / sera démasqué
  rationale: La formulation grecque crée une tension réelle, puisque le sujet grammatical paraît rester l’esprit. La traduction conserve cette tension au lieu de transformer silencieusement le passif en une action exercée par l’esprit sur l’injustice.
- issue: Valeur d’ἀδικία
  choice: injustice
  alternative: iniquité
  rationale: « Injustice » garde le lien lexical avec l’absence de justice et reste naturel en français moderne ; « iniquité » accentuerait davantage la dimension religieuse et morale.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la structure ternaire du grec. « Un esprit saint de discipline » est volontairement plus formel que la langue courante afin de préserver le rapport génitif et l’ambiguïté théologique. Les futurs sont conservés pour les deux derniers verbes ; le premier est rendu par un présent gnomique naturel en français.
