base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/016.yaml
  text: For she goes about seeking those worthy of her[a], and graciously appears to them on the paths, and meets them in every purpose.
translation:
  language: fr
  text: Car elle va de tous côtés à la recherche de ceux qui sont dignes d’elle ; elle se montre à eux avec bienveillance sur les sentiers et vient à leur rencontre dans chacune de leurs pensées.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans chacun de leurs projets » ou « dans chacune de leurs intentions ». Le grec peut désigner aussi bien une pensée qu’une intention ou un dessein formé.
    reason: Alternative lexicale visant à préserver l’étendue sémantique de ἐπίνοια.
lexical_decisions:
- source_word: τοὺς ἀξίους αὐτῆς
  choice: ceux qui sont dignes d’elle
  rationale: Préserve le génitif relationnel et le sens évaluatif de ἄξιος sans préciser indûment en quoi consiste cette dignité.
- source_word: περιέρχεται ζητοῦσα
  choice: va de tous côtés à la recherche de
  rationale: Rend à la fois le mouvement exprimé par περιέρχεται et la recherche active et continue portée par le participe ζητοῦσα.
- source_word: ἐν ταῖς τρίβοις
  choice: sur leurs sentiers
  rationale: Conserve l’image concrète des chemins tout en donnant en français une formulation naturelle dans ce contexte.
- source_word: φαντάζεται αὐτοῖς εὐμενῶς
  choice: elle se montre à eux avec bienveillance
  rationale: φαντάζεται indique ici qu’elle se rend visible ou se manifeste, tandis que εὐμενῶς exprime une disposition favorable et bienveillante.
- source_word: ἐν πάσῃ ἐπινοίᾳ
  choice: dans chacune de leurs pensées
  rationale: ἐπίνοια peut désigner une pensée, une intention, un projet ou un dessein. « Pensées » préserve ici l’ampleur du terme sans le réduire aux seuls projets arrêtés.
- source_word: ὑπαντᾷ αὐτοῖς
  choice: vient à leur rencontre
  rationale: Rend la nuance dynamique de ὑπαντάω et souligne l’initiative de la Sagesse.
theological_decisions:
- issue: Personnification féminine de la Sagesse
  choice: Conserver les pronoms et les actions personnels au féminin (« elle », « d’elle »).
  alternative: Rendre la sagesse comme une réalité abstraite et impersonnelle.
  rationale: Le grec présente la Sagesse comme une figure féminine agissante qui cherche, se montre et vient à la rencontre. Le français permet de préserver naturellement cette personnification.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde les trois initiatives successives de la Sagesse et la métaphore concrète des sentiers. Le point-virgule évite une phrase excessivement morcelée.
