  text: For the truest beginning of her is the desire for instruction,[a]
translation:
  language: fr
  text: Car le commencement le plus authentique de la Sagesse, c’est le désir de s’instruire.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le commencement le plus sûr de la Sagesse, c’est le désir de l’instruction ». Le grec παιδεία peut évoquer l’instruction, l’éducation, la formation ou la discipline.
    reason: Alternative lexicale reflétant les nuances de ἀληθεστάτη et de παιδεία.
lexical_decisions:
- source_word: ἀρχὴ
  choice: commencement
  rationale: Le terme désigne le début ou le point de départ; « commencement » conserve ici la métaphore de la première étape vers la Sagesse.
- source_word: γὰρ
  choice: car
  rationale: La conjonction introduit l’explication de l’affirmation précédente.
- source_word: αὐτῆς
  choice: de la Sagesse
  rationale: Le pronom féminin renvoie à la Sagesse personnifiée. La reprise explicite est naturelle en français et préserve cette personnification.
- source_word: ἡ ἀληθεστάτη
  choice: le plus véritable
  rationale: Cette formulation garde la valeur superlative de ἀληθεστάτη et l’idée du commencement le plus authentique, sans trancher en faveur de la seule nuance de certitude.
- source_word: παιδείας
  choice: recevoir une formation
  rationale: παιδεία recouvre l’instruction, l’éducation et la discipline formatrice. « Recevoir une formation » exprime ce processus de façon naturelle et actuelle.
- source_word: ἐπιθυμία
  choice: désir
  rationale: « Désir » rend directement le nom grec sans accentuer indûment son intensité.
theological_decisions:
- issue: Personnification féminine de la Sagesse
  choice: Nommer explicitement « la Sagesse »
  alternative: Employer un pronom comme « d’elle » ou traiter la sagesse comme une abstraction non personnifiée
  rationale: Le féminin grec renvoie à la Sagesse personnifiée dans le contexte. La répétition du nom en français maintient clairement cet effet littéraire et théologique sans lui ajouter de portée doctrinale.
translation_notes:
  register: Français international moderne, sobre et sapientiel. La syntaxe aphoristique et le lien explicatif « car » sont conservés; la formulation reste accessible tout en maintenant le superlatif grec et la personnification de la Sagesse.
