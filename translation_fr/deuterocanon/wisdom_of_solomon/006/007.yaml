base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/007.yaml
  text: For the Master of all will not show partiality[a], nor will he be overawed by greatness; for he himself made both small and great[c][b], and he cares for all alike.
translation:
  language: fr
  text: 'Car le Maître de tous[b] ne fera preuve d’aucune partialité[a] et ne se laissera pas intimider par la grandeur : c’est lui qui a fait les petits comme les grands, et il prend également soin de tous[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie une expression idiomatique liée à « visage » ou « personne » ; elle signifie favoriser quelqu’un ou faire preuve de partialité.
    reason: lexical_alternative
  - marker: b
    text: Ou « le Souverain de tous ». Le titre grec est ici despotès, et non kyrios (« Seigneur »).
    reason: lexical_alternative
  - marker: c
    text: Ou « il veille pareillement sur tous » ; le verbe grec peut aussi évoquer le fait de pourvoir aux besoins de tous ou d’exercer sa providence envers tous.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποστελεῖται πρόσωπον
  choice: ne fera preuve d’aucune partialité
  rationale: L’expression grecque comportant πρόσωπον (« visage, personne ») est idiomatique et désigne le favoritisme envers quelqu’un en raison de son identité ou de son rang. La formulation française est claire et conserve la portée éthique du texte.
- source_word: ὁ πάντων δεσπότης
  choice: le Maître de tous
  rationale: δεσπότης désigne celui qui détient une autorité absolue. « Maître » préserve cette nuance et distingue ce titre de κύριος, habituellement rendu par « Seigneur ».
- source_word: ἐντραπήσεται μέγεθος
  choice: ne se laissera pas intimider par la grandeur
  rationale: Dans ce contexte, ἐντρέπομαι exprime le fait d’être impressionné, intimidé ou retenu par l’importance d’une personne. « Grandeur » conserve l’ambivalence entre rang élevé et importance.
- source_word: μικρὸν καὶ μέγαν
  choice: les petits comme les grands
  rationale: Cette paire opposée englobe les personnes de rang modeste et élevé. Le pluriel substantivé est naturel en français tout en préservant le mérisme grec.
- source_word: ὁμοίως τε προνοεῖ περὶ πάντων
  choice: il prend également soin de tous
  rationale: προνοέω peut exprimer la prévoyance, la sollicitude ou l’action de pourvoir. Cette traduction naturelle rend la sollicitude divine et l’égalité indiquée par ὁμοίως.
theological_decisions:
- issue: Distinction entre δεσπότης et κύριος
  choice: Maître
  alternative: Souverain ; Seigneur
  rationale: « Maître » maintient le sens d’autorité absolue propre à δεσπότης sans confondre ce terme avec κύριος. La note signale aussi l’alternative naturelle « Souverain ».
- issue: Impartialité divine envers le rang social
  choice: ne fera preuve d’aucune partialité
  alternative: ne favorisera personne ; ne fera pas acception de personnes
  rationale: La formulation exprime directement l’impartialité affirmée par l’idiome grec, sans lui ajouter une construction doctrinale ultérieure.
- issue: Portée de la providence divine
  choice: il prend également soin de tous
  alternative: il veille pareillement sur tous ; il pourvoit également aux besoins de tous
  rationale: La traduction conserve la portée générale de προνοεῖ sans préciser excessivement la manière dont s’exerce cette sollicitude.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure causale et le parallélisme du grec sont conservés. « Les petits comme les grands » rend naturellement une opposition de statut, tandis que « grandeur » reste assez ouverte pour couvrir l’importance, le rang ou la puissance.
