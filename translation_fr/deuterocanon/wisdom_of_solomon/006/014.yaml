  terminology: « Sagesse » demeure implicitement la figure féminine établie par le contexte, et les pronoms féminins la préservent. « Portes » est préférable à une précision telle que « maison » dans le texte lui-même, puisque πύλαι évoque des portes ou portails et que le grec ne mentionne pas de demeure. « Car » rend sobrement γάρ.
