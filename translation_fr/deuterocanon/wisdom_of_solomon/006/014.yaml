  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : le lever matinal, l’absence de fatigue et l’image de la Sagesse déjà présente près des portes du chercheur sont conservés. Toutefois, « se lève tôt pour elle » est ambigu en français : il peut suggérer que l’on se lève tôt à son bénéfice, plutôt que de diriger sa démarche vers elle. L’ajout minimal « pour la chercher » explicite naturellement la direction exprimée par ἐπ’ αὐτήν dans ce contexte, sans modifier l’image ni surinterpréter le texte.'
