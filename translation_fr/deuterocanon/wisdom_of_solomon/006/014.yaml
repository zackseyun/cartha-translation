  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/014.yaml
  text: Whoever rises early for her will not grow weary[b][a], for he will find her sitting beside his gates.
translation:
  language: fr
  text: Celui qui se lève tôt pour la chercher ne se fatiguera pas[a], car il la trouvera assise près de ses portes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Celui qui s’empresse de la chercher dès le matin ». Le verbe grec signifie d’abord « se lever tôt » et peut, par extension, exprimer une recherche empressée dès la première heure.
    reason: lexical_alternative
  - marker: b
    text: L’image présente la Sagesse personnifiée comme déjà assise, attendant celui qui la cherche à l’entrée de sa demeure.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ὀρθρίσας ἐπ' αὐτὴν
  choice: Celui qui se lève tôt pour elle
  rationale: Le participe aoriste de ὀρθρίζω évoque d’abord le fait de se lever tôt, avec l’idée possible de s’empresser de chercher. La formulation conserve l’image concrète et la personnification féminine de la Sagesse.
- source_word: οὐ κοπιάσει
  choice: ne se fatiguera pas
  rationale: κοπιάω peut désigner le labeur ou la fatigue qui en résulte. Ici, « ne se fatiguera pas » exprime naturellement que sa démarche ne sera pas épuisante.
- source_word: γὰρ
  choice: car
  rationale: γάρ introduit la raison pour laquelle celui qui se lève tôt ne se fatiguera pas.
- source_word: πάρεδρον
  choice: assise près de
  rationale: πάρεδρος désigne quelqu’un qui siège auprès d’un autre ou se tient à ses côtés. « assise près de » rend concrètement l’image de la Sagesse personnifiée déjà présente à l’entrée.
- source_word: τῶν πυλῶν αὐτοῦ
  choice: de ses portes
  rationale: πύλη désigne normalement une porte monumentale ou un portail. Le pluriel est conservé sans ajouter la mention d’une maison, absente du grec.
theological_decisions:
- issue: Personnification féminine de la Sagesse et masculin générique du chercheur
  choice: Conserver le féminin pour la Sagesse (« elle », « la ») et rendre le chercheur par « celui » et le possessif « ses ».
  alternative: Employer une tournure épicène telle que « la personne qui… à ses portes ».
  rationale: Le grec personnifie clairement la Sagesse au féminin et présente le chercheur sous une forme masculine générique. La traduction garde ces deux traits sans effacer la personnification.
translation_notes:
  register: Français international moderne, clair et digne. La structure proverbiale, le lien explicatif introduit par « car » et l’image concrète de la Sagesse assise à l’entrée sont conservés.
