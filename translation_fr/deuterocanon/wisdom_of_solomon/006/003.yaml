base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/003.yaml
  text: For authority was given to you by the Lord[a], and sovereignty by the Most High, who will examine your works and investigate your plans[b];
translation:
  language: fr
  text: Car le pouvoir vous a été donné par le Seigneur, et l’autorité souveraine par le Très-Haut, qui examinera vos actes et scrutera vos intentions[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « vos projets », « vos conseils » ou « vos délibérations » : le grec peut désigner aussi bien les desseins que la réflexion intérieure qui les précède.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κράτησις
  choice: pouvoir
  rationale: Dans cette adresse aux souverains, le terme désigne le pouvoir détenu et exercé pour gouverner. « Pouvoir » est naturel en français et convient à la tournure « vous a été donné ».
- source_word: δυναστεία
  choice: autorité souveraine
  rationale: Le mot désigne ici la puissance de domination ou l’autorité dirigeante, et non une lignée dynastique. « Autorité souveraine » distingue ce terme de κράτησις tout en maintenant le parallélisme.
- source_word: παρὰ τοῦ κυρίου
  choice: par le Seigneur
  rationale: παρά suivi du génitif indique la source. Avec le passif « a été donné », « par le Seigneur » exprime naturellement en français l’origine divine du pouvoir.
- source_word: παρὰ Ὑψίστου
  choice: par le Très-Haut
  rationale: La même préposition indique la source, et « le Très-Haut » est la traduction française usuelle du titre divin Ὕψιστος.
- source_word: ἐξετάσει
  choice: examinera
  rationale: Le futur annonce un examen attentif dans un contexte de jugement et conserve une formulation claire et digne.
- source_word: τὰ ἔργα
  choice: vos actes
  rationale: Dans ce contexte moral et judiciaire, « actes » rend les actions accomplies plus précisément et naturellement que le possible « œuvres ».
- source_word: διεραυνήσει
  choice: scrutera
  rationale: Le verbe composé exprime une recherche approfondie. « Scrutera » restitue cette intensité et forme un contraste pertinent entre les actes visibles et les dispositions intérieures.
- source_word: τὰς βουλάς
  choice: vos intentions
  rationale: βουλαί peut désigner les projets, les délibérations ou les desseins. « Intentions » souligne ici la dimension intérieure soumise au regard divin, sans exclure l’idée de projets réfléchis.
theological_decisions:
- issue: Titres divins κύριος et Ὕψιστος employés en parallèle
  choice: « le Seigneur » et « le Très-Haut »
  alternative: « le Maître » et « le Très-Haut »
  rationale: Ces deux titres attribuent à Dieu l’origine du pouvoir politique et affirment que les gouvernants lui rendent compte. Les équivalents choisis sont usuels, dignes et préservent le parallélisme sans introduire de particularité confessionnelle.
- issue: Portée de βουλάς dans le jugement divin
  choice: « intentions » avec une note signalant « projets », « conseils » ou « délibérations »
  alternative: « projets » dans le texte principal
  rationale: Le grec peut viser aussi bien les desseins arrêtés que les délibérations intérieures. « Intentions » fait ressortir le contraste avec les actes sans réduire le jugement aux seules décisions déjà exécutées; la note conserve l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, clair et soutenu. Le parallélisme grec est conservé, avec une légère variation lexicale entre « pouvoir » et « autorité souveraine ». Le rythme solennel du jugement est rendu par « examinera » puis le plus intense « scrutera ».
