  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/024.yaml
  text: A multitude of the wise is the salvation of the world[b][a], and a prudent king is the stability of a people.
translation:
  language: fr
  text: Une multitude de sages est le salut du monde[a], et un roi prudent est la stabilité d’un peuple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la délivrance » ou « la préservation » du monde.
    reason: lexical_alternative
  - marker: b
    text: Ou « la stabilité du peuple ». Le grec δήμου peut désigner le peuple, la population ou le corps des citoyens.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλῆθος σοφῶν
  choice: une multitude de sages
  rationale: Cette formulation conserve la construction nominale et le ton proverbial du grec, tout en restant naturelle en français.
- source_word: σωτηρία
  choice: le salut
  rationale: « Salut » préserve la force et l’étendue sémantique du grec, qui peut aussi évoquer la délivrance ou la préservation, sans réduire le propos au seul bien-être civique.
- source_word: κόσμου
  choice: du monde
  rationale: Le génitif est rendu directement; « monde » garde la portée large de κόσμος.
- source_word: βασιλεὺς φρόνιμος
  choice: un roi prudent
  rationale: « Roi » traduit précisément βασιλεύς, tandis que « prudent » exprime la sagesse pratique et le jugement avisé de φρόνιμος.
- source_word: εὐσταθία δήμου
  choice: assure la stabilité d’un peuple
  rationale: La tournure verbale française explicite la relation nominale implicite dans la maxime grecque sans en modifier le sens; « un peuple » conserve la portée générale de δήμου.
theological_decisions:
- issue: Portée de σωτηρία dans un contexte sapientiel et politique
  choice: le salut
  alternative: la délivrance; la préservation
  rationale: Le contexte est communautaire et politique, mais le terme grec demeure plus fort que le simple bien-être. « Salut » maintient cette tension et sa portée potentiellement plus vaste.
translation_notes:
  register: Français moderne, digne et proverbial. La première proposition demeure nominale; dans la seconde, « assure » rend idiomatiquement la relation entre le roi prudent et la stabilité du peuple.
