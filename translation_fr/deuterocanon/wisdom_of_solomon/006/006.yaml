  text: For the least is deserving of mercy[b][a], but the mighty will be examined mightily.
translation:
  language: fr
  text: Car le moindre est digne de clémence[a], mais les puissants seront soumis à un examen rigoureux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « est excusable par miséricorde ». Le grec évoque le fait d’être excusé ou traité avec clémence.'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec emploie des mots de même famille : littéralement, « les puissants seront puissamment examinés ». « Avec rigueur » exprime le sens dans un français naturel, mais ne reproduit pas cet écho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάχιστος
  choice: le plus humble
  rationale: L’adjectif superlatif substantivé désigne ici celui qui occupe le rang le moins élevé ou détient le moins de pouvoir; ce choix marque naturellement le contraste avec « les puissants ».
- source_word: συγγνωστός
  choice: peut être traité avec indulgence
  rationale: L’adjectif exprime l’idée d’être excusé ou de bénéficier de compréhension et de clémence. Cette formulation française conserve la portée judiciaire sans déclarer nécessairement l’innocence.
- source_word: ἐλέους
  choice: avec indulgence
  rationale: Le génitif condensé associé à συγγνωστός renvoie à la miséricorde ou à la clémence. L’intégration dans l’expression française évite une tournure artificielle tout en préservant le sens.
- source_word: δυνατοὶ
  choice: les puissants
  rationale: Dans le contexte adressé aux gouvernants, le terme désigne ceux qui possèdent pouvoir et autorité.
- source_word: δυνατῶς
  choice: puissant
  rationale: L’adjectif dans « un puissant examen » fait écho à « les puissants » et cherche à reproduire le jeu étymologique grec, malgré une tournure volontairement marquée.
- source_word: ἐτασθήσονται
  choice: seront soumis à un examen
  rationale: Le futur passif évoque une investigation ou un examen approfondi, dans un cadre de jugement, sans préciser d’avance son résultat.
theological_decisions:
- issue: Différence de traitement entre le plus humble et les détenteurs du pouvoir
  choice: Conserver le contraste entre indulgence envers le plus humble et examen rigoureux des puissants.
  alternative: Le plus humble sera pardonné par miséricorde, mais les puissants seront jugés sévèrement.
  rationale: Le grec oppose clémence et responsabilité accrue, mais ne dit explicitement ni que le premier sera effectivement pardonné ni que les seconds seront condamnés. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. « Un puissant examen » est une formulation légèrement marquée, retenue afin de préserver autant que possible le jeu de mots entre δυνατοί et δυνατῶς; la note fournit une expression française plus idiomatique.
