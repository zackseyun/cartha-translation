  text: But for the mighty, a stern inquiry is coming.
translation:
  language: fr
  text: Mais un examen sévère attend les puissants.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς δὲ κραταιοῖς
  choice: Mais les puissants
  rationale: κραταιός désigne ici ceux qui détiennent une grande puissance; « les puissants » est naturel et conserve le contraste marqué par δέ.
- source_word: ἰσχυρὰ
  choice: rigoureuse
  rationale: L’adjectif qualifie l’enquête comme forte, sévère ou exigeante; « rigoureuse » convient idiomatiquement à une enquête sans en atténuer la gravité.
- source_word: ἐφίσταται
  choice: seront soumis à
  rationale: Le verbe indique qu’une enquête survient ou s’abat sur les puissants. Cette formulation française rend naturellement la menace imminente sans ajouter d’agent explicite.
- source_word: ἔραυνα
  choice: une enquête
  rationale: ἔρευνα désigne un examen approfondi ou une investigation; « enquête » préserve ici la dimension judiciaire.
theological_decisions:
- issue: Nature et agent de l’enquête
  choice: Ne pas nommer explicitement Dieu comme agent
  alternative: Dieu leur fera subir une enquête rigoureuse
  rationale: Le grec laisse l’agent implicite; la traduction conserve cette retenue et la tension du contexte judiciaire.
- issue: Temporalité de ἐφίσταται
  choice: Employer le futur français
  alternative: une enquête rigoureuse se présente à eux
  rationale: Le présent grec exprime une venue menaçante ou imminente; le futur est plus naturel en français tout en gardant cette portée.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure passive est idiomatique dans un contexte de jugement et évite le calque peu naturel « une enquête se tient sur eux ».
