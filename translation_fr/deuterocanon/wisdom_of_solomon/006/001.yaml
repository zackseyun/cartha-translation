translation:
  language: fr
  text: Écoutez donc, rois, et comprenez ; apprenez, juges des confins de la terre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « juges des confins de la terre » désigne ceux qui exercent le jugement jusque dans les régions les plus lointaines du monde ; elle souligne la portée universelle de l’avertissement.
