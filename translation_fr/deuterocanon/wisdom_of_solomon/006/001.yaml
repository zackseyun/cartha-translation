translation_notes:
  register: Français international moderne, solennel mais accessible. Le parallélisme des trois impératifs et l’adresse directe aux rois et aux juges sont conservés. « Confins de la terre » maintient l’image grecque sans produire le tour moins naturel « extrémités de la terre ».
