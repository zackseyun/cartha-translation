lexical_decisions:
- source_word: Ἀκούσατε
  choice: Écoutez
  rationale: L’impératif pluriel appelle à une écoute attentive ; « Écoutez » est naturel en français et garde la force de l’exhortation.
- source_word: οὖν
  choice: donc
  rationale: « Donc » marque avec naturel la conséquence logique qui relie ce verset à l’argument précédent.
- source_word: βασιλεῖς
  choice: rois
  rationale: Le terme grec désigne précisément des rois ; le vocatif direct est conservé.
- source_word: σύνετε
  choice: comprenez
  rationale: Ce choix rend directement l’impératif de συνίημι sans lui donner le sens plus interprétatif de « soyez sages ».
- source_word: μάθετε
  choice: instruisez-vous
  rationale: Dans cette adresse exhortative, « instruisez-vous » exprime naturellement l’idée d’apprendre et de recevoir un enseignement, tout en conservant l’impératif.
- source_word: δικασταί
  choice: juges
  rationale: « Juges » préserve la fonction judiciaire exprimée par le grec, sans l’élargir à l’ensemble des gouvernants.
- source_word: περάτων γῆς
  choice: des confins de la terre
  rationale: Cette expression française dignifiée et courante dans le registre biblique rend les extrémités ou les régions les plus lointaines de la terre, tout en maintenant la portée universelle de l’adresse.
