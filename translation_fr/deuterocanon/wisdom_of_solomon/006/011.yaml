  text: Therefore desire my words[a]; long for them[b], and you will be instructed.
translation:
  language: fr
  text: Désirez donc mes paroles, aspirez ardemment à elles[a], et vous serez instruits[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « désirez-les ardemment ». Le second verbe grec exprime un désir plus intense que le premier.
    reason: lexical_alternative
  - marker: b
    text: Ou « vous serez formés » ou « vous recevrez une discipline ». Le verbe grec peut désigner à la fois l’instruction et la discipline formatrice.
