lexical_decisions:
- source_word: ἐπιθυμήσατε
  choice: Désirez
  rationale: L’impératif exprime ici un désir positif et volontaire. « Désirez » est direct, naturel et garde la force exhortative du grec.
- source_word: οὖν
  choice: donc
  rationale: Le mot marque la conséquence de l’argument précédent; « donc » en conserve clairement la valeur logique.
- source_word: τῶν λόγων μου
  choice: mes paroles
  rationale: « Paroles » rend directement λόγοι sans préciser à l’excès s’il s’agit de propos, de maximes ou d’enseignements.
- source_word: ποθήσατε
  choice: recherchez-les avec ardeur
  rationale: Le second impératif exprime un désir plus intense et affectif que le premier. Cette formulation française naturelle rend cette intensification, bien qu’une traduction plus littérale soit possible.
- source_word: καὶ
  choice: et
  rationale: La coordination grecque est conservée; le futur qui suit permet de comprendre naturellement la nuance de conséquence.
- source_word: παιδευθήσεσθε
  choice: vous serez instruits
  rationale: Le futur passif est préservé. Dans ce contexte sapientiel, l’instruction est au premier plan, sans exclure la formation ou la discipline contenues dans le champ sémantique du verbe.
theological_decisions:
- issue: Étendue sémantique de παιδεύω dans un contexte sapientiel
  choice: L’instruction est mise au premier plan dans le texte principal.
  alternative: « vous serez formés » ou « vous serez corrigés »
  rationale: Le contexte immédiat invite à accueillir les paroles de la Sagesse. « Vous serez instruits » suit ce mouvement, tandis qu’une note préserve la dimension plus large de formation et de discipline.
translation_notes:
  register: Français international moderne, clair et digne. La répétition sémantique des deux impératifs grecs est conservée tout en les différenciant naturellement par « avec ardeur ». Le point-virgule souligne la progression de l’exhortation vers son résultat.
