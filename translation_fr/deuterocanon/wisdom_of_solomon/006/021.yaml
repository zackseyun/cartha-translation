base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/021.yaml
  text: Therefore[a], if you delight in thrones and scepters, O rulers of peoples, honor wisdom, so that you may reign forever.
translation:
  language: fr
  text: Si donc vous prenez plaisir aux trônes et aux sceptres, dirigeants des peuples[a], honorez la sagesse, afin de régner pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tyrans des peuples ». Le terme grec peut désigner des dirigeants en général, mais il prend parfois un sens plus négatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥδεσθε
  choice: vous prenez plaisir
  rationale: Cette expression rend naturellement l’idée de trouver son plaisir dans quelque chose, sans affaiblir l’attrait exercé par le pouvoir.
- source_word: θρόνοις καὶ σκήπτροις
  choice: aux trônes et aux sceptres
  rationale: La traduction directe conserve les deux emblèmes royaux et leur parallélisme.
- source_word: τύραννοι λαῶν
  choice: dirigeants des peuples
  rationale: Dans ce contexte, τύραννοι peut désigner les détenteurs du pouvoir sans avoir nécessairement le sens fortement péjoratif de « tyrans » en français moderne. « Peuples » respecte le pluriel λαῶν.
- source_word: τιμήσατε σοφίαν
  choice: honorez la sagesse
  rationale: « Honorez » conserve la force impérative et le registre élevé de τιμήσατε, tandis que « sagesse » préserve toute l’ampleur de σοφία.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Cette tournure française courante exprime clairement la durée indéfinie de l’expression grecque.
- source_word: βασιλεύσητε
  choice: afin de régner
  rationale: « Régner » maintient la nuance proprement royale du verbe et fait écho aux trônes et aux sceptres.
theological_decisions:
- issue: Portée de τύραννοι dans l’adresse aux détenteurs du pouvoir
  choice: dirigeants des peuples
  alternative: tyrans des peuples
  rationale: Le grec admet ici un emploi relativement neutre. Traduire par « tyrans » imposerait en français moderne un jugement moral fortement négatif que l’exhortation ne formule pas sans ambiguïté; une note conserve néanmoins cette possibilité lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. Les images royales sont conservées; la syntaxe reste proche du grec tout en étant naturelle en français.
