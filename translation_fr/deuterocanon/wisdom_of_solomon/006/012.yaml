  text: Wisdom is radiant and unfading[a], and is readily seen by those who love her;
translation:
  language: fr
  text: La Sagesse est éclatante et ne se flétrit pas ; elle est aisément visible[a] par ceux qui l’aiment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « elle est aisément contemplée » ou « elle est aisément perçue ». Le verbe grec peut désigner aussi bien le fait de voir que celui de reconnaître ou de saisir par l’esprit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λαμπρὰ
  choice: éclatante
  rationale: Rend l’idée de brillance visible dans un français naturel et soutenu, sans ajouter une connotation théologique absente du terme grec.
- source_word: ἀμάραντός
  choice: ne se flétrit pas
  rationale: Préserve l’image concrète de ce qui ne perd ni sa fraîcheur ni son éclat, plutôt que de la remplacer par l’abstraction « impérissable ».
- source_word: ἡ σοφία
  choice: la Sagesse
  rationale: La majuscule aide à signaler la personnification littéraire développée dans le passage, tandis que l’article et les reprises féminines suivent naturellement le genre du nom français.
- source_word: εὐχερῶς
  choice: aisément
  rationale: Exprime la facilité indiquée par l’adverbe grec dans un registre courant, digne et fluide.
- source_word: θεωρεῖται
  choice: elle se laisse aisément voir
  rationale: Conserve la force visuelle du verbe, en accord avec « éclatante », tout en exprimant naturellement en français que la Sagesse est accessible au regard de ceux qui l’aiment.
- source_word: ὑπὸ τῶν ἀγαπώντων αὐτήν
  choice: par ceux qui l’aiment
  rationale: Traduction directe du participe présent et de son objet féminin, qui maintient la personnification de la Sagesse.
theological_decisions:
- issue: Personnification de σοφία
  choice: Employer « la Sagesse » avec une majuscule et la reprendre par « elle » et « l’ ».
  alternative: Traiter « sagesse » uniquement comme une notion abstraite, sans signaler la personnification.
  rationale: Le contexte présente la Sagesse comme une figure féminine aimée et visible. La traduction conserve cette présentation littéraire sans définir davantage son statut théologique.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’image lumineuse et végétale du grec ainsi que la personnification féminine de la Sagesse.
