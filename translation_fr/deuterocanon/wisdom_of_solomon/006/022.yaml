revisions:
- from: Mais ce qu’est la sagesse et comment elle est venue à l’existence[a], je vais l’annoncer, sans vous en cacher les mystères. Au contraire, je remonterai jusqu’au commencement de son origine, je mettrai en lumière ce qu’on peut connaître d’elle, et je ne passerai certainement pas à côté de la vérité[b].
  to: Mais ce qu’est la sagesse et comment elle est venue à l’existence, je l’annoncerai, et je ne vous cacherai pas les mystères. Au contraire, depuis le commencement de son existence, j’en suivrai la trace, je rendrai manifeste la connaissance qu’on en a, et je ne passerai en aucun cas à côté de la vérité[a].
  rationale: La révision corrige le complément de « cacher », supprime l’ajout modal dans le rendu de γνῶσις et reformule le retracement de l’origine en français naturel. « Venue à l’existence » et « commencement de son existence » préservent la portée du grec sans imposer une conclusion doctrinale sur le statut de la Sagesse. L’ancre de note est déplacée au seul endroit où la note correspond à une variante lexicale réelle.
