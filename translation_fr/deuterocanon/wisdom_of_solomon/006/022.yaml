base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/022.yaml
  text: But what wisdom is and how it came to be[a], I will declare, and I will not hide mysteries from you; rather, from the beginning of its origin I will trace it out, and I will set the knowledge of it in the open[b], and I will by no means pass by the truth.
translation:
  language: fr
  text: Mais ce qu’est la sagesse et comment elle est venue à l’existence, je l’annoncerai, et je ne vous cacherai pas les mystères. Au contraire, depuis le commencement de son existence, j’en suivrai la trace, je rendrai manifeste la connaissance qu’on en a, et je ne passerai en aucun cas à côté de la vérité[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque comporte une négation renforcée ; on pourrait aussi traduire : « je ne négligerai en aucun cas la vérité » ou « je ne passerai nullement outre à la vérité ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί δέ ἐστιν σοφία
  choice: ce qu’est la sagesse
  rationale: Préserve directement la proposition interrogative grecque et rend σοφία de manière constante par « sagesse ».
- source_word: πῶς ἐγένετο
  choice: comment elle est venue à l’existence
  rationale: Exprime le fait de venir à l’être sans imposer l’idée plus précise d’une création ni trancher une question métaphysique.
- source_word: ἀπαγγελῶ
  choice: je vais l’annoncer
  rationale: Le verbe désigne l’action d’annoncer ou de faire connaître; « annoncer » conserve la solennité tout en restant courant.
- source_word: οὐκ ἀποκρύψω ὑμῖν μυστήρια
  choice: sans vous en cacher les mystères
  rationale: « Mystères » maintient le poids de μυστήρια, tandis que « cacher » rend naturellement ἀποκρύπτω.
- source_word: ἀλλὰ ἀπ' ἀρχῆς γενέσεως ἐξιχνιάσω
  choice: Au contraire, je remonterai jusqu’au commencement de son origine
  rationale: « Remonter » restitue l’image d’une recherche qui suit une piste jusqu’à son point de départ; la formulation conserve la densité de ἀρχῆς γενέσεως.
- source_word: θήσω εἰς τὸ ἐμφανὲς τὴν γνῶσιν αὐτῆς
  choice: je mettrai en lumière ce qu’on peut connaître d’elle
  rationale: « Mettre en lumière » rend idiomatiquement l’idée de placer au grand jour; la tournure française évite l’ambiguïté peu naturelle de « sa connaissance ».
- source_word: οὐ μὴ παροδεύσω τὴν ἀλήθειαν
  choice: je ne passerai certainement pas à côté de la vérité
  rationale: « Certainement pas » marque la négation renforcée οὐ μή, et « passer à côté » conserve la métaphore de παροδεύω.
theological_decisions:
- issue: Portée métaphysique possible de πῶς ἐγένετο et γενέσεως à propos de la sagesse
  choice: Employer le langage de la venue à l’existence et de l’origine sans préciser que la sagesse aurait été créée.
  alternative: « comment elle a été créée » ou « comment elle est apparue »
  rationale: Le grec évoque la venue à l’être ou l’origine, mais ce verset ne doit pas être forcé à trancher le statut métaphysique de la Sagesse personnifiée.
translation_notes:
  register: Français international moderne, digne et accessible. La structure grecque est légèrement répartie en deux phrases pour éviter une période trop lourde. Les images de la recherche, de la mise en lumière et du passage à côté sont conservées sous une forme idiomatique.
