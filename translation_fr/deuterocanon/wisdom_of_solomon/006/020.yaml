  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/020.yaml
  text: So then[a], desire for wisdom leads to kingship.
translation:
  language: fr
  text: Ainsi donc, le désir de la sagesse conduit à la royauté.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à un royaume », « au pouvoir royal » ou « au règne ». Le grec βασιλεία peut désigner la royauté, le règne ou le royaume ; ici, « royauté » correspond le mieux au contexte, qui porte sur l’accès au gouvernement.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμία
  choice: désir
  rationale: Le nom exprime un désir marqué. « Désir » est naturel en français actuel et évite aussi bien la connotation négative de « convoitise » que l'intensité affective ajoutée par « aspiration ardente ».
- source_word: ἄρα
  choice: ainsi donc
  rationale: La particule marque ici la conclusion tirée de l'enchaînement précédent. « Ainsi donc » rend explicitement cette relation logique dans un registre digne et naturel.
- source_word: σοφίας
  choice: de la sagesse
  rationale: « Sagesse » est l'équivalent usuel de σοφία et en conserve ici la portée pratique, théologique et philosophique.
- source_word: ἀνάγει
  choice: conduit
  rationale: Le verbe signifie littéralement « mener vers le haut » ou « faire monter », mais indique ici le mouvement vers un but. « Conduit » restitue clairement cette orientation sans lourdeur littérale.
- source_word: ἐπὶ βασιλείαν
  choice: à la royauté
  rationale: Avec ἐπί suivi de l'accusatif après ἀνάγει, l'expression indique l'aboutissement à un état ou à un statut. « À la royauté » convient mieux au contexte que le sens territorial de « royaume ».
theological_decisions:
- issue: Sens de βασιλεία dans cette conclusion sur la sagesse
  choice: royauté
  alternative: royaume ; pouvoir royal ; règne
  rationale: Le contexte porte sur l'accès au gouvernement ou au statut royal. « Royauté » préserve ce sens sans réduire βασιλεία à un territoire et sans transformer ce choix lexical en interprétation doctrinale.
translation_notes:
  register: Français international moderne, concis et digne. La formulation conserve la structure aphoristique du grec ainsi que le lien logique avec les versets précédents.
