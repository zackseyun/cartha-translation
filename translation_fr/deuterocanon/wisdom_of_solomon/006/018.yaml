base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/018.yaml
  text: and concern for instruction is love[a], and love is the keeping of her laws, and attention to her laws is the assurance of incorruptibility[b],
translation:
  language: fr
  text: Le souci de l’instruction, c’est l’amour[a] ; l’amour, c’est l’observance de ses lois ; et l’attention portée à ses lois est l’assurance de l’incorruptibilité[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « discipline », « éducation » ou « formation » pour « instruction » (παιδεία), terme qui évoque une éducation formatrice sur le plan moral.
    reason: lexical_alternative
  - marker: b
    text: Ou « immortalité » ou « impérissabilité » pour « incorruptibilité » (ἀφθαρσία). Le grec désigne plus littéralement l’absence de corruption ou de dégradation.
    reason: lexical_alternative
lexical_decisions:
- source_word: φροντὶς
  choice: souci
  rationale: « Souci » rend l’idée de soin et de préoccupation active tout en conservant le nom abstrait qui structure la progression du verset.
- source_word: παιδείας
  choice: instruction
  rationale: « Instruction » exprime de façon claire la formation morale et éducative portée par παιδεία; une note signale les nuances possibles de discipline et de formation.
- source_word: ἀγάπη
  choice: amour
  rationale: Le terme est rendu directement par « amour », et sa répétition est conservée afin de respecter la chaîne argumentative grecque.
- source_word: τήρησις
  choice: observance
  rationale: Dans le contexte de lois, « observance » rend naturellement l’action de les garder et de s’y conformer.
- source_word: νόμων
  choice: lois
  rationale: « Lois » correspond directement au pluriel νόμων et maintient le registre juridique et éthique du passage.
- source_word: αὐτῆς
  choice: ses
  rationale: Le possessif renvoie à la Sagesse personnifiée dans le contexte. En français, « ses » conserve ce rapport sans imposer ici un pronom personnel explicite.
- source_word: προσοχὴ
  choice: attention portée
  rationale: Cette formulation exprime l’attention vigilante et volontaire envers les lois, dans un français naturel.
- source_word: βεβαίωσις
  choice: garantit
  rationale: Le grec désigne l’affermissement ou la confirmation. La formulation verbale française « garantit » rend clairement la relation exprimée, sans présenter une causalité plus détaillée que le texte.
- source_word: ἀφθαρσίας
  choice: incorruptibilité
  rationale: « Incorruptibilité » suit au plus près l’idée d’absence de corruption ou de dégradation; « immortalité » demeure une interprétation contextuelle signalée en note.
theological_decisions:
- issue: Personnification de la Sagesse dans αὐτῆς
  choice: Comprendre « ses lois » comme les lois de la Sagesse personnifiée.
  alternative: Rapporter le possessif de façon impersonnelle à l’instruction.
  rationale: Le contexte plus large personnifie la Sagesse au féminin, et le pronom grec féminin soutient ce renvoi; la formulation française préserve naturellement cette lecture.
- issue: Sens de ἀφθαρσία
  choice: Employer « incorruptibilité » dans le texte principal.
  alternative: « immortalité » ou « impérissabilité »
  rationale: Le grec met littéralement l’accent sur l’absence de corruption ou de dégradation. Ce choix préserve l’étendue du terme sans le réduire à une conclusion doctrinale plus précise.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition d’« amour » et l’enchaînement des noms abstraits sont préservés autant que le permet un français naturel. La virgule finale maintient la continuité syntaxique avec le verset suivant.
