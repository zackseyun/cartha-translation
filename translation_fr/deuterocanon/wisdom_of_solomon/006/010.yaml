base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/010.yaml
  text: For those who have kept holy things holily will be made holy[b][a], and those who have been taught them will find a defense.
translation:
  language: fr
  text: Car ceux qui auront saintement observé les choses saintes seront rendus saints[a], et ceux qui auront été instruits à leur sujet trouveront de quoi se défendre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui auront observé avec piété les réalités sacrées seront sanctifiés ». Le grec emploie délibérément trois mots de la même famille liés à la sainteté.
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque peut aussi se traduire par « trouveront une réponse » ou « trouveront une justification » ; elle évoque une défense présentée face à un examen ou à une accusation.
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλάξαντες
  choice: auront observé
  rationale: Le verbe exprime ici le fait de garder avec soin, au sens de respecter ou d’observer. « Auront observé » convient naturellement à des réalités ou devoirs sacrés et le futur antérieur s’accorde avec le verbe principal au futur.
- source_word: ὁσίως / τὰ ὅσια / ὁσιωθήσονται
  choice: saintement / les choses saintes / seront rendus saints
  rationale: Cette série conserve autant que possible en français l’insistance rhétorique créée en grec par trois mots de même famille, sans réduire « les choses saintes » à des rites ou à des devoirs particuliers.
- source_word: διδαχθέντες
  choice: auront été instruits
  rationale: Le passif grec indique qu’ils ont reçu un enseignement. Cette formulation reste claire et respecte cette voix passive.
- source_word: αὐτά
  choice: à leur sujet
  rationale: Le pronom renvoie le plus naturellement aux « choses saintes ». La tournure française évite l’ambiguïté peu naturelle de « instruits en elles ».
- source_word: εὑρήσουσιν ἀπολογίαν
  choice: trouveront de quoi se défendre
  rationale: 'Cette expression française naturelle préserve la nuance judiciaire ou argumentative d’ἀπολογία : une défense ou une réponse face à un examen ou à une accusation, sans imposer l’idée doctrinale de justification.'
theological_decisions:
- issue: Jeu de mots sur la sainteté (ὁσίως / τὰ ὅσια / ὁσιωθήσονται)
  choice: Conserver la répétition avec « saintement », « choses saintes » et « rendus saints ».
  alternative: « observer avec piété les réalités sacrées… seront sanctifiés »
  rationale: Le grec relie délibérément la conduite, son objet et son résultat au moyen de termes apparentés. La répétition française rend visible cette logique sans préciser indûment la nature des « choses saintes ».
- issue: Sens d’ἀπολογία
  choice: 'Une défense : « de quoi se défendre ».'
  alternative: « une réponse » ou « une justification »
  rationale: Le mot peut désigner une réponse argumentée ou une défense devant une accusation. « Se défendre » maintient cette portée sans importer un sens théologique technique de « justification ».
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la répétition marquée du grec tout en employant une expression idiomatique pour la nuance judiciaire finale.
