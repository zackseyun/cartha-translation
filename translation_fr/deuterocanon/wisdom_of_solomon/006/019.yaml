  text: and incorruptibility makes one near to God[a].
translation:
  language: fr
  text: et l’incorruptibilité fait que l’on est proche de Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’immortalité fait que l’on est proche de Dieu ». Le grec peut désigner l’état de ce qui est impérissable ou exempt de corruption ; « incorruptibilité » en conserve ici le sens plus large.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφθαρσία
  choice: incorruptibilité
  rationale: Le nom désigne l’état de ce qui n’est pas sujet à la corruption ou à la destruction. « Incorruptibilité » conserve sa portée à la fois existentielle et morale, sans la réduire à la seule immortalité.
- source_word: ἐγγὺς
  choice: proche de
  rationale: Cette expression rend directement la proximité relationnelle indiquée par le grec, sans suggérer une union avec Dieu.
- source_word: εἶναι
  choice: être
  rationale: 'L’infinitif complète ποιεῖ dans la construction causative : « fait que l’on est ».'
- source_word: ποιεῖ
  choice: fait que l’on est
  rationale: Le verbe a ici un sens causatif. Cette tournure est naturelle en français et permet d’exprimer sans lourdeur l’objet humain implicite.
- source_word: θεοῦ
  choice: Dieu
  rationale: Le génitif dépend de ἐγγύς et se rend idiomatiquement en français par « proche de Dieu ».
theological_decisions:
- issue: Objet humain implicite dans la proposition
  choice: 'Employer le pronom générique « on » : « fait que l’on est proche de Dieu »'
  alternative: « rapproche de Dieu » ou « rend [la sagesse] proche de Dieu »
  rationale: Le grec ne formule pas explicitement l’objet de ποιεῖ, mais le contexte concerne la personne qui recherche et possède la sagesse. Le pronom « on » préserve cette portée humaine générale sans identifier indûment l’objet à la sagesse.
- issue: Sens de ἀφθαρσία
  choice: incorruptibilité
  alternative: immortalité ou état impérissable
  rationale: « Incorruptibilité » maintient l’éventail sémantique du terme grec, qui peut évoquer aussi bien l’absence de corruption que l’impérissabilité, sans trancher en faveur du seul prolongement indéfini de la vie.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « fait que l’on est » restitue clairement la causalité tout en gardant la généralité de l’objet implicite.
