translation:
  language: fr
  text: Écoutez[a], vous qui exercez le pouvoir sur une multitude et qui tirez orgueil des foules de nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Prêtez l’oreille, vous qui détenez le pouvoir sur une multitude et qui vous glorifiez des multitudes de nations ».
    reason: 'Alternative lexicale et syntaxique : « Prêtez l’oreille » explicite l’idiome de ἐνωτίσασθε ; « détenez le pouvoir » et « vous glorifiez de » conservent les nuances possibles de κρατέω et de γεγαυρωμένοι avec ἐπί.'
lexical_decisions:
- source_word: ἐνωτίσασθε
  choice: Écoutez
  rationale: Cet impératif appelle à prêter une attention soutenue. « Écoutez » est direct et naturel en français moderne, tandis que la note conserve l’image idiomatique de l’oreille.
- source_word: οἱ κρατοῦντες πλήθους
  choice: vous qui exercez le pouvoir sur une multitude
  rationale: κρατέω exprime ici l’exercice de l’autorité. Cette formulation garde le génitif singulier collectif πλήθους sans donner au verbe une connotation nécessairement oppressive.
- source_word: γεγαυρωμένοι
  choice: vous enorgueillissez
  rationale: Le participe parfait décrit un état de fierté hautaine. « Vous enorgueillissez » préserve le ton de reproche et convient naturellement avec le complément introduit par ἐπί.
- source_word: ἐπὶ ὄχλοις ἐθνῶν
  choice: des foules de nations
  rationale: ὄχλοις désigne des foules ou des multitudes, et ἐθνῶν précise les nations ou peuples qui les composent. Avec γεγαυρωμένοι, ἐπί indique vraisemblablement ce qui fonde l’orgueil des dirigeants.
