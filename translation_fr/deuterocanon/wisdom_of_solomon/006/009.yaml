base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/009.yaml
  text: Therefore my words are for you[a], O tyrants[b], so that you may learn wisdom and not fall away.
translation:
  language: fr
  text: C’est donc à vous, tyrans[a], que s’adressent mes paroles, afin que vous appreniez la sagesse et que vous ne vous égariez pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « souverains ». Le grec peut désigner des détenteurs du pouvoir souverain, mais il prend ici une forte nuance négative.
    reason: lexical_alternative
  - marker: b
    text: Ou « que vous ne tombiez pas » ou « que vous ne failliez pas ». Le grec peut désigner plus largement le fait de tomber, d’échouer ou de dévier.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ὑμᾶς
  choice: à vous… que s’adressent
  rationale: La tournure française explicite naturellement l’adresse impliquée par le grec, tout en conservant son orientation vers les destinataires.
- source_word: οὖν
  choice: donc
  rationale: « Donc » marque clairement et sobrement la conséquence tirée de l’avertissement précédent.
- source_word: ὦ τύραννοι
  choice: tyrans
  rationale: Le terme préserve la force négative et polémique de τύραννοι dans ce contexte d’avertissement adressé aux détenteurs d’un pouvoir oppressif.
- source_word: οἱ λόγοι μου
  choice: mes paroles
  rationale: Rendu direct du pluriel grec, dans un registre digne et naturel en français biblique contemporain.
- source_word: ἵνα μάθητε
  choice: afin que vous appreniez
  rationale: Cette formulation conserve explicitement la valeur de but de ἵνα avec le subjonctif.
- source_word: σοφίαν
  choice: la sagesse
  rationale: « Sagesse » est le terme central et contextuellement requis dans ce livre.
- source_word: μὴ παραπέσητε
  choice: que vous ne vous égariez pas
  rationale: Le verbe peut exprimer le fait de tomber, de faillir ou de dévier. « Vous égariez » rend naturellement en français l’idée d’un échec moral sans imposer la notion plus précise d’apostasie.
theological_decisions:
- issue: Force de τύραννοι dans l’interpellation des autorités politiques
  choice: « tyrans »
  alternative: « souverains » ou « dirigeants »
  rationale: Le contexte d’admonestation et la coloration du terme grec justifient de conserver son tranchant négatif plutôt que de le neutraliser.
- issue: Portée de παραπέσητε
  choice: « vous ne vous égariez pas »
  alternative: « vous ne tombiez pas » ou « vous ne failliez pas »
  rationale: Le grec demeure assez large. La traduction retient l’égarement moral tout en signalant les autres possibilités en note, sans préciser indûment une apostasie religieuse.
translation_notes:
  register: Français international moderne, digne et accessible. La construction clivée « C’est donc à vous… que s’adressent » restitue idiomatiquement l’adresse emphatique du grec. « Tyrans » conserve la vigueur rhétorique, tandis que « vous égariez » évite de réduire l’ambiguïté du verbe à l’apostasie.
