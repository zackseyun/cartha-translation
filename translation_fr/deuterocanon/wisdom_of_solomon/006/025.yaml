  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/025.yaml
  text: Therefore be instructed by my words[a], and you will benefit.
translation:
  language: fr
  text: Ainsi donc, laissez-vous instruire par mes paroles[a], et vous en tirerez profit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « laissez-vous former par mes paroles ». Le verbe grec peut évoquer aussi bien l’instruction que la formation ou la discipline.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Ainsi donc
  rationale: Introduit la conséquence tirée de l’exhortation précédente, dans un français naturel tout en conservant la force déductive du grec.
- source_word: παιδεύεσθε
  choice: laissez-vous instruire
  rationale: Rend l’impératif à valeur passive ou moyenne et la dimension de formation du verbe, sans limiter son sens à une discipline punitive.
- source_word: τοῖς ῥήμασίν μου
  choice: par mes paroles
  rationale: « Par » exprime la valeur instrumentale du datif, tandis que « paroles » convient au contexte d’une exhortation prononcée.
- source_word: καὶ
  choice: et
  rationale: Conserve la coordination simple du grec sans expliciter davantage le rapport de conséquence.
- source_word: ὠφεληθήσεσθε
  choice: vous en tirerez profit
  rationale: Expression française courante qui rend le bénéfice annoncé par le futur grec; le pronom « en » renvoie naturellement à l’instruction reçue.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La tournure pronominale « laissez-vous instruire » préserve la nuance réceptive de l’impératif grec; « tirer profit » est employé au sens de recevoir un bienfait, non dans un sens commercial.
