revisions:
- from: Car penser à elle, c’est parvenir à la pleine intelligence, et celui qui veille à cause d’elle sera bientôt délivré de tout souci.
  to: Car penser à elle est la perfection de l’intelligence, et celui qui reste éveillé à cause d’elle sera bientôt sans souci.
