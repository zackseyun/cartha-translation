base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/015.yaml
  text: For thinking about her is the perfection of understanding, and the one who stays awake because of her will quickly be free from care.
translation:
  language: fr
  text: Car penser à elle est la perfection de l’intelligence, et celui qui reste éveillé à cause d’elle sera bientôt sans souci.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνθυμηθῆναι περὶ αὐτῆς
  choice: penser à elle
  rationale: Rend naturellement l’idée de porter la Sagesse à son esprit, sans surinterpréter le verbe.
- source_word: φρονήσεως τελειότης
  choice: parvenir à la pleine intelligence
  rationale: Exprime l’accomplissement ou la plénitude de l’intelligence dans un français naturel; la tournure « c’est parvenir » explicite la valeur prédicative de τελειότης.
- source_word: ὁ ἀγρυπνήσας
  choice: celui qui veille
  rationale: Conserve l’image de la vigilance éveillée et son aspect proverbial.
- source_word: δι' αὐτήν
  choice: à cause d’elle
  rationale: Préserve la valeur causale retenue par le grec dans ce contexte, plutôt que de la réduire à « pour elle ».
- source_word: ταχέως ἀμέριμνος ἔσται
  choice: sera bientôt délivré de tout souci
  rationale: Rend idiomatiquement la rapidité et l’état d’absence de souci exprimé par ἀμέριμνος.
theological_decisions:
- issue: Personnification féminine de la Sagesse
  choice: Maintien des pronoms féminins « elle »
  alternative: Répéter « la Sagesse »
  rationale: Le contexte personnifie la Sagesse au féminin; les pronoms conservent cette continuité sans ajouter d’identification doctrinale.
- issue: Lien entre vigilance et absence de souci
  choice: « à cause d’elle »
  alternative: « pour elle »
  rationale: La traduction conserve le rapport causal possible de διά avec l’accusatif et évite de présenter uniquement la Sagesse comme l’objet d’une quête.
translation_notes:
  register: Français moderne, digne et proverbial. La formulation reste accessible tout en conservant le parallélisme entre penser à la Sagesse et veiller à cause d’elle.
