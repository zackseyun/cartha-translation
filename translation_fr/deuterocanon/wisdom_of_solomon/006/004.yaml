base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/004.yaml
  text: because[a], though you were ministers of his kingdom, you did not judge rightly, nor keep the law[c][b], nor walk according to the counsel of God.
translation:
  language: fr
  text: Car, en tant que serviteurs[a] de son royaume, vous n’avez pas jugé avec droiture[b], ni observé la loi, ni marché selon le dessein de Dieu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « agents » ou « ministres ». Le grec désigne des subordonnés au service d’une autorité supérieure ; ici, les gouvernants sont considérés comme exerçant leur fonction sous l’autorité de Dieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « jugé justement » ou « jugé correctement ».
    reason: lexical_alternative
  - marker: c
    text: Ou « selon le conseil de Dieu », « selon le projet de Dieu » ou « conformément à la volonté de Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπηρέται
  choice: serviteurs
  rationale: Le terme désigne des subordonnés agissant sous l’autorité d’un supérieur. « Serviteurs » conserve cette relation de service et de dépendance envers Dieu; dans le contexte, il s’agit des gouvernants considérés comme agents de son règne.
- source_word: βασιλείας
  choice: royaume
  rationale: « Royaume » rend naturellement βασιλεία et peut évoquer à la fois l’autorité royale de Dieu et l’ordre soumis à cette autorité.
- source_word: ἐκρίνατε ὀρθῶς
  choice: vous n’avez pas jugé avec droiture
  rationale: Cette formulation exprime la rectitude attendue dans l’exercice du jugement sans réduire ὀρθῶς à la seule exactitude technique.
- source_word: ἐφυλάξατε νόμον
  choice: ni observé la loi
  rationale: Avec νόμος, φυλάσσω signifie naturellement respecter ou observer. « Observer la loi » est idiomatique en français et convient à la portée juridique et morale du contexte.
- source_word: κατὰ τὴν βουλὴν τοῦ θεοῦ
  choice: selon le dessein de Dieu
  rationale: βουλή peut désigner le conseil, le projet ou le dessein. « Dessein » conserve l’idée d’une intention délibérée sans la réduire à un simple souhait.
- source_word: ἐπορεύθητε
  choice: marché
  rationale: Le verbe signifie littéralement aller ou cheminer et prend ici une valeur éthique. « Marcher » conserve cette métaphore biblique de la conduite.
theological_decisions:
- issue: La fonction des gouvernants terrestres sous la souveraineté divine
  choice: Les gouvernants sont présentés comme des serviteurs exerçant une autorité subordonnée dans le royaume de Dieu.
  alternative: L’expression peut être comprise plus largement comme visant toute personne investie d’une autorité sous Dieu.
  rationale: Le contexte immédiat s’adresse aux rois et aux juges, tandis que ὑπηρέται souligne que leur autorité est dérivée et subordonnée. La traduction maintient cette idée sans développer une doctrine particulière des rapports entre pouvoir politique et religion.
- issue: Valeur circonstancielle de ὑπηρέται ὄντες
  choice: « bien que vous soyez »
  alternative: « étant les serviteurs »
  rationale: 'Le participe peut formellement décrire leur statut, mais le reproche crée une nette nuance concessive: malgré leur qualité de serviteurs du royaume de Dieu, ils ont failli à leurs devoirs. La formulation française rend cette relation sans modifier le contenu de l’accusation.'
translation_notes:
  register: Français international moderne, digne et accessible. « Serviteurs » évite le sens ecclésiastique que « ministres » pourrait suggérer aujourd’hui; les notes conservent les principales possibilités lexicales. Le parallélisme ternaire du grec est maintenu par « ni… ni… ».
