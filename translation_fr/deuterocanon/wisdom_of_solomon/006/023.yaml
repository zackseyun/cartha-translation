  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/023.yaml
  text: Nor indeed will I accompany wasting envy[a], because it will have no share in wisdom.
translation:
  language: fr
  text: Je ne ferai pas non plus route avec l’envie qui se consume[a], car elle n’aura aucune part à la sagesse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « Je ne fréquenterai pas non plus l’envieux qui se consume, car un tel homme n’aura aucune part à la sagesse. » Le grec peut personnifier l’envie elle-même ou désigner celui qu’elle habite.'
    reason: Ambiguïté lexicale et référentielle concernant l’envie qui « se consume » et le démonstratif οὗτος.
lexical_decisions:
- source_word: οὔτε μὴν
  choice: Je ne… pas non plus
  rationale: Rend la reprise négative légèrement appuyée du grec dans un français actuel et naturel.
- source_word: φθόνῳ
  choice: avec l’envie
  rationale: « Envie » désigne ici le vice qui consiste à voir avec déplaisir le bien d’autrui; il convient au contraste moral avec la sagesse.
- source_word: τετηκότι
  choice: qui se consume
  rationale: Le participe parfait de τήκω évoque ce qui fond, dépérit ou se consume. La proposition relative conserve cette image sans préciser abusivement si l’envie se détruit elle-même ou ronge celui qu’elle habite.
- source_word: συνοδεύσω
  choice: Je… ferai… route avec
  rationale: Conserve la métaphore concrète d’accompagner quelqu’un en chemin, tout en exprimant le refus de s’associer à l’envie.
- source_word: οὗτος
  choice: elle
  rationale: Le démonstratif masculin reprend naturellement φθόνος, masculin en grec. En français, la reprise grammaticale de « l’envie » exige le féminin, mais le contexte peut aussi personnifier l’envieux; cette ambiguïté est signalée en note.
- source_word: οὐ κοινωνήσει
  choice: n’aura aucune part à
  rationale: Exprime clairement l’absence future de participation indiquée par κοινωνέω.
- source_word: σοφίᾳ
  choice: la sagesse
  rationale: Équivalent français normal de σοφία dans ce livre et dans ce contraste moral.
theological_decisions:
- issue: Référent de οὗτος
  choice: Dans le texte principal, le pronom reprend l’envie personnifiée.
  alternative: Le démonstratif peut viser l’envieux, c’est-à-dire la personne dominée par l’envie.
  rationale: Le genre masculin du grec correspond grammaticalement à φθόνος et n’impose donc pas à lui seul un référent personnel. Comme la personnification de l’envie et l’allusion à l’envieux sont toutes deux plausibles, la traduction principale suit la reprise grammaticale immédiate et la note préserve l’autre lecture.
translation_notes:
  register: Français international moderne, digne et accessible. « Faire route avec » maintient l’image grecque de l’accompagnement sans archaïsme; « avoir part à » garde la nuance de participation propre à κοινωνέω.
