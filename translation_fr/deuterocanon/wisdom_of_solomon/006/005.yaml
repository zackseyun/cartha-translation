  revision_rationale: La révision rend explicitement la rapidité de ταχέως, évite de surinterpréter ἀπότομος et préserve l’ampleur sociale du participe substantivé. Elle maintient l’avertissement adressé directement au pluriel et la relation causale du grec, sans préciser davantage l’identité du sujet implicite ni imposer une lecture institutionnelle des « grands ».
