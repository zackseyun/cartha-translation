  source_fidelity: 'La première proposition doit conserver la rapidité de ταχέως : « soudaine » décrit surtout le caractère inattendu et ne rend pas directement l’adverbe. « Implacable » ajoute l’idée d’inexorabilité, qui dépasse ἀπότομος (« abrupt », « tranchant », « sévère »). « Les plus hautes fonctions » restreint indûment le participe οἱ ὑπερέχοντες à une fonction institutionnelle, alors qu’il désigne plus largement les personnes élevées par le rang ou le statut.'
  naturalness: La formulation révisée reste solennelle et naturelle en français international actuel. « Les grands » est une expression idiomatique qui rend le statut élevé sans imposer une catégorie exclusivement politique.
  terminology: « Jugement » rend κρίσις. « Sévère » rend de façon sûre ἀπότομος dans ce contexte, sans dupliquer l’idée de rapidité. « Frapper les grands » exprime naturellement le caractère de jugement qui advient à l’égard des personnes élevées, conformément au contexte d’avertissement.
  issues:
