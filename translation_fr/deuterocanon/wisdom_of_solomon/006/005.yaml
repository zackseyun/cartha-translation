- from: Il fondra sur vous d’une manière terrifiante et soudaine[a], car un jugement implacable s’exerce contre ceux qui occupent les plus hautes fonctions.
  to: Il viendra sur vous de manière terrifiante et rapide[a], car un jugement sévère frappe les grands.
