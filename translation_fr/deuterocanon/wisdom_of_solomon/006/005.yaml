  text: He will come upon you terribly and swiftly[a], because severe judgment comes upon those in high places.
translation:
  language: fr
  text: Il viendra sur vous de manière terrifiante et rapide[a], car un jugement sévère frappe les grands.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il se présentera devant vous de manière redoutable et prompte, car un jugement abrupt survient parmi les personnes élevées. »'
    reason: ἐπιστήσεται peut évoquer le fait de venir sur quelqu’un ou de se présenter ; ἀπότομος peut signifier « abrupt », « tranchant » ou « sévère » ; et ἐν τοῖς ὑπερέχουσιν peut se comprendre « parmi les personnes élevées ».
lexical_decisions:
- source_word: φρικτῶς
  choice: d’une manière terrifiante
  rationale: L’adverbe exprime l’effroi provoqué par cette intervention. Cette formulation en restitue clairement la force sans suggérer que Dieu lui-même éprouve de la peur.
- source_word: ταχέως
  choice: soudaine
  rationale: Dans la locution française « fondre sur », l’adjectif adverbial coordonné évoque une intervention qui survient promptement. « Soudaine » conserve aussi l’idée d’une arrivée inattendue.
- source_word: ἐπιστήσεται
  choice: Il fondra sur vous
  rationale: Le futur de ἐφίστημι peut signifier venir sur quelqu’un, se présenter ou se tenir auprès de lui. Dans ce contexte menaçant, « fondre sur » rend naturellement l’imminence et la force de la visitation, sans préciser qu’il s’agit d’une attaque militaire.
- source_word: κρίσις
  choice: jugement
  rationale: Le terme désigne ici l’acte judiciaire qui atteint les dirigeants, plutôt que la justice comme qualité abstraite.
- source_word: ἀπότομος
  choice: implacable
  rationale: L’adjectif peut signifier tranchant, abrupt ou sévère. « Implacable » exprime la rigueur sans répéter l’idée de rapidité déjà portée par ταχέως.
- source_word: ἐν τοῖς ὑπερέχουσιν
  choice: contre ceux qui occupent les plus hautes fonctions
  rationale: Le participe substantivé désigne ceux qui sont supérieurs par leur rang. Le contexte s’adresse aux gouvernants; cette traduction communique leur statut élevé sans réduire le propos à une catégorie politique plus étroite que le grec.
- source_word: γίνεται
  choice: s’exerce
  rationale: Le verbe signifie ici qu’un jugement a lieu ou intervient. « S’exerce contre » donne en français une formulation judiciaire naturelle tout en gardant le caractère événementiel.
theological_decisions:
- issue: Nature de l’intervention annoncée
  choice: Le verset avertit directement les détenteurs d’un rang élevé qu’une intervention divine terrifiante et prompte les soumettra à un jugement rigoureux.
  alternative: 'Le second membre peut aussi se lire comme une maxime générale: un jugement abrupt survient parmi les grands.'
  rationale: Le pluriel « vous » et le contexte adressé aux gouvernants favorisent l’avertissement direct, tandis que la formulation de la proposition causale conserve une portée générale.
translation_notes:
  register: Français international actuel, solennel mais accessible. « Les plus hautes fonctions » explicite le rang social ou politique impliqué par le contexte. Le pronom sujet « Il » conserve la continuité contextuelle avec Dieu, sans ajouter son nom au texte grec de ce verset.
