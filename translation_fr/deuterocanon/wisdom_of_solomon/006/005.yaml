    issue: « soudaine » pour ταχέως
    rationale: ταχέως signifie « rapidement, promptement ». Le français « soudaine » privilégie l’inattendu plutôt que la vitesse et ne reproduit donc pas avec assez de précision l’adverbe grec.
  - severity: medium
    issue: « implacable » pour ἀπότομος
    rationale: « Implacable » introduit l’idée d’un jugement auquel on ne peut échapper. ἀπότομος évoque plutôt ce qui est abrupt, tranchant ou sévère ; « sévère » est plus fidèle ici.
  - severity: low
    issue: « ceux qui occupent les plus hautes fonctions » pour οἱ ὑπερέχοντες
    rationale: Cette expression limite le référent à des titulaires de fonctions. Le grec vise les personnes élevées en rang ou en statut ; « les grands » conserve cette portée plus large.
  revised_text: Il viendra sur vous de manière terrifiante et rapide[a], car un jugement sévère frappe les grands.
