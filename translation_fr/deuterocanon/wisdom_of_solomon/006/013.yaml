  text: She hastens to make herself known to those who desire her[a].
translation:
  language: fr
  text: Elle devance ceux qui la désirent en se faisant connaître à eux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, « elle devance ceux qui désirent être connue d’avance ». Le grec est condensé : le texte exprime l’idée que la Sagesse prend les devants en se faisant connaître à ceux qui la désirent.'
    reason: ambiguïté syntaxique et alternative plus formelle
lexical_decisions:
- source_word: φθάνει
  choice: devance
  rationale: Le verbe signifie ici « arriver avant », « prendre les devants ». « Devance » conserve l’idée que la Sagesse prend l’initiative, sans réduire le terme au simple fait de se hâter.
- source_word: τοὺς ἐπιθυμοῦντας
  choice: ceux qui la désirent
  rationale: Le participe exprime un désir marqué. Le complément « la » est fourni par le contexte immédiat, où la Sagesse personnifiée est le sujet.
- source_word: προγνωσθῆναι
  choice: pour se faire connaître d’eux
  rationale: L’infinitif a formellement le sens d’« être connue d’avance ». La tournure retenue rend naturellement en français l’initiative de la Sagesse, tandis que la note conserve la formulation plus littérale et son ambiguïté.
theological_decisions:
- issue: Personnification féminine de la Sagesse
  choice: Conserver les pronoms féminins « elle » et « la »
  alternative: Employer une formulation impersonnelle pour la sagesse comme qualité abstraite
  rationale: Le contexte grec personnifie la Sagesse sous une figure féminine; la traduction préserve cette présentation littéraire et théologique.
- issue: Initiative de la Sagesse et forme passive de προγνωσθῆναι
  choice: Exprimer dans le texte principal que la Sagesse prend les devants pour se faire connaître
  alternative: 'Traduire formellement : « Elle devance ceux qui désirent être connus d’avance »'
  rationale: Le grec est très condensé et admet formellement l’autre construction. Le contexte favorise toutefois l’idée que la Sagesse se laisse trouver et connaître de ceux qui la désirent; l’alternative est signalée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, naturel et digne. « Devance » maintient la notion d’antériorité portée par le grec; « se faire connaître d’eux » évite une tournure passive obscure tout en laissant l’ambiguïté formelle accessible dans la note.
