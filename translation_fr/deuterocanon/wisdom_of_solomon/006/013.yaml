  source_fidelity: 'Le sens contextuel est bien celui de l’initiative de la Sagesse : φθάνει exprime qu’elle prend les devants, et προγνωσθῆναι, passif, signifie qu’elle est connue/reconnue d’avance par ceux qui la désirent. La formulation principale du projet va dans ce sens, mais « d’eux » est moins naturel ici et peut brouiller la relation exprimée.'
