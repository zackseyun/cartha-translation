base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/017.yaml
  text: For they will see the end of the wise man[a], and will not understand what the Lord planned concerning him[b], or for what purpose he made him secure.
translation:
  language: fr
  text: Car ils verront la fin du sage[a] et ne comprendront pas ce que le Seigneur a projeté à son sujet, ni dans quel but il l’a mis en sûreté[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la mort du sage ». Le grec τελευτή peut signifier « fin » ou « mort » ; « fin » conserve ici un sens plus large.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’a mis à l’abri » ou « l’a protégé ». Le grec ne précise pas la nature de cette sûreté.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: ils verront
  rationale: Le futur simple rend directement le futur grec et exprime naturellement la perception de ce qui arrivera au sage.
- source_word: τελευτὴν
  choice: la fin
  rationale: 'τελευτή peut désigner la fin ou la mort. « La fin » conserve l’amplitude du grec et l’ironie du contexte : les observateurs voient une mort apparente sans saisir l’issue voulue par Dieu.'
- source_word: σοφοῦ
  choice: du sage
  rationale: Le substantif adjectival masculin singulier désigne ici l’homme sage; « du sage » est idiomatique, digne et fidèle à la forme grecque.
- source_word: οὐ νοήσουσιν
  choice: ils ne comprendront pas
  rationale: νοέω exprime ici l’incapacité à saisir le sens de ce qui est vu; « comprendre » est clair en français actuel.
- source_word: ἐβουλεύσατο
  choice: a projeté
  rationale: Le moyen de βουλεύω renvoie à l’intention délibérée du Seigneur. « A projeté » préserve l’idée de dessein sans imposer davantage de précisions.
- source_word: περὶ αὐτοῦ
  choice: à son sujet
  rationale: Cette expression rend naturellement περί avec le génitif au sens de « concernant ».
- source_word: εἰς τί
  choice: en vue de quoi
  rationale: La formulation conserve la valeur orientée vers une fin ou un but, ainsi que la légère indétermination de l’expression grecque.
- source_word: ἠσφαλίσατο
  choice: il l’a placé en sûreté
  rationale: Cette traduction garde la nuance causative de ἀσφαλίζω tout en laissant implicite la nature exacte de la sûreté accordée.
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: Traduction française habituelle et naturelle de κύριος avec l’article dans ce contexte.
theological_decisions:
- issue: Portée de τελευτή par rapport à la mort du sage
  choice: « la fin »
  alternative: « la mort » ou « l’issue »
  rationale: Le contexte immédiat évoque la mort du juste, mais le contraste porte aussi sur l’issue divine que les observateurs ne comprennent pas. « La fin » maintient ces deux dimensions.
- issue: Nature de la sûreté exprimée par ἠσφαλίσατο αὐτόν
  choice: « il l’a placé en sûreté »
  alternative: « il l’a protégé », « il l’a gardé en sécurité » ou « il l’a affermi »
  rationale: Le grec ne précise pas s’il s’agit d’une protection physique, morale ou eschatologique. La formulation retenue préserve cette tension face à la mort apparente.
translation_notes:
  register: Français international moderne, sobre et digne. La coordination négative « ni » rend naturellement le second élément grec, tandis que « en vue de quoi » conserve sa valeur téléologique sans la rendre trop explicite.
