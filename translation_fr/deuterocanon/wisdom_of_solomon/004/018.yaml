  text: They will see and will despise[b][a], but the Lord will laugh at them.
translation:
  language: fr
  text: Ils verront et mépriseront, mais le Seigneur se moquera d’eux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « rira d’eux »; le verbe grec comporte une nuance de dérision.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: Ils verront
  rationale: Le futur de ὁράω exprime ici simplement l’action de voir; cette formulation directe n’ajoute aucune nuance absente du grec.
- source_word: ἐξουδενήσουσιν
  choice: mépriseront
  rationale: Le verbe signifie tenir pour rien, traiter avec dédain ou mépriser. « Mépriseront » est naturel, concis et conserve la force du grec.
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: Dans ce contexte sapientiel, κύριος désigne Dieu; « le Seigneur » en conserve la portée théologique et la formulation traditionnelle.
- source_word: ἐκγελάσεται
  choice: se moquera d’eux
  rationale: Le verbe exprime un rire dirigé contre quelqu’un, avec une nuance de dérision. « Se moquera d’eux » rend cette force plus nettement que le simple « rira d’eux ».
theological_decisions:
- issue: Désignation de Dieu par κύριος
  choice: le Seigneur
  alternative: le maître
  rationale: Le contexte présente Dieu face à ceux qui méprisent; « le Seigneur » est donc le sens approprié sans ajouter de précision doctrinale.
- issue: Caractère anthropomorphique et dérisoire de ἐκγελάσεται
  choice: se moquera d’eux
  alternative: rira d’eux
  rationale: Le texte attribue au Seigneur une réaction de dérision. La traduction la conserve sans l’atténuer ni l’expliquer théologiquement.
translation_notes:
  register: Français moderne, international et digne. La coordination brève et le contraste marqué par « mais » suivent la structure du grec. Le pronom sujet du premier membre demeure volontairement non explicité, comme dans le verset source.
