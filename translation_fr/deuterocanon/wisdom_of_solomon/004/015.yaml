review_pass:
  verdict: revise
  source_fidelity: Le premier membre est globalement fidèle. Dans le second, « sa sollicitude veille sur » transforme le substantif grec ἐπισκοπή en proposition verbale et explicite davantage l’idée de protection active. La révision rétablit le parallélisme nominal et conserve, par la note, la portée de « sollicitude » (visite, inspection, surveillance ou soin attentif).
  naturalness: La formulation révisée reste naturelle, concise et digne en français international moderne. Le parallélisme « la grâce et la miséricorde …, et la sollicitude … » reflète efficacement la structure grecque.
  terminology: « Grâce », « miséricorde » et « élus » rendent précisément les termes grecs sans surcharge confessionnelle. « Fidèles » est un équivalent moderne recevable de ὅσιοι dans ce contexte; la note signale « saints » comme rendu plus littéral. « Sollicitude » convient au contexte favorable tout en nécessitant une note pour préserver l’ambiguïté lexicale de ἐπισκοπή.
  issues:
  - severity: medium
    issue: Le second membre paraphrase et déplace la structure nominale du grec.
    rationale: « Sa sollicitude veille sur ceux qui lui sont fidèles » ajoute le verbe « veille » et fait de la sollicitude un agent actif, alors que le grec coordonne simplement ἐπισκοπή avec grâce et miséricorde. Une formulation nominale est à la fois plus fidèle et plus équilibrée.
  - severity: low
    issue: La note qualifie de littérale une expression qui ne l’est pas entièrement.
    rationale: « une visite parmi ses saints » est une aide de traduction, non une littéralité stricte et complète de ἐπισκοπή ἐν τοῖς ὁσίοις αὐτοῦ. La note doit présenter les options lexicales sans cette étiquette imprécise.
  revised_text: Car la grâce et la miséricorde sont pour ses élus, et sa sollicitude pour ses fidèles[a].
