  text: For grace and mercy are upon his chosen ones[a], and visitation upon his holy ones.
translation:
  language: fr
  text: Car la grâce et la miséricorde sont pour ses élus, et sa sollicitude pour ses fidèles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec traduit par « sollicitude » peut aussi désigner une visite, une inspection, une surveillance ou des soins attentifs. « Ses fidèles » peut aussi se rendre par « ses saints » ou « ses pieux ». Dans ce contexte, le parallèle avec la grâce et la miséricorde évoque une attention bienveillante de Dieu.
    reason: Préserver l’ambiguïté de ἐπισκοπή et la nuance de ὅσιοι sans transformer le second membre en une affirmation plus précise que le grec.
lexical_decisions:
- source_word: χάρις
  choice: grâce
  rationale: « Grâce » rend directement le nom grec et conserve son poids théologique dans le parallèle avec « miséricorde ».
- source_word: ἔλεος
  choice: miséricorde
  rationale: Équivalent précis et naturel dans le contexte de la bienveillance divine.
- source_word: ἐκλεκτοῖς
  choice: ceux qu’il a choisis
  rationale: Cette formulation française courante exprime l’élection sans employer le terme plus technique « élus ».
- source_word: ἐπισκοπή
  choice: sollicitude
  rationale: Le terme grec peut désigner une visite, une inspection, une surveillance ou des soins attentifs. Le parallèle positif avec la grâce et la miséricorde favorise ici l’idée de sollicitude, sans effacer l’éventail lexical signalé en note.
- source_word: ὁσίοις
  choice: ceux qui lui sont fidèles
  rationale: Dans ce contexte, le terme désigne des personnes pieuses, saintes ou fidèles. Cette formulation moderne évite les connotations ecclésiastiques de « saints » et exprime leur relation à Dieu.
- source_word: ἐν
  choice: sur
  rationale: Dans le premier membre, « sur » rend idiomatiquement la grâce et la miséricorde présentes et agissantes à l’égard des personnes choisies.
theological_decisions:
- issue: Sens de l’intervention divine exprimée par ἐπισκοπή
  choice: sollicitude divine bienveillante
  alternative: visite, surveillance ou inspection divine, éventuellement liée au jugement
  rationale: Le parallélisme immédiat avec « grâce et miséricorde » indique une action favorable. La note préserve toutefois l’amplitude du mot grec au lieu d’exclure ses autres nuances.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme grec est conservé, avec une légère explicitation verbale dans le second membre pour obtenir une phrase naturelle.
