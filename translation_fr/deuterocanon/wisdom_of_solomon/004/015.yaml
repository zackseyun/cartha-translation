revisions:
- from: Car la grâce et la miséricorde sont sur ceux qu’il a choisis, et sa sollicitude veille sur ceux qui lui sont fidèles[a].
  to: Car la grâce et la miséricorde sont pour ses élus, et sa sollicitude pour ses fidèles[a].
  rationale: La révision maintient le sens favorable indiqué par le parallélisme tout en rétablissant la construction nominale du texte grec. Elle évite d’ajouter l’action explicite de « veiller sur » et corrige la formulation de la note afin qu’elle distingue clairement les possibilités lexicales de la traduction retenue.
