  text: But the righteous man[a], if he dies early, will be at rest.
translation:
  language: fr
  text: Mais le juste, même s’il meurt prématurément[a], trouvera le repos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « s’il parvient à mourir »; l’expression grecque signifie probablement qu’il meurt jeune ou avant le terme attendu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιος
  choice: le juste
  rationale: Adjectif substantivé au masculin singulier, désignant une personne caractérisée par la justice. « Le juste » est naturel, digne et fidèle sans alourdir par « l’homme juste ».
- source_word: ἐὰν
  choice: même si
  rationale: La construction est formellement conditionnelle, mais le contraste introduit par δέ et le propos du passage lui donnent ici une valeur concessive naturelle en français.
- source_word: φθάσῃ τελευτῆσαι
  choice: meurt prématurément
  rationale: L’association de φθάνω et de l’infinitif τελευτῆσαι évoque le fait de parvenir à la mort avant le terme normalement attendu. Cette traduction restitue l’idiome plutôt qu’un calque obscur.
- source_word: ἐν ἀναπαύσει ἔσται
  choice: trouvera le repos
  rationale: Formulation française idiomatique exprimant l’état futur de repos sans préciser davantage sa nature métaphysique.
theological_decisions:
- issue: La nature du repos promis au juste mort prématurément
  choice: trouvera le repos
  alternative: sera en paix
  rationale: Le grec affirme un état de repos sans en définir explicitement les modalités eschatologiques. « Trouvera le repos » conserve la consolation et l’ouverture théologique du texte.
- issue: Valeur conditionnelle ou concessive de ἐὰν
  choice: même s’il
  alternative: s’il
  rationale: Dans le contexte, la mort prématurée du juste ne réfute pas son sort bienheureux; la tournure concessive rend clairement cette tension sans modifier le fond de l’énoncé.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation évite le calque grec tout en conservant le contraste entre mort prématurée et repos du juste.
