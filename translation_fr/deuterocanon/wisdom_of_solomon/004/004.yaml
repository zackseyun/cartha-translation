  text: For even if it puts forth shoots for a time in its branches[a], standing insecurely it will be shaken by the wind[b], and by the force of the winds it will be uprooted.
translation:
  language: fr
  text: Car même s’il pousse quelque temps parmi les branches[a], précairement établi, il sera ébranlé par le vent[b] et déraciné par la violence des vents.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bourgeonne » ou « produit de nouvelles pousses pendant un temps » ; le grec évoque une croissance végétale nouvelle, mais passagère.
    reason: lexical_alternative
  - marker: b
    text: Le pronom « il » prolonge la métaphore végétale du verset précédent sans en nommer explicitement le référent.
    reason: cross_reference
lexical_decisions:
- source_word: κἂν
  choice: même si
  rationale: La contraction de καὶ ἐάν introduit une concession hypothétique, rendue naturellement en français par « même si ».
- source_word: ἐν κλάδοις
  choice: dans ses branches
  rationale: Cette formulation conserve l’image végétale; le possessif, implicite dans le rapport entre la plante et ses branches, rend la phrase naturelle en français.
- source_word: πρὸς καιρόν
  choice: quelque temps
  rationale: L’expression indique une durée limitée et passagère.
- source_word: ἀναθάλῃ
  choice: reverdit
  rationale: Le verbe évoque une nouvelle croissance végétale; « reverdit » garde cette image de façon concise et idiomatique.
- source_word: ἐπισφαλῶς βεβηκότα
  choice: mal affermi
  rationale: Le participe parfait décrit ce qui se tient ou s’est établi, tandis que l’adverbe en souligne la précarité; « mal affermi » exprime ensemble ces deux éléments.
- source_word: σαλευθήσεται
  choice: sera ébranlé
  rationale: Le futur passif exprime la déstabilisation causée par le vent; « ébranlé » convient à une plante insuffisamment enracinée.
- source_word: ὑπὸ βίας ἀνέμων
  choice: par la violence des vents
  rationale: Cette traduction conserve le substantif βία et l’intensification apportée par le pluriel « vents ».
- source_word: ἐκριζωθήσεται
  choice: sera déraciné
  rationale: Le verbe signifie arracher avec les racines; « déraciner » préserve exactement la métaphore végétale.
theological_decisions:
- issue: Référent du sujet singulier implicite, repris de la métaphore végétale du verset précédent
  choice: Employer le pronom « il » sans nommer explicitement le référent
  alternative: Préciser « l’enfant », « le rejeton » ou « les descendants »
  rationale: Les formes grecques sont au singulier et prolongent l’image végétale sans répéter un nom. Le pronom français préserve cette continuité et évite d’imposer une identification absente du verset.
translation_notes:
  register: 'Français international moderne, digne et accessible. La phrase conserve la progression de l’image: croissance temporaire, stabilité précaire, ébranlement, puis déracinement.'
