  source_fidelity: 'Le sens général est bien conservé : croissance végétale temporaire, position instable, ébranlement par le vent et déracinement. Toutefois, « reverdit » suggère plus précisément le retour au vert et risque d’affaiblir l’idée de pousse ou de floraison exprimée par ἀναθάλῃ. « Précairement établi » rend plus directement ἐπισφαλῶς βεβηκότα, qui décrit un état de stabilité trompeuse ou fragile.'
