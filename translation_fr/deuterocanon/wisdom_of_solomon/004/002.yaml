base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/002.yaml
  text: When she is present[a], they imitate her, and they long for her when she has gone; and through the age she marches in triumph, wearing a victor’s wreath, having won the contest of the undefiled prizes.
translation:
  language: fr
  text: Quand elle est présente, ils l’imitent ; quand elle est partie, ils la désirent. À travers les âges[a], elle défile en triomphe, portant une couronne de vainqueur, après avoir remporté le combat pour des prix sans souillure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour toujours ». L’expression grecque signifie littéralement « dans l’âge » et peut évoquer un renom durable ou perpétuel.
    reason: alternative lexicale pour ἐν τῷ αἰῶνι
lexical_decisions:
- source_word: παροῦσάν … ἀπελθοῦσαν
  choice: Quand elle est présente … quand elle s’en est allée
  rationale: Cette formulation naturelle conserve l’opposition temporelle entre sa présence et son départ accompli, ainsi que la personnification féminine de la vertu dans le contexte.
- source_word: μιμοῦνται
  choice: on l’imite
  rationale: « Imiter » rend directement le verbe grec. Le pronom indéfini « on » convient au sujet implicite pluriel sans introduire un groupe absent du texte.
- source_word: ποθοῦσιν
  choice: on la regrette
  rationale: Dans le contexte d’une personne qui s’en est allée, « regretter » exprime naturellement le désir suscité par son absence. « On aspire à la retrouver » serait plus explicite, mais plus interprétatif.
- source_word: ἐν τῷ αἰῶνι
  choice: À travers les siècles
  rationale: Cette expression française évoque une renommée durable tout en évitant de transformer automatiquement αἰών en affirmation technique sur l’éternité. Une autre lecture est signalée en note.
- source_word: στεφανηφοροῦσα πομπεύει
  choice: elle défile en triomphe, couronnée
  rationale: La traduction maintient l’image d’une procession publique de victoire et de la couronne portée par le vainqueur.
- source_word: τὸν τῶν ἀμιάντων ἄθλων ἀγῶνα νικήσασα
  choice: après avoir remporté la lutte pour des prix sans souillure
  rationale: « Après avoir remporté » marque l’antériorité de la victoire sur le cortège. « Lutte » et « prix » préservent ensemble l’image du concours, tandis que « sans souillure » conserve la portée morale de ἀμιάντων.
theological_decisions:
- issue: Référent des formes féminines
  choice: Maintenir la personnification par « elle » et « la »
  alternative: Remplacer les pronoms par « la vertu » ou par une abstraction plus générale
  rationale: Le grec poursuit la personnification féminine issue du contexte immédiat. Répéter explicitement « la vertu » dans ce verset ajouterait un nom absent du texte.
- issue: Portée de ἐν τῷ αἰῶνι
  choice: « À travers les siècles », au sens d’un triomphe et d’un renom durables
  alternative: « Pour toujours » ou « dans l’éternité »
  rationale: αἰών peut désigner une longue durée, un âge ou l’éternité. Le texte principal conserve cette amplitude sans imposer une lecture métaphysique précise, et la note présente l’alternative.
- issue: Rapport entre ἀμιάντων, ἄθλων et ἀγῶνα
  choice: 'Comprendre ἀμιάντων comme qualifiant les prix : « la lutte pour des prix sans souillure »'
  alternative: Comprendre l’expression comme « la lutte des récompenses réservées aux êtres sans souillure »
  rationale: L’accord grammatical rattache naturellement ἀμιάντων à ἄθλων. La traduction préserve toutefois la tension entre pureté morale et image athlétique sans préciser en quoi consiste la récompense.
translation_notes:
  register: 'Français international moderne, digne et accessible. La ponctuation en deux phrases allège la longue période grecque sans rompre sa progression : présence, absence, puis victoire durable. Le vocabulaire de la lutte, des prix, de la couronne et du cortège conserve le réseau d’images athlétiques et triomphales.'
