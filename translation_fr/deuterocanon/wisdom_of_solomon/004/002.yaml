review_pass:
  verdict: revise
  source_fidelity: La structure temporelle, la personnification féminine et le réseau d’images athlétiques sont bien rendus. Toutefois, « on la regrette » atténue et déplace ποθοῦσιν (« ils désirent / aspirent à »), qui exprime un désir actif plutôt que le seul regret. Le pluriel explicite rend aussi plus directement le sujet grec.
  naturalness: La révision reste en français international moderne et conserve une période fluide. « Quand elle est partie, ils la désirent » est plus fidèle que « on la regrette », tout en demeurant naturel dans la personnification littéraire du contexte.
  terminology: « Défile en triomphe », « portant une couronne de vainqueur », « combat » et « prix sans souillure » conservent l’imagerie de procession victorieuse et de concours. « À travers les âges » rend prudemment ἐν τῷ αἰῶνι; la note maintient l’alternative plus pérenne sans imposer « éternité ».
  issues:
  - severity: medium
    issue: « on la regrette » pour ποθοῦσιν
    rationale: Regretter quelqu’un après son départ peut être contextuellement proche, mais le grec exprime le désir ardent ou l’aspiration. « Ils la désirent » préserve mieux la force lexicale et évite de réduire le sens à la nostalgie.
  - severity: low
    issue: Sujet indéfini « on »
    rationale: Le grec a un pluriel explicite. « Ils » est tout aussi naturel et conserve plus clairement le sujet pluriel, sans identifier ce groupe au-delà du contexte.
