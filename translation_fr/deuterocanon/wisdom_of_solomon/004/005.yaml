  source_fidelity: 'Le sens de l’image agricole est globalement bien rendu : futur passif, branches, fruit inutile, absence de maturité et impropriété à tout usage. « Inachevées » appliqué directement à des branches est toutefois peu idiomatique en français et risque de faire comprendre des branches matériellement non finies plutôt que des branches qui n’ont pas atteint leur développement.'
  naturalness: La phrase est claire, mais « branches inachevées » est maladroit dans un français moderne, et « bon à rien », bien que compréhensible, est plus familier et s’emploie volontiers à propos de personnes. « Impropre à tout usage » conserve la force cumulative du grec dans un registre plus digne.
