base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/005.yaml
  text: Unfinished branches will be broken off[a], and their fruit is useless, unripe for eating and fit for nothing[b];
translation:
  language: fr
  text: Des branches qui n’ont pas achevé leur croissance seront brisées[a], et leur fruit sera inutile, trop vert pour être mangé[b] et impropre à tout usage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des branches immatures » ; le terme grec peut désigner ce qui n’est pas parvenu à son plein développement.
    reason: lexical_alternative
  - marker: b
    text: Ou « venu trop tôt pour être mangé ». À propos d’un fruit, « trop vert » rend naturellement l’image.
    reason: lexical_alternative
lexical_decisions:
- source_word: περικλασθήσονται
  choice: seront brisées
  rationale: Le futur passif annonce ce qui arrivera aux branches. « Seront brisées » garde la voix passive et rend naturellement l’image, sans imposer l’idée plus précise qu’elles seraient détachées.
- source_word: κλῶνες
  choice: branches
  rationale: C’est le sens botanique courant et le terme français le plus naturel dans cette image.
- source_word: ἀτέλεστοι
  choice: inachevées
  rationale: Le mot désigne ce qui n’est pas arrivé à son accomplissement. « Inachevées » conserve cette idée, tout en laissant possible la nuance de branches insuffisamment développées.
- source_word: καρπὸς
  choice: fruit
  rationale: Le sens agricole littéral maintient l’image du texte grec.
- source_word: ἄχρηστος
  choice: inutile
  rationale: Le terme exprime l’absence d’utilité; « inutile » est direct et courant.
- source_word: ἄωρος
  choice: trop vert
  rationale: À propos d’un fruit destiné à être mangé, l’expression française « trop vert » rend naturellement l’idée d’un fruit qui n’est pas mûr ou qui est venu avant son temps.
- source_word: εἰς βρῶσιν
  choice: pour être mangé
  rationale: Cette formulation exprime clairement la destination alimentaire du fruit.
- source_word: εἰς οὐδὲν ἐπιτήδειος
  choice: bon à rien
  rationale: Cette expression idiomatique rend avec force l’idée de n’être propre ou approprié à aucun usage.
theological_decisions:
- issue: Portée métaphorique de l’image agricole dans le contexte
  choice: Conserver littéralement les branches et leur fruit sans expliciter leur référent humain.
  alternative: Remplacer ou développer l’image par une référence explicite à la descendance des impies.
  rationale: Le contexte permet de comprendre l’application à la descendance, mais ce verset formule cette réalité sous une image agricole. La traduction maintient donc l’image et laisse le contexte en fournir l’interprétation.
translation_notes:
  register: Français international moderne, clair et digne. La structure coordonnée du grec et son image agricole sont conservées; les expressions « trop vert » et « bon à rien » assurent une lecture naturelle sans atténuer le jugement du verset.
