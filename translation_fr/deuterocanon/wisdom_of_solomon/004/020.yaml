base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/020.yaml
  text: They will come in fear[a], reasoning over their sins[b], and their lawless deeds will convict them to their face.
translation:
  language: fr
  text: Ils viendront, saisis de peur, en réfléchissant à leurs péchés, et leurs actes contraires à la loi se dresseront contre eux et les confondront.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεύσονται
  choice: Ils viendront
  rationale: Le futur de ἔρχομαι exprime simplement leur venue ou leur comparution; « viendront » reste naturel et sobre.
- source_word: ἐν συλλογισμῷ ἁμαρτημάτων αὐτῶν
  choice: en réfléchissant à leurs péchés
  rationale: συλλογισμός désigne ici une réflexion ou un raisonnement intérieur portant sur leurs fautes; cette formulation conserve la dimension cognitive sans ajouter explicitement le remords.
- source_word: δειλοί
  choice: saisis de peur
  rationale: L’adjectif prédicatif décrit leur état ou leur manière de venir. « Saisis de peur » rend naturellement la crainte et la timidité honteuse, sans imposer le jugement plus appuyé de « lâches ».
- source_word: ἐλέγξει
  choice: les confondront
  rationale: ἐλέγχω évoque la mise en évidence de la faute, la réfutation ou la conviction. « Confondre » convient au cadre moral et quasi judiciaire où leurs propres actes établissent leur culpabilité.
- source_word: ἐξ ἐναντίας
  choice: en face
  rationale: L’expression indique une confrontation directe, depuis une position opposée; « en face » en conserve l’image sans paraphrase excessive.
- source_word: τὰ ἀνομήματα αὐτῶν
  choice: leurs actes contraires à la loi
  rationale: Cette expression rend explicitement la notion de transgression de la loi portée par ἀνόμημα et la distingue de ἁμαρτήματα, « péchés ».
theological_decisions:
- issue: Rapport entre ἁμαρτήματα et ἀνομήματα
  choice: Maintenir la distinction par « péchés » et « actes contraires à la loi ».
  alternative: Traduire les deux termes par « péchés » ou rendre le second par « fautes » / « iniquités ».
  rationale: Le grec emploie deux termes moraux apparentés mais distincts. Les conserver séparés respecte la progression entre leur réflexion intérieure sur leurs péchés et l’accusation objective portée par leurs actes transgressifs.
- issue: Force judiciaire de ἐλέγξει
  choice: « les confondront »
  alternative: « les accuseront », « les convaincront de faute » ou « les démasqueront ».
  rationale: Le verbe garde à la fois l’idée d’exposition et celle de culpabilité établie, sans préciser un tribunal ni développer ce que le texte laisse implicite.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du mouvement grec tout en évitant des tours peu naturels comme « dans un raisonnement de leurs péchés ». Aucun marqueur de note n’est nécessaire.
