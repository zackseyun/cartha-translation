  verdict: revise
  source_fidelity: 'Le sens des quatre segments grecs est bien rendu : la complaisance envers Dieu, l’amour reçu, la vie au milieu des pécheurs et le transfert/retrait final. Toutefois, « Étant devenu » présente l’action comme simultanée, alors que le participe aoriste γενόμενος est antérieur à ἠγαπήθη ; « Devenu » rend cette antériorité plus exactement.'
  naturalness: Le français est globalement naturel et d’un registre biblique moderne. « Devenu agréable à Dieu » est plus fluide et plus idiomatique en tête de phrase que « Étant devenu agréable à Dieu ».
  terminology: « Agréable à Dieu », « aimé », « pécheurs » et « fut enlevé » sont recevables. « Fut enlevé » conserve, avec la note, l’ambivalence de μετετέθη sans décider entre décès, retrait providentiel et enlèvement extraordinaire. « Parmi les pécheurs » exprime naturellement en français la catégorie générique du grec μεταξὺ ἁμαρτωλῶν.
