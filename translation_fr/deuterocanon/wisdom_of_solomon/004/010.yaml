  text: Having become pleasing to God[a], he was loved; and while living among sinners, he was taken away.
translation:
  language: fr
  text: Devenu agréable à Dieu, il fut aimé ; alors qu’il vivait parmi les pécheurs, il fut enlevé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « retiré » ou « transféré ». Le grec laisse ouverte la question de savoir si l’accent porte sur une mort précoce, sur le retrait divin d’un milieu corrompu ou sur un enlèvement comparable à celui d’Hénoc.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐάρεστος τῷ θεῷ γενόμενος
  choice: Étant devenu agréable à Dieu
  rationale: Cette formulation conserve l’idée exprimée par l’adjectif εὐάρεστος, « agréable » ou « qui plaît », ainsi que l’antériorité suggérée par le participe aoriste γενόμενος, sans réduire l’expression à un simple état permanent.
- source_word: ἠγαπήθη
  choice: il fut aimé
  rationale: Le passif grec signifie directement « il fut aimé ». Le contexte immédiat permet de comprendre que Dieu est l’agent sans devoir l’ajouter explicitement.
- source_word: ζῶν μεταξὺ ἁμαρτωλῶν
  choice: alors qu’il vivait parmi des pécheurs
  rationale: Le participe présent ζῶν exprime une situation contemporaine de l’action principale. « Parmi des pécheurs » restitue simplement le groupe substantivé ἁμαρτωλῶν.
- source_word: μετετέθη
  choice: il fut enlevé
  rationale: « Fut enlevé » rend l’idée de déplacement ou de retrait tout en laissant ouverte la question de savoir s’il s’agit d’une mort précoce, d’un retrait providentiel ou d’un enlèvement comparable à celui d’Hénoc.
theological_decisions:
- issue: 'Nature de μετετέθη : mort ou enlèvement divin'
  choice: il fut enlevé
  alternative: il fut retiré ; il fut transféré
  rationale: Le verbe grec peut désigner un transfert ou un retrait et peut évoquer, dans l’usage biblique, un enlèvement divin. La traduction ne tranche donc pas entre la mort du juste et une intervention extraordinaire de Dieu.
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple donne au verset une tonalité narrative soutenue sans archaïsme marqué. Le point-virgule maintient le parallélisme des deux propositions grecques.
