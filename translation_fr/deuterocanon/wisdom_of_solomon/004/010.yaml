    issue: Valeur temporelle de « Étant devenu »
    rationale: Le présent participe français suggère normalement la concomitance. Le participe aoriste grec γενόμενος situe le fait d’être devenu agréable à Dieu avant « il fut aimé » ; « Devenu » conserve mieux cette relation.
  - severity: low
    issue: Article dans « parmi des pécheurs »
    rationale: Le grec emploie un substantif adjectival pluriel sans article, employé de façon générique. En français, « parmi les pécheurs » est la formulation idiomatique pour ce groupe moralement caractérisé, sans individualiser un sous-groupe indéfini.
