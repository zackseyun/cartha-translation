base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/019.yaml
  text: And after this they will become a dishonored corpse and a reproach among the dead forever[a]. For he will dash them down headlong and speechless, and shake them from their foundations; they will be laid waste to the uttermost, and they will be in pain[b], and their memory will perish.
translation:
  language: fr
  text: Après cela, ils deviendront un cadavre sans honneur, un objet de mépris parmi les morts pour toujours[a]. Car il[b] les précipitera, muets, la face contre terre, et les ébranlera jusque dans leurs fondations. Ils seront entièrement dévastés et plongés dans la douleur, et leur souvenir disparaîtra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un corps tombé et sans honneur » ; le grec πτῶμα peut désigner un corps tombé, voire un cadavre, et souligne ici la honte de leur fin.
    reason: lexical_alternative
  - marker: b
    text: Le sujet de « précipitera » et d’« ébranlera » reste implicite en grec. Dans le contexte, il s’agit de Dieu exerçant son jugement, bien que son nom ne soit pas répété dans ce verset.
    reason: alternative_reading
lexical_decisions:
- source_word: πτῶμα
  choice: cadavre
  rationale: Dans ce contexte de mort et de jugement, le mot désigne concrètement un corps tombé, donc un cadavre, plutôt que la seule idée abstraite d’une chute.
- source_word: ἄτιμον
  choice: déshonoré
  rationale: Ce terme exprime la privation d’honneur et la honte attachée à leur fin.
- source_word: ὕβριν
  choice: un objet de mépris
  rationale: La tournure française rend ici le statut honteux et méprisable qui sera le leur parmi les morts, plutôt qu’un acte ponctuel d’insulte.
- source_word: ἐν νεκροῖς
  choice: parmi les morts
  rationale: Avec un pluriel désignant des personnes, ἐν indique naturellement leur place au milieu des morts.
- source_word: διʼ αἰῶνος
  choice: pour toujours
  rationale: Dans ce contexte de jugement durable et de disparition du souvenir, cette formulation restitue clairement la portée temporelle de l’expression.
- source_word: ῥήξει
  choice: précipitera
  rationale: Le verbe évoque une action violente qui jette ou abat; associé à πρηνεῖς, «précipitera» exprime bien le mouvement brutal vers le sol.
- source_word: ἀφώνους
  choice: muets
  rationale: Le mot peut signifier privés de voix ou réduits au silence; «muets» conserve cette concision et cette ambiguïté.
- source_word: πρηνεῖς
  choice: la face contre terre
  rationale: Cette expression française rend directement la posture couchée face au sol, avec l’humiliation et la violence de la chute.
- source_word: σαλεύσει
  choice: ébranlera
  rationale: Le verbe indique une secousse ou une déstabilisation violente; «ébranlera» maintient cette image.
- source_word: ἐκ θεμελίων
  choice: jusque dans leurs fondations
  rationale: Cette tournure idiomatique en français exprime une déstabilisation qui atteint la base même, tout en conservant la métaphore des fondations.
- source_word: ἕως ἐσχάτου
  choice: entièrement
  rationale: L’expression marque ici l’extrême degré et la totalité; «entièrement» en restitue le sens sans archaïsme.
- source_word: χερσωθήσονται
  choice: seront dévastés
  rationale: Le verbe évoque la mise en friche, la stérilité ou la désolation; appliqué ici aux personnes, «dévastés» préserve la force métaphorique.
- source_word: ἡ μνήμη αὐτῶν ἀπολεῖται
  choice: leur souvenir disparaîtra
  rationale: La formulation rend naturellement en français la perte complète de leur mémoire parmi les vivants.
theological_decisions:
- issue: Sujet implicite des verbes de jugement
  choice: Conserver le pronom «il» sans nommer explicitement son référent
  alternative: Écrire explicitement «Dieu les précipitera» ou employer une tournure impersonnelle
  rationale: Les formes grecques ῥήξει et σαλεύσει ont un sujet masculin singulier implicite. Le contexte renvoie à Dieu, mais le verset ne répète pas son nom; le pronom préserve cette retenue du texte source.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’image collective et singulière du «cadavre», la violence des verbes de jugement et le sujet divin implicite, sans explicitation confessionnelle.
