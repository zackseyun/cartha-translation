  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/006.yaml
  text: For children born from lawless unions are witnesses of their parents’ wickedness at their examination[a][b][c].
translation:
  language: fr
  text: Car les enfants nés d’unions contraires à la loi témoignent de la méchanceté de leurs parents lors de l’examen[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « nés de lits contraires à la loi » ; le grec emploie une périphrase pour désigner des relations sexuelles illicites.'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi comprendre : « témoignent contre leurs parents de leur méchanceté ».'
    reason: alternative_reading
  - marker: c
    text: Le grec porte littéralement « lors de leur examen ». Le pronom peut renvoyer aux enfants ou aux parents ; la formulation du texte laisse ce point ouvert.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνόμων ὕπνων
  choice: d’unions contraires à la loi
  rationale: Littéralement « de couches contraires à la loi ». Le grec emploie une périphrase pour des relations sexuelles illicites ; « unions contraires à la loi » en conserve à la fois le sens moral et le registre euphémique.
- source_word: τέκνα γεννώμενα
  choice: les enfants nés
  rationale: Cette formulation française naturelle rend le participe présent passif et désigne les descendants issus de telles unions.
- source_word: μάρτυρές εἰσιν
  choice: témoignent
  rationale: Le verbe français exprime naturellement la fonction de témoins tout en maintenant la tonalité judiciaire du contexte.
- source_word: πονηρίας
  choice: la méchanceté
  rationale: Le terme désigne ici le mal moral ou la conduite mauvaise ; « méchanceté » reste clair et suffisamment fort.
- source_word: κατὰ γονέων
  choice: de la méchanceté de leurs parents
  rationale: κατά avec le génitif a une valeur défavorable ou accusatrice. Cette tournure française indique que le témoignage met en cause les parents, tandis que la formulation plus explicitement judiciaire est signalée en note.
- source_word: ἐν ἐξετασμῷ αὐτῶν
  choice: quand vient l’examen
  rationale: Cette formulation rend le substantif ἐξετασμός sans imposer en français un antécédent unique au pronom αὐτῶν, dont le référent demeure ambigu.
theological_decisions:
- issue: Portée morale de ἀνόμων ὕπνων
  choice: unions contraires à la loi
  alternative: couches illicites
  rationale: Le texte condamne ces relations sans préciser davantage leur nature. La traduction conserve le jugement moral et l’euphémisme du grec, sans introduire une catégorie confessionnelle particulière.
- issue: Référent de αὐτῶν dans ἐν ἐξετασμῷ αὐτῶν
  choice: ne pas préciser dans le texte qui fait l’objet de l’examen
  alternative: quand les enfants sont examinés ; quand leurs parents sont examinés
  rationale: Le pronom peut se rapporter aux enfants, sujet immédiat, mais son application aux parents ou une idée plus générale de mise à l’épreuve demeure possible. « Quand vient l’examen » préserve cette tension, explicitée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la tonalité morale et judiciaire du grec, tout en évitant une littéralité opaque. Les trois appels de note figurent dans le texte principal.
