  source_fidelity: 'Le sens général est bien rendu : les enfants issus d’unions moralement contraires à la loi servent de témoignage mettant en cause la méchanceté des parents. « Unions contraires à la loi » conserve de façon recevable l’euphémisme de ἀνόμων ὕπνων. Toutefois, « quand vient l’examen » est une tournure moins précise et moins naturelle pour ἐν ἐξετασμῷ αὐτῶν, qui désigne un contexte d’examen ou de scrutin. « Lors de l’examen » rend mieux cette valeur tout en ne tranchant pas le référent disputé de αὐτῶν.'
