  rationale: La révision rétablit la relation syntaxique et sémantique du grec entre « immortalité » et « souvenir », tout en conservant un français international moderne. La note est déplacée sur « souvenir », où porte l’ambiguïté du pronom αὐτῆς, et elle signale les lectures concurrentes sans imposer d’interprétation confessionnelle.
