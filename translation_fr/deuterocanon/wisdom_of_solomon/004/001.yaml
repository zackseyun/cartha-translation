base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/001.yaml
  text: Better is childlessness with virtue[a], for immortality is in her memory[b], because she is known both by God and by men.
translation:
  language: fr
  text: Mieux vaut être sans enfants et vivre dans la vertu, car l’immortalité se trouve dans son souvenir[a], puisqu’elle est reconnue aussi bien par Dieu que par les êtres humains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « car l’immortalité est dans son souvenir ». Le pronom féminin renvoie très probablement à la vertu ; certains le rapportent toutefois à l’absence d’enfants personnifiée, ou à la personne sans enfants.'
    reason: alternative_reading
lexical_decisions:
- source_word: κρείσσων
  choice: Mieux vaut
  rationale: Cette tournure française naturelle conserve la force comparative et proverbiale du grec.
- source_word: ἀτεκνία
  choice: ne pas avoir d’enfants
  rationale: Rend l’état d’absence d’enfants sans le limiter à l’infertilité biologique ni au seul sexe féminin.
- source_word: μετὰ ἀρετῆς
  choice: tout en pratiquant la vertu
  rationale: Exprime naturellement l’association entre l’absence d’enfants et la vertu, comprise ici comme excellence morale.
- source_word: ἀθανασία γάρ ἐστιν ἐν μνήμῃ αὐτῆς
  choice: car son souvenir est immortel
  rationale: Formulation française claire qui conserve ἀθανασία et rattache grammaticalement le possessif féminin à « vertu ».
- source_word: γινώσκεται
  choice: elle est reconnue
  rationale: « Reconnue » convient à une réalité estimée à la fois auprès de Dieu et des humains, tout en restant proche du passif grec.
- source_word: παρὰ θεῷ ... καὶ παρὰ ἀνθρώποις
  choice: aussi bien par Dieu que par les êtres humains
  rationale: Rend les deux sphères de reconnaissance et traduit le générique ἀνθρώποις sans connotation exclusivement masculine.
theological_decisions:
- issue: Référent du pronom féminin αὐτῆς et du sujet implicite de γινώσκεται
  choice: La vertu
  alternative: L’absence d’enfants personnifiée, ou implicitement la personne sans enfants
  rationale: 'ἀρετή est l’antécédent féminin le plus proche et donne au raisonnement sa cohérence : c’est la vertu associée à l’absence d’enfants qui reçoit un souvenir durable et la reconnaissance de Dieu et des humains. L’autre possibilité est signalée en note afin de préserver l’ambiguïté réelle.'
- issue: Portée de ἀνθρώποις
  choice: les êtres humains
  alternative: les hommes
  rationale: Le terme grec désigne ici l’humanité en général; « les êtres humains » en restitue directement la portée générique en français moderne.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « Mieux vaut » garde le caractère sentencieux du verset. « Tout en pratiquant la vertu » évite l’expression peu naturelle « absence d’enfants avec vertu », tandis que la note conserve l’ambiguïté du pronom grec.
