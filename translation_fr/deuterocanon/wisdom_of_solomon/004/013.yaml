  source_fidelity: Le projet rend bien le contraste entre la brièveté de la vie et des années longues. Toutefois, « il a rempli de longues années » n'est pas une formulation française naturelle pour ἐπλήρωσεν χρόνους μακρούς et obscurcit l'idée qu'une vie brève a néanmoins atteint la mesure d'une longue existence. « Parvenu à l’accomplissement » est possible, mais « à son plein accomplissement » est plus idiomatique et explicite sans imposer une perfection morale absolue.
