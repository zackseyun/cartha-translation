  text: having been perfected in a short time[a], he fulfilled long years;
translation:
  language: fr
  text: Parvenu à son plein accomplissement en peu de temps[a], il a accompli de longues années.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ayant été mené à la perfection en peu de temps ».
    reason: Variante plus littérale qui fait entendre la voix passive de τελειωθείς et son sens possible de « perfection ».
lexical_decisions:
- source_word: τελειωθεὶς
  choice: parvenu à l’accomplissement
  rationale: Le participe aoriste passif exprime l’achèvement ou l’accès à une pleine maturité. Cette formulation française conserve l’idée d’un état accompli sans imposer celle d’une perfection morale absolue.
- source_word: ἐν ὀλίγῳ
  choice: en peu de temps
  rationale: L’expression désigne ici une brève durée et forme un contraste direct avec les « longues années ».
- source_word: ἐπλήρωσεν
  choice: il a rempli
  rationale: Le verbe πληρόω signifie remplir ou mener à sa pleine mesure. « Rempli » maintient l’image paradoxale selon laquelle une vie brève équivaut à de longues années.
- source_word: χρόνους μακρούς
  choice: de longues années
  rationale: Littéralement « de longs temps » ; dans ce contexte de durée de vie, « de longues années » rend clairement le sens tout en préservant le pluriel et le contraste.
theological_decisions:
- issue: Sens du langage d’accomplissement appliqué au juste mort jeune
  choice: Le juste est présenté comme ayant atteint son plein accomplissement malgré la brièveté de sa vie.
  alternative: « Devenu parfait » pourrait suggérer plus directement une perfection morale absolue.
  rationale: Le contexte oppose la courte durée de la vie à sa pleine valeur devant Dieu. La traduction conserve cette tension sans définir l’accomplissement comme une impeccabilité doctrinale.
translation_notes:
  register: Français moderne, digne et légèrement poétique. Le parallélisme entre « peu de temps » et « longues années » est conservé, ainsi que le paradoxe de l’original.
