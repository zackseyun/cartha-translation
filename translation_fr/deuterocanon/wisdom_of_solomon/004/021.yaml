  text: Then the righteous man will stand with great boldness before those who afflicted him[a].
translation:
  language: fr
  text: Alors, le juste se tiendra avec une grande assurance face à ceux qui l’ont accablé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « devant la face de ceux qui l’ont accablé »; cette expression souligne la confrontation directe.'
