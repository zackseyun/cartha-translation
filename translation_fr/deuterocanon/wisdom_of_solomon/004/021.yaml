lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement la succession temporelle avec la scène précédente.
- source_word: στήσεται
  choice: se tiendra
  rationale: Le futur à valeur intransitive indique que le juste se tiendra debout ou prendra position, sans qu’il soit nécessaire d’introduire un agent qui le ferait comparaître.
- source_word: ἐν παρρησίᾳ πολλῇ
  choice: avec une grande assurance
  rationale: παρρησία exprime ici une confiance publique et sans crainte; « assurance » convient au contexte de justification tout en préservant la nuance de hardiesse.
- source_word: ὁ δίκαιος
  choice: le juste
  rationale: Le substantif adjectival masculin singulier désigne la figure exemplaire du juste; cette formulation française conserve le genre grammatical et la portée représentative.
- source_word: κατὰ πρόσωπον
  choice: face à
  rationale: Cette locution rend la présence directe et la confrontation suggérées littéralement par « devant la face de », dans un français naturel.
- source_word: τῶν θλιψάντων αὐτὸν
  choice: ceux qui l’ont accablé
  rationale: Le participe de θλίβω désigne ceux qui lui ont causé détresse et oppression; « accablé » garde cette ampleur sans restreindre le type de mauvais traitements.
theological_decisions:
- issue: Masculin singulier représentatif dans ὁ δίκαιος
  choice: le juste
  alternative: la personne juste
  rationale: Le grec présente une figure masculine singulière et exemplaire. « Le juste » conserve cette forme sans ajouter « homme », absent du texte, ni neutraliser la formulation.
translation_notes:
  register: Français international moderne, digne et accessible. « Face à » conserve la force de la confrontation tout en évitant un calque peu naturel; « grande assurance » maintient la tension entre confiance, franchise et hardiesse portée par παρρησία.
