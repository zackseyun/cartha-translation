base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/012.yaml
  text: For the bewitchment of wickedness darkens what is good[b][a], and the wandering of desire corrupts an innocent mind.
translation:
  language: fr
  text: Car l’envoûtement[b] du mal obscurcit ce qui est bon[a], et l’égarement du désir corrompt un esprit sans malice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui est beau » ou « ce qui est noble » ; le grec peut désigner à la fois la bonté morale et la beauté.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’envie malveillante du mal » ou « le mauvais œil du mal » ; le grec βασκανία peut évoquer l’envie nuisible ou une influence malfaisante.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασκανία
  choice: envoûtement
  rationale: Le nom peut évoquer l’envie malveillante, le mauvais œil ou une influence néfaste. « Envoûtement » conserve ici l’image d’une puissance de séduction qui fausse le jugement, sans réduire le terme à la seule envie.
- source_word: φαυλότητος
  choice: du mal
  rationale: Le génitif qualifie l’influence néfaste exprimée par βασκανία. « Du mal » est naturel en français moderne et garde la portée morale du terme.
- source_word: ἀμαυροῖ
  choice: obscurcit
  rationale: Le verbe exprime l’action de ternir, d’assombrir ou de rendre moins perceptible. « Obscurcit » convient à l’image d’un jugement moral devenu moins clair.
- source_word: τὰ καλά
  choice: ce qui est bon
  rationale: L’expression peut désigner ce qui est bon, beau ou noble. Le contexte moral favorise « ce qui est bon », tout en laissant la note préserver l’ampleur esthétique et morale du grec.
- source_word: ῥεμβασμός
  choice: égarement
  rationale: Le nom suggère une errance ou une instabilité qui détourne l’esprit. « Égarement » rend naturellement en français son effet mental et moral.
- source_word: ἐπιθυμίας
  choice: désir
  rationale: Le mot peut désigner diverses formes de désir. Le contexte lui donne ici une valeur nuisible, sans qu’il soit nécessaire de le limiter à la convoitise sexuelle.
- source_word: μεταλλεύει
  choice: corrompt
  rationale: Dans ce contexte, le verbe décrit une transformation en mal plutôt qu’un simple changement. « Corrompt » exprime clairement l’atteinte portée à l’intégrité de l’esprit.
- source_word: νοῦν
  choice: esprit
  rationale: νοῦς désigne la faculté de comprendre et de discerner. « Esprit » est idiomatique et convient à la portée intellectuelle et morale du passage.
- source_word: ἄκακον
  choice: sans malice
  rationale: L’adjectif signifie exempt de méchanceté ou de tromperie. « Sans malice » en conserve le sens précis sans imposer l’idée plus générale d’innocence juridique.
theological_decisions:
- issue: Portée morale et esthétique de τὰ καλά
  choice: ce qui est bon
  alternative: ce qui est beau ; les belles choses ; ce qui est noble
  rationale: Le contexte porte sur la corruption morale et le discernement. La formulation retenue privilégie donc le sens éthique, tandis qu’une note maintient les autres nuances réelles de καλός.
- issue: Force de βασκανία
  choice: envoûtement
  alternative: envie malveillante ; mauvais œil ; influence néfaste
  rationale: Le grec permet plusieurs évocations liées à l’envie et à une influence nuisible. « Envoûtement » préserve la force imagée d’une séduction corruptrice, sans prétendre exclure les autres sens.
- issue: État du νοῦς ἄκακον
  choice: un esprit sans malice
  alternative: un esprit innocent ; un esprit candide
  rationale: La traduction retenue exprime l’absence de mauvais dessein ou de tromperie sans idéaliser excessivement l’esprit décrit.
translation_notes:
  register: Français international moderne, sobre et soutenu. La phrase conserve le parallélisme grec entre l’envoûtement qui obscurcit et le désir qui corrompt. « Sans malice » garde une dignité biblique tout en restant immédiatement compréhensible.
