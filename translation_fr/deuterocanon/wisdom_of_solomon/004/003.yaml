base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/003.yaml
  text: But the many offspring of the ungodly will be of no use[a], and from bastard shoots they will not give a root into depth[b], nor will they set a firm foundation.
translation:
  language: fr
  text: Mais la descendance nombreuse des impies ne servira à rien ; issue de rejetons bâtards[a], elle ne s’enracinera pas profondément[b] et n’établira pas de fondement solide.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rejetons illégitimes » ou « greffes illégitimes ». Le grec emploie un terme rude au sein d’une métaphore végétale.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « elle ne donnera pas de racine dans la profondeur » ; autrement dit, elle ne s’enracinera pas profondément.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολύγονον ... πλῆθος
  choice: la nombreuse descendance
  rationale: Cette formulation française exprime naturellement l’idée collective d’une multitude issue d’une grande fécondité, tout en conservant le singulier grammatical repris ensuite par « elle ».
- source_word: ἀσεβῶν
  choice: des impies
  rationale: « Impies » conserve la dimension religieuse de ἀσεβής, qui désigne ceux qui manquent de respect envers Dieu, plutôt que la seule méchanceté morale.
- source_word: οὐ χρησιμεύσει
  choice: ne servira à rien
  rationale: Rend directement et idiomatiquement l’idée de ne présenter aucune utilité ou aucun avantage, avec la valeur future du grec.
- source_word: ἐκ νόθων μοσχευμάτων
  choice: issue de rejetons bâtards
  rationale: « Rejetons » maintient la métaphore végétale tout en faisant écho à la descendance humaine; « bâtards » préserve la rudesse et la valeur dépréciative de νόθων sans les atténuer.
- source_word: οὐ δώσει ῥίζαν εἰς βάθος
  choice: elle ne poussera pas de racine en profondeur
  rationale: Formulation française naturelle qui demeure proche de l’image littérale d’une racine donnée ou produite vers la profondeur.
- source_word: οὐδὲ ἀσφαλῆ βάσιν ἐδράσει
  choice: et n’établira pas d’assise solide
  rationale: « Assise solide » restitue l’idée d’une base stable, tandis qu’« établira » correspond au sens de fixer ou affermir.
theological_decisions:
- issue: Caractérisation religieuse de ἀσεβῶν
  choice: impies
  alternative: méchants
  rationale: Le terme grec comporte une orientation envers Dieu que « méchants » ne rendrait pas explicitement; « impies » la conserve sans ajouter de précision doctrinale.
- issue: Rudesse de νόθων dans la métaphore
  choice: rejetons bâtards
  alternative: rejetons illégitimes
  rationale: Le grec emploie un qualificatif socialement chargé. Le conserver maintient la force du texte et la tension entre descendance humaine et croissance végétale.
- issue: Référent grammatical des verbes au singulier
  choice: reprise de « la descendance » par « elle »
  alternative: emploi d’un pluriel renvoyant aux rejetons
  rationale: Les verbes grecs sont au singulier et se rattachent naturellement à πλῆθος, nom collectif singulier. Le français permet de préserver cette structure sans trancher davantage la portée de la métaphore.
translation_notes:
  register: Français international moderne, soutenu sans être archaïque. La ponctuation en deux phrases clarifie la transition vers la métaphore végétale. « Rejetons bâtards » conserve volontairement la dureté du grec; les notes signalent les principales possibilités lexicales et la formulation littérale.
