  source_fidelity: 'Le sens global est bien rendu : le collectif singulier πλῆθος est correctement repris par « elle », ἀσεβῶν par « des impies », et les deux images de l’enracinement et de la stabilité sont conservées. Une formulation plus idiomatique pour οὐ δώσει ῥίζαν εἰς βάθος est toutefois préférable. La note a contient en outre une alternative inexacte : « de mauvaise souche » ajoute une idée absente de νόθος.'
