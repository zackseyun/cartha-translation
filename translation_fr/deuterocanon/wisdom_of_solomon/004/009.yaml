  source_fidelity: La traduction restitue bien πολιὰ par « cheveux blancs », φρόνησις par « prudence » et βίος ἀκηλίδωτος par « une vie sans tache ». Toutefois, « la prudence tient lieu de cheveux blancs » inverse l’équivalence nominale formulée par le grec (« les cheveux blancs sont la prudence »). « Grand âge » atténue aussi la construction expressive ἡλικία γήρως, littéralement « l’âge de la vieillesse ».
  naturalness: Le français du projet est fluide et digne. Une formulation elliptique conserve mieux le parallélisme proverbial grec tout en restant naturelle en français moderne.
