  text: For gray hair is understanding for men, and an unblemished life is the age of old age.
translation:
  language: fr
  text: Car, pour les êtres humains, les cheveux blancs, c’est la prudence, et l’âge de la vieillesse, une vie sans tache.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολιά
  choice: cheveux blancs
  rationale: Rend l’image concrète des cheveux blanchis, symbole visible de la vieillesse.
- source_word: φρόνησις
  choice: prudence
  rationale: Exprime le discernement pratique et la sagesse de conduite, plutôt qu’une simple compréhension intellectuelle.
- source_word: ἀνθρώποις
  choice: pour les êtres humains
  rationale: Le grec désigne ici les humains en général, sans limiter l’énoncé aux hommes de sexe masculin.
- source_word: ἡλικία γήρως
  choice: grand âge
  rationale: Formulation française naturelle pour l’âge avancé évoqué par l’expression grecque.
- source_word: βίος ἀκηλίδωτος
  choice: une vie sans tache
  rationale: Conserve la métaphore morale de l’absence de souillure ou de défaut.
theological_decisions:
- issue: Rapport entre vieillesse physique et maturité morale
  choice: Employer « tient lieu de » afin de montrer que la prudence et la vie sans tache constituent la véritable vieillesse honorable.
  alternative: « Les cheveux blancs sont la prudence… et l’âge de la vieillesse est une vie sans tache. »
  rationale: La syntaxe nominale grecque établit une équivalence paradoxale. La formulation retenue en restitue le sens sans transformer l’énoncé en définition doctrinale rigide.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme est conservé, ainsi que les images des cheveux blancs et de la vie sans tache.
