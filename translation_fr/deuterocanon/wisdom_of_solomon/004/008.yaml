  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/008.yaml
  text: For old age is honorable not because it is long-lived, nor is it measured by the number of years;
translation:
  language: fr
  text: Car une vieillesse digne d’honneur ne dépend pas d’une longue vie et ne se mesure pas au nombre des années ;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γῆρας
  choice: vieillesse
  rationale: Le nom désigne la vieillesse elle-même, et non simplement une personne âgée. « Vieillesse » est l’équivalent français direct et naturel.
- source_word: τίμιον
  choice: digne d’honneur
  rationale: Dans ce contexte moral, le terme exprime ce qui est estimé et honorable plutôt que ce qui est matériellement précieux. Cette formulation s’applique naturellement à la vieillesse.
- source_word: οὐ τὸ πολύχρονον
  choice: ne dépend pas d’une longue vie
  rationale: L’expression nie que la durée ou la multiplicité des années constitue à elle seule le caractère honorable de la vieillesse. Cette formulation française rend clairement la relation prédicative sans confondre vieillesse et longévité.
- source_word: οὐδὲ
  choice: et ne… pas
  rationale: Cette coordination négative relie étroitement la seconde proposition à la première ; en français courant, « et ne… pas » est ici plus naturel que « ni » après une proposition verbale complète.
- source_word: ἀριθμῷ ἐτῶν
  choice: au nombre des années
  rationale: Le datif indique le critère ou l’étalon de mesure. « Au nombre des années » restitue précisément cette idée.
- source_word: μεμέτρηται
  choice: se mesure
  rationale: Le parfait passif grec exprime ici une vérité générale et établie. Le présent pronominal français en conserve naturellement la valeur gnomique.
theological_decisions:
- issue: Fondement du caractère honorable de la vieillesse
  choice: Le caractère honorable de la vieillesse ne dépend ni de la longévité ni du décompte chronologique.
  alternative: Toute vieillesse serait honorable en elle-même, indépendamment de la conduite.
  rationale: Le grec oppose la vieillesse digne d’honneur à la simple durée de la vie, sans encore expliciter le critère positif donné par la suite du passage. La traduction conserve cette tension sans l’anticiper.
translation_notes:
  register: Français international moderne, clair et digne. La tournure sapientielle est conservée, ainsi que le point-virgule indiquant que la pensée se poursuit au verset suivant.
