base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/016.yaml
  text: But the righteous one[a], though dead, will condemn the living ungodly[b]; and youth brought to completion quickly will condemn the many-year old age of the unrighteous.
translation:
  language: fr
  text: Mais le juste, même s’il est mort[a], condamnera les impies encore en vie ; et une jeunesse rapidement menée à son accomplissement[b] condamnera la longue vieillesse de l’injuste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « après être mort ». Le participe peut être traduit de façon plus littérale ; dans ce contexte, il renvoie à la mort du juste.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « une jeunesse rapidement rendue parfaite ». Le grec exprime l’idée d’achèvement, sans imposer à lui seul celle d’une perfection morale absolue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακρινεῖ
  choice: condamnera
  rationale: Le futur de κατακρίνω exprime ici un jugement défavorable. « Condamnera » est direct, naturel et conserve la force judiciaire du grec.
- source_word: δίκαιος
  choice: le juste
  rationale: L’adjectif substantivé au singulier désigne une personne juste. « Le juste » est idiomatique en français biblique moderne sans ajouter de précision absente du grec.
- source_word: καμών
  choice: même s’il est mort
  rationale: Dans le contexte immédiat de la mort précoce du juste, le participe de κάμνω renvoie à sa mort. La tournure concessive rend naturellement le contraste avec les impies encore en vie, tout en signalant en note les rendus plus littéraux.
- source_word: τοὺς ζῶντας ἀσεβεῖς
  choice: les impies encore en vie
  rationale: La formulation fait ressortir le contraste entre le juste mort et les impies qui demeurent en vie. « Impies » rend la dimension religieuse de ἀσεβεῖς.
- source_word: νεότης
  choice: une jeunesse
  rationale: νεότης désigne la jeunesse ou le jeune âge. Le nom abstrait est conservé afin de respecter le parallélisme du grec.
- source_word: τελεσθεῖσα
  choice: menée à son accomplissement
  rationale: Le participe évoque l’achèvement. Cette expression préserve ce motif sans suggérer nécessairement une perfection morale absolue.
- source_word: ταχέως
  choice: rapidement
  rationale: L’adverbe exprime simplement la rapidité avec laquelle cette vie jeune atteint son terme.
- source_word: πολυετὲς γῆρας
  choice: la longue vieillesse
  rationale: Littéralement, il s’agit d’une vieillesse « de nombreuses années ». « Longue vieillesse » rend naturellement cette durée et maintient le contraste avec la jeunesse vite achevée.
- source_word: ἀδίκου
  choice: de l’homme injuste
  rationale: Le génitif substantivé désigne la personne injuste à qui appartient cette vieillesse. « Injuste » maintient l’opposition lexicale avec « le juste ».
theological_decisions:
- issue: Sens contextuel de καμών
  choice: même s’il est mort
  alternative: après être mort ; ayant peiné
  rationale: κάμνω peut évoquer la fatigue ou la peine, mais le contexte porte sur la mort précoce du juste. Le texte principal exprime cette référence contextuelle tout en conservant l’ambiguïté lexicale dans une note.
- issue: Emploi d’un vocabulaire de perfection pour τελεσθεῖσα
  choice: menée à son accomplissement
  alternative: rendue parfaite
  rationale: « Rendue parfaite » est possible, mais peut être compris comme une affirmation de perfection morale plus précise que ne l’exige le verbe. « Menée à son accomplissement » garde l’idée d’une vie parvenue à son terme.
- issue: Verbe sous-entendu dans la seconde proposition
  choice: répétition de « condamnera »
  alternative: laisser la proposition nominale sans verbe explicite
  rationale: Le grec sous-entend naturellement κατακρινεῖ dans la seconde proposition. Sa répétition est nécessaire à la clarté du français et conserve le parallélisme judiciaire du verset.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme entre le juste mort et les impies vivants, puis entre la jeunesse achevée et la longue vieillesse de l’injuste, est conservé. La ponctuation française emploie une espace avant le point-virgule.
