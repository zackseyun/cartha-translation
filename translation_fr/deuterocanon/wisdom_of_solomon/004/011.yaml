  text: He was taken away, lest evil change his understanding or deceit mislead his soul.
translation:
  language: fr
  text: Il a été enlevé, de peur que le mal n’altère son discernement ou que la tromperie n’égare son âme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡρπάγη
  choice: Il a été enlevé
  rationale: Le passif exprime une action soudaine subie par le juste; « enlevé » conserve cette force sans préciser explicitement l’agent.
- source_word: μή
  choice: de peur que… ne
  rationale: Rend naturellement en français la valeur préventive de μή après l’enlèvement évoqué.
- source_word: κακία
  choice: le mal
  rationale: Terme général qui préserve l’étendue morale de κακία sans la réduire à une faute particulière.
- source_word: ἀλλάξῃ σύνεσιν αὐτοῦ
  choice: ne change son intelligence
  rationale: « Changer » maintient le sens direct de ἀλλάσσω; « intelligence » rend σύνεσις comme faculté de comprendre et de discerner.
- source_word: δόλος
  choice: la tromperie
  rationale: Exprime le caractère mensonger et perfide de δόλος dans une formulation moderne.
- source_word: ἀπατήσῃ ψυχὴν αὐτοῦ
  choice: n’égare son âme
  rationale: « Égarer » transmet l’effet de la séduction trompeuse sans la répétition peu naturelle « tromperie… trompe »; « âme » conserve ψυχή et sa portée anthropologique ouverte.
theological_decisions:
- issue: Agent de l’enlèvement
  choice: Le passif « a été enlevé » laisse l’agent implicite.
  alternative: « Dieu l’a enlevé »
  rationale: Le grec emploie un passif sans nommer Dieu; la traduction ne doit pas expliciter ce que le verset laisse sous-entendu.
- issue: Finalité ou prévention exprimée par μή
  choice: « de peur que » présente l’enlèvement comme prévenant une corruption possible.
  alternative: « afin que… ne… pas »
  rationale: Cette formulation conserve la tension du texte entre la mort prématurée du juste et sa protection contre l’influence du mal, sans développer une doctrine supplémentaire.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase garde le parallélisme grec entre « le mal » et « la tromperie », puis entre « l’intelligence » et « l’âme ».
