base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/014.yaml
  text: For his soul was pleasing to the Lord; therefore he hastened him out of the midst of wickedness. But the peoples, seeing and not understanding, nor taking such a thing to heart,
translation:
  language: fr
  text: Car son âme plaisait au Seigneur ; c’est pourquoi il s’est empressé de le retirer du milieu du mal[a]. Mais les peuples, tout en voyant, n’ont pas compris et n’ont pas pris à cœur une telle chose,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il l’a fait sortir en hâte du milieu de la perversité ». Le verbe grec souligne la hâte, et πονηρία peut se traduire par « mal » ou « perversité ».'
    reason: Alternative lexicale permettant de percevoir la force du verbe et l’étendue sémantique de πονηρία.
lexical_decisions:
- source_word: ἀρεστὴ … Κυρίῳ
  choice: plaisait au Seigneur
  rationale: 'Cette formulation française naturelle conserve le sens relationnel de l’adjectif : l’âme de cet homme était agréable au Seigneur.'
- source_word: ψυχὴ
  choice: âme
  rationale: « Âme » maintient ici la portée anthropologique et théologique du grec, plutôt que de réduire le terme à la seule vie physique.
- source_word: ἔσπευσεν
  choice: il s’est empressé de le retirer
  rationale: Le verbe exprime la hâte. La tournure choisie rend cette nuance tout en donnant une phrase française claire ; le pronom « le » renvoie à l’homme juste dont parle le contexte.
- source_word: ἐκ μέσου πονηρίας
  choice: du milieu du mal
  rationale: La formulation garde l’image spatiale d’une délivrance opérée au sein d’une réalité mauvaise. « Mal » laisse ouverte la portée de πονηρία, qui peut désigner le mal ou la perversité.
- source_word: οἱ … λαοὶ
  choice: les peuples
  rationale: Le pluriel grec est conservé, malgré le caractère légèrement inhabituel de l’expression en français, afin de ne pas le réduire silencieusement à un peuple unique.
- source_word: ἰδόντες καὶ μὴ νοήσαντες
  choice: tout en voyant, n’ont pas compris
  rationale: Cette tournure reproduit le contraste participial entre le fait de voir et l’absence de compréhension, dans un français actuel.
- source_word: μηδὲ θέντες ἐπὶ διανοίᾳ
  choice: n’ont pas pris à cœur
  rationale: L’expression grecque signifie littéralement mettre quelque chose dans sa pensée. « Prendre à cœur » en restitue naturellement l’idée de considération intérieure sérieuse.
- source_word: τὸ τοιοῦτο
  choice: une telle chose
  rationale: Cette expression garde la référence générale à l’action divine qui vient d’être décrite, sans la préciser davantage.
theological_decisions:
- issue: Sujet implicite de ἔσπευσεν
  choice: Le Seigneur est compris comme sujet de « il s’est empressé ».
  alternative: 'Employer une tournure impersonnelle : « on s’est empressé de le retirer » ou « il fut retiré en hâte ».'
  rationale: Le Seigneur, nommé dans la proposition précédente, constitue l’antécédent contextuel le plus proche ; le contexte présente en outre le retrait précoce du juste comme une action divine. La traduction explicite ce sujet grammaticalement implicite sans ajouter de doctrine.
- issue: Nature de πονηρία
  choice: le mal
  alternative: la perversité
  rationale: « Mal » préserve l’étendue sémantique du terme grec et évite de décider s’il s’agit surtout de la corruption morale environnante, d’actes mauvais ou du mal au sens large.
translation_notes:
  register: Français international moderne, digne et lisible. La virgule finale est conservée parce que la syntaxe et la pensée se poursuivent au verset suivant. Le pluriel « les peuples » suit délibérément le grec λαοί.
