base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/022.yaml
  text: For the whole world before you is like a speck on the scales[a], and like a drop of morning dew that falls upon the earth.
translation:
  language: fr
  text: Car le monde entier est devant toi comme ce qui fait pencher une balance[a], et comme une goutte de rosée matinale tombée sur la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « comme l’infime mouvement d’une balance » ou « comme un poids minuscule sur la balance ». L’image grecque souligne une extrême petitesse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥοπὴ ἐκ πλαστίγγων
  choice: ce qui fait pencher la balance
  rationale: L’expression évoque l’infime poids qui suffit à faire incliner une balance. Cette formulation française conserve l’image concrète et l’extrême petitesse sans imposer l’idée moins certaine d’une poussière.
- source_word: ὅλος ὁ κόσμος
  choice: le monde entier
  rationale: κόσμος désigne ici le monde dans sa totalité; « le monde entier » est naturel, ample et non surinterprétatif.
- source_word: ἐναντίον σου
  choice: devant toi
  rationale: La traduction garde le sens spatial et relationnel de la locution grecque, tandis que les comparaisons expriment elles-mêmes l’insignifiance relative du monde.
- source_word: ῥανὶς δρόσου ὄρθρινὴ
  choice: une goutte de rosée matinale
  rationale: La formulation rend directement la goutte, la rosée et son caractère matinal dans un français fluide.
- source_word: κατελθοῦσα ἐπὶ γῆν
  choice: tombée sur la terre
  rationale: Le participe signifie littéralement « descendue »; pour la rosée, « tombée » restitue naturellement le mouvement accompli sans ajouter d’interprétation.
theological_decisions:
- issue: Insignifiance comparative du monde devant Dieu
  choice: Conserver les deux comparaisons concrètes sans les convertir en affirmation abstraite selon laquelle le monde ne serait « rien ».
  alternative: « le monde entier n’est rien devant toi »
  rationale: Le grec exprime une disproportion au moyen d’images poétiques. La traduction préserve cette tension sans tirer une conclusion métaphysique sur la valeur de la création.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du mouvement poétique grec; « ce qui fait pencher la balance » préserve une ambiguïté lexicale réelle, explicitée en note.
