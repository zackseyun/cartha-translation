base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/024.yaml
  text: For you love all things that exist[a], and you detest none of the things you made; for if you had hated anything[b], you would not have fashioned it.
translation:
  language: fr
  text: Car tu aimes tout ce qui existe, et tu ne détestes rien de ce que tu as fait ; car, si tu avais haï quoi que ce soit, tu ne l’aurais pas façonné.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπᾷς
  choice: tu aimes
  rationale: Rend directement le présent de ἀγαπάω par une formulation française naturelle, sans préciser indûment la dimension affective ou volitive.
- source_word: τὰ ὄντα πάντα
  choice: tout ce qui existe
  rationale: Préserve l’ampleur ontologique de l’expression grecque tout en restant idiomatique en français moderne.
- source_word: οὐδὲν βδελύσσῃς
  choice: tu n’as en aversion rien
  rationale: βδελύσσομαι exprime une forte répulsion. « Avoir en aversion » garde cette force dans un registre digne sans être archaïque.
- source_word: ὧν ἐποίησας
  choice: de ce que tu as fait
  rationale: ποιέω signifie largement « faire ». Cette traduction directe évite d’introduire prématurément le terme théologique plus marqué « créer ».
- source_word: μισῶν τι
  choice: si tu avais haï quoi que ce soit
  rationale: Le participe, avec ἄν et l’aoriste du verbe principal, est rendu par une condition contraire aux faits naturelle en français. « Quoi que ce soit » conserve la portée indéfinie de τι.
- source_word: κατεσκεύασας
  choice: tu ne l’aurais pas façonné
  rationale: κατασκευάζω peut signifier préparer, construire ou façonner. « Façonner » exprime ici une réalisation délibérée et distingue légèrement ce verbe de ἐποίησας.
theological_decisions:
- issue: Rapport entre l’amour divin et la création
  choice: Le verset affirme que Dieu aime tout ce qui existe et n’a en aversion rien de ce qu’il a fait, selon le raisonnement qu’il n’aurait pas façonné ce qu’il aurait haï.
  alternative: Comprendre soit que Dieu approuve sans réserve tout état actuel de la création, soit que l’affirmation vise uniquement la bonté originelle de la création.
  rationale: Le grec relie directement l’amour divin à « tout ce qui existe » et à ce que Dieu a fait. La traduction en conserve la portée et la tension sans ajouter de qualification doctrinale absente du verset.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe à Dieu. La répétition négative de οὐδὲν est rendue de façon soutenue mais claire, et la distinction entre ποιέω et κατασκευάζω est conservée par « fait » et « façonné ».
