  text: And both those absent and those present were afflicted alike;[a]
translation:
  language: fr
  text: Absents comme présents, ils étaient pareillement accablés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « éprouvés », « tourmentés » ou « épuisés »; le verbe grec évoque le fait d’être accablé ou usé par la souffrance.
    reason: alternative lexicale
lexical_decisions:
- source_word: ἀπόντες
  choice: absents
  rationale: Le participe désigne ceux qui sont éloignés ou non présents; « absents » conserve nettement l’opposition avec « présents ».
- source_word: παρόντες
  choice: présents
  rationale: Le participe désigne ceux qui sont là; « présents » reproduit l’antithèse formelle avec ἀπόντες.
- source_word: ὁμοίως
  choice: pareillement
  rationale: L’adverbe exprime une expérience semblable, en manière ou en degré, sans préciser davantage.
- source_word: ἐτρύχοντο
  choice: étaient accablés
  rationale: L’imparfait moyen-passif évoque un état ou un processus continu d’épuisement et de souffrance; « étaient accablés » reste général sans imposer l’idée plus étroite de torture.
theological_decisions:
- issue: Nature de la souffrance exprimée par ἐτρύχοντο
  choice: étaient accablés
  alternative: étaient tourmentés; étaient éprouvés; étaient épuisés
  rationale: Le verbe peut évoquer le fait d’être usé, épuisé ou durement affligé. Une formulation générale préserve cette amplitude et n’ajoute pas une conception particulière du châtiment.
translation_notes:
  register: Français international moderne, concis et digne. La construction détachée « Absents comme présents » maintient le parallélisme grec, tandis que l’imparfait rend l’aspect duratif de ἐτρύχοντο.
