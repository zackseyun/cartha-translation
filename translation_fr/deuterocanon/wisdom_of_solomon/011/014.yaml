  verdict: revise
  source_fidelity: 'Révision nécessaire pour rendre plus exactement ἐν ἐκθέσει : « après avoir été exposé » introduit une succession temporelle absente du grec, là où l’expression situe l’abandon lors de l’exposition. « Tout autrement » renforce aussi indûment la simple comparaison négative οὐχ ὅμοια.'
  naturalness: Le français est globalement digne et clair. « Lors de son exposition » est plus idiomatique et précis dans ce contexte historique; « s’étonnèrent » rend directement ἐθαύμασαν sans ajouter l’idée d’être saisis.
  terminology: « Exposition » et « abandonné » expriment adéquatement l’exposition d’un nourrisson sans nommer le référent dans le texte. La note conserve à juste titre l’allusion à Moïse. La note b doit employer « issue » au singulier ou une formulation plus naturelle, car « ces issues » est ambigu et peu usuel ici.
