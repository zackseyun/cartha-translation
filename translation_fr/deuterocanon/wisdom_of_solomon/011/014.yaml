    rationale: Cette formulation signifie que l’abandon a eu lieu après l’exposition. Le grec indique plutôt que l’homme avait été rejeté/abandonné dans le cadre ou au moment de son exposition.
  - severity: low
    issue: « tout autrement que les justes »
    rationale: Le grec dit littéralement « non de manière semblable aux justes »; « tout » accentue le contraste au-delà du texte.
  - severity: low
    issue: 'Note b : « au terme de ces issues »'
    rationale: En français moderne, « issues » au pluriel évoque d’abord des sorties et ne rend pas naturellement les sens possibles d’ἐκβάσεις. « à l’issue de ces événements » préserve l’alternative de sens.
