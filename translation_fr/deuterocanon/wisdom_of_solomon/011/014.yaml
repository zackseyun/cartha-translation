revisions:
- from: Car ils avaient rejeté avec moquerie celui qui, longtemps auparavant, avait été abandonné après avoir été exposé[a] ; mais, au terme de ces événements, ils furent saisis d’étonnement[b], après avoir souffert de la soif tout autrement que les justes.
  to: Car ils avaient rejeté avec moquerie celui qui, longtemps auparavant, avait été abandonné lors de son exposition[a] ; mais, au terme de ces événements, ils s’étonnèrent[b], après avoir eu soif autrement que les justes.
  rationale: La révision remplace la relation temporelle ajoutée par « après avoir été exposé » par « lors de son exposition », qui rend la fonction de ἐν ἐκθέσει. Elle évite l’intensification de « tout autrement », emploie un équivalent plus direct d’ἐθαύμασαν et clarifie la note lexicale sans résoudre l’ambiguïté de ἐκβάσεις.
