base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/014.yaml
  text: For they rejected with mockery the one who had long ago been cast out at his exposure[a]; but at the end of those events they marveled[b], having thirsted unlike the righteous.
translation:
  language: fr
  text: Car ils avaient rejeté avec moquerie celui qui, longtemps auparavant, avait été abandonné lors de son exposition[a] ; mais, au terme de ces événements, ils s’étonnèrent[b], après avoir eu soif autrement que les justes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit de l’enfant autrefois exposé et abandonné — une allusion à Moïse.
    reason: cross_reference
  - marker: b
    text: Ou « à l’issue de ces événements » ; le grec peut désigner le résultat final des événements qui s’étaient déroulés.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκθέσει
  choice: après avoir été exposé
  rationale: ἔκθεσις désigne ici l’exposition d’un nourrisson, abandonné après avoir été déposé à l’écart. Cette formulation française conserve l’allusion concrète sans nommer Moïse dans le texte.
- source_word: ῥιφέντα
  choice: avait été abandonné
  rationale: Le participe de ῥίπτω évoque littéralement le fait d’être jeté. Dans le contexte de l’exposition d’un enfant, « abandonné » exprime naturellement le sens contextuel sans reproduire maladroitement deux verbes français de rejet.
- source_word: ἀπεῖπον
  choice: avaient rejeté
  rationale: Le verbe exprime la répudiation ou le rejet. « Rejeter » convient au rapport des Égyptiens envers celui qu’ils avaient autrefois méprisé.
- source_word: χλευάζοντες
  choice: avec moquerie
  rationale: Le participe indique la manière dont ils l’avaient rejeté ; la tournure adverbiale française rend clairement cette relation.
- source_word: ἐπὶ τέλει τῶν ἐκβάσεων
  choice: au terme de ces événements
  rationale: ἐκβάσεις peut désigner les issues, les résultats ou le déroulement des faits. « Au terme de ces événements » est naturel et maintient la possibilité d’une référence au résultat final de ce qui s’est produit.
- source_word: ἐθαύμασαν
  choice: furent saisis d’étonnement
  rationale: Le verbe marque ici l’étonnement devant l’issue des événements. Cette expression est actuelle et digne, sans impliquer nécessairement une admiration favorable.
- source_word: οὐχ ὅμοια δικαίοις
  choice: tout autrement que les justes
  rationale: La formule maintient le contraste explicite entre l’expérience de la soif chez les Égyptiens et chez les justes, sans expliquer davantage la nature de cette différence.
- source_word: διψήσαντες
  choice: après avoir souffert de la soif
  rationale: Le participe aoriste présente leur soif comme une circonstance antérieure ou associée à leur étonnement. « Souffrir de la soif » convient mieux ici que le simple « avoir soif », étant donné le caractère éprouvant du contexte.
theological_decisions:
- issue: Identification de l’enfant exposé
  choice: Conserver le référent implicite dans le texte et préciser en note qu’il s’agit d’une allusion à Moïse.
  alternative: Nommer directement Moïse dans le corps du verset.
  rationale: Le grec ne nomme pas Moïse. Garder la désignation indirecte respecte la retenue du texte source tout en permettant à la note de rendre l’allusion accessible.
- issue: Nature de la différence entre la soif des Égyptiens et celle des justes
  choice: Préserver la comparaison sans préciser en quoi les deux expériences diffèrent.
  alternative: Expliciter que la soif des Égyptiens fut punitive tandis que celle des justes reçut un secours providentiel.
  rationale: Le contexte soutient cette compréhension, mais le verset lui-même se contente d’énoncer le contraste. La traduction ne doit pas résoudre implicitement ce que la formulation grecque laisse condensé.
translation_notes:
  register: Français international moderne, digne et lisible. Le plus-que-parfait situe le rejet et l’exposition bien avant l’étonnement final. « Exposé » conserve le terme historique relatif à l’abandon d’un nourrisson, éclairé par la note. La phrase garde la tension et la densité de l’enchaînement grec sans expliciter le jugement théologique sous-jacent.
