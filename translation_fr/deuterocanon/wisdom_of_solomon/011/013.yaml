  source_fidelity: 'Le texte rend fidèlement la structure : γάρ est conservé par « Car », ὅτε par « lorsqu’ », et ἤκουσαν reçoit une traduction contextuellement juste avec « apprirent ». « recevaient des bienfaits » exprime correctement le passif εὐεργετουμένους. « au moyen des châtiments qu’eux-mêmes subissaient » préserve la valeur instrumentale de διά avec génitif ainsi que l’ironie contrastive de ἰδίων. « ils reconnurent le Seigneur » est une bonne traduction de ᾔσθοντο τοῦ κυρίου sans imposer une conversion ou une confession complète.'
  naturalness: La phrase est naturelle, lisible et d’un registre moderne et digne. « Ces gens-là » rend de façon idiomatique le groupe opposé sans introduire explicitement « les Israélites » dans le texte. La phrase longue reste claire grâce à « qu’eux-mêmes subissaient », qui identifie sans ambiguïté les personnes punies.
  terminology: « Châtiments », « bienfaits » et « le Seigneur » conviennent au contexte et au registre scripturaire français. La note exprime avec justesse l’alternative sémantique de ᾔσθοντο et évite de surinterpréter la reconnaissance comme une pleine confession de foi. L’ancre [a] est correctement placée après l’expression qu’elle éclaire.
