  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/013.yaml
  text: For when they heard that those very people were being benefited through their own punishments[a], they recognized the Lord.
translation:
  language: fr
  text: Car, lorsqu’ils apprirent que ces gens-là recevaient des bienfaits au moyen des châtiments qu’eux-mêmes subissaient, ils reconnurent le Seigneur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils prirent conscience du Seigneur ». Le grec peut exprimer une perception ou une reconnaissance, sans nécessairement impliquer une pleine confession de foi.
    reason: Alternative lexicale préservant l’étendue sémantique de ᾔσθοντο.
lexical_decisions:
- source_word: ὅτε γὰρ
  choice: Car, lorsqu’ils
  rationale: « Car » conserve la valeur explicative de γάρ, tandis que « lorsqu’ils » rend la proposition temporelle introduite par ὅτε.
- source_word: ἤκουσαν
  choice: ils apprirent
  rationale: Dans ce contexte, le verbe désigne le fait d’entendre une nouvelle et d’en prendre connaissance. « Apprirent » est plus naturel en français que le calque « entendirent que ».
- source_word: διὰ τῶν ἰδίων κολάσεων
  choice: au moyen des châtiments qu’eux-mêmes subissaient
  rationale: 'διά avec le génitif exprime le moyen. Cette formulation garde l’ironie du texte : les châtiments infligés aux uns deviennent le moyen par lequel les autres reçoivent des bienfaits.'
- source_word: εὐεργετουμένους
  choice: recevaient des bienfaits
  rationale: Le participe passif indique que les personnes concernées bénéficient d’une action favorable. La tournure française conserve cette passivité sans employer le peu naturel « étaient bénéficiées ».
- source_word: αὐτούς
  choice: ces gens-là
  rationale: Le pronom renvoie au groupe opposé à celui qui subit les châtiments, c’est-à-dire aux Israélites dans le contexte. « Ces gens-là » rend le contraste sans introduire leur nom dans le verset.
- source_word: ᾔσθοντο
  choice: ils reconnurent
  rationale: Le verbe exprime ici une perception ou une prise de conscience. « Reconnurent » convient au constat de l’action du Seigneur, tout en laissant ouverte la profondeur de cette reconnaissance.
- source_word: τοῦ κυρίου
  choice: le Seigneur
  rationale: Le génitif dépend du verbe de perception. « Le Seigneur » est la désignation naturelle de Dieu dans ce contexte.
theological_decisions:
- issue: Référent de αὐτούς et rapport entre les châtiments et les bienfaits
  choice: « ces gens-là » désigne les Israélites, qui reçoivent des bienfaits au moyen des châtiments subis par les Égyptiens.
  alternative: Conserver le simple pronom « eux » et laisser entièrement implicite le contraste entre les deux groupes.
  rationale: Le contexte immédiat oppose les Égyptiens frappés aux Israélites secourus. La formulation française explicite seulement les rapports nécessaires à l’intelligibilité de la phrase, sans nommer les groupes dans le texte.
- issue: Portée de ᾔσθοντο τοῦ κυρίου
  choice: « ils reconnurent le Seigneur »
  alternative: « ils prirent conscience du Seigneur » ou « ils perçurent l’action du Seigneur »
  rationale: Le grec évoque une perception ou une reconnaissance, sans nécessairement affirmer une confession de foi complète. Le choix retenu préserve cette ouverture, précisée en note.
translation_notes:
  register: Français international moderne, courant et digne. La phrase conserve le lien explicatif, l’ironie entre châtiments et bienfaits, ainsi que l’ambiguïté théologique sur la nature de la reconnaissance du Seigneur.
