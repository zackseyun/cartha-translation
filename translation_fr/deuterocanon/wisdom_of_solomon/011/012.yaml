  text: For a double grief and groaning at the memory of what had happened seized them[a].
translation:
  language: fr
  text: Car une double peine et un gémissement au souvenir de ce qui s’était passé les saisirent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et un gémissement en se rappelant les événements passés ». L’expression grecque est condensée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διπλῆ
  choice: double
  rationale: L’adjectif qualifie λύπη et conserve l’image d’un chagrin redoublé ou à deux faces, sans expliciter ce que le grec laisse implicite.
- source_word: ἔλαβε
  choice: saisit
  rationale: Dans cette construction, le verbe présente l’émotion comme une force qui s’empare d’eux; « saisit » en garde la vivacité.
- source_word: λύπη
  choice: chagrin
  rationale: Le mot désigne une douleur morale ou une profonde tristesse; « chagrin » convient au registre narratif et à l’intensité du contexte.
- source_word: στεναγμός
  choice: gémissement
  rationale: Le nom évoque l’expression audible de la douleur, plus forte qu’un simple soupir.
- source_word: μνημῶν
  choice: au souvenir
  rationale: Le génitif est condensé et rattache le gémissement au fait de se rappeler; « au souvenir » garde ce lien sans le surinterpréter.
- source_word: τῶν παρελθουσῶν
  choice: de ce qui s’était passé
  rationale: Le participe substantivé désigne littéralement « les choses passées »; cette formulation est naturelle en français et respecte la référence aux événements antérieurs.
