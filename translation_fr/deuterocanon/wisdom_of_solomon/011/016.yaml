  text: so that they might know that by the very things through which a person sins[a], by these he is punished.
translation:
  language: fr
  text: afin qu’ils sachent que l’on est puni par les choses mêmes par lesquelles on pèche.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « afin qu’ils sachent que, par les choses par lesquelles quelqu’un pèche, par ces choses-là il est puni ». Le grec répète la même préposition pour souligner la correspondance entre le péché et le châtiment.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα γνῶσιν
  choice: afin qu’ils sachent
  rationale: La tournure exprime le but ou le résultat visé et rend naturellement en français le subjonctif grec après ἵνα.
- source_word: διʼ ὧν ... διὰ τούτων
  choice: par cela même qui ... par cela même
  rationale: La formulation fait ressortir la correspondance appuyée par la répétition de διά, tout en restant idiomatique en français.
- source_word: τις
  choice: l’on
  rationale: Le pronom indéfini a ici une portée humaine générale; « l’on » conserve cette valeur sans préciser le genre.
- source_word: ἁμαρτάνει
  choice: pécher
  rationale: « Pécher » garde la portée morale et théologique du verbe grec, que « faire le mal » atténuerait.
- source_word: κολάζεται
  choice: est puni
  rationale: Dans ce contexte de justice rétributive, le verbe désigne un châtiment plutôt qu’une simple correction éducative.
theological_decisions:
- issue: Correspondance entre le péché et le châtiment
  choice: Le châtiment vient par cela même qui sert à commettre le péché.
  alternative: Comprendre seulement que chacun est puni en rapport avec ses péchés, sans correspondance marquée entre leurs moyens respectifs.
  rationale: La reprise de διά dans διʼ ὧν ... διὰ τούτων souligne une justice de correspondance; la traduction la préserve sans préciser davantage sa nature.
translation_notes:
  register: Français international moderne, clair et digne. La construction impersonnelle « l’on est puni » rend le sujet générique τις et évite d’introduire un masculin référentiel absent du grec.
