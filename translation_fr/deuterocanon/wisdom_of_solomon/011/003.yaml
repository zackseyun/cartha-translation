translation:
  language: fr
  text: Ils résistèrent à leurs adversaires et repoussèrent leurs ennemis[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils tinrent tête à leurs adversaires et se défendirent contre leurs ennemis. » Le grec emploie deux verbes proches pour la résistance défensive, ainsi que deux termes proches pour désigner les opposants.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντέστησαν
  choice: résistèrent à
  rationale: L’aoriste de ἀνθίστημι exprime le fait de se dresser contre quelqu’un ou de lui résister. « Résistèrent à » est naturel en français et conserve l’idée d’opposition.
- source_word: πολεμίοις
  choice: leurs adversaires
  rationale: Le datif pluriel de πολέμιος désigne ici des adversaires dans un contexte hostile, voire militaire. « Adversaires » évite de répéter « ennemis » tout en préservant le parallélisme.
- source_word: ἠμύναντο
  choice: repoussèrent
  rationale: L’aoriste moyen de ἀμύνω peut signifier se défendre contre, écarter ou repousser. « Repoussèrent » rend avec concision l’action défensive sans imposer un complément absent du grec.
- source_word: ἐχθρούς
  choice: leurs ennemis
  rationale: ἐχθρός signifie « ennemi ». Le possessif, naturel en français dans ce contexte, explicite seulement la relation implicite entre le sujet et ceux qui lui sont hostiles.
