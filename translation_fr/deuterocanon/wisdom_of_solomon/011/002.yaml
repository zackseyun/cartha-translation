  text: They traveled through an uninhabited wilderness, and in trackless places they pitched tents;
translation:
  language: fr
  text: Ils traversèrent un désert inhabité et dressèrent leurs tentes dans des lieux sans pistes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διώδευσαν
  choice: Ils traversèrent
  rationale: Le verbe exprime un déplacement à travers une région. « Traversèrent » est naturel et restitue clairement cette progression.
- source_word: ἔρημον
  choice: un désert
  rationale: Ἔρημος désigne ici une région déserte ou sauvage. « Désert » convient au cadre de l’Exode sans préciser indûment la nature du terrain.
- source_word: ἀοίκητον
  choice: inhabité
  rationale: L’adjectif signifie directement « qui n’est pas habité » ; « inhabité » est précis et courant.
- source_word: ἀβάτοις
  choice: dans des lieux sans chemins
  rationale: Le terme peut désigner des lieux impraticables, inaccessibles ou non foulés. Dans ce contexte de voyage, « sans chemins » conserve l’image d’un terrain dépourvu de voies tracées tout en restant naturel en français.
- source_word: ἔπηξαν
  choice: dressèrent
  rationale: Avec σκηνάς pour complément, le verbe signifie installer ou dresser des tentes. « Dressèrent » est la collocation française usuelle.
- source_word: σκηνάς
  choice: leurs tentes
  rationale: Le nom pluriel désigne des habitations portatives. Le possessif, implicite dans le contexte et idiomatique en français, ne modifie pas le référent.
theological_decisions:
- issue: Évocation de la traversée du désert lors de l’Exode
  choice: Conserver le langage concret du déplacement et du campement sans explicitation théologique.
  alternative: 'Traduire de manière plus interprétative : « ils campèrent dans le désert de l’Exode ».'
  rationale: Le texte grec évoque le voyage d’Israël au désert, mais demeure descriptif. La traduction préserve cette évocation sans ajouter une identification ou une interprétation absente du verset.
translation_notes:
  register: Français moderne, international et digne. La formulation est concise et accessible ; « lieux sans chemins » conserve la nuance contextuelle de ἀβάτοις sans choisir exclusivement le sens plus fort d’« inaccessibles ».
