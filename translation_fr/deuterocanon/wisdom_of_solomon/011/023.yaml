base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/023.yaml
  text: But you have mercy on all[a], because you are able to do all things[b], and you overlook the sins of men for repentance.
translation:
  language: fr
  text: Mais tu fais miséricorde à tous, parce que tu peux tout, et tu fermes les yeux sur les péchés des êtres humains afin qu’ils se repentent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en vue de la repentance ». Le grec peut exprimer ici le but ou le résultat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεεῖς
  choice: tu fais miséricorde à
  rationale: Cette expression française naturelle et digne rend la compassion active du verbe grec et conserve son poids théologique.
- source_word: πάντας
  choice: tous
  rationale: Le pluriel a ici une portée universelle; « tous » la conserve avec concision.
- source_word: πάντα δύνασαι
  choice: tu peux tout
  rationale: Formulation directe et idiomatique qui exprime pleinement la capacité souveraine affirmée par le grec.
- source_word: παρορᾷς
  choice: tu fermes les yeux sur
  rationale: L’expression indique que Dieu s’abstient provisoirement de punir, sans suggérer qu’il ignore les péchés ou les juge insignifiants.
- source_word: ἁμαρτήματα ἀνθρώπων
  choice: les péchés des êtres humains
  rationale: « Péchés » est l’équivalent clair et courant; « êtres humains » rend exactement le sens générique de ἀνθρώπων en français moderne.
- source_word: εἰς μετάνοιαν
  choice: afin qu’ils se repentent
  rationale: La tournure verbale exprime naturellement en français la visée de cette patience divine, tout en reconnaissant que εἰς peut marquer le but ou le résultat.
theological_decisions:
- issue: Sens de la patience divine dans παρορᾷς ἁμαρτήματα
  choice: Dieu s’abstient de punir immédiatement les péchés afin de laisser place à la repentance.
  alternative: Dieu ignore les péchés ou les pardonne déjà entièrement dans cette proposition.
  rationale: Le complément εἰς μετάνοιαν oriente cette attitude vers la repentance; il s’agit donc de patience miséricordieuse, non d’indifférence morale ni nécessairement d’une absolution déjà accordée.
- issue: Valeur de εἰς μετάνοιαν
  choice: afin qu’ils se repentent
  alternative: en vue de la repentance / pour la repentance
  rationale: Le grec permet une nuance de but ou de résultat. La formulation choisie est naturelle et intelligible, tandis qu’une note signale l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier suit l’adresse directe à Dieu. « Êtres humains » évite en français l’ambiguïté actuelle de « hommes » tout en rendant le sens générique du grec.
