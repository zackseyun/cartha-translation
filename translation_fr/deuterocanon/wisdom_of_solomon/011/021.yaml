  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/021.yaml
  text: For it is always in your power to show great strength[a], and who will withstand the might of your arm?
translation:
  language: fr
  text: Car tu peux toujours déployer une grande puissance[a], et qui résistera à la force de ton bras ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « exercer une grande puissance est toujours à ta disposition ».'
    reason: Alternative plus formelle pour πάρεστίν σοι πάντοτε, qui souligne la disponibilité constante de cette puissance.
lexical_decisions:
- source_word: μεγάλως ἰσχύειν
  choice: déployer une grande puissance
  rationale: L’expression associe l’intensification de μεγάλως à l’exercice de la force exprimé par ἰσχύειν. Cette formulation française est naturelle et conserve l’idée d’une puissance exceptionnelle mise en œuvre.
- source_word: πάρεστίν σοι πάντοτε
  choice: tu peux toujours
  rationale: πάρεστίν σοι exprime ici une capacité constamment disponible. La tournure directe « tu peux toujours » rend cette disponibilité avec clarté, sans la réduire à une simple éventualité.
- source_word: κράτει
  choice: à la force
  rationale: κράτος désigne une puissance effective, capable de s’imposer. « Force » convient à la construction avec « résister » et évite de répéter « puissance ».
- source_word: βραχίονός σου
  choice: de ton bras
  rationale: L’image biblique du bras comme manifestation de la puissance divine est conservée littéralement.
- source_word: τίς ἀντιστήσεται
  choice: qui résistera
  rationale: Le futur forme une question rhétorique soulignant que nul ne saurait s’opposer efficacement à Dieu. « Résistera » reste proche du grec sans expliciter la réponse.
theological_decisions:
- issue: Langage anthropomorphique appliqué à la puissance divine
  choice: Conserver « ton bras »
  alternative: Rendre l’image par « ta puissance » ou « ta force »
  rationale: Le grec emploie une image biblique conventionnelle qui donne au verset sa texture littéraire et théologique. La remplacer par une abstraction appauvrirait le texte.
- issue: Portée de πάρεστίν σοι πάντοτε
  choice: 'Exprimer une capacité toujours disponible : « tu peux toujours »'
  alternative: « il est toujours à ta disposition »
  rationale: Le texte affirme la disponibilité constante de la puissance divine sans imposer une formulation abstraite ou maladroite en français.
translation_notes:
  register: Français moderne, international et digne. La syntaxe demeure simple et la question rhétorique est conservée. Le tutoiement correspond à l’adresse directe au Seigneur dans le contexte.
