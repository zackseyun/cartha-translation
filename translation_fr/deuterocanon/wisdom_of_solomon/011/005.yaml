base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/005.yaml
  text: For by the very things through which their enemies were punished[a], they themselves, when in need, were benefited.
translation:
  language: fr
  text: Car c’est par les choses mêmes qui avaient servi à punir leurs ennemis qu’eux-mêmes, dans le besoin, reçurent des bienfaits.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « alors qu’ils étaient désemparés » ou « dans la détresse ». Le participe grec peut évoquer la perplexité, l’impuissance ou le besoin.
    reason: alternative lexicale
lexical_decisions:
- source_word: διʼ ὧν ... διὰ τούτων
  choice: par les choses mêmes qui avaient servi à…
  rationale: Cette formulation conserve la correspondance instrumentale entre les moyens du châtiment et ceux du bienfait, tout en évitant une répétition pesante en français.
- source_word: ἐκολάσθησαν
  choice: avaient servi à punir
  rationale: Le verbe exprime un traitement punitif. La tournure passive grecque est intégrée naturellement à la proposition relative française sans préciser l’agent.
- source_word: οἱ ἐχθροὶ αὐτῶν
  choice: leurs ennemis
  rationale: Rendu direct et idiomatique du groupe nominal possessif.
- source_word: αὐτοὶ
  choice: eux-mêmes
  rationale: L’expression préserve l’emphase et le contraste entre le peuple et ses ennemis.
- source_word: ἀποροῦντες
  choice: dans le besoin
  rationale: Dans ce contexte de secours matériel, cette expression rend le manque et la détresse possibles dans le participe, sans le limiter à la perplexité intellectuelle.
- source_word: εὐεργετήθησαν
  choice: reçurent des bienfaits
  rationale: Cette tournure naturelle conserve le passif de bénéficiaire et le registre de la bienfaisance sans expliciter l’agent.
theological_decisions:
- issue: Renversement instrumental dans l’action divine
  choice: Les mêmes réalités servent à punir les ennemis et à faire du bien au peuple.
  alternative: Généraliser le contraste sans maintenir l’identité des moyens employés.
  rationale: La reprise διʼ ὧν… διὰ τούτων porte le motif littéraire et théologique du renversement. Le français souligne cette identité des moyens sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. « Reçurent des bienfaits » garde le contraste formel avec « punir », tandis que « dans le besoin » demeure naturel. Le marqueur de note est placé après la phrase concernée.
