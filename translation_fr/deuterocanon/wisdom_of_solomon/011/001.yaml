  text: He prospered their works by the hand of a holy prophet[a].
translation:
  language: fr
  text: Elle fit réussir leurs entreprises par la main d’un saint prophète[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: D’après le contexte, ce « saint prophète » est vraisemblablement Moïse, bien que le grec ne le nomme pas dans ce verset.
    reason: Renvoi contextuel permettant d’identifier le personnage sans rendre le texte principal plus explicite que la source.
lexical_decisions:
- source_word: Εὐόδωσεν
  choice: fit réussir
  rationale: Le verbe εὐοδόω exprime ici l’idée de faire réussir ou d’accorder le succès. « Fit réussir » conserve sa valeur causative dans un français actuel.
- source_word: τὰ ἔργα αὐτῶν
  choice: leurs entreprises
  rationale: ἔργα peut désigner des œuvres, des actions ou des entreprises. Dans ce résumé du parcours d’Israël, « entreprises » rend naturellement la portée concrète et collective du terme sans la restreindre à des actes moraux.
- source_word: ἐν χειρὶ
  choice: par la main de
  rationale: Cette expression indique l’intermédiaire ou l’agent. La tournure française conserve l’image biblique de la main tout en restant intelligible.
- source_word: προφήτου ἁγίου
  choice: un saint prophète
  rationale: Le grec ne comporte pas d’article et ne nomme pas le prophète. Cette formulation garde donc le degré d’indétermination du verset.
theological_decisions:
- issue: Sujet sous-entendu du verbe
  choice: « Elle », renvoyant à la Sagesse dans le contexte précédent
  alternative: « Dieu » ou « Le Seigneur »
  rationale: Le grec n’exprime pas le sujet dans ce verset, mais le discours suivi des chapitres précédents présente la Sagesse comme l’actrice. Le français exigeant un pronom genré, « Elle » maintient ce lien contextuel sans introduire un nom absent du verset.
- issue: Identité du saint prophète
  choice: Maintien de la désignation « un saint prophète » dans le texte
  alternative: « Moïse » ou « son saint prophète »
  rationale: Le contexte permet de reconnaître vraisemblablement Moïse, mais le grec ne le nomme pas et n’emploie pas de possessif. Son identification est donc donnée en note plutôt qu’insérée dans le texte.
translation_notes:
  register: Français international moderne, sobre et digne. « Par la main de » conserve volontairement une image biblique traditionnelle; « entreprises » évite l’ambiguïté parfois abstraite de « œuvres » dans ce contexte narratif.
