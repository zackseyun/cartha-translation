  text: or foul masses of smoke being winnowed[a], or terrible sparks flashing from their eyes—whose harm was able not only to crush them together, but even their frightening appearance to destroy them.
translation:
  language: fr
  text: 'ou des masses infectes de fumée, ballottées comme au vannage[a], ou de terribles étincelles jaillissant de leurs yeux : leur pouvoir destructeur aurait pu non seulement les broyer, mais leur seule vue terrifiante aurait pu les anéantir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vannées ». Le grec emploie l’image agricole du vannage pour décrire ces masses de fumée projetées et agitées dans l’air.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βρόμους
  choice: masses infectes
  rationale: Le nom rare évoque ici une matière répugnante ou nocive. « Masses infectes » conserve le caractère concret et menaçant de l’image en lien avec la fumée.
- source_word: λικμωμένους
  choice: ballottées comme au vannage
  rationale: Le participe vient de λικμάω, « vanner ». Cette formulation garde l’image agricole tout en faisant comprendre que les masses de fumée sont projetées et agitées dans l’air.
- source_word: καπνοῦ
  choice: de fumée
  rationale: Le génitif est rendu directement, sans préciser davantage la relation volontairement condensée entre les masses infectes et la fumée.
- source_word: δεινοὺς
  choice: terribles
  rationale: Dans ce contexte, l’adjectif exprime le caractère redoutable et terrifiant, non une qualification morale.
- source_word: σπινθῆρας
  choice: étincelles
  rationale: Équivalent direct qui préserve la vivacité de l’image.
- source_word: ἀστράπτοντας
  choice: jaillissant
  rationale: Le verbe évoque un éclat soudain comparable à l’éclair. Avec des étincelles provenant des yeux, « jaillissant » produit une image naturelle et dynamique en français.
- source_word: βλάβη
  choice: pouvoir destructeur
  rationale: Le grec désigne le dommage ou le mal qu’elles peuvent causer. « Pouvoir destructeur » s’intègre naturellement à la construction française et prépare le verbe « broyer ».
- source_word: συνεκτρῖψαι
  choice: broyer
  rationale: Le composé exprime une destruction par écrasement, possiblement intensive. « Broyer » en restitue la force sans imposer au préfixe συν- une valeur collective incertaine.
- source_word: ἡ ὄψις ἐκφοβήσασα
  choice: leur seule vue terrifiante
  rationale: La formulation exprime que leur apparence, en suscitant l’effroi, pouvait suffire à détruire. « Seule » rend en français l’opposition entre le dommage réel et le simple spectacle terrifiant.
- source_word: διολέσαι
  choice: anéantir
  rationale: Le verbe est fort et signifie détruire entièrement ; « anéantir » en conserve l’intensité.
theological_decisions:
- issue: Degré de littéralité dans l’image condensée des créatures monstrueuses
  choice: Conserver l’image du vannage et les étincelles jaillissant des yeux, avec une légère explicitation idiomatique.
  alternative: Paraphraser par « des nuages de fumée infecte tourbillonnant » et lisser l’ensemble de l’image.
  rationale: Le grec est volontairement étrange, concret et poétique. La traduction maintient cette étrangeté sans rendre la phrase obscure en français ; aucun enjeu doctrinal ne justifie de résoudre davantage l’image.
- issue: Référent de ὧν et portée de βλάβη
  choice: Faire porter « leur pouvoir destructeur » collectivement sur les phénomènes ou créatures décrits.
  alternative: Rattacher la proposition aux seules étincelles ou expliciter un référent précis absent de ce verset.
  rationale: Le relatif grec peut reprendre collectivement les éléments précédents. La traduction préserve cette portée sans ajouter un référent non exprimé.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La phrase conserve la vigueur et l’étrangeté poétiques du grec. Le deux-points clarifie le passage de l’énumération à la proposition relative.
