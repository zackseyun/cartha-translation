base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/009.yaml
  text: For when they were tested[a], though being disciplined with mercy, they learned how the ungodly were tormented while being judged in wrath[c][b];
translation:
  language: fr
  text: Car, lorsqu’ils furent mis à l’épreuve[a], bien qu’ils fussent corrigés avec miséricorde[b], ils comprirent comment les impies[c], jugés avec colère, étaient tourmentés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « éprouvés » ; le grec évoque ici une mise à l’épreuve, non principalement une incitation à pécher.
    reason: lexical_alternative
  - marker: b
    text: Ou « instruits » ou « disciplinés » ; le terme grec peut désigner l’éducation, la formation et la correction.
    reason: lexical_alternative
  - marker: c
    text: Ou « les méchants » ; le mot grec souligne particulièrement l’impiété envers Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειράσθησαν
  choice: furent mis à l’épreuve
  rationale: Le verbe désigne ici une mise à l’épreuve qui révèle ou éprouve, plutôt qu’une incitation au péché.
- source_word: καίπερ
  choice: tout en
  rationale: Cette tournure restitue naturellement en français la nuance concessive liée au participe.
- source_word: ἐν ἐλέει
  choice: avec miséricorde
  rationale: La préposition exprime ici la manière ou le cadre de la correction; cette formulation conserve le substantif ἔλεος.
- source_word: παιδευόμενοι
  choice: étant corrigés
  rationale: Le verbe peut évoquer l’éducation, la formation ou la discipline corrective. « Corrigés » convient au contraste avec le jugement coléreux des impies.
- source_word: ἔγνωσαν
  choice: ils comprirent
  rationale: L’aoriste décrit une prise de conscience acquise par l’expérience; « comprirent » est naturel et n’ajoute pas une connaissance purement intellectuelle.
- source_word: ἐν ὀργῇ
  choice: avec colère
  rationale: La formulation indique la manière dont s’exerce le jugement et conserve la force de ὀργή sans préciser davantage la nature de cette colère.
- source_word: κρινόμενοι
  choice: jugés
  rationale: Rendu direct qui évite d’introduire la notion plus forte et plus définitive de condamnation.
- source_word: ἀσεβεῖς
  choice: les impies
  rationale: « Impies » conserve la dimension d’irrévérence envers Dieu, plus précise que le terme général « méchants ».
- source_word: ἐβασανίζοντο
  choice: étaient tourmentés
  rationale: Le verbe exprime une souffrance intense; « tourmentés » en rend la gravité sans en préciser indûment le moyen.
theological_decisions:
- issue: Nature de l’épreuve des justes par contraste avec la souffrance des impies
  choice: La souffrance des premiers est présentée comme une correction exercée avec miséricorde, tandis que celle des impies relève d’un jugement avec colère.
  alternative: Traduire παιδευόμενοι par « instruits » ou, plus sévèrement, par « châtiés ».
  rationale: Le verset oppose explicitement une correction miséricordieuse à un jugement accompagné de colère. « Corrigés » maintient la dimension éducative et pénible sans confondre les deux traitements.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le contraste entre correction miséricordieuse et jugement avec colère, tout en évitant un calque trop lourd du grec.
