base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/010.yaml
  text: For these you tested by admonishing them as a father[b][a], but those you examined by condemning them as a stern king.
translation:
  language: fr
  text: Car ceux-ci, tu les as mis à l’épreuve en les avertissant comme un père[a] ; mais ceux-là, tu les as examinés en les condamnant comme un roi sévère[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en les reprenant comme un père ».
    reason: lexical_alternative
  - marker: b
    text: Ou « comme un roi rigoureux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτους μὲν ... ἐκείνους δὲ
  choice: ceux-ci… mais ceux-là
  rationale: Préserve le contraste explicite entre les deux groupes sans les identifier dans le verset au-delà de ce que disent les démonstratifs grecs.
- source_word: ὡς πατὴρ
  choice: comme un père
  rationale: Conserve directement la comparaison et l’image paternelle.
- source_word: νουθετῶν
  choice: en les avertissant
  rationale: Exprime l’instruction corrective et la mise en garde, sans réduire le verbe à un simple enseignement ni lui donner nécessairement le sens d’un châtiment.
- source_word: ἐδοκίμασας
  choice: tu les as mis à l’épreuve
  rationale: Rend l’idée d’éprouver ou de tester la qualité d’une personne, dans une formulation française naturelle.
- source_word: ἀπότομος
  choice: sévère
  rationale: Traduit la rigueur tranchante et inflexible du terme grec dans un registre digne et courant.
- source_word: βασιλεὺς
  choice: roi
  rationale: Conserve le sens concret et l’image royale du grec.
- source_word: καταδικάζων
  choice: en les condamnant
  rationale: 'Maintient la portée judiciaire du participe : il s’agit de prononcer un jugement défavorable.'
- source_word: ἐξήτασας
  choice: tu les as examinés
  rationale: Rend l’idée d’un examen poussé tout en distinguant ce verbe de ἐδοκίμασας, traduit par « mis à l’épreuve ».
theological_decisions:
- issue: Différence entre la manière dont Dieu traite les deux groupes
  choice: Le premier groupe est mis à l’épreuve dans le cadre d’un avertissement paternel ; le second est examiné et condamné avec la sévérité d’un roi.
  alternative: Ramener les deux propositions à une même idée générale d’épreuve ou de jugement.
  rationale: Le grec emploie des images, des participes et des verbes distincts. La traduction maintient donc la tension entre correction paternelle et condamnation royale sans les confondre.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme antithétique du grec est conservé par « ceux-ci… mais ceux-là », ainsi que la distinction entre « mis à l’épreuve » et « examinés ».
