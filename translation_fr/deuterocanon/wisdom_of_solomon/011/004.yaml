base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/004.yaml
  text: They were thirsty and called on you[a], and water was given to them from a sheer rock[b], and a remedy for thirst from hard stone.
translation:
  language: fr
  text: Ils eurent soif et t’invoquèrent ; de l’eau leur fut donnée, provenant d’un rocher à pic[a], et, d’une pierre dure, un remède contre la soif.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’un rocher abrupt » ; le grec évoque une paroi escarpée ou taillée à pic.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίψησαν
  choice: Ils eurent soif
  rationale: Cette tournure rend naturellement en français moderne l’aoriste de διψάω et exprime l’état de besoin sans l’alourdir.
- source_word: ἐπεκαλέσαντό σε
  choice: t’invoquèrent
  rationale: Le moyen de ἐπικαλέω désigne ici un appel adressé à Dieu. « T’invoquèrent » conserve la portée religieuse et reste clair dans un registre biblique digne.
- source_word: ἐδόθη αὐτοῖς
  choice: leur fut donnée
  rationale: Le passif grec est maintenu afin de ne pas expliciter le donateur, même si le contexte indique l’action divine.
- source_word: ἐκ πέτρας ἀκροτόμου
  choice: d’un rocher à pic
  rationale: ἀκρότομος évoque ce qui est abrupt, escarpé ou taillé à pic. Cette expression française souligne le caractère improbable de la source d’eau.
- source_word: ὕδωρ
  choice: de l’eau
  rationale: Équivalent direct et naturel du nom grec.
- source_word: ἄκος δίψης
  choice: un remède à leur soif
  rationale: ἄκος signifie un remède ou un moyen de guérison. La formulation conserve la métaphore curative tout en précisant naturellement en français qu’il s’agit de leur soif.
- source_word: ἐκ λίθου σκληροῦ
  choice: d’une pierre dure
  rationale: Traduction directe de la formule grecque, qui maintient le parallélisme avec le rocher à pic.
theological_decisions:
- issue: Faut-il désigner explicitement Dieu comme celui qui donne l’eau ?
  choice: Conserver le passif « leur fut donnée » sans ajouter « par toi ».
  alternative: « tu leur donnas de l’eau »
  rationale: Bien que le contexte attribue clairement le don à Dieu, le grec laisse l’agent implicite. La traduction respecte cette retenue.
- issue: Force de la métaphore ἄκος δίψης
  choice: « un remède à leur soif »
  alternative: « de quoi étancher leur soif »
  rationale: Le terme ἄκος présente l’eau comme un secours réparateur ou curatif. Le rendre par « remède » préserve cette image au lieu de la réduire à la simple satisfaction d’un besoin.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme des deux groupes introduits par « d’un » et « d’une » est conservé, ainsi que l’ellipse verbale du dernier membre.
