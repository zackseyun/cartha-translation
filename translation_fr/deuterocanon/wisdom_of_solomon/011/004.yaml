revisions:
- from: Ils eurent soif et t’invoquèrent, et de l’eau leur fut donnée d’un rocher à pic[a], et, d’une pierre dure, un remède à leur soif.
  to: Ils eurent soif et t’invoquèrent ; de l’eau leur fut donnée, provenant d’un rocher à pic[a], et, d’une pierre dure, un remède contre la soif.
  rationale: La révision conserve le passif grec et les deux sources minérales en parallèle, mais lève l’ambiguïté française en rattachant explicitement « provenant d’un rocher à pic » à l’eau. Elle rend également ἄκος δίψης par « un remède contre la soif », formulation idiomatique qui préserve la métaphore curative sans ajouter de possessif absent du grec.
  reviewer_model: gpt-5.6-terra
