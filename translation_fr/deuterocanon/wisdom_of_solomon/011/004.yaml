review_pass:
  verdict: revise
  source_fidelity: 'Le projet rend fidèlement la succession grecque : soif, invocation, eau donnée d’un rocher abrupt, puis image médicinale du remède. Le passif de ἐδόθη est justement préservé. Toutefois, « de l’eau leur fut donnée d’un rocher » est syntaxiquement susceptible de faire entendre que le rocher est le donateur plutôt que la provenance de l’eau. « Leur soif » interprète légèrement le génitif δίψης, qui demeure général dans le grec.'
  naturalness: « Ils eurent soif et t’invoquèrent » convient à un français biblique moderne. La reformulation proposée clarifie naturellement le lien de provenance sans ajouter d’agent divin explicite. « Un remède contre la soif » est plus idiomatique que « un remède à leur soif » tout en conservant la métaphore.
  terminology: « Invoquèrent », « rocher à pic », « pierre dure » et « remède » sont appropriés. La note sur ἀκροτόμου est utile et son ancrage est correctement placé après « rocher à pic ».
  issues:
  - severity: medium
    issue: Ambiguïté syntaxique de « de l’eau leur fut donnée d’un rocher à pic »
    rationale: En français, le complément introduit par « de » peut se rattacher maladroitement à « fut donnée » et suggérer un don provenant du rocher comme agent. Il faut expliciter que l’eau provient du rocher, sans expliciter l’agent du passif.
  - severity: low
    issue: « leur soif » rend le génitif δίψης de manière plus particularisée
    rationale: Le grec dit littéralement « remède de/contre la soif » sans pronom possessif. Une formulation générale conserve plus exactement l’expression poétique tout en restant naturelle.
  revised_text: Ils eurent soif et t’invoquèrent ; de l’eau leur fut donnée, provenant d’un rocher à pic[a], et, d’une pierre dure, un remède contre la soif.
  revised_footnotes:
  - marker: a
    text: 'Ou : « d’un rocher abrupt » ; le grec évoque une paroi escarpée ou taillée à pic.'
    reason: lexical_alternative
  revision_rationale: La révision conserve le passif grec et les deux sources minérales en parallèle, mais lève l’ambiguïté française en rattachant explicitement « provenant d’un rocher à pic » à l’eau. Elle rend également ἄκος δίψης par « un remède contre la soif », formulation idiomatique qui préserve la métaphore curative sans ajouter de possessif absent du grec.
