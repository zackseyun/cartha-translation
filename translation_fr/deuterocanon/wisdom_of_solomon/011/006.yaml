lexical_decisions:
- source_word: ἀντί
  choice: Au lieu de
  rationale: 'Exprime ici le remplacement : les Égyptiens reçoivent du sang à la place de la source d’eau attendue.'
- source_word: πηγῆς
  choice: source
  rationale: Désigne une source ou un point d’où jaillit l’eau ; « source » est précis et naturel en français moderne.
- source_word: ἀενάου
  choice: qui coule sans cesse
  rationale: Rend l’idée d’un écoulement continuel dans une formulation française claire, tout en rattachant l’adjectif au fleuve.
- source_word: ποταμοῦ
  choice: fleuve
  rationale: Sens courant du terme grec ; « fleuve » convient particulièrement à l’allusion au Nil sans expliciter celui-ci.
- source_word: αἵματι
  choice: par un sang
  rationale: Le datif indique ici ce qui provoque le trouble ; l’article indéfini permet au français de conserver la caractérisation concrète qui suit.
- source_word: λυθώδει
  choice: bourbeux
  rationale: Évoque une matière boueuse ou fangeuse et souligne le caractère souillé du liquide.
- source_word: ταραχθέντες
  choice: ils furent troublés
  rationale: Conserve la valeur passive du participe et son possible double effet, à la fois bouleversement concret causé par le fléau et désarroi de ceux qui le subissent.
theological_decisions:
- issue: Allusion au fléau qui frappe les eaux d’Égypte
  choice: Maintenir l’expression elliptique « ils furent troublés par un sang bourbeux »
  alternative: 'Expliciter : « par l’eau changée en sang bourbeux » ou nommer le Nil'
  rationale: Le grec suppose le contexte de l’Exode sans nommer ici ni l’eau ni le Nil. L’ellipse préserve la densité poétique et évite d’ajouter une précision absente du texte.
translation_notes:
  register: Français international moderne, sobre et poétique. La virgule finale est conservée parce que le verset forme une proposition participiale qui se poursuit dans le contexte immédiat.
