base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/026.yaml
  text: But you spare all things[a], because they are yours, O Master who loves life. For your imperishable spirit is in all things.
translation:
  language: fr
  text: Mais tu épargnes tout, parce que tout est à toi, Maître, toi qui aimes la vie[a]. Car ton esprit impérissable est en toutes choses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «toi qui aimes les âmes». Le grec φιλόψυχε peut désigner celui qui aime la vie ou les êtres vivants, mais aussi celui qui aime les âmes. Le contexte met ici l’accent sur le soin de Dieu pour toute la création.
    reason: lexical_alternative
lexical_decisions:
- source_word: φείδῃ
  choice: tu épargnes
  rationale: Le verbe exprime le fait d’épargner ou de s’abstenir de détruire; cette formulation concise conserve directement l’idée de retenue divine.
- source_word: πάντων
  choice: tout
  rationale: Avec φείδῃ, le génitif pluriel embrasse l’ensemble de la création; «tout» est naturel en français et garde cette portée universelle.
- source_word: σά ἐστιν
  choice: tout est à toi
  rationale: Le possessif grec renvoie à la totalité évoquée juste avant; cette tournure française en rend clairement le sens.
- source_word: Δέσποτα
  choice: Maître
  rationale: Δέσποτα désigne le maître ou possesseur investi d’autorité; «Maître» préserve sa distinction lexicale par rapport à κύριος.
- source_word: φιλόψυχε
  choice: toi qui aimes la vie
  rationale: Le composé peut se rapporter à la vie ou à l’âme. Dans le contexte du soin accordé à toute la création, «qui aimes la vie» restitue naturellement sa portée large sans masquer l’autre possibilité.
- source_word: ἄφθαρτόν
  choice: impérissable
  rationale: Le terme qualifie ce qui n’est pas soumis à la corruption ou à la destruction; «impérissable» est clair, digne et précis.
- source_word: πνεῦμά
  choice: esprit
  rationale: Ici, πνεῦμα désigne l’esprit de Dieu présent dans la création plutôt qu’un simple souffle; «esprit» conserve la portée théologique du terme.
- source_word: ἐν πᾶσιν
  choice: en toutes choses
  rationale: Cette expression maintient la portée universelle du neutre pluriel grec et fait écho à «tout» dans la première proposition.
theological_decisions:
- issue: Portée de φιλόψυχε dans l’expression de l’amour divin
  choice: toi qui aimes la vie
  alternative: toi qui aimes les âmes
  rationale: Le contexte immédiat parle de tout ce qui appartient à Dieu et de son esprit présent en toutes choses, ce qui favorise une portée créationnelle large. Une note conserve néanmoins la lecture plus étroite liée aux âmes.
- issue: Traduction du titre Δέσποτα
  choice: Maître
  alternative: Seigneur; Souverain
  rationale: «Maître» rend le titre grec sans le confondre avec κύριος et sans ajouter l’interprétation plus abstraite impliquée par «Souverain».
- issue: Nature du πνεῦμα divin présent en toutes choses
  choice: ton esprit impérissable
  alternative: ton souffle impérissable
  rationale: «Esprit» respecte la formulation théologique du texte, tandis que «souffle» pourrait réduire le sens à une force vitale. La phrase laisse intacte la tension propre à l’affirmation de sa présence en toutes choses.
translation_notes:
  register: Français international moderne, naturel et digne. La reprise de «tout» puis «toutes choses» conserve l’ampleur cosmique et l’écho interne du grec. L’apostrophe «Maître, toi qui aimes la vie» évite une construction adjectivale artificielle tout en gardant le caractère solennel de l’adresse.
