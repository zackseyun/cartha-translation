base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/025.yaml
  text: For how could anything have remained[a], if you had not willed it? Or how could what had not been called by you have been preserved?
translation:
  language: fr
  text: Comment donc quoi que ce soit aurait-il pu subsister si tu ne l’avais pas voulu ? Ou comment ce que tu n’avais pas appelé[a] aurait-il pu être préservé ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus explicite : « appelé à l’existence ». Le grec dit simplement « appelé », mais le contexte peut évoquer l’appel créateur de Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δὲ
  choice: Comment donc
  rationale: Introduit une question rhétorique et marque la progression de l’argument ; « donc » rend naturellement δέ dans ce contexte.
- source_word: ἔμεινεν ἄν τι
  choice: quoi que ce soit aurait-il pu subsister
  rationale: Le potentiel irréel exprimé par ἄν appelle « aurait pu » ; « subsister » traduit ici μένω comme maintien dans l’existence, tandis que « quoi que ce soit » souligne la portée indéfinie de τι.
- source_word: εἰ μὴ σὺ ἠθέλησας
  choice: si tu ne l’avais pas voulu
  rationale: Le plus-que-parfait français convient à la condition irréelle. « Voulu » exprime la volonté délibérée sans ajouter une précision doctrinale absente du grec ; le pronom « tu » porte naturellement l’accent de σὺ.
- source_word: τὸ μὴ κληθὲν ὑπὸ σοῦ
  choice: ce que tu n’avais pas appelé
  rationale: Conserve le sens littéral de κληθέν, « appelé », et l’agence divine, sans expliciter dans le texte principal l’idée plausible mais implicite d’un appel à l’existence.
- source_word: διετηρήθη
  choice: aurait-il pu être préservé
  rationale: Le verbe indique le fait d’être gardé ou maintenu. « Préservé » respecte la voix passive et convient au contexte du maintien dans l’existence.
theological_decisions:
- issue: Faut-il expliciter τὸ μὴ κληθέν comme un appel créateur à l’existence ?
  choice: Garder « ce que tu n’avais pas appelé » dans le texte principal.
  alternative: « ce que tu n’avais pas appelé à l’existence » ou « ce que tu n’avais pas fait venir à l’existence par ton appel »
  rationale: Le contexte permet de comprendre un appel créateur, mais le grec dit simplement « appelé ». La formulation principale préserve cette retenue et la note signale l’interprétation contextuelle sans l’imposer.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les deux questions rhétoriques parallèles sont conservées, avec « subsister » et « être préservé » pour exprimer la dépendance continue de toute réalité envers la volonté divine.
