base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/017.yaml
  text: For your almighty hand[a], which created the world out of formless matter, was not powerless to send upon them a multitude of bears or fierce lions,
translation:
  language: fr
  text: Car ta main toute-puissante, qui a créé le monde à partir d’une matière informe[a], ne manquait pas de pouvoir envoyer contre eux un grand nombre d’ours ou des lions féroces,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à partir d’une matière sans forme ». Cette expression grecque relève du langage cosmologique hellénistique; il ne faut pas lui faire trancher à elle seule les débats doctrinaux ultérieurs sur le mode de création.
    reason: Préciser la variante lexicale et préserver la portée exacte, mais limitée, de l’expression grecque.
lexical_decisions:
- source_word: ἠπόρει
  choice: ne manquait pas de pouvoir
  rationale: ἀπορέω peut exprimer le manque de moyens ou l’incapacité. Avec la négation, cette formulation française conserve la litote grecque tout en restant naturelle.
- source_word: παντοδύναμός
  choice: toute-puissante
  rationale: Cet équivalent courant rend la pleine puissance attribuée à la main divine sans recourir au terme plus technique « omnipotente ».
- source_word: χείρ
  choice: main
  rationale: Le texte emploie l’image de la main pour désigner l’action et la puissance divines; la conserver maintient la force concrète de la métaphore.
- source_word: κτίσασα
  choice: qui a créé
  rationale: Le participe se rapporte à « main » et fonde l’argument sur l’acte créateur de Dieu. Une proposition relative est naturelle en français.
- source_word: κόσμον
  choice: le monde
  rationale: κόσμος désigne ici le monde créé; « le monde » est idiomatique et évite de préciser indûment « l’univers ».
- source_word: ἐξ ἀμόρφου ὕλης
  choice: à partir d’une matière informe
  rationale: La traduction conserve l’expression cosmologique hellénistique et son indétermination sans lui imposer une conclusion doctrinale ultérieure.
- source_word: ἐπιπέμψαι
  choice: envoyer contre eux
  rationale: Le composé verbal exprime ici un envoi dirigé contre les personnes visées dans un contexte de jugement.
- source_word: πλῆθος
  choice: un grand nombre de
  rationale: Cette tournure française rend clairement l’idée quantitative de πλῆθος et convient mieux à des animaux que « une multitude de » dans le registre courant.
- source_word: θρασεῖς
  choice: féroces
  rationale: Dans le contexte de prédateurs envoyés comme jugement, « féroces » exprime naturellement le caractère menaçant de θρασεῖς.
theological_decisions:
- issue: La litote exprimant la capacité divine
  choice: ne manquait pas de pouvoir envoyer
  alternative: pouvait envoyer
  rationale: Cette formulation garde la négation rhétorique du grec et relie la capacité de juger à la puissance créatrice, sans renforcer le propos au-delà du texte.
- issue: Le sens cosmologique de ἐξ ἀμόρφου ὕλης
  choice: à partir d’une matière informe
  alternative: à partir d’une matière sans forme
  rationale: Le texte évoque une matière informe dans un langage cosmologique hellénistique. La traduction préserve cette formulation sans prétendre trancher la question doctrinale du mode de création.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore de la main et la litote du grec sont conservées; le marqueur de note est placé après l’expression qu’il explique.
