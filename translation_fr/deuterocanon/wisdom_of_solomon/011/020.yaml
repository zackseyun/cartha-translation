base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/020.yaml
  text: And even apart from these things, they could have fallen by a single breath, pursued by justice and winnowed by the breath of your power; but you have arranged all things by measure and number and weight.
translation:
  language: fr
  text: Et même sans cela, ils auraient pu tomber par un seul souffle[a], poursuivis par la justice[b] et vannés par le souffle de ta puissance ; mais tu as tout disposé avec mesure, nombre et poids.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par un seul vent » ou « par un seul esprit » ; le grec πνεῦμα peut signifier « souffle », « vent » ou « esprit ».
    reason: lexical_alternative
  - marker: b
    text: Ou « poursuivis par le jugement » ou « poursuivis par le châtiment » ; le grec δίκη peut désigner la justice, le jugement ou la peine.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ τούτων
  choice: Et même sans cela
  rationale: χωρίς avec le génitif exprime l’idée de séparation ou d’absence. « Sans cela » renvoie naturellement en français aux moyens de jugement évoqués auparavant, tandis que « même » fait ressortir le contraste.
- source_word: ἐνὶ πνεύματι
  choice: sous un seul souffle
  rationale: ἐνί signifie ici « un seul ». πνεῦμα peut désigner le souffle, le vent ou l’esprit ; « souffle » convient à la force physique suggérée par l’image du vannage sans imposer une lecture pneumatologique.
- source_word: πεσεῖν
  choice: tomber
  rationale: Le verbe πίπτω signifie littéralement « tomber ». Dans ce contexte, la chute implique la destruction, mais le maintien du verbe concret évite d’expliciter plus que le grec.
- source_word: ὑπὸ τῆς δίκης διωχθέντες
  choice: poursuivis par la justice
  rationale: δίκη peut désigner la justice, le jugement ou la peine. « Justice » conserve ici la personnification d’une puissance qui poursuit.
- source_word: λικμηθέντες
  choice: dispersés comme la balle
  rationale: λικμάω évoque le vannage, au cours duquel le vent emporte la balle. Cette formulation restitue en français courant l’image agricole et son effet de dispersion.
- source_word: ὑπὸ πνεύματος δυνάμεώς σου
  choice: par le souffle de ta puissance
  rationale: Le second πνεῦμα reprend l’image d’une force soufflante qui disperse. Le génitif δυνάμεώς σου est conservé sans être transformé en adjectif.
- source_word: ἀλλὰ πάντα ... διέταξας
  choice: mais tu as tout disposé
  rationale: διατάσσω signifie ordonner, arranger ou disposer. « Disposé » exprime l’établissement intentionnel d’un ordre et s’accorde naturellement avec la triade qui suit.
- source_word: μέτρῳ καὶ ἀριθμῷ καὶ σταθμῷ
  choice: avec mesure, nombre et poids
  rationale: Les trois datifs indiquent les principes ou moyens selon lesquels tout est ordonné. La formulation concise préserve la solennité de la triade grecque ; σταθμός désigne ici le poids déterminé par la pesée.
theological_decisions:
- issue: Faut-il rendre πνεῦμα par « souffle », « vent » ou « esprit » ?
  choice: Les deux occurrences sont rendues par « souffle ».
  alternative: « vent » ou « esprit »
  rationale: Le contexte du vannage favorise une force soufflante concrète. « Souffle » préserve néanmoins une résonance possible avec l’action divine, sans transformer le terme en référence explicite à l’Esprit.
- issue: Faut-il rendre δίκη par « justice », « jugement » ou « châtiment » ?
  choice: justice
  alternative: « jugement », « peine » ou « châtiment »
  rationale: La construction présente δίκη comme l’agent personnifié qui poursuit. « Justice » conserve mieux cette personnification et l’idée d’ordre moral, tandis que « châtiment » en limiterait le sens à la sanction.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve la progression et la triade solennelle du grec. « Dispersés comme la balle » explicite juste assez l’image du vannage pour qu’elle reste compréhensible aujourd’hui, sans effacer sa force poétique.
