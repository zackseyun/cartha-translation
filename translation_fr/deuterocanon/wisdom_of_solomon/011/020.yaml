  - severity: medium
    issue: « dispersés comme la balle » pour λικμηθέντες
    rationale: Le participe signifie « vannés » (ou soumis au vannage). La comparaison explicite « comme la balle » n’est pas exprimée dans le grec et remplace l’image du vannage par son résultat interprété.
