base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/015.yaml
  text: But in return for the foolish reasonings of their unrighteousness[a], by which, having been led astray, they worshiped irrational creeping things and worthless beasts, you sent upon them a multitude of irrational animals for punishment[c][b],
translation:
  language: fr
  text: Mais, en retour des raisonnements insensés auxquels les poussait leur iniquité[a], dans lesquels ils s’étaient égarés, ils rendaient un culte à des animaux rampants dépourvus de raison et à des bêtes méprisables ; tu as envoyé contre eux une multitude d’animaux dépourvus de raison[b], pour les châtier[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des pensées insensées de leur iniquité » ou « des raisonnements insensés de leur injustice ».'
    reason: La relation du génitif ἀδικίας avec λογισμῶν et l’étendue de sens de λογισμοί permettent ces formulations.
  - marker: b
    text: Le grec emploie deux fois le même mot, rendu ici par « dépourvus de raison », créant un écho entre les animaux adorés et ceux envoyés pour les châtier.
    reason: Cette répétition lexicale porte l’ironie et la logique de correspondance du verset.
  - marker: c
    text: 'Ou : « en rétribution » ou « pour exercer la vengeance ».'
    reason: ἐκδίκησις couvre les notions de châtiment, de rétribution et de vengeance judiciaire.
lexical_decisions:
- source_word: ἀντὶ
  choice: en retour de
  rationale: Dans ce contexte de jugement correspondant à la faute, l’expression marque la rétribution plutôt qu’une simple substitution.
- source_word: λογισμῶν ἀσυνέτων
  choice: raisonnements insensés
  rationale: « Raisonnements » conserve la dimension réflexive de λογισμοί, tandis qu’« insensés » exprime leur caractère déraisonnable et moralement fautif.
- source_word: ἀδικίας αὐτῶν
  choice: leur iniquité
  rationale: « Iniquité » garde la portée morale et religieuse de ἀδικία sans limiter le terme à l’injustice sociale.
- source_word: πλανηθέντες
  choice: égarés
  rationale: Le participe passif indique qu’ils sont tombés dans l’erreur; « égarés » convient au contexte religieux sans préciser indûment l’agent.
- source_word: ἐθρήσκευον
  choice: rendaient un culte à
  rationale: Cette expression française naturelle désigne clairement la pratique religieuse idolâtre.
- source_word: ἄλογα ἑρπετὰ
  choice: animaux rampants dépourvus de raison
  rationale: « Animaux rampants » rend ἑρπετά, et « dépourvus de raison » permet de reprendre le même vocabulaire pour le second ἄλογος.
- source_word: κνώδαλα εὐτελῆ
  choice: bêtes méprisables
  rationale: « Bêtes » distingue κνώδαλα de ζῷα, et « méprisables » restitue la nuance dépréciative de εὐτελῆ.
- source_word: ἐπαπέστειλας
  choice: tu as envoyé contre eux
  rationale: Le composé verbal prend ici une valeur hostile et judiciaire, bien rendue par « contre eux ».
- source_word: πλῆθος ἀλόγων ζῴων
  choice: une multitude d’animaux dépourvus de raison
  rationale: La formulation conserve à la fois l’idée de grand nombre et la reprise rhétorique de ἄλογος.
- source_word: εἰς ἐκδίκησιν
  choice: pour les châtier
  rationale: Le contexte présente ces animaux comme l’instrument d’une sanction judiciaire; « châtier » reste fort sans imposer la nuance passionnelle de « vengeance ».
theological_decisions:
- issue: Portée morale et religieuse de ἀδικία
  choice: leur iniquité
  alternative: leur injustice; leur faute
  rationale: L’idolâtrie, le raisonnement corrompu et le jugement divin sont étroitement liés; « iniquité » préserve cette ampleur morale et théologique.
- issue: Répétition de ἄλογος
  choice: dépourvus de raison … dépourvus de raison
  alternative: irrationnels … irrationnels; sans raison … sans raison
  rationale: 'La répétition fait ressortir l’ironie du texte : ceux qui ont vénéré des créatures dépourvues de raison sont punis par des animaux de même nature.'
- issue: Valeur de ἐκδίκησις dans le jugement divin
  choice: châtier
  alternative: exercer la rétribution; se venger
  rationale: « Châtier » exprime le jugement punitif sans réduire le terme à une vengeance émotionnelle; les autres nuances sont signalées en note.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La phrase conserve l’adresse directe à Dieu au singulier (« tu »), la structure de rétribution et l’écho lexical central. Les tirets clarifient la longue subordination grecque tout en maintenant son lien logique.
