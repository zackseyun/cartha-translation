base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/008.yaml
  text: You gave them abundant water unexpectedly[a], showing through their thirst at that time how you punished their adversaries.
translation:
  language: fr
  text: Tu leur as donné de l’eau en abondance contre toute attente[a], montrant par la soif qu’ils avaient alors comment tu as puni leurs adversaires.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de manière inespérée » ou « alors qu’ils ne s’y attendaient pas ».
    reason: ἀνελπίστως peut évoquer aussi bien ce qui survient contre toute attente que ce qui est reçu au-delà de tout espoir.
lexical_decisions:
- source_word: ἔδωκας
  choice: Tu leur as donné
  rationale: L’aoriste de δίδωμι exprime ici simplement le don accompli; le tutoiement convient à l’adresse directe à Dieu dans le contexte.
- source_word: δαψιλὲς ὕδωρ
  choice: une eau abondante
  rationale: δαψιλής souligne la grande quantité ou la profusion; « une eau abondante » reste naturel et digne en français.
- source_word: ἀνελπίστως
  choice: contre toute attente
  rationale: Cette expression rend le caractère inattendu, voire inespéré, du don sans imposer exclusivement la nuance subjective de perte d’espoir.
- source_word: δείξας
  choice: montrant
  rationale: Le participe aoriste indique une circonstance accompagnant le don et conserve le lien explicatif sans le surinterpréter.
- source_word: διὰ τοῦ τότε δίψους
  choice: par la soif qu’ils avaient alors
  rationale: « Par » garde la valeur instrumentale de διά; la relative rend τότε de manière naturelle et rattache clairement la soif aux bénéficiaires.
- source_word: πῶς
  choice: comment
  rationale: Introduit la manière dont le châtiment des adversaires a été manifesté.
- source_word: τοὺς ὑπεναντίους
  choice: leurs adversaires
  rationale: Le nom désigne ceux qui s’opposent; le possessif, fourni par le contexte, explicite le rapport avec le peuple sans nommer directement les Égyptiens.
- source_word: ἐκόλασας
  choice: tu avais puni
  rationale: κολάζω désigne ici une action punitive. Le plus-que-parfait français situe naturellement ce châtiment par rapport à la démonstration évoquée, tout en conservant la valeur passée de l’aoriste.
theological_decisions:
- issue: Référents de « leur » et de « leurs adversaires »
  choice: 'Conserver les pronoms contextuels: le premier groupe est le peuple auquel Dieu donne l’eau, le second ses adversaires.'
  alternative: Nommer explicitement Israël et les Égyptiens.
  rationale: Le contexte de Sagesse 11 favorise Israël et ses oppresseurs égyptiens, mais le grec du verset reste pronominal; la traduction préserve donc cette formulation sans réduire sa portée typologique ou générale.
- issue: Rapport entre la soif du peuple et le châtiment des adversaires
  choice: Conserver la formulation instrumentale « par la soif… comment ».
  alternative: Expliciter que l’épreuve légère du peuple lui faisait comprendre les tourments infligés aux adversaires.
  rationale: L’explication développée ressort du contexte, mais le verset grec formule le rapport avec concision. La traduction maintient cette tension plutôt que d’ajouter une interprétation.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. L’adresse à Dieu est rendue par « tu », conformément à l’usage biblique français courant. La syntaxe conserve le participe explicatif et la concision du grec.
