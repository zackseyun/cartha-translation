  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « pour servir de réprobation à l’égard d’un décret qui tue des nourrissons ».'
    reason: Alternative lexicale et syntaxique qui conserve la valeur nominale de ἔλεγχον et le caractère adjectival de νηπιοκτόνου.
lexical_decisions:
- source_word: εἰς
  choice: pour
  rationale: Dans ce fragment dépendant de la phrase environnante, εἰς exprime la finalité ou le résultat. « Pour » rend cette fonction simplement et naturellement.
- source_word: ἔλεγχον
  choice: condamner
  rationale: ἔλεγχος peut désigner la réfutation, la mise en lumière d’une faute ou la réprobation. La tournure verbale « pour condamner » exprime ici le jugement porté sur l’ordre égyptien sans réduire le terme à une simple critique verbale.
- source_word: νηπιοκτόνου
  choice: qui faisait tuer les nourrissons
  rationale: L’adjectif signifie littéralement « meurtrier de nourrissons ». Une proposition relative est plus naturelle en français et montre que le décret ordonnait leur mise à mort. « Nourrissons » conserve la précision de νήπιος mieux que le terme plus large « enfants ».
- source_word: διατάγματος
  choice: le décret
  rationale: διατάγματος désigne une prescription officielle. « Décret » est clair en français moderne et convient à l’allusion à l’ordre donné en Égypte.
theological_decisions:
- issue: Allusion historique et théologique à la mise à mort des nourrissons hébreux en Égypte
  choice: « le décret qui faisait tuer les nourrissons »
  alternative: « le décret meurtrier de nourrissons »
  rationale: Le grec est compact et adjectival. La formulation retenue maintient concrètement l’allusion historique tout en évitant d’ajouter l’identité de l’auteur du décret, absente de ce fragment.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste intelligible comme fragment de la phrase environnante; la note conserve la construction nominale et la force compacte du grec.
