lexical_decisions:
- source_word: φθειρόμενον
  choice: détruit
  rationale: Dans ce contexte matériel lié au feu, le participe désigne le fait de périr ou d’être consumé, non une corruption morale. « Détruit » conserve la portée générale du grec.
- source_word: ἁπλῶς
  choice: tout simplement
  rationale: 'L’adverbe souligne le contraste étonnant : ce que le feu ne détruisait pas fondait sous l’effet d’un simple rayon solaire. Cette place donne une phrase française naturelle sans surinterpréter le rapport syntaxique.'
- source_word: βραχείας
  choice: bref
  rationale: Avec « rayon de soleil », l’adjectif peut évoquer une faible durée ou une exposition minime ; « bref » préserve cette nuance sans l’expliciter davantage.
- source_word: ἀκτῖνος ἡλίου
  choice: rayon de soleil
  rationale: Expression française courante qui restitue directement l’image et la construction grecques.
- source_word: θερμαινόμενον
  choice: réchauffé
  rationale: Le participe indique que la matière reçoit la chaleur du rayon ; « réchauffé » maintient le contraste avec l’action du feu.
- source_word: ἐτήκετο
  choice: fondait
  rationale: L’imparfait grec décrit le processus de fusion. L’imparfait français en rend naturellement l’aspect.
- source_word: τὸ ... μὴ φθειρόμενον
  choice: ce qui n’était pas détruit
  rationale: Cette tournure rend naturellement le participe substantivé neutre sans introduire un nom absent du grec.
