- from: Car ce qui n’était pas détruit par le feu fondait tout simplement, réchauffé par un bref rayon de soleil.[a]
  to: Car ce que le feu ne détruisait pas fondait tout simplement sous l’effet d’un faible rayon de soleil.[a]
  rationale: Révision limitée visant à rendre βραχείας par « faible », expression française plus naturelle que « bref » avec « rayon de soleil » et moins restrictive quant à la nuance grecque. La reformulation évite aussi un participe français pesant, tout en maintenant le contraste, l’aspect imperfectif et la portée générale du référent neutre grec.
