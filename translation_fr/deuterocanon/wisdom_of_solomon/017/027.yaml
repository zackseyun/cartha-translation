  text: For what was not destroyed by fire simply melted when warmed by a brief ray of the sun,[a]
translation:
  language: fr
  text: Car ce que le feu ne détruisait pas fondait tout simplement sous l’effet d’un faible rayon de soleil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « consumé » au lieu de « détruisait » ; le grec peut désigner ce qui périt sous l’action du feu.
