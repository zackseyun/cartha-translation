  text: But they[a], while sleeping the same sleep, with the truly powerless night having come upon them from the depths of powerless Hades,
translation:
  language: fr
  text: Mais eux, dormant le même sommeil, la nuit véritablement sans force[a], surgie des profondeurs de l’Hadès sans force, les ayant assaillis,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « la nuit véritablement irrésistible… surgie des profondeurs de l’Hadès irrésistible ». Le grec répète le même adjectif (ἀδύνατος) dans les deux expressions. Son sens exact est difficile à déterminer ici : il peut signifier littéralement « sans force, impuissant » ou, par implication, « auquel on ne peut résister ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδύνατον … ἀδυνάτου
  choice: sans force … sans force
  rationale: Le même adjectif grec est répété. « Sans force » en conserve le sens lexical premier et l’écho rhétorique, malgré l’étrangeté voulue de l’expression; le contexte peut aussi suggérer une nuit à laquelle nul ne peut résister.
- source_word: ὄντως
  choice: véritablement
  rationale: Rend l’intensification emphatique dans un registre digne et naturel.
- source_word: ᾅδου
  choice: l’Hadès
  rationale: Conserve le terme grec désignant le séjour des morts sans lui imposer les associations doctrinales plus tardives du mot « enfer ».
- source_word: μυχῶν
  choice: des profondeurs
  rationale: Exprime les replis intérieurs ou cachés évoqués par le grec et préserve l’image menaçante.
- source_word: ἐπελθοῦσαν
  choice: s’abattait sur eux
  rationale: Rend la venue hostile de la nuit sur les personnes concernées; l’imparfait français s’accorde naturellement avec la construction participiale simultanée.
- source_word: τὸν αὐτὸν ὕπνον κοιμώμενοι
  choice: plongés dans le même sommeil
  rationale: Formulation française naturelle qui conserve l’idée d’un sommeil identique ou commun à tous.
theological_decisions:
- issue: Sens de ἀδύνατος dans sa double occurrence
  choice: sans force
  alternative: irrésistible
  rationale: Le sens littéral est « dépourvu de force », mais le contexte peut impliquer « auquel on ne peut résister ». La traduction maintient la répétition et signale l’autre lecture en note plutôt que de résoudre l’ambiguïté.
- issue: Traduction de ᾅδου
  choice: l’Hadès
  alternative: le séjour des morts
  rationale: « Hadès » reflète directement le vocabulaire du texte grec deutérocanonique et évite de substituer « enfer », qui pourrait importer une conception doctrinale plus précise.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase demeure volontairement ouverte, car le verset se poursuit syntaxiquement dans le contexte. La répétition inhabituelle « sans force » reproduit une tension réelle du grec plutôt que de la lisser.
