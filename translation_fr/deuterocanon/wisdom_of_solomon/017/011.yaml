base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/011.yaml
  text: For wickedness is especially cowardly[a], being condemned by itself; and, being pressed by conscience, it always assumes the worst.
translation:
  language: fr
  text: Car, une fois condamnée, la méchanceté se montre particulièrement lâche ; sous la pression de la conscience, elle s’attend toujours au pire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car la méchanceté, étant condamnée, témoigne particulièrement de sa lâcheté ; pressée par la conscience, elle s’attend toujours à des choses terribles. »'
    reason: 'La première proposition grecque est condensée : le participe passif « étant condamnée » peut être rattaché directement à « la méchanceté », tandis que le verbe « témoigner » peut aussi être rendu plus explicitement par « témoigner de sa lâcheté ». La note conserve cette nuance sans faire de la méchanceté l’agent de sa propre condamnation.'
lexical_decisions:
- source_word: δειλὸν
  choice: lâche
  rationale: L’adjectif exprime la lâcheté ou le manque de courage, et non simplement la peur. « Lâche » conserve ici la portée morale du terme.
- source_word: ἰδίως
  choice: particulièrement
  rationale: L’adverbe souligne le caractère propre ou marqué de la lâcheté attribuée à la méchanceté.
- source_word: πονηρία
  choice: méchanceté
  rationale: Le nom désigne ici le mal moral envisagé comme disposition ou qualité. « Méchanceté » est naturel en français courant et maintient cette dimension morale.
- source_word: μαρτυρεῖ καταδικαζομένη
  choice: elle témoigne contre elle-même et se condamne
  rationale: Cette formulation rend ensemble le verbe « témoigner » et le participe « étant condamnée », tout en exprimant le mouvement intérieur suggéré par la conscience dans la seconde proposition. La note conserve une analyse plus strictement passive.
- source_word: προσειληφεν
  choice: s’attend
  rationale: Dans ce contexte de peur suscitée par la conscience, le parfait exprime ce que l’esprit accueille d’avance ou tient pour probable.
- source_word: τὰ χαλεπὰ
  choice: au pire
  rationale: L’expression désigne les réalités pénibles, redoutables ou funestes anticipées par une conscience coupable. « S’attendre au pire » est une tournure française naturelle.
- source_word: συνεχομένη τῇ συνειδήσει
  choice: pressée par la conscience
  rationale: Le participe évoque une pression ou une contrainte intérieure, tandis que συνείδησις désigne ici la conscience morale.
theological_decisions:
- issue: Psychologie morale de la culpabilité
  choice: La méchanceté est présentée comme témoignant contre elle-même sous la pression de la conscience et comme anticipant le pire.
  alternative: On peut comprendre plus passivement que la méchanceté, une fois condamnée, rend un témoignage particulièrement craintif et redoute constamment des choses terribles.
  rationale: Le rapprochement de καταδικαζομένη et de συνεχομένη τῇ συνειδήσει favorise une lecture intérieure liée à la conscience, sans exclure entièrement la nuance judiciaire de la condamnation.
translation_notes:
  register: Français international moderne, digne et accessible. La personnification de la méchanceté et le parallélisme des deux propositions sont conservés ; la note signale l’ambiguïté syntaxique réelle du grec.
