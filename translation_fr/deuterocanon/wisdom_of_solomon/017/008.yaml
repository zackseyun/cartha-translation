base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/008.yaml
  text: For those who promised to drive away fears and disturbances from a sick soul were themselves sick with a ridiculous fear[a].
translation:
  language: fr
  text: Car ceux qui promettaient de chasser les frayeurs et les troubles d’une âme malade souffraient eux-mêmes d’une crainte ridicule[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une timidité qui prêtait à rire ». Le grec εὐλάβεια peut aussi désigner la prudence, voire la révérence, mais le contexte favorise ici un sens négatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπισχνούμενοι
  choice: promettaient
  rationale: Le participe désigne ceux qui promettaient ou prétendaient pouvoir agir; « promettaient » conserve directement cette idée sans ajouter explicitement celle de charlatanisme.
- source_word: δείματα
  choice: les frayeurs
  rationale: Le pluriel évoque des peurs ou des sujets d’effroi; « frayeurs » rend sa force tout en s’accordant naturellement avec les troubles intérieurs.
- source_word: ταραχὰς
  choice: les troubles
  rationale: Le terme désigne ici l’agitation ou le désordre intérieur; « troubles » reste naturel et suffisamment large.
- source_word: ἀπελαύνειν
  choice: chasser
  rationale: Le verbe signifie repousser ou expulser; « chasser » est vif, idiomatique et fidèle à l’image.
- source_word: ψυχῆς νοσούσης
  choice: d’une âme malade
  rationale: Cette formulation préserve à la fois le sens large de ψυχή, l’image de la maladie et le lien rhétorique avec ἐνόσουν.
- source_word: καταγέλαστον
  choice: ridicule
  rationale: L’adjectif qualifie ce qui prête à rire ou à la dérision; « ridicule » en conserve nettement la portée méprisante.
- source_word: εὐλάβειαν
  choice: crainte
  rationale: Dans ce contexte négatif et ironique, le mot désigne vraisemblablement une peur ou une timidité craintive plutôt que la révérence; la note conserve l’ambiguïté lexicale.
- source_word: ἐνόσουν
  choice: souffraient eux-mêmes de
  rationale: Cette expression française naturelle garde la métaphore pathologique, déjà présente dans « âme malade », sans produire la tournure moins idiomatique « étaient malades de ».
theological_decisions:
- issue: Sens de εὐλάβεια dans un contexte négatif
  choice: crainte
  alternative: circonspection, timidité, révérence
  rationale: La proximité de « frayeurs », de « troubles » et de καταγέλαστον impose ici une valeur péjorative et ironique. « Révérence » donnerait indûment un sens religieux positif, tandis que la note signale les autres valeurs possibles du terme.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le parallélisme ironique entre l’âme dite malade et ceux qui prétendaient la délivrer, eux-mêmes atteints de crainte.
