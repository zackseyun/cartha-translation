lexical_decisions:
- source_word: καὶ γὰρ
  choice: Car
  rationale: Introduit naturellement en français l’explication emphatique portée par la locution grecque.
- source_word: εἰ μηδὲν αὐτοὺς ταραχῶδες ἐφόβει
  choice: même si rien d’effrayant ne les épouvantait
  rationale: Conserve la construction conditionnelle, la valeur inquiétante de ταραχῶδες et le vocabulaire explicite de la peur.
- source_word: κνωδάλων
  choice: bêtes sauvages
  rationale: Rend le sens de créatures ou bêtes dangereuses dans un registre actuel et digne.
- source_word: παρόδοις
  choice: le passage de
  rationale: Exprime la circonstance occasionnant la panique sans préciser indûment s’il s’agit d’un simple passage ou d’une approche.
- source_word: ἑρπετῶν
  choice: serpents
  rationale: Le terme peut désigner plus largement des animaux rampants, mais son association avec συριγμοῖς favorise ici le sens de serpents.
- source_word: συριγμοῖς
  choice: le sifflement de
  rationale: Restitue naturellement le bruit aigu ou sifflant désigné par le grec dans ce contexte.
- source_word: ἐκσεσοβημένοι
  choice: les jetaient dans la panique
  rationale: Cette formulation française rend l’état de violente frayeur exprimé par le participe grec tout en s’accordant naturellement avec les causes au datif.
