  text: For even if nothing terrifying frightened them[a], they were panic-stricken by the passing by of wild animals and the hissing of snakes,
translation:
  language: fr
  text: Car, même si rien d’effrayant ne les épouvantait, ils étaient affolés au passage de bêtes sauvages et au sifflement de serpents[a],
