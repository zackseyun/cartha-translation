base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/026.yaml
  text: so that your children[a], whom you loved, might learn, O Lord, that it is not the produce of crops that nourishes man[c][b], but your word preserves those who trust in you.
translation:
  language: fr
  text: afin que tes fils[a], ceux que tu as aimés, apprennent, Seigneur, que ce ne sont pas les produits des récoltes[b] qui nourrissent l’être humain, mais ta parole préserve ceux qui mettent leur confiance en toi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes enfants ». Le grec dit littéralement « tes fils », expression qui peut désigner ici les membres du peuple de Dieu.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les productions des fruits » ; l’expression grecque désigne les produits agricoles, ce que les récoltes produisent.
    reason: lexical_alternative
  - marker: c
    text: Ou « ceux qui te croient » ; le grec peut aussi exprimer le fait de se fier à quelqu’un.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα μάθωσιν
  choice: afin que… apprennent
  rationale: La construction ἵνα suivie du subjonctif exprime ici le but; cette formulation le rend clairement et naturellement.
- source_word: οἱ υἱοί σου
  choice: tes fils
  rationale: Le grec emploie explicitement le masculin pluriel υἱοί. « Fils » le conserve, tandis qu’une note signale la possibilité contextuelle de comprendre « enfants ».
- source_word: οὓς ἠγάπησας
  choice: ceux que tu as aimés
  rationale: Le passé composé rend naturellement en français l’aoriste ἠγάπησας et reprend explicitement l’antécédent masculin pluriel.
- source_word: Κύριε
  choice: Seigneur
  rationale: Le vocatif grec est rendu par une apostrophe directe, sans ajouter un « ô » devenu marqué dans le français courant.
- source_word: οὐχ αἱ γενέσεις τῶν καρπῶν
  choice: ce ne sont pas les produits de la terre
  rationale: Dans ce contexte, γενέσεις désigne ce qui est produit ou pousse, et καρποί les fruits ou produits agricoles. La formulation française exprime clairement cette réalité sans suggérer des générations au sens généalogique.
- source_word: τρέφουσιν ἄνθρωπον
  choice: qui nourrissent l’être humain
  rationale: τρέφω signifie nourrir ou alimenter. Le singulier ἄνθρωπον a ici une portée générique, bien rendue en français moderne par « l’être humain ».
- source_word: ἀλλὰ τὸ ῥῆμά σου
  choice: mais que ta parole
  rationale: ῥῆμα désigne une parole ou déclaration prononcée. « Ta parole » est naturel et conserve la portée théologique du contraste.
- source_word: τοὺς σοὶ πιστεύοντας
  choice: ceux qui mettent leur confiance en toi
  rationale: Avec le datif personnel σοὶ, πιστεύω exprime ici la confiance placée en Dieu, et non la simple adhésion à une affirmation.
- source_word: διατηρεῖ
  choice: garde en vie
  rationale: διατηρέω signifie préserver, conserver ou maintenir. « Garde en vie » explicite le maintien de la vie dans le contraste avec la nourriture.
theological_decisions:
- issue: Portée représentative de ἄνθρωπον
  choice: l’être humain
  alternative: l’homme; une personne
  rationale: Le nom singulier est générique. « L’être humain » conserve cette portée universelle en français actuel sans limiter indûment le propos aux hommes de sexe masculin.
- issue: Sens relationnel de πιστεύοντας avec σοὶ
  choice: ceux qui mettent leur confiance en toi
  alternative: ceux qui croient en toi; ceux qui te croient
  rationale: Le datif personnel et le contexte de préservation favorisent l’idée de confiance et de dépendance. La note maintient visibles les autres nuances possibles du verbe.
- issue: Nature de l’action exprimée par διατηρεῖ
  choice: garde en vie
  alternative: préserve; maintient
  rationale: Le contexte oppose la nourriture ordinaire à l’action vivifiante de la parole divine. « Garde en vie » exprime ce contraste sans préciser le mécanisme de cette préservation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le mouvement argumentatif du grec tout en évitant les calques peu naturels. « Seigneur » marque sobrement l’adresse directe; « garde en vie » rend concrètement le contraste entre nourriture et préservation divine.
