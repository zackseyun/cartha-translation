base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/017.yaml
  text: For if someone was a farmer, or a shepherd, or a worker at toils in the wilderness, once seized, he remained under the inescapable necessity.
translation:
  language: fr
  text: Car, qu’il fût cultivateur, berger ou travailleur peinant dans un lieu désert, une fois saisi, il restait soumis à une contrainte à laquelle il ne pouvait échapper.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une fois rattrapé, il demeurait sous l’emprise de cette nécessité inéluctable ». Le grec peut évoquer soit le fait d’être saisi, soit celui d’être rattrapé, et désigner une contrainte ou une nécessité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τε γὰρ
  choice: Car, qu’il fût
  rationale: Le tour introduit un cas explicatif parmi diverses occupations; « qu’il fût… ou… » rend naturellement en français la valeur distributive du grec dans ce contexte.
- source_word: γεωργὸς
  choice: cultivateur
  rationale: Terme moderne et précis pour une personne qui travaille la terre, sans connotation archaïque.
- source_word: ποιμὴν
  choice: berger
  rationale: Équivalent français usuel et précis du métier pastoral désigné.
- source_word: τῶν κατʼ ἐρημίαν ἐργάτης μόχθων
  choice: travailleur peinant dans un lieu désert
  rationale: Cette formulation conserve à la fois l’idée de travail pénible portée par μόχθων et celle d’un espace désert ou isolé portée par ἐρημίαν, tout en restant idiomatique.
- source_word: προλημφθεὶς
  choice: une fois saisi
  rationale: Le participe aoriste passif évoque le fait d’être pris ou surpris par une puissance qui devance et immobilise; « saisi » préserve cette image.
- source_word: ἔμενεν
  choice: il restait soumis
  rationale: L’imparfait exprime la persistance de l’état; « restait soumis » explicite naturellement le rapport à la contrainte qui suit.
- source_word: τὴν δυσάλυκτον ... ἀνάγκην
  choice: une contrainte à laquelle il ne pouvait échapper
  rationale: La périphrase française restitue clairement le caractère coercitif de ἀνάγκη et l’impossibilité d’échapper exprimée par δυσάλυκτον.
