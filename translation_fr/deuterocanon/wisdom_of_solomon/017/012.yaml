  text: For fear is nothing but the betrayal of the helps that come from reason[a].
translation:
  language: fr
  text: Car la peur n’est rien d’autre que la trahison des secours que procure la raison[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’abandon des secours issus du raisonnement ».'
    reason: 'Alternative lexicale : « abandon » exprime la défection impliquée par προδοσία, et « raisonnement » rend une autre nuance possible de λογισμός.'
lexical_decisions:
- source_word: φόβος
  choice: la peur
  rationale: Rend le sens général de l’état de crainte sans l’intensifier comme le feraient « terreur » ou « effroi ».
- source_word: οὐθὲν ... εἰ μὴ
  choice: n’est rien d’autre que
  rationale: Expression française naturelle qui conserve la définition exclusive formulée par le grec.
- source_word: προδοσία
  choice: l’abandon
  rationale: Dans ce contexte, le mot évoque la défection ou le fait de laisser tomber ses propres ressources. « Trahison » reste possible, mais personnifierait et moraliserait davantage l’idée en français.
- source_word: βοηθημάτων
  choice: des secours
  rationale: Conserve le pluriel et l’idée de moyens capables de venir en aide; le terme convient au registre sapientiel.
- source_word: τῶν ἀπὸ λογισμοῦ
  choice: que procure la raison
  rationale: Exprime naturellement la provenance indiquée par ἀπό et comprend λογισμός comme la faculté ou l’exercice de la réflexion rationnelle.
theological_decisions:
- issue: Nuance anthropologique et philosophique de λόγισμος
  choice: la raison
  alternative: le raisonnement; la réflexion rationnelle
  rationale: Le verset formule une observation philosophique sur la peur et les ressources de la pensée, sans imposer une doctrine particulière de la nature humaine.
- issue: Portée métaphorique de προδοσία
  choice: l’abandon
  alternative: la trahison
  rationale: « Abandon » met en avant la défaillance des ressources rationnelles sans résoudre entièrement si la peur les trahit activement ou les laisse simplement tomber; la variante en note préserve la métaphore plus forte.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste concise et proverbiale; « secours » maintient l’image concrète des ressources fournies par la raison.
