base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/029.yaml
  text: For the hope of the ungrateful will melt like wintry frost[b][a], and will run off like useless water.
translation:
  language: fr
  text: Car l’espoir de l’ingrat[a] fondra comme le givre hivernal et s’écoulera comme une eau inutile[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de celui qui manque de reconnaissance ». Le terme grec souligne l’absence de gratitude.
    reason: lexical_alternative
  - marker: b
    text: L’image peut évoquer une eau qui s’écoule sans rester disponible et ne sert donc à rien.
    reason: cultural_note
lexical_decisions:
- source_word: ἀχαρίστου
  choice: de l’ingrat
  rationale: Le génitif singulier désigne une personne caractérisée par son manque de reconnaissance. « L’ingrat » est naturel en français moderne et conserve précisément la portée morale du grec.
- source_word: ἐλπίς
  choice: l’espoir
  rationale: « Espoir » rend ici le sens courant de ἐλπίς et convient au contexte moral et poétique.
- source_word: χειμέριος πάχνη
  choice: le givre hivernal
  rationale: Cette expression restitue l’image d’un dépôt gelé propre à l’hiver, tout en restant fluide et évocatrice en français.
- source_word: τακήσεται
  choice: fondra
  rationale: Le futur de τήκω exprime ici la fonte ou la dissolution; « fondra » prolonge directement l’image du givre.
- source_word: ῥυήσεται
  choice: s’écoulera
  rationale: Le verbe indique que quelque chose coule ou s’en va en coulant. « S’écoulera » est naturel avec l’eau et conserve l’idée de disparition.
- source_word: ὕδωρ ἄχρηστον
  choice: une eau inutile
  rationale: Ἄχρηστος signifie « inutile, impropre à l’usage ». La formulation française conserve la brièveté et l’étrangeté expressive de l’image sans en imposer une interprétation unique.
theological_decisions:
- issue: Caractérisation morale exprimée par ἀχαρίστου
  choice: de l’ingrat
  alternative: de celui qui manque de reconnaissance; de l’impie
  rationale: Le grec vise directement l’ingratitude. Traduire par « impie » élargirait indûment le sens et importerait une catégorie théologique qui n’est pas explicitement présente.
translation_notes:
  register: Français international moderne, sobre et poétique. La syntaxe parallèle du grec et ses deux images successives sont conservées. « Givre hivernal » privilégie une image claire; « eau inutile » maintient l’ambiguïté poétique de l’expression grecque.
