base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/005.yaml
  text: And no force of fire prevailed to give light[a], nor did the brilliant flames of the stars endure to illumine that dreadful night.
translation:
  language: fr
  text: Aucune puissance du feu ne parvenait à donner de la lumière, et les flammes éclatantes des étoiles ne pouvaient illuminer cette nuit effroyable[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette nuit sinistre » ou « cette nuit odieuse ». L’adjectif grec exprime fortement ce qui inspire l’horreur, l’aversion ou l’effroi.
    reason: lexical_alternative
lexical_decisions:
- source_word: πυρὸς … βία
  choice: force du feu
  rationale: Conserve le rapport génitif entre « feu » et « force », tout en exprimant la puissance active du feu sans la connotation morale que pourrait avoir « violence ».
- source_word: κατίσχυεν
  choice: ne parvenait
  rationale: Rend l’idée d’une puissance qui ne réussit pas à accomplir l’action exprimée par l’infinitif, ainsi que la valeur durative de l’imparfait.
- source_word: φωτίζειν
  choice: à donner de la lumière
  rationale: Formulation française naturelle qui garde la valeur causative du verbe grec.
- source_word: ἄστρων
  choice: des astres
  rationale: « Astres » convient au registre poétique et désigne ici les étoiles sans alourdir l’expression.
- source_word: ἔκλαμπροι φλόγες
  choice: les flammes éclatantes
  rationale: Préserve l’image vive des flammes et leur éclat lumineux.
- source_word: καταυγάζειν
  choice: à illuminer
  rationale: Exprime directement l’action de répandre sa lumière sur la nuit, sans ajouter une orientation spatiale trop précise.
- source_word: ὑπέμενον
  choice: ne réussissaient pas davantage
  rationale: Dans ce contexte, le verbe marque l’incapacité des flammes à tenir et à poursuivre leur action face aux ténèbres. La formulation française privilégie la clarté, tout en conservant le parallélisme d’impuissance avec la première proposition.
- source_word: στυγνὴν
  choice: effroyable
  rationale: Rend la forte coloration affective de l’adjectif grec, qui peut évoquer ce qui est odieux, sinistre ou terrifiant.
theological_decisions:
- issue: Description poétique des ténèbres cosmiques dans le contexte de la plaie
  choice: Conserver l’image extraordinaire où ni le feu ni la lumière des astres ne peuvent éclairer la nuit.
  alternative: Réduire le passage à une obscurité ordinaire ou l’expliquer uniquement comme une terreur psychologique.
  rationale: Le grec présente concrètement le feu et les astres comme incapables d’illuminer la nuit. La traduction maintient cette tension poétique sans imposer une explication doctrinale ou naturaliste.
translation_notes:
  register: Français international actuel, digne et poétique. Le parallélisme des deux propositions est conservé, avec une syntaxe accessible et sans archaïsmes.
