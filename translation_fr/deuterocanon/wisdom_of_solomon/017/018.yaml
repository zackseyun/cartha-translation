base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/018.yaml
  text: For all were bound with one chain of darkness—whether it was the whistling of wind[a], or the pleasant sound of birds among the leafy branches, or the rushing force of flowing water,
translation:
  language: fr
  text: 'Car tous étaient liés par une même chaîne de ténèbres : que ce soit le sifflement du vent[a], le chant mélodieux des oiseaux parmi les branches touffues, ou le rythme des eaux coulant avec force,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le sifflement d’un esprit ». Le mot grec peut signifier « vent » ou « esprit »; dans cette liste de bruits naturels, « vent » convient probablement mieux au contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: μιᾷ ... ἁλύσει σκότους
  choice: par une même chaîne de ténèbres
  rationale: Le datif a une valeur instrumentale, et « chaîne de ténèbres » conserve l’image concrète du grec. « Une même » exprime naturellement l’unique chaîne qui les retenait tous.
- source_word: πάντες ἐδέθησαν
  choice: tous étaient liés
  rationale: Cette formulation maintient le passif et l’image de captivité sans alourdir le français.
- source_word: εἴ τε ... ἢ ... ἢ
  choice: que ce soit ... ou ... ou
  rationale: Cette tournure française introduit clairement la série de bruits possibles tout en respectant la construction grecque.
- source_word: πνεῦμα συρίζον
  choice: le sifflement du vent
  rationale: Dans cette énumération de bruits naturels, πνεῦμα désigne vraisemblablement le vent; la formulation garde au premier plan le phénomène sonore exprimé par συρίζον.
- source_word: περὶ ἀμφιλαφεῖς κλάδους
  choice: parmi les branches touffues
  rationale: ἀμφιλαφεῖς évoque des branches épaisses, largement déployées ou abondamment feuillues; « touffues » rend cette densité avec naturel.
- source_word: ὀρνέων ἦχος εὐμελής
  choice: le chant mélodieux des oiseaux
  rationale: εὐμελής signifie harmonieux ou mélodieux. Dans le cas des oiseaux, « chant » est idiomatique, tout en rendant la qualité agréable du son.
- source_word: ῥυθμὸς ὕδατος πορευομένου βίᾳ
  choice: le rythme des eaux coulant avec force
  rationale: La traduction conserve ῥυθμός plutôt que de le réduire au seul bruit, et rend βίᾳ par « avec force ». Le pluriel français « les eaux » est naturel dans ce registre.
theological_decisions:
- issue: Sens de πνεῦμα dans l’énumération de phénomènes sonores nocturnes
  choice: vent
  alternative: esprit
  rationale: Les deux sens sont lexicalement possibles, mais les oiseaux et l’eau qui suivent favorisent ici le sens naturel de « vent ». Une note conserve néanmoins l’autre lecture sans introduire une présence surnaturelle dans le texte principal.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase reste ouverte par une virgule finale, puisque le verset fourni constitue un segment syntaxique poursuivi dans le contexte. L’image de la chaîne et le terme « rythme » sont conservés afin de préserver la force et la texture du grec.
