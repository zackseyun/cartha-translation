  text: or a harsh crash of rocks falling down[a], or the unseen rush of leaping animals, or the sound of the roaring of most savage beasts, or an echo thrown back from the hollow of the mountains[c][b], paralyzed them with fear.
translation:
  language: fr
  text: 'ou le fracas brutal de rochers précipités[a], ou la course invisible d’animaux bondissants[b], ou le cri de bêtes extrêmement féroces qui rugissaient, ou un écho renvoyé du creux des montagnes[c] : tout cela les paralysait de peur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de rochers qui dévalaient ». Le participe grec peut décrire des rochers précipités vers le bas sans indiquer ce qui les fait tomber.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la course invisible d’animaux bondissants ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « un écho renvoyé depuis le creux des montagnes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κτύπος ἀπηνὴς
  choice: le fracas brutal
  rationale: κτύπος désigne un bruit de choc, bien rendu par « fracas »; ἀπηνής en souligne ici la violence et la rudesse sonore.
- source_word: καταρριπτομένων πετρῶν
  choice: de rochers précipités
  rationale: Le participe exprime un mouvement violent vers le bas et peut être compris comme passif (« précipités ») ou comme décrivant des rochers qui dévalent. La formulation française conserve cette nuance sans préciser l’agent.
- source_word: σκιρτώντων ζῴων δρόμος ἀθεώρητος
  choice: la course invisible d’animaux bondissants
  rationale: δρόμος signifie proprement « course »; ἀθεώρητος indique qu’elle n’est pas vue, et σκιρτώντων décrit des animaux qui sautent ou bondissent.
- source_word: ὠρυομένων ἀπηνεστάτων θηρίων φωνή
  choice: le cri de bêtes extrêmement féroces qui rugissaient
  rationale: φωνή est ici le cri ou la voix animale; ὠρύομαι désigne un rugissement ou hurlement, tandis que le superlatif ἀπηνεστάτων intensifie la férocité.
- source_word: ἀντανακλωμένη ἐκ κοιλότητος ὀρέων ἠχώ
  choice: un écho renvoyé du creux des montagnes
  rationale: ἀντανακλωμένη décrit un son répercuté ou renvoyé; κοιλότης évoque le creux ou la cavité des montagnes.
- source_word: παρέλυεν αὐτοὺς ἐκφοβοῦντα
  choice: tout cela les paralysait de peur
  rationale: παρέλυεν exprime la paralysie ou la perte de moyens; le participe ἐκφοβοῦντα indique que cet effet était produit par une terreur intense. « Tout cela » explicite naturellement le sujet collectif neutre de l’énumération.
