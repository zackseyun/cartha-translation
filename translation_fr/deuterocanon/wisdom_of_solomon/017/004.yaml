  - severity: low
    issue: « Se manifestaient » est légèrement plus interprétatif que nécessaire.
    rationale: ἐνεφανίζετο signifie avant tout « apparaissait / devenait visible ». « Apparaissaient » est idiomatique, fidèle et conserve le caractère visuel des φάσματα.
