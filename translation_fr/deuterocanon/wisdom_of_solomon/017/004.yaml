base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/004.yaml
  text: For not even the inner chamber that held them kept them free from fear[a], but sounds that troubled them rang around them[b], and gloomy apparitions with unsmiling faces appeared.
translation:
  language: fr
  text: Car même le recoin qui les retenait ne les gardait pas à l’abri de la peur ; des bruits qui les bouleversaient retentissaient tout autour d’eux[a], et des apparitions aux visages sombres et sans sourire apparaissaient[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec est rare et peut évoquer des bruits répétés, répercutés ou environnants.
    reason: lexical_alternative
  - marker: b
    text: Ou « fantômes » ou « spectres ». Le mot grec désigne des formes ou manifestations étranges qui apparaissent.
    reason: lexical_alternative
lexical_decisions:
- source_word: μυχὸς
  choice: recoin
  rationale: Le terme désigne un espace intérieur retiré ou caché. « Recoin » conserve cette idée sans préciser qu’il s’agit nécessairement d’une chambre.
- source_word: ὁ κατέχων αὐτοὺς
  choice: qui les retenait
  rationale: Le participe exprime le fait de contenir ou de tenir dans un lieu, sans imposer l’idée plus forte d’un emprisonnement.
- source_word: ἀφόβως διεφύλασσεν
  choice: ne les gardait pas à l’abri de la peur
  rationale: Cette formulation française rattache naturellement l’adverbe « sans peur » à l’effet attendu de la protection, plutôt qu’à la manière dont le lieu garderait les personnes.
- source_word: ἦχοι ἐκταράσσοντες αὐτοὺς
  choice: des bruits qui les bouleversaient
  rationale: ἦχοι reste général, tandis que ἐκταράσσω marque une agitation profonde ; « bouleversaient » rend cette forte perturbation sans en déterminer la cause.
- source_word: ἐτρεκόμπουν
  choice: retentissaient tout autour d’eux
  rationale: Le verbe rare semble évoquer un bruit répété ou réverbéré qui environne les personnes ; une note signale l’incertitude lexicale.
- source_word: φάσματα
  choice: apparitions
  rationale: « Apparitions » rend des formes étranges devenues visibles sans décider s’il s’agit d’êtres objectifs, de fantômes ou de visions.
- source_word: ἀμειδήτοις κατηφῆ προσώποις
  choice: lugubres aux visages sans sourire
  rationale: 'La formulation conserve les deux traits de l’expression grecque : l’aspect sombre ou abattu et l’absence de sourire.'
- source_word: ἐνεφανίζετο
  choice: se manifestaient
  rationale: Le singulier verbal grec peut s’accorder avec un neutre pluriel ; le français exige ici le pluriel. « Se manifestaient » exprime leur apparition visible.
theological_decisions:
- issue: Nature des phénomènes désignés par φάσματα
  choice: « apparitions », sans préciser leur nature métaphysique
  alternative: « fantômes », « spectres » ou « visions »
  rationale: Le grec décrit des manifestations terrifiantes sans établir si elles sont des êtres surnaturels objectifs ou des visions suscitées par la peur ; la traduction préserve cette ambiguïté.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase garde le mouvement solennel du grec, tout en évitant des termes archaïques et toute précision doctrinale étrangère au texte.
