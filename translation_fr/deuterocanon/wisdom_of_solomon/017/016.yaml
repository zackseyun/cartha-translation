base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/016.yaml
  text: Then[a], whoever it might have been there, when he fell down, was kept under guard, shut up in that ironless prison.
translation:
  language: fr
  text: Alors, quiconque se trouvait là, une fois tombé, était gardé, enfermé dans cette prison sans fer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la prison sans fer » — image d’un enfermement sans chaînes ni barreaux matériels.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶθʼ οὕτως
  choice: Puis
  rationale: Marque simplement la progression du récit; « Puis » est naturel en français et n’alourdit pas la valeur du connecteur.
- source_word: ὃς δὴ ποτʼ οὖν ἦν ἐκεῖ
  choice: quel que soit celui qui se trouvait là
  rationale: 'La tournure conserve l’indétermination fortement marquée par δὴ ποτʼ οὖν : l’identité importe peu, car toute personne présente subissait le même sort.'
- source_word: καταπίπτων
  choice: lorsqu’il tombait
  rationale: Le participe présent exprime une circonstance concomitante. L’imparfait s’accorde avec ἐφρουρεῖτο et rend la scène sans transformer le geste en événement ponctuel achevé.
- source_word: ἐφρουρεῖτο
  choice: il restait sous bonne garde
  rationale: Cette formulation préserve le passif de sens et la nuance de détention ou de surveillance continue.
- source_word: εἰς τὴν ἀσίδηρον εἱρκτήν
  choice: dans cette prison sans fer
  rationale: « Sans fer » traduit directement ἀσίδηρον et conserve l’image frappante d’un emprisonnement dépourvu de chaînes ou de barreaux matériels.
- source_word: κατακλεισθείς
  choice: enfermé
  rationale: Rend clairement l’idée d’être clos ou confiné tout en s’intégrant naturellement à la syntaxe française.
theological_decisions:
- issue: Genre du sujet indéfini
  choice: celui… il
  alternative: la personne… elle; quiconque… cette personne
  rationale: Le grec emploie un masculin singulier grammatical. Le français peut le conserver naturellement sans en tirer une affirmation doctrinale générale sur le genre.
translation_notes:
  register: Français international moderne, digne et accessible. La structure reste proche du grec tout en évitant une tournure excessivement littérale. Le marqueur [a] est placé après l’expression qu’il explique.
