  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/007.yaml
  text: And the tricks of magical art were laid low, and the boast of wisdom was disgracefully exposed.
translation:
  language: fr
  text: Les tours de l’art magique furent réduits à l’impuissance, et l’arrogance fondée sur l’intelligence reçut un démenti humiliant.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μαγικῆς … τέχνης
  choice: l’art magique
  rationale: Rend directement l’expression grecque et conserve son registre péjoratif dans le contexte.
- source_word: ἐμπαίγματα
  choice: artifices
  rationale: Le terme désigne ici les procédés trompeurs ou les tours de la magie; « artifices » est naturel en français et garde l’idée de supercherie.
- source_word: κατέκειτο
  choice: furent terrassés
  rationale: La forme évoque ce qui gît, abattu ou réduit à l’impuissance; cette traduction restitue l’image plus nettement que le simple « échouèrent ».
- source_word: τῆς ἐπὶ φρονήσει ἀλαζονίας
  choice: leur prétention à la sagesse
  rationale: ἀλαζονία exprime une prétention arrogante, tandis que φρόνησις désigne ici sagesse ou intelligence pratique; « sagesse » convient au contexte sapientiel.
- source_word: ἔλεγχος ἐφύβριστος
  choice: fut honteusement démasquée
  rationale: ἔλεγχος indique une réfutation ou une mise en évidence qui confond; ἐφύβριστος ajoute une dimension outrageante ou humiliante. La formulation française exprime le résultat sans surcharger le verset.
theological_decisions:
- issue: Nature de la « sagesse » revendiquée
  choice: Présenter celle-ci comme une prétention des magiciens, non comme la sagesse véritable
  alternative: « l’orgueil fondé sur leur intelligence »
  rationale: Le grec critique l’arrogance qui se réclame de φρόνησις; il ne condamne pas la sagesse elle-même.
translation_notes:
  register: Français moderne, digne et concis. Le parallélisme grec est conservé, avec une formulation idiomatique et sans ajout confessionnel.
