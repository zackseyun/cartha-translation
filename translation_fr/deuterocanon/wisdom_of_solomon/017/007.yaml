  source_fidelity: Le premier membre est globalement fidèle, mais « terrassés » est une image un peu plus active que κατέκειτο (« étaient gisant / réduits à l'impuissance »). Dans le second, le grec désigne l'arrogance fondée sur la φρόνησις et son ἔλεγχος, c'est-à-dire un démenti, une réfutation ou une mise en défaut humiliante. « prétention à la sagesse fut honteusement démasquée » atténue l'idée de réfutation et rend φρόνησις de façon un peu trop sapientielle.
  naturalness: La formulation proposée est fluide, mais « reçut un démenti humiliant » rend plus naturellement en français moderne la construction nominale grecque et son effet de jugement.
  terminology: « Art magique » convient. « Intelligence » convient mieux ici que « sagesse » pour φρόνησις, sans exclure l'idée de discernement; « arrogance fondée sur l'intelligence » évite de faire de la sagesse elle-même l'objet immédiat de la critique.
