base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/001.yaml
  text: For your judgments are great and hard to describe[c][b][a]; therefore undisciplined souls went astray.
translation:
  language: fr
  text: Car tes jugements sont grands et difficiles à décrire[a] ; c’est pourquoi des âmes non instruites[b] se sont égarées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « difficiles à raconter », « difficiles à exposer » ou « difficiles à expliquer ».
    reason: lexical_alternative
  - marker: b
    text: Ou « sans formation », « non formées » ou « indisciplinées ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Μεγάλαι
  choice: grands
  rationale: L’adjectif qualifie l’ampleur des jugements divins ; « grands » en conserve naturellement la portée sans la préciser à l’excès.
- source_word: κρίσεις
  choice: jugements
  rationale: Ce terme garde à la fois le sens judiciaire et la dimension théologique des décisions ou actes de jugement de Dieu.
- source_word: δυσδιήγητοι
  choice: difficiles à expliquer
  rationale: Le composé exprime la difficulté à exposer ou à raconter pleinement ces jugements, sans nécessairement affirmer qu’ils sont absolument indicibles.
- source_word: ἀπαίδευτοι
  choice: sans instruction
  rationale: Le mot désigne des êtres qui n’ont reçu ni formation ni enseignement. Cette expression française préserve cette largeur de sens sans réduire le terme à un simple manque de discipline morale.
- source_word: ψυχαὶ
  choice: âmes
  rationale: Le choix conserve le terme anthropologique explicite du grec ainsi que sa gravité spirituelle, tout en restant compréhensible en français.
- source_word: ἐπλανήθησαν
  choice: se sont égarées
  rationale: Cette tournure naturelle conserve l’idée d’un égarement tout en évitant de trancher entre un passif causatif (« ont été égarées ») et un emploi décrivant simplement le fait de s’égarer.
- source_word: διὰ τοῦτο
  choice: c’est pourquoi
  rationale: Cette locution marque clairement la conséquence tirée de la proposition précédente.
theological_decisions:
- issue: Faut-il traduire ψυχαὶ littéralement ou employer un collectif plus idiomatique comme « personnes » ?
  choice: âmes
  alternative: personnes
  rationale: Le grec dit explicitement « âmes ». Ce mot reste naturel en français et préserve la texture anthropologique et spirituelle du passage sans imposer une définition doctrinale particulière.
- issue: Faut-il rendre ἐπλανήθησαν comme un passif causatif ?
  choice: se sont égarées
  alternative: ont été égarées
  rationale: La forme grecque peut être comprise comme un passif ou comme l’expression du fait d’aller à l’égarement. La tournure pronominale française préserve utilement cette indétermination quant à un éventuel agent extérieur.
translation_notes:
  register: Français international moderne, sobre et digne. L’ordre des mots est naturel en français, tandis que « jugements » et « âmes » maintiennent les principaux termes théologiques du grec. Les notes signalent l’étendue sémantique des mots difficiles sans surcharger le verset.
