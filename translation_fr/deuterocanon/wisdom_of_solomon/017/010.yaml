  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/010.yaml
  text: They were being destroyed[a], trembling and refusing even to look at the air, though there was nowhere to flee from it.
translation:
  language: fr
  text: Ils périssaient[a], tout tremblants, et refusaient même de regarder l’air, auquel on ne pouvait échapper d’aucun côté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « étaient en train d’être anéantis » ; autre traduction possible : « allaient à leur perte ».'
    reason: La forme grecque peut décrire le fait de périr ou celui d’être détruit, sans désigner ici l’agent.
lexical_decisions:
- source_word: διώλλυντο
  choice: périssaient
  rationale: 'L’imparfait moyen-passif exprime un processus en cours : ils allaient à leur perte ou étaient en train d’être anéantis. « Périssaient » reste naturel en français et ne précise pas l’agent, comme le grec.'
- source_word: ἔντρομοι
  choice: tremblants
  rationale: L’adjectif évoque à la fois la terreur et sa manifestation physique. « Tremblants » conserve cette image concrète.
- source_word: μηδαμόθεν φευκτόν
  choice: auquel il était impossible d’échapper
  rationale: Le groupe signifie que l’air ne pouvait être fui d’aucun côté. Cette formulation idiomatique exprime clairement son caractère inévitable sans alourdir la phrase.
- source_word: ἀέρα
  choice: l’air
  rationale: C’est le sens ordinaire du terme dans ce contexte et il préserve l’image saisissante de l’air environnant devenu lui-même insoutenable à regarder.
- source_word: προσιδεῖν
  choice: regarder
  rationale: Le verbe signifie regarder vers ou contempler. « Regarder » est actuel, direct et moins interprétatif que « affronter ».
- source_word: ἀρνούμενοι
  choice: refusaient même
  rationale: 'Le participe marque un refus persistant. « Même » rend naturellement l’extrême recul suggéré : ils ne voulaient pas jusqu’à regarder l’air.'
theological_decisions:
- issue: Nature de la perte décrite
  choice: Un anéantissement ou dépérissement en cours, sans agent explicitement désigné
  alternative: Une destruction explicitement accomplie par Dieu, ou un simple effondrement psychologique
  rationale: La forme grecque moyen-passive laisse l’agent non exprimé. Le contexte général évoque le jugement divin, mais le verset ne le nomme pas; la traduction conserve donc cette tension.
translation_notes:
  register: 'Français international moderne, sobre et digne. La syntaxe demeure fluide tout en conservant l’étrangeté voulue de l’image : ils refusent de regarder l’air même auquel ils ne peuvent échapper.'
