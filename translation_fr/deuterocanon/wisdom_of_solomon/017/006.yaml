  source_fidelity: 'La structure et le sens général sont bien rendus : l’imparfait de διεφαίνετο, la restriction de μόνον, le comparatif χείρω et l’opposition entre ce qui est vu et l’ὄψις non vue sont conservés. Toutefois, « invisible » peut suggérer que l’apparition était intrinsèquement impossible à voir, tandis que μὴ θεωρουμένης dit plus prudemment qu’elle n’était pas vue. « Qui s’allumait de lui-même » exprime plus directement la valeur spontanée et active d’αὐτομάτη que « allumé de lui-même ».'
