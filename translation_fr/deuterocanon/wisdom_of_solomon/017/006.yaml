  terminology: « Feu qui s’allumait de lui-même » respecte l’indétermination de l’origine du feu, sans l’interpréter doctrinalement. « Plein d’effroi » garde la formulation saisissante et ambiguë de φόβου πλήρης. L’expression paradoxale relative à l’apparition est maintenue sans la transformer en affirmation métaphysique d’invisibilité.
