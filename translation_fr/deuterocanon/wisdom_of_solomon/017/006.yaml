base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/006.yaml
  text: Only a self-kindled fire[a], full of fear, appeared to them; and, being terrified by that unseen appearance[b], they considered the things they saw to be worse.
translation:
  language: fr
  text: Seul un feu qui s’allumait de lui-même[a], plein d’effroi, leur apparaissait ; terrifiés par cette apparition qu’ils ne voyaient pas[b], ils estimaient que ce qu’ils voyaient était pire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un feu spontané » ou « un feu allumé de lui-même ».
    reason: lexical_alternative
  - marker: b
    text: Le grec dit littéralement « cette apparition qui n’était pas vue », expression volontairement paradoxale.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεφαίνετο
  choice: apparaissait
  rationale: L’imparfait exprime une manifestation perceptible qui se prolonge dans la scène ; « apparaissait » est naturel et garde la nuance visuelle.
- source_word: μόνον
  choice: ne… qu’
  rationale: 'La tournure restrictive française rend clairement l’emphase de μόνον : rien d’autre que ce feu ne leur apparaissait.'
- source_word: αὐτομάτη πυρά
  choice: un feu allumé de lui-même
  rationale: αὐτομάτη désigne ce qui se produit ou agit de soi-même. Cette formulation conserve le caractère étrange du feu sans préciser indûment sa cause.
- source_word: φόβου πλήρης
  choice: plein d’effroi
  rationale: La formulation garde l’image littérale d’une chose « pleine de peur ou d’effroi », sans trancher entre l’effroi qu’elle contient et celui qu’elle inspire.
- source_word: ἐκδειματούμενοι
  choice: terrifiés
  rationale: Le participe exprime une peur intense ; « terrifiés » en restitue directement la force.
- source_word: τῆς μὴ θεωρουμένης ἐκείνης ὄψεως
  choice: par cette apparition invisible
  rationale: La traduction maintient le paradoxe grec d’une apparition ou vision qui n’est pas vue, tout en restant intelligible en français.
- source_word: ἡγοῦντο
  choice: ils estimaient
  rationale: Le verbe indique un jugement ou une évaluation, et non une simple perception.
- source_word: χείρω τὰ βλεπόμενα
  choice: que ce qu’ils voyaient était pire
  rationale: Cette traduction conserve le comparatif χείρω et le contraste entre les réalités visibles et l’apparition invisible.
theological_decisions:
- issue: Faut-il expliquer le paradoxe d’une apparition qui n’est pas vue ?
  choice: Conserver « cette apparition invisible » dans le texte principal.
  alternative: « cette vision qu’ils ne voyaient pas » ou une paraphrase expliquant qu’ils en imaginaient la présence
  rationale: Le grec formule délibérément une tension entre ὄψις et μὴ θεωρουμένης. La maintenir respecte la représentation de la terreur et évite d’imposer une explication psychologique ou surnaturelle.
- issue: Comment comprendre αὐτομάτη dans ce contexte extraordinaire ?
  choice: « allumé de lui-même »
  alternative: « spontané » ou « qui s’était allumé tout seul »
  rationale: Le choix exprime l’absence de cause visible sans déterminer si le phénomène est miraculeux, magique ou seulement perçu comme tel.
translation_notes:
  register: 'Français international moderne, digne et accessible. La phrase conserve l’atmosphère étrange du grec ainsi que ses deux tensions principales : le feu « plein d’effroi » et l’« apparition invisible ».'
