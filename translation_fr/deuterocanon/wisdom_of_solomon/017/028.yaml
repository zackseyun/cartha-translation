  text: so that it might be known that one must rise before the sun to give thanks to you[b][a], and at the dawning of the light make petition to you.
translation:
  language: fr
  text: afin que l’on sache qu’il faut se lever avant le soleil pour te rendre grâce[a], et te supplier dès que paraît la lumière[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « devancer le soleil pour te rendre grâce ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « t’adresser une requête au lever de la lumière ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως γνωστὸν ἦν
  choice: afin que l’on sache
  rationale: 'La tournure exprime ici le but ou le résultat recherché : faire reconnaître ce qui suit. Cette formulation française est naturelle tout en conservant cette valeur.'
- source_word: δεῖ
  choice: il faut
  rationale: Rend directement l’idée de nécessité ou d’obligation sans préciser un sujet que le grec laisse indéfini.
- source_word: φθάνειν τὸν ἥλιον
  choice: se lever avant le soleil
  rationale: φθάνω suivi de l’accusatif signifie devancer ou arriver avant. Dans ce contexte matinal, la formulation explicite naturellement l’antériorité par rapport au lever du soleil.
- source_word: ἐπʼ εὐχαριστίαν σου
  choice: pour te rendre grâce
  rationale: La construction elliptique indique une action de grâce adressée à Dieu. La tournure verbale est claire et idiomatique en français.
- source_word: πρὸς ἀνατολὴν φωτός
  choice: dès que paraît la lumière
  rationale: Littéralement « vers le lever de la lumière », l’expression désigne l’aube tout en conservant l’image de la lumière qui apparaît.
- source_word: ἐντυγχάνειν σοι
  choice: te supplier
  rationale: Dans ce contexte religieux, le verbe désigne le fait de s’adresser à Dieu avec une requête. « Te supplier » en exprime clairement la force sans introduire l’idée plus spécifique d’intercession.
theological_decisions:
- issue: Portée de la pratique dévotionnelle matinale
  choice: Le verset énonce de façon générale la nécessité de rendre grâce à Dieu avant le lever du soleil et de le supplier à l’aube.
  alternative: On pourrait comprendre cette déclaration uniquement comme la leçon tirée des événements racontés dans le contexte, sans portée dévotionnelle générale.
  rationale: Le grec emploie δεῖ, qui exprime une nécessité générale, mais la traduction n’en fait pas un commandement institutionnel ni une prescription d’heures fixes de prière.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation impersonnelle « il faut » respecte l’absence de sujet déterminé, tandis que les images du soleil et de la lumière sont conservées.
