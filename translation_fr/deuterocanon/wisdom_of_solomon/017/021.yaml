base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/021.yaml
  text: But upon those alone heavy night was imposed[a], an image of the darkness that was about to receive them[b]; yet they were heavier to themselves than darkness.
translation:
  language: fr
  text: Mais sur eux seuls s’étendait une nuit pesante, image des ténèbres qui allaient les accueillir[a] ; pourtant, ils étaient pour eux-mêmes plus pesants que les ténèbres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ces « ténèbres » à venir peuvent évoquer un jugement plus grand que la plaie présente, mais le texte n’en précise pas la nature.
    reason: theological_ambiguity
  - marker: b
    text: 'Autre traduction possible : « ils étaient pour eux-mêmes plus accablants que les ténèbres ». Le grec reprend dans les deux propositions la même image du poids.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνοις δὲ ἐκείνοις
  choice: Mais sur eux seuls
  rationale: 'Le datif avec μόνοις souligne l’exclusivité : cette nuit ne pesait que sur ce groupe. « Sur eux seuls » s’accorde naturellement avec l’idée d’une nuit étendue au-dessus d’eux.'
- source_word: ἐπέτατο
  choice: s’étendait
  rationale: Le verbe évoque ce qui est étendu ou déployé sur quelqu’un. « S’étendait » rend l’image de la nuit couvrant les personnes sans introduire explicitement un agent qui l’imposerait.
- source_word: βαρεῖα νύξ
  choice: une nuit pesante
  rationale: « Pesante » conserve la métaphore du poids portée par βαρεῖα et prépare la reprise comparative de βαρύτεροι dans la dernière proposition.
- source_word: εἰκὼν
  choice: image
  rationale: « Image » correspond directement à εἰκών et maintient le rapport figuratif entre la nuit présente et les ténèbres à venir.
- source_word: τοῦ μέλλοντος αὐτοὺς διαδέχεσθαι σκότους
  choice: des ténèbres qui allaient les accueillir
  rationale: μέλλοντος exprime ce qui est sur le point d’arriver, tandis que διαδέχεσθαι peut présenter les ténèbres comme venant les recevoir ou prendre le relais. Cette formulation garde l’image menaçante sans préciser davantage la nature du jugement.
- source_word: ἑαυτοῖς δὲ ἦσαν βαρύτεροι σκότους
  choice: pourtant, ils étaient pour eux-mêmes plus pesants que les ténèbres
  rationale: La formulation volontairement frappante conserve le datif réfléchi ἑαυτοῖς et l’écho lexical entre βαρεῖα et βαρύτεροι. Elle laisse ouverte la raison pour laquelle ils constituaient eux-mêmes un poids supérieur à celui des ténèbres.
theological_decisions:
- issue: Nature des ténèbres à venir
  choice: La traduction présente la nuit actuelle comme l’image de ténèbres futures qui vont les accueillir, sans définir celles-ci.
  alternative: Préciser qu’il s’agit soit d’un état psychologique de peur, soit d’un châtiment eschatologique ou après la mort.
  rationale: Le grec suggère un jugement à venir dépassant peut-être la plaie immédiate, mais il n’en précise ni le moment ni la nature. La formulation conserve donc cette tension.
- issue: Sens du poids qu’ils sont pour eux-mêmes
  choice: Conserver littéralement l’idée qu’ils sont eux-mêmes plus pesants que les ténèbres.
  alternative: Expliciter leur culpabilité, leur peur intérieure ou le fait qu’ils se rendent la vie plus pénible.
  rationale: Le texte ne nomme pas la cause de ce poids intérieur. Une explicitation psychologique ou morale résoudrait indûment l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste proche du grec, tandis que « s’étendait » est idiomatique pour une nuit couvrant des personnes. La répétition « pesante / plus pesants » est volontaire afin de préserver le jeu lexical du texte source.
