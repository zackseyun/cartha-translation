  text: But expectation, being weaker from within, counts ignorance of the cause that brings the torment as a greater thing.
translation:
  language: fr
  text: Mais l’attente, intérieurement plus faible, estime plus grave l’ignorance de la cause qui provoque le tourment.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Elle estime qu’il est pire de ne pas connaître la cause du tourment. » Le grec dit littéralement que l’attente « estime plus grande l’ignorance de la cause qui provoque le tourment ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνδοθεν
  choice: de l’intérieur
  rationale: L’adverbe indique que la faiblesse prend sa source au-dedans; cette formulation conserve l’image sans alourdir la phrase.
- source_word: ἥττων
  choice: affaiblie
  rationale: Le comparatif décrit ici une attente devenue moindre ou plus faible; «affaiblie» convient naturellement à cet état intérieur.
- source_word: ἡ προσδοκία
  choice: l’attente
  rationale: Le terme désigne l’attente ou l’anticipation. «L’attente» préserve son caractère général sans préciser indûment s’il s’agit d’espoir ou d’appréhension.
- source_word: πλείονα λογίζεται
  choice: considère comme plus grande
  rationale: Cette expression rend directement l’idée d’estimer ou de tenir quelque chose pour plus grand, tout en conservant la comparaison quelque peu ouverte du grec.
- source_word: τὴν ἄγνοιαν
  choice: l’ignorance
  rationale: Le nom désigne le fait de ne pas savoir; le complément qui suit précise qu’il s’agit de la cause du tourment.
- source_word: τῆς παρεχούσης τὴν βάσανον αἰτίας
  choice: de la cause qui provoque le tourment
  rationale: Le participe qualifie «cause» et exprime ce qui produit ou occasionne la βάσανος; «tourment» en garde l’intensité sans imposer l’idée plus précise de torture.
