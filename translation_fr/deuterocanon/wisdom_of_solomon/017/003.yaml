  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : leur illusion de passer inaperçus dans leurs fautes cachées, leur dispersion sous le voile sans lumière de l’oubli, puis leur saisissement et leur trouble causé par des ἰνδάλματα. Cependant, « mais » introduit un contraste adversatif qui n’est pas exprimé par le grec ; la juxtaposition suffit à conserver la relation implicite sans l’expliciter davantage.'
  naturalness: Le français est clair et de registre approprié. « Saisis d’un effroi terrible » est compréhensible, mais « frappés de stupeur » rend plus précisément θαμβούμενοι, qui évoque d’abord l’ébahissement ou la stupeur, dans un contexte assurément effrayant.
  terminology: « Péchés secrets », « voile obscur de l’oubli », « dispersés » et « apparitions » sont des choix fidèles et naturels. « Apparitions » conserve utilement l’ambiguïté de ἰνδάλμασιν ; la note propose des équivalents sans imposer la nature des phénomènes.
  issues:
  - severity: low
    issue: Ajout de « mais »
    rationale: Le grec coordonne les éléments sans particule adversative. Le contraste est contextuellement perceptible, mais « mais » le rend plus explicite que le texte source.
  - severity: low
    issue: Nuance de θαμβούμενοι
    rationale: « Effroi » privilégie la peur, tandis que θαμβέω désigne plus directement la stupeur ou l’ébahissement, même si le contexte est terrifiant.
  revised_text: Car, pensant passer inaperçus dans leurs péchés secrets, ils furent dispersés sous le voile obscur de l’oubli, frappés d’une terrible stupeur et troublés par des apparitions[a].
