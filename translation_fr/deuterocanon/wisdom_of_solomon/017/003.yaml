base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/003.yaml
  text: For while they thought to remain hidden in their secret sins[a], they were scattered under the dark veil of forgetfulness, terribly aghast and shaken by apparitions.
translation:
  language: fr
  text: Car, pensant passer inaperçus dans leurs péchés secrets, ils furent dispersés sous le voile obscur de l’oubli, frappés d’une terrible stupeur et troublés par des apparitions[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fantômes », « spectres » ou « images ». Le terme grec peut désigner une forme visible ou une apparition fantomatique.
    reason: alternative_lexicale
lexical_decisions:
- source_word: λανθάνειν
  choice: passeraient inaperçus
  rationale: 'L’infinitif avec νομίζοντες exprime ce qu’ils supposaient : ne pas être remarqués. Cette formulation française rend clairement cette idée sans ajouter qu’ils auraient échappé au jugement.'
- source_word: κρυφαίοις ἁμαρτήμασιν
  choice: dans leurs péchés secrets
  rationale: κρυφαίοις signifie « cachés, secrets » et ἁμαρτήμασιν désigne des péchés ou actes coupables. La tournure conserve le lien entre leur conduite secrète et leur illusion de passer inaperçus.
- source_word: ἀφεγγεῖ
  choice: obscur
  rationale: L’adjectif signifie « sans lumière ». « Obscur » est naturel en français et convient à l’image du voile.
- source_word: λήθης
  choice: de l’oubli
  rationale: λήθη peut désigner l’oubli ou l’effacement. « L’oubli » maintient sobrement le rapport génitif avec le voile sans introduire une nuance métaphysique plus forte.
- source_word: παρακαλύμματι
  choice: voile
  rationale: Le terme désigne ce qui recouvre ou dissimule. « Voile » préserve l’image figurée du texte grec.
- source_word: ἐσκορπίσθησαν
  choice: ils furent dispersés
  rationale: Le passif de σκορπίζω signifie normalement disperser ou éparpiller. La traduction conserve cette image, tandis que les participes suivants décrivent leur désarroi.
- source_word: θαμβούμενοι δεινῶς
  choice: saisis d’un effroi terrible
  rationale: θαμβέω exprime la stupeur mêlée de crainte, et δεινῶς en renforce fortement l’intensité. La formulation française restitue à la fois le choc et la terreur.
- source_word: ἰνδάλμασιν
  choice: apparitions
  rationale: ἴνδαλμα peut désigner une image, un fantôme ou une apparition. « Apparitions » convient au contexte de terreur tout en laissant ouverte la nature exacte de ces phénomènes.
- source_word: ἐκταρασσόμενοι
  choice: bouleversés
  rationale: Le participe indique une agitation ou un trouble profond. « Bouleversés » est actuel et exprime nettement ce désarroi.
theological_decisions:
- issue: Nature des phénomènes effrayants désignés par ἰνδάλμασιν
  choice: apparitions
  alternative: fantômes, spectres ou images
  rationale: Le grec ne précise pas s’il s’agit de visions subjectives ou de présences fantomatiques objectives. « Apparitions » préserve cette ambiguïté au lieu de trancher la question.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde l’image poétique du voile obscur de l’oubli et la forte progression de la peur au bouleversement. Le point-virgule suivi de « mais » rend explicite le contraste implicite entre leur assurance et leur dispersion sans modifier le sens.
