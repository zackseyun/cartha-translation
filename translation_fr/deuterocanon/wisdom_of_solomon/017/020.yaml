  text: For the whole world was illuminated with bright light and was occupied with unhindered works;[a]
translation:
  language: fr
  text: Car le monde entier était éclairé d’une lumière éclatante et poursuivait ses activités sans entrave.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « était occupé à des activités sans entrave ». L’expression grecque évoque probablement le cours normal des activités, qui se poursuivait partout ailleurs malgré la plaie des ténèbres.'
    reason: Alternative lexicale pour συνείχετο ἔργοις et clarification du contraste narratif.
lexical_decisions:
- source_word: ὅλος ὁ κόσμος
  choice: le monde entier
  rationale: Cette expression rend naturellement la totalité indiquée par ὅλος et le sens courant de κόσμος dans le contraste avec la région plongée dans les ténèbres.
- source_word: λαμπρῷ ... φωτί
  choice: d’une lumière éclatante
  rationale: Le groupe au datif qualifie la lumière qui illumine le monde; « éclatante » conserve la force de λαμπρός dans un français actuel et digne.
- source_word: κατελάμπετο
  choice: resplendissait
  rationale: L’imparfait grec décrit une illumination continue. « Resplendissait d’une lumière » restitue cet aspect de manière plus naturelle que le passif littéral « était illuminé ».
- source_word: ἀνεμποδίστοις
  choice: sans entrave
  rationale: La locution exprime clairement que les activités se déroulaient sans obstacle.
- source_word: συνείχετο ἔργοις
  choice: poursuivait ses activités
  rationale: Dans ce contexte, le groupe évoque le monde absorbé par le cours normal de ses occupations. « Activités » convient mieux que le calque « œuvres », qui serait ambigu en français.
theological_decisions:
- issue: Portée de κόσμος dans le contraste avec les ténèbres de la plaie
  choice: le monde entier
  alternative: l’univers entier / toute la création
  rationale: « Le monde entier » préserve la portée large du grec et le contraste narratif, sans imposer une affirmation cosmologique plus précise que le texte.
- issue: Sens de συνείχετο avec ἔργοις
  choice: poursuivait ses activités
  alternative: était absorbé par ses travaux / était retenu par des œuvres
  rationale: Le contexte favorise l’idée que l’activité ordinaire continuait librement hors des ténèbres. La note conserve toutefois la formulation plus proche de l’image grecque.
translation_notes:
  register: Français international moderne, fluide et digne. Le parallélisme des deux propositions est conservé, tandis que « poursuivait ses activités » évite un calque obscur et exprime clairement le contraste avec l’immobilisation causée par les ténèbres.
