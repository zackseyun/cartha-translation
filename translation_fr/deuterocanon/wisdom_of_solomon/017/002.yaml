base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/002.yaml
  text: For when lawless men supposed that they were oppressing a holy nation[a], they lay imprisoned by darkness and bound fast by a long night, shut in under their roofs[c][b], fugitives from eternal providence.
translation:
  language: fr
  text: Car les hommes sans loi[a], qui pensaient pouvoir opprimer une nation sainte, gisaient prisonniers des ténèbres et enchaînés par une longue nuit[b], enfermés sous leurs toits, en fuite loin de l’éternelle providence[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les impies ». Le grec emploie au masculin pluriel un adjectif substantivé qui signifie littéralement « sans loi ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « prisonniers des ténèbres et entravés par une longue nuit ».'
    reason: lexical_alternative
  - marker: c
    text: Ici, « providence » désigne vraisemblablement l’action durable par laquelle Dieu veille sur le monde et l’ordonne, plutôt qu’une simple prévision.
    reason: cultural_note
lexical_decisions:
- source_word: ὑπειληφότες
  choice: qui pensaient pouvoir
  rationale: Le participe exprime une conviction présomptueuse qui se révèle erronée. Cette tournure française est naturelle et conserve l’idée de leur prétention sans ajouter qu’il s’agissait d’une pure illusion.
- source_word: καταδυναστεύειν
  choice: opprimer
  rationale: Le verbe désigne l’exercice abusif et dominateur du pouvoir; « opprimer » en rend clairement la force morale dans le contexte de l’Exode.
- source_word: ἔθνος ἅγιον
  choice: une nation sainte
  rationale: La traduction littérale préserve l’écho au langage biblique de l’alliance et n’aplatit pas ἔθνος en simple désignation collective.
- source_word: ἄνομοι
  choice: les hommes sans loi
  rationale: L’adjectif masculin pluriel est employé comme substantif. « Hommes sans loi » garde sa forme masculine et sa caractérisation morale sans la réduire à une infraction juridique particulière.
- source_word: δέσμιοι σκότους
  choice: prisonniers des ténèbres
  rationale: δέσμιοι désigne des prisonniers ou des captifs. La formulation nominale française conserve directement l’image de l’emprisonnement.
- source_word: μακρᾶς πεδῆται νυκτός
  choice: enchaînés par une longue nuit
  rationale: πεδῆται évoque des entraves ou des fers. « Enchaînés » maintient cette image concrète dans un français actuel.
- source_word: κατακλεισθέντες ὀρόφοις
  choice: enfermés sous leurs toits
  rationale: ὀρόφοις renvoie littéralement aux toits ou aux espaces couverts. La traduction conserve cette image concrète au lieu de généraliser en « maisons ».
- source_word: φυγάδες
  choice: en fuite loin de
  rationale: Le terme désigne ceux qui fuient. Cette formulation française naturelle préserve l’ironie de personnes enfermées et pourtant présentées comme fuyant la providence.
- source_word: τῆς αἰωνίου προνοίας
  choice: l’éternelle providence
  rationale: Dans la Sagesse, πρόνοια évoque vraisemblablement l’action ordonnatrice et constante de Dieu, et non une simple prévision.
- source_word: ἔκειντο
  choice: gisaient
  rationale: Le verbe présente leur état immobile et accablé. « Gisaient » donne à la scène sa force visuelle tout en restant digne et intelligible.
theological_decisions:
- issue: Sens de προνοία dans le contexte de la Sagesse
  choice: providence
  alternative: prévoyance
  rationale: Ici, le mot renvoie vraisemblablement au gouvernement et aux soins durables de Dieu. « Providence » conserve ce poids théologique sans préciser davantage le mode de l’action divine.
- issue: Forme masculine substantivée de ἄνομοι
  choice: les hommes sans loi
  alternative: les êtres sans loi
  rationale: Le grec est explicitement au masculin pluriel. La traduction conserve cette donnée grammaticale et signale en note l’autre formulation française possible, « les impies ».
- issue: Rapport des fugitifs à la providence
  choice: en fuite loin de l’éternelle providence
  alternative: fugitifs de l’éternelle providence
  rationale: La formulation retenue garde le mouvement d’éloignement exprimé par le génitif avec φυγάδες, sans décider s’ils peuvent réellement échapper à la providence; l’ironie et la tension théologique demeurent.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme excessif. « Gisaient » conserve la solennité et l’immobilité de la scène; les participes coordonnés maintiennent l’accumulation rhétorique du grec. Les images concrètes des ténèbres, des chaînes et des toits sont préservées.
