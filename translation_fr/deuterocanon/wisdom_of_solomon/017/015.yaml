base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/015.yaml
  text: Some were driven by terrifying apparitions[a], and others were paralyzed by the betrayal of their soul[b]; for sudden and unexpected fear came upon them.
translation:
  language: fr
  text: Les uns étaient pourchassés par de terrifiantes apparitions[a], tandis que les autres étaient paralysés par la trahison de leur propre âme[b] ; car une peur soudaine et inattendue les saisit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des fantômes » ou « des visions ». Le grec désigne des apparences effrayantes, peut-être spectrales ou illusoires.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « par la trahison de l’âme ». Cette expression peut évoquer un effondrement intérieur, comme si leur propre être intérieur se retournait contre eux.
    reason: alternative_reading
lexical_decisions:
- source_word: τέρασιν … φαντασμάτων
  choice: de terrifiantes apparitions
  rationale: Le groupe évoque des manifestations visuelles effrayantes et étranges. « Apparitions » conserve leur caractère possiblement spectral ou illusoire, tandis que « terrifiantes » exprime naturellement en français leur aspect prodigieux et inquiétant sans en faire nécessairement des signes divins.
- source_word: ἠλαύνοντο
  choice: étaient pourchassés
  rationale: Le passif à l’imparfait suggère qu’ils étaient poursuivis ou harcelés continuellement. « Pourchassés » restitue mieux cette pression dynamique que le calque moins naturel « poussés ».
- source_word: παρελύοντο
  choice: étaient paralysés
  rationale: Le verbe peut signifier relâcher, affaiblir ou rendre incapable. « Étaient paralysés » convient au contexte de terreur et garde la force physique autant que psychologique de l’image.
- source_word: προδοσίᾳ τῆς ψυχῆς
  choice: par la trahison de leur propre âme
  rationale: La formulation volontairement saisissante du grec présente l’âme comme trahissant ceux qu’elle devrait soutenir. « Leur propre » explicite l’effet réflexif impliqué par le contexte sans résoudre le mécanisme précis de cet effondrement intérieur.
- source_word: αἰφνίδιος … καὶ ἀπροσδόκητος φόβος
  choice: une peur soudaine et inattendue
  rationale: Les deux adjectifs sont conservés afin de rendre la double insistance du grec sur le caractère brusque et imprévu de la peur.
- source_word: ἐπῆλθεν
  choice: s’était abattue sur eux
  rationale: Cette tournure française naturelle rend l’idée d’une peur qui survient et fond sur eux. Le plus-que-parfait relie clairement cet événement à l’état décrit auparavant.
theological_decisions:
- issue: Sens de la formule difficile τὰ δὲ τῆς ψυχῆς παρελύοντο προδοσίᾳ
  choice: les autres étaient paralysés par la trahison de leur propre âme
  alternative: les autres étaient paralysés par une défaillance intérieure
  rationale: 'La traduction retient la métaphore de la « trahison » au lieu de la réduire à une simple faiblesse psychologique ou à la conscience coupable. Elle préserve ainsi l’ambiguïté du grec : leur être intérieur semble les abandonner ou se retourner contre eux sous l’effet de la terreur.'
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme « les uns… les autres » structure clairement la phrase. Les images fortes d’apparitions, de paralysie et de trahison intérieure sont maintenues sans leur imposer une explication confessionnelle ou psychologique précise.
