  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/018.yaml
  text: Even the most hateful animals they revere; for[a], compared in foolishness with the others, they are worse.
translation:
  language: fr
  text: Ils vénèrent[a] même les animaux les plus détestables ; car, comparés aux autres, ils sont encore plus stupides.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « adorent » ou « révèrent ». Le verbe grec peut désigner de manière générale une révérence religieuse.
    reason: alternative_lexicale
lexical_decisions:
- source_word: τὰ ζῷα
  choice: les animaux
  rationale: ζῷον désigne ici des êtres animés pris comme objets de vénération ; « animaux » est le terme français courant et précis dans ce contexte.
- source_word: τὰ ἔχθιστα
  choice: les plus détestables
  rationale: Le superlatif exprime une appréciation fortement négative. « Les plus détestables » en conserve la force sans donner à ἐχθρός le sens contextuellement moins probable d’« hostiles ».
- source_word: σέβονται
  choice: ils vénèrent
  rationale: σέβομαι peut désigner une révérence religieuse ou le culte. « Vénèrent » maintient cette portée religieuse sans imposer le degré de précision cultuelle d’« adorent ».
- source_word: ἀνοίᾳ
  choice: quant à la stupidité
  rationale: Le datif indique vraisemblablement le domaine ou le critère de comparaison. « Quant à la stupidité » conserve cette construction et la nuance de déficience intellectuelle de ἄνοια.
- source_word: συγκρινόμενα τῶν ἄλλων
  choice: comparés aux autres
  rationale: Le participe passif et le génitif établissent une comparaison avec les autres animaux. Le masculin pluriel reprend naturellement « les animaux » en français.
- source_word: χείρονα
  choice: ils sont pires
  rationale: χείρων est un comparatif signifiant « pire » ou « inférieur ». « Pires » garde la formulation évaluative générale et la tension du grec.
theological_decisions:
- issue: Portée religieuse de σέβονται
  choice: ils vénèrent
  alternative: ils adorent / ils révèrent
  rationale: Le passage condamne l’honneur religieux accordé aux animaux. « Vénèrent » rend cette dimension sans préciser davantage que le verbe grec la nature exacte du culte.
- issue: Critère de la comparaison exprimé par ἀνοίᾳ
  choice: quant à la stupidité
  alternative: dans leur folie / par manque d’intelligence
  rationale: Cette traduction traite le datif comme le domaine de comparaison et évite d’attribuer sans nécessité la folie aux adorateurs plutôt qu’aux animaux comparés.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La tournure « quant à la stupidité » est légèrement formelle, mais elle préserve clairement le critère de comparaison et l’ambiguïté conceptuelle du grec.
