  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/007.yaml
  text: For a potter[a], kneading soft earth with toil, molds each vessel for our service; yet from the same clay he formed both the vessels that are servants to clean uses and those for the contrary, all alike. But which is the use of each of them, the potter is the judge.
translation:
  language: fr
  text: Car le potier, en pétrissant péniblement la terre tendre, façonne chaque objet pour notre service. Pourtant, avec la même argile, il a fabriqué aussi bien les récipients asservis à des usages purs[a] que ceux destinés à l’usage contraire, les uns comme les autres. Quant à l’usage de chacun d’eux, c’est le potier qui en est juge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus simplement : « les récipients destinés à des usages purs ». Le grec emploie un mot exprimant littéralement l’asservissement pour décrire leur fonction assignée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κεραμεύς
  choice: potier
  rationale: Terme français courant et précis pour l’artisan qui façonne l’argile.
- source_word: ἁπαλὴν γῆν
  choice: la terre tendre
  rationale: Conserve le sens littéral de « terre » et distingue cette expression de πηλός, rendu ensuite par « argile ».
- source_word: θλίβων ἐπίμοχθον
  choice: en pétrissant péniblement
  rationale: θλίβων évoque l’action de presser ou de travailler la matière, tandis que ἐπίμοχθον souligne l’effort pénible; « pétrissant péniblement » restitue les deux éléments dans un français naturel.
- source_word: πλάσσει
  choice: façonne
  rationale: Verbe idiomatique dans le contexte de la poterie, sans imposer l’emploi d’un moule.
- source_word: πρὸς ὑπηρεσίαν ἡμῶν
  choice: pour notre service
  rationale: Préserve la nuance de service ou de fonction pratique, plutôt que de la réduire à la seule idée d’usage.
- source_word: ἕκαστον
  choice: chaque objet
  rationale: Le substantif est implicite en grec; « objet » l’explicite sans anticiper le terme σκεύη de la proposition suivante.
- source_word: πηλοῦ
  choice: argile
  rationale: Équivalent naturel dans le contexte de la poterie.
- source_word: ἀνεπλάσατο
  choice: il a fabriqué
  rationale: Rend l’aoriste et évite de répéter « façonne », tout en gardant l’idée de production à partir de l’argile.
- source_word: τὰ τῶν καθαρῶν ἔργων δοῦλα σκεύη
  choice: les récipients asservis à des usages purs
  rationale: « Asservis » maintient la métaphore marquée de δοῦλα, tandis que « usages purs » laisse ouverte la portée pratique, rituelle ou morale de καθαρῶν.
- source_word: τὰ ἐναντία
  choice: ceux destinés au contraire
  rationale: Le grec exprime l’opposé sans préciser explicitement « impur »; la traduction conserve cette retenue.
- source_word: πάνθʼ ὁμοίως
  choice: tous de la même manière
  rationale: Souligne que les deux catégories sont façonnées pareillement à partir de la même matière.
- source_word: κριτὴς ὁ πηλουργός
  choice: c’est le potier qui en est juge
  rationale: Préserve le terme judiciaire « juge » et l’emphase finale portée sur le potier.
theological_decisions:
- issue: Métaphore de l’asservissement dans δοῦλα
  choice: les récipients asservis à des usages purs
  alternative: les récipients destinés à des usages purs
  rationale: Le sens fonctionnel est clair dans le contexte, mais le mot δοῦλα porte une métaphore d’asservissement ou d’affectation contrainte. Le texte principal la conserve, avec une note proposant une formulation plus fluide.
- issue: Portée de καθαρῶν
  choice: purs
  alternative: propres
  rationale: « Purs » préserve l’éventuelle dimension rituelle ou morale du mot grec, sans exclure le sens concret de propreté; « propres » risquerait de réduire cette ambiguïté.
- issue: Opposition exprimée par τὰ ἐναντία
  choice: ceux destinés au contraire
  alternative: ceux destinés à des usages impurs
  rationale: Le grec ne nomme pas explicitement l’impureté dans le second membre. La traduction évite de compléter théologiquement l’opposition.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme suit le contraste entre l’unique matière, les fonctions opposées et l’autorité du potier. La formulation conserve les métaphores et ambiguïtés du grec sans les durcir en catégories confessionnelles.
