  text: nor is it so beautiful in the sight of living creatures as to be desired[b][a]; but it has escaped both the praise of God and his blessing.
translation:
  language: fr
  text: Il n’est même pas assez beau pour être désirable, comme le sont les êtres vivants par leur apparence[a] ; il est resté privé de la louange de Dieu et de sa bénédiction[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Il n’est même pas assez beau pour être désiré, comme le sont les êtres vivants par leur apparence. » La construction grecque avec « vue » ou « apparence » peut être comprise de plusieurs manières.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il a échappé à la louange de Dieu et à sa bénédiction », au sens où il ne les a pas reçues.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδʼ ὅσον ἐπιποθῆσαι
  choice: Il n’a même pas une beauté qui puisse le rendre désirable
  rationale: La négation comparative indique que l’objet n’atteint pas même le degré de beauté propre à susciter le désir. Cette formulation française rend naturellement la valeur de l’infinitif ἐπιποθῆσαι sans lui donner artificiellement un sens passif grammatical.
- source_word: ὡς ἐν ζῴων ὄψει καλὰ τυγχάνει
  choice: comme celle que l’on voit chez les êtres vivants
  rationale: ζῷα désigne ici des êtres vivants, vraisemblablement les animaux dont les images sont façonnées. ὄψις peut renvoyer à la vue ou à l’apparence ; la formulation retenue est naturelle tout en signalant en note l’ambiguïté syntaxique.
- source_word: ἐκπέφευγεν
  choice: il est resté privé de
  rationale: Le parfait exprime un état résultant. Le sens littéral d’« échapper à » risquerait de suggérer un évitement heureux ou volontaire ; dans ce contexte négatif, l’idée est que l’objet n’a pas reçu la louange ni la bénédiction.
- source_word: τὸν τοῦ θεοῦ ἔπαινον
  choice: la louange de Dieu
  rationale: Cette traduction conserve la relation génitive du grec, qui peut évoquer la louange ou l’approbation venant de Dieu, sans la préciser au-delà du texte.
- source_word: τὴν εὐλογίαν αὐτοῦ
  choice: sa bénédiction
  rationale: Traduction directe et idiomatique ; le possessif renvoie naturellement à Dieu.
theological_decisions:
- issue: Référent du sujet singulier
  choice: Le pronom « il » renvoie à l’objet façonné, considéré comme représentant la catégorie des images idolâtriques.
  alternative: Le sujet pourrait viser plus généralement l’animal représenté.
  rationale: Le contexte immédiat porte sur les images fabriquées. Le français conserve toutefois le singulier du grec sans ajouter explicitement « idole », afin de ne pas résoudre davantage le référent.
- issue: Valeur négative de ἐκπέφευγεν
  choice: « il est resté privé de » exprime l’absence de louange et de bénédiction divines.
  alternative: « il a échappé à » serait plus formellement proche, mais pourrait faire croire à un évitement avantageux ou intentionnel.
  rationale: Le contexte condamne l’objet ; le verbe décrit donc une privation ou un manquement, non une délivrance heureuse.
translation_notes:
  register: Français international moderne, digne et accessible. La première proposition est légèrement explicitée pour rendre la comparaison grecque intelligible ; les notes préservent son ambiguïté. « Êtres vivants » maintient la portée de ζῷα, tandis que le contexte permet de penser particulièrement aux animaux.
