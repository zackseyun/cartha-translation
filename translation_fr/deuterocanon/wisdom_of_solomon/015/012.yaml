base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/012.yaml
  text: But he considered our life to be a game[a], and our way of life a profitable festival; for, he says, one must get resources from wherever one can[b], even from evil.
translation:
  language: fr
  text: Mais il considéra notre vie comme un jeu et notre manière de vivre comme une fête lucrative ; car, dit-il, il faut se procurer des ressources de quelque source que ce soit, fût-ce du mal[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, « se procurer des ressources d’où que ce soit, même du mal ». La formule peut aussi se comprendre : « tirer profit de toute source possible, même en faisant le mal ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλογίσατο
  choice: considère
  rationale: Le verbe exprime ici un jugement porté sur la vie. Le présent français rend naturellement le point de vue caractéristique du personnage dans ce portrait, sans perdre la valeur évaluative de l’aoriste grec.
- source_word: παίγνιον
  choice: un jeu
  rationale: Le nom désigne ce qui relève du jeu ou de l’amusement. « Un jeu » est naturel et conserve la critique morale sans imposer le sens plus précis de « jouet ».
- source_word: τὴν ζωὴν ἡμῶν
  choice: notre vie
  rationale: Traduction directe qui conserve le premier terme du couple ζωή / βίος.
- source_word: τὸν βίον
  choice: notre manière de vivre
  rationale: Cette formulation distingue βίος de ζωή et convient au comportement pratique et économique décrit dans la suite.
- source_word: πανηγυρισμὸν ἐπικερδῆ
  choice: une fête lucrative
  rationale: πανηγυρισμός évoque une célébration ou fête publique, tandis que ἐπικερδής souligne la recherche du gain. « Fête lucrative » maintient ensemble l’image festive et sa visée mercantile.
- source_word: δεῖν
  choice: il faut
  rationale: Rend simplement et idiomatiquement la nécessité impersonnelle exprimée par le grec.
- source_word: φησιν
  choice: dit-il
  rationale: L’incise française conserve le discours rapporté explicite du texte grec.
- source_word: ὅθεν δὴ κἂν
  choice: par tous les moyens
  rationale: Dans la construction avec πορίζειν, l’expression marque l’indifférence à la provenance ou au moyen employé. La note conserve une formulation plus littérale axée sur la source.
- source_word: πορίζειν
  choice: se procurer des ressources
  rationale: Le verbe signifie procurer ou acquérir, souvent dans un contexte matériel. Cette expression garde cette nuance acquisitive sans la réduire au seul profit financier.
- source_word: ἐκ κακοῦ
  choice: même par le mal
  rationale: Dans ce contexte de recherche du gain, le syntagme a vraisemblablement une portée morale et désigne le recours à des moyens mauvais, tout en laissant en note la possibilité d’une formulation centrée sur la provenance.
theological_decisions:
- issue: Portée morale de ἐκ κακοῦ
  choice: « même par le mal », compris comme l’obtention de ressources au moyen du mal
  alternative: « même à partir d’une mauvaise situation » ou « même de ce qui est mauvais »
  rationale: Le contexte condamne une mentalité mercantile et moralement corrompue. La traduction principale exprime cette force morale, tandis que la note préserve l’ambiguïté entre source et moyen.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve le contraste entre « vie » et « manière de vivre », ainsi que l’image d’une fête recherchée pour le gain. Les notes signalent les ambiguïtés réelles de παίγνιον et de la formule finale sans alourdir le texte principal.
