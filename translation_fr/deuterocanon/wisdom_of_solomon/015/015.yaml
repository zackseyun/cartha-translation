base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/015.yaml
  text: For they even considered all the idols of the nations to be gods—things that have neither the use of eyes for seeing[a], nor noses for drawing in air, nor ears to hear, nor fingers of hands for feeling, and their feet are useless for walking.
translation:
  language: fr
  text: Car ils ont même considéré comme des dieux toutes les idoles des nations, alors qu’elles n’ont ni des yeux capables de voir, ni des narines pour inspirer l’air, ni des oreilles pour entendre, ni des doigts pour toucher, et que leurs pieds sont incapables de marcher.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλογίσαντο
  choice: ont considéré comme
  rationale: Le verbe exprime le fait de tenir ou regarder quelque chose comme tel. « Considérer comme » est naturel en français et conserve la dimension d’évaluation.
- source_word: εἴδωλα
  choice: idoles
  rationale: Dans ce contexte polémique, il s’agit d’images cultuelles tenues à tort pour des dieux. « Idoles » rend à la fois l’objet matériel et la critique religieuse.
- source_word: ἐθνῶν
  choice: des nations
  rationale: Cette traduction directe évite d’introduire le terme plus marqué « païens » ou l’idiome néotestamentaire « Gentils ».
- source_word: ὀμμάτων χρῆσις εἰς ὅρασιν
  choice: des yeux capables de voir
  rationale: La formulation française naturelle exprime l’absence de fonction visuelle indiquée par le grec, sans la lourdeur de « l’usage des yeux pour voir ».
- source_word: συνολκὴν ἀέρος
  choice: aspirer l’air
  rationale: Le grec évoque littéralement l’action de faire entrer ou d’attirer l’air. « Aspirer l’air » conserve cette image concrète et convient aux narines.
- source_word: δάκτυλοι χειρῶν εἰς ψηλάφησιν
  choice: des doigts aux mains pour toucher
  rationale: « Aux mains » exprime idiomatiquement le génitif grec, tandis que « toucher » rend la perception tactile de ψηλάφησις.
- source_word: ἀργοὶ πρὸς ἐπίβασιν
  choice: incapables de marcher
  rationale: Dans ce contexte, ἀργοί indique l’inefficacité ou l’inactivité des pieds, et ἐπίβασις le fait d’avancer en posant le pied. Cette formulation transmet clairement la critique fonctionnelle.
theological_decisions:
- issue: Force de la polémique contre les idoles
  choice: Présenter directement les idoles comme des objets privés de perception et de mouvement, mais considérés comme des dieux.
  alternative: Adoucir la critique en parlant simplement d’images symboliques.
  rationale: Le grec tourne explicitement en dérision leur absence de capacités sensorielles et motrices. La traduction conserve cette force sans ajouter de commentaire doctrinal.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe analytique du grec est légèrement fluidifiée, tout en conservant l’énumération concrète des organes et de leurs fonctions.
