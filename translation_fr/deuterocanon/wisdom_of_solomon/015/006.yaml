base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/006.yaml
  text: Lovers of evil are worthy of such hopes[b][a], both those who make them and those who desire them and those who worship them.
translation:
  language: fr
  text: 'Ceux qui aiment le mal sont dignes de pareilles espérances[a] : ceux qui fabriquent ces idoles[b], ceux qui les désirent et ceux qui les adorent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’espérances comme celles-là ». L’expression renvoie aux attentes liées aux idoles dans le contexte.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ceux qui font » ou « ceux qui agissent ». Dans le contexte, il s’agit de ceux qui fabriquent ou façonnent les idoles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κακῶν ἐρασταί
  choice: ceux qui aiment le mal
  rationale: Cette formulation naturelle rend le génitif κακῶν avec ἐρασταί et conserve la portée morale de l’expression sans le tour plus littéraire « amoureux du mal ».
- source_word: ἄξιοί
  choice: sont dignes de
  rationale: Le prédicat exprime ce que ces personnes méritent; « sont dignes de » reste proche du grec et garde la pointe ironique du jugement.
- source_word: τοιούτων ἐλπίδων
  choice: de pareilles espérances
  rationale: « Pareilles » conserve la valeur rétrospective de τοιούτων, tandis qu’« espérances » rend ἐλπίδων sans réduire le terme à de simples prévisions.
- source_word: οἱ δρῶντες
  choice: ceux qui fabriquent ces idoles
  rationale: Pris isolément, le participe signifie littéralement « ceux qui font »; dans le contexte immédiat des images façonnées, il désigne leurs fabricants. Le nom explicite le référent sous-entendu pour éviter une ambiguïté artificielle en français.
- source_word: οἱ ποθοῦντες
  choice: ceux qui les désirent
  rationale: ποθέω marque le désir ou l’aspiration. « Désirent » est clair, actuel et suffisamment fort, tout en maintenant le même référent pronominal.
- source_word: οἱ σεβόμενοι
  choice: ceux qui les adorent
  rationale: Dans ce contexte cultuel, σέβομαι désigne la vénération religieuse; « adorer » exprime naturellement le culte rendu aux idoles.
theological_decisions:
- issue: Objet sous-entendu des trois participes
  choice: Expliciter « ces idoles » avec le premier participe, puis employer « les » avec les deux suivants.
  alternative: Laisser l’objet indéterminé (« ceux qui les font ») ou rendre δρῶντες de manière abstraite (« ceux qui agissent ainsi »).
  rationale: Le grec omet un objet récupérable dans le contexte. L’explicitation identifie les images idolâtres sans ajouter une idée théologique étrangère et permet une formulation française fluide.
- issue: Portée de « pareilles espérances »
  choice: Conserver la formulation ouverte et rétrospective du grec.
  alternative: Préciser qu’il s’agit des attentes placées dans les idoles ou des conséquences qu’elles entraînent.
  rationale: Le grec ne définit pas ici explicitement le contenu des espérances. La traduction préserve cette tension plutôt que de trancher entre l’attente idolâtre et son issue dérisoire.
translation_notes:
  register: Français international moderne, digne et accessible. La structure ternaire du grec est conservée après les deux-points. « Ces idoles » explicite une fois le référent contextuel, puis les pronoms évitent la lourdeur.
