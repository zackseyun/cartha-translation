base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/014.yaml
  text: But all of them are most foolish and more miserable than an infant's soul—these enemies of your people who oppressed it.
translation:
  language: fr
  text: 'Mais tous sont les plus insensés et plus malheureux que l’âme d’un nourrisson[a] : ces ennemis de ton peuple, qui l’ont opprimé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « plus pitoyables qu’un nourrisson » ou « plus malheureux que la vie d’un nourrisson ». Le grec compare littéralement ces ennemis à « l’âme » ou à « la vie d’un nourrisson », dans une expression condensée qui peut évoquer une extrême faiblesse ou une condition digne de pitié.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: tous
  rationale: Conserve la portée globale du grec dans une formulation française directe.
- source_word: ἀφρονέστατοι
  choice: au comble de la folie
  rationale: 'Rend naturellement en français la force superlative de l’adjectif : ils sont extrêmement dépourvus de raison.'
- source_word: τάλανες ὑπὲρ
  choice: plus malheureux que
  rationale: Exprime la comparaison introduite par ὑπέρ et la condition misérable ou digne de pitié indiquée par τάλανες.
- source_word: ψυχὴν νηπίου
  choice: l’âme d’un nourrisson
  rationale: Préserve l’image grecque inhabituelle ainsi que l’ambiguïté de ψυχή, qui peut aussi désigner la vie.
- source_word: οἱ ἐχθροὶ τοῦ λαοῦ σου
  choice: ce sont les ennemis de ton peuple
  rationale: Explicite sans lourdeur la valeur appositive de la construction grecque.
- source_word: οἱ καταδυναστεύσαντες αὐτόν
  choice: ceux qui l’ont opprimé
  rationale: Rend le participe aoriste et fait reprendre par le pronom le nom collectif singulier « peuple », comme αὐτόν reprend λαόν en grec.
theological_decisions:
- issue: Sens de la comparaison ὑπὲρ ψυχὴν νηπίου
  choice: « plus malheureux que l’âme d’un nourrisson »
  alternative: « plus pitoyables qu’un nourrisson » ou « plus malheureux que la vie d’un nourrisson »
  rationale: La formulation grecque est condensée et permet à ψυχή de signifier « âme » ou « vie ». Le texte principal conserve cette tension au lieu de préciser arbitrairement la nature de la comparaison.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « au comble de la folie » maintient le superlatif sans archaïsme; l’image étrange de « l’âme d’un nourrisson » est volontairement conservée et éclairée en note.
