  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/004.yaml
  text: For neither did the evil-crafted invention of men lead us astray[a], nor the fruitless labor of a painter of shadows—an image stained with varied colors[b];
translation:
  language: fr
  text: Car ni l’artifice pervers des hommes ne nous a égarés[a], ni le travail stérile de peintres en clair-obscur — une image maculée de couleurs variées[b] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne nous a trompés ». Le verbe grec peut désigner la tromperie ou le fait de détourner quelqu’un du bon chemin.
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque désigne des peintres travaillant par contours, ombrage ou clair-obscur. Dans le contexte, elle participe à la critique des images peintes.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπλάνησεν
  choice: ne nous a égarés
  rationale: Le verbe peut exprimer à la fois l’égarement hors du bon chemin et la tromperie. « Égarés » conserve cette image tout en restant naturel en français.
- source_word: ἀνθρώπων κακότεχνος ἐπίνοια
  choice: l’invention pernicieuse des hommes
  rationale: « Invention » rend l’idée de conception ou de procédé imaginé, tandis que « pernicieuse » porte le jugement moral du composé κακότεχνος sans produire une formulation artificielle.
- source_word: σκιαγράφων
  choice: des peintres d’ombres
  rationale: Le terme désigne ceux qui dessinent ou peignent au moyen de contours et d’ombres. La formulation concrète préserve l’image artistique et son caractère inhabituel.
- source_word: πόνος ἄκαρπος
  choice: le travail stérile
  rationale: Cette expression rend l’effort dépourvu de fruit ou de véritable bénéfice, avec une tournure française naturelle et digne.
- source_word: εἶδος
  choice: une image
  rationale: Dans le contexte de la fabrication des idoles, il s’agit d’une représentation visible plutôt que de la seule apparence abstraite.
- source_word: σπιλωθὲν
  choice: souillée
  rationale: Le participe évoque une image tachée ou barbouillée. « Souillée » conserve à la fois le sens visuel et la nuance péjorative du contexte.
- source_word: χρώμασιν διηλλαγμένοις
  choice: de couleurs variées
  rationale: La formule indique des couleurs différentes les unes des autres ; « variées » est concise et fidèle.
theological_decisions:
- issue: Maintenir la condamnation morale de l’art idolâtre sans condamner indistinctement toute activité artistique
  choice: Présenter comme pernicieuse l’invention humaine visée et comme stérile le travail produisant l’image idolâtre
  alternative: Employer un vocabulaire neutre décrivant simplement une invention et un travail pictural
  rationale: Le grec porte explicitement un jugement négatif par κακότεχνος et ἄκαρπος, mais le contexte et les termes concrets orientent ce jugement vers la fabrication d’images idolâtres.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe coordonnée et le point-virgule final respectent le caractère continu de la phrase dans son contexte. « Peintres d’ombres » garde l’étrangeté concrète du grec, éclairée par une note.
