  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/010.yaml
  text: His heart is ashes[a], and his hope is more worthless than earth, and his life more dishonored than clay[b],
translation:
  language: fr
  text: Son cœur n’est que cendre, son espérance vaut moins que la terre, et sa vie est plus méprisée que l’argile[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « plus déshonorée que l’argile » ; le terme grec souligne la privation d’honneur ou d’estime.
    reason: lexical_alternative
lexical_decisions:
- source_word: σποδός
  choice: cendre
  rationale: Le singulier collectif « cendre » est naturel en français et conserve la métaphore directe d’une réalité sans vie ni valeur.
- source_word: καρδία
  choice: cœur
  rationale: « Cœur » préserve le terme anthropologique biblique et désigne ici le centre intérieur de la personne sans le réduire à l’intellect.
- source_word: γῆς
  choice: terre
  rationale: Après le comparatif, le génitif fournit l’étalon de comparaison. « Terre » garde le sens matériel général et s’accorde avec l’image de l’argile.
- source_word: εὐτελεστέρα
  choice: vaut moins
  rationale: Cette formulation française exprime clairement l’infériorité de valeur sans suggérer uniquement un prix marchand.
- source_word: ἐλπίς
  choice: espérance
  rationale: « Espérance » convient au registre sapientiel et exprime l’attente ou la confiance placée dans ce qui ne peut la soutenir.
- source_word: πηλός
  choice: argile
  rationale: Dans le contexte de la fabrication des idoles, « argile » est plus précis que « boue » et conserve le contraste matériel.
- source_word: ἀτιμότερος
  choice: plus méprisée
  rationale: Ce choix rend la privation d’honneur ou d’estime exprimée par le grec, dans un français naturel.
- source_word: βίος
  choice: vie
  rationale: Dans la triade cœur, espérance et vie, « vie » désigne avec cohérence l’existence entière de la personne.
theological_decisions:
- issue: Force métaphorique des trois prédicats appliqués à l’idolâtre
  choice: Conserver une métaphore directe pour le cœur et des comparatifs fortement dépréciatifs pour l’espérance et la vie.
  alternative: « Son cœur est comme de la cendre » ou une paraphrase psychologique telle que « son esprit est poussière ».
  rationale: Le grec énonce directement « son cœur [est] cendre » et ne marque aucune comparaison dans la première proposition. La formulation retenue maintient la vigueur de la polémique contre l’idolâtrie sans l’adoucir ni l’expliquer excessivement.
translation_notes:
  register: Français international moderne, sobre et digne. « N’est que cendre » restitue naturellement la métaphore nominale, tandis que « vaut moins que » évite le tour peu idiomatique « plus sans valeur que ». Le verset conserve sa structure ternaire et sa ponctuation ouverte sur la suite.
