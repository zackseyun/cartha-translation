base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/005.yaml
  text: The sight of them comes to fools as a reproach[a], and they long for the form of a lifeless image.
translation:
  language: fr
  text: Leur aspect devient pour les insensés un objet de reproche, et ils désirent la forme sans souffle d’une image morte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec rendu par « ils désirent » est au singulier. Sa construction condensée ne précise pas clairement son sujet ; la traduction l’entend des insensés, conformément au contexte.
    reason: ambiguïté syntaxique
lexical_decisions:
- source_word: ὄψις
  choice: aspect
  rationale: Dans ce contexte visuel, « aspect » exprime l’apparence offerte au regard sans l’ambiguïté française de « leur vue », qui pourrait désigner leur faculté de voir.
- source_word: ἄφροσιν
  choice: les insensés
  rationale: Le terme désigne ceux qui manquent de discernement ou de sagesse; « les insensés » convient au contraste moral caractéristique du livre.
- source_word: εἰς ὄνειδος ἔρχεται
  choice: devient un sujet de honte
  rationale: Cette formulation naturelle rend l’idée de résultat ou de caractérisation portée par εἰς avec ἔρχεται, tout en conservant la valeur nominale de ὄνειδος.
- source_word: ποθεῖ
  choice: ceux-ci désirent
  rationale: Le singulier grec est syntaxiquement difficile. Le rendu explicite les insensés comme sujet logique du désir, conformément à la polémique contre l’attrait exercé par les idoles, tout en signalant l’ambiguïté en note.
- source_word: εἶδος
  choice: forme
  rationale: Le mot désigne ici la forme ou l’apparence visible; « forme » évite de répéter « aspect ».
- source_word: νεκρᾶς εἰκόνος
  choice: d’une image morte
  rationale: Le rendu conserve la force littérale et polémique de νεκρά, qui présente l’idole comme dépourvue de vie.
- source_word: ἄπνουν
  choice: sans souffle
  rationale: Le rendu garde l’image concrète de l’absence de souffle et ne confond pas cet adjectif avec νεκρά, déjà rendu par « morte ».
theological_decisions:
- issue: Sujet du verbe de désir dans la polémique contre les idoles
  choice: 'Les insensés sont explicités comme sujet logique : « ceux-ci désirent ».'
  alternative: Conserver formellement le singulier et rattacher le verbe à « aspect », au prix d’une formulation obscure où l’aspect lui-même désirerait.
  rationale: La syntaxe grecque est comprimée et le singulier ποθεῖ ne s’accorde pas simplement avec ἄφροσιν. Le contexte vise toutefois l’attrait des insensés pour les images. L’explicitation choisie donne un français intelligible sans effacer l’incertitude, laquelle est indiquée en note.
translation_notes:
  register: Français international moderne, sobre et digne. « Sans souffle » préserve l’image biblique concrète, tandis que « image morte » maintient distincts les deux qualificatifs grecs.
