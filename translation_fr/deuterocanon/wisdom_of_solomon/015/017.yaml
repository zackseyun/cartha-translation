revisions:
- from: 'Mais, bien qu’il soit mortel, il fabrique une chose morte de ses mains criminelles. Car il vaut mieux que les objets qu’il vénère[a] : lui-même a vécu, tandis qu’eux n’ont jamais vécu.'
  to: 'Mais lui, qui est mortel, fabrique une chose morte avec ses mains impies ; car il est supérieur aux objets qu’il vénère[a] : lui-même a vécu, tandis qu’eux n’ont jamais vécu.'
  rationale: La révision retire la concession non exprimée par le grec, rend le complément instrumental et la nuance de ἀνόμοις avec davantage de fidélité, et précise la valeur comparative de κρείττων. Elle conserve l’ambiguïté lexicale de σεβάσματα dans le texte, avec « idoles » en note.
