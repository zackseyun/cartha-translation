base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/017.yaml
  text: Yet being mortal[a], he makes a dead thing with lawless hands; for he is better than the things he worships, since he himself once lived, but those never did.
translation:
  language: fr
  text: 'Mais lui, qui est mortel, fabrique une chose morte avec ses mains impies ; car il est supérieur aux objets qu’il vénère[a] : lui-même a vécu, tandis qu’eux n’ont jamais vécu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses idoles ».
    reason: Alternative lexicale contextuellement justifiée pour σεβάσματα, qui désigne des objets de vénération ou de culte.
lexical_decisions:
- source_word: θνητὸς
  choice: mortel
  rationale: Le terme désigne un être sujet à la mort et maintient le contraste avec l’objet entièrement privé de vie.
- source_word: νεκρὸν
  choice: une chose morte
  rationale: L’adjectif substantivé désigne ici l’idole comme une réalité sans vie ; « cadavre » serait trop concret et trompeur.
- source_word: ἐργάζεται
  choice: il fabrique
  rationale: Dans le contexte de la confection d’une idole, « fabriquer » exprime naturellement l’action de produire de ses mains.
- source_word: χερσὶν ἀνόμοις
  choice: de ses mains criminelles
  rationale: Cette formulation française naturelle conserve la condamnation morale et l’idée d’une action contraire à la loi portée par ἀνόμοις.
- source_word: κρείττων
  choice: il vaut mieux
  rationale: Le comparatif affirme, avec une ironie polémique, la supériorité du fabricant vivant sur ses objets de culte.
- source_word: τῶν σεβασμάτων αὐτοῦ
  choice: que les objets qu’il vénère
  rationale: σεβάσματα désigne ce qui reçoit révérence ou culte. La formulation conserve ce sens sans remplacer d’emblée le nom par le terme plus interprétatif « idoles ».
- source_word: ἔζησεν
  choice: a vécu
  rationale: L’aoriste affirme que l’artisan a connu la vie, contrairement aux idoles qui ne l’ont jamais possédée, sans préciser davantage la valeur temporelle.
- source_word: οὐδέποτε
  choice: n’ont jamais vécu
  rationale: La répétition explicite de « vécu » rend clairement en français la négation absolue de toute vie chez les objets vénérés.
theological_decisions:
- issue: Rendu de σεβάσματα dans la polémique contre l’idolâtrie
  choice: les objets qu’il vénère
  alternative: ses idoles
  rationale: Le contexte vise clairement les idoles, mais le grec nomme plus largement les objets auxquels un culte est rendu. Le texte principal préserve cette portée lexicale, tandis que la note donne l’interprétation contextuelle directe.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le contraste ironique entre l’artisan mortel, qui a vécu, et les objets de culte qu’il fabrique, qui n’ont jamais eu la vie.
