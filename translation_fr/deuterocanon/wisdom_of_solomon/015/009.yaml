  verdict: revise
  source_fidelity: La formulation « finira par s’épuiser » affaiblit μέλλει, qui présente l’épuisement comme imminent ou sur le point d’arriver. « Va s’épuiser » rend plus directement cette valeur prospective. Le reste restitue bien le contraste entre la mortalité négligée de l’artisan, sa rivalité avec les spécialistes des métaux, et sa fierté de fabriquer des objets faux.
  naturalness: Le français est moderne, fluide et d’un registre approprié. « Artisans de l’or et de l’argent » est plus immédiatement transparent que l’association « orfèvres et artisans de l’argent », tout en conservant la distinction explicite des deux métiers grecs.
  terminology: « Artisans de l’or et de l’argent », « ceux qui façonnent le bronze » et « modeler » sont précis et accessibles. « Contrefaçons » convient à κίβδηλα dans ce contexte, à condition que la note conserve les possibilités moins juridiquement marquées (« objets faux », « falsifiés »).
  issues:
  - severity: medium
    issue: Valeur de μέλλει dans « finira par s’épuiser »
    rationale: « Finira par » évoque une issue éventuelle ou simplement ultérieure, tandis que μέλλει κάμνειν signifie plus naturellement « être sur le point de se fatiguer / s’épuiser ». La correction préserve mieux la force temporelle du grec sans surinterpréter κάμνειν.
  - severity: low
    issue: Désignation des artisans de l’or et de l’argent
    rationale: « Orfèvres » peut en français désigner plus largement des travailleurs des métaux précieux et brouiller légèrement l’opposition grecque entre travailleurs de l’or et de l’argent. La formulation révisée explicite le parallélisme.
