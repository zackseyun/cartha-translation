base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/009.yaml
  text: Yet his concern is not that he is about to grow weary[a], nor that his life is short; rather, he competes with goldsmiths and silversmiths, imitates bronze-workers[b], and considers it a glory that he molds counterfeit things.
translation:
  language: fr
  text: Mais ce qui le préoccupe, ce n’est pas qu’il va s’épuiser[a], ni que sa vie est brève. Il rivalise plutôt avec les artisans de l’or et de l’argent, imite ceux qui façonnent le bronze et met sa gloire à modeler des contrefaçons[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’il tombera malade ». Le verbe grec peut évoquer la fatigue, l’épuisement ou la maladie.
    reason: lexical_alternative
  - marker: b
    text: Ou « des objets faux » ; le mot grec peut aussi qualifier ce qui est falsifié ou frelaté.
    reason: lexical_alternative
lexical_decisions:
- source_word: φροντίς
  choice: ce qui le préoccupe
  rationale: Cette tournure française naturelle désigne ce qui occupe son esprit, sans imposer l’idée plus forte d’angoisse.
- source_word: μέλλει κάμνειν
  choice: il finira par s’épuiser
  rationale: μέλλει marque ici une issue à venir, tandis que κάμνειν évoque d’abord la fatigue ou l’épuisement; la formulation souligne la fragilité du fabricant mortel.
- source_word: βραχυτελῆ βίον
  choice: sa vie est brève
  rationale: Le composé qualifie une vie qui arrive rapidement à son terme. «Sa vie est brève» est clair, actuel et fidèle.
- source_word: ἀντερείδεται
  choice: il rivalise avec
  rationale: Le verbe exprime l’opposition ou l’émulation compétitive envers d’autres artisans.
- source_word: χρυσουργοῖς καὶ ἀργυροχόοις
  choice: les orfèvres et les artisans de l’argent
  rationale: «Orfèvres» rend naturellement les artisans travaillant l’or; la seconde expression maintient explicitement le parallèle avec l’argent, sans employer le peu courant «argentiers».
- source_word: χαλκοπλάστας
  choice: ceux qui façonnent le bronze
  rationale: La périphrase est immédiatement compréhensible et conserve la matière ainsi que l’activité de façonnage.
- source_word: μιμεῖται
  choice: imite
  rationale: Rend directement l’idée de prendre pour modèle ou de copier leur travail.
- source_word: δόξαν ἡγεῖται
  choice: met sa gloire à
  rationale: Cette expression française conserve à la fois l’évaluation orgueilleuse du fabricant et l’ironie du passage.
- source_word: κίβδηλα
  choice: des contrefaçons
  rationale: Le terme désigne ce qui est faux, falsifié ou de qualité frelatée. «Contrefaçons» préserve ici la condamnation implicite des objets fabriqués.
- source_word: πλάσσει
  choice: modeler
  rationale: Le verbe convient au geste de donner forme à une matière et maintient l’image concrète du travail artisanal.
theological_decisions:
- issue: Portée morale de κίβδηλα dans la critique de la fabrication des idoles
  choice: des contrefaçons
  alternative: des objets faux; des ouvrages frelatés
  rationale: Le contexte condamne la fabrication idolâtre, et κίβδηλα comporte une nuance réelle de fausseté ou d’altération. «Contrefaçons» laisse entendre cette ironie morale sans ajouter une qualification doctrinale étrangère au verset.
- issue: Nature de la défaillance future exprimée par κάμνειν
  choice: il finira par s’épuiser
  alternative: il tombera malade; il se fatiguera
  rationale: Le grec peut évoquer la fatigue, l’épuisement ou, selon l’usage, la maladie. Le texte principal retient le sens physique général de l’épuisement et la note conserve l’ambiguïté.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les métiers artisanaux sont rendus par des termes courants ou des périphrases transparentes; le parallélisme et l’ironie accusatrice du grec sont préservés.
