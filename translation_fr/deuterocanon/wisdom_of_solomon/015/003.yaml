  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/003.yaml
  text: For to know you is complete righteousness[a], and to know your power is the root of immortality.
translation:
  language: fr
  text: Car te connaître, c’est la justice dans toute sa plénitude[a], et connaître ta puissance, c’est la racine de l’immortalité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la rectitude dans toute sa plénitude ».'
    reason: δικαιοσύνη peut désigner la justice ou la rectitude; la note conserve cette nuance sans ajouter d’élément absent du grec.
lexical_decisions:
- source_word: ἐπίστασθαί
  choice: te connaître
  rationale: L’infinitif exprime ici la connaissance ou la reconnaissance de Dieu. « Connaître » est naturel et conserve la formulation dense du grec.
- source_word: ὁλόκληρος
  choice: dans toute sa plénitude
  rationale: Le terme qualifie la justice comme entière, complète. Cette tournure française rend idiomatiquement cette idée de totalité sans suggérer ici la perfection morale individuelle.
- source_word: δικαιοσύνη
  choice: justice
  rationale: « Justice » est le correspondant français normal de δικαιοσύνη et peut désigner ici la pleine rectitude liée à la connaissance de Dieu. Une note conserve l’autre nuance théologique possible, « juste devant Dieu ».
- source_word: εἰδέναι
  choice: reconnaître
  rationale: Le verbe signifie savoir, connaître ou reconnaître. « Reconnaître » évite une répétition lourde en français tout en gardant le parallèle avec ἐπίστασθαί et l’idée de discerner la puissance divine.
- source_word: κράτος
  choice: puissance
  rationale: Le nom désigne la force effective ou la puissance manifestée. « Puissance » convient au registre théologique du passage sans introduire l’idée plus politique de domination.
- source_word: ῥίζα
  choice: racine
  rationale: La métaphore explicite du grec est conservée, car elle reste claire et expressive en français.
- source_word: ἀθανασίας
  choice: immortalité
  rationale: « Immortalité » est le terme français précis et usuel dans le registre sapientiel et théologique.
theological_decisions:
- issue: Portée de δικαιοσύνη dans ce contexte sapientiel et théologique
  choice: justice
  alternative: Le fait d’être pleinement juste devant Dieu
  rationale: Le français « justice » maintient l’étendue sémantique de δικαιοσύνη, qui peut inclure rectitude et juste relation à Dieu. La note explicite la lecture personnelle et théologique sans l’imposer dans le texte.
translation_notes:
  register: Français moderne, international et digne. La structure en deux propositions parallèles est conservée; la seconde emploie « reconnaître » pour un parallélisme naturel sans effacer la proximité des deux verbes grecs de connaissance.
