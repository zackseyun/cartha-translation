  text: But you, our God, are kind and true, patient, and governing all things with mercy.
translation:
  language: fr
  text: Mais toi, notre Dieu, tu es bon et vrai, patient, et tu gouvernes toutes choses avec miséricorde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σὺ δὲ
  choice: Mais toi
  rationale: Préserve le contraste marqué par δέ ainsi que l’adresse directe et emphatique.
- source_word: χρηστός
  choice: bon
  rationale: Dans ce portrait du caractère divin, « bon » exprime naturellement la bonté bienveillante de χρηστός; « bienveillant » serait également possible, mais plus explicatif.
- source_word: ἀληθής
  choice: vrai
  rationale: Conserve la portée large du grec, qui peut évoquer la véracité aussi bien que l’authenticité, sans la réduire à « véridique ».
- source_word: μακρόθυμος
  choice: patient
  rationale: Rend en français actuel l’idée de patience et de lenteur à la colère, sans l’archaïsme de « longanime ».
- source_word: ἐλέει
  choice: avec miséricorde
  rationale: Le datif indique ici la manière dont Dieu gouverne; cette formulation garde le substantif et sa tonalité théologique.
- source_word: διοικῶν
  choice: tu gouvernes
  rationale: Le participe présent grec prolonge la série des descriptions divines. Une proposition coordonnée est plus naturelle en français tout en conservant l’action présente de gouverner ou administrer.
- source_word: τὰ πάντα
  choice: toutes choses
  rationale: Formulation française digne et compréhensible qui préserve l’étendue générale de l’expression grecque.
theological_decisions:
- issue: Le gouvernement divin exercé dans la miséricorde
  choice: « tu gouvernes toutes choses avec miséricorde »
  alternative: « administrant toutes choses dans ta miséricorde »
  rationale: 'Le choix affirme seulement ce que dit le texte: Dieu gouverne l’ensemble du réel, et ce gouvernement s’exerce avec miséricorde. Il n’ajoute aucun système doctrinal particulier.'
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « tu » clarifie la syntaxe après la série d’adjectifs. Aucun archaïsme ni terme confessionnel distinctif.
