  text: because he did not know the one who formed him[b][a], and the one who breathed into him an active soul and breathed into him a life-giving spirit.
translation:
  language: fr
  text: parce qu’il n’a pas connu[a] celui qui l’a façonné et qui a insufflé en lui une âme agissante[b] et soufflé en lui un esprit qui donne la vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « n’a pas reconnu celui qui l’a façonné ».'
    reason: lexical_alternative
  - marker: b
    text: « Une âme agissante » peut aussi se traduire par « une âme active » ou, de manière plus interprétative, « une âme vivante ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγνόησεν
  choice: n’a pas connu
  rationale: Le verbe peut exprimer l’ignorance ou le défaut de reconnaissance. « N’a pas connu » reste naturel et préserve cette latitude sans préciser si l’ignorance est coupable.
- source_word: τὸν πλάσαντα αὐτόν
  choice: celui qui l’a façonné
  rationale: « Façonner » rend l’image concrète de πλάσσω et son évocation de la création, sans ajouter de matière non mentionnée.
- source_word: ἐμπνεύσαντα αὐτῷ
  choice: a insufflé en lui
  rationale: Cette formulation conserve l’image d’un souffle communiqué à la personne et reste idiomatique en français moderne.
- source_word: ψυχὴν ἐνεργοῦσαν
  choice: une âme agissante
  rationale: « Âme » distingue ψυχή de πνεῦμα, tandis qu’« agissante » rend le sens actif et opérant de ἐνεργοῦσαν sans le réduire simplement à « vivante ».
- source_word: ἐμφυσήσαντα
  choice: a soufflé en lui
  rationale: La formulation conserve l’image du souffle et le parallélisme avec ἐμπνεύσαντα, tout en distinguant légèrement les deux verbes grecs.
- source_word: πνεῦμα ζωτικόν
  choice: un esprit qui donne la vie
  rationale: Cette expression rend distinctement πνεῦμα et la force vivifiante de ζωτικόν, sans assimiler entièrement la formule au « souffle de vie » de la Genèse.
theological_decisions:
- issue: Distinction anthropologique entre ψυχή et πνεῦμα
  choice: 'Conserver deux termes distincts : « âme » et « esprit »'
  alternative: Rendre les deux de façon plus générale par « vie » ou « souffle »
  rationale: Le grec emploie deux noms différents dans une construction parallèle. Les conserver évite d’effacer la distinction rhétorique tout en s’abstenant de lui imposer une anthropologie systématique ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de l’image du souffle et la distinction entre « âme » et « esprit » sont maintenues. Les marqueurs suivent immédiatement les expressions qu’ils éclairent.
