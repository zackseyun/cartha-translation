base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/002.yaml
  text: For even if we sin[a], we are yours, knowing your power; but we will not sin[c][b], knowing that we have been counted as yours.
translation:
  language: fr
  text: Car même si nous péchons, nous sommes à toi, car nous connaissons ta puissance ; mais nous ne pécherons pas, sachant que nous avons été comptés comme t’appartenant[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nous sommes considérés comme t’appartenant ». Le verbe grec appartient au vocabulaire du calcul et peut signifier « compter », « tenir pour » ou « considérer comme ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Car même
  rationale: « Car » garde la valeur explicative de γάρ, tandis que « même » porte la nuance concessive liée à la condition qui suit.
- source_word: ἐὰν ἁμάρτωμεν
  choice: si nous péchons
  rationale: ἐάν avec le subjonctif aoriste exprime ici une éventualité conditionnelle ; la tournure française reste directe et naturelle.
- source_word: σοὶ ἐσμεν
  choice: nous sommes à toi
  rationale: Le datif avec le verbe être exprime l’appartenance. « Nous sommes à toi » est concis, personnel et proche de la forme grecque.
- source_word: εἰδότες
  choice: car nous connaissons / sachant
  rationale: Le participe parfait peut être circonstanciel ou causal. La première occurrence est explicitée par « car » pour une lecture naturelle ; la seconde garde la forme participiale.
- source_word: σου τὸ κράτος
  choice: ta puissance
  rationale: κράτος désigne la force ou la puissance effective. « Puissance » convient au registre et n’impose pas le sens plus précis de domination.
- source_word: οὐχ ἁμαρτησόμεθα
  choice: nous ne pécherons pas
  rationale: Le futur grec est rendu comme une affirmation au futur, sans l’atténuer en exhortation ni résoudre la tension avec la première proposition.
- source_word: ὅτι σοὶ λελογίσμεθα
  choice: que nous avons été comptés comme tiens
  rationale: Le parfait passif de λογίζομαι conserve l’idée de compter ou considérer, tandis que « comme tiens » exprime le rapport d’appartenance marqué par σοὶ.
theological_decisions:
- issue: Tension entre « même si nous péchons » et « nous ne pécherons pas »
  choice: Conserver les deux affirmations telles quelles.
  alternative: Transformer la seconde en exhortation (« ne péchons pas ») ou en simple résolution morale.
  rationale: Le grec juxtapose l’éventualité du péché, sans nier l’appartenance à Dieu, et l’affirmation future de ne pas pécher. La traduction préserve cette tension rhétorique et théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier correspond aux pronoms grecs adressés à Dieu. La répétition de « nous » et le contraste entre les deux propositions sont conservés.
