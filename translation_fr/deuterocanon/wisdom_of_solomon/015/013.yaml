base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/013.yaml
  text: For this man knows better than all others that he is sinning[a], making fragile vessels and carved images out of earthy material.
translation:
  language: fr
  text: Car, plus que tous les autres, cet homme sait qu’il pèche en fabriquant, avec une matière terreuse, des récipients fragiles et des images sculptées[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car cet homme sait mieux que tous les autres qu’il pèche. » La tournure comparative grecque permet une disposition légèrement différente des mots.'
    reason: Variante lexicale et syntaxique de la proposition comparative grecque.
lexical_decisions:
- source_word: οὗτος
  choice: cet homme
  rationale: Le démonstratif désigne l’artisan d’idoles évoqué dans le contexte. « Cet homme » explicite naturellement le référent personnel masculin sans perdre la valeur démonstrative.
- source_word: παρὰ πάντας
  choice: mieux que tous les autres
  rationale: 'Avec οἶδεν, la tournure exprime une comparaison de degré : cet artisan le sait mieux que quiconque. Cette formulation française est idiomatique tout en conservant la portée comparative.'
- source_word: οἶδεν
  choice: sait
  rationale: Le verbe marque une connaissance consciente, essentielle à la culpabilité morale affirmée ici.
- source_word: ὅτι ἁμαρτάνει
  choice: qu’il pèche
  rationale: Le présent grec décrit son activité coupable en cours ou habituelle. Le présent français garde cette force sans imposer une nuance progressive artificielle.
- source_word: ὕλης γεώδους
  choice: avec une matière terreuse
  rationale: ὕλη désigne la matière ou substance, et γεώδης ce qui est terreux ou semblable à la terre. Cette traduction n’identifie pas indûment la matière à la seule argile.
- source_word: εὔθραυστα σκεύη
  choice: des récipients fragiles
  rationale: εὔθραυστα souligne que ces objets se brisent facilement, tandis que σκεύη peut désigner des ustensiles ou récipients. Le contexte de façonnage à partir d’une matière terreuse favorise « récipients ».
- source_word: γλυπτὰ
  choice: des images sculptées
  rationale: Le terme désigne des œuvres taillées ou sculptées. « Images sculptées » reste lexicalement précis et laisse le contexte établir qu’il s’agit d’idoles.
- source_word: δημιουργῶν
  choice: lui qui fabrique
  rationale: Le participe décrit l’activité de l’artisan et se rattache au sujet. « Fabrique » est courant, clair et adapté aux deux types d’objets mentionnés.
theological_decisions:
- issue: Connaissance morale et culpabilité de l’artisan d’idoles
  choice: Le texte affirme que l’artisan sait qu’il pèche en exerçant cette activité.
  alternative: Comprendre plus faiblement la comparaison comme « plus que tous, il sait qu’il pèche », sans accentuer autant la lucidité morale.
  rationale: La syntaxe associe naturellement οἶδεν à ὅτι ἁμαρτάνει et présente donc une connaissance consciente de la faute. La traduction conserve cette force sans ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. « Cet homme » rend explicite le référent contextuel; « matière terreuse » préserve la généralité du grec; la note maintient l’ambiguïté légère de la tournure comparative.
