base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/008.yaml
  text: And with wicked toil he molds a futile god from the same clay—he who a little before had come from the earth[a], and after a short time goes back to the earth from which he was taken, when the debt of his soul is demanded.
translation:
  language: fr
  text: Et, dans un labeur pénible, il façonne de la même argile un dieu sans valeur, lui qui, il y a peu, est venu de la terre et qui, peu après, retourne à la terre dont il a été tiré, lorsqu’on lui réclame la dette de son âme[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la dette de sa vie ». Le grec ψυχή peut signifier « âme » ou « vie ».'
    reason: Alternative lexicale authentique pour ψυχή dans ce contexte de mortalité.
lexical_decisions:
- source_word: κακόμοχθος
  choice: peinant au mal
  rationale: L’expression conserve à la fois la peine du travail et sa qualification morale négative, sans réduire le terme à un simple effort pénible.
- source_word: θεὸν μάταιον
  choice: un dieu sans valeur
  rationale: μάταιος évoque ce qui est vain, vide et inefficace. « Sans valeur » rend naturellement en français l’ironie d’une divinité fabriquée et impuissante.
- source_word: πλάσσει
  choice: façonne
  rationale: Le verbe désigne ici le modelage de l’argile; « façonne » est naturel et garde l’image artisanale.
- source_word: ἐκ τοῦ αὐτοῦ πηλοῦ
  choice: dans la même argile
  rationale: La formulation souligne que l’idole est faite de la même matière que les autres objets du potier.
- source_word: ὃς
  choice: lui qui
  rationale: Cette reprise indique clairement que le relatif renvoie à l’artisan, et non au dieu façonné.
- source_word: πρὸ μικροῦ
  choice: peu auparavant
  rationale: Rend de près l’antériorité récente exprimée par le grec, dans un registre français digne et courant.
- source_word: ἐκ γῆς γενηθεὶς
  choice: était venu de la terre
  rationale: Cette traduction garde le sens large de γενηθεὶς et l’écho à l’origine terrestre de l’être humain, sans imposer « né » ni « créé ».
- source_word: μετʼ ὀλίγον πορεύεται
  choice: peu après, retournera
  rationale: Le contexte indique un retour à la terre. Le futur français exprime naturellement la destinée prochaine envisagée par le présent grec.
- source_word: ἐξ ἧς ἐλήμφθη
  choice: à celle dont il a été tiré
  rationale: « Celle » reprend sans ambiguïté « la terre » et conserve l’écho du récit de la création.
- source_word: τὸ τῆς ψυχῆς ἀπαιτηθεὶς χρέος
  choice: lorsque lui sera réclamée la dette de son âme
  rationale: La traduction maintient la métaphore de la dette et le sens de réclamation ou d’exigence de ἀπαιτέω, tout en conservant ψυχή comme « âme ».
theological_decisions:
- issue: Sens de ψυχή dans un contexte de mortalité
  choice: âme
  alternative: vie
  rationale: ψυχή peut désigner l’âme ou la vie. « Âme » préserve le vocabulaire anthropologique et la tension du texte; « vie » demeure une lecture lexicale possible et figure en note.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve l’ironie du contraste entre l’artisan mortel, issu de la terre, et le dieu qu’il façonne. La métaphore finale de la dette est maintenue plutôt que remplacée par une paraphrase.
