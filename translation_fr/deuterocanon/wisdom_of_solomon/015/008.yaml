    issue: « peinant au mal » pour κακόμοχθος
    rationale: Cette formulation est peu naturelle en français et transforme une qualification de labeur pénible/misérable en l'idée plus précise d'une action consistant à « peiner au mal ». Le grec permet une coloration défavorable, mais ne requiert pas ici une qualification morale aussi explicite.
