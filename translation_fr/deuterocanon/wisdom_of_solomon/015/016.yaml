  text: For a man made them[a], and one who had borrowed the spirit formed them; for no man has the strength to fashion a god like himself.
translation:
  language: fr
  text: Car un être humain les a faits, et, ayant emprunté le souffle[a], il les a façonnés ; car aucun être humain n’est capable de façonner un dieu qui lui ressemble.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’esprit ». Le grec pneuma peut désigner l’esprit ou le souffle vital ; l’image de l’emprunt souligne que la vie du fabricant est reçue et non autonome.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος
  choice: un être humain / aucun être humain
  rationale: Le singulier désigne ici un artisan humain en contraste avec le prétendu dieu qu’il fabrique. « Être humain » garde cette opposition et reste naturel en français moderne.
- source_word: ἐποίησεν
  choice: a faits
  rationale: Verbe général de fabrication, rendu simplement sans préciser outre mesure le procédé artisanal.
- source_word: τὸ πνεῦμα
  choice: son souffle
  rationale: Dans ce contexte de vie reçue et précaire, « souffle » exprime naturellement le principe vital tout en laissant entendre la portée spirituelle du grec πνεῦμα.
- source_word: δεδανεισμένος
  choice: n’est qu’emprunté
  rationale: La formulation souligne que même le souffle vital de l’artisan ne vient pas de lui et ne lui appartient pas en propre.
- source_word: ἔπλασεν
  choice: a façonnés
  rationale: Le verbe évoque la mise en forme artisanale et convient aux images fabriquées.
- source_word: ὅμοιον
  choice: qui lui ressemble
  rationale: La relative française exprime clairement que le prétendu dieu reçoit la ressemblance de son fabricant humain.
- source_word: ἰσχύει
  choice: a le pouvoir
  rationale: Rend la capacité effective exprimée par le verbe et conserve l’ironie de la polémique contre les idoles.
- source_word: πλάσαι
  choice: façonner
  rationale: Maintient l’image du travail manuel et fait écho à ἔπλασεν.
- source_word: θεόν
  choice: un dieu
  rationale: Dans cette polémique contre les idoles, il s’agit d’une prétendue divinité fabriquée, non du vrai Dieu.
theological_decisions:
- issue: Sens du « souffle emprunté » et dépendance de la vie humaine
  choice: Le fabricant possède lui-même son souffle vital comme une réalité reçue et non comme quelque chose qui lui appartiendrait en propre.
  alternative: Comprendre πνεῦμα plus largement comme « esprit », en insistant sur le principe spirituel plutôt que sur le souffle vital.
  rationale: Le contexte oppose la dépendance vitale et la mortalité de l’artisan à sa prétention de fabriquer un dieu. « Souffle » rend cette ironie concrète sans nier l’étendue sémantique de πνεῦμα.
translation_notes:
  register: Français international moderne, digne et accessible. La structure causale répétée du grec est conservée par « Car » et « en effet ». La formulation évite un masculin générique inutile tout en gardant la force singulière de ἄνθρωπος.
