  - severity: low
    issue: La note existante est ancrée à « faits » mais ne documente pas une difficulté de ce mot.
    rationale: L’ambiguïté lexicale pertinente porte sur πνεῦμα. La note est déplacée sur « souffle » et donne l’alternative « esprit ».
