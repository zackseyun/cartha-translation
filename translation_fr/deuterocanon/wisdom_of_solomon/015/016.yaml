  rationale: La révision rend directement la construction participiale grecque, maintient l’ambiguïté contrôlée de πνεῦμα par une note lexicalement motivée et replace l’ancre de note sur le terme concerné. Elle conserve l’opposition entre le fabricant humain dépendant et le dieu qu’il prétend façonner, sans ajout doctrinal.
