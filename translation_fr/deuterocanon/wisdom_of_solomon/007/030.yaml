base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/030.yaml
  text: For this is succeeded by night[b][a], but evil does not prevail against wisdom.
translation:
  language: fr
  text: Car la nuit lui succède[a], mais le mal ne l’emporte pas sur la sagesse.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car la lumière est suivie par la nuit. » Le grec dit littéralement « ceci » et renvoie à la lumière mentionnée au verset précédent.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « mais le mal ne peut résister à la sagesse. »'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο
  choice: lui
  rationale: Le pronom reprend implicitement ce qui précède, à savoir la lumière, sans remplacer le démonstratif grec par le nom explicite « lumière ».
- source_word: διαδέχεται
  choice: succède
  rationale: Le verbe exprime la succession ou le fait de venir après; la tournure française « la nuit lui succède » est naturelle et reste proche de la syntaxe grecque.
- source_word: νύξ
  choice: la nuit
  rationale: Équivalent direct, en contraste avec la lumière mentionnée au verset précédent.
- source_word: σοφίας
  choice: sur la sagesse
  rationale: Le génitif dépend de ἀντισχύει et désigne ce contre quoi le mal tente de prévaloir.
- source_word: οὐκ ἀντισχύει
  choice: ne l’emporte pas sur
  rationale: Cette expression rend l’idée d’être assez fort contre quelqu’un ou quelque chose et de prévaloir, tout en conservant l’image d’un affrontement.
- source_word: κακία
  choice: le mal
  rationale: Le terme désigne largement le mal moral; « le mal » convient au contraste général avec la sagesse sans restreindre le sens à la méchanceté ou à la malveillance.
theological_decisions:
- issue: Référent implicite de τοῦτο
  choice: Conserver un renvoi pronominal implicite par « lui » plutôt que d’insérer « la lumière » dans le texte principal.
  alternative: Car la lumière est suivie par la nuit.
  rationale: Le grec emploie un démonstratif dont l’antécédent se trouve au verset précédent. Le pronom préserve ce lien sans expliciter davantage que la source.
- issue: Force de ἀντισχύει
  choice: « le mal ne l’emporte pas sur la sagesse »
  alternative: « le mal ne peut résister à la sagesse »
  rationale: La formulation retenue exprime que le mal ne prévaut pas, tout en évitant de transformer explicitement l’énoncé factuel en affirmation modale d’impossibilité.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La phrase garde la concision et le parallélisme du grec; les notes préservent l’ambiguïté du démonstratif et la nuance possible du verbe ἀντισχύει.
