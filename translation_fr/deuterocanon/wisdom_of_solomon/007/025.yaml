base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/025.yaml
  text: For she is a breath of the power of God[a], and a pure emanation of the glory of the Almighty[b]; therefore nothing defiled enters into her.
translation:
  language: fr
  text: Car elle est un souffle de la puissance de Dieu[a], une pure émanation de la gloire du Tout-Puissant[b] ; c’est pourquoi rien de souillé ne pénètre en elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une vapeur » ou « une exhalaison ». Le grec ἀτμίς peut désigner un souffle, une vapeur ou une exhalaison émanant d’une source.
    reason: lexical_alternative
  - marker: b
    text: Ou « une émanation limpide » ou « sans mélange » de la gloire du Tout-Puissant.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτμὶς
  choice: vapeur
  rationale: Le nom grec désigne une vapeur, une exhalaison ou un souffle émanant d’une source. « Vapeur » conserve ici l’image concrète de ce qui se dégage de la puissance divine, sans confondre le terme avec πνεῦμα.
- source_word: δυνάμεως
  choice: puissance
  rationale: « Puissance » rend naturellement le génitif grec et convient au registre théologique du passage.
- source_word: ἀπόρροια
  choice: émanation
  rationale: Le terme évoque ce qui s’écoule ou procède d’une source. « Émanation » en préserve la densité métaphorique sans imposer une formulation doctrinale ultérieure.
- source_word: εἰλικρινής
  choice: pure
  rationale: Dans ce contexte, l’adjectif exprime ce qui est sans mélange ni contamination. « Pure » est idiomatique et prépare l’affirmation finale concernant toute souillure.
- source_word: παντοκράτορος
  choice: Tout-Puissant
  rationale: Ce titre français établi exprime la souveraineté universelle contenue dans le grec παντοκράτωρ.
- source_word: μεμιαμμένον
  choice: souillé
  rationale: Le participe parfait décrit ce qui se trouve dans un état de contamination. « Souillé » conserve les dimensions morale, rituelle et figurée possibles.
- source_word: παρεμπίπτει
  choice: ne s’introduit en elle
  rationale: Le verbe indique que rien de contaminé ne vient pénétrer ou faire intrusion en elle. Cette formulation française rend l’accès empêché plus naturellement qu’un calque de « tomber dans ».
theological_decisions:
- issue: Personnification féminine de la Sagesse
  choice: Maintien du pronom féminin « elle »
  alternative: Répéter « la Sagesse » ou employer une tournure impersonnelle
  rationale: Le féminin renvoie à la Sagesse dans le contexte et participe à sa personnification littéraire. Il faut le préserver sans en tirer de conclusions étrangères au verset.
- issue: Relation de la Sagesse à Dieu exprimée par des images de provenance
  choice: Conserver « vapeur issue de » et « émanation de »
  alternative: Atténuer ces images par une paraphrase telle que « manifestation de », ou les préciser par un vocabulaire métaphysique technique
  rationale: Le grec présente fortement la Sagesse comme provenant de la puissance et de la gloire divines, mais ne définit pas techniquement cette relation. La traduction maintient cette tension sans la systématiser.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe parallèle du grec est conservée. « Vapeur » est retenu dans le texte pour sa précision lexicale, tandis que « souffle » figure en note afin de préserver l’autre valeur possible de l’image.
