  naturalness: « Une vapeur issue de la puissance » est compréhensible, mais sonne plus physique et l’ajout « issue de » est moins direct que le grec. « Un souffle de la puissance de Dieu » est naturel dans un registre biblique moderne. « Rien de souillé ne pénètre en elle » est plus fluide que « ne s’introduit en elle ».
