base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/010.yaml
  text: I loved her more than health and beauty[a], and I chose to have her rather than light, because the radiance that comes from her never sleeps.
translation:
  language: fr
  text: Je l’ai aimée plus que la santé et la beauté, et j’ai choisi de l’avoir plutôt que la lumière, car l’éclat qui vient d’elle ne s’assoupit jamais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car l’éclat qui vient d’elle est sans sommeil ». Le grec qualifie littéralement cet éclat de « sans sommeil », c’est-à-dire incessant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ ὑγίειαν καὶ εὐμορφίαν
  choice: plus que la santé et la beauté
  rationale: Dans ce contexte comparatif, ὑπέρ marque une préférence. « Plus que » est naturel en français et conserve l’évaluation exprimée par le grec.
- source_word: ἠγάπησα αὐτήν
  choice: Je l’ai aimée
  rationale: L’aoriste de ἀγαπάω exprime directement l’amour porté à la Sagesse; le pronom féminin maintient sa personnification dans le contexte.
- source_word: προειλόμην αὐτὴν ἀντὶ φωτὸς ἔχειν
  choice: j’ai choisi de l’avoir plutôt que la lumière
  rationale: Le verbe moyen exprime un choix délibéré, tandis que ἀντί marque ici la préférence de la Sagesse à la lumière. La formulation reste proche de la construction grecque tout en étant idiomatique.
- source_word: τὸ ἐκ ταύτης φέγγος
  choice: l’éclat qui vient d’elle
  rationale: φέγγος désigne une lumière ou un éclat rayonnant. « Éclat » évite de répéter « lumière » et ἐκ ταύτης indique que cet éclat procède d’elle.
- source_word: ἀκοίμητον
  choice: ne s’assoupit jamais
  rationale: L’adjectif signifie littéralement « sans sommeil, qui ne dort pas ». Cette formulation française préserve la métaphore vive appliquée à l’éclat sans la réduire à la seule idée de durée.
theological_decisions:
- issue: Personnification féminine de la Sagesse
  choice: Employer le pronom féminin « l’/elle »
  alternative: Employer un pronom neutre ou répéter « la sagesse »
  rationale: Les formes grecques sont féminines et le contexte personnifie fortement la Sagesse. Le féminin français conserve cette image poétique sans ajouter d’identification théologique étrangère au verset.
- issue: Image de l’éclat sans sommeil
  choice: Conserver la métaphore « ne s’assoupit jamais »
  alternative: Rendre le sens par « ne s’éteint jamais » ou « est inépuisable »
  rationale: Le grec ἀκοίμητον évoque littéralement l’absence de sommeil. Garder cette tension poétique respecte davantage le texte que d’expliciter uniquement l’idée d’une lumière incessante.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe demeure claire pour le grand public, et les images grecques de la Sagesse personnifiée et de l’éclat sans sommeil sont conservées.
