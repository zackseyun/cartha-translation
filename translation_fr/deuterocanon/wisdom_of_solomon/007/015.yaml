base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/015.yaml
  text: But may God grant me to speak with sound judgment and to think in a manner worthy of the things given[c][b][a], because he himself is both the guide of wisdom and the one who sets the wise right.
translation:
  language: fr
  text: Mais que Dieu m’accorde de parler avec discernement[a] et de réfléchir d’une manière digne de ce qui a été donné[b], car lui-même est le guide de la sagesse et celui qui corrige les sages[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de parler selon une juste compréhension ». L’expression grecque désigne une parole conforme au discernement ou à un jugement réfléchi.
    reason: lexical_alternative
  - marker: b
    text: Ou « des choses qui ont été données » ou « des dons reçus ». Le grec laisse le référent général, sans préciser de quoi il s’agit.
    reason: lexical_alternative
  - marker: c
    text: Ou « qui redresse les sages » ou « qui dirige les sages ». Le terme grec désigne celui qui corrige, redresse ou oriente justement.
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη
  choice: que Dieu m’accorde
  rationale: L’optatif exprime ici un souhait ou une prière. Cette tournure rend naturellement cette valeur en français.
- source_word: εἰπεῖν κατὰ γνώμην
  choice: parler avec discernement
  rationale: La locution indique une parole conforme à un jugement réfléchi ou à une juste compréhension. « Avec discernement » est naturel et conserve cette nuance évaluative.
- source_word: ἐνθυμηθῆναι
  choice: réfléchir
  rationale: Le verbe désigne une pensée intérieure et réfléchie; « réfléchir » en rend mieux la portée que le simple « penser ».
- source_word: ἀξίως
  choice: d’une manière digne
  rationale: Cette formulation française explicite la valeur adverbiale de conformité et de dignité sans en préciser indûment le contenu.
- source_word: τῶν δεδομένων
  choice: de ce qui a été donné
  rationale: Le participe parfait passif substantivé reste volontairement général. La traduction n’ajoute ni bénéficiaire explicite ni objet particulier.
- source_word: ὁδηγός
  choice: qui guide
  rationale: Le mot désigne celui qui conduit ou montre le chemin. La formulation verbale est fluide en français et garde l’image directrice.
- source_word: διορθωτής
  choice: qui remet ... dans le droit chemin
  rationale: Le nom désigne celui qui redresse, corrige ou remet droit. Cette expression actuelle conserve la nuance corrective sans évoquer nécessairement une sanction.
- source_word: τῶν σοφῶν
  choice: les sages
  rationale: L’adjectif substantivé pluriel est rendu par l’expression française concise et traditionnelle « les sages ».
theological_decisions:
- issue: Référent et portée de τῶν δεδομένων
  choice: Référence ouverte à ce qui a été donné, sans en préciser l’objet ni le bénéficiaire dans la traduction
  alternative: les dons reçus; les choses qui m’ont été données; les enseignements transmis
  rationale: Le grec ne détermine pas plus précisément le référent. La traduction préserve cette amplitude et n’introduit aucune interprétation doctrinale particulière.
- issue: Portée de διορθωτής à propos de Dieu et des sages
  choice: Dieu remet les sages dans le droit chemin
  alternative: Dieu corrige les sages; Dieu dirige les sages
  rationale: 'Le terme comporte l’idée de redresser ou de corriger. La formulation retenue maintient la tension du texte: même les sages dépendent de Dieu pour être orientés avec droiture, sans donner au mot un sens nécessairement disciplinaire ou punitif.'
translation_notes:
  register: Français international moderne, naturel et digne. La structure de prière est conservée, de même que le parallélisme entre Dieu qui guide la sagesse et Dieu qui redresse les sages. Les formulations évitent de restreindre le référent de « ce qui a été donné » et préservent la nuance à la fois directrice et corrective de διορθωτής.
