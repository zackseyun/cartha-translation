  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/016.yaml
  text: For in his hand are both we and our words, and all understanding and knowledge of crafts.
translation:
  language: fr
  text: Car nous sommes dans sa main, nous et nos paroles, ainsi que toute intelligence[a] et toute connaissance des métiers[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute prudence », « tout discernement » ou « toute sagesse pratique » ; le grec peut désigner l’intelligence appliquée au jugement et à l’action.
    reason: lexical_alternative
  - marker: b
    text: Ou « des savoir-faire », « des arts » ou « des travaux spécialisés » ; le grec évoque la connaissance liée aux activités pratiques et qualifiées.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ... χειρὶ αὐτοῦ
  choice: dans sa main
  rationale: Cette expression conserve l’image biblique de la main, qui évoque ici la puissance, l’autorité et la dépendance, sans la remplacer par une interprétation explicative.
- source_word: ἡμεῖς
  choice: nous
  rationale: Le pronom grec est explicite. La reprise « nous et nos paroles » maintient le parallélisme entre les personnes et ce qu’elles disent.
- source_word: οἱ λόγοι ἡμῶν
  choice: nos paroles
  rationale: « Paroles » rend directement λόγοι et peut désigner largement l’expression verbale ou le discours.
- source_word: πᾶσά τε φρόνησις
  choice: toute intelligence
  rationale: Dans ce contexte, φρόνησις désigne une faculté de compréhension et de jugement pratique. « Intelligence » reste clair et suffisamment large en français moderne, tandis que la note signale les nuances possibles.
- source_word: ἐργατειῶν
  choice: des métiers
  rationale: Le terme renvoie à des activités pratiques ou à des travaux spécialisés. « Métiers » exprime de façon naturelle leur dimension concrète et qualifiée.
- source_word: ἐπιστήμη
  choice: connaissance
  rationale: ἐπιστήμη désigne un savoir assuré ou organisé, ici relatif aux activités spécialisées. « Connaissance » préserve ce sens sans imposer la notion moderne de science.
theological_decisions:
- issue: Référent de αὐτοῦ
  choice: « sa » renvoie à Dieu, sans remplacer le pronom par le nom « Dieu »
  alternative: expliciter « dans la main de Dieu »
  rationale: Le contexte identifie le référent, mais le texte grec emploie un pronom. Le conserver évite d’ajouter une explicitation absente de la formulation source.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « nous sommes dans sa main » maintient l’image du grec, et « nous et nos paroles » en conserve le parallélisme. Les notes préservent l’étendue sémantique de φρόνησις et d’ἐργατειῶν sans alourdir le texte principal.
