    issue: Rendu de γνῶσιν ἀψευδῆ
    rationale: « Une connaissance sans erreur » est compréhensible, mais « véridique » correspond plus directement à ἀψευδής (« non faux, vrai ») et évite de faire porter l’accent sur l’inerrance au sens technique.
  - severity: low
    issue: Valeur de l’infinitif εἰδέναι
    rationale: « Pour connaître » est possible, mais peut sonner final (« dans le but de connaître »). « Afin de connaître » relie plus clairement l’infinitif à la connaissance accordée, tout en restant naturel.
