base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/017.yaml
  text: For he himself gave me unerring knowledge of the things that exist[a], to know the structure of the world and the activity of the elements[c][b],
translation:
  language: fr
  text: Car c’est lui-même qui m’a donné une connaissance véridique[a] de ce qui existe, afin de connaître la structure du monde[b] et l’activité des éléments[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une connaissance sans erreur » ou « une connaissance exempte de fausseté ».
    reason: lexical_alternative
  - marker: b
    text: Ou « la constitution du monde » ou « l’agencement de l’univers ».
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire les constituants fondamentaux du monde physique.
    reason: cultural_note
lexical_decisions:
- source_word: αὐτὸς
  choice: c’est lui-même qui
  rationale: La tournure emphatique française préserve l’insistance portée par le pronom grec, sans remplacer le pronom par son référent implicite, Dieu.
- source_word: ἔδωκεν
  choice: m’a donné
  rationale: Rend simplement l’aoriste grec et conserve le bénéficiaire exprimé par μοι.
- source_word: τῶν ὄντων
  choice: de ce qui existe
  rationale: Formulation naturelle qui garde la portée générale et ontologique de l’expression sans introduire le terme plus technique « êtres ».
- source_word: γνῶσιν ἀψευδῆ
  choice: une connaissance sans erreur
  rationale: ἀψευδής qualifie une connaissance qui n’est pas fausse. « Sans erreur » exprime sa véracité et sa fiabilité sans la charge doctrinale possible d’« infaillible ».
- source_word: εἰδέναι
  choice: pour connaître
  rationale: L’infinitif précise la portée ou le contenu de la connaissance donnée. La formulation française conserve cette relation sans la réduire à une simple liste explicative.
- source_word: σύστασιν κόσμου
  choice: la structure du monde
  rationale: σύστασις peut désigner la constitution, la composition ou l’agencement; « structure » est actuel, clair et adapté au contexte cosmologique.
- source_word: ἐνέργειαν στοιχείων
  choice: l’activité des éléments
  rationale: ἐνέργεια désigne l’activité, l’opération ou le fonctionnement effectif. « Activité » reste assez large pour ne pas imposer l’interprétation plus précise de « forces ».
- source_word: στοιχείων
  choice: les éléments
  rationale: Dans ce contexte cosmologique, le mot désigne les constituants fondamentaux du monde physique; « éléments » est la traduction française usuelle et concise.
theological_decisions:
- issue: Référent du sujet emphatique αὐτός
  choice: Conserver le pronom emphatique « lui-même », dont le référent contextuel est Dieu
  alternative: Nommer explicitement Dieu dans le verset
  rationale: Le contexte immédiat identifie Dieu comme celui qui donne la connaissance, mais le grec emploie ici un pronom. La traduction maintient donc à la fois le référent contextuel et la forme pronominale du texte.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase suit de près le mouvement du grec tout en employant une emphase idiomatique (« c’est lui-même qui »). Les termes cosmologiques restent généraux afin de ne pas leur imposer des catégories scientifiques modernes.
