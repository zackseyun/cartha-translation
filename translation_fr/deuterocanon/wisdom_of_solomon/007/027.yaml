revisions:
- from: Bien qu’elle soit une, elle peut tout accomplir. Tout en demeurant en elle-même, elle renouvelle toutes choses[a]. Passant dans des âmes saintes[b] de génération en génération, elle forme des amis de Dieu et des prophètes.
  to: Bien qu’elle soit une, elle peut tout faire ; tout en demeurant en elle-même, elle renouvelle toutes choses[a] ; de génération en génération, passant dans des âmes saintes[b], elle en fait des amis de Dieu et des prophètes.
  rationale: La révision remplace « accomplir » par « faire » pour rendre plus directement la capacité universelle exprimée par πάντα δύναται, et remplace « elle forme » par « elle en fait » afin que le français indique sans ambiguïté que les âmes saintes deviennent amis de Dieu et prophètes. Les alternatives lexicales et leurs ancres demeurent exactes.
