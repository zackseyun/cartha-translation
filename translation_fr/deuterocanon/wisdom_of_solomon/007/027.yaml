base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/027.yaml
  text: Though she is one[a], she can do all things, and while remaining in herself she renews all things; and passing into holy souls from generation to generation, she makes them friends of God and prophets[b];
translation:
  language: fr
  text: Bien qu’elle soit une, elle peut tout faire ; tout en demeurant en elle-même, elle renouvelle toutes choses[a] ; de génération en génération, passant dans des âmes saintes[b], elle en fait des amis de Dieu et des prophètes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « elle rend toutes choses nouvelles ». Le verbe grec peut exprimer le renouvellement ou le fait de rendre nouveau.
    reason: lexical_alternative
  - marker: b
    text: Ou « entrant dans des âmes saintes ». Le participe grec décrit le mouvement de la Sagesse dans des âmes saintes successives au fil des générations.
    reason: lexical_alternative
lexical_decisions:
- source_word: μία δὲ οὖσα
  choice: Bien qu’elle soit une
  rationale: Cette formulation conserve l’unité ou la singularité de la Sagesse ainsi que la valeur concessive du contexte, sans ajouter l’idée d’exclusivité que pourrait suggérer « seule ».
- source_word: πάντα δύναται
  choice: elle peut tout accomplir
  rationale: Rend directement sa capacité universelle. « Accomplir » explicite sobrement la valeur active de δύναται sans introduire l’idée différente de domination sur toutes choses.
- source_word: μένουσα ἐν αὐτῇ
  choice: Tout en demeurant en elle-même
  rationale: Le réfléchi convient à la Sagesse personnifiée et maintient la tension entre son action en toutes choses et sa permanence en elle-même.
- source_word: τὰ πάντα καινίζει
  choice: elle renouvelle toutes choses
  rationale: καινίζει peut signifier renouveler ou rendre nouveau. « Renouvelle toutes choses » est naturel, précis et évite de privilégier indûment une résonance théologique ultérieure.
- source_word: κατὰ γενεὰς
  choice: de génération en génération
  rationale: Expression française idiomatique pour une action répétée au fil des générations successives.
- source_word: εἰς ψυχὰς ὁσίας μεταβαίνουσα
  choice: Passant dans des âmes saintes
  rationale: « Passant dans » préserve le mouvement exprimé par μεταβαίνουσα, tandis que « âmes saintes » maintient le vocabulaire anthropologique explicite du grec.
- source_word: φίλους θεοῦ καὶ προφήτας κατασκευάζει
  choice: elle forme des amis de Dieu et des prophètes
  rationale: Dans ce contexte, κατασκευάζει décrit l’action par laquelle la Sagesse façonne ces personnes en amis de Dieu et en prophètes. « Forme » exprime ce résultat sans tonalité mécanique.
theological_decisions:
- issue: Personnification féminine de la Sagesse
  choice: Employer les pronoms féminins « elle » et « elle-même »
  alternative: Répéter « la Sagesse » ou employer une tournure impersonnelle
  rationale: La grammaire grecque présente clairement la Sagesse comme un sujet féminin singulier. Le féminin conserve cette personnification littéraire et théologique sans préciser davantage son statut.
- issue: Sens de « âmes saintes »
  choice: Conserver « âmes saintes »
  alternative: « personnes saintes » ou « saints »
  rationale: Le grec emploie explicitement ψυχάς. La traduction littérale préserve le registre anthropologique du passage et son éventuelle tension, plutôt que de l’aplanir en « personnes ».
- issue: Effet de la Sagesse sur les âmes
  choice: « elle forme des amis de Dieu et des prophètes »
  alternative: « elle prépare des amis de Dieu et des prophètes » ou « elle fait d’elles des amies de Dieu et des prophètes »
  rationale: '« Forme » rend la valeur effective de κατασκευάζει : les âmes où passe la Sagesse deviennent amis de Dieu et prophètes. La formulation évite aussi qu’un accord purement grammatical avec « âmes » masque le fait qu’il s’agit de personnes.'
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation en trois phrases allège la longue période grecque sans modifier ses rapports logiques. « Demeurer en elle-même », « âmes saintes » et le féminin personnel conservent le relief sapientiel du texte.
