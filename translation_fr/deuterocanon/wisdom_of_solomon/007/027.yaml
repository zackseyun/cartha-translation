  source_fidelity: 'Le texte rend fidèlement les principaux éléments grecs : l’unité de la Sagesse, sa puissance universelle, sa permanence en elle-même, son œuvre de renouvellement, son passage dans des âmes saintes au fil des générations et la constitution de celles-ci comme amis de Dieu et prophètes. « Elle peut tout faire » est plus direct pour πάντα δύναται que « elle peut tout accomplir ». Surtout, « elle en fait des amis de Dieu et des prophètes » explicite correctement que les âmes saintes sont les personnes ainsi constituées, conformément à κατασκευάζει.'
