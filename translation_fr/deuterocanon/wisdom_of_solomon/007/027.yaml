  terminology: « Une », « demeurant en elle-même », « toutes choses », « âmes saintes », « amis de Dieu » et « prophètes » sont appropriés. Le féminin pour la Sagesse respecte la personnification grammaticale sans interprétation doctrinale supplémentaire.
