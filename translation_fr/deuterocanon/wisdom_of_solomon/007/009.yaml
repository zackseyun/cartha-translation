  text: Nor did I compare to her any precious stone[a], because all gold in her sight is a little sand[b], and silver will be regarded as clay before her.
translation:
  language: fr
  text: Je n’ai comparé à elle aucune pierre inestimable[a], car tout l’or, à ses yeux, n’est qu’un peu de sable[b], et l’argent sera considéré comme de l’argile devant elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pierre sans prix ». Le grec désigne une pierre d’une valeur impossible à estimer.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « un peu de sable » : comparé à la sagesse, l’or est présenté comme ayant une valeur négligeable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ ὡμοίωσα αὐτῇ
  choice: Je ne lui ai comparé aucune
  rationale: « Comparer à » rend naturellement ὁμοιόω avec le datif et conserve la personnification féminine de la sagesse.
- source_word: λίθον ἀτίμητον
  choice: pierre inestimable
  rationale: Dans ce contexte, ἀτίμητος désigne ce qui est sans prix, d’une valeur impossible à estimer, plutôt que ce qui est sans valeur.
- source_word: ὁ πᾶς χρυσός
  choice: tout l’or
  rationale: Rend la portée collective et totalisante de l’expression grecque.
- source_word: ἐν ὄψει αὐτῆς
  choice: auprès d’elle
  rationale: Exprime la présence et la comparaison implicite sans effacer la personnification.
- source_word: ψάμμος ὀλίγη
  choice: un peu de sable
  rationale: Préserve l’image littérale grecque et son idée de quantité négligeable.
- source_word: λογισθήσεται
  choice: sera considéré comme
  rationale: Rend le futur passif et la nuance d’évaluation de λογίζομαι dans un français actuel.
- source_word: πηλός
  choice: argile
  rationale: Équivalent précis et digne dans cette comparaison de valeur avec l’argent.
- source_word: ἐναντίον αὐτῆς
  choice: devant elle
  rationale: Conserve le cadrage spatial du grec et la personnification de la sagesse.
theological_decisions:
- issue: Personnification féminine de la sagesse
  choice: Conserver les pronoms féminins « lui » et « elle »
  alternative: Répéter « la sagesse » ou employer une formulation impersonnelle
  rationale: Les formes féminines grecques entretiennent la personnification littéraire de la sagesse; la traduction la préserve sans lui imposer une identification doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La structure comparative et la personnification féminine sont maintenues; le parallélisme entre l’or, le sable, l’argent et l’argile reste perceptible.
