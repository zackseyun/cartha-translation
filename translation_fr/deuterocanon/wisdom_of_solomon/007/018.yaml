lexical_decisions:
- source_word: ἀρχὴν
  choice: le commencement
  rationale: Dans la série temporelle formée avec « fin » et « milieu », le mot désigne naturellement le point initial.
- source_word: τέλος
  choice: la fin
  rationale: Le parallélisme temporel avec ἀρχή et μεσότης favorise « fin » plutôt que « but » ou « accomplissement ».
- source_word: μεσότητα
  choice: le milieu
  rationale: Cette traduction directe conserve la série « commencement, fin et milieu » sans imposer l’idée plus précise d’un point médian.
- source_word: χρόνων
  choice: des temps
  rationale: Le pluriel grec reste général et peut désigner des périodes ou divisions du temps.
- source_word: τροπῶν
  choice: des révolutions célestes
  rationale: Le terme désigne des mouvements cycliques ou des « retours » et, dans ce contexte cosmologique, peut viser plus précisément les solstices. « Révolutions célestes » garde l’image astronomique sans réduire le mot aux seuls solstices.
- source_word: ἀλλαγὰς
  choice: les changements
  rationale: Rendu direct et naturel du sens de changement ou d’alternance.
- source_word: μεταβολὰς
  choice: les variations
  rationale: Ce choix distingue en français les deux noms grecs proches ἀλλαγαί et μεταβολαί, tout en conservant leur parallélisme.
- source_word: καιρῶν
  choice: des saisons
  rationale: Dans cette énumération cosmologique et calendaire, καιροί désigne naturellement les saisons ou périodes déterminées.
