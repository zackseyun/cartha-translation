base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/003.yaml
  text: And I too, when I was born, drew in the common air, and fell upon the earth that suffers alike with all; and my first voice was the same as everyone's, as I cried.
translation:
  language: fr
  text: Moi aussi, à ma naissance, j’ai respiré l’air commun[a], je suis tombé sur la terre de condition semblable[b], et mon premier son, comme celui de tous, fut un cri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’air commun ». Le grec souligne que le locuteur entre dans la même existence humaine que tous les autres.'
    reason: lexical_alternative
  - marker: b
    text: Le terme grec peut aussi signifier « soumise aux mêmes expériences », « de même condition » ou, selon le contexte, « exposée aux mêmes souffrances ».
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος
  choice: dès ma naissance
  rationale: Dans ce contexte de venue au monde, le participe désigne la naissance; cette formulation française rend naturellement sa valeur temporelle.
- source_word: ἔσπασα
  choice: j’ai aspiré
  rationale: Avec « l’air » comme complément, le verbe exprime l’action concrète de prendre sa première inspiration.
- source_word: τὸν κοινὸν ἀέρα
  choice: l’air que tous partagent
  rationale: κοινός signifie « commun, partagé »; la formulation souligne l’entrée du locuteur dans la condition humaine commune.
- source_word: ἐπὶ τὴν ὁμοιοπαθῆ ... γῆν
  choice: sur la terre soumise aux mêmes souffrances
  rationale: ὁμοιοπαθής évoque une condition ou des expériences semblables, notamment la vulnérabilité à la souffrance; la traduction conserve cette expression inhabituelle sans la réduire à « la même terre ».
- source_word: κατέπεσον
  choice: je suis tombé sur
  rationale: Le verbe signifie littéralement tomber sur ou vers le bas et maintient l’image physique de la naissance.
- source_word: πρώτην φωνήν
  choice: ma première voix
  rationale: φωνή désigne la voix ou le son; « voix » préserve le vocabulaire grec, tandis que la fin de la phrase précise qu’il s’agit d’un cri.
- source_word: τὴν ὁμοίαν πᾶσιν
  choice: comme pour tous
  rationale: La formule exprime que la première manifestation vocale du locuteur ne différait de celle d’aucun autre être humain.
- source_word: ἶσα κλαίων
  choice: fut un cri
  rationale: κλαίων exprime le fait de pleurer ou de crier; l’idée d’égalité portée par ἶσα est déjà rendue par « comme pour tous ».
theological_decisions:
- issue: Insistance anthropologique du verset
  choice: Mettre en relief la pleine solidarité du locuteur avec la naissance, la vulnérabilité et l’expression premières communes à tous les humains.
  alternative: Employer une formulation plus élevée ou royale qui atténuerait cette humanité commune.
  rationale: Le grec accumule les termes de communauté et de similitude — κοινόν, ὁμοιοπαθῆ, ὁμοίαν πᾶσιν, ἶσα — sans inviter à ajouter une affirmation doctrinale ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure proche du mouvement grec tout en évitant des expressions peu naturelles comme « la terre qui souffre pareillement avec tous ».
