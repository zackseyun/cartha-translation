revisions:
- from: Moi aussi, dès ma naissance, j’ai aspiré l’air que tous partagent[a] et je suis tombé sur la terre soumise aux mêmes souffrances[b] ; comme pour tous, ma première voix fut un cri.
  to: Moi aussi, à ma naissance, j’ai respiré l’air commun[a], je suis tombé sur la terre de condition semblable[b], et mon premier son, comme celui de tous, fut un cri.
  rationale: La révision remplace « aspiré » par « respiré », plus naturel, et évite de réduire ὁμοιοπαθής au seul domaine de la souffrance. « Mon premier son, comme celui de tous, fut un cri » rend à la fois φωνή, l’universalité de τὴν ὁμοίαν πᾶσιν et la valeur de κλαίων, sans ajouter d’interprétation doctrinale.
