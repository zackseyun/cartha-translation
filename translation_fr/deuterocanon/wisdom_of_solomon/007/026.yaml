base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/026.yaml
  text: For she is a radiance of eternal light[a], and a spotless mirror of the working of God, and an image of his goodness.
translation:
  language: fr
  text: Car elle est le rayonnement de la lumière éternelle[a], le miroir sans tache de l’action de Dieu et l’image de sa bonté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le reflet de la lumière éternelle ». Le terme grec peut désigner soit un rayonnement qui émane d’une source, soit une clarté réfléchie.
    reason: alternative lexicale
lexical_decisions:
- source_word: ἀπαύγασμα
  choice: rayonnement
  rationale: Le terme peut évoquer une lumière qui émane d’une source ou un éclat réfléchi. « Rayonnement » est naturel en français et préserve cette image lumineuse sans la réduire à une seule interprétation.
- source_word: φωτὸς ἀϊδίου
  choice: de la lumière éternelle
  rationale: Cette formulation rend directement le génitif grec et traduit ἀΐδιος par « éternelle », terme clair et digne.
- source_word: ἔσοπτρον
  choice: miroir
  rationale: « Miroir » est l’équivalent moderne direct et conserve l’image concrète du grec.
- source_word: ἀκηλίδωτον
  choice: sans tache
  rationale: L’expression signifie « non souillé, sans défaut » et convient naturellement à l’image du miroir.
- source_word: τῆς τοῦ θεοῦ ἐνεργείας
  choice: de l’activité de Dieu
  rationale: ἐνέργεια désigne ici l’action à l’œuvre ou l’activité effective. « Activité » reste proche du grec sans importer un sens théologique technique ultérieur.
- source_word: εἰκών
  choice: image
  rationale: « Image » est l’équivalent le plus direct et conserve toute la portée littéraire et théologique du terme.
- source_word: ἀγαθότητος
  choice: bonté
  rationale: « Bonté » rend largement la qualité morale et bienfaisante exprimée par le grec.
theological_decisions:
- issue: Personnification féminine de la Sagesse
  choice: Maintien du pronom « elle »
  alternative: Répéter « la Sagesse » ou employer une tournure impersonnelle
  rationale: Le contexte personnifie la Sagesse au féminin. « Elle » respecte cette présentation littéraire et théologique sans préciser davantage son statut.
- issue: Rapport entre la Sagesse et la lumière éternelle
  choice: « le rayonnement de la lumière éternelle »
  alternative: « le reflet de la lumière éternelle »
  rationale: Le grec permet d’entendre soit une lumière qui rayonne depuis sa source, soit une clarté réfléchie. Le texte principal retient « rayonnement », tandis que la note préserve l’autre possibilité sans trancher la tension.
translation_notes:
  register: Français international moderne, clair et soutenu. La structure ternaire du grec est conservée, avec des images concrètes et un vocabulaire théologique non technique.
