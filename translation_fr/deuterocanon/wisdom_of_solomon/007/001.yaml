base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/001.yaml
  text: For I also am a mortal man[a], equal to all, and a descendant of the earth-born first-formed man[b]; and in my mother’s womb I was molded into flesh.
translation:
  language: fr
  text: Moi aussi, je suis mortel, égal à tous, et descendant du premier homme façonné, né de la terre[a] ; dans le sein de ma mère, j’ai été façonné comme chair[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « premier homme façonné, né de la terre » est une allusion à Adam.
    reason: cross_reference
  - marker: b
    text: 'Ou : « j’ai été formé comme un être de chair ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: θνητός
  choice: mortel
  rationale: L’adjectif exprime la condition de tout être humain soumis à la mort. « Mortel » est direct, naturel et conserve l’accent sur la fragilité humaine commune.
- source_word: ἴσος ἅπασιν
  choice: égal à tous
  rationale: Cette formulation conserve la notion d’égalité de condition présente dans ἴσος, plutôt que de la réduire à une simple ressemblance.
- source_word: γηγενοῦς
  choice: né de la terre
  rationale: Le composé grec signifie littéralement « né de la terre ». La formulation garde l’image de l’origine terrestre sans la remplacer par une interprétation abstraite.
- source_word: ἀπόγονος
  choice: descendant
  rationale: Le terme désigne celui qui descend d’un ancêtre. « Descendant » convient naturellement au rapport généalogique évoqué ici.
- source_word: πρωτοπλάστου
  choice: du premier homme façonné
  rationale: Le mot désigne celui qui a été façonné le premier. L’ajout de « homme », implicite dans le masculin substantivé et confirmé par le contexte, rend l’expression claire en français tout en maintenant l’allusion descriptive plutôt que d’introduire le nom d’Adam.
- source_word: ἐγλύφην
  choice: j’ai été façonné
  rationale: Le verbe peut évoquer l’action de tailler ou de sculpter. Dans le contexte prénatal, « façonné » préserve cette image de formation tout en restant naturel.
- source_word: σάρξ
  choice: en chair
  rationale: Le nom est employé ici au sens concret. « En chair » conserve le vocabulaire corporel du grec et sa construction prédicative, sans le remplacer par « corps ».
theological_decisions:
- issue: Référence de πρωτοπλάστου
  choice: Allusion à Adam rendue descriptivement par « le premier homme façonné »
  alternative: Nommer directement « Adam »
  rationale: Le grec emploie un titre descriptif et non le nom propre. Le conserver respecte la forme du texte tout en laissant l’allusion reconnaissable.
- issue: Rapport entre γηγενοῦς et πρωτοπλάστου
  choice: « le premier homme façonné, né de la terre »
  alternative: « le premier homme façonné à partir de la terre »
  rationale: Le grec qualifie le premier être façonné de « né de la terre ». La traduction retenue préserve cette image sans préciser davantage le procédé de sa formation.
translation_notes:
  register: Français moderne, international et digne. La phrase garde le parallélisme du grec et ses images concrètes, avec une ponctuation française fluide. Les deux marqueurs [a] et [b] figurent dans le texte principal.
