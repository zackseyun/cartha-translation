base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/024.yaml
  text: For wisdom is more mobile than any movement[b][a], and because of her purity she passes through and penetrates all things.
translation:
  language: fr
  text: Car la sagesse est plus mobile que tout mouvement[a] ; en raison de sa pureté, elle traverse et pénètre toutes choses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « plus active que tout mouvement ». Le comparatif grec souligne la capacité de la sagesse à se mouvoir plus que tout ce qui est en mouvement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσης ... κινήσεως
  choice: tout mouvement
  rationale: Cette tournure rend la totalité exprimée par πάσης dans une comparaison naturelle en français.
- source_word: κινητικώτερον
  choice: plus mobile
  rationale: Le comparatif souligne la capacité de la sagesse à se mouvoir, sans réduire le terme à la simple activité.
- source_word: σοφία
  choice: la sagesse
  rationale: Équivalent français usuel ; le féminin grammatical permet aussi de conserver naturellement la personnification du passage.
- source_word: διήκει
  choice: traverse
  rationale: Le verbe exprime l’idée de passer d’un bout à l’autre ou à travers, tout en restant distinct du verbe suivant.
- source_word: χωρεῖ
  choice: pénètre
  rationale: Ce choix préserve la succession de deux verbes grecs et exprime le fait de se frayer un passage à travers toutes choses.
- source_word: διὰ πάντων
  choice: toutes choses
  rationale: La formule conserve la portée universelle et le registre élevé du grec.
- source_word: διὰ τὴν καθαρότητα
  choice: grâce à sa pureté
  rationale: διά avec l’accusatif indique ici la cause ; « grâce à » rend cette causalité de façon fluide, avec une nuance favorable adaptée au contexte.
theological_decisions:
- issue: Personnification de la sagesse
  choice: Conserver le féminin naturel de « la sagesse » sans majuscule.
  alternative: Employer « Sagesse » avec une majuscule pour accentuer la personnification.
  rationale: Le grec personnifie la sagesse, mais ce verset n’impose pas d’en faire explicitement une hypostase divine distincte. Le français conserve la personnification par le genre féminin sans trancher davantage.
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme des deux verbes grecs est conservé par « traverse et pénètre », et le point-virgule met en valeur le lien explicatif entre la mobilité de la sagesse et l’effet de sa pureté.
