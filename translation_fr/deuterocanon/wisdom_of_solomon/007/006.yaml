  text: Mais il y a pour tous une seule entrée dans la vie, et une sortie égale.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μία
  choice: de la même manière
  rationale: Avec ἴση dans le membre parallèle, μία exprime ici l’unicité commune de la condition humaine. Cette formulation française rend naturellement l’idée sans suggérer une entrée numériquement unique.
- source_word: πάντων
  choice: tous
  rationale: Le génitif indique que cette condition est partagée par tous; « tous » exprime directement cette universalité.
- source_word: εἴσοδος
  choice: entrent
  rationale: La tournure verbale est plus naturelle en français moderne tout en conservant la métaphore de l’entrée, équilibrée par « sortent ».
- source_word: εἰς τὸν βίον
  choice: dans la vie
  rationale: Cette traduction reste proche du grec et évite l’interprétation plus explicite « dans le monde ».
- source_word: ἔξοδος
  choice: en sortent
  rationale: « Sortir » conserve le pendant métaphorique d’« entrer » et laisse implicite la référence à la mort.
- source_word: ἴση
  choice: de la même manière
  rationale: Dans ce contexte, ἴση qualifie la sortie comme égale ou semblable pour tous. La formulation choisie restitue clairement le parallélisme en français.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque un léger contraste avec le contexte précédent, où le locuteur évoque son rang royal.
theological_decisions:
- issue: Faut-il expliciter la naissance et la mort ?
  choice: Conserver les images d’entrer dans la vie et d’en sortir.
  alternative: « Tous connaissent la même naissance et la même mort. »
  rationale: Le grec emploie les métaphores équilibrées εἴσοδος et ἔξοδος plutôt que des termes explicites pour la naissance et la mort. Les conserver respecte le style et maintient l’implicite du texte.
- issue: μία et ἴση désignent-elles une identité stricte ou une condition humaine commune ?
  choice: Rendre les deux termes par le parallélisme « de la même manière ».
  alternative: « Il n’y a pour tous qu’une seule entrée dans la vie, et une sortie égale. »
  rationale: Le contexte affirme l’égalité fondamentale du roi avec tous les humains. La traduction retenue communique cette condition commune sans résoudre excessivement la nuance entre unité, similitude et égalité.
translation_notes:
  register: Français international moderne, simple et digne. La structure verbale parallèle « entrent… en sortent » privilégie la clarté naturelle tout en maintenant l’image grecque et sa tension entre unicité, similitude et égalité.
