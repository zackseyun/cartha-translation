  naturalness: La phrase révisée demeure naturelle dans un français moderne soutenu. « Les natures des animaux » convient au registre philosophique et descriptif du passage; « les variétés de plantes » est plus idiomatique et moins taxonomiquement chargé que « les différentes espèces de plantes ».
