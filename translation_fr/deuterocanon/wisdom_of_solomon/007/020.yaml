  text: the natures of animals and the tempers of wild beasts[a], the violence of winds and the reasonings of men, the varieties of plants and the powers of roots.
translation:
  language: fr
  text: les natures des animaux et les tempéraments des bêtes sauvages, la violence des vents[a] et les raisonnements des êtres humains, les variétés de plantes et les pouvoirs des racines.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la violence des esprits » ; le mot grec traduit par « vents » peut aussi signifier « esprits » ou « souffles ».
    reason: lexical_alternative
lexical_decisions:
- source_word: φύσεις ζῴων
  choice: la nature des animaux
  rationale: Le pluriel grec désigne ici la constitution et les propriétés naturelles des animaux pris dans leur diversité. Le singulier collectif est plus idiomatique en français tout en gardant le sens scientifique et philosophique.
- source_word: θυμοὺς θηρίων
  choice: le tempérament des bêtes sauvages
  rationale: θυμός évoque ici la disposition, l’ardeur ou le caractère propre aux animaux sauvages. « Tempérament » rend naturellement cette idée sans la réduire à la colère.
- source_word: πνευμάτων βίας
  choice: la violence des vents
  rationale: Dans cette énumération de réalités naturelles, πνεύματα désigne très probablement les vents, et βία leur force violente. L’ambiguïté lexicale de πνεῦμα, qui peut aussi signifier « esprit », est conservée en note.
- source_word: διαλογισμοὺς ἀνθρώπων
  choice: les raisonnements des êtres humains
  rationale: διαλογισμός désigne les processus de réflexion ou les raisonnements. « Êtres humains » exprime sans ambiguïté le pluriel générique ἀνθρώπων.
- source_word: διαφορὰς φυτῶν
  choice: les différentes espèces de plantes
  rationale: διαφορά désigne les différences ou distinctions entre les plantes. Cette formulation française évoque clairement leur diversité et leur classification, sans imposer le sens taxonomique moderne strict du mot « espèce ».
- source_word: δυνάμεις ῥιζῶν
  choice: les pouvoirs des racines
  rationale: δύναμις désigne la puissance, la capacité ou l’efficacité propre aux racines, probablement notamment leurs propriétés naturelles ou médicinales. « Pouvoirs » préserve la portée large du grec.
theological_decisions:
- issue: Ambiguïté de πνευμάτων βίας
  choice: la violence des vents
  alternative: la puissance des esprits / la violence des esprits
  rationale: πνεῦμα peut signifier « vent », « souffle » ou « esprit ». Le contexte, qui énumère des domaines de connaissance du monde naturel et de l’être humain, favorise « vents », mais la possibilité lexicale d’« esprits » ne doit pas être effacée et figure donc en note.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le verset étant un élément d’une longue énumération, la traduction conserve la structure nominale et commence par une minuscule. Le marqueur de note est placé immédiatement après l’expression ambiguë qu’il explique.
