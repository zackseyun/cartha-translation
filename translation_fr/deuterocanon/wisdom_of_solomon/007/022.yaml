base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/022.yaml
  text: For wisdom[a], the craftswoman of all things, taught me. For in her is an intelligent, holy, unique, manifold, subtle, agile, clear, undefiled, distinct[b], unharmed, loving-the-good, keen, unhindered, beneficent spirit,
translation:
  language: fr
  text: Car la Sagesse, l’artisane de toutes choses, m’a instruit. En elle se trouve un esprit intelligent, saint, unique[a], aux multiples aspects, subtil, agile, limpide, sans souillure, distinct, à l’abri de toute atteinte[b], ami du bien, pénétrant, sans entrave et bienfaisant,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec peut aussi être rendu par « seul engendré » ou « unique en son genre » ; dans ce contexte, « unique » ne suppose pas en lui-même une relation filiale.
    reason: lexical_alternative
  - marker: b
    text: Ou « inoffensif », « qui ne cause aucun mal ». Le grec peut désigner soit ce qui n’est atteint par aucun mal, soit ce qui ne fait aucun mal.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεχνῖτις
  choice: l’artisane
  rationale: Le nom grec féminin désigne une personne habile dans un art ou un métier. « L’artisane » conserve à la fois l’idée de savoir-faire et la personnification féminine de la Sagesse.
- source_word: ἐδίδαξέν
  choice: m’a instruit
  rationale: Rend directement l’aoriste et son complément, dans un registre naturel et digne.
- source_word: πνεῦμα
  choice: esprit
  rationale: Dans ce contexte, le terme désigne une réalité spirituelle et intelligente présente dans la Sagesse, non le vent ou le souffle au sens concret.
- source_word: νοερόν
  choice: intelligent
  rationale: Exprime la faculté de comprendre sans introduire un vocabulaire philosophique trop technique.
- source_word: μονογενές
  choice: unique
  rationale: Ici, l’adjectif qualifie l’esprit présent dans la Sagesse et signifie naturellement « unique en son genre »; le sens filial possible est signalé en note.
- source_word: πολυμερές
  choice: aux multiples aspects
  rationale: Rend l’idée de multiplicité de parties ou de facettes dans un français actuel, plus transparent que « multiforme ».
- source_word: λεπτόν
  choice: subtil
  rationale: Conserve l’idée de finesse et de pénétration plutôt que celle de fragilité.
- source_word: εὐκίνητον
  choice: agile
  rationale: Exprime l’aisance et la rapidité de mouvement indiquées par le grec.
- source_word: τρανόν
  choice: limpide
  rationale: Rend la clarté tout en distinguant ce qualificatif de σαφές dans la même série.
- source_word: ἀμόλυντον
  choice: sans souillure
  rationale: Préserve l’idée d’absence de contamination ainsi que ses résonances morales et cultuelles.
- source_word: σαφές
  choice: distinct
  rationale: Exprime ce qui est net et manifeste sans répéter le sens de τρανόν.
- source_word: ἀπήμαντον
  choice: à l’abri de toute atteinte
  rationale: Retient le sens passif, celui de ne pas être touché par le mal ou le dommage, tout en signalant en note le sens actif possible.
- source_word: φιλάγαθον
  choice: ami du bien
  rationale: Reproduit la force adjectivale de « qui aime le bien » sous une forme concise et idiomatique.
- source_word: ὀξύ
  choice: pénétrant
  rationale: Rend l’acuité ou la vivacité de l’esprit sans suggérer ici une dureté de caractère.
- source_word: ἀκώλυτον
  choice: sans entrave
  rationale: Exprime directement l’absence d’obstacle ou d’empêchement.
- source_word: εὐεργετικόν
  choice: bienfaisant
  rationale: Rend le caractère actif de ce qui fait du bien.
theological_decisions:
- issue: Sens de μονογενές dans la description de la Sagesse
  choice: unique
  alternative: seul engendré / unique en son genre
  rationale: Le mot qualifie ici un esprit et n’apparaît pas dans une relation filiale explicite. « Unique » convient donc au contexte, tandis que la possibilité lexicale traditionnellement rendue par « seul engendré » est conservée en note.
- issue: Valeur active ou passive de ἀπήμαντον
  choice: à l’abri de toute atteinte
  alternative: inoffensif, qui ne cause aucun mal
  rationale: La forme peut décrire ce qui demeure indemne ou ce qui ne nuit pas. Le texte principal retient la nuance passive sans exclure l’autre lecture, donnée en note.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue série d’adjectifs est conservée, ainsi que la virgule finale indiquant que la phrase se poursuit au verset suivant. La personnification féminine de la Sagesse est maintenue par « l’artisane ».
