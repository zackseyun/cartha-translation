  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/014.yaml
  text: For it is an unfailing treasure for men; those who have made use of it gained friendship with God, having been commended through the gifts that come from instruction.
translation:
  language: fr
  text: Car elle est pour les humains un trésor inépuisable ; ceux qui en ont fait usage se sont acquis l’amitié de Dieu, recommandés par les dons issus de l’instruction.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεκλιπὴς θησαυρός
  choice: un trésor inépuisable
  rationale: Rend directement l’idée d’un trésor qui ne vient jamais à manquer.
- source_word: ἀνθρώποις
  choice: pour les humains
  rationale: Expression inclusive et naturelle correspondant au pluriel générique grec.
- source_word: οἱ χρησάμενοι
  choice: ceux qui en ont fait usage
  rationale: Conserve la référence implicite à la sagesse et le sens du verbe « utiliser, mettre à profit ».
- source_word: πρὸς θεὸν ἐστείλαντο φιλίαν
  choice: ont acquis l’amitié de Dieu
  rationale: Formulation française naturelle pour le mouvement vers une relation d’amitié avec Dieu, sans en préciser davantage le mécanisme.
- source_word: ἐκ παιδείας
  choice: qui viennent de l’instruction
  rationale: « Instruction » garde ici la portée éducative et formatrice de παιδεία sans la réduire à une punition disciplinaire.
- source_word: συσταθέντες
  choice: recommandés auprès de lui
  rationale: Le participe peut désigner le fait d’être présentés favorablement ou recommandés ; ce choix conserve cette nuance relationnelle.
theological_decisions:
- issue: Rapport entre l’usage de la sagesse et l’amitié de Dieu
  choice: ont acquis l’amitié de Dieu
  alternative: se sont assuré l’amitié de Dieu
  rationale: « Acquis » suit le sens résultatif du grec tout en évitant la nuance potentiellement calculatrice de « se sont assuré ».
- issue: Fonction des dons issus de l’instruction
  choice: recommandés auprès de lui par les dons
  alternative: rendus recommandables par les dons
  rationale: Le grec laisse ouverte la manière exacte dont ces dons attestent ou recommandent les personnes ; la traduction maintient cette tension sans en faire explicitement le mérite causal du salut.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde les deux propositions du grec et le lien participial final, tout en explicitant « auprès de lui » pour rendre naturellement en français la valeur de συσταθέντες dans ce contexte.
