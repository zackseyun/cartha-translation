  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/008.yaml
  text: I preferred her to scepters and thrones, and I considered wealth as nothing in comparison with her;
translation:
  language: fr
  text: Je l’ai préférée aux sceptres et aux trônes, et j’ai estimé que la richesse n’était rien en comparaison avec elle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προέκρινα
  choice: Je l’ai préférée
  rationale: Le verbe exprime une préférence accordée à la sagesse par rapport aux marques du pouvoir royal; cette formulation française est naturelle et conserve la force comparative.
- source_word: αὐτὴν
  choice: l’ / elle
  rationale: Le pronom renvoie à la sagesse, nom féminin et réalité personnifiée dans le contexte; le féminin préserve cette présentation littéraire.
- source_word: σκήπτρων καὶ θρόνων
  choice: aux sceptres et aux trônes
  rationale: La traduction littérale maintient les deux images concrètes et parallèles de l’autorité souveraine.
- source_word: πλοῦτον
  choice: la richesse
  rationale: Le singulier collectif désigne les biens matériels; « la richesse » est clair et idiomatique en français moderne.
- source_word: οὐδὲν ἡγησάμην
  choice: j’ai estimé que … n’était rien
  rationale: Cette tournure rend le jugement de valeur exprimé par l’idiome grec sans suggérer que la richesse cesse littéralement d’exister.
- source_word: ἐν συγκρίσει αὐτῆς
  choice: en comparaison d’elle
  rationale: La formulation conserve explicitement le rapport de comparaison avec la sagesse.
theological_decisions:
- issue: Personnification de la sagesse
  choice: Conserver le pronom personnel féminin (« elle »).
  alternative: Employer une formulation impersonnelle ou répéter « la sagesse ».
  rationale: Le grec renvoie à la sagesse au féminin dans un contexte qui la personnifie. Le français permet de préserver cette présentation sans lui imposer une interprétation doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, naturel et digne. La structure équilibrée du grec ainsi que les images royales concrètes sont conservées; aucune note n’est nécessaire.
