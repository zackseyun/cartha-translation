base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/011.yaml
  text: But all good things came to me together with her[a], and in her hands was wealth beyond counting[b];
translation:
  language: fr
  text: Mais avec elle[a] me sont venus tous les biens à la fois, et dans ses mains se trouvait une richesse incalculable[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire avec la Sagesse, personnifiée sous les traits d’une femme dans le contexte.
    reason: cross_reference
  - marker: b
    text: Ou « d’innombrables richesses » ou « une richesse impossible à compter ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: me sont venus
  rationale: L’aoriste de ἔρχομαι exprime ici simplement le fait que les biens sont venus au locuteur; le pluriel français s’accorde naturellement avec « tous les biens ».
- source_word: τὰ ἀγαθὰ
  choice: tous les biens
  rationale: Le neutre pluriel désigne largement tout ce qui est bon ou avantageux, sans limiter le sens aux possessions matérielles.
- source_word: ὁμοῦ πάντα
  choice: tous … à la fois
  rationale: Cette formulation restitue la totalité marquée par πάντα et l’idée de simultanéité portée par ὁμοῦ dans un français naturel.
- source_word: μετ’ αὐτῆς
  choice: avec elle
  rationale: Le pronom féminin renvoie à la Sagesse personnifiée dans le contexte. « Avec elle » conserve clairement cette association.
- source_word: ἀναρίθμητος πλοῦτος
  choice: une richesse incalculable
  rationale: ἀναρίθμητος signifie ce qu’on ne peut compter, tandis que πλοῦτος désigne la richesse; le singulier collectif français reste proche de la formulation grecque.
- source_word: ἐν ταῖς χερσὶν αὐτῆς
  choice: dans ses mains se trouvait
  rationale: La traduction conserve l’image spatiale des mains tout en produisant une phrase idiomatique en français.
theological_decisions:
- issue: Référent du pronom féminin αὐτῆς
  choice: Le pronom renvoie à la Sagesse personnifiée.
  alternative: Un antécédent féminin plus générique serait grammaticalement concevable, mais il est peu probable dans ce contexte.
  rationale: Le chapitre 7 présente la Sagesse sous des traits féminins. Garder « elle » préserve cette personnification littéraire et théologique sans la développer dans le corps du verset.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure conserve la personnification féminine de la Sagesse, l’ampleur de « tous les biens » et l’image concrète de la richesse dans ses mains.
