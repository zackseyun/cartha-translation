lexical_decisions:
- source_word: ἐν σπαργάνοις
  choice: dans des langes
  rationale: Le terme désigne les bandes de tissu dans lesquelles on enveloppait un nourrisson. « Dans des langes » conserve l’image concrète et s’emploie naturellement en français.
- source_word: ἀνετράφην
  choice: J’ai été élevé
  rationale: L’aoriste passif exprime ici le fait d’avoir été nourri et élevé durant la petite enfance. Cette formulation est claire et fidèle sans préciser davantage l’agent.
- source_word: ἐν φροντίσιν
  choice: au milieu des soucis
  rationale: φροντίς peut désigner les soucis, les préoccupations, les soins attentifs ou les inquiétudes. « Au milieu des soucis » préserve la concision du grec et son possible accent sur les préoccupations qui entourent la condition humaine dès l’enfance.
theological_decisions:
- issue: Sens de φροντίσιν dans le contexte de la petite enfance
  choice: au milieu des soucis
  alternative: au milieu des soins ; au milieu des inquiétudes
  rationale: Le passage souligne l’entrée du locuteur dans une condition humaine ordinaire et dépendante. Le choix retenu conserve la tension entre les soins attentifs prodigués au nourrisson et les préoccupations ou inquiétudes liées à son état, sans imposer une interprétation unique.
translation_notes:
  register: Français moderne, sobre et digne. La structure coordonnée et l’image concrète des langes sont conservées ; la note explicite l’ambiguïté lexicale que le français ne peut rendre entièrement par un seul mot.
