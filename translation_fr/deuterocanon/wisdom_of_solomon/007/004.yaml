  text: J’ai été élevé dans des langes et au milieu des soucis[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au milieu des soins » ou « au milieu des inquiétudes ». Le mot grec peut désigner les soins attentifs, les préoccupations ou les soucis.'
