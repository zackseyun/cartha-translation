  text: Therefore I prayed[a], and understanding was given to me; I called upon God[b], and a spirit of wisdom came to me.
translation:
  language: fr
  text: C’est pourquoi j’ai prié, et l’intelligence m’a été donnée ; j’ai invoqué, et un esprit de sagesse est venu à moi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « l’esprit de sagesse ». Le grec peut se comprendre de manière plus générale ou plus déterminée, sans imposer ici un titre formel.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Exprime naturellement le lien causal ou déductif avec le contexte précédent.
- source_word: ηὐξάμην
  choice: j’ai prié
  rationale: Rend simplement et fidèlement l’acte de prier exprimé par εὔχομαι.
- source_word: φρόνησις
  choice: l’intelligence
  rationale: Préserve la distinction avec σοφία, rendu par « sagesse », tout en restant naturel en français moderne.
- source_word: ἐδόθη μοι
  choice: m’a été donnée
  rationale: Le passif souligne qu’il s’agit d’un don reçu et non d’une qualité acquise par soi-même.
- source_word: ἐπεκαλεσάμην
  choice: j’ai invoqué
  rationale: Rend la valeur d’appel ou d’invocation sans ajouter un complément d’objet absent du grec.
- source_word: πνεῦμα σοφίας
  choice: un esprit de sagesse
  rationale: Reproduit la tournure sans article et conserve sa portée spirituelle sans en faire explicitement un titre.
- source_word: ἦλθέν μοι
  choice: est venu à moi
  rationale: Traduction directe du verbe de mouvement avec le datif, sans introduire la nuance plus forte de « descendre sur ».
theological_decisions:
- issue: Nature et détermination de πνεῦμα σοφίας
  choice: un esprit de sagesse
  alternative: l’Esprit de sagesse ; une disposition de sagesse
  rationale: 'La formulation retenue conserve l’ouverture théologique du grec : elle n’aplatit pas πνεῦμα en simple disposition psychologique et ne l’identifie pas non plus explicitement comme un titre personnel déterminé.'
translation_notes:
  register: Français international moderne, digne et lisible. Le parallélisme des deux propositions est conservé, de même que la distinction entre « intelligence » et « sagesse ». « J’ai invoqué » garde volontairement implicite l’objet de l’invocation, comme en grec.
