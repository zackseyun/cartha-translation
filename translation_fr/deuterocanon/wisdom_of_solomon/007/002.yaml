base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/002.yaml
  text: for a period of ten months[c][b][a], having been formed in blood from a man's seed and the pleasure accompanying sleep.
translation:
  language: fr
  text: durant dix mois[a], formé[b] dans le sang à partir de la semence d’un homme et du plaisir associé au sommeil[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit « dix mois », selon une manière antique de compter la durée de la grossesse, probablement en mois lunaires.
    reason: cultural_note
  - marker: b
    text: Ou « coagulé ». Le participe grec peut exprimer la coagulation aussi bien que la formation.
    reason: lexical_alternative
  - marker: c
    text: 'La dernière expression évoque pudiquement l’union sexuelle ; plus littéralement : « du plaisir qui s’est uni au sommeil ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεκαμηνιαίῳ χρόνῳ
  choice: durant dix mois
  rationale: Le datif exprime ici la durée de la gestation. Cette formulation naturelle conserve le décompte antique de dix mois sans l’expliquer dans le corps du texte.
- source_word: παγεὶς
  choice: formé
  rationale: Le participe de πήγνυμι peut évoquer ce qui est fixé, coagulé ou constitué. « Formé » convient au contexte embryologique tout en évitant une expression inutilement clinique.
- source_word: ἐν αἵματι
  choice: dans le sang
  rationale: La traduction garde le sens concret et direct de ἐν ainsi que l’image corporelle du texte grec.
- source_word: ἐκ σπέρματος ἀνδρός
  choice: à partir de la semence d’un homme
  rationale: Σπέρμα désigne ici la semence procréatrice. « Semence » respecte le registre à la fois concret, digne et non technique du passage.
- source_word: ἡδονῆς
  choice: du plaisir
  rationale: Ἡδονή signifie « plaisir » et renvoie ici, de manière retenue, au plaisir sexuel.
- source_word: ὕπνῳ συνελθούσης
  choice: associé au sommeil
  rationale: Cette construction condensée lie le plaisir au sommeil dans une évocation pudique de l’union sexuelle. La formulation française reste naturelle sans rendre l’allusion plus explicite que le grec.
theological_decisions:
- issue: L’accent anthropologique sur la génération humaine commune
  choice: Décrire une gestation et une conception humaines ordinaires dans le langage retenu du texte
  alternative: Employer soit une image plus littérale de coagulation, soit une mention explicite de l’acte sexuel
  rationale: Le contexte souligne que Salomon partage la condition et la naissance communes à tous les êtres humains. La traduction préserve cette insistance sans imposer au passage une précision biologique moderne ni expliciter son euphémisme.
translation_notes:
  register: Français international actuel, digne et accessible. Le verset demeure syntaxiquement lié au précédent. L’image corporelle « dans le sang » et l’euphémisme sexuel du grec sont conservés sans archaïsme ni explicitation excessive.
