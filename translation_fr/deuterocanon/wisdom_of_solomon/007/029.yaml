base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/029.yaml
  text: For she is more beautiful than the sun, and above every arrangement of the stars. Compared with the light, she is found to be earlier.
translation:
  language: fr
  text: Car elle est plus belle que le soleil et dépasse toute disposition des astres. Comparée à la lumière, elle se révèle antérieure[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « elle se révèle première » ; dans ce contexte, le grec peut aussi suggérer qu’elle l’emporte sur la lumière.'
    reason: Signaler la portée de προτέρα, principalement temporelle mais susceptible d’une nuance de prééminence dans la comparaison.
lexical_decisions:
- source_word: εὐπρεπεστέρα
  choice: plus belle
  rationale: Le comparatif exprime ici une beauté ou une splendeur supérieure; « plus belle » est naturel et fidèle dans ce portrait de la Sagesse.
- source_word: ὑπὲρ πᾶσαν ἄστρων θέσιν
  choice: surpasse toutes les constellations
  rationale: Littéralement, l’expression évoque toute « disposition » ou « configuration » des astres. « Toutes les constellations » en restitue naturellement l’image cosmique sans réduire le sens à une seule étoile.
- source_word: προτέρα
  choice: antérieure
  rationale: Le terme indique en premier lieu l’antériorité. Cette traduction conserve la distinction avec une simple supériorité qualitative, même si le contexte comparatif permet une nuance de prééminence.
theological_decisions:
- issue: Antériorité de la Sagesse par rapport à la lumière
  choice: elle se révèle antérieure
  alternative: elle se révèle supérieure
  rationale: Le grec προτέρα signifie directement « antérieure » ou « première ». La formulation préserve l’affirmation temporelle ou ontologique du texte sans la convertir silencieusement en simple supériorité.
translation_notes:
  register: Français international moderne, fluide et digne. Le féminin « elle » reprend la Sagesse personnifiée dans le contexte. « Constellations » rend idiomatiquement la disposition des astres, tandis que la note maintient l’ambiguïté réelle de προτέρα.
