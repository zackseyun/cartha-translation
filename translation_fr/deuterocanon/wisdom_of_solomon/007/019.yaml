- source_word: ἀστέρων
  choice: des étoiles
  rationale: Le génitif pluriel de ἀστήρ désigne simplement les étoiles et conserve ici son rapport avec θέσεις.
- source_word: θέσεις
  choice: les positions
  rationale: θέσις désigne une place ou une position. « Positions » est clair en français moderne et convient au contexte astronomique.
