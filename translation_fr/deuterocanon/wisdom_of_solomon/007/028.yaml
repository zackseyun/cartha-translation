  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/028.yaml
  text: For God loves nothing except the one who dwells with wisdom[a].
translation:
  language: fr
  text: Car Dieu n’aime rien, sinon celui qui vit avec la sagesse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « celui qui vit avec la Sagesse ». Dans ce chapitre, la sagesse est fortement personnifiée.'
    reason: Préserver l’ambiguïté entre la qualité de sagesse et la figure littéraire personnifiée.
lexical_decisions:
- source_word: οὐθὲν
  choice: rien
  rationale: 'Le neutre singulier exprime ici un objet absolu : « rien ». Même si l’exception désigne une personne, traduire par « personne » réduirait la portée plus large de la formulation grecque.'
- source_word: ἀγαπᾷ
  choice: aime
  rationale: Équivalent français direct et naturel de ἀγαπάω, qui conserve pleinement la force théologique de l’amour divin.
- source_word: εἰ μὴ
  choice: sinon
  rationale: La locution introduit une exception, non une condition. « Sinon » rend naturellement cette construction après une proposition négative.
- source_word: τὸν ... συνοικοῦντα
  choice: celui qui vit avec
  rationale: Le participe substantivé désigne une personne caractérisée par une association durable. συνοικέω évoque littéralement le fait d’habiter ou de vivre avec quelqu’un ; « vit avec » est naturel et conserve ce sens relationnel.
- source_word: σοφίᾳ
  choice: la sagesse
  rationale: Le datif marque ici l’association. L’article est requis par l’usage français, sans pour autant imposer une lecture exclusivement abstraite ou personnifiée.
theological_decisions:
- issue: Faut-il écrire « Sagesse » avec une majuscule comme figure personnifiée ?
  choice: la sagesse
  alternative: la Sagesse
  rationale: Le contexte personnifie fortement la sagesse, mais le grec ancien ne permet pas de trancher par la capitalisation. La minuscule évite de rendre explicite une décision interprétative que le texte laisse ouverte, tandis qu’une note signale la lecture personnifiée possible.
translation_notes:
  register: Français moderne, international et digne. La formulation concise suit de près la structure grecque. « Celui qui vit avec » reste idiomatique tout en conservant l’image d’une cohabitation durable portée par συνοικοῦντα.
