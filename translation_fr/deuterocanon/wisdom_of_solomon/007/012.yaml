  text: And I rejoiced in them all, because wisdom leads them; but I did not know that she is their mother.
translation:
  language: fr
  text: Je me suis réjoui de toutes ces choses, parce que la sagesse les guide ; mais j’ignorais qu’elle en était l’origine.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ πάντων
  choice: de tous ces biens
  rationale: Le pronom renvoie aux biens énumérés dans le contexte précédent ; l’explicitation légère donne un français naturel sans ajouter une nouvelle idée.
- source_word: ἡγεῖται
  choice: les guide
  rationale: Le verbe exprime le fait de conduire ou de marcher en tête ; « guide » conserve cette image et s’accorde avec la personnification de la sagesse.
- source_word: γένεσιν
  choice: la mère
  rationale: Dans cette construction, le nom peut désigner l’origine ou la génitrice. « Mère » préserve ici la personnification féminine et le sens concret retenu par la tradition textuelle consultée.
theological_decisions:
- issue: Rapport entre la sagesse et les biens
  choice: qu’elle en était la mère
  alternative: qu’elle était à l’origine de ces biens
  rationale: Le grec γένεσις permet une formulation abstraite liée à l’origine, mais l’attribut appliqué à la sagesse personnifiée autorise « mère ». Cette traduction maintient la tension poétique sans développer une doctrine sur la création.
translation_notes:
  register: Français moderne, digne et fluide. Le point-virgule conserve l’opposition marquée par δέ entre la joie éprouvée et l’ignorance initiale du narrateur.
