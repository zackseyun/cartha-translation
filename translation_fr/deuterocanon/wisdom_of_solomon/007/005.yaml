lexical_decisions:
- source_word: οὐδεὶς … βασιλέων
  choice: aucun roi
  rationale: Cette tournure rend naturellement en français la négation universelle portant sur l’ensemble des rois.
- source_word: γὰρ
  choice: car
  rationale: « Car » conserve le lien explicatif avec l’affirmation précédente sur la condition humaine commune.
- source_word: ἑτέραν
  choice: un autre
  rationale: « Un autre » exprime l’idée d’un commencement distinct, sans préciser davantage la nature de cette différence.
- source_word: ἔσχεν
  choice: n’a eu
  rationale: Le passé composé est naturel en français moderne pour énoncer ce constat général à propos des rois.
- source_word: γενέσεως
  choice: de naissance
  rationale: Dans ce contexte, γενέσεως désigne vraisemblablement la venue au monde, tout en pouvant avoir le sens plus large d’« origine » ou de « génération ».
- source_word: ἀρχήν
  choice: commencement
  rationale: « Commencement » correspond directement au sens de point de départ et maintient la formulation du grec.
theological_decisions:
- issue: Égalité de condition entre les rois et les autres êtres humains
  choice: Le verset affirme qu’aucun roi ne possède un commencement de naissance différent.
  alternative: Car aucun roi n’a eu une origine différente.
  rationale: Le contexte souligne la condition humaine commune, y compris celle des rois. La formulation retenue préserve cette affirmation sans l’élargir en une proposition doctrinale absente du verset.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure légèrement marquée « commencement de naissance » conserve l’association explicite de ἀρχήν et γενέσεως ainsi que son ambiguïté, éclairée par la note.
