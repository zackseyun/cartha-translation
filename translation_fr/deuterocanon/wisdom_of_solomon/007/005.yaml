  text: Car aucun roi n’a eu une origine différente à sa naissance[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car aucun roi n’a eu un autre commencement d’existence. » Le grec γενέσεως peut désigner plus largement l’origine ou la génération, et pas seulement la naissance physique.'
