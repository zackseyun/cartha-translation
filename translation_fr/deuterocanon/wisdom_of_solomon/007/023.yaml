lexical_decisions:
- source_word: φιλάνθρωπον
  choice: bienveillant envers les humains
  rationale: Exprime directement l’amour des êtres humains et la bonté à leur égard; « humain » serait ambigu en français.
- source_word: βέβαιον
  choice: ferme
  rationale: Rend l’idée de stabilité et de constance dans cette série de qualités.
- source_word: ἀσφαλές
  choice: sûr
  rationale: Conserve la notion de sécurité et de fiabilité sans lourdeur.
- source_word: ἀμέριμνον
  choice: libre de toute inquiétude
  rationale: Exprime l’absence d’anxiété sans la légèreté que pourrait suggérer « insouciant ».
- source_word: παντοδύναμον
  choice: tout-puissant
  rationale: Équivalent français naturel et transparent du composé signifiant « qui possède toute puissance ».
- source_word: πανεπίσκοπον
  choice: veillant sur tout
  rationale: Préserve la force de surveillance et de regard attentif du mot, plutôt que de le réduire à la seule capacité visuelle.
- source_word: διὰ πάντων χωροῦν
  choice: pénétrant tous
  rationale: Rend naturellement en français le mouvement à travers ou au sein de tous les esprits, avec une note signalant « traversant ».
- source_word: πνευμάτων
  choice: esprits
  rationale: Correspond au sens contextuel de πνεύματα dans la description de la portée de la Sagesse.
- source_word: νοερῶν
  choice: intelligents
  rationale: Rend clairement la relation à l’intelligence et à la compréhension.
- source_word: καθαρῶν
  choice: purs
  rationale: Équivalent direct et naturel dans ce registre élevé.
- source_word: λεπτοτάτων
  choice: extrêmement subtils
  rationale: Conserve la valeur superlative et la nuance philosophique de finesse extrême.
theological_decisions:
- issue: Traduction de παντοδύναμον par un terme théologique traditionnel
  choice: tout-puissant
  alternative: omnipotent
  rationale: « Tout-puissant » communique directement le sens lexical en français moderne; « omnipotent » est plus technique.
- issue: Construction de διὰ πάντων χωροῦν πνευμάτων νοερῶν καθαρῶν λεπτοτάτων
  choice: pénétrant tous les esprits intelligents, purs et extrêmement subtils
  alternative: traversant tous les esprits intelligents, purs et extrêmement subtils
  rationale: Le grec rattache naturellement le participe aux esprits qualifiés par les trois adjectifs. « Pénétrant » exprime la perméation possible, tandis que la note préserve le sens plus spatial de passage à travers.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation s’inscrit dans une énumération décrivant l’esprit de la Sagesse; elle évite « humain », ambigu en français, et « insouciant », susceptible d’évoquer la négligence.
