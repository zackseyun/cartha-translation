  text: And I learned without deceit[a], and I share without envy; I do not hide her wealth.
translation:
  language: fr
  text: Je l’ai apprise sans tromperie et je la transmets sans envie[a] ; je ne cache pas sa richesse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : généreusement, sans rien garder jalousement.'
    reason: L’adverbe grec peut exprimer un partage libre de toute envie, jalousie ou réticence.
lexical_decisions:
- source_word: ἀδόλως
  choice: sans tromperie
  rationale: L’adverbe exprime l’absence de fraude ou de ruse. « Sans tromperie » conserve clairement cette nuance morale.
- source_word: ἔμαθον
  choice: je l’ai apprise
  rationale: L’aoriste de μανθάνω signifie simplement « apprendre ». Le pronom féminin, exigé par le français naturel, reprend la sagesse dans le contexte.
- source_word: ἀφθόνως
  choice: sans envie
  rationale: L’adverbe indique que le partage se fait sans jalousie ni réticence. La formulation reste proche du grec, tandis que la note en précise le sens contextuel.
- source_word: μεταδίδωμι
  choice: je la transmets
  rationale: Le verbe signifie donner en partage ou communiquer. « Transmettre » convient naturellement à la sagesse et garde l’idée de la faire connaître à autrui.
- source_word: πλοῦτον
  choice: richesse
  rationale: Le singulier rend directement le grec et présente la sagesse comme possédant une richesse abondante.
- source_word: αὐτῆς
  choice: sa
  rationale: Le possessif renvoie à la sagesse, féminine et personnifiée dans le contexte.
- source_word: ἀποκρύπτομαι
  choice: je ne cache pas
  rationale: La forme moyenne a ici le sens actif de cacher ou dissimuler. « Je ne cache pas » est direct et idiomatique.
theological_decisions:
- issue: Personnification de la sagesse dans αὐτῆς
  choice: Conserver la référence féminine par « sa richesse » et par les pronoms « l’ » et « la ».
  alternative: Employer une formulation impersonnelle qui atténuerait la personnification.
  rationale: Le contexte présente la sagesse comme une figure féminine. Cette traduction respecte la grammaire et l’image littéraire grecques sans leur imposer une identification doctrinale ultérieure.
translation_notes:
  register: Français international moderne, sobre et digne. La structure parallèle du grec est conservée, avec des pronoms féminins ajoutés là où le français les exige naturellement pour reprendre la sagesse.
