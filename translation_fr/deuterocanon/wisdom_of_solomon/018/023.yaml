base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/023.yaml
  text: For when heaps of dead had already fallen one upon another[a], he stood in the midst and checked the wrath, and cut off the way to the living.
translation:
  language: fr
  text: Car les morts étaient déjà tombés en tas, les uns sur les autres ; se plaçant au milieu, il arrêta la colère et lui coupa la route vers les vivants.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωρηδόν
  choice: en tas
  rationale: Cet adverbe décrit une accumulation en piles ou en tas ; « en tas » restitue simplement et concrètement l’image.
- source_word: πεπτωκότων
  choice: étaient déjà tombés
  rationale: Le participe parfait exprime une chute accomplie dont le résultat demeure ; le plus-que-parfait français, renforcé par « déjà », rend cette antériorité et cet état résultant.
- source_word: ἐπʼ ἀλλήλων
  choice: les uns sur les autres
  rationale: Cette expression conserve l’image saisissante des morts amoncelés les uns sur les autres.
- source_word: μεταξὺ στὰς
  choice: se plaçant au milieu
  rationale: Le participe indique qu’il prend position dans l’intervalle. « Au milieu » préserve l’absence de complément explicite dans le grec sans préciser davantage entre qui ou quoi il se tient.
- source_word: ἀνέκοψεν
  choice: arrêta
  rationale: Le verbe signifie retenir, repousser ou stopper ; « arrêta » est direct et naturel dans ce contexte.
- source_word: τὴν ὀργήν
  choice: la colère
  rationale: « Colère » est le terme français courant et digne pour la colère punitive de Dieu, sans ajouter explicitement « divine », absent du grec.
- source_word: διέσχισεν
  choice: coupa
  rationale: Le verbe évoque une séparation ou une coupure. Associé à « route », « coupa » conserve la force de l’image tout en restant idiomatique.
- source_word: τὴν πρὸς τοὺς ζῶντας ὁδόν
  choice: la route vers les vivants
  rationale: Cette formulation préserve la métaphore spatiale du chemin suivi par la colère jusqu’à ceux qui sont encore en vie.
theological_decisions:
- issue: Référent du sujet implicite
  choice: Conserver le pronom « il » sans nommer le personnage.
  alternative: Préciser « Aaron » d’après le contexte.
  rationale: Le grec n’exprime pas le nom du sujet dans ce verset. Le pronom respecte cette formulation et laisse le contexte immédiat fournir le référent.
- issue: Nature de ὀργή
  choice: Traduire par « la colère » sans ajouter qu’elle est divine.
  alternative: Employer « le courroux » ou expliciter « la colère de Dieu ».
  rationale: Le contexte donne à cette colère une portée de jugement divin, mais le grec du verset ne nomme pas Dieu. « Colère » garde le poids théologique sans explicitation ajoutée.
- issue: Complément implicite de μεταξὺ
  choice: Employer « au milieu » sans préciser les deux groupes.
  alternative: Traduire « entre les morts et les vivants ».
  rationale: Le contexte suggère une position entre les morts et les vivants, mais le grec laisse μεταξὺ sans complément exprimé. La traduction conserve cette légère indétermination.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve l’image concrète des corps amoncelés et celle de la route barrée à la colère, tout en évitant le registre archaïsant de « courroux ».
