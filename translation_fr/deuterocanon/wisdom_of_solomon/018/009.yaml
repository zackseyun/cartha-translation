base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/009.yaml
  text: For the holy children of good men were secretly offering sacrifices[a], and in unity they established the divine law, that the holy ones would share alike in the same good things and dangers[c][b], while their fathers were already singing beforehand hymns of praise.
translation:
  language: fr
  text: 'Car les pieux enfants d’hommes de bien offraient des sacrifices en secret[a] et, d’un commun accord, ils établirent la loi divine[b] : ceux qui sont saints[c] participeraient également aux mêmes biens et aux mêmes dangers, tandis que leurs pères chantaient déjà des louanges à l’avance.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « clandestinement ». Le grec souligne que les sacrifices étaient accomplis à l’abri des regards.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la loi de la divinité ». L’expression grecque est inhabituelle.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « les saints ». Le grec désigne littéralement des personnes saintes et n’implique pas nécessairement le sens chrétien technique que « saints » a reçu plus tard.'
    reason: alternative_reading
lexical_decisions:
- source_word: κρυφῇ
  choice: en secret
  rationale: L’adverbe indique que les sacrifices étaient accomplis clandestinement; « en secret » est naturel et précis en français.
- source_word: ἐθυσίαζον
  choice: offraient des sacrifices
  rationale: L’imparfait grec suggère une action en cours ou répétée, et la formulation explicite le sens cultuel.
- source_word: ὅσιοι παῖδες ἀγαθῶν
  choice: les enfants pieux d’hommes de bien
  rationale: « Pieux » exprime ici la fidélité religieuse de ὅσιοι; « enfants d’hommes de bien » conserve la nuance généalogique de παῖδες ἀγαθῶν sans préciser indûment leur âge.
- source_word: τὸν τῆς θειότητος νόμον
  choice: la loi divine
  rationale: Cette expression grecque inhabituelle désigne littéralement la loi de la divinité; « loi divine » en donne le sens le plus clair sans ajouter de contenu.
- source_word: ἐν ὁμονοίᾳ διέθεντο
  choice: d’un commun accord, ils établirent
  rationale: ὁμόνοια exprime l’unanimité, tandis que le moyen διέθεντο évoque une disposition ou un engagement solennel commun.
- source_word: μεταλήμψεσθαι
  choice: partageraient
  rationale: L’infinitif donne le contenu de leur engagement et exprime une participation commune.
- source_word: τῶν αὐτῶν ὁμοίως καὶ ἀγαθῶν καὶ κινδύνων
  choice: également les mêmes biens et les mêmes dangers
  rationale: La formulation conserve l’insistance grecque sur une participation égale aux circonstances favorables comme aux périls.
- source_word: τοὺς ἁγίους
  choice: les saints
  rationale: Le terme français rend directement le substantif grec « les saints/les êtres saints »; une note prévient toute restriction à un emploi chrétien technique ultérieur.
- source_word: πατέρων
  choice: leurs pères
  rationale: Le possessif explicite en français le rapport contextuel avec le groupe évoqué.
- source_word: προαναμελπόντων αἴνους
  choice: entonnaient déjà par avance des chants de louange
  rationale: La traduction conserve à la fois l’idée du chant et la valeur anticipatrice de προ-; « chants de louange » rend naturellement αἴνους dans ce contexte.
theological_decisions:
- issue: Identité du groupe dans le cadre pascal
  choice: Le texte désigne les fidèles d’Israël engagés dans une solidarité commune sous la loi divine, sans ajouter cette identification dans le verset.
  alternative: Comprendre la phrase comme une description générale des justes, sans ancrage historique précis.
  rationale: Le contexte immédiat est celui de la nuit de l’Exode, mais la traduction évite d’introduire des précisions absentes de la phrase grecque.
- issue: Portée de τοὺς ἁγίους
  choice: les saints
  alternative: les êtres saints; ceux qui sont saints
  rationale: « Les saints » est le rendu français direct et digne, mais la note conserve la portée littérale et évite d’imposer un sens ecclésial technique postérieur.
- issue: Sens de τὸν τῆς θειότητος νόμον
  choice: la loi divine
  alternative: la loi de la divinité
  rationale: Le génitif demeure inhabituel et peut être rendu plus formellement; le texte principal privilégie une formulation française intelligible sans définir davantage la relation entre la loi et la divinité.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve la solennité et la structure argumentative du grec tout en évitant un calque lourd. Les marqueurs [a], [b] et [c] figurent tous dans le texte principal.
