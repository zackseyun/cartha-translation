base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/007.yaml
  text: So your people expected both the salvation of the righteous and the destruction of their enemies[b][a];
translation:
  language: fr
  text: Ainsi, ton peuple attendait[a] le salut des justes et la destruction de leurs ennemis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « espérait » ou « accueillait » ; le verbe grec peut évoquer aussi bien l’attente que l’accueil.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεδέχθη
  choice: attendait
  rationale: Le verbe προσδέχομαι peut exprimer l’attente, l’accueil ou la réception. Ici, le contexte de la nuit annoncée favorise l’idée d’une attente confiante, rendue naturellement par « attendait ».
- source_word: λαοῦ σου
  choice: ton peuple
  rationale: λαός désigne ici la collectivité liée à Dieu; « ton peuple » conserve l’adresse directe et la portée biblique de l’expression.
- source_word: σωτηρία
  choice: le salut
  rationale: σωτηρία peut désigner le salut ou la délivrance. « Le salut » garde le registre théologique du grec tout en convenant au sauvetage historique évoqué.
- source_word: δικαίων
  choice: des justes
  rationale: Le génitif pluriel δικαίων signifie littéralement « des justes ». Cette formulation concise préserve la catégorie morale sans préciser indûment si le génitif est objectif, possessif ou explicatif.
- source_word: ἐχθρῶν
  choice: de leurs ennemis
  rationale: Le grec dit simplement « d’ennemis ». Le possessif explicite en français le rapport contextuel avec le peuple et les justes, sans changer le contraste.
- source_word: ἀπωλία
  choice: la destruction
  rationale: ἀπωλία désigne la destruction, la ruine ou la perte. « Destruction » rend clairement le jugement et forme une antithèse nette avec « salut ».
- source_word: μὲν…δὲ
  choice: … mais …
  rationale: La corrélation grecque oppose fortement les deux issues. « Mais » restitue cette tension en français naturel.
theological_decisions:
- issue: Préserver le double dénouement du salut et du jugement
  choice: « le salut des justes, mais la destruction de leurs ennemis »
  alternative: « la délivrance des justes et la ruine de leurs ennemis »
  rationale: Le grec met explicitement en contraste σωτηρία et ἀπωλία au moyen de μὲν…δὲ. La traduction maintient sans l’atténuer la juxtaposition du salut des justes et du jugement de leurs ennemis.
- issue: Valeur du génitif dans « σωτηρία δικαίων »
  choice: « le salut des justes »
  alternative: « la délivrance accordée aux justes »
  rationale: La formulation française conserve l’ambiguïté compacte du génitif grec, au lieu d’ajouter explicitement l’idée d’un salut « accordé à ».
translation_notes:
  register: Français moderne, international et digne. La phrase reste brève et antithétique comme le grec. « Ainsi » assure une articulation naturelle avec le contexte, tandis que « attendait » conserve l’aspect d’attente sans imposer l’idée plus forte d’une réception déjà accomplie.
