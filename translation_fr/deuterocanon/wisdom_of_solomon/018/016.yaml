  text: bearing your sharp sword—your unfeigned command—and standing[a], he filled all things with death; and while he touched heaven[b], he had stepped upon the earth.
translation:
  language: fr
  text: Portant, comme une épée aiguë, ton ordre sans feinte[a], il prit position et remplit tout de mort ; il touchait le ciel[b], mais avait posé le pied sur la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton ordre sincère », « ton décret sans feinte » ou « ton ordre sans hypocrisie ».
    reason: lexical_alternative
  - marker: b
    text: 'Le grec décrit l’agent à l’échelle cosmique : il touche le ciel tout en ayant posé le pied sur la terre, image de la portée universelle du jugement.'
    reason: cultural_note
lexical_decisions:
- source_word: ξίφος ὀξὺ … τὴν ἀνυπόκριτον ἐπιταγήν σου
  choice: portant comme une épée acérée ton ordre sans détour
  rationale: L’accusatif « ton ordre » explicite ce que représente l’« épée acérée ». « Comme » rend cette relation en français sans faire de l’épée un objet distinct de l’ordre divin. « Sans détour » exprime le caractère non feint, franc et inexorable de ἀνυπόκριτον sans employer l’étrange littéralisme « non hypocrite ».
- source_word: στὰς
  choice: Ayant pris position
  rationale: Le participe aoriste de ἵστημι décrit le fait de s’être placé ou dressé avant l’action principale. Cette formulation conserve cet aspect tout en restant naturelle.
- source_word: ἐπλήρωσεν τὰ πάντα θανάτου
  choice: il remplit tout de mort
  rationale: La formulation garde la force concise et la portée totale de τὰ πάντα, sans préciser indûment « le monde » ou « l’univers ».
- source_word: οὐρανοῦ μὲν ἥπτετο
  choice: il touchait au ciel
  rationale: ἅπτομαι signifie ici « toucher » ou « atteindre ». « Toucher au ciel » restitue naturellement en français l’image de la stature cosmique.
- source_word: βέβηκει δʼ ἐπὶ γῆς
  choice: tandis qu’il se tenait sur la terre
  rationale: Le plus-que-parfait βέβηκει exprime une position acquise par le fait d’avoir posé le pied ou avancé. En français, « se tenait sur la terre » rend clairement la posture résultante et le contraste spatial avec le ciel.
theological_decisions:
- issue: Identification de l’agent guerrier du jugement
  choice: Conserver la personnification masculine et l’imagerie guerrière sans identifier davantage l’agent dans ce verset.
  alternative: L’identifier explicitement à un ange destructeur ou à une personne divine distincte.
  rationale: Le contexte présente la parole ou l’ordre de Dieu comme un guerrier exécutant le jugement. Le verset ne tranche pas explicitement son statut ontologique ; la traduction préserve donc cette tension.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme solennel, l’image martiale et le parallélisme entre ciel et terre sont conservés. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
