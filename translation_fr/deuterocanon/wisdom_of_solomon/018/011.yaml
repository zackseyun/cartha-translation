base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/011.yaml
  text: And servant and master alike were punished with the same judgment[a], and the commoner suffered the same things as the king.
translation:
  language: fr
  text: L’esclave et son maître furent punis d’une même peine[a], et l’homme du peuple subit les mêmes souffrances que le roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’une peine semblable ». Le grec peut aussi se rendre par « châtiment »; le terme désigne ici une sanction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοία δίκη
  choice: puni de la même manière
  rationale: Dans ce contexte pénal, δίκη désigne le châtiment subi; ὁμοία souligne son caractère égal ou semblable pour les deux rangs sociaux. Cette formulation française restitue naturellement la construction elliptique grecque.
- source_word: δοῦλος
  choice: esclave
  rationale: Le contraste explicite avec δεσπότης met en avant le statut servile; « esclave » évite d’atténuer la réalité sociale du grec.
- source_word: δεσπότῃ
  choice: maître
  rationale: Dans l’opposition avec l’esclave, « maître » est le correspondant relationnel le plus naturel et n’introduit pas de connotation théologique.
- source_word: κολασθείς
  choice: fut puni
  rationale: Le participe a un sens passif et pénal concret; le passé simple convient au registre narratif et soutenu du passage.
- source_word: δημότης
  choice: homme du peuple
  rationale: Face au roi, le terme désigne une personne ordinaire sans rang royal. « Homme du peuple » est clair en français international et moins historiquement marqué que « roturier ».
- source_word: βασιλεῖ
  choice: roi
  rationale: « Roi » rend directement le titre royal et conserve le contraste maximal de statut.
- source_word: τὰ αὐτὰ πάσχων
  choice: subit les mêmes choses
  rationale: La traduction garde la généralité du grec et son insistance sur une expérience identique, sans préciser indûment la nature de ce qui fut subi.
theological_decisions:
- issue: Égalité des rangs sociaux devant le châtiment
  choice: Conserver les contrastes « esclave / maître » et « homme du peuple / roi ».
  alternative: Adoucir en « serviteur / maître » ou généraliser les catégories sociales.
  rationale: Le verset souligne que le châtiment atteint pareillement les personnes de tout rang. Maintenir les catégories du texte préserve cette portée sans ajouter de formulation doctrinale.
- issue: Portée de ὁμοία δίκη
  choice: Traduire dans le texte par « puni de la même manière » et signaler en note la possibilité d’un châtiment égal ou semblable.
  alternative: « subit la même peine » ou « connut une justice semblable »
  rationale: δίκη est concrètement pénal ici, mais ὁμοία peut exprimer l’égalité ou la similitude. La note préserve cette nuance lexicale sans réduire δίκη à la justice abstraite.
translation_notes:
  register: Français moderne, digne et direct. Le parallélisme social du grec est maintenu; « homme du peuple » est préféré à « roturier » pour sa clarté internationale. Le marqueur [a] figure bien dans le texte principal.
