base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/001.yaml
  text: But for your holy ones there was very great light[a]; hearing their voice but not seeing their form, since they indeed had not suffered the same things[b], they counted them blessed.
translation:
  language: fr
  text: Mais pour ceux qui te sont fidèles, il y avait une très grande lumière[a]. Entendant leur voix sans pourtant voir leur apparence, ils les déclaraient heureux, puisque, de fait, eux aussi les avaient ardemment désirés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tes saints » ou « ceux qui te sont consacrés ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le verbe grec signifie normalement « désirer ardemment », mais la phrase est difficile dans ce contexte et son complément n’est pas exprimé. Certains comprennent plutôt l’idée suivante : « parce qu’ils n’avaient pas subi les mêmes souffrances ».'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῖς ... ὁσίοις σου
  choice: pour ceux qui te sont fidèles
  rationale: ὅσιος qualifie ici ceux qui vivent dans la fidélité et la piété envers Dieu. Cette formulation française garde la dimension relationnelle sans les connotations ecclésiastiques possibles de « saints ».
- source_word: μέγιστον ... φῶς
  choice: une très grande lumière
  rationale: Le superlatif μέγιστον peut avoir une valeur intensive ; « très grande » est naturel en français et convient au contraste avec les ténèbres du contexte.
- source_word: φωνὴν
  choice: voix
  rationale: φωνή peut signifier « son » ou « voix » ; le possessif et la référence à des personnes favorisent « voix ».
- source_word: μορφὴν
  choice: apparence
  rationale: μορφή désigne la forme visible. « Apparence » rend naturellement le contraste entre entendre des personnes et ne pas les voir.
- source_word: ἐπεπώθεισαν
  choice: les avaient ardemment désirés
  rationale: La forme donnée vient de ἐπιποθέω, « désirer vivement, languir après ». Le complément étant sous-entendu, le pronom « les » reprend le groupe dont la voix était entendue, tout en signalant en note la difficulté contextuelle.
- source_word: ἐμακάριζον
  choice: ils les déclaraient heureux
  rationale: μακαρίζω signifie reconnaître, dire ou proclamer quelqu’un heureux ou bienheureux. « Déclaraient heureux » conserve cette valeur évaluative dans un français courant et digne.
theological_decisions:
- issue: Référent du sujet sous-entendu dans « entendant » et « ils les déclaraient heureux »
  choice: Les Égyptiens, évoqués par le contexte, entendent les fidèles sans les voir et les déclarent heureux.
  alternative: La syntaxe condensée pourrait être comprise comme décrivant la perception d’un autre groupe par les fidèles.
  rationale: Le contexte du fléau des ténèbres oppose les Égyptiens au peuple de Dieu ; il est donc le plus naturel que les personnes privées de lumière entendent les bénéficiaires de la lumière et reconnaissent leur bonheur.
- issue: Sens de ἐπεπώθεισαν dans ce contexte
  choice: 'Traduire le sens lexical attesté de ἐπιποθέω : « avaient ardemment désiré » et conserver l’incertitude en note.'
  alternative: Comprendre contextuellement « n’avaient pas subi les mêmes souffrances », lecture qui correspondrait à un autre verbe ou supposerait une difficulté textuelle.
  rationale: Le texte grec fourni ne contient aucune négation et sa forme verbale signifie normalement « désirer vivement ». Une traduction fondée sur la source ne peut introduire silencieusement « ne pas souffrir les mêmes choses » ; la lecture contextuelle est donc présentée comme possibilité, non comme texte certain.
translation_notes:
  register: Français international moderne, fluide et digne. Le verset conserve les sujets implicites du grec autant que le permet la clarté, tandis que la note rend visible la difficulté majeure du dernier membre de phrase.
