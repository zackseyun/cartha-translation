review_pass:
  verdict: revise
  source_fidelity: 'La traduction doit suivre le grec fourni : ἐπεπώθεισαν est un plus-que-parfait de ἐπιποθέω (« avoir ardemment désiré »), sans négation et sans complément exprimé. Le pronom objet « les » dans le projet tranche indûment l’objet du désir en faveur des fidèles. La note doit signaler cette ellipse et la difficulté syntaxico-contextuelle, plutôt que présenter comme sens alternatif une proposition absente du texte source.'
  naturalness: Le français est globalement fluide et de registre approprié. « En entendant » rend plus naturellement le participe grec que « Entendant ». L’omission de l’objet après « avaient ardemment désiré » conserve l’ambiguïté grecque, même si elle donne une formulation volontairement elliptique, justifiée ici par le texte.
  terminology: « Ceux qui te sont fidèles » convient bien à ὁσίοις σου dans un français moderne non confessionnel. « Apparence » rend correctement μορφή dans le contraste entre entendre et voir. « Les disaient heureux » est une expression française naturelle pour ἐμακάριζον et évite une lourdeur inutile.
  issues:
  - severity: medium
    issue: Objet ajouté à « les avaient ardemment désirés »
    rationale: Le grec ἐπεπώθεισαν n’exprime aucun objet. « Les » impose que les personnes entendues, c’est-à-dire les fidèles, soient l’objet du désir, alors que le grec laisse cet objet implicite et que le rapport contextuel demeure difficile.
  - severity: medium
    issue: La note b propose « ils n’avaient pas subi les mêmes souffrances » comme compréhension
    rationale: Cette proposition ne correspond ni à la négation ni au verbe présents dans le texte grec fourni. Elle risque de remplacer silencieusement la leçon source par une harmonisation contextuelle. La note doit décrire l’ellipse réelle et la difficulté sans introduire ce sens comme lecture du texte.
  - severity: low
    issue: Rendu du superlatif μέγιστον
    rationale: « Très grande » est possible comme intensif, mais « extrêmement vive » rend plus idiomatiquement en français la grandeur exceptionnelle de la lumière et son effet dans le contexte des ténèbres.
  revised_text: Mais, pour ceux qui te sont fidèles, il y avait une lumière extrêmement vive[a]. En entendant leur voix sans voir leur apparence, ils les disaient heureux, puisque eux aussi avaient ardemment désiré[b].
  revised_footnotes:
  - marker: a
    text: 'Ou : « tes saints » ou « ceux qui te sont consacrés ».'
    reason: lexical_alternative
  - marker: b
    text: Le grec porte « avaient ardemment désiré », sans en exprimer l’objet. Le lien exact de cette expression avec le fait de les dire heureux est difficile à préciser dans le contexte.
    reason: alternative_reading
  revision_rationale: La révision retire l’objet « les » ajouté après ἐπεπώθεισαν afin de préserver l’ellipse et l’ambiguïté du grec source. Elle remplace la note qui introduisait l’idée de souffrances non subies par une explication exacte de la difficulté textuelle. Les autres choix sont conservés ou légèrement lissés pour le français moderne.
