base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/024.yaml
  text: For on the full-length robe was the whole world[a], and the glory of the fathers was on the engraving of the four-rowed stones[b], and your majesty was on the diadem upon his head.
translation:
  language: fr
  text: Car le monde entier figurait sur la robe qui descendait jusqu’aux pieds[a], la gloire des pères sur la gravure des pierres disposées en quatre rangées[b], et ta majesté sur le diadème de sa tête.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur le vêtement qui descendait jusqu’aux pieds ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque est très condensée et fait probablement allusion au pectoral du grand prêtre, dont les pierres étaient disposées en quatre rangées. La relation exacte entre la « gloire des pères » et la gravure n’est pas explicitée.
    reason: cultural_note
lexical_decisions:
- source_word: ποδήρους ἐνδύματος
  choice: la robe qui descendait jusqu’aux pieds
  rationale: ποδήρης désigne un vêtement qui atteint les pieds. Cette formulation française est claire et conserve l’image du vêtement sacerdotal sans employer un terme technique absent du grec.
- source_word: ὅλος ὁ κόσμος
  choice: le monde entier
  rationale: κόσμος évoque ici le monde ou l’ordre cosmique symboliquement représenté sur la robe. « Le monde entier » préserve cette portée sans expliciter davantage le symbole.
- source_word: πατέρων δόξα
  choice: la gloire des pères
  rationale: La traduction littérale maintient le registre élevé et l’ambiguïté entre la dignité des ancêtres et leur représentation commémorative; « patriarches » serait plus interprétatif.
- source_word: ἐπὶ τετραστίχου λίθου γλυφῆς
  choice: gravée sur les pierres disposées en quatre rangées
  rationale: L’expression grecque est très condensée. Cette formulation restitue naturellement la gravure et la disposition en quatre rangées, tout en faisant comprendre l’allusion probable aux pierres du pectoral.
- source_word: μεγαλοσύνη σου
  choice: ta majesté
  rationale: « Majesté » rend la grandeur divine dans un registre digne et cultuel, sans ajouter de précision doctrinale.
- source_word: διαδήματος κεφαλῆς αὐτοῦ
  choice: le diadème qui ornait sa tête
  rationale: διάδημα est rendu par le terme distinctif « diadème ». La relative donne en français naturel le rapport compact entre le diadème et sa tête.
theological_decisions:
- issue: Description symbolique des vêtements du grand prêtre
  choice: Conserver les affirmations selon lesquelles le monde, la gloire ancestrale et la majesté divine figuraient sur ses vêtements, sans développer explicitement leur arrière-plan biblique.
  alternative: Identifier directement la robe, le pectoral et le diadème aux éléments prescrits en Exode 28, ou traduire κόσμος par « univers » pour accentuer la lecture cosmologique.
  rationale: Le grec présente ces correspondances symboliques sans expliciter ici toute leur signification. La traduction préserve donc l’image et sa tension théologique, tandis qu’une note signale seulement l’allusion culturelle probable.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme ternaire du grec, avec de légers ajustements idiomatiques. Les termes « gloire », « majesté » et « diadème » maintiennent le registre solennel du passage.
