base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/003.yaml
  text: Instead of these things[a], you provided a pillar blazing with fire, both as a guide for an unknown journey and as a harmless sun for their honored exile.
translation:
  language: fr
  text: En revanche, tu leur as donné une colonne de feu flamboyante, comme guide pour un voyage inconnu, et un soleil inoffensif pour leur noble séjour à l’étranger[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour leur honorable exil ». L’expression grecque peut désigner soit un exil, soit un séjour à l’étranger, présenté ici comme noble ou honorable.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθʼ ὧν
  choice: À la place de ces ténèbres
  rationale: La locution marque ici le contraste avec les ténèbres évoquées dans le contexte précédent. L’explicitation du référent rend ce contraste naturel en français sans en modifier le sens.
- source_word: πυριφλεγῆ στῦλον
  choice: une colonne flamboyante de feu
  rationale: Cette formulation conserve l’image concrète et l’intensité de l’adjectif composé, tout en évoquant naturellement la colonne de feu de l’Exode.
- source_word: ὁδηγὸν μὲν ἀγνώστου ὁδοιπορίας
  choice: pour les guider sur un chemin inconnu
  rationale: Le grec présente la colonne comme guide d’un déplacement dont la route est inconnue. Cette tournure française exprime clairement sa fonction sans alourdir la phrase.
- source_word: ἥλιον δὲ ἀβλαβῆ
  choice: un soleil inoffensif
  rationale: Le texte dit expressément « soleil » et non simplement « lumière ». « Inoffensif » maintient le contraste avec les phénomènes qui frappent les Égyptiens.
- source_word: φιλοτίμου ξενιτείας
  choice: leur noble séjour en terre étrangère
  rationale: ξενιτεία désigne le fait de vivre ou de séjourner à l’étranger, tandis que φιλότιμος lui confère ici une valeur honorable ou noble. Cette traduction évite de donner à « exil » une nuance exclusivement pénale ou douloureuse.
- source_word: παρέσχες
  choice: tu leur as donné
  rationale: Le verbe signifie fournir, procurer ou accorder. « Tu leur as donné » est direct, naturel et convient à l’adresse faite à Dieu.
theological_decisions:
- issue: Allusion à l’Exode dans les images de la colonne et du soleil
  choice: Conserver les images concrètes de la colonne et du soleil.
  alternative: Paraphraser par « une lumière pour les guider ».
  rationale: Les images précises relient le verset à la conduite providentielle de Dieu lors de la sortie d’Égypte; les remplacer par une lumière abstraite effacerait cette dimension intertextuelle.
- issue: Portée de ξενιτεία
  choice: « séjour en terre étrangère »
  alternative: « exil »
  rationale: Le mot peut désigner l’exil, mais aussi plus largement la résidence hors de son pays. Le contexte et le qualificatif positif invitent à préserver cette amplitude plutôt qu’à imposer une lecture strictement négative.
- issue: Référent de ἀνθʼ ὧν
  choice: Expliciter « ces ténèbres » d’après le contexte immédiat.
  alternative: Conserver le vague avec « à la place de cela » ou « en échange de quoi ».
  rationale: Le contraste porte sur les ténèbres imposées aux adversaires et la lumière accordée au peuple. L’explicitation facilite la compréhension tout en suivant le référent contextuel le plus proche.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement maintient l’adresse directe à Dieu. La construction en deux fonctions parallèles — guide et soleil — conserve le mouvement rhétorique du grec.
