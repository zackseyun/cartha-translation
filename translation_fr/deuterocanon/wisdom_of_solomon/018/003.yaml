    rationale: Les ténèbres sont le référent contextuel le plus probable, mais le grec emploie seulement un pronom relatif pluriel (« à la place de ces choses / en revanche »). Une transition adversative évite d’ajouter au texte du verset un référent non exprimé.
  - severity: low
