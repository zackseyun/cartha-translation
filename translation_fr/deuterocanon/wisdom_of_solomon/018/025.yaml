base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/025.yaml
  text: The destroyer gave way before this man[a], and feared these things[c][b]; for the mere testing of wrath was sufficient.
translation:
  language: fr
  text: Le destructeur céda devant cet homme[a] et craignit ces choses[b] ; car la seule épreuve de la colère suffisait[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant celui-ci ». Il s’agit du personnage sacerdotal évoqué dans le contexte.
    reason: alternative_reading
  - marker: b
    text: « Ces choses » renvoie probablement aux insignes sacerdotaux ou aux signes commémoratifs décrits au verset précédent, mais le grec laisse le référent implicite.
    reason: cross_reference
  - marker: c
    text: Ou « l’expérience » ou « la preuve de la colère ». L’expression grecque est condensée.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: cet homme
  rationale: Le démonstratif renvoie au personnage sacerdotal du contexte immédiat. « Cet homme » exprime clairement la référence personnelle, sans préciser davantage son identité.
- source_word: εἶξεν
  choice: céda devant
  rationale: Le verbe indique que l’on cède ou recule. Cette formulation conserve l’image du destructeur arrêté par le personnage mentionné.
- source_word: ὀλοθρεύων
  choice: le destructeur
  rationale: Le participe substantivé signifie littéralement « celui qui détruit ». « Le destructeur » est naturel en français et n’ajoute pas la précision « ange », absente du grec.
- source_word: ταῦτα
  choice: ces choses
  rationale: Le démonstratif neutre pluriel a un référent implicite, probablement les éléments sacerdotaux évoqués au verset précédent. La formulation maintient cette indétermination.
- source_word: ἐφοβήθησαν
  choice: craignit
  rationale: Dans la construction comprise par le texte de consultation, le destructeur demeure le sujet et les éléments désignés par ταῦτα sont l’objet de sa crainte. Le français emploie le singulier conformément à ce référent, malgré la forme grecque plurielle difficile.
- source_word: πεῖρα
  choice: manifestation
  rationale: Le nom peut désigner l’épreuve, l’expérience ou la preuve concrète. Ici, « manifestation » rend naturellement l’idée que la colère avait déjà suffisamment fait sentir sa puissance, tout en signalant les autres possibilités en note.
- source_word: ὀργῆς
  choice: colère
  rationale: Dans ce contexte de jugement divin, « colère » est le terme français courant et digne ; « courroux » serait plus archaïque.
- source_word: ἱκανή
  choice: suffisait
  rationale: L’adjectif prédicatif exprime qu’une manifestation supplémentaire n’était pas nécessaire. La tournure verbale est idiomatique en français.
theological_decisions:
- issue: Identité de ὀλοθρεύων
  choice: le destructeur
  alternative: l’ange destructeur
  rationale: Le contexte évoque un agent de destruction ou de fléau, mais le grec ne l’appelle pas explicitement un ange. Le texte principal conserve donc la désignation moins interprétative.
- issue: Référent de ταῦτα
  choice: ces choses
  alternative: les insignes sacerdotaux ou les signes commémoratifs mentionnés au verset précédent
  rationale: Le référent est fourni par le contexte sans être explicité dans cette phrase. La traduction ne tranche pas ce que le grec laisse implicite.
- issue: Sens de πεῖρα τῆς ὀργῆς
  choice: manifestation de la colère
  alternative: épreuve, expérience ou preuve de la colère
  rationale: L’expression grecque est condensée. Le choix principal communique qu’un premier déploiement de la colère avait suffi, tandis que la note préserve l’éventail lexical.
translation_notes:
  register: Français international moderne, sobre et digne. « Le destructeur » évite d’introduire une identification angélique absente du grec. « Ces choses » conserve volontairement le référent implicite, et une note signale la difficulté lexicale de πεῖρα.
