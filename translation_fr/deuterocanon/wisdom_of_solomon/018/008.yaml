  text: For just as you punished the adversaries[a], so by this, having summoned us, you glorified us.
translation:
  language: fr
  text: Car, de même que tu as puni les adversaires, ainsi, nous ayant appelés, tu nous as glorifiés par là[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « après nous avoir convoqués » ou « après nous avoir invités ». Le verbe grec peut désigner le fait d’appeler, de convoquer ou d’inviter; il peut aussi suggérer un appel auprès de celui qui appelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτιμώρησας
  choice: tu as puni
  rationale: Le verbe τιμωρέω peut exprimer le châtiment ou la vengeance. « Punir » est clair, actuel et n’explicite pas davantage le motif de l’action.
- source_word: τοὺς ὑπεναντίους
  choice: nos adversaires
  rationale: Ὑπεναντίος désigne ceux qui s’opposent de manière hostile. « Adversaires » conserve cette portée sans imposer un cadre exclusivement militaire. Le possessif est implicite dans l’opposition avec « nous » et rend la phrase naturelle en français.
- source_word: τούτῳ
  choice: par là
  rationale: Le datif démonstratif renvoie à l’action divine qui vient d’être évoquée et en exprime vraisemblablement le moyen. « Par là » garde ce lien sans alourdir la phrase.
- source_word: προκαλεσάμενος
  choice: en nous appelant auprès de toi
  rationale: Le participe moyen de προκαλέω peut signifier appeler, convoquer ou inviter, avec une possible nuance d’appel auprès de soi. La formulation retenue exprime cette nuance tout en la signalant comme lexicalement incertaine dans la note.
- source_word: ἐδόξασας
  choice: tu nous as glorifiés
  rationale: Δοξάζω peut signifier glorifier ou honorer. « Glorifier » conserve le poids du terme grec et le contraste marqué entre le châtiment des adversaires et la gloire accordée au peuple.
theological_decisions:
- issue: Rapport entre le châtiment des adversaires et la glorification du peuple
  choice: La même intervention divine qui punit les adversaires sert aussi à glorifier le peuple appelé auprès de Dieu.
  alternative: Le texte peut être compris plus sobrement comme juxtaposant le châtiment des adversaires et la convocation honorifique du peuple, sans accent relationnel sur « auprès de toi ».
  rationale: La construction grecque oppose directement « les adversaires » à « nous » et relie les deux effets de l’action divine par τούτῳ. La traduction préserve ce contraste sans développer une doctrine particulière de l’appel.
translation_notes:
  register: Français international moderne, digne et accessible. La structure comparative « de même que » et le lien instrumental « par là » restent proches du grec, tandis que l’ordre de la proposition est adapté à un français naturel.
