review_pass:
  verdict: revise
  source_fidelity: La traduction rend bien l'accumulation de morts, l'incapacité des vivants à les ensevelir et la destruction soudaine de la descendance particulièrement estimée. Toutefois, « sous une même sentence de mort » donne à ἐν ἑνὶ ὀνόματι θανάτου une nuance judiciaire qui n'est pas explicite dans le grec. « Par une même forme de mort » demeure plus proche de l'expression, sans trancher indûment son sens idiomatique.
  naturalness: Le registre est globalement clair et solennel. « Les vivants ne suffisaient même pas à les ensevelir » est compréhensible, mais « n’étaient même pas assez nombreux » est plus idiomatique et exprime nettement l'insuffisance numérique indiquée par ἱκανοί.
  terminology: « Descendance la plus honorée » est défendable pour ἡ ἐντιμοτέρα γένεσις et la note préserve utilement l'alternative contextuelle « premiers-nés ». « Détruite » rend le passif διεφθάρη avec force sans ajouter de précision doctrinale.
  issues:
  - severity: medium
    issue: « sous une même sentence de mort »
    rationale: Cette formulation interprète « en/par un seul nom de mort » comme une condamnation ou un verdict judiciaire. Le grec ne formule pas explicitement une sentence; « par une même forme de mort » conserve mieux l'ambiguïté de l'idiome.
  - severity: low
    issue: « les vivants ne suffisaient même pas »
    rationale: La construction est possible, mais elle est moins naturelle que l'expression explicite de leur nombre insuffisant pour ensevelir les morts.
