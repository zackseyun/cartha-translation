base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/012.yaml
  text: And all together[a], under one sentence of death, they had countless dead; for the living were not even sufficient to bury them, since in a single moment their most honored offspring was destroyed.
translation:
  language: fr
  text: Tous ensemble, par une même forme de mort, ils eurent d’innombrables morts ; car les vivants n’étaient même pas assez nombreux pour les ensevelir, puisque, en un seul instant, leur descendance la plus honorée[a] fut détruite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs premiers-nés ». Le contexte évoque le fléau qui frappa les premiers-nés d’Égypte, mais le grec dit plus littéralement « leur descendance la plus honorée ».
    reason: alternative_reading
lexical_decisions:
- source_word: ὁμοθυμαδόν
  choice: tous ensemble
  rationale: Rend la simultanéité collective sans suggérer un accord délibéré.
- source_word: ἐν ἑνὶ ὀνόματι θανάτου
  choice: sous une même sentence de mort
  rationale: Conserve l'idée d'une condition ou condamnation commune de mort, tout en donnant en français un sens intelligible à l'expression littérale « sous un seul nom de mort ».
- source_word: νεκροὺς εἶχον ἀναριθμήτους
  choice: ils eurent des morts innombrables
  rationale: Préserve la construction possessive et l'ampleur impossible à dénombrer, dans un registre grave.
- source_word: οὐδὲ γὰρ πρὸς τὸ θάψαι οἱ ζῶντες ἦσαν ἱκανοί
  choice: les vivants ne suffisaient même pas à les ensevelir
  rationale: Exprime directement l'insuffisance du nombre des vivants pour accomplir l'ensevelissement.
- source_word: πρὸς μίαν ῥοπὴν
  choice: en un seul instant
  rationale: Rend la soudaineté extrême de l'événement dans un français naturel et digne.
- source_word: ἡ ἐντιμοτέρα γένεσις αὐτῶν
  choice: leur descendance la plus honorée
  rationale: γένεσις désigne ici la descendance ou la lignée, qualifiée de particulièrement estimée ; le grec ne dit pas explicitement « premiers-nés ».
- source_word: διεφθάρη
  choice: fut anéantie
  rationale: Reflète la force catastrophique du passif de διαφθείρω dans ce contexte de jugement.
theological_decisions:
- issue: Faut-il expliciter l'allusion à la mort des premiers-nés d'Égypte ?
  choice: leur descendance la plus honorée
  alternative: leurs premiers-nés
  rationale: Le contexte renvoie bien au fléau des premiers-nés, mais la proposition emploie ἡ ἐντιμοτέρα γένεσις et non un terme grec explicite pour « premier-né ». Le texte principal conserve donc la formulation descriptive, tandis que la note signale l'allusion.
translation_notes:
  register: Français international moderne, solennel mais accessible. La ponctuation conserve le mouvement causal de la phrase grecque ; « ensevelir » convient au registre funéraire sans être archaïque.
