  text: your all-powerful word leaped from heaven[a], from royal thrones, a relentless warrior, into the midst of the doomed land[b];
translation:
  language: fr
  text: Ta parole toute-puissante a bondi du ciel[a], des trônes royaux[b], en guerrier implacable, au milieu du pays voué à la destruction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta Parole toute-puissante ». Le grec peut désigner ici, de façon générale, la parole efficace de Dieu ; certains y voient aussi une personnification ou une anticipation de son agent divin.
    reason: alternative_reading
  - marker: b
    text: 'Le grec porte le pluriel : « des trônes royaux ».'
    reason: source_form
lexical_decisions:
- source_word: ὁ παντοδύναμός σου λόγος
  choice: ta parole toute-puissante
  rationale: παντοδύναμος signifie « tout-puissant » et qualifie λόγος. « Parole » garde le sens direct sans imposer une identification christologique ultérieure, tandis que le féminin grammatical français permet la reprise naturelle par « elle ».
- source_word: ἀπʼ οὐρανῶν
  choice: du ciel
  rationale: Bien que le grec emploie un pluriel, « du ciel » est la tournure française courante dans ce contexte céleste.
- source_word: ἐκ θρόνων βασιλείων
  choice: des trônes royaux
  rationale: Cette formulation conserve le pluriel du grec ainsi que l’imagerie royale, sans le réduire arbitrairement à un seul trône.
- source_word: ἀπότομος
  choice: implacable
  rationale: Dans son emploi avec πολεμιστής, l’adjectif évoque une force sévère, inflexible et sans ménagement. « Implacable » restitue cette intensité mieux que le littéral peu naturel « abrupt ».
- source_word: πολεμιστής
  choice: guerrier
  rationale: « Guerrier » est l’équivalent français naturel et digne qui préserve pleinement l’image militaire.
- source_word: εἰς μέσον
  choice: au milieu de
  rationale: Cette expression rend naturellement l’entrée au cœur d’un lieu tout en restant proche du grec.
- source_word: τῆς ὀλεθρίας γῆς
  choice: du pays voué à la destruction
  rationale: ὀλέθριος peut désigner ce qui cause la destruction ou ce qui y est voué. Le contexte du jugement favorise ici le second sens, tout en laissant cette nuance explicitement signalée.
- source_word: ἥλατο
  choice: a bondi… s’est élancée
  rationale: Le verbe exprime un saut ou un mouvement soudain. Le français requiert ici une articulation fluide des deux compléments d’origine ; la reprise « s’est élancée » explicite le mouvement vers le pays sans atténuer la vivacité de « a bondi ».
theological_decisions:
- issue: Faut-il traduire λόγος d’une manière qui mette au premier plan une interprétation christologique ultérieure ?
  choice: parole
  alternative: Parole
  rationale: Le contexte présente avec personnification la parole efficace de Dieu dans le jugement. La minuscule n’exclut pas une lecture typologique ou christologique, mais évite de l’imposer au-delà de ce que dit explicitement le grec.
- issue: Comment conserver la violence de l’image judiciaire et militaire ?
  choice: guerrier implacable
  alternative: guerrier sévère
  rationale: « Guerrier implacable » maintient la vigueur et la sévérité de l’image, sans aller jusqu’à « sans pitié », formulation qui ajouterait une précision morale non exigée par ἀπότομος.
- issue: Sens de ὀλεθρίας appliqué au pays
  choice: pays voué à la destruction
  alternative: pays destructeur
  rationale: Les deux valeurs sont lexicalement possibles. Dans le récit du jugement de l’Égypte, le pays frappé apparaît comme promis à la destruction ; ce choix contextuel est néanmoins signalé en note afin de préserver l’ambiguïté.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La ponctuation détache « guerrier implacable » comme une apposition, conformément au grec. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
