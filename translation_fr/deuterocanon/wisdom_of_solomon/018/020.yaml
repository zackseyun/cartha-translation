base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/020.yaml
  text: But the trial of death also touched the righteous[a], and a destruction of the multitude occurred in the wilderness[b]; yet the wrath did not remain for long.
translation:
  language: fr
  text: Mais l’épreuve de la mort atteignit aussi les justes[a], et une multitude fut écrasée dans le désert[b] ; pourtant, la colère ne dura pas longtemps.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’expérience de la mort » ou « une épreuve causée par la mort ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « un brisement d’une multitude eut lieu dans le désert » ; autre traduction possible : « une multitude fut détruite dans le désert ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἥψατο
  choice: atteignit
  rationale: Le verbe ἅπτομαι indique ici que l’épreuve toucha ou affecta les justes. « Atteignit » conserve cette idée sans impliquer nécessairement leur destruction totale.
- source_word: δικαίων
  choice: les justes
  rationale: Le substantif adjectival au pluriel désigne les personnes justes comme catégorie morale et religieuse ; « les justes » est naturel et traditionnel en français.
- source_word: πεῖρα θανάτου
  choice: l’épreuve de la mort
  rationale: πεῖρα peut désigner une épreuve, une mise à l’épreuve ou une expérience. La formule compacte « l’épreuve de la mort » préserve l’ambiguïté du rapport entre l’épreuve et la mort.
- source_word: θραῦσις
  choice: fut frappée
  rationale: Le nom évoque littéralement une rupture, un brisement ou un écrasement. La tournure verbale « une multitude fut frappée » rend naturellement en français une calamité collective tout en conservant l’image d’un coup destructeur.
- source_word: πλήθους
  choice: une multitude
  rationale: πλῆθος désigne un grand nombre ou une masse de personnes. « Une multitude » restitue le sens collectif sans identifier plus précisément le groupe.
- source_word: ἐν ἐρήμῳ
  choice: dans le désert
  rationale: Dans le contexte de l’Exode, « le désert » est l’expression française biblique courante pour ἔρημος.
- source_word: ὀργή
  choice: la colère
  rationale: Le contexte indique une colère liée au jugement divin, mais le grec n’explicite ni le possesseur ni un terme technique distinct ; « la colère » préserve cette retenue.
- source_word: οὐκ ἐπὶ πολὺ ἔμεινεν
  choice: ne dura pas longtemps
  rationale: Cette formulation idiomatique exprime clairement que la colère ne se prolongea pas.
theological_decisions:
- issue: Faut-il préciser que la colère est celle de Dieu ?
  choice: la colère
  alternative: la colère de Dieu ; sa colère
  rationale: Le contexte suggère fortement la colère divine, mais le grec porte seulement ἡ ὀργή, sans complément ni possessif. Le texte laisse donc le contexte fournir le référent.
- issue: Quel degré d’atteinte des justes exprime πεῖρα θανάτου ?
  choice: l’épreuve de la mort atteignit aussi les justes
  alternative: les justes firent eux aussi l’expérience de la mort ; l’épreuve mortelle s’abattit aussi sur les justes
  rationale: La formulation grecque affirme que les justes furent touchés par l’événement mortel sans dire explicitement qu’ils subirent tous la mort ou la même condamnation que la multitude. La traduction conserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme marqué. Les marqueurs [a] et [b] figurent dans le texte et correspondent exactement aux notes.
