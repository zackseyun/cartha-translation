  text: and another[a], cast down elsewhere, half-dead[b], made known the cause for which he was dying.
translation:
  language: fr
  text: et un autre, jeté ailleurs[a], à demi-mort, révélait la cause pour laquelle il mourait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un autre endroit ». L’adverbe grec signale un lieu différent de celui de l’exemple précédent.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλαχῇ
  choice: ailleurs
  rationale: L’adverbe indique un lieu différent de celui de l’exemple précédent. « Ailleurs » exprime naturellement et avec concision ce contraste spatial.
- source_word: ῥιφεὶς
  choice: jeté à terre
  rationale: Le participe évoque le fait d’être jeté ou projeté. « Jeté à terre » conserve l’image physique sans préciser l’agent ni transformer le geste en coup porté.
- source_word: ἡμίθνητος
  choice: à demi-mort
  rationale: Cette expression rend directement l’adjectif grec et décrit un homme encore vivant mais proche de la mort.
- source_word: διʼ ἣν ... αἰτίαν
  choice: la cause pour laquelle
  rationale: Cette formulation garde la valeur explicative et la relative associée à la cause précise de sa mort.
- source_word: ἔθνησκεν
  choice: il était en train de mourir
  rationale: L’imparfait grec présente la mort comme un processus en cours, et non comme un événement déjà achevé.
- source_word: ἐνεφάνιζεν
  choice: faisait connaître
  rationale: L’imparfait et le sens du verbe sont rendus par une action de manifestation ou de révélation en cours, dans un français clair.
theological_decisions:
- issue: Aspect narratif de la mort de la victime qui révèle la cause
  choice: « il était en train de mourir », pour conserver le processus en cours exprimé par l’imparfait ἔθνησκεν
  alternative: « il mourait » ou « il mourut »
  rationale: « Était en train de mourir » souligne sans ambiguïté que l’homme à demi-mort est encore vivant lorsqu’il fait connaître la cause. Il s’agit d’une décision grammaticale qui préserve l’immédiateté de la scène, sans ajout doctrinal.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la coordination avec le contexte précédent ainsi que les imparfaits narratifs. « À demi-mort » est plus soutenu que « à moitié mort » tout en restant immédiatement compréhensible.
