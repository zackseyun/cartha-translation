  verdict: revise
  source_fidelity: Le sens est globalement fidèle. Toutefois, « jeté à terre » ajoute plus précisément l’idée du sol, que ῥιφείς (« jeté, projeté ») n’exprime pas nécessairement. « Jeté ailleurs » rend à la fois le participe et l’adverbe ἀλλαχῇ sans cette précision supplémentaire. L’imparfait « mourait » préserve l’aspect duratif de ἔθνησκεν de façon plus idiomatique que la périphrase « était en train de mourir ».
  naturalness: La phrase révisée est plus fluide en français moderne. « Mourait » est naturel et conserve nettement l’action en cours. La minuscule initiale de « et » convient si le verset est présenté en continuité avec la phrase précédente.
  terminology: « À demi-mort » restitue bien ἡμίθνητος. « Révélait » rend naturellement ἐνεφάνιζεν, avec la nuance de divulgation. « La cause pour laquelle » respecte la construction explicative διʼ ἣν αἰτίαν, sans interprétation théologique ajoutée.
  issues:
