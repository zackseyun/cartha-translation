revisions:
- from: Alors qu’ils avaient décidé de tuer les nouveau-nés du peuple saint, et qu’un seul enfant, abandonné, avait été sauvé[a], tu leur as enlevé, pour les confondre, une multitude d’enfants, et tu les as fait périr tous ensemble dans des eaux impétueuses[b].
  to: Alors qu’ils avaient décidé de tuer les nouveau-nés du peuple saint, et qu’un seul enfant, mis à l’abandon, avait été sauvé[a], tu leur as enlevé une multitude d’enfants pour leur réprobation, et tu les as fait périr tous ensemble dans des eaux impétueuses[b].
  rationale: La révision précise le sens technique d’ἐκτεθέντος par « mis à l’abandon » et corrige la note correspondante en parlant de l’exposition de Moïse. Elle rend εἰς ἔλεγχον par « pour leur réprobation », qui exprime clairement le blâme/jugement sans imposer une interprétation doctrinale. Le reste de la formulation, y compris l’adresse à Dieu, l’ambiguïté préservée de « un seul enfant » et l’image des eaux impétueuses, est maintenu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T10:20:46Z'
