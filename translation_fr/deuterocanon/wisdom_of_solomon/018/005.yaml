base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/005.yaml
  text: When they had resolved to kill the infants of the holy ones[a], and one child had been exposed and rescued[b], you took away their multitude of children as a rebuke and destroyed them all together in mighty water.
translation:
  language: fr
  text: Alors qu’ils avaient décidé de tuer les nouveau-nés du peuple saint, et qu’un seul enfant, mis à l’abandon, avait été sauvé[a], tu leur as enlevé une multitude d’enfants pour leur réprobation, et tu les as fait périr tous ensemble dans des eaux impétueuses[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cet enfant est probablement Moïse, exposé sur le Nil puis gardé en vie (Exode 2.3-10).
    reason: cross_reference
  - marker: b
    text: 'Littéralement : « dans une eau puissante » ; on peut aussi comprendre « dans des eaux violentes » ou « déchaînées ». Il s’agit de la mer devenue l’instrument de leur destruction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλευσαμένους
  choice: avaient décidé
  rationale: Le participe exprime une décision délibérée. « Avaient décidé » est naturel en français et conserve l’intention préméditée.
- source_word: τὰ τῶν ὁσίων ... νήπια
  choice: les nouveau-nés du peuple saint
  rationale: Νήπια désigne de très jeunes enfants. Le collectif « peuple saint » rend ici les ὅσιοι comme le peuple consacré à Dieu, sans employer « saints » dans un sens ecclésial ultérieur.
- source_word: ἑνὸς ... τέκνου
  choice: un seul enfant
  rationale: Τέκνον ne précise pas le sexe. « Un seul » fait ressortir le contraste rhétorique avec la multitude d’enfants mentionnée ensuite.
- source_word: ἐκτεθέντος
  choice: abandonné
  rationale: Dans ce contexte, le verbe désigne l’exposition d’un enfant, c’est-à-dire le fait de le déposer et de l’abandonner. « Abandonné » communique immédiatement ce sens en français moderne.
- source_word: σωθέντος
  choice: avait été sauvé
  rationale: Le passif conserve la formulation grecque et désigne ici la préservation de l’enfant face au danger, sans préciser explicitement l’agent.
- source_word: εἰς ἔλεγχον
  choice: pour les confondre
  rationale: Ἔλεγχος comporte l’idée de mettre la faute en évidence par une réprimande ou un jugement. « Pour les confondre » préserve cette force morale et judiciaire sans réduire l’expression à un simple châtiment.
- source_word: ἀφεῖλον
  choice: tu leur as enlevé
  rationale: Le verbe exprime le retrait ou l’enlèvement. Le datif français « leur » rend explicite et naturel le rapport avec leurs enfants.
- source_word: πλῆθος τέκνων
  choice: une multitude d’enfants
  rationale: Πλῆθος souligne le grand nombre et maintient le contraste avec l’unique enfant sauvé.
- source_word: ὁμοθυμαδόν
  choice: tous ensemble
  rationale: Dans ce contexte, l’adverbe souligne le caractère collectif de la destruction.
- source_word: ἐν ὕδατι σφοδρῷ
  choice: dans des eaux impétueuses
  rationale: Σφοδρός évoque une force violente. Le pluriel « eaux », idiomatique en français pour la mer en mouvement, rend naturellement le singulier collectif grec.
theological_decisions:
- issue: Référent de l’unique enfant abandonné et sauvé
  choice: Conserver la désignation générale tout en signalant en note l’allusion probable à Moïse.
  alternative: Nommer directement Moïse dans le texte.
  rationale: Le récit évoque fortement Exode 2.3-10, mais le grec dit seulement « un enfant ». Le texte traduit garde donc cette généralité et la note fournit le rapprochement.
- issue: Sens de ὅσιοι
  choice: le peuple saint
  alternative: les saints ; les fidèles
  rationale: Dans ce contexte, le terme désigne collectivement le peuple consacré à Dieu. Cette formulation évite d’importer dans « saints » des associations confessionnelles postérieures tout en conservant l’idée de sainteté.
- issue: Portée de εἰς ἔλεγχον
  choice: pour les confondre
  alternative: pour les réprimander ; pour les châtier ; pour manifester leur culpabilité
  rationale: La traduction maintient ensemble la mise en évidence de la faute et la dimension judiciaire, sans trancher exclusivement en faveur d’une réprimande verbale ou d’un châtiment.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve l’adresse directe à Dieu et le contraste entre l’unique enfant sauvé et la multitude d’enfants enlevés. « Eaux impétueuses » garde la vigueur poétique du grec tout en restant naturel.
