revisions:
- from: Car ils méritaient d’être privés de lumière et emprisonnés dans les ténèbres, ceux qui avaient tenu tes fils enfermés, eux par qui l’impérissable lumière de la Loi devait être donnée au monde pour toujours.[a]
  to: Car ces hommes méritaient d’être privés de lumière et emprisonnés dans les ténèbres, eux qui avaient gardé tes fils enfermés, et par qui l’impérissable lumière de la Loi devait être donnée au monde[a].
  rationale: La révision évite de fusionner dans le texte principal les deux sens possibles de τῷ αἰῶνι. « Au monde » offre une formulation française naturelle; la note conserve explicitement l’alternative temporelle et la singularité du grec. La légère réorganisation de la relative améliore le rythme sans modifier les relations syntaxiques ni le sens.
