base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/004.yaml
  text: For those men were worthy to be deprived of light and imprisoned in darkness[a], they who had kept your sons shut in, through whom the imperishable light of the law was about to be given to the age.
translation:
  language: fr
  text: Car ces hommes méritaient d’être privés de lumière et emprisonnés dans les ténèbres, eux qui avaient gardé tes fils enfermés, et par qui l’impérissable lumière de la Loi devait être donnée au monde[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour toujours ». Littéralement : « à l’âge ». Le grec emploie un singulier qui peut avoir une portée cosmique ou temporelle.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄξιοι
  choice: méritaient
  rationale: Dans ce contexte de jugement, le terme exprime ce qu’ils méritaient, plutôt qu’une simple aptitude.
- source_word: στερηθῆναι φωτὸς
  choice: être privés de lumière
  rationale: Le passif conserve l’idée d’une privation punitive et le lien avec la plaie des ténèbres.
- source_word: φυλακισθῆναι σκότει
  choice: emprisonnés dans les ténèbres
  rationale: Cette formulation garde la force carcérale du verbe et le renversement qui répond à l’emprisonnement d’Israël.
- source_word: οἱ κατακλείστους φυλάξαντες
  choice: ceux qui avaient tenu … enfermés
  rationale: L’expression française rend naturellement l’action durable consistant à maintenir des personnes dans l’enfermement.
- source_word: τοὺς υἱούς σου
  choice: tes fils
  rationale: Le grec emploie explicitement le masculin pluriel et désigne ici Israël dans sa relation filiale avec Dieu.
- source_word: διʼ ὧν
  choice: eux par qui
  rationale: Le pronom relatif a pour antécédent grammatical le plus proche « tes fils » et exprime leur rôle dans la transmission de la Loi.
- source_word: ἤμελλεν ... δίδοσθαι
  choice: devait être donnée
  rationale: La tournure exprime un avenir prévu ou destiné depuis le point de vue du récit, sans imposer une imminence excessive.
- source_word: τὸ ἄφθαρτον νόμου φῶς
  choice: l’impérissable lumière de la Loi
  rationale: Cette traduction conserve la métaphore, le rapport génitif avec la Loi et l’idée de permanence portée par ἄφθαρτον.
- source_word: τῷ αἰῶνι
  choice: au monde pour toujours
  rationale: Dans ce contexte sapientiel, αἰών peut associer une portée cosmique (« au monde ») et temporelle (« pour toujours »). La traduction française les exprime ensemble, tandis que la note signale la littéralité et l’ambiguïté.
theological_decisions:
- issue: Référent de « tes fils » et médiation de la lumière de la Loi
  choice: « Tes fils » désigne Israël, par qui la lumière de la Loi devait être donnée.
  alternative: Comprendre plus librement « par lesquels » comme renvoyant aux événements de l’Exode.
  rationale: L’antécédent grammatical le plus proche de διʼ ὧν est τοὺς υἱούς σου. La formulation conserve cette relation personnelle sans développer davantage sa portée théologique.
- issue: Portée de αἰών
  choice: Exprimer ensemble les nuances cosmique et temporelle par « au monde pour toujours ».
  alternative: 'Traduire littéralement « à l’âge » ou ne retenir qu’une seule nuance : « au monde » / « pour toujours ».'
  rationale: Le nom singulier peut évoquer le monde ou la durée. Le français littéral « à l’âge » serait obscur; le texte principal reste naturel et la note préserve l’ambiguïté grecque.
translation_notes:
  register: Français international moderne, digne et accessible. « La Loi » reçoit une majuscule puisqu’il s’agit de la révélation divine confiée à Israël. Le rythme conserve le contraste entre l’enfermement imposé aux fils de Dieu et l’emprisonnement des oppresseurs dans les ténèbres.
