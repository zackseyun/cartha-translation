base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/002.yaml
  text: because, though they had been attacked before, they gave thanks that they were not being harmed[b][a], and they begged pardon for their hostility.
translation:
  language: fr
  text: car, bien qu’ils aient été attaqués auparavant, ils rendaient grâce de ne subir aucun mal[a] et demandaient pardon pour leur hostilité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec transmis est syntaxiquement difficile, surtout dans l’expression relative au fait de « ne pas faire de mal » ou de « ne pas subir de mal ». La traduction retient le sens qui paraît le plus probable dans le contexte.
    reason: textual_variant
  - marker: b
    text: 'Ou : « demandaient une faveur au sujet du conflit qui les avait opposés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὐ βλάπτοντιν
  choice: ils rendaient grâce de ne subir aucun mal
  rationale: La forme transmise est syntaxiquement irrégulière. Le verbe βλάπτω exprime l’idée de faire du mal ou de causer un tort. Dans le contexte, une lecture à valeur passive — ne subir aucun mal — donne le sens le plus cohérent, tout en nécessitant une note signalant l’incertitude.
- source_word: προπολεμημένοι
  choice: bien qu’ils aient été attaqués auparavant
  rationale: Le participe évoque une hostilité ou une attaque antérieure, avec la valeur temporelle du préfixe προ-. La tournure concessive rend intelligible le contraste avec la reconnaissance exprimée ensuite.
- source_word: εὐχαριστοῦσιν
  choice: ils rendaient grâce
  rationale: Cette expression française courante conserve la force verbale de l’action de remercier. L’imparfait harmonise naturellement la narration française avec ἐδέοντο.
- source_word: τὸ διενεχθῆναι
  choice: leur hostilité
  rationale: L’infinitif peut désigner le fait d’être en désaccord, en conflit ou brouillé. « Leur hostilité » convient au contexte de relations antérieurement conflictuelles, sans réduire le terme à une simple divergence d’opinion.
- source_word: χάριν ἐδέοντο
  choice: demandaient pardon
  rationale: L’expression signifie littéralement demander une faveur ou une grâce. Liée à l’hostilité passée, elle prend naturellement en français le sens de demander pardon, tout en laissant l’alternative plus littérale en note.
theological_decisions:
- issue: Traitement d’une proposition grecque syntaxiquement difficile
  choice: 'Rendre le sens contextuel probable : gratitude de ne subir aucun mal après des attaques antérieures, puis demande de pardon'
  alternative: « car ceux qui, attaqués auparavant, ne faisaient aucun mal rendaient grâce et demandaient une faveur au sujet de leur différend »
  rationale: Une traduction strictement calquée serait obscure et pourrait attribuer les actions aux mauvais participants. Le texte principal privilégie le sens narratif le plus vraisemblable, tandis que la note conserve honnêtement l’incertitude du témoin grec.
- issue: Portée de χάριν ἐδέοντο
  choice: « demandaient pardon »
  alternative: « demandaient une faveur au sujet de leur différend »
  rationale: Le pardon correspond bien à une requête concernant une hostilité passée, mais la formulation grecque reste plus large; l’autre possibilité est donc donnée en note plutôt qu’exclue.
translation_notes:
  register: Français international moderne, naturel et digne. « Rendaient grâce » garde une tonalité biblique accessible; « hostilité » exprime un conflit relationnel réel sans introduire de précision doctrinale étrangère au texte.
