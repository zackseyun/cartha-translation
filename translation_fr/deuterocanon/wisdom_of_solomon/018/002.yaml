  naturalness: « Car, bien qu’ils aient été attaqués auparavant, ils rendaient grâce de ne subir aucun mal » est naturel et intelligible en français biblique moderne. « Rendaient grâce » offre un registre digne et accessible. L’alternance entre le passé composé concessif et l’imparfait narratif est recevable et ne gêne pas la lecture.
