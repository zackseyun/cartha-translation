  text: But the discordant cry of enemies echoed back[a], and the pitiful lament for children being mourned was carried abroad.
translation:
  language: fr
  text: Mais le cri discordant des ennemis résonnait en écho, et les poignantes lamentations pour les enfants que l’on pleurait se propageaient.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et les poignantes lamentations d’enfants qui se lamentaient se propageaient ». Le participe grec θρηνουμένων peut se comprendre passivement (« enfants que l’on pleurait ») ou au moyen (« enfants qui se lamentaient »).'
    reason: ambiguïté grammaticale du participe moyen-passif θρηνουμένων
lexical_decisions:
- source_word: ἀντήχει
  choice: en retour, retentissait
  rationale: Le verbe évoque un son qui répond ou se répercute. Cette formulation conserve cette nuance sans employer une tournure artificielle en français.
- source_word: ἀσύμφωνος
  choice: discordant
  rationale: L’adjectif signifie littéralement « sans harmonie » ou « sans accord » et convient à la fois au bruit des cris et à leur charge émotionnelle.
- source_word: ἐχθρῶν
  choice: des ennemis
  rationale: Le génitif indique naturellement à qui appartient le cri. Le contexte désigne les Égyptiens hostiles, sans qu’il soit nécessaire de les nommer dans le verset.
- source_word: βοή
  choice: cri
  rationale: Dans ce contexte de deuil, « cri » exprime mieux la détresse que « clameur » ou « cri de guerre ».
- source_word: οἰκτρά
  choice: de poignantes lamentations
  rationale: Le neutre pluriel exprime ici le caractère pitoyable et douloureux de ce qui se faisait entendre. « Poignantes » rend le pathos avec naturel.
- source_word: διεφέρετο
  choice: se propageaient
  rationale: L’imparfait décrit un son porté et répandu d’un lieu à l’autre; le français emploie naturellement « se propager » pour des lamentations.
- source_word: θρηνουμένων
  choice: que l’on pleurait
  rationale: 'Le participe au moyen-passif peut être compris passivement avec παίδων : les enfants sont ceux que l’on pleure. La tournure impersonnelle évite d’ajouter un sujet absent du grec.'
- source_word: παίδων
  choice: enfants
  rationale: Le mot est plus large que « fils » ou « premiers-nés ». Même si le contexte concerne les premiers-nés, le verset lui-même dit « enfants ».
theological_decisions:
- issue: Faut-il préciser « premiers-nés » d’après le contexte?
  choice: enfants
  alternative: premiers-nés ou fils premiers-nés
  rationale: Le contexte évoque la mort des premiers-nés d’Égypte, mais παίδων reste général. La traduction ne resserre donc pas le sens au-delà du texte grec.
- issue: Qui accomplit l’action exprimée par θρηνουμένων?
  choice: les enfants sont pleurés
  alternative: les enfants se lamentent
  rationale: La lecture passive s’accorde bien au contexte de la mort des enfants, mais la forme grecque permet aussi une compréhension moyenne. Cette ambiguïté est signalée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, digne et accessible. L’inversion « en retour, retentissait » garde le mouvement sonore du grec tout en restant littéraire; le reste de la phrase privilégie une syntaxe claire et naturelle.
