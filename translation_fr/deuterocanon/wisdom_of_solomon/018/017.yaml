  text: Then at once terrifying dream-visions troubled them[a], and unexpected fears came upon them,
translation:
  language: fr
  text: Alors, sur-le-champ, de terrifiantes visions oniriques les bouleversèrent[a], et des peurs inattendues s’abattirent sur eux,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des apparitions de rêve » ou « des images oniriques ». Le grec φαντασίαι peut désigner des apparitions ou des images qui se présentent à l’esprit ; « visions oniriques » maintient le contexte des rêves sans préciser davantage leur nature.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε παραχρῆμα
  choice: Alors, sur-le-champ
  rationale: Rend à la fois la succession narrative marquée par τότε et l’immédiateté insistante de παραχρῆμα.
- source_word: φαντασίαι ὀνείρων
  choice: visions de rêves
  rationale: Préserve le rapport génitif et le caractère onirique des apparitions sans les identifier nécessairement à des fantômes réels.
- source_word: δεινῶς ἐτάραξαν
  choice: de terribles … bouleversèrent
  rationale: Transpose naturellement en français l’intensité de l’adverbe δεινῶς tout en gardant à ἐτάραξαν son sens de trouble profond.
- source_word: αὐτούς
  choice: les
  rationale: Pronom objet renvoyant aux personnes visées dans le contexte.
- source_word: φόβοι
  choice: des peurs
  rationale: Conserve le pluriel du grec, qui évoque des manifestations multiples de la peur.
- source_word: ἐπέστησαν
  choice: fondirent sur
  rationale: Exprime l’irruption soudaine et menaçante suggérée ici par le verbe, dans un français naturel.
- source_word: ἀδόκητοι
  choice: inattendues
  rationale: Rend directement l’idée de peurs imprévues, survenant contre toute attente.
