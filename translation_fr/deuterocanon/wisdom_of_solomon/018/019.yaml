  verdict: revise
  source_fidelity: La phrase rend correctement γάρ, les rêves qui troublent les victimes, l’annonce préalable, la finalité de ἵνα et l’ignorance de la cause. Toutefois, « ce qui arrivait » explicite et temporalise le démonstratif τοῦτο, alors que « cela » conserve mieux son renvoi contextuel non précisé. « Périssent » rend aussi ἀπόλωνται plus exactement et plus largement que « meurent ».
  naturalness: La formulation révisée est naturelle dans un français moderne et conserve le registre soutenu approprié à la Sagesse. « Souffraient si durement » exprime idiomatiquement la force de κακῶς sans le calque peu français « souffraient mal ».
  terminology: '« Rêves », « bouleversés », « annoncer d’avance », « périr » et « souffrir durement » sont adaptés au grec et au registre. La note b est ajustée : « subissent du mal » ne constitue pas un littéral suffisamment précis de κακῶς πάσχουσιν.'
