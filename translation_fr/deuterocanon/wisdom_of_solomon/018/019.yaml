    rationale: Le grec emploie le démonstratif « cela » sans préciser grammaticalement qu’il s’agit de ce qui était alors en train d’arriver. Cette explicitation réduit inutilement l’ouverture référentielle du texte.
  - severity: low
    issue: « meurent » pour ἀπόλωνται
    rationale: Dans ce contexte, la mort est pertinente, mais ἀπόλλυμι signifie plus largement « périr » ou « être détruit ». « Périssent » préserve mieux cette portée.
  - severity: low
