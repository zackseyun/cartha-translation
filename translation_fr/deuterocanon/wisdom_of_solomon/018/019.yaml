base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/019.yaml
  text: For the dreams that troubled them foretold this[b][a], so that they might not perish without knowing why they were suffering.
translation:
  language: fr
  text: Car les rêves qui les avaient bouleversés avaient annoncé cela d’avance[a], afin qu’ils ne périssent pas sans savoir pourquoi ils souffraient si durement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les avaient avertis de cela à l’avance ». Le verbe grec peut désigner une annonce préalable ayant valeur d’avertissement.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « à cause de quoi ils souffrent mal ». L’expression grecque désigne le fait de souffrir durement ou d’être cruellement affligé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ γὰρ ὄνειροι
  choice: Car les rêves
  rationale: Le pluriel articulé désigne naturellement les rêves liés au contexte; γάρ introduit l’explication par « Car ».
- source_word: θορυβήσαντες αὐτοὺς
  choice: qui les avaient bouleversés
  rationale: Le participe exprime une vive agitation. Le plus-que-parfait français situe naturellement cette action avant l’annonce et la souffrance évoquées.
- source_word: τοῦτο προεμήνυσαν
  choice: leur avaient annoncé d’avance ce qui arrivait[a]
  rationale: προμηνύω signifie annoncer, signaler ou avertir à l’avance. « Ce qui arrivait » explicite avec naturel le référent de τοῦτο sans définir davantage la nature de l’événement.
- source_word: ἵνα μὴ … ἀπόλωνται
  choice: afin qu’ils ne meurent pas
  rationale: La proposition en ἵνα exprime le plus naturellement un but. Dans ce contexte de mortalité, « mourir » rend clairement ἀπόλλυμι, tandis que « périr » resterait également possible.
- source_word: ἀγνοοῦντες
  choice: sans savoir
  rationale: Cette tournure adverbiale française rend la situation d’ignorance concomitante exprimée par le participe.
- source_word: διʼ ὃ κακῶς πάσχουσιν
  choice: pourquoi ils souffraient[b]
  rationale: διʼ ὃ indique la cause, rendue idiomatiquement par « pourquoi ». Le verbe « souffrir » exprime naturellement κακῶς πάσχειν en français, sans l’adverbe peu naturel « mal ».
theological_decisions:
- issue: Finalité des rêves inquiétants
  choice: Les rêves constituent une annonce préalable destinée à empêcher que les personnes frappées meurent sans comprendre la cause de leur souffrance.
  alternative: La proposition pourrait être comprise plus souplement comme exprimant le résultat produit par les rêves plutôt qu’un dessein.
  rationale: ἵνα introduit ici le plus naturellement une finalité. La traduction maintient la tension du texte entre la sévérité de l’épreuve et l’annonce préalable qui évite une mort dans l’ignorance.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le lien explicatif, l’antériorité des rêves et la valeur finale de ἵνα, tout en évitant un calque maladroit de κακῶς πάσχουσιν.
