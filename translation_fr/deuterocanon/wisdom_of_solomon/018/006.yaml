base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/006.yaml
  text: That night was made known beforehand to our fathers[a], so that, knowing with certainty the oaths in which they had trusted[c][b], they might be encouraged.
translation:
  language: fr
  text: Cette nuit-là avait été annoncée d’avance à nos pères[a], afin que, connaissant avec certitude les serments auxquels ils avaient fait confiance, ils prennent courage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avait été connue d’avance par nos pères ». Le verbe grec permet cette traduction plus littérale ; dans le contexte, il signifie probablement que cette nuit leur avait été révélée à l’avance. « Nos ancêtres » est aussi possible pour « nos pères ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκείνη ἡ νύξ
  choice: Cette nuit-là
  rationale: Rend naturellement en français la valeur déictique du démonstratif grec, sans emphase excessive.
- source_word: προεγνώσθη
  choice: avait été annoncée d’avance
  rationale: Dans ce contexte, le passif désigne vraisemblablement une révélation préalable de la nuit aux pères. Le plus-que-parfait marque son antériorité par rapport à leur assurance et à leur courage.
- source_word: πατράσιν ἡμῶν
  choice: à nos pères
  rationale: Traduction directe du masculin pluriel grec, qui désigne ici les pères d’Israël; «ancêtres» reste une possibilité sémantique.
- source_word: ἀσφαλῶς εἰδότες
  choice: sachant avec certitude
  rationale: Conserve à la fois l’idée de connaissance et celle d’assurance exprimée par l’adverbe.
- source_word: οἷς ἐπίστευσαν ὅρκοις
  choice: à quels serments ils avaient fait confiance
  rationale: Respecte l’association du datif relatif à ὅρκοις et la confiance exprimée par ἐπίστευσαν, sans expliciter l’auteur des serments.
- source_word: ἐπευθυμήσωσιν
  choice: ils prennent courage
  rationale: Expression française naturelle qui rend l’idée de reprendre confiance ou de s’affermir intérieurement.
theological_decisions:
- issue: Référent des «serments»
  choice: Conserver le terme général «serments» sans nommer explicitement Dieu ni développer leur contenu.
  alternative: «promesses faites sous serment» ou «promesses jurées»
  rationale: Le contexte suggère les engagements divins liés à la délivrance, mais le verset lui-même dit seulement «serments»; la formulation retenue préserve cette sobriété.
- issue: Sens de προεγνώσθη
  choice: Comprendre le passif comme une annonce ou révélation préalable faite aux pères.
  alternative: «avait été connue d’avance par nos pères»
  rationale: La construction et le contexte favorisent l’idée que la nuit leur avait été révélée, tout en laissant dans une note l’autre analyse grammaticalement possible.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la structure logique du grec tout en évitant une tournure artificielle; «prendre courage» est idiomatique et conserve la force exhortative du dernier verbe.
