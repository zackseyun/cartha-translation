  terminology: « Pratiques magiques », « premiers-nés », « reconnurent » et « fils de Dieu » sont appropriés. L’absence d’article dans « fils de Dieu » préserve utilement le prédicat qualitatif et la référence collective, sans en faire un titre individuel.
