base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/013.yaml
  text: For though they had disbelieved everything because of their sorceries[b][a], at the destruction of the firstborn they acknowledged that this people was God's son.
translation:
  language: fr
  text: Car, bien qu’ils eussent refusé de croire à tout à cause de leurs pratiques magiques[a], au moment de la destruction des premiers-nés, ils reconnurent que ce peuple était fils de Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs pratiques occultes » ou « leurs sortilèges ». Le terme grec désigne ici les arts magiques associés à l’Égypte.
    reason: lexical_alternative
  - marker: b
    text: C’est collectivement qu’Israël est ici reconnu comme fils de Dieu ; l’expression ne désigne pas un individu.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπιστοῦντες
  choice: après avoir refusé de croire
  rationale: Le participe exprime ici une incrédulité persistante et active, non un simple doute. La tournure française rend aussi naturellement son rapport antérieur à la reconnaissance finale.
- source_word: φαρμακείας
  choice: pratiques magiques
  rationale: Dans le contexte égyptien, le terme désigne des pratiques occultes ou magiques, et non l’usage de remèdes. « Pratiques magiques » est clair en français moderne sans connotation inutilement folklorique.
- source_word: ὀλέθρῳ
  choice: anéantissement
  rationale: Le nom désigne une destruction catastrophique. Avec « au moment de », la traduction rend la valeur circonstancielle de ἐπὶ τῷ sans ajouter une image absente du grec.
- source_word: πρωτοτόκων
  choice: premiers-nés
  rationale: Le grec porte l’article mais aucun possessif. Le contexte identifie les premiers-nés d’Égypte, tandis que la traduction conserve l’absence de possessif.
- source_word: ὡμολόγησαν
  choice: reconnurent
  rationale: Le verbe indique une admission ouverte imposée par les événements. « Reconnurent » convient mieux ici que « confessèrent », qui pourrait suggérer un acte religieux plus précis.
- source_word: θεοῦ υἱὸν
  choice: fils de Dieu
  rationale: La formulation sans article préserve au mieux en français la qualité filiale attribuée collectivement au peuple, sans transformer explicitement l’expression en titre individuel ni suggérer plusieurs fils divins.
- source_word: λαὸν
  choice: ce peuple
  rationale: Le démonstratif, bien qu’implicite plutôt qu’exprimé lexicalement, identifie naturellement en français le peuple dont il est question dans le récit, à savoir Israël.
theological_decisions:
- issue: La filiation collective d’Israël
  choice: ce peuple était fils de Dieu
  alternative: ce peuple était le fils de Dieu
  rationale: Le grec emploie le singulier υἱόν avec le singulier collectif λαόν. La traduction maintient donc l’image d’Israël comme fils collectif de Dieu, tout en évitant que l’article défini français fasse automatiquement entendre un titre individuel.
translation_notes:
  register: Français international moderne, clair et soutenu. La phrase conserve la relation concessive et temporelle du grec ainsi que la tension de l’expression singulière « fils de Dieu » appliquée à un peuple.
