  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/021.yaml
  text: For a blameless man hurried forward and fought in the front line[a], bringing the weapon of his own service—prayer and atonement by incense; he stood against the wrath and put an end to the disaster[b], showing that he is your servant.
translation:
  language: fr
  text: 'Car un homme irréprochable se hâta de combattre au premier rang[a], apportant l’arme de son propre service : la prière et l’expiation par l’encens[b]. Il résista à la colère et mit fin au malheur, montrant ainsi qu’il est ton serviteur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se porta en avant pour combattre ». Le verbe grec évoque un combat mené au premier rang.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le rite d’expiation par l’encens ». Le terme grec peut désigner, dans un contexte cultuel, l’expiation ou l’acte qui détourne la colère.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπεύσας
  choice: se hâta
  rationale: Le participe aoriste exprime la promptitude et l’urgence de l’intervention.
- source_word: ἀνὴρ ἄμεμπτος
  choice: un homme irréprochable
  rationale: Cette expression conserve le masculin singulier et l’idée d’une personne à qui aucun reproche ne peut être fait.
- source_word: προεμάχησεν
  choice: combattre au premier rang
  rationale: Le verbe porte une image militaire et évoque le fait de combattre en avant des autres.
- source_word: τὸ τῆς ἰδίας λειτουργίας ὅπλον
  choice: l’arme de son propre service
  rationale: « Arme » maintient la métaphore militaire, tandis que « service » reste assez large pour désigner ici la fonction cultuelle sans ajouter explicitement « sacerdotal ».
- source_word: προσευχὴν καὶ θυμιάματος ἐξιλασμόν
  choice: la prière et l’expiation par l’encens
  rationale: La formulation présente ces deux réalités comme l’arme apportée; « expiation » conserve la portée cultuelle de ἐξιλασμός sans préciser excessivement son mécanisme.
- source_word: ἀντέστη τῷ θυμῷ
  choice: il résista à la colère
  rationale: La traduction garde l’opposition vigoureuse exprimée par ἀντέστη et n’ajoute pas « de Dieu », qui demeure implicite dans le grec.
- source_word: πέρας ἐπέθηκε τῇ συμφορᾷ
  choice: mit fin au malheur
  rationale: Expression française naturelle qui rend l’idée d’imposer un terme à la calamité.
- source_word: θεράπων
  choice: serviteur
  rationale: Terme français naturel et digne pour une personne attachée au service de Dieu; il évite de surcharger la nuance par un titre plus technique.
theological_decisions:
- issue: Portée cultuelle de ἐξιλασμός
  choice: expiation
  alternative: rite d’expiation; apaisement
  rationale: « Expiation » conserve la gravité théologique et la fonction cultuelle du geste, sans imposer la notion plus précise de propitiation.
- issue: Référent de θυμός
  choice: la colère
  alternative: la fureur; la colère de Dieu
  rationale: Le contexte indique une colère divine, mais le texte grec ne nomme pas explicitement Dieu à cet endroit; la traduction préserve cette implicitation.
- issue: Nature du service désigné par λειτουργία
  choice: service
  alternative: ministère; service sacerdotal
  rationale: Le contexte de la prière et de l’encens fait comprendre la fonction cultuelle, sans qu’il soit nécessaire d’ajouter « sacerdotal » dans le corps du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La structure conserve la métaphore militaire qui unit « combattre », « arme » et « résista », tout en maintenant le vocabulaire cultuel de la prière, du service et de l’encens.
