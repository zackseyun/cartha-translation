base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/022.yaml
  text: He overcame the multitude not by strength of body, nor by the force of weapons, but by a word he subdued the punisher, reminding him of the oaths to the fathers and the covenants.
translation:
  language: fr
  text: Il triompha de la multitude, non par la force physique ni par la puissance des armes, mais il soumit, par une parole, celui qui punissait[a], en lui rappelant les serments des pères[b] et les alliances.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui qui infligeait le châtiment ». Le grec ne précise pas s’il s’agit de Dieu, d’un ange destructeur ou de la puissance de jugement personnifiée.
    reason: alternative_reading
  - marker: b
    text: Le grec peut aussi s’entendre comme « les serments faits aux pères », c’est-à-dire les promesses jurées aux patriarches.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνίκησεν
  choice: Il triompha de
  rationale: Le verbe exprime le fait de vaincre ou de l’emporter. « Triompha de » conserve l’image de la victoire sans suggérer nécessairement une mise à mort.
- source_word: τὸν ὄχλον
  choice: la multitude
  rationale: ὄχλος désigne une foule ou une multitude. Le terme français garde le sens collectif large et la formulation inhabituelle du grec.
- source_word: οὐκ ἰσχύι τοῦ σώματος
  choice: non par la force physique
  rationale: Le datif indique le moyen. Cette expression naturelle rend littéralement l’opposition entre la vigueur corporelle, les armes et la parole.
- source_word: οὐχ ὅπλων ἐνεργείᾳ
  choice: ni par la puissance des armes
  rationale: ἐνέργεια désigne ici la puissance agissante ou l’efficacité. « Puissance des armes » préserve le contraste instrumental.
- source_word: ἀλλὰ λόγῳ
  choice: mais par une parole
  rationale: λόγος peut signifier parole, discours ou propos. « Une parole » conserve la brièveté du grec et n’explicite pas indûment l’intercession.
- source_word: τὸν κολάζοντα
  choice: celui qui punissait
  rationale: Le participe présent substantivé désigne l’agent qui infligeait le châtiment sans l’identifier. Cette traduction préserve à la fois l’aspect en cours et l’ambiguïté du référent.
- source_word: ὑπέταξεν
  choice: il soumit
  rationale: ὑποτάσσω signifie assujettir ou placer sous contrôle. « Soumit » maintient la force de l’image sans préciser la nature de cet assujettissement.
- source_word: ὅρκους πατέρων
  choice: les serments faits aux pères
  rationale: Le génitif πατέρων peut être compris de plusieurs façons. Dans le contexte d’engagements d’alliance, « faits aux pères » rend explicitement la direction probable des serments, tout en signalant l’autre lecture en note.
- source_word: καὶ διαθήκας
  choice: et les alliances
  rationale: Dans le grec biblique, διαθήκη désigne couramment une alliance. Le pluriel du texte source est conservé.
- source_word: ὑπομνήσας
  choice: en lui rappelant
  rationale: Le participe aoriste indique le moyen ou une circonstance associée. Le pronom explicite l’objet implicite requis par le français sans identifier davantage le destinataire.
theological_decisions:
- issue: Identité de « celui qui punissait » et destinataire du rappel
  choice: Conserver « celui qui punissait » et employer le pronom « lui », sans identifier le référent.
  alternative: Dieu, un ange destructeur ou la puissance de jugement personnifiée.
  rationale: Le grec présente un participe substantivé sans nommer l’agent. Le contexte permet plusieurs identifications, mais le verset ne tranche pas.
- issue: Sens de λόγῳ
  choice: par une parole
  alternative: par son discours ; par son intercession ; par la raison
  rationale: Le contexte oppose la force corporelle et les armes à une intervention verbale. La traduction retenue conserve cette concision et évite une paraphrase théologique.
- issue: Relation exprimée par ὅρκους πατέρων
  choice: les serments faits aux pères
  alternative: les serments des pères
  rationale: Le génitif grec est formellement susceptible d’être rendu par « des pères », mais le contexte des engagements divins envers les patriarches favorise le sens objectif ou relationnel. Une note maintient l’ambiguïté grammaticale.
translation_notes:
  register: Français moderne, digne et accessible. La structure antithétique du grec est conservée. Les termes « multitude », « parole », « soumit » et « alliances » maintiennent la densité du texte source, tandis que les notes préservent les ambiguïtés portant sur l’agent du châtiment et le génitif « des pères ».
