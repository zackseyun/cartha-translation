  text: For even when a terrible fury of wild beasts came upon them[a], and they were being destroyed by the bites of crooked serpents, your wrath did not remain to the end;
translation:
  language: fr
  text: Car même lorsqu’une terrible fureur de bêtes sauvages s’abattit sur eux et qu’ils périssaient sous les morsures de serpents sinueux[a], ta colère ne dura pas jusqu’à la fin ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serpents tortueux » ou « serpents qui ondulent ». L’adjectif grec signifie littéralement « courbé » ou « tortueux » ; ici, il décrit probablement leur forme sinueuse plutôt qu’une qualité morale.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεινὸς
  choice: terrible
  rationale: « Terrible » exprime naturellement l’intensité redoutable de l’assaut sans amplifier le grec.
- source_word: θηρίων θυμός
  choice: fureur de bêtes sauvages
  rationale: θηρίων désigne des bêtes sauvages et θυμός leur violence déchaînée ; « fureur » convient au registre solennel du passage.
- source_word: ἐπῆλθεν
  choice: s’abattit sur eux
  rationale: Cette tournure française rend avec naturel l’idée d’un fléau ou d’un assaut qui survient et frappe des personnes.
- source_word: δήγμασίν
  choice: morsures
  rationale: Le terme grec désigne directement les blessures infligées en mordant.
- source_word: σκολιῶν ὄφεων
  choice: serpents sinueux
  rationale: σκολιός signifie littéralement « courbé » ou « tortueux » ; « sinueux » évoque ici la forme et le mouvement des serpents sans introduire une connotation morale.
- source_word: διεφθείροντο
  choice: ils périssaient
  rationale: L’imparfait passif décrit un processus destructeur en cours ; « périssaient » en restitue la gravité dans un français naturel.
- source_word: οὐ μέχρι τέλους ἔμεινεν
  choice: ne dura pas jusqu’au bout
  rationale: Cette formulation conserve la limite temporelle exprimée par le grec sans la transformer en conclusion interprétative sur la nature du châtiment.
- source_word: ἡ ὀργή σου
  choice: ta colère
  rationale: « Colère » est le terme français courant et digne pour la forte indignation divine exprimée par ὀργή.
theological_decisions:
- issue: Le jugement divin est présenté comme temporaire dans cet épisode
  choice: ta colère ne dura pas jusqu’au bout
  alternative: ta colère ne se prolongea pas indéfiniment
  rationale: Le grec affirme que la colère de Dieu ne demeura pas « jusqu’au bout ». La traduction maintient ensemble la réalité de cette colère et sa durée limitée dans cet épisode, sans paraphraser le verset en affirmation doctrinale plus générale.
translation_notes:
  register: Français international moderne, naturel et digne. « S’abattit » et « périssaient » rendent l’assaut et son effet continu sans lourdeur passive. Le point-virgule final respecte le lien syntaxique avec le verset suivant.
