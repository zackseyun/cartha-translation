base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/026.yaml
  text: so that your children[a], whom you loved, might learn, O Lord, that it is not the produce of crops that nourishes a man[b], but your word preserves those who trust in you.
translation:
  language: fr
  text: afin que tes fils[a], que tu as aimés, apprennent, Seigneur, que ce ne sont pas les produits des récoltes qui nourrissent l’être humain, mais que c’est ta parole[c] qui maintient en vie ceux qui mettent leur confiance en toi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes enfants ». Le grec dit littéralement « tes fils », expression qui peut désigner ici les membres du peuple aimé de Dieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « ceux qui te croient ». Le participe grec peut exprimer aussi bien la confiance placée en Dieu que le fait de croire Dieu.
    reason: lexical_alternative
  - marker: c
    text: 'Cette affirmation fait probablement écho à Deutéronome 8.3 : la vie humaine ne dépend pas seulement de la nourriture, mais de la parole de Dieu.'
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα μάθωσιν
  choice: afin que … apprennent
  rationale: La construction ἵνα avec le subjonctif exprime ici le but. Cette tournure française en conserve clairement la valeur.
- source_word: οἱ υἱοί σου
  choice: tes fils
  rationale: Le grec emploie explicitement le masculin pluriel υἱοί. « Tes fils » le restitue sans neutraliser la formulation; une solution contextuellement inclusive est signalée en note.
- source_word: οὓς ἠγάπησας
  choice: que tu as aimés
  rationale: Le passé composé rend naturellement l’aoriste français tout en conservant l’affirmation directe de l’amour de Dieu.
- source_word: Κύριε
  choice: Seigneur
  rationale: Le vocatif est rendu par une apostrophe directe, digne et naturelle en français moderne.
- source_word: αἱ γενέσεις τῶν καρπῶν
  choice: les produits des récoltes
  rationale: γενέσεις désigne ici ce qui est produit ou engendré, et καρποί les produits agricoles. La formulation évite de restreindre le sens aux seuls fruits des arbres.
- source_word: τρέφουσιν ἄνθρωπον
  choice: nourrissent l’être humain
  rationale: τρέφω signifie nourrir ou alimenter. Le singulier générique ἄνθρωπον vise ici l’être humain en général; cette formulation française en garde la portée représentative sans suggérer exclusivement un homme de sexe masculin.
- source_word: τὸ ῥῆμά σου
  choice: ta parole
  rationale: ῥῆμα désigne une parole ou ce qui est prononcé. « Ta parole » est naturel et conserve l’écho scripturaire probable sans développer le texte.
- source_word: τοὺς σοὶ πιστεύοντας
  choice: ceux qui mettent leur confiance en toi
  rationale: Avec le datif, πιστεύω peut exprimer la confiance placée en quelqu’un ou le fait de le croire. La traduction retient la confiance personnelle tout en signalant l’autre nuance en note.
- source_word: διατηρεῖ
  choice: maintient en vie
  rationale: διατηρέω signifie préserver, conserver ou garder en vie. Dans le contraste avec la nourriture, « maintient en vie » exprime clairement la force du verbe sans en réduire le sujet à une simple alimentation.
theological_decisions:
- issue: Allusion probable à Deutéronome 8.3
  choice: 'Conserver la formulation propre à la Sagesse: « ta parole maintient en vie »'
  alternative: Développer la phrase selon « l’être humain ne vit pas seulement de pain »
  rationale: Le grec fait vraisemblablement écho au Deutéronome, mais ne le cite pas intégralement. La traduction préserve cette résonance sans harmoniser ni compléter le texte.
- issue: Portée de οἱ υἱοί σου
  choice: tes fils
  alternative: tes enfants
  rationale: Le masculin lexical du grec est conservé dans le texte. La note indique la possibilité de comprendre le groupe comme l’ensemble des membres du peuple aimé de Dieu, sans imposer cette interprétation dans la traduction.
- issue: Sens de πιστεύω avec le datif
  choice: mettre sa confiance en Dieu
  alternative: croire Dieu
  rationale: Le contexte de préservation divine favorise l’idée d’une confiance qui s’appuie sur Dieu. La possibilité d’une réponse de foi à sa parole demeure explicitement signalée.
translation_notes:
  register: Français international moderne, clair et digne. L’adresse « Seigneur » conserve le ton de prière sans archaïsme. La syntaxe suit étroitement le contraste grec entre les produits agricoles et la parole divine, tout en restant naturelle à l’oral comme à l’écrit.
