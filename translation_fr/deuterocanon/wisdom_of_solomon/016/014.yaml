base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/014.yaml
  text: But a man kills by his own wickedness[a], and when a spirit has gone out, he does not bring it back, nor does he release a soul that has been taken.
translation:
  language: fr
  text: Mais l’être humain tue par sa méchanceté ; il ne fait pas revenir l’esprit qui est sorti et ne libère pas non plus l’âme qui a été prise.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il ne fait pas revenir le souffle vital qui est sorti et ne libère pas non plus la vie qui a été emportée ». Les mots grecs traduits par « esprit » et « âme » peuvent aussi désigner, selon le contexte, le souffle vital et la vie.'
    reason: Alternative lexicale préservant l’étendue de sens de πνεῦμα et ψυχή.
lexical_decisions:
- source_word: ἄνθρωπος
  choice: l’être humain
  rationale: Le nom est ici générique et met la capacité humaine en contraste avec la puissance de Dieu dans le contexte. « L’être humain » rend ce sens sans introduire une distinction de sexe absente du propos.
- source_word: ἀποκτέννει
  choice: tue
  rationale: Le verbe désigne directement l’action de tuer ; ce choix simple et naturel convient au contraste avec l’impossibilité de rendre la vie.
- source_word: τῇ κακίᾳ αὐτοῦ
  choice: par sa méchanceté
  rationale: κακία exprime ici le mal moral ou la méchanceté. La préposition « par » conserve la valeur instrumentale du datif.
- source_word: ἐξελθὸν ... πνεῦμα
  choice: une fois l’esprit sorti
  rationale: πνεῦμα peut désigner l’esprit ou le souffle vital. « Esprit » maintient dans le texte principal la largeur anthropologique du grec, tandis que l’autre possibilité est signalée en note.
- source_word: οὐκ ἀναστρέφει
  choice: il ne le fait pas revenir
  rationale: La formulation rend naturellement l’idée de ramener ce qui est sorti, avec « le » renvoyant à l’esprit.
- source_word: οὐδὲ ἀναλύει
  choice: ne libère pas non plus
  rationale: ἀναλύω porte ici l’idée de délier ou de libérer. « Pas non plus » reproduit la coordination négative de οὐδέ.
- source_word: ψυχὴν παραλημφθεῖσαν
  choice: l’âme qui a été enlevée
  rationale: ψυχή peut signifier « âme » ou « vie », et le participe indique qu’elle a été prise ou emportée. Le choix principal conserve le terme anthropologique distinct, sans exclure le sens concret précisé en note.
theological_decisions:
- issue: Sens de πνεῦμα et ψυχή dans le contexte de la mort
  choice: Traduire πνεῦμα par « esprit » et ψυχή par « âme » dans le texte principal.
  alternative: Traduire par « souffle vital » et « vie » respectivement.
  rationale: Le grec emploie deux termes distincts dont les champs de sens se recoupent sans se confondre entièrement. Les conserver dans le texte principal préserve cette texture et évite de trancher une question anthropologique que le verset ne développe pas ; la note fournit la lecture plus concrète liée à la mort.
translation_notes:
  register: Français international moderne, sobre et digne. La structure oppose directement le pouvoir humain de tuer à son incapacité de renverser la mort. Le point-virgule évite une formulation lourde tout en maintenant ce contraste.
