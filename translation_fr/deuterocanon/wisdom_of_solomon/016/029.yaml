base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/029.yaml
  text: For the hope of the ungrateful will melt like wintry frost[c][b][a], and will run off like useless water.
translation:
  language: fr
  text: Car l’espérance de l’ingrat fondra comme le givre d’hiver et s’écoulera comme une eau inutile.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « s’en ira comme une eau qui ne sert à rien ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀχάριστου
  choice: de l’ingrat
  rationale: L’adjectif au génitif singulier est employé comme un substantif. « L’ingrat » exprime clairement en français moderne la caractérisation morale de celui qui manque de reconnaissance.
- source_word: ἐλπὶς
  choice: l’espérance
  rationale: « Espérance » rend le sens courant du nom grec et convient au registre sapientiel, où il s’agit d’une attente confiante vouée ici à disparaître.
- source_word: χειμέριος πάχνη
  choice: le givre d’hiver
  rationale: « Givre » rend précisément πάχνη, tandis que « d’hiver » conserve simplement la détermination saisonnière χειμέριος.
- source_word: τακήσεται
  choice: fondra
  rationale: Le futur exprime ici la fonte et la disparition; « fondra » est direct, naturel et préserve l’image.
- source_word: ῥυήσεται
  choice: s’écoulera
  rationale: Le verbe décrit un liquide qui coule ou s’écoule. Le pronominal français restitue naturellement le mouvement de l’eau qui disparaît.
- source_word: ὕδωρ ἄχρηστον
  choice: une eau inutile
  rationale: La formulation reste proche du grec et conserve l’idée d’une eau sans utilité, sans préciser pourquoi elle ne sert à rien.
theological_decisions:
- issue: Caractérisation morale exprimée par ἀχάριστου
  choice: de l’ingrat
  alternative: de celui qui est sans reconnaissance
  rationale: « L’ingrat » préserve la portée morale du grec de façon concise, sans ajouter de qualification doctrinale.
- issue: Nature de l’ἐλπίς condamnée
  choice: l’espérance
  alternative: l’attente
  rationale: Le texte affirme la disparition de l’espérance de l’ingrat sans expliciter son objet ni trancher entre confiance subjective et attente; le terme général « espérance » maintient cette ouverture.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve les deux images successives du grec ainsi que leur parallélisme, avec un vocabulaire accessible.
