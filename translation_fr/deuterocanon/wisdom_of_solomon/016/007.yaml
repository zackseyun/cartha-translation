base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/007.yaml
  text: For the one who turned was saved not by what was seen[a], but by you[b], the Savior of all.
translation:
  language: fr
  text: Car celui qui s’était tourné n’était pas sauvé par ce qui était contemplé[a], mais par toi, le Sauveur de tous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par ce qui était regardé ». Le grec désigne l’objet contemplé, sans le présenter comme la cause du salut.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le Sauveur de tout ». Le grec a une portée générale et ne précise pas ici s’il s’agit de toutes les personnes ou de toutes choses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστραφεὶς
  choice: celui qui se tournait vers ce signe
  rationale: Le participe aoriste substantivé désigne la personne qui se tournait vers le signe établi dans le contexte. L’ajout explicatif « vers ce signe » rend la direction naturelle en français sans donner au verbe le sens plus précis de « se repentir ».
- source_word: τὸ θεωρούμενον
  choice: ce qu’il contemplait
  rationale: Le participe présent passif substantivé désigne l’objet regardé. Cette formulation française est naturelle et maintient le contraste entre l’objet visible et Dieu, véritable auteur du salut.
- source_word: ἐσώζετο
  choice: n’était pas sauvé
  rationale: L’imparfait passif est conservé par l’imparfait français; « sauver » correspond aussi directement au titre σωτήρ dans la seconde proposition.
- source_word: σωτῆρα
  choice: Sauveur
  rationale: Ce titre désigne Dieu comme la source véritable du salut et maintient le lien lexical avec « sauvé ».
- source_word: πάντων
  choice: de tous
  rationale: La formule conserve la portée large et indéterminée du génitif pluriel grec, sans la restreindre aux seuls êtres humains ni l’interpréter comme affirmant le salut universel.
theological_decisions:
- issue: Contraste causal entre le signe visible et Dieu
  choice: L’objet contemplé ne sauvait pas lui-même; le salut venait de Dieu.
  alternative: Le signe était un moyen instrumental par lequel Dieu sauvait.
  rationale: La construction οὐ διὰ… ἀλλὰ διὰ oppose explicitement l’objet regardé à Dieu. La traduction maintient cette opposition sans nier le rôle narratif du signe.
- issue: Portée de πάντων dans le titre divin
  choice: le Sauveur de tous
  alternative: le Sauveur de tout / de tous les êtres humains
  rationale: « De tous » préserve l’ampleur et l’ambiguïté référentielle du grec, sans imposer une conclusion doctrinale plus précise.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise « sauvé / Sauveur » reflète le lien σῴζω / σωτήρ. « Ce signe » explicite sobrement le référent contextuel du mouvement sans identifier davantage l’objet dans le corps du verset.
