base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/002.yaml
  text: Instead of this punishment[a], you did good to your people; for a strange craving of appetite[b], you prepared quail as food for them.
translation:
  language: fr
  text: 'Au lieu de ce châtiment[a], tu as fait du bien à ton peuple : pour satisfaire son désir d’une saveur inhabituelle[b], tu lui as préparé des cailles comme nourriture.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « À la place de ce châtiment » ou « En contraste avec ce châtiment ».'
    reason: lexical_alternative
  - marker: b
    text: Littéralement, le grec, très condensé, associe « désir », « appétit » et « goût » pour souligner l’envie d’une nourriture sortant de l’ordinaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθʼ ἧς κολάσεως
  choice: Au lieu de ce châtiment
  rationale: ἀντί avec le génitif marque ici le contraste, voire la substitution, entre le châtiment infligé aux adversaires et le bien accordé au peuple de Dieu.
- source_word: εὐεργετήσας τὸν λαόν σου
  choice: tu as fait du bien à ton peuple
  rationale: Cette formulation rend directement l’idée de bienfait exprimée par εὐεργετέω, dans un français courant, sans ajouter la nuance religieuse particulière que pourrait suggérer « béni ».
- source_word: εἰς ἐπιθυμίαν ὀρέξεως ξένην γεῦσιν
  choice: pour satisfaire son désir d’une saveur inhabituelle
  rationale: La construction grecque est très condensée et accumule les notions de désir, d’appétit et de goût. La formulation française en restitue le sens alimentaire et l’intensité sans reproduire une tournure obscure.
- source_word: τροφὴν ἡτοίμασας ὀρτυγομήτραν
  choice: tu lui as préparé des cailles comme nourriture
  rationale: ὀρτυγομήτρα désigne la caille; le pluriel français convient naturellement au récit de la nourriture fournie au peuple. Le pronom « lui » explicite le bénéficiaire déjà nommé.
theological_decisions:
- issue: Contraste entre le châtiment des adversaires et le bienfait accordé au peuple
  choice: « Au lieu de ce châtiment » souligne le contraste exprimé par ἀνθʼ ἧς.
  alternative: « En contrepartie de ce châtiment » ou « à la place de ce châtiment »
  rationale: Le contexte et la syntaxe favorisent un contraste entre deux traitements, sans imposer une explication doctrinale supplémentaire de leur rapport.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement de Dieu est conservé. La syntaxe grecque comprimée est clarifiée avec mesure, tandis que les notes signalent les principales nuances lexicales.
