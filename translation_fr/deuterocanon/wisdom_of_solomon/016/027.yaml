lexical_decisions:
- source_word: τὸ ... μὴ φθειρόμενον
  choice: ce qui n’était pas détruit
  rationale: Le participe substantivé renvoie à la nourriture miraculeuse évoquée dans le contexte. « Détruit » convient au contraste concret avec l’action du feu et la fonte.
- source_word: ὑπὸ πυρὸς
  choice: par le feu
  rationale: Ὑπό avec le génitif exprime ici l’agent ou la cause; « par le feu » est naturel en français.
- source_word: ἁπλῶς
  choice: simplement
  rationale: 'L’adverbe accentue le paradoxe : ce que le feu ne détruisait pas fondait néanmoins sous l’effet minime du soleil.'
- source_word: ὑπὸ βραχείας ἀκτῖνος ἡλίου
  choice: par un faible rayon du soleil
  rationale: Βραχείας peut indiquer la petitesse, la faible intensité ou la brièveté. « Faible rayon » rend naturellement le contraste sans imposer exclusivement une idée de durée.
- source_word: θερμαινόμενον
  choice: réchauffé
  rationale: Le participe décrit la circonstance de la fonte. « Réchauffé » préserve le degré modeste suggéré par βραχείας.
- source_word: ἐτήκετο
  choice: fondait
  rationale: L’imparfait grec décrit le phénomène en cours ou caractéristique dans le récit; l’imparfait français en conserve l’aspect.
theological_decisions:
- issue: Description miraculeuse ou processus naturel général
  choice: Présenter directement le comportement paradoxal de la nourriture dans le récit.
  alternative: Transformer l’énoncé en maxime générale sur les réalités créées.
  rationale: Le grec formule une comparaison concrète liée au récit environnant. La traduction conserve le paradoxe sans lui ajouter d’explication doctrinale.
translation_notes:
  register: Français moderne, courant et digne. La phrase conserve le contraste rhétorique entre le feu et le faible rayon solaire, ainsi que l’imparfait narratif.
