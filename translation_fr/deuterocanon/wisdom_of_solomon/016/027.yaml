  text: For what was not destroyed by fire simply melted when warmed by a brief ray of the sun,[a]
translation:
  language: fr
  text: Car ce que le feu ne détruisait pas fondait rien qu’à être réchauffé par un faible rayon de soleil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par un bref rayon du soleil ». L’adjectif grec peut exprimer la faiblesse ou la petitesse, mais aussi la brièveté.
