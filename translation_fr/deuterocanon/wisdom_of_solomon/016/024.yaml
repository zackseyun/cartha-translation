base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/024.yaml
  text: For creation[a], serving you its maker, strains itself for the punishment of the unrighteous, and relaxes for the benefit of those who have put their trust in you.
translation:
  language: fr
  text: Car la création, qui te sert, toi qui l’as créée, se tend pour châtier les injustes et se relâche pour faire du bien à ceux qui ont mis leur confiance en toi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec oppose deux images physiques : la création « se tend » en vue du châtiment des injustes, puis « se relâche » pour le bien de ceux qui ont mis leur confiance en Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κτίσις
  choice: la création
  rationale: Désigne ici l’ensemble de l’ordre créé, présenté comme agissant au service de Dieu; « la nature » risquerait de suggérer une force autonome.
- source_word: σοι τῷ ποιήσαντι
  choice: à ton service, toi qui l’as faite
  rationale: Le groupe appositionnel identifie le destinataire du service comme celui qui a fait la création. Cette formulation garde la deuxième personne et rend explicite le lien syntaxique sans employer le masculin « son créateur ».
- source_word: ὑπηρετοῦσα
  choice: à ton service
  rationale: Exprime la fonction subordonnée de la création, qui accomplit les desseins de Dieu, dans un français actuel et non ecclésiastique.
- source_word: ἐπιτείνει
  choice: se tend
  rationale: Préserve l’image physique d’une mise sous tension ou d’un étirement, qui contraste directement avec ἀνίεται.
- source_word: εἰς κόλασιν κατὰ τῶν ἀδίκων
  choice: pour châtier les injustes
  rationale: Rend naturellement la finalité punitive de κόλασις et la valeur morale et judiciaire de ἀδίκων. « Châtier » conserve un registre biblique digne sans imposer l’idée d’une correction seulement éducative.
- source_word: ἀνίεται
  choice: se relâche
  rationale: 'Conserve l’image opposée à « se tend »: la création passe de la tension au relâchement.'
- source_word: εἰς εὐεργεσίαν
  choice: pour faire du bien
  rationale: Rend le sens actif de bienfaisance dans un français courant et naturel, plutôt que par le nom plus abstrait « bienfaisance ».
- source_word: ὑπὲρ τῶν εἰς σὲ πεποιθότων
  choice: à ceux qui ont mis leur confiance en toi
  rationale: Le parfait πεποιθότων évoque une confiance placée en Dieu et qui demeure; le passé composé français en conserve bien la nuance.
theological_decisions:
- issue: Action de la création sous l’autorité de Dieu
  choice: La création est présentée comme servant celui qui l’a faite, aussi bien dans le châtiment que dans l’action bienfaisante.
  alternative: Comprendre la création ou la nature comme une puissance impersonnelle agissant de façon autonome.
  rationale: ὑπηρετοῦσα et σοι τῷ ποιήσαντι subordonnent explicitement l’action de la création à Dieu, sans effacer la personnification vigoureuse du texte.
- issue: Contraste entre châtiment et bienfait
  choice: Maintenir le parallélisme imagé « se tend… se relâche » tout en rendant les finalités par des verbes naturels.
  alternative: Aplanir l’image en traduisant simplement « devient plus forte… devient plus douce » ou employer les abstractions « pour le châtiment… pour la bienfaisance ».
  rationale: Les verbes grecs expriment une opposition physique intentionnelle; la conserver respecte la tension poétique et théologique du passage.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la personnification de la création et l’antithèse physique des deux verbes grecs. Le marqueur de note est placé après l’ensemble de la proposition qu’il éclaire.
