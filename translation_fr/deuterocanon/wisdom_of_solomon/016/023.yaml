  naturalness: « Mais celui-ci, à son tour » est compréhensible si l’antécédent masculin (« le feu ») est explicite dans le contexte immédiat, mais « Mais celui-ci, de son côté » est plus fluide dans ce mouvement contrastif. Le déplacement de la proposition finale en fin de phrase rend la phrase française plus naturelle sans modifier son sens.
