  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/023.yaml
  text: But this again[a], so that the righteous might be fed, forgot even its own power.
translation:
  language: fr
  text: Mais celui-ci, de son côté, oublia même sa propre puissance, afin que les justes soient nourris.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « oublia sa propre force » ou « mit de côté sa propre puissance ». Le grec personnifie le sujet en disant qu’il « oublia » sa puissance.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο πάλιν δʼ
  choice: Mais celui-ci, à son tour
  rationale: Le démonstratif neutre renvoie au phénomène ou à l’élément évoqué précédemment. « À son tour » exprime ici plus naturellement la succession contrastée que « de nouveau », tandis que « mais » rend δέ.
- source_word: ἵνα τραφῶσιν δίκαιοι
  choice: pour que les justes soient nourris
  rationale: La construction ἵνα avec le subjonctif exprime le but, et le passif de τρέφω est conservé. « Les justes » rend l’adjectif substantivé sans développement interprétatif.
- source_word: ἐπιλησθῇ
  choice: oublia
  rationale: Le sens premier est « oublier ». Le conserver maintient la personnification frappante du grec au lieu de la réduire à une explication physique.
- source_word: τῆς ἰδίας δυνάμεως
  choice: sa propre puissance
  rationale: « Propre » préserve la valeur réfléchie de ἰδίας, et « puissance » garde l’amplitude de δύναμις, qui peut désigner la force ou la capacité d’action de l’élément.
theological_decisions:
- issue: Personnification de l’élément créé sous la providence divine
  choice: Conserver « oublia sa propre puissance »
  alternative: perdit sa force naturelle / mit de côté son pouvoir habituel
  rationale: Le grec attribue explicitement l’oubli au sujet. Cette image présente la création comme répondant au dessein qui nourrit les justes; la traduction ne doit pas aplanir cette tension en paraphrase impersonnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le but exprimé par ἵνα, le passif de « nourrir » et la personnification poétique. Le marqueur de note est placé après la proposition qu’il éclaire.
