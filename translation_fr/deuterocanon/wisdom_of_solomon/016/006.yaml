base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/006.yaml
  text: But for a short time they were troubled as a warning, having a sign of salvation, for a reminder of the commandment of your law;
translation:
  language: fr
  text: 'Mais ils ne furent troublés que pour peu de temps, à titre d’avertissement : ils avaient un signe de salut[a], pour leur rappeler le commandement de ta loi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un symbole de salut » ou « un gage de délivrance ».
    reason: Alternative lexicale permettant de conserver l’étendue sémantique de σύμβολον et σωτηρίας.
lexical_decisions:
- source_word: εἰς νουθεσίαν
  choice: en guise d’avertissement
  rationale: Cette expression rend la visée corrective de νουθεσία et la valeur finale ou fonctionnelle de εἰς, dans un français naturel.
- source_word: πρὸς ὀλίγον
  choice: que peu de temps
  rationale: Le tour exprime explicitement la durée limitée de leur épreuve.
- source_word: ἐταράχθησαν
  choice: ils furent troublés
  rationale: Le passif conserve la formulation grecque et reste assez large pour évoquer à la fois l’effroi et l’affliction.
- source_word: σύμβολον
  choice: un signe
  rationale: « Signe » désigne naturellement un objet visible renvoyant à la délivrance divine, sans réduire le terme à un symbole abstrait.
- source_word: σωτηρίας
  choice: de salut
  rationale: « Salut » conserve à la fois l’idée de délivrance face au danger mortel et la portée théologique possible du grec.
- source_word: εἰς ἀνάμνησιν
  choice: destiné à leur rappeler
  rationale: Cette formulation naturelle exprime la fonction mémorielle du signe sans introduire l’idée plus technique de mémorial.
- source_word: ἐντολῆς νόμου σου
  choice: le commandement de ta Loi
  rationale: La construction maintient au singulier ἐντολή ainsi que la mention distincte de νόμος. La majuscule signale ici la Loi divine adressée à Dieu, sans préciser davantage le commandement visé.
theological_decisions:
- issue: Portée de σωτηρίας dans un contexte de délivrance physique ayant une résonance théologique
  choice: de salut
  alternative: de délivrance
  rationale: « Salut » garde ensemble le secours immédiat accordé dans le désert et la portée religieuse du terme, sans importer de développement doctrinal ultérieur.
- issue: Fonction de σύμβολον dans l’épisode du serpent de bronze
  choice: un signe de salut
  alternative: un symbole de salut / un gage de délivrance
  rationale: « Signe » préserve la fonction représentative et indicative de l’objet tout en laissant ouverte la manière précise dont il se rapporte au salut.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit de près le grec tout en évitant une succession lourde de compléments en « pour ». Le tutoiement sacré est maintenu dans « ta Loi ».
