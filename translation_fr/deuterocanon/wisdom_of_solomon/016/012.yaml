base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/012.yaml
  text: For neither herb nor poultice healed them[a], but your word, O Lord[b], heals all things.
translation:
  language: fr
  text: Car ni plante médicinale ni cataplasme ne les a guéris, mais ta parole, Seigneur, elle qui guérit tout.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βοτάνη
  choice: plante médicinale
  rationale: Dans ce contexte de guérison, le terme désigne vraisemblablement une plante employée comme remède. Cette formulation est plus immédiatement claire en français moderne que « herbe », tout en restant proche du grec.
- source_word: μάλαγμα
  choice: cataplasme
  rationale: Le mot désigne une préparation médicinale souple appliquée sur le corps. « Cataplasme » exprime précisément ce type de remède externe.
- source_word: ἐθεράπευσεν
  choice: a guéris
  rationale: Le verbe indique ici la guérison effective, et non le simple fait de soigner ou de traiter.
- source_word: λόγος
  choice: parole
  rationale: « Parole » conserve à la fois le sens d'une expression efficace du Seigneur et la résonance théologique du terme, sans lui imposer un sens technique ultérieur.
- source_word: ἰώμενος
  choice: elle qui guérit
  rationale: La proposition relative rend naturellement le participe présent grec et présente la parole du Seigneur comme ayant une puissance guérissante caractéristique.
- source_word: πάντα
  choice: tout
  rationale: Le neutre pluriel a une portée globale. En français, « tout » est naturel, digne et suffisamment large.
- source_word: Κύριε
  choice: Seigneur
  rationale: C'est l'équivalent français usuel de κύριος dans une adresse directe à Dieu.
theological_decisions:
- issue: Nature du contraste entre les remèdes humains et l'action divine
  choice: Le verset affirme que, dans ce cas, ni la plante médicinale ni le cataplasme ne les ont guéris; c'est la parole du Seigneur qui l'a fait.
  alternative: Lire le verset comme une condamnation générale de toute médecine humaine.
  rationale: Le grec porte sur l'inefficacité de ces remèdes dans la situation évoquée et sur l'efficacité souveraine de la parole divine; il ne formule pas une doctrine générale rejetant la médecine.
- issue: Portée de « tout »
  choice: Conserver la formulation universelle et ouverte du grec.
  alternative: Restreindre le sens à « tous les malades » ou à « toutes leurs blessures ».
  rationale: πάντα est neutre et non explicitement limité. La traduction ne doit pas réduire silencieusement sa portée.
translation_notes:
  register: Français international moderne, clair et digne. « Plante médicinale » évite l'ambiguïté moderne de « herbe »; « cataplasme » demeure un terme courant et précis. La reprise pronominale « elle qui guérit tout » maintient le lien syntaxique avec « ta parole » et reflète le participe grec.
