  text: But it is impossible to escape your hand[a].
translation:
  language: fr
  text: Mais il est impossible d’échapper à ta main[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fuir devant ta main ». Le grec conserve l’image concrète de la main de Dieu pour évoquer sa puissance et l’impossibilité de se soustraire à son action.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὴν ... σὴν χεῖρα
  choice: à ta main
  rationale: χείρ désigne littéralement la « main » et évoque ici, sans supprimer l’image concrète, la puissance et l’emprise auxquelles nul ne peut se soustraire.
- source_word: φυγεῖν
  choice: d’échapper
  rationale: L’infinitif aoriste de φεύγω peut signifier « fuir » ou « échapper à ». Avec χεῖρα comme objet, « échapper à ta main » est naturel en français et exprime clairement l’impossibilité de se soustraire à son action.
- source_word: ἀδύνατόν ἐστιν
  choice: il est impossible
  rationale: Cette tournure impersonnelle rend directement et clairement l’expression grecque.
- source_word: δὲ
  choice: Mais
  rationale: δέ marque ici un contraste avec ce qui précède ; « Mais » en restitue naturellement la valeur adversative.
theological_decisions:
- issue: Langage anthropomorphique appliqué à l’action divine
  choice: Conserver « ta main » dans le texte principal
  alternative: ta puissance
  rationale: Le grec emploie l’image corporelle de la main pour exprimer la puissance et la portée irrésistibles de Dieu. La conserver respecte l’image et sa tension théologique au lieu de la remplacer par une abstraction.
translation_notes:
  register: Français moderne, simple et digne. Le tutoiement correspond à l’adresse directe au singulier du grec. La formulation concise suit étroitement la structure de la phrase source tout en restant idiomatique.
