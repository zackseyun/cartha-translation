base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/017.yaml
  text: 'For what was most astonishing was this: in the water that extinguishes everything[a], the fire had even greater power, for the world fights on behalf of the righteous.'
translation:
  language: fr
  text: 'Car voici ce qu’il y avait de plus extraordinaire : dans l’eau qui éteint tout, le feu agissait avec encore plus de force, car le monde prend la défense des justes[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’univers est le champion des justes »; ou : « la création défend les justes ».'
    reason: Variantes lexicales possibles pour κόσμος et ὑπέρμαχος, dont l’association peut décrire le monde créé comme champion ou défenseur des justes.
lexical_decisions:
- source_word: παραδοξότατον
  choice: ce qu’il y avait de plus extraordinaire
  rationale: Le superlatif désigne ce qui est au plus haut point contraire à l’attente. « Extraordinaire » exprime naturellement l’étonnement sans donner au mot le sens technique de « paradoxal ».
- source_word: σβεννύντι
  choice: qui éteint
  rationale: Le participe décrit l’action normalement exercée par l’eau sur le feu. « Éteint » est direct et idiomatique en français.
- source_word: πλεῖον ἐνήργει
  choice: agissait avec encore plus de force
  rationale: L’imparfait ἐνήργει exprime une action ou une efficacité en cours, tandis que πλεῖον en marque l’intensification. Cette formulation conserve l’idée d’une activité accrue sans transformer explicitement celle-ci en possession de puissance.
- source_word: ὑπέρμαχος
  choice: prend la défense de
  rationale: Le terme désigne celui qui combat en faveur d’un autre ou qui le défend. La locution verbale française convient au sujet « le monde » et maintient la personnification.
- source_word: κόσμος
  choice: le monde
  rationale: κόσμος désigne ici le monde créé et ordonné. « Le monde » en est le rendu le plus direct; « l’univers » et « la création » restent possibles.
- source_word: δικαίων
  choice: les justes
  rationale: Le génitif pluriel substantivé désigne les personnes justes. « Les justes » est concis, courant dans le registre biblique et fidèle à la catégorie morale du grec.
theological_decisions:
- issue: Sens de κόσμος ὑπέρμαχος δικαίων
  choice: le monde prend la défense des justes
  alternative: le monde est le champion des justes; la création défend les justes
  rationale: Le texte personnifie l’ordre créé comme intervenant en faveur des justes. Le rendu conserve cette image et sa portée martiale sans la convertir en affirmation doctrinale plus systématique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe explicative du grec est conservée, avec une formulation fluide; la personnification du monde demeure explicite.
