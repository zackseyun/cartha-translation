base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/011.yaml
  text: For they were being pricked as a reminder of your sayings, and were quickly rescued, so that, after falling into deep forgetfulness, they might not become cut off from your beneficence.
translation:
  language: fr
  text: En effet, ils étaient piqués pour leur rappeler tes paroles, puis rapidement sauvés, afin que, tombés dans un profond oubli, ils ne soient pas privés de tes bienfaits.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνεκεντρίζοντο
  choice: ils étaient piqués
  rationale: Conserve l’image concrète des morsures de serpents évoquées par le contexte, tout en respectant la forme passive et imperfective du grec.
- source_word: τῶν λογίων σου
  choice: tes paroles
  rationale: « Paroles » rend naturellement λόγια dans ce contexte de déclarations divines rappelées à Israël, sans imposer le sens technique d’« oracles ».
- source_word: ὀξέως διεσώζοντο
  choice: ils étaient rapidement sauvés
  rationale: ὀξέως exprime ici la rapidité, et διασῴζω un sauvetage effectif hors du danger.
- source_word: τῆς σῆς εὐεργεσίας
  choice: de tes bienfaits
  rationale: Le pluriel idiomatique français exprime naturellement l’action bienfaisante ou les secours accordés par Dieu.
theological_decisions:
- issue: Sens de ἀπερίσπαστοι avec le génitif
  choice: ils ne soient détournés de tes bienfaits
  alternative: ils ne soient privés de tes bienfaits
  rationale: Le terme évoque littéralement le fait d’être tiré ou détourné loin de quelque chose. La formulation retenue préserve l’idée d’un éloignement causé par l’oubli, plutôt que d’affirmer sans ambiguïté une privation imposée par Dieu.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe causale et finale du grec est conservée sans lourdeur excessive; les imparfaits rendent les actions répétées dans le contexte du récit.
