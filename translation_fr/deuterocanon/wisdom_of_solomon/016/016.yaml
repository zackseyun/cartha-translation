base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/016.yaml
  text: For because they refused to know you[a], the ungodly were scourged by the strength of your arm, pursued by strange rains and hail and relentless storms[b], and consumed by fire.
translation:
  language: fr
  text: Car les impies ont été flagellés par la puissance de ton bras parce qu’ils refusaient de te connaître, poursuivis par des pluies étranges[a], par la grêle et par des averses inexorables[b], et consumés par le feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des pluies insolites » ; le grec parle littéralement de pluies « étrangères » ou « étranges », soulignant leur caractère extraordinaire.
    reason: lexical_alternative
  - marker: b
    text: Ou « des averses inévitables » ; l’adjectif grec désigne ce qui ne peut être détourné ou refusé, et à quoi l’on ne peut se soustraire.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρνούμενοι … εἰδέναι
  choice: parce qu’ils refusaient de te connaître
  rationale: Le participe avec l’infinitif exprime ici un refus volontaire. « Te connaître » conserve le sens direct du grec sans développer en « te reconnaître ».
- source_word: ἀσεβεῖς
  choice: les impies
  rationale: « Impies » désigne précisément ceux dont l’attitude est irrévérencieuse envers Dieu, plutôt que la méchanceté au sens général.
- source_word: ἐν ἰσχύι βραχίονός σου
  choice: par la puissance de ton bras
  rationale: Cette formulation conserve l’image biblique du bras divin et la valeur instrumentale de la préposition.
- source_word: ἐμαστιγώθησαν
  choice: ont été flagellés
  rationale: Le verbe évoque littéralement la flagellation et, ici, une punition sévère. Le choix français maintient cette image vive.
- source_word: ξένοις ὑετοῖς
  choice: des pluies étranges
  rationale: ξένος qualifie ces pluies d’étrangères, extraordinaires ou insolites. « Étranges » préserve volontairement ce caractère anormal.
- source_word: χαλάζαις
  choice: la grêle
  rationale: Le nom collectif français rend naturellement le pluriel grec.
- source_word: ὄμβροις … ἀπαραιτήτοις
  choice: des averses inexorables
  rationale: ὄμβρος désigne une pluie forte ou une averse; l’adjectif indique qu’on ne peut ni la détourner ni s’y soustraire.
- source_word: διωκόμενοι
  choice: poursuivis
  rationale: Le participe conserve l’image des phénomènes naturels qui pourchassent les impies.
- source_word: πυρὶ καταναλισκόμενοι
  choice: consumés par le feu
  rationale: La formulation rend directement l’idée de destruction par le feu dans un registre biblique encore compréhensible aujourd’hui.
theological_decisions:
- issue: Nature de la connaissance de Dieu dans εἰδέναι
  choice: te connaître
  alternative: te reconnaître / reconnaître que tu es Dieu
  rationale: Le contexte suppose un refus coupable, mais le grec dit simplement « connaître ». La traduction n’explicite donc pas davantage la portée théologique.
- issue: Force métaphorique de ἐμαστιγώθησαν
  choice: ont été flagellés
  alternative: ont été punis / ont été frappés
  rationale: Même si les instruments du châtiment sont des phénomènes naturels, le texte emploie délibérément l’image sévère de la flagellation; il convient de ne pas l’atténuer.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La structure accumulative du grec est conservée, ainsi que les images fortes du bras, de la poursuite, de la flagellation et du feu.
