base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/004.yaml
  text: For it was necessary that unavoidable want should come upon those who tyrannized[b][a], but to these only that it should be shown how their enemies were being tormented.
translation:
  language: fr
  text: Car il fallait qu’une privation inéluctable frappe ceux qui les opprimaient[a], tandis qu’il fallait seulement qu’il soit montré à ceux-ci comment leurs ennemis étaient tourmentés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui agissaient en tyrans ». Le grec emploie une forme verbale qui souligne leur conduite oppressive.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδει
  choice: il fallait
  rationale: Cette tournure impersonnelle exprime naturellement en français la nécessité indiquée par l’imparfait grec.
- source_word: ἀπαραίτητον ἔνδειαν
  choice: une privation inéluctable
  rationale: « Privation » rend le manque de choses nécessaires sans le réduire à la seule faim; « inéluctable » exprime ce qui ne peut être écarté.
- source_word: ἐπελθεῖν
  choice: frappe
  rationale: Dans ce contexte de jugement, « frapper » restitue avec naturel l’idée d’un mal qui survient et atteint quelqu’un.
- source_word: τυραννοῦσιν
  choice: ceux qui les opprimaient
  rationale: La formulation verbale conserve l’accent du participe grec sur l’exercice concret d’une domination tyrannique; le pronom explicite l’objet implicite d’après le contexte.
- source_word: τούτοις δὲ μόνον
  choice: tandis qu’il suffisait ... à ceux-ci
  rationale: 'La construction marque le contraste et la restriction: ce second groupe ne subit pas la même privation, mais reçoit seulement la démonstration du sort ennemi.'
- source_word: δειχθῆναι
  choice: de montrer
  rationale: L’infinitif passif grec est rendu par une tournure impersonnelle française, qui maintient l’idée d’une démonstration sans nommer son agent.
- source_word: πῶς
  choice: comment
  rationale: Le terme garde ouverte la nuance entre la manière du tourment et le spectacle de sa réalité.
- source_word: ἐβασανίζοντο
  choice: étaient tourmentés
  rationale: Cette traduction conserve l’intensité de βασανίζω sans introduire nécessairement l’image plus étroite d’une torture judiciaire.
theological_decisions:
- issue: Contraste entre le jugement subi par les oppresseurs et ce qui est montré au peuple de Dieu
  choice: Les oppresseurs sont directement frappés d’une privation inéluctable, tandis que l’autre groupe voit seulement le tourment de ses ennemis.
  alternative: « Ceux-ci devaient seulement voir comment leurs ennemis étaient châtiés. »
  rationale: 'Le datif τούτοις, le restrictif μόνον et le passif δειχθῆναι établissent une asymétrie: les uns subissent le fléau, les autres en reçoivent la démonstration. La traduction la préserve sans en tirer de conclusion doctrinale supplémentaire.'
translation_notes:
  register: Français moderne, soutenu mais accessible. « Privation inéluctable » conserve la densité du grec; la seconde proposition est restructurée de manière idiomatique tout en maintenant la restriction « seulement » et l’absence d’agent exprimé.
