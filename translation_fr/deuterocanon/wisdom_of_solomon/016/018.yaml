base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/018.yaml
  text: For at one time the flame was subdued[a], so that it might not burn up the creatures sent against the ungodly; but they themselves, seeing it[c][b], might know that they were being pursued by the judgment of God.
translation:
  language: fr
  text: En effet, à un certain moment, la flamme était adoucie[a], afin qu’elle ne consume pas les animaux envoyés contre les impies ; mais afin que les impies eux-mêmes, à cette vue, sachent qu’ils sont poussés par le jugement de Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’apaisait », « était maîtrisée » ou « était domptée ».
    reason: lexical_alternative
  - marker: b
    text: Ou « sont entraînés » ou « sont poursuivis par le jugement de Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεροῦτο
  choice: s’adoucissait
  rationale: Le verbe ἡμερόω signifie « apprivoiser, rendre doux ». Appliqué à la flamme, « s’adoucissait » conserve cette image sans suggérer qu’elle s’éteignait.
- source_word: φλόξ
  choice: la flamme
  rationale: φλόξ désigne précisément une flamme plutôt que le feu en général.
- source_word: καταφλέξῃ
  choice: consumer
  rationale: Le composé exprime une destruction complète par le feu ; « consumer » rend naturellement cette intensité.
- source_word: τὰ ἐπʼ ἀσεβεῖς ἀπεσταλμένα ζῷα
  choice: les animaux envoyés contre les impies
  rationale: Dans le récit des plaies, ζῷα désigne des animaux ou êtres vivants, et ἐπί marque ici leur action hostile contre les impies.
- source_word: ἀσεβεῖς
  choice: les impies
  rationale: « Impies » garde la portée à la fois morale et religieuse de ἀσεβεῖς.
- source_word: βλέποντες
  choice: en voyant cela
  rationale: Le grec ne donne pas de complément explicite. « Cela » renvoie naturellement au phénomène décrit, sans limiter la vision à la seule flamme.
- source_word: εἴδωσιν
  choice: sauraient
  rationale: Le verbe exprime ici la compréhension qui résulte de la vue, et non une simple perception visuelle.
- source_word: θεοῦ κρίσει
  choice: par le jugement de Dieu
  rationale: Cette formulation conserve la dimension judiciaire explicite de κρίσις.
- source_word: ἐλαύνονται
  choice: étaient pourchassés
  rationale: Le passif peut évoquer le fait d’être poussés, traqués ou poursuivis. « Pourchassés » convient au contexte des plaies tout en laissant la force motrice au jugement divin.
theological_decisions:
- issue: Nature de l’action divine dans les plaies
  choice: Le jugement de Dieu pourchasse les impies tandis que la flamme est rendue douce afin d’épargner les animaux envoyés contre eux.
  alternative: Comprendre le jugement de Dieu comme une circonstance providentielle plus générale, ou traduire ἐλαύνονται par « étaient poussés » plutôt que « pourchassés ».
  rationale: θεοῦ κρίσει présente explicitement les événements comme une manifestation du jugement divin. La traduction conserve cette affirmation sans préciser davantage le mode de causalité.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’opposition entre la flamme adoucie et les impies soumis au jugement. « Tantôt » rend ποτὲ μέν dans une séquence où les variations du feu sont développées.
