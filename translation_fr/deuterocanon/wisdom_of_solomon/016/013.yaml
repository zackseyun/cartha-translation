base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/013.yaml
  text: For you have authority over life and death[b][a], and you bring down to the gates of Hades and bring up.
translation:
  language: fr
  text: Car tu as autorité sur la vie et la mort ; tu fais descendre aux portes du séjour des morts[a] et tu fais remonter[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aux portes de l’Hadès ». Le grec dit « Hadès », le domaine des morts.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tu ramènes en haut ». Le grec oppose simplement « faire descendre » et « faire remonter », sans préciser davantage la nature de cette remontée.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: autorité
  rationale: Le terme exprime ici l’autorité souveraine exercée sur la vie et la mort, plutôt qu’une simple capacité.
- source_word: ζωῆς καὶ θανάτου
  choice: sur la vie et la mort
  rationale: Cette formulation rend naturellement en français les génitifs régis par « tu as autorité », sans développer davantage l’opposition du grec.
- source_word: κατάγεις
  choice: tu fais descendre
  rationale: Le causatif français conserve le mouvement vers le bas et prépare l’antithèse avec « tu fais remonter ».
- source_word: πύλας ᾅδου
  choice: les portes du séjour des morts
  rationale: « Séjour des morts » désigne clairement le domaine des défunts en français biblique moderne, sans suggérer nécessairement le lieu de châtiment évoqué aujourd’hui par « Hadès ».
- source_word: ἀνάγεις
  choice: tu fais remonter
  rationale: La formulation reproduit directement le mouvement ascendant opposé à κατάγεις, sans ajouter « de nouveau » ni préciser s’il s’agit techniquement de résurrection.
theological_decisions:
- issue: Sens de ᾅδου
  choice: séjour des morts
  alternative: Hadès
  rationale: Le grec nomme le domaine des morts. « Séjour des morts » en transmet le sens dans un français courant et digne; une note conserve le lien avec le terme grec « Hadès ».
- issue: Portée de ἀνάγεις
  choice: tu fais remonter
  alternative: tu ressuscites
  rationale: Le verbe grec exprime ici un mouvement vers le haut en contraste avec la descente. « Tu ressuscites » préciserait une doctrine que le seul verbe ne formule pas explicitement.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme vertical du grec est conservé par « fais descendre / fais remonter ». Les marqueurs de notes sont placés immédiatement après les expressions concernées.
