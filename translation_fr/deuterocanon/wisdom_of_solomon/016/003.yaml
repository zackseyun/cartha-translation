base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/003.yaml
  text: so that those men[a], though desiring food, might, because of the appearance of the creatures that had been sent, turn away even from their necessary appetite, while these others, after becoming needy for a short time[b], might partake of a strange taste.
translation:
  language: fr
  text: afin que ceux-là[a], tout en désirant de la nourriture, en viennent, à la vue des créatures envoyées contre eux, à rejeter même l’appétit que leur impose la nécessité, tandis que ceux-ci, après s’être trouvés dans le besoin pendant peu de temps, puissent goûter une saveur inhabituelle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le contexte, « ceux-là » désigne les Égyptiens frappés par les créatures envoyées contre eux, et « ceux-ci », les Israélites qui ont connu une privation pendant quelque temps.
    reason: referent_clarification
  - marker: b
    text: L’expression évoque une nourriture d’un genre inhabituel, probablement la nourriture extraordinaire accordée à Israël dans le désert.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπιθυμοῦντες τροφήν
  choice: tout en désirant de la nourriture
  rationale: Rend le désir réel de nourriture sans l’intensifier indûment; « nourriture » est le terme courant pour τροφή.
- source_word: διὰ τὴν δειχθεῖσαν τῶν ἐπαπεσταλμένων
  choice: à cause de l’aspect des créatures envoyées contre eux
  rationale: Le grec est condensé et quelque peu difficile; « aspect » restitue la dimension visible exprimée par δειχθεῖσαν, tandis que « envoyées contre eux » conserve la force hostile de ἐπαπεσταλμένων. « Créatures » explicite sobrement le référent contextuel.
- source_word: τὴν ἀναγκαίαν ὄρεξιν
  choice: l’appétit imposé par la nécessité
  rationale: Cette formulation française naturelle préserve l’idée d’un appétit suscité ou rendu nécessaire par le besoin, plutôt que celle d’un simple « appétit naturel ».
- source_word: ἀποστρέφωνται
  choice: se détournent
  rationale: Conserve le mouvement de rejet sans imposer explicitement une émotion plus forte que le verbe grec.
- source_word: ἐπʼ ὀλίγον ἐνδεεῖς γενόμενοι
  choice: après avoir connu le manque pendant un peu de temps
  rationale: Exprime une privation temporaire sans suggérer nécessairement la misère ou la famine.
- source_word: ξένης ... γεύσεως
  choice: une saveur inconnue
  rationale: ξένος marque ici le caractère inhabituel ou étranger de l’expérience gustative; « inconnue » évite en français une lecture ethnique de « étrangère ».
- source_word: μετάσχωσι
  choice: aient part à
  rationale: Rend fidèlement l’idée de participation dans un registre digne et courant.
theological_decisions:
- issue: Référents de ἐκεῖνοι et αὐτοί
  choice: Conserver le contraste pronominal « les uns… les autres » et expliquer en note que le contexte oppose les Égyptiens aux Israélites.
  alternative: Nommer directement les Égyptiens et les Israélites dans le corps du verset.
  rationale: Le contexte identifie les groupes, mais le grec les désigne par des pronoms démonstratifs; la traduction évite donc d’insérer les noms dans le texte tout en assurant l’intelligibilité par une note.
- issue: Nature de la « saveur inconnue »
  choice: Ne pas identifier explicitement cette saveur à la manne dans le corps du texte.
  alternative: 'Traduire ou annoter de manière affirmative: « la saveur extraordinaire de la manne ».'
  rationale: Le contexte évoque la nourriture providentielle d’Israël, mais le verset lui-même parle seulement d’une saveur ξένη; la note peut signaler l’allusion probable sans supprimer cette retenue.
translation_notes:
  register: Français international moderne, clair et digne. Le balancement « les uns… les autres » reproduit l’opposition grecque. La syntaxe a été légèrement réorganisée pour rendre sans lourdeur le groupe grec difficile διὰ τὴν δειχθεῖσαν τῶν ἐπαπεσταλμένων, tout en conservant l’aspect visible des créatures comme cause du dégoût.
