base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/021.yaml
  text: For your substance displayed your sweetness toward your children[a]; and, serving the desire of the one who partook of it[b], it changed into whatever each one wished.
translation:
  language: fr
  text: Car ta substance manifestait ta douceur envers tes enfants[a] et, se mettant au service du désir de celui qui la recevait[b], elle se transformait selon ce que chacun voulait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ta nature manifestait ta douceur envers tes enfants ». Le grec peut désigner la substance, la nature ou la réalité sous-jacente.'
    reason: lexical_alternative
  - marker: b
    text: La fin du verset signifie que cette nourriture s’adaptait à la préférence de chaque personne.
    reason: cultural_note
lexical_decisions:
- source_word: ὑπόστασίς
  choice: substance
  rationale: Dans le contexte immédiat de la manne, le terme désigne vraisemblablement sa réalité matérielle ou sa constitution donnée par Dieu. « Substance » garde la nuance concrète et quelque peu philosophique du grec sans en faire un terme dogmatique technique.
- source_word: γλυκύτητα
  choice: douceur
  rationale: « Douceur » conserve à la fois la saveur agréable de la nourriture et la bienveillance de Dieu manifestée envers ses enfants.
- source_word: τέκνα
  choice: enfants
  rationale: Le mot grec inclut ici tout le peuple bénéficiaire des soins de Dieu et ne se limite pas aux hommes.
- source_word: τοῦ προσφερομένου
  choice: de celui qui la recevait
  rationale: Le participe désigne celui à qui la nourriture était présentée ou offerte. Cette formulation française garde l'accent sur le bénéficiaire sans introduire explicitement l'idée de consommation.
- source_word: ἐπιθυμίᾳ
  choice: désir
  rationale: Le terme exprime le désir ou l'envie du bénéficiaire; « désir » demeure assez large pour préserver cette nuance.
- source_word: ὑπηρετῶν
  choice: se mettant au service
  rationale: Le participe décrit la nourriture comme répondant activement au désir du bénéficiaire. Cette tournure restitue naturellement l'image de service.
- source_word: μετεκιρνᾶτο
  choice: elle se transformait
  rationale: Le verbe évoque un changement de composition ou de forme. Le pronominal français rend le mouvement de transformation attribué à la manne sans technicité excessive.
- source_word: πρὸς ὃ τις ἐβούλετο
  choice: en ce que chacun voulait
  rationale: La formulation conserve le caractère distributif de τις et l'idée que la nourriture s'adaptait à la préférence de chaque personne.
theological_decisions:
- issue: Référent de « ta substance »
  choice: L'expression renvoie d'abord à la substance de la manne, provision venant de Dieu.
  alternative: « Ta nature » pourrait renvoyer plus directement au caractère bienveillant de Dieu.
  rationale: Le contexte traite des propriétés miraculeuses de la nourriture et de son adaptation au goût de chacun. « Ta substance » maintient ce référent concret tout en laissant entendre que la douceur divine se manifeste à travers ce don.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le lien entre la substance de la manne, la douceur divine et l'adaptation miraculeuse de la nourriture, tout en évitant de transformer ὑπόστασις en affirmation métaphysique sur l'essence de Dieu.
