  source_fidelity: 'Le sens général est fidèlement rendu : la « substance » (dans le contexte, la nourriture fournie) manifeste la douceur divine et s’adapte au désir individuel. Toutefois, « se transformait en ce que chacun voulait » donne à πρὸς ὃ une nuance trop strictement transformative (« en »). La préposition πρὸς exprime plus naturellement l’adaptation « selon / en fonction de ce que chacun voulait ».'
