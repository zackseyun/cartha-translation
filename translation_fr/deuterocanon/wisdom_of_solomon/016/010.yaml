base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/010.yaml
  text: But the teeth of venomous serpents did not overcome your sons[a], for your mercy came to their aid and healed them.
translation:
  language: fr
  text: Mais les dents des serpents venimeux ne vainquirent pas tes fils[a], car ta miséricorde vint à leur secours et les guérit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes enfants ». Le grec dit littéralement « tes fils ».
    reason: Alternative lexicale et précision sur la forme masculine du grec.
lexical_decisions:
- source_word: υἱούς
  choice: fils
  rationale: Le grec emploie le masculin pluriel « fils » pour désigner ici les membres du peuple de Dieu; le conserver respecte la forme du texte tout en restant naturel en français.
- source_word: ἰοβόλων
  choice: venimeux
  rationale: Le composé évoque des créatures qui injectent ou lancent du poison. Pour des serpents qui mordent, « venimeux » est le terme français précis et idiomatique.
- source_word: δρακόντων
  choice: serpents
  rationale: Dans le contexte des morsures au désert, le mot désigne des serpents; « dragons » induirait aujourd’hui une image fantastique étrangère au passage.
- source_word: ἐνίκησαν
  choice: ne vainquirent pas
  rationale: Cette formulation conserve l’image forte de la victoire contenue dans le verbe grec, sans réduire le sens à la seule action de blesser.
- source_word: ἀντιπαρῆλθεν
  choice: vint à leur secours
  rationale: Le verbe composé, rare, présente la miséricorde divine comme intervenant face au danger. Cette expression française en restitue clairement la force secourable.
- source_word: ἰάσατο
  choice: les guérit
  rationale: Rendu direct du verbe grec courant signifiant guérir ou rendre la santé.
theological_decisions:
- issue: Référence de « tes fils »
  choice: Maintien de l’adresse à Dieu au sujet d’Israël sous la forme « tes fils ».
  alternative: tes enfants
  rationale: Le contexte évoque le peuple d’Israël au désert et le grec porte explicitement le masculin pluriel. « Fils » préserve cette donnée sans ajouter de conclusion doctrinale.
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple convient au registre narratif et sapientiel. « Vainquirent » préserve la métaphore de la victoire, tandis que « vint à leur secours » rend naturellement le verbe grec inhabituel.
