  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/019.yaml
  text: But at times[a], even in the midst of water, fire burns beyond its power[b], so that it may destroy the unrighteous produce of the earth.
translation:
  language: fr
  text: Mais parfois, même au milieu de l’eau, le feu brûle au-delà de la puissance du feu, afin de détruire le fruit injuste de la terre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « le produit — ou la progéniture — injuste de la terre ». L’expression peut désigner ce que la terre produit en lien avec les injustes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποτὲ δὲ
  choice: Mais parfois
  rationale: Exprime l’occurrence occasionnelle tout en marquant le contraste avec les exemples précédents.
- source_word: μεταξὺ ὕδατος
  choice: même au milieu de l’eau
  rationale: Conserve l’image paradoxale d’un feu qui agit au sein même de l’eau; καί reçoit ici naturellement la valeur intensive « même ».
- source_word: ὑπὲρ τὴν πυρὸς δύναμιν
  choice: au-delà de sa propre puissance
  rationale: Rend la notion de dépassement exprimée par ὑπέρ avec l’accusatif. Le possessif reprend « le feu » sans introduire explicitement l’idée interprétative de puissance « habituelle ».
- source_word: φλέγει
  choice: le feu brûle
  rationale: Le verbe signifie « brûler, flamber ». Le sujet « le feu », implicite mais indiqué par πυρός, est explicité pour obtenir une phrase française autonome et claire.
- source_word: ἵνα
  choice: afin de
  rationale: Maintient la valeur finale de la proposition grecque.
- source_word: ἄδικον
  choice: injuste
  rationale: Préserve l’attribution morale directe et surprenante du grec sans la transformer en une relation explicitement possessive avec les injustes.
- source_word: γῆς γέννημα
  choice: le fruit de la terre
  rationale: « Fruit » rend de manière concise et digne ce que la terre engendre ou produit, tout en laissant ouverte la nuance de produit, récolte ou progéniture.
- source_word: διαφθείρῃ
  choice: détruire
  rationale: Correspond au sens de ruiner ou faire périr dans ce contexte de jugement.
theological_decisions:
- issue: Valeur morale de ἄδικον appliqué à γῆς γέννημα
  choice: le fruit injuste de la terre
  alternative: ce que la terre produit pour les injustes
  rationale: Le grec qualifie directement de « injuste » ce que la terre produit. La traduction conserve cette tension au lieu d’expliquer que le produit appartient aux injustes ou les sert.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formulation conserve le paradoxe du feu au milieu de l’eau et l’étrangeté voulue de l’expression « fruit injuste de la terre ».
