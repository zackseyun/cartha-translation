  source_fidelity: 'Le sens de l’ensemble est fidèlement rendu : le feu agit paradoxalement au milieu de l’eau et dépasse sa puissance, avec pour but de détruire le γέννημα qualifié d’ἄδικον. « Fruit injuste de la terre » préserve, à juste titre, l’attribution directe et inhabituelle de l’adjectif moral au produit.'
