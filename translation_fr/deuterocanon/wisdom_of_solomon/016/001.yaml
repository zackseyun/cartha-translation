  text: Therefore they were justly punished by similar things[b][a], and were tormented by a multitude of creatures.
translation:
  language: fr
  text: C’est pourquoi ils furent justement punis par des choses semblables[a] et tourmentés par une multitude de bêtes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au moyen de choses du même genre » ou « par des choses pareilles » ; le grec souligne une correspondance sans en préciser ici la nature.
    reason: lexical_alternative
  - marker: b
    text: Le terme grec désigne largement des bêtes ou des créatures animales ; selon le contexte, il peut notamment évoquer des animaux nuisibles ou rampants.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Rend naturellement en français la conclusion causale ou logique introduite par le grec.
- source_word: διʼ ὁμοίων
  choice: par des êtres semblables
  rationale: Préserve l’idée de ressemblance ou de correspondance entre les agents du châtiment et ce qui précède, sans préciser davantage le rapport.
- source_word: ἐκολάσθησαν
  choice: furent punis
  rationale: Exprime clairement le sens punitif du verbe dans ce contexte judiciaire.
- source_word: ἀξίως
  choice: justement
  rationale: Marque le caractère mérité et approprié du châtiment.
- source_word: διὰ πλήθους κνωδάλων
  choice: par une multitude de bêtes
  rationale: Conserve l’accent quantitatif de πλήθους et rend κνωδάλων par un terme français large, sans le limiter indûment aux reptiles ou aux animaux rampants.
- source_word: ἐβασανίσθησαν
  choice: tourmentés
  rationale: Restitue l’intensité de la souffrance exprimée par le verbe sans imposer le sens plus technique de « torturés ».
theological_decisions:
- issue: Correspondance rétributive du jugement
  choice: Le châtiment est présenté comme justement infligé par des êtres semblables.
  alternative: 'Expliciter : « par les mêmes sortes d’êtres que ceux auxquels ils avaient péché » ou « par ce qu’ils adoraient ».'
  rationale: Le grec affirme une ressemblance ou une correspondance, mais n’en formule pas ici explicitement la nature. La traduction maintient cette tension sans importer une explication tirée du contexte plus large.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formulation conserve le parallélisme des deux passifs grecs et l’ambiguïté de la correspondance exprimée par ὁμοίων.
