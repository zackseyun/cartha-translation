base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/008.yaml
  text: And by this also you convinced our enemies that you are the one who rescues from every evil[a].
translation:
  language: fr
  text: Et par là aussi, tu as convaincu nos ennemis que c’est toi qui délivres de tout mal[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de tout dommage » ou « de tout malheur ». Le grec κακοῦ peut désigner largement le mal, le tort ou l’adversité.
    reason: alternative lexicale
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: par cela
  rationale: 'Dans ce contexte, ἐν avec le démonstratif exprime le moyen : l’événement précédent est ce par quoi Dieu a convaincu les ennemis. « Par cela » conserve cette valeur instrumentale et le renvoi démonstratif.'
- source_word: ἔπεισας
  choice: tu as convaincu
  rationale: Le verbe signifie persuader ou convaincre. « Tu as convaincu » introduit naturellement en français le contenu exprimé par ὅτι.
- source_word: τοὺς ἐχθροὺς ἡμῶν
  choice: nos ennemis
  rationale: Traduction directe et idiomatique qui conserve la perspective communautaire de la première personne du pluriel.
- source_word: ὅτι σὺ εἶ
  choice: que c’est toi qui
  rationale: La construction clivée française rend naturellement l’accent porté par le pronom explicite σὺ, sans ajouter d’idée étrangère au texte.
- source_word: ὁ ῥυόμενος
  choice: qui délivres
  rationale: Le participe présent substantivé décrit l’action caractéristique de Dieu. « Délivrer » est actuel, digne et suffisamment large pour diverses formes de danger ou de détresse.
- source_word: ἐκ παντὸς κακοῦ
  choice: de tout mal
  rationale: κακόν peut désigner le mal, un dommage ou un malheur. « Tout mal » maintient cette portée générale sans la limiter au seul mal moral ou au seul danger physique.
theological_decisions:
- issue: Portée de κακοῦ
  choice: tout mal
  alternative: tout dommage ; tout malheur
  rationale: Le grec demeure large et peut englober le mal, le tort subi et la détresse. « Tout mal » préserve cette ampleur et la tension du texte sans préciser indûment la nature de la délivrance.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement conserve le singulier grec adressé à Dieu. La tournure « c’est toi qui » restitue l’emphase de σὺ.
