base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/025.yaml
  text: Therefore also at that time[a], changing itself into all things, it served your all-nourishing gift according to the desire of those in need[b];
translation:
  language: fr
  text: C’est pourquoi, alors aussi, se transformant de toutes les manières[a], elle se met au service de ton don qui nourrit tout, conformément au désir de ceux qui étaient dans le besoin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se transformant en toutes choses ». Le grec souligne une remarquable capacité d’adaptation chez ce qui est en discussion ; le contexte l’associe à la nourriture venue du ciel.
    reason: lexical_alternative
  - marker: b
    text: Ou « conformément au souhait de ceux qui demandaient ». Le terme grec peut désigner ceux qui sont dans le besoin ou ceux qui présentent une demande.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο καὶ τότε
  choice: C’est pourquoi, en ce temps-là aussi
  rationale: Cette formulation conserve à la fois le lien de conséquence introduit par διὰ τοῦτο, la valeur additive de καί et le repère temporel τότε.
- source_word: εἰς πάντα μεταλλευομένη
  choice: se transformant en toutes choses
  rationale: Le participe évoque une transformation ou une adaptation remarquable. La traduction formelle préserve l’image concrète ainsi que la construction participiale, sans préciser le mécanisme.
- source_word: τῇ παντοτρόφῳ σου δωρεᾷ
  choice: ton don qui nourrit tous les êtres
  rationale: παντοτρόφος désigne ce qui nourrit ou entretient tous. La périphrase est plus naturelle en français moderne qu’un composé artificiel tel que « tout-nourricier ».
- source_word: ὑπηρετεῖ
  choice: elle se mettait au service de
  rationale: Le verbe exprime un service rendu. L’imparfait convient au cadre narratif passé indiqué par τότε, tandis que le pronom féminin renvoie naturellement, dans le contexte, à la réalité déjà évoquée sans la nommer plus précisément que le grec.
- source_word: πρὸς τὴν τῶν δεομένων θέλησιν
  choice: selon le désir de ceux qui étaient dans le besoin
  rationale: πρός avec θέλησις indique ici une conformité au désir ou au souhait. δεομένων peut désigner les personnes dans le besoin aussi bien que celles qui demandent; le texte principal retient le premier sens et signale l’autre en note.
theological_decisions:
- issue: Référent du sujet qui se transforme
  choice: Le sujet demeure exprimé par le pronom « elle », sans être explicitement identifié.
  alternative: Nommer directement la manne, la nourriture céleste ou la création.
  rationale: Le contexte permet notamment de penser à la nourriture céleste, mais la forme grecque n’explicite pas ici le nom du sujet. Le pronom préserve cette continuité littéraire et l’ouverture du référent.
- issue: Portée du don qui nourrit tous
  choice: Rendre παντοτρόφος par « qui nourrit tous les êtres ».
  alternative: « qui entretient tout » ou « qui nourrit chacun »
  rationale: La traduction garde la portée universelle du composé grec sans décider si elle vise seulement les bénéficiaires immédiats ou plus largement tous les êtres.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe participiale et l’image de la transformation sont conservées, tandis que « don qui nourrit tous les êtres » évite un néologisme peu naturel.
