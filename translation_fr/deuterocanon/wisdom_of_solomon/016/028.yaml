  text: so that it might be known that one must rise before the sun to give you thanks[b][a], and at the dawning of the light make petition to you.
translation:
  language: fr
  text: afin que l’on sache qu’il faut devancer le soleil pour te rendre grâce[a] et, dès que paraît la lumière, t’adresser une supplication[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « devancer le soleil pour l’action de grâce qui t’est adressée ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « te prier »; le verbe grec peut désigner le fait de s’adresser à quelqu’un pour lui présenter une requête.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως γνωστὸν ἦν
  choice: afin que l’on sache
  rationale: La tournure finale avec ὅπως exprime le but ou le résultat visé; le présent français rend naturellement la portée générale de ce qui doit être reconnu.
- source_word: δεῖ
  choice: il faut
  rationale: Cette tournure impersonnelle conserve l’idée d’une nécessité générale sans ajouter de sujet précis.
- source_word: φθάνειν τὸν ἥλιον
  choice: devancer le soleil
  rationale: Le verbe signifie ici arriver avant ou précéder. Cette formulation garde l’image poétique et la priorité temporelle du grec.
- source_word: ἐπʼ εὐχαριστίαν σου
  choice: pour te rendre grâce
  rationale: La formulation explicite en français l’action de grâce adressée à Dieu tout en restant proche de l’expression grecque elliptique.
- source_word: πρὸς ἀνατολὴν φωτός
  choice: dès que paraît la lumière
  rationale: L’expression désigne le lever ou l’apparition de la lumière à l’aube. Cette traduction naturelle conserve l’image sans la réduire nécessairement au lever visible du soleil.
- source_word: ἐντυγχάνειν σοι
  choice: t’adresser une supplication
  rationale: Avec le datif, le verbe peut désigner le fait de s’adresser à quelqu’un pour présenter une requête; «supplication» en garde la nuance sans l’élargir simplement à toute prière.
theological_decisions:
- issue: Obligation morale générale ou prescription liturgique précise de prière matinale
  choice: Une nécessité générale exprimée dans le langage de la dévotion matinale
  alternative: Une prescription formelle imposant une liturgie avant le lever du soleil
  rationale: Le grec emploie l’impersonnel δεῖ et des images poétiques de l’aube, mais ne précise ni rite ni institution liturgique.
- issue: Portée de ἐντυγχάνειν dans l’adresse à Dieu
  choice: Présenter une supplication
  alternative: Prier au sens large, ou rencontrer Dieu
  rationale: Le sens de requête adressée à quelqu’un convient au régime au datif et préserve la nuance pétitionnaire sans exclure le cadre plus large de la prière.
translation_notes:
  register: Français moderne, international et digne. « Devancer le soleil » conserve la poésie du grec; la suite emploie une syntaxe claire et accessible. Les deux notes signalent les nuances lexicales réelles sans imposer une pratique liturgique particulière.
