base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/009.yaml
  text: For those whom the bites of locusts and flies killed, no healing was found for their life, because they were worthy to be punished by such things;
translation:
  language: fr
  text: Car ceux que les morsures de sauterelles et de mouches avaient tués, on ne trouva aucun remède pour leur sauver la vie[a], parce qu’ils méritaient d’être punis par de telles choses[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aucun remède ne fut trouvé pour leur âme ». Ici, « vie » convient mieux au contexte de mort corporelle causée par les morsures.
    reason: lexical_alternative
  - marker: b
    text: Ou « par de telles créatures » ; le grec dit plus largement « par de telles choses ».
    reason: lexical_alternative
lexical_decisions:
- source_word: δήγματα
  choice: morsures
  rationale: Le terme désigne des morsures ou des piqûres infligées par des animaux. « Morsures » reste concret sans préciser davantage le mécanisme.
- source_word: ἀκρίδων
  choice: sauterelles
  rationale: ἀκρίς désigne couramment la sauterelle, notamment la sauterelle migratrice associée aux fléaux bibliques.
- source_word: μυιῶν
  choice: mouches
  rationale: C’est le sens ordinaire de μυῖα, sans raison contextuelle de préciser une espèce particulière.
- source_word: ἀπέκτεινεν
  choice: avaient tués
  rationale: Le verbe exprime directement le fait de causer la mort. Le plus-que-parfait s’intègre naturellement à la construction française introduite par « ceux que ».
- source_word: οὐχ εὑρέθη ἴαμα
  choice: on ne trouva aucun remède
  rationale: ἴαμα désigne un remède ou un moyen de guérison. Cette tournure française rend naturellement le passif grec tout en conservant l’idée d’une recherche infructueuse.
- source_word: τῇ ψυχῇ αὐτῶν
  choice: pour leur sauver la vie
  rationale: Dans ce contexte de mort physique causée par des animaux, ψυχή désigne vraisemblablement la vie. La formulation est idiomatique en français et ne présuppose pas une doctrine particulière de l’âme.
- source_word: ἄξιοι ἦσαν
  choice: ils méritaient
  rationale: La formule grecque exprime ici le fait d’être passible ou digne d’un châtiment. « Méritaient » en restitue clairement la portée morale en français courant.
- source_word: ὑπὸ τοιούτων
  choice: par de telles choses
  rationale: Le grec demeure volontairement général. Malgré son caractère légèrement marqué en français, cette formulation préserve cette largeur de sens sans remplacer les « choses » par les seules créatures.
- source_word: κολασθῆναι
  choice: d’être punis
  rationale: κολάζω désigne ici un châtiment judiciaire ou rétributif. « Être punis » est direct, naturel et théologiquement non amplifié.
theological_decisions:
- issue: Sens de ψυχή dans un contexte de mort et de guérison
  choice: vie
  alternative: âme
  rationale: Le propos porte sur une mort corporelle provoquée par des morsures et sur l’absence de remède. « Vie » convient donc au contexte immédiat, tandis qu’une note conserve l’autre traduction lexiquement possible.
- issue: Portée morale de ἄξιοι ἦσαν ... κολασθῆναι
  choice: parce qu’ils méritaient d’être punis
  alternative: parce qu’ils étaient dignes d’être punis
  rationale: Le texte présente explicitement leur mort comme un châtiment mérité. La formulation choisie conserve cette affirmation sans l’étendre au-delà du verset.
- issue: Référent de ὑπὸ τοιούτων
  choice: par de telles choses
  alternative: par de telles créatures
  rationale: Le grec peut renvoyer aux animaux mentionnés, mais sa formulation est plus large. Le texte principal garde cette indétermination et la note signale la lecture plus précise.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit de près le mouvement du grec tout en évitant une construction passive lourde. Les termes « vie » et « de telles choses » maintiennent respectivement le sens contextuel et l’indétermination du texte source.
