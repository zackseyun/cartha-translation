base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/022.yaml
  text: But snow and ice endured fire and did not melt[a], so that they might know that fire, blazing in the hail and flashing in the rainstorms, was destroying the fruits of the enemies;
translation:
  language: fr
  text: Mais la neige et la glace résistèrent au feu sans fondre, afin qu’ils sachent que le feu, brûlant au milieu de la grêle et lançant des éclairs dans les averses, détruisait les fruits des ennemis[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les récoltes des ennemis » ou « les produits des ennemis ». Le grec dit littéralement « les fruits des ennemis ».
    reason: Alternative lexicale permettant d’expliciter le sens agricole de καρπούς sans ajouter l’idée de terres ni l’imposer dans le texte principal.
lexical_decisions:
- source_word: χιὼν
  choice: neige
  rationale: Le sens ordinaire est « neige »; ce choix préserve la distinction avec χαλάζῃ, « grêle », plus loin dans le verset.
- source_word: κρύσταλλος
  choice: glace
  rationale: Dans ce contexte météorologique et en contraste avec l’action de fondre, « glace » est plus naturel que « cristal ».
- source_word: ὑπέμεινε πῦρ
  choice: résistèrent au feu
  rationale: « Résister au feu » rend clairement l’idée de demeurer intact sous son action, tout en exprimant naturellement le paradoxe en français.
- source_word: οὐκ ἐτήκετο
  choice: sans fondre
  rationale: Avec la neige et la glace comme sujets, « fondre » est l’équivalent français direct et idiomatique.
- source_word: ἵνα γνῶσιν
  choice: afin qu’ils sachent
  rationale: Cette formulation conserve la valeur de but de ἵνα avec le subjonctif, sans préciser l’identité du sujet implicite.
- source_word: κατέφθειρε
  choice: détruisait
  rationale: L’imparfait grec décrit une action en cours; l’imparfait français en restitue naturellement l’aspect.
- source_word: φλεγόμενον
  choice: brûlant
  rationale: Le participe qualifie directement le feu et garde l’image vive sans l’amplifier.
- source_word: ἐν τῇ χαλάζῃ
  choice: au milieu de la grêle
  rationale: Cette expression rend la présence paradoxale du feu dans la grêle de façon claire et naturelle.
- source_word: ἐν τοῖς ὑετοῖς
  choice: dans les averses
  rationale: « Averses » rend le pluriel et convient au contexte de pluies violentes, dans un français plus naturel que « dans les pluies ».
- source_word: διαστράπτον
  choice: lançant des éclairs
  rationale: Le verbe évoque des lueurs semblables à l’éclair; cette tournure conserve cette image météorologique.
- source_word: τοὺς τῶν ἐχθρῶν καρποὺς
  choice: les fruits des ennemis
  rationale: Cette traduction reste proche de καρπούς et maintient sa portée agricole générale; une note signale les formulations contextuelles plus explicites.
theological_decisions:
- issue: Valeur de la proposition de but et référent du sujet de γνῶσιν
  choice: « afin qu’ils sachent », sans identifier davantage le sujet
  alternative: Préciser qu’il s’agit des ennemis ou, plus généralement, des témoins de l’événement
  rationale: Le verbe grec est au pluriel mais son sujet n’est pas exprimé. La traduction préserve cette ambiguïté au lieu de déterminer qui devait reconnaître le jugement manifesté par le prodige.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple « résistèrent » présente l’événement ponctuel, tandis que l’imparfait « détruisait » reflète l’action continue exprimée par le grec. Les images paradoxales du feu dans la grêle et les averses sont conservées.
