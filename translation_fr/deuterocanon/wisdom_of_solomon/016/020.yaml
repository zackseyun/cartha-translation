base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/020.yaml
  text: Instead of these things[a], you fed your people with the food of angels, and without their labor you sent them ready bread from heaven, able to satisfy every delight and suited to every taste.
translation:
  language: fr
  text: Au lieu de ces choses, tu as nourri ton peuple de la nourriture des anges[a] et, sans qu’ils aient à peiner, tu leur as envoyé du ciel un pain tout préparé, capable de procurer tout plaisir et adapté à tous les goûts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une nourriture des anges » ou « une nourriture digne des anges ». L’expression grecque ne permet pas de préciser davantage le rapport avec les anges.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθʼ ὧν
  choice: Au lieu de ces choses
  rationale: La formule marque ici le contraste entre les châtiments précédents et la manière différente dont Dieu a traité son peuple.
- source_word: ἀγγέλων τροφήν
  choice: la nourriture des anges
  rationale: Cette traduction naturelle conserve le génitif grec sans préciser s’il s’agit d’une nourriture appartenant aux anges ou digne d’eux.
- source_word: ἐψώμισας
  choice: tu as nourri
  rationale: Le verbe signifie donner à manger ou nourrir; ce choix convient au registre du passage et à l’objet «ton peuple».
- source_word: ἕτοιμον ἄρτον
  choice: un pain tout préparé
  rationale: Cette formulation rend l’idée d’un pain prêt, déjà pourvu par Dieu, dans un français courant.
- source_word: ἀπʼ οὐρανοῦ
  choice: du ciel
  rationale: Rend directement et naturellement l’origine céleste du pain.
- source_word: ἀκοπιάτως
  choice: sans qu’ils aient à peiner
  rationale: L’adverbe indique l’absence de peine ou de labeur; la tournure explicite naturellement que le peuple n’a pas eu à produire cette nourriture.
- source_word: πᾶσαν ἡδονὴν ἰσχύοντα
  choice: capable de procurer toutes les délices
  rationale: ἰσχύοντα exprime la capacité ou l’efficacité du pain, tandis que ἡδονή désigne le plaisir ou les délices; la formulation évite le calque obscur tout en conservant cette relation.
- source_word: πρὸς πᾶσαν ἁρμόνιον γεῦσιν
  choice: adapté à tous les goûts
  rationale: La formule rend idiomatiquement l’idée d’une nourriture accordée ou convenant à toute saveur et à tout palais.
theological_decisions:
- issue: Nature de la «nourriture des anges»
  choice: Conserver l’expression sans expliquer davantage le rapport entre les anges et cette nourriture.
  alternative: «une nourriture digne des anges» ou «une nourriture venue par les anges»
  rationale: Le génitif grec ne tranche pas entre ces interprétations. Le texte met l’accent sur le don céleste sans développer une doctrine des anges.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement suit l’adresse directe à Dieu. «Tout préparé» et «sans qu’ils aient à peiner» rendent le grec avec naturel sans effacer l’idée d’une provision divine prête à être reçue.
