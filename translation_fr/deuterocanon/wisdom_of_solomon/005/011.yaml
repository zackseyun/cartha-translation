base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/011.yaml
  text: 'or like a bird flying through the air: no evidence of its path is found[a], though the light air, whipped by the stroke of its pinions and split by force with the whirring of moving wings, was traversed[b], and after that no sign of its passage was found in it.'
translation:
  language: fr
  text: 'ou comme un oiseau qui traverse les airs en volant : on ne trouve aucun indice de son trajet[a] ; l’air léger, fouetté par les coups de ses ailes et fendu avec force par le sifflement de ses ailes en mouvement, a été traversé[b], et après cela, on n’y trouve aucun signe de son passage.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aucune preuve de son parcours ». Le grec τεκμήριον peut désigner un indice probant, et πορεία le trajet accompli.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, la phrase décrit « l’air léger » comme fouetté, fendu puis traversé par le passage de l’oiseau ; le grec emploie une construction passive centrée sur l’air.
    reason: imagery_clarification
lexical_decisions:
- source_word: ὀρνέου
  choice: oiseau
  rationale: Nom générique au singulier, sans précision d’espèce.
- source_word: διιπτάντος ἀέρα
  choice: qui traverse les airs en volant
  rationale: Rend explicitement le mouvement de vol à travers l’air; le pluriel français « les airs » est idiomatique dans cette image.
- source_word: τεκμήριον πορείας
  choice: indice de son trajet
  rationale: τεκμήριον désigne un indice probant ou une marque permettant d’établir le parcours; « trajet » convient à πορεία dans ce contexte.
- source_word: πληγῇ μαστιζόμενον ταρσῶν
  choice: fouetté par les battements de ses rémiges
  rationale: Conserve la métaphore énergique de μαστιζόμενον et la précision anatomique de ταρσῶν, qui désigne ici les parties portantes de l’aile.
- source_word: πνεῦμα κοῦφον
  choice: l’air léger
  rationale: Dans cette scène de vol, πνεῦμα renvoie au milieu aérien déplacé par l’oiseau; « léger » préserve κοῦφον sans transformer l’air en vent déterminé.
- source_word: σχιζόμενον βίᾳ ῥοιζῷ
  choice: fendu avec force par le bruissement
  rationale: Préserve l’image de l’air séparé avec violence et la valeur sonore de ῥοιζός; « bruissement » reste naturel et digne, sans imposer un son trop précis.
- source_word: κινουμένων πτερύγων
  choice: de ses ailes en mouvement
  rationale: Rendu proche du grec, tout en attribuant naturellement les ailes à l’oiseau.
- source_word: διωδεύθη
  choice: a bien été traversé
  rationale: Maintient la construction passive centrée sur l’air; « bien » souligne le contraste entre le passage réel et l’absence de trace, sans ajouter de contenu substantiel.
- source_word: σημεῖον ἐπιβάσεως
  choice: signe de son passage
  rationale: Formulation française naturelle qui distingue σημεῖον de τεκμήριον tout en exprimant le transit de l’oiseau.
