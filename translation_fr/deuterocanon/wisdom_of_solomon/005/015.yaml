base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/015.yaml
  text: But the righteous live forever[a], and their reward is with the Lord[b], and their care is with the Most High.
translation:
  language: fr
  text: Mais les justes vivent pour toujours, leur récompense est auprès du Seigneur[a], et leur bien-être est auprès du Très-Haut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le Seigneur ». La préposition grecque peut être traduite plus littéralement ainsi.
    reason: lexical_alternative
  - marker: b
    text: Ou « le Très-Haut prend soin d’eux » ou, plus littéralement, « leur souci est auprès du Très-Haut ». L’expression grecque est concise et peut évoquer leur bien-être, la sollicitude du Très-Haut à leur égard ou leur propre préoccupation.
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιοι
  choice: les justes
  rationale: L’adjectif substantivé désigne les personnes caractérisées par la justice. « Les justes » est naturel en français biblique moderne et conserve la portée morale et théologique du grec.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Cette locution exprime ici une durée sans fin. « Pour toujours » rend l’idiome grec dans un français courant et digne.
- source_word: ζῶσιν
  choice: vivent
  rationale: Le présent indique la vie continue des justes ; « vivent » en est la traduction directe.
- source_word: ἐν Κυρίῳ
  choice: auprès du Seigneur
  rationale: Bien que ἐν signifie normalement « dans », le contexte évoque ici une récompense qui se trouve en la présence ou sous la garde du Seigneur. « Auprès du Seigneur » est naturel et fait écho à παρὰ Ὑψίστῳ.
- source_word: ὁ μισθὸς αὐτῶν
  choice: leur récompense
  rationale: Dans ce contexte sapientiel, μισθός désigne la rétribution accordée aux justes plutôt qu’un simple salaire.
- source_word: ἡ φροντὶς αὐτῶν
  choice: prend soin d’eux
  rationale: φροντίς peut exprimer le soin, la sollicitude ou la préoccupation. La tournure verbale donne un français naturel et rend le sens probable selon lequel le Très-Haut veille sur eux, tandis qu’une note conserve les autres lectures possibles.
- source_word: παρὰ Ὑψίστῳ
  choice: le Très-Haut prend soin d’eux
  rationale: παρά avec le datif situe cette sollicitude auprès du Très-Haut. La formulation française explicite la relation implicite dans la proposition nominale grecque sans introduire de précision doctrinale étrangère.
theological_decisions:
- issue: Sens de ἡ φροντὶς αὐτῶν
  choice: le Très-Haut prend soin d’eux
  alternative: leur bien-être est auprès du Très-Haut ; le souci qu’ils portent est auprès du Très-Haut
  rationale: La construction grecque est concise et peut renvoyer soit à la sollicitude du Très-Haut pour les justes, soit à leur bien-être placé auprès de lui, voire à leur propre préoccupation. Le texte principal retient le sens contextuellement le plus naturel, et la note signale l’ambiguïté réelle.
- issue: Traduction de ἐν Κυρίῳ
  choice: auprès du Seigneur
  alternative: dans le Seigneur
  rationale: La traduction strictement formelle « dans le Seigneur » reste possible, mais peut suggérer en français une union mystique que le contexte n’impose pas. « Auprès du Seigneur » exprime mieux ici la présence ou la garde, tout en maintenant l’écho avec la proposition suivante.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination simple reproduit le rythme ternaire du grec. Les titres « Seigneur » et « Très-Haut » conservent le registre théologique de la source.
