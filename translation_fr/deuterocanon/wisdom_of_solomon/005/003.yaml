base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/003.yaml
  text: 'They will say among themselves[a], repenting, and will groan because of anguish of spirit: “This is the one whom we once held in derision.”'
translation:
  language: fr
  text: 'Ils diront en eux-mêmes[a], pleins de repentir, et gémiront à cause de l’angoisse de leur esprit : « C’est celui que nous tournions autrefois en dérision. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « entre eux » ou « entre eux-mêmes ». L’expression grecque peut évoquer une réflexion intérieure ou des paroles échangées au sein du groupe.
    reason: ambiguïté syntaxique et sémantique
lexical_decisions:
- source_word: ἐροῦσιν
  choice: Ils diront
  rationale: Le futur actif de λέγω introduit directement les paroles à venir ; « diront » est simple et naturel.
- source_word: ἐν ἑαυτοῖς
  choice: en eux-mêmes
  rationale: Cette formulation conserve en premier lieu la dimension intérieure de la réflexion, tout en signalant en note la possibilité d’un échange au sein du groupe.
- source_word: μετανοοῦντες
  choice: pleins de repentir
  rationale: Le participe présent décrit leur disposition pendant qu’ils parlent. « Repentir » maintient la portée morale du grec sans préciser si ce repentir aboutit au salut.
- source_word: διὰ στενοχωρίαν πνεύματος
  choice: à cause de l’angoisse de leur esprit
  rationale: στενοχωρία exprime une détresse intense, et πνεύματος désigne ici leur être intérieur ; la traduction conserve à la fois l’intensité et le langage de l’esprit.
- source_word: στενάξονται
  choice: gémiront
  rationale: Le futur de στενάζω évoque l’expression audible d’une profonde détresse ; « gémiront » convient au registre et à l’intensité du contexte.
- source_word: Οὗτος ἦν
  choice: C’est celui
  rationale: Cette tournure française naturelle désigne la personne maintenant reconnue, tandis que la proposition relative situe clairement le mépris dans le passé.
- source_word: ἔσχομέν ποτε εἰς γέλωτα
  choice: que nous tournions autrefois en dérision
  rationale: La construction ἔχω εἰς indique ici la manière dont ils le considéraient ou le traitaient. « Tourner en dérision » rend clairement l’idée d’en faire un objet de moquerie.
theological_decisions:
- issue: Portée de μετανοοῦντες dans les paroles des impies
  choice: pleins de repentir
  alternative: saisis de remords
  rationale: Le terme grec exprime un retournement moral plus fort qu’un simple regret, mais le contexte ne dit pas que ce repentir mène au salut. La traduction laisse cette tension théologique ouverte.
translation_notes:
  register: 'Français international moderne, naturel et digne. La phrase garde le mouvement du grec : parole intérieure ou collective, repentir, gémissement, puis reconnaissance de celui qui avait été méprisé.'
