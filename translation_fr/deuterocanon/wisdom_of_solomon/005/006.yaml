base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/006.yaml
  text: So then we went astray from the way of truth[a], and the light of righteousness did not shine on us, and the sun did not rise for us.
translation:
  language: fr
  text: Ainsi donc, nous nous sommes égarés loin du chemin de la vérité, la lumière de la justice[a] n’a pas brillé sur nous, et le soleil ne s’est pas levé pour nous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la lumière de la droiture ». Le grec δικαιοσύνη peut évoquer à la fois la rectitude morale et la justice.
    reason: alternative lexicale destinée à préserver l’étendue sémantique du terme grec
lexical_decisions:
- source_word: ἄρα
  choice: Ainsi donc
  rationale: Introduit la conclusion rétrospective tirée par les impies, avec une valeur à la fois déductive et réfléchie.
- source_word: ἐπλανήθημεν
  choice: nous nous sommes égarés
  rationale: Rend naturellement en français la forme passive employée avec une valeur intransitive, sans supposer un agent extérieur qui les aurait trompés.
- source_word: ἀπὸ ὁδοῦ ἀληθείας
  choice: loin du chemin de la vérité
  rationale: Conserve l’image concrète du chemin; « loin de » exprime idiomatiquement l’éloignement marqué par ἀπό après le verbe s’égarer.
- source_word: τὸ τῆς δικαιοσύνης φῶς
  choice: la lumière de la justice
  rationale: Construction génitive rendue directement. En français moderne, « justice » couvre ici plus naturellement la rectitude morale et la juste conduite, tout en gardant une possible nuance judiciaire.
- source_word: οὐκ ἔλαμψεν ἡμῖν
  choice: n’a pas brillé sur nous
  rationale: Expression française naturelle qui conserve l’image de la lumière atteignant les locuteurs.
- source_word: ὁ ἥλιος
  choice: le soleil
  rationale: Équivalent lexical direct, sans nécessité de paraphrase.
- source_word: οὐκ ἀνέτειλεν ἡμῖν
  choice: ne s’est pas levé pour nous
  rationale: Préserve le mouvement du lever du soleil et la relation, voire la privation, exprimée par le datif ἡμῖν.
theological_decisions:
- issue: Portée de δικαιοσύνη
  choice: justice
  alternative: droiture
  rationale: δικαιοσύνη peut désigner aussi bien la rectitude morale que la justice. « Justice » demeure le terme français le plus ample et le plus digne dans ce contexte; une note préserve explicitement l’autre nuance sans trancher artificiellement.
translation_notes:
  register: Français international moderne, courant et digne. Le parallélisme des trois propositions et les images du chemin, de la lumière et du soleil sont conservés; la ponctuation maintient leur progression cumulative.
