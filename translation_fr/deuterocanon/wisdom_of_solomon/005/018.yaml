  text: He will put on righteousness as a breastplate, and will place sincere judgment as a helmet;
translation:
  language: fr
  text: Il revêtira la justice comme une cuirasse[a] et mettra pour casque un jugement sans hypocrisie[b] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la droiture comme une cuirasse ». Le grec δικαιοσύνη peut exprimer à la fois la justice et la droiture.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire un jugement authentique, sans duplicité ni partialité.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἐνδύσεται
  choice: Il revêtira
  rationale: Le futur moyen exprime l’action de se revêtir d’une armure ; « revêtira » est naturel, digne et maintient l’image martiale.
- source_word: θώρακα
  choice: cuirasse
  rationale: Terme français courant pour l’armure protégeant le torse dans l’imagerie biblique.
- source_word: δικαιοσύνης
  choice: justice
  rationale: δικαιοσύνη peut désigner la justice ou la droiture. Ici, appliqué à l’action judiciaire de Dieu et associé à κρίσις, « justice » convient naturellement, tandis que « droiture » reste signalé en note.
- source_word: περιθήσεται
  choice: mettra pour casque
  rationale: Le futur moyen de περιτίθημι signifie mettre autour de soi ou sur soi. Cette formulation française est idiomatique tout en conservant l’action distincte du premier verbe.
- source_word: κόρυθα
  choice: casque
  rationale: Équivalent direct et naturel du terme grec désignant une protection militaire de la tête.
- source_word: κρίσιν
  choice: jugement
  rationale: Le mot désigne ici l’exercice ou la décision du jugement, sens judiciaire qu’il importe de préserver.
- source_word: ἀνυπόκριτον
  choice: sans hypocrisie
  rationale: Rendu formel qui conserve l’expression grecque et son ambiguïté entre authenticité, absence de duplicité et impartialité, sans choisir silencieusement un seul effet contextuel.
theological_decisions:
- issue: Sens de δικαιοσύνη dans la métaphore de l’armure divine
  choice: justice
  alternative: droiture
  rationale: Le contexte de jugement divin favorise « justice », mais le grec porte aussi une dimension de rectitude morale ; la note préserve cette possibilité.
- issue: Portée de ἀνυπόκριτον qualifiant κρίσιν
  choice: jugement sans hypocrisie
  alternative: jugement impartial / jugement sincère
  rationale: La traduction littérale préserve la tension sémantique du grec. « Impartial » explicite un effet probable mais réduit le sens à l’absence de favoritisme ; « sincère » est moins naturel avec « jugement » en français.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe conserve le parallélisme et l’imagerie de l’armure. « Sans hypocrisie » maintient volontairement la formulation frappante du grec, précisée en note.
