base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/007.yaml
  text: We were filled with paths of lawlessness and destruction[a], and we traveled through trackless deserts[b], but the way of the Lord we did not know.
translation:
  language: fr
  text: Nous avons été remplis de sentiers d’iniquité et de destruction[a], et nous avons traversé des déserts impraticables[b] ; mais nous n’avons pas connu le chemin du Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, en rendant les noms abstraits de manière plus explicite : « des sentiers marqués par l’iniquité et la destruction ».'
    reason: Les deux génitifs grecs peuvent caractériser « sentiers » ; la traduction principale conserve plus étroitement leur formulation.
  - marker: b
    text: 'Ou : « des déserts sans chemin » ou « inaccessibles ».'
    reason: ἀβάτους peut souligner soit l’absence de voie praticable, soit le caractère inaccessible ou impossible à traverser.
lexical_decisions:
- source_word: ἀνομίας
  choice: d’iniquité
  rationale: Le génitif abstrait caractérise les « sentiers ». « Iniquité » conserve la portée morale et le registre solennel du terme grec.
- source_word: ἐνεπλήσθημεν
  choice: nous nous sommes rassasiés
  rationale: L’aoriste passif exprime le fait d’être rempli ou repu. Cette tournure française garde l’image d’une satiété morale sans produire l’expression peu naturelle « remplis de sentiers ».
- source_word: τρίβοις
  choice: de sentiers
  rationale: Le mot désigne des pistes ou sentiers frayés. « Sentiers » convient au contraste avec le « chemin du Seigneur ».
- source_word: ἀπωλείας
  choice: de perdition
  rationale: Le nom peut désigner la destruction, la ruine ou la perdition. « Perdition » restitue ici à la fois la gravité morale et l’issue funeste.
- source_word: διωδεύσαμεν
  choice: nous avons traversé
  rationale: Le verbe signifie passer ou cheminer à travers un lieu ; « traversé » est précis et naturel.
- source_word: ἐρήμους ἀβάτους
  choice: des déserts impraticables
  rationale: ἐρήμους évoque des régions désertes, tandis que ἀβάτους indique qu’on ne peut les parcourir ou y accéder. « Impraticables » conserve cette difficulté sans la réduire à la seule absence de pistes.
- source_word: ὁδὸν Κυρίου
  choice: le chemin du Seigneur
  rationale: La formulation préserve l’image biblique du chemin, qui peut désigner ici une voie concrète ou, selon le parallélisme, une conduite conforme au Seigneur.
- source_word: οὐκ ἔγνωμεν
  choice: nous n’avons pas connu
  rationale: Cette traduction directe conserve la valeur de connaissance ou de reconnaissance ainsi que le ton d’aveu.
theological_decisions:
- issue: Sens du « chemin du Seigneur »
  choice: Conserver l’expression imagée « le chemin du Seigneur » sans l’expliciter.
  alternative: Traduire explicitement par « la conduite voulue par le Seigneur » ou comprendre un itinéraire concret.
  rationale: Le contraste avec les sentiers d’iniquité favorise un sens moral et spirituel, mais l’image grecque permet une certaine tension entre parcours concret et manière de vivre.
translation_notes:
  register: Français international moderne, digne et lisible. Le choix de « rassasiés » conserve l’image grecque inhabituelle tout en évitant une construction littérale difficilement naturelle ; « iniquité », « perdition » et « Seigneur » maintiennent le registre sapientiel et biblique.
