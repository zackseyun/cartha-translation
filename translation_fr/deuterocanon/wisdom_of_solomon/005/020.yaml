base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/020.yaml
  text: He will sharpen severe wrath into a sword[a], and the world will join battle with him against the senseless.
translation:
  language: fr
  text: Il aiguisera sa colère implacable pour en faire une épée, et le monde combattra avec lui contre les insensés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « contre ceux qui ont perdu le sens ». Le terme grec désigne ici des personnes irrationnelles ou moralement égarées dans leur opposition à Dieu, sans renvoyer nécessairement à une maladie mentale au sens clinique.
    reason: Précision lexicale visant à préserver la force de παράφρονας sans connotation clinique indue.
lexical_decisions:
- source_word: ὀξυνεῖ
  choice: aiguisera
  rationale: Le futur de ὀξύνω signifie littéralement « aiguiser » et maintient l’image de l’arme.
- source_word: ἀπότομον ὀργὴν
  choice: sa colère implacable
  rationale: ἀπότομος peut évoquer ce qui est tranchant, abrupt ou rigoureux. Avec ὀργή, « implacable » exprime naturellement la sévérité inflexible de cette colère, tandis que le verbe conserve l’image du tranchant. Le possessif est idiomatique en français et son référent reste implicite comme en grec.
- source_word: εἰς ῥομφαίαν
  choice: pour en faire une épée
  rationale: 'εἰς marque ici le résultat figuré : la colère est aiguisée de manière à devenir une épée. Cette formulation rend clairement l’image en français.'
- source_word: συνεκπολεμήσει
  choice: combattra avec lui
  rationale: Le verbe composé désigne le fait de prendre part au combat aux côtés de quelqu’un. La formulation reste naturelle sans expliciter l’identité du pronom.
- source_word: ὁ κόσμος
  choice: le monde
  rationale: κόσμος désigne ici le monde ordonné, voire l’ensemble de la création, mobilisé dans le jugement. « Le monde » est direct et laisse subsister cette portée cosmique.
- source_word: ἐπὶ τοὺς παράφρονας
  choice: contre les insensés
  rationale: παράφρων qualifie ceux qui agissent sans raison ou de manière moralement dévoyée. « Insensés » conserve la force polémique sans suggérer nécessairement un diagnostic psychiatrique.
theological_decisions:
- issue: Référent de αὐτῷ (« avec lui »)
  choice: Conserver le pronom « lui » sans nommer explicitement son référent.
  alternative: Traduire « avec Dieu » ou rapporter indirectement le pronom au juste.
  rationale: Le contexte du jugement divin invite à comprendre que le monde combat aux côtés de Dieu, mais le verset grec ne nomme pas expressément le référent. Le pronom préserve cette légère ambiguïté.
translation_notes:
  register: Français moderne, digne et accessible. L’image martiale est conservée, de même que le pronom grec non explicité. « Implacable » évite l’expression peu naturelle « colère tranchante » tout en rendant la rigueur de ἀπότομον.
