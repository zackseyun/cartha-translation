  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/017.yaml
  text: He will take his zeal as full armor[a], and he will arm creation for defense against enemies[b];
translation:
  language: fr
  text: Il prendra son zèle pour armure complète[a] et armera la création pour repousser des ennemis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa jalousie » à la place de « son zèle ». Le grec ζῆλος peut avoir l’un ou l’autre sens selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, le verbe grec signifie « fera de la création une arme » ou « équipera la création comme une arme ». « Armera la création » en exprime naturellement le sens.
    reason: lexical_alternative
lexical_decisions:
- source_word: λήμψεται
  choice: Il prendra
  rationale: Le futur moyen de λαμβάνω signifie ici « prendre »; ce choix convient à l’image du guerrier qui revêt son équipement.
- source_word: πανοπλίαν
  choice: armure complète
  rationale: Le terme désigne l’ensemble de l’équipement défensif et offensif d’un combattant; « armure complète » en conserve la portée sans recourir au mot plus rare « panoplie ».
- source_word: τὸν ζῆλον αὐτοῦ
  choice: son zèle
  rationale: ζῆλος peut exprimer le zèle, l’ardeur ou la jalousie. Dans cette scène de jugement, « zèle » demeure naturel et laisse ouverte la nuance signalée en note.
- source_word: ὁπλοποιήσει
  choice: armera
  rationale: Le verbe évoque littéralement le fait de fabriquer ou de fournir des armes. « Armera » rend clairement et naturellement l’idée que la création devient l’instrument du combat divin.
- source_word: τὴν κτίσιν
  choice: la création
  rationale: κτίσις renvoie ici à l’ordre créé dans son ensemble, mobilisé par Dieu.
- source_word: εἰς ἄμυναν ἐχθρῶν
  choice: pour repousser ses ennemis
  rationale: ἄμυνα désigne la défense ou l’action de repousser. Cette formulation française est idiomatique; le possessif explicite le rapport contextuel entre le guerrier divin et les ennemis, sans modifier le référent.
theological_decisions:
- issue: Référent du sujet sous-entendu
  choice: Le pronom « Il » renvoie à Dieu, présenté comme un guerrier dans le contexte immédiat.
  alternative: Une personnification plus abstraite de la justice divine.
  rationale: Le grec emploie un sujet masculin singulier sous-entendu, et le contexte présente le Seigneur agissant en guerrier. La traduction conserve cette continuité sans ajouter de titre divin.
- issue: Sens de ζῆλος dans l’image du guerrier divin
  choice: Le zèle de Dieu est métaphoriquement son armure complète.
  alternative: Sa jalousie est son armure complète.
  rationale: « Zèle » préserve l’intensité de l’action divine sans imposer la nuance affective plus étroite de « jalousie »; l’ambiguïté lexicale authentique est conservée en note.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’image militaire est conservée avec « armure complète » et « armera ». La proposition finale est formulée de manière idiomatique, sans atténuer l’action de la création mobilisée contre les ennemis.
