  to: Car l’espérance de l’impie est comme un duvet emporté par le vent, comme une fine couche de givre chassée par la tempête, comme une fumée que le vent disperse ; elle passe comme le souvenir d’une personne de passage qui n’a logé qu’un jour.[a]
  rationale: La seule correction porte sur la dernière image. Elle remplace « voyageur » par une expression qui rend la notion grecque de logement temporaire, et elle harmonise la note avec ce choix. Les autres formulations rendent correctement le grec et ne nécessitent pas de modification.
