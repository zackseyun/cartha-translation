review_pass:
  verdict: revise
  source_fidelity: Le verset rend fidèlement la succession des quatre comparaisons et la portée religieuse de ἀσεβοῦς. Toutefois, « voyageur » pour καταλύτου introduit l’idée de déplacement, alors que le mot grec désigne plus précisément une personne logée temporairement. La révision conserve l’image et restitue cette nuance sans surcharge.
  naturalness: Le français est moderne, fluide et d’un registre approprié. « Personne de passage qui n’a logé qu’un jour » est plus précis que « voyageur qui n’a séjourné qu’un jour » tout en restant naturel.
  terminology: « Espérance », « impie », « duvet », « givre », « tempête » et « fumée » conviennent. La note doit également éviter « hôte », mot potentiellement ambigu en français, et expliciter la valeur de séjour temporaire de καταλύτου.
  issues:
  - severity: medium
    issue: « voyageur » ne rend pas exactement καταλύτου
    rationale: καταλύτης renvoie à quelqu’un qui loge ou fait halte temporairement; il ne désigne pas nécessairement un voyageur. « Personne de passage qui n’a logé qu’un jour » préserve le caractère temporaire du logement.
  - severity: low
    issue: La note emploie « hôte », terme ambigu
    rationale: En français, « hôte » peut désigner la personne accueillie ou celle qui accueille. Une formulation avec « personne de passage » évite cette ambiguïté et correspond mieux au grec.
