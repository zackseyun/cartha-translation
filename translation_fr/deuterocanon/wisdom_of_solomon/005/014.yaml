base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/014.yaml
  text: For the hope of the ungodly is like down carried by the wind[a], and like thin frost driven away by a storm, and like smoke dispersed by the wind, and passes by like the remembrance of a one-day guest.
translation:
  language: fr
  text: Car l’espérance de l’impie est comme un duvet emporté par le vent, comme une fine couche de givre chassée par la tempête, comme une fumée que le vent disperse ; elle passe comme le souvenir d’une personne de passage qui n’a logé qu’un jour.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme la mention d’une personne de passage qui n’a logé qu’un jour ». Le grec peut signifier « souvenir » ou « mention » ; il désigne une personne qui séjourne temporairement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπὶς
  choice: espérance
  rationale: « Espérance » rend naturellement l’attente confiante tout en convenant au contraste moral du contexte.
- source_word: ἀσεβοῦς
  choice: de l’impie
  rationale: Le terme désigne celui qui manque de respect envers Dieu ou vit sans piété ; « impie » conserve cette orientation religieuse.
- source_word: χνοῦς
  choice: duvet
  rationale: Le mot évoque une matière légère et duveteuse facilement emportée, plutôt que la balle des céréales.
- source_word: πάχνη … λεπτὴ
  choice: une fine couche de givre
  rationale: πάχνη désigne le givre, et λεπτὴ en souligne la finesse et la fragilité ; cette formulation est claire en français moderne.
- source_word: λαίλαπος
  choice: tempête
  rationale: Le terme exprime un phénomène venteux violent ; « tempête » est courant et suffisamment vigoureux.
- source_word: διωχθεῖσα
  choice: chassée
  rationale: Le participe passif présente le givre comme repoussé avec force par la tempête.
- source_word: καπνὸς … διεχύθη
  choice: une fumée que le vent disperse
  rationale: Dans cette image, le verbe décrit la dissipation de la fumée ; le présent français harmonise la série comparative sans changer sa portée.
- source_word: μνεία
  choice: souvenir
  rationale: Le nom peut signifier souvenir ou mention ; ici, l’image porte naturellement sur ce qui ne demeure pas dans la mémoire.
- source_word: καταλύτου μονοημέρου
  choice: d’un voyageur qui n’a séjourné qu’un jour
  rationale: καταλύτης désigne une personne qui fait halte ou loge temporairement, et μονοήμερος précise la durée d’un seul jour.
theological_decisions:
- issue: Rendu de ἀσεβοῦς
  choice: l’impie
  alternative: le méchant ; celui qui ne respecte pas Dieu
  rationale: « L’impie » préserve la dimension de rapport à Dieu sans réduire le terme à une méchanceté morale générale ni développer une paraphrase dans le texte.
- issue: Sujet de παρῴδευσεν
  choice: elle passe, avec « l’espérance » comme reprise grammaticale
  alternative: il passe, en rattachant le verbe au souvenir ou au voyageur
  rationale: Le grec laisse la transition de la série d’images assez serrée. En français, reprendre « l’espérance » donne une phrase intelligible tout en conservant l’idée centrale de son caractère fugitif.
translation_notes:
  register: Français international moderne, digne et imagé. La répétition de « comme » conserve le rythme des comparaisons grecques. « Une fine couche de givre » évite une tournure artificielle, tandis que « voyageur qui n’a séjourné qu’un jour » explicite naturellement l’idée de logement temporaire.
