base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/012.yaml
  text: 'or like an arrow shot at a target: the air[a], once cut through, immediately closed up on itself, so that its path could not be known.'
translation:
  language: fr
  text: 'ou comme une flèche lancée vers une cible : l’air, une fois fendu, se referme aussitôt sur lui-même, si bien qu’on ne peut connaître le chemin qu’elle a suivi[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son passage » ou « sa trajectoire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: βέλους βληθέντος ἐπὶ σκοπόν
  choice: une flèche tirée vers une cible
  rationale: βέλος désigne ici naturellement une flèche, et le participe de βάλλω son lancement vers l’objet visé. Cette formulation conserve clairement l’image du tir à l’arc.
- source_word: τμηθεὶς ὁ ἀήρ
  choice: l’air qu’elle a fendu
  rationale: Le participe passif décrit l’air séparé par le passage de la flèche. « Fendre l’air » restitue l’image concrète dans un français naturel.
- source_word: εὐθέως εἰς ἑαυτὸν ἀνελύθη
  choice: se referme aussitôt
  rationale: L’expression indique que l’air divisé se rassemble immédiatement. « Se referme » rend clairement le phénomène évoqué sans reproduire artificiellement l’expression grecque mot à mot.
- source_word: ὡς ἀγνοῆσαι
  choice: si bien qu’on ne peut discerner
  rationale: ὡς suivi de l’infinitif exprime ici le résultat. La tournure française garde cette relation logique et le caractère impersonnel de l’énoncé.
- source_word: τὴν δίοδον αὐτοῦ
  choice: son passage
  rationale: δίοδος désigne la voie empruntée ou le passage à travers un milieu. « Son passage » convient à la trace momentanée de la flèche dans l’air, tandis que le possessif conserve la formulation du grec.
