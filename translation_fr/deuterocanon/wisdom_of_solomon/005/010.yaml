  text: like a ship passing through surging water[a], after it has gone by no trace can be found, nor the track of its keel in the waves[b];
translation:
  language: fr
  text: 'comme un navire qui traverse une eau agitée par les vagues[a] : après son passage, on ne trouve aucune trace, pas même la trace de sa quille dans les vagues[b] ;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une eau soulevée par les vagues ». Le grec décrit une eau mise en mouvement et formant des vagues.
    reason: lexical_alternative
  - marker: b
    text: Le grec dit littéralement « le chemin de sa quille ». Le terme rendu par « quille » est un terme nautique; l’expression évoque la trace éphémère laissée dans les vagues.
    reason: lexical_clarification
lexical_decisions:
- source_word: ναῦς
  choice: navire
  rationale: Terme naturel et digne pour un bâtiment naviguant sur une étendue d’eau; il convient mieux que « bateau » à l’ampleur de la comparaison.
- source_word: διερχομένη
  choice: qui traverse
  rationale: Rend clairement le mouvement à travers l’eau exprimé par le participe.
- source_word: κυμαινόμενον ὕδωρ
  choice: une eau agitée par les vagues
  rationale: Le participe de κυμαίνω décrit une eau soulevée ou mise en mouvement par des vagues; cette formulation conserve explicitement cette image.
- source_word: ἧς διαβάσης
  choice: une fois passé
  rationale: Le génitif absolu marque l’antériorité accomplie du passage du navire par rapport à l’impossibilité d’en retrouver la trace.
- source_word: ἴχνος
  choice: trace
  rationale: Équivalent courant qui désigne tout signe visible laissé après le passage.
- source_word: ἀτραπός
  choice: sillage
  rationale: Dans cette image nautique, « sillage » exprime naturellement la voie ou trace temporaire laissée par le navire, sans la réduire à un chemin terrestre.
- source_word: τρόπιος αὐτῆς
  choice: de sa quille
  rationale: Le terme nautique τρόπις désigne la quille; le complément conserve l’image précise de la trace produite par celle-ci.
- source_word: ἐν κύμασιν
  choice: parmi les flots
  rationale: Rend la localisation au sein des vagues dans un français naturel et poétique adapté au registre sapientiel.
