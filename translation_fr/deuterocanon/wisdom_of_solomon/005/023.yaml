  text: A spirit of power will stand against them[a], and like a whirlwind it will winnow them away;
translation:
  language: fr
  text: Un esprit de puissance se dressera contre eux[a] et, comme une bourrasque, les dispersera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Un vent puissant se dressera contre eux » ou « Un souffle puissant s’opposera à eux ». Le grec πνεῦμα peut signifier « esprit », « vent » ou « souffle ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιστήσεται
  choice: se dressera contre
  rationale: Le futur moyen de ἀνθίστημι exprime une opposition active. « Se dresser contre » conserve l’image concrète et reste naturel en français.
- source_word: πνεῦμα
  choice: esprit
  rationale: πνεῦμα peut désigner l’esprit, le vent ou le souffle. Avec δυνάμεως et comme sujet de « se dressera contre », « esprit » préserve ici la personnification probable, tandis que la note maintient l’ambiguïté lexicale.
- source_word: δυνάμεως
  choice: de puissance
  rationale: Le génitif qualifie πνεῦμα. « De puissance » rend directement le grec sans préciser indûment s’il s’agit de force intrinsèque ou de puissance guerrière.
- source_word: λαῖλαψ
  choice: tempête
  rationale: λαῖλαψ désigne une violente tempête de vent. « Tempête » est idiomatique, intense et convient à l’image du jugement.
- source_word: ἐκλικμήσει
  choice: dispersera au van
  rationale: Le verbe évoque l’action de vanner et d’emporter la bale. « Dispersera au van » conserve la métaphore agricole tout en restant intelligible.
- source_word: αὐτούς
  choice: les
  rationale: Le pronom reprend les adversaires impies du contexte et fonctionne naturellement comme complément direct en français.
theological_decisions:
- issue: Faut-il comprendre πνεῦμα comme un agent personnifié (« esprit ») ou comme un phénomène météorologique (« vent », « souffle ») ?
  choice: esprit
  alternative: vent puissant ou souffle puissant
  rationale: La syntaxe fait de πνεῦμα δυνάμεως le sujet qui « se dressera contre eux », ce qui favorise une formulation personnifiée. Toutefois, le sens météorologique demeure possible et est signalé en note, sans résoudre artificiellement l’ambiguïté.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve la personnification du premier membre et l’imagerie de la tempête et du vannage dans le second.
