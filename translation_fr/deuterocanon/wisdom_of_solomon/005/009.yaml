  text: All those things passed away like a shadow[a], and like a report running past;
translation:
  language: fr
  text: Tout cela a disparu comme une ombre, comme une nouvelle qui file.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme un message qui passe rapidement ». Le grec ἀγγελία peut signifier « nouvelle », « message » ou « annonce », et παρατρέχουσα souligne la rapidité du passage.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρῆλθεν
  choice: a disparu
  rationale: L’aoriste de παρέρχομαι exprime ici le passage et la disparition de ce qui vient d’être évoqué. « A disparu » rend naturellement en français cette fugacité sans affaiblir l’image.
- source_word: ἐκεῖνα πάντα
  choice: tout cela
  rationale: Le démonstratif renvoie avec une certaine distance aux réalités mentionnées auparavant, tandis que πάντα les englobe toutes. « Tout cela » est naturel et conserve ce renvoi récapitulatif.
- source_word: ὡς σκιὰ
  choice: comme une ombre
  rationale: Cette traduction directe préserve l’image grecque de quelque chose d’éphémère et d’insaisissable.
- source_word: ἀγγελία
  choice: une nouvelle
  rationale: ἀγγελία peut désigner un message, une nouvelle ou une annonce. « Une nouvelle » convient à quelque chose qui circule rapidement, tout en maintenant l’ouverture lexicale du grec.
- source_word: παρατρέχουσα
  choice: qui passe en courant
  rationale: Le participe présent de παρατρέχω évoque littéralement le fait de courir en passant. Cette formulation conserve le mouvement vif et inhabituel de l’image grecque.
