base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/013.yaml
  text: So also we[a], once we were born, came to an end; and we had no sign of virtue to show[b], but were consumed in our wickedness.
translation:
  language: fr
  text: Ainsi, nous aussi, une fois nés, nous avons disparu[a] ; nous n’avons eu aucun signe de vertu[b] à montrer, mais nous nous sommes consumés dans notre méchanceté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous avons cessé d’exister » ou « nous nous sommes évanouis ». Le verbe grec peut exprimer la disparition ou la cessation.
    reason: lexical_alternative
  - marker: b
    text: Ou « excellence morale ». Le terme grec peut désigner plus largement une qualité remarquable ou l’excellence.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ἡμεῖς
  choice: Ainsi, nous aussi
  rationale: Cette formulation conserve le lien comparatif avec les images précédentes de ce qui passe, tout en restant naturelle en français.
- source_word: γενηθέντες
  choice: après être venus au monde
  rationale: Le participe aoriste de γίνομαι désigne ici la venue à l’existence. « Venus au monde » exprime clairement cette idée sans limiter le sens au seul acte physique de la naissance.
- source_word: ἐξελίπομεν
  choice: nous avons disparu
  rationale: Le verbe ἐκλείπω peut exprimer la disparition, l’épuisement ou la cessation. « Avons disparu » convient au contexte de la brièveté de la vie et demeure plus idiomatique que « avons pris fin » appliqué à des personnes.
- source_word: ἀρετῆς
  choice: vertu
  rationale: Dans ce contexte sapientiel et moral, ἀρετή désigne la qualité ou l’excellence morale. « Vertu » en conserve la force éthique avec concision.
- source_word: σημεῖον
  choice: signe
  rationale: Le terme désigne une marque visible ou une preuve. « Signe » reste proche du grec, tandis que l’infinitif « à montrer » en fait ressortir la valeur probante.
- source_word: οὐδὲν ἔσχομεν δεῖξαι
  choice: nous n’avons eu aucun signe de vertu à montrer
  rationale: 'La formulation reproduit clairement la construction du grec : ils ne possédaient rien qui puisse être présenté comme signe de vertu.'
- source_word: κακίᾳ
  choice: méchanceté
  rationale: Ici, κακία désigne le mal moral qui caractérise la conduite des impies, et non un simple malheur. « Méchanceté » garde cette portée morale.
- source_word: κατεδαπανήθημεν
  choice: nous nous sommes consumés
  rationale: Le verbe évoque le fait d’être entièrement dépensé, épuisé ou consumé. La tournure pronominale française restitue naturellement ce dépérissement tout en maintenant l’image d’une vie qui s’épuise dans le mal.
theological_decisions:
- issue: Portée morale de ἀρετή dans la littérature sapientielle
  choice: vertu
  alternative: excellence
  rationale: Le contexte présente l’aveu des impies, incapables de montrer une valeur morale dans leur vie. « Vertu » maintient cette dimension éthique sans introduire de sens doctrinal technique.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le rythme en trois membres conserve le ton de confession rétrospective des impies. « Venus au monde » et « nous nous sommes consumés » privilégient une expression naturelle tout en respectant les images et les tensions du grec.
