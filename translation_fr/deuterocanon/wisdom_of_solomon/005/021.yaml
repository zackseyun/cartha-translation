  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/021.yaml
  text: Well-aimed bolts of lightning will go forth[a], and like from a well-drawn bow of clouds they will leap to the target[b],
translation:
  language: fr
  text: Des traits de foudre bien dirigés partiront et, comme d’un arc bien courbé des nuages[a], bondiront vers un but[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque signifie littéralement « l’arc bien courbé des nuages » ; elle peut évoquer l’arc-en-ciel ou l’arc d’une tempête.
    reason: lexical_alternative
  - marker: b
    text: Ou « s’élanceront vers un but ». Le verbe grec décrit un mouvement vif, comparable à un bond.
    reason: alternative_reading
lexical_decisions:
- source_word: πορεύσονται
  choice: partiront
  rationale: Le futur de πορεύομαι exprime ici la mise en mouvement des projectiles. « Partiront » est naturel en français dans l’image d’un tir.
- source_word: εὔστοχοι βολίδες ἀστραπῶν
  choice: des traits de foudre bien ajustés
  rationale: βολίδες désigne des projectiles ou des traits, tandis que εὔστοχοι indique qu’ils atteignent juste ou sont bien dirigés. « Traits de foudre » conserve l’imagerie martiale sans réduire βολίδες à de simples éclairs.
- source_word: ὡς ἀπὸ εὐκύκλου τόξου τῶν νεφῶν
  choice: comme tirés de l’arc bien courbé des nuages
  rationale: εὔκυκλος signifie littéralement « bien arrondi » ou « bien courbé ». L’ajout explicatif « tirés » rend en français le mouvement depuis l’arc suggéré par ἀπό, sans identifier nécessairement cet arc à l’arc-en-ciel.
- source_word: ἐπὶ σκοπόν
  choice: vers leur cible
  rationale: σκοπός désigne le but ou la cible. « Vers leur cible » convient au verbe de mouvement et le possessif rend la phrase française plus fluide sans modifier le référent.
- source_word: ἁλοῦνται
  choice: ils bondiront
  rationale: Le verbe, rattaché ici à ἅλλομαι, évoque un mouvement vif, un bond ou un élan. « Bondiront » conserve cette vigueur poétique et l’étrangeté mesurée de l’image.
theological_decisions:
- issue: L’arc des nuages peut évoquer l’arc-en-ciel ou un arc de tempête.
  choice: arc bien courbé des nuages
  alternative: arc-en-ciel
  rationale: Le grec dit littéralement « arc des nuages » et ne nomme pas explicitement l’arc-en-ciel. La formulation retenue préserve l’allusion possible sans la transformer en identification certaine.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste vive, avec une explicitation minimale (« tirés ») nécessaire à l’idiome français. Les images du trait, de l’arc et de la cible sont conservées.
