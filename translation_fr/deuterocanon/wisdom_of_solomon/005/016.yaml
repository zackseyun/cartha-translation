revisions:
- from: C’est pourquoi ils recevront de la main du Seigneur le royaume de splendeur[a] et le diadème de beauté, car de sa main droite il les couvrira de sa protection et de son bras il les défendra[b].
  to: C’est pourquoi ils recevront de la main du Seigneur le royaume de splendeur[a] et le diadème de beauté ; de sa main droite, il les abritera, et de son bras, il les défendra[b].
  rationale: La révision maintient l’ambiguïté de βασίλειον et les images royales du texte, tout en rétablissant une expression française plus directe pour σκεπάσει et une note exacte pour ὑπερασπιεῖ αὐτῶν.
