    issue: Rendu de σκεπάσει
    rationale: « Couvrira de sa protection » ajoute le substantif abstrait « protection » et affaiblit l’image concrète du verbe grec « couvrir, abriter, protéger ». « Les abritera » est direct et fidèle.
  - severity: medium
    issue: Note b présentée comme littérale
    rationale: Le grec ὑπερασπιεῖ αὐτῶν signifie littéralement qu’il « défendra en leur faveur / pour eux ». « Il prendra leur défense » est une bonne paraphrase française, mais non la formulation littérale annoncée.
