base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/016.yaml
  text: Therefore they will receive the kingdom of splendor and the crown of beauty from the hand of the Lord[a], because with his right hand he will shelter them[b], and with his arm he will defend them.
translation:
  language: fr
  text: C’est pourquoi ils recevront de la main du Seigneur le royaume de splendeur[a] et le diadème de beauté ; de sa main droite, il les abritera, et de son bras, il les défendra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’insigne royal de splendeur » ou « la couronne royale de splendeur ». Le mot grec peut désigner un royaume ou un emblème royal.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il défendra en leur faveur » ou « il défendra pour eux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Expression déductive naturelle qui relie la récompense annoncée à la justification des justes dans le contexte précédent.
- source_word: λήμψονται
  choice: ils recevront
  rationale: Le futur de λαμβάνω indique ici un don reçu du Seigneur, comme le confirme « de la main du Seigneur ».
- source_word: τὸ βασίλειον τῆς εὐπρεπείας
  choice: le royaume de splendeur
  rationale: « Royaume » conserve le sens royal possible de βασίλειον et la tension entre règne accordé et insigne royal; « splendeur » exprime la magnificence de εὐπρέπεια.
- source_word: τὸ διάδημα τοῦ κάλλους
  choice: le diadème de beauté
  rationale: διάδημα désigne précisément un ornement royal porté sur la tête; « diadème » est intelligible en français et maintient la distinction avec βασίλειον. κάλλος signifie directement « beauté ».
- source_word: ἐκ χειρὸς Κυρίου
  choice: de la main du Seigneur
  rationale: Rendu direct de l’image grecque, qui souligne que le Seigneur accorde lui-même la récompense.
- source_word: τῇ δεξιᾷ σκεπάσει αὐτούς
  choice: de sa main droite il les couvrira de sa protection
  rationale: Le datif est instrumental. Cette formulation française conserve l’image de la main qui couvre tout en rendant explicite la valeur protectrice de σκεπάζω.
- source_word: τῷ βραχίονι ὑπερασπιεῖ αὐτῶν
  choice: de son bras il les défendra
  rationale: « Bras » maintient l’image biblique de la puissance divine en action; « défendre » rend naturellement le fait d’agir en faveur de quelqu’un.
theological_decisions:
- issue: Traduction de κύριος
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » correspond à l’usage biblique français et présente Dieu comme celui qui accorde la récompense et protège les justes.
- issue: Nature de la récompense royale des justes
  choice: Conserver les images concrètes du « royaume » et du « diadème »
  alternative: Paraphraser par « honneur royal » ou comprendre βασίλειον comme un insigne ou une couronne royale
  rationale: Le grec associe deux réalités royales sans expliquer s’il s’agit d’une participation au règne ou d’images de glorification. La traduction ne résout pas cette tension.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formulation conserve le parallélisme des images corporelles (« main droite », « bras ») et le vocabulaire royal. Tous les marqueurs de notes figurent dans le texte.
