  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/022.yaml
  text: And hailstones full of stony wrath will be hurled, and the water of the sea will rage against them; and rivers will suddenly overwhelm them.
translation:
  language: fr
  text: Des grêlons, pleins d’une fureur qui lance des pierres, seront projetés[a] ; l’eau de la mer s’indignera contre eux, et les fleuves les submergeront soudain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est très condensé : littéralement, les grêlons sont « pleins d’une fureur qui lance des pierres ». Le terme peut évoquer le jet de pierres ou, selon l’interprétation, un engin qui les lance.'
    reason: Signaler l'ambiguïté lexicale réelle de πετροβόλου sans changer le lien grammatical avec « fureur » ni imposer une fronde ou une catapulte précise.
lexical_decisions:
- source_word: ἐκ πετροβόλου θυμοῦ πλήρεις ῥιφήσονται χάλαζαι
  choice: Des grêlons chargés de fureur seront lancés comme des pierres
  rationale: La construction grecque, très condensée, associe le jet de pierres, la fureur et les grêlons. Cette formulation française conserve les trois images sans introduire avec certitude une fronde ou une catapulte, qui ne sont pas explicitement nommées.
- source_word: ἀγανακτήσει
  choice: s’indignera
  rationale: Le verbe personnifie l’eau de la mer et exprime indignation ou colère, davantage qu’une simple agitation physique.
- source_word: συγκλύσουσιν
  choice: submergeront
  rationale: Le verbe désigne l’action de couvrir ou d’engloutir sous un afflux d’eau.
- source_word: ἀποτόμως
  choice: soudain
  rationale: L’adverbe peut évoquer une action brusque, soudaine ou violente ; « soudain » restitue ici le caractère abrupt du débordement.
theological_decisions:
- issue: Personnification des forces naturelles comme instruments du jugement
  choice: Conserver « l’eau de la mer s’indignera »
  alternative: « l’eau de la mer se déchaînera »
  rationale: Le grec attribue explicitement une indignation à la mer. La personnification poétique est donc maintenue sans expliquer davantage l’agent divin.
translation_notes:
  register: Français moderne, digne et imagé. La ponctuation distingue les deux mouvements du verset tout en conservant son rythme poétique et la personnification cosmique.
