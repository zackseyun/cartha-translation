  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/019.yaml
  text: He will take holiness as an unconquerable shield,[a]
translation:
  language: fr
  text: Il prendra la sainteté comme un bouclier invincible.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la piété ».
    reason: Alternative lexicale possible pour ὁσιότητα.
lexical_decisions:
- source_word: λήμψεται
  choice: Il prendra
  rationale: Le futur moyen de λαμβάνω s’inscrit ici dans l’image de quelqu’un qui s’arme. « Prendra » reste naturel et proche du grec, sans expliciter davantage par « se saisira de » ou « prendra en main ».
- source_word: ἀσπίδα
  choice: bouclier
  rationale: Terme français courant et précis pour l’arme défensive désignée par le grec, sans archaïsme.
- source_word: ἀκαταμάχητον
  choice: invincible
  rationale: L’adjectif qualifie ce qui ne peut être vaincu ou surmonté au combat. « Invincible » restitue clairement et naturellement la force de l’image martiale.
- source_word: ὁσιότητα
  choice: sainteté
  rationale: ὁσιότης désigne la qualité de ce qui est saint, pieux et juste devant Dieu. « Sainteté » conserve ici sa portée morale et religieuse générale, dans la personnification d’une vertu comme pièce d’armure.
theological_decisions:
- issue: Faut-il rendre ὁσιότητα par une qualité morale et religieuse générale (« sainteté ») ou par une disposition plus explicitement dévotionnelle (« piété ») ?
  choice: sainteté
  alternative: piété
  rationale: « Sainteté » préserve l’ampleur morale et théologique du terme grec dans l’image des vertus servant d’armure, sans le réduire à des pratiques ou à une attitude religieuse extérieure. La variante est signalée afin de conserver l’ambiguïté lexicale réelle.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe concise conserve l’image militaire et l’ordre conceptuel du grec. « Invincible » est plus idiomatique en français que « impossible à vaincre » tout en gardant la même force.
