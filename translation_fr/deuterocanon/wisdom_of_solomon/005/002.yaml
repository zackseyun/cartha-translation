  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/002.yaml
  text: When they see him[a], they will be shaken with dreadful fear, and they will be astonished at the unexpectedness of his salvation.
translation:
  language: fr
  text: En le voyant[a], ils seront bouleversés par une peur terrible et stupéfaits devant le caractère inattendu de son salut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, le grec dit : « Voyant, ils seront bouleversés par une peur terrible et stupéfaits devant l’inattendu du salut. » Les mots « le » et « son » sont précisés d’après le contexte : ils renvoient au juste mentionné au verset précédent.'
    reason: Le grec omet l’objet de « voyant » et ne comporte pas de possessif avec « salut » ; le français les explicite d’après le contexte.
lexical_decisions:
- source_word: ἰδόντες
  choice: En le voyant
  rationale: Le participe aoriste de ὁράω a ici une valeur temporelle. Le pronom « le », absent du verset grec, reprend naturellement le juste mentionné au verset précédent.
- source_word: ταραχθήσονται
  choice: ils seront bouleversés
  rationale: Le futur passif de ταράσσω exprime un profond trouble intérieur. « Bouleversés » en conserve la force dans un français actuel.
- source_word: φόβῳ δεινῷ
  choice: par une peur terrible
  rationale: Le datif indique ici la cause ou le moyen du bouleversement. « Peur terrible » rend directement l’intensité de δεινός.
- source_word: ἐκστήσονται
  choice: stupéfaits
  rationale: Le futur moyen de ἐξίστημι désigne ici une stupeur intense plutôt qu’une perte littérale de la raison.
- source_word: ἐπὶ τῷ παραδόξῳ
  choice: du caractère inattendu
  rationale: L’adjectif substantivé παράδοξος désigne ce qui dépasse l’attente et provoque l’étonnement. Cette formulation française préserve cette nuance sans transformer le terme en simple « miracle ».
- source_word: τῆς σωτηρίας
  choice: de son salut
  rationale: σωτηρία peut désigner le salut ou la délivrance. « Salut » convient au registre du livre; « son » explicite le lien contextuel avec le juste sans prétendre qu’il figure dans ce verset grec.
theological_decisions:
- issue: Référent implicite de ἰδόντες et rapport de τῆς σωτηρίας au juste
  choice: Expliciter le juste par « le » et « son salut » tout en signalant cet ajout contextuel en note.
  alternative: « En voyant, ils seront bouleversés… devant le caractère inattendu du salut. »
  rationale: Le grec laisse ces rapports implicites, car le juste est déjà présent dans le contexte immédiat. Le français gagne en clarté si le référent est exprimé, mais la note préserve la distinction entre le texte explicite et l’information fournie par le contexte.
translation_notes:
  register: Français moderne, international et digne. La phrase reste proche de la structure grecque tout en évitant une tournure artificielle; « caractère inattendu » rend le substantif abstrait implicite dans l’adjectif grec substantivé.
