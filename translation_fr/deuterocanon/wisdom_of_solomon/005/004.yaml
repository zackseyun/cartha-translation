base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/004.yaml
  text: and as a proverb of reproach among fools[a]. We considered his life madness, and his end dishonorable[b];
translation:
  language: fr
  text: et dont nous faisions un objet de raillerie, insensés que nous étions[a] ! Nous estimions que sa vie était folie et que sa fin était sans honneur[b] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et en proverbe de mépris, nous, les insensés ». L’expression grecque peut désigner un dicton injurieux ou quelqu’un devenu publiquement un objet de raillerie.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sa mort était sans honneur ». Le mot grec traduit par « fin » peut désigner plus précisément la mort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραβολὴν ὀνειδισμοῦ
  choice: un objet de raillerie
  rationale: Dans ce contexte, l’expression désigne une personne devenue la cible publique de propos méprisants. Cette formulation est naturelle en français moderne et conserve la force du blâme, tandis que « parabole » serait trompeur ici.
- source_word: οἱ ἄφρονες
  choice: insensés que nous étions
  rationale: L’expression identifie rétrospectivement les locuteurs. La tournure française préserve cette confession à la première personne et s’intègre naturellement à la phrase.
- source_word: ἐλογισάμεθα
  choice: nous estimions
  rationale: Le verbe exprime ici un jugement porté sur la vie du juste, et non une simple pensée passagère.
- source_word: τὸν βίον αὐτοῦ
  choice: sa vie
  rationale: βίος désigne ici la vie vécue ou la manière de vivre de cet homme ; « sa vie » demeure clair et concis.
- source_word: μανίαν
  choice: folie
  rationale: Le terme exprime le jugement méprisant des locuteurs, qui tenaient la conduite du juste pour déraisonnable.
- source_word: τὴν τελευτὴν αὐτοῦ
  choice: sa fin
  rationale: « Sa fin » garde l’étendue sémantique du grec, tout en pouvant désigner sa mort dans ce contexte.
- source_word: ἄτιμον
  choice: sans honneur
  rationale: Cette expression rend directement l’idée d’une fin privée d’honneur ou tenue pour méprisable, sans suggérer que la fin elle-même aurait commis un acte déshonorant.
theological_decisions:
- issue: Identité et perspective des locuteurs
  choice: 'Le verset est formulé comme l’aveu rétrospectif des insensés : « insensés que nous étions » et « nous estimions ».'
  alternative: Lire οἱ ἄφρονες comme une remarque détachée du narrateur au sujet des insensés.
  rationale: La première personne du pluriel dans ἐλογισάμεθα et le contexte de Sagesse 5 montrent que les impies reconnaissent leur ancienne erreur. La traduction conserve cette perspective sans la transformer en commentaire neutre.
- issue: Portée de τελευτή
  choice: Conserver « sa fin » dans le texte principal.
  alternative: Traduire explicitement par « sa mort ».
  rationale: Le grec peut viser la mort, voire les circonstances de celle-ci, mais son sens premier reste assez large. « Sa fin » préserve cette ambiguïté réelle.
translation_notes:
  register: Français moderne, digne et intelligible. La phrase reprend implicitement, comme le grec, la construction commencée au verset précédent ; « dont nous faisions » l’explicite pour obtenir une syntaxe française complète. « Sans honneur » conserve la valeur passive de ἄτιμον et évite l’ambiguïté moderne de « déshonorante ».
