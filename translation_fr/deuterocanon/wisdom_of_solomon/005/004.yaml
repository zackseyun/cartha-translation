  source_fidelity: 'Le texte rend fidèlement la construction elliptique dépendant du verset précédent : « dont nous faisions un objet de raillerie » explicite naturellement en français l’idée de faire de quelqu’un une παραβολὴ ὀνειδισμοῦ. « Insensés que nous étions » restitue correctement l’identification rétrospective des locuteurs par οἱ ἄφρονες. « Nous estimions », « sa vie était folie » et « sa fin était sans honneur » conservent le jugement méprisant exprimé par ἐλογισάμεθα, μανία et ἄτιμον. « Sa fin » préserve à juste titre l’ambiguïté de τελευτή, sans exclure la mort.'
  naturalness: Le français est moderne, clair et d’un registre biblique sobre. La reprise par « dont » est fluide malgré la dépendance syntaxique du grec envers le contexte antérieur. La tournure « insensés que nous étions » est idiomatique et expressive sans être archaïque.
