  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/005.yaml
  text: How was he counted among the sons of God[b][a], and his lot is among the holy ones?
translation:
  language: fr
  text: Comment a-t-il été compté parmi les fils de Dieu[a], et sa part[b] est-elle parmi les saints ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi les enfants de Dieu ». Le grec emploie « fils de Dieu ».
    reason: lexical_alternative
  - marker: b
    text: Ou « son lot est parmi les saints ». Le mot grec peut désigner le lot attribué, puis la part ou la place qui revient à quelqu’un.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς
  choice: Comment
  rationale: Introduit une question d’étonnement devant le renversement constaté ; « Comment » conserve directement cette nuance.
- source_word: κατελογίσθη
  choice: a-t-il été compté
  rationale: Conserve le passif et l’idée d’être dénombré ou reconnu comme appartenant à un groupe.
- source_word: ἐν υἱοῖς θεοῦ
  choice: parmi les fils de Dieu
  rationale: ἐν suivi du datif exprime ici l’appartenance au groupe. « Fils de Dieu » maintient le masculin pluriel explicite et le langage de statut du grec.
- source_word: κλῆρος
  choice: part
  rationale: κλῆρος désigne le lot attribué et, par extension, la part ou la place qui revient à quelqu’un. « Part » est naturel en français moderne, tandis qu’une note conserve l’image du lot.
- source_word: ἐν ἁγίοις
  choice: parmi les saints
  rationale: Désigne les personnes saintes auxquelles l’homme juste est associé. « Les saints » est concis, digne et conforme au pluriel substantivé grec.
- source_word: αὐτοῦ ἐστιν
  choice: sa part se trouve
  rationale: Rend naturellement en français l’idée que la part qui lui revient est située parmi les saints, sans transformer cette position en possession ou en héritage.
theological_decisions:
- issue: Rendu de υἱοῖς θεοῦ
  choice: fils de Dieu
  alternative: enfants de Dieu
  rationale: Le grec emploie explicitement le masculin pluriel υἱοῖς et présente une désignation de statut. Le texte principal le conserve, tandis qu’une note signale l’équivalent collectif possible.
- issue: Identité des ἅγιοι
  choice: les saints
  alternative: ceux qui sont saints
  rationale: Le grec ne précise pas davantage l’identité de ces êtres ou personnes. Le rendu retenu préserve cette indétermination sans les identifier expressément aux anges ni à une catégorie ecclésiale ultérieure.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition de « comment » rend explicite la portée interrogative sur les deux propositions et restitue naturellement l’étonnement du grec. Les termes « fils de Dieu » et « saints » sont conservés sans précision doctrinale ajoutée.
