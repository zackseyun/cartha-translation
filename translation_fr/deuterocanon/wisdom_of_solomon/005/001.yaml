base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/001.yaml
  text: Then the righteous man will stand with great boldness before those who afflicted him and those who disregarded his labors[a][b][c].
translation:
  language: fr
  text: Alors le juste se tiendra avec une grande assurance devant ceux qui l’ont opprimé et ceux qui ont tenu pour rien ses peines[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec une grande hardiesse ». Le terme grec peut exprimer à la fois l’assurance, la liberté de parole et l’audace d’une présence ouverte.
    reason: lexical_alternative
  - marker: b
    text: Ou « ses travaux pénibles » ou « ses souffrances ». Le mot grec peut désigner l’effort, la fatigue, l’épreuve ou la douleur.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement en français la succession temporelle et l’entrée dans la scène annoncée.
- source_word: στήσεται
  choice: se tiendra
  rationale: Conserve l’image du juste debout, publiquement présent, sans imposer le sens passif « sera placé ».
- source_word: ἐν παρρησίᾳ πολλῇ
  choice: avec une grande assurance
  rationale: παρρησία exprime ici une présence ouverte, libre et hardie; « assurance » est naturel en français et convient à la scène de réhabilitation, tout en laissant « hardiesse » comme autre nuance possible.
- source_word: ὁ δίκαιος
  choice: le juste
  rationale: Rend le substantif adjectival masculin singulier de façon idiomatique et traditionnelle en français, sans ajout du nom « homme » absent du grec.
- source_word: κατὰ πρόσωπον
  choice: devant
  rationale: Exprime la présence directe, face à face, sans reproduire servilement l’expression « devant la face de ».
- source_word: τῶν θλιψάντων αὐτὸν
  choice: ceux qui l’ont opprimé
  rationale: θλίβω désigne le fait de presser, accabler ou opprimer; le contexte évoque des souffrances infligées par des adversaires.
- source_word: τῶν ἀθετούντων
  choice: ceux qui ont tenu pour rien
  rationale: Rend l’idée de rejeter, mépriser ou considérer comme sans valeur, en relation directe avec les peines du juste.
- source_word: τοὺς πόνους αὐτοῦ
  choice: ses peines
  rationale: πόνοι peut désigner les travaux pénibles, les fatigues ou les souffrances; « peines » préserve en français cette amplitude.
theological_decisions:
- issue: Valeur représentative et forme masculine singulière de ὁ δίκαιος
  choice: le juste
  alternative: la personne juste
  rationale: Le grec présente une figure masculine singulière. « Le juste » la conserve sans généraliser au pluriel ni préciser davantage son identité.
- issue: Nuance de παρρησία dans une scène de jugement et de réhabilitation
  choice: avec une grande assurance
  alternative: avec une grande hardiesse
  rationale: « Assurance » associe confiance et liberté de se présenter ouvertement; la note signale la nuance plus vigoureuse de hardiesse sans réduire le terme à un sentiment intérieur.
- issue: Portée de πόνοι
  choice: ses peines
  alternative: ses travaux pénibles ou ses souffrances
  rationale: Le contexte permet aussi bien l’effort coûteux que les épreuves endurées. Le choix français maintient cette tension plutôt que de trancher en faveur du seul travail ou de la seule souffrance.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la solennité de la scène de réhabilitation tout en évitant le calque peu idiomatique « devant la face de ». Les marqueurs [a] et [b] figurent dans le texte principal.
