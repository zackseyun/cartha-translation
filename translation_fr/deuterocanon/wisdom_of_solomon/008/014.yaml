  text: I will govern peoples, and nations will be subject to me;
translation:
  language: fr
  text: Je gouvernerai des peuples, et des nations me seront soumises.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διοικήσω
  choice: Je gouvernerai
  rationale: Le futur actif de διοικέω exprime ici l’exercice du gouvernement. « Gouverner » convient au contexte politique sans la nuance bureaucratique d’« administrer » ni la possible dureté de « dominer ».
- source_word: λαούς
  choice: des peuples
  rationale: Le pluriel de λαός désigne plusieurs collectivités humaines. « Peuples » conserve ce pluriel et maintient la distinction lexicale avec ἔθνη dans la proposition suivante.
- source_word: ἔθνη
  choice: des nations
  rationale: Dans ce contexte politique, « nations » rend naturellement le pluriel de ἔθνος, sans introduire la connotation ethnoreligieuse de « païens ».
- source_word: ὑποταγήσεταί
  choice: seront soumises
  rationale: Le futur passif ou moyen de ὑποτάσσω indique une relation de subordination. La tournure « me seront soumises » préserve cette nuance sans préciser si la soumission est volontaire ou imposée.
- source_word: μοι
  choice: me
  rationale: Le datif marque ici la personne à laquelle les nations seront soumises. La construction française idiomatique est « me seront soumises ».
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le parallélisme entre « peuples » et « nations » est conservé, ainsi que le mouvement du gouvernement vers la soumission.
