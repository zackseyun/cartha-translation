  text: And if understanding is effective[b][a], who among existing things is more skillful than she?
translation:
  language: fr
  text: Et si l’intelligence est à l’œuvre[a], qui, parmi tout ce qui existe, est plus habile qu’elle[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « produit » ou « agit ». Le verbe grec peut souligner l’activité efficace ou le travail productif.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « qui, parmi les choses qui existent, est davantage une artisane qu’elle ? » Le grec emploie un nom féminin désignant une ouvrière ou une artisane qualifiée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φρόνησις
  choice: l’intelligence
  rationale: Dans ce contexte sapientiel, le terme désigne une intelligence pratique et avisée. « L’intelligence » reste distinct de σοφία (« la Sagesse ») dans le contexte tout en conservant le féminin de la personnification grecque.
- source_word: ἐργάζεται
  choice: est à l’œuvre
  rationale: Cette expression naturelle rend l’activité efficace ou productrice exprimée par le verbe sans imposer un résultat particulier.
- source_word: τῶν ὄντων
  choice: parmi tout ce qui existe
  rationale: Cette formulation conserve l’ampleur ontologique de l’expression grecque tout en restant claire en français moderne.
- source_word: μᾶλλον
  choice: plus
  rationale: Le comparatif français correspond directement à la question rhétorique grecque.
- source_word: τεχνῖτις
  choice: plus habile
  rationale: Le nom féminin grec désigne une artisane ou ouvrière qualifiée. Dans cette construction comparative, « plus habile qu’elle » est idiomatique en français; une note conserve explicitement l’image de l’artisane.
theological_decisions:
- issue: Personnification féminine de φρόνησις
  choice: Conserver la personnification féminine par « l’intelligence » et « elle ».
  alternative: Employer une tournure neutre ou impersonnelle.
  rationale: Le grec emploie explicitement un pronom et un nom de métier féminins; la traduction ne neutralise donc pas cette personnification.
- issue: Rapport entre φρόνησις et σοφία dans le contexte
  choice: Traduire φρόνησις par « intelligence », distinct de « Sagesse ».
  alternative: Traduire par « sagesse » ou « prudence ».
  rationale: Le texte emploie ici φρόνησις et non σοφία. Maintenir cette différence lexicale évite de résoudre une relation conceptuelle que le verset laisse ouverte.
translation_notes:
  register: Français international moderne, naturel et soutenu sans archaïsme. La tournure « est à l’œuvre » préserve l’idée d’activité efficace, tandis que « plus habile qu’elle » évite une formulation française lourde; la note restitue l’image précise de l’artisane.
