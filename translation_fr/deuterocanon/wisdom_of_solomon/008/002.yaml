base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/002.yaml
  text: I loved her and sought her out from my youth[a], and I sought to take her as my bride, and I became a lover of her beauty.
translation:
  language: fr
  text: Je l’ai aimée et recherchée dès ma jeunesse ; j’ai cherché à la prendre pour épouse[a] et je suis devenu amoureux de sa beauté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à prendre une épouse pour moi-même ».'
    reason: La note rend visible la construction grecque ἀγαγέσθαι ἐμαυτῷ, plus explicite et plus lourde que l’expression française naturelle « la prendre pour épouse ».
lexical_decisions:
- source_word: Ταύτην
  choice: l’… / la
  rationale: Le démonstratif féminin renvoie à la Sagesse personnifiée. Les pronoms féminins sont naturels en français et maintiennent cette personnification.
- source_word: ἐφίλησα
  choice: j’ai aimée
  rationale: Dans ce contexte, le verbe exprime l’attachement affectueux envers la Sagesse personnifiée, non un baiser littéral.
- source_word: ἐξεζήτησα
  choice: recherchée
  rationale: Le verbe composé suggère une recherche soutenue. « Rechercher » en restitue la force tout en restant idiomatique.
- source_word: ἐκ νεότητός μου
  choice: dès ma jeunesse
  rationale: Cette expression temporelle indique que la recherche a commencé pendant la jeunesse et s’est prolongée.
- source_word: ἐζήτησα
  choice: j’ai cherché
  rationale: La formulation conserve la répétition du langage de la recherche présente dans le grec.
- source_word: νύμφην
  choice: pour épouse
  rationale: Le nom désigne ici une jeune femme envisagée comme épouse. Cette formulation française exprime clairement l’image nuptiale.
- source_word: ἀγαγέσθαι ἐμαυτῷ
  choice: à la prendre pour épouse
  rationale: L’expression signifie littéralement prendre ou conduire pour soi et fonctionne ici comme une tournure matrimoniale. Le français choisi est naturel, tandis que la note conserve la forme plus littérale.
- source_word: ἐραστὴς
  choice: amoureux
  rationale: Le terme désigne un amant ou quelqu’un épris. « Amoureux » préserve la force affective et l’imagerie nuptiale sans lourdeur.
- source_word: τοῦ κάλλους αὐτῆς
  choice: de sa beauté
  rationale: κάλλος désigne directement la beauté ; ce choix respecte l’image féminine et nuptiale du passage.
theological_decisions:
- issue: Personnification de la Sagesse en langage nuptial
  choice: Maintenir les pronoms féminins et l’image de la Sagesse comme épouse désirée
  alternative: Reformuler abstraitement comme l’estime de la valeur ou de l’excellence de la sagesse
  rationale: Le grec personnifie explicitement la Sagesse comme une femme et emploie le langage de l’amour et du mariage. Conserver cette image évite d’aplanir la poésie et sa portée théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme entre « recherchée » et « j’ai cherché » conserve la répétition grecque sans produire une formulation mécanique. Le point-virgule clarifie la progression entre la recherche commencée dans la jeunesse et le désir nuptial.
