base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/015.yaml
  text: Fearsome tyrants will fear me when they hear[a]; among the multitude I will appear good[b], and in war courageous.
translation:
  language: fr
  text: De redoutables tyrans me craindront quand ils entendront[a] ; au milieu de la foule, je paraîtrai bon[b], et courageux à la guerre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « après avoir entendu » ; le grec ne précise pas explicitement ce que les tyrans auront entendu.'
    reason: ambiguïté syntaxique
  - marker: b
    text: 'Ou : « je serai reconnu comme noble » ou « bienfaisant ». Ici, « bon » peut désigner aussi bien la valeur morale que la bonté manifestée dans la vie publique.'
    reason: alternative lexicale
lexical_decisions:
- source_word: φοβηθήσονταί με
  choice: me craindront
  rationale: Le futur déponent exprime directement la crainte que les tyrans éprouveront envers le locuteur.
- source_word: ἀκούσαντες
  choice: quand ils entendront parler de moi
  rationale: Le participe aoriste a ici une valeur temporelle. Le grec ne précise pas ce qui est entendu ; le français explicite sobrement le complément suggéré par le contexte, tout en le signalant en note.
- source_word: τύραννοι φρικτοί
  choice: de redoutables tyrans
  rationale: τύραννοι désigne des souverains autocratiques et φρικτοί les qualifie comme inspirant l’effroi. « Redoutables tyrans » conserve cette caractérisation sans faire de l’adjectif une seconde affirmation de leur peur.
- source_word: ἐν πλήθει
  choice: au milieu de la foule
  rationale: La formule évoque la présence publique du locuteur parmi un grand nombre de personnes, sans imposer l’idée plus précise d’une assemblée officielle.
- source_word: φανούμαι ἀγαθός
  choice: je paraîtrai bon
  rationale: φανούμαι porte sur la manière dont le locuteur se manifestera ou sera perçu ; ἀγαθός garde ici une portée assez large, morale autant que pratique.
- source_word: ἐν πολέμῳ ἀνδρεῖος
  choice: courageux à la guerre
  rationale: La tournure restitue la bravoure guerrière exprimée par ἀνδρεῖος, sans reprendre les connotations masculines devenues trompeuses d’un calque étymologique.
theological_decisions:
- issue: Vertus publiques et guerrières attribuées au locuteur
  choice: Le locuteur est présenté à la fois comme bon en public et courageux à la guerre.
  alternative: On pourrait expliciter un portrait du roi idéal, bienfaisant dans son gouvernement et vaillant au combat.
  rationale: Le grec juxtapose ces deux qualités, mais n’élabore pas lui-même une théologie politique ; la traduction préserve la juxtaposition sans l’amplifier.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. « Redoutables tyrans » maintient le ton solennel ; « au milieu de la foule » reste naturel tout en conservant l’indétermination de πλήθος.
