  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/011.yaml
  text: I will be found keen in judgment[b][a], and in the sight of rulers I will be admired.
translation:
  language: fr
  text: On me trouvera perspicace dans le jugement[a], et je serai admiré aux yeux des dirigeants[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pénétrant dans le jugement ». Le grec emploie un adjectif qui signifie littéralement « aigu » ou « pénétrant ». Dans la leçon fournie, cet adjectif est au pluriel, alors que le locuteur et les verbes sont au singulier.
    reason: lexical_alternative_and_grammatical_note
  - marker: b
    text: Ou « en présence des dirigeants » ou « devant les dirigeants ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀξεῖς
  choice: perspicace
  rationale: L’adjectif exprime littéralement ce qui est « aigu » ou « pénétrant ». Dans le contexte du jugement, « perspicace » rend naturellement l’idée d’une intelligence vive et d’un discernement sûr. La forme grecque fournie est au pluriel, malgré le verbe et le locuteur au singulier.
- source_word: εὑρεθήσομαι
  choice: on me trouvera
  rationale: Le futur passif signifie que le locuteur sera reconnu ou se révélera tel. « On me trouvera » conserve la tournure passive et laisse l’agent indéterminé.
- source_word: ἐν κρίσει
  choice: dans le jugement
  rationale: κρίσις peut désigner le jugement, la décision ou une procédure judiciaire. Cette traduction préserve l’étendue du terme sans imposer exclusivement le cadre d’un tribunal.
- source_word: ἐν ὄψει
  choice: sous le regard de
  rationale: L’expression évoque littéralement la vue ou la présence. « Sous le regard de » conserve cette dimension publique et visuelle dans un français naturel.
- source_word: δυναστῶν
  choice: dirigeants
  rationale: Le terme désigne des personnes qui détiennent le pouvoir. « Dirigeants » est actuel, accessible et n’introduit pas le sens dynastique plus étroit de « princes ».
- source_word: θαυμασθήσομαι
  choice: je serai admiré
  rationale: Le futur passif présente le locuteur comme objet d’étonnement admiratif. « Je serai admiré » en exprime clairement la valeur positive.
