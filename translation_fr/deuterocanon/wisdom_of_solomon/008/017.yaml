  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/017.yaml
  text: When I considered these things within myself and reflected in my heart that there is immortality in kinship with wisdom,[a]
translation:
  language: fr
  text: Après avoir réfléchi en moi-même à ces choses et médité en mon cœur sur le fait que l’immortalité se trouve dans l’affinité avec la sagesse,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’immortalité se trouve dans la parenté avec la sagesse ». L’expression grecque désigne une relation étroite et peut suggérer, sans l’affirmer explicitement, un lien de cause à effet.
    reason: Alternative lexicale et préservation de l’ambiguïté de la relation exprimée.
lexical_decisions:
- source_word: ταῦτα λογισάμενος
  choice: Ayant réfléchi à ces choses
  rationale: Le participe aoriste moyen exprime une délibération intérieure. « Ayant réfléchi » est naturel et conserve le lien syntaxique avec la suite du passage.
- source_word: ἐν ἐμαυτῷ
  choice: en moi-même
  rationale: Cette expression marque explicitement le caractère intérieur de la réflexion.
- source_word: φροντίσας ἐν καρδίᾳ μου
  choice: et médité dans mon cœur
  rationale: « Médité » rend l’idée d’une pensée attentive, tandis que « dans mon cœur » préserve l’image anthropologique grecque.
- source_word: ὅτι ἐστιν ἀθανασία
  choice: qu’il y a immortalité
  rationale: Cette formulation rend directement la construction existentielle et traduit ἀθανασία par son équivalent courant.
- source_word: ἐν συγγενείᾳ σοφίας
  choice: dans la parenté avec la sagesse
  rationale: συγγένεια désigne une parenté, une affinité ou un lien étroit. « Parenté » conserve la métaphore relationnelle sans transformer explicitement ce lien en cause.
theological_decisions:
- issue: Nature du lien entre l’immortalité et la sagesse dans ἐν συγγενείᾳ σοφίας
  choice: il y a immortalité dans la parenté avec la sagesse
  alternative: l’immortalité vient de la parenté avec la sagesse
  rationale: Le grec associe l’immortalité à une relation étroite avec la sagesse au moyen de ἐν, sans énoncer sans ambiguïté un mécanisme causal. La traduction retient donc la tension du texte.
translation_notes:
  register: Français moderne, digne et accessible. La tournure participiale est maintenue parce que le verset s’inscrit syntaxiquement dans la phrase qui se poursuit au verset suivant. La répétition des deux mouvements de réflexion intérieure et l’image du cœur sont conservées.
