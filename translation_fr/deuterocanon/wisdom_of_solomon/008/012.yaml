  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/012.yaml
  text: When I am silent[a], they will wait for me, and when I speak, they will pay attention; and when I speak at greater length, they will lay a hand on their mouth.
translation:
  language: fr
  text: Quand je me tais, ils m’attendront ; quand je parlerai, ils prêteront attention ; et quand je parlerai plus longuement, ils mettront la main sur leur bouche[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mettre la main sur sa bouche est un geste exprimant le silence, la retenue ou une admiration respectueuse devant celui qui parle.
    reason: cultural_note
lexical_decisions:
- source_word: σιγῶντά με
  choice: quand je me tais
  rationale: Le participe présent employé avec με a ici une valeur circonstancielle. Cette formulation temporelle est naturelle en français et conserve l’aspect de silence du locuteur.
- source_word: περιμενοῦσιν
  choice: ils m’attendront
  rationale: Le verbe exprime l’attente dirigée vers une personne, ici une attente respectueuse avant qu’elle parle.
- source_word: φθεγγομένῳ προσέξουσιν
  choice: quand je parlerai, ils prêteront attention
  rationale: φθέγγομαι désigne ici le fait de prendre la parole, et προσέχω l’attention accordée à ce qui est dit. « Prêteront attention » est clair et idiomatique.
- source_word: λαλοῦντος ἐπὶ πλεῖον
  choice: quand je parlerai plus longuement
  rationale: Le génitif absolu avec ἐπὶ πλεῖον indique que la prise de parole se prolonge. « Quand » respecte la construction circonstancielle sans introduire la nuance conditionnelle de « si ».
- source_word: χεῖρα ἐπιθήσουσιν ἐπὶ στόμα αὐτῶν
  choice: ils poseront la main sur leur bouche
  rationale: La traduction conserve l’image concrète et le singulier distributif du grec, tout en restant naturelle en français.
