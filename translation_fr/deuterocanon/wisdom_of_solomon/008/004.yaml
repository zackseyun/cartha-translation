  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/004.yaml
  text: For she is an initiate in the knowledge of God[a], and a chooser of his works.
translation:
  language: fr
  text: Car elle est initiée à la connaissance de Dieu et choisit ses œuvres[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « approuve ses œuvres ». L’expression grecque est inhabituelle et peut souligner que la Sagesse discerne et approuve ce que Dieu fait.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μύστις
  choice: initiée
  rationale: Le nom désigne une personne admise à des mystères ou à un savoir réservé. « Initiée » conserve cette nuance religieuse et philosophique sans importer les connotations modernes de « mystique ».
- source_word: ἐπιστήμης
  choice: connaissance
  rationale: Le terme exprime ici le savoir ou l’intelligence; « connaissance » s’insère naturellement dans la construction « connaissance de Dieu ».
- source_word: αἱρέτις
  choice: choisit
  rationale: Ce nom féminin rare dérive du verbe « choisir ». Une tournure verbale est plus naturelle en français que « choisisseuse », tout en restant proche du sens lexical.
- source_word: ἔργων
  choice: œuvres
  rationale: « Œuvres » garde l’étendue du grec et peut désigner aussi bien les actes que les réalisations de Dieu.
- source_word: γάρ
  choice: Car
  rationale: La conjonction introduit la raison de l’affirmation précédente; « Car » préserve ce lien explicatif.
theological_decisions:
- issue: Rendre μύστις dans un texte sapientiel aux résonances religieuses et philosophiques
  choice: elle est initiée à la connaissance de Dieu
  alternative: elle connaît les mystères de Dieu
  rationale: La formulation retenue conserve l’image d’une admission privilégiée à la connaissance divine sans transformer explicitement cette connaissance en « mystères » ni présenter la Sagesse comme une « mystique » au sens moderne.
- issue: Rendre l’expression rare αἱρέτις τῶν ἔργων αὐτοῦ
  choice: elle choisit ses œuvres
  alternative: elle approuve ses œuvres
  rationale: Le texte principal maintient l’idée première de choix et la formulation condensée du grec. Comme le mot rare peut aussi suggérer un choix favorable ou une approbation discernée, cette possibilité est signalée en note plutôt que résolue silencieusement.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure verbale « choisit » évite le substantif artificiel « choisisseuse », tandis que « initiée » conserve la métaphore d’accès à un savoir réservé.
