  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/005.yaml
  text: And if wealth is a desirable possession in life, what is richer than wisdom, which works all things?
translation:
  language: fr
  text: Et si la richesse est un bien désirable dans la vie, qu’y a-t-il de plus riche que la sagesse, elle qui accomplit toutes choses[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui produit toutes choses » ou « qui réalise toutes choses ». L’expression grecque est large et souligne l’action efficace de la sagesse sans en préciser ici la nature.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλοῦτός
  choice: richesse
  rationale: Rend directement l’abondance matérielle et permet de conserver le lien rhétorique avec « plus riche ».
- source_word: ἐπιθυμητὸν κτῆμα
  choice: un bien désirable
  rationale: « Bien » exprime naturellement en français ce qui est acquis ou possédé, tandis que « désirable » conserve l’évaluation du grec.
- source_word: ἐν βίῳ
  choice: dans la vie
  rationale: Traduction concise qui situe la valeur de la richesse dans l’existence humaine sans ajouter explicitement « cette ».
- source_word: τί σοφίας πλουσιώτερον
  choice: qu’y a-t-il de plus riche que la sagesse
  rationale: Préserve la question rhétorique ainsi que le jeu lexical entre « richesse » et « plus riche ».
- source_word: τῆς τὰ πάντα ἐργαζομένης
  choice: elle qui accomplit toutes choses
  rationale: Le pronom renforcé rattache clairement le participe féminin à la sagesse. « Accomplit » exprime son action efficace tout en évitant la tournure peu naturelle « travaille toutes choses ».
theological_decisions:
- issue: Portée de l’action de la sagesse dans τὰ πάντα ἐργαζομένης
  choice: elle qui accomplit toutes choses
  alternative: elle qui produit toutes choses
  rationale: « Accomplit » garde l’affirmation générale de l’efficacité universelle de la sagesse sans limiter le propos à la création ou à la production matérielle.
translation_notes:
  register: Français moderne, international et digne. La formulation conserve la métaphore de la richesse et la portée ample, volontairement non précisée, de l’activité attribuée à la sagesse.
