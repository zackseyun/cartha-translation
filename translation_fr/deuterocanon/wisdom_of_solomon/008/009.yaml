base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/009.yaml
  text: So I decided to take her to live with me[a], knowing that she would be a counselor of good things for me[b], and a comfort in cares and grief.
translation:
  language: fr
  text: J’ai donc décidé de la prendre afin de vivre avec elle[a], sachant qu’elle serait pour moi une conseillère dans ce qui est bon, et un encouragement[b] dans les soucis et la peine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la prendre pour compagne de vie » ; dans ce contexte, l’expression peut évoquer le mariage, mais le grec dit plus littéralement « la prendre en vue d’une vie commune », sans employer ici de terme explicite signifiant « épouser ».
    reason: alternative_reading
  - marker: b
    text: Ou « une exhortation », voire « un réconfort ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινα τοίνυν
  choice: J’ai donc décidé
  rationale: L’aoriste ἔκρινα exprime ici une décision arrêtée, tandis que τοίνυν marque la conclusion tirée de ce qui précède. Cette formulation est naturelle en français moderne.
- source_word: ταύτην
  choice: la
  rationale: Le pronom renvoie à la Sagesse personnifiée au féminin.
- source_word: ἀγαγέσθαι πρὸς συμβίωσιν
  choice: la prendre pour vivre avec elle
  rationale: La tournure grecque évoque le fait d’accueillir quelqu’un dans une vie partagée, sans employer explicitement dans ce verset un terme signifiant « épouser ».
- source_word: ἔσται μοι σύμβουλος ἀγαθῶν
  choice: elle serait pour moi une conseillère dans ce qui est bon
  rationale: Cette traduction conserve l’image personnelle de la conseillère et la portée assez large du génitif ἀγαθῶν, sans le réduire aux seuls conseils moralement bons ou pratiquement utiles.
- source_word: παραίνεσις
  choice: un encouragement
  rationale: Le mot peut désigner une exhortation, un encouragement ou, selon le contexte, un réconfort. « Encouragement » convient à son association avec les soucis et la peine tout en préservant sa dimension stimulante.
- source_word: φροντίδων καὶ λύπης
  choice: au milieu des soucis et de la peine
  rationale: φροντίδων évoque les préoccupations pesantes, et λύπης la tristesse ou la douleur. La préposition « au milieu de » rend naturellement en français la relation contextuelle exprimée par les génitifs.
theological_decisions:
- issue: Faut-il rendre explicitement le langage de vie commune par le mariage ?
  choice: la prendre pour vivre avec elle
  alternative: l’épouser / la prendre pour femme
  rationale: Le contexte plus large personnifie la Sagesse au moyen d’une imagerie qui peut être conjugale, mais le grec de ce verset parle littéralement de la prendre en vue d’une vie commune, sans terme matrimonial explicite. La traduction conserve donc l’image relationnelle sans la préciser davantage que le texte.
translation_notes:
  register: Français international moderne, fluide et digne. La Sagesse personnifiée demeure féminine. La structure nominale « une conseillère… et un encouragement » garde au plus près le parallélisme grec, tandis que « au milieu de » évite une construction française obscure avec les génitifs.
