base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/007.yaml
  text: And if anyone loves righteousness[a], her labors are virtues; for she teaches self-control and prudence, righteousness and courage[b], than which nothing is more useful for human beings in life.
translation:
  language: fr
  text: Et si quelqu’un aime la justice[a], ses labeurs sont des vertus[b] ; car elle enseigne la maîtrise de soi et la prudence, la justice et le courage, vertus dont rien n’est plus utile aux êtres humains dans la vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la droiture ». Le mot grec peut désigner aussi bien la rectitude morale que la justice.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ses labeurs sont des vertus ». Le grec personnifie la justice au féminin.'
    reason: translation_clarity
lexical_decisions:
- source_word: δικαιοσύνην
  choice: justice
  rationale: « Justice » est le correspondant français naturel de δικαιοσύνη et convient à la liste classique des vertus. Le terme grec peut aussi désigner plus largement la droiture morale, possibilité signalée en note.
- source_word: ἀγαπᾷ
  choice: aime
  rationale: Rend directement l’attachement personnel et moral exprimé par le verbe grec, sans l’affaiblir en simple préférence.
- source_word: οἱ πόνοι ταύτης
  choice: les fruits de ses efforts
  rationale: Le grec dit littéralement « ses labeurs/efforts ». En français, l’expression littérale « ses efforts sont des vertus » serait obscure; « les fruits de ses efforts » explicite sobrement le rapport de résultat suggéré par le contexte, tout en maintenant la personnification féminine.
- source_word: ἀρεταί
  choice: les vertus
  rationale: Dans ce contexte éthique hellénistique, ἀρεταί désigne naturellement les vertus, dont quatre sont immédiatement énumérées.
- source_word: σωφροσύνην
  choice: la maîtrise de soi
  rationale: Expression française actuelle et accessible pour la retenue et la juste maîtrise de ses dispositions; elle évite le caractère parfois vieilli ou plus étroit de « tempérance ».
- source_word: φρόνησιν
  choice: la prudence
  rationale: Désigne ici la sagesse pratique; « prudence » s’intègre naturellement à cette liste de vertus.
- source_word: ἀνδρείαν
  choice: le courage
  rationale: Rend clairement la force morale ou la vaillance sans conserver les connotations masculines historiques du mot grec.
- source_word: χρησιμώτερον
  choice: plus utile
  rationale: Équivalent direct du comparatif grec, naturel dans la maxime finale.
- source_word: ἐν βίῳ ἀνθρώποις
  choice: aux êtres humains durant leur vie
  rationale: Exprime à la fois les bénéficiaires au datif et le cadre de l’existence humaine, dans un français inclusif et naturel.
theological_decisions:
- issue: Personnification féminine de la justice
  choice: Conserver « ses » et « elle enseigne »
  alternative: Employer une formulation impersonnelle
  rationale: Les formes grecques féminines prolongent une véritable personnification littéraire. Le français permet de la préserver naturellement puisque « justice » est également féminin, sans en tirer une affirmation doctrinale supplémentaire.
- issue: Portée de δικαιοσύνη
  choice: justice
  alternative: droiture
  rationale: « Justice » convient particulièrement à l’énumération des quatre vertus, mais « droiture » rendrait mieux dans certains contextes la dimension générale de rectitude morale. La note conserve cette amplitude lexicale.
- issue: Rapport entre les efforts et les vertus
  choice: « les fruits de ses efforts sont les vertus »
  alternative: « ses labeurs sont des vertus »
  rationale: Le grec formule directement l’identité, mais une traduction strictement littérale serait difficile à comprendre en français. L’ajout minimal de « fruits » rend le sens probable sans effacer en note la forme plus abrupte de l’original.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation en deux phrases allège la longue période grecque. La répétition de « justice » est maintenue parce qu’elle appartient à la structure du texte et à l’énumération des vertus.
