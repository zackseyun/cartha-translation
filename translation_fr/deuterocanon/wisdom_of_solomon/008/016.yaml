  text: When I go into my house[a], I will find rest beside her; for her company has no bitterness, nor does living with her have pain, but gladness and joy.
translation:
  language: fr
  text: Quand j’entrerai dans ma maison, je me reposerai auprès d’elle[a] ; car sa compagnie n’a aucune amertume, ni la vie avec elle aucune peine, mais de l’allégresse et de la joie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je me reposerai avec elle ». Le verbe grec évoque le repos pris en étroite association avec la Sagesse.
    reason: alternative_lexicale
lexical_decisions:
- source_word: εἰσελθὼν εἰς τὸν οἶκόν μου
  choice: Quand je rentrerai chez moi
  rationale: Le participe aoriste situe l’action avant ou au moment du verbe principal. « Rentrer chez moi » exprime naturellement en français l’entrée dans sa propre maison.
- source_word: προσαναπαύσομαι αὐτῇ
  choice: je me reposerai auprès d’elle
  rationale: Le futur moyen exprime le repos pris en étroite association avec la Sagesse. « Auprès d’elle » rend cette proximité sans alourdir la phrase.
- source_word: συναναστροφή
  choice: sa compagnie
  rationale: Le terme désigne la fréquentation ou les relations suivies avec quelqu’un. « Sa compagnie » est naturel et conserve la dimension personnelle du texte.
- source_word: πικρίαν
  choice: amertume
  rationale: Ce nom évoque une expérience pénible ou désagréable. « Amertume » en préserve l’image et la force affective.
- source_word: συμβίωσις
  choice: la vie avec elle
  rationale: Le mot désigne le fait de vivre ensemble ou une vie partagée. Cette formulation est claire et évite le sens moderne plus restreint de « cohabitation ».
- source_word: ὀδύνην
  choice: peine
  rationale: Le terme peut désigner douleur, souffrance ou affliction. « Peine » convient au contexte relationnel et au registre sapientiel.
- source_word: εὐφροσύνην καὶ χαράν
  choice: allégresse et joie
  rationale: La traduction maintient les deux noms coordonnés et leur effet d’abondance, sans les fondre en une seule notion.
theological_decisions:
- issue: Personnification féminine de la Sagesse
  choice: Maintenir les pronoms féminins « elle » et « d’elle »
  alternative: Répéter « la Sagesse » ou employer une formulation abstraite
  rationale: Les formes grecques féminines présentent la Sagesse comme une figure personnelle. Le féminin conserve cette représentation littéraire et théologique sans en préciser davantage l’identité.
- issue: Nature du repos auprès de la Sagesse
  choice: « je me reposerai auprès d’elle »
  alternative: « je me reposerai avec elle »
  rationale: La formulation retenue garde la nuance de proximité portée par le verbe composé, tout en laissant ouverte la nature exacte de cette association.
translation_notes:
  register: 'Français international moderne, fluide et digne. La structure antithétique du grec est conservée : aucune amertume, aucune peine, mais allégresse et joie.'
