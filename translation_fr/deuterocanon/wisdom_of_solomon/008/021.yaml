  rationale: La révision retire l’ajout non motivé « déjà », rend plus directement la fonction de τὸ εἰδέναι (« savoir… relevait… »), et renforce légèrement le sens de requête de ἐνέτυχον. Elle conserve la condition exclusive du don divin, l’ambiguïté contrôlée de χάρις et la progression vers la prière qui suit.
