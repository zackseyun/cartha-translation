revisions:
- from: 'Mais, sachant que je ne pourrais pas me maîtriser si Dieu ne m’en faisait pas don — et c’était déjà faire preuve de discernement que de savoir de qui venait cette grâce[a] —, je me tournai vers le Seigneur et le suppliai. Je dis de tout mon cœur :'
