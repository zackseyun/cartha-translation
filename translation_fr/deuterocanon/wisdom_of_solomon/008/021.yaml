base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/021.yaml
  text: 'But knowing that I would not otherwise be self-controlled unless God gave it—and that this also was insight[a], to know whose gift it was—I appealed to the Lord and implored him, and I said with my whole heart:'
translation:
  language: fr
  text: 'Mais, sachant que je ne pourrais pas me maîtriser à moins que Dieu ne me l’accorde — et que savoir de qui venait cette grâce[a] relevait aussi du discernement —, je fis appel au Seigneur et le suppliai, et je dis de tout mon cœur :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce don » ou « cette faveur ». Le grec χάρις peut désigner la grâce, la faveur ou un don reçu ; ici, il renvoie à la maîtrise de soi accordée par Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: sachant
  rationale: Le participe aoriste introduit la prise de conscience qui conduit à la prière ; « sachant » reste concis et naturel.
- source_word: οὐκ ἄλλως ἔσομαι ἐγκρατής
  choice: je ne pourrais pas me maîtriser
  rationale: La formulation exprime qu’aucune autre voie ne permet d’acquérir la maîtrise de soi ; « se maîtriser » rend clairement ἐγκρατής en français actuel.
- source_word: ἐὰν μὴ ὁ θεὸς δῷ
  choice: si Dieu ne m’en faisait pas don
  rationale: Le verbe δῷ n’a pas d’objet exprimé ; « en » reprend naturellement la maîtrise de soi, et « faire don » souligne son origine divine.
- source_word: καὶ τοῦτο δὲ ἦν φρονήσεως
  choice: et c’était déjà faire preuve de discernement
  rationale: φρόνησις désigne ici une intelligence pratique ou lucide. Cette tournure française évite le sens moderne parfois étroit de « prudence ».
- source_word: τὸ εἰδέναι τίνος ἡ χάρις
  choice: que de savoir de qui venait cette grâce
  rationale: La construction grecque met l’accent sur l’identité de la source. « Grâce » conserve l’étendue sémantique de χάρις, tandis que « venait » explicite naturellement la relation génitive.
- source_word: ἐνέτυχον τῷ κυρίῳ
  choice: je me tournai vers le Seigneur
  rationale: Dans ce contexte de prière, ἐντυγχάνω indique que le locuteur s’adresse au Seigneur pour lui présenter sa requête.
- source_word: ἐδεήθην αὐτοῦ
  choice: le suppliai
  rationale: δέομαι exprime une demande instante ; « supplier » en conserve l’intensité.
- source_word: ἐξ ὅλης τῆς καρδίας μου
  choice: de tout mon cœur
  rationale: Expression française naturelle et digne qui traduit l’engagement intérieur total du grec.
theological_decisions:
- issue: Sens de χάρις dans l’expression τίνος ἡ χάρις
  choice: grâce
  alternative: don, faveur
  rationale: « Grâce » préserve l’ambiguïté lexicale du grec entre faveur et bienfait accordé. Le contexte indique qu’il s’agit concrètement de la maîtrise de soi reçue de Dieu, précision donnée en note sans réduire le terme dans le texte.
- issue: Rendu de κύριος dans la prière
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » est le rendu biblique français naturel de κύριος lorsqu’il désigne Dieu et convient à l’adresse priante.
- issue: Rapport entre maîtrise de soi et don divin
  choice: maintenir explicitement la nécessité du don de Dieu
  alternative: présenter Dieu comme une simple aide à l’effort humain
  rationale: La construction οὐκ ἄλλως… ἐὰν μή affirme une condition exclusive. La traduction conserve cette tension sans développer une doctrine au-delà du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient à la narration littéraire et mène directement à la prière du chapitre suivant. Le deux-points conserve la transition explicite vers 9.1.
