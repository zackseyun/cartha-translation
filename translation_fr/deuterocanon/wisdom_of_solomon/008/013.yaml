base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/013.yaml
  text: And through her I will have immortality[b][a], and I will leave behind an everlasting remembrance to those after me.
translation:
  language: fr
  text: Grâce à elle[a], j’aurai l’immortalité[b], et je laisserai un souvenir éternel à ceux qui viendront après moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par elle » ou « avec elle » ; le pronom renvoie à la Sagesse, personnifiée au féminin.
    reason: lexical_alternative
  - marker: b
    text: Le mot « immortalité » peut désigner l’absence personnelle de mort ou, en lien avec la proposition suivante, une mémoire qui perdure ; le grec laisse ouverte la relation entre ces deux idées.
    reason: alternative_reading
lexical_decisions:
- source_word: ἕξω
  choice: j’aurai
  rationale: Le futur de ἔχω exprime directement la possession; « j’aurai » reste naturel et n’ajoute pas l’idée explicite d’acquisition.
- source_word: δὲ
  choice: et
  rationale: Ici, δέ assure une transition légère plutôt qu’une opposition marquée.
- source_word: αὐτὴν
  choice: grâce à elle
  rationale: L’accusatif féminin renvoie à la Sagesse personnifiée. En français, « grâce à elle » exprime naturellement le rapport instrumental tout en conservant la personnification féminine.
- source_word: ἀθανασίαν
  choice: l’immortalité
  rationale: Équivalent français direct et usuel de ἀθανασία, qui préserve sans la préciser la portée personnelle ou figurée du terme.
- source_word: μνήμην αἰώνιον
  choice: un souvenir éternel
  rationale: Cette formulation rend l’idée d’une mémoire durable laissée par le locuteur, sans transformer explicitement celle-ci en monument ou en renommée.
- source_word: τοῖς μετʼ ἐμὲ
  choice: à ceux qui viendront après moi
  rationale: Le datif est rendu par « à », et l’ajout idiomatique de « viendront » désigne clairement les générations ultérieures.
- source_word: ἀπολείψω
  choice: je laisserai
  rationale: Dans ce contexte, le futur de ἀπολείπω signifie laisser quelque chose aux générations suivantes; la construction française rend déjà suffisamment l’idée de ce qui subsiste après soi.
theological_decisions:
- issue: Sens de l’immortalité obtenue grâce à la Sagesse personnifiée
  choice: Conserver « immortalité » sans trancher entre une absence personnelle de mort et une survie par la mémoire.
  alternative: Comprendre uniquement une immortalité personnelle, ou uniquement une renommée impérissable.
  rationale: Le parallélisme avec le « souvenir éternel » autorise un lien entre les deux idées, mais le grec ne les identifie pas explicitement. La traduction maintient cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. « Grâce à elle » préserve la personnification de la Sagesse et rend lisible la valeur instrumentale; les notes maintiennent les possibilités du grec sans imposer une interprétation doctrinale.
