  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/003.yaml
  text: Her nobility is glorified by living together with God[a], and the Master of all loved her.
translation:
  language: fr
  text: Sa noblesse est honorée par la vie qu’elle partage avec Dieu[a], et le Maître de tous l’a aimée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Sa noblesse est honorée par sa communion de vie avec Dieu. » Le grec συμβίωσις peut désigner la vie commune, la compagnie ou le fait d’habiter ensemble.'
    reason: alternative lexicale
lexical_decisions:
- source_word: εὐγένειαν
  choice: noblesse
  rationale: Le nom peut désigner la noblesse de naissance ou l’excellence du caractère. « Noblesse » conserve cette ampleur et convient à la dignité personnifiée de la Sagesse.
- source_word: δοξάζει
  choice: est mise en lumière
  rationale: Le verbe signifie rendre glorieux, honorer ou exalter. Cette tournure française exprime naturellement que la vie partagée avec Dieu manifeste et rehausse la noblesse de la Sagesse.
- source_word: συμβίωσις θεοῦ ἔχουσα
  choice: par la vie qu’elle partage avec Dieu
  rationale: συμβίωσις évoque une vie commune, une cohabitation ou une compagnie durable; la formulation retenue garde l’idée concrète d’une vie partagée tout en intégrant naturellement le participe ἔχουσα.
- source_word: ὁ πάντων δεσπότης
  choice: le Maître de tous
  rationale: δεσπότης désigne un maître ou souverain. « Maître » préserve la distinction lexicale avec κύριος, habituellement rendu par « Seigneur », tandis que πάντων est rendu dans son sens universel.
- source_word: ἠγάπησεν αὐτήν
  choice: l’a aimée
  rationale: L’aoriste est rendu par un passé composé naturel en français; le pronom féminin maintient la personnification de la Sagesse.
theological_decisions:
- issue: Personnification de la Sagesse
  choice: Maintenir le féminin personnel dans « elle » et « l’a aimée ».
  alternative: Employer des formulations impersonnelles qui traiteraient la sagesse comme une simple qualité abstraite.
  rationale: Les formes grecques sont féminines et le contexte présente la Sagesse comme une figure féminine personnifiée, sans imposer une identification doctrinale ultérieure.
- issue: Titre divin δεσπότης
  choice: « le Maître de tous »
  alternative: « le Seigneur de tous » ou « le Souverain de tous »
  rationale: « Maître » conserve la différence entre δεσπότης et κύριος et évite de fondre deux titres grecs distincts dans le même terme français.
translation_notes:
  register: Français international moderne, digne et accessible. « La vie qu’elle partage avec Dieu » évite la lourdeur de « cohabitation » tout en gardant le caractère concret de συμβίωσις; « mise en lumière » est plus idiomatique que « glorifiée » dans cette construction.
