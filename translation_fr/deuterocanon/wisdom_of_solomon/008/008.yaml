base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/008.yaml
  text: And if anyone longs even for much experience[a], she knows the things of old and can infer the things to come; she understands turns of speech and solutions to riddles[b]; she knows beforehand signs and wonders and the outcomes of seasons and times.
translation:
  language: fr
  text: Et si quelqu’un désire aussi une vaste expérience[a], elle connaît ce qui est ancien et peut conjecturer ce qui est à venir ; elle comprend les subtilités du discours et la solution des énigmes ; elle connaît d’avance les signes et les prodiges, ainsi que l’issue des époques et des temps.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une grande expérience », « un vaste savoir » ou « une grande expertise ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πολυπειρίαν
  choice: une vaste expérience
  rationale: Le nom désigne une expérience étendue ou une grande connaissance acquise par l’expérience. « Une vaste expérience » rend naturellement l’idée d’ampleur exprimée par πολυ- sans la réduire au savoir livresque.
- source_word: ποθεῖ
  choice: désire
  rationale: Le verbe exprime un désir soutenu. « Désire » est naturel et digne ; « aspire à » serait également possible.
- source_word: τὰ ἀρχαῖα
  choice: les choses anciennes
  rationale: L’expression renvoie largement aux réalités ou événements d’autrefois, sans imposer le sens plus étroit de « ce qui est à l’origine ».
- source_word: τὰ μέλλοντα εἰκάζειν
  choice: sait conjecturer celles qui sont à venir
  rationale: εἰκάζω indique une conjecture ou une déduction à partir d’indices, avec moins de force que προγινώσκω plus loin. Cette formulation maintient la distinction interne du grec.
- source_word: στροφὰς λόγων
  choice: les subtilités du discours
  rationale: La locution peut évoquer les tours, détours ou difficultés du langage et du raisonnement. « Subtilités du discours » est idiomatique et conserve cette largeur de sens.
- source_word: λύσεις αἰνιγμάτων
  choice: la solution des énigmes
  rationale: λύσεις désigne le dénouement ou la résolution, et αἰνίγματα des énigmes. Le singulier collectif français donne une expression naturelle.
- source_word: σημεῖα καὶ τέρατα
  choice: les signes et les prodiges
  rationale: Cette paire consacrée dans le langage biblique rend précisément les phénomènes porteurs de sens et extraordinaires.
- source_word: προγινώσκει
  choice: connaît d’avance
  rationale: La formulation transparente rend la connaissance préalable sans charger le verbe d’une interprétation théologique étrangère au contexte.
- source_word: ἐκβάσεις
  choice: l’issue
  rationale: Le nom désigne l’aboutissement ou le résultat. « L’issue » convient naturellement avec le complément pluriel coordonné.
- source_word: καιρῶν καὶ χρόνων
  choice: des époques et des temps
  rationale: « Époques » peut exprimer les périodes ou moments déterminants de καιροί, tandis que « temps » garde la portée plus générale de χρόνοι. La traduction maintient deux termes distincts.
theological_decisions:
- issue: Personnification de la Sagesse
  choice: Employer le pronom féminin « elle ».
  alternative: Répéter « la Sagesse » ou employer un pronom neutre conceptuel.
  rationale: Le contexte immédiat présente la Sagesse comme une figure féminine agissante. Le féminin français respecte à la fois cette personnification et le genre du nom, sans trancher une question ontologique ultérieure.
- issue: Force de εἰκάζειν
  choice: « sait conjecturer celles qui sont à venir »
  alternative: « prévoit l’avenir » ou « prédit ce qui doit arriver »
  rationale: Le grec suggère ici la conjecture ou l’inférence plutôt qu’une vision prophétique directe. La traduction préserve ainsi le contraste avec προγινώσκει, « connaît d’avance », dans la proposition suivante.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La phrase conserve l’accumulation rhétorique du grec et varie les verbes de connaissance afin de respecter leurs nuances. Le marqueur [a] figure immédiatement après l’expression concernée.
