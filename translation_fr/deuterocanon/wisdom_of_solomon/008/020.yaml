  text: Rather[a], being good, I came into an undefiled body.
translation:
  language: fr
  text: 'Ou plutôt : étant bon, je suis venu dans un corps sans souillure.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je suis entré dans un corps sans souillure ». Le verbe grec signifie littéralement « je suis venu », mais, dans ce contexte, il peut désigner l’entrée dans l’existence corporelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: μᾶλλον δὲ
  choice: Mais plutôt
  rationale: L’expression introduit une correction ou une reformulation plus forte par rapport à ce qui précède; « Mais plutôt » en conserve la valeur adversative et progressive.
- source_word: ἀγαθὸς ὢν
  choice: puisque j’étais bon
  rationale: Le participe exprime ici la qualité morale du locuteur et peut avoir une nuance circonstancielle. « Puisque j’étais bon » rend naturellement en français le lien logique suggéré par le contexte, sans préciser davantage la nature de cette bonté.
- source_word: ἦλθον
  choice: je suis venu
  rationale: Le verbe signifie littéralement « venir ». Cette traduction évite d’imposer l’interprétation plus précise d’une entrée de l’âme dans le corps.
- source_word: εἰς σῶμα
  choice: dans un corps
  rationale: La préposition εἰς indique un mouvement vers ou dans, et l’absence d’article favorise « un corps » plutôt que « le corps ».
- source_word: ἀμίαντον
  choice: sans souillure
  rationale: Cette expression conserve les connotations de pureté et d’absence de contamination morale ou rituelle de ἀμίαντος, dans un français actuel et digne.
theological_decisions:
- issue: Possible implication d’une préexistence ou d’une transmigration dans « je suis venu dans un corps sans souillure »
  choice: Traduire directement l’énoncé sans trancher la question anthropologique.
  alternative: Comprendre soit qu’une âme préexistante entre dans un corps, soit qu’il s’agit d’une manière rhétorique de décrire une naissance avec une constitution pure.
  rationale: Le grec affirme que le locuteur, étant bon, est venu dans un corps sans souillure, mais ne développe pas ici le mécanisme envisagé. La formulation retenue préserve cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation demeure proche de la syntaxe grecque tout en explicitant par « puisque » la valeur circonstancielle probable du participe; la note conserve l’autre lecture possible du verbe.
