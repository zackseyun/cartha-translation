base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/001.yaml
  text: But she reaches mightily from one end to the other[a], and she governs all things well.
translation:
  language: fr
  text: Mais elle s’étend avec puissance d’une extrémité à l’autre[a] et gouverne tout avec bonté[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « elle déploie vigoureusement son action d’un bout à l’autre ».'
    reason: Alternative lexicale pour διατείνει et εὐρώστως, qui peuvent souligner à la fois l’extension et la vigueur de l’action.
  - marker: b
    text: 'Ou : « elle gouverne bien toutes choses ».'
    reason: χρηστῶς peut exprimer la bonté, le caractère bienfaisant ou, plus généralement, l’excellence de la manière de gouverner.
lexical_decisions:
- source_word: διατείνει
  choice: s’étend
  rationale: Le verbe exprime une extension continue ou une portée qui traverse tout un espace. « S’étend » conserve cette image sans ajouter l’idée plus interprétative d’omniprésence.
- source_word: ἀπὸ πέρατος εἰς πέρας
  choice: d’une extrémité à l’autre
  rationale: Cette tournure naturelle en français rend l’étendue totale exprimée par les deux limites.
- source_word: εὐρώστως
  choice: avec puissance
  rationale: L’adverbe évoque la force, la vigueur et la robustesse. « Avec puissance » convient au registre élevé tout en restant actuel.
- source_word: διοικεῖ
  choice: gouverne
  rationale: Le verbe désigne l’action de diriger, administrer ou régler un ensemble. « Gouverne » exprime clairement le rôle actif de la Sagesse à l’égard de toutes choses.
- source_word: τὰ πάντα
  choice: tout
  rationale: « Tout » rend avec naturel la totalité cosmique visée, sans alourdir la phrase.
- source_word: χρηστῶς
  choice: avec bonté
  rationale: L’adverbe peut évoquer ce qui est bon, bienfaisant ou excellent. « Avec bonté » préserve la dimension favorable de ce gouvernement, tandis qu’une note signale le sens plus général « bien ».
- source_word: δὲ
  choice: Mais
  rationale: La particule assure la progression du propos avec une légère nuance de contraste. « Mais » suit cette articulation sans la renforcer excessivement.
- source_word: implicit feminine subject (Wisdom)
  choice: elle
  rationale: Le sujet implicite renvoie à la Sagesse personnifiée, nom féminin en grec comme en français. Le pronom maintient naturellement cette personnification.
theological_decisions:
- issue: Personnification de la Sagesse
  choice: Conserver le pronom féminin « elle ».
  alternative: Répéter « la Sagesse » afin d’atténuer l’impression de personnification.
  rationale: Le contexte grec présente la Sagesse comme un sujet féminin qui agit sur l’ensemble de la création. Le pronom respecte cette présentation littéraire et théologique sans trancher la question de son statut ni l’identifier explicitement à une figure doctrinale ultérieure.
- issue: Nuance de χρηστῶς dans le gouvernement de la Sagesse
  choice: « avec bonté »
  alternative: « bien » ou « de manière excellente »
  rationale: Le grec permet d’entendre à la fois la qualité et le caractère bienfaisant de cette administration. Le texte principal retient la bonté, mais la note maintient ouverte la nuance plus générale de bonne administration.
translation_notes:
  register: Français international moderne, digne et fluide. La structure en deux propositions parallèles est conservée, ainsi que la personnification féminine de la Sagesse. « D’une extrémité à l’autre » garde l’image spatiale et cosmique du grec.
