  to: Dans son amitié se trouve une joie bienfaisante ; dans les travaux de ses mains, une richesse inépuisable ; dans l’exercice en sa compagnie, la prudence[a] ; et dans le partage de ses paroles, une bonne renommée[b]. Je suis allé de tous côtés, cherchant comment la prendre pour moi[c].
