base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/018.yaml
  text: And in her friendship there is good delight[a], and in the labors of her hands, unfailing wealth, and in companionship with her, prudence, and honor in sharing her words[c][b]. I went about seeking how I might take her to myself.
translation:
  language: fr
  text: Dans son amitié se trouve une joie bienfaisante ; dans les travaux de ses mains, une richesse inépuisable ; dans l’exercice en sa compagnie, la prudence[a] ; et dans le partage de ses paroles, une bonne renommée[b]. Je suis allé de tous côtés, cherchant comment la prendre pour moi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec associe ici l’idée d’exercice ou de formation partagée à celle de fréquentation ou d’association avec la Sagesse ; on pourrait aussi traduire : « dans l’exercice partagé de sa fréquentation, la prudence ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l’honneur ». Le mot grec désigne l’estime publique ou la réputation favorable.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « l’acquérir pour moi ». La formulation grecque présente une appropriation personnelle de la Sagesse sans rendre l’image explicitement conjugale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλίᾳ
  choice: amitié
  rationale: Le terme désigne ici la relation avec la Sagesse personnifiée. « Amitié » conserve cette dimension relationnelle sans lui donner une portée explicitement romantique.
- source_word: τέρψις ἀγαθή
  choice: une joie qui est bonne
  rationale: « Joie » rend l’idée de délectation ou d’agrément, tandis que la relative maintient explicitement la qualification morale ἀγαθή sans employer l’expression française ambiguë « bon plaisir ».
- source_word: πόνοις χειρῶν αὐτῆς
  choice: les travaux de ses mains
  rationale: Cette formulation conserve l’image concrète des mains ainsi que l’idée d’activité laborieuse et féconde.
- source_word: πλοῦτος ἀνεκλιπής
  choice: une richesse inépuisable
  rationale: ἀνεκλιπής qualifie ce qui ne vient pas à manquer ; « inépuisable » l’exprime naturellement en français.
- source_word: συγγυμνασίᾳ ὁμιλίας αὐτῆς
  choice: dans l’exercice assidu de sa compagnie
  rationale: La formule cherche à conserver à la fois l’idée d’exercice ou de formation partagée portée par συγγυμνασίᾳ et celle de fréquentation familière portée par ὁμιλίας, tout en signalant en note la densité inhabituelle du grec.
- source_word: φρόνησις
  choice: la prudence
  rationale: φρόνησις désigne une sagesse pratique, un discernement appliqué à la conduite ; « prudence » évite aussi de répéter « Sagesse ».
- source_word: εὔκλεια
  choice: une bonne renommée
  rationale: Le mot vise l’estime publique et la réputation favorable plus précisément qu’un honneur abstrait.
- source_word: κοινωνίᾳ λόγων αὐτῆς
  choice: dans le partage de ses paroles
  rationale: « Partage » exprime la participation impliquée par κοινωνία, et « paroles » garde ouverte la nuance entre propos, discours et enseignements.
- source_word: περιῆλθον ζητῶν
  choice: Je suis allé de tous côtés, cherchant
  rationale: La traduction garde l’idée de déplacement contenue dans περιῆλθον ainsi que la recherche délibérée exprimée par le participe.
- source_word: ὅπως λάβω αὐτὴν εἰς ἐμαυτόν
  choice: comment la prendre pour moi
  rationale: Cette formulation maintient l’appropriation personnelle de la Sagesse personnifiée sans préciser si l’image est conjugale, acquisitive ou intérieure.
theological_decisions:
- issue: Personnification féminine de la Sagesse
  choice: Conserver la Sagesse comme figure féminine au moyen des possessifs et pronoms féminins.
  alternative: Dépersonnaliser le passage en parlant seulement des avantages abstraits de la sagesse.
  rationale: Le grec emploie constamment des formes féminines et présente la Sagesse comme une personne avec laquelle on entre en relation.
- issue: Portée de « la prendre pour moi »
  choice: Garder une formulation personnelle mais non explicitée.
  alternative: Traduire de manière explicitement conjugale (« la prendre pour épouse ») ou purement acquisitive (« l’acquérir »).
  rationale: Le texte évoque une appropriation personnelle de la Sagesse, mais ce verset ne tranche pas à lui seul entre les résonances conjugale, acquisitive et intérieure.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe énumérative du grec est conservée, avec des formulations légèrement explicitées lorsque le calque serait obscur. La personnification féminine et les ambiguïtés relationnelles du texte restent intactes.
