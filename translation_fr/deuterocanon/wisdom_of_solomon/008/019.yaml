  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/019.yaml
  text: I was a gifted child[a], and I received a good soul,
translation:
  language: fr
  text: Or, j’étais un enfant bien doué[a], et je reçus en partage une âme bonne,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’un heureux naturel » ; le grec peut désigner plus largement une constitution ou des dispositions naturelles favorables.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παῖς
  choice: enfant
  rationale: Le contexte évoque les premières années du locuteur. « Enfant » exprime l’âge sans préciser inutilement le sexe ou le degré de maturité.
- source_word: δὲ
  choice: Or
  rationale: La particule marque ici une transition légère dans le raisonnement. « Or » rend cette articulation sans introduire une idée temporelle absente du grec.
- source_word: εὐφυής
  choice: bien doué
  rationale: L’adjectif désigne une personne favorablement dotée par nature, par sa constitution ou ses dispositions. « Bien doué » reste naturel en français et ne réduit pas le sens à la seule apparence physique.
- source_word: ψυχῆς
  choice: âme
  rationale: « Âme » conserve la portée anthropologique de ψυχή et évite de la réduire à la vie biologique ou au simple caractère.
- source_word: ἔλαχον
  choice: je reçus en partage
  rationale: Le verbe évoque ce qui échoit ou est attribué en partage. Cette formulation garde cette nuance tout en restant idiomatique et digne.
- source_word: ἀγαθῆς
  choice: bonne
  rationale: « Bonne » rend directement l’évaluation positive du grec sans la limiter à la vertu morale, à la noblesse ou à l’excellence.
theological_decisions:
- issue: Portée anthropologique de ψυχῆς ἔλαχον ἀγαθῆς
  choice: Conserver « âme » et la présenter comme reçue en partage
  alternative: « j’avais de bonnes dispositions » ou « je reçus une bonne nature »
  rationale: Le grec nomme explicitement la ψυχή. La traduction maintient donc le langage de l’âme et l’ambiguïté anthropologique du passage, sans l’assimiler à une doctrine particulière ni le réduire au tempérament.
translation_notes:
  register: Français international moderne, clair et digne. « Or » marque sobrement la transition portée par δέ. L’ordre « une âme bonne » évite que « une bonne âme » soit compris comme l’expression idiomatique désignant une personne bienveillante.
