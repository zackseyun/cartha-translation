base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/018.yaml
  text: For the elements[a], changing among themselves, as in a harp the notes of the melody alter the name, while always remaining in the sound[b], as may be accurately inferred from the sight of what happened.
translation:
  language: fr
  text: En effet, les éléments se réagencent entre eux, comme, sur une harpe, les notes du rythme[a] changent de nom tout en demeurant toujours dans le son[b] ; on peut le déduire avec précision de l’observation de ce qui s’est produit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les notes de la mesure ». L’expression grecque est condensée et son sens musical exact demeure incertain.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement, le grec dit qu’elles « demeurent toujours dans le son ». La phrase souligne une continuité sonore au sein du changement, sans en préciser davantage la nature.
    reason: textual_clarity
lexical_decisions:
- source_word: στοιχεῖα
  choice: les éléments
  rationale: Dans le contexte des transformations de la nature lors de l’Exode, le terme désigne concrètement les composantes du monde créé, sans qu’il soit nécessaire d’y voir des puissances cosmiques personnifiées.
- source_word: μεθαρμοζόμενα
  choice: se réaccordent entre eux
  rationale: Le verbe évoque un nouvel agencement ou accord. « Se réaccordent » conserve le lien avec la comparaison musicale tout en exprimant la reconfiguration mutuelle des éléments.
- source_word: ψαλτηρίῳ
  choice: harpe
  rationale: « Harpe » fournit en français moderne un équivalent concret et immédiatement compréhensible de cet instrument à cordes, sans employer le terme rare « psaltérion ».
- source_word: φθόγγοι
  choice: notes
  rationale: Dans la comparaison musicale, « notes » rend naturellement les sons distincts produits par l’instrument.
- source_word: τοῦ ῥυθμοῦ
  choice: du rythme
  rationale: Cette traduction directe préserve l’idée grecque d’une organisation musicale mesurée, malgré une formulation inhabituelle en français.
- source_word: τὸ ὄνομα διαλλάσσουσιν
  choice: changent de nom
  rationale: La formulation conserve le surprenant « nom » du grec au lieu de résoudre l’image par une paraphrase comme « changent de caractère ».
- source_word: πάντοτε μένοντα ἤχῳ
  choice: tout en demeurant toujours des sons
  rationale: Le grec est condensé et difficile. Cette formulation garde l’opposition entre la variation de désignation et la permanence dans le domaine sonore, sans imposer une explication plus précise que le texte.
- source_word: ὅπερ ἐστὶν εἰκάσαι … ἀκριβῶς
  choice: on peut le déduire avec précision
  rationale: La formulation rend à la fois la possibilité d’inférer ou de reconnaître et la nuance de précision portée par ἀκριβῶς.
- source_word: ἐκ τῆς τῶν γεγονότων ὄψεως
  choice: en observant ce qui s’est produit
  rationale: Cette expression française naturelle conserve l’idée que l’analogie est tirée de la constatation visuelle des événements rapportés.
theological_decisions:
- issue: Portée des « éléments » et de leur transformation
  choice: Présenter les éléments de la nature comme se réagençant entre eux dans les événements de l’Exode.
  alternative: Comprendre στοιχεῖα comme des puissances élémentaires ou des principes cosmiques au sens philosophique.
  rationale: Le contexte immédiat décrit des transformations observables de l’ordre créé. La traduction reste donc concrète et phénoménologique, sans ajouter une cosmologie philosophique ou une personnification.
- issue: Sens précis de la comparaison musicale
  choice: Conserver l’image difficile des notes qui « changent de nom » tout en restant des sons.
  alternative: Expliciter l’image en disant que les notes changent de fonction, de caractère ou de désignation dans la mélodie.
  rationale: Le grec maintient une tension conceptuelle inhabituelle. La traduction ne tranche pas entre les différentes explications possibles de cette analogie.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement ordonnée pour rendre lisible la longue comparaison grecque, tandis que « changent de nom » et « notes du rythme » en préservent volontairement l’étrangeté.
