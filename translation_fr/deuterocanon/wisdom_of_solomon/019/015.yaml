  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/015.yaml
  text: And not only that[a], but there will be an inspection of them, because they received the foreigners with hostility.
translation:
  language: fr
  text: 'Et ce n’est pas tout : ils feront l’objet d’une visite[a], parce qu’ils avaient accueilli les étrangers avec hostilité.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils feront l’objet d’une inspection ». Le mot grec peut aussi désigner une visitation divine, notamment en vue du jugement.'
    reason: alternative lexicale et nuance contextuelle de ἐπισκοπή
lexical_decisions:
- source_word: οὐ μόνον
  choice: ce n’est pas tout
  rationale: Cette tournure française naturelle marque que l’auteur ajoute un grief à celui qui précède.
- source_word: ἐπισκοπή
  choice: intervention
  rationale: Le terme peut désigner une inspection, une visite ou une intervention, avec ici une probable portée judiciaire. « Intervention » garde cette ouverture sans expliciter directement un châtiment.
- source_word: ἀπεχθῶς
  choice: avec hostilité
  rationale: Cette expression rend clairement et naturellement la manière hostile dont les étrangers ont été reçus.
- source_word: προσεδέχοντο
  choice: accueillaient
  rationale: Le verbe signifie recevoir ou accueillir. L’imparfait convient au récit et le complément « avec hostilité » empêche de donner au verbe une valeur favorable.
- source_word: τοὺς ἀλλοτρίους
  choice: les étrangers
  rationale: Le mot désigne ici des personnes appartenant à un autre peuple ; « étrangers » est précis et courant en français moderne.
theological_decisions:
- issue: Portée judiciaire de ἐπισκοπή
  choice: une intervention les attend
  alternative: ils feront l’objet d’une inspection ; une visite les attend ; ils seront châtiés
  rationale: Le contexte suggère une intervention divine en jugement, mais le grec ne nomme pas directement un châtiment. La traduction conserve donc la tension, et la note signale les autres nuances possibles.
translation_notes:
  register: Français international moderne, fluide et digne. « Ce n’est pas tout » assure le lien argumentatif ; « une intervention les attend » reste compréhensible tout en préservant l’ambiguïté du terme grec.
