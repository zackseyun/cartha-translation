base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/002.yaml
  text: because after they themselves[a] had turned back from letting them go, and had sent them on with urgency, they would pursue them[b], having changed their minds.
translation:
  language: fr
  text: En effet, eux-mêmes, après être revenus sur leur décision de les laisser partir[a] et les avoir envoyés en toute hâte, se lanceraient à leur poursuite, ayant changé d’avis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est difficile. On peut aussi comprendre : « après avoir changé d’avis pour les laisser partir » ou, plus littéralement, « après être revenus de les laisser partir ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « pris de regret » ou « l’ayant regretté ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστρέψαντες
  choice: s’être eux-mêmes résolus
  rationale: Le participe exprime ici un retournement qui conduit à permettre le départ. « Se résoudre à » rend naturellement en français cette décision après une résistance antérieure, sans répéter « changer d’avis » avant μεταμεληθέντες.
- source_word: τοῦ ἀπεῖναι
  choice: à les laisser partir
  rationale: Dans le contexte de l’Exode, l’infinitif substantivé renvoie au fait de permettre aux Israélites de s’en aller, plutôt qu’à leur simple absence.
- source_word: μετὰ σπουδῆς
  choice: en toute hâte
  rationale: σπουδή peut désigner l’empressement, le zèle ou la rapidité. Ici, « en toute hâte » convient au départ pressant imposé aux Israélites.
- source_word: προπέμψαντες
  choice: les avoir fait partir
  rationale: Le verbe signifie envoyer en avant ou accompagner au départ. Cette formulation française conserve l’idée de mise en route sans affirmer un accompagnement physique que le contexte n’exige pas.
- source_word: διώξουσιν
  choice: ils se lanceraient à leur poursuite
  rationale: Le futur grec décrit la poursuite concrète des Israélites par les Égyptiens. Le conditionnel français s’accorde naturellement avec la perspective passée établie au verset précédent.
- source_word: μεταμεληθέντες
  choice: pris de regret
  rationale: Le participe désigne un regret qui entraîne un revirement. Cette expression évite la connotation théologique plus marquée de « se repentir ».
theological_decisions:
- issue: Sujet narratif et référents implicites
  choice: Conserver les Égyptiens comme sujet implicite et les Israélites comme objet pronominal, sans les nommer dans le texte.
  alternative: Nommer explicitement « les Égyptiens » et « les Israélites » pour rendre le verset autonome.
  rationale: Les pronoms grecs dépendent du contexte précédent. Les expliciter par des noms rendrait la lecture plus facile isolément, mais ajouterait des éléments absents de ce verset.
- issue: Relation de ἐπιστρέψαντες avec τοῦ ἀπεῖναι
  choice: Comprendre l’expression comme leur décision finalement prise de permettre le départ.
  alternative: Traduire plus littéralement par « après être revenus sur la question de leur départ » ou comprendre un retour après les avoir laissés partir.
  rationale: La construction est difficile et permet plusieurs nuances. Le contexte favorise un revirement initial conduisant à la libération, suivi du regret exprimé par μεταμεληθέντες; une note préserve les autres possibilités.
translation_notes:
  register: Français international moderne, courant et digne. « En effet » relie ce fragment causal au verset précédent; le conditionnel « se lanceraient » restitue le futur grec vu depuis le récit au passé. La syntaxe demeure fluide tout en conservant l’insistance de αὐτοὶ par « eux-mêmes ».
