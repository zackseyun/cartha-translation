review_pass:
  verdict: revise
  source_fidelity: La formulation « s’être eux-mêmes résolus » interprète ἐπιστρέψαντες comme une décision positive de les libérer et efface le sens premier de retournement/revenir sur une position. Le grec est syntaxiquement et sémantiquement difficile; il convient de conserver ce retournement sans trancher excessivement sa direction. « Envoyés en toute hâte » rend bien προπέμψαντες μετὰ σπουδῆς, et « ayant changé d’avis » rend sobrement μεταμεληθέντες.
  naturalness: Le français du projet est globalement fluide, mais « s’être eux-mêmes résolus à les laisser partir » est moins direct et charge l’expression d’une motivation que le grec ne formule pas. La révision reste naturelle dans un registre narratif moderne.
  terminology: Les référents implicites sont maintenus conformément au grec. « Se lancer à leur poursuite » convient à διώξουσιν; « ayant changé d’avis » évite d’imposer la connotation religieuse de « se repentir ».
  issues:
  - severity: medium
    issue: ἐπιστρέψαντες est rendu par « s’être eux-mêmes résolus ».
    rationale: Cette expression ne traduit pas explicitement l’idée de retour ou de revirement portée par ἐπιστρέψαντες et privilégie une seule interprétation contestable de la construction δύσκολη avec τοῦ ἀπεῖναι.
  - severity: low
    issue: « les avoir fait partir » affaiblit légèrement προπέμψαντες.
    rationale: Le verbe évoque l’envoi en avant ou l’accompagnement au départ. « Les avoir envoyés » est plus proche sans affirmer qu’ils les ont accompagnés physiquement.
  revised_text: En effet, eux-mêmes, après être revenus sur leur décision de les laisser partir[a] et les avoir envoyés en toute hâte, se lanceraient à leur poursuite, ayant changé d’avis[b].
