- from: En effet, après s’être eux-mêmes résolus à les laisser partir[a] et les avoir fait partir en toute hâte, ils se lanceraient à leur poursuite, pris de regret[b].
  to: En effet, eux-mêmes, après être revenus sur leur décision de les laisser partir[a] et les avoir envoyés en toute hâte, se lanceraient à leur poursuite, ayant changé d’avis[b].
  rationale: La révision restitue le mouvement de revirement exprimé par ἐπιστρέψαντες et signale en note l’ambiguïté réelle de sa relation avec « les laisser partir ». Elle conserve l’antériorité des participes, l’insistance de αὐτοὶ (« eux-mêmes »), l’urgence de μετὰ σπουδῆς et le futur narratif de διώξουσιν, sans expliciter les pronoms par des noms absents du verset.
