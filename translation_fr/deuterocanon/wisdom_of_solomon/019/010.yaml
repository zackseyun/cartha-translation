base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/010.yaml
  text: 'For they still remembered the things in their time as foreigners: how[a], instead of the breeding of animals, the land brought forth gnats, and instead of creatures of the water[b], the river spewed out a multitude of frogs.'
translation:
  language: fr
  text: 'Car ils se souvenaient encore de ce qui s’était passé durant leur séjour en terre étrangère : comment, au lieu de la naissance d’animaux, la terre avait produit des moucherons[a], et comment, au lieu d’animaux aquatiques, le fleuve avait vomi une multitude de grenouilles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’insecte exact désigné par le grec est incertain ; on peut aussi comprendre « moustiques » ou d’autres petits insectes piqueurs.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμέμνηντο γὰρ ἔτι
  choice: Car ils se souvenaient encore
  rationale: L’imparfait exprime un souvenir qui demeurait présent, tandis que ἔτι est rendu par « encore ».
- source_word: τῶν ἐν τῇ παροικίᾳ αὐτῶν
  choice: de ce qui s’était passé durant leur séjour en terre étrangère
  rationale: παροικία désigne le fait de résider dans un pays où l’on est étranger. Cette formulation française explicite naturellement la référence aux événements vécus pendant ce séjour sans introduire la notion plus forte d’exil.
- source_word: ἀντὶ μὲν γενέσεως ζῴων
  choice: au lieu de faire naître des animaux
  rationale: γένεσις désigne ici la venue à l’existence ou la production normale d’animaux. La tournure verbale est naturelle en français et conserve le contraste avec la production extraordinaire des insectes.
- source_word: ἐξήγαγεν ἡ γῆ σκνῖπα
  choice: la terre avait produit des moucherons
  rationale: ἐξάγω décrit ce que la terre fait sortir ou produit. « Produire » convient au sujet « la terre »; « moucherons » est une désignation française courante, tout en laissant l’identification exacte à une note.
- source_word: ἀντὶ δὲ ἐνύδρων
  choice: et au lieu d’animaux aquatiques
  rationale: ἐνύδρων est un adjectif substantivé désignant les êtres qui vivent dans l’eau. « Animaux aquatiques » est précis, clair et naturel.
- source_word: ἐξηρεύξατο ὁ ποταμὸς
  choice: le fleuve avait vomi
  rationale: Le verbe ἐξερεύγομαι évoque une expulsion vigoureuse. « Vomir » préserve cette image frappante sans l’atténuer.
- source_word: πλῆθος βατράχων
  choice: une multitude de grenouilles
  rationale: πλῆθος souligne le très grand nombre; « une multitude » maintient le registre soutenu et l’intensité du grec.
theological_decisions:
- issue: Sens historique de παροικία
  choice: « leur séjour en terre étrangère », en référence à la résidence d’Israël en Égypte
  alternative: « leur exil » ou « leur condition d’étrangers »
  rationale: « Exil » importerait une catégorie historique et théologique plus forte que le terme grec. La traduction retenue conserve à la fois l’idée de résidence et celle de pays étranger.
- issue: Force rhétorique de ἐξηρεύξατο
  choice: Conserver l’image forte avec « le fleuve avait vomi »
  alternative: « avait déversé » ou « avait fait sortir »
  rationale: Le grec personnifie le fleuve et décrit une expulsion énergique. L’image doit être préservée plutôt que neutralisée.
translation_notes:
  register: Français international moderne, clair et digne. Le plus-que-parfait dans les deux propositions après les deux-points situe naturellement les plaies antérieures par rapport au souvenir. La personnification énergique du fleuve est conservée.
