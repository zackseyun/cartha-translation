  source_fidelity: La seconde proposition rend fidèlement la personnification et l’imparfait de ἐπελανθάνετο. Dans la première, « surpassait » introduit un verbe comparatif qui ne traduit pas directement ἴσχυεν (« était fort / agissait avec force »), même si le génitif peut effectivement être compris de manière comparative. « Était puissant ... au-delà de » rend plus précisément les deux éléments et maintient la difficulté syntaxique signalée en note.
