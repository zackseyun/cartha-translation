  text: Fire was strong in water beyond its own power[a], and water forgot its extinguishing power;
translation:
  language: fr
  text: Dans l’eau, le feu était puissant au-delà de sa propre puissance[a], et l’eau oubliait son pouvoir d’éteindre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dans l’eau, le feu conservait sa force propre. »'
    reason: La construction grecque peut être comprise soit comme une comparaison — le feu était puissant au-delà de sa puissance habituelle — soit comme l’affirmation qu’il gardait sa force propre au sein de l’eau.
lexical_decisions:
- source_word: πῦρ
  choice: le feu
  rationale: Nom concret rendu littéralement; il s’oppose à l’eau dans le paradoxe élémentaire du verset.
- source_word: ἴσχυεν ἐν ὕδατι
  choice: dans l’eau, le feu surpassait
  rationale: L’imparfait exprime une efficacité qui se prolongeait; la construction avec le génitif qui suit peut marquer la comparaison. L’antéposition de « Dans l’eau » met en relief le paradoxe sans l’expliquer.
- source_word: τῆς ἰδίας δυνάμεως
  choice: sa propre puissance
  rationale: 'Le génitif est compris principalement comme un complément de comparaison après ἴσχυεν : le feu allait au-delà de sa puissance habituelle. La formulation conserve toutefois l’étrangeté rhétorique du grec.'
- source_word: ὕδωρ
  choice: l’eau
  rationale: Traduction directe, en parallèle antithétique avec « le feu ».
- source_word: ἐπελανθάνετο
  choice: oubliait
  rationale: L’imparfait moyen est rendu littéralement afin de préserver la personnification vive de l’eau.
- source_word: τῆς σβεστικῆς δυνάμεως
  choice: son pouvoir d’éteindre
  rationale: Formulation française naturelle qui désigne précisément la capacité de l’eau à éteindre le feu.
theological_decisions:
- issue: Personnification des éléments dans le contexte de l’action divine
  choice: « l’eau oubliait »
  alternative: « l’eau ne pouvait plus éteindre »
  rationale: La traduction conserve la personnification du texte au lieu de la remplacer par une explication causale ou mécaniste.
- issue: Rapport entre le feu et sa puissance propre
  choice: 'Comprendre le génitif comme comparatif : « surpassait sa propre puissance »'
  alternative: « conservait dans l’eau sa force propre »
  rationale: Le génitif après ἴσχυεν se prête à une lecture comparative, mais la syntaxe est assez inhabituelle pour que l’autre compréhension soit signalée en note sans trancher silencieusement.
translation_notes:
  register: Français moderne, digne et concis. Le parallélisme entre le feu et l’eau ainsi que la personnification poétique sont maintenus; le point-virgule final de la source est adapté en point pour ce verset isolé.
