  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/019.yaml
  text: For land animals were changed into creatures of the water[a], and swimming creatures moved onto the land.
translation:
  language: fr
  text: En effet, les êtres terrestres étaient changés en êtres aquatiques[a], et ceux qui nagent passaient sur la terre ferme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se transformaient en êtres aquatiques ».'
    reason: Le moyen-passif grec peut être rendu par une formulation passive ou pronominale; le texte ne précise pas le mécanisme du changement.
lexical_decisions:
- source_word: χερσαῖα
  choice: les êtres terrestres
  rationale: L’adjectif substantivé désigne ce qui appartient à la terre ferme. « Les êtres terrestres » conserve sa portée générale sans préciser indûment qu’il s’agit d’espèces animales.
- source_word: ἔνυδρα
  choice: êtres aquatiques
  rationale: L’adjectif substantivé désigne des êtres vivant dans l’eau. « Êtres aquatiques » rend clairement l’opposition avec les êtres terrestres.
- source_word: μετεβάλλετο
  choice: étaient changés
  rationale: L’imparfait moyen-passif présente un changement en cours ou répété sans en préciser l’agent ni le mécanisme. La tournure passive française préserve cette réserve.
- source_word: νηκτὰ
  choice: ceux qui nagent
  rationale: Cette traduction de l’adjectif substantivé garde l’idée caractéristique de nage et évite de le confondre lexicalement avec ἔνυδρα.
- source_word: μετέβαινεν
  choice: passaient sur
  rationale: Le verbe exprime le passage d’un domaine à un autre. « Passaient sur la terre ferme » est naturel et maintient l’aspect duratif de l’imparfait.
- source_word: γῆς
  choice: la terre ferme
  rationale: Dans le contraste explicite avec le milieu aquatique, « terre ferme » exprime plus nettement le domaine visé que le simple mot « terre ».
theological_decisions:
- issue: Nature du changement décrit dans la création
  choice: Décrire le passage des êtres terrestres à l’état aquatique sans définir son mécanisme.
  alternative: Comprendre soit une métamorphose littérale, soit une description phénoménologique d’un renversement des comportements et des milieux.
  rationale: Le grec affirme un changement et un échange de domaines, mais n’explique pas comment ils se produisent. La traduction conserve cette tension au lieu d’imposer une lecture naturaliste ou allégorique.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme entre la terre ferme et l’eau est conservé, ainsi que les imparfaits qui présentent les transformations et déplacements en cours.
