  text: And punishments came upon the sinners[a], not without the evidence of what had happened in the violence of the thunderbolts; for they justly suffered for their own wicked acts[b], because they practiced a more grievous hatred of strangers.
translation:
  language: fr
  text: Et les châtiments s’abattirent sur les pécheurs, non sans les preuves de ce qui s’était passé, par la force des foudres[a] ; car ils souffrirent justement à cause de leurs propres méfaits, puisqu’ils pratiquèrent une haine plus grave envers les étrangers[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est très condensé. On peut aussi comprendre : « non sans que la violence des foudres fournisse des preuves de ce qui s’était passé », ou rattacher « par la force des foudres » à la venue des châtiments.'
    reason: ambiguïté syntaxique
  - marker: b
    text: Ou « une inhospitalité plus grave ». Le mot grec peut désigner une hostilité active envers les étrangers ou les hôtes, et non seulement un manque d’accueil.
    reason: alternative lexicale
lexical_decisions:
- source_word: τιμωρίαι
  choice: châtiments
  rationale: Le terme désigne des peines infligées en réponse à une faute. « Châtiments » conserve ici la portée judiciaire et morale du grec.
- source_word: ἁμαρτωλοῖς
  choice: les pécheurs
  rationale: L’adjectif substantivé désigne ceux qui sont caractérisés par le péché ; cette traduction directe préserve la catégorie morale du texte.
- source_word: οὐκ ἄνευ τῶν γεγονότων τεκμηρίων
  choice: non sans les preuves de ce qui s’était passé
  rationale: τεκμήρια exprime des preuves ou indices probants, tandis que γεγονότων renvoie à des faits accomplis. La formulation garde la construction condensée du grec sans en imposer une interprétation trop précise.
- source_word: τῇ βίᾳ τῶν κεραυνῶν
  choice: par la force des foudres
  rationale: βία évoque la force ou la violence, et κεραυνοί des foudres. « Par la force des foudres » restitue l’image destructrice et le rapport instrumental possible du datif.
- source_word: δικαίως ἔπασχον
  choice: ils souffraient justement
  rationale: La traduction conserve à la fois l’idée de souffrance et l’affirmation que celle-ci était conforme à la justice.
- source_word: ταῖς ἰδίαις αὐτῶν πονηρίαις
  choice: à cause de leurs propres méfaits
  rationale: Le datif a ici une valeur causale, et le pluriel πονηρίαις peut désigner des manifestations concrètes de méchanceté. « Méfaits » est naturel et maintient la responsabilité liée à leurs actes.
- source_word: χαλεπωτέραν μισοξενίαν
  choice: une haine plus cruelle envers les étrangers
  rationale: 'μισοξενία exprime davantage qu’un simple manque d’hospitalité : il s’agit d’une hostilité envers l’étranger ou l’hôte. Le comparatif χαλεπωτέραν est rendu sans ajouter d’intensif absent du grec.'
- source_word: ἐπετήδευσαν
  choice: ils pratiquaient
  rationale: Le verbe évoque une conduite poursuivie ou devenue habituelle, plutôt qu’un acte isolé.
theological_decisions:
- issue: Portée morale de μισοξενία
  choice: haine envers les étrangers
  alternative: inhospitalité ; hostilité envers les hôtes
  rationale: « Inhospitalité » risquerait d’atténuer un mot qui désigne une hostilité active. La traduction choisie conserve la gravité morale du grec sans préciser indûment si ξένοι désigne surtout des étrangers ou des hôtes.
- issue: Valeur causale de ταῖς ἰδίαις αὐτῶν πονηρίαις
  choice: à cause de leurs propres méfaits
  alternative: par leurs propres méchancetés ; pour leurs propres mauvaises actions
  rationale: Cette lecture fait ressortir que leur souffrance est liée à leurs propres actes et s’accorde avec δικαίως, tout en évitant d’ajouter une explication doctrinale.
- issue: Rapport syntaxique de τῇ βίᾳ τῶν κεραυνῶν
  choice: 'rattaché aux preuves comme moyen ou manifestation : « par la force des foudres »'
  alternative: 'rattaché à la venue des châtiments : « les châtiments… par la violence des foudres »'
  rationale: La syntaxe grecque est très condensée et permet plusieurs rattachements proches. Le texte principal suit l’ordre grec, tandis que la note préserve explicitement cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le ton judiciaire et la densité de l’original, avec une ponctuation qui facilite la lecture. « Foudres » maintient l’image élevée du grec ; « méfaits » rend concrètement le pluriel πονηρίαις.
