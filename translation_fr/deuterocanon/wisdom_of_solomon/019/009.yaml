  text: For they grazed like horses[a], and skipped about like lambs, praising you, Lord[b], the one who delivered them.
translation:
  language: fr
  text: Car ils se nourrirent comme des chevaux[a] et bondirent comme des agneaux[b], te louant, Seigneur, toi qui les délivrais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « paissaient comme des chevaux » ; le verbe grec évoque des animaux qui trouvent leur nourriture au pâturage.'
