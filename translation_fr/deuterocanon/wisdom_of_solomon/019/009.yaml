  - marker: b
    text: 'Ou : « gambadèrent comme des agneaux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεμήθησαν
  choice: broutaient
  rationale: Le verbe évoque des animaux qui se nourrissent au pâturage. « Broutaient » conserve cette image concrète et s’accorde naturellement avec la comparaison aux chevaux.
- source_word: διεσκίρτησαν
  choice: bondissaient
  rationale: Le verbe exprime des sauts vifs et joyeux. « Bondissaient » restitue clairement le mouvement des agneaux dans un registre digne et courant.
- source_word: ἀμνοί
  choice: agneaux
  rationale: Équivalent français direct, qui préserve l’image de jeunesse et d’exubérance.
- source_word: αἰνοῦντές
  choice: te louant
  rationale: Le participe présent marque une action qui accompagne les mouvements décrits et garde l’adresse directe à Dieu.
- source_word: Κύριε
  choice: Seigneur
  rationale: Traduction habituelle du vocatif κύριε dans une adresse directe à Dieu.
- source_word: τὸν ῥυόμενον αὐτούς
  choice: toi qui les délivrais
  rationale: Cette tournure rend explicitement le participe substantivé avec article et exprime l’action salvatrice de Dieu sans effacer son aspect en cours dans le récit.
theological_decisions:
- issue: Adresse divine par κύριος
  choice: Seigneur
  alternative: Maître
  rationale: Dans cette louange directement adressée à Dieu, « Seigneur » est l’équivalent français naturel et traditionnel, sans imposer une interprétation confessionnelle particulière.
- issue: Valeur du participe présent ῥυόμενον
  choice: toi qui les délivrais
  alternative: toi, leur libérateur
  rationale: Le choix verbal préserve l’action exprimée par le participe grec et son lien avec les personnes délivrées, tandis que le nom « libérateur » rendrait l’expression plus statique.
translation_notes:
  register: Français moderne, international et digne. L’imparfait présente les deux mouvements parallèles comme une scène vivante et continue ; « te louant » conserve la construction participiale grecque. Les marqueurs de notes sont placés immédiatement après les termes concernés.
