base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/022.yaml
  text: For in every way[a], Lord, you magnified your people and glorified them, and you did not overlook them, standing by them at every time and place.
translation:
  language: fr
  text: Car, à tous égards, Seigneur, tu as rendu ton peuple grand et tu l’as glorifié ; tu ne l’as pas négligé, te tenant auprès de lui en tout temps et en tout lieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ πάντα
  choice: à tous égards
  rationale: L’expression marque ici la totalité des aspects. « À tous égards » est naturelle en français et évite de suggérer seulement une succession d’événements.
- source_word: ἐμεγάλυνας
  choice: tu as rendu … grand
  rationale: Le verbe signifie faire grand, exalter. Cette formulation conserve la valeur causative sans recourir à « magnifier », qui évoquerait plus spontanément l’action de louer en français moderne.
- source_word: τὸν λαόν σου
  choice: ton peuple
  rationale: Dans le grec biblique, λαός désigne couramment le peuple appartenant à Dieu ; « ton peuple » est direct et idiomatique.
- source_word: ἐδόξασας
  choice: glorieux
  rationale: Dans la coordination avec ἐμεγάλυνας, « tu as rendu ton peuple grand et glorieux » restitue naturellement l’idée de conférer gloire et honneur, tout en préservant le poids du vocabulaire de la gloire.
- source_word: οὐχ ὑπερεῖδες
  choice: tu ne l’as pas délaissé
  rationale: ὑπεροράω peut signifier ne pas tenir compte de, négliger ou laisser sans secours. « Délaisser » exprime clairement l’absence d’abandon dans ce contexte de présence protectrice.
- source_word: ἐν παντὶ καιρῷ καὶ τόπῳ
  choice: en tout temps et en tout lieu
  rationale: Cette tournure française courante conserve exactement les dimensions temporelle et spatiale de la formule grecque.
- source_word: παριστάμενος
  choice: tu t’es tenu à ses côtés
  rationale: Le participe évoque littéralement le fait de se tenir auprès de quelqu’un, avec ici une nuance de soutien. Le passage à une proposition coordonnée produit une phrase française claire sans effacer l’image.
theological_decisions:
- issue: Adresse κύριε
  choice: Seigneur
  alternative: Ô Seigneur
  rationale: κύριε est une apostrophe directe à Dieu. « Seigneur » conserve la révérence, tandis que « Ô » n’est pas exprimé dans le grec et serait plus solennel que nécessaire.
- issue: Objet implicite de παριστάμενος
  choice: à ses côtés
  alternative: présent
  rationale: Le grec n’exprime pas d’objet après le participe, mais le référent contextuel est « ton peuple ». Le pronom possessif explicite ce lien nécessaire en français sans introduire une nouvelle affirmation théologique.
- issue: Rapport de παριστάμενος avec le verbe principal
  choice: proposition explicative après deux-points
  alternative: sans cesser de te tenir à ses côtés
  rationale: Le participe précise comment Dieu n’a pas délaissé son peuple. Les deux-points maintiennent ce lien circonstanciel sans imposer une valeur exclusivement causale, temporelle ou instrumentale.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’apostrophe à Dieu et le parallélisme des deux actions divines, tout en évitant les calques peu naturels comme « magnifier le peuple » ou « ne pas passer par-dessus du regard ».
