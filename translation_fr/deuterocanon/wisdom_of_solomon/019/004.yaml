base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/004.yaml
  text: For a deserved necessity dragged them to this end[a], and cast forgetfulness of what had happened upon them[b], so that they might beforehand complete the punishment lacking in their torments.
translation:
  language: fr
  text: Car une nécessité qu’ils avaient méritée les entraîna vers cette issue[a] et jeta sur eux l’oubli de ce qui était arrivé, afin qu’ils achèvent par avance le châtiment qui manquait encore à leurs tourments.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une nécessité méritée » ou « une nécessité conforme à ce qu’ils méritaient ». Le grec associe l’idée de juste mérite à celle de contrainte.
    reason: lexical_alternative
  - marker: b
    text: Ou « afin qu’ils achèvent par avance le châtiment restant ». Il s’agit de la peine que leurs tourments précédents n’avaient pas encore menée à son terme.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷλκεν
  choice: entraînait
  rationale: Le verbe exprime ici une contrainte qui mène les Égyptiens à leur perte. « Entraînait » garde cette force sans la nuance trop concrète de « traîner » en français.
- source_word: ἡ ἀξία ... ἀνάγκη
  choice: une nécessité méritée
  rationale: Cette formulation conserve à la fois la contrainte exprimée par ἀνάγκη et la notion de convenance morale ou de juste mérite portée par ἀξία.
- source_word: ἐπὶ τοῦτο πέρας
  choice: vers cette fin
  rationale: πέρας désigne le terme ou l’issue finale; « vers cette fin » en préserve le sens sans préciser davantage la nature de l’issue.
- source_word: τῶν συμβεβηκότων
  choice: de ce qui était arrivé
  rationale: Le participe parfait renvoie globalement aux événements déjà survenus.
- source_word: ἀμνηστίαν ἐνέβαλεν
  choice: leur inspira l’oubli
  rationale: Le grec évoque le fait de jeter ou de mettre l’oubli en eux. « Leur inspira l’oubli » est naturel en français tout en maintenant une causalité non explicitement attribuée à Dieu.
- source_word: προαναπληρώσωσιν
  choice: achèvent d’avance
  rationale: Le choix rend à la fois l’idée d’achèvement et la valeur anticipative du préverbe προ-.
- source_word: τὴν λείπουσαν ... κόλασιν
  choice: le châtiment qui manquait encore
  rationale: La formulation exprime la part de châtiment encore manquante ou restante, en lien avec l’idée d’achèvement.
- source_word: ταῖς βασάνοις
  choice: à leurs tourments
  rationale: « Tourments » convient au contexte de souffrances sévères et punitives sans suggérer nécessairement des actes précis de torture.
theological_decisions:
- issue: Agent de la contrainte et de l’oubli des Égyptiens
  choice: La nécessité méritée est présentée comme les entraînant et leur inspirant l’oubli, sans nommer Dieu comme agent grammatical.
  alternative: Rendre explicite une action providentielle de Dieu, ou attribuer le mouvement uniquement à leur faute ou à leur destin.
  rationale: Le grec personnifie la nécessité et ne nomme pas directement Dieu. La traduction préserve cette tension littéraire et théologique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe conserve l’enchaînement causal du grec et son ambiguïté quant à l’agent divin, tout en évitant des calques trop raides.
