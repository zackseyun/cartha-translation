  verdict: revise
  source_fidelity: 'Révision nécessaire : εἷλκεν et ἐνέβαλεν sont des aoristes et appellent ici un passé narratif (« entraîna », « jeta »), non les imparfaits « entraînait » et « inspira ». « Jeta sur eux l’oubli » rend plus directement l’image du grec ἀμνηστίαν ἐνέβαλεν, sans expliciter une agence divine. La relation entre le châtiment restant et les tourments est conservée.'
  naturalness: « Une nécessité qu’ils avaient méritée » est plus idiomatique que « une nécessité méritée », tout en restant concise. « Cette issue » convient naturellement à πέρας dans ce contexte. La formulation finale demeure volontairement proche de la construction dense du grec, mais est compréhensible en français moderne soutenu.
  terminology: « Nécessité », « oubli », « châtiment » et « tourments » sont appropriés. « Par avance » conserve la valeur préverbale de προαναπληρώσωσιν sans imposer une interprétation doctrinale ou causale.
  issues:
