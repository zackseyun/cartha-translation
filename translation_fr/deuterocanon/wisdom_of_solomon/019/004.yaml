    issue: Aspect verbal des deux verbes principaux
    rationale: Le texte grec porte εἷλκεν et ἐνέβαλεν à l’aoriste. Les imparfaits français du projet présentent l’action comme durative, ce que le grec ne marque pas ici.
  - severity: low
    issue: Rendu imagé de ἀμνηστίαν ἐνέβαλεν
    rationale: « Leur inspira l’oubli » est naturel, mais atténue et interprète l’image de l’oubli jeté sur eux. « Jeta sur eux l’oubli » est à la fois exact et idiomatique dans un registre biblique moderne.
  - severity: low
    issue: Formulation de ἡ ἀξία ἀνάγκη
    rationale: « Une nécessité méritée » est possible mais moins naturel en français ; la relative explicite mieux que cette nécessité est celle qu’ils avaient méritée.
