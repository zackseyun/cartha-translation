revisions:
- from: Car une nécessité méritée les entraînait vers cette fin[a] et leur inspira l’oubli de ce qui était arrivé, afin qu’ils achèvent d’avance le châtiment qui manquait encore à leurs tourments.[b]
  to: Car une nécessité qu’ils avaient méritée les entraîna vers cette issue[a] et jeta sur eux l’oubli de ce qui était arrivé, afin qu’ils achèvent par avance le châtiment qui manquait encore à leurs tourments.[b]
  rationale: La révision rétablit l’aspect narratif des aoristes, rend plus directement l’image grecque de l’oubli jeté sur les Égyptiens, et améliore l’idiomaticité française de l’expression qualifiant la nécessité. Elle maintient l’ambiguïté du texte quant à l’agent ultime et conserve les deux ancres de notes.
