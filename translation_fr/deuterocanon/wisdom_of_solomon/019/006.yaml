  source_fidelity: La traduction rend correctement la portée de ὅλη ἡ κτίσις, le renouvellement exprimé par πάλιν, le possible sens vertical de ἄνωθεν, le service rendu aux commandements divins et le but protecteur. Toutefois, « selon son propre ordre » interprète γένει comme un ordre établi; γένος désigne plus directement l’espèce, le genre ou la catégorie. « Façonnée » peut aussi évoquer une création initiale, tandis que διετυποῦτο, avec πάλιν, appelle plus nettement l’idée d’une reconfiguration ou d’un refaçonnement.
  naturalness: Le français est globalement digne et accessible. « Était de nouveau façonnée » et « soient gardés sans dommage » sont toutefois un peu lourds. « Était de nouveau refaçonnée » et « soient préservés de tout mal » sont plus naturels tout en restant proches du grec.
