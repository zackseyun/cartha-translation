base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/006.yaml
  text: For the whole creation[a], in its own kind, was formed anew from above, serving your own commands, so that your children might be kept unharmed.
translation:
  language: fr
  text: Car toute la création était de nouveau refaçonnée d’en haut[a], chacune selon son espèce, au service de tes propres commandements, afin que tes enfants soient préservés de tout mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « était de nouveau refaçonnée depuis le commencement ». Le grec ἄνωθεν peut signifier « d’en haut » ou « depuis le commencement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅλη ἡ κτίσις
  choice: la création tout entière
  rationale: Cette formulation naturelle conserve la portée globale du singulier collectif grec.
- source_word: ἐν ἰδίῳ γένει
  choice: selon son propre ordre
  rationale: γένος désigne ici le genre, la catégorie ou l’ordre propre de la création. « Selon son propre ordre » est plus idiomatique en français que « dans son propre genre » et évite de substituer l’idée philosophique de « nature ».
- source_word: πάλιν ἄνωθεν
  choice: de nouveau… d’en haut
  rationale: « De nouveau » rend πάλιν, tandis que « d’en haut » conserve le sens vertical et possiblement divin de ἄνωθεν sans effacer son autre sens possible, signalé en note.
- source_word: διετυποῦτο
  choice: était… façonnée
  rationale: L’imparfait passif décrit une action de mise en forme ou de reconfiguration en cours; « était façonnée » en garde à la fois l’aspect et l’image.
- source_word: ὑπηρετοῦσα
  choice: au service de
  rationale: Cette tournure exprime clairement que la création se met au service des directives divines.
- source_word: ταῖς ἰδίαις ἐπιταγαῖς
  choice: tes propres commandements
  rationale: Dans le contexte de l’adresse à Dieu, le possessif se rapporte naturellement à lui. « Propres » représente explicitement ἰδίαις et « commandements » la force autoritative de ἐπιταγαῖς.
- source_word: οἱ σοὶ παῖδες
  choice: tes enfants
  rationale: παῖδες peut désigner des enfants ou des serviteurs; ici, « tes enfants » exprime naturellement le peuple placé sous la protection de Dieu sans restriction de genre.
- source_word: φυλαχθῶσιν ἀβλαβεῖς
  choice: soient gardés sans dommage
  rationale: Le passif après ἵνα indique le but protecteur. « Sans dommage » rend directement ἀβλαβεῖς sans amplifier le texte.
theological_decisions:
- issue: Sens de ἄνωθεν dans le renouvellement de la création
  choice: d’en haut
  alternative: depuis le commencement
  rationale: « D’en haut » maintient la possible évocation de l’action divine, tandis que la note conserve le sens temporel également attesté et pertinent dans ce contexte.
- issue: Valeur de παῖδες pour le peuple de Dieu
  choice: enfants
  alternative: serviteurs
  rationale: Le contexte de protection favorise la relation filiale, mais le terme grec demeure lexicalement capable de désigner des serviteurs; la traduction ne développe aucune doctrine particulière à partir de cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. L’ordre de la phrase reste proche du grec tout en évitant les calques les plus raides. La répétition de l’idée de propriété dans « son propre ordre » et « tes propres commandements » est conservée parce qu’elle est présente dans le texte source.
