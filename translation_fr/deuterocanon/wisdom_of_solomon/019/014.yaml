  verdict: revise
  source_fidelity: Révision nécessaire. Le plus-que-parfait « n’avaient pas accueilli » instaure une antériorité que les deux imparfaits grecs (ἐδέχοντο, ἐδουλοῦντο) n’expriment pas. « Venus chez eux » ajoute l’idée d’arrivée et de lieu (« chez eux »), alors que παρόντας signifie simplement « présents ».
  naturalness: La formulation révisée reste claire dans un français moderne et conserve le parallélisme des deux groupes. « Ceux qui leur étaient inconnus et qui étaient présents » est un peu plus explicite que « des inconnus venus chez eux », mais il rend les deux participes grecs sans ajout contextuel.
  terminology: « Réduisaient en esclavage » rend sans euphémisme ἐδουλοῦντο. « Bienfaiteurs étrangers » préserve la juxtaposition εὐεργέτας ξένους sans ajouter explicitement qu’ils avaient fait du bien à ce groupe précis. Les désignations « les uns ... les autres » gardent les référents implicites.
