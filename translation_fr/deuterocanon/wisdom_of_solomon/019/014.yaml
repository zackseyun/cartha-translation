    rationale: παρόντας veut dire « étant présents »; il ne dit ni qu’ils étaient arrivés ni qu’ils se trouvaient « chez eux ».
  - severity: low
    issue: Expansion relationnelle dans « qui leur avaient fait du bien »
    rationale: εὐεργέτας les qualifie de bienfaiteurs, mais le complément « leur » et l’antériorité exprimée par « avaient fait » ne sont pas formulés dans le grec de ce verset.
