    text: 'Ou : « réduisaient en esclavage des étrangers qui étaient des bienfaiteurs ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν ... οὗτοι δὲ
  choice: les premiers ... tandis que les seconds
  rationale: Rend clairement le contraste entre les deux groupes sans les identifier au-delà de ce que dit le grec.
- source_word: τοὺς ἀγνοοῦντας
  choice: des inconnus
  rationale: Le participe désigne littéralement des personnes qu’ils ne connaissaient pas; « inconnus » conserve cette nuance et convient au contexte de l’hospitalité.
- source_word: οὐκ ἐδέχοντο
  choice: n’avaient pas accueilli
  rationale: Dans ce contexte d’hospitalité, « accueillir » exprime naturellement le sens de δέχομαι, tout en laissant « recevoir » comme possibilité littérale.
- source_word: παρόντας
  choice: venus chez eux
  rationale: Le terme signifie littéralement « présents ». Ici, la formulation française exprime naturellement leur arrivée et leur présence auprès du premier groupe, sans ajouter qu’ils étaient dans le besoin.
- source_word: εὐεργέτας
  choice: qui leur avaient fait du bien
  rationale: Cette tournure courante rend le sens concret de « bienfaiteurs » et souligne l’ironie morale de leur asservissement.
- source_word: ξένους
  choice: des étrangers
  rationale: Le mot qualifie ici les bienfaiteurs comme personnes venues d’ailleurs; « étrangers » garde aussi son lien lexical avec le thème de l’accueil.
- source_word: ἐδουλοῦντο
  choice: réduisaient en esclavage
  rationale: Rend explicitement l’action de faire de quelqu’un un esclave, sans l’atténuer en simple servitude.
theological_decisions:
- issue: Identification historique des deux groupes opposés
  choice: Conserver les désignations implicites « les premiers » et « les seconds ».
  alternative: Identifier explicitement les premiers aux habitants de Sodome et les seconds aux Égyptiens.
  rationale: Le verset grec emploie seulement des termes contrastifs. Les noms des groupes relèvent du contexte et ne doivent pas être ajoutés au texte.
- issue: Valeur temporelle des verbes à l’imparfait
  choice: Employer le plus-que-parfait pour le premier groupe et l’imparfait pour le second.
  alternative: Employer deux imparfaits ou deux passés composés.
  rationale: Le contraste porte sur deux comportements comparés, mais le français gagne en cohérence contextuelle en présentant l’épisode des premiers comme antérieur, sans transformer cette relation en précision doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation évite l’ajout interprétatif « dans le besoin », absent du grec, et maintient l’opposition rhétorique ainsi que l’implicite concernant l’identité des groupes.
