base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/014.yaml
  text: For they did not welcome those who were present as strangers[c][b][a], but these enslaved foreign benefactors.
translation:
  language: fr
  text: En effet, les uns n’accueillaient pas ceux qui leur étaient inconnus et qui étaient présents[a], tandis que les autres réduisaient en esclavage des bienfaiteurs étrangers[b].
  philosophy: optimal-equivalence
  footnotes:
