  rationale: Rend directement l’origine indiquée par ἀπό avec le génitif.
- source_word: ὀρτυγομήτρα
  choice: des cailles
  rationale: Dans ce contexte, le terme désigne la caille, en écho au récit biblique de l’arrivée des cailles depuis la mer.
