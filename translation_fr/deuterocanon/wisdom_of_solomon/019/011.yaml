  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/011.yaml
  text: Later they also saw a new generation of birds[a], when, driven by craving, they asked for delicacies of luxury[b];
translation:
  language: fr
  text: Plus tard, ils virent aussi une nouvelle apparition d’oiseaux[a], lorsque, poussés par leur convoitise, ils demandèrent des mets de luxe[b] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une nouvelle sorte d’oiseaux ». L’expression grecque peut désigner une nouvelle apparition ou production d’oiseaux et, moins probablement, une nouvelle sorte d’oiseaux.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit d’aliments recherchés pour le plaisir et le raffinement, et non seulement pour se nourrir ; voir Exode 16 et Nombres 11.
    reason: cross_reference
lexical_decisions:
- source_word: ἐφʼ ὑστέρῳ
  choice: Plus tard
  rationale: Cette locution marque une étape ultérieure du récit ; « Plus tard » est direct et naturel en français moderne.
- source_word: εἶδον
  choice: ils virent
  rationale: Rend simplement l’aoriste de ὁράω et conserve le caractère narratif de la phrase.
- source_word: νέαν γένεσιν ὀρνέων
  choice: une nouvelle génération d’oiseaux
  rationale: « Génération » conserve la notion de venue à l’existence portée par γένεσις, sans réduire l’expression à une simple espèce d’oiseaux.
- source_word: ὅτε
  choice: lorsque
  rationale: Introduit naturellement en français la circonstance temporelle évoquée par le grec.
- source_word: ἐπιθυμίᾳ προαχθέντες
  choice: poussés par leur désir
  rationale: Le participe exprime le fait d’être entraîné ou incité par ἐπιθυμία. « Désir » préserve la portée du terme sans lui imposer une connotation sexuelle ni renforcer excessivement le blâme.
- source_word: ᾐτήσαντο
  choice: ils demandèrent
  rationale: Rend de manière neutre la demande exprimée par la forme moyenne, sans la transformer en exigence.
- source_word: ἐδέσματα τρυφῆς
  choice: des mets de luxe
  rationale: « Mets » désigne des aliments préparés, tandis que « de luxe » exprime la recherche de plaisir et de raffinement associée à τρυφή.
theological_decisions:
- issue: Caractérisation morale de la demande de nourriture au désert
  choice: Le désir est présenté comme la force qui les pousse à rechercher des mets de luxe, sans ajouter une condamnation plus forte que celle suggérée par ἐπιθυμία et τρυφή.
  alternative: Employer « avidité », « convoitise » ou « gourmandise » pour accentuer explicitement la faute.
  rationale: Le contexte fait écho à la demande de cailles au désert et comporte une critique réelle, mais « désir » et « mets de luxe » laissent cette appréciation ressortir du texte lui-même sans surtraduction.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit de près la progression du grec, tout en restant naturelle. Le point-virgule final est conservé puisque le verset s’insère dans une phrase ou une séquence plus large.
