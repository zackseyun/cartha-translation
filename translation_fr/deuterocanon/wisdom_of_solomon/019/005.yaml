base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/005.yaml
  text: and your people experienced a marvelous journey[b][a], but they found a strange death.
translation:
  language: fr
  text: et que ton peuple fasse l’expérience d’un voyage extraordinaire[a], tandis qu’eux trouvent une mort étrange[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vive un voyage étonnant »; le verbe grec exprime ici l’expérience vécue, et non une simple tentative.
    reason: lexical_alternative
  - marker: b
    text: Ou « rencontrent une mort insolite ».
    reason: lexical_alternative
lexical_decisions:
- source_word: λαός σου
  choice: ton peuple
  rationale: Rend directement le collectif λαός avec le possessif et désigne naturellement le peuple de Dieu.
- source_word: παράδοξον
  choice: extraordinaire
  rationale: Exprime ce qui dépasse l’attente et suscite l’étonnement, avec ici une valeur positive, sans le confondre avec ξένον.
- source_word: ὁδοιπορίαν
  choice: voyage
  rationale: Terme français courant pour un déplacement ou un parcours; il convient au contexte de la traversée sans ajouter de précision absente du grec.
- source_word: πειράσῃ
  choice: fasse l’expérience de
  rationale: Dans cette construction avec un objet, le verbe évoque l’expérience vécue plutôt qu’une simple tentative.
- source_word: ἐκεῖνοι
  choice: eux
  rationale: Le pronom disjoint marque nettement l’opposition avec « ton peuple » sans ajouter « hommes » ni expliciter les Égyptiens.
- source_word: ξένον
  choice: étrange
  rationale: Conserve la force déroutante et inquiétante de l’adjectif appliqué à la mort, tout en maintenant sa distinction avec παράδοξον.
- source_word: εὕρωσι
  choice: trouvent
  rationale: Rendu formel de l’expression grecque signifiant qu’ils rencontrent ou subissent ce sort.
- source_word: θάνατον
  choice: mort
  rationale: Sens ordinaire et précis du substantif, sans généralisation en « destruction ».
theological_decisions:
- issue: Contraste entre le peuple de Dieu et les autres
  choice: Maintenir une antithèse marquée entre « ton peuple » et « eux », ainsi qu’entre le voyage extraordinaire et la mort étrange.
  alternative: Employer le même adjectif français dans les deux membres, par exemple « étrange » pour le voyage comme pour la mort.
  rationale: Le grec oppose παράδοξον à ξένον. Deux adjectifs distincts préservent à la fois la nuance lexicale et le contraste entre l’expérience merveilleuse du peuple et le sort funeste des autres.
- issue: Dépendance syntaxique envers le verset précédent
  choice: Employer « et que » avec le subjonctif afin de conserver la coordination à la proposition de but introduite auparavant.
  alternative: 'Transformer le verset en deux propositions indépendantes au passé: « Ton peuple fit l’expérience… mais eux trouvèrent… »'
  rationale: Les deux aoristes du subjonctif sont coordonnés à la structure de but du contexte précédent. La formulation française respecte cette continuité sans résoudre les événements en simple récit autonome.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Fasse l’expérience » restitue précisément le verbe sans archaïsme; « tandis qu’eux » souligne l’antithèse portée par μὲν…δέ et par le démonstratif ἐκεῖνοι.
