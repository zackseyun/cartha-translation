  source_fidelity: Le projet rend bien l’image volontairement concrète de ἐν χερσὶν ἔχοντες τὰ πένθη, le contraste ironique entre l’expulsion accompagnée de supplications et la poursuite ultérieure, ainsi que « comme des fugitifs ». Une légère révision améliore la valeur de προσοδυρόμενοι et de l’imparfait ἐδίωκον.
  naturalness: « Se lamenter sur les tombes » peut suggérer que les tombes sont l’objet du discours plutôt que le lieu ou le cadre de la lamentation. « Devant les tombes » est plus naturel et reste fidèle. « Se mirent à les poursuivre » introduit un commencement qui n’est pas exprimé par l’imparfait grec; « les poursuivaient » conserve mieux l’aspect.
  terminology: Le registre est moderne, international et digne. « Projet insensé » rend naturellement λογισμὸν ἀνοίας. « Tout en les suppliant de partir » explicite sans ajout doctrinal le complément naturellement sous-entendu de ἱκετεύοντες et préserve la tension avec « chassés ».
