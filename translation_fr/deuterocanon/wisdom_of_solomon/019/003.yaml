base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/003.yaml
  text: For while they still had their mourning in their hands and were still lamenting at the graves of the dead[a], they took up another plan of folly, and those whom they had driven out with pleading[c][b], these they pursued as fugitives.
translation:
  language: fr
  text: 'Car, alors qu’ils avaient encore le deuil entre les mains[a] et se lamentaient toujours devant les tombes des morts, ils adoptèrent un autre projet insensé[b] : ceux qu’ils avaient chassés tout en les suppliant de partir[c], ils les poursuivaient comme des fugitifs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ayant encore les deuils entre les mains ». Cette image vive indique probablement qu’ils étaient toujours occupés par les rites ou les signes du deuil.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « une autre pensée insensée » ; le terme grec peut désigner une pensée, un raisonnement ou un projet.'
    reason: lexical_alternative
  - marker: c
    text: Autrement dit, ils avaient supplié ces mêmes personnes de partir, puis les ont poursuivies comme si elles s’étaient enfuies.
    reason: cross_reference
lexical_decisions:
- source_word: ἔτι
  choice: encore… toujours
  rationale: Rend la continuité et le chevauchement temporel des actions en français naturel.
- source_word: ἐν χερσὶν ἔχοντες τὰ πένθη
  choice: avaient encore le deuil entre les mains
  rationale: Conserve l’image concrète et frappante du grec, tout en l’éclairant par une note.
- source_word: προσοδυρόμενοι τάφους νεκρῶν
  choice: se lamentaient toujours sur les tombes des morts
  rationale: Exprime une lamentation prolongée en lien avec les tombes, sans ajouter de précision absente du grec.
- source_word: ἕτερον ἐπεσπάσαντο λογισμὸν ἀνοίας
  choice: adoptèrent un autre projet insensé
  rationale: « Adoptèrent » rend l’idée de prendre à leur compte une nouvelle ligne de conduite; « projet » convient à la portée pratique de λογισμός, qualifié par ἀνοίας.
- source_word: οὓς ἱκετεύοντες ἐξέβαλον
  choice: ceux qu’ils avaient chassés en les suppliant
  rationale: Préserve ensemble l’expulsion exprimée par ἐξέβαλον et les supplications concomitantes exprimées par ἱκετεύοντες.
- source_word: τούτους ὡς φυγάδας ἐδίωκον
  choice: ils se mirent à les poursuivre comme des fugitifs
  rationale: 'Conserve l’ironie du renversement : les personnes chassées sont ensuite traitées comme des fugitifs.'
theological_decisions:
- issue: Ironie historique et théologique du revirement des Égyptiens envers Israël
  choice: Exprimer clairement le contraste entre les supplications accompagnant leur départ forcé et la poursuite qui suit.
  alternative: Expliciter les plaies d’Égypte, Israël et la poursuite jusqu’à la mer.
  rationale: Le grec porte lui-même ce contraste, mais ne nomme pas ici ces éléments du récit; la traduction évite donc toute amplification interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. La structure est légèrement réorganisée autour de « lorsqu’ils » et des deux-points afin de rendre clairement la progression et le contraste, tout en conservant l’image inhabituelle du deuil « entre les mains ».
