base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/007.yaml
  text: The cloud that overshadowed the camp was seen[a], and from the water that had stood before them dry land emerged; from the Red Sea came an unhindered road, and from the violent surge a grassy plain.
translation:
  language: fr
  text: On vit la nuée couvrir le camp de son ombre et, là où l’eau se tenait auparavant, la terre ferme émerger ; de la mer Rouge[a] apparut un chemin sans obstacle, et du flot violent, une plaine verdoyante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mer des Roseaux ». Le texte grec porte ici « mer Rouge », désignation conservée dans le texte principal.
    reason: alternative_reading
lexical_decisions:
- source_word: σκιάζουσα
  choice: couvrir de son ombre
  rationale: Cette tournure naturelle conserve l’image concrète de la nuée qui projette son ombre, sans ajouter explicitement une interprétation protectrice.
- source_word: παρεμβολήν
  choice: le camp
  rationale: Dans le contexte de l’Exode, le terme désigne le campement d’Israël ; « le camp » est clair et idiomatique en français actuel.
- source_word: προϋφεστῶτος ὕδατος
  choice: là où l’eau se tenait auparavant
  rationale: Le participe parfait exprime une eau déjà présente à cet endroit ; la formulation française rend à la fois l’antériorité et la situation spatiale.
- source_word: ξηρᾶς ἀνάδυσις γῆς
  choice: la terre ferme émerger
  rationale: Le grec présente l’apparition ou l’émersion d’une terre sèche hors de l’eau. L’infinitif après « on vit » restitue naturellement la construction descriptive.
- source_word: ἐθεωρήθη
  choice: on vit
  rationale: Le passif grec signifie que la scène fut vue ou contemplée. Le tour impersonnel français est naturel et permet de coordonner les différents éléments visibles sans lourdeur.
- source_word: ἐρυθρᾶς θαλάσσης
  choice: la mer Rouge
  rationale: Le texte grec nomme explicitement la « mer Rouge » ; cette désignation est donc conservée dans le texte principal.
- source_word: ὁδὸς ἀνεμπόδιστος
  choice: un chemin sans obstacle
  rationale: La formulation garde l’image concrète d’une voie rendue praticable et libre de toute entrave.
- source_word: χλοηφόρον πεδίον
  choice: une plaine verdoyante
  rationale: L’adjectif décrit une plaine portant de la jeune verdure. « Verdoyante » restitue cette image saisissante dans un français fluide.
- source_word: κλύδωνος βιαίου
  choice: des flots déchaînés
  rationale: Le groupe désigne une masse d’eau violemment agitée. Le pluriel français rend naturellement l’image du tumulte marin.
theological_decisions:
- issue: Désignation de la mer dans l’imagerie de l’Exode
  choice: la mer Rouge
  alternative: la mer des Roseaux
  rationale: Le témoin grec porte explicitement ἐρυθρᾶς θαλάσσης, « mer Rouge ». La traduction suit ce texte plutôt qu’une reconstruction fondée sur l’arrière-plan hébreu, tout en signalant l’autre désignation dans une note.
translation_notes:
  register: Français international moderne, digne et imagé. La phrase conserve la succession poétique des transformations tout en clarifiant par la ponctuation les ellipses verbales du grec.
