  text: But those who had welcomed with festivities those who had already shared in the same rights afflicted them with terrible sufferings[a][b].
translation:
  language: fr
  text: Mais ceux qui avaient accueilli avec des réjouissances des hommes qui partageaient déjà les mêmes droits les accablèrent de pénibles souffrances[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceux qui avaient déjà eu part aux mêmes choses justes »; l’expression peut aussi désigner les mêmes avantages ou ce qui leur était dû.'
