review_pass:
  verdict: revise
  source_fidelity: La version actuelle rend bien l’accueil festif et l’idée générale de mauvais traitements, mais elle introduit « des hommes », réduit trop nettement δικαίων à « droits » et omet δείπνοις du texte courant. Puisque le grec transmis comporte ce dernier terme, malgré sa syntaxe difficile, il doit recevoir une représentation prudente dans le texte, accompagnée d’une note explicative.
  naturalness: « Ceux qui avaient accueilli ... ceux qui avaient déjà eu part ... » est naturel dans un registre biblique moderne. « Au cours de repas » demeure inhabituel sur le plan narratif, mais reflète sobrement la difficulté du grec; la note en avertit le lecteur.
  terminology: « Avantages légitimes » évite de transformer en certitude l’interprétation sociale de δικαίων comme « droits », tout en conservant l’idée de choses justes, dues ou reconnues. « Souffrances » rend πόνοις sans l’intensification non exprimée par le texte transmis.
  issues:
  - severity: medium
    issue: Omission de δείπνοις dans le texte principal
    rationale: Une note ne remplace pas entièrement un mot transmis, surtout lorsque l’incertitude textuelle et syntaxique est précisément en jeu. Le terme doit être rendu prudemment et expliqué.
  - severity: medium
    issue: « des hommes » est ajouté
    rationale: τοὺς désigne simplement « ceux », sans préciser le sexe; l’ajout n’est pas nécessaire.
  - severity: low
    issue: « les mêmes droits » fixe une interprétation contestable de δικαίων
    rationale: Le grec permet aussi « les mêmes choses justes », avantages ou biens auxquels ils avaient droit. Une formulation moins institutionnelle préserve mieux l’ambiguïté.
  revised_text: Mais ceux qui avaient accueilli avec des réjouissances ceux qui avaient déjà eu part aux mêmes avantages légitimes[a] les accablèrent de souffrances au cours de repas[b].
  revised_footnotes:
  - marker: a
    text: 'Littéralement : « ceux qui avaient déjà eu part aux mêmes choses justes ». L’expression peut désigner les mêmes avantages, les mêmes biens, ou ce qui leur était dû.'
    reason: lexical_alternative
  - marker: b
    text: Le grec transmis porte un mot qui signifie normalement « repas » ou « banquets ». Sa relation avec « les accablèrent de souffrances » est syntaxiquement difficile; il peut s’entendre notamment au sens de « au cours de repas » ou « par des repas ».
    reason: textual_variant
  revision_rationale: 'La révision retire l’ajout « des hommes », évite de présenter « droits » comme le seul sens possible de δικαίων, et restitue δείπνοις dans le texte courant. Elle ne prétend pas résoudre la construction grecque difficile : les possibilités pertinentes sont conservées en note.'
