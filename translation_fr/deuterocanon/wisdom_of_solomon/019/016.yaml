lexical_decisions:
- source_word: μετὰ ἑορτασμάτων
  choice: avec des réjouissances
  rationale: L’expression évoque un accueil festif et solennel; « réjouissances » conserve le pluriel sans limiter la scène à un repas.
- source_word: εἰσδεξάμενοι
  choice: avaient accueilli
  rationale: Le participe exprime ici le fait de recevoir favorablement, avec une nuance d’hospitalité.
- source_word: τοὺς ἤδη τῶν αὐτῶν μετεσχηκότας δικαίων
  choice: des hommes qui partageaient déjà les mêmes droits
  rationale: μετέχω indique une participation, tandis que δικαίων peut désigner ce qui est juste ou reconnu comme dû. Dans le contexte, « les mêmes droits » exprime probablement un statut ou des avantages communs, tout en signalant l’ambiguïté en note.
- source_word: δείπνοις
  choice: non représenté directement dans le corps du texte
  rationale: Le mot transmis signifie normalement « repas » ou « banquets », mais son rapport syntaxique avec le reste de la phrase est difficile. Une note conserve explicitement cette donnée plutôt que d’introduire arbitrairement une circonstance de repas.
- source_word: ἐκάκωσαν
  choice: les accablèrent
  rationale: Le verbe signifie faire du mal, maltraiter ou affliger; « accabler » convient à la construction avec πόνοις et à la gravité du contexte.
- source_word: πόνοις
  choice: de pénibles souffrances
  rationale: πόνος peut évoquer les peines, les épreuves, les travaux pénibles ou les souffrances. Cette formulation naturelle conserve à la fois l’intensité et l’étendue du terme.
theological_decisions:
- issue: Sens de τοὺς ἤδη τῶν αὐτῶν μετεσχηκότας δικαίων
  choice: participation aux mêmes droits ou avantages reconnus
  alternative: participation aux mêmes choses justes, aux mêmes biens ou aux mêmes provisions
  rationale: Le contexte dénonce l’oppression ultérieure de personnes auparavant accueillies et admises à une forme de participation commune. « Droits » rend cette portée sociale et morale, mais la note maintient les autres possibilités lexicales.
- issue: Traitement de la leçon difficile δείπνοις
  choice: ne pas intégrer une interprétation conjecturale dans le corps du texte et indiquer en note le sens littéral du mot transmis
  alternative: « lors de repas », « par des banquets » ou une paraphrase temporelle comme « ensuite »
  rationale: Le grec transmis est syntaxiquement obscur. La transparence exige de préserver le témoignage lexical en note sans présenter comme certaine une reconstruction du sens.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le contraste entre l’accueil festif initial et les souffrances infligées, sans résoudre silencieusement les deux difficultés du grec.
