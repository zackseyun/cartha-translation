revisions:
- from: Mais les impies[a] furent atteints jusqu’à la fin par une colère sans pitié, car il[b] les connaissait d’avance, eux aussi, ainsi que ce qui allait arriver.
  to: Mais une colère sans pitié s’abattit sur les impies[a] jusqu’à la fin, car il[b] les connaissait d’avance, ainsi que ce qui allait arriver.
  rationale: La révision améliore la syntaxe et la fidélité à la structure verbale grecque, tout en conservant la portée temporelle de μέχρι τέλους, le registre du jugement et l’implicite du sujet de προῄδει. Les deux ancres de note sont maintenues et correctement placées.
