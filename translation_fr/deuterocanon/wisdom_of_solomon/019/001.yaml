lexical_decisions:
- source_word: ἀσεβέσιν
  choice: les impies
  rationale: « Impies » conserve la dimension religieuse et morale du grec, qui désigne ceux qui manquent de respect envers Dieu, sans réduire le terme à la méchanceté en général.
- source_word: μέχρι τέλους
  choice: jusqu’à la fin
  rationale: Cette formulation garde la valeur temporelle et l’insistance de l’expression grecque.
- source_word: ἀνελεήμων
  choice: sans pitié
  rationale: L’expression traduit directement l’absence de compassion et s’intègre naturellement à « colère » en français moderne.
- source_word: θυμός
  choice: colère
  rationale: Dans ce contexte de jugement, « colère » exprime l’intensité punitive du terme sans ajouter une nuance excessive de fureur.
- source_word: ἐπέστη
  choice: furent atteints … par
  rationale: La tournure française exprime naturellement qu’une colère survient et s’abat sur les impies, tout en maintenant la colère comme agent de l’action.
- source_word: προῄδει
  choice: connaissait d’avance
  rationale: Cette traduction rend la connaissance préalable de manière transparente, sans charger le verbe d’un sens théologique technique.
- source_word: τὰ μέλλοντα
  choice: ce qui allait arriver
  rationale: La formulation rend clairement les réalités ou événements à venir dans un français courant et digne.
theological_decisions:
- issue: Sujet sous-entendu de προῄδει
  choice: « il », avec une note indiquant que le contexte renvoie vraisemblablement à Dieu
  alternative: « Dieu connaissait d’avance »
  rationale: Le grec ne nomme pas explicitement le sujet. Le pronom respecte cette économie et préserve l’implicite du texte, tandis que la note aide le lecteur sans transformer l’interprétation contextuelle en ajout au corps du verset.
translation_notes:
