  text: But for the ungodly, merciless wrath came upon them to the very end; for he knew beforehand both them and what was going to happen,
translation:
  language: fr
  text: Mais une colère sans pitié s’abattit sur les impies[a] jusqu’à la fin, car il[b] les connaissait d’avance, ainsi que ce qui allait arriver.
  philosophy: optimal-equivalence
