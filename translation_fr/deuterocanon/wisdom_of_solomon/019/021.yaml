base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/021.yaml
  text: Flames[a], on the contrary, did not wither the flesh of the perishable living creatures that walked among them, nor did they melt the meltable[b], crystal-like kind of ambrosial food.
translation:
  language: fr
  text: Les flammes, à l’inverse[a], ne desséchèrent pas la chair des êtres vivants périssables qui marchaient au milieu d’elles ; elles ne firent pas fondre non plus une sorte de nourriture ambrosienne, semblable au cristal, fusible et facile à fondre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au contraire » ou « en sens inverse ». Le grec souligne que les flammes produisent l’opposé de l’effet normalement attendu.
    reason: lexical_alternative
  - marker: b
    text: « Semblable au cristal » peut aussi se comprendre comme « semblable à la glace » ou « cristalline » ; l’expression décrit l’aspect ou la consistance de la nourriture miraculeuse.
    reason: lexical_alternative
lexical_decisions:
- source_word: φλόγες
  choice: les flammes
  rationale: Le pluriel concret désigne le phénomène de feu évoqué dans le récit ; « flammes » restitue directement l’image grecque.
- source_word: ἀνάπαλιν
  choice: à l’inverse
  rationale: L’adverbe signale un comportement contraire à l’effet normalement attendu du feu.
- source_word: εὐφθάρτων ζῴων
  choice: des êtres vivants périssables
  rationale: Cette formulation conserve à la fois le sens général de ζῷα et l’idée de vulnérabilité à la destruction portée par εὐφθάρτων, sans limiter indûment le référent aux seuls animaux.
- source_word: οὐκ ἐμάραναν
  choice: ne desséchèrent pas
  rationale: μαραίνω évoque le dépérissement, le flétrissement ou le dessèchement ; dans le contexte des chairs exposées au feu, « dessécher » reste naturel tout en préservant l’expression inhabituelle du grec.
- source_word: σάρκας
  choice: la chair
  rationale: Le singulier collectif français rend naturellement le pluriel grec désignant la chair corporelle.
- source_word: ἐμπεριπατούντων
  choice: qui marchaient au milieu d’elles
  rationale: La proposition relative rend le participe présent et comprend le déplacement comme ayant lieu au milieu des flammes ; le pronom « elles » reprend clairement « les flammes ».
- source_word: τηκτὸν εὔτηκτον
  choice: pourtant fusible, facile à fondre
  rationale: La répétition française garde l’insistance du grec sur la capacité naturelle de cette matière à fondre ; « pourtant » explicite sobrement le paradoxe déjà marqué par le contexte.
- source_word: κρυσταλλοειδὲς
  choice: semblable au cristal
  rationale: Le terme décrit une apparence ou une consistance cristalline ; cette traduction évite de trancher entre le cristal et la glace.
- source_word: γένος ἀμβροσίας τροφῆς
  choice: cette sorte de nourriture d’ambroisie
  rationale: « Sorte » rend la valeur classificatoire de γένος, tandis que « nourriture d’ambroisie » conserve la coloration littéraire hellénistique sans imposer une interprétation doctrinale.
theological_decisions:
- issue: Rendre l’image de la nourriture miraculeuse sans lui imposer une interprétation doctrinale ultérieure
  choice: nourriture d’ambroisie
  alternative: nourriture céleste ; nourriture d’immortalité
  rationale: Le grec emploie un vocabulaire littéraire associé à l’ambroisie. La traduction retenue préserve cette couleur poétique et laisse ouverte la portée théologique de l’image.
- issue: Préciser le lieu où marchaient les êtres vivants
  choice: au milieu d’elles, c’est-à-dire des flammes
  alternative: en leur sein ; tout autour
  rationale: Le composé ἐμπεριπατέω indique un déplacement à l’intérieur ou au milieu de quelque chose. Le féminin pluriel « elles » rattache naturellement le participe aux flammes sans développer davantage la scène.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme en deux propositions conserve le parallélisme grec. Les expressions « nourriture d’ambroisie » et « fusible, facile à fondre » gardent volontairement la couleur littéraire et l’insistance inhabituelle du texte source.
