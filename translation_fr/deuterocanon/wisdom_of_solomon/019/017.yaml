base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/017.yaml
  text: And they also were struck with blindness[a], like those at the doors of the righteous man, when, wrapped in deep darkness[b], each one kept seeking the way through his own door.
translation:
  language: fr
  text: 'Eux aussi furent frappés de cécité[a], comme ceux qui étaient aux portes du juste : enveloppés d’une profonde obscurité, ils cherchaient, chacun, l’accès de sa propre porte[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Allusion à Genèse 19.11 : les hommes rassemblés devant la maison de Lot furent frappés de cécité et s’épuisèrent à chercher l’entrée.'
    reason: cross_reference
  - marker: b
    text: Le grec de cette dernière proposition est difficile. Plus littéralement, il évoque « chacun » et « le passage de ses propres portes » ; la forme verbale peut se comprendre comme un mouvement par ce passage. Dans le contexte de Genèse 19.11, la traduction rend le sens probable d’une recherche tâtonnante de l’accès.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήγησαν ... ἀορασίᾳ
  choice: furent frappés de cécité
  rationale: La tournure conserve la force du passif de πλήσσω et rend naturellement ἀορασία comme une privation de la vue.
- source_word: ὥσπερ ἐκεῖνοι ἐπὶ ταῖς τοῦ δικαίου θύραις
  choice: comme ceux qui se tenaient aux portes de l’homme juste
  rationale: « L’homme juste » respecte le qualificatif substantivé τοῦ δικαίου sans introduire le nom de Lot. « Se tenaient » explicite sobrement la valeur locale de ἐπί, nécessaire à une phrase française naturelle.
- source_word: ἀχανεῖ περιβληθέντες σκότει
  choice: enveloppé d’une obscurité profonde
  rationale: Le singulier distributif s’accorde avec « chacun ». « Enveloppé » reflète περιβληθέντες, tandis que « profonde » exprime l’étendue oppressante suggérée par ἀχανής.
- source_word: ἕκαστος τῶν αὐτοῦ θυρῶν τὴν δίοδον ἐξῄει
  choice: chacun cherchait à franchir le passage de sa propre porte
  rationale: La formulation grecque transmise est difficile. Cette traduction rend le mouvement répété ou tenté dans le contexte, tout en conservant l’idée de passage (δίοδος) associé à la porte. Le singulier français distributif est plus naturel, malgré le pluriel grec θυρῶν.
theological_decisions:
- issue: Identification de « l’homme juste »
  choice: Conserver « l’homme juste » dans le texte principal.
  alternative: Nommer explicitement Lot.
  rationale: Le grec emploie τοῦ δικαίου et non le nom propre. La note identifie l’allusion sans ajouter ce nom au texte biblique.
- issue: Nature de la cécité
  choice: Employer le terme ordinaire « cécité » sans en préciser le mécanisme.
  alternative: Parler d’aveuglement surnaturel ou de perte totale de la vue.
  rationale: ἀορασία désigne l’incapacité de voir, mais le verset ne définit pas davantage sa nature.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’allusion scripturaire et la tension du texte grec, tout en signalant en note l’incertitude de la dernière proposition.
