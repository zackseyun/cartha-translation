  text: through which those sheltered by your hand passed[a], the whole nation[b], having seen marvelous wonders.
translation:
  language: fr
  text: par où passèrent, comme une nation tout entière, ceux que ta main abritait[a], après avoir contemplé des prodiges merveilleux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux que ta main protégeait ». Le grec évoque littéralement ceux que ta main couvrait ou abritait.
    reason: lexical_alternative
  - marker: b
    text: 'L’expression grecque associe deux mots désignant des phénomènes extraordinaires : on pourrait aussi traduire « de merveilleux signes prodigieux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ οὗ
  choice: par où
  rationale: Le relatif reprend le passage évoqué dans le contexte. « Par où » conserve la relation avec l’antécédent et exprime naturellement en français le lieu ou le moyen du passage.
- source_word: πανεθνεὶ
  choice: comme une nation tout entière
  rationale: Cet adverbe rare souligne que le peuple est passé collectivement, en corps national, et non comme une simple somme d’individus.
- source_word: διῆλθον
  choice: passèrent
  rationale: L’aoriste de διέρχομαι désigne ici le fait de passer par un lieu. « Passèrent » est concis et évite de surinterpréter le mouvement.
- source_word: οἱ τῇ σῇ σκεπαζόμενοι χειρί
  choice: ceux que ta main abritait
  rationale: Cette formulation conserve à la fois l’image concrète de la main divine et la valeur protectrice de σκεπάζω.
- source_word: θεωρήσαντες
  choice: après avoir contemplé
  rationale: Le participe aoriste est rendu par une construction d’antériorité naturelle en français. « Contemplé » rend l’idée d’une observation attentive portée par θεωρέω.
- source_word: θαυμάσια τέρατα
  choice: des prodiges merveilleux
  rationale: La combinaison des deux termes intensifie le caractère extraordinaire et miraculeux des phénomènes. « Prodiges merveilleux » garde cette expression redoublée sans lui donner une nuance nécessairement menaçante.
theological_decisions:
- issue: Image de la protection divine exprimée par « ta main »
  choice: Conserver l’expression anthropomorphique « ta main »
  alternative: ceux que tu protégeais
  rationale: Le grec nomme explicitement la main de Dieu comme image de sa protection active. Maintenir cette image préserve la texture biblique et théologique du verset.
- issue: Valeur collective de πανεθνεὶ
  choice: comme une nation tout entière
  alternative: tous ensemble
  rationale: La traduction retenue maintient l’identité collective et nationale du peuple, sans réduire l’expression à la seule simultanéité du passage.
translation_notes:
  register: Français international moderne, fluide et digne. La phrase conserve sa forme de proposition relative liée au verset précédent, l’image biblique de la main protectrice et l’insistance rhétorique de l’expression finale.
