  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/008.yaml
  text: They will judge nations and rule over peoples[c][b][a], and the Lord will reign over them forever.
translation:
  language: fr
  text: Ils jugeront les nations et exerceront leur pouvoir sur les peuples[a], et le Seigneur régnera sur eux[b] pour toujours[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « auront autorité sur les peuples » ou « domineront les peuples » ; le verbe grec peut exprimer l’exercice du pouvoir ou le fait de l’emporter.
    reason: lexical_alternative
  - marker: b
    text: Dans le contexte, « eux » désigne probablement les justes ; le pronom peut toutefois être compris plus largement comme renvoyant aux nations et aux peuples qui viennent d’être mentionnés.
    reason: alternative_reading
  - marker: c
    text: 'Littéralement : « pour les siècles ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρινοῦσιν
  choice: jugeront
  rationale: Le futur de κρίνω a ici son sens judiciaire naturel. « Jugeront » conserve aussi la possible connotation de gouvernement présente dans ce contexte sapientiel.
- source_word: ἔθνη
  choice: les nations
  rationale: « Nations » est le sens courant de ἔθνη et maintient la distinction avec λαῶν. L’article défini est naturel en français pour désigner les nations de manière générale.
- source_word: κρατήσουσι
  choice: exerceront leur pouvoir sur
  rationale: κρατέω avec le génitif peut exprimer l’exercice du pouvoir ou la domination. Cette formulation française est claire et moins inutilement péjorative que « domineront », tout en préservant l’idée d’autorité.
- source_word: λαῶν
  choice: les peuples
  rationale: « Peuples » préserve le parallélisme et la distinction lexicale avec ἔθνη, rendu par « nations ».
- source_word: βασιλεύσει
  choice: régnera
  rationale: « Régnera » exprime directement et naturellement le sens royal du futur de βασιλεύω.
- source_word: αὐτῶν
  choice: sur eux
  rationale: Après βασιλεύω, le génitif indique naturellement ceux sur qui s’exerce le règne. Le pronom français conserve sans la trancher l’ambiguïté de son référent.
- source_word: Κύριος
  choice: le Seigneur
  rationale: « Le Seigneur » est le titre français naturel correspondant ici à Κύριος employé dans un sens défini.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Cette expression idiomatique grecque indique une durée perpétuelle. « Pour toujours » en donne le sens dans un français actuel et naturel.
theological_decisions:
- issue: Référent de αὐτῶν dans « le Seigneur régnera sur eux »
  choice: Conserver le pronom « eux », qui renvoie le plus naturellement aux justes dans le contexte immédiat.
  alternative: Le pronom peut aussi être compris comme renvoyant plus largement aux nations et aux peuples mentionnés dans le verset.
  rationale: Le grec ne nomme pas de nouveau le groupe concerné. Garder le pronom préserve la continuité avec les justes du contexte ainsi que la possibilité grammaticale d’un rattachement aux nations et aux peuples.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme entre « nations » et « peuples » est maintenu, tandis que les notes conservent les nuances de κρατέω, l’ambiguïté de αὐτῶν et la forme littérale de l’expression temporelle.
