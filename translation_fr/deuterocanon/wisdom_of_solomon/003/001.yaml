base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/001.yaml
  text: But the souls of the righteous are in the hand of God[a], and no torment will ever touch them.
translation:
  language: fr
  text: Mais les âmes des justes sont dans la main de Dieu, et aucun tourment ne les atteindra jamais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aucune affliction ne les atteindra jamais ». Le grec βάσανος peut désigner une souffrance intense ou un tourment.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δικαίων
  choice: des justes
  rationale: Génitif pluriel substantivé de δίκαιος. « Les justes » est une désignation morale et théologique concise, naturelle dans le registre biblique français.
- source_word: ψυχαὶ
  choice: les âmes
  rationale: Dans le contexte immédiat, qui évoque la mort apparente des justes, « âmes » conserve la portée anthropologique et eschatologique de ψυχαί sans préciser davantage la doctrine.
- source_word: ἐν χειρὶ θεοῦ
  choice: dans la main de Dieu
  rationale: Cette traduction préserve l'image biblique de la main, qui peut suggérer à la fois protection, autorité et possession, sans la réduire à une seule interprétation.
- source_word: οὐ μὴ ἅψηται
  choice: ne les atteindra jamais
  rationale: La tournure οὐ μή suivie du subjonctif aoriste exprime une négation emphatique. « Ne… jamais » en restitue naturellement la force en français; « atteindre » convient mieux que le calque « toucher » pour un tourment.
- source_word: βάσανος
  choice: tourment
  rationale: βάσανος peut désigner une souffrance intense, un supplice ou une épreuve douloureuse. « Tourment » en conserve ici la force, tandis que « affliction » demeure une possibilité lexicale.
theological_decisions:
- issue: Sens de ψυχαί en rapport avec l’existence après la mort
  choice: Conserver « les âmes » dans le texte principal
  alternative: les vies; les personnes
  rationale: Le contexte présente les justes comme subsistant au-delà de leur mort visible. « Âmes » garde cette portée sans importer une anthropologie plus détaillée que celle du passage.
- issue: Portée de l’expression ἐν χειρὶ θεοῦ
  choice: Traduire littéralement par « dans la main de Dieu »
  alternative: sous la protection de Dieu; sous la garde de Dieu
  rationale: L’image est intelligible en français et conserve plusieurs nuances possibles — protection, autorité et appartenance — qu’une paraphrase interprétative restreindrait.
- issue: Portée de βάσανος
  choice: Retenir « tourment » tout en signalant « affliction »
  alternative: affliction; souffrance; épreuve
  rationale: Le terme grec évoque une souffrance sévère et peut aller jusqu’au supplice. Le texte ne précise pas la nature exacte de ce tourment; la note préserve donc une autre traduction plausible.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’image biblique de la main de Dieu et la forte négation grecque, tout en évitant un calque peu naturel de ἅπτομαι.
