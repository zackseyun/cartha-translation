  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/013.yaml
  text: For blessed is the undefiled barren woman[a], who has not known a bed in transgression[b]; she will have fruit at the visitation of souls.
translation:
  language: fr
  text: Car bienheureuse est la femme stérile, sans souillure, qui n’a pas eu de relations sexuelles dans la transgression[a] ; elle aura un fruit au temps de la visitation des âmes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « n’a pas connu de lit ». Le grec emploie « lit » comme euphémisme pour les relations sexuelles ; l’expression qualifie cette union de transgressive.
    reason: lexical_alternative
  - marker: b
    text: La « visitation des âmes » peut désigner le moment où Dieu intervient à leur égard, notamment pour les juger ou les réhabiliter.
    reason: alternative_reading
lexical_decisions:
- source_word: μακαρία
  choice: heureuse
  rationale: Dans une béatitude, « heureuse » est naturel en français biblique moderne et exprime l’approbation divine, sans réduire le terme à une émotion passagère.
- source_word: στεῖρα
  choice: la femme stérile
  rationale: L’adjectif substantivé désigne ici explicitement une femme qui ne peut enfanter ; cette formulation rend le référent clair.
- source_word: ἀμίαντος
  choice: sans souillure
  rationale: Cette expression conserve la nuance morale et possiblement rituelle d’absence de souillure, tout en restant idiomatique.
- source_word: ἔγνω
  choice: n’a pas connu
  rationale: Le verbe « connaître » maintient l’euphémisme biblique du grec pour les relations sexuelles.
- source_word: κοίτην
  choice: de couche
  rationale: « Couche » préserve la métaphore du lit employée pour l’union sexuelle et convient au registre digne du passage.
- source_word: ἐν παραπτώματι
  choice: dans la transgression
  rationale: Le calque intelligible conserve la catégorie morale générale du grec sans préciser indûment la nature de la faute.
- source_word: ἕξει καρπὸν
  choice: elle aura du fruit
  rationale: 'La formulation suit le grec et maintient le paradoxe intentionnel : la femme stérile recevra néanmoins un fruit.'
- source_word: ἐν ἐπισκοπῇ
  choice: lors de la visitation
  rationale: « Visitation » garde ouverte la possibilité d’une intervention divine de jugement, d’examen ou de faveur, contrairement à une explicitation plus étroite.
- source_word: ψυχῶν
  choice: des âmes
  rationale: Traduction directe qui respecte le registre anthropologique et eschatologique du livre.
theological_decisions:
- issue: Sens de « visitation des âmes »
  choice: Une future intervention ou inspection divine concernant les âmes, laissée ouverte entre jugement et réhabilitation.
  alternative: Le jour du jugement, ou le moment où Dieu visite favorablement les âmes.
  rationale: Le contexte évoque la destinée et la réhabilitation des justes, mais l’expression grecque ne permet pas de trancher entre les différentes nuances de l’intervention divine.
translation_notes:
  register: Français moderne, digne et légèrement biblique. Les expressions « connaître une couche », « transgression » et « visitation » conservent les métaphores ainsi que l’ambiguïté théologique du grec ; les notes en éclairent le sens sans le refermer.
