base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/009.yaml
  text: Those who have trusted in him will understand truth[a], and the faithful will remain with him in love[b], because grace and mercy are for his chosen ones.
translation:
  language: fr
  text: Ceux qui ont mis leur confiance en lui comprendront la vérité, et les fidèles demeureront[a] auprès de lui dans l’amour, car la grâce et la miséricorde sont pour ceux qu’il a choisis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’attendront dans l’amour » ; le verbe grec peut signifier demeurer auprès de quelqu’un ou l’attendre avec persévérance.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ses choisis » ; autre traduction possible : « ses élus ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πεποιθότες ἐπʼ αὐτῷ
  choice: ceux qui ont mis leur confiance en lui
  rationale: Le participe parfait exprime une confiance établie, issue d’un acte antérieur et toujours actuelle. Cette tournure française en conserve la valeur résultative.
- source_word: συνήσουσιν ἀλήθειαν
  choice: comprendront la vérité
  rationale: Le futur de συνίημι signifie « comprendre ». En français naturel, le nom abstrait ἀλήθεια appelle ici l’article défini, sans que celui-ci ajoute une précision doctrinale.
- source_word: οἱ πιστοὶ
  choice: les fidèles
  rationale: Le substantif adjectival désigne ici des personnes caractérisées par leur fidélité; « les fidèles » préserve le parallélisme avec ceux qui ont mis leur confiance en Dieu.
- source_word: ἐν ἀγάπῃ
  choice: dans l’amour
  rationale: La formulation conserve la concision du grec et ne tranche pas si l’amour est celui de Dieu, celui des fidèles ou la sphère relationnelle dans laquelle ils demeurent.
- source_word: προσμενοῦσιν αὐτῷ
  choice: demeureront auprès de lui
  rationale: προσμένω peut exprimer le fait de rester auprès de quelqu’un, de persévérer avec lui ou de l’attendre. « Demeureront auprès de lui » convient au contexte tout en gardant l’idée de continuité.
- source_word: χάρις καὶ ἔλεος
  choice: la grâce et la miséricorde
  rationale: Ces équivalents français usuels rendent distinctement les deux termes grecs et conviennent au registre sapientiel.
- source_word: τοῖς ἐκλεκτοῖς αὐτοῦ
  choice: pour ceux qu’il a choisis
  rationale: Cette expression claire et moderne rend l’idée du choix divin sans charger « élus » de connotations doctrinales postérieures.
theological_decisions:
- issue: Valeur de πιστοὶ par rapport à la confiance et à la fidélité
  choice: les fidèles
  alternative: ceux qui croient
  rationale: Dans ce contexte sapientiel, le mot souligne vraisemblablement la fidélité constante des justes, tout en restant parallèle à leur confiance en Dieu.
- issue: Sens de προσμενοῦσιν αὐτῷ
  choice: demeureront auprès de lui
  alternative: l’attendront
  rationale: Le contexte porte sur le sort des justes auprès de Dieu. Le choix principal exprime une communion durable, tandis que la note conserve l’autre sens lexical réel du verbe.
- issue: Rendu de ἐκλεκτοῖς
  choice: ceux qu’il a choisis
  alternative: ses élus
  rationale: Le grec affirme le choix divin sans préciser ici sa portée systématique. La formulation retenue est accessible et évite d’imposer des associations confessionnelles.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase suit le parallélisme grec sans alourdir la syntaxe. « Demeureront auprès de lui dans l’amour » maintient l’ambiguïté de ἐν ἀγάπῃ et la note signale l’autre valeur possible de προσμένω.
