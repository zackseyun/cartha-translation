lexical_decisions:
- source_word: πορεία
  choice: départ
  rationale: Dans ce contexte, le mot désigne le fait que les justes s’en vont d’auprès des vivants. « Départ » conserve l’image du mouvement sans expliciter par « mort » ce que cette proposition grecque ne dit pas directement.
- source_word: ἀφʼ ἡμῶν
  choice: loin de nous
  rationale: La tournure exprime l’éloignement par rapport à ceux qui restent. « Loin de nous » est naturel en français et garde cette relation spatiale, sans la transformer en simple jugement subjectif.
- source_word: σύντριμμα
  choice: anéantissement
  rationale: Le terme peut évoquer le fait d’être brisé, la destruction ou la ruine. « Anéantissement » rend ici la catastrophe définitive que les observateurs croient voir, sans affirmer que cette perception correspond à la réalité.
- source_word: οἱ δὲ
  choice: Mais eux
  rationale: Le pronom exprimé et la conjonction contrastive produisent un renversement appuyé entre l’apparence et la condition réelle des justes.
- source_word: ἐν εἰρήνῃ
  choice: dans la paix
  rationale: Cette formulation proche du grec conserve la portée du mot, qui peut inclure le repos, la sécurité et le bien-être, au-delà de la seule absence de conflit.
theological_decisions:
- issue: Faut-il expliciter que l’anéantissement relève du jugement humain et non de la réalité ?
  choice: a été considéré comme un anéantissement
  alternative: était un anéantissement
  rationale: Le grec de ce segment forme une proposition nominale, mais le contexte antérieur fournit l’idée d’un jugement porté par les insensés. Reprendre cette valeur en français évite de présenter comme un fait ce que la proposition suivante contredit, tout en maintenant le contraste théologique.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe explicite le verbe sous-entendu grâce au contexte immédiat, tandis que « Mais eux » conserve la forte opposition du grec.
