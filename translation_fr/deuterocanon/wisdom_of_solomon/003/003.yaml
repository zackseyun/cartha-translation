translation:
  language: fr
  text: et leur départ d’avec nous a paru être une ruine[a]. Mais eux, ils sont dans la paix[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « leur départ d’avec nous a paru être un désastre ».'
