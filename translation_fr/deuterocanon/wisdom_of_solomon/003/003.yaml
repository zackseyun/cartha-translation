  verdict: revise
  source_fidelity: Le grec porte littéralement « et leur départ d’avec nous, [un] brisement/une ruine ; mais eux sont dans la paix ». La reprise du jugement apparent à partir du contexte immédiat est légitime en français. Toutefois, « anéantissement » est plus fort que σύντριμμα, qui évoque surtout un brisement, une ruine ou une catastrophe, sans exprimer nécessairement la réduction au néant. « Loin de nous » ajoute une nuance d’éloignement durable absente de ἀφ’ ἡμῶν ; « d’avec nous » rend plus précisément le point de séparation.
  naturalness: La formulation révisée reste naturelle dans un français moderne et soutenu. « Mais eux, ils sont dans la paix » maintient le contraste emphatique de οἱ δὲ εἰσίν tout en étant fluide.
  terminology: « Départ » préserve l’image de πορεία sans imposer « mort ». « Ruine » est un équivalent français sobre et adéquat de σύντριμμα. « Dans la paix » conserve l’expression grecque et sa portée sans la restreindre à l’absence de conflit.
