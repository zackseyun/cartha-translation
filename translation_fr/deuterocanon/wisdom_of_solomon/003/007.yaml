  text: and at the time of their visitation they will shine forth[a], and they will run about like sparks through stubble[b];
translation:
  language: fr
  text: Au temps de leur visitation[a], ils resplendiront et courront comme des étincelles à travers le chaume[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « au moment où ils sont visités » : il s’agit du moment où Dieu intervient pour inspecter, juger ou réhabiliter.'
    reason: lexical_alternative
  - marker: b
    text: Ou « à travers la paille sèche » ou « parmi les roseaux » ; le grec évoque un feu qui se propage rapidement dans des végétaux secs et inflammables.
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρῷ
  choice: temps
  rationale: καιρός désigne ici un moment décisif ou fixé. « Temps » reste naturel et ne précise pas davantage ce que le grec.
- source_word: ἐπισκοπῆς
  choice: où ils seront visités
  rationale: ἐπισκοπή peut évoquer une visite, une inspection ou une intervention divine. La tournure passive conserve l’ambiguïté du grec quant à la nature exacte de cette intervention.
- source_word: ἀναλάμψουσιν
  choice: ils resplendiront
  rationale: Le verbe exprime le fait de se mettre à briller vivement. « Resplendiront » rend cette manifestation éclatante dans un registre digne et courant.
- source_word: σπινθῆρες
  choice: étincelles
  rationale: « Étincelles » est l’équivalent français direct et restitue clairement l’image du feu qui se propage.
- source_word: καλάμῃ
  choice: chaume
  rationale: Dans cette comparaison, καλάμη évoque des tiges sèches et inflammables. « Chaume » exprime naturellement cette végétation sèche en français.
- source_word: διαδραμοῦνται
  choice: courront … à travers
  rationale: Le verbe décrit un déplacement rapide à travers un espace. Cette formulation garde l’image dynamique sans l’alourdir.
theological_decisions:
- issue: Sens du « temps où ils seront visités »
  choice: Un temps d’intervention concernant les justes, laissé ouvert dans le texte principal
  alternative: Le moment précis où Dieu viendra les inspecter, les juger ou les réhabiliter
  rationale: Le contexte favorise la réhabilitation des justes, mais ἐπισκοπή possède une portée plus large, pouvant inclure inspection, jugement ou intervention favorable. Le passif préserve cette tension sans imposer une interprétation étroite.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « ils seront visités », légèrement marquée, est maintenue afin de préserver l’étendue de sens du grec; la note en explicite les nuances. L’image brève et vive des étincelles traversant le chaume est conservée.
