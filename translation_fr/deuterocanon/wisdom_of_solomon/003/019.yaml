  text: For the ends of an unrighteous generation are grievous[a].
translation:
  language: fr
  text: Car les issues d’une génération injuste sont pénibles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de la descendance des injustes » ou « d’une lignée injuste ». Le grec γενεά peut désigner une génération, une descendance ou une lignée. Le mot rendu par « issues » est au pluriel et évoque les aboutissements finaux.'
    reason: Préserver l’ambiguïté de γενεά et signaler le pluriel de τὰ τέλη, sans ajouter de possessif absent du grec.
lexical_decisions:
- source_word: γενεᾶς
  choice: d’une génération
  rationale: γενεά peut désigner une génération, une descendance ou une lignée. « Génération » conserve le sens collectif sans imposer une interprétation strictement biologique.
- source_word: ἀδίκου
  choice: injuste
  rationale: ἄδικος qualifie ce qui est contraire à la justice ou moralement mauvais. « Injuste » rend directement le terme grec, tout en laissant au contexte sapientiel sa portée morale.
- source_word: χαλεπὰ
  choice: est terrible
  rationale: χαλεπός peut signifier difficile, pénible, dur ou terrible. Ici, « terrible » exprime avec naturel la gravité du dénouement annoncé.
- source_word: τὰ τέλη
  choice: le sort final
  rationale: Le pluriel grec désigne les aboutissements ou destinées ultimes. « Le sort final » est idiomatique en français et en restitue le sens collectif, sans suggérer les objectifs que pourrait évoquer « les fins ».
theological_decisions:
- issue: γενεᾶς ἀδίκου peut désigner soit une génération moralement injuste, soit la descendance ou la lignée des injustes.
  choice: d’une génération injuste
  alternative: de la descendance des injustes ; d’une lignée mauvaise
  rationale: Le choix principal préserve la formulation collective et la qualification morale sans affirmer une doctrine héréditaire. La note maintient le sens généalogique possible, particulièrement pertinent dans le contexte des descendants.
translation_notes:
  register: Français moderne, sobre et solennel. « Sort final » évite l’ambiguïté française de « fins » au sens de buts, tandis que la note conserve les nuances généalogique et grammaticale du grec.
