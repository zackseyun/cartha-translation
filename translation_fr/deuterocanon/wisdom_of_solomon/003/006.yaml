base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/006.yaml
  text: Like gold in a furnace he tested them[b][a], and like a whole burnt offering he accepted them.
translation:
  language: fr
  text: Comme de l’or dans un creuset, il les a éprouvés[a] ; comme une offrande entièrement consumée, il les a agréés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il les a mis à l’épreuve ». L’image est celle de l’or dont la qualité est vérifiée dans un creuset.
    reason: lexical_alternative
  - marker: b
    text: Ou « il les a accueillis favorablement ». Le verbe grec exprime une réception favorable, ici dans un contexte sacrificiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς χρυσὸν ἐν χωνευτηρίῳ
  choice: Comme l’or au creuset
  rationale: La formulation conserve la comparaison et l’image métallurgique. « Creuset » désigne naturellement en français le récipient où le métal est fondu et affiné.
- source_word: ἐδοκίμασεν
  choice: il les a éprouvés
  rationale: « Éprouver » exprime ici la mise à l’épreuve destinée à manifester la qualité, en accord avec l’image de l’or affiné.
- source_word: ὁλοκάρπωμα θυσίας
  choice: une offrande entièrement consumée
  rationale: Cette expression rend la spécificité cultuelle d’une offrande intégralement consumée, sans la redondance peu naturelle d’un calque tel que « holocauste de sacrifice ».
- source_word: προσεδέξατο
  choice: il les a accueillis
  rationale: Le verbe indique une réception favorable. « Accueillir » préserve cette nuance personnelle tout en restant compatible avec le contexte sacrificiel.
theological_decisions:
- issue: Portée de l’image sacrificielle dans ὁλοκάρπωμα θυσίας
  choice: une offrande entièrement consumée
  alternative: un holocauste
  rationale: Le choix explicite le sens ancien du terme sans dépendre du sens moderne courant de « holocauste ». Il maintient l’image cultuelle sans préciser davantage la manière dont les justes sont identifiés à l’offrande.
- issue: Sens de προσεδέξατο dans le contexte sacrificiel
  choice: il les a accueillis
  alternative: il les a agréés
  rationale: « Accueillis » traduit la réception favorable sans réduire le verbe à une formule exclusivement rituelle ; « agréés » ferait ressortir plus directement l’acceptation d’un sacrifice.
translation_notes:
  register: Français moderne, digne et accessible. Le point-virgule souligne le parallélisme des deux comparaisons. « Creuset » est précis sans être excessivement technique ; « offrande entièrement consumée » évite l’ambiguïté moderne du mot « holocauste ».
