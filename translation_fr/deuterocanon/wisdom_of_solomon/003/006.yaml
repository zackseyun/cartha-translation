  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : Dieu met les justes à l’épreuve dans l’image du raffinage de l’or et les reçoit favorablement dans celle d’une offrande entièrement consumée. Toutefois, « l’or au creuset » est moins précis que le grec ἐν χωνευτηρίῳ (« dans un creuset »), et « accueillis » affaiblit quelque peu la nuance cultuelle de réception favorable de προσεδέξατο.'
  naturalness: Le français est globalement moderne et digne. « Comme de l’or dans un creuset » exprime plus naturellement et plus exactement la comparaison. « Il les a agréés » convient au registre biblique moderne et au contexte sacrificiel.
  terminology: « Offrande entièrement consumée » rend correctement ὁλοκάρπωμα sans employer « holocauste », terme aujourd’hui chargé d’une autre référence historique. « Agréés » préserve la notion d’acceptation favorable, particulièrement appropriée à l’image d’une offrande.
