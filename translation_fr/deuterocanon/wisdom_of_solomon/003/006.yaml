  - severity: low
    issue: Nuance sacrificielle de « accueillis »
    rationale: « Accueillir » est possible, mais προσεδέξατο désigne ici une réception favorable et, dans l’image d’une offrande, « agréer » est plus direct et idiomatique sans ajouter d’interprétation.
  revised_text: Comme de l’or dans un creuset, il les a éprouvés[a] ; comme une offrande entièrement consumée, il les a agréés[b].
