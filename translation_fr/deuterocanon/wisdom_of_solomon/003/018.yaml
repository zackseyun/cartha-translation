base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/018.yaml
  text: Even if they die quickly[a], they have no hope, nor comfort on the day of judgment.
translation:
  language: fr
  text: Même s’ils meurent rapidement, ils n’ont aucune espérance ni aucun réconfort au jour du jugement[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au jour de la décision » ou « au jour du discernement ». Le terme grec peut désigner une évaluation décisive ou un jugement.
    reason: alternative lexicale
lexical_decisions:
- source_word: ἐάν τε
  choice: Même si
  rationale: Cette tournure exprime naturellement en français la valeur concessive de la condition dans ce contexte.
- source_word: ὀξέως
  choice: rapidement
  rationale: L’adverbe indique d’abord la rapidité. « Prématurément » serait possible selon le contexte, mais ajouterait une interprétation qui n’est pas explicitement exprimée.
- source_word: τελευτήσωσιν
  choice: ils meurent
  rationale: Le verbe désigne ici la fin de la vie ; « meurent » est clair, direct et idiomatique.
- source_word: ἐλπίδα
  choice: espérance
  rationale: « Espérance » convient au registre biblique moderne et rend l’attente orientée vers l’avenir dans ce contexte eschatologique.
- source_word: ἡμέρᾳ διαγνώσεως
  choice: au jour du jugement
  rationale: διάγνωσις peut désigner une décision, un discernement ou un jugement. Dans le contexte d’une évaluation décisive après la mort, « jugement » communique le mieux le sens probable, tandis qu’une note préserve les autres possibilités.
- source_word: παραμύθιον
  choice: réconfort
  rationale: Le nom désigne la consolation ou le réconfort. « Réconfort » est naturel et immédiatement compréhensible en français contemporain.
theological_decisions:
- issue: Portée eschatologique de ἡμέρᾳ διαγνώσεως
  choice: au jour du jugement
  alternative: au jour de la décision ; au jour du discernement
  rationale: Le contexte de Sagesse 3 oppose le sort des justes à celui des impies après la mort. « Jour du jugement » conserve cette portée eschatologique sans l’expliciter davantage que le texte, et la note signale l’étendue sémantique du grec.
translation_notes:
  register: Français international moderne, clair et digne. La phrase reste concise et conserve la structure conditionnelle ainsi que la tension eschatologique du grec. Le marqueur de note est placé après « jugement », expression à laquelle la note se rapporte.
