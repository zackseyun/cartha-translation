  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/012.yaml
  text: Their women are foolish[a], and their children are evil[b]; their offspring is accursed.
translation:
  language: fr
  text: Leurs femmes sont dépourvues de discernement[a], leurs enfants sont mauvais, et leur descendance est maudite[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Leurs épouses sont dépourvues de discernement ». Le grec peut signifier « femmes » ou « épouses », selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Le grec peut aussi évoquer leur lignée ou ce qui est issu d’eux.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναῖκες
  choice: femmes
  rationale: Le grec peut désigner des femmes ou des épouses. « Femmes » reste formellement transparent, tandis que la possibilité de comprendre « épouses » est signalée en note.
- source_word: ἄφρονες
  choice: dépourvues de discernement
  rationale: ἄφρων exprime l'absence de bon sens ou d'intelligence pratique. Cette formulation est naturelle en français moderne et conserve la portée intellectuelle et morale du terme sans la tonalité potentiellement légère de « insensées ».
- source_word: πονηρά
  choice: mauvais
  rationale: Dans ce contexte de jugement, πονηρός porte une appréciation morale négative. « Mauvais » convient naturellement à des personnes et préserve cette force sans exagérer le grec.
- source_word: τέκνα
  choice: enfants
  rationale: τέκνα signifie naturellement « enfants » et demeure distinct de γένεσις, qui évoque plus largement la descendance.
- source_word: ἐπικατάρατος
  choice: maudite
  rationale: Le terme désigne ce qui est frappé de malédiction. « Maudite » conserve le ton solennel et judiciaire tout en étant immédiatement compréhensible.
- source_word: γένεσις
  choice: descendance
  rationale: Dans la progression familiale du verset, γένεσις renvoie vraisemblablement à ce qui est engendré ou à la lignée issue de ces personnes. « Descendance » rend cette idée plus clairement que « génération ».
theological_decisions:
- issue: Portée du jugement prononcé sur la famille et la descendance
  choice: Conserver la dénonciation directe et sévère du foyer et de la descendance, sans l'atténuer.
  alternative: Reformuler le propos comme une simple annonce de malheur ou limiter implicitement le jugement aux seuls parents.
  rationale: Les trois adjectifs prédicatifs grecs énoncent sans détour un manque de discernement, une qualification morale négative et une malédiction. Le texte ne fournit aucun motif permettant d'adoucir ou de résoudre cette tension.
translation_notes:
  register: Français international moderne, digne et direct. La structure ternaire et la sévérité du grec sont conservées. Les deux ambiguïtés lexicales réelles sont signalées sans surcharger le texte.
