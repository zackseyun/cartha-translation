base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/017.yaml
  text: For even if they become long-lived[a], they will be counted as nothing[b], and in the end their old age will be dishonored.
translation:
  language: fr
  text: Car même s’ils vivent longtemps, ils seront tenus pour rien, et, à la fin[a], leur vieillesse sera sans honneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans leurs derniers jours ».'
    reason: L’expression grecque peut désigner soit la fin en général, soit la dernière période de leur vie.
lexical_decisions:
- source_word: ἐὰν τε γὰρ
  choice: Car même si
  rationale: Rend le lien explicatif de γάρ et la valeur concessive de la condition en français naturel.
- source_word: μακρόβιοι γένωνται
  choice: ils vivent longtemps
  rationale: Exprime simplement la possibilité qu’ils parviennent à une longue vie, sans suggérer la prospérité.
- source_word: εἰς οὐθὲν λογισθήσονται
  choice: ils seront tenus pour rien
  rationale: Conserve le passif et la notion d’évaluation portée par λογίζομαι, tout en employant une tournure française idiomatique.
- source_word: ἐπʼ ἐσχάτων
  choice: à la fin
  rationale: Rend le sens temporel général de l’expression sans préciser indûment s’il s’agit de la fin de leur vie ou de l’issue ultime.
- source_word: ἄτιμον τὸ γῆρας αὐτῶν
  choice: leur vieillesse sera sans honneur
  rationale: Préserve la construction prédicative et la dimension d’honneur et de honte de ἄτιμος, sans introduire l’idée plus active d’une humiliation infligée.
theological_decisions:
- issue: Valeur morale d’une longue vie
  choice: Le verset affirme que même une longue vie ne leur assure ni valeur ni honneur.
  alternative: Y voir seulement une observation sociale sur la réputation des personnes âgées.
  rationale: Le contexte oppose le sort des justes à celui des impies, mais le texte ne précise pas explicitement « devant Dieu »; cette précision n’est donc pas ajoutée.
translation_notes:
  register: Français moderne, digne et accessible. « Sans honneur » garde la valeur stative de l’adjectif grec et évite la nuance plus active de « déshonorée ».
