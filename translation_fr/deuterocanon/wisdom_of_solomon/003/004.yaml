  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/004.yaml
  text: For even if they are punished in the sight of men[a], their hope is full of immortality.
translation:
  language: fr
  text: Car, même si, aux yeux des hommes, ils subissent un châtiment[a], leur espérance est pleine d’immortalité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils sont punis » ou « ils sont corrigés ». Le verbe grec peut évoquer une peine punitive ou une correction; ici, « aux yeux des hommes » souligne le contraste entre l’apparence humaine et la réalité ultime.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ὄψει ἀνθρώπων
  choice: aux yeux des hommes
  rationale: Cette expression naturelle en français conserve le point de vue humain et apparent signalé par ὄψει, en contraste avec la réalité ultime de leur espérance.
- source_word: ἐὰν κολασθῶσιν
  choice: même si… ils subissent un châtiment
  rationale: Le verbe κολάζω peut désigner une peine punitive ou une correction. « Subissent un châtiment » en garde la force sans affirmer explicitement qu’il s’agit d’une condamnation divine.
- source_word: ἡ ἐλπὶς αὐτῶν
  choice: leur espérance
  rationale: Rendu possessif direct, naturel et fidèle, qui désigne l’attente confiante des justes.
- source_word: ἀθανασίας
  choice: d’immortalité
  rationale: « Immortalité » est le correspondant français précis et usuel de ἀθανασία; le génitif exprime ici ce dont l’espérance est pleine.
- source_word: πλήρης
  choice: est pleine de
  rationale: Le verbe être, sous-entendu en grec, est explicité en français; cette tournure préserve l’image d’une espérance remplie d’immortalité.
theological_decisions:
- issue: Portée du langage de châtiment appliqué aux justes
  choice: « ils subissent un châtiment », encadré par « aux yeux des hommes »
  alternative: « ils sont corrigés » ou « ils sont punis »
  rationale: Le texte oppose l’apparence humaine à la destinée véritable des justes. Le rendu choisi conserve la force de κολάζω et la tension théologique, sans transformer leur souffrance apparente en verdict divin explicite.
translation_notes:
  register: Français international moderne, digne et accessible. « Aux yeux des hommes » conserve la formulation traditionnelle tout en restant courante; « subissent un châtiment » évite la raideur de « sont châtiés » et maintient l’ambiguïté du grec.
