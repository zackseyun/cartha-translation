  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/002.yaml
  text: In the eyes of fools they seemed to have died[a], and their departure was regarded as calamity,
translation:
  language: fr
  text: Aux yeux des insensés, ils ont semblé être morts, et leur départ a été jugé,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec fourni s’arrête après « leur départ » et ne précise pas ici comment celui-ci a été jugé. Certaines formes éditoriales ou traductions complètent le sens par « comme un malheur ».
