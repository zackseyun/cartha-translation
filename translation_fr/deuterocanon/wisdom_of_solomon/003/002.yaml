review_pass:
  verdict: revise
  source_fidelity: Le grec fourni s’interrompt après ἡ ἔξοδος αὐτῶν, immédiatement après le sujet de la proposition passive ἐλογίσθη. Il ne permet donc pas d’ajouter dans le texte français « comme un malheur », même si κακοῦ est la continuation attestée dans le texte usuel et reprise par la piste d’audit anglaise. La révision signale explicitement l’interruption sans transformer le fragment en proposition française grammaticalement inachevée.
  naturalness: « Ils ont paru être morts » rend naturellement l’aoriste de δοκέω avec l’infinitif parfait, tout en conservant le caractère apparent de l’évaluation. Une ellipse est plus lisible et plus honnête que « leur départ a été jugé, », qui laisse une construction française inachevée sans indiquer clairement la lacune.
  terminology: « Aux yeux des insensés » convient à ἐν ὀφθαλμοῖς ἀφρόνων et garde la portée évaluative du terme. « Leur départ » préserve la métaphore de ἔξοδος sans la réduire à « mort ». « Considéré » rend sobrement ἐλογίσθη.
  issues:
  - severity: medium
    issue: La dernière proposition française est syntaxiquement inachevée sans marquage textuel adéquat.
    rationale: Le grec fourni est lui-même tronqué après « leur départ », mais la virgule après « a été jugé » donne l’impression d’une simple erreur de ponctuation ou d’une omission non signalée. Une ellipse, avec une note ancrée, rend la limite de la source intelligible sans ajouter le complément absent.
  revised_text: Aux yeux des insensés, ils ont paru être morts, et leur départ a été considéré…[a]
  revised_footnotes:
  - marker: a
    text: Le texte grec fourni s’arrête ici, avant le complément de « a été considéré ». Dans le texte grec usuel, la suite est souvent rendue par « comme un malheur ».
    reason: source_text_boundary
  revision_rationale: La révision conserve strictement la limite du texte grec fourni, tout en remplaçant une phrase française suspendue de façon ambiguë par une ellipse qui marque explicitement l’interruption. Elle ne retient pas dans le texte principal le complément attesté par la tradition éditoriale et l’audit anglais, car il n’apparaît pas dans la source fournie.
