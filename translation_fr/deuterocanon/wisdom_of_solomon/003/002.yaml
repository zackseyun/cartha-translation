lexical_decisions:
- source_word: ἔδοξαν
  choice: ils ont semblé
  rationale: Le verbe exprime ici une apparence ou une impression du point de vue des observateurs, et non une affirmation objective.
- source_word: ἐν ὀφθαλμοῖς ἀφρόνων
  choice: aux yeux des insensés
  rationale: Cette formulation française naturelle conserve l’image grecque et la portée morale d’ἀφρόνων.
- source_word: τεθνάναι
  choice: être morts
  rationale: Le parfait infinitif présente la mort comme un état résultant; après « sembler », « être morts » est idiomatique en français.
- source_word: ἐλογίσθη
  choice: a été jugé
  rationale: Le passif indique ici une appréciation portée sur leur départ. « A été jugé » reste volontairement sans complément afin de ne pas ajouter au texte grec fourni un prédicat absent.
- source_word: ἡ ἔξοδος αὐτῶν
  choice: leur départ
  rationale: « Départ » préserve la métaphore de l’ἔξοδος sans la réduire explicitement à « mort » ou à « fin ».
theological_decisions:
- issue: Expression métaphorique de la mort par ἔξοδος
  choice: leur départ
  alternative: leur mort
  rationale: Le maintien de la métaphore préserve le contraste du contexte entre l’apparence humaine de la mort et la situation véritable des justes.
- issue: Prédicat absent après ἐλογίσθη dans la source grecque fournie
  choice: ne pas ajouter « comme un malheur » dans le texte principal
  alternative: leur départ a été considéré comme un malheur
  rationale: La traduction suit en priorité les mots grecs effectivement fournis. Ajouter « comme un malheur » importerait un élément non présent dans cette donnée source et résoudrait silencieusement son caractère incomplet.
translation_notes:
  register: Français international moderne, sobre et digne. « Insensés » garde la force morale du grec sans registre excessivement archaïque. La légère suspension de la dernière proposition reflète l’état incomplet de la source fournie plutôt que de le corriger tacitement.
