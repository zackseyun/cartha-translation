base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/010.yaml
  text: But the ungodly will have punishment according to what they reasoned[b][a], having neglected the righteous man and having departed from the Lord.
translation:
  language: fr
  text: Mais les impies subiront une peine à la mesure de leurs pensées[a], eux qui ont négligé le juste[b] et se sont détournés du Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon ce qu’ils avaient pensé », voire « à cause de leurs desseins ». Le grec souligne que leur peine correspond à leurs propres raisonnements et projets.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « le juste », au singulier : il s’agit vraisemblablement de la figure représentative du juste dans l’argument du livre.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσεβεῖς
  choice: les impies
  rationale: « Impies » exprime clairement la faute morale et religieuse envers Dieu, dans un registre digne et courant.
- source_word: καθʼ ἃ ἐλογίσαντο
  choice: à la mesure de leurs pensées
  rationale: Cette formulation conserve l’idée de correspondance introduite par κατά et le sens cognitif de λογίζομαι, sans imposer l’idée plus précise de complot.
- source_word: ἕξουσιν ἐπιτιμίαν
  choice: subiront une peine
  rationale: ἐπιτιμία désigne ici une peine ou un châtiment. « Subiront une peine » rend naturellement en français l’idée de recevoir cette sanction.
- source_word: ἀμελήσαντες τοῦ δικαίου
  choice: eux qui ont négligé le juste
  rationale: « Négligé » garde la valeur de manque de souci ou d’attention de ἀμελέω; « le juste » préserve le singulier personnel et sa continuité littéraire.
- source_word: τοῦ κυρίου ἀποστάντες
  choice: se sont détournés du Seigneur
  rationale: « Se détourner de » traduit naturellement l’éloignement volontaire exprimé par ἀφίστημι, sans employer le terme technique « apostasier ».
theological_decisions:
- issue: Référent de τοῦ δικαίου
  choice: le juste, figure personnelle singulière
  alternative: les justes collectivement, ou la justice comme principe abstrait
  rationale: L’article et l’adjectif au singulier, ainsi que la continuité avec la figure du juste en Sagesse 2, favorisent un référent personnel. La traduction ne lui impose aucune identification christologique plus étroite.
- issue: Valeur de κύριος
  choice: Seigneur
  alternative: Maître
  rationale: Dans ce contexte sapientiel juif grec, κύριος désigne Dieu; « Seigneur » en conserve le poids théologique traditionnel sans ajout confessionnel.
- issue: Rapport entre la peine et les raisonnements des impies
  choice: une peine correspondant à leurs propres pensées
  alternative: une peine infligée précisément pour leurs complots
  rationale: καθʼ ἃ indique une correspondance, tandis que ἐλογίσαντο peut viser pensées, raisonnements ou desseins. Le texte principal conserve cette latitude et la note signale la nuance hostile possible.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe participiale grecque est rendue par « eux qui », plus naturelle en français. Les deux appels de note figurent immédiatement après les expressions concernées.
