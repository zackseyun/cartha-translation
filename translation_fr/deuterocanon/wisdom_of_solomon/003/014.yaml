base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/014.yaml
  text: And the eunuch who has not worked lawlessness with his hand, nor conceived evil things against the Lord, will be given the chosen grace of faith and a more delightful inheritance in the temple of the Lord.
translation:
  language: fr
  text: Et l’eunuque qui n’a commis de sa main aucun acte contraire à la Loi et n’a conçu aucun mauvais dessein contre le Seigneur recevra une grâce de choix liée à la foi[a], ainsi qu’une part plus désirable dans le temple du Seigneur.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formule grecque est condensée. On peut aussi comprendre : « un don précieux de foi », « une grâce de choix accordée pour sa fidélité » ou « une grâce excellente de confiance » ; le mot traduit par « foi » peut également signifier « fidélité » ou « confiance ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « un lot plus agréable » ou « un héritage plus enviable dans le sanctuaire du Seigneur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐνοῦχος
  choice: eunuque
  rationale: Le terme grec désigne précisément un eunuque; le conserver préserve la réalité corporelle et sociale déterminante dans le contexte.
- source_word: ὁ μὴ ἐργασάμενος ἐν χειρὶ ἀνόμημα
  choice: qui n’a commis de sa main aucun acte contraire à la Loi
  rationale: « Commettre » est idiomatique en français avec un acte répréhensible; « de sa main » maintient l’image concrète du grec, et « acte contraire à la Loi » rend le nom singulier ἀνόμημα plutôt que la notion abstraite d’absence de loi.
- source_word: μηδὲ ἐνθυμηθεὶς κατὰ τοῦ κυρίου πονηρά
  choice: et n’a conçu aucun mauvais dessein contre le Seigneur
  rationale: Le participe exprime une activité intérieure de pensée ou de conception; « mauvais dessein » restitue naturellement le pluriel substantivé πονηρά et son orientation hostile marquée par κατά.
- source_word: δοθήσεται
  choice: recevra
  rationale: Le futur passif signifie littéralement « lui sera donné »; « recevra » donne en français courant le même mouvement de don sans en préciser l’auteur.
- source_word: τῆς πίστεως χάρις ἐκλεκτὴ
  choice: une grâce de choix, celle de la foi
  rationale: Cette formulation conserve χάρις comme « grâce », πίστις comme « foi » et ἐκλεκτή au sens qualitatif de « de choix », tout en laissant percevoir la relation génitive compacte et ambiguë.
- source_word: κλῆρος
  choice: part
  rationale: Le mot désigne un lot ou une part attribuée. « Part » convient au contexte de récompense sans imposer le sens plus développé d’« héritage ».
- source_word: ἐν ναῷ Κυρίου
  choice: dans le temple du Seigneur
  rationale: ναός désigne le temple ou sanctuaire; « temple du Seigneur » est direct, clair et traditionnel sans archaïsme.
- source_word: θυμηρέστερος
  choice: plus désirable
  rationale: Le comparatif exprime ce qui agrée davantage ou est plus souhaitable; « plus désirable » s’accorde naturellement avec une part attribuée et maintient la comparaison.
theological_decisions:
- issue: Sens de πίστις dans τῆς πίστεως χάρις ἐκλεκτή
  choice: foi
  alternative: fidélité; confiance
  rationale: « Foi » demeure le sens principal possible, mais la construction grecque condensée autorise aussi « fidélité » ou « confiance »; la note préserve cette indétermination.
- issue: Relation syntaxique dans τῆς πίστεως χάρις ἐκλεκτή
  choice: une grâce de choix, celle de la foi
  alternative: un don précieux accordé à sa fidélité; la grâce choisie de la foi
  rationale: Le génitif τῆς πίστεως peut caractériser la grâce ou indiquer le fondement auquel elle répond. Le texte principal reste proche de la structure grecque et la note expose les principales nuances sans trancher doctrinalement.
- issue: Référent de κύριος
  choice: le Seigneur
  alternative: le Maître
  rationale: « Seigneur » est le rendu normal de κύριος dans ce contexte religieux et n’ajoute aucune précision absente du texte grec.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme entre l’acte commis « de sa main » et le dessein intérieur est conservé. « Acte contraire à la Loi » explicite sobrement la valeur concrète et morale de ἀνόμημα, tandis que les notes maintiennent l’ambiguïté de la formule relative à la grâce et à la foi.
