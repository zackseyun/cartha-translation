base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/016.yaml
  text: But the children of adulterers will be imperfect[b][a], and the offspring of an unlawful union will perish.
translation:
  language: fr
  text: Mais les enfants de ceux qui commettent l’adultère seront imparfaits[a], et la descendance issue d’une union contraire à la loi disparaîtra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « inachevés », « privés d’accomplissement » ou « sans parvenir à leur plein développement ». Le grec exprime un manque d’achèvement sans préciser la forme exacte que prend ce manque.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα
  choice: les enfants
  rationale: Désigne naturellement les enfants ou descendants, sans restriction au sexe masculin.
- source_word: μοιχῶν
  choice: nés d’adultères
  rationale: Le génitif pluriel renvoie à des personnes caractérisées par l’adultère. Cette formulation française explicite le lien de filiation sans réduire la force morale du terme.
- source_word: ἀτέλεστα
  choice: inachevés
  rationale: Le mot exprime l’absence d’achèvement ou de plein accomplissement, sans préciser la nature exacte de ce manque; « inachevés » conserve cette ambiguïté.
- source_word: παρανόμου κοίτης
  choice: d’une union contraire à la loi
  rationale: κοίτη signifie littéralement « lit » et désigne ici, par métonymie, l’union sexuelle; παράνομος lui donne une qualification juridico-morale. La formulation retenue est claire en français moderne.
- source_word: σπέρμα
  choice: la descendance
  rationale: Littéralement « semence », le terme désigne ici collectivement la postérité.
- source_word: ἀφανισθήσεται
  choice: disparaîtra
  rationale: Le futur passif évoque le fait d’être effacé, de disparaître ou de périr. « Disparaîtra » préserve directement cette image sans renforcer indûment le verbe.
theological_decisions:
- issue: Jugement collectif formulé au sujet des enfants issus de relations adultères
  choice: Conserver la déclaration sévère comme jugement sapientiel, sans en atténuer la portée.
  alternative: La réduire à une observation sur la seule stigmatisation sociale ou y lire explicitement une doctrine de culpabilité héréditaire.
  rationale: Le grec énonce un jugement grave lié à l’adultère et à une union contraire à la loi, mais ne précise ni le mécanisme ni la nature exacte de l’inachèvement. La traduction conserve cette tension sans ajouter de doctrine.
translation_notes:
  register: Français international moderne, digne et direct. « Inachevés » maintient l’ambiguïté de ἀτέλεστα; la note évite que le lecteur ne limite spontanément le terme à une déficience physique. « Union contraire à la loi » rend clairement la métonymie du « lit » grec tout en conservant sa portée morale et juridique.
