  text: For the fruit of good labors is glorious[a], and the root of understanding does not fail.
translation:
  language: fr
  text: Car le fruit de bons travaux est glorieux, et la racine du discernement ne défaille pas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et la racine de la prudence est infaillible ».'
    reason: « Prudence » est une autre traduction possible de φρόνησις; « infaillible » rend l’adjectif ἀδιάπτωτος de façon plus formelle.
lexical_decisions:
- source_word: ἀγαθῶν πόνων
  choice: des nobles efforts
  rationale: πόνος évoque un effort soutenu ou pénible, tandis que ἀγαθός en qualifie positivement la valeur. « Nobles efforts » exprime cet ensemble avec naturel, sans réduire le sens à de simples œuvres.
- source_word: καρπός
  choice: fruit
  rationale: Le maintien de « fruit » préserve l’image végétale, qui se prolonge avec la « racine » dans la seconde proposition.
- source_word: εὐκλεής
  choice: digne d’honneur
  rationale: Le mot désigne ce qui jouit d’une bonne renommée ou mérite l’honneur. « Digne d’honneur » rend cette valeur sans suggérer nécessairement une célébrité étendue, comme pourrait le faire « renommé ».
- source_word: ἀδιάπτωτος
  choice: ne dépérit pas
  rationale: L’adjectif indique ce qui ne tombe pas, ne défaille pas ou ne disparaît pas. Dans le contexte de la racine, la formulation verbale « ne dépérit pas » est naturelle et maintient l’image végétale sans en changer la portée fondamentale.
- source_word: ῥίζα
  choice: racine
  rationale: Le terme est traduit littéralement afin de conserver le parallélisme imagé entre le fruit et la racine.
- source_word: φρονήσεως
  choice: du discernement
  rationale: φρόνησις désigne l’intelligence pratique, la réflexion avisée ou la prudence. « Discernement » est clair en français actuel et évite de confondre ce terme avec σοφία, la sagesse.
theological_decisions:
- issue: Rapport entre φρόνησις et le vocabulaire de la sagesse
  choice: discernement
  alternative: prudence ou sagesse
  rationale: Le grec emploie φρόνησις et non σοφία. « Discernement » conserve la nuance pratique et intellectuelle du terme sans effacer cette distinction lexicale.
- issue: Structure métaphorique du fruit et de la racine
  choice: conserver explicitement les deux images
  alternative: expliciter par « le résultat » et « le fondement »
  rationale: Le verset forme une sentence équilibrée fondée sur deux images végétales. Les conserver respecte sa texture littéraire et évite une interprétation ajoutée.
translation_notes:
  register: Français international actuel, de registre digne et proverbial. Le parallélisme entre « fruit » et « racine » est conservé; la phrase reste accessible sans vocabulaire confessionnel spécialisé.
