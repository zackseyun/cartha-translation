base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/011.yaml
  text: For miserable is the one who despises wisdom and instruction[a], and their hope is empty, their labors are unprofitable, and their works are useless.
translation:
  language: fr
  text: 'Car ceux qui méprisent la sagesse et l’instruction[a] sont malheureux : leur espérance est vaine, leurs peines sont insensées et leurs œuvres sont inutiles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la discipline » ou « la formation » ; le grec παιδεία peut désigner à la fois l’éducation et la correction formatrice.
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφίαν
  choice: la sagesse
  rationale: 'Sens courant dans la littérature sapientielle : la sagesse comme bien moral et intellectuel, et non simple habileté.'
- source_word: παιδείαν
  choice: l’instruction
  rationale: Le terme englobe l’éducation, la formation et la discipline corrective. « Instruction » convient naturellement avec « sagesse », tandis qu’une note conserve l’étendue du grec.
- source_word: ὁ ἐξουδενῶν
  choice: celui qui méprise
  rationale: Le participe désigne celui qui tient quelque chose pour rien ou le traite avec dédain ; « méprise » en restitue clairement la force.
- source_word: ταλαίπωρος
  choice: malheureux
  rationale: L’adjectif décrit une condition misérable et digne de pitié. « Malheureux » est naturel et digne en français moderne.
- source_word: κενὴ ἡ ἐλπὶς αὐτῶν
  choice: leur espérance est vaine
  rationale: « Vaine » exprime ici une espérance vide, sans consistance ni résultat, dans une formulation française idiomatique.
- source_word: οἱ κόποι ἀνόητοι
  choice: leurs peines sont insensées
  rationale: κόποι désigne les efforts pénibles ou les peines, et ἀνόητοι ce qui manque d’intelligence ou de sens. La traduction maintient ce jugement plutôt que de le réduire à la seule absence de profit.
- source_word: ἄχρηστα τὰ ἔργα αὐτῶν
  choice: leurs œuvres inutiles
  rationale: ἄχρηστα signifie « inutiles, sans utilité » ; « œuvres » conserve le sens large de ἔργα et le registre sapientiel.
theological_decisions:
- issue: Passage du sujet singulier (« celui qui méprise ») aux possessifs pluriels (« leur… leurs… »)
  choice: Conserver le singulier représentatif puis le pluriel du texte grec.
  alternative: 'Tout pluraliser : « ceux qui méprisent… leur espérance… »'
  rationale: Le grec passe lui-même d’un participe substantivé singulier à des possessifs pluriels, présentant l’individu comme représentant d’une catégorie. Le français peut préserver cette tension grammaticale sans en modifier le sens.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « Car malheureux est celui qui… » garde l’accent prédicatif du grec sans archaïsme marqué. Les trois propositions finales restent concises et parallèles.
