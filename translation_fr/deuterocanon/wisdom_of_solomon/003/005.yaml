base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/005.yaml
  text: And after being disciplined a little[a], they will receive great good[c][b], because God tested them and found them worthy of himself.
translation:
  language: fr
  text: Après avoir été quelque peu corrigés[a], ils recevront de grands bienfaits[b], car Dieu les a mis à l’épreuve et les a trouvés dignes de lui[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pendant peu de temps » ou « dans une faible mesure ». Le grec peut évoquer soit une discipline de courte durée, soit une discipline limitée.
    reason: lexical_alternative
  - marker: b
    text: Ou « ils seront largement comblés » ou « ils bénéficieront de grands biens ». Le grec exprime l’idée de recevoir de grands bienfaits.
    reason: lexical_alternative
  - marker: c
    text: Ou « dignes pour lui ». L’expression grecque souligne qu’ils ont été reconnus dignes en relation avec Dieu lui-même.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγα
  choice: quelque peu
  rationale: Cette expression conserve le contraste avec « de grands bienfaits » tout en laissant ouverte l’idée d’une mesure ou d’une durée limitée.
- source_word: παιδευθέντες
  choice: après avoir été corrigés
  rationale: Le verbe peut évoquer l’éducation, la formation ou une discipline corrective. « Corrigés » exprime ici une discipline formatrice sans la réduire explicitement à un châtiment.
- source_word: μεγάλα … εὐεργετηθήσονται
  choice: ils recevront de grands bienfaits
  rationale: Cette formulation française naturelle rend le passif de εὐεργετέω, « faire du bien à, accorder un bienfait », ainsi que l’intensité de μεγάλα.
- source_word: ἐπείρασεν
  choice: a mis à l’épreuve
  rationale: Dans ce contexte, le verbe désigne une épreuve qui révèle la qualité des personnes, et non une incitation au mal.
- source_word: ἀξίους ἑαυτοῦ
  choice: dignes de lui
  rationale: 'La formulation garde l’orientation relationnelle du grec : ils sont reconnus dignes par rapport à Dieu lui-même.'
theological_decisions:
- issue: Rapport entre la souffrance des justes et l’épreuve divine
  choice: Dieu les a mis à l’épreuve
  alternative: Dieu les a éprouvés / a vérifié leur valeur
  rationale: Le texte attribue l’épreuve à Dieu et affirme qu’elle aboutit au constat de leur dignité, sans préciser davantage si leur souffrance est punitive, éducative ou simplement révélatrice.
- issue: Sens de la dignité devant Dieu
  choice: dignes de lui
  alternative: dignes pour lui
  rationale: « Dignes de lui » suit de près le génitif grec et préserve l’ambiguïté entre la dignité en relation avec Dieu et l’aptitude à lui appartenir ou à être auprès de lui.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le contraste rhétorique entre la faible mesure de la discipline et la grandeur des bienfaits, ainsi que la tension du rôle de Dieu dans l’épreuve.
