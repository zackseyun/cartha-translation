  source_fidelity: 'Le texte français rend fidèlement l’hébreu : « dans ta prospérité / ton bonheur, il est comme toi ; mais dans ton malheur / ton adversité, il prendra ses distances de toi ». Le futur « s’éloignera » convient à l’imparfait hébreu et restitue bien la nuance réflexive de יתנדה. La note signale correctement la divergence majeure du grec, qui conserve le premier membre mais lit ensuite qu’il parlera avec assurance aux serviteurs.'
