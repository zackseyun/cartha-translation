  text: In your prosperity he is like you[a], but in your adversity he will separate himself from you.
translation:
  language: fr
  text: Dans la prospérité, il est comme toi, mais dans l’adversité, il s’éloignera de toi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « et il parlera avec assurance à tes serviteurs ». L’hébreu conservé porte plutôt : « il s’éloignera de toi ». Le texte principal suit ici le témoin hébreu, tandis que cette variante grecque est signalée en raison de l’importance de la divergence.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטוֹבָתְךָ
  choice: dans la prospérité
  rationale: טובה désigne ici une situation favorable ou heureuse. « Prospérité » forme un contraste naturel avec « adversité » sans limiter nécessairement le sens à la richesse matérielle.
- source_word: הוּא כָמוֹךָ
  choice: il est comme toi
  rationale: 'La comparaison hébraïque est directe et demeure ouverte quant à sa portée précise : cet ami se montre semblable à toi ou s’identifie à toi lorsque tout va bien.'
- source_word: וּבְרָעָתְךָ
  choice: mais dans l’adversité
  rationale: רעה désigne ici les circonstances mauvaises, le malheur ou l’épreuve. « Mais » explicite l’opposition portée par le parallélisme.
- source_word: יִתְנַדֶּה מִמֶּךָּ
  choice: il s’éloignera de toi
  rationale: La forme réfléchie exprime le fait de prendre ses distances ou de se séparer. « S’éloignera de toi » est naturel en français moderne et conserve cette idée de retrait volontaire.
