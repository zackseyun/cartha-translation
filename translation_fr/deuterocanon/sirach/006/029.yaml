  text: Its net will become for you a strong refuge[b][a], and its cords garments of fine gold.
translation:
  language: fr
  text: Son filet deviendra pour toi un puissant refuge[b][a], et ses cordes, des vêtements d’or fin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec dit : « Ses entraves seront pour toi un abri puissant, et ses branches un vêtement de gloire. » Cette formulation diffère sensiblement de l’hébreu conservé, qui parle de « son filet », de « ses cordes » et de « vêtements d’or fin ».'
    reason: alternative_reading
  - marker: b
    text: Dans l’image hébraïque, ce qui paraît d’abord retenir ou entraver devient finalement une protection et une parure honorable.
    reason: cross_reference
lexical_decisions:
- source_word: רִשְׁתָּהּ
  choice: son filet
  rationale: Le nom רשת désigne un filet ou un réseau de mailles. « Filet » conserve l’image concrète et correspond bien aux « cordes » du second membre.
- source_word: מְכוֹן עֹז
  choice: un puissant refuge
  rationale: מכון peut désigner un lieu établi, une base ou une demeure stable, tandis que עז exprime la force. « Un puissant refuge » rend naturellement en français la fonction protectrice de l’image sans imposer le sens plus étroit de « fondation ».
- source_word: חַבְלֹתֶיהָ
  choice: ses cordes
  rationale: חבל signifie couramment corde, lien ou câble. « Cordes » maintient le lien avec l’image du filet et permet le passage métaphorique aux vêtements.
- source_word: בִּגְדֵי כָתֶם
  choice: des vêtements d’or fin
  rationale: בגדי signifie « vêtements » et כתם désigne de l’or fin ou de choix. Cette traduction suit l’hébreu conservé et garde son image somptueuse.
- source_word: וְהָיְתָה לְךָ
  choice: deviendra pour toi
  rationale: La tournure exprime ici le résultat futur de l’accueil de la sagesse et de sa discipline. « Deviendra pour toi » rend clairement ce mouvement.
theological_decisions:
- issue: Choix entre le texte hébreu conservé et le parallèle grec dont les images diffèrent sensiblement
  choice: Suivre l’hébreu dans le texte principal et signaler le grec en note.
  alternative: 'Suivre le grec : « ses entraves seront pour toi un abri puissant, et ses branches un vêtement de gloire » ou une formulation équivalente.'
  rationale: Lorsque l’hébreu du Siracide est conservé avec une bonne fiabilité, il constitue ici le témoin principal. Le grec reflète une variante textuelle ou une interprétation notable; sa lecture est donc préservée en note plutôt que fusionnée avec l’hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique est conservé, ainsi que le renversement des images de contrainte en protection et en honneur. « Puissant refuge » privilégie une expression française fluide tout en maintenant l’idée d’un lieu stable et fort.
