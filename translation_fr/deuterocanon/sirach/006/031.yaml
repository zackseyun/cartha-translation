  text: You will wear her like garments of honor[a], and you will crown yourself with her like a crown of splendor.
translation:
  language: fr
  text: Tu la porteras comme des vêtements d’honneur, et tu la couronneras d’une couronne de splendeur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « tu placeras sur toi-même une couronne de joie » ou « d’exultation »; l’hébreu dit : « tu la couronneras d’une couronne de splendeur ».'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּגְדֵי כָבוֹד
  choice: des habits d’honneur
  rationale: L’expression désigne littéralement des vêtements associés à l’honneur ou à la gloire. « Habits d’honneur » conserve l’image concrète et la dignité de כָבוֹד dans un français clair.
- source_word: תִלְבְּשֶׁנָּה
  choice: tu la porteras
  rationale: Le verbe לבש signifie « revêtir, porter », et le suffixe féminin renvoie à la sagesse personnifiée. Cette formulation rend naturellement en français l’image selon laquelle la sagesse est portée comme un vêtement.
- source_word: וַעֲטֶרֶת תִּפְאֶרֶת
  choice: comme d’une couronne de splendeur
  rationale: תִּפְאֶרֶת évoque la beauté, l’éclat ou la splendeur. « Splendeur » maintient le parallélisme avec l’honneur du premier membre et distingue clairement la leçon hébraïque de la variante grecque.
- source_word: תְּעַטְּרֶנָּה
  choice: tu te couronneras d’elle
  rationale: Le verbe עטר signifie « couronner, ceindre, orner ». La tournure pronominale exprime que le lecteur se pare de la sagesse, tandis que « d’elle » préserve le suffixe féminin hébreu.
theological_decisions:
- issue: Référent des suffixes féminins
  choice: Conserver la personnification de la sagesse par les pronoms « la » et « elle ».
  alternative: Supprimer les pronoms explicites et parler seulement d’habits d’honneur et d’une couronne.
  rationale: Dans le contexte immédiat, la sagesse est personnifiée comme une femme. Maintenir les pronoms féminins préserve cette caractérisation littéraire et théologique sans en préciser davantage la portée.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique et les deux images concrètes du vêtement et de la couronne sont conservés; la légère hardiesse de « te couronneras d’elle » maintient volontairement la personnification présente dans l’hébreu.
