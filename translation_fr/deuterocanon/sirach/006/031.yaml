    issue: Le second membre est rendu comme réflexif (« tu te couronneras d’elle »), alors que le texte hébreu donné a un suffixe féminin objet dans תעטרנה.
    rationale: La leçon hébraïque se traduit directement par « tu la couronneras ». Le grec parallèle a au contraire une construction réflexive explicite (« tu placeras sur toi-même »); il doit être signalé comme lecture parallèle, sans être substitué au texte hébreu principal.
  - severity: medium
    issue: La note ne signale que « joie/exultation » contre « splendeur ».
    rationale: 'Elle doit aussi indiquer que le grec diffère dans la construction : il parle de se placer à soi-même une couronne, tandis que l’hébreu dit de couronner « la » (la sagesse).'
