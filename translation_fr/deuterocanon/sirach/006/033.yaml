  text: If you are willing to listen[a], you will receive instruction; if you incline your ear[b], you will become wise.
translation:
  language: fr
  text: Si tu désires écouter[a] et tends l’oreille, tu recevras l’instruction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu conservé est difficile et plus bref que le grec. Le grec porte : « Si tu aimes écouter, tu recevras l’instruction ; si tu tends l’oreille, tu seras sage. » La traduction suit l’hébreu comme texte principal ; le grec éclaire le sens et conserve un parallélisme plus développé.'
    reason: textual_variant
lexical_decisions:
- source_word: אִם תּוֹבֵא לִשְׁמֹעַ
  choice: Si tu désires écouter
  rationale: La forme hébraïque est inhabituelle, mais le parallèle grec « si tu aimes écouter » confirme une idée de désir ou de disposition volontaire. Cette formulation reste naturelle sans réduire l’expression au simple fait d’entendre.
- source_word: וְתֵט אָזְנְךָ
  choice: et si tu tends l’oreille
  rationale: Cette expression conserve l’image hébraïque d’une écoute attentive tout en étant idiomatique en français moderne.
- source_word: תִּוָּסֵר
  choice: tu te laisseras instruire
  rationale: La forme issue de יסר exprime le fait de recevoir instruction, formation ou correction. Le tour pronominal rend la nuance réceptive sans évoquer exclusivement une punition.
theological_decisions: []
translation_notes:
  register: Français moderne, simple et digne. Le tutoiement singulier reproduit l’adresse individuelle de l’hébreu. La traduction suit le texte hébreu comme texte principal et signale en note le parallélisme plus développé du grec.
