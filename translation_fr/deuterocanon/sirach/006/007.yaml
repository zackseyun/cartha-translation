  text: If you acquire a friend, acquire him through testing, and do not quickly put your trust in him.
translation:
  language: fr
  text: Si tu acquiers un ami[a], acquiers-le en le mettant à l’épreuve[b], et ne te hâte pas de lui faire confiance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « gagnes un ami ». Le verbe hébreu signifie « acquérir, obtenir »; le grec emploie lui aussi un verbe de ce sens. L’image peut paraître plus transactionnelle que l’expression française courante « se faire un ami ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « acquiers-le dans l’épreuve ». La formulation peut désigner soit le fait de mettre l’ami à l’épreuve, soit le fait que l’amitié se révèle au cours d’une épreuve.'
    reason: source_ambiguity
lexical_decisions:
- source_word: קָנִיתָ / קְנֵהוּ
  choice: acquiers / acquiers-le
  rationale: Le verbe קנה signifie couramment « acquérir, obtenir ». Le grec κτᾶσαι / κτῆσαι confirme cette image. « Acquérir » conserve la métaphore quelque peu transactionnelle du texte source, tandis que la note indique une formulation française plus idiomatique.
- source_word: אוֹהֵב
  choice: ami
  rationale: Dans ce contexte, אוֹהֵב désigne un ami personnel. Le grec φίλον confirme ce sens relationnel.
- source_word: בְּנִסָּיוֹן
  choice: en le mettant à l’épreuve
  rationale: נסיון désigne une mise à l’épreuve ou une épreuve. Cette formulation comprend la préposition ב de manière instrumentale et exprime naturellement en français que la fiabilité de l’ami doit être éprouvée, sans effacer l’autre lecture possible, signalée en note.
- source_word: וְאַל תְּמַהֵר
  choice: et ne te hâte pas
  rationale: Cette tournure rend directement l’avertissement à ne pas agir trop vite, dans un français actuel mais digne.
- source_word: לִבְטוֹחַ עָלָיו
  choice: de lui faire confiance
  rationale: בטח avec על exprime le fait de se fier à quelqu’un ou de placer sa confiance en lui. « Faire confiance » est la formulation française naturelle et garde toute la force de l’avertissement.
- source_word: אוֹהֵב ... עָלָיו
  choice: ami ... le / lui
  rationale: L’hébreu et le grec emploient le masculin singulier. Le français le conserve naturellement dans la reprise du nom masculin « ami ».
theological_decisions:
- issue: Référence masculine singulière dans une instruction sapientielle générale
  choice: Conserver le masculin singulier (« ami », « le », « lui »)
  alternative: Employer une formulation inclusive au pluriel ou reformuler sans pronom genré
  rationale: Le texte source présente un cas générique au masculin singulier. Le français peut le reproduire naturellement sans ajouter une distinction absente du passage.
- issue: 'Valeur de בְּנִסָּיוֹן : moyen de vérifier l’ami ou circonstance de l’épreuve'
  choice: 'Lecture instrumentale : « en le mettant à l’épreuve »'
  alternative: 'Lecture circonstancielle : « dans l’épreuve »'
  rationale: La lecture instrumentale s’accorde au conseil de ne pas accorder trop vite sa confiance. Toutefois, l’hébreu et le grec permettent aussi de comprendre que l’amitié se révèle au cours d’une épreuve; cette ambiguïté est conservée en note.
translation_notes:
  register: Tutoiement sapientiel au singulier, conforme à l’adresse directe du texte. Style concis, actuel et digne. La répétition « acquiers… acquiers-le » est volontairement conservée afin de refléter la structure emphatique de l’hébreu et du grec.
