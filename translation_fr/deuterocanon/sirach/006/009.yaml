  text: There is a friend who turns into an enemy[a], and he will expose the quarrel that brings your disgrace.
translation:
  language: fr
  text: Il y a tel ami qui devient un ennemi et qui dévoilera la querelle qui te couvre de honte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « et la querelle de ta honte, il la dévoilera ». La construction hébraïque est concise et peut aussi évoquer une querelle honteuse ou une querelle qui devient pour toi une cause de honte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ אוֹהֵב
  choice: Il y a tel ami
  rationale: אוֹהֵב désigne ici un ami, comme le confirme le grec φίλος. La tournure « il y a tel ami » exprime naturellement en français une catégorie de faux amis.
- source_word: נֶהְפָּךְ לְשׂוֹנֵא
  choice: qui devient un ennemi
  rationale: 'נהפך avec לְ marque un retournement de relation : l’ami devient une personne hostile. « Un ennemi » restitue clairement שׂוֹנֵא dans ce contexte.'
- source_word: רִיב
  choice: la querelle
  rationale: רִיב peut désigner une querelle, un différend ou un litige. Ici, « querelle » convient au conflit personnel sans lui donner nécessairement une portée judiciaire.
- source_word: חֶרְפָּתְךָ
  choice: qui te couvre de honte
  rationale: Le rapport de construction avec רִיב est très condensé. Cette formulation conserve l’idée de honte ou d’opprobre attachée à la querelle tout en restant naturelle en français.
- source_word: יַחְשֹׂף
  choice: dévoilera
  rationale: Le verbe signifie découvrir, mettre au jour. « Dévoilera » rend la divulgation hostile de la querelle et concorde avec le grec ἀποκαλύψει.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et sapientiel. « Tel ami » garde la valeur générale de יֵשׁ sans suggérer que tout ami agit ainsi. La note préserve l’ambiguïté du lien entre « querelle » et « honte ».
