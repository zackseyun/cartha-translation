base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/001.yaml
  text: Do not become an enemy instead of a friend, for an evil name will inherit shame and disgrace[b][a]; so it is with a sinful man of double tongue.
translation:
  language: fr
  text: Dans les grandes choses comme dans les petites, ne manque pas de discernement ; ne deviens pas un ennemi à la place d’un ami. Car une mauvaise réputation aura pour héritage la honte et l’opprobre[a] ; ainsi en va-t-il de l’homme pécheur à la langue double[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin hébreu conservé est plus court et se lit approximativement : « Un mauvais nom [hérite de / entraîne] honte et opprobre ; ainsi, un homme mauvais, possesseur de deux [choses]. » Le grec ajoute les deux avertissements initiaux : « Dans les grandes choses comme dans les petites, ne manque pas de discernement ; ne deviens pas un ennemi à la place d’un ami », et comprend la dernière expression au sens de « à la langue double ».'
    reason: textual_variant
  - marker: b
    text: Ou « à deux langues ». L’expression hébraïque est obscure et signifie littéralement « possesseur de deux [choses] » ; le grec l’interprète comme désignant une personne à la langue double.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם רַע / ὄνομα πονηρόν
  choice: un mauvais renom
  rationale: Littéralement « un mauvais nom ». En français actuel, « mauvais renom » conserve l’idée du nom social et reste plus naturel que « nom mauvais ».
- source_word: וְקָלוֹן / αἰσχύνη
  choice: la honte
  rationale: Les deux témoins évoquent la honte publique. Ce choix bref et courant permet de le distinguer du terme suivant.
- source_word: חֶרְפָּה / ὄνειδος
  choice: l’opprobre
  rationale: Le mot désigne le blâme et le déshonneur publics. « Opprobre » rend cette dimension sociale tout en préservant le binôme avec « honte ».
- source_word: תּוֹרִישׁ / κληρονομήσει
  choice: aura pour héritage
  rationale: Cette formulation française naturelle conserve l’image de l’héritage confirmée par le grec, sans aplatir le verbe en « recevra ».
- source_word: אִישׁ רַע / ὁ ἁμαρτωλός
  choice: l’homme pécheur
  rationale: L’hébreu dit « homme mauvais », tandis que le grec dit « le pécheur ». « Homme pécheur » rend la portée morale commune sans effacer complètement la divergence.
- source_word: בַּעַל שְׁתָּיִם / ὁ δίγλωσσος
  choice: à la langue double
  rationale: L’hébreu, obscur, dit littéralement « possesseur de deux [choses] » ; le grec l’interprète comme « à deux langues ». La traduction garde la métaphore probable sans la paraphraser par « hypocrite » ou « fourbe ».
- source_word: ἀντὶ φίλου μὴ γίνου ἐχθρός
  choice: Ne deviens pas un ennemi au lieu d’un ami
  rationale: Cette proposition grecque est claire et fournit une exhortation absente du témoin hébreu conservé. Le français suit directement l’opposition entre ami et ennemi.
theological_decisions:
- issue: Divergence majeure entre le témoin hébreu et le texte grec
  choice: Inclure dans le texte principal l’exhortation grecque claire, puis traduire le noyau commun, en signalant la divergence dans une note.
  alternative: 'Traduire uniquement l’hébreu conservé : « Un mauvais renom aura pour héritage la honte et l’opprobre ; ainsi en va-t-il d’un homme mauvais, possesseur de deux [choses]. »'
  rationale: Le texte hébreu est plus court et sa finale est obscure, tandis que le grec transmet une forme plus complète et interprète la finale. La note rend visible cette différence au lieu de présenter le texte composite comme certain.
- issue: Interprétation morale de בַּעַל שְׁתָּיִם
  choice: à la langue double
  alternative: possesseur de deux [choses]
  rationale: Le grec ancien atteste explicitement l’idée de duplicité de langage, mais la note maintient l’obscurité réelle de la formulation hébraïque et évite d’en tirer une doctrine plus précise.
translation_notes:
  register: Français international moderne, digne et accessible. « Mauvais renom » préserve l’idiome du nom tout en restant naturel ; « aura pour héritage » maintient la métaphore ; « à la langue double » conserve l’image ancienne sans recourir au familier « faux jeton » ni au plus interprétatif « hypocrite ».
