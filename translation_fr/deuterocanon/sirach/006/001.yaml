  rationale: La révision restitue l’intégralité du grec parallèle fourni, tout en maintenant une note explicite sur le caractère plus court et obscur du témoin hébreu. Elle modernise « mauvais renom » en « mauvaise réputation » sans effacer l’idée du nom social, conserve les termes sapientiels établis, et préserve les deux ancrages de note à des emplacements clairs.
