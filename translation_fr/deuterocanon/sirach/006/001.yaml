  - severity: medium
    issue: Note textuelle incomplète sur l’ajout grec
    rationale: La note affirme que le grec ajoute « l’avertissement initial », puis ne cite que « Ne deviens pas un ennemi… ». Le grec fourni contient deux propositions initiales absentes du témoin hébreu conservé ; la note doit le préciser.
