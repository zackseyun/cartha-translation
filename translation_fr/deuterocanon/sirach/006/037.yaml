  text: He will give understanding to your heart[a], and what you have desired will make you wise.
translation:
  language: fr
  text: Il donnera de l’intelligence à ton cœur[a], et ce que tu as désiré te rendra sage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec porte : « Lui-même affermira ton cœur, et le désir de la sagesse te sera accordé. » Le témoin hébreu lit plutôt : « Il donnera de l’intelligence à ton cœur, et ce que tu as désiré te rendra sage. »'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהוּא
  choice: Il
  rationale: Le pronom masculin singulier renvoie très probablement au Seigneur, comme l’indique le parallèle grec, tout en évitant de répéter un référent absent de ce fragment hébreu.
- source_word: יָבִין
  choice: donnera de l’intelligence
  rationale: La forme causative de בין exprime l’idée de faire comprendre ou de donner du discernement. Cette tournure française est naturelle et convient à « ton cœur ».
- source_word: לִבֶּךָ
  choice: à ton cœur
  rationale: Le cœur désigne ici le siège intérieur de la pensée et de la volonté. Le maintien de l’image hébraïque préserve son anthropologie sans la réduire à l’émotion.
- source_word: וַאֲשֶׁר אִוִּיתָה
  choice: et ce que tu as désiré
  rationale: La proposition relative garde ouverte l’identité de l’objet désiré, tandis que le passé composé rend le parfait hébreu avec une pertinence présente.
- source_word: יְחַכְּמֶךָּ
  choice: te rendra sage
  rationale: 'Le verbe a ici une valeur causative : rendre sage. Cette formulation suit de près la construction hébraïque.'
theological_decisions:
- issue: Référent du pronom « il »
  choice: Le pronom renvoie au Seigneur, conformément au parallèle grec.
  alternative: Un référent moins déterminé, tel que la sagesse ou la méditation.
  rationale: Dans la seule ligne hébraïque, l’antécédent n’est pas explicite. Toutefois, le parallèle grec mentionne juste avant les prescriptions du Seigneur, puis emploie « lui-même » comme sujet, ce qui appuie fortement ce référent personnel.
- issue: Rapport entre le désir et l’acquisition de la sagesse
  choice: Conserver la formulation hébraïque selon laquelle « ce que tu as désiré » rend sage.
  alternative: 'Suivre le grec : le désir de sagesse sera accordé.'
  rationale: Le témoin hébreu, donné ici avec une confiance élevée, présente une syntaxe et une idée différentes du grec. La traduction principale suit donc l’hébreu sans harmonisation, et la note signale la variante grecque.
translation_notes:
  register: Français moderne, digne et direct. Le tutoiement correspond à l’adresse masculine singulière de l’hébreu. La formulation conserve l’image biblique du cœur comme siège de l’intelligence et maintient l’écart réel entre les témoins hébreu et grec.
