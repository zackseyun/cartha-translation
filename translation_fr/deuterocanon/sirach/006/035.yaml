  text: See who has understanding[a], and seek him out[b]; and let your foot wear out his threshold.
translation:
  language: fr
  text: Vois qui a du discernement[a] et cherche-le ; que ton pied use son seuil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle dit : « Désire écouter tout discours divin, et que les proverbes de discernement ne t’échappent pas. » Les témoins hébreu et grec diffèrent sensiblement ici, bien que tous deux exhortent à rechercher ardemment la sagesse.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement, « que ton pied use son seuil » : image de quelqu’un qui fréquente assidûment la maison d’une personne sage afin d’apprendre auprès d’elle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Regarde
  rationale: L’impératif invite à repérer et à discerner la personne sage ; « Regarde » en conserve la force directe.
- source_word: מִי יָבִין
  choice: qui a de l’intelligence
  rationale: La formule désigne une personne caractérisée par la compréhension et le discernement, sans réduire le sens à une capacité ponctuelle.
- source_word: וְשַׁחֲרֵהוּ
  choice: et recherche-le
  rationale: Le verbe exprime ici une recherche empressée ou assidue. « Recherche-le » rend cette démarche active dans un français naturel et digne.
- source_word: וְתִשְׁחוֹק
  choice: que ton pied use
  rationale: Dans cette construction difficile, le verbe évoque l’usure causée par des visites répétées ; la traduction garde l’image concrète de la persévérance.
- source_word: בְּסִפּוֹ
  choice: le seuil de sa porte
  rationale: סַף désigne le seuil. L’ajout idiomatique « de sa porte » clarifie en français qu’il s’agit de fréquenter la maison du sage, sans modifier l’image.
- source_word: רַגְלְךָ
  choice: ton pied
  rationale: Le singulier hébreu est conservé et reste naturel dans cette image proverbiale.
theological_decisions:
- issue: Choix du témoin hébreu malgré une divergence majeure avec le grec
  choice: Traduire le texte hébreu conservé comme texte principal et signaler intégralement le parallèle grec en note.
  alternative: 'Suivre le grec : « Désire écouter tout discours divin, et que les proverbes pleins d’intelligence ne t’échappent pas. »'
  rationale: L’hébreu est intelligible et présente une exhortation cohérente à rechercher assidûment une personne avisée. Le grec exprime une exhortation apparentée à poursuivre la sagesse, mais avec une formulation substantiellement différente ; la note préserve cette divergence sans la résoudre artificiellement.
translation_notes:
  register: Français international moderne, direct et proverbial. Le tutoiement singulier correspond aux formes hébraïques. La tournure « le seuil de sa porte » conserve l’image ancienne tout en la rendant immédiatement compréhensible.
