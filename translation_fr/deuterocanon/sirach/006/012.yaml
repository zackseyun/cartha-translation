  text: If trouble overtakes you[a], he will turn against you and hide himself from you.
translation:
  language: fr
  text: Si le malheur te rattrape[a], il se retournera contre toi et se cachera de toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Si tu es abaissé, il sera contre toi et se cachera de toi », au lieu de l’hébreu : « Si le malheur te rattrape, il se retournera contre toi et se cachera de toi ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם תַּשִּׂיגְךָ רָעָה
  choice: Si le malheur te rattrape
  rationale: La proposition conditionnelle est conservée. תַּשִּׂיגְךָ exprime l’idée d’atteindre ou de rattraper, tandis que רָעָה désigne ici l’adversité ou le malheur plutôt que le mal moral.
- source_word: יֵהָפֵךְ בְּךָ
  choice: il se retournera contre toi
  rationale: Cette formulation naturelle rend le renversement d’attitude hostile du faux ami envers la personne éprouvée.
- source_word: וּמִפָּנֶיךָ יִסָּתֵר
  choice: et se cachera loin de toi
  rationale: Le verbe exprime le fait de se dissimuler ou de se soustraire, et מִפָּנֶיךָ indique qu’il évitera la présence de l’autre. « Loin de toi » est idiomatique en français tout en conservant l’idée d’éloignement relationnel.
- source_word: ἐὰν ταπεινωθῇς
  choice: si tu es abaissé
  rationale: Le parallèle grec présente une condition différente, « si tu es abaissé » ou « réduit à une humble condition »; cette variante importante est signalée en note plutôt qu’intégrée au texte principal hébreu.
theological_decisions:
- issue: Divergence entre le texte hébreu conservé et le parallèle grec
  choice: Suivre dans le texte principal l’hébreu « Si le malheur te rattrape »
  alternative: 'Le grec porte : « Si tu es abaissé »'
  rationale: Le témoin hébreu, ici disponible avec une confiance élevée, sert de texte principal. La divergence grecque modifie la condition initiale et doit donc être préservée explicitement sans harmonisation.
translation_notes:
  register: Français moderne, direct et digne; tutoiement cohérent avec les formes hébraïques de deuxième personne du singulier. La formulation conserve l’image vive du malheur qui rattrape quelqu’un ainsi que la défection volontaire du faux ami.
