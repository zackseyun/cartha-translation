  text: Let those at peace with you be many[a], but your confidant one out of a thousand.
translation:
  language: fr
  text: Que ceux qui sont en paix avec toi soient nombreux, mais n’aie qu’un seul confident sur mille.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit « tes conseillers » (οἱ δὲ σύμβουλοί σου), tandis que l’hébreu parle littéralement de « celui qui possède ton secret/ton conseil intime », d’où « confident ».
    reason: alternative_reading
lexical_decisions:
- source_word: אַנְשֵׁי שְׁלוֹמְךָ
  choice: ceux qui vivent en paix avec toi
  rationale: L’expression signifie littéralement « les gens de ta paix » et désigne ceux qui entretiennent avec quelqu’un des relations paisibles ou amicales. Cette formulation conserve l’image de la paix et concorde avec le grec οἱ εἰρηνεύοντές σοι.
- source_word: יִהְיוּ רַבִּים
  choice: soient nombreux
  rationale: Le mode verbal a ici une valeur d’exhortation ou de souhait. « Soient nombreux » la rend de façon concise et digne.
- source_word: וּבַעַל סוֹדְךָ
  choice: ne confie tes secrets qu’à une personne
  rationale: Littéralement, l’expression évoque « celui qui possède ton secret » ou qui est admis dans ton conseil intime. La tournure française exprime naturellement l’accès très sélectif aux confidences, tout en conservant la nuance de secret du texte hébreu.
- source_word: אֶחַד מֵאָלֶף
  choice: une personne sur mille
  rationale: Cette expression idiomatique souligne l’extrême rareté de la personne digne d’une telle confiance.
theological_decisions:
- issue: Choix du témoin principal dans un verset où l’hébreu et le grec présentent une différence notable
  choice: Suivre prioritairement l’hébreu et préserver dans le texte la nuance intime de סוד, « secret/conseil confidentiel ».
  alternative: Suivre plus directement le grec et traduire « mais n’aie qu’un conseiller sur mille ».
  rationale: Les deux témoins opposent de nombreuses relations paisibles à un cercle de confiance extrêmement restreint. L’hébreu conservé est toutefois explicite sur le secret ou le conseil intime, tandis que le grec parle de conseillers; la traduction principale maintient donc la nuance hébraïque et signale la variante grecque.
translation_notes:
  register: Français international moderne, naturel et digne. L’impératif négatif idiomatique explicite le conseil pratique implicite sans réduire la distinction entre relations paisibles et confiance intime.
