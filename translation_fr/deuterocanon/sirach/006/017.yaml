  text: For as he is[a], so is his friend, and as his name, so are his deeds.
translation:
  language: fr
  text: Car tel il est, tel est son ami ; et tel est son nom, tels sont ses actes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Celui qui craint le Seigneur dirige bien son amitié, car tel il est, tel aussi est son prochain. » Le témoin hébreu diffère sensiblement dans le premier membre de la phrase.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָמוֹהוּ
  choice: tel il est
  rationale: La tournure comparative signifie « comme il est / tel il est ». La formulation française conserve le parallélisme bref et proverbial de l’hébreu.
- source_word: רֵעֵהוּ
  choice: son ami
  rationale: רֵעַ peut désigner un ami, un compagnon ou un prochain. Le contexte immédiat porte sur l’amitié ; « ami » convient donc le mieux.
- source_word: כִּשְׁמוֹ
  choice: tel est son nom
  rationale: L’hébreu dit littéralement « comme son nom ». « Tel est son nom » garde l’image du nom sans l’expliciter en « réputation ».
- source_word: מַעֲשָׂיו
  choice: ses actes
  rationale: Le terme désigne les actions ou les œuvres. « Actes » est naturel en français moderne et conserve la portée morale de la maxime.
theological_decisions:
- issue: Choix entre le témoin hébreu et la tradition grecque, qui divergent fortement
  choice: Traduire le témoin hébreu dans le texte principal et signaler la leçon grecque en note.
  alternative: « Celui qui craint le Seigneur dirige bien son amitié, car tel il est, tel aussi est son prochain. »
  rationale: L’hébreu conservé a priorité pour le texte principal. Toutefois, puisque le grec présente un premier membre substantiellement différent, la note préserve cette variante sans harmoniser les traditions.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le balancement « tel… tel… » reproduit le parallélisme hébreu tout en restant naturel et intelligible.
