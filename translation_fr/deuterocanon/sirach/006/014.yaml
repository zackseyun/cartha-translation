  naturalness: « Refuge puissant » est compréhensible, mais « solide refuge » est une collocation plus idiomatique et plus naturelle en français moderne, tout en gardant la force de κραταιά. La construction « qui en trouve un » est fluide et convient au registre proverbial.
  terminology: « Ami fidèle », « solide refuge » et « trésor » sont exacts, sobres et adaptés. La note conserve la distinction nécessaire entre le texte hébreu transmis et le témoignage grec, sans surinterprétation doctrinale.
