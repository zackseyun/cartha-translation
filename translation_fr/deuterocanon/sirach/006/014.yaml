  text: A faithful friend is a strong refuge[a], and whoever finds one has found a treasure.
translation:
  language: fr
  text: Un ami fidèle est un solide refuge[a] ; qui en trouve un a trouvé un trésor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu conservé est difficile et diffère sensiblement du texte grec. Plus littéralement, il pourrait se comprendre ainsi : « Un ami de la fidélité [est/aime] la force, et celui qui le trouve a trouvé la richesse » ; le référent du pronom est incertain. Le texte principal suit le sens plus clair du grec : « Un ami fidèle est un solide refuge. »'
    reason: textual_variant
lexical_decisions:
- source_word: אוֹהֵב אֱמוּנָה
  choice: un ami fidèle
  rationale: L’hébreu transmis est difficile (« celui qui aime la fidélité » ou formulation voisine), tandis que le grec φίλος πιστός atteste clairement « ami fidèle ». Cette lecture donne une maxime cohérente avec le second membre.
- source_word: תְּקוֹף
  choice: un refuge puissant
  rationale: Pris isolément, l’hébreu évoque la force, mais le grec σκέπη κραταιά précise l’image d’un abri protecteur et solide. « Refuge puissant » conserve à la fois la métaphore et l’idée de force.
- source_word: וּמוֹצְאוֹ
  choice: qui en trouve un
  rationale: Le suffixe hébreu singulier renvoie au personnage évoqué. La tournure française avec « en… un » reprend naturellement « un ami fidèle » sans alourdir la phrase.
- source_word: הוֹן
  choice: un trésor
  rationale: הוֹן signifie richesse ou biens ; le grec θησαυρόν porte explicitement le sens de « trésor ». Ce choix convient à la métaphore proverbiale et à la valeur incomparable de l’ami fidèle.
theological_decisions:
- issue: Choix du témoin lorsque l’hébreu transmis et le grec divergent fortement
  choice: 'Suivre dans le texte principal la lecture cohérente attestée par le grec : « Un ami fidèle est un refuge puissant »'
  alternative: « Celui qui aime la fidélité aime la force » ou « Un ami de la fidélité est force »
  rationale: L’hébreu conservé est syntaxiquement et sémantiquement difficile, alors que le grec présente une maxime claire qui s’accorde directement avec la mention de celui qui trouve cet ami. L’incertitude textuelle et la lecture hébraïque plus littérale sont signalées en note plutôt que dissimulées.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Refuge puissant » maintient une dignité littéraire accessible et reflète le caractère protecteur de l’image grecque. Le point-virgule met en valeur les deux membres parallèles de la maxime.
