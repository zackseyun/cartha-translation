translation:
  language: fr
  text: Écoute, mon fils[b], accepte mon avis[c] et ne refuse pas mon conseil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La ligne hébraïque conservée et fournie ici paraît déplacée ou ne pas correspondre à ce verset; la traduction suit donc le parallèle grec : « Écoute, mon enfant, reçois mon avis et ne refuse pas mon conseil. »'
    reason: textual_variant
  - marker: b
    text: Ou « mon enfant ». Le grec τέκνον a un sens plus large, mais « mon fils » reflète l’adresse pédagogique traditionnelle à un disciple.
    reason: lexical_alternative
  - marker: c
    text: Ou « mon jugement » ou « ma pensée ». Le grec γνώμη peut désigner un avis, un jugement ou une pensée réfléchie.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄκουσον
  choice: Écoute
  rationale: L’impératif grec appelle une écoute attentive; « Écoute » est naturel et direct en français moderne.
- source_word: τέκνον
  choice: mon fils
  rationale: Le terme signifie largement « enfant », mais, dans cette formule d’enseignement sapientiel adressée à un disciple au singulier, « mon fils » rend avec exactitude l’idiome pédagogique.
- source_word: δέξαι
  choice: accueille
  rationale: « Accueille » exprime une réception volontaire et favorable, au-delà du simple fait de recevoir.
- source_word: γνώμην
  choice: avis
  rationale: Le mot peut désigner une opinion réfléchie, un jugement ou une pensée directrice. « Avis » convient au parallélisme avec « conseil » sans suggérer ici une sentence judiciaire.
- source_word: ἀπαναίνου
  choice: rejette
  rationale: Le verbe signifie refuser ou décliner; « rejette » conserve la force de l’impératif négatif.
- source_word: συμβουλίαν
  choice: conseil
  rationale: « Conseil » garde le registre sapientiel tout en restant courant et clair.
theological_decisions:
- issue: Choix du témoin source lorsque la ligne hébraïque fournie ne correspond pas au verset
  choice: Traduire le parallèle grec comme témoin opératoire et signaler explicitement le problème textuel.
  alternative: Traduire la ligne hébraïque fournie comme si elle appartenait à Siracide 6.23.
  rationale: La ligne hébraïque évoque le vase du potier, la fournaise et l’évaluation d’un homme; elle ne correspond ni au grec ni au contexte de Siracide 6.23 et semble déplacée ou corrompue. Le grec donne ici une leçon cohérente, sans enjeu doctrinal à harmoniser.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond à l’adresse personnelle du maître au disciple. Les termes « avis » et « conseil » conservent la proximité sémantique du grec sans alourdir la phrase.
