  text: It will consume your leaves and uproot your fruit[b][a], and leave you like a dry tree.
translation:
  language: fr
  text: Elle dévorera tes feuilles[a] et détruira tes fruits[b], puis te laissera comme un arbre desséché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu est difficile en plusieurs endroits dans ce verset; le grec parallèle appuie la lecture «tes feuilles» ainsi qu’un sort destructeur pour les fruits.
    reason: textual_variant
  - marker: b
    text: 'Littéralement, selon une interprétation possible de l’hébreu: «déracinera tes fruits». Le verbe hébreu est incertain; le grec porte «détruira» ou «fera périr».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלֶיךָ
  choice: tes feuilles
  rationale: La forme hébraïque est difficile; le parallèle grec τὰ φύλλα σου confirme nettement «tes feuilles» et établit le parallélisme avec «tes fruits».
- source_word: תֹּאכַל
  choice: elle dévorera
  rationale: Le verbe signifie littéralement «manger» et, dans cette image de destruction, «dévorer» rend naturellement sa force. Le féminin renvoie au sujet du contexte précédent.
- source_word: וּפֶרְיְךָ תְּשָׁרֵשׁ
  choice: et détruira tes fruits
  rationale: «Tes fruits» maintient l'image de l'arbre. Le verbe hébreu est incertain; le grec ἀπολέσεις appuie un résultat destructeur. «Détruira» évite l'image peu naturelle de fruits déracinés en français.
- source_word: וְהִנִיחַתְךָ
  choice: puis te laissera
  rationale: Dans ce contexte, la forme causative exprime le fait de laisser quelqu'un dans un état; le grec confirme ce sens général, malgré une différence de voix.
- source_word: כְּעֵץ יָבֵשׁ
  choice: comme un arbre desséché
  rationale: La comparaison est directe. «Desséché» est un équivalent français naturel de יָבֵשׁ tout en conservant l'image frappante de l'arbre privé de vie.
theological_decisions:
- issue: Rapport entre l'hébreu difficile et le parallèle grec
  choice: Prendre l'hébreu comme témoin principal et employer le grec pour éclairer les formes obscures.
  alternative: Traduire littéralement l'hébreu isolé («sur toi elle mangera…») ou suivre entièrement la syntaxe grecque («tu te laisseras toi-même…»).
  rationale: Le texte hébreu préserve le fond de l'image, mais plusieurs formes sont difficiles. Le grec atteste clairement la suite «feuilles, fruits, arbre sec» et permet une traduction française cohérente sans lui accorder automatiquement la priorité.
translation_notes:
  register: Français international moderne, digne et accessible. «Dévorera» conserve la vigueur de la métaphore; «arbre desséché» est plus idiomatique que «arbre sec». Les deux appels de note figurent dans le texte et suivent l’ordre alphabétique.
