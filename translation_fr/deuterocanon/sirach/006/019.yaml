base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/019.yaml
  text: Draw near to her like one who plows and reaps[a], and wait for her abundant produce. For in her service you will labor only a little[b], and before long you will eat her fruit.
translation:
  language: fr
  text: Approche-toi d’elle comme celui qui laboure et moissonne[a], et attends l’abondance de sa récolte. Car à son service tu ne travailleras que peu, et demain[b] tu mangeras de son fruit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « comme celui qui laboure et sème », au lieu de « laboure et moissonne ».'
    reason: textual_variant
  - marker: b
    text: 'L’hébreu dit littéralement « demain »; l’expression peut ici signifier « bientôt » ou « sous peu », comme le suggère aussi le grec : « rapidement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּחוֹרֵשׁ וּכְקוֹצֵר
  choice: comme celui qui laboure et moissonne
  rationale: La formulation conserve les deux participes agricoles du texte hébreu et leur progression condensée. « Moissonne » suit le témoin hébreu, tandis que la variante grecque est signalée en note.
- source_word: קְרַב אֵלֶיהָ
  choice: Approche-toi d’elle
  rationale: L’impératif exprime un mouvement vers la sagesse personnifiée. Cette tournure est naturelle en français moderne et maintient le pronom féminin.
- source_word: וְקַוֵּה
  choice: attends
  rationale: Le verbe associe attente et espérance. Dans l’image agricole, « attends » rend clairement la patience confiante exigée avant la récolte.
- source_word: לְרֹב תְּבוּאָתָהּ
  choice: l’abondance de sa récolte
  rationale: רֹב indique l’abondance et תְּבוּאָה le produit ou rendement des cultures. « Récolte » prolonge naturellement l’image agricole.
- source_word: בַעֲבֹדָתָהּ
  choice: à son service
  rationale: עֲבֹדָה peut désigner le travail ou le service. Avec la sagesse personnifiée, « à son service » conserve à la fois l’effort et la relation à celle que l’on sert.
- source_word: מְעַט תַּעֲבוֹד
  choice: tu ne travailleras que peu
  rationale: Cette formulation française exprime la faible quantité de travail annoncée sans ajouter l’idée étrangère d’un effort facile.
- source_word: וּלְמָחָר
  choice: dès demain
  rationale: Le texte hébreu dit littéralement « demain ». Le maintien de cette image temporelle vive préserve le texte source; la note indique le sens possible de proximité temporelle, confirmé par le grec.
- source_word: פִּרְיָהּ
  choice: de son fruit
  rationale: Le singulier « fruit » suit l’hébreu et conserve la métaphore ainsi que la personnification féminine de la sagesse.
theological_decisions:
- issue: Personnification féminine de la sagesse
  choice: Employer les formes féminines « elle » et « son/sa »
  alternative: Traiter la sagesse comme une abstraction sans personnification marquée
  rationale: Le contexte hébreu présente la sagesse comme une femme. La traduction conserve ce trait littéraire et théologique sans l’interpréter davantage.
- issue: Divergence entre l’hébreu et le grec dans l’image agricole
  choice: Suivre dans le texte principal l’hébreu « laboure et moissonne »
  alternative: Suivre le grec « laboure et sème »
  rationale: Le texte hébreu conservé est ici la source principale. La leçon grecque est néanmoins substantielle et mérite d’être préservée en note plutôt que d’être harmonisée silencieusement.
- issue: Valeur temporelle de וּלְמָחָר
  choice: Conserver le sens littéral « dès demain » dans le texte
  alternative: Rendre idiomatiquement par « bientôt » ou « sous peu »
  rationale: Le littéral est intelligible et garde la force proverbiale de la promesse. La possibilité d’un emploi idiomatique signifiant « bientôt » est explicitée en note, avec l’appui du grec.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve l’exhortation sapientielle et l’image agricole, sans archaïsmes. « Dès demain » maintient la formulation hébraïque tout en restant idiomatique; la note en préserve l’ambiguïté temporelle.
