  text: If you desire it[a], my son, you will become wise; and if you set your heart on it[b], you will become shrewd.
translation:
  language: fr
  text: Si tu le désires[a], mon fils, tu deviendras sage ; et si tu y appliques ton cœur[b], tu deviendras avisé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Si tu le veux, mon enfant, tu seras instruit ; et si tu y consacres ton âme, tu deviendras plein de ressources. » L’hébreu et le grec concordent sur le sens général, mais le grec met en avant l’instruction là où l’hébreu dit « devenir sage ».'
    reason: alternative_reading
  - marker: b
    text: « Appliquer son cœur » est une expression hébraïque qui désigne une attention volontaire et un engagement résolu.
    reason: cultural_note
lexical_decisions:
- source_word: אִם תַּחְפּוֹץ
  choice: Si tu le désires
  rationale: 'Le verbe חפץ exprime ici le désir ou la volonté résolue. Le pronom « le » explicite en français l’objet sous-entendu dans le contexte : l’acquisition de la sagesse.'
- source_word: בְּנִי
  choice: mon fils
  rationale: L’hébreu emploie explicitement le nom masculin singulier « fils » dans une adresse directe.
- source_word: תִּתְחַכָּם
  choice: tu deviendras sage
  rationale: La forme verbale de חכם évoque l’entrée ou la progression dans l’état de sagesse, plutôt que la simple possession d’un savoir.
- source_word: וְאִם תָּשִׂים לִבְּךָ
  choice: et si tu y appliques ton cœur
  rationale: L’expression hébraïque signifie orienter volontairement son attention intérieure et son engagement vers un objet. « Y appliquer ton cœur » conserve l’image biblique tout en restant intelligible en français.
- source_word: תַּעֲרֹם
  choice: tu deviendras avisé
  rationale: Dans ce contexte sapientiel positif, ערם désigne la prudence, le discernement pratique ou une forme de perspicacité, sans la connotation négative de la ruse.
