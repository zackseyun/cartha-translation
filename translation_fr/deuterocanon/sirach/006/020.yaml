  text: It is difficult for a fool[b][a], and one lacking sense will not endure it.
translation:
  language: fr
  text: Elle est difficile[a] pour l’insensé, et celui qui manque de discernement[b] ne la supportera pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « rude » ou « ardue ». Le parallèle grec dit : « elle est très rude pour les gens sans instruction ».'
    reason: lexical_alternative
  - marker: b
    text: Littéralement « qui manque de cœur »; en hébreu, le cœur peut désigner le siège de l’intelligence et du jugement.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲקֻבָּה
  choice: difficile
  rationale: Le terme hébreu inhabituel peut évoquer ce qui est tortueux, rude ou difficile à affronter. « Difficile » exprime naturellement le sens contextuel sans ajouter l’intensif absent de l’hébreu; le parallèle grec confirme cette compréhension.
- source_word: לָאֱוִיל
  choice: pour l’insensé
  rationale: אֱוִיל est un terme sapiential qui désigne une personne moralement et intellectuellement obtuse, non une personne simplement peu intelligente. « L’insensé » est la formulation française traditionnelle et intelligible dans ce registre.
- source_word: וְלֹא יְכַלְכְּלֶנָּה
  choice: ne la supportera pas
  rationale: Le verbe כלכל peut signifier soutenir, contenir, porter ou endurer. Ici, son objet féminin renvoie à la sagesse; « ne la supportera pas » conserve l’idée de ne pouvoir la porter ou persévérer avec elle, que le grec explicite par « ne demeurera pas en elle ».
- source_word: חֲסַר לֵב
  choice: celui qui manque de discernement
  rationale: L’expression signifie littéralement « dépourvu de cœur », le cœur étant en hébreu le siège de l’intelligence et du jugement. « Manque de discernement » restitue l’idiome sans suggérer un manque de compassion ou de courage.
- source_word: ἐμμενεῖ ἐν αὐτῇ
  choice: ne la supportera pas
  rationale: Le parallèle grec, littéralement « ne demeurera pas en elle », met en relief l’incapacité à persévérer dans la sagesse et appuie le sens contextuel donné au verbe hébreu.
theological_decisions:
- issue: Référence genrée à la sagesse et portée générale de la caractérisation
  choice: Employer le pronom féminin « la » pour reprendre la sagesse, nom féminin en français, et « celui qui » au sens générique.
  alternative: « Une personne dépourvue de discernement ne pourra persévérer en elle. »
  rationale: Le suffixe objet hébreu est féminin et renvoie à la sagesse. Le masculin grammatical de חֲסַר לֵב décrit un type humain dans la littérature sapientiale sans limiter nécessairement l’énoncé aux hommes. La formulation retenue reste naturelle et fidèle au caractère proverbial du verset.
translation_notes:
  register: Français international moderne, sobre et sapiential. La syntaxe parallèle de l’hébreu est conservée. L’intensif « très », présent dans le grec mais non exprimé dans le texte hébreu, n’est pas introduit dans le corps du verset.
