  text: It will be upon him like a heavy stone[a], and he will not delay to throw it off.
translation:
  language: fr
  text: Elle pèsera sur lui comme une lourde pierre[a], et il ne tardera pas à la rejeter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « comme une pierre de fardeau » ; le grec parallèle porte « comme une forte pierre d’épreuve », ajoutant explicitement l’idée de mise à l’épreuve.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּאֶבֶן מַשָּׂא
  choice: comme une lourde pierre
  rationale: La préposition כְּ marque la comparaison, tandis que מַשָּׂא évoque une charge ou un fardeau. « Lourde pierre » rend naturellement en français l’image hébraïque d’une « pierre de fardeau ».
- source_word: תִּהְיֶה עָלָיו
  choice: elle pèsera sur lui
  rationale: Le tour idiomatique français explicite l’effet de la pierre posée sur quelqu’un tout en conservant l’image de son poids. Le féminin « elle » peut aussi renvoyer à la sagesse dans le contexte.
- source_word: וְלֹא יְאַחֵר
  choice: il ne tardera pas
  rationale: Le hifil de אחר signifie ici tarder ou différer. Cette formulation directe s’enchaîne naturellement avec l’infinitif.
- source_word: לְהַשְׁלִיכָה
  choice: à la rejeter
  rationale: Le verbe signifie jeter ou rejeter. Le suffixe féminin est conservé par « la », qui peut viser la sagesse évoquée dans le contexte tout en prolongeant l’image de la pierre.
- source_word: λίθος δοκιμασίας ἰσχυρός
  choice: pierre qui met à l’épreuve (en note)
  rationale: Le grec ajoute explicitement l’idée d’épreuve et de force. Comme cette nuance ne figure pas clairement dans l’hébreu conservé, elle est signalée en note plutôt qu’intégrée silencieusement au texte principal.
theological_decisions:
- issue: Relation entre le texte hébreu et la nuance supplémentaire du parallèle grec
  choice: Traduire dans le texte principal l’image hébraïque du poids et signaler en note la notion grecque d’épreuve
  alternative: 'Intégrer les deux témoins dans le texte principal : « comme une lourde pierre d’épreuve »'
  rationale: L’hébreu extant est le témoin principal et dit littéralement « comme une pierre de fardeau ». Le grec présente une nuance réelle, « pierre d’épreuve, forte », qui mérite d’être conservée sans être attribuée directement à l’hébreu.
- issue: Référent du suffixe féminin dans « la rejeter »
  choice: Maintenir le pronom féminin, laissant ouvert le lien entre la pierre imagée et la sagesse du contexte
  alternative: Employer « s’en débarrasser », qui neutraliserait le genre et préciserait davantage l’idée de fardeau
  rationale: Le suffixe hébreu et le pronom grec sont féminins. Le français permet de préserver cette continuité et l’ambiguïté littéraire sans imposer un seul antécédent.
translation_notes:
  register: Français international moderne, simple et digne. « Pèsera sur lui » rend l’image concrète plus naturellement que « sera sur lui », tandis que « rejeter » conserve le mouvement du verbe hébreu et le pronom féminin.
