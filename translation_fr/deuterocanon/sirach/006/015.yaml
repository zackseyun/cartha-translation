translation:
  language: fr
  text: Un ami fidèle[a] n’a pas de prix, et sa bonté ne se mesure pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « celui qui aime la fidélité » ; le grec porte : « un ami fidèle ».'
    reason: alternative_reading
  - marker: b
    text: 'L’hébreu emploie un terme qui peut désigner sa bonté ou le bienfait qu’il procure ; le grec porte : « sa beauté », éventuellement au sens de « noblesse » ou d’« excellence ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאוֹהֵב אֱמוּנָה
  choice: un ami fidèle
  rationale: L’hébreu transmis signifie littéralement « celui qui aime la fidélité », formulation difficile que le contexte sur l’amitié et le parallèle grec φίλου πιστοῦ éclairent comme désignant un ami caractérisé par sa fidélité.
- source_word: אֵין מְחִיר
  choice: n’a pas de prix
  rationale: מְחִיר désigne le prix ou la valeur d’échange. L’expression française naturelle « n’a pas de prix » exprime qu’un tel ami dépasse toute estimation.
- source_word: מִשְׁקָל
  choice: sans mesure
  rationale: Le terme évoque le poids ou l’action de peser. « Sans mesure » conserve l’image d’une valeur qu’on ne peut évaluer tout en restant idiomatique en français.
- source_word: לְטוֹבָתוֹ
  choice: sa valeur
  rationale: Le mot hébreu peut désigner sa bonté, son bienfait ou son excellence. Dans ce contexte d’évaluation, « sa valeur » rend clairement le sens sans adopter la variante grecque « beauté ».
