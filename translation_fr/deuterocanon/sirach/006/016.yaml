  text: A faithful friend is a bundle of life[b][a], and one who fears the Lord will attain him.
translation:
  language: fr
  text: Un ami fidèle est un faisceau de vie[a] ; celui qui craint le Seigneur le trouvera[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « un faisceau de vie, qui aime la fidélité ». Le grec parallèle porte : « un ami fidèle est un remède de vie ».'
    reason: alternative_reading
  - marker: b
    text: 'La fin du verset est difficile dans l’hébreu conservé : l’objet de « craint » n’y est pas exprimé, et la forme du dernier verbe signifie plus directement « les atteindra », avec un objet pluriel difficile à expliquer. Le grec parallèle lit : « ceux qui craignent le Seigneur le trouveront ».'
    reason: textual_variant
lexical_decisions:
- source_word: צְרוֹר חַיִּים
  choice: une réserve de vie
  rationale: L’expression hébraïque désigne littéralement un paquet ou faisceau de vie, image de quelque chose de précieux que l’on garde auprès de soi. « Réserve de vie » conserve l’idée de vie préservée et disponible sans produire en français l’expression peu naturelle « paquet de vie ». Le grec parallèle, « remède de vie », confirme la valeur bienfaisante de l’image.
- source_word: אוֹהֵב אֱמוּנָה
  choice: un ami fidèle
  rationale: 'L’hébreu transmis est condensé : littéralement, « qui aime la fidélité » ou « ami de la fidélité ». Dans le contexte, le grec φίλος πιστός confirme qu’il s’agit d’un ami caractérisé par sa fidélité.'
- source_word: יְרֵא
  choice: celui qui craint
  rationale: Le participe hébreu exprime une maxime générale. Cette tournure est naturelle en français et garde le sens religieux de la crainte révérencielle.
- source_word: יַשִּׂיגֵם
  choice: le trouvera
  rationale: La forme hébraïque peut évoquer le fait d’atteindre ou de rejoindre, mais son objet pluriel est difficile à expliquer ici. Le grec εὑρήσουσιν αὐτόν, « ils le trouveront », fournit une lecture cohérente dont le référent singulier est l’ami fidèle.
- source_word: Κύριον
  choice: le Seigneur
  rationale: Le texte grec parallèle précise l’objet de la crainte, absent de l’hébreu conservé. « Le Seigneur » est la formulation française naturelle correspondante.
theological_decisions:
- issue: Objet de la crainte dans la dernière proposition
  choice: celui qui craint le Seigneur
  alternative: celui qui craint
  rationale: L’hébreu conservé ne donne pas explicitement l’objet du verbe, tandis que le grec lit « ceux qui craignent le Seigneur ». Cette précision est signalée comme relevant du témoin grec et n’introduit pas une interprétation confessionnelle particulière.
- issue: Référent et sens du dernier verbe
  choice: le trouvera
  alternative: les atteindra / l’atteindra
  rationale: La finale hébraïque est textuellement difficile, notamment quant au nombre de l’objet. La lecture grecque donne un référent singulier clair, l’ami fidèle, tout en maintenant le lien entre la crainte du Seigneur et la découverte d’un tel ami.
translation_notes:
  register: Français international moderne, sobre et sapientiel. « Réserve de vie » évite un calque opaque tout en gardant l’image hébraïque d’une vie précieusement conservée. Le point-virgule marque les deux membres de la maxime.
