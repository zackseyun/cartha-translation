  text: For a fierce soul destroys its owner[a], and the rejoicing of an enemy overtakes him.
translation:
  language: fr
  text: Car une âme violente détruit celui qui la possède et fait de lui la joie de ses ennemis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, l’hébreu conservé porte : « et la joie d’un ennemi les atteindra ». La forme finale, au pluriel, s’accorde difficilement avec le contexte. Le grec a : « et elle fera de lui la joie de ses ennemis »; le texte principal suit ici ce sens.'
    reason: textual_variant
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: âme
  rationale: Le terme peut désigner l’âme, la personne ou le moi intérieur. Ici, il évoque la disposition intérieure de la personne; « âme » conserve aussi la correspondance avec le grec ψυχή.
- source_word: עַזָּה
  choice: violente
  rationale: L’adjectif exprime la force ou l’intensité et prend ici une valeur morale négative. « Violente » rend cette disposition excessive et destructrice sans adopter directement le grec πονηρά, « mauvaise ».
- source_word: תַּשְׁחִית
  choice: détruit
  rationale: Le verbe שחת peut signifier détruire, ruiner ou corrompre. « Détruit » restitue la gravité de cette conséquence autodestructrice.
- source_word: בְּעָלֶיהָ
  choice: celui qui la possède
  rationale: בעל désigne ici le possesseur. Cette formulation française est plus naturelle que « son propriétaire » pour parler de l’âme d’une personne et concorde avec le grec κτησάμενον.
- source_word: וְשִׂמְחַת שׂוֹנֵא
  choice: la joie de ses ennemis
  rationale: שמחה désigne la joie ou l’allégresse. Avec les ennemis, l’expression signifie que la personne devient pour eux un motif de réjouissance; le pluriel naturel en français est appuyé par le grec ἐχθρῶν.
- source_word: תַּשִּׂיגֵם
  choice: fait de lui
  rationale: Le texte hébreu conservé signifie normalement « les atteindra » et présente une difficulté de nombre et de sens. Le grec ποιήσει αὐτόν, « fera de lui », fournit une phrase cohérente et guide ici la traduction.
theological_decisions:
- issue: Rapport entre l’hébreu difficile et le parallèle grec dans la dernière proposition
  choice: 'Suivre le sens attesté par le grec : « fait de lui la joie de ses ennemis »'
  alternative: « et la joie d’un ennemi les atteindra » ou « et la joie de l’ennemi l’atteindra »
  rationale: L’hébreu demeure prioritaire dans la première proposition, mais sa forme finale תַּשִּׂיגֵם comporte un complément pluriel sans antécédent clair et produit une construction obscure. Le grec transmet un sens cohérent, selon lequel cette disposition livre la personne à la joie de ses ennemis. La note signale explicitement l’écart au lieu de masquer l’incertitude textuelle.
translation_notes:
  register: Français international moderne, sobre et sapientiel. « Âme violente » conserve l’image anthropologique de l’hébreu, tandis que « celui qui la possède » évite la tournure peu naturelle « son propriétaire ». La ponctuation resserre les deux conséquences en une seule sentence.
