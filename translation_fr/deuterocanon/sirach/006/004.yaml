  source_fidelity: 'La première proposition rend fidèlement l’hébreu : נפש עזה est bien une disposition intérieure énergique et moralement dangereuse, et « détruit celui qui la possède » exprime naturellement תשחית בבעליה. Pour la dernière proposition, le texte principal adopte de manière transparente le sens cohérent du grec (« fait de lui la joie de ses ennemis »), alors que l’hébreu conservé porte littéralement « la joie d’un ennemi les atteindra » et présente une difficulté réelle de nombre et de construction. La note rend compte de cet écart sans le dissimuler.'
