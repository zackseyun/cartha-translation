review_pass:
  verdict: revise
  source_fidelity: Le sens général et la succession des impératifs sont bien rendus, ainsi que les suffixes féminins finaux renvoyant à la sagesse. Toutefois, « poursuis-la » suggère plus volontiers la poursuite d’une personne ou d’un objectif que la recherche de בקש. Une formulation avec « cherche » restitue plus directement le verbe hébreu et l’accumulation volontaire des verbes de quête.
  naturalness: Le français est globalement clair et actuel. « Tiens fermement à elle » est moins idiomatique que « Tiens-la fermement ». La répétition de « cherche » est acceptable et même souhaitable ici, car elle reflète la progression rhétorique du texte source.
  terminology: 'La personnification féminine est correctement conservée. La note doit rester précisément alignée sur la divergence : le grec exprime que l’objet « te sera connu », tandis que l’hébreu donne directement « cherche et trouve ».'
