    issue: « poursuis-la » pour בַּקֵּש
    rationale: Le verbe français tend à signifier « courir après » ou « continuer à suivre » et introduit une nuance absente de בקש, qui signifie simplement chercher/rechercher.
  - severity: low
    issue: « Tiens fermement à elle »
    rationale: Cette tournure est compréhensible, mais « Tiens-la fermement » est plus naturel et conserve plus nettement l’image de saisir sans relâcher.
  - severity: low
    issue: Formulation de la note grecque
    rationale: « Elle te sera connue » personnalise l’objet dans une proposition grecque qui dit littéralement qu’il « te sera connu ». Une formulation neutre maintient plus exactement la différence textuelle, sans affecter la personnification du texte principal.
