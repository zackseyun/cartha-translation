  text: Search out and investigate; seek[a], and find. Hold fast to her, and do not let her go.
translation:
  language: fr
  text: Cherche avec soin et examine ; cherche-la et trouve-la[a]. Tiens-la fermement et ne la lâche pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « cherche, et cela te sera connu ». L’hébreu dit plus directement : « cherche et trouve ».'
    reason: alternative_reading
lexical_decisions:
- source_word: דְּרֹש
  choice: Cherche avec soin
  rationale: Le verbe דרש exprime ici une recherche active et appliquée. Cette formulation garde sa force tout en le distinguant du verbe בקש qui suit.
- source_word: וַחֲקֹר
  choice: et examine
  rationale: חקר désigne un examen approfondi. « Examine » rend naturellement en français la progression vers une recherche minutieuse.
- source_word: בַּקֵּש
  choice: poursuis-la
  rationale: בקש signifie chercher ou rechercher. « Poursuis-la » évite une répétition plate et, grâce au pronom féminin fourni par le contexte, exprime une quête persistante de la sagesse.
- source_word: וּמְצָא
  choice: et trouve-la
  rationale: Le texte hébreu présente une suite d’impératifs. L’ajout du pronom reprend explicitement la sagesse, implicite dans cette proposition mais clairement désignée par les suffixes féminins qui suivent.
- source_word: וְהֶחֱזַקְתָּהּ
  choice: Tiens fermement à elle
  rationale: La forme causative de חזק avec suffixe féminin évoque le fait de saisir et de rester fortement attaché à la sagesse. La formulation française conserve cette image d’attachement résolu.
- source_word: וְאַל תַּרְפֶּהָ
  choice: et ne la lâche pas
  rationale: רפה signifie relâcher ou laisser échapper. « Ne la lâche pas » prolonge clairement et naturellement l’image de la prise ferme.
theological_decisions:
- issue: Référent des suffixes féminins
  choice: Employer « la » et « elle », en référence à la sagesse personnifiée.
  alternative: Employer un pronom neutre ou reformuler avec « l’instruction » ou « l’intelligence ».
  rationale: Le contexte immédiat personnifie la sagesse au féminin, et les suffixes hébreux sont féminins. Conserver cette personnification respecte la texture littéraire et théologique sans ajouter d’interprétation confessionnelle.
- issue: Divergence entre l’hébreu et le grec dans la proposition de découverte
  choice: 'Suivre dans le texte principal la suite impérative hébraïque : « poursuis-la et trouve-la ».'
  alternative: 'Suivre le grec : « cherche, et elle te sera connue » ou « et tu la connaîtras ».'
  rationale: Le témoin hébreu est ici disponible et de haute confiance ; il constitue donc la base du texte principal. La divergence réelle du parallèle grec est signalée en note afin de préserver les données textuelles sans les harmoniser.
translation_notes:
  register: 'Français international actuel, digne et accessible. L’accumulation des impératifs est conservée, ainsi que la personnification féminine de la sagesse. Le point-virgule marque les deux mouvements du verset : la recherche, puis l’attachement persévérant.'
