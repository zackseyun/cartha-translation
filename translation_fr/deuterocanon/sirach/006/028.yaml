  text: For in the end you will find its rest[b][a], and it will turn for you into delight.
translation:
  language: fr
  text: Car, par la suite[a], tu trouveras le repos qui est le sien[b], et elle deviendra pour toi un délice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « après » ou « en arrière » ; le grec parallèle porte : « à la fin ». Il s’agit du résultat obtenu avec le temps.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « son repos ». Le suffixe féminin renvoie à la sagesse personnifiée, ou éventuellement à la discipline qui conduit à elle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאָחוֹר
  choice: par la suite
  rationale: 'L’expression hébraïque signifie littéralement « après / en arrière » et prend ici un sens temporel : ce qui vient après. « Par la suite » reste proche de l’hébreu, tandis que le grec parallèle exprime l’idée de « finalement ».'
- source_word: תִּמְצָא
  choice: tu trouveras
  rationale: Rend directement la forme verbale de מצא et conserve l’adresse personnelle au lecteur.
- source_word: מְנוּחָתָהּ
  choice: le repos qu’elle procure
  rationale: Le suffixe féminin renvoie vraisemblablement à la sagesse personnifiée. Cette formulation naturelle exprime le repos trouvé auprès d’elle sans suggérer que la sagesse elle-même se repose.
- source_word: וְתֵהָפֵךְ
  choice: elle se changera
  rationale: Préserve l’image de transformation portée par הפך, plutôt que de l’aplatir en simple état.
- source_word: לְךָ
  choice: pour toi
  rationale: Rend le datif de bénéfice et souligne l’expérience personnelle du destinataire.
- source_word: לְתַעֲנוּג
  choice: en délice
  rationale: תענוג désigne le plaisir ou le délice. « En délice » convient à la construction exprimant un changement et garde un registre digne.
theological_decisions:
- issue: Référent des formes féminines
  choice: Elles renvoient à la sagesse personnifiée dans le contexte immédiat.
  alternative: Elles peuvent viser plus largement la discipline ou la quête de la sagesse.
  rationale: Le contexte de Siracide 6 présente la sagesse sous des traits féminins, et le grec parallèle maintient également le féminin. La note conserve toutefois l’étendue possible du référent.
translation_notes:
  register: Français international moderne, courant et digne. La formulation garde la personnification féminine de la sagesse et l’image hébraïque d’une transformation, tout en explicitant naturellement l’expression ambiguë « son repos ».
