  text: Be eager to hear every discourse[a], and do not let a proverb of understanding escape you.
translation:
  language: fr
  text: Écoute volontiers toute parole[a], et ne laisse échapper aucun proverbe de discernement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente ici un texte très différent : « Tiens-toi parmi les anciens et, si quelqu’un est sage, attache-toi à lui. » Le texte principal suit l’hébreu conservé pour ce verset.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל שִׂיחָה
  choice: toute conversation
  rationale: שִׂיחָה désigne largement la parole échangée ou la conversation. « Toute conversation » reste naturel en français moderne et conserve la portée distributive de כָּל.
- source_word: חֲפוֹץ לִשְׁמֹעַ
  choice: Prends plaisir à écouter
  rationale: חפץ exprime ici le désir ou le plaisir volontaire, tandis que שׁמע implique, dans ce contexte sapientiel, une écoute attentive. Cette formulation garde les deux nuances sans réduire l'exhortation à une simple disposition auditive.
- source_word: וּמְשַׁל
  choice: aucun proverbe
  rationale: Dans la littérature de sagesse, מָשָׁל désigne couramment un proverbe ou une maxime. Avec la négation française, « aucun » rend idiomatiquement l'indéfini implicite.
- source_word: בִּינָה
  choice: plein de discernement
  rationale: La construction hébraïque caractérise le proverbe par בינה. « Plein de discernement » est plus naturel que le calque « de discernement » et préserve l'idée d'une parole porteuse d'intelligence judicieuse.
- source_word: אַל יֵצְאֶךָּ
  choice: ne laisse échapper
  rationale: L'expression évoque ce qui sort de la portée de quelqu'un ou lui échappe. La tournure française transmet naturellement l'avertissement de ne pas manquer une parole avisée.
theological_decisions:
- issue: Divergence majeure entre le témoin hébreu et le parallèle grec
  choice: Le texte principal suit l'hébreu conservé, qui exhorte à écouter toute conversation et à ne laisser échapper aucun proverbe avisé.
  alternative: 'Le grec dit : « Tiens-toi parmi les anciens et, si quelqu’un est sage, attache-toi à lui. »'
  rationale: Puisque l'hébreu est conservé ici avec un degré élevé de confiance, il gouverne la traduction. Le grec témoigne d'une exhortation sapientielle apparentée, mais son contenu distinct ne doit pas être fusionné avec celui de l'hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. « Prends plaisir » garde la force positive de חפץ; « conversation » évite le caractère trop soutenu de « discours »; la note signale clairement l'importante divergence textuelle sans mêler les deux lectures.
