translation:
  language: fr
  text: Il y a un ami, compagnon de table[a], qu’on ne trouvera pas au jour du malheur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « un ami, compagnon de table »; le grec lit « un compagnon de tables ». L’expression évoque quelqu’un qui partage les repas.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit « on ne le trouvera pas »; le grec lit « il ne restera pas ». Les deux formulations évoquent son absence lorsque survient le malheur.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵשׁ אוֹהֵב חָבֵר שֻׁלְחָן
  choice: Il y a tel ami qui n’est qu’un compagnon de table
  rationale: 'La construction hébraïque est très condensée : אוֹהֵב et חָבֵר expriment la relation amicale, tandis que שֻׁלְחָן la limite à la table. « Compagnon de table » conserve l’image concrète du repas, confirmée par le grec κοινωνὸς τραπεζῶν, sans substituer l’expression interprétative « ami des beaux jours ».'
- source_word: וְלֹא יִמָּצֵא
  choice: mais on ne le trouvera pas
  rationale: Le nifal de מצא signifie littéralement « être trouvé ». La tournure française personnelle « on ne le trouvera pas » reste naturelle et fidèle au témoin hébreu; le grec « ne restera pas » est signalé en note comme variante parallèle.
- source_word: בְּיוֹם רָעָה
  choice: au jour du malheur
  rationale: Dans ce contexte sapientiel, רָעָה désigne l’adversité ou le malheur plutôt que le mal moral. « Au jour du malheur » garde l’expression temporelle imagée de l’hébreu et un registre digne.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’image de la table et la littéralité de « trouver », tout en rendant explicite par « n’est qu’un » le caractère limité de cette amitié décrit par la construction hébraïque.
