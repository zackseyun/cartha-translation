  text: For there is a friend for the occasion[a], and he will not stand firm in the day of distress.
translation:
  language: fr
  text: Car il y a tel ami qui ne l’est que pour un temps[a] et qui ne tiendra pas bon au jour de la détresse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon les circonstances » ou « quand les circonstances lui conviennent ». L’expression hébraïque peut désigner une amitié limitée au moment favorable; le grec présente lui aussi un ami qui ne l’est qu’en son temps.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹהֵב
  choice: ami
  rationale: Le participe substantivé désigne ici une personne qui aime ou se montre attachée, au sens concret d’« ami ». Le grec parallèle φίλος confirme ce sens relationnel, sans connotation romantique.
- source_word: כְּפִי עֵת
  choice: ne l’est que pour un temps
  rationale: L’expression hébraïque signifie littéralement « selon la mesure de la circonstance/du temps » et présente une amitié conditionnée par le moment. Cette formulation française est naturelle et conserve l’idée d’une loyauté temporaire, sans préciser abusivement si elle relève de l’opportunisme.
- source_word: יַעֲמוֹד
  choice: tiendra bon
  rationale: עמד signifie « se tenir, rester debout » et évoque ici la constance face à l’épreuve. « Tenir bon » exprime cette fidélité éprouvée tout en gardant l’image de la fermeté; le grec παραμείνῃ appuie l’idée de demeurer.
- source_word: בְּיוֹם צָרָה
  choice: au jour de la détresse
  rationale: Cette traduction conserve l’idiome hébraïque « au jour de » et rend צָרָה par « détresse », terme à la fois courant et digne qui englobe épreuve, malheur et adversité.
theological_decisions: []
translation_notes:
  register: Français moderne, international et proverbial. « Il y a tel ami » convient au ton sapientiel; la reprise « qui… et qui… » rend explicite que les deux propositions concernent le même type d’ami. L’ambiguïté entre amitié simplement temporaire et amitié opportuniste est conservée dans le texte et signalée en note.
