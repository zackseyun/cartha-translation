translation:
  language: fr
  text: Réfléchis à la crainte du Très-Haut et à ses commandements[a] ; médite sans cesse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente un texte très différent : « Si tu vois un homme sensé, va le trouver de bonne heure, et que ton pied use les seuils de ses portes. »'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִתְבּוֹנַנְתָּ
  choice: Réfléchis à
  rationale: La forme hitpael de בין exprime ici une considération attentive. « Réfléchis à » est naturel en français et conserve la dimension méditative du verbe.
- source_word: בְּיִרְאַת
  choice: à la crainte de
  rationale: Dans la littérature sapientiale, יראה désigne une crainte empreinte de révérence. « La crainte de » préserve l’expression biblique et sa tension théologique, sans la réduire à la seule révérence.
- source_word: עֶלְיוֹן
  choice: du Très-Haut
  rationale: עליון est un titre divin couramment rendu en français par « le Très-Haut ».
- source_word: וּבְמִצוֹתָיו
  choice: et à ses commandements
  rationale: La préposition בְּ coordonne ce groupe à « la crainte du Très-Haut » comme second objet de la réflexion. « Commandements » conserve le registre biblique.
- source_word: וֶהְגֵה
  choice: médite
  rationale: הגה peut évoquer la méditation, parfois accompagnée d’une récitation à voix basse. « Médite » convient au contexte sapiential tout en restant concis.
- source_word: תָמִיד
  choice: sans cesse
  rationale: תמיד exprime la continuité ou la régularité persistante. « Sans cesse » rend cette force de façon naturelle et digne.
theological_decisions:
- issue: Divergence majeure entre les témoins hébreu et grec
  choice: Le texte hébreu conservé est traduit dans le corps du verset, et la leçon grecque est signalée en note.
  alternative: 'Suivre le grec : « Si tu vois un homme sensé, va le trouver de bonne heure, et que ton pied use les marches de sa porte. »'
  rationale: Le projet privilégie l’hébreu de Ben Sira lorsqu’il est conservé. Comme le grec présente ici un texte substantiellement différent, sa leçon est néanmoins donnée intégralement afin de préserver la transparence textuelle.
translation_notes:
  register: Français international moderne, clair et digne. L’impératif rend l’exhortation sapientiale ; « crainte du Très-Haut » maintient l’expression biblique sans en atténuer la portée. Le point-virgule respecte la distinction entre les deux propositions hébraïques.
