translation:
  language: fr
  text: Une parole douce multiplie les amis[a], et des lèvres bienveillantes prennent des nouvelles d’autrui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu, difficile, dit littéralement « multiplie celui qui aime » ; le grec parallèle porte « multiplie ses amis », sens suivi ici.
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « demandent la paix ». L’expression peut désigner une salutation bienveillante ou le fait de prendre des nouvelles de quelqu’un.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵךְ עָרֵב
  choice: une parole agréable
  rationale: חֵךְ désigne littéralement le palais, employé ici par métonymie pour la parole; עָרֵב signifie « agréable, doux ». En français actuel, « une parole agréable » rend naturellement le sens tout en conservant la qualité plaisante de l’expression. Le grec garde lui aussi une image corporelle avec λάρυγξ γλυκύς, « une gorge douce ».
- source_word: יַרְבֶּה אוֹהֵב
  choice: multiplie les amis
  rationale: L’hébreu porte littéralement un singulier difficile, « multiplie celui qui aime / un ami ». Le parallèle grec lit « multipliera ses amis », ce qui éclaire probablement le sens visé. Le français conserve la formulation concise sans la développer en « se fait beaucoup d’amis ».
- source_word: שִׂפְתֵי חֵן
  choice: des lèvres pleines de grâce
  rationale: L’expression signifie littéralement « des lèvres de grâce/faveur ». Cette traduction préserve l’image corporelle et la nuance relationnelle de חֵן sans réduire le propos au simple charme.
- source_word: שׁוֹאֲלֵי שָׁלוֹם
  choice: s’enquièrent du bien-être d’autrui
  rationale: L’expression hébraïque évoque littéralement ceux qui « demandent la paix/le bien-être », idiome de salutation ou de sollicitude. « S’enquérir du bien-être » est intelligible en français moderne et garde cette portée sociale; « d’autrui » explicite seulement le complément implicite.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La première métonymie corporelle est rendue par son sens (« parole ») afin d’éviter l’expression peu naturelle « palais agréable »; l’image des lèvres est maintenue dans le second membre. Le parallélisme et la concision sapientiale sont préservés.
