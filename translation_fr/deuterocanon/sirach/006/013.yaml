  text: Keep away from your enemies[a], and be on guard against your friends.
translation:
  language: fr
  text: Tiens-toi à l’écart de ceux qui te haïssent, et sois sur tes gardes avec ceux qui t’aiment.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « tes amis ».'
    reason: Variante du témoin grec par rapport à l’expression hébraïque « ceux qui t’aiment ».
lexical_decisions:
- source_word: מִשֹּׂנְאֶיךָ
  choice: de ceux qui te haïssent
  rationale: Le participe hébreu désigne littéralement « ceux qui te haïssent ». Cette formulation naturelle en français conserve la symétrie avec « ceux qui t’aiment » dans le second membre.
- source_word: הִבָּדֵל
  choice: Tiens-toi à l’écart
  rationale: L’impératif nifal de בדל appelle à se séparer ou à prendre ses distances. « Tiens-toi à l’écart » en exprime clairement la portée réfléchie et durable.
- source_word: וּמֵאֹהֲבֶיָך
  choice: avec ceux qui t’aiment
  rationale: Le texte hébreu dit littéralement « de ceux qui t’aiment », tandis que le grec porte « amis ». Après « sois sur tes gardes », le français idiomatique emploie « avec » sans effacer la catégorie relationnelle plus large du texte hébreu.
- source_word: הֵשָּׁמֵר
  choice: sois sur tes gardes
  rationale: L’impératif exprime l’action de se garder et de rester vigilant. Cette tournure conserve l’avertissement sans durcir le sens jusqu’à une défiance absolue.
theological_decisions:
- issue: 'Désignation du second groupe : « ceux qui t’aiment » ou « amis »'
  choice: ceux qui t’aiment
  alternative: tes amis
  rationale: Le témoin hébreu conservé porte אֹהֲבֶיךָ, « ceux qui t’aiment ». Le grec a φίλων, « amis ». Le texte principal suit donc l’hébreu, et la variante grecque est signalée en note afin de préserver la différence entre les témoins.
translation_notes:
  register: Français moderne, sobre et proverbial. Le parallélisme « ceux qui te haïssent / ceux qui t’aiment » reflète directement la structure hébraïque, tandis que « sois sur tes gardes avec » reste naturel et évite une formulation inutilement accusatrice.
