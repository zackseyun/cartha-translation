  text: My son[a], from your youth receive instruction, and until gray hair you will attain wisdom.
translation:
  language: fr
  text: Mon fils[a], dès ta jeunesse, reçois l’instruction, et jusqu’aux cheveux blancs tu acquerras la sagesse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « choisis l’instruction », tandis que l’hébreu dit plus littéralement « prends l’instruction ». L’hébreu est suivi ici; les deux lectures invitent à accueillir l’instruction dès la jeunesse.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנִי
  choice: Mon fils
  rationale: L’hébreu emploie directement la formule filiale masculine habituelle de l’enseignement paternel dans le Siracide; elle est conservée sans neutralisation.
- source_word: מִנְּעוּרֶיךָ
  choice: dès ta jeunesse
  rationale: La préposition exprime le point de départ. « Dès ta jeunesse » est naturel en français et correspond aussi au grec ἐκ νεότητός σου.
- source_word: קַח לֶקַח
  choice: reçois l’instruction
  rationale: קַח signifie littéralement « prends », tandis que לֶקַח désigne l’enseignement reçu. Ensemble, « reçois l’instruction » rend naturellement l’appel à accueillir une formation.
- source_word: וְעַד שֵׂיבָה
  choice: et jusqu’aux cheveux blancs
  rationale: La formulation conserve l’image concrète des cheveux blancs, qui désignent la vieillesse, également attestée par le parallèle grec.
- source_word: תַּשִּׂיג
  choice: tu acquerras
  rationale: Le verbe exprime le fait d’atteindre ou d’obtenir. « Acquérir la sagesse » est idiomatique et traduit l’aboutissement progressif envisagé.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: Équivalent français normal du terme central de la littérature sapientielle.
