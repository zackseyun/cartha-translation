review_pass:
  verdict: revise
  source_fidelity: 'Le premier membre est bien rendu dans son sens idiomatique : tomber « dans la main » de sa נפש évoque le fait de se livrer à ses propres impulsions. En revanche, « sinon ta force se retournera contre toi » attribue à חֵילָךְ une action réflexive que l’hébreu ne formule pas. Le verbe וּתְעַבֶּה et la relation exacte de « ta force » à « contre toi » demeurent difficiles; il convient de ne pas les résoudre comme si elles étaient certaines.'
  naturalness: « Ne tombe pas sous l’emprise de tes propres désirs » est naturel, actuel et approprié au registre sapientiel. La formulation révisée garde une phrase française lisible tout en laissant percevoir le caractère paradoxal et incertain du second membre.
  terminology: « Désirs » rend convenablement נפש dans ce contexte sans imposer un sens métaphysique à « âme ». « Force » conserve l’amplitude de חיל. La note distingue explicitement le texte hébreu difficile du parallèle grec divergent, sans faire de ce dernier une restitution certaine de l’hébreu.
  issues:
  - severity: medium
    issue: Le second membre traduit « ta force se retournera contre toi ».
    rationale: Le texte hébreu porte littéralement quelque chose comme « et tu rendras/feras grossir ta force contre toi ». Même si son sens est incertain, il ne dit pas que la force elle-même « se retournera ». Cette paraphrase efface le problème textuel et modifie la construction.
  - severity: low
    issue: La note ne donne pas le second membre hébreu, alors qu’elle explique son caractère difficile.
    rationale: Citer ou caractériser plus précisément ce membre permet au lecteur de voir que l’incertitude concerne l’hébreu transmis et que la formulation grecque est un parallèle divergent, non une équivalence directe.
  revised_text: Ne tombe pas sous l’emprise de tes propres désirs[a], et n’accrois pas ta force contre toi-même.
  revised_footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Ne tombe pas dans la main de ton âme », où « âme » peut désigner l’être intérieur, les désirs ou les appétits. Le second membre hébreu est difficile : littéralement, « et tu rendras ta force abondante contre toi ». Le parallèle grec lit : « Ne t’élève pas dans le conseil de ton âme, de peur que ton âme ne soit mise en pièces comme un taureau. »'
    reason: alternative_reading
  revision_rationale: La révision conserve l’avertissement du premier membre et rend le second de manière proche de ses mots hébreux, sans transformer une construction obscure en l’affirmation non attestée selon laquelle la force « se retournerait » d’elle-même. La note documente honnêtement l’ambiguïté du texte hébreu et la divergence du grec.
