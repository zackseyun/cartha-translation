  text: Do not fall into the power of your own desire[a], lest your strength be consumed against you.
translation:
  language: fr
  text: Ne tombe pas sous l’emprise de tes propres désirs[a], sinon ta force se retournera contre toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Ne tombe pas dans la main de ton âme. » Ici, « âme » peut désigner les désirs ou les appétits personnels. La suite de l’hébreu est difficile; le grec porte : « Ne t’élève pas selon le conseil de ton âme, de peur que ton âme ne soit mise en pièces comme un taureau. »'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּפּוֹל בְּיַד
  choice: Ne tombe pas sous l’emprise
  rationale: L’expression hébraïque signifie littéralement « ne tombe pas dans la main de ». « Sous l’emprise » conserve l’image d’un pouvoir auquel on se livre tout en restant naturel en français.
- source_word: נַפְשְׁךָ
  choice: tes propres désirs
  rationale: Dans ce contexte sapientiel, נֶפֶשׁ désigne l’être intérieur dans sa dimension d’appétit ou de désir, plutôt que l’« âme » au sens métaphysique. Le pluriel français exprime naturellement les impulsions personnelles visées.
- source_word: וּתְעַבֶּה
  choice: sinon … se retournera
  rationale: La forme hébraïque et le sens de la proposition sont difficiles. La traduction rend prudemment l’idée générale d’une puissance devenue autodestructrice, sans reprendre comme certaine l’image grecque d’un déchirement.
- source_word: חֵילֵךָ
  choice: ta force
  rationale: חַיִל peut désigner la force, la vigueur ou les ressources. « Force » préserve ici la valeur la plus générale et correspond à l’avertissement contre l’autodestruction.
- source_word: עָלֶיךָ
  choice: contre toi
  rationale: Dans ce contexte, עַל exprime l’effet hostile ou nuisible exercé sur la personne; « contre toi » restitue clairement cette dimension réflexive.
theological_decisions:
- issue: Recours au parallèle grec pour un second membre hébreu difficile
  choice: Rendre une mise en garde contre les désirs personnels dont la force finit par nuire à celui qui leur cède.
  alternative: « Ne tombe pas dans la main de ton âme, et n’engraisse pas ta force contre toi »; ou, d’après le grec, « ne t’élève pas selon le conseil de ton âme, de peur que ton âme ne soit mise en pièces comme un taureau ».
  rationale: L’hébreu reste prioritaire dans le premier membre, où son idiome est intelligible. Le second membre est obscur et ne correspond pas exactement au grec; la traduction conserve donc le noyau commun d’une ruine provoquée par ses propres impulsions, tandis que la note signale honnêtement les formes attestées.
translation_notes:
  register: Français international actuel, digne et directement compréhensible. Le tutoiement singulier correspond à l’adresse sapientielle hébraïque. La formulation évite de donner à « âme » un sens métaphysique absent du contexte et signale en note l’incertitude textuelle majeure.
