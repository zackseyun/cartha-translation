translation:
  language: fr
  text: Incline ton épaule et porte-la[a] ; ne prends pas ses liens en dégoût.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu rendu ici par « ses liens » est difficile. Le grec porte « ses liens », ce qui prolonge vraisemblablement l’image de la discipline contraignante de la sagesse.
    reason: textual_variant
lexical_decisions:
- source_word: הַט
  choice: Courbe
  rationale: L’impératif de נטה exprime ici le geste volontaire de présenter ou d’abaisser l’épaule pour recevoir une charge. « Courbe » conserve cette image concrète en français naturel.
- source_word: שִׁכְמְךָ
  choice: ton épaule
  rationale: שכם désigne l’épaule. Ce sens littéral, confirmé par le grec ὦμος, maintient l’image corporelle de la charge à porter.
- source_word: וְשָׂאֶהָ
  choice: et porte-la
  rationale: Le verbe נשׂא évoque le fait de soulever et de porter. Le suffixe féminin renvoie à la sagesse personnifiée ; « porte-la » exprime ici une action qui ne se réduit pas à un simple soulèvement momentané.
- source_word: וְאַל תָּקוֹץ
  choice: ne prends pas … en dégoût
  rationale: קוץ marque une réaction de répulsion ou d’aversion. Cette tournure française garde la force du verbe sans employer une formulation passive peu naturelle.
- source_word: בְּתַחְבּוּלוֹתֶיהָ
  choice: ses liens
  rationale: La leçon hébraïque est difficile dans ce passage. Le parallèle grec porte δεσμοῖς, « liens », qui prolonge de manière cohérente l’image de la discipline contraignante de la sagesse.
theological_decisions:
- issue: Personnification féminine de la sagesse
  choice: Conserver le pronom féminin dans « porte-la »
  alternative: Neutraliser la personnification ou répéter « la sagesse »
  rationale: Le suffixe féminin hébreu et le pronom grec renvoient à la sagesse personnifiée dans le contexte. Le féminin préserve donc la forme littéraire et théologique du texte source.
- issue: Terme hébreu difficile תַחְבּוּלוֹתֶיהָ et témoignage du grec
  choice: Retenir « ses liens » dans le texte principal
  alternative: « ses contraintes », « ses disciplines » ou « ses conseils »
  rationale: Le témoin hébreu est textuellement difficile, tandis que le grec atteste clairement « ses liens ». Cette traduction maintient l’image de contrainte sans dissimuler l’incertitude, signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier reproduit l’adresse directe de l’hébreu. « Courbe ton épaule » conserve volontairement la métaphore physique, tandis que « prendre en dégoût » exprime avec naturel l’aversion marquée par le verbe hébreu.
