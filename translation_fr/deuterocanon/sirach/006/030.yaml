  text: Its yoke is a golden ornament[b][a], and its bonds are a cord of blue thread.
translation:
  language: fr
  text: Son joug est un joug d’or[a], et ses liens sont un cordon de fil bleu-violet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu répète l’image du « joug » : littéralement, « un joug d’or est son joug ». Le grec parallèle lit plutôt « une parure d’or sur elle ».'
    reason: alternative_reading
  - marker: b
    text: Ou « un cordon bleu », « un cordon violet-bleu » ou « un cordon couleur jacinthe ». Le terme désigne un fil précieux teint d’une nuance de bleu tirant sur le violet.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻלֵּי / עֻלָּהּ
  choice: joug / parure
  rationale: L’hébreu associe le joug à l’or dans une formulation qui joue sur l’idée d’une charge devenue ornement. « Son joug est une parure d’or » conserve à la fois l’image du joug, présente dans le contexte, et la valeur décorative confirmée par le grec.
- source_word: זָהָב
  choice: d’or
  rationale: Cette tournure naturelle en français conserve clairement l’idée de la matière précieuse.
- source_word: מוֹסְרוֹתֶיהָ
  choice: liens
  rationale: Le mot désigne ce qui attache ou entrave. « Liens » garde l’image de la contrainte tout en restant fluide et digne.
- source_word: פְּתִיל
  choice: cordon
  rationale: Le terme désigne un fil retors ou une cordelette. « Cordon » convient à la fois à la solidité du lien et à son caractère précieux.
- source_word: תְּכֵלֶת
  choice: pourpre bleue
  rationale: Le terme renvoie à une matière teinte d’un bleu tirant sur le violet, réputée précieuse. « Pourpre bleue » rend cette nuance mieux que le seul mot « bleu », tandis que la note signale d’autres formulations possibles.
theological_decisions:
- issue: La discipline de la Sagesse présentée à la fois comme contrainte et comme beauté
  choice: Conserver ensemble les images du joug et des liens, ainsi que celles de la parure et du cordon précieux
  alternative: Réduire l’image soit à un simple ornement, soit à une contrainte pesante
  rationale: 'Le texte hébreu et son parallèle grec maintiennent une tension féconde : ce qui attache le disciple à la Sagesse est contraignant, mais également précieux et beau. La traduction ne tranche pas artificiellement entre ces deux aspects.'
translation_notes:
  register: Français international moderne, naturel et soutenu sans archaïsme. Le parallélisme est resserré par l’ellipse de « est » dans le second membre. Les deux notes sont appelées explicitement dans le texte.
