  text: For discipline is true to its name[a], and it is not evident to many.
translation:
  language: fr
  text: Car la discipline est conforme à son nom[a], et elle n’est pas évidente pour beaucoup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Car la sagesse est conforme à son nom, et elle n’est pas évidente pour beaucoup. » Le témoin hébreu a « discipline » là où le grec a « sagesse ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמּוּסָר
  choice: la discipline
  rationale: Le substantif hébreu מוּסָר désigne la discipline, l’instruction ou la correction. « La discipline » suit le témoin hébreu principal, tandis que la divergence du grec (« la sagesse ») est signalée en note.
- source_word: בִּשְׁמָהּ
  choice: est conforme à son nom
  rationale: Littéralement « selon/en son nom ». Cette formulation française conserve l’idée de correspondance avec le nom sans imposer une interprétation plus précise.
- source_word: נְכוֹחָה
  choice: évidente
  rationale: Dans cette construction, le mot exprime ce qui est manifeste ou clairement perceptible. Le grec φανερά confirme ce sens contextuel.
- source_word: לְרַבִּים
  choice: pour beaucoup
  rationale: Rend naturellement en français la préposition לְ avec « beaucoup », en relation avec l’adjectif « évidente ».
theological_decisions:
- issue: Divergence entre les témoins hébreu et grec quant au sujet
  choice: Retenir « la discipline » dans le texte principal d’après l’hébreu
  alternative: Retenir « la sagesse » d’après le grec
  rationale: L’hébreu conservé est le témoin principal et porte מוּסָר (« discipline, instruction »). Comme le grec lit σοφία (« sagesse »), cette variante substantielle est conservée explicitement en note plutôt que résolue silencieusement.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « conforme à son nom » reste proche de l’hébreu et préserve une certaine énigme de l’expression.
