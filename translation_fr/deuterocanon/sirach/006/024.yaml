translation:
  language: fr
  text: Mets tes pieds dans ses entraves, et ton cou dans son collier.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέδας
  choice: entraves
  rationale: Le terme grec désigne des liens ou fers qui retiennent les pieds; « entraves » conserve l’image de la contrainte tout en restant naturel en français.
- source_word: κλοιόν
  choice: carcan
  rationale: Le grec désigne un collier rigide imposé au cou. « Carcan » rend clairement cette image, plus précisément que le simple « collier ».
- source_word: εἴσενεγκον
  choice: Engage
  rationale: L’impératif grec signifie faire entrer ou placer dans quelque chose; « engage » convient aux pieds placés volontairement dans des entraves.
theological_decisions:
- issue: Identification du référent féminin
  choice: Maintien des pronoms possessifs féminins « ses »
  alternative: Expliciter « les entraves de la sagesse » et « son carcan »
  rationale: Le féminin renvoie à la sagesse dans le contexte immédiat. Le texte grec emploie des possessifs féminins sans répéter le nom; la traduction préserve cette cohésion et n’ajoute aucune explicitation.
- issue: Divergence majeure entre le texte hébreu fourni et le parallèle grec
  choice: Suivre le grec, qui correspond à Siracide 6.24 et au contexte
  alternative: Traduire littéralement le texte hébreu composite fourni
  rationale: Le dossier signale lui-même une discordance majeure. Le texte hébreu cité ne correspond ni au contenu ni à l’enchaînement contextuel de Siracide 6.24, tandis que le grec transmet ici une leçon complète et cohérente, vraisemblablement fondée sur un Vorlage hébreu non conservé pour ce verset.
translation_notes:
  register: Français moderne, international et digne. La formulation conserve la métaphore volontairement rude de la discipline imposée par la sagesse, sans l’atténuer ni l’expliquer dans le corps du verset.
