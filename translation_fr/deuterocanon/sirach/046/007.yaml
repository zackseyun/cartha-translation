base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/007.yaml
  text: Also[a], because he fully followed God, and in the days of Moses showed loyalty—he and Caleb son of Jephunneh—by standing firm against the assembly's rebellion, to keep the people from sin and to silence wicked grumbling.
translation:
  language: fr
  text: Et, parce qu’il suivit Dieu sans réserve, il manifesta sa loyauté[a] au temps de Moïse ; lui et Caleb, fils de Yefounné, se dressèrent contre la révolte de l’assemblée[b], afin d’empêcher le peuple de pécher et de faire taire les murmures coupables.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bonté » ou « miséricorde ». Les termes hébreu et grec peuvent avoir ces sens, mais le contexte met ici en avant une conduite loyale et fidèle.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu, condensé et quelque peu incertain, dit littéralement quelque chose comme « se tenir ferme dans le déchaînement de l’assemblée ». Le grec est plus développé : « se dresser contre l’ennemi, empêcher le peuple de pécher et faire cesser les murmures coupables ».'
    reason: textual_variant
lexical_decisions:
- source_word: מלא אחרי אל
  choice: suivit pleinement Dieu
  rationale: L’expression hébraïque signifie suivre Dieu sans réserve. Cette formulation naturelle conserve l’image verbale et fait écho à la caractérisation biblique de Josué et de Caleb.
- source_word: עשה חסד
  choice: fit preuve de fidélité
  rationale: חסד peut désigner la bonté ou la miséricorde, mais, dans ce récit, l’expression souligne surtout une conduite loyale et fidèle au temps de Moïse.
- source_word: להתיצב
  choice: tinrent ferme
  rationale: Le verbe évoque le fait de se tenir debout ou de prendre position. « Tinrent ferme » rend ici la détermination manifestée face à la révolte.
- source_word: בפרע קהל
  choice: contre la révolte de l’assemblée
  rationale: La formulation hébraïque est condensée et quelque peu incertaine. Elle semble décrire le déchaînement ou le désordre de l’assemblée; la préposition « contre » explicite prudemment l’opposition indiquée par le contexte et soutenue par le grec.
- source_word: κωλῦσαι λαὸν ἀπὸ ἁμαρτίας
  choice: afin d’empêcher le peuple de pécher
  rationale: Cette proposition finale, conservée dans le grec, exprime clairement le but de leur prise de position.
- source_word: κοπάσαι γογγυσμὸν πονηρίας
  choice: faire taire ses murmures mauvais
  rationale: La formulation conserve à la fois l’idée de faire cesser les murmures et leur qualification morale, sans transformer ceux-ci en simple plainte.
theological_decisions:
- issue: Recours au parallèle grec pour compléter un témoin hébreu condensé
  choice: Le texte principal suit l’hébreu pour la prise de position de Josué et Caleb, puis intègre les deux propositions finales conservées par le grec.
  alternative: S’en tenir au texte hébreu conservé et terminer après « la révolte de l’assemblée », ou suivre entièrement le grec en traduisant « contre l’ennemi ».
  rationale: L’hébreu demeure le témoin principal, mais sa formulation est ici condensée et signalée comme présentant une légère divergence. Le grec paraît conserver une forme plus complète du verset. La note rend cette situation textuelle explicite sans dissimuler l’écart entre les témoins.
- issue: Sens de חסד / ἔλεος
  choice: fidélité
  alternative: bonté ou miséricorde
  rationale: Dans ce contexte, le mot qualifie l’attachement loyal manifesté par une conduite ferme plutôt qu’un acte de compassion. La variante sémantique demeure signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde Josué et Caleb étroitement associés tout en rendant explicite le pluriel impliqué. Les notes exposent les ambiguïtés lexicale et textuelle sans privilégier une lecture confessionnelle.
