revisions:
- from: 'De plus, parce qu’il suivit pleinement Dieu, il fit preuve de fidélité[a] au temps de Moïse, lui ainsi que Caleb, fils de Yefounné : ils tinrent ferme contre la révolte de l’assemblée[b], afin d’empêcher le peuple de pécher et de faire taire ses murmures mauvais.'
  to: Et, parce qu’il suivit Dieu sans réserve, il manifesta sa loyauté[a] au temps de Moïse ; lui et Caleb, fils de Yefounné, se dressèrent contre la révolte de l’assemblée[b], afin d’empêcher le peuple de pécher et de faire taire les murmures coupables.
  rationale: 'La révision améliore la syntaxe et l’idiomaticité françaises sans modifier le choix textuel du projet : l’hébreu demeure le point de départ, tandis que les propositions finales, conservées dans le grec, sont intégrées avec une note qui expose aussi la divergence « assemblée » / « ennemi ». « Sans réserve », « manifesta sa loyauté » et « murmures coupables » sont des équivalents modernes et précis, sans surinterprétation doctrinale.'
