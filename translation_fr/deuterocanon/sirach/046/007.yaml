  source_fidelity: 'Le texte conserve l’enchaînement du témoin hébreu : l’attachement entier à Dieu, l’action au temps de Moïse, puis l’association de Josué avec Caleb. Les deux finales sont explicitement signalées comme un apport du parallèle grec, lequel est plus développé à cet endroit. « Sans réserve » rend naturellement l’idiome מלא אחרי אל sans le réduire à une adhésion seulement intellectuelle.'
  naturalness: 'La formulation est rendue plus fluide en français moderne : « lui et Caleb ... se dressèrent » évite l’enchaînement lourd « lui ainsi que Caleb : ils tinrent ferme ». « Murmures coupables » est idiomatique et transmet l’évaluation négative de πονηρίας mieux que « murmures mauvais ».'
  terminology: « Loyauté » convient à חסד dans ce contexte de fidélité active, tout en laissant les sens « bonté » et « miséricorde » en note. Les noms Moïse, Caleb et Yefounné sont conservés. La note textuelle distingue nettement le libellé hébreu condensé et le développement grec, sans les harmoniser indûment.
