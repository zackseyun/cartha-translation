revisions:
- from: Aimé de son peuple et agréable à son Créateur[a], demandé dès le ventre de sa mère, Samuel, nazir de Yahweh dans la prophétie, exerça les fonctions de juge et de prêtre. Par la parole de Dieu, il affermit la royauté et consacra par l’onction des dirigeants sur son peuple.
  to: Aimé de son peuple et agréable à son Créateur[a], demandé dès le ventre de sa mère, Samuel, nazir de Yahweh dans la prophétie, exerça les fonctions de juge et de prêtre. Par la parole de Dieu, il établit la royauté et oignit des chefs à la tête de son peuple.
  rationale: 'La révision conserve la structure et les ambiguïtés significatives du témoin hébreu, y compris « nazir de Yahweh dans la prophétie ». Elle remplace seulement deux rendus français moins exacts ou moins naturels : « établit la royauté » pour l’action d’instituer la monarchie, et « oignit des chefs à la tête de son peuple » pour l’onction de dirigeants. La note est ajustée pour correspondre au vocabulaire révisé tout en signalant exactement l’importante divergence du grec.'
