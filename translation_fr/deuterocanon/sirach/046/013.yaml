base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/013.yaml
  text: Beloved by his people and pleasing to his Maker[a], asked for from his mother's womb, Samuel, a Nazirite of the Lord in prophecy, judged and served as priest; by the word of God he established the kingdom, and anointed rulers over his people.
translation:
  language: fr
  text: Aimé de son peuple et agréable à son Créateur[a], demandé dès le ventre de sa mère, Samuel, nazir de Yahweh dans la prophétie, exerça les fonctions de juge et de prêtre. Par la parole de Dieu, il établit la royauté et oignit des chefs à la tête de son peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Samuel, aimé de son Seigneur, prophète du Seigneur, établit une royauté et oignit des chefs à la tête de son peuple. » Il ne contient pas les mentions selon lesquelles Samuel fut aimé de son peuple, agréable à son Créateur, demandé dès le ventre de sa mère, juge et prêtre ; il ne précise pas non plus qu’il agit « par la parole de Dieu ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אוהב עמו ורצוי עושהו
  choice: Aimé de son peuple et agréable à son Créateur
  rationale: Cette formulation suit les deux propositions parallèles du témoin hébreu. « Créateur » rend naturellement le participe « celui qui l’a fait », sans effacer son référent divin.
- source_word: המשואל מבטן אמו
  choice: demandé dès le ventre de sa mère
  rationale: La tournure conserve l’expression inhabituelle du texte hébreu et son jeu implicite avec le nom de Samuel, lié au verbe « demander ».
- source_word: נזיר יהוה בנבואה
  choice: nazir de Yahweh dans la prophétie
  rationale: « Nazir » garde la portée cultuelle précise de נזיר et évoque la consécration de Samuel depuis sa naissance. « Dans la prophétie » préserve la formulation compacte et quelque peu elliptique de l’hébreu au lieu de la résoudre en « prophète ».
- source_word: שופט ומכהן
  choice: exerça les fonctions de juge et de prêtre
  rationale: La formulation française exprime l’activité judiciaire et le service sacerdotal indiqués par les deux formes hébraïques, sans réduire celles-ci à de simples titres.
- source_word: בדבר אל הכין ממלכת
  choice: Par la parole de Dieu, il affermit la royauté
  rationale: בדבר אל indique que l’action repose sur la parole ou l’autorité divine. הכין peut signifier établir ou rendre ferme; « affermit » conserve cette nuance, tandis que « la royauté » désigne ici l’institution monarchique.
- source_word: וימשח נגידים על עם
  choice: et consacra par l’onction des dirigeants sur son peuple
  rationale: Le verbe משח désigne explicitement l’onction. נגידים peut désigner des chefs ou des dirigeants; « dirigeants » convient à Saül et David sans imposer un titre plus étroit. « Sur son peuple » maintient la relation de gouvernement.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / Yahvé
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahweh » le représente comme nom propre au lieu de le remplacer par un titre; « Yahvé » demeure une forme française courante, mais elle s’éloigne davantage de la vocalisation retenue ici.
- issue: Statut prophétique de Samuel
  choice: nazir de Yahweh dans la prophétie
  alternative: prophète de Yahweh
  rationale: Le grec appelle directement Samuel « prophète du Seigneur », mais l’hébreu emploie une expression plus singulière associant sa qualité de nazir à la prophétie. Le texte principal conserve cette tension plutôt que d’adopter la formulation grecque plus simple.
- issue: Activité sacerdotale de Samuel
  choice: exerça les fonctions de prêtre
  alternative: omit dans le grec
  rationale: Cette affirmation figure explicitement dans le témoin hébreu, même si le parallèle grec ne la contient pas. La traduction la conserve sans chercher à harmoniser les traditions textuelles.
translation_notes:
  register: Français international actuel, digne et lisible. La syntaxe poétique de l’hébreu est légèrement déployée pour la clarté, tout en maintenant ses formulations distinctives et les divergences importantes avec le grec.
