base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/009.yaml
  text: And he gave Caleb strength, and it remained with him until old age, so that he went up into the highlands of the land, and his offspring took possession of an inheritance.
translation:
  language: fr
  text: Il donna de la force à Caleb, et elle lui resta jusqu’à sa vieillesse, de sorte qu’il monta sur les hauteurs du pays, et que sa descendance prit possession d’un héritage.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עצמה
  choice: de la force
  rationale: Le nom hébreu désigne la force ou la vigueur; cette traduction naturelle conserve le sens concret et correspond au grec ἰσχύν.
- source_word: עמדה עמו
  choice: elle lui resta
  rationale: Rend littéralement l’idée que la force demeura avec Caleb, sans expliciter davantage le rapport logique.
- source_word: σπέρμα
  choice: sa descendance
  rationale: Dans ce contexte généalogique, «descendance» exprime naturellement le collectif grec, littéralement «semence».
- source_word: κατέσχεν κληρονομίαν
  choice: reçut un héritage
  rationale: Le verbe grec peut exprimer la prise de possession; «reçut» donne ici un français fluide tout en maintenant l’idée d’une part héréditaire acquise.
theological_decisions:
- issue: Sujet implicite du verbe «donna»
  choice: Il
  alternative: Le Seigneur
  rationale: Le texte hébreu fourni porte un sujet verbal implicite et le contexte immédiat peut l’identifier; le grec explicite «le Seigneur». La traduction conserve toutefois l’implicite hébreu sans ajouter un titre absent de cette ligne.
- issue: Complément grec absent du fragment hébreu après «vieillesse»
  choice: inclure la suite grecque
  alternative: s’arrêter à «sa vieillesse»
  rationale: Le témoin grec complet et la note signalant un léger décalage du composite hébreu justifient de conserver la seconde moitié du verset, attestée dans le parallèle ancien.
translation_notes:
  register: Français moderne, clair et digne. La première moitié suit prioritairement l’hébreu; la seconde s’appuie sur le parallèle grec complet en raison de la lacune ou du décalage signalé. La reprise pronominale «elle» garde l’image de la force qui demeure avec Caleb.
