base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/019.yaml
  text: 'Even up to the time of his end[1], he was found faithful in the eyes of Yahweh: “I have taken a ransom and hidden it—from whom have I taken anything? And no man answered against him.”'
translation:
  language: fr
  text: « Ai-je reçu une somme de compensation et l’ai-je dissimulée ? De qui ai-je pris quoi que ce soit ? » Et personne ne porta d’accusation contre lui.[a] De plus, jusqu’au temps de sa fin, il fut trouvé fidèle aux yeux de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est très concis. Le mot rendu par « somme de compensation » peut, dans ce contexte, désigner un pot-de-vin; il peut aussi se comprendre dans le sens plus général de rançon ou de paiement compensatoire. Le témoin grec développe autrement la déclaration : Samuel affirme n’avoir rien pris de personne, « ni biens, pas même une sandale », et ajoute que personne ne l’accusa.'
    reason: Préserver l’ambiguïté de כפר et signaler, sans l’harmoniser au texte principal, la formulation plus explicite et différente du témoin grec.
lexical_decisions:
- source_word: כפר ונעלם
  choice: un prix de compensation et l’ai-je dissimulé
  rationale: כפר désigne fondamentalement une somme versée en compensation ou en rançon, mais peut évoquer ici un paiement corrupteur. « Prix de compensation » conserve cette étendue mieux que « rançon », peu naturel dans ce contexte, ou « pot-de-vin », trop explicite. La dissimulation exprimée par ונעלם est rendue de façon active selon le sens contextuel de la déclaration.
- source_word: ממי לקחתי
  choice: De qui ai-je pris quoi que ce soit ?
  rationale: La formulation française explicite sobrement l’ellipse hébraïque tout en gardant la force de la question rhétorique.
- source_word: וכל אדם לא ענה בו
  choice: Et personne ne porta d’accusation contre lui
  rationale: ענה ב peut exprimer une réponse hostile ou une accusation. Le parallèle grec confirme le sens judiciaire; « personne » est naturel et inclusif en français moderne.
- source_word: וגם עד עת קצו
  choice: Jusqu’au temps de sa fin
  rationale: Suit le témoin hébreu, qui parle du terme de la vie de Samuel, plutôt que l’expansion grecque relative à son sommeil éternel.
- source_word: נכון נמצא
  choice: il fut trouvé fidèle
  rationale: נכון exprime ici la fermeté, la fiabilité et la droiture durable. « Fidèle » restitue naturellement cette qualité morale sans la surinterpréter.
- source_word: בעיני יהוה
  choice: aux yeux de Yahweh
  rationale: Conserve l’image hébraïque et rend directement le nom divin יהוה par « Yahweh ».
theological_decisions:
- issue: Sens moral du paiement mentionné
  choice: Conserver dans le texte la notion générale de prix compensatoire, avec le sens possible de pot-de-vin en note
  alternative: Traduire directement par « pot-de-vin » ou « rançon »
  rationale: Le contexte concerne l’intégrité de Samuel, mais le lexème כפר garde une certaine amplitude. La traduction évite de réduire silencieusement cette ambiguïté à une seule catégorie juridique.
- issue: Relation entre la déclaration de Samuel et son intégrité
  choice: Présenter la déclaration et l’absence d’accusation comme le témoignage du texte, sans développement doctrinal
  alternative: Expliciter une doctrine de justification personnelle ou harmoniser entièrement avec le grec
  rationale: Le passage loue la fidélité de Samuel et son absence de gain malhonnête, sans inviter à une élaboration doctrinale supplémentaire.
- issue: Nom divin
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu porte explicitement le tétragramme יהוה; la translittération maintient le nom propre.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct garde la vigueur rhétorique du témoignage de Samuel. L’ordre des propositions suit le témoin hébreu fourni plutôt que le réagencement de la couche anglaise de consultation.
