base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/011.yaml
  text: And the judges, each by his own name—everyone whose heart was not led astray and who did not turn away from God—may their memory be for blessing.
translation:
  language: fr
  text: Et les juges, chacun par son nom — tous ceux dont le cœur ne s’est pas égaré[a] et qui ne se sont pas détournés de Dieu[b] —, que leur mémoire soit une bénédiction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « tous ceux qui n’ont pas élevé leur cœur ». Le grec parallèle porte : « dont le cœur ne s’est pas prostitué », image d’un cœur devenu infidèle; il éclaire probablement ici le sens d’« égaré ».'
    reason: lexical_alternative
  - marker: b
    text: Le grec porte « ne se sont pas détournés du Seigneur »; le témoin hébreu lit ici « de Dieu ».
    reason: alternative_reading
lexical_decisions:
- source_word: והשופטים
  choice: Et les juges
  rationale: Dans ce contexte, שופטים désigne les chefs d’Israël de l’époque des Juges. « Juges » est le terme direct et contextuellement juste, confirmé par le grec οἱ κριταί.
- source_word: איש בשמו
  choice: chacun par son nom
  rationale: Cette formulation conserve l’idée que chacun des juges est évoqué individuellement, et non seulement le groupe dans son ensemble. Elle suit aussi de près le grec ἕκαστος τῷ αὐτοῦ ὀνόματι.
- source_word: כל אשר לא נשא לבו
  choice: tous ceux dont le cœur ne s’est pas égaré
  rationale: L’hébreu transmis est elliptique et signifie littéralement « tous ceux qui n’ont pas élevé leur cœur ». Le grec parallèle, « dont le cœur ne s’est pas prostitué », indique vraisemblablement l’idée d’égarement et d’infidélité. La traduction retient ce sens sans introduire dans le texte principal la métaphore plus explicite du grec.
- source_word: ולא נסוג מאחרי אל
  choice: et qui ne se sont pas détournés de Dieu
  rationale: נסוג מאחרי exprime le fait de reculer ou de se détourner de quelqu’un que l’on suivait. Le texte hébreu porte אל, « Dieu »; ce titre est donc conservé dans le texte principal.
- source_word: יהי זכרם לברכה
  choice: que leur mémoire soit une bénédiction
  rationale: Cette tournure française naturelle et digne conserve l’idiome hébreu qui associe leur souvenir à la bénédiction.
theological_decisions:
- issue: Titre divin dans la proposition finale
  choice: Dieu
  alternative: le Seigneur
  rationale: Le témoin hébreu principal lit אל, « Dieu », tandis que le grec porte Κυρίου, « Seigneur ». Le texte principal suit l’hébreu et la variante grecque est signalée en note.
- issue: Sens de la proposition relative au cœur
  choice: dont le cœur ne s’est pas égaré
  alternative: qui n’ont pas élevé leur cœur; dont le cœur ne s’est pas prostitué
  rationale: L’hébreu peut évoquer littéralement un cœur qui s’élève, éventuellement l’orgueil, alors que le grec indique une infidélité assimilée à la prostitution. Le choix principal exprime l’égarement religieux suggéré par le contexte, tandis que la note préserve l’ambiguïté des témoins.
translation_notes:
  register: Français international moderne, digne et accessible. La construction avec tirets garde l’unité de la longue bénédiction tout en rendant lisibles les deux critères de fidélité. Les notes préservent l’écart réel entre l’hébreu transmis et le parallèle grec.
