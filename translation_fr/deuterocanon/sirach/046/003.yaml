  text: Who could stand before him? For he fought the wars of Yahweh[a].
translation:
  language: fr
  text: Qui pouvait lui résister ? Car il mena les guerres de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec diffère sensiblement : « Qui, avant lui, s’était tenu ainsi ? Car le Seigneur lui-même fit venir les ennemis. » Le texte principal suit le témoin hébreu.'
    reason: alternative_reading
lexical_decisions:
- source_word: מי
  choice: Qui
  rationale: Le pronom interrogatif introduit une question rhétorique ; « Qui » est direct et naturel en français.
- source_word: לפניו יתיצב
  choice: pouvait lui résister
  rationale: Littéralement, « se tenir devant lui » ; dans ce contexte guerrier, l’expression signifie tenir tête ou résister. L’imparfait modal restitue la force rhétorique.
- source_word: כי
  choice: Car
  rationale: Introduit la raison expliquant pourquoi personne ne pouvait lui résister, dans un registre littéraire sobre.
- source_word: מלחמות
  choice: les guerres
  rationale: Conserve le pluriel et la portée large du terme hébreu, sans le réduire à des batailles particulières.
- source_word: יהוה
  choice: Yahweh
  rationale: Transcrit le nom divin explicite du texte hébreu, conformément à la décision éditoriale fournie.
- source_word: נלחם
  choice: il combattait
  rationale: Rend naturellement l’action guerrière attribuée au personnage ; l’imparfait convient à l’évocation de son activité passée caractéristique.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le témoin hébreu porte explicitement le Tétragramme. « Yahweh » préserve ici le nom propre sans importer une convention confessionnelle de substitution.
- issue: Sujet de נלחם
  choice: « il » renvoie au héros évoqué dans le contexte
  alternative: comprendre Yahweh comme sujet
  rationale: L’ordre syntaxique hébreu et le parallèle contextuel soutiennent la lecture selon laquelle le héros combattait les guerres de Yahweh, tout en évitant d’harmoniser le texte avec le grec divergent.
translation_notes:
  register: Français moderne, clair et digne. « Résister » explicite l’idiome hébreu « se tenir devant » dans son contexte militaire ; « les guerres de Yahweh » conserve la formulation marquée de l’original.
