  text: In a mighty crash his voice was heard[a], and the leaders of the foe were subdued[c][b], and all the rulers of the Philistines perished.
translation:
  language: fr
  text: Dans un fracas puissant, sa voix se fit entendre[a] ; les chefs de l’adversaire furent soumis[b], et tous les chefs des Philistins[c] périrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte littéralement une expression difficile, rendue ici par « dans un fracas puissant ». Le parallèle grec dit plus explicitement que le Seigneur tonna du ciel et fit entendre sa voix avec un grand bruit.
    reason: alternative_reading
  - marker: b
    text: Ou « les garnisons de l’adversaire », si נציבי désigne des postes militaires plutôt que des chefs.
    reason: lexical_alternative
  - marker: c
    text: Ou « les seigneurs des Philistins » ; le terme hébreu est le titre donné aux dirigeants philistins, notamment dans 1 Samuel.
    reason: cross_reference
lexical_decisions:
- source_word: בפרע אדיר
  choice: Dans un fracas puissant
  rationale: L’expression hébraïque est difficile, mais elle désigne dans ce contexte une manifestation sonore violente. « Fracas puissant » en conserve la force sans préciser « tonnerre », plus explicite dans le parallèle grec que dans le texte hébreu transmis.
- source_word: נשמע קולו
  choice: sa voix se fit entendre
  rationale: Cette formulation naturelle conserve la construction passive de l’hébreu et met l’accent sur le fait que la voix divine devient audible.
- source_word: ויכנע
  choice: furent soumis
  rationale: Le verbe peut exprimer l’abaissement ou la soumission. « Furent soumis » convient au contexte militaire sans ajouter de moyen ou d’agent non exprimé.
- source_word: נציבי צר
  choice: les chefs de l’adversaire
  rationale: נציב peut désigner un responsable ou chef, mais aussi un poste ou une garnison. Le sens personnel s’accorde bien avec le parallélisme du membre suivant. Le singulier collectif צר est rendu par « l’adversaire ».
- source_word: ויאבד
  choice: périrent
  rationale: Le verbe est rendu ici de façon intransitive, ce qui exprime simplement le sort des gouverneurs philistins et respecte le mouvement poétique.
- source_word: סרני פלשתים
  choice: les gouverneurs des Philistins
  rationale: סרנים est le titre caractéristique des dirigeants philistins dans les récits bibliques. « Gouverneurs » est clair en français moderne, tandis que « seigneurs » demeure une possibilité plus traditionnelle.
theological_decisions:
- issue: Référent de « sa voix »
  choice: Le possessif renvoie à Dieu, sans introduire son nom dans le corps du verset.
  alternative: La voix pourrait être associée plus indirectement à l’intervention ou à la prière de Samuel dans le contexte.
  rationale: Le parallèle grec attribue explicitement le tonnerre et la voix au Seigneur, tandis que le contexte raconte l’appel de Samuel au Seigneur contre les ennemis d’Israël. Garder le simple possessif respecte toutefois la formulation plus implicite de l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation en trois membres conserve la progression poétique de l’hébreu. Les choix restent proches du texte tout en signalant les incertitudes lexicales réelles.
