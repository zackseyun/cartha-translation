base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/014.yaml
  text: At the command of Yahweh he commanded the assembly[b][a], and the God of Jacob visited him.
translation:
  language: fr
  text: Sur l’ordre du SEIGNEUR, il donna ses directives à l’assemblée[a], et le Dieu de Jacob s’occupa de lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu transmis dit littéralement « il commanda l’assemblée »; le grec porte « il jugea l’assemblée ».
    reason: alternative_reading
  - marker: b
    text: L’hébreu n’exprime pas l’objet du verbe, qui peut signifier « visiter », « prendre en considération » ou « intervenir ». Le grec se traduit par « le Seigneur intervint en faveur de Jacob » ou « visita Jacob ».
    reason: lexical_and_textual_alternative
lexical_decisions:
- source_word: במצות יהוה
  choice: Sur l’ordre du SEIGNEUR
  rationale: La préposition ב exprime ici la conformité à une directive ou son fondement. « Sur l’ordre de » est naturel en français et rend bien מִצְוָה. Le nom divin יהוה est rendu selon la convention française traditionnelle par « le SEIGNEUR ».
- source_word: צוה
  choice: il donna ses directives à
  rationale: Le texte hébreu transmis porte le verbe צוה, « ordonner, donner des directives ». Cette formulation française évite la tournure plus rude « il commanda l’assemblée » tout en conservant le sens du témoin hébreu; la lecture grecque « il jugea » est signalée en note.
- source_word: עדה
  choice: l’assemblée
  rationale: עֵדָה désigne la communauté réunie. « Assemblée » est actuel, digne et correspond aussi au grec συναγωγή.
- source_word: ויפקד
  choice: s’occupa de lui
  rationale: פקד peut signifier remarquer, visiter, prendre en charge ou intervenir. Dans ce contexte favorable, « s’occupa de lui » exprime une attention active sans préciser indûment sa forme.
- source_word: אלהי יעקב
  choice: le Dieu de Jacob
  rationale: Traduction directe de cette désignation divine traditionnelle.
theological_decisions:
- issue: Divergence entre l’hébreu צוה (« ordonna ») et le grec ἔκρινεν (« jugea »)
  choice: 'Suivre dans le texte principal l’hébreu transmis: « il donna ses directives à l’assemblée »'
  alternative: « il jugea l’assemblée »
  rationale: L’hébreu est ici conservé avec une confiance élevée et offre un sens grammatical possible. Le grec s’accorde mieux avec la fonction judiciaire de Samuel, mais il ne suffit pas à remplacer silencieusement la lecture hébraïque; la variante est donc conservée en note.
- issue: Objet non exprimé de ויפקד
  choice: 'Comprendre Samuel comme objet implicite: « s’occupa de lui »'
  alternative: « intervint en faveur de Jacob » ou « visita Jacob »
  rationale: Dans l’hébreu, « le Dieu de Jacob » se lit naturellement comme le sujet postposé du verbe, mais aucun objet n’est exprimé. Le contexte immédiat consacré à Samuel favorise « lui », tandis que le grec fait de « Jacob » l’objet. La note maintient cette ambiguïté textuelle.
translation_notes:
  register: Français international moderne, fluide et digne. « Donner ses directives à » rend l’hébreu sans suggérer que Samuel exerçait un commandement militaire sur l’assemblée. Les deux notes rendent transparentes les principales tensions entre l’hébreu et le grec.
