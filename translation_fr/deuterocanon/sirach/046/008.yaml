base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/008.yaml
  text: Therefore those two also were spared[a], out of six hundred thousand foot soldiers, to bring them into an inheritance[b], into a land flowing with milk and honey.
translation:
  language: fr
  text: C’est pourquoi ces deux-là aussi furent préservés au fil des années[a], d’entre six cent mille fantassins, afin de les faire entrer dans leur héritage[b], dans une terre où coulent le lait et le miel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque traduite par « au fil des années » est difficile ; elle peut évoquer leur préservation pendant des années ou jusqu’à un âge avancé. Le grec dit plus simplement : « eux qui étaient deux furent sauvés ».'
    reason: textual_variant
  - marker: b
    text: La suite, depuis « afin de les faire entrer dans leur héritage », est conservée par le grec ; le témoin hébreu disponible s’arrête après « fantassins ».
    reason: alternative_reading
lexical_decisions:
- source_word: לכן
  choice: C’est pourquoi
  rationale: Marque naturellement la conséquence de l’action décrite juste auparavant.
- source_word: גם הם
  choice: eux aussi, les deux
  rationale: Le grec explicite qu’il s’agit de deux hommes; la formulation renvoie à Josué et Caleb sans les nommer dans le verset.
- source_word: בשנים נאצלו
  choice: furent épargnés au fil des années
  rationale: Conserve prudemment l’expression hébraïque difficile בשנים tout en donnant à נאצלו le sens d’une préservation hors de la destruction.
- source_word: משש מאות אלף רגלי
  choice: parmi six cent mille hommes de pied
  rationale: « Hommes de pied » rend רגלי dans son sens collectif et militaire, confirmé par le grec πεζῶν.
- source_word: εἰσαγαγεῖν αὐτοὺς εἰς κληρονομίαν
  choice: afin de les faire entrer dans leur héritage
  rationale: La suite grecque exprime l’entrée du peuple dans le territoire reçu en héritage; le possessif est idiomatique en français.
- source_word: εἰς γῆν ῥέουσαν γάλα καὶ μέλι
  choice: dans un pays ruisselant de lait et de miel
  rationale: Rend directement la formule biblique grecque dans un français naturel et solennel.
theological_decisions:
- issue: Recours au parallèle grec pour compléter le témoin hébreu plus court
  choice: Conserver l’hébreu comme base et intégrer dans le texte la suite attestée en grec sur l’héritage et le pays ruisselant de lait et de miel.
  alternative: S’arrêter après « parmi six cent mille hommes de pied ».
  rationale: Le grec fournit une suite cohérente avec le contexte et semble préserver une forme plus complète du verset, tandis que la note signale clairement l’état des témoins.
- issue: Interprétation de בשנים
  choice: « au fil des années », avec une note indiquant l’incertitude
  alternative: Omettre la locution en suivant le grec, ou comprendre « jusque dans leur vieillesse ».
  rationale: Cette solution préserve l’élément hébreu sans trancher entre une préservation durant les années et une survie jusqu’à un âge avancé.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure légèrement appositive « eux aussi, les deux » garde l’insistance des sources; les notes rendent visibles la difficulté de l’hébreu et la forme plus longue du grec.
