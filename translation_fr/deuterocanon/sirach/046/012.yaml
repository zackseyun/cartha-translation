  text: May their bones blossom like a lily[c][b][a], and may their name be renewed in their sons.
translation:
  language: fr
  text: Que leurs os fleurissent comme le lis[a][b], et que leur nom se renouvelle chez leurs fils[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit « comme le lis ». On traduit aussi parfois par « comme la rose », mais « lis » est ici le sens le plus probable de שושנה.
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec ajoute après « fleurissent » : « de leur lieu », ce qui peut évoquer l’endroit où reposent leurs os. Ces mots ne figurent pas dans l’hébreu fourni.'
    reason: alternative_reading
  - marker: c
    text: 'Autre traduction possible : « et que leur nom se perpétue par leurs fils ». Le verbe hébreu peut évoquer le renouvellement comme la succession.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תפרחנה
  choice: fleurissent
  rationale: Le verbe פרח évoque directement l’éclosion ou la floraison. « Fleurissent » conserve cette image végétale ainsi que la valeur de souhait du contexte.
- source_word: עצמותם
  choice: leurs os
  rationale: Traduction concrète et littérale, également confirmée par le grec τὰ ὀστᾶ αὐτῶν ; « leurs restes » atténuerait inutilement l’image.
- source_word: כשושנה
  choice: comme le lis
  rationale: שושנה désigne très probablement le lis, même si « rose » appartient à une tradition de traduction ancienne et répandue.
- source_word: ושמם
  choice: et que leur nom
  rationale: « Nom » maintient l’expression biblique, qui peut évoquer à la fois la mémoire, la renommée et la continuité familiale.
- source_word: תחליף
  choice: se renouvelle
  rationale: Le verbe חלף peut exprimer le renouvellement, la succession ou le remplacement. La formulation retenue préserve cette amplitude sans réduire le sens à une simple substitution.
- source_word: לבניהם
  choice: dans leurs fils
  rationale: Le texte hébreu dit précisément « leurs fils ». « Dans » rend de façon intelligible l’idée que le nom continue ou revit en eux.
theological_decisions:
- issue: Terme masculin désignant la descendance
  choice: leurs fils
  alternative: leurs enfants / leurs descendants
  rationale: בניהם est explicitement masculin pluriel. La traduction conserve cette précision au lieu de l’élargir, tout en laissant entendre la continuité dynastique.
- issue: Portée de l’image des os qui fleurissent
  choice: conserver l’image poétique sans l’expliciter doctrinalement
  alternative: rendre l’image comme une affirmation explicite de résurrection ou comme une simple métaphore de la mémoire
  rationale: Le vers évoque l’honneur posthume et peut résonner avec l’espérance d’un relèvement, mais il ne convient pas de trancher cette tension en ajoutant une interprétation doctrinale absente de l’hébreu.
- issue: Ajout du parallèle grec « de leur lieu »
  choice: ne pas l’intégrer au corps du texte
  alternative: « Que leurs os fleurissent de leur demeure »
  rationale: La formulation n’est pas attestée dans le texte hébreu fourni. Elle est néanmoins signalée en note comme témoin parallèle susceptible d’éclairer l’image.
translation_notes:
  register: Français international moderne, digne et poétique. Le parallélisme des deux souhaits est conservé par la répétition de « Que… et que… ». L’image concrète et inhabituelle des os qui fleurissent n’est pas lissée.
