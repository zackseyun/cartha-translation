  text: And at the time of his resting on his bed[b][a], he testified before Yahweh and his anointed one.
translation:
  language: fr
  text: Et, au moment où il reposait sur son lit, il prit à témoin le SEIGNEUR et son oint[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « son oint ». Le mot hébreu appartient à la même famille que « Messie » ; dans ce contexte, il peut désigner le dirigeant que le SEIGNEUR avait consacré par l’onction à l’époque de Samuel.
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec diffère fortement ici : il dit que Samuel « écrasa les chefs de Tyr et tous les dirigeants des Philistins ». Cette leçon témoigne d’une divergence importante entre les traditions textuelles hébraïque et grecque.'
    reason: textual_variant
lexical_decisions:
- source_word: ועת
  choice: Et, au moment de
  rationale: La conjonction suivie du nom introduit le cadre temporel tout en conservant la structure concise de l’hébreu.
- source_word: נוחו
  choice: son repos
  rationale: Le terme désigne ici le fait de reposer. Cette formulation peut évoquer le dernier repos de Samuel sans expliciter « sa mort », ce que l’hébreu ne dit pas directement.
- source_word: על משכבו
  choice: sur son lit
  rationale: משכב désigne littéralement l’endroit où l’on se couche. « Lit » est naturel et évite l’interprétation plus précise de « lit de mort ».
- source_word: העיד
  choice: il prit à témoin
  rationale: Le hiphil de עוד peut signifier témoigner, avertir ou appeler quelqu’un à témoigner. Avec le SEIGNEUR et son oint comme compléments directs, « prendre à témoin » rend bien l’idée de les invoquer comme témoins.
- source_word: יהוה
  choice: le SEIGNEUR
  rationale: Le tétragramme est rendu selon la convention française par « le SEIGNEUR ».
- source_word: ומשיחו
  choice: et celui que le SEIGNEUR avait consacré par l’onction
  rationale: משיחו signifie littéralement « son oint ». La périphrase française exprime naturellement le titre et rend explicite que le possessif renvoie au SEIGNEUR, sans identifier le personnage par son nom ni lui donner d’emblée une portée eschatologique.
theological_decisions:
- issue: Portée de משיחו
  choice: celui que le SEIGNEUR avait consacré par l’onction
  alternative: son oint ; son Messie ; son roi
  rationale: La traduction conserve la notion d’onction et le statut de la personne sans remplacer le titre hébreu par un nom propre. « Messie » est lexicalement apparenté, mais risquerait en français courant d’imposer ici une lecture eschatologique que le contexte historique n’exige pas.
- issue: Fonction de העיד
  choice: prit à témoin le SEIGNEUR et son oint
  alternative: témoigna devant le SEIGNEUR et son oint
  rationale: La construction hébraïque avec ces deux compléments directs se prête à l’idée d’une invocation comme témoins. Ce choix évite toutefois de préciser le contenu du témoignage, absent du verset.
translation_notes:
  register: Français international moderne, sobre et digne. « Son repos » maintient l’éventuelle allusion au dernier repos sans transformer l’expression en mention explicite de la mort. La répétition de « le SEIGNEUR » évite l’ambiguïté pronominale qu’aurait créée une périphrase telle que « celui qu’il avait consacré ».
