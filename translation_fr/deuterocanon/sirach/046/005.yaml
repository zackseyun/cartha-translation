base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/005.yaml
  text: For he called on God Most High when his enemies pressed him from all around[a], and God Most High answered him with hailstones and ice-stones.
translation:
  language: fr
  text: Car il invoqua le Dieu Très-Haut quand ses ennemis le pressaient de toutes parts[a], et le Dieu Très-Haut lui répondit avec des pierres de grêle et des pierres de glace.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit : « le grand Seigneur l’entendit — ou les entendit — par des pierres de grêle, avec grande puissance ». Le texte hébreu est suivi ici; le grec présente une formulation plus développée de cette manifestation divine dans la tempête.'
    reason: alternative_reading
lexical_decisions:
- source_word: קרא אל
  choice: invoqua
  rationale: L’expression désigne un appel adressé à Dieu pour obtenir son secours. « Invoqua » rend ce sens de manière concise, digne et naturelle en français, en accord avec le grec ἐπεκαλέσατο.
- source_word: אל עליון
  choice: le Dieu Très-Haut
  rationale: Ce choix conserve le titre divin et l’ordre de ses éléments, tout en restant idiomatique en français. La répétition dans les deux propositions suit l’hébreu.
- source_word: כאכפה לו אויביו מסביב
  choice: quand ses ennemis le pressaient de toutes parts
  rationale: La forme verbale hébraïque est rare ou incertaine; le grec, qui évoque l’oppression exercée par des ennemis tout autour, appuie l’idée d’une pression hostile accompagnée d’encerclement.
- source_word: ויענהו
  choice: lui répondit
  rationale: Le verbe hébreu exprime ici une réponse effective de Dieu. Le grec « entendit favorablement » confirme le contexte d’un appel exaucé sans exiger de remplacer le sens direct de l’hébreu.
- source_word: באבני ברד
  choice: par des pierres de grêle
  rationale: La préposition indique vraisemblablement le moyen de la réponse divine. « Pierres de grêle » conserve l’image concrète de l’hébreu.
- source_word: וא לגביש / ואלגביש
  choice: et des blocs de glace
  rationale: Le terme rare désigne une matière ou des projectiles glacés dans des scènes de tempête. « Blocs de glace » distingue ce second élément des « pierres de grêle » sans lui imposer le sens de « foudre ».
theological_decisions:
- issue: Répétition du titre divin
  choice: Répéter « le Dieu Très-Haut » dans les deux propositions
  alternative: Employer simplement « le Très-Haut » dans la seconde proposition
  rationale: L’hébreu répète explicitement אל עליון. Cette répétition souligne que celui qui est invoqué est celui qui répond, sans ajouter d’interprétation doctrinale.
- issue: Nature de la réponse divine
  choice: Conserver les deux images météorologiques distinctes de l’hébreu
  alternative: Suivre l’expansion grecque évoquant des pierres de grêle et une grande puissance
  rationale: Le témoin hébreu est ici prioritaire et présente deux termes liés à la grêle ou à la glace. La variante grecque est signalée en note afin de préserver la tension textuelle.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. « Invoqua » convient au registre biblique tout en restant courant. « De toutes parts » exprime naturellement l’encerclement hostile. La formulation garde le parallélisme et la répétition du titre divin propres à l’hébreu.
