  text: How glorious he was when he stretched out his hand[a], when he brandished a spear against a city.
translation:
  language: fr
  text: Comme il était magnifique lorsqu’il étendait la main[a], lorsqu’il brandissait une lance contre une ville !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec parallèle dit : « Comme il fut glorifié lorsqu’il leva les mains et mania une épée contre des villes. » Le témoin hébreu porte : « lorsqu’il étendait la main » et « brandissait une lance contre une ville ».'
    reason: alternative_reading
lexical_decisions:
- source_word: מה נהדר
  choice: Comme il était magnifique
  rationale: La tournure exclamative hébraïque exprime l’admiration devant la vaillance de Josué. « Magnifique » est naturel, digne et évite de donner à « glorieux » un sens théologique plus marqué que le contexte ne l’exige.
- source_word: בנטותו יד
  choice: lorsqu’il étendait la main
  rationale: L’infinitif construit indique ici la circonstance ou le moment de l’action. La traduction conserve l’image corporelle de l’hébreu, tandis que le grec parallèle évoque plutôt le fait de lever les mains.
- source_word: בהניפו כידון
  choice: lorsqu’il brandissait une lance
  rationale: הניף désigne un mouvement d’élévation ou de balancement, bien rendu dans ce contexte guerrier par « brandir ». כידון désigne une arme d’hast, rendue sans surspécification par « lance ».
- source_word: על עיר
  choice: contre une ville
  rationale: Dans ce contexte militaire, על exprime naturellement une orientation hostile. Le singulier de l’hébreu est conservé.
theological_decisions:
- issue: Divergence entre l’hébreu et le grec quant à l’arme et au nombre de villes
  choice: 'Suivre dans le texte principal l’hébreu : « une lance contre une ville »'
  alternative: Le grec parallèle porte « une épée contre des villes »
  rationale: Le témoin hébreu, de haute confiance, est prioritaire et donne une lecture cohérente. La variante grecque est néanmoins signalée afin de préserver la divergence textuelle.
- issue: Nuance de la formule de louange
  choice: « Comme il était magnifique »
  alternative: « Comme il fut glorifié » ou « Comme il était glorieux »
  rationale: L’hébreu exprime directement l’éclat admirable de Josué, tandis que le grec peut être compris comme « il fut glorifié ». Le choix retenu rend l’admiration sans introduire de précision théologique étrangère au texte hébreu.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’exclamation initiale et le parallélisme des deux propositions temporelles sont conservés. Le texte principal suit le témoin hébreu; la note documente les divergences substantielles du grec.
