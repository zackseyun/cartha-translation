  text: In the sight of every living thing—and even after his death he was sought out.[a]
translation:
  language: fr
  text: Aux yeux de tous les vivants, même après sa mort, il fut recherché[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec développe ainsi ce passage : « Après s’être endormi, il prophétisa et révéla au roi sa fin ; depuis la terre, il éleva sa voix en prophétie, afin d’effacer l’iniquité du peuple. » Cela explique probablement l’hébreu « il fut recherché » : Samuel aurait été consulté après sa mort.'
    reason: Le grec parallèle conserve une version plus développée qui éclaire le sens possible de l’expression hébraïque sans devoir remplacer celle-ci dans le texte principal.
lexical_decisions:
- source_word: ובעיני
  choice: Aux yeux de
  rationale: Reproduit naturellement l’expression hébraïque בעיני (« aux yeux de ») et conserve son caractère public sans ajouter un jugement absent du fragment.
- source_word: כל חי
  choice: tous les vivants
  rationale: Rend littéralement la portée collective de כל חי. Dans le contexte, l’expression désigne vraisemblablement l’ensemble des personnes vivantes.
- source_word: וגם
  choice: et même
  rationale: Exprime à la fois la coordination et la progression emphatique vers ce qui s’est produit après la mort de Samuel.
- source_word: אחרי מותו
  choice: après sa mort
  rationale: Formulation française directe et idiomatique, étroitement conforme à l’hébreu.
- source_word: נדרש
  choice: il fut recherché
  rationale: Conserve le passif et l’ambiguïté du nifal de דרש, qui peut signifier « être recherché » ou « être consulté ». Le grec parallèle et le récit sous-jacent favorisent l’idée d’une consultation, explicitée dans la note sans être imposée au texte principal.
theological_decisions:
- issue: Degré d’explicitation de l’activité posthume de Samuel
  choice: 'Conserver dans le texte principal la formulation hébraïque concise et ambiguë : « après sa mort, il fut recherché »'
  alternative: 'Suivre l’expansion grecque : « après s’être endormi, il prophétisa, révéla au roi sa fin et éleva de terre sa voix en prophétie, afin d’effacer l’iniquité du peuple »'
  rationale: L’hébreu conservé a priorité et ne donne pas les détails présents dans le grec. La note transmet toutefois cet important parallèle ancien, qui éclaire probablement le sens de נדרש sans résoudre silencieusement la tension entre les témoins.
translation_notes:
  register: Français international moderne, sobre et digne. « Tous les vivants » garde la largeur de l’expression hébraïque ; « il fut recherché » est légèrement soutenu, mais préserve mieux que « il fut consulté » l’ambiguïté lexicale du texte source.
