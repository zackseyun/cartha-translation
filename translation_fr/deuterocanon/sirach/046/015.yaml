base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/015.yaml
  text: By the faithfulness of his mouth he was sought out as a seer[c][b][a], and also by his word he was found faithful as a shepherd.
translation:
  language: fr
  text: Grâce à la fiabilité de ses paroles, il fut consulté comme voyant[b] ; et, par sa parole, il fut aussi reconnu comme un berger fidèle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le second membre est condensé en hébreu. Il peut aussi se comprendre : « par sa parole, il fut reconnu fidèle comme berger ».'
    reason: textual_variant
  - marker: b
    text: Le grec porte « prophète » là où l’hébreu porte « voyant ».
    reason: alternative_reading
lexical_decisions:
- source_word: באמונת פיו
  choice: Par la fidélité de sa bouche
  rationale: אֱמוּנָה exprime ici la fidélité ou la fiabilité manifestée dans la parole. La formulation conserve l’image hébraïque de la « bouche ».
- source_word: דרוש
  choice: il fut recherché
  rationale: Le passif de דרש évoque quelqu’un que l’on recherche ou consulte. « Recherché » reste proche de l’hébreu, tout en étant naturel avec « comme voyant ».
- source_word: חזה
  choice: comme voyant
  rationale: Le terme hébreu désigne un voyant. Cette désignation plus précise est retenue plutôt que le grec προφήτης, « prophète ».
- source_word: וגם
  choice: et … aussi
  rationale: Cette disposition rend la valeur additive de la combinaison hébraïque tout en respectant l’ordre naturel du français.
- source_word: בדברו
  choice: par sa parole
  rationale: « Par sa parole » rend l’idée que sa fiabilité fut manifestée ou reconnue à travers ce qu’il disait, et forme un parallèle naturel avec « sa bouche ».
- source_word: נאמן
  choice: reconnu fidèle
  rationale: La syntaxe hébraïque est condensée. « Reconnu fidèle » explicite sobrement le sens probable, soutenu par le grec ἐγνώσθη … πιστός.
- source_word: רועה
  choice: comme berger
  rationale: Le sens concret de « berger » est conservé, sans réduire d’emblée l’image à celle d’un dirigeant.
theological_decisions:
- issue: Nuance de אמונה / πίστις
  choice: fidélité
  alternative: foi ; fiabilité
  rationale: Avec « sa bouche », l’hébreu vise plus naturellement la constance ou la fiabilité de sa parole qu’une foi intérieure.
- issue: חזה face au grec προφήτης
  choice: voyant
  alternative: prophète
  rationale: Le témoin hébreu, ici disponible et prioritaire, emploie le terme plus précis « voyant » ; la leçon grecque est signalée en note.
- issue: Syntaxe condensée du second membre
  choice: il fut aussi reconnu fidèle comme berger
  alternative: un berger fidèle ; il fut fidèle comme berger
  rationale: La formulation garde Samuel comme sujet implicite et rend intelligible la proposition elliptique sans effacer son incertitude, laquelle est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme de « sa bouche » et « sa parole » ainsi que l’image du berger sont préservés ; la ponctuation clarifie les deux membres sans résoudre excessivement la syntaxe hébraïque.
