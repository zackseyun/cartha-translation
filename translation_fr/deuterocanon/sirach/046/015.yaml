revisions:
- from: Par la fidélité de sa bouche, il fut recherché comme voyant[b] ; et, par sa parole, il fut aussi reconnu fidèle comme berger.[a]
  to: Grâce à la fiabilité de ses paroles, il fut consulté comme voyant[b] ; et, par sa parole, il fut aussi reconnu comme un berger fidèle.[a]
  rationale: La révision améliore l’idiomaticité française et précise la valeur contextuelle de דרוש, tout en maintenant les termes principaux du texte hébreu. Le second membre reste formulé avec prudence et la note conserve l’autre rattachement possible, sans trancher une syntaxe elliptique. Les ancres de notes demeurent placées immédiatement après les éléments qu’elles éclairent.
