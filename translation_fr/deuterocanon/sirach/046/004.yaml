  text: Was it not by his hand that the sun stood still[b][a], and one day was like two?
translation:
  language: fr
  text: N’est-ce pas par sa main que le soleil s’est arrêté[a], et qu’un jour fut comme deux jours[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Allusion au récit où, à la demande de Josué, le soleil s’arrête ; voir Josué 10.12-14.
    reason: cross_reference
  - marker: b
    text: 'Littéralement : « et un jour fut comme deux » ; le mot « jours » est sous-entendu après « deux » en hébreu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הלא
  choice: N’est-ce pas
  rationale: Introduit une question rhétorique appelant une réponse affirmative, dans un français naturel.
- source_word: בידו
  choice: par sa main
  rationale: Conserve l’image concrète de la main tout en exprimant l’action accomplie par son intermédiaire.
- source_word: עמד השמש
  choice: le soleil s’est arrêté
  rationale: Dans ce contexte, עמד indique l’interruption du mouvement du soleil; le parallèle grec confirme l’idée qu’il fut retenu.
- source_word: יום אחד
  choice: un seul jour
  rationale: Rend directement l’unité mise en relief par l’hébreu.
- source_word: כשנים היה
  choice: en a valu deux
  rationale: Expression française naturelle qui conserve l’ellipse hébraïque « comme deux », le mot « jours » étant sous-entendu, sans imposer l’idée plus précise d’une durée exactement doublée.
theological_decisions:
- issue: Le miracle concernant Josué et le soleil
  choice: Présenter sans atténuation l’arrêt du soleil comme l’affirmation du texte
  alternative: Y voir une hyperbole poétique décrivant la victoire ou la prolongation subjective du jour
  rationale: L’hébreu affirme que le soleil s’est arrêté et que le jour a été comme deux; la traduction ne naturalise donc pas le récit.
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde la question rhétorique, l’image de la main et l’ellipse concise de l’hébreu, tout en restant idiomatique.
