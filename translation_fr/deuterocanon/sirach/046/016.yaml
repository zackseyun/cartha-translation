  yaml_path: translation/deuterocanon/sirach/046/016.yaml
  text: He too called upon God when his enemies hemmed him in all around[a]; when he offered a milk-fed lamb[b], Yahweh thundered from heaven.
translation:
  language: fr
  text: Lui aussi invoqua Dieu quand ses ennemis le pressaient de toutes parts[a] ; lorsqu’il offrit un agneau nourri au lait[b], Yahweh tonna du ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu conservé est difficile à cet endroit. Le grec appuie le sens : « quand ses ennemis le pressaient ou l’encerclaient de toutes parts ».'
    reason: textual_variant
  - marker: b
    text: 'Ou : « un agneau de lait », c’est-à-dire un agneau encore allaité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קרא אל אל
  choice: invoqua Dieu
  rationale: L’expression désigne un appel adressé à Dieu dans la détresse, avec une nuance de prière. « Invoqua Dieu » est naturel, digne et précis en français.
- source_word: כאפכה לו אויביו מסביב
  choice: quand ses ennemis le pressaient de toutes parts
  rationale: La forme hébraïque conservée est difficile. Le grec, ἐν τῷ θλίψαι ἐχθροὺς αὐτοῦ κυκλόθεν, confirme l’idée d’ennemis qui l’oppressent ou l’encerclent. Cette formulation conserve à la fois la pression et l’encerclement sans prétendre résoudre entièrement le problème textuel.
- source_word: בעלתו
  choice: lorsqu’il offrit
  rationale: La forme hébraïque est délicate, mais le grec ἐν προσφορᾷ situe clairement l’action dans le cadre d’une offrande sacrificielle. Une tournure verbale est naturelle en français.
- source_word: טלה חלב
  choice: un agneau nourri au lait
  rationale: L’expression désigne un jeune agneau encore nourri de lait. Ce choix est transparent en français moderne et laisse en note l’équivalent plus traditionnel « agneau de lait ».
- source_word: וירעם משמים יהוה
  choice: Yahweh tonna du ciel
  rationale: Le verbe רעם exprime le tonnerre comme réponse divine. « Tonna du ciel » restitue directement l’image, et le tétragramme est rendu par « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahweh » conserve ici le nom divin plutôt que de le remplacer par un titre.
- issue: Rapport entre la prière, l’offrande et la réponse divine
  choice: Conserver la succession du texte sans expliciter de causalité supplémentaire
  alternative: Présenter le tonnerre comme une conséquence explicitement garantie par le sacrifice
  rationale: Le verset associe l’invocation, l’offrande et le tonnerre venu du ciel, mais il ne formule pas une doctrine générale ni un mécanisme sacrificiel. La traduction maintient cette tension narrative.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif sapientiel. « De toutes parts » rend naturellement l’encerclement, tandis que les notes signalent les difficultés réelles du texte hébreu.
