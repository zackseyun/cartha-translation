base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/006.yaml
  text: He hurled destruction on an enemy nation[a], and as they fled he wiped them all out, so that every nation might know their ban[b], for Yahweh watches over their battle.
translation:
  language: fr
  text: Il fondit sur une nation ennemie et, pendant qu’ils fuyaient, les fit tous périr, afin que toute nation connaisse l’interdit[a], car le SEIGNEUR observe leur combat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le mot hébreu חרם désigne ici « l’interdit » : ce qui est voué à la destruction dans le cadre d’une guerre sous le jugement divin. On pourrait aussi traduire : « afin que toute nation connaisse la destruction à laquelle elle était vouée ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec diffère sensiblement : il parle de lancer la guerre contre une nation, de faire périr « ceux qui résistaient », et dit que sa guerre était devant le Seigneur ; il ajoute aussi qu’il suivit le Puissant.'
    reason: alternative_reading
lexical_decisions:
- source_word: השליך על גוי אויב
  choice: Il déchaîna la destruction contre une nation ennemie
  rationale: השליך exprime l’action de jeter ou de lancer avec force. Comme le texte hébreu est elliptique et n’énonce pas clairement l’objet lancé, « déchaîna la destruction » restitue naturellement en français la violence de l’action dans ce contexte guerrier, sans reprendre servilement une construction obscure.
- source_word: ובנוסם
  choice: pendant qu’ils fuyaient
  rationale: 'La construction indique la circonstance temporelle : la destruction se produit au cours de leur fuite.'
- source_word: האביד כולם
  choice: il les extermina tous
  rationale: Le hifil de אבד signifie faire périr ou détruire. « Extermina » exprime ici la destruction totale indiquée par כולם, dans un registre soutenu et guerrier.
- source_word: למען דעת כל גוי
  choice: afin que toute nation connaisse
  rationale: Cette formulation rend clairement la proposition de but et conserve la valeur distributive de כל גוי.
- source_word: חרם
  choice: l’interdit
  rationale: חרם est un terme technique de guerre sacrée désignant ce qui est voué à Dieu et, dans ce contexte, voué à la destruction. « L’interdit » en conserve la brièveté et la charge particulière, expliquées en note.
- source_word: כי צופה
  choice: car … veille sur
  rationale: צפה signifie observer, guetter ou surveiller. « Veille sur » convient au cadre militaire tout en laissant ouverte la nature exacte de cette surveillance.
- source_word: יהוה
  choice: le SEIGNEUR
  rationale: La graphie en petites capitales signale en français biblique que « SEIGNEUR » représente le nom divin יהוה, sans imposer une vocalisation incertaine.
- source_word: מלחמתם
  choice: leur combat
  rationale: Le suffixe pluriel est conservé par « leur » et « combat » convient à la scène immédiate, tout en pouvant désigner plus largement leur guerre.
theological_decisions:
- issue: Sens de חרם dans une proposition hébraïque concise et difficile
  choice: Conserver « l’interdit » dans le texte et en expliciter le sens guerrier dans une note.
  alternative: « la destruction à laquelle ils étaient voués » ou « leur extermination consacrée »
  rationale: Le terme associe consécration et destruction sous le jugement divin. Une paraphrase dans le texte trancherait trop nettement une expression hébraïque comprimée; la note préserve sa portée sans effacer sa tension.
- issue: Rapport entre le témoin hébreu et le parallèle grec divergent
  choice: Suivre l’hébreu dans le texte principal et signaler la divergence grecque en note.
  alternative: 'Suivre le grec : guerre déclenchée contre une nation, destruction de ceux qui résistaient, et combat livré devant le Seigneur.'
  rationale: L’hébreu conservé est le témoin principal ici. Le grec apporte toutefois une lecture ancienne substantiellement différente qui mérite d’être documentée sans être fusionnée avec le texte hébreu.
translation_notes:
  register: Français international actuel, clair et digne. Le registre reste soutenu sans archaïsmes. « Extermina » assume la violence explicite du contexte militaire; « l’interdit » conserve le terme théologique compact de l’hébreu, avec explication en note.
