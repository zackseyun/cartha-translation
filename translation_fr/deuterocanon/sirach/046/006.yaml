revisions:
- from: Il déchaîna la destruction contre une nation ennemie et, pendant qu’ils fuyaient, il les extermina tous, afin que toute nation connaisse l’interdit[a], car le SEIGNEUR veille sur leur combat.[b]
  to: Il fondit sur une nation ennemie et, pendant qu’ils fuyaient, les fit tous périr, afin que toute nation connaisse l’interdit[a], car le SEIGNEUR observe leur combat.[b]
  rationale: La révision supprime la nuance protectrice ajoutée par « veille sur » et emploie une expression française plus neutre pour la destruction totale. Elle maintient l’hébreu comme base, conserve l’ellipse initiale sans lui assigner explicitement « la destruction », et documente sobrement le parallèle grec divergent.
