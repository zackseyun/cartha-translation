base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/001.yaml
  text: Joshua son of Nun was a mighty warrior[a], Moses’ attendant in prophecy[b]; he was appointed in his days to be a great salvation for his chosen ones.
translation:
  language: fr
  text: Josué, fils de Noun, était un vaillant guerrier, l’assistant de Moïse dans la prophétie[a]. Il fut formé en son temps pour être un grand salut pour ses élus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « le successeur de Moïse dans les prophéties » et présente ainsi plus explicitement Josué comme le successeur de Moïse.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « pour ses élus ». Le pronom renvoie vraisemblablement à Dieu, sans que l’hébreu le précise expressément. « Un grand salut » peut aussi se traduire par « une grande délivrance » ou « une grande victoire ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גבור בן חיל
  choice: un vaillant guerrier
  rationale: Cette expression hébraïque associe l’idée de puissance à celle de bravoure; le grec « puissant dans la guerre » confirme son sens militaire.
- source_word: משרת משה
  choice: l’assistant de Moïse
  rationale: משרת désigne ici celui qui sert Moïse dans une fonction d’aide officielle. « Assistant » est naturel en français moderne et évite les connotations ecclésiastiques de « ministre ».
- source_word: בנבואה
  choice: dans la prophétie
  rationale: La formule hébraïque est concise et ambiguë. Cette traduction conserve son caractère ouvert sans lui imposer la notion plus explicite de succession présente dans le grec.
- source_word: אשר נוצר
  choice: il fut formé
  rationale: Le passif hébreu signifie vraisemblablement « être formé, façonné ». Cette formulation peut évoquer une préparation divine sans remplacer le terme par l’interprétation « établi ».
- source_word: להיות בימיו
  choice: en son temps, pour apporter
  rationale: Cette tournure française restitue l’élément temporel et exprime naturellement la fonction à laquelle Josué fut formé.
- source_word: תשועה גדולה
  choice: un grand salut
  rationale: תשועה peut désigner le salut, la délivrance ou la victoire. « Salut » en maintient l’ampleur sémantique, tandis qu’une note signale les nuances militaires possibles.
- source_word: לבחיריו
  choice: à ceux que Dieu avait choisis
  rationale: Le suffixe possessif renvoie vraisemblablement à Dieu plutôt qu’à Josué. Le français exige une clarification pour éviter que « ses élus » soit spontanément rattaché à Josué; la note signale néanmoins la forme littérale et son ambiguïté grammaticale.
theological_decisions:
- issue: Rapport de Josué à Moïse dans בנבואה
  choice: Conserver « l’assistant de Moïse dans la prophétie » dans le texte principal.
  alternative: « le successeur de Moïse dans les prophéties »
  rationale: Le grec explicite une succession, mais l’hébreu conservé porte משרת, « assistant/serviteur ». La traduction principale suit donc l’hébreu et place la variante grecque en note.
- issue: Portée de תשועה
  choice: Traduire par « salut ».
  alternative: « délivrance » ou « victoire »
  rationale: Le contexte est militaire, mais le terme hébreu, comme son parallèle grec, possède une portée plus large que la seule victoire au combat.
- issue: Référent du suffixe dans לבחיריו
  choice: Expliciter Dieu dans le texte français.
  alternative: « à ses élus », en conservant l’ambiguïté grammaticale du suffixe
  rationale: Le sens contextuel le plus probable est le peuple choisi par Dieu. L’explicitation évite en français un rattachement trompeur à Josué, tout en documentant l’ambiguïté formelle en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu tout en évitant une tournure artificielle. Les variantes grecques et les ambiguïtés lexicales importantes sont conservées en notes.
