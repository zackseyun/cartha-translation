translation:
  language: fr
  text: afin que tous les descendants de Jacob sachent qu’il est bon de suivre le SEIGNEUR sans réserve[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « tous les fils d’Israël » au lieu de « tous les descendants de Jacob ».
    reason: alternative_reading
  - marker: b
    text: L’expression hébraïque rendue par « suivre le SEIGNEUR sans réserve » est inhabituelle ici ; le grec exprime l’idée de marcher à la suite du Seigneur.
    reason: textual_variant
lexical_decisions:
- source_word: למען דעת
  choice: afin que … sachent
  rationale: La tournure exprime le but ou le résultat visé. Le subjonctif après « afin que » est naturel en français et rend la connaissance attendue.
- source_word: כל זרע יעקב
  choice: tous les descendants de Jacob
  rationale: זרע signifie littéralement « semence », mais désigne collectivement ici la descendance. « Descendants » est clair et naturel, tout en maintenant « Jacob » conformément au témoin hébreu.
- source_word: כי טוב
  choice: qu’il est bon
  rationale: La proposition donne le contenu de ce que les descendants doivent savoir et conserve explicitement l’évaluation positive.
- source_word: למלא אחרי
  choice: suivre pleinement
  rationale: L’expression hébraïque évoque le fait de suivre avec plénitude ou sans réserve. Cette formulation garde à la fois l’idée de mouvement à la suite de quelqu’un et la force possible de מלא, sans réduire le sens à la seule obéissance abstraite.
- source_word: יהוה
  choice: le SEIGNEUR
  rationale: Le tétragramme est rendu selon la convention française révérencielle « le SEIGNEUR », avec capitales, plutôt que par une vocalisation conjecturale.
theological_decisions:
- issue: Jacob dans l’hébreu ou Israël dans le grec
  choice: tous les descendants de Jacob
  alternative: tous les fils d’Israël
  rationale: Le témoin hébreu conservé porte « toute la descendance de Jacob » et reste prioritaire. La leçon grecque proche mais distincte est signalée en note afin de ne pas masquer la variation textuelle.
- issue: Portée de l’expression למלא אחרי
  choice: suivre pleinement le SEIGNEUR
  alternative: marcher à la suite du Seigneur
  rationale: L’hébreu peut suggérer une adhésion entière, tandis que le grec soutient clairement la métaphore consistant à marcher derrière le Seigneur. Le texte principal conserve les deux dimensions autant que le permet un français naturel, et la note expose la difficulté.
translation_notes:
  register: Français international actuel, sobre et digne. La syntaxe reste accessible, tandis que les notes préservent les variantes et l’incertitude de l’expression hébraïque.
