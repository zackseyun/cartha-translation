  text: Wisdom will praise herself[c][b][a], and in the midst of her people she will boast.
translation:
  language: fr
  text: La Sagesse fera son propre éloge[a] et se glorifiera[b] au milieu de son peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « louera son âme » ; l’expression grecque peut avoir ici un sens réfléchi : « se louera elle-même ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « se vantera » ; le verbe grec peut désigner le fait de se glorifier ou de proclamer fièrement ses mérites.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡ σοφία
  choice: la Sagesse
  rationale: La majuscule et le féminin maintiennent la personnification qui structure le chapitre.
- source_word: αἰνέσει ψυχὴν αὐτῆς
  choice: fera son propre éloge
  rationale: Littéralement « louera son âme » ; ψυχὴν αὐτῆς fonctionne ici comme une tournure réfléchie. Cette formulation française rend naturellement l'idée sans dissocier la Sagesse de sa personne.
- source_word: ἐν μέσῳ λαοῦ αὐτῆς
  choice: au milieu de son peuple
  rationale: Cette traduction conserve à la fois l'image spatiale de ἐν μέσῳ et le possessif explicite du grec.
- source_word: καυχήσεται
  choice: se glorifiera
  rationale: Le verbe peut exprimer le fait de se glorifier, de tirer fierté ou de se vanter publiquement. « Se glorifiera » conserve une certaine ambiguïté quant à la nuance évaluative.
theological_decisions:
- issue: Personnification de la Sagesse
  choice: Employer le féminin et écrire « Sagesse » avec une majuscule
  alternative: Traiter la sagesse comme une qualité abstraite sans majuscule
  rationale: La grammaire grecque et la prise de parole développée dans le chapitre présentent la Sagesse comme une figure féminine personnifiée ; la traduction conserve cette tension littéraire et théologique sans l’identifier davantage.
- issue: Portée de καυχήσεται
  choice: se glorifiera
  alternative: se vantera
  rationale: « Se glorifiera » permet de garder la possibilité d’une proclamation publique et fière sans imposer d’emblée la connotation morale négative souvent attachée à « se vanter ».
translation_notes:
  register: Français international moderne, digne et accessible. « Faire son propre éloge » évite le calque peu naturel « louer son âme », tandis que « se glorifier » préserve l’ambivalence du verbe grec.
