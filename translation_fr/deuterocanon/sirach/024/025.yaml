  text: It fills with wisdom like the Pishon[d][c][b][a], and like the Tigris in the days of firstfruits.
translation:
  language: fr
  text: Il fait abonder la sagesse comme le Pishôn, et comme le Tigre à la saison des récoltes nouvelles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux jours des choses nouvelles »; l’expression grecque peut aussi désigner le temps des nouveaux produits, des prémices ou de la nouvelle croissance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιπλῶν
  choice: Il fait abonder
  rationale: Le participe actif désigne celui qui remplit ou répand en abondance. « Fait abonder » garde la valeur active et s’accorde avec l’image de fleuves au débit abondant, sans présenter la sagesse elle-même comme un récipient.
- source_word: ὡς Φισὼν
  choice: comme le Pishôn
  rationale: Le nom traditionnel du fleuve est conservé sous sa forme française, avec l’article normalement employé devant les noms de cours d’eau.
- source_word: σοφίαν
  choice: la sagesse
  rationale: Traduction usuelle de σοφίαν. La minuscule évite d’imposer par la typographie une interprétation supplémentaire, tout en laissant intacte la personnification présente dans le chapitre.
- source_word: ὡς Τίγρις
  choice: comme le Tigre
  rationale: « Le Tigre » est le nom français usuel de ce fleuve.
- source_word: ἐν ἡμέραις νέων
  choice: à la saison des récoltes nouvelles
  rationale: Littéralement, l’expression parle des « jours des choses nouvelles ». Dans le contexte fluvial et agricole, elle évoque vraisemblablement les nouveaux produits ou la nouvelle récolte; « saison » rend idiomatiquement ἐν ἡμέραις sans préciser indûment qu’il s’agit de prémices cultuelles.
theological_decisions:
- issue: Sujet masculin et image de la sagesse
  choice: Employer « Il » en renvoi au sujet masculin du contexte, et écrire « sagesse » avec une minuscule
  alternative: Faire de la Sagesse personnifiée le sujet explicite ou écrire « Sagesse » avec une majuscule
  rationale: Le grec porte un participe masculin substantivé, dont l’antécédent dépend du contexte, tandis que σοφίαν est son complément à l’accusatif. La traduction ne transforme donc pas la sagesse en sujet et ne renforce pas la personnification par une majuscule interprétative.
translation_notes:
  register: Français moderne, digne et fluide. « Fait abonder » préserve l’action du participe et l’image de profusion des fleuves. La formulation garde visible l’incertitude de la dernière expression grâce à une note.
