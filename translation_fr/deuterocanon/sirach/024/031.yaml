  text: I said[a], ‘I will water my garden, and I will drench my garden bed.’ And behold, my channel became a river[c][b], and my river became a sea.
translation:
  language: fr
  text: 'J’ai dit : « J’arroserai mon jardin et j’imbiberai d’eau ma parcelle de jardin[a]. » Et voici que mon canal est devenu un fleuve, et mon fleuve est devenu une mer[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma planche cultivée ». Le grec désigne une petite parcelle de jardin mise en culture.
    reason: lexical_alternative
  - marker: b
    text: L’image progresse d’un canal d’irrigation à un fleuve, puis à une mer, et exprime ainsi une croissance extraordinaire.
    reason: literary_note
lexical_decisions:
- source_word: Ποτιῶ
  choice: J’arroserai
  rationale: Le futur de ποτίζω/ποτίω évoque ici l’apport d’eau à un jardin. « Arroser » est naturel en français moderne et conserve clairement l’image agricole.
- source_word: κῆπον
  choice: mon jardin
  rationale: κῆπος désigne couramment un jardin. Le possessif français rend le génitif enclitique μου de façon idiomatique.
- source_word: μεθύσω
  choice: je gorgerai d’eau
  rationale: Le verbe exprime littéralement l’idée d’enivrer ou de saturer. Dans ce contexte d’irrigation, « gorger d’eau » en restitue l’intensité sans introduire une ivresse littérale.
- source_word: πρασιάν
  choice: mon carré de culture
  rationale: πρασιά désigne une parcelle ou une planche cultivée. « Carré de culture » reste compréhensible et évite de limiter l’image à un parterre ornemental de fleurs.
- source_word: ἰδοὺ
  choice: Et voici que
  rationale: Cette tournure conserve l’effet de constat soudain et le relief rhétorique du grec tout en restant naturelle dans un registre biblique moderne.
- source_word: διῶρυξ
  choice: mon canal
  rationale: διῶρυξ désigne un cours d’eau creusé, notamment pour l’irrigation. « Canal » rend son caractère aménagé et prépare le contraste avec le fleuve.
- source_word: ποταμόν
  choice: un fleuve
  rationale: ποταμός désigne un cours d’eau important. « Fleuve » souligne ici l’accroissement spectaculaire par rapport au petit canal d’irrigation, sans exiger qu’il soit question d’un référent géographique précis.
- source_word: θάλασσαν
  choice: une mer
  rationale: Traduction directe de θάλασσα avec l’indéfini, qui respecte l’absence d’article grec et ne désigne aucune mer particulière.
theological_decisions:
- issue: Portée symbolique de l’expansion de l’eau
  choice: Conserver dans le texte l’image concrète du jardin, du canal, du fleuve et de la mer sans l’interpréter explicitement.
  alternative: Expliquer l’image comme la diffusion universelle de la sagesse ou de son enseignement.
  rationale: Le verset produit une image de croissance extraordinaire, mais n’en donne pas ici une interprétation doctrinale explicite. La traduction préserve donc cette ouverture.
translation_notes:
  register: Français international moderne, clair et digne. « Gorger d’eau » préserve la vigueur du grec; « carré de culture » maintient le caractère agricole de πρασιά. La répétition « est devenu » reproduit le parallélisme de la phrase grecque.
