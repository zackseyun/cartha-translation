  text: Like a terebinth I spread out my branches[d][c][b][a], and my branches are branches of glory and grace.
translation:
  language: fr
  text: Comme un térébinthe[a], j’ai étendu[b] mes branches, et mes branches sont des branches de gloire et de grâce[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le térébinthe est un grand arbre fréquent dans l’imagerie biblique. Certains traduisent plus généralement par « chêne », mais le grec nomme précisément le térébinthe.
    reason: cultural_note
  - marker: b
    text: 'Ou : « j’ai déployé mes branches ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « de gloire et de faveur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τερέβινθος
  choice: térébinthe
  rationale: Le grec désigne précisément le térébinthe. Ce nom d’arbre conserve l’image botanique biblique sans la généraliser en « chêne ».
- source_word: ἐξέτεινα
  choice: j’ai étendu
  rationale: Le verbe exprime un déploiement vers l’extérieur. « J’ai étendu » reste proche du grec tout en convenant naturellement aux branches d’un arbre.
- source_word: κλάδους / κλάδοι
  choice: branches
  rationale: « Branches » est le terme français courant et précis. Sa répétition préserve l’insistance poétique du grec.
- source_word: δόξης
  choice: gloire
  rationale: « Gloire » maintient le registre élevé et la portée ample de δόξα, sans réduire le terme au seul éclat visuel.
- source_word: χάριτος
  choice: grâce
  rationale: « Grâce » conserve la richesse de χάρις, qui peut évoquer la faveur aussi bien que l’agrément, et forme avec « gloire » une expression poétique naturelle.
theological_decisions:
- issue: Description poétique de la Sagesse par l’image de ses branches
  choice: Conserver directement la métaphore et la répétition de « branches »
  alternative: Rendre l’expression par « mes branches sont glorieuses et pleines de grâce »
  rationale: Le grec répète κλάδοι et construit littéralement « des branches de gloire et de grâce ». Maintenir cette formulation préserve la force poétique et évite une interprétation adjectivale qui aplanirait le texte.
translation_notes:
  register: Français international moderne, poétique et digne. L’ordre initial de la comparaison suit le grec et soutient l’anaphore végétale du passage. La répétition volontaire de « branches » est conservée.
