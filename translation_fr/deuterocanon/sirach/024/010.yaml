  text: In the holy tent I ministered before him[b][a], and so I was established in Zion.
translation:
  language: fr
  text: Dans la Tente sainte, j’ai accompli le service sacré devant lui, et c’est ainsi que j’ai été établie en Sion.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκηνῇ ἁγίᾳ
  choice: la Tente sainte
  rationale: σκηνή désigne concrètement une tente ou la Demeure cultuelle. « Tente sainte » conserve cette image tout en restant accessible; la majuscule signale ici le sanctuaire sans remplacer l’image grecque par une interprétation.
- source_word: ἐνώπιον αὐτοῦ
  choice: devant lui
  rationale: Rend directement le sens spatial et relationnel de l’expression grecque, sans préciser davantage le référent fourni par le contexte.
- source_word: ἐλειτούργησα
  choice: j’ai accompli le service sacré
  rationale: Dans ce contexte cultuel, λειτουργέω désigne l’exercice d’un service religieux. Cette formulation garde la nuance sacrée sans attribuer explicitement à la Sagesse un office sacerdotal déterminé.
- source_word: οὕτως
  choice: c’est ainsi que
  rationale: Exprime naturellement en français le lien entre le service précédent et l’établissement en Sion, tout en laissant ouverte la nuance exacte, modale ou résultative.
- source_word: ἐστηρίχθην
  choice: j’ai été établie
  rationale: Le passif de στηρίζω évoque le fait d’être affermie, fixée ou établie. Le féminin correspond à la Sagesse personnifiée, nom féminin en français comme dans le contexte grec.
- source_word: Σειὼν
  choice: Sion
  rationale: « Sion » est la forme française traditionnelle et immédiatement reconnaissable du nom propre.
theological_decisions:
- issue: Nuance cultuelle du service accompli par la Sagesse
  choice: j’ai accompli le service sacré
  alternative: j’ai officié; j’ai servi
  rationale: Le verbe grec porte une nuance cultuelle réelle, mais n’attribue pas explicitement un titre ou un office sacerdotal précis à la Sagesse. La traduction conserve cette résonance sans la surdéterminer.
- issue: Relation exprimée par οὕτως entre les deux propositions
  choice: c’est ainsi que
  alternative: ainsi; et alors
  rationale: Cette tournure préserve le lien étroit avec le service dans la Tente, sans décider de manière excessive s’il s’agit strictement du moyen, de la conséquence ou de la progression narrative.
translation_notes:
  register: Français moderne, digne et fluide. La formulation conserve l’imagerie cultuelle concrète, la voix de la Sagesse personnifiée et la sobriété du grec. Aucun marqueur de note n’est requis, puisque les variantes lexicales ne sont pas indispensables à la compréhension du verset.
