  text: Come to me[a], you who desire me[b], and be filled with my fruits.
translation:
  language: fr
  text: Venez à moi, vous qui me désirez[a], et remplissez-vous de mes fruits[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui aspirez à moi ». Le participe grec exprime un désir intense.
    reason: lexical_alternative
  - marker: b
    text: Ou « de ce que je produis » ou « de ma récolte ». Le grec désigne ce qui est produit ; « fruits » conserve l’image poétique environnante de la Sagesse comme plante féconde.
    reason: lexical_alternative
lexical_decisions:
- source_word: προέλθετέ πρὸς μέ
  choice: Venez à moi
  rationale: L’impératif pluriel et la locution directionnelle forment ici une invitation à s’approcher de la Sagesse. « Venez à moi » est naturel en français et n’ajoute aucune précision absente du grec.
- source_word: οἱ ἐπιθυμοῦντές μου
  choice: vous qui me désirez
  rationale: Le participe exprime un désir marqué. « Désirez » en donne l’équivalent direct tout en laissant ouverte la nature de ce désir envers la Sagesse personnifiée.
- source_word: ἀπὸ τῶν γενημάτων μου
  choice: de mes fruits
  rationale: γένημα désigne ce qui est produit, notamment un fruit ou une récolte. « Fruits » maintient l’image végétale et féconde du contexte poétique.
- source_word: ἐμπλήσθητε
  choice: remplissez-vous
  rationale: Cet impératif aoriste passif signifie littéralement « soyez remplis ». Avec « de mes fruits », la tournure pronominale « remplissez-vous » est plus idiomatique en français tout en conservant l’image d’abondance, sans la réduire à la seule idée de satisfaction.
theological_decisions:
- issue: Invitation de la Sagesse personnifiée
  choice: Conserver la parole à la première personne et l’image des fruits sans les expliquer dans le corps du texte.
  alternative: Identifier explicitement les « fruits » à l’enseignement ou aux bienfaits de la sagesse.
  rationale: Le grec présente la Sagesse comme une personne qui invite ceux qui la désirent à se remplir de ses fruits. La traduction préserve cette métaphore et sa portée théologique ouverte sans y importer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. L’impératif pluriel maintient l’adresse collective. Les marqueurs de notes sont placés immédiatement après les expressions auxquelles ils se rapportent.
