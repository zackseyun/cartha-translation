  text: I came forth from the mouth of the Most High, and like a mist I covered the earth;
translation:
  language: fr
  text: Moi, je suis sortie de la bouche du Très-Haut, et, comme une brume, j’ai couvert la terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγώ
  choice: Moi, je
  rationale: La dislocation « Moi, je » rend l’insistance du pronom grec exprimé et convient à la déclaration solennelle de la Sagesse personnifiée.
- source_word: ἀπὸ στόματος
  choice: de la bouche de
  rationale: Cette formulation directe conserve l’image de la parole et de l’origine, tout en restant naturelle en français moderne.
- source_word: Ὑψίστου
  choice: du Très-Haut
  rationale: « Le Très-Haut » est le titre divin biblique traditionnel et immédiatement reconnaissable en français.
- source_word: ἐξῆλθον
  choice: je suis sortie
  rationale: L’aoriste de ἐξέρχομαι indique ici que la Sagesse est venue de la bouche du Très-Haut. Le féminin grammatical rend explicite que la voix est celle de la Sagesse personnifiée, sans préciser davantage la nature de cette origine.
- source_word: ὡς ὁμίχλη
  choice: comme une brume
  rationale: ὁμίχλη désigne la brume ou le brouillard. « Brume » garde le caractère ample et poétique de l’image.
- source_word: κατεκάλυψα
  choice: j’ai couvert
  rationale: Le verbe signifie couvrir entièrement ou recouvrir. « J’ai couvert » restitue directement l’image sans ajouter l’idée d’enveloppement ou de diffusion.
- source_word: γῆν
  choice: la terre
  rationale: Dans ce cadre cosmique et poétique, γῆ désigne la terre dans son ensemble plutôt qu’un territoire particulier.
theological_decisions:
- issue: L’origine de la Sagesse personnifiée en Dieu
  choice: « je suis sortie de la bouche du Très-Haut »
  alternative: « j’ai été prononcée par le Très-Haut » ou « je suis issue de l’ordre du Très-Haut »
  rationale: Le grec fait parler la Sagesse à la première personne et associe son origine à la bouche de Dieu. La traduction maintient cette image et sa tension théologique, sans la réduire à une simple parole prononcée ni lui imposer une catégorie doctrinale.
translation_notes:
  register: Français international moderne, poétique et digne. La ponctuation souligne la comparaison sans alourdir la phrase. Le féminin « sortie » correspond à la Sagesse personnifiée, implicite dans le contexte du chapitre.
