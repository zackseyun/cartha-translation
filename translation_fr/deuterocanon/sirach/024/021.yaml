  text: Those who eat me will still hunger[a], and those who drink me will still thirst.
translation:
  language: fr
  text: Ceux qui me mangent auront encore faim[a], et ceux qui me boivent auront encore soif.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « auront faim d’en manger davantage… auront soif d’en boire davantage ». Littéralement, le grec dit « auront encore faim » et « auront encore soif » ; ces mots peuvent exprimer un désir persistant de la Sagesse après y avoir goûté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐσθίοντές με
  choice: Ceux qui me mangent
  rationale: Le participe présent substantivé désigne de façon générale ceux qui mangent. Le pronom « me » maintient sans l’expliquer la personnification et la métaphore de la Sagesse.
- source_word: ἔτι
  choice: encore
  rationale: « Encore » exprime naturellement en français la persistance de la faim et de la soif après avoir goûté à la Sagesse.
- source_word: πεινάσουσιν
  choice: auront encore faim
  rationale: Cette tournure française courante rend le futur grec tout en conservant directement l’image paradoxale de la faim.
- source_word: οἱ πίνοντές με
  choice: ceux qui me boivent
  rationale: La formulation parallèle conserve le participe substantivé et l’objet direct « me ». Malgré son caractère imagé, « me boire » est intelligible et préserve la force de la personnification.
- source_word: διψήσουσιν
  choice: auront encore soif
  rationale: La tournure idiomatique française rend le futur et maintient le parallélisme avec « auront encore faim ».
theological_decisions:
- issue: Le paradoxe selon lequel ceux qui prennent part à la Sagesse ont encore faim et soif
  choice: Conserver littéralement l’image de la faim et de la soif persistantes.
  alternative: « auront faim d’en recevoir davantage » et « auront soif d’en boire davantage »
  rationale: Le grec énonce directement le paradoxe sans préciser « davantage ». L’explication possible d’un désir renouvelé pour la Sagesse est signalée en note plutôt qu’intégrée au texte.
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme des deux propositions et la métaphore directe de la Sagesse mangée et bue sont conservés.
