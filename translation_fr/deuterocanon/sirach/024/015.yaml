base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/024/015.yaml
  text: Like cinnamon and aspalathus[a], I gave forth a scent of spices, and like choice myrrh I spread fragrance, like galbanum and onycha and stacte[e][d][c][b], and like the smoke of frankincense in the tabernacle.
translation:
  language: fr
  text: Comme la cannelle et l’aspalathe[a], j’ai exhalé un parfum d’aromates ; comme une myrrhe de choix, j’ai répandu une odeur agréable, comme le galbanum, l’onycha et le stacté[b], et comme la fumée de l’encens dans la Tente[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’aspalathe est une plante aromatique dont l’identification exacte est incertaine.
    reason: cultural_note
  - marker: b
    text: L’onycha et le stacté sont des substances aromatiques entrant dans la composition de parfums ou d’encens.
    reason: cultural_note
  - marker: c
    text: Ou « dans le Tabernacle ». Le grec dit littéralement « dans la tente » ; dans ce contexte d’encens, il évoque probablement la Tente-sanctuaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: κιννάμωμον
  choice: cannelle
  rationale: Le terme grec désigne ordinairement la cannelle ; cette équivalence est précise et immédiatement compréhensible.
- source_word: ἀσπάλαθος
  choice: aspalathe
  rationale: L’identification botanique demeure incertaine. La translittération française évite une précision trompeuse tout en conservant le nom particulier de l’aromate.
- source_word: ἀρωμάτων
  choice: d’aromates
  rationale: Le génitif précise la nature du parfum exhalé. « Aromates » convient au contexte poétique et cultuel.
- source_word: δέδωκα ὀσμήν
  choice: j’ai exhalé un parfum
  rationale: Cette formulation française naturelle rend l’idée de produire ou de dégager une odeur, sans calquer maladroitement le grec.
- source_word: σμύρνα ἐκλεκτή
  choice: une myrrhe de choix
  rationale: ἐκλεκτή signifie sélectionnée ou de qualité choisie ; « de choix » conserve cette nuance dans un registre digne.
- source_word: διέδωκα εὐωδίαν
  choice: j’ai répandu une odeur agréable
  rationale: εὐωδία désigne une odeur plaisante. « Odeur agréable » distingue cette expression du premier « parfum » et rend explicitement la valeur positive du mot grec.
- source_word: χαλβάνη
  choice: galbanum
  rationale: C’est le nom français usuel de cette gomme-résine aromatique et il préserve le vocabulaire spécifique de l’encens.
- source_word: ὄνυξ
  choice: onycha
  rationale: Dans une liste d’ingrédients aromatiques, le mot désigne l’onycha plutôt que la pierre d’onyx ; ce choix évite une lecture minéralogique trompeuse.
- source_word: στακτή
  choice: stacté
  rationale: Ce terme français traditionnel conserve le nom spécifique de la substance aromatique plutôt que de le remplacer par une glose incertaine.
- source_word: λίβανου ἀτμίς
  choice: la fumée de l’encens
  rationale: Dans ce contexte où l’encens est brûlé, « fumée » rend naturellement ἀτμίς. λίβανος désigne ici l’encens, c’est-à-dire l’oliban.
- source_word: ἐν σκηνῇ
  choice: dans la Tente
  rationale: σκηνή signifie littéralement « tente » et, dans ce cadre cultuel, évoque la Tente-sanctuaire. La majuscule signale cette référence sans substituer directement l’interprétation « Tabernacle » au mot grec.
theological_decisions:
- issue: Portée cultuelle de σκηνή
  choice: dans la Tente
  alternative: dans le Tabernacle
  rationale: Les ingrédients d’encens donnent au passage une nette coloration cultuelle, mais σκηνή reste lexicalement « tente ». Le texte principal maintient cette formulation et la note explicite l’allusion probable au sanctuaire, sans effacer la tension entre sens lexical et référent cultuel.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme de la série aromatique est conservé, tandis que des verbes naturels (« exhalé », « répandu ») évitent un calque du grec. Les termes rares nécessaires sont expliqués en notes.
