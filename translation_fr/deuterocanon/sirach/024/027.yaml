  text: It makes instruction shine forth like light[b][a], like the Gihon in the days of the grape harvest.
translation:
  language: fr
  text: Elle[a] fait resplendir l’instruction comme la lumière, comme le Guihôn au temps des vendanges.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Celui qui fait resplendir l’instruction comme la lumière. » Dans le contexte, cette expression décrit la Loi mentionnée au verset 23.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐκφαίνων
  choice: Elle fait resplendir
  rationale: Le participe grec substantivé poursuit, dans le contexte, la description de la Loi mentionnée au verset 23. Le pronom féminin « elle » reprend donc naturellement « la Loi » en français, tandis que « fait resplendir » rend la valeur causative de ἐκφαίνων.
- source_word: ὡς φῶς
  choice: comme la lumière
  rationale: Cette formulation conserve la comparaison introduite par ὡς dans un français naturel.
- source_word: παιδείαν
  choice: l’instruction
  rationale: Dans le Siracide, παιδεία désigne une formation qui instruit et façonne. « Instruction » exprime clairement ce sens sans réduire le terme à une discipline punitive.
- source_word: ὡς Γηὼν
  choice: comme le Guihôn
  rationale: « Guihôn » est la forme française usuelle du nom du fleuve; l’article défini convient naturellement devant un nom de cours d’eau.
- source_word: ἐν ἡμέραις τρυγητοῦ
  choice: au temps des vendanges
  rationale: τρυγητός désigne précisément la récolte du raisin. « Au temps des vendanges » est idiomatique et garde cette précision agricole.
theological_decisions:
- issue: Référent du participe substantivé ὁ ἐκφαίνων
  choice: « Elle », renvoyant à la Loi du verset 23
  alternative: « Celui qui fait resplendir… »
  rationale: Les participes des versets 25 à 27 décrivent la Loi. Employer « il » pourrait faire croire à tort que Dieu est ici le sujet explicite. La note conserve toutefois la forme plus littérale et l’ambiguïté possible du grec pris isolément.
translation_notes:
  register: Français moderne, clair et digne. « Resplendir » maintient l’image lumineuse tout en restant courant dans un registre biblique accessible; « au temps des vendanges » est plus naturel que « aux jours de la vendange ».
