  text: I made my dwelling in the heights[a], and my throne was in a pillar of cloud;
translation:
  language: fr
  text: J’ai établi ma demeure dans les hauteurs, et mon trône était dans une colonne de nuée.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la colonne de nuée ». Le grec dit littéralement « dans une colonne de nuée », mais l’expression évoque probablement la colonne de nuée associée à la présence et à la conduite de Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσκήνωσα
  choice: J’ai établi ma demeure
  rationale: Rend l’idée de s’installer et de demeurer, tout en laissant percevoir l’image sous-jacente d’un campement, sans recourir à une tournure artificielle comme « j’ai dressé ma tente ».
- source_word: ἐν ὑψηλοῖς
  choice: dans les hauteurs
  rationale: Conserve le pluriel et le sens spatial, probablement céleste, de l’adjectif substantivé.
- source_word: θρόνος
  choice: trône
  rationale: Préserve explicitement l’imagerie royale et exaltée du grec.
- source_word: ἐν στύλῳ νεφέλης
  choice: dans une colonne de nuée
  rationale: Reproduit naturellement l’image biblique et respecte l’absence d’article en grec. « Nuée » maintient le registre théophanique sans ajouter d’explication dans le texte.
theological_decisions:
- issue: Allusion à la manifestation divine qui guidait Israël sous la forme d’une colonne de nuée
  choice: une colonne de nuée
  alternative: la colonne de nuée
  rationale: Le grec est sans article, mais l’expression évoque probablement la colonne de nuée bien connue du récit de l’Exode. Le texte principal conserve la forme indéfinie, tandis que la note signale l’allusion possible sans la rendre obligatoire.
translation_notes:
  register: Français international moderne, naturel et digne. « Établir ma demeure » exprime une résidence durable; « colonne de nuée » conserve le registre biblique et l’écho possible à l’Exode.
