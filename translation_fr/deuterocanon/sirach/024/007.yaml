  yaml_path: translation/deuterocanon/sirach/024/007.yaml
  text: Among all these I sought a resting place[b][a], and in whose inheritance shall I lodge?
translation:
  language: fr
  text: 'Parmi tous ceux-ci, j’ai cherché un lieu de repos[a] : dans l’héritage de qui séjournerai-je[b] ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le repos » ; le nom grec peut désigner le repos lui-même, mais le contexte suggère ici un lieu où se reposer.
    reason: lexical_alternative
  - marker: b
    text: Ou « logerai-je » ou « passerai-je la nuit » ; le verbe grec peut désigner le fait de loger, de séjourner ou de camper pour la nuit.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ τούτων πάντων
  choice: Parmi tous ceux-là
  rationale: Avec le génitif, μετά peut exprimer l’appartenance à un ensemble. Dans le contexte, la Sagesse examine les lieux possibles où s’établir ; « parmi » rend mieux cette recherche au sein d’un ensemble que le sens temporel « après ».
- source_word: ἀνάπαυσιν
  choice: un lieu de repos
  rationale: Le nom désigne le repos ou la détente ; la formulation concrète « lieu de repos » convient au parallélisme avec la recherche d’un lieu où passer la nuit ou camper.
- source_word: ἐζήτησα
  choice: j’ai cherché
  rationale: Rend directement l’aoriste de ζητέω dans un français actuel et naturel.
- source_word: κληρονομίᾳ
  choice: héritage
  rationale: Le terme peut désigner un héritage ou une possession attribuée. « Héritage » conserve la résonance biblique de lot ou de domaine reçu.
- source_word: τίνος
  choice: de qui
  rationale: Le génitif interrogatif demande à qui appartient l’héritage ; « de qui » est la tournure française naturelle.
- source_word: αὐλισθήσομαι
  choice: établirai-je mon campement
  rationale: Le verbe αὐλίζομαι peut signifier passer la nuit, loger ou camper. Cette formulation conserve l’image concrète sans lui donner nécessairement une nuance militaire.
theological_decisions:
- issue: La recherche par la Sagesse personnifiée d’un lieu où s’établir
  choice: Présenter simplement la Sagesse cherchant un lieu de repos et demandant dans l’héritage de qui elle établira son campement.
  alternative: Identifier explicitement cet héritage à Israël, ou interpréter la phrase de manière abstraite comme une recherche d’accueil parmi les peuples.
  rationale: Le grec maintient encore ouverte l’identité de l’héritage, que le contexte suivant précisera. La traduction ne doit ni anticiper cette précision ni importer une identification doctrinale ultérieure.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé composé convient au récit à la première personne ; l’inversion interrogative donne à la question une tenue littéraire sans archaïsme. Les images du repos, de l’héritage et du campement sont conservées.
