  text: The first did not finish knowing her[c][b][a], and likewise the last did not trace her out.
translation:
  language: fr
  text: Le premier n’a pas achevé de la connaître[a] et, de même, le dernier ne l’a pas sondée jusqu’au bout.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Le premier n’est pas arrivé au terme de la connaissance qu’il avait d’elle. »'
    reason: La construction συνετέλεσεν … γνῶναι associe l’idée d’achèvement à celle de connaître; le français peut l’exprimer de plusieurs manières.
lexical_decisions:
- source_word: οὐ συνετέλεσεν … γνῶναι
  choice: n’a pas achevé de la connaître
  rationale: Cette formulation conserve l’idée d’achèvement exprimée par συντελέω et le sens ordinaire de γινώσκω, sans remplacer la connaissance par la simple découverte.
- source_word: ὁ πρῶτος
  choice: le premier
  rationale: Le substantif s’oppose directement à ὁ ἔσχατος. « Le premier » préserve ce contraste sans préciser indûment son référent.
- source_word: αὐτήν
  choice: la / l’
  rationale: Le pronom féminin renvoie à la Sagesse personnifiée dans le contexte et doit rester féminin en français.
- source_word: καὶ οὕτως
  choice: et, de même
  rationale: οὕτως établit ici un parallèle entre le premier et le dernier plutôt qu’un rapport de conséquence.
- source_word: ὁ ἔσχατος
  choice: le dernier
  rationale: Ce choix répond naturellement à « le premier » et maintient la portée ouverte du contraste temporel ou générationnel.
- source_word: οὐκ ἐξιχνίασεν
  choice: ne l’a pas sondée jusqu’au bout
  rationale: « Sonder » rend naturellement l’idée de rechercher en profondeur; « jusqu’au bout » explicite la valeur exhaustive suggérée par le verbe dans ce contexte.
theological_decisions:
- issue: Référent et genre de la Sagesse personnifiée
  choice: Conserver le pronom personnel féminin (« la », « l’ »).
  alternative: Employer un pronom neutre ou reformuler la Sagesse comme une abstraction impersonnelle.
  rationale: Dans Siracide 24, la Sagesse parle comme une figure féminine personnifiée. Le français permet de respecter à la fois le genre grammatical et cette personnification, sans lui imposer une identification doctrinale ultérieure.
- issue: Portée de « le premier » et « le dernier »
  choice: Laisser les deux désignations sans référent ajouté.
  alternative: Les identifier explicitement au premier et au dernier être humain, ou à des personnages eschatologiques.
  rationale: Le grec établit un contraste extrême mais ne précise pas ici l’identité des personnes visées; la traduction conserve donc cette ouverture.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé composé est naturel dans un énoncé sapientiel actuel. La répétition des pronoms féminins maintient la personnification de la Sagesse; le parallélisme entre « le premier » et « le dernier » reste net.
