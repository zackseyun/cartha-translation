  text: Whoever obeys me will not be put to shame, and those who work with me will not sin.
translation:
  language: fr
  text: Celui qui m’obéit n’aura pas honte, et ceux qui œuvrent en moi ne pécheront pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ὑπακούων μου
  choice: Celui qui m’écoute
  rationale: ὑπακούω exprime ici une écoute attentive qui implique l’obéissance. « M’écoute » reste naturel en français et conserve cette nuance dans le discours personnifié de la Sagesse.
- source_word: οὐκ αἰσχυνθήσεται
  choice: n’aura pas à rougir
  rationale: Le futur passif peut évoquer le fait d’être couvert de honte ou de subir la honte. Cette tournure française exprime naturellement l’absence de honte sans préciser indûment son agent.
- source_word: οἱ ἐργαζόμενοι ἐν ἐμοὶ
  choice: ceux qui agissent en moi
  rationale: Le grec porte explicitement ἐν ἐμοὶ, « en moi ». « Agissent » rend ἐργάζομαι avec naturel tout en conservant l’union ou la sphère d’action suggérée par ἐν, plutôt que de la remplacer par « avec moi ».
- source_word: οὐχ ἁμαρτήσουσιν
  choice: ne pécheront pas
  rationale: Rendu direct du verbe ἁμαρτάνω dans son sens moral courant, approprié au contexte sapientiel.
theological_decisions:
- issue: Sens de ἐν ἐμοὶ dans la relation à la Sagesse personnifiée
  choice: en moi
  alternative: avec moi
  rationale: « En moi » suit la préposition grecque et préserve la tension théologique d’une action accomplie dans la Sagesse, sans réduire cette relation à une simple collaboration.
- issue: Portée de « ne pécheront pas »
  choice: Conserver l’énoncé absolu du grec
  alternative: ne s’égareront pas / ne commettront pas de faute
  rationale: Le texte formule une promesse sans qualification explicite. La traduction ne doit ni l’atténuer ni en proposer silencieusement une systématisation doctrinale.
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme des deux propositions et les futurs du texte grec sont conservés. La formulation évite un calque lourd tout en maintenant l’image biblique de « rougir » et la préposition théologiquement significative « en moi ».
