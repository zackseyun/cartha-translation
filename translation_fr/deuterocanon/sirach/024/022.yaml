  naturalness: « Celui qui m’obéit » est plus idiomatique et précis ici que « Celui qui m’écoute ». « Œuvrent en moi » garde une formulation française digne et compréhensible dans ce discours de la Sagesse personnifiée, tout en laissant intacte l’étrangeté voulue de la relation exprimée par ἐν.
  terminology: '« Avoir honte » rend clairement l’idée de ne pas être honteux/confus. « Pécheront » traduit directement ἁμαρτήσουσιν, sans atténuation doctrinale. « En moi » doit être maintenu : le grec ne dit pas « avec moi ».'
