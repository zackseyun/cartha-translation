  text: See that I have not labored for myself alone[a], but for all who seek her.
translation:
  language: fr
  text: 'Voyez : je n’ai pas peiné pour moi seul, mais pour tous ceux qui la recherchent.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδετε
  choice: 'Voyez :'
  rationale: 'L’impératif pluriel appelle les destinataires à reconnaître le fait qui suit. En français, « Voyez : » conserve cette force d’appel avec naturel.'
- source_word: οὐκ ἐμοὶ μόνῳ
  choice: pas pour moi seul
  rationale: Le datif indique ici le bénéficiaire du travail, et μόνος souligne que le bénéfice ne revient pas uniquement au locuteur.
- source_word: ἐκοπίασα
  choice: je n’ai pas peiné
  rationale: Le passé composé rend naturellement en français l’aoriste comme un travail accompli dont le résultat est présenté aux lecteurs. « Peiner » exprime l’effort impliqué par κοπιάω sans alourdir la phrase.
- source_word: ἀλλὰ πᾶσι
  choice: mais pour tous
  rationale: Cette formulation conserve le contraste direct entre le seul locuteur et l’ensemble du groupe ensuite défini.
- source_word: τοῖς ἐκζητοῦσιν
  choice: ceux qui recherchent
  rationale: « Rechercher » peut rendre la nuance soutenue ou intensive de ἐκζητέω tout en restant naturel dans le discours sapientiel.
- source_word: αὐτήν
  choice: la
  rationale: Le pronom féminin renvoie à la Sagesse personnifiée dans le contexte. Le français l’exprime naturellement par le pronom objet « la ».
theological_decisions:
- issue: Référent et genre de αὐτήν dans le discours sur la Sagesse
  choice: Employer « la », en référence à la Sagesse personnifiée
  alternative: Employer une formulation abstraite telle que « recherchent la sagesse »
  rationale: Le chapitre présente la Sagesse comme une figure féminine qui parle. Le pronom féminin préserve cette personnification et le renvoi anaphorique du grec sans ajouter d’identification doctrinale.
translation_notes:
  register: Français international moderne, digne et direct. La ponctuation après « Voyez » restitue l’appel exhortatif sans produire le tour moins naturel « Voyez que ». Aucun marqueur de note n’est requis.
