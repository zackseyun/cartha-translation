  text: Before the age[a], from the beginning, he created me[c][b], and for all ages I will never cease.
translation:
  language: fr
  text: Avant les siècles, dès le commencement, il m’a créée[a], et pour toujours je ne cesserai jamais[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il m’a établie ». Le grec signifie ordinairement « créer » ou « fonder ».
    reason: lexical_alternative
  - marker: b
    text: 'L’expression grecque est une négation fortement appuyée; on peut aussi traduire : « je ne prendrai jamais fin ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ τοῦ αἰῶνος
  choice: Avant les siècles
  rationale: Dans ce cadre primordial, αἰών renvoie à l’ordre des âges ou des temps. Le pluriel français exprime naturellement l’antériorité de la Sagesse à tous les siècles sans imposer l’idée philosophiquement plus précise d’un « avant le temps ».
- source_word: ἀπʼ ἀρχῆς
  choice: dès le commencement
  rationale: Rend clairement le point d’origine temporel et conserve la diction biblique courante.
- source_word: ἔκτισέν με
  choice: il m’a créée
  rationale: κτίζω signifie directement « créer » ou « fonder ». « Créée » préserve la force du grec sans l’atténuer; l’accord féminin suit la Sagesse personnifiée qui parle dans le contexte.
- source_word: ἕως αἰῶνος
  choice: pour toujours
  rationale: Dans cette expression, αἰών désigne une durée sans terme. « Pour toujours » est naturel en français moderne et évite de suggérer un âge délimité.
- source_word: οὐ μὴ ἐκλίπω
  choice: je ne cesserai jamais
  rationale: La double négation grecque est fortement emphatique, et ἐκλείπω désigne ici la cessation ou la disparition plutôt qu’un échec.
theological_decisions:
- issue: Faut-il atténuer le langage de l’origine de la Sagesse pour éviter une implication de créature?
  choice: Conserver « il m’a créée » dans le texte principal.
  alternative: « il m’a établie » ou « il m’a formée »
  rationale: Le sens ordinaire de κτίζω est « créer » ou « fonder ». Le texte fait parler la Sagesse personnifiée; la traduction conserve donc sa formulation sans résoudre la tension au moyen de catégories doctrinales ultérieures.
translation_notes:
  register: Français international moderne, digne et accessible. « Dès le commencement » maintient une résonance biblique sans archaïsme; « pour toujours » privilégie une formulation idiomatique. Les marqueurs [a] et [b] figurent dans le texte principal.
