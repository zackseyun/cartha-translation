    issue: Possessif ajouté dans « mon enseignement »
    rationale: διδασκαλίαν ne porte aucun possessif. Même si le contexte fait du locuteur la source de l’enseignement, l’ajout de « mon » explicite un rapport non formulé dans ce verset.
  - severity: medium
    issue: Rendu de εἰς γενεὰς αἰώνων
    rationale: « Aux générations à venir pour toujours » peut signifier que l’enseignement est laissé à des destinataires futurs de manière permanente. Le grec exprime plus directement sa conservation ou sa transmission au fil de générations caractérisées par les âges.
  revised_text: Je répandrai encore l’enseignement comme une prophétie[a], et je le laisserai pour les générations à venir, à travers les siècles.
  revised_footnotes:
