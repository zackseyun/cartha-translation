  text: Still I will pour out instruction like prophecy[c][b][a], and I will leave it for everlasting generations.
translation:
  language: fr
  text: Je répandrai encore l’enseignement comme une prophétie[a], et je le laisserai pour les générations à venir, à travers les siècles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en tant que prophétie ». Le grec peut exprimer une comparaison ou une identification ; le texte principal maintient explicitement la comparaison.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι
  choice: encore
  rationale: Dans ce contexte, ἔτι indique une action supplémentaire ou poursuivie. « Encore » conserve cette souplesse sans imposer exclusivement l’idée de répétition.
- source_word: διδασκαλίαν
  choice: mon enseignement
  rationale: « Enseignement » rend naturellement le nom grec dans le registre de la littérature de sagesse. Le possessif, implicite dans la construction française avec le locuteur comme source, clarifie sans modifier le référent.
- source_word: ὡς προφητείαν
  choice: comme une prophétie
  rationale: « Comme » maintient explicitement la comparaison portée par ὡς, tandis que l’article indéfini donne une formulation française naturelle.
- source_word: ἐκχέω
  choice: je répandrai
  rationale: Le futur s’accorde avec καταλείψω. « Répandre » préserve l’image d’un contenu versé et largement diffusé, avec plus de naturel en français que « verser » pour un enseignement.
- source_word: καταλείψω
  choice: je le laisserai
  rationale: Le verbe exprime ici ce qui est laissé en héritage ou transmis aux générations suivantes. « Laisser » reste proche du grec sans expliciter excessivement « léguer ».
- source_word: αὐτήν
  choice: le
  rationale: Le pronom reprend διδασκαλίαν ; en français, « enseignement » étant masculin, l’accord exige « le ».
- source_word: εἰς γενεὰς αἰώνων
  choice: aux générations à venir pour toujours
  rationale: Cette formulation rend la destination générationnelle et la durée indéfinie de l’expression grecque, tout en évitant l’expression peu naturelle « générations éternelles ».
theological_decisions:
- issue: Valeur de ὡς προφητείαν
  choice: 'comparative : l’enseignement est répandu comme une prophétie'
  alternative: 'identificative : l’enseignement est répandu en tant que prophétie'
  rationale: ὡς permet les deux nuances. Le texte principal conserve la comparaison explicite et une note signale l’autre lecture, sans trancher silencieusement la question du statut prophétique de cet enseignement.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore de l’effusion est rendue par « répandrai », idiomatique avec « enseignement ». La tournure finale évite d’attribuer littéralement l’éternité à chaque génération tout en conservant l’idée d’une transmission perpétuelle.
