  verdict: revise
  source_fidelity: Le futur des deux verbes est bien rendu, de même que l’image de l’effusion et la valeur comparative de ὡς. Toutefois, « mon enseignement » introduit un possessif absent du grec, et « aux générations à venir pour toujours » réoriente εἰς vers des destinataires et attache plus naturellement « pour toujours » à l’acte de laisser plutôt qu’à la durée générationnelle.
  naturalness: La formulation est globalement claire et digne. « Pour les générations à venir, à travers les siècles » est idiomatique en français international et rend plus nettement la portée durable de γενεὰς αἰώνων sans attribuer littéralement l’éternité à chaque génération.
  terminology: « Enseignement », « répandrai » et « prophétie » conviennent au registre sapientiel. L’alternative « en tant que prophétie » dans la note préserve correctement la possibilité identificative sans l’imposer.
