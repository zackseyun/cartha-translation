  text: I will again make instruction shine like the dawn[c][b][a], and I will bring these things to light far into the distance.
translation:
  language: fr
  text: Je ferai encore briller l’instruction comme l’aurore, et je mettrai ces choses en lumière jusque dans le lointain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je continuerai d’illuminer l’instruction comme le matin, et je les manifesterai au loin. » Le grec passe du singulier « instruction » au pluriel neutre « ces choses » ou « les »; ce pluriel renvoie probablement au contenu de l’enseignement de la Sagesse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι
  choice: encore
  rationale: Le terme a ici une valeur additive et continue; « encore » la conserve sans introduire une opposition artificielle.
- source_word: παιδείαν
  choice: l’instruction
  rationale: Dans le Siracide, le mot désigne une formation transmise par l’enseignement, et non seulement la discipline ou la correction.
- source_word: ὡς ὄρθρον
  choice: comme l’aurore
  rationale: ὄρθρος désigne le point du jour; « l’aurore » préserve naturellement l’image de la lumière naissante.
- source_word: φωτιῶ
  choice: je ferai briller
  rationale: Cette tournure française rend le causatif appliqué à « l’instruction » tout en conservant la métaphore lumineuse.
- source_word: ἐκφανῶ
  choice: je mettrai ... en lumière
  rationale: Le verbe exprime l’action de faire paraître ou de manifester; cette formulation prolonge l’image de l’aurore.
- source_word: αὐτά
  choice: ces choses
  rationale: Le neutre pluriel grec ne reprend pas grammaticalement le singulier παιδείαν; il renvoie probablement au contenu de l’instruction sans le définir davantage.
- source_word: ἕως εἰς μακράν
  choice: jusque dans le lointain
  rationale: La formulation garde la portée spatiale ou métaphorique de l’expression et son idée d’une diffusion très étendue.
theological_decisions:
- issue: Référent de αὐτά dans le discours de la Sagesse
  choice: « ces choses », probablement le contenu de l’instruction
  alternative: « elle », comme reprise au sens de l’instruction au singulier
  rationale: Le grec passe explicitement du singulier παιδείαν au neutre pluriel αὐτά. La traduction maintient ce décalage et évite d’imposer un référent doctrinal plus précis.
translation_notes:
  register: Français international moderne, poétique mais accessible. « Comme l’aurore » et « en lumière » maintiennent le réseau d’images du grec; « jusque dans le lointain » conserve sa portée ample sans lourdeur archaïque.
