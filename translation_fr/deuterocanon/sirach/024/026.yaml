  yaml_path: translation/deuterocanon/sirach/024/026.yaml
  text: It fills up understanding like the Euphrates[a], and like the Jordan in the days of harvest[d][c][b];
translation:
  language: fr
  text: Il remplit l’intelligence comme l’Euphrate, et comme le Jourdain au temps de la moisson.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au temps de la moisson, le Jourdain pouvait déborder de toutes ses rives; l’image évoque donc une intelligence dispensée avec abondance.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἀναπληρῶν
  choice: Il remplit
  rationale: Le participe présent actif avec article a ici une valeur descriptive et régit directement σύνεσιν. « Il remplit » conserve cette construction transitive sans transformer l’image en un état du sujet.
- source_word: σύνεσιν
  choice: l’intelligence
  rationale: Dans la littérature sapientielle, σύνεσις désigne la faculté de comprendre et de discerner. « Intelligence » est naturel en français et convient à l’objet direct de « remplit ».
- source_word: ὡς Εὐφράτης
  choice: comme l’Euphrate
  rationale: ὡς introduit une comparaison; cette formulation préserve simplement l’image du grand fleuve.
- source_word: Ἰορδάνης
  choice: le Jourdain
  rationale: Le nom français usuel du fleuve prend l’article défini.
- source_word: ἐν ἡμέραις θερισμοῦ
  choice: au temps de la moisson
  rationale: Cette expression française idiomatique conserve la référence saisonnière concrète, tout en évitant le tour moins naturel « aux jours de la moisson ».
theological_decisions:
- issue: Référent du participe masculin ὁ ἀναπληρῶν
  choice: Reprise pronominale « Il » du sujet masculin fourni par le contexte
  alternative: « Celui qui remplit »
  rationale: Le verset poursuit la description du sujet précédent. « Il » rend la continuité naturelle en français, tandis que « celui qui » risquerait d’introduire un nouveau référent.
translation_notes:
  register: Français moderne, sobre et digne. La syntaxe transitive du grec est maintenue, et la comparaison fluviale reste volontairement dense sans être explicitée dans le corps du texte.
