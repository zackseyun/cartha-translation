  text: In the assembly of the Most High she will open her mouth[c][b][a], and before his power she will boast.
translation:
  language: fr
  text: Dans l’assemblée du Très-Haut, elle[a] ouvrira la bouche et, devant sa puissance[b], elle se glorifiera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit de la Sagesse personnifiée, comme l’indique le contexte.
    reason: cross_reference
  - marker: b
    text: Ou « devant son armée »; le mot grec peut aussi désigner une force organisée ou une troupe, éventuellement céleste.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: assemblée
  rationale: Le terme désigne ici la communauté réunie. « Assemblée » est naturel, neutre et évite l’anachronisme que pourrait introduire « Église ».
- source_word: Ὑψίστου
  choice: Très-Haut
  rationale: C’est le titre divin consacré en français pour Ὕψιστος dans la littérature biblique grecque.
- source_word: στόμα αὐτῆς ἀνοίξει
  choice: elle ouvrira la bouche
  rationale: Cette expression concrète désigne la prise de parole tout en conservant l’image et la personnification présentes dans le grec.
- source_word: ἔναντι
  choice: devant
  rationale: « Devant » exprime avec concision la présence face à laquelle la Sagesse prend la parole.
- source_word: δυνάμεως αὐτοῦ
  choice: sa puissance
  rationale: « Puissance » rend directement le sens courant de δύναμις sans imposer au texte l’interprétation collective d’une armée ou d’une troupe céleste; cette autre possibilité est signalée en note.
- source_word: καυχήσεται
  choice: elle se glorifiera
  rationale: Le verbe peut exprimer le fait de se glorifier, de tirer gloire ou de se vanter. « Se glorifiera » conserve sa force sans la nuance nécessairement péjorative de « se vantera » en français moderne.
theological_decisions:
- issue: Référent du pronom féminin
  choice: Conserver « elle » dans le texte et identifier la Sagesse personnifiée en note.
  alternative: Remplacer le pronom par « la Sagesse ».
  rationale: Le contexte immédiat établit que la Sagesse personnifiée parle, mais ce verset ne répète pas explicitement le nom; le pronom respecte donc la formulation grecque.
- issue: Sens de δυνάμεως αὐτοῦ
  choice: Traduire par « sa puissance » dans le texte.
  alternative: Traduire par « son armée » ou « sa troupe céleste ».
  rationale: Le grec permet le sens abstrait de puissance et, dans certains contextes bibliques grecs, un sens collectif lié à une armée ou à l’armée céleste. Le texte seul ne contraint pas suffisamment ce dernier sens pour l’intégrer sans réserve.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme du grec; « se glorifiera » évite le ton exclusivement négatif de « se vantera ».
