  text: Like a cedar I was raised high in Lebanon[a], and like a cypress in the mountains of Hermon.
translation:
  language: fr
  text: Comme un cèdre, j’ai été élevée très haut au Liban, et comme un cyprès dans les montagnes de l’Hermon[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « Aermon » (Ἀερμών), forme correspondant au nom habituellement rendu par « Hermon ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: comme
  rationale: Introduit dans les deux membres une comparaison, naturellement exprimée en français par « comme ».
- source_word: κέδρος
  choice: cèdre
  rationale: Équivalent usuel du nom grec de l’arbre et image caractéristique du Liban.
- source_word: ἀνυψώθην
  choice: j’ai été élevée
  rationale: Conserve la voix passive et l’idée de hauteur, tout en accordant le participe avec la Sagesse personnifiée, qui parle au féminin dans le contexte.
- source_word: ἐν τῷ Λιβάνῳ
  choice: sur le Liban
  rationale: Dans ce tableau arboricole, « sur le Liban » rend naturellement la localisation montagneuse exprimée par ἐν, sans réduire le nom à la seule désignation politique moderne.
- source_word: κυπάρισσος
  choice: cyprès
  rationale: Identification lexicale habituelle de κυπάρισσος, préférable aux équivalents traditionnels plus incertains comme « sapin » ou « pin ».
- source_word: ἐν ὄρεσιν Ἀερμών
  choice: sur les montagnes de l’Hermon
  rationale: Respecte le pluriel ὄρεσιν et normalise Ἀερμών sous la forme française courante « Hermon ».
theological_decisions:
- issue: Faut-il donner à ἀνυψώθην un sens explicitement honorifique ?
  choice: j’ai été élevée
  alternative: j’ai été exaltée
  rationale: Le contexte est une description poétique de la Sagesse personnifiée au moyen d’arbres majestueux. « Élevée » maintient à la fois le passif et l’image verticale sans imposer une lecture honorifique ou doctrinale.
translation_notes:
  register: Français international moderne, poétique et digne. La structure parallèle du grec est conservée. Le féminin de « élevée » suit la voix de la Sagesse personnifiée dans le contexte.
