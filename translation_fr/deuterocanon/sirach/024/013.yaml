  verdict: revise
  source_fidelity: 'Le grec dit littéralement : « Comme un cèdre, j’ai été élevée/haussée dans le Liban, et comme un cyprès dans les montagnes de l’Aermon. » Le féminin est cohérent avec la Sagesse personnifiée dans le contexte. « J’ai été élevée » maintient le passif, mais peut en français évoquer l’éducation ou l’élevage et n’explicite pas suffisamment l’idée de hauteur de ἀνυψώθην. « Sur le Liban » est possible dans une évocation topographique, mais « au Liban » rend plus directement ἐν τῷ Λιβάνῳ et correspond mieux au parallélisme avec « dans les montagnes ».'
