  text: And I, like a canal from a river, and like a water channel, went out into a garden.
translation:
  language: fr
  text: Et moi, comme un canal issu d’un fleuve, et comme un conduit d’eau, je suis sorti dans un jardin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un paradis ». Le mot grec peut désigner un jardin, un parc ou le paradis ; ici, l’image immédiate est celle de l’irrigation d’un jardin cultivé.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγώ
  choice: Et moi
  rationale: Marque naturellement en français la transition vers le rôle du locuteur, sans imposer le sens plus appuyé de « moi aussi ».
- source_word: διῶρυξ
  choice: canal
  rationale: Désigne un chenal artificiel; « canal » le distingue clairement du fleuve naturel dont il dérive.
- source_word: ἀπὸ ποταμοῦ
  choice: dérivé d’un fleuve
  rationale: Exprime l’origine du canal tout en rendant explicite la relation suggérée par l’image; l’absence d’article favorise « un fleuve ».
- source_word: ὑδραγωγός
  choice: conduit d’eau
  rationale: Conserve l’idée d’un ouvrage qui dirige l’eau, sans les connotations architecturales plus étroites d’« aqueduc ».
- source_word: ἐξῆλθον
  choice: je suis sorti
  rationale: Rend formellement le verbe de mouvement à l’aoriste, malgré le caractère volontairement imagé de son emploi avec le locuteur comparé à un canal.
- source_word: παράδεισον
  choice: jardin
  rationale: Dans cette image d’irrigation, « jardin » exprime le lieu cultivé concret sans introduire d’emblée les associations eschatologiques modernes de « paradis ».
theological_decisions:
- issue: Sens de παράδεισον dans la métaphore de la Sagesse
  choice: jardin
  alternative: paradis
  rationale: Le contexte immédiat est celui de canaux conduisant de l’eau vers un espace cultivé, non une affirmation eschatologique explicite. La possibilité lexicale « paradis » est néanmoins préservée en note.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme grec est conservé. « Conduit d’eau » souligne le caractère dirigé et artificiel de l’écoulement; « vers un jardin » maintient le mouvement exprimé par εἰς.
