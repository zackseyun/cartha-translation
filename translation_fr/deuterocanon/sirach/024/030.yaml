- from: Et moi, comme un canal dérivé d’un fleuve, comme un conduit d’eau, je suis sorti vers un jardin.[a]
  to: Et moi, comme un canal issu d’un fleuve, et comme un conduit d’eau, je suis sorti dans un jardin.[a]
  rationale: La révision conserve les images et l’ambiguïté lexicale du grec, tout en rendant plus directement ἀπὸ (« issu de »), καὶ (« et ») et εἰς (« dans »).
