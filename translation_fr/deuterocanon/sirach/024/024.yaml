translation:
  language: fr
  text: Ne laissez pas votre force faiblir[a] ; attachez-vous à lui[b], afin d’être fortifiés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne faiblissez pas dans votre force. » Le verbe grec peut signifier défaillir, s’épuiser ou cesser.'
    reason: lexical_alternative
  - marker: b
    text: Cette ligne constitue un verset ajouté dans certaines traditions textuelles du Siracide ; elle est conservée ici comme verset 24 dans la séquence de ce chapitre.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκλίπητε ἐν ἰσχύϊ
  choice: ne perdez pas courage
  rationale: Le verbe ἐκλείπω peut exprimer l’idée de défaillir, de s’épuiser ou de cesser. Avec ἐν ἰσχύϊ, cette formulation française rend naturellement l’exhortation à ne pas laisser faiblir sa force, sans surinterpréter l’expression.
- source_word: κολλᾶσθε
  choice: attachez-vous
  rationale: Le verbe évoque le fait de se joindre étroitement à quelqu’un et de lui rester fermement attaché. « Attachez-vous » conserve cette adhésion volontaire dans un français naturel et digne.
- source_word: αὐτῷ
  choice: à lui
  rationale: Le pronom grec peut formellement être masculin ou neutre. Dans cette exhortation, le masculin personnel constitue la lecture la plus naturelle, tout en laissant le contexte déterminer le référent.
- source_word: κραταιωθῆτε
  choice: soyez fortifiés
  rationale: 'Le subjonctif passif exprime le résultat recherché : recevoir de la force. « Être fortifiés » préserve explicitement cette valeur passive.'
theological_decisions:
- issue: Référent de αὐτῷ dans cette exhortation additionnelle
  choice: à lui
  alternative: à elle / à cela
  rationale: Même si la forme grecque permet grammaticalement un référent neutre, le tour exhortatif se comprend le plus naturellement comme un attachement personnel. La traduction ne nomme toutefois pas explicitement le référent, préservant ainsi l’ambiguïté contextuelle.
- issue: Statut textuel de Siracide 24.24
  choice: conserver la ligne dans le texte avec une note
  alternative: omettre la ligne du texte courant
  rationale: La ligne appartient à certaines traditions textuelles du Siracide. La conserver dans la séquence reçue tout en signalant sa situation textuelle permet à la fois la continuité de la numérotation et la transparence critique.
translation_notes:
  register: Français international moderne, clair et digne. L’impératif pluriel est maintenu. « Ne perdez pas courage » privilégie l’intelligibilité idiomatique, tandis que la note conserve la tournure plus formelle du grec. Les marqueurs [a] et [b] figurent tous deux dans le texte.
