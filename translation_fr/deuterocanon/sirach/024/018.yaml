base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/024/018.yaml
  text: I am the mother of beautiful love[a], and of fear, and of knowledge, and of holy hope[b];
translation:
  language: fr
  text: Moi, je suis la mère du bel amour[a], de la crainte[b], de la connaissance et de la sainte espérance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « amour bon » ou « noble amour » ; le grec καλῆς peut exprimer une qualité morale aussi bien qu’esthétique.
    reason: lexical_alternative
  - marker: b
    text: Ou « révérence » ; dans la littérature de sagesse, le grec φόβου désigne souvent une crainte respectueuse, particulièrement envers Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ εἰμι
  choice: Moi, je suis
  rationale: La tournure française met en relief le pronom emphatique ἐγώ tout en restant naturelle dans cette déclaration solennelle de la Sagesse personnifiée.
- source_word: μήτηρ
  choice: mère
  rationale: Le sens littéral et l’image familiale sont conservés plutôt que remplacés par l’abstraction « source » ou « origine ».
- source_word: καλῆς ἀγάπης
  choice: bel amour
  rationale: καλός peut exprimer à la fois la beauté et la valeur morale. « Bel amour » préserve cette richesse poétique et s’accorde naturellement avec le nom masculin français « amour ».
- source_word: φόβου
  choice: crainte
  rationale: « Crainte » conserve le sens de φόβος et sa tension théologique, tout en pouvant évoquer en français biblique une crainte révérencielle sans réduire le terme à la seule « révérence ».
- source_word: γνώσεως
  choice: connaissance
  rationale: « Connaissance » est l’équivalent direct de γνῶσις et convient à l’énumération sapientielle.
- source_word: ἁγίας ἐλπίδος
  choice: sainte espérance
  rationale: La traduction garde le qualificatif religieux ἁγία et rend ἐλπίς par le terme français usuel et théologiquement pertinent « espérance ».
theological_decisions:
- issue: Portée de φόβου dans un contexte sapientiel
  choice: crainte
  alternative: révérence
  rationale: Dans la littérature de sagesse, φόβος peut désigner une crainte révérencielle, notamment envers Dieu. Le grec ne précise toutefois pas ici l’objet de cette crainte. « Crainte » maintient donc la formulation et l’ambivalence du texte sans imposer une interprétation.
translation_notes:
  register: Français international moderne, poétique et digne. La structure de l’énumération grecque est conservée sans répétition lourde de « et de ». « Moi, je suis » restitue l’emphase de ἐγώ ; « bel amour » garde la double nuance esthétique et morale de καλῆς.
