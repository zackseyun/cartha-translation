  text: All these things are the book of the covenant of God Most High[b][a], the law that Moses commanded as an inheritance for the assemblies of Jacob.
translation:
  language: fr
  text: Tout cela est le livre de l’alliance du Dieu Très-Haut, la Loi que Moïse a prescrite comme héritage aux assemblées de Jacob.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux communautés de Jacob ». Ici, le mot grec désigne vraisemblablement les communautés rassemblées d’Israël, sans renvoyer nécessairement aux synagogues comme institutions plus tardives.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα πάντα
  choice: Tout cela
  rationale: Le neutre pluriel grec récapitule l’ensemble de ce qui précède. Le français idiomatique emploie naturellement le singulier collectif « tout cela ».
- source_word: βίβλος διαθήκης
  choice: le livre de l’alliance
  rationale: « Livre » reste naturel sans préciser abusivement le support matériel; dans ce contexte biblique, διαθήκη désigne l’alliance.
- source_word: θεοῦ Ὑψίστου
  choice: du Dieu Très-Haut
  rationale: Cette formulation française naturelle conserve à la fois le nom divin et le titre Ὑψίστου.
- source_word: νόμον
  choice: la Loi
  rationale: Le terme renvoie ici au corps reconnu de l’instruction mosaïque. La majuscule française signale ce référent précis sans ajouter de contenu.
- source_word: ὃν ἐνετείλατο Μωυσῆς
  choice: que Moïse a prescrite
  rationale: Le verbe ἐντέλλομαι exprime l’action d’ordonner ou de prescrire. « Prescrire » convient à la Loi et évite la tournure française moins naturelle « commander une loi ».
- source_word: κληρονομίαν
  choice: comme héritage
  rationale: L’accusatif présente la Loi comme le bien transmis aux communautés de Jacob.
- source_word: συναγωγαῖς Ἰακώβ
  choice: aux assemblées de Jacob
  rationale: « Assemblées » rend le sens communautaire sans projeter nécessairement l’institution synagogale plus tardive; le nom Jacob est conservé.
theological_decisions:
- issue: Sens de διαθήκη dans le contexte mosaïque
  choice: alliance
  alternative: testament
  rationale: Le lien explicite entre Dieu, Moïse, la Loi et Jacob favorise le sens biblique d’« alliance ».
- issue: Identification de la sagesse avec la Loi
  choice: Conserver l’énoncé direct « Tout cela est le livre… la Loi… »
  alternative: Expliciter par « toute cette sagesse se trouve dans… »
  rationale: Le grec formule une identification dense et théologiquement significative; l’expliciter résoudrait une tension que le texte laisse intacte.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe garde l’identification condensée du grec. « Dieu Très-Haut » est idiomatique en français biblique; « assemblées » évite l’anachronisme possible de « synagogues ».
