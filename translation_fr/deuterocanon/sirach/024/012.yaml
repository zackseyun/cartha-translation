  text: And I took root among a glorified people[a], in the portion of the Lord[b], his inheritance.
translation:
  language: fr
  text: Et j’ai pris racine au milieu d’un peuple glorifié[a], dans la part du Seigneur, son héritage[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au milieu d’un peuple glorieux ». Le participe grec peut être compris de façon plus adjectivale, mais le texte principal en conserve la valeur verbale et résultative.
    reason: lexical_alternative
  - marker: b
    text: L’expression « dans la part du Seigneur, son héritage » peut aussi se traduire par « dans la part de l’héritage du Seigneur » ou « dans l’héritage attribué au Seigneur ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρρίζωσα
  choice: j’ai pris racine
  rationale: L’aoriste actif à la première personne est rendu par une expression française naturelle qui conserve l’image de l’enracinement et la voix active.
- source_word: λαῷ
  choice: peuple
  rationale: λαός désigne ici une collectivité et peut porter une dimension communautaire ou d’alliance; « peuple » convient mieux que « nation ».
- source_word: δεδοξασμένῳ
  choice: glorifié
  rationale: Le participe parfait passif de δοξάζω exprime un état résultant d’une action reçue; « glorifié » en préserve mieux la force verbale que le simple adjectif « glorieux ».
- source_word: μερίδι
  choice: part
  rationale: μερίς désigne une part attribuée. « Part » est naturel en français et maintient l’idée de répartition ou d’attribution liée à l’héritage.
- source_word: Κυρίου
  choice: du Seigneur
  rationale: Le génitif est rendu directement et « Seigneur » suit l’usage biblique français courant pour Κύριος.
- source_word: κληρονομίας
  choice: héritage
  rationale: κληρονομία évoque un bien reçu ou attribué en partage; « héritage » conserve cette dimension.
theological_decisions:
- issue: Faut-il rendre δεδοξασμένῳ comme un simple adjectif ou préserver sa valeur participiale et résultative?
  choice: un peuple glorifié
  alternative: un peuple glorieux; un peuple honoré
  rationale: Le grec emploie un parfait passif. « Glorifié » laisse entendre une gloire conférée et évite de la présenter seulement comme une qualité intrinsèque.
- issue: Comment comprendre la construction compacte ἐν μερίδι Κυρίου κληρονομίας αὐτοῦ?
  choice: dans la part du Seigneur, son héritage
  alternative: dans la part de l’héritage du Seigneur; dans l’héritage attribué au Seigneur
  rationale: La formulation retenue préserve la possible apposition entre « la part du Seigneur » et « son héritage », sans résoudre silencieusement la relation génitivale ambiguë.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec tout en étant idiomatique; les notes signalent les deux ambiguïtés importantes sans imposer une interprétation confessionnelle.
