  text: Like a palm tree I was raised high on the shores[a], and like rose plants in Jericho; like a splendid olive tree in the plain[b], and I was raised high like a plane tree.
translation:
  language: fr
  text: Comme un palmier, j’ai été élevée bien haut sur les rivages[a], et comme des rosiers à Jéricho ; comme un olivier majestueux dans la plaine, et j’ai été élevée bien haut comme un platane.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte littéralement « dans les rivages » ou « dans les régions côtières » ; « sur les rivages » est la formulation française naturelle. Certains interprètes supposent un autre lieu derrière cette leçon, car le palmier est plus souvent associé aux oasis ou aux cours d’eau ; toutefois, le texte grec conservé soutient bien l’image des rivages.
    reason: lexical_alternative
lexical_decisions:
- source_word: φοῖνιξ
  choice: palmier
  rationale: Dans cette comparaison botanique, le mot grec désigne naturellement un palmier ; le français courant n’exige pas de préciser qu’il s’agit d’un dattier.
- source_word: ἀνυψώθην
  choice: j’ai été élevée bien haut
  rationale: Cette formulation conserve la voix passive ainsi que la double évocation de croissance verticale et d’élévation. Le féminin s’accorde avec la Sagesse qui parle dans le contexte.
- source_word: αἰγιαλοῖς
  choice: sur les rivages
  rationale: Le nom grec au pluriel désigne les rivages ou les grèves ; « sur les rivages » est l’expression française naturelle pour ce complément de lieu.
- source_word: φυτὰ ῥόδου
  choice: plants de rosier
  rationale: φυτά désigne des plantes ou des plants, tandis que ῥόδου précise l’espèce. « Plants de rosier » conserve l’image botanique plurielle dans un français naturel.
- source_word: Ἰερειχώ
  choice: Jéricho
  rationale: Forme française traditionnelle et actuelle du nom de lieu.
- source_word: ἐλαία εὐπρεπής
  choice: olivier majestueux
  rationale: εὐπρεπής exprime une beauté noble et imposante ; « majestueux » restitue cette dignité sans réduire le terme à la seule beauté visuelle.
- source_word: πεδίῳ
  choice: la plaine
  rationale: πεδίον désigne un terrain plat et découvert ; « la plaine » rend directement ce cadre géographique.
- source_word: πλάτανος
  choice: platane
  rationale: Le terme grec désigne le platane. Le traduire par « sycomore » identifierait à tort une autre espèce d’arbre.
theological_decisions:
- issue: Voix et portée de ἀνυψώθην
  choice: 'Maintien du passif : « j’ai été élevée bien haut »'
  alternative: « je me suis élevée » ou « j’ai grandi »
  rationale: Le passif grec peut évoquer à la fois la haute croissance des arbres et l’élévation de la Sagesse. La traduction conserve cette tension sans la réduire à un simple processus naturel ni préciser l’agent.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le rythme parallèle des quatre comparaisons est conservé, ainsi que la répétition de « j’ai été élevée bien haut » présente dans le grec.
