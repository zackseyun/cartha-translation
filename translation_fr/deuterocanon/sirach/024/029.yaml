  text: For her understanding is more abundant than the sea[d][c][b][a], and her counsel than the great deep.
translation:
  language: fr
  text: Car sa pensée dépasse la mer en abondance, et son dessein, le grand abîme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διανόημα
  choice: pensée
  rationale: Le nom désigne ce qui est pensé ou la faculté de penser. « Pensée » reste proche du grec et convient à la personnification de la Sagesse sans préciser indûment « intelligence » ou « discernement ».
- source_word: ἐπληθύνθη
  choice: est plus abondante
  rationale: Dans cette tournure comparative d’arrière-plan sémitique, le passif exprime une abondance qui surpasse celle de la mer, plutôt qu’un processus littéral de multiplication.
- source_word: βουλή
  choice: conseil
  rationale: « Conseil » conserve le vocabulaire sapientiel et peut désigner aussi bien la délibération que le dessein, sans trancher inutilement entre les deux.
- source_word: ἀπὸ γὰρ θαλάσσης
  choice: que la mer
  rationale: 'La préposition ἀπό porte ici une valeur comparative de type sémitique : la pensée de la Sagesse surpasse la mer; elle n’en provient pas.'
- source_word: ἀβύσσου μεγάλης
  choice: le grand abîme
  rationale: Cette expression évoque les immenses profondeurs aquatiques ou cosmiques. « Le grand abîme » préserve cette image et son parallélisme avec la mer.
- source_word: αὐτῆς
  choice: sa / son
  rationale: Les possessifs renvoient à la Sagesse personnifiée au féminin dans le contexte. En français, leur forme s’accorde avec les noms possédés, tout en maintenant la personnification.
theological_decisions:
- issue: Personnification de la Sagesse
  choice: Conserver les possessifs personnels « sa » et « son » renvoyant à la Sagesse personnifiée.
  alternative: Traiter la sagesse comme une notion purement impersonnelle.
  rationale: Le contexte littéraire et les formes féminines grecques présentent la Sagesse comme une figure féminine. La traduction conserve ce trait sans lui imposer une identification doctrinale particulière.
- issue: Ellipse du prédicat dans le second membre
  choice: Rétablir « plus abondant » après « son conseil » pour obtenir une phrase française claire.
  alternative: « et son conseil que le grand abîme », calque elliptique du grec.
  rationale: Le grec sous-entend dans le second membre le prédicat du premier. Sa reprise explicite en français rend la comparaison intelligible sans en modifier le sens.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme poétique est conservé; la répétition du comparatif dans le second membre explicite une ellipse grecque qui serait peu naturelle en français.
