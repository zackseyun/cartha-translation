  text: In the waves of the sea and in all the earth[a], and among every people and nation[b], I gained possession.
translation:
  language: fr
  text: Dans les vagues de la mer et sur toute la terre, au sein de tout peuple et de toute nation, j’ai pris possession[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « j’ai acquis ». Le grec ne précise pas l’objet acquis ou possédé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν κύμασιν θαλάσσης
  choice: Dans les vagues de la mer
  rationale: Traduction locative directe qui conserve l’image concrète du grec; « vagues » est courant et naturel en français moderne.
- source_word: ἐν πάσῃ τῇ γῇ
  choice: sur toute la terre
  rationale: Dans cette énumération de portée universelle, γῆ désigne vraisemblablement la terre entière plutôt qu’un territoire particulier. La préposition « sur » est idiomatique en français.
- source_word: ἐν παντὶ λαῷ καὶ ἔθνει
  choice: parmi chaque peuple et chaque nation
  rationale: « Parmi » exprime naturellement la présence au sein des collectivités humaines, tandis que la répétition de « chaque » maintient la valeur distributive de παντί.
- source_word: ἐκτησάμην
  choice: j’ai pris possession
  rationale: Cette formulation française peut s’employer absolument dans ce contexte et rend l’idée d’acquisition ou de prise de possession sans préciser artificiellement l’objet que le grec laisse sous-entendu.
theological_decisions:
- issue: Objet implicite de ἐκτησάμην
  choice: Employer absolument « j’ai pris possession »
  alternative: « j’ai acquis [quelque chose] » ou « je me suis acquis un domaine »
  rationale: Le grec ne nomme pas l’objet acquis. La traduction retenue préserve cette indétermination et évite de transformer le domaine, les peuples ou les nations en objet explicite du verbe.
translation_notes:
  register: Français international moderne, sobre et digne. La structure cumulative du grec est conservée, avec des prépositions adaptées à l’usage idiomatique français.
