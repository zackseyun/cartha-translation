  text: In the beloved city likewise he gave me rest[b][a], and in Jerusalem was my authority.
translation:
  language: fr
  text: Dans la ville bien-aimée, il m’a aussi accordé le repos[a], et à Jérusalem était mon autorité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sujet d’« il m’a accordé le repos » est sous-entendu en grec. Le contexte renvoie à Dieu, mais le verset ne le nomme pas explicitement.
    reason: lexical_alternative
lexical_decisions:
- source_word: πόλει ἠγαπημένῃ
  choice: la ville bien-aimée
  rationale: Le participe parfait passif ἠγαπημένῃ qualifie la ville comme aimée. L’article défini convient en français puisque la ville est ensuite identifiée à Jérusalem, tout en préservant le registre élevé.
- source_word: ὁμοίως
  choice: de même
  rationale: Cette expression naturelle en français conserve le lien de continuité avec ce qui précède sans alourdir la phrase.
- source_word: κατέπαυσεν
  choice: m’a donné le repos
  rationale: Le verbe καταπαύω peut signifier faire cesser, faire reposer ou établir dans un lieu. « M’a donné le repos » conserve ici l’image du repos tout en restant naturel.
- source_word: ἐξουσία μου
  choice: j’avais autorité
  rationale: ἐξουσία désigne l’autorité, le droit ou le pouvoir légitime. La tournure verbale française rend naturellement la proposition nominale grecque, dont la copule est sous-entendue, sans lui donner le sens territorial plus marqué de « domaine ».
theological_decisions:
- issue: Sujet implicite de κατέπαυσεν
  choice: Conserver le pronom « il » sans nommer son référent dans le texte principal.
  alternative: « le Seigneur m’a donné le repos » ou « Dieu m’a établie »
  rationale: Le verbe grec implique un sujet masculin singulier que le contexte permet de rapporter à Dieu, mais ce verset ne le nomme pas expressément. Le pronom préserve cette implicitation.
- issue: Temps de la proposition nominale καὶ ἐν Ἰερουσαλὴμ ἡ ἐξουσία μου
  choice: 'Employer l’imparfait : « j’avais autorité ».'
  alternative: « j’ai autorité » ou « mon autorité est à Jérusalem »
  rationale: Le grec ne comporte pas de copule et ne marque donc pas explicitement le temps. L’imparfait s’accorde au récit de l’établissement de la Sagesse dans la première proposition, sans prétendre que le grec exprime lui-même ce temps.
translation_notes:
  register: Français international moderne, digne et accessible. Le point-virgule fait ressortir le parallélisme des deux propositions. La personnification féminine de la Sagesse demeure portée par le contexte, sans ajout explicatif dans ce verset.
