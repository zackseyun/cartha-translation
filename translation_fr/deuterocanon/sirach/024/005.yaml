  yaml_path: translation/deuterocanon/sirach/024/005.yaml
  text: I alone encircled the vault of heaven[c][b][a], and walked in the depths of the abysses.
translation:
  language: fr
  text: Seule, j’ai entouré la voûte du ciel[a] et marché dans la profondeur des abîmes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le cercle du ciel ». Le terme grec peut désigner une étendue circulaire ou une voûte courbe.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dans la profondeur des abîmes » ; on peut aussi traduire « dans les profondeurs abyssales ».
    reason: lexical_alternative
lexical_decisions:
- source_word: γῦρον
  choice: le cercle
  rationale: Le nom désigne une forme ou un parcours circulaire. « Le cercle du ciel » conserve directement l’image cosmologique grecque, tout en restant intelligible en français.
- source_word: ἐκύκλωσα
  choice: j’ai parcouru
  rationale: Le verbe exprime l’action d’aller autour ou de faire le tour. Avec γῦρον, « parcouru » évite la redondance peu naturelle de « entouré le cercle » et garde l’idée d’un déplacement circulaire.
- source_word: μόνη
  choice: Seule
  rationale: Le féminin singulier correspond à la Sagesse personnifiée qui parle. Placé en tête, « Seule » préserve l’accent d’exclusivité.
- source_word: βάθει
  choice: dans la profondeur
  rationale: Le datif singulier signifie littéralement « dans la profondeur ». Cette formulation respecte le nombre du grec sans affaiblir l’image cosmique.
- source_word: ἀβύσσων
  choice: des abîmes
  rationale: Le génitif pluriel est conservé. « Abîmes » garde le registre élevé et l’idée de profondeurs insondables.
- source_word: περιεπάτησα
  choice: marché
  rationale: Le verbe signifie concrètement « marcher, aller çà et là ». « Marché » préserve cette personnification vive sans introduire l’interprétation plus abstraite de « traversé ».
theological_decisions:
- issue: Identité de la locutrice personnifiée
  choice: Conserver le féminin singulier et la première personne comme parole de la Sagesse personnifiée.
  alternative: Identifier explicitement la locutrice à une hypostase divine ou à une figure doctrinale ultérieure.
  rationale: Le contexte littéraire de Siracide 24 présente la Sagesse parlant à la première personne. Le verset ne tranche pas à lui seul les identifications théologiques ultérieures, que la traduction ne doit donc pas importer.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe coordonne les deux verbes sans répéter le pronom sujet, comme en grec. « Seule » maintient à la fois le genre féminin de la Sagesse personnifiée et l’emphase de μόνη.
