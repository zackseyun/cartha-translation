  text: Then the Creator of all commanded me[a], and the one who created me pitched my tent and said, “Dwell in Jacob[c][b], and receive your inheritance in Israel.”
translation:
  language: fr
  text: 'Alors le Créateur de toutes choses m’a donné cet ordre, et celui qui m’a créée a dressé ma tente et m’a dit : « Établis ta demeure en Jacob et reçois ton héritage en Israël.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « reçois une part en héritage en Israël ». Le verbe grec relève du vocabulaire de l’héritage et de l’attribution d’un lot ; il peut aussi suggérer l’idée d’être attribuée en héritage en Israël.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνετείλατό μοι
  choice: m’a donné cet ordre
  rationale: Cette formulation rend clairement la force de ἐντέλλομαι en français courant et digne, tout en gardant le complément personnel « m’ ».
- source_word: ὁ κτίστης ἁπάντων
  choice: le Créateur de toutes choses
  rationale: « Créateur » rend κτίστης, et « de toutes choses » exprime naturellement en français la portée universelle de ἁπάντων.
- source_word: ὁ κτίσας με
  choice: celui qui m’a créée
  rationale: La tournure participiale est explicitée sans la réduire à un simple titre. L’accord féminin suit la voix de la Sagesse personnifiée dans le contexte.
- source_word: κατέπηξεν τὴν σκηνήν μου
  choice: a dressé ma tente
  rationale: « Dresser une tente » restitue concrètement l’action de fixer ou monter une tente et conserve l’image de la σκηνή.
- source_word: Ἐν Ἰακὼβ κατασκήνωσον
  choice: Établis ta demeure en Jacob
  rationale: La formulation garde l’idée de s’installer ou de demeurer, ainsi que l’écho au motif de la tente, dans un français naturel.
- source_word: κατακληρονομήθητι
  choice: reçois ton héritage
  rationale: Ce choix conserve l’imagerie de l’héritage et la nuance réceptive ou passive du verbe, sans trancher excessivement entre attribution et prise de possession.
- source_word: ἐν Ἰσραήλ
  choice: en Israël
  rationale: Le rendu direct préserve le parallélisme entre « en Jacob » et « en Israël ».
theological_decisions:
- issue: Rapport entre la Sagesse personnifiée et Dieu
  choice: Conserver la voix personnelle féminine de la Sagesse tout en affirmant explicitement qu’elle est créée et reçoit un ordre du Créateur.
  alternative: Rendre la Sagesse plus abstraite, ou employer un vocabulaire cultuel plus marqué comme « tabernacle ».
  rationale: Le grec maintient à la fois une personnification vive et la distinction entre le Créateur et la Sagesse créée. La traduction ne résout pas cette tension au moyen de catégories doctrinales ultérieures.
- issue: Sens de κατακληρονομήθητι
  choice: « reçois ton héritage »
  alternative: « sois établie comme héritage », « prends possession » ou « hérite »
  rationale: La forme grecque peut évoquer l’attribution, l’établissement ou l’héritage. Le texte principal reste lisible tout en signalant l’ambiguïté dans la note.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le parallélisme entre Jacob et Israël est conservé, de même que l’image concrète de la tente. La ponctuation rattache naturellement « m’a dit » à « celui qui m’a créée ».
