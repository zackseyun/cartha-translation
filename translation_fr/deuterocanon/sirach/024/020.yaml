  text: For the memory of me is sweeter than honey[c][b][a], and my inheritance is sweeter than the honeycomb.
translation:
  language: fr
  text: Car mon souvenir est plus doux que le miel[a], et mon héritage, plus doux que le miel du rayon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le souvenir de moi » ou « ma commémoration ».
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie une expression associant le miel et la cire, qui désigne le miel du rayon.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημόσυνόν μου
  choice: mon souvenir
  rationale: μνημόσυνον peut désigner le souvenir, la commémoration ou un mémorial. « Mon souvenir » est naturel en français et maintient la Sagesse comme objet personnel du souvenir.
- source_word: ὑπὲρ … γλυκύ
  choice: plus doux que
  rationale: Bien que γλυκύ soit formellement au positif, ὑπέρ donne ici à la tournure une valeur comparative, que le français exprime naturellement par « plus doux que ».
- source_word: κληρονομία μου
  choice: mon héritage
  rationale: κληρονομία signifie directement « héritage » ou « patrimoine ». « Mon héritage » conserve l’ambiguïté entre ce qui appartient à la Sagesse et ce qu’elle transmet.
- source_word: μέλιτος κηροῦ
  choice: le miel du rayon
  rationale: L’expression grecque désigne le miel associé à la cire, c’est-à-dire le miel du rayon. Cette formulation préserve l’image concrète et évite de comparer la douceur à la cire elle-même.
theological_decisions:
- issue: Référence de la première personne
  choice: 'Conserver la Sagesse personnifiée parlant d’elle-même : « mon souvenir » et « mon héritage ».'
  alternative: Dépersonnaliser la phrase en parlant abstraitement du souvenir ou de l’héritage de la sagesse.
  rationale: Dans le contexte de Siracide 24, la Sagesse se présente à la première personne. La traduction maintient cette personnification sans préciser davantage son statut théologique.
- issue: Sens de « mon héritage »
  choice: Maintenir l’expression ambiguë « mon héritage ».
  alternative: Expliciter « l’héritage que je donne » ou « ce que je possède en héritage ».
  rationale: Le grec ne précise pas si l’expression désigne ce que la Sagesse possède, transmet ou laisse. Il convient de ne pas résoudre cette tension.
translation_notes:
  register: Français international moderne, poétique et digne. L’ellipse verbale du second membre est conservée par la virgule, conformément au parallélisme grec, tout en restant naturelle en français.
