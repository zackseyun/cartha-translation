  text: I[a], like a vine, put forth grace[c][b], and my blossoms are the fruit of glory and wealth.
translation:
  language: fr
  text: Moi, comme une vigne, j’ai fait pousser la grâce[a], et mes fleurs sont un fruit de gloire et de richesse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la beauté », « la faveur » ou « le charme ». Le mot grec peut exprimer à la fois l’attrait et une qualité bienfaisante dans ce contexte poétique.
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi comprendre plus librement : « mes fleurs portent un fruit glorieux et riche ». Le grec dit littéralement que les fleurs sont « un fruit de gloire et de richesse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγώ
  choice: Moi
  rationale: Le pronom explicite est conservé sous une forme emphatique, conformément à l’autoprésentation de la Sagesse personnifiée.
- source_word: ὡς ἄμπελος
  choice: comme une vigne
  rationale: Cette formulation naturelle conserve directement la comparaison végétale.
- source_word: βλαστήσασα
  choice: j’ai fait germer
  rationale: Le verbe évoque la germination ou la croissance végétale. « J’ai fait germer » maintient cette image tout en permettant de conserver χάριν comme complément.
- source_word: χάριν
  choice: la grâce
  rationale: « Grâce » garde ensemble les nuances possibles de beauté, de charme et de bienfait, sans réduire délibérément la polysémie du grec.
- source_word: τὰ ἄνθη μου
  choice: mes fleurs
  rationale: « Fleurs » est le terme français courant et exact dans le prolongement de l’image de la vigne.
- source_word: καρπὸς
  choice: un fruit
  rationale: Le singulier du grec est conservé, malgré la tournure poétique inhabituelle qui identifie les fleurs à un fruit.
- source_word: δόξης
  choice: de gloire
  rationale: « Gloire » préserve le registre élevé ainsi que les idées possibles de splendeur et d’honneur.
- source_word: πλούτου
  choice: de richesse
  rationale: Le singulier abstrait correspond directement au grec et peut exprimer aussi bien la prospérité que l’abondance.
theological_decisions:
- issue: Sens de χάριν dans l’autoportrait poétique de la Sagesse
  choice: la grâce
  alternative: la beauté, la faveur ou le charme
  rationale: Le contexte associe beauté végétale et qualité bienfaisante. « Grâce » préserve cette tension sémantique sans imposer un sens uniquement esthétique ou doctrinal.
- issue: Rapport entre les fleurs et le fruit
  choice: mes fleurs sont un fruit de gloire et de richesse
  alternative: mes fleurs portent un fruit glorieux et riche
  rationale: La formulation retenue respecte la prédication nominale concise du grec et son singulier, tandis que l’alternative serait plus idiomatique mais ajouterait l’idée de « porter » et transformerait les génitifs en adjectifs.
translation_notes:
  register: Français international moderne, poétique et digne. La métaphore végétale et la syntaxe étonnante de la seconde proposition ont été conservées autant que le permet un français intelligible.
