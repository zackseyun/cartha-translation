  yaml_path: translation/deuterocanon/sirach/022/004.yaml
  text: A prudent daughter will obtain a husband[a], but one who brings shame is a grief to the one who fathered her.
translation:
  language: fr
  text: Une fille avisée obtiendra un mari[a], mais celle qui cause le déshonneur est un chagrin pour celui qui l’a engendrée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « héritera d’un mari » ; ici, le verbe signifie qu’elle obtiendra un mari.'
    reason: Alternative lexicale et explicitation de l’idiome grec.
lexical_decisions:
- source_word: θυγάτηρ φρονίμη
  choice: une fille avisée
  rationale: « Fille » rend directement θυγάτηρ. « Avisée » exprime ici la sagesse pratique et le bon jugement de φρονίμη dans un français naturel.
- source_word: κληρονομήσει
  choice: obtiendra
  rationale: Le sens premier est « héritera », mais avec « un mari » comme complément, une traduction strictement littérale serait obscure en français. « Obtiendra » restitue le résultat exprimé par l’emploi contextuel sans masquer le littéralisme grec, signalé en note.
- source_word: ἄνδρα αὐτῆς
  choice: un mari
  rationale: Dans ce contexte matrimonial, ἀνήρ désigne naturellement un mari. Le possessif αὐτῆς accompagne la construction grecque, mais « son mari » pourrait suggérer qu’elle est déjà mariée; « un mari » rend mieux le sens prospectif.
- source_word: ἡ καταισχύνουσα
  choice: celle qui fait honte
  rationale: 'Le participe est actif : la fille provoque la honte ou le déshonneur. La tournure verbale française en conserve la force.'
- source_word: εἰς λύπην
  choice: cause du chagrin à
  rationale: 'La préposition εἰς marque ici le résultat : elle devient une cause de peine pour son père. Cette formulation est naturelle et garde la relation causale.'
- source_word: γεννήσαντος
  choice: celui qui l’a engendrée
  rationale: Le participe aoriste masculin singulier désigne littéralement celui qui lui a donné naissance, ici son père. La formulation conserve à la fois le langage de l’engendrement et la référence masculine.
theological_decisions:
- issue: Référence parentale genrée dans γεννήσαντος
  choice: celui qui l’a engendrée
  alternative: son père; le parent qui l’a engendrée
  rationale: Le grec emploie un participe masculin singulier. Le rendre par « celui » préserve cette indication plutôt que de la neutraliser, tout en évitant une paraphrase interprétative.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Avisée » est courant et digne; « engendrée » conserve la précision du grec sans employer l’archaïsme « mise au monde » pour une référence explicitement masculine.
