  source_fidelity: 'Le projet rend correctement les éléments essentiels : θυγάτηρ φρονίμη (« une fille avisée »), le futur κληρονομήσει compris idiomatiquement (« obtiendra »), ἀνήρ au sens matrimonial (« un mari »), et γεννήσαντος au masculin (« celui qui l’a engendrée »). La note conserve utilement le sens littéral inhabituel de κληρονομήσει. La seconde proposition gagnerait toutefois à conserver plus directement la prédication de résultat exprimée par εἰς λύπην : elle est un chagrin pour celui qui l’a engendrée.'
