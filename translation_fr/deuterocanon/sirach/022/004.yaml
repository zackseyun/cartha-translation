  terminology: « Avisée », « mari », « déshonneur », « chagrin » et « engendrée » relèvent d’un registre moderne, sobre et approprié à la littérature sapientielle. « Déshonneur » rend bien la honte/disgrâce causée, sans préciser indûment qui en est la cible.
