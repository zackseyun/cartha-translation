  text: If you draw a sword against a friend[a], do not despair[b], for there can be a return.
translation:
  language: fr
  text: Si tu tires l’épée contre un ami, ne désespère pas, car un retour reste possible.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « car il y a un retour ». Dans ce contexte, il peut s’agir d’un retour à la relation ou d’un rétablissement, sans que le grec le précise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ φίλον
  choice: contre un ami
  rationale: Avec une action hostile, ἐπί suivi de l’accusatif exprime naturellement une action dirigée contre quelqu’un. « Contre un ami » rend clairement cette orientation sans atténuer la gravité du geste.
- source_word: ἐὰν σπάσῃς
  choice: si tu tires
  rationale: σπάω signifie tirer ou extraire. Avec ῥομφαίαν, « tirer l’épée » est l’expression française naturelle et conserve l’image concrète du grec.
- source_word: ῥομφαίαν
  choice: l’épée
  rationale: ῥομφαία désigne une épée, parfois de grande taille. Le simple mot « épée » suffit ici et évite une précision non nécessaire.
- source_word: μὴ ἀπελπίσῃς
  choice: ne désespère pas
  rationale: Cette formulation concise garde la force de l’impératif et le sens direct de ἀπελπίζω, « désespérer, perdre espoir ».
- source_word: ἔστιν γὰρ ἐπάνοδος
  choice: car un retour reste possible
  rationale: ἐπάνοδος désigne littéralement un retour. La formulation française conserve cette image tout en indiquant naturellement que la rupture n’est pas nécessairement irréversible, sans expliciter davantage la nature du retour.
theological_decisions:
- issue: Portée du retour après une grave offense envers un ami
  choice: Conserver l’image ouverte d’un « retour » possible
  alternative: Traduire explicitement par « une réconciliation reste possible » ou, plus généralement, « il y a un moyen de revenir en arrière »
  rationale: Dans le contexte, le retour peut suggérer le rétablissement de la relation, mais le grec ne nomme pas explicitement la réconciliation. Le texte principal préserve donc l’ambiguïté et la tension de l’expression.
translation_notes:
  register: Français moderne, clair et digne. « Tirer l’épée contre » maintient l’image martiale, tandis que « un retour reste possible » conserve l’ouverture sémantique du grec.
