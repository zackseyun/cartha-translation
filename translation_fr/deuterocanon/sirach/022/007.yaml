  text: Teaching a fool is like gluing a potsherd[a], like waking one from a deep sleep.
translation:
  language: fr
  text: Enseigner un insensé, c’est comme recoller un tesson[a], comme réveiller quelqu’un d’un profond sommeil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Celui qui enseigne un insensé recolle un tesson, réveille quelqu’un d’un profond sommeil. » Le grec emploie « celui qui enseigne » suivi de participes et ne formule pas explicitement « c’est comme ».'
    reason: La formulation comparative est implicite dans la construction grecque et a été explicitée pour produire un proverbe naturel en français ; « tesson » rend plus précisément le grec ὄστρακον.
lexical_decisions:
- source_word: συγκολλῶν
  choice: recoller
  rationale: Le participe évoque l’action de joindre par collage. « Recoller » est naturel en français pour une poterie brisée et fait ressortir l’image concrète d’une réparation vaine ou précaire.
- source_word: ὄστρακον
  choice: un morceau de poterie
  rationale: Le nom désigne ici un tesson ou morceau de terre cuite. Cette formulation est plus immédiatement compréhensible que « tesson » tout en conservant le singulier grec.
- source_word: ὁ διδάσκων
  choice: enseigner
  rationale: Le participe substantivé signifie littéralement « celui qui enseigne ». L’infinitif donne au proverbe une tournure française naturelle et générique.
- source_word: μωρόν
  choice: un insensé
  rationale: Dans la littérature sapientielle, μωρός qualifie une personne dépourvue de sagesse, avec une portée intellectuelle et morale. « Insensé » préserve cette nuance sans réduire le terme à un manque d’intelligence.
- source_word: ἐξεγείρων
  choice: réveiller
  rationale: Le participe signifie réveiller ou tirer du sommeil. « Réveiller » est le terme français le plus direct.
- source_word: καθεύδοντα
  choice: quelqu’un
  rationale: Le participe signifie littéralement « quelqu’un qui dort ». Après « réveiller », l’état de sommeil est déjà implicite, et « quelqu’un » évite une lourdeur.
- source_word: ἐκ βαθέος ὕπνου
  choice: d’un profond sommeil
  rationale: Cette expression rend directement l’intensité de βαθέος et constitue une tournure française idiomatique.
