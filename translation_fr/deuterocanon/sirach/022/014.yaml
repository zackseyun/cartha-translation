  text: What is heavier than lead? And what name does such a one have but “fool”?[a]
translation:
  language: fr
  text: Qu’y a-t-il de plus lourd que le plomb ? Et quel nom lui donner, sinon « insensé » ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Qu’est-ce qui sera plus lourd que le plomb ? Et quel est son nom, sinon “insensé” ? » Le grec est un proverbe très condensé; le pronom peut renvoyer à une personne ou à ce qui vient d’être évoqué.'
    reason: Conserve la forme verbale grecque et l’ambiguïté référentielle, tandis que le texte français adopte une formulation proverbiale naturelle.
lexical_decisions:
- source_word: ὑπὲρ μόλυβον
  choice: plus lourd que le plomb
  rationale: Dans cette comparaison, ὑπέρ se rend naturellement par « plus… que ». μόλυβδος désigne sans ambiguïté le métal, le plomb.
- source_word: τί βαρυνθήσεται
  choice: Qu’y a-t-il de plus lourd
  rationale: Le futur passif ou moyen est employé dans une formule proverbiale condensée. Le présent français exprime naturellement la vérité générale sans effacer dans la note la forme plus littérale du grec.
- source_word: τί αὐτῷ ὄνομα
  choice: quel autre nom lui donner
  rationale: Cette tournure française conserve le pronom αὐτῷ et fait comprendre que le second membre applique l’image à une personne, tout en gardant la brièveté du proverbe.
- source_word: ἀλλ’ ἢ
  choice: que
  rationale: 'Après « quel autre nom », « que » exprime idiomatiquement l’exclusion portée par ἀλλ’ ἢ : aucun nom ne convient sinon celui qui suit.'
- source_word: μωρός
  choice: insensé
  rationale: Dans la littérature sapientielle, « insensé » exprime mieux que « idiot » ou « imbécile » le défaut de jugement à portée morale, tout en restant digne et courant.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde le parallélisme des deux questions et la force proverbiale de l’original, sans employer un terme insultant ou trop familier.
