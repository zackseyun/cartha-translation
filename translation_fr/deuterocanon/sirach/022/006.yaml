  text: Music during mourning is an untimely discourse[b][a], but beatings and discipline are wisdom at all times.
translation:
  language: fr
  text: La musique en temps de deuil est un récit malvenu, mais les coups de fouet et la discipline relèvent de la sagesse en tout temps.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La construction grecque est condensée. On peut aussi la rendre plus littéralement : « les coups de fouet et la discipline sont sagesse en tout temps », ou de manière plus explicite : « sont conformes à la sagesse en tout temps ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μουσικὰ
  choice: la musique
  rationale: Le neutre pluriel désigne largement ce qui relève de la musique ou son exécution; « la musique » conserve cette généralité sans réduire le sens aux chants.
- source_word: ἐν πένθει
  choice: en temps de deuil
  rationale: Cette expression indique la circonstance; la formulation française est naturelle et maintient le contraste temporel du verset.
- source_word: ἄκαιρος
  choice: malvenu
  rationale: L’adjectif qualifie ce qui survient au mauvais moment et est donc inapproprié; « malvenu » exprime en français actuel ces deux nuances.
- source_word: διήγησις
  choice: discours
  rationale: Le nom peut désigner un récit, un exposé ou un discours. Ici, « discours » garde une portée générale et convient à la formulation proverbiale.
- source_word: μάστιγες
  choice: les coups de fouet
  rationale: Le pluriel désigne littéralement des coups portés avec un fouet ou un fléau; cette traduction conserve sans l’atténuer le caractère corporel du terme.
- source_word: παιδεία
  choice: la discipline
  rationale: Dans la littérature sapientielle, le mot englobe formation, correction et éducation; associé aux coups, « discipline » restitue bien sa dimension corrective.
- source_word: ἐν παντὶ καιρῷ
  choice: en tout temps
  rationale: Cette tournure idiomatique conserve l’idée explicite d’une validité dans toute circonstance et répond à ἄκαιρος.
- source_word: σοφίας
  choice: relèvent ... de la sagesse
  rationale: Le génitif forme une expression elliptique et condensée. « Relèvent de la sagesse » garde le lien grammatical avec la sagesse sans imposer l’identification plus catégorique « sont sagesse ».
theological_decisions:
- issue: Portée éthique de l’approbation de la correction corporelle
  choice: Conserver le sens physique de μάστιγες en traduisant « coups de fouet », sans l’adoucir en réprimandes.
  alternative: Interpréter μάστιγες métaphoriquement comme des « réprimandes » ou employer le terme général « corrections ».
  rationale: Le grec nomme des coups de fouet et les associe à la discipline dans un proverbe sapientiel. La traduction doit rendre cette donnée historique et littéraire sans l’atténuer ni ajouter une approbation doctrinale allant au-delà du texte.
- issue: Rapport syntaxique du génitif σοφίας avec les coups et la discipline
  choice: « relèvent ... de la sagesse »
  alternative: « sont sagesse » ou « conviennent à la sagesse »
  rationale: Le grec est elliptique et permet plusieurs explicitations. La formulation retenue préserve la tension entre appartenance à la sagesse et caractérisation comme sagesse, sans résoudre excessivement l’expression.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Malvenu » est plus naturel que « inopportun » tout en gardant l’idée du mauvais moment. La proposition finale reste volontairement concise, et la note signale l’ambiguïté du génitif σοφίας.
