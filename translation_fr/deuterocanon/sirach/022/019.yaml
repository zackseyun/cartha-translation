  text: One who pricks an eye brings forth tears[b][a], and one who pricks a heart reveals feeling.
translation:
  language: fr
  text: Qui pique un œil fait couler des larmes[a] ; qui pique un cœur met au jour la sensibilité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fait descendre les larmes » ; le grec évoque littéralement leur mouvement vers le bas.
    reason: lexical_alternative
  - marker: b
    text: Ou « la perception », « la sensation » ou « ce qu’il ressent » ; le mot grec peut désigner la perception, la sensation ou la sensibilité intérieure.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νύσσων
  choice: qui pique
  rationale: Le participe désigne l’action de piquer avec quelque chose de pointu. « Pique » conserve l’image concrète et convient naturellement aux deux propositions.
- source_word: ὀφθαλμόν
  choice: un œil
  rationale: Le singulier sans article exprime ici une vérité générale ; « un œil » est idiomatique en français.
- source_word: κατάξει δάκρυα
  choice: fait couler des larmes
  rationale: Le verbe évoque littéralement le fait de faire descendre les larmes. Cette formulation française garde l’image tout en restant naturelle.
- source_word: καρδίαν
  choice: un cœur
  rationale: Le singulier a une valeur générique. Dans le parallélisme, le cœur représente aussi l’intériorité et le siège des émotions.
- source_word: ἐκφαίνει
  choice: en révèle
  rationale: Le verbe signifie faire paraître, manifester ou mettre au jour. Le pronom « en » rattache clairement ce qui est révélé au cœur piqué.
- source_word: αἴσθησιν
  choice: la sensibilité
  rationale: Le nom peut désigner la perception, la sensation ou la faculté de ressentir. Avec « cœur », « sensibilité » préserve mieux cette amplitude que le seul mot « sentiment ».
theological_decisions: []
translation_notes:
  register: Français moderne, proverbial et digne. Le parallélisme est conservé par la répétition de « qui pique ». « Fait couler des larmes » est plus idiomatique que le calque « fait descendre des larmes », tandis que les notes maintiennent les principales possibilités lexicales du grec.
