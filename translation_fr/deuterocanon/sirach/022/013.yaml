  source_fidelity: Le sens général et la progression des impératifs grecs sont bien conservés. Toutefois, « ses secousses » met le rare ἐντιναγμός au pluriel et produit une image peu idiomatique en français dans « être souillé par ses secousses ». Une formulation au singulier, avec note conservant l’incertitude lexicale, est plus fidèle sans prétendre résoudre le terme disputé.
  naturalness: Le registre proverbial est globalement naturel et sobre. « Son agitation » s’insère plus naturellement que « ses secousses » dans la phrase française tout en laissant percevoir un comportement troublant. Le reste du texte est fluide.
  terminology: « Insensé », « sans discernement », « souillé », « repos » et « folie » rendent convenablement les catégories sapientielles et les termes grecs, sans médicaliser ni doctrinaliser le propos.
