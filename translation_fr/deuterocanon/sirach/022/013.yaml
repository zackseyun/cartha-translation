base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/013.yaml
  text: Do not multiply words with a fool[a], and do not go to an unintelligent man. Keep away from him, so that you may not have trouble and may not be defiled by his shaking-off. Turn aside from him, and you will find rest, and you will not grow weary because of his madness.
translation:
  language: fr
  text: Ne multiplie pas les paroles avec un insensé et ne va pas vers une personne sans discernement. Garde-toi de lui, afin de ne pas avoir d’ennuis et de ne pas être souillé par son agitation[a]. Écarte-toi de lui, et tu trouveras le repos ; tu ne te lasseras pas à cause de sa folie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme grec traduit par « agitation » est rare et difficile. Il peut évoquer le fait de secouer ou de projeter quelque chose, et désigner plus largement les brusques débordements de l’insensé ou l’effet contaminant de sa conduite.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ἄφρονος μὴ πληθύνῃς λόγον
  choice: Ne multiplie pas les paroles avec un insensé
  rationale: Cette formulation conserve l’image proverbiale de « multiplier les paroles » tout en employant « insensé », terme traditionnel mais encore intelligible pour la catégorie morale de ἄφρων.
- source_word: πρὸς ἀσύνετον μὴ πορεύου
  choice: ne va pas vers une personne sans discernement
  rationale: « Va vers » préserve le mouvement exprimé par πορεύου ; « sans discernement » rend le manque de compréhension pratique de ἀσύνετος sans suggérer une déficience intellectuelle clinique.
- source_word: φύλαξαι ἀπʼ αὐτοῦ
  choice: Garde-toi de lui
  rationale: L’impératif exprime une vigilance protectrice et une prise de distance ; cette tournure française est concise et naturelle.
- source_word: κόπον ἔχῃς
  choice: avoir d’ennuis
  rationale: κόπος désigne ici la peine, la fatigue ou les difficultés occasionnées par la fréquentation de l’insensé ; « avoir des ennuis » convient naturellement au contexte.
- source_word: μολυνθῇς
  choice: être souillé
  rationale: « Souillé » conserve la forte image de contamination portée par μολύνω, sans préciser indûment si elle est morale, sociale ou figurée.
- source_word: ἐν τῷ ἐντιναγμῷ αὐτοῦ
  choice: par ses secousses
  rationale: Le substantif rare ἐντιναγμός évoque une action de secouer, de projeter ou une agitation brusque. « Secousses » garde l’image concrète et son indétermination, accompagnée d’une note.
- source_word: ἔκκλινον ἀπʼ αὐτοῦ
  choice: Écarte-toi de lui
  rationale: Cette traduction restitue à la fois le mouvement d’évitement et l’exhortation pratique exprimés par ἔκκλινον.
- source_word: ἀνάπαυσιν
  choice: le repos
  rationale: « Repos » est l’équivalent direct et naturel de ἀνάπαυσις, en contraste avec les ennuis et la lassitude.
- source_word: οὐ μὴ ἀκηδιάσῃς ἐν τῇ ἀπονοίᾳ αὐτοῦ
  choice: tu ne te lasseras pas à cause de sa folie
  rationale: La forte négation οὐ μή annonce avec assurance l’absence de lassitude ou d’accablement. « À cause de » explicite naturellement la relation contextuelle, tandis que « folie » préserve la force morale de ἀπόνοια.
