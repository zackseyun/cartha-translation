translation_notes:
  register: Français international moderne, sobre et proverbial. Le tutoiement singulier correspond aux impératifs grecs et au style habituel de l’enseignement sapientiel. Le masculin lexical « un insensé » est suivi de « une personne sans discernement » pour une lecture naturelle sans modifier la portée générale de l’exhortation.
