  text: And if harm comes to me through him[a], everyone who hears will guard himself from him.
translation:
  language: fr
  text: Et s’il m’arrive du mal à cause de lui[a], quiconque l’apprendra se tiendra sur ses gardes vis-à-vis de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « s’il m’arrive un malheur par son intermédiaire… quiconque l’entendra dire se méfiera de lui »'
    reason: Alternative lexicale préservant les nuances possibles de κακά, διά et φυλάσσομαι ἀπό.
lexical_decisions:
- source_word: κακά
  choice: du mal
  rationale: Le neutre pluriel désigne ici des conséquences mauvaises, un tort ou un malheur qui atteint le locuteur, sans imposer l’idée de mal moral.
- source_word: μοι συμβήσεται
  choice: s’il m’arrive
  rationale: Cette tournure française naturelle rend l’événement qui advient à la personne affectée.
- source_word: διʼ αὐτόν
  choice: à cause de lui
  rationale: διά avec l’accusatif exprime normalement ici la cause ou le motif; cette formulation conserve la possible implication de l’homme sans préciser davantage son degré d’action.
- source_word: πᾶς ὁ ἀκούων
  choice: quiconque l’apprendra
  rationale: Le participe substantivé a une portée générique. « L’apprendra » explicite naturellement en français que l’on entend parler de ce qui sera arrivé.
- source_word: φυλάξεται ἀπʼ αὐτοῦ
  choice: se tiendra sur ses gardes vis-à-vis de lui
  rationale: Le futur moyen marque une précaution prise pour soi; la locution française exprime la vigilance envers la personne concernée sans affirmer nécessairement une séparation physique.
theological_decisions:
- issue: Portée générique du masculin πᾶς ὁ ἀκούων
  choice: quiconque l’apprendra
  alternative: tout homme qui l’apprendra
  rationale: Le masculin grec est générique; « quiconque » en restitue la portée universelle sans restriction masculine indue.
- issue: Relation exprimée par διʼ αὐτόν
  choice: à cause de lui
  alternative: par son intermédiaire
  rationale: La valeur causale est la plus naturelle avec l’accusatif, mais la formulation n’attribue pas explicitement une intention mauvaise à la personne.
translation_notes:
  register: Français international moderne, digne et accessible. « Se tenir sur ses gardes vis-à-vis de » conserve la nuance réflexive de précaution tout en restant idiomatique.
