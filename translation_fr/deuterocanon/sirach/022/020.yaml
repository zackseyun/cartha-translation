  text: One who throws a stone at birds drives them away[b][a], and one who reproaches a friend will break up friendship.
translation:
  language: fr
  text: Qui jette une pierre sur des oiseaux les fait fuir[a] ; qui adresse des reproches[b] à un ami brisera leur amitié.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les chasse ». Le verbe grec désigne le fait de faire partir ou de provoquer la fuite.
    reason: lexical_alternative
  - marker: b
    text: Ou « insulte ». Le verbe grec peut désigner des reproches, mais aussi des paroles méprisantes ou outrageantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάλλων
  choice: Qui jette
  rationale: Le participe présent a une valeur générale et proverbiale. « Qui jette » rend cette portée de façon naturelle et concise.
- source_word: λίθον
  choice: une pierre
  rationale: Traduction directe du nom singulier.
- source_word: ἐπὶ πετεινὰ
  choice: sur des oiseaux
  rationale: πετεινά désigne ici naturellement des oiseaux, et ἐπί indique la cible du jet.
- source_word: ἀποσοβεῖ
  choice: les fait fuir
  rationale: Le verbe exprime l’action de chasser ou de provoquer la fuite. « Les fait fuir » est clair et idiomatique en français moderne.
- source_word: ὀνειδίζων
  choice: qui adresse des reproches
  rationale: Le verbe peut signifier faire des reproches, insulter ou accabler d’opprobre. Cette formulation conserve le sens principal sans imposer le degré d’intensité le plus fort.
- source_word: φίλον
  choice: à un ami
  rationale: Le singulier sans article a ici une valeur générique ; « un ami » convient au caractère proverbial de la phrase.
- source_word: διαλύσει
  choice: brisera
  rationale: Le futur indique le résultat de l’action. « Brisera » exprime naturellement la destruction du lien relationnel.
- source_word: φιλίαν
  choice: leur amitié
  rationale: Le nom désigne le lien d’amitié. Le possessif français explicite naturellement la relation entre la personne qui fait des reproches et l’ami, sans modifier le sens contextuel.
