  text: But for a fool[a], an evil life is worse than death.
translation:
  language: fr
  text: Mais pour l’insensé, une vie mauvaise[a] est pire que la mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une vie misérable » ou « une vie mauvaise moralement »; le grec dit littéralement « une vie mauvaise ».
    reason: lexical_alternative
lexical_decisions:
- source_word: μωροῦ
  choice: l’insensé
  rationale: μωρός désigne ici une personne dépourvue de sagesse ou de discernement. « L’insensé » est naturel dans le registre de la littérature sapientielle et n’évoque pas nécessairement une déficience intellectuelle.
- source_word: ὑπὲρ θάνατον
  choice: est pire que la mort
  rationale: Dans cette construction comparative et aphoristique, ὑπέρ exprime que cette vie est plus pénible ou plus mauvaise que la mort. « Est pire que » restitue clairement ce rapport en français.
- source_word: ζωὴ πονηρά
  choice: une vie mauvaise[a]
  rationale: L’expression signifie littéralement « une vie mauvaise ». πονηρά peut évoquer aussi bien le mal moral qu’une existence pénible ou misérable; la traduction retenue conserve cette amplitude.
- source_word: τοῦ δὲ
  choice: Mais pour
  rationale: δέ marque une transition légèrement contrastive avec ce qui précède; « Mais pour » rend ce mouvement de façon idiomatique.
theological_decisions:
- issue: Portée de πονηρά dans le contexte sapientiel
  choice: Conserver « mauvaise » sans limiter le sens au malheur subi.
  alternative: « misérable » ou « malheureuse »
  rationale: Le grec laisse résonner à la fois la mauvaise qualité morale d’une vie et son caractère pénible. « Mauvaise » préserve cette tension, tandis que « misérable » réduirait le propos à la souffrance.
translation_notes:
  register: Français moderne, sobre et proverbial. « L’insensé » maintient le registre sapientiel traditionnel tout en restant compréhensible; la syntaxe est légèrement réorganisée pour être naturelle en français.
