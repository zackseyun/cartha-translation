  source_fidelity: 'La traduction actuelle rend bien les impératifs, le contraste proverbial et les termes sapientiels. Toutefois, « il n’a plus de lumière » impose au premier membre un possesseur implicite que le grec n’exprime pas : φῶς est le sujet nominatif de ἐξέλιπεν (« la lumière s’est éteinte / a disparu »). Le second membre, avec σύνεσιν à l’accusatif, peut naturellement se rendre par la perte ou le défaut d’intelligence chez l’insensé. La révision conserve donc l’image sans uniformiser artificiellement la syntaxe des deux membres.'
  naturalness: « Pleurer le mort » est plus idiomatique en français moderne que « pleurer sur le mort » dans cette maxime. « La lumière s’est éteinte » est une formulation française naturelle qui maintient l’image poétique. « L’intelligence lui a fait défaut » est sobre, proverbial et ne suggère pas la mort physique de l’insensé.
  terminology: « L’insensé » convient au vocabulaire de sagesse pour μωρός et évite de réduire le terme à une simple incapacité intellectuelle. « Intelligence » rend adéquatement σύνεσις dans ce contexte, avec une nuance de discernement. Aucun terme théologique spécialisé n’est en jeu.
