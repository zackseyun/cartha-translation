  yaml_path: translation/deuterocanon/sirach/022/009.yaml
  text: Weep over the dead[a], for the light has failed; and weep over the fool[b], for understanding has failed.
translation:
  language: fr
  text: Pleure le mort[a], car la lumière s’est éteinte ; pleure aussi l’insensé[b], car l’intelligence lui a fait défaut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « car la lumière a disparu ». Le grec conserve l’image de la lumière, sans dire directement « vie ».
    reason: lexical_alternative
  - marker: b
    text: La sentence rapproche la mort du défaut d’intelligence chez l’insensé ; elle ne dit pas explicitement que celui-ci est physiquement mort.
    reason: cultural_note
lexical_decisions:
- source_word: κλαῦσον
  choice: Pleure
  rationale: L’impératif de κλαίω exprime les pleurs de deuil. « Pleure » restitue directement sa force affective et permet de conserver la répétition grecque.
- source_word: νεκρῷ
  choice: le mort
  rationale: Avec ἐπί dans ce contexte de lamentation, le datif désigne la personne morte sur laquelle on pleure. Le singulier générique convient au caractère proverbial de la sentence.
- source_word: ἐξέλιπεν
  choice: il n’a plus
  rationale: ἐκλείπω peut exprimer l’idée de cesser, de manquer ou de faire défaut. La tournure française « il n’a plus » rend naturellement les deux membres parallèles, avec φῶς puis σύνεσιν, sans confondre explicitement la lumière avec la vie.
- source_word: φῶς
  choice: lumière
  rationale: Le grec dit φῶς, « lumière », et non ζωή, « vie ». Garder l’image respecte la formulation concise du texte.
- source_word: μωρῷ
  choice: l’insensé
  rationale: Dans la littérature de sagesse, μωρός désigne une personne dépourvue de jugement et de discernement, souvent aussi sur le plan moral. « L’insensé » conserve cette catégorie sapientielle sans réduire le terme à une simple déficience intellectuelle.
- source_word: σύνεσιν
  choice: intelligence
  rationale: σύνεσις désigne la compréhension, le discernement ou l’intelligence. « Intelligence » forme ici une opposition claire avec « l’insensé » et reste accessible en français courant.
theological_decisions:
- issue: Valeur métaphorique de φῶς en rapport avec la mort
  choice: Conserver « lumière » sans la remplacer par « vie ».
  alternative: « car sa vie s’en est allée » ou « car sa lumière s’est éteinte »
  rationale: Le texte grec emploie l’image de la lumière. La conserver évite de transformer une implication poétique en explication explicite.
- issue: Sujet et nuance de ἐξέλιπεν dans les deux membres parallèles
  choice: Rendre les propositions par « il n’a plus de lumière » et « il n’a plus d’intelligence ».
  alternative: « la lumière a disparu » et « l’intelligence a disparu »
  rationale: La forme σύνεσιν est accusative dans le second membre, ce qui favorise une construction où l’insensé est le sujet implicite et l’intelligence ce qui lui manque. La même formulation appliquée au premier membre préserve le parallélisme, tout en reconnaissant que φῶς peut morphologiquement être nominatif ou accusatif.
- issue: Portée sapientielle de μωρός
  choice: Employer « l’insensé ».
  alternative: « le sot » ou « l’homme sans sagesse »
  rationale: « L’insensé » garde la vigueur morale et sapientielle du terme sans introduire une doctrine particulière ni une insulte purement familière.
translation_notes:
  register: Français moderne, sobre et proverbial. La répétition de « Pleure » et la structure parallèle sont maintenues. « L’insensé » appartient au registre traditionnel de la littérature de sagesse tout en restant compréhensible aujourd’hui.
