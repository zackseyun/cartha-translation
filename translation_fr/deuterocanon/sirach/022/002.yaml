  text: A lazy man is compared to a lump of dung[a]; everyone who picks it up will shake off his hand.
translation:
  language: fr
  text: 'Le paresseux est comparé à une boule d’excréments[a] : quiconque la ramasse secouera sa main.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus littéralement, « a été jeté avec une boule d’excréments », si συνεβλήθη est compris dans un sens physique plutôt que comparatif ; le sens comparatif convient mieux à ce proverbe dans son contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: βολβίτῳ κοπρίων
  choice: à une boule d’excréments
  rationale: βολβίς désigne une masse arrondie ou une motte, tandis que κοπρίων en précise la matière. « Boule d’excréments » conserve l’image concrète, dégradante et volontairement crue du proverbe.
- source_word: συνεβλήθη
  choice: est comparé à
  rationale: Le passif de συμβάλλω peut exprimer ici une comparaison. Ce sens convient à la forme proverbiale et rend clairement le rapprochement entre le paresseux et la boule d’excréments, tout en signalant en note le sens physique possible.
- source_word: ὀκνηρός
  choice: le paresseux
  rationale: L’adjectif substantivé désigne une personne paresseuse ou indolente. « Le paresseux » est naturel en français sapientiel moderne et conserve le masculin singulier grec.
- source_word: πᾶς ὁ ἀναιρούμενος αὐτόν
  choice: quiconque la ramasse
  rationale: ἀναιρέω signifie ici prendre, soulever ou ramasser. Le pronom est rendu au féminin pour reprendre naturellement « boule » et poursuivre l’image concrète.
- source_word: ἐκτινάξει χεῖρα
  choice: secoue sa main pour s’en débarrasser
  rationale: ἐκτινάσσω évoque l’action de secouer pour faire tomber ou ôter quelque chose. L’ajout explicatif « pour s’en débarrasser » rend en français naturel le mouvement suggéré par la construction grecque, sans en modifier l’image.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne, avec maintien de la crudité intentionnelle de l’image. Le tour proverbial reste concis ; « le paresseux » conserve la forme masculine singulière du grec.
