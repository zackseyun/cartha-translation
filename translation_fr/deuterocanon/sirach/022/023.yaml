  yaml_path: translation/deuterocanon/sirach/022/023.yaml
  text: Gain faith with your neighbor in poverty[a], so that in his good things you may be filled together. In a time of distress remain with him[b], so that you may inherit along with him in his inheritance.
translation:
  language: fr
  text: Gagne la confiance de ton prochain[a] dans la pauvreté[b], afin d’être comblé avec lui de ses biens. Au temps de la détresse, reste à ses côtés, afin d’avoir part avec lui à son héritage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « acquiers sa fidélité » ou « gagne sa foi ». Ici, πίστις désigne probablement la confiance qui unit deux personnes, mais peut aussi évoquer la fidélité.
    reason: lexical_alternative
  - marker: b
    text: Le grec dit simplement « dans la pauvreté », sans préciser s’il s’agit de la pauvreté du prochain, de celle du destinataire ou d’une pauvreté partagée.
    reason: source_ambiguity
lexical_decisions:
- source_word: πίστιν κτῆσαι
  choice: Gagne la confiance
  rationale: Dans ce contexte de relations humaines et de fidélité éprouvée par l’adversité, πίστις désigne naturellement la confiance plutôt que la foi au sens religieux. κτῆσαι exprime l’idée d’acquérir ou de gagner.
- source_word: μετὰ τοῦ πλησίον
  choice: de ton prochain
  rationale: Avec « gagner la confiance », le grec μετά est rendu par le complément français idiomatique « de ton prochain ». πλησίον conserve le terme biblique courant et largement compréhensible « prochain ».
- source_word: ἐν πτωχείᾳ
  choice: dans la pauvreté
  rationale: Cette traduction directe maintient l’absence de possessif dans le grec et évite d’attribuer explicitement la pauvreté au prochain ou au destinataire.
- source_word: ἐν τοῖς ἀγαθοῖς αὐτοῦ ὁμοῦ πλησθῇς
  choice: être comblé avec lui de ses biens
  rationale: « Être comblé » conserve l’image de πλησθῇς, tandis que « avec lui » rend ὁμοῦ. « Ses biens » exprime ici les bonnes choses ou les ressources dont il jouit, sans les réduire à une notion abstraite de prospérité.
- source_word: ἐν καιρῷ θλίψεως
  choice: Au temps de la détresse
  rationale: Formulation française naturelle et digne qui restitue à la fois la circonstance temporelle et l’épreuve exprimée par θλῖψις.
- source_word: διάμενε αὐτῷ
  choice: reste à ses côtés
  rationale: διαμένω appelle une présence durable. Avec le datif αὐτῷ, « reste à ses côtés » rend clairement l’idée de persévérer auprès de lui sans ajouter explicitement la notion de fidélité.
- source_word: ἐν τῇ κληρονομίᾳ αὐτοῦ συνκληρονομήσῃς
  choice: avoir part avec lui à son héritage
  rationale: Cette formulation naturelle exprime l’action d’hériter conjointement portée par συνκληρονομέω et conserve explicitement l’héritage de l’autre personne.
theological_decisions:
- issue: Sens de πίστις dans un contexte de sagesse relationnelle
  choice: confiance
  alternative: foi ou fidélité
  rationale: Le contexte immédiat porte sur la relation avec le prochain, maintenue dans la pauvreté et la détresse. « Confiance » est donc le sens contextuel le plus naturel. La note conserve les autres valeurs possibles du terme sans introduire un sens religieux absent du passage.
- issue: Portée de l’image de l’héritage
  choice: Conserver « héritage » sans l’interpréter
  alternative: partage de ses possessions ou de sa prospérité
  rationale: Le grec emploie explicitement κληρονομία et le verbe composé συνκληρονομέω. La traduction garde cette image et sa possible portée matérielle ou plus large, sans lui imposer une lecture théologique ultérieure.
translation_notes:
  register: 'Français international moderne, sobre et sapientiel. Le tutoiement singulier correspond aux impératifs et pronoms grecs au singulier. La formulation privilégie une équivalence optimale : elle reste proche des images grecques tout en évitant des tours peu naturels comme « être rempli ensemble dans ses bonnes choses » ou « cohériter dans son héritage ».'
