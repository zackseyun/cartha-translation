base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/018.yaml
  text: Stakes set on a height opposite the wind will never hold out[a]; so a timid heart, set on a foolish thought[b], will never hold out against any fear.
translation:
  language: fr
  text: Des pieux placés sur une hauteur, face au vent[a], ne tiendront jamais ; de même, un cœur timide, appuyé sur une pensée insensée[b], ne tiendra devant aucune peur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « contre le vent ». Le grec décrit des pieux directement exposés au vent.
    reason: lexical_alternative
  - marker: b
    text: Le mot grec peut aussi désigner une intention ou un projet insensé.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρακες
  choice: pieux
  rationale: Le terme désigne ici des pièces de bois pointues ou des poteaux. « Pieux » conserve l’image concrète sans lui donner nécessairement une portée militaire.
- source_word: ἐπὶ μετεώρου κείμενοι
  choice: placés sur une hauteur
  rationale: L’expression indique une position élevée et exposée. Cette formulation naturelle évite le sens trop littéral de « suspendus dans les airs ».
- source_word: κατέναντι ἀνέμου
  choice: face au vent
  rationale: κατέναντι exprime une position en face de quelque chose, ici une exposition directe au vent.
- source_word: οὐ μὴ ὑπομείνωσιν / οὐ μὴ ὑπομείνῃ
  choice: ne tiendront jamais / ne tiendra
  rationale: La construction οὐ μή marque une négation future appuyée. Le verbe « tenir » convient à la fois aux pieux et au cœur, et préserve le parallélisme grec.
- source_word: καρδία δειλή
  choice: un cœur timide
  rationale: δειλή décrit un cœur dominé par la crainte ou manquant de courage. « Timide » restitue cette faiblesse sans accentuer excessivement le blâme moral.
- source_word: ἐπὶ διανοήματος μωροῦ
  choice: appuyé sur une pensée insensée
  rationale: διανόημα peut désigner une pensée, une intention ou un projet. « Pensée » garde cette amplitude, tandis qu’« appuyé sur » rend le rapport entre le cœur et cette pensée.
- source_word: παντὸς φόβου
  choice: aucune peur
  rationale: Dans la proposition négative, cette expression distributive signifie que le cœur ne tient face à aucune peur, quelle qu’elle soit.
