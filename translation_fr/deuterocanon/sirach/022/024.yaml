  text: Before bloodshed come the furnace’s vapor and smoke[b][a]; so before bloodshed comes abuse.
translation:
  language: fr
  text: Avant le feu viennent la vapeur de la fournaise et la fumée ; de même, avant l’effusion de sang[b] vient l’injure[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’insulte », « l’outrage » ou « les paroles injurieuses ».
    reason: lexical_alternative
  - marker: b
    text: Le grec dit littéralement « les sangs », expression qui désigne le sang versé ou des actes meurtriers.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ
  choice: avant
  rationale: Dans les deux propositions, la préposition exprime naturellement l’antériorité temporelle et construit le parallélisme du proverbe.
- source_word: πυρὸς
  choice: le feu
  rationale: Équivalent direct qui conserve l’image du feu annoncé par la vapeur et la fumée.
- source_word: ἀτμὶς
  choice: la vapeur
  rationale: Le nom désigne une vapeur ou une exhalaison ; « vapeur » demeure précis et s’accorde avec l’image de la fournaise.
- source_word: καμίνου
  choice: de la fournaise
  rationale: Le génitif indique la provenance de la vapeur. « Fournaise » rend l’intensité de καμίνος dans un registre digne et courant.
- source_word: καπνός
  choice: la fumée
  rationale: Équivalent direct, associé à la vapeur comme signe précurseur du feu.
- source_word: οὕτως
  choice: de même
  rationale: Cette expression introduit clairement la comparaison entre le phénomène physique et la progression morale.
- source_word: αἱμάτων
  choice: l’effusion de sang
  rationale: Le pluriel grec « sangs » est un idiome désignant le sang versé ou des actes meurtriers ; « effusion de sang » en transmet clairement le sens sans généraliser en simple violence.
- source_word: λοιδορία
  choice: l’injure
  rationale: Le terme désigne une parole insultante ou outrageante. Le singulier « l’injure » conserve le nombre grec et présente cette conduite de manière générale.
theological_decisions:
- issue: Progression morale de la parole hostile à la violence sanglante
  choice: Le verset affirme sous forme proverbiale que l’injure précède l’effusion de sang.
  alternative: Comprendre que l’injure cause nécessairement le meurtre, ou qu’elle accompagne seulement l’effusion de sang.
  rationale: La répétition de πρὸ indique avant tout une succession comparable à celle des signes qui annoncent le feu. La traduction garde la force de l’avertissement sans transformer le proverbe en affirmation déterministe.
translation_notes:
  register: Français international moderne, clair et digne. L’ordre des éléments et la répétition d’« avant » préservent le parallélisme grec ; l’inversion verbale donne au proverbe un rythme naturel sans en expliciter davantage la causalité.
