revisions:
- from: Une liaison de bois[a] fixée dans un édifice ne se disloquera pas lors d’un tremblement de terre ; de même, un cœur affermi par une réflexion mûrie[b] ne perdra pas courage le moment venu[c].
  to: Une attache en bois[a], intégrée à une construction, ne se défera pas lors d’un tremblement de terre ; de même, un cœur affermi par une résolution réfléchie[b] ne perdra pas courage le moment venu[c].
  rationale: La révision améliore l’idiomaticité française et resserre la correspondance avec les images et la syntaxe grecques. Elle ne transforme pas ἐν καιρῷ en « temps de détresse », qui n’est pas explicitement exprimé, mais en conserve l’éventuelle portée contextuelle dans la note.
