base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/016.yaml
  text: A wooden binding fastened into a building will not be loosened in an earthquake[c][b][a]; so a heart made firm by deliberate counsel will not lose courage in time of trouble.
translation:
  language: fr
  text: Une attache en bois[a], intégrée à une construction, ne se défera pas lors d’un tremblement de terre ; de même, un cœur affermi par une résolution réfléchie[b] ne perdra pas courage le moment venu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec désigne une attache ou un dispositif de liaison ; sa forme architecturale précise n’est pas indiquée.
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque, très condensée, peut aussi se comprendre comme « une pensée délibérée », « un dessein réfléchi » ou « un conseil mûrement pesé ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « en un temps » ou « au moment opportun ». Le contexte peut évoquer un moment d’épreuve ou de crise.
    reason: source_ambiguity
lexical_decisions:
- source_word: ἱμάντωσις ξυλίνη
  choice: une liaison de bois
  rationale: ἱμάντωσις désigne ce qui lie ou assujettit, et ξυλίνη en précise la matière. « Liaison de bois » conserve l’image structurelle sans définir abusivement la forme exacte de l’élément.
- source_word: ἐνδεδεμένη εἰς οἰκοδομήν
  choice: fixée dans un édifice
  rationale: Le participe parfait exprime un état résultant d’un assujettissement solide, tandis que εἰς suggère ici l’incorporation à la construction.
- source_word: ἐν συσσεισμῷ
  choice: lors d’un tremblement de terre
  rationale: Le nom évoque une forte secousse, notamment sismique ; cette formulation rend clairement l’épreuve imposée à l’édifice.
- source_word: οὐ διαλυθήσεται
  choice: ne se disloquera pas
  rationale: Dans cette image de construction, διαλύω signifie que les éléments se défont ou se séparent. « Se disloquer » restitue ce sens concret.
- source_word: καρδία
  choice: un cœur
  rationale: Le terme biblique désigne le centre intérieur de la pensée, de la volonté et du courage ; « cœur » en préserve l’étendue.
- source_word: ἐστηριγμένη
  choice: affermi
  rationale: Le participe parfait décrit une stabilité acquise et durable, en écho à la solidité de la liaison architecturale.
- source_word: ἐπὶ διανοήματος βουλῆς
  choice: par une réflexion mûrie
  rationale: L’expression grecque condensée associe pensée ou dessein (διανόημα) et délibération, conseil ou résolution (βουλή). « Réflexion mûrie » reste naturelle tout en gardant l’idée d’une pensée délibérée.
- source_word: ἐν καιρῷ
  choice: le moment venu
  rationale: Le grec dit littéralement « au moment » ou « en son temps » sans nommer explicitement une détresse. Le contexte suggère un moment d’épreuve, mais la traduction évite de rendre cette précision obligatoire.
- source_word: οὐ δειλιάσει
  choice: ne perdra pas courage
  rationale: Le verbe signifie devenir timide, craintif ou pusillanime. Cette tournure française exprime naturellement le fléchissement intérieur nié par le texte.
theological_decisions:
- issue: Portée anthropologique de καρδία
  choice: cœur
  alternative: esprit ; être intérieur
  rationale: « Cœur » conserve l’idiome biblique et maintient ensemble les dimensions intellectuelle, volontaire et morale au lieu de réduire le propos à la seule pensée.
- issue: Caractère implicite de l’épreuve en ἐν καιρῷ
  choice: le moment venu
  alternative: au temps de l’épreuve ; au moment critique
  rationale: La comparaison avec le tremblement de terre fait penser à une crise, mais le grec ne la nomme pas. La formulation choisie préserve cette tension sans expliciter ce qui demeure implicite.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve le parallélisme de la comparaison et son vocabulaire concret, tout en évitant un jargon architectural excessif. Le point-virgule rend nettement le passage de l’image à son application.
