translation:
  language: fr
  text: Le paresseux est comparé à une pierre souillée[a], et tous siffleront[b] à cause de son déshonneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec décrivant l’état de la pierre est rare et difficile ; il peut aussi être rendu par « sale » ou « couverte de souillure ».
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec peut désigner un sifflement ou un sifflement de dérision ; on pourrait aussi traduire « hueront » ou « siffleront avec dérision ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Λίθῳ
  choice: à une pierre
  rationale: Le datif singulier de λίθος est le complément de la comparaison; « pierre » est ici le terme français naturel.
- source_word: ἠρδαλωμένῳ
  choice: souillée
  rationale: Ce participe rare qualifie négativement la pierre comme salie ou couverte de souillure. « Souillée » reste concis et laisse une note signaler l'incertitude lexicale.
- source_word: συνεβλήθη
  choice: est comparé
  rationale: Dans cette maxime, le verbe exprime vraisemblablement un rapprochement ou une comparaison plutôt qu'une association physique littérale.
- source_word: ὀκνηρός
  choice: le paresseux
  rationale: L'adjectif masculin substantivé désigne celui qui est paresseux. « Le paresseux » rend naturellement la forme proverbiale sans ajouter le nom « homme ».
- source_word: πᾶς
  choice: tout le monde
  rationale: Le singulier à valeur générale exprime ici la réaction universelle; « tout le monde » est idiomatique en français moderne.
- source_word: ἐκσυριεῖ
  choice: sifflera
  rationale: Le verbe évoque un sifflement ou un bruit de dérision. « Sifflera » conserve l'image concrète, tandis que la note indique la possibilité de « conspuer ».
- source_word: ἀτιμίᾳ
  choice: déshonneur
  rationale: Le nom désigne la perte d'honneur, l'indignité ou l'opprobre. « Déshonneur » correspond étroitement au grec sans décider si le terme vise la honte ressentie ou le mépris public.
theological_decisions:
- issue: Adjectif substantivé masculin ὀκνηρός
  choice: le paresseux
  alternative: la personne paresseuse
  rationale: La forme grecque est masculine singulière et la maxime est formulée au masculin représentatif. « Le paresseux » en conserve la forme tout en restant naturel en français.
- issue: Rapport entre ἀτιμία et la réaction de dérision
  choice: devant son déshonneur
  alternative: à cause de sa honte
  rationale: La préposition ἐπί avec le datif peut exprimer la circonstance ou le motif. « Devant » préserve cette latitude sans préciser excessivement le lien causal.
translation_notes:
  register: Français international moderne, sobre et proverbial. La syntaxe suit de près les deux propositions grecques, tout en employant des formulations courantes. Les notes conservent les deux principales incertitudes lexicales.
