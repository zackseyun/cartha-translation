  text: A shameless woman brings shame on father and husband[a], and she will be dishonored by both.
translation:
  language: fr
  text: Une femme effrontée couvre de honte son père et son mari[a], et tous deux la déshonoreront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une femme impudente » ou « une femme sans vergogne ». Le terme grec désigne une femme caractérisée par une audace effrontée.
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα
  choice: son père
  rationale: Complément direct de καταισχύνει. Le possessif, implicite en grec, est naturel et clarifie le lien familial en français.
- source_word: ἄνδρα
  choice: son mari
  rationale: Coordonné à « père » dans un contexte familial, ἀνήρ désigne ici très probablement le mari plutôt qu’un homme quelconque.
- source_word: καταισχύνει
  choice: couvre de honte
  rationale: 'Cette expression française naturelle conserve la valeur causative du verbe : elle fait retomber la honte sur eux.'
- source_word: ἡ θρασεῖα
  choice: une femme effrontée
  rationale: L’adjectif féminin substantivé caractérise une femme d’une audace impudente. « Effrontée » exprime nettement cette valeur morale négative sans suggérer un courage louable.
- source_word: ὑπὸ ἀμφοτέρων
  choice: tous deux
  rationale: L’expression renvoie au père et au mari déjà nommés; dans la tournure active française, « tous deux » devient le sujet.
- source_word: ἀτιμασθήσεται
  choice: la déshonoreront
  rationale: Le futur passif grec signifie qu’elle subira le déshonneur de leur part. La formulation active est plus naturelle en français et maintient le vocabulaire d’honneur et de honte.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La structure en deux propositions et le contraste réciproque de la honte sont conservés; le second passif grec est rendu à l’actif pour éviter une formulation lourde.
