  yaml_path: translation/deuterocanon/sirach/022/003.yaml
  text: A father’s shame is the birth of an undisciplined son[b][a], and a daughter is born for loss.
translation:
  language: fr
  text: La honte d’un père, c’est d’engendrer un fils indiscipliné[a] ; tandis qu’une fille vient au monde pour une perte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « dans l’engendrement d’un indiscipliné ». L’adjectif grec est masculin et, employé substantivement, sous-entend un fils.
    reason: Préciser le nom implicite et la construction nominale du grec.
  - marker: b
    text: Ou « pour un amoindrissement », peut-être « au détriment de son père ». Le grec évoque une diminution ou une perte sans en préciser la nature ni le bénéficiaire.
    reason: Signaler l’ambiguïté de la formule grecque comprimée.
lexical_decisions:
- source_word: αἰσχύνη πατρὸς
  choice: La honte d’un père
  rationale: Le génitif est rendu naturellement par « d’un père ». « Honte » conserve la force directe et proverbiale de αἰσχύνη.
- source_word: ἐν γεννήσει
  choice: c’est d’engendrer
  rationale: Cette formulation française naturelle exprime l’acte de procréation indiqué par γέννησις, sans réduire le syntagme au seul moment de la naissance.
- source_word: ἀπαιδεύτου
  choice: un fils indiscipliné
  rationale: L’adjectif masculin substantivé implique ici un enfant mâle, en parallèle avec « une fille ». Dans la littérature sapientiale, « indiscipliné » rend bien l’absence de formation morale et de discipline.
- source_word: θυγάτηρ
  choice: une fille
  rationale: Traduction directe du terme féminin explicite, conservant la formulation genrée du proverbe.
- source_word: γίνεται
  choice: vient au monde
  rationale: Dans ce contexte portant sur les enfants engendrés, cette expression rend naturellement l’idée de venue à l’existence, tout en restant plus idiomatique que « vient à l’existence ».
- source_word: ἐπʼ ἐλαττώσει
  choice: pour une perte
  rationale: La formule grecque évoque une diminution, un amoindrissement ou une perte sans en préciser exactement la nature ni la personne qui la subit. La traduction garde cette concision et cette ambiguïté.
theological_decisions:
- issue: Formulation genrée du proverbe sapiential
  choice: Conserver « père », le « fils » implicite et « fille ».
  alternative: Employer des termes neutres comme « parent » et « enfant ».
  rationale: Le grec nomme expressément le père et la fille, tandis que le masculin ἀπαιδεύτου implique un fils. Neutraliser ces termes effacerait la structure du texte.
- issue: Appréciation sociale négative de la naissance d’une fille
  choice: Traduire directement l’affirmation ancienne sans l’atténuer.
  alternative: Reformuler de manière générale en évoquant seulement les difficultés familiales.
  rationale: Le texte reflète une conception sociale ancienne potentiellement choquante. La traduction ne doit ni la cautionner par une amplification ni la dissimuler par une reformulation adoucissante.
- issue: Référent et nature de la perte
  choice: Maintenir l’expression indéterminée « pour une perte ».
  alternative: Préciser « au détriment de son père » ou identifier une perte économique ou sociale.
  rationale: Le grec ne nomme explicitement ni la personne lésée ni la nature de l’amoindrissement. Une précision dans le corps du texte résoudrait indûment cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et proverbial. Le balancement « une fille, elle » marque le contraste introduit par δέ. « Pour une perte » est volontairement concis et légèrement marqué afin de ne pas attribuer arbitrairement la perte au père ni d’en préciser la nature.
