base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/022.yaml
  text: If you open your mouth against a friend[a], do not be afraid, for there can be reconciliation—except in the case of insult and arrogance and the revealing of a secret and a treacherous blow; in these things every friend will flee.
translation:
  language: fr
  text: 'Si tu ouvres la bouche contre un ami, ne crains pas, car une réconciliation est possible[a]. Sauf en cas d’insulte, d’arrogance, de révélation d’un secret ou de coup perfide : devant de telles choses, tout ami prendra la fuite.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec peut aussi évoquer la prudence ou l’appréhension. Ici, la suite souligne qu’une réconciliation reste possible.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ φίλον ἐὰν ἀνοίξῃς στόμα
  choice: Si tu as parlé contre un ami
  rationale: L’expression littérale « ouvrir la bouche contre un ami » désigne ici des paroles dirigées contre lui. Le français naturel « parler contre » conserve ce sens sans reproduire un idiome grec peu courant.
- source_word: μὴ εὐλαβηθῇς
  choice: ne crains pas
  rationale: Le verbe peut exprimer la crainte ou la prudence. La mention immédiate d’une réconciliation possible invite à ne pas craindre que la rupture soit irréparable.
- source_word: διαλλαγή
  choice: une réconciliation
  rationale: Le nom désigne le rétablissement de relations rompues; « réconciliation » en donne clairement le sens relationnel.
- source_word: πλὴν
  choice: Mais après
  rationale: Le terme introduit les offenses qui font exception à la possibilité de réconciliation. Cette tournure française relie naturellement la liste à la fuite finale de l’ami.
- source_word: ὀνειδισμοῦ
  choice: une insulte
  rationale: « Insulte » exprime simplement et directement l’outrage verbal en français moderne.
- source_word: ὑπερηφανίας
  choice: de l’arrogance
  rationale: Le mot grec évoque un orgueil hautain manifesté envers autrui; « arrogance » convient au contexte relationnel.
- source_word: μυστηρίου ἀποκαλύψεως
  choice: la révélation d’un secret
  rationale: Dans ce contexte sapientiel, μυστήριον désigne une confidence ou une affaire secrète, non un mystère théologique.
- source_word: πληγῆς δολίας
  choice: un coup porté en traître
  rationale: La formulation préserve à la fois l’idée d’un coup ou d’une blessure et celle de perfidie, sans décider s’il s’agit d’un acte littéral ou figuré.
- source_word: ἀποφεύξεται πᾶς φίλος
  choice: tout ami s’enfuira
  rationale: 'Le verbe marque un éloignement net, et πᾶς φίλος a ici une portée distributive : n’importe quel ami fuira devant de telles offenses.'
