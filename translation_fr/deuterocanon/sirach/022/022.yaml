  source_fidelity: La condition grecque ἐὰν ἀνοίξῃς στόμα est prospective (« si tu ouvres la bouche »), non accomplie (« si tu as parlé »). πλὴν introduit explicitement des exceptions à la possibilité de réconciliation; « Mais après » ajoute une succession temporelle absente du grec. Le reste de la liste et l’idée de retrait complet de l’ami sont bien rendus.
  naturalness: Le texte est globalement naturel, mais « sauf en cas de » rend plus clairement et plus idiomatiquement la valeur exceptive. « Devant de telles choses, tout ami prendra la fuite » est fluide tout en conservant la portée distributive de πᾶς φίλος.
  terminology: « Réconciliation », « insulte », « arrogance », « révélation d’un secret » et « coup perfide » sont des équivalents modernes appropriés. « Ne crains pas » reste une option recevable pour μὴ εὐλαβηθῇς; la note signale sobrement la nuance possible de prudence.
