  yaml_path: translation/deuterocanon/sirach/022/012.yaml
  text: Mourning for the dead is seven days[a], but for a fool and an ungodly man, all the days of his life.
translation:
  language: fr
  text: Le deuil pour un mort dure sept jours ; mais pour un homme insensé et impie[a], il dure tous les jours de sa vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie ici le masculin singulier de manière représentative dans cette maxime de sagesse.
    reason: Préciser la portée générique des formes masculines sans effacer leur forme dans le texte source.
lexical_decisions:
- source_word: πένθος νεκροῦ
  choice: le deuil pour un mort
  rationale: πένθος désigne ici le deuil suscité par la mort de quelqu’un. « Le deuil pour un mort » est naturel, concis et conserve la valeur générique du singulier νεκροῦ.
- source_word: ἑπτὰ ἡμέραι
  choice: dure sept jours
  rationale: Le grec juxtapose « deuil » et « sept jours » sans verbe exprimé. L’ajout de « dure » rend en français le rapport de durée implicite sans modifier le sens.
- source_word: μωροῦ
  choice: un homme insensé
  rationale: Dans la littérature de sagesse, μωρός caractérise une personne dépourvue de sagesse sur les plans moral et pratique, et pas seulement peu intelligente. « Insensé » garde cette portée sapientielle.
- source_word: ἀσεβοῦς
  choice: impie
  rationale: ἀσεβής désigne celui qui manque de respect ou de fidélité envers Dieu. « Impie » est précis, digne et courant dans le registre biblique français.
- source_word: πᾶσαι αἱ ἡμέραι τῆς ζωῆς αὐτοῦ
  choice: tous les jours de sa vie
  rationale: La formulation conserve la structure grecque et le contraste temporel avec les « sept jours » du premier membre.
theological_decisions:
- issue: Masculin singulier représentatif dans une maxime de sagesse
  choice: un homme insensé et impie… sa vie
  alternative: une personne insensée et impie… sa vie
  rationale: Les deux adjectifs grecs et le pronom sont au masculin singulier et décrivent vraisemblablement un même individu représentatif. Le texte principal conserve cette forme, tandis que la note signale sa portée générique.
- issue: Rapport logique de la seconde proposition elliptique
  choice: répéter « il dure » pour indiquer la durée du deuil
  alternative: mais l’insensé et l’impie, tous les jours de sa vie
  rationale: Comme la première proposition, la seconde est sans verbe. Le parallélisme des expressions temporelles indique naturellement que le deuil causé par un tel homme dure toute sa vie. La traduction explicite ce lien grammatical implicite sans expliquer pourquoi.
translation_notes:
  register: Français international moderne, sobre et proverbial. La répétition de « dure » explicite l’ellipse grecque et rend le contraste immédiatement intelligible. « Insensé » et « impie » maintiennent le registre traditionnel de la littérature de sagesse tout en restant compréhensibles.
