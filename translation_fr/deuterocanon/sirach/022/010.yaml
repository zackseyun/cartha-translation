  text: Weep more sweetly over the dead[a], because he has found rest,
translation:
  language: fr
  text: Pleure avec plus de douceur sur un défunt[a], car il est entré dans le repos,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « plus agréablement » ou « plus doucement ». Dans ce contexte de deuil, le comparatif grec suggère vraisemblablement une lamentation plus mesurée ou plus apaisée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥδιον
  choice: avec plus de douceur
  rationale: Le comparatif adverbial signifie littéralement « plus agréablement » ou « plus doucement ». Dans le contexte du deuil, « avec plus de douceur » conserve la valeur comparative sans suggérer que pleurer serait plaisant.
- source_word: κλαῦσον
  choice: Pleure
  rationale: L’impératif aoriste de κλαίω appelle directement à pleurer. « Pleure » est simple, naturel et fidèle.
- source_word: ἐπὶ νεκρῷ
  choice: sur un défunt
  rationale: ἐπί avec le datif désigne ici la personne qui fait l’objet du deuil. « Sur un défunt » conserve la tournure du grec, tandis que « défunt » exprime naturellement le singulier sans préciser le sexe.
- source_word: ὅτι
  choice: car
  rationale: La conjonction introduit la raison de l’exhortation. « Car » convient au registre sapientiel tout en restant courant.
- source_word: ἀνεπαύσατο
  choice: il a trouvé le repos
  rationale: Le moyen de ἀναπαύω exprime l’entrée dans le repos. Cette formulation garde l’image du repos sans ajouter une référence explicite à l’ensevelissement ou une doctrine détaillée de l’au-delà.
theological_decisions:
- issue: La mort présentée comme un repos
  choice: il a trouvé le repos
  alternative: il s’est reposé ; il a été mis en terre
  rationale: Le grec présente la mort comme un repos, sans préciser davantage l’état du défunt. La traduction préserve cette image et sa retenue théologique.
translation_notes:
  register: Français moderne, digne et accessible. L’impératif singulier et la proposition causale sont conservés. La virgule finale reflète le caractère manifestement incomplet de l’extrait fourni, qui constitue le début du verset dans son contexte plus large.
