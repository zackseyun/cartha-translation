  text: I will not be ashamed to shelter a friend[a], and from his presence I will certainly not hide myself,
translation:
  language: fr
  text: Je n’aurai pas honte de protéger un ami et, devant lui, je ne me cacherai certainement pas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec peut aussi se comprendre plus littéralement : « je ne serai nullement caché de devant lui ».'
    reason: Préserve l’ambiguïté possible de κρυβῶ, tout en maintenant dans le texte la lecture réflexive naturelle en français.
lexical_decisions:
- source_word: φίλον
  choice: un ami
  rationale: L’accusatif singulier est employé ici sans possessif explicite. « Un ami » conserve cette portée générale sans introduire « mon ».
- source_word: σκεπάσαι
  choice: protéger
  rationale: Le verbe peut signifier couvrir, abriter ou protéger. Dans ce contexte éthique, « protéger » exprime naturellement le soutien accordé à un ami tout en conservant l’idée de le couvrir.
- source_word: οὐκ αἰσχυνθήσομαι
  choice: Je n’aurai pas honte
  rationale: Cette traduction directe du futur de αἰσχύνομαι est naturelle en français et garde la nuance personnelle de honte.
- source_word: ἀπὸ προσώπου αὐτοῦ
  choice: devant lui
  rationale: L’expression signifie littéralement « loin de son visage » et idiomatiquement « de devant lui » ou « loin de sa présence ». « Devant lui » s’accorde naturellement avec le verbe se cacher.
- source_word: οὐ μὴ κρυβῶ
  choice: je ne me cacherai certainement pas
  rationale: οὐ μή suivi du subjonctif aoriste marque une négation fortement emphatique. La forme κρυβῶ peut être passive, mais le contexte permet naturellement une lecture réflexive en français.
