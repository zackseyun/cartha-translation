  text: It is easier to carry sand and salt and a lump of iron than a senseless man[a].
translation:
  language: fr
  text: Il est plus facile de porter du sable, du sel et un bloc de fer que de porter un homme dépourvu de bon sens[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans intelligence », « insensé » ou « dépourvu d’entendement ».
    reason: Les équivalents français de ἀσύνετον mettent diversement l’accent sur l’intelligence, le discernement ou la compréhension.
lexical_decisions:
- source_word: ἄμμον
  choice: du sable
  rationale: Nom concret employé comme nom de matière; « du sable » est naturel en français et conserve l’image de la charge.
- source_word: ἅλα
  choice: du sel
  rationale: La forme grecque est collective dans cette énumération; le nom de matière français convient au contexte.
- source_word: βῶλον σιδήρου
  choice: un bloc de fer
  rationale: βῶλος désigne une motte, une masse ou un bloc; « bloc de fer » rend naturellement l’objet lourd sans donner à βῶλος son sens agricole.
- source_word: εὔκοπον
  choice: plus facile
  rationale: Bien que l’adjectif signifie « facile », la construction comparative avec ἢ exige en français « plus facile… que ».
- source_word: ὑπενεγκεῖν
  choice: porter
  rationale: Le verbe peut signifier porter, supporter ou endurer. « Porter » maintient d’abord l’image physique des matériaux, tout en laissant entendre le poids relationnel de l’homme comparé à ces charges.
- source_word: ἄνθρωπον
  choice: un homme
  rationale: Le nom grec désigne ici au singulier un être humain et peut se rendre par « homme »; cette formulation conserve la forme personnelle et proverbiale de la comparaison.
- source_word: ἀσύνετον
  choice: dépourvu de bon sens
  rationale: L’adjectif exprime le manque d’intelligence, de compréhension ou de discernement. Cette expression française évite le sens moderne, psychométrique, d’« inintelligent » et ne renforce pas indûment la nuance morale comme pourrait le faire « insensé ».
theological_decisions:
- issue: Portée de ἄνθρωπον
  choice: un homme
  alternative: une personne / un être humain
  rationale: « Un homme » suit la forme grecque et le caractère proverbial de l’énoncé, sans faire de la maxime une affirmation doctrinale sur un sexe particulier.
- issue: Nuance de ἀσύνετον
  choice: dépourvu de bon sens
  alternative: sans intelligence / insensé / dépourvu d’entendement
  rationale: Le grec vise une déficience de compréhension ou de discernement. Le choix retenu préserve cette largeur sémantique sans réduire le terme à l’intelligence mesurée ni imposer une culpabilité morale plus forte.
translation_notes:
  register: Français international moderne, proverbial et digne. La phrase conserve l’accumulation concrète du grec et son contraste abrupt. Le marqueur [a] figure immédiatement après l’expression concernée.
