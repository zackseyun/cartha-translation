  text: A heart set firm on thoughtful understanding is like a plastered wall with a sanded finish[a].
translation:
  language: fr
  text: Un cœur affermi sur une pensée de discernement est comme un enduit sablé sur un mur lissé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’image grecque, architecturale et très condensée, peut se rendre littéralement à peu près ainsi : « un cœur affermi sur une pensée de discernement, comme un revêtement sablé d’un mur lissé ». Le sens précis des termes qui décrivent la surface du mur demeure incertain; l’image évoque néanmoins la stabilité et la bonne tenue d’un ouvrage bien achevé.'
    reason: cultural_note
lexical_decisions:
- source_word: καρδία
  choice: cœur
  rationale: Dans la littérature sapientielle, le cœur désigne le centre intérieur de la pensée et de la volonté, et non les seules émotions.
- source_word: ἠδρασμένη
  choice: affermi
  rationale: Le participe exprime un état résultant de stabilité ou de ferme établissement; « affermi » en conserve la valeur passive et résultative.
- source_word: ἐπὶ
  choice: sur
  rationale: « Sur » maintient le lien imagé entre la fermeté du cœur et ce qui lui sert de fondement, sans trancher davantage la syntaxe.
- source_word: διανοίας συνέσεως
  choice: une pensée pleine de discernement
  rationale: 'La formulation rend les deux notions de la chaîne nominale: διανοία comme pensée ou faculté de réflexion, et σύνεσις comme intelligence discernante.'
- source_word: ὡς
  choice: est comme
  rationale: Cette formulation explicite naturellement la comparaison introduite par ὡς.
- source_word: κόσμος
  choice: ornement
  rationale: Le sens courant d’ordre, parure ou ornement est conservé; dans ce contexte architectural, il s’agit vraisemblablement du traitement ornemental de la surface.
- source_word: ψαμμωτός
  choice: sablé
  rationale: L’adjectif rare dérive de « sable » et paraît décrire un revêtement ou un fini à base de sable; « sablé » reste concis tout en laissant ouverte la technique exacte.
- source_word: τοίχου
  choice: mur
  rationale: Équivalent français direct et naturel de τοῖχος.
- source_word: ξυστοῦ
  choice: poli
  rationale: L’adjectif évoque une surface raclée, lissée ou polie; « poli » rend cette qualité sans confondre le terme avec celui qui se rapporte au sable.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve la densité et l’étrangeté mesurée de l’image architecturale grecque plutôt que de la remplacer par une explication. La note signale l’incertitude lexicale réelle concernant le traitement de la surface.
