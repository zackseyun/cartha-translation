review_pass:
  verdict: revise
  source_fidelity: La structure et les images du grec sont globalement bien rendues. Toutefois, ἐπὶ appelle plus directement « sur » que « devant » dans les deux membres parallèles. Le pronom αὐτῆς est féminin et son antécédent reste incertain ; une note est utile pour signaler cette ambiguïté sans la résoudre.
  naturalness: « Ne me perde pas » est possible, mais « ne me détruise pas » exprime plus naturellement, en français moderne, la force de ἀπολέσῃ με. « Sceau ingénieux » conserve l’image inhabituelle tout en rendant πανοῦργον avec une nuance de capacité habile et calculée.
  terminology: « Garde », « sceau », « bouche », « lèvres » et « langue » maintiennent le réseau imagé du texte. « Ingénieux » est préférable à « habile » pour la nuance plus marquée de πανοῦργον, sans imposer le sens exclusivement péjoratif de « rusé ».
  issues:
