revisions:
- from: Qui placera une garde devant ma bouche et un sceau habile sur mes lèvres, pour que je ne tombe pas à cause d’elle et que ma langue ne me perde pas ?
  to: Qui mettra une garde sur ma bouche et un sceau ingénieux sur mes lèvres, afin que je ne tombe pas à cause d’elle[a] et que ma langue ne me détruise pas ?
  rationale: La révision resserre l’alignement sur les deux emplois de ἐπί, rend plus pleinement le verbe de destruction ἀπολέσῃ et documente l’ambiguïté pronominale du grec. Elle conserve l’interrogation, le parallélisme et le registre sobre du verset.
