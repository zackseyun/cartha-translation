    issue: Orientation spatiale de ἐπί
    rationale: Le projet emploie « devant ma bouche », alors que le grec répète ἐπί (« sur ») pour la bouche et les lèvres. Employer « sur » préserve le parallélisme et l’image source.
  - severity: low
    issue: Force de ἀπολέσῃ με
    rationale: « Ne me perde pas » peut être compris comme « égarer ». « Ne me détruise pas » rend plus explicitement la ruine ou la perte causée par la langue.
  - severity: low
    issue: Ambiguïté de αὐτῆς non signalée
    rationale: Le féminin grec ne permet pas d’identifier avec certitude l’antécédent. Le français conserve « elle », mais une note ancrée évite de donner une fausse impression de précision.
