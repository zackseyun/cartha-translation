  text: Who will set a guard over my mouth, and a shrewd seal over my lips, so that I may not fall because of it, and my tongue destroy me?
translation:
  language: fr
  text: Qui mettra une garde sur ma bouche et un sceau ingénieux sur mes lèvres, afin que je ne tombe pas à cause d’elle[a] et que ma langue ne me détruise pas ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom grec féminin peut renvoyer à la bouche, aux lèvres ou, plus largement, à la faute liée à la parole ; le texte ne précise pas l’antécédent.
    reason: Signale l’ambiguïté grammaticale de αὐτῆς sans la trancher.
lexical_decisions:
- source_word: φυλακήν
  choice: une garde
  rationale: Reproduit l’image concrète d’une surveillance protectrice placée devant la bouche.
- source_word: σφραγῖδα πανοῦργον
  choice: un sceau habile
  rationale: « Sceau » conserve l’image grecque; « habile » rend ici la capacité ingénieuse de retenir les lèvres sans imposer le sens péjoratif de « rusé ».
- source_word: πέσω ἀπʼ αὐτῆς
  choice: je ne tombe pas à cause d’elle
  rationale: Préserve l’ambiguïté du pronom féminin grec, qui peut renvoyer à la bouche ou, plus largement, à la faute commise par la parole.
- source_word: ἀπολέσῃ με
  choice: ne me perde pas
  rationale: Expression française naturelle qui garde la force de destruction ou de ruine du verbe grec.
theological_decisions:
- issue: Référent de αὐτῆς
  choice: à cause d’elle
  alternative: par sa faute / à cause de ma bouche
  rationale: Le grec laisse le référent pronominal implicite; la traduction conserve cette tension au lieu de l’expliciter.
translation_notes:
  register: Français moderne, digne et direct. La structure interrogative et le parallélisme entre bouche, lèvres et langue sont conservés.
