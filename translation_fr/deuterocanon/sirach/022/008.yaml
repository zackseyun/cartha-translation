  text: Telling a story to one who is drowsy is like telling it to a fool[a], and at the end he will say, “What was it?”
translation:
  language: fr
  text: 'Raconter quelque chose à quelqu’un qui somnole, c’est le raconter à un insensé[a] ; à la fin, il dira : « Qu’est-ce que c’est ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La tournure grecque est quelque peu abrupte et répète « celui qui raconte » (διηγούμενος… ὁ διηγούμενος). Le sens paraît comparatif : raconter quelque chose à une personne qui somnole revient à le raconter à un insensé.'
    reason: textual_variant
lexical_decisions:
- source_word: διηγούμενος / ὁ διηγούμενος
  choice: Raconter quelque chose / le raconter
  rationale: Le participe de διηγέομαι désigne l’action de raconter ou d’exposer. La formulation française rend la répétition grecque tout en faisant ressortir la comparaison implicite.
- source_word: νυστάζοντι
  choice: à quelqu’un qui somnole
  rationale: νυστάζω évoque une personne gagnée par le sommeil. « Qui somnole » est naturel et conserve l’image d’un auditeur incapable de rester attentif.
- source_word: μωρῷ
  choice: à un insensé
  rationale: Dans la littérature de sagesse, μωρός désigne l’insensé au sens moral et pratique, et non simplement une personne peu intelligente.
- source_word: ἐπὶ συντελείᾳ
  choice: à la fin
  rationale: L’expression indique l’achèvement du récit ou de l’exposé.
- source_word: Τί ἐστιν;
  choice: Qu’est-ce que c’est ?
  rationale: Cette traduction proche du grec préserve la question abrupte et l’ambiguïté entre une demande d’identification et l’aveu de n’avoir rien compris.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. « Insensé » conserve le registre sapientiel biblique sans réduire μωρός à un jugement sur l’intelligence. La ponctuation explicite la comparaison que la syntaxe grecque exprime de manière abrupte.
