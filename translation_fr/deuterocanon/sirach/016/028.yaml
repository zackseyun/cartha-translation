  text: Each one did not oppress his neighbor[a], and they will never disobey his word.
translation:
  language: fr
  text: Aucun n’a opprimé son voisin, et jamais ils ne désobéiront à sa parole.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕκαστος … οὐκ
  choice: Aucun
  rationale: En français naturel, « aucun » rend clairement la valeur distributive de « chacun… ne pas » sans produire la tournure maladroite « chacun n’a pas ».
- source_word: τὸν πλησίον αὐτοῦ
  choice: son voisin
  rationale: « Voisin » conserve l’idée de celui qui se trouve à proximité et convient au rapport entre les membres de la création décrits dans le contexte.
- source_word: οὐκ ἔθλιψεν
  choice: n’a opprimé
  rationale: Le parfait composé respecte la valeur passée de l’aoriste, tandis qu’« opprimer » conserve l’idée forte de presser ou d’accabler sans réduire le sens à une simple gêne.
- source_word: ἕως αἰῶνος
  choice: jamais
  rationale: Dans cette construction négative, « jamais » exprime naturellement en français l’absence perpétuelle de désobéissance.
- source_word: οὐκ ἀπειθήσουσι
  choice: ils ne désobéiront
  rationale: Le futur et l’idée de refus d’obéir sont rendus directement.
- source_word: τοῦ ῥήματος αὐτοῦ
  choice: à sa parole
  rationale: « Parole » préserve l’étendue sémantique de ῥῆμα, qui peut désigner une parole, une déclaration ou un ordre, sans imposer ici le sens plus étroit de « commandement ».
theological_decisions:
- issue: Référent de « sa » dans « sa parole »
  choice: Le pronom est conservé, Dieu étant le référent implicite le plus probable.
  alternative: Expliciter « à la parole de Dieu » ou comprendre un autre référent singulier fourni par le contexte.
  rationale: Le contexte de l’ordre de la création indique probablement Dieu, mais le grec emploie seulement un pronom. La traduction maintient donc cette formulation sans explicitation.
translation_notes:
  register: Français moderne, sobre et digne. La formulation évite le calque peu naturel « chacun n’a pas » tout en conservant la portée distributive de la négation et le passage du singulier au pluriel présent dans le grec.
