  text: He did not spare the princes of old[b][a], who revolted in their might.
translation:
  language: fr
  text: Il n’a pas épargné les princes d’autrefois[a], qui se sont rebellés dans leur puissance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « les géants d’autrefois »; il identifie ainsi les « princes d’autrefois » aux rebelles des temps primordiaux.'
    reason: alternative_reading
  - marker: b
    text: La leçon hébraïque est difficile ici, notamment le mot rendu littéralement par « pour toujours »; le grec soutient le sens « dans leur puissance ».
    reason: textual_variant
lexical_decisions:
- source_word: לֹא נָשָׂא
  choice: n’a pas épargné
  rationale: Dans ce contexte de jugement, l’expression signifie qu’il n’a accordé ni pardon ni indulgence. Le grec οὐκ ἐξιλάσατο confirme ce sens plutôt qu’une traduction littérale de « porter ».
- source_word: לֲנְסִיכֵי קֶדֶם
  choice: les princes d’autrefois
  rationale: Le texte hébreu désigne littéralement des princes ou dirigeants des temps anciens. Cette formulation reste naturelle en français et conserve la priorité du témoin hébreu; le grec « les géants d’autrefois » est signalé en note.
- source_word: הַמּוֹרִים
  choice: qui se sont rebellés
  rationale: Le participe issu de מרה exprime la rébellion ou la désobéissance. « Se sont rebellés » rend clairement l’action et sa portée morale.
- source_word: עוֹלָם בִּגְבוּרָתָם
  choice: en s’appuyant sur leur puissance
  rationale: La leçon hébraïque avec עוֹלָם est difficile, tandis que בִּגְבוּרָתָם désigne leur force ou puissance. Le grec τῇ ἰσχύϊ αὐτῶν appuie nettement le sens « par/dans leur puissance ». La tournure française explicite la puissance comme fondement de leur rébellion sans effacer la difficulté textuelle, indiquée en note.
theological_decisions:
- issue: Identification du groupe jugé
  choice: Le texte principal suit l’hébreu « les princes d’autrefois ».
  alternative: Le grec lit « les géants d’autrefois », identifiant ces personnages aux rebelles des temps primordiaux.
  rationale: L’hébreu conservé demeure la source principale. La lecture grecque constitue toutefois un ancien témoignage interprétatif pertinent; elle est donc préservée en note sans imposer son identification au texte principal.
translation_notes:
  register: Français international moderne, digne et accessible. « Princes d’autrefois » préserve la formulation hébraïque; « en s’appuyant sur leur puissance » est idiomatique et rend la relation entre leur rébellion et leur force.
