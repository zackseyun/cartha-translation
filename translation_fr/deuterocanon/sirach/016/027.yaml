base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/027.yaml
  text: He ordered his works forever[a], and their beginnings for their generations; they neither hungered nor grew weary, and they did not cease from their works.
translation:
  language: fr
  text: Il a mis ses œuvres en ordre pour toujours et a établi leurs pouvoirs[a] pour toutes leurs générations. Elles n’ont connu ni la faim ni la fatigue et n’ont pas cessé d’accomplir leurs tâches.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs commencements ». Le mot grec peut désigner des commencements, mais aussi des pouvoirs ou des domaines d’autorité et d’activité.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκόσμησεν
  choice: a ordonné
  rationale: Dans ce contexte cosmologique, le verbe désigne la mise en ordre harmonieuse de la création, plutôt que son ornementation.
- source_word: εἰς αἰῶνα
  choice: pour toujours
  rationale: Cette expression rend naturellement en français la permanence durable indiquée par le grec.
- source_word: τὰ ἔργα αὐτοῦ
  choice: ses œuvres
  rationale: Le terme renvoie aux réalités créées par Dieu tout en restant proche de la formulation grecque.
- source_word: τὰς ἀρχὰς αὐτῶν
  choice: leurs domaines
  rationale: Le pluriel ἀρχαί peut désigner des sphères d’autorité ou d’activité. « Domaines » convient au contexte du fonctionnement ordonné et durable de la création, sans exclure dans une note le sens lexical de « commencements ».
- source_word: εἰς γενεὰς αὐτῶν
  choice: pour toutes leurs générations
  rationale: La tournure exprime la continuité de cet ordre au fil des générations propres aux œuvres créées; « toutes » explicite en français la portée distributive et durable du pluriel.
- source_word: οὔτε ἐπείνασαν οὔτε ἐκοπίασαν
  choice: n’ont connu ni la faim ni la fatigue
  rationale: Cette formulation française naturelle conserve le parallélisme et exprime l’absence de besoin et d’épuisement.
- source_word: οὐκ ἐξέλιπον ἀπὸ τῶν ἔργων αὐτῶν
  choice: n’ont jamais cessé d’accomplir leurs tâches
  rationale: Le verbe indique qu’elles n’ont ni failli ni interrompu l’activité qui leur revient. « Tâches » évite ici la répétition lourde de « œuvres » et clarifie qu’il s’agit de leurs fonctions assignées.
theological_decisions:
- issue: Sens de τὰς ἀρχὰς αὐτῶν dans l’ordre créé
  choice: Les œuvres de Dieu possèdent des domaines ou sphères d’activité durables au sein de la création.
  alternative: L’expression désigne leurs commencements ou leurs origines à travers leurs générations.
  rationale: Le contexte décrit les éléments de la création accomplissant continuellement leurs fonctions sans faim, fatigue ni défaillance. Le sens « domaines » s’intègre mieux à cette progression, tandis que le sens lexical possible « commencements » est conservé en note afin de ne pas supprimer l’ambiguïté du grec.
translation_notes:
  register: Français international moderne, digne et accessible. Le pronom féminin pluriel « elles » reprend « ses œuvres ». La syntaxe conserve les deux propositions du grec tout en rendant naturellement leur parallélisme.
