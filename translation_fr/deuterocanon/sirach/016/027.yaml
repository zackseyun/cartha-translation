- from: Il a ordonné ses œuvres pour toujours et fixé leurs domaines[a] pour toutes leurs générations. Elles n’ont connu ni la faim ni la fatigue et n’ont jamais cessé d’accomplir leurs tâches.
  to: Il a mis ses œuvres en ordre pour toujours et a établi leurs pouvoirs[a] pour toutes leurs générations. Elles n’ont connu ni la faim ni la fatigue et n’ont pas cessé d’accomplir leurs tâches.
  rationale: La révision lève une ambiguïté française dans le premier verbe et retire l’intensification non exprimée de « jamais ». Elle conserve une lecture contextuellement solide de ἀρχάς comme pouvoirs assignés au sein de l’ordre créé, tout en maintenant en note l’alternative lexicale « commencements ».
