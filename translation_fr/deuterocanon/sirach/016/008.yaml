  text: And he did not spare Lot’s neighbors[b][a], who became arrogant in their pride.
translation:
  language: fr
  text: Il n’épargna pas les gens parmi lesquels Lot séjournait[a], eux qui, dans leur orgueil, se montraient arrogants[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « les lieux de séjour de Lot » ou « ceux du séjour de Lot ». L’expression hébraïque est inhabituelle; elle désigne vraisemblablement la communauté au milieu de laquelle Lot vivait.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu est difficile. Autre compréhension possible : « ceux qui se rendirent odieux par leur orgueil ». Le grec porte : « ceux qu’il prit en horreur à cause de leur orgueil ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא חָמַל
  choice: Il n’épargna pas
  rationale: Le verbe חמל peut exprimer la pitié ou le fait d’épargner. Dans ce contexte de jugement, « ne pas épargner » est naturel et correspond aussi au grec οὐκ ἐφείσατο.
- source_word: מְגוּרֵי לוֹט
  choice: les gens parmi lesquels Lot séjournait
  rationale: מגורים se rapporte au séjour ou à la résidence comme étranger. Cette formulation française désigne naturellement la communauté du lieu où Lot résidait, sans remplacer l’expression hébraïque par le nom explicite de Sodome.
- source_word: הַמִּתְעַבְּרִים
  choice: se montraient arrogants
  rationale: La forme hébraïque est difficile. En lien avec בְּגַאֲוָתָם, elle paraît décrire une conduite hautaine ou arrogante; une note conserve l’autre compréhension attestée par le grec.
- source_word: בְּגַאֲוָתָם
  choice: dans leur orgueil
  rationale: La préposition ב peut ici marquer la sphère, le moyen ou la cause. « Dans leur orgueil » préserve cette souplesse tout en restant idiomatique.
theological_decisions:
- issue: Identité des personnes associées au séjour de Lot
  choice: les gens parmi lesquels Lot séjournait
  alternative: les voisins de Lot; les habitants de Sodome
  rationale: Le contexte renvoie aux habitants du lieu où vivait Lot, mais l’hébreu ne les nomme pas directement comme « habitants de Sodome ». La traduction conserve cette désignation indirecte.
- issue: Rapport entre leur orgueil et le jugement divin
  choice: leur conduite arrogante est caractérisée par leur orgueil
  alternative: Dieu les prit en horreur à cause de leur orgueil
  rationale: L’hébreu difficile semble décrire les personnes elles-mêmes, tandis que le grec formule explicitement la réaction divine. La traduction principale suit l’hébreu et la note signale le témoignage grec sans effacer la tension.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « les gens parmi lesquels Lot séjournait » évite l’expression peu naturelle « les séjournants de Lot » tout en conservant l’idée de séjour. Les notes rendent visibles les difficultés textuelles et la divergence de formulation entre l’hébreu et le grec.
