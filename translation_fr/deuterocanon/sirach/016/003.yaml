  to: Ne te fie pas à leur vie et ne compte pas sur leur avenir[a], car ils n’auront pas une fin heureuse. Mieux vaut une seule personne qui fait ce qui plaît[b] que mille, et mieux vaut mourir sans enfants que d’avoir beaucoup d’enfants qui vivent dans l’injustice et de connaître une fin marquée par la présomption[c].
