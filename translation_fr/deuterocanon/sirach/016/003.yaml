base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/003.yaml
  text: Do not trust in their life[a], and do not rely on their future; for one who does what is pleasing is better than a thousand[c][b], and to die childless than to have many children in unrighteousness and a lawless end.
translation:
  language: fr
  text: Ne te fie pas à leur vie et ne compte pas sur leur avenir[a], car ils n’auront pas une fin heureuse. Mieux vaut une seule personne qui fait ce qui plaît[b] que mille, et mieux vaut mourir sans enfants que d’avoir beaucoup d’enfants qui vivent dans l’injustice et de connaître une fin marquée par la présomption[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte ici « ne t’attache pas à leur place » ou « ne compte pas sur leur position », tandis que l’hébreu évoque ce qui vient après eux, leur avenir ou leur issue.
    reason: textual_variant
  - marker: b
    text: 'Autre traduction : « qui accomplit la volonté ». Il s’agit probablement de faire ce qui plaît à Dieu, mais Dieu n’est pas nommé explicitement dans l’hébreu.'
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu est très condensé. La dernière expression peut aussi se comprendre : « plutôt qu’une fin présomptueuse » ou « plutôt qu’une mauvaise fin » ; elle oppose dans tous les cas la mort sans enfants à une nombreuse descendance associée à l’injustice et à une fin mauvaise.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּאֲמִין בְּחַיֵּיהֶם
  choice: Ne compte pas sur leur vie
  rationale: Le hifil de אמן avec ב exprime ici la confiance placée en quelqu’un ou en quelque chose. Cette formulation conserve l’expression concise de l’hébreu et l’idée qu’il ne faut pas tirer assurance de la vitalité apparente de ces enfants.
- source_word: וְאַל תִּבְטַח בְּעִקְבוֹתָם
  choice: et ne mets pas ta confiance dans leur avenir
  rationale: בטח relève de la confiance et de la sécurité. עִקְבוֹתָם désigne littéralement ce qui vient à la suite, d’où « avenir » ou « issue »; la proposition suivante, qui évoque leur fin, favorise cette lecture prospective.
- source_word: אַחֲרִית טוֹבָה
  choice: une fin heureuse
  rationale: אַחֲרִית peut désigner la fin, l’issue ou le devenir. « Fin heureuse » rend naturellement en français le jugement porté sur leur destinée, sans préciser la nature de cette fin.
- source_word: כִּי טוֹב אֶחָד ... מֵאָלֶף
  choice: Mieux vaut une seule personne ... que mille
  rationale: L’hébreu formule une comparaison elliptique. Cette tournure française restitue clairement la supériorité d’une seule personne conforme au bien sur une multitude.
- source_word: עוֹשֶׂה רָצוֹן
  choice: qui fait ce qui est agréable
  rationale: רָצוֹן peut exprimer la volonté, l’agrément ou ce qui est acceptable. La formulation garde implicite celui à qui cela plaît, comme dans l’hébreu, tout en conservant la portée morale de l’expression.
- source_word: וּמוֹת עֲרִירִי
  choice: et mieux vaut mourir sans enfants
  rationale: עֲרִירִי signifie privé de descendance ou sans enfants. La répétition de « mieux vaut » explicite en français le parallélisme comparatif laissé elliptique en hébreu.
- source_word: בָּנִים רַבִּים בְּעַוְלָה
  choice: beaucoup d’enfants vivant dans l’injustice
  rationale: עַוְלָה désigne l’injustice, le tort ou l’iniquité. « Vivant dans l’injustice » rattache naturellement cette qualification morale aux nombreux enfants dans le contexte.
- source_word: וּמֵאַחֲרִית זָדוֹן
  choice: et de connaître une fin marquée par l’arrogance
  rationale: זָדוֹן associe arrogance, présomption et méchanceté délibérée. La syntaxe hébraïque est comprimée; cette formulation française conserve l’idée d’une mauvaise fin caractérisée par une attitude de défi orgueilleux, tout en signalant l’incertitude dans une note.
theological_decisions:
- issue: Objet implicite de « fait ce qui est agréable »
  choice: Laisser l’objet implicite dans le texte principal.
  alternative: « qui fait la volonté de Dieu » ou « qui fait ce qui plaît à Dieu »
  rationale: Dans ce contexte sapientiel, Dieu est vraisemblablement l’objet sous-entendu, mais l’hébreu ne le nomme pas. L’ajouter dans le texte principal lèverait une ambiguïté réelle.
- issue: Comparaison entre l’absence d’enfants et une nombreuse descendance injuste
  choice: Conserver sans l’atténuer la comparaison tranchée du verset.
  alternative: Reformuler de manière moins absolue ou limiter explicitement le propos à une situation particulière.
  rationale: Le texte affirme que la droiture vaut davantage qu’une descendance nombreuse et mauvaise. La traduction garde cette tension sapientielle sans la transformer en jugement général sur la valeur des personnes sans enfants.
- issue: Portée de la dernière expression sur la mauvaise fin
  choice: La rattacher à la situation de celui qui a eu beaucoup d’enfants vivant dans l’injustice.
  alternative: Comprendre séparément la formule comme « plutôt qu’une fin présomptueuse/mauvaise » ou la rattacher directement aux enfants.
  rationale: Le membre hébreu est très condensé et permet plusieurs articulations. Le texte principal adopte une lecture syntaxiquement fluide, tandis que la note préserve l’autre possibilité.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier correspond aux impératifs hébreux adressés au lecteur. Les répétitions nécessaires au parallélisme ont été conservées ou légèrement explicitées pour assurer une lecture naturelle.
