  - severity: low
    issue: Nuance de זָדוֹן
    rationale: « Arrogance » ne couvre qu’une partie de la nuance de présomption insolente ou de mal délibéré. « Présomption » est plus proche, avec une note qui maintient les possibilités « mauvaise fin » et le rattachement syntaxique disputé.
