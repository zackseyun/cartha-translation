- from: L’injuste n’échappera pas avec son butin, et le désir du juste ne sera jamais anéanti.[a]
  to: L’injuste n’échappera pas grâce au pillage, et le désir du juste ne sera jamais frustré.[a]
  rationale: 'La révision suit prioritairement l’hébreu : « l’injuste » conserve la nuance de עַוָּל, et « grâce au pillage » rend le rapport exprimé par בְּגָזֵל sans ajouter de possessif. « Ne sera jamais frustré » est une formulation française naturelle pour le désir du juste, qui évite la force excessive d’« anéanti » tout en exprimant qu’il ne sera pas empêché d’aboutir. La note maintient la leçon grecque distincte — la persévérance de l’homme pieux — et son contraste avec le texte hébreu.'
