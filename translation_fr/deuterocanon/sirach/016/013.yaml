  text: An unjust one will not escape with plunder[a], and the desire of the righteous will never fail.
translation:
  language: fr
  text: L’injuste n’échappera pas grâce au pillage, et le désir du juste ne sera jamais frustré.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « et la persévérance de l’homme pieux ne tardera certainement pas ». L’hébreu parle plutôt du désir du juste.'
    reason: Variante significative entre les témoins hébreu et grec.
lexical_decisions:
- source_word: לֹא יִמָּלֵט
  choice: n’échappera pas
  rationale: Le nifal de מלט exprime ici le fait d’échapper ou d’être délivré. « N’échappera pas » est direct, naturel et concorde avec le grec ἐκφεύξεται.
- source_word: בְּגָזֵל
  choice: avec son butin
  rationale: גזל désigne ce qui est obtenu par vol ou violence, et בְּ peut marquer le moyen ou la circonstance concomitante. « Avec son butin » exprime naturellement que le gain mal acquis ne permettra pas à l’injuste d’échapper; le possessif est idiomatique et n’ajoute pas un autre référent.
- source_word: עַוָּל
  choice: l’injuste
  rationale: עַוָּל désigne celui qui agit injustement ou avec perversité. « L’injuste » conserve la nuance propre de l’hébreu et forme un contraste net avec « le juste », sans substituer le terme grec plus général « pécheur ».
- source_word: וְלֹא יַשְׁבִּית
  choice: ne sera jamais anéanti
  rationale: Le hifil de שבת signifie « faire cesser ». La tournure passive française évite d’attribuer artificiellement le verbe à « l’injuste » et rend l’idée que le désir du juste ne sera pas supprimé, tout en restant naturelle.
- source_word: תַּאֲוַת צַדִּיק
  choice: le désir du juste
  rationale: תַּאֲוָה signifie désir ou aspiration, tandis que צַדִּיק est ici un singulier générique. La traduction conserve ce singulier et la correspondance lexicale.
- source_word: לְעוֹלָם
  choice: jamais
  rationale: Avec la négation, לְעוֹלָם a ici la valeur idiomatique de « jamais ».
theological_decisions:
- issue: Désignation morale עַוָּל face au grec ἁμαρτωλός
  choice: l’injuste
  alternative: le pécheur
  rationale: Le texte principal suit le témoin hébreu, dont le terme souligne l’injustice. Le grec emploie le terme plus général « pécheur »; cette nuance ne doit pas remplacer silencieusement celle de l’hébreu.
- issue: Sens et construction du second membre
  choice: le désir du juste ne sera jamais anéanti
  alternative: la persévérance de l’homme pieux ne tardera certainement pas
  rationale: L’hébreu parle du désir du juste et emploie un verbe signifiant « faire cesser ». Le passif français préserve le résultat promis sans imposer un sujet grammatical absent du verset isolé. La leçon grecque diffère sensiblement et est signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme entre « l’injuste » et « le juste » est conservé. La note rend visible la divergence réelle du grec sans la faire entrer dans le texte principal.
