  source_fidelity: 'Le sens général est fidèlement rendu : l’obstination d’un individu n’empêche pas le jugement, et le verset juxtapose miséricorde, colère, pardon et colère appliquée aux méchants. Toutefois, « il laisse sa fureur reposer » affaiblit légèrement le factitif hébreu יַנִּיחַ (« il fait reposer / il pose »).'
  naturalness: « Même s’il n’y en a qu’un qui raidit la nuque » est compréhensible, mais lourd et peu idiomatique. « Même si un seul homme raidit sa nuque » est plus direct tout en conservant l’image. « Il fait reposer sa fureur » est plus naturel et plus exact que « il laisse sa fureur reposer ».
  terminology: « Acquitté » préserve bien la portée judiciaire de יִנָּקֶה / ἀθῳωθήσεται. « Compassion » et « colère » rendent adéquatement רַחֲמִים et אַף. Le maintien de « supporte et pardonne » respecte utilement l’ambiguïté compacte de וְנוֹשֵׂא וְסוֹלֵחַ.
