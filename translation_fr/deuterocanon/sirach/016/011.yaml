  yaml_path: translation/deuterocanon/sirach/016/011.yaml
  text: Even if one person is stiff-necked[a], it is astonishing if he will be cleared; for mercy and anger are with him, and he bears and forgives[b], but upon the wicked he lets his wrath rest.
translation:
  language: fr
  text: 'Même si un seul homme raidit sa nuque, il est étonnant qu’il soit acquitté[a]. Car la compassion et la colère sont avec lui : il supporte et pardonne, mais il fait reposer sa fureur sur les méchants[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’il reste impuni ». Le verbe hébreu יִנָּקֶה et le grec ἀθῳωθήσεται peuvent désigner le fait d’être reconnu exempt de faute ou de peine.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement qu’il fait reposer sa fureur sur les méchants, image d’une colère qui vient se fixer sur eux plutôt que d’éclater seulement.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְשֶׁה עֹרֶף / σκληροτράχηλος
  choice: qui raidit la nuque
  rationale: Cette formulation conserve l’image hébraïque de la nuque raidie, qui exprime une résistance obstinée, tout en restant intelligible en français moderne.
- source_word: תֵּמַהּ זֶה / θαυμαστὸν τοῦτο
  choice: il est étonnant
  rationale: Les témoins hébreu et grec présentent comme remarquable, voire surprenante, l’éventualité qui suit. Cette tournure en garde la force rhétorique sans archaïsme.
- source_word: יִנָּקֶה / ἀθῳωθήσεται
  choice: qu’il soit acquitté
  rationale: Le verbe a une portée judiciaire et peut évoquer l’innocence reconnue ou l’exemption de peine. « Acquitté » préserve cette dimension sans réduire entièrement le sens à l’impunité.
- source_word: רַחֲמִים
  choice: la compassion
  rationale: Le nom désigne une miséricorde profondément compatissante. « Compassion » est naturel en français et maintient son contraste avec la colère.
- source_word: אַף
  choice: la colère
  rationale: Dans ce contexte, אַף est le nom désignant la colère, et non la conjonction signifiant « aussi » ; le parallélisme avec רָגְזוֹ le confirme.
- source_word: וְנוֹשֵׂא
  choice: il supporte
  rationale: Le verbe signifie porter ou supporter et peut évoquer le fait de supporter l’offense. Cette traduction conserve l’expression concise sans lui fournir un complément absent de l’hébreu.
- source_word: וְסוֹלֵחַ
  choice: pardonne
  rationale: Il s’agit du sens ordinaire du verbe dans les contextes de pardon divin ; « pardonne » est clair, actuel et précis.
- source_word: יַנִּיחַ רָגְזוֹ
  choice: il laisse sa fureur reposer
  rationale: La traduction conserve l’image hébraïque d’une fureur qui vient reposer sur les méchants, plutôt que de la remplacer par la seule idée d’une explosion de colère.
theological_decisions:
- issue: La compassion et la colère sont toutes deux attribuées à Dieu
  choice: Conserver explicitement la juxtaposition de la compassion et de la colère, puis celle du pardon et de la fureur reposant sur les méchants.
  alternative: Atténuer la colère ou reformuler le verset pour mettre uniquement l’accent sur la compassion.
  rationale: L’hébreu maintient délibérément cette tension dans le caractère et l’action de Dieu. La traduction ne doit ni la supprimer ni la résoudre selon une construction doctrinale particulière.
- issue: Portée judiciaire de יִנָּקֶה
  choice: « qu’il soit acquitté »
  alternative: « qu’il reste impuni » ou « qu’il soit déclaré innocent »
  rationale: « Acquitté » garde la tonalité judiciaire commune à l’hébreu et au grec, tout en laissant ouverte la nuance exacte entre reconnaissance d’innocence et exemption de sanction.
translation_notes:
  register: Français international moderne, digne et accessible. L’image biblique de la nuque raidie est conservée sous forme verbale afin d’éviter l’expression plus figée et moins courante « avoir la nuque raide ». Le pronom « lui » maintient l’implicite du texte source, où Dieu est le référent sans être nommé dans cette phrase.
