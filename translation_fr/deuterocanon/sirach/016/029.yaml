  text: And after this the Lord looked upon the earth and filled it with his good things.
translation:
  language: fr
  text: Après cela, le Seigneur porta son regard sur la terre et la remplit de ses biens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Après cela
  rationale: Rend naturellement la succession temporelle exprimée par le grec, sans développer le pluriel littéral « ces choses ».
- source_word: Κύριος
  choice: le Seigneur
  rationale: Titre divin usuel en français biblique, avec l’article requis par la syntaxe française.
- source_word: εἰς τὴν γῆν ἐπέβλεψεν
  choice: porta son regard sur la terre
  rationale: Exprime le mouvement du regard vers la terre contenu dans εἰς et ἐπιβλέπω, dans un français actuel et digne.
- source_word: ἐνέπλησεν
  choice: la remplit
  rationale: Le verbe signifie directement « remplir »; le pronom féminin reprend sans ambiguïté « la terre ».
- source_word: τῶν ἀγαθῶν αὐτοῦ
  choice: de ses biens
  rationale: Le génitif indique ce dont la terre est remplie. « Biens » conserve la largeur sémantique de ἀγαθά, qui peut désigner de bonnes choses ou des bienfaits, sans préciser davantage.
theological_decisions:
- issue: Rendu du titre divin Κύριος
  choice: le Seigneur
  alternative: Seigneur
  rationale: Κύριος fonctionne ici comme titre divin; l’article défini donne la formulation française naturelle sans ajouter d’identification absente du texte grec.
- issue: Portée de τὰ ἀγαθά appliqué à Dieu
  choice: ses biens
  alternative: ses bienfaits / ses bonnes choses
  rationale: « Ses biens » maintient la formulation générale du grec et n’impose pas une lecture exclusivement spirituelle ou matérielle.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation garde le parallélisme des deux actions divines et reste proche de la syntaxe grecque sans calque maladroit.
