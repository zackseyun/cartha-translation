  text: Do not desire the appearance of worthless youths[a], and do not rejoice in sons of unrighteousness.
translation:
  language: fr
  text: Ne désire pas l’apparence de jeunes gens sans valeur[a], et ne te réjouis pas de fils injustes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « Ne désire pas une multitude d’enfants inutiles, et ne te réjouis pas de fils impies. » Le témoin hébreu parle plutôt de l’apparence de jeunes gens sans valeur.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּתְאַוֶּה
  choice: Ne désire pas
  rationale: La construction avec אַל exprime une interdiction. « Ne désire pas » restitue clairement le sens volitif sans l’intensifier.
- source_word: תֹּאַר
  choice: la belle apparence
  rationale: תֹּאַר désigne la forme ou l’apparence extérieure, souvent avec une nuance de beauté. « La belle apparence » rend ce sens physique sans déplacer le texte vers l’idée grecque de multitude.
- source_word: נַעֲרֵי שָׁוְא
  choice: de jeunes gens sans valeur
  rationale: נַעֲרֵי désigne des jeunes gens, tandis que שָׁוְא évoque la vacuité, la vanité ou l’absence de valeur. Cette formulation est naturelle en français et conserve la portée morale du groupe nominal.
- source_word: וְאַל תִּשְׂמַח
  choice: et ne te réjouis pas
  rationale: Cette traduction reproduit l’interdiction parallèle et la force affective du verbe שׂמח.
- source_word: בִּבְנֵי עַוְלָה
  choice: de fils injustes
  rationale: « Fils » conserve le référent masculin de בְּנֵי. L’adjectif « injustes » exprime naturellement la qualité indiquée par עַוְלָה, sans imposer une tournure française opaque comme « fils d’injustice ».
- source_word: Μὴ ἐπιθύμει τέκνων πλῆθος ἀχρήστων
  choice: non retenu dans le texte principal
  rationale: Le grec parle d’une multitude d’enfants inutiles, contrairement à l’hébreu conservé, qui mentionne l’apparence de jeunes gens sans valeur. L’hébreu gouverne ici le texte principal, et la variante grecque est signalée en note.
theological_decisions:
- issue: Choix du texte lorsque l’hébreu et le grec divergent
  choice: Suivre l’hébreu conservé dans le texte principal et donner la forme grecque en note
  alternative: 'Suivre le grec : « Ne désire pas une multitude d’enfants inutiles, et ne te réjouis pas de fils impies. »'
  rationale: Puisque le texte hébreu de Ben Sira est attesté ici avec une confiance élevée, il sert de source principale. La divergence substantielle du grec doit toutefois rester visible afin de ne pas masquer la variation textuelle.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme des deux interdictions est conservé. « Jeunes gens » et « fils » maintiennent les désignations masculines du texte hébreu; la note expose sans la résoudre la divergence importante avec le grec.
