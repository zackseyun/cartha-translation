base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/018.yaml
  text: 'Look—the heavens and the highest heavens[a], the deep and the earth: when he descends upon them, they stand still[b]; at his visitation they quake.'
translation:
  language: fr
  text: 'Voici les cieux et les cieux des cieux[a], l’abîme et la terre : quand il descend sur eux, ils restent immobiles[b] ; quand il intervient, ils tremblent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les cieux et les cieux des cieux », expression qui désigne les cieux les plus élevés.'
    reason: lexical_alternative
  - marker: b
    text: 'Le texte hébreu composite porte : « quand il descend sur eux, ils restent immobiles ». Cette proposition est difficile et n’apparaît pas dans le texte grec parallèle, qui relie directement « l’abîme et la terre » à leur ébranlement lors de l’intervention de Dieu.'
    reason: textual_variant
lexical_decisions:
- source_word: הֵן
  choice: Voici
  rationale: Marque l’insistance et attire l’attention dans un registre français actuel et digne.
- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: les cieux et les cieux des cieux
  rationale: Conserve l’expression superlative hébraïque et son ampleur poétique sans la réduire à une interprétation unique.
- source_word: תְהוֹם
  choice: l’abîme
  rationale: Rend le profond primordial désigné par l’hébreu ; le grec ἄβυσσος confirme ce champ sémantique.
- source_word: בְּרִדְתּוֹ עֲלֵיהֶם עוֹמְדִים
  choice: quand il descend sur eux, ils restent immobiles
  rationale: Traduit directement le texte hébreu composite tout en signalant en note la difficulté textuelle et l’absence de cette proposition dans le parallèle grec.
- source_word: בְּפָקְדוֹ
  choice: quand il intervient
  rationale: פקד évoque ici une intervention ou visitation divine. « Intervient » est naturel en français moderne et évite le sens courant trompeur de « visitation ».
- source_word: יִרְגְּשׁוּ
  choice: ils tremblent
  rationale: Exprime l’ébranlement cosmique ; le grec σαλευθήσονται soutient ce sens.
theological_decisions:
- issue: Langage anthropomorphique de l’action divine
  choice: quand il descend sur eux
  alternative: lors de son intervention
  rationale: Le texte hébreu conservé mentionne explicitement la descente. La traduction maintient cette image sans la neutraliser, tandis que la note expose le témoignage grec plus bref.
- issue: Sens de la visite divine
  choice: quand il intervient
  alternative: lors de sa visite
  rationale: Préserve l’idée d’une action divine décisive sans imposer si elle relève de l’inspection, du jugement ou d’une autre manifestation.
translation_notes:
  register: Français international moderne, lisible et solennel. La syntaxe poétique et l’image de la descente sont conservées ; la difficulté du témoin hébreu est explicitement signalée plutôt que résolue silencieusement.
