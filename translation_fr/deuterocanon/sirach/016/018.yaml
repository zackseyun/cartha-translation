  terminology: « Cieux des cieux » préserve avec justesse la formule superlative hébraïque, explicitée par la note a. « Abîme » convient à תְהוֹם et reste cohérent avec le grec ἄβυσσος. « Tremblent » restitue naturellement l’ébranlement de יִרְגְּשׁוּ. Aucun terme théologique n’impose une lecture confessionnelle.
