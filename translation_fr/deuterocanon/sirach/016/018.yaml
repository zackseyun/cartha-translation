  source_fidelity: 'Le texte français rend fidèlement le témoin hébreu : l’appel emphatique (« Voici »), « les cieux et les cieux des cieux », « l’abîme et la terre », la descente divine, leur immobilité, puis leur tremblement lors de son intervention. Il conserve, sans l’harmoniser, la tension du texte hébreu composite entre « ils restent immobiles » et « ils tremblent ». La note b signale justement que le grec parallèle ne contient pas la première proposition et associe directement les réalités cosmiques à l’ébranlement lors de l’intervention divine.'
