  text: The surface of it covered the life of every living thing[b][a], and to it is their return.
translation:
  language: fr
  text: Sa surface[a] a couvert la vie de tout être vivant, et c’est vers elle qu’ils retournent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son visage ». Le grec désigne vraisemblablement la face, c’est-à-dire la surface, de la terre.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « et c’est en elle qu’ils retournent ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ψυχὴν
  choice: la vie
  rationale: Avec παντὸς ζῴου, ψυχή désigne ici la vie animée plutôt qu’une âme immatérielle.
- source_word: παντὸς ζῴου
  choice: de tout être vivant
  rationale: Cette formulation conserve la portée générale de ζῷον sans la limiter aux seuls animaux.
- source_word: ἐκάλυψεν
  choice: a couvert
  rationale: Rend directement le sens ordinaire du verbe, sans ajouter d’interprétation.
- source_word: τὸ πρόσωπον αὐτῆς
  choice: sa surface
  rationale: Littéralement « son visage » ; dans ce contexte cosmologique, l’expression désigne naturellement la surface de la terre, référent féminin implicite.
- source_word: καὶ εἰς αὐτὴν
  choice: et c’est vers elle
  rationale: εἰς peut signifier « vers » ou « dans ». « Vers elle » exprime le mouvement de retour tout en évitant de préciser indûment l’image de l’ensevelissement.
- source_word: ἡ ἀποστροφὴ αὐτῶν
  choice: qu’ils retournent
  rationale: ἀποστροφή indique ici le retour ou le fait de se tourner de nouveau vers son point d’origine ; une tournure verbale est plus naturelle en français.
theological_decisions:
- issue: Référent des pronoms féminins αὐτῆς et αὐτὴν
  choice: Les rendre par « sa » et « elle », avec la terre comme référent implicite.
  alternative: Expliciter « la surface de la terre… ils retournent à la terre » ou neutraliser la référence.
  rationale: Le grec ne répète pas le nom dans ce verset, mais le contexte de la création indique vraisemblablement la terre. Le féminin français préserve cette anaphore sans ajouter le nom au texte.
- issue: Sens de εἰς devant le retour des êtres vivants
  choice: « vers elle »
  alternative: « en elle »
  rationale: La préposition admet les deux nuances. Le texte principal conserve l’idée générale de direction, tandis que la note signale la possibilité d’un mouvement vers l’intérieur.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme reste concis, et le féminin maintient discrètement la référence grecque à la terre sans l’expliciter dans le corps du verset.
