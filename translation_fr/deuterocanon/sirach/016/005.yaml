  text: My eye has seen many such things[a], and my ear has heard things as mighty as these.
translation:
  language: fr
  text: Mon œil a vu beaucoup de choses de ce genre, et mon oreille a entendu des choses puissantes de ce genre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « des choses plus puissantes que celles-ci ». L’hébreu conservé dit littéralement « des choses puissantes comme celles-ci » et peut aussi être compris comme « de telles choses puissantes ».'
    reason: Le grec exprime explicitement un comparatif (« plus puissantes »), tandis que l’hébreu emploie une expression de ressemblance. La note préserve cette variation textuelle sans privilégier indûment l’une des deux formulations.
lexical_decisions:
- source_word: רַבּוֹת כָּאֵלֶּה
  choice: beaucoup de choses semblables
  rationale: L’adjectif féminin pluriel רַבּוֹת est employé substantivement avec l’expression comparative כָּאֵלֶּה. Cette formulation naturelle conserve à la fois l’idée de nombre et celle de ressemblance.
- source_word: רַאֲתָה עֵינִי
  choice: mon œil a vu
  rationale: Le singulier hébreu est conservé afin de respecter l’image concrète et le parallélisme poétique avec « mon oreille ».
- source_word: וְעַצֻּמוֹת כָּאֵלֶּה
  choice: d’aussi puissantes
  rationale: עַצֻּמוֹת évoque la force ou la puissance, tandis que כָּאֵלֶּה signifie littéralement « comme celles-ci ». « D’aussi puissantes » suit donc directement l’hébreu, sans effacer le témoignage comparatif du grec, signalé en note.
- source_word: שָׂמְעָה אָזְנִי
  choice: mon oreille en a entendu
  rationale: Le singulier concret et l’ordre poétique de l’hébreu sont maintenus. Le pronom « en » reprend naturellement « des choses » en français.
