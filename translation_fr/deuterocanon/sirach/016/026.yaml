  text: When God created his works from the beginning[a], he assigned their dominion over their living things.
translation:
  language: fr
  text: Quand Dieu créa ses œuvres dès le commencement, il leur attribua leurs parts.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La seconde proposition du texte hébreu est difficile. Le grec porte : « et, dès qu’il les fit, il distingua leurs parts ». La traduction « il leur attribua leurs parts » suit le sens d’une répartition ordonnée éclairé par ce parallèle, sans prétendre résoudre tous les détails de l’hébreu.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּבְרֹא
  choice: Quand […] créa
  rationale: 'La préposition כְּ avec l’infinitif construit est comprise ici dans un sens temporel : « quand il créa ». Cette lecture convient à la syntaxe et au cadre des origines.'
- source_word: אֵל
  choice: Dieu
  rationale: אֵל est ici le titre divin courant et n’exige pas de développement tel que « le Puissant ».
- source_word: מַעֲשָׂיו
  choice: ses œuvres
  rationale: Dans ce contexte de création, le terme désigne ce que Dieu a fait. « Ses œuvres » conserve le lien formel avec l’activité créatrice tout en restant naturel en français.
- source_word: מֵרֹאשׁ
  choice: dès le commencement
  rationale: L’expression situe l’action à l’origine de la création. « Dès le commencement » rend aussi la valeur initiale de מִן et concorde avec le parallèle grec ἀπ’ ἀρχῆς.
- source_word: עַל חַיֵּיהֶם
  choice: sur leurs êtres vivants
  rationale: Le texte hébreu transmis est difficile. Avec la proposition qui suit, cette expression peut évoquer les êtres vivants relevant des différents ordres créés. La traduction garde la relation exprimée par עַל sans prétendre lever toute l’incertitude.
- source_word: חָלָק
  choice: il répartit
  rationale: Le verbe exprime l’action de diviser ou d’attribuer des parts. « Répartit » convient au contexte d’un ordre établi dans la création et reste proche du sens lexical.
- source_word: מִשְׁטָרָם
  choice: leur autorité
  rationale: מִשְׁטָר peut désigner le gouvernement, la domination ou l’organisation réglée. « Autorité » exprime ici l’exercice d’un pouvoir attribué, sans introduire l’image moderne de territoires politiques.
theological_decisions:
- issue: L’ordre de la création dans une proposition hébraïque textuellement difficile
  choice: Présenter Dieu comme celui qui, à l’origine, répartit l’autorité au sein de la création.
  alternative: 'Suivre plus directement le grec : « Selon le jugement du Seigneur sont ses œuvres dès le commencement, et, dès qu’il les fit, il distingua leurs parts. »'
  rationale: L’hébreu demeure le texte de base, mais sa seconde proposition est incertaine. Le grec atteste clairement une idée de répartition ordonnée. La traduction française conserve les éléments hébreux relatifs à l’autorité et aux êtres vivants, tandis que la note signale la difficulté au lieu de la masquer.
translation_notes:
  register: Français international actuel, digne et accessible. Le passé simple convient au registre sapientiel écrit. « Dès le commencement » maintient la solennité du propos sans archaïsme, tandis que la note rend visible l’incertitude textuelle.
