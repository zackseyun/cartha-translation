revisions:
- from: Quand Dieu créa ses œuvres dès le commencement, il répartit leur autorité sur leurs êtres vivants.[a]
  to: Quand Dieu créa ses œuvres dès le commencement, il leur attribua leurs parts.[a]
  rationale: La révision conserve la temporalité de la création et le vocabulaire sobre du premier membre. Elle remplace une construction française opaque et une interprétation trop déterminée de la proposition hébraïque incertaine par « il leur attribua leurs parts », formulation naturelle qui correspond au sens d’attribution attesté avec netteté par le grec. La note rend compte de la difficulté de l’hébreu et de la fonction du parallèle grec.
  reviewer_model: gpt-5.6-terra
