  text: Even the peaks of the mountains and the foundations of the world—when he looks at them[a], they quake.
translation:
  language: fr
  text: Même les cimes des montagnes et les fondements du monde[a], quand il les regarde, tremblent violemment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « les fondements du monde » ; le parallèle grec lit « les fondements de la terre ».
    reason: Variante du témoin grec.
lexical_decisions:
- source_word: קִצְבֵי הָרִים
  choice: les cimes des montagnes
  rationale: קִצְבֵי désigne ici les extrémités ou les parties les plus reculées des montagnes. « Cimes » exprime naturellement en français cette image dans le contexte, sans adopter le simple « montagnes » du parallèle grec.
- source_word: וִיסוֹדֵי תֵבֵל
  choice: et les fondements du monde
  rationale: « Fondements » rend le sens cosmique de יִסוֹדֵי, tandis que « monde » suit תֵבֵל, qui désigne le monde ordonné ou habité. Le parallèle grec porte « terre ».
- source_word: בְּהַבִּיטוֹ אֲלֵיהֶם
  choice: quand il les regarde
  rationale: La tournure temporelle rend naturellement l’infinitif construit hébreu. Le pronom « il » conserve le sujet divin implicite sans ajouter le nom de Dieu.
- source_word: רַעַשׁ יִרְעָשׁוּ
  choice: tremblent violemment
  rationale: La construction associant le nom רַעַשׁ au verbe de même racine intensifie le tremblement. « Violemment » préserve cette insistance sans produire en français une répétition maladroite.
theological_decisions:
- issue: Sujet divin implicite de « quand il les regarde »
  choice: Conserver le pronom « il » sans nommer explicitement Dieu.
  alternative: « quand Dieu les regarde » ou « sous son regard »
  rationale: Le contexte identifie Dieu comme référent, mais le verset hébreu ne le nomme pas dans cette proposition. Le pronom préserve donc la forme et la tension du texte source.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste claire et directe ; « tremblent violemment » restitue l’intensification hébraïque sans lourdeur. Le marqueur [a] est placé immédiatement après l’expression concernée.
