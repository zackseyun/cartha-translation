  text: In the assembly of the wicked[a], fire burns; and among a godless nation, wrath is kindled.
translation:
  language: fr
  text: Dans l’assemblée des méchants, le feu brûle ; et au sein d’une nation impie[a], la colère s’est enflammée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « chez une nation désobéissante, la colère s’est enflammée ». L’hébreu dit : « nation impie ».'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲדַת רְשָׁעִים
  choice: Dans l’assemblée des méchants
  rationale: עֵדָה désigne une communauté réunie, et בְּ a ici un sens locatif. « Assemblée » est naturel et digne ; « méchants » rend le sens moral de רְשָׁעִים plus précisément que le grec parallèle « pécheurs ».
- source_word: יוֹקֶדֶת אֵשׁ
  choice: le feu brûle
  rationale: Le verbe יקד exprime l’action de brûler ou de flamber. La formulation concise conserve l’aspect actif et le parallélisme poétique.
- source_word: וּבְגוֹי חָנֵף
  choice: et chez une nation impie
  rationale: גּוֹי peut désigner une nation ou un peuple, tandis que חָנֵף évoque l’impiété ou la profanation. « Chez » exprime naturellement la valeur locative de בְּ sans suggérer que la colère est dirigée contre la nation.
- source_word: נִצְּתָה חֵמָה
  choice: la colère s’est enflammée
  rationale: Le parfait נִצְּתָה indique que la colère a été allumée ou s’est embrasée. Le passé composé respecte mieux cette forme que le présent de la couche anglaise, tout en conservant la métaphore du feu.
theological_decisions:
- issue: Rendre חָנֵף selon l’hébreu ou ἀπειθεῖ selon le grec
  choice: impie
  alternative: désobéissante
  rationale: L’hébreu conservé est le témoin principal et חָנֵף désigne ici une nation impie ou profane. Le grec transmet une nuance distincte, « désobéissante », qui mérite d’être signalée sans remplacer le texte hébreu.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme du vers hébreu et son imagerie du feu sont conservés. Le présent du premier membre et le passé du second reproduisent les formes verbales du texte hébreu.
