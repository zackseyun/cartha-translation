  yaml_path: translation/deuterocanon/sirach/016/015.yaml
  text: Yahweh hardened Pharaoh’s heart[a], though he did not know him, for his deeds are revealed under heaven.
translation:
  language: fr
  text: Le SEIGNEUR a endurci le cœur de Pharaon[a], lui qui ne le connaissait pas, car ses actes sont dévoilés sous le ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec porte : « Ne dis pas : “Je serai caché au Seigneur.” » Le témoin grec diffère ici considérablement de la ligne hébraïque conservée, ce qui peut indiquer une forme textuelle divergente ou un décalage dans la correspondance des versets.'
    reason: textual_variant
lexical_decisions:
- source_word: יְהֹוָה
  choice: le SEIGNEUR
  rationale: Rend le nom divin YHWH selon la convention biblique française qui emploie « le SEIGNEUR », tout en signalant typographiquement qu’il s’agit du nom propre divin.
- source_word: הִקְשָׁה
  choice: endurcit
  rationale: Le hifil de קשה signifie ici rendre dur ou obstiné. « Endurcit » conserve l’écho direct au récit de l’Exode et reste naturel en français biblique moderne.
- source_word: לֵב
  choice: le cœur
  rationale: Le « cœur » désigne en hébreu le centre intérieur de la pensée et de la volonté. Le maintien de l’image préserve l’idiome biblique et le lien avec l’Exode.
- source_word: פַּרְעֹה
  choice: Pharaon
  rationale: Forme française traditionnelle du titre royal, employé ici comme désignation personnelle.
- source_word: אֲשֶׁר לֹא יְדָעוֹ
  choice: lui qui ne le connaissait pas
  rationale: Cette formulation rattache naturellement la proposition à Pharaon sans imposer une valeur causale ou concessive au relatif אֲשֶׁר. Le pronom objet renvoie au SEIGNEUR.
- source_word: שֶׁמַעֲשָׂיו
  choice: car ses actes
  rationale: Le שׁ préfixé est compris comme introduisant une explication. « Ses actes » garde en français l’ambiguïté du possessif hébreu quant à son antécédent.
- source_word: מְגֻלִּין
  choice: sont dévoilés
  rationale: Le participe passif exprime que les actes sont mis au jour et ne restent pas cachés. « Dévoilés » convient au contexte de connaissance divine.
- source_word: תַּחַת הַשָּׁמַיִם
  choice: sous le ciel
  rationale: Expression française concise qui conserve l’image et le registre élevé de l’idiome hébreu.
theological_decisions:
- issue: Rapport entre le témoin hébreu et le parallèle grec
  choice: Suivre dans le texte principal la ligne hébraïque conservée.
  alternative: 'Traduire le grec : « Ne dis pas : “Je serai caché au Seigneur.” »'
  rationale: Le texte hébreu est ici disponible avec une confiance élevée et constitue la source principale. Le grec présente une ligne substantiellement différente, qui peut provenir d’une forme textuelle divergente ou d’un décalage dans la numérotation; cette différence doit donc être signalée sans remplacer le texte hébreu.
- issue: Valeur de אֲשֶׁר dans la proposition relative
  choice: Employer la tournure relative neutre « lui qui ».
  alternative: « bien qu’il ne le connût pas » ou « parce qu’il ne le connaissait pas »
  rationale: L’hébreu ne marque pas explicitement une relation concessive ou causale. La traduction évite de résoudre cette tension de manière indue.
- issue: Antécédent du possessif dans « ses actes »
  choice: Conserver l’ambiguïté du pronom possessif.
  alternative: Préciser « les actes de Pharaon » ou « les œuvres du SEIGNEUR »
  rationale: Le suffixe hébreu masculin singulier peut être compris selon plus d’un antécédent dans la phrase. Le français permet de préserver cette ambiguïté authentique.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve les images bibliques du cœur endurci et du ciel, ainsi que les ambiguïtés syntaxiques réelles de l’hébreu, sans ajouter d’interprétation confessionnelle.
