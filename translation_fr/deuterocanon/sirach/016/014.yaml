translation:
  language: fr
  text: Quiconque pratique la justice a une récompense.[a] Chacun trouvera selon ses œuvres.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Toute personne qui pratique la justice — il y a pour elle une récompense. » Le grec diffère : il parle d’« aumône » ou d’« acte de miséricorde » et emploie l’expression difficile « fera une place ».'
    reason: textual_variant
  - marker: b
    text: La phrase « Chacun trouvera selon ses œuvres » figure dans le grec, mais pas dans la ligne hébraïque conservée. Le complément de « trouvera » n’est pas exprimé dans le grec.
    reason: textual_variant
lexical_decisions:
- source_word: כָּל הָעֹשֶׁה
  choice: Quiconque pratique
  rationale: Le participe substantivé signifie littéralement « toute personne qui fait ». « Quiconque pratique » rend naturellement en français sa valeur distributive et habituelle, sans transformer la personne en acte abstrait.
- source_word: צְדָקָה
  choice: la justice
  rationale: Le témoin hébreu porte צְדָקָה, qui désigne ici une conduite juste ou conforme au bien. « Justice » reste proche de l’hébreu; le sens grec d’aumône ou d’acte de miséricorde est signalé en note.
- source_word: יֵשׁ לוֹ שָׂכָר
  choice: reçoit une récompense
  rationale: Littéralement, « il y a pour lui une récompense » ou « il a une récompense ». La formulation choisie est idiomatique en français et conserve l’idée de rétribution sans tonalité excessivement commerciale.
- source_word: ἕκαστος κατὰ τὰ ἔργα αὐτοῦ εὑρήσει
  choice: Chacun trouvera selon ses œuvres
  rationale: 'Cette proposition du parallèle grec, absente de la ligne hébraïque conservée, est rendue de façon formellement proche afin de préserver son ambiguïté: le complément de « trouvera » demeure implicite dans le grec.'
theological_decisions:
- issue: Sens de צְדָקָה par rapport au grec ἐλεημοσύνη
  choice: Employer « justice » dans le texte principal.
  alternative: « aumône », « acte de miséricorde » ou « charité »
  rationale: Le témoin hébreu, prioritaire et de haute confiance, exprime la justice ou la conduite juste. La lecture grecque peut refléter une interprétation ou une autre Vorlage; elle est conservée en note plutôt que fusionnée silencieusement avec l’hébreu.
- issue: Présence de la seconde proposition grecque absente de l’hébreu conservé
  choice: Inclure « Chacun trouvera selon ses œuvres » et documenter sa provenance.
  alternative: 'S’en tenir à la seule phrase hébraïque: « Quiconque pratique la justice reçoit une récompense. »'
  rationale: Le dossier qualifie l’écart de mineur et fournit le grec comme parallèle susceptible de conserver une forme plus complète. L’inclusion respecte cet élément du témoignage tout en rendant la divergence textuelle explicite.
translation_notes:
  register: Français international moderne, digne et accessible. « Pratiquer la justice » est plus naturel que « faire la justice » dans ce contexte moral. Le verbe grec « trouvera » est maintenu sans objet explicite pour ne pas résoudre une ambiguïté du texte.
