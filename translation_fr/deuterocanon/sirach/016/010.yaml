  text: So also six hundred thousand foot soldiers[b][a], gathered together in the arrogance of their heart.
translation:
  language: fr
  text: De même, les six cent mille fantassins[a], rassemblés dans la présomption de leur cœur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « six cent mille fantassins » font probablement allusion à la génération d’Israël au désert; comparer Exode 12.37 et Nombres 11.21.
    reason: cross_reference
  - marker: b
    text: Ou « dans l’arrogance de leur cœur » ou « dans l’insolence de leur cœur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: De même
  rationale: Introduit un exemple supplémentaire parallèle aux jugements évoqués auparavant, dans un français naturel et digne.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף
  choice: les six cent mille
  rationale: Rend directement le nombre hébreu en toutes lettres, selon l’usage littéraire français.
- source_word: רַגְלִי
  choice: hommes de troupe
  rationale: Le terme désigne des hommes à pied, sens confirmé par le grec πεζῶν. « Hommes de troupe » convient ici au groupe recensé sans suggérer indûment une unité militaire moderne précise.
- source_word: הַנֶּאֱסָפִים
  choice: rassemblés
  rationale: Reproduit sobrement le participe passif d’אסף et l’idée d’un groupe réuni.
- source_word: בִּזְדוֹן
  choice: dans la présomption
  rationale: זדון exprime une attitude orgueilleuse, insolente et téméraire. « Présomption » conserve cette nuance morale; d’autres rendus possibles sont signalés en note.
- source_word: לִבָּם
  choice: de leur cœur
  rationale: Préserve le singulier collectif de l’hébreu, idiomatique dans le registre biblique français.
theological_decisions:
- issue: Identification des six cent mille
  choice: Ne pas nommer Israël dans le texte principal; signaler seulement l’allusion probable en note.
  alternative: Identifier explicitement la génération d’Israël au désert.
  rationale: Le nombre évoque probablement les dénombrements liés à l’Exode, mais le verset hébreu ne nomme pas lui-même le groupe. La traduction conserve donc cette implicitation.
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde la structure elliptique du verset et son référent implicite. Les marqueurs de notes sont placés immédiatement après les éléments qu’ils éclairent.
