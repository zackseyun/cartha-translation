  text: Listen to me and receive understanding[b][a], and pay attention in your heart to my words.
translation:
  language: fr
  text: Écoutez-moi et accueillez mon discernement[a] ; appliquez votre cœur à mes paroles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Écoute-moi, mon enfant, et apprends la connaissance. » Le témoin hébreu ne comporte pas « mon enfant » et dit : « accueillez mon discernement ».'
    reason: alternative_reading
  - marker: b
    text: 'L’hébreu dit littéralement : « placez le cœur sur mes paroles » ; le grec a : « prête attention à mes paroles avec ton cœur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: Écoutez-moi
  rationale: L’impératif pluriel de שמע appelle une écoute attentive, et אֵלַי désigne directement celui vers qui cette écoute se tourne. Le pluriel de l’hébreu est conservé malgré le singulier du grec.
- source_word: וּקְחוּ שִׂכְלִי
  choice: accueillez mon discernement
  rationale: לקח signifie littéralement « prendre », mais, dans ce contexte d’enseignement, « accueillir » exprime naturellement la réception volontaire. שִׂכְלִי désigne le discernement ou l’intelligence du locuteur ; « mon discernement » conserve le suffixe possessif et la portée cognitive de l’hébreu.
- source_word: וְעַל דְבָרַי שִׂימוּ לֵב
  choice: appliquez votre cœur à mes paroles
  rationale: La formulation garde explicitement le « cœur » et reproduit au plus près l’image hébraïque « placer le cœur sur/à », tout en restant intelligible en français. « Mes paroles » rend directement דְבָרַי.
theological_decisions:
- issue: Désignation des destinataires
  choice: Aucune mention de « mon enfant » dans le texte principal
  alternative: « Écoute-moi, mon enfant… »
  rationale: Le témoin hébreu principal ne comporte aucune adresse filiale explicite, tandis que le grec ajoute τέκνον. Le texte principal suit donc l’hébreu, et la variante grecque est signalée en note.
- issue: Langage anthropologique du cœur
  choice: Conserver explicitement « cœur »
  alternative: « prêtez bien attention à mes paroles »
  rationale: L’hébreu et le grec mentionnent tous deux le cœur. Le conserver préserve la représentation biblique du cœur comme siège de l’attention et de la réflexion, sans la réduire à une simple intensification adverbiale.
- issue: Nombre de l’impératif
  choice: 'Employer le pluriel : « Écoutez… accueillez… appliquez… »'
  alternative: 'Employer le singulier d’après le grec : « Écoute… apprends… applique… »'
  rationale: Les formes impératives du texte hébreu sont plurielles. Le grec parallèle présente le singulier, vraisemblablement en lien avec son adresse τέκνον ; cette divergence est conservée dans la note de variante.
translation_notes:
  register: Français international actuel, sobre et digne. « Accueillez mon discernement » évite le caractère matériel de « prenez » et l’étrangeté de « recevez mon intelligence ». « Appliquez votre cœur » conserve l’image biblique sans employer une tournure archaïque.
