translation:
  language: fr
  text: Ceux qui manquent de discernement comprendront ces choses, et un homme crédule considérera ceci.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « ceci » dans le second membre, tandis que le parallèle grec porte « des choses insensées ». Le texte suit ici le témoin hébreu ; le grec présente une description plus développée de l’homme du second membre.
    reason: alternative_reading
lexical_decisions:
- source_word: חַסְרֵי לֵב
  choice: ceux qui manquent de discernement
  rationale: Littéralement « ceux qui manquent de cœur » ; dans l’idiome hébreu, le cœur est ici le siège de l’intelligence et du jugement. « Manquent de discernement » exprime naturellement cette déficience intellectuelle et morale.
- source_word: יָבִינוּ
  choice: comprendront
  rationale: Le verbe désigne le fait de comprendre ou de discerner. Le futur français conserve la forme verbale hébraïque sans tenter de résoudre la tension apparente de l’énoncé.
- source_word: אֵלֶּה
  choice: ces choses
  rationale: Le démonstratif hébreu est pluriel ; « ces choses » en rend explicitement le nombre.
- source_word: גֶבֶר
  choice: un homme
  rationale: Le nom désigne ici un individu masculin, conformément à la formulation sapientielle de l’hébreu.
- source_word: פּוֹתֶה
  choice: irréfléchi
  rationale: Le terme peut désigner quelqu’un de simple, naïf, crédule ou facile à égarer. « Irréfléchi » rend son manque de jugement sans le réduire à une innocence naïve ; le parallèle grec, « insensé et égaré », confirme cette nuance défavorable.
- source_word: יַחְשֹׁב
  choice: méditera
  rationale: Le verbe signifie penser, considérer ou réfléchir. « Méditera » convient au contexte sapientiel tout en restant distinct de « comprendra » dans le premier membre.
- source_word: זֹאת
  choice: ceci
  rationale: Le démonstratif est singulier. « Ceci » préserve le passage du pluriel « ces choses » au singulier, sans harmonisation.
theological_decisions:
- issue: Tension entre le manque de discernement et les verbes « comprendre » et « méditer »
  choice: Conserver l’affirmation telle quelle
  alternative: Reformuler comme une question, une négation ou une proposition conditionnelle
  rationale: L’hébreu transmis formule une affirmation dont la logique peut sembler surprenante. Aucune négation ni marque interrogative n’autorise à la résoudre silencieusement.
translation_notes:
  register: Français international moderne, sobre et digne. La structure en deux membres et le contraste entre « ces choses » et « ceci » sont conservés. Le marqueur de note est placé après la phrase entière, la note portant principalement sur le second membre.
