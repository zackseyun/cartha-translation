base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/016.yaml
  text: His mercies are seen by all his creatures[b][a], and he has apportioned his light and his praise to the sons of man.
translation:
  language: fr
  text: Ses compassions se montrent à toutes ses créatures[b], et il a partagé sa lumière et sa louange avec les êtres humains[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « aux fils des hommes », expression hébraïque désignant l’ensemble des êtres humains.
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec transmis diffère fortement ici : « Qui se souviendra de moi d’en haut ? » Le texte principal suit le témoin hébreu conservé.'
    reason: textual_variant
lexical_decisions:
- source_word: רַחֲמָיו
  choice: ses compassions
  rationale: Le pluriel hébreu exprime les manifestations répétées de la compassion divine; le pluriel français préserve cette nuance dans un registre digne.
- source_word: יֵרָאוּ
  choice: se montrent
  rationale: Cette lecture rattache la forme à ראה, «voir», et exprime naturellement en français que les compassions deviennent manifestes, sans retenir le sens possible de «craindre» que le contexte soutient moins bien.
- source_word: לְכָל בִּרְיוֹתָיו
  choice: à toutes ses créatures
  rationale: La préposition ל est conservée par «à»; «créatures» rend le sens d’êtres créés de בריותיו.
- source_word: וְאוֹרוֹ
  choice: sa lumière
  rationale: «Lumière» conserve l’image première de אור et laisse ouverte sa portée figurée.
- source_word: וְשִׁבְחוֹ
  choice: sa louange
  rationale: «Louange» reste proche de שבח et ne remplace pas sans nécessité cette notion par «gloire» ou «renommée».
- source_word: חָלַק
  choice: a accordé
  rationale: Le verbe חלק signifie partager ou attribuer une part. «A accordé» est naturel avec les objets abstraits «lumière» et «louange», tout en gardant l’idée d’une attribution.
- source_word: לִבְנֵי אָדָם
  choice: aux êtres humains
  rationale: בני אדם est une expression idiomatique désignant l’humanité. «Êtres humains» en transmet clairement la portée collective en français moderne; la forme littérale est signalée en note.
theological_decisions:
- issue: Portée anthropologique de בני אדם
  choice: aux êtres humains
  alternative: aux fils d’Adam / aux fils de l’homme
  rationale: L’expression hébraïque, bien que masculine dans sa forme, désigne idiomatiquement l’ensemble des humains. La traduction principale communique ce sens sans exclure les femmes, tandis que la note conserve la forme source.
- issue: Rapport entre la lumière et la louange divines et l’humanité
  choice: il a accordé sa lumière et sa louange aux êtres humains
  alternative: il a partagé sa lumière et sa gloire entre les humains
  rationale: Le texte affirme une attribution sans préciser s’il s’agit de révélation, d’honneur ou de la capacité de louer. La formulation retenue préserve cette ouverture théologique.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve le parallélisme du vers hébreu; les images de la lumière et de la louange restent volontairement ouvertes.
