  source_fidelity: 'Le témoin hébreu dit que ses compassions «se montrent / sont vues» à toutes ses créatures, puis qu’il a réparti ou partagé sa lumière et sa louange aux בני אדם. La première proposition est fidèle. «A accordé» rend l’idée d’attribution, mais atténue l’idée distributive de חָלַק. La note a emploie improprement «Adam» comme nom propre : בני אדם est ici l’idiome «fils des hommes / êtres humains», non une référence explicite à Adam comme individu. Le grec parallèle est effectivement très divergent et doit rester signalé sans être harmonisé avec l’hébreu.'
