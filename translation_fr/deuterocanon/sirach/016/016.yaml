  terminology: «Compassions», «lumière» et «louange» conservent les images et le pluriel/source hébraïques sans interprétation doctrinale. «Êtres humains» rend correctement la portée collective de בני אדם; la note doit donner une littéralité idiomatique exacte, «fils des hommes».
