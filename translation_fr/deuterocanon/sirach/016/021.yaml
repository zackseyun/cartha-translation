  text: If I have sinned, no eye sees me; or if I lie, who knows it in every hiding place?
translation:
  language: fr
  text: « Si j’ai péché, aucun œil ne me voit ; ou si je mens, qui le sait dans toute cachette[b] ? »[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec parallèle diffère fortement ici et dit notamment que la plupart de ses œuvres sont dans des lieux cachés. Le texte principal suit l’hébreu, qui est conservé pour ce verset.
    reason: textual_variant
  - marker: b
    text: 'Ou : « dans tout lieu secret ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם חָטָאתִי
  choice: Si j’ai péché
  rationale: La particule conditionnelle אִם et l’accompli חָטָאתִי forment naturellement une hypothèse générale. Le passé composé est idiomatique en français et conserve l’aspect d’un acte accompli.
- source_word: לֹא תִרְאֵנִי עָיִן
  choice: aucun œil ne me voit
  rationale: Cette formulation préserve l’image concrète de l’œil, sujet du verbe en hébreu, sans la réduire à « personne ne me voit ».
- source_word: אוֹ אִם אֲכַזֵב
  choice: et si je mens
  rationale: כזב exprime ici l’idée de mentir ou de tromper. « Mentir » est clair et naturel. Dans la coordination française, « et » rend plus naturellement l’enchaînement de deux raisonnements parallèles, bien que אוֹ signifie formellement « ou ».
- source_word: בְּכָל סֵתֶר
  choice: dans tout lieu secret
  rationale: סֵתֶר peut désigner un lieu caché ou secret. Cette traduction conserve la valeur spatiale tout en restant naturelle et digne en français.
- source_word: מִי יוֹדֵעַ
  choice: qui le saura
  rationale: L’hébreu demande littéralement « qui sait ? ». Le pronom « le » explicite discrètement l’objet sous-entendu, et le futur exprime naturellement la prétention du pécheur que son acte restera inconnu.
- source_word: καὶ καταιγίς, ἣν οὐκ ὄψεται ἄνθρωπος, τὰ δὲ πλεῖονα τῶν ἔργων αὐτοῦ ἐν ἀποκρύφοις
  choice: témoin parallèle signalé en note, non intégré au texte principal
  rationale: Le grec diverge nettement de l’hébreu, mais confirme le champ de la réalité cachée. Puisque le texte hébreu est conservé avec une forte assurance, il sert de base.
theological_decisions:
- issue: Priorité des témoins dans un verset où l’hébreu et le grec divergent fortement
  choice: Traduire le témoin hébreu conservé et signaler la divergence grecque en note
  alternative: Suivre le grec, qui évoque notamment de nombreuses œuvres cachées, ou fusionner les deux traditions
  rationale: Le témoin hébreu est disponible et hautement assuré pour ce verset. Une harmonisation effacerait une véritable variante textuelle et introduirait dans le corps du texte des éléments absents de l’hébreu.
- issue: Voix du locuteur et portée rhétorique
  choice: Conserver à la première personne le raisonnement de celui qui croit son péché invisible
  alternative: Reformuler comme une affirmation directe du narrateur
  rationale: La première personne appartient au texte hébreu et maintient la tension rhétorique sans expliciter prématurément le jugement que le contexte porte sur ce raisonnement.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le parallélisme et l’image concrète de l’œil. « Lieu secret » traduit la valeur spatiale de סֵתֶר sans lourdeur ; la variante plus concrète « cachette » est donnée en note.
