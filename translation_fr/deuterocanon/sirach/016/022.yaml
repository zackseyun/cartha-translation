  source_fidelity: Le texte principal suit de manière justifiée le grec, plus cohérent que l’hébreu transmis dans ce verset. « Qui annoncera les œuvres de justice » rend bien ἔργα δικαιοσύνης τίς ἀναγγελεῖ, et « qui attendra ? » maintient l’ambiguïté grecque de ὑπομενεῖ entre attente et endurance. « Encore » n’est toutefois pas exprimé par μακράν et ajoute une nuance temporelle absente.
  naturalness: Le français est naturel, sobre et adapté au registre sapientiel. « Qui attendra ? » est un peu plus direct et plus fidèle que « qui saura attendre ? », qui peut suggérer l’aptitude plutôt que l’action future.
