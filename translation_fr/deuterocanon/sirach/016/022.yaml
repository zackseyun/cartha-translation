translation:
  language: fr
  text: Qui annoncera les œuvres de justice[a], et qui attendra ? Car l’alliance est lointaine[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est difficile ; on pourrait le comprendre approximativement ainsi : « Qu’est-ce qu’une œuvre de justice ? Qui l’annoncera ? » Le grec porte : « Qui annoncera les œuvres de justice ? »'
    reason: textual_variant
  - marker: b
    text: 'Le grec porte : « l’alliance est lointaine ». L’hébreu semble plutôt parler d’« espoir » et d’une « prescription » ou d’un « décret », mais sa formulation exacte est incertaine.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָה מַעֲשֶׂה צֶדֶק / ἔργα δικαιοσύνης
  choice: les œuvres de justice
  rationale: Le grec porte clairement le pluriel « œuvres de justice »; l’hébreu, difficile, évoque également une œuvre ou action juste. « Justice » rend naturellement צֶדֶק et δικαιοσύνη dans ce contexte sans imposer une lecture confessionnelle.
- source_word: מִי יַגִּידֶנּוּ / τίς ἀναγγελεῖ
  choice: Qui annoncera
  rationale: Le verbe hébreu comme le grec peut signifier raconter, faire connaître ou annoncer. « Annoncera » conserve la portée publique du propos et le registre sapientiel.
- source_word: וְתִקְוַת מָּה / ἢ τίς ὑπομενεῖ
  choice: et qui saura attendre ?
  rationale: L’hébreu contient l’idée d’espérance ou d’attente, mais sa syntaxe est incertaine; le grec demande qui tiendra bon ou attendra. Cette formulation française préserve leur zone de recoupement sans préciser un complément absent ou incertain.
- source_word: חוֹק / ἡ διαθήκη
  choice: l’alliance
  rationale: Le texte principal suit ici la leçon grecque, qui forme une phrase cohérente avec l’attente évoquée auparavant. La leçon hébraïque « prescription, décret » est signalée en note.
- source_word: μακρὰν
  choice: encore lointaine
  rationale: « Lointaine » rend directement μακράν. « Encore » exprime idiomatiquement en français la durée implicite qui motive l’attente, sans transformer la distance en date précise.
theological_decisions:
- issue: Choix entre l’hébreu transmis, obscur dans la seconde moitié, et le parallèle grec cohérent
  choice: Suivre dans le texte principal le fil du grec, tout en conservant les éléments sémantiques partagés avec l’hébreu et en documentant l’écart.
  alternative: 'Traduire l’hébreu de manière plus littérale : « Qu’est-ce qu’une œuvre de justice ? Qui nous le dira ? Et quel espoir… puisque le décret est fixé ? »'
  rationale: La forme hébraïque transmise est difficile et probablement perturbée, tandis que le grec offre un énoncé complet. Mettre la leçon grecque dans le texte et la leçon hébraïque en note évite de produire artificiellement une certitude à partir d’un hébreu obscur, tout en rendant visible la tension textuelle.
translation_notes:
  register: Français international actuel, digne et accessible. Les deux questions conservent le parallélisme sapientiel. « Qui saura attendre ? » reste volontairement ouvert entre attente patiente et persévérance.
