  text: Even if they become many[a], do not delight in them, if the fear of Yahweh is not with them.
translation:
  language: fr
  text: Même s’ils deviennent nombreux, ne te réjouis pas d’eux si la crainte du SEIGNEUR n’est pas avec eux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם אִם / ἐὰν
  choice: Même si
  rationale: Rend naturellement la valeur concessive de la condition dans ce contexte.
- source_word: פָּרוּ / πληθύνωσιν
  choice: ils deviennent nombreux
  rationale: Le verbe hébreu évoque le fait de porter du fruit ou de se multiplier, et le grec confirme ici l’idée d’un accroissement numérique. Cette formulation conserve ce sens sans l’expliciter davantage.
- source_word: אַל תָּבֻעַ בָּם / μὴ εὐφραίνου ἐπʼ αὐτοῖς
  choice: ne te réjouis pas à leur sujet
  rationale: La formulation hébraïque est peu transparente, mais le parallèle grec indique clairement l’idée de se réjouir à leur sujet. La traduction reste naturelle tout en signalant l’incertitude dans une note.
- source_word: אִם אֵין אִתָּם / εἰ μὴ ἔστιν ... μετʼ αὐτῶν
  choice: si ... n’est pas avec eux
  rationale: Préserve l’image de présence ou d’accompagnement exprimée tant par l’hébreu que par le grec, plutôt que de la réduire à une simple possession.
- source_word: יִרְאַת יְהֹוָה / φόβος Κυρίου
  choice: la crainte du SEIGNEUR
  rationale: Conserve l’expression caractéristique de la littérature de sagesse et sa portée théologique, sans l’atténuer en simple respect.
- source_word: יְהֹוָה
  choice: le SEIGNEUR
  rationale: Rend le tétragramme selon la convention biblique française retenue pour le nom divin.
theological_decisions:
- issue: Rendu de la formule sapientielle יִרְאַת יְהֹוָה
  choice: la crainte du SEIGNEUR
  alternative: le respect du SEIGNEUR
  rationale: « Crainte » maintient la formulation biblique traditionnelle ainsi que la tension entre révérence, obéissance et conscience de la majesté divine; « respect » en réduirait la portée.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier correspond à l’exhortation sapientielle adressée au lecteur. La structure conditionnelle et l’expression « la crainte du SEIGNEUR » sont conservées au plus près des sources.
