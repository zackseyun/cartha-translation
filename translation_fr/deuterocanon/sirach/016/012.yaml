base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/012.yaml
  text: As great as his mercies are[a], so also is his reproof[c][b]; he will judge a man according to his deeds.
translation:
  language: fr
  text: Ses compassions sont grandes[a], et sa réprimande[b] l’est tout autant ; il jugera chacun[c] selon ses actes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte le pluriel « ses compassions » ; le grec a le singulier « sa compassion » ou « sa miséricorde ».
    reason: lexical_alternative
  - marker: b
    text: Ou « sa correction » ou « sa remontrance ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement « un homme » ; le masculin singulier hébreu a ici une portée représentative : chaque personne.'
    reason: cultural_note
lexical_decisions:
- source_word: כְּרָב ... כֵּן
  choice: sont grandes ... l’est tout autant
  rationale: 'Cette formulation française naturelle conserve la relation proportionnelle « comme… ainsi… » : la grandeur de la réprimande répond à celle des compassions.'
- source_word: רַחֲמָיו
  choice: ses compassions
  rationale: Le pluriel respecte le texte hébreu et peut évoquer aussi bien une compassion abondante que ses manifestations répétées. Le grec parallèle emploie le singulier.
- source_word: תּוֹכַחְתּוֹ
  choice: sa réprimande
  rationale: Le terme désigne une remontrance à visée corrective. « Réprimande » évite de réduire le mot à un châtiment purement punitif, conformément aussi au grec ἔλεγχος.
- source_word: אִישׁ
  choice: chacun
  rationale: Le masculin singulier hébreu a ici une portée représentative. « Chacun » rend naturellement en français cette portée distributive et universelle sans limiter le jugement aux hommes de sexe masculin.
- source_word: כְּמִפְעָלָיו
  choice: selon ses actes
  rationale: מִפְעָל désigne ce qui est accompli, une œuvre ou un acte. « Actes » est courant, moralement pertinent et correspond au grec ἔργα.
- source_word: יִשְׁפֹּט
  choice: il jugera
  rationale: Le futur convient à l’imparfait hébreu dans cet énoncé solennel et est confirmé par le futur grec κρινεῖ.
theological_decisions:
- issue: Rapport entre la compassion divine, la réprimande et le jugement
  choice: Le verset met en parallèle la grandeur des compassions de Dieu et celle de sa réprimande, puis affirme qu’il juge chacun selon ses actes.
  alternative: Comprendre תּוֹכַחְתּוֹ dans un sens plus punitif et traduire par « son châtiment ».
  rationale: L’hébreu תּוֹכַחַת et le grec ἔλεγχος favorisent l’idée de réprimande ou de correction plutôt que celle d’une peine purement rétributive. La traduction maintient ainsi la tension du texte entre compassion abondante et responsabilité morale.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « l’est tout autant » restitue sans lourdeur le parallélisme proportionnel hébreu. « Chacun » exprime naturellement la portée générique de אִישׁ, tandis que la note conserve la forme littérale.
