base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/017.yaml
  text: Do not say[a], “I am hidden from God, and from on high who will remember me? In a great people I will not be known; and what is my life among the ends of the winds, all the sons of man?”
translation:
  language: fr
  text: 'Ne dis pas : « Je suis caché de Dieu ; d’en haut, qui se souviendra de moi ? Parmi un peuple nombreux, je ne serai pas connu. Et que vaut ma vie parmi tous les fils d’Adam, comme les confins des vents[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « dans l’immensité de la création » au lieu de « comme les confins des vents » ; il reflète peut-être un texte hébreu différent ou une interprétation d’une expression hébraïque difficile.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Ne dis pas
  rationale: Rend directement l’interdiction hébraïque, dans un français simple et actuel.
- source_word: מֵאֵל נִסְתַּרְתִּי
  choice: Je suis caché à Dieu
  rationale: Conserve l’idée erronée du locuteur selon laquelle il échapperait au regard de Dieu, sans transformer le passif en action volontaire.
- source_word: וּבַמָּרוֹם
  choice: là-haut
  rationale: Évoque naturellement le domaine céleste élevé sans expliciter davantage que l’hébreu.
- source_word: יִזְכְּרֵנִי
  choice: se souviendra de moi
  rationale: Préserve le sens premier de la racine זכר, également confirmé par le grec.
- source_word: בְּעַם כָּבֵד
  choice: Au milieu d’un peuple immense
  rationale: כָּבֵד exprime ici vraisemblablement l’importance quantitative ou la masse ; « immense » garde cette notion de poids collectif tout en étant naturel en français.
- source_word: לֹא אִוָּדֵעַ
  choice: je ne serai pas connu
  rationale: Rend le nifal de ידע sans réduire explicitement le sens à « remarqué ».
- source_word: וּמַה נַפְשִׁי
  choice: Que représente ma vie
  rationale: נפש peut désigner la vie, la personne ou l’âme ; dans cette question d’insignifiance, « ma vie » est naturel et conserve la portée existentielle.
- source_word: כְּקַצּוֹת רוּחוֹת
  choice: aux confins des vents
  rationale: La formule hébraïque est difficile. Cette traduction en conserve l’image cosmique concrète et l’idée d’extrémités sans adopter silencieusement le lissage grec.
- source_word: כּלָ בּנֵי אָדָם
  choice: tous les fils d’Adam
  rationale: Conserve l’expression collective hébraïque et son lien lexical avec Adam, tout en désignant l’ensemble de l’humanité.
theological_decisions:
- issue: Image finale de l’hébreu face à la lecture grecque
  choice: Maintenir « aux confins des vents » dans le texte principal
  alternative: « dans l’immensité de la création »
  rationale: L’hébreu conservé est le témoin principal et présente une image cosmique difficile. Le grec peut refléter un autre texte source ou une interprétation destinée à clarifier cette image ; la variante est donc signalée sans effacer la tension.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation organise les questions rhétoriques sans supprimer l’étrangeté de l’image hébraïque finale.
