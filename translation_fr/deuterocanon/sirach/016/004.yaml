  text: From one God-fearing childless man a city will be inhabited, but from a family of traitors it will be laid waste.
translation:
  language: fr
  text: D’un seul homme sans enfant qui craint le Seigneur, une ville sera peuplée[a] ; mais à cause d’une famille de traîtres, elle sera dévastée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « D’un seul homme avisé, une ville sera peuplée. » L’hébreu porte : « D’un seul homme sans enfant qui craint le Seigneur. »'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאֶחַד
  choice: D’un seul homme
  rationale: La préposition מִן avec אֶחָד indique ici l’origine ou le point de départ. « D’un seul homme » est naturel en français et souligne le contraste avec toute une famille.
- source_word: עֲרִירִי
  choice: sans enfant
  rationale: עֲרִירִי désigne normalement une personne privée d’enfants ou de descendance. La formulation « homme sans enfant » conserve le sens concret du témoin hébreu.
- source_word: יְרֵא יְהֹוָה
  choice: qui craint le Seigneur
  rationale: Cette relative française rend explicitement la crainte révérencielle envers YHWH et évite l’ambiguïté possible de « craignant Dieu ».
- source_word: יְהֹוָה
  choice: le Seigneur
  rationale: Le tétragramme est rendu selon la convention française courante par « le Seigneur », sans substituer une religiosité générique au nom divin présent dans l’hébreu.
- source_word: תֵּשֵׁב עִיר
  choice: une ville sera peuplée
  rationale: Le verbe ישב exprime ici le fait qu’une ville devient habitée ou peuplée. « Sera peuplée » garde la valeur passive et résultative tout en étant idiomatique.
- source_word: מִמִּשְׁפַּחַת
  choice: à cause d’une famille
  rationale: Dans le second membre, מִן peut naturellement exprimer la cause ou l’origine du désastre. « À cause de » rend clairement le rôle funeste de cette famille et évite de suggérer que la ville serait physiquement issue d’elle.
- source_word: בֹּגְדִים
  choice: traîtres
  rationale: Le terme désigne ceux qui agissent avec perfidie ou trahissent la confiance. « Traîtres » en conserve la force morale et le caractère actif.
- source_word: תֶּחֱרָב
  choice: elle sera dévastée
  rationale: Le verbe חרב signifie devenir ruiné, désert ou dévasté. « Sera dévastée » restitue la gravité et la valeur passive du terme, avec pour sujet naturel « une ville ».
theological_decisions:
- issue: Choix entre l’hébreu עֲרִירִי (« sans enfant ») et le grec συνετοῦ (« sage, avisé »)
  choice: 'Le texte principal suit l’hébreu : « homme sans enfant qui craint le Seigneur ».'
  alternative: 'Le grec porte : « un seul homme avisé ».'
  rationale: Le témoin hébreu conservé, de haute confiance, gouverne le texte principal. La leçon grecque diffère substantiellement et mérite donc d’être signalée sans effacer la lecture hébraïque.
- issue: Expression du nom divin dans יְרֵא יְהֹוָה
  choice: « qui craint le Seigneur »
  alternative: « qui craint YHWH » ou « craignant Dieu »
  rationale: « Le Seigneur » représente explicitement le nom divin selon l’usage biblique français, tandis que « Dieu » rendrait l’expression plus générique qu’en hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme antithétique est conservé, ainsi que le singulier « une ville » repris par « elle ». La ponctuation met en relief les deux membres du verset.
