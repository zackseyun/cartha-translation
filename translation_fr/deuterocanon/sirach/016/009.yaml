  text: And he did not spare a people devoted to destruction[a], those trampled down in their iniquity.
translation:
  language: fr
  text: Il n’a pas épargné un peuple voué à la destruction[a], des hommes piétinés dans leur iniquité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec lit : « une nation vouée à la destruction, ceux qui ont été retranchés dans leurs péchés ». L’hébreu semble employer l’image de personnes piétinées ou écrasées ; le grec exprime un jugement proche avec des mots différents.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא חָמַל
  choice: Il n’a pas épargné
  rationale: חמל peut exprimer la pitié ou le fait d’épargner. Dans ce contexte de jugement, « n’a pas épargné » est naturel et conserve la force de l’hébreu.
- source_word: גוֹי
  choice: un peuple
  rationale: גוי peut désigner un peuple ou une nation. « Un peuple » évite une connotation moderne d’État-nation et convient aussi au grec ἔθνος.
- source_word: חֶרֶם
  choice: voué à la destruction
  rationale: חרם désigne ce qui est mis à part sous interdit, notamment en vue de sa destruction. Cette formulation préserve sa portée religieuse et judiciaire sans employer le terme moins transparent « anathème ».
- source_word: הַנּדוֹשִׁים
  choice: ceux qui ont été foulés aux pieds
  rationale: La forme hébraïque difficile semble évoquer l’action de fouler ou de piétiner. La traduction garde cette image de jugement, tandis que la variante grecque est signalée en note.
- source_word: בַּעֲוֹנָם
  choice: dans leur faute
  rationale: עון peut désigner la faute, l’iniquité ou la culpabilité. « Dans leur faute » suit la préposition ב et conserve l’ambiguïté entre leur état coupable et le jugement lié à celui-ci.
theological_decisions:
- issue: Rendu de חרם dans un contexte de jugement
  choice: voué à la destruction
  alternative: frappé d’interdit; condamné à la destruction
  rationale: « Voué à la destruction » maintient la gravité ainsi que la dimension religieuse et judiciaire du terme sans introduire une formulation confessionnelle.
- issue: Interprétation de l’hébreu difficile הַנּדוֹשִׁים à la lumière du grec
  choice: ceux qui ont été foulés aux pieds dans leur faute
  alternative: ceux qui ont été retranchés dans leurs péchés
  rationale: Le texte principal donne priorité à l’image portée par l’hébreu. Le grec présente une formulation apparentée mais différente; elle est donc conservée en note plutôt qu’intégrée silencieusement au texte.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste proche de l’hébreu tout en étant intelligible; la note préserve l’écart réel entre le témoin hébreu et le parallèle grec.
