  text: I will declare my spirit with measure[c][b][a], and with care I will make my knowledge known.
translation:
  language: fr
  text: J’exprimerai mon esprit[a] avec mesure[b], et je ferai connaître mon savoir avec discrétion[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « mon esprit »; le grec parallèle porte « l’instruction ».
    reason: alternative_reading
  - marker: b
    text: '« Avec mesure » signifie littéralement « avec poids » : l’image est celle de paroles soigneusement pesées.'
    reason: lexical_alternative
  - marker: c
    text: Le terme hébreu peut aussi se traduire par « avec modestie », « avec retenue » ou « avec prudence »; le grec parallèle met l’accent sur la précision.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבִּיעָה
  choice: J’exprimerai
  rationale: Le verbe évoque le fait de faire jaillir ou d’épancher des paroles. « J’exprimerai » rend naturellement l’idée de donner une forme verbale à ce qui est intérieur, tout en concordant avec le grec ἐκφανῶ, « je manifesterai ».
- source_word: בְמִשְׁקָל
  choice: avec mesure
  rationale: Le nom signifie littéralement « poids » ou « mesure ». Dans ce contexte, l’image désigne une parole pesée et maîtrisée; « avec mesure » conserve cette métaphore en français naturel.
- source_word: רוּחִי
  choice: mon esprit
  rationale: Traduction directe du témoin hébreu. Le grec parallèle porte « instruction », variante signalée en note plutôt qu’intégrée silencieusement au texte.
- source_word: וּבְהַצְנֵעַ
  choice: avec discrétion
  rationale: Le terme peut exprimer la modestie, la retenue ou la prudence. « Avec discrétion » garde cette gamme de sens; le grec parallèle souligne plutôt l’exactitude.
- source_word: אֲחַוֶּה
  choice: je ferai connaître
  rationale: Le verbe signifie montrer, exposer ou déclarer. Avec « mon savoir », « faire connaître » est idiomatique et fidèle.
- source_word: דֵעִי
  choice: mon savoir
  rationale: Le nom désigne la connaissance ou le discernement. « Mon savoir » est concis, naturel et correspond au grec ἐπιστήμην.
