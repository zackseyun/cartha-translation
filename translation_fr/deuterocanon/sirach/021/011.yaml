  text: Whoever keeps the law controls his understanding[b][a], and the fulfillment of the fear of the Lord is wisdom.
translation:
  language: fr
  text: Celui qui observe la Loi maîtrise sa pensée[a], et l’accomplissement de la crainte du Seigneur est la sagesse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « tient fermement à son intention », « maîtrise son intelligence » ou « préserve sa pensée ». L’expression grecque est concise : le verbe peut signifier maîtriser ou retenir fermement, et ἐννόημα peut désigner la pensée, l’intention ou l’intelligence.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ φυλάσσων
  choice: Celui qui observe
  rationale: Le participe présent substantivé a une portée générale et évoque une pratique continue. « Observe » convient naturellement à la Loi en français moderne.
- source_word: νόμον
  choice: la Loi
  rationale: Bien que le nom soit sans article en grec, le contexte sapientiel juif renvoie au corps d’instruction reconnu. La majuscule signale ici la Loi reçue par Israël.
- source_word: κατακρατεῖ
  choice: maîtrise
  rationale: Le verbe peut exprimer l’idée de saisir, de retenir fermement ou d’exercer une domination. Avec le génitif qui suit, « maîtrise » rend de façon concise l’idée de contrôle sans exclure entièrement celle de ferme possession.
- source_word: τοῦ ἐννοήματος αὐτοῦ
  choice: sa pensée
  rationale: ἐννόημα peut désigner la pensée, l’intention, le dessein ou la faculté de comprendre. « Sa pensée » conserve mieux cette amplitude que « son intelligence », qui privilégierait la faculté intellectuelle.
- source_word: συντέλεια
  choice: l’accomplissement
  rationale: Le terme désigne l’achèvement ou le fait de parvenir à sa pleine mesure. « Accomplissement » préserve cette idée sans lui donner nécessairement une portée eschatologique.
- source_word: τοῦ φόβου Κυρίου
  choice: de la crainte du Seigneur
  rationale: Formule sapientielle traditionnelle désignant la révérence religieuse orientée vers le Seigneur.
- source_word: σοφία
  choice: la sagesse
  rationale: Équivalent français direct et consacré du terme sapientiel grec.
theological_decisions:
- issue: Rapport entre l’observation de la Loi et l’intériorité dans κατακρατεῖ τοῦ ἐννοήματος αὐτοῦ
  choice: L’observance de la Loi permet à la personne de maîtriser sa pensée.
  alternative: Celui qui observe la Loi reste ferme dans son intention ou préserve son intelligence.
  rationale: 'La construction grecque est compacte : κατακρατεῖ peut évoquer la maîtrise ou la ferme possession, tandis que ἐννόημα peut désigner pensée, intention ou intelligence. Le texte principal retient une lecture cohérente avec le contexte sapientiel, tandis que la note maintient l’ambiguïté réelle.'
- issue: Relation entre la crainte du Seigneur et la sagesse
  choice: La sagesse est présentée comme l’accomplissement de la crainte du Seigneur.
  alternative: La sagesse mène la crainte du Seigneur à sa pleine mesure.
  rationale: La formulation nominale du grec établit une relation dense entre les deux notions sans préciser explicitement s’il s’agit d’un résultat, d’un sommet ou d’une pleine réalisation. La traduction conserve cette tension.
translation_notes:
  register: Français international moderne, sobre et sapientiel. La syntaxe reste proche du parallélisme grec tout en demeurant naturelle. « Loi » porte une majuscule en raison de sa référence au corps d’instruction reconnu dans le contexte juif.
