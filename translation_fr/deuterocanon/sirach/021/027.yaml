  text: When the ungodly curses the Adversary[a], he curses his own soul.
translation:
  language: fr
  text: Quand l’impie maudit l’Adversaire[a], il maudit sa propre âme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Satan ». Le grec porte satanas, transcription d’un terme qui signifie « adversaire ».
    reason: Lecture alternative préservant la possibilité de comprendre le terme comme un nom propre.
lexical_decisions:
- source_word: ἐν τῷ καταρᾶσθαι
  choice: Quand … maudit
  rationale: La construction ἐν + infinitif articulé exprime ici une circonstance temporelle. « Quand … maudit » la rend de façon naturelle en français.
- source_word: ἀσεβῆ
  choice: l’impie
  rationale: Dans cette construction, cet accusatif est le sujet de l’infinitif. « L’impie » conserve la valeur générique singulière et la portée morale et religieuse de ἀσεβής.
- source_word: τὸν σατανᾶ
  choice: l’Adversaire
  rationale: σατανᾶς transcrit un terme sémitique signifiant « adversaire » ou « accusateur ». « L’Adversaire », avec une majuscule, indique un référent personnel tout en laissant paraître le sens du terme grec.
- source_word: αὐτὸς
  choice: il
  rationale: αὐτός reprend le sujet avec une légère insistance. En français, le pronom « il » suffit ici et évite d’alourdir la maxime.
- source_word: καταρᾶται
  choice: maudit
  rationale: Le même verbe grec est employé dans les deux propositions ; le rendre deux fois par « maudit » préserve le parallélisme rhétorique.
- source_word: τὴν ἑαυτοῦ ψυχήν
  choice: sa propre âme
  rationale: ψυχή peut désigner la vie ou la personne elle-même, mais « âme » conserve ici la portée morale et spirituelle de la maxime ; « propre » rend explicitement ἑαυτοῦ.
theological_decisions:
- issue: Faut-il rendre σατανᾶ comme un titre ou nom commun, ou comme le nom propre Satan ?
  choice: l’Adversaire
  alternative: Satan
  rationale: Le mot grec conserve le sens lexical d’« adversaire » et, dans cette maxime de sagesse, il n’impose pas sans ambiguïté l’emploi d’un nom propre. La traduction principale préserve cette nuance, tandis que la note signale la lecture traditionnelle « Satan ».
translation_notes:
  register: Français international moderne, sobre et sentencieux. La répétition de « maudit » et l’expression « sa propre âme » maintiennent le parallélisme et la force morale du grec.
