base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/021/003.yaml
  text: Like one who grasps a woman’s private parts and urinates[b][a], so is one who suddenly enters his neighbor’s house.
translation:
  language: fr
  text: Celui qui se tient le sexe[a] en urinant, et celui qui entre soudainement dans la maison de son compagnon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu ammah peut aussi signifier « avant-bras » ou « coudée ». Dans ce contexte corporel, il est probablement employé comme euphémisme pour le membre sexuel masculin ; le texte ne mentionne pas une femme.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec présente une ligne entièrement différente : « Ses dents sont des dents de lion, qui font périr des êtres humains. » Il semble refléter une autre forme du texte.'
    reason: textual_variant
lexical_decisions:
- source_word: הָאוֹחֵז
  choice: celui qui saisit
  rationale: Le participe de אחז exprime l’action de prendre ou de tenir fermement; « saisit » conserve le caractère concret et saisissant du proverbe.
- source_word: בָּאַמָה
  choice: les parties intimes d’une femme
  rationale: Bien que le mot puisse notamment désigner l’avant-bras ou la coudée, ces sens conviennent mal ici. Le contexte corporel et volontairement choquant favorise un sens sexuel, rendu explicitement sans vulgarité.
- source_word: וּמַשְׁתִּין מָיִם
  choice: et urine
  rationale: L’expression signifie littéralement « urine de l’eau ». En français courant, « urine » restitue naturellement l’acte corporel sans ajouter le complément redondant.
- source_word: וְהַנִּכְנָס
  choice: ressemble à celui qui entre
  rationale: L’hébreu coordonne deux groupes participiaux sans marquer explicitement leur rapport. La tournure comparative rend intelligible la structure proverbiale proposée par le contexte, sans fusionner les deux actions.
- source_word: לְבֵית חֲבֵרוֹ
  choice: chez son prochain
  rationale: חבר désigne un compagnon, un proche ou un autre membre du cercle social. « Chez son prochain » est naturel en français et ne suppose pas nécessairement une amitié intime.
- source_word: פִּתְאוֹם
  choice: soudain
  rationale: L’adverbe indique une entrée brusque ou inattendue; « soudain » en conserve la concision.
- source_word: ὀδόντες λέοντος οἱ ὀδόντες αὐτῆς, ἀναιροῦντες ψυχὰς ἀνθρώπων
  choice: signalé seulement en note comme variante grecque
  rationale: Le grec présente une ligne entièrement différente. Puisque le texte hébreu est conservé avec une confiance élevée, il fonde le texte principal; la divergence grecque doit néanmoins être documentée.
theological_decisions:
- issue: Choix du texte de base devant une divergence majeure entre l’hébreu et le grec
  choice: Traduire dans le texte principal le proverbe hébreu conservé et signaler le grec en note.
  alternative: Adopter la ligne grecque sur les dents de lion, ou harmoniser les deux formes.
  rationale: La forme hébraïque est effectivement attestée et les deux traditions diffèrent quant au contenu, non simplement quant à la formulation. Une harmonisation masquerait la divergence textuelle.
- issue: Rapport syntaxique entre les deux propositions participiales
  choice: 'Rendre le rapport comme une comparaison proverbiale: « ressemble à ».'
  alternative: Les coordonner littéralement par « et », sans expliciter leur rapport.
  rationale: La simple coordination hébraïque demeure quelque peu ambiguë, mais le parallélisme présente vraisemblablement le premier geste comme image de l’intrusion soudaine. La formulation française explicite sobrement ce rapport tout en laissant la rudesse de l’image intacte.
translation_notes:
  register: Français international moderne, digne mais direct. L’image volontairement choquante de l’hébreu est conservée sans recours à un terme argotique. La comparaison est explicitée pour produire un proverbe intelligible en français; les appels de note suivent l’élément auquel chaque note se rapporte.
