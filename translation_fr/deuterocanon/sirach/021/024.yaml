revisions:
- from: C’est un manque d’éducation que d’écouter à une porte[a], mais l’homme avisé sera accablé par cette honte.
  to: Pour un homme, écouter à une porte[a] est un manque d’éducation, mais l’homme avisé sera accablé par le déshonneur.
  rationale: La révision restitue le référent humain exprimé par ἀνθρώπου et remplace « cette honte » par « le déshonneur », qui reflète plus précisément ἀτιμία sans ajouter de démonstratif ni réduire le terme à un ressenti intérieur. L’ambiguïté implicite de l’écoute indiscrète demeure dans la note.
