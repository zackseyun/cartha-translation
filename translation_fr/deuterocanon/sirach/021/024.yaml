  text: It is a man's lack of discipline to listen at a door[a], but a prudent man will be burdened by disgrace.
translation:
  language: fr
  text: Pour un homme, écouter à une porte[a] est un manque d’éducation, mais l’homme avisé sera accablé par le déshonneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « écouter à une porte » ; l’expression évoque le fait d’écouter indiscrètement une conversation sans le dire explicitement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαιδευσία
  choice: manque d’éducation
  rationale: Le nom désigne l’absence de formation et de savoir-vivre, manifestée ici par une conduite inconvenante. « Manque d’éducation » garde à la fois la dimension morale et sociale dans un français courant.
- source_word: ἀνθρώπου
  choice: construction impersonnelle (« C’est un manque d’éducation »)
  rationale: Le génitif indique que cette conduite révèle le défaut d’éducation d’un être humain. La tournure impersonnelle française exprime naturellement cette idée générale sans alourdir la phrase.
- source_word: ἀκροᾶσθαι παρὰ θύραν
  choice: écouter à une porte
  rationale: La formulation conserve l’image concrète du grec. Le contexte suggère qu’il s’agit d’écouter indiscrètement, sans rendre explicite dans le texte principal ce que l’original laisse implicite.
- source_word: φρόνιμος
  choice: l’homme avisé
  rationale: Le terme évoque le discernement pratique et la conduite sensée. « Avisé » rend cette nuance avec dignité et naturel.
- source_word: βαρυνθήσεται
  choice: sera accablé
  rationale: Le futur passif porte l’image d’un poids imposé. « Sera accablé » conserve cette métaphore tout en restant idiomatique.
- source_word: ἀτιμίᾳ
  choice: par cette honte
  rationale: Le datif peut indiquer la cause de l’accablement. « Honte » exprime ici le caractère déshonorant de la conduite, et « cette » rattache naturellement le second membre à l’acte qui vient d’être décrit.
