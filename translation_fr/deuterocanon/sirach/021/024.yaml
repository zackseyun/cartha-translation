review_pass:
  verdict: revise
  source_fidelity: Le premier membre rend correctement ἀπαιδευσία et l’infinitif ἀκροᾶσθαι παρὰ θύραν. Toutefois, la tournure impersonnelle efface le génitif ἀνθρώπου. Dans le second membre, « cette honte » ajoute un démonstratif absent du grec et « honte » peut suggérer un sentiment subjectif, alors que ἀτιμία désigne plus directement le déshonneur ou la disgrâce.
  naturalness: La formulation proposée est globalement fluide. « Pour un homme, écouter à une porte est un manque d’éducation » conserve le sens générique tout en restituant explicitement le référent humain du grec. « Le déshonneur » est naturel dans le registre proverbial.
  terminology: « Manque d’éducation » convient bien à ἀπαιδευσία dans son sens de défaut de formation et de savoir-vivre. « Homme avisé » rend φρόνιμος de manière juste. « Sera accablé » conserve l’image passive de βαρυνθήσεται. « Déshonneur » est préférable à « cette honte » pour ἀτιμίᾳ.
  issues:
  - severity: medium
    issue: Le génitif ἀνθρώπου n’est pas exprimé.
    rationale: La construction impersonnelle « C’est un manque d’éducation » généralise le proverbe, mais ne rend pas le complément « d’un homme » présent dans le grec.
  - severity: medium
    issue: « Cette honte » ajoute une référence démonstrative et affaiblit la nuance de ἀτιμία.
    rationale: Le grec n’a pas de démonstratif. ἀτιμία renvoie normalement au déshonneur, à la disgrâce ou à l’atteinte à l’honneur, plutôt qu’en premier lieu au sentiment de honte.
  revised_text: Pour un homme, écouter à une porte[a] est un manque d’éducation, mais l’homme avisé sera accablé par le déshonneur.
