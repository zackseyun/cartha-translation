  text: Instruction is like a golden ornament to a prudent man[a], and like a bracelet on his right arm.
translation:
  language: fr
  text: L’instruction est comme une parure d’or pour l’homme avisé[a], et comme un bracelet à son bras droit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « la discipline » ou « la formation » pour « l’instruction » : le grec παιδεία peut désigner aussi bien l’enseignement que la formation morale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: parure
  rationale: Dans ce contexte, le terme désigne un ornement plutôt que le « monde ». « Parure » convient à l’image d’un objet précieux porté sur soi et s’accorde naturellement avec le bracelet du second membre.
- source_word: χρυσοῦς
  choice: d’or
  rationale: L’adjectif indique que la parure est en or. « Parure d’or » est plus naturel en français moderne que « parure dorée », qui pourrait seulement évoquer une couleur ou un placage.
- source_word: φρονίμῳ
  choice: pour l’homme avisé
  rationale: Le datif désigne celui à qui l’instruction sied ou profite. « Avisé » exprime la sagesse pratique de φρόνιμος, tandis que « homme » conserve le masculin singulier du grec.
- source_word: παιδεία
  choice: instruction
  rationale: Le mot peut englober l’enseignement, la discipline et la formation morale. « Instruction » convient au proverbe sans réduire le sens à une correction punitive; une note conserve l’étendue du terme grec.
- source_word: χλιδών
  choice: bracelet
  rationale: Associé au bras droit, le terme désigne naturellement un bijou porté au bras. « Bracelet » est le mot moderne le plus clair, même si « brassard ornemental » serait aussi possible.
- source_word: βραχίονι δεξιῷ
  choice: à son bras droit
  rationale: Cette formulation rend clairement l’emplacement du bijou et explicite en français le lien possessif sous-entendu dans la comparaison grecque.
theological_decisions:
- issue: Rendu du masculin singulier φρονίμῳ
  choice: l’homme avisé
  alternative: la personne avisée
  rationale: Le grec emploie un masculin singulier représentant une figure individuelle dans une maxime sapientielle. Le rendu choisi conserve cette forme sans ajouter de restriction doctrinale à la portée générale du proverbe.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme comparatif est conservé, ainsi que l’image concrète de deux ornements précieux.
