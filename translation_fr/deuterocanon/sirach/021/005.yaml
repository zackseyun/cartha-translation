translation:
  language: fr
  text: La supplication du pauvre va de sa bouche jusqu’à ses oreilles[a], et son jugement[b] arrive sans tarder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de [la] bouche jusqu’à ses oreilles ». Le possessif renvoie très probablement à Dieu : la supplication du pauvre parvient à ses oreilles.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sa cause » ou « la justice qui lui est due ». Le grec peut désigner le jugement ou la décision rendue pour le pauvre.'
    reason: alternative_reading
lexical_decisions:
- source_word: δέησις
  choice: supplication
  rationale: Le nom désigne une demande instante. « Supplication » conserve cette intensité tout en restant naturel dans un registre biblique moderne.
- source_word: πτωχοῦ
  choice: du pauvre
  rationale: Le grec emploie un masculin singulier substantivé et désigne ici un individu pauvre. « Du pauvre » en reproduit sobrement la forme.
- source_word: ἐκ στόματος ἕως ὠτίων αὐτοῦ
  choice: de sa bouche jusqu’à ses oreilles
  rationale: Cette formulation suit de près l’image grecque et maintient l’ambiguïté grammaticale du possessif, dont le référent le plus vraisemblable est Dieu.
- source_word: κρίμα
  choice: le jugement en sa faveur
  rationale: κρίμα peut désigner une décision judiciaire. L’ajout « en sa faveur » exprime ici la décision rendue pour le pauvre, sans réduire entièrement la gamme du mot; une note signale les autres possibilités.
- source_word: κατὰ σπουδήν
  choice: sans tarder
  rationale: L’expression indique l’empressement ou la promptitude. « Sans tarder » est idiomatique, clair et digne en français contemporain.
- source_word: ἔρχεται
  choice: arrive
  rationale: Le présent grec est rendu directement et conserve l’impression d’imminence.
theological_decisions:
- issue: Référent de αὐτοῦ dans « jusqu’à ses oreilles »
  choice: Conserver le possessif ambigu dans le texte, tout en indiquant en note que les oreilles sont probablement celles de Dieu.
  alternative: Comprendre le possessif comme renvoyant au pauvre lui-même, ou expliciter directement « jusqu’aux oreilles de Dieu ».
  rationale: Dieu est vraisemblablement l’auditeur et le juge implicite, comme le suggère la seconde proposition. Toutefois, l’antécédent grammatical explicite le plus proche est « le pauvre »; le texte principal ne doit donc pas effacer cette tension.
- issue: Valeur de κρίμα
  choice: « le jugement en sa faveur »
  alternative: « son jugement », « sa cause » ou « la justice qui lui est due ».
  rationale: Le contexte suggère une décision divine rendue pour le pauvre. La formulation choisie rend cette orientation judiciaire, tandis que la note préserve l’étendue lexicale et l’ambiguïté possibles.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve l’image concise du grec. « Supplication » traduit l’urgence de la demande; « sans tarder » évite une tournure vieillie. Les deux appels de note figurent dans le texte principal.
