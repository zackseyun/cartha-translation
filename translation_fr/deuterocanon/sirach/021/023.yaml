  text: A fool peers into a house from the doorway[b][a], but an honorable man will stand outside and speak.
translation:
  language: fr
  text: L’insensé regarde dans une maison depuis le seuil, mais l’homme honorable[a] se tient dehors et parle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « et honneur à l’homme [qui] se tiendra dehors et parlera », expression condensée rendue ici par « l’homme honorable ». Le grec porte : « mais l’homme instruit se tiendra dehors ».'
    reason: alternative_reading
  - marker: b
    text: Le grec s’achève par « se tiendra dehors » et ne comporte pas « et parle », mots présents dans le témoin hébreu suivi ici.
    reason: textual_variant
lexical_decisions:
- source_word: אֱוִיל
  choice: l’insensé
  rationale: Terme courant de la littérature de sagesse pour une personne dépourvue de discernement moral et social, et non simplement d’intelligence.
- source_word: מִפֶּתַח יַבִּיט אֶל בָּיִת
  choice: depuis l’entrée, regarde à l’intérieur d’une maison
  rationale: Le syntagme décrit quelqu’un qui observe l’intérieur depuis le seuil. Cette formulation française conserve l’image et la nuance d’indiscrétion, également suggérée par le grec παρακύπτει.
- source_word: וְכָבוֹד לְאִישׁ
  choice: mais l’homme honorable
  rationale: L’hébreu, littéralement « et honneur à l’homme », est elliptique. Dans ce contraste de conduite sociale, il qualifie l’homme dont le comportement est honorable, sans réduire כָבוֹד à la seule bonne éducation.
- source_word: בַּחוּץ יַעֲמוֹד
  choice: se tient dehors
  rationale: Rendu direct et naturel de l’hébreu, confirmé par le grec ἔξω στήσεται. Le présent convient au caractère proverbial de la maxime en français.
- source_word: וִידַבֵּר
  choice: et parle
  rationale: Le verbe est explicitement présent dans le témoin hébreu et indique vraisemblablement que l’homme annonce sa présence ou s’adresse aux occupants sans entrer ni regarder indiscrètement.
