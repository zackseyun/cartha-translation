  text: In the mouth of fools is their heart[a], but the heart of the wise is their mouth.
translation:
  language: fr
  text: Dans la bouche des insensés se trouve leur cœur[a], mais le cœur des sages est leur bouche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, le grec dit : « Dans la bouche des insensés [se trouve] leur cœur, mais le cœur des sages [est] leur bouche. » La seconde formule est elliptique ; elle peut s’entendre au sens de : « la bouche des sages est dans leur cœur », c’est-à-dire que leur parole procède d’une réflexion intérieure.'
    reason: ambiguïté syntaxique et traduction littérale
lexical_decisions:
- source_word: ἐν στόματι
  choice: dans leur bouche
  rationale: 'Cette formulation conserve l’image concrète du grec : chez les insensés, ce qui est intérieur passe immédiatement dans la parole.'
- source_word: μωρῶν
  choice: des insensés
  rationale: « Insensés » garde le ton sapientiel et désigne ceux qui manquent de discernement, sans se limiter à une déficience intellectuelle.
- source_word: καρδία
  choice: cœur
  rationale: « Cœur » préserve le sens biblique de la vie intérieure, notamment la pensée, la volonté et les dispositions, plutôt qu’un sens seulement affectif.
- source_word: σοφῶν
  choice: des sages
  rationale: Cette expression rend naturellement le substantif grec pluriel et maintient la concision proverbiale.
- source_word: καρδία δὲ σοφῶν στόμα αὐτῶν
  choice: mais la bouche des sages est dans leur cœur
  rationale: 'Le grec transmis est elliptique et présente une antithèse inversée. Cette formulation française rétablit la relation suggérée par le parallélisme tout en conservant l’image : les sages soumettent leur parole à leur réflexion intérieure.'
