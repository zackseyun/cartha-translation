translation:
  language: fr
  text: Enfant, as-tu péché ? Ne recommence plus, et prie au sujet de tes péchés passés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La ligne hébraïque fournie pour ce passage ne correspond pas à Siracide 21.1 ; elle dit : « J’ai détesté trois choses, et quatre que je n’ai pas aimées. » La traduction suit donc ici le témoin grec.'
    reason: textual_variant
lexical_decisions:
- source_word: Τέκνον
  choice: Mon enfant
  rationale: Le vocatif désigne un enfant ou un disciple. « Mon enfant » est une adresse naturelle et digne en français sapientiel ; le possessif, idiomatique en français, n’impose pas de genre.
- source_word: ἥμαρτες
  choice: as-tu péché ?
  rationale: L’aoriste de ἁμαρτάνω est rendu par une question directe au passé composé, naturelle en français et fidèle au sens moral et religieux du verbe.
- source_word: μὴ προσθῇς μηκέτι
  choice: Ne recommence plus
  rationale: L’expression signifie littéralement « n’ajoute plus ». Dans ce contexte, elle interdit de répéter le péché ; « Ne recommence plus » en restitue clairement la force sans calque obscur.
- source_word: περὶ τῶν προτέρων σου
  choice: pour tes péchés passés
  rationale: Le grec dit littéralement « au sujet de tes choses antérieures ». Le contexte permet de rétablir l’ellipse « péchés » ; « pour » convient naturellement avec le verbe « prier ».
- source_word: δεήθητι
  choice: prie
  rationale: L’impératif de δέομαι exprime ici la supplication adressée à Dieu. « Prie » est actuel, accessible et adapté au contexte pénitentiel.
theological_decisions:
- issue: Choix du texte de base en raison d’un décalage entre le témoin hébreu fourni et la référence
  choice: Traduire le parallèle grec, qui correspond à Siracide 21.1, et signaler le décalage hébreu en note.
  alternative: 'Traduire la ligne hébraïque fournie : « J’ai détesté trois choses, et je n’en ai pas aimé quatre. »'
  rationale: La ligne hébraïque fournie ne correspond manifestement pas à Siracide 21.1, tandis que le témoin grec porte l’exhortation connue à cet endroit. Suivre le grec préserve donc l’identité du verset sans dissimuler l’état des témoins.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement convient à l’adresse sapientielle d’un maître à son disciple. La formulation conserve la question initiale, l’interdiction de récidiver et l’appel à prier au sujet des péchés antérieurs.
