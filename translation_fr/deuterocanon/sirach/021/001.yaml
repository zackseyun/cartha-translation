    rationale: '« Je n’en ai pas aimé quatre » est sémantiquement ambigu et peut signifier qu’aucun groupe de quatre choses n’a été aimé. Le parallélisme exige : « J’ai détesté trois choses, et quatre que je n’ai pas aimées. »'
  - severity: low
    issue: « pour tes péchés passés » restreint légèrement le sens de περὶ.
    rationale: Le grec demande de prier « au sujet de » ce qui est antérieur. Dans le contexte, « tes péchés passés » est une explicitation légitime, mais « au sujet de » reproduit mieux la relation non spécifiée par περὶ.
