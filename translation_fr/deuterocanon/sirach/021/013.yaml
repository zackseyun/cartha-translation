  text: The knowledge of a wise man will increase like a flood[b][a], and his counsel is like a spring of life.
translation:
  language: fr
  text: La connaissance d’un sage se multipliera comme un déluge, et son conseil est comme une source de vie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνῶσις
  choice: connaissance
  rationale: Le nom désigne directement la connaissance; ce choix reste simple et naturel dans le contexte sapiential.
- source_word: σοφοῦ
  choice: d’un sage
  rationale: Le génitif masculin singulier présente ici une figure individuelle représentative. «D’un sage» conserve le nombre et le genre grammaticaux sans alourdir la phrase.
- source_word: ὡς κατακλυσμός
  choice: comme un déluge
  rationale: κατακλυσμός évoque une masse d’eau débordante. «Déluge» préserve la force de l’image, mieux que le plus faible «afflux».
- source_word: πληθυνθήσεται
  choice: se multipliera
  rationale: Le futur exprime un accroissement ou une multiplication. La forme pronominale française rend naturellement ce développement abondant.
- source_word: βουλή
  choice: conseil
  rationale: Dans ce contexte de sagesse, βουλή désigne le conseil ou l’avis réfléchi du sage plutôt qu’un dessein abstrait.
- source_word: πηγὴ ζωῆς
  choice: source de vie
  rationale: πηγή désigne une source d’eau jaillissante. «Source de vie» conserve une métaphore vive et idiomatique en français moderne.
theological_decisions:
- issue: Genre et nombre de σοφοῦ
  choice: d’un sage
  alternative: de la personne sage; des sages
  rationale: Le grec est masculin singulier. La traduction conserve cette forme représentative sans la généraliser au pluriel ni la neutraliser.
- issue: Temps verbal dans les deux propositions
  choice: futur («se multipliera») puis présent («est» implicite)
  alternative: futur dans les deux propositions («sera»)
  rationale: Le premier membre contient un futur explicite, tandis que le second est une proposition nominale sans copule exprimée. Le présent français respecte le plus directement cette différence.
translation_notes:
  register: Français moderne, sobre et digne. La formulation conserve le parallélisme ainsi que les deux images fortes du déluge et de la source, sans explicitation interprétative.
