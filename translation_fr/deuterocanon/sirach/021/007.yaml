  text: A man mighty in tongue is known from afar[b][a], but one with understanding knows when he slips.
translation:
  language: fr
  text: L’homme puissant par la parole est connu de loin[a], mais l’homme avisé sait quand l’homme puissant trébuche[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se reconnaît à distance » ; le grec peut évoquer soit une parole qui le rend repérable, soit une réputation qui le précède.
    reason: lexical_alternative
  - marker: b
    text: Ou « quand il glisse ». L’image grecque peut désigner un faux pas réel ou, au sens figuré, une erreur.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸς μακρόθεν
  choice: est connu de loin
  rationale: 'Cette formulation conserve l’expression grecque concise et son ambiguïté : l’homme peut être repérable à distance par sa manière de parler, ou connu au loin par sa réputation.'
- source_word: ὁ δυνατὸς ἐν γλώσσῃ
  choice: l’homme puissant en paroles
  rationale: δυνατός exprime la puissance ou la force, tandis que ἐν γλώσσῃ renvoie ici à l’usage de la langue, donc à la parole. La traduction reste proche de l’image grecque tout en étant naturelle en français.
- source_word: ὁ δὲ νοήμων
  choice: mais l’homme intelligent
  rationale: νοήμων désigne une personne douée d’intelligence et de discernement. « Intelligent » maintient sobrement le contraste avec la puissance verbale.
- source_word: οἶδεν
  choice: sait
  rationale: Le verbe grec courant signifie « savoir » ou « connaître ». « Sait » préserve la concision du texte sans préciser indûment ce que l’homme intelligent perçoit.
- source_word: ἐν τῷ ὀλισθάνειν αὐτόν
  choice: quand il trébuche
  rationale: La construction avec ἐν et l’infinitif articulé a une valeur temporelle. ὀλισθάνειν évoque le fait de glisser ou de trébucher, au sens propre comme au sens figuré. Le pronom français conserve une certaine ambiguïté quant à son référent.
theological_decisions:
- issue: Formulation masculine représentative
  choice: L’homme puissant en paroles… mais l’homme intelligent…
  alternative: La personne puissante en paroles… mais la personne intelligente…
  rationale: Les deux groupes nominaux grecs sont au masculin singulier et présentent des figures humaines représentatives. Le masculin est conservé sans ajouter de portée doctrinale.
- issue: Référent de αὐτόν
  choice: quand il trébuche
  alternative: quand celui-ci trébuche
  rationale: L’accusatif αὐτόν peut grammaticalement renvoyer à l’homme puissant en paroles, mais la formulation demeure assez compacte pour que le lecteur puisse aussi entendre une réflexion plus générale. Le pronom « il » évite de trancher silencieusement cette tension.
translation_notes:
  register: Français international moderne, concis et digne. « Puissant en paroles » garde la vigueur de l’expression grecque sans l’alourdir ; « trébuche » préserve son image concrète et sa possible portée morale.
