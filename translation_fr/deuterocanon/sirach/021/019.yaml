  text: Instruction is shackles on the feet of the senseless[a], and like handcuffs on the right hand.
translation:
  language: fr
  text: L’instruction est, pour les insensés, des entraves aux pieds[a], et comme des menottes à la main droite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « La discipline est, pour les insensés, des fers aux pieds, et comme des entraves à la main droite. »
    reason: Alternative lexicale pour παιδεία (« discipline »), πέδαι (« fers ») et χειροπέδαι (« entraves »), tout en conservant les images corporelles et le parallélisme du grec.
lexical_decisions:
- source_word: πέδαι
  choice: une entrave
  rationale: Le terme désigne des fers ou entraves, en particulier aux pieds. Le singulier collectif « une entrave » produit une formulation française naturelle tout en conservant l’image concrète de la restriction.
- source_word: ἐν ποσὶν
  choice: aux pieds
  rationale: Avec πέδαι, l’expression indique l’endroit où les entraves sont placées. « Aux pieds » est idiomatique en français.
- source_word: ἀνοήτοις
  choice: les gens dépourvus de bon sens
  rationale: ἀνόητος qualifie ceux qui manquent d’intelligence ou de discernement. Cette expression rend le défaut de compréhension sans figer les personnes sous l’étiquette plus forte d’« insensés ».
- source_word: παιδεία
  choice: l’instruction
  rationale: Dans la littérature sapientielle, παιδεία couvre l’instruction, l’éducation et la discipline formatrice. « Instruction » garde ici la portée pédagogique générale sans imposer une nuance punitive.
- source_word: χειροπέδαι
  choice: des menottes
  rationale: Le mot désigne des entraves pour les mains. « Menottes » est le terme moderne, clair et concret en français.
- source_word: ἐπὶ χειρὸς δεξιᾶς
  choice: à la main droite
  rationale: La traduction conserve la main droite et le singulier du grec, malgré le caractère stylisé de l’image.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La comparaison exprime la manière dont les personnes sans discernement ressentent l’instruction, sans expliciter davantage le jugement du texte.
