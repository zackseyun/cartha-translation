base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/021/015.yaml
  text: If an intelligent man hears a wise word[a], he will praise it and add to it; a wasteful man heard it and rejected it[c][b], and he cast it behind his back.
translation:
  language: fr
  text: Si un homme intelligent entend une parole sage[a], il la louera et y ajoutera[b] ; l’homme qui vit dans la démesure l’entendit, en fut contrarié[c] et la rejeta derrière son dos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un propos sage ». Le grec peut désigner une parole exprimant la sagesse, et non un seul mot.
    reason: lexical_alternative
  - marker: b
    text: « Y ajoutera » peut signifier qu’il prolongera cette parole en y apportant une réflexion supplémentaire.
    reason: lexical_alternative
  - marker: c
    text: La tournure grecque est difficile. Elle décrit vraisemblablement une réaction négative à ce que cet homme vient d’entendre.
    reason: alternative_reading
lexical_decisions:
- source_word: λόγον σοφόν
  choice: une parole sage
  rationale: L’expression désigne ici une parole ou un propos porteur de sagesse, et non nécessairement un mot isolé. « Une parole sage » conserve le singulier et reste naturel en français.
- source_word: ἐπιστήμων
  choice: un homme intelligent
  rationale: Le terme désigne quelqu’un qui possède intelligence ou connaissance. Le masculin singulier représentatif du proverbe grec est conservé.
- source_word: αἰνέσει αὐτόν
  choice: il la louera
  rationale: Le futur αἰνέσει signifie directement « louer » ou « faire l’éloge de ». Le pronom féminin reprend naturellement « parole » en français.
- source_word: ἐπʼ αὐτὸν προσθήσει
  choice: il y ajoutera
  rationale: 'La formulation demeure proche du grec et préserve l’ouverture du sens : l’homme intelligent peut prolonger la parole sage ou y apporter une nouvelle réflexion.'
- source_word: ὁ σπαταλῶν
  choice: l’homme qui vit dans la démesure
  rationale: Le participe évoque une conduite prodigue, dissipée ou vouée aux plaisirs. Cette formulation française exprime le mode de vie plutôt qu’un simple défaut de gestion financière.
- source_word: ἀπῄρεσεν αὐτῷ
  choice: la rejette
  rationale: La tournure grecque est difficile. Le geste qui suit indique une réaction négative et un refus de la parole ; « la rejette » rend clairement ce sens contextuel sans prétendre résoudre entièrement la difficulté.
- source_word: ἀπέστρεψεν αὐτοῦ ὀπίσω τοῦ νώτου αὐτοῦ
  choice: la jette derrière son dos
  rationale: Cette traduction garde l’image concrète et vigoureuse du grec, qui exprime le mépris et la mise à l’écart de la parole entendue.
theological_decisions:
- issue: Masculin singulier représentatif dans un proverbe de sagesse
  choice: Conserver « un homme » puis « l’homme »
  alternative: Employer « une personne » ou reformuler au pluriel
  rationale: Les formes grecques sont au masculin singulier et présentent deux figures proverbiales contrastées. La traduction en maintient la forme sans affirmer que la maxime ne concernerait que les hommes.
- issue: Sens précis de l’ajout à la parole sage
  choice: Maintenir la formulation ouverte « y ajoutera »
  alternative: Expliciter « l’approfondira » ou « l’enrichira de ses propres réflexions »
  rationale: Le grec ne précise pas ce qui est ajouté ni de quelle manière. La traduction évite de résoudre cette ambiguïté.
translation_notes:
  register: 'Français international moderne, naturel et digne. La structure antithétique du proverbe et l’alternance des temps du grec sont conservées : futur pour la conduite caractéristique de l’homme intelligent, puis présent de narration en français pour la réaction de l’homme démesuré. L’image finale reste concrète plutôt que d’être remplacée par une paraphrase abstraite.'
