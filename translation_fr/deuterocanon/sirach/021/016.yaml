  text: A fool’s explanation is like a burden on the road[a], but grace will be found on the lips of the prudent.
translation:
  language: fr
  text: L’explication donnée par un insensé est comme un fardeau sur la route, mais la grâce[a] se trouvera sur les lèvres de l’homme avisé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’agrément » ou « la bienveillance ». Le grec χάρις peut désigner la grâce, la faveur, l’agrément ou une qualité gracieuse.
    reason: alternative lexicale
lexical_decisions:
- source_word: ἐξήγησις
  choice: explication
  rationale: Le nom désigne l’action d’exposer ou d’expliquer. « Explication » rend directement le terme grec et convient au contraste proverbial entre le discours de l’insensé et celui de l’homme avisé.
- source_word: μωροῦ
  choice: d’un insensé
  rationale: Le génitif dépend de ἐξήγησις. « Insensé » est le terme courant du registre sapientiel et exprime un défaut de jugement plutôt qu’une simple faiblesse intellectuelle.
- source_word: ὡς ἐν ὁδῷ φορτίον
  choice: comme un fardeau sur la route
  rationale: φορτίον désigne une charge ou un fardeau, et ἐν ὁδῷ situe concrètement l’image sur la route ou en chemin. La formulation conserve l’idée de quelque chose de lourd et encombrant pendant le trajet.
- source_word: χείλους
  choice: sur les lèvres
  rationale: La traduction littérale conserve l’image sapientielle de la parole qui vient des lèvres.
- source_word: συνετοῦ
  choice: de l’homme avisé
  rationale: συνετός désigne une personne douée de compréhension et de bon jugement. « Avisé » est naturel en français proverbial et contraste clairement avec « insensé ».
- source_word: εὑρεθήσεται χάρις
  choice: la grâce se trouvera
  rationale: χάρις peut évoquer la grâce, la faveur, l’agrément ou le caractère gracieux. « Grâce » préserve cette richesse sémantique et la tournure passive du grec, tandis qu’une note signale les principales nuances possibles.
