  text: He who builds his house with another’s money is like one gathering his stones for winter[a][b].
translation:
  language: fr
  text: Celui qui bâtit sa maison avec les biens d’autrui ressemble à quelqu’un qui amasse ses pierres pour l’hiver.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec l’argent d’autrui ». Le grec peut désigner l’argent, les richesses ou les biens appartenant à d’autres.
    reason: lexical_alternative
  - marker: b
    text: « Pour l’hiver » peut aussi se comprendre « pour la saison des tempêtes », ce qui peut souligner la précarité ou la vanité de l’entreprise.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οἰκοδομῶν
  choice: Celui qui bâtit
  rationale: Le participe présent grec précédé de l’article a une portée générale et proverbiale. Cette formulation conserve cette valeur tout en restant naturelle en français.
- source_word: τὴν οἰκίαν αὐτοῦ
  choice: sa maison
  rationale: Dans le contexte de la construction et des pierres, οἰκία désigne d’abord le bâtiment plutôt que la maisonnée.
- source_word: ἐν χρήμασιν ἀλλοτρίοις
  choice: avec les biens d’autrui
  rationale: χρήματα peut désigner l’argent, les richesses ou les biens, et ἀλλότριος ce qui appartient à autrui. « Les biens d’autrui » préserve cette amplitude mieux que le seul mot « argent ».
- source_word: ὡς συνάγων
  choice: ressemble à quelqu’un qui amasse
  rationale: ὡς suivi du participe introduit ici une comparaison. « Amasse » convient au rassemblement progressif de pierres.
- source_word: αὐτοῦ τοὺς λίθους
  choice: ses pierres
  rationale: Le texte grec transmis comporte αὐτοῦ, compris naturellement comme un possessif se rapportant au constructeur évoqué dans la comparaison.
- source_word: εἰς χειμῶνα
  choice: pour l’hiver
  rationale: χειμών peut désigner l’hiver ou la saison des tempêtes. La traduction concise « pour l’hiver » conserve l’image sans en imposer une interprétation unique.
