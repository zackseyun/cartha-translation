  text: An assembly of the lawless is like a bundle of tow[a], and their end is a flame of fire.
translation:
  language: fr
  text: L’assemblée des hommes sans loi est un amas d’étoupe[a], et leur fin est une flamme de feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’étoupe est un amas de fibres grossières, notamment de lin, qui prend feu très facilement. Littéralement, le grec juxtapose : « étoupe rassemblée, assemblée des hommes sans loi ».'
    reason: Clarification d’un terme concret peu courant et signalement de la construction grecque condensée.
lexical_decisions:
- source_word: στιππύον
  choice: étoupe
  rationale: Le nom désigne des fibres grossières, notamment des déchets de lin, qui s’enflamment très facilement. « Étoupe » conserve avec précision l’image concrète du grec.
- source_word: συνηγμένον
  choice: un amas
  rationale: Le participe signifie littéralement « rassemblé ». Avec « étoupe », « un amas » exprime naturellement en français la matière combustible réunie en un même ensemble.
- source_word: συναγωγὴ ἀνόμων
  choice: l’assemblée des hommes sans loi
  rationale: « Assemblée » rend le caractère collectif de συναγωγή. « Hommes sans loi » conserve la nuance de ἄνομος, qui désigne ceux qui ne respectent pas la loi, sans réduire le terme au sens moderne et pénal de « hors-la-loi ».
- source_word: συντέλεια
  choice: fin
  rationale: Dans ce contexte, le terme désigne l’issue finale ou le sort ultime de cette assemblée. « Fin » reste sobre et garde la portée finale du grec.
- source_word: φλὸξ πυρός
  choice: une flamme de feu
  rationale: Cette formulation conserve l’expression grecque emphatique et son caractère poétique, tout en restant intelligible en français.
theological_decisions:
- issue: Faut-il généraliser ἀνόμων en un simple terme moral ?
  choice: hommes sans loi
  alternative: méchants ; impies
  rationale: Le grec évoque précisément l’absence ou le rejet de la loi. La traduction retenue maintient cette nuance éthique sans lui imposer une interprétation confessionnelle.
- issue: Faut-il introduire une comparaison explicite ?
  choice: 'métaphore directe : « est un amas d’étoupe »'
  alternative: « est comme un amas d’étoupe »
  rationale: Le grec juxtapose directement l’étoupe rassemblée et l’assemblée des hommes sans loi, sans particule comparative. La métaphore directe préserve donc mieux la vigueur et la forme condensée de la source.
translation_notes:
  register: Français moderne, sobre et sapiential. « Étoupe » est maintenu pour la précision de l’image, avec une note explicative. La structure parallèle et la répétition expressive de « flamme de feu » conservent la densité poétique du grec.
