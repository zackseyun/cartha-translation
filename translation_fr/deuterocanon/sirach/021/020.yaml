  text: A fool raises his voice in laughter[a], but a shrewd man will scarcely smile quietly.
translation:
  language: fr
  text: L’insensé élève la voix quand il rit, mais l’homme avisé sourira à peine, en silence[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sourira à peine, calmement ». Le grec associe de façon concise les idées de difficulté ou de faible degré, de calme et de sourire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρός
  choice: l’insensé
  rationale: Terme courant de la littérature sapientielle pour une personne dépourvue de jugement moral et pratique; « l’insensé » conserve le registre proverbial sans adopter une injure familière.
- source_word: ἐν γέλωτι
  choice: quand il rit
  rationale: Cette tournure française naturelle exprime que l’insensé hausse la voix dans son rire, sans alourdir la maxime par un calque de la préposition grecque.
- source_word: ἀνυψοῖ φωνὴν αὐτοῦ
  choice: élève la voix
  rationale: Expression idiomatique française correspondant directement à l’action d’élever sa voix et soulignant le rire bruyant.
- source_word: ἀνήρ
  choice: l’homme
  rationale: Le grec emploie explicitement un nom masculin singulier; sa conservation maintient le parallélisme proverbial.
- source_word: πανοῦργος
  choice: avisé
  rationale: Le mot peut évoquer l’habileté, la finesse ou la ruse. Dans ce contraste avec l’insensé bruyant, « avisé » rend une intelligence maîtrisée sans imposer une nuance péjorative absente du contexte immédiat.
- source_word: μόλις
  choice: à peine
  rationale: Rend l’idée de faible degré ou de retenue et convient naturellement au verbe « sourire ».
- source_word: ἡσυχῇ
  choice: en silence
  rationale: Le datif a une valeur adverbiale et évoque le calme ou l’absence de bruit; « en silence » maintient explicitement le contraste avec la voix élevée de l’insensé.
- source_word: μειδιάσει
  choice: sourira
  rationale: Le verbe désigne un sourire, par opposition au rire, et la forme au futur est conservée, avec une portée générale propre à la maxime.
