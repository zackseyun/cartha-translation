  text: The inward parts of a fool are like a broken vessel[a], and they will not hold any knowledge.
translation:
  language: fr
  text: 'Les entrailles de l’insensé sont comme un récipient brisé[a] : elles ne retiendront aucune connaissance.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme une jarre fracassée » ou « comme un pot brisé ». Le grec évoque un contenant brisé qui ne peut plus retenir ce qu’on y met.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγκατα
  choice: les entrailles
  rationale: Le terme désigne littéralement les organes intérieurs et, par extension, l’être intérieur. « Les entrailles » conserve l’image corporelle concrète qui se prolonge dans celle du récipient brisé.
- source_word: μωροῦ
  choice: de l’insensé
  rationale: Dans la littérature sapientielle, μωρός désigne une personne dépourvue de discernement, moralement et intellectuellement. « L’insensé » garde le ton proverbial sans employer « fou » dans son sens psychiatrique moderne.
- source_word: ὡς ἄγγιον συντετριμμένον
  choice: comme un récipient brisé
  rationale: ἄγγιον est un contenant au sens large, tandis que συντετριμμένον évoque un objet brisé ou fracassé. Cette formulation préserve l’image sans préciser indûment la matière ou la forme.
- source_word: πᾶσαν γνῶσιν
  choice: aucune connaissance
  rationale: 'Sous la négation οὐ, πᾶσαν se rend naturellement en français par « aucune » : aucune connaissance ne peut être conservée.'
- source_word: οὐ κρατήσει
  choice: elles ne retiendront
  rationale: κρατέω peut signifier tenir, garder ou retenir. Le pluriel français reprend « les entrailles » et maintient l’image d’un récipient incapable de conserver son contenu, bien que le verbe grec soit au singulier en accord avec le neutre pluriel ἔγκατα.
theological_decisions: []
translation_notes:
  register: Français moderne, proverbial et digne. L’image concrète des « entrailles » a été conservée plutôt que remplacée par « cœur » ou « esprit »; les deux membres sont reliés par deux-points afin de rendre explicite la conséquence suggérée par la comparaison.
