review_pass:
  verdict: revise
  source_fidelity: Le premier membre rend fidèlement l’hébreu, y compris l’image singulière du « pied » et le mouvement vers « une maison ». Dans le second membre, « s’abaisse devant les grands » restitue raisonnablement יַכְנִיעַ לָרַבִּים, tout en reconnaissant que רַבִּים peut aussi renvoyer aux « nombreux ». En revanche, « calculés » ajoute une caractérisation péjorative ou calculatrice qui n’est pas explicitement requise par מְזִימוֹת, dont la nuance demeure ouverte.
  naturalness: Le texte est sobre, fluide et convient au registre proverbial. « L’homme aux desseins » est naturel dans ce registre et évite la surinterprétation de « desseins calculés ». La formulation de la note grecque est rendue plus idiomatique en français.
  terminology: « Insensé » convient à נָבָל dans un contexte sapientiel. « Desseins » préserve l’idée de projets ou d’intentions sans fixer leur valeur morale. « Les grands » est une interprétation contextuellement plausible de רַבִּים; la divergence grecque substantielle doit rester signalée.
  issues:
  - severity: medium
    issue: « desseins calculés » interprète excessivement מְזִימוֹת
    rationale: Le terme hébreu désigne des projets, intentions ou desseins et peut être ambivalent, mais « calculés » introduit une connotation de ruse ou de préméditation qui n’est pas nécessairement présente.
  - severity: low
    issue: La formulation française de la lecture grecque est peu idiomatique
    rationale: « Éprouvera de la honte devant une présence » est lourd et opaque. « Aura honte devant quelqu’un » rend plus naturellement le sens général de ἀπὸ προσώπου, sans prétendre résoudre toutes ses nuances.
