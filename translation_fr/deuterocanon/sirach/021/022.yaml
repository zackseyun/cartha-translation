  rationale: La révision retire l’ajout interprétatif « calculés » afin de conserver l’ambivalence de מְזִימוֹת. Elle améliore aussi la lisibilité de la note tout en maintenant explicitement la divergence majeure entre les témoins hébreu et grec.
