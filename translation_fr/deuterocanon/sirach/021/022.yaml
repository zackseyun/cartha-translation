translation:
  language: fr
  text: Le pied de l’insensé se hâte vers une maison, mais l’homme aux desseins s’abaisse devant les grands.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente un second membre sensiblement différent : « mais l’homme très expérimenté aura honte devant quelqu’un ».'
    reason: alternative_reading
lexical_decisions:
- source_word: רֶגֶל
  choice: le pied
  rationale: Conserve le singulier concret et l’image proverbiale de l’hébreu, également attestés par le grec ποὺς.
- source_word: נָבָל
  choice: l’insensé
  rationale: Rendu courant dans le registre sapientiel, exprimant une déficience morale et intellectuelle sans réduire le terme à la seule stupidité.
- source_word: מִהֲרָה
  choice: se hâte
  rationale: Reproduit l’idée de précipitation dans une formulation française naturelle et digne.
- source_word: אֶל בָּיִת
  choice: vers une maison
  rationale: Respecte l’indétermination de בָּיִת et le mouvement exprimé par אֶל, sans préciser arbitrairement qu’il entre dans la maison.
- source_word: אִישׁ מְזִימוֹת
  choice: l’homme aux desseins calculés
  rationale: מְזִימוֹת désigne des projets ou desseins et peut avoir une coloration ambivalente. « Calculés » conserve cette nuance sans imposer « intrigues », trop nettement péjoratif.
- source_word: יַכְנִיעַ
  choice: s’abaisse
  rationale: Le hiphil de כנע exprime l’abaissement ou la soumission; le sens contextuel paraît réfléchi, comme marque de déférence.
- source_word: לָרַבִּים
  choice: devant les grands
  rationale: רַבִּים peut signifier « les nombreux » ou « les grands ». Le contexte social de la déférence favorise ici « les grands », tout en laissant l’incertitude textuelle signalée en note.
theological_decisions:
- issue: Divergence notable entre l’hébreu et le grec dans le second membre
  choice: 'Suivre le texte hébreu conservé: « l’homme aux desseins calculés s’abaisse devant les grands »'
  alternative: 'Le grec porte approximativement: « mais l’homme très expérimenté éprouvera de la honte devant une présence »'
  rationale: Le témoin hébreu est la source principale lorsqu’il est disponible. Puisque le grec diffère substantiellement et infléchit le sens du proverbe, sa lecture est conservée en note plutôt que fusionnée avec l’hébreu.
translation_notes:
  register: Français international moderne, sobre et proverbial. La syntaxe parallèle et l’image concrète du pied sont conservées; la note rend visible la divergence textuelle majeure sans alourdir le corps du verset.
