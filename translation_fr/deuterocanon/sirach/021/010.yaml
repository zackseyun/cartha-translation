  text: The way of sinners is paved with stones[b][a], and at its end is the pit of Hades.
translation:
  language: fr
  text: Le chemin des pécheurs est pavé de pierres[a], et à son extrémité se trouve la fosse de l’Hadès[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « est rendu uni au moyen de pierres ». Le grec peut souligner qu’une route a été aplanie ou nivelée; « pavé de pierres » fait ressortir l’image probable d’une voie aménagée.
    reason: lexical_alternative
  - marker: b
    text: Ici, « l’Hadès » désigne le séjour des morts; on pourrait aussi traduire par « le monde souterrain ».
    reason: alternative_reading
lexical_decisions:
- source_word: ὁδὸς
  choice: chemin
  rationale: « Chemin » conserve à la fois l’image concrète d’une voie et son sens métaphorique de conduite ou de destinée.
- source_word: ἁμαρτωλῶν
  choice: des pécheurs
  rationale: Le génitif est rendu directement et « pécheurs » préserve sans atténuation la catégorie morale du grec.
- source_word: ὡμαλισμένη ἐκ λίθων
  choice: est pavé de pierres
  rationale: Le participe évoque ce qui a été rendu uni ou nivelé; avec « de pierres », l’expression décrit vraisemblablement une chaussée aménagée. « Pavé de pierres » restitue naturellement cette image en français.
- source_word: ἐπʼ ἐσχάτῳ αὐτῆς
  choice: à son extrémité
  rationale: Cette formulation garde l’image spatiale du bout du chemin tout en laissant entendre son aboutissement.
- source_word: βόθρος
  choice: fosse
  rationale: « Fosse » rend le trou profond ou la cavité évoquée par le terme et en conserve la force menaçante.
- source_word: ᾅδου
  choice: de l’Hadès
  rationale: Le grec nomme explicitement l’Hadès, le séjour des morts. La translittération préserve le cadre conceptuel de la Septante sans assimiler le terme à l’enfer au sens doctrinal postérieur.
theological_decisions:
- issue: Sens de ᾅδου dans l’imagerie sapientielle
  choice: l’Hadès
  alternative: le séjour des morts; le monde souterrain
  rationale: « L’Hadès » suit précisément le terme grec et ne tranche pas en faveur d’une conception ultérieure de l’enfer. Une note en explicite le sens pour le lecteur moderne.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve le contraste implicite entre un chemin apparemment bien aménagé et son issue funeste, sans remplacer la conjonction grecque « et » par un « mais » interprétatif.
