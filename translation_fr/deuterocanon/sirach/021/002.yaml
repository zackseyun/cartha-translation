  text: Flee from sin as from the face of a snake[a]; for if you come near it, it will bite you.[b]
translation:
  language: fr
  text: Fuis le péché comme on fuit un serpent[a] ; car, si tu t’en approches, il te mordra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, le grec dit : « Fuis le péché comme loin de la face d’un serpent. » Le mot « face » peut aussi exprimer la présence immédiate du serpent ; la formulation française rend l’image de manière idiomatique.'
    reason: lexical_alternative
  - marker: b
    text: La ligne hébraïque conservée dans la source fournie ne correspond pas au texte grec de ce verset et paraît provenir d’un autre emplacement. La traduction suit donc ici le témoin grec.
    reason: textual_variant
lexical_decisions:
- source_word: φεῦγε
  choice: Fuis
  rationale: L’impératif grec exprime une fuite urgente et concrète. « Fuis » conserve cette force mieux que « éloigne-toi ».
- source_word: ἁμαρτίας
  choice: le péché
  rationale: « Péché » rend directement la portée morale et théologique de ἁμαρτία.
- source_word: ὡς ἀπὸ προσώπου ὄφεως
  choice: comme tu fuirais devant un serpent
  rationale: La tournure française naturelle « devant un serpent » restitue l’idée grecque littérale de fuite « loin de la face ou présence d’un serpent », tout en préservant l’image concrète.
- source_word: ἐὰν ... προσέλθῃς
  choice: si tu t’en approches
  rationale: Le verbe προσέρχομαι signifie ici s’approcher. Le pronom « en » renvoie clairement au péché figuré par le serpent.
- source_word: δήξεταί σε
  choice: il te mordra
  rationale: Le verbe grec désigne précisément l’action de mordre ; le futur français maintient la conséquence directe annoncée.
theological_decisions:
- issue: Choix du témoin principal lorsque l’hébreu fourni et le grec divergent fortement
  choice: Traduire le témoin grec dans le texte principal
  alternative: 'Traduire la ligne hébraïque transmise dans l’édition Kahana : « Un chef habitué aux maisons de festin, qui établit son siège sur les hauteurs de la ville. »'
  rationale: La ligne hébraïque fournie ne correspond pas au contenu de Siracide 21.2 attesté par le grec et semble déplacée ou associée par erreur à cette référence. Le grec offre ici le témoin cohérent du verset ; la note signale explicitement le problème textuel sans le dissimuler.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier correspond à l’exhortation grecque. « Comme tu fuirais devant » évite le calque peu naturel « comme loin de la face de » tout en gardant la scène d’une rencontre immédiate avec un serpent.
