  text: The mouth of a wise man will be sought in the assembly[b][a], and they will ponder his words in their hearts.
translation:
  language: fr
  text: La bouche d’un homme sage sera recherchée dans l’assemblée, et l’on méditera ses paroles dans son cœur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et ses paroles seront méditées dans le cœur »; le grec emploie un verbe au singulier sans sujet exprimé et ne donne pas de possessif avec « cœur ».'
    reason: ambiguïté grammaticale et traduction littérale
lexical_decisions:
- source_word: στόμα φρονίμου
  choice: la parole d’un homme sage
  rationale: Littéralement « la bouche d’un homme sage ». En français, « la parole » conserve la métonymie de la bouche pour ce qui est dit tout en évitant une formulation artificielle.
- source_word: ζητηθήσεται
  choice: sera recherchée
  rationale: Le futur passif est conservé; « recherchée » exprime ici que la parole du sage sera sollicitée et tenue en estime.
- source_word: ἐν ἐκκλησίᾳ
  choice: dans l’assemblée
  rationale: « Assemblée » désigne naturellement la communauté réunie sans importer le sens institutionnel chrétien plus tardif d’« Église ».
- source_word: τοὺς λόγους αὐτοῦ
  choice: ses propos
  rationale: « Propos » rend λόγους de manière naturelle dans ce contexte et évite la répétition de « parole ».
- source_word: διανοηθήσεται
  choice: l’on méditera
  rationale: Le futur grec est au singulier et son sujet demeure implicite. La tournure française « l’on » préserve cette indétermination; « méditera » rend la réflexion intérieure soutenue.
- source_word: ἐν καρδίᾳ
  choice: dans son cœur
  rationale: Le grec porte le singulier sans possessif explicite. Le français ajoute le possessif requis par l’usage, en accord avec le sujet indéfini singulier « l’on », tout en conservant l’image biblique du cœur.
theological_decisions:
- issue: Genre de φρονίμου
  choice: d’un homme sage
  alternative: d’une personne sage
  rationale: La forme grecque est masculine singulière substantivée. La traduction garde ce marquage sans en faire une affirmation doctrinale sur les personnes susceptibles d’être sages.
- issue: Sens de ἐκκλησία
  choice: assemblée
  alternative: communauté; Église
  rationale: Dans ce contexte sapientiel, le mot désigne le rassemblement communautaire. « Église » risquerait d’introduire une portée institutionnelle chrétienne absente du verset.
- issue: Sujet implicite de διανοηθήσεται
  choice: l’on méditera
  alternative: elle méditera; ils méditeront
  rationale: Le verbe grec est à la troisième personne du singulier sans sujet exprimé. « L’on » maintient l’indétermination plutôt que de supposer une reprise explicite de l’assemblée ou un sujet pluriel.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le futur proverbial, le cadre communautaire et l’intériorité exprimée par « cœur », tout en signalant l’ambiguïté du second sujet.
