  text: He who is not shrewd will not be instructed;[a]
translation:
  language: fr
  text: Celui qui n’est pas habile ne recevra pas d’instruction.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « astucieux » ou « avisé »; dans d’autres contextes, le mot grec peut aussi avoir un sens négatif, comme « rusé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ παιδευθήσεται
  choice: ne se laissera pas instruire
  rationale: Le futur passif de παιδεύω peut exprimer l’instruction, la formation ou la correction. La tournure française « se laissera instruire » rend naturellement ici la réception de l’enseignement, sans réduire le sens à une punition disciplinaire.
- source_word: ὃς
  choice: Celui qui
  rationale: Le pronom relatif désigne de manière générale une personne; « Celui qui » conserve la forme masculine singulière du grec tout en restant idiomatique en français.
- source_word: οὐκ ἔστιν
  choice: n’est pas
  rationale: Cette traduction directe respecte la valeur copulative simple du grec.
- source_word: πανοῦργος
  choice: avisé
  rationale: πανοῦργος peut signifier habile, astucieux ou rusé, avec une valeur variable selon le contexte. « Avisé » exprime ici l’acuité pratique nécessaire pour profiter de l’instruction sans suggérer une duplicité morale.
theological_decisions:
- issue: Valeur morale de πανοῦργος dans cette maxime sapientielle
  choice: Traduire dans un sens relativement positif et pratique par « avisé »
  alternative: « rusé », « astucieux » ou « habile »
  rationale: Puisque la qualité désignée est présentée comme nécessaire pour recevoir l’instruction, une traduction franchement péjorative ferait entendre qu’il faut être moralement retors pour apprendre. « Avisé » préserve l’idée de discernement pratique tout en évitant de moraliser excessivement le terme.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation concise garde le caractère proverbial du grec; « se laisser instruire » souligne la réceptivité sans développer indûment l’énoncé.
