review_pass:
  verdict: revise
  source_fidelity: Le grec dit littéralement que « celui qui chuchote / médit en secret » souille sa propre âme et sera haï « dans son lieu ou milieu de résidence ». « Souille sa propre âme » est fidèle. La formulation « là où il réside » rend bien l’ambiguïté de ἐν παροικήσει. En revanche, « médire à voix basse » est une collocation française peu idiomatique; « médire en secret » exprime naturellement la parole malveillante et clandestine impliquée par ψιθυρίζων. « Sera haï » rend plus directement μισηθήσεται que « sera détesté ».
  naturalness: La phrase révisée est fluide, concise et de registre proverbial soutenu mais accessible. « Celui qui médit en secret » est plus naturel que « Celui qui médit à voix basse ».
  terminology: « Souille », « sa propre âme » et « sera haï » préservent respectivement les nuances d’impureté morale, le réfléchi emphatique et le futur passif. La note doit éviter « pendant son séjour », qui transforme indûment le complément locatif en complément temporel.
  issues:
  - severity: medium
    issue: « Médire à voix basse » est une formulation peu idiomatique en français.
    rationale: Le verbe « médire » s’emploie plus naturellement avec « de quelqu’un » ou avec une indication telle que « en secret ». La révision conserve l’idée de parole malveillante et cachée sans restreindre le grec à la calomnie.
  - severity: medium
    issue: La note propose « pendant son séjour ».
    rationale: ἐν παροικήσει est ici locatif et renvoie au lieu, au cadre ou à la communauté de résidence, non à la durée d’un séjour. Cette alternative est donc trompeuse.
  - severity: low
    issue: « Sera détesté » est légèrement moins direct que « sera haï ».
    rationale: Le grec μισηθήσεται signifie directement « sera haï »; cette forme française est naturelle dans le registre de la sagesse biblique.
  revised_text: Celui qui médit en secret souille sa propre âme et sera haï là où il réside.[a]
