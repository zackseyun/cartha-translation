  text: The whisperer defiles his own soul[a], and in the place where he lives he will be hated.
translation:
  language: fr
  text: Celui qui médit en secret souille sa propre âme et sera haï là où il réside.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans son lieu de séjour », « parmi ceux avec qui il habite » ou « dans son voisinage ». Le grec peut désigner le lieu de résidence d’une personne ou le milieu où elle vit.
    reason: lexical_alternative
lexical_decisions:
- source_word: μολύνει
  choice: souille
  rationale: Le verbe exprime l’idée de rendre impur ou de ternir moralement. « Souille » conserve à la fois la dimension morale et l’image de l’impureté.
- source_word: τὴν ἑαυτοῦ ψυχὴν
  choice: sa propre âme
  rationale: La tournure réflexive souligne le tort intérieur que la personne s’inflige. « Sa propre âme » maintient le terme ψυχή et son poids moral sans le réduire simplement à « elle-même ».
- source_word: ὁ ψιθυρίζων
  choice: celui qui médit à voix basse
  rationale: Le participe désigne une personne qui parle à voix basse ou en secret, souvent pour médire. Cette formulation naturelle en français conserve l’idée de parole malveillante et clandestine sans la restreindre à la calomnie proprement dite.
- source_word: ἐν παροικήσει
  choice: là où il réside
  rationale: παροίκησις peut évoquer le séjour, le lieu de résidence ou le milieu dans lequel on habite, parfois comme résident étranger. La formulation retenue reste naturelle tout en évitant d’imposer le sens plus précis de « voisinage » ou de « communauté ».
- source_word: μισηθήσεται
  choice: sera détesté
  rationale: Le futur passif indique directement la haine qu’éprouveront les autres envers cette personne. « Sera détesté » rend ce sens clairement en français moderne.
