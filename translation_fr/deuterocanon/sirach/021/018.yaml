  text: Wisdom to a fool is like a ruined house, and the knowledge of one without understanding is words that cannot be examined.
translation:
  language: fr
  text: Pour l’insensé, la sagesse est comme une maison en ruine[a] ; et la connaissance de celui qui manque d’intelligence, ce sont des paroles qu’on ne peut examiner[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une maison détruite » ; le participe grec peut désigner ce qui a été détruit, anéanti ou a disparu.
    reason: lexical_alternative
  - marker: b
    text: Ou « des paroles incompréhensibles » ; le grec peut souligner soit leur caractère inintelligible, soit l’impossibilité de les examiner à fond.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶκος ἠφανισμένος
  choice: une maison en ruine
  rationale: Le participe de ἀφανίζω peut évoquer ce qui a été détruit, anéanti ou rendu invisible. Dans cette comparaison, « maison en ruine » conserve l’image concrète et exprime naturellement en français son état de destruction et d’inutilité.
- source_word: μωρῷ
  choice: pour l’insensé
  rationale: 'Le datif marque ici la relation ou le point de vue : la sagesse, pour l’insensé, est comparable à une maison en ruine. Cette formulation est idiomatique et ne confond pas μωρός avec ἀσύνετος dans le second membre.'
- source_word: σοφία
  choice: la sagesse
  rationale: Équivalent français courant et direct, approprié au registre sapientiel.
- source_word: γνῶσις
  choice: la connaissance
  rationale: Ce choix maintient la distinction lexicale et le parallélisme entre σοφία, « sagesse », et γνῶσις, « connaissance ».
- source_word: ἀσυνέτου
  choice: de celui qui manque d’intelligence
  rationale: Cette expression rend l’absence de compréhension ou de discernement sans répéter « insensé », déjà employé pour μωρός.
- source_word: ἀδιεξέταστοι λόγοι
  choice: des paroles qu’on ne peut approfondir
  rationale: La formulation garde l’idée d’un discours que l’examen ne permet pas de pénétrer ou de suivre jusqu’au bout, tout en restant naturelle en français. Elle laisse ouverte la nuance entre impossibilité d’analyse et caractère inintelligible.
