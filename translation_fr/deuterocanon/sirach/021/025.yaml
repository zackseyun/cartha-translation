  yaml_path: translation/deuterocanon/sirach/021/025.yaml
  text: The lips of strangers will be weighed down by these things[b][a], but the words of the wise will be set on a balance.
translation:
  language: fr
  text: Les lèvres des étrangers seront alourdies par ces choses[a], mais les paroles des sages seront placées sur une balance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en ces choses »; la tournure grecque permet ce rendu plus littéral.'
    reason: lexical_alternative
  - marker: b
    text: L’image de paroles placées sur une balance suggère que les sages parlent avec mesure et discernement.
    reason: cultural_note
lexical_decisions:
- source_word: χείλη
  choice: les lèvres
  rationale: Le rendu littéral conserve la métonymie des lèvres pour la parole ainsi que l’image concrète du proverbe.
- source_word: ἀλλοτρίων
  choice: des étrangers
  rationale: Le terme désigne des personnes perçues comme extérieures ou étrangères, sans imposer une distinction ethnique aussi marquée que « des étrangers d’un autre pays ».
- source_word: ἐν τούτοις
  choice: par ces choses
  rationale: Dans le contexte métaphorique de βαρυνθήσεται, « par » exprime naturellement la cause ou le moyen. La valeur plus littérale « en ces choses » reste possible et est signalée en note.
- source_word: βαρυνθήσεται
  choice: seront alourdies
  rationale: Ce choix garde l’idée d’être rendu lourd ou chargé et prépare l’image de la balance dans le second membre.
- source_word: λόγοι
  choice: les paroles
  rationale: « Paroles » convient au style sapientiel et désigne ici ce que disent les sages.
- source_word: φρονίμων
  choice: des sages
  rationale: L’adjectif substantivé désigne les personnes avisées ou prudentes; « les sages » correspond au vocabulaire naturel de la littérature de sagesse.
- source_word: ἐν ζυγῷ
  choice: sur une balance
  rationale: Dans ce contexte de pesée, ζυγός désigne une balance ou son fléau, et non un joug.
- source_word: σταθήσονται
  choice: seront placées
  rationale: Associé à la balance, le verbe évoque des paroles mises en position pour être pesées. Ce rendu français est plus naturel que le calque « se tiendront » tout en conservant l’image.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et proverbial. Le parallélisme et l’image continue du poids et de la balance sont conservés, malgré leur caractère volontairement concret.
