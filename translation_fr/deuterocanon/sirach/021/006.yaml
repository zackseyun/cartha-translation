  yaml_path: translation/deuterocanon/sirach/021/006.yaml
  text: One who hates reproof walks in the track of a sinner, but one who fears the Lord will turn back in his heart.
translation:
  language: fr
  text: Celui qui déteste la réprimande marche sur les traces d’un pécheur[a], mais celui qui craint le Seigneur se convertira dans son cœur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « dans la trace d’un pécheur ». La première proposition grecque ne comporte pas de verbe fini ; « marche » exprime en français l’image suggérée par la trace.
    reason: ellipse_syntaxique
  - marker: b
    text: 'Ou : « changera intérieurement ». Le grec exprime un retournement « dans le cœur » et ne dit pas explicitement « se repentira ».'
    reason: ambiguite_lexicale
lexical_decisions:
- source_word: μισῶν
  choice: celui qui déteste
  rationale: Le participe présent substantivé caractérise une personne par son attitude habituelle. « Celui qui déteste » est naturel et garde la force du verbe grec.
- source_word: ἐλεγμὸν
  choice: la réprimande
  rationale: Dans ce contexte sapientiel, le terme désigne une correction exprimée pour reprendre quelqu’un. « Réprimande » conserve cette idée sans réduire le sens à une simple instruction.
- source_word: ἐν ἴχνει ἁμαρτωλοῦ
  choice: est sur les traces d’un pécheur
  rationale: ἴχνος évoque une trace ou une empreinte. La proposition grecque étant elliptique et dépourvue de verbe fini, le français fournit sobrement la copule « est », sans ajouter explicitement l’idée de marcher ou de suivre.
- source_word: ὁ φοβούμενος Κύριον
  choice: celui qui craint le Seigneur
  rationale: Le participe substantivé désigne une catégorie de personne. « Craindre le Seigneur » est l’expression française consacrée et convient à la révérence envers Dieu dans la littérature sapientielle.
- source_word: ἐπιστρέψει
  choice: se retournera
  rationale: Le futur actif exprime un retournement ou un retour. « Se retournera » préserve l’image et évite le terme plus interprétatif « se repentira ».
- source_word: ἐν καρδίᾳ
  choice: dans son cœur
  rationale: La formulation conserve l’anthropologie biblique du cœur comme siège de la disposition intérieure, sans la réduire d’emblée à « intérieurement ».
theological_decisions:
- issue: Valeur de Κύριον
  choice: le Seigneur
  alternative: le Maître
  rationale: Dans ce contexte, κύριος désigne Dieu et « le Seigneur » est la formulation française naturelle et révérencielle.
- issue: Ellipse verbale de la première proposition
  choice: est sur les traces d’un pécheur
  alternative: marche sur les traces d’un pécheur
  rationale: Le grec ne comporte aucun verbe fini dans cette proposition. La copule nécessaire en français explicite le moins possible l’ellipse, tandis que « marche » préciserait davantage le mouvement seulement suggéré par l’image de la trace.
- issue: Portée de ἐπιστρέψει ἐν καρδίᾳ
  choice: se retournera dans son cœur
  alternative: se repentira intérieurement
  rationale: La traduction retenue maintient la tension et l’image du texte grec. « Se repentira » donnerait au verbe un sens théologique possible, mais plus précis que sa valeur lexicale propre.
- issue: Relation entre les deux propositions
  choice: mais
  alternative: et
  rationale: καί signifie ordinairement « et », mais les deux portraits forment ici un contraste manifeste. « Mais » rend naturellement cette relation en français sans modifier le contenu des propositions.
translation_notes:
  register: Français international moderne, sobre et digne. La structure parallèle « celui qui… celui qui… » garde le ton proverbial. Les images de la trace et du cœur sont préservées, tandis que les notes signalent l’ellipse grecque et l’ambiguïté du retournement intérieur.
