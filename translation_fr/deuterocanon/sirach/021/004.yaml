  text: All lawlessness is like a two-edged sword; for its wound there is no healing.
translation:
  language: fr
  text: 'Toute violation de la loi est comme une épée à deux tranchants : la blessure qu’elle inflige est incurable.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς
  choice: comme
  rationale: Introduit naturellement la comparaison en français moderne.
- source_word: ῥομφαία δίστομος
  choice: une épée à deux tranchants
  rationale: Expression française courante qui restitue fidèlement l’image d’une arme munie de deux tranchants, sans calquer littéralement δίστομος (« à deux bouches »).
- source_word: πᾶσα ἀνομία
  choice: toute violation de la loi
  rationale: ἀνομία évoque la transgression de la loi ou de l’ordre établi. Cette formulation est plus naturelle et immédiatement intelligible que « toute illégalité », tout en conservant la portée morale du grec.
- source_word: τῇ πληγῇ αὐτῆς
  choice: la blessure qu’elle inflige
  rationale: πληγή peut désigner un coup ou une blessure. La mention de la guérison favorise « blessure » ; la tournure explicite en français que cette blessure est produite par la violation de la loi figurée comme une épée.
- source_word: οὐκ ἔστιν ἴασις
  choice: est incurable
  rationale: Rend idiomatiquement l’absence de guérison exprimée par le grec et conserve la force sentencieuse de l’énoncé.
theological_decisions:
- issue: Portée morale de ἀνομία
  choice: violation de la loi
  alternative: iniquité ; méfait ; absence de loi
  rationale: Le choix conserve l’idée précise de transgression d’une norme sans réduire le terme au seul droit civil ni lui imposer un vocabulaire confessionnel traditionnel.
- issue: Caractère absolu de l’absence de guérison
  choice: est incurable
  alternative: il n’y a pas de guérison pour elle
  rationale: Le grec énonce sans qualification qu’il n’existe pas de guérison pour la blessure. La traduction maintient cette tension proverbiale sans l’atténuer ni l’expliquer théologiquement.
translation_notes:
  register: Français international moderne, clair et digne. La structure proverbiale est resserrée autour de l’image de l’épée et de la blessure. Aucun archaïsme ni terme confessionnel marqué.
