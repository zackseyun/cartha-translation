review_pass:
  verdict: revise
  source_fidelity: 'La première proposition rend correctement κρεῖσσον, τέκνα, σου et δεηθῆναι dans un contexte d’aide matérielle. En revanche, « que de te voir tourner les yeux » introduit indûment le verbe « voir » et modifie la construction : le grec oppose le fait que les enfants demandent au fait que l’interlocuteur regarde vers les mains de ses fils.'
  naturalness: « Te voir tourner les yeux vers » est maladroit dans cette comparaison et laisse entendre un observateur absent du grec. « Plutôt que de te tourner vers les mains de tes fils » est naturel, conserve l’image et identifie clairement l’interlocuteur comme sujet du second infinitif.
  terminology: « Enfants » puis « fils » préserve à juste titre la distinction entre τέκνα et υἱοί. « Demander de l’aide » est une formulation française mesurée et contextuellement appropriée pour δεηθῆναι ; la note explicite sans imposer cette paraphrase au texte principal.
  issues:
