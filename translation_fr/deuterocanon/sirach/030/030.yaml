  text: For it is better that your children should beg from you than that you look to the hands of your sons[a].
translation:
  language: fr
  text: Car il vaut mieux que tes enfants te demandent de l’aide plutôt que de te tourner vers les mains de tes fils[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus explicitement : « dépendre de tes fils pour subvenir à tes besoins ». Le grec dit littéralement : « regarder vers les mains de tes fils ».'
    reason: Clarifie le sens idiomatique probable de l’image grecque tout en conservant l’image concrète dans le texte principal.
lexical_decisions:
- source_word: κρεῖσσον
  choice: il vaut mieux
  rationale: Formulation comparative naturelle en français, exprimant clairement ce qui est préférable.
- source_word: τὰ τέκνα δεηθῆναί σου
  choice: que tes enfants te demandent de l’aide
  rationale: δέομαι peut signifier demander, supplier ou être dans le besoin. « Demander de l’aide » convient au contexte de dépendance matérielle sans durcir le sens jusqu’à « mendier ».
- source_word: ἐμβλέπειν εἰς χεῖρας
  choice: tourner les yeux vers les mains
  rationale: La formulation conserve l’image concrète du grec tout en produisant une phrase française compréhensible; le sens idiomatique de dépendance est précisé en note.
- source_word: υἱῶν σου
  choice: tes fils
  rationale: Le grec emploie ici spécifiquement υἱῶν, « fils », en contraste avec le terme plus général τέκνα, « enfants », dans la première proposition.
theological_decisions:
- issue: Distinction entre τέκνα et υἱῶν
  choice: enfants / fils
  alternative: enfants / enfants
  rationale: La traduction préserve la variation lexicale et la précision masculine de la seconde expression sans neutraliser le texte.
- issue: Image de la dépendance matérielle
  choice: tourner les yeux vers les mains de tes fils
  alternative: dépendre de tes fils pour vivre
  rationale: Le texte principal maintient la métaphore corporelle du grec; la note en donne le sens idiomatique sans remplacer l’image par une interprétation unique.
translation_notes:
  register: Français moderne, courant et digne. Le tutoiement singulier reproduit l’adresse directe du grec. La métaphore des mains est conservée dans le texte, avec une explicitation en note.
