    issue: Ajout de « te voir » dans la seconde proposition
    rationale: Le grec porte directement « que toi, tu regardes vers les mains de tes fils » (ἐμβλέπειν εἰς χεῖρας υἱῶν σου), sans acte de voir ni observateur. Cet ajout brouille également le parallélisme syntaxique.
  revised_text: Car il vaut mieux que tes enfants te demandent de l’aide plutôt que de te tourner vers les mains de tes fils[a].
