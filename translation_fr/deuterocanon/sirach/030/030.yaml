  to: Car il vaut mieux que tes enfants te demandent de l’aide plutôt que de te tourner vers les mains de tes fils[a].
  rationale: La révision supprime l’ajout non attesté « te voir » et rétablit l’opposition entre les deux actions exprimées par les infinitifs grecs. « Te tourner vers les mains » demeure une image française naturelle qui correspond à « regarder vers les mains », dont la portée de dépendance est indiquée en note.
