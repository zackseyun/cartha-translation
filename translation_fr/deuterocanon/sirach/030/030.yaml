    text: 'Ou, plus explicitement : « dépendre de tes fils pour subvenir à tes besoins ». Le grec dit littéralement : « regarder vers les mains de tes fils ».'
    reason: Clarifie le sens idiomatique probable de l’image grecque tout en conservant l’image concrète dans le texte principal.
  revision_rationale: La révision supprime l’ajout non attesté « te voir » et rétablit l’opposition entre les deux actions exprimées par les infinitifs grecs. « Te tourner vers les mains » demeure une image française naturelle qui correspond à « regarder vers les mains », dont la portée de dépendance est indiquée en note.
