  text: He who instructs his son will provoke the enemy to jealousy[a], and in the presence of friends he will rejoice over him.
translation:
  language: fr
  text: Celui qui instruit son fils rendra l’ennemi jaloux[a] et, en présence d’amis, se réjouira de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « suscitera l’envie de l’ennemi ». Le verbe grec peut évoquer la jalousie ou l’envie.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ διδάσκων
  choice: Celui qui instruit
  rationale: Le participe présent substantivé désigne celui qui exerce l’action; « instruit » convient à la formation donnée par un père tout en restant naturel en français.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: son fils
  rationale: Le grec emploie explicitement le masculin singulier « fils ».
- source_word: παραζηλώσει
  choice: rendra … jaloux
  rationale: Le verbe exprime ici le fait de susciter la jalousie ou l’envie; cette tournure française rend clairement sa construction avec « l’ennemi ».
- source_word: τὸν ἐχθρόν
  choice: l’ennemi
  rationale: L’article et le singulier grecs sont conservés; il peut s’agir d’un singulier représentatif.
- source_word: ἔναντι φίλων
  choice: devant ses amis
  rationale: ἔναντι signifie « devant, en présence de ». Le possessif, naturel en français dans ce contraste social, explicite la relation impliquée sans modifier le référent.
- source_word: ἐπʼ αὐτῷ
  choice: à son sujet
  rationale: Avec le verbe de joie, la locution peut désigner la personne qui en est l’occasion. « À son sujet » conserve mieux qu’une formulation causale la souplesse de la préposition.
- source_word: ἀγαλλιάσεται
  choice: il se réjouira
  rationale: Le futur exprime une joie vive; « se réjouira » est actuel, digne et fidèle sans être emphatique.
