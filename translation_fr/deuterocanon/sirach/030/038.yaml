  yaml_path: translation/deuterocanon/sirach/030/038.yaml
  text: Put him to work as is fitting for him[a], and if he does not obey, make his fetters heavy. But do not be excessive with any flesh, and do nothing without judgment.
translation:
  language: fr
  text: Affecte-le aux travaux qui lui conviennent ; et s’il n’obéit pas, alourdis ses entraves. Mais ne commets d’excès envers personne[a], et ne fais rien sans jugement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « envers toute chair », expression qui désigne ici les êtres humains en général.'
    reason: La note conserve l’image grecque de σάρξ tout en expliquant son sens anthropologique dans ce contexte.
lexical_decisions:
- source_word: εἰς ἔργα κατάστησον
  choice: Affecte-le aux travaux
  rationale: Cette formulation rend la valeur causative de κατάστησον et le domaine du travail indiqué par εἰς ἔργα, dans un français actuel et ferme.
- source_word: καθὼς πρέπει αὐτῷ
  choice: qui lui conviennent
  rationale: πρέπει exprime ce qui est approprié ou adapté à quelqu’un ; la tournure relative est naturelle en français.
- source_word: κἂν μὴ πειθαρχῇ
  choice: et s’il n’obéit pas
  rationale: πειθαρχέω désigne l’obéissance à une autorité ou à une règle. Le verbe « obéir » conserve cette idée sans ajouter explicitement la notion de discipline, absente comme substantif du grec.
- source_word: βάρυνον τὰς πέδας αὐτοῦ
  choice: alourdis ses entraves
  rationale: La traduction conserve directement l’image d’entraves rendues lourdes, sans préciser un geste comme les resserrer.
- source_word: μὴ περισσεύσῃς
  choice: ne commets d’excès
  rationale: Le verbe met en garde contre le fait de dépasser la mesure ; cette expression française garde la portée morale de l’avertissement.
- source_word: ἐν πάσῃ σαρκί
  choice: envers personne
  rationale: Dans ce contexte sapientiel, σάρξ désigne les êtres humains en général. « Envers personne » communique naturellement le sens, tandis qu’une note conserve l’image littérale de la chair.
- source_word: ἄνευ κρίσεως
  choice: sans jugement
  rationale: κρίσις peut désigner le jugement, le discernement ou la décision réfléchie. « Sans jugement » maintient cette amplitude sémantique.
- source_word: μὴ ποιήσῃς μηδέν
  choice: ne fais rien
  rationale: Cette interdiction concise restitue naturellement la négation emphatique grecque.
theological_decisions:
- issue: Sens de σάρξ dans un contexte anthropologique sapientiel
  choice: personne
  alternative: chair
  rationale: Ici, σάρξ renvoie aux humains en général plutôt qu’à une catégorie théologique particulière. Le texte principal privilégie un français immédiatement compréhensible, et la note préserve l’expression source ainsi que sa possible évocation de la fragilité humaine.
- issue: Portée de κρίσις
  choice: jugement
  alternative: discernement
  rationale: « Jugement » conserve l’ambiguïté entre faculté de discerner, appréciation réfléchie et décision, sans réduire le mot à une seule de ces nuances.
translation_notes:
  register: Français international moderne, sobre et digne. Les impératifs restent fermes, tandis que la dernière phrase conserve la mise en garde contre tout excès et toute action irréfléchie.
