  text: A yoke and a strap will bend the neck[a], and for a wicked servant there are racks and tortures.
translation:
  language: fr
  text: Le joug et la courroie feront plier la nuque ; pour un serviteur malfaisant[a], il y a les chevalets et les tortures.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « esclave ». Le grec οἰκέτης désigne un serviteur de maison ; dans ce contexte de contrainte, il peut aussi évoquer une personne asservie.
    reason: Alternative lexicale et précision historique.
lexical_decisions:
- source_word: ζυγὸς
  choice: joug
  rationale: L’image de la nuque que l’on fait plier impose ici le sens concret de « joug », et non celui de fléau de balance.
- source_word: ἱμὰς
  choice: courroie
  rationale: Le mot désigne une lanière ou courroie de cuir ; « courroie » est naturel en français et convient à l’image d’une contrainte physique.
- source_word: κάμψουσιν
  choice: feront plier
  rationale: Le futur actif exprime l’action de courber ou de faire plier. Cette tournure française conserve la valeur causative suggérée par le contexte.
- source_word: τράχηλον
  choice: la nuque
  rationale: Dans l’image du joug, « nuque » est plus idiomatique et concrète que « cou », tout en rendant fidèlement la partie du corps visée.
- source_word: οἰκέτῃ
  choice: esclave
  rationale: Le terme peut désigner un serviteur de maison, mais le contexte de contrainte et de torture met nettement en relief la condition servile ; « esclave » évite de l’adoucir.
- source_word: κακούργῳ
  choice: malfaisant
  rationale: L’adjectif qualifie moralement celui qui fait le mal sans limiter le sens à une condamnation pénale, comme le ferait « criminel ».
- source_word: στρέβλαι
  choice: chevalets
  rationale: Le pluriel désigne des appareils de torsion employés pour torturer. « Chevalets » offre un équivalent concret et concis en français.
- source_word: βάσανοι
  choice: tortures
  rationale: Le terme évoque ici des tourments physiques infligés comme épreuve ou châtiment ; « tortures » en conserve pleinement la dureté.
theological_decisions:
- issue: Désignation de la condition servile dans un contexte sapientiel
  choice: esclave
  alternative: serviteur domestique
  rationale: Bien que οἰκέτης puisse désigner un serviteur attaché à une maison, les moyens coercitifs mentionnés dans le verset rendent sa condition asservie saillante. « Esclave » préserve cette réalité sociale sans introduire une lecture confessionnelle.
translation_notes:
  register: Français moderne, sobre et proverbial. Le parallélisme est conservé au moyen du point-virgule, et la seconde proposition demeure nominale comme en grec. Le vocabulaire ne cherche pas à atténuer la violence du texte.
