  text: Discipline your son[a], lest you be put to shame; but if you play with him, he will humiliate you.
translation:
  language: fr
  text: Corrige ton fils[a], de peur d’être couvert de honte ; mais si tu joues avec lui, il t’humiliera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Prends soin d’un enfant, et il te stupéfiera ; joue avec lui, et il t’attristera. » Le témoin hébreu lit plutôt : « Corrige ton fils… il t’humiliera. »'
    reason: alternative_reading
lexical_decisions:
- source_word: יסר
  choice: Corrige
  rationale: Le verbe hébreu désigne une correction éducative, souvent assortie de discipline. « Corrige » exprime clairement l’action parentale sans la réduire à un simple enseignement verbal.
- source_word: בנך
  choice: ton fils
  rationale: L’hébreu porte explicitement le masculin singulier ; la traduction le conserve.
- source_word: לבל תבוש
  choice: de peur d’être couvert de honte
  rationale: La tournure exprime la prévention d’une honte publique ou sociale. « Être couvert de honte » restitue cette dimension plus nettement que le seul sentiment intérieur d’avoir honte.
- source_word: תשחק עמו
  choice: tu joues avec lui
  rationale: Le sens concret du verbe שחק est « jouer » ou « rire ». Le parallèle grec confirme « jouer avec lui » ; le texte peut suggérer une familiarité excessive, mais cette interprétation n’est pas introduite dans le corps du verset.
- source_word: יכלימך
  choice: il t’humiliera
  rationale: Le verbe כלם signifie faire honte, humilier. « Il t’humiliera » garde la force active de la conséquence et évite une répétition trop plate avec la première proposition.
theological_decisions:
- issue: Priorité de l’hébreu lorsque le parallèle grec présente une lecture différente
  choice: Traduire le témoin hébreu conservé et signaler la lecture grecque en note.
  alternative: 'Suivre le grec : « Prends soin d’un enfant, et il te stupéfiera ; joue avec lui, et il t’attristera. »'
  rationale: Le texte hébreu est ici attesté avec une confiance élevée et forme un avertissement cohérent sur la correction du fils et la honte qui peut en résulter. Le grec confirme l’idée de jouer avec l’enfant, mais diffère pour le premier verbe et la conséquence finale ; cette tension textuelle est conservée dans la note.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement correspond aux formes hébraïques singulières et au style proverbial. Le point-virgule maintient le parallélisme des deux propositions.
