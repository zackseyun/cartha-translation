  text: So it is with one who has wealth and does not enjoy it[a].
translation:
  language: fr
  text: Il en va de même de celui qui possède des richesses sans en profiter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec développe cette pensée par une image frappante : « regardant de ses yeux et gémissant, comme un eunuque qui enlace une vierge et gémit ». Cette lecture parallèle illustre l’idée de posséder des richesses sans pouvoir en jouir.'
    reason: Lecture parallèle plus développée dans le grec.
lexical_decisions:
- source_word: כן
  choice: Il en va de même de
  rationale: Introduit une comparaison avec le contexte précédent et conserve la force proverbiale de l’hébreu dans un français naturel.
- source_word: מי
  choice: celui qui
  rationale: Rend l’expression relative indéfinie sans ajouter de précision absente de l’hébreu.
- source_word: יש לו
  choice: possède
  rationale: Exprime naturellement l’idiome hébreu de possession et convient bien à l’objet « richesses ».
- source_word: עושר
  choice: des richesses
  rationale: Désigne ici les biens matériels ou la prospérité; le pluriel collectif est idiomatique en français.
- source_word: ואין נהנה ממנו
  choice: sans en profiter
  rationale: נהנה peut exprimer le fait de jouir de quelque chose ou d’en tirer avantage. « En profiter » préserve ces deux nuances sans donner au verbe un sens exclusivement financier.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et proverbial. « Il en va de même » marque clairement le lien analogique avec le contexte; « sans en profiter » garde ouverte la nuance entre jouissance et bénéfice.
