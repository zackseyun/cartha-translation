  text: If you have a servant, let him be like yourself, because you acquired him with blood; if you have a servant, lead him as yourself, because you need him as your own life.
translation:
  language: fr
  text: Si tu as un esclave domestique, qu’il soit comme toi, car tu l’as acquis au prix du sang. Si tu as un esclave domestique, traite-le comme toi-même, car tu as besoin de lui comme de ta propre vie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκέτης
  choice: serviteur
  rationale: Désigne un domestique ou un membre subordonné de la maisonnée. « Serviteur » reste naturel en français biblique moderne sans atténuer entièrement son statut, tandis que « esclave » serait ici plus spécifique que le terme grec.
- source_word: ἐν αἵματι
  choice: au prix du sang
  rationale: Conserve l’image forte et ambiguë du grec, qui peut évoquer une acquisition coûteuse au péril de la vie, sans préciser ce que le texte ne précise pas.
- source_word: ἄγε
  choice: conduis-le
  rationale: Rend directement l’impératif de ἄγω et préserve son caractère inhabituel plutôt que de l’interpréter comme « traite-le ».
- source_word: ὡς ἡ ψυχή σου
  choice: comme de ta propre vie
  rationale: Dans ce contexte, ψυχή désigne la vie ou la personne elle-même; cette formulation française exprime la comparaison intensive sans imposer le sens plus étroit d’« âme ».
- source_word: ἐπιδέησις
  choice: tu as besoin de
  rationale: Le verbe exprime le besoin ou la dépendance envers quelqu’un et appelle ici une formulation française simple et directe.
theological_decisions:
- issue: Statut de l’οἰκέτης
  choice: serviteur
  alternative: esclave
  rationale: Le grec souligne l’appartenance à la maisonnée et la dépendance sans employer le terme courant δοῦλος. Le choix évite de résoudre artificiellement la portée sociale exacte.
- issue: Sens de « acquis au prix du sang »
  choice: maintien de la métaphore
  alternative: acquis au prix de ta vie
  rationale: Le texte grec laisse l’expression ouverte; la traduction conserve donc sa tension plutôt que d’identifier le sang à celui du maître ou du serviteur.
- issue: Parallèle moral « comme toi-même »
  choice: conduis-le comme toi-même
  alternative: traite-le comme toi-même
  rationale: La formulation retenue suit le verbe grec ἄγω, même si elle est moins idiomatique, afin de ne pas substituer une exhortation morale plus explicite à l’image du texte.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme des deux propositions est conservé, ainsi que les images fortes et les ambiguïtés du grec. Aucun marqueur de note n’est requis.
