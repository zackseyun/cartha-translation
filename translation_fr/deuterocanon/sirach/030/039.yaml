  verdict: revise
  source_fidelity: Le sens général est bien rendu et l’ambiguïté de « dans/par le sang » est conservée. Toutefois, « conduis-le comme toi-même » est un calque peu intelligible en français et ne communique pas correctement l’emploi idiomatique de ἄγω dans cette exhortation. οἰκέτης désigne ici une personne asservie de la maisonnée; « serviteur » seul risque d’effacer ce statut, confirmé par « acquis ».
  naturalness: Le texte est fluide sauf « conduis-le comme toi-même », formulation non idiomatique et sémantiquement ambiguë en français moderne. « Traite-le comme toi-même » exprime naturellement le parallèle sans ajouter de développement doctrinal.
  terminology: « Esclave domestique » rend la valeur de οἰκέτης, distincte mais non moins réelle que celle de δοῦλος. « Au prix du sang » préserve l’image dense de ἐν αἵματι sans décider de qui verse le sang. « Ta propre vie » rend ψυχή dans son sens contextuel de vie/personne.
  issues:
