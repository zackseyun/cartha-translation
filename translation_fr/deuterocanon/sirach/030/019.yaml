  source_fidelity: Le texte principal rend correctement la question rhétorique de valeur/utilité et la description des idoles incapables de manger ou de sentir. La note doit toutefois traduire plus littéralement le participe grec ἐκδιωκόμενος (« chassé », « poursuivi »), plutôt que « rejeté », qui en restreint et interprète le sens.
  naturalness: « Quelle valeur y a-t-il dans les idoles des nations ? » est une formulation française moderne et idiomatique qui exprime plus nettement la tournure évaluative que « Quelle valeur ont les idoles... ? ». La coordination « ne mangent ni ne sentent » est naturelle.
  terminology: « Idoles des nations » respecte l’hébreu et conserve un registre sobre. « Le Seigneur » convient dans la note grecque. « Chasse » restitue sans surcharge doctrinale le mouvement exprimé par ἐκδιωκόμενος.
