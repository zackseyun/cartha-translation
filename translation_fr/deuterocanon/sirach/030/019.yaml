  yaml_path: translation/deuterocanon/sirach/030/019.yaml
  text: What value is there in the idols of the nations[a], which neither eat nor smell?
translation:
  language: fr
  text: Quelle valeur y a-t-il dans les idoles des nations[a], qui ne mangent ni ne sentent ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec ajoute : « Ainsi en est-il de celui que le Seigneur chasse. »'
    reason: alternative_reading
lexical_decisions:
- source_word: מה יעריכו
  choice: Quelle valeur ont
  rationale: L’expression hébraïque pose une question rhétorique sur la valeur ou l’utilité. Cette formulation est naturelle en français et concorde avec le grec τί συμφέρει, sans réduire le sens à une estimation matérielle.
- source_word: לאלילי הגוים
  choice: les idoles des nations
  rationale: La construction désigne les idoles appartenant aux nations. « Nations » reste proche de l’hébreu et évite la coloration confessionnelle que pourrait avoir « païens ».
- source_word: אשר לא יאכלון
  choice: qui ne mangent
  rationale: Traduction directe de la proposition relative décrivant l’impuissance des idoles.
- source_word: ולא יריחון
  choice: ni ne sentent
  rationale: Le verbe signifie percevoir une odeur. « Sentir » est ici le verbe français naturel, et la coordination « ne… ni ne… » restitue les deux négations.
theological_decisions:
- issue: Inclusion de la suite grecque absente du témoin hébreu
  choice: Ne traduire dans le texte principal que la phrase attestée en hébreu
  alternative: 'Ajouter au texte principal : « Ainsi en est-il de celui que le Seigneur rejette. »'
  rationale: Le texte hébreu étant conservé avec une confiance élevée, il sert de base au texte principal. La suite propre au grec est néanmoins signalée en note afin de préserver cette variante ancienne sans la confondre avec le texte hébreu.
translation_notes:
  register: Français international moderne, clair et digne. La question rhétorique et la personnification des idoles sont conservées. « Ne sentent » signifie ici qu’elles ne perçoivent aucune odeur.
