translation:
  language: fr
  text: Discipline ton fils et alourdis son joug[a], de peur que, dans sa folie, il ne t’engloutisse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec lit : « Discipline ton fils et travaille à le former, de peur qu’il ne trébuche à cause de ta honte. » L’hébreu lit : « de peur que, dans sa folie, il ne t’engloutisse. »'
    reason: textual_variant
lexical_decisions:
- source_word: יסר
  choice: Corrige
  rationale: Le verbe יסר désigne une correction qui forme et discipline. « Corrige » est naturel en français dans le cadre de l’éducation d’un fils, tout en conservant la force corrective du terme hébreu.
- source_word: והכבד עולו
  choice: rends son joug pesant
  rationale: L’hébreu dit littéralement de rendre lourd le joug du fils. Cette formulation conserve l’image concrète d’une discipline exigeante, sans la réduire à une simple charge abstraite.
- source_word: עולו
  choice: son joug
  rationale: עול signifie proprement « joug ». Le maintien de cette métaphore respecte l’image hébraïque de la contrainte et de la discipline imposées.
- source_word: פן
  choice: de peur que… ne
  rationale: פן introduit le résultat indésirable que l’avertissement cherche à prévenir. La tournure française « de peur que… ne » convient au registre proverbial et n’exprime pas ici une négation autonome.
- source_word: באולתו
  choice: dans sa folie
  rationale: אולת désigne la folie ou la sottise morale. « Dans sa folie » suit de près la construction hébraïque et laisse ouvertes ses nuances circonstancielle et causale.
- source_word: יבלע בך
  choice: il ne t’engloutisse
  rationale: בלע signifie littéralement « avaler, engloutir ». « T’engloutisse » préserve l’image vive de l’hébreu, ici employée au sens métaphorique de causer la ruine du parent.
theological_decisions:
- issue: Choix entre l’hébreu et la forme grecque divergente
  choice: 'Suivre l’hébreu conservé : « de peur que, dans sa folie, il ne t’engloutisse »'
  alternative: 'Suivre le grec : « de peur qu’il ne trébuche à cause de ta honte »'
  rationale: Le témoin hébreu est ici conservé avec une confiance élevée et constitue la source principale. La divergence substantielle du grec est néanmoins signalée en note afin de ne pas masquer l’histoire textuelle.
translation_notes:
  register: Français moderne, digne et proverbial. Le tutoiement reflète l’adresse directe au parent. L’image du « joug » et celle d’« engloutir » sont volontairement conservées malgré leur caractère marqué, car elles appartiennent au relief poétique de l’hébreu.
