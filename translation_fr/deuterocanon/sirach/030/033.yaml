  text: Fodder and a rod and burdens are for a donkey[c][b][a]; bread and discipline and work are for a servant.
translation:
  language: fr
  text: Le fourrage, le bâton et les charges sont pour l’âne ; le pain, la discipline[a] et le travail sont pour l’esclave domestique[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut aussi signifier « formation », « éducation » ou « correction ».
    reason: lexical_alternative
  - marker: b
    text: Ou « serviteur domestique » ou « serviteur de maison » ; le terme grec désigne souvent une personne de condition servile attachée à une maison.
    reason: alternative_reading
lexical_decisions:
- source_word: χορτάσματα
  choice: fourrage
  rationale: Le terme désigne la nourriture donnée aux animaux ; « fourrage » conserve l’image concrète et convient naturellement à l’âne.
- source_word: ῥάβδος
  choice: bâton
  rationale: Dans ce contexte, il s’agit d’un instrument servant à diriger ou à corriger l’animal. « Bâton » est courant et moins archaïque que « verge ».
- source_word: φορτία
  choice: charges
  rationale: Le mot désigne ce que l’on fait porter à une bête de somme. « Charges » rend directement cette idée.
- source_word: ὄνῳ
  choice: âne
  rationale: Équivalent français moderne et précis du nom de l’animal.
- source_word: ἄρτος
  choice: pain
  rationale: Le grec nomme précisément le pain, qui représente ici la subsistance élémentaire sans qu’il soit nécessaire de généraliser en « nourriture ».
- source_word: παιδεία
  choice: discipline
  rationale: Le mot couvre l’éducation, la formation et la correction. Dans ce parallèle évoquant une condition subordonnée et un travail imposé, « discipline » exprime bien sa portée tout en maintenant sa relative amplitude.
- source_word: ἔργον
  choice: travail
  rationale: Traduction directe et naturelle, adaptée à la brièveté proverbiale du verset.
- source_word: οἰκέτῃ
  choice: esclave domestique
  rationale: Le terme désigne typiquement une personne attachée au service d’une maison et peut impliquer un statut servile. « Esclave domestique » rend à la fois le cadre du foyer et la réalité sociale, sans l’atténuer en simple « serviteur ».
theological_decisions:
- issue: Portée sociale de οἰκέτης dans le parallèle proverbial
  choice: esclave domestique
  alternative: serviteur domestique ; serviteur de maison
  rationale: Le contexte associe subsistance, discipline et travail imposé, ce qui met en relief la condition subordonnée et probablement servile de l’οἰκέτης. La traduction retenue explicite cette réalité tout en signalant en note la possibilité lexicale plus large.
- issue: Amplitude de παιδεία
  choice: discipline
  alternative: formation ; éducation ; correction
  rationale: Le contexte favorise la notion de discipline, mais le grec peut aussi évoquer la formation ou la correction. La note préserve cette ambiguïté sans imposer une seule nuance.
translation_notes:
  register: Style proverbial, bref et équilibré, en français moderne et digne. Les articles et la copule sont ajoutés pour obtenir une phrase française naturelle, tandis que le parallélisme du grec est conservé.
