  text: An unbroken horse turns out stubborn[b][a], and a son left unchecked turns out headstrong.
translation:
  language: fr
  text: Un cheval indompté devient rétif, et un fils laissé à lui-même devient présomptueux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sens du mot grec traduit par « présomptueux » est incertain; il peut aussi évoquer quelqu’un d’insolent ou d’entêté.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵππος
  choice: cheval
  rationale: Équivalent français ordinaire et précis, sans la coloration noble de « coursier ».
- source_word: ἀδάμαστος
  choice: indompté
  rationale: Désigne un cheval qui n’a pas été dompté ou soumis au dressage; le terme conserve naturellement l’image équestre.
- source_word: ἀποβαίνει
  choice: devient
  rationale: Dans ce proverbe, le verbe indique l’état auquel aboutit le cheval; « devient » rend sobrement ce résultat.
- source_word: σκληρός
  choice: rétif
  rationale: Appliqué à un cheval, « rétif » exprime une résistance obstinée plutôt qu’une dureté physique et prolonge l’image du dressage.
- source_word: υἱός
  choice: fils
  rationale: Le grec emploie explicitement le masculin singulier; « fils » en préserve la précision.
- source_word: ἀνειμένος
  choice: laissé sans frein
  rationale: Le participe évoque ce qui est relâché ou non retenu. Cette formulation conserve le sens éducatif tout en faisant écho, en français, à l’image du cheval.
- source_word: ἐκβαίνει
  choice: devient
  rationale: Comme ἀποβαίνει dans le premier membre, le verbe exprime le résultat et maintient ici le parallélisme.
- source_word: προαλής
  choice: présomptueux
  rationale: Cet adjectif rare semble décrire une disposition portée à aller de l’avant avec une assurance excessive. « Présomptueux » reste prudent et laisse la note signaler les autres nuances possibles.
theological_decisions: []
translation_notes:
  register: Français moderne, proverbial et digne. Le parallélisme des deux propositions est conservé par la répétition de « devient ». « Rétif » est un terme français courant dans le contexte d’un cheval, tandis que « laissé sans frein » relie discrètement les deux images sans ajouter une doctrine particulière de l’éducation.
