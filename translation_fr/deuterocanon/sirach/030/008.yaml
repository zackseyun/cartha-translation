  source_fidelity: Le parallélisme et les valeurs résultatives de ἀποβαίνει / ἐκβαίνει sont bien rendus par « devient ». « Cheval indompté » et « rétif » correspondent bien à l'image et à σκληρός. Pour ἀνειμένος, « laissé sans frein » introduit en français une image équestre appliquée au fils qui n'est pas explicitement dans ce membre grec et sonne moins directement que le sens de relâchement ou d'abandon. « Laissé à lui-même » rend plus fidèlement et plus naturellement ce participe. « Présomptueux » est une possibilité défendable pour le rare προαλής, à condition de signaler l'incertitude lexicale.
