  text: Better is a poor man who is alive in himself than a rich man stricken in his flesh[a].
translation:
  language: fr
  text: Mieux vaut un pauvre qui est bien vivant qu’un riche atteint dans sa chair[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec dit: «Mieux vaut un pauvre en bonne santé et de robuste constitution qu’un riche frappé dans son corps.» Le témoin hébreu est plus bref et dit littéralement «vivant en lui-même» et «atteint dans sa chair».'
    reason: alternative_reading
lexical_decisions:
- source_word: טוב
  choice: Mieux vaut
  rationale: Le contexte proverbial et le parallèle grec indiquent une comparaison; cette tournure est naturelle en français.
- source_word: מסכן
  choice: un pauvre
  rationale: Le nom désigne une personne pauvre ou nécessiteuse; le masculin singulier représentatif est conservé.
- source_word: וחי בעצמו
  choice: qui est bien vivant
  rationale: Cette formulation française naturelle garde l’idée hébraïque d’une vie présente dans la personne elle-même, sans introduire la solitude que suggérerait «par lui-même». Le grec explicite une bonne santé et une constitution vigoureuse.
- source_word: מעשיר
  choice: qu’un riche
  rationale: Le français exige d’expliciter la relation comparative; le contraste singulier avec «un pauvre» est maintenu.
- source_word: ונגע
  choice: atteint
  rationale: Le terme exprime une affection ou une atteinte subie; «atteint» convient au complément corporel sans préciser indûment la nature du mal.
- source_word: בבשרו
  choice: dans sa chair
  rationale: «Chair» conserve l’expression concrète de l’hébreu plutôt que de la généraliser en «corps» ou en «santé».
theological_decisions:
- issue: Formulation anthropologique du contraste corporel
  choice: dans sa chair
  alternative: dans son corps; en mauvaise santé
  rationale: Le proverbe oppose pauvreté et condition corporelle. La traduction conserve la concrétude de l’hébreu et n’importe pas dans le texte principal l’explicitation sanitaire du grec.
- issue: Sens de וחי בעצמו
  choice: qui est bien vivant
  alternative: qui vit en lui-même; qui est sain et vigoureux
  rationale: «Bien vivant» rend idiomatiquement l’hébreu tout en préservant sa brièveté. «Sain et vigoureux» suivrait plus directement le parallèle grec, mais développerait le texte hébreu.
- issue: Masculin singulier du proverbe
  choice: un pauvre… un riche
  alternative: une personne pauvre… une personne riche
  rationale: Le masculin singulier représentatif du texte source est maintenu sans ajouter de distinction doctrinale.
translation_notes:
  register: Français international moderne, proverbial, concis et digne. «Bien vivant» évite le calque peu naturel «vivant en lui-même», tandis que la note conserve la formulation littérale et signale le développement du parallèle grec.
