  text: Before enemies he left behind an avenger[a], and for friends one who repays kindness.
translation:
  language: fr
  text: Face à ses ennemis, il a laissé derrière lui un vengeur[a], et pour ses amis, quelqu’un qui répond à leurs bienfaits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un justicier » ou « un défenseur » ; le terme grec peut désigner quelqu’un qui fait justice ou exerce la vengeance pour le compte d’un autre.
    reason: 'Alternative lexicale : ἔκδικον peut évoquer aussi bien la défense et la réparation que la vengeance.'
lexical_decisions:
- source_word: ἐναντίον ἐχθρῶν
  choice: Face à ses ennemis
  rationale: « Face à » exprime naturellement la confrontation ou la présence hostile indiquée par ἐναντίον, tandis que « ses ennemis » convient au contexte où le fils poursuit la cause de son père.
- source_word: κατέλιπεν
  choice: il a laissé derrière lui
  rationale: Le verbe évoque ce qu’un homme laisse après lui, ici un fils survivant qui prolonge son action.
- source_word: ἔκδικον
  choice: un vengeur
  rationale: Le terme désigne quelqu’un qui fait justice ou exerce la vengeance pour autrui. « Vengeur » conserve la force potentiellement punitive du grec sans l’atténuer.
- source_word: τοῖς φίλοις
  choice: pour ses amis
  rationale: Le datif indique les personnes au bénéfice desquelles le fils agit et forme le pendant naturel de « face à ses ennemis ».
- source_word: ἀνταποδιδόντα χάριν
  choice: quelqu’un qui leur rend leurs bienfaits
  rationale: Le participe exprime une réponse réciproque, et χάριν désigne ici les faveurs ou bienfaits reçus. Cette formulation française rend explicitement l’idée de réciprocité sans lui donner un sens théologique étranger au contexte.
theological_decisions:
- issue: Valeur morale de ἔκδικον dans le cadre de l’honneur familial
  choice: un vengeur
  alternative: un défenseur ; un justicier
  rationale: Le grec présente le fils comme celui qui répond aux ennemis au nom de son père, sans préciser si son action relève seulement de la défense, de la réparation judiciaire ou de la vengeance. Le texte principal préserve donc la nuance forte, et la note signale l’étendue sémantique du terme.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme entre ennemis et amis est conservé, ainsi que la tension du terme « vengeur ». Le pronom possessif « ses » est fourni par le contexte familial immédiat.
