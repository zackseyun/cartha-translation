  text: As long as you still live and breath is in you[a], do not give yourself over to any flesh.
translation:
  language: fr
  text: Tant que tu es encore en vie et que le souffle est en toi, ne te livre à aucun être humain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie « chair » (c’est-à-dire un être humain mortel) et une expression difficile, littéralement proche de « ne te change pas toi-même à aucune chair ». Le sens peut être « ne te livre à aucun être humain » ou « ne te soumets à personne ».
    reason: Ambiguïté de ἀλλάσσω dans cette construction et emploi de σάρξ au sens d’être humain mortel.
lexical_decisions:
- source_word: ἕως ἔτι ζῇς
  choice: Tant que tu es encore en vie
  rationale: Cette formulation rend la durée exprimée par ἕως et conserve l’insistance de ἔτι (« encore ») dans un français naturel.
- source_word: πνοὴ ἐν σοί
  choice: le souffle est en toi
  rationale: La traduction garde l’image concrète du souffle comme signe de vie et suit de près la construction grecque.
- source_word: μὴ ἀλλάξῃς σεαυτόν
  choice: ne te livre
  rationale: Avec le pronom réfléchi et le datif qui suit, ἀλλάσσω semble désigner ici le fait de remettre sa personne au pouvoir ou au jugement d’autrui. « Ne te livre » reste intelligible sans réduire le verbe au simple sens de « changer ».
- source_word: πάσῃ σαρκί
  choice: à aucun être de chair
  rationale: Le singulier avec πᾶς a une valeur distributive. « Être de chair » conserve le terme σάρξ tout en indiquant naturellement qu’il s’agit d’un humain mortel.
theological_decisions:
- issue: Sens de σάρξ dans ce contexte sapientiel non paulinien
  choice: être de chair
  alternative: être humain ; personne ; mortel
  rationale: Le terme désigne vraisemblablement ici l’humanité dans sa condition corporelle et mortelle, non une doctrine technique de la nature pécheresse. La traduction préserve l’image de la chair sans lui imposer une interprétation confessionnelle.
- issue: Portée de ἀλλάξῃς avec σεαυτόν et le datif
  choice: ne te livre à
  alternative: ne t’échange pas contre ; ne te soumets pas à ; ne te remets pas à
  rationale: Le grec demeure inhabituel et pourrait évoquer un changement ou un échange. Dans la construction présente, l’idée de livrer sa personne à autrui fournit un sens cohérent, mais la note signale l’ambiguïté lexicale.
translation_notes:
  register: Tutoiement sapientiel direct. Français moderne, sobre et digne. L’expression « être de chair » conserve l’anthropologie concrète du grec tout en restant compréhensible ; la note documente la formulation littérale et les principales lectures possibles.
