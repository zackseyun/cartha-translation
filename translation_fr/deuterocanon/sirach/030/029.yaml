  source_fidelity: La structure temporelle (« Tant que tu es encore en vie et que le souffle est en toi ») rend fidèlement ἕως ἔτι ζῇς καὶ πνοὴ ἐν σοί. « Ne te livre à » est une interprétation défendable de μὴ ἀλλάξῃς σεαυτόν avec le datif, mais la tournure grecque reste inhabituelle et ne permet pas d’en faire une équivalence certaine. Πάσῃ σαρκί désigne vraisemblablement tout être humain/mortel; la note doit conserver le mot grec « chair » et l’incertitude du verbe.
  naturalness: « Être de chair » est compréhensible, mais peu naturel dans le français moderne international et risque d’évoquer une opposition conceptuelle chair/esprit absente du contexte. « Aucun être humain » est idiomatique dans le texte courant; la note préserve l’expression grecque plus concrète.
  terminology: Le tutoiement et le registre sapientiel sont appropriés. « Être humain » rend ici la valeur anthropologique de σάρξ sans importer un sens paulinien de « chair ». La note indique explicitement que le grec emploie σάρξ (« chair »), terme qui met en relief la condition humaine mortelle.
