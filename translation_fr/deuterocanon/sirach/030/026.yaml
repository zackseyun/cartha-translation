  text: For anger has killed many[b][a], and there is no benefit in wrath.
translation:
  language: fr
  text: Car l’irritation[a] en a tué beaucoup, et la colère ne procure aucun avantage.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « irritation » est de forme et de sens quelque peu incertains. Le contexte et son parallélisme avec « colère » orientent vers une émotion telle que l’irritation, le ressentiment ou la colère.
    reason: lexical_alternative
  - marker: b
    text: 'Le parallèle grec fourni porte une autre maxime : « Considérez que je n’ai pas peiné pour moi seul, mais pour tous ceux qui recherchent l’instruction. » Cela indique probablement un décalage dans la numérotation des versets ou une tradition textuelle divergente. La traduction principale suit le témoin hébreu conservé.'
    reason: textual_variant
lexical_decisions:
- source_word: כי
  choice: Car
  rationale: Introduit naturellement en français la raison qui soutient l’exhortation environnante.
- source_word: רבים
  choice: beaucoup
  rationale: 'Rend l’idée quantitative générale dans une formulation proverbiale naturelle : « en a tué beaucoup ».'
- source_word: הרג
  choice: a tué
  rationale: Exprime directement l’action de tuer ; le passé composé convient en français à un constat proverbial fondé sur l’expérience.
- source_word: דין
  choice: l’irritation
  rationale: La forme et le sens précis sont incertains. Dans le parallélisme avec קצפון, le mot paraît désigner un état de colère ; « irritation » conserve ce lien sans reproduire exactement le second terme.
- source_word: ואין תעלה
  choice: ne procure aucun avantage
  rationale: Rend l’absence de profit ou de bénéfice dans un français actuel, tout en gardant la portée sapientielle.
- source_word: בקצפון
  choice: la colère
  rationale: קצפון désigne la colère ou le courroux. La tournure française reformule légèrement la construction prépositionnelle pour exprimer naturellement qu’aucun avantage ne vient de la colère.
theological_decisions:
- issue: Divergence majeure entre le témoin hébreu et le parallèle grec fourni
  choice: Suivre dans le texte principal le témoin hébreu conservé.
  alternative: 'Traduire le grec : « Considérez que je n’ai pas peiné pour moi seul, mais pour tous ceux qui recherchent l’instruction. »'
  rationale: Le texte grec fourni ne correspond pas au contenu de l’hébreu et paraît relever d’un décalage de numérotation ou d’une tradition textuelle divergente. Puisque l’hébreu est ici conservé et forme une maxime cohérente, il demeure la base de la traduction ; la divergence est signalée en note.
translation_notes:
  register: Français international moderne, concis et digne, avec une cadence proverbiale. « Irritation » et « colère » maintiennent le parallélisme sans effacer l’incertitude du premier terme hébreu.
