  text: Do not laugh with him[a], lest you share his pain, and in the end you will gnash your teeth.
translation:
  language: fr
  text: Ne ris pas avec lui[a], de peur que tu ne souffres avec lui ; à la fin, tu grinceras des dents.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ne te joins pas à ses rires ». Le verbe grec souligne que l’on participe aux rires de l’autre.
    reason: lexical_alternative
lexical_decisions:
- source_word: συγγελάσῃς
  choice: ris avec lui
  rationale: Le verbe composé exprime le fait de rire avec quelqu’un, de s’associer à ses rires. « Ris avec lui » est direct, naturel et conserve cette idée de participation.
- source_word: συνοδυνηθῇς
  choice: avoir à souffrir avec lui
  rationale: Le verbe signifie éprouver ensemble douleur ou affliction. Cette formulation française rend à la fois la souffrance partagée et la conséquence redoutée.
- source_word: ἐπʼ ἐσχάτῳ
  choice: à la fin
  rationale: L’expression désigne l’issue finale ou le résultat ultime de la conduite évoquée.
- source_word: γομφιάσεις τοὺς ὀδόντας σου
  choice: tu grinceras des dents
  rationale: L’expression décrit le grincement des dents sous l’effet de la douleur, du dépit ou du regret ; la tournure française correspondante est naturelle et expressive.
