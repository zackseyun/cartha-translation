  text: For idleness has taught much evil[a].
translation:
  language: fr
  text: Car l’oisiveté a enseigné beaucoup de mal[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un grand mal » ; l’expression grecque peut souligner soit la quantité du mal, soit sa gravité.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὴν
  choice: beaucoup de
  rationale: L’adjectif féminin singulier qualifie κακίαν. « Beaucoup de mal » exprime naturellement en français l’étendue ou la quantité, tout en laissant en note l’autre nuance possible, celle de la gravité.
- source_word: γὰρ
  choice: car
  rationale: « Car » conserve le lien explicatif avec le contexte précédent sans transformer la proposition en affirmation indépendante.
- source_word: κακίαν
  choice: mal
  rationale: Dans ce contexte, κακία désigne largement ce qui est mauvais sur le plan moral. « Mal » est courant, ample et ne réduit pas le terme à un vice particulier.
- source_word: ἐδίδαξεν
  choice: enseigne
  rationale: Le présent français convient au caractère proverbial de la maxime et conserve l’image grecque de l’enseignement. Une traduction passée, « a enseigné », serait plus formelle mais moins naturelle comme vérité générale autonome.
- source_word: ἡ ἀργία
  choice: l’oisiveté
  rationale: « Oisiveté » rend l’état d’inactivité impliqué par ἀργία et reste plus précis que « paresse », qui met davantage l’accent sur une disposition morale.
