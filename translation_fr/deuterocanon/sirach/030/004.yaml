  yaml_path: translation/deuterocanon/sirach/030/004.yaml
  text: His father has died[a], yet it is as though he had not died, for he has left behind one like himself after him.
translation:
  language: fr
  text: Son père est mort, mais c’est comme s’il n’était pas mort, car il a laissé après lui quelqu’un qui lui ressemble[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il a laissé après lui un semblable à lui ». Dans le contexte, il s’agit d’un descendant qui lui survit, vraisemblablement d’un fils.'
    reason: Préciser la construction grecque et le référent implicite sans introduire « fils » dans le texte principal.
lexical_decisions:
- source_word: ἐτελεύτησεν
  choice: est mort
  rationale: Le verbe signifie ici arriver au terme de sa vie. « Est mort » exprime directement et naturellement l’événement accompli, sans recourir à un euphémisme.
- source_word: ὁ πατήρ
  choice: son père
  rationale: Le génitif αὐτοῦ donne au groupe nominal un sens possessif ; « son père » est la formulation française idiomatique.
- source_word: ὡς οὐκ ἀπέθανεν
  choice: c’est comme s’il n’était pas mort
  rationale: ὡς introduit une comparaison et non la négation littérale de la mort. L’imparfait après « comme si » est naturel en français pour une situation irréelle.
- source_word: ὅμοιον αὐτῷ
  choice: quelqu’un qui lui ressemble
  rationale: L’adjectif substantivé désigne ici une personne semblable au père, sans nommer explicitement un fils. Cette formulation est claire et préserve cette retenue du grec.
- source_word: κατέλιπεν
  choice: a laissé après lui
  rationale: Le verbe évoque une personne demeurée après la mort du père. Avec μετ’ αὐτόν, « a laissé après lui » conserve à la fois l’idée de survivance et la succession temporelle.
- source_word: μετ’ αὐτόν
  choice: après lui
  rationale: L’expression marque que cette personne demeure à la suite du père ; la traduction reste concise sans ajouter l’idée plus précise de succession officielle.
theological_decisions:
- issue: Faut-il préciser que la personne laissée après le père est un fils ?
  choice: quelqu’un qui lui ressemble
  alternative: un fils qui lui ressemble
  rationale: Le contexte concerne la descendance, vraisemblablement un fils, mais ce membre de phrase ne contient aucun nom correspondant à « fils ». Le texte principal conserve donc la formulation implicite du grec, tandis que la note indique le contexte.
translation_notes:
  register: Français international moderne, simple et digne. Le passé composé convient au constat narratif, et « c’est comme si » restitue naturellement la comparaison irréelle. La répétition de « mort » est conservée parce qu’elle structure l’antithèse du grec.
