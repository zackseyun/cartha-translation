  text: He who disciplines his son will profit by him, and among his acquaintances he will boast because of him.
translation:
  language: fr
  text: Celui qui discipline son fils en tirera profit, et il se vantera de lui parmi ses connaissances.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ παιδεύων
  choice: Celui qui discipline
  rationale: Le verbe παιδεύω englobe l’éducation, la formation et la correction. « Discipline » conserve ici cette portée éducative et corrective sans se limiter au châtiment.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: son fils
  rationale: Le grec emploie le masculin singulier υἱός; « son fils » en respecte la précision.
- source_word: ὀνήσεται ἐπʼ αὐτῷ
  choice: en tirera profit
  rationale: Le futur moyen ὀνήσεται exprime le bénéfice reçu, tandis que ἐπʼ αὐτῷ en indique la source. Cette tournure est naturelle en français et garde le lien avec le fils.
- source_word: ἀνὰ μέσον γνωρίμων
  choice: parmi ses connaissances
  rationale: γνωρίμων désigne des personnes connues ou des relations, sans impliquer nécessairement l’intimité de l’amitié.
- source_word: καυχήσεται ἐπʼ αὐτῷ
  choice: il se vantera de lui
  rationale: καυχάομαι signifie se vanter ou tirer gloire; avec ἐπʼ αὐτῷ, le fils constitue le motif de cette fierté affichée. « Se vantera de lui » reproduit directement ce sens sans l’atténuer.
theological_decisions:
- issue: Valeur morale du fait de se vanter comme parent
  choice: « il se vantera de lui »
  alternative: « il sera fier de lui »
  rationale: Le texte présente l’honneur social procuré par un fils bien formé sans porter explicitement de jugement moral sur cette vantardise. La traduction conserve donc la force de καυχήσεται au lieu de la rendre plus favorable.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le parallélisme du grec; « connaissances » évite de transformer de simples relations en amis proches.
