  text: Death is better than a life of emptiness[b][a], and eternal rest than unrelenting pain.
translation:
  language: fr
  text: La mort vaut mieux qu’une vie vide[a], et le repos éternel qu’une douleur persistante[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec parallèle porte : « La mort vaut mieux qu’une vie amère. » L’hébreu dit : « une vie vide ».'
    reason: alternative_reading
  - marker: b
    text: 'Le grec parallèle porte : « une maladie persistante », là où l’hébreu évoque une douleur qualifiée de durable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוב למות
  choice: La mort vaut mieux
  rationale: טוב ל־ exprime ici une comparaison proverbiale. Bien que למות soit formellement un infinitif (« mourir »), la tournure nominale est naturelle en français et conserve la force sentencieuse; le grec parallèle emploie aussi le nom « mort ».
- source_word: מחיי שוא
  choice: qu’une vie vide
  rationale: שוא peut évoquer le vide, la vanité, la futilité ou ce qui est sans valeur. « Une vie vide » rend directement l’hébreu dans un français actuel, sans suivre la variante grecque « une vie amère ».
- source_word: ונוחת עולם
  choice: et le repos éternel
  rationale: נוחת désigne le repos, tandis que עולם exprime une durée indéfiniment prolongée ou éternelle. Cette formulation concise préserve le poids du contraste sans préciser davantage la doctrine de l’au-delà.
- source_word: מכאב נאמן
  choice: qu’une douleur qui ne cesse pas
  rationale: כאב signifie « douleur ». נאמן, littéralement « ferme, fidèle, sûr », qualifie ici ce qui demeure ou persiste. La périphrase française exprime clairement cette continuité sans transformer la douleur en maladie.
theological_decisions:
- issue: Divergence entre l’hébreu et le grec dans la première comparaison
  choice: Suivre dans le texte principal l’hébreu « une vie vide »
  alternative: « une vie amère », d’après le grec parallèle
  rationale: Le témoin hébreu conservé est ici la source principale et son degré de confiance est élevé. Le grec confirme la structure comparative, mais sa divergence lexicale est signalée en note.
- issue: Portée de עולם dans cette maxime sapientielle
  choice: « éternel »
  alternative: « perpétuel » ou « pour toujours »
  rationale: « Éternel » rend la durée forte du terme tout en maintenant la tension du texte entre un repos durable et une douleur persistante, sans imposer une construction doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, naturel et digne. La structure brève et équilibrée conserve le caractère proverbial du verset. Les notes rendent transparentes les divergences entre l’hébreu principal et le grec parallèle.
