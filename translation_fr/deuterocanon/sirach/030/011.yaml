  text: Do not give him free rein in his youth, and do not overlook his destructive behavior.
translation:
  language: fr
  text: Ne lui laisse pas toute liberté pendant sa jeunesse[a], et ne ferme pas les yeux sur ses agissements destructeurs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne lui donne pas d’autorité pendant sa jeunesse. » Le verbe hébreu peut signifier accorder le pouvoir ou la maîtrise; le grec porte également « autorité ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ses corruptions »; on peut aussi comprendre « ses actes nuisibles » ou « ses fautes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תמשילהו
  choice: lui laisse pas toute liberté
  rationale: Le hifil de משל peut signifier « faire régner » ou « donner autorité ». Dans ce contexte éducatif, « ne lui laisse pas toute liberté » exprime naturellement l’idée de ne pas accorder au jeune une autonomie sans contrôle; le grec ἐξουσίαν confirme la notion d’autorité ou de latitude.
- source_word: בנעוריו
  choice: pendant sa jeunesse
  rationale: Expression temporelle directe désignant la période de la jeunesse.
- source_word: תשא
  choice: ne ferme pas les yeux sur
  rationale: נשא signifie fondamentalement « porter, supporter » et peut, dans cet emploi, évoquer le fait de tolérer ou de laisser passer. Cette tournure française rend le sens sans introduire la notion théologique plus marquée de pardon.
- source_word: לשחיתותיו
  choice: ses agissements destructeurs
  rationale: שחיתותיו peut désigner ses corruptions, ses actes nuisibles ou ses fautes. « Agissements destructeurs » conserve la force du terme et convient au contexte pratique de l’éducation.
