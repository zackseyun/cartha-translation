  text: Jealousy and anger shorten days[b][a], and anxiety brings old age before its time.
translation:
  language: fr
  text: La jalousie et la colère[a] abrègent la vie, et l’inquiétude fait vieillir avant l’heure.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sens de l’hébreu דין est difficile ici. Il peut signifier « colère » ou, moins probablement, « querelle », « conflit » ou « jugement ».
    reason: lexical_alternative
  - marker: b
    text: Le texte grec parallèle fourni ne correspond pas à ce verset et semble appartenir à un autre passage; la traduction suit donc ici le témoin hébreu.
    reason: textual_variant
lexical_decisions:
- source_word: קנאה
  choice: jalousie
  rationale: Dans ce proverbe de sagesse, le mot désigne une disposition corrosive; « jalousie » est naturel en français et convient mieux ici que le sens positif possible de « zèle ».
- source_word: דין
  choice: colère
  rationale: Le terme est difficile dans ce contexte. Bien qu’il soit couramment lié au jugement, il semble désigner ici une disposition hostile ou querelleuse parallèle à la jalousie; « colère » exprime clairement ce vice tout en laissant les autres possibilités en note.
- source_word: יקצרו ימים
  choice: abrègent la vie
  rationale: Cette formulation française naturelle restitue l’idiome hébreu « raccourcir les jours » et son idée d’une vie écourtée.
- source_word: ובלא עת
  choice: avant l’heure
  rationale: L’expression rend avec concision l’idée d’un vieillissement prématuré, survenant au mauvais moment.
- source_word: תזקין
  choice: fait vieillir
  rationale: 'La tournure causative convient au sens de la proposition: l’inquiétude provoque un vieillissement prématuré.'
- source_word: דאגה
  choice: inquiétude
  rationale: Le mot évoque un souci intérieur persistant; « inquiétude » est courant, précis et adapté au registre sapientiel.
