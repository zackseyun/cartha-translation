  source_fidelity: La traduction rend correctement καταδεσμεύσει (« pansera »), ἐπὶ πάσῃ βοῇ (« à chaque cri ») et σπλάγχνα (« entrailles »). Cependant, « la vie de ses fils » neutralise le pluriel explicite ψυχῶν. Une formulation distributive française permet de conserver ce pluriel sans employer l’expression peu naturelle « les vies ».
