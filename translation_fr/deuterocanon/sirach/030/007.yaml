  text: He will bind up his wounds over the souls of his sons, and at every cry his inward parts will be troubled.
translation:
  language: fr
  text: Pour la vie de chacun de ses fils, il pansera ses blessures[a] ; à chaque cri, ses entrailles seront bouleversées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « au sujet des âmes — ou des vies — de ses fils » ; la construction et le référent de « ses blessures » sont incertains.'
    reason: La formulation grecque transmise est difficile et comporte une ambiguïté réelle qu’une traduction française fluide ne peut entièrement reproduire.
lexical_decisions:
- source_word: περὶ ψυχῶν υἱῶν
  choice: Pour la vie de ses fils
  rationale: περί avec le génitif peut exprimer ce qui motive la sollicitude ou l’action, et ψυχή désigne ici vraisemblablement la vie, tout en pouvant littéralement signifier l’âme. Le pluriel inhabituel du grec est conservé dans « ses fils ».
- source_word: καταδεσμεύσει τραύματα αὐτοῦ
  choice: il pansera ses blessures
  rationale: καταδεσμεύω évoque l’action de bander ou panser des plaies. Le possessif français maintient, comme αὐτοῦ, une certaine ambiguïté quant à la personne dont il s’agit.
- source_word: ἐπὶ πάσῃ βοῇ
  choice: à chaque cri
  rationale: Rend directement l’idée distributive de πᾶς avec βοή, sans réduire le cri à une plainte précise.
- source_word: σπλάγχνα αὐτοῦ
  choice: ses entrailles
  rationale: σπλάγχνα désigne les organes intérieurs et, figurativement, le siège d’une émotion profonde. « Entrailles » conserve cette image corporelle et affective.
- source_word: ταραχθήσεται
  choice: seront bouleversées
  rationale: Le passif futur exprime un trouble intense; « bouleversées » est naturel en français tout en gardant la force émotionnelle du terme.
theological_decisions:
- issue: Sens de ψυχή dans une formule grecque difficile
  choice: « vie » dans le texte, avec le sens littéral signalé en note
  alternative: « âme »
  rationale: Dans ce contexte de blessures et de cris, « vie » est idiomatique et plausible, mais la note préserve la portée littérale et l’incertitude du grec.
- issue: Référent de αὐτοῦ après « ses fils »
  choice: Conserver le possessif ambigu « ses blessures »
  alternative: Expliciter « les blessures de l’un d’eux » ou « ses propres blessures »
  rationale: Le grec ne permet pas de trancher sûrement le référent; l’expliciter résoudrait indûment l’ambiguïté.
translation_notes:
  register: Français moderne, sobre et digne. « Pansera » rend concrètement le soin des plaies; « entrailles » conserve l’image antique du siège des émotions. La ponctuation met en parallèle les deux réactions décrites.
