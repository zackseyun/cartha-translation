  text: Give rest to your soul[a], and gladden your heart; and keep anger far from you.
translation:
  language: fr
  text: Accorde du repos à ton âme[a] et réjouis ton cœur ; tiens la colère loin de toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu est difficile à cet endroit, et le texte grec conservé présente une formulation entièrement différente. La traduction suit le témoin hébreu ; « réjouis ton cœur » rend d’après le contexte un verbe dont le sens exact est incertain.
    reason: textual_variant
lexical_decisions:
- source_word: פוג
  choice: accorde du repos
  rationale: L’impératif peut exprimer l’idée de relâcher, d’apaiser ou de laisser se calmer. « Accorde du repos » rend naturellement en français l’action exercée en faveur de son être intérieur.
- source_word: נפשך
  choice: à ton âme
  rationale: Dans la littérature sapientiale, נפש peut désigner la vie, la personne ou l’être intérieur. « Âme » conserve ici la profondeur anthropologique du terme sans imposer un dualisme technique.
- source_word: ופיג
  choice: et réjouis
  rationale: La forme hébraïque est difficile. Dans le parallélisme avec « ton cœur » et l’exhortation suivante contre la colère, « réjouis » exprime de façon intelligible une restauration positive de l’être intérieur, sans dissimuler l’incertitude signalée en note.
- source_word: לבך
  choice: ton cœur
  rationale: לב désigne couramment le centre intérieur de la pensée, de la volonté et des émotions. « Cœur » est l’équivalent français traditionnel et toujours compréhensible.
- source_word: וקצפון
  choice: la colère
  rationale: Le nom exprime la colère ou l’irritation. « La colère » est direct, naturel et adapté au caractère pratique de l’exhortation.
- source_word: הרחק ממך
  choice: tiens … loin de toi
  rationale: L’impératif appelle à créer activement une distance. Cette tournure française conserve la force exhortative et l’image spatiale de l’hébreu.
theological_decisions:
- issue: Portée anthropologique de נפש
  choice: à ton âme
  alternative: à ta vie ; à toi-même
  rationale: Le verset vise l’être intérieur dans une exhortation sapientiale. « Âme » préserve la densité du mot hébreu, sans affirmer pour autant une conception rigide de la séparation entre corps et âme.
- issue: Traitement d’un texte hébreu difficile face à un parallèle grec très différent
  choice: Suivre le témoin hébreu comme une exhortation au repos intérieur et à la joie, tout en signalant l’incertitude textuelle.
  alternative: Traduire ופיג plus littéralement par une expression telle que « relâche » ; ou suivre le grec conservé, dont le contenu est entièrement différent.
  rationale: Le témoin grec fourni paraît représenter un autre texte et ne permet pas d’harmonisation sûre. Puisque l’hébreu est conservé, il demeure la base de la traduction, mais la difficulté du verbe et l’écart majeur avec le grec doivent être rendus transparents.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier conserve l’adresse personnelle des suffixes hébreux. Le point-virgule distingue les deux mouvements de l’exhortation sans alourdir la phrase.
