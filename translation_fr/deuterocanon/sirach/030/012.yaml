base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/012.yaml
  text: Bend his neck in his youth[a], and break his loins while he is still small[b], lest he become stubborn and bring you bitterness of soul.
translation:
  language: fr
  text: Courbe-lui la tête dès sa jeunesse, et brise-lui les reins[a] tant qu’il est encore petit, de peur qu’il ne s’endurcisse, ne se révolte contre toi et ne te cause une amertume profonde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « brise-lui les reins » ; le grec a plutôt « écrase-lui les côtés » ou « les côtes ».
    reason: textual_variant
  - marker: b
    text: La formulation hébraïque est difficile ; le grec exprime clairement l’idée de devenir dur ou de s’endurcir.
    reason: alternative_reading
lexical_decisions:
- source_word: כוף ראשו
  choice: Courbe-lui la tête
  rationale: L’hébreu dit littéralement « courbe sa tête ». Cette formulation conserve l’image physique de la soumission sans la remplacer par l’idée abstraite de discipline.
- source_word: בנערותו
  choice: pendant sa jeunesse
  rationale: Rend directement l’indication temporelle tout en restant naturel en français moderne.
- source_word: ובקע מתניו
  choice: et brise-lui les reins
  rationale: Le verbe exprime l’action de fendre ou briser, et מתנים désigne les reins ou les hanches. La traduction maintient volontairement la dureté de l’image hébraïque.
- source_word: כשהוא קטן
  choice: tant qu’il est encore petit
  rationale: La tournure souligne qu’il faut agir dès l’enfance et conserve le caractère concret de « petit ».
- source_word: למה ישקה
  choice: de peur qu’il ne s’endurcisse
  rationale: La leçon hébraïque est difficile. Le parallèle grec, σκληρυνθείς, appuie nettement le sens « devenu dur, endurci ».
- source_word: ומרה בך
  choice: ne se révolte contre toi
  rationale: Le verbe hébreu exprime la rébellion ou l’insoumission; le grec ἀπειθήσῃ σοι confirme l’idée de désobéir à quelqu’un.
- source_word: ונולד ממנו מפח נפש
  choice: et ne te cause un profond chagrin
  rationale: L’expression hébraïque évoque littéralement un accablement ou un chagrin de l’âme qui naîtrait de lui. La formulation française en restitue naturellement le sens et l’intensité.
theological_decisions:
- issue: Violence de l’image employée pour la correction d’un enfant
  choice: Conserver les images corporelles concrètes et sévères du texte
  alternative: Les atténuer en traduisant simplement « impose-lui une discipline stricte »
  rationale: Les témoins hébreu et grec emploient tous deux une rhétorique physique très forte. La traduction ne doit ni dissimuler cette tension éthique ni transformer l’image en approbation explicite d’une doctrine moderne de l’éducation.
- issue: Présence de la révolte contre le parent
  choice: Traduire explicitement ומרה בך par « ne se révolte contre toi »
  alternative: Omettre cette proposition et ne garder que l’idée d’endurcissement et de chagrin
  rationale: La proposition figure dans le témoin hébreu fourni et son sens général concorde avec le grec « qu’il ne te désobéisse ». Son omission ferait perdre un élément substantiel de la source.
translation_notes:
  register: Français international moderne, direct et digne. Le parallélisme et la vigueur des impératifs sont préservés; la dernière expression est légèrement idiomatisée pour éviter une tournure française artificielle.
