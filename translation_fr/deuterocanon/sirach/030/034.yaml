  verdict: revise
  source_fidelity: 'La traduction de παιδί par « enfant » ne rend pas le sens contextuel du terme dans cette maxime. Dans ce passage consacré à la condition servile, παιδί désigne un jeune serviteur, c’est-à-dire un esclave. De plus, ἄνες χεῖρας αὐτῷ est une expression concise dont l’image des « mains » doit rester interprétée avec prudence : elle peut évoquer le relâchement de la contrainte ou l’inaction imposée au serviteur.'
  naturalness: « Mets ton esclave au travail » et « laisse-le les mains oisives » sont naturels en français international contemporain tout en conservant la forme proverbiale et le contraste du grec. La formulation évite de présenter le passage comme une instruction sur l’éducation d’un enfant.
  terminology: « Esclave » est le terme historiquement et contextuellement juste ici; « liberté » conserve exactement ἐλευθερία. La note explicative doit rapporter cette liberté à l’affranchissement de la servitude, plutôt qu’à une interprétation réductrice en termes de seule discipline.
