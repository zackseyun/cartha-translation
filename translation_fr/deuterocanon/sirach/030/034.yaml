  text: Put him to work while he is a child[a], and you will find rest; let his hands go idle[b], and he will seek freedom.
translation:
  language: fr
  text: Mets ton esclave au travail, et tu trouveras du repos ; laisse-le les mains oisives[a], et il cherchera la liberté[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « relâche les mains pour lui ». L’expression peut évoquer le relâchement de la contrainte ou le fait de le laisser inactif.'
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte d’esclavage, la « liberté » désigne l’affranchissement de la servitude.
    reason: cultural_note
lexical_decisions:
- source_word: ἔργασαι ἐν παιδί
  choice: Fais-le travailler pendant qu’il est enfant
  rationale: L’impératif ἔργασαι exhorte ici à astreindre l’enfant au travail ou à une activité disciplinée. La tournure temporelle « pendant qu’il est enfant » explicite naturellement la valeur contextuelle de ἐν παιδί.
- source_word: εὑρήσεις ἀνάπαυσιν
  choice: tu trouveras du repos
  rationale: ἀνάπαυσις désigne le repos ou le soulagement. « Trouver du repos » reste proche du grec et convient au parallélisme proverbial.
- source_word: ἄνες χεῖρας αὐτῷ
  choice: laisse ses mains oisives
  rationale: ἄνες, de ἀνίημι, signifie relâcher ou laisser aller. Avec « mains », image du travail et de l’activité, cette formulation exprime le relâchement de la discipline tout en conservant l’image corporelle du grec.
- source_word: ζητήσει ἐλευθερίαν
  choice: il cherchera la liberté
  rationale: ἐλευθερία signifie littéralement « liberté ». Le terme est conservé afin de ne pas effacer la tension du texte, tandis qu’une note en précise le sens disciplinaire dans ce contexte.
theological_decisions:
- issue: Référence masculine singulière dans une instruction sapientielle sur l’enfant
  choice: Conserver « le » et « il » au masculin singulier
  alternative: Employer une formulation générique ou épicène
  rationale: Le grec présente un enfant singulier repris par αὐτῷ et par le sujet masculin implicite de ζητήσει. La traduction maintient cette forme grammaticale sans élargir ni neutraliser arbitrairement la référence.
- issue: Portée de la « liberté » recherchée
  choice: Conserver le terme littéral « liberté » et en préciser le sens par une note
  alternative: Traduire directement par « indépendance » ou « rejet de toute discipline »
  rationale: Le contexte suggère l’affranchissement de la contrainte éducative, mais le mot grec demeure ἐλευθερία. Le garder dans le texte préserve sa force et son éventuelle ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. La structure proverbiale en deux propositions est conservée. Les marqueurs de notes ont été placés sur les expressions auxquelles les notes se rapportent, en corrigeant le décalage apparent de la couche anglaise de consultation.
