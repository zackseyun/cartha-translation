    rationale: Le contexte immédiat de la maxime porte sur l’esclave/serviteur. Rendre παιδί par « enfant » déplace le référent et transforme une instruction relative à l’esclavage en conseil éducatif.
  - severity: medium
    issue: Note b interprète « liberté » comme simple rejet de discipline
    rationale: Dans ce contexte servile, ἐλευθερία renvoie directement à la liberté vis-à-vis de la servitude. La réduire à une indocilité disciplinaire n’est pas justifiée par le mot grec ni par le contexte.
  - severity: medium
    issue: Note a propose « relâche tes mains à son égard » sans signaler l’incertitude idiomatique
    rationale: Cette formulation française est peu claire et paraît faire des mains celles du maître. Une note doit indiquer le littéralisme et les deux possibilités contextuelles sans trancher excessivement.
