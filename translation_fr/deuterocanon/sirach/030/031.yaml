  text: In all your works be outstanding[b][a]; do not give a blemish to your honor.
translation:
  language: fr
  text: Dans tout ce que tu fais, excelle[a] ; ne ternis pas ton honneur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sois excellent » ou « distingue-toi ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ne donne pas une tache dans ta gloire » ; « gloire » peut aussi désigner la réputation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσι τοῖς ἔργοις σου
  choice: Dans tout ce que tu fais
  rationale: Cette formulation rend naturellement en français moderne la portée globale de πᾶσι et le sens concret de ἔργοις, « œuvres, actes ».
- source_word: γίνου ὑπεράγων
  choice: cherche à te surpasser
  rationale: γίνου introduit une exhortation continue, tandis que ὑπεράγων exprime l’idée de dépasser, d’exceller. La formulation française est idiomatique et évite l’ambiguïté de « sois supérieur », qui pourrait suggérer une supériorité sociale.
- source_word: μὴ δῷς μῶμον
  choice: ne porte pas atteinte
  rationale: Littéralement, le grec dit « ne donne pas une tache/un blâme ». « Ne porte pas atteinte » restitue en français l’idée idiomatique de causer une marque déshonorante.
- source_word: ἐν τῇ δόξῃ σου
  choice: à ton honneur
  rationale: Dans ce contexte sapientiel, δόξα désigne vraisemblablement l’honneur ou la réputation. « Honneur » conserve la dignité du propos sans donner à δόξα un sens théologique indu.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le premier impératif est rendu de manière dynamique afin d’exprimer l’excellence active sans suggérer une supériorité de rang. Le second conserve l’image d’une atteinte à l’honneur, avec la formulation plus littérale signalée en note.
