review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu, mais « cherche à te surpasser » déplace ὑπεράγων vers le dépassement de soi, idée non explicitée par le grec. L’exhortation porte plutôt sur l’excellence ou le fait de se distinguer dans ses œuvres. La seconde proposition rend correctement l’idée de ne pas jeter une tache sur son honneur/glorieuse réputation.
  naturalness: Le français est fluide et de registre approprié. « Excelle » est plus direct, plus concis et plus fidèle à l’impératif exhortatif que « cherche à te surpasser ». « Ne jette pas de tache sur ton honneur » est compréhensible mais un peu calqué; « ne ternis pas ton honneur » est naturel, tout en conservant la métaphore par la note.
  terminology: « Honneur » est un bon rendu contextuel de δόξα, qui peut aussi évoquer la réputation. « Ternir » rend naturellement l’effet de μῶμος sans imposer une lecture théologique. La note doit garder « gloire » comme possibilité littérale sans présenter une paraphrase comme littérale.
  issues:
  - severity: medium
    issue: « cherche à te surpasser »
    rationale: Cette formulation suggère que le comparant est soi-même. Or ὑπεράγων signifie plutôt « excellent, surpassant, distingué »; le texte ne précise pas un dépassement de soi.
  - severity: low
    issue: Formulation de la note b
    rationale: « Ne donne pas de tache à ta gloire » est trop littérale et peu idiomatique en français; la note peut signaler l’image grecque et les sens possibles de δόξα plus clairement.
