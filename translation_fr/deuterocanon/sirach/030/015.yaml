  text: Life for the poor is better than refined gold[a], and a good spirit than pearls.
translation:
  language: fr
  text: La vie d’un pauvre vaut mieux que l’or fin[a], et un bon esprit vaut mieux que les perles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « La santé et le bien-être valent mieux que tout l’or, et un corps robuste mieux qu’une richesse sans mesure. » L’hébreu et le grec diffèrent considérablement ici, ce qui peut indiquer une variante de tradition textuelle ou une altération du texte hébreu conservé.'
    reason: textual_variant
lexical_decisions:
- source_word: חיי
  choice: La vie
  rationale: Le terme est une forme construite de « vie » ; cette formulation conserve le caractère bref et proverbial de la comparaison.
- source_word: שר
  choice: d’un pauvre
  rationale: Dans ce témoin hébreu difficile, שר est compris comme désignant une personne pauvre ou dans le besoin. Le grec présente à cet endroit une leçon très différente, signalée en note.
- source_word: איביתי
  choice: vaut mieux que
  rationale: La forme hébraïque est textuellement difficile. Le contexte comparatif, corroboré par le grec βελτίων…ἢ, exprime ici la supériorité ou la préférence ; « vaut mieux que » rend naturellement cette idée en français.
- source_word: מפז
  choice: que l’or fin
  rationale: פז désigne un or de grande qualité, pur ou affiné. « Or fin » est une expression française courante et digne.
- source_word: ורוח טובה
  choice: et un bon esprit
  rationale: רוּחַ peut désigner l’esprit, la disposition intérieure ou la vitalité. « Un bon esprit » maintient cette ampleur sans réduire le sens à la seule bonne humeur.
- source_word: מפנינים
  choice: que les perles
  rationale: פנינים désigne couramment les perles, ou éventuellement une autre matière précieuse. « Perles » est le sens traditionnel et immédiatement compréhensible.
theological_decisions:
- issue: Divergence importante entre le témoin hébreu conservé et le parallèle grec
  choice: 'Le texte principal suit l’hébreu conservé : « La vie d’un pauvre… et un bon esprit… »'
  alternative: 'Le grec porte : « La santé et le bien-être valent mieux que tout l’or, et un corps robuste mieux qu’une richesse sans mesure. »'
  rationale: Puisque le texte hébreu est conservé, il sert de base au texte principal. La divergence substantielle du grec peut témoigner d’une autre tradition textuelle ou d’une altération du texte hébreu transmis ; elle est donc présentée explicitement en note plutôt que résolue silencieusement.
translation_notes:
  register: Français international moderne, clair et proverbial. « Vaut mieux que » est répété dans les deux membres afin d’éviter une ellipse un peu raide et de rendre le parallélisme immédiatement intelligible.
