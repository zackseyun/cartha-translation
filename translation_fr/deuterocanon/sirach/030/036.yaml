  text: Put him to work[a], so that he may not be idle,
translation:
  language: fr
  text: Mets-le au travail[a], afin qu’il ne reste pas inactif,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Fais-le entrer dans le travail. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔμβαλε
  choice: Mets
  rationale: L’impératif aoriste de ἐμβάλλω signifie ici, de façon idiomatique, faire entrer quelqu’un dans une activité. « Mets » conserve la force impérative sans retenir le sens trop littéral de « jette ».
- source_word: αὐτὸν
  choice: le
  rationale: Le pronom masculin singulier à l’accusatif désigne une personne de sexe masculin dans le contexte ; le pronom français « le » en conserve la fonction de complément d’objet direct.
- source_word: εἰς ἐργασίαν
  choice: au travail
  rationale: La construction exprime l’entrée dans une activité productive. « Au travail » est une tournure française naturelle qui reste proche de l’image grecque.
- source_word: ἵνα μὴ ἀργῇ
  choice: afin qu’il ne reste pas inactif
  rationale: ἵνα μή exprime le but négatif, tandis que ἀργῇ désigne l’absence d’activité. « Reste inactif » évite de renforcer indûment le texte par une qualification morale comme « paresseux ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve l’impératif et la proposition de but, tout en évitant une traduction mécanique de ἐμβάλλω. La virgule finale est maintenue conformément au fragment fourni.
