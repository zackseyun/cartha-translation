  source_fidelity: 'Le texte français rend correctement le sens du témoin hébreu : la préférence accordée à une joie intérieure durable plutôt qu’aux mets recherchés, puis l’idée que la nourriture convient à cette personne. La divergence majeure avec le grec doit bien être signalée. Toutefois, la présentation actuelle du contenu grec confond légèrement deux actions distinctes : le grec déconseille d’accorder autorité sur soi-même aux proches et de remettre ses biens à un autre, plutôt que d’accorder aux mêmes personnes autorité sur les biens.'
