  text: Years of a glad heart are better than delicacies[b][a], and his food will agree with him.
translation:
  language: fr
  text: Des années vécues dans la joie du cœur valent mieux que des mets raffinés[a], et sa nourriture lui réussira.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Des années d’un cœur bon à la place de mets raffinés. » Ici, le « cœur bon » évoque vraisemblablement un cœur joyeux ou serein.'
    reason: lexical_alternative
  - marker: b
    text: 'L’expression hébraïque signifie littéralement : « et sa nourriture montera sur lui » ; le sens paraît être que ce qu’il mange lui convient ou lui est profitable. À cette référence, le texte grec transmet un tout autre enseignement : il déconseille de donner, de son vivant, autorité sur soi-même à un fils, une femme, un frère ou un ami, et de remettre ses biens à un autre. L’hébreu représente donc ici une tradition textuelle sensiblement différente.'
    reason: textual_variant
lexical_decisions:
- source_word: שנות
  choice: Des années vécues
  rationale: Le pluriel construit évoque une durée prolongée. « Des années vécues » conserve l’image temporelle de l’hébreu tout en formant une phrase naturelle en français.
- source_word: לב טוב
  choice: dans la joie du cœur
  rationale: Dans ce contexte sapientiel, l’expression désigne surtout le bien-être intérieur et la gaieté, plutôt que la seule bonté morale. Cette formulation restitue ce sens affectif sans raideur.
- source_word: תחת
  choice: valent mieux que
  rationale: La préposition signifie littéralement « à la place de », mais elle exprime ici une préférence comparative entre la joie intérieure et les mets recherchés.
- source_word: מטעמים
  choice: des mets raffinés
  rationale: Le terme désigne des aliments particulièrement savoureux ou recherchés. « Mets raffinés » exprime clairement cette idée dans un registre actuel et digne.
- source_word: ומאכלו
  choice: et sa nourriture
  rationale: Le suffixe masculin singulier renvoie naturellement à la personne dont le cœur est joyeux. Le possessif français préserve ce lien grammatical.
- source_word: יעלה עליו
  choice: lui réussira
  rationale: L’expression signifie littéralement « montera sur lui ». Dans le contexte alimentaire, elle indique que la nourriture lui convient, se digère bien ou lui est profitable; « lui réussira » conserve cette amplitude sans imposer une explication médicale précise.
