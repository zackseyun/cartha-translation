  text: A joyful heart is a man's life[a], and a person's gladness prolongs his life.
translation:
  language: fr
  text: La joie du cœur, c’est la vie d’un homme, et l’allégresse d’une personne prolonge sa vie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La fin du texte hébreu est difficile : la leçon transmise signifie littéralement quelque chose comme « il a prolongé son nez/sa colère ». Le parallèle grec parle de jours diminués et indique que la durée de la vie est en cause; la traduction retient donc le sens probable « prolonge sa vie ».'
    reason: textual_variant
lexical_decisions:
- source_word: שמחת לב
  choice: la joie du cœur
  rationale: Rend directement la construction hébraïque « joie/allégresse du cœur » dans un français naturel et digne, tout en conservant le cœur comme siège de la vie intérieure.
- source_word: חיי איש
  choice: c’est la vie d’un homme
  rationale: Le pluriel morphologique חיי désigne ici la vie dans son ensemble. « D’un homme » conserve la valeur masculine de איש dans cette maxime, sans l’étendre artificiellement à אדם dans le second membre.
- source_word: וגיל אדם
  choice: et l’allégresse d’une personne
  rationale: גיל exprime une joie vive, bien rendue par « allégresse ». אדם a ici une portée humaine générique, d’où « une personne ».
- source_word: האריך אפו
  choice: prolonge sa vie
  rationale: Le texte hébreu transmis signifie littéralement quelque chose comme « a allongé son nez/sa colère », formulation difficile et probablement altérée. Le parallèle grec évoque des jours diminués et soutient le sens opposé d’une vie prolongée. « Prolonge sa vie » forme en outre un parallèle clair avec « la vie » dans le premier membre.
theological_decisions:
- issue: Différenciation des termes anthropologiques איש et אדם
  choice: « un homme » pour איש et « une personne » pour אדם
  alternative: Rendre les deux termes par « personne » ou les deux par « homme »
  rationale: 'Cette solution préserve la variation de l’hébreu : איש désigne naturellement un homme, tandis que אדם porte souvent une référence humaine générique. Elle évite à la fois de neutraliser le premier terme et de masculiniser indûment le second.'
- issue: Traitement de la finale hébraïque difficile האריך אפו
  choice: Adopter dans le texte le sens probable « prolonge sa vie », avec une note textuelle
  alternative: Traduire littéralement « allonge son nez/sa colère » ou conjecturer explicitement « prolonge ses jours »
  rationale: La leçon transmise est obscure dans ce contexte. Le grec parallèle, bien que formulé négativement (« diminuent les jours »), confirme que la durée de la vie est en jeu. Le choix retient ce sens probable sans masquer l’incertitude textuelle.
translation_notes:
  register: Français international moderne, proverbial et digne. La reprise de « vie » dans les deux membres assure un parallélisme naturel. « Allégresse » distingue גיל de שמחת sans rendre la phrase archaïque. Le marqueur [a] est placé à la fin de la proposition concernée.
