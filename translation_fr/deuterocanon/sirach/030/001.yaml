    rationale: 'Le syntagme ἐπʼ ἐσχάτων αὐτοῦ demeure ouvert: il peut viser la fin, les derniers temps ou l’issue ultérieure. « À la fin » est plus sobre et moins chargé de l’idée de destinée.'
