  yaml_path: translation/deuterocanon/sirach/030/001.yaml
  text: He who loves his son will continue the lash for him[b][a], so that he may rejoice in his final days.
translation:
  language: fr
  text: Celui qui aime son fils s’appliquera à tenir le fouet prêt pour lui[a], afin de se réjouir à la fin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « persistera avec des fouets à son égard ». Le verbe grec suggère une action assidue ou persistante; le nom, au pluriel, peut désigner des fouets, des coups de fouet ou des flagellations.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sur ses dernières choses ». L’expression peut désigner sa situation ultérieure, ses dernières années ou sa fin.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ἀγαπῶν
  choice: Celui qui aime
  rationale: Le participe substantivé a une portée générale. Cette formulation conserve le masculin singulier et le style proverbial du grec.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: son fils
  rationale: υἱός désigne précisément un fils; il n’y a pas lieu de neutraliser le terme en « enfant ».
- source_word: ἐνδελεχήσει
  choice: s’appliquera à
  rationale: Le verbe exprime une action assidue, persistante ou suivie. « S’appliquera à » rend cette nuance sans réduire le sens à une simple disponibilité.
- source_word: μάστιγας αὐτῷ
  choice: lui donner des coups de fouet
  rationale: μάστιγας, pluriel, évoque des fouets, des coups de fouet ou des flagellations. La tournure française rend naturellement le datif αὐτῷ et maintient l’image concrète et sévère du grec.
- source_word: ἵνα εὐφρανθῇ
  choice: afin de se réjouir
  rationale: La proposition exprime le but ou le résultat visé. Le sujet sous-entendu demeure naturellement le père qui aime et corrige son fils.
- source_word: ἐπʼ ἐσχάτων αὐτοῦ
  choice: de son sort final
  rationale: L’expression grecque, littéralement liée aux « dernières choses » du fils, peut viser sa situation ultérieure, l’issue de sa vie ou sa fin. « Sort final » garde cette ampleur mieux que « derniers jours ».
theological_decisions:
- issue: Faut-il atténuer l’image du châtiment corporel?
  choice: Conserver explicitement les « coups de fouet »
  alternative: discipline; correction; punition
  rationale: Le grec emploie μάστιγας, terme concret désignant des fouets ou des flagellations. Une abstraction atténuerait la dureté réelle du texte; la traduction la préserve sans l’amplifier ni l’approuver.
- issue: Forme masculine du proverbe
  choice: « Celui qui aime son fils »
  alternative: « Quiconque aime son enfant »
  rationale: Le grec présente un homme et son fils au masculin singulier. La traduction conserve cette précision grammaticale et familiale.
- issue: Sens de la formule finale
  choice: « son sort final »
  alternative: « ses derniers jours »; « sa fin »; « ce qu’il deviendra »
  rationale: La formule grecque reste ouverte entre l’issue ultérieure, les dernières années et la fin de la vie. « Sort final » évite de la limiter à la vieillesse ou au moment de la mort.
translation_notes:
  register: Français international moderne, proverbial et digne. La formulation conserve l’image corporelle explicite du grec ainsi que l’indétermination relative de la proposition finale.
