  text: Si tu le maltraites et le chasses, il prendra la fuite ; sur quel chemin iras-tu le chercher ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: Si
  rationale: Introduit une condition ouverte, naturellement rendue par « si ».
- source_word: κακώσῃς
  choice: tu le maltraites
  rationale: Exprime le fait de faire du mal ou de traiter durement quelqu’un, sans limiter le sens à une atteinte physique.
- source_word: ἀπάρᾳς
  choice: le chasses
  rationale: Dans ce contexte, le verbe indique qu’on éloigne ou renvoie quelqu’un ; « chasser » rend la force de l’action et prépare naturellement la fuite qui suit.
- source_word: ἀποδρᾷ
  choice: il prendra la fuite
  rationale: Rend le mouvement concret de fuite ou d’évasion dans un français actuel et digne.
- source_word: ἐν ποίᾳ ὁδῷ
  choice: sur quel chemin
  rationale: Conserve l’image concrète de la route plutôt que de la réduire à « où ».
- source_word: ζητήσεις
  choice: iras-tu le chercher
  rationale: La tournure française exprime naturellement le futur de la question rhétorique tout en gardant l’idée de recherche.
