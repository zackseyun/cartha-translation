  text: In his lifetime he saw and rejoiced[a], and at his end he was not grieved.
translation:
  language: fr
  text: De son vivant, il a vu et s’est réjoui ; à la fin de sa vie[a], il n’a pas été affligé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans ses derniers jours ». Le grec dit littéralement « dans sa dernière [période] » et désigne la fin de la vie.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῇ ζωῇ αὐτοῦ
  choice: De son vivant
  rationale: Cette tournure française naturelle exprime clairement que l’événement s’est produit pendant sa vie.
- source_word: εἶδεν
  choice: il a vu
  rationale: Le verbe grec signifie simplement « voir ». L’objet restant sous-entendu dans le texte grec, la traduction n’en ajoute aucun.
- source_word: εὐφράνθη
  choice: s’est réjoui
  rationale: Le verbe exprime une joie vive ; la forme pronominale est naturelle en français et convient au registre sapientiel.
- source_word: ἐν τῇ τελευταῖ αὐτοῦ
  choice: à la fin de sa vie
  rationale: L’adjectif grec substantivé désigne la dernière période de sa vie. Cette formulation est plus claire en français moderne que le calque « à sa fin ».
- source_word: οὐκ ἐλυπήθη
  choice: il n’a pas été affligé
  rationale: Cette traduction conserve la forme passive et le sens émotionnel du grec sans préciser la cause de l’affliction.
