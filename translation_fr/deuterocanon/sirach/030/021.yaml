  text: Do not look with your eyes and groan[a], like a eunuch embracing a young woman.
translation:
  language: fr
  text: Il regarde de ses yeux et gémit[a], comme un eunuque qui étreint une jeune femme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec lit : « Ne livre pas ton âme à la tristesse et ne te tourmente pas dans tes desseins. » Il exprime directement une exhortation contre la tristesse; le témoin hébreu conserve une image différente de désir frustré.'
    reason: alternative_reading
lexical_decisions:
- source_word: ראה בעיניו
  choice: Ne regarde pas de tes yeux
  rationale: L’hébreu dit littéralement « il voit/regarde de ses yeux », mais le contexte sapientiel et l’impératif négatif explicite du parallèle grec soutiennent une exhortation à la deuxième personne. La tournure conserve l’insistance visuelle de l’hébreu.
- source_word: ומתאנח
  choice: en gémissant
  rationale: Le verbe exprime un soupir ou un gémissement de douleur. « En gémissant » relie naturellement l’action au regard sans atténuer la détresse.
- source_word: כאשר
  choice: comme
  rationale: Introduit directement la comparaison en français courant.
- source_word: סריס
  choice: eunuque
  rationale: L’image repose ici sur l’incapacité ou l’impossibilité sexuelle, non sur une fonction de cour.
- source_word: יחבק
  choice: qui étreint
  rationale: « Étreindre » conserve la proximité physique et le registre digne du verbe hébreu.
- source_word: נערה
  choice: une jeune femme
  rationale: Expression moderne et claire, qui évite aussi bien l’ambiguïté enfantine de « fille » que l’archaïsme de « jeune fille » ou « vierge » dans ce contexte.
theological_decisions:
- issue: Rapport entre les formes hébraïque et grecque du verset
  choice: Traduire en priorité l’image hébraïque, tout en laissant le grec éclairer sa valeur d’exhortation négative et l’adresse au lecteur.
  alternative: 'Traduire seulement le grec : « Ne livre pas ton âme à la tristesse et ne te tourmente pas par tes réflexions. » Ou rendre l’hébreu comme une simple description à la troisième personne.'
  rationale: Le témoin hébreu conserve une image saisissante de désir frustré, tandis que le parallèle grec explicite l’avertissement contre une tristesse entretenue. La traduction préserve les deux éléments sans effacer leur divergence textuelle.
translation_notes:
  register: Français international moderne, sobre et digne. L’image corporelle franche de l’hébreu est conservée; la note signale clairement la forme sensiblement différente du grec.
