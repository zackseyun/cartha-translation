  source_fidelity: 'Le texte hébreu non vocalisé porte formellement une lecture descriptive à la troisième personne : « il voit/regarde de ses yeux et gémit ». La transformation en impératif négatif à la deuxième personne dépend du parallèle grec, dont la formulation est substantiellement différente. Puisque le témoin hébreu est conservé et que la vocalisation/syntaxe laisse en jeu cette différence, la traduction française ne doit pas présenter l’exhortation grecque comme si elle était explicite en hébreu.'
  naturalness: « Ne regarde pas de tes yeux en gémissant » est peu idiomatique en français moderne, notamment par l’association de « de tes yeux » avec un impératif. Une phrase descriptive simple est à la fois naturelle et plus proche de la forme hébraïque.
  terminology: « Eunuque », « étreint » et « jeune femme » conviennent au registre et à l’image du texte. La note doit qualifier le grec de lecture parallèle différente, sans lui attribuer la fonction de clarifier de façon certaine la grammaire de l’hébreu.
