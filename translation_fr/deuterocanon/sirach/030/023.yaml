  text: Do not give your soul over to grief[b][a], and do not stumble in your iniquity.
translation:
  language: fr
  text: Ne livre pas ton âme au chagrin[a][b], et ne trébuche pas à cause de ta faute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu לדין est difficile. Le parallèle grec appuie le sens de « chagrin » ou de « tristesse » ; d’après les seules consonnes hébraïques, on pourrait aussi comprendre « jugement ».
    reason: lexical_alternative
  - marker: b
    text: 'Le témoin grec est beaucoup plus développé ici : « Aime ton âme et réconforte ton cœur ; éloigne de toi le chagrin, car le chagrin a tué beaucoup de gens et il ne procure aucun avantage. » Le texte hébreu conservé est plus bref.'
    reason: alternative_reading
lexical_decisions:
- source_word: אל תתן
  choice: Ne livre pas
  rationale: Le verbe נתן, dans cette construction, exprime l’idée de livrer ou d’abandonner quelqu’un à une puissance ou à un état. « Ne livre pas » demeure proche de l’hébreu tout en étant naturel en français.
- source_word: לדין
  choice: au chagrin
  rationale: La forme hébraïque est difficile et pourrait, isolément, évoquer le jugement. Le parallèle grec emploie toutefois λύπη, « chagrin, tristesse », ce qui soutient fortement ce sens sans qu’il soit nécessaire d’introduire tout le développement grec dans le texte principal.
- source_word: נפשך
  choice: ton âme
  rationale: נפש peut désigner l’âme, la vie ou la personne elle-même. « Ton âme » conserve ici le terme anthropologique hébreu et correspond aussi au grec ψυχή.
- source_word: ואל תכשל
  choice: et ne trébuche pas
  rationale: כשל évoque le fait de trébucher, de chanceler ou de tomber. La traduction conserve la métaphore morale de l’hébreu.
- source_word: בעונך
  choice: dans ta faute
  rationale: עון peut désigner la faute, la culpabilité ou les conséquences de la faute. « Dans ta faute » garde l’ambiguïté de la préposition et reste plus accessible aujourd’hui qu’« dans ton iniquité ».
theological_decisions:
- issue: Choix entre le texte hébreu bref et le parallèle grec beaucoup plus développé
  choice: Traduire la ligne hébraïque conservée et employer le grec seulement pour éclairer לדין.
  alternative: 'Suivre le grec : « Aime ton âme et réconforte ton cœur ; éloigne de toi le chagrin, car le chagrin en a tué beaucoup et il ne procure aucun avantage. »'
  rationale: Lorsque l’hébreu de Ben Sira est conservé, il constitue la base première. Le grec est ici un témoin ancien utile pour comprendre le terme hébreu difficile, mais son développement ne doit pas être incorporé silencieusement au texte hébreu plus bref.
- issue: Sens du terme difficile לדין
  choice: au chagrin
  alternative: au jugement
  rationale: Les consonnes hébraïques permettent une association avec le jugement, mais le contexte et le parallèle grec répété autour de λύπη appuient le sens de chagrin ou de tristesse. L’incertitude réelle est signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier reflète les suffixes hébreux de deuxième personne. « Âme » et la métaphore de l’action de trébucher sont conservées, tandis que « faute » évite le caractère aujourd’hui très marqué d’« iniquité ».
