  text: Delicacies poured out before a shut mouth are like an offering set before an idol[a][b].
translation:
  language: fr
  text: Des mets délicats versés devant une bouche fermée sont comme une offrande déposée devant une idole[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu גלול est un terme méprisant pour une idole; on pourrait aussi rendre « une idole immonde » ou, plus crûment, « une idole d’excréments ».
    reason: lexical_alternative
  - marker: b
    text: Le texte grec parallèle porte « des portions de nourriture déposées auprès d’un tombeau » au lieu de « une offrande déposée devant une idole ». Malgré cette différence notable dans la seconde image, l’idée d’un don inutile reste la même.
    reason: textual_variant
lexical_decisions:
- source_word: טובה
  choice: mets délicats
  rationale: Dans ce contexte alimentaire, le mot désigne vraisemblablement de bonnes choses à manger plutôt qu’un bien abstrait. « Mets délicats » exprime cette valeur concrète et désirable.
- source_word: שפוכה
  choice: versés
  rationale: Le participe passif de שפך signifie naturellement « versés » ou « répandus » et conserve l’image vive de l’hébreu.
- source_word: על פה סתום
  choice: devant une bouche fermée
  rationale: Cette formulation française naturelle présente la nourriture à une personne incapable de la recevoir, conformément au sens proverbial et au parallèle grec.
- source_word: תנופה
  choice: une offrande
  rationale: Le terme peut désigner techniquement une offrande balancée ou présentée. Le terme général « offrande » garde la dimension cultuelle sans imposer ici un détail rituel peut-être secondaire.
- source_word: מצגת
  choice: déposée
  rationale: Le participe exprime ce qui est placé ou présenté devant quelqu’un ou quelque chose. « Déposée » convient au contexte d’une offrande.
- source_word: לפני גלול
  choice: devant une idole
  rationale: גלול est une désignation méprisante des idoles. « Idole » identifie clairement le référent dans le texte principal, tandis que la note signale la nuance dépréciative.
theological_decisions:
- issue: Valeur cultuelle de תנופה dans une comparaison sapientielle
  choice: Traduire généralement par « une offrande »
  alternative: « une offrande balancée » ou « une offrande présentée »
  rationale: La comparaison souligne surtout l’inutilité de présenter quelque chose de précieux à ce qui ne peut le recevoir. Un terme rituel trop technique risquerait de restreindre indûment le sens.
- issue: Force péjorative de גלול
  choice: Employer « idole » dans le texte principal
  alternative: « idole immonde » ou, littéralement selon l’étymologie traditionnelle, « idole d’excréments »
  rationale: « Idole » préserve clairement le référent sans introduire dans le texte une expression française lourde ou excessivement interprétative; la note conserve la connotation méprisante.
- issue: Rapport syntaxique entre les deux images
  choice: Expliciter la comparaison par « sont comme »
  alternative: Conserver la juxtaposition nominale sans verbe
  rationale: L’hébreu juxtapose les deux images. « Sont comme » rend naturellement en français leur rapport proverbial sans modifier le fond de la comparaison.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve les images concrètes et la tension du proverbe, tout en explicitant seulement le lien comparatif nécessaire à une lecture française fluide.
