  text: On the day your life's days are completed, and at the time of your death, distribute your inheritance.
translation:
  language: fr
  text: Le jour où les jours de ta vie toucheront à leur fin[a], au moment de ta mort, répartis ton héritage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « au jour de l’achèvement des jours de ta vie ». La formulation grecque est compacte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἡμέρᾳ συντελείας
  choice: Le jour où … toucheront à leur fin
  rationale: Cette tournure française naturelle exprime le moment de l’achèvement indiqué par ἐν ἡμέρᾳ et συντελείας, sans effacer la formulation compacte du grec.
- source_word: ἡμερῶν ζωῆς σου
  choice: les jours de ta vie
  rationale: Rend directement et idiomatiquement le groupe génitif grec, tout en conservant l’image des jours constituant la durée de la vie.
- source_word: ἐν καιρῷ τελευτῆς
  choice: au moment de ta mort
  rationale: καιρός désigne ici le moment approprié ou déterminé, et τελευτή, dans ce contexte testamentaire, la mort plutôt qu’une simple fin abstraite.
- source_word: διάδος
  choice: répartis
  rationale: L’impératif aoriste appelle à accomplir l’acte de distribuer ou d’attribuer les biens; « répartis » convient au contexte d’un héritage.
- source_word: κληρονομίαν
  choice: ton héritage
  rationale: « Héritage » est l’équivalent usuel de κληρονομία; le possessif, implicite dans le contexte, est nécessaire pour une formulation française claire.
theological_decisions:
- issue: Portée éthique de l’instruction concernant l’héritage
  choice: Une instruction de sagesse pratique demandant de répartir ses biens à la fin de sa vie.
  alternative: Une exhortation générale à la générosité avant la mort.
  rationale: Le vocabulaire de la mort et de l’héritage vise d’abord la disposition des biens. La traduction n’élargit pas ce propos en principe doctrinal ou en exhortation générale absente du texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier reflète le σου grec et le style direct de l’instruction sapientielle. La répétition « les jours de ta vie » est conservée, mais intégrée à une tournure idiomatique.
