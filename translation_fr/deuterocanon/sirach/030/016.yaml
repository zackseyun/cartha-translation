  yaml_path: translation/deuterocanon/sirach/030/016.yaml
  text: There is no wealth greater than a sound body[b][a], and there is no good greater than a glad heart.
translation:
  language: fr
  text: Il n’est pas de richesse supérieure à un corps en bonne santé[a], ni de bien supérieur à un cœur joyeux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici une expression condensée et difficile; le grec parallèle porte « santé du corps ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « bien-être » ou « bonté du cœur »; le grec parallèle porte « joie du cœur ».
    reason: alternative_reading
lexical_decisions:
- source_word: אֵין עֹשֶׁר עַל עֹשֶׁר
  choice: Il n’est pas de richesse supérieure à
  rationale: La construction comparative אֵין… עַל exprime qu’aucune richesse ne surpasse celle qui suit. Cette formulation française en conserve la force tout en restant naturelle; le grec βελτίων confirme le sens comparatif.
- source_word: שַׂר עֶצֶם
  choice: un corps en bonne santé
  rationale: L’expression hébraïque est condensée et difficile. Le parallèle grec ὑγείας σώματος (« santé du corps ») indique qu’elle désigne la santé ou la vigueur corporelle, plutôt qu’un sens littéral des mots pris séparément.
- source_word: אֵין טוֹבָה עַל
  choice: ni de bien supérieur à
  rationale: La formulation reprend le parallélisme comparatif du premier membre et maintient טוֹבָה comme nom (« bien »).
- source_word: טוּב לֵבָב
  choice: un cœur joyeux
  rationale: Littéralement « bonté/bien-être du cœur », l’expression évoque ici une disposition intérieure heureuse. Le grec χαρὰν καρδίας (« joie du cœur ») appuie cette lecture affective, tout en conservant l’image biblique du cœur.
