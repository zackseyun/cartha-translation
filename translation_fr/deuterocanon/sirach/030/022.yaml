  text: Gladness of heart is a man's life, and a man's rejoicing prolongs his days.[a]
translation:
  language: fr
  text: La joie du cœur est la vie d’un être humain, et l’allégresse d’un homme prolonge ses jours.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le témoin hébreu conservé est difficile et présente ici un texte très différent, qui se laisse comprendre approximativement comme évoquant quelqu’un qui couche avec une vierge, celui qui rend la justice par contrainte, et YHWH qui lui en demandera compte. Le texte principal suit le sens clair de la tradition grecque de ce verset.
    reason: textual_variant
lexical_decisions:
- source_word: εὐφροσύνη καρδίας
  choice: la joie du cœur
  rationale: Le grec exprime une joie intérieure liée au cœur. Cette tournure conserve l’image biblique tout en restant naturelle en français moderne.
- source_word: ζωὴ ἀνθρώπου
  choice: fait vivre l’être humain
  rationale: Le grec a littéralement « vie d’un être humain ». La formulation verbale rend clairement la valeur vitale de cette joie sans imposer un masculin générique peu naturel en français.
- source_word: ἀγαλλίαμα ἀνδρός
  choice: l’allégresse
  rationale: « Allégresse » garde l’idée d’une joie vive et manifestée. Le complément « d’un homme » est rattaché à la seconde proposition afin de préserver la référence masculine explicite de ἀνδρός sans alourdir la phrase.
- source_word: μακροημέρευσις
  choice: prolonge les jours
  rationale: Le substantif grec désigne la durée ou la prolongation des jours. La tournure verbale est idiomatique en français et conserve l’image biblique des jours prolongés.
theological_decisions:
- issue: Divergence majeure entre le témoin hébreu conservé et la tradition grecque
  choice: Suivre le sens cohérent du parallèle grec dans le texte principal et signaler explicitement la divergence en note.
  alternative: Traduire littéralement l’hébreu transmis, qui évoque une vierge, un jugement imposé par la force et une demande de comptes par YHWH.
  rationale: L’hébreu fourni est intelligible seulement avec difficulté et ne correspond pas au contenu de la tradition grecque pour Siracide 30.22. Le grec offre ici un verset cohérent dans son contexte. La note maintient toutefois la priorité documentaire de l’hébreu en exposant honnêtement son témoignage divergent plutôt qu’en le faisant disparaître.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation évite un masculin générique dans la première proposition, tout en conservant « un homme » là où le grec emploie explicitement ἀνήρ. L’expression « prolonge les jours » maintient une légère couleur biblique sans archaïsme.
