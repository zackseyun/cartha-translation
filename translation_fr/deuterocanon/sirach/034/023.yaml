  text: Whoever takes away a neighbor’s livelihood is murdering him[b][a], and whoever withholds a hired worker’s wages is shedding blood.
translation:
  language: fr
  text: Celui qui prive son prochain de ses moyens de subsistance l’assassine[a] ; celui qui retient le salaire d’un ouvrier répand le sang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec place d’abord « assassinant le prochain », puis « celui qui enlève les moyens de subsistance ». Il énonce directement cette équivalence morale, sans dire simplement : « c’est comme s’il l’assassinait ».'
    reason: La note conserve l’information sur l’ordre et la force de l’énoncé grec sans présenter comme strictement littérale une reformulation française.
lexical_decisions:
- source_word: φονεύων τὸν πλησίον
  choice: l’assassine
  rationale: Le participe présent φονεύων, placé en tête, exprime directement l’acte de tuer illégitimement. « L’assassine » conserve cette équivalence morale forte et reprend naturellement « son prochain » par le pronom.
- source_word: ὁ ἀφαιρούμενος συμβίωσιν
  choice: celui qui prive son prochain de ses moyens de subsistance
  rationale: ἀφαιρέω signifie enlever ou priver, et συμβίωσις désigne ici ce qui permet de vivre. « Moyens de subsistance » est précis et naturel en français moderne. Le complément « son prochain » est explicité à partir de τὸν πλησίον, que la syntaxe grecque rattache à φονεύων mais que le sens global associe à la personne lésée.
- source_word: ἐκχέων αἷμα
  choice: répand le sang
  rationale: Cette formulation conserve l’image biblique de l’effusion de sang ainsi que sa forte portée morale, sans la réduire à une simple comparaison.
- source_word: ὁ ἀποστερῶν
  choice: celui qui retient
  rationale: ἀποστερέω peut signifier priver, frustrer, dépouiller ou retenir. Avec le salaire comme objet, « retenir » exprime clairement le refus injuste de verser ce qui est dû.
- source_word: μισθὸν μισθωτοῦ
  choice: le salaire d’un ouvrier
  rationale: μισθός désigne le salaire et μισθωτός une personne engagée contre rémunération. « Ouvrier » est ici un terme courant et intelligible pour un travailleur salarié.
theological_decisions:
- issue: Équivalence morale entre la privation économique et l’homicide
  choice: 'Formulation directe : « l’assassine » et « répand le sang »'
  alternative: « c’est comme s’il l’assassinait » ou « il est semblable à celui qui répand le sang »
  rationale: Le grec juxtapose des participes sans marque comparative. La traduction conserve donc la tension voulue et la dénonciation radicale, sans atténuer le propos en simple analogie.
translation_notes:
  register: Français international moderne, sobre et digne. « Moyens de subsistance » rend précisément la réalité économique visée ; « l’assassine » et « répand le sang » préservent le parallélisme accusateur et la vigueur du grec.
