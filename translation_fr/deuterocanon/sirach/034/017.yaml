  naturalness: Le français du projet est naturel et digne. « Un juge juste rende justice » est également idiomatique et permet de refléter la structure sans introduire un titre théologique. Le déplacement de l’appel de note lexicale rend son ancrage précis.
  terminology: « Cri », « pauvre », « nuée », « prête attention » et « rendre justice » conviennent au français international moderne et au registre sapientiel. « Un juge juste » reflète sobrement שופט צדק; aucune majuscule interprétative n’est requise.
