base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/017.yaml
  text: The cry of the poor passes through the cloud[a], and until it reaches him it does not rest. It does not cease until God attends[b], and the righteous Judge executes judgment.
translation:
  language: fr
  text: Le cri du pauvre traverse la nuée et ne trouve aucun repos avant de parvenir jusqu’à Dieu. Il ne cesse pas jusqu’à ce que Dieu y prête attention et qu’un juge juste rende justice[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fasse le jugement ». On peut aussi traduire : « prononce le jugement ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec présente ici une formulation très différente : « Les yeux du Seigneur sont sur ceux qui l’aiment… » Le texte hébreu conservé a été suivi ; le passage demeure incertain au niveau de sa transmission.'
    reason: textual_variant
lexical_decisions:
- source_word: שועת
  choice: le cri de
  rationale: שועה désigne un appel au secours jailli de la détresse. « Cri » conserve son urgence tout en restant naturel en français.
- source_word: דל
  choice: du pauvre
  rationale: דל peut désigner une personne pauvre, démunie ou socialement faible. « Le pauvre » convient au contexte éthique et garde l’idée de vulnérabilité.
- source_word: ענן חלפה
  choice: traverse la nuée
  rationale: L’expression dépeint le cri franchissant la nuée pour monter jusqu’à Dieu. « Nuée » maintient le registre biblique sans rendre l’image obscure.
- source_word: ועד תגיע לא תנוח
  choice: ne trouve aucun repos avant de parvenir jusqu’à Dieu
  rationale: Les verbes au féminin renvoient au cri. Dieu, explicité dans la proposition suivante, est nommé ici en français pour rendre le mouvement intelligible. « Ne trouve aucun repos » préserve la personnification du cri persistant.
- source_word: לא תמוש
  choice: Il ne cesse pas
  rationale: מוש signifie souvent se retirer ou s’éloigner ; appliqué au cri, le sens contextuel est qu’il persiste sans cesser.
- source_word: יפקוד אל
  choice: avant que Dieu y prête attention
  rationale: פקד peut signifier visiter, prendre en considération ou intervenir. « Y prête attention » exprime la réponse attentive de Dieu sans préciser indûment la forme de son action.
- source_word: ושופט צדק
  choice: le juste Juge
  rationale: La construction présente Dieu comme un juge caractérisé par la justice. La majuscule signale que le titre renvoie ici à Dieu.
- source_word: יעשה משפט
  choice: rende justice
  rationale: L’idiome hébreu signifie littéralement « faire le jugement » ou « faire justice ». « Rendre justice » est naturel en français et conserve à la fois la portée judiciaire et la réparation attendue.
theological_decisions:
- issue: Destinataire implicite dans « avant de parvenir »
  choice: Nommer Dieu comme destinataire du cri
  alternative: 'Conserver l’objet implicite : « avant de parvenir à destination »'
  rationale: L’hébreu ne formule pas l’objet, mais la proposition suivante nomme explicitement Dieu. L’explicitation clarifie le sens sans ajouter une affirmation théologique étrangère au texte.
- issue: Portée de משפט
  choice: « rende justice » dans le texte principal
  alternative: « prononce le jugement » ou « exerce le jugement »
  rationale: Le contexte présente Dieu comme juge répondant au cri du pauvre. « Rende justice » garde la force judiciaire de l’expression tout en exprimant naturellement en français son effet en faveur de l’opprimé.
- issue: Divergence entre les témoins hébreu et grec
  choice: Traduire le texte hébreu conservé et signaler la divergence en note
  alternative: Suivre le texte grec, qui parle des yeux du Seigneur posés sur ceux qui l’aiment
  rationale: Le témoin hébreu fourni est direct et cohérent, mais le grec parallèle transmet ici un contenu entièrement différent. La divergence doit rester visible plutôt que d’être harmonisée.
translation_notes:
  register: Français international moderne, digne et accessible. « Nuée » préserve l’image biblique du texte hébreu ; « rende justice » donne un français idiomatique sans effacer le cadre judiciaire. Les deux marqueurs de note sont placés à la fin de la proposition concernée.
