  text: A man who has traveled[b] knows many things, and one with much experience will recount understanding.[a]
translation:
  language: fr
  text: Un homme instruit[a] connaît beaucoup de choses, et celui qui a une grande expérience exposera son discernement.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec signifie « instruit », « éduqué » ou « formé ». Le contexte immédiat évoque aussi l’expérience acquise par les voyages, mais « qui a voyagé » ne traduit pas directement ce mot.
    reason: lexical_alternative
  - marker: b
    text: 'Le témoin hébreu fourni présente ici une ligne très différente : « Dans toutes tes actions, affiche un visage joyeux, et donne avec joie la dîme de ce qui est consacré. » Comme cette ligne ne correspond pas au contexte de Siracide 34.9, le texte principal suit le témoin grec.'
    reason: textual_variant
lexical_decisions:
- source_word: ἀνὴρ πεπαιδευμένος
  choice: un homme instruit
  rationale: Le grec désigne littéralement un homme formé, éduqué ou instruit. Cette traduction conserve le sens lexical direct et le masculin proverbial du texte.
- source_word: ἔγνω πολλά
  choice: connaît bien des choses
  rationale: Cette formulation naturelle en français rend l’idée proverbiale d’avoir acquis de nombreuses connaissances.
- source_word: ὁ πολυπειρῶν
  choice: celui qui a beaucoup d’expérience
  rationale: Le participe grec souligne une expérience étendue; la formulation retenue est claire et idiomatique.
- source_word: ἐκδιηγήσεται
  choice: fera part
  rationale: Le verbe évoque le fait d’exposer ou de raconter en détail. « Fera part » restitue ici naturellement la communication d’un discernement acquis.
- source_word: σύνεσιν
  choice: de son discernement
  rationale: Ce terme sapientiel peut désigner l’intelligence, la compréhension ou le discernement. « Discernement » convient au registre de la sagesse et s’accorde avec l’expérience mentionnée.
theological_decisions:
- issue: Divergence majeure entre le témoin hébreu fourni et le parallèle grec
  choice: Suivre le grec dans le texte principal et signaler la divergence hébraïque en note.
  alternative: 'Traduire l’hébreu fourni : « Dans toutes tes actions, montre un visage joyeux, et prélève avec joie la dîme de ce qui est saint. »'
  rationale: La ligne hébraïque fournie ne correspond ni au sens ni au contexte de Siracide 34.9 et paraît déplacée. Le grec transmet ici une maxime cohérente avec le passage; la note préserve néanmoins en toute transparence le témoignage hébreu divergent.
- issue: Sens de πεπαιδευμένος
  choice: « instruit »
  alternative: « qui a voyagé »
  rationale: « Instruit » est le sens lexical le plus direct du grec. Le contexte peut toutefois évoquer une instruction acquise par les voyages et l’expérience; cette possibilité est donc conservée en note sans être imposée au texte principal.
translation_notes:
  register: Français international moderne, clair et digne. La tournure proverbiale reste fluide, tandis que les notes rendent visibles l’alternative lexicale grecque et la divergence majeure du témoin hébreu.
