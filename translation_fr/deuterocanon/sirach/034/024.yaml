lexical_decisions:
- source_word: οἰκοδομῶν
  choice: construit
  rationale: Le participe présent a ici une valeur générale et proverbiale. « Construit » conserve l’image concrète avec une formulation française naturelle.
- source_word: καθαιρῶν
  choice: démolit
  rationale: Le verbe désigne ici l’action d’abattre ce qui est construit. « Démolit » rend clairement l’opposition avec « construit ».
- source_word: τί ὠφέλησαν
  choice: quel avantage en ont-ils retiré
  rationale: L’aoriste de ὠφελέω porte sur le bénéfice obtenu. Cette formulation garde la question rhétorique et respecte le pluriel verbal grec.
- source_word: πλεῖον ἢ
  choice: sinon
  rationale: Dans ce contexte comparatif, l’expression demande quel bénéfice subsiste en dehors de la peine. « Sinon » rend idiomatiquement cette portée sans alourdir la phrase.
- source_word: κόπους
  choice: de la peine
  rationale: κόπος évoque le travail pénible, la fatigue ou les peines occasionnées. « De la peine » convient au registre proverbial et garde une certaine amplitude de sens.
theological_decisions:
- issue: Sujets singuliers à valeur proverbiale
  choice: L’un construit et l’autre démolit
  alternative: Quelqu’un construit et un autre démolit
  rationale: Les participes masculins singuliers sont employés substantivement et de façon générale. « L’un… l’autre… » préserve cette structure sans ajouter un nom absent du grec.
- issue: Portée de la question rhétorique
  choice: quel avantage en ont-ils retiré, sinon de la peine ?
  alternative: qu’ont-ils gagné de plus que de la peine ?
  rationale: La formulation exprime la vanité d’efforts opposés qui ne laissent pour résultat que la peine, tout en maintenant la question du texte grec plutôt qu’en l’explicitant comme une affirmation.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme concret est conservé, ainsi que la force rhétorique de la question.
