  text: One builds and another tears down—what did they gain beyond toil?[a]
translation:
  language: fr
  text: 'L’un construit et l’autre démolit : qu’ont-ils gagné de plus que de la peine ?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Quel avantage en ont-ils retiré, sinon de la peine ? »'
