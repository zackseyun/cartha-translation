  yaml_path: translation/deuterocanon/sirach/034/027.yaml
  text: Wine is like life to a man[a], if you drink it in due measure. What is life to one diminished by wine? For it too was created for human gladness.
translation:
  language: fr
  text: Le vin est comme la vie pour l’être humain, si tu le bois avec mesure. Quelle vie a celui qui manque de vin[a] ? Car lui aussi a été créé pour la joie des humains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une autre analyse : « celui que le vin amoindrit ». La formulation grecque est concise, et le rapport grammatical avec « vin » peut être compris de plusieurs façons.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἴσον ζωῆς
  choice: est comme la vie
  rationale: Le tour exprime une comparaison ou une équivalence. « Est comme la vie » reste proche du grec tout en étant naturel en français.
- source_word: ἀνθρώπῳ
  choice: pour l’être humain
  rationale: Le datif singulier a une portée générique. Cette formulation moderne inclut clairement toute personne sans particulariser le sexe.
- source_word: ἐὰν πίνῃς
  choice: si tu le bois
  rationale: Le tutoiement conserve l’adresse directe à la deuxième personne du singulier et le ton proverbial du grec.
- source_word: μέτρῳ αὐτοῦ
  choice: avec mesure
  rationale: Cette expression française rend naturellement l’idée de mesure appropriée, sans développer le texte en une exhortation explicite à la modération.
- source_word: τίς ζωὴ
  choice: Quelle vie a
  rationale: La formulation conserve la force concise de la question rhétorique tout en donnant une phrase française intelligible.
- source_word: ἐλασσουμένῳ οἴνῳ
  choice: celui que le vin amoindrit
  rationale: Le participe signifie littéralement « diminué » ou « amoindri ». Cette lecture comprend le datif οἴνῳ comme indiquant l’action ou la cause, mais l’ambiguïté réelle du grec est signalée en note.
- source_word: ἔκτισται
  choice: a été créé
  rationale: Le parfait passif présente le vin comme une réalité créée dont l’état et la destination demeurent.
- source_word: εἰς εὐφροσύνην ἀνθρώποις
  choice: pour la joie des humains
  rationale: εὐφροσύνη désigne la joie ou l’allégresse. La formulation est claire, digne et générique.
theological_decisions:
- issue: Finalité créée du vin
  choice: lui aussi a été créé pour la joie des humains
  alternative: il a été créé pour réjouir les humains
  rationale: Le texte attribue au vin une finalité positive dans la création, tandis que la condition « avec mesure » maintient la limite interne du passage. La traduction n’ajoute aucune doctrine d’abstinence ou de permissivité.
- issue: Sens de ἐλασσουμένῳ οἴνῳ
  choice: celui que le vin amoindrit
  alternative: celui qui manque de vin
  rationale: La syntaxe grecque est très concise et permet plus d’une analyse. Le texte principal retient l’idée d’une personne diminuée par le vin, cohérente avec l’appel à la mesure, mais la note préserve l’autre lecture sans trancher artificiellement.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement conserve la deuxième personne grecque. « L’être humain » et « les humains » rendent la portée générique sans alourdir la phrase.
