  terminology: « L’être humain » / « les humains » rendent convenablement la portée générique de ἄνθρωπος / ἄνθρωποι. « Avec mesure » est un équivalent idiomatique adéquat de μέτρῳ αὐτοῦ. « Joie » rend fidèlement εὐφροσύνη sans surinterprétation doctrinale.
