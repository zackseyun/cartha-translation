  source_fidelity: 'La première et la dernière propositions sont fidèles au grec. En revanche, la lecture principale de ἐλασσουμένῳ οἴνῳ comme « celui que le vin amoindrit » est moins probable. Dans ce contexte proverbial, le datif οἴνῳ se comprend plus naturellement comme ce dont la personne est privée ou déficiente : « celui qui manque de vin ». Cette compréhension est également cohérente avec la proposition suivante, qui attribue au vin une finalité de joie humaine. L’autre analyse doit demeurer en note, sans être présentée comme l’unique sens.'
