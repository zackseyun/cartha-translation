translation:
  language: fr
  text: La vision des rêves est une chose en regard d’une autre, comme l’image d’un visage en face d’un visage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, le grec, très elliptique, peut se rendre : « La vision des rêves : ceci en regard de cela ; en face d’un visage, l’image d’un visage. » L’expression peut évoquer la correspondance, l’opposition ou le reflet.'
    reason: Préserver l’ambiguïté syntaxique et comparative du grec.
lexical_decisions:
- source_word: ὅρασις ἐνυπνίων
  choice: une vision de rêve
  rationale: Cette formulation française idiomatique maintient le lien étroit entre la vision et le rêve, tout en rendant le pluriel grec de manière générique sans développer l’expression.
- source_word: τοῦτο κατὰ τούτου
  choice: une chose en regard d’une autre
  rationale: Le grec est elliptique. « En regard de » conserve l’idée de juxtaposition, de correspondance ou d’opposition, sans imposer une interprétation unique.
- source_word: κατέναντι προσώπου
  choice: face à un visage
  rationale: « Face à » exprime naturellement la position opposée ou vis-à-vis indiquée par κατέναντι et préserve la répétition de « visage ».
- source_word: ὁμοίωμα προσώπου
  choice: l’image d’un visage
  rationale: « Image » rend clairement l’idée de ressemblance ou de représentation portée par ὁμοίωμα, sans l’identifier au visage réel.
theological_decisions:
- issue: Portée de la comparaison concernant les rêves
  choice: Conserver l’image d’une chose placée en regard d’une autre, comme une image vis-à-vis d’un visage.
  alternative: Expliciter que le rêve est le reflet trompeur ou irréel de la réalité.
  rationale: Le contexte met en garde contre la confiance accordée aux rêves, mais ce verset reste imagé et elliptique. La traduction ne transforme donc pas la métaphore en affirmation doctrinale plus précise.
translation_notes:
  register: Français international moderne, sobre et proverbial. La structure en deux membres garde la densité de l’original tout en restant intelligible ; la note signale son caractère elliptique.
