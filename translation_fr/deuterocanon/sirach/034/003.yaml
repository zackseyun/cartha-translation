  source_fidelity: 'Le verset grec est volontairement elliptique : « vision des rêves », suivi de τοῦτο κατὰ τούτου (« ceci en regard de cela ») et de l’image d’un visage placé en face d’un visage. La traduction proposée préserve bien la comparaison et ne force ni le sens de correspondance ni celui de reflet. Toutefois, « une vision de rêve » peut en français évoquer une vision au caractère onirique et atténue le pluriel ἐνυπνίων. « La vision des rêves » rend plus directement le génitif pluriel et le caractère générique de l’énoncé.'
  naturalness: « La vision des rêves est une chose en regard d’une autre » reste dense et proverbial, conformément au grec, tout en étant plus net en français moderne que « Une vision de rêve, c’est… ». L’ajout prudent de « comme » dans le second membre explicite uniquement le rapport comparatif sous-entendu par la construction parallèle, sans résoudre l’ambiguïté de κατὰ.
  terminology: « Vision », « rêves », « image » et « visage » sont appropriés. « Image » rend naturellement ὁμοίωμα sans suggérer une identité avec l’objet représenté. Aucun terme théologique spécialisé n’est en cause.
