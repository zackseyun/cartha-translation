  text: Wine drunk at the proper time and in moderation is gladness of heart and joy of soul[a].
translation:
  language: fr
  text: Le vin bu au moment opportun et avec mesure est allégresse du cœur et joie de l’âme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le vin bu au bon moment, en quantité suffisante. » L’adjectif grec peut signifier plus littéralement « suffisant » ou « assez »; ici, il désigne vraisemblablement une consommation mesurée plutôt que l’excès.'
    reason: Alternative lexicale pour αὐτάρκης et préservation de l’ambiguïté du grec.
lexical_decisions:
- source_word: ἀγαλλίαμα
  choice: allégresse
  rationale: Le nom exprime une joie vive, voire exultante. « Allégresse » garde cette intensité et convient au parallélisme poétique.
- source_word: καρδίας
  choice: du cœur
  rationale: Ce génitif compact conserve l’expression poétique et son parallèle avec « de l’âme ».
- source_word: εὐφροσύνη
  choice: joie
  rationale: Le terme désigne la joie, la gaieté ou la réjouissance. « Joie » est naturel, digne et suffisamment large.
- source_word: ψυχῆς
  choice: de l’âme
  rationale: Dans ce contexte sapientiel, ψυχή renvoie à la vie intérieure ou à la personne. « Âme » préserve la profondeur anthropologique et le parallélisme avec le cœur.
- source_word: οἶνος
  choice: Le vin
  rationale: Traduction directe du sujet explicite de la phrase.
- source_word: πινόμενος
  choice: bu
  rationale: Le participe est rendu naturellement comme une qualification du vin, sans alourdir la formulation proverbiale.
- source_word: ἐν καιρῷ
  choice: au moment opportun
  rationale: καιρός désigne ici le moment qui convient, avec une nuance de justesse plutôt qu’une simple indication chronologique.
- source_word: αὐτάρκης
  choice: avec mesure
  rationale: L’adjectif signifie littéralement « suffisant » ou « assez ». Appliqué à la consommation du vin, il évoque vraisemblablement une quantité mesurée, sans excès; la note conserve toutefois le sens plus littéral.
theological_decisions:
- issue: Portée éthique de αὐτάρκης concernant le vin
  choice: Le verset présente positivement le vin lorsqu’il est consommé au moment qui convient et avec mesure.
  alternative: Le verset pourrait simplement dire que le vin, lorsqu’il est en quantité suffisante, procure de la joie.
  rationale: L’association de ἐν καιρῷ avec αὐτάρκης suggère à la fois l’à-propos du moment et l’adéquation de la quantité. La traduction « avec mesure » rend ce sens probable sans supprimer l’alternative littérale, signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le parallélisme « cœur / âme » et le ton bref d’un proverbe sapientiel.
