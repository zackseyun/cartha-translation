  text: For he is a God of justice[a], and with him there is no partiality.
translation:
  language: fr
  text: Car il est un Dieu de justice[a], et il n’y a chez lui aucune partialité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec fourni pour ce verset dans l’édition de Swete porte une autre phrase : « Bien des fois, j’ai couru un danger mortel, et j’en ai été délivré à cause de cela. » Cela signale probablement un décalage textuel ou de numérotation à cet endroit. La présente traduction suit le témoin hébreu conservé.'
    reason: textual_variant
lexical_decisions:
- source_word: כי
  choice: Car
  rationale: Introduit la raison de l’interdiction précédente et conserve clairement la valeur causale de l’hébreu.
- source_word: אלהי משפט
  choice: un Dieu de justice
  rationale: Le construit hébreu caractérise Dieu par la justice; cette formulation française naturelle préserve la valeur prédicative sans surdéterminer l’expression.
- source_word: משפט
  choice: justice
  rationale: Dans ce contexte, le terme désigne le caractère juste de Dieu dans l’exercice du jugement; « justice » en exprime bien la portée morale et judiciaire.
- source_word: אין עמו
  choice: il n’y a chez lui aucune
  rationale: Rend naturellement l’idiome hébreu exprimant ce qui est absent de la conduite ou du caractère de Dieu.
- source_word: משוא פנים
  choice: partialité
  rationale: Cet idiome désigne le favoritisme fondé sur la personne ou le rang; « partialité » garde ici la tonalité judiciaire.
theological_decisions:
- issue: Sens de משפט dans l’affirmation concernant le caractère de Dieu
  choice: justice
  alternative: jugement
  rationale: Le verset présente la nature morale et judiciaire de Dieu comme fondement du refus de la corruption et de l’oppression. « Justice » exprime plus directement cette affirmation en français contemporain.
- issue: Désaccord entre le témoin hébreu et le parallèle grec fourni
  choice: Suivre le témoin hébreu conservé et signaler l’écart grec en note
  alternative: Traduire la phrase grecque transmise à cet emplacement ou fusionner les deux traditions
  rationale: Le texte hébreu est ici le témoin principal indiqué, tandis que le grec fourni contient une phrase entièrement différente. La note maintient cette incertitude textuelle sans harmonisation.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « chez lui » est idiomatique tout en restant proche de la construction hébraïque; « partialité » conserve le cadre judiciaire.
