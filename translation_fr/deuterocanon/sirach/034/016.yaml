lexical_decisions:
- source_word: תמרורי
  choice: signes
  rationale: Le nom désigne vraisemblablement des indications ou marques visibles. « Signes » reste naturel et ne surinterprète pas le terme.
- source_word: רצון
  choice: faveur
  rationale: רצון peut exprimer la faveur, la bienveillance ou l’agrément. « Faveur » rend ici sobrement le rapport construit תמרורי רצון.
- source_word: הניחה
  choice: a placé
  rationale: Le verbe hiphil de נוח porte ici le sens concret de poser ou placer. « A placé » est clair et digne en français moderne.
- source_word: וצעקה
  choice: et un cri
  rationale: La forme est comprise comme un nom. Cette traduction conserve la brusquerie et la concision de l’hébreu.
- source_word: ענן
  choice: le nuage
  rationale: Le singulier concret est conservé avec l’article défini, conformément à la syntaxe poétique retenue.
- source_word: חשתה
  choice: a fait accourir
  rationale: La syntaxe est difficile, mais le verbe semble exprimer un mouvement précipité provoqué par le cri. « A fait accourir » restitue naturellement cette valeur causative en français.
theological_decisions:
- issue: Forte divergence textuelle entre l’hébreu et le grec
  choice: Suivre dans le texte principal l’hébreu conservé, tout en signalant la leçon grecque en note.
  alternative: « Et qui est son soutien ? »
  rationale: Puisque l’hébreu de Ben Sira est conservé ici, il constitue le témoin principal. Toutefois, le grec présente une phrase entièrement différente, susceptible de refléter un autre état du texte ou une autre Vorlage; cette divergence importante doit donc rester visible.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le caractère condensé et énigmatique de l’hébreu sans tenter d’en résoudre artificiellement la difficulté.
