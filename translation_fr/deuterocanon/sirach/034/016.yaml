  text: Il a placé des signes de faveur[a], et, à un cri, le nuage s’est hâté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle porte : « Et qui est son soutien ? » Il diffère profondément de l’hébreu conservé ici, ce qui laisse supposer une forme du texte sensiblement différente.'
