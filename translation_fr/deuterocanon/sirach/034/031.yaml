base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/031.yaml
  text: At a banquet of wine do not rebuke your neighbor[a], and do not belittle him in his gladness; do not speak a word of reproach to him, and do not distress him by making demands.
translation:
  language: fr
  text: Au cours d’un banquet où l’on boit du vin, ne reprends pas ton prochain et ne le rabaisse pas dans sa joie. Ne lui adresse aucune parole de reproche et ne l’accable pas de tes exigences.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne le presse pas en lui réclamant le remboursement » ; le terme grec peut désigner une demande ou une exaction, souvent au sens du recouvrement de ce qui est dû.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συμποσίῳ οἴνου
  choice: un banquet où l’on boit du vin
  rationale: Cette formulation exprime clairement un repas festif caractérisé par la consommation de vin, sans employer le familier « beuverie » ni ajouter une nuance péjorative absente du grec.
- source_word: ἐλέγξῃς
  choice: reprends
  rationale: Dans ce contexte de relations sociales, le verbe désigne le fait de réprimander ou de censurer quelqu’un. « Reprendre » convient au registre sapientiel et reste naturel en français.
- source_word: πλησίον
  choice: ton prochain
  rationale: « Prochain » conserve la portée éthique habituelle du terme, tout en pouvant désigner ici un compagnon ou un autre convive.
- source_word: ἐξουδενώσῃς
  choice: ne le rabaisse pas
  rationale: Le verbe signifie traiter quelqu’un comme s’il ne comptait pas, le mépriser ou l’amoindrir. « Rabaisser » rend bien l’acte social visé dans ce cadre festif.
- source_word: ἐν εὐφροσύνῃ αὐτοῦ
  choice: dans sa joie
  rationale: La locution décrit l’état de réjouissance de la personne pendant le banquet. Cette traduction demeure concise et préserve le lien explicite avec sa joie.
- source_word: λόγον ὀνειδισμοῦ
  choice: aucune parole de reproche
  rationale: Cette expression reproduit naturellement la construction grecque et maintient le ton digne de la littérature de sagesse.
- source_word: θλίψῃς
  choice: ne l’accable pas
  rationale: Le verbe peut signifier presser, affliger ou mettre dans la détresse. « Accabler » exprime ici une pression personnelle ou pratique sans imposer un sens uniquement physique.
- source_word: ἐν ἀπαιτήσει
  choice: de tes exigences
  rationale: Le nom peut désigner une demande insistante, une réclamation ou une exaction, souvent liée au recouvrement d’une somme due. Le texte principal conserve le sens large, tandis que la note signale la nuance financière possible.
