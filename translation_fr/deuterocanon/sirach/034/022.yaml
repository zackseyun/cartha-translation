  text: Bread for the needy is the life of the poor[a]; the one who deprives them of it is a man of blood.
translation:
  language: fr
  text: Le pain de ceux qui sont dans le besoin est la vie des pauvres ; celui qui les en prive est un homme de sang[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un meurtrier » ou « un homme coupable d’effusion de sang ». Le grec dit littéralement « un homme de sang ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρτος
  choice: Le pain
  rationale: Conserve l’image concrète du grec tout en désignant naturellement la nourriture indispensable.
- source_word: ἐπιδεομένων
  choice: de ceux qui sont dans le besoin
  rationale: Le participe désigne ceux qui manquent du nécessaire ; cette formulation française est claire et respecte le rapport génitif.
- source_word: ζωὴ πτωχῶν
  choice: est la vie des pauvres
  rationale: Suit de près la construction grecque et exprime que ce pain assure la subsistance, donc la vie, des pauvres.
- source_word: ὁ ἀποστερῶν αὐτὴν
  choice: celui qui les en prive
  rationale: ἀποστερέω signifie priver quelqu’un de ce qui lui revient ou lui est nécessaire. « Les » explicite les personnes affectées et « en » reprend le pain, conformément au sens contextuel de αὐτήν.
- source_word: ἄνθρωπος αἱμάτων
  choice: un homme de sang
  rationale: Cette traduction garde l’expression grecque marquée, probablement sémitisante, et sa forte accusation morale sans la réduire d’emblée au terme juridique « meurtrier ».
theological_decisions:
- issue: Portée morale de l’expression ἄνθρωπος αἱμάτων appliquée à celui qui prive les pauvres de pain
  choice: un homme de sang
  alternative: un meurtrier ; un homme coupable d’effusion de sang
  rationale: Le texte assimile la privation du nécessaire à une responsabilité dans la mort. Maintenir l’idiome préserve cette tension et la vigueur de l’accusation sans en imposer une seule interprétation.
translation_notes:
  register: Français international moderne, clair et digne. La structure sentencieuse et le parallélisme du grec sont conservés ; l’idiome « homme de sang » est maintenu dans le texte et éclairé en note.
