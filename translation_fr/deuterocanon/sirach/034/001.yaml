  text: Empty and false hopes are for a senseless man[b][a], and dreams give wings to fools.
translation:
  language: fr
  text: Les espoirs vides et trompeurs sont le lot de l’homme sans discernement, et les rêves donnent des ailes aux insensés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les rêves donnent des ailes aux insensés », image suggérant qu’ils les exaltent ou les emportent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κεναὶ
  choice: vides
  rationale: Conserve directement l’image d’espoirs dépourvus de substance, tout en restant naturel en français.
- source_word: ψευδεῖς
  choice: trompeurs
  rationale: Exprime le caractère faux et propre à égarer de ces espoirs; « faux » reste possible, mais la coordination « vides et trompeurs » est plus idiomatique.
- source_word: ἐλπίδες
  choice: espoirs
  rationale: Correspond au sens courant du nom grec et convient au caractère proverbial de la phrase.
- source_word: ἀσυνέτῳ ἀνδρί
  choice: de l’homme sans discernement
  rationale: Maintient le singulier masculin proverbial et distingue le manque de compréhension exprimé ici de l’insanité morale ou pratique évoquée ensuite par ἄφρονας.
- source_word: ἐνύπνια
  choice: les rêves
  rationale: Rend le sens ordinaire du terme sans ajouter l’idée plus spécifique de visions.
- source_word: ἀναπτεροῦσιν
  choice: donnent des ailes à
  rationale: Préserve la métaphore vive du grec, selon laquelle les rêves exaltent ou emportent les insensés.
- source_word: ἄφρονας
  choice: les insensés
  rationale: Terme courant du registre sapientiel français pour ceux qui manquent de jugement; il évite de répéter « sans discernement ».
theological_decisions:
- issue: Singulier masculin proverbial ἀσυνέτῳ ἀνδρί
  choice: l’homme sans discernement
  alternative: la personne sans discernement
  rationale: Le grec emploie explicitement ἀνήρ au masculin singulier dans une maxime de portée générale. La traduction conserve cette forme sans restreindre artificiellement l’application du proverbe aux seuls hommes.
- issue: Portée de la métaphore ἀναπτεροῦσιν
  choice: donnent des ailes aux insensés
  alternative: emportent les insensés
  rationale: La formulation littérale préserve l’ambiguïté de l’image, qui peut suggérer l’exaltation, l’agitation ou l’entraînement loin de la réalité, sans imposer une seule interprétation.
translation_notes:
  register: Français moderne, digne et proverbial. « Sont le lot de » rend naturellement le datif grec sans ajouter une relation stricte de possession. La métaphore finale est maintenue dans le texte; la note en explicite seulement les résonances possibles.
