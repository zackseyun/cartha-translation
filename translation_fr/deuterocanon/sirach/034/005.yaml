base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/005.yaml
  text: Divinations and omens[b] and dreams are empty, and the heart imagines them like a woman in labor.[a]
translation:
  language: fr
  text: Les pratiques divinatoires, l’interprétation des présages[b] et les rêves sont vains, et le cœur se forge des images comme une femme en travail.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La ligne hébraïque conservée fournie pour ce verset dit : « D’un œil bienveillant, donne au pauvre, et ne t’irrite pas lorsque tu lui donnes. » Elle semble appartenir à un autre verset ou provenir d’un témoin mal associé. La traduction suit ici le texte grec.'
    reason: textual_variant
  - marker: b
    text: 'Ou : « les augures ». Le terme grec désigne l’interprétation de signes considérés comme des annonces de l’avenir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαντεῖαι
  choice: les pratiques divinatoires
  rationale: Le terme grec désigne les pratiques de divination. Cette formulation est naturelle en français moderne et évite le sens courant différent de « divinations ».
- source_word: οἰωνισμοί
  choice: les présages
  rationale: Le terme renvoie à l’interprétation de signes tenus pour annonciateurs. « Présages » est clair et courant; « augures » est possible mais plus technique.
- source_word: ἐνύπνια
  choice: les rêves
  rationale: Équivalent direct et sobre, sans ajouter l’idée plus précise de vision.
- source_word: μάταιά
  choice: vains
  rationale: Exprime ici le caractère creux, futile et peu fiable de ces phénomènes, dans un registre biblique encore naturel.
- source_word: φαντάζεται
  choice: se forge des images
  rationale: Le verbe évoque la production d’apparences ou de représentations mentales. Cette traduction conserve l’activité imaginative sans imposer l’idée de délire.
- source_word: καρδία
  choice: le cœur
  rationale: Conserve la métaphore biblique du centre intérieur de la pensée et des sentiments.
- source_word: ὡς ὠδινούσης
  choice: comme une femme en travail
  rationale: Le participe féminin évoque une femme éprouvant les douleurs de l’enfantement. La formulation est concise et naturelle.
theological_decisions:
- issue: Discordance majeure entre la ligne hébraïque fournie et le parallèle grec de Siracide 34.5
  choice: Traduire le grec comme témoin opérant du verset et signaler la discordance en note.
  alternative: 'Traduire la ligne hébraïque fournie : « D’un œil bienveillant, donne au pauvre, et ne t’irrite pas lorsque tu lui donnes. »'
  rationale: La ligne hébraïque transmise est sans rapport sémantique avec le contexte grec de Siracide 34.5 et le dossier la signale comme une discordance majeure. Le grec fournit ici la lecture cohérente du verset; l’incertitude textuelle demeure explicitement visible en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme coordonné du grec est conservé, ainsi que l’image biblique du cœur et la comparaison avec une femme en travail.
