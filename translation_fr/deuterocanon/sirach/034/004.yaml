  yaml_path: translation/deuterocanon/sirach/034/004.yaml
  text: From the unclean[a], what will be made clean? And from falsehood, what will become true?
translation:
  language: fr
  text: De ce qui est impur, qu’est-ce qui sera purifié ? Et de ce qui est faux, qu’est-ce qui deviendra vrai ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Et d’un mensonge, qu’est-ce qui se révélera vrai ? » Le verbe grec peut aussi signifier « dire la vérité » ou « se révéler vrai ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ
  choice: de
  rationale: La préposition marque ici l’origine ou la provenance dans les deux propositions ; « de » restitue naturellement ce rapport en français.
- source_word: ἀκαθάρτου
  choice: ce qui est impur
  rationale: L’adjectif au génitif est employé comme substantif. « Ce qui est impur » conserve sa portée générique sans préciser indûment une chose ou une personne.
- source_word: τί
  choice: qu’est-ce qui
  rationale: Le pronom interrogatif introduit une question rhétorique portant sur ce qui pourrait provenir de la source évoquée.
- source_word: καθαρισθήσεται
  choice: sera purifié
  rationale: Le futur passif de καθαρίζω est rendu explicitement par un futur passif. « Purifié » préserve la notion de rendre pur sans imposer exclusivement un cadre rituel.
- source_word: ψευδοῦς
  choice: ce qui est faux
  rationale: L’adjectif substantivé peut désigner le faux ou le mensonge. « Ce qui est faux » maintient la généralité et le parallélisme avec « ce qui est impur ».
- source_word: ἀληθεύσει
  choice: deviendra vrai
  rationale: 'Dans ce parallélisme proverbial, le verbe est compris au sens résultatif : ce qui procède du faux ne saurait devenir vrai. La formulation garde toutefois en note les autres valeurs possibles du verbe.'
theological_decisions:
- issue: Sens de ἀληθεύσει dans le parallélisme proverbial
  choice: 'sens résultatif : « deviendra vrai »'
  alternative: « dira la vérité » ou « se révélera vrai »
  rationale: Les deux questions portent vraisemblablement sur le résultat qui peut provenir d’une source impure ou fausse. Le sens résultatif rend clairement cette logique sans éliminer les autres possibilités lexicales, signalées en note.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme syntaxique est conservé, ainsi que les deux questions rhétoriques et l’ambiguïté lexicale de la seconde, explicitée en note.
