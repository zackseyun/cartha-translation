  naturalness: La formulation est claire, sobre et naturelle en français international moderne. La répétition de « qu’est-ce qui » convient au rythme rhétorique et proverbial. « Deviendra vrai » est un peu plus littéral que « se révélera vrai », mais reste intelligible et sert utilement le parallélisme de résultat avec « sera purifié ».
