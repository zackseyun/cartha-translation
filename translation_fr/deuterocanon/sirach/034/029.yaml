  text: Wine drunk in excess is bitterness of soul[a], in provocation and downfall.
translation:
  language: fr
  text: Le vin bu avec excès est une amertume pour l’âme[a], avec irritation et chute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le vin bu avec excès est une amertume de l’âme, dans l’irritation et le trébuchement. » Les deux derniers noms grecs sont très compacts et admettent plusieurs nuances.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πικρία
  choice: amertume
  rationale: Conserve l’image grecque d’un état amer sans la réduire à la tristesse ni au ressentiment.
- source_word: ψυχῆς
  choice: de l’âme
  rationale: Rend directement le génitif et préserve le langage anthropologique du grec, qui vise ici la vie intérieure de la personne.
- source_word: οἶνος
  choice: Le vin
  rationale: Le terme désigne précisément le vin; aucune généralisation à l’alcool n’est nécessaire.
- source_word: πινόμενος πολὺς
  choice: bu avec excès
  rationale: Expression française naturelle qui fait porter l’avertissement sur la quantité consommée, non sur le vin en lui-même.
- source_word: ἐν ἐρεθισμῷ
  choice: dans l’irritation
  rationale: Préserve la construction compacte avec ἐν et le sens d’excitation hostile, d’exaspération ou d’irritation.
- source_word: ἀντιπτώματι
  choice: la chute
  rationale: Le nom évoque le fait de trébucher ou de tomber; « chute » maintient cette image tout en permettant une portée plus large.
