  text: Unless it is sent from the Most High in visitation[b][a], do not give your heart to them.
translation:
  language: fr
  text: À moins qu’il ne soit envoyé par le Très-Haut à l’occasion d’une visitation[a], ne donne pas ton cœur à ces choses[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « À l’occasion d’une visitation » peut aussi se comprendre comme « au temps de la visitation » ou « dans le cadre d’une inspection ou d’une surveillance divine ».
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « à elles » ; il s’agit des songes et des expériences semblables mentionnés dans le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν μὴ
  choice: À moins que… ne
  rationale: Cette tournure française naturelle rend la condition négative et conserve la force de l’avertissement.
- source_word: παρὰ Ὑψίστου
  choice: par le Très-Haut
  rationale: Avec le passif « soit envoyé », « par » exprime naturellement l’origine et l’agent, tandis que « le Très-Haut » conserve le titre divin.
- source_word: ἀποσταλῇ
  choice: il ne soit envoyé
  rationale: Le subjonctif passif français correspond à l’aoriste passif subjonctif régi par la proposition conditionnelle. Le pronom singulier conserve le sujet implicite du grec, compris d’après le contexte comme un songe.
- source_word: ἐν ἐπισκοπῇ
  choice: à l’occasion d’une visitation
  rationale: « Visitation » maintient le champ sémantique d’une visite ou intervention divine sans le réduire à une inspection, un jugement ou une surveillance. « À l’occasion de » produit une expression française intelligible tout en laissant ouverte sa valeur circonstancielle.
- source_word: μὴ δῷς
  choice: ne donne pas
  rationale: La formulation conserve l’impératif négatif et la métaphore explicite du verbe « donner ».
- source_word: εἰς αὐτὰ
  choice: à ces choses
  rationale: Le neutre pluriel renvoie aux songes et phénomènes analogues du contexte. « Ces choses » en garde le nombre et évite de créer un antécédent personnel.
- source_word: τὴν καρδίαν σου
  choice: ton cœur
  rationale: Cette traduction préserve la métaphore biblique du centre intérieur de l’attention, de la confiance et de l’engagement.
theological_decisions:
- issue: Sens de ἐν ἐπισκοπῇ
  choice: Conserver une expression ouverte avec « à l’occasion d’une visitation »
  alternative: dans l’exercice d’une surveillance ; au temps de la visitation ; pour une inspection
  rationale: Le terme peut évoquer une visite, une inspection, une surveillance ou une intervention divine. La traduction retenue ne précise ni jugement ni providence et préserve ainsi l’ambiguïté théologique du grec.
- issue: Référent du singulier implicite et du pluriel αὐτά
  choice: Maintenir « il » au singulier, puis rendre αὐτά par « ces choses »
  alternative: Expliciter « un songe » et reprendre par « les songes »
  rationale: Le grec laisse le sujet singulier implicite mais emploie ensuite un pronom neutre pluriel renvoyant au contexte. La traduction conserve cette tension grammaticale au lieu de l’harmoniser silencieusement.
translation_notes:
  register: Français international moderne, sobre et digne. La métaphore « donner son cœur » est volontairement conservée malgré son caractère moins courant, afin de ne pas réduire le sens à la seule attention intellectuelle. Le terme biblique « visitation » est maintenu et éclairé en note.
