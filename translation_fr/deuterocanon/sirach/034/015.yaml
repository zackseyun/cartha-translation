translation:
  language: fr
  text: Comprends ce qui concerne ton prochain en partant de toi-même, et, dans toute affaire, réfléchis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin hébreu conservé est très différent : « Une larme ne descend-elle pas sur la joue, et un soupir à cause de ses destructeurs ou rebelles ? » Le dernier terme hébreu est incertain et peut aussi être compris autrement. La tradition textuelle de ce verset est incertaine ; le texte principal suit le grec.'
    reason: alternative_reading
lexical_decisions:
- source_word: νόει
  choice: Comprends
  rationale: L’impératif grec appelle à discerner ou comprendre avec réflexion. « Comprends » reste naturel et évite la nuance judiciaire que pourrait suggérer « juge ».
- source_word: τὰ τοῦ πλησίον
  choice: ce que vit ton prochain
  rationale: L’expression grecque désigne littéralement « les choses de ton prochain ». Cette formulation française conserve une certaine largeur de sens — situation, expérience, intérêts — sans la limiter aux seuls sentiments.
- source_word: ἐκ σεαυτοῦ
  choice: en partant de toi-même
  rationale: La locution indique que l’expérience personnelle sert de point de comparaison pour comprendre autrui.
- source_word: ἐπὶ παντὶ πράγματι
  choice: à toute chose
  rationale: Cette expression rend la portée générale de l’exhortation et le sens concret de πρᾶγμα.
- source_word: διανοοῦ
  choice: réfléchis
  rationale: L’impératif exprime une réflexion attentive et délibérée; « réfléchis » est direct, actuel et digne.
- source_word: הלא דמעה על לחי תרד, ואנחה על מרודיה
  choice: Une larme ne descend-elle pas sur la joue, et un gémissement ne s’élève-t-il pas à cause de ceux qui la font souffrir ?
  rationale: Cette traduction, placée en note comme variante, restitue l’image du témoin hébreu. Le dernier mot est difficile et peut renvoyer à des oppresseurs, destructeurs ou rebelles; une formulation fonctionnelle conserve l’idée de souffrance sans prétendre lever toute l’incertitude.
theological_decisions:
- issue: Divergence majeure entre le témoin hébreu conservé et le parallèle grec
  choice: Suivre le parallèle grec dans le texte principal et signaler intégralement le témoin hébreu en note
  alternative: 'Traduire dans le texte principal : « Une larme ne descend-elle pas sur la joue, et un gémissement ne s’élève-t-il pas à cause de ceux qui la font souffrir ? »'
  rationale: Le texte hébreu fourni est signalé comme présentant une divergence majeure et ne correspond pas à l’exhortation sapientielle cohérente du grec. La leçon grecque est donc retenue pour le texte principal, tandis que la note rend transparente la différence substantielle de la tradition hébraïque.
translation_notes:
  register: Français international moderne, au tutoiement sapientiel traditionnel. Formulation concise et digne. « Ce que vit ton prochain » préserve mieux que « les sentiments de ton prochain » l’étendue sémantique du grec, tandis que la note expose sans la résoudre artificiellement la forte divergence du témoin hébreu.
