  text: Without falsehood the law will be fulfilled[b][a], and wisdom is perfection for a faithful mouth.
translation:
  language: fr
  text: Sans mensonge, la loi sera accomplie, et la sagesse est l’accomplissement dans une bouche fidèle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et la sagesse est la perfection pour une bouche fidèle ». La syntaxe grecque de cette dernière proposition est concise et difficile; le rapport exact entre « accomplissement » et « bouche fidèle » demeure incertain.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνευ ψεύδους
  choice: sans mensonge
  rationale: La préposition privative ἄνευ suivie du génitif exprime l’absence. « Sans mensonge » est naturel et conserve la portée morale de ψεῦδος.
- source_word: συντελεσθήσεται
  choice: sera accomplie
  rationale: Le futur passif de συντελέω évoque ce qui est mené à son terme ou réalisé pleinement. « Sera accomplie » convient à νόμος sans exclure la nuance d’achèvement.
- source_word: νόμος
  choice: la Loi
  rationale: Rendu direct de νόμος. La majuscule signale ici la Loi comme réalité religieuse reconnue, sans réduire le terme à une simple instruction.
- source_word: σοφία
  choice: la sagesse
  rationale: Équivalent français courant et précis de σοφία.
- source_word: στόματι πιστῷ
  choice: dans une bouche fidèle
  rationale: Le datif peut naturellement recevoir une valeur locale ou relationnelle. Cette formulation garde l’image concrète de la bouche et évite de préciser excessivement le rapport syntaxique.
- source_word: τελείωσις
  choice: l’accomplissement
  rationale: Le nom désigne l’action ou l’état de mener à son terme. « Accomplissement » maintient la proximité lexicale avec συντελεσθήσεται et convient mieux ici que le français absolu « perfection ».
theological_decisions:
- issue: Portée de νόμος dans un contexte sapientiel
  choice: la Loi
  alternative: l’instruction
  rationale: Le grec porte explicitement νόμος. La traduction conserve ce terme sans imposer le sens plus étroit d’enseignement sapientiel.
- issue: Construction de στόματι πιστῷ τελείωσις
  choice: « l’accomplissement dans une bouche fidèle »
  alternative: « la perfection pour une bouche fidèle »
  rationale: La proposition grecque est compacte et permet plusieurs rattachements du datif. Le texte principal rend le datif par « dans », tandis que la note préserve une autre analyse possible sans résoudre artificiellement l’ambiguïté.
translation_notes:
  register: Français international moderne, sobre et sentencieux. La structure parallèle et l’image de la « bouche fidèle » sont conservées. Une note signale franchement la difficulté syntaxique du dernier membre.
