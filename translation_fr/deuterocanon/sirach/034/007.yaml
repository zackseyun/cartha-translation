  text: For dreams have misled many[b][a], and those who hoped in them have fallen.
translation:
  language: fr
  text: Car les rêves ont égaré beaucoup de gens[a], et ceux qui mettaient leur espoir en eux sont tombés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «induit beaucoup de gens en erreur».
    reason: lexical_alternative
  - marker: b
    text: Le grec dit littéralement «sont tombés»; selon le contexte, l’expression peut évoquer l’échec ou la ruine.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὺς
  choice: beaucoup de gens
  rationale: L’accusatif pluriel désigne un grand nombre de personnes; «beaucoup de gens» rend explicitement et naturellement cette référence humaine en français.
- source_word: ἐπλάνησεν
  choice: ont égaré
  rationale: Le verbe exprime l’idée de faire dévier ou d’induire en erreur. «Ont égaré» conserve cette image sans accentuer indûment la notion de tromperie intentionnelle.
- source_word: τὰ ἐνύπνια
  choice: les rêves
  rationale: «Les rêves» est le terme français courant et précis dans ce contexte; «visions en rêve» serait plus explicatif que le grec.
- source_word: ἐξέπεσαν
  choice: sont tombés
  rationale: 'Cette traduction préserve la métaphore grecque et son ambiguïté: il peut s’agir d’un échec, d’une chute ou de la ruine.'
- source_word: ἐλπίζοντες
  choice: ceux qui mettaient leur espoir
  rationale: Le participe désigne les personnes concernées et présente leur confiance dans les rêves comme la circonstance de leur chute.
- source_word: ἐπʼ αὐτοῖς
  choice: en eux
  rationale: Le pronom renvoie aux rêves; «mettre son espoir en» est une tournure française naturelle.
theological_decisions:
- issue: Portée de la mise en garde contre les rêves
  choice: Le verset avertit que les rêves ont égaré beaucoup de personnes et que ceux qui s’y fiaient sont tombés.
  alternative: Comprendre le verset comme une condamnation sans exception de tout rêve, ou comme visant uniquement les fausses interprétations de rêves.
  rationale: Le grec attribue aux rêves le fait d’avoir égaré beaucoup de gens et relie la chute au fait de mettre son espoir en eux. Il ne précise ni que tous les rêves sont faux ni qu’il s’agit seulement de leur interprétation.
translation_notes:
  register: Français moderne, international et digne. La formulation reste proche de la structure grecque tout en étant naturelle; elle conserve la métaphore de la chute et évite de préciser au-delà du texte la nature exacte du malheur.
