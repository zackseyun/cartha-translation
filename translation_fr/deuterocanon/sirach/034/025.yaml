lexical_decisions:
- source_word: εἷς … καὶ εἷς
  choice: L’un … et l’autre
  rationale: Rend naturellement en français la mise en parallèle de deux personnes distinctes.
- source_word: εὐχόμενος
  choice: prie
  rationale: Dans l’opposition avec καταρώμενος, le sens de prier convient au contexte.
- source_word: καταρώμενος
  choice: maudit
  rationale: Conserve le sens fort de prononcer une malédiction, sans l’atténuer.
- source_word: τίνος φωνῆς
  choice: laquelle de ces voix
  rationale: Préserve l’interrogation portant sur l’appartenance ou l’identité de la voix, tout en donnant une formulation française claire.
- source_word: εἰσακούσεται
  choice: écoutera
  rationale: Exprime ici le fait de prêter une oreille favorable ou de répondre, sans expliciter davantage que le grec.
- source_word: ὁ δεσπότης
  choice: le Maître
  rationale: Reproduit le titre grec désignant celui qui détient l’autorité, sans le remplacer par un titre divin différent.
theological_decisions:
- issue: Réponse divine à deux paroles contradictoires
  choice: Conserver la question ouverte
  alternative: Préciser que Dieu n’exaucera ni l’un ni l’autre
  rationale: Le grec pose une question rhétorique sans fournir explicitement la réponse dans ce verset; la traduction ne doit pas la résoudre.
