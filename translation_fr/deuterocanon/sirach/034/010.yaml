  text: A man who has not been tested knows little, but one who has wandered[b] increases cunning[c][a].
translation:
  language: fr
  text: Qui n’a pas été mis à l’épreuve sait peu ; mais celui qui a erré[b] accroît sa ruse[c].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La ligne hébraïque conservée qui est fournie pour ce verset ne correspond pas au texte grec ; la traduction suit donc ici le témoin grec.
    reason: textual_variant
  - marker: b
    text: Ou « celui qui s’est égaré » ou « celui qui a été induit en erreur ». Le grec peut évoquer l’errance ou l’égarement, au sens littéral comme au sens figuré.
    reason: alternative_reading
  - marker: c
    text: Ou « habileté », « adresse » ou « sagacité ». Le mot grec peut avoir une nuance péjorative de ruse ou de fourberie.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς οὐκ ἐπειράθη
  choice: qui n’a pas été mis à l’épreuve
  rationale: Le grec exprime l’épreuve qui donne de l’expérience. Cette formulation conserve l’image de l’épreuve sans réduire le sens à une simple absence d’expérience.
- source_word: ὀλίγα οἶδεν
  choice: sait peu
  rationale: Rendu français naturel et concis de l’expression désignant un savoir limité.
- source_word: ὁ δὲ πεπλανημένος
  choice: mais celui qui a beaucoup voyagé
  rationale: Le participe de πλανάω peut évoquer l’errance, les déplacements ou le fait de s’égarer. Dans ce contraste sapientiel, « a beaucoup voyagé » rend naturellement l’expérience acquise au fil des déplacements, tandis que la note préserve les nuances moins positives.
- source_word: πληθυνεῖ
  choice: accroît
  rationale: Le verbe signifie augmenter ou multiplier ; « accroît » s’accorde naturellement avec le complément abstrait.
- source_word: πανουργίαν
  choice: sa sagacité
  rationale: πανουργία peut désigner une habileté pratique, mais aussi la ruse. « Sagacité » convient au contexte de l’expérience acquise, et la note signale la possible nuance péjorative.
theological_decisions:
- issue: Discordance majeure entre le texte hébreu fourni et le témoin grec
  choice: Traduire ici le témoin grec et signaler la discordance en note
  alternative: 'Traduire la ligne hébraïque fournie : « Donne-lui selon le don qu’il t’a fait, de bon cœur et selon tes moyens. »'
  rationale: La ligne hébraïque transmise ne correspond pas au contenu de Siracide 34.10, tandis que le grec donne la maxime attendue à cette référence. La traduction suit donc le témoin grec sans dissimuler le problème textuel.
- issue: Valeur du participe πεπλανημένος
  choice: Retenir l’expérience des voyages dans le texte, avec les autres nuances en note
  alternative: « celui qui a erré » ou « celui qui s’est égaré »
  rationale: Le contexte oppose le manque d’épreuve à l’expérience qui développe le discernement pratique. Toutefois, le grec garde une ambiguïté entre voyage, errance et égarement, laquelle est explicitement conservée en note.
- issue: Nuance morale de πανουργία
  choice: « sagacité » dans le texte, avec « ruse » en note
  alternative: « ruse » ou « habileté »
  rationale: Le terme peut être favorable ou péjoratif selon le contexte. Le choix principal rend la pointe sapientielle sans effacer la nuance potentiellement négative.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure générique « qui… celui qui » évite d’ajouter un référent masculin absent du grec. Les notes documentent la discordance des témoins et préservent les ambiguïtés lexicales.
