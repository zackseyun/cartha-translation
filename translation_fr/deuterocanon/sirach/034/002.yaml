  text: Like one grasping at a shadow and chasing the wind[a], so is one who clings to dreams.
translation:
  language: fr
  text: Comme celui qui cherche à saisir une ombre et poursuit le vent, ainsi en est-il de celui qui s’attache aux rêves[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui se fie aux rêves » ou « qui prête attention aux rêves ». Le verbe grec peut exprimer l’attachement, la confiance ou l’attention accordée à quelque chose.
    reason: lexical_alternative
lexical_decisions:
- source_word: δρασσόμενος
  choice: qui cherche à saisir
  rationale: Le participe évoque l’action de prendre ou d’agripper avec la main. « Cherche à saisir » rend naturellement en français l’effort nécessairement vain de saisir une ombre, sans effacer l’image grecque.
- source_word: σκιᾶς
  choice: une ombre
  rationale: Le nom désigne ici une ombre, réalité insaisissable qui porte l’image de la vanité de l’effort.
- source_word: διώκων ἄνεμον
  choice: poursuit le vent
  rationale: Cette formulation conserve directement la métaphore grecque de la poursuite futile tout en restant naturelle et digne en français moderne.
- source_word: ὁ ἐπέχων
  choice: celui qui s’attache
  rationale: Le verbe peut exprimer le fait de tenir à quelque chose, de s’y appliquer, de lui prêter attention ou de s’y fier. « S’attache » convient à la comparaison négative sans réduire toute l’étendue du terme à la seule idée de confiance.
- source_word: ἐνυπνίοις
  choice: aux rêves
  rationale: Le pluriel désigne les rêves ou visions survenant pendant le sommeil. « Rêves » est le terme français moderne le plus clair et le moins marqué.
theological_decisions:
- issue: Portée de ὁ ἐπέχων ἐνυπνίοις
  choice: celui qui s’attache aux rêves
  alternative: celui qui prête attention aux rêves ; celui qui se fie aux rêves
  rationale: 'La comparaison dénonce une relation vaine aux rêves, mais le verbe grec permet plusieurs nuances : attachement, attention ou dépendance. Le texte principal conserve une formulation assez large, et la note signale les autres lectures plausibles sans imposer une interprétation doctrinale.'
translation_notes:
  register: Français international moderne, clair et digne. La structure comparative du grec est conservée, ainsi que les images concrètes de l’ombre et du vent. « Ainsi en est-il » évite une phrase nominale raide tout en maintenant le parallélisme.
