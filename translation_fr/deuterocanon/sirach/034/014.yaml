  text: One who fears the Lord will not be shaken, and will not be afraid, for he is his hope.
translation:
  language: fr
  text: Celui qui craint le Seigneur ne sera pas ébranlé et n’aura pas peur, car le Seigneur est son espérance.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La ligne hébraïque fournie par les manuscrits de la Guéniza du Caire dit : « Il ne négligera pas le cri de l’orphelin, ni la veuve lorsqu’elle multiplie sa plainte. » Elle ne correspond pas au texte grec de ce verset et provient probablement d’un décalage de vers ou de référence dans les données sources.'
    reason: textual_variant
lexical_decisions:
- source_word: ὁ φοβούμενος
  choice: Celui qui craint
  rationale: Le participe substantivé désigne de manière générale une personne caractérisée par la crainte révérencielle du Seigneur; cette formulation conserve le singulier représentatif dans un français naturel.
- source_word: Κύριον
  choice: le Seigneur
  rationale: Rendu comme titre divin usuel; l’article défini convient à l’usage français.
- source_word: οὐ μὴ πτοηθῇ
  choice: ne sera pas ébranlé
  rationale: La forte négation grecque exclut l’idée d’être saisi d’effroi ou déstabilisé. « Ébranlé » conserve cette double nuance et se distingue de la peur exprimée dans la proposition suivante.
- source_word: οὐ μὴ δειλιάσῃ
  choice: n’aura pas peur
  rationale: Le verbe évoque la crainte et la perte de courage. Cette traduction actuelle et claire évite de lui donner artificiellement le sens moral de lâcheté.
- source_word: ἐλπὶς
  choice: espérance
  rationale: Le terme désigne à la fois l’espérance et ce sur quoi repose la confiance. « Espérance » garde ici sa portée théologique tout en restant intelligible.
- source_word: αὐτός
  choice: le Seigneur
  rationale: Le pronom emphatique renvoie naturellement au Seigneur. Répéter le nom en français lève toute ambiguïté possible sur son antécédent sans changer le sens.
theological_decisions:
- issue: Divergence majeure entre la ligne hébraïque fournie et le texte grec de Siracide 34.14
  choice: Retenir le texte grec dans le corps du verset
  alternative: 'Traduire la ligne hébraïque fournie : « Il ne négligera pas le cri de l’orphelin, ni la veuve lorsqu’elle multiplie sa plainte. »'
  rationale: La ligne hébraïque transmise ne correspond ni au sens ni au contexte textuel du grec pour cette référence et les données signalent explicitement un décalage majeur. Le grec offre ici le texte cohérent du verset; la leçon hébraïque divergente est néanmoins signalée intégralement en note afin de préserver la transparence textuelle.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme grec est conservé par « ne sera pas ébranlé et n’aura pas peur ». La répétition de « le Seigneur » dans la dernière proposition clarifie le référent du pronom grec emphatique.
