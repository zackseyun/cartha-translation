  source_fidelity: 'Le texte principal suit fidèlement l’hébreu : חסד est rendu par « bonté », יהוה par « Yahvé », et l’image d’un nuage porteur de pluie en temps de sécheresse est bien conservée. Toutefois, « est bienvenue » interprète נאה dans le sens de l’opportunité; « est belle » maintient plus directement la valeur poétique et appréciative de l’adjectif hébreu, sans perdre la cohérence contextuelle.'
