  text: The kindness of Yahweh is fitting in a time of distress[a], like a rain cloud in a time of drought.
translation:
  language: fr
  text: La bonté de Yahvé est belle au temps de la détresse[a], comme un nuage chargé de pluie au temps de la sécheresse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Le Très-Haut ne prend pas plaisir aux offrandes des impies, et il ne se laisse pas apaiser pour les péchés par une multitude de sacrifices. » Les témoins hébreu et grec diffèrent considérablement dans ce verset.'
    reason: textual_variant
lexical_decisions:
- source_word: נאה
  choice: est bienvenue
  rationale: L’adjectif exprime ici ce qui est agréable, approprié et opportun. « Est bienvenue » rend naturellement en français le bienfait particulièrement précieux dans la détresse.
- source_word: חסד
  choice: la bonté
  rationale: Le terme désigne ici la faveur bienveillante de Dieu. « Bonté » reste clair, digne et assez large pour ne pas réduire le mot à la seule compassion ni lui imposer un sens exclusivement alliancé.
- source_word: יהוה
  choice: Yahvé
  rationale: Transcription française courante du nom divin personnel présent dans le texte hébreu.
- source_word: בזמן מצוקה
  choice: au temps de la détresse
  rationale: La formule désigne une période d’oppression ou de grande difficulté. Cette traduction est naturelle et conserve la gravité de l’hébreu.
- source_word: כעב חזיזים
  choice: comme un nuage chargé de pluie
  rationale: חזיזים peut évoquer les éclairs ou l’orage, mais le contexte de sécheresse met en avant la pluie bienfaisante apportée par le nuage. La formulation conserve l’image sans faire du nuage une menace.
- source_word: בעת בצרת
  choice: au temps de la sécheresse
  rationale: Dans le parallélisme agricole et météorologique, la forme renvoie à une période de sécheresse; cette lecture produit une comparaison cohérente avec le nuage de pluie.
theological_decisions:
- issue: Choix du texte principal face à la divergence majeure entre l’hébreu et le grec
  choice: Traduire le témoin hébreu conservé dans le texte principal et signaler intégralement la leçon grecque en note.
  alternative: « Le Très-Haut ne prend pas plaisir aux offrandes des impies, et la multitude des sacrifices ne l’apaise pas pour les péchés. »
  rationale: Le texte hébreu est ici conservé avec un haut degré de confiance et doit donc gouverner la traduction. La tradition grecque présente toutefois un verset entièrement différent, dont l’importance exige une note transparente plutôt qu’une harmonisation.
translation_notes:
  register: Français international moderne, simple et digne. Le balancement « au temps de… comme… au temps de… » conserve le parallélisme de l’hébreu. « Est bienvenue » privilégie l’idée d’à-propos tout en restant idiomatique.
