  text: He does not show partiality to the poor[a], and he hears the plea of the oppressed.
translation:
  language: fr
  text: Il ne favorise pas le pauvre[a], et il entend les supplications de l’opprimé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin grec porte : « L’esprit de ceux qui craignent le Seigneur vivra, car leur espérance repose sur celui qui les sauve. » Le grec reflète ici une forme du texte très différente de l’hébreu conservé.'
    reason: textual_variant
lexical_decisions:
- source_word: לא ישא פנים אל דל
  choice: Il ne favorise pas le pauvre
  rationale: L’expression idiomatique נשא פנים signifie accorder une faveur ou traiter avec partialité. La traduction conserve l’orientation naturelle de אל (« envers le pauvre ») et la tension du texte hébreu, sans préciser artificiellement qu’il s’agirait d’un parti pris contre le pauvre.
- source_word: דל
  choice: le pauvre
  rationale: דל désigne une personne pauvre, faible ou socialement vulnérable. « Le pauvre » est ici la formulation française la plus directe.
- source_word: ותחנוני
  choice: et les supplications
  rationale: תחנונים désigne des demandes instantes de grâce ou de secours. Le pluriel « supplications » respecte la forme hébraïque et convient au registre digne du passage.
- source_word: מצוק
  choice: de l’opprimé
  rationale: מצוק désigne celui qui se trouve sous pression, dans la détresse ou l’oppression. « L’opprimé » met en valeur sa vulnérabilité sociale tout en restant dans le champ sémantique du terme.
- source_word: ישמע
  choice: il entend
  rationale: Dans cette maxime sapientielle, le yiqtol exprime naturellement une vérité générale. Le présent français rend cette valeur habituelle.
- source_word: πνεῦμα φοβουμένων Κύριον ζήσεται
  choice: non retenu dans le texte principal
  rationale: Le grec présente ici une forme textuelle très différente. Puisque le texte hébreu est conservé, il sert de base au texte principal; la leçon grecque est signalée en note.
theological_decisions:
- issue: Tension entre impartialité et attention portée à l’opprimé
  choice: Conserver « Il ne favorise pas le pauvre »
  alternative: Il ne fait pas preuve de partialité contre le pauvre
  rationale: L’alternative explicite une orientation défavorable que l’hébreu ne formule pas clairement. La traduction retenue préserve la tension entre l’absence de favoritisme envers le pauvre et l’écoute accordée à l’opprimé.
- issue: Divergence majeure entre les témoins hébreu et grec
  choice: Suivre l’hébreu dans le texte principal et donner le grec en note
  alternative: L’esprit de ceux qui craignent le Seigneur vivra, car leur espérance repose sur celui qui les sauve.
  rationale: Le texte hébreu conservé a priorité pour le Siracide. La leçon grecque est néanmoins assez importante et distincte pour être intégralement documentée.
translation_notes:
  register: Français international moderne, clair et digne. La formulation concise conserve le parallélisme de la maxime ainsi que l’ambiguïté théologique réelle du texte hébreu.
