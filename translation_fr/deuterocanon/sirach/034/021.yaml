  source_fidelity: 'Le texte rend correctement la comparaison proverbiale condensée du grec : ὁ προσάγων θυσίαν ἐκ χρημάτων πενήτων est bien le sujet, et θύων υἱὸν ἔναντι τοῦ πατρὸς αὐτοῦ l’image comparante. « Est comme quelqu’un qui égorge un fils » explicite sans excès la relation comparative implicite. « Sous les yeux de son père » rend naturellement ἔναντι τοῦ πατρὸς αὐτοῦ et conserve l’antécédent le plus naturel de αὐτοῦ, le fils. « Pris sur les biens des pauvres » communique bien la provenance ἐκ χρημάτων πενήτων dans le contexte de dénonciation; « biens » préserve l’ampleur de χρήματα.'
