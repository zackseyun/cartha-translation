  text: He who offers a sacrifice from the goods of the poor is like one who slaughters a son before his father[a].
translation:
  language: fr
  text: Celui qui offre un sacrifice pris sur les biens des pauvres est comme quelqu’un qui égorge un fils sous les yeux de son père[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Celui qui offre un sacrifice pris sur les biens des pauvres est quelqu’un qui égorge un fils devant son père. » Le grec présente une comparaison proverbiale condensée.'
    reason: alternative lexicale et clarification syntaxique
lexical_decisions:
- source_word: θύων
  choice: est comme quelqu’un qui égorge
  rationale: Le participe signifie littéralement « sacrifiant » ou « égorgeant ». L’ajout explicite de la comparaison rend en français la formulation proverbiale condensée, tandis que « égorge » conserve la violence saisissante de l’image.
- source_word: υἱὸν
  choice: un fils
  rationale: Le grec n’emploie aucun possessif avec « fils ». « Un fils » reste précis et n’introduit pas une relation absente du texte.
- source_word: ἔναντι
  choice: sous les yeux de
  rationale: Cette expression française naturelle traduit la présence directe indiquée par le grec et souligne la scène atroce sans en modifier le sens.
- source_word: τοῦ πατρὸς αὐτοῦ
  choice: son père
  rationale: 'Le pronom renvoie le plus naturellement au fils : l’acte se produit sous les yeux du père de celui-ci.'
- source_word: ὁ προσάγων θυσίαν
  choice: Celui qui offre un sacrifice
  rationale: Formulation française idiomatique qui conserve clairement le cadre sacrificiel.
- source_word: ἐκ χρημάτων πενήτων
  choice: pris sur les biens des pauvres
  rationale: χρήματα peut désigner l’argent, les ressources ou les possessions. « Biens » garde cette ampleur, et « pris sur » indique que le sacrifice provient de ce qui appartient aux pauvres sans préciser davantage le mode d’acquisition.
theological_decisions:
- issue: Force de la comparaison entre un sacrifice injuste et la mise à mort d’un fils
  choice: Rendre explicitement la comparaison par « est comme »
  alternative: « Celui qui offre un sacrifice pris sur les biens des pauvres égorge un fils sous les yeux de son père. »
  rationale: Le grec formule de manière condensée une équivalence proverbiale. L’explicitation comparative produit une phrase naturelle en français et préserve la dénonciation radicale d’un culte financé aux dépens des pauvres, sans transformer l’image en affirmation littérale.
translation_notes:
  register: Français international moderne, digne et direct. « Égorge » maintient la violence volontaire de l’image; « sous les yeux de » est plus naturel que le littéral « devant » tout en conservant l’idée de présence immédiate.
