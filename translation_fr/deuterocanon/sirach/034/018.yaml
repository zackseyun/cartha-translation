base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/018.yaml
  text: Even God will not delay[a], and like a warrior he will go out and not hold back, until he crushes the loins of the cruel, and repays vengeance to the nations; until he dispossesses the scepter of arrogance, and the staff of the wicked he will cut down completely.
translation:
  language: fr
  text: 'Dieu lui-même ne tardera pas[a] ;

    tel un guerrier, il sortira sans se retenir,


    jusqu’à ce qu’il brise les reins du cruel

    et fasse retomber la vengeance sur les nations,


    jusqu’à ce qu’il fasse disparaître le sceptre de l’arrogance

    et abatte complètement le bâton du méchant.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin grec fourni pour ce verset porte au contraire : « élevant l’âme et éclairant les yeux, donnant guérison, vie et bénédiction ». Il reflète une tradition textuelle sensiblement différente de l’hébreu conservé.'
    reason: textual_variant
lexical_decisions:
- source_word: גם אל
  choice: Dieu lui-même
  rationale: גם marque ici une insistance dont la nuance discursive exacte demeure incertaine. « Dieu lui-même » exprime naturellement cette mise en relief sans suggérer maladroitement que Dieu serait un cas inattendu.
- source_word: לא יתמהמה
  choice: ne tardera pas
  rationale: Le verbe exprime l’idée de tarder ou de différer ; cette formulation est claire et actuelle.
- source_word: כגבור יצא
  choice: tel un guerrier, il sortira
  rationale: גבור désigne ici un homme fort dans un cadre martial. « Guerrier » convient aux images de combat et de jugement qui suivent.
- source_word: לא יתאפק
  choice: sans se retenir
  rationale: Le verbe indique qu’on se maîtrise ou qu’on se contient. La tournure négative française conserve l’élan de l’action.
- source_word: ימחץ
  choice: brise
  rationale: מחץ est un verbe énergique signifiant écraser, fracasser ou briser. « Brise » garde la violence concrète de l’image sans être artificiel.
- source_word: מתני אכזרי
  choice: les reins de l’homme cruel
  rationale: מתנים désigne littéralement les reins ou les hanches, siège imagé de la force. L’adjectif singulier אכזרי est rendu personnellement par « l’homme cruel ».
- source_word: לגוים ישיב נקם
  choice: fasse retomber la vengeance sur les nations
  rationale: ישיב נקם évoque le retour ou la rétribution de la vengeance. Cette tournure française rend le mouvement rétributif et fait clairement des nations la cible, sans atténuer le jugement.
- source_word: יוריש
  choice: dépossède
  rationale: Le hiphil de ירש peut signifier faire perdre une possession ou déposséder. Le choix conserve l’idée d’ôter un pouvoir illégitime, malgré l’image volontairement abrupte.
- source_word: שבט זדון
  choice: le sceptre de l’arrogance
  rationale: שבט peut être une verge, un bâton ou un sceptre. Dans ce contexte d’autorité oppressive, « sceptre » fait ressortir le pouvoir ; זדון exprime l’arrogance ou l’insolence.
- source_word: מטה רשע
  choice: le bâton du méchant
  rationale: מטה désigne un bâton ou une verge. « Bâton » maintient le parallélisme avec « sceptre » sans les confondre ; רשע est compris comme un adjectif substantivé singulier.
- source_word: גדוע יגדע
  choice: abatte complètement
  rationale: La construction intensive formée avec l’infinitif absolu souligne le caractère décisif de l’action. « Complètement » en restitue l’emphase en français naturel.
theological_decisions:
- issue: Divergence majeure entre le témoin hébreu et le parallèle grec
  choice: Suivre le texte hébreu conservé dans le corps du verset et signaler le grec en note.
  alternative: 'Le grec porte : « élevant l’âme et éclairant les yeux, donnant guérison, vie et bénédiction ».'
  rationale: Le projet donne priorité à l’hébreu de Ben Sira lorsqu’il est conservé. Ici, le grec ne constitue pas une simple variante de formulation, mais représente une tradition textuelle sensiblement différente ; il ne faut donc ni l’harmoniser avec l’hébreu ni le passer sous silence.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les images martiales et corporelles de l’hébreu sont conservées. La disposition en lignes rend perceptibles les deux propositions introduites par « jusqu’à ce que », sans ajouter de structure absente du texte source.
