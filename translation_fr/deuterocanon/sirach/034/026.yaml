  yaml_path: translation/deuterocanon/sirach/034/026.yaml
  text: A furnace tests the tempering in dipping[b][a]; so wine tests hearts in the strife of the proud.
translation:
  language: fr
  text: La fournaise éprouve la trempe lors de l’immersion[a] ; ainsi, le vin éprouve les cœurs dans le conflit des orgueilleux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec de ce premier membre est difficile. L’expression traduite par « la trempe lors de l’immersion » peut aussi se comprendre plus précisément comme « un tranchant lors de son refroidissement » ou, plus généralement, comme « une pièce métallique plongée dans un bain ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans la bataille des orgueilleux ». Le mot grec peut désigner une bataille, une lutte ou un conflit.'
    reason: alternative_reading
lexical_decisions:
- source_word: κάμινος
  choice: fournaise
  rationale: Le terme désigne une installation chauffée à très haute température. « Fournaise » convient à l’image métallurgique et au contexte de mise à l’épreuve.
- source_word: δοκιμάζει
  choice: éprouve
  rationale: Le verbe exprime une mise à l’essai destinée à révéler la qualité. « Éprouve » garde à la fois l’idée de test et la portée sapientielle de la comparaison.
- source_word: στόμωμα
  choice: trempe
  rationale: Dans ce contexte métallurgique difficile, le nom peut évoquer le durcissement, la trempe ou le tranchant d’un objet métallique. « Trempe » conserve l’idée générale du traitement qui donne sa qualité au métal sans préciser indûment qu’il s’agit d’une lame.
- source_word: ἐν βαφῇ
  choice: lors de l’immersion
  rationale: Le mot désigne fondamentalement l’action de plonger ou d’immerger et peut, selon le contexte, évoquer la teinture ou le refroidissement du métal. Cette formulation garde visible l’action concrète tout en laissant la note exposer l’incertitude technique.
- source_word: οὕτως
  choice: ainsi
  rationale: Introduit avec concision et dignité le second terme de la comparaison.
- source_word: οἶνος
  choice: le vin
  rationale: Équivalent direct du grec ; le vin est présenté comme ce qui révèle l’état intérieur.
- source_word: καρδίας
  choice: les cœurs
  rationale: Le pluriel du texte est conservé. « Cœurs » désigne naturellement, dans le langage biblique, l’intériorité et le caractère des personnes.
- source_word: ἐν μάχῃ
  choice: dans le conflit
  rationale: μάχη peut désigner une bataille, une lutte ou une querelle. « Conflit » préserve cette amplitude sans imposer un cadre strictement militaire.
- source_word: ὑπερηφάνων
  choice: des orgueilleux
  rationale: Le génitif qualifie le plus naturellement les personnes engagées dans le conflit. « Orgueilleux » rend la caractérisation morale du grec dans un français biblique actuel.
theological_decisions:
- issue: Interprétation de la formule difficile στόμωμα ἐν βαφῇ
  choice: 'Une image métallurgique : la fournaise éprouve la trempe lors de l’immersion.'
  alternative: « La fournaise éprouve un tranchant lors de son refroidissement » ou, plus largement, « un ouvrage métallique dans l’immersion ».
  rationale: Il s’agit surtout d’une difficulté lexicale et textuelle, non d’un enjeu doctrinal. La traduction conserve l’image générale d’un métal dont la qualité est mise à l’épreuve, sans reconstruire avec une précision injustifiée l’objet ou le procédé technique.
- issue: Portée de μάχη dans la comparaison liée au vin
  choice: « conflit », au sens large d’affrontement ou de querelle
  alternative: « bataille »
  rationale: Le grec permet aussi une scène de bataille, mais il peut désigner plus généralement un affrontement. « Conflit » maintient l’ambiguïté et convient à l’idée que le vin révèle les cœurs dans une situation de tension.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme sapientiel est conservé, de même que l’image métallurgique inhabituelle du grec. Les notes signalent les deux principales ambiguïtés sans alourdir le verset.
