  text: Drunkenness multiplies the anger of a foolish man into stumbling[a], diminishing strength and producing wounds.
translation:
  language: fr
  text: L’ivresse multiplie la colère de l’insensé au point d’en faire une cause de chute[a], diminuant sa force et provoquant des blessures.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vers un trébuchement ». Le mot grec peut désigner un trébuchement, un obstacle qui fait tomber ou, par extension, une chute.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πληθύνει
  choice: multiplie
  rationale: Conserve la force causative et l’image d’une colère que l’ivresse fait croître fortement.
- source_word: μέθη
  choice: l’ivresse
  rationale: Désigne l’état d’intoxication, et non le simple fait de boire; « ivresse » est naturel et digne en français.
- source_word: θυμὸν
  choice: la colère
  rationale: Dans ce contexte, θυμός évoque surtout l’emportement colérique suscité ou aggravé par l’ivresse.
- source_word: ἄφρονος
  choice: de l’insensé
  rationale: Le substantif adjectival masculin singulier désigne le type sapientiel de l’homme dépourvu de discernement; « l’insensé » est concis et courant dans ce registre.
- source_word: εἰς πρόσκομμα
  choice: jusqu’à le faire trébucher
  rationale: Rend la valeur résultative de εἰς et conserve l’image concrète du trébuchement sans imposer l’idée plus forte de ruine totale.
- source_word: ἐλαττῶν
  choice: diminuant
  rationale: Le participe exprime un effet concomitant de l’ivresse et garde une formulation compacte.
- source_word: ἰσχὺν
  choice: sa force
  rationale: « Force » rend le sens large de vigueur ou capacité; le possessif explicite naturellement en français la force de l’insensé dans le contexte.
- source_word: προσποιοῦν
  choice: provoquant
  rationale: Exprime naturellement l’effet causatif supplémentaire indiqué par le participe.
- source_word: τραύματα
  choice: des blessures
  rationale: Préserve le caractère concret des dommages physiques évoqués par le grec.
theological_decisions:
- issue: Masculin représentatif dans la littérature sapientielle
  choice: « l’insensé »
  alternative: « la personne insensée »
  rationale: Le grec est au masculin singulier et présente un type sapientiel représentatif. Le masculin est donc conservé sans ajouter le nom « homme », absent du texte.
- issue: Portée de εἰς πρόσκομμα
  choice: « jusqu’à le faire trébucher »
  alternative: « jusqu’à sa chute »
  rationale: La formulation retenue conserve la métaphore du faux pas et la relation de résultat, tandis que « chute » pourrait suggérer plus nettement une ruine définitive.
translation_notes:
  register: Français moderne, clair et digne, dans le registre proverbial de la littérature de sagesse. La syntaxe participiale du grec est conservée autant que le permet un français naturel; le marqueur [a] signale l’étendue sémantique de πρόσκομμα.
