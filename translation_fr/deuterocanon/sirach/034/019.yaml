base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/019.yaml
  text: Until he repays a man for his deed[a], and a person's recompense according to his scheme; until he pleads the case of his people and gladdens them with his salvation.
translation:
  language: fr
  text: Jusqu’à ce qu’il rende à chacun pour ce qu’il a fait[a] et accorde à toute personne une rétribution selon ses desseins ; jusqu’à ce qu’il défende la cause de son peuple et le réjouisse par son salut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec conservé de Siracide 34.19 porte plutôt : « Celui qui offre un sacrifice provenant de l’injustice présente une offrande entachée, et les dons des hommes sans loi ne sont pas agréés. » Le témoin hébreu conservé diffère ici considérablement du grec.'
    reason: alternative_reading
lexical_decisions:
- source_word: עד
  choice: jusqu’à ce que
  rationale: Dans les deux propositions, עד marque le terme d’une attente ou d’une condition amorcée au verset précédent ; la tournure française avec le subjonctif en conserve la valeur temporelle.
- source_word: ישיב לאנוש פעלו
  choice: il rende à chacun selon ses actes
  rationale: Le causatif de שוב avec פעל exprime ici la rétribution. Cette formulation naturelle maintient l’idée que les actes de l’être humain lui sont rendus, sans limiter le référent au sexe masculin.
- source_word: וגמול אדם
  choice: et donne à toute personne ce qui lui revient
  rationale: גמול désigne ce qui est rendu en retour, récompense ou rétribution. La formulation préserve cette portée judiciaire tout en évitant une répétition lourde.
- source_word: כמזימתו
  choice: selon ses desseins
  rationale: מזמה peut désigner un projet, un dessein ou une machination. « Desseins » conserve l’ambivalence morale mieux que « machinations », qui imposerait un sens négatif.
- source_word: יריב ריב עמו
  choice: il défende la cause de son peuple
  rationale: 'La construction intensive avec ריב a une valeur judiciaire : soutenir ou plaider une cause. « Défendre la cause » est idiomatique en français moderne et garde cette image.'
- source_word: ושמחם
  choice: et le réjouisse
  rationale: 'Le verbe est causatif : faire se réjouir. Le pronom collectif singulier reprend naturellement « son peuple » en français.'
- source_word: בישועתו
  choice: par son salut
  rationale: ישועה peut signifier salut, délivrance ou victoire. « Salut » garde l’ampleur théologique du terme tout en convenant à une intervention qui délivre le peuple.
theological_decisions:
- issue: Divergence majeure entre le témoin hébreu conservé et le texte grec
  choice: Traduire le texte hébreu comme témoin principal et signaler en note la leçon grecque entièrement différente.
  alternative: 'Suivre le grec : « Celui qui offre un sacrifice provenant de l’injustice présente une offrande entachée, et les dons des hommes sans loi ne sont pas agréés. »'
  rationale: Le texte hébreu est ici conservé avec une confiance élevée et constitue donc la source première. La divergence grecque est néanmoins trop substantielle pour être passée sous silence.
- issue: Ambivalence morale de מזמה
  choice: desseins
  alternative: machinations
  rationale: Le contexte de rétribution permet une nuance négative, mais le mot hébreu n’exige pas ici qu’elle soit explicitée. « Desseins » préserve l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme des deux propositions introduites par « jusqu’à ce que » est maintenu. Le subjonctif convient à la syntaxe française, et le collectif « peuple » est repris au singulier.
