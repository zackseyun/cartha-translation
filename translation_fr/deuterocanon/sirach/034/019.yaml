    text: 'Le texte grec conservé de Siracide 34.19 porte plutôt : « Celui qui offre un sacrifice provenant de l’injustice présente une offrande entachée, et les dons des hommes sans loi ne sont pas agréés. » Le témoin hébreu conservé diffère ici considérablement du grec.'
    reason: alternative_reading
  revision_rationale: La révision conserve l’explicitation nécessaire en français de l’ellipse nominale « une rétribution », mais remplace « selon ses actes » par « pour ce qu’il a fait », qui correspond plus étroitement au premier membre hébreu. La note sur la divergence substantielle du grec est maintenue, avec son ancre.
