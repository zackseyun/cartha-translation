revisions:
- from: Jusqu’à ce qu’il rende à chacun selon ses actes[a] et donne à toute personne ce qui lui revient selon ses desseins ; jusqu’à ce qu’il défende la cause de son peuple et le réjouisse par son salut.
  to: Jusqu’à ce qu’il rende à chacun pour ce qu’il a fait[a] et accorde à toute personne une rétribution selon ses desseins ; jusqu’à ce qu’il défende la cause de son peuple et le réjouisse par son salut.
  rationale: La révision conserve l’explicitation nécessaire en français de l’ellipse nominale « une rétribution », mais remplace « selon ses actes » par « pour ce qu’il a fait », qui correspond plus étroitement au premier membre hébreu. La note sur la divergence substantielle du grec est maintenue, avec son ancre.
