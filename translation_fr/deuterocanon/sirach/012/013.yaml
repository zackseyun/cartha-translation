  text: Do not set him beside you[a], lest he push you aside and stand in your place.
translation:
  language: fr
  text: Ne le place pas à tes côtés[a], de peur qu’il ne te repousse et ne prenne ta place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « Qui aura pitié d’un charmeur de serpents mordu par un serpent, et de tous ceux qui s’approchent des bêtes sauvages ? » Le témoin grec présente ici une lecture substantiellement différente.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּעֲמִידֵהוּ
  choice: Ne le place pas
  rationale: Le hiphil de עמד signifie « faire tenir debout, placer ». « Placer » restitue naturellement l’action de lui donner une position auprès de soi.
- source_word: אֶצְלֶךָ
  choice: à tes côtés
  rationale: אצל exprime la proximité. « À tes côtés » conserve l’image spatiale tout en convenant à une position de confiance ou d’influence.
- source_word: לָמָּה
  choice: de peur que
  rationale: Littéralement interrogatif (« pourquoi ? »), le terme a ici, dans l’enchaînement de l’avertissement, une valeur de conséquence indésirable. « De peur que » en rend la force sans alourdir le français.
- source_word: יֶהְדָּפְךָ
  choice: il ne te repousse
  rationale: הדף signifie pousser, refouler ou chasser. « Repousser » préserve l’image du déplacement sans préciser excessivement s’il est physique ou figuré.
- source_word: וְיַעֲמֹד תַּחְתֶּיךָ
  choice: et ne prenne ta place
  rationale: Littéralement, « et qu’il ne se tienne à ta place/sous toi ». תַּחַת peut exprimer la position inférieure ou la substitution; dans ce parallélisme de déplacement, « prendre ta place » transmet clairement le sens contextuel.
theological_decisions:
- issue: Choix entre le témoin hébreu et la lecture grecque très différente
  choice: Traduire le texte hébreu conservé comme texte principal
  alternative: 'Suivre le grec : « Qui aura pitié d’un charmeur mordu par un serpent, et de tous ceux qui s’approchent des bêtes sauvages ? »'
  rationale: Le témoin hébreu est ici disponible et jugé fiable. Le grec représente une lecture substantiellement différente; il convient donc de la signaler en note plutôt que de remplacer silencieusement l’hébreu.
- issue: Valeur de תַּחְתֶּיךָ
  choice: « ta place », au sens de substitution
  alternative: « sous toi » ou « au-dessous de toi », au sens spatial
  rationale: Le parallélisme avec « te repousse » favorise l’idée qu’il évince la personne et occupe sa position, tout en laissant reconnaître l’image spatiale sous-jacente.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement correspond au discours sapientiel adressé à un individu. La formulation conserve l’image de proximité et la dynamique d’éviction, avec une note explicite pour la divergence majeure du grec.
