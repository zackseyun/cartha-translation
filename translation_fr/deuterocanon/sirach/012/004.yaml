review_pass:
  verdict: revise
  source_fidelity: Le projet suit à juste titre le texte hébreu plutôt que le parallèle grec, dont la divergence doit être signalée. Toutefois, il transforme sans appui explicite les suffixes de troisième personne (« l’/lui ») en une adresse à la deuxième personne (« t’ », « tu ») et développe « dans/tout bien » en un bienfait antérieur accompli par le lecteur. Cette causalité et ces participants ne sont pas exprimés par l’hébreu.
  naturalness: La phrase proposée est naturelle en français, mais cette fluidité résulte d’une explicitation interprétative excessive. La révision reste lisible et conserve la formulation dense et quelque peu énigmatique du texte hébreu.
  terminology: « Malheur double » rend de façon sobre רָעָה et פִּי שְׁנַיִם. « Détresse » convient à צֹרֶךְ. « Dans tout ce qui est bon » rend littéralement la dernière expression sans la réduire à des bienfaits que le lecteur aurait accordés.
  issues:
  - severity: high
    issue: Changement non justifié de personne grammaticale et ajout d’une action du lecteur
    rationale: Les verbes hébreux à la troisième personne féminine ont pour sujet « malheur » (ou un référent féminin implicite), et les pronoms finaux visent une troisième personne. « t’atteindra » et « que tu lui auras fait » introduisent un destinataire et un donateur absents du texte.
  - severity: medium
    issue: La relation causale et temporelle de « pour tout le bien que tu lui auras fait » est ajoutée
    rationale: בְּכָל טוֹבָה ne dit ni « que tu lui auras fait » ni explicitement « en retour de ». Une traduction doit préserver la concision et l’ambiguïté de cette proposition difficile.
  revised_text: Un malheur double l’atteindra au temps de la détresse ; dans tout ce qui est bon, il l’atteindra.[a]
  revised_footnotes:
  - marker: a
    text: 'Le texte grec présente ici une leçon entièrement différente : « Donne à l’homme fidèle à Dieu et ne viens pas en aide au pécheur. »'
    reason: Signaler la divergence textuelle substantielle entre le texte hébreu retenu et l’important témoin grec, également suivi par le texte anglais de référence.
  revision_rationale: La révision traduit le texte hébreu fourni sans importer l’exhortation et les référents personnels du texte grec. Le pronom « il » reprend « un malheur double » en français ; la seconde proposition conserve volontairement l’ambiguïté syntaxique et sémantique de l’hébreu. La note maintient clairement l’alternative grecque.
