  text: Give to the godly, and do not support the sinner.[a]
translation:
  language: fr
  text: Un malheur double t’atteindra au temps de la détresse, pour tout le bien que tu lui auras fait.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec présente ici une leçon entièrement différente : « Donne à l’homme fidèle à Dieu et ne viens pas en aide au pécheur. »'
    reason: Signaler honnêtement une divergence textuelle substantielle entre l’hébreu retenu et l’important témoin grec, également suivi par la consultation anglaise.
lexical_decisions:
- source_word: פִּי שְׁנַיִם
  choice: double
  rationale: Expression idiomatique signifiant « deux fois autant » ou « au double » ; « double » garde la force concise de l’hébreu.
- source_word: רָעָה
  choice: un malheur
  rationale: Dans ce contexte, le terme désigne plus naturellement le mal subi, c’est-à-dire le malheur, plutôt que la méchanceté morale.
- source_word: בְּעֵת צֹרֶךְ
  choice: au temps de la détresse
  rationale: צֹרֶךְ évoque ici une situation de besoin pressant ou de détresse ; cette formulation convient au registre sapientiel.
- source_word: בְּכָל טוֹבָה תַּגִּיעַ אֵלָיו
  choice: pour tout le bien que tu lui auras fait
  rationale: הגיע אל peut exprimer le fait de faire parvenir quelque chose à quelqu’un. La tournure française explicite naturellement le bien accordé à cette personne, tout en reconnaissant que la syntaxe hébraïque est compacte.
theological_decisions:
- issue: Divergence majeure entre le texte hébreu et le texte grec
  choice: Traduire le texte hébreu fourni comme source principale
  alternative: 'Suivre le grec : « Donne à l’homme fidèle à Dieu et ne viens pas en aide au pécheur. »'
  rationale: La consigne donne priorité aux données de la langue originale et attribue une confiance élevée au texte hébreu. La divergence est signalée en note plutôt que résolue silencieusement en faveur du grec ou de la couche anglaise.
- issue: Référent implicite de la deuxième personne
  choice: Employer « tu » comme objet implicite de « atteindra » et comme sujet de l’action bienfaisante
  alternative: Rendre la phrase de manière impersonnelle ou conserver une syntaxe plus obscure
  rationale: Les formes verbales et le contexte d’exhortation sapientielle soutiennent l’adresse directe au lecteur, sans préciser davantage l’identité de la personne aidée.
translation_notes:
  register: Français international moderne, sobre et proverbial. La formulation reste directe et digne. Le futur antérieur « tu lui auras fait » rend clairement le rapport entre le bien accordé auparavant et le malheur ultérieur, sans ajouter de qualification confessionnelle.
