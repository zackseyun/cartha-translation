translation:
  language: fr
  text: Aucun bien ne revient à celui qui persiste dans le mal[a], ni à celui qui ne fait pas preuve de bienfaisance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque est difficile. Le grec porte : « celui qui persiste dans le mal ».'
    reason: alternative_reading
  - marker: b
    text: L’hébreu dit littéralement « ne fait pas la justice ». Dans ce contexte, le grec comprend « n’accorde pas l’aumône », c’est-à-dire ne fait pas preuve de bienfaisance ou de miséricorde.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין טוֹבָה
  choice: Il n’y a rien de bon
  rationale: Reproduit directement l’énoncé hébreu d’absence de bien, confirmé par le grec οὐκ ἔστιν ἀγαθὰ, dans un français naturel.
- source_word: לִמְנֹחַ רָשָׁע
  choice: pour celui qui persiste dans le mal
  rationale: La formulation hébraïque est difficile et pourrait évoquer le fait de demeurer ou de s’établir; le grec τῷ ἐνδελεχίζοντι εἰς κακά appuie nettement l’idée de persévérer dans le mal.
- source_word: וְגַם
  choice: ni
  rationale: Dans la coordination de deux propositions négatives, « ni » rend naturellement en français la valeur additive de l’hébreu.
- source_word: צְדָקָה
  choice: bienfaisance
  rationale: Le mot peut désigner la justice, mais aussi la charité concrète. Le parallèle grec ἐλεημοσύνην indique ici l’aumône ou l’action miséricordieuse; « bienfaisance » conserve cette dimension pratique sans la réduire à un seul geste.
- source_word: לֹא עָשָׂה
  choice: ne pratique pas
  rationale: Littéralement « n’a pas fait ». Avec « bienfaisance », « pratiquer » exprime idiomatiquement l’action éthique habituelle et correspond au grec « ne pas accorder ».
theological_decisions:
- issue: Sens de צְדָקָה dans ce contexte sapientiel
  choice: bienfaisance concrète
  alternative: justice; aumône; miséricorde
  rationale: Le texte hébreu permet « justice », tandis que le grec comprend une aide charitable ou miséricordieuse. Le choix principal rend l’acte concret sans imposer une notion théologique abstraite; la note conserve les autres possibilités.
- issue: Interprétation de לִמְנֹחַ רָשָׁע
  choice: persister dans le mal
  alternative: demeurer dans la méchanceté; le méchant qui se repose
  rationale: L’hébreu transmis est difficile. La lecture durative est soutenue par le grec et donne un sens cohérent, mais l’incertitude textuelle est signalée.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe parallèle reste proche de l’hébreu, tandis que les deux difficultés lexicales sont explicitées en notes.
