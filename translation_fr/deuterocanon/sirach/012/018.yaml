translation:
  language: fr
  text: Il ne passera pas son chemin tant qu’un feu ne brûlera pas en lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec présente une formulation différente et plus développée : « Il secouera la tête, frappera dans ses mains, murmurera à maintes reprises et changera d’expression. »'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יַעֲבֹר
  choice: il ne passera pas son chemin
  rationale: Le verbe עבר signifie couramment « passer » ou « poursuivre son chemin ». Cette tournure française naturelle conserve ici l’idée d’une action hostile qui persiste.
- source_word: עַד
  choice: avant que… ne
  rationale: La préposition marque le terme auquel l’action se poursuit. En français, « ne… pas avant que » exprime naturellement cette limite temporelle; le « ne » est explétif.
- source_word: תִּבְעַר
  choice: ne brûle
  rationale: La forme verbale peut se comprendre comme « brûler, s’embraser ». La construction hébraïque place le feu après le verbe et permet naturellement de le prendre pour sujet, sans imposer le sens causatif « allumer ».
- source_word: בּוֹ
  choice: en lui
  rationale: Le pronom prépositionnel signifie le plus directement « en lui ». Cette formulation préserve l’opacité et la possible dimension métaphorique de l’hébreu.
- source_word: אֵשׁ
  choice: un feu
  rationale: Le nom est indéfini et l’article indéfini convient au français tout en maintenant l’image du feu.
theological_decisions:
- issue: Primauté du témoin hébreu bref face au parallèle grec beaucoup plus développé
  choice: Traduire l’hébreu conservé dans le texte principal et signaler le grec en note.
  alternative: 'Suivre le grec : « Il secouera la tête, frappera des mains, murmurera beaucoup et changera de visage. »'
  rationale: Le témoin hébreu est ici disponible et doit rester la base du texte. Le grec atteste toutefois une lecture sensiblement différente, importante pour comprendre la transmission du passage; elle est donc conservée sans remplacer l’hébreu.
- issue: Ambiguïté syntaxique et métaphorique de תִּבְעַר בּוֹ אֵשׁ
  choice: « qu’un feu ne brûle en lui »
  alternative: « qu’il n’ait allumé un feu contre lui »
  rationale: La traduction choisie suit la lecture syntaxique la plus immédiate, où « feu » est le sujet de « brûler », et rend בּוֹ par son sens direct « en lui ». Elle évite de préciser sans nécessité qui allume le feu ou contre qui il agit.
translation_notes:
  register: Français moderne, international et digne. « Passer son chemin » est idiomatique sans être familier. La phrase demeure volontairement énigmatique comme l’hébreu; la ponctuation place le marqueur de note immédiatement après la phrase.
