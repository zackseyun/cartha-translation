translation:
  language: fr
  text: Plus tard, tu saisiras mes paroles, et tu soupireras pour ma sœur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est difficile ici, surtout l’expression traduite par « pour ma sœur ». Le témoin grec porte plutôt : « Il restera avec toi une heure, et si tu t’écartes, il ne restera pas », ce qui reflète un texte ou une interprétation sensiblement différents.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְאָחוֹר
  choice: Plus tard
  rationale: L’expression situe l’accomplissement à un moment ultérieur, sans préciser s’il sera alors trop tard.
- source_word: תַּשִּׂיג
  choice: tu saisiras
  rationale: Le verbe נשׂג signifie fondamentalement « atteindre » ou « rattraper ». Avec « mes paroles » comme complément, « saisir » exprime naturellement le fait d’en venir à les comprendre tout en conservant l’image d’une compréhension atteinte après coup.
- source_word: אֲמָרַי
  choice: mes paroles
  rationale: Traduction directe et naturelle du nom pluriel muni du suffixe de première personne.
- source_word: וּלְאַחְוָתִי
  choice: pour ma sœur
  rationale: La forme hébraïque transmise est difficile, mais son aspect consonantique suggère le plus directement « ma sœur ». La traduction conserve cette difficulté au lieu de normaliser silencieusement le texte.
- source_word: תִּתְאַנָּח
  choice: tu soupireras
  rationale: Le verbe désigne l’action de soupirer ou de gémir. « Soupirer » restitue sobrement sa valeur affective sans préciser indûment s’il s’agit de regret, de douleur ou de désir.
theological_decisions:
- issue: Priorité du témoin hébreu malgré une version grecque très différente
  choice: Le texte principal suit l’hébreu conservé.
  alternative: 'Suivre le grec : « Il restera avec toi un moment, mais si tu t’écartes, il ne tiendra pas. »'
  rationale: Lorsque le texte hébreu du Siracide est conservé, il constitue ici la source première. L’écart important du grec est toutefois signalé afin de ne pas masquer l’incertitude textuelle.
- issue: Traitement de l’expression hébraïque incertaine וּלְאַחְוָתִי
  choice: Conserver littéralement « pour ma sœur » et signaler la difficulté en note.
  alternative: Interpréter « pour ma parenté », « pour ma compagne » ou remplacer le membre de phrase par la lecture grecque.
  rationale: Aucune interprétation conjecturale ne s’impose avec assez de certitude. La formulation difficile du témoin hébreu est donc maintenue sans résoudre artificiellement son ambiguïté.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement correspond à l’adresse sapientielle au singulier. « Tu saisiras mes paroles » privilégie une expression française naturelle tout en gardant l’idée hébraïque d’atteindre une compréhension ultérieure.
