translation:
  language: fr
  text: Si tu fais du bien, sache à qui tu fais du bien, et ton acte de bonté te donnera lieu d’espérer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, en suivant plus explicitement le grec : « il y aura de la reconnaissance pour tes bonnes actions ». L’hébreu peut aussi se comprendre : « il y aura de l’espoir pour ton bien-être ».'
    reason: 'Lecture alternative du dernier membre : le grec évoque plus explicitement la reconnaissance pour les bienfaits, tandis que le complément hébreu peut aussi renvoyer au bien-être du bienfaiteur.'
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Rend directement la particule conditionnelle sans transformer l’énoncé en certitude temporelle.
- source_word: תֵּטִיב
  choice: tu fais du bien
  rationale: Exprime naturellement le sens causatif de היטיב, ici faire du bien à quelqu’un, et correspond au parallèle grec.
- source_word: תֵּדַע
  choice: sache
  rationale: La forme a ici une valeur impérative; « sache » conserve l’appel à connaître ou discerner le bénéficiaire.
- source_word: לְמִי תֵטִיב
  choice: à qui tu le fais
  rationale: Le pronom « le » évite en français une répétition lourde tout en gardant clairement « du bien » comme objet de l’action.
- source_word: וִיהִי
  choice: et il y aura
  rationale: Rend la conséquence future probable dans cette maxime sapientielle, en accord avec le grec καὶ ἔσται.
- source_word: תִקְוָה
  choice: de l’espoir
  rationale: Sens usuel du nom hébreu; la formulation conserve l’idée d’attente favorable sans préciser indûment sa forme.
- source_word: לְטוֹבָתָךְ
  choice: pour ton acte de bonté
  rationale: Conserve le lien lexical avec l’action bienfaisante et reste plus concret que « ta bonté », tout en laissant la note signaler l’autre compréhension possible du syntagme hébreu.
theological_decisions:
- issue: Sens de לְטוֹבָתָךְ et rapport avec le grec χάρις τοῖς ἀγαθοῖς σου
  choice: La proposition annonce une attente favorable liée à l’acte de bonté.
  alternative: « il y aura de la reconnaissance pour tes bonnes actions » ou « il y aura de l’espoir pour ton bien-être »
  rationale: L’hébreu privilégie lexicalement l’idée d’espoir, mais le complément peut viser soit l’action bonne, soit le bien du bienfaiteur. Le grec explicite plutôt la reconnaissance attachée aux bonnes actions. Le texte principal suit l’hébreu et la note préserve les autres possibilités.
translation_notes:
  register: Français international moderne, simple et digne. La répétition hébraïque est légèrement allégée par « le », sans perdre la relation entre l’action et son bénéficiaire. La note maintient l’ambiguïté réelle de la clause finale.
