  text: For God also hates evildoers[b][a], and will repay the wicked with vengeance.
translation:
  language: fr
  text: Car Dieu déteste lui aussi ceux qui font le mal, et il tirera vengeance des méchants.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit : « Dieu aussi déteste ceux qui font le mal » et « les méchants ». Le grec porte : « le Très-Haut a haï les pécheurs » et « les impies ».'
    reason: textual_variant
lexical_decisions:
- source_word: אֵל / ὁ ὕψιστος
  choice: Dieu
  rationale: Le texte hébreu principal porte אֵל, « Dieu ». Le grec parallèle lit « le Très-Haut »; cette variante est signalée en note sans supplanter le témoin hébreu de haute confiance.
- source_word: שֹוֹנֵא / ἐμίσησεν
  choice: déteste
  rationale: Le participe hébreu exprime ici une disposition générale et durable. « Déteste » restitue directement la force du verbe, sans l’atténuer; le présent convient mieux à l’hébreu que le passé du grec.
- source_word: רָעִים / ἁμαρτωλούς
  choice: ceux qui font le mal
  rationale: L’hébreu désigne littéralement les mauvais ou les malfaisants. Cette formulation française naturelle conserve la dimension active et distingue ce groupe des « méchants » du second membre. Le grec a plutôt « pécheurs ».
- source_word: לָרְשָׁעִים / τοῖς ἀσεβέσιν
  choice: aux méchants
  rationale: « Méchants » rend naturellement le substantif hébreu רְשָׁעִים. Le grec présente la nuance « impies », intégrée à la note sur les variantes.
- source_word: יָשִׁיב נָקָם / ἀποδώσει ἐκδίκησιν
  choice: il fera subir … le châtiment qu’ils méritent
  rationale: L’expression hébraïque évoque le retour de la vengeance ou la rétribution. En français moderne, cette formulation transmet clairement l’idée de juste rétribution sans suggérer une vindicte humaine arbitraire.
theological_decisions:
- issue: Titre divin divergent entre l’hébreu et le grec
  choice: Dieu
  alternative: le Très-Haut
  rationale: La traduction suit prioritairement le texte hébreu fourni, qui lit אֵל. La leçon grecque « le Très-Haut » demeure explicitement documentée.
- issue: Force de l’affirmation selon laquelle Dieu hait les malfaisants
  choice: déteste ceux qui font le mal
  alternative: rejette ceux qui font le mal
  rationale: L’hébreu et le grec emploient tous deux le vocabulaire de la haine. Une formulation adoucie résoudrait indûment la tension théologique du texte.
- issue: Sens de la vengeance divine
  choice: le châtiment qu’ils méritent
  alternative: la vengeance
  rationale: Cette formulation conserve la rétribution judiciaire impliquée par נָקָם et ἐκδίκησις, tout en étant naturelle en français contemporain. Elle ne nie ni n’atténue le jugement divin.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme hébreu est maintenu, ainsi que la forte tension du langage sur la haine et la rétribution divines. La note regroupe avec concision les divergences significatives du grec.
