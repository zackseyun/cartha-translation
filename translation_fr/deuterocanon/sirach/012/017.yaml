  text: So is one who associates with a man of insolence and rolls about in his sins.[a]
translation:
  language: fr
  text: Ainsi en va-t-il de celui qui s’associe à un homme présomptueux et se roule dans ses péchés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin grec diffère considérablement ici : « Si le malheur vient à ta rencontre, tu le trouveras là avant toi et, sous prétexte de t’aider, il te fera trébucher. » L’hébreu conservé dans les manuscrits de la Guéniza du Caire parle plutôt de celui qui s’associe à un homme présomptueux et se roule dans ses péchés.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֵּן
  choice: Ainsi en va-t-il
  rationale: Introduit l’application comparative du verset précédent et conserve la tournure proverbiale dans un français naturel.
- source_word: חוֹבֵר אֶל
  choice: celui qui s’associe à
  rationale: Le participe de חבר exprime le fait de se joindre à quelqu’un ou de le fréquenter; « s’associe à » reste assez large sans supposer une amitié intime.
- source_word: אִישׁ זָדוֹן
  choice: un homme présomptueux
  rationale: Le syntagme est explicitement masculin. זָדוֹן évoque ici l’orgueil qui pousse à agir avec insolence ou présomption; l’adjectif donne une formulation française fluide.
- source_word: וּמִתְגֹלֵל
  choice: et se roule
  rationale: La forme réfléchie de גלל conserve l’image concrète de quelqu’un qui se roule dans quelque chose. Cette traduction évite de remplacer silencieusement l’image par l’idée interprétative de participation ou d’enchevêtrement.
- source_word: בַּעֲוֹנֹתָיו
  choice: dans ses péchés
  rationale: עָוֹן peut désigner le péché, la faute ou la culpabilité. Ici, « péchés » est clair et convient à l’image. Le suffixe renvoie vraisemblablement à l’homme présomptueux, tout en gardant la même ambiguïté grammaticale qu’en hébreu.
theological_decisions:
- issue: Rapport entre le texte hébreu et le témoin grec très divergent
  choice: Suivre dans le texte principal l’hébreu conservé, qui parle de s’associer à un homme présomptueux et de se rouler dans ses péchés.
  alternative: 'Le grec porte : « Si le malheur vient à ta rencontre, tu le trouveras là avant toi et, sous prétexte de t’aider, il te fera trébucher. »'
  rationale: Puisque le texte hébreu de ce verset est conservé avec une confiance élevée, il constitue la base de la traduction. La version grecque témoigne cependant d’une formulation substantiellement différente qui influe sur l’interprétation; elle est donc signalée en note sans harmonisation.
translation_notes:
  register: Français international moderne, digne et proverbial. « Se roule dans ses péchés » est volontairement imagé et proche de l’hébreu; la tournure demeure compréhensible sans durcir le sens en « se vautre », plus fortement péjoratif.
