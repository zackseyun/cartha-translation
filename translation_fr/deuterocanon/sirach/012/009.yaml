  text: In a man's prosperity even an enemy is friendly[a], but in his adversity even a friend keeps apart.
translation:
  language: fr
  text: Dans la prospérité d’un homme, même un ennemi se montre amical[a] ; mais dans son malheur, même un ami se tient à l’écart.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « même un ennemi devient un ami ». L’hébreu emploie רֵעַ, qui peut désigner un ami ou un compagnon ; « se montre amical » préserve l’ironie du proverbe sans laisser entendre nécessairement une véritable réconciliation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטוֹבַת אִישׁ
  choice: dans la prospérité d’un homme
  rationale: Le syntagme désigne la situation favorable ou la réussite d’un homme. « Prospérité » forme un contraste naturel avec « malheur » tout en conservant la formulation proverbiale masculine du texte hébreu.
- source_word: שׂוֹנֵא
  choice: un ennemi
  rationale: Le participe signifie littéralement « celui qui hait », mais « ennemi » exprime naturellement ici la relation visée et concorde avec le parallèle grec.
- source_word: רֵעַ (premier emploi)
  choice: se montre amical
  rationale: רֵעַ peut désigner un ami ou un compagnon. Cette formulation préserve l’ironie du proverbe sans affirmer qu’une véritable amitié ou réconciliation s’établit.
- source_word: וּבְרָעָתוֹ
  choice: mais dans son malheur
  rationale: רָעָה désigne ici une situation pénible, non le mal moral. « Malheur » est clair et naturel, et s’oppose bien à « prospérité ».
- source_word: רֵעַ (second emploi)
  choice: un ami
  rationale: Dans le second membre, le terme désigne clairement une personne liée par l’amitié, en contraste avec « ennemi ».
- source_word: בּוֹדֵד
  choice: se tient à l’écart
  rationale: Le mot évoque l’isolement ou la séparation. Dans ce contexte relationnel, « se tient à l’écart » rend idiomatiquement le retrait de l’ami et correspond au grec διαχωρισθήσεται.
