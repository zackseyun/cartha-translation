  text: Do not trust an enemy forever, for as bronze rusts, so does his evil.
translation:
  language: fr
  text: Ne te fie jamais à ton ennemi, car, de même que le bronze se corrode, sa méchanceté aussi se corrode.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תַּאֲמִין
  choice: Ne te fie
  rationale: Rend naturellement en français l’interdiction de placer sa confiance en quelqu’un.
- source_word: לָעַד
  choice: jamais
  rationale: Dans une interdiction, « jamais » exprime idiomatiquement la valeur temporelle de « pour toujours / à perpétuité ».
- source_word: כנחשת ... יחליא
  choice: comme le bronze se couvre de vert-de-gris
  rationale: L’image évoque l’altération visible du bronze; « vert-de-gris » est plus exact en français que « rouille » pour ce métal, tout en conservant la comparaison.
- source_word: רועו
  choice: sa méchanceté
  rationale: Conserve la dimension morale du substantif hébreu sans préciser indûment s’il s’agit du caractère ou des actes.
theological_decisions:
- issue: Portée absolue de l’avertissement
  choice: Maintenir « jamais »
  alternative: « pour toujours »
  rationale: Le verset formule une maxime de prudence; la traduction préserve sa force sans tenter de la concilier explicitement avec d’autres enseignements sur les ennemis.
- issue: Sujet implicite du second membre
  choice: « ainsi fait sa méchanceté »
  alternative: « ainsi sa méchanceté se corrompt »
  rationale: La formulation conserve le parallélisme et une part de l’ellipse du texte source, sans transformer l’image en affirmation doctrinale plus précise.
translation_notes:
  register: Français moderne, direct et sentencieux. Tutoiement singulier conforme au style sapientiel. « Vert-de-gris » garde une image concrète et exacte, malgré son registre légèrement plus précis que le vocabulaire courant.
