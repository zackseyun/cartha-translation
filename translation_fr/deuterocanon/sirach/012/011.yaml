base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/012/011.yaml
  text: Even if he listens to you and walks gently, give your heart to be afraid of him.[a]
translation:
  language: fr
  text: Même s’il t’écoute et marche avec douceur, applique ton cœur à le craindre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle développe l’avertissement : « mets ton âme en garde et garde-toi de lui »; il rend ainsi l’idée de protection personnelle plus explicite que le texte hébreu conservé.'
    reason: alternative_reading
lexical_decisions:
- source_word: ישמע לך
  choice: t’écoute
  rationale: שמע avec ל peut signifier écouter quelqu’un, voire lui obéir. « T’écoute » conserve le sens de surface sans exagérer la soumission apparente.
- source_word: וִיהַלֵּךְ בְּנַחַת
  choice: marche avec douceur
  rationale: L’expression décrit une démarche ou une conduite calme et sans brusquerie. Cette traduction garde la métaphore de la marche et laisse entendre une douceur possiblement feinte.
- source_word: תֵּן לִבְּךָ
  choice: applique ton cœur
  rationale: 'Littéralement « donne ton cœur » : l’expression appelle à diriger résolument son attention. « Applique ton cœur » demeure proche de l’image hébraïque tout en étant compréhensible en français soutenu courant.'
- source_word: לְהִתְיָרֵא מִמֶּנּוּ
  choice: à le craindre
  rationale: Le verbe ירא exprime la crainte. Dans ce contexte, il s’agit d’une crainte prudente envers un ennemi; la traduction conserve néanmoins le terme de crainte au lieu d’importer dans le texte la formulation plus explicite de vigilance du grec.
