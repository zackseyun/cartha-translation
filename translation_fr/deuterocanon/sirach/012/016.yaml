  text: Who will pity a snake charmer who is bitten[b][a], or anyone who goes near a beast of prey?
translation:
  language: fr
  text: Qui prendra en pitié un charmeur de serpents qui s’est fait mordre, ou quiconque s’approche d’une bête aux crocs[a] ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une bête de dent » ou « aux dents », c’est-à-dire un animal dangereux muni de crocs.'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec présente ici un texte très différent : il décrit un ennemi qui tient des propos doucereux tout en préparant intérieurement la chute et le sang de son adversaire. Le texte principal suit l’hébreu conservé.'
    reason: textual_variant
lexical_decisions:
- source_word: מִי יוּחַן
  choice: Qui prendra en pitié
  rationale: La tournure interrogative introduit une question rhétorique. « Prendre en pitié » rend naturellement le sens contextuel de חנן sans atténuer la conséquence prévisible de l’imprudence.
- source_word: חוֹבֵר
  choice: un charmeur de serpents
  rationale: חובר désigne ici celui qui pratique un charme ou une incantation; la mention de la morsure permet de préciser naturellement qu’il s’agit de serpents.
- source_word: נָשׁוּךְ
  choice: qui s’est fait mordre
  rationale: Le participe passif décrit le charmeur ayant subi une morsure. Cette formulation française courante conserve le sens passif et suggère sans l’ajouter explicitement le risque inhérent à son activité.
- source_word: וְכָל הַקָּרֵב
  choice: ou quiconque s’approche
  rationale: Le second membre présente un cas parallèle. « Ou » exprime clairement l’alternative rhétorique en français, tandis que « quiconque » garde la portée générale de כל.
- source_word: אֶל חַיַּת שֵׁן
  choice: d’une bête aux crocs redoutables
  rationale: Littéralement « une bête de dent/dents ». La formulation conserve l’image concrète des dents tout en indiquant en français idiomatique qu’il s’agit d’un animal dangereux.
