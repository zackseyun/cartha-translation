  text: Give to the good[a], and withhold from the evil; honor the poor, and do not give to a stranger.[b]
translation:
  language: fr
  text: Donne à l’homme de bien et ne donne pas à l’homme mauvais[a] ; honore le pauvre et ne donne pas à l’étranger[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « retiens/refuse au mal » et peut aussi désigner une personne mauvaise. Le grec porte : « ne viens pas en aide au pécheur ».'
    reason: alternative_reading
  - marker: b
    text: Ou « à celui du dehors ». Le mot hébreu peut désigner un étranger ou, plus largement, une personne extérieure au cercle concerné.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּן לַטּוֹב
  choice: Donne à l’homme bon
  rationale: L’impératif est direct. L’ajout de « l’homme » rend explicite en français le référent personnel de l’adjectif substantivé, également confirmé par le grec τῷ ἀγαθῷ.
- source_word: וּמְנַע מֵרָע
  choice: et refuse à l’homme mauvais
  rationale: מנע exprime l’idée de retenir ou refuser ce que l’on donnerait, tandis que רָע peut désigner le mal ou une personne mauvaise. Cette formulation maintient le parallélisme avec « donne à l’homme bon » sans importer le terme grec plus précis « pécheur ».
- source_word: הֹקֵיר מָךְ
  choice: honore le pauvre
  rationale: הֹקֵיר commande de tenir en estime ou d’honorer ; מָךְ désigne une personne pauvre, humble ou de condition modeste. « Honore le pauvre » est concis et naturel.
- source_word: וְאַל תִּתֵּן
  choice: et ne donne rien
  rationale: La négation française exige ici un complément naturel ; « ne donne rien » exprime clairement l’interdiction de donner sans alourdir la phrase.
- source_word: לְזֵר
  choice: à l’étranger
  rationale: זָר peut désigner un étranger, une personne extérieure ou quelqu’un qui n’appartient pas au cercle concerné. « L’étranger » conserve la brièveté du texte, avec l’ambiguïté signalée en note.
theological_decisions:
- issue: Le second membre du premier parallèle vise-t-il le mal en général, une personne mauvaise ou le pécheur ?
  choice: « refuse à l’homme mauvais »
  alternative: « tiens-toi loin du mal » ; « ne viens pas en aide au pécheur »
  rationale: L’hébreu permet une lecture abstraite (« du mal ») ou personnelle (« d’un homme mauvais »). Le contraste avec « l’homme bon » favorise le sens personnel ; le grec confirme un référent humain, mais son « pécheur » n’est pas imposé au texte principal.
- issue: Portée sociale ou ethnique de לְזֵר
  choice: « à l’étranger » avec une note
  alternative: « à l’inconnu » ; « à celui du dehors »
  rationale: Le terme ne permet pas de déterminer à lui seul si l’exclusion est ethnique, communautaire ou simplement relationnelle. La note préserve cette ouverture sans la résoudre doctrinalement.
translation_notes:
  register: Français international moderne, sobre et sentencieux. Le parallélisme antithétique est conservé ; les référents personnels sont explicités pour éviter une tournure française obscure, tandis que les ambiguïtés réelles de l’hébreu sont maintenues dans les notes.
