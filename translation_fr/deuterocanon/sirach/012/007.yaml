    issue: « refuse à l’homme mauvais » est ambigu et elliptique.
    rationale: La formulation française peut évoquer le fait de repousser un homme mauvais, alors que מְנַע מֵרָע porte sur le fait de retenir ou de ne pas accorder ce qui serait donné. « Ne donne pas à l’homme mauvais » clarifie sans modifier le sens.
  - severity: medium
    issue: La première possibilité proposée dans la note a (« retiens-toi devant le mal ») ne correspond pas au sens de מְנַע מֵרָע.
    rationale: Le verbe signifie retenir/refuser, avec un complément introduit par מן; il ne signifie pas se retenir devant le mal. La note doit préserver l’ambiguïté entre « le mal » et « la personne mauvaise » sans introduire un sens distinct.
