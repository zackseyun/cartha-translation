  verdict: revise
  source_fidelity: La traduction doit exprimer que l'aide ou le don est retenu à l'égard de la personne mauvaise. « Refuse à l’homme mauvais » est syntaxiquement possible, mais reste elliptique et peut se comprendre comme le rejet de la personne elle-même plutôt que comme le refus de lui donner. Le grec parallèle (« ne viens pas en aide au pécheur ») confirme un référent personnel, sans imposer « pécheur » dans le texte principal.
  naturalness: « Homme de bien » et « homme mauvais » forment en français moderne un contraste sentencieux naturel. « Ne donne pas à… » est plus clair et plus idiomatique que « refuse à… ». La répétition de « donne » conserve le parallélisme concis de l’hébreu.
  terminology: '« Honore le pauvre » rend fidèlement הֹקֵיר מָךְ. « L’étranger » conserve la portée non précisée de לְזֵר; la note indique utilement qu’il peut s’agir plus largement d’une personne extérieure au groupe concerné. La note a doit corriger l’explication abstraite : le sens littéral est « retiens/refuse [quelque chose] au mal ou au mauvais », non « retiens-toi devant le mal ».'
  issues:
