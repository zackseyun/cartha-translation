base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/012/005.yaml
  text: Do not give him your bread[b][a], lest by it he set himself against you.
translation:
  language: fr
  text: Ne lui donne pas de nourriture[a], de peur qu’il ne s’en serve pour se dresser contre toi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : littéralement « objets » ou « récipients de pain » ; l’expression est difficile. Le grec parallèle appuie le sens de « pain » ou de « nourriture ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de peur qu’il ne prenne ainsi le pouvoir sur toi ». Le grec exprime plus nettement l’idée de domination.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּלֵי לָחֶם
  choice: de nourriture
  rationale: L’expression hébraïque, littéralement proche de « objets/récipients de pain », est difficile. Le grec parallèle parle de pains et confirme qu’il s’agit de nourriture ou de provisions. « Nourriture » restitue clairement le sens sans imposer l’idée d’une possession exprimée par « ton ».
- source_word: אַל תִּתֵּן לוֹ
  choice: Ne lui donne pas
  rationale: Rend directement et naturellement la défense hébraïque.
- source_word: לָמָּה
  choice: de peur que
  rationale: לָמָּה signifie normalement « pourquoi », mais la proposition transmise est obscure. Le grec ἵνα μὴ soutient ici une mise en garde exprimant le résultat redouté.
- source_word: בָם
  choice: s’en serve
  rationale: Le pronom hébreu est pluriel, en accord avec l’expression initiale difficile. En français, la reprise par « en » convient au collectif singulier « nourriture » et conserve l’idée de moyen.
- source_word: יַקְבִּיל אֵלֶיךָ
  choice: se dresser contre toi
  rationale: Cette formulation garde le sens hostile probable du verbe hébreu. Elle reste moins forte que « te dominer », lecture suggérée plus explicitement par le grec.
theological_decisions:
- issue: Articulation du témoin hébreu difficile et du parallèle grec
  choice: Suivre prioritairement l’hébreu, tout en laissant le grec éclairer la valeur finale de la proposition et la portée hostile du dernier verbe.
  alternative: « Prive-le de pain, de peur qu’il ne prenne ainsi le pouvoir sur toi. »
  rationale: L’hébreu conservé demeure la base, mais sa syntaxe est difficile et signalée comme légèrement discordante. Le grec fournit un appui ancien pour comprendre la phrase comme un avertissement, sans qu’il faille remplacer entièrement les nuances de l’hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. « Nourriture » est plus naturel que le littéralisme obscur de l’hébreu; « se dresser contre toi » préserve la tension entre l’opposition suggérée par l’hébreu et la domination plus forte du grec.
