base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/012/012.yaml
  text: Be to him like one who reveals a secret[a], and he will not find a way to ruin you[b]; and know the outcome of jealousy.
translation:
  language: fr
  text: Sois envers lui comme envers quelqu’un qui révèle un secret[a] ; il ne trouvera pas le moyen de te détruire. Sache quelle est l’issue de la jalousie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme envers quelqu’un qui dévoile un secret ». L’image peut inviter à se tenir sur ses gardes devant celui qui divulgue ce qui devrait rester caché.
    reason: lexical_alternative
  - marker: b
    text: Ou « de l’envie ». L’hébreu parle de « la fin » ou de « l’issue » de la jalousie ou de l’envie. Le texte grec présente ici un avertissement beaucoup plus développé contre un ennemi qui chercherait à prendre ta place.
    reason: alternative_reading
lexical_decisions:
- source_word: הֱיֵה לוֹ
  choice: Sois envers lui
  rationale: L’impératif de היה suivi de ל exprime ici l’attitude à adopter envers quelqu’un. « Sois envers lui » garde la forme directe de l’hébreu sans préciser davantage la conduite visée.
- source_word: כִּמְגַלֶּה רָז
  choice: comme envers quelqu’un qui révèle un secret
  rationale: מְגַלֶּה, participe de גלה, signifie « qui découvre/révèle », et רָז « secret ». La répétition de « envers » rend en français le rapport implicite de la comparaison tout en conservant son image énigmatique et prudente.
- source_word: וְלֹא יִמְצָא לְהַשְׁחִיתְךָ
  choice: il ne trouvera pas le moyen de te perdre
  rationale: Le texte dit littéralement « il ne trouvera pas [de quoi/comment] te détruire ». « Le moyen de » explicite naturellement en français le lien avec l’infinitif; « te perdre » exprime une ruine grave sans limiter le propos à la mort physique.
- source_word: וְדַע
  choice: Sache
  rationale: L’impératif hébreu est traduit directement. Le parallèle grec formule plutôt une reconnaissance ultérieure, mais il ne remplace pas ici la leçon hébraïque conservée.
- source_word: אַחֲרִית
  choice: l’issue
  rationale: אַחֲרִית peut désigner la fin, l’aboutissement ou le résultat. « L’issue » est idiomatique et garde l’idée de conséquence finale.
- source_word: קִנְאָה
  choice: jalousie
  rationale: קִנְאָה peut signifier jalousie, envie ou zèle. Dans cet avertissement contre une hostilité destructrice, « jalousie » convient, tandis que « envie » demeure possible et est signalé en note.
theological_decisions:
- issue: Impératif hébreu concis ou avertissement grec développé
  choice: Traduire en priorité le texte hébreu conservé, avec ses impératifs et son image concise.
  alternative: Suivre le grec, qui avertit de ne pas placer l’ennemi près de soi ni à sa droite, de peur qu’il ne prenne sa place.
  rationale: Le témoin hébreu disponible diverge sensiblement du grec. La traduction ne fusionne pas les deux formes ni ne remplace l’hébreu par l’expansion grecque; elle laisse subsister la concision et l’ambiguïté du texte source principal.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la comparaison inhabituelle de l’hébreu plutôt que de la transformer en conseil explicite. Le tutoiement correspond aux impératifs masculins singuliers du texte.
