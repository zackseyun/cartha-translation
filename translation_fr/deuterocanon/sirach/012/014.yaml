translation:
  language: fr
  text: Ne le fais pas asseoir à ta droite, de peur qu’il ne cherche à obtenir ta place[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « ton siège ». Cette expression peut aussi désigner ta place, ta position ou ton statut. L’hébreu porte littéralement « pourquoi ? » ; dans ce contexte, il introduit vraisemblablement la conséquence redoutée.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תּוֹשִׁיבֵהוּ
  choice: Ne le fais pas asseoir
  rationale: 'La tournure négative avec le hifil de ישב exprime une interdiction et conserve la valeur causative : il ne faut pas lui attribuer cette place.'
- source_word: לִימִינֶךָ
  choice: à ta droite
  rationale: Rendu naturel de l’expression hébraïque, qui désigne à la fois la proximité immédiate et, dans ce contexte, une place privilégiée.
- source_word: לָמָּה
  choice: de peur que
  rationale: Bien que לָמָּה signifie normalement « pourquoi », il introduit ici, selon le contexte sapientiel, la conséquence indésirable que l’avertissement cherche à prévenir. Une note signale la forme littérale inhabituelle.
- source_word: יְבַקֵּשׁ
  choice: il ne cherche
  rationale: בקש signifie chercher, désirer obtenir ou tenter d’acquérir. « Chercher » maintient cette amplitude.
- source_word: מוֹשָׁבֶךָ
  choice: prendre ta place
  rationale: מוֹשָׁב peut désigner un siège, une place ou une position. « Ta place » garde l’image spatiale tout en laissant entendre le rang ou le statut; « prendre » explicite sobrement le but impliqué par « chercher » en français.
theological_decisions:
- issue: Rapport entre le texte hébreu conservé et le parallèle grec
  choice: Traduire directement l’hébreu, qui est clair et de haute confiance, tout en comprenant l’avertissement dans le cadre plus large d’une association dangereuse attesté par le grec.
  alternative: Suivre plus directement la formulation grecque sur celui qui fréquente un pécheur et partage ses péchés.
  rationale: Le témoin hébreu extant doit gouverner le verset. Le grec présente ici une formulation syntaxiquement différente et sert surtout de contrôle contextuel; il ne doit pas remplacer l’image concrète du siège et de la place.
- issue: Portée sociale de la place à droite et du « siège »
  choice: Conserver l’image concrète dans le texte et expliquer en note qu’elle peut évoquer honneur, rang ou statut.
  alternative: 'Paraphraser directement : « Ne lui accorde pas une place d’honneur, sinon il cherchera à usurper ta position. »'
  rationale: La formulation retenue préserve la tension entre siège matériel et position sociale sans imposer une interprétation unique.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reflète les suffixes hébreux de deuxième personne. La formulation conserve l’image du placement à droite et du siège, tout en restant immédiatement intelligible.
