  text: A friend is not known in prosperity[a], and an enemy is not hidden in adversity.
translation:
  language: fr
  text: Dans la prospérité, on ne reconnaît pas un ami[a] ; dans l’adversité, un ennemi ne reste pas caché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Un ami n’est pas connu dans le bonheur, et un ennemi n’est pas caché dans le malheur. » Le grec diffère dans la première proposition et dit approximativement : « Un ami ne sera pas vengé — ou récompensé — dans les biens. » Le texte hébreu conservé est suivi ici ; il forme un proverbe équilibré opposant la prospérité à l’adversité.'
    reason: textual_variant
lexical_decisions:
- source_word: אוֹהֵב
  choice: un ami
  rationale: Le participe désigne ici une personne liée par l’amitié ou l’affection, non un partenaire amoureux. Le grec φίλος confirme le sens relationnel « ami ».
- source_word: לֹא יִוָּדַע
  choice: on ne reconnaît pas
  rationale: Le nifal de ידע exprime le fait d’être connu ou reconnu. La tournure française impersonnelle rend naturellement l’idée que la prospérité ne permet pas de discerner qui est véritablement un ami.
- source_word: בַּטּוֹבָה
  choice: dans la prospérité
  rationale: Littéralement « dans le bien », l’expression désigne ici des circonstances favorables. « Prospérité » forme une antithèse claire avec « adversité ».
- source_word: וְלֹא יְכֻסֶּה
  choice: ne reste pas caché
  rationale: Le passif de כסה signifie « être couvert, dissimulé ». « Ne reste pas caché » exprime naturellement qu’un ennemi se dévoile dans l’épreuve sans ajouter une impossibilité absente du texte.
- source_word: בְרָעָה
  choice: dans l’adversité
  rationale: רעה renvoie ici au malheur ou à des circonstances difficiles, et non au mal moral. « Adversité » maintient le registre proverbial et le contraste avec la prospérité.
- source_word: שׂוֹנֵא
  choice: un ennemi
  rationale: Le participe signifie littéralement « celui qui hait » et désigne dans ce contexte une personne hostile. « Ennemi » est l’équivalent français naturel, appuyé par le grec ἐχθρός.
