translation_notes:
  register: Français international moderne, sobre et proverbial. Le point-virgule met en valeur le parallélisme antithétique des deux propositions. La formulation impersonnelle « on ne reconnaît pas » est naturelle en français tout en restant proche du passif hébreu.
