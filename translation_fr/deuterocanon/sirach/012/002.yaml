  text: Do good to the righteous[a], and you will find repayment—if not from him, then from Yahweh.
translation:
  language: fr
  text: 'Fais du bien au juste, et tu trouveras une rétribution : si elle ne vient pas de lui, elle viendra du SEIGNEUR.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « du Très-Haut » ; le témoin hébreu porte « du SEIGNEUR ».
    reason: textual_variant
lexical_decisions:
- source_word: הֵיטִב
  choice: Fais du bien
  rationale: L’impératif hiphil de יטב exprime ici une action bienfaisante envers autrui. « Fais du bien » est direct, naturel et correspond aussi au grec εὖ ποίησον.
- source_word: לַצַּדִּיק
  choice: au juste
  rationale: צַדִּיק désigne une personne droite ou juste. « Au juste » reste proche de l’hébreu et convient au singulier masculin du texte, tandis que le grec εὐσεβεῖ met davantage l’accent sur la piété.
- source_word: תִּמְצָא
  choice: tu trouveras
  rationale: Le verbe signifie littéralement « trouver ». Cette formulation conserve l’image hébraïque sans obscurcir le résultat attendu.
- source_word: תַשְׁלוּמַת
  choice: une rétribution
  rationale: Le nom évoque ce qui est rendu en retour, une compensation ou une récompense. « Rétribution » préserve cette idée de retour sans réduire le sens à un simple paiement financier.
- source_word: אִם לֹא מִמֶּנוּ
  choice: si elle ne vient pas de lui
  rationale: L’hébreu dit littéralement « si ce n’est pas de lui ». L’ajout explicatif du sujet féminin « elle », renvoyant à la rétribution, rend la relation syntaxique naturelle en français tout en conservant le référent masculin singulier « lui ».
- source_word: מֵיְהֹוָה
  choice: du SEIGNEUR
  rationale: Le témoin hébreu porte le nom divin YHWH. « Le SEIGNEUR », en petites capitales conventionnelles ici représentées par des capitales, signale ce nom propre et suit le témoin principal.
theological_decisions:
- issue: Le titre divin de la proposition finale diffère entre les témoins hébreu et grec.
  choice: du SEIGNEUR
  alternative: du Très-Haut
  rationale: Le texte principal suit l’hébreu conservé, מֵיְהֹוָה. La leçon grecque παρὰ Ὑψίστου est une variante significative, conservée en note plutôt qu’harmonisée.
- issue: Le bénéficiaire juste est repris par un pronom masculin singulier.
  choice: de lui
  alternative: de cette personne
  rationale: Le suffixe masculin singulier hébreu, confirmé par le grec αὐτοῦ, est maintenu sans neutralisation.
translation_notes:
  register: Français moderne, sobre et sapiential. La structure conditionnelle est légèrement explicitée (« elle ne vient pas… elle viendra ») pour être idiomatique, tout en conservant le vocabulaire et la tension du texte hébreu.
