  text: He searches out the deep and the heart[b][a], and he understands all their secrets.
translation:
  language: fr
  text: Il sonde l’abîme et le cœur[a], et discerne tout ce qui est mis à nu en eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'À Massada, l’hébreu conserve seulement le début plus court : « Il a sondé l’abîme et le cœur. » Le texte de la Gueniza du Caire ajoute la proposition suivante.'
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « dans toutes leurs nudités ». Le grec porte plutôt : « il a considéré toutes leurs ruses », ce qui reflète probablement une autre lecture ou une autre tradition d’interprétation.'
    reason: alternative_reading
lexical_decisions:
- source_word: תהום
  choice: l’abîme
  rationale: Le terme désigne la profondeur ou l’abîme primordial. « L’abîme » conserve sa portée cosmique et correspond au grec ἄβυσσον.
- source_word: לב
  choice: le cœur
  rationale: לב désigne le cœur comme siège de la pensée, des intentions et de la vie intérieure. Ce choix préserve l’anthropologie hébraïque et concorde avec le grec καρδίαν.
- source_word: חקר
  choice: sonde
  rationale: Le verbe exprime une exploration approfondie. « Sonder » convient naturellement aussi bien à l’abîme qu’au cœur et rend la profondeur de l’investigation.
- source_word: מערומיהם
  choice: tout ce qui est à nu en eux
  rationale: La forme hébraïque évoque littéralement leurs « nudités », c’est-à-dire ce qui se trouve entièrement dévoilé. Cette formulation conserve l’image sans produire l’expression française peu naturelle « toutes leurs nudités ».
- source_word: יתבונן
  choice: discerne
  rationale: La forme verbale exprime une attention qui mène à la compréhension. « Discerne » rend cette perception pénétrante mieux qu’un simple verbe de vision.
theological_decisions:
- issue: Le sujet divin est implicite dans la ligne hébraïque.
  choice: Employer « il » sans ajouter le nom de Dieu.
  alternative: Expliciter « le Seigneur », comme le fait la suite du parallèle grec.
  rationale: Le contexte identifie clairement Dieu, mais la ligne hébraïque ne le nomme pas. Le pronom respecte cette formulation implicite.
- issue: Portée de מערומיהם.
  choice: Conserver dans le texte l’image de ce qui est mis à nu.
  alternative: Traduire par « tous leurs secrets » ou suivre le grec avec « toutes leurs ruses ».
  rationale: L’hébreu met l’accent sur le dévoilement total devant Dieu. « Secrets » expliciterait le sens, mais effacerait l’image; le grec semble représenter une autre lecture ou tradition interprétative.
translation_notes:
  register: Français international moderne, sobre et digne. « Sonder le cœur » est idiomatique, tandis que « tout ce qui est à nu en eux » préserve l’image hébraïque dans une formulation intelligible. Le présent exprime une vérité générale sur la connaissance divine.
