  rationale: La révision rétablit pour la première proposition le sens dynamique d’ordonner/mettre en ordre et prend en compte le grec parallèle, sans supprimer l’ambiguïté de la formulation hébraïque, signalée en note. Elle atténue aussi la titulature interprétative de « l’Unique » tout en préservant le sens d’unicité. Les ancres et les quatre notes sont conservées et correspondent chacune à un point effectivement présent dans le texte.
