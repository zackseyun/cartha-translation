  yaml_path: translation/deuterocanon/sirach/042/021.yaml
  text: He has set in order the mighty works of his wisdom[a], and he alone is from everlasting. He neither gains increase nor diminishes[d][c][b], and he has no need of any counselor.
translation:
  language: fr
  text: Il a mis en ordre les œuvres puissantes de sa sagesse[a] ; il est unique depuis toujours[b]. Rien ne s’ajoute à lui et rien ne lui est retiré[c] ; il n’a besoin d’aucun conseiller[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est condensé et peut évoquer « la puissance de sa sagesse ». Le grec parallèle comprend : « Il a ordonné les œuvres grandioses de sa sagesse. »'
    reason: cross_reference
  - marker: b
    text: 'Littéralement : « il est un ». Le grec parallèle développe la durée : « avant l’âge et jusque dans l’âge ».'
    reason: lexical_alternative
  - marker: c
    text: Le second verbe hébreu est difficile ; le sens probable est que rien ne peut être ôté à Dieu ni le diminuer.
    reason: alternative_reading
  - marker: d
    text: 'Littéralement : « d’aucune personne intelligente » ou « d’aucune personne douée de discernement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גבורת חכמתו
  choice: la puissance de sa sagesse
  rationale: Le singulier hébreu exprime littéralement « la puissance de sa sagesse ». Cette formulation conserve la densité de l’hébreu, tandis que le grec parallèle comprend plutôt les manifestations grandioses de cette sagesse.
- source_word: תכן
  choice: a établi
  rationale: Le verbe peut évoquer l’action de mesurer, de régler ou d’établir. « A établi » convient au contexte et reste assez large pour ne pas trancher excessivement entre ces nuances.
- source_word: אחד הוא
  choice: il est l’Unique
  rationale: Littéralement, « il est un ». En français, « l’Unique » exprime naturellement la singularité ou l’incomparabilité visée, tout en signalant dans une note la formulation littérale.
- source_word: מעולם
  choice: depuis toujours
  rationale: Expression française actuelle et digne pour une existence remontant au-delà du temps accessible. Le grec parallèle, « avant l’âge et jusque dans l’âge », appuie cette portée temporelle étendue.
- source_word: לא נוסף ולא נאצל
  choice: Rien ne s’ajoute à lui et rien ne lui est retiré
  rationale: 'La tournure française explicite le parallélisme probable : Dieu ne reçoit aucun accroissement et ne subit aucune diminution. Le second verbe hébreu demeure difficile, ce que la note indique.'
- source_word: ולא צריך לכל מבין
  choice: il n’a besoin d’aucun conseiller
  rationale: 'מבין désigne littéralement une personne intelligente ou douée de discernement. Dans ce contexte, « conseiller » rend sa fonction : nul n’a à fournir à Dieu l’intelligence qui lui manquerait.'
theological_decisions:
- issue: Unicité divine dans אחד הוא
  choice: il est l’Unique
  alternative: il est un
  rationale: La traduction choisie rend clairement en français l’unicité affirmée sans développer cette brève formule en énoncé métaphysique plus précis que l’hébreu.
- issue: Portée temporelle de מעולם
  choice: depuis toujours
  alternative: depuis les temps anciens
  rationale: Le grec parallèle étend explicitement l’affirmation avant et à travers l’âge ; « depuis toujours » reflète cette attestation sans reproduire son développement absent de l’hébreu.
- issue: Immutabilité dans לא נוסף ולא נאצל
  choice: Rien ne s’ajoute à lui et rien ne lui est retiré
  alternative: Il ne s’accroît ni ne diminue
  rationale: La formulation retenue suit la forme additive et privative probable de l’hébreu, sans préciser par un vocabulaire doctrinal extérieur la nature de cette immutabilité.
translation_notes:
  register: Français international moderne, sobre et soutenu. La syntaxe reste concise et poétique. « Depuis toujours » évite l’archaïsme de « de toute éternité », et « conseiller » restitue naturellement la fonction contextuelle de la personne « intelligente » mentionnée en hébreu.
