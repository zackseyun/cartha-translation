  terminology: « Conseiller » est une bonne transposition contextuelle de מבין, avec une note qui conserve le sens littéral. « Depuis toujours » est naturel et rend de manière raisonnable מעולם à la lumière du grec parallèle, sans importer une formule doctrinale figée.
