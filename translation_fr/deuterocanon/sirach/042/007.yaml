- from: Pour tout lieu que tu confies[a], tiens-en le compte toi-même ; que tout ce qui est donné ou reçu soit consigné par écrit.
  to: Pour tout ce que tu confies[a], compte-le toi-même ; que tout donner et tout recevoir soient consignés par écrit.
  rationale: La révision remplace l’expression opaque « lieu que tu confies » par « ce que tu confies », qui correspond mieux au sens pratique indiqué par le grec tout en laissant la note signaler l’ellipse et l’ambiguïté du terme hébreu. Elle conserve le parallélisme comptable et l’exigence d’une trace écrite.
