  text: For whatever place you appoint[a], keep count by your hand; and every giving and receiving should be in writing.
translation:
  language: fr
  text: Pour tout ce que tu confies[a], compte-le toi-même ; que tout donner et tout recevoir soient consignés par écrit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est très condensé ici, et le mot traduit par « ce que » peut aussi évoquer un lieu ou une affaire placée sous responsabilité. Le grec porte : « Tout ce que tu remets, fais-le avec nombre et poids, et que tout don et toute réception soient consignés par écrit. » Il éclaire le sens de gestion précise et documentée.'
    reason: alternative_reading
lexical_decisions:
- source_word: על מקום תפקד
  choice: Pour tout lieu que tu confies
  rationale: 'L’hébreu est très condensé : על מקום signifie littéralement « au sujet de/sur un lieu », tandis que פקד peut exprimer l’idée de confier, assigner ou placer sous responsabilité. La traduction garde « lieu » sans fusionner les deux termes en « dépôt », tout en donnant à פקד son sens contextuel de « confier ».'
- source_word: יד תספור
  choice: tiens-en le compte toi-même
  rationale: Littéralement, « ta main comptera ». En français actuel, « toi-même » restitue naturellement l’insistance sur un décompte personnel et soigneux, sans conserver une tournure corporelle obscure.
- source_word: ומתת ולקח
  choice: tout ce qui est donné ou reçu
  rationale: Le couple verbal désigne les deux côtés d’une transaction. Cette formulation française est plus naturelle que les substantifs « don et réception » et concorde avec le grec δόσις καὶ λῆψις.
- source_word: הכל בכתב
  choice: soit consigné par écrit
  rationale: La formule exige que l’ensemble des transactions fasse l’objet d’une trace écrite. « Consigné par écrit » rend clairement l’idée de documentation comptable.
