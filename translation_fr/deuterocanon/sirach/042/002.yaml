translation:
  language: fr
  text: au sujet de la loi du Très-Haut et de la prescription[b], et au sujet de celui qui déclare juste le méchant[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « celui qui justifie le méchant » ou « celui qui donne raison au méchant ». L’hébreu מצדיק להצדיק emploie des termes judiciaires et sa construction est concise. Le grec parallèle lit : « un jugement pour justifier l’impie »; il peut donc aussi soutenir la traduction « un jugement qui déclare juste le méchant ».'
    reason: lexical_alternative
  - marker: b
    text: Le témoin hébreu porte « la loi du Très-Haut et la prescription ». Le grec parallèle lit « la loi du Très-Haut et l’alliance »; il a donc « alliance » là où l’hébreu a « prescription ».
    reason: alternative_reading
lexical_decisions:
- source_word: תורת עליון
  choice: la loi du Très-Haut
  rationale: תורה peut désigner l’enseignement ou la loi. Son association avec חוק dans ce contexte juridique favorise « loi », tandis que עליון est naturellement rendu par « Très-Haut ».
- source_word: חוק
  choice: le statut
  rationale: חוק désigne ici une prescription établie. « Statut » maintient le registre juridique et le distingue de תורה.
- source_word: מצדיק / להצדיק
  choice: un jugement qui déclare juste
  rationale: 'La racine צדק au hifil a ici une portée judiciaire : il s’agit de prononcer quelqu’un juste. Cette formulation conserve le sens forensique sans réduire le verbe à une simple approbation morale.'
- source_word: רשע
  choice: le méchant
  rationale: רשע désigne une personne coupable ou mauvaise. Le singulier générique français « le méchant » préserve la concision de l’hébreu et correspond au grec ἀσεβῆ.
- source_word: ועל
  choice: au sujet de
  rationale: La préposition répétée organise une liste de sujets. « Au sujet de » est clair, naturel et suffisamment soutenu en français moderne.
theological_decisions:
- issue: Valeur judiciaire de צדק / δικαιόω
  choice: déclare juste
  alternative: justifie ; donne raison à
  rationale: « Déclare juste » rend explicitement la dimension judiciaire du verbe sans imposer un sens doctrinal ultérieur à « justifier ». La note conserve néanmoins cette traduction formelle possible.
- issue: Construction concise מצדיק להצדיק רשע
  choice: un jugement qui déclare juste le méchant
  alternative: quelqu’un qui justifie le méchant
  rationale: Le parallèle grec associe explicitement l’infinitif à κρίματος (« jugement »), ce qui soutient la lecture abstraite adoptée, bien que l’hébreu puisse sembler désigner plus directement un agent. L’ambiguïté est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire juridique est conservé sans archaïsme. Le segment reste syntaxiquement lié à l’exhortation du verset précédent, conformément à la forme fragmentaire de la source fournie.
