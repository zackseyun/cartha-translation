  text: He lives and stands forever[b][a]; his goodness passes from one thing to another.
translation:
  language: fr
  text: Il vit et demeure à jamais[a] ; sa bonté passe d’une chose à l’autre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation hébraïque est concise et quelque peu incertaine ici. Le texte grec parallèle présente une forme différente et plus développée : « Rien ne fut ajouté ni retranché, et il n’eut besoin d’aucun conseiller. Comme toutes ses œuvres sont désirables ! Elles sont comme une étincelle offerte au regard. »'
    reason: textual_variant
  - marker: b
    text: 'Autres traductions possibles : « sa bonté passe sur chaque chose » ou « sa bonté va de l’une à l’autre ». L’expression hébraïque est condensée, et la valeur exacte de « ceci sur cela » reste incertaine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוא
  choice: Il
  rationale: Dans le contexte de l’hymne, le pronom renvoie à Dieu ; le masculin personnel convient donc mieux qu’un pronom impersonnel.
- source_word: חי
  choice: vit
  rationale: Cette forme exprime une vie continue. « Vit » est direct, naturel et conserve cet aspect durable.
- source_word: ועומד
  choice: et demeure
  rationale: Le verbe signifie littéralement « se tient debout », mais peut exprimer la permanence. « Demeure » rend ici l’idée avec naturel sans l’affaiblir.
- source_word: לעד
  choice: à jamais
  rationale: Expression française courante et digne pour une durée perpétuelle.
- source_word: זה על זה
  choice: de l’un à l’autre
  rationale: La formule hébraïque, très condensée, peut indiquer un passage ou une relation distributive entre diverses réalités. Cette traduction préserve cette ouverture.
- source_word: חלף
  choice: passe
  rationale: Le verbe peut évoquer le fait de passer, de traverser ou de succéder. « Passe » maintient l’image de mouvement et l’ambiguïté du texte.
- source_word: טובו
  choice: sa bonté
  rationale: Le nom désigne naturellement la bonté ou la bienfaisance. « Sa bonté » est le rendu le plus direct, sans restreindre le sens à la seule générosité ni l’orienter vers la beauté.
theological_decisions:
- issue: Rapport entre la ligne hébraïque et le texte grec parallèle, plus développé
  choice: Traduire dans le texte principal la ligne hébraïque conservée et signaler la forme grecque en note.
  alternative: Remplacer l’hébreu par le texte grec ou harmoniser entièrement les deux formes.
  rationale: L’hébreu conservé est le témoin principal ici. Le grec semble représenter une forme différente ou plus développée ; il éclaire l’histoire textuelle sans devoir supplanter l’hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. « Demeure à jamais » exprime naturellement la permanence divine ; la seconde proposition conserve volontairement la formulation ouverte et le mouvement du texte hébreu.
