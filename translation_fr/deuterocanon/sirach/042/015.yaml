base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/015.yaml
  text: I will remember the works of God[a], and what I have seen I will recount. At the word of God is his will, and his work accomplishes his pleasure.
translation:
  language: fr
  text: Je me souviendrai des œuvres de Dieu[a], et je raconterai ce que j’ai vu. À la parole de Dieu, sa volonté prend effet, et son œuvre accomplit ce qu’il désire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle porte : « Je rappellerai les œuvres du Seigneur et je raconterai ce que j’ai vu ; dans les paroles du Seigneur sont ses œuvres. » La dernière ligne de l’hébreu est difficile ; le texte principal en donne donc le sens probable plutôt qu’une traduction strictement littérale.'
    reason: alternative_reading
lexical_decisions:
- source_word: אזכור נא
  choice: Je rappellerai
  rationale: Le cohortatif et la particule נא introduisent ici la déclaration du projet du sage. Le futur français est naturel et n’ajoute pas un « maintenant » absent du lexème hébreu.
- source_word: מעשי אל
  choice: les œuvres de Dieu
  rationale: מעשים désigne les actes ou les œuvres. « Œuvres » convient au registre de louange et אל est rendu directement par « Dieu ».
- source_word: וזה חזיתי ואספרה
  choice: et je raconterai ce que j’ai vu
  rationale: La formulation hébraïque est condensée. La relative « ce que j’ai vu », également appuyée par le parallèle grec, restitue clairement son sens sans alourdir le français.
- source_word: באומר אלהים
  choice: À la parole de Dieu
  rationale: La préposition ב peut exprimer ici le moment ou le moyen. « À la parole de Dieu » conserve cette latitude et reste proche du témoignage hébreu difficile.
- source_word: רצונו
  choice: sa volonté prend effet
  rationale: רצון peut désigner la volonté, le désir ou le bon plaisir. Le verbe « prend effet », suppléé pour former une phrase française, exprime le sens probable sans prétendre résoudre la syntaxe incertaine.
- source_word: ופועל רצונו לקחו
  choice: et son œuvre accomplit ce qu’il désire
  rationale: Le dernier membre est textuellement et syntaxiquement difficile. Cette formulation rend le sens probable d’une action divine qui réalise la volonté divine, tout en évitant un calque français obscur.
theological_decisions:
- issue: Titre divin dans אל, face au Κυρίου du parallèle grec
  choice: Dieu dans le texte principal fondé sur l’hébreu
  alternative: le Seigneur
  rationale: Le témoin hébreu conservé porte אל, tandis que le grec lit Κυρίου. Le texte principal suit donc l’hébreu, et la variante grecque est signalée en note.
- issue: Dernier membre difficile et partiellement incertain
  choice: Exprimer le sens probable selon lequel l’œuvre de Dieu réalise ce qu’il veut
  alternative: 'Suivre plus littéralement le grec : « dans les paroles du Seigneur sont ses œuvres »'
  rationale: La transmission hébraïque est difficile à cet endroit. Une équivalence optimale donne un français intelligible, tandis que la note conserve honnêtement l’autre témoignage ancien sans imposer une certitude factice.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur soutient l’élan méditatif du passage. La formulation évite à la fois l’archaïsme de « bon plaisir » et une précision excessive dans le dernier membre textuellement incertain.
