  text: All these live and endure forever; in every need, all obey.[a][b]
translation:
  language: fr
  text: Toutes ces choses vivent et demeurent à jamais ; pour tous les besoins, tous obéissent.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu de la Guéniza du Caire imprimé ici porte une autre ligne, approximativement : « Et qui peut se rassasier de contempler la forme, la forme de la hauteur du firmament dans sa pureté ? » Le témoignage plus ancien de Massada et la tradition grecque appuient le sens retenu dans le texte principal ; cette ligne hébraïque semble avoir été déplacée d’un passage voisin.'
    reason: textual_variant
  - marker: b
    text: Ou « pour tout usage » ou « dans tous les besoins », au lieu de « pour tous les besoins ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ταῦτα / הכל
  choice: Tous ces êtres
  rationale: Le démonstratif renvoie aux œuvres créées décrites dans le contexte. « êtres » rend la phrase naturelle en français sans limiter la référence aux seuls êtres animés.
- source_word: ζῇ / חי
  choice: vivent
  rationale: Rend directement l’affirmation de la vitalité continue de toutes les réalités évoquées.
- source_word: μένει εἰς τὸν αἰῶνα / קים לעד
  choice: subsistent pour toujours
  rationale: « subsistent » exprime la permanence durable, tandis que « pour toujours » conserve la portée temporelle.
- source_word: ἐν πάσαις χρείαις / ולכל צריך
  choice: en toute nécessité
  rationale: χρεία peut désigner le besoin, la nécessité, l’usage ou la fonction. Cette formulation préserve cette largeur sémantique sans trancher en faveur d’une finalité précise.
- source_word: ὑπακούει
  choice: obéissent
  rationale: Le verbe exprime l’obéissance ou la réponse docile de la création à l’ordre qui lui est donné.
- source_word: ומי ישבע להביט תואר תואר מרום רקיע על טוהר
  choice: Et qui pourrait se rassasier de contempler ? La splendeur des hauteurs du firmament dans sa pureté.
  rationale: Cette traduction du texte hébreu composite est conservée dans la note afin de rendre transparente la variante, vraisemblablement déplacée dans la tradition manuscrite du Caire.
theological_decisions:
- issue: Texte principal lorsque l’hébreu conservé paraît déplacé par rapport au contexte et à des témoins plus anciens
  choice: Suivre dans le texte principal le sens cohérent attesté par le grec et soutenu par le témoignage de Massada, tout en signalant intégralement la leçon hébraïque du Caire en note.
  alternative: 'Traduire comme texte principal l’hébreu composite du Caire : « Et qui pourrait se rassasier de contempler ? La splendeur des hauteurs du firmament dans sa pureté. »'
  rationale: La ligne hébraïque fournie ne correspond pas au déroulement contextuel et semble provenir d’un passage voisin. Le grec offre ici une phrase cohérente et concorde, quant au sens général, avec les données de Massada. La note préserve néanmoins la divergence réelle sans la dissimuler.
translation_notes:
  register: Français international moderne, digne et accessible. Le point-virgule maintient les deux affirmations étroitement liées. La variante textuelle importante et l’ambiguïté de χρεία sont explicitement préservées dans les notes.
