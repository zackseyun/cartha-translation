base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/009.yaml
  text: 'A daughter is a hidden cause of deceit to her father[a], and anxiety over her drives away his sleep: in her youth, lest she remain unmarried, and in her virginity[b], lest she not be married.'
translation:
  language: fr
  text: 'Une fille est, pour son père, un mensonge caché[a], et l’inquiétude qu’elle lui cause chasse son sommeil : pendant sa jeunesse, de peur qu’elle ne passe l’âge de se marier[b], et durant sa virginité, de peur qu’elle ne soit pas mariée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte littéralement une expression difficile, « un mensonge caché ». Le grec ancien lit « une insomnie cachée », ce qui suggère le souci secret qu’une fille cause à son père.
    reason: alternative_reading
  - marker: b
    text: Le sens de l’hébreu est incertain. Le grec évoque le fait de dépasser la fleur de l’âge ou l’âge considéré comme favorable au mariage.
    reason: textual_variant
lexical_decisions:
- source_word: בת לאב
  choice: Une fille est pour son père
  rationale: La tournure « pour son père » rend naturellement le rapport exprimé par le datif relationnel hébreu, également reflété par le grec πατρί.
- source_word: מטמנת שקר
  choice: un mensonge caché
  rationale: La formulation conserve l’expression difficile du témoin hébreu, qui associe ce qui est caché à la fausseté, sans la remplacer silencieusement par la lecture grecque « insomnie cachée ».
- source_word: דאגה תפריע שנתו
  choice: l’inquiétude qu’elle lui cause chasse son sommeil
  rationale: « Inquiétude » exprime un souci persistant, tandis que « chasse son sommeil » rend l’idée idiomatique de privation de sommeil et concorde avec le grec.
- source_word: בנעוריה פן תגור
  choice: pendant sa jeunesse, de peur qu’elle ne passe l’âge de se marier
  rationale: Le sens précis du verbe hébreu est incertain. La traduction suit prudemment l’appui du grec παρακμάσῃ, qui évoque le fait de dépasser la fleur de l’âge, en explicitant le contexte matrimonial.
- source_word: ובבתוליה פן לא תנשא
  choice: et tant qu’elle est vierge, de peur qu’elle ne trouve pas de mari
  rationale: « Tant qu’elle est vierge » conserve la catégorie sociale explicite de l’hébreu. La dernière proposition rend naturellement la crainte qu’elle ne soit pas mariée, tout en évitant en français la répétition lourde de « se marier ».
theological_decisions:
- issue: Le sens de מטמנת שקר face au parallèle grec ἀπόκρυφος ἀγρυπνία
  choice: Maintenir dans le texte « un mensonge caché », proche du témoin hébreu, et signaler en note la lecture grecque liée à l’insomnie.
  alternative: « une cause cachée d’insomnie » ou « une inquiétude secrète »
  rationale: L’hébreu conservé doit rester prioritaire, même si son expression est obscure. Le grec éclaire le contexte de l’inquiétude paternelle, mais ne justifie pas d’effacer la difficulté textuelle.
- issue: Le sens de פן תגור
  choice: « de peur qu’elle ne passe l’âge de se marier »
  alternative: « de peur qu’elle ne reste célibataire » ou « de peur qu’elle ne décline »
  rationale: Le mot hébreu est difficile dans ce contexte. Le parallèle grec favorise l’idée de dépasser la fleur de l’âge; la traduction conserve cette nuance sans prétendre que le sens est certain.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve le parallélisme du verset. Les réalités sociales anciennes sont rendues sans les approuver ni les atténuer, et les deux difficultés textuelles sont explicitement signalées.
