lexical_decisions:
- source_word: על
  choice: au sujet de
  rationale: La préposition répétée introduit les différents sujets de la liste; cette tournure est naturelle et conserve sa valeur thématique.
- source_word: חשבון
  choice: compte
  rationale: Le mot désigne ici un compte ou règlement financier, ce qui convient au contexte juridique et économique.
- source_word: חוכר
  choice: fermier
  rationale: Le terme désigne celui qui prend un bien à ferme. « Fermier » conserve ici son sens juridique traditionnel, précisé par la note pour éviter de le réduire au seul métier agricole.
- source_word: אדון
  choice: maître
  rationale: Dans ce cadre social ou contractuel, « maître » exprime une position d’autorité sans préciser indûment qu’il s’agit du propriétaire.
- source_word: אורח
  choice: hôte
  rationale: L’hébreu peut désigner un hôte, un voyageur ou un passant. « Hôte » suit le témoin hébreu tout en conservant une certaine latitude contextuelle.
- source_word: מחלקות
  choice: partage
  rationale: Le terme évoque la division ou la répartition; « partage » est le mot français naturel dans le domaine successoral.
- source_word: נחלה
  choice: héritage
  rationale: Équivalent clair du terme juridique et familial désignant un bien reçu en succession.
- source_word: ויש
  choice: et de biens
  rationale: Le dernier mot hébreu est concis et inhabituel ici; le contexte juridico-économique favorise le sens de biens ou d’avoirs, sans masquer l’incertitude signalée en note.
