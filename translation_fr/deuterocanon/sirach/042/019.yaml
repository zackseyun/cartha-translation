translation:
  language: fr
  text: Il fait connaître les changements qui adviennent[b][a] et révèle l’examen des choses cachées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec porte : « Il annonce ce qui est passé et ce qui doit venir, et révèle les traces des réalités cachées. » Il présente une expression temporelle plus développée que l’hébreu conservé.'
    reason: alternative_reading
