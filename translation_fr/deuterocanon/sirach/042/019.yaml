lexical_decisions:
- source_word: מחוה
  choice: fait connaître
  rationale: Le verbe signifie ici communiquer ou faire savoir. « Fait connaître » est naturel en français moderne et reste proche du sens hébreu, tout en concordant avec le parallèle grec.
- source_word: חליפות
  choice: les changements
  rationale: Le nom évoque des changements, des alternances ou des successions. « Les changements » conserve cette portée générale sans réduire le terme à un échange matériel.
- source_word: נהיות
  choice: qui adviennent
  rationale: Cette forme issue de היה désigne ce qui vient à l’existence ou se produit. « Qui adviennent » exprime ce devenir dans un registre digne et idiomatique.
- source_word: ומגלה
  choice: et révèle
  rationale: « Révèle » rend directement l’idée de dévoiler ce qui était caché.
- source_word: חקר
  choice: l’exploration
  rationale: Le terme désigne la recherche, l’examen approfondi ou l’investigation. « L’exploration » préserve l’idée d’une recherche pénétrante tout en évitant la tournure peu naturelle « la recherche des réalités cachées » après « révèle ».
- source_word: נסתרות
  choice: des réalités cachées
  rationale: Le pluriel substantivé désigne ce qui est dissimulé ou secret. « Les réalités cachées » est naturel et garde une portée large.
theological_decisions:
- issue: Rapport entre le texte hébreu et le parallèle grec plus développé
  choice: Traduire prioritairement l’hébreu conservé, sans introduire explicitement le passé et l’avenir dans le corps du verset.
  alternative: « Il annonce ce qui est passé et ce qui doit venir, et révèle les traces des réalités cachées. »
  rationale: L’hébreu conservé parle de changements qui adviennent, tandis que le grec explicite ce qui est passé et ce qui viendra. La traduction maintient la formulation hébraïque et signale l’expansion grecque en note, sans résoudre artificiellement l’écart textuel.
translation_notes:
  register: Français international moderne, clair et digne. « Adviennent » garde la nuance de venue à l’existence de נהיות sans lourdeur excessive. Les appels de note suivent l’ordre fourni dans le texte anglais audité, [b][a].
