  text: No understanding is lacking to him, and no word has escaped him.
translation:
  language: fr
  text: Aucune pensée ne lui échappe, aucune parole ne passe inaperçue.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שכל
  choice: pensée
  rationale: Dans ce parallélisme avec « parole », le terme désigne ici ce qui est conçu ou pensé. « Pensée » est naturel en français et concorde avec le grec διανόημα, sans limiter le sens à la faculté d’intelligence.
- source_word: נעדר ממנו
  choice: ne lui échappe
  rationale: Littéralement, rien n’est absent ou ne manque devant lui. Cette formulation française exprime clairement qu’aucune pensée ne se soustrait à sa connaissance.
- source_word: דבר
  choice: parole
  rationale: Le terme peut signifier « parole », « chose » ou « affaire ». Le parallèle grec λόγος et l’opposition pensée/parole appuient « parole » dans ce contexte.
- source_word: חלפו
  choice: ne passe inaperçue
  rationale: Le verbe exprime l’idée de passer au-delà. La tournure retenue rend idiomatiquement l’idée qu’aucune parole ne passe sans être connue de Dieu.
theological_decisions:
- issue: Étendue de la connaissance divine
  choice: 'Formulation absolue : aucune pensée ni parole ne lui échappe.'
  alternative: Atténuer en parlant seulement de compréhension ou d’attention.
  rationale: Les deux propositions négatives universelles du texte hébreu affirment sans restriction la connaissance divine; la traduction conserve cette portée sans ajout doctrinal.
translation_notes:
  register: Français moderne, sobre et dignifié. Le parallélisme « pensée / parole » est conservé, avec deux formulations idiomatiques légèrement variées pour éviter une répétition pesante.
