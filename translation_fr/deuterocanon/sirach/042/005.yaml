  text: about livestock[a], whether much or little, and about the price of merchandise for sale;
translation:
  language: fr
  text: à propos du bétail[a], qu’il soit nombreux ou peu nombreux, et du prix de vente des marchandises d’un commerçant ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec diffère sensiblement ici et parle plus largement d’opérations commerciales et de marchands. La traduction suit en priorité le témoin hébreu, le grec confirmant néanmoins le contexte commercial.
    reason: textual_variant
lexical_decisions:
- source_word: על מקנה
  choice: à propos du bétail
  rationale: La préposition על introduit le sujet dont il est question, tandis que מקנה désigne ici naturellement les animaux possédés, c’est-à-dire le bétail.
- source_word: בין רב למעט
  choice: qu’il soit nombreux ou peu nombreux
  rationale: L’expression oppose deux quantités. Cette formulation française explicite naturellement l’alternative tout en rattachant l’adjectif collectif « nombreux » au bétail.
- source_word: ועל ממחיר
  choice: et du prix de vente
  rationale: La construction hébraïque est condensée. « Du prix de vente » rend clairement son sens commercial sans reproduire mécaniquement les prépositions.
- source_word: ממכר תגר
  choice: des marchandises d’un commerçant
  rationale: ממכר peut désigner ce qui est vendu, et תגר un marchand ou commerçant. Le pluriel collectif « marchandises » donne un français naturel sans restreindre le type de biens.
