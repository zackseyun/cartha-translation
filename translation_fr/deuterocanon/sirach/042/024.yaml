  text: All things are in pairs[a], one opposite the other, and he has made nothing lacking.
translation:
  language: fr
  text: Toutes choses vont par deux, l’une en face de l’autre, et il n’a rien fait d’incomplet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le témoin hébreu de Massada pour cette section confirme lui aussi l’idée que rien n’a été créé déficient ou incomplet, bien que la transmission du texte hébreu autour de ces lignes soit fragmentaire et présente un agencement différent.
    reason: textual_variant
lexical_decisions:
- source_word: πάντα
  choice: Toutes choses
  rationale: Le neutre pluriel a une portée universelle. « Toutes choses » garde le ton sentencieux et l’ampleur du grec.
- source_word: δισσὰ
  choice: vont par deux
  rationale: L’adjectif exprime la dualité ou la disposition par paires. « Vont par deux » est naturel en français et prépare la relation exprimée ensuite.
- source_word: ἐν κατέναντι τοῦ ἑνός
  choice: l’une en face de l’autre
  rationale: L’expression indique que chaque élément est placé vis-à-vis de son correspondant. « En face de » préserve l’ambiguïté entre opposition et correspondance sans imposer l’idée de conflit.
- source_word: οὐκ ἐποίησεν
  choice: il n’a … fait
  rationale: Le sujet sous-entendu est Dieu dans le contexte des œuvres créées. Le passé composé rend naturellement l’acte créateur accompli.
- source_word: οὐδὲν ἐκλιπόν
  choice: rien … d’incomplet
  rationale: Le participe peut désigner ce qui manque, fait défaut ou demeure incomplet. Cette formulation concise convient à l’idée de totalité ordonnée sans préciser excessivement la nature du manque.
theological_decisions:
- issue: Sujet sous-entendu de ἐποίησεν
  choice: « il », renvoyant à Dieu
  alternative: 'Formulation passive : « rien n’a été fait incomplet »'
  rationale: Le grec laisse le sujet implicite, mais le contexte immédiat traite des œuvres de Dieu. Le pronom explicite assure la cohérence en français sans ajouter une affirmation étrangère au passage.
- issue: Nature du rapport entre les deux éléments
  choice: « en face de »
  alternative: « à l’opposé de »
  rationale: Le grec peut exprimer aussi bien le vis-à-vis que l’opposition. « En face de » conserve cette latitude et évite de réduire toutes les paires à des contraires absolus.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La tournure aphoristique reste concise; « vont par deux » est idiomatique, tandis que « en face de » préserve la tension entre correspondance et opposition.
