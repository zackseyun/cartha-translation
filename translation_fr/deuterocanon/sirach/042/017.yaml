base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/017.yaml
  text: The holy ones of God have not been sufficient to recount the wonders of the Lord[b][a]. God has strengthened his hosts to be strong before his glory.
translation:
  language: fr
  text: Les êtres saints de Dieu n’ont pas pu raconter les merveilles du Seigneur[a]. Dieu a fortifié ses armées afin qu’elles tiennent ferme devant sa gloire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Un témoin hébreu de Massada paraît lire « n’a pas compris » là où les manuscrits de la Gueniza du Caire ont « n’ont pas pu » ou « n’ont pas suffi ». Le grec appuie le sens de l’incapacité à raconter, en parlant de toutes ses merveilles.
    reason: textual_variant
  - marker: b
    text: 'Le second membre varie selon les témoins hébreux. La Gueniza du Caire lit : « Dieu a fortifié ses armées », tandis que Massada semble avoir une formulation pouvant se comprendre : « le Seigneur a affermi dans ses lumières » ou « ses luminaires ». Le grec porte : « ce que le Seigneur, le Tout-Puissant, a affermi, afin que l’univers soit établi dans sa gloire ».'
    reason: textual_variant
lexical_decisions:
- source_word: לא הספיקו
  choice: n’ont pas pu raconter pleinement
  rationale: Le verbe exprime ici l’insuffisance ou l’incapacité à mener jusqu’au bout l’énumération. « N’ont pas pu… pleinement » est naturel en français et concorde avec le grec, qui évoque le fait de tout raconter en détail, tout en évitant le tour peu idiomatique « n’ont pas suffi à raconter ».
- source_word: קדושי אל
  choice: les êtres saints de Dieu
  rationale: Cette formulation conserve la référence ouverte à des êtres consacrés ou célestes sans imposer le sens ecclésial plus marqué de « saints » employé seul.
- source_word: לספר נפלאות ה׳
  choice: raconter pleinement les merveilles du Seigneur
  rationale: לספר signifie raconter ou exposer, et נפלאות désigne les merveilles, notamment les actes merveilleux de Dieu. L’adverbe « pleinement » rend l’idée d’insuffisance portée par le verbe précédent et appuyée par le parallèle grec.
- source_word: אמץ אלהים
  choice: Dieu a fortifié
  rationale: Le texte hébreu principal nomme Dieu comme sujet et le verbe אמץ exprime l’action de rendre fort ou ferme.
- source_word: צבאיו
  choice: ses armées
  rationale: Le terme peut désigner des armées ou des troupes, y compris les armées célestes. « Armées » reste concret et préserve cette latitude sans ajouter explicitement « célestes ».
- source_word: להתחזק לפני כבודו
  choice: afin qu’elles tiennent ferme devant sa gloire
  rationale: La forme réfléchie de חזק évoque le fait de s’affermir ou de se montrer fort. « Tenir ferme » exprime naturellement en français la stabilité devant la gloire divine.
theological_decisions:
- issue: Titres divins différents selon les membres du verset et les témoins
  choice: « le Seigneur » dans le premier membre et « Dieu » dans le second
  alternative: « le Seigneur » dans les deux membres
  rationale: Le texte hébreu principal porte le tétragramme dans le premier membre et אלהים dans le second. Le grec emploie κύριος deux fois, tandis qu’un autre témoin hébreu paraît lire אדני dans le second membre. La traduction suit donc le témoin hébreu principal tout en signalant la variante.
- issue: Identité des קדושי אל
  choice: « les êtres saints de Dieu » sans identification plus précise
  alternative: « les anges de Dieu » ou « les saints de Dieu »
  rationale: Le contexte peut suggérer des êtres célestes, mais le terme hébreu ne les identifie pas explicitement comme des anges. Une formulation ouverte préserve l’ambiguïté du texte.
translation_notes:
  register: Français international actuel, digne et lisible. Le tour « les êtres saints » évite une coloration confessionnelle indue; « tenir ferme » restitue idiomatiquement l’idée d’affermissement. Les deux appels de note figurent dans le texte dans l’ordre [a], [b].
