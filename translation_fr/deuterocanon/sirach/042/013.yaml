translation:
  language: fr
  text: Car d’un vêtement sort la mite, et d’une femme, la méchanceté d’une femme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « et d’une femme, le mal d’une femme ». L’hébreu est concis et proverbial ; le grec dit de même : « d’une femme, la méchanceté d’une femme ».'
    reason: Variante lexicale et explicitation de la tournure elliptique.
lexical_decisions:
- source_word: בגד
  choice: vêtement
  rationale: Le terme désigne largement une pièce d’habillement. « Vêtement » respecte le singulier hébreu et correspond au grec ἱμάτιον.
- source_word: יצא
  choice: sort
  rationale: Le verbe signifie littéralement « sortir ». « Sort » conserve ici l’image proverbiale de la teigne qui provient du vêtement.
- source_word: עש
  choice: teigne
  rationale: Le nom désigne la teigne des vêtements ou l’insecte associé aux dégâts qu’elle cause. « Teigne » est le terme français usuel dans ce contexte.
- source_word: אשה
  choice: femme
  rationale: Le mot peut signifier « femme » ou « épouse », mais la formulation générique du proverbe et le parallèle grec γυνή favorisent « femme ».
- source_word: רעת אשה
  choice: la méchanceté d’une femme
  rationale: Cette formulation garde le rapport construit de l’hébreu, sa portée morale et son caractère abrupt, sans élargir ni atténuer l’affirmation.
theological_decisions:
- issue: Formulation proverbiale susceptible d’être perçue comme misogyne
  choice: Conserver la formulation directe centrée sur « femme » et sa dureté proverbiale.
  alternative: Adoucir ou généraliser, par exemple « le mal vient des humains », ou préciser « épouse ».
  rationale: L’hébreu comme le grec présentent une sentence tranchante. La traduction ne doit ni l’atténuer ni en tirer une affirmation doctrinale plus générale que le texte.
- issue: Ellipse dans le second membre
  choice: Conserver l’ellipse par « et d’une femme, la méchanceté d’une femme ».
  alternative: 'Répéter le verbe : « et d’une femme sort la méchanceté d’une femme ».'
  rationale: L’hébreu ne répète pas explicitement יצא dans le second membre. L’ellipse reste intelligible en français et préserve la concision ainsi que l’ambiguïté syntaxique du proverbe.
translation_notes:
  register: Français international actuel, digne et proverbial. La ponctuation rend l’ellipse hébraïque intelligible sans ajouter un second verbe. « Méchanceté » exprime une qualité morale tout en restant naturelle ; la note signale l’alternative plus littérale « mal ».
