base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/008.yaml
  text: 'Concerning the discipline of a simpleton and a fool[a], and an old man who turns back and takes counsel in sexual immorality: be truly careful[b], and a modest man before every living being.'
translation:
  language: fr
  text: 'À propos de la correction d’un homme naïf et d’un insensé, et d’un vieillard chenu qui prend conseil en matière d’inconduite sexuelle[a] : sois vraiment vigilant et réservé devant tous les vivants[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte plutôt : « et d’un homme extrêmement âgé mis en jugement avec des jeunes gens ». L’hébreu et le grec diffèrent sensiblement ici. Les consonnes hébraïques ושב peuvent aussi être vocalisées « et qui revient », plutôt que « et chenu ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « sois véritablement instruit et éprouvé devant tous les vivants », en suivant plus étroitement le grec.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוסר
  choice: correction
  rationale: Le terme désigne ici une instruction à visée corrective. « Correction » conserve cette dimension morale et s’insère naturellement après « à propos de ».
- source_word: פותה
  choice: homme naïf
  rationale: Le mot désigne une personne inexpérimentée, crédule ou facile à séduire. « Homme naïf » est clair en français moderne sans réduire le terme à un simple manque d’intelligence.
- source_word: כסיל
  choice: insensé
  rationale: Terme classique de la littérature sapientiale pour une personne moralement et intellectuellement déraisonnable. « Insensé » garde cette portée éthique.
- source_word: ושב וישיש
  choice: vieillard chenu
  rationale: ושב peut être lu comme « qui revient » si l’on vocalise שָׁב, mais, à côté de ישיש et en accord général avec le grec qui évoque un homme extrêmement âgé, la lecture שָׂב, « chenu, aux cheveux blancs », paraît préférable. « Vieillard chenu » rend les deux indications d’âge sans lourdeur excessive.
- source_word: נוטל עצה
  choice: prend conseil
  rationale: Rend directement l’expression hébraïque « prendre un conseil », avec une tournure française intelligible qui laisse ouverte la nature exacte de la consultation.
- source_word: בזנות
  choice: en matière d’inconduite sexuelle
  rationale: זנות couvre largement les conduites sexuelles illicites et ne se limite pas nécessairement à la prostitution. Cette formulation en préserve l’étendue sans archaïsme.
- source_word: זהיר באמת
  choice: vraiment vigilant
  rationale: זהיר exprime la prudence et la vigilance, tandis que באמת renforce la qualité comme authentique ou réelle. La formulation reste naturelle et proche de l’hébreu.
- source_word: צנוע
  choice: réservé
  rationale: Le terme peut évoquer la modestie, la retenue ou la discrétion. « Réservé » convient au comportement public demandé ici sans lui imposer un sens exclusivement vestimentaire ou social.
- source_word: לפני כל חי
  choice: devant tout être vivant
  rationale: Traduction transparente qui conserve la portée universelle et la formulation concrète de l’hébreu.
theological_decisions:
- issue: Choix du témoin principal dans une proposition où l’hébreu et le grec divergent fortement
  choice: 'Suivre l’hébreu conservé : le vieillard prend conseil en matière d’inconduite sexuelle.'
  alternative: 'Suivre le grec : un homme extrêmement âgé est jugé avec des jeunes gens.'
  rationale: L’hébreu est ici extant et constitue le témoin principal demandé. La leçon grecque est toutefois suffisamment différente et ancienne pour être signalée intégralement en note plutôt que réconciliée artificiellement avec l’hébreu.
- issue: Sens de ושב
  choice: Lire שָׂב, « chenu », en coordination avec ישיש.
  alternative: 'Lire שָׁב, « qui revient », et traduire : « un vieillard qui revient et prend conseil… »'
  rationale: L’association avec ישיש favorise deux désignations complémentaires de l’âge, et le parallèle grec confirme que la vieillesse est au premier plan. L’écriture consonantique permet néanmoins l’autre vocalisation, qui est donc mentionnée en note.
- issue: Valeur de זהיר dans l’exhortation finale
  choice: sois vraiment vigilant
  alternative: sois véritablement instruit
  rationale: Le sens de vigilance est bien attesté et convient directement à l’hébreu. Le grec πεπαιδευμένος soutient plutôt le sens d’instruction ou de formation; cette possibilité est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « à propos de » conserve la construction en forme de rubrique de l’hébreu. « Montre-toi réservé » explicite sobrement la valeur exhortative nécessaire en français. Tous les marqueurs de note figurent dans le texte principal.
