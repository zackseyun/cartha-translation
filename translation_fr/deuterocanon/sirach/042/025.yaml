  - severity: medium
    issue: « L’une ... l’autre » est référentiellement flottant en français.
    rationale: Sans nom féminin antécédent, la formulation est moins naturelle et moins claire. L’ajout minimal de « chose » rétablit une référence lisible sans préciser la nature des réalités visées.
  - severity: low
    issue: La note b formule imprécisément l’alternative du possessif.
    rationale: Le possessif ne « désigne » pas directement une splendeur; l’alternative porte sur son référent, possiblement la création ou la splendeur qu’elle manifeste.
