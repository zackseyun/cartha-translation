  source_fidelity: La première proposition doit rendre plus directement ἐστερέωσεν (« affermit / rend ferme »). « complète » est une interprétation contextuelle possible, mais elle s’éloigne du verbe grec, tandis que « ce qu’il y a de bon dans l’autre » explicite et modifie la relation génitivale. La question finale rend bien τίς πλησθήσεται ὁρῶν δόξαν αὐτοῦ.
  naturalness: Le féminin elliptique « L’une ... l’autre » n’a pas d’antécédent exprimé et paraît abrupt en français moderne. « Une chose ... d’une autre » est clair tout en gardant l’ellipse conceptuelle du grec. « Se rassasiera de contempler » convient au registre hymnique.
  terminology: « Affermit » conserve le sens central de ἐστερέωσεν. « Biens » rend sobrement τὰ ἀγαθά sans restreindre indûment le terme à des qualités morales ou à des objets matériels. « Gloire » est approprié pour δόξα; le possessif français maintient l’ambiguïté du référent.
