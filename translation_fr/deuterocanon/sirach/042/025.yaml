  text: One thing complements another's good things[b][a], and who can have enough of seeing his glory?
translation:
  language: fr
  text: Une chose affermit les biens d’une autre[a], et qui se rassasiera de contempler sa gloire[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « Une chose affermit les biens d’une autre. » Le verbe peut signifier « rendre ferme » ou « affermir »; dans ce contexte, il peut aussi évoquer l’accord mutuel des réalités créées.'
    reason: lexical_alternative
  - marker: b
    text: Le possessif renvoie très probablement à Dieu. Il peut aussi être compris en rapport avec la création, comme la splendeur qui s’y manifeste.
    reason: alternative_reading
lexical_decisions:
- source_word: ἓν τοῦ ἑνὸς
  choice: L’une ... dans l’autre
  rationale: La tournure grecque est elliptique et met deux réalités créées en relation réciproque. Le féminin reprend implicitement « une chose » et évite une formulation française pesante.
- source_word: ἐστερέωσεν
  choice: complète
  rationale: Le verbe signifie littéralement « affermir » ou « rendre ferme ». Dans ce contexte consacré à l’agencement des réalités créées, « complète » exprime naturellement la manière dont l’une soutient et met en valeur le bien de l’autre, tandis que le sens plus formel est conservé en note.
- source_word: τὰ ἀγαθά
  choice: ce qu’il y a de bon
  rationale: L’adjectif substantivé au pluriel désigne largement les bonnes qualités, les biens ou les bienfaits. Cette formulation française conserve cette ampleur sans imposer une catégorie précise.
- source_word: τίς πλησθήσεται
  choice: qui se rassasiera
  rationale: Le futur passif exprime le fait d’être rempli ou rassasié. Employé avec la contemplation, « se rassasier » rend avec naturel l’idée de ne jamais en avoir assez.
- source_word: ὁρῶν
  choice: de contempler
  rationale: Le participe présent évoque une vision soutenue. « Contempler » convient au registre hymnique et s’intègre naturellement après « se rassasier de ».
- source_word: δόξαν αὐτοῦ
  choice: sa gloire
  rationale: δόξα désigne ici la gloire ou la splendeur manifestée. Le possessif français préserve l’ambiguïté grammaticale du référent, explicitée en note.
theological_decisions:
- issue: Référent de αὐτοῦ
  choice: « sa » renvoie probablement à Dieu
  alternative: La splendeur manifestée dans la création elle-même
  rationale: Dans l’hymne environnant, les œuvres ordonnées manifestent la majesté du Créateur. Dieu est donc le référent le plus vraisemblable, mais la syntaxe permet aussi de comprendre la splendeur visible dans la création; la traduction et la note préservent cette tension.
translation_notes:
  register: Français moderne, international et digne. La formulation reste accessible tout en conservant le parallélisme et la question rhétorique du grec. Les deux notes rendent visibles l’alternative lexicale et l’ambiguïté du possessif.
