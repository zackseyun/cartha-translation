  text: Do not display your beauty to any man[b][a], and do not sit among women in the house.
translation:
  language: fr
  text: Ne montre ta beauté à aucun homme[a], et ne t’assieds pas avec des femmes dans une maison de femmes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « À tout mâle, ne donne pas beauté/apparence. » Le grec comprend la proposition autrement : « Ne regarde aucune personne avec beauté » (ou « pour sa beauté »).'
    reason: alternative_reading
  - marker: b
    text: Le dernier verbe hébreu est incertain dans le manuscrit de la Gueniza. Le grec soutient le sens « ne t’assieds pas parmi les femmes » ou « ne tiens pas compagnie à des femmes »; un témoin de Massada paraît également refléter une idée de fréquentation sociale.
    reason: textual_variant
lexical_decisions:
- source_word: לכל זכר
  choice: à aucun homme
  rationale: L’hébreu signifie littéralement « à tout mâle ». Dans cette défense, « à aucun homme » est idiomatique en français tout en maintenant la référence masculine explicite du texte.
- source_word: אל תתן תאר
  choice: ne montre ta beauté
  rationale: תאר désigne la forme, l’apparence ou la beauté. « Montrer sa beauté » rend naturellement l’expression littérale « donner beauté/apparence »; le grec ἐν κάλλει confirme que la beauté est en jeu.
- source_word: ובית נשים
  choice: parmi les femmes dans leur maison
  rationale: La formulation conserve à la fois בית, « maison », et נשים, « femmes », sans transformer avec assurance cette maison en institution ou en quartiers réservés.
- source_word: אל תסתויד
  choice: ne t’assieds pas parmi
  rationale: La forme et le sens du verbe hébreu sont incertains. Le parallèle grec συνέδρευε soutient l’idée de s’asseoir avec d’autres ou de leur tenir compagnie; le choix français conserve l’image concrète.
theological_decisions:
- issue: Langage genré dans une exhortation sapientielle
  choice: Conserver « homme » et « femmes »
  alternative: Employer un langage non genré comme « personne » ou « gens »
  rationale: Le texte hébreu nomme explicitement le mâle (זכר) et les femmes (נשים). Neutraliser ces termes effacerait une particularité réelle de l’exhortation.
- issue: Rapport entre l’hébreu difficile et le parallèle grec
  choice: Prendre l’hébreu comme texte principal et utiliser le grec pour éclairer le dernier verbe
  alternative: Suivre entièrement le grec ou reproduire littéralement l’hébreu obscur
  rationale: L’hébreu conservé demeure prioritaire, mais son dernier verbe est incertain. Le grec offre ici un appui ancien pour le sens « s’asseoir avec, tenir compagnie », sans faire disparaître la mention hébraïque de la maison.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier correspond au caractère personnel de l’exhortation. La formulation reste claire tout en signalant dans les notes les difficultés textuelles et l’autre compréhension attestée par le grec.
