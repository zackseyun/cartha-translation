  text: about cheating with scales and balances[c][b][a], and about measures of ephah and stone weight.
translation:
  language: fr
  text: 'au sujet des balances et du fléau de pesée[a], et des mesures : l’épha et le poids de pierre[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le mot hébreu rendu ici de manière neutre est difficile. Le parallèle grec dit plutôt : « de l’exactitude de la balance et des poids ».'
    reason: alternative_reading
  - marker: b
    text: 'Le second membre du grec diffère sensiblement : « de l’acquisition du beaucoup et du peu », ou peut-être « des grandes et des petites quantités », là où l’hébreu mentionne l’épha et le poids de pierre.'
    reason: textual_variant
  - marker: c
    text: L’épha était une ancienne unité de mesure pour les matières sèches ; un poids de pierre était une pierre servant d’étalon dans le commerce.
    reason: cultural_note
lexical_decisions:
- source_word: שחק
  choice: fraude
  rationale: Le mot hébreu transmis est difficile. Dans ce contexte commercial, « fraude » exprime prudemment l’idée probable d’une manipulation malhonnête des instruments de pesée, tandis que la lecture grecque axée sur l’exactitude est signalée en note.
- source_word: מאזנים
  choice: balances
  rationale: Équivalent français courant du terme hébreu désignant un instrument de pesée.
- source_word: פלס
  choice: fléaux de pesée
  rationale: Le terme semble désigner un élément ou instrument servant à établir l’équilibre lors de la pesée. Cette formulation le distingue des « balances » sans préciser excessivement sa forme.
- source_word: תמחות
  choice: mesures
  rationale: La forme hébraïque est difficile, mais son association avec l’épha et la pierre indique vraisemblablement des mesures ou étalons commerciaux.
- source_word: איפה
  choice: épha
  rationale: L’épha est une unité ancienne précise de mesure pour les matières sèches; sa translittération conserve la réalité culturelle du texte.
- source_word: אבן
  choice: poids de pierre
  rationale: Dans un contexte commercial, la pierre sert d’étalon de poids. « Poids de pierre » rend explicite cet emploi sans effacer l’image hébraïque.
- source_word: περὶ ἀκριβείας ζυγοῦ καὶ σταθμίων
  choice: de la fraude avec les balances et les fléaux de pesée
  rationale: Le grec évoque plutôt l’exactitude de la balance et des poids, mais le texte principal donne priorité au témoin hébreu transmis, dont le sens probable concerne un usage frauduleux. L’écart est conservé en note.
- source_word: περὶ κτήσεως πολλῶν καὶ ὀλίγων
  choice: des mesures de l’épha et du poids de pierre
  rationale: Le second membre grec diverge fortement et parle de l’acquisition du beaucoup et du peu, ou de grandes et petites quantités. Le texte principal suit l’hébreu, qui nomme l’épha et la pierre.
