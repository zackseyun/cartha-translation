  text: Better a man's wickedness than a woman's goodness[a], and a woman who brings shame becomes a reproach.
translation:
  language: fr
  text: Mieux vaut la méchanceté d’un homme que la bonté d’une femme ; une femme qui fait honte devient un objet d’opprobre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le dernier membre du texte hébreu est difficile. Le parallèle grec dit plus clairement : « et une femme qui fait honte mène à l’opprobre », ce qui appuie le sens retenu ici.'
    reason: alternative_reading
lexical_decisions:
- source_word: מטוב
  choice: mieux vaut… que
  rationale: La préposition מן, assimilée dans מטוב, introduit ici une comparaison. Le grec κρείσσων… ἢ confirme cette lecture, que cette tournure rend naturellement en français.
- source_word: רוע
  choice: méchanceté
  rationale: רוע désigne ici une mauvaise qualité d’ordre moral. « Méchanceté » préserve cette portée mieux que le terme plus général « mal ».
- source_word: איש
  choice: un homme
  rationale: Le nom hébreu est singulier et explicitement masculin, en opposition directe avec אשה.
- source_word: אשה
  choice: une femme
  rationale: Le sens ordinaire est « femme » dans les deux occurrences. Rien dans le verset n’impose la traduction « épouse ».
- source_word: מטוב אשה
  choice: que la bonté d’une femme
  rationale: L’hébreu oppose littéralement la méchanceté d’un homme à la bonté d’une femme. Cette formulation conserve la comparaison abrupte du texte.
- source_word: מחרפת
  choice: qui attire la honte
  rationale: Le participe évoque une femme qui cause ou suscite la honte. Cette expression garde la nuance active et correspond au grec καταισχύνουσα.
- source_word: תביע
  choice: devient
  rationale: La forme hébraïque et la syntaxe du dernier membre sont difficiles. À la lumière du grec εἰς ὀνειδισμόν, « devient » exprime prudemment l’aboutissement sans prétendre lever toute l’incertitude lexicale.
- source_word: חרפת
  choice: un objet d’opprobre
  rationale: חרפה désigne la honte publique, le déshonneur ou l’opprobre. « Objet d’opprobre » convient à la construction résultative retenue et au grec ὀνειδισμός.
theological_decisions:
- issue: Comparaison genrée et moralement choquante entre l’homme et la femme
  choice: Conserver sans l’atténuer l’opposition explicite entre « un homme » et « une femme ».
  alternative: Neutraliser le genre ou reformuler la maxime afin d’en corriger la portée.
  rationale: Le texte oppose expressément איש à אשה. La traduction doit rendre cette rhétorique dérangeante avec transparence, sans l’approuver, la généraliser ni lui imposer une correction doctrinale.
- issue: Témoin principal et difficulté du dernier membre
  choice: Suivre prioritairement l’hébreu, en utilisant le parallèle grec pour éclairer le mouvement général vers l’opprobre.
  alternative: Traduire conjecturalement « dans une maison, une femme est recherchée pour l’opprobre » ou simplifier en « une femme honteuse attire l’opprobre ».
  rationale: Le dernier membre hébreu est obscur, notamment autour de תביע. Le grec soutient clairement l’idée d’une femme qui cause la honte et aboutit à l’opprobre ; la note signale toutefois que le détail de l’hébreu reste incertain.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le caractère proverbial, abrupt et explicitement genré de l’hébreu. « Opprobre », légèrement soutenu mais courant dans un registre biblique accessible, rend la dimension publique du déshonneur.
