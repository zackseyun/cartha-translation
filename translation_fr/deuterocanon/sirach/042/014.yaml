  rationale: La révision remplace une expression française susceptible d’inverser ou de brouiller l’orientation active de « causer la honte » par « faire honte ». Elle conserve l’incertitude du dernier membre par la tournure résultative retenue dans l’audit anglais et dans la note, sans prétendre résoudre de manière définitive la valeur de תביע. L’appel de note est déplacé vers le membre concerné.
