  source_fidelity: 'Le premier membre rend fidèlement l’opposition comparative de l’hébreu בין רוע איש et טוב אשה. Dans le second, « attire la honte » ne rend pas bien le participe actif מחרפת : en français, cette expression suggère plutôt qu’elle attire la honte sur elle-même. « qui fait honte » conserve de façon plus directe l’idée, éclairée par le grec, d’une femme qui cause la honte. La tournure résultative « devient un objet d’opprobre » reste prudente face à la difficulté de תביע et respecte le sens retenu dans l’audit anglais.'
