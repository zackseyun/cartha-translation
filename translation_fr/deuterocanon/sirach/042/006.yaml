  text: For a bad wife[a], a seal is good; and where hands are slack[c][b], open it.
translation:
  language: fr
  text: Pour une mauvaise épouse[a], il est bon de mettre un sceau ; là où beaucoup de mains ont accès[b], ferme à clé[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une mauvaise femme » ; le mot hébreu peut signifier « femme » ou « épouse ».
    reason: alternative_reading
  - marker: b
    text: Le grec porte « beaucoup de mains ». L’hébreu conservé semble plutôt lire « des mains faibles » ou « relâchées ».
    reason: textual_variant
  - marker: c
    text: Le grec porte « ferme ». La forme hébraïque conservée paraît signifier « ouvre ».
    reason: textual_variant
lexical_decisions:
- source_word: אשה רעה
  choice: une mauvaise épouse
  rationale: אשה peut désigner une femme ou une épouse. Le contexte domestique favorise « épouse », tandis que « mauvaise » rend רעה sans accentuer inutilement la formulation.
- source_word: חותם חסם
  choice: il est bon de mettre un sceau
  rationale: L’hébreu est concis et difficile, associant le sceau à l’idée de fermeture. Le grec καλὸν σφραγίς confirme le sens « un sceau est bon » ; la formulation française exprime naturellement l’action impliquée.
- source_word: ומקום
  choice: là où
  rationale: Rend simplement la transition locative, conformément au grec ὅπου.
- source_word: ידים רפות
  choice: beaucoup de mains ont accès
  rationale: Le texte hébreu transmis paraît signifier « des mains faibles/relâchées », mais le grec lit χεῖρες πολλαί, « beaucoup de mains ». Cette leçon donne au proverbe un sens cohérent concernant un accès partagé ; « ont accès » explicite sobrement l’image contextuelle.
- source_word: תפתח
  choice: ferme à clé
  rationale: La forme hébraïque conservée paraît signifier « ouvre », en tension avec le contexte. Le grec κλεῖσον, « ferme », fournit la lecture cohérente adoptée ici ; « ferme à clé » restitue la portée pratique de l’injonction.
theological_decisions:
- issue: « épouse » ou « femme » dans une maxime au ton difficile
  choice: épouse
  alternative: femme
  rationale: L’hébreu אשה et le grec γυνή permettent les deux sens. Le cadre de gestion domestique favorise « épouse » et évite d’étendre la remarque à toutes les femmes, sans atténuer la difficulté du texte.
- issue: Choix entre les formes hébraïques conservées et le parallèle grec dans la seconde proposition
  choice: 'suivre le sens cohérent du grec : beaucoup de mains, ferme'
  alternative: 'suivre littéralement l’hébreu transmis : mains relâchées, ouvre'
  rationale: La combinaison hébraïque conservée produit une instruction obscure et apparemment contraire à l’image de sécurisation. Le grec préserve vraisemblablement ici une forme plus intelligible du texte, mais les variantes hébraïques sont signalées en notes.
translation_notes:
  register: Français international moderne, digne et proverbial. La formulation reste concise, conserve le ton difficile de la maxime et signale clairement les principales incertitudes textuelles.
