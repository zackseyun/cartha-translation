base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/011.yaml
  text: Keep a strict watch over your virgin daughter[a], lest she make you a byword of disgrace, a gossip of the city and a curse of the people[c][b], and seat you in the assembly at the gate.
translation:
  language: fr
  text: Veille étroitement sur ta fille vierge, de peur qu’elle ne te donne une réputation honteuse[a], ne fasse de toi un sujet de commérages dans la ville et un objet de malédiction parmi le peuple[c], et ne te fasse asseoir dans l’assemblée à la porte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « qu’elle ne te fasse un nom honteux » ; on peut aussi comprendre « un mauvais renom » ou « une réputation infâme ». Le grec développe l’idée en parlant d’un objet de joie pour les ennemis.'
    reason: lexical_alternative
  - marker: b
    text: 'La dernière expression hébraïque est difficile : elle parle littéralement de faire asseoir la personne interpellée « dans le rassemblement à la porte ». La porte de la ville était un lieu public de réunion et de jugement. Le grec exprime plutôt la honte subie devant une grande foule.'
    reason: textual_and_cultural_note
  - marker: c
    text: 'Le manuscrit de Massada présente ici une forme plus courte : « Sur une fille, veille ; commérages dans la ville et assemblée du peuple… », tandis que le texte de la Geniza est plus développé.'
    reason: textual_variant
lexical_decisions:
- source_word: בני על בתולתך החזק משמר
  choice: Veille très attentivement sur ta fille encore vierge
  rationale: L’expression hébraïque commande d’établir ou de renforcer une garde. « Veille très attentivement » restitue naturellement cette insistance. בתולה désigne ici une fille vierge, probablement non mariée ; « encore vierge » conserve cette nuance sans donner à « vierge » la valeur d’un simple adjectif d’âge.
- source_word: פן תעשה לך שם סרה
  choice: de peur qu’elle ne te donne une réputation honteuse
  rationale: Littéralement, la fille pourrait faire à son père un « nom » marqué par סרה, terme évoquant ce qui est mauvais, déviant ou honteux. La formulation française exprime l’atteinte publique à la réputation sans préciser au-delà de l’hébreu la nature de la faute redoutée.
- source_word: דבת עיר
  choice: l’objet des commérages de la ville
  rationale: דבה peut désigner un mauvais bruit, une médisance ou des propos malveillants. « Commérages » convient au contexte de honte publique, et « l’objet de » rend explicite en français le rôle implicite de la fille dans cette série nominale.
- source_word: וקללת עם
  choice: de la malédiction du peuple
  rationale: La construction nominale évoque la malédiction ou l’invective collective dont elle deviendrait l’objet. La traduction conserve le terme fort « malédiction » et le génitif concis de l’hébreu.
- source_word: והושיבתך בעדר שער
  choice: et qu’elle ne te fasse asseoir dans l’assemblée à la porte
  rationale: 'והושיבתך est causatif : « elle te fera asseoir ». בעדר שער est difficile ; « assemblée à la porte » garde l’image hébraïque d’un rassemblement au lieu public où se traitaient les affaires de la communauté, sans remplacer la phrase par le développement grec sur la honte devant la foule.'
theological_decisions:
- issue: Priorité du texte hébreu et recours au parallèle grec pour la clause finale difficile
  choice: Suivre le texte hébreu de la Geniza et rendre explicitement l’assemblée à la porte
  alternative: 'Suivre le grec : « elle te couvrira de honte devant une grande foule »'
  rationale: L’hébreu conservé demeure le témoin principal. Le grec confirme le cadre de honte publique, mais son évocation des ennemis et d’une grande multitude paraît développer le propos ; ces éléments ne sont donc pas introduits dans le corps du verset.
- issue: Nature de la honte redoutée
  choice: Conserver une formulation générale portant sur la réputation et la réprobation publique
  alternative: Préciser une faute sexuelle ou une grossesse hors mariage
  rationale: Le contexte de la « fille encore vierge » peut suggérer une inquiétude sexuelle et sociale, mais ce verset ne nomme aucune faute précise. La traduction préserve cette retenue et évite d’importer une interprétation morale plus étroite que le texte.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le tour « de peur que… ne » relève d’un registre soutenu mais courant dans une traduction biblique ; le « ne » y est explétif et n’ajoute pas une négation. La syntaxe parallèle maintient la progression hébraïque de la réputation privée vers l’exposition publique.
