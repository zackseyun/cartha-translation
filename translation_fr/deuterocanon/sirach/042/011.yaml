    rationale: Dans la suite hébraïque, les suffixes de « te faire un nom honteux » et de « te faire asseoir » encadrent les expressions nominales « commérages de la ville » et « malédiction du peuple ». Celles-ci décrivent donc la honte publique infligée à la personne interpellée. « Qu’elle ne devienne l’objet » fait de la fille, plutôt que de « toi », cet objet de réprobation.
