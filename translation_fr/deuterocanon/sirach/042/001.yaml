  text: Do not be ashamed of these things, and do not show partiality and sin.
translation:
  language: fr
  text: Mais n’aie pas honte de ces choses[a] ; ne fais pas preuve de partialité[b] et ne pèche pas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec de la Septante présente ici une formulation très différente et plus développée, qui énumère plusieurs sujets liés à la honte et à la discrétion. La traduction suit le texte hébreu conservé dans les manuscrits de la Guéniza du Caire.
    reason: textual_variant
  - marker: b
    text: Ou « ne favorise personne ». L’expression hébraïque signifie littéralement « ne relève pas un visage ».
    reason: lexical_alternative
  - marker: c
    text: 'La fin de la phrase peut aussi se comprendre ainsi : « et ne pèche pas ainsi » ou « de peur de pécher ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אך על אלה
  choice: Mais … de ces choses
  rationale: La tournure rend à la fois la valeur adversative ou restrictive possible de אך et le complément de בוש introduit par על, sans alourdir le français.
- source_word: אל תבוש
  choice: n’aie pas honte
  rationale: Le verbe בוש exprime la honte ou le déshonneur, et non une simple gêne passagère.
- source_word: ואל תשא פנים
  choice: ne fais pas preuve de partialité
  rationale: L’expression idiomatique נשא פנים, littéralement « relever un visage », désigne le fait d’accorder un traitement de faveur ou de se laisser influencer par la personne.
- source_word: וחטא
  choice: et ne pèche pas
  rationale: Le texte hébreu est très condensé, littéralement « et pèche ». La reprise de la négation en français permet une coordination naturelle tout en laissant la relation exacte avec la partialité ouverte.
theological_decisions:
- issue: Rapport entre « et pèche » et l’interdiction de faire preuve de partialité
  choice: 'Coordonner les deux interdictions : « ne fais pas preuve de partialité et ne pèche pas »'
  alternative: « ne fais pas preuve de partialité au point de pécher » ou « de peur de pécher »
  rationale: L’hébreu ne précise pas nettement s’il s’agit d’une seconde interdiction, d’une conséquence ou d’un avertissement. La formulation retenue conserve cette concision sans imposer une relation de but ou de résultat.
translation_notes:
  register: Français international moderne, sobre et digne. Le point-virgule clarifie les deux volets de l’exhortation, tandis que la répétition de « ne » évite une coordination peu naturelle en français.
