    rationale: Le texte hébreu porte « לא תשטה » (« qu’elle ne s’égare pas ») là où les autres avertissements emploient פן. Conserver une négation directe respecte cette nuance formelle, tout en restant naturel en français.
  - severity: low
    issue: « Pendant sa virginité » et « se laisse séduire »
    rationale: La première expression est moins naturelle que « alors qu’elle est encore vierge ». « Se laisse séduire » peut introduire une nuance d’acquiescement absente de la forme passive hébraïque ; « soit séduite » est plus neutre.
