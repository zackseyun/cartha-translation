base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/010.yaml
  text: In her virginity[a], lest she be seduced, and in her husband’s house, lest she go astray; in her father’s house, lest she become pregnant, and in her husband’s house[b], lest she be barren.
translation:
  language: fr
  text: Alors qu’elle est encore vierge[a], de peur qu’elle ne soit séduite, et, dans la maison de son mari, qu’elle ne s’égare pas ; dans la maison de son père, de peur qu’elle ne tombe enceinte, et dans la maison de son mari[b], de peur qu’elle ne soit stérile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « de peur qu’elle ne soit profanée » là où l’hébreu dit « de peur qu’elle ne soit séduite », ce qui rend explicite le sens sexuel.
    reason: alternative_reading
  - marker: b
    text: La dernière expression peut aussi se comprendre plus littéralement comme « de peur qu’elle ne soit empêchée » ou « retenue » ; le parallèle grec appuie toutefois le sens « de peur qu’elle ne soit stérile ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בבתוליה
  choice: pendant sa virginité
  rationale: Le nom hébreu désigne l’état de virginité ou la période où la jeune femme est vierge. Cette formulation reste proche de l’hébreu et du grec ἐν παρθενίᾳ, tout en étant naturelle en français.
- source_word: פן תפתה
  choice: de peur qu’elle ne se laisse séduire
  rationale: La forme hébraïque peut exprimer le fait d’être attirée ou séduite. En français, « se laisse séduire » rend naturellement cette vulnérabilité dans le contexte sexuel, que confirme la variante grecque « soit profanée ».
- source_word: ובבית בעלה
  choice: et dans la maison de son mari
  rationale: Rend explicitement le cadre du foyer conjugal et conserve la structure concrète de l’hébreu.
- source_word: לא תשטה
  choice: de peur qu’elle ne s’égare
  rationale: Le verbe évoque le fait de dévier ou de s’égarer. Cette traduction préserve l’étendue morale et sexuelle du terme sans préciser indûment qu’il s’agit nécessairement d’adultère.
- source_word: בבית אביה
  choice: dans la maison de son père
  rationale: Traduction directe du cadre domestique antérieur au mariage, également attesté par le parallèle grec.
- source_word: פן תהרה
  choice: de peur qu’elle ne tombe enceinte
  rationale: Le verbe signifie concevoir ou devenir enceinte. « Tomber enceinte » est idiomatique et immédiatement compréhensible en français moderne.
- source_word: בבית אישה
  choice: et dans la maison de son mari
  rationale: Dans ce contexte, אישה désigne son époux. La même formulation pour les deux mentions du foyer conjugal évite une variation artificielle.
- source_word: פן תעצר
  choice: de peur qu’elle ne soit stérile
  rationale: Pris isolément, le verbe peut signifier être retenue ou empêchée. Le contexte reproductif et le grec στειρώσῃ appuient nettement le sens « être stérile ».
theological_decisions:
- issue: Priorité du texte hébreu avec recours au parallèle grec
  choice: Traduire le texte hébreu conservé, en utilisant le grec pour éclairer les expressions sexuellement et reproductivement marquées.
  alternative: 'Suivre plus directement le grec : « de peur qu’elle ne soit profanée… ne transgresse… ne soit stérile ».'
  rationale: L’hébreu est ici suffisamment cohérent pour rester le témoin principal. Le grec confirme cependant le contexte sexuel de פן תפתה et le sens reproductif de פן תעצר, sans justifier de remplacer les nuances propres à l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme et les cadres domestiques du texte hébreu sont conservés. « De peur que… ne » relève d’un registre écrit courant et ne comporte pas ici de négation réelle.
