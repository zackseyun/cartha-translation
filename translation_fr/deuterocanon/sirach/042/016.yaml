  text: The sun rises and shines on everything revealed[b][a], and the glory of the Lord is over all his works.
translation:
  language: fr
  text: Le soleil se lève et brille sur tout ce qui est visible[a][b], et la gloire du Seigneur est sur toutes ses œuvres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « sur tout ce qui est manifesté » ou « sur tout ce qui est à découvert ». Le parallèle grec peut se comprendre ainsi : « répandant sa lumière, il regarde tout ».'
    reason: alternative_reading
  - marker: b
    text: Le témoin hébreu plus ancien de Massada semble présenter ici une formulation différente de celle des manuscrits de la Guéniza du Caire qui sous-tendent le texte principal.
    reason: textual_variant
lexical_decisions:
- source_word: שמש
  choice: Le soleil
  rationale: Rendu direct du nom désignant l’astre; l’article défini est naturel en français.
- source_word: זורחת
  choice: se lève et brille
  rationale: Le participe de זרח peut évoquer à la fois le lever du soleil et son rayonnement. Le double verbe français conserve ces deux nuances poétiques; le parallèle grec souligne l’action d’éclairer.
- source_word: על כל
  choice: sur tout ce qui / sur toutes
  rationale: La tournure exprime une portée universelle. « Sur » maintient le parallélisme des deux membres tout en restant idiomatique.
- source_word: נגלתה
  choice: ce qui est visible
  rationale: Le terme renvoie à ce qui est découvert, manifeste ou perceptible. « Visible » est naturel en français et préserve la portée concrète du vers, tandis qu’une note signale le sens plus littéral.
- source_word: כבוד
  choice: la gloire
  rationale: « Gloire » est le correspondant français traditionnel et sémantiquement approprié de כבוד lorsqu’il s’agit de Dieu.
- source_word: ה׳
  choice: du Seigneur
  rationale: L’abréviation hébraïque désigne le nom ou titre divin. « Le Seigneur » convient à l’usage de Ben Sira et à la tradition française des livres deutérocanoniques.
- source_word: מעשיו
  choice: ses œuvres
  rationale: Le mot englobe ce que Dieu fait et ce qu’il a créé. « Œuvres » conserve la concision et le parallélisme poétique.
theological_decisions:
- issue: Rendu du nom ou titre divin ה׳
  choice: le Seigneur
  alternative: le SEIGNEUR
  rationale: Le témoin hébreu emploie une abréviation. « Le Seigneur » évite d’affirmer plus que la forme manuscrite tout en suivant l’usage naturel de Ben Sira en français.
- issue: Rapport entre la gloire divine et les œuvres
  choice: s’étend sur toutes ses œuvres
  alternative: est au-dessus de toutes ses œuvres
  rationale: La préposition על peut indiquer une présence qui couvre ou domine. « S’étend sur » garde l’image spatiale sans imposer l’idée plus précise d’une supériorité hiérarchique.
- issue: Écart entre l’hébreu et le parallèle grec dans le premier membre
  choice: Le soleil se lève et brille sur tout ce qui est visible
  alternative: Le soleil, répandant sa lumière, regarde tout
  rationale: Le texte principal suit prioritairement l’hébreu, qui évoque ce qui est manifeste ou visible. Le grec met davantage l’accent sur l’illumination et le regard; cette différence est conservée en note plutôt que résolue silencieusement.
translation_notes:
  register: Français international moderne, digne et poétique. La formulation reste accessible, conserve le parallélisme des deux membres et signale sans l’effacer l’incertitude textuelle du premier.
