base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/030.yaml
  text: Do your work in righteousness[a], and he will give you your reward in its time. Blessed is Yahweh forever, and praised is his name from generation to generation.
translation:
  language: fr
  text: Accomplissez vos œuvres avec justice, et il vous donnera votre récompense en son temps[a]. Béni soit Yahweh pour toujours, et que son nom soit loué de génération en génération.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au temps voulu » ou « au temps fixé par Dieu ». L’hébreu בְּעִתּוֹ, comme le grec ἐν καιρῷ αὐτοῦ, peut désigner le moment approprié pour la récompense; le pronom peut aussi être compris comme renvoyant à Dieu.
    reason: alternative lexicale et ambiguïté du référent pronominal
lexical_decisions:
- source_word: מַעֲשֵׂיכֶם עֲשׂוּ
  choice: Accomplissez vos œuvres
  rationale: L’hébreu associe le nom « vos œuvres, vos actions » à l’impératif « faites ». Cette formulation conserve l’objet exprimé et évite la répétition peu naturelle « faites vos œuvres ».
- source_word: בִצְדָקָה
  choice: avec justice
  rationale: La préposition בְּ indique ici vraisemblablement la manière d’agir. « Avec justice » garde le vocabulaire moral et théologique de צְדָקָה tout en restant naturel en français.
- source_word: וְהוּא
  choice: il
  rationale: Le pronom renvoie implicitement à Dieu, mais le texte hébreu ne le nomme pas encore dans cette proposition. Le pronom respecte cette progression.
- source_word: נוֹתֵן לָכֶם שְׂכַרְכֶם
  choice: il vous donnera votre récompense
  rationale: שְׂכַר peut désigner un salaire, une rétribution ou une récompense. « Récompense » convient au contexte sapiential sans réduire la relation à une transaction commerciale; le futur exprime la valeur de promesse du participe hébreu.
- source_word: בְּעִתּוֹ
  choice: en son temps
  rationale: Le suffixe masculin singulier peut être rapporté au moment propre de la récompense ou au temps fixé par Dieu. « En son temps » conserve naturellement cette ambiguïté en français, explicitée en note.
- source_word: בָּרוּךְ יְהֹוָה לְעוֹלָם
  choice: Béni soit Yahweh pour toujours
  rationale: La formule française doxologique « Béni soit » rend naturellement le prédicat hébreu בָּרוּךְ. Le nom divin est transcrit « Yahweh ».
- source_word: וּמְשֻׁבָּח שְׁמוֹ לְדֹר וָדֹר
  choice: et que son nom soit loué de génération en génération
  rationale: Cette formulation maintient le parallélisme doxologique avec « Béni soit » et rend l’expression idiomatique לְדֹר וָדֹר sans l’aplatir.
theological_decisions:
- issue: Traduction du nom divin יְהֹוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » le rend comme nom propre sans lui substituer un titre.
- issue: Portée morale et théologique de צְדָקָה
  choice: justice
  alternative: droiture; ce qui est juste
  rationale: « Justice » préserve un terme central du langage biblique et convient à une conduite droite devant Dieu, sans imposer ici un sens exclusivement judiciaire.
- issue: Référent du suffixe dans בְּעִתּוֹ
  choice: ambiguïté conservée par « en son temps »
  alternative: au temps voulu; au temps fixé par Dieu
  rationale: La forme hébraïque, comme le parallèle grec ἐν καιρῷ αὐτοῦ, permet d’entendre soit le temps propre de la récompense, soit le temps déterminé par Dieu. Le corps du texte ne tranche pas artificiellement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde la cadence sapientiale et doxologique du texte hébreu; le vocabulaire biblique « œuvres », « justice » et « récompense » reste visible sans archaïsme excessif.
