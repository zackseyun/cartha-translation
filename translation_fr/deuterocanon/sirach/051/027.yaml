translation:
  language: fr
  text: Voyez de vos propres yeux que j’étais jeune et que je me suis attaché à elle et l’ai trouvée.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « petit »; le mot peut aussi évoquer une condition humble ou sans importance.'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec présente une forme sensiblement différente : « Voyez de vos propres yeux que j’ai peiné un peu et que j’ai trouvé pour moi beaucoup de repos. »'
    reason: alternative_reading
lexical_decisions:
- source_word: רְאוּ בְעֵינֵיכֶם
  choice: Voyez de vos propres yeux
  rationale: L’impératif pluriel et l’expression idiomatique invitent les destinataires à constater personnellement ce qui suit.
- source_word: כִּי קָטֹן הָיִיתִי
  choice: que j’étais jeune
  rationale: קָטֹן signifie littéralement « petit » et peut, à propos d’une personne, évoquer la jeunesse ou l’humble condition. « J’étais jeune » est naturel ici, tout en laissant en note l’autre nuance possible.
- source_word: וְעָמַדְתִּי בָהּ
  choice: et que je me suis attaché à elle
  rationale: עמד avec ב peut exprimer le fait de demeurer fermement auprès de quelque chose ou d’y persévérer. Cette formulation française rend l’attachement persévérant sans effacer le pronom féminin.
- source_word: וּמְצָאתִיהָ
  choice: et l’ai trouvée
  rationale: Le verbe מצא avec suffixe féminin signifie directement « je l’ai trouvée »; le féminin renvoie vraisemblablement à la Sagesse personnifiée.
theological_decisions:
- issue: Référent des suffixes féminins בָהּ et מְצָאתִיהָ
  choice: Conserver le féminin « elle / l’ », qui renvoie vraisemblablement à la Sagesse personnifiée.
  alternative: Employer un pronom impersonnel renvoyant à la sagesse ou à l’instruction.
  rationale: L’hébreu marque deux fois le féminin, et la personnification féminine de la Sagesse est courante dans le Siracide. La conserver respecte la forme du texte sans imposer davantage que son genre grammatical et son contexte.
- issue: Divergence entre le texte hébreu et le parallèle grec
  choice: Suivre le texte hébreu conservé et signaler en note la forme grecque sensiblement différente.
  alternative: 'Traduire selon le grec : « J’ai peiné un peu et j’ai trouvé pour moi beaucoup de repos. »'
  rationale: Le témoin hébreu est ici disponible et jugé fiable; la divergence grecque est trop importante pour être intégrée silencieusement.
translation_notes:
  register: 'Français international actuel, digne et accessible. La syntaxe reste proche de l’hébreu, tandis que « je me suis attaché à elle » exprime naturellement l’idée de persévérance portée par עמד ב. Les appels de note suivent les éléments concernés : [a] après « jeune » et [b] en fin de verset.'
