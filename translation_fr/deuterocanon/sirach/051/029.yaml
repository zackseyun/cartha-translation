  text: May my soul rejoice in my old age[a], and may you not be put to shame by my song.
translation:
  language: fr
  text: Que mon âme se réjouisse dans ma vieillesse[a], et que vous n’ayez pas honte de mon chant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec porte : « Que votre âme se réjouisse de sa miséricorde, et que vous n’ayez pas honte de sa louange. » Le témoin hébreu lit plutôt « mon âme », « ma vieillesse » et « mon chant ».'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשְׂמַח
  choice: Que … se réjouisse
  rationale: Le jussif exprime ici un souhait; cette tournure française en conserve la valeur volitive et correspond à l’optatif du parallèle grec.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: Cette traduction préserve l’image hébraïque et la dimension intérieure plutôt que de réduire l’expression à « je ».
- source_word: בְּשֵׂיבָתִי
  choice: dans ma vieillesse
  rationale: שֵׂיבָה désigne littéralement les cheveux gris et, par extension idiomatique, la vieillesse; la formulation retenue est naturelle en français.
- source_word: וְלֹא תֵבוֹשוּ
  choice: et que vous n’ayez pas honte
  rationale: La deuxième personne du pluriel est maintenue. En français courant, « avoir honte de » rend naturellement בוש avec son complément, sans imposer une idée extérieure de disgrâce.
- source_word: בְּשִׁירָתִי
  choice: de mon chant
  rationale: Le substantif hébreu signifie directement « mon chant » ou « mon cantique ». La préposition est adaptée à la construction française « avoir honte de », tandis que le grec divergent « sa louange » est signalé en note.
theological_decisions:
- issue: Divergence substantielle entre le texte hébreu et le parallèle grec
  choice: 'Suivre le témoin hébreu : « mon âme », « ma vieillesse » et « mon chant ».'
  alternative: 'Le grec porte : « Que votre âme se réjouisse de sa miséricorde, et que vous n’ayez pas honte de sa louange. »'
  rationale: Le texte hébreu conservé est ici le témoin principal et son degré de confiance est élevé. Le grec confirme néanmoins le ton optatif et l’adresse au pluriel dans le second membre; sa variante importante est donc conservée en note plutôt que fondue dans le texte.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme poétique, le souhait formulé au subjonctif et le changement de personne entre les deux membres sont conservés.
