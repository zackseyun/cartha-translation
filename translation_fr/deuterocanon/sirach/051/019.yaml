lexical_decisions:
- source_word: חַשְׁקָה נַפְשִׁי בָּהּ
  choice: Mon âme s’est attachée à elle
  rationale: Le verbe חשׁק exprime ici un attachement profond, un élan résolu vers la sagesse. « S’est attachée » restitue cette intensité sans réduire le sens au simple désir.
- source_word: וּפָנַי לֹא אַהֲפֹך מִמֶּנָּה
  choice: et je n’ai pas détourné mon visage d’elle
