base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/026.yaml
  text: Bring your neck under her yoke[a], and let your soul bear her burden. She is near to those who seek her, and the one who gives himself finds her.
translation:
  language: fr
  text: Placez votre cou sous son joug[a], et que votre âme porte son fardeau. Elle est proche de ceux qui la cherchent, et celui qui se donne lui-même la trouve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec lit : « et que votre âme reçoive l’instruction ». L’hébreu porte : « que votre âme porte son fardeau ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְצַוְּארֵיכֶם
  choice: votre cou
  rationale: Le pluriel hébreu s’adresse à plusieurs personnes, mais le singulier distributif « votre cou » est plus naturel en français et conserve l’image corporelle.
- source_word: בְּעֻלָּהּ הָבִיאוּ
  choice: Placez … sous son joug
  rationale: L’hébreu emploie le verbe « apporter, faire entrer » avec une forme difficile liée au joug; le parallèle grec confirme l’image de se placer sous un joug. « Placez » exprime naturellement l’exhortation en français.
- source_word: וּמַשָּׂאָהּ תִּשָּׂא נַפְשְׁכֶם
  choice: que votre âme porte son fardeau
  rationale: Cette formulation suit le texte hébreu, qui parle du fardeau porté par l’âme, et maintient le parallélisme avec le joug.
- source_word: קְרוּבָה הִיא לִמְבַקְשֶׁיהָ
  choice: Elle est proche de ceux qui la cherchent
  rationale: Le féminin renvoie à la Sagesse personnifiée; « ceux qui la cherchent » rend naturellement le participe hébreu.
- source_word: וְנוֹתֵן נַפְשׁוֹ מוֹצֵא אֹתָהּ
  choice: celui qui se donne lui-même la trouve
  rationale: Littéralement, le texte évoque celui qui « donne son âme/sa vie ». « Se donne lui-même » conserve l’idée d’un engagement personnel entier sans suggérer nécessairement la mort.
theological_decisions:
- issue: Personnification de la Sagesse
  choice: Employer les pronoms féminins « son », « elle » et « la ».
  alternative: Traiter la sagesse comme une abstraction impersonnelle.
  rationale: La grammaire hébraïque et le contexte présentent la Sagesse sous des traits féminins personnifiés; la traduction conserve cette image sans l’identifier davantage.
- issue: Relation entre l’hébreu et le grec dans le second membre
  choice: Suivre dans le texte principal l’hébreu « porte son fardeau » et signaler le grec en note.
  alternative: 'Traduire d’après le grec : « que votre âme reçoive l’instruction ».'
  rationale: Le texte hébreu conservé est cohérent et constitue ici la source principale; le parallèle grec atteste toutefois une variante interprétative significative qui mérite d’être documentée.
translation_notes:
  register: Français international moderne, clair et digne. L’impératif « Placez » est naturel tout en gardant la métaphore traditionnelle du joug; « âme » conserve le vocabulaire anthropologique de l’hébreu.
