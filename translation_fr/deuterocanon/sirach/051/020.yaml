base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/020.yaml
  text: I gave my soul after her, and for everlasting ages I will not turn away from her. In purity I found her, and from the beginning I acquired a heart for her.
translation:
  language: fr
  text: J’ai tendu tout mon être vers elle et, pour les siècles des siècles, je ne me détournerai pas d’elle. Dans la pureté, je l’ai trouvée et, dès le commencement, j’ai acquis un cœur pour elle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַפְשִׁי נָתַתִּי אַחֲרֶיהָ
  choice: J’ai tendu tout mon être vers elle
  rationale: Littéralement « j’ai donné/placé mon âme après elle ». Cette formulation française exprime naturellement l’engagement profond et la poursuite de la sagesse, tout en évitant l’étrange calque « donner mon âme après elle ».
- source_word: לְנֵצַח נְצָחִים
  choice: pour toujours
  rationale: L’expression intensive signifie une durée perpétuelle. « Pour toujours » est clair, digne et naturel en français moderne.
- source_word: לֹא אַטֶּה מִמֶּנָּה
  choice: je ne me détournerai pas d’elle
  rationale: Le verbe נטה évoque ici le fait de dévier ou de s’écarter; cette traduction conserve l’idée de fidélité sans la surinterpréter.
- source_word: וּבְטָהֳרָה מְצָאתִיהָ
  choice: Dans la pureté, je l’ai trouvée
  rationale: 'Rendu formel de בְּטָהֳרָה, dont la relation exacte avec l’action demeure ouverte : pureté personnelle, état de pureté ou manière pure.'
- source_word: וְלֵב קָנִיתִי לָהּ מִתְּחִלָּתָהּ
  choice: et, dès le commencement, j’ai acquis un cœur pour elle
  rationale: Le texte hébreu associe littéralement l’acquisition d’un « cœur » à la sagesse. La formulation inhabituelle est conservée afin de ne pas effacer l’ambiguïté; le cœur désigne vraisemblablement la disposition intérieure ou l’intelligence.
theological_decisions:
- issue: Nature de l’engagement envers la sagesse
  choice: « tout mon être » pour נַפְשִׁי
  alternative: « mon âme »
  rationale: נפש peut désigner la personne entière, la vie ou l’être intérieur. Ici, « tout mon être » communique l’engagement total sans imposer une anthropologie dualiste.
- issue: Sens de « cœur » acquis pour la sagesse
  choice: Conserver « j’ai acquis un cœur pour elle »
  alternative: « j’ai appliqué mon cœur à elle » ou « grâce à elle, j’ai acquis l’intelligence »
  rationale: Les alternatives rendent le français plus explicite mais résolvent une construction hébraïque difficile. Le maintien de « cœur » préserve la tension du texte et son champ sémantique.
- issue: Divergence entre l’hébreu et le grec
  choice: Suivre l’hébreu attesté
  alternative: 'Suivre le grec : « c’est pourquoi je ne serai pas abandonné »'
  rationale: La source hébraïque fournie est de haute confiance et contient « pour toujours, je ne me détournerai pas d’elle ». Le grec sert ici de témoin parallèle, non de base prioritaire.
translation_notes:
  register: Français international moderne, sobre et digne. Le premier hémistiche est rendu idiomatiquement; la formulation plus énigmatique sur le « cœur » reste volontairement proche de l’hébreu. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
