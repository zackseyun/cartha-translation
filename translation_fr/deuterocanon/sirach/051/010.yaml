base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/010.yaml
  text: 'And I will exalt you: O Yahweh[a], you are my Father, for you are the mighty one of my salvation. Do not let me grow weak in the day of distress[b], in the day of ruin and desolation.'
translation:
  language: fr
  text: 'Et je proclamerai ta grandeur : « Ô Yahvé[a], tu es mon Père, car tu es le puissant qui me sauve. Ne me laisse pas faiblir[b] au jour de la détresse, au jour de la ruine et de la désolation. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « J’ai invoqué le Seigneur, père de mon seigneur. » L’hébreu porte : « Ô Yahvé, tu es mon Père. »'
    reason: alternative_reading
  - marker: b
    text: 'Le grec porte : « ne m’abandonne pas aux jours de détresse »; l’hébreu signifie plus littéralement : « ne me laisse pas me relâcher » ou « ne me laisse pas faiblir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲרוֹמֵם
  choice: Et je proclamerai ta grandeur
  rationale: Le verbe רומם signifie « élever, exalter, célébrer ». Cette formulation française restitue naturellement l’idée d’exalter Dieu; le complément implicite est explicité d’après le contexte de prière.
- source_word: יְהֹוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin dans un registre biblique digne; la variante grecque est signalée en note.
- source_word: אָבִי
  choice: mon Père
  rationale: Le texte hébreu conservé porte clairement « mon Père ». Le grec présente une autre leçon, conservée en note.
- source_word: גִּבּוֹר יִשְׁעִי
  choice: le puissant qui me sauve
  rationale: גִּבּוֹר est substantivé (« le puissant »), tandis que יִשְׁעִי exprime le salut ou la délivrance du locuteur. La tournure verbale est plus naturelle en français que « le puissant de mon salut » sans effacer le rapport entre puissance et salut.
- source_word: אַל תַּרְפֵּנִי
  choice: Ne me laisse pas faiblir
  rationale: Le verbe רפה évoque le relâchement ou l’affaiblissement. Cette traduction idiomatique suit l’hébreu plutôt que le grec « ne m’abandonne pas ».
- source_word: בְּיוֹם צָרָה
  choice: au jour de la détresse
  rationale: צָרָה désigne la détresse, l’adversité ou l’épreuve; « détresse » conserve ici la gravité du terme.
- source_word: בּיוֹם שׁוֹאָה וּמְשׁוֹאָה
  choice: au jour de la ruine et de la désolation
  rationale: Les deux noms apparentés accumulent des images de catastrophe. Deux termes distincts en français préservent cet effet sans les fondre en une seule notion.
theological_decisions:
- issue: Divergence entre l’hébreu et le grec dans l’invocation de Dieu
  choice: 'Suivre dans le texte principal l’hébreu : « Ô Yahvé, tu es mon Père »'
  alternative: 'Le grec porte : « J’ai invoqué le Seigneur, père de mon seigneur »'
  rationale: L’hébreu est ici conservé, cohérent et prioritaire. La différence grecque est toutefois substantielle et doit rester visible en note.
- issue: Sens de la supplication אַל תַּרְפֵּנִי
  choice: 'Traduire l’image hébraïque de l’affaiblissement : « Ne me laisse pas faiblir »'
  alternative: 'Le grec se traduit par : « ne m’abandonne pas »'
  rationale: Cette traduction ne ramène pas silencieusement l’hébreu au grec et maintient la tension entre les deux témoins.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme parallèle de « au jour de… au jour de… » et le double vocabulaire de catastrophe sont conservés. Les guillemets délimitent la prière directe introduite par la déclaration initiale.
