  text: I turned around[a], and there was no one to help me; I looked for support, and there was none.
translation:
  language: fr
  text: Je me tournai de tous côtés, et il n’y avait personne pour m’aider ; je cherchai un soutien[a], et il n’y en avait pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec explicite : « regardant vers une aide venant des hommes, et il n’y en avait pas ». Le texte suit l’hébreu ; « soutien » peut désigner soit un appui, soit une personne qui soutient.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶפְנֶה סָבִיב
  choice: Je me tournai de tous côtés
  rationale: פנה exprime le fait de se tourner, et סביב étend le regard dans toutes les directions. Cette formulation conserve l’image concrète d’une recherche autour de soi dans un français naturel.
- source_word: וְאֵין עוֹזֵר לִי
  choice: mais personne ne venait à mon secours
  rationale: Le participe עוֹזֵר désigne une personne qui aide. La tournure verbale française restitue naturellement l’absence de tout secours humain, sans ajouter l’idée qu’un secours avait déjà commencé.
- source_word: וַאֲצַפֶּה
  choice: je guettai
  rationale: צפה peut signifier regarder, guetter ou attendre avec attention. « Je guettai » préserve à la fois l’observation active et l’attente, tandis que le grec ἐμβλέπων confirme l’idée de regarder vers une aide espérée.
- source_word: סוֹמֵךְ
  choice: un soutien
  rationale: Le participe de סמך peut désigner celui qui soutient ou le soutien lui-même. « Un soutien » garde cette légère ouverture entre personne secourable et appui apporté.
- source_word: וְאָיִן
  choice: mais il n’y en avait aucun
  rationale: La négation existentielle conclut le vers avec concision et emphase. Le pronom renvoie au soutien recherché.
