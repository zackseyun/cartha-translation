  language: fr
  text: Je rends grâce à ton nom, car tu as été pour moi un abri et un secours.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu transmis avec cette référence ne correspond pas à ce verset dans la numérotation grecque; la traduction suit ici le texte grec ancien, qui concorde avec Siracide 51.2.
