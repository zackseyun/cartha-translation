lexical_decisions:
- source_word: ἐξομολογοῦμαι
  choice: Je rends grâce
  rationale: Dans cette adresse à Dieu, le verbe exprime une reconnaissance proclamée; cette formulation française est naturelle et conforme au contexte de louange.
- source_word: τῷ ὀνόματί σου
  choice: à ton nom
  rationale: Conserve directement l’expression biblique, où le « nom » représente Dieu tel qu’il se révèle.
- source_word: σκεπαστής
  choice: un abri
  rationale: Rend l’idée de protection et de refuge sans ajouter une image absente du grec.
- source_word: βοηθός
  choice: un secours
  rationale: Exprime l’aide apportée par Dieu tout en gardant le parallélisme nominal du grec.
- source_word: ἐγένου μοι
  choice: tu as été pour moi
  rationale: Restitue la relation personnelle et la valeur passée du grec dans un français idiomatique.
theological_decisions:
- issue: Sens de l’action de grâce adressée au « nom » de Dieu
  choice: Je rends grâce à ton nom
  alternative: Je célèbre ton nom
  rationale: Le choix garde l’action de reconnaissance sans réduire le verbe à la seule louange; l’expression « ton nom » est conservée sans paraphrase doctrinale.
- issue: Caractère personnel de la protection divine
  choice: tu as été pour moi un abri et un secours
  alternative: tu es devenu mon protecteur et mon aide
  rationale: La formulation retenue préserve les deux fonctions parallèles et la relation au locuteur, sans suggérer que Dieu aurait acquis tardivement une qualité nouvelle.
translation_notes:
  register: Français international moderne, sobre et liturgiquement digne. « Un abri et un secours » reste accessible tout en conservant le parallélisme du grec.
