base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/013.yaml
  text: I was young[a], and I loved wisdom; I desired her and sought her out. In faithfulness my foot walked; from my youth, O Lord[b], I learned wisdom.
translation:
  language: fr
  text: J’étais jeune, et j’ai aimé la sagesse[a] ; je l’ai désirée et je l’ai recherchée. Mon pied a marché dans sa fidélité[b] ; Seigneur, dès ma jeunesse, j’ai appris la sagesse.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « et j’ai aimé la sagesse » sont placés entre crochets dans l’édition hébraïque utilisée, ce qui signale une incertitude textuelle ou éditoriale.
    reason: textual_uncertainty
  - marker: b
    text: 'Ou : « dans sa vérité ». Le mot hébreu peut exprimer la fidélité, la vérité ou la sûreté.'
    reason: lexical_alternative
  - marker: c
    text: 'Le texte grec parallèle diffère nettement : « Alors que j’étais encore jeune, avant de m’égarer, j’ai recherché ouvertement la sagesse dans ma prière. » Le texte principal suit le témoin hébreu conservé.'
    reason: alternative_reading
lexical_decisions:
- source_word: נַעַר
  choice: jeune
  rationale: Le mot désigne la jeunesse. « J’étais jeune » suit directement l’hébreu sans préciser davantage l’âge ni le genre.
- source_word: וָאוֹהַב חָכְמָה
  choice: j’aimais la sagesse
  rationale: Le texte hébreu édité exprime simplement l’amour de la sagesse; l’imparfait convient à l’état évoqué dans le souvenir de jeunesse.
- source_word: וְחָפַצְתִּי בָהּ
  choice: je la désirais
  rationale: חפץ peut exprimer le désir ou le plaisir pris en quelqu’un. Le pronom féminin conserve ici la personnification de la sagesse.
- source_word: וּבִקַּשְׁתִיהָ
  choice: je la recherchais
  rationale: בקש désigne une recherche intentionnelle. « Rechercher » est naturel en français et reprend le pronom féminin.
- source_word: בַּאֲמִתָּהּ
  choice: dans sa fidélité
  rationale: אמת peut désigner la fidélité, la vérité ou la sûreté, et le suffixe féminin renvoie vraisemblablement à la sagesse. La traduction conserve ce lien sans trancher silencieusement l’ambiguïté lexicale.
- source_word: דָּרְכָה רַגְלִי
  choice: mon pied a marché
  rationale: Cette formulation garde l’image concrète de l’hébreu, où le pied est le sujet du verbe, tout en restant compréhensible en français.
- source_word: מִנְּעוּרַי
  choice: dès ma jeunesse
  rationale: L’expression indique le point de départ ancien d’un apprentissage poursuivi; « dès ma jeunesse » est idiomatique et précis.
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Le terme est compris comme une adresse directe. En français, « Seigneur » suffit comme vocatif sans qu’il soit nécessaire d’ajouter « ô ».
- source_word: לָמַדְתִּי
  choice: j’ai appris
  rationale: Le verbe signifie naturellement « apprendre »; cette traduction évite de le restreindre à l’étude formelle ou de le transformer en passif.
theological_decisions:
- issue: Priorité du témoin hébreu face au texte grec parallèle
  choice: Suivre le texte hébreu conservé dans le corps du verset.
  alternative: 'Suivre le grec : « Alors que j’étais encore jeune, avant de m’égarer, j’ai recherché ouvertement la sagesse dans ma prière. »'
  rationale: Les formulations hébraïque et grecque diffèrent sensiblement. Puisque l’hébreu de ce passage est conservé, il fonde le texte principal; la variante grecque importante est signalée sans harmonisation.
- issue: Personnification de la sagesse
  choice: Employer les pronoms féminins « la » et « sa ».
  alternative: Rendre les pronoms de manière impersonnelle ou répéter seulement « sagesse ».
  rationale: Le genre grammatical et les suffixes hébreux entretiennent une personnification littéraire de la sagesse. La conserver ne requiert aucune interprétation doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. La structure imagée « mon pied a marché » est volontairement conservée, tandis que la ponctuation rend les deux mouvements du texte faciles à suivre.
