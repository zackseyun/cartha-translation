revisions:
- from: J’ai incliné un peu l’oreille et j’ai reçu, et j’ai trouvé pour moi-même une grande instruction[a].
  to: J’ai incliné un peu mon oreille et j’ai reçu ; j’ai trouvé pour moi-même une instruction abondante[a].
