  text: from lips of wickedness and from those who smear lies[a], and from the arrows of a deceitful tongue.
translation:
  language: fr
  text: des lèvres perverses et de ceux qui fabriquent des mensonges[a], et des flèches d’une langue trompeuse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle porte : « d’une langue impure et d’une parole mensongère », au lieu de « des lèvres perverses et de ceux qui fabriquent des mensonges […] et des flèches d’une langue trompeuse ». Puisque l’hébreu est conservé pour ce verset, le texte principal suit le témoin hébreu ; la leçon grecque est indiquée ici parce que la différence est importante.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִשִׂפְתֵי זִמָּה
  choice: des lèvres perverses
  rationale: La préposition מִן exprime ici ce dont le locuteur a été délivré. « Lèvres » conserve l’image concrète et le parallélisme avec « langue ». Dans ce contexte de mensonge et de tromperie, זִמָּה désigne largement la perversité morale plutôt qu’une faute spécifiquement sexuelle.
- source_word: וְטֹפְלֵי שֶׁקֶר
  choice: et de ceux qui fabriquent des mensonges
  rationale: Le participe טֹפְלֵי peut évoquer le fait d’enduire, d’accoler ou, par extension, de monter de toutes pièces une fausseté. « Fabriquent des mensonges » restitue clairement cette idée en français courant sans imposer une image obscure.
- source_word: וְחִצֵּי
  choice: et des flèches
  rationale: La préposition initiale se prolonge naturellement dans l’énumération. Le mot « flèches » maintient la métaphore violente de paroles qui blessent.
- source_word: לְשוֹן מִרְמָה
  choice: d’une langue trompeuse
  rationale: « Langue » préserve l’image corporelle du texte poétique. Le nom מִרְמָה, « tromperie », est rendu adjectivalement pour obtenir une expression française naturelle.
- source_word: ἀπὸ γλώσσης ἀκαθάρτου καὶ λόγου ψευδοῦς
  choice: non retenu dans le texte principal
  rationale: Le parallèle grec présente une leçon sensiblement différente. Puisque le texte hébreu est conservé ici, il sert de base au texte principal, tandis que la variante grecque est signalée en note.
