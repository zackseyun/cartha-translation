translation:
  language: fr
  text: Dans ma jeunesse, j’ai prié[a], et j’ai trouvé un savoir abondant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle dit : « Devant le temple, je la sollicitais, et jusqu’à la fin je la rechercherai. » Le témoin hébreu lit plutôt : « Dans ma jeunesse, j’ai prié, et j’ai trouvé un savoir abondant. »'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶתְפַּלֵּל תְּפִלָּה
  choice: j’ai prié
  rationale: L’hébreu emploie un complément de même racine, littéralement « j’ai prié une prière ». Le français naturel exprime cette idée par le simple verbe « prier », sans perte de sens.
- source_word: בִּנְעֻרוֹתָי
  choice: dans ma jeunesse
  rationale: Cette expression rend naturellement le pluriel abstrait hébreu désignant la période de la jeunesse.
- source_word: וְהַרְבֵּה
  choice: abondant
  rationale: Le terme marque ici une grande quantité. Avec « savoir », l’adjectif « abondant » donne une formulation française naturelle tout en conservant cette idée d’abondance.
- source_word: מָצָאתִי
  choice: j’ai trouvé
  rationale: Le sens premier du verbe est « trouver ». Ce choix conserve la métaphore concrète de l’hébreu plutôt que de l’expliciter par « acquérir ».
- source_word: דֵעָה
  choice: savoir
  rationale: Le nom désigne la connaissance ou le savoir. « Savoir » évite ici l’ambiguïté possible de « une grande connaissance » en français et ne le confond pas avec le terme spécifique pour la sagesse.
theological_decisions:
- issue: Rapport entre le texte hébreu et la forme grecque divergente dans le contexte de la recherche de la sagesse
  choice: Le texte principal suit le témoin hébreu, qui parle d’une prière faite durant la jeunesse et d’un savoir abondant trouvé.
  alternative: « Devant le Temple, je la demandais, et jusqu’à la fin je la rechercherai. »
  rationale: Le témoin hébreu, de haute confiance, est prioritaire et ne comporte aucun objet féminin après « j’ai prié ». Ajouter « pour elle » ferait entrer dans le texte hébreu un élément propre à la forme grecque. La divergence substantielle est donc conservée explicitement en note plutôt que fusionnée silencieusement avec le texte principal.
translation_notes:
  register: Français international moderne, simple et digne. « Un savoir abondant » maintient la distinction entre connaissance et sagesse tout en évitant une tournure peu idiomatique comme « beaucoup de connaissance ».
