  text: My inward parts burned like an oven as I looked toward her[a]; therefore I will not forsake her.
translation:
  language: fr
  text: Mes entrailles brûlaient comme un four en la contemplant[a] ; c’est pourquoi je ne l’abandonnerai pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Mon ventre fut bouleversé pour la rechercher ; c’est pourquoi j’ai acquis un bien excellent. »'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעַי
  choice: mes entrailles
  rationale: Le terme désigne littéralement les organes intérieurs et, par extension, le siège des émotions profondes. « Mes entrailles » conserve l’image corporelle sans la réduire au seul cœur ou au ventre.
- source_word: יֵחַמּוּ כַּתַּנּוּר
  choice: brûlaient comme un four
  rationale: Le verbe exprime la chaleur et la comparaison explicite avec un four appelle naturellement « brûlaient », qui rend l’intensité de l’image hébraïque.
- source_word: לְהַבִּיט בָּהּ
  choice: lorsque je la contemplais
  rationale: Le verbe signifie regarder vers ou contempler. La formulation temporelle relie naturellement cette action à l’ardeur intérieure, tout en gardant le pronom féminin qui renvoie à la Sagesse.
- source_word: בַּעֲבוּר כֵּן
  choice: c’est pourquoi
  rationale: Cette locution introduit la conséquence de ce qui précède ; « c’est pourquoi » est idiomatique et conserve clairement le rapport logique.
- source_word: לֹא אֶעֶזְבֶנָּה
  choice: je ne l’abandonnerai pas
  rationale: עזב signifie laisser ou abandonner. « Je ne l’abandonnerai pas » exprime naturellement en français la résolution de rester attaché à elle.
theological_decisions:
- issue: Divergence majeure entre la fin du texte hébreu et celle du grec
  choice: 'Suivre dans le texte principal l’hébreu : « c’est pourquoi je ne l’abandonnerai pas »'
  alternative: 'Le grec porte : « c’est pourquoi j’ai acquis un précieux bien »'
  rationale: Le témoin hébreu conservé est ici donné avec une confiance élevée et doit donc guider le texte principal. Comme le grec présente une leçon substantiellement différente, celle-ci est signalée intégralement en note plutôt que résolue silencieusement.
translation_notes:
  register: Français international actuel, digne et poétique. L’image viscérale et celle du four sont conservées, tandis que la syntaxe est rendue fluide pour un lectorat moderne.
