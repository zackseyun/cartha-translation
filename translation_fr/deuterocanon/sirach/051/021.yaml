  source_fidelity: 'Le texte principal suit correctement le témoin hébreu : « entrailles », l’image du four, le pronom féminin et la résolution de ne pas l’abandonner sont tous préservés. Toutefois, « lorsque je la contemplais » transforme l’infinitif hébreu להביט (« regarder / contempler ») en une subordonnée temporelle plus explicitement développée. « En la contemplant » rend plus directement le lien circonstanciel tout en restant naturel. La différence de temps entre le premier membre à l’imparfait et la résolution au futur est admissible dans le contexte poétique et conforme à l’audit anglais.'
  naturalness: « Mes entrailles brûlaient comme un four » est une formulation forte mais naturelle dans un registre poétique moderne. « En la contemplant » est plus fluide et plus proche de la construction source que « lorsque je la contemplais ». Dans la note, « un précieux bien » est possible, mais « un bien excellent » est plus idiomatique en français actuel pour ἀγαθὸν κτῆμα.
  terminology: « Entrailles » conserve l’image corporelle de מֵעַי sans l’interpréter comme « cœur ». « Abandonner » rend bien עזב. Le terme féminin demeure volontairement sans antécédent explicité, conformément au texte et à son contexte sapientiel.
