  - severity: low
    issue: « Un précieux bien » est légèrement peu idiomatique dans la note.
    rationale: Le grec ἀγαθὸν κτῆμα désigne un bien ou une possession de valeur ; « un bien excellent » est plus naturel en français international tout en gardant le sens.
