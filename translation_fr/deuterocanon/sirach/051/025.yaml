  text: 'I opened my mouth and spoke of her: acquire wisdom for yourselves without silver[a].'
translation:
  language: fr
  text: 'J’ai ouvert ma bouche et j’ai parlé d’elle : procurez-vous la sagesse sans argent[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie ici un suffixe féminin, qui renvoie probablement à la sagesse personnifiée ; on pourrait aussi traduire plus abstraitement : « et j’en ai parlé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי פָתַחְתִי
  choice: J’ai ouvert la bouche
  rationale: Rend littéralement l’expression hébraïque courante qui signifie commencer à parler, tout en conservant son image vive et son parallèle grec.
- source_word: וְדִבַּרְתִּי בָהּ
  choice: et j’ai parlé d’elle
  rationale: Le suffixe féminin singulier renvoie le plus naturellement à la sagesse personnifiée. Cette formulation française préserve le référent personnel et féminin sans ajouter d’interprétation doctrinale.
- source_word: קְנוּ לָכֶם
  choice: procurez-vous
  rationale: קנה peut signifier « acheter » ou, plus largement, « acquérir ». « Procurez-vous » est naturel en français et garde l’idée d’obtenir la sagesse pour soi, tandis que la mention de l’argent maintient la métaphore commerciale.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: Correspond au sens direct du terme et explicite naturellement en français le référent du pronom féminin précédent.
- source_word: בְּלֹא כָסֶף
  choice: sans argent
  rationale: « Argent » conserve à la fois le sens concret de כָסֶף, qui peut désigner l’argent métal, et son emploi courant comme moyen de paiement. En français moderne, « sans argent » est plus naturel et moins ambigu que « sans argent métal ».
theological_decisions:
- issue: Référent du suffixe féminin dans « j’ai parlé d’elle »
  choice: Le suffixe renvoie à la sagesse, personnifiée au féminin.
  alternative: 'Le suffixe pourrait être compris plus abstraitement : « j’en ai parlé », à propos de la sagesse ou de l’enseignement.'
  rationale: L’impératif qui suit nomme immédiatement la sagesse, et sa personnification féminine est courante dans le Siracide. Le féminin est donc conservé, sans identifier cette figure à une réalité doctrinale ultérieure.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve le parallélisme et l’image concrète de l’hébreu. « Procurez-vous » évite un littéralisme commercial excessif, tandis que « sans argent » maintient le paradoxe économique du verset.
