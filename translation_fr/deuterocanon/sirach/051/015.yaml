  yaml_path: translation/deuterocanon/sirach/051/015.yaml
  text: From her blossom, like a ripening cluster of grapes, my heart rejoiced in her; my foot walked in uprightness; from my youth I tracked her down.
translation:
  language: fr
  text: De sa fleur, comme d’une grappe de raisin qui mûrit[a], mon cœur s’est réjoui en elle. Mon pied s’est avancé dans la droiture[b] ; dès ma jeunesse, j’ai suivi ses traces[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui prend sa couleur » ; le grec évoque une grappe dont les raisins se colorent en mûrissant.
    reason: lexical_alternative
  - marker: b
    text: Ou « a posé le pied dans la rectitude » ou « a marché sur un chemin droit » ; le grec peut évoquer à la fois un chemin droit et la droiture morale.
    reason: lexical_alternative
  - marker: c
    text: Ou « je l’ai recherchée » ; le verbe grec évoque littéralement le fait de suivre ou de relever des traces.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἄνθους
  choice: Dès sa fleur
  rationale: ἄνθος désigne la fleur ou la floraison. Le possessif rattache naturellement l’image à la Sagesse personnifiée ; « dès » rend ici l’idée d’un commencement à partir de la fleur.
- source_word: ὡς περκάζουσης σταφυλῆς
  choice: comme une grappe de raisin qui mûrit
  rationale: σταφυλή est une grappe de raisin, tandis que περκάζω évoque les grains qui prennent leur couleur en mûrissant. Cette formulation française conserve l’image agricole sans imposer une couleur précise.
- source_word: εὐφράνθη ἡ καρδία μου ἐν αὐτῇ
  choice: mon cœur s’est réjoui en elle
  rationale: La tournure garde le cœur comme siège de la joie et conserve ἐν, dont la valeur peut être participative plutôt que simplement causale.
- source_word: ἐπέβη ὁ πούς μου ἐν εὐθύτητι
  choice: Mon pied a marché dans la droiture
  rationale: ἐπέβη exprime le fait de poser le pied ou d’avancer ; εὐθύτης peut désigner à la fois la rectitude d’un chemin et la droiture morale. La formulation maintient cette superposition d’images.
- source_word: ἐκ νεότητός μου ἴχνευον αὐτήν
  choice: dès ma jeunesse, j’ai suivi ses traces
  rationale: ἰχνεύω évoque littéralement la recherche ou la poursuite à partir de traces. « Suivre ses traces » préserve cette image tout en restant naturel en français.
theological_decisions:
- issue: Référent et genre de αὐτῇ / αὐτήν
  choice: Les pronoms renvoient à la Sagesse personnifiée, rendue au féminin par « elle » et « ses ».
  alternative: Employer une désignation abstraite sans personnification explicite.
  rationale: Le contexte du Siracide présente régulièrement la Sagesse comme une figure féminine ; le grec emploie ici des pronoms féminins, que le français peut conserver naturellement.
- issue: Portée de ἐν εὐθύτητι
  choice: Conserver « dans la droiture », qui laisse entendre une conduite moralement droite tout en maintenant l’image de la marche.
  alternative: Traduire « sur un chemin droit », en privilégiant l’image spatiale.
  rationale: Le nom grec autorise les deux nuances ; il convient de ne pas réduire la tension entre chemin concret et rectitude morale.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence poétique et les images de la floraison, de la grappe, de la marche et des traces sont conservées. Le féminin maintient la personnification de la Sagesse.
