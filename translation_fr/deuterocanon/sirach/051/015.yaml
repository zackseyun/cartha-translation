  to: De sa fleur, comme d’une grappe de raisin qui mûrit[a], mon cœur s’est réjoui en elle. Mon pied s’est avancé dans la droiture[b] ; dès ma jeunesse, j’ai suivi ses traces[c].
  rationale: La révision corrige le faux sens temporel introduit par « Dès » et améliore l’expression du mouvement du pied. Elle préserve les images, le féminin de la Sagesse, l’ambiguïté morale et spatiale, et les trois ancrages de notes.
