  text: Yahweh has given me the reward of my lips[b][a]; therefore I acquired her as a good possession.
translation:
  language: fr
  text: Le SEIGNEUR m’a donné la récompense de mes lèvres ; c’est pourquoi j’ai acquis la Sagesse[a] comme un bien de valeur.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je l’ai acquise » ; le pronom féminin renvoie à la Sagesse dans le contexte.'
    reason: cross_reference
  - marker: b
    text: 'Le grec porte : « Le Seigneur m’a donné une langue pour récompense, et par elle je le louerai. »'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהֹוָה
  choice: le SEIGNEUR
  rationale: Rend le nom divin selon la convention française établie, tout en signalant son statut particulier par les petites capitales.
- source_word: שְׂכַר שִׂפְתוֹתָי
  choice: le salaire de mes lèvres
  rationale: Préserve l’image concrète et l’étrangeté expressive de l’hébreu. « Salaire » maintient aussi la nuance de rétribution sans expliciter ce que les lèvres ont accompli.
- source_word: בַּעֲבוּר כֵּן
  choice: c’est pourquoi
  rationale: Exprime naturellement en français le lien causal ou consécutif du syntagme hébreu.
- source_word: קְנִיתִיהָ
  choice: j’ai acquis la Sagesse
  rationale: Le verbe signifie acquérir ou obtenir. Le complément féminin implicite renvoie à la Sagesse dans le contexte ; son explicitation évite en français un pronom sans antécédent dans ce verset isolé.
- source_word: קִנְיָן טוֹב
  choice: comme un bien précieux
  rationale: « Bien » conserve l’idée de possession, tandis que « précieux » exprime idiomatiquement la valeur positive de טוֹב. Le jeu étymologique entre קנה et קנין est moins perceptible qu’avec « acquisition », mais le français est plus naturel.
- source_word: ἔδωκεν Κύριος γλῶσσάν μοι μισθὸν μου, καὶ ἐν αὐτῇ αἰνέσω αὐτόν
  choice: non retenu dans le texte principal
  rationale: Le grec diverge sensiblement de l’hébreu conservé. Puisque celui-ci est le témoin principal, la variante grecque est donnée en note.
theological_decisions:
- issue: Choix du texte principal face à la divergence entre l’hébreu et le grec
  choice: 'Suivre l’hébreu : le SEIGNEUR donne au locuteur le salaire de ses lèvres, puis celui-ci acquiert la Sagesse comme un bien précieux.'
  alternative: 'Suivre le grec : « Le Seigneur m’a donné une langue pour salaire, et par elle je le louerai. »'
  rationale: L’hébreu conservé est prioritaire pour ce passage du Siracide. La lecture grecque reste toutefois ancienne et substantielle ; elle est donc préservée en note sans harmonisation.
- issue: Référent du suffixe féminin dans קְנִיתִיהָ
  choice: Expliciter « la Sagesse » dans le texte et le signaler en note.
  alternative: Traduire littéralement par « je l’ai acquise » ou « je l’ai acquise comme un bien précieux ».
  rationale: Le féminin renvoie vraisemblablement à la Sagesse dans le contexte. L’explicitation rend le verset autonome et intelligible, tandis que la note indique que le nom n’est pas répété dans l’hébreu.
translation_notes:
  register: 'Français moderne, digne et accessible. L’expression inhabituelle « salaire de mes lèvres » est volontairement conservée afin de ne pas dissoudre l’image hébraïque. Les marqueurs de note suivent leur point d’ancrage : [a] après « la Sagesse » et [b] à la fin du verset.'
