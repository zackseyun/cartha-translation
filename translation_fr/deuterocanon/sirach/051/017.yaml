  text: In her I made progress, and I will give glory to the one who gives me wisdom[b][a].
translation:
  language: fr
  text: Son joug a été pour moi un honneur, et je rendrai grâce à ceux qui m’enseignent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu de ce verset est difficile et diffère sensiblement du grec. Le grec porte : « En elle, j’ai progressé, et je donnerai gloire à celui qui me donne la sagesse. »'
    reason: textual_variant
lexical_decisions:
- source_word: עֻלָּהּ
  choice: Son joug
  rationale: Le mot hébreu transmis est difficile, mais peut être compris comme « son joug ». Cette traduction suit prioritairement le témoin hébreu plutôt que de lui substituer la leçon grecque « en elle, j’ai progressé ».
- source_word: הָיָה לִי לְכָבוֹד
  choice: a été pour moi un honneur
  rationale: Cette formulation française naturelle rend l’idée littérale de quelque chose qui « fut pour moi à honneur/gloire ».
- source_word: לִמְלַמְּדַי
  choice: à ceux qui m’enseignent
  rationale: La forme hébraïque peut désigner « mes maîtres » ou « ceux qui m’enseignent ». Le pluriel français respecte sa morphologie sans imposer un référent humain ou divin plus précis.
- source_word: הוֹדָאָה
  choice: je rendrai grâce
  rationale: Le nom hébreu exprime l’action de remercier, la reconnaissance ou la louange. « Rendre grâce » convient au registre sapientiel et conserve une possible portée religieuse.
theological_decisions:
- issue: Identité de ceux qui enseignent le locuteur
  choice: Ne pas préciser leur identité et conserver le pluriel du texte hébreu
  alternative: « à celui qui me donne la sagesse », selon le grec, avec Dieu comme référent probable
  rationale: Le témoin hébreu évoque ceux qui enseignent, tandis que le grec parle au singulier de celui qui donne la sagesse. La traduction principale suit l’hébreu sans résoudre cette divergence théologique.
- issue: Rapport à la Sagesse personnifiée
  choice: « Son joug » conserve un antécédent féminin possible
  alternative: « En elle, j’ai progressé », selon le grec
  rationale: Le contexte peut faire de la Sagesse l’antécédent du possessif, mais le verset hébreu reste difficile; la note signale donc la lecture grecque sans l’intégrer silencieusement au texte.
translation_notes:
  register: Français international moderne, sobre et digne. « Son joug » garde l’image concrète et l’ambiguïté du texte hébreu; « ceux qui m’enseignent » évite de transformer le pluriel hébreu en une désignation explicitement divine.
