  text: Turn to me[a], you who are simple[b], and lodge in the house of my instruction.
translation:
  language: fr
  text: Tournez-vous vers moi[a], vous qui manquez d’instruction[b], et logez dans la maison de mon enseignement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Approchez-vous de moi ». Le grec parallèle porte : « Approchez-vous de moi, vous qui êtes sans instruction, et logez dans une maison d’instruction. »'
    reason: Variante lexicale appuyée par le parallèle grec.
  - marker: b
    text: L’hébreu peut aussi se traduire par « vous, les insensés » ou « vous, les simples ». Le grec parallèle désigne plutôt des personnes qui n’ont pas reçu de formation.
    reason: Préserver l’étendue de sens de l’hébreu et signaler l’éclairage du grec.
lexical_decisions:
- source_word: פְּנוּ אֵלַי
  choice: Tournez-vous vers moi
  rationale: L’impératif de פנה signifie naturellement « se tourner » ou « se tourner vers ». Le grec parallèle, Ἐγγίσατε πρὸς μέ (« approchez-vous de moi »), confirme qu’il s’agit ici d’une invitation.
- source_word: סְכָלִים
  choice: vous qui manquez d’instruction
  rationale: Le terme peut désigner des personnes sottes, simples ou dépourvues de formation. Dans cette invitation à recevoir la sagesse, le grec ἀπαίδευτοι (« sans instruction, non formés ») favorise la nuance pédagogique sans effacer la portée potentiellement critique de l’hébreu.
- source_word: וְלִינוּ
  choice: et logez
  rationale: Le verbe לין signifie couramment « passer la nuit » ou « loger ». « Logez » conserve l’image d’une installation dans un lieu d’apprentissage, également présente dans le grec αὐλίσθητε.
- source_word: בְּבֵית מִדְרָשִׁי
  choice: dans la maison de mon enseignement
  rationale: L’expression désigne littéralement la maison liée à l’étude ou à l’instruction du locuteur. Cette formulation rejoint le grec οἴκῳ παιδείας (« maison d’instruction ») sans donner à מדרש un sens institutionnel plus tardif et trop précis.
theological_decisions:
- issue: Faut-il rendre סְכָלִים comme une condamnation morale ou comme un manque de formation ?
  choice: vous qui manquez d’instruction
  alternative: vous, les insensés ; vous, les simples
  rationale: Le contexte est celui d’une invitation pédagogique. Le parallèle grec appuie nettement l’idée de personnes non formées. La traduction retenue évite donc de transformer l’appel en insulte morale, tandis que la note conserve l’ambiguïté de l’hébreu.
translation_notes:
  register: Français international actuel, clair et digne. La formulation conserve l’image concrète du logement et le cadre pédagogique, tout en évitant aussi bien l’insulte excessive que la technicité institutionnelle.
