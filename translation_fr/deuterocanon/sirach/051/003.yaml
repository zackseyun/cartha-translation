base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/003.yaml
  text: from the snare of those watching for my stumbling[a], and from the hand of those seeking my life. You saved me from many troubles[b], and from the distress of a flame all around.
translation:
  language: fr
  text: du piège de ceux qui guettaient mon faux pas[a], et de la main de ceux qui en voulaient à ma vie. Tu m’as sauvé de nombreuses détresses, et de l’angoisse d’une flamme tout autour[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui guettaient ma chute » ou « ceux qui observaient mon boitement ». L’expression hébraïque est imagée et quelque peu incertaine.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu porte littéralement une expression proche de « l’angoisse d’une flamme tout autour ». Le texte grec diffère considérablement ici et développe autrement la délivrance.
    reason: textual_variant
lexical_decisions:
- source_word: מִמּוֹקֵשׁ
  choice: du piège
  rationale: מוֹקֵשׁ désigne un piège ou un lacet. « Piège » garde l’image concrète tout en étant naturel en français moderne.
- source_word: צוֹפֵי צַלְעִי
  choice: ceux qui guettaient mon faux pas
  rationale: צוֹפֵי désigne ceux qui observent ou guettent; צַלְעִי évoque probablement le fait de boiter, de trébucher ou de tomber. « Guettaient mon faux pas » rend la surveillance hostile sans effacer l’incertitude, signalée en note.
- source_word: וּמִּיַד
  choice: et de la main de
  rationale: La « main » exprime ici le pouvoir ou l’emprise. La conserver respecte l’image hébraïque et le parallélisme poétique.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: ceux qui en voulaient à ma vie
  rationale: Dans ce contexte de menace, נֶפֶשׁ désigne la vie. L’expression française indique naturellement une intention meurtrière sans introduire une affirmation sur la nature de l’âme.
- source_word: מֵרַבּוֹת צָרוֹת
  choice: de nombreuses détresses
  rationale: רַבּוֹת peut exprimer le nombre ou l’intensité. « Nombreuses » suit naturellement le pluriel, tandis que « détresses » conserve la force de צָרוֹת.
- source_word: הוֹשַׁעְתָּנִי
  choice: tu m’as sauvé
  rationale: Le verbe ישׁע signifie sauver ou délivrer. Cette formulation est directe, courante et conserve l’adresse personnelle à Dieu.
- source_word: וּמִמְּצוּקוֹת
  choice: et de l’angoisse de
  rationale: מְצוּקוֹת évoque la détresse, l’oppression ou l’angoisse. Le singulier collectif français produit une construction naturelle avec « une flamme » tout en conservant le lien difficile du texte hébreu.
- source_word: שַׁלְהֶבֶת
  choice: une flamme
  rationale: שַׁלְהֶבֶת signifie flamme ou feu ardent. Le choix littéral maintient l’image concrète et son possible sens métaphorique.
- source_word: מִסָּבִיב
  choice: tout autour
  rationale: L’adverbe exprime l’encerclement. « Tout autour » est concis et laisse ouverte la relation exacte entre la flamme et la personne menacée.
theological_decisions:
- issue: Faut-il rendre נַפְשִׁי par « mon âme » ou « ma vie » ?
  choice: ma vie
  alternative: mon âme
  rationale: Dans un contexte d’ennemis, de piège et de délivrance, l’expression hébraïque signifie que des adversaires cherchent à prendre la vie du locuteur; elle ne formule pas ici une doctrine de l’âme.
- issue: La flamme finale est-elle littérale ou métaphorique ?
  choice: l’angoisse d’une flamme tout autour
  alternative: une détresse ardente qui m’entourait
  rationale: L’hébreu permet une image concrète de feu comme une évocation métaphorique de l’épreuve. La traduction garde « flamme » et ne tranche pas. Le grec diverge fortement à cet endroit et ne doit pas remplacer silencieusement le témoin hébreu.
translation_notes:
  register: Français international moderne, digne et poétique. Le tutoiement convient à l’adresse directe à Dieu. Les images hébraïques de la main, du piège et de la flamme sont conservées, tandis que les expressions idiomatiques sont rendues dans un français naturel.
