  text: from a choking fire all around[a], and from the midst of a fire that I did not kindle.
translation:
  language: fr
  text: d’un feu étouffant, tout autour de moi[a], et du milieu d’un feu que je n’avais pas allumé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu conservé de ce verset est difficile et diffère fortement du grec. Une traduction plus proche de la forme hébraïque de la seconde moitié donnerait approximativement : « du sein de l’abîme, à ma mère » ; le sens demeure obscur dans ce contexte.'
    reason: textual_variant
lexical_decisions:
- source_word: מְכַבּוֹת אֵשׁ
  choice: d’un feu étouffant
  rationale: L’hébreu transmis est difficile. Le grec ἀπὸ πνιγμοῦ πυρᾶς soutient l’idée d’un feu qui étouffe; cette formulation française restitue ce sens sans prétendre résoudre le texte hébreu obscur.
- source_word: לְאֵין פֶּחָה / κυκλόθεν
  choice: qui m’entourait
  rationale: La tournure hébraïque est incertaine; le grec κυκλόθεν signifie «tout autour». «Qui m’entourait» exprime naturellement le danger encerclant le locuteur.
- source_word: ἐκ μέσου πυρός
  choice: du milieu d’un feu
  rationale: Traduction directe et naturelle de la leçon grecque, cohérente avec l’image du feu également présente dans l’hébreu.
- source_word: οὗ οὐκ ἐξέκαυσα
  choice: que je n’avais pas allumé
  rationale: 'ἐξέκαυσα est un aoriste actif à la première personne: le sens le plus direct est «que je n’ai pas allumé». Le plus-que-parfait français marque naturellement l’antériorité de l’allumage par rapport à la délivrance racontée.'
theological_decisions:
- issue: Recours au parallèle grec face à un texte hébreu gravement obscur
  choice: Le texte principal suit le sens cohérent du grec tout en conservant l’image hébraïque du feu.
  alternative: 'Traduire littéralement l’hébreu transmis: «des extinctions d’un feu sans souffle, du sein de l’abîme, de ma mère» ou une formulation voisine.'
  rationale: L’hébreu conservé présente ici une divergence majeure et sa seconde moitié demeure obscure dans le contexte. Le grec fournit une lecture suivie qui s’accorde avec le thème de la délivrance. La variante hébraïque est donc signalée explicitement en note, sans masquer l’incertitude textuelle.
translation_notes:
  register: Français moderne, international et digne. «Feu étouffant» conserve la force de l’image grecque; «qui m’entourait» est plus idiomatique que «tout autour». La note rend transparente la divergence majeure entre l’hébreu et le grec.
