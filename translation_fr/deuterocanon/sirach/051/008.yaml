base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/008.yaml
  text: And I remembered the mercies of Yahweh[a], and his acts of covenant faithfulness from of old, who delivers those who take refuge in him[b], and redeems them from every evil.
translation:
  language: fr
  text: Je me suis souvenu des compassions du SEIGNEUR et de ses actes d’amour fidèle depuis les temps anciens[a], lui qui délivre ceux qui trouvent refuge en lui[b] et les rachète de tout mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « et de son amour fidèle depuis toujours ». L’hébreu peut mettre davantage l’accent sur la fidélité divine qui demeure à travers tous les temps.'
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec parallèle porte : « ta compassion, Seigneur, et ton œuvre depuis les temps anciens », puis : « tu délivres ceux qui t’attendent et tu les sauves de la main des nations ». Le texte hébreu a ici « ceux qui trouvent refuge en lui » et « de tout mal ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶזְכְּרָה
  choice: Je me suis souvenu
  rationale: Le verbe זכר exprime directement le fait de se souvenir ou de rappeler à sa mémoire. Le passé composé est naturel en français moderne tout en conservant le récit à la première personne.
- source_word: רַחֲמֵי יְהֹוָה
  choice: des compassions du SEIGNEUR
  rationale: Le pluriel hébreu évoque les manifestations de la compassion divine. « Le SEIGNEUR » suit l’usage français traditionnel qui représente respectueusement le nom divin YHWH.
- source_word: וַחֲסָדָיו
  choice: et de ses actes d’amour fidèle
  rationale: Le pluriel de חסד désigne ici les manifestations concrètes de la bonté loyale de Dieu. « Actes d’amour fidèle » garde à la fois la pluralité, l’affection et la constance, sans imposer une formulation confessionnelle particulière.
- source_word: אֲשֶׁר מֵעוֹלָם
  choice: depuis les temps anciens
  rationale: מֵעוֹלָם peut renvoyer à un passé très ancien ou à une continuité sans commencement précisé. Cette formulation convient au rappel des interventions divines passées sans exclure une portée plus forte.
- source_word: הַמַּצִּיל
  choice: lui qui délivre
  rationale: Le participe hébreu caractérise le SEIGNEUR comme celui qui délivre. La tournure appositive « lui qui » conserve ce lien sans transformer explicitement la proposition en explication causale.
- source_word: חוֹסֵי בוֹ
  choice: ceux qui trouvent refuge en lui
  rationale: L’expression חסה ב garde l’image concrète de personnes cherchant protection auprès de Dieu; elle signifie davantage qu’une confiance abstraite.
- source_word: וַיִּגְאָלֵם
  choice: et les rachète
  rationale: גאל exprime une délivrance conçue comme un rachat. « Rachète » conserve cette force particulière et le parallélisme avec « délivre ».
- source_word: מִכָּל רָע
  choice: de tout mal
  rationale: רָע peut désigner aussi bien le mal que le malheur ou le dommage. « Tout mal » préserve cette amplitude et la portée globale de כָּל.
theological_decisions:
- issue: Portée de חסד dans l’évocation de l’action salvatrice de Dieu
  choice: ses actes d’amour fidèle
  alternative: ses bontés ; son amour inébranlable ; ses actes de fidélité à l’alliance
  rationale: Le contexte associe חסד à la délivrance et au rachat. La traduction choisie exprime une loyauté divine active et durable sans introduire explicitement l’idée d’alliance là où le terme בְּרִית n’apparaît pas.
- issue: Valeur temporelle de מֵעוֹלָם
  choice: depuis les temps anciens
  alternative: depuis toujours ; de toute éternité
  rationale: L’expression peut évoquer soit l’ancienneté historique des œuvres divines, soit leur permanence. Le texte principal retient la valeur historique adaptée au souvenir, tandis que la note maintient ouverte la lecture plus forte.
- issue: Relation syntaxique de הַמַּצִּיל avec le nom divin
  choice: lui qui délivre
  alternative: car il délivre ; celui qui délivre
  rationale: Le participe hébreu fonctionne naturellement comme une caractérisation appositive de YHWH. « Lui qui » conserve cette syntaxe et évite d’ajouter une relation causale non explicitement marquée.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme poétique est conservé, de même que l’image concrète du refuge et la distinction entre délivrer et racheter. Les notes signalent les principales ambiguïtés de l’hébreu et la variante grecque sans les résoudre silencieusement.
