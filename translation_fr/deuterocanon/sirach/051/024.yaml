translation:
  language: fr
  text: Jusqu’à quand manquerez-vous de ces choses[a], alors que votre âme sera très assoiffée ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Jusqu’à quand manquerez-vous de ceux-ci et de ceux-ci, et votre âme sera très assoiffée ? » La répétition « ceux-ci et ceux-ci » est inhabituelle et son référent précis est incertain. Le grec parallèle porte : « … que vous dites manquer de ces choses, tandis que vos âmes ont grandement soif »; il emploie le pluriel et le présent.'
    reason: La tournure hébraïque est obscure; le grec parallèle diffère dans sa formulation, son nombre et son temps verbal.
lexical_decisions:
- source_word: עַד מָתַי
  choice: Jusqu’à quand
  rationale: Rend naturellement la question temporelle chargée de reproche ou d’exhortation.
- source_word: תַחְסְרוּן
  choice: manquerez-vous
  rationale: Le verbe חסר exprime le fait de manquer de quelque chose; le futur français conserve la forme inaccomplie de l’hébreu dans cette question.
- source_word: מִן אֵלּוּ וְאֵלּוּ
  choice: de tout cela
  rationale: La tournure hébraïque, littéralement « de ceux-ci et de ceux-ci », est obscure et probablement récapitulative; « tout cela » renvoie naturellement aux réalités précédemment évoquées sans les préciser davantage.
- source_word: וְנַפְשְׁכֶם
  choice: votre âme
  rationale: נפש peut désigner la personne, la vie ou l’âme. Ici, l’image de la soif évoque le désir intérieur; « âme » en préserve la portée sans imposer une anthropologie technique.
- source_word: צְמֵאָה מְאֹד תִּהְיֶה
  choice: est si assoiffée
  rationale: « Si assoiffée » restitue l’intensité de מְאֹד dans un français idiomatique. Le présent, appuyé par le parallèle grec, présente cette soif comme l’état actuel qui rend le manque pressant.
theological_decisions:
- issue: Sens anthropologique de נֶפֶשׁ dans l’exhortation sapientielle
  choice: votre âme
  alternative: votre être / vous-mêmes
  rationale: « Votre âme » maintient la résonance existentielle et spirituelle de l’image de la soif, tout en laissant ouvert le sens précis de נפש.
- issue: Valeur temporelle de תִּהְיֶה
  choice: est
  alternative: sera
  rationale: L’hébreu porte littéralement « sera », mais le grec parallèle emploie le présent et le contexte paraît décrire une soif déjà éprouvée. La note signale la forme hébraïque afin de préserver l’ambiguïté.
translation_notes:
  register: Français international moderne, courant mais digne. La formulation conserve la question exhortative, l’image sapientielle de l’âme assoiffée et l’incertitude de la tournure hébraïque grâce à une note.
