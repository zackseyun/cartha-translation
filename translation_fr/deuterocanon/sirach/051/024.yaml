  verdict: revise
  source_fidelity: La question initiale et l’image de la soif sont bien rendues. Toutefois, « tout cela » peut suggérer la totalité des réalités visées, alors que מִן אֵלּוּ וְאֵלּוּ demeure une expression démonstrative obscure, plus sobrement rendue par « ces choses ». Le futur תִּהְיֶה doit être conservé dans le texte principal, le grec parallèle pouvant être signalé en note sans neutraliser la forme hébraïque primaire.
  naturalness: « Jusqu’à quand manquerez-vous de ces choses » est naturel dans un registre sapientiel moderne et international. « Votre âme sera très assoiffée » est idiomatique et maintient l’image sans ajouter d’interprétation.
  terminology: '« âme » rend convenablement נֶפֶשׁ dans ce contexte imagé, sans imposer un sens anthropologique technique. La note doit corriger la paraphrase du grec : le texte grec ne dit pas « Pourquoi », mais exprime l’idée de dire que l’on manque de ces choses; il emploie aussi le pluriel « vos âmes » et le présent « ont soif ».'
  issues:
