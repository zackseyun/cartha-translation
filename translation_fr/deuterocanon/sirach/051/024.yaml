    issue: « tout cela » est plus englobant que l’hébreu ambigu.
    rationale: La répétition démonstrative אֵלּוּ וְאֵלּוּ est difficile, mais ne justifie pas nécessairement l’ajout de l’idée de totalité portée par « tout ». « Ces choses » conserve mieux l’indétermination du référent.
  - severity: medium
    issue: Le présent « est » ne reflète pas la forme verbale hébraïque תִּהְיֶה.
    rationale: Même si le grec parallèle emploie le présent, le texte de base hébreu a « sera ». Il convient de préserver cette divergence dans le texte et de la signaler en note.
  - severity: medium
    issue: La citation du grec dans la note introduit « Pourquoi », absent du parallèle fourni.
    rationale: καὶ ὅτι se rapporte à l’idée que les destinataires disent manquer de ces choses; la note doit éviter d’attribuer au grec une interrogation causale explicite.
