  text: My soul came near to death[b][a], and my life to the depths of Sheol.
translation:
  language: fr
  text: 'Mon âme s’approcha de la mort[a],

    et ma vie, des profondeurs du séjour des morts[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « toucha » ou « atteignit la mort ». Le grec parallèle porte : « s’approcha de la mort ».'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « shéol », le domaine des morts; le grec parallèle porte : « l’Hadès d’en bas ».'
    reason: source_term
lexical_decisions:
- source_word: וַתִּגַּע
  choice: s’approcha
  rationale: Le verbe נגע signifie littéralement « toucher » ou « atteindre », mais, avec לַמָּוֶת, il exprime ici la proximité de la mort. Le grec ἤγγισεν confirme ce sens.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: נפש peut désigner l’âme, la personne ou la vie. « Mon âme » préserve ici le parallélisme sans confondre le terme avec חַיָּתִי dans le second membre.
- source_word: חַיָּתִי
  choice: ma vie
  rationale: Le mot désigne la vie ou la force vitale du locuteur; « ma vie » est naturel en français et correspond au grec ἡ ζωή μου.
- source_word: לִשְׁאוֹל
  choice: du séjour des morts
  rationale: Cette expression française rend clairement le shéol comme domaine des morts, sans le réduire à la tombe ni lui imposer les associations mythologiques possibles d’« Hadès ».
- source_word: תַּחְתִּיּוֹת
  choice: les profondeurs
  rationale: Le pluriel désigne les régions les plus basses ou profondes. « Les profondeurs du séjour des morts » conserve sa force intensive et s’accorde avec le grec κάτω, « en bas ».
theological_decisions:
- issue: Rendu de שְׁאוֹל dans le témoin hébreu, parallèlement au grec ᾅδης
  choice: le séjour des morts
  alternative: le shéol; l’Hadès; la tombe
  rationale: « Le séjour des morts » transmet le concept hébreu dans un français immédiatement compréhensible, sans limiter le sens à une sépulture ni préciser davantage que le texte la nature de l’au-delà. Une note signale le terme hébreu.
translation_notes:
  register: Français moderne, sobre et poétique. Le parallélisme hébreu est conservé, avec ellipse du verbe dans le second membre. « Séjour des morts » privilégie l’intelligibilité internationale tout en maintenant l’ambiguïté du texte sur l’au-delà.
