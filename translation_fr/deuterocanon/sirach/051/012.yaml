  text: For he redeemed me from every evil[a], and delivered me in the day of trouble.
translation:
  language: fr
  text: Il m’a racheté de tout mal[a] et m’a délivré au jour de la détresse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec porte : « Car tu m’as sauvé de la destruction et tu m’as délivré d’un temps mauvais. » L’hébreu porte « de tout mal » et « au jour de la détresse ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפְדֵּנִי
  choice: il m’a racheté
  rationale: Le verbe פדה exprime la libération ou le rachat. « Racheté » conserve cette nuance forte, tandis que le sujet à la troisième personne est explicité naturellement en français d’après le contexte.
- source_word: מִכָּל רָע
  choice: de tout mal
  rationale: רָע peut désigner le mal, le malheur ou le danger. « Tout mal » préserve l’étendue sémantique de l’hébreu sans limiter le sens au mal moral ni aux seules calamités.
- source_word: וַיְמַלְּטֵנִי
  choice: m’a délivré
  rationale: מלט signifie ici mettre hors de danger ou faire échapper. « Délivré » rend ce sens clairement tout en maintenant la distinction avec « racheté » dans le parallélisme.
- source_word: בְּיוֹם צָרָה
  choice: au jour de la détresse
  rationale: Cette formulation conserve l’image temporelle concrète de l’hébreu et son registre poétique, tout en restant idiomatique en français.
theological_decisions:
- issue: Choix du témoin principal entre l’hébreu et le parallèle grec
  choice: Traduire le texte hébreu conservé comme témoin principal et employer le grec comme contrôle du sens.
  alternative: 'Suivre davantage le grec : « Car tu m’as sauvé de la destruction et tu m’as délivré d’un temps mauvais. »'
  rationale: L’hébreu est cohérent et bien attesté ici. Le grec présente des différences réelles de personne et de formulation ; elles sont donc signalées en note plutôt qu’harmonisées silencieusement avec le texte principal.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le parallélisme hébreu et distingue « racheté » de « délivré ».
