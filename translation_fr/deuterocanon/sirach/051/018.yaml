    issue: « car je l’atteindrai » pour כִּי אֶמְצָאֶנּוּ
    rationale: Le verbe מצא signifie d’abord « trouver ». « Atteindre » explicite un sens possible, mais modifie l’image lexicale et tend à définir le référent comme un objectif. « Le trouverai » préserve mieux l’ambiguïté du texte hébreu.
  - severity: low
    issue: Rendu de ἐζήλωσα dans la note grecque
    rationale: « J’ai recherché avec ardeur » est possible, mais le grec exprime plus directement le zèle pour le bien. Une formulation plus proche évite d’introduire l’idée spécifique de recherche.
