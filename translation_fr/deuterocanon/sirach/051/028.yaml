  text: Many heard my instruction in my youth[b][a], and they acquired silver and gold by me.
translation:
  language: fr
  text: Beaucoup ont écouté mon enseignement dans ma jeunesse et, par mon intermédiaire,[a] ils ont acquis de l’argent et de l’or.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « grâce à moi ». L’hébreu porte littéralement une expression compacte pouvant aussi se rendre par « par moi » ou « en moi ».
    reason: lexical_alternative
  - marker: b
    text: 'Le grec présente une formulation différente : « Recevez l’instruction au prix d’une grande quantité d’argent et acquérez par elle beaucoup d’or. » L’hébreu est ici déclaratif, et non impératif.'
    reason: alternative_reading
lexical_decisions:
- source_word: רַבִּים
  choice: Beaucoup
  rationale: Rend directement l’adjectif substantivé hébreu, avec une formulation concise et naturelle.
- source_word: שָׁמְעוּ
  choice: ont écouté
  rationale: Dans un contexte d’enseignement, « écouter » exprime la réception attentive sans aller jusqu’au sens plus fort d’« obéir ».
- source_word: לִמּוּדִי
  choice: mon enseignement
  rationale: Rend le nom dérivé de למד dans son sens didactique, en français courant et digne.
- source_word: בִּנְעֻרוֹתָי
  choice: dans ma jeunesse
  rationale: Expression idiomatique qui désigne la période de la jeunesse.
- source_word: תִּקְנוּ
  choice: ils ont acquis
  rationale: Le verbe קנה signifie ici acquérir ou obtenir; l’indicatif suit la syntaxe déclarative du témoin hébreu.
- source_word: וְכֶסֶף וְזָהָב
  choice: de l’argent et de l’or
  rationale: Conserve les deux métaux précieux nommés par l’hébreu; ici « argent » garde naturellement son double sens de métal et de richesse.
- source_word: בִּי
  choice: grâce à moi
  rationale: La préposition compacte peut exprimer le moyen ou la médiation. Cette formulation est intelligible en français tout en laissant entendre que l’enseignement du locuteur a été le moyen de leur gain.
theological_decisions:
- issue: Rapport entre la formulation hébraïque et le parallèle grec
  choice: 'Suivre l’hébreu déclaratif: beaucoup ont écouté et ont acquis des richesses grâce au locuteur.'
  alternative: 'Suivre le grec impératif: « Recevez l’instruction au prix d’une grande quantité d’argent et acquérez par elle beaucoup d’or. »'
  rationale: Le témoin hébreu conservé est de haute confiance et présente clairement une déclaration, tandis que le grec transmet une formulation impérative sensiblement différente. La variante grecque est donc signalée sans remplacer le texte hébreu.
- issue: Sens de בִּי
  choice: « grâce à moi », avec une valeur médiatrice ou instrumentale
  alternative: « par moi » ou, plus littéralement mais obscurément, « en moi »
  rationale: La formulation choisie donne un sens naturel au français sans préciser au-delà du texte la manière exacte dont les auditeurs ont acquis l’argent et l’or.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation place la note lexicale immédiatement après l’expression concernée et la note textuelle à la fin du verset.
