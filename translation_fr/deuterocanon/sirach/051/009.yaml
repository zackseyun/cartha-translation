  text: And I raised my voice from the earth[b][a], and from the gates of Sheol I cried out.
translation:
  language: fr
  text: J’ai élevé ma voix depuis la terre[a], et depuis les portes du séjour des morts, j’ai crié au secours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « depuis le pays ». L’hébreu porte « depuis la terre/le pays », tandis que le grec a « sur la terre », ce qui témoigne d’une légère divergence entre les témoins.
    reason: textual_variant
lexical_decisions:
- source_word: וְאָרִים
  choice: J’ai élevé
  rationale: Le verbe רום exprime ici l’action d’élever, avec « ma voix » comme complément. « J’ai élevé ma voix » est à la fois direct, idiomatique et fidèle à l’image hébraïque.
- source_word: מֵאֶרֶץ
  choice: depuis la terre
  rationale: 'La préposition מִן indique naturellement la provenance : « depuis/de la terre ». « Depuis la terre » conserve le sens poétique large de אֶרֶץ, sans l’aligner sur la variante grecque « sur la terre ».'
- source_word: קוֹלִי
  choice: ma voix
  rationale: קוֹל signifie couramment « voix » ou « son ». « Ma voix » rend directement le terme et forme une expression française naturelle avec « élever ».
- source_word: וּמִּשַּׁעֲרֵי
  choice: et depuis les portes de
  rationale: שַׁעֲרֵי est le pluriel construit de « portes ». Le concret de la métaphore est conservé.
- source_word: שְׁאוֹל
  choice: le séjour des morts
  rationale: Cette expression française accessible désigne le domaine des morts sans le réduire à une tombe individuelle ni lui imposer une conception ultérieure de l’au-delà.
- source_word: שִׁוַּעְתִּי
  choice: j’ai crié
  rationale: Le verbe שוע désigne un cri de détresse, souvent lancé pour obtenir du secours. Le contexte porte cette nuance sans qu’il soit nécessaire d’ajouter en français un complément absent de l’hébreu.
theological_decisions:
- issue: Traduction de שְׁאוֹל
  choice: le séjour des morts
  alternative: le Shéol ; le monde des morts ; la tombe
  rationale: « Le séjour des morts » préserve la notion hébraïque d’un domaine des défunts tout en restant compréhensible en français moderne. Il évite d’identifier le terme à l’enfer ou à une doctrine ultérieure précise.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le parallélisme des deux propositions et les images concrètes de la voix élevée et des portes du séjour des morts sont maintenus.
