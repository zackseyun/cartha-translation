lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Marque la succession temporelle entre la prière évoquée auparavant et la réponse divine.
- source_word: שָׁמַע
  choice: entendit
  rationale: Rend le sens direct du verbe et maintient sa distinction avec וַיַּאֲזִין dans le second membre.
- source_word: קוֹלִי
  choice: ma voix
  rationale: Reproduit le sens littéral de l’hébreu tout en laissant ouverte la valeur idiomatique possible de « mon cri ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וַיַּאֲזִין
  choice: prêta attention à
  rationale: Exprime une écoute attentive et préserve la progression par rapport au simple fait d’entendre, dans un français actuel.
- source_word: תַּחֲנוּנָי
  choice: mes supplications
  rationale: Désigne des demandes pressantes de faveur ou de compassion et conserve le registre de la prière.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; la transcription conserve le nom propre sans le remplacer par un titre.
translation_notes:
  register: Français moderne, digne et accessible. La coordination conserve le parallélisme hébreu, tandis que « prêta attention » évite l’archaïsme de « prêta l’oreille ».
