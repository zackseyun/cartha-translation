translation:
  language: fr
  text: Alors Yahweh entendit ma voix[a] et prêta attention à mes supplications.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ma voix » ; l’expression peut aussi se comprendre, dans ce contexte, comme « mon cri ».'
