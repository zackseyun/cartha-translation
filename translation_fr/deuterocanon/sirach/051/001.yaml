base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/001.yaml
  text: I will praise you[a], God of my salvation; I will give thanks to you, God of my father. I will declare your name, the stronghold of my life[c][b], for you have redeemed my soul from death.
translation:
  language: fr
  text: Je te louerai[a], Dieu de mon salut ; je te rendrai grâce, Dieu de mon père. Je proclamerai ton nom, forteresse de ma vie[b], car tu as racheté mon âme[c] de la mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec présente un début différent : « Je te rendrai grâce, Seigneur Roi, et je te louerai, Dieu mon sauveur. »'
    reason: textual_variant
  - marker: b
    text: 'L’hébreu peut aussi se comprendre : « Je proclamerai ton nom comme la forteresse de ma vie » ou « ton nom est la forteresse de ma vie ».'
    reason: lexical_alternative
  - marker: c
    text: Le mot hébreu traduit par « âme » peut aussi désigner la vie ou la personne elle-même.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהַלְלֶךָּ
  choice: Je te louerai
  rationale: Le piel de הלל exprime couramment la louange. « Louer » est naturel en français actuel et maintient le parallélisme avec le verbe suivant sans les confondre.
- source_word: אֱלֹהֵי יִשְׁעִי
  choice: Dieu de mon salut
  rationale: Cette formulation reproduit directement la construction hébraïque et conserve sa résonance biblique sans archaïsme excessif.
- source_word: אוֹדְךָ
  choice: je te rendrai grâce
  rationale: Le hifil de ידה peut exprimer l’action de remercier, de célébrer ou de confesser. « Rendre grâce » distingue ce verbe de « louer » tout en convenant au registre de la prière.
- source_word: אֱלֹהֵי אָבִי
  choice: Dieu de mon père
  rationale: Le singulier אָבִי est explicite ; il ne convient donc pas de le généraliser en « mes pères » ou « mes ancêtres ».
- source_word: אֲסַפְּרָה
  choice: Je proclamerai
  rationale: Dans ce contexte de louange, ספר signifie raconter, faire connaître ou proclamer. « Proclamer » rend bien la dimension publique de l’énoncé.
- source_word: שִׁמְךָ
  choice: ton nom
  rationale: La traduction littérale préserve la portée poétique et théologique du nom divin sans en imposer une interprétation explicative.
- source_word: מָעוֹז חַיַּי
  choice: forteresse de ma vie
  rationale: מָעוֹז désigne un lieu fort, une forteresse ou un refuge. « Forteresse » maintient l’image concrète de protection, tandis que « de ma vie » suit la construction hébraïque.
- source_word: פָדִיתָ
  choice: tu as racheté
  rationale: פדה exprime le rachat ou la délivrance moyennant l’idée de libération. « Racheter » conserve cette richesse sémantique sans développer une doctrine ultérieure.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: נפש peut désigner l’âme, la vie ou la personne elle-même. « Mon âme » préserve ici la forme poétique de l’hébreu, tandis qu’une note signale l’autre sens possible.
theological_decisions:
- issue: Portée de פָדִיתָ dans une prière d’action de grâce
  choice: tu as racheté
  alternative: tu as délivré ; tu as libéré
  rationale: Le contexte évoque un sauvetage de la mort, mais le verbe hébreu porte aussi l’idée de rachat. La traduction retenue garde cette profondeur sans lui imposer un cadre doctrinal particulier.
- issue: Relation syntaxique entre שִׁמְךָ et מָעוֹז חַיַּי
  choice: ton nom, forteresse de ma vie
  alternative: ton nom comme forteresse de ma vie ; ton nom est la forteresse de ma vie
  rationale: L’hébreu permet de comprendre le second groupe comme une apposition, sans copule ni marque explicite de comparaison. La formulation française conserve cette densité et cette ambiguïté poétique.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme en deux mouvements et le parallélisme de la prière sont conservés. « Rendre grâce » maintient un registre cultuel courant, tandis que « forteresse » garde la vigueur de la métaphore hébraïque.
