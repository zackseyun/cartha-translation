  text: until he judges the case of his people and gladdens them with his mercy[a].
translation:
  language: fr
  text: jusqu’à ce qu’il juge la cause de son peuple et les réjouisse par sa miséricorde[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jusqu’à ce qu’il prononce le jugement de son peuple »; ou : « jusqu’à ce qu’il rende justice à son peuple ». L’expression grecque est formellement répétitive et peut être une tournure idiomatique pour le fait de rendre un jugement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως
  choice: jusqu’à ce que
  rationale: Introduit naturellement en français le terme temporel de l’action précédente et appelle le subjonctif.
- source_word: κρίνῃ τὴν κρίσιν
  choice: il rende jugement dans la cause
  rationale: Cette formulation française exprime l’acte judiciaire tout en laissant ouverte la nuance entre décision, jugement et justice rendue; elle évite une répétition grecque qui serait artificielle en français.
- source_word: τοῦ λαοῦ αὐτοῦ
  choice: de son peuple
  rationale: Conserve le génitif grec et ne tranche pas entièrement entre une cause concernant le peuple et une justice exercée en sa faveur.
- source_word: εὐφράνει αὐτούς
  choice: le réjouisse
  rationale: Le verbe grec est transitif et causatif. Le singulier collectif « le » reprend naturellement « son peuple » en français.
- source_word: ἐν τῷ ἐλέει αὐτοῦ
  choice: par sa miséricorde
  rationale: « Par » rend clairement la valeur instrumentale probable de ἐν, dans un registre actuel et digne.
theological_decisions:
- issue: Sens de l’expression judiciaire κρίνῃ τὴν κρίσιν
  choice: rende jugement dans la cause de son peuple
  alternative: juge la cause de son peuple; rende justice à son peuple
  rationale: L’expression grecque est répétitive et peut désigner le règlement d’une cause ou l’exercice de la justice en faveur du peuple. Le texte principal garde une formulation judiciaire sans imposer la nuance de vindication.
translation_notes:
  register: Français international moderne, naturel et digne. Le vocabulaire judiciaire conserve l’ambiguïté du grec; « miséricorde » maintient la portée théologique traditionnelle de ἔλεος sans surcharge confessionnelle.
