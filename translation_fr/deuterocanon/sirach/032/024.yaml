base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/024.yaml
  text: He who keeps the law guards his life[a], and he who trusts in Yahweh will not be put to shame.
translation:
  language: fr
  text: Celui qui observe la Loi préserve sa vie[a], et celui qui met sa confiance dans le Seigneur ne sera pas couvert de honte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec diffère considérablement à cet endroit : « jusqu’à ce qu’il rétribue chacun selon ses actes, et les œuvres des humains selon leurs pensées ». Le texte principal suit ici le témoin hébreu conservé.'
    reason: textual_variant
lexical_decisions:
- source_word: נוצר
  choice: observe
  rationale: Le participe de נצר signifie garder, veiller sur ou observer. Avec תורה pour complément, « observe » exprime naturellement une fidélité attentive aux prescriptions.
- source_word: תורה
  choice: la Loi
  rationale: תורה peut désigner l’instruction ou l’enseignement, mais son association ici avec la confiance placée dans יהוה lui donne une portée religieuse et liée à l’alliance. « la Loi » est idiomatique en français biblique moderne, sans exclure entièrement la notion d’instruction.
- source_word: שומר נפשו
  choice: préserve sa vie
  rationale: נפש désigne ici la vie ou la personne, plutôt qu’une « âme » opposée au corps. « préserve sa vie » rend clairement l’idée de protection de soi, tout en évitant en français la répétition peu naturelle de deux verbes signifiant « garder ».
- source_word: ובוטח ביהוה
  choice: et celui qui met sa confiance dans le Seigneur
  rationale: La tournure participiale a une valeur générale. « met sa confiance » restitue le sens de בטח de façon naturelle et digne; יהוה est rendu selon la convention française « le Seigneur ».
- source_word: לא יבוש
  choice: ne sera pas couvert de honte
  rationale: בוש peut évoquer la honte ou la déconvenue résultant d’une confiance déçue. « ne sera pas couvert de honte » conserve l’idiome biblique et sa nuance résultative.
theological_decisions:
- issue: Rendu du tétragramme יהוה
  choice: le Seigneur
  alternative: Yahvé
  rationale: « le Seigneur » suit la tradition juive de lecture et son prolongement dans la Septante, tout en étant la forme biblique française la plus largement reçue.
- issue: Divergence majeure entre le témoin hébreu et le parallèle grec
  choice: Suivre dans le texte principal l’hébreu conservé et signaler le grec en note.
  alternative: 'Traduire le grec : « jusqu’à ce qu’il rende à chacun selon ses actions, et les œuvres des humains selon leurs pensées »'
  rationale: Le texte hébreu étant conservé avec un degré élevé de confiance, il constitue ici la source principale. Le grec transmet une sentence substantiellement différente; il convient donc de préserver cette tension textuelle en note plutôt que d’harmoniser les deux formes.
translation_notes:
  register: Français international moderne, clair et digne. La structure en deux propositions parallèles est conservée. La majuscule à « Loi » signale son sens religieux dans ce contexte; « le Seigneur » rend יהוה sans introduire une vocalisation confessionnellement marquée.
