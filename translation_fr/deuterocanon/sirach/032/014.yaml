  text: One who seeks what pleases God will accept instruction[a], and the one who seeks him early will receive an answer through his prayer.
translation:
  language: fr
  text: Celui qui recherche ce qui plaît à Dieu recevra l’instruction[a], et celui qui le cherche dès l’aurore obtiendra une réponse dans sa prière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La tradition grecque porte : « N’offre pas de présents corrupteurs, car il ne les acceptera pas. » Le témoin hébreu conservé diffère ici considérablement du grec.'
    reason: textual_variant
lexical_decisions:
- source_word: דורש חפצי אל
  choice: Celui qui recherche ce qui plaît à Dieu
  rationale: Le participe דורש exprime une recherche suivie, tandis que l’expression condensée חפצי אל désigne ce que Dieu désire ou agrée. Cette formulation est naturelle en français tout en évitant de préciser davantage la nature de la volonté divine.
- source_word: יקח לקח
  choice: recevra l’instruction
  rationale: L’expression signifie littéralement « prendre un enseignement ». « Recevoir l’instruction » convient au registre sapientiel et conserve l’idée d’accueil sans transformer explicitement l’instruction en correction.
- source_word: ומשחרהו
  choice: et celui qui le cherche dès l’aurore
  rationale: Le verbe שחר peut évoquer une recherche matinale et, par extension, empressée. « Dès l’aurore » préserve l’image temporelle du texte hébreu; le pronom renvoie vraisemblablement à Dieu.
- source_word: ישיג מענה
  choice: obtiendra une réponse
  rationale: ישיג indique le fait d’atteindre ou d’obtenir, et מענה une réponse. La formulation française est directe et idiomatique.
- source_word: ויענהו בתפלתו
  choice: dans sa prière
  rationale: La préposition ב peut indiquer le cadre ou le moyen. « Dans sa prière » conserve cette souplesse, sans décider si la prière est le moyen de la réponse ou le lieu où elle est reçue.
- source_word: μὴ δωροκόπει, οὐ γὰρ προσδέξεται
  choice: non retenu dans le texte principal
  rationale: 'Le grec porte une leçon très différente: « N’offre pas de présents corrupteurs, car il ne les acceptera pas. » Le témoin hébreu étant disponible et prioritaire, il régit le texte principal; la variante grecque est signalée en note.'
theological_decisions:
- issue: Divergence majeure entre les traditions textuelles hébraïque et grecque
  choice: Traduire le témoin hébreu dans le texte principal et signaler la leçon grecque en note.
  alternative: 'Suivre le grec: « N’offre pas de présents corrupteurs, car il ne les acceptera pas. »'
  rationale: Les deux traditions produisent des sens entièrement différents. La priorité donnée ici à l’hébreu ne permet pas d’effacer l’importante variante grecque, qui doit rester visible au lecteur.
- issue: Rapport entre la réponse et la prière
  choice: « dans sa prière »
  alternative: « par sa prière » ou « grâce à sa prière »
  rationale: L’hébreu permet une nuance de cadre comme de moyen. La traduction retenue évite d’affirmer un mécanisme théologique plus précis que le texte.
translation_notes:
  register: Français moderne, international et digne, avec un rythme sapientiel clair. « Dès l’aurore » conserve l’image hébraïque tout en restant compréhensible; « Dieu » explicite אל sans coloration confessionnelle.
