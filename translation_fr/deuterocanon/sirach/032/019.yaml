lexical_decisions:
- source_word: בלא עצה
  choice: sans avoir pris conseil
  rationale: La locution signifie « sans conseil, sans avis ». Cette formulation française naturelle conserve le registre sapientiel et peut évoquer aussi bien l’avis reçu que la réflexion préalable.
- source_word: אל תפעל דבר
  choice: ne fais rien
  rationale: Dans cette interdiction, דבר a une portée indéfinie (« quoi que ce soit »). « Ne fais rien » rend clairement et naturellement l’étendue générale du commandement.
- source_word: ואחר מעשיך
  choice: après avoir agi
  rationale: Littéralement, « après tes actes ». La tournure verbale française restitue naturellement la succession entre l’action et la réaction émotionnelle qui la suit.
- source_word: אל תתקצף
  choice: ne t’en tourmente pas
  rationale: La forme verbale issue de קצף peut exprimer le fait de s’irriter, de se vexer ou de s’agiter intérieurement. Dans ce contexte de sagesse pratique, « ne t’en tourmente pas » conserve l’idée de trouble après l’action sans la réduire exclusivement au regret.
