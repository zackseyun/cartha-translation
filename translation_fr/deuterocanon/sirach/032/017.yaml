base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/017.yaml
  text: A wise man will incline himself to reproof[a], but one who is deceived will follow his own desire. A wise man will not conceal anger, but a scoffer will not guard his tongue.
translation:
  language: fr
  text: L’homme sage se tourne vers les réprimandes[a], mais celui qui se laisse tromper est entraîné par son propre désir. L’homme sage ne dissimule pas sa colère, mais le moqueur ne veille pas sur sa langue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin grec porte : « Il ne négligera pas la supplication de l’orphelin, ni la veuve lorsqu’elle répand sa plainte. » Le témoin hébreu conservé ici diffère considérablement du grec pour ce verset.'
    reason: alternative_reading
lexical_decisions:
- source_word: איש חכם
  choice: l’homme sage
  rationale: Le masculin singulier proverbial de l’hébreu est conservé dans une formulation française naturelle et traditionnelle du genre sapientiel.
- source_word: יטה תוכחות
  choice: se laisse incliner par les réprimandes
  rationale: Cette formulation garde l’image du verbe « incliner » tout en faisant comprendre que le sage accueille les avertissements correctifs; le pluriel hébreu est conservé.
- source_word: נפתה
  choice: celui qui se laisse séduire
  rationale: Le terme désigne quelqu’un qui se laisse tromper ou entraîner. Cette traduction préserve sa vulnérabilité sans lui imposer une catégorie technique comme « simple ».
- source_word: ואחר צרכו ימשך
  choice: est entraîné par son propre désir
  rationale: Le verbe exprime le fait d’être tiré ou entraîné à la suite de quelque chose, tandis que צרכו peut désigner son besoin, son intérêt ou son désir. « Son propre désir » rend naturellement le contraste tout en maintenant l’ambiguïté relative du nom.
- source_word: לא יכסה כחמה
  choice: ne dissimule pas sa colère
  rationale: Traduction directe du texte hébreu transmis, dont le sens précis demeure difficile. Elle évite de décider si cette colère est juste ou si son absence de dissimulation est approuvée.
- source_word: לץ
  choice: le moqueur
  rationale: Terme courant, clair et digne pour la figure sapientielle insolente qui tourne autrui en dérision.
- source_word: לא ישמר לשונו
  choice: ne veille pas sur sa langue
  rationale: L’expression conserve l’image hébraïque de la surveillance de la langue et se comprend naturellement comme l’absence de maîtrise de la parole.
theological_decisions:
- issue: Divergence substantielle entre les témoins hébreu et grec
  choice: Le corps du texte traduit les deux propositions conservées par le témoin hébreu.
  alternative: 'Le grec porte : « Il ne négligera pas la supplication de l’orphelin, ni la veuve lorsqu’elle répand sa plainte. »'
  rationale: Lorsque le texte hébreu du Siracide est conservé avec une forte confiance, il sert de texte principal. La leçon grecque étant entièrement différente plutôt qu’une simple variante lexicale, elle est signalée en note sans être fusionnée avec l’hébreu.
- issue: Portée morale de לא יכסה כחמה
  choice: Traduire littéralement « ne dissimule pas sa colère » sans expliquer ou approuver cette conduite.
  alternative: Expliciter une « juste colère » ou comprendre que le sage ne refoule pas une réaction légitime.
  rationale: Le texte transmis est difficile et n’indique pas explicitement que la colère est juste. Une explicitation résoudrait indûment la tension théologique et morale.
translation_notes:
  register: Français international moderne, digne et accessible, avec une légère coloration proverbiale. Le masculin singulier de l’hébreu est maintenu. Les métaphores de l’inclination et de la garde de la langue sont conservées, tandis que la syntaxe reste naturelle.
