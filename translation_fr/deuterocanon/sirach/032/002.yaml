translation:
  language: fr
  text: afin que tu te réjouisses de leur honneur et que tu reçoives une récompense pour ton enseignement[b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec donne ici un texte très différent : « Celui qui observe les commandements offre un sacrifice de communion. » Le texte principal suit le témoin hébreu conservé.'
    reason: alternative_reading
  - marker: b
    text: Ou « discipline », « correction » ou « bon ordre ». Le mot hébreu מוסר possède plusieurs sens liés à la sagesse.
    reason: lexical_alternative
lexical_decisions:
- source_word: למען
  choice: afin que
  rationale: Introduit naturellement en français une nuance de but ou de résultat.
- source_word: תשמח
  choice: tu te réjouisses
  rationale: Rend directement l’idée de joie exprimée par שמח, dans un registre digne et courant.
- source_word: בכבודם
  choice: de leur honneur
  rationale: Conserve la concision et l’ambiguïté de l’hébreu quant à savoir s’il s’agit de l’honneur qu’ils possèdent ou de celui qui leur est rendu.
- source_word: ועל
  choice: et ... pour
  rationale: Exprime le lien entre la conduite évoquée et la récompense, sans alourdir la phrase.
- source_word: מוסר
  choice: enseignement
  rationale: מוסר peut désigner l’instruction, la discipline ou la correction. « enseignement » convient au registre sapientiel tout en évitant une nuance inutilement punitive.
- source_word: תשא
  choice: tu reçoives
  rationale: Avec שכר, le verbe נשא a ici le sens idiomatique d’obtenir ou de recevoir une récompense.
- source_word: שכר
  choice: une récompense
  rationale: Correspond au sens de rétribution ou de récompense dans un contexte sapientiel, sans la coloration commerciale de « salaire ».
theological_decisions:
- issue: Priorité du témoin hébreu malgré la divergence du grec
  choice: Traduire directement la ligne hébraïque conservée et signaler la lecture grecque en note.
  alternative: 'Suivre le grec : « Celui qui observe les commandements offre un sacrifice de communion. »'
  rationale: Le texte hébreu est conservé avec une confiance élevée et constitue ici la source principale. Le parallèle grec diffère profondément et ne doit donc pas remplacer ni harmoniser le texte hébreu.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète les formes verbales hébraïques. La tournure « de leur honneur » préserve l’ambiguïté du rapport exprimé par la préposition hébraïque.
