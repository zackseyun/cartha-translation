review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend bien la séquence principale de l’hébreu : se montrer comme les autres, veiller aux convives, puis s’installer après les préparatifs. Toutefois, elle réduit la proposition initiale placée entre crochets à une formulation issue de la piste anglaise (« Si l’on t’a choisi comme chef ») et omet la seconde interdiction du témoin hébreu (« parmi les grands, ne t’assieds pas à la tête / à la première place »). Il convient de conserver cette donnée textuelle, tout en signalant son statut incertain. La note actuelle affirme en outre, à tort au regard du parallèle grec fourni, que le grec soutient le cadre du repas : ce parallèle porte ici une maxime différente sur la Loi et les offrandes.'
  naturalness: Le français est globalement clair et moderne. « Allonge-toi à table » est compréhensible et la note culturelle l’éclaire. « Ne t’élève pas au-dessus des autres » est plus explicatif que le verbe hébreu ; « ne te mets pas en avant » convient plus naturellement au contexte social sans imposer une interprétation doctrinale. « Ne prends pas la première place » rend idiomatiquement l’interdiction de se placer à la tête parmi les grands.
  terminology: « Assemblée » traduit prudemment le groupe réuni sans imposer « maître du banquet ». « Prends soin d’eux » conserve la portée à la fois pratique et relationnelle de דאג להם. La difficulté de הכן מרכם doit rester signalée. Les termes liés au repas antique sont maintenus sans archaïsme.
  issues:
  - severity: high
    issue: Omission de la seconde partie de l’ouverture hébraïque entre crochets
    rationale: Le témoin hébreu cité contient non seulement l’idée de ne pas se hausser, mais aussi « parmi les grands, ne t’assieds pas à la tête ». Le texte français actuel ne la rend pas ; « au-dessus des autres » ne représente pas de manière suffisante cette interdiction concrète de préséance.
  - severity: high
    issue: Note textuelle inexacte sur le parallèle grec
    rationale: 'Le grec fourni pour Siracide 32:1 dit : « Celui qui observe la Loi multiplie les offrandes », et non une instruction relative à un repas. La note ne doit donc pas prétendre que le grec reflète ici le cadre du banquet.'
  - severity: low
    issue: « Si l’on t’a choisi comme chef » présente comme assuré un développement interprétatif de l’incipit difficile
    rationale: La formulation est possible, mais le syntagme hébreu est bref et l’incipit est explicitement entre crochets. Une traduction plus proche, avec une note qui expose l’incertitude et la divergence grecque, est préférable.
  revised_text: '[À la tête d’une assemblée, ne te mets pas en avant ; parmi les grands, ne prends pas la première place.][a] Sois avec eux comme l’un d’eux. Prends soin d’eux[b], puis allonge-toi à table[c] ; prépare ce qui est nécessaire[d], puis installe-toi.'
  revised_footnotes:
  - marker: a
    text: 'Cette ouverture est placée entre crochets dans l’édition de Kahana : son texte hébreu est difficile et sa relation avec la suite n’est pas certaine. Elle comprend aussi l’interdiction de prendre la première place parmi les grands. À cette référence, la tradition grecque fournie porte une maxime différente sur l’observance de la Loi et les offrandes.'
    reason: textual_variant
  - marker: b
    text: 'Ou : « Occupe-toi d’eux. » Le verbe hébreu peut exprimer aussi bien la sollicitude que l’attention pratique.'
    reason: lexical_alternative
  - marker: c
    text: Lors des repas formels de l’Antiquité, on mangeait souvent en position allongée.
    reason: cultural_note
  - marker: d
    text: Le texte hébreu de cette expression est difficile ; il semble désigner les préparatifs nécessaires pour les convives ou pour le repas.
    reason: textual_difficulty
  revision_rationale: La révision rend intégralement l’incipit entre crochets du témoin hébreu, en préservant visiblement son statut textuel incertain. Elle corrige la note relative au grec afin qu’elle corresponde au parallèle effectivement fourni, sans tenter d’harmoniser des traditions divergentes. Le reste conserve le registre moderne, le tutoiement et l’ambiguïté de l’expression difficile concernant les préparatifs.
