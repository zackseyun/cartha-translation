base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/001.yaml
  text: If they have made you the leader[a], do not exalt yourself; be among them like one of them. Care for them, and then recline; prepare what is needed[c][b], and then take your place.
translation:
  language: fr
  text: Si l’on t’a choisi comme chef[a], ne t’élève pas au-dessus des autres. Sois parmi eux comme l’un d’eux. Prends soin d’eux[b], puis allonge-toi à table[c] ; prépare ce qui est nécessaire[d], puis prends ta place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La proposition d’ouverture du témoin hébreu est placée entre crochets dans l’édition de Kahana : « Si l’on t’a choisi comme chef, ne t’élève pas au-dessus des autres. » Les lignes qui suivent appuient fortement ce cadre où quelqu’un préside un repas, même si la tradition grecque diffère sensiblement dans sa formulation.'
    reason: textual_variant
  - marker: b
    text: 'Ou : « Occupe-toi d’eux. » Le verbe hébreu peut exprimer aussi bien la sollicitude que l’attention pratique.'
    reason: lexical_alternative
  - marker: c
    text: Lors des repas formels de l’Antiquité, on mangeait souvent en position allongée.
    reason: cultural_note
  - marker: d
    text: Le texte hébreu de cette expression est difficile ; il semble désigner les préparatifs nécessaires pour les convives ou pour le repas.
    reason: textual_difficulty
lexical_decisions:
- source_word: ראש נבחרת
  choice: choisi comme chef
  rationale: Le groupe nominal désigne la personne placée à la tête d’un groupe choisi ou réuni. Dans ce contexte de repas, « choisi comme chef » exprime naturellement la désignation et la fonction sans préciser excessivement « maître du banquet ».
- source_word: אל תתרומם
  choice: ne t’élève pas au-dessus des autres
  rationale: La forme réfléchie évoque le fait de s’élever soi-même. L’ajout idiomatique « au-dessus des autres » rend clairement en français l’idée d’orgueil social impliquée par le contexte.
- source_word: היה להם כאחד מהם
  choice: Sois parmi eux comme l’un d’eux
  rationale: Cette formulation conserve la solidarité et l’humilité demandées au responsable tout en restant naturelle en français moderne.
- source_word: דאג להם
  choice: Prends soin d’eux
  rationale: Le verbe peut exprimer aussi bien la sollicitude que l’attention pratique. Dans le cadre d’un repas, cette traduction englobe le souci des convives et le service qui leur est dû.
- source_word: תסב
  choice: allonge-toi à table
  rationale: Le verbe renvoie à la position allongée adoptée lors des repas formels de l’Antiquité. Cette expression est plus intelligible en français courant que le seul verbe « étends-toi ».
- source_word: הכן מרכם
  choice: prépare ce qui est nécessaire
  rationale: Le texte transmis est difficile. Le contexte indique vraisemblablement les préparatifs nécessaires pour les convives ou le repas ; une formulation générale évite une précision injustifiée.
- source_word: תרבץ
  choice: prends ta place
  rationale: Le verbe peut désigner le fait de se coucher ou de s’installer. « Prends ta place » rend naturellement l’aboutissement de la séquence après les préparatifs, sans répéter la formulation précédente.
