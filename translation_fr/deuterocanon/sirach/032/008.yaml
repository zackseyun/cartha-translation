  text: Speak briefly[a], though you know much, and be like one who knows and keeps silent.
translation:
  language: fr
  text: Parle peu[a], même si tu sais beaucoup, et sois comme quelqu’un qui sait et garde le silence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est très condensé et elliptique. Le premier membre juxtapose des termes correspondant à « parler », « peu » et « beaucoup »; la traduction explicite le sens probable : parler peu, même lorsqu’on sait beaucoup. Le texte grec fourni pour ce numéro de verset ne correspond pas à cette ligne hébraïque; la traduction suit donc ici le témoin hébreu.'
    reason: textual_variant
lexical_decisions:
- source_word: כל לאמר
  choice: Résume ton propos
  rationale: L’expression hébraïque est très condensée. Dans ce contexte sapientiel, elle appelle à ramener la parole à l’essentiel plutôt qu’à « tout dire ». « Résume ton propos » restitue naturellement cette exhortation en français.
- source_word: ומעט הרבה
  choice: dis beaucoup en peu de mots
  rationale: La construction elliptique juxtapose « peu » et « beaucoup ». Le sens probable est d’exprimer beaucoup de contenu avec peu de paroles; le verbe « dis » est explicité pour rendre la maxime intelligible.
- source_word: ודמה ליודע
  choice: sois comme quelqu’un qui sait
  rationale: דמה suivi de ל exprime ici la ressemblance. La tournure française conserve la forme exhortative et le participe « celui qui sait ».
- source_word: ומחריש יחדו
  choice: tout en gardant le silence
  rationale: מחריש désigne celui qui se tait ou garde le silence, tandis que יחדו marque la simultanéité. « Tout en » rend cette association sans introduire une opposition absente du texte.
