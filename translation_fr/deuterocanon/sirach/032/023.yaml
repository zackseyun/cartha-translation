  text: In all your deeds guard yourself[b][a], for the one who does this keeps the commandment.
translation:
  language: fr
  text: Dans tout ce que tu fais, veille sur toi-même[a], car celui qui agit ainsi observe le commandement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « veille sur ton âme » ou « veille sur ta vie » ; le mot hébreu peut désigner la personne elle-même, l’âme ou la vie.
    reason: lexical_alternative
  - marker: b
    text: Ou « observe un commandement » ; le singulier « commandement » peut avoir ici une valeur générique.
    reason: lexical_alternative
lexical_decisions:
- source_word: בכל מעשיך
  choice: Dans tout ce que tu fais
  rationale: Cette formulation rend naturellement en français la portée globale de בְּכָל et le sens concret de מַעֲשֶׂיךָ, sans limiter l’exhortation à une catégorie particulière d’actes.
- source_word: שמור
  choice: veille sur
  rationale: L’impératif de שמר exprime ici une vigilance attentive. « Veille sur » convient à l’objet réfléchi et reste plus naturel que « garde » dans ce contexte.
- source_word: נפשך
  choice: toi-même
  rationale: נפש peut désigner la personne entière, la vie ou l’âme. Dans cette exhortation pratique, « toi-même » exprime clairement la vigilance portant sur toute la personne sans imposer une lecture dualiste.
- source_word: כי
  choice: car
  rationale: כי introduit la raison qui fonde l’exhortation ; « car » conserve le lien explicatif et le ton sapiential.
- source_word: עושה זה
  choice: celui qui agit ainsi
  rationale: Le participe suivi du démonstratif désigne de façon générale la personne qui met l’exhortation en pratique. « Agit ainsi » est idiomatique et reprend le champ lexical des actes.
- source_word: שומר מצוה
  choice: observe le commandement
  rationale: En français, « observer le commandement » exprime naturellement l’idée de garder fidèlement une prescription. Le singulier hébreu est conservé, tandis qu’une note signale sa possible valeur générique ou indéfinie.
theological_decisions:
- issue: Sens de נפש dans l’exhortation sapientiale
  choice: toi-même
  alternative: ton âme ; ta vie
  rationale: Le terme hébreu peut désigner l’être entier ou la vie, et pas seulement une composante immatérielle. Le contexte éthique favorise une exhortation à veiller sur toute sa personne et sa conduite.
- issue: Portée du singulier מצוה
  choice: le commandement
  alternative: un commandement ; les commandements pris collectivement
  rationale: Le singulier peut viser le commandement comme réalité générale, mais l’hébreu ne tranche pas entièrement entre une lecture définie et une lecture générique. La traduction principale suit la lecture sapientiale globale et la note préserve l’alternative.
- issue: Référence humaine générique de עושה זה
  choice: celui qui agit ainsi
  alternative: quiconque agit ainsi ; celui qui fait cela
  rationale: Le masculin singulier hébreu a ici une valeur représentative et générale. La formulation française demeure naturelle sans restreindre l’application du propos aux hommes.
translation_notes:
  register: Français international moderne, sobre et sapiential. Le tutoiement singulier correspond à l’adresse hébraïque. La formulation privilégie la clarté idiomatique tout en signalant les ambiguïtés de נפש et de מצוה. Le parallèle grec fourni ne correspond pas au contenu du verset hébreu et n’a donc pas été utilisé pour modifier la traduction.
