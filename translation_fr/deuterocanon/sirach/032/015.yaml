  yaml_path: translation/deuterocanon/sirach/032/015.yaml
  text: Whoever seeks the law will grasp it[b][a], but the one who plays the hypocrite will be caught by it.
translation:
  language: fr
  text: Celui qui cherche la Loi la saisira, mais celui qui joue l’hypocrite[a] sera pris au piège par elle.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu rendu par « celui qui joue l’hypocrite » est incertain ; il pourrait désigner « le simulateur », « celui qui s’illusionne lui-même » ou une personne pareillement insincère.
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec parallèle diffère considérablement : « Ne persiste pas dans un sacrifice injuste, car le Seigneur est juge, et auprès de lui il n’y a pas de partialité. » Les témoins hébreu et grec semblent refléter ici des formes différentes du texte.'
    reason: textual_variant
lexical_decisions:
- source_word: דורש
  choice: cherche
  rationale: Le participe de דרש exprime ici une recherche active et sincère. « Cherche » reste naturel et ne réduit pas le sens à l’étude formelle.
- source_word: תורה
  choice: la Loi
  rationale: Dans ce contexte sapientiel juif, תורה désigne vraisemblablement la Torah en tant qu’enseignement divin faisant autorité. « La Loi » en conserve la portée religieuse.
- source_word: יפיקנה
  choice: la saisira
  rationale: Le verbe הפיק peut évoquer le fait d’obtenir ou de faire sortir. Ici, « saisir » exprime l’appropriation réussie de la Loi, notamment de son sens, sans exclure la nuance d’acquisition.
- source_word: ומתלהלה
  choice: celui qui joue l’hypocrite
  rationale: Le terme hébreu est difficile. Cette formulation rend une attitude affectée ou insincère et maintient le contraste avec la recherche authentique de la Loi, tout en signalant l’incertitude en note.
- source_word: יוקש
  choice: sera pris au piège
  rationale: La forme passive signifie être pris ou enlacé dans un piège. Cette expression française est claire et conserve l’image de l’hébreu.
- source_word: בו
  choice: par elle
  rationale: 'Le suffixe peut être ambigu, mais son antécédent le plus naturel est תורה : la personne insincère est prise au piège par la Loi même qu’elle aborde faussement.'
theological_decisions:
- issue: Faut-il rendre תורה au sens large d’« enseignement » ou plus précisément par « la Loi » ?
  choice: la Loi
  alternative: l’enseignement
  rationale: Dans Ben Sira, תורה peut porter la force de la Torah comme enseignement divin normatif. La traduction retient cette portée sans ajouter de précision confessionnelle.
- issue: Comment rendre ומתלהלה malgré son sens incertain et la forte divergence du témoin grec ?
  choice: celui qui joue l’hypocrite
  alternative: le simulateur ; celui qui s’illusionne lui-même ; l’homme frivole
  rationale: Le texte hébreu extant demeure la source principale. Le choix exprime une posture insincère opposée à la recherche sincère, tandis qu’une note conserve explicitement l’incertitude lexicale.
- issue: À quoi renvoie le suffixe de בו ?
  choice: 'à la Loi : « par elle »'
  alternative: en elle ; par lui
  rationale: 'תורה est l’antécédent immédiat et ce renvoi préserve le parallélisme antithétique : celui qui cherche la Loi la saisit, tandis que celui qui agit avec duplicité est pris au piège par elle.'
translation_notes:
  register: 'Français international moderne, naturel et digne. La structure antithétique concise de l’hébreu est conservée. Les marqueurs suivent leur point d’ancrage dans le texte : [a] après le terme lexicalement incertain et [b] à la fin de la première proposition pour signaler la variante textuelle portant sur l’ensemble du verset.'
