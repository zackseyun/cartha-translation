  text: Mercy is beautiful in the time of his distress[b][a], like rain clouds in a time without rain.
translation:
  language: fr
  text: La miséricorde est belle[a] au temps de la détresse d’un homme[b], comme des nuages de pluie en période sans pluie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « La miséricorde est appropriée au temps de la détresse d’un homme ». L’adjectif peut souligner la beauté, le caractère agréable ou l’à-propos.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « de sa détresse », avec en grec un pronom masculin singulier employé ici dans un sens représentatif.
    reason: cultural_note
lexical_decisions:
- source_word: ὡραῖον
  choice: belle
  rationale: L’adjectif exprime ici la beauté, le caractère agréable ou l’à-propos de la miséricorde. « Belle » conserve sa force imagée et évaluative sans réduire le sens à la seule convenance.
- source_word: ἔλεος
  choice: miséricorde
  rationale: Le terme désigne la compassion qui pousse à secourir. « Miséricorde » en garde le poids moral tout en restant naturel dans ce contexte sapientiel.
- source_word: ἐν καιρῷ
  choice: au temps de / en temps
  rationale: Cette tournure préserve l’accent temporel et la reprise de la même expression dans les deux membres du verset.
- source_word: θλίψεως
  choice: détresse
  rationale: Le mot peut évoquer la pression, l’affliction ou l’épreuve. « Détresse » est actuel, accessible et suffisamment large.
- source_word: αὐτοῦ
  choice: d’un homme
  rationale: Le grec porte un pronom masculin singulier employé de manière représentative. Cette formulation française évite que « sa détresse » paraisse renvoyer grammaticalement à « la miséricorde », tout en signalant le masculin du texte source.
- source_word: νεφέλαι ὑετοῦ
  choice: nuages de pluie
  rationale: Le génitif décrit des nuages associés à la pluie. « Nuages de pluie » restitue simplement et clairement l’image grecque.
- source_word: ἀβροχίας
  choice: temps sans pluie
  rationale: Le nom désigne l’absence de pluie. Cette formulation reste proche du grec et maintient le parallèle temporel, sans renforcer le sens jusqu’à une sécheresse nécessairement prolongée.
theological_decisions:
- issue: Masculin générique dans αὐτοῦ
  choice: « la détresse d’un homme » dans le texte principal
  alternative: « sa détresse » ou « la détresse d’une personne »
  rationale: Le grec emploie un masculin singulier représentatif. Le garder sous la forme « d’un homme » respecte cette donnée tout en évitant, en français, un rattachement ambigu du possessif au nom féminin « miséricorde ».
translation_notes:
  register: 'Français moderne, digne et accessible. La répétition « pluie… sans pluie » est volontaire : elle conserve le parallélisme et l’image saisissante du grec.'
