translation:
  language: fr
  text: Un homme sage n’accepte pas de pot-de-vin[c], mais un moqueur arrogant[a] n’observe pas la loi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu peut aussi être compris comme désignant deux personnes : « l’arrogant et le moqueur ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « l’enseignement ». Le mot hébreu תורה peut désigner plus largement un enseignement faisant autorité, et pas seulement une loi.'
    reason: lexical_alternative
  - marker: c
    text: Le texte grec parallèle transmis sous cette référence ne correspond pas à cette ligne hébraïque ; la traduction suit donc principalement le témoin hébreu conservé.
    reason: textual_variant
lexical_decisions:
- source_word: איש חכם
  choice: un homme sage
  rationale: L’hébreu est explicitement masculin singulier et formule une maxime; cette tournure le respecte tout en restant naturelle en français.
- source_word: לא יקח
  choice: n’accepte pas
  rationale: Dans cette maxime de sagesse, le yiqtol décrit une conduite caractéristique. « Accepter » convient idiomatiquement à un pot-de-vin.
- source_word: שחד
  choice: pot-de-vin
  rationale: C’est le terme français moderne et précis pour un avantage corrupteur.
- source_word: זד ולץ
  choice: l’insolent moqueur
  rationale: La juxtaposition sans conjonction peut caractériser une seule personne par deux termes. La traduction conserve l’orgueil présomptueux de זד et le mépris railleur de לץ; la lecture comme deux figures distinctes est signalée en note.
- source_word: לא ישמור
  choice: n’observe pas
  rationale: Avec תורה, שמר signifie couramment respecter ou mettre en pratique; « observer » est naturel dans ce contexte.
- source_word: תורה
  choice: la loi
  rationale: Le terme peut désigner la Loi ou, plus largement, un enseignement faisant autorité. « La loi » rend ici clairement la norme morale, sans effacer l’autre possibilité.
theological_decisions:
- issue: Sens de תורה dans un écrit de sagesse
  choice: la loi
  alternative: l’enseignement
  rationale: Le contexte oppose l’intégrité à la désobéissance envers une norme reconnue. « La loi » convient, mais תורה peut avoir un sens pédagogique plus large, conservé en note.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Pot-de-vin » est courant sans être familier; « insolent moqueur » conserve les deux qualifications hébraïques; « observer la loi » maintient un registre digne et naturel.
