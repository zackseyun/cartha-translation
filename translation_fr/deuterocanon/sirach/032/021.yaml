  text: Do not trust in a way of stumbling[b][a], and in your end be on guard.
translation:
  language: fr
  text: Ne te fie pas à un chemin où l’on trébuche[a], et à ta fin, reste sur tes gardes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le mot hébreu מחתף est difficile. Il semble désigner ce qui fait trébucher ou tomber; on pourrait aussi traduire : « un chemin glissant » ou « un sentier dangereux ».'
    reason: lexical_alternative
  - marker: b
