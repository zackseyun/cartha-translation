    reason: textual_variant
lexical_decisions:
- source_word: אל תבטח
  choice: Ne te fie pas
  rationale: בטח exprime le fait de se fier à quelque chose ou de mettre sa confiance en quelque chose. Cette formulation directe conserve la force de l’avertissement.
- source_word: בדרך
  choice: à un chemin
  rationale: דרך peut désigner une route concrète ou, par métaphore, une manière d’agir. « Chemin » préserve cette double portée.
- source_word: מחתף
  choice: où l’on trébuche
  rationale: Le terme est difficile, mais semble évoquer ce qui provoque un faux pas ou une chute. Cette traduction garde cette idée sans préciser abusivement s’il s’agit d’un chemin glissant, dangereux ou trompeur.
- source_word: ובאחריתך
  choice: jusqu’à ta fin
  rationale: אחריתך comporte le suffixe possessif « ta » et peut évoquer la fin, l’issue ou l’avenir d’une personne. « Jusqu’à ta fin » est naturel en français et maintient la portée personnelle de l’hébreu.
- source_word: השמר
  choice: veille sur toi
  rationale: L’impératif השמר appelle à se garder soi-même, à rester vigilant. « Veille sur toi » rend clairement sa valeur réfléchie.
