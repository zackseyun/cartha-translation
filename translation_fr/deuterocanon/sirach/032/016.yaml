translation:
  language: fr
  text: Celui qui craint Yahweh comprendra le jugement[a] et, dès l’aube[b], fera jaillir de son cœur des paroles de sagesse[c].[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les témoins hébreux varient : certains portent « comprendra le jugement », d’autres « comprendront son jugement ».'
    reason: alternative_reading
  - marker: b
    text: L’expression hébraïque traduite par « dès l’aube » est incertaine ; elle peut aussi évoquer le point du jour, le crépuscule ou le fait d’agir de bonne heure.
    reason: lexical_alternative
  - marker: c
    text: 'Un autre texte hébreu porte : « Ceux qui craignent Yahweh comprendront son jugement et, avec beaucoup de sagesse, feront sortir ce qui est dans leur cœur. »'
    reason: textual_variant
  - marker: d
    text: Le parallèle grec conservé présente ici une formulation très différente, ce qui indique une tradition textuelle divergente.
    reason: textual_variant
lexical_decisions:
- source_word: ירא יהוה / יראי יהוה
  choice: celui qui craint Yahweh
  rationale: Le premier témoin cité emploie le singulier, tandis que l’autre variante a le pluriel. Le singulier représentatif donne une phrase française cohérente sans masquer la variante, signalée en note.
- source_word: יבין / יבינו
  choice: comprendra
  rationale: Le verbe בין exprime ici le fait de comprendre ou de discerner. « Comprendra » est naturel et conserve le futur du premier témoin.
- source_word: משפט / משפטו
  choice: le jugement
  rationale: « Jugement » maintient l’amplitude de משפט sans le réduire à la seule justice abstraite. La lecture possessive « son jugement » est conservée en note.
- source_word: מנשף
  choice: dès l’aube
  rationale: נשף peut désigner l’aube ou le crépuscule, et la préposition peut suggérer le point de départ. « Dès l’aube » est idiomatique, tandis que l’incertitude lexicale est explicitée en note.
- source_word: יוציא / יוציאו
  choice: il tirera
  rationale: La forme causative évoque ce que l’on fait sortir. Avec « de son cœur », « tirera » conserve cette image de provenance intérieure dans un français naturel.
- source_word: תחבולום / ובחכמות רבות
  choice: des paroles de sagesse
  rationale: Les témoins présentent ici des formulations différentes, liées aux conseils avisés ou à une sagesse abondante. « Paroles de sagesse » rend naturellement l’idée de sagesse exprimée, sans imposer une catégorie technique.
- source_word: מלבם
  choice: de son cœur
  rationale: « Cœur » préserve l’anthropologie hébraïque. Le nombre est harmonisé avec le sujet singulier du texte principal; le pluriel du témoin variant demeure visible dans la note.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: La translittération rend explicitement le nom divin présent dans le texte hébreu, sans lui substituer un titre.
- issue: Choix du texte de base face au parallèle grec divergent
  choice: Traduire le texte hébreu conservé et signaler la divergence grecque
  alternative: Traduire le parallèle grec ou harmoniser les deux traditions
  rationale: Le texte hébreu est directement attesté ici. Le grec fourni correspond à une formulation tout autre et témoigne donc d’une tradition textuelle divergente plutôt que d’un équivalent à intégrer silencieusement.
- issue: Variation entre משפט et משפטו
  choice: le jugement dans le texte principal
  alternative: son jugement
  rationale: Le texte conserve une véritable variation entre une forme absolue et une forme munie d’un suffixe. La lecture sans possessif suit le premier témoin cité, et l’autre reste explicitement disponible en note.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde le vocabulaire sapientiel et l’image hébraïque du cœur. Les notes exposent les divergences des témoins plutôt que de les fondre silencieusement dans une lecture unique.
