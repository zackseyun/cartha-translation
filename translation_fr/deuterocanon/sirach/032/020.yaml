  text: Do not walk on a path full of obstacles[b][a], and do not stumble over the same hazard twice.
translation:
  language: fr
  text: Ne t’engage pas sur un chemin semé d’obstacles[a][b], et ne trébuche pas deux fois sur un obstacle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « un chemin de מוקשות ». Le terme peut désigner des pièges, des embûches ou des obstacles qui font trébucher; « semé d’obstacles » s’accorde avec l’image de la chute dans la suite du verset.
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec parallèle diffère profondément ici : « Celui qui sert avec bienveillance sera accueilli, et sa supplication parviendra jusqu’aux nuées. » Le texte principal suit le témoin hébreu conservé, qui constitue ici la source première.'
    reason: textual_variant
lexical_decisions:
- source_word: בדרך
  choice: sur un chemin
  rationale: דרך désigne un chemin ou une voie et conserve ici à la fois l’image concrète et sa portée morale.
- source_word: מוקשות
  choice: semé d’obstacles
  rationale: Le terme évoque ce qui prend au piège ou fait trébucher. « Semé d’obstacles » rend naturellement sa valeur plurielle sans limiter le sens à des pièges cachés.
- source_word: אל תלך
  choice: Ne t’engage pas
  rationale: הלך signifie marcher ou aller. En français, « s’engager sur un chemin » préserve l’image tout en exprimant clairement l’avertissement.
- source_word: ואל תתקל
  choice: et ne trébuche pas
  rationale: Dans ce contexte, la forme verbale désigne le fait d’achopper ou de trébucher; ce choix maintient le parallélisme avec les obstacles du premier membre.
- source_word: בנגף
  choice: sur un obstacle
  rationale: נגף peut évoquer un coup ou ce qui provoque une chute. « Obstacle » conserve la superposition des sens concret et figuré.
- source_word: פעמים
  choice: deux fois
  rationale: Le terme a ici son sens adverbial numérique ordinaire. Le texte hébreu ne précise pas explicitement qu’il s’agit du même obstacle.
