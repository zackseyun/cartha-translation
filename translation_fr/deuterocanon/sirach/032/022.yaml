base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/022.yaml
  text: Do not trust in the way of the wicked[a], and be careful in your paths. In all your ways guard yourself, for everyone who does these things keeps the commandment.
translation:
  language: fr
  text: Ne te fie pas à la voie des méchants et prends garde à tes sentiers.[a] Dans toutes tes voies, veille sur toi-même, car quiconque fait ces choses garde le commandement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le témoin hébreu édité par Kahana, cette première phrase se trouve avant le numéro du verset. Elle peut donc appartenir au passage voisin plutôt qu’au verset 22. Le texte grec parallèle de Siracide 32,22 est par ailleurs différent.
    reason: textual_variant
lexical_decisions:
- source_word: אל תבטח בדרך רשעים
  choice: Ne te fie pas au chemin des méchants
  rationale: « Se fier à » rend naturellement בטח, tandis que « chemin » conserve la métaphore hébraïque de la conduite.
- source_word: ובארחותיך הזהר
  choice: et sois vigilant sur tes sentiers
  rationale: « Sois vigilant » exprime l’avertissement réflexif de זהר; « sentiers » conserve l’image concrète de ארחות sans la confondre avec « voies » dans la phrase suivante.
- source_word: בכל דרכיך
  choice: Dans toutes tes voies
  rationale: Formulation proche de l’hébreu qui préserve la métaphore traditionnelle des orientations et conduites de la vie.
- source_word: שמור נפשך
  choice: veille sur toi-même
  rationale: נפש désigne ici la personne elle-même plutôt qu’une « âme » abstraite. Cette tournure rend l’exhortation pratique et réflexive.
- source_word: כי
  choice: car
  rationale: Introduit brièvement la raison donnée à l’exhortation.
- source_word: כל עושה אלה
  choice: quiconque fait ces choses
  rationale: Rend la portée générale du participe et conserve le pluriel démonstratif אלה.
- source_word: שומר מצוה
  choice: garde le commandement
  rationale: Conserve le singulier מצוה et l’image hébraïque de « garder », sans préciser qu’il s’agit de la Loi puisque le texte ne le dit pas explicitement.
theological_decisions:
- issue: Portée de מצוה dans ce contexte sapientiel
  choice: le commandement
  alternative: un commandement ; le commandement de la Loi
  rationale: Le singulier défini est conservé sans identifier explicitement le commandement à toute la Torah ni le réduire à un commandement indéterminé.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier suit les impératifs hébreux. Les métaphores du chemin, des sentiers et des voies sont maintenues, et la note signale sans la résoudre la difficulté de délimitation du verset.
