  source_fidelity: 'Le texte principal rend fidèlement les deux membres attestés dans le témoin hébreu de Kahana : « ne te fie pas à la voie des méchants » (אל תבטח בדרך רשעים), « prends garde à tes sentiers » (ובארחותיך הזהר), puis « dans toutes tes voies, veille sur toi-même » (בכל דרכיך שמור נפשך). « Le commandement » conserve le singulier défini de מצוה sans identifier indûment ce commandement à la Torah. La première proposition étant placée avant le numéro du verset dans ce témoin et ne correspondant pas au grec parallèle cité, son rattachement précis à 32,22 demeure incertain et doit être signalé sans être tranché.'
