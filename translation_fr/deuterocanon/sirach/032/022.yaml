  terminology: « Voie », « sentiers » et « voies » préservent volontairement les métaphores hébraïques. « Veille sur toi-même » évite de réduire נפש à une « âme » abstraite. « Garde le commandement » maintient l’idiome éthique de שומר מצוה et le singulier du texte.
