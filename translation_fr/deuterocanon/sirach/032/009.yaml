  text: Before hail, lightning flashes forth; and before a modest man, favor goes before him.
translation:
  language: fr
  text: Avant la grêle, l’éclair jaillit ; avant l’homme humble[b], la faveur se manifeste.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin grec donne ici un texte tout différent : « Le sacrifice d’un homme juste est agréé, et son souvenir ne sera pas oublié. » Il reflète probablement une autre tradition textuelle ou un autre alignement des versets.'
    reason: textual_variant
  - marker: b
    text: Ou « l’homme abaissé » ou « l’homme brisé ». Le terme hébreu peut désigner une personne humble ou une personne que l’on a abaissée.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: avant
  rationale: 'Le sens temporel ou séquentiel convient aux deux membres du proverbe : un phénomène en précède un autre.'
- source_word: בָרָד
  choice: la grêle
  rationale: Sens courant du nom dans cette image météorologique.
- source_word: יִנְצַח
  choice: jaillit / se manifeste
  rationale: Le verbe est difficile ici. Dans la structure parallèle introduite deux fois par לִפְנֵי, il semble évoquer ce qui paraît ou se montre en premier. Deux formulations françaises naturelles rendent cette même idée sans imposer le sens habituel « l’emporter ».
- source_word: בָּרָק
  choice: l’éclair
  rationale: Équivalent français courant, naturellement associé à la grêle.
- source_word: דַכָּא
  choice: l’homme humble
  rationale: Le terme peut désigner quelqu’un d’humble, d’abaissé ou de brisé. Dans ce proverbe de sagesse, « l’homme humble » conserve le singulier personnel et le sens éthique probable.
- source_word: חֵן
  choice: la faveur
  rationale: Dans un contexte social et sapientiel, le mot désigne couramment l’accueil favorable ou la faveur.
theological_decisions:
- issue: Choix entre le texte hébreu conservé et le parallèle grec divergent
  choice: Le texte principal traduit le proverbe hébreu.
  alternative: 'Le grec porte : « Le sacrifice d’un homme juste est agréé, et son souvenir ne sera pas oublié. »'
  rationale: L’hébreu conservé est ici le témoin principal. Le grec fourni correspond à une autre tradition textuelle ou à un autre alignement des versets ; il est donc signalé en note plutôt que substitué au texte hébreu.
- issue: Portée de דַכָּא
  choice: l’homme humble
  alternative: l’homme abaissé / l’homme brisé
  rationale: Le contexte favorise une qualité d’humilité, tout en maintenant en note l’éventail sémantique du terme hébreu.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le point-virgule met en valeur le parallélisme des deux membres. « Se manifeste » préserve prudemment le sens contextuel probable du verbe difficile sans ajouter un pronom absent de l’hébreu.
