  text: Like settings of gold and a seal of beryl[b][a], so is the sound of a psalm with the sweetness of new wine.
translation:
  language: fr
  text: Comme des montures d’or fin et un sceau de béryl[a], ainsi est le son d’un chant avec la douceur du vin nouveau[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un cachet d’émeraude ». L’identification de ברקת est incertaine ; « béryl » est un choix courant dans les travaux savants.
    reason: lexical_alternative
  - marker: b
    text: 'Le parallèle grec fourni pour ce verset dit : « Ne parais pas les mains vides devant le Seigneur. » Il reflète une autre tradition du verset ou une numérotation différente. Le texte principal suit le témoin hébreu conservé.'
    reason: textual_variant
lexical_decisions:
- source_word: מלואות פז
  choice: montures d’or fin
  rationale: פז désigne l’or fin, tandis que מלואות évoque ici, dans une image de joaillerie, des éléments qui enchâssent ou garnissent un objet précieux. « Montures d’or fin » rend cette image de façon concise sans préciser indûment la nature du bijou.
- source_word: חותם ברקת
  choice: un sceau de béryl
  rationale: חותם désigne un sceau ou un cachet. L’identification exacte de ברקת demeure incertaine; « béryl » est une identification savante courante qui conserve l’image lapidaire sans ajouter la notion de bague.
- source_word: קול מזמור
  choice: résonne un psaume
  rationale: קול est la voix ou le son, et מזמור un chant, souvent cultuel et musical. La formulation verbale « résonne un psaume » est naturelle en français et maintient la tonalité poétique et musicale.
- source_word: על נועם תירוש
  choice: avec la douceur du vin nouveau
  rationale: תירוש désigne le vin nouveau et נועם son agrément ou sa douceur. La préposition על est souple et difficile à fixer ici; « avec » préserve l’idée d’association ou d’accompagnement dans le cadre du banquet sans imposer une relation plus précise que l’hébreu.
theological_decisions:
- issue: Priorité du témoin hébreu sur le parallèle grec divergent
  choice: Traduire la ligne poétique hébraïque dans le texte principal.
  alternative: 'Suivre le grec : « Ne parais pas les mains vides devant le Seigneur. »'
  rationale: Le texte grec fourni ne correspond pas sémantiquement à l’hébreu et témoigne vraisemblablement d’une autre tradition textuelle ou d’une numérotation différente. Puisque l’hébreu est conservé ici avec une confiance élevée, il régit la traduction; la divergence grecque est néanmoins signalée en note.
translation_notes:
  register: Français international actuel, poétique et digne. La comparaison ornementale est conservée en tête de phrase; « ainsi résonne » évite une copule pesante tout en explicitant naturellement le parallélisme elliptique de l’hébreu. La valeur précise de על reste volontairement ouverte par « avec ».
