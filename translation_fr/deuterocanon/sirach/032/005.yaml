  text: Like a gold ornament set with onyx and sapphire[c][b][a], so are beautiful words at a banquet of wine.
translation:
  language: fr
  text: Comme une parure d’or ornée d’onyx[a] et de saphir[b], ainsi de belles paroles sont à leur place lors d’un banquet de vin.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification précise de la pierre hébraïque rendue par « onyx » est incertaine; d’autres pierres ont été proposées.
    reason: lexical_alternative
  - marker: b
    text: Dans les textes anciens, la pierre appelée « saphir » ne correspond pas nécessairement au saphir moderne; certains l’identifient au lapis-lazuli.
    reason: lexical_alternative
  - marker: c
    text: Le parallèle grec fourni pour ce verset ne correspond pas au texte hébreu cité ici et paraît refléter un autre alignement textuel.
    reason: textual_variant
lexical_decisions:
- source_word: כרביד
  choice: Comme une parure
  rationale: רביד désigne une parure, probablement portée au cou. « Parure » conserve l’image sans préciser abusivement s’il s’agit d’un collier ou d’une chaîne; le préfixe כ introduit la comparaison.
- source_word: נפך
  choice: onyx
  rationale: L’identification moderne de cette pierre est incertaine. « Onyx » reprend une identification traditionnelle recevable, tandis qu’une note maintient l’incertitude lexicale.
- source_word: ספיר
  choice: saphir
  rationale: « Saphir » est l’équivalent traditionnel de ספיר, bien que la pierre antique ait pu être du lapis-lazuli; cette réserve est signalée en note.
- source_word: כך נאים דברים יפים
  choice: ainsi de belles paroles embellissent
  rationale: נאים exprime ici la beauté ou l’heureuse convenance. La formulation française rend naturellement la comparaison esthétique entre la parure et les paroles, sans réduire celles-ci à de simples propos agréables.
- source_word: על משתה היין
  choice: un banquet où l’on sert du vin
  rationale: Cette expression désigne un repas festif caractérisé par le vin. La tournure choisie est claire et naturelle en français moderne, tout en conservant le cadre concret du banquet.
theological_decisions:
- issue: Alignement des témoins hébreu et grec
  choice: Traduire le témoin hébreu de Ben Sira fourni pour ce verset.
  alternative: Suivre le parallèle grec fourni, qui parle de se détourner du mal et de l’injustice.
  rationale: Le texte hébreu est cohérent et donné avec une confiance élevée, tandis que le grec fourni ne correspond pas à son contenu et semble relever d’un alignement différent. Il n’est donc pas utilisé pour remplacer l’hébreu.
translation_notes:
  register: Français international moderne, digne et imagé. « Parure » évite de surdéterminer la forme exacte de l’objet; « banquet où l’on sert du vin » restitue naturellement le cadre social sans archaïsme.
