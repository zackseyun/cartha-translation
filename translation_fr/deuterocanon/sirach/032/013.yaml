revisions:
- from: Pour tout cela, bénis celui qui t’a créé[a], lui qui te comble de sa bonté. Celui qui recherche Dieu[b] peut espérer sa faveur, mais celui qui se berce d’illusions[c] y sera pris au piège.
  to: Pour tout cela, bénis celui qui t’a créé[a], lui qui te comble de sa bonté. Celui qui recherche Dieu[b] espère obtenir sa faveur, mais celui qui se vante[c] y sera pris au piège.
  rationale: 'La révision resserre le texte sur les valeurs les plus directement attestées par l’hébreu : l’espérance est énoncée sans modalité ajoutée et le terme obscur מתלהלה est rendu par « celui qui se vante », sens lexicalement plus immédiat. Les interprétations concurrentes restent disponibles dans les notes. La note sur la version grecque est rendue plus littérale, sans harmonisation interprétative.'
