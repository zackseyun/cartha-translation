base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/013.yaml
  text: For all these things bless your Maker[a], who fills you with his goodness. He who seeks the law will obtain favor[c][b], but the hypocrite will be caught by it.
translation:
  language: fr
  text: Pour tout cela, bénis celui qui t’a créé[a], lui qui te comble de sa bonté. Celui qui recherche Dieu[b] espère obtenir sa faveur, mais celui qui se vante[c] y sera pris au piège.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin hébreu de ce passage diffère fortement du grec, qui porte : « Car le Seigneur est celui qui rend, et il te rendra au septuple. »'
    reason: textual_variant
  - marker: b
    text: L’hébreu de cette ligne est difficile. Le mot rendu par « Dieu » peut aussi être compris autrement ; selon une lecture contextuelle, il pourrait être question de rechercher la Loi ou l’instruction divine.
    reason: alternative_reading
  - marker: c
    text: Le terme hébreu est incertain. Il peut aussi désigner quelqu’un qui s’abuse lui-même ou qui agit avec fausseté.
    reason: lexical_alternative
lexical_decisions:
- source_word: ברך
  choice: bénis
  rationale: L’impératif appelle à bénir Dieu en réponse à ses bienfaits. « Bénis » conserve le registre biblique et la construction directe de l’hébreu.
- source_word: עושך
  choice: celui qui t’a créé
  rationale: Le participe avec suffixe signifie littéralement « celui qui t’a fait ». Cette formulation est naturelle en français moderne et garde la relation personnelle exprimée par l’hébreu.
- source_word: המרוך מטובתו
  choice: lui qui te comble de sa bonté
  rationale: La forme hébraïque est difficile, mais elle évoque un bienfait accordé avec abondance. « Te comble de sa bonté » exprime ce sens sans préciser indûment la nature du don.
- source_word: דורש אל
  choice: celui qui recherche Dieu
  rationale: Pris tel qu’il est transmis, אל peut désigner Dieu. Le choix suit donc directement le témoin hébreu, tout en signalant en note qu’une lecture liée à la Loi ou à l’instruction divine demeure possible.
- source_word: יקוה רצון
  choice: peut espérer sa faveur
  rationale: Le verbe קוה exprime l’attente ou l’espérance. « Peut espérer sa faveur » reste proche de l’hébreu et évite de transformer l’espérance en obtention certaine.
- source_word: מתלהלה
  choice: celui qui se berce d’illusions
  rationale: La forme est rare ou incertaine et semble désigner une personne qui s’égare elle-même, se montre vaine ou agit avec fausseté. Cette traduction conserve l’idée d’auto-illusion sans imposer la notion plus précise d’hypocrisie.
- source_word: יוקש בו
  choice: y sera pris au piège
  rationale: Le verbe renvoie à l’action d’être pris dans un piège. Le pronom adverbial « y » conserve la référence peu nette de בו au lieu de l’expliciter arbitrairement.
theological_decisions:
- issue: Choix entre le témoin hébreu et le parallèle grec fortement divergent
  choice: Traduire le témoin hébreu dans le texte principal et donner le grec en note
  alternative: 'Suivre uniquement le grec : « Car le Seigneur rend à chacun ce qui lui revient, et il te le rendra au septuple. »'
  rationale: Le texte hébreu conservé constitue ici la source principale du projet. Le grec représente toutefois une tradition textuelle matériellement différente qui doit être portée à la connaissance du lecteur.
- issue: Interprétation de אל dans דורש אל
  choice: Comprendre אל comme « Dieu »
  alternative: Comprendre la phrase comme une recherche de la Loi ou de l’instruction divine
  rationale: La graphie transmise permet directement le sens « Dieu ». Comme le passage est difficile et que la tradition parallèle ne confirme pas cette ligne, l’autre lecture est conservée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme proverbial et l’antithèse sont conservés. Les formulations évitent le jargon confessionnel et laissent visibles les incertitudes du texte hébreu.
