  text: Speak[a], elder, for it is fitting for you; but with sound understanding[b], and do not hinder song.
translation:
  language: fr
  text: Prends la parole, ancien, car cela te convient ; mais fais preuve de retenue et de discernement[a], et ne fais pas obstacle au chant.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est très concis. Il peut aussi se comprendre : « montre une réserve avisée » ou « sois modeste dans ta sagesse ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec diffère fortement : « Celui qui offre de la fleur de farine rend un bienfait. » Il témoigne ici d’une autre tradition textuelle.'
    reason: textual_variant
lexical_decisions:
- source_word: מלל
  choice: Prends la parole
  rationale: L’impératif signifie « parler ». Dans le cadre d’un banquet, « prends la parole » exprime naturellement l’invitation à s’adresser aux convives.
- source_word: שב
  choice: ancien
  rationale: Le terme désigne vraisemblablement un homme âgé auquel son âge confère une place d’honneur. « Ancien » conserve à la fois l’âge et la déférence du contexte.
- source_word: כי הוא לך
  choice: car cela te revient
  rationale: La formule indique que parler convient à la place ou au rôle du destinataire. « Cela te revient » préserve aussi la nuance possible de droit ou de prérogative.
- source_word: והצנא שכל
  choice: mais parle avec discernement
  rationale: La formulation hébraïque est concise et incertaine. Elle semble associer la retenue ou la mesure à l’intelligence pratique ; la traduction explicite l’action sous-entendue sans trancher davantage que nécessaire.
- source_word: ואל תמנע שיר
  choice: et n’interromps pas les chants
  rationale: מנע peut signifier empêcher, retenir ou entraver. Dans une scène de banquet, « n’interromps pas les chants » rend naturellement l’idée de ne pas faire obstacle au moment musical ; le pluriel français a ici une valeur collective.
theological_decisions:
- issue: Valeur sociale de שב dans le contexte d’un banquet de sagesse
  choice: ancien
  alternative: homme âgé
  rationale: « Ancien » garde la nuance honorifique probable sans faire du terme un titre institutionnel ou religieux.
- issue: Sens de la proposition compressée והצנא שכל
  choice: mais parle avec discernement
  alternative: et montre une réserve avisée
  rationale: Le texte permet plusieurs analyses autour de la retenue, de la modestie et du discernement. La traduction principale donne le sens contextuel probable, tandis que la note conserve l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme impératif convient à une instruction sapientiale donnée dans le cadre d’un banquet. « Ancien » est employé comme appellation respectueuse liée à l’âge, non comme titre ecclésiastique.
