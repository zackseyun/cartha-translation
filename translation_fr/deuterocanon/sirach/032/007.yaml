translation:
  language: fr
  text: Parle, jeune homme, si tu dois le faire, avec retenue[a], deux ou trois fois, si l’on t’interroge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu rendu par « avec retenue » est incertain; il peut aussi être compris comme « brièvement », « avec soin » ou « avec fermeté ». Le texte grec transmis pour ce verset diffère fortement du texte hébreu.
    reason: textual_variant
lexical_decisions:
- source_word: דבר
  choice: Parle
  rationale: L’impératif appelle directement le jeune homme à parler; « Parle » est simple, naturel et fidèle.
- source_word: נער
  choice: jeune homme
  rationale: Le nom hébreu est masculin singulier et désigne ici un jeune homme dans le cadre d’une assemblée.
- source_word: אם צריך אתה
  choice: si c’est nécessaire pour toi
  rationale: Cette formulation conserve l’idée de nécessité ainsi que la référence explicite à la personne interpellée, sans préciser davantage si la nécessité est objective ou ressentie par elle.
- source_word: בחזק
  choice: mais avec retenue
  rationale: Le terme est difficile dans ce passage. Le contexte recommande une parole mesurée; « avec retenue » exprime prudemment ce sens probable. « mais » rend naturelle en français la restriction contextuelle sans lui donner une portée absolue.
- source_word: פעמים ושלש
  choice: deux ou trois fois
  rationale: La formule signifie littéralement « deux fois et trois » et indique ici un nombre limité de prises de parole ou de réponses.
- source_word: אם ישאלך
  choice: si l’on t’interroge
  rationale: Le tour avec « on » rend naturellement en français le sujet non exprimé du verbe hébreu et conserve sa valeur conditionnelle.
