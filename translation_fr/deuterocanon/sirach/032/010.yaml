translation:
  language: fr
  text: Avant la grêle, l’éclair jaillit ; avant la honte, la faveur se manifeste[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « la grâce ». Le parallèle grec diffère nettement : « Avec un regard bienveillant, glorifie le Seigneur et ne réduis pas les prémices de tes mains. » Le texte principal suit ici le témoin hébreu conservé.'
    reason: Alternative lexicale pour חֵן et signalement de la lecture grecque substantiellement différente.
lexical_decisions:
- source_word: לִפְנֵי
  choice: avant
  rationale: Le sens temporel et séquentiel convient aux deux membres du parallélisme.
- source_word: בָרָד
  choice: la grêle
  rationale: Équivalent français courant du terme météorologique hébreu.
- source_word: יִנְצַח
  choice: jaillit / se manifeste
  rationale: Dans ce contexte, le verbe exprime vraisemblablement l’apparition préalable plutôt que la victoire. La variation française respecte les associations naturelles de chaque membre tout en conservant le même rapport d’antériorité.
- source_word: בָּרָק
  choice: l’éclair
  rationale: Traduction usuelle du terme hébreu, en rapport naturel avec la grêle.
- source_word: בוֹשׁ
  choice: la honte
  rationale: Rend directement le nom hébreu désignant la honte ou le déshonneur.
- source_word: חֵן
  choice: la faveur
  rationale: Le mot peut désigner la faveur, la grâce ou le charme. « Faveur » convient au caractère sapiential du verset sans lui imposer une portée théologique plus forte.
theological_decisions:
- issue: Traduction de חֵן dans un contexte sapiential
  choice: faveur
  alternative: grâce, charme
  rationale: Le contexte ne porte pas explicitement sur le salut. « Faveur » préserve le sens social et éthique possible, tandis que la note signale l’alternative « grâce ».
- issue: Écart substantiel du parallèle grec
  choice: suivre le témoin hébreu conservé
  alternative: « D’un œil généreux, glorifie le Seigneur et ne réduis pas les prémices offertes par tes mains. »
  rationale: La demande fournit un témoin hébreu de haute confiance et validé. Le grec représente ici une lecture nettement différente, qui doit être signalée sans remplacer silencieusement le texte hébreu.
translation_notes:
  register: Français international moderne, concis et proverbial. Le parallélisme des deux propositions est maintenu ; les verbes diffèrent légèrement pour rester naturels en français.
