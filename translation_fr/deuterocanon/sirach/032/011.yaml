lexical_decisions:
- source_word: בעת מפקד
  choice: Quand vient l’heure de partir
  rationale: Dans le contexte des règles de conduite à table, מפקד désigne ici le moment fixé pour prendre congé ; cette formulation française exprime naturellement cette valeur contextuelle.
- source_word: אל תתאחר
  choice: ne tarde pas
  rationale: Rend directement l’interdiction de s’attarder ou de différer son départ.
- source_word: פטר לביתך
  choice: rentre chez toi
  rationale: Le verbe פטר exprime ici le fait de se retirer ou de partir ; « rentre chez toi » est idiomatique en français dans ce contexte.
- source_word: ושלם רצון
  choice: et fais ce que tu désires
  rationale: Préserve la notion de désir ou de volonté portée par רצון, sans préciser un objet que l’hébreu ne nomme pas.
