translation:
  language: fr
  text: Comme un sceau sur une bourse d’or, tel est un chant de Dieu lors d’un banquet de vin[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un chant adressé à Dieu ». L’expression hébraïque est condensée et peut désigner un chant dirigé vers Dieu plutôt qu’un chant simplement associé à Dieu.'
    reason: lexical_alternative
  - marker: b
    text: Les lignes hébraïques qui précèdent cette comparaison dans l’unité du verset sont difficiles à établir en raison de leur transmission. Cette dernière ligne, plus claire, est traduite directement d’après l’hébreu conservé. Le texte grec transmis sous cette référence est très différent.
    reason: textual_variant
lexical_decisions:
- source_word: כחותם
  choice: Comme un sceau
  rationale: Le préfixe כ exprime la comparaison. « Sceau » rend חותם sans préciser indûment qu’il s’agit d’un cachet personnel.
- source_word: על כיס זהב
  choice: sur une bourse d’or
  rationale: כיס désigne une bourse, une poche ou un petit sac destiné notamment aux objets précieux; « bourse d’or » conserve l’image concrète dans un français naturel.
- source_word: שיר
  choice: un chant
  rationale: Le nom singulier désigne ici concrètement un chant; ce terme convient au registre sapientiel et au cadre du banquet.
- source_word: אל
  choice: adressé à Dieu
  rationale: Dans l’expression comprimée שיר אל, אל peut marquer l’orientation vers Dieu. Cette formulation française évite l’ambiguïté trompeuse de « chant de Dieu », tout en signalant en note l’autre relation possible.
- source_word: על משתה היין
  choice: lors d’un banquet où coule le vin
  rationale: משתה désigne un festin, souvent associé à la boisson, et היין précise le vin. La formulation explicite naturellement le cadre sans réduire la scène à une simple beuverie.
theological_decisions:
- issue: Relation exprimée par שיר אל entre le chant et Dieu
  choice: un chant adressé à Dieu
  alternative: un chant de Dieu; un chant consacré à Dieu
  rationale: L’hébreu est condensé et permet plusieurs nuances. Le texte principal retient la lecture directionnelle naturelle de אל, tandis que la note préserve l’ambiguïté sans imposer une conception liturgique particulière.
translation_notes:
  register: Français international moderne, clair et digne. « Bourse d’or » garde l’image proverbiale; « banquet où coule le vin » rend le cadre avec naturel. Les deux appels de note figurent dans le texte principal.
