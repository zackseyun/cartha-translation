  text: And fulfill your desire in the fear of God[a], and not with any lack.
translation:
  language: fr
  text: Et accomplis ton désir dans la crainte de Dieu[a], sans que rien ne manque.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit : « Donne au Très-Haut selon le don qu’il t’a fait, et d’un œil généreux selon ce que ta main trouve. » Le témoin grec présente une forme du verset substantiellement différente de l’hébreu conservé.'
    reason: alternative_reading
lexical_decisions:
- source_word: ושלם
  choice: Et satisfais
  rationale: Le verbe שלם, dans cette exhortation, exprime l’idée de mener à son plein accomplissement. Avec רצון, « satisfais » forme en français une expression naturelle sans effacer l’idée d’accomplissement.
- source_word: רצון
  choice: ton désir
  rationale: רצון peut désigner le désir, la volonté ou le bon plaisir. Le possessif n’est pas exprimé dans le syntagme hébreu isolé, mais il est naturellement impliqué par l’exhortation adressée à la deuxième personne.
- source_word: ביראת אל
  choice: dans la crainte de Dieu
  rationale: Cette formulation conserve l’image sapientielle de la crainte révérencielle de Dieu et laisse à la préposition ב sa valeur circonstancielle.
- source_word: אל
  choice: Dieu
  rationale: אל est ici une désignation divine courante, rendue clairement et naturellement par « Dieu ».
- source_word: ולא בחסר כל
  choice: sans que rien ne manque
  rationale: La clause hébraïque est concise et littéralement liée au manque ou à la déficience. Cette formulation française en restitue la portée générale sans lui imposer un objet absent du texte.
theological_decisions:
- issue: Rapport entre les témoins hébreu et grec dans une exhortation transmise sous deux formes très différentes
  choice: Suivre le texte hébreu conservé dans le corps du verset et signaler en note la forme grecque divergente.
  alternative: « Donne au Très-Haut selon le don qu’il t’a fait, et d’un œil généreux selon ce que ta main trouve. »
  rationale: Puisqu’un témoin hébreu de haute confiance est conservé, il doit fonder le texte principal. La version grecque témoigne ici d’une forme substantiellement différente qu’il ne convient ni d’harmoniser avec l’hébreu ni de taire.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « sans que rien ne manque » rend fluide la clause hébraïque comprimée, tandis que « dans la crainte de Dieu » conserve l’expression traditionnelle du langage sapientiel.
