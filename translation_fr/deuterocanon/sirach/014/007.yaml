  text: Even if he does good[a], he does it in forgetfulness, and in the end he reveals his evil.
translation:
  language: fr
  text: Même s’il fait le bien, il le fait dans l’oubli[a] et, à la fin, il révèle sa méchanceté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il le fait sans y penser » ou « il le fait comme si cela devait être oublié »; le grec dit littéralement « dans l’oubli ».
    reason: lexical_alternative
lexical_decisions:
- source_word: κἂν
  choice: Même si
  rationale: La contraction de καὶ ἐάν introduit ici une condition concessive; « même si » en rend naturellement la force.
- source_word: εὖ ποιῇ
  choice: il fait le bien
  rationale: L’expression εὖ ποιεῖν signifie faire le bien ou bien agir; « faire le bien » est clair, idiomatique et conserve la portée morale.
- source_word: ἐν λήθῃ
  choice: dans l’oubli
  rationale: Cette traduction formellement proche préserve l’étrangeté et l’ambiguïté de l’expression grecque, qui peut évoquer une action faite sans y penser, sans s’en souvenir ou comme destinée à être oubliée.
- source_word: ποιεῖ
  choice: il le fait
  rationale: Le pronom « le » reprend naturellement « le bien » tout en conservant la répétition du verbe ποιεῖν.
- source_word: ἐπʼ ἐσχάτων
  choice: à la fin
  rationale: L’expression a une valeur temporelle et signifie finalement ou au dernier moment; « à la fin » reste simple et proche du grec.
- source_word: ἐκφαίνει
  choice: il révèle
  rationale: Le verbe désigne l’action de faire paraître ou de mettre au jour; « révèle » convient à la manifestation finale du caractère mauvais.
- source_word: τὴν κακίαν αὐτοῦ
  choice: sa méchanceté
  rationale: κακία désigne ici la mauvaise disposition morale, la perversité ou la malveillance; « méchanceté » est naturel en français et moins maladroit que le calque « son mal ».
