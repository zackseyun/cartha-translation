  text: An evil eye is stingy over bread[b][a], and there is meanness at his table.
translation:
  language: fr
  text: L’homme à l’œil mauvais[a] est avare de pain, et sa table est peu garnie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « un œil mauvais ». En hébreu, cette expression désigne ici une disposition envieuse, avare ou réticente à donner; le grec va dans le même sens.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu de cette proposition est difficile et peut évoquer le trouble. Le grec parallèle comprend la phrase comme désignant une table insuffisamment pourvue.
    reason: alternative_reading
lexical_decisions:
- source_word: עַיִן רַע / ὀφθαλμὸς πονηρός
  choice: qui a l’œil mauvais
  rationale: L’expression hébraïque, confirmée par le parallèle grec, désigne une disposition envieuse, avare ou réticente à donner. La tournure française conserve l’image biblique tout en la rendant naturelle.
- source_word: תָּעִיט / φθονερὸς
  choice: lésine
  rationale: La forme hébraïque est difficile, mais le contexte et le grec indiquent une attitude avare ou envieuse à propos de la nourriture. « Lésine » exprime concrètement cette réticence à donner sans trancher entre avarice et envie.
- source_word: לָחֶם / ἄρτος
  choice: le pain
  rationale: L’hébreu et le grec nomment littéralement le pain, image concrète de la nourriture ordinaire; il n’est donc pas généralisé en « nourriture ».
- source_word: מְהוּמָה / ἐνλεπής
  choice: la mesquinerie règne
  rationale: Le mot hébreu est difficile dans ce passage. Le parallèle grec soutient l’idée d’une table pauvrement ou chichement pourvue. « La mesquinerie règne » restitue naturellement la portée morale et sociale du propos.
- source_word: שֻלְחָנוֹ / τῆς τραπέζης αὐτοῦ
  choice: à sa table
  rationale: Cette traduction directe conserve l’image de la table comme lieu où se manifestent la générosité et l’hospitalité.
