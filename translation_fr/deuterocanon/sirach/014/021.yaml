translation:
  language: fr
  text: Celui qui fixe son cœur sur ses voies et réfléchit à ses discernements[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec porte : « et comprendra ses choses cachées », ou « ses secrets ». L’hébreu dit littéralement : « ses compréhensions » ou « ses discernements » ; c’est lui que suit le texte principal.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַשָּׂם
  choice: Celui qui attache
  rationale: Le participe défini désigne « celui qui place ». Avec « son cœur à », « attache » exprime naturellement en français une attention intérieure résolue, sans perdre l’image hébraïque.
- source_word: עַל דְרָכֶיהַ לִבּוֹ
  choice: son cœur à ses voies
  rationale: Cette formulation conserve le « cœur », siège hébraïque de la pensée et de la volonté, ainsi que la personnification féminine de la Sagesse et l’image de ses voies.
- source_word: וּבִתְבוּנֹתֶיהַ
  choice: et … ses discernements
  rationale: Le pluriel תבונותיה désigne les compréhensions, les formes d’intelligence ou les discernements propres à la Sagesse. « Discernements » est intelligible et demeure plus proche de l’hébreu que la lecture grecque « secrets ».
- source_word: יִתְבּוֹנָן
  choice: médite
  rationale: La forme verbale exprime une réflexion attentive et soutenue. « Médite » convient au registre sapientiel tout en restant courant.
theological_decisions:
- issue: Personnification féminine de la Sagesse
  choice: ses voies … ses discernements
  alternative: ses voies … ce qu’elle fait comprendre
  rationale: Les suffixes féminins hébreux renvoient à la Sagesse personnifiée. Le français conserve cette référence sans la réduire à une abstraction impersonnelle.
- issue: Participant au masculin singulier
  choice: Celui qui attache son cœur
  alternative: Quiconque attache son cœur
  rationale: Le participe hébreu substantivé est au masculin singulier. « Celui qui » en rend directement la forme tout en restant naturel.
- issue: Écart entre l’hébreu et le parallèle grec
  choice: ses discernements
  alternative: ses secrets
  rationale: Le texte principal suit l’hébreu, témoin primaire de haute confiance. La nuance distincte du grec est signalée en note plutôt que fusionnée avec l’hébreu.
translation_notes:
  register: Français international moderne, sobre et sapientiel. La phrase conserve l’image du cœur, le parallélisme bref et la personnification féminine de la Sagesse.
