revisions:
- from: Il regarde par sa fenêtre[a] et, à ses portes, il tendra l’oreille.
  to: Celui qui regarde par sa fenêtre[a] et tendra l’oreille à ses ouvertures.
  rationale: La révision restitue la portée proverbiale du participe hébreu, harmonise la syntaxe française avec le futur de l’action d’écouter et précise l’image des ouvertures sans modifier le sens ni la personnification féminine.
  reviewer_model: gpt-5.6-terra
