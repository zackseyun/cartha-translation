translation:
  language: fr
  text: Celui qui regarde par sa fenêtre[a] et tendra l’oreille à ses ouvertures.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Celui qui épie par sa fenêtre ». Le verbe évoque un regard attentif à travers une ouverture.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׁקִיף
  choice: Il regarde
  rationale: Le participe de שׁקף décrit celui qui regarde avec attention à travers une ouverture. « Il regarde » reste naturel en français et s’inscrit dans la continuité du sujet du verset précédent.
- source_word: בְּעַד חֲלוֹנָה
  choice: par sa fenêtre
  rationale: בְּעַד a ici un sens spatial, « à travers ». « Par sa fenêtre » rend naturellement en français l’image d’un regard porté à travers l’ouverture; le possessif féminin conserve la personnification de la Sagesse.
- source_word: וְעַל פְּתָחֶיהָ
  choice: et, à ses portes
  rationale: Le texte hébreu emploie le pluriel פְּתָחֶיהָ, « ses ouvertures/portes ». Le pluriel est conservé plutôt que ramené au singulier, et « à » exprime la position auprès des entrées.
- source_word: יְצוֹתֵת
  choice: il tendra l’oreille
  rationale: Le verbe indique une écoute attentive, possiblement discrète ou furtive. « Tendre l’oreille » préserve cette intensité sans imposer le motif négatif que pourrait suggérer « espionner ».
theological_decisions:
- issue: Personnification féminine de la Sagesse
  choice: Conserver les possessifs féminins « sa » et « ses » renvoyant à la Sagesse
  alternative: Employer une formulation abstraite sans référence féminine
  rationale: Le contexte personnifie la Sagesse comme une femme associée à une maison. La référence féminine préserve cette image présente dans l’hébreu et confirmée par le grec.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme architectural est conservé; « tendre l’oreille » rend l’écoute intentionnelle dans une expression courante sans accent péjoratif excessif.
