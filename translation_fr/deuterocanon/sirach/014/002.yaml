  text: Blessed is the man whom his soul has not reproached[a], and whose hope has not ceased.
translation:
  language: fr
  text: Heureux l’homme à qui son âme n’a rien reproché[a], et dont l’espérance ne s’est pas éteinte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu conservé de cette proposition est difficile. Le grec parallèle porte : « que son âme n’a pas condamné »; on peut aussi comprendre : « à qui son âme n’a pas fait honte ».'
    reason: textual_variant
lexical_decisions:
- source_word: אַשְׁרֵי אִישׁ
  choice: Heureux l’homme
  rationale: La formule introduit une béatitude sapientielle. « Heureux » est naturel et digne en français biblique moderne, tandis que « l’homme » conserve le masculin singulier représentatif de l’hébreu.
- source_word: לֹא חִסַּדְתּוֹ נַפְשׁוֹ
  choice: à qui son âme n’a rien reproché
  rationale: Le texte hébreu conservé est difficile. « Son âme » maintient נַפְשׁוֹ sans le réduire à la seule conscience, et « n’a rien reproché » exprime naturellement le sens, éclairé par le grec κατέγνω, sans renforcer inutilement jusqu’à « condamné ».
- source_word: וְלֹא שָׁבְתָה תּוֹחַלְתּוֹ
  choice: dont l’espérance ne s’est pas éteinte
  rationale: שבת indique la cessation. En français, une espérance qui « ne s’est pas éteinte » rend cette idée de manière idiomatique et conserve la portée temporelle de la forme verbale; « espérance » correspond à תּוֹחֶלֶת et au grec ἐλπίς.
theological_decisions:
- issue: Interprétation de la première proposition hébraïque, textuellement difficile
  choice: « à qui son âme n’a rien reproché »
  alternative: « que son âme n’a pas condamné »
  rationale: L’hébreu demeure la base, mais sa forme transmise est difficile; le parallèle grec soutient nettement l’idée d’un jugement intérieur. « Reproché » préserve une certaine amplitude sémantique et évite de durcir le propos en condamnation formelle.
- issue: Valeur de l’espérance dans la seconde proposition
  choice: « ne s’est pas éteinte »
  alternative: « n’a pas cessé »
  rationale: Le rendu choisi ne précise ni l’objet ni le fondement de l’espérance et n’importe donc aucune lecture doctrinale; il exprime simplement sa non-cessation dans un français naturel.
translation_notes:
  register: Français international moderne, sobre et sapientiel. La structure en deux membres est conservée; le vocabulaire reste accessible tout en maintenant « âme » et « espérance », termes importants du texte source.
