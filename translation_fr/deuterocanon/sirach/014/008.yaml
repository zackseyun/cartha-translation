  text: Evil is the man with an envious eye[b][a], turning away his face and despising lives.
translation:
  language: fr
  text: 'Celui qui a le regard envieux[a] est mauvais : il détourne son visage et méprise autrui[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui a le mauvais œil ». L’expression grecque peut désigner une disposition envieuse ou mesquine.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des âmes » ou « des vies ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηρὸς
  choice: Mauvais
  rationale: L’adjectif attribut qualifie moralement la personne. « Mauvais » est ici naturel et fort sans suggérer seulement un comportement déplaisant.
- source_word: ὁ βασκαίνων ὀφθαλμῷ
  choice: celui dont le regard est envieux
  rationale: Cette formulation rend la disposition envieuse exprimée par l’idiome tout en conservant son image visuelle. La variante traditionnelle « mauvais œil » est signalée en note.
- source_word: ἀποστρέφων πρόσωπον
  choice: il détourne le visage
  rationale: La traduction conserve l’image corporelle concrète d’un refus ou d’un manque d’égards.
- source_word: ὑπερορῶν
  choice: méprise
  rationale: Le verbe exprime ici le dédain ou le fait de regarder autrui de haut; « méprise » rend directement sa portée morale.
- source_word: ψυχάς
  choice: des personnes
  rationale: Dans ce contexte, ψυχαί désigne vraisemblablement des êtres humains plutôt que des âmes au sens anthropologique technique. « Personnes » est idiomatique en français; les autres possibilités sont indiquées en note.
theological_decisions:
- issue: Sens de l’idiome βασκαίνων ὀφθαλμῷ
  choice: dont le regard est envieux
  alternative: qui a le mauvais œil
  rationale: Le contexte sapientiel favorise l’idée d’une disposition envieuse ou mesquine, mais l’expression grecque peut aussi évoquer l’idiome culturel du « mauvais œil »; cette ambiguïté est conservée en note.
- issue: Référent de ψυχάς
  choice: des personnes
  alternative: des âmes ou des vies
  rationale: « Personnes » évite d’imposer à ψυχή un sens théologique technique absent du contexte, tout en signalant en note la gamme lexicale du grec.
translation_notes:
  register: Français moderne, international et digne. La phrase garde la concision sentencieuse du grec, ses images du regard et du visage, ainsi que l’ambiguïté des deux expressions principales grâce aux notes.
