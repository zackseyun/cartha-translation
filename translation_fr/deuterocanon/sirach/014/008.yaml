  source_fidelity: 'Le sens global est fidèlement rendu : πονηρός qualifie moralement le sujet, βασκαίνων ὀφθαλμῷ exprime un regard/disposition envieuse, et les deux participes décrivent son comportement. La note a préserve correctement l''alternative idiomatique « mauvais œil ». ψυχάς peut désigner des personnes plutôt que des « âmes » au sens technique.'
  naturalness: '« Méprise des personnes » est peu idiomatique en français moderne : on méprise plutôt « autrui », « les autres » ou quelqu''un. « Il détourne son visage » est compréhensible mais le possessif est normalement requis en français dans ce contexte.'
  terminology: « Mauvais », « regard envieux » et « méprise » conviennent au registre sapientiel. « Autrui » rend naturellement le pluriel générique ψυχάς sans imposer une anthropologie particulière. Les alternatives « âmes » et « vies » restent utilement signalées.
