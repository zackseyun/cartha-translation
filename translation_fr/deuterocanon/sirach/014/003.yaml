  text: Wealth is not fitting for a small-hearted man, and riches are not fitting for a man with an evil eye.
translation:
  language: fr
  text: La richesse ne convient pas à l’homme mesquin[a], ni l’or à l’homme qui a le mauvais œil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à l’homme au petit cœur ». L’expression désigne ici une personne mesquine ou avare.'
    reason: Préserver l’image hébraïque tout en employant dans le texte une formulation française naturelle.
  - marker: b
    text: Dans cet idiome, avoir « le mauvais œil » signifie regarder ses biens ou ceux d’autrui avec avarice, cupidité ou envie.
    reason: Éviter que l’expression française soit comprise comme une allusion superstitieuse au mauvais œil.
lexical_decisions:
- source_word: לֵב קָטֹן
  choice: au cœur étroit
  rationale: Littéralement « petit de cœur ». Cette expression conserve l’image hébraïque tout en évoquant naturellement en français la mesquinerie ou l’avarice; le grec μικρολόγῳ confirme ce sens général.
- source_word: עֹשֶׁר
  choice: la richesse
  rationale: Équivalent direct et naturel du nom hébreu désignant la richesse.
- source_word: חָרוּץ
  choice: l’or
  rationale: Dans cet emploi nominal et poétique, חָרוּץ peut désigner l’or. Le parallèle grec généralise avec χρήματα, « biens, argent », mais la formulation hébraïque plus précise est retenue.
- source_word: רַע עַיִן
  choice: qui a le mauvais œil
  rationale: Conserve l’idiome hébreu plutôt que de le réduire à une seule interprétation; dans ce contexte, il caractérise surtout une personne avare, cupide ou envieuse.
theological_decisions:
- issue: Portée morale de « petit cœur » et « mauvais œil »
  choice: Conserver les deux images avec des notes explicatives
  alternative: Traduire directement par « homme mesquin » et « homme avare »
  rationale: Les images hébraïques portent une tension entre avarice, mesquinerie et envie. Une explicitation unique dans le corps du texte supprimerait cette richesse sémantique sans nécessité.
translation_notes:
  register: Français international moderne, sobre et sapiential. Le parallélisme de l’hébreu est préservé, tandis que « ni » évite une répétition lourde de « ne convient pas ».
