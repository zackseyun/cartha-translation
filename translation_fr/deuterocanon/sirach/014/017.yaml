review_pass:
  verdict: revise
  source_fidelity: 'Le premier membre rend fidèlement כל הבשר כבגד יבלה : « Toute chair » préserve l’idiome collectif, et « s’use comme un vêtement » restitue bien l’image. La coordination est également conservée. Dans le dernier membre, le texte hébreu est syntaxiquement abrupt (participe singulier גֹּוֵעַ suivi d’un imparfait pluriel יִגְוָעוּ). « Les mourants mourront » maintient la troisième personne, la répétition expressive et l’incertitude sans importer le « tu » du grec. « Loi éternelle » rend de façon sobre חוק עולם, tandis que la note situe correctement l’éclairage du parallèle grec.'
  naturalness: « Ceux qui expirent expireront » est grammatical, mais lourd et moins naturel en français contemporain, où « expirer » est plus soutenu et la relative produit une tautologie peu idiomatique. « Les mourants mourront » est plus direct, demeure volontairement frappant, et convient au registre sapientiel. « Loi éternelle » est plus idiomatique et plus précis que « loi de toujours ».
  terminology: « Toute chair », « vêtement » et « mourants » sont appropriés au français biblique international sans être archaïsants. « Loi éternelle » respecte le caractère fixe et durable de חוק עולם sans forcer une interprétation confessionnelle. La note ne présente pas le grec comme une correction certaine de l’hébreu, mais comme un éclairage interprétatif.
