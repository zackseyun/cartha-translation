translation:
  language: fr
  text: 'Toute chair s’use comme un vêtement, et c’est une loi éternelle : les mourants mourront.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est très concis et difficile : littéralement, quelque chose comme « expirant, ils expireront ». Le texte grec exprime le sens comme un décret immémorial de mort.'
    reason: Signaler une formulation hébraïque incertaine et l’apport interprétatif du parallèle grec.
lexical_decisions:
- source_word: כָּל הַבָּשָׂר
  choice: Toute chair
  rationale: L’expression hébraïque désigne collectivement les êtres mortels. « Toute chair » conserve l’image concrète et l’universalité de l’original, également attestées par le grec πᾶσα σὰρξ.
- source_word: כַּבֶּגֶד
  choice: comme un vêtement
  rationale: בגד est le terme courant pour un vêtement. Cette traduction directe préserve la comparaison avec une chose qui s’use.
- source_word: יִבְלֶה
  choice: s’use
  rationale: Le verbe בלה évoque ce qui vieillit ou s’use. « S’use » convient naturellement au vêtement de la comparaison et correspond au grec παλαιοῦται.
- source_word: וְחֹק עוֹלָם
  choice: et telle est la loi de toujours
  rationale: חק désigne une règle, une prescription ou un décret fixé, tandis que עולם exprime ici sa permanence immémoriale. La formulation française reste claire sans transformer la coordination hébraïque en explication causale.
- source_word: גֹּוֵעַ יִגְוָעוּ
  choice: ceux qui expirent expireront
  rationale: La tournure hébraïque transmise est concise et grammaticalement difficile, avec un participe singulier suivi d’un verbe au pluriel. Cette formulation conserve la répétition du verbe גוע et l’idée de mortalité universelle, sans introduire le « vous » absent de l’hébreu.
theological_decisions:
- issue: Interprétation du dernier membre, dont l’hébreu est abrupt tandis que le grec explicite un décret ancien de mort
  choice: ceux qui expirent expireront
  alternative: tu mourras certainement / les mourants mourront
  rationale: Le texte principal suit prioritairement l’hébreu conservé, en maintenant sa répétition expressive et la troisième personne. La note signale honnêtement la difficulté syntaxique et l’éclairage du parallèle grec, sans résoudre silencieusement l’incertitude textuelle.
translation_notes:
  register: Français international moderne, digne et accessible. « Toute chair » conserve l’idiome biblique transparent; « s’use » rend naturellement l’image du vêtement. Le dernier membre garde volontairement une certaine étrangeté, expliquée en note.
