  text: Before you die[a], do good to one you love, and according to what your hand attains[b], give to him.
translation:
  language: fr
  text: Avant de mourir, fais du bien à celui que tu aimes[a] et donne-lui dans la mesure de tes moyens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « à un ami » ; le parallèle grec dit : « fais du bien à un ami ».'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « l’atteinte de ta main » ; c’est-à-dire selon tes ressources ou tes capacités.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם תָּמוּת
  choice: Avant de mourir
  rationale: La tournure exprime directement l’antériorité par rapport à la mort. L’infinitif français est naturel et conserve l’adresse à la deuxième personne.
- source_word: הֵיטִב
  choice: fais du bien
  rationale: 'L’impératif hiphil de יטב a ici un sens bienfaisant : agir pour le bien de quelqu’un. « Fais du bien » en garde la force sans préciser indûment la forme de l’aide.'
- source_word: לְאוֹהֵב
  choice: à celui que tu aimes
  rationale: Le participe אוהב désigne une personne liée par l’affection et peut aussi se comprendre comme « ami ». La formulation retenue suit de près l’hébreu tout en laissant la note signaler le parallèle grec.
- source_word: וְהַשִּׂיגַת יָדְךָ
  choice: dans la mesure de tes moyens
  rationale: L’image de ce que la main peut atteindre désigne concrètement les ressources ou la capacité disponibles. Cette expression française en transmet naturellement le sens, tandis que la note conserve l’image hébraïque.
- source_word: תֶּן לוֹ
  choice: donne-lui
  rationale: Rendu direct et idiomatique de l’impératif נתן accompagné de son complément indirect.
theological_decisions:
- issue: Identité du bénéficiaire en לְאוֹהֵב / φίλῳ
  choice: celui que tu aimes
  alternative: un ami
  rationale: Le texte hébreu reste prioritaire et permet une relation affective plus large, tandis que le grec φίλῳ appuie explicitement le sens « ami ». Le texte principal garde la portée de l’hébreu et la note présente l’autre lecture.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement singulier traduit les formes hébraïques de deuxième personne. La seconde proposition privilégie une expression française courante, avec l’image concrète de la main préservée en note.
