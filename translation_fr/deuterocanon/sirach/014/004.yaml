  text: He who deprives himself will gather for another, and strangers will revel in his goods.
translation:
  language: fr
  text: Celui qui se prive amasse pour un autre, et un autre se délectera de ses biens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu porte le singulier « un autre »; le grec parallèle porte le pluriel : « d’autres se délecteront de ses biens ».'
    reason: alternative_reading
lexical_decisions:
- source_word: מוֹנֵעַ לְנַפְשׁוֹ
  choice: Celui qui se prive lui-même
  rationale: Le verbe מנע signifie retenir ou priver, et לְנַפְשׁוֹ a ici une valeur réfléchie. Cette formulation rend naturellement l’idée de se refuser la jouissance de ses propres biens.
- source_word: יִקְבֹּץ לְאַחֵר
  choice: amasse pour un autre
  rationale: קבץ signifie rassembler ou amasser. « Amasse » convient au contexte des possessions accumulées dont profitera quelqu’un d’autre.
- source_word: וּבְטוֹבָתוֹ
  choice: de ses biens
  rationale: טובה désigne ici concrètement les bonnes choses ou possessions de l’homme, comme le confirme le grec ἐν τοῖς ἀγαθοῖς αὐτοῦ.
- source_word: יִתְבַּעְבֵּעַ
  choice: se délectera
  rationale: Cette forme rare évoque une jouissance abondante ou raffinée; le grec τρυφήσουσιν appuie le sens de prendre ses délices ou de vivre dans l’agrément.
- source_word: זָר
  choice: un étranger
  rationale: Le nom hébreu est singulier. « Un étranger » conserve ce nombre et désigne une personne étrangère au propriétaire, sans nécessairement impliquer une nationalité étrangère.
