  source_fidelity: 'Le sens fondamental est bien rendu : l’homme qui se refuse à lui-même accumule au profit d’autrui, lequel jouira de ses biens. Toutefois, « étranger » suggère trop facilement une origine nationale ou ethnique, alors que זָר désigne ici plus largement quelqu’un d’autre, extérieur au propriétaire. « Un autre » conserve le singulier hébreu sans cette restriction indue.'
  naturalness: « Celui qui se prive lui-même » est compréhensible, mais redondant et moins idiomatique en français moderne. « Celui qui se prive » exprime naturellement la valeur réfléchie de l’hébreu. La formulation révisée reste sobre et sapientielle.
  terminology: « Amasse », « biens » et « se délectera » conviennent au contexte et au parallélisme grec. Le remplacement de « étranger » par « un autre » est préférable pour זָר. La note doit signaler explicitement que le grec emploie le pluriel, en contraste avec le singulier hébreu reproduit dans le texte.
