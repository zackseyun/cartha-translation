review_pass:
  verdict: revise
  source_fidelity: La première proposition rend fidèlement la question rhétorique, le verbe « laisser » et « richesse ». Dans la seconde, « le fruit de ton travail » est possible, mais explicite davantage que le substantif hébreu יְגִיעַ, qui désigne d’abord le labeur/la peine et peut, par extension, son produit. « Ceux qui procèdent au partage » s’éloigne de la formule hébraïque obscure et peut désigner des répartiteurs, alors que le grec évoque la répartition d’un lot et que les bénéficiaires restent possibles.
  naturalness: La formulation est globalement naturelle et de registre sobre. « Ton labeur » restitue le parallélisme avec « ta richesse » de manière plus concise et moins explicative. « Ceux qui se partagent le lot » est idiomatique et garde l’image du lot, absente du texte courant du projet.
  terminology: « Richesse » convient à חֵילֶךָ. « Labeur » convient à יְגִיעֲךָ sans transformer nécessairement le travail en son produit. La formulation finale proposée ne fixe pas le référent comme des héritiers et laisse à la note l’ambiguïté de l’expression hébraïque et l’éclairage du grec.
  issues:
