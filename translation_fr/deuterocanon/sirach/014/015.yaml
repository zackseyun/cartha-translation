    issue: La traduction de לְיוֹדֵי גוֹרָל par « à ceux qui procèdent au partage » n’exprime plus le « lot » et tend à faire de ces personnes les agents du partage.
    rationale: La formule hébraïque est difficile, et le parallèle grec renvoie à une division/attribution par lot. Une formulation qui conserve « lot » tout en évitant d’identifier dogmatiquement ou juridiquement les personnes est préférable.
  - severity: low
    issue: « Le fruit de ton travail » interprète le labeur comme son résultat.
    rationale: Cette extension est possible dans le contexte, mais « ton labeur » est plus directement équivalent au terme hébreu et maintient mieux le parallélisme poétique.
