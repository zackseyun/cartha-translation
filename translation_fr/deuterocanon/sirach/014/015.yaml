  text: Will you not leave your wealth to another[a], and your labor to those who cast the lot?
translation:
  language: fr
  text: Ne laisseras-tu pas ta richesse à un autre, et ton labeur à ceux qui se partagent le lot[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à ceux qui connaissent le lot ». La formule hébraïque est inhabituelle et son sens précis est incertain. Le grec évoque le partage ou l’attribution d’une part, possiblement dans le cadre d’un héritage.'
    reason: Préserve l’ambiguïté de l’hébreu tout en signalant l’éclairage du parallèle grec, sans imposer que les personnes soient des héritiers ou des répartiteurs.
lexical_decisions:
- source_word: הֲלֹא
  choice: Ne… pas ?
  rationale: Conserve la question rhétorique hébraïque, qui appelle une réponse affirmative et soutient l’exhortation du contexte.
- source_word: לְאַחֵר
  choice: à un autre
  rationale: Désigne simplement une autre personne comme bénéficiaire, sans préciser qu’il s’agit juridiquement d’un héritier.
- source_word: תַּעֲזוֹב
  choice: laisseras
  rationale: Exprime ce qui est laissé derrière soi sans introduire la précision juridique de « léguer ».
- source_word: חֵילֶךָ
  choice: ta richesse
  rationale: Dans ce contexte sapientiel, חַיִל désigne les biens ou ressources matériels accumulés.
- source_word: וִיגִיעֲךָ
  choice: le fruit de ton travail
  rationale: Le nom peut évoquer à la fois le labeur et ce qu’il a produit. Ici, ce qui est transmis à d’autres est naturellement le produit du travail.
- source_word: לְיוֹדֵי גוֹרָל
  choice: à ceux qui procèdent au partage
  rationale: La formule hébraïque, littéralement « ceux qui connaissent le lot », est idiomatique. Le parallèle grec évoque explicitement le partage d’une part ou d’un héritage; cette formulation française reste naturelle sans imposer le terme « héritiers ».
