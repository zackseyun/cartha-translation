translation_notes:
  register: Français moderne, sobre et sapientiel. La question rhétorique et le parallélisme sont conservés. « Le fruit de ton travail » explicite légèrement ce qui peut être laissé à autrui, tandis que la note maintient l’étrangeté et l’ambiguïté de la formule finale.
