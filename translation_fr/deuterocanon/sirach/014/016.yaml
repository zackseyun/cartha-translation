base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/016.yaml
  text: Give to a brother[a], and be gracious, and indulge yourself, for in Sheol there is no seeking pleasure. And whatever is good to do[b], do it before God.
translation:
  language: fr
  text: Donne à un frère[a], fais preuve de bonté et accorde-toi du plaisir, car dans le Shéol[b], on ne peut rechercher aucun plaisir. Et tout ce qu’il est bon de faire, fais-le devant Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Donne et prends, et trompe ton âme », formulation difficile qui semble également inviter à jouir de la vie ; l’hébreu dit plus clairement : « traite-toi avec délicatesse » ou « fais-toi plaisir ».'
    reason: alternative_reading
  - marker: b
    text: Le Shéol désigne le séjour des morts ; on pourrait aussi traduire par « la tombe » ou « le monde souterrain ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּן לְאָח
  choice: Donne à un frère
  rationale: Rend concrètement l’hébreu « donne à un frère » sans élargir implicitement le référent à « autrui ».
- source_word: וְחֹנֵן
  choice: fais preuve de bonté
  rationale: Le verbe חנן exprime la faveur et la bienveillance. Cette formulation est naturelle en français et conserve la portée éthique du terme.
- source_word: וּפַנֵּק נַפְשֶׁךָ
  choice: accorde-toi du plaisir
  rationale: פנק désigne le fait de traiter avec délicatesse ou de se faire plaisir. Cette traduction actuelle et digne évite la connotation parfois péjorative de « dorlote-toi » tout en s’accordant avec תענוג dans la proposition suivante.
- source_word: כִּי אֵין בִּשְׁאוֹל לְבַקֵּשׁ תַּעֲנוּג
  choice: car dans le Shéol, on ne peut rechercher aucun plaisir
  rationale: Conserve « Shéol » comme désignation du séjour des morts et rend la construction existentielle de façon idiomatique, sans la réduire à la tombe.
- source_word: וְכָל דָּבָר שֶׁיָּפֶה לַעֲשׂוֹת
  choice: Et tout ce qu’il est bon de faire
  rationale: יפה a ici une valeur éthique ou convenable plutôt que simplement esthétique. « Bon » préserve volontairement cette ampleur.
- source_word: לִפְנֵי אֱלֹהִים עֲשֶׂה
  choice: fais-le devant Dieu
  rationale: Reproduit directement l’image hébraïque de l’action accomplie devant Dieu, c’est-à-dire en sa présence ou sous son regard, sans choisir entre ces nuances.
theological_decisions:
- issue: Sens de שְׁאוֹל
  choice: le Shéol
  alternative: la tombe ; le séjour des morts ; le monde souterrain
  rationale: Le terme hébreu évoque le domaine des morts et ne doit être ni assimilé à l’enfer ni réduit sans nécessité au lieu matériel de sépulture.
- issue: Rapport entre l’impératif hébreu ופנק נפשך et le parallèle grec
  choice: accorde-toi du plaisir
  alternative: dorlote-toi ; fais-toi plaisir ; trompe ton âme
  rationale: L’hébreu extant est prioritaire et indique l’idée de se traiter délicatement ou de jouir d’un bien-être. La leçon grecque, difficile, est signalée en note plutôt qu’introduite dans le texte.
- issue: Portée de לפני אלהים
  choice: devant Dieu
  alternative: en présence de Dieu ; sous le regard de Dieu
  rationale: La formulation littérale préserve la tension entre présence divine, approbation et responsabilité morale sans imposer une seule interprétation.
translation_notes:
  register: Français international moderne, clair et digne. Les impératifs au singulier sont conservés. « Accorde-toi du plaisir » exprime naturellement l’invitation positive du texte sans tomber dans un registre familier. Les répétitions autour de « plaisir » reflètent le lien lexical et thématique de l’hébreu.
