base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/018.yaml
  text: 'Like the leaves budding on a luxuriant tree—one withers and another sprouts—so are the generations of flesh and blood: one dies and another is born[a].'
translation:
  language: fr
  text: 'Comme les feuilles qui bourgeonnent sur un arbre luxuriant — l’une se flétrit et une autre pousse — ainsi en va-t-il des générations de chair et de sang : l’une meurt et une autre naît[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu peut aussi se comprendre : « une autre parvient à maturité », ou dans un sens voisin; le témoin grec porte : « une autre naît », lecture suivie ici.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּפֶרַח עָלֶה
  choice: Comme les feuilles qui bourgeonnent
  rationale: L’hébreu est condensé; le grec ὡς φύλλον θάλλον confirme l’image d’un feuillage en pleine croissance. Cette formulation est naturelle en français et conserve l’aspect végétal.
- source_word: עֵץ רַעֲנָן
  choice: un arbre luxuriant
  rationale: רַעֲנָן évoque la fraîcheur, la verdure et une croissance vigoureuse; le grec δασέος appuie l’image d’un arbre au feuillage dense.
- source_word: שֶׁזֶּה נוֹבֵל וְאַחֵר צוֹמֵחַ
  choice: l’une se flétrit et une autre pousse
  rationale: נוֹבֵל signifie se flétrir ou se faner, et צוֹמֵחַ pousser ou germer. Le féminin s’accorde naturellement avec « feuille » en français.
- source_word: כֵּן דּוֹרוֹת בָּשָׂר וָדָם
  choice: ainsi en va-t-il des générations de chair et de sang
  rationale: La tournure rend clairement la comparaison tout en conservant l’expression sémitique concrète « chair et sang », également attestée par le grec.
- source_word: אֶחַד גֹּוֵעַ
  choice: l’une meurt
  rationale: גוע désigne le fait de mourir ou d’expirer. « Meurt » est simple, précis et actuel; le féminin reprend « génération ».
- source_word: וְאֶחַד גּוֹמֵל
  choice: et une autre naît
  rationale: Le sens de l’hébreu גּוֹמֵל peut évoquer l’arrivée à maturité, mais le témoin grec γεννᾶται porte explicitement le sens de « naître » et convient au renouvellement des générations.
theological_decisions:
- issue: Expression anthropologique בָּשָׂר וָדָם
  choice: conserver « chair et sang »
  alternative: « êtres humains » ou « humanité »
  rationale: L’expression souligne concrètement la condition mortelle et conserve la texture de l’hébreu sans la réduire à une abstraction.
- issue: Sens de וְאֶחַד גּוֹמֵל
  choice: « et une autre naît » dans le texte, avec note
  alternative: « et une autre parvient à maturité »
  rationale: Le grec ancien soutient nettement la naissance, tandis que l’hébreu permet un sens lié à la maturation. La note préserve cette tension textuelle au lieu de la masquer.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme parallèle et l’image végétale sont maintenus; les pronoms féminins suivent naturellement « feuilles » puis « générations ».
