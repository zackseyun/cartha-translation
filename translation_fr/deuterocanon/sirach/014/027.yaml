  text: He takes refuge in its shade from the heat[a], and he dwells in its shelters.
translation:
  language: fr
  text: Il se réfugie à son ombre, à l’abri de la chaleur[a], et il demeure dans ses abris.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Il sera abrité par elle de la chaleur brûlante, et il logera dans sa gloire. » L’hébreu lit « dans ses abris », tandis que le grec a « dans sa gloire ».'
    reason: Signaler la formulation parallèle grecque et la divergence textuelle « abris » / « gloire », sans remplacer la lecture hébraïque dans le texte principal.
lexical_decisions:
- source_word: וְחוֹסֶה
  choice: Il se réfugie
  rationale: Le participe de חסה exprime le fait de chercher refuge ou protection. Le présent convient à la portée générale et proverbiale du verset.
- source_word: בְּצִלָּהּ
  choice: à son ombre
  rationale: צֵל désigne l’ombre protectrice. La tournure française « à son ombre » est naturelle et conserve à la fois l’image végétale et le suffixe féminin renvoyant à la Sagesse.
- source_word: מֵחֹרֶב
  choice: loin de la chaleur
  rationale: חֹרֶב peut évoquer la chaleur desséchante ou torride; le grec καῦμα confirme ici le sens de chaleur brûlante. « Loin de » rend naturellement la protection exprimée par מִן après « se réfugier ».
- source_word: וּבִמְעוֹנוֹתֶיהָ
  choice: dans ses abris
  rationale: מְעוֹנוֹת désigne des demeures ou lieux d’habitation. Dans ce contexte protecteur, « abris » restitue la fonction de ces lieux sans s’éloigner du sens hébreu.
- source_word: יִשְׁכֹּן
  choice: il demeure
  rationale: שכן signifie habiter, résider ou demeurer. Le présent maintient le parallélisme avec le participe initial et la valeur proverbiale; « demeure » garde le registre élevé du texte sapiential.
theological_decisions:
- issue: Genre de l’antécédent personnifié
  choice: Employer les possessifs féminins « son » et « ses », qui renvoient contextuellement à la Sagesse.
  alternative: Reformuler avec « l’ombre de celle-ci » ou expliciter « la Sagesse ».
  rationale: En français, « son ombre » et « ses abris » préservent naturellement le renvoi à l’antécédent féminin sans ajouter une explicitation absente de l’hébreu. « Son » est morphologiquement masculin devant « ombre », mais son possesseur demeure la Sagesse.
- issue: Sujet humain générique singulier
  choice: « Il »
  alternative: « Celui qui » ou une formulation inclusive au pluriel.
  rationale: Le texte hébreu présente un sujet singulier implicite dans une maxime. « Il » conserve cette forme sans transformer le nombre ni alourdir le verset.
- issue: Divergence entre l’hébreu et le grec à la fin du verset
  choice: Suivre l’hébreu « dans ses abris » dans le texte principal.
  alternative: 'Suivre le grec: « il logera dans sa gloire ».'
  rationale: Le témoin hébreu fourni est de haute confiance et constitue la source première. La lecture grecque δόξῃ, sensiblement différente, mérite toutefois d’être signalée en note afin de ne pas masquer la variation textuelle.
translation_notes:
  register: Français international actuel, clair et digne. Le rythme parallèle est conservé par deux propositions au présent. Le vocabulaire concret de l’ombre, de la chaleur et des abris maintient l’image protectrice du contexte sapiential.
