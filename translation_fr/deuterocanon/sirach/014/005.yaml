  text: If he is evil to himself[a], to whom will he do good? He will not enjoy his own good things.
translation:
  language: fr
  text: Qui se fait du mal, à qui fera-t-il du bien ? Il ne jouira pas de ses biens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Il ne verra pas son bien. » Cette expression signifie probablement qu’il ne fera pas l’expérience du bien qui lui appartient ou qu’il n’en profitera pas. Le grec parallèle explicite ce sens : « il ne se réjouira pas de ses biens ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַע לְנַפְשׁוֹ
  choice: Celui qui se fait du mal à lui-même
  rationale: La tournure hébraïque décrit une personne mauvaise ou nuisible envers elle-même. « Se fait du mal » rend naturellement en français cette relation à soi sans donner à נֶפֶשׁ un sens anthropologique technique comme « âme ».
- source_word: לְמִי יֵיטִיב
  choice: à qui fera-t-il du bien ?
  rationale: Le hiphil de יטב exprime ici l’idée de faire du bien ou d’apporter un bienfait. La formulation conserve le contraste éthique et la question rhétorique de l’hébreu.
- source_word: וְלֹא יִרְאֶה
  choice: Il ne jouira pas
  rationale: Le sens littéral est « il ne verra pas », mais la tournure renvoie probablement au fait d’éprouver ou de goûter le bien. Le grec parallèle, avec « se réjouir », confirme ce sens expérientiel.
- source_word: בְּטוֹבָתוֹ
  choice: de ses propres biens
  rationale: טוֹבָה peut désigner le bien, le bien-être, la prospérité ou les bonnes choses que l’on possède. « Ses propres biens » convient au contexte tout en restant moins étroit que « sa richesse »; le grec parallèle évoque explicitement les possessions.
