  text: All his works rot away[a], and the work of his hands is dragged along behind him.
translation:
  language: fr
  text: Toutes ses œuvres pourrissent[a], et l’ouvrage de ses mains est entraîné derrière lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « toute œuvre qui se décompose disparaît, et celui qui l’accomplit s’en ira avec elle ». Dans l’hébreu, c’est plutôt l’ouvrage de ses mains qui est entraîné derrière lui.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל מַעֲשָׂיו
  choice: Toutes ses œuvres
  rationale: Le syntagme englobe tout ce que l’être humain accomplit ou produit. « Œuvres » conserve la portée large et le ton littéraire de l’hébreu.
- source_word: רָקוֹב יִרְקָבוּ
  choice: pourrissent
  rationale: La construction hébraïque fondée sur la répétition de la racine intensifie l’idée de décomposition. Le verbe simple est ici plus naturel en français qu’une reproduction formelle telle que « pourrissent de pourriture ».
- source_word: וּפֹעַל יָדָיו
  choice: et l’ouvrage de ses mains
  rationale: « Ouvrage » désigne le produit de l’action, tandis que « de ses mains » préserve l’image concrète du texte hébreu.
- source_word: יִמָּשֵׁךְ אַחֲרָיו
  choice: est entraîné derrière lui
  rationale: Le nifal de משך exprime ici le fait d’être tiré ou entraîné, et אַחֲרָיו signifie littéralement « derrière lui » ou « après lui ». Cette formulation conserve l’image inhabituelle sans l’expliquer.
theological_decisions:
- issue: Divergence entre l’hébreu et le grec dans le second membre
  choice: 'Suivre l’hébreu : « l’ouvrage de ses mains est entraîné derrière lui »'
  alternative: 'Suivre le grec : « celui qui l’accomplit s’en ira avec lui »'
  rationale: Le témoin hébreu, jugé fiable et validé, est prioritaire. Le grec conserve le thème général de la disparition, mais change le sujet grammatical et la relation entre l’auteur et son œuvre ; cette variante significative est donc signalée en note.
translation_notes:
  register: Français moderne, digne et accessible. « Pourrissent » rend naturellement l’intensification hébraïque ; « est entraîné derrière lui » maintient volontairement l’image frappante et quelque peu énigmatique du texte source.
