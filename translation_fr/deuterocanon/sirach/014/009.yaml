  text: In the eye of the greedy[a], his portion is too little, and by taking his neighbor’s share he destroys his own portion.
translation:
  language: fr
  text: Aux yeux de l’homme avide[a], sa part est trop petite ; en prenant la part de son prochain, il détruit la sienne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Aux yeux de… sa part est petite. » Le mot hébreu rendu par « l’homme avide » est difficile dans cette tradition manuscrite ; le grec porte : « L’œil de l’homme avide ne se rassasie pas d’une part », ce qui appuie ce sens.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעֵין
  choice: Aux yeux de
  rationale: Cette expression française naturelle conserve l’image hébraïque de l’œil tout en indiquant qu’il s’agit de la manière dont l’homme avide perçoit sa part.
- source_word: כּוֹשֵׁל
  choice: l’homme avide
  rationale: Le terme hébreu est difficile dans cette tradition manuscrite. Le parallèle grec πλεονέκτου, « de l’avide », soutient fortement ce sens dans le contexte d’une convoitise insatiable.
- source_word: מְעַט
  choice: trop petite
  rationale: 'Le simple sens de « petite » prend ici une valeur subjective : l’homme avide juge sa part insuffisante. « Trop petite » exprime cette nuance sans remplacer l’image hébraïque par celle du grec.'
- source_word: חֶלְקוֹ
  choice: sa part
  rationale: « Part » est clair et idiomatique en français, et permet de reproduire la répétition structurante de חֵלֶק dans les deux propositions.
- source_word: וְלוֹקֵחַ
  choice: en prenant
  rationale: Le participe décrit l’action caractéristique de l’homme avide et peut exprimer ici le moyen par lequel il détruit sa propre part.
- source_word: חֵלֶק רֵעֵהוּ
  choice: la part de son prochain
  rationale: « Prochain » rend רֵעַ dans sa dimension relationnelle et morale, avec un registre digne convenant à la littérature sapientielle.
- source_word: מְאַבֵּד חֶלְקוֹ
  choice: il détruit la sienne
  rationale: Le causatif מְאַבֵּד signifie naturellement « détruire, faire périr ». Le pronom « la sienne » évite une lourdeur tout en maintenant clairement la reprise de « part ».
theological_decisions:
- issue: Recours au parallèle grec pour interpréter un mot hébreu difficile
  choice: Comprendre כּוֹשֵׁל comme désignant « l’homme avide » et lire la première proposition comme l’expression d’une convoitise insatiable.
  alternative: Traduire plus littéralement le terme hébreu par « celui qui trébuche » ou « celui qui faiblit ».
  rationale: Dans ce contexte, le sens littéral habituel de la forme hébraïque produit une maxime obscure. Le grec lit πλεονέκτου, « de l’avide », et sa proposition sur l’œil jamais rassasié confirme le thème de la convoitise. La traduction suit la syntaxe et les images de l’hébreu, mais s’appuie sur le grec pour le terme incertain.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’image de l’œil et la répétition de « part », centrales dans l’hébreu, tout en explicitant naturellement l’évaluation subjective par « trop petite ».
