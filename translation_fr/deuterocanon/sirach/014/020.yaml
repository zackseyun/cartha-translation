  text: Blessed is the man who meditates on wisdom[b][a], and who reflects with understanding.
translation:
  language: fr
  text: Heureux[a] l’homme qui médite sur la sagesse[b] et qui réfléchit avec discernement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Comme il est heureux ». La formule hébraïque de béatitude désigne une condition enviable et florissante, et non un simple sentiment de bonheur.'
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec parallèle porte : « Heureux l’homme qui parviendra à son terme dans la sagesse et qui raisonnera avec son intelligence. » Son premier verbe et son second membre diffèrent sensiblement de l’hébreu.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heureux
  rationale: La formule de béatitude proclame la condition enviable et florissante de la personne décrite. « Heureux » est la formulation française traditionnelle, naturelle et digne, sans se limiter à une émotion passagère.
- source_word: אֱנוֹשׁ
  choice: l’homme
  rationale: Le nom hébreu est ici au masculin singulier et présente une figure représentative dans une maxime de sagesse. « L’homme » en conserve la forme sans exclure la portée générale du propos.
- source_word: בְּחָכְמָה יֶהְגֶּה
  choice: qui médite sur la sagesse
  rationale: Le verbe הָגָה désigne une méditation attentive, parfois murmurée. En français, la préposition בְּ se rend naturellement par « sur » avec le verbe « méditer ».
- source_word: וּבִתְבוּנָה
  choice: avec discernement
  rationale: תְּבוּנָה évoque l’intelligence qui comprend et distingue justement. « Avec discernement » exprime ici de façon naturelle la manière dont s’exerce la réflexion.
- source_word: יִשְׁעֶה
  choice: réfléchit
  rationale: Dans ce contexte, le verbe exprime une attention dirigée et soutenue. « Réfléchit » maintient le parallélisme intellectuel avec « médite » sans imposer l’image physique possible de regarder ou de se tourner.
theological_decisions:
- issue: Masculin représentatif dans la béatitude sapientielle
  choice: l’homme
  alternative: la personne
  rationale: L’hébreu emploie un masculin singulier représentatif. La traduction en conserve la forme littéraire tout en laissant au proverbe sa portée générale.
- issue: Nature de la béatitude
  choice: Heureux
  alternative: Béni
  rationale: אַשְׁרֵי décrit une condition enviable et florissante plutôt qu’un acte explicite de bénédiction divine. « Heureux » préserve cette tension sans ajouter un agent divin absent du verset.
translation_notes:
  register: Français international moderne, sobre et sapientiel. La structure en deux membres parallèles est conservée; « médite » et « réfléchit » rendent l’activité attentive sans alourdir la phrase.
