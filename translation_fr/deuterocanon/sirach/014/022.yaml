  text: Go out after her in search[a], and lurk at all her entrances.
translation:
  language: fr
  text: Pars à sa suite pour la rechercher, et guette chacune de ses entrées.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe hébreu est rare et incertain. Le grec parallèle emploie une image plus forte : « tiens-toi en embuscade à toutes ses entrées » ou « reste à l’affût » devant elles.'
    reason: Variante lexicale fondée sur le parallèle grec et sur l’incertitude du verbe hébreu.
lexical_decisions:
- source_word: לָצֵאת
  choice: Pars
  rationale: L’infinitif de יצא a ici une valeur d’exhortation. « Pars » est naturel en français et conserve l’idée de se mettre en mouvement.
- source_word: אַחֲרֶיהָ
  choice: à sa suite
  rationale: Cette expression maintient la référence féminine à la Sagesse personnifiée ainsi que l’image d’une poursuite attentive.
- source_word: בְחֵקֶר
  choice: pour la rechercher
  rationale: Le nom חֵקֶר exprime la recherche ou l’investigation. Cette tournure française rend clairement le but de la démarche; le grec parallèle, « comme un pisteur », confirme cette nuance.
- source_word: מְבוֹאֶיהָ
  choice: chacune de ses entrées
  rationale: מָבוֹא désigne concrètement une entrée ou un accès. « Chacune » traduit naturellement כָּל devant le pluriel tout en conservant l’image spatiale.
- source_word: יְרַצֵּד
  choice: guette
  rationale: Le verbe hébreu est rare et son sens exact demeure incertain. « Guette » exprime une observation vigilante et prolongée; le grec ἐνέδρευε appuie une image plus forte d’affût ou d’embuscade.
theological_decisions:
- issue: Personnification féminine de la Sagesse
  choice: Conserver les pronoms et déterminants féminins (« sa », « la », « ses »)
  alternative: Répéter « la Sagesse » ou neutraliser la référence
  rationale: Les suffixes hébreux sont au féminin singulier et renvoient à la Sagesse personnifiée dans le contexte. Le féminin préserve la texture littéraire sans ajouter d’interprétation doctrinale.
- issue: Force de la métaphore finale
  choice: « guette » dans le texte principal
  alternative: « tiens-toi en embuscade » ou « reste à l’affût »
  rationale: Le parallèle grec porte une image d’embuscade, mais le rare verbe hébreu ne permet pas d’en fixer sûrement toute l’intensité. « Guette » maintient la vigilance active, tandis que la note signale la lecture plus marquée.
translation_notes:
  register: Français international moderne, direct et digne. L’impératif conserve le ton exhortatif; le rythme en deux membres et la personnification de la Sagesse sont maintenus.
