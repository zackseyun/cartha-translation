  text: Do not deprive yourself of a good day, and do not let your share in a good desire pass you by.
translation:
  language: fr
  text: Ne te prive pas d’un jour heureux, et ne laisse pas t’échapper la part qui te revient d’un bon désir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin hébreu comporte aussi, entre crochets, la proposition : « et ne te prive pas de bien ». Sa formulation est incertaine dans la source présentée et elle est peut-être secondaire. Le parallèle grec porte plutôt : « et qu’une part d’un bon désir ne t’échappe pas ».'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּמְנַע / μὴ ἀφυστερήσῃς
  choice: Ne te prive pas
  rationale: Cette formulation naturelle conserve l’idée hébraïque de ne pas retenir un bien et la nuance grecque de privation, tout en indiquant clairement que l’exhortation concerne la personne elle-même.
- source_word: מִטּוֹבַת יוֹם / ἀπὸ ἀγαθῆς ἡμέρας
  choice: d’un jour heureux
  rationale: L’expression rend la bonté ou l’agrément du jour sans développer indûment le sens en « plaisirs du jour ».
- source_word: '[וְאַל תִּמְנַע מִטּוֹבָה נַפְשֶׁךָ]'
  choice: omis du texte principal
  rationale: Cette proposition est placée entre crochets dans le témoin hébreu présenté, et le parallèle grec ne la reproduit pas sous cette forme. Sa présence est donc signalée en note plutôt qu’intégrée comme certaine.
- source_word: μερὶς
  choice: la part … qui te revient
  rationale: « Part » garde l’idée d’une portion, tandis que « qui te revient » exprime naturellement en français son rapport au destinataire.
- source_word: ἐπιθυμίας ἀγαθῆς
  choice: de bon désir
  rationale: Cette traduction volontairement sobre préserve l’expression grecque et son ambiguïté, sans préciser s’il s’agit d’un désir moralement bon, légitime ou agréable.
- source_word: μὴ σε παρελθάτω
  choice: ne laisse pas passer
  rationale: La tournure française exprime de façon idiomatique l’image de quelque chose qui passe sans être saisi ni goûté.
theological_decisions:
- issue: Articulation du témoin hébreu conservé et du parallèle grec
  choice: Le premier membre suit l’hébreu stable; le second suit le grec là où la formulation hébraïque présentée est incertaine.
  alternative: 'Intégrer dans le texte principal la proposition hébraïque entre crochets : « et ne te refuse aucun bien ».'
  rationale: Ce choix donne priorité à l’hébreu lorsqu’il est assuré, tout en recourant au grec pour fournir le second membre cohérent. Il rend visible l’incertitude textuelle sans la résoudre artificiellement.
translation_notes:
  register: Français international moderne, exhortatif et digne. La formulation reste accessible tout en conservant l’étrangeté mesurée de l’expression grecque « part de bon désir ».
