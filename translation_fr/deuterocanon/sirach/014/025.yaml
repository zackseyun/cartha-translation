translation:
  language: fr
  text: Il dresse sa tente auprès d’elle[a] et loge dans une bonne demeure[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur/près de sa main »; cette expression indique ici la proximité. Le grec présente de même une tournure avec « ses mains ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu est très condensé; on peut aussi traduire : « et demeure dans un agréable logis ». Le grec évoque un logement associé à « de bonnes choses ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנוֹטֶה
  choice: Il dresse
  rationale: Avec אָהֳלוֹ (« sa tente »), le verbe נטה désigne naturellement l’action de déployer ou de dresser une tente.
- source_word: אָהֳלוֹ
  choice: sa tente
  rationale: Le terme אהל désigne ordinairement une tente; l’image concrète est conservée.
- source_word: עַל יָדָהּ
  choice: auprès d’elle
  rationale: L’expression signifie littéralement « sur/près de sa main » et exprime ici la proximité. « Auprès d’elle » est naturel en français tout en gardant l’idée de proximité avec la Sagesse personnifiée.
- source_word: וְשָׁכַן
  choice: et demeure
  rationale: Le verbe שכן signifie habiter ou demeurer. « Demeure » s’accorde avec l’image de la tente sans suggérer nécessairement une installation définitive.
- source_word: שֹׁכֶן טוֹב
  choice: dans un bon lieu de séjour
  rationale: L’hébreu transmis est très condensé, évoquant littéralement un bon séjour ou une bonne demeure. La formulation française conserve cette image d’habitation, en accord avec le parallèle grec qui parle d’un lieu où loger.
theological_decisions:
- issue: Personnification féminine de la Sagesse
  choice: Conserver le pronom féminin « elle ».
  alternative: Employer un pronom neutre ou répéter « la sagesse » afin d’atténuer la personnification.
  rationale: Le contexte présente la Sagesse comme une femme. Le féminin maintient cette image littéraire et théologique présente dans les témoins hébreu et grec.
- issue: Maintien de l’image de la tente et du séjour
  choice: Traduire concrètement la tente et le lieu de séjour.
  alternative: 'Paraphraser abstraitement l’attachement à la Sagesse, par exemple : « Il reste près d’elle et y trouve le bonheur. »'
  rationale: Le texte décrit la proximité avec la Sagesse au moyen d’une image d’habitation. La conserver évite d’aplatir la métaphore ou d’en préciser excessivement la portée.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste simple, tandis que les images concrètes de la tente et du séjour sont préservées. Les notes signalent sans la résoudre artificiellement la formulation compacte de l’hébreu.
