  text: My son[a], if you have the means, treat yourself well; and if you have anything, do good to yourself.
translation:
  language: fr
  text: Mon fils, si tu en as les moyens, prends soin de toi ; si tu as de quoi le faire, fais-toi du bien.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec offre une lecture différente : « Mon enfant, selon ce que tu as, fais-toi du bien, et présente au Seigneur des offrandes comme il convient. »'
    reason: textual_variant
lexical_decisions:
- source_word: בְּנִי
  choice: Mon fils
  rationale: Le vocatif hébreu est explicitement masculin singulier avec suffixe de première personne. « Mon fils » le rend directement, tout en conservant le ton sapientiel.
- source_word: אִם יֵשׁ לְךָ שָׁרֵית נַפְשֶׁךָ
  choice: si tu en as les moyens, traite-toi bien
  rationale: La formulation hébraïque est comprimée et difficile. Dans le contexte, elle invite le destinataire à employer les ressources dont il dispose pour son propre bien. « Si tu en as les moyens » exprime naturellement cette idée sans imposer un sens trop étroit à שָׁרֵית נַפְשֶׁךָ.
- source_word: וְאִם יֵשׁ לְךָ
  choice: et si tu as quelque chose
  rationale: La construction existentielle hébraïque exprime ici la possession. La formulation française conserve la répétition du texte hébreu au lieu de fondre les deux propositions.
- source_word: הֵיטִיב לָךְ
  choice: fais-toi du bien
  rationale: Le hifil de יטב suivi de לָךְ a ici une valeur bénéfactive ou réfléchie. « Fais-toi du bien » est clair, actuel et reste proche de la formulation hébraïque.
- source_word: προσφορὰς Κυρίῳ ἀξίως πρόσαγε
  choice: présente au Seigneur des offrandes dignes de lui
  rationale: Cette proposition n’est conservée que dans le parallèle grec. Elle est donc signalée en note comme variante textuelle plutôt qu’intégrée au corps fondé sur l’hébreu existant.
theological_decisions:
- issue: Proposition grecque relative aux offrandes, absente de l’hébreu conservé
  choice: Suivre les deux propositions de l’hébreu dans le texte principal et signaler la leçon grecque en note
  alternative: Remplacer la seconde proposition hébraïque par « et présente au Seigneur des offrandes dignes de lui »
  rationale: L’hébreu est ici conservé avec une confiance élevée et contient deux propositions parallèles. Le grec témoigne d’une forme sensiblement différente, peut-être plus complète ou issue d’une autre Vorlage. Une note préserve cette donnée sans effacer le témoignage hébreu ni résoudre abusivement la variante.
- issue: Traduction de Κυρίῳ dans la variante grecque
  choice: au Seigneur
  alternative: à l’Éternel
  rationale: « Le Seigneur » est la traduction française transparente et habituelle de Κύριος dans ce contexte, sans rétrovertir avec certitude un nom divin hébreu non attesté dans le témoin principal.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement correspond à l’adresse personnelle du maître à son fils. La répétition « si tu… » / « fais-toi… » reproduit le parallélisme de l’hébreu, malgré une légère lourdeur naturelle en français.
