  text: Celui qui campe autour de sa maison et plante ses piquets contre son mur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחוֹנֶה
  choice: Celui qui campe
  rationale: Le participe de חנה évoque une conduite caractéristique. « Campe » conserve l’image concrète du campement, tandis que le grec καταλύων confirme l’idée de loger à proximité.
- source_word: סְבִיבוֹת בֵּיתָהּ
  choice: autour de sa maison
  rationale: « Autour de » rend la proximité enveloppante exprimée par l’hébreu סְבִיבוֹת; « sa maison » maintient la métaphore concrète et le féminin renvoyant à la Sagesse.
- source_word: וְהֵבִיא
  choice: plante
  rationale: Le verbe signifie formellement « amène », mais, avec des piquets pour objet, il désigne leur mise en place. « Plante » est idiomatique en français et concorde avec le grec πήξει, « fixera ».
- source_word: יְתֵדָיו
  choice: ses piquets
  rationale: La forme hébraïque est plurielle et désigne des piquets ou pieux, naturellement compris ici comme des piquets de tente grâce à l’image du campement.
- source_word: בְּקִירָהּ
  choice: près de son mur
  rationale: La préposition בְּ peut indiquer le lieu ou le contact. En français, planter des piquets « dans » un mur serait peu naturel; « près de son mur » préserve l’image d’un camp établi contre la demeure et s’accorde avec la proximité explicitée par le parallèle grec.
theological_decisions:
- issue: Référent des pronoms féminins
  choice: Les possessifs « sa » et « son » renvoient à la Sagesse personnifiée.
  alternative: Une femme ou une maîtresse de maison ordinaire.
  rationale: Le contexte immédiat décrit celui qui recherche la Sagesse et veille auprès d’elle; l’image de la maison prolonge donc cette personnification sans introduire un nouveau personnage.
translation_notes:
  register: Français international moderne, simple et digne. La structure participiale hébraïque est rendue par « Celui qui », et la métaphore continue du campement est conservée. La ponctuation clôt le verset sans ajouter le tiret de l’anglais, absent de la source hébraïque.
