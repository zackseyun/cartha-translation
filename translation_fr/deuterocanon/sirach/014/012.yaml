  yaml_path: translation/deuterocanon/sirach/014/012.yaml
  text: Refresh yourself while you still have the power; remember that there is no pleasure in Sheol[a], and death does not delay, and the decree of Sheol has not been made known to you.
translation:
  language: fr
  text: Dans la mesure de tes moyens, fais-toi du bien ; souviens-toi qu’il n’y a pas de plaisir dans le Shéol[a], que la mort ne tarde pas et que le décret du Shéol ne t’a pas été fait connaître.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente : « Souviens-toi que la mort ne tardera pas et que l’alliance de l’Hadès ne t’a pas été montrée. » L’hébreu porte : « le décret du Shéol ne t’a pas été fait connaître ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְאֵל יָדְךָ
  choice: Dans la mesure de tes moyens
  rationale: Cette tournure rend l’idée de capacité ou de ressources disponibles exprimée littéralement par la « force de ta main », sans produire en français une formulation artificielle.
- source_word: הִדָּשֵׁן
  choice: fais-toi du bien
  rationale: Le verbe דשן évoque le fait d’être comblé, enrichi ou bien pourvu. Dans cette exhortation à profiter des biens présents avant la mort, cette formulation est naturelle et garde une portée assez large.
- source_word: זְכוֹר
  choice: souviens-toi
  rationale: Impératif direct et courant, adapté au ton d’une exhortation de sagesse.
- source_word: בִשְׁאוֹל
  choice: dans le Shéol
  rationale: La translittération conserve la notion hébraïque du séjour des morts sans la réduire à la tombe ni lui imposer les connotations doctrinales ultérieures de l’enfer.
- source_word: תַּעֲנוּג
  choice: plaisir
  rationale: Le nom désigne le plaisir, les délices ou la jouissance ; « plaisir » correspond clairement au contraste avec la possibilité présente de se faire du bien.
- source_word: וְלֹא מָוֶת יִתְמַהְמַהּ
  choice: que la mort ne tarde pas
  rationale: Le verbe exprime le retard ou l’attente. Le présent rend naturellement la portée générale de l’avertissement, en accord avec le parallèle grec.
- source_word: וְחֹק לִשְׁאוֹל
  choice: le décret du Shéol
  rationale: חֹק peut désigner une règle, une prescription ou un décret fixé. Le génitif français préserve l’ambiguïté du rapport marqué par לִשְׁאוֹל sans adopter la variante grecque « alliance de l’Hadès ».
- source_word: לֹא הֻגַּד לָךְ
  choice: ne t’a pas été annoncé
  rationale: Le passif de נגד signifie qu’une chose n’a pas été dite ou portée à la connaissance de quelqu’un. « Annoncé » reste proche de l’acte de dire et convient au registre sapientiel.
theological_decisions:
- issue: Traduction de שְׁאוֹל / ᾅδης
  choice: Shéol
  alternative: la tombe ; le séjour des morts ; l’Hadès
  rationale: Le passage évoque le domaine des morts dans l’imaginaire sapientiel hébraïque. « Shéol » conserve cette référence ancienne sans l’assimiler à une conception doctrinale ultérieure de l’enfer.
- issue: Rapport entre חֹק et שְׁאוֹל
  choice: le décret du Shéol
  alternative: le décret concernant le Shéol ; l’alliance de l’Hadès
  rationale: La formulation hébraïque reste susceptible de plusieurs analyses. La traduction retenue suit le témoin hébreu et maintient une certaine indétermination, tandis que la variante grecque est signalée en note.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement suit l’adresse individuelle du texte de sagesse. La phrase reste fluide tout en conservant le Shéol et l’ambiguïté du « décret » hébreu.
