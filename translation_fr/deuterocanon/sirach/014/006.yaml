  text: For one who is evil to himself[a], there is none more evil than he; and this is the repayment of his evil.
translation:
  language: fr
  text: Celui qui est mauvais envers lui-même[a], nul n’est pire que lui ; et la rétribution de son mal lui revient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec peut aussi se comprendre : « celui qui se refuse quelque chose » ou « celui qui est avare envers lui-même » ; il explicite ainsi l’idée d’une avarice qui va jusqu’à se priver soi-même.'
    reason: Variante lexicale éclairée par le parallèle grec.
lexical_decisions:
- source_word: רַע לְנַפְשׁוֹ
  choice: Celui qui est mauvais envers lui-même
  rationale: La proposition nominale hébraïque signifie littéralement « mauvais envers lui-même/son âme ». Cette formulation conserve le vocabulaire moral et la portée assez large de l’hébreu, tandis que la note signale la nuance plus précise du grec.
- source_word: אֵין רַע מִמֶּנּוּ
  choice: nul n’est pire que lui
  rationale: Cette tournure française naturelle exprime clairement le comparatif hébreu et maintient le lien lexical entre « mauvais » et « pire ».
- source_word: תּשְלוּמַת
  choice: la rétribution
  rationale: Le nom désigne ce qui est rendu en paiement ou en retour. « Rétribution » convient au contexte de conséquence morale sans préciser indûment sa forme.
- source_word: רָעָתוֹ
  choice: son mal
  rationale: « Son mal » préserve la répétition de la racine רע présente dans tout le verset et laisse ouverte la nuance entre méchanceté, conduite mauvaise et mal qui en résulte.
- source_word: וְעִמּוֹ
  choice: reste avec lui
  rationale: L’hébreu dit littéralement « et avec lui ». L’ajout minimal de « reste » produit une phrase française complète tout en conservant l’image d’une rétribution attachée à la personne.
theological_decisions:
- issue: Nature de la rétribution
  choice: Ne pas préciser si elle est divine, sociale ou intrinsèque
  alternative: « Dieu lui rendra selon son mal »
  rationale: Le texte hébreu ne nomme aucun agent et présente seulement la rétribution comme étant avec l’homme mauvais envers lui-même.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation légèrement marquée « mauvais envers lui-même » est maintenue afin de respecter la concision et l’ambiguïté de l’hébreu ; « nul n’est pire » donne à la seconde proposition une cadence proverbiale naturelle.
