  text: He sets his nest in her foliage[a], and lodges among her branches.
translation:
  language: fr
  text: Il établira son nid dans son feuillage[a] et logera parmi ses branches.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Il placera ses enfants dans son abri et logera sous ses branches. » L’hébreu dit « son nid » et « dans son feuillage ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָשִׂים
  choice: Il établit
  rationale: Le verbe שׂים signifie « mettre, placer ». Avec « son nid », « établir » exprime naturellement l’action concrète sans développer l’image.
- source_word: קִנּוֹ
  choice: son nid
  rationale: Le mot hébreu désigne clairement un nid. Cette lecture cohérente conserve l’image de l’arbre, malgré le parallèle grec « ses enfants ».
- source_word: בְעָפְיָהּ
  choice: dans son feuillage
  rationale: Le terme renvoie à la frondaison ou au feuillage. Le possessif féminin hébreu peut se rendre naturellement par « son » en français, en référence à la sagesse représentée comme un arbre.
- source_word: וּבַעֲנָפֶיהָ
  choice: parmi ses branches
  rationale: ענף désigne une branche. « Parmi » rend bien la position à l’intérieur de la ramure suggérée par l’hébreu; le grec a plutôt « sous ses branches ».
- source_word: יִתְלוֹנָן
  choice: passe la nuit
  rationale: Le verbe exprime le fait de loger ou de passer la nuit. Cette formulation moderne garde la valeur temporelle plus précise du verbe et convient à l’image du nid.
theological_decisions:
- issue: Choix entre le témoin hébreu et le parallèle grec lorsqu’ils divergent
  choice: 'Suivre dans le texte principal l’hébreu : « son nid », « dans son feuillage » et « parmi ses branches ».'
  alternative: 'Le grec porte : « Il placera ses enfants sous son abri et passera la nuit sous ses branches. »'
  rationale: Lorsque le texte hébreu du Siracide est conservé et cohérent, il gouverne la traduction; le grec sert de témoin parallèle. Sa variante substantielle est donc signalée en note sans être harmonisée avec l’hébreu.
translation_notes:
  register: Français international moderne, sobre et imagé. La personnification féminine de la sagesse reste perceptible dans le contexte, tandis que les possessifs français s’accordent avec « feuillage » et « branches », non avec le possesseur.
