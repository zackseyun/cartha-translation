base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/001.yaml
  text: Happy is the man whose mouth has not caused him to stumble[b][a], and whose heart has not condemned him.
translation:
  language: fr
  text: Heureux l’homme dont la bouche ne l’a pas fait trébucher[a], et que le jugement de son cœur n’a pas condamné[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu de cette proposition est difficile; littéralement, il dit quelque chose comme « dont la bouche ne l’a pas abandonné ». Le grec porte: « qui n’a pas trébuché par sa bouche », c’est-à-dire dans ses paroles.'
    reason: alternative_reading
  - marker: b
    text: 'Le verbe hébreu est incertain. Le grec présente une autre formulation: « et qui n’a pas été transpercé par le chagrin du péché ».'
    reason: textual_variant
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heureux
  rationale: La formule sapientielle introduit une condition enviable. « Heureux » est naturel en français biblique moderne et n’ajoute pas l’idée explicite d’une action divine.
- source_word: אֱנוֹשׁ
  choice: l’homme
  rationale: Le nom désigne ici un être humain sous une forme masculine singulière représentative; « l’homme » conserve la forme du texte et le ton proverbial.
- source_word: לֹא עֲזָבוֹ פִיהוּ
  choice: dont la bouche ne l’a pas fait trébucher
  rationale: L’hébreu transmis est difficile et signifie littéralement quelque chose comme « sa bouche ne l’a pas abandonné ». Le parallèle grec, « n’a pas trébuché par sa bouche », indique vraisemblablement une faute commise en parole. La formulation française rend ce sens sans masquer l’incertitude textuelle, signalée en note.
- source_word: וְלֹא אָבַח עָלָיו
  choice: ne l’a pas condamné
  rationale: Le verbe hébreu est rare ou incertain. Dans la construction avec le jugement du cœur, « condamné » exprime naturellement un verdict intérieur, tout en laissant en note la lecture grecque différente.
- source_word: דִּין לִבּוֹ
  choice: le jugement de son cœur
  rationale: Cette formulation conserve explicitement les deux éléments de l’hébreu, « jugement » et « cœur », plutôt que de les réduire à l’interprétation « conscience ».
theological_decisions:
- issue: Formule de béatitude
  choice: Heureux l’homme
  alternative: Béni soit l’homme
  rationale: Le contexte relève de la sagesse et décrit un bonheur enviable sans nommer explicitement Dieu comme celui qui bénit.
- issue: Interprétation de la première proposition difficile
  choice: dont la bouche ne l’a pas fait trébucher
  alternative: dont la bouche ne l’a pas abandonné
  rationale: La traduction littérale de l’hébreu est obscure. Le grec ancien soutient nettement l’idée de trébucher par la parole; cette compréhension est retenue dans le texte, tandis que la difficulté de l’hébreu est conservée en note.
- issue: Verdict intérieur et variante grecque
  choice: que le jugement de son cœur n’a pas condamné
  alternative: qui n’a pas été transpercé par le chagrin du péché
  rationale: Le texte principal reste ancré dans les mots attestés de l’hébreu composite, qui associent jugement et cœur. La formulation grecque, théologiquement significative mais différente, est donnée en note plutôt que fusionnée silencieusement avec l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme sapientiel est conservé. « Faire trébucher » garde l’image morale du grec sans employer un vocabulaire confessionnel spécialisé; « le jugement de son cœur » maintient la tension judiciaire et intérieure de l’hébreu.
