  text: For the sake of gain many have sinned[b][a], and whoever seeks to increase it will turn away his eye.
translation:
  language: fr
  text: Pour un profit, beaucoup ont péché[a] ; celui qui cherche à l’accroître détournera le regard[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un avantage matériel ». Le terme grec peut avoir d’autres sens, mais il désigne probablement ici un profit.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « détournera l’œil » : l’image suggère que la recherche d’un profit accru conduit à fermer volontairement les yeux, sans préciser sur quoi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριν ἀδιαφόρου
  choice: pour un profit
  rationale: χάριν avec le génitif exprime ici le motif. Dans ce contexte proverbial, ἀδιάφορον désigne vraisemblablement un avantage matériel ou un profit, comme le confirme l’idée d’accroissement dans la proposition suivante.
- source_word: πολλοὶ ἥμαρτον
  choice: beaucoup ont péché
  rationale: Le passé composé rend naturellement en français actuel cette constatation générale fondée sur l’expérience humaine.
- source_word: ὁ ζητῶν πληθῦναι
  choice: celui qui cherche à l’accroître
  rationale: Le participe substantivé a une portée générale. Le pronom « l’ » explicite sobrement l’objet sous-entendu, à savoir le profit.
- source_word: ἀποστρέψει ὀφθαλμόν
  choice: détournera le regard
  rationale: Cette formulation française naturelle conserve l’image grecque sans préciser abusivement ce que la personne refuse de voir.
theological_decisions:
- issue: Portée morale de la proposition finale
  choice: Conserver l’image ouverte de la personne qui « détournera le regard ».
  alternative: « fermera les yeux sur le mal » ou « négligera ce qui est juste »
  rationale: Le grec suggère un compromis moral délibéré, mais ne nomme pas ce dont le regard se détourne. La traduction préserve donc cette ambiguïté au lieu d’ajouter un objet précis.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Profit » relie clairement les deux propositions ; « détournera le regard » est idiomatique tout en maintenant l’indétermination du grec.
