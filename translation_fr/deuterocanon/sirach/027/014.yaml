  text: The talk of one who swears much makes the hair stand up[a], and their quarrel stops the ears.
translation:
  language: fr
  text: Les propos de celui qui ne cesse de jurer font dresser les cheveux[a], et leur querelle bouche les oreilles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec πολυκόρυφου est difficile à interpréter. Il peut désigner une personne qui multiplie les jurons, les imprécations ou les serments, ou, plus largement, quelqu’un dont les paroles sont tapageuses, outrancières ou vantardes.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλιὰ
  choice: les propos
  rationale: Le nom désigne la parole ou la manière de parler. « Les propos » convient au ton proverbial et introduit naturellement le contenu choquant du discours.
- source_word: πολυκόρυφου
  choice: de celui qui ne cesse de jurer
  rationale: Le terme grec est rare et difficile. Cette traduction retient le sens probable d’une personne portée aux jurons, aux imprécations ou aux serments répétés, tout en signalant l’incertitude en note.
- source_word: ὀρθώσει τρίχας
  choice: font dresser les cheveux
  rationale: La formulation conserve l’image grecque d’une réaction d’effroi ou d’horreur et reste idiomatique en français.
- source_word: μάχη
  choice: querelles
  rationale: Dans ce contexte centré sur la parole, le terme évoque vraisemblablement des disputes plutôt qu’un combat armé. Le pluriel s’accorde naturellement avec la tournure française et le référent collectif implicite.
- source_word: ἐμφραγμὸς ὤτιων
  choice: bouchent les oreilles
  rationale: 'Cette expression naturelle rend l’image grecque d’une obstruction des oreilles : les querelles sont si pénibles qu’elles empêchent d’écouter ou poussent à se boucher les oreilles.'
