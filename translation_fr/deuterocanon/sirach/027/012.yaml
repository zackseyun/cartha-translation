  text: Among the senseless[a], watch for the right time; but among the thoughtful, be constant.
translation:
  language: fr
  text: Parmi les personnes sans discernement, observe le moment opportun ; mais reste constamment auprès de celui qui réfléchit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσυνέτων
  choice: des gens dépourvus de discernement
  rationale: Le terme désigne ceux qui manquent d’intelligence ou de discernement. Cette formulation rend la nuance intellectuelle et morale sans réduire le mot à une simple insulte.
- source_word: συντήρησον καιρόν
  choice: guette le moment opportun
  rationale: συντηρέω exprime ici une attention vigilante, tandis que καιρός désigne le moment approprié plutôt que le temps chronologique.
- source_word: διανοουμένου
  choice: celui qui réfléchit
  rationale: Le participe singulier désigne une personne qui pense et examine les choses. La traduction conserve ce singulier et reste naturelle en français.
- source_word: ἐνδελέχιζε
  choice: demeure assidu
  rationale: Le verbe exprime la continuité ou la persévérance. « Demeure assidu » suggère une présence suivie sans préciser une action que le grec laisse implicite.
- source_word: εἰς μέσον ... εἰς μέσον δέ
  choice: au milieu de ... mais auprès de
  rationale: La construction situe la personne dans deux milieux sociaux contrastés. La légère variation évite une lourdeur en français tout en préservant l’opposition.
