  revision_rationale: La révision conserve l’opposition répétée entre les deux milieux, le singulier de « celui qui réfléchit », et l’ambiguïté pratique du grec. Elle améliore l’idiomaticité française en donnant à la persévérance un cadre relationnel déjà impliqué par « parmi/auprès de », sans préciser indûment ce que la personne doit faire.
