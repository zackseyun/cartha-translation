revisions:
- from: Au milieu des gens dépourvus de discernement, guette le moment opportun ; mais auprès de celui qui réfléchit, demeure assidu.
  to: Parmi les personnes sans discernement, observe le moment opportun ; mais reste constamment auprès de celui qui réfléchit.
  rationale: La révision conserve l’opposition répétée entre les deux milieux, le singulier de « celui qui réfléchit », et l’ambiguïté pratique du grec. Elle améliore l’idiomaticité française en donnant à la persévérance un cadre relationnel déjà impliqué par « parmi/auprès de », sans préciser indûment ce que la personne doit faire.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T11:00:24Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le contraste grec est correctement identifié : parmi les personnes sans intelligence/discernement, il faut surveiller le moment propice ; auprès de la personne réfléchie, il faut persévérer ou demeurer continuellement. Toutefois, « demeure assidu » est syntaxiquement et idiomatiquement incomplet en français sans complément ou activité explicite, et rend moins nettement la continuité de ἐνδελέχιζε.'
  naturalness: « Guette le moment opportun » est possible, mais « guetter » peut évoquer une attente à l’affût. « Observe le moment opportun » est plus neutre et convient mieux au registre sapientiel. « Reste constamment auprès de celui qui réfléchit » est naturel et explicite l’implication relationnelle du contexte sans imposer une activité particulière.
  terminology: « personnes sans discernement » rend bien ἀσυνέτων dans un français moderne sans l’invective plus forte d’« insensés ». « Celui qui réfléchit » correspond au singulier participial διανοουμένου et conserve l’idée de réflexion. Aucun terme théologique spécialisé n’est en jeu.
  issues:
  - severity: medium
    issue: « demeure assidu » est elliptique et peu naturel.
    rationale: En français moderne, « être/demeurer assidu » appelle normalement un complément (à une activité, à un lieu, auprès de quelqu’un). La formule ne rend donc pas clairement l’exhortation continue portée par ἐνδελέχιζε.
  - severity: low
    issue: « guette » est légèrement trop marqué.
    rationale: Le grec συντήρησον exprime l’observation attentive du moment favorable ; « observe » préserve cette vigilance sans la connotation possible d’affût.
  revised_text: Parmi les personnes sans discernement, observe le moment opportun ; mais reste constamment auprès de celui qui réfléchit.
