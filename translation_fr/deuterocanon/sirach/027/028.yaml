  text: Mockery and reproach are for the proud[b][a], and vengeance will lie in wait for him like a lion.
translation:
  language: fr
  text: La moquerie et le reproche sont le lot des orgueilleux[a], et la vengeance le guettera comme un lion[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des arrogants ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l''attendra en embuscade, comme un lion ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμπαιγμός
  choice: moquerie
  rationale: Le nom désigne l’action de tourner quelqu’un en dérision. « Moquerie » est courant, précis et s’accorde naturellement avec « reproche ».
- source_word: ὀνειδισμός
  choice: reproche
  rationale: Le terme évoque le blâme, l’opprobre ou l’affront. « Reproche » conserve ici sa portée morale et sociale sans surcharger le texte.
- source_word: ὑπερηφάνων
  choice: des orgueilleux
  rationale: Le génitif pluriel désigne collectivement les personnes orgueilleuses ou arrogantes. « Les orgueilleux » est concis et idiomatique.
- source_word: ἐκδίκησις
  choice: vengeance
  rationale: Le mot désigne une action vengeresse ou une rétribution. « Vengeance » maintient la sévérité de l’avertissement et ne précise pas un agent que le grec ne nomme pas.
- source_word: ἐνεδρεύσει
  choice: guettera
  rationale: Le verbe signifie attendre en embuscade. « Guettera » restitue naturellement l’image prédatrice du lion, tandis qu’une variante plus explicite est donnée en note.
- source_word: αὐτόν
  choice: le
  rationale: Le pronom grec est masculin singulier et individualise un membre de la classe plurielle précédemment mentionnée. Le singulier est conservé plutôt que remplacé par un pluriel.
theological_decisions:
- issue: Rendu du pronom singulier αὐτόν après le pluriel ὑπερηφάνων
  choice: Conserver le masculin singulier « le »
  alternative: Employer « les » ou reformuler par « chacun d’eux »
  rationale: Le grec passe d’une catégorie plurielle à l’individu représentatif. Garder le singulier préserve cette tension grammaticale et la force proverbiale de l’avertissement.
- issue: Degré de force de ἐκδίκησις
  choice: Traduire par « vengeance »
  alternative: « rétribution », « châtiment » ou « justice »
  rationale: « Vengeance » correspond directement à la portée rétributive du terme et à l’image menaçante du lion, sans adoucir ni identifier la source de cette vengeance.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Sont le lot de » rend naturellement la proposition nominale grecque sans en préciser excessivement le rapport logique. Le contraste entre le pluriel « des orgueilleux » et le pronom singulier « le » est volontairement maintenu.
