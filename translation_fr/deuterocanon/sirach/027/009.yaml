  text: Birds settle with their own kind[b][a], and truth returns to those who practice it.
translation:
  language: fr
  text: Les oiseaux iront loger auprès de leurs semblables[a], et la vérité reviendra vers ceux qui la mettent en pratique[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « feront halte auprès de leurs semblables ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ceux qui l’accomplissent ». Le grec personnifie la vérité et dit qu’elle revient vers ceux qui la mettent en œuvre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πετεινὰ
  choice: les oiseaux
  rationale: Le pluriel neutre désigne couramment les oiseaux en général. « Les oiseaux » restitue simplement et naturellement l’image proverbiale.
- source_word: πρὸς τὰ ὅμοια αὐτοῖς
  choice: auprès de leurs semblables
  rationale: La formule exprime la ressemblance et l’affinité. « Leurs semblables » conserve cette idée sans préciser indûment une espèce particulière.
- source_word: καταλύσει
  choice: iront loger
  rationale: Le verbe peut signifier faire halte ou prendre logement. Le futur « iront loger » respecte la forme grecque et convient à l’image d’oiseaux qui viennent se poser parmi leurs semblables.
- source_word: ἀλήθεια
  choice: la vérité
  rationale: Le nom signifie directement « vérité » et garde ici une portée plus large que la seule sincérité.
- source_word: πρὸς τοὺς ἐργαζομένους αὐτὴν
  choice: vers ceux qui la mettent en pratique
  rationale: Avec un complément direct, ἐργάζομαι peut signifier faire, accomplir ou pratiquer. « Mettre la vérité en pratique » exprime en français courant une vérité vécue et agissante.
- source_word: ἐπανήξει
  choice: reviendra
  rationale: Le futur indique un retour, et non une simple venue. « Reviendra » préserve la réciprocité morale et la personnification de la vérité.
theological_decisions:
- issue: Personnification de la vérité et réciprocité morale
  choice: La vérité « reviendra » vers ceux qui la mettent en pratique.
  alternative: La vérité viendra à ceux qui la mettent en pratique.
  rationale: 'ἐπανήξει évoque expressément le fait de revenir. Conserver ce mouvement maintient la tension du proverbe : la vérité est personnifiée comme retournant auprès de ceux qui la vivent, sans réduire l’énoncé à une simple association abstraite.'
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme et les deux futurs du grec sont conservés. « Auprès de leurs semblables » et « mettre en pratique » rendent le sens proverbial sans lourdeur excessive.
