  text: Whoever does evil[a], onto himself it will roll, and he will certainly not know from where it came upon him.
translation:
  language: fr
  text: Celui qui fait le mal[a], le mal roulera sur lui, et il ne saura pas du tout d’où il lui est venu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie l’image du mal qui roule vers celui qui le fait. On peut aussi rendre : « le mal retombera sur lui ».'
    reason: L’image concrète de κυλισθήσεται est maintenue dans le texte; l’alternative idiomatique explicite l’idée de retour sans modifier le sens.
lexical_decisions:
- source_word: ὁ ποιῶν πονηρὰ
  choice: Celui qui fait le mal
  rationale: Le participe présent substantivé a une portée générale. « Celui qui » conserve la forme proverbiale, tandis que « le mal » rend naturellement en français le neutre pluriel substantivé πονηρά.
- source_word: εἰς αὐτὸν κυλισθήσεται
  choice: celui-ci roulera sur lui-même
  rationale: La formulation conserve le mouvement dirigé vers l’auteur du mal et l’image concrète du roulement. « Celui-ci » reflète l’ambiguïté syntaxique du grec, où le sujet grammatical apparent est l’auteur du mal, sans remplacer cette image difficile par une simple idée abstraite de conséquences.
- source_word: οὐ μὴ ἐπιγνῷ
  choice: il ne saura absolument pas
  rationale: La double négation avec le subjonctif exprime une négation fortement emphatique. « Absolument pas » en restitue la force dans un français actuel.
- source_word: πόθεν ἧκε αὐτῷ
  choice: d’où cela lui est venu
  rationale: Cette tournure rend l’origine inconnue et l’arrivée de ce qui atteint l’auteur du mal, tout en restant naturelle en français.
theological_decisions:
- issue: Image de la rétribution du mal
  choice: Conserver l’image de quelque chose qui roule sur l’auteur du mal
  alternative: Le mal qu’il fait retombera sur lui
  rationale: Le verset présente la rétribution morale sous une forme proverbiale et imagée. Une formulation comme « retombera sur lui » serait plus idiomatique, mais effacerait le verbe grec concret « rouler ».
- issue: Ambiguïté du sujet de κυλισθήσεται
  choice: Maintenir dans le texte la référence grammaticale apparente à celui qui fait le mal
  alternative: 'Faire explicitement du mal le sujet : « le mal roulera sur lui »'
  rationale: Le grec transmis place ὁ ποιῶν comme sujet apparent, tandis que le contexte peut suggérer le retour du mal commis. La traduction ne tranche donc pas silencieusement cette tension textuelle et syntaxique.
translation_notes:
  register: 'Français international moderne, sobre et proverbial. La répétition pronominale « celui-ci… lui-même » est volontaire : elle garde perceptible la formulation inhabituelle et l’image directionnelle du grec.'
