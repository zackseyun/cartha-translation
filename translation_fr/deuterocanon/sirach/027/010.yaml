  text: A lion lies in wait for prey[a]; so sins do for those who practice injustice.
translation:
  language: fr
  text: Un lion guette sa proie ; de même, les péchés guettent ceux qui commettent des injustices.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέων
  choice: Un lion
  rationale: Le singulier sans article a ici une valeur proverbiale et générale ; l’article indéfini est naturel en français.
- source_word: θήραν
  choice: sa proie
  rationale: Le nom désigne ce qui est chassé. Le possessif rend idiomatiquement en français le rapport entre le lion et la proie sans modifier l’image.
- source_word: ἐνεδρεύει
  choice: guette
  rationale: Le verbe évoque le fait de se tenir en embuscade. « Guette » conserve l’image prédatrice dans une formulation concise et naturelle ; sa reprise dans le second membre explicite l’ellipse grecque.
- source_word: οὕτως
  choice: de même
  rationale: Cette expression introduit clairement le parallèle proverbial.
- source_word: ἁμαρτίαι
  choice: les péchés
  rationale: Le pluriel concret du grec est conservé, ainsi que la personnification des péchés en prédateurs.
- source_word: ἐργαζομένους
  choice: ceux qui commettent
  rationale: Le participe désigne les personnes qui accomplissent activement les actes en question. « Commettent » s’emploie naturellement avec l’injustice et les actes répréhensibles.
- source_word: ἄδικα
  choice: l’injustice
  rationale: Le neutre pluriel peut désigner des choses ou des actes injustes. « Commettre l’injustice » en donne un équivalent français idiomatique, tandis que la note préserve la forme plus concrète.
theological_decisions:
- issue: Personnification de ἁμαρτίαι
  choice: Les péchés eux-mêmes sont présentés comme guettant les auteurs d’injustice.
  alternative: Les conséquences ou les châtiments des péchés guettent les auteurs d’injustice.
  rationale: Le grec nomme explicitement les « péchés », sans parler de leurs conséquences ni de leur châtiment. La traduction conserve donc cette personnification et sa tension théologique.
translation_notes:
  register: Français moderne, international et proverbial. Le parallélisme est renforcé par la reprise naturelle de « guettent », sous-entendu dans le second membre grec. Le ton reste vif, digne et accessible.
