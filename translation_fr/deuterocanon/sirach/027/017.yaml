  text: Cherish a friend and be faithful to him; but if you reveal his secrets[a], you will certainly not pursue after him.
translation:
  language: fr
  text: Chéris un ami et montre-toi fidèle envers lui ; mais si tu dévoiles ses secrets, tu ne courras certainement pas après lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne cours surtout pas après lui ». Le grec peut s’entendre comme l’annonce d’une conséquence ou, de manière moins probable, comme une interdiction.'
    reason: alternative_reading
lexical_decisions:
- source_word: στέργον
  choice: Chéris
  rationale: L’impératif exprime une affection chaleureuse et durable. « Chéris » conserve cette nuance de profond attachement dans un français naturel et digne.
- source_word: φίλον
  choice: un ami
  rationale: Le nom est employé comme complément sans déterminant exprimé en grec ; « un ami » convient au caractère proverbial de la phrase.
- source_word: πιστώθητι μετʼ αὐτοῦ
  choice: montre-toi fidèle envers lui
  rationale: Le passif-moyen peut exprimer le fait de se révéler ou de devenir digne de confiance. « Montre-toi fidèle envers lui » rend clairement la fidélité relationnelle, tandis que « envers » est plus idiomatique ici qu’un calque de μετά, « avec ».
- source_word: ἀποκαλύψῃς
  choice: tu dévoiles
  rationale: Le verbe signifie découvrir ou divulguer ce qui était caché. « Dévoiler » s’emploie naturellement avec des secrets.
- source_word: τὰ μυστήρια αὐτοῦ
  choice: ses secrets
  rationale: Dans ce contexte d’amitié et de confiance, μυστήρια désigne des confidences ou des affaires secrètes, non des mystères religieux.
- source_word: οὐ μὴ
  choice: ne… certainement plus
  rationale: La construction οὐ μή avec le subjonctif constitue une négation fortement emphatique. « Certainement » en maintient la force, et « plus » explicite la rupture résultant de la divulgation dans le contexte.
- source_word: καταδιώξῃς ὀπίσω αὐτοῦ
  choice: tu courras… après lui
  rationale: Cette formulation conserve l’image grecque d’une poursuite à la suite de l’ami, tout en restant intelligible en français courant.
theological_decisions:
- issue: Valeur de la proposition finale après la trahison d’un secret
  choice: 'La proposition est rendue comme une conséquence proverbiale : après avoir dévoilé les secrets de l’ami, on ne courra certainement plus après lui.'
  alternative: Ne cours surtout pas après lui.
  rationale: La deuxième personne avec οὐ μή et le subjonctif se prête naturellement à une prédiction emphatique, mais une défense demeure grammaticalement possible. La note conserve cette ambiguïté sans imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, proverbial et digne. Le tutoiement singulier correspond aux impératifs et verbes grecs à la deuxième personne du singulier. La ponctuation met en relief le contraste entre fidélité et rupture de confiance.
