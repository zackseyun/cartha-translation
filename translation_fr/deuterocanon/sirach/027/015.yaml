  source_fidelity: Le sens général est fidèle, mais « fait couler le sang » transforme la prédication nominale grecque (« est une effusion de sang ») en relation causale. Cette explicitation est possible, mais une formulation française qui conserve l’identification proverbiale est préférable. « Le combat » rend bien μάχη, dont la force peut dépasser un simple désaccord verbal.
  naturalness: Le texte principal est naturel. La note, en revanche, contient « un bruit mauvais », formulation peu idiomatique en français moderne. « Une mauvaise nouvelle » rend l’autre sens possible de ἀκοή (« nouvelle, rapport ») de manière naturelle, tout en signalant qu’il s’agit d’une option plus littérale/formelle.
  terminology: « Orgueilleux », « effusion de sang », « injures » et « pénibles à entendre » sont appropriés au registre sapientiel et rendent respectivement ὑπερήφανοι, ἔκχυσις αἵματος, διαλοιδόρησις et ἀκοὴ μοχθηρά. Aucune surcharge théologique n’est introduite.
