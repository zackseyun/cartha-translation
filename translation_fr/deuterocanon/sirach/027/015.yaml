translation:
  language: fr
  text: Le combat des orgueilleux est une effusion de sang[a], et leurs injures sont pénibles à entendre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le combat des orgueilleux est une effusion de sang, et leurs outrages sont une mauvaise nouvelle. » Le grec peut aussi être rendu de façon plus littérale ; ἀκοή peut désigner ce qui est entendu ou une nouvelle, un rapport.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκχυσις αἵματος
  choice: fait couler le sang
  rationale: L’expression grecque signifie littéralement « effusion de sang ». La tournure verbale française exprime naturellement l’issue violente du conflit.
- source_word: μάχη
  choice: conflit
  rationale: Le terme peut désigner une bataille, une lutte ou une querelle. « Conflit » convient à cette maxime de sagesse tout en conservant la possibilité d’un affrontement violent.
- source_word: ὑπερηφάνων
  choice: des orgueilleux
  rationale: Le génitif caractérise les personnes par leur orgueil ou leur arrogance. « Les orgueilleux » est clair, concis et moralement précis.
- source_word: διαλοιδόρησις
  choice: insultes
  rationale: Le nom désigne des paroles outrageantes ou injurieuses. « Insultes » est courant et restitue directement la violence verbale.
- source_word: ἀκοὴ μοχθηρά
  choice: pénibles à entendre
  rationale: ἀκοή peut signifier l’audition ou ce qui est entendu, tandis que μοχθηρά évoque ce qui est mauvais, pénible ou affligeant. Cette formulation rend idiomatiquement le sens sans exclure la lecture plus littérale « un mauvais bruit ».
theological_decisions:
- issue: Lien entre l’orgueil, la violence physique et la violence verbale
  choice: 'Présenter le verset comme une observation sapientielle : le conflit des orgueilleux conduit à l’effusion de sang, et leurs insultes affligent ceux qui les entendent.'
  alternative: 'Comprendre μάχη comme une bataille formelle et ἀκοή comme une nouvelle ou un bruit rapporté : « La bataille des orgueilleux est une effusion de sang, et leurs outrages sont un mauvais bruit. »'
  rationale: Le grec permet une formulation assez littérale, mais le contexte sapientiel favorise une maxime générale sur les effets destructeurs de l’orgueil. La traduction maintient le parallélisme entre violence physique et violence verbale sans introduire d’interprétation confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. « Fait couler le sang » est plus naturel que « est une effusion de sang », tandis que la note conserve la structure plus formelle et l’ambiguïté de ἀκοή.
