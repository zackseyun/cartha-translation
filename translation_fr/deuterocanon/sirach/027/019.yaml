  text: And as a bird from your hand you have let go[a], so you have let your neighbor go, and you will not catch him.
translation:
  language: fr
  text: Comme un oiseau que tu as lâché de ta main, ainsi tu as laissé partir ton prochain, et tu ne le rattraperas pas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu ne le chasseras pas ». Le verbe grec évoque l’action de chasser.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πετεινὸν
  choice: un oiseau
  rationale: Le nom désigne largement un oiseau; ce terme courant et naturel convient à la comparaison.
- source_word: ἐκ χειρός σου
  choice: de ta main
  rationale: Cette formulation conserve l’image concrète de l’oiseau relâché de la main.
- source_word: ἀπέλυσας
  choice: tu as laissé s’envoler
  rationale: Le verbe signifie relâcher ou laisser aller. « Laissé s’envoler » exprime naturellement en français le lâcher de l’oiseau, sans suggérer nécessairement une fuite involontaire.
- source_word: ἀφῆκας
  choice: tu as laissé partir
  rationale: Dans le parallélisme avec ἀπέλυσας, le verbe évoque le fait de laisser aller quelqu’un. La légère variation française évite une tournure artificielle tout en maintenant l’analogie.
- source_word: τὸν πλησίον
  choice: ton prochain
  rationale: « Prochain » conserve la portée relationnelle et éthique habituelle du terme dans la littérature sapientielle.
- source_word: οὐ θηρεύσεις αὐτόν
  choice: tu ne le rattraperas pas
  rationale: Le verbe appartient au champ lexical de la chasse. « Rattraper » exprime ici de façon idiomatique l’impossibilité de reprendre celui qu’on a laissé partir, tout en restant compatible avec l’image de l’oiseau.
theological_decisions:
- issue: Faut-il rendre explicitement l’image de la chasse dans le dernier verbe ou privilégier le résultat de l’action ?
  choice: tu ne le rattraperas pas
  alternative: tu ne le prendras pas à la chasse
  rationale: Le grec évoque la chasse, mais le propos immédiat porte sur l’impossibilité de récupérer une relation après avoir laissé partir le prochain. « Rattraper » communique clairement ce résultat, tandis qu’une note préserve l’image lexicale du grec.
translation_notes:
  register: Français moderne, naturel et digne. Le tutoiement conserve les formes grecques à la deuxième personne du singulier. Le parallélisme entre l’oiseau et le prochain est maintenu, avec une formulation idiomatique dans chaque membre.
