  text: Do not pursue him[a], for he has gone far away[b], and has escaped like a gazelle from a snare.
translation:
  language: fr
  text: Ne le poursuis pas[a], car il est parti loin et s’est échappé comme une gazelle d’un piège[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ne le pourchasse pas ». Le verbe grec peut désigner plus généralement l’action de poursuivre quelqu’un.
    reason: lexical_alternative
  - marker: b
    text: Le mot grec rendu par « gazelle » peut aussi désigner un chevreuil ou une antilope.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ αὐτὸν διώξῃς
  choice: Ne le poursuis pas
  rationale: διώκω signifie couramment « poursuivre » ou « pourchasser ». « Poursuis » conserve la force de l’interdiction sans introduire l’idée plus précise de persécution; le pronom masculin singulier αὐτόν est rendu par « le ».
- source_word: μακρὰν ἀπέστη
  choice: il s’est éloigné
  rationale: ἀφίστημι exprime ici l’éloignement ou le retrait, tandis que μακράν en souligne la distance. En français, « s’est éloigné » rend naturellement les deux éléments sans lourdeur.
- source_word: ἐξέφυγεν
  choice: il s’est échappé
  rationale: Le verbe désigne le fait de s’enfuir avec succès ou d’échapper à un danger; le passé composé convient à l’action accomplie décrite ici.
- source_word: ὡς δορκὰς
  choice: comme une gazelle
  rationale: δορκάς désigne une gazelle ou un animal proche du chevreuil. « Gazelle » est l’équivalent moderne le plus clair et préserve l’image de rapidité.
- source_word: ἐκ παγίδος
  choice: prise au piège
  rationale: παγίς désigne un piège ou un collet. La tournure française « une gazelle prise au piège » explicite naturellement la relation exprimée en grec par ἐκ après le verbe d’évasion, sans changer l’image.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La coordination et l’image animale du grec sont conservées; les formulations inutilement archaïques ou susceptibles de suggérer une persécution religieuse sont évitées.
