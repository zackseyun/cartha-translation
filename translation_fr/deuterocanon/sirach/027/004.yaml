  text: When a sieve is shaken[a], the refuse remains; so a person's filth is revealed in his thoughts.
translation:
  language: fr
  text: Quand on secoue un tamis, les déchets restent ; de même, les saletés d’une personne se révèlent dans son raisonnement.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ainsi, les saletés d’une personne dans son raisonnement » ; le grec n’exprime pas le verbe du second membre. Les mots traduits par « déchets » et « saletés » peuvent aussi désigner du fumier, des ordures ou des excréments.'
    reason: ellipse grecque et éventail lexical volontairement grossier
lexical_decisions:
- source_word: ἐν σείσματι κοσκίνου
  choice: Quand on secoue un tamis
  rationale: Cette tournure rend naturellement la circonstance exprimée par ἐν avec le nom d’action σείσματι, tout en conservant l’image proverbiale du tamis.
- source_word: διαμενεῖ
  choice: restent
  rationale: Le verbe exprime ce qui demeure ou reste en place après le tamisage.
- source_word: κοπρία
  choice: les déchets
  rationale: Le mot peut désigner du fumier ou des excréments, mais, dans l’image du tamis, il évoque plus largement les matières grossières qui restent.
- source_word: σκύβαλα
  choice: les saletés
  rationale: Le terme désigne des rebuts, des ordures, voire des excréments. « Saletés » conserve la rudesse de l’image et permet son application figurée à la personne.
- source_word: ἀνθρώπου
  choice: d’une personne
  rationale: ἄνθρωπος a ici une portée générique dans un proverbe ; « une personne » exprime cette portée avec naturel en français moderne.
- source_word: ἐν λογισμῷ αὐτοῦ
  choice: dans son raisonnement
  rationale: λογισμός peut désigner la pensée, la réflexion ou le raisonnement. « Raisonnement » garde l’idée d’une activité intérieure réfléchie plutôt que de simples pensées passagères.
theological_decisions:
- issue: Portée générique de ἀνθρώπου
  choice: d’une personne
  alternative: d’un homme
  rationale: Le masculin singulier grec représente ici tout être humain. Le français générique « une personne » transmet cette portée sans introduire de restriction masculine.
- issue: Verbe sous-entendu dans le second membre
  choice: se révèlent
  alternative: restent
  rationale: Le grec juxtapose littéralement « ainsi, les saletés d’une personne dans son raisonnement » sans verbe exprimé. Dans la comparaison proverbiale, « se révèlent » explicite avec naturel la fonction révélatrice du tamisage sans transformer l’image en affirmation doctrinale.
translation_notes:
  register: Français international moderne, proverbial et digne. La formulation reste concrète et légèrement rude, comme le grec, sans employer un vocabulaire inutilement vulgaire.
