  source_fidelity: 'Le sens général est bien rendu : l’interdiction de louer prématurément, la pensée/le raisonnement comme critère, et « l’épreuve » pour πειρασμός correspondent au grec. Toutefois, « avant qu’il ait fait connaître sa pensée » introduit plus explicitement que le grec l’idée que l’homme divulgue activement sa pensée. λογισμός désigne la pensée, la réflexion ou le raisonnement, sans préciser le mode de sa manifestation.'
  naturalness: Le français est clair et d’un registre proverbial approprié. « Avant de connaître sa pensée » est à la fois plus concis, plus naturel et moins interprétatif. La formulation de la note « avant réflexion » est elliptique en français ; « avant de connaître sa réflexion » ou la traduction littérale proposée ci-dessous est préférable.
