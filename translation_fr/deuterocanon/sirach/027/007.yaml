  text: Do not praise a man before he speaks his mind[b][a], for this is the test of men.
translation:
  language: fr
  text: Ne fais pas l’éloge d’un homme avant de connaître sa pensée[a], car c’est là l’épreuve des êtres humains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « avant de connaître sa réflexion » ou « avant de connaître son raisonnement ». Le grec dit littéralement : « Avant la pensée/le raisonnement, ne fais pas l’éloge d’un homme. »'
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie ici des formes masculines dans une maxime qui concerne les êtres humains en général.
    reason: cultural_note
lexical_decisions:
- source_word: πρὸ λογισμοῦ
  choice: avant qu’il ait fait connaître sa pensée
  rationale: Littéralement « avant la pensée/le raisonnement ». Dans ce proverbe, il s’agit d’attendre que la pensée ou le jugement d’une personne se manifeste avant de l’approuver. Cette formulation est naturelle en français tout en conservant l’ambiguïté lexicale dans une note.
- source_word: μὴ ἐπαινέσῃς
  choice: Ne fais pas l’éloge
  rationale: L’aoriste subjonctif avec μή exprime ici une interdiction. « Faire l’éloge » rend directement l’idée d’approuver ou de louer quelqu’un.
- source_word: ἄνδρα
  choice: d’un homme
  rationale: Le grec emploie le masculin singulier dans une maxime de portée générale. Le texte principal conserve cette forme source, tandis qu’une note en précise l’usage proverbial.
- source_word: οὗτος
  choice: c’est là
  rationale: Le démonstratif renvoie à ce qui précède, à savoir la manifestation de la pensée comme moyen d’éprouver une personne.
- source_word: πειρασμὸς
  choice: l’épreuve
  rationale: Dans ce contexte sapientiel, le terme désigne ce qui met à l’épreuve ou révèle la valeur d’une personne, non une tentation au sens moral.
- source_word: ἀνθρώπων
  choice: des êtres humains
  rationale: Le génitif pluriel a une portée générique. « Êtres humains » exprime clairement cette universalité en français moderne.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La tournure « fait connaître sa pensée » explicite le sens pratique du proverbe sans réduire dans la note l’éventail de λογισμός, qui peut désigner la pensée, la réflexion ou le raisonnement.
