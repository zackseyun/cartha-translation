  text: For a wound may be bound up, and after insults there may be reconciliation; but one who has revealed secrets has lost hope.
translation:
  language: fr
  text: Car une blessure peut être pansée, et après des insultes, la réconciliation est possible ; mais celui qui a révélé des secrets a perdu espoir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « est sans espoir » ou « a désespéré ». Le grec ne précise pas ce dont cette personne a perdu l’espoir ; dans le contexte, il s’agit probablement de retrouver la confiance après avoir trahi un secret.
    reason: Alternative lexicale et ambiguïté de l’objet implicite du verbe.
lexical_decisions:
- source_word: τραῦμά
  choice: une blessure
  rationale: Le nom désigne concrètement une blessure physique et conserve l’image qui sert de point de comparaison avec le tort relationnel.
- source_word: καταδῆσαι
  choice: peut être pansée
  rationale: Le verbe évoque le fait de bander ou panser une blessure. Cette tournure française rend naturellement la construction impersonnelle grecque.
- source_word: λοιδορίας
  choice: des insultes
  rationale: Le terme désigne des paroles outrageantes ou injurieuses. « Insultes » est clair, actuel et fidèle au contexte interpersonnel.
- source_word: διαλλαγή
  choice: la réconciliation est possible
  rationale: Le nom exprime le rétablissement de relations rompues. L’ajout idiomatique de « est possible » restitue la construction elliptique parallèle à la première proposition.
- source_word: ἀποκαλύψας
  choice: celui qui a révélé
  rationale: Le participe aoriste présente la divulgation comme l’acte accompli qui conduit à l’état exprimé ensuite.
- source_word: μυστήρια
  choice: des secrets
  rationale: Dans ce contexte sapientiel, le mot désigne des choses confidentielles, non des mystères au sens doctrinal.
- source_word: ἀφήλπισεν
  choice: a perdu tout espoir
  rationale: Le verbe signifie perdre ou abandonner l’espoir. La traduction laisse volontairement inexprimé l’objet de cet espoir, comme le grec.
theological_decisions:
- issue: Portée de la proposition finale ὁ δὲ ἀποκαλύψας μυστήρια ἀφήλπισεν
  choice: La personne qui a divulgué des secrets a perdu tout espoir, sans préciser dans le texte principal l’objet de cet espoir.
  alternative: La personne est désormais sans espoir au sens moral absolu, ou bien elle est personnellement tombée dans le désespoir.
  rationale: Le contexte suggère probablement l’espoir d’une confiance ou d’une relation rétablie, mais le grec demeure elliptique. La traduction et la note préservent cette tension sans imposer une interprétation absolue.
translation_notes:
  register: Français international moderne, naturel et digne. « Panser » maintient l’image concrète sans archaïsme marqué ; la structure proverbiale et le contraste entre réparation possible et confiance trahie sont conservés.
