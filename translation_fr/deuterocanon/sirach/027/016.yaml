  text: Whoever reveals secrets destroys trust[b][a], and will never find a friend for his soul.
translation:
  language: fr
  text: Qui révèle des secrets[a] détruit la confiance et ne trouvera jamais un ami vraiment proche de lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des mystères » ou « des confidences ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, en grec, « un ami pour son âme » : c’est-à-dire un ami véritablement proche de lui ou qui lui corresponde profondément.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ἀποκαλύπτων
  choice: Qui révèle
  rationale: Le participe présent substantivé énonce une vérité générale. « Qui révèle » rend naturellement la portée proverbiale.
- source_word: μυστήρια
  choice: des secrets
  rationale: Dans ce contexte de relations humaines, il s’agit de choses privées confiées à quelqu’un, plutôt que de mystères théologiques.
- source_word: ἀπώλεσεν
  choice: détruit
  rationale: L’aoriste présente la conséquence comme certaine et accomplie; le présent français convient au style proverbial tout en conservant la force du verbe.
- source_word: πίστιν
  choice: la confiance
  rationale: Le contexte de confidences trahies et d’amitié indique ici la confiance relationnelle, non la foi au sens théologique.
- source_word: οὐ μὴ εὕρῃ
  choice: ne trouvera jamais
  rationale: La construction οὐ μή avec le subjonctif exprime une négation future fortement emphatique.
- source_word: φίλον
  choice: d’ami
  rationale: Le singulier indéfini s’intègre naturellement à la formulation proverbiale française.
- source_word: πρὸς τὴν ψυχὴν αὐτοῦ
  choice: qui lui soit intimement proche
  rationale: Cette formulation rend le sens relationnel de l’expression idiomatique tout en évitant le peu naturel « un ami pour son âme »; la note conserve l’image grecque.
theological_decisions:
- issue: Sens de πίστις dans un contexte sapientiel non théologique
  choice: la confiance
  alternative: la foi; la fidélité
  rationale: Le dévoilement de secrets entraîne ici la perte de la confiance nécessaire à l’amitié. « Foi » introduirait une connotation doctrinale que le contexte n’exige pas.
- issue: Expression πρὸς τὴν ψυχὴν αὐτοῦ
  choice: qui lui soit intimement proche
  alternative: pour son âme; selon son âme
  rationale: Le français courant exprime ainsi l’idée d’un ami véritablement proche de la personne. Une note signale la formulation grecque afin de préserver son image et son ambiguïté.
translation_notes:
  register: Français international moderne, concis et proverbial. Le tour générique « Qui révèle » évite d’alourdir la phrase tout en restant fidèle au sujet grec. La seconde proposition privilégie une expression française naturelle, avec une note pour conserver l’image de l’âme.
