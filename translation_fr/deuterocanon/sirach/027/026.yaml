  text: The one who digs a pit will fall into it, and the one who sets a snare will be caught in it.
translation:
  language: fr
  text: Celui qui creuse une fosse y tombera, et celui qui tend un piège s’y fera prendre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ὀρύσσων
  choice: celui qui creuse
  rationale: Le participe présent substantivé désigne toute personne qui accomplit l’action; « celui qui » conserve la forme proverbiale dans un français naturel.
- source_word: βόθρον
  choice: une fosse
  rationale: « Fosse » rend bien l’image d’un trou creusé pouvant servir de piège et garde un registre proverbial digne.
- source_word: εἰς αὐτὸν
  choice: y
  rationale: Le pronom renvoie naturellement à la fosse; « y » exprime avec concision le mouvement vers l’intérieur.
- source_word: ἐμπεσεῖται
  choice: tombera
  rationale: Le futur est conservé directement; avec « y », le verbe rend pleinement l’idée de tomber dans la fosse.
- source_word: ὁ ἱστῶν
  choice: celui qui tend
  rationale: Dans ce contexte, ἵστημι signifie mettre ou disposer un piège; « tendre un piège » est la collocation française la plus naturelle.
- source_word: παγίδα
  choice: un piège
  rationale: « Piège » est clair et courant tout en conservant l’image proverbiale de παγίς.
- source_word: ἐν αὐτῇ
  choice: s’y
  rationale: Le pronom féminin renvoie au piège; intégré à « s’y faire prendre », il préserve le lien référentiel dans un français idiomatique.
- source_word: ἁλώσεται
  choice: se fera prendre
  rationale: Le futur passif signifie être pris ou capturé. « Se fera prendre » convient naturellement à l’image du piège et maintient l’idée que l’auteur du mal en subit lui-même l’effet.
