- from: Devant toi, il rend ses paroles douces et s’émerveille de ce que tu dis ; mais ensuite, il déforme ses propos et se sert de tes paroles pour te faire trébucher.[a]
  to: Devant toi, il te flatte et s’émerveille de tes paroles ; mais ensuite, il déforme ses propos et fait de tes paroles une occasion de chute.[a]
  rationale: La révision supprime l’ajout non justifié de « te » dans la dernière proposition et formule le rapport entre les paroles de l’interlocuteur et le σκάνδαλον de manière ouverte. Elle ajoute une note sur la difficulté textuelle et idiomatique de la première proposition, tout en préservant une lecture française moderne et intelligible.
