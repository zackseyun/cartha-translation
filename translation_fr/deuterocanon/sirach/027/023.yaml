  text: Before your eyes his mouth speaks sweetly[a], and he will marvel at your words; but afterward he will twist his mouth and, in regard to your words, he will cause offense.
translation:
  language: fr
  text: Devant toi, il te flatte et s’émerveille de tes paroles ; mais ensuite, il déforme ses propos et fait de tes paroles une occasion de chute.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il provoquera une offense à propos de tes paroles ». Le grec σκάνδαλον peut désigner une offense, un obstacle ou un piège qui fait trébucher. Plus haut, le texte grec porte littéralement « il adoucira ta bouche », expression difficile; « il te flatte » en rend le sens dans ce contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέναντι τῶν ὀφθαλμῶν σου
  choice: Devant toi
  rationale: Rend naturellement l’idée d’une conduite adoptée en présence de l’interlocuteur, sans perdre l’opposition avec « ensuite ».
- source_word: γλυκανεῖ στόμα σου
  choice: il rend ses paroles douces
  rationale: Le grec transmis lit littéralement « il adoucira ta bouche », tournure difficile dans le contexte et possiblement affectée par une variation textuelle. La traduction exprime l’idée contextuelle de paroles flatteuses tout en évitant l’expression française peu naturelle « adoucir sa bouche ».
- source_word: ἐκθαυμάσει
  choice: s’émerveille
  rationale: Conserve la forte manifestation d’admiration exprimée par le verbe grec, qui peut être feinte dans ce contexte.
- source_word: ὕστερον δὲ
  choice: mais ensuite
  rationale: Marque clairement le contraste temporel entre la flatterie en face et la conduite ultérieure.
- source_word: διαστρέψει τὸ στόμα αὐτοῦ
  choice: il déforme ses propos
  rationale: Rend l’image d’une bouche rendue tortueuse par une formulation française intelligible, appliquée à la parole trompeuse ou hostile.
- source_word: ἐν τοῖς λόγοις σου δώσει σκάνδαλον
  choice: se sert de tes paroles pour te faire trébucher
  rationale: Exprime la valeur instrumentale possible de ἐν et la force causative de δίδωμι σκάνδαλον, tout en conservant l’image du piège ou de l’obstacle plutôt que de réduire le sens à une simple offense ressentie.
theological_decisions:
- issue: Sens de σκάνδαλον
  choice: te faire trébucher
  alternative: causer du scandale / susciter une offense à propos de tes paroles
  rationale: Dans ce contexte de duplicité, l’image d’un obstacle ou d’un piège correspond bien à l’usage des paroles de quelqu’un contre lui. La note maintient l’étendue sémantique du grec.
translation_notes:
  register: Français moderne, sobre et digne. Le parallélisme entre la flatterie présente et la malveillance ultérieure est mis en relief. La difficulté textuelle de γλυκανεῖ στόμα σου est traitée prudemment dans le corps du verset sans alourdir la lecture.
