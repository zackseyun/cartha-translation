review_pass:
  verdict: revise
  source_fidelity: La seconde moitié du verset grec ne désigne pas explicitement la personne qui trébuche. La formulation « pour te faire trébucher » ajoute donc un destinataire (« te ») absent de ἐν τοῖς λόγοις σου δώσει σκάνδαλον. La révision conserve le rapport instrumental ou circonstanciel, sans le préciser indûment. La première expression est difficile dans le texte grec fourni (στόμα σου, litt. « ta bouche »); « il te flatte » est une restitution contextuelle naturelle, signalée en note.
  naturalness: Le français révisé est fluide et contemporain. « Faire de tes paroles une occasion de chute » rend la portée de σκάνδαλον sans imposer l’idée plus étroite qu’il te ferait personnellement trébucher.
  terminology: « Occasion de chute » maintient l’image de σκάνδαλον, tandis que la note conserve les possibilités « offense », « obstacle » et « piège ». « Déforme ses propos » rend de façon idiomatique l’image de διαστρέψει τὸ στόμα αὐτοῦ, appliquée à une parole devenue perverse ou hostile.
  issues:
  - severity: medium
    issue: Ajout d’un destinataire dans « pour te faire trébucher »
    rationale: Le grec ne contient aucun pronom équivalent à « te » dans la dernière proposition. Il faut éviter d’affirmer que la personne visée est nécessairement l’interlocuteur.
  - severity: low
    issue: La difficulté de στόμα σου n’est pas signalée dans la note
    rationale: Le texte grec donné porte littéralement « ta bouche », alors que le sens contextuel et la traduction française emploient une expression de flatterie. Une note brève permet de ne pas masquer cette difficulté.
