  text: If he does not hold fast with diligence in the fear of the Lord[a], his house will quickly be overthrown.
translation:
  language: fr
  text: Si quelqu’un ne s’attache pas avec diligence à la crainte du Seigneur, sa maison[a] sera bientôt détruite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa maisonnée sera bientôt ruinée ». Le mot grec traduit par « maison » peut désigner non seulement un bâtiment, mais aussi la maisonnée ou l’établissement familial d’une personne.
    reason: alternative lexicale préservant l’étendue de sens de οἶκος
lexical_decisions:
- source_word: ἐὰν μὴ
  choice: Si quelqu’un ne… pas
  rationale: Cette tournure conditionnelle est naturelle en français. « Quelqu’un » explicite sobrement le sujet sous-entendu du verbe grec sans en préciser davantage l’identité.
- source_word: ἐν φόβῳ Κυρίου
  choice: dans la crainte du Seigneur
  rationale: Cette expression biblique consacrée conserve la portée sapientielle et théologique de la crainte révérencielle envers Dieu, sans la réduire à la seule révérence ou à la piété.
- source_word: κρατήσῃ
  choice: se maintient
  rationale: Dans ce contexte, le verbe exprime le fait de tenir ferme ou de persévérer. « Se maintient » s’emploie naturellement avec « dans la crainte du Seigneur » et garde l’idée de constance.
- source_word: κατὰ σπουδήν
  choice: avec diligence
  rationale: La locution indique l’empressement, le sérieux et le soin avec lesquels il faut tenir ferme. « Avec diligence » en conserve la force sans ajouter l’idée plus particulière de zèle.
- source_word: ἐν τάχει
  choice: vite
  rationale: Le terme marque la rapidité de la conséquence. « Vite » est clair et courant en français moderne.
- source_word: καταστραφήσεται
  choice: sera renversée
  rationale: Le futur passif évoque une chute ou une ruine. « Sera renversée » préserve cette image vive et convient aussi bien à la maison qu’à la maisonnée.
- source_word: αὐτοῦ ὁ οἶκος
  choice: sa maison
  rationale: Le grec peut désigner le bâtiment, la maisonnée ou l’établissement familial. « Sa maison » conserve cette image et sa largeur de sens, explicitées en note.
theological_decisions:
- issue: Sens de « crainte du Seigneur »
  choice: Conserver l’expression biblique « crainte du Seigneur »
  alternative: « respect du Seigneur » ou « révérence envers le Seigneur »
  rationale: L’expression possède un poids théologique particulier dans la littérature sapientielle. La conserver maintient les échos intertextuels et évite d’en réduire la tension à un simple sentiment de respect.
- issue: Étendue du sens de οἶκος
  choice: « sa maison » dans le texte principal
  alternative: « sa maisonnée », « sa famille » ou « son domaine »
  rationale: Le grec ne tranche pas entre le bâtiment et l’ensemble familial ou domestique. Le texte principal garde donc le terme large, tandis que la note signale les autres sens possibles.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du grec tout en étant naturelle; l’expression sapientielle traditionnelle « crainte du Seigneur » et l’ambiguïté de « maison » sont conservées.
