  text: Resentment and anger—these also are abominations[b][a], and a sinful man will cling to them.
translation:
  language: fr
  text: La rancune et la colère — ce sont là aussi des abominations[a] — et l’homme pécheur s’y attachera[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la fureur et la colère ». Μῆνις peut désigner une colère profonde, durable ou vindicative, tandis que ὀργή est un terme plus général pour la colère.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « sera ἐγκρατής d’elles ». L’expression grecque est difficile. Elle est comprise ici au sens de s’attacher à ces vices ou de les retenir fermement; le mot peut aussi, dans d’autres contextes, exprimer la maîtrise de soi.
    reason: alternative_reading
lexical_decisions:
- source_word: Μῆνις
  choice: rancune
  rationale: Le terme peut désigner une colère profonde, durable, voire vindicative. « Rancune » rend cette disposition persistante et la distingue de ὀργή.
- source_word: ὀργή
  choice: colère
  rationale: Terme courant pour la colère; ce choix est naturel en français moderne et évite de redoubler « rancune » par un mot trop proche.
- source_word: βδελύγματα
  choice: abominations
  rationale: Le mot désigne des réalités tenues pour détestables ou répugnantes. « Abominations » conserve la forte portée morale et religieuse du grec.
- source_word: ἀνὴρ ἁμαρτωλὸς
  choice: l’homme pécheur
  rationale: Le grec emploie explicitement un nom masculin singulier accompagné de l’adjectif « pécheur »; la formulation française en respecte la forme représentative sans la neutraliser.
- source_word: ἐγκρατὴς ἔσται αὐτῶν
  choice: s’y agrippera
  rationale: La construction avec le génitif est difficile. Dans ce contexte négatif, elle semble exprimer l’emprise ferme que l’homme pécheur maintient sur ces passions, c’est-à-dire son attachement à elles. « S’y agrippera » restitue cette idée tout en laissant une note signaler l’ambiguïté.
theological_decisions:
- issue: Portée anthropologique du masculin ἀνήρ
  choice: l’homme pécheur
  alternative: la personne pécheresse
  rationale: Le texte source est explicitement masculin singulier, même si l’énoncé peut avoir une portée générale. La traduction conserve cette donnée grammaticale sans ajouter de précision doctrinale.
- issue: Sens de ἐγκρατής dans un contexte de condamnation morale
  choice: s’y agrippera
  alternative: saura les maîtriser
  rationale: Le sens habituel de ἐγκρατής peut évoquer la maîtrise de soi, mais une lecture positive créerait ici une forte tension avec la dénonciation de la rancune et de la colère. Le contexte favorise l’idée de les retenir ou de s’y attacher; l’incertitude réelle est conservée dans la note.
translation_notes:
  register: Français international moderne, naturel et digne. Le tiret met en relief l’évaluation morale sans alourdir la phrase. « Rancune » distingue clairement la colère durable de la colère au sens général; « s’y agrippera » rend de façon idiomatique une construction grecque obscure, explicitée en note.
