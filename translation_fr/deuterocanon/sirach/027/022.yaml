  text: One who winks with the eye devises evil things[a], and no one will turn him away from them.
translation:
  language: fr
  text: Celui qui fait un signe de l’œil trame le mal, et personne ne l’en détournera.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte littéralement « de lui » ou « de cela ». Le pronom, au singulier, renvoie vraisemblablement au mal qui vient d’être mentionné.
    reason: lexical_alternative
lexical_decisions:
- source_word: διανεύων
  choice: fait un signe
  rationale: Le participe désigne l’action de communiquer par un geste ou un signe. Avec « de l’œil », il évoque naturellement un signal discret ou complice; cette formulation reste plus large que « fait un clin d’œil ».
- source_word: ὀφθαλμῷ
  choice: de l’œil
  rationale: Le datif est instrumental. « Faire un signe de l’œil » est une tournure française naturelle qui n’ajoute pas de possessif absent du grec.
- source_word: τεκταίνει
  choice: trame
  rationale: Le verbe signifie littéralement façonner ou construire, puis, dans un contexte moral, machiner ou préparer intentionnellement. « Trame » restitue avec naturel l’idée d’un dessein mauvais.
- source_word: κακά
  choice: le mal
  rationale: Le neutre pluriel désigne des choses mauvaises ou des méfaits. Le collectif français « le mal » en préserve ici la portée générale sans préciser indûment la forme des actes projetés.
- source_word: οὐδεὶς
  choice: personne ne
  rationale: Équivalent français direct et idiomatique du pronom négatif.
- source_word: ἀποστήσει
  choice: détournera
  rationale: Le futur causatif exprime l’idée de faire s’éloigner ou renoncer. « Détourner quelqu’un de » convient au contexte moral et conserve l’idée de séparation.
- source_word: ἀπʼ αὐτοῦ
  choice: en
  rationale: Le pronom grec est au singulier (« de cela/de lui »), alors que κακά est pluriel. Le pronom adverbial « en » renvoie naturellement en français au mal qui vient d’être mentionné tout en évitant de trancher artificiellement le décalage grammatical.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et sentencieux. « Faire un signe de l’œil » conserve l’idée d’un signal furtif sans imposer le geste plus précis du clin d’œil; « tramer le mal » rend l’image d’une action intentionnellement élaborée.
