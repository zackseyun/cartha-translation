  text: For just as a man has destroyed his enemy[a], so you have destroyed the friendship of your neighbor;
translation:
  language: fr
  text: Car, de même qu’un homme a détruit son ennemi, ainsi tu as détruit l’amitié de ton prochain[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «l’amitié avec ton prochain». Le génitif grec peut désigner soit l’amitié du prochain, soit l’amitié entretenue avec lui.
    reason: ambiguïté grammaticale et lexicale
lexical_decisions:
- source_word: καθὼς γὰρ … οὕτως
  choice: Car, de même que… ainsi
  rationale: Cette tournure conserve à la fois la valeur explicative de γάρ et la structure comparative corrélative du grec.
- source_word: ἀπώλεσεν … ἀπώλεσας
  choice: a détruit… tu as détruit
  rationale: La répétition du même verbe restitue celle du grec et maintient la force du parallèle entre le sort de l’ennemi et celui de l’amitié.
- source_word: ἄνθρωπος
  choice: un homme
  rationale: Dans cette maxime, le singulier masculin grec présente un représentant générique de l’humanité; «un homme» en préserve la forme proverbiale.
- source_word: τὸν ἐχθρὸν αὐτοῦ
  choice: son ennemi
  rationale: Traduction directe et naturelle, qui maintient le contraste rhétorique avec l’amitié.
- source_word: τὴν φιλίαν τοῦ πλησίον
  choice: l’amitié de ton prochain
  rationale: 'La formulation reste proche du génitif grec et conserve son ambiguïté: il peut s’agir de l’amitié du prochain ou de l’amitié entretenue avec lui.'
theological_decisions:
- issue: Masculin générique dans une maxime
  choice: un homme
  alternative: quelqu’un
  rationale: Le grec emploie ἄνθρωπος au masculin singulier dans une comparaison proverbiale. La traduction en conserve la forme sans faire du sexe masculin le propos du verset.
- issue: Force de l’image appliquée à la relation
  choice: détruit l’amitié
  alternative: ruiné l’amitié
  rationale: Le même verbe grec est employé dans les deux membres. Répéter «détruit» préserve la sévérité de l’accusation et le parallèle voulu, sans l’atténuer.
- issue: Sens du génitif τοῦ πλησίον
  choice: l’amitié de ton prochain
  alternative: l’amitié avec ton prochain
  rationale: Le génitif peut désigner l’amitié appartenant au prochain ou la relation d’amitié avec lui. Le texte principal suit la forme grecque et une note signale l’autre compréhension.
translation_notes:
  register: Français moderne, digne et proverbial. La construction «de même que… ainsi» est légèrement soutenue, mais claire, et reproduit nettement le parallélisme du grec.
