  text: The fruit shows the cultivation of a tree[a]; so a man's reasoning shows the inclination of his heart.
translation:
  language: fr
  text: Le fruit révèle les soins apportés à un arbre[a] ; de même, la réflexion révèle l’inclination d’une personne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est elliptique : littéralement, « selon le travail d’un arbre, [ainsi] son fruit ; ainsi la réflexion selon l’inclination d’une personne ». Le grec parallèle parle de la culture d’un arbre, puis de « la parole de la pensée du cœur d’un être humain », et soutient l’idée qu’une expression extérieure manifeste une disposition intérieure.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֲבֹדַת עֵץ
  choice: les soins donnés à l’arbre
  rationale: L’expression hébraïque signifie littéralement le « travail » ou le « service » de l’arbre. Dans ce contexte agricole, elle désigne la manière dont l’arbre a été cultivé ou entretenu. « Les soins donnés à l’arbre » est naturel en français et concorde avec le parallèle grec, qui emploie un terme relatif à la culture.
- source_word: פֶרִי
  choice: le fruit
  rationale: Terme agricole courant, qui conserve à la fois l’image concrète et la portée proverbiale.
- source_word: חֶשְׁבּוֹן
  choice: la réflexion
  rationale: Le mot peut désigner un calcul, un raisonnement ou une pensée. « Réflexion » garde ici le sens d’une activité mentale sans imposer l’idée plus étroite d’un calcul. Le grec évoque la parole issue de la pensée du cœur, ce qui confirme le lien entre l’expression perceptible et l’intérieur de la personne.
- source_word: יֵצֶר
  choice: les dispositions
  rationale: Le terme renvoie à ce qui se forme intérieurement, à l’inclination ou à la disposition d’une personne. Le pluriel français « dispositions » est idiomatique et évite d’importer une connotation doctrinale ultérieure.
- source_word: אֶחָד
  choice: d’une personne
  rationale: L’hébreu dit littéralement « d’un » ou « d’un individu ». « D’une personne » exprime clairement la portée humaine générale du proverbe, tandis que le grec précise également qu’il s’agit d’un être humain.
theological_decisions:
- issue: Formulation anthropologique et genre
  choice: d’une personne
  alternative: d’un homme
  rationale: L’hébreu emploie « un » au sens d’un individu, et le grec ἀνθρώπου peut désigner un être humain. La formulation générique « une personne » rend cette portée universelle sans masculiniser inutilement le propos.
- issue: Relation entre l’expression extérieure et la disposition intérieure
  choice: la réflexion révèle les dispositions
  alternative: la parole révèle la pensée du cœur
  rationale: Le texte hébreu porte חֶשְׁבּוֹן, « réflexion, raisonnement, calcul », et יֵצֶר, « inclination, disposition ». La traduction suit prioritairement ces termes, tout en employant « révèle » d’après la logique du parallélisme et l’appui explicite du grec, sans remplacer l’hébreu par la formulation grecque.
translation_notes:
  register: Français international actuel, simple et digne. Le parallélisme proverbial est conservé. « Révèle » explicite la relation suggérée par l’hébreu elliptique et exprimée dans le parallèle grec.
