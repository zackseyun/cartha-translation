  source_fidelity: 'La structure proverbiale et l’image agricole sont bien rendues. « Révèle » est une explicitation prudente de l’ellipse hébraïque, confortée par le grec. Toutefois, יֵצֶר est au singulier : « les dispositions » modifie inutilement le nombre et affaiblit l’idée d’une inclination intérieure. « L’inclination » restitue plus précisément le terme sans surcharge doctrinale.'
