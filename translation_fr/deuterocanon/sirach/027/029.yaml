  yaml_path: translation/deuterocanon/sirach/027/029.yaml
  text: Those who rejoice at the fall of the godly will be caught in a trap[a], and pain will consume them before their death.
translation:
  language: fr
  text: Ceux qui se réjouissent de la chute des personnes pieuses[a] seront pris au piège, et la douleur les consumera avant leur mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « des fidèles » ou « de ceux qui révèrent Dieu ». Grec : εὐσεβῶν.'
    reason: alternative lexicale
lexical_decisions:
- source_word: παγίδι
  choice: au piège
  rationale: Le datif désigne ici le moyen ou la situation de la capture. « Pris au piège » est naturel en français moderne et conserve l’image grecque.
- source_word: ἁλώσονται
  choice: seront pris
  rationale: Le futur passif exprime le fait d’être capturé; associé à « au piège », ce choix rend l’expression grecque avec naturel.
- source_word: οἱ εὐφραινόμενοι
  choice: ceux qui se réjouissent
  rationale: Le participe substantivé désigne ceux qui éprouvent de la joie devant la chute d’autrui. La formulation est directe et actuelle.
- source_word: πτώσει
  choice: de la chute
  rationale: « Chute » correspond directement à πτῶσις et laisse ouverte la nature exacte du malheur évoqué.
- source_word: εὐσεβῶν
  choice: des personnes pieuses
  rationale: εὐσεβής désigne des personnes qui révèrent Dieu et vivent en conséquence. « Personnes pieuses » préserve cette portée morale et religieuse sans employer le substantif parfois ambigu « les pieux ».
- source_word: ὀδύνη
  choice: la douleur
  rationale: Le grec peut désigner une souffrance physique ou morale. « Douleur » conserve cette amplitude sans préciser indûment sa nature.
- source_word: καταναλώσει
  choice: les consumera
  rationale: Le verbe évoque une action qui consume ou épuise entièrement. « Consumera » maintient la force de l’image tout en restant intelligible.
- source_word: πρὸ τοῦ θανάτου αὐτῶν
  choice: avant leur mort
  rationale: La locution est temporelle; cette traduction est à la fois proche du grec et idiomatique en français.
theological_decisions:
- issue: Rendu de εὐσεβῶν dans la littérature sapientielle
  choice: des personnes pieuses
  alternative: des fidèles / de ceux qui révèrent Dieu
  rationale: « Personnes pieuses » exprime la qualité morale et religieuse du terme sans identifier ce groupe à une catégorie confessionnelle précise. La note signale des équivalents possibles.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le parallélisme de l’avertissement, l’image du piège et l’ambiguïté de ὀδύνη entre douleur physique et souffrance morale.
