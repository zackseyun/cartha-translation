  yaml_path: translation/deuterocanon/sirach/027/002.yaml
  text: A peg will be driven in between the joints of stones[b][a], and sin will be wedged in between selling and buying.
translation:
  language: fr
  text: Entre les jointures des pierres, un piquet sera fixé[a] ; entre la vente et l’achat, le péché sera broyé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sera enfoncé » ou « sera solidement planté ».'
    reason: Alternative lexicale pour παγήσεται et précision de l’image concrète.
  - marker: b
    text: Le grec dit littéralement « sera broyé » ou « sera brisé ». Certains comprennent l’image au sens d’un péché qui se trouve coincé entre la vente et l’achat.
    reason: Préservation de l’ambiguïté entre le sens lexical du verbe et l’interprétation suggérée par le parallélisme.
lexical_decisions:
- source_word: ἀνὰ μέσον
  choice: entre
  rationale: La locution répétée situe chaque élément entre deux réalités et structure le parallélisme du proverbe.
- source_word: ἁρμῶν λίθων
  choice: les jointures des pierres
  rationale: ἁρμός désigne le point de jonction ou l’assemblage ; « jointures » conserve ici l’image concrète de la maçonnerie sans réduire le terme à de simples fissures.
- source_word: παγήσεται
  choice: sera fixé
  rationale: Le futur passif de πήγνυμι exprime l’action d’enfoncer ou d’assujettir fermement. « Sera fixé » reste naturel avec « piquet » tout en laissant ouverte la manière exacte de sa mise en place.
- source_word: πάσσαλος
  choice: piquet
  rationale: Le mot peut désigner un pieu, un piquet ou une cheville. « Piquet » rend l’objet concret sans lui imposer la petitesse suggérée par « cheville ».
- source_word: πράσεως
  choice: la vente
  rationale: Le substantif désigne l’acte de vendre ; « la vente » forme en français un couple idiomatique et concis avec « l’achat ».
- source_word: ἀγορασμοῦ
  choice: l’achat
  rationale: Le terme désigne l’achat ou l’acquisition. « L’achat » répond directement à « la vente ».
- source_word: συντριβήσεται
  choice: sera broyé
  rationale: Le futur passif de συντρίβω signifie normalement être brisé, écrasé ou broyé. Cette traduction respecte la valeur lexicale attestée plutôt que de remplacer le verbe par l’idée interprétative d’être « coincé ».
- source_word: ἁμαρτία
  choice: le péché
  rationale: « Péché » préserve la portée morale et théologique du terme sans la restreindre aux seules pratiques commerciales malhonnêtes.
theological_decisions:
- issue: Portée morale de ἁμαρτία dans le contexte commercial
  choice: le péché
  alternative: la faute / la malhonnêteté
  rationale: Le grec énonce une réalité morale générale liée aux transactions. « Le péché » maintient cette gravité sans préciser une forme particulière de faute absente du texte.
- issue: Relation entre l’image du piquet et συντριβήσεται
  choice: sera broyé
  alternative: sera coincé / s’insérera
  rationale: Le parallélisme peut inviter à comprendre le péché comme pris entre vendeur et acheteur, mais le second verbe n’est pas le même que παγήσεται et porte une idée de brisure ou d’écrasement. La traduction conserve cette tension au lieu d’uniformiser les deux membres.
translation_notes:
  register: Français moderne, sobre et proverbial. L’ordre des deux membres et la répétition de « entre » reproduisent le parallélisme grec. « Vente » et « achat » sont préférés aux formes verbales, plus idiomatiques dans cette formulation. Les notes signalent les principales incertitudes lexicales sans résoudre artificiellement la tension de l’image.
