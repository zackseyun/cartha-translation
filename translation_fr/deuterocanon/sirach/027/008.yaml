  text: If you pursue righteousness[a], you will attain it, and put it on like a robe of glory.
translation:
  language: fr
  text: Si tu poursuis ce qui est juste[a], tu l’atteindras et tu t’en revêtiras comme d’une robe de gloire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « la justice »; autre traduction possible : « la droiture ». L’expression grecque peut désigner à la fois la rectitude personnelle et une conduite juste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διώκῃς
  choice: poursuis
  rationale: Le verbe exprime une recherche active et persévérante; « poursuis » conserve mieux cette force que le simple « cherches ».
- source_word: τὸ δίκαιον
  choice: ce qui est juste
  rationale: Le neutre substantivé désigne largement ce qui est droit ou juste. Cette formulation française préserve mieux l’étendue du grec entre rectitude personnelle et conduite juste.
- source_word: καταλήμψῃ
  choice: tu l’atteindras
  rationale: Le verbe peut signifier saisir ou rattraper; dans l’image d’une poursuite morale, « atteindre » est naturel tout en gardant l’idée d’arriver effectivement au but.
- source_word: ἐνδύσῃ
  choice: tu t’en revêtiras
  rationale: Le moyen grec appelle une formulation réfléchie. « Se revêtir de » maintient clairement et dignement la métaphore vestimentaire.
- source_word: ποδήρη
  choice: robe
  rationale: Le terme désigne un vêtement descendant jusqu’aux pieds. « Robe » rend naturellement ce vêtement long et solennel sans alourdir le verset.
- source_word: δόξης
  choice: de gloire
  rationale: Le génitif est conservé littéralement; « gloire » maintient l’élévation et la portée du grec.
theological_decisions:
- issue: Portée de τὸ δίκαιον dans un contexte sapientiel
  choice: ce qui est juste
  alternative: la justice; la droiture
  rationale: Le grec est assez large pour viser à la fois la rectitude morale et l’action juste. « Ce qui est juste » préserve cette amplitude sans réduire le propos à la justice sociale ni en faire exclusivement une qualité intérieure.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme de la poursuite et de l’atteinte est conservé, ainsi que l’image solennelle du vêtement. Le pronom « en » évite une répétition lourde tout en rattachant clairement le revêtement à « ce qui est juste ».
