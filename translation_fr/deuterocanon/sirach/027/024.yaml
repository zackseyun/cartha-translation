  text: I have hated many things, but I have not become like him; and the Lord will hate him.
translation:
  language: fr
  text: J’ai haï bien des choses, mais aucune ne lui est comparable ; et le Seigneur le haïra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλὰ
  choice: bien des choses
  rationale: Le neutre pluriel est employé substantivement. « Bien des choses » est naturel en français et rend l’idée de multiplicité sans introduire un référent absent du grec.
- source_word: ἐμίσησα
  choice: j’ai haï
  rationale: Le passé composé convient ici à l’aoriste dans un propos où le locuteur fait état de son expérience, tout en conservant la force du verbe μισέω.
- source_word: οὐχ ὡμοίωσα αὐτῷ
  choice: je ne suis pas devenu comme lui
  rationale: Dans ce contexte, ὁμοιόω est compris au sens de devenir semblable ou de ressembler. La formulation française exprime clairement la comparaison morale, tandis qu’une note signale l’autre nuance possible.
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: Dans ce contexte sapientiel, κύριος désigne Dieu ; « le Seigneur » est la désignation française conventionnelle et digne.
- source_word: μισήσει αὐτόν
  choice: le haïra
  rationale: Le futur de μισέω est rendu directement. Répéter « haïr » préserve le parallélisme lexical et la vigueur de l’énoncé grec.
theological_decisions:
- issue: Langage attribuant la haine à Dieu
  choice: le Seigneur le haïra
  alternative: le Seigneur le détestera
  rationale: Le grec emploie la même racine μισέω pour la haine du locuteur et celle du Seigneur. La traduction conserve cette répétition et ne l’atténue pas pour des raisons théologiques.
- issue: Valeur de ὡμοίωσα
  choice: je ne suis pas devenu comme lui
  alternative: je ne lui ai pas ressemblé
  rationale: La lecture retenue exprime une assimilation morale progressive et suit le sens contextuel probable, tout en laissant dans la note la nuance plus statique de ressemblance.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la première personne, le contraste proverbial et la répétition forte du verbe « haïr ».
