  text: The talk of fools is offensive[b][a], and their laughter is in the indulgence of sin.
translation:
  language: fr
  text: Les propos des insensés sont une source d’irritation[a], et leur rire relève d’une dissipation pécheresse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sont déplaisants » ou « sont une cause de contrariété ». Le mot grec désigne ce qui suscite le déplaisir, la contrariété, l’irritation ou le dégoût.
    reason: lexical_alternative
  - marker: b
    text: Ou « leur rire est dans la dissipation du péché ». Le terme grec peut évoquer la complaisance envers soi-même, l’excès, le luxe ou une vie dissolue ; la préposition situe le rire dans cette sphère.
    reason: lexical_alternative
lexical_decisions:
- source_word: διήγησις
  choice: propos
  rationale: Le nom peut désigner un récit ou un discours. Ici, « propos » rend naturellement et largement ce que disent les insensés, sans suggérer nécessairement une narration formelle.
- source_word: μωρῶν
  choice: des insensés
  rationale: « Insensés » est un terme classique et intelligible de la littérature de sagesse, qui conserve la portée à la fois morale et intellectuelle du grec.
- source_word: προσόχθισμα
  choice: exaspérants
  rationale: Le terme désigne ce qui provoque contrariété, irritation ou dégoût. « Exaspérants » exprime nettement cette réaction tout en restant naturel en français.
- source_word: γέλως
  choice: rire
  rationale: Le sens premier est « rire ». Le contexte lui donne une coloration morale négative, mais le grec ne précise pas explicitement qu’il s’agit de moquerie.
- source_word: ἐν
  choice: baigne dans
  rationale: La préposition situe le rire dans la sphère de l’excès pécheur. « Baigne dans » restitue cette relation de manière idiomatique sans la réduire à une simple cause.
- source_word: σπατάλῃ
  choice: les excès
  rationale: Le mot évoque la vie dans le luxe, la dissipation et la complaisance envers soi-même. « Excès » en conserve la force morale sans limiter le sens au luxe matériel.
- source_word: ἁμαρτίας
  choice: du péché
  rationale: Le génitif qualifie l’excès et maintient directement la catégorie morale et théologique exprimée par le grec.
theological_decisions:
- issue: Force morale du vocabulaire sapientiel
  choice: « insensés » et « péché »
  alternative: « personnes irréfléchies » et « faute »
  rationale: Le grec emploie des catégories moralement marquées. Les atténuer affaiblirait sans fondement textuel la portée éthique du verset.
- issue: Relation entre le rire et l’excès pécheur
  choice: « leur rire baigne dans les excès du péché »
  alternative: « leur rire consiste en des excès pécheurs »
  rationale: La formulation retenue préserve la valeur de sphère ou de milieu de ἐν, sans trancher en faveur d’une stricte équivalence entre rire et dissipation.
translation_notes:
  register: Français international moderne, digne et direct. « Propos » convient à un discours général; « insensés » maintient le registre sapientiel. L’image « baigne dans » rend idiomatiquement la sphère exprimée par ἐν, tandis que les notes conservent les principales possibilités lexicales.
