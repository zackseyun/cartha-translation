  text: A potter’s vessels are tested by the kiln[a], and likewise a man by his reasoning.
translation:
  language: fr
  text: Les récipients du potier sont éprouvés par le four, et de même un homme par son raisonnement[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par ses pensées » ou « dans sa délibération » ; le parallèle grec porte « dans sa délibération ».
    reason: Alternative lexicale permettant de conserver l’étendue sémantique de חֶשְׁבּוֹן et le témoignage du grec.
lexical_decisions:
- source_word: כְּלֵי יוֹצֵר
  choice: Les récipients du potier
  rationale: Le pluriel construit כְּלֵי désigne des récipients ou objets, et יוֹצֵר un potier. Cette formulation conserve l’image concrète tout en restant naturelle en français.
- source_word: לְבָעֵר כִּבְשָׁן
  choice: sont éprouvés par le four
  rationale: L’hébreu est condensé et quelque peu difficile, mais le parallèle grec, σκεύη κεραμέως δοκιμάζει κάμινος, explicite l’idée que le four met à l’épreuve les récipients du potier. La tournure passive est idiomatique en français et exprime cette fonction révélatrice de la cuisson.
- source_word: וְכָמֹהוּ
  choice: et de même
  rationale: Cette locution introduit l’analogie entre l’épreuve des récipients et celle de l’être humain.
- source_word: אִישׁ
  choice: un homme
  rationale: Le terme hébreu est un masculin singulier employé ici de façon représentative. Le choix conserve la forme genrée du texte source.
- source_word: עַל חֶשְׁבּוֹנוֹ
  choice: par son raisonnement
  rationale: חֶשְׁבּוֹן peut évoquer la pensée, le calcul ou le raisonnement. Le grec ἐν διαλογισμῷ αὐτοῦ confirme l’idée de réflexion ou de délibération. « Par son raisonnement » rend l’idée que la qualité d’un homme se révèle dans sa manière de penser, sans exclure les autres nuances.
theological_decisions:
- issue: Formulation anthropologique et genre grammatical
  choice: un homme
  alternative: une personne
  rationale: L’hébreu אִישׁ est explicitement masculin singulier, tandis que le grec ἀνθρώπου a ici une portée humaine générale. La traduction conserve le masculin du texte sans lui donner une portée doctrinale restrictive.
- issue: Nature de ce qui révèle l’homme
  choice: par son raisonnement
  alternative: par ses pensées ; dans sa délibération
  rationale: Le texte met en parallèle l’épreuve de la poterie par le four et la manifestation de l’homme dans son activité réflexive. La formulation retenue préserve cette analogie sans préciser davantage si l’accent porte sur les pensées, le calcul ou la délibération.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Éprouvés » garde la valeur de mise à l’épreuve et de révélation de la qualité ; « four » suffit dans le contexte du potier et évite une formulation technique inutile.
