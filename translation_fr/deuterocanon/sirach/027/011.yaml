  text: The speech of the godly is always wisdom[b][a], but the fool changes like the moon.
translation:
  language: fr
  text: Les propos d’une personne pieuse sont toujours sages, mais l’insensé change comme la lune.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La comparaison avec la lune évoque probablement ses différentes phases : l’insensé est instable ou inconstant.'
    reason: cultural_note
lexical_decisions:
- source_word: διήγησις
  choice: les propos
  rationale: Le nom peut désigner un récit, un exposé ou un discours. Ici, « les propos » exprime naturellement ce qu’une personne dit, sans imposer l’idée d’un récit formel.
- source_word: εὐσεβοῦς
  choice: de la personne fidèle
  rationale: Le génitif substantivé désigne une personne pieuse ou attachée à Dieu. « Fidèle » conserve la dimension religieuse dans un français actuel, tandis que « personne » évite un masculin inutilement exclusif.
- source_word: διὰ παντός
  choice: toujours
  rationale: Cette locution signifie « continuellement » ou « en tout temps » ; « toujours » est concis et idiomatique.
- source_word: σοφία
  choice: sont toujours sages
  rationale: Le grec emploie le nom « sagesse » comme prédicat. La formulation adjectivale est plus naturelle en français tout en conservant l’affirmation selon laquelle les propos se caractérisent constamment par la sagesse.
- source_word: ἄφρων
  choice: l’insensé
  rationale: Terme classique de la littérature sapientielle pour celui qui manque de discernement. « L’insensé » est digne, clair et moins familier que « l’idiot ».
- source_word: ἀλλοιοῦται
  choice: change
  rationale: Le verbe signifie devenir différent ou changer ; « change » en préserve directement la force verbale.
- source_word: ὡς σελήνη
  choice: comme la lune
  rationale: Cette traduction rend directement la comparaison explicite, qui évoque vraisemblablement les phases changeantes de la lune.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La construction nominale grecque « [est] sagesse » est rendue idiomatiquement par « sont toujours sages ». Le contraste aphoristique entre la constance de la personne fidèle et l’inconstance de l’insensé est préservé.
