  text: A thief is preferable to one who persists in lying[a]; yet both will inherit destruction.
translation:
  language: fr
  text: Mieux vaut un voleur que celui qui persiste dans le mensonge[a] ; mais tous deux hériteront de la destruction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « Un voleur est préférable à celui qui persiste dans le mensonge. »'
    reason: Alternative lexicale rendant plus explicitement αἱρετόν.
lexical_decisions:
- source_word: αἱρετὸν
  choice: Mieux vaut
  rationale: Cette tournure proverbiale française exprime naturellement l’idée comparative de ce qui est préférable ou digne d’être choisi.
- source_word: κλέπτης
  choice: un voleur
  rationale: κλέπτης désigne normalement celui qui dérobe, plutôt qu’un brigand recourant à la violence.
- source_word: ἐνδελεχίζων
  choice: celui qui persiste
  rationale: Le participe exprime une conduite continue ou habituelle ; « persiste » en conserve la valeur durative.
- source_word: ψεύδει
  choice: dans le mensonge
  rationale: Le datif indique ici le domaine ou la pratique dans laquelle la personne persiste. Cette formulation reste concise et naturelle.
- source_word: ἀμφότεροι
  choice: tous deux
  rationale: L’expression rend explicitement l’inclusion des deux personnes comparées.
- source_word: ἀπώλειαν
  choice: la destruction
  rationale: Le terme désigne la ruine ou la destruction qui les attend, sans lui imposer un sens théologique technique ultérieur.
- source_word: κληρονομήσουσιν
  choice: hériteront
  rationale: 'Le sens littéral préserve l’ironie du proverbe : la destruction sera leur héritage.'
theological_decisions:
- issue: Comparaison morale formulée par le proverbe
  choice: Le voleur est présenté comme préférable au menteur invétéré, sans que le vol soit excusé, puisque tous deux hériteront de la destruction.
  alternative: On pourrait comprendre la comparaison comme une hyperbole sapientielle soulignant surtout la gravité particulière du mensonge persistant.
  rationale: Le grec établit réellement une préférence, tandis que la seconde proposition maintient la condamnation des deux conduites. La tension morale est donc conservée.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure proverbiale « Mieux vaut… que… » favorise la clarté, tandis que la note conserve une formulation plus formelle et proche de la structure grecque.
