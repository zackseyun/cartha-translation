  text: A wise man will advance himself by his words[a], and a prudent man will please great men.
translation:
  language: fr
  text: Par ses paroles, le sage se fera une place, et l’homme avisé plaira aux puissants[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux grands personnages », « aux nobles » ou « aux dirigeants ». Le grec désigne de manière générale des personnes influentes ou haut placées.
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφὸς
  choice: le sage
  rationale: Dans la littérature de sagesse, σοφός désigne celui qui possède une sagesse pratique; « le sage » est l’équivalent français naturel et traditionnel.
- source_word: ἐν λόγοις
  choice: par ses paroles
  rationale: 'La préposition ἐν a ici une valeur instrumentale: les paroles sont le moyen par lequel le sage avance. « Par ses paroles » rend directement cette nuance.'
- source_word: προάξει ἑαυτόν
  choice: se fera une place
  rationale: Le verbe προάγω avec le réfléchi exprime l’idée de se faire avancer ou de progresser. « Se fera une place » restitue naturellement en français l’idée d’avancement personnel sans la connotation publicitaire de « se promouvoir ».
- source_word: ἄνθρωπος φρόνιμος
  choice: l’homme avisé
  rationale: φρόνιμος souligne le discernement pratique et le bon sens. « Avisé » convient au registre sapiential tout en restant courant.
- source_word: ἀρέσει
  choice: plaira
  rationale: ἀρέσκω signifie directement « plaire » ou « être agréable à »; le futur « plaira » correspond à la forme grecque.
- source_word: μεγιστᾶσιν
  choice: aux puissants
  rationale: Le terme désigne des personnes socialement éminentes ou détentrices d’autorité. « Les puissants » en conserve la portée générale sans imposer une fonction politique précise.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et sapiential. « Se fera une place » privilégie une formulation idiomatique tout en conservant l’idée réflexive d’avancement; « les puissants » reste général et évite de préciser indûment leur statut.
