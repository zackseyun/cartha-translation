  text: How good it is to reprove rather than to become angry[a], and the one who confesses will be kept from loss.
translation:
  language: fr
  text: Qu’il est bon de reprendre plutôt que de se mettre en colère ! Et celui qui avoue[a] sera préservé d’une perte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui qui reconnaît » ou « celui qui admet » ; le grec ne précise pas ce qui est avoué ou reconnu.
    reason: ambiguïté syntaxique et lexicale
  - marker: b
    text: Le mot grec peut aussi désigner un dommage, une diminution ou un désavantage.
    reason: alternative lexicale
lexical_decisions:
- source_word: Ὡς καλὸν
  choice: Comme il est bon
  rationale: Rend naturellement en français l’exclamation qui introduit l’évaluation morale.
- source_word: ἐλέγξαι
  choice: reprendre
  rationale: Exprime une correction verbale ou un blâme constructif, dans un registre actuel et digne adapté à la littérature de sagesse.
- source_word: ἢ θυμοῦσθαι
  choice: plutôt que de se mettre en colère
  rationale: Le comparatif français explicite naturellement le contraste, tandis que « se mettre en colère » rend la nuance dynamique du verbe.
- source_word: ὁ ἀνθομολογούμενος
  choice: celui qui reconnaît sa faute
  rationale: Le participe peut désigner celui qui reconnaît ou avoue; « sa faute » restitue le sens contextuel probable sans le laisser passer pour explicitement formulé dans le grec, d’où la note.
- source_word: ἀπὸ ἐλαττώσεως
  choice: d’une perte
  rationale: « Perte » conserve la portée générale du nom, qui peut aussi évoquer un dommage, une diminution ou un désavantage.
- source_word: κωλυθήσεται
  choice: sera préservé de
  rationale: Avec ἀπό, le futur passif exprime ici le fait d’être tenu à l’écart d’une conséquence dommageable; cette formulation est idiomatique en français.
theological_decisions:
- issue: Objet implicite de ἀνθομολογούμενος
  choice: sa faute, signalé par une note
  alternative: ce qu’il reconnaît / aucun objet exprimé
  rationale: Le contexte moral favorise l’aveu d’une faute, mais le grec n’énonce pas l’objet; la note maintient cette ambiguïté.
translation_notes:
  register: Français international moderne, clair et proverbial. L’exclamation du premier membre est conservée; le second reste général afin de ne pas préciser la nature de la conséquence.
