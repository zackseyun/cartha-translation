  text: A proverb will be rejected from the mouth of a fool[a], for he will certainly not speak it at its proper time.
translation:
  language: fr
  text: Un proverbe venant de la bouche d’un insensé sera rejeté, car il ne le dira certainement pas au moment opportun[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Une parabole venant de la bouche d’un insensé sera rejetée », si παραβολή est entendu au sens plus large de « parabole ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ στόματος
  choice: quand il sort de la bouche de
  rationale: La tournure conserve l’image concrète de la bouche comme origine de la parole, tout en donnant une phrase naturelle en français.
- source_word: μωροῦ
  choice: un insensé
  rationale: Dans la littérature de sagesse, μωρός désigne une personne dépourvue de discernement moral et pratique, et non simplement peu intelligente.
- source_word: ἀποδοκιμασθήσεται
  choice: sera rejeté
  rationale: Le futur passif est conservé sans préciser au-delà du grec qui rejette le proverbe ni dans quel cadre social.
- source_word: παραβολή
  choice: un proverbe
  rationale: Dans ce contexte sapiential, παραβολή désigne naturellement une maxime ou une parole de sagesse; « proverbe » rend au mieux le genre visé.
- source_word: οὐ γὰρ μὴ
  choice: car … ne … certainement pas
  rationale: La négation grecque renforcée exprime une forte certitude, rendue idiomatiquement en français par « certainement pas ».
- source_word: εἴπῃ αὐτὴν
  choice: celui-ci ne le dira
  rationale: Le pronom masculin français reprend « proverbe », tandis que « celui-ci » explicite sans ambiguïté que le sujet sous-entendu est l’insensé.
- source_word: ἐν καιρῷ αὐτῆς
  choice: au moment qui convient
  rationale: καιρός indique non seulement un moment, mais l’occasion opportune ou appropriée; cette formulation préserve cette nuance.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du mouvement du grec, mais évite le calque peu naturel « de la bouche d’un insensé ». « Insensé » conserve la portée morale et sapientiale du terme sans suggérer un diagnostic intellectuel ou médical.
