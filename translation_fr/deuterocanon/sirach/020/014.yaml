  text: He gives little and heaps on many reproaches[a], and he opens his mouth like a herald.
translation:
  language: fr
  text: Il donne peu et fait de nombreux reproches ; il ouvre la bouche comme un crieur public.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀλίγα
  choice: peu
  rationale: Le neutre pluriel fonctionne ici comme complément de δώσει et désigne ce qui est donné en faible quantité ; « donne peu » est naturel et fidèle.
- source_word: δώσει
  choice: il donne
  rationale: Le futur grec peut avoir ici une valeur gnomique, décrivant un comportement habituel dans une sentence de sagesse ; le présent français rend clairement cette portée proverbiale.
- source_word: πολλὰ ὀνειδίσει
  choice: accable de reproches
  rationale: ὀνειδίζω signifie reprocher, couvrir d’opprobre ou insulter ; πολλὰ intensifie ou multiplie les reproches. « Accable de reproches » restitue naturellement leur profusion sans ajouter d’objet absent du grec.
- source_word: ἀνοίξει τὸ στόμα αὐτοῦ
  choice: il ouvre la bouche
  rationale: L’expression imagée désigne le fait de prendre la parole et reste transparente en français.
- source_word: ὡς κῆρυξ
  choice: comme un crieur public
  rationale: κῆρυξ désigne celui qui proclame publiquement et à haute voix. « Crieur public » communique plus directement cette image en français moderne que « héraut », qui peut évoquer surtout un officier médiéval.
