  text: An ungracious person is an untimely saying[a]; in the mouth of the undisciplined it will be repeated continually.
translation:
  language: fr
  text: Une personne sans grâce, un propos mal venu[a] ; dans la bouche des gens sans éducation, il sera répété sans cesse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Une personne déplaisante, un propos inopportun. » Les deux premiers groupes de mots sont brefs et sans verbe en grec ; leur rapport exact reste implicite.'
    reason: Ambiguïté lexicale et construction elliptique du grec.
lexical_decisions:
- source_word: ἄνθρωπος ἄχαρις
  choice: une personne sans agrément
  rationale: ἄνθρωπος est générique, d’où « personne ». ἄχαρις décrit ici quelqu’un qui manque de grâce, de charme ou d’amabilité ; « sans agrément » conserve cette largeur sans réduire le sens à l’ingratitude.
- source_word: μῦθος
  choice: propos
  rationale: Dans cette maxime, μῦθος désigne plus naturellement une parole ou une remarque qu’un récit développé. « Propos » convient au contexte oral signalé par « dans la bouche ».
- source_word: ἄκαιρος
  choice: mal venu
  rationale: Le mot qualifie ce qui survient ou se dit au mauvais moment. « Mal venu » exprime naturellement en français ce défaut d’à-propos.
- source_word: ἀπαιδεύτων
  choice: des gens sans éducation
  rationale: Le terme désigne ceux qui manquent d’instruction, de formation et de discipline. « Sans éducation » peut englober en français le manque de formation et de savoir-vivre pertinent dans ce contexte sapientiel.
- source_word: ἐνδελεχισθήσεται
  choice: sera répété sans cesse
  rationale: Le futur passif exprime ici la prolongation ou la répétition continuelle du propos. Cette traduction rend explicitement cette valeur en français courant.
- source_word: ἐν στόματι
  choice: dans la bouche
  rationale: La traduction conserve l’image grecque traditionnelle de la bouche comme lieu d’où procède la parole.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et proverbial. La juxtaposition initiale est maintenue afin de préserver l’ellipse et l’ambiguïté authentiques du grec ; le point-virgule relie ensuite naturellement la reprise pronominale au « propos ».
