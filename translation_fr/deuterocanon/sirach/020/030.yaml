  text: Hidden wisdom and an unseen treasure—what benefit is there in either of them?[a]
translation:
  language: fr
  text: 'Une sagesse cachée et un trésor qui ne se voit pas : à quoi servent-ils l’un et l’autre ?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « quel avantage y a-t-il dans les deux ? » Le grec renvoie aux deux réalités mentionnées, la sagesse cachée et le trésor qui ne se voit pas ; le texte courant exprime la question de manière idiomatique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφία
  choice: sagesse
  rationale: Dans la littérature sapientielle, « sagesse » est le sens courant et convient au parallèle avec le trésor.
- source_word: κεκρυμμένη
  choice: cachée
  rationale: Le participe parfait passif présente la sagesse comme ayant été dissimulée; « cachée » est naturel et précis.
- source_word: θησαυρός
  choice: trésor
  rationale: Le terme désigne naturellement un trésor; l’image concrète souligne une chose précieuse mais inaccessible.
- source_word: ἀφανής
  choice: qui ne se voit pas
  rationale: Cette formulation exprime ce qui est soustrait au regard tout en évitant de répéter « caché ».
- source_word: τίς ὠφέλεια
  choice: à quoi servent-ils
  rationale: La tournure française rend naturellement la question portant sur l’utilité ou l’avantage pratique.
- source_word: ἐν ἀμφοτέροις
  choice: l’un et l’autre
  rationale: Le grec vise ensemble les deux éléments mentionnés. « L’un et l’autre » conserve cette portée collective sans imposer l’idée distributive de « aucun des deux ».
