base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/020/024.yaml
  text: A lie is a shameful blemish in a person[b][a]; in the mouth of the undisciplined it will be continually present.
translation:
  language: fr
  text: Le mensonge est une tache honteuse chez une personne[a] ; il demeurera sans cesse dans la bouche de ceux qui manquent de formation[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une tache mauvaise » ou « un sujet de honte » ; le grec emploie un singulier générique, et le mot traduit par « tache » peut aussi évoquer le déshonneur ou le reproche.
    reason: lexical_alternative
  - marker: b
    text: L’expression désigne des personnes dépourvues de formation, d’instruction ou de discipline ; dans ce contexte de sagesse, elle comporte probablement une dimension morale et ne renvoie pas seulement au niveau scolaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: μῶμος πονηρός
  choice: une tache honteuse
  rationale: « Tache » conserve l’image concrète de μῶμος, tandis que « honteuse » exprime ici la forte appréciation négative portée par πονηρός.
- source_word: ἐν ἀνθρώπῳ
  choice: chez une personne
  rationale: Le singulier ἄνθρωπος est générique. « Chez une personne » est naturel en français moderne et n’en restreint pas la portée aux hommes.
- source_word: ψεῦδος
  choice: le mensonge
  rationale: ψεῦδος désigne ici le mensonge ou la fausseté. L’article défini convient au caractère proverbial et général de l’énoncé français.
- source_word: ἀπαιδεύτων
  choice: ceux qui manquent de formation
  rationale: Le terme désigne ceux qui n’ont pas reçu la formation ou la discipline nécessaire, avec une dimension morale propre à la littérature de sagesse, et non le seul manque d’instruction scolaire.
- source_word: ἐνδελεχισθήσεται
  choice: il demeure sans cesse
  rationale: Cette formulation rend la continuité ou la persistance exprimée par le futur, tout en restant naturelle avec l’image du mensonge présent dans la bouche.
theological_decisions:
- issue: Portée générique de ἀνθρώπῳ
  choice: chez une personne
  alternative: chez l’être humain / chez un homme
  rationale: Le grec emploie un singulier générique sans viser exclusivement le sexe masculin. La traduction choisie garde cette portée universelle en français courant.
- issue: Sens moral de ἀπαίδευτος
  choice: ceux qui manquent de formation
  alternative: les ignorants / les gens sans discipline
  rationale: Le choix maintient ensemble l’absence d’instruction et l’insuffisance de formation morale, sans réduire le mot à la scolarité ni imposer une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, proverbial et digne. La syntaxe reste concise, et les notes préservent les principales possibilités lexicales du grec.
