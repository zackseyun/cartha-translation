  yaml_path: translation/deuterocanon/sirach/020/023.yaml
  text: There is one who promises a favor out of shame to a friend[a], and so acquires him as an enemy for nothing.
translation:
  language: fr
  text: Il en est qui, par honte, promettent une faveur à un ami et s’en font un ennemi pour rien[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans raison » ; le mot grec peut exprimer soit l’inutilité de la chose, soit l’absence de juste motif.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριν
  choice: une faveur
  rationale: Dans ce contexte de relations sociales, le terme désigne un service ou un bienfait promis, non la « grâce » au sens théologique.
- source_word: αἰσχύνης
  choice: par honte
  rationale: 'Le génitif exprime le motif de la promesse : la personne promet sous la pression de la honte ou de la gêne.'
- source_word: ἐπαγγελλόμενος
  choice: promet
  rationale: Le participe décrit directement l’action de s’engager à accorder la faveur.
- source_word: φίλῳ
  choice: à un ami
  rationale: Le datif indique naturellement le destinataire de la faveur promise.
- source_word: ἐκτήσατο
  choice: se l’acquiert
  rationale: Le verbe moyen signifie acquérir pour soi. Le pronom « l’ » reprend l’ami, désormais acquis comme ennemi, et le présent de portée générale convient à la maxime.
- source_word: ἐχθρόν
  choice: comme ennemi
  rationale: 'Cette construction conserve l’ironie du grec : la personne obtient son ami sous une nouvelle qualité, celle d’ennemi.'
- source_word: δωρεάν
  choice: gratuitement
  rationale: Le mot peut signifier « gratuitement », « pour rien » ou « sans raison ». « Gratuitement » préserve volontairement cette ambiguïté en français, même si « pour rien » serait plus idiomatique.
theological_decisions: []
translation_notes:
  register: Formulation sapientielle concise et digne. « Il y a celui qui » reproduit la tournure existentielle grecque ; « par honte » reste naturel en français international. La construction « se l’acquiert gratuitement comme ennemi » est légèrement soutenue, mais elle conserve le mouvement et l’ironie de l’original ainsi que l’ambiguïté de δωρεάν.
