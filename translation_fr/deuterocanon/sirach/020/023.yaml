  to: Il en est qui, par honte, promettent une faveur à un ami et s’en font un ennemi pour rien[a].
  rationale: La révision remplace un calque grec peu naturel par une expression française courante, tout en conservant la relation ironique entre l’ami et l’ennemi. « Pour rien » est préférable à « gratuitement » et la note préserve l’ambiguïté lexicale attestée de δωρεάν.
