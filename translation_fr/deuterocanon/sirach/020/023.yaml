    issue: « gratuitement » est un rendu trompeur de δωρεάν dans ce contexte.
    rationale: En français courant, « gratuitement » signifie principalement « sans paiement ». « Pour rien » rend plus naturellement le caractère inutile ou injustifié de l’acquisition d’un ennemi, tout en permettant la note sur « sans raison ».
