  text: A wise man keeps silent until the right time[a], but a fool does not observe the right time.
translation:
  language: fr
  text: Un sage garde le silence jusqu’au moment opportun, mais un insensé ne tient pas compte du moment opportun[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « ne garde pas le temps »; on pourrait aussi comprendre : « ne tient pas compte du moment approprié ». Le texte grec de ce verset est très différent : « Celui qui multiplie les paroles sera détesté, et celui qui exerce son pouvoir avec arrogance sera haï. »'
    reason: La formulation hébraïque est idiomatique, et la tradition grecque atteste une leçon substantiellement différente.
lexical_decisions:
- source_word: חָכָם
  choice: un sage
  rationale: Le nom masculin singulier désigne ici, dans le style proverbial, un homme caractérisé par la sagesse. « Un sage » est naturel, concis et conserve la forme grammaticale du texte hébreu.
- source_word: יַחֲרִישׁ
  choice: garde le silence
  rationale: Le verbe exprime le fait de se taire ou de rester silencieux. « Garde le silence » rend bien la maîtrise volontaire suggérée par le proverbe.
- source_word: עַד עֵת
  choice: jusqu’au moment voulu
  rationale: L’expression signifie littéralement « jusqu’à un moment ». Dans ce contexte sapiential, עֵת désigne vraisemblablement le moment approprié; « moment voulu » l’exprime en français courant sans préciser indûment la nature de l’occasion.
- source_word: וּכְסִיל
  choice: mais un insensé
  rationale: La conjonction peut signifier simplement « et », mais l’opposition entre le sage et l’insensé justifie ici la valeur adversative « mais ». « Insensé » convient au registre sapiential et ne réduit pas le terme à un manque d’intelligence.
- source_word: לֹא יִשְׁמוֹר עֵת
  choice: ne respecte pas le bon moment
  rationale: L’hébreu dit littéralement « ne garde pas le moment/temps ». En français, « respecter le bon moment » rend naturellement l’idée de ne pas tenir compte du moment approprié, tout en laissant la note signaler la formulation hébraïque concise.
