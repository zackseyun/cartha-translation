  text: Like a eunuch’s desire to deflower a young woman, so is one who executes judgments by force.
translation:
  language: fr
  text: Tel le désir d’un eunuque de priver une jeune femme de sa virginité, tel est celui qui rend des jugements par la force.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec violence ». L’expression grecque peut mettre l’accent sur la contrainte ou sur l’action violente.
    reason: lexical_alternative
  - marker: b
    text: L’image du proverbe peut souligner soit le caractère injuste d’un jugement imposé par la contrainte, soit son incongruité frustrée et sa futilité.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιθυμία
  choice: désir
  rationale: Le nom désigne un désir ou une aspiration; « désir » reste naturel et ne précise pas davantage la passion sexuelle que ne le fait le contexte.
- source_word: εὐνούχου
  choice: d’un eunuque
  rationale: « Eunuque » est l’équivalent français précis et usuel, en conservant la portée physique et culturelle de l’image.
- source_word: ἀποπαρθενῶσαι
  choice: de faire perdre sa virginité à
  rationale: Le verbe signifie enlever à une jeune femme sa virginité. Cette formulation moderne et explicite évite l’expression vieillie « déflorer » sans élargir le sens à toute relation sexuelle.
- source_word: νεάνιδα
  choice: une jeune femme
  rationale: Le terme désigne une jeune personne de sexe féminin; « jeune femme » est moderne et convient au contexte.
- source_word: οὕτως
  choice: tel est
  rationale: La tournure corrélative « Tel… tel… » restitue avec concision la comparaison proverbiale.
- source_word: ὁ ποιῶν
  choice: celui qui rend
  rationale: Avec κρίματα comme complément, « rendre des jugements » est une collocation judiciaire naturelle en français et exprime l’action de prononcer ou d’établir des décisions.
- source_word: ἐν βίᾳ
  choice: par la force
  rationale: La locution indique la contrainte ou l’action violente; « par la force » conserve cette amplitude.
- source_word: κρίματα
  choice: des jugements
  rationale: Le pluriel grec renvoie à des décisions ou actes judiciaires; « jugements » en préserve directement la forme et le champ sémantique.
theological_decisions:
- issue: Portée morale de la comparaison proverbiale
  choice: Le texte conserve sans l’expliquer l’image qui dénonce le caractère profondément déplacé d’un jugement imposé par la force.
  alternative: La comparaison peut surtout souligner l’incongruité frustrée, l’impuissance ou la futilité de l’acte.
  rationale: Le grec formule une comparaison sans en expliciter le point précis. La traduction maintient donc la tension entre condamnation de la coercition et idée d’incongruité ou de futilité.
translation_notes:
  register: Français international moderne, digne et proverbial. La structure « Tel… tel… » conserve le parallélisme du grec. « Faire perdre sa virginité » est retenu plutôt que le littéraire et potentiellement euphémique « déflorer ».
