translation:
  language: fr
  text: Le caractère d’un homme menteur est un déshonneur[a], et sa honte l’accompagne constamment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La disposition d’un homme trompeur est une disgrâce, et sa honte l’accompagne sans cesse. »'
    reason: Alternative lexicale pour ἦθος, ψευδής, ἀτιμία et ἐνδελεχῶς.
lexical_decisions:
- source_word: ἦθος
  choice: caractère
  rationale: Ici, ἦθος désigne la disposition morale établie ou la manière d’être caractéristique d’une personne. « Caractère » est naturel en français moderne et évite de réduire le terme à une simple habitude.
- source_word: ἀνθρώπου ψευδοῦς
  choice: d’un homme menteur
  rationale: Le génitif décrit un homme caractérisé par le mensonge. « Homme menteur » conserve le masculin singulier du grec et exprime naturellement une disposition habituelle à mentir.
- source_word: ἀτιμία
  choice: déshonneur
  rationale: ἀτιμία désigne la perte ou l’état d’absence d’honneur. « Déshonneur » maintient la distinction lexicale avec αἰσχύνη, rendu par « honte ».
- source_word: αἰσχύνη
  choice: honte
  rationale: « Honte » est l’équivalent français direct et transparent, tout en restant distinct du « déshonneur » qui précède.
- source_word: μετʼ αὐτοῦ
  choice: avec lui
  rationale: Cette traduction formelle préserve directement la relation exprimée par la préposition, sans préciser indûment si la honte l’accompagne ou demeure attachée à lui.
- source_word: ἐνδελεχῶς
  choice: constamment
  rationale: L’adverbe exprime la continuité ou la persistance. « Constamment » est actuel, clair et fidèle à cette durée.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La formulation conserve le parallélisme du grec ainsi que la distinction entre le déshonneur objectif et la honte attachée au menteur.
