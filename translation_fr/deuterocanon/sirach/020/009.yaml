  text: There is a gift that will not profit you[a], and there is a gift whose repayment is double.
translation:
  language: fr
  text: Il y a un don qui ne te sera d’aucun profit, et il y a un don dont le retour est double.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δόσις
  choice: don
  rationale: Le nom peut désigner l’acte de donner ou ce qui est donné. « Don » garde cette relative souplesse et convient au parallélisme proverbial.
- source_word: λυσιτελήσει
  choice: ne te sera d’aucun profit
  rationale: Le futur exprime ici l’absence d’avantage ou d’utilité pour la personne concernée. Cette tournure est naturelle en français moderne sans limiter le sens au domaine financier.
- source_word: σοι
  choice: te
  rationale: Le datif désigne la personne qui bénéficie ou non du don; « te » l’exprime directement dans les deux membres de la phrase.
- source_word: ἀνταπόδομα
  choice: en retour
  rationale: Le terme désigne ce qui est rendu en contrepartie. « En retour » restitue clairement la réciprocité sans imposer l’idée plus étroite d’un remboursement de dette.
- source_word: διπλοῦν
  choice: le double
  rationale: L’adjectif substantivé signifie « double » ou « au double ». « Le double » est idiomatique et clair en français contemporain.
