  terminology: « Sage », « insensés » et « sagesse » conviennent au lexique sapientiel. « Bonté » maintient l’ambiguïté de טוֹבָה entre bonté, bienfait et don, plutôt que d’importer la lecture grecque « don » dans le texte principal. Les notes b et c encadrent utilement les possibilités de lecture, et la note a présente fidèlement la divergence grecque.
