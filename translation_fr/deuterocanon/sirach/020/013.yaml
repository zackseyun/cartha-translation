  text: A wise man speaks little for himself[c][b][a], but the goodness of fools pours out wisdom.
translation:
  language: fr
  text: Le sage parle peu de lui-même[b], mais la bonté des insensés déverse la sagesse[c][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « Le don d’un insensé ne te sera d’aucun profit, car, au lieu d’un seul œil, il en a beaucoup. » Les témoins hébreu et grec diffèrent profondément dans ce verset. Le texte principal suit le témoin hébreu conservé; la lecture grecque est donnée ici parce que cette divergence change sensiblement l’interprétation.'
    reason: textual_variant
  - marker: b
    text: 'Ou : « Le sage parle en peu de mots. »'
    reason: lexical_alternative
  - marker: c
    text: 'Le dernier membre peut être ironique : les insensés déversent des paroles comme s’ils dispensaient la sagesse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכָם
  choice: le sage
  rationale: Emploi substantivé au masculin singulier; « le sage » est naturel dans le registre proverbial français et peut avoir une portée générique.
- source_word: בִּמְעַט
  choice: peu
  rationale: Exprime ici une parole mesurée, en peu de mots; « parle peu » reste proche de l’hébreu et idiomatique.
- source_word: דִבֶּר
  choice: parle
  rationale: Le présent convient au caractère général et proverbial de l’énoncé.
- source_word: נַפְשׁוֹ
  choice: de lui-même
  rationale: נפשו semble avoir ici une valeur réflexive ou liée à la personne plutôt que désigner littéralement l’âme. « De lui-même » conserve l’idée possible de parler à son propre sujet, sans imposer celle d’intérêt personnel.
- source_word: וְטוֹבַת
  choice: mais la bonté
  rationale: טובה peut désigner la bonté, un bienfait ou un don. Le texte hébreu transmis porte une construction difficile; « bonté » en préserve la formulation, tandis que la lecture grecque nettement différente est donnée en note.
- source_word: כְּסִילִים
  choice: des insensés
  rationale: Rend le pluriel et la relation génitivale; « insensés » appartient au vocabulaire sapientiel sans être inutilement familier.
- source_word: יִשְׁפוֹךְ
  choice: déverse
  rationale: Conserve l’image concrète de verser abondamment et permet de garder l’ironie possible du second membre.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: Équivalent direct qui maintient la tension de l’énoncé, possiblement ironique, sans la résoudre dans le corps du texte.
- source_word: δόσις ἄφρονος οὐ λυσιτελήσει σοι
  choice: le don d’un insensé ne te sera d’aucun profit
  rationale: Traduction du début de la variante grecque, conservée en note puisque son sens diffère profondément du texte hébreu.
