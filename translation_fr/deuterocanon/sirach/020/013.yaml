  source_fidelity: 'Le texte français suit de près le témoin hébreu conservé : « le sage parle peu de lui-même » rend de façon recevable la construction difficile עם נפשו, sans surinterpréter son sens; « la bonté des insensés déverse la sagesse » conserve volontairement l’image et l’ambiguïté de טוֹבַת… יִשְׁפוֹךְ חָכְמָה. La variante grecque substantiellement divergente est correctement signalée et traduite en note.'
