  yaml_path: translation/deuterocanon/sirach/020/021.yaml
  text: There is one who is prevented from sinning by poverty[b][a], and in his rest he will feel no remorse.
translation:
  language: fr
  text: Il y a quelqu’un que la pauvreté empêche de pécher[a] et qui, dans son repos, n’éprouvera aucun remords[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que le manque empêche de pécher » ou « qui est empêché de pécher faute de moyens ». Le grec présente le manque ou la pauvreté comme la cause de cette retenue.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il ne sera pas transpercé » ou « piqué ». L’image désigne ici une douleur intérieure, la componction ou le remords.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλυόμενος
  choice: empêche
  rationale: Le participe passif exprime une entrave effective. La tournure française « que… empêche de » reste naturelle tout en conservant ce sens passif.
- source_word: ἁμαρτάνειν
  choice: pécher
  rationale: Le verbe garde ici sa portée morale et religieuse directe.
- source_word: ἀπὸ ἐνδείας
  choice: la pauvreté
  rationale: ἐνδεία désigne le manque, le besoin ou la pauvreté. Dans ce contexte, la pauvreté est présentée comme la cause qui prive la personne des moyens de pécher.
- source_word: ἀναπαύσει
  choice: repos
  rationale: '« Repos » rend simplement le nom grec et laisse ouverte la nuance exacte : tranquillité, soulagement ou état de repos.'
- source_word: οὐ κατανυγήσεται
  choice: n’éprouvera aucun remords
  rationale: Le verbe évoque littéralement le fait d’être transpercé ou vivement piqué, puis, au sens intérieur, la componction. « N’éprouvera aucun remords » en exprime clairement le sens contextuel.
theological_decisions:
- issue: Portée morale de la pauvreté qui empêche de pécher
  choice: Le verset constate que la pauvreté peut empêcher quelqu’un de pécher et que cette personne n’éprouvera ensuite aucun remords.
  alternative: Comprendre plus largement que le manque empêche de mal agir, sans attribuer à la pauvreté elle-même une valeur morale.
  rationale: Le grec formule une observation de sagesse, non une affirmation selon laquelle la pauvreté serait vertueuse en elle-même. La traduction maintient cette tension sans ajouter d’éloge doctrinal de la pauvreté.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde le caractère proverbial du verset, le rôle causal de la pauvreté et l’image intérieure sous-jacente au verbe final, explicitée en note.
