  text: Better is a man who hides his foolishness than a man who hides his wisdom[a].
translation:
  language: fr
  text: Mieux vaut celui qui cache sa folie que celui qui cache sa sagesse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρείσσων
  choice: Mieux vaut
  rationale: Cette tournure comparative, naturelle en français proverbial, rend avec concision la supériorité exprimée par κρείσσων.
- source_word: ἄνθρωπος
  choice: celui
  rationale: Dans ce proverbe, ἄνθρωπος a une portée générique. « Celui » conserve le singulier et le parallélisme sans restreindre explicitement l’énoncé aux hommes.
- source_word: ἀποκρύπτων
  choice: qui cache
  rationale: Le participe présent caractérise la personne concernée. La proposition relative est idiomatique en français et permet de reproduire exactement le verbe dans les deux membres.
- source_word: μωρίαν
  choice: sa folie
  rationale: « Folie » exprime ici le défaut de jugement désigné par μωρία, dans un registre moral et sapientiel digne, sans la dureté de « stupidité ».
- source_word: σοφίαν
  choice: sa sagesse
  rationale: « Sagesse » est l’équivalent direct de σοφία et conserve un terme central de la littérature sapientielle.
