  text: There is one who keeps silent and is considered wise[a], and there is one who is despised because of much talk.
translation:
  language: fr
  text: Certains gardent le silence et passent pour sages[a] ; d’autres sont méprisés parce qu’ils parlent trop.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Il y a celui qui garde le silence parce qu’il n’a pas de réponse, et il y a celui qui garde le silence, connaissant le moment opportun. » Le témoin hébreu attesté ici diffère considérablement ; le texte principal suit ce témoin, retenu comme source première pour le Siracide lorsqu’il est disponible.'
    reason: alternative_reading
lexical_decisions:
- source_word: יֵשׁ
  choice: Il y a celui qui
  rationale: La tournure existentielle introduit un type de personne; cette formulation naturelle conserve le parallélisme du proverbe.
- source_word: מַחֲרִישׁ
  choice: garde le silence
  rationale: Le participe de חרש exprime le fait de rester silencieux; « garde le silence » en restitue la valeur durative.
- source_word: וְנֶחְשָׁב
  choice: que l’on tient pour
  rationale: Le niphal indique le jugement porté par autrui. « Tenir pour » rend clairement cette appréciation sociale.
- source_word: חָכָם
  choice: sage
  rationale: L’adjectif a ici son sens sapientiel courant et n’exige pas l’ajout d’un nom masculin.
- source_word: נִמְאָס
  choice: que l’on méprise
  rationale: מאס exprime le rejet ou le dédain; « mépriser » forme un contraste net avec « tenir pour sage ».
- source_word: בְּרוֹב שִׂיחַ
  choice: parce qu’il parle trop
  rationale: La préposition בְּ marque ici la cause, et רֹב שִׂיחַ désigne une parole excessive. Cette formulation idiomatique en français restitue le sens plutôt qu’un calque tel que « par beaucoup de discours ».
