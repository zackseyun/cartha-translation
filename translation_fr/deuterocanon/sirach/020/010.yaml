  text: There is a humiliation for the sake of glory, and there is one who from humiliation has lifted up his head.
translation:
  language: fr
  text: Il y a un abaissement en vue de la gloire[a], et il y a quelqu’un qui, au sortir de l’humiliation, a relevé la tête[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il y a une diminution en vue de la gloire. » Le nom grec peut désigner une réduction, un abaissement ou une humiliation.'
    reason: lexical_alternative
  - marker: b
    text: « Relever la tête » évoque ici le fait de sortir d’une condition humiliante pour retrouver dignité ou assurance.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλάττωσις
  choice: abaissement
  rationale: Le nom désigne une diminution ou le fait d’être rabaissé. « Abaissement » conserve cette amplitude et convient au contraste proverbial avec la gloire, sans imposer exclusivement l’idée d’une humiliation publique.
- source_word: ἕνεκεν δόξης
  choice: qui mène à la gloire
  rationale: ἕνεκεν peut exprimer le but ou le motif. Dans ce paradoxe sapientiel, cette formulation française naturelle rend le lien orienté vers la gloire sans préciser indûment si celle-ci est visée dès le départ ou résulte de l’abaissement.
- source_word: ταπεινώσεως
  choice: après avoir été humilié
  rationale: Le substantif désigne ici une condition d’abaissement dont la personne sort. La tournure verbale est plus naturelle en français et évite « humilité », qui pourrait suggérer une vertu plutôt qu’une situation humiliante.
- source_word: ἦρεν κεφαλήν
  choice: a relevé la tête
  rationale: La traduction garde l’image concrète et idiomatique du grec, qui évoque le passage d’une condition basse à la dignité ou à l’assurance.
- source_word: ἔστιν ὃς
  choice: tel autre
  rationale: Cette tournure restitue naturellement en français la présentation proverbiale d’un type de personne et évite la lourdeur de « il y en a un qui ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme proverbial est préservé, avec une légère variation lexicale permettant d’éviter une répétition pesante tout en maintenant le lien entre les deux formes d’abaissement.
