base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/020/018.yaml
  text: A slip is better from the ground than from the tongue[a]; so the downfall of the wicked will come in haste.
translation:
  language: fr
  text: Mieux vaut un faux pas sur le sol qu’un faux pas de la langue[a] ; ainsi, la chute des méchants viendra en toute hâte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ainsi, la chute des maux viendra en toute hâte ». Le grec κακῶν peut désigner soit « les méchants », soit « les maux ».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀλίσθημα
  choice: glisser
  rationale: Le nom grec désigne une glissade ou un faux pas. La tournure verbale « glisser » donne en français un proverbe naturel tout en conservant l’image concrète.
- source_word: ἀπὸ ἐδάφους
  choice: sur le sol
  rationale: En français idiomatique, on glisse « sur le sol » ; cette formulation exprime clairement que la glissade est causée par l’appui au sol.
- source_word: μᾶλλον ἢ ἀπὸ γλώσσης
  choice: Mieux vaut… que…
  rationale: Le grec formule elliptiquement la préférence. « Mieux vaut » explicite la comparaison sans en modifier le sens.
- source_word: γλώσσης
  choice: la langue
  rationale: « Langue » conserve la métaphore corporelle traditionnelle désignant la parole, plutôt que de l’aplanir en « paroles ».
- source_word: πτῶσις
  choice: la chute
  rationale: « Chute » correspond directement au sens de πτῶσις et maintient le lien imagé avec la glissade de la première proposition.
- source_word: κακῶν
  choice: des méchants
  rationale: Le génitif pluriel peut désigner des personnes mauvaises ; « des méchants » est naturel dans le registre sapientiel français. L’interprétation abstraite reste signalée en note.
- source_word: κατὰ σπουδήν
  choice: en toute hâte
  rationale: Cette expression rend la rapidité pressante contenue dans la locution grecque, avec davantage de force que le simple adverbe « vite ».
- source_word: ἥξει
  choice: viendra
  rationale: Le futur de ἥκω est rendu directement ; « la chute… viendra » conserve la personnification sobre du grec.
theological_decisions:
- issue: Référent de κακῶν
  choice: 'Lecture personnelle : « des méchants »'
  alternative: 'Lecture abstraite : « des maux »'
  rationale: Le génitif peut être masculin personnel ou neutre abstrait. La lecture personnelle forme une maxime cohérente sur la chute prochaine des méchants, mais l’ambiguïté réelle du grec est préservée dans la note.
translation_notes:
  register: Français international moderne, concis et proverbial. La syntaxe reste digne et accessible ; le point-virgule reflète l’articulation des deux propositions grecques sans résoudre leur lien logique au-delà de οὕτως.
