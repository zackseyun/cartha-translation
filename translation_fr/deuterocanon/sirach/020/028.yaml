  source_fidelity: Le parallélisme et les termes essentiels sont bien rendus. Toutefois, « fera monter son tas de grain » est peu idiomatique en français pour l’augmentation d’un amas de récolte. « Augmentera son tas de grain » exprime naturellement l’effet figuré de ἀνυψώσει sans surinterpréter le texte. « Expiéra l’injustice » conserve la force expiatoire de ἐξιλάσεται, tout en étant plus naturel que « fera l’expiation pour ».
  naturalness: La formulation révisée est plus fluide en français international moderne. « Les puissants » convient au statut social visé par μεγιστᾶσιν. Le déplacement de l’appel de note après « l’injustice » rend son rattachement lexical explicite.
  terminology: « Cultive la terre », « tas de grain », « les puissants », « expiera » et « l’injustice » préservent respectivement l’imagerie agricole, le rang social et la portée morale-expia­toire du grec. La note maintient l’alternative pragmatique sans la substituer au texte.
