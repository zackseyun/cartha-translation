  yaml_path: translation/deuterocanon/sirach/020/028.yaml
  text: The one who works the land will raise up his grain heap[a], and the one who pleases great men will atone for injustice.
translation:
  language: fr
  text: Celui qui cultive la terre augmentera son tas de grain, et celui qui plaît aux puissants expiera l’injustice[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « couvrira une faute ». Le grec dit littéralement « expiera l’injustice »; il peut s’agir de l’effet pratique obtenu en gagnant la faveur des puissants.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐργαζόμενος γῆν
  choice: celui qui travaille la terre
  rationale: Le participe substantivé désigne toute personne qui travaille; «la terre» convient naturellement au cadre agricole.
- source_word: ἀνυψώσει
  choice: fera monter
  rationale: Le verbe signifie littéralement «élever, faire monter»; cette formulation conserve l’image de l’amoncellement de la récolte sans imposer le sens plus abstrait d’«augmenter».
- source_word: θιμωνιὰν αὐτοῦ
  choice: son tas de grain
  rationale: Le nom désigne un amas de produits récoltés, notamment de grain ou de gerbes; «tas de grain» rend clairement l’image agricole.
- source_word: ὁ ἀρέσκων
  choice: celui qui plaît
  rationale: Le participe exprime directement le fait de plaire; une formulation telle que «cherche à gagner les faveurs» ajouterait une intention intéressée non explicitée.
- source_word: μεγιστᾶσιν
  choice: aux puissants
  rationale: Le terme désigne les grands personnages, les notables ou les personnes socialement puissantes. «Aux puissants» est naturel en français moderne et n’impose pas la fonction précise de dirigeants.
- source_word: ἐξιλάσεται
  choice: fera l’expiation pour
  rationale: Le verbe possède une forte valeur expiatoire ou propitiatoire. Cette tournure conserve son poids religieux et moral ainsi que l’étrangeté possible du proverbe.
- source_word: ἀδικίαν
  choice: l’injustice
  rationale: Le nom peut désigner l’injustice, l’iniquité ou une mauvaise action. «L’injustice» maintient sa portée morale et sociale.
theological_decisions:
- issue: 'Sens du second membre: expiation véritable ou effet pratique de la faveur des puissants'
  choice: fera l’expiation pour l’injustice
  alternative: couvrira une mauvaise action
  rationale: Le grec emploie un verbe d’expiation, mais le contexte peut évoquer l’effet social obtenu en plaisant aux puissants. Le texte principal garde donc le langage fort et ambigu de l’original, tandis que la note signale l’autre compréhension possible.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme proverbial et l’image agricole sont conservés; le second membre garde volontairement sa tension morale et théologique.
