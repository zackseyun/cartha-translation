  text: A fool will say[a], “I have no friend, and there is no gratitude for my good deeds.”
translation:
  language: fr
  text: 'L’insensé dira : « Je n’ai pas d’ami, et l’on ne me sait aucun gré de mes bonnes actions. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et mes bienfaits ne suscitent aucune reconnaissance ». Le grec χάρις peut signifier « reconnaissance », « remerciement » ou « faveur », et τοῖς ἀγαθοῖς μου peut désigner « mes bonnes choses », « mes bonnes actions » ou « mes bienfaits ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρός
  choice: l’insensé
  rationale: Dans la littérature de sagesse, le terme désigne une personne dépourvue de sagesse. « L’insensé » convient au caractère proverbial de la phrase et reste digne et naturel en français.
- source_word: ἐρεῖ
  choice: dira
  rationale: Le futur de l’indicatif grec est conservé directement en français, sans nuire à la fluidité de la maxime.
- source_word: Οὐχ ὑπάρχει μοι φίλος
  choice: Je n’ai pas d’ami
  rationale: La construction avec ὑπάρχει et le datif exprime ici la possession ou l’existence par rapport au locuteur. Cette formulation est l’équivalent idiomatique le plus clair.
- source_word: χάρις
  choice: savoir gré
  rationale: Dans ce contexte, χάρις évoque la reconnaissance ou les remerciements suscités par des bienfaits. L’expression « savoir gré » restitue naturellement cette réaction en français, sans introduire le sens théologique de « grâce ».
- source_word: τοῖς ἀγαθοῖς μου
  choice: pour mes bonnes actions
  rationale: L’adjectif substantivé au pluriel peut désigner les bonnes choses du locuteur ou les bienfaits qu’il accomplit. « Mes bonnes actions » transmet clairement le sens contextuel tout en laissant l’alternative en note.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La tournure « savoir gré » est courante dans un registre soutenu mais accessible; elle rend avec précision la dimension relationnelle de χάρις. Le marqueur de note est placé après la citation à laquelle il se rapporte.
