  text: A wise man will make himself beloved by his words[a], but the favors of fools will be poured out.
translation:
  language: fr
  text: Le sage, par sa parole, se rendra cher, mais les faveurs[a] des insensés seront répandues.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les grâces » ou « les charmes ». Le grec χάριτες peut désigner des faveurs ou marques de bienveillance, mais aussi l’agrément et le charme.
    reason: Ambiguïté lexicale de χάριτες.
lexical_decisions:
- source_word: ὁ σοφὸς
  choice: le sage
  rationale: L’adjectif grec substantivé désigne ici, de manière représentative, l’homme sage. « Le sage » est concis, naturel en français sapientiel et conserve le singulier.
- source_word: ἐν λόγῳ
  choice: par sa parole
  rationale: La préposition ἐν peut exprimer ici le moyen ou le domaine. « Par sa parole » rend naturellement l’idée que le sage devient cher grâce à sa manière de parler, sans transformer le singulier λόγῳ en une pluralité nécessaire.
- source_word: ἑαυτὸν προσφιλῆ ποιήσει
  choice: se rendra cher
  rationale: 'Cette formulation conserve la construction réfléchie et le sens relationnel de προσφιλής : cher, apprécié ou aimé. Elle évite de préciser à tort les personnes auprès desquelles le sage gagne cette affection.'
- source_word: χάριτες
  choice: faveurs
  rationale: Le pluriel χάριτες peut désigner des marques de bienveillance, des grâces ou des agréments. « Faveurs » est intelligible dans ce contexte tout en laissant entendre des manifestations concrètes de bienveillance.
- source_word: μωρῶν
  choice: des insensés
  rationale: Le génitif possessif est rendu directement. « Insensés » appartient au registre courant et digne de la littérature de sagesse, sans suggérer nécessairement une incapacité intellectuelle.
- source_word: ἐκχυθήσονται
  choice: seront répandues
  rationale: Le futur passif de ἐκχέω est conservé ainsi que l’image de l’effusion. La traduction n’explicite pas si cette effusion est généreuse, indiscriminée ou vaine.
