  text: Today he lends[a], and tomorrow he demands it back; such a man is hateful.
translation:
  language: fr
  text: 'Aujourd’hui, il prête, et demain il exige d’être remboursé : un tel homme est détestable[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « détesté ». L’adjectif grec peut décrire cet homme comme odieux ou indiquer la réaction qu’il suscite.
    reason: lexical_alternative
lexical_decisions:
- source_word: σήμερον
  choice: Aujourd’hui
  rationale: Conserve l’opposition temporelle nette avec αὔριον dans cette formulation proverbiale.
- source_word: δανιεῖ
  choice: il prête
  rationale: Bien que la forme grecque soit au futur, le présent français exprime naturellement ici une conduite habituelle dans une maxime.
- source_word: αὔριον
  choice: demain
  rationale: Traduction directe qui maintient le contraste concis avec « aujourd’hui ».
- source_word: ἀπαιτήσει
  choice: il exige d’être remboursé
  rationale: Le verbe signifie réclamer ou exiger en retour. La tournure française explicite l’objet sous-entendu par l’acte de prêter sans préciser indûment la nature du prêt.
- source_word: μισητός
  choice: détestable
  rationale: Rend le jugement porté sur cet homme tout en conservant en note l’autre valeur possible de l’adjectif, « détesté ».
- source_word: ἄνθρωπος
  choice: homme
  rationale: Le nom grec masculin singulier présente ici un type humain représentatif; « homme » préserve la forme proverbiale et le genre grammatical du texte.
- source_word: ὁ τοιοῦτος
  choice: un tel
  rationale: Expression française concise et naturelle pour désigner le genre d’homme qui vient d’être décrit.
theological_decisions:
- issue: Sens passif ou qualificatif de μισητός
  choice: détestable
  alternative: détesté
  rationale: L’adjectif grec peut caractériser quelqu’un comme odieux ou indiquer qu’il est haï. Le contexte favorise un jugement moral, mais l’ambiguïté réelle est signalée en note.
- issue: Rendu de ἄνθρωπος dans une maxime de sagesse
  choice: homme
  alternative: personne
  rationale: Le grec emploie un masculin singulier représentatif. Le maintenir évite de neutraliser silencieusement la formulation de la source, sans restreindre pour autant la portée morale de la maxime aux seuls hommes.
translation_notes:
  register: Français moderne, sobre et proverbial. Le présent de portée générale est préféré au futur grec pour rendre naturellement la maxime, tandis que les repères « aujourd’hui » et « demain » préservent sa progression temporelle.
