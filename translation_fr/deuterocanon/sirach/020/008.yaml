  text: There is success for a man in evil things[a], and there is a gain that leads to loss.
translation:
  language: fr
  text: Il arrive qu’un homme réussisse au milieu des malheurs[a], et qu’un gain aboutisse à une perte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « réussisse dans le mal ». Le grec peut évoquer soit des malheurs et des circonstances pénibles, soit des choses mauvaises sur le plan moral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐοδία
  choice: réussisse
  rationale: Le nom évoque une marche favorable, la réussite ou la prospérité. La tournure verbale « réussisse » est naturelle en français et convient au caractère proverbial de la phrase.
- source_word: ἐν κακοῖς
  choice: au milieu des malheurs
  rationale: Le pluriel neutre peut désigner des maux, des malheurs ou des circonstances pénibles. Dans ce proverbe construit sur des renversements, le sens circonstanciel paraît le plus probable, sans exclure totalement une lecture morale.
- source_word: ἀνδρί
  choice: un homme
  rationale: Le grec emploie le masculin singulier dans une maxime générale. « Un homme » en conserve directement la forme.
- source_word: εὕρεμα
  choice: gain
  rationale: Le terme désigne ce qui est trouvé ou obtenu et peut, dans ce parallélisme, exprimer un avantage ou un profit apparent. « Gain » prépare clairement le contraste avec la perte.
- source_word: εἰς ἐλάττωσιν
  choice: aboutisse à une perte
  rationale: L’expression indique un mouvement vers l’amoindrissement ou la diminution. Cette formulation idiomatique restitue le paradoxe d’un gain dont l’issue est une perte.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme et le paradoxe du grec sont conservés, tandis que l’ambiguïté de ἐν κακοῖς est signalée en note.
