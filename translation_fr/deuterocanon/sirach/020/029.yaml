  text: Hospitality and gifts blind the eyes of the wise[b][a], and like a muzzle on the mouth they turn away rebukes.
translation:
  language: fr
  text: L’hospitalité[a] et les cadeaux[b] aveuglent les yeux des sages et, comme une muselière sur la bouche, détournent les reproches.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les présents d’hospitalité » ; le grec ξένια peut désigner l’hospitalité accordée à un hôte ou les cadeaux liés aux relations d’hospitalité.
    reason: lexical_alternative
  - marker: b
    text: Ici, les « cadeaux » sont des faveurs susceptibles de corrompre le jugement ; le grec ne dit pas explicitement « pots-de-vin ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ξένια
  choice: l’hospitalité
  rationale: Le terme peut désigner l’hospitalité offerte à un hôte ou les présents liés aux relations d’hospitalité. « L’hospitalité » préserve ici la faveur sociale distincte des « cadeaux », sans effacer l’ambiguïté, signalée en note.
- source_word: δῶρα
  choice: les cadeaux
  rationale: Le grec dit littéralement « dons/cadeaux ». Le contexte leur attribue un effet corrupteur, mais ne les qualifie pas explicitement de pots-de-vin.
- source_word: ἀποτυφλοῖ
  choice: aveuglent
  rationale: Ce verbe fort exprime l’action de rendre aveugle et conserve la métaphore d’un jugement moral obscurci.
- source_word: ὀφθαλμοὺς σοφῶν
  choice: les yeux des sages
  rationale: Traduction directe et naturelle du génitif grec, sans précision de genre absente du contexte.
- source_word: φιμός
  choice: muselière
  rationale: Le mot désigne concrètement une muselière placée sur la bouche; ce choix maintient l’image vive du grec.
- source_word: ἀποτρέπει
  choice: détournent
  rationale: Le verbe signifie détourner, écarter ou empêcher. « Détournent » conserve l’image des reproches déviés ou écartés.
- source_word: ἐλεγμούς
  choice: les reproches
  rationale: Dans la littérature sapientielle, le terme désigne des réprimandes ou des remontrances à visée corrective. « Reproches » est courant et conserve cette force morale.
theological_decisions: []
