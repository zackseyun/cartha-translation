  source_fidelity: 'Le sens fondamental est bien rendu : ἔλεγχος désigne un reproche/une réprimande, ὡραῖος renvoie ici à ce qui est opportun ou approprié, et le contraste avec la personne silencieuse est conservé. Toutefois, le pluriel générique « des reproches » atténue inutilement les deux énoncés existentiels singuliers du grec. De plus, « lui aussi » peut suggérer une simple addition comparative, tandis que καὶ αὐτός met surtout en relief que la personne silencieuse est elle-même sage.'
  naturalness: La formulation est naturelle et de registre proverbial. « Un reproche qui n’est pas opportun » est également idiomatique en français moderne et permet de suivre de plus près le singulier grec. « Est lui-même sage » rend directement le prédicat φρόνιμος sans l’expliciter comme une démonstration de sagesse.
  terminology: « Reproche » convient à ἔλεγχος dans ce contexte. « Opportun » rend bien ὡραῖος sans trancher artificiellement entre le bon moment et la convenance. « Sage » est le correspondant sobre et fidèle de φρόνιμος; « lui-même » préserve l’accent de αὐτός.
