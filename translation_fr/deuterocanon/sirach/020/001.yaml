  text: There is a rebuke that is not timely[a], and there is one who keeps silent and is himself wise.
translation:
  language: fr
  text: Il y a un reproche qui n’est pas opportun[a], et celui qui garde le silence est lui-même sage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui ne vient pas à propos » ou « qui ne convient pas ». Le mot grec peut signifier « opportun », « approprié » et, dans d’autres contextes, « beau ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγχος
  choice: reproches
  rationale: Le nom désigne ici une réprimande ou une correction verbale. Le pluriel générique est naturel en français dans cette maxime, sans changer la portée du singulier grec.
- source_word: ὡραῖος
  choice: à propos
  rationale: Dans ce contexte, l’adjectif exprime surtout ce qui convient au moment ou à la situation. « À propos » garde ensemble les nuances d’opportunité et de convenance.
- source_word: σιωπῶν
  choice: celui qui garde le silence
  rationale: Cette formulation rend le participe substantivé et son caractère comportemental dans un français courant et digne.
- source_word: φρόνιμος
  choice: fait preuve de sagesse
  rationale: Le terme évoque une sagesse pratique, de la prudence ou du discernement. Cette tournure française exprime naturellement une qualité manifestée dans le choix de se taire.
- source_word: καὶ αὐτός
  choice: lui aussi
  rationale: L’expression conserve l’insistance grecque sur la personne silencieuse et le lien additif marqué par καί.
theological_decisions: []
translation_notes:
  register: Français international moderne, proverbial et digne. « Reproches » évite l’archaïsme de « réprimande » tout en gardant la force corrective du grec; « à propos » préserve l’ambiguïté entre le bon moment et la convenance générale.
