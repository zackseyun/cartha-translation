translation:
  language: fr
  text: Ceux qui mangent mon pain ont la langue méchante. Combien de fois, et combien seront-ils[a] à se moquer de lui[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec de cette proposition est abrupt et peut refléter un texte condensé ou difficile; la traduction en conserve autant que possible la formulation.
