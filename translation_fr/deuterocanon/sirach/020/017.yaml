lexical_decisions:
- source_word: οἱ ἐσθίοντες
  choice: ceux qui mangent
  rationale: Le participe présent substantivé exprime une conduite générale ou répétée; cette tournure est naturelle en français.
- source_word: τὸν ἄρτον μου
  choice: mon pain
  rationale: La traduction concrète conserve l’image du partage de la table ou des biens reçus.
- source_word: φαῦλοι γλώσσῃ
  choice: ont la langue mauvaise
  rationale: φαῦλοι qualifie ici moralement la parole, et le datif γλώσσῃ maintient l’image concrète de la langue. La formulation française est claire sans réduire le sens à une simple maladresse verbale.
- source_word: ποσάκις
  choice: combien de fois
  rationale: Équivalent interrogatif direct qui conserve la force rhétorique du grec.
- source_word: καὶ ὅσοι
  choice: et combien nombreux
  rationale: La formule volontairement abrupte reflète l’enchaînement difficile du texte grec sans ajouter explicitement « ceux qui » ou « les gens ».
- source_word: καταγελάσονται
  choice: se moqueront de
  rationale: Le verbe exprime plus précisément une dérision dirigée contre quelqu’un que le simple fait de rire.
- source_word: αὐτοῦ
  choice: lui
  rationale: Le génitif masculin régi par καταγελάω renvoie naturellement à une personne, mais son antécédent reste implicite dans le texte conservé.
theological_decisions:
- issue: Abruptness et possible compression de la seconde proposition
  choice: 'Conserver la question abrupte : « Combien de fois, et combien nombreux, se moqueront de lui ? »'
  alternative: Lisser en « Combien de fois et combien de gens se moqueront de lui ! »
  rationale: Le grec transmis est syntaxiquement difficile. La traduction préserve cette incertitude au lieu d’ajouter un sujet ou de reconstruire silencieusement le texte.
- issue: Référent de αὐτοῦ
  choice: Traduire par « lui » sans préciser l’antécédent
  alternative: Identifier explicitement la personne visée
  rationale: Le masculin est net, mais le référent ne l’est pas dans ce verset; toute précision dépasserait les données du texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Ont la langue mauvaise » conserve l’image grecque dans une formulation idiomatique. La seconde phrase demeure délibérément heurtée afin de ne pas masquer la difficulté du texte source.
