  text: There is one who keeps silent because there is no answer[b][a], and there is one who keeps silent because he sees the right time.
translation:
  language: fr
  text: L’un se tait faute de réponse[b], l’autre parce qu’il voit le moment opportun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec dit : « Un homme sage gardera le silence jusqu’au moment opportun, mais le bavard et l’insensé dépasseront le moment opportun. » Les formes hébraïque et grecque de ce proverbe diffèrent sensiblement. Le texte principal suit le témoin hébreu conservé ; le grec éclaire la nuance de moment opportun.'
    reason: textual_variant
  - marker: b
    text: 'Ou : « parce qu’il n’a pas de réponse » ; littéralement, « en l’absence de réponse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲרִישׁ
  choice: garde le silence
  rationale: Le participe de חרש désigne ici le fait de s’abstenir de parler. « Garde le silence » restitue l’aspect duratif et proverbial dans un français naturel.
- source_word: מֵאֵין מַעֲנֶה
  choice: faute de réponse
  rationale: L’expression hébraïque indique l’absence de réponse ou de réplique. Cette formulation concise conserve l’ambiguïté quant à savoir si aucune réponse n’existe ou si la personne n’en a pas.
- source_word: עֵת
  choice: le bon moment
  rationale: עֵת signifie « temps, moment, occasion » et suggère ici, dans un contexte sapiential, le moment approprié. Le parallèle grec confirme cette nuance d’opportunité.
- source_word: רֹאֶה עֵת
  choice: sait discerner le bon moment
  rationale: Littéralement, l’hébreu dit « voit le moment ». « Sait discerner » rend naturellement en français la perception avisée de l’occasion, sans réduire le sens à une simple attente.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et proverbial. La répétition « il y a celui qui garde le silence » reproduit la structure contrastive de l’hébreu. « Sait discerner » privilégie une formulation française naturelle tout en explicitant légèrement l’image littérale « voit ».
