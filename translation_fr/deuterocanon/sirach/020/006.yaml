revisions:
- from: Il y a celui qui garde le silence faute de réponse[b], et il y a celui qui garde le silence parce qu’il sait discerner le bon moment.[a]
  to: L’un se tait faute de réponse[b], l’autre parce qu’il voit le moment opportun.[a]
  rationale: La révision adopte une tournure proverbiale française plus fluide, conserve l’opposition binaire de l’hébreu et remplace l’explicitation interprétative « sait discerner » par « voit », plus proche de רֹאֶה. La note sur le grec est ajustée pour une traduction plus fidèle du verbe grec.
