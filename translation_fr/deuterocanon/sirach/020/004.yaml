translation:
  language: fr
  text: Il y en a qui se taisent et qu’on trouve sages, et d’autres qui sont détestés parce qu’ils parlent beaucoup.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστιν
  choice: Il y a celui qui
  rationale: La formule existentielle répétée présente deux types de personnes et structure le contraste proverbial.
- source_word: σιωπῶν
  choice: garde le silence
  rationale: Le participe présent exprime une attitude continue ; cette formulation naturelle suggère la retenue sans la surinterpréter.
- source_word: εὑρισκόμενος σοφός
  choice: que l’on trouve sage
  rationale: Cette tournure conserve la valeur passive de εὑρισκόμενος et laisse ouverte la nuance entre constat et réputation.
- source_word: μισητός
  choice: est détesté
  rationale: Le terme grec exprime fortement le fait d’être l’objet de haine ou d’aversion ; « détesté » est direct et actuel.
- source_word: ἀπὸ πολλῆς λαλιᾶς
  choice: parce qu’il parle beaucoup
  rationale: ἀπό indique ici la cause, tandis que πολλῆς λαλιᾶς désigne une parole abondante. La formulation française est claire sans ajouter explicitement l’idée de bavardage futile.
