  text: There is one who destroys his own life through shame[b][a], and because of a foolish face he will lose it.
translation:
  language: fr
  text: Il y a quelqu’un qui détruit sa propre vie[a] par honte et qui, à cause d’une expression insensée[b], la perdra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa propre âme » ou « lui-même » ; le grec ψυχή peut désigner la vie, la personne elle-même ou l’âme.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « à partir d’un visage insensé ». La locution grecque est difficile ; « visage » peut désigner l’expression ou l’apparence extérieure. Le lien introduit par « à partir de » peut aussi avoir une nuance causale.
    reason: textual_or_semantic_ambiguity
lexical_decisions:
- source_word: ἀπολλύων
  choice: détruit
  rationale: Le participe de ἀπόλλυμι peut signifier « détruire », « ruiner » ou « perdre ». « Détruit » conserve ici la gravité du propos ainsi que son lien verbal avec le futur ἀπολεῖ.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: sa propre vie
  rationale: Dans ce contexte sapientiel, ψυχή désigne naturellement la vie ou la personne elle-même. « Sa propre vie » exprime clairement la portée réflexive sans imposer une conception particulière de l’âme.
- source_word: διʼ αἰσχύνην
  choice: par honte
  rationale: διά avec l’accusatif exprime ici la cause ou le moyen. « Par honte » reste concis et laisse ouverte la nuance entre honte ressentie et fausse honte sociale.
- source_word: ἀπὸ ἄφρονος προσώπου
  choice: à cause d’un visage insensé
  rationale: La formulation rend directement l’image grecque, littéralement « provenant d’un visage insensé ». Elle évite de réduire sans avertissement πρόσωπον à une simple expression faciale ou à la considération accordée à autrui.
- source_word: ἀπολεῖ αὐτήν
  choice: la perdra
  rationale: Le pronom féminin renvoie à ψυχή, rendu par « vie ». « La perdra » est idiomatique en français et maintient l’écho avec le premier emploi de ἀπόλλυμι.
theological_decisions:
- issue: Sens de ψυχή dans ce contexte sapientiel
  choice: vie
  alternative: âme ; lui-même
  rationale: Le verset décrit les conséquences autodestructrices de la honte. « Vie » convient au contexte pratique tout en évitant de transformer le passage en affirmation précise sur la nature métaphysique de l’âme.
- issue: Interprétation de ἀπὸ ἄφρονος προσώπου
  choice: conserver l’image du « visage insensé » dans le texte
  alternative: à cause d’une expression insensée ; par respect humain ; devant un insensé
  rationale: La locution grecque est difficile et son référent exact demeure incertain. La traduction principale préserve donc l’image et la note présente les principales possibilités sans trancher abusivement.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure existentielle « Il y a quelqu’un qui » reproduit le caractère général de ἔστιν, tandis que la formulation volontairement frappante « visage insensé » conserve l’ambiguïté de l’image grecque, explicitée en note.
