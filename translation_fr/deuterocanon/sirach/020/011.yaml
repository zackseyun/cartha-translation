  timestamp: '2026-07-15T10:22:17Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens commercial et proverbial est bien visé : acheter beaucoup pour peu, puis acquitter une somme sept fois supérieure. Toutefois, « le rembourse » donne à « le » un antécédent français imprécis et rend moins clairement la relation de prix exprimée de façon condensée par le grec.'
  naturalness: '« Il y a celui qui » est peu naturel en français moderne, et « le rembourse au septuple » est maladroit : on rembourse normalement une somme, une dette ou une personne, non « beaucoup » ou des biens achetés. Une formulation avec « Il en est qui » et « en paient le septuple » est plus idiomatique tout en conservant la brièveté proverbiale.'
  terminology: Aucun terme théologique n’est en jeu. « Au septuple » peut être conservé dans la note comme équivalent explicatif, mais « en paient le septuple » est l’expression française la plus nette pour le rapport multiplicatif sans déterminer davantage la circonstance.
  issues:
  - severity: medium
    issue: Formule introductive peu idiomatique
    rationale: « Il y a celui qui » est calqué et lourd. « Il en est qui » rend naturellement la formule existentielle grecque introduisant un type de personne.
  - severity: medium
    issue: Pronom et verbe français ambigus et peu naturels
    rationale: Dans « le rembourse », l’antécédent de « le » est difficile à identifier et « rembourser » ne convient pas naturellement aux biens achetés. « En paient le septuple » exprime clairement le coût final sans résoudre abusivement l’ambiguïté condensée du grec.
  revised_text: Il en est qui achètent beaucoup pour peu et qui en paient le septuple.[a]
