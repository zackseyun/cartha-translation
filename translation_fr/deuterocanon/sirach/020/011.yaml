  text: There is one who buys much for little[b][a], and repays it sevenfold.
translation:
  language: fr
  text: Il en est qui achètent beaucoup pour peu et qui en paient le septuple.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « et qui les rembourse au septuple » ; le pronom est au pluriel. La phrase est condensée : elle peut évoquer quelqu’un qui achète beaucoup de choses à bas prix mais finit par en payer sept fois le prix, ou, plus généralement, une bonne affaire apparente qui se révèle très coûteuse.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστιν
  choice: Il y a celui qui
  rationale: La formule existentielle introduit, dans le style sapientiel, un type de personne ou un cas particulier.
- source_word: ἀγοράζων
  choice: achète
  rationale: Le participe désigne directement l’action d’acheter et conserve l’image commerciale.
- source_word: πολλὰ
  choice: beaucoup
  rationale: Le neutre pluriel peut désigner beaucoup de choses ou une grande quantité; « beaucoup » garde la formulation concise sans préciser indûment le référent.
- source_word: ὀλίγου
  choice: pour peu
  rationale: Le génitif exprime ici le prix; cette tournure concise signifie « à bas prix » tout en restant proche du grec.
- source_word: ἀποτιννύων
  choice: rembourse
  rationale: Le verbe exprime le paiement de ce qui est dû ou la restitution; « rembourse » préserve le cadre financier et la possibilité d’une conséquence ultérieure.
- source_word: αὐτὰ
  choice: le
  rationale: Le pronom grec est formellement au neutre pluriel, mais son référent condensé peut être rendu collectivement en français par « le », renvoyant à ce qui a été acheté ou à son coût; la forme littérale est signalée en note.
- source_word: ἑπταπλάσιον
  choice: au septuple
  rationale: Le terme indique une mesure multipliée par sept; « au septuple » conserve la force brève du proverbe sans déterminer s’il s’agit du prix, de la valeur ou d’une autre forme de retour.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et proverbial. La syntaxe conserve la concision et l’ambiguïté du grec tout en restant naturelle; la note explicite le pluriel de αὐτά et les deux compréhensions principales de l’image.
