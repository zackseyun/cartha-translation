revisions:
- from: Il y a celui qui achète beaucoup pour peu et qui le rembourse au septuple.[a]
  to: Il en est qui achètent beaucoup pour peu et qui en paient le septuple.[a]
  rationale: La révision remplace deux tournures françaises maladroites par une formulation moderne et proverbiale. « En paient le septuple » rend le rapport de sept à un et laisse ouverte la question de savoir si le grec envisage un paiement ultérieur précis ou le coût réel d’une acquisition prétendument avantageuse. La note conserve le pluriel de αὐτά et l’ambiguïté de l’énoncé.
