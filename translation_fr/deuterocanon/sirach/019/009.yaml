  text: Have you heard a word? Let it die with you[a]; take courage[b], it will not burst you open.
translation:
  language: fr
  text: As-tu entendu une parole ? Qu’elle meure avec toi[a]. Courage ! Elle ne te fera pas éclater[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Une parole » peut aussi signifier ici « une affaire » ou « une information rapportée » (λόγον).
    reason: lexical_alternative
  - marker: b
    text: 'L’image grecque est très vive : la parole gardée secrète ne te fera pas « éclater », comme si elle exerçait une pression à l’intérieur de toi.'
    reason: cultural_note
lexical_decisions:
- source_word: ἀκήκοας
  choice: As-tu entendu
  rationale: Le parfait grec présente une chose entendue qui reste présente à l’esprit; la question au passé composé est naturelle en français et conserve la portée rhétorique.
- source_word: λόγον
  choice: une parole
  rationale: Dans ce contexte, λόγος peut désigner une parole, une affaire ou une information rapportée. « Une parole » préserve la brièveté proverbiale sans préciser indûment.
- source_word: συναποθανέτω σοι
  choice: Qu’elle meure avec toi
  rationale: L’impératif exprime métaphoriquement que la parole entendue ne doit pas être transmise. Cette formulation conserve l’image forte et concise du grec.
- source_word: θάρσει
  choice: Courage !
  rationale: L’impératif de θαρσέω rassure l’auditeur. « Courage ! » est actuel, direct et plus naturel ici que « prends courage ».
- source_word: οὐ μή
  choice: ne… pas
  rationale: La construction marque une négation forte. En français, le futur négatif suffit naturellement; la note et l’image énergique renforcent l’assurance.
- source_word: ῥήξει
  choice: fera éclater
  rationale: Le futur de ῥήγνυμι évoque le fait de rompre ou de faire éclater. « Elle ne te fera pas éclater » garde l’hyperbole corporelle sans la remplacer par le sens abstrait « elle ne te fera pas de mal ».
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et proverbial. La traduction conserve les images de la mort et de l’éclatement ainsi que l’ambiguïté de λόγος, sans expliciter dans le corps du texte qu’il s’agit d’un secret.
