    issue: Ajout d’un objet à « menacer »
    rationale: Le grec ἀπειλῆσαι (« menacer ») ne porte pas de complément explicite. Le pronom « le » restreint donc indûment la cible des menaces au prochain précédemment mentionné.
  - severity: low
    issue: Note alternative trop interprétative
    rationale: « Laisse la loi du Très-Haut suivre son cours » peut être une conséquence contextuelle envisagée, mais elle explicite davantage que le grec δὸς τόπον (« fais/donne place »). Une note plus proche de l’image conserve mieux l’ambiguïté.
