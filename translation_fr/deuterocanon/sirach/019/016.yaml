  text: Rebuke your neighbor before you threaten[a], and give place to the law of the Most High.
translation:
  language: fr
  text: Reprends ton prochain avant de proférer des menaces, et fais place à la loi du Très-Haut[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « accorde une place à la loi du Très-Haut ». Le grec dit littéralement : « donne place à » ; l’expression peut évoquer le fait de se soumettre à la loi ou de la laisser guider la réponse.'
    reason: Préserve l’image de l’expression grecque et ses deux nuances possibles sans imposer l’interprétation « laisser suivre son cours ».
lexical_decisions:
- source_word: ἔλεγξον
  choice: Reprends
  rationale: L’impératif demande une correction verbale directe qui met la faute en lumière. « Reprends » conserve la gravité morale du grec sans supposer nécessairement une condamnation.
- source_word: τὸν πλησίον σου
  choice: ton prochain
  rationale: Dans ce contexte éthique, πλησίον désigne la personne avec laquelle on est en relation. « Ton prochain » est clair, naturel et bien établi dans le langage biblique français.
- source_word: πρὶν ἢ
  choice: avant de
  rationale: 'La locution marque ici une priorité temporelle : il faut d’abord reprendre la personne plutôt que passer immédiatement à la menace.'
- source_word: ἀπειλῆσαι
  choice: le menacer
  rationale: Le verbe signifie normalement « menacer ». Le pronom « le » explicite en français que la menace vise le prochain, conformément à la construction grecque.
- source_word: δὸς τόπον
  choice: fais place
  rationale: Cette expression préserve la métaphore grecque de l’espace accordé tout en restant idiomatique en français. Elle peut évoquer le fait de s’effacer devant la loi ou de la laisser agir.
- source_word: νόμῳ
  choice: à la loi
  rationale: νόμος désigne ici la loi ou l’instruction divine, présentée comme la norme qui doit gouverner la réaction du lecteur.
- source_word: Ὑψίστου
  choice: du Très-Haut
  rationale: « Le Très-Haut » est le titre divin français traditionnel et naturel correspondant au superlatif grec.
theological_decisions:
- issue: Portée de δὸς τόπον νόμῳ Ὑψίστου
  choice: Inviter le lecteur à s’effacer devant la loi du Très-Haut et à lui accorder la place directrice
  alternative: Laisser la loi du Très-Haut suivre son cours, notamment au lieu d’exercer soi-même une menace ou une sanction
  rationale: 'Le grec conserve une certaine ouverture : il peut s’agir de se soumettre à la loi comme norme ou de la laisser agir. « Fais place » maintient cette tension sans préciser indûment le mécanisme juridique ou moral envisagé.'
translation_notes:
  register: Français moderne, concis et digne. « Reprends » et « ton prochain » conservent le registre sapientiel biblique tout en restant compréhensibles; « fais place » maintient l’image du grec sans lourdeur.
