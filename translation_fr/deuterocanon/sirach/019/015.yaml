  text: A man may slip and not mean it; and who has not sinned with his tongue?
translation:
  language: fr
  text: Il arrive à quelqu’un de trébucher sans le vouloir[a] ; et qui n’a jamais péché par sa langue ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et non à partir de l’âme » ; autre traduction possible : « sans intention » ou « sans que cela vienne du fond de lui-même ».'
    reason: La formule grecque οὐκ ἀπὸ ψυχῆς est plus imagée et légèrement plus ouverte que la traduction idiomatique « sans le vouloir ».
lexical_decisions:
- source_word: ἔστιν ὀλισθάνων
  choice: Il arrive à quelqu’un de trébucher
  rationale: L’expression existentielle avec participe présente un cas général. Cette tournure française reste naturelle tout en conservant le sujet humain indéfini et l’image du faux pas.
- source_word: οὐκ ἀπὸ ψυχῆς
  choice: sans le vouloir
  rationale: Littéralement « non à partir de l’âme ». Dans ce contraste, l’expression indique que le faux pas ne procède pas de l’intention profonde de la personne ; « sans le vouloir » transmet ce sens sans effacer la formulation littérale, signalée en note.
- source_word: τίς οὐχ ἥμαρτεν
  choice: qui n’a jamais péché
  rationale: La question rhétorique implique que tout le monde a connu cette faute. « Péché » conserve la portée morale de ἁμαρτάνω, tandis que « jamais » rend idiomatiquement en français la force de la question au parfait.
- source_word: ἐν τῇ γλώσσῃ αὐτοῦ
  choice: par sa langue
  rationale: Cette formulation conserve la métaphore corporelle grecque et présente la langue comme le moyen de la faute, plutôt que de la remplacer par l’abstraction « en paroles ».
theological_decisions:
- issue: Portée morale ou simple erreur exprimée par ἥμαρτεν
  choice: péché
  alternative: commis une faute
  rationale: Le contexte sapiential traite le manquement verbal comme une faute morale. « Péché » maintient cette force sans préciser davantage sa nature théologique.
- issue: Caractère intentionnel du faux pas
  choice: sans le vouloir
  alternative: sans que cela vienne de son âme
  rationale: Le grec oppose un faux pas à ce qui procède de l’âme ou de l’intention. La traduction principale exprime cette opposition de façon intelligible, tandis que la note préserve l’image et l’ambiguïté de la formulation source.
translation_notes:
  register: Français international moderne, proverbial et digne. Le point-virgule maintient le lien entre le faux pas involontaire et l’universalité des fautes de parole. Le pronom indéfini « quelqu’un » évite d’ajouter un nom masculin absent du grec, tout en gardant la portée générale.
