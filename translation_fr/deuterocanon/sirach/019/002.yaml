  text: Wine and women lead the heart astray[a], and a bold soul destroys its owner.
translation:
  language: fr
  text: Le vin et les femmes rendent le cœur irréfléchi[a], et une âme téméraire détruit celui qui la possède.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Le vin et les femmes détourneront les hommes sensés, et celui qui s’attache aux prostituées deviendra plus téméraire. » Le témoin hébreu diffère considérablement dans le second membre.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַיִן
  choice: le vin
  rationale: Le nom hébreu désigne simplement le vin; la traduction littérale convient à l’avertissement.
- source_word: נָשִׁים
  choice: les femmes
  rationale: Le pluriel hébreu signifie normalement « femmes »; rien dans le texte hébreu ne le limite aux épouses ou aux prostituées.
- source_word: יַפְחִיזוּ
  choice: rendent … irréfléchi
  rationale: Le verbe exprime l’idée de rendre impétueux, instable ou irréfléchi. Cette tournure naturelle en français conserve le lien direct avec « le cœur » sans réduire le sens à un simple égarement.
- source_word: לֵב
  choice: le cœur
  rationale: Dans l’anthropologie hébraïque, le cœur est le siège de la pensée, du jugement et des désirs; le terme concret est conservé.
- source_word: נֶפֶשׁ
  choice: une âme
  rationale: נֶפֶשׁ désigne ici la personne comme être vivant ou soi animé. « Âme » préserve l’image du texte, sans lui imposer un sens anthropologique technique.
- source_word: עָזָה
  choice: téméraire
  rationale: L’adjectif évoque la force, l’audace ou l’effronterie. Dans ce contexte moral, « téméraire » rend clairement l’audace imprudente sans introduire une référence sexuelle absente de l’hébreu.
- source_word: תַשְׁחִית
  choice: mène à sa perte
  rationale: Le verbe signifie détruire ou ruiner. La locution française exprime naturellement la gravité de l’avertissement tout en permettant de rendre clairement la relation entre l’âme et celui qui la possède.
- source_word: בְעָלֶיהָ
  choice: celui qui la possède
  rationale: Littéralement « son propriétaire/maître », avec un suffixe féminin renvoyant à « âme ». La formulation choisie conserve cette relation tout en étant plus naturelle que « son propriétaire » en français.
theological_decisions:
- issue: Primauté du témoin hébreu malgré l’écart important avec le grec
  choice: Traduire directement l’hébreu conservé et signaler en note la leçon grecque complète.
  alternative: 'Suivre le grec : « Le vin et les femmes détourneront les hommes sensés, et celui qui s’attache aux prostituées deviendra plus téméraire. »'
  rationale: Le texte hébreu est ici disponible avec une confiance élevée et constitue le témoin principal. Le second membre grec diffère substantiellement; il ne faut donc ni l’insérer dans le texte principal ni harmoniser silencieusement les deux formes.
translation_notes:
  register: Français international moderne, digne et accessible. « Irréfléchi » et « téméraire » rendent les deux nuances apparentées de conduite impulsive sans les confondre. La syntaxe garde le parallélisme sentencieux de l’hébreu.
