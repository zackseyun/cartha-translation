  text: Réprimande un ami, car il y a souvent de la calomnie, et ne crois pas toute parole.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγξον
  choice: Reprends
  rationale: L’impératif de ἐλέγχω invite à mettre quelqu’un face à ce qui lui est reproché, avec une idée d’examen et de correction. « Reprends » conserve cette force morale sans supposer d’emblée sa culpabilité.
- source_word: φίλον
  choice: un ami
  rationale: Le singulier sans article a ici une valeur générale, adaptée au caractère proverbial de la phrase.
- source_word: πολλάκις
  choice: souvent
  rationale: Équivalent direct, courant et naturel de l’adverbe grec.
- source_word: γὰρ
  choice: car
  rationale: Le connecteur introduit la raison qui justifie l’exhortation précédente.
- source_word: γίνεται διαβολή
  choice: il s’agit souvent d’une calomnie
  rationale: διαβολή désigne une accusation malveillante ou diffamatoire. Avec γίνεται, la formulation indique qu’une parole rapportée peut se révéler calomnieuse.
- source_word: μὴ παντὶ λόγῳ πίστευε
  choice: ne crois pas tout ce qui se dit
  rationale: Littéralement, le grec dit de ne pas croire « toute parole ». La formulation française retenue est naturelle et garde l’idée de ne pas accepter sans examen chaque propos ou accusation rapportés.
