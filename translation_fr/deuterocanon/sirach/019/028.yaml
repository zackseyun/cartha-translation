  yaml_path: translation/deuterocanon/sirach/019/028.yaml
  text: And if he is prevented from sinning by lack of strength[a], when he finds an opportunity, he will do evil.
translation:
  language: fr
  text: Et s’il est empêché de pécher par manque de force, s’il trouve une occasion, il fera le mal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il fera du tort » ; le verbe grec peut désigner soit le fait de faire le mal en général, soit celui de nuire à autrui plus précisément.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλαττώματος ἰσχύος
  choice: manque de force
  rationale: 'La locution rend directement la cause exprimée par ὑπό avec le génitif : l’homme est empêché non par vertu, mais faute de force ou de capacité. « Manque de force » reste naturel sans préciser indûment s’il s’agit de force physique, de pouvoir ou de moyens.'
- source_word: κωλυθῇ
  choice: est empêché
  rationale: Le passif exprime un obstacle subi ou circonstanciel. « Est empêché » conserve mieux cette nuance que des termes pouvant suggérer une maîtrise intérieure.
- source_word: ἁμαρτεῖν
  choice: de pécher
  rationale: L’infinitif dépend de κωλυθῇ et nomme explicitement la faute morale. Cette formulation est idiomatique en français et fidèle au grec.
- source_word: καιρόν
  choice: l’occasion
  rationale: καιρός désigne ici une circonstance favorable, et non simplement un moment chronologique. « L’occasion » exprime clairement cette nuance.
- source_word: κακοποιήσει
  choice: il fera le mal
  rationale: Le verbe peut désigner le fait de faire le mal en général ou de causer du tort. Le texte principal conserve la portée morale large, tandis que la note signale le sens plus spécifique possible.
theological_decisions:
- issue: Portée morale du verset
  choice: 'L’incapacité de pécher n’équivaut pas à la justice : lorsque l’occasion se présente, la disposition mauvaise se manifeste.'
  alternative: Comprendre plus étroitement la dernière proposition comme l’annonce qu’il fera du tort à autrui.
  rationale: Le rapprochement entre ἁμαρτεῖν et κακοποιήσει présente une appréciation morale générale, mais le second verbe permet aussi un sens transitif plus ciblé. La traduction garde cette tension sans réduire le propos à une doctrine particulière.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « dès qu’il en trouvera l’occasion » rend naturellement le lien circonstanciel tout en préservant le futur catégorique du grec.
