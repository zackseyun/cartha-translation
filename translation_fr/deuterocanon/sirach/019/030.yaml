  text: A man's attire[a], and the laughter of his teeth, and a person's steps proclaim what is about him.
translation:
  language: fr
  text: La tenue d’un homme, le rire de ses dents[a] et ses pas révèlent ce qui le concerne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le sourire de ses dents ». Le grec dit littéralement « le rire des dents », image qui évoque l’expression manifestée par les dents.
    reason: lexical_alternative
lexical_decisions:
- source_word: στολισμὸς
  choice: tenue
  rationale: Le nom désigne la parure ou l’arrangement extérieur. « Tenue » exprime naturellement en français l’habillement et la présentation visible, sans réduire le terme à la seule apparence morale.
- source_word: ἀνδρὸς
  choice: d’un homme
  rationale: Le grec emploie ici le singulier masculin ἀνήρ. « D’un homme » en conserve explicitement la forme tout en restant naturel dans une maxime de sagesse.
- source_word: γέλως ὀδόντων
  choice: le rire de ses dents
  rationale: La formulation garde l’image grecque inhabituelle, littéralement « rire des dents ». Comme elle peut désigner le sourire ou l’expression manifestée par les dents, une formulation plus courante est donnée en note.
- source_word: βήματα ἀνθρώπου
  choice: sa démarche
  rationale: βήματα désigne les pas et, par extension naturelle dans ce contexte, la manière de marcher. « Démarche » rend mieux en français le signe observable dont parle la maxime. Le possessif relie les trois traits à la même personne, tandis que le grec passe de ἀνήρ à l’appellation humaine plus générale ἄνθρωπος.
- source_word: ἀναγγέλλει
  choice: révèlent
  rationale: Le verbe signifie annoncer ou faire connaître. « Révèlent » exprime clairement que les traits extérieurs communiquent quelque chose sur la personne. Le pluriel est exigé par la coordination naturelle des trois sujets en français, malgré le singulier grec.
- source_word: τὰ περὶ αὐτοῦ
  choice: ce qui le concerne
  rationale: Cette expression conserve la portée large du grec, « les choses à son sujet », sans la limiter exclusivement au caractère, à la réputation ou à la condition de l’homme.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et proverbial. La syntaxe reste proche du grec, mais emploie le pluriel verbal attendu en français et rend les « pas » par « démarche » pour désigner naturellement la manière de marcher.
