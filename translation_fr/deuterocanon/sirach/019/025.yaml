review_pass:
  verdict: revise
  source_fidelity: La première proposition rend fidèlement ἀπὸ ὁράσεως comme le critère visible de reconnaissance. Dans la seconde, le grec ἀπὸ ἀπαντήσεως προσώπου (« à partir de la rencontre du visage ») est elliptique et son sens exact demeure incertain. « Quand on le rencontre » introduit un développement temporel et personnel qui dépasse la formulation grecque; il vaut mieux conserver l’interprétation dans une note.
  naturalness: La formulation révisée est fluide, moderne et garde le parallélisme proverbial des deux membres.
  terminology: « Un homme » respecte ἀνήρ. « Un homme de discernement » rend adéquatement νοήμων dans un registre sapientiel. « Apparence » et « expression de son visage » sont naturels; la note indique que cette dernière expression interprète une tournure grecque difficile.
  issues:
  - severity: medium
    issue: Développement interprétatif dans « quand on le rencontre »
    rationale: La notion de rencontre appartient bien à ἀπάντησις, mais le grec ne précise ni « quand » ni « on », et ne formule pas explicitement une rencontre avec le lecteur. Ce développement doit être retiré du texte et signalé dans la note.
  - severity: low
    issue: Ancrage de note trop large
    rationale: La note concerne spécifiquement le second critère de reconnaissance; son marqueur doit suivre « visage » plutôt que la phrase entière.
