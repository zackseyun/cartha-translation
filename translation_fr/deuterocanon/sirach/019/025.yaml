  text: A man is recognized by his appearance[a], and a man of understanding is recognized by the expression of his face.
translation:
  language: fr
  text: On reconnaît un homme à son apparence, et un homme de discernement à l’expression de son visage[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à partir de la rencontre du visage ». Le sens précis de cette tournure grecque est incertain ; elle peut évoquer ce que le visage manifeste lors d’une rencontre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ ὁράσεως
  choice: à son apparence
  rationale: La tournure avec ἀπό indique ici ce qui permet la reconnaissance. « À son apparence » exprime naturellement en français l’aspect visible, sans en faire nécessairement un jugement sur le caractère.
- source_word: ἐπιγνωσθήσεται
  choice: on reconnaît
  rationale: Le futur passif a ici une valeur générale propre à une maxime. Le présent impersonnel français rend cette portée gnomique tout en conservant l’idée de reconnaissance.
- source_word: ἀνήρ
  choice: un homme
  rationale: Le grec emploie un nom masculin singulier. La traduction le conserve, conformément à la formulation de la maxime.
- source_word: ἀπὸ ἀπαντήσεως προσώπου
  choice: à ce que révèle son visage quand on le rencontre
  rationale: L’expression grecque associe l’idée de rencontre ou d’abord à celle du visage. Cette formulation française rend intelligible la scène d’une rencontre tout en maintenant le visage comme indice visible; une note signale la littéralité et l’ambiguïté de la tournure.
- source_word: νοήμων
  choice: un homme de discernement
  rationale: νοήμων désigne celui qui comprend et sait discerner. « De discernement » convient au registre sapientiel et dépasse la seule intelligence intellectuelle.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et proverbial. Le parallélisme des deux propositions est préservé, tandis que la seconde expression, peu naturelle si elle est traduite mot à mot, est explicitée avec prudence et accompagnée d’une note.
