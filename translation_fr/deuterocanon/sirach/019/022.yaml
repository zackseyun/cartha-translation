  text: There is one who plots evil[a], bent low in gloom, and inwardly he is full of deceit;
translation:
  language: fr
  text: Il y a quelqu’un qui trame le mal, voûté, l’air sombre[a], et qui est, au-dedans, plein de tromperie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « voûté dans la mélancolie » ou « voûté dans la noirceur » ; le grec peut évoquer soit une humeur sombre, soit une apparence assombrie.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστιν
  choice: Il y a quelqu’un
  rationale: La tournure existentielle présente un type de personne; « quelqu’un » rend la formulation naturelle en français.
- source_word: πονηρευόμενος
  choice: qui fait le mal
  rationale: Le participe exprime une conduite mauvaise active, sans imposer l’idée plus précise d’un complot que le grec n’exige pas nécessairement.
- source_word: συγκεκυφώς
  choice: courbé
  rationale: Le participe parfait décrit une posture abaissée ou voûtée, qui peut être physique, affective ou adoptée.
- source_word: μελανίᾳ
  choice: sombre
  rationale: Ce choix français naturel conserve, avec l’appui de la note, la possibilité d’une humeur noire comme celle d’une apparence assombrie.
- source_word: τὰ ἐντὸς αὐτοῦ
  choice: son intérieur
  rationale: L’expression désigne ce qui est au-dedans de la personne et maintient le contraste avec son aspect extérieur.
- source_word: πλήρης δόλου
  choice: plein de tromperie
  rationale: δόλος désigne la ruse ou la duplicité; « tromperie » est clair, actuel et moralement précis sans surenchère.
theological_decisions:
- issue: Rapport entre l’attitude extérieure et la tromperie intérieure
  choice: Le texte juxtapose une posture courbée et sombre à un intérieur rempli de tromperie.
  alternative: La posture pourrait exprimer un abattement réel plutôt qu’une apparence calculée.
  rationale: Le verset crée un contraste suggestif, mais ne dit pas explicitement que l’attitude extérieure est feinte; la traduction ne tranche donc pas ce point.
translation_notes:
  register: Français international moderne, sobre et digne. La coordination et le contraste entre l’extérieur et l’intérieur sont conservés sans transformer explicitement la tristesse apparente en hypocrisie calculée.
