  text: An arrow stuck in the thigh of flesh—so is a word in the belly of a fool[a].
translation:
  language: fr
  text: 'Une flèche plantée dans la chair de la cuisse : telle est une parole dans le ventre d’un insensé[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque est condensée; on pourrait aussi comprendre : « une flèche plantée dans une cuisse de chair ». L’image est celle d’une flèche fichée dans la chair de la cuisse.'
    reason: ambiguïté syntaxique et solution lexicale
lexical_decisions:
- source_word: βέλος
  choice: flèche
  rationale: Dans cette image corporelle, βέλος désigne naturellement une flèche plutôt qu’un projectile au sens général.
- source_word: πεπηγὸς
  choice: plantée
  rationale: Le participe parfait de πήγνυμι décrit une flèche qui demeure fichée; « plantée » exprime clairement cet état en français courant.
- source_word: ἐν μηρῷ σαρκός
  choice: dans la chair de la cuisse
  rationale: μηρός désigne précisément la cuisse et σάρξ la chair au sens physique. Cette formulation française naturelle conserve les deux éléments malgré la construction grecque condensée.
- source_word: λόγος
  choice: parole
  rationale: Dans le contexte, il s’agit d’une parole ou d’un propos retenu intérieurement; « parole » garde la portée générale du grec.
- source_word: ἐν κοιλίᾳ
  choice: dans le ventre
  rationale: κοιλία signifie littéralement le ventre et prolonge ici l’image corporelle du premier membre.
- source_word: μωροῦ
  choice: d’un insensé
  rationale: Dans la littérature sapientielle, μωρός caractérise une personne dépourvue de discernement moral et intellectuel; « insensé » convient au registre proverbial et biblique sans être archaïque.
theological_decisions:
- issue: Sens de σάρξ
  choice: chair au sens corporel
  alternative: corps
  rationale: Le terme appartient ici à une comparaison physique et ne porte pas de sens théologique tel que « nature pécheresse ». « Chair » préserve l’image concrète.
translation_notes:
  register: Français international moderne, concret et proverbial. Le parallélisme corporel entre la cuisse et le ventre est maintenu, tandis que la syntaxe grecque comprimée est rendue naturellement.
