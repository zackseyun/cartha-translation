  verdict: revise
  source_fidelity: 'Le sens de la maxime est globalement bien rendu : ἀπὸ ὁράσεως renvoie à l’apparence visible, et les deux passifs futurs peuvent naturellement être exprimés en français par une tournure proverbiale. Toutefois, « l’homme intelligent » suggère indûment un individu défini, alors que νοήμων est employé sans article et désigne « un homme intelligent / doué de discernement ». Le futur français rend en outre directement le futur passif grec sans nuire au registre proverbial.'
  naturalness: La formulation est naturelle et le parallélisme est clair. « À son apparence » et « à l’expression de son visage » sont idiomatiques dans ce contexte. « Un homme intelligent » est plus naturel et plus exact ici que « l’homme intelligent ».
  terminology: « Apparence » convient à ὁράσεως. « Expression de son visage » est une bonne solution moderne pour l’expression rare ἀπαντήσεως προσώπου; la note peut conserver l’alternative plus littérale « contenance ». « Intelligent » est acceptable pour νοήμων, tandis que « doué de discernement » explicite utilement une nuance possible en note.
