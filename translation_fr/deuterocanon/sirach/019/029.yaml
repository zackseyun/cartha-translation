  text: From appearance a man is recognized[a], and from the expression of the face one who has understanding is recognized.
translation:
  language: fr
  text: À son apparence, on reconnaîtra un homme, et à l’expression de son visage, on reconnaîtra un homme intelligent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « à la contenance de son visage, on reconnaîtra un homme doué de discernement ».'
    reason: La construction ἀπαντήσεως προσώπου est rare et peut désigner plus largement la contenance ou le maintien visible du visage; νοήμων peut aussi mettre l’accent sur le discernement.
lexical_decisions:
- source_word: ὁράσεως
  choice: apparence
  rationale: Dans ἀπὸ ὁράσεως, le mot désigne vraisemblablement l’aspect visible d’une personne plutôt que l’acte de voir. « Apparence » est naturel et convient au parallélisme du proverbe.
- source_word: ἐπιγνωσθήσεται
  choice: on reconnaît
  rationale: Le futur passif grec exprime ici une vérité générale de type proverbial. La tournure française au présent avec « on » rend naturellement l’idée qu’une personne est reconnue ou discernée d’après des signes visibles.
- source_word: ἀνήρ
  choice: un homme
  rationale: Le grec emploie un nom masculin singulier dans une maxime. « Un homme » en conserve la forme sans introduire le sens particulier de « mari ».
- source_word: ἀπαντήσεως προσώπου
  choice: à l’expression de son visage
  rationale: La formulation grecque inhabituelle évoque ce qui se présente ou se donne à voir sur le visage, c’est-à-dire son expression ou son maintien. Cette traduction reste claire en français moderne.
- source_word: νοήμων
  choice: l’homme intelligent
  rationale: νοήμων qualifie celui qui possède intelligence, compréhension et discernement. « Intelligent » est concis, courant et reprend la construction masculine du grec.
theological_decisions: []
translation_notes:
  register: Français moderne, proverbial et digne. Le parallélisme grec est conservé par la répétition de « on reconnaît ». Le présent rend la portée générale de la maxime, tandis que la note préserve l’ambiguïté de l’expression grecque rare.
