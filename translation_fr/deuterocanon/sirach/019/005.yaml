  text: Whoever rejoices in heart will be condemned[b][a], and whoever hates talk is lessened by evil.
translation:
  language: fr
  text: Celui qui se réjouit dans son cœur sera reconnu coupable ; celui qui déteste les bavardages[a] est diminué par le mal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec λαλιά peut aussi se traduire par « parole », « loquacité » ou « babillage » ; dans ce contexte, il désigne probablement des paroles excessives ou oiseuses plutôt que la parole en général.
    reason: lexical_alternative
  - marker: b
    text: La seconde proposition est très concise en grec. « Est diminué par le mal » peut aussi se comprendre comme « est amoindri sous l’effet de la méchanceté » ou, de façon moins probable, « diminue dans le mal ».
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ εὐφραινόμενος
  choice: celui qui se réjouit
  rationale: Le participe présent à valeur générale décrit une personne qui éprouve de la joie. Cette formulation conserve la portée proverbiale sans préciser indûment la cause ou la nature de cette joie.
- source_word: καρδίᾳ
  choice: dans son cœur
  rationale: Le datif exprime ici naturellement la disposition intérieure. Cette tournure est claire et idiomatique en français.
- source_word: καταγνωσθήσεται
  choice: sera reconnu coupable
  rationale: 'Le futur passif de καταγινώσκω possède une force judiciaire : il s’agit d’un verdict de culpabilité. « Sera condamné » reste possible, mais peut suggérer la peine plutôt que le constat de culpabilité.'
- source_word: λαλιὰν
  choice: les bavardages
  rationale: Dans ce contexte sapiential, λαλιά désigne vraisemblablement des paroles excessives ou oiseuses plutôt que toute parole en général. Le pluriel français est idiomatique.
- source_word: ἐλαττονοῦται
  choice: est diminué
  rationale: Le verbe signifie être rendu moindre ou diminué. La traduction conserve la forme passive et l’expression concise, même si la relation exacte avec κακίᾳ demeure difficile.
- source_word: κακίᾳ
  choice: par le mal
  rationale: Le datif peut être instrumental, mais sa relation précise avec le verbe est elliptique. « Par le mal » préserve cette concision sans réduire κακία à la seule malveillance.
theological_decisions:
- issue: Nature de la joie qui conduit au verdict de culpabilité
  choice: Ne pas préciser que la joie est mauvaise ou qu’elle porte sur le mal
  alternative: Celui qui se réjouit du mal sera reconnu coupable
  rationale: Le texte grec transmis dit seulement « se réjouit dans son cœur » et ne nomme pas l’objet de la joie. Malgré la difficulté du propos, ajouter « du mal » résoudrait une tension absente des mots de cette édition.
translation_notes:
  register: Français moderne, sobre et proverbial. Le point-virgule met en parallèle les deux membres. La formulation conserve délibérément l’étrangeté et l’ambiguïté du grec transmis, sans harmonisation avec d’autres formes textuelles possibles.
