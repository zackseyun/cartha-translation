  text: Reprove a friend[a], lest perhaps he did not say it; and if he did say it, so that he may not repeat it.
translation:
  language: fr
  text: 'Interroge un ami[a] : peut-être n’a-t-il pas dit cela ; et, s’il l’a dit, afin qu’il ne le répète pas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Reprends un ami ». Le verbe grec peut exprimer aussi bien l’examen ou l’interrogation que la réprimande. La suite du verset invite d’abord à vérifier les faits.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγξον
  choice: Interroge
  rationale: 'Le verbe ἐλέγχω peut désigner aussi bien l’examen qui établit les faits que la réprimande qui met une faute en lumière. La proposition suivante envisage que l’ami n’ait rien dit : « Interroge » rend donc en priorité la vérification, sans exclure une confrontation corrective.'
- source_word: τὸν φίλον
  choice: un ami
  rationale: Dans cette instruction proverbiale, l’article grec a une portée générique. « Un ami » est naturel en français et n’ajoute pas un possessif absent du texte.
- source_word: μή ποτε οὐκ εἶπεν
  choice: peut-être n’a-t-il pas dit cela
  rationale: μή ποτε introduit ici la possibilité prudente que les propos attribués à l’ami ne soient pas réels. « Cela » explicite seulement l’objet sous-entendu du verbe dire.
- source_word: καὶ εἰ εἴρηκεν
  choice: et s’il l’a dit
  rationale: Le parfait grec présente les paroles comme ayant effectivement été prononcées. Le passé composé français convient au caractère général de la maxime et reprend clairement l’objet implicite.
- source_word: ἵνα μὴ δευτερώσῃ
  choice: fais-le afin qu’il ne le répète pas
  rationale: La proposition en ἵνα exprime le second but de l’impératif initial dans le cas où le propos a bien été tenu. « Fais-le » rétablit naturellement en français le lien avec « Interroge », tandis que « le répète » rend δευτερόω dans son contexte de parole.
theological_decisions: []
translation_notes:
  register: 'Français moderne, clair et digne. La formulation conserve la progression du grec : vérifier d’abord si l’ami a réellement parlé, puis intervenir, si c’est le cas, pour éviter une répétition.'
