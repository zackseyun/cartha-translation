  text: Do not tell it to friend or foe[a], and if it is not a sin for you, do not reveal it.
translation:
  language: fr
  text: Ne le raconte ni à un ami ni à un ennemi et, si ce n’est pas pour toi un péché, ne le révèle pas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est concis et peut aussi se comprendre ainsi : « Ne le raconte ni à un ami ni à un ennemi; ne le révèle pas, à moins que garder le silence ne soit pour toi un péché. »'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν φίλῳ καὶ ἐν ἐχθρῷ
  choice: ni à un ami ni à un ennemi
  rationale: Les datifs désignent naturellement les personnes auxquelles on pourrait raconter l’affaire. La tournure française avec « ni… ni… » rend clairement la portée de l’interdiction tout en conservant le contraste grec.
- source_word: μὴ διηγοῦ
  choice: Ne le raconte
  rationale: διηγέομαι signifie raconter ou relater. Le complément, implicite en grec, renvoie à l’affaire évoquée dans le contexte; le pronom « le » est nécessaire en français courant.
- source_word: καὶ εἰ μή ἐστίν σοι ἁμαρτία
  choice: et, si ce n’est pas pour toi un péché
  rationale: Cette traduction suit directement la syntaxe grecque, dont la logique demeure concise et difficile. Elle évite de transformer silencieusement εἰ μή en une exception formulée par « à moins que », qui ferait de la faute le fait de garder le silence.
- source_word: μὴ ἀποκάλυπτε
  choice: ne le révèle pas
  rationale: ἀποκαλύπτω désigne ici le fait de dévoiler une information cachée. « Révéler » est naturel, précis et conserve une nuance plus forte que le premier verbe.
theological_decisions:
- issue: Portée de καὶ εἰ μή ἐστίν σοι ἁμαρτία
  choice: 'Conserver la formulation conditionnelle littérale : « si ce n’est pas pour toi un péché »'
  alternative: '« à moins que ce ne soit pour toi un péché », compris comme : à moins que garder le silence ne soit un péché'
  rationale: Le grec dit formellement « et si ce n’est pas pour toi un péché », sans préciser explicitement quel acte constituerait le péché. La traduction principale préserve cette tension et la note signale l’interprétation exceptive possible sans l’imposer.
translation_notes:
  register: Français international moderne, sobre et sentencieux. Le parallélisme et l’impératif négatif du texte sapiential sont conservés; la difficulté logique du second membre est maintenue dans le texte et explicitée en note.
