  text: And the knowledge of evil is not wisdom[a], and where the counsel of sinners is, there is no understanding.
translation:
  language: fr
  text: Et la connaissance du mal n’est pas la sagesse[a] ; là où se trouve le conseil des pécheurs, il n’y a pas de discernement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il n’y a pas de sagesse dans l’expertise du mal ». Le grec distingue σοφία (« sagesse »), ἐπιστήμη (« connaissance, expertise ») et φρόνησις (« discernement, prudence »).'
    reason: Signaler l’autre construction possible du premier membre et préserver les distinctions lexicales du grec.
lexical_decisions:
- source_word: σοφία
  choice: sagesse
  rationale: Équivalent courant dans la littérature sapientielle, avec une portée à la fois morale et intellectuelle.
- source_word: πονηρίας
  choice: du mal
  rationale: Rend largement le génitif et conserve le contraste moral sans le limiter à une forme particulière de méchanceté.
- source_word: ἐπιστήμη
  choice: connaissance
  rationale: Préserve la distinction lexicale avec σοφία (« sagesse ») et φρόνησις (« discernement »).
- source_word: βουλή
  choice: conseil
  rationale: Conserve le sens de délibération, d’avis ou de dessein, sans réduire le terme à un simple projet.
- source_word: ἁμαρτωλῶν
  choice: des pécheurs
  rationale: Rendu direct du génitif et catégorie morale biblique immédiatement compréhensible.
- source_word: φρόνησις
  choice: discernement
  rationale: Exprime l’intelligence pratique et morale tout en restant distinct de « sagesse » et de « connaissance ».
- source_word: οὐκ ἔστιν ὅπου
  choice: là où… il n’y a pas
  rationale: Reproduit naturellement en français la structure locative et la négation explicite du grec.
theological_decisions:
- issue: Statut de l’habileté ou de la connaissance orientée vers le mal
  choice: Le verset nie que la connaissance du mal constitue la sagesse et que le conseil des pécheurs relève du vrai discernement.
  alternative: Comprendre la première proposition comme une simple distinction entre la connaissance du mal et la sagesse, sans exclusion morale absolue.
  rationale: La double négation οὐκ ἔστιν formule un rejet net dans les deux membres, sans qu’il soit nécessaire d’ajouter une catégorie doctrinale extérieure au texte.
translation_notes:
  register: Français moderne, digne et accessible. La tournure parallèle reste proche du grec ; le point-virgule sépare clairement les deux affirmations coordonnées.
