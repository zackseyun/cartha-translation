  text: A worker in this will not become rich, and one who despises small things will be ruined.
translation:
  language: fr
  text: Celui qui fait cela ne s’enrichira pas, et celui qui méprise les petites choses ira à sa ruine.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Un travailleur ivrogne ne s’enrichira pas ; celui qui méprise les petites choses tombera peu à peu. »'
    reason: Signaler les précisions du témoin grec — « ivrogne » et « peu à peu » — qui ne sont pas explicites dans le texte hébreu fourni.
lexical_decisions:
- source_word: פּוֹעֵל זֹאת
  choice: celui qui s’adonne à cela
  rationale: Littéralement « celui qui fait/pratique cela ». La tournure française conserve le renvoi démonstratif au contexte précédent sans transformer פּוֹעֵל en simple désignation professionnelle. Le grec explicite toutefois un « travailleur ivrogne ».
- source_word: לֹא יַעֲשִׁיר
  choice: ne s’enrichira pas
  rationale: 'Rend directement le sens causatif/intransitif usuel du hifil de עשׁר dans ce contexte : devenir riche, s’enrichir.'
- source_word: וְבוֹזֶה מְעוּטִים
  choice: et celui qui méprise les petites choses
  rationale: Préserve le pluriel substantivé et assez large מְעוּטִים, confirmé par le grec τὰ ὀλίγα, sans le limiter arbitrairement à de petites sommes.
- source_word: יִתְעַרְעָר
  choice: ira à sa ruine
  rationale: Exprime naturellement l’idée de déclin, d’ébranlement ou de ruine portée par la forme hébraïque; le grec parallèle précise une chute progressive.
theological_decisions:
- issue: Nature de « cela » dans le premier membre
  choice: Conserver le renvoi « à cela »
  alternative: Expliciter « un travailleur ivrogne » d’après le grec
  rationale: Le texte hébreu fourni ne nomme pas l’ivrognerie et renvoie vraisemblablement au contexte antérieur. L’ambiguïté doit rester dans le texte principal; la leçon grecque est signalée en note.
- issue: Progressivité de la ruine
  choice: « ira à sa ruine » dans le texte, avec précision en note
  alternative: « tombera peu à peu »
  rationale: Le grec contient explicitement κατὰ μικρόν, alors que cette expression n’apparaît pas séparément dans l’hébreu fourni. La note conserve cet élément important sans l’introduire silencieusement dans le texte hébreu principal.
translation_notes:
  register: Français moderne, international et digne. « S’adonne à cela » reste naturel tout en maintenant le lien avec le contexte précédent. « Ira à sa ruine » évite une formulation excessivement technique et conserve la portée proverbiale.
