  text: A fool will suffer pangs at the sight of a word[a], like a woman in labor at the sight of a baby.
translation:
  language: fr
  text: À cause d’une parole[a], l’insensé éprouvera les douleurs de l’enfantement, comme celle qui accouche à cause de son bébé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque signifie littéralement « de devant la face / en présence d’une parole […] comme en présence d’un bébé »; elle indique ici la cause ou l’occasion. Le mot traduit par « parole » peut aussi signifier « propos » ou « affaire ».
    reason: ambiguïté lexicale et explication de l’idiome
lexical_decisions:
- source_word: ἀπὸ προσώπου
  choice: à cause de
  rationale: L’expression, répétée dans les deux membres, signifie littéralement « de devant la face / en présence de », mais elle marque ici la cause ou l’occasion. « À cause de » rend clairement ce rapport sans introduire l’idée absente de « voir ».
- source_word: λόγου
  choice: une parole
  rationale: λόγος peut désigner une parole, un propos ou une affaire. « Une parole » conserve ici la formulation brève et concrète du proverbe ainsi que son ambiguïté fondamentale.
- source_word: ὠδινήσει
  choice: éprouvera les douleurs de l’enfantement
  rationale: Le verbe évoque les douleurs de l’accouchement. Cette traduction maintient l’image explicitée par la comparaison qui suit.
- source_word: μωρός
  choice: l’insensé
  rationale: Terme courant de la littérature sapientielle pour une personne dépourvue de jugement; « l’insensé » est naturel, digne et non familier.
- source_word: βρέφους
  choice: son bébé
  rationale: βρέφος désigne un très jeune enfant. Dans le contexte immédiat de l’accouchement, « bébé » est le terme moderne le plus naturel; le possessif explicite en français le lien contextuel sans modifier le sens.
- source_word: ἡ τίκτουσα
  choice: celle qui accouche
  rationale: Rendu proche du grec, littéralement « celle qui enfante », tout en restant idiomatique et en conservant l’action d’accoucher plutôt qu’un simple état.
