  text: He stoops his face and pretends to be deaf[a]; where he is not recognized[b], he will outwit you.
translation:
  language: fr
  text: Il baisse le visage et fait semblant d’être sourd[a] ; là où on ne le reconnaît pas[b], il te prendra de vitesse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec est rare ; il peut aussi se rendre par « se comporte comme s’il était sourd » ou « feint la surdité ».
    reason: lexical_alternative
  - marker: b
    text: La phrase grecque est concise et difficile. « On ne le reconnaît pas » peut désigner le fait de ne pas l’identifier ou de ne pas discerner son jeu. Pour « il te prendra de vitesse », on peut aussi traduire « il te devancera » ou « il prendra les devants sur toi » ; le verbe grec évoque le fait d’agir avant quelqu’un et d’en tirer avantage.
    reason: textual_variant
lexical_decisions:
- source_word: συγκύφων πρόσωπον
  choice: Il baisse le visage
  rationale: Le participe συγκύφων exprime une posture courbée ou inclinée, tandis que πρόσωπον désigne le visage. Cette formulation française conserve le geste concret sans lui attribuer explicitement un motif.
- source_word: ἑτεροκωφῶν
  choice: fait semblant d’être sourd
  rationale: Ce verbe rare décrit apparemment quelqu’un qui se comporte comme s’il était sourd. La traduction rend naturellement cette attitude feinte, tout en la signalant en note.
- source_word: ὅπου οὐκ ἐπεγνώσθη
  choice: là où on ne le reconnaît pas
  rationale: ὅπου garde son sens local ou circonstanciel, « là où », et le passif de ἐπιγινώσκω est rendu sans préciser si la personne n’est pas identifiée ou si son jeu n’est pas démasqué.
- source_word: προφθάσει σε
  choice: il te prendra de vitesse
  rationale: προφθάνω signifie arriver ou agir avant quelqu’un et ainsi prendre l’avantage. « Prendre de vitesse » exprime cette antériorité stratégique sans réduire le sens au seul fait de tromper.
