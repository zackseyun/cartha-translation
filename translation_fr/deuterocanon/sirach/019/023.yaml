  register: Français international actuel, sobre et sapiential. Le tutoiement singulier correspond à σε. La formulation conserve la brièveté et l’ambiguïté du grec, notamment sur ce que signifie ne pas être reconnu et sur la nature exacte de l’avantage pris.
