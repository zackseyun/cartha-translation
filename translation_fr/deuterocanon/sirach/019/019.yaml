  text: There is a wickedness that is also an abomination[a], and there is a fool lacking in wisdom.
translation:
  language: fr
  text: Il y a une méchanceté qui est aussi une abomination, et il y a un insensé qui manque de sagesse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πονηρία
  choice: méchanceté
  rationale: Terme moral général désignant ici ce qui est mauvais; « méchanceté » conserve cette portée sans la réduire à la seule malveillance intérieure.
- source_word: βδέλυγμα
  choice: abomination
  rationale: Le mot exprime une forte répulsion morale ou religieuse; « abomination » en garde le poids dans un registre biblique encore courant.
- source_word: ἄφρων
  choice: insensé
  rationale: Dans la littérature de sagesse, le terme désigne une personne dépourvue de bon sens moral et intellectuel; « insensé » est naturel et digne en français.
- source_word: ἐλαττούμενος
  choice: qui manque
  rationale: Le participe marque une déficience ou une moindre mesure. « Qui manque de » l'exprime naturellement, sans imposer l'idée d'une perte antérieure.
- source_word: σοφίᾳ
  choice: de sagesse
  rationale: Le datif indique le domaine dans lequel l'insensé est déficient; la tournure française idiomatique est « manquer de sagesse ».
- source_word: καὶ αὕτη
  choice: qui est aussi
  rationale: Cette formulation maintient la valeur additive de καί et rapporte αὕτη à la méchanceté qui vient d'être mentionnée.
