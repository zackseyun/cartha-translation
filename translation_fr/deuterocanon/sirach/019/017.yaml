  text: All wisdom is fear of the Lord[b][a], and in all wisdom there is the practice of the law.
translation:
  language: fr
  text: Toute sagesse est crainte du Seigneur[a], et dans toute sagesse se trouve la mise en pratique de la Loi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « respect révérenciel envers le Seigneur ». Le mot grec traduit par « crainte » peut aussi exprimer une profonde révérence, mais le texte conserve le terme plus fort de l’expression source.
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « l’accomplissement de la Loi » ou « l’observance de la Loi ».'
    reason: alternative_reading
lexical_decisions:
- source_word: Πᾶσα σοφία
  choice: Toute sagesse
  rationale: Cette formulation conserve la portée globale de Πᾶσα et le sens moral et religieux de σοφία, tout en restant naturelle dans le registre sapientiel français.
- source_word: φόβος Κυρίου
  choice: crainte du Seigneur
  rationale: « Crainte du Seigneur » préserve la force de φόβος ainsi que sa tension entre peur, respect et révérence, sans réduire l’expression à un simple respect.
- source_word: ἐν πάσῃ σοφίᾳ
  choice: dans toute sagesse
  rationale: La traduction garde la construction grecque et le parallélisme avec la première proposition.
- source_word: ποίησις νόμου
  choice: la mise en pratique de la Loi
  rationale: ποίησις désigne ici l’action d’accomplir ou de pratiquer. « Mise en pratique » exprime clairement l’obéissance active, tandis que « la Loi » rend νόμος dans son contexte juif sapientiel.
theological_decisions:
- issue: Sens de φόβος dans l’expression sapientielle
  choice: crainte du Seigneur
  alternative: respect révérenciel envers le Seigneur
  rationale: Le choix principal maintient l’expression biblique forte et son éventail de sens, qui comprend l’effroi, la vénération et l’obéissance, plutôt que de l’adoucir.
- issue: Référent de νόμος
  choice: la Loi
  alternative: la loi
  rationale: La majuscule signale le sens probable de la Torah dans ce contexte juif, sans ajouter de précision absente du grec.
translation_notes:
  register: Français international moderne, sobre et digne. La structure parallèle du grec est conservée, tandis que « mise en pratique » rend ποίησις de façon intelligible pour le lecteur contemporain.
