  yaml_path: translation/deuterocanon/sirach/019/024.yaml
  text: And if he is prevented from sinning by lack of strength[b][a], when he finds an opportunity he will do evil.
translation:
  language: fr
  text: Et s’il est empêché de pécher par manque de force[a], s’il trouve une occasion[b], il fera le mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par faiblesse ». Le grec peut désigner plus généralement une insuffisance de force ou de capacité.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « s’il trouve un moment favorable ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction simple qui poursuit la pensée précédente sans imposer un contraste absent du grec.
- source_word: ἐὰν
  choice: s’il / dès que
  rationale: La première occurrence introduit une condition. Dans la seconde, avec le futur de la principale, le français idiomatique « dès que » exprime la circonstance future sans supprimer l’idée conditionnelle sous-jacente.
- source_word: ὑπὸ ἐλαττώματος ἰσχύος
  choice: par manque de force
  rationale: Rend la déficience de puissance ou de capacité exprimée par ἐλάττωμα ἰσχύος, sans préciser indûment si elle est physique ou d’un autre ordre.
- source_word: κωλυθῇ ἁμαρτεῖν
  choice: est empêché de pécher
  rationale: 'Reproduit clairement le passif et son infinitif complément : l’abstention vient d’un empêchement, non nécessairement d’une disposition vertueuse.'
- source_word: εὕρῃ καιρόν
  choice: il en trouvera l’occasion
  rationale: καιρός désigne ici un moment propice, donc une occasion, plutôt que le temps chronologique en général. Le pronom « en » relie naturellement l’occasion à l’acte mauvais évoqué.
- source_word: κακοποιήσει
  choice: il fera le mal
  rationale: Expression française naturelle et suffisamment large pour κακοποιέω, qui peut signifier faire le mal ou agir méchamment.
theological_decisions:
- issue: Nature de l’empêchement de pécher
  choice: Le texte présente une personne empêchée de pécher faute de force ou de capacité, sans attribuer son abstention à une véritable droiture.
  alternative: Comprendre la faiblesse comme spécifiquement morale ou spécifiquement physique.
  rationale: Le grec parle d’un « manque de force » et la proposition finale révèle que la personne fera le mal lorsqu’une occasion se présentera. La traduction conserve toutefois l’indétermination quant à la nature exacte de cette force.
translation_notes:
  register: Français international moderne, clair et digne. La tournure conserve le lien entre l’incapacité circonstancielle et l’action mauvaise ultérieure, sans préciser au-delà du grec la nature de la faiblesse.
