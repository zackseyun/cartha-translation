  text: He who trusts too quickly is light of heart[a], and he who sins against his own soul will go astray.
translation:
  language: fr
  text: Celui qui accorde trop vite sa confiance est irréfléchi[a], et celui qui pèche contre sa propre âme[b] commettra une faute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « léger quant au cœur ». L’expression grecque évoque ici une personne frivole, irréfléchie ou inconstante.
    reason: clarification_of_metaphor
  - marker: b
    text: 'Ou « contre lui-même » ou « à son propre détriment » ; grec : « contre sa propre âme ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταχὺ
  choice: trop vite
  rationale: L’adverbe signifie « vite »; dans cette maxime, « trop vite » rend naturellement la portée négative de la confiance précipitée.
- source_word: ἐμπιστεύων
  choice: fait confiance
  rationale: Le verbe désigne le fait d’accorder sa confiance; cette tournure est courante et naturelle en français moderne.
- source_word: κοῦφος καρδίᾳ
  choice: a le cœur léger
  rationale: La formulation conserve l’image grecque de la légèreté du cœur, tout en signalant en note qu’elle exprime ici le manque de discernement plutôt que l’insouciance joyeuse.
- source_word: ἁμαρτάνων
  choice: pèche
  rationale: Ce choix conserve la portée morale habituelle du verbe ἁμαρτάνω dans ce contexte sapientiel.
- source_word: εἰς ψυχὴν αὐτοῦ
  choice: contre sa propre âme
  rationale: La traduction garde le terme anthropologique et la direction exprimée par εἰς, sans effacer les sens possibles de « personne », « vie » ou « soi-même ».
- source_word: πλημμελήσει
  choice: agira mal
  rationale: Le futur de πλημμελέω désigne le fait de commettre une faute ou de mal agir. « Agira mal » est clair et idiomatique, sans imposer l’idée plus précise d’un égarement durable.
theological_decisions:
- issue: Portée anthropologique de ψυχή
  choice: âme
  alternative: lui-même, sa propre vie
  rationale: « Âme » préserve la formulation et la tension anthropologique du grec. Une note indique les autres valeurs possibles afin de ne pas réduire ψυχή à une composante immatérielle de la personne.
- issue: Rapport entre le péché dirigé contre soi et πλημμελήσει
  choice: agira mal
  alternative: s’égarera, commettra une faute
  rationale: Le texte associe le péché contre sa propre âme à une conduite fautive future. La traduction évite de préciser indûment si cette faute est une conséquence, une récidive ou un égarement.
translation_notes:
  register: Français moderne, sobre et sentencieux. La structure parallèle « Celui qui… et celui qui… » reprend celle du grec. L’image du cœur léger est maintenue, mais explicitée pour éviter que l’expression française soit comprise au sens positif d’une personne joyeuse ou sans souci.
