  text: Question a friend[a], perhaps he did not do it; and if he did do something, so that he may not add to it.
translation:
  language: fr
  text: 'Interroge un ami[a] : peut-être n’a-t-il rien fait ; et s’il a fait quelque chose, qu’il n’y ajoute rien.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Reprends un ami… de peur qu’il ne recommence. » Le premier verbe peut aussi signifier « reprendre » ou « confronter », et la dernière proposition peut désigner plus précisément la répétition ou l’aggravation de l’acte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγξον
  choice: Interroge
  rationale: Le verbe peut signifier examiner, confondre, reprendre ou questionner. Ici, l’incertitude sur ce que l’ami a réellement fait favorise une confrontation qui commence par une enquête plutôt que par une condamnation.
- source_word: φίλον
  choice: un ami
  rationale: Le nom singulier sans article a une portée générale et proverbiale ; « un ami » est naturel en français.
- source_word: μή ποτε οὐκ ἐποίησεν
  choice: peut-être n’a-t-il rien fait
  rationale: La tournure exprime ici la possibilité prudente que l’accusation soit sans fondement. « Rien fait » rend naturellement en français l’acte non précisé.
- source_word: καὶ εἴ τι ἐποίησεν
  choice: et s’il a fait quelque chose
  rationale: τι reste indéfini et établit un contraste avec la possibilité qu’il n’ait rien fait.
- source_word: μή ποτε προσθῇ
  choice: qu’il n’y ajoute rien
  rationale: προστίθημι signifie littéralement « ajouter » et peut évoquer le fait de poursuivre, répéter ou aggraver l’acte. La formulation retenue conserve cette image et son ouverture sémantique.
