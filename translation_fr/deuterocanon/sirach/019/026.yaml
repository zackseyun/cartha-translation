translation:
  language: fr
  text: La tenue d’un homme, le rire de ses dents[a] et la démarche d’une personne font connaître ce qui le concerne.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le rire des dents »; l’expression peut désigner le sourire ou la manière de montrer les dents.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « font connaître les choses à son sujet ». Le grec emploie une expression plus large que ce qui concerne le caractère de la personne.'
    reason: translation_transparency
lexical_decisions:
- source_word: στολισμός
  choice: tenue
  rationale: Le nom désigne l’apparence arrangée ou parée, notamment l’habillement. « Tenue » exprime naturellement en français l’aspect visible que donnent les vêtements, sans imposer l’idée d’une parure recherchée.
- source_word: ἀνδρός
  choice: d’un homme
  rationale: Le grec emploie ici le masculin singulier ἀνήρ; « d’un homme » en respecte la formulation, tout en conservant la portée proverbiale.
- source_word: γέλως ὀδόντων
  choice: le rire de ses dents
  rationale: L’expression signifie littéralement « rire des dents ». Elle est inhabituelle et peut évoquer le sourire ou la manière de montrer les dents; le texte principal en conserve l’image, avec une note explicative.
- source_word: βήματα
  choice: la démarche
  rationale: Le pluriel désigne les pas et, par extension naturelle, la manière de marcher. « La démarche » rend ici plus idiomatiquement le signe extérieur observable sans réduire le sens à des traces de pas.
- source_word: ἀνθρώπου
  choice: d’une personne
  rationale: Ἄνθρωπος a une portée humaine générale, plus large que ἀνήρ dans le premier membre. « D’une personne » maintient cette différence lexicale.
- source_word: ἀναγγέλλει
  choice: révèlent
  rationale: Le verbe signifie annoncer, rapporter ou faire connaître. Dans ce proverbe, « révèlent » exprime naturellement que les signes extérieurs donnent à connaître quelque chose de la personne. Le singulier grec peut s’entendre avec l’énumération prise comme un ensemble; le français demande naturellement le pluriel.
- source_word: τὰ περὶ αὐτοῦ
  choice: ce qu’elle est
  rationale: Littéralement, l’expression signifie « les choses à son sujet ». « Ce qu’elle est » en donne ici le sens proverbial probable, tout en signalant dans une note la formulation plus large de l’original.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe conserve les trois signes extérieurs du grec, tandis que « démarche » et « révèlent ce qu’elle est » assurent une lecture proverbiale naturelle. L’image insolite du « rire des dents » est maintenue afin de ne pas effacer l’ambiguïté du texte source.
