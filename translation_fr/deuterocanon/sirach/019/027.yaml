  text: One who lowers his face and pretends not to hear—where he is not recognized, he will get ahead of you.
translation:
  language: fr
  text: Celui qui baisse la tête et feint de ne pas entendre[a], là où il n’est pas reconnu, te devancera[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fait la sourde oreille » ; le participe grec décrit quelqu’un qui feint la surdité ou refuse délibérément d’entendre.
    reason: lexical_alternative
  - marker: b
    text: Ou « prendra les devants sur toi » ou « prendra l’avantage sur toi » ; le verbe grec signifie arriver avant quelqu’un, le prévenir ou le dépasser.
    reason: lexical_alternative
lexical_decisions:
- source_word: συγκύφων
  choice: baisse
  rationale: Le participe décrit une posture courbée ou inclinée. Avec « le visage », « baisse » donne en français naturel le geste corporel sans lourdeur excessive.
- source_word: πρόσωπον
  choice: visage
  rationale: C’est le sens courant et direct du nom grec dans ce contexte.
- source_word: ἑτεροκωφῶν
  choice: fait semblant de ne pas entendre
  rationale: Ce participe rare dépeint quelqu’un qui se comporte comme s’il était sourd ou qui fait volontairement la sourde oreille. Cette formulation explicite naturellement la feinte.
- source_word: ὅπου
  choice: là où
  rationale: L’adverbe est rendu dans son sens locatif le plus direct, tout en conservant la structure de la phrase grecque.
- source_word: οὐκ ἐπεγνώσθη
  choice: il n’est pas reconnu
  rationale: Le passif de ἐπιγινώσκω peut signifier être reconnu ou identifié. « N’est pas reconnu » convient à la scène de dissimulation suggérée par les gestes.
- source_word: προφθάσει
  choice: prendra les devants sur toi
  rationale: Le verbe exprime le fait de devancer, de prévenir ou de prendre l’avantage. « Prendra les devants sur toi » conserve l’idée de venir avant l’autre sans préciser abusivement la nature de l’avantage.
theological_decisions: []
