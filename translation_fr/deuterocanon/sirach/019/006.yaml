lexical_decisions:
- source_word: μηδέποτε
  choice: jamais
  rationale: Rend avec naturel et force la négation temporelle absolue.
- source_word: δευτερώσῃς
  choice: répète
  rationale: Le verbe signifie littéralement « faire une seconde fois » ; avec λόγον, « répéter » est l’équivalent français le plus direct.
- source_word: λόγον
  choice: une parole
  rationale: Le terme peut désigner une parole, une déclaration ou une affaire. « Une parole » conserve sa forme lexicale et la portée proverbiale, tandis que l’ambiguïté est signalée en note.
- source_word: οὐθέν
  choice: rien
  rationale: Restitue simplement le pronom neutre dans la proposition négative.
- source_word: οὐ μὴ ἐλαττονωθῇ
  choice: ne te sera enlevé
  rationale: La double négation exprime une assurance forte ; le passif de ἐλαττονόω évoque ce qui est diminué ou retranché. Cette formulation française en communique clairement le sens pratique.
