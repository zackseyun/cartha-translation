translation:
  language: fr
  text: La pourriture et les vers l’auront en héritage, et l’âme audacieuse sera emportée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sera ôtée » ou « disparaîtra ».'
    reason: Le verbe grec peut désigner le fait d’être enlevé, ôté ou de disparaître; « emportée » ne couvre pas à lui seul toute cette gamme de sens.
lexical_decisions:
- source_word: σήπη
  choice: la pourriture
  rationale: Rend directement l’idée de décomposition physique exprimée par le grec.
- source_word: κληρονομήσουσιν αὐτόν
  choice: l’auront en héritage
  rationale: Conserve la métaphore forte de l’héritage tout en produisant une tournure française naturelle.
- source_word: ψυχὴ τολμηρά
  choice: l’âme audacieuse
  rationale: « Audacieuse » préserve l’ambivalence de τολμηρά, qui peut évoquer la hardiesse aussi bien que la témérité, sans imposer ici une condamnation explicite.
- source_word: ἐξαρθήσεται
  choice: sera emportée
  rationale: Exprime la disparition ou le retrait indiqués par le passif grec, sans préciser un agent absent du texte.
theological_decisions:
- issue: Valeur morale de τολμηρά
  choice: audacieuse
  alternative: téméraire
  rationale: Le grec peut prendre une nuance favorable ou défavorable. « Audacieuse » maintient davantage cette tension, tandis que « téméraire » trancherait nettement dans un sens péjoratif.
- issue: Sens de ψυχή
  choice: âme
  alternative: vie / personne
  rationale: « Âme » garde l’image et l’indétermination anthropologique du grec; remplacer ce terme par « personne » ou « vie » résoudrait une ambiguïté que le verset laisse ouverte.
translation_notes:
  register: Français moderne, sobre et dignifié. La formulation conserve les deux images abruptes du grec — l’héritage revenant à la pourriture et aux vers, puis l’âme emportée — sans les expliquer ni les harmoniser.
