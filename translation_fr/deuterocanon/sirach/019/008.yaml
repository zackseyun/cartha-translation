translation:
  language: fr
  text: Car il t’a entendu et t’a observé[a] ; le moment venu, il te haïra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « t’a gardé », « t’a surveillé » ou « s’est tenu sur ses gardes à ton égard ». Le verbe grec peut évoquer le fait de garder, de surveiller ou de se tenir sur ses gardes ; le contexte ne permet pas de trancher entièrement entre ces nuances.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκήκοεν
  choice: il t’a entendu
  rationale: Le parfait de ἀκούω présente une audition accomplie dont les effets demeurent. En français courant, le passé composé rend naturellement cette valeur.
- source_word: γάρ
  choice: car
  rationale: La conjonction introduit l’explication de l’avertissement précédent.
- source_word: ἐφυλάξατό σε
  choice: s’est tenu sur ses gardes envers toi
  rationale: La forme moyenne de φυλάσσω peut exprimer le fait de se garder ou de se tenir sur ses gardes. Le contexte de méfiance puis de haine favorise ici cette nuance, sans exclure les sens de surveiller, observer ou garder.
- source_word: ἐν καιρῷ
  choice: le moment venu
  rationale: Cette tournure française exprime naturellement la venue d’une occasion déterminée, sans préciser s’il s’agit simplement d’un moment ultérieur ou d’un moment opportun.
- source_word: μισήσει
  choice: il te haïra
  rationale: Le futur simple conserve sans l’atténuer le sens direct et futur de μισέω.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Le moment venu » évite le calque peu naturel « en temps » tout en préservant l’indétermination temporelle. Le point-virgule rend distinctes la réaction présente et l’hostilité future.
