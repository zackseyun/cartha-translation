base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/019/021.yaml
  text: There is a meticulous cunning[a], and this too is unjust[b]; and there is one who twists things in order to bring a judgment to light.
translation:
  language: fr
  text: Il existe une ruse savamment calculée[a], et celle-ci aussi est injuste ; il y a aussi celui qui déforme les choses afin de faire apparaître un jugement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une habileté soigneusement calculée » ; le mot grec peut désigner une habileté retorse ou une ruse.'
    reason: lexical_alternative
  - marker: b
    text: « Jugement » peut aussi se comprendre comme « justice », « verdict » ou « décision judiciaire ».
    reason: alternative_reading
lexical_decisions:
- source_word: πανουργία
  choice: ruse
  rationale: Le nom désigne ici une habileté à coloration morale négative. « Ruse » rend cette nuance sans ajouter l’idée plus précise de fraude.
- source_word: ἀκριβὴς
  choice: savamment calculée
  rationale: L’adjectif caractérise une ruse précise, soigneusement élaborée. Cette expression est plus naturelle en français actuel que « ruse méticuleuse » tout en conservant l’idée d’une exactitude délibérée.
- source_word: ἄδικος
  choice: injuste
  rationale: Le terme porte un jugement moral lié à la justice ; « injuste » en maintient la force et fait écho au vocabulaire judiciaire de la fin du verset.
- source_word: διαστρέφων
  choice: déforme les choses
  rationale: Le participe évoque l’action de tordre ou de détourner. Le grec n’exprime pas l’objet ; « les choses » le laisse volontairement général en français idiomatique.
- source_word: χάριν τοῦ
  choice: afin de
  rationale: La construction exprime le but. « Afin de » en restitue clairement la valeur finale dans un registre digne.
- source_word: ἐκφᾶναι
  choice: faire apparaître
  rationale: Le verbe signifie rendre manifeste ou faire voir clairement. « Faire apparaître » reste proche de cette idée sans préciser indûment la manière de la révélation.
- source_word: κρίμα
  choice: jugement
  rationale: Le mot peut désigner un jugement, une décision judiciaire ou ce qui relève de la justice. « Jugement » conserve au mieux cette amplitude.
theological_decisions:
- issue: Évaluation morale de l’habileté soigneusement élaborée
  choice: La première proposition désigne une forme de ruse que le texte qualifie explicitement d’injuste.
  alternative: On pourrait rendre πανουργία de manière plus neutre par « habileté » avant que la seconde proposition n’en donne l’évaluation négative.
  rationale: Le démonstratif αὕτη reprend directement πανουργία et ἄδικος en formule le jugement moral. La traduction doit donc garder la condamnation sans transformer toute forme d’habileté en faute.
- issue: Sens de κρίμα dans la dernière proposition
  choice: Le terme est rendu par « jugement » et demeure ouvert.
  alternative: « justice », « verdict » ou « décision judiciaire »
  rationale: Le grec ne contraint pas à choisir un sens juridique ou éthique plus étroit. « Jugement » préserve la tension du propos, notamment le contraste possible entre une action de déformation et le fait de rendre un jugement manifeste.
translation_notes:
  register: Français international moderne, clair et digne. La coordination répétée du grec est conservée sans rigidité excessive. La formulation maintient l’étrangeté et l’ambiguïté de la dernière proposition au lieu d’en expliciter le motif ou l’issue.
