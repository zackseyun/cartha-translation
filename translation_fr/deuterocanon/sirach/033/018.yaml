  text: Understand that I have not labored for myself alone[a], but for all who seek instruction.
translation:
  language: fr
  text: Comprenez que je n’ai pas peiné pour moi seul, mais pour tous ceux qui recherchent l’instruction.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la discipline » ou « la formation ». Le terme grec peut désigner aussi bien l’enseignement que la formation morale.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: Comprenez
  rationale: L’impératif aoriste pluriel appelle les destinataires à saisir et à reconnaître ce qui vient d’être affirmé. « Comprenez » en rend clairement la force en français moderne.
- source_word: οὐκ ἐμοὶ μόνῳ
  choice: pas pour moi seul
  rationale: 'Le datif exprime ici l’intérêt ou le bénéfice : le travail accompli ne l’a pas été uniquement au profit du locuteur. Cette tournure française conserve ce sens sans lourdeur.'
- source_word: ἐκοπίασα
  choice: j’ai peiné
  rationale: Le verbe κοπιάω désigne un travail pénible, exigeant de grands efforts. « J’ai peiné » garde cette intensité et convient au regard rétrospectif du locuteur.
- source_word: πᾶσιν τοῖς ζητοῦσιν
  choice: pour tous ceux qui recherchent
  rationale: La formule conserve la portée générale et inclusive du grec ainsi que l’idée d’une recherche active.
- source_word: παιδείαν
  choice: l’instruction
  rationale: Dans le Siracide, παιδεία peut englober l’enseignement, la formation morale et la discipline. « Instruction » offre ici le meilleur équilibre entre ampleur sémantique et naturel en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’adresse directe au pluriel, l’idée d’un effort pénible et la portée collective de l’œuvre du locuteur.
