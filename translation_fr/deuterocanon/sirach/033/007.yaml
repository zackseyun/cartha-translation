lexical_decisions:
- source_word: δόξασον
  choice: Honore
  rationale: Impératif de δοξάζω. « Honore » exprime naturellement ici l’idée d’accorder honneur ou gloire, sans imposer la nuance cultuelle plus forte que pourrait suggérer « glorifie ».
- source_word: χεῖρα
  choice: la main
  rationale: χείρ signifie directement « main ». L’article est ajouté conformément à l’usage naturel du français dans cette expression coordonnée.
- source_word: βραχίονα
  choice: le bras
  rationale: βραχίων désigne ici le « bras », image biblique courante de force ou de puissance. « Avant-bras » serait trop anatomique.
- source_word: δεξιόν
  choice: droit
  rationale: L’adjectif qualifie βραχίονα et se traduit simplement par « droit », sans expliciter les associations symboliques possibles.
theological_decisions:
- issue: 'Incertitude textuelle : la source grecque fournie est signalée comme présentant une divergence majeure et ne conserve ici qu’un membre de phrase.'
  choice: Traduire directement le membre de phrase grec transmis, sans ajouter de contexte manquant.
  alternative: Reconstruire un texte plus complet à partir d’autres éditions ou versions.
  rationale: La priorité donnée au témoin grec fourni exige de ne pas introduire de mots qui n’y figurent pas. La note rend explicitement compte du caractère incomplet ou discordant des données.
translation_notes:
  register: Français moderne, sobre et digne. L’impératif « Honore » conserve la force de l’original, tandis que la formulation brève respecte le caractère fragmentaire du texte grec fourni.
