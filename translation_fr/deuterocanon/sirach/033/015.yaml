  text: 'And so look at all the works of the Most High: two by two[a], one opposite the other.'
translation:
  language: fr
  text: 'Et ainsi, considère toutes les œuvres du Très-Haut : deux par deux, l’une en face de l’autre[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’une opposée à l’autre ». Le grec peut exprimer aussi bien l’opposition que la correspondance entre deux éléments placés en vis-à-vis.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔμβλεψον
  choice: considère
  rationale: L’impératif demande de porter une attention soutenue. « Considère » est naturel en français et rend ici la valeur d’observation réfléchie du verbe.
- source_word: πάντα τὰ ἔργα
  choice: toutes les œuvres
  rationale: Le groupe désigne largement les œuvres ou réalisations du Très-Haut. « Œuvres » conserve cette ampleur et convient au registre sapientiel.
- source_word: τοῦ ὑψίστου
  choice: du Très-Haut
  rationale: ὁ ὕψιστος est un titre divin établi ; « le Très-Haut » en est l’équivalent français usuel, clair et digne.
- source_word: δύο δύο
  choice: deux par deux
  rationale: La répétition a une valeur distributive et exprime l’organisation en paires. « Deux par deux » en préserve directement la forme.
- source_word: ἓν κατέναντι τοῦ ἑνός
  choice: l’une en face de l’autre
  rationale: κατέναντι peut indiquer une disposition en vis-à-vis, une opposition ou une correspondance. « En face de » conserve cette latitude mieux qu’un terme exclusivement conflictuel.
theological_decisions:
- issue: Titre divin ὁ ὕψιστος
  choice: le Très-Haut
  alternative: le plus élevé
  rationale: « Le Très-Haut » est le titre divin français conventionnel dans la littérature biblique et n’ajoute aucune précision doctrinale étrangère au grec.
- issue: Rapport entre les œuvres mises par paires
  choice: l’une en face de l’autre
  alternative: l’une opposée à l’autre
  rationale: Le contexte met en relief des contrastes par paires, mais κατέναντι peut aussi exprimer le vis-à-vis ou la correspondance. Le texte principal maintient cette tension, tandis que la note signale explicitement l’autre lecture.
translation_notes:
  register: Français international moderne, sobre et digne. La structure « deux par deux » est maintenue, et le féminin « l’une » reprend naturellement « œuvres ».
