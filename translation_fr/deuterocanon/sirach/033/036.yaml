  text: Do not seek counsel from every man[b][a], but keep one counselor out of a thousand.
translation:
  language: fr
  text: Ne demande pas conseil à tout le monde[a], mais garde un conseiller parmi mille[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne consulte pas tout le monde. » Le verbe grec peut signifier « consulter » ou « demander conseil ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression « parmi mille » est une hyperbole proverbiale qui recommande d’être extrêmement sélectif dans le choix d’un conseiller.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ ἐν παντὶ ἀνθρώπῳ συμβούλευε
  choice: Ne demande pas conseil à n’importe qui
  rationale: Le verbe συμβουλεύω peut exprimer le fait de consulter ou de demander conseil. Avec ἐν παντὶ ἀνθρώπῳ, la tournure met en garde contre une consultation indiscriminée. « N’importe qui » rend naturellement en français moderne la portée générique de l’expression sans imposer un référent exclusivement masculin.
- source_word: ἀλλὰ
  choice: mais
  rationale: Conjonction adversative simple qui oppose l’interdiction à la recommandation.
- source_word: ἕνα ἐκ χιλίων
  choice: un … entre mille
  rationale: Cette formulation française conserve l’image proverbiale et l’idée d’une sélection extrêmement rigoureuse.
- source_word: σύμβουλον ἔχε
  choice: choisis un conseiller
  rationale: Littéralement, ἔχε signifie « aie » ou « garde ». Dans ce contexte contrastif, « choisis » exprime naturellement l’idée de retenir une personne comme conseiller, sans réduire la phrase à une simple possession.
