- from: Celui qui craint Yahweh ne rencontrera pas le mal[a] ; mais, même s’il doit fuir, il échappera de nouveau.
  to: Celui qui craint Yahweh ne rencontrera pas le mal ; mais, dans sa fuite, il reviendra et s’échappera[a].
