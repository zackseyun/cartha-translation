base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/033/001.yaml
  text: One who fears Yahweh will not meet with evil[a], for even in trial he will turn back and escape.
translation:
  language: fr
  text: Celui qui craint Yahweh ne rencontrera pas le mal ; mais, dans sa fuite, il reviendra et s’échappera[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu de la seconde moitié du verset est difficile. Le texte vocalisé se traduit littéralement : « mais, dans sa fuite, il reviendra et s’échappera ». Une autre lecture possible est : « mais, dans l’épreuve, il échappera de nouveau ». Le parallèle grec fourni ne correspond pas à ce verset.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְרֵא יְהֹוָה
  choice: Celui qui craint Yahweh
  rationale: Le participe désigne une personne caractérisée par sa révérence envers Yahweh. Cette formulation conserve la portée représentative du singulier dans un français naturel.
- source_word: לֹא יִפְגַּע רָע
  choice: ne rencontrera pas le mal
  rationale: פגע évoque ici le fait de rencontrer ou de subir quelque chose, tandis que רָע peut désigner le mal ou le malheur. « Rencontrer le mal » préserve cette largeur de sens.
- source_word: כִּי אִם
  choice: mais, même si
  rationale: 'Dans ce contexte, la locution apporte une réserve à l’affirmation précédente : l’homme qui craint Yahweh peut devoir fuir, mais il s’en sortira.'
- source_word: בְּנוּסוֹ
  choice: s’il doit fuir
  rationale: La vocalisation fournie rattache naturellement le mot à נוס, « fuir ». La tournure française exprime la circonstance sans produire l’expression peu naturelle « dans sa fuite ».
- source_word: שָׁב וְנִמְלָט
  choice: il échappera de nouveau
  rationale: שוב peut fonctionner avec le verbe suivant au sens de « faire de nouveau », et נמלט signifie « s’échapper, être délivré ». Cette lecture donne une phrase française cohérente sans imposer un retour spatial suivi d’une fuite.
theological_decisions:
- issue: Rendu du nom divin יְהֹוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme ; « Yahweh » conserve le nom divin plutôt que de le remplacer par un titre.
- issue: Portée de la promesse de protection contre רָע
  choice: ne rencontrera pas le mal
  alternative: ne subira jamais aucun malheur
  rationale: La formulation proverbiale reste forte, mais la seconde proposition envisage néanmoins la fuite. Le texte ne doit donc pas être développé en une doctrine d’immunité absolue à toute souffrance.
- issue: Rapport entre שָׁב et וְנִמְלָט
  choice: 'שָׁב marque la répétition : « échappera de nouveau »'
  alternative: « reviendra et échappera »
  rationale: Les deux analyses sont possibles. La première évite d’introduire un retour spatial qui rendrait la proposition difficile à comprendre, tout en conservant la valeur de répétition de שוב.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le point-virgule met en relief la réserve apportée à la première affirmation. La traduction suit prioritairement le témoin hébreu vocalisé et signale en note l’incertitude textuelle.
