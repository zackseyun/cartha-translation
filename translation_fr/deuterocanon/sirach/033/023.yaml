  text: In all your works be preeminent[b][a]; do not give a blemish to your honor.
translation:
  language: fr
  text: Dans tout ce que tu fais, excelle[a] ; ne ternis pas ton honneur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « montre-toi remarquable » ou « sois supérieur ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ne jette pas de tache sur ta gloire » ou « ne ternis pas ta réputation ». Le grec évoque une tache ou un reproche affectant l''honneur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσι τοῖς ἔργοις σου
  choice: Dans tout ce que tu fais
  rationale: Cette formulation naturelle et globale rend πᾶσι et le sens courant de ἔργα comme actes ou réalisations, sans la raideur de « dans toutes tes œuvres ».
- source_word: γίνου ὑπεράγων
  choice: cherche à exceller
  rationale: L’impératif γίνου appelle ici une manière d’agir, tandis que ὑπεράγων exprime le fait de dépasser le niveau ordinaire. « Cherche à exceller » restitue l’exhortation en français actuel sans affirmer une supériorité de statut.
- source_word: μὴ δῷς μῶμον
  choice: ne porte pas atteinte
  rationale: La défense exprimée par μή avec le subjonctif aoriste est rendue directement. Avec « honneur », cette locution française transmet naturellement l’image d’une faute ou d’une tache infligée à celui-ci.
- source_word: ἐν τῇ δόξῃ σου
  choice: à ton honneur
  rationale: Dans ce contexte de sagesse pratique, δόξα désigne vraisemblablement l’honneur ou l’estime attachée à une personne, plutôt qu’une gloire au sens théologique.
theological_decisions:
- issue: Sens de δόξα dans un contexte éthique et social
  choice: honneur
  alternative: gloire ; réputation
  rationale: « Honneur » conserve la dimension sociale et morale du terme sans lui donner une portée spécifiquement théologique. « Réputation » expliciterait davantage l’estime publique, tandis que « gloire » resterait plus formel mais pourrait paraître trop élevée ici.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier suit les impératifs grecs. La traduction privilégie une formulation idiomatique tout en signalant en notes les images et ambiguïtés lexicales du grec.
