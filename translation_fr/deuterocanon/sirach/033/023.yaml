  source_fidelity: 'Le sens général est bien compris : l''exhortation porte sur l''excellence dans toutes les œuvres et sur la préservation de l''honneur. Toutefois, « cherche à exceller » atténue l''impératif γίνου (« sois / montre-toi ») en le transformant en simple effort. La note a donne en outre un prétendu littéral (« sois surpassant ») qui n''est pas du français recevable. Pour μὴ δῷς μῶμον ἐν τῇ δόξῃ σου, « ne ternis pas ton honneur » rend naturellement la métaphore de la tache/du reproche sans introduire une portée différente.'
  naturalness: « Dans tout ce que tu fais » et le tutoiement sont naturels en français international moderne. « Excelle » est plus direct, idiomatique et fidèle que « cherche à exceller ». « Ne ternis pas ton honneur » est une collocation française claire et digne, plus précise que « ne porte pas atteinte à ton honneur ».
