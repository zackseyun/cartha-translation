lexical_decisions:
- source_word: ἐν ἡμέρᾳ
  choice: Le jour où
  rationale: Tour temporel naturel en français, qui conserve la référence à un moment déterminé.
- source_word: συντελείας ἡμερῶν ζωῆς σου
  choice: où les jours de ta vie arriveront à leur terme
  rationale: Conserve l’image grecque des « jours de ta vie » et rend συντέλεια par une expression française claire indiquant leur achèvement.
- source_word: καὶ ἐν καιρῷ τελευτῆς
  choice: au moment de ta mort
  rationale: καιρός désigne ici le moment approprié ou déterminé, tandis que τελευτή, dans ce contexte, renvoie concrètement à la mort.
- source_word: διάδος
  choice: répartis
  rationale: L’impératif de διαδίδωμι exprime l’action de distribuer entre des bénéficiaires; « répartis » convient naturellement à un héritage.
- source_word: κληρονομίαν
  choice: ton héritage
  rationale: Équivalent direct et usuel du bien transmis ou de la part successorale désignée par κληρονομία.
