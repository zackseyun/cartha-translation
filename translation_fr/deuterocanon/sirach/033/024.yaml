  text: On the day your life's days come to an end[a], and at the time of death, distribute your inheritance.
translation:
  language: fr
  text: Le jour où les jours de ta vie arriveront à leur terme[a], au moment de ta mort, répartis ton héritage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « au jour de l’achèvement des jours de ta vie ».'
