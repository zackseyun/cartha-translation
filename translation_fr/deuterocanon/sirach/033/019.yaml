  text: Listen to me[a], you great men of the people, and you leaders of the assembly, give ear.
translation:
  language: fr
  text: Écoutez-moi, grands[a] du peuple, et vous, dirigeants de l’assemblée, prêtez l’oreille.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « notables ».'
    reason: Le grec désigne des hommes éminents ou de haut rang ; « notables » est une autre traduction possible.
lexical_decisions:
- source_word: ἀκούσατέ
  choice: Écoutez
  rationale: L’impératif appelle directement plusieurs destinataires à une écoute attentive. « Écoutez » est naturel en français moderne et conserve la force de l’exhortation.
- source_word: μεγιστᾶνες
  choice: grands
  rationale: Le terme désigne des hommes éminents ou de haut rang. « Grands du peuple » exprime leur importance sociale sans supposer explicitement une noblesse héréditaire.
- source_word: λαοῦ
  choice: du peuple
  rationale: Cette formulation rend simplement le sens collectif et public de λαός dans ce contexte.
- source_word: ἡγούμενοι
  choice: dirigeants
  rationale: Le participe désigne ceux qui exercent une fonction de conduite. « Dirigeants » est clair et n’impose pas le sens plus fort de « gouvernants ».
- source_word: ἐκκλησίας
  choice: assemblée
  rationale: Dans ce contexte, le mot désigne le corps réuni. « Assemblée » évite d’introduire le sens institutionnel chrétien ultérieur d’« Église ».
- source_word: ἐνωτίσασθε
  choice: prêtez l’oreille
  rationale: Cette expression conserve l’image auditive et renforce le premier impératif, tout en restant intelligible et digne en français actuel.
theological_decisions:
- issue: Référence masculine dans l’adresse aux élites sociales
  choice: grands du peuple
  alternative: notables du peuple
  rationale: Le grec masculin vise des hommes éminents. La traduction conserve cette référence contextuelle sans ajouter le mot « hommes », qui pourrait suggérer en français des personnages illustres plutôt que des responsables de haut rang.
- issue: Traduction de ἐκκλησία
  choice: assemblée
  alternative: communauté
  rationale: « Assemblée » préserve le sens de groupe réuni et n’importe pas dans le passage une conception institutionnelle de l’Église.
translation_notes:
  register: Français moderne, public et solennel. Le parallélisme entre « Écoutez-moi » et « prêtez l’oreille » reproduit la double exhortation du grec sans archaïsme excessif.
