  source_fidelity: Le grec dit littéralement « au jour de l’achèvement des jours de ta vie » et « au temps de la mort, donne une héritage ». La première proposition du projet en rend fidèlement la valeur temporelle et l’achèvement de la vie. En revanche, « ton héritage » ajoute un possessif absent de κληρονομίαν et peut suggérer l’héritage que le destinataire a lui-même reçu, plutôt que l’acte de constituer ou transmettre une succession.
  naturalness: La formulation est fluide en français moderne. « Arriveront à leur terme » et « au moment de ta mort » sont naturels et conservent un registre sapientiel sobre. « Donne un héritage » est également idiomatique dans une instruction portant sur la transmission de biens.
  terminology: « Héritage » est le meilleur équivalent concret de κληρονομία. Le maintien de l’indéfini (« un héritage ») respecte l’absence d’article et de possessif dans le grec sans imposer une interprétation juridique plus précise.
