  text: On the day the days of your life are completed[a], and at the time of death, give an inheritance.
translation:
  language: fr
  text: Le jour où les jours de ta vie arriveront à leur terme[a], au moment de ta mort, donne un héritage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « au jour de l’achèvement des jours de ta vie ».'
    reason: La note conserve la structure nominale et répétitive du grec, assouplie dans le texte principal pour produire un français naturel.
lexical_decisions:
- source_word: ἐν ἡμέρᾳ συντελείας
  choice: Le jour où … arriveront à leur terme
  rationale: La tournure française exprime naturellement le moment de l’achèvement tout en conservant l’image grecque du terme des jours.
- source_word: ἡμερῶν ζωῆς σου
  choice: les jours de ta vie
  rationale: Traduction directe et idiomatique de la chaîne au génitif.
- source_word: ἐν καιρῷ τελευτῆς
  choice: au moment de ta mort
  rationale: καιρός indique ici le moment, et τελευτή désigne dans ce contexte la fin de la vie, donc la mort. Le possessif est explicité naturellement en français d’après le contexte.
- source_word: διδὸς
  choice: donne
  rationale: L’impératif présent est rendu par un impératif français simple et direct.
- source_word: κληρονομίαν
  choice: ton héritage
  rationale: « Héritage » garde le sens juridique et familial concret. Le possessif explicite qu’il s’agit des biens transmis par la personne interpellée, sans changer le référent contextuel.
theological_decisions:
- issue: Faut-il rendre κληρονομίαν par un terme concret ou par une notion plus large de legs spirituel ?
  choice: ton héritage
  alternative: un legs
  rationale: Le contexte porte sur la transmission des biens à la fin de la vie. « Héritage » préserve cette portée concrète sans introduire de sens spirituel absent du grec.
translation_notes:
  register: Français moderne, clair et digne. Tutoiement conservé pour l’adresse sapientielle au singulier. La répétition « les jours de ta vie » reste visible, tandis que la syntaxe grecque est légèrement restructurée.
