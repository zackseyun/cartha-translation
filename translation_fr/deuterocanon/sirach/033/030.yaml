  yaml_path: translation/deuterocanon/sirach/033/030.yaml
  text: Set him to work as is fitting for him[a], and if he does not obey, make his fetters heavy; but do not be excessive with any flesh, and do nothing without judgment.
translation:
  language: fr
  text: Mets-le à des travaux qui lui conviennent[a] ; s’il n’obéit pas, alourdis ses entraves. Mais ne dépasse pas la mesure envers personne[b], et ne fais rien sans discernement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « selon ce qui lui convient ».'
    reason: Variante idiomatique pour καθὼς πρέπει αὐτῷ, qui indique ce qui est approprié pour lui sans préciser le critère.
  - marker: b
    text: 'Littéralement : « envers toute chair » ; c’est-à-dire envers tout être humain.'
    reason: La note conserve l’image concrète du grec tout en explicitant son emploi idiomatique.
lexical_decisions:
- source_word: εἰς ἔργα κατάστησον
  choice: Mets-le au travail
  rationale: Rend naturellement l’idée de placer ou d’affecter quelqu’un à des travaux, tout en conservant la force impérative.
- source_word: καθὼς πρέπει αὐτῷ
  choice: comme il convient pour lui
  rationale: Préserve l’idée de ce qui est approprié à sa situation ou à ses capacités, sans préciser davantage le critère implicite.
- source_word: κἂν μὴ πειθαρχῇ
  choice: s’il n’obéit pas
  rationale: πειθαρχέω désigne l’obéissance à une autorité ; le grec n’énonce pas explicitement un complément tel que « à la discipline ».
- source_word: βάρυνον τὰς πέδας αὐτοῦ
  choice: alourdis ses entraves
  rationale: Traduction directe de βαρύνω et πέδαι, qui maintient sans l’atténuer la référence à une contrainte physique.
- source_word: μὴ περισσεύσῃς
  choice: ne dépasse la mesure
  rationale: Dans cette interdiction, περισσεύω exprime le fait d’aller au-delà de la juste mesure. Cette formulation est plus naturelle en français que « ne sois pas excessif ».
- source_word: ἐν πάσῃ σαρκί
  choice: envers personne
  rationale: L’expression littérale « toute chair » désigne ici tout être humain. Le sens idiomatique est donné dans le texte, tandis que la formulation grecque est conservée en note.
- source_word: ἄνευ κρίσεως
  choice: sans discernement
  rationale: κρίσις peut désigner le jugement, la décision ou le discernement. Ici, « discernement » exprime naturellement l’exigence d’une appréciation réfléchie avant d’agir.
- source_word: μὴ ποιήσῃς μηδέν
  choice: ne fais rien
  rationale: Cette tournure française restitue simplement la portée absolue de l’interdiction grecque.
theological_decisions:
- issue: Langage moralement difficile concernant le travail forcé et les entraves
  choice: Conserver les ordres directs relatifs au travail, à l’obéissance et aux entraves.
  alternative: Atténuer le passage en parlant de service et de simple restriction.
  rationale: Le grec évoque explicitement le travail imposé et une contrainte physique. La traduction ne doit pas masquer cette réalité sociale, même si elle heurte le lecteur moderne.
- issue: Sens de ἐν πάσῃ σαρκί
  choice: Rendre le sens idiomatique par « envers personne » et signaler le grec littéral en note.
  alternative: Employer « envers toute chair » dans le texte principal.
  rationale: En français actuel, « toute chair » risque d’être opaque ou de sembler viser la matière corporelle. « Personne » communique le référent humain sans supprimer la formulation source, conservée dans la note.
- issue: Portée de κρίσις
  choice: Traduire par « discernement ».
  alternative: Traduire par « jugement » ou « décision ».
  rationale: Le contexte met en garde contre une action irréfléchie ou arbitraire. « Discernement » préserve cette portée éthique sans introduire l’idée plus spécifique d’une procédure judiciaire.
translation_notes:
  register: Français international moderne, direct et digne. La ponctuation répartit les impératifs en deux phrases pour faciliter la lecture sans modifier leur enchaînement. Le vocabulaire ne dissimule pas la dureté sociale du passage.
