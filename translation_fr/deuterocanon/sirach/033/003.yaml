base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/033/003.yaml
  text: A discerning man understands the word of Yahweh[b][a], and his instruction is like the Urim in the breastpiece.
translation:
  language: fr
  text: L’homme qui a du discernement comprend la parole de Yahweh[a], et son enseignement est comme les Ourim dans le pectoral[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu de ce verset diffère fortement du texte grec conservé, qui dit : « Lève ta main contre des nations étrangères, et qu’elles voient ta puissance. » La présente traduction suit le témoin hébreu.'
    reason: textual_variant
  - marker: b
    text: 'Ou : « et l’enseignement de Yahweh est comme les Ourim dans le pectoral », si le possessif renvoie à Yahweh plutôt qu’à l’homme qui a du discernement.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ נָבוֹן
  choice: L’homme capable de discernement
  rationale: Conserve le masculin singulier représentatif du texte hébreu et exprime naturellement la qualité sapientielle de נָבוֹן.
- source_word: יָבִין
  choice: comprend
  rationale: 'Rend directement le verbe בין dans son sens cognitif et sapientiel : saisir avec justesse.'
- source_word: דְּבַר יְהֹוָה
  choice: la parole de Yahweh
  rationale: « Parole » convient au contexte d’enseignement divin, tandis que « Yahweh » reproduit le nom divin explicite יְהֹוָה.
- source_word: וְתוֹרָתוֹ
  choice: son enseignement
  rationale: « Enseignement » garde la portée pédagogique de תּוֹרָה sans la réduire à une législation. Le référent du suffixe masculin reste grammaticalement ambigu.
- source_word: כְּאוּרִים
  choice: comme les Ourim
  rationale: La translittération française usuelle conserve le terme cultuel technique associé à la consultation sacerdotale, plutôt que de le rendre littéralement par « lumières ».
- source_word: בַּחֹשֶׁן
  choice: dans le pectoral
  rationale: Désigne le pectoral sacerdotal qui contenait les Ourim; « pectoral » évite la connotation militaire de « cuirasse ».
theological_decisions:
- issue: Rendu du nom divin יְהֹוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu porte explicitement le tétragramme; « Yahweh » préserve ici le nom propre divin.
- issue: Référent du suffixe dans וְתוֹרָתוֹ
  choice: son enseignement, probablement celui de l’homme capable de discernement
  alternative: son enseignement, c’est-à-dire celui de Yahweh
  rationale: L’antécédent syntaxique immédiat est l’homme mentionné au début du verset, mais Yahweh demeure un référent grammaticalement possible; la note maintient cette ambiguïté.
- issue: Divergence entre les témoins hébreu et grec
  choice: suivre le texte hébreu conservé
  alternative: suivre le grec, qui parle de lever la main contre des nations étrangères afin qu’elles voient la puissance divine
  rationale: Le témoin hébreu fourni est de haute confiance et constitue la source principale demandée; l’écart majeur avec le grec est signalé sans harmonisation.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste proche de la structure poétique hébraïque. « Ourim » et « pectoral » conservent le cadre sacerdotal sans explicitation excessive dans le corps du texte.
