lexical_decisions:
- source_word: πολλὴν
  choice: beaucoup de
  rationale: L’adjectif porte sur κακίαν au singulier et exprime ici une grande quantité; « beaucoup de mal » est idiomatique en français.
- source_word: γὰρ
  choice: car
  rationale: La conjonction introduit la raison de l’exhortation qui précède et conserve le lien explicatif.
- source_word: κακίαν
  choice: mal
  rationale: Le terme désigne largement ce qui est mauvais sur le plan moral; « mal » évite de le restreindre à la méchanceté envers autrui ou à un vice précis.
- source_word: ἐδίδαξεν
  choice: enseigne
  rationale: L’aoriste a une portée gnomique dans cette maxime. Le présent français exprime naturellement une vérité générale tout en conservant la métaphore pédagogique.
- source_word: ἡ ἀργία
  choice: l’oisiveté
  rationale: Le mot désigne l’état de celui qui reste sans activité. « Oisiveté » est précis, naturel dans une maxime de registre digne, et moins familier que « paresse ».
