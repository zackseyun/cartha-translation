  text: Be on guard against a wrongdoer, for he devises evil, lest he ever bring disgrace upon you.
translation:
  language: fr
  text: Garde-toi d’un homme malfaisant, car il trame le mal, de peur qu’il ne te couvre à jamais d’opprobre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de peur qu’il ne t’inflige pour toujours le blâme »́.'
    reason: La construction δῷ σοι est littéralement « te donne », μῶμον peut signifier « blâme » ou « reproche », et εἰς τὸν αἰῶνα signifie « pour toujours ».
lexical_decisions:
- source_word: πρόσεχε ἀπὸ κακούργου
  choice: Garde-toi d’un homme malfaisant
  rationale: Avec ἀπό, l’impératif πρόσεχε exprime ici la vigilance et la précaution. « Homme malfaisant » garde la portée morale générale de κακοῦργος sans la réduire au sens juridique de « criminel ».
- source_word: πονηρὰ τεκταίνεται
  choice: il trame le mal
  rationale: Le neutre pluriel πονηρά désigne des choses ou des desseins mauvais, tandis que τεκταίνεται évoque une élaboration habile et intentionnelle. « Trame le mal » rend cette idée de préparation malveillante en français naturel.
- source_word: μή ποτε
  choice: de peur que… ne
  rationale: Cette tournure introduit le risque que l’avertissement cherche à prévenir; le français emploie naturellement « de peur que » avec le ne explétif.
- source_word: μῶμον
  choice: opprobre
  rationale: Le mot peut désigner le blâme, le reproche, une tare ou le déshonneur. « Opprobre » exprime ici une honte grave infligée par autrui, tandis que la note conserve une possibilité plus littérale.
- source_word: εἰς τὸν αἰῶνα
  choice: à jamais
  rationale: L’expression souligne le caractère durable de l’opprobre. « À jamais » en restitue pleinement la force temporelle sans lui imposer un sens métaphysique particulier.
- source_word: δῷ σοι
  choice: ne te couvre… d’opprobre
  rationale: Littéralement « ne te donne un opprobre »; l’expression idiomatique française « couvrir quelqu’un d’opprobre » traduit naturellement le fait de lui infliger le déshonneur.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct, dans le registre sapientiel. Le masculin singulier suit la formulation générique du grec. « Opprobre » est soutenu mais courant dans un contexte biblique; la note explicite une traduction plus littérale.
