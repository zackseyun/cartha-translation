lexical_decisions:
- source_word: συνάγαγε
  choice: Rassemble
  rationale: Impératif aoriste de συνάγω. « Rassemble » exprime naturellement en français l’ordre direct de réunir en un même ensemble.
- source_word: πάσας
  choice: toutes
  rationale: πάσας détermine φυλάς de manière exhaustive ; « toutes » en conserve clairement la portée.
- source_word: φυλάς
  choice: tribus
  rationale: Dans le contexte biblique et israélite, φυλή désigne normalement une « tribu », plutôt qu’un simple clan.
- source_word: Ἰακώβ
  choice: Jacob
  rationale: Le grec porte explicitement Ἰακώβ. « Jacob » préserve la formulation du témoin et la référence à l’ancêtre dont descendent les tribus.
