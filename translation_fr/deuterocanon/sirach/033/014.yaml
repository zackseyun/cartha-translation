  text: Opposite evil is good[a], and opposite death is life; so opposite a godly man is a sinner.
translation:
  language: fr
  text: Face au mal, le bien ; face à la mort, la vie ; de même, face à l’homme qui honore Dieu, le pécheur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέναντι
  choice: face à
  rationale: La répétition de « face à » conserve la structure en vis-à-vis et l’opposition des trois paires, dans un français naturel et sentencieux.
- source_word: κακοῦ / ἀγαθόν
  choice: le mal / le bien
  rationale: Ces substantifs rendent directement l’antithèse morale exprimée par les adjectifs grecs substantivés.
- source_word: θανάτου / ζωή
  choice: la mort / la vie
  rationale: Traduction directe de cette opposition fondamentale.
- source_word: οὕτως
  choice: de même
  rationale: Cette expression indique clairement que la dernière opposition suit le modèle des deux précédentes.
- source_word: εὐσεβοῦς
  choice: l’homme qui honore Dieu
  rationale: Le grec désigne au masculin singulier une personne pieuse ou attachée à Dieu. Cette formulation moderne exprime concrètement l’orientation religieuse du terme sans employer le plus ambigu « pieux ».
- source_word: ἁμαρτωλός
  choice: le pécheur
  rationale: Rendu substantival courant, au masculin singulier comme dans le grec, et parallèle au membre précédent.
theological_decisions:
- issue: Portée du masculin singulier εὐσεβοῦς opposé à ἁμαρτωλός
  choice: l’homme qui honore Dieu / le pécheur
  alternative: la personne fidèle à Dieu / la personne pécheresse
  rationale: Le texte grec présente deux formes personnelles au masculin singulier. La traduction les conserve sans transformer la maxime en pluriel collectif ni en abstraction, tout en évitant d’ajouter une qualification doctrinale absente.
translation_notes:
  register: Style sapientiel concis et équilibré. Les phrases nominales, séparées par des points-virgules, reproduisent le parallélisme du grec tout en restant naturelles en français international moderne.
