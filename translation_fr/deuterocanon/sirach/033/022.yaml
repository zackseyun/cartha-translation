review_pass:
  verdict: revise
  source_fidelity: 'Le projet rend bien κρεῖσσον, τέκνα (« enfants »), δεηθῆναί σου (« aient besoin de toi ») et conserve correctement la distinction avec υἱῶν (« fils »). Toutefois, « de te voir dépendre » change le sujet de l’action : il fait des enfants ceux qui voient le destinataire dépendre de ses fils, alors que le grec oppose le besoin des enfants au fait que le destinataire regarde vers les mains de ses fils, c’est-à-dire compte sur eux.'
