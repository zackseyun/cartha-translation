  text: For it is better that your children should have need of you than that you should look to the hands of your sons[a].
translation:
  language: fr
  text: Car il vaut mieux que tes enfants aient besoin de toi plutôt que tu doives compter sur tes fils.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « plutôt que de regarder vers les mains de tes fils » ; les « mains » représentent ici le soutien ou les ressources qu’ils peuvent fournir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖσσον
  choice: il vaut mieux
  rationale: Cette tournure française naturelle exprime clairement ce qui est préférable ou plus avantageux.
- source_word: τὰ τέκνα
  choice: tes enfants
  rationale: τέκνα est un terme général désignant les enfants; la traduction conserve cette portée, distincte de υἱῶν plus loin.
- source_word: δεηθῆναί σου
  choice: aient besoin de toi
  rationale: Avec le génitif σου, δέομαι exprime ici le besoin ou la dépendance envers une personne.
- source_word: ἐμβλέπειν εἰς χεῖρας
  choice: te voir dépendre de
  rationale: L’expression grecque signifie littéralement « regarder vers les mains » et évoque l’attente d’un soutien matériel. La formulation dynamique transmet ce sens en français courant; l’image est conservée en note.
- source_word: υἱῶν σου
  choice: tes fils
  rationale: υἱῶν désigne spécifiquement les fils; ce choix préserve la variation voulue par rapport à τέκνα, « enfants ».
