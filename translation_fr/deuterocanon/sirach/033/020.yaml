review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : la liste de proches, l’interdiction de leur céder une autorité sur soi de son vivant, puis celle de transmettre ses biens sont conservées. « Tes biens » rend bien la portée large de τὰ χρήματά σου. La dernière expression grecque demeure elliptique (« être dans le besoin / devoir solliciter au sujet de ces biens ») ; « les réclamer » est une explicitation contextuelle acceptable, à signaler en note.'
  naturalness: « Ne donne pas autorité sur toi » est grammaticalement compréhensible, mais peu idiomatique en français contemporain et laisse les destinataires datifs sans reprise explicite. « Ne leur donne pas de pouvoir sur toi » est plus naturel, tout en conservant la portée non spécifiée de ἐξουσία. « Tu n’aies à les réclamer » est plus fluide que « tu ne sois obligé de les réclamer ».
  terminology: « Fils », « épouse », « frère » et « ami » respectent les référents masculins singuliers grecs et le sens contextuel de γυνή. « Pouvoir sur toi » rend ici ἐξουσία avec davantage de naturel que « autorité sur toi », sans introduire de domaine précis. « Biens » convient pour χρήματα.
