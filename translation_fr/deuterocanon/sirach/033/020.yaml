base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/033/020.yaml
  text: To son and wife[a], to brother and friend, do not give authority over yourself during your lifetime; and do not give your possessions to another[c][b], lest you regret it and have to plead for them.
translation:
  language: fr
  text: À ton fils et à ton épouse, à ton frère et à ton ami, ne leur donne pas de pouvoir sur toi de ton vivant. Ne donne pas non plus tes biens[a] à quelqu’un d’autre, de peur que, pris de regret, tu n’aies à les réclamer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec peut aussi désigner ton argent, tes possessions ou tes avoirs.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tu ne sois dans le besoin à leur sujet ». Le contexte suggère qu’il faudrait demander que ces biens soient rendus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱῷ
  choice: à ton fils
  rationale: Le nom grec est masculin singulier et désigne précisément un fils. Le possessif, implicite dans cette série de relations personnelles, est nécessaire en français naturel.
- source_word: γυναικί
  choice: à ton épouse
  rationale: Dans cette liste de proches appartenant au cadre familial et social, γυνή désigne vraisemblablement l’épouse. « Épouse » évite l’ambiguïté moderne de « femme ».
- source_word: ἀδελφῷ
  choice: à ton frère
  rationale: Le grec emploie le masculin singulier et se traduit directement par « frère ».
- source_word: φίλῳ
  choice: à ton ami
  rationale: « Ami » est le sens courant et naturel de φίλος dans cette série relationnelle.
- source_word: μὴ δῷς ἐξουσίαν ἐπὶ σὲ
  choice: ne donne pas autorité sur toi
  rationale: ἐξουσία exprime l’autorité, le pouvoir ou le droit exercé sur quelqu’un. Cette formulation conserve la structure et la portée du grec sans préciser abusivement le domaine de cette autorité.
- source_word: ἐν ζωῇ σου
  choice: de ton vivant
  rationale: Expression française naturelle qui marque clairement que l’avertissement vaut tant que la personne est en vie.
- source_word: ἑτέρῳ
  choice: à quelqu’un d’autre
  rationale: Rend naturellement le datif indéfini ἑτέρῳ sans suggérer une personne particulière.
- source_word: τὰ χρήματά σου
  choice: tes biens
  rationale: χρήματα peut désigner l’argent, les possessions ou les avoirs. « Biens » garde ici une portée suffisamment large.
- source_word: ἵνα μὴ μεταμεληθεὶς
  choice: de peur que, pris de regret
  rationale: Le participe μεταμεληθείς évoque un regret ou un changement d’avis survenant après la cession des biens.
- source_word: δέῃ περὶ αὐτῶν
  choice: tu ne sois obligé de les réclamer
  rationale: La tournure grecque signifie littéralement être dans le besoin à leur sujet. Dans le contexte, elle évoque la nécessité de demander la restitution des biens cédés.
