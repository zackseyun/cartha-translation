  text: As long as you are still alive and breath is in you[a], do not give yourself over to any flesh.
translation:
  language: fr
  text: Tant que tu es encore en vie et que le souffle est en toi, ne te livre à personne[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ne te remets au pouvoir de personne »; autre traduction possible : « ne t’échange contre aucun être de chair ». Littéralement, le grec dit : « ne te change pas toi-même avec/pour aucune chair »; la construction est inhabituelle.'
    reason: Ambiguïté lexicale de ἀλλάξῃς et sens idiomatique de πάσῃ σαρκί.
lexical_decisions:
- source_word: ἕως ἔτι ζῇς
  choice: Tant que tu es encore en vie
  rationale: La tournure temporelle exprime la durée pendant laquelle le destinataire continue à vivre; cette formulation française en conserve l’insistance.
- source_word: πνοὴ ἐν σοί
  choice: le souffle est en toi
  rationale: πνοή désigne d’abord le souffle et, dans ce contexte, le signe de la vie qui demeure. « Souffle » évite de surinterpréter le mot comme « esprit ».
- source_word: μὴ ἀλλάξῃς σεαυτόν
  choice: ne te livre
  rationale: Le sens courant d’ἀλλάσσω est « changer » ou « échanger », mais la construction avec le pronom réfléchi et le datif est difficile à reproduire littéralement. « Ne te livre » exprime sans lourdeur l’idée de remettre sa propre personne à autrui, tout en laissant la note signaler l’ambiguïté.
- source_word: πάσῃ σαρκί
  choice: à personne
  rationale: Sous la négation, πάσῃ a ici une valeur indéfinie (« à qui que ce soit »), et σάρξ désigne idiomatiquement un être humain. « Personne » est naturel en français; la formulation littérale est conservée en note.
theological_decisions:
- issue: Valeur de σάρξ dans πάσῃ σαρκί
  choice: personne
  alternative: aucun être de chair / aucune chair
  rationale: Dans ce contexte, « chair » désigne une personne humaine plutôt que la matière corporelle. Le texte courant rend cette valeur idiomatique sans introduire de distinction doctrinale, tandis que la note préserve l’image grecque.
- issue: Sens de ἀλλάξῃς σεαυτόν avec le datif
  choice: ne te livre à personne
  alternative: ne te remets au pouvoir de personne / ne t’échange contre aucun être de chair
  rationale: Le grec demeure inhabituel et peut évoquer un changement, un échange ou un transfert de soi. La traduction principale retient l’idée contextuelle de se remettre à autrui, sans effacer les autres possibilités, qui sont indiquées en note.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond au singulier grec. La phrase principale privilégie une formulation intelligible, tandis que la note conserve l’étrangeté et l’ambiguïté réelles de l’expression grecque.
