  text: For there is no God except you, Lord. Renew signs and alter wonders,
translation:
  language: fr
  text: Car il n’y a pas de Dieu en dehors de toi, Seigneur. Renouvelle les signes et transforme les prodiges,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν σοῦ
  choice: en dehors de toi
  rationale: Exprime naturellement l’exclusion portée par πλήν avec le génitif, sans atténuer l’affirmation de l’unicité de Dieu.
- source_word: ἐγκαίνισον
  choice: Renouvelle
  rationale: L’impératif évoque le fait de rendre de nouveau actuel ou neuf; «renouvelle» conserve cette nuance et le parallélisme de la demande.
- source_word: σημεῖα
  choice: les signes
  rationale: Équivalent direct et courant, qui préserve la portée théologique possible de «signes» sans le réduire à de simples miracles.
- source_word: ἀλλοίωσον θαυμάσια
  choice: fais des prodiges nouveaux
  rationale: Formulation française naturelle qui rend l’idée de rendre les prodiges différents ou autres. Une note conserve le sens formel, plus abrupt, du verbe grec.
theological_decisions:
- issue: Affirmation de l’unicité divine
  choice: il n’y a pas de Dieu en dehors de toi
  alternative: il n’y a pas d’autre Dieu que toi
  rationale: Le choix retenu suit de près οὐκ ἔστι θεὸς πλὴν σοῦ et évite d’ajouter explicitement «autre», bien que cette autre formulation soit idiomatique et équivalente.
- issue: Nature des actes demandés
  choice: signes… prodiges
  alternative: miracles… merveilles
  rationale: La distinction lexicale entre σημεῖα et θαυμάσια est maintenue afin de ne pas fondre les deux termes dans une seule catégorie théologique.
translation_notes:
  register: Français moderne, digne et accessible. L’adresse «Seigneur» est conservée sans développement confessionnel. La virgule finale est maintenue parce que l’extrait grec se poursuit syntaxiquement.
