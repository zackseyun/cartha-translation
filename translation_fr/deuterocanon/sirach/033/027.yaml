  text: A yoke and a strap will bend the neck[a], and for a wicked servant there are racks and tortures.
translation:
  language: fr
  text: Le joug et la courroie feront plier la nuque ; à l’esclave malfaisant[a], les chevalets de torture et les supplices.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur domestique ». Le grec peut désigner un membre servile de la maisonnée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζυγός
  choice: joug
  rationale: Le mouvement imposé à la nuque indique clairement le joug, et non une balance.
- source_word: ἱμάς
  choice: courroie
  rationale: Le terme désigne une lanière ou courroie de cuir ; « courroie » convient à l’image de contrainte associée au joug.
- source_word: κάμψουσιν
  choice: feront plier
  rationale: Le futur actif exprime ici l’effet contraignant exercé sur la nuque ; cette tournure est naturelle en français et conserve l’image physique.
- source_word: τράχηλον
  choice: la nuque
  rationale: Dans l’image du joug, « nuque » est plus précis et idiomatique que « cou », tout en gardant le sens anatomique du grec.
- source_word: οἰκέτῃ
  choice: esclave
  rationale: Le mot peut désigner un serviteur de maison, souvent de condition servile. Le contexte explicite de coercition et de torture rend ici la condition d’esclave particulièrement saillante.
- source_word: κακούργῳ
  choice: malfaisant
  rationale: L’adjectif qualifie la personne comme faisant le mal ou se conduisant mal, sans le sens juridique plus étroit de « criminel ».
- source_word: στρέβλαι
  choice: chevalets de torture
  rationale: Le pluriel désigne des instruments de torture qui tordent ou disloquent ; « chevalets de torture » en donne un équivalent concret et intelligible.
- source_word: βάσανοι
  choice: supplices
  rationale: Le mot évoque des tortures ou tourments sévères. « Supplices » préserve la dureté du grec tout en évitant la répétition immédiate de « torture ».
theological_decisions:
- issue: Statut servile exprimé par οἰκέτῃ
  choice: esclave
  alternative: serviteur domestique
  rationale: Le terme grec permet les deux nuances, mais les moyens de contrainte et les supplices mentionnés dans le verset mettent en relief l’asservissement. Une note conserve l’alternative lexicale sans adoucir la réalité sociale du passage.
