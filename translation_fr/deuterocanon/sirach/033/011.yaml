  text: In the wrath of fire[a], let the one who is saved be consumed[b], and let those who wrong your people find destruction.
translation:
  language: fr
  text: Dans la colère du feu, que celui qui est sauvé[a] soit consumé, et que ceux qui font du tort à ton peuple trouvent la destruction.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec peut aussi se traduire par « celui qui échappe » ou, plus librement, « le survivant ». Dans ce contexte de jugement, il peut s’agir de quelqu’un qui a échappé à un premier désastre, mais qui subit ensuite la destruction.
    reason: lexical_alternative
  - marker: b
    text: Le témoin source fourni pour ce verset présente un décalage majeur par rapport à l’alignement habituellement attendu en Siracide 33.11. La traduction suit donc directement le texte grec fourni, sans l’harmoniser avec une autre tradition.
    reason: textual_variant
lexical_decisions:
- source_word: ἐν ὀργῇ πυρός
  choice: Dans la colère du feu
  rationale: Traduction proche de l’expression grecque inhabituelle. Elle conserve l’image forte et laisse ouverte la relation exacte entre la colère et le feu, sans expliciter si le feu incarne ou exécute la colère.
- source_word: καταβρωθήτω
  choice: que ... soit consumé
  rationale: Le passif impératif reçoit une valeur de souhait ou d’ordre. « Consum é » est naturel avec le feu et garde l’idée d’une destruction totale, même si le verbe grec signifie plus littéralement « être dévoré ».
- source_word: ὁ σωζόμενος
  choice: celui qui est sauvé
  rationale: Cette formulation rend directement le participe présent passif et préserve sa tension avec le jugement qui suit. Selon le contexte, le grec peut aussi désigner celui qui échappe au désastre, c’est-à-dire le survivant.
- source_word: οἱ ἀδικοῦντες τὸν λαόν σου
  choice: ceux qui font du tort à ton peuple
  rationale: Expression française courante qui conserve le sens actif de commettre une injustice envers le peuple du destinataire.
- source_word: εὕροισαν ἀπώλειαν
  choice: que ... trouvent la perdition
  rationale: Le subjonctif français restitue ici la valeur optative du grec. « Trouver la perdition » suit de près l’expression source et maintient la tonalité solennelle de l’imprécation.
theological_decisions:
- issue: Ambiguïté de ὁ σωζόμενος face à l’annonce de sa destruction
  choice: Conserver « celui qui est sauvé » dans le texte principal
  alternative: « celui qui échappe » ou « le survivant »
  rationale: La formulation littérale maintient la tension réelle du grec au lieu de décider que le participe désigne nécessairement un simple rescapé. Une note présente l’autre lecture contextuellement possible.
- issue: Décalage majeur entre le texte grec fourni et le contexte attendu de Siracide 33.11
  choice: Traduire le témoin grec fourni comme une parole autonome de jugement ou de prière
  alternative: Harmoniser le verset avec une autre tradition textuelle ou une autre numérotation
  rationale: La primauté du texte source fourni exige de ne pas importer le contenu d’un autre témoin. La note signale honnêtement le problème d’alignement.
translation_notes:
  register: Français international moderne, solennel mais accessible. La syntaxe optative en « que » convient à la tonalité de prière ou d’imprécation. L’expression volontairement singulière « colère du feu » et la tension de « celui qui est sauvé » sont conservées parce qu’elles appartiennent au texte grec.
