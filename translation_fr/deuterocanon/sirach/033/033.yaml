  text: Fodder and a rod and loads are for a donkey[a]; bread and discipline and work are for a servant.
translation:
  language: fr
  text: Du fourrage, une verge et des charges pour l’âne ; du pain, de la discipline et du travail pour l’esclave domestique.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χορτάσματα
  choice: fourrage
  rationale: Le pluriel désigne la nourriture donnée aux animaux ; « fourrage » conserve l’image concrète et convient naturellement à l’âne.
- source_word: ῥάβδος
  choice: bâton
  rationale: Dans ce contexte proverbial, le terme désigne un instrument de conduite ou de correction ; « bâton » rend ce sens sans suggérer principalement un appui pour la marche.
- source_word: φορτία
  choice: charges
  rationale: Le mot désigne ce que porte une bête de somme ; « charges » est concret et idiomatique en français.
- source_word: ὄνῳ
  choice: pour l’âne
  rationale: Le datif énonce ce qui revient ou convient à l’âne dans cette formule nominale parallèle.
- source_word: ἄρτος
  choice: pain
  rationale: Le grec emploie le terme concret « pain », qu’il convient de conserver plutôt que de généraliser en « nourriture ».
- source_word: παιδεία
  choice: discipline
  rationale: Le terme englobe formation, éducation et correction ; ici, « discipline » maintient à la fois sa portée formative et corrective.
- source_word: ἔργον
  choice: travail
  rationale: Rendu direct et courant du terme général désignant l’ouvrage ou le labeur assigné.
- source_word: οἰκέτῃ
  choice: esclave domestique
  rationale: οἰκέτης désigne spécifiquement une personne asservie attachée à une maison. « Esclave domestique » rend à la fois le statut servile et la nuance du cadre familial, sans l’atténuer en simple « serviteur ».
theological_decisions:
- issue: Statut social exprimé par οἰκέτῃ
  choice: esclave domestique
  alternative: serviteur / domestique
  rationale: Le texte reflète une relation antique de servitude au sein de la maison. La traduction ne doit ni approuver cette institution ni masquer le statut d’asservissement ; l’expression retenue préserve aussi la nuance domestique propre au mot grec.
- issue: Portée de παιδεία
  choice: discipline
  alternative: instruction / éducation / correction
  rationale: « Discipline » préserve la tension entre formation et correction sans réduire le mot à un enseignement intellectuel ni à un châtiment corporel.
translation_notes:
  register: Formulation proverbiale nominale, concise et symétrique, dans un français moderne et digne. L’absence de verbes dans le grec est conservée naturellement. Le parallélisme est marqué par le point-virgule.
