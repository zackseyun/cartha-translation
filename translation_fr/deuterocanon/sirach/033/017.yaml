  text: Have mercy on the people[a], O Lord, who are called by your name, and on Israel[b], whom you made equal to a firstborn son.
translation:
  language: fr
  text: Aie pitié du peuple qui porte ton nom[a], Seigneur, et d’Israël ; rends-le semblable à un premier-né[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « porter ton nom » signifie ici être reconnu comme appartenant à Dieu.
    reason: cultural_note
  - marker: b
    text: 'La construction grecque de la fin du verset est difficile. On peut aussi comprendre : « et d’Israël, que tu as rendu semblable à un premier-né ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλέησον
  choice: Prends pitié de
  rationale: L’impératif aoriste exprime une supplication directe. « Prends pitié de » est naturel en français actuel et conserve le ton solennel de la prière.
- source_word: λαόν
  choice: du peuple
  rationale: Le nom sans article désigne ici collectivement le peuple de l’alliance. L’article défini est requis par l’usage français, sans ajouter explicitement « ton ».
- source_word: Κύριε
  choice: Seigneur
  rationale: Le vocatif est rendu par une apostrophe directe; le français n’a pas besoin d’un équivalent de l’anglais « O » pour préserver la force de la prière.
- source_word: κεκλημένον ἐπ᾽ ὀνόματί σου
  choice: qui porte ton nom
  rationale: Cette formulation française naturelle exprime l’idiome biblique selon lequel le peuple est identifié comme appartenant à Dieu, sans suggérer qu’il invoque simplement le nom divin.
- source_word: Ἰσραήλ
  choice: Israël
  rationale: Forme française conventionnelle du nom propre.
- source_word: ὃν
  choice: le
  rationale: Le pronom relatif masculin singulier reprend Israël. La ponctuation et le pronom objet « le » rendent en français lisible la construction grecque comprimée.
- source_word: πρωτογόνῳ
  choice: à un premier-né
  rationale: Le datif marque le terme de la comparaison. « Premier-né » conserve l’image filiale sans ajouter explicitement « fils », absent du grec.
- source_word: ὁμοίωσον
  choice: rends-le semblable
  rationale: La forme transmise est morphologiquement un impératif aoriste. La traduction principale la traite donc comme une nouvelle demande, tout en signalant en note l’autre compréhension possible de la syntaxe difficile.
theological_decisions:
- issue: Le statut de premier-né d’Israël
  choice: Le verset demande à Dieu de rendre Israël semblable à un premier-né.
  alternative: Le verset rappelle que Dieu a déjà rendu Israël semblable à un premier-né.
  rationale: ὁμοίωσον a la forme d’un impératif, ce qui favorise une nouvelle supplication. Toutefois, la construction relative est difficile et permet de comprendre la proposition comme la description d’une action antérieure. La note préserve cette tension sans définir plus précisément la portée doctrinale de l’image.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement restructurée par un point-virgule afin de rendre intelligible la succession des impératifs, tout en conservant l’ambiguïté dans une note.
