  text: If you have a servant[a], let him be as yourself[b], because you acquired him with blood.
translation:
  language: fr
  text: Si tu as un esclave[a], qu’il soit comme toi, car tu l’as acquis au prix du sang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur » ou « domestique »; le grec désigne souvent un membre du personnel de maison, mais l’idée d’acquisition met ici en relief sa condition d’esclave.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dans le sang » ou « avec du sang ». L’expression évoque probablement une acquisition coûteuse, sans préciser de qui est le sang.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέτης
  choice: esclave
  rationale: Le mot peut désigner un serviteur de maison, mais le verbe « acquérir » souligne ici la condition de dépendance et d’appartenance; « esclave » évite d’atténuer cette réalité sociale.
- source_word: ἔστω ὡς σύ
  choice: qu’il soit comme toi
  rationale: Cette formulation conserve la tournure existentielle et impérative du grec sans l’expliciter en « traite-le comme toi-même ».
- source_word: ἐν αἵματι
  choice: au prix du sang
  rationale: Cette expression française naturelle garde l’image vive du sang et l’idée d’une acquisition coûteuse, sans préciser de qui est le sang.
- source_word: ἐκτήσω
  choice: tu l’as acquis
  rationale: « Acquérir » rend la portée générale de κτάομαι sans imposer l’idée plus précise d’un achat.
theological_decisions:
- issue: Rendu du vocabulaire de la servitude
  choice: esclave
  alternative: serviteur / domestique
  rationale: Dans ce contexte, l’acquisition de la personne rend sa condition servile particulièrement saillante; le terme retenu préserve cette réalité sans l’adoucir.
- issue: Sens de l’expression « avec du sang »
  choice: au prix du sang
  alternative: avec du sang
  rationale: Le français choisi exprime vraisemblablement le coût élevé évoqué par le grec tout en maintenant l’ambiguïté quant à l’identité de celui dont le sang est en cause.
translation_notes:
  register: Français moderne, international et digne; tutoiement singulier conservé. La formulation reste proche du grec tout en étant naturelle, et les notes signalent les principales ambiguïtés lexicales.
