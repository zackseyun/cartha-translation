  text: And there is a friend who changes into enmity[b][a], and he will expose a quarrel to your disgrace.
translation:
  language: fr
  text: Il y a aussi un ami qui tourne à l’hostilité[a] et qui dévoilera une querelle à ta honte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dont l’amitié se change en inimitié ». Le grec emploie le nom abstrait « hostilité, inimitié », et non le nom « ennemi ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dévoilera une querelle pour te couvrir d’opprobre ». La construction grecque est concise et peut mettre l’accent soit sur le caractère honteux de la querelle, soit sur le déshonneur que sa divulgation entraîne.
    reason: alternative_reading
lexical_decisions:
- source_word: φίλος
  choice: ami
  rationale: Le nom désigne ici une personne liée par une relation d’amitié; « ami » est le terme français le plus direct et naturel.
- source_word: μεταβαλλόμενος εἰς ἔχθραν
  choice: qui tourne à l’hostilité
  rationale: Cette formulation exprime un changement d’état tout en conservant le nom abstrait ἔχθρα (« hostilité, inimitié »), plutôt que de le remplacer silencieusement par « ennemi ».
- source_word: μάχην
  choice: une querelle
  rationale: Dans ce contexte de relations personnelles, μάχη évoque vraisemblablement une dispute ou un conflit verbal plutôt qu’un combat physique.
- source_word: ὀνειδισμοῦ σου
  choice: à ta honte
  rationale: Le génitif grec est compact et associe la querelle au déshonneur ou à l’opprobre subi par la personne interpellée; « à ta honte » restitue cette portée sans alourdir la phrase.
- source_word: ἀποκαλύψει
  choice: dévoilera
  rationale: Le verbe signifie découvrir ou révéler ce qui était caché; « dévoilera » convient à la divulgation malveillante suggérée par le contexte.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et sapiential. Le tutoiement singulier rend le pronom σου et convient à l’adresse directe du passage. La tournure « tourne à l’hostilité » reste naturelle tout en préservant l’abstraction inhabituelle du grec.
