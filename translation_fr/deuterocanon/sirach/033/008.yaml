lexical_decisions:
- source_word: ἔγειρον
  choice: Réveille
  rationale: L’impératif de ἐγείρω signifie ici éveiller ou faire surgir un mouvement intérieur. « Réveille » conserve l’image et la force du commandement.
- source_word: θυμόν
  choice: fureur
  rationale: θυμός peut désigner un emportement, une ardeur courroucée ou une colère vive. « Fureur » le distingue de ὀργή sans effacer le parallélisme.
- source_word: ἔκχεον
  choice: déverse
  rationale: L’impératif de ἐκχέω exprime l’action de verser au-dehors. « Déverse » restitue naturellement en français l’image d’une colère répandue comme un liquide.
- source_word: ὀργήν
  choice: colère
  rationale: ὀργή désigne la colère, souvent dans sa manifestation ou sa permanence. « Colère » est clair, digne et permet de préserver une nuance par rapport à « fureur ».
theological_decisions:
- issue: Intégrité de la source et découpage du verset
  choice: Traduire la seule proposition impérative conservée par le témoin grec fourni, comme une ligne autonome.
  alternative: La rattacher à une phrase plus longue selon le découpage ou le texte d’autres éditions.
  rationale: La source grecque fournie ne contient que cette proposition et signale une divergence majeure. Aucun texte environnant n’est donc reconstruit ou importé.
translation_notes:
  register: Français international actuel, concis et solennel. Le parallélisme est préservé par deux impératifs directs et par la distinction entre « fureur » et « colère ».
