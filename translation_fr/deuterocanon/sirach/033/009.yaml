translation:
  language: fr
  text: Fais surgir un adversaire[a] et anéantis un ennemi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec est signalé comme incertain dans les métadonnées du projet (« divergence majeure »). La traduction suit de près la leçon conservée dans l’édition de Swete, sans tenter de la reconstruire d’après d’autres traditions.
    reason: textual_variant
lexical_decisions:
- source_word: ἔξαρον
  choice: Fais surgir
  rationale: L’impératif peut exprimer l’idée de faire se lever ou de soulever. « Fais surgir » rend cette force de manière naturelle sans préciser s’il s’agit d’une élévation physique ou d’une mise en action.
- source_word: ἀντίδικον
  choice: un adversaire
  rationale: Le terme désigne un opposant, notamment dans un différend ou une procédure judiciaire, et plus largement un adversaire. Ce choix conserve sa portée générale et le parallélisme avec « ennemi ».
- source_word: ἔκτριψον
  choice: anéantis
  rationale: L’impératif de ἐκτρίβω signifie littéralement effacer ou user par frottement, et prend ici le sens énergique de supprimer ou détruire. « Anéantis » restitue cette intensité dans un français digne et courant.
- source_word: ἐχθρόν
  choice: un ennemi
  rationale: Rendu usuel pour une personne hostile. L’indéfini convient à cette formule brève et parallèle.
theological_decisions:
- issue: Incertitude textuelle signalée par la validation « major mismatch »
  choice: Traduire le texte grec conservé chez Swete comme deux impératifs brefs, sans ajout contextuel.
  alternative: Reconstruire une autre leçon à partir d’une tradition grecque ou hébraïque différente.
  rationale: Le grec fourni est bref et syntaxiquement intelligible, mais les métadonnées signalent une divergence majeure. La traduction suit donc le témoin indiqué tout en signalant l’incertitude, sans imposer de reconstruction.
translation_notes:
  register: Français international moderne, concis et solennel. Le parallélisme des deux impératifs est conservé; « fais surgir » évite une formulation artificielle tout en maintenant l’ambiguïté du premier verbe.
