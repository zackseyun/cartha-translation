  text: Put him to work, so that he may not be idle;
translation:
  language: fr
  text: Mets-le au travail, afin qu’il ne reste pas inactif ;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔμβαλε
  choice: Mets
  rationale: L’impératif de ἐμβάλλω signifie littéralement « jeter dans », mais, avec εἰς ἐργασίαν, il forme ici l’expression idiomatique « mettre au travail ». « Mets » conserve directement la force de l’ordre.
- source_word: αὐτὸν
  choice: le
  rationale: Le pronom grec est masculin singulier à l’accusatif et renvoie, dans le contexte, à un homme placé en position subordonnée. Le pronom « le » respecte ce genre grammatical et cette référence.
- source_word: εἰς ἐργασίαν
  choice: au travail
  rationale: ἐργασία désigne le travail, l’activité ou l’occupation. Après « mets-le », « au travail » est l’expression française naturelle et fidèle au sens.
- source_word: ἵνα μὴ ἀργῇ
  choice: afin qu’il ne reste pas inactif
  rationale: ἀργέω signifie être sans activité, ne pas travailler. « Reste pas inactif » exprime ce sens sans introduire le jugement moral plus marqué de « paresseux ».
theological_decisions:
- issue: Maintien du référent masculin singulier dans un contexte de subordination
  choice: le / il
  alternative: la personne / elle
  rationale: Le grec emploie un pronom masculin singulier. La traduction le conserve sans neutraliser le cadre social du passage ni ajouter une interprétation.
- issue: Degré de littéralité de ἔμβαλε αὐτὸν εἰς ἐργασίαν
  choice: Mets-le au travail
  alternative: Jette-le dans le travail
  rationale: La formulation retenue restitue l’idiome grec en français naturel tout en préservant la force impérative. Une traduction mot à mot serait trompeuse ou artificielle.
translation_notes:
  register: Français international moderne, simple et digne. L’impératif est direct. « Inactif » est préféré à « oisif », plus soutenu, et à « paresseux », qui ajouterait une nuance morale absente du verbe grec.
