  text: When you acquire a friend[a], acquire him through testing, and do not quickly trust him.
translation:
  language: fr
  text: Si tu acquiers un ami[a], acquiers-le en le mettant à l’épreuve, et ne lui fais pas trop vite confiance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « acquiers-le lors d’une épreuve » ou « gagne-le par l’épreuve ». L’expression grecque ἐν πειρασμῷ admet plusieurs nuances proches.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κτήσῃ
  choice: acquiers
  rationale: Le verbe κτάομαι signifie « acquérir » ou « gagner ». « Acquérir un ami » conserve ici le caractère volontaire et délibéré de l’entrée en amitié, malgré sa tournure plus soutenue que « se faire un ami ».
- source_word: φίλον
  choice: un ami
  rationale: Le grec porte le masculin singulier et désigne directement un ami.
- source_word: ἐν πειρασμῷ
  choice: en le mettant à l’épreuve
  rationale: πειρασμός peut évoquer une épreuve, une mise à l’épreuve ou une tentation. Dans ce conseil de sagesse, il s’agit de vérifier la fiabilité de l’ami; cette formulation exprime naturellement ce sens sans effacer l’ambiguïté, signalée en note.
- source_word: κτῆσαι
  choice: acquiers-le
  rationale: La répétition d’« acquérir » reproduit celle de κτάομαι et maintient la force sentencieuse du grec.
- source_word: μὴ ταχὺ
  choice: ne… pas trop vite
  rationale: Cette formulation française naturelle exprime l’avertissement contre une confiance accordée avec précipitation.
- source_word: ἐμπιστεύσῃς αὐτῷ
  choice: ne lui fais pas… confiance
  rationale: ἐμπιστεύω avec le datif signifie faire confiance à quelqu’un. La construction retenue est idiomatique, actuelle et relationnellement précise.
theological_decisions:
- issue: Référence masculine singulière dans l’instruction sapientielle
  choice: Conserver « un ami », « le » et « lui » au masculin singulier
  alternative: Employer une formulation épicène ou plurielle
  rationale: Le texte grec présente un individu représentatif au masculin singulier. Le français peut conserver ces formes sans imposer une lecture doctrinale supplémentaire.
- issue: Valeur de ἐν πειρασμῷ
  choice: Comprendre principalement la mise à l’épreuve comme moyen de discerner l’ami
  alternative: Comprendre « au temps de l’épreuve » comme la circonstance dans laquelle l’ami est acquis ou reconnu
  rationale: Le contexte immédiat favorise l’idée de vérifier avant d’accorder sa confiance, mais la construction grecque permet aussi une nuance circonstancielle; la note préserve cette possibilité.
translation_notes:
  register: Français moderne, international et digne. La répétition volontaire d’« acquérir » garde la forme proverbiale du grec; « faire confiance » assure une conclusion naturelle et claire.
