review_pass:
  verdict: revise
  source_fidelity: La première proposition rend correctement le passif aoriste ἡγιάσθης, dans son emploi biblique appliqué à Dieu, par « tu as été reconnu saint ». En revanche, « que ta grandeur soit ... reconnue » déplace le sujet et atténue indûment le passif μεγαλυνθείης (« que tu sois magnifié »). La révision maintient le sujet divin, le passif et la valeur optative de souhait.
  naturalness: « Comme ... que tu sois de même magnifié ... » est une formulation française moderne, claire et convenant au registre priant du texte. « Magnifié » est marqué mais usuel dans ce registre et rend plus exactement le grec que la périphrase proposée.
  terminology: « Reconnu saint » exprime naturellement l’idiome de sanctification divine sans suggérer que Dieu deviendrait saint. « Magnifié » conserve le vocabulaire doxologique de μεγαλύνω sans lui substituer « glorifié », terme possible mais plus interprétatif.
  issues:
  - severity: medium
    issue: La seconde proposition traduit μεγαλυνθείης par « que ta grandeur soit ... reconnue ».
    rationale: Le grec a pour sujet « tu » et emploie le passif optatif de μεγαλύνω. La formulation proposée change le sujet en « ta grandeur » et répète l’idée de reconnaissance qui appartient plus directement à la première proposition. « Que tu sois ... magnifié » préserve la syntaxe et l’image du grec.
  - severity: medium
    issue: La référence SIR.33.4 ne correspond vraisemblablement pas à la numérotation habituelle du texte grec fourni.
    rationale: Le texte transmis est couramment numéroté Siracide 36.4 (selon les traditions de numérotation). Ce problème de métadonnées n’empêche pas de traduire le grec fourni, mais la référence doit être contrôlée avant publication.
  revised_text: Comme tu as été reconnu saint parmi nous devant eux[a], que tu sois de même magnifié parmi eux devant nous[b].
  revised_footnotes:
  - marker: a
    text: 'Littéralement : « tu as été sanctifié parmi nous devant eux ». Appliqué à Dieu, ce passif biblique signifie que sa sainteté a été manifestée ou reconnue.'
    reason: lexical_alternative
  - marker: b
    text: 'L’optatif grec exprime un souhait ou une prière : « que tu sois magnifié » peut aussi se rendre par « sois magnifié ».'
    reason: lexical_alternative
  revision_rationale: La révision est limitée à la seconde moitié du verset afin de rendre explicitement le passif optatif μεγαλυνθείης, tout en conservant le parallélisme « parmi nous/devant eux » — « parmi eux/devant nous » et l’ambiguïté relationnelle du grec.
