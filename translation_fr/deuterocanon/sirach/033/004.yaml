  yaml_path: translation/deuterocanon/sirach/033/004.yaml
  text: Just as you were sanctified among us before them[a], so also be magnified among them before us[b];
translation:
  language: fr
  text: Comme tu as été reconnu saint parmi nous devant eux[a], que ta grandeur soit de même reconnue parmi eux devant nous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu as été sanctifié parmi nous devant eux ». Appliqué à Dieu, ce passif biblique signifie que sa sainteté a été manifestée ou reconnue.'
    reason: lexical_alternative
  - marker: b
    text: 'L’optatif grec exprime un souhait ou une prière. Autre traduction possible : « sois de même magnifié parmi eux devant nous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ … οὕτως
  choice: Comme … de même
  rationale: Cette tournure française restitue clairement la comparaison équilibrée du grec.
- source_word: ἐνώπιον αὐτῶν / ἐναντίον ἡμῶν
  choice: devant eux / devant nous
  rationale: Le parallélisme rend à la fois l’idée de présence et celle de regard, sans préciser davantage que le grec.
- source_word: ἡγιάσθης
  choice: tu as été reconnu saint
  rationale: Le passif grec appliqué à Dieu signifie ici que sa sainteté a été reconnue ou manifestée, non qu’il serait devenu saint. Cette formulation reste naturelle en français tout en conservant le passif.
- source_word: ἐν ἡμῖν / ἐν αὐτοῖς
  choice: parmi nous / parmi eux
  rationale: Dans ce contexte communautaire, ἐν désigne le milieu au sein duquel Dieu est reconnu; « parmi » est plus naturel que « en » en français.
- source_word: μεγαλυνθείης
  choice: que ta grandeur soit reconnue
  rationale: L’optatif exprime une prière ou un souhait. La formulation française traduit le passif et l’idée que Dieu est proclamé grand, sans suggérer qu’il acquiert une grandeur nouvelle.
theological_decisions:
- issue: Le passif de ἁγιάζω appliqué à Dieu
  choice: « tu as été reconnu saint »
  alternative: « tu as été sanctifié »; « tu as manifesté ta sainteté »
  rationale: « Sanctifié » risquerait de faire croire que Dieu devient saint, tandis que la voix active « tu as manifesté » effacerait le passif grec. « Reconnu saint » exprime l’idiome biblique sans résoudre abusivement la tension.
- issue: La valeur optative de μεγαλυνθείης
  choice: « que ta grandeur soit reconnue »
  alternative: « sois magnifié »; « montre ta grandeur »
  rationale: La construction avec « que » marque sans ambiguïté le souhait ou la prière. Elle conserve aussi la portée doxologique du verbe sans employer le peu courant « magnifié » dans le texte principal.
translation_notes:
  register: 'Français international moderne, digne et adapté à une prière. Le parallélisme du grec est conservé. Alerte éditoriale : le texte grec fourni ne correspond pas à Siracide 33.4 dans la numérotation courante; il correspond à Siracide 36.4. La référence doit être vérifiée avant publication.'
