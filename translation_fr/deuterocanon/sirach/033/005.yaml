    text: Le grec emploie ici un verbe qui peut évoquer le fait d’en venir à connaître ou de reconnaître, puis le verbe plus simple « connaître » dans la seconde proposition.
    reason: lexical_alternative
  revision_rationale: La révision évite d’imposer à ἐπιγινώσκω un déroulement progressif non certain, conserve sa nuance possible dans la note, et rend plus naturellement καί ἡμεῖς par « nous aussi ».
