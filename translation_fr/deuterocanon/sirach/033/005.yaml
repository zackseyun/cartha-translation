translation:
  language: fr
  text: et qu’ils te connaissent[a], tout comme nous aussi t’avons connu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie ici un verbe qui peut évoquer le fait d’en venir à connaître ou de reconnaître, puis le verbe plus simple « connaître » dans la seconde proposition.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνώτωσάν
  choice: qu’ils apprennent à connaître
  rationale: L’impératif aoriste à la troisième personne du pluriel est rendu comme une demande formulée dans la prière. « Apprendre à connaître » conserve naturellement la nuance de reconnaissance ou de connaissance acquise que peut porter ἐπιγινώσκω.
- source_word: σε
  choice: te
  rationale: Pronom objet singulier désignant Dieu dans le contexte; le tutoiement convient à l’adresse biblique directe en français moderne.
- source_word: καθάπερ
  choice: tout comme
  rationale: Cette locution comparative restitue clairement la force de καθάπερ dans un français naturel.
- source_word: ἡμεῖς
  choice: nous, nous
  rationale: La reprise pronominale rend l’emphase du pronom grec explicite et marque nettement la comparaison.
- source_word: ἔγνωμεν
  choice: avons connu
  rationale: Le passé composé rend naturellement l’aoriste de γινώσκω et présente la connaissance acquise comme pertinente au moment de la prière.
theological_decisions:
- issue: Force de l’impératif dans une prière adressée à Dieu
  choice: « qu’ils apprennent à te connaître »
  alternative: « qu’ils te reconnaissent »
  rationale: Le tour avec « qu’ils » exprime en français la demande ou le souhait porté par l’impératif grec sans transformer l’énoncé en simple constat.
- issue: Nuance entre ἐπιγινώσκω et γινώσκω
  choice: Distinguer légèrement les verbes par « apprennent à te connaître » puis « t’avons connu »
  alternative: Employer « connaître » dans les deux propositions
  rationale: Le préverbe de ἐπιγινώσκω peut suggérer une connaissance acquise ou plus déterminée. La traduction retient cette nuance sans aller jusqu’à « connaître pleinement », qui risquerait de la surcharger.
translation_notes:
  register: Français moderne, digne et accessible. La reprise « nous, nous » préserve l’insistance du pronom grec; le tutoiement maintient l’adresse directe à Dieu.
