  text: Settle a stranger with you[a], and he will throw you into turmoil, and estrange you from your own.
translation:
  language: fr
  text: 'Fais demeurer chez toi un étranger[a] : il te jettera dans le trouble et t’éloignera des tiens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Fais habiter auprès de toi quelqu’un qui n’est pas des tiens ». Le grec peut désigner un étranger, une personne extérieure à la maisonnée ou quelqu’un appartenant à autrui. « Des tiens » peut aussi avoir une portée plus large que les seuls proches ou la maisonnée.
    reason: lexical_alternative
lexical_decisions:
- source_word: παροίκισον
  choice: Accueille chez toi
  rationale: L’impératif causatif signifie faire demeurer quelqu’un auprès de soi ou comme résident. « Accueille chez toi » exprime naturellement en français l’idée de l’héberger ou de l’installer dans sa maison ou sa sphère.
- source_word: ἀλλότριον
  choice: un étranger
  rationale: Le terme désigne quelqu’un qui appartient à autrui, un étranger ou une personne extérieure au cercle propre. « Un étranger » reste concret sans préciser indûment une origine ethnique.
- source_word: διαστρέψει σε ἐν ταραχαῖς
  choice: il te plongera dans le trouble
  rationale: διαστρέφω peut exprimer le fait de bouleverser ou de mettre sens dessus dessous; associé à ταραχαί, il évoque ici une perturbation profonde. La tournure française restitue naturellement l’ensemble verbal.
- source_word: ἀπαλλοτριώσει σε
  choice: t’éloignera
  rationale: Le verbe signifie rendre étranger, aliéner ou séparer. « T’éloignera » rend clairement la rupture produite, tandis que le complément conserve l’ambiguïté sur ce dont la personne est séparée.
- source_word: τῶν ἰδίων σου
  choice: de ce qui est à toi
  rationale: L’expression grecque, littéralement « de tes propres [choses/personnes] », peut viser les proches, la maisonnée ou les biens. Cette formulation française préserve sa largeur sémantique.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et proverbial. La formulation conserve le ton direct de l’avertissement et l’ambiguïté de τῶν ἰδίων σου, sans réduire celle-ci aux seuls proches ni aux seuls biens.
