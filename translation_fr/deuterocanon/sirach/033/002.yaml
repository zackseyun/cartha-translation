lexical_decisions:
- source_word: שׂוֹנֵא
  choice: celui qui hait
  rationale: Le participe substantivé décrit un type de personne. « Celui qui hait » conserve la force de l’hostilité active tout en restant naturel et digne en français.
- source_word: תוֹרָה
  choice: l’enseignement
  rationale: Dans le contexte sapientiel du Siracide, תורה désigne l’enseignement ou l’instruction, sans se limiter nécessairement à un code légal. « Enseignement » est clair en français moderne, tandis que « Loi » demeure une possibilité signalée en note.
- source_word: יֶחְכַּם
  choice: ne deviendra pas sage
  rationale: Cette formulation exprime le résultat ou le processus suggéré par la forme verbale, plutôt que le simple état « ne sera pas sage ».
- source_word: מִתְמוֹטֵט
  choice: il est ballotté
  rationale: Dans l’image du navire pris dans la tempête, le verbe évoque l’instabilité sous l’effet d’une force extérieure. « Est ballotté » rend cette nuance de façon idiomatique.
- source_word: בְּמִסְעָר
  choice: dans la tempête
  rationale: Le nom désigne une tempête ou une tourmente. Cette expression concise s’accorde naturellement avec l’image du navire.
- source_word: כָּאֳנִיָּה
  choice: comme un navire
  rationale: La comparaison est directe. « Navire » convient au registre et à l’ampleur de l’image maritime.
theological_decisions:
- issue: Sens de תורה dans un contexte sapientiel
  choice: l’enseignement
  alternative: la Loi ; l’instruction
  rationale: Le propos est proverbial et sapientiel plutôt qu’explicitement juridique. « Enseignement » préserve ce cadre sans exclure la résonance traditionnelle de « Loi », indiquée en note.
- issue: Emploi du parallèle grec malgré une divergence majeure
  choice: suivre le témoin hébreu cohérent et de haute confiance
  alternative: considérer le verset comme trop incertain pour être traduit directement de l’hébreu
  rationale: Le parallèle grec fourni correspond manifestement à une autre ligne et ne peut donc pas régir ici la traduction. L’hébreu transmis est cohérent ; la divergence est néanmoins signalée afin de préserver honnêtement l’incertitude documentaire.
translation_notes:
  register: Français international moderne, clair et digne. La structure proverbiale est conservée, avec un point-virgule reliant l’affirmation sur la sagesse à l’image du navire instable.
