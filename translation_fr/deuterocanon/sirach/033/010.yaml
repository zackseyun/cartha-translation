translation:
  language: fr
  text: Hâte le temps[b] et souviens-toi du serment ; qu’ils racontent tes hauts faits.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La validation de la source signale le texte grec de ce verset comme incertain (« major mismatch »). La traduction suit le texte grec conservé, sans reconstruction conjecturale.
    reason: textual_variant
  - marker: b
    text: 'Ou : « le temps fixé » (grec : καιρόν).'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπεῦσον
  choice: Hâte
  rationale: L’impératif aoriste de σπεύδω exprime ici une demande pressante. « Hâte » conserve cette force et régit naturellement « le moment » dans un registre digne.
- source_word: καιρόν
  choice: le moment
  rationale: καιρός désigne souvent un temps opportun, déterminé ou fixé. « Le moment » est naturel en français et préserve l’ouverture du terme ; « le moment fixé » demeure une possibilité signalée en note.
- source_word: μνήσθητι
  choice: souviens-toi
  rationale: L’impératif aoriste moyen de μιμνῄσκομαι est rendu directement par l’impératif idiomatique français « souviens-toi ».
- source_word: ὁρκισμοῦ
  choice: du serment
  rationale: ὁρκισμός désigne un serment ou un engagement juré. « Le serment » en donne le sens lexical sans préciser davantage sa nature.
- source_word: ἐκδιηγησάσθωσαν
  choice: qu’ils racontent
  rationale: Cette forme impérative à la troisième personne porte l’idée de relater ou d’exposer en détail. « Qu’ils racontent » en conserve la valeur injonctive sans lourdeur.
- source_word: τὰ μεγαλεῖά σου
  choice: tes hauts faits
  rationale: Le pluriel neutre désigne des actes éclatants ou puissants. « Tes hauts faits » est une expression française actuelle et digne qui convient au langage de louange.
theological_decisions:
- issue: Référent de la deuxième personne et langage de louange
  choice: 'Conserver l’adresse directe implicite à Dieu : « tes hauts faits »'
  alternative: Neutraliser davantage le référent sans aller au-delà du pronom grec
  rationale: Le souvenir du serment et le récit des hauts faits correspondent au langage biblique de la prière adressée à Dieu. Aucun titre divin absent du grec n’est toutefois ajouté.
- issue: Incertitude du texte source signalée par la validation
  choice: Traduire le texte grec transmis et signaler l’incertitude en note
  alternative: Modifier le texte d’après une reconstruction conjecturale d’un original hébreu
  rationale: La mention « major mismatch » indique une possible instabilité textuelle, mais ne fournit pas de leçon de remplacement suffisamment établie. Le texte grec donné reste donc la base de la traduction.
translation_notes:
  register: Français international moderne, concis et digne. « Hâte le moment » garde la formulation pressante de la prière ; le point-virgule clarifie l’enchaînement des impératifs sans expliciter l’identité du groupe désigné par « ils ».
