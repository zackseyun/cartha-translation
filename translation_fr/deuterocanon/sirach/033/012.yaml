lexical_decisions:
- source_word: σύντριψον
  choice: Écrase
  rationale: L’impératif aoriste de συντρίβω exprime l’action vigoureuse de briser ou broyer. « Écrase » conserve la force de l’image dans un français naturel.
- source_word: κεφαλὰς
  choice: la tête
  rationale: Le grec emploie le pluriel « têtes », mais le singulier distributif est plus idiomatique en français avec un groupe pluriel et conserve l’image concrète.
- source_word: ἀρχόντων ἐχθρῶν
  choice: des chefs ennemis
  rationale: ἄρχων désigne des personnes exerçant l’autorité. Le rapport exact entre les deux génitifs peut se comprendre comme « chefs ennemis » ou « chefs des ennemis » ; la formulation retenue est naturelle sans effacer l’autre possibilité.
- source_word: λεγόντων
  choice: eux qui disent
  rationale: Le participe présent caractérise les chefs par leur déclaration. « Eux qui disent » rattache clairement la proposition à « chefs ennemis ».
- source_word: Οὐκ ἔστιν πλὴν ἡμῶν
  choice: Il n’y a personne à part nous
  rationale: πλήν suivi du génitif marque l’exclusion. Cette traduction moderne préserve la prétention arrogante du propos sans la transformer en comparaison.
theological_decisions:
- issue: Portée de la prétention des ennemis
  choice: « Il n’y a personne à part nous » comme affirmation arrogante d’exclusivité
  alternative: « Il n’y a personne comme nous »
  rationale: Le grec exprime directement l’exclusion plutôt que la comparaison. La traduction conserve cette tension sans préciser s’il s’agit d’une prétention politique, militaire ou théologique.
translation_notes:
  register: Français international moderne, direct et digne. L’image violente est conservée, ainsi que l’ambiguïté du groupe nominal grec, signalée en note.
