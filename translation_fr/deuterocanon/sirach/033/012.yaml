  text: Crush the heads of the rulers of the enemies[a], who say[b], “There is no one except us.”
translation:
  language: fr
  text: 'Écrase les têtes des chefs ennemis qui disent : « Il n’y a personne à part nous. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec fourni pour ce verset présente une importante incertitude de validation ; la traduction suit ici le libellé grec indiqué.
