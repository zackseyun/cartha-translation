  text: And I too kept watch last of all[a], like one who gleans behind the grape harvesters.
translation:
  language: fr
  text: Moi aussi, le dernier, j’ai veillé[a], comme celui qui glane derrière les vendangeurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je suis resté éveillé » ; le verbe grec peut souligner l’état de veille ou la vigilance et, dans ce contexte, évoque probablement un travail assidu poursuivi tardivement.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγώ
  choice: Moi aussi
  rationale: La crase de καί et ἐγώ exprime à la fois l’ajout et l’insistance; « Moi aussi » les rend naturellement en français.
- source_word: ἔσχατος
  choice: le dernier
  rationale: L’adjectif se rapporte au locuteur tout en situant son action après celle des autres; la tournure détachée conserve cette nuance sans l’expliciter excessivement.
- source_word: ἠγρύπνησα
  choice: j’ai veillé
  rationale: Le verbe désigne le fait de rester éveillé ou vigilant. « J’ai veillé » préserve cette amplitude et convient au travail assidu évoqué par le contexte.
- source_word: ὡς
  choice: comme
  rationale: Introduit ici une comparaison; « comme » est le marqueur naturel de la similitude en français.
- source_word: καλαμώμενος
  choice: celui qui glane
  rationale: Le participe évoque le ramassage de ce qui reste après la récolte. « Glane » restitue clairement et sobrement cette image agricole.
- source_word: ὀπίσω
  choice: derrière
  rationale: Le terme conserve l’image spatiale d’une personne avançant à la suite des ouvriers de la récolte.
- source_word: τρυγητῶν
  choice: les vendangeurs
  rationale: Le nom désigne précisément ceux qui récoltent les raisins; « vendangeurs » est le terme français courant et exact.
