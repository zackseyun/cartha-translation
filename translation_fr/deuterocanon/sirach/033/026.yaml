  text: Put your servant to work[a], and you will find rest; let his hands be idle, and he will seek freedom.
translation:
  language: fr
  text: Mets ton esclave[a] au travail, et tu trouveras du repos ; laisse ses mains inoccupées, et il cherchera la liberté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie un mot qui signifie littéralement « enfant » ou « garçon » et qui peut désigner un dépendant de la maisonnée. Dans ce contexte, où il est question de chercher la liberté, « esclave » est une traduction plausible ; on pourrait aussi traduire par « serviteur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔργασαι ἐν παιδί
  choice: Mets ton esclave au travail
  rationale: L’impératif exprime ici le fait d’imposer ou d’assigner un travail au dépendant dont il est question. Cette tournure française est naturelle et garde la force du commandement. Le possessif « ton » est explicité d’après la situation d’autorité domestique impliquée par le contexte.
- source_word: παιδί
  choice: esclave
  rationale: Le mot désigne littéralement un enfant ou un garçon et peut, selon le contexte, s’appliquer à un serviteur dépendant. Ici, la mention explicite de la recherche de la liberté met au premier plan la condition servile ; « esclave » rend donc plus clairement la réalité sociale sans l’atténuer.
- source_word: εὑρήσεις ἀνάπαυσιν
  choice: tu trouveras du repos
  rationale: Cette traduction directe conserve l’image et le rapport de conséquence exprimé par le futur grec.
- source_word: ἄνες χεῖρας αὐτῷ
  choice: laisse ses mains inoccupées
  rationale: ἄνες évoque ici le relâchement ou la cessation de l’effort. La formulation conserve l’image concrète des « mains » tout en exprimant naturellement en français l’absence de travail.
- source_word: ζητήσει ἐλευθερίαν
  choice: il cherchera la liberté
  rationale: « Cherchera » correspond sans exagération à ζητήσει, tandis que « liberté » rend directement ἐλευθερίαν.
theological_decisions:
- issue: Désignation de la condition sociale exprimée par παιδί dans ce contexte de travail domestique contraint
  choice: esclave
  alternative: serviteur ; garçon
  rationale: Bien que παιδί ne signifie pas intrinsèquement « esclave », l’opposition entre travail imposé et recherche de la liberté rend ici la condition servile déterminante. « Serviteur » risquerait d’atténuer cette réalité, tandis que « garçon » serait trompeur en français moderne.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier correspond à l’adresse sapientielle directe. La formulation conserve le parallélisme entre travail, repos, inactivité et liberté, sans approuver ni adoucir la réalité sociale décrite.
