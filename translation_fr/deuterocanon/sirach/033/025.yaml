  text: Fodder and a rod and loads are for a donkey[a]; bread and discipline and work are for a servant.
translation:
  language: fr
  text: Du fourrage, un bâton et des fardeaux pour un âne ; du pain, de la discipline et du travail pour un esclave domestique[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un serviteur domestique ». Le grec οἰκέτης désigne un membre de la maisonnée en condition servile.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χορτάσματα
  choice: du fourrage
  rationale: Le pluriel grec désigne la nourriture destinée aux animaux. Le collectif français « fourrage » est naturel dans ce contexte.
- source_word: ῥάβδος
  choice: le bâton
  rationale: Le terme désigne concrètement un bâton ou une verge et suggère ici la conduite ou la correction de l’animal sans que cette fonction soit explicitée.
- source_word: φορτία
  choice: des charges
  rationale: Il s’agit concrètement de ce que l’âne doit porter ; « charges » conserve l’image sans lui donner un sens métaphorique.
- source_word: ὄνῳ
  choice: pour un âne
  rationale: Le datif indique le destinataire dans cette phrase nominale. L’indéfini rend naturellement l’absence d’article en grec.
- source_word: ἄρτος
  choice: du pain
  rationale: Le grec nomme précisément le pain, même si celui-ci peut représenter plus largement la nourriture.
- source_word: παιδεία
  choice: de la discipline
  rationale: Dans ce contexte de gestion domestique, le mot englobe formation et correction. « Discipline » préserve cette étendue mieux qu’« instruction » seule.
- source_word: ἔργον
  choice: du travail
  rationale: Traduction directe et naturelle du nom dans ce contexte pratique.
- source_word: οἰκέτῃ
  choice: pour un esclave de maison
  rationale: Le terme désigne une personne de condition servile rattachée à une maisonnée. « Esclave de maison » rend le statut asservi et le cadre domestique, contrairement au plus vague « serviteur ».
theological_decisions:
- issue: Statut social exprimé par οἰκέτῃ
  choice: un esclave de maison
  alternative: un serviteur de la maisonnée
  rationale: Le proverbe reflète une hiérarchie domestique antique. La traduction retenue évite d’atténuer la condition servile, tandis que la note signale l’autre rendu lexical possible sans résoudre abusivement toute la portée contextuelle du terme.
translation_notes:
  register: Formulation proverbiale, concise et symétrique. Les articles partitifs rendent la série nominale naturelle en français moderne, tandis que le point-virgule conserve le parallélisme entre l’âne et l’esclave de maison.
