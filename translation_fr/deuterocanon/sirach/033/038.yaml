review_pass:
  verdict: revise
  source_fidelity: Le grec oppose un ami « en son moment / au moment qui est le sien » à son absence au jour de la détresse. La formulation proposée interprète de façon trop explicite ce premier membre (« ne l’est qu’au moment ») et ajoute « à tes côtés », absent de παραμένω. La négation renforcée οὐ μή est correctement rendue par « ne restera certainement pas ».
  naturalness: Le français du projet est fluide, mais « tel ami qui ne l’est que » est plus explicatif que le grec. « lorsqu’il y trouve son intérêt » serait également trop interprétatif ; « lorsque le moment lui convient » reste idiomatique tout en conservant l’implication contextuelle.
  terminology: « Ami » rend fidèlement φίλος et « détresse » rend bien θλῖψις. « Au jour de ta détresse » préserve utilement l’image temporelle du grec.
  issues:
  - severity: medium
    issue: Explicitation de la condition dans « ne l’est qu’au moment qui lui convient »
    rationale: Le grec dit littéralement qu’il y a un ami « en son temps » et laisse la portée précise de αὐτοῦ et de l’expression temporelle relativement ouverte. « Ne l’est que » transforme cette suggestion contextuelle en affirmation explicite.
  - severity: low
    issue: Ajout de « à tes côtés »
    rationale: παραμένω signifie « rester, demeurer » ; l’ajout relationnel est naturel en français mais ne figure pas dans le texte source et n’est pas nécessaire.
  revised_text: Car il y a un ami lorsque le moment lui convient[a], mais il ne restera certainement pas au jour de ta détresse.
  revised_footnotes:
  - marker: a
    text: 'Ou : « il y a un ami pour un temps » ou « au moment qui est le sien ». L’expression grecque peut évoquer une amitié qui ne dure que tant que les circonstances sont favorables.'
    reason: lexical_alternative
