translation_notes:
  register: Français moderne, digne et accessible. La tournure « tel ami qui ne l’est que… » explicite légèrement le caractère conditionnel déjà suggéré par le contexte, tout en maintenant en note l’ambiguïté de l’expression temporelle grecque.
