  text: For there is a friend in his own time[a], and he will certainly not remain in the day of your distress.
translation:
  language: fr
  text: Car il y a un ami lorsque le moment lui convient[a], mais il ne restera certainement pas au jour de ta détresse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il y a un ami pour un temps » ou « au moment qui est le sien ». L’expression grecque peut évoquer une amitié qui ne dure que tant que les circonstances sont favorables.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλος
  choice: ami
  rationale: « Ami » est l’équivalent français direct et naturel; le contexte révèle ici une amitié conditionnelle.
- source_word: ἐν καιρῷ αὐτοῦ
  choice: au moment qui lui convient
  rationale: καιρός désigne un moment favorable ou opportun, et αὐτοῦ le rapporte à l’ami. Cette formulation naturelle fait ressortir l’idée sans exclure les lectures plus littérales signalées en note.
- source_word: οὐ μὴ παραμείνῃ
  choice: ne restera certainement pas à tes côtés
  rationale: οὐ μή avec le subjonctif exprime une négation forte. « Certainement pas » en conserve l’insistance, tandis que « à tes côtés » rend naturellement παραμένω dans le contexte d’une amitié mise à l’épreuve.
- source_word: ἐν ἡμέρᾳ θλίψεώς σου
  choice: au jour de ta détresse
  rationale: La formulation garde l’expression temporelle grecque et rend θλῖψις par « détresse », terme moderne qui en préserve la gravité.
