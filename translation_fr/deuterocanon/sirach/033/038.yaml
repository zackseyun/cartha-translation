revisions:
- from: Car il y a tel ami qui ne l’est qu’au moment qui lui convient[a] et qui, au jour de ta détresse, ne restera certainement pas à tes côtés.
  to: Car il y a un ami lorsque le moment lui convient[a], mais il ne restera certainement pas au jour de ta détresse.
  rationale: La révision conserve l’idée contextuelle d’un moment favorable à l’ami sans introduire « ne l’est que », qui interprète plus fortement le grec. Elle supprime aussi « à tes côtés » afin de rendre παραμείνῃ par « restera » sans ajout. Le contraste, implicite dans la juxtaposition grecque, est rendu naturellement par « mais ».
