  text: Crush the heads of enemy rulers[a], who say, “There is no one but us.”
translation:
  language: fr
  text: 'Brise les têtes des chefs ennemis, qui disent : « Il n’y a personne à part nous. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύντριψον
  choice: Brise
  rationale: L’impératif aoriste de συντρίβω exprime une destruction violente. « Brise » est naturel et digne en français, tout en conservant la force de l’image.
- source_word: κεφαλὰς
  choice: la tête
  rationale: Le grec emploie le pluriel « têtes », mais le singulier distributif est plus idiomatique en français avec un groupe pluriel et conserve l’image concrète appliquée à chacun des chefs.
- source_word: ἀρχόντων ἐχθρῶν
  choice: des chefs de tes ennemis
  rationale: 'ἀρχόντων désigne des personnes exerçant l’autorité, et ἐχθρῶν se comprend naturellement comme son complément : « chefs des ennemis ». L’ajout de « tes », implicite dans cette prière adressée à Dieu, rend la relation plus claire en français sans préciser une nation.'
- source_word: λεγόντων
  choice: qui disent
  rationale: La proposition relative rend naturellement le participe grec et caractérise les chefs ennemis par leur affirmation arrogante.
- source_word: Οὐκ ἔστιν πλὴν ἡμῶν
  choice: Il n’y a personne à part nous
  rationale: Cette formulation idiomatique préserve l’affirmation d’exclusivité sans introduire « Dieu », absent du grec.
theological_decisions:
- issue: Nature de la prétention des ennemis
  choice: « Il n’y a personne à part nous »
  alternative: « Il n’y a pas de Dieu en dehors de nous »
  rationale: Le grec exprime une exaltation exclusive de soi qui peut avoir une portée quasi divine, mais il ne nomme pas Dieu. La traduction conserve cette tension sans explicitation doctrinale.
translation_notes:
  register: Français moderne, clair et solennel. L’image violente de la tête brisée est conservée sans atténuation. Le singulier distributif « la tête » évite une tournure pesante tout en correspondant au pluriel grec.
