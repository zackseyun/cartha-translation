  yaml_path: translation/deuterocanon/sirach/036/007.yaml
  text: Why does one day surpass another[a], when every daylight of the year comes from the sun?
translation:
  language: fr
  text: Pourquoi un jour l’emporte-t-il sur un autre[a], alors que toute la lumière de chaque jour de l’année vient du soleil ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pourquoi un jour est-il supérieur à un autre, alors que toute la lumière de chaque jour de l’année vient du soleil ? »'
    reason: Variante lexicale pour ἡμέρα ἡμέρας ὑπερέχει.
lexical_decisions:
- source_word: διὰ τί
  choice: Pourquoi
  rationale: Introduit directement une question portant sur la raison de cette différence.
- source_word: ἡμέρα ἡμέρας ὑπερέχει
  choice: un jour l’emporte-t-il sur un autre
  rationale: Le génitif marque ici la comparaison. « L’emporter sur » restitue la force comparative de ὑπερέχει sans préciser indûment la nature de la supériorité.
- source_word: πᾶν φῶς ἡμέρας ἐνιαυτοῦ
  choice: toute la lumière des jours de l’année
  rationale: Cette formulation française naturelle conserve l’idée de la lumière propre aux jours compris dans l’année, tout en évitant le peu idiomatique « toute lumière de jour d’année ».
- source_word: ἀφ᾽ ἡλίου
  choice: vient du soleil
  rationale: ἀπό indique la provenance ; « vient du soleil » l’exprime simplement et naturellement.
theological_decisions:
- issue: Portée comparative de ὑπερέχει
  choice: l’emporte sur un autre
  alternative: est supérieur à un autre
  rationale: Le texte interroge la distinction entre les jours malgré leur source lumineuse commune. « L’emporte » maintient cette tension sans lui attribuer explicitement une valeur morale ou cultuelle.
translation_notes:
  register: Français international moderne, clair et digne. La question sapientielle et son contraste sont conservés ; la formulation ne précise pas en quoi un jour l’emporte sur un autre.
