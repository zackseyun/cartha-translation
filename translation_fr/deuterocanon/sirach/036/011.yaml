  source_fidelity: 'La structure imprécatoire est bien rendue : καταβρωθήτω appelle « que … soit consumé » et εὕροισαν conserve le souhait avec « que … trouvent ». « Le survivant » est une contextualisation défendable de ὁ σωζόμενος, et la note maintient à juste titre les possibilités plus littérales. Toutefois, « perdition » peut suggérer en français moderne une damnation au sens doctrinal, plus étroite que ἀπώλεια, qui désigne ici la destruction ou la ruine.'
  naturalness: « Dans une colère de feu » est intelligible, mais peu idiomatique en français international moderne. « Dans une colère brûlante » conserve l’image ignée et la force de ἐν ὀργῇ πυρός dans une formulation naturelle. « Commettent l’injustice envers » est grammatical mais lourd ; « agissent injustement envers » rend plus naturellement le participe verbal ἀδικοῦντες.
  terminology: '« Destruction » est préférable à « perdition » pour ἀπώλεια : le terme est direct, ne surinterprète pas le jugement comme damnation éternelle, et correspond à la note anglaise/audit trail. Le terme « consumé » convient à καταβρωθήτω dans le cadre de l’imagerie de feu.'
