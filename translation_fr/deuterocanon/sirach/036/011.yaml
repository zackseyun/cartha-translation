    rationale: En français biblique contemporain, « perdition » porte facilement une connotation de condamnation éternelle. Le grec n’impose pas cette précision ; « destruction » préserve le sens de ruine anéantissante sans ajout doctrinal.
  - severity: low
    issue: Formulation « Dans une colère de feu »
    rationale: Le calque du génitif grec est peu naturel en français. Une formulation idiomatique peut conserver l’image du feu sans modifier la portée du texte.
  - severity: low
    issue: « commettent l’injustice envers »
    rationale: La formulation est plus abstraite et moins fluide que nécessaire. « Agissent injustement envers » conserve la valeur participiale et le rapport à « ton peuple ».
