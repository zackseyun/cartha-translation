  text: In fiery wrath let the survivor be consumed[a], and let those who do injustice to your people meet destruction.
translation:
  language: fr
  text: Dans une colère brûlante, que le survivant soit consumé[a], et que ceux qui agissent injustement envers ton peuple trouvent la destruction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus littéralement, « celui qui est sauvé » ou « celui qui est préservé ». L’expression grecque est difficile dans ce contexte et peut désigner un ennemi qui a jusque-là échappé à la destruction.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ὀργῇ πυρὸς
  choice: Dans une colère de feu
  rationale: Rend de près le génitif grec (« colère de feu ») tout en conservant l’image d’une colère ardente et destructrice.
- source_word: καταβρωθήτω
  choice: que… soit consumé
  rationale: L’impératif passif exprime le souhait qu’il soit entièrement dévoré ou détruit; « consumé » s’accorde naturellement avec l’image du feu.
- source_word: ὁ σωζόμενος
  choice: le survivant
  rationale: Dans ce contexte hostile, le participe désigne vraisemblablement celui qui a été préservé jusque-là ou qui a échappé à la destruction. La difficulté et le sens plus littéral sont signalés en note.
- source_word: οἱ ἀδικοῦντες τὸν λαόν σου
  choice: ceux qui commettent l’injustice envers ton peuple
  rationale: Conserve la valeur verbale du participe et son rapport direct au peuple de Dieu sans préciser indûment la nature de l’injustice.
- source_word: εὕροισαν ἀπώλειαν
  choice: que… trouvent la perdition
  rationale: Reproduit l’image grecque de « trouver » la ruine et maintient la valeur optative, donc imprécatoire, de la proposition.
theological_decisions:
- issue: Force imprécatoire du verset
  choice: Conserver la prière directe demandant le jugement
  alternative: Transformer la demande en prédiction d’un jugement futur
  rationale: L’impératif καταβρωθήτω et l’optatif εὕροισαν expriment des souhaits ou requêtes. Les atténuer en simple prédiction effacerait la tension théologique du texte.
- issue: Référent de ὁ σωζόμενος
  choice: Comprendre le participe comme l’ennemi ayant jusque-là survécu ou échappé
  alternative: « celui qui est sauvé/préservé », sans identification contextuelle
  rationale: Le contexte d’imprécation favorise le sens de celui qui a échappé au jugement précédent, mais la morphologie permet une formulation plus littérale, préservée en note.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe conserve le parallélisme de la prière grecque; « perdition » maintient la gravité d’ἀπώλεια sans ajouter de précision doctrinale.
