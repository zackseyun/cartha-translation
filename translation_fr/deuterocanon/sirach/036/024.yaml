  text: A woman's beauty brightens the face[b][a], and surpasses every desire of a man.
translation:
  language: fr
  text: La beauté d’une femme égaye le visage[a] et surpasse tout désir de l’homme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « réjouit le visage » ou « illumine le visage ».
    reason: lexical_alternative
  - marker: b
    text: Le grec peut désigner l’être humain en général ; dans ce contexte, il peut aussi évoquer un homme.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: κάλλος
  choice: beauté
  rationale: Le nom désigne la beauté ou l’attrait physique ; « beauté » est le terme français moderne le plus direct et naturel.
- source_word: γυναικός
  choice: d’une femme
  rationale: Le génitif de γυνή désigne ici naturellement une femme. Le sens plus étroit « épouse » n’est pas imposé par cette phrase.
- source_word: ἱλαρύνει
  choice: égaye
  rationale: Le verbe signifie rendre joyeux, réjouir ou illuminer. « Égaye le visage » conserve à la fois l’effet émotionnel et l’image concrète.
- source_word: πρόσωπον
  choice: le visage
  rationale: Le nom singulier est rendu concrètement, sans préciser à qui appartient le visage, puisque le grec ne le précise pas.
- source_word: ὑπὲρ πᾶσαν ἐπιθυμίαν
  choice: surpasse tout désir
  rationale: ὑπέρ avec l’accusatif marque ici le dépassement, tandis que ἐπιθυμία désigne un désir ou une aspiration. La formulation garde la portée générale de πᾶσαν.
- source_word: ἀνθρώπου
  choice: de l’homme
  rationale: En français, « l’homme » peut désigner un être humain en général tout en permettant, dans ce contexte où il est question d’une femme, une lecture masculine. Ce choix préserve l’ambiguïté du grec mieux que « d’un homme » ou « de l’être humain ».
- source_word: ὑπεράγει
  choice: surpasse
  rationale: Le verbe exprime l’idée d’aller au-delà ou de l’emporter sur ; « surpasse » rend clairement cette valeur comparative.
theological_decisions:
- issue: Portée générique ou masculine de ἀνθρώπου
  choice: de l’homme
  alternative: de l’être humain ; d’un homme
  rationale: ἀνθρώπου peut être générique, mais le contexte peut aussi faire entendre un homme en relation avec une femme. « De l’homme » maintient en français cette tension sans imposer exclusivement l’une des deux lectures.
translation_notes:
  register: Français international moderne, proverbial et digne. La phrase reste concise ; elle conserve l’image concrète du visage ainsi que l’ambiguïté de ἀνθρώπου.
