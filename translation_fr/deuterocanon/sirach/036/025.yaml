  yaml_path: translation/deuterocanon/sirach/036/025.yaml
  text: If there is mercy and gentleness on her tongue[b][a], her husband is not like the sons of men.
translation:
  language: fr
  text: Si sa langue porte de la compassion et de la douceur, son mari n’est pas comme les fils des hommes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus idiomatiquement : « son mari n’est pas comme les autres hommes ». Le grec dit littéralement « les fils des hommes »; cette tournure quelque peu abrupte présente le mari d’une telle femme comme exceptionnel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ γλώσσης αὐτῆς
  choice: sur sa langue
  rationale: Cette formulation conserve l’image grecque de qualités présentes « sur la langue », c’est-à-dire manifestées dans la parole, tout en restant intelligible en français.
- source_word: ἔλεος
  choice: compassion
  rationale: « Compassion » exprime ici une disposition bienveillante et miséricordieuse avec plus de naturel que « miséricorde » lorsqu’il s’agit de la manière de parler.
- source_word: πραΰτης
  choice: douceur
  rationale: « Douceur » rend clairement la qualité d’une parole paisible et non rude; « mansuétude » serait plus soutenu et moins courant.
- source_word: ὁ ἀνὴρ αὐτῆς
  choice: son mari
  rationale: Dans ce contexte conjugal, ἀνήρ désigne naturellement le mari plutôt qu’un homme au sens général.
- source_word: καθʼ υἱοὺς ἀνθρώπων
  choice: comme les fils des hommes
  rationale: La traduction conserve l’expression masculine, proverbiale et quelque peu abrupte du grec, sans en imposer silencieusement une interprétation plus fluide.
theological_decisions:
- issue: Portée de l’expression masculine καθʼ υἱοὺς ἀνθρώπων
  choice: les fils des hommes
  alternative: les autres hommes
  rationale: Le texte principal garde la forme grecque et sa tension expressive. La note indique le sens idiomatique probable sans neutraliser ni résoudre entièrement une tournure inhabituelle.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe conserve le parallélisme et l’image concrète de la langue; une note accompagne l’expression finale, volontairement littérale et inhabituelle.
