  text: A man of understanding will trust in the law, and the law is as trustworthy to him as an oracle of the righteous.
translation:
  language: fr
  text: L’homme avisé mettra sa confiance dans la Loi, et la Loi sera pour lui aussi digne de foi qu’un oracle des justes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec peut aussi se comprendre : « une consultation des justes » ou « une réponse donnée aux justes ».'
    reason: Le nom ἐρώτημα et le génitif δικαίων permettent plusieurs relations de sens que « oracle des justes » ne peut rendre à lui seul.
lexical_decisions:
- source_word: ἄνθρωπος συνετός
  choice: L’homme avisé
  rationale: ἄνθρωπος a ici une portée générale, tandis que συνετός désigne une personne douée de discernement; « avisé » donne un français naturel et digne.
- source_word: ἐμπιστεύσει νόμῳ
  choice: mettra sa confiance dans la Loi
  rationale: Le futur grec est conservé. La majuscule à « Loi » signale ici l’enseignement normatif reçu dans le cadre biblique sans ajouter de précision absente du texte.
- source_word: πιστός
  choice: digne de foi
  rationale: L’adjectif exprime ce sur quoi l’on peut compter; cette formulation maintient le parallèle avec l’acte de faire confiance dans la première proposition.
- source_word: ἐρώτημα δικαίων
  choice: un oracle des justes
  rationale: ἐρώτημα peut désigner une demande, une consultation ou la réponse obtenue; dans ce contexte comparatif, « oracle » exprime une réponse tenue pour autorisée tout en laissant ouverte la relation exacte du génitif δικαίων.
theological_decisions:
- issue: Rapport entre la personne avisée et la Loi
  choice: Conserver l’affirmation forte selon laquelle la Loi est digne de foi pour elle
  alternative: Paraphraser la Loi comme simple guide utile
  rationale: Le grec qualifie directement la Loi de πιστός et établit un lien explicite entre confiance humaine et fiabilité de la Loi.
- issue: Sens du génitif δικαίων
  choice: « des justes »
  alternative: « accordé aux justes » ou « prononcé par les justes »
  rationale: Le génitif grec ne précise pas si les justes sont la source, les bénéficiaires ou les consultants; la traduction évite de trancher silencieusement.
translation_notes:
  register: Français biblique moderne, clair et soutenu. Le masculin singulier de la formulation grecque est conservé dans « l’homme… lui », avec une portée générique. Le parallélisme entre confiance et fiabilité structure la phrase.
