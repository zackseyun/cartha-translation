  yaml_path: translation/deuterocanon/sirach/036/028.yaml
  text: For who will trust a well-armed robber[b][a], staggering from city to city? So it is with a man who has no nest and lodges wherever night finds him.
translation:
  language: fr
  text: Car qui fera confiance à un brigand prêt à l’action[a], qui chancelle de ville en ville[b] ? Il en va de même pour l’homme qui n’a pas de nid[c] et passe la nuit là où le soir le surprend.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « bien ceint » ; le terme peut désigner quelqu’un qui est équipé et prêt à agir.'
    reason: lexical_alternative
  - marker: b
    text: Le grec peut aussi évoquer quelqu’un qui trébuche ou qui est ballotté de ville en ville.
    reason: lexical_ambiguity
  - marker: c
    text: Le « nid » représente ici un foyer ou un lieu de repos stable.
    reason: metaphor_clarification
lexical_decisions:
- source_word: τίς γὰρ πιστεύσει
  choice: Car qui fera confiance
  rationale: πιστεύω désigne ici la confiance accordée à une personne. « Car » conserve la valeur explicative de γάρ.
- source_word: εὐζώνῳ
  choice: prêt à l’action
  rationale: L’adjectif signifie littéralement « bien ceint » et, par extension, équipé et prêt à agir. Cette formulation française garde la portée concrète sans imposer l’idée plus précise d’armes.
- source_word: λῃστῇ
  choice: brigand
  rationale: λῃστής évoque un bandit ou un voleur de grand chemin plutôt qu’un simple voleur; « brigand » convient au contexte et au registre proverbial.
- source_word: σφαλλομένῳ ἐκ πόλεως εἰς πόλιν
  choice: trébuchant de ville en ville
  rationale: Le participe de σφάλλομαι peut exprimer le fait de trébucher, de chanceler ou d’être déstabilisé. La traduction conserve cette image d’instabilité, malgré son caractère inhabituel en français.
- source_word: οὕτως ἀνθρώπῳ
  choice: Il en va de même pour l’homme
  rationale: La tournure introduit naturellement la comparaison. « L’homme » correspond au singulier générique du grec dans ce proverbe.
- source_word: μὴ ἔχοντι νοσσιὰν
  choice: qui n’a pas de nid
  rationale: νοσσιά désigne proprement un nid. Conserver la métaphore rend sensible l’absence de foyer stable.
- source_word: καταλύοντι
  choice: passe la nuit
  rationale: Dans ce contexte, le verbe évoque le fait de faire halte ou de prendre un logement pour la nuit.
- source_word: οὗ ἐὰν ὀψίσῃ
  choice: là où le soir le surprend
  rationale: La proposition renvoie au lieu où l’homme se trouve lorsque le soir arrive ou lorsqu’il se fait tard. La formulation choisie est naturelle en français et garde l’idée d’une halte non planifiée.
