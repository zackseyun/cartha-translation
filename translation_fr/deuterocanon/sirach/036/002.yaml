  yaml_path: translation/deuterocanon/sirach/036/002.yaml
  text: A wise man will not hate the law[a], but the one who is hypocritical in it is like a ship in a storm.
translation:
  language: fr
  text: Un homme sage ne détestera pas la Loi, mais celui qui se montre hypocrite à son égard[a] est comme un navire dans la tempête.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en elle »; le pronom renvoie à la Loi.'
    reason: La formulation française idiomatique explicite la relation compacte exprimée par le grec ἐν αὐτῷ.
lexical_decisions:
- source_word: ἀνὴρ σοφός
  choice: un homme sage
  rationale: Le grec emploie explicitement le masculin singulier et le vocabulaire caractéristique de la littérature de sagesse.
- source_word: οὐ μισήσει
  choice: ne détestera pas
  rationale: Cette formulation rend directement le futur de μισέω tout en restant naturelle en français moderne.
- source_word: νόμον
  choice: la Loi
  rationale: Dans le cadre sapientiel juif du Siracide, le terme désigne vraisemblablement la Loi de Dieu, sans exclure sa dimension d’enseignement.
- source_word: ὁ δὲ ὑποκρινόμενος
  choice: mais celui qui se montre hypocrite
  rationale: La tournure verbale conserve la valeur active du participe grec, qui évoque une conduite feinte plutôt qu’une simple étiquette.
- source_word: ἐν αὐτῷ
  choice: à son égard
  rationale: Le pronom renvoie naturellement à la Loi; cette expression restitue idiomatiquement en français la relation exprimée par ἐν.
- source_word: ὡς ἐν καταιγίδι πλοῖον
  choice: est comme un navire dans la tempête
  rationale: La copule sous-entendue est nécessaire en français; «navire» et «tempête» gardent la force et la dignité de la comparaison.
theological_decisions:
- issue: Référence de νόμον
  choice: la Loi, au sens probable de la Torah et de l’enseignement divin
  alternative: la loi ou l’instruction au sens général
  rationale: L’usage du Siracide favorise la référence à la Loi de Dieu; la traduction concise «la Loi» préserve aussi les résonances sapientielles sans explicitation doctrinale.
- issue: Portée de ὑποκρινόμενος ἐν αὐτῷ
  choice: une conduite hypocrite à l’égard de la Loi
  alternative: celui qui fait semblant en elle / l’hypocrite en elle
  rationale: Le participe décrit une attitude de dissimulation ou de feinte. La formulation retenue préserve cette action tout en évitant un français obscur.
translation_notes:
  register: Français moderne, clair et digne. La majuscule à «Loi» signale le référent juif probable sans ajouter «de Moïse» ou «Torah», que le grec n’explicite pas.
