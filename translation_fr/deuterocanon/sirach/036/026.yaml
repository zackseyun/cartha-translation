  text: He who acquires a wife begins an acquisition[b][a], a helper corresponding to him and a pillar of rest.
translation:
  language: fr
  text: 'Celui qui acquiert une épouse commence une acquisition[a] : une aide qui lui correspond[b] et un pilier de repos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « commence une possession » ou « commence à se constituer un bien ». Le grec emploie deux mots apparentés, rendus ici par « acquiert » et « acquisition ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « selon lui » ; l’expression peut désigner une aide qui lui correspond ou qui lui est adaptée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κτώμενος
  choice: Celui qui acquiert
  rationale: Le participe substantivé masculin singulier a une portée proverbiale. « Celui qui acquiert » conserve à la fois cette forme et le lien lexical avec κτήσεως.
- source_word: γυναῖκα
  choice: une épouse
  rationale: Dans ce contexte, γυνή désigne la femme mariée. « Épouse » est plus précis que « femme » en français moderne.
- source_word: ἐνάρχεται
  choice: commence
  rationale: Le verbe exprime le commencement. La formulation concise maintient la structure resserrée du proverbe.
- source_word: κτήσεως
  choice: une acquisition
  rationale: Le nom est apparenté à κτώμενος. « Acquisition » préserve en français le jeu de mots « acquiert / acquisition », malgré une légère raideur volontairement signalée en note.
- source_word: βοηθὸν
  choice: une aide
  rationale: « Une aide » rend directement le nom βοηθός sans préciser davantage la nature de cette assistance.
- source_word: κατʼ αὐτόν
  choice: qui lui correspond
  rationale: La tournure littérale « selon lui » peut exprimer la correspondance ou l'adaptation. Cette traduction reste intelligible tout en conservant cette idée relationnelle.
- source_word: στύλον
  choice: un pilier
  rationale: « Pilier » maintient l'image architecturale concrète de στῦλος.
- source_word: ἀναπαύσεως
  choice: de repos
  rationale: « Repos » rend simplement ἀνάπαυσις et préserve la métaphore compacte du pilier.
theological_decisions:
- issue: Sujet proverbial genré
  choice: Celui qui acquiert une épouse
  alternative: Quiconque acquiert une épouse
  rationale: Le grec emploie un masculin singulier à valeur proverbiale. Le français conserve cette forme grammaticale sans la généraliser au pluriel ni la neutraliser.
- issue: Rapport exprimé par κατʼ αὐτόν
  choice: une aide qui lui correspond
  alternative: une aide adaptée à lui
  rationale: « Qui lui correspond » préserve la notion de correspondance sans réduire l'expression à une simple convenance pratique ni lui imposer une interprétation théologique particulière.
translation_notes:
  register: Français international moderne, sobre et proverbial. La légère raideur de « commence une acquisition » est conservée afin de reproduire le jeu de mots grec et d'éviter de résoudre l'ambiguïté entre acquisition, possession et bien.
