  text: according to the blessing of Aaron over your people[a], and all those on the earth will know that you are the Lord[b], the God of the ages.
translation:
  language: fr
  text: selon la bénédiction prononcée par Aaron sur ton peuple[a], tous ceux qui sont sur la terre sauront que tu es le Seigneur, le Dieu des siècles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour ton peuple » ou « au sujet de ton peuple » ; l’expression grecque peut désigner la bénédiction qu’Aaron prononce sur Israël.
    reason: lexical_alternative
  - marker: b
    text: Ou « le Dieu éternel ». Le grec dit plus littéralement « le Dieu des siècles ».
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὴν εὐλογίαν Ἀαρὼν
  choice: selon la bénédiction prononcée par Aaron
  rationale: « Selon » exprime la conformité indiquée par κατά. L’ajout de « prononcée par » explicite naturellement en français le rapport entre Aaron et la bénédiction sans changer le sens.
- source_word: περὶ τοῦ λαοῦ σου
  choice: sur ton peuple
  rationale: Avec une bénédiction prononcée, « sur ton peuple » est idiomatique et reste proche de περί, tout en laissant en note les valeurs possibles « pour » et « au sujet de ».
- source_word: γνώσονται
  choice: sauront
  rationale: Le futur simple rend directement le futur grec et convient à l’acquisition ou à la possession de cette connaissance.
- source_word: πάντες οἱ ἐπὶ τῆς γῆς
  choice: tous ceux qui sont sur la terre
  rationale: Cette formulation conserve l’étendue universelle et la tournure concrète du grec sans introduire le terme plus interprétatif « habitants ».
- source_word: Κύριος
  choice: le Seigneur
  rationale: « Seigneur » est le titre divin français courant et digne correspondant à Κύριος.
- source_word: ὁ θεὸς τῶν αἰώνων
  choice: le Dieu des siècles
  rationale: La traduction garde le pluriel de αἰώνων et sa portée temporelle, au lieu de le réduire sans signalement à l’adjectif interprétatif « éternel ».
theological_decisions:
- issue: Traduction du titre divin Κύριος
  choice: le Seigneur
  alternative: le Maître
  rationale: « Le Seigneur » est la traduction française reçue du titre divin et n’impose aucune précision confessionnelle supplémentaire.
- issue: Portée de ὁ θεὸς τῶν αἰώνων
  choice: le Dieu des siècles
  alternative: le Dieu éternel
  rationale: La formulation choisie préserve l’image temporelle et le pluriel du grec; la note donne l’équivalent théologique plus idiomatique sans effacer la formulation source.
translation_notes:
  register: Français international moderne, naturel et digne. La première proposition étant syntaxiquement rattachée au contexte antérieur dans le grec, elle est conservée comme prolongement, tandis que « Alors » rend lisible la conséquence exprimée par καί dans ce fragment versifié.
