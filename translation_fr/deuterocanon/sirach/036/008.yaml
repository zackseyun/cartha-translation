  text: By the knowledge of the Lord they were distinguished, and he altered seasons and festivals.
translation:
  language: fr
  text: Par la connaissance du Seigneur, ils ont été distingués, et il a modifié les saisons et les fêtes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν γνώσει Κυρίου
  choice: Par la connaissance du Seigneur
  rationale: Cette formulation conserve le moyen ou fondement exprimé par ἐν et le génitif Κυρίου, sans préciser au-delà du grec s’il s’agit de la connaissance que possède le Seigneur ou de celle qui se rapporte à lui.
- source_word: διεχωρίσθησαν
  choice: ils ont été distingués
  rationale: Le passif et l’idée de différenciation ou de séparation sont maintenus, sans ajouter explicitement « les uns des autres », qui reste implicite.
- source_word: ἠλλοίωσεν
  choice: il a modifié
  rationale: Le verbe exprime un changement ou une transformation ; « a modifié » rend cette nuance sans suggérer nécessairement un remplacement total.
- source_word: καιρούς
  choice: les temps
  rationale: « Temps » garde la portée souple de καιρός, qui peut désigner des périodes, des moments fixés ou des saisons.
- source_word: ἑορτάς
  choice: les fêtes
  rationale: Terme français courant et exact pour les célébrations festives ou religieuses désignées par ἑορτή.
theological_decisions:
- issue: Identité du sujet de « il a modifié »
  choice: Maintenir le pronom « il », dont le référent naturel est le Seigneur
  alternative: Répéter « le Seigneur »
  rationale: Le grec emploie un verbe à la troisième personne du singulier sans répéter le sujet. Le pronom français préserve cette structure tout en laissant le lien contextuel avec le Seigneur.
translation_notes:
  register: Français moderne, sobre et digne. La formulation reste proche de la syntaxe grecque tout en étant naturelle ; aucune précision contextuelle absente du verset n’a été ajoutée.
