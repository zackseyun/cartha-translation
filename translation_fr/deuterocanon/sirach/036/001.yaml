  text: No evil will confront the one who fears the Lord[b][a], but in trial he will rescue him again.
translation:
  language: fr
  text: Aucun mal ne surviendra à celui qui craint le Seigneur[a] ; mais, dans l’épreuve[b], il en sera de nouveau délivré.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Aucun malheur ne viendra atteindre celui qui craint le Seigneur. » Le grec κακόν peut désigner le mal, un tort ou un malheur.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans la mise à l’épreuve » ou « dans la tentation ». Le grec πειρασμός peut désigner une épreuve, une mise à l’épreuve ou une tentation ; ici, le contexte favorise l’adversité ou la mise à l’épreuve.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ φοβουμένῳ Κύριον
  choice: à celui qui craint le Seigneur
  rationale: Le participe substantivé désigne de façon générale une personne caractérisée par sa crainte du Seigneur. Cette formulation conserve le singulier et la portée proverbiale dans un français naturel.
- source_word: οὐκ ἀπαντήσει
  choice: ne surviendra
  rationale: Le verbe ἀπαντάω évoque littéralement une rencontre. Avec κακόν, il exprime ici l’idée qu’un mal ne viendra pas atteindre ou frapper la personne concernée. « Ne surviendra » rend naturellement cette idée en français.
- source_word: κακόν
  choice: mal
  rationale: κακόν peut désigner le mal, un tort ou un malheur. « Mal » en préserve l’étendue sémantique sans réduire le propos à la seule souffrance physique ou à une calamité particulière.
- source_word: ἐν πειρασμῷ
  choice: dans l’épreuve
  rationale: πειρασμός peut désigner une épreuve, une mise à l’épreuve ou une tentation. Le contexte de délivrance face à l’adversité favorise ici « épreuve », tout en laissant les autres nuances en note.
- source_word: καὶ πάλιν
  choice: de nouveau
  rationale: πάλιν signifie le plus naturellement « de nouveau » ou « encore ». La formulation peut évoquer une délivrance renouvelée au fil des épreuves.
- source_word: ἐξελεῖται
  choice: le délivrera
  rationale: Le verbe signifie retirer d’un danger, délivrer ou secourir. « Délivrera » convient au registre sapientiel et rend clairement l’action salvatrice implicite.
theological_decisions:
- issue: Sujet implicite de ἐξελεῖται
  choice: 'Expliciter « le Seigneur » comme sujet : « le Seigneur le délivrera »'
  alternative: Employer une tournure impersonnelle, telle que « il en sera délivré »
  rationale: Le Seigneur, mentionné dans la première proposition, est le sujet implicite le plus naturel de la délivrance. Le français gagne en clarté à l’expliciter, sans ajouter un nouvel acteur au texte.
- issue: Tension entre l’absence de mal et la présence de l’épreuve
  choice: Conserver les deux affirmations sans les harmoniser
  alternative: Reformuler la première comme une promesse selon laquelle aucun mal définitif ne l’atteindra
  rationale: Le grec affirme à la fois qu’aucun mal ne surviendra à celui qui craint le Seigneur et que celui-ci connaîtra l’épreuve dont il sera délivré. Ajouter « définitif » ou une autre restriction résoudrait une tension que le texte laisse ouverte.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation proverbiale reste concise. Le point-virgule met en relief la tension voulue entre l’absence de mal annoncée et la réalité de l’épreuve.
