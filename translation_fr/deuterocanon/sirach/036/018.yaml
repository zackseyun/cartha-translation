base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/036/018.yaml
  text: Give a reward to those who wait for you[a], and let your prophets be trusted. Hear, O Lord[b], the prayer of your suppliants.
translation:
  language: fr
  text: Accorde une récompense à ceux qui t’attendent[a], et que tes prophètes soient reconnus comme dignes de confiance[b]. Écoute, Seigneur, la prière de ceux qui te supplient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à ceux qui persévèrent pour toi » ou « à ceux qui restent fermes envers toi ». Le verbe grec peut exprimer aussi bien l’attente que la persévérance.
    reason: lexical_alternative
  - marker: b
    text: Ou « et que tes prophètes soient crus » ou « et que l’on fasse confiance à tes prophètes ». Le grec est condensé et peut évoquer soit la reconnaissance de leur fiabilité, soit la confiance qu’on leur accorde.
    reason: alternative_reading
lexical_decisions:
- source_word: δὸς μισθὸν
  choice: Accorde une récompense
  rationale: L’impératif δὸς appelle une demande directe. « Accorde » est naturel dans une prière, tandis que « récompense » rend μισθός sans suggérer aussi fortement un salaire commercial.
- source_word: τοῖς ὑπομένουσίν σε
  choice: à ceux qui t’attendent
  rationale: Ὑπομένω peut exprimer l’attente aussi bien que la persévérance. Avec Dieu comme objet personnel et dans ce contexte de prière, « t’attendent » exprime naturellement une attente confiante, sans effacer entièrement la notion d’endurance.
- source_word: οἱ προφῆταί σου
  choice: tes prophètes
  rationale: Traduction directe et transparente du groupe nominal grec.
- source_word: ἐμπιστευθήτωσαν
  choice: soient reconnus comme dignes de confiance
  rationale: Le passif impératif est condensé et difficile. Cette formulation peut exprimer la confirmation publique de la fiabilité des prophètes, tout en restant naturelle en français.
- source_word: εἰσάκουσον
  choice: Écoute
  rationale: Dans une prière, le verbe demande non seulement l’audition, mais une écoute favorable. « Écoute » est direct et idiomatique en français moderne.
- source_word: Κύριε
  choice: Seigneur
  rationale: Vocatif usuel pour l’adresse directe à Dieu.
- source_word: δεήσεως τῶν ἱκετῶν σου
  choice: la prière de ceux qui te supplient
  rationale: « Prière » rend naturellement δέησις dans ce contexte, et la proposition « ceux qui te supplient » transmet le sens de ἱκέται plus clairement que le substantif rare « suppliants ».
theological_decisions:
- issue: Sens de τοῖς ὑπομένουσίν σε
  choice: ceux qui t’attendent
  alternative: ceux qui persévèrent pour toi ; ceux qui restent fermes envers toi
  rationale: Le grec permet l’attente et l’endurance. Le texte principal retient l’attente confiante, naturelle dans cette prière, et la note conserve les autres nuances sans trancher davantage.
- issue: Portée de ἐμπιστευθήτωσαν à propos des prophètes
  choice: que tes prophètes soient reconnus comme dignes de confiance
  alternative: que tes prophètes soient crus ; que l’on fasse confiance à tes prophètes
  rationale: La forme passive peut viser soit la reconnaissance de leur fiabilité, soit le fait qu’on les croie. La traduction principale met en avant leur confirmation comme fiables, tandis que la note préserve l’autre lecture.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le ton direct de la supplication et évite le terme peu courant « suppliants ». Les deux ambiguïtés principales du grec sont signalées en notes.
