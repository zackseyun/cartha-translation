  text: And all men are from the ground[a], and Adam was created from the earth.
translation:
  language: fr
  text: Tous les humains[a] viennent du sol, et Adam a été créé à partir de la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, le grec emploie un masculin pluriel pouvant se traduire par « tous les hommes » ; ici, il désigne l’ensemble des êtres humains.
    reason: Précision sur la forme grammaticale grecque et sa portée générique.
lexical_decisions:
- source_word: ἄνθρωποι πάντες
  choice: tous les humains
  rationale: L’expression désigne ici l’humanité entière. « Tous les humains » rend naturellement en français la portée générique du masculin pluriel grec sans la limiter aux hommes de sexe masculin.
- source_word: ἀπὸ ἐδάφους
  choice: viennent du sol
  rationale: ἐδάφος désigne concrètement le sol. Le verbe « viennent », suppléé en français comme l’est « are » dans la couche anglaise, rend intelligible la proposition nominale elliptique du grec et conserve l’image de l’origine terrestre.
- source_word: ἐκ γῆς
  choice: à partir de la terre
  rationale: γῆ peut signifier la terre, le sol ou le pays. « La terre » maintient une légère variation par rapport à ἐδάφος, traduit par « sol », tout en préservant le parallélisme.
- source_word: ἐκτίσθη
  choice: a été créé
  rationale: Le passif de κτίζω signifie couramment « être créé ». Cette formulation conserve explicitement le motif de la création.
- source_word: Ἀδάμ
  choice: Adam
  rationale: Le nom propre est translittéré sous sa forme française traditionnelle. Le texte renvoie à Adam tout en le présentant comme prototype de l’humanité issue de la terre.
theological_decisions:
- issue: Portée représentative de ἄνθρωποι πάντες en relation avec Adam
  choice: Le premier membre parle de toute l’humanité, puis le second évoque la création d’Adam à partir de la terre.
  alternative: Le second membre peut aussi être compris comme présentant Adam de manière appositionnelle ou paradigmatique, en tant que représentant de l’humanité.
  rationale: La traduction garde à la fois la portée universelle du premier membre et le nom historique « Adam », sans décider plus précisément si le second membre constitue une explication, un exemple fondateur ou une formulation appositionnelle.
translation_notes:
  register: Français international moderne, simple et digne. « Tous les humains » est plus naturel et moins ambigu que « tous les hommes » pour désigner l’humanité entière. La répétition « sol / terre » reflète les deux termes grecs distincts, ἐδάφος et γῆ.
