  text: Have compassion on the city of your sanctuary[a], Jerusalem, the city of your dwelling place.
translation:
  language: fr
  text: Aie compassion de la ville de ton sanctuaire, Jérusalem, la ville de ton lieu de repos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la ville de ta demeure ». Le grec dit littéralement « la ville de ton lieu de repos ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκτείρησον
  choice: Prends en compassion
  rationale: L’impératif appelle Dieu à manifester une compassion miséricordieuse. Cette tournure est naturelle dans une prière solennelle et évite la nuance parfois condescendante de « prends en pitié ».
- source_word: πόλιν
  choice: la ville
  rationale: Bien que le nom soit sans article en grec, l’apposition « Jérusalem » et les compléments possessifs rendent la référence définie.
- source_word: ἁγιάσματός σου
  choice: de ton sanctuaire
  rationale: ἁγίασμα désigne ce qui est consacré ou un lieu saint. « Sanctuaire » conserve ici l’association de Jérusalem avec la présence sainte de Dieu.
- source_word: Ἰερουσαλήμ
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
- source_word: καταπαύματός σου
  choice: où tu trouves ton repos
  rationale: κατάπαυμα évoque le repos ainsi que le lieu où l’on se repose ou s’établit. Cette formulation française conserve l’image du repos divin sans réduire d’emblée le terme à la seule idée d’habitation.
theological_decisions:
- issue: Rapport entre les deux descriptions de Jérusalem
  choice: 'Conserver deux descriptions apposées : « la ville de ton sanctuaire » et « la ville où tu trouves ton repos »'
  alternative: « Jérusalem, ta ville sainte et ta demeure »
  rationale: Le grec juxtapose deux groupes nominaux décrivant Jérusalem. Les garder distincts préserve à la fois les thèmes de la sainteté et du repos de Dieu sans les fondre dans une paraphrase.
- issue: Valeur de κατάπαυμα
  choice: repos, exprimé comme le lieu où Dieu trouve son repos
  alternative: demeure
  rationale: « Demeure » est possible par implication contextuelle, mais elle atténue l’image lexicale du repos. Le texte garde donc cette image tout en produisant une phrase française idiomatique.
translation_notes:
  register: Français moderne, international et digne, adapté à une supplication liturgique. La répétition de « la ville » reproduit la structure appositive du grec.
