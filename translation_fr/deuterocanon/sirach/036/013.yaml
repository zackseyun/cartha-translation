  text: Gather all the tribes of Jacob[a], and allot them their inheritance as from the beginning.
translation:
  language: fr
  text: Rassemble toutes les tribus de Jacob et prends-les en héritage, comme au commencement.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe grec, rare, appartient au vocabulaire de l’héritage. On peut aussi comprendre : « attribue-leur leur héritage comme au commencement » ou « rétablis-les dans leur héritage comme au commencement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σύναγε
  choice: Rassemble
  rationale: L’impératif présent de συνάγω exprime ici une demande directe visant à réunir ce qui est dispersé. « Rassemble » est naturel et conserve cette force.
- source_word: πάσας φυλὰς Ἰακώβ
  choice: toutes les tribus de Jacob
  rationale: Rendu direct de l’expression grecque. Le nom « Jacob » est conservé plutôt que remplacé par « Israël ».
- source_word: κατακληρονομήσεις
  choice: prends-les en héritage
  rationale: Ce futur actif à valeur injonctive ou pétitionnaire gouverne directement αὐτούς. Le choix retient l’image de l’héritage et la syntaxe dans laquelle les tribus sont l’objet du verbe, sans masquer le caractère inhabituel et discuté du terme.
- source_word: αὐτούς
  choice: les
  rationale: Le pronom masculin pluriel renvoie aux « tribus » envisagées comme groupes humains et demeure l’objet direct du verbe.
- source_word: καθὼς ἀπʼ ἀρχῆς
  choice: comme au commencement
  rationale: Cette formulation préserve la comparaison temporelle sans préciser indûment quel commencement est visé.
theological_decisions:
- issue: Sens de l’image d’héritage dans κατακληρονομήσεις
  choice: Dieu est prié de prendre de nouveau les tribus pour héritage.
  alternative: Dieu est prié de leur attribuer leur héritage ou de les rétablir dans leur héritage.
  rationale: La construction grecque fait de « les » l’objet direct du verbe, ce qui favorise « prends-les en héritage ». Toutefois, le verbe rare peut évoquer l’attribution ou la restauration d’un héritage; cette possibilité contextuelle est signalée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, digne et direct. La formulation conserve l’image biblique de l’héritage ainsi que l’ambiguïté du verbe grec, explicitée en note.
