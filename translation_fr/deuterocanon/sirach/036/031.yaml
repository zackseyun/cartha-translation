base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/036/031.yaml
  text: For who will trust a well-armed robber[b][a], stumbling from city to city? So it is with a man who has no nest and lodges wherever evening finds him.
translation:
  language: fr
  text: Car qui fera confiance à un brigand bien équipé[a], qui va en trébuchant de ville en ville ? Il en va de même d’un homme qui n’a pas de nid[b] et qui loge là où le soir le surprend.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « bien ceint » : le mot grec évoque quelqu’un dont la tenue ou l’équipement lui permet d’agir avec aisance et promptitude.'
    reason: lexical_alternative
  - marker: b
    text: Le grec dit littéralement « nid », image d’une demeure fixe et d’un lieu de repos sûr.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐζώνῳ
  choice: bien équipé
  rationale: L’adjectif signifie littéralement « bien ceint » et peut évoquer quelqu’un d’équipé, dispos et prêt à agir. « Bien équipé » conserve cette idée sans préciser, au-delà du grec, qu’il est armé.
- source_word: λῃστῇ
  choice: brigand
  rationale: Le terme désigne un voleur de grand chemin ou un bandit, potentiellement violent. « Brigand » convient au contexte et reste intelligible en français moderne.
- source_word: σφαλλομένῳ
  choice: qui va en trébuchant
  rationale: Le participe exprime l’action de trébucher, de chanceler ou l’instabilité. Cette formulation préserve l’image concrète et le caractère précaire du déplacement.
- source_word: νοσσιὰν
  choice: nid
  rationale: Le nom désigne littéralement un nid. Garder cette métaphore vive exprime l’absence de demeure fixe et sûre.
- source_word: καταλύοντι
  choice: qui loge
  rationale: Le verbe signifie faire halte ou loger, souvent pour la nuit. « Loger » convient au contexte itinérant.
- source_word: οὗ ἐὰν ὀψίσῃ
  choice: là où le soir le surprend
  rationale: La proposition évoque le lieu où la tombée du soir rattrape l’homme. Cette tournure française naturelle conserve l’image temporelle sans la surinterpréter.
- source_word: ἀνθρώπῳ
  choice: un homme
  rationale: Le grec emploie ici un nom singulier dans une maxime. « Un homme » en reproduit la forme proverbiale et assure une transition naturelle après la comparaison.
theological_decisions: []
translation_notes:
  register: Français international actuel, digne et proverbial. La métaphore du nid et l’image instable du déplacement sont conservées; « bien équipé » évite d’ajouter explicitement des armes que le grec ne nomme pas.
