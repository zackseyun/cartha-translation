    issue: Sens potentiellement dévié de « Rends témoignage à »
    rationale: En français, cette expression peut suggérer que Dieu témoigne à propos de ses créatures ou en leur faveur. Le grec emploie explicitement « donne un témoignage » suivi d’un datif; « Accorde ton témoignage à » préserve mieux cette construction.
  - severity: low
    issue: Formulation légèrement lourde de « créatures des origines »
    rationale: « Dès l’origine » est plus naturel en français contemporain tout en gardant la portée temporelle de ἐν ἀρχῇ et sans préciser indûment l’identité des créatures.
