  text: Give testimony to your creatures from the beginning[b][a], and raise up the prophecies spoken in your name.
translation:
  language: fr
  text: Accorde ton témoignage à tes créatures dès l’origine[a], et réveille les prophéties prononcées en ton nom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à tes œuvres créées dès le commencement ». La formule grecque est condensée et peut désigner largement ce que Dieu a créé aux origines, sans se limiter aux êtres vivants.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « accomplis les prophéties prononcées en ton nom ». Le grec dit littéralement de les « réveiller » ou de les « faire lever », ce qui peut évoquer leur mise à exécution.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὸς μαρτύριον
  choice: Rends témoignage
  rationale: L’impératif δὸς, avec μαρτύριον, appelle littéralement à « donner un témoignage ». En français, « rendre témoignage » exprime naturellement cette idée tout en conservant sa portée attestatrice et révélatrice.
- source_word: τοῖς ἐν ἀρχῇ κτίσμασίν σου
  choice: à tes créatures des origines
  rationale: 'κτίσμα désigne ce qui a été créé, être ou chose. La formule grecque est condensée : ἐν ἀρχῇ caractérise vraisemblablement ces créatures comme appartenant aux origines. Cette traduction reste large et ne les identifie pas sans preuve au seul peuple d’Israël.'
- source_word: ἔγειρον
  choice: réveille
  rationale: Le verbe ἐγείρω signifie d’abord éveiller, relever ou faire lever. « Réveille » conserve ici la métaphore inhabituelle appliquée aux prophéties, sans la réduire d’emblée à leur accomplissement.
- source_word: προφητείας
  choice: les prophéties
  rationale: Le pluriel προφητείας désigne des prophéties ou paroles prophétiques. Le terme français direct convient au contexte.
- source_word: τὰς ἐπʼ ὀνόματί σου
  choice: prononcées en ton nom
  rationale: La tournure ἐπʼ ὀνόματί σου est idiomatique. « En ton nom » préserve l’idée d’autorité ou d’attribution divine, tandis que « prononcées » explicite sobrement la nature verbale des prophéties.
theological_decisions:
- issue: Identité des « créatures des origines »
  choice: Maintenir une référence générale aux êtres ou réalités créés dès les origines
  alternative: Y voir plus précisément l’ancien peuple ou les tribus constituées par Dieu
  rationale: Le grec κτίσμασιν favorise le sens général de réalités créées. Même si le contexte peut orienter vers le peuple de Dieu, le verset ne justifie pas à lui seul de restreindre ainsi la désignation.
- issue: Portée de « réveille les prophéties »
  choice: Conserver la métaphore d’une remise en vigueur des paroles prophétiques
  alternative: Traduire explicitement « accomplis les prophéties »
  rationale: L’objet du verbe est bien « les prophéties », non les prophètes. La métaphore peut évoquer leur accomplissement, leur confirmation ou leur retour à l’efficacité; la traduction ne tranche donc pas entre ces nuances.
translation_notes:
  register: Français international moderne, accessible et digne. Le tutoiement correspond à l’adresse directe à Dieu. « Des origines » évite une lourde proposition relative, tandis que « réveille les prophéties » préserve volontairement l’image et l’ambiguïté du grec.
