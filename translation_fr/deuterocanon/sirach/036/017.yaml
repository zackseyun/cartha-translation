  verdict: revise
  source_fidelity: La première proposition conserve le datif de τοῖς ... κτίσμασίν σου et la caractérisation temporelle ἐν ἀρχῇ. Toutefois, « rendre témoignage à » risque en français de signifier témoigner au sujet de quelqu’un ou en sa faveur, plutôt que donner/accorder un témoignage à quelqu’un. « Accorde ton témoignage à » rend plus nettement δὸς μαρτύριον. « Réveille les prophéties » traduit de manière sobre l’impératif ἔγειρον, sans imposer le sens plus interprétatif d’« accomplis ».
  naturalness: « Tes créatures des origines » est compréhensible, mais demeure plus raide que « tes créatures dès l’origine ». La révision conserve un français moderne et digne tout en maintenant la formulation condensée et quelque peu imagée du grec.
  terminology: « Créatures », « témoignage » et « prophéties » sont des équivalents justes et non confessionnels. « En ton nom » restitue naturellement ἐπʼ ὀνόματί σου; « prononcées » explicite avec retenue le rapport des prophéties à ce nom.
  issues:
