    rationale: « Alors » peut exprimer une conséquence, mais « ainsi » rend plus directement l’adverbe grec, qui relie le fait d’être écouté à la manière de préparer ses paroles.
  - severity: low
    issue: Dernière phrase de la note trop interprétative
    rationale: Dire que l’image concerne « ce que l’on a appris » ajoute une précision absente du grec. Il est préférable de limiter la note à « l’instruction » et à la possibilité d’organiser ou de réunir celle-ci.
