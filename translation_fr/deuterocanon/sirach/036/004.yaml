  text: Prepare your words[a], and then you will be heard; bind together instruction, and answer.
translation:
  language: fr
  text: Prépare tes paroles[a], et ainsi tu seras écouté ; rassemble ton enseignement et réponds.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Prépare une parole, ou un discours, et ainsi tu seras entendu ; lie ensemble l’instruction et réponds. » Le grec emploie le singulier pour « parole » ou « discours » et dit littéralement « lie ensemble l’instruction » ; cette image peut aussi évoquer le fait de rassembler ou d’organiser l’instruction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑτοίμασον
  choice: Prépare
  rationale: L’impératif aoriste de ἑτοιμάζω appelle une préparation délibérée. « Prépare » est direct, naturel et conserve la force impérative.
- source_word: λόγον
  choice: tes paroles
  rationale: λόγος est au singulier et peut désigner une parole, un discours, un propos ou une argumentation. Le pluriel idiomatique français « tes paroles » exprime ici ce que l’on s’apprête à dire, tandis qu’une note signale le singulier grec.
- source_word: οὕτως
  choice: alors
  rationale: L’adverbe peut exprimer la manière (« ainsi », « de cette façon ») ou la conséquence pratique. « Alors » rend naturellement le lien entre la préparation des propos et le fait d’être écouté.
- source_word: ἀκουσθήσῃ
  choice: tu seras écouté
  rationale: Le futur passif de ἀκούω signifie littéralement « tu seras entendu ». Dans ce contexte de conseil et de réponse, « tu seras écouté » rend plus clairement l’idée d’obtenir l’attention d’autrui tout en conservant la voix passive.
- source_word: σύνδησον
  choice: rassemble
  rationale: L’impératif de συνδέω signifie littéralement « lie ensemble ». Le français « rassemble » garde l’idée de réunir en un tout cohérent sans produire une image obscure ; la métaphore littérale est indiquée en note.
- source_word: παιδείαν
  choice: ton enseignement
  rationale: παιδεία peut désigner l’éducation, la formation, la discipline ou l’instruction. Ici, « enseignement » convient aux connaissances formatrices que le sage doit réunir avant de répondre.
- source_word: ἀποκρίθητι
  choice: réponds
  rationale: L’impératif aoriste moyen de ἀποκρίνομαι appelle une réponse directe. « Réponds » est précis et naturel en français moderne.
