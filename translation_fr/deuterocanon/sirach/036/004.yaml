  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : les trois impératifs, le futur passif et la progression préparation–audition–réponse sont conservés. Toutefois, οὕτως signifie plus directement « ainsi / de cette manière » que le temporel-consécutif « alors ». « Et ainsi » préserve mieux le lien explicite avec la préparation. Le pluriel idiomatique « tes paroles » reste acceptable, à condition que la note maintienne le singulier de λόγον.'
  naturalness: Le français est clair et d’un registre proverbial naturel. « Tu seras écouté » rend bien, dans ce contexte, le passif ἀκουσθήσῃ et l’idée d’obtenir une écoute. « Rassemble ton enseignement » est compréhensible, bien que la métaphore grecque de lier/assembler soit moins visible ; la note la conserve utilement.
  terminology: « Enseignement » est un choix possible pour παιδεία dans un contexte sapientiel, où le terme peut évoquer l’instruction ou la formation. Il ne faut pas lui imposer un sens doctrinal. La note doit éviter d’orienter la métaphore vers « ce que l’on a appris », interprétation possible mais non exprimée explicitement par le grec.
