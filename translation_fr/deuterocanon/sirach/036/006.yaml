  text: A horse for mounting is like a mocking friend; under anyone who sits on it[a], it neighs.
translation:
  language: fr
  text: 'Un cheval destiné à être monté est comme un ami moqueur : quel que soit celui qui s’assied sur lui[a], il hennit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec est ici concis et inhabituel. L’expression rendue par « destiné à être monté » peut, dans d’autres contextes, avoir un sens sexuel ; mais l’image de quelqu’un assis sur le cheval favorise ici le sens équestre.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵππος
  choice: cheval
  rationale: « Cheval » est le terme ordinaire et ne précise pas le sexe de l’animal, conformément au grec.
- source_word: εἰς ὀχείαν
  choice: destiné à être monté
  rationale: Dans ce contexte, la mention de quelqu’un assis sur le cheval favorise le sens équestre, tout en laissant signaler en note l’autre valeur possible du syntagme.
- source_word: ὡς φίλος μῶκος
  choice: comme un ami moqueur
  rationale: μῶκος évoque la moquerie ou celui qui se moque ; « ami moqueur » conserve l’image relationnelle et la nuance de dérision.
- source_word: ὑποκάτω παντὸς ἐπικαθημένου
  choice: quel que soit celui qui s’assied sur lui
  rationale: Cette formulation restitue la portée universelle de παντός et l’action de s’asseoir sur l’animal exprimée par ἐπικαθημένου.
- source_word: χρεμετίζει
  choice: il hennit
  rationale: « Hennir » est le verbe français courant et précis pour le cri du cheval.
