  text: The inward parts of a fool are like a cartwheel[a], and his thinking is like a turning axle.
translation:
  language: fr
  text: Les entrailles de l’insensé sont comme une roue de charrette[a], et sa pensée comme un essieu qui tourne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « les entrailles de l’insensé sont une roue de charrette ». Le grec emploie une image corporelle pour décrire son état intérieur.
    reason: lexical_alternative
lexical_decisions:
- source_word: τροχὸς ἁμάξης
  choice: une roue de charrette
  rationale: 'Expression concrète et naturelle qui rend directement l’image rurale du grec : τροχός désigne une roue, et ἁμάξης précise qu’il s’agit d’une charrette.'
- source_word: σπλάγχνα
  choice: les entrailles
  rationale: Le terme désigne littéralement les organes internes et, par extension, l’intériorité. « Entrailles » conserve ici l’image corporelle sans la réduire au cœur, aux sentiments ou au raisonnement.
- source_word: μωροῦ
  choice: de l’insensé
  rationale: « Insensé » appartient au vocabulaire français traditionnel de la littérature sapientielle tout en exprimant une déficience morale et intellectuelle, et non un simple manque d’intelligence.
- source_word: διαλογισμὸς
  choice: sa pensée
  rationale: Le singulier « pensée » rend naturellement l’activité intérieure évoquée, sans donner au terme le sens trop technique de « raisonnement ».
- source_word: ὡς ἄξων στρεφόμενος
  choice: comme un essieu qui tourne
  rationale: Cette formulation préserve l’essieu et le mouvement continu exprimé par le participe στρεφόμενος, tout en restant fluide en français moderne.
