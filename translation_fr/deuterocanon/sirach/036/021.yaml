translation:
  language: fr
  text: La gorge goûte les aliments provenant de la chasse[a] ; de même, un cœur avisé met à l’épreuve les paroles mensongères[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « le gibier » ou « les aliments tirés de la chasse ».'
    reason: alternative_reading
  - marker: b
    text: 'Le grec dit littéralement : « La gorge goûte les aliments de la chasse ; de même, un cœur avisé, les paroles mensongères. » La seconde proposition est elliptique ; « met à l’épreuve » est fourni en français pour expliciter la comparaison.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φάρυγξ
  choice: gorge
  rationale: Le nom désigne littéralement la gorge ou le gosier. « Gorge » conserve l’image corporelle sans introduire l’idée plus interprétative de palais.
- source_word: γεύεται
  choice: goûte
  rationale: Le verbe exprime l’action de goûter. Le choix maintient le parallèle sensoriel qui fonde la comparaison.
- source_word: βρώματα θήρας
  choice: les aliments provenant de la chasse
  rationale: βρώματα désigne des choses que l’on mange, tandis que le génitif θήρας les rattache à la chasse. Cette formulation reste naturelle et évite de réduire nécessairement le sens au seul gibier.
- source_word: καρδία συνετή
  choice: un cœur intelligent
  rationale: Dans la littérature sapientielle, le cœur est le siège de l’intelligence et du jugement. La traduction conserve cette anthropologie et rend συνετή sans substituer directement une fonction comme « discernement ».
- source_word: λόγους ψευδεῖς
  choice: les paroles mensongères
  rationale: L’expression désigne des paroles caractérisées par la fausseté. « Mensongères » est idiomatique en français et conserve la qualification morale du discours.
- source_word: '[verbe sous-entendu dans οὕτως καρδία συνετὴ λόγους ψευδεῖς]'
  choice: éprouve
  rationale: Le grec transmis ne comporte pas de verbe explicite dans la seconde proposition. « Éprouve » complète naturellement le parallèle en exprimant la mise à l’épreuve des paroles, sans simplement répéter l’acte physique de goûter.
theological_decisions:
- issue: Ellipse verbale dans la seconde proposition
  choice: Fournir « éprouve » dans le texte et signaler l’ellipse en note
  alternative: Répéter « goûte » ou laisser une phrase nominale abrupte
  rationale: La structure comparative exige en français un prédicat intelligible, mais le lecteur doit être averti que ce verbe n’est pas exprimé dans le grec.
translation_notes:
  register: Français international moderne, clair et digne. La tournure proverbiale et l’image corporelle du grec sont conservées. Les deux marqueurs de note figurent dans le texte principal.
