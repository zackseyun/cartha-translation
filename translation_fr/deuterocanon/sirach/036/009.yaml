  text: From them he exalted and sanctified[b][a], and from them he appointed a fixed number of days.
translation:
  language: fr
  text: Parmi eux, il en a élevé et sanctifié certains[a] ; parmi eux, il en a placé d’autres dans le décompte des jours[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il en a exalté et rendu saints certains ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans un nombre de jours ». La tournure grecque est elliptique ; elle évoque leur inscription dans le compte des jours, sans préciser davantage le statut de ces jours.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπ᾽ αὐτῶν / ἐξ αὐτῶν
  choice: Parmi eux… parmi eux
  rationale: Les deux groupes prépositionnels ont ici une valeur partitive. « Parmi eux » rend cette relation naturellement en français sans préciser dans le verset l’antécédent du pronom.
- source_word: ἀνύψωσεν
  choice: il en a élevé
  rationale: ἀνυψόω signifie « élever » ou « exalter ». « Élever » conserve l’image du grec et convient au rang particulier conféré à certains jours.
- source_word: ἡγίασεν
  choice: sanctifié
  rationale: ἁγιάζω signifie « rendre saint », « sanctifier » ou « consacrer ». « Sanctifier » garde le registre religieux du texte sans réduire le sens à une consécration strictement cultuelle.
- source_word: ἔθηκεν
  choice: il en a placé
  rationale: τίθημι signifie fondamentalement « placer, mettre, établir ». « Placer » respecte cette formulation concrète plutôt que d’introduire d’emblée l’idée interprétative d’une durée assignée.
- source_word: εἰς ἀριθμὸν ἡμερῶν
  choice: au nombre des jours
  rationale: Cette expression rend de près le grec, littéralement « dans un nombre de jours ». Dans ce contexte, elle peut opposer les jours distingués et sanctifiés aux jours comptés comme ordinaires, mais le texte grec ne l’explicite pas entièrement.
theological_decisions:
- issue: Sujet sous-entendu des verbes grecs
  choice: il
  alternative: Dieu / le Seigneur
  rationale: Le grec emploie des verbes à la troisième personne du singulier sans nommer ici leur sujet. Le pronom « il » conserve le renvoi au contexte et évite d’ajouter un nom ou un titre divin absent de la proposition.
- issue: Nature de la distinction entre les deux groupes
  choice: certains… d’autres
  alternative: répéter sans explicitation « parmi eux… parmi eux »
  rationale: La construction partitive répétée et le parallélisme indiquent naturellement deux groupes. Cette formulation française rend la distinction sans préciser davantage si le second groupe désigne explicitement des jours ordinaires.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe partitive est rendue explicitement pour rester naturelle. Le sujet implicite demeure un simple pronom, et l’expression finale reste proche du grec afin de ne pas résoudre abusivement son sens.
