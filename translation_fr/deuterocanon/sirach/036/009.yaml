  source_fidelity: 'La première proposition rend correctement ἀπ᾽ αὐτῶν, ἀνύψωσεν et ἡγίασεν. En revanche, « au nombre des jours » avec la note actuelle impose l’explication « jours ordinaires », qui ne figure pas explicitement dans le grec. εἰς ἀριθμὸν ἡμερῶν est une tournure elliptique et difficile : la traduction doit conserver son caractère de décompte/recensement sans en fixer le sens.'
