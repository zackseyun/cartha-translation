  - severity: low
    issue: « Au nombre des jours » est peu naturel et obscur en français contemporain.
    rationale: « Dans le décompte des jours » exprime plus clairement l’idée de compter ou d’inscrire dans un compte, sans ajouter une interprétation théologique ou calendaire précise.
