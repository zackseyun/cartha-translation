  text: Fill Zion with your praises[b][a], and your people with your glory.
translation:
  language: fr
  text: Remplis Sion de la célébration de tes grandeurs[a], et ton peuple de ta gloire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de tes louanges », « de la proclamation de tes hauts faits » ou « de tes perfections ». Le mot grec peut désigner la louange ou la célébration d’actes et de qualités dignes d’éloge.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « et ton peuple, à partir de ta gloire ». Le grec peut ici souligner que ce qui remplit le peuple provient de la gloire de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλῆσον
  choice: Remplis
  rationale: 'L’impératif aoriste exprime une demande directe : faire en sorte que Sion et le peuple soient remplis. « Remplis » conserve l’image concrète et convient naturellement à une prière.'
- source_word: Σιὼν
  choice: Sion
  rationale: Forme française biblique usuelle du nom propre.
- source_word: ἀρεταλογίας
  choice: de la proclamation de tes hauts faits
  rationale: Ce nom rare peut désigner la louange, l’éloge ou l’énumération d’actes et de qualités dignes d’éloge. La formulation retenue met en valeur l’idée de raconter publiquement les œuvres remarquables de Dieu, sans exclure la nuance de louange.
- source_word: ἀπὸ τῆς δόξης σου
  choice: de ta gloire
  rationale: Après « remplir », le français introduit naturellement par « de » ce dont quelqu’un est rempli. Le grec emploie ἀπό, qui marque littéralement la provenance; cette nuance est signalée en note.
- source_word: τὸν λαόν σου
  choice: ton peuple
  rationale: Rendu direct et idiomatique de l’accusatif accompagné du possessif.
theological_decisions:
- issue: Portée de ἀρεταλογίας dans la prière
  choice: « la proclamation de tes hauts faits »
  alternative: « tes louanges » ou « tes perfections »
  rationale: Le terme peut viser aussi bien la louange que le récit des qualités et des actes admirables de Dieu. Le texte principal conserve la dimension proclamatoire, tandis que la note maintient les autres possibilités sans imposer une lecture doctrinale.
- issue: Valeur de ἀπό dans ἀπὸ τῆς δόξης σου
  choice: « de ta gloire » comme contenu de l’action de remplir
  alternative: « de ce qui vient de ta gloire »
  rationale: La syntaxe grecque peut souligner la provenance. Une traduction strictement littérale serait maladroite en français; la note préserve donc cette nuance.
translation_notes:
  register: Français moderne, international et digne, avec tutoiement conforme à l’adresse directe à Dieu. La formulation reste concise et poétique, tout en explicitant dans les notes les deux difficultés lexicales du grec.
