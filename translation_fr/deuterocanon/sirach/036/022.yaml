translation:
  language: fr
  text: Un cœur tortueux[a] causera du chagrin, et un homme de grande expérience lui rendra la pareille[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « déformé » ou « pervers ».
    reason: lexical_alternative
  - marker: b
    text: 'Le grec peut aussi se comprendre plus généralement ainsi : « un homme de grande expérience lui répondra » ou « lui rendra en retour ». La nature exacte de cette réponse n’est pas précisée.'
    reason: alternative_reading
lexical_decisions:
- source_word: καρδία στρεβλή
  choice: un cœur tortueux
  rationale: « Cœur » conserve le siège biblique de la pensée et des dispositions intérieures ; « tortueux » exprime l’idée d’une orientation morale faussée sans la préciser davantage.
- source_word: δώσει λύπην
  choice: causera du chagrin
  rationale: Cette formulation française naturelle rend le futur grec et l’idée de produire peine ou affliction.
- source_word: ἄνθρωπος πολύπειρος
  choice: un homme de grande expérience
  rationale: « Homme » garde le singulier masculin proverbial du grec, tandis que « de grande expérience » restitue l’idée d’une personne éprouvée par de nombreuses expériences.
- source_word: ἀνταποδώσει αὐτῷ
  choice: le lui rendra
  rationale: La formulation conserve la réciprocité du verbe et le pronom personnel au datif. Le pronom « le » reprend naturellement le chagrin dans le contexte, sans préciser la forme exacte de la riposte.
theological_decisions:
- issue: Masculin générique de ἄνθρωπος dans une maxime de sagesse
  choice: un homme
  alternative: une personne
  rationale: Le grec emploie un singulier grammaticalement masculin ; la traduction le conserve sans transformer la maxime en énoncé explicitement inclusif.
- issue: Portée de ἀνταποδώσει
  choice: le lui rendra
  alternative: lui répondra / lui rendra la pareille
  rationale: Le grec indique une action rendue en retour sans en expliciter précisément le contenu ni la valeur morale. La traduction évite donc de décider s’il s’agit d’une réponse verbale, d’une rétribution ou d’une riposte.
- issue: Référent de αὐτῷ
  choice: lui, renvoyant implicitement à celui qui a le cœur tortueux
  alternative: à celui-ci / à un tel homme
  rationale: Le référent demeure syntaxiquement condensé en grec ; le pronom français maintient cette concision tout en suivant la lecture personnelle la plus naturelle.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure proverbiale reste concise ; « de grande expérience » est légèrement soutenu sans être archaïque.
