  text: A woman will accept any male[a], but one daughter is better than another.
translation:
  language: fr
  text: Une femme acceptera n’importe quel homme[a], mais une fille vaut mieux qu’une autre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Une épouse acceptera n’importe quel homme. » Le grec γυνή peut désigner une femme ou une épouse, tandis que ἄρρην désigne littéralement un être masculin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ἄρρενα
  choice: n’importe quel homme
  rationale: Avec le singulier, πάντα a ici une valeur distributive (« tout homme », « n’importe quel homme »). ἄρρην désigne proprement un être masculin; en français, « homme » est plus naturel et plus digne que « mâle » lorsqu’il s’agit d’une personne, sans imposer le sens marital de « mari ».
- source_word: ἐπιδέξεται
  choice: acceptera
  rationale: Le futur moyen exprime l’idée d’accueillir ou d’accepter. « Acceptera » convient au caractère proverbial de la phrase sans préciser davantage la nature de cette acceptation.
- source_word: γυνή
  choice: une femme
  rationale: γυνή peut signifier « femme » ou « épouse ». Le contexte ne rend pas le sens marital certain; « une femme » conserve donc l’ambiguïté autant que le permet le français, l’autre possibilité étant signalée en note.
- source_word: ἔστιν δὲ
  choice: mais
  rationale: La conjonction δέ introduit un contraste entre les deux propositions; « mais » le rend simplement et naturellement.
- source_word: θυγάτηρ θυγατρὸς
  choice: une fille ... qu’une autre
  rationale: Avec le comparatif κρεῖσσον, la répétition du nom exprime une comparaison entre deux membres de la même catégorie, et non une relation de filiation comme « fille d’une fille ».
- source_word: κρεῖσσον
  choice: vaut mieux
  rationale: Le comparatif signifie « est meilleure » ou « est supérieure ». « Vaut mieux » donne en français une formulation proverbiale naturelle tout en conservant le jugement comparatif du grec.
theological_decisions:
- issue: Cadre social et matrimonial du proverbe
  choice: Présenter l’énoncé comme une observation générale sur une femme et des filles, sans expliciter un scénario matrimonial.
  alternative: Traduire γυνή par « épouse » et interpréter l’ensemble explicitement en fonction du mariage.
  rationale: Le grec est bref et ne précise ni le contexte ni la portée morale de l’acceptation. La traduction conserve sa formulation genrée et sa tension sociale sans l’atténuer ni lui ajouter une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, sobre et proverbial. « N’importe quel homme » évite le caractère déshumanisant que pourrait prendre « n’importe quel mâle » en français courant, tandis que la note rend compte de la précision lexicale et de l’ambiguïté de γυνή.
