  text: Have mercy on the people, O Lord, who are called by your name, and on Israel, whom you likened to a firstborn son.
translation:
  language: fr
  text: Prends pitié du peuple, Seigneur, qui est appelé de ton nom, et d’Israël, que tu as rendu semblable à un premier-né.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dont tu as fait ton premier-né ». Cette formulation fait écho au thème biblique d’Israël comme premier-né de Dieu (voir Exode 4.22). Le grec dit plus littéralement : « que tu as rendu semblable à un premier-né ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλέησον
  choice: Prends pitié
  rationale: L’impératif aoriste exprime une supplication directe. « Prends pitié » est naturel, digne et conserve la force de la prière.
- source_word: λαόν
  choice: du peuple
  rationale: Le nom sans article peut avoir ici un sens défini. L’ajout de « ton » serait interprétatif, tandis que la proposition suivante identifie le peuple concerné.
- source_word: Κύριε
  choice: Seigneur
  rationale: Le vocatif grec est rendu par l’apostrophe française courante, sans « ô », qui donnerait un ton plus archaïque.
- source_word: κεκλημένον ἐπʼ ὀνόματί σου
  choice: de celui qui est appelé de ton nom
  rationale: Cette formulation conserve au plus près le parfait passif et l’expression grecque, avec leur idée de désignation et d’appartenance sous le nom de Dieu.
- source_word: Ἰσραήλ
  choice: Israël
  rationale: Transcription française usuelle du nom propre.
- source_word: ὡμοίωσας
  choice: tu as rendu semblable à
  rationale: Le verbe ὁμοιόω exprime ici une mise en ressemblance ou une comparaison; cette traduction évite de transformer la formule en déclaration directe d’identité.
- source_word: πρωτόγονον
  choice: un premier-né
  rationale: « Premier-né » rend directement l’adjectif substantivé sans ajouter « fils », absent du grec, tout en conservant la résonance familiale.
theological_decisions:
- issue: Le dernier membre affirme-t-il qu’Israël est le premier-né de Dieu, ou qu’il a été rendu semblable à un premier-né ?
  choice: « que tu as rendu semblable à un premier-né »
  alternative: « dont tu as fait ton premier-né »
  rationale: Le sens comparatif de ὁμοιόω doit être conservé dans le texte principal, sans harmonisation implicite avec Exode 4.22. La lecture plus forte est signalée en note.
translation_notes:
  register: Français international moderne, solennel mais non archaïque. La reprise « de celui » clarifie que le participe grec singulier qualifie « le peuple ». Le marqueur [a] est placé après la proposition qu’il explique.
