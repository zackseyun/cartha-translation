  text: Every food is eaten by the stomach[a], but one food is better than another.
translation:
  language: fr
  text: Le ventre mange de tout, mais certains aliments sont meilleurs que d’autres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶν βρῶμα
  choice: toute nourriture
  rationale: Cette formulation conserve la portée générale de πᾶν et le sens large de βρῶμα, « nourriture, aliment ».
- source_word: φάγεται κοιλία
  choice: l’estomac accepte
  rationale: Le grec présente l’estomac comme sujet du verbe « manger » dans une maxime générale. « Accepte » restitue naturellement en français l’idée qu’il reçoit et digère toute nourriture, sans donner à la phrase une valeur prédictive.
- source_word: ἔστιν δὲ
  choice: mais
  rationale: La conjonction marque le contraste entre la capacité générale de l’estomac et les différences de qualité entre les aliments.
- source_word: βρῶμα βρώματος κάλλιον
  choice: certains aliments sont meilleurs que d’autres
  rationale: Le comparatif grec signifie littéralement qu’un aliment est meilleur qu’un autre. Cette tournure française idiomatique en préserve la portée générale sans préciser selon quel critère ils sont meilleurs.
theological_decisions: []
translation_notes:
  register: Formulation proverbiale, concise et naturelle en français moderne international. « Accepte » évite l’expression peu idiomatique « l’estomac mange » tout en conservant la personnification légère et le sens digestif du grec.
