  yaml_path: translation/deuterocanon/sirach/036/027.yaml
  text: Where there is no fence[a], the property will be plundered; and where there is no wife[b], he will groan as he wanders.
translation:
  language: fr
  text: Là où il n’y a pas de clôture[a], le bien sera pillé ; et là où il n’y a pas d’épouse[b], il gémira en errant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « haie » ou « barrière ». Le terme grec désigne ce qui entoure et protège un bien.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec peut aussi se traduire par « femme ». Il dit littéralement : « et là où il n’y a pas de femme, il gémira en errant » ; le sujet masculin est implicite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φραγμός
  choice: clôture
  rationale: Le terme désigne une barrière ou une enceinte protectrice. « Clôture » conserve l’image d’un bien laissé sans protection, sans préciser indûment qu’il s’agit d’un mur.
- source_word: διαρπαγήσεται
  choice: sera pillé
  rationale: Le futur passif exprime le fait que le bien sera emporté ou dérobé de force par d’autres ; « sera pillé » restitue clairement cette vulnérabilité.
- source_word: κτῆμα
  choice: le bien
  rationale: κτῆμα désigne un bien ou une possession. « Le bien » convient au caractère proverbial et évite de limiter le sens à des objets mobiliers ou à un grand domaine.
- source_word: γυνή
  choice: épouse
  rationale: Dans ce contexte domestique, γυνή désigne le plus naturellement une épouse. Ce choix rend la relation conjugale explicite, tandis qu’une note signale le sens plus général possible du mot.
- source_word: στενάξει
  choice: il gémira
  rationale: « Gémira » conserve l’expression forte de détresse portée par στενάζω, mieux qu’un simple soupir.
- source_word: πλανώμενος
  choice: en errant
  rationale: Le participe décrit l’état qui accompagne le gémissement. « En errant » garde à la fois l’idée de déplacement sans stabilité et la construction concise du grec.
- source_word: οὗ οὐκ ἔστιν … καὶ οὗ οὐκ ἔστιν
  choice: Là où il n’y a pas… et là où il n’y a pas…
  rationale: Cette formulation préserve le parallélisme proverbial de la construction grecque répétée.
theological_decisions:
- issue: Sujet masculin implicite dans la seconde proposition
  choice: il gémira en errant
  alternative: un homme gémira en errant / on gémira en errant
  rationale: Le grec n’exprime aucun nom comme sujet de στενάξει, mais le contexte de l’absence d’une épouse implique un mari ou maître de maison. Le pronom « il » maintient cette implication sans ajouter explicitement « un homme » ni neutraliser le sens.
- issue: Sens conjugal de γυνή
  choice: épouse
  alternative: femme
  rationale: Le contexte porte sur la stabilité du foyer et favorise le sens conjugal. La note conserve néanmoins la portée lexicale plus large de γυνή.
translation_notes:
  register: Français moderne, sobre et proverbial. Le parallélisme du grec est conservé, avec un vocabulaire courant mais digne. Le point-virgule marque les deux membres étroitement liés du proverbe.
