  text: Hasten the end and attend to the appointed time[b][a], for who will tell you what you should do?
translation:
  language: fr
  text: Hâte la fin et tiens compte du moment fixé, car qui te dira ce que tu feras[a] ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ce que tu feras » ; selon le contexte, l’expression peut aussi signifier « ce que tu dois faire » ou « quoi faire ».'
    reason: lexical_alternative
  - marker: b
    text: 'La tradition grecque parallèle présente ici un texte très différent : « Parle, jeune homme, si l’on a besoin de toi ; à peine deux fois, si l’on t’interroge. » Elle semble refléter une autre forme textuelle plutôt qu’une traduction proche de l’hébreu conservé.'
    reason: textual_variant
lexical_decisions:
- source_word: החיש
  choice: Hâte
  rationale: Impératif du verbe חושׁ, exprimant l’urgence. « Hâte » conserve la formulation transitive, concise et quelque peu elliptique de l’hébreu.
- source_word: קץ
  choice: la fin
  rationale: קץ désigne couramment la fin ou le terme. L’article défini rend naturellement le groupe hébreu sans préciser de quelle fin il s’agit.
- source_word: ופקוד
  choice: et veille à
  rationale: 'פקד possède un champ sémantique étendu : s’occuper de, prendre en considération, visiter ou fixer. « Veille à » exprime ici une attention active sans imposer un sens technique.'
- source_word: מועד
  choice: au temps fixé
  rationale: מועד peut désigner un moment déterminé ou fixé. « Le temps fixé » préserve cette idée tout en restant naturel en français.
- source_word: כי
  choice: car
  rationale: La conjonction introduit la justification des impératifs précédents.
- source_word: מי יאמר לך
  choice: qui te dira
  rationale: Cette traduction suit directement le futur interrogatif hébreu et en conserve la force rhétorique.
- source_word: מה תעשה
  choice: ce que tu feras
  rationale: Rendu formel de l’hébreu, qui peut aussi prendre en contexte la valeur pratique de « ce que tu dois faire ». Le choix maintient l’ambiguïté entre action future et conduite à suivre.
theological_decisions:
- issue: Priorité du témoin hébreu malgré une tradition grecque divergente
  choice: Traduire le texte hébreu conservé et signaler la divergence grecque en note.
  alternative: 'Suivre le grec : « Parle, jeune homme, si l’on a besoin de toi ; à peine deux fois, si l’on t’interroge. »'
  rationale: Le témoin grec fourni ne constitue pas une traduction proche de l’hébreu, mais paraît représenter une autre forme textuelle ou un décalage dans l’alignement des versets. Puisque l’hébreu est ici disponible avec une confiance élevée, il demeure le texte principal.
translation_notes:
  register: Français moderne, sobre et proverbial. La formulation conserve la brièveté et l’ellipse du texte hébreu. « Hâte la fin » est volontairement inhabituel mais intelligible ; il évite d’ajouter un complément ou une interprétation absents de la source.
