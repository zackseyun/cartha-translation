  text: Renew a sign and repeat a wonder[a]; glorify the hand and strengthen the arm and the right hand.
translation:
  language: fr
  text: Renouvelle un signe et répète un prodige[a] ; rends glorieuse ta main, fortifie ton bras et ta main droite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec diffère considérablement : il évoque un sceau d’escarboucle sur un ornement d’or et une harmonie musicale lors d’un banquet de vin. Comme le texte hébreu est ici attesté avec une grande fiabilité, la traduction le suit et signale cet important écart textuel.'
    reason: textual_variant
lexical_decisions:
- source_word: חדש
  choice: Renouvelle
  rationale: L’impératif demande une manifestation renouvelée, sans préciser s’il s’agit d’un acte entièrement nouveau ou d’un retour des œuvres passées.
- source_word: אות
  choice: un signe
  rationale: « Signe » est l’équivalent biblique le plus direct et le plus transparent.
- source_word: ושנה
  choice: et répète
  rationale: Le verbe signifie ici « faire une seconde fois, répéter » et forme un parallélisme avec « renouvelle ».
- source_word: מופת
  choice: un prodige
  rationale: « Prodige » exprime une manifestation extraordinaire de la puissance divine et convient au registre biblique en français moderne.
- source_word: האדר
  choice: manifeste la majesté de
  rationale: Cette formulation rend la valeur causative de l’impératif et évite de suggérer que la main divine manquerait intrinsèquement de gloire.
- source_word: יד
  choice: ta main
  rationale: L’image corporelle de la puissance divine est conservée littéralement.
- source_word: ואמץ
  choice: fortifie
  rationale: Rend directement l’idée de rendre fort ou d’affermir.
- source_word: זרוע
  choice: ton bras
  rationale: Conserve la métaphore biblique de la puissance divine en action.
- source_word: וימין
  choice: et ta main droite
  rationale: Le substantif désigne précisément la main droite; l’expression demeure distincte de « bras » malgré leur proximité sémantique.
theological_decisions:
- issue: Langage anthropomorphique appliqué à la puissance divine
  choice: Conserver « main », « bras » et « main droite »
  alternative: Paraphraser par « puissance » ou « force »
  rationale: Le texte hébreu présente l’action divine au moyen d’images corporelles. Les conserver maintient la texture poétique et théologique sans réduire les images à une abstraction.
- issue: Écart important entre le témoin hébreu et le parallèle grec
  choice: Suivre le texte hébreu, dont le témoignage est ici direct et de haute confiance
  alternative: Traduire d’après les images grecques du sceau, de l’ornement d’or et de l’harmonie musicale
  rationale: Le parallèle grec présente un texte entièrement différent et ne peut servir à compléter ou à lisser l’hébreu attesté; la divergence est donc signalée en note.
- issue: Sens de האדר
  choice: « manifeste la majesté de »
  alternative: « glorifie » ou « rends majestueuse »
  rationale: La traduction choisie exprime une démonstration visible de majesté tout en évitant l’idée théologiquement plus déterminée que Dieu augmenterait la gloire intrinsèque de sa propre main.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme impératif et les images bibliques de la main, du bras et de la main droite sont préservés; « manifeste la majesté de » clarifie naturellement un hébreu concis sans en effacer la force.
