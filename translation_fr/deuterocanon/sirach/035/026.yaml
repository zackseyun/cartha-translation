translation:
  language: fr
  text: Qui fera confiance à une troupe armée[a] qui bondit de ville en ville ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec fourni pour ce verset donne un texte entièrement différent : « Comprenez que je n’ai pas peiné pour moi seul, mais pour tous ceux qui recherchent l’instruction. » Le texte principal suit donc ici le témoin hébreu.'
    reason: textual_variant
lexical_decisions:
- source_word: מי
  choice: Qui fera
  rationale: Le pronom interrogatif introduit une question rhétorique; le futur français convient à sa portée proverbiale.
- source_word: יאמין
  choice: fera confiance à
  rationale: Le hifil de אמן exprime ici le fait de mettre sa confiance en quelqu’un ou quelque chose, plutôt que de croire une affirmation.
- source_word: בגדוד צבא
  choice: à une troupe armée
  rationale: גדוד désigne une troupe ou une bande, tandis que צבא en précise le caractère militaire. « Troupe armée » restitue naturellement les deux éléments sans la lourdeur de « troupe d’une armée ».
- source_word: המדלג
  choice: qui bondit
  rationale: Le participe de דלג décrit littéralement un mouvement par bonds; « bondit » conserve cette image vive et l’idée d’un déplacement incessant.
- source_word: מעיר אל עיר
  choice: de ville en ville
  rationale: Expression française naturelle et concise pour un déplacement répété d’une ville à l’autre.
theological_decisions:
- issue: Divergence complète entre le témoin hébreu et le parallèle grec
  choice: Suivre le texte hébreu conservé dans le corps du verset et signaler la divergence grecque en note.
  alternative: 'Traduire le grec : « Comprenez que je n’ai pas peiné pour moi seul, mais pour tous ceux qui recherchent l’instruction. »'
  rationale: Le projet privilégie l’hébreu lorsqu’il est conservé. Les deux textes ne peuvent pas être harmonisés; la note maintient donc clairement l’incertitude textuelle.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique et l’image concrète du déplacement par bonds sont conservées; la formulation évite un calque lourd de la juxtaposition nominale hébraïque.
