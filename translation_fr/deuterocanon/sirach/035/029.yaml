  text: As long as you still live and have breath in you, do not give yourself over to any flesh.
translation:
  language: fr
  text: Tant que tu es encore en vie et que tu as du souffle en toi, ne te livre à aucun mortel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « ne te change pour aucun être de chair ». Le grec est condensé et peut évoquer le fait de céder aux humains ou de se placer sous leur pouvoir.'
    reason: Alternative lexicale préservant l’ambiguïté de ἀλλάξῃς et le sens littéral de σαρκί.
lexical_decisions:
- source_word: ἕως ἔτι ζῇς
  choice: Tant que tu es encore en vie
  rationale: La tournure exprime la durée qui se prolonge dans le temps présent. Cette formulation est naturelle en français et conserve l’insistance de ἔτι.
- source_word: πνοὴ ἐν σοί
  choice: tu as du souffle en toi
  rationale: πνοή désigne ici le souffle vital, en parallèle avec le fait d’être en vie. « Souffle » préserve cette image sans lui imposer le sens plus marqué d’« esprit ».
- source_word: μὴ ἀλλάξῃς σεαυτὸν
  choice: ne te livre
  rationale: Le sens premier d’ἀλλάσσω est « changer » ou « échanger », mais la construction avec le pronom réfléchi et le datif semble exprimer ici l’idée de se remettre au pouvoir d’autrui. « Ne te livre » rend cet avertissement avec concision tout en laissant l’ambiguïté lexicale signalée en note.
- source_word: πάσῃ σαρκί
  choice: à aucun mortel
  rationale: Littéralement « à toute chair » ou, dans cette construction négative, « à aucune chair ». Dans ce contexte sapientiel, « chair » désigne vraisemblablement l’être humain dans sa condition mortelle. « Aucun mortel » évite en français une lecture centrée sur le corps ou les désirs charnels, tout en conservant la portée générale.
theological_decisions:
- issue: Sens de σάρξ dans ce contexte sapientiel
  choice: l’être humain mortel
  alternative: la chair corporelle ou la nature pécheresse
  rationale: L’expression πάσῃ σαρκί désigne couramment les humains considérés dans leur fragilité. Le contexte ne justifie pas d’y importer le sens théologique de « nature pécheresse ».
- issue: Portée de μὴ ἀλλάξῃς σεαυτὸν πάσῃ σαρκί
  choice: avertissement à ne pas se livrer au pouvoir d’un mortel
  alternative: ne te change pour aucun être de chair
  rationale: Le grec est condensé et permet difficilement de déterminer avec certitude la nuance de « changer », « échanger » ou « céder ». Le texte principal exprime le sens éthique probable, tandis que la note conserve une traduction plus formelle.
translation_notes:
  register: Français moderne, sobre et sapientiel. Le tutoiement singulier reproduit l’adresse grecque. « Mortel » rend naturellement l’expression sémitisante « chair » sans suggérer les désirs corporels ni une doctrine de la nature pécheresse.
