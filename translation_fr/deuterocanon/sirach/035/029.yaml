  verdict: approve
  source_fidelity: Le texte rend correctement ἕως ἔτι ζῇς καὶ πνοὴ ἐν σοί par une durée de vie encore présente et le souffle vital. « Ne te livre à aucun mortel » exprime de manière fidèle le sens éthique vraisemblable de μὴ ἀλλάξῃς σεαυτόν πάσῃ σαρκί, sans prétendre supprimer l’ambiguïté de l’idiome grec. « Aucun mortel » rend bien σάρξ comme désignation des êtres humains mortels, non comme la chair corporelle ou une nature pécheresse.
  naturalness: Le français est moderne, clair et d’un registre sapientiel sobre. « Tant que tu es encore en vie » et « tu as du souffle en toi » sont fluides; le tutoiement correspond à la deuxième personne singulière grecque. « Ne te livre à aucun mortel » est idiomatique et direct.
  terminology: « Souffle » convient à πνοή et évite de surtraduire par « esprit ». « Mortel » transmet utilement la valeur humaine et fragile de σάρξ dans ce contexte. La note conserve à juste titre l’expression « être de chair » et l’alternative plus formelle, de sorte que le lecteur ne confonde pas l’interprétation contextuelle avec une certitude lexicale absolue.
