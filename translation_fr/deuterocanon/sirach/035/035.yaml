base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/035.yaml
  text: A yoke and a strap will bend the neck[a], and for a wicked servant there are racks and tortures.
translation:
  language: fr
  text: Un joug et une courroie feront plier la nuque ; pour l’esclave malfaisant[a], les chevalets et les tortures.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur domestique malfaisant ». Le grec peut désigner un serviteur de la maisonnée, mais le contexte de contrainte et de châtiment favorise ici « esclave ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ζυγός
  choice: joug
  rationale: L’image de la nuque que l’on fait plier impose ici le sens concret de « joug ».
- source_word: ἱμάς
  choice: courroie
  rationale: Le terme désigne une lanière ou courroie de cuir ; « courroie » est naturel en français et convient à l’image de la contrainte.
- source_word: κάμψουσιν
  choice: feront plier
  rationale: Le futur actif exprime l’action exercée sur la nuque ; cette tournure française conserve l’image physique et la valeur causative du contexte.
- source_word: τράχηλον
  choice: la nuque
  rationale: « Nuque » rend naturellement la partie du cou soumise au joug et à la courroie.
- source_word: οἰκέτῃ
  choice: esclave
  rationale: Le mot peut désigner un serviteur de maison, mais le contexte explicite de contrainte corporelle et de châtiment met au premier plan la condition servile.
- source_word: κακούργῳ
  choice: malfaisant
  rationale: L’adjectif qualifie l’esclave comme mauvais ou auteur de méfaits, sans restreindre indûment le sens à une condamnation pénale.
- source_word: στρέβλαι
  choice: chevalets
  rationale: Le pluriel désigne des instruments servant à tordre ou à torturer, notamment des chevalets ; le choix conserve l’image concrète.
- source_word: βάσανοι
  choice: tortures
  rationale: Dans ce contexte punitif, le terme désigne directement des tortures ou tourments physiques.
theological_decisions:
- issue: Statut servile exprimé par οἰκέτῃ
  choice: esclave
  alternative: serviteur domestique
  rationale: Le contexte coercitif rend saillante la condition non libre, tout en reconnaissant en note que le terme grec peut plus largement désigner un serviteur appartenant à la maisonnée.
translation_notes:
  register: Français moderne, sobre et digne. Le parallélisme des deux propositions est conservé, ainsi que la dureté explicite du vocabulaire punitif.
