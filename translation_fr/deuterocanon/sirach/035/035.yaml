  source_fidelity: 'Le texte rend fidèlement le grec : ζυγός et ἱμάς sont correctement compris comme des moyens matériels de contrainte, κάμψουσιν conserve le futur (« feront plier »), et τράχηλον est bien rendu par « la nuque ». La seconde proposition nominale du grec est préservée de façon naturelle : « pour l’esclave malfaisant, les chevalets et les tortures ». « Chevalets » rend de manière concrète στρέβλαι, tandis que « tortures » restitue βάσανοι sans euphémisme.'
  naturalness: Le français est moderne, concis et stylistiquement approprié à une maxime sapientielle. L’ellipse verbale après le point-virgule est recevable et reflète le parallélisme incisif du grec. « Courroie » et « feront plier la nuque » sont idiomatiques dans cette image de soumission.
  terminology: « Esclave » est justifié dans ce contexte explicitement coercitif et punitif, tout en évitant d’effacer la nuance domestique possible de οἰκέτης ; la note fournit cette alternative de façon claire. « Malfaisant » restitue convenablement κακούργος sans le réduire au seul sens juridique de « criminel ». Les termes punitifs demeurent explicites, conformément au texte source.
