  text: Where[a] there is listening[b], do not pour out speech, and do not show off wisdom[c] at the wrong time.
translation:
  language: fr
  text: Quand on t’écoute[a], ne te répands pas en paroles et ne joue pas au sage[b] à contretemps.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin hébreu fourni ne semble pas correspondre à Siracide 35.4. La traduction suit donc ici le parallèle grec, qui met en garde contre le fait de parler et de se donner des airs de sage à un moment inopportun. Le grec peut aussi se comprendre : « Là où il y a un auditoire ».'
    reason: textual_variant_and_lexical_alternative
  - marker: b
    text: 'Ou : « ne fais pas étalage de sagesse à contretemps ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: Là où
  rationale: Rend directement la valeur locative de l’adverbe grec et introduit naturellement la circonstance en français.
- source_word: ἀκρόαμα
  choice: l’on écoute
  rationale: Le nom grec peut désigner l’écoute ou un auditoire. Cette formulation préserve le sens d’écoute sans imposer l’idée d’un public constitué.
- source_word: μὴ ἐκχέῃς
  choice: ne déverse pas
  rationale: Conserve l’image concrète du verbe grec « verser, répandre ».
- source_word: λαλιάν
  choice: un flot de paroles
  rationale: « Paroles » rend le contenu verbal, tandis que « flot » permet à l’image de « déverser » de rester idiomatique en français.
- source_word: ἀκαίρως
  choice: à contretemps
  rationale: Expression française actuelle et concise pour une action faite au mauvais moment.
- source_word: μὴ σοφίζου
  choice: ne fais pas étalage de sagesse
  rationale: Rend la nuance de se donner des airs de sage ou d’exhiber sa sagesse, plutôt que la simple interdiction d’être sage.
theological_decisions:
- issue: Choix de la source principale pour ce verset
  choice: Traduire le parallèle grec, qui correspond au contenu de Siracide 35.4.
  alternative: 'Traduire le témoin hébreu fourni : « Ils sauront, comme nous l’avons su, qu’il n’y a pas de Dieu en dehors de toi. »'
  rationale: Le texte hébreu fourni ne correspond manifestement pas au verset grec identifié comme Siracide 35.4 et semble provenir d’un autre contexte. Le grec constitue donc ici la seule base cohérente, et cette difficulté textuelle est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La métaphore grecque de l’effusion est conservée sous la forme idiomatique « déverser un flot de paroles » ; « à contretemps » maintient la concision sapientielle.
