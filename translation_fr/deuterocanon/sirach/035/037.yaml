  text: For idleness has taught much evil[a].
translation:
  language: fr
  text: Car l’oisiveté a enseigné beaucoup de mal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Car la paresse a enseigné beaucoup de mal. » Le grec ἀργία peut désigner l’oisiveté, la paresse ou l’inactivité; « oisiveté » a été retenu pour exprimer le plus largement l’état décrit.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὴν
  choice: beaucoup de
  rationale: Avec le nom abstrait singulier κακίαν, πολλήν exprime ici une grande quantité ou étendue; « beaucoup de mal » est naturel en français.
- source_word: γὰρ
  choice: car
  rationale: γάρ introduit une explication ou un fondement; « car » en conserve clairement la valeur logique.
- source_word: κακίαν
  choice: mal
  rationale: κακία peut désigner largement le mal, la méchanceté ou le vice. « Mal » préserve ici la portée morale générale sans la restreindre à la malveillance.
- source_word: ἐδίδαξεν
  choice: a enseigné
  rationale: Le verbe signifie explicitement « enseigner ». Le passé composé convient à cette constatation proverbiale dont la portée demeure actuelle.
- source_word: ἡ ἀργία
  choice: l’oisiveté
  rationale: ἀργία désigne le fait d’être sans activité ou sans travail, parfois par paresse. « Oisiveté » rend largement cet état et convient au registre sapientiel.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et proverbial. La métaphore selon laquelle l’oisiveté « enseigne » le mal est conservée, ainsi que le lien explicatif introduit par γάρ.
