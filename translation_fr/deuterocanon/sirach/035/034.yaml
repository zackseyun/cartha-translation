  text: Put a child to work[a], and you will find rest; leave his hands idle, and he will seek freedom.
translation:
  language: fr
  text: Fais travailler un enfant[a], et tu trouveras du repos ; laisse-lui les mains libres, et il cherchera la liberté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, le grec dit de façon très concise : « Travaille avec un enfant … relâche-lui les mains. » La première expression est difficile et peut évoquer le fait de garder l’enfant occupé par le travail ; παιδί peut aussi, selon le contexte, désigner un jeune serviteur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔργασαι ἐν παιδί
  choice: Mets un enfant au travail
  rationale: La tournure grecque est concise et inhabituelle, littéralement proche de « travaille avec un enfant ». Dans ce proverbe, elle paraît signifier qu’il faut occuper l’enfant par le travail. Cette formulation française est naturelle tout en conservant l’impératif.
- source_word: εὑρήσεις ἀνάπαυσιν
  choice: tu trouveras du repos
  rationale: ἀνάπαυσις désigne le repos ou le soulagement. « Trouver du repos » restitue directement la conséquence proverbiale.
- source_word: ἄνες χεῖρας αὐτῷ
  choice: laisse-lui les mains libres
  rationale: L’expression signifie littéralement relâcher ou libérer les mains de quelqu’un. La traduction conserve l’image concrète et suggère, sans l’imposer, l’absence d’occupation ou de contrainte.
- source_word: ζητήσει ἐλευθερίαν
  choice: il cherchera la liberté
  rationale: ἐλευθερία signifie directement « liberté ». Ce choix préserve la force et l’ambiguïté du terme sans le réduire à la licence ou à l’indiscipline.
theological_decisions:
- issue: Portée sociale de παιδί et de ἐλευθερία dans ce proverbe domestique
  choice: Traduire παιδί par « enfant » et ἐλευθερία par « liberté », sans atténuer ni accentuer la hiérarchie exprimée.
  alternative: Traduire παιδί par « jeune serviteur » et ἐλευθερία par « indépendance » ou « licence ».
  rationale: παιδί peut désigner un enfant, voire un jeune serviteur selon le contexte, mais « enfant » en est le sens le plus direct ici. Le mot ἐλευθερία doit garder son sens lexical et sa tension dans un contexte où la liberté est présentée comme ce que recherche celui dont les mains ont été relâchées.
translation_notes:
  register: Français international moderne, proverbial et digne. Le parallélisme des deux impératifs et des deux conséquences futures est conservé, ainsi que l’image des mains et la répétition implicite de l’idée de liberté.
