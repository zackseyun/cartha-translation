  text: And again[a], if there is healing for the tongue[b], it is not among human beings.
translation:
  language: fr
  text: Celui qui met sa confiance dans la Loi[a] prête attention aux commandements, et celui qui met sa confiance dans le Seigneur ne sera pas amoindri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La ligne hébraïque conservée dans le témoin fourni semble déplacée ou altérée à ce verset. La traduction suit donc le texte grec parallèle, qui offre ici une lecture cohérente.
    reason: textual_variant
  - marker: b
    text: 'Ou : « ne sera pas abaissé » ; selon une interprétation plus libre : « ne manquera de rien ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύων
  choice: celui qui met sa confiance
  rationale: Cette formulation exprime naturellement en français la confiance et l’appui impliqués par πιστεύω, sans réduire le terme à une simple adhésion intellectuelle.
- source_word: νόμῳ
  choice: dans la Loi
  rationale: Dans le contexte juif du Siracide, νόμος désigne la Torah, d’où la majuscule conventionnelle en français.
- source_word: προσέχει
  choice: prête attention
  rationale: Le choix conserve l’idée d’attention exprimée par προσέχω sans la renforcer indûment en « obéit » ou « observe ».
- source_word: ἐντολαῖς
  choice: aux commandements
  rationale: Rendu usuel, clair et adapté au registre religieux et éthique du passage.
- source_word: Κυρίῳ
  choice: dans le Seigneur
  rationale: « Le Seigneur » est le rendu français habituel de κύριος lorsqu’il désigne Dieu.
- source_word: οὐκ ἐλαττωθήσεται
  choice: ne sera pas amoindri
  rationale: Le passif futur est rendu directement tout en conservant l’ambiguïté entre diminution de condition, abaissement et manque.
theological_decisions:
- issue: Le texte hébreu fourni ne correspond pas matériellement au parallèle grec de Siracide 35.24.
  choice: Traduire le parallèle grec cohérent et signaler l’écart textuel en note.
  alternative: 'Traduire littéralement la ligne hébraïque transmise : « Et encore, s’il existe un remède pour la langue, il n’est pas parmi les êtres humains. »'
  rationale: La ligne hébraïque est signalée comme discordante ou corrompue à cet endroit, tandis que le grec transmet une sentence cohérente sous cette référence. La note rend l’incertitude documentaire explicite au lieu de la masquer.
- issue: Portée de οὐκ ἐλαττωθήσεται.
  choice: ne sera pas amoindri
  alternative: ne sera pas abaissé ; ne manquera de rien
  rationale: « Amoindri » reste proche du sens lexical et évite de préciser si la conséquence concerne le rang, les ressources ou la condition générale.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « met sa confiance » reproduit le parallélisme grec. « La Loi » désigne ici la Torah.
