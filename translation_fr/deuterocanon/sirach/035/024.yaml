  source_fidelity: 'La traduction suit fidèlement le parallèle grec fourni (ὁ πιστεύων νόμῳ… οὐκ ἐλαττωθήσεται) : confiance dans la Loi, attention aux commandements et absence d’amoindrissement. Elle ne tente pas d’harmoniser artificiellement la ligne hébraïque matériellement discordante, et la note signale honnêtement ce choix textuel.'
