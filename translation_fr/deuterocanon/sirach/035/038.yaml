base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/038.yaml
  text: Assign him work as is fitting for him; and if he does not obey[a], make his fetters heavy. But do not be excessive with any flesh, and do nothing without judgment.
translation:
  language: fr
  text: Assigne-lui des travaux qui lui conviennent ; et s’il n’obéit pas, alourdis ses entraves. Mais ne dépasse pas la mesure envers qui que ce soit[a], et ne fais rien sans jugement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « envers toute chair », c’est-à-dire envers tout être humain.'
    reason: L’expression grecque concrète ἐν πάσῃ σαρκί est rendue idiomatiquement dans le texte.
lexical_decisions:
- source_word: εἰς ἔργα κατάστησον
  choice: Assigne-lui des travaux
  rationale: La tournure exprime le fait d’établir quelqu’un dans des tâches. Cette formulation conserve la force directive tout en restant naturelle en français.
- source_word: καθὼς πρέπει αὐτῷ
  choice: qui lui conviennent
  rationale: πρέπει désigne ce qui convient ou est approprié ; la relative française se rattache naturellement aux travaux.
- source_word: πειθαρχῇ
  choice: n’obéit pas
  rationale: Le verbe exprime l’obéissance à une autorité. Le grec ne comporte pas de nom explicite correspondant à « discipline ».
- source_word: βάρυνον τὰς πέδας αὐτοῦ
  choice: alourdis ses entraves
  rationale: La traduction garde l’image concrète d’entraves rendues plus lourdes sans préciser davantage leur forme.
- source_word: μὴ περισσεύσῃς
  choice: ne dépasse pas la mesure
  rationale: Dans cette exhortation, περισσεύω met en garde contre le fait d’aller au-delà de la juste mesure ; cette expression est plus idiomatique que « ne sois pas excessif ».
- source_word: ἐν πάσῃ σαρκί
  choice: envers qui que ce soit
  rationale: Sous la négation, l’expression grecque désigne tout être humain. Le sens idiomatique figure dans le texte, tandis que l’image littérale de la chair est conservée en note.
- source_word: ἄνευ κρίσεως
  choice: sans jugement
  rationale: κρίσις peut évoquer le jugement, la décision réfléchie ou le discernement. « Jugement » maintient cette amplitude sémantique.
- source_word: μὴ ποιήσῃς μηδέν
  choice: ne fais rien
  rationale: La double négation grecque forme ici une interdiction générale, rendue directement en français.
theological_decisions:
- issue: Sens de σάρξ dans une exhortation sapientielle
  choice: qui que ce soit, avec une note donnant l’image littérale
  alternative: toute chair
  rationale: Dans ce contexte, σάρξ désigne les personnes en général. « Toute chair » préserverait la forme concrète, mais serait peu naturelle après « envers » en français moderne ; la note maintient néanmoins l’expression grecque sans imposer une interprétation doctrinale.
- issue: Portée de κρίσις
  choice: jugement
  alternative: discernement ; décision équitable
  rationale: Le contexte peut viser à la fois l’examen prudent et l’équité. Le terme français « jugement » préserve cette tension plutôt que de choisir un seul aspect.
translation_notes:
  register: Français international moderne, direct et digne. Le parallélisme des impératifs et la sévérité concrète de l’exhortation sont conservés, sans archaïsmes inutiles.
