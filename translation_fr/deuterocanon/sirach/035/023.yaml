  text: A woman’s beauty brightens the face[a], and it surpasses every delight of the eye.
translation:
  language: fr
  text: La beauté d’une femme illumine le visage[a] et surpasse tout ce que l’œil désire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente une lecture très différente : « En toute action, aie confiance en toi-même, car cela aussi, c’est observer les commandements. »'
    reason: alternative_reading
lexical_decisions:
- source_word: תאר
  choice: beauté
  rationale: Le nom désigne la forme ou la belle apparence. Avec « femme » et l’effet produit sur le regard, « beauté » rend naturellement le sens sans le réduire à la seule silhouette.
- source_word: יחליץ פנים
  choice: illumine le visage
  rationale: L’expression hébraïque est difficile, mais semble décrire un effet positif et visible sur le visage. « Illumine le visage » conserve cette image dans un français naturel.
- source_word: מחמד עין
  choice: ce qui charme le regard
  rationale: L’expression désigne littéralement ce qui est désirable ou précieux pour l’œil. Cette formulation garde à la fois l’attrait visuel et l’idée de plaisir.
- source_word: יגבר
  choice: surpasse
  rationale: Le verbe signifie être fort ou l’emporter. Dans cette comparaison poétique, « surpasse » exprime clairement la supériorité.
theological_decisions:
- issue: Divergence entre le texte hébreu conservé et le parallèle grec
  choice: Traduire le texte hébreu dans le corps du verset et signaler en note la lecture grecque entièrement différente.
  alternative: 'Suivre le grec : « Dans toute œuvre, fie-toi à ton âme, car cela aussi, c’est observer les commandements. »'
  rationale: Puisque l’hébreu est conservé avec une confiance élevée, il constitue ici le témoin principal. La divergence grecque étant substantielle et porteuse d’un sens tout différent, elle doit être conservée explicitement en note.
translation_notes:
  register: Français moderne, international et digne. La tournure poétique reste accessible; « illumine le visage » rend prudemment un idiome hébreu difficile sans effacer son caractère imagé.
