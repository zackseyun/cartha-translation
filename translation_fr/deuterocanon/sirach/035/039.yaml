  yaml_path: translation/deuterocanon/sirach/035/039.yaml
  text: The prayer of the humble has passed through the clouds[a], and until it draws near, it will not be comforted[b];
translation:
  language: fr
  text: La prière de l’humble a traversé les nuages[a] et, jusqu’à ce qu’elle s’approche, elle ne sera pas consolée[b] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a percé les nuages» ; l’image grecque présente la prière de l’humble montant sans obstacle.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec est légèrement ambigu : les verbes peuvent continuer à désigner la prière personnifiée, ou le sens peut passer à la personne humble qui prie et attend d’être consolée.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσευχὴ
  choice: prière
  rationale: Terme français courant et naturel pour une parole adressée à Dieu.
- source_word: ταπεινοῦ
  choice: de l’humble
  rationale: Le génitif substantivé désigne une personne humble ou de condition modeste; «de l’humble» conserve la nuance spirituelle sans la réduire à la seule détresse sociale.
- source_word: νεφέλας διῆλθεν
  choice: a traversé les nuages
  rationale: Rend directement l’aoriste et l’image d’une prière qui monte sans obstacle; «a percé les nuages» serait possible, mais plus appuyé.
- source_word: ἕως συνεγγίσῃ
  choice: jusqu’à ce qu’elle s’approche
  rationale: Le sujet grammatical le plus immédiat est «la prière»; le verbe exprime l’approche sans préciser explicitement le terme vers lequel elle s’avance.
- source_word: οὐ μὴ παρακληθῇ
  choice: elle ne sera pas consolée
  rationale: Le passif de παρακαλέω signifie naturellement «être consolé». Le féminin reprend «la prière» et maintient sa personnification, tout en signalant en note l’ambiguïté possible du référent.
theological_decisions:
- issue: Référent des verbes dans le second membre
  choice: La prière est le sujet de «s’approche» et de «sera consolée».
  alternative: La prière s’approche, tandis que la personne humble ne reçoit pas de consolation; ou bien la personne humble est le sujet implicite des deux verbes.
  rationale: Le grec n’exprime pas de nouveau sujet et permet de poursuivre la personnification de «la prière», féminin singulier. Cependant, le sens peut naturellement glisser vers la personne qui prie; la note préserve cette ambiguïté au lieu de la trancher silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le mouvement poétique et la personnification du grec; le point-virgule respecte le caractère fragmentaire du verset dans son contexte.
