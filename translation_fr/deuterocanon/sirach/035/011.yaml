  text: Have mercy on the city of your sanctuary[a], Jerusalem[b], the place established for your dwelling.
translation:
  language: fr
  text: Prends pitié de la cité de ta sainteté[a], Jérusalem[b], le lieu établi pour ta demeure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la cité de ta sainteté ». L’expression peut aussi se comprendre comme « ta ville sainte » ou, de manière plus interprétative, « la cité de ton sanctuaire ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le parallèle grec fourni diffère fortement : il exhorte plutôt à se lever sans tarder et à rentrer chez soi sans paresse. Comme le texte hébreu de ce verset est conservé, il est suivi ici, tandis que le grec est signalé comme variante textuelle.'
    reason: textual_variant
lexical_decisions:
- source_word: רחם
  choice: Prends pitié
  rationale: L’impératif exprime un appel direct à la compassion. « Prends pitié » est naturel en français, tout en conservant le ton de prière.
- source_word: קרית
  choice: cité
  rationale: Le terme désigne une ville. « Cité » convient ici au registre poétique et solennel appliqué à Jérusalem.
- source_word: קדשך
  choice: ta sainteté
  rationale: Le mot signifie littéralement « ta sainteté » ou peut désigner ce qui est saint pour Dieu. Le maintien du complément abstrait préserve la formulation condensée et son ambiguïté.
- source_word: ירושלים
  choice: Jérusalem
  rationale: Forme française usuelle du nom propre.
- source_word: מכון
  choice: lieu établi
  rationale: Le nom évoque un lieu fixé, affermi ou établi. Cette traduction conserve cette nuance sans la confondre avec la demeure elle-même.
- source_word: שבתך
  choice: ta demeure
  rationale: Dans ce contexte, le terme renvoie au fait d’habiter ou de demeurer. « Ta demeure » est clair, digne et adapté au langage de la prière.
theological_decisions:
- issue: Interprétation de l’expression קדשך
  choice: la cité de ta sainteté
  alternative: ta ville sainte ; la cité de ton sanctuaire
  rationale: La formulation retenue suit de près le génitif hébreu et évite de décider si la sainteté qualifie directement Jérusalem ou renvoie plus précisément au sanctuaire de Dieu.
- issue: Rapport entre le texte hébreu et le parallèle grec
  choice: Traduire le texte hébreu comme une prière en faveur de Jérusalem et signaler la divergence grecque.
  alternative: Suivre le parallèle grec ou harmoniser les deux témoins.
  rationale: Puisque l’hébreu est conservé ici, il sert de texte principal. Le grec fourni présente un contenu entièrement différent et doit donc être signalé comme variante plutôt qu’intégré au verset.
translation_notes:
  register: Français international moderne, dans un registre de prière sobre et solennel. « Cité » garde une élévation poétique sans archaïsme marqué ; la tournure inhabituelle « cité de ta sainteté » est maintenue afin de préserver l’ambiguïté réelle de l’hébreu, avec éclaircissement en note.
