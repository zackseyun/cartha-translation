  yaml_path: translation/deuterocanon/sirach/035/032.yaml
  text: On the day the days of your life are completed[a], and at the time of your death, distribute your inheritance.
translation:
  language: fr
  text: Au jour où les jours de ta vie arriveront à leur terme[a], et à l’heure de ta mort, répartis ton héritage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la fin de ta vie » ; le grec parle littéralement de l’achèvement des jours de ta vie.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἡμέρᾳ
  choice: Au jour où
  rationale: Cette tournure temporelle naturelle en français conserve la référence à un moment précis et permet d’intégrer correctement le génitif qui suit.
- source_word: συντελείας ἡμερῶν ζωῆς σου
  choice: où les jours de ta vie arriveront à leur terme
  rationale: Le grec parle littéralement du jour de l’achèvement des jours de la vie. La formulation française maintient la répétition de « jour/jours » et l’idée d’accomplissement sans devenir obscure.
- source_word: ἐν καιρῷ τελευτῆς
  choice: à l’heure de ta mort
  rationale: Dans ce contexte de transmission d’un héritage, τελευτή désigne naturellement la mort. « À l’heure de » rend l’indication temporelle de manière actuelle et digne.
- source_word: διάδος
  choice: répartis
  rationale: L’impératif aoriste demande de distribuer ou d’attribuer les biens; « répartis » convient précisément au partage d’un héritage.
- source_word: κληρονομίαν
  choice: ton héritage
  rationale: Le nom désigne les biens transmis en héritage. Le possessif, implicite dans le contexte, donne en français une formulation claire et naturelle sans modifier le référent.
theological_decisions:
- issue: Faut-il rendre τελευτή par « fin » ou explicitement par « mort » ?
  choice: mort
  alternative: fin
  rationale: Bien que le mot puisse désigner une fin, le contexte de la répartition de l’héritage indique la mort. Cette traduction conserve la force concrète du conseil sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier correspond aux formes grecques et au registre sapientiel. La répétition « jour… jours » est conservée parce qu’elle appartient à l’expression de la source.
