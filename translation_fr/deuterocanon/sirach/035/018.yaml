  text: Any food is shut up in the belly[b][a], but one food is more pleasant than another.
translation:
  language: fr
  text: Tout aliment est enfermé dans le ventre,[a] mais un aliment est plus agréable qu’un autre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le parallèle grec conservé à cet endroit diffère considérablement du texte hébreu et semble représenter une autre ligne textuelle ; la traduction suit ici le témoin hébreu.
    reason: textual_variant
  - marker: b
    text: 'L’hébreu est condensé : littéralement, « il y a un aliment qui est agréable parmi les aliments ». Le sens est comparatif : un aliment est plus agréable qu’un autre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כל מאכל
  choice: Toute nourriture
  rationale: כל devant un nom singulier exprime ici une totalité générale; « toute nourriture » demeure proche de l’hébreu et naturel en français.
- source_word: תסגר
  choice: est enfermée
  rationale: La forme exprime l’idée passive d’être enfermé ou contenu; cette traduction conserve l’image concrète de l’hébreu.
- source_word: בבטן
  choice: dans le ventre
  rationale: Dans le contexte alimentaire, בטן désigne le ventre; ce terme garde le caractère concret du texte sans adopter le registre plus clinique d’« estomac ».
- source_word: אך
  choice: mais
  rationale: La conjonction marque le contraste entre le sort commun de toute nourriture et les différences d’agrément.
- source_word: יש מאכל ממאכל
  choice: telle nourriture… que telle autre
  rationale: La formulation hébraïque est condensée et porte une comparaison entre aliments; cette tournure française l’explicite sans ajouter de catégorie absente du texte.
- source_word: תנעם
  choice: est plus agréable
  rationale: Le verbe issu de נעם évoque ce qui est agréable ou plaisant; le comparatif est indiqué par la construction avec מן, sans restreindre le sens à la douceur.
theological_decisions:
- issue: Divergence entre le texte hébreu et le parallèle grec
  choice: Suivre le témoin hébreu fourni
  alternative: Traduire le texte grec, qui parle de l’homme de conseil, de l’étranger et de l’orgueilleux
  rationale: Le témoin hébreu est désigné comme source originale principale avec un niveau de confiance élevé, tandis que le grec présente ici une ligne substantiellement différente.
translation_notes:
  register: Français international moderne, simple et digne. « Ventre » conserve l’image concrète de l’hébreu; « telle… telle autre » rend naturellement sa comparaison elliptique.
