  text: So is the man who has no nest[b][a], resting wherever evening overtakes him.
translation:
  language: fr
  text: 'Ainsi en est-il de l’homme qui n’a pas de nid[b][a] : il se repose lorsque le soir tombe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu est très concis et peut être incertain. La tradition grecque présente ici un texte entièrement différent.
    reason: textual_variant
  - marker: b
    text: Ou « qui n’a pas de foyer ». L’hébreu dit littéralement « qui n’a pas de nid », image d’un être sans lieu fixe où s’établir.
    reason: lexical_alternative
lexical_decisions:
- source_word: כן
  choice: Ainsi en est-il
  rationale: Introduit une comparaison avec ce qui précède et restitue naturellement en français la valeur analogique de l’hébreu.
- source_word: איש
  choice: l’homme
  rationale: Conserve le singulier masculin du texte hébreu, où il s’agit d’un individu représentatif.
- source_word: אשר לא קן
  choice: qui n’a pas de nid
  rationale: קן signifie littéralement « nid ». Garder cette image est plus transparent que de la remplacer directement par « foyer » ou « demeure ».
- source_word: המרגיע
  choice: il se repose
  rationale: Rend simplement l’idée de repos ou d’apaisement portée par le participe, sans trancher excessivement l’analyse d’une forme située dans une ligne textuellement difficile.
- source_word: כאשר יערב
  choice: là où le soir le surprend
  rationale: Cette formulation française exprime l’arrivée du soir comme la circonstance qui détermine le lieu de repos de l’homme sans demeure fixe, tout en conservant la concision imagée de la ligne.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et proverbial. L’image concrète du « nid » est conservée, tandis que « là où le soir le surprend » explicite avec mesure l’absence de lieu de repos fixe.
