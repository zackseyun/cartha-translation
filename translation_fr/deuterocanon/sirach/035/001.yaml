  text: If they made you a leader, do not exalt yourself; be among them as one of them.[a]
translation:
  language: fr
  text: T’a-t-on établi comme chef ? Ne t’élève pas ; sois parmi eux comme l’un d’eux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin hébreu fourni pour cette référence porte : « Sauve-nous, Dieu de tous, et élève ta crainte sur toutes les nations. » Comme ce texte ne correspond pas au verset grec rattaché à Siracide 35.1, la traduction principale suit ici le grec et signale ouvertement cette divergence.'
    reason: textual_variant
lexical_decisions:
- source_word: Ἡγούμενόν
  choice: comme chef
  rationale: Le participe désigne une personne qui dirige ou exerce une responsabilité. « Chef » est ici naturel sans imposer une fonction politique précise.
- source_word: κατέστησαν
  choice: T’a-t-on établi
  rationale: Le verbe exprime l’établissement ou la nomination dans une fonction. La tournure interrogative française rend la question grecque tout en laissant les auteurs de la nomination indéterminés.
- source_word: μὴ ἐπαίρου
  choice: Ne t’élève pas
  rationale: Cette formulation conserve l’image grecque de l’élévation de soi et sa portée morale, sans la réduire au seul sentiment d’orgueil.
- source_word: γίνου
  choice: sois
  rationale: Dans cette exhortation, l’impératif « sois » exprime directement la conduite demandée.
- source_word: ὡς εἷς ἐξ αὐτῶν
  choice: comme l’un d’eux
  rationale: La formule préserve l’appel à l’humilité et à la solidarité avec les autres membres du groupe.
theological_decisions:
- issue: Choix du texte source en présence d’une divergence totale entre l’hébreu fourni et le grec
  choice: Traduire dans le texte principal le parallèle grec, qui forme un verset cohérent à cette référence, et signaler explicitement la leçon hébraïque divergente en note.
  alternative: 'Traduire l’hébreu fourni : « Sauve-nous, Dieu de tous, et fais peser ta terreur sur toutes les nations. »'
  rationale: Les deux témoins ne correspondent pas à la même phrase. Le grec est retenu pour Siracide 35.1 conformément à l’identification de référence fournie, tandis que la divergence majeure de l’hébreu est conservée sans être dissimulée.
translation_notes:
  register: Français moderne, digne et direct. Le tutoiement rend les impératifs grecs à la deuxième personne du singulier. La question initiale suit la ponctuation et la syntaxe grecques ; le point-virgule maintient le lien étroit entre la mise en garde et l’appel à rester au milieu des autres.
