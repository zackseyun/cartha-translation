  text: Give the recompense of those who wait for you[b][a], and let your prophets be found faithful.
translation:
  language: fr
  text: Accorde à ceux qui espèrent en toi[a] ce qui leur est dû, et que tes prophètes soient reconnus comme dignes de foi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à ceux qui t’attendent ». Le verbe hébreu peut exprimer à la fois l’attente et l’espérance confiante.'
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec est très différent : « Celui qui craint le Seigneur recevra l’instruction, et ceux qui se lèvent tôt trouveront la faveur. » Il reflète probablement une autre forme du texte.'
    reason: alternative_reading
lexical_decisions:
- source_word: תן
  choice: Accorde
  rationale: L’impératif de נתן exprime ici une demande adressée à Dieu. « Accorde » est naturel en français dans le cadre d’une prière.
- source_word: פעלת
  choice: ce qui leur est dû
  rationale: פעלה peut désigner l’œuvre, le résultat d’une action ou la rétribution. Dans ce contexte, cette formulation rend le sens probable de récompense ou de juste rétribution sans en préciser excessivement la nature.
- source_word: קוויך
  choice: ceux qui espèrent en toi
  rationale: Le participe de קוה peut exprimer l’attente confiante aussi bien que l’espérance. En français, « espèrent en toi » traduit naturellement cette confiance dirigée vers Dieu; « t’attendent » est signalé en note.
- source_word: ונביאיך
  choice: et que tes prophètes
  rationale: Rend directement le nom au pluriel avec le suffixe possessif.
- source_word: יאמנו
  choice: soient reconnus comme dignes de foi
  rationale: La forme issue de אמן peut évoquer le fait d’être confirmé, tenu pour véridique ou reconnu fiable. Cette traduction conserve l’idée de validation des prophètes sans réduire le sens à leur conduite morale.
theological_decisions:
- issue: Divergence importante entre le texte hébreu conservé et le témoin grec
  choice: Le texte principal suit la demande hébraïque concernant ceux qui espèrent en Dieu et la confirmation de ses prophètes.
  alternative: 'Le grec porte : « Celui qui craint le Seigneur recevra l’instruction, et ceux qui se lèvent tôt trouveront la faveur. »'
  rationale: L’hébreu conservé est ici le texte source principal. Comme le grec témoigne d’une forme nettement différente plutôt que d’une simple variante lexicale, sa lecture est conservée en note.
- issue: Sens de יאמנו appliqué aux prophètes
  choice: « soient reconnus comme dignes de foi »
  alternative: « se révèlent fidèles » ou « soient confirmés »
  rationale: Le choix préserve l’idée que les prophètes sont authentifiés ou reconnus véridiques, sans trancher entre confirmation de leurs paroles et reconnaissance de leur fidélité personnelle.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde le ton d’une prière et préserve l’ambiguïté du terme de rétribution ainsi que celle de la confirmation des prophètes.
