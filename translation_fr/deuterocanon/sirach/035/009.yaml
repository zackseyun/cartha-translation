translation:
  language: fr
  text: Rassemble toutes les tribus de Jacob[a], et qu’elles reçoivent leur héritage comme aux jours d’autrefois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec de ce verset porte plutôt : « Au milieu des grands, ne te mets pas sur un pied d’égalité avec eux, et quand un autre parle, ne bavarde pas beaucoup. » Il semble refléter une autre tradition textuelle ou un décalage dans l’alignement des versets par rapport à l’hébreu conservé.'
    reason: textual_variant
lexical_decisions:
- source_word: אסוף
  choice: Rassemble
  rationale: L’impératif du verbe אסף appelle à réunir ce qui est dispersé. « Rassemble » est naturel en français et conserve la force de l’appel.
- source_word: כל שבטי יעקב
  choice: toutes les tribus de Jacob
  rationale: Cette traduction directe de la construction hébraïque préserve son cadre ancestral et collectif.
- source_word: ויתנחלו
  choice: qu’elles reçoivent leur héritage
  rationale: Le verbe נחל exprime ici l’accès à un héritage ou à une possession attribuée. Cette formulation française rend naturellement cette nuance, sans préciser davantage la nature de l’héritage.
- source_word: כימי קדם
  choice: comme aux jours d’autrefois
  rationale: L’expression évoque une époque ancienne prise comme modèle de restauration. « Aux jours d’autrefois » reste actuelle, digne et légèrement solennelle.
theological_decisions:
- issue: Divergence entre le texte hébreu conservé et le parallèle grec
  choice: Suivre dans le texte principal l’hébreu conservé, qui contient une prière pour le rassemblement et le rétablissement des tribus.
  alternative: 'Le grec porte plutôt : « Au milieu des grands, ne te mets pas sur un pied d’égalité avec eux, et quand un autre parle, ne bavarde pas beaucoup. »'
  rationale: Lorsque le texte hébreu du Siracide est conservé avec une confiance élevée, il constitue la source principale. La différence radicale du grec est signalée en note, car elle paraît relever d’une autre tradition textuelle ou d’un décalage dans l’alignement des versets.
translation_notes:
  register: Français international moderne, clair et digne. Le tour exhortatif « et qu’elles… » conserve la coordination de l’hébreu, tandis que « aux jours d’autrefois » maintient la tonalité de restauration sans archaïsme excessif.
