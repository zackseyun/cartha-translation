translation:
  language: fr
  text: Un cœur tortueux apporte le chagrin, et un homme d’expérience lui rendra la pareille.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La proposition finale est difficile. L’hébreu dit littéralement quelque chose comme : « et un homme éprouvé la rendra en/contre lui ». Les référents des pronoms sont incertains. On peut aussi comprendre : « lui répondra en conséquence » ou « le lui fera payer de même ».'
    reason: alternative_reading
  - marker: b
    text: 'Le parallèle grec est très différent : « Ne te fie pas à un chemin où l’on ne trébuche pas. » Il peut refléter un texte hébreu sous-jacent différent ou une altération du texte.'
    reason: textual_variant
lexical_decisions:
- source_word: לב
  choice: cœur
  rationale: Dans la littérature sapientiale hébraïque, לב désigne l’être intérieur, notamment la pensée et les intentions. « Cœur » conserve cette image morale sans la réduire à l’intellect.
- source_word: עקוב
  choice: tortueux
  rationale: Le mot évoque ce qui est tordu ou retors sur le plan moral. « Tortueux » préserve l’image hébraïque et reste naturel en français soutenu courant.
- source_word: יתן
  choice: apporte
  rationale: Le verbe signifie littéralement « donne » ; ici, « apporte » exprime naturellement l’idée que ce cœur produit le chagrin.
- source_word: עצבת
  choice: chagrin
  rationale: Le nom désigne la peine ou l’affliction. « Chagrin » convient au registre sapientiel et reste accessible.
- source_word: ואיש
  choice: et un homme
  rationale: L’hébreu emploie explicitement le masculin singulier איש ; la traduction le conserve sans exclure la portée générale du proverbe.
- source_word: ותיק
  choice: d’expérience
  rationale: Le terme décrit quelqu’un d’éprouvé, mûr ou expérimenté. « Un homme d’expérience » est idiomatique et rend la compétence acquise.
- source_word: ישיבנה
  choice: le lui rendra
  rationale: La forme issue de שוב exprime le fait de faire revenir ou de rendre, avec un suffixe objet féminin dont le référent demeure incertain. « Le lui rendra » transmet la réciprocité tout en laissant au pronom « le » une référence relativement ouverte.
- source_word: בו
  choice: de même
  rationale: La préposition munie d’un suffixe pronominal est obscure ici. « De même » exprime prudemment une réponse correspondante sans imposer trop précisément le référent.
theological_decisions:
- issue: Formulation genrée de איש
  choice: un homme
  alternative: une personne
  rationale: Le texte hébreu porte le masculin singulier. La traduction conserve cette forme, tout en permettant au proverbe d’avoir une portée représentative.
- issue: Sens de la proposition finale à la syntaxe pronominale difficile
  choice: un homme d’expérience le lui rendra de même
  alternative: un homme d’expérience lui répondra en conséquence
  rationale: 'L’hébreu est compact et ambigu : ישיבנה peut signifier rendre, ramener ou répondre, tandis que בו admet plusieurs rattachements. Le texte principal propose un sens réciproque intelligible, et la note préserve les autres possibilités.'
- issue: Divergence du parallèle grec
  choice: suivre le texte hébreu conservé
  alternative: « Ne te fie pas à un chemin où l’on ne trébuche pas »
  rationale: Le grec diffère radicalement de l’hébreu et reflète vraisemblablement une autre Vorlage ou une corruption textuelle. Puisque la source hébraïque est ici attestée avec une confiance élevée, elle gouverne le texte principal, tandis que la divergence est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’image du « cœur » et le masculin de איש. Les marqueurs de note suivent la proposition concernée et rendent visibles à la fois l’incertitude syntaxique de l’hébreu et la forte divergence du grec.
