  text: Hear the prayer of your servants[b][a], according to your favor toward your people.
translation:
  language: fr
  text: Écoute la prière de tes serviteurs, selon ta bienveillance envers ton peuple.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « selon ta volonté ». Le mot hébreu רצון peut désigner la volonté, la faveur ou le bon plaisir; « bienveillance » a été retenu ici à cause de la suite, « envers ton peuple ».'
    reason: lexical_alternative
  - marker: b
    text: 'La tradition grecque présente ici un texte très différent : « Celui qui recherche la Loi en sera rassasié, mais celui qui feint s’y heurtera. » Cela témoigne d’une divergence importante entre les formes hébraïque et grecque conservées du Siracide.'
    reason: textual_variant
lexical_decisions:
- source_word: תשמע
  choice: Écoute
  rationale: L’inaccompli qal a ici, dans le langage de la prière, une valeur de requête. « Écoute » rend directement la supplication sans ajouter l’idée d’une réponse favorable qu’exprimerait « exauce ».
- source_word: תפלת
  choice: la prière
  rationale: Le singulier construit est conservé devant « de tes serviteurs ».
- source_word: עבדיך
  choice: tes serviteurs
  rationale: Dans une prière adressée à Dieu, le terme désigne ceux qui le servent et lui appartiennent; « serviteurs » convient mieux au contexte que « esclaves ».
- source_word: כרצונך
  choice: selon ta bienveillance
  rationale: רצון peut exprimer la volonté, la faveur ou le bon plaisir. Avec « envers ton peuple », « bienveillance » rend naturellement l’orientation favorable suggérée par le contexte, tout en signalant l’autre sens possible en note.
- source_word: על
  choice: envers
  rationale: Avec un terme exprimant une disposition favorable, « envers » traduit naturellement l’orientation indiquée par על.
- source_word: עמך
  choice: ton peuple
  rationale: Traduction directe qui conserve la dimension collective et relationnelle de l’expression hébraïque.
theological_decisions:
- issue: Sens de עבדיך dans une prière adressée à Dieu
  choice: tes serviteurs
  alternative: tes esclaves
  rationale: Le contexte met en avant le service fidèle et la relation à Dieu, non le statut social de personnes réduites en esclavage.
- issue: Sens de כרצונך
  choice: selon ta bienveillance
  alternative: selon ta volonté
  rationale: Le lien avec « envers ton peuple » favorise le sens relationnel de faveur ou de disposition bienveillante, mais le sens de « volonté » demeure possible et est conservé en note.
translation_notes:
  register: Français international moderne, sobre et digne. « Écoute » garde le verbe de perception du texte hébreu sans renforcer la demande en « exauce ». « Bienveillance envers » est idiomatique tout en préservant la nuance favorable de רצון.
