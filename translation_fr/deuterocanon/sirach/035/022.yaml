  text: Any wound a living creature may heal[b][a], but there is pain worse than pain.
translation:
  language: fr
  text: Tout être vivant peut guérir de toute blessure[b] ; mais il y a une douleur plus cruelle qu’une autre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu de ce verset est difficile et probablement altéré par endroits. La dernière proposition est rendue selon son sens probable. Plus littéralement, le texte conservé dit quelque chose comme : « il y a un coup [plus …] qu’un coup » ; le mot final est obscur.'
    reason: textual_variant
  - marker: b
    text: 'Le texte grec parallèle porte : « et garde-toi de tes enfants ». Il diffère nettement de l’hébreu conservé et peut témoigner d’une autre forme du texte.'
    reason: alternative_reading
lexical_decisions:
- source_word: כל נכה
  choice: de toute blessure
  rationale: כל est pris dans son sens distributif et נכה comme désignant une blessure. La tournure française permet une maxime naturelle sans préciser indûment le type de blessure.
- source_word: תאכל חיה
  choice: un être vivant peut guérir
  rationale: 'L’hébreu conservé est très difficile : אכל signifie normalement « manger, dévorer », tandis que חיה peut désigner un être vivant ou un animal. La traduction retient le sens probable de la maxime transmis par la couche de consultation, tout en signalant l’incertitude textuelle en note.'
- source_word: אך
  choice: mais
  rationale: La conjonction marque simplement l’opposition entre une blessure dont on peut guérir et une douleur d’une gravité supérieure.
- source_word: מכה ממכה
  choice: des douleurs … que d’autres
  rationale: מכה peut désigner un coup, une plaie ou une affliction. « Douleurs » exprime ici naturellement en français la comparaison proverbiale, sans imposer un cadre exclusivement physique.
- source_word: תנעם
  choice: plus cruelles
  rationale: La forme est obscure et peut être altérée. « Plus cruelles » rend le sens comparatif défavorable suggéré par le contexte, sans prétendre reproduire une étymologie certaine.
