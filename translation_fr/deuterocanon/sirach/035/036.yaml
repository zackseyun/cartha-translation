  text: Mets-le au travail, afin qu’il ne soit pas oisif,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔμβαλε
  choice: Mets
  rationale: L’impératif aoriste de ἐμβάλλω signifie littéralement « jeter, mettre dans ». Avec εἰς ἐργασίαν, il exprime naturellement l’idée d’affecter quelqu’un à un travail. « Mets » conserve la force directe de l’impératif.
- source_word: αὐτὸν
  choice: le
  rationale: Le pronom accusatif masculin singulier renvoie, dans le contexte, à une personne de sexe masculin.
- source_word: εἰς ἐργασίαν
  choice: au travail
  rationale: ἐργασία désigne le travail, l’activité ou l’occupation. La tournure française « mettre au travail » restitue fidèlement et naturellement l’expression grecque.
- source_word: ἵνα
  choice: afin que
  rationale: La conjonction introduit ici le but. « Afin que » en préserve clairement la valeur finale dans un registre digne et courant.
- source_word: μὴ ἀργῇ
  choice: qu’il ne reste pas oisif
  rationale: ἀργέω signifie être inactif, désœuvré ou sans travail. « Rester oisif » exprime l’inactivité sans ajouter le jugement de caractère plus fort qu’impliquerait « paresseux ».
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et digne. La formulation conserve l’impératif et la proposition de but du grec. La virgule finale est maintenue puisque le fragment source se poursuit syntaxiquement.
