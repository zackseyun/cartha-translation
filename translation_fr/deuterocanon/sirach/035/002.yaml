translation:
  language: fr
  text: Interviens contre un peuple étranger[b], et qu’ils voient tes actes de puissance.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec conservé diffère fortement de ce témoin hébreu : il parle de s’occuper d’eux, de s’asseoir, de se réjouir et de recevoir une couronne. La traduction suit ici l’hébreu conservé.'
    reason: textual_variant
  - marker: b
    text: Le bref impératif hébreu est incertain. Il peut aussi être compris comme « relâche ton action envers un peuple étranger », « laisse en paix un peuple étranger » ou, selon le contexte, « frappe un peuple étranger ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הרף
  choice: Déchaîne-toi
  rationale: L’impératif, issu de רפה, évoque fondamentalement le fait de relâcher ou de laisser aller. Dans cette formule très concise avec על, « Déchaîne-toi contre » rend naturellement l’idée possible de laisser libre cours à sa puissance, sans adopter le sens plus précis de « frappe », qui n’est pas exprimé directement par le verbe.
- source_word: על
  choice: contre
  rationale: Avec un acte de puissance dirigé vers un peuple étranger, על marque ici vraisemblablement l’orientation hostile. « Contre » convient au contexte tout en restant compatible avec la construction hébraïque.
- source_word: עם נכר
  choice: un peuple étranger
  rationale: Cette expression conserve le sens collectif de עם et la notion d’altérité portée par נכר, sans la réduire à des individus.
- source_word: ויראו
  choice: et qu’il voie
  rationale: La forme préfixée qui suit l’impératif peut avoir une valeur volitive ou consécutive. Le singulier français reprend le nom collectif « peuple ».
- source_word: גבורתיך
  choice: tes actes de puissance
  rationale: Le contexte visuel favorise des manifestations concrètes de puissance plutôt que la seule qualité abstraite de force; la formulation française reste cependant assez large.
theological_decisions:
- issue: Divergence entre le témoin hébreu et le parallèle grec fourni
  choice: Traduire le témoin hébreu conservé et signaler la divergence en note
  alternative: Suivre le grec, qui parle de prendre soin de convives, de s’asseoir, de se réjouir et de recevoir une couronne
  rationale: Le grec fourni représente manifestement une autre forme textuelle et ne correspond pas à la ligne hébraïque. L’harmonisation effacerait une véritable difficulté de transmission.
- issue: Nuance incertaine de הרף על
  choice: Déchaîne-toi contre
  alternative: Relâche ton action envers / laisse en paix / frappe
  rationale: La racine exprime normalement le relâchement, mais la construction est laconique et son orientation précise demeure incertaine. Le texte principal propose une lecture contextuelle, tandis que la note préserve les autres possibilités.
translation_notes:
  register: Français international actuel, digne et direct. « Déchaîne-toi » exprime une action puissante sans introduire explicitement le verbe « frapper ». Les appels de note sont placés dans le texte dans l’ordre [b], puis [a], au point précis où portent respectivement l’incertitude lexicale et la divergence textuelle.
