base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/033.yaml
  text: Fodder and a stick and loads are for a donkey[c][b][a]; bread and discipline and work are for a servant.
translation:
  language: fr
  text: Du fourrage, un bâton et des charges pour l’âne ; du pain, de la discipline[a] et du travail pour l’esclave domestique[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’instruction », « de la formation » ou « de la correction ».
    reason: lexical_alternative
  - marker: b
    text: Le grec désigne un esclave ou un serviteur attaché à la maisonnée.
    reason: lexical_alternative
lexical_decisions:
- source_word: χορτάσματα
  choice: du fourrage
  rationale: Désigne la nourriture destinée aux animaux ; « fourrage » convient naturellement à l’âne et conserve le caractère concret de l’énumération.
- source_word: ῥάβδος
  choice: un bâton
  rationale: Le mot peut désigner une baguette, une verge ou un bâton. Ici, « bâton » reste concret et n’accentue pas indûment la fonction punitive.
- source_word: φορτία
  choice: des charges
  rationale: Le pluriel désigne ce que porte une bête de somme ; « charges » rend directement cette réalité.
- source_word: ὄνῳ
  choice: pour l’âne
  rationale: Le datif exprime ici ce qui est destiné ou approprié à l’âne ; la préposition « pour » restitue clairement cette relation.
- source_word: ἄρτος
  choice: du pain
  rationale: Le grec nomme précisément le pain, sans qu’il soit nécessaire de généraliser en « nourriture ».
- source_word: παιδεία
  choice: de la discipline
  rationale: Dans cette série liée à la conduite d’un membre dépendant de la maisonnée, le terme évoque formation, instruction et correction ; « discipline » en préserve l’étendue pratique.
- source_word: ἔργον
  choice: du travail
  rationale: Traduction directe et naturelle dans le contexte du travail domestique.
- source_word: οἰκέτῃ
  choice: pour l’esclave domestique
  rationale: οἰκέτης désigne spécifiquement un esclave ou serviteur appartenant à la maisonnée. « Esclave domestique » conserve à la fois le statut non libre et le cadre du foyer.
theological_decisions:
- issue: Statut social exprimé par οἰκέτῃ
  choice: l’esclave domestique
  alternative: le serviteur / le domestique
  rationale: « Serviteur » ou « domestique » risquerait d’effacer le statut non libre que peut désigner οἰκέτης. La traduction retenue rend explicitement la relation sociale sans l’approuver ni l’atténuer.
- issue: Portée de παιδεία
  choice: discipline
  alternative: instruction / formation / correction
  rationale: Le contexte permet plusieurs nuances. « Discipline » maintient ensemble l’idée de formation encadrée et celle de correction, tandis qu’une note signale l’ambiguïté lexicale.
translation_notes:
  register: Formulation proverbiale brève, avec parallélisme nominal conservé entre les deux membres. Le registre est actuel et digne. L’article défini dans « l’âne » et « l’esclave domestique » exprime les catégories générales visées par la maxime.
