revisions:
- from: De ton vivant, ne donne autorité sur toi ni à un fils ni à une femme, ni à un frère ni à un ami ; et ne donne pas tes biens à quelqu’un d’autre, de peur de le regretter et d’avoir à les réclamer.[a]
  to: 'De ton vivant, n’accorde à personne de pouvoir sur toi : ni à un fils ni à une femme, ni à un frère ni à un ami ; et ne donne pas tes biens à quelqu’un d’autre, de peur de le regretter et de devoir les demander.[a]'
  rationale: La révision améliore l’idiomaticité de l’expression du pouvoir exercé sur la personne et évite de présenter comme explicite l’idée de réclamer la restitution des biens. La note conserve les possibilités principales de la clause grecque finale.
