review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : l’avertissement porte sur le fait de céder à des proches un pouvoir sur soi et de donner ses biens. Toutefois, « les réclamer » interprète δέῃ περὶ αὐτῶν de façon plus précise que ne le permet la formulation grecque, qui est comprimée et peut aussi évoquer le besoin ou la demande pressante au sujet des biens.'
  naturalness: « Ne donne autorité sur toi » est compréhensible mais peu idiomatique en français moderne. « N’accorde à personne de pouvoir sur toi » est plus naturel. La coordination de la liste est également plus fluide avec « ni … ni … » après cette formulation.
  terminology: « Tes biens » rend convenablement τὰ χρήματά σου. « Un fils » et « une femme » conservent l’absence de possessifs explicites ; dans ce contexte proverbial, « femme » peut désigner l’épouse sans imposer une interprétation théologique. La note doit garder ouverte l’ambiguïté de la clause finale.
  issues:
  - severity: medium
    issue: La traduction principale « d’avoir à les réclamer » est trop déterminée.
    rationale: δέῃ περὶ αὐτῶν ne dit pas explicitement « les réclamer en retour » ; la construction peut renvoyer au besoin ou à une demande au sujet des biens. Une formulation française moins spécifique, accompagnée d’une note, préserve l’ambiguïté.
  - severity: low
    issue: « Ne donne autorité sur toi » manque de naturel.
    rationale: Le français courant emploie plus naturellement « accorder du pouvoir à quelqu’un sur soi » ou « donner à quelqu’un pouvoir sur soi ».
