  text: Do not give authority over yourself in your lifetime to son or wife[a], brother or friend; and do not give your property to another, lest you regret it and have to ask for it back.
translation:
  language: fr
  text: 'De ton vivant, n’accorde à personne de pouvoir sur toi : ni à un fils ni à une femme, ni à un frère ni à un ami ; et ne donne pas tes biens à quelqu’un d’autre, de peur de le regretter et de devoir les demander.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de peur qu’après l’avoir regretté, tu ne sois dans le besoin à leur sujet ». La dernière proposition grecque est concise : δέῃ περὶ αὐτῶν peut évoquer le fait d’être dans le besoin au sujet des biens, ou de devoir en faire la demande.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δῷς ἐξουσίαν ἐπὶ σὲ
  choice: ne donne autorité sur toi
  rationale: Cette formulation conserve la construction concrète du grec et exprime clairement l’idée de remettre à autrui un pouvoir sur sa propre personne.
- source_word: ἐν ζωῇ σου
  choice: de ton vivant
  rationale: Expression française naturelle et concise qui garde la portée temporelle du grec.
- source_word: υἱῷ καὶ γυναικί, ἀδελφῷ καὶ φίλῳ
  choice: ni à un fils ni à une femme, ni à un frère ni à un ami
  rationale: Dans une interdiction, « ni… ni… » rend naturellement la liste grecque. Les noms restent indéfinis puisque le grec n’exprime ici aucun possessif.
- source_word: τὰ χρήματά σου
  choice: tes biens
  rationale: χρήματα peut désigner l’argent ou, plus largement, les possessions. « Tes biens » préserve cette étendue sans registre technique.
- source_word: ἑτέρῳ
  choice: à quelqu’un d’autre
  rationale: Rend clairement la référence générale à une autre personne.
- source_word: ἵνα μὴ μεταμεληθεὶς
  choice: de peur de le regretter
  rationale: Restitue la conséquence redoutée et la valeur de regret du participe μεταμεληθείς dans un français courant.
- source_word: δέῃ περὶ αὐτῶν
  choice: d’avoir à les réclamer
  rationale: Dans le contexte de biens donnés, cette traduction exprime naturellement la nécessité d’en demander la restitution, tout en signalant en note la formulation grecque plus comprimée.
