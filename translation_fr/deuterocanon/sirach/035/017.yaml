  text: The throat eats every kind of food[b][a], but one kind of food is more pleasant than another.
translation:
  language: fr
  text: La gorge avale toutes sortes d’aliments[b], mais il y a des aliments plus agréables que d’autres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est un proverbe concis dont la forme conservée est quelque peu difficile. Le texte grec diffère profondément : « Un homme pécheur évitera la réprimande et, selon sa volonté, trouvera un jugement ou un argument. » Cette divergence peut témoigner d’un texte hébreu de départ différent ou d’une perturbation dans la transmission du texte.'
    reason: textual_variant
  - marker: b
    text: Ou « le gosier ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כל מאכל
  choice: toutes sortes d’aliments
  rationale: Le quantificateur כל donne à l’énoncé sa portée générale; cette formulation est naturelle en français et évite le tour plus raide « tout aliment ».
- source_word: אוכל
  choice: absorbe
  rationale: Le verbe signifie ordinairement « manger ». Avec « la gorge » pour sujet, « absorbe » produit un proverbe français intelligible sans ajouter l’idée plus forte de dévorer.
- source_word: גרגרת
  choice: la gorge
  rationale: Le terme désigne la gorge ou le gosier, organe par lequel passe la nourriture. « Gorge » est actuel, clair et digne; « gosier » reste une possibilité plus imagée.
- source_word: אך
  choice: mais
  rationale: La particule marque le contraste entre la capacité générale de recevoir les aliments et la préférence pour certains d’entre eux.
- source_word: יש אכל מאכל נעים
  choice: certains sont plus agréables que d’autres
  rationale: L’hébreu conservé est elliptique et littéralement difficile. La formulation française explicite avec retenue la comparaison impliquée, tout en conservant le contraste proverbial.
theological_decisions: []
translation_notes:
  register: Français international moderne, proverbial et sobre. « Absorbe » rend naturelle la personnification de la gorge; le second membre explicite seulement la comparaison que le contraste hébreu semble impliquer.
