  text: And all the ends of the earth will know that you are the eternal God[a][b].
translation:
  language: fr
  text: Et tous les confins de la terre sauront que tu es le Dieu éternel[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La tradition grecque porte : « Ceux qui craignent le Seigneur trouveront le jugement et feront resplendir leurs actes justes comme la lumière. » Le témoin hébreu conserve ici une ligne sensiblement différente.'
    reason: textual_variant
  - marker: b
    text: 'Ou : « le Dieu de toute éternité ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וידעו
  choice: sauront
  rationale: Le parfait qal précédé de waw exprime ici, dans cette déclaration poétique, un résultat à venir. « Sauront » rend directement cette valeur future.
- source_word: כל אפסי ארץ
  choice: tous les confins de la terre
  rationale: Cette expression hébraïque désigne les régions les plus éloignées du monde. « Les confins de la terre » est une formulation française naturelle, digne et proche de l’image hébraïque.
- source_word: אתה
  choice: tu es
  rationale: Le pronom hébreu est explicite et emphatique, mais ne justifie pas l’ajout de « seul ». Le français conserve l’adresse directe.
- source_word: אלהי עולם
  choice: le Dieu éternel
  rationale: Littéralement « Dieu d’éternité » ou « Dieu de toujours ». « Le Dieu éternel » exprime naturellement en français la durée sans fin associée à Dieu, tandis qu’une note conserve une traduction plus formelle.
theological_decisions:
- issue: Rapport entre le témoin hébreu et la tradition grecque divergente
  choice: Traduire en priorité le texte hébreu conservé et signaler la leçon grecque en note.
  alternative: « Ceux qui craignent le Seigneur trouveront le jugement et feront resplendir leurs actes justes comme la lumière. »
  rationale: La ligne grecque ne constitue pas une simple variante de formulation, mais transmet un contenu sensiblement différent. Puisque l’hébreu est ici attesté avec une confiance élevée, il fonde le texte principal sans harmonisation avec le grec.
- issue: Valeur de עולם dans אלהי עולם
  choice: « le Dieu éternel »
  alternative: « le Dieu de toute éternité »
  rationale: Le mot עולם peut évoquer l’éternité ou une durée indéfinie. Le choix principal est idiomatique sans supprimer l’alternative plus formelle.
translation_notes:
  register: Français international moderne, clair et solennel. « Confins de la terre » conserve l’image biblique tout en restant aisément compréhensible; « Dieu éternel » privilégie une formulation française naturelle.
