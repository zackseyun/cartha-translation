  text: Have mercy on the people called by your name[a], on Israel, your firstborn[c][b], whom you acquired.
translation:
  language: fr
  text: Aie pitié du peuple qui porte ton nom[a], d’Israël, ton premier-né, que tu as acquis[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « appelé de ton nom ». L’expression hébraïque désigne un peuple identifié comme appartenant à Dieu.'
    reason: lexical_alternative
  - marker: b
    text: Ou « que tu possèdes », « que tu as acheté » ou, peut-être, « que tu as créé ». Le verbe hébreu peut prendre plusieurs sens apparentés.
    reason: alternative_reading
  - marker: c
    text: Le texte grec transmis ici présente une phrase très différente, issue d’une autre tradition textuelle. La présente traduction suit le témoin hébreu conservé.
    reason: textual_variant
lexical_decisions:
- source_word: רַחֵם
  choice: Aie pitié
  rationale: L’impératif demande à Dieu d’agir avec compassion. « Aie pitié » est naturel, digne et courant dans le langage de la prière.
- source_word: עַל־עָם
  choice: du peuple
  rationale: עַם est ici un collectif singulier. L’article français convient au peuple ensuite identifié comme Israël, sans ajouter dès ce stade le possessif « ton » absent de l’hébreu.
- source_word: נִקְרָא בִּשְׁמֶךָ
  choice: qui porte ton nom
  rationale: Cette formulation française naturelle rend l’idiome hébreu d’un peuple appelé du nom de Dieu, donc identifié comme lui appartenant, sans en réduire la portée à une simple dénomination.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom propre est conservé sous sa forme française usuelle.
- source_word: בְּכוֹר
  choice: ton premier-né
  rationale: Le substantif signifie « premier-né ». Le possessif, implicite dans l’adresse à Dieu et dans l’apposition à Israël, est explicité en français pour rendre clairement la relation, sans ajouter « fils », qui n’apparaît pas dans l’hébreu.
- source_word: קָנִיתָה
  choice: que tu as acquis
  rationale: Le verbe קנה peut signifier acquérir, posséder, acheter ou, dans certains contextes, créer. « Acquis » maintient ici l’idée d’appropriation sans imposer une nuance commerciale ou cosmologique.
theological_decisions:
- issue: Identité d’alliance exprimée par נִקְרָא בִּשְׁמֶךָ
  choice: qui porte ton nom
  alternative: qui est appelé de ton nom
  rationale: Le choix conserve l’idée biblique d’identification et d’appartenance à Dieu, tout en évitant une tournure peu naturelle en français moderne.
- issue: Sens de קָנִיתָה appliqué à Israël
  choice: que tu as acquis
  alternative: que tu as créé ; que tu possèdes ; que tu as acheté
  rationale: Le verbe reste sémantiquement ouvert. « Acquis » convient au contexte historique et relationnel sans trancher en faveur d’une création, d’une possession statique ou d’un achat.
- issue: Relation entre Dieu et Israël qualifié de בְּכוֹר
  choice: ton premier-né
  alternative: le premier-né
  rationale: Le possessif n’est pas morphologiquement exprimé sur בְּכוֹר, mais la relation à Dieu est impliquée par l’adresse directe et l’apposition. Le français l’explicite pour éviter une expression incomplète, sans ajouter le mot « fils ».
translation_notes:
  register: 'Français international moderne, clair et digne, avec une tonalité de supplication. La formulation privilégie une équivalence optimale : idiome naturel pour l’appartenance exprimée par le nom, mais maintien de l’ambiguïté du verbe קנה en note.'
