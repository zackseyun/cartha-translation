  yaml_path: translation/deuterocanon/sirach/035/031.yaml
  text: In all your works be preeminent[a]; do not give a blemish to your honor.
translation:
  language: fr
  text: Dans tout ce que tu fais, sois excellent ; ne ternis pas ton honneur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne porte pas atteinte à ta réputation ». Le grec dit littéralement « gloire », terme qui peut ici désigner l’honneur ou la bonne réputation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσι τοῖς ἔργοις σου
  choice: Dans tout ce que tu fais
  rationale: Cette formulation rend naturellement en français moderne l’ensemble des actes de la personne, sans perdre la portée générale de ἔργοις.
- source_word: γίνου ὑπεράγων
  choice: cherche à te surpasser
  rationale: ὑπεράγων exprime l’idée de dépasser, d’exceller. Avec l’impératif γίνου, cette tournure restitue une exhortation continue dans un français naturel, sans revendiquer une prééminence sociale absolue.
- source_word: μὴ δῷς μῶμον
  choice: ne jette aucune tache
  rationale: Le grec associe littéralement l’action de « donner » à un blâme ou une tache. « Jeter une tache » conserve l’image tout en formant une expression française idiomatique.
- source_word: ἐν τῇ δόξῃ σου
  choice: sur ton honneur
  rationale: Dans ce contexte de sagesse pratique, δόξα désigne vraisemblablement l’honneur ou la bonne réputation. La préposition « sur » s’accorde naturellement avec l’image de la tache.
theological_decisions:
- issue: Sens de δόξα dans une exhortation éthique
  choice: honneur
  alternative: gloire ; réputation
  rationale: « Honneur » préserve la dimension sociale et morale du terme sans lui imposer le sens théologique plus marqué de « gloire ». « Réputation » serait possible, mais plus explicitement interprétatif.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond à l’adresse sapientielle au lecteur. La première proposition est rendue de manière idiomatique, tandis que la seconde conserve la métaphore grecque de la tache.
