  text: Bear witness to your former deeds[a], and establish the vision swiftly in your name.
translation:
  language: fr
  text: Rends témoignage à tes œuvres d’autrefois[a], et établis promptement la vision en ton nom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu de ce vers est difficile, en particulier le mot rendu par « promptement ». Le parallèle grec porte plutôt : « Et, en plus de tout cela, bénis celui qui t’a fait et qui te comble de ses biens. »'
    reason: alternative_reading
lexical_decisions:
- source_word: תן עדות
  choice: Rends témoignage
  rationale: L’impératif signifie littéralement « donne un témoignage ». « Rends témoignage » conserve la force testimoniale et convient à un registre biblique actuel.
- source_word: למראש מעשיך
  choice: à tes œuvres d’autrefois
  rationale: למראש est difficile, mais semble renvoyer à ce qui précède ou appartient au passé. « D’autrefois » exprime cette antériorité sans en préciser excessivement la nuance; « œuvres » garde ici la portée ample de מעשים.
- source_word: והקם
  choice: et établis
  rationale: La forme causative de קום peut signifier faire tenir, établir ou confirmer. « Établis » s’accorde avec « vision » sans imposer l’idée plus interprétative d’accomplissement.
- source_word: חזון
  choice: la vision
  rationale: « Vision » est l’équivalent direct et préserve l’imagerie prophétique ainsi que l’éventuelle ambiguïté du terme.
- source_word: דברק
  choice: promptement
  rationale: La leçon hébraïque est obscure et peut évoquer l’éclair ou la rapidité. « Promptement » offre une formulation française digne et prudente, sans présenter cette interprétation comme certaine.
- source_word: בשמך
  choice: en ton nom
  rationale: Cette traduction directe de la préposition ב avec « nom » conserve la formulation hébraïque, malgré une relation syntaxique qui demeure obscure.
theological_decisions:
- issue: Choix entre le texte hébreu de la Guéniza du Caire et le parallèle grec très divergent
  choice: Le texte principal traduit prudemment l’hébreu conservé.
  alternative: « Et, en plus de tout cela, bénis celui qui t’a fait et qui te comble de ses biens. »
  rationale: L’hébreu survivant constitue ici le témoin principal, mais il est difficile et diffère profondément du grec. La variante grecque est donc signalée en note afin de préserver la transparence textuelle sans remplacer silencieusement l’hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement suit l’adresse directe du texte. La syntaxe légèrement solennelle préserve le caractère poétique et l’obscurité réelle de l’hébreu sans la résoudre artificiellement.
