translation:
  language: fr
  text: Réveille ta colère et déverse ta fureur[a] ; abaisse l’adversaire et repousse l’ennemi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec de l’édition de Swete présente ici un texte très différent : il évoque un sceau d’émeraude dans un ouvrage d’or, ainsi que de la musique avec un vin agréable. Le texte hébreu, bien attesté dans la tradition des manuscrits de la Guéniza du Caire, est suivi ici comme source principale de ce verset.'
    reason: textual_variant
lexical_decisions:
- source_word: העיר
  choice: Réveille
  rationale: 'Impératif causatif de עור : il appelle à faire surgir ou entrer en action. « Réveille » conserve l’image et la vigueur de l’impératif hébreu.'
- source_word: אף
  choice: ta colère
  rationale: אף signifie littéralement « nez », mais désigne couramment la colère. Le possessif est exigé en français naturel après « réveille » et explicite seulement le sujet implicite de l’impératif.
- source_word: ושפוך
  choice: et déverse
  rationale: שפך signifie concrètement « verser, répandre ». « Déverse » maintient cette image tout en convenant à la fureur dans un registre digne.
- source_word: חמה
  choice: ta fureur
  rationale: חמה peut évoquer la chaleur, la rage ou la fureur. « Fureur » exprime ici l’intensité punitive et distingue le terme de אף, rendu par « colère ».
- source_word: והכניע
  choice: abaisse
  rationale: כנע signifie humilier, soumettre ou faire plier. « Abaisse » préserve le mouvement de mise à bas sans suggérer uniquement une disposition morale.
- source_word: צר
  choice: l’adversaire
  rationale: צר désigne un adversaire ou un oppresseur hostile. « L’adversaire » convient au singulier et évite de répéter immédiatement « ennemi ».
- source_word: והדוף
  choice: et repousse
  rationale: הדף signifie pousser au loin, repousser ou mettre en déroute. « Repousse » est naturel et conserve la force militaire de l’action.
- source_word: אויב
  choice: l’ennemi
  rationale: אויב est le terme courant pour un ennemi. La traduction directe garde le parallélisme culminant du vers.
theological_decisions:
- issue: Destinataire et sujet implicite des impératifs
  choice: Conserver une supplication directe adressée à Dieu, avec des impératifs à la deuxième personne sans ajouter son nom.
  alternative: Lire une exhortation générale sans destinataire divin explicite.
  rationale: Les verbes hébreux sont à l’impératif sans sujet exprimé ; le contexte les présente comme une prière à Dieu. Le français peut en préserver la force sans ajouter « Seigneur », absent de ce verset.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique est conservé, ainsi que la distinction entre אף (« colère ») et חמה (« fureur »).
