base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/003.yaml
  text: Speak, elder, for it is fitting for you—yet with accurate knowledge, and do not hinder the music.[b][a]
translation:
  language: fr
  text: Prends la parole, aîné, car il convient que tu le fasses avec une connaissance précise, et ne gêne pas la musique.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le témoin hébreu principal fourni ici paraît ne pas correspondre à ce verset. La traduction suit donc principalement le texte grec parallèle ; cette incertitude textuelle doit être prise en compte.
    reason: textual_variant
  - marker: b
    text: 'Autre traduction possible : « n’interromps pas l’exécution musicale ». Le terme grec peut désigner l’ensemble de la prestation musicale, et non la musique prise abstraitement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λάλησον
  choice: prends la parole
  rationale: L’impératif appelle l’aîné à parler dans le cadre du repas ou de l’assemblée ; cette tournure est naturelle en français et convient mieux au contexte que le simple « parle ».
- source_word: πρεσβύτερε
  choice: toi qui es l’aîné
  rationale: Le vocatif désigne ici un homme plus âgé ou de rang supérieur. « L’aîné » préserve l’idée d’âge et de préséance sans suggérer nécessairement une fonction religieuse.
- source_word: πρέπει γάρ σοι
  choice: car cela te convient
  rationale: La formule exprime ce qui est approprié à la personne interpellée, avec une dignité simple et actuelle.
- source_word: ἐν ἀκριβεῖ ἐπιστήμῃ
  choice: avec une connaissance précise
  rationale: La locution souligne l’exactitude et la compétence qui doivent caractériser la prise de parole, sans réduire le sens à une simple prudence.
- source_word: μὴ ἐμποδίσῃς
  choice: ne gêne pas
  rationale: Le verbe signifie empêcher, entraver ou faire obstacle. « Ne gêne pas » convient naturellement à la musique ou au déroulement musical.
- source_word: μουσικά
  choice: la musique
  rationale: Le neutre pluriel peut désigner les choses musicales ou l’exécution musicale. « La musique » est concis et idiomatique, tandis que l’autre possibilité est signalée en note.
