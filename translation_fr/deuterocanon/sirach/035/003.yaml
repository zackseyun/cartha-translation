translation_notes:
  register: Français international moderne, naturel et digne. « Toi qui es l’aîné » évite l’ambiguïté ecclésiastique possible de « ancien ». La coordination a été légèrement explicitée par « mais parle » afin que la recommandation sur la manière de s’exprimer soit claire sans modifier le sens.
