  text: The palate tests the flavors of speech, and an understanding heart the flavors of falsehood.
translation:
  language: fr
  text: Le palais éprouve les saveurs de la parole, et le cœur comprend les saveurs du mensonge.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le palais examine le goût de la parole, et le cœur discerne le goût des mensonges. » L’hébreu répète dans les deux membres l’image du goût.'
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec parallèle diffère considérablement ici : « Ne marche pas sur un chemin où tu risques de tomber… » La présente traduction suit le témoin hébreu conservé, retenu comme source principale pour ce verset.'
    reason: textual_variant
lexical_decisions:
- source_word: חך
  choice: le palais
  rationale: Le terme hébreu désigne littéralement le palais, organe du goût. Cette traduction conserve précisément l’image sensorielle du proverbe.
- source_word: בוחן
  choice: éprouve
  rationale: Le verbe exprime l’action d’examiner ou de mettre à l’épreuve. « Éprouve » convient à la fois à l’acte de goûter et à l’idée de discernement.
- source_word: מטעמי
  choice: les saveurs de
  rationale: Le mot appartient au champ lexical du goût. La répétition de « les saveurs de » dans les deux membres préserve le parallélisme et la métaphore de l’hébreu.
- source_word: דבר
  choice: la parole
  rationale: Le singulier hébreu peut désigner collectivement le discours ou la parole. « La parole » garde cette portée générale sans réduire le sens à un mot isolé.
- source_word: לב מבין
  choice: un cœur doué de discernement
  rationale: Cette formulation conserve l’anthropologie hébraïque, qui situe la compréhension dans le cœur, tout en exprimant naturellement en français la valeur du participe מבין.
- source_word: כזב
  choice: le mensonge
  rationale: Le nom peut désigner le mensonge, la fausseté ou la tromperie. « Le mensonge » fonctionne ici comme un collectif et forme un contraste clair avec « la parole ».
