  text: Fill Zion with your splendor[a], and your temple with your glory.
translation:
  language: fr
  text: 'Remplis Sion de ta splendeur[a],

    et ton temple de ta gloire.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin grec présente ici un texte très différent : « Là, joue, mets à exécution tes projets et ne pèche pas par une parole orgueilleuse. » Cela témoigne d’une divergence textuelle importante par rapport à la forme hébraïque conservée.'
    reason: textual_variant
lexical_decisions:
- source_word: מלא
  choice: Remplis
  rationale: L’impératif exprime directement une demande adressée à Dieu. « Remplis » est naturel en français et permet de sous-entendre le même verbe dans le second membre.
- source_word: ציון
  choice: Sion
  rationale: Le nom propre hébreu est conservé plutôt que remplacé par « Jérusalem », car le texte nomme précisément Sion.
- source_word: הודך
  choice: ta splendeur
  rationale: הוד désigne l’éclat, la majesté ou la splendeur. « Splendeur » préserve ici sa distinction poétique avec כבוד, rendu par « gloire ».
- source_word: ומכבודך
  choice: de ta gloire
  rationale: 'Le second membre est elliptique : le verbe « remplis » est repris implicitement. Dans cette construction, le מ peut indiquer ce dont le temple doit être rempli; le français idiomatique emploie « remplir de ».'
- source_word: היכלך
  choice: ton temple
  rationale: היכל peut signifier « palais » ou « temple »; associé à Sion dans cette prière adressée à Dieu, « temple » convient au contexte.
- source_word: כבודך
  choice: ta gloire
  rationale: כבוד exprime couramment la gloire, l’honneur ou la majesté. « Gloire » est précis dans le contexte de la présence divine au temple.
theological_decisions:
- issue: Distinction poétique entre הוד et כבוד
  choice: Rendre הוד par « splendeur » et כבוד par « gloire ».
  alternative: Rendre les deux termes par « gloire », ou הוד par « majesté ».
  rationale: Le choix conserve les deux termes apparentés mais distincts de l’hébreu sans leur imposer une différence théologique excessive.
- issue: Choix du témoin textuel principal
  choice: Traduire la forme hébraïque conservée comme texte principal.
  alternative: Suivre ici le texte grec, dont le contenu est très différent.
  rationale: Le témoin hébreu est disponible avec une confiance élevée et constitue la source principale; l’écart considérable du grec est signalé en note plutôt que résolu silencieusement.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme poétique est conservé sur deux lignes; l’ellipse verbale du second membre reste naturelle en français. Le marqueur [a] est placé après « splendeur » pour signaler la divergence portant sur l’ensemble du verset.
