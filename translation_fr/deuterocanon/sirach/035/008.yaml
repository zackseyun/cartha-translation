  text: Sum up your speech[a]; in few words say much[b]. Be like one who knows and yet keeps silent.
translation:
  language: fr
  text: Résume ton propos[a] ; dis beaucoup en peu de mots[b]. Sois comme quelqu’un qui sait tout en gardant le silence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu conservé de ce verset est difficile et paraît en partie altéré. Le parallèle grec a été utilisé pour en retrouver le sens probable, surtout dans les deux premières propositions.
    reason: textual_variant
  - marker: b
    text: 'Littéralement, le grec dit : « en peu [de choses], beaucoup », expression qui invite à dire beaucoup en peu de mots.'
    reason: lexical_alternative
lexical_decisions:
- source_word: השבת ראש / κεφαλαίωσον λόγον
  choice: Résume ton propos
  rationale: L’hébreu transmis est difficile, mais l’expression associant « ramener » et « tête » semble évoquer l’idée d’aller à l’essentiel. Le grec κεφαλαίωσον λόγον confirme clairement le sens de résumer ou de ramener un propos à son point principal.
- source_word: פאתי / λόγον
  choice: ton propos
  rationale: 'La forme hébraïque paraît altérée et pourrait littéralement évoquer des « bords ». Le grec λόγον préserve vraisemblablement le sens attendu : le discours ou le propos de l’interlocuteur.'
- source_word: מואב / ἐν ὀλίγοις πολλά
  choice: dis beaucoup en peu de mots
  rationale: La lecture hébraïque « Moab » ne donne aucun sens satisfaisant dans ce contexte. Le grec signifie littéralement « en peu [de choses], beaucoup » ; la formulation française explicite naturellement l’injonction à la concision.
- source_word: γίνου ὡς γινώσκων
  choice: Sois comme quelqu’un qui sait
  rationale: Cette traduction conserve la comparaison et la valeur générale du participe grec sans transformer le savoir en prétention ni en expertise technique.
- source_word: ἅμα σιωπῶν
  choice: tout en gardant le silence
  rationale: Cette tournure rend la simultanéité exprimée par ἅμα et préserve la tension sapientielle entre savoir et retenue.
