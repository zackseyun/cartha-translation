translation:
  language: fr
  text: Tout mâle acceptera une femme[a], mais un homme choisira une jeune femme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec présente ici une maxime très différente : « Ne fais rien sans avoir pris conseil et, après avoir agi, ne le regrette pas. » La tradition grecque reflète donc un texte sensiblement différent de l’hébreu conservé.'
    reason: textual_variant
lexical_decisions:
- source_word: כָּל זָכָר
  choice: Tout mâle
  rationale: Le premier membre emploie le terme explicitement sexué זכר, et non איש. « Tout mâle » conserve ce contraste lexical, malgré sa rudesse proverbiale.
- source_word: תְּקַבֵּל
  choice: acceptera
  rationale: Le verbe קבל signifie recevoir ou accepter. « Acceptera » convient au contexte relationnel sans préciser indûment le mariage ni l’union sexuelle.
- source_word: אִשָּׁה
  choice: une femme
  rationale: אשה peut désigner une femme ou une épouse. Ici, « femme » préserve la portée générale et le contraste avec עלמה sans restreindre le propos au mariage.
- source_word: אַךְ
  choice: mais
  rationale: La conjonction marque nettement l’opposition entre l’acceptation du premier membre et le choix du second.
- source_word: אִישׁ
  choice: un homme
  rationale: Le second membre passe de זכר à איש. « Un homme » maintient cette distinction présente dans l’hébreu.
- source_word: יִבְחַר
  choice: choisira
  rationale: בחר signifie choisir ou sélectionner. Le futur français conserve la forme sentencieuse de l’énoncé.
- source_word: עַלְמָה
  choice: une jeune femme
  rationale: עלמה désigne une jeune femme en âge de se marier. « Jeune femme » est naturel et lexicalement prudent; « vierge » serait trop précis et « jeune fille » pourrait suggérer un âge trop bas.
theological_decisions:
- issue: Priorité de l’hébreu face à un parallèle grec divergent
  choice: Traduire dans le texte principal le proverbe hébreu conservé.
  alternative: 'Le grec porte une maxime entièrement différente : « Ne fais rien sans avoir pris conseil et, après avoir agi, ne le regrette pas. »'
  rationale: Puisque l’hébreu est conservé avec une confiance élevée, il sert de texte source principal. La divergence substantielle du grec est signalée en note afin de préserver la transparence textuelle sans fusionner deux traditions distinctes.
translation_notes:
  register: Français international moderne, concis et sentencieux. La formulation « Tout mâle » est volontairement plus rude que « Tout homme » afin de préserver l’opposition hébraïque entre זכר (« mâle ») et איש (« homme »).
