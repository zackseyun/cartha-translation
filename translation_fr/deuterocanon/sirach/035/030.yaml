review_pass:
  verdict: revise
  source_fidelity: 'La première proposition rend correctement κρεῖσσον, τέκνα et la requête adressée au parent. En revanche, « que de te voir dépendre de tes fils » fait des enfants les sujets implicites de « voir », alors que l’infinitif grec ἐμβλέπειν a pour sujet la personne interpellée : c’est elle qui « regarde vers les mains » de ses fils, c’est-à-dire qui dépend d’eux. La révision restitue ce sujet sans imposer davantage que l’idée contextuelle de soutien.'
  naturalness: « Car il vaut mieux que tes enfants te demandent de l’aide que tu dépendes de tes fils » est une formulation moderne, directe et grammaticalement claire. Elle conserve le contraste familial et évite le calque obscur de l’image des mains, laquelle est expliquée en note.
