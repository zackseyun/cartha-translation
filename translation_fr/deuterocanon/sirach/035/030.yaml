    rationale: La tournure « que de te voir dépendre de tes fils » signifie que les enfants voient le parent dépendre, tandis que le grec oppose le fait que les enfants sollicitent le parent au fait que le parent lui-même regarde vers les mains de ses fils. Le texte révisé rend explicitement le parent sujet de « dépendes ».
  revised_text: Car il vaut mieux que tes enfants te demandent de l’aide[a] que tu dépendes de tes fils[b].
  revised_footnotes:
