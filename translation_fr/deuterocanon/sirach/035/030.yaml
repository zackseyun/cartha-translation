  yaml_path: translation/deuterocanon/sirach/035/030.yaml
  text: For it is better that your children should beg from you than that you should look to the hands of your sons[a][b].
translation:
  language: fr
  text: Car il vaut mieux que tes enfants te demandent de l’aide[a] que tu dépendes de tes fils[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « te supplient » ; le verbe grec peut désigner une demande pressante faite dans le besoin.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « que tu regardes vers les mains de tes fils », image qui évoque le fait d’attendre d’eux son soutien.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖσσον
  choice: il vaut mieux
  rationale: Cette tournure exprime naturellement en français moderne le jugement comparatif introduit par l’adjectif grec.
- source_word: τέκνα
  choice: enfants
  rationale: Le terme désigne les enfants au sens large et doit rester distinct du mot plus spécifiquement masculin employé ensuite.
- source_word: δεηθῆναί
  choice: demandent de l’aide
  rationale: Le verbe désigne ici une requête motivée par le besoin. Cette formulation garde l’idée de dépendance sans la connotation sociale plus étroite de « mendier ».
- source_word: ἐμβλέπειν εἰς χεῖρας
  choice: te voir dépendre de
  rationale: Littéralement, le grec parle de regarder vers les mains de quelqu’un; dans ce contexte, l’image exprime l’attente d’un soutien matériel. Le texte principal en donne le sens idiomatique, tandis que la note conserve l’image.
- source_word: υἱῶν
  choice: fils
  rationale: Contrairement à τέκνα, ce nom est spécifiquement masculin; « fils » préserve la distinction lexicale du grec.
theological_decisions:
- issue: Distinction de genre entre τέκνα et υἱῶν
  choice: Traduire τέκνα par « enfants » et υἱῶν par « fils ».
  alternative: Traduire les deux termes par « enfants » pour lisser la formulation.
  rationale: Le grec passe délibérément d’un terme général à un terme masculin précis; conserver cette différence rend le texte source transparent sans y importer une interprétation doctrinale.
- issue: Image des mains et dépendance familiale
  choice: Exprimer le sens idiomatique dans le texte et signaler l’image littérale en note.
  alternative: Conserver dans le texte « regarder vers les mains de tes fils ».
  rationale: Le calque littéral serait obscur en français courant. « Dépendre de » communique clairement la tension entre autorité parentale et dépendance matérielle, sans préciser au-delà du contexte la forme du soutien.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement singulier reproduit l’adresse personnelle du grec. La formulation principale privilégie une équivalence naturelle tout en préservant en note l’image concrète des mains.
