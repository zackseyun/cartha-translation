  text: Do not keep company with a prostitute[a], lest you be caught by her enticements.
translation:
  language: fr
  text: Ne fréquente pas une prostituée, de peur d’être pris dans ses pièges.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque rendue par « dans ses pièges » est difficile. Le grec parallèle lit « dans ses entreprises » ou « dans ses manœuvres », ce qui soutient l’idée de procédés destinés à prendre au piège.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִם זוֹנָה אַל תִּסְתַּיֵּד
  choice: Ne fréquente pas une prostituée
  rationale: La préposition עִם signifie « avec », tandis que le verbe rare תִּסְתַּיֵּד semble désigner ici une fréquentation prolongée. Le grec parallèle confirme l'idée de s'attarder en compagnie de quelqu'un. « Fréquenter » exprime naturellement cette association en français moderne sans suggérer nécessairement une intimité sexuelle déjà établie.
- source_word: זוֹנָה
  choice: une prostituée
  rationale: זוֹנָה désigne ici une prostituée. Ce terme est précis, actuel et moins archaïque ou insultant que d'autres équivalents possibles.
- source_word: פֶּן
  choice: de peur de
  rationale: פֶּן introduit la conséquence indésirable dont l'interdiction veut préserver. « De peur de » convient au ton sapientiel et reste naturel en français.
- source_word: תִּלָּכֵד
  choice: te laisser prendre
  rationale: Le nifal exprime le fait d'être pris ou capturé. Dans ce contexte figuré, « te laisser prendre » est idiomatique et conserve l'image du piège sans la rendre trop explicite.
- source_word: בְּלִקְחֹתֶיהָ
  choice: à ses séductions
  rationale: La forme hébraïque est difficile. Le grec ἐν τοῖς ἐπιχειρήμασιν αὐτῆς évoque ses entreprises, manœuvres ou procédés. « Ses séductions » convient au contexte, tandis que la note signale l'incertitude lexicale.
theological_decisions:
- issue: Rapport entre le texte hébreu et le parallèle grec pour l'expression finale difficile
  choice: Traduire l'hébreu comme témoin principal et rendre בְּלִקְחֹתֶיהָ par « à ses séductions », éclairé par le grec.
  alternative: « à ses manœuvres » ou « dans ses pièges »
  rationale: L'hébreu conservé demeure la base de la traduction, mais son dernier terme est obscur. Le parallèle grec soutient l'idée de procédés ou d'entreprises visant à prendre quelqu'un. Le choix retenu correspond au contexte tout en conservant l'incertitude dans une note.
translation_notes:
  register: Français international moderne, direct et digne. « Fréquente » rend l'idée d'une association suivie; « prostituée » est précis et non archaïque. La formulation conserve la brièveté de la maxime et signale en note l'ambiguïté du dernier mot hébreu.
