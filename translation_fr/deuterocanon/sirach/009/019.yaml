translation:
  language: fr
  text: Sache que tu marcheras parmi des pièges et que tu iras jusqu’à un filet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu conservé dit : « Sache que tu marcheras parmi des pièges et que tu iras jusqu’à un filet. » La tradition grecque présente ici un texte très différent : « Un homme bavard est redouté dans sa ville, et celui qui est téméraire dans ses paroles sera détesté. » La traduction suit l’hébreu conservé comme témoin principal, tout en signalant cette importante variante grecque.'
    reason: textual_variant
lexical_decisions:
- source_word: דַּע
  choice: Sache
  rationale: Impératif direct de ידע ; « Sache » conserve la concision et la force de l’exhortation hébraïque.
- source_word: בֵין פַּחִים
  choice: parmi des pièges
  rationale: פַּח désigne un piège ou un lacet ; avec בֵין au pluriel, l’expression évoque un déplacement au milieu de dangers.
- source_word: תִּצְעָד
  choice: tu marches
  rationale: צעד décrit le fait de faire des pas. « Tu marches » restitue naturellement en français le mouvement à pied sans surcharger l’image.
- source_word: וְעַד רֶשֶׁת
  choice: et… jusqu’à un filet
  rationale: עַד signifie normalement « jusqu’à » et רֶשֶׁת « filet ». La formulation, volontairement insolite, préserve le rapport spatial du texte sans affirmer que la personne est déjà prise.
- source_word: תִּתְהַלָּךְ
  choice: tu avances
  rationale: Le hitpael de הלך peut exprimer un déplacement continu ou répété. « Tu avances » est naturel ici et évite la répétition de « marcher » tout en gardant l’idée de progression.
- source_word: רֶשֶׁת
  choice: filet
  rationale: Le sens concret est « filet » ; le terme reste distinct de פַּחִים, « pièges », et maintient les deux images de danger.
