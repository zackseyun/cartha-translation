translation:
  language: fr
  text: Ne livre pas ton âme à une femme[a], au point de la laisser fouler tes hauteurs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu présente ici une forme difficile, qui pourrait être comprise comme une référence à la jalousie. Le grec porte : « Ne donne pas ton âme à une femme. »'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « tes hauteurs ». Le grec traduit le sens de l’image par « ta force », c’est-à-dire la puissance, la dignité ou la position personnelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּקְנֶא
  choice: Ne livre pas
  rationale: La forme hébraïque transmise est difficile et pourrait évoquer la jalousie, mais le grec μὴ δῷς (« ne donne pas ») atteste nettement l’idée de livrer ou céder sa personne. « Livrer » est naturel en français tout en conservant cette idée.
- source_word: נַפְשְׁךָ
  choice: ton âme
  rationale: נפש peut désigner l’âme, la vie ou la personne entière. « Ton âme » préserve l’image hébraïque et correspond au grec ψυχή sans réduire d’emblée le sens à « toi-même ».
- source_word: לְאִשָּׁה
  choice: à une femme
  rationale: אשה peut signifier « femme » ou « épouse ». L’absence de possessif et le parallèle grec favorisent ici le terme général « une femme ».
- source_word: לְהַדְרִיכָהּ
  choice: au point de la laisser fouler
  rationale: Le verbe évoque le fait de faire marcher ou fouler, et le grec ἐπιβῆναι confirme l’image de monter ou poser le pied sur quelque chose. « Au point de la laisser » exprime une conséquence possible sans présenter celle-ci comme le but recherché.
- source_word: עַל בָּמוֹתֶיךָ
  choice: tes hauteurs
  rationale: Le pluriel hébreu signifie littéralement « tes hauteurs » ou « tes hauts lieux ». Cette image est conservée dans le texte, tandis que le grec en explicite le sens par « ta force ».
theological_decisions:
- issue: Faut-il remplacer l’image par une mise en garde explicite contre la domination ?
  choice: Conserver les images de l’âme livrée et des hauteurs foulées.
  alternative: Ne te livre pas à une femme, de peur qu’elle ne prenne le pouvoir sur toi.
  rationale: Le verset relève de l’instruction sapientielle et emploie une métaphore. Une formulation abstraite sur la domination fixerait plus étroitement le sens et risquerait d’importer une thèse générale que le texte ne formule pas explicitement.
translation_notes:
  register: Français international actuel, sobre et digne. Le tour « au point de » rend la conséquence implicite de manière naturelle, tandis que « âme », « fouler » et « hauteurs » maintiennent les images concrètes du texte source.
