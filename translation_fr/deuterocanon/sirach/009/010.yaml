base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/009/010.yaml
  text: Do not abandon an old friend, for a new one is not equal to him; a new friend is like new wine—when it grows old, you will drink it with gladness.
translation:
  language: fr
  text: 'N’abandonne pas un ami de longue date, car un nouvel ami ne l’égale pas. Un nouvel ami est comme un vin nouveau : s’il vieillit, tu le boiras avec joie.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La ligne hébraïque fournie pour ce passage semble appartenir à un autre dicton et ne correspond pas à Siracide 9.10. La traduction suit donc ici le témoin grec.
    reason: textual_variant
lexical_decisions:
- source_word: Μὴ ἐγκαταλίπης
  choice: N’abandonne pas
  rationale: L’impératif négatif exprime l’idée de délaisser une relation; « abandonner » est direct, naturel et suffisamment fort en français moderne.
- source_word: φίλον ἀρχαῖον
  choice: un ami de longue date
  rationale: ἀρχαῖον désigne ici une amitié ancienne et durable, non l’âge de l’ami. Cette formulation évite l’ambiguïté possible de « vieil ami ».
- source_word: ὁ γὰρ πρόσφατος οὐκ ἔστιν ἔφισος αὐτῷ
  choice: car un nouvel ami ne l’égale pas
  rationale: La traduction conserve explicitement la comparaison et rend πρόσφατος par « nouvel », en accord avec le contraste et l’image du vin nouveau.
- source_word: οἶνος νέος φίλος νέος
  choice: Un nouvel ami est comme un vin nouveau
  rationale: Le grec juxtapose deux groupes nominaux de façon proverbiale. L’ajout de « est comme » explicite naturellement la comparaison en français sans en changer le sens.
- source_word: ἐὰν παλαιωθῇ
  choice: s’il vieillit
  rationale: « Si » conserve la forme conditionnelle de ἐάν avec le subjonctif et laisse subsister la nuance selon laquelle une relation nouvelle doit durer et mûrir.
- source_word: μετ’ εὐφροσύνης πίεσαι αὐτόν
  choice: tu le boiras avec joie
  rationale: Cette formulation restitue le futur et le complément nominal μετ’ εὐφροσύνης dans un français simple et digne.
theological_decisions:
- issue: Choix du témoin source pour Siracide 9.10
  choice: Traduire le texte grec parallèle
  alternative: Traduire la ligne hébraïque fournie sous cette référence
  rationale: La ligne hébraïque fournie traite de la beauté d’une femme et ne correspond pas au contenu de Siracide 9.10. Le grec transmet ici le verset relatif à l’ami ancien et au vin nouveau. Le suivre évite d’attribuer à 9.10 un dicton provenant manifestement d’un autre emplacement, tout en signalant honnêtement le problème textuel.
translation_notes:
  register: Français international moderne, au tutoiement sapientiel traditionnel mais courant. Le ton reste proverbial et digne; « ami de longue date » clarifie la durée de la relation, tandis que « s’il vieillit » préserve la condition exprimée en grec.
