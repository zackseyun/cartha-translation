translation:
  language: fr
  text: Tiens-toi loin d’un homme qui a le pouvoir de tuer[a], et ne crains pas les terreurs de la mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin grec présente ici une sentence très différente : « Que des hommes justes soient tes compagnons de table, et que ta fierté soit dans la crainte du Seigneur. » Le texte principal suit l’hébreu conservé pour ce verset.'
    reason: textual_variant
lexical_decisions:
- source_word: רְחַק
  choice: Tiens-toi loin
  rationale: L’impératif appelle à prendre délibérément ses distances. Cette formulation est naturelle en français moderne tout en conservant la force du commandement.
- source_word: מֵאִישׁ
  choice: d’un homme
  rationale: Le nom hébreu אִישׁ est ici au masculin singulier; « homme » en respecte la forme et convient à la figure puissante visée par cet enseignement de sagesse.
- source_word: שַׁלִּיט
  choice: qui a le pouvoir
  rationale: Le terme désigne quelqu’un qui détient autorité ou pouvoir. Avec « tuer », l’accent porte sur la capacité effective plutôt que nécessairement sur une fonction officielle.
- source_word: לַהֲרוֹג
  choice: de tuer
  rationale: L’infinitif signifie directement « tuer ». Cette traduction n’ajoute pas la nuance judiciaire qu’aurait « mettre à mort ».
- source_word: וְאַל תִּפְחַד
  choice: et ne crains pas
  rationale: Traduction concise et naturelle de l’impératif négatif.
- source_word: פַּחֲדֵי מַוֶת
  choice: les terreurs de la mort
  rationale: Le pluriel construit exprime littéralement des peurs ou des terreurs liées à la mort. « Les terreurs de la mort » en préserve le pluriel et l’intensité.
theological_decisions:
- issue: Divergence majeure entre les témoins hébreu et grec
  choice: Suivre dans le texte principal le témoin hébreu conservé et signaler en note la sentence très différente du grec.
  alternative: 'Le grec porte : « Que des hommes justes soient tes compagnons de table, et mets ta fierté dans la crainte du Seigneur. »'
  rationale: Puisque l’hébreu est conservé pour ce verset, il constitue la source principale. La différence grecque est substantielle et ne doit être ni harmonisée ni passée sous silence.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement singulier correspond à l’adresse sapientielle hébraïque. La formulation conserve le parallélisme des deux impératifs sans chercher à résoudre la tension apparente entre l’éloignement d’un homme meurtrier et l’absence de crainte devant les terreurs de la mort.
