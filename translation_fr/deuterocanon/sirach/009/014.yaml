  text: New wine[a], a new friend; when it grows old[b], you may drink it with pleasure.
translation:
  language: fr
  text: Vin nouveau, nouvel ami[a] ; quand il aura vieilli, alors peut-être le boiras-tu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu présente ici un proverbe elliptique : « Vin nouveau, nouvel ami ». Le texte grec transmis sous cette référence offre une lecture tout autre, qui évoque des pièges et les remparts des villes. La présente traduction suit le témoin hébreu conservé.'
    reason: textual_variant
  - marker: b
    text: 'Plus littéralement : « et vieux, après, peut-être le boiras-tu ». La fin de la phrase est difficile dans le texte hébreu transmis ; elle semble comparer l’ami nouveau à un vin que l’on boit après son vieillissement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַיִן חָדָשׁ
  choice: vin nouveau
  rationale: Équivalent direct et naturel de יַיִן (« vin ») et חָדָשׁ (« nouveau »), qui maintient le parallélisme proverbial.
- source_word: אוֹהֵב חָדָשׁ
  choice: ami nouveau
  rationale: אוֹהֵב peut désigner celui qui aime, donc un ami. La formulation nominale restitue l’ellipse hébraïque et son parallèle avec « vin nouveau » sans ajouter de copule.
- source_word: וְיָשָׁן
  choice: quand il aura vieilli
  rationale: יָשָׁן exprime ici le fait d’être devenu vieux. Le futur antérieur français rend naturellement la maturation préalable à la consommation, tout en laissant le référent grammatical dans l’ellipse proverbiale.
- source_word: אַחַר אוּלַי
  choice: alors peut-être
  rationale: La suite difficile associe l’idée d’après/ensuite à celle de possibilité. « Alors peut-être » conserve explicitement cette incertitude au lieu de la transformer en simple permission.
- source_word: תִּשְׁתֶּינוּ
  choice: le boiras-tu
  rationale: Le verbe signifie « boire » et la forme transmise comporte une terminaison pronominale difficile. Le masculin singulier renvoie naturellement au vin, mais l’incertitude textuelle est signalée en note.
theological_decisions:
- issue: Choix du texte de base malgré la divergence majeure entre l’hébreu et le grec
  choice: Traduire le proverbe conservé en hébreu sur le vin nouveau et l’ami nouveau.
  alternative: Suivre le grec, qui avertit que l’on marche au milieu de pièges et sur les remparts des villes.
  rationale: Le témoin hébreu est ici disponible et constitue la source première indiquée. Le grec transmis représente une forme substantiellement différente ; cette divergence doit être documentée plutôt que résolue en remplaçant silencieusement l’hébreu.
- issue: Interprétation morale implicite du proverbe
  choice: Conserver l’image elliptique de la maturation sans expliciter dans le corps du texte qu’une amitié devient agréable avec le temps.
  alternative: 'Paraphraser : « Tu apprécieras un nouvel ami quand l’amitié aura mûri. »'
  rationale: L’hébreu formule une comparaison concise et laisse au lecteur le soin d’en tirer l’application. Une explicitation doctrinale ou morale dans le verset réduirait sa tension proverbiale.
translation_notes:
  register: Français international moderne, sobre et proverbial. L’ordre nominal « Vin nouveau, ami nouveau » conserve la concision et le parallélisme de l’hébreu. « Alors peut-être » maintient l’incertitude réelle de la clause finale, tandis que les notes documentent à la fois sa difficulté et la forte divergence du grec.
