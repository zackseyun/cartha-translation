base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/009/020.yaml
  text: By your strength acquire your friend[b][a], and associate yourself with the wise.
translation:
  language: fr
  text: Selon tes moyens, gagne-toi un ami[a], et fréquente les sages[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « acquiers ton ami ». L’expression peut aussi se traduire : « Par ta force, acquiers-toi un ami. »'
    reason: lexical_alternative
  - marker: b
    text: 'Le verbe hébreu est rare et son sens précis est incertain. Le grec porte : « prends conseil auprès des sages ».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּכֹחֲךָ
  choice: selon tes moyens
  rationale: L’expression désigne littéralement la force, mais peut ici exprimer la capacité ou les ressources dont on dispose. « Selon tes moyens » rend naturellement cette portée et concorde avec le grec κατὰ τὴν ἰσχύν σου.
- source_word: קְנֵה
  choice: gagne-toi
  rationale: Le verbe signifie couramment « acquérir ». Appliqué à un ami, « gagne-toi » évite une connotation commerciale tout en conservant l’idée d’obtenir ou de s’attacher son amitié.
- source_word: רֵעֶךָ
  choice: un ami
  rationale: Le nom peut désigner un ami, un compagnon ou un prochain. Le contexte relationnel favorise ici « ami ».
- source_word: וְעִם חֲכָמִים
  choice: les sages
  rationale: Cette formulation naturelle désigne les personnes sages sans limiter inutilement le groupe aux hommes.
- source_word: תִּסְתַּיָּד
  choice: fréquente
  rationale: La forme hébraïque est rare et son sens précis incertain. « Fréquente » restitue prudemment l’idée d’association avec les sages, tandis que le grec comprend plus précisément « prends conseil ».
theological_decisions:
- issue: Portée du masculin pluriel חֲכָמִים
  choice: les sages
  alternative: les hommes sages
  rationale: Le masculin pluriel désigne ici une catégorie générale de personnes; « les sages » préserve cette portée sans introduire une restriction masculine absente du contexte.
- issue: Sens précis du verbe rare תִּסְתַּיָּד
  choice: fréquente
  alternative: prends conseil auprès des sages
  rationale: Le texte hébreu invite apparemment à se lier ou à s’associer aux sages, tandis que le grec explicite l’idée de consultation. Le texte principal conserve une formulation plus large et la note signale l’autre lecture.
translation_notes:
  register: Français international moderne, sobre et sapiential. Le tutoiement correspond à l’adresse individuelle de l’hébreu. « Gagne-toi un ami » reste digne et idiomatique; les notes préservent les ambiguïtés lexicales réelles.
