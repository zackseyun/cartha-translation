  text: Do not give yourself to a prostitute[b][a], lest you squander your inheritance.
translation:
  language: fr
  text: Ne te livre pas à une prostituée, de peur que tu ne détournes ton héritage[b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Détourne les yeux d’une belle femme et ne contemple pas la beauté d’une autre ; car la beauté d’une femme en a égaré beaucoup, et par elle la passion s’embrase comme un feu. » Le témoin grec est ici nettement plus développé que l’hébreu conservé.'
    reason: alternative_reading
  - marker: b
    text: L’hébreu « ton héritage » peut désigner les biens d’une personne, son patrimoine ou sa part héréditaire. Le verbe peut suggérer que cet héritage est détourné, aliéné, perdu ou dissipé.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתֵּן
  choice: Ne te livre pas
  rationale: La défense suivie de נתן, avec נַפְשְׁךָ comme complément, exprime ici le fait de se donner ou de s’abandonner à quelqu’un. « Ne te livre pas » est naturel en français et conserve la force de l’avertissement.
- source_word: לְזוֹנָה
  choice: à une prostituée
  rationale: זוֹנָה désigne précisément une prostituée ou une femme qui se prostitue. « Prostituée » est le terme moderne le plus clair, sans l’archaïsme de « courtisane » ni l’élargissement de « femme immorale ».
- source_word: נַפְשְׁךָ
  choice: te
  rationale: נפש peut désigner la personne elle-même, et non seulement l’âme au sens immatériel. Le pronom réfléchi dans « te livre » rend idiomatiquement l’idée de livrer toute sa personne.
- source_word: פֶּן
  choice: de peur que… ne
  rationale: פן introduit une conséquence redoutée. La tournure française « de peur que… ne » en conserve la valeur d’avertissement et le ton sapientiel.
- source_word: תָּסֵב
  choice: tu ne détournes
  rationale: Le verbe évoque ici l’action de faire passer ailleurs ou de détourner. « Détournes » reste proche de l’image hébraïque et évite de trancher entièrement entre dilapider, perdre et aliéner.
- source_word: נַחֲלָתֶךָ
  choice: ton héritage
  rationale: נחלה désigne un héritage, un patrimoine ou une part héréditaire. « Héritage » conserve à la fois les dimensions matérielle et familiale du terme.
theological_decisions:
- issue: Le texte grec présente une forme nettement plus longue et différente du verset.
  choice: Suivre le texte hébreu conservé dans le corps du verset et signaler intégralement la forme grecque en note.
  alternative: 'Prendre pour texte principal la forme grecque : « Détourne les yeux d’une belle femme… »'
  rationale: Lorsque le texte hébreu du Siracide est conservé avec une bonne fiabilité, il constitue ici le témoin principal. Le grec semble représenter une recension plus développée ou différente, trop importante toutefois pour être omise.
- issue: Sens précis de la perte ou du détournement de l’héritage
  choice: Conserver l’image ouverte de l’hébreu avec « détournes ton héritage ».
  alternative: Expliciter par « dilapides », « perdes » ou « aliènes ton héritage ».
  rationale: Ces solutions sont possibles dans le contexte, mais chacune précise davantage le mécanisme de la perte. Le choix retenu préserve l’ambiguïté entre dissipation, aliénation et transfert du patrimoine.
translation_notes:
  register: Français international moderne, sobre et sapientiel. « Ne te livre pas » est direct sans être archaïque ; la formulation conserve la concision de l’hébreu et sa part d’ambiguïté.
