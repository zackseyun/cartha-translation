  naturalness: '« Ne fixe pas ton regard » est naturel dans un registre sapientiel moderne. En revanche, « une jeune vierge » est redondant et légèrement appuyé en français actuel : « une vierge » porte déjà la précision lexicale du terme hébreu. « Te laisser prendre par les peines » est moins direct et donne aux peines un rôle d’agent; « être pris dans les peines » restitue plus naturellement le passif et l’ambiguïté de l’hébreu.'
  terminology: « Vierge » conserve la spécificité de בְּתוּלָה sans élargir le terme à « jeune femme ». « Peines » est possible pour עֳנָשִׁים, mais la construction « les peines qui la concernent » doit demeurer ouverte, car le suffixe féminin ne permet pas de préciser qui subit les sanctions ni de quelle implication elles résultent.
