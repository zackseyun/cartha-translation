  text: Do not gaze at a virgin[b][a], lest you be ensnared by the penalties concerning her.
translation:
  language: fr
  text: Ne fixe pas ton regard sur une vierge, de peur d’être pris dans les peines qui la concernent.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de peur d’être pris dans les peines liées à elle ». L’expression hébraïque est condensée et peut désigner les conséquences ou sanctions attachées à une implication avec elle.'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec porte : « Ne regarde pas autour de toi dans les rues d’une ville et ne va pas errer dans ses lieux déserts. » Les témoins hébreu et grec diffèrent ici de manière importante.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּבְתוּלָה
  choice: sur une jeune vierge
  rationale: Le nom désigne une jeune femme non mariée, avec l’idée de virginité. « Jeune vierge » conserve cette précision tout en étant plus naturel en français dans cette exhortation.
- source_word: אַל תִּתְבּוֹנֵן
  choice: Ne fixe pas ton regard
  rationale: La forme verbale évoque une observation attentive ou prolongée, et non un simple coup d’œil. Cette expression rend clairement l’idée d’un regard insistant.
- source_word: פֶּן
  choice: de peur de
  rationale: La particule introduit le risque contre lequel porte l’avertissement. « De peur de » convient au registre sapientiel sans être archaïque.
- source_word: תִּוָּקֵש
  choice: te laisser prendre
  rationale: Le passif exprime le fait d’être pris ou piégé. Cette formulation naturelle en français garde l’image implicite du piège sans préciser excessivement son mécanisme.
- source_word: בַּעֲנָשֶׁיהָ
  choice: par les peines qui la concernent
  rationale: עֹנֶשׁ désigne une peine ou une sanction, et le suffixe est féminin singulier. La relation exacte étant condensée, cette formulation ne décide pas si les peines frappent la jeune femme, l’homme impliqué avec elle, ou découlent plus largement de cette implication.
theological_decisions:
- issue: Divergence importante entre les témoins hébreu et grec
  choice: Traduire l’hébreu dans le texte principal et signaler le grec en note.
  alternative: Suivre le grec, qui avertit de ne pas parcourir les rues et les lieux déserts d’une ville, ou fusionner les deux leçons.
  rationale: Le témoin hébreu disponible est donné comme hautement fiable et doit gouverner le texte principal. La leçon grecque est matériellement différente et doit rester visible sans harmonisation.
- issue: Référent exact des peines
  choice: 'Employer une formulation relationnelle volontairement ouverte : « les peines qui la concernent ».'
  alternative: Préciser qu’il s’agit soit des peines qu’elle subit, soit des sanctions encourues par celui qui s’engage avec elle.
  rationale: L’hébreu est comprimé et ne permet pas de résoudre avec certitude cette relation. La traduction préserve donc la tension plutôt que d’introduire une interprétation morale ou juridique particulière.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier correspond au caractère personnel de l’exhortation hébraïque. « Fixe pas ton regard » rend l’insistance du regard, tandis que les notes conservent l’ambiguïté de la sanction et la variante grecque substantielle.
