translation:
  language: fr
  text: Ne fréquente pas les musiciennes[a], de peur qu’elles ne te brûlent par leurs bouches.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Ne livre pas ton âme aux prostituées, de peur que tu ne perdes ton héritage. » Il rend explicite la mise en garde sexuelle, là où l’hébreu parle de « musiciennes » et du danger d’être brûlé « par leurs bouches ».'
    reason: alternative_reading
lexical_decisions:
- source_word: עִם מְנַגְּנוֹת
  choice: les chanteuses
  rationale: מְנַגְּנוֹת désigne des femmes qui pratiquent la musique ou le chant. « Chanteuses » conserve le féminin pluriel et l’image concrète de l’hébreu sans rendre explicite une connotation sexuelle que seul le parallèle grec formule clairement.
- source_word: אַל תִּדְמוֹךְ
  choice: Ne fréquente pas
  rationale: Le verbe, rare ou incertain sous cette forme, évoque ici une proximité ou une association étroite. « Fréquenter » exprime naturellement en français cette mise en garde relationnelle, sans surtraduire par une intimité nécessairement sexuelle.
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Cette tournure française exprime normalement la conséquence redoutée introduite par פֶּן.
- source_word: יִשְׂרְפֻךָ
  choice: qu’elles ne te brûlent
  rationale: La forme verbale a pour sujet féminin pluriel les chanteuses. La traduction active suit directement l’hébreu et préserve la métaphore de la brûlure ou de la destruction.
- source_word: בְּפִיפִיֹתָם
  choice: par leur bouche
  rationale: La formulation concrète de l’hébreu renvoie à la bouche, probablement aux paroles ou au chant comme moyen de séduction et de ruine. La traduction littérale maintient cette image inhabituelle et son ambiguïté.
theological_decisions:
- issue: Divergence entre les témoins hébreu et grec
  choice: 'Suivre dans le texte principal l’hébreu conservé : mise en garde contre la fréquentation de chanteuses et contre la brûlure causée « par leur bouche ».'
  alternative: « Ne livre pas ton âme aux prostituées, de peur de perdre ton héritage. »
  rationale: L’hébreu est ici extant et constitue le texte source principal. Le grec explicite une mise en garde sexuelle et remplace l’image de la bouche qui brûle par la perte de l’héritage. Comme cette divergence modifie sensiblement le sens, la lecture grecque est signalée en note plutôt qu’intégrée silencieusement au texte.
translation_notes:
  register: Français international moderne, sobre et digne. « Ne fréquente pas » est courant sans être familier. Le tour « de peur que… ne » convient au registre sapientiel, et « par leur bouche » conserve volontairement l’image énigmatique de l’hébreu.
