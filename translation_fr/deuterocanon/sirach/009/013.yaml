  text: Keep far away from a man who has authority to kill, and you will not have to fear death.[a]
translation:
  language: fr
  text: Tiens-toi loin d’un homme qui a le pouvoir de tuer, et tu n’auras pas à craindre la mort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin hébreu conservé donne ici une autre sentence : « N’abandonne pas un vieil ami, car un nouveau ne l’égalera pas. » La tradition grecque transmet plutôt l’avertissement figurant dans le texte principal.'
    reason: alternative_reading
lexical_decisions:
- source_word: μακρὰν ἄπεχε
  choice: Tiens-toi loin
  rationale: L’impératif grec appelle à garder délibérément ses distances. Cette formulation est naturelle en français moderne et conserve la force de l’ordre.
- source_word: ἀπὸ ἀνθρώπου
  choice: d’un homme
  rationale: Le singulier grec désigne ici un individu concret; « un homme » en donne une traduction directe.
- source_word: ὃς ἔχει ἐξουσίαν
  choice: qui a le pouvoir
  rationale: ἐξουσία peut désigner l’autorité ou le pouvoir d’agir. « Le pouvoir » reste naturel et préserve l’ambiguïté entre pouvoir reconnu et capacité effective.
- source_word: τοῦ φονεῦσαι
  choice: de tuer
  rationale: L’infinitif désigne le fait d’ôter la vie sans préciser s’il s’agit d’un meurtre illégal ou d’une exécution officielle.
- source_word: καὶ οὐ μὴ ὑποπτεύσῃς φόβον θανάτου
  choice: et tu n’auras pas à craindre la mort
  rationale: Le verbe peut exprimer le soupçon ou l’appréhension. Dans ce contexte, la formulation rend clairement l’idée d’une crainte anticipée de la mort.
theological_decisions:
- issue: Divergence majeure entre le témoin hébreu conservé et la tradition grecque de Siracide 9.13
  choice: Traduire dans le texte principal la leçon grecque correspondant à ce numéro de verset.
  alternative: « N’abandonne pas un vieil ami, car un nouveau ne l’égalera pas. »
  rationale: Les deux traditions transmettent ici des sentences entièrement différentes. La leçon grecque est retenue comme texte principal selon l’identification du verset fournie, tandis que la leçon hébraïque conservée est explicitement signalée en note afin de ne pas masquer la divergence textuelle.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier convient au style sapientiel de l’exhortation. La formulation évite de préciser si le pouvoir de tuer est légal, politique ou simplement effectif.
