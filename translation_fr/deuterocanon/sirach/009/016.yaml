translation:
  language: fr
  text: Que ta réflexion s’exerce avec des personnes avisées, et que tous tes propos soient conformes à la Loi du Très-Haut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu conservé dans les manuscrits de la Gueniza du Caire porte plutôt : « Ne jalouse pas l’insolent qui réussit ; souviens-toi que, d’ici à sa mort, il ne restera pas impuni. » Cette leçon semble représenter une ligne différente ou déplacée ; le texte principal suit donc ici le grec.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ μετὰ συνετῶν
  choice: avec des gens avisés
  rationale: συνετός désigne une personne douée d’intelligence et de discernement. « Des gens avisés » est naturel, actuel et non genré en français.
- source_word: ἔστω ὁ διαλογισμός σου
  choice: que ta réflexion se fasse
  rationale: διαλογισμός peut désigner la réflexion, le raisonnement ou la délibération. La tournure avec « que » restitue la valeur exhortative de ἔστω sans alourdir la phrase.
- source_word: πᾶσα διήγησίς σου
  choice: tous tes propos
  rationale: διήγησις peut désigner le discours, le récit ou la conversation. « Tous tes propos » garde ici une portée générale et idiomatique.
- source_word: ἐν νόμῳ Ὑψίστου
  choice: soient conformes à la Loi du Très-Haut
  rationale: Dans ce contexte sapientiel, ἐν νόμῳ indique que les propos doivent rester dans le cadre de la Loi et être réglés par elle. « Conformes à » exprime naturellement cette relation en français; « Très-Haut » conserve le titre divin.
theological_decisions:
- issue: Choix du témoin principal face à la divergence entre l’hébreu conservé et le grec
  choice: Traduire dans le texte principal la ligne grecque correspondant à Siracide 9.16 et signaler la leçon hébraïque divergente en note.
  alternative: 'Traduire comme texte principal l’hébreu conservé : « Ne jalouse pas l’insolent qui réussit ; souviens-toi que, jusqu’à la mort, il ne restera pas impuni. »'
  rationale: L’hébreu composite de la Gueniza est signalé ici comme présentant une divergence majeure et semble conserver une ligne différente ou déplacée. Le grec fournit la ligne cohérente avec la référence traditionnelle du verset. La note maintient toutefois la transparence sur le témoignage hébreu au lieu d’effacer cette tension textuelle.
translation_notes:
  register: Français international moderne, digne et accessible. Tutoiement singulier maintenu selon les formes de deuxième personne du grec. « Loi » prend une majuscule puisqu’il s’agit de l’instruction divine du Très-Haut.
