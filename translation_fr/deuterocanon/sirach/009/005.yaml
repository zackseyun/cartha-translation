  text: Do not debase yourself by the sight of your eyes[b][a], nor be appalled after her house.
translation:
  language: fr
  text: Ne te déshonore pas par ce que voient tes yeux, et ne sois pas dévasté à cause de sa maison[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement « après sa maison ». L’expression est difficile : elle peut évoquer le fait de poursuivre les gens de sa maison, de la suivre jusque chez elle, ou d’être ruiné à cause de son foyer.'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec présente une formulation sensiblement différente : « Ne fixe pas une vierge du regard, de peur de trébucher à cause des peines — ou des reproches — liés à elle. »'
    reason: alternative_reading
lexical_decisions:
- source_word: לְהִתְנַבֵּל
  choice: te déshonore pas
  rationale: 'Le hitpael de נבל a ici une valeur réfléchie : se rendre méprisable, s’avilir ou se déshonorer. « Te déshonore pas » garde cette force sans employer un terme inutilement archaïque.'
- source_word: בְּמַרְאֵה עֵינֵיךָ
  choice: à cause de ce que voient tes yeux
  rationale: Littéralement « par la vue de tes yeux ». La formulation française conserve le rôle du regard et suggère l’attrait visuel sans préciser davantage son objet.
- source_word: וּלְשׁוֹמֵם
  choice: jusqu’à ta ruine
  rationale: שמם peut évoquer l’effroi, la dévastation ou la ruine. Dans cette construction difficile, « jusqu’à ta ruine » exprime naturellement en français la conséquence redoutée, tout en signalant en note l’autre nuance possible.
- source_word: אֲחַר בֵּיתָהּ
  choice: après sa maison
  rationale: Le texte porte littéralement « après sa maison ». « Courir après » rend en français l’idée possible de poursuivre ou de fréquenter son foyer, mais la difficulté et l’ambiguïté de l’hébreu sont explicitement conservées en note.
theological_decisions:
- issue: Choix entre le texte hébreu conservé et le parallèle grec divergent
  choice: Traduire l’hébreu dans le texte principal et donner le grec en note
  alternative: 'Suivre le grec : « Ne dévisage pas une jeune fille, de peur de trébucher à cause des peines — ou des reproches — liés à elle. »'
  rationale: Le témoin hébreu est ici disponible et constitue la source principale. Comme le grec transmet une exhortation sensiblement différente plutôt qu’une simple variante de formulation, sa lecture est présentée sans harmonisation dans une note.
translation_notes:
  register: Français international moderne, sobre et sentencieux. La première proposition reste proche de l’image hébraïque du regard. Dans la seconde, une légère explicitation rend intelligible la construction très elliptique, tandis que les notes maintiennent son incertitude lexicale et la divergence du grec.
