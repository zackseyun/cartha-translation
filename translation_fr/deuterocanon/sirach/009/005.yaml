  source_fidelity: La première proposition rend globalement היטנבל et l’expression du regard, mais la seconde du brouillon remplace la construction hébraïque elliptique « être dévasté / désolé après (ou à cause de) sa maison » par « ne cours pas après sa maison jusqu’à ta ruine ». « Courir après » n’est pas exprimé par le verbe hébreu, et « jusqu’à ta ruine » transfère la force de לשומם dans une subordonnée de résultat absente du texte.
  naturalness: « Ne te déshonore pas par ce que voient tes yeux » est un français moderne et intelligible, de ton sentencieux. « Ne sois pas dévasté à cause de sa maison » est naturel, tout en constituant une interprétation prudente de la préposition difficile, explicitement signalée en note.
  terminology: « Se déshonorer » convient au hitpael de נבל, sans archaïsme excessif. « Dévasté » conserve la force de שמם mieux que l’ajout interprétatif « jusqu’à ta ruine ». La note grecque doit employer « vierge », correspondant à παρθένον, plutôt que généraliser en « jeune fille ».
