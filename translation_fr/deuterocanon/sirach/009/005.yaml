  - severity: medium
    issue: Recomposition de « jusqu’à ta ruine »
    rationale: Cette formulation transforme l’admonition elliptique en une relation de moyen et de conséquence qui n’est pas explicitement présente. Elle réduit aussi les nuances possibles de שמם (désolation, dévastation, stupeur).
  - severity: low
