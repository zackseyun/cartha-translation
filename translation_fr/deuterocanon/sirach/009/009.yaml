base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/009/009.yaml
  text: Turn your eyes away from a graceful woman[a], and do not gaze at beauty that is not yours.
translation:
  language: fr
  text: Détourne les yeux d’une femme pleine de charme[a], et ne contemple pas une beauté qui n’est pas à toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec dit : « Ne t’assieds jamais avec la femme d’un autre et ne bois pas de vin avec elle, de peur que ton âme ne se détourne vers elle et que, par ton esprit, tu ne glisses vers la perdition. » Le témoin hébreu est ici plus bref et plus général.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַעֲלִים עַיִן
  choice: Détourne les yeux
  rationale: L’expression signifie littéralement « cacher l’œil », mais elle invite ici à détourner volontairement le regard. Cette formulation est naturelle en français et conserve la force de l’impératif.
- source_word: אֵשֶׁת חֵן
  choice: une femme pleine de charme
  rationale: Le syntagme signifie « une femme de grâce/charme ». « Pleine de charme » exprime l’attrait sans le réduire à la seule beauté physique, nommée séparément dans la proposition suivante.
- source_word: תַּבִּיט
  choice: contemple
  rationale: Le verbe désigne ici un regard dirigé et soutenu, davantage qu’un simple coup d’œil. « Contempler » rend cette nuance dans un français actuel et digne.
- source_word: יֹפִי
  choice: beauté
  rationale: « Beauté » est l’équivalent direct et naturel du substantif hébreu.
- source_word: לֹא לָךְ
  choice: qui n’est pas à toi
  rationale: La formulation garde la brièveté et l’ambiguïté possessive de l’hébreu, sans limiter explicitement l’avertissement à la femme d’un autre homme.
theological_decisions:
- issue: Rapport entre le texte hébreu bref et le parallèle grec développé
  choice: Suivre le texte hébreu dans le corps du verset et signaler le parallèle grec en note
  alternative: Traduire le développement grec concernant la femme mariée d’un autre, le vin et le risque de perdition
  rationale: Puisque le témoin hébreu est disponible et jugé fiable, il fonde le texte principal. Le grec précise le contexte moral possible, mais son développement ne doit pas être introduit silencieusement dans la formulation hébraïque, plus générale.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le tutoiement singulier correspond aux impératifs masculins singuliers de l’hébreu. La formulation conserve la distinction entre le charme (חֵן) et la beauté (יֹפִי), ainsi que l’indétermination de « qui n’est pas à toi ».
