  text: Do not envy a wicked man[a], for you do not know what his day will be.
translation:
  language: fr
  text: N’envie pas un homme méchant[a], car tu ne sais pas quel sera son jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin grec présente ici une autre sentence : « Selon tes moyens, sois attentif à tes proches, et consulte les sages. »'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תְּקַנֵּא
  choice: N’envie pas
  rationale: Le verbe קנא construit avec ב exprime ici l’envie à l’égard d’une personne. Cette formulation est concise et naturelle dans une maxime de sagesse.
- source_word: בְּאִישׁ רָשָׁע
  choice: un homme méchant
  rationale: אישׁ désigne explicitement un homme au singulier, et רשע caractérise une personne moralement mauvaise. « Méchant » garde cette portée morale sans réduire le terme à la culpabilité juridique.
- source_word: כִּי לֹא תֵּדֵע
  choice: car tu ne sais pas
  rationale: כִּי introduit la raison de l’interdiction. « Car » conserve le ton proverbial et soutenu tout en restant courant.
- source_word: מַה יּוֹמוֹ
  choice: ce que sera son jour
  rationale: L’hébreu dit littéralement « ce que son jour [sera] ». La traduction conserve la métaphore et son ambiguïté, sans ajouter l’idée de ce que ce jour « apportera » ni identifier explicitement ce jour à la fin de l’homme.
theological_decisions:
- issue: Divergence entre les témoins hébreu et grec
  choice: Traduire le texte hébreu conservé comme témoin principal et signaler en note la sentence très différente du grec.
  alternative: « Dans la mesure de tes forces, apprends à connaître tes proches, et prends conseil auprès des sages. »
  rationale: Lorsque le texte hébreu du Siracide subsiste avec une bonne assurance, il constitue la base de traduction. Le grec ne représente pas ici une simple variante de formulation, mais une autre sentence; cette divergence importante doit donc rester visible sans remplacer l’hébreu.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le tutoiement singulier correspond à l’admonition hébraïque. La tournure volontairement concise « ce que sera son jour » préserve l’ellipse et l’ambiguïté du texte source.
