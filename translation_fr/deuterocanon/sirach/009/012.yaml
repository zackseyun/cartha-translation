translation:
  language: fr
  text: De peur que ton cœur ne penche vers elle et que, dans le sang[a], tu ne te tournes vers la fosse.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par le sang versé » ; le rapport exact exprimé par l’hébreu est incertain.'
    reason: Le syntagme בְדָמִים peut évoquer le sang, le sang versé ou une circonstance violente, sans préciser nettement le lien syntaxique.
  - marker: b
    text: 'Le grec présente ici un texte différent : « Ne prends pas plaisir à la prospérité des impies ; souviens-toi qu’ils ne seront pas tenus pour justes jusqu’au séjour des morts. »'
    reason: La tradition grecque ne correspond pas au contenu du témoin hébreu et constitue une variante textuelle importante.
lexical_decisions:
- source_word: תַּטֶּה אֵלֶיהָ לֵב
  choice: tu n’inclines ton cœur vers elle
  rationale: Le verbe תטה est à la deuxième personne du masculin singulier, אֵלֶיהָ désigne explicitement un référent féminin singulier (« vers elle »), et לֵב est rendu naturellement par « ton cœur » en français.
- source_word: וּבְדָמִים
  choice: et que, dans le sang
  rationale: La préposition ב avec le pluriel דמים permet une formulation circonstancielle. « Dans le sang » conserve l’image et son ambiguïté, notamment la possibilité du sang versé, sans préciser abusivement le rapport logique.
- source_word: תִּטֶּה אֶל שָׁחַת
  choice: tu ne te diriges vers la fosse
  rationale: La répétition de נטה exprime ici une orientation vers une destination. « Te diriges » est idiomatique tout en gardant le mouvement vers שחת, rendu par « la fosse » plutôt que par une interprétation plus spécifiquement eschatologique.
theological_decisions:
- issue: Référent de אֵלֶיהָ
  choice: elle
  alternative: eux
  rationale: Le texte hébreu porte un suffixe féminin singulier non ambigu grammaticalement. La traduction suit donc l’hébreu malgré le pluriel de la couche anglaise révisée.
- issue: Sens de שָׁחַת
  choice: la fosse
  alternative: la perdition / le séjour des morts
  rationale: « La fosse » préserve l’image concrète et la latitude sémantique du terme sans imposer une identification théologique précise.
- issue: Divergence avec le grec
  choice: traduire le texte hébreu et signaler la variante grecque
  alternative: 'suivre le grec : ne pas prendre plaisir à la prospérité des impies'
  rationale: La consigne donne priorité au témoin hébreu de haute confiance. Le grec atteste ici un texte entièrement différent et doit être documenté plutôt que fusionné avec l’hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. La construction « de peur que… ne » conserve la valeur préventive de פן ; le « ne » est explétif et n’ajoute pas une seconde négation. La répétition hébraïque du verbe נטה est rendue par deux verbes français proches mais idiomatiques.
