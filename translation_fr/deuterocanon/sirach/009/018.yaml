review_pass:
  verdict: revise
  source_fidelity: Le texte principal suit à juste titre le témoin hébreu, qui diverge radicalement du grec. Toutefois, לֹא תֶאְשָׁם est plus exactement une affirmation (« tu ne seras pas tenu pour coupable ») qu’une défense (« ne te rends pas coupable »). La forme תִּקַּח est grammaticalement ambiguë entre « tu prendras » et « elle prendra »; le contexte immédiat fourni ne permet pas de justifier l’ajout certain d’un sujet féminin.
  naturalness: La formulation proposée est généralement claire et de registre approprié, mais « ne te rends pas coupable » modifie la modalité de l’hébreu. Une formulation déclarative est à la fois plus fidèle et naturelle.
  terminology: « Tenu pour coupable » rend bien אשׁם dans ce contexte. « Vie » est une bonne équivalence contextuelle de נִשְׁמָתֶךָ. La note doit signaler que le grec est non seulement différent, mais qu’il est la leçon retenue dans l’audit anglais; elle ne doit pas faire passer cette question textuelle pour une simple variante mineure.
  issues:
  - severity: medium
    issue: Modalité de לֹא תֶאְשָׁם
    rationale: Le yiqtol négatif se rend naturellement ici par « tu ne seras pas tenu pour coupable »; « ne te rends pas coupable » impose une injonction réflexive absente de la forme hébraïque.
  - severity: medium
    issue: Sujet féminin affirmé pour תִּקַּח
    rationale: La forme hébraïque peut être comprise comme une 3e personne féminine singulière ou une 2e personne masculine singulière. Sans antécédent féminin explicite dans le verset fourni, « elle » tranche une ambiguïté que le texte ne résout pas à lui seul.
  revised_text: Et si tu t’approches, tu ne seras pas tenu pour coupable, de peur que tu ne prennes ta vie.[a]
  revised_footnotes:
  - marker: a
    text: 'Le témoin grec donne ici une sentence entièrement différente : « Entre les mains des artisans, une œuvre sera louée, et le chef d’un peuple est sage dans ses paroles. » Le texte hébreu et le texte grec divergent donc fortement. La forme hébraïque rendue par « tu ne prennes » peut aussi se comprendre « elle ne prenne », mais aucun antécédent féminin n’est exprimé dans ce verset.'
    reason: alternative_reading
  revision_rationale: La révision restitue la valeur déclarative de la négation hébraïque et ne fait plus de la forme verbale finale ambiguë une action certaine d’un sujet féminin. La note conserve intégralement l’importante leçon grecque et explicite l’ambiguïté grammaticale du dernier verbe, sans tenter de l’harmoniser avec le grec ni imposer une interprétation contextuelle.
