translation:
  language: fr
  text: Et si tu t’approches, ne te rends pas coupable, de peur qu’elle ne te prenne la vie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin grec présente ici une sentence tout à fait différente : « Entre les mains des artisans, une œuvre sera louée, et le chef d’un peuple est sage dans ses paroles. »'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם קָרַבְתָּ
  choice: Et si tu t’approches
  rationale: Le verbe קרב exprime le fait de s’approcher. Le présent français convient à la portée générale de l’avertissement, tandis que « si » conserve la condition.
- source_word: לֹא תֶאְשָׁם
  choice: ne te rends pas coupable
  rationale: La forme peut exprimer une défense ou l’absence de culpabilité. Dans cet avertissement, la tournure française négative rend naturellement la valeur jussive possible sans préciser la nature de la faute.
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Cette construction française rend la mise en garde introduite par פן, avec l’idée d’éviter une conséquence redoutée.
- source_word: תִּקַּח
  choice: qu’elle ne te prenne
  rationale: La forme consonantique peut être comprise comme une troisième personne féminine singulière ou une deuxième personne masculine singulière. La lecture féminine, cohérente avec le contexte de l’avertissement, est retenue dans le texte, sans masquer dans la note la divergence beaucoup plus vaste du témoin grec.
- source_word: אֶת נִשְׁמָתֶךָ
  choice: la vie
  rationale: נשמה désigne ici la vie ou le souffle vital. « Te prendre la vie » est une expression française naturelle qui conserve la gravité concrète de la menace.
theological_decisions:
- issue: Divergence majeure entre les témoins hébreu et grec de Siracide 9.18
  choice: Traduire dans le texte principal la leçon hébraïque conservée par les manuscrits de la Guéniza du Caire.
  alternative: 'Suivre le grec : « Entre les mains des artisans, une œuvre sera louée, et le chef d’un peuple est sage dans ses paroles. »'
  rationale: La source hébraïque fournie est donnée avec un degré de confiance élevé. Puisque les deux témoins présentent ici des sentences entièrement différentes, la leçon grecque ne doit pas être combinée avec l’hébreu; elle est signalée intégralement en note afin de préserver honnêtement l’incertitude textuelle.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement singulier correspond aux formes hébraïques de deuxième personne et convient au ton d’exhortation sapientielle.
