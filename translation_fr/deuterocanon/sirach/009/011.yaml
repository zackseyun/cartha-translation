translation:
  language: fr
  text: Ne partage pas de repas avec son mari[a] et ne t’attable pas avec lui dans l’ivresse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle dit : « N’envie pas la gloire du pécheur, car tu ne sais pas quelle sera sa ruine. » Le texte hébreu conservé ici diffère considérablement de la tradition grecque.'
    reason: alternative_reading
lexical_decisions:
- source_word: עִם בַּעְלָהּ
  choice: avec son mari
  rationale: עִם marque l’association, et בַּעְלָהּ désigne ici le mari de la femme évoquée dans le contexte, plutôt qu’un maître ou propriétaire.
- source_word: אַל תִּטְעָם
  choice: Ne partage pas de repas
  rationale: Le verbe signifie littéralement « goûter », mais, avec une personne introduite par עִם, il évoque naturellement le fait de manger ensemble. Cette formulation restitue la dimension sociale du repas.
- source_word: וְאַל תָּסֵב
  choice: et ne t’attable pas
  rationale: Le verbe peut désigner le fait de s’asseoir ou de s’allonger à table. « S’attabler » exprime ce cadre convivial en français naturel sans imposer la posture antique.
- source_word: עִמּוֹ שִׁכּוֹר
  choice: avec lui pour boire jusqu’à l’ivresse
  rationale: עִמּוֹ renvoie au mari. שִׁכּוֹר exprime l’état d’ivresse; dans le cadre de la table, la formulation française rend l’idée d’une consommation de boisson conduisant à cet état, tout en évitant l’ambiguïté peu naturelle de « avec lui, ivre ».
theological_decisions:
- issue: Divergence substantielle entre le témoin hébreu conservé et la tradition grecque
  choice: Le texte principal suit l’hébreu et présente une mise en garde contre le fait de manger et de boire avec le mari d’une femme.
  alternative: 'La tradition grecque dit : « N’envie pas la gloire du pécheur, car tu ne sais pas quelle sera sa fin. »'
  rationale: Puisque le texte hébreu est conservé ici avec une confiance élevée, il sert de source principale. La lecture grecque, entièrement différente, est signalée en note afin de préserver honnêtement la divergence textuelle sans la résoudre artificiellement.
translation_notes:
  register: Français international moderne, digne et accessible. « Partager un repas » et « s’attabler » conservent le cadre social des deux verbes hébreux; « jusqu’à l’ivresse » explicite naturellement la valeur de שִׁכּוֹר dans ce contexte.
