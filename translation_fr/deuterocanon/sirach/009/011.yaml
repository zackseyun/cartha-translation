  source_fidelity: La première proposition rend fidèlement עִם בַּעְלָהּ אַל תִּטְעָם. Dans la seconde, « pour boire jusqu’à l’ivresse » introduit un but et un déroulement (« boire jusqu’à ») qui ne sont pas exprimés par שִׁכּוֹר, terme qui désigne plutôt l’état ou le contexte d’ivresse. « Dans l’ivresse » conserve mieux la concision et l’ambiguïté syntaxique de l’hébreu.
  naturalness: « Partager un repas » et « s’attabler » sont naturels en français international moderne. « Dans l’ivresse » est idiomatique dans ce registre et évite de surinterpréter le texte.
  terminology: « Mari » convient à בַּעְלָהּ dans ce contexte. La note reflète correctement la divergence majeure du grec; « ruine » rend καταστροφή plus précisément que « fin », sans excès interprétatif.
