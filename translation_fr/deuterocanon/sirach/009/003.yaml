translation:
  language: fr
  text: Ne t’approche pas d’une femme étrangère[a], de peur que tu ne tombes dans ses pièges.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « une femme étrangère ». Dans les écrits de sagesse, cette expression peut désigner une femme qui se situe hors des relations légitimes, sans renvoyer nécessairement à son origine ethnique ; le parallèle grec oriente vers une fréquentation sexuellement illicite.
    reason: Précision lexicale et préservation de l’ambiguïté de l’expression hébraïque.
lexical_decisions:
- source_word: אַל תִּקְרַב
  choice: Ne t’approche pas
  rationale: L’impératif hébreu accompagné de la négation exprime une interdiction directe. Cette formulation française est naturelle et conserve l’idée de s’avancer vers quelqu’un ou d’entrer en relation avec lui.
- source_word: אִשָּׁה זָרָה
  choice: une femme étrangère
  rationale: L’expression signifie littéralement « une femme étrangère ». Dans les écrits de sagesse, elle peut cependant désigner une femme située hors des liens conjugaux ou sociaux légitimes, et non simplement une femme d’une autre origine; la note préserve cette amplitude de sens.
- source_word: פֶּן
  choice: de peur que
  rationale: La particule introduit une conséquence redoutée. « De peur que » restitue clairement cette valeur d’avertissement dans un registre proverbial digne.
- source_word: תִּפּוֹל
  choice: tu ne tombes
  rationale: Le verbe hébreu signifie littéralement « tomber », image également attestée dans le parallèle grec. Le conserver maintient la métaphore du piège.
- source_word: בִּמְצוּדֹתֶיהָ
  choice: dans ses pièges
  rationale: Le terme désigne des dispositifs servant à capturer, tels que pièges, filets ou lacets. « Pièges » est clair en français moderne et s’accorde naturellement avec le verbe « tomber ».
theological_decisions:
- issue: Sens de « femme étrangère » dans le contexte sapientiel
  choice: Conserver « femme étrangère » dans le texte et préciser en note son sens moral ou relationnel possible.
  alternative: une femme dévoyée; une femme de mauvaise vie; une prostituée
  rationale: L’hébreu ne qualifie pas explicitement cette femme de prostituée et ne permet pas de réduire avec certitude l’expression à son appartenance ethnique. Le parallèle grec oriente vers une relation sexuellement illégitime. La traduction et la note maintiennent ensemble la lettre du texte et son ambiguïté contextuelle.
translation_notes:
  register: Français international moderne, direct et proverbial. Le tutoiement singulier correspond à l’adresse personnelle de l’hébreu. « De peur que tu ne tombes » conserve un ton digne sans employer un vocabulaire archaïque.
