translation:
  language: fr
  text: Ne sois pas jaloux de ta femme, celle qui repose contre ton sein[a], de peur de t’enseigner à toi-même le mal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la femme de ton sein ». Cette image désigne l’épouse intime.'
    reason: cultural_note
  - marker: b
    text: 'La construction hébraïque est difficile. Elle dit littéralement « de peur que tu n’enseignes sur/contre toi le mal ». Le grec explicite « une mauvaise instruction » : « de peur que tu ne t’enseignes contre toi-même une mauvaise instruction ».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: אַל תְּקַנֵּא
  choice: Ne sois pas jaloux
  rationale: Le piel de קנא peut exprimer la jalousie ou l’envie. Dans le contexte conjugal, « être jaloux » est le sens le plus naturel et correspond au grec ζήλου.
- source_word: אֵשֶׁת חֵיקֶךָ
  choice: la femme qui partage ton intimité
  rationale: Littéralement « la femme de ton sein », expression imagée désignant l’épouse la plus proche et intime. Cette formulation française conserve l’idée sans employer un calque peu naturel.
- source_word: פֶּן
  choice: de peur de
  rationale: La particule introduit la conséquence indésirable contre laquelle porte l’avertissement.
- source_word: תִּלְמַד עָלֶיךָ
  choice: lui apprendre à te faire
  rationale: La forme hébraïque signifie « enseigner », et עָלֶיךָ indique que cet enseignement se retourne contre le mari. En français, « lui apprendre à te faire… » exprime naturellement ce mouvement, tout en laissant le complément être précisé par רָעָה.
- source_word: רָעָה
  choice: du mal
  rationale: Le nom hébreu signifie ici « mal » ou « tort ». Le grec explicite une « mauvaise leçon »; la traduction française rend le sens probable de l’ensemble hébreu sans importer le substantif grec dans le corps du verset.
theological_decisions:
- issue: Identité du sujet implicite de תִּלְמַד
  choice: La femme est comprise comme la personne à qui le mari apprend à lui faire du mal.
  alternative: « de peur de t’apprendre à toi-même le mal » ou « de peur d’attirer sur toi un mauvais enseignement »
  rationale: Le verbe « enseigner » appelle naturellement un destinataire implicite, vraisemblablement l’épouse mentionnée juste avant; עָלֶיךָ marque que le résultat se retourne contre le mari. La construction demeure difficile, et la note signale l’autre compréhension possible.
translation_notes:
  register: Français moderne, direct et sapientiel. Le tutoiement singulier correspond aux formes hébraïques. L’image littérale du « sein » est expliquée en note plutôt que calquée dans le texte, et l’ambiguïté de la seconde proposition est explicitement préservée.
