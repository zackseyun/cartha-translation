  source_fidelity: La première proposition rend correctement l’interdiction de קנא dans son sens conjugal. La seconde du projet attribue sans base textuelle l’action à l’épouse (« lui apprendre à te faire du mal ») et transforme l’enseignement difficile du texte en une incitation à nuire. Le sujet du verbe hébreu et grec est le destinataire masculin de l’avertissement ; la formulation révisée conserve l’étrangeté et l’ambiguïté de la construction sans lui ajouter ce scénario.
  naturalness: '« Ta femme, celle qui repose contre ton sein » est une expression française poétique mais intelligible, plus proche de l’image hébraïque que « la femme qui partage ton intimité ». « De peur de t’enseigner à toi-même le mal » demeure volontairement légèrement marqué : une paraphrase plus idiomatique risquerait soit de supprimer le verbe « enseigner », soit de déterminer indûment le sens de la locution difficile.'
  terminology: « Jaloux » convient à קנא dans ce contexte. « Sein » conserve l’image de חיק, explicitée en note. « Le mal » reflète רעה ; la note distingue correctement l’explicitation grecque « mauvaise instruction » sans l’imposer au texte français.
