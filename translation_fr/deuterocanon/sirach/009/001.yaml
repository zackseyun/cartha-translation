  - severity: medium
    issue: Image de חיק insuffisamment représentée dans le texte
    rationale: « qui partage ton intimité » communique une idée générale d’intimité, mais efface l’image corporelle de « sein/bosom ». Une formulation poétique claire peut la conserver sans calque opaque.
