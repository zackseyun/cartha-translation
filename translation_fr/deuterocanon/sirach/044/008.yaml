  text: Some of them left behind a name[a], to be praised among their inheritance.
translation:
  language: fr
  text: Certains d’entre eux ont laissé un nom[a], afin que leurs louanges soient racontées dans leur héritage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque «dans leur héritage» peut aussi désigner leur descendance ou leur patrimoine transmis. Le terme rendu par «afin que leurs louanges soient racontées» est difficile ; le parallèle grec parle du récit de leurs louanges.
    reason: Signaler l’ambiguïté de בנחלתם et la difficulté du verbe hébreu, tout en indiquant avec prudence l’éclairage du parallèle grec.
lexical_decisions:
- source_word: יש מהם
  choice: Certains d’entre eux
  rationale: Cette expression partitive désigne un sous-ensemble des ancêtres dignes d’honneur évoqués dans le contexte.
- source_word: הניחו
  choice: ont laissé
  rationale: Le verbe exprime ce qui demeure après eux; «ont laissé» convient ici à la mémoire durable attachée à leur nom.
- source_word: שם
  choice: un nom
  rationale: Le mot peut désigner la renommée ou la réputation. Le maintien de l’image concrète du «nom» préserve l’expression biblique et sa portée mémorielle.
- source_word: להשתענות
  choice: pour être loués
  rationale: La forme hébraïque est difficile, mais elle paraît liée à l’idée d’une mention élogieuse; le parallèle grec, qui parle de raconter des louanges, confirme ce champ de sens.
- source_word: בנחלתם
  choice: dans leur héritage
  rationale: Cette traduction conserve l’image littérale de l’héritage sans trancher entre le patrimoine transmis et les descendants au sein desquels leur mémoire perdure.
theological_decisions:
- issue: Langage mémoriel du «nom» et de l’«héritage»
  choice: Conserver les images concrètes «un nom» et «dans leur héritage».
  alternative: Certains d’entre eux ont laissé une renommée, afin que leurs descendants racontent leurs louanges.
  rationale: Le verset n’est pas un point doctrinal controversé, mais son langage biblique associe mémoire, nom et héritage. La formulation retenue préserve cette texture ainsi que l’ambiguïté de l’hébreu; le grec éclaire l’idée de louange sans remplacer le texte hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure «laisser un nom» conserve volontairement un idiome biblique intelligible; la note explicite l’ambiguïté de «leur héritage».
