  text: An everlasting covenant was cut with him[a], that all flesh might not be destroyed.
translation:
  language: fr
  text: Une alliance éternelle fut conclue avec lui[a], afin que toute chair ne soit pas détruite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec précise : « afin que toute chair ne soit pas effacée par un déluge ». Cette formulation rend explicite le contexte de Noé.'
    reason: alternative_reading
lexical_decisions:
- source_word: באות עולם
  choice: une alliance éternelle
  rationale: Dans ce contexte, le texte hébreu désigne une alliance durable. « Alliance éternelle » est une formulation biblique claire et naturelle en français, au singulier, contrairement au pluriel du parallèle grec.
- source_word: נכרת עמו
  choice: fut conclue avec lui
  rationale: L’hébreu emploie l’expression idiomatique « couper une alliance ». En français actuel, « conclure une alliance » en restitue précisément le sens sans produire l’expression peu naturelle « couper une alliance ».
- source_word: לבלתי השחית
  choice: afin que … ne soit pas détruite
  rationale: « Afin que … ne » exprime clairement la visée de la proposition hébraïque, tandis que le passif « soit détruite » conserve la portée générale du verbe.
- source_word: כל בשר
  choice: toute chair
  rationale: La traduction littérale conserve une expression biblique intelligible qui, dans le contexte de Noé, englobe les êtres vivants et ne se limite pas à l’humanité.
theological_decisions:
- issue: Faut-il mentionner explicitement le déluge d’après le parallèle grec ?
  choice: Suivre dans le texte principal la formulation hébraïque générale, sans nommer le déluge.
  alternative: « afin que toute chair ne soit pas effacée par un déluge »
  rationale: Le témoin hébreu conservé ne comporte pas d’équivalent explicite de κατακλυσμῷ (« par un déluge »). Le grec éclaire le cadre noachique, mais ne doit pas supplanter inutilement l’hébreu primaire ; sa précision est donc signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Fut conclue » rend naturellement l’idiome hébreu de l’alliance ; « toute chair » maintient la texture biblique et l’étendue du référent.
