translation:
  language: fr
  text: des dirigeants de nations dans leurs projets, et de hauts dignitaires dans leurs recherches[a] ; sages dans le discours, grâce à leurs écrits[b], et gouvernants dans leurs fonctions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec diffère quelque peu de l’hébreu dans cette expression : il met l’accent sur l’intelligence liée à l’administration lettrée du peuple. La traduction suit ici l’hébreu comme témoin principal, tout en tenant compte du grec.'
    reason: alternative_reading
  - marker: b
    text: 'Les témoins hébreux présentent une légère différence : le texte de la Guéniza du Caire se lit « par leurs écrits » ou « dans leur activité d’écriture », tandis que le rouleau de Massada appuie une leçon très proche, « dans leurs livres ». Les deux lectures évoquent une sagesse liée aux lettres et aux écrits.'
    reason: textual_variant
lexical_decisions:
- source_word: שרי גוים
  choice: dirigeants de nations
  rationale: שרי désigne des chefs ou hauts responsables. « Dirigeants » est naturel en français moderne et גוים conserve ici son sens politique large de « nations ».
- source_word: במזמתם
  choice: par leurs projets
  rationale: מזמה peut désigner un projet, un dessein ou une délibération. Dans ce contexte élogieux, « projets » garde une valeur positive ou neutre et s’accorde avec le grec ἐν διαβουλίοις.
- source_word: ורוזנים
  choice: et de hauts dignitaires
  rationale: רוזנים désigne des personnages puissants ou de hauts responsables. « Hauts dignitaires » distingue ce groupe des dirigeants déjà mentionnés sans effacer sa dimension politique.
- source_word: במחקרותם
  choice: par leurs recherches
  rationale: Le terme évoque l’examen approfondi et la recherche. Cette traduction préserve l’activité de discernement sans la réduire à une compréhension statique.
- source_word: חכמי שיח
  choice: des sages du discours
  rationale: Expression littéralement liée à la sagesse dans la parole ou le discours. La formulation française reste concise et conserve l’accent sur l’expression réfléchie.
- source_word: בספרתם
  choice: par leurs écrits
  rationale: La leçon hébraïque renvoie vraisemblablement à l’activité écrite ou littéraire. « Par leurs écrits » rend naturellement la valeur instrumentale possible de la préposition.
- source_word: ומושלים
  choice: et des gouvernants
  rationale: Le participe de משל désigne ceux qui exercent l’autorité. « Gouvernants » conserve clairement cette fonction tout en évitant de répéter « dirigeants ».
- source_word: במשמרותם
  choice: dans l’exercice de leurs charges
  rationale: משמרות peut désigner des gardes, des services assignés ou des fonctions confiées. La formulation retient ici le sens administratif plus large sans préciser indûment une veille militaire.
