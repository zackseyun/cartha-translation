  text: But these were men of mercy, whose righteous deeds[b] were not forgotten;
translation:
  language: fr
  text: Mais ceux-ci furent des hommes pleins de compassion, dont les œuvres justes[b] ne furent pas oubliées.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu conservé dans les manuscrits de la Guéniza du Caire est difficile et semble ne pas correspondre à cet endroit. Pris de façon plus littérale, il présente approximativement la séquence : « Comme s’ils n’avaient pas existé, ils existèrent, et leurs enfants après eux. » Le texte principal suit ici le parallèle grec, qui donne une phrase cohérente.'
    reason: textual_variant
  - marker: b
    text: Ou « actes de justice ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλʼ ἢ / כאשר
  choice: Mais ceux-ci
  rationale: L’hébreu conservé paraît déplacé ou altéré à cet endroit. Le grec offre une transition adversative cohérente avec le contexte; « Mais ceux-ci » en rend naturellement le sens.
- source_word: ἄνδρες
  choice: des hommes
  rationale: Le grec emploie explicitement le pluriel masculin ἄνδρες; la traduction le conserve.
- source_word: ἐλέους
  choice: pleins de compassion
  rationale: Cette formulation française naturelle rend l’expression grecque littérale « hommes de compassion/de miséricorde » sans en affaiblir la caractérisation.
- source_word: δικαιοσύναι
  choice: œuvres justes
  rationale: Le pluriel grec évoque des manifestations concrètes de justice ou de droiture, plutôt qu’une qualité purement abstraite.
- source_word: οὐκ ἐπελήσθησαν
  choice: ne furent pas oubliées
  rationale: C’est le sens direct du verbe grec et cela maintient le contraste contextuel avec la disparition du souvenir.
theological_decisions:
- issue: Tension textuelle entre l’hébreu conservé et le parallèle grec
  choice: Suivre dans le texte principal le parallèle grec, cohérent avec le contexte, et signaler l’hébreu difficile en note.
  alternative: « Comme s’ils n’avaient pas existé, ils furent, et leurs enfants après eux. »
  rationale: L’hébreu fourni est grammaticalement difficile et semble ne pas correspondre à cet emplacement, tandis que le grec transmet une phrase cohérente dans la suite du passage. La note préserve honnêtement le témoignage hébreu sans imposer une reconstruction incertaine.
translation_notes:
  register: Français international moderne, digne et accessible. « Pleins de compassion » est plus idiomatique que « hommes de compassion », tandis que « œuvres justes » conserve le caractère concret et pluriel du grec.
