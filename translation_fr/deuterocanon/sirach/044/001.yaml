translation:
  language: fr
  text: Je veux maintenant célébrer les hommes de fidélité[a], nos pères au fil de leurs générations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les hommes de bonté fidèle ». Le grec porte : « Célébrons donc les hommes illustres et nos pères dans leur génération. »'
    reason: Signaler à la fois la richesse sémantique de חסד et la variante importante du texte grec.
lexical_decisions:
- source_word: אהללה נא
  choice: Je veux maintenant célébrer
  rationale: 'Le texte hébreu transmis porte une forme cohortative à la première personne du singulier : « je veux louer/célébrer ». « Célébrer » convient naturellement à l’éloge public de personnages du passé, et « maintenant » rend נא. Le grec présente plutôt une exhortation au pluriel.'
- source_word: אנשי חסד
  choice: les hommes de fidélité
  rationale: חסד associe ici loyauté, bonté et attachement fidèle. « Hommes de fidélité » conserve cette densité mieux que « hommes pieux » ou « hommes bons », sans suivre le grec « hommes illustres ».
- source_word: אבותינו
  choice: nos pères
  rationale: Rend directement le terme masculin אבותינו et conserve la tonalité généalogique et traditionnelle du passage.
- source_word: בדורותם
  choice: au fil de leurs générations
  rationale: Le pluriel hébreu désigne les générations ou époques successives auxquelles appartenaient ces pères. Cette formulation est plus naturelle en français que le calque « dans leurs générations ».
theological_decisions:
- issue: Divergence entre l’hébreu et le grec quant à la qualité attribuée aux personnages honorés
  choice: Suivre dans le texte principal l’hébreu « hommes de fidélité »
  alternative: « hommes illustres », selon le grec
  rationale: L’hébreu conservé est ici le témoin principal. Le grec peut refléter une Vorlage différente ou une interprétation; sa lecture est donc signalée sans remplacer celle de l’hébreu.
- issue: Divergence de personne grammaticale dans l’ouverture
  choice: 'Conserver la première personne du singulier de l’hébreu : « Je veux maintenant célébrer »'
  alternative: « Célébrons donc », selon le grec
  rationale: La forme transmise אהללה est singulière. La lecture grecque, hortative plurielle, est authentiquement attestée mais ne doit pas effacer la formulation du témoin hébreu retenu.
translation_notes:
  register: Français international moderne, digne et lisible. La tournure « hommes de fidélité » garde une légère couleur biblique afin de préserver la portée de חסד; la note explicite son sens et la divergence grecque.
