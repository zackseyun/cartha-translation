base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/021.yaml
  text: Therefore he confirmed it to him with an oath that nations would be blessed in his offspring[a], and that he would give them as an inheritance from sea to sea[b], and from the River to the ends of the earth.
translation:
  language: fr
  text: C’est pourquoi il lui confirma par serment que des nations seraient bénies en sa descendance, et qu’il leur donnerait en héritage un territoire s’étendant d’une mer à l’autre[a], depuis le Fleuve[b] jusqu’aux extrémités de la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu de cette édition porte littéralement une forme pouvant se comprendre comme « des eaux à la mer »; le parallèle grec lit « de mer à mer », formule territoriale vraisemblablement visée ici.
    reason: textual_variant
  - marker: b
    text: Dans les formules bibliques décrivant un territoire, « le Fleuve » désigne habituellement l’Euphrate.
    reason: cross_reference
lexical_decisions:
- source_word: על כן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence tirée de ce qui précède.
- source_word: בשבועה הקים לו
  choice: il lui confirma par serment
  rationale: הקים, associé au serment, exprime ici l’établissement ferme ou la confirmation d’une promesse. Le complément implicite reste sous-entendu en français, comme en hébreu.
- source_word: לברך בזרעו גוים
  choice: que des nations seraient bénies en sa descendance
  rationale: La tournure passive est appuyée par le grec ἐνευλογηθῆναι. « En sa descendance » conserve la valeur de ב et l’écho de la promesse faite à Abraham sans préciser davantage le mode de la bénédiction.
- source_word: זרעו
  choice: sa descendance
  rationale: « Descendance » rend naturellement en français le singulier collectif זרע et conserve sa portée généalogique et liée à la promesse.
- source_word: להנחילם
  choice: qu’il leur donnerait en héritage un territoire
  rationale: Le hifil de נחל signifie faire hériter ou donner en héritage. « Un territoire » explicite sobrement l’objet géographique impliqué par les limites qui suivent, tandis que « leur » conserve le suffixe pluriel du texte.
- source_word: מים עד ים
  choice: d’une mer à l’autre
  rationale: Le texte hébreu édité porte littéralement une forme pouvant se lire « des eaux à la mer », mais le grec « de mer à mer » et la formule territoriale biblique indiquent vraisemblablement le sens visé. La formulation française est idiomatique.
- source_word: ומנהר
  choice: depuis le Fleuve
  rationale: Dans les formules bibliques de délimitation territoriale, « le Fleuve » désigne conventionnellement l’Euphrate. Le nom n’est pas introduit dans le corps du texte, mais l’emploi défini est conservé.
- source_word: עד אפסי ארץ
  choice: jusqu’aux extrémités de la terre
  rationale: Rend fidèlement l’expression biblique désignant les confins les plus éloignés du pays ou de la terre, sans trancher entre ces portées.
theological_decisions:
- issue: Formulation de la promesse à Abraham et agent de la bénédiction
  choice: que des nations seraient bénies en sa descendance
  alternative: qu’il bénirait des nations par sa descendance
  rationale: L’infinitif hébreu permet une formulation plus active, mais le parallèle grec soutient explicitement le passif. Le choix retenu préserve aussi l’ambiguïté de la préposition ב sans imposer une interprétation théologique plus étroite.
- issue: Référent du suffixe pluriel dans להנחילם
  choice: qu’il leur donnerait en héritage un territoire
  alternative: qu’il donnerait à ses descendants en héritage un territoire
  rationale: Le contexte suggère que « leur » renvoie à la descendance d’Abraham, mais la proximité de « nations » permet une ambiguïté grammaticale réelle. Le pronom conserve cette tension au lieu d’expliciter silencieusement son référent.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu tout en évitant les calques obscurs. « D’une mer à l’autre » est préféré au plus littéral « de mer à mer » pour son naturel en français; « extrémités de la terre » conserve le registre biblique et l’ambiguïté entre pays et monde.
