  text: eux qui étudiaient des chants selon une règle[a] et qui transmettaient par écrit des proverbes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu « selon une règle » est difficile. Le grec a plutôt « recherchant des morceaux musicaux », ce qui éclaire la première expression comme se rapportant à des chants, sans lever entièrement la difficulté de l’hébreu.
    reason: lexical_alternative
  - marker: b
