lexical_decisions:
- source_word: חוקרי
  choice: recherchaient
  rationale: Le participe de חקר exprime une recherche attentive ou une étude approfondie; l’imparfait français convient à la caractérisation de ces figures du passé.
- source_word: מזמור
  choice: l’art du chant
  rationale: מזמור désigne un chant ou un psaume. Dans ce contexte culturel, « chant » évite de restreindre le terme à la liturgie; l’ajout de « l’art » rend naturellement en français l’activité d’étude et la dimension de composition suggérée par le contexte.
- source_word: על חוק
  choice: selon des règles
  rationale: חוק évoque une règle, un ordre fixé ou une prescription. Le pluriel idiomatique français exprime ici l’organisation formelle du chant sans donner à la formule une portée juridique indue. L’hébreu demeure difficile.
- source_word: נושאי
  choice: consignaient
  rationale: Le sens littéral est « portant ». Avec « proverbes » et « par écrit », le français naturel demande une formulation indiquant qu’ils les transmettaient ou les mettaient sous forme écrite; « consignaient » conserve cette orientation sans préciser qu’ils en étaient nécessairement les auteurs.
- source_word: משל
  choice: proverbes
  rationale: משל peut désigner un proverbe, une maxime ou une parabole. « Proverbes » est le choix normal dans ce contexte sapiential, tout en laissant une note signaler le terme plus large du grec.
- source_word: בכתב
  choice: par écrit
  rationale: Rend directement l’idée de « sous forme écrite »; le parallèle grec ἐν γραφῇ la confirme.
