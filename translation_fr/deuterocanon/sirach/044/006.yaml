  text: Men of valor[a], steadfast in strength, and at ease in their place.
translation:
  language: fr
  text: Des hommes de valeur[a], affermis dans leur force et vivant en paix dans leurs demeures.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « des hommes riches, pourvus de force, vivant en paix dans leurs lieux d’établissement ». Le texte hébreu est suivi ici comme source principale, le grec servant de témoin parallèle.'
    reason: alternative_reading
lexical_decisions:
- source_word: אנשי חיל
  choice: des hommes de valeur
  rationale: L’expression hébraïque désigne des hommes remarquables par leur vigueur, leur capacité ou leur vaillance. « Hommes de valeur » conserve cette portée élogieuse sans la réduire ni à la richesse ni au seul courage militaire.
- source_word: וסמכי כח
  choice: fermes dans leur force
  rationale: סמכי évoque ici ce qui est solidement établi ou soutenu, tandis que כח signifie « force, puissance ». Cette formulation française naturelle préserve l’image d’une force stable, tout en laissant subsister le caractère idiomatique de l’hébreu.
- source_word: ושוקטים
  choice: vivant tranquilles
  rationale: Le participe exprime le calme, le repos et une situation paisible. « Vivant tranquilles » convient au contexte social et concorde avec le sens pacifique du parallèle grec.
- source_word: על מכונתם
  choice: dans leur demeure
  rationale: מכונה peut désigner un lieu fixe, une assise ou une situation établie. Dans ce contexte, le parallèle grec qui parle de leurs lieux d’établissement appuie le sens concret de « demeure », sans exclure l’idée de stabilité.
