  source_fidelity: 'Le texte français suit fidèlement l’hébreu : עדה et קהל demeurent distincts (« assemblée », « communauté »), et les deux verbes actifs reproduisent la structure de l’imparfait hébreu. « Redira » rend de façon appropriée תשנה au sens de répéter/réciter ; « racontera » rend יספּר dans son sens de relater publiquement. Le parallèle grec, qui élargit le premier sujet à « des peuples », est correctement signalé sans être intégré au texte principal.'
