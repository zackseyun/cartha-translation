  text: Their wisdom is proclaimed by the assembly[b][a], and their praise is recounted by the congregation.
translation:
  language: fr
  text: L’assemblée redira leur sagesse[a][b], et la communauté racontera leur louange.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu de la Guéniza du Caire dit littéralement : « L’assemblée redira leur sagesse, et la communauté racontera leur louange. » Le texte grec parallèle porte : « Des peuples raconteront leur sagesse, et l’assemblée proclame leur louange. » Le texte principal suit l’hébreu, témoin primaire ici, tout en signalant que le grec a pour sujet plus large « des peuples ».'
    reason: alternative_reading
  - marker: b
    text: 'À cet endroit, le rouleau de Massada est fragmentaire : il ne conserve que la fin du vers, correspondant à « leur louange… communauté/assemblée », et non la ligne entière.'
    reason: textual_variant
lexical_decisions:
- source_word: חכמתם
  choice: leur sagesse
  rationale: Le nom חכמה avec suffixe de troisième personne du masculin pluriel désigne directement « leur sagesse », sans qu’il soit nécessaire de développer l’expression.
- source_word: תשנה
  choice: redira
  rationale: Le verbe שנה exprime ici l’idée de répéter ou de réciter. « Redira » conserve cette notion de transmission répétée tout en restant naturel dans un vers poétique.
- source_word: עדה
  choice: l’assemblée
  rationale: עדה désigne une collectivité réunie. « Assemblée » préserve le cadre public et permet de distinguer ce terme de קהל dans le second membre.
- source_word: ותהלתם
  choice: et leur louange
  rationale: תהלה signifie ici la louange exprimée à leur sujet. Le singulier collectif de l’hébreu est conservé.
- source_word: יספר
  choice: racontera
  rationale: ספר signifie compter ou raconter selon le contexte; ici, le parallélisme et le témoignage grec indiquent une évocation publique. « Racontera » conserve le sens narratif sans le réduire à une simple proclamation.
- source_word: קהל
  choice: la communauté
  rationale: קהל désigne le groupe réuni. « Communauté » rend cette dimension collective tout en évitant de répéter « assemblée » et en maintenant le parallélisme nuancé de l’hébreu.
