translation:
  language: fr
  text: Il l’établit par une bénédiction et lui donna son héritage ; il l’établit en douze tribus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est condensé : littéralement, « pour diviser en douze ». Le grec explicite l’idée : « parmi les tribus, il les répartit en douze ».'
    reason: La note signale la difficulté syntaxique et l’appui du parallèle grec pour la formulation retenue.
lexical_decisions:
- source_word: ויכוננהו
  choice: Il l’affermit
  rationale: Le causatif de כון exprime ici l’action de rendre ferme ou d’établir. « Affermit » reste proche de l’image hébraïque tout en étant naturel en français.
- source_word: בברכה
  choice: par une bénédiction
  rationale: La préposition ב peut être instrumentale ou concomitante. « Par une bénédiction » exprime naturellement ici le moyen par lequel il est affermi.
- source_word: נחלתו
  choice: son héritage
  rationale: נחלה désigne couramment un héritage ou une possession attribuée ; « héritage » est direct, lisible et concorde avec le grec κληρονομία.
- source_word: ויציבהו לשבטים
  choice: il le constitua en tribus
  rationale: יצב signifie placer ou établir fermement, tandis que ל peut ici indiquer le résultat ou la configuration. Le pronom singulier peut viser Jacob compris collectivement comme Israël, constitué en tribus.
- source_word: לחלק שנים עשר
  choice: au nombre de douze
  rationale: L’hébreu est très condensé, littéralement proche de « pour diviser douze ». La formulation française exprime sans lourdeur la répartition en douze, confirmée par le parallèle grec.
theological_decisions:
- issue: Référent des pronoms masculins singuliers
  choice: Conserver les pronoms sans nommer explicitement Jacob ou Israël
  alternative: Remplacer les pronoms par « Jacob » ou expliciter « Israël »
  rationale: Le contexte et le parallèle grec orientent vers Jacob/Israël, mais la ligne hébraïque demeure elliptique. Garder les pronoms préserve cette forme sans imposer une explicitation absente du texte.
- issue: Rapport entre le singulier et les douze tribus
  choice: Rendre le singulier comme une réalité collective constituée en douze tribus
  alternative: Présenter le personnage comme placé au-dessus ou parmi les tribus
  rationale: « Le constitua en tribus » rend compte du passage du pronom singulier à la structure tribale sans introduire une autorité « sur » les tribus que la préposition hébraïque n’exige pas.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif sapientiel. La syntaxe conserve le parallélisme du verset tout en rendant intelligible la formulation hébraïque très elliptique.
