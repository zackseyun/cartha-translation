revisions:
- from: Il l’affermit par une bénédiction et lui donna son héritage ; il le constitua en tribus, au nombre de douze.[a]
  to: Il l’établit par une bénédiction et lui donna son héritage ; il l’établit en douze tribus.[a]
  rationale: La révision remplace « affermit » par « établit », plus approprié au statut conféré dans ce contexte, et reformule la dernière proposition pour exprimer clairement le singulier collectif Jacob/Israël en relation avec les douze tribus. Elle ne nomme pas le référent et ne tranche pas au-delà de ce que permettent l’hébreu elliptique et le parallèle grec.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T11:01:45Z'
review_pass:
  verdict: revise
  source_fidelity: La première proposition rend correctement ויכוננהו בברכה, et « son héritage » correspond à נחלתו. Dans la dernière proposition, le singulier renvoie vraisemblablement à Jacob/Israël conçu collectivement. « Il le constitua en tribus, au nombre de douze » exprime ce mouvement, mais « constituer en tribus » est moins direct et risque de faire disparaître l’idée, attestée par le grec parallèle, d’une répartition en douze. « Il l’établit en douze tribus » préserve le singulier collectif et rend plus nettement le résultat sans lui attribuer une domination sur les tribus.
  naturalness: Le français du projet est globalement sobre et naturel. La correction proposée est plus idiomatique et plus nette que « le constitua en tribus, au nombre de douze ».
  terminology: « Bénédiction » et « héritage » conviennent au registre biblique moderne. « Établit » est un équivalent naturel de la racine כון et évite la coloration physique un peu marquée de « affermit » dans ce contexte.
  issues:
  - severity: medium
    issue: La formulation « il le constitua en tribus, au nombre de douze » est sémantiquement et stylistiquement maladroite.
    rationale: Elle peut laisser entendre une simple constitution institutionnelle, alors que l’hébreu elliptique et surtout le parallèle grec orientent vers l’établissement/répartition du patriarche collectif en douze tribus. Une formulation plus directe conserve l’ellipse du sujet sans imposer l’idée d’une autorité sur les tribus.
  - severity: low
    issue: La note donne « pour diviser douze » comme littéral.
    rationale: En français, cette formule est incomplète et peut être corrigée en « pour diviser en douze », tout en indiquant que l’hébreu est condensé.
  revised_text: Il l’établit par une bénédiction et lui donna son héritage ; il l’établit en douze tribus.[a]
  revised_footnotes:
  - marker: a
    text: 'L’hébreu est condensé : littéralement, « pour diviser en douze ». Le grec explicite l’idée : « parmi les tribus, il les répartit en douze ».'
    reason: La note signale la difficulté syntaxique et l’appui du parallèle grec pour la formulation retenue.
  revision_rationale: La révision remplace « affermit » par « établit », plus approprié au statut conféré dans ce contexte, et reformule la dernière proposition pour exprimer clairement le singulier collectif Jacob/Israël en relation avec les douze tribus. Elle ne nomme pas le référent et ne tranche pas au-delà de ce que permettent l’hébreu elliptique et le parallèle grec.
