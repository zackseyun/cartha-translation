review_pass:
  verdict: revise
  source_fidelity: 'Le texte principal suit correctement l’hébreu de la Guéniza : עם זרעם (« avec leur descendance »), נאמן טובם (« leur bien demeure assuré ») et ונחלתם לבני בניהם (« et leur héritage [est] pour les enfants de leurs enfants »). Toutefois, « revient aux » introduit légèrement l’idée d’une attribution ou d’un transfert actif, absente de la formulation nominale hébraïque. « Est pour » conserve mieux l’ellipse et la relation de destination.'
  naturalness: Le français est naturel, sobre et de registre biblique moderne. « Leur bien demeure assuré » est une bonne restitution de l’expression brève et sémantiquement large טובם נאמן. « Est pour les enfants de leurs enfants » est à la fois idiomatique et plus proche de l’original que « revient aux ».
  terminology: '« Descendance », « bien » et « héritage » sont appropriés. La note représente utilement la lecture grecque divergente et le soutien du témoin de Massada, sans l’intégrer indûment au texte principal. Pour davantage de précision philologique, « alliances » devrait être au singulier : διαθήκαις est pluriel en grec, mais dans ce contexte scripturaire « alliances » reste possible; le pluriel reflète formellement le grec et ne nécessite pas de changement.'
  issues:
  - severity: low
    issue: « revient aux enfants de leurs enfants »
    rationale: Cette expression suggère que l’héritage leur échoit ou leur est attribué. L’hébreu dit plus littéralement « et leur héritage [est] pour les enfants de leurs enfants », sans préciser le mécanisme de transmission. Remplacer par « est pour » préserve l’ellipse et évite cette nuance ajoutée.
  revised_text: Avec leur descendance, leur bien demeure assuré[a], et leur héritage est pour les enfants de leurs enfants.
