translation:
  language: fr
  text: Avec leur descendance, leur bien demeure assuré[a], et leur héritage est pour les enfants de leurs enfants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « Leur descendance se maintint dans les alliances, et leurs enfants grâce à eux. » L’ancien témoin hébreu de Massada reflète lui aussi une lecture centrée sur l’alliance, plutôt que celle de la Guéniza du Caire : « leur bien […] et leur héritage ».'
    reason: alternative_reading
lexical_decisions:
- source_word: עם
  choice: avec
  rationale: La préposition associe la permanence du bien des ancêtres à leur descendance, tout en conservant la construction concise de l’hébreu.
- source_word: זרעם
  choice: leur descendance
  rationale: זרע désigne ici les descendants. « Descendance » est naturel en français moderne et convient au contexte intergénérationnel.
- source_word: נאמן טובם
  choice: leur bien demeure assuré
  rationale: טובם garde le sens large de bien, bien-être ou prospérité, tandis que נאמן exprime ce qui est ferme, sûr et durable. La formulation française rend verbalement cette proposition hébraïque elliptique sans la limiter à la prospérité matérielle ni lui imposer un sens moral.
- source_word: ונחלתם
  choice: et leur héritage
  rationale: נחלה désigne un héritage ou un patrimoine transmis. « Héritage » maintient ici le sens familial et intergénérationnel.
- source_word: לבני בניהם
  choice: revient aux enfants de leurs enfants
  rationale: Littéralement « aux fils de leurs fils ». Cette tournure inclusive conserve l’accent sur plusieurs générations sans restreindre indûment le propos aux descendants masculins.
theological_decisions:
- issue: Choix entre le texte hébreu de la Guéniza du Caire et la tradition parallèle grecque, appuyée par l’ancien témoin hébreu de Massada
  choice: Traduire dans le corps du verset le texte hébreu conservé de la Guéniza, qui parle de leur bien assuré et de leur héritage.
  alternative: 'Suivre la lecture axée sur l’alliance : « Leur descendance se maintint dans les alliances, et leurs enfants grâce à eux. »'
  rationale: Le texte hébreu fourni est conservé avec un haut degré de confiance et reste donc prioritaire. La tradition grecque présente toutefois une divergence substantielle, également reflétée par l’ancien témoin de Massada; elle est signalée en note afin de ne pas effacer cette variante ancienne ni de fusionner silencieusement les deux lectures.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve le parallélisme et la densité de l’hébreu. « Leur bien » préserve volontairement l’étendue sémantique de טובם, et « demeure assuré » exprime la stabilité de נאמן sans résoudre l’ambiguïté en faveur de la seule prospérité matérielle ou d’une notion confessionnelle de fidélité.
