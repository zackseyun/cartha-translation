  text: who kept the commandments of the Most High and entered into covenant with him[a]. In his flesh he cut for him a statute[b], and in testing he was found faithful.
translation:
  language: fr
  text: lui qui observa les commandements du Très-Haut et entra dans une alliance avec lui. Dans sa chair, il établit pour lui une prescription[a], et dans l’épreuve il fut trouvé fidèle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Dans sa chair, il établit une alliance. » L’hébreu lit ici « une prescription ». La formulation fait probablement allusion à la circoncision, signe corporel de l’alliance avec Abraham.'
    reason: alternative_reading; cross_reference
lexical_decisions:
- source_word: שמר
  choice: observa
  rationale: Avec « commandements », le verbe exprime une obéissance fidèle. « Observa » est naturel en français biblique moderne et reste proche de l’hébreu.
- source_word: מצות עליון
  choice: les commandements du Très-Haut
  rationale: Rend directement le pluriel construit et emploie le titre divin français usuel.
- source_word: ובא בברית עמו
  choice: entra dans une alliance avec lui
  rationale: Reproduit l’idée hébraïque d’entrer dans une relation d’alliance, sans réduire ברית à un simple contrat.
- source_word: בבשרו
  choice: Dans sa chair
  rationale: Conserve le langage corporel concret commun à l’hébreu et au grec ainsi que l’allusion concise à la circoncision.
- source_word: כרת לו חק
  choice: il grava pour lui une prescription
  rationale: « Grava » préserve l’image incisive de כרת dans ce contexte corporel sans produire l’étrange français « coupa une prescription ». « Prescription » rend חק comme disposition fixée.
- source_word: בניסוי
  choice: dans l’épreuve
  rationale: Désigne la mise à l’épreuve sans suggérer nécessairement une tentation morale.
- source_word: נמצא נאמן
  choice: il fut trouvé fidèle
  rationale: Rendu formel qui conserve le constat explicite de fidélité présent en hébreu et dans le parallèle grec.
theological_decisions:
- issue: Allusion à la circoncision d’Abraham
  choice: Conserver « Dans sa chair » et la formulation allusive de la prescription gravée.
  alternative: 'Expliciter : « Il reçut dans sa chair la circoncision, signe de l’alliance. »'
  rationale: Le contexte permet d’identifier la circoncision, mais le verset ne la nomme pas. L’expliciter dans le texte résoudrait une allusion que l’original laisse implicite.
- issue: Divergence entre l’hébreu et le grec dans la troisième proposition
  choice: Suivre l’hébreu חק, « prescription », dans le texte principal.
  alternative: 'Suivre le grec διαθήκην : « Dans sa chair, il établit une alliance avec lui. »'
  rationale: L’hébreu conservé est ici le témoin principal. La variante grecque est substantielle et doit donc être signalée en note.
translation_notes:
  register: Français moderne, digne et lisible. « Grava » maintient le lien entre la chair et l’acte de tailler suggéré par כרת, tout en évitant un calque français obscur. Le relatif initial « lui qui » préserve la continuité syntaxique avec le portrait d’Abraham dans le contexte.
