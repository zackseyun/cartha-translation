base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/003.yaml
  text: rulers of the land in their kingdoms[a], and men renowned for their might; counselors in their understanding[b], and seers of all things in their prophecy.
translation:
  language: fr
  text: ceux qui dominaient le pays dans leurs royaumes[a], des hommes renommés par leur puissance ; ceux qui donnaient des conseils avec intelligence, et des voyants de tout dans leur prophétie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu דורי ארץ est difficile. Le grec parallèle porte : « ceux qui exerçaient la domination dans leurs royaumes », ce qui appuie cette traduction.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « des voyants de tout dans leur prophétie ». L’hébreu est concis et ambigu ; le grec parallèle dit plutôt : « ceux qui annonçaient dans des prophéties ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דורי ארץ
  choice: ceux qui dominaient le pays
  rationale: L’expression hébraïque est difficile, mais le contexte politique et le grec κυριεύοντες (« exerçant la domination ») indiquent des gouvernants. « Le pays » évoque ici un territoire gouverné plutôt que la terre entière.
- source_word: במלכותם
  choice: dans leurs royaumes
  rationale: מלכות peut désigner la royauté, le règne ou le royaume. Le pluriel concret « royaumes » convient au portrait politique et correspond au grec βασιλείαις.
- source_word: אנשי שם
  choice: des hommes renommés
  rationale: Littéralement « des hommes de nom », tournure idiomatique désignant des hommes célèbres ou illustres. Le masculin explicite de l’hébreu est conservé.
- source_word: בגבורתם
  choice: par leur puissance
  rationale: גבורה exprime la force, la puissance ou la vaillance. « Puissance » conserve ici le sens large et s’accorde avec le parallèle grec δύναμις.
- source_word: היועצים
  choice: ceux qui donnaient conseil
  rationale: Le participe désigne des personnes qui conseillent. La tournure verbale est plus naturelle en français courant que le substantif « conseillers » dans cette série poétique.
- source_word: בתבונתם
  choice: avec intelligence
  rationale: תבונה désigne l’intelligence, le discernement ou la perspicacité. « Avec intelligence » rend naturellement la manière dont ils conseillaient.
- source_word: וחוזי כל
  choice: et des voyants de toutes choses
  rationale: חוזי signifie « voyants ». Le complément כל est très concis et sa portée reste incertaine ; « de toutes choses » en préserve l’ampleur sans préciser artificiellement son objet.
- source_word: בנבואתם
  choice: par leur prophétie
  rationale: Le terme désigne la prophétie ou la parole prophétique. Le singulier collectif du français suit la forme hébraïque et « par » exprime le moyen de leur vision prophétique.
theological_decisions:
- issue: Langage masculin dans une liste représentative des ancêtres honorés d’Israël
  choice: des hommes renommés
  alternative: des personnes renommées ; les personnages illustres
  rationale: Le texte hébreu emploie explicitement אנשי, « hommes ». Le masculin est donc conservé sans neutralisation.
- issue: Portée de la connaissance attribuée aux voyants
  choice: des voyants de toutes choses
  alternative: ceux qui proclamaient par des prophéties
  rationale: La formulation conserve l’hébreu concis וחוזי כל sans définir la nature ou l’étendue de cette vision. La leçon grecque, davantage centrée sur la proclamation prophétique, est signalée en note plutôt qu’intégrée au texte.
