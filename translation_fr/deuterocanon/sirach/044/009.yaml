base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/009.yaml
  text: And there are some for whom there is no remembrance[a], they ceased to be, just as they had ceased, as though they had never existed, and so did their children after them.
translation:
  language: fr
  text: 'Mais certains d’entre eux ne laissent aucun souvenir[a] : ils ont disparu comme s’ils n’avaient jamais existé, ainsi que leurs enfants après eux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin hébreu est plus court et dit littéralement : « Mais certains d’entre eux, dont il n’y a pas de souvenir, et ils ont cessé comme ils ont cessé. » Le parallèle grec présente une forme plus développée : « ils ont disparu comme s’ils n’avaient jamais existé […] et leurs enfants après eux ». Le texte principal suit l’hébreu dans son introduction et reprend le développement conservé par le grec pour expliciter la formulation hébraïque condensée.'
    reason: textual_variant
lexical_decisions:
- source_word: ויש מהם
  choice: Mais certains d’entre eux
  rationale: L’expression introduit un sous-groupe en contraste avec les personnages illustres évoqués dans le contexte. « Certains d’entre eux » rend naturellement la valeur partitive ; « mais » explicite le contraste du contexte.
- source_word: אשר אין לו זכר
  choice: n’ont laissé aucun souvenir
  rationale: זכר peut désigner le souvenir ou la mémoire conservée d’une personne. La tournure française exprime ici l’absence de trace dans la mémoire collective, sans imposer l’idée d’un monument commémoratif.
- source_word: וישבתו
  choice: ils ont disparu
  rationale: Le verbe שבת exprime la cessation. Dans ce contexte, « ont disparu » communique à la fois leur fin et leur effacement de la mémoire, sans suggérer nécessairement une mort violente.
- source_word: καὶ ἀπώλοντο ὡς οὐχ ὑπάρξαντες
  choice: comme s’ils n’avaient jamais existé
  rationale: Le parallèle grec développe le texte hébreu très condensé et explicite l’idée d’une disparition totale. Cette formulation française conserve la comparaison irréelle du grec.
- source_word: καὶ τὰ τέκνα αὐτῶν μετʼ αὐτούς
  choice: et leurs enfants après eux
  rationale: Cette proposition, absente du témoin hébreu cité mais conservée par le grec, est rendue sobrement et sans ajouter de verbe interprétatif.
