  text: Enoch was found blameless, and he walked with the LORD, and he was taken away—an example of knowledge for generation after generation.
translation:
  language: fr
  text: 'Hénoch fut trouvé intègre, il marcha avec le SEIGNEUR et fut enlevé : un signe de connaissance[a] pour génération après génération.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec lit : « un exemple de conversion pour les générations ».'
    reason: La tradition grecque diffère nettement de l’hébreu « un signe de connaissance » ; cette variante importante est signalée au point concerné.
lexical_decisions:
- source_word: תמים
  choice: intègre
  rationale: Rend l’idée d’une conduite entière et irréprochable sans suggérer une perfection absolue.
- source_word: והתהלך עם יהוה
  choice: il marcha avec le SEIGNEUR
  rationale: Conserve l’expression biblique concrète et relationnelle; le tétragramme est rendu selon la convention française « le SEIGNEUR ».
- source_word: ונלקח
  choice: puis il fut enlevé
  rationale: Préserve le passif et l’allusion à la disparition d’Hénoch, sans expliciter davantage l’agent ou la destination.
- source_word: אות דעת
  choice: un signe de connaissance
  rationale: Suit directement l’hébreu, malgré sa formulation énigmatique, plutôt que la leçon grecque « exemple de conversion ».
- source_word: לדור ודור
  choice: pour toutes les générations
  rationale: Expression française naturelle qui garde la portée successive et durable de l’hébreu.
theological_decisions:
- issue: Nature de ce qu’Hénoch représente pour les générations
  choice: un signe de connaissance
  alternative: un exemple de conversion
  rationale: Le texte hébreu fourni porte אות דעת, tandis que le grec présente une leçon sensiblement différente. La traduction principale privilégie le témoin hébreu demandé et signale la variante grecque en note.
- issue: Rendu du nom divin יהוה
  choice: le SEIGNEUR
  alternative: YHWH / Yahvé
  rationale: Cette convention française digne et largement intelligible représente le tétragramme sans imposer une vocalisation reconstruite.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste concise et proche du parallélisme hébreu; la formulation énigmatique « signe de connaissance » est volontairement préservée.
