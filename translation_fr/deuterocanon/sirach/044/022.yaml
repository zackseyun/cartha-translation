base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/022.yaml
  text: And in Isaac he established[a], because of Abraham his father, a covenant with every firstborn[b], and the blessing rested on the head of Israel.
translation:
  language: fr
  text: À Isaac aussi, il accorda un fils, à cause d’Abraham, son père. Il lui donna l’alliance de tout premier-né[a], et la bénédiction reposa sur la tête d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu porte une expression difficile : « l’alliance de tout premier-né ». Le grec lit plutôt : « une bénédiction pour tous les humains et une alliance ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וגם ליצחק הקים בן
  choice: À Isaac aussi, il accorda un fils
  rationale: Le texte hébreu transmis dit littéralement qu’il « établit/suscita un fils pour Isaac ». La formulation française rend naturellement ליצחק et conserve בן (« fils »), clairement attesté dans le témoin hébreu principal.
- source_word: בעבור אברהם אביו
  choice: à cause d’Abraham, son père
  rationale: בעבור exprime ici le motif ou la considération accordée à Abraham. « À cause de » préserve cette valeur causale sans préciser davantage la nature du mérite.
- source_word: ברית כל ראשון נתיו
  choice: Il lui donna l’alliance de tout premier-né
  rationale: נתיו est compris comme une forme de נתן avec suffixe, « il la/lui donna ». ברית signifie « alliance ». כל ראשון est difficile mais se lit lexicalement « tout premier-né »; l’étrangeté du texte est conservée plutôt que résolue d’après le grec.
- source_word: וברכה נחה על ראש ישראל
  choice: et la bénédiction reposa sur la tête d’Israël
  rationale: La traduction garde l’image hébraïque de la bénédiction qui « repose » sur la tête d’Israël.
theological_decisions:
- issue: Identité d’Israël
  choice: Conserver simplement le nom « Israël »
  alternative: Expliciter « Jacob » ou comprendre collectivement le peuple d’Israël
  rationale: Dans la suite Abraham–Isaac–Israël, le patriarche Jacob est le référent le plus immédiat, mais le nom peut aussi évoquer ses descendants. Le texte français préserve cette résonance.
- issue: Portée de l’alliance
  choice: « l’alliance de tout premier-né » selon l’hébreu transmis
  alternative: 'Suivre le grec : « une bénédiction pour tous les humains et une alliance »'
  rationale: Le témoin hébreu principal présente une expression difficile concernant le premier-né; le grec atteste une lecture universelle sensiblement différente. Cette variante est signalée sans harmonisation silencieuse.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit les deux propositions du texte hébreu et conserve son image poétique ainsi que sa difficulté textuelle principale.
