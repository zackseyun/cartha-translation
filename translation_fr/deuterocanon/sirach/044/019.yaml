  text: Abraham[a], father of a multitude of nations—no blemish was found in his honor.
translation:
  language: fr
  text: Abraham, père d’une multitude de nations, il n’a entaché en rien son honneur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « et nul ne fut trouvé son égal en gloire » (ou « en honneur »).'
    reason: Lecture différente du texte grec.
lexical_decisions:
- source_word: אב
  choice: père
  rationale: Le mot hébreu désigne directement un « père », sens également attesté par le grec πατήρ; « ancêtre » serait ici moins précis.
- source_word: המון גוים
  choice: une multitude de nations
  rationale: Cette formulation conserve l’écho de la promesse faite à Abraham et rend naturellement l’idée d’un grand nombre de nations.
- source_word: לא נתן
  choice: n’a laissé aucune
  rationale: Pris littéralement, l’hébreu dit approximativement « n’a pas donné », mais cette tournure française exprime de façon intelligible l’idée qu’Abraham n’a pas introduit de tache dans son honneur, sans substituer la lecture grecque au texte hébreu.
- source_word: בכבודו
  choice: à son honneur
  rationale: כבוד peut signifier « honneur » ou « gloire ». Avec « tache », « à son honneur » forme une expression française naturelle et reste proche de l’hébreu.
- source_word: מום
  choice: tache
  rationale: מום désigne un défaut ou une imperfection. « Tache » convient au domaine moral et à l’honneur sans donner au terme une portée doctrinale supplémentaire.
theological_decisions:
- issue: Rapport entre la dernière proposition hébraïque et la lecture grecque
  choice: Suivre l’hébreu en présentant Abraham comme n’ayant laissé aucune tache à son honneur.
  alternative: « et nul ne fut trouvé son égal en gloire » ou « en honneur »
  rationale: Le témoin hébreu conservé doit guider le texte principal. La Septante présente toutefois une formulation sensiblement différente; cette divergence réelle est donc signalée en note plutôt qu’harmonisée silencieusement.
translation_notes:
  register: Français international actuel, digne et accessible. La formulation conserve l’écho biblique de « père d’une multitude de nations » tout en rendant intelligible la syntaxe hébraïque difficile de la seconde proposition.
