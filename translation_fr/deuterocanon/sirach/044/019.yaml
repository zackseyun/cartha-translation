  source_fidelity: 'Le premier membre rend fidèlement אברהם אב המון גוים : « Abraham, père d’une multitude de nations ». Pour le second, le sujet actif d’Abraham et l’idée hébraïque de ne pas infliger de « blemish/défaut » à son honneur doivent être maintenus. « N’a laissé aucune tache à son honneur » reste interprétable, mais est moins idiomatique et moins directement actif que nécessaire. La note signale correctement la divergence matérielle de la Septante sans l’harmoniser au texte hébreu.'
  naturalness: « Il n’a entaché en rien son honneur » est une formulation actuelle, claire et digne en français international. Elle évite l’expression quelque peu heurtée « laisser une tache à son honneur » tout en gardant l’image morale d’une atteinte à l’honneur.
