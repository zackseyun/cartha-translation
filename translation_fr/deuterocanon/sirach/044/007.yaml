  text: All these were honored in their generations[a], and in their days they were a glory.
translation:
  language: fr
  text: Tous ceux-là furent honorés dans leur génération et, en leur temps, ils furent une gloire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu a une proposition nominale compacte, littéralement : « et, en leurs jours, leur gloire ». Le grec porte également : « et, en leurs jours, une fierté/gloire ». La traduction explicite cette construction en français.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כל אלה
  choice: Tous ceux-là
  rationale: Reprend naturellement en français les personnages qui viennent d’être énumérés, sans ajouter « hommes », absent de l’hébreu.
- source_word: בדורם
  choice: en leur génération
  rationale: Rend directement דור avec son suffixe. L’hébreu a formellement le singulier (« leur génération »), malgré le pluriel du parallèle grec.
- source_word: ומימיהם
  choice: et, de leur vivant
  rationale: Exprime idiomatiquement la valeur temporelle « en leurs jours », confirmée par le grec ἐν ταῖς ἡμέραις αὐτῶν.
- source_word: תפארתם
  choice: ils furent un sujet de gloire
  rationale: Déploie en français la proposition nominale très compacte. תפארת évoque la gloire, la splendeur ou l’honneur dont quelqu’un peut être la source.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. « Tous ceux-là » conserve la portée démonstrative du texte; « de leur vivant » évite le tour moins naturel « en leurs jours ». Le singulier « génération » suit ici l’hébreu, tandis que la note signale l’ambiguïté de la seconde proposition.
