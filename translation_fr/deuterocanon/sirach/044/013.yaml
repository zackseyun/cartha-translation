  text: Their remembrance will stand forever[a], and their righteousness will not be forgotten.
translation:
  language: fr
  text: Leur souvenir subsistera pour toujours[a], et leur justice ne sera pas oubliée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Leur descendance subsistera pour toujours, et leur gloire ne sera pas effacée. » Le manuscrit de Massada lit lui aussi « leur descendance » ou « leur postérité » là où l’hébreu de la Guéniza du Caire porte ici « leur souvenir ».'
    reason: textual_variant
lexical_decisions:
- source_word: זכרם
  choice: leur souvenir
  rationale: זֵכֶר désigne le souvenir ou la mémoire qui demeure. « Leur souvenir » rend directement le nom hébreu et convient au contexte de pérennité.
- source_word: יעמד
  choice: subsistera
  rationale: עמד signifie littéralement « se tenir, rester debout » et exprime ici la permanence. « Subsistera » conserve cette idée dans un français naturel et digne.
- source_word: עד עולם
  choice: pour toujours
  rationale: Cette locution exprime une durée sans fin; « pour toujours » est la tournure française moderne la plus naturelle.
- source_word: וצדקתם
  choice: leur justice
  rationale: צדקה peut désigner la justice, la droiture ou la conduite juste. « Leur justice » reste proche du terme hébreu sans le réduire explicitement à des actes particuliers.
- source_word: לא תשכח
  choice: ne sera pas oubliée
  rationale: La forme passive est rendue directement et forme un parallèle naturel avec la permanence de leur souvenir.
theological_decisions:
- issue: Divergence entre l’hébreu de la Guéniza du Caire et la tradition grecque ainsi que le manuscrit de Massada
  choice: 'Le texte principal suit l’hébreu de la Guéniza : « Leur souvenir subsistera pour toujours, et leur justice ne sera pas oubliée. »'
  alternative: « Leur descendance subsistera pour toujours, et leur gloire ne sera pas effacée. »
  rationale: L’hébreu conservé est traduit dans le texte principal. La variante attestée par le grec et par Massada modifie substantiellement les deux membres du verset; elle est donc signalée en note plutôt que résolue silencieusement.
translation_notes:
  register: Français international moderne, clair et digne. « Subsistera » exprime naturellement la durée tout en gardant l’image de permanence du verbe hébreu. Le marqueur [a] est placé immédiatement après le membre de phrase concerné.
