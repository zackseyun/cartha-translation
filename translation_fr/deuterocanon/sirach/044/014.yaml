  text: Their bodies were gathered in peace[b][a], and their name lives from generation to generation.
translation:
  language: fr
  text: Leurs corps ont été recueillis en paix[a][b], et leur nom vit de génération en génération.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Leur corps fut enseveli en paix. » Il explicite le sens funéraire là où l’hébreu dit : « ont été recueillis en paix ».'
    reason: alternative_reading
  - marker: b
    text: 'Le manuscrit de Massada conserve ici une leçon plus courte (« si/dans la paix ils ont été recueillis »), tandis que le texte de la Guéniza du Caire porte : « Leurs corps ont été recueillis en paix. »'
    reason: textual_variant
lexical_decisions:
- source_word: גויתם
  choice: leurs corps
  rationale: Le nom hébreu גויה désigne le corps, parfois le cadavre. La forme contextuelle renvoie ici aux corps de plusieurs personnes; le pluriel français est donc naturel, malgré le singulier collectif du grec.
- source_word: בשלום
  choice: dans la paix
  rationale: Cette traduction conserve la tournure prépositionnelle de l’hébreu et son écho dans le grec ἐν εἰρήνῃ, sans la réduire au simple adverbe « paisiblement ».
- source_word: נאספו
  choice: ont été recueillis
  rationale: Le passif du verbe אסף peut évoquer le fait d’être réuni aux siens dans la mort. « Ont été recueillis » garde l’image de l’hébreu sans introduire dans le texte principal le verbe explicite « ensevelir » du témoin grec.
- source_word: ושמם
  choice: et leur nom
  rationale: « Nom » rend directement l’hébreu et préserve l’expression biblique d’une renommée ou d’une mémoire qui demeure.
- source_word: חי
  choice: vit
  rationale: Le présent « vit » conserve la personnification vive de l’hébreu et correspond au grec ζῇ, plutôt que d’aplatir l’expression en « subsiste ».
- source_word: לדור ודור
  choice: de génération en génération
  rationale: Cette expression française courante rend naturellement l’idiome hébreu désignant une continuité au fil des générations.
theological_decisions:
- issue: Faut-il harmoniser l’idiome funéraire hébreu avec le grec explicite « fut enseveli » ?
  choice: 'Conserver dans le texte principal la formulation fondée sur l’hébreu : « ont été recueillis dans la paix »'
  alternative: Leurs corps furent ensevelis dans la paix.
  rationale: L’hébreu conservé doit gouverner le texte principal. Le grec confirme le contexte funéraire et en explicite le sens, mais cette précision est signalée en note plutôt qu’introduite silencieusement dans la traduction.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste proche de l’hébreu tout en étant naturelle; l’image potentiellement ambiguë de « recueillis » est maintenue et éclairée par la note grecque.
