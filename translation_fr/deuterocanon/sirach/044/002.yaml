translation:
  language: fr
  text: Le Très-Haut a accordé un honneur abondant[a][b], et sa grandeur est de toute éternité[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les manuscrits hébreux de la Guéniza du Caire portent חלק עליון, tandis que l’ancien rouleau de Massada lit חולק עליון ; cette dernière leçon appuie le sens : « le Très-Haut a accordé ou réparti ». Le grec dit : « Le Seigneur a créé une grande gloire. »'
    reason: textual_variant
  - marker: b
    text: Ou « une gloire abondante ». Le mot hébreu כבוד et le grec δόξα peuvent désigner l’honneur ou la gloire selon le contexte.
    reason: lexical_alternative
  - marker: c
    text: Ou « depuis les temps anciens » ou « depuis toujours ».
    reason: lexical_alternative
lexical_decisions:
- source_word: רב כבוד
  choice: un grand honneur
  rationale: רב intensifie quantitativement ou qualitativement כבוד. « Un grand honneur » est naturel en français et convient au contexte qui introduit l’éloge des hommes illustres.
- source_word: כבוד
  choice: honneur
  rationale: כבוד peut signifier « honneur » ou « gloire ». Avec le verbe distributif et dans ce contexte, « honneur » convient bien; « gloire » demeure une possibilité signalée en note.
- source_word: חלק / חולק
  choice: a accordé
  rationale: La lecture massorétique ancienne חולק appuie une construction verbale dont le Très-Haut est le sujet. « Accorder » exprime naturellement en français l’idée de répartir ou d’attribuer un honneur.
- source_word: עליון
  choice: le Très-Haut
  rationale: Titre divin français établi, clair et digne.
- source_word: וגדלו
  choice: et sa grandeur
  rationale: Le suffixe se comprend naturellement comme possessif; le grec τὴν μεγαλωσύνην αὐτοῦ confirme « sa grandeur ».
- source_word: מימות עולם
  choice: existe depuis toujours
  rationale: L’expression peut évoquer les temps anciens ou l’éternité. Avec la grandeur divine comme sujet, « depuis toujours » conserve la portée temporelle forte dans un français courant, sans exclure les nuances précisées en note.
theological_decisions:
- issue: Sujet et syntaxe du premier membre
  choice: 'Le Très-Haut est le sujet : « Le Très-Haut a accordé un grand honneur. »'
  alternative: « Le Seigneur a créé une grande gloire » ou « Un grand honneur est la part du Très-Haut »
  rationale: Le texte hébreu est prioritaire là où il subsiste, et la leçon plus ancienne חולק soutient fortement une proposition verbale ayant le Très-Haut pour sujet. Le grec reflète une autre formulation, conservée dans la note textuelle.
- issue: Portée temporelle de מימות עולם
  choice: La grandeur divine « existe depuis toujours »
  alternative: « remonte aux temps anciens » ou « existe de toute éternité »
  rationale: L’hébreu permet aussi bien une antiquité indéfinie qu’une portée éternelle. Le texte principal garde une formulation ouverte et naturelle, tandis que la note conserve les autres possibilités.
translation_notes:
  register: Français international moderne, digne et accessible. « Le Très-Haut » conserve le titre divin traditionnel; « a accordé » rend idiomatiquement la nuance distributive. Les notes préservent les variantes textuelles et l’ambiguïté temporelle.
