base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/017.yaml
  text: Noah was found righteous[a], blameless; at the time of destruction he became a substitute. Because of him a remnant remained[b], and by his covenant the flood ceased.
translation:
  language: fr
  text: Noé fut trouvé juste et intègre ; au temps de la destruction, il devint un substitut[a]. Grâce à lui, un reste subsista, et par son alliance le déluge cessa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une contrepartie », « une compensation » ou « une rançon ». L’hébreu תחליף et le grec ἀντάλλαγμα évoquent tous deux ce qui est donné ou placé en échange.
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec parallèle formule différemment les deux dernières propositions : il évoque un reste pour la terre, puis la venue d’un déluge, plutôt que sa cessation. Le témoin hébreu suivi ici porte : « par son alliance le déluge cessa ».'
    reason: textual_variant
lexical_decisions:
- source_word: נח
  choice: Noé
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: צדיק
  choice: juste
  rationale: Rend la droiture morale exprimée par l’hébreu et correspond au grec δίκαιος.
- source_word: תמים
  choice: intègre
  rationale: Dans ce contexte, le terme décrit une conduite entière et irréprochable, non une perfection absolue. « Intègre » est naturel en français moderne.
- source_word: לעת כלה
  choice: au temps de la destruction
  rationale: כלה désigne ici une ruine destructrice, et non simplement une fin chronologique.
- source_word: תחליף
  choice: un substitut
  rationale: Le mot désigne ce qui prend la place d’autre chose. « Substitut » garde cette idée sans préciser excessivement la nature de l’échange.
- source_word: בעבורו
  choice: Grâce à lui
  rationale: La locution présente Noé comme la raison de la préservation du reste ; la tournure française exprime clairement cette causalité favorable.
- source_word: שארית
  choice: un reste subsista
  rationale: « Reste » conserve la résonance biblique de survivants préservés au milieu du jugement, tandis que « subsista » donne une phrase française naturelle.
- source_word: ובבריתו
  choice: par son alliance
  rationale: La préposition est comprise dans un sens instrumental. Le suffixe renvoie le plus naturellement à Noé et à l’alliance qui lui est associée.
- source_word: חדל מבול
  choice: le déluge cessa
  rationale: חדל signifie cesser ou prendre fin. Cette traduction suit directement le témoin hébreu.
theological_decisions:
- issue: Divergence entre les témoins hébreu et grec dans la dernière proposition
  choice: 'Suivre l’hébreu conservé : « par son alliance le déluge cessa »'
  alternative: Le grec transmis semble plutôt évoquer la venue du déluge sur la terre.
  rationale: Lorsque l’hébreu du Siracide est conservé, il constitue ici le texte source prioritaire. La divergence modifie sensiblement le sens et est donc signalée en note sans corriger silencieusement l’hébreu à partir du grec.
- issue: Portée de תחליף appliqué à Noé
  choice: « un substitut », avec les autres nuances signalées en note
  alternative: « une contrepartie », « une compensation » ou « une rançon »
  rationale: L’hébreu et le grec parallèle expriment quelque chose donné ou placé en échange. Le contexte ne permet pas d’imposer une interprétation doctrinale plus précise.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du parallélisme hébreu tout en étant naturelle. « Intègre » évite de suggérer une perfection absolue, et les notes préservent l’ambiguïté lexicale ainsi que la divergence textuelle.
