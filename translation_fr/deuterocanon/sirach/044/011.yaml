  text: But these are men of steadfast love[b][a], and their hope will not cease.
translation:
  language: fr
  text: Mais ceux-ci sont des hommes animés d’un amour fidèle[b], et leur espérance ne cessera pas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec porte plutôt : « Avec leur descendance demeure un excellent héritage : leurs descendants. » Le texte hébreu de la Geniza du Caire lit ici : « ceux-ci sont des hommes d’amour fidèle, et leur espérance ne cessera pas ». Le manuscrit de Massada présente lui aussi, dans le contexte environnant, une formulation différente, centrée sur la descendance et la permanence.'
    reason: textual_variant
  - marker: b
    text: Ou « amour constant », « bonté », « miséricorde » ou « loyauté » pour le mot hébreu חֶסֶד.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Mais
  rationale: Marque naturellement le contraste avec ceux dont le souvenir a disparu dans le contexte précédent.
- source_word: אֵלֶּה
  choice: ceux-ci
  rationale: Démonstratif direct renvoyant aux ancêtres exemplaires dont il est question.
- source_word: אַנְשֵׁי
  choice: des hommes d’
  rationale: Respecte le masculin pluriel de l’hébreu et la référence contextuelle aux ancêtres célèbres.
- source_word: חֶסֶד
  choice: amour fidèle
  rationale: Rend à la fois la bienveillance relationnelle et la fidélité que peut exprimer חֶסֶד, sans réduire le terme à la seule bonté ou miséricorde.
- source_word: וְתִקְוָתָם
  choice: et leur espérance
  rationale: Traduction directe de תִּקְוָה avec le suffixe possessif; « espérance » convient au registre biblique tout en restant courant.
- source_word: לֹא תִשְׁבֹּת
  choice: ne cessera pas
  rationale: Conserve le sens verbal de שבת, « cesser, s’arrêter », sans préciser indûment la manière dont l’espérance demeure.
theological_decisions:
- issue: Divergence textuelle entre le texte hébreu de la Gueniza du Caire et le parallèle grec
  choice: 'Traduire dans le texte principal la leçon hébraïque conservée: « ceux-ci sont des hommes d’amour fidèle, et leur espérance ne cessera pas »'
  alternative: 'Suivre le grec: « Avec leur descendance demeure un excellent héritage: leurs descendants. »'
  rationale: Lorsque l’hébreu de Ben Sira est conservé, il sert ici de texte principal. La tradition grecque présente une ligne substantiellement différente; elle est donc signalée en note plutôt qu’intégrée silencieusement au texte.
translation_notes:
  register: Français moderne, digne et accessible. « Amour fidèle » conserve la richesse relationnelle de חֶסֶד; « espérance » maintient une tonalité biblique naturelle. Les appels de note sont placés immédiatement après les éléments auxquels ils se rapportent.
