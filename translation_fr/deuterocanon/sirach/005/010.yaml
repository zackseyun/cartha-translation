  text: Do not delay to return to him[b][a], and do not put it off from day to day.
translation:
  language: fr
  text: Ne tarde pas à revenir à lui[a], et ne remets pas cela de jour en jour[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Revenir à lui » désigne probablement le fait de revenir à Dieu, dans la repentance, bien que l’hébreu dise simplement « à lui ».
    reason: alternative_reading
  - marker: b
    text: Ou « ne le reporte pas d’un jour au lendemain ». Le verbe hébreu est difficile, mais le contexte indique clairement un ajournement répété.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּאַחֵר
  choice: Ne tarde pas
  rationale: Rend directement l’interdiction et le sens causatif de אחר, qui exprime ici le fait de différer ou de tarder.
- source_word: לָשׁוּב
  choice: à revenir
  rationale: שוב signifie « revenir, retourner » et peut, dans ce contexte, évoquer un retour moral vers Dieu sans que cette idée soit explicitée davantage.
- source_word: אֵלָיו
  choice: à lui
  rationale: Le pronom hébreu est conservé, puisque ce verset ne nomme pas explicitement son référent.
- source_word: וְאַל תִּתְעַבֵּר
  choice: et ne remets pas cela
  rationale: Le verbe hébreu est difficile, mais le parallélisme et l’expression temporelle qui suit indiquent nettement l’idée d’un ajournement.
- source_word: מִיּוֹם אֶל יוֹם
  choice: de jour en jour
  rationale: Expression française naturelle qui reproduit l’idée d’un report répété au fil des jours.
theological_decisions:
- issue: Faut-il préciser que le retour est un retour vers Dieu dans la repentance ?
  choice: Conserver la formulation implicite « revenir à lui »
  alternative: « revenir à Dieu » ou « te repentir et revenir à lui »
  rationale: Le contexte désigne vraisemblablement Dieu et שוב peut avoir une portée de repentance, mais l’hébreu du verset dit seulement « à lui ».
- issue: Interprétation du verbe difficile תִּתְעַבֵּר
  choice: Le rendre par « ne remets pas cela »
  alternative: « ne diffère pas » ou « ne tarde pas »
  rationale: Malgré l’incertitude lexicale, le parallélisme avec la première proposition et « de jour en jour » favorisent clairement le sens d’ajourner. Le grec diverge fortement ici et ne régit donc pas la traduction du texte hébreu.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier correspond aux impératifs hébreux. La formulation garde implicite le référent divin et signale en note l’incertitude du second verbe.
