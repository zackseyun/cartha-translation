base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/005/012.yaml
  text: Do not trust in deceitful wealth[b][a], for it will not profit in the day of wrath.
translation:
  language: fr
  text: Ne te fie pas à des richesses trompeuses[b], car elles ne serviront à rien au jour de la colère[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La tradition grecque présente ici un texte très différent : « Si tu as de l’intelligence, réponds à ton prochain ; sinon, que ta main soit sur ta bouche. » La présente traduction suit le témoin hébreu conservé.'
    reason: textual_variant
  - marker: b
    text: Ou « de fausses richesses », « des richesses frauduleuses » ou « des richesses mensongères ». L’hébreu peut désigner des biens entachés de tromperie, soit parce qu’ils ont été acquis malhonnêtement, soit parce qu’ils se révèlent peu fiables.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּבְטַח עַל
  choice: Ne mets pas ta confiance dans
  rationale: Rend naturellement en français moderne l’interdiction et l’idée de placer sa sécurité ou son assurance en quelque chose.
- source_word: נִכְסֵי
  choice: des richesses
  rationale: Le terme désigne collectivement les biens, les possessions ou la fortune; « richesses » convient au contexte sapientiel.
- source_word: שֶׁקֶר
  choice: trompeuses
  rationale: Préserve l’idée de fausseté ou de tromperie sans décider si les richesses ont été acquises frauduleusement ou si elles se révèlent simplement peu fiables.
- source_word: לֹא יוֹעִילוּ
  choice: elles ne serviront à rien
  rationale: Expression idiomatique qui transmet clairement l’absence de secours ou d’utilité, sans forcer une résonance strictement financière.
- source_word: בְּיוֹם עֶבְרָה
  choice: au jour de la colère
  rationale: Conserve la tournure solennelle et la force de עֶבְרָה, tout en laissant inexprimée l’identité de celui dont vient la colère.
theological_decisions:
- issue: Portée judiciaire ou théologique de עֶבְרָה
  choice: la colère
  alternative: la fureur; le jugement
  rationale: « Colère » traduit directement le nom hébreu sans ajouter explicitement « de Dieu ». La formule « au jour de la colère » maintient néanmoins sa possible portée judiciaire.
- issue: Choix entre le témoin hébreu et la tradition grecque divergente
  choice: Suivre le texte hébreu conservé
  alternative: 'Suivre le grec : « Si tu as de l’intelligence, réponds à ton prochain; sinon, mets la main sur ta bouche. »'
  rationale: Le témoin hébreu est disponible et jugé fiable pour ce verset; la lecture grecque, substantiellement différente, est signalée en note plutôt que substituée au texte hébreu.
translation_notes:
  register: Français international moderne, sobre et sentencieux. La formulation reste accessible tout en conservant la cadence d’un avertissement sapientiel et l’ambiguïté du texte hébreu.
