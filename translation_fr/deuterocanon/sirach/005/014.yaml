  text: Be firm in your understanding[a], and let your word be one.
translation:
  language: fr
  text: Sois ferme dans ton discernement, et que ta parole soit cohérente[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec présente une forme différente : « Ne passe pas pour un médisant et ne tends pas de pièges avec ta langue ; car la honte atteint le voleur, et une sévère condamnation l’homme à la langue double. » Il souligne l’opposition à une parole double ou trompeuse.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֱיֶה סָמוּךְ
  choice: Sois ferme
  rationale: L’impératif et l’adjectif expriment un état de stabilité ou de fermeté. « Sois ferme » est naturel en français et conserve la concision de l’exhortation.
- source_word: עַל דַּעְתֶּךָ
  choice: dans ton discernement
  rationale: דעת peut désigner la connaissance, l’intelligence ou le jugement. Dans ce contexte sapientiel, « discernement » évoque une compréhension réfléchie plutôt qu’une simple somme de connaissances.
- source_word: וְאֶחָד
  choice: une
  rationale: Le texte hébreu dit littéralement « un/une ». Conserver ce terme préserve l’expression ramassée et son opposition implicite à une parole divisée ou double.
- source_word: יְהִי
  choice: que … soit
  rationale: Le jussif hébreu a ici une valeur exhortative, naturellement rendue en français par « que … soit ».
- source_word: דְבָרֶךָ
  choice: ta parole
  rationale: דבר peut signifier « parole », « propos » ou « chose ». « Ta parole » garde le singulier et s’accorde naturellement avec « une », tout en désignant ce que la personne dit.
theological_decisions:
- issue: Rapport entre la ligne hébraïque et le parallèle grec, qui présente une forme sensiblement différente centrée sur la médisance et la duplicité de langage
  choice: Traduire directement l’hébreu conservé comme une exhortation à un discernement ferme et à une parole une, tout en signalant la teneur du grec en note.
  alternative: 'Suivre le grec : « Ne te fais pas appeler médisant… la condamnation frappe l’homme à la langue double. »'
  rationale: Puisque le texte hébreu de ce passage est conservé avec une haute confiance, il sert de texte principal. Le grec paraît témoigner d’une autre forme du verset ou d’un développement plus libre, mais son avertissement contre la langue double éclaire probablement la portée de « que ta parole soit une » sans devoir remplacer l’hébreu.
translation_notes:
  register: Français moderne, sobre et sentencieux, avec tutoiement conforme au style d’une exhortation sapientielle. « Discernement » est courant et digne; la formulation volontairement compacte « ta parole soit une » conserve l’image et l’ambiguïté expressive de l’hébreu.
