    issue: 'Formulation peu naturelle : « que ta parole soit une »'
    rationale: Bien que littérale, cette tournure n’est pas idiomatique en français moderne international et risque d’être comprise comme une affirmation abstraite plutôt que comme une exhortation à une parole non double.
  - severity: low
    issue: Ancre de la note placée après « discernement »
    rationale: La note concerne surtout la parole une/double et le parallèle grec ; elle doit donc être ancrée au second membre.
  - severity: low
    issue: Présentation trop affirmative du rapport avec le grec
    rationale: Le grec offre une forme sensiblement différente, incluant le voleur, le guet-apens avec la langue et la condamnation du bilingue/double-langue. La note doit signaler cette divergence sans prétendre qu’elle confirme directement le texte hébreu.
