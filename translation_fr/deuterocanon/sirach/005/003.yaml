  terminology: « Convoitises » rend bien חֲמוּדוֹת dans ce contexte moral sans restreindre le sens à la sexualité. « Mauvaises » conserve la qualification morale de רָעָה. La note grecque traduit plus précisément l’idée de vengeance/exercice de la vengeance que le simple « punira ».
