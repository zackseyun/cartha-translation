  source_fidelity: Le texte principal conserve l’interdiction, l’image hébraïque concrète du « cœur » et des « yeux », ainsi que le lien avec des convoitises moralement mauvaises. La révision rend plus directement le second infinitif (« marcher dans ») au lieu de l’interpréter par « aller au gré de ».
