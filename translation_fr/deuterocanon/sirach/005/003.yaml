    rationale: « Pour aller au gré de mauvais désirs » est naturel, mais « au gré de » introduit l’idée de caprice et s’éloigne du parallèle verbal hébreu « aller/marcher ... dans ». « Pour marcher dans de mauvaises convoitises » est plus proche sans être obscur.
