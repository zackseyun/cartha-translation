  text: Do not go after your heart and your eyes[b][a], to walk in evil desires.
translation:
  language: fr
  text: Ne suis pas ton cœur ni tes yeux, pour marcher dans de mauvaises convoitises.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression concrète « ton cœur et tes yeux » évoque à la fois le désir intérieur et ce qui attire le regard. On pourrait aussi traduire : « Ne suis pas ton cœur ni tes yeux, pour marcher dans de mauvais désirs. »'
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec diffère sensiblement : « Et ne dis pas : “Qui exercera son pouvoir sur moi ?” Car le Seigneur exercera certainement sa vengeance contre toi. » La présente traduction suit le témoin hébreu et signale ici cette tradition parallèle divergente.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תֵּלֵךְ אַחֲרֵי
  choice: Ne suis pas
  rationale: Littéralement « ne va pas derrière ». En français actuel, « ne suis pas » restitue naturellement l’idiome sans en affaiblir l’interdiction.
- source_word: לִבְּךָ וְעֵינֵיךָ
  choice: ton cœur et tes yeux
  rationale: Le maintien des deux termes conserve l’image concrète de l’élan intérieur et de l’attrait perçu, ainsi que sa résonance biblique.
- source_word: לָלֶכֶת
  choice: pour aller au gré de
  rationale: Cette formulation rend la valeur de l’infinitif et exprime l’idée de se laisser conduire, tout en évitant en français la répétition peu naturelle de « aller » après l’idiome initial.
- source_word: בַּחֲמוּדוֹת רָעָה
  choice: de mauvais désirs
  rationale: חֲמוּדוֹת peut désigner des choses désirables, des convoitises ou des désirs. Ici, l’association du cœur et des yeux favorise le sens de désirs moralement mauvais, sans imposer la nuance plus étroite de « passions » ou de « désirs charnels ».
theological_decisions:
- issue: Image anthropologique du « cœur et des yeux »
  choice: Conserver « ton cœur et tes yeux » dans le texte principal
  alternative: Ne suis pas tes propres désirs
  rationale: L’hébreu distingue l’élan intérieur et l’attrait extérieur. Garder cette tension concrète évite de réduire le propos à une abstraction psychologique.
- issue: Sens de חֲמוּדוֹת רָעָה
  choice: mauvais désirs
  alternative: convoitises mauvaises ; choses mauvaises que tu convoites
  rationale: La construction hébraïque est condensée et permet plusieurs nuances. « Mauvais désirs » communique clairement la portée morale sans préciser indûment leur objet.
- issue: Divergence entre les témoins hébreu et grec
  choice: Suivre le témoin hébreu fourni comme texte principal et signaler le grec en note
  alternative: 'Adopter le texte grec : « Ne dis pas : Qui pourra me dominer ? Car le Seigneur te punira certainement. »'
  rationale: Le témoin hébreu est ici la source originale de confiance élevée, tandis que le grec représente une tradition parallèle substantiellement différente. La variante doit rester visible plutôt que d’être harmonisée.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement singulier correspond aux formes hébraïques. La syntaxe demeure proche de l’image source, mais « aller au gré de » assure une lecture naturelle et explicite le mouvement de soumission aux désirs sans paraphrase doctrinale.
