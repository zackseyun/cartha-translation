  text: For suddenly his wrath will come forth[a], and at the time of vengeance you will be swept away.
translation:
  language: fr
  text: Car sa colère éclatera soudain[a], et au temps de la vengeance, tu seras emporté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle de ce verset est très différent : « Sois prompt à écouter et réponds avec patience. » Le texte principal suit ici le témoin hébreu conservé, dont la formulation diverge nettement de la tradition grecque.'
    reason: textual_variant
lexical_decisions:
- source_word: פִתאוֹם
  choice: soudain
  rationale: Rend directement l’adverbe hébreu et conserve la brusquerie de l’avertissement.
- source_word: יֵצֵא
  choice: éclatera
  rationale: Le verbe signifie littéralement « sortira ». Avec la colère pour sujet, « éclatera » exprime naturellement en français son surgissement soudain sans en atténuer la force.
- source_word: זַעְמוֹ
  choice: sa colère
  rationale: זעם désigne une vive indignation. « Sa colère » est actuel et digne; le possessif maintient le référent implicite sans ajouter explicitement « Dieu ».
- source_word: וּבְעֵת
  choice: et au temps de
  rationale: Préserve la construction temporelle formelle de l’hébreu tout en restant idiomatique.
- source_word: נָקָם
  choice: la vengeance
  rationale: Conserve la force rétributive de נָקָם, plutôt que de la généraliser en simple « châtiment ».
- source_word: תִּסָּפֶה
  choice: tu seras emporté
  rationale: Rend l’idée passive d’être balayé ou supprimé, avec l’image vive du texte, sans préciser indûment la manière de la destruction.
theological_decisions:
- issue: Référent implicite du suffixe dans זַעְמוֹ (« sa colère »)
  choice: Conserver le possessif « sa », Dieu ou le Seigneur étant le référent suggéré par le contexte.
  alternative: Expliciter « la colère de Dieu » ou comprendre le possessif comme renvoyant à une autorité non précisée.
  rationale: Le verset ne nomme pas lui-même le référent. Le possessif respecte cette implicitation et évite de résoudre dans la traduction ce que le contexte permet seulement d’identifier.
translation_notes:
  register: Français international moderne, naturel et digne. « Éclatera soudain » privilégie une expression française courante tout en conservant l’image d’une colère qui surgit; « au temps de la vengeance » maintient la solennité de l’avertissement sapientiel.
