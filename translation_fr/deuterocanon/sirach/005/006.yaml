  text: Do not say, “The LORD is compassionate; he will wipe away all my iniquities.”
translation:
  language: fr
  text: 'Ne dis pas : « Le SEIGNEUR est compatissant ; il effacera toutes mes fautes. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַחוּם
  choice: compatissant
  rationale: Rend directement l’adjectif hébreu exprimant la compassion ou la miséricorde, dans un français naturel et digne.
- source_word: יהוה
  choice: le SEIGNEUR
  rationale: Suit la convention française courante qui représente le tétragramme par « le SEIGNEUR ».
- source_word: עֲוֹנוֹתַי
  choice: mes fautes
  rationale: « Fautes » exprime ici les actes coupables visés par עָוֹן sans imposer une précision doctrinale absente du texte.
- source_word: יִמְחֶה
  choice: il effacera
  rationale: Conserve l’image concrète du verbe hébreu מחה, « effacer », plutôt que de l’expliciter comme pardon ou expiation.
theological_decisions:
- issue: Portée de l’affirmation sur la compassion divine
  choice: Conserver la parole présomptueuse sous forme de citation interdite, sans nier en soi la compassion du Seigneur.
  alternative: Reformuler pour dire explicitement que Dieu ne pardonnera pas.
  rationale: Le verset condamne l’usage présomptueux de la compassion divine comme garantie d’impunité; il ne nie pas cette compassion.
- issue: Relation entre compassion et effacement des fautes
  choice: Maintenir la juxtaposition simple de l’hébreu.
  alternative: Ajouter une relation causale explicite, comme « puisqu’il est compatissant ».
  rationale: L’hébreu ne marque pas explicitement le lien logique; la traduction préserve cette concision et sa tension.
translation_notes:
  register: Français international moderne, sobre et dignifié. La ponctuation rend clairement le discours cité. Le texte suit le témoin hébreu fourni; l’expansion grecque sur la miséricorde et la colère n’est pas ajoutée, puisqu’elle n’apparaît pas dans ce texte hébreu.
