translation:
  language: fr
  text: 'Et tu as dit : « Ses actes de compassion sont nombreux ; il pardonnera la multitude de mes fautes. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte ici : « Ne t’appuie pas sur des richesses mal acquises, car elles ne te serviront à rien au jour du châtiment. » Le témoin hébreu conservé met plutôt en garde contre la présomption qui abuse de la compassion de Dieu.'
    reason: textual_variant
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Et tu as dit
  rationale: Le passé composé rend directement la forme accomplie hébraïque, sans la transformer en impératif, même si la phrase s’inscrit dans un contexte d’avertissement.
- source_word: רַחֲמָיו רַבִּים
  choice: Ses compassions sont nombreuses
  rationale: Cette formulation conserve le pluriel hébreu et le sens quantitatif de רַבִּים. « Sa compassion est grande » serait plus idiomatique, mais effacerait le nombre grammatical et l’image d’actes répétés de compassion.
- source_word: לְרֹב עֲוֹנוֹתַי
  choice: la multitude de mes fautes
  rationale: « Multitude » préserve la valeur quantitative de רֹב, tandis que « fautes » exprime naturellement en français le poids moral de עָוֹן au pluriel. La construction française rattache ce groupe au verbe pardonner, conformément au sens présumé de la déclaration.
- source_word: יִסְלָח
  choice: il pardonnera
  rationale: Le futur rend l’attente présomptueuse exprimée par le locuteur. « Pardonner » est le terme français courant et précis.
theological_decisions:
- issue: Le texte grec parallèle transmet une mise en garde très différente, portant sur les richesses injustes et le jour de l’intervention divine.
  choice: Traduire le témoin hébreu conservé dans le texte principal et signaler la leçon grecque en note.
  alternative: 'Suivre le grec : « Ne t’appuie pas sur des richesses injustes, car elles ne te serviront à rien au jour de l’intervention. »'
  rationale: Le témoin hébreu est ici assuré et doit rester prioritaire. Comme le grec ne constitue pas une simple différence de formulation mais transmet une autre mise en garde, sa leçon est conservée explicitement en note sans harmonisation.
translation_notes:
  register: Français moderne, digne et accessible. Le pluriel inhabituel « compassions » est maintenu afin de refléter le pluriel hébreu. Le passé composé conserve la forme verbale de la source, malgré la possibilité contextuelle d’un présent admonitif.
