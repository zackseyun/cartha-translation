  terminology: « Fautes » est un choix moderne acceptable pour עֲוֹנוֹתַי dans ce contexte. « Actes de compassion » transmet de façon claire le pluriel de רַחֲמָיו sans imposer une terminologie confessionnelle. La note identifie correctement la divergence matérielle entre le témoin hébreu et le grec.
