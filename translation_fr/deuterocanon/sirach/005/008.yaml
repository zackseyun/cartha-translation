  source_fidelity: 'Le texte principal suit le témoin hébreu : וְאָמַרְתָּ est rendu au passé composé, רַחֲמָיו רַבִּים conserve l’idée d’une pluralité d’actes de compassion, et יִסְלָח garde sa valeur prospective. La construction « il pardonnera la multitude de mes fautes » exprime naturellement en français le pardon attendu par le locuteur, sans résoudre davantage la relation nuancée de לְרֹב (« devant / malgré / à l’égard de la multitude de »).'
