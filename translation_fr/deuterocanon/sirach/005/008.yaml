    rationale: Pour χρήματα ἄδικα, « richesses mal acquises » est plus idiomatique et concret que « richesses injustes ». Dans cet avertissement, ἡμέρα ἐπαγωγῆς désigne un jour de calamité ou de châtiment ; « intervention » reste trop indéterminé.
