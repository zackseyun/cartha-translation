  text: For mercy and anger are with him[a], and his wrath comes to rest on the wicked.
translation:
  language: fr
  text: Car la compassion et la colère sont avec lui[a], et sa fureur reposera sur les méchants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La tradition grecque porte à la place : « Ne vanne pas à tout vent et ne marche pas dans n’importe quel sentier ; tel est le pécheur à la langue double. » Cette formulation diffère profondément de l’hébreu conservé et reflète probablement une autre forme textuelle du verset.'
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit la raison de l’exhortation précédente.
- source_word: רַחֲמִים
  choice: la compassion
  rationale: Le pluriel abstrait hébreu désigne ici la compassion miséricordieuse; « compassion » est naturel en français et forme un contraste clair avec « colère ».
- source_word: אַף
  choice: la colère
  rationale: Bien que le sens concret soit « nez », le terme exprime couramment la colère en hébreu; ce choix le distingue de רָגְזוֹ dans le second membre.
- source_word: עִמּוֹ
  choice: sont avec lui
  rationale: La formulation conserve la préposition hébraïque et l’idée que compassion et colère se trouvent auprès de Dieu, sans expliciter dans le texte un référent seulement implicite.
- source_word: אֵל
  choice: sur
  rationale: La préposition indique ici la cible vers laquelle la fureur se porte.
- source_word: רְשָעִים
  choice: les méchants
  rationale: Rendu collectif, concis et usuel du substantif pluriel.
- source_word: יָנוּחַ
  choice: s’abat
  rationale: Dans ce contexte de fureur dirigée contre les méchants, « s’abat sur » rend idiomatiquement le mouvement vers un point où elle vient reposer, tout en évitant l’expression peu naturelle « vient se reposer sur ».
- source_word: רָגְזוֹ
  choice: sa fureur
  rationale: « Fureur » exprime l’agitation courroucée du terme et maintient une nuance plus forte que אַף, rendu par « colère ».
theological_decisions:
- issue: Référent des suffixes pronominaux (« avec lui », « sa fureur »)
  choice: Dieu est le référent implicite, sans ajout du nom « Dieu » dans le corps du verset.
  alternative: 'Expliciter : « avec Dieu » et « la fureur de Dieu ».'
  rationale: Le contexte identifie suffisamment Dieu, mais l’hébreu ne le nomme pas dans cette ligne; conserver les pronoms respecte cette formulation et sa tension.
- issue: Divergence substantielle entre le témoin hébreu et la tradition grecque
  choice: Traduire en priorité l’hébreu conservé et signaler le grec en note.
  alternative: 'Suivre le grec : « Ne vanne pas à tout vent et ne marche pas dans n’importe quel sentier; tel est le pécheur à la langue double. »'
  rationale: Le témoin hébreu est la source principale lorsqu’il est disponible; la différence grecque affecte toutefois tout le sens du verset et doit donc être documentée.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme est maintenu; « s’abat sur » privilégie une tournure française vivante tout en conservant l’idée de la fureur atteignant et demeurant sur sa cible.
