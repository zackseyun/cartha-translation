  text: Do not rely on forgiveness to add sin to sin[a].
translation:
  language: fr
  text: Ne compte pas sur le pardon pour ajouter péché sur péché[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec dit : « Ne tarde pas à te tourner vers le Seigneur et ne diffère pas de jour en jour, car soudain la colère du Seigneur éclatera et, au temps du châtiment, tu périras. » Le texte hébreu conservé ici est plus court et insiste précisément sur le danger de présumer du pardon tout en continuant à pécher.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶל סְלִיחָה
  choice: sur le pardon
  rationale: Avec בָּטַח, la préposition introduit ce sur quoi l’on compte. « Compter sur le pardon » rend naturellement l’expression hébraïque en français.
- source_word: אַל תִּבְטָח
  choice: Ne compte pas
  rationale: Le verbe בטח exprime la confiance ou le fait de s’appuyer sur quelque chose. Ici, « ne compte pas » traduit précisément la confiance présomptueuse visée par l’avertissement.
- source_word: סְלִיחָה
  choice: pardon
  rationale: Le nom désigne la rémission d’une faute. « Pardon » est clair, courant et convient mieux ici à la tournure « compter sur » que des formulations plus abstraites.
- source_word: לְהוֹסִיף
  choice: pour ajouter
  rationale: 'L’infinitif peut exprimer le but ou le résultat : il relie directement la confiance dans le pardon à la poursuite des fautes, sans trancher plus finement entre intention et conséquence.'
- source_word: עָוֹן עַל עָוֹן
  choice: péché à péché
  rationale: עָוֹן peut désigner la faute, le péché ou la culpabilité. La répétition avec עַל évoque l’ajout d’une faute à une autre; « ajouter péché à péché » conserve cette image et sa force sapientielle.
theological_decisions:
- issue: Rapport entre le pardon divin et la persistance dans le péché
  choice: Le verset met en garde contre le fait de compter présomptueusement sur le pardon pour continuer à pécher.
  alternative: On pourrait y voir seulement une mise en garde générale contre une assurance excessive d’être pardonné.
  rationale: La syntaxe hébraïque relie la confiance dans le pardon à l’ajout d’un péché à un autre. Le parallèle grec développe cette idée en avertissant de ne pas différer le retour au Seigneur jusqu’à ce que survienne le jugement; le texte ne nie donc pas le pardon, mais condamne la présomption qui entretient le péché.
translation_notes:
  register: Français moderne, direct et digne. L’impératif au singulier conserve l’adresse sapientielle. La formulation concise suit le texte hébreu, tandis que la note signale l’important développement du parallèle grec.
