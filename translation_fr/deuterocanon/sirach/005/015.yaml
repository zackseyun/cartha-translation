  text: Be quick to listen[c][b][a], and with patience give a reply.
translation:
  language: fr
  text: Sois prompt à écouter[c], et réponds avec patience[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « avec longueur d’esprit », expression qui évoque la patience, la retenue ou la maîtrise de soi.
    reason: lexical_alternative
  - marker: b
    text: Ou « rends une parole avec patience ». L’expression hébraïque est concise ; « réponds » en exprime ici le sens probable.
    reason: alternative_reading
  - marker: c
    text: Le texte grec transmis pour ce verset diffère sensiblement de l’hébreu conservé et semble représenter une autre forme du texte. La traduction suit ici le témoin hébreu.
    reason: textual_variant
lexical_decisions:
- source_word: הֱיֶה מְמַהֵר
  choice: Sois prompt
  rationale: L’impératif accompagné du participe exprime la disponibilité et l’empressement. « Sois prompt » garde la force exhortative dans un français digne et naturel.
- source_word: לְהַאֲזִין
  choice: à écouter
  rationale: Le verbe désigne une écoute attentive, et non la simple perception d’un son. « Écouter » rend clairement ce sens actif.
- source_word: וּבְאֶרֶךְ רוּחַ
  choice: avec patience
  rationale: Littéralement « dans la longueur de souffle/esprit », cette expression idiomatique évoque la patience et la maîtrise de sa réaction.
- source_word: הָשֵׁב
  choice: réponds
  rationale: Le verbe signifie ici rendre ou retourner une parole. « Réponds » exprime naturellement l’action demandée en français.
- source_word: פִּתְגָּם
  choice: réponds (objet implicite)
  rationale: Le nom peut désigner une parole, un propos ou une réponse. Avec הָשֵׁב, le français peut rendre avec naturel l’ensemble par le verbe intransitif « réponds », tandis qu’une note conserve la concision et l’étendue lexicales de l’hébreu.
