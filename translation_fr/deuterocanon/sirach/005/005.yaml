base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/005/005.yaml
  text: Do not say[a], “I have sinned[b], and what has been done to me? Nothing,” for God is patient.
translation:
  language: fr
  text: 'Ne dis pas : « J’ai péché, et que m’arrivera-t-il ? Rien ! » Car Dieu est patient[a].[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Dieu est lent à la colère ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le parallèle grec présente une autre formulation : « Ne sois pas sans crainte au sujet de l’expiation, au point d’ajouter péché à péché. » Le témoin hébreu avertit de ne pas croire que le péché restera sans conséquence parce que Dieu est patient; les deux formulations mettent en garde contre l’abus de la miséricorde divine.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Ne dis pas
  rationale: Rend directement et naturellement l’impératif négatif hébreu.
- source_word: חָטָאתִי
  choice: J’ai péché
  rationale: Le passé composé exprime un acte accompli dont la portée demeure présente dans le raisonnement du locuteur.
- source_word: וְמַה יֵעָשֶׂה לִי
  choice: et que m’arrivera-t-il ?
  rationale: Cette formulation française naturelle conserve la valeur possible de futur de l’imparfait hébreu et exprime l’idée d’une conséquence subie, sans préciser qui l’infligerait. Le passif plus formel « que me sera-t-il fait ? » serait moins idiomatique.
- source_word: מְאוּמָה
  choice: Rien !
  rationale: 'Le terme constitue ici une réponse elliptique à la question rhétorique : aucune conséquence.'
- source_word: כִּי
  choice: Car
  rationale: Introduit de façon concise la raison invoquée pour justifier à tort ce sentiment d’impunité.
- source_word: אֵל
  choice: Dieu
  rationale: Équivalent français naturel de cette désignation sémitique de Dieu dans le contexte sapientiel.
- source_word: אֶרֶךְ אַפַּיִם
  choice: est patient
  rationale: L’expression idiomatique signifie littéralement « lent à la colère ». « Est patient » est clair en français moderne et met en évidence la patience divine dont le pécheur risque d’abuser; le sens littéral est conservé en note.
- source_word: הוּא
  choice: est
  rationale: En français, le pronom hébreu est naturellement intégré à la proposition copulative ayant « Dieu » pour sujet.
theological_decisions:
- issue: Sens de l’attribut divin אֶרֶךְ אַפַּיִם
  choice: Dieu est patient
  alternative: Dieu est lent à la colère
  rationale: Le verset met en garde contre l’abus de la patience divine, sans nier ni affirmer explicitement le moment du jugement. La traduction principale est actuelle et accessible; la note préserve l’image biblique plus littérale.
- issue: Rapport entre le témoin hébreu et le parallèle grec
  choice: Traduire le témoin hébreu dans le texte principal et signaler la lecture grecque en note
  alternative: 'Suivre le grec : « Ne sois pas sans crainte au sujet de l’expiation, au point d’ajouter péché à péché »'
  rationale: La source hébraïque fournie est de haute confiance et présente ici une formulation cohérente. La divergence grecque est néanmoins substantielle et doit être conservée afin de ne pas masquer l’histoire textuelle ni la tension entre les témoins.
translation_notes:
  register: Français international moderne, sobre et digne. Le discours direct demeure vif et compréhensible. Le futur de « que m’arrivera-t-il ? » respecte la valeur ouverte de la forme hébraïque tout en évitant un passif artificiel en français. Tous les appels de note figurent dans le texte principal.
