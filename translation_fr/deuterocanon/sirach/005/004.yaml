  text: Do not say[a], “Who can withstand his power?” for Yahweh seeks the persecuted.
translation:
  language: fr
  text: 'Ne dis pas[a] : « Qui peut résister à sa puissance ? » Car Yahvé recherche les persécutés.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Ne dis pas : “J’ai péché, et que m’est-il arrivé ?” car le Seigneur est patient. » Il reflète probablement un texte sous-jacent différent de l’hébreu conservé.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Ne dis pas
  rationale: Impératif négatif direct et naturel, introduisant les paroles rapportées.
- source_word: מִי יוּכַל כֹּחוֹ
  choice: Qui peut résister à sa puissance ?
  rationale: L’hébreu transmis est concis et quelque peu difficile. « Résister à » explicite sobrement la valeur adversative implicite de יוכל, tandis que « puissance » rend כֹּחוֹ sans atténuer la portée rhétorique.
- source_word: כִּי
  choice: Car
  rationale: Introduit de façon concise la raison de l’interdiction.
- source_word: יְהֹוָה
  choice: Yahvé
  rationale: Rend explicitement le tétragramme dans un français biblique courant et digne.
- source_word: מְבַקֵּשׁ
  choice: recherche
  rationale: Conserve le sens actif de « chercher » et suggère que Dieu se met en quête des victimes, sans ajouter explicitement une idée de jugement absente du verbe.
- source_word: נִרְדָּפִים
  choice: les persécutés
  rationale: Rend le participe passif de רדף dans son sens moral et humain le plus naturel ici; « les poursuivis » resterait possible mais serait moins clair en français.
theological_decisions:
- issue: Divergence importante entre les témoins hébreu et grec
  choice: Suivre l’hébreu conservé dans le texte principal et signaler le grec en note.
  alternative: '« Ne dis pas : “J’ai péché, et que m’est-il arrivé ?” car le Seigneur est patient. »'
  rationale: L’hébreu est disponible et constitue ici la source principale, mais le grec témoigne d’un texte profondément différent, probablement issu d’un autre texte sous-jacent. La note préserve cette divergence sans harmonisation.
- issue: Référent du suffixe dans « sa puissance »
  choice: Conserver le pronom masculin ambigu de l’hébreu.
  alternative: Expliciter « la puissance de Yahvé ».
  rationale: Le texte ne nomme pas explicitement le possesseur dans la question. Le contexte permet vraisemblablement de comprendre Dieu, mais l’explicitation supprimerait une ambiguïté réelle.
translation_notes:
  register: Français international moderne, direct et digne. La formulation conserve la brièveté proverbiale de l’hébreu ainsi que sa difficulté, tout en donnant une question idiomatique. Le marqueur [a] est placé après l’introduction à la parole, puisqu’il signale une variante portant sur l’ensemble de l’énoncé grec.
