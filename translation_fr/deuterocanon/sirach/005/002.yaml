  text: Do not rely on your own strength to walk after the desire of your soul[a][b].
translation:
  language: fr
  text: Ne compte pas sur ta propre force pour suivre le désir de ton âme[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction, suivant de plus près le parallèle grec : « Ne suis pas ton âme ni ta force pour marcher selon les désirs de ton cœur. » L’hébreu dit : « Ne compte pas sur ta force pour suivre le désir de ton âme. »'
    reason: alternative_reading
  - marker: b
    text: En hébreu, « ton âme » peut aussi signifier « toi-même » ou « ta vie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשָּׁעֵן
  choice: Ne compte pas sur
  rationale: Le verbe שׁען signifie littéralement « s’appuyer sur » et, au sens figuré, « compter sur ». Cette dernière expression est naturelle en français moderne et exprime clairement la confiance placée dans sa propre capacité.
- source_word: כֹּחֶךָ
  choice: ta propre force
  rationale: כֹּחַ désigne la force ou la puissance. « Force » convient à cette exhortation morale, tandis que « propre » explicite sans excès la valeur personnelle du possessif dans ce contexte.
- source_word: לָלֶכֶת אַחַר
  choice: pour suivre
  rationale: L’expression signifie littéralement « aller/marcher après ». « Suivre » restitue naturellement en français l’idée d’orienter sa conduite selon quelque chose, sans conserver un hébraïsme peu idiomatique.
- source_word: תַּאֲוַת
  choice: le désir de
  rationale: Le nom singulier תַּאֲוָה peut désigner un désir, une envie ou une convoitise. « Désir » conserve ici la portée générale du terme sans lui imposer une nuance exclusivement sexuelle.
- source_word: נַפְשֶׁךָ
  choice: ton âme
  rationale: נֶפֶשׁ peut désigner l’âme, la personne elle-même, la vie ou l’appétit. « Ton âme » conserve la texture anthropologique de l’hébreu, en accord avec ψυχή dans le parallèle grec; les autres valeurs possibles sont signalées en note.
theological_decisions:
- issue: Portée anthropologique de נַפְשֶׁךָ / ψυχή σου
  choice: ton âme
  alternative: toi-même; ta vie
  rationale: Le texte met en garde contre une conduite gouvernée par le désir personnel. « Âme » préserve le terme anthropologique des sources sans le réduire à un simple pronom réfléchi, tandis qu’une note prévient une compréhension française trop étroite.
- issue: Relation entre l’hébreu et le parallèle grec
  choice: 'Suivre prioritairement l’hébreu : « Ne compte pas sur ta propre force »'
  alternative: « Ne suis pas ton âme ni ta force »
  rationale: Le texte hébreu, donné avec une confiance élevée, porte clairement le verbe « s’appuyer sur/compter sur ». Le grec présente une formulation différente qui mérite d’être conservée comme variante, non introduite dans le texte principal.
translation_notes:
  register: Français international moderne, sobre et digne. « Compter sur » et « suivre » rendent naturellement les idiomes hébreux, tandis que « âme » maintient le vocabulaire anthropologique du texte source. Le singulier « désir » suit la forme hébraïque.
