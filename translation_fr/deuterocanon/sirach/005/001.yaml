  naturalness: « Ne t’appuie pas sur ta richesse » est naturel en français international moderne. « Ma main a de la force » est intelligible mais trop littéral et peu idiomatique comme parole citée. « J’ai de la force » restitue naturellement l'affirmation de capacité sans imposer dans le texte la formulation d'autosuffisance du grec.
