  text: Do not rely on your wealth[a], and do not say, “I have the power.”
translation:
  language: fr
  text: 'Ne t’appuie pas sur ta richesse et ne dis pas : « J’ai de la force[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est elliptique, littéralement : « il y a de la force pour ma main » (c’est-à-dire : ma main a de la force). Le grec parallèle exprime l’idée : « Cela me suffit » ou « Je me suffis à moi-même ».'
    reason: La formulation hébraïque est difficile; le parallèle grec met en lumière une nuance d’autosuffisance sans l’imposer au texte principal.
lexical_decisions:
- source_word: אַל תִּשָּׁעֵן
  choice: Ne t’appuie pas
  rationale: Le verbe שׁען signifie littéralement « s’appuyer sur » et, au figuré, « mettre sa confiance en ». La formulation française conserve l’image hébraïque tout en restant naturelle.
- source_word: חֵילֶךָ
  choice: ta richesse
  rationale: חַיִל peut désigner la force, les ressources ou la richesse. Le parallèle grec χρήμασίν σου, « tes biens / ton argent », confirme ici le sens économique.
- source_word: יֵשׁ לְאֵל יָדִי
  choice: J’en ai le pouvoir
  rationale: La proposition hébraïque, très concise, affirme littéralement que la main du locuteur possède la capacité ou la puissance requise. « J’en ai le pouvoir » rend cette prétention à pouvoir agir par ses propres moyens, sans ajouter explicitement la notion de suffisance fournie par le grec.
theological_decisions:
- issue: Interprétation de la proposition hébraïque difficile à la lumière du parallèle grec
  choice: 'Conserver au premier plan l’affirmation hébraïque de capacité personnelle : « J’en ai le pouvoir. »'
  alternative: « Ma propre force me suffit » ou « Je me suffis à moi-même »
  rationale: Le grec exprime nettement l’autosuffisance, mais l’hébreu met en avant le pouvoir de la « main ». Le texte principal suit donc le témoin hébreu, tandis que la note signale l’éclairage du grec sans résoudre silencieusement la tension entre les témoins.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier correspond aux formes hébraïques de deuxième personne. L’image « s’appuyer sur » est conservée, tandis que la ponctuation de la note place l’appel à l’intérieur de la citation parce qu’il porte sur les paroles citées.
