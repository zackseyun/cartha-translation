translation_notes:
  register: Français international actuel, simple et digne. « Comme celui qui vanne » maintient la métaphore agricole sans recourir au substantif peu courant « vanneur ». La répétition de l’image du vent et de la tempête conserve la cohérence poétique du témoin hébreu.
