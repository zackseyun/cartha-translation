  text: Do not be a winnower to every wind[b][a], or walk on the path of the storm.
translation:
  language: fr
  text: Ne sois pas de ceux qui vannent à tout vent et qui s’engagent sur le chemin de la tempête.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu שִׁבֹּלֶת est incertain ici. Il peut désigner une « tempête » ou un « torrent » ; ailleurs, il signifie aussi un « épi ». La traduction retient le sens qui correspond le mieux à l’image de « tout vent ».
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec parallèle est très différent : « Gloire et déshonneur sont dans la parole, et la langue de l’homme cause sa chute. » La traduction principale suit ici le témoin hébreu conservé.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּהְיֶה
  choice: Ne sois pas
  rationale: Rend directement la défense exprimée par אַל avec היה et conserve le ton d’exhortation.
- source_word: זוֹרֶה
  choice: comme celui qui vanne
  rationale: Le participe vient de זרה au sens agricole de vanner, c’est-à-dire lancer le grain au vent. Cette formulation française conserve l’image concrète tout en évitant le terme rare « vanneur ».
- source_word: לְכָל רוּחַ
  choice: à tout vent
  rationale: Expression française naturelle qui garde l’image hébraïque et suggère l’instabilité devant des influences changeantes.
- source_word: וּפוֹנֶה
  choice: et ne te tourne pas vers
  rationale: פנה exprime ici le fait de se tourner ou de s’orienter. La négation de la première proposition porte naturellement aussi sur cette seconde exhortation.
- source_word: דֶרֶך
  choice: le chemin de
  rationale: Conserve l’image du chemin et son lien étroit avec le nom qui suit.
- source_word: שִׁבֹּלֶת
  choice: la tempête
  rationale: Le mot est difficile dans ce contexte. Le sens météorologique s’accorde le mieux avec « tout vent », mais l’autre possibilité importante, « torrent », est signalée en note.
