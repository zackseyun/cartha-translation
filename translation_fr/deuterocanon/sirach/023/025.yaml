  text: Her children will not take root[a], and her branches will not bear fruit;
translation:
  language: fr
  text: Ses enfants ne prendront pas racine[a], et ses branches ne porteront pas de fruit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, le grec dit : « ne se répandront pas en racine ». L’expression botanique est condensée ; « ne prendront pas racine » en exprime naturellement le sens d’un établissement qui échoue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ διαδώσουσιν τὰ τέκνα αὐτῆς εἰς ῥίζαν
  choice: Ses enfants ne prendront pas racine
  rationale: Le grec, littéralement proche de « ne se répandront pas jusqu’en racine », présente une image botanique comprimée. « Ne prendront pas racine » est naturel en français, conserve l’image végétale et exprime l’absence d’établissement durable sans expliciter davantage la métaphore.
- source_word: τὰ τέκνα αὐτῆς
  choice: ses enfants
  rationale: « Enfants » rend directement τέκνα et maintient l’articulation entre la descendance réelle et l’image végétale qui suit.
- source_word: οἱ κλάδοι αὐτῆς
  choice: ses branches
  rationale: « Branches » est l’équivalent français courant de κλάδοι et prolonge clairement la métaphore botanique.
- source_word: οὐ δώσουσιν καρπόν
  choice: ne porteront pas de fruit
  rationale: Même si δώσουσιν signifie littéralement « donneront », « porter du fruit » est l’expression française idiomatique pour une plante et préserve fidèlement l’image.
theological_decisions:
- issue: Jugement métaphorique concernant la femme et sa descendance dans le contexte
  choice: Conserver ensemble les images familiales et botaniques sans expliquer leur portée morale dans le verset.
  alternative: 'Rendre explicitement : « sa descendance ne s’établira pas et restera sans postérité ».'
  rationale: Le grec formule la conséquence sous forme d’images. Une explicitation transformerait la métaphore en interprétation et réduirait la tension du texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le futur et le parallélisme sont conservés, ainsi que le passage volontaire de « ses enfants » à « ses branches ».
