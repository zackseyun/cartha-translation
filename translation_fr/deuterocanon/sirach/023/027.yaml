revisions:
- from: Et ceux qui seront restés[a] reconnaîtront que rien ne vaut mieux que la crainte du Seigneur, et que rien n’est plus doux que d’observer attentivement les commandements du Seigneur.[b]
  to: Et ceux qui resteront[a] reconnaîtront que rien ne vaut mieux que la crainte du Seigneur, et que rien n’est plus doux que de prêter attention aux commandements du Seigneur.[b]
  rationale: La révision remplace une formulation qui interprétait προσέχειν comme l’observance effective par « prêter attention à », plus proche de son sens premier d’attention soutenue et réceptive. « Ceux qui resteront » offre une expression française fluide qui conserve l’indétermination contextuelle du participe grec; la note signale sa forme passive littérale.
