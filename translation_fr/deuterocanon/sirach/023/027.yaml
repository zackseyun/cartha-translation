  yaml_path: translation/deuterocanon/sirach/023/027.yaml
  text: And those who are left behind will know that nothing is better than the fear of the Lord, and nothing is sweeter than paying attention to the commandments of the Lord.
translation:
  language: fr
  text: Et ceux qui resteront[a] reconnaîtront que rien ne vaut mieux que la crainte du Seigneur, et que rien n’est plus doux que de prêter attention aux commandements du Seigneur.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui auront été laissés » ou « les survivants ». Le grec dit littéralement « ceux qui ont été laissés ».
    reason: lexical_alternative
  - marker: b
    text: Ou « que d’observer les commandements du Seigneur » ou « que d’y obéir ». Le verbe grec évoque une attention soutenue et réceptive.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνώσονται
  choice: reconnaîtront
  rationale: Le futur de ἐπιγινώσκω exprime ici l’accès à une connaissance claire, probablement à la lumière des conséquences évoquées dans le contexte. « Reconnaîtront » conserve cette nuance mieux que le simple « sauront ».
- source_word: οἱ καταλειφθέντες
  choice: ceux qui seront restés
  rationale: Le participe passif signifie littéralement « ceux qui auront été laissés ». Cette formulation française préserve l’indétermination du grec sans imposer l’idée plus précise de survivants ou de reste théologique.
- source_word: οὐδὲν κρεῖττον
  choice: rien ne vaut mieux
  rationale: Expression comparative naturelle en français moderne, qui conserve la portée absolue de l’énoncé grec.
- source_word: φόβου Κυρίου
  choice: la crainte du Seigneur
  rationale: 'La formule biblique traditionnelle garde toute l’étendue du thème sapientiel : révérence, respect profond et disposition à l’obéissance.'
- source_word: γλυκύτερον
  choice: plus doux
  rationale: Conserve la métaphore gustative et la qualité poétique du comparatif grec, sans l’aplatir en « plus agréable ».
- source_word: τοῦ προσέχειν
  choice: d’observer attentivement
  rationale: προσέχειν indique une attention soutenue et réceptive. « Observer attentivement » permet aussi d’entendre, dans ce contexte de commandements, l’idée de les mettre en pratique, sans réduire le terme à la seule obéissance.
- source_word: ἐντολαῖς Κυρίου
  choice: les commandements du Seigneur
  rationale: Rend directement ἐντολαῖς et maintient le registre biblique ainsi que le parallélisme avec « la crainte du Seigneur ».
theological_decisions:
- issue: Sens de « crainte du Seigneur » dans la littérature sapientielle
  choice: Conserver « la crainte du Seigneur »
  alternative: « le respect du Seigneur » ou « la révérence envers le Seigneur »
  rationale: La formule traditionnelle exprime un concept sapientiel riche qui réunit révérence, saisissement et orientation obéissante. Une paraphrase en restreindrait le sens.
- issue: Portée de οἱ καταλειφθέντες
  choice: Ne pas préciser la nature de ceux qui restent
  alternative: « les survivants » ou « le reste »
  rationale: Le grec ne précise pas explicitement s’il s’agit de survivants d’un jugement, de personnes laissées après un événement ou d’un reste au sens théologique. La traduction conserve cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme de la maxime grecque est conservé, de même que la métaphore de la douceur et l’expression sapientielle traditionnelle « la crainte du Seigneur ».
