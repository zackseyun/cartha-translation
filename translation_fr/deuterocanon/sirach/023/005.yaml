  text: and turn desire away from me;[a]
translation:
  language: fr
  text: et éloigne de moi le désir ;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la convoitise » ou « le désir passionné ». Le terme grec peut désigner un désir intense pris dans un sens moralement négatif.
    reason: Alternative lexicale préservant la force négative possible du terme grec sans la limiter au désir sexuel.
lexical_decisions:
- source_word: καὶ
  choice: et
  rationale: La conjonction relie cette demande à la prière qui précède et conserve la dépendance contextuelle du fragment.
- source_word: ἐπιθυμίαν
  choice: le désir
  rationale: Le nom grec désigne un désir intense, souvent moralement négatif selon le contexte, sans se limiter nécessairement au désir sexuel. « Le désir » en préserve l’étendue sémantique.
- source_word: ἀπόστρεψον
  choice: éloigne
  rationale: L’impératif aoriste demande une intervention décisive. Dans cette construction, « éloigne » exprime naturellement en français le fait d’écarter quelque chose de la personne qui prie, sans suggérer à tort qu’un désir dirigé vers elle doit être détourné.
- source_word: ἀπʼ ἐμοῦ
  choice: de moi
  rationale: Le groupe prépositionnel indique la séparation d’avec le locuteur. « De moi » restitue cette relation sans ajouter l’idée plus interprétative de « mon cœur » ou « au-dedans de moi ».
theological_decisions:
- issue: Portée morale de ἐπιθυμία
  choice: Traduction générale par « le désir »
  alternative: « la convoitise », « le désir passionné » ou « le désir mauvais »
  rationale: Le grec peut désigner un désir moralement mauvais, mais le mot seul ne précise ni qu’il est sexuel ni quelle en est exactement la nature. La traduction principale conserve cette latitude et laisse le contexte en déterminer la valeur morale.
translation_notes:
  register: Français moderne, sobre et digne. La formulation reste brève comme le grec. « Éloigne de moi » est plus idiomatique et moins ambigu en français que « détourne de moi », qui pourrait faire croire que le désir a la personne qui prie pour objet. L’espace avant le point-virgule suit la typographie française.
