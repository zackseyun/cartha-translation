  naturalness: « Enfants, écoutez… » est une apostrophe sapientielle naturelle en français moderne et évite l’ajout de « mes ». « Ne sera jamais pris » est concis et garde l’ambiguïté voulue, sans imposer un cadre judiciaire ni l’image d’un piège.
  terminology: « Instruction » rend bien παιδεία dans ce contexte. « Concernant la parole » communique le domaine de la parole tout en distinguant, en note, le génitif littéral « de la bouche ». « Garder » reste une traduction recevable de φυλάσσω, avec « la » comme reprise nécessaire de l’instruction.
  issues:
