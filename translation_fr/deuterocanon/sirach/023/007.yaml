  text: Hear instruction of the mouth[a], children[b], and the one who keeps it will certainly not be caught.
translation:
  language: fr
  text: Enfants, écoutez l’instruction concernant la parole[a] ; celui qui la garde ne sera jamais pris.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’instruction de la bouche ». On peut aussi traduire « la discipline de la bouche » ou « l’instruction sur la manière de parler ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παιδείαν
  choice: l’instruction
  rationale: Le nom peut désigner l’éducation, la discipline ou l’instruction. Ici, dans une exhortation sapientielle, « instruction » exprime naturellement l’enseignement formateur sans réduire le terme à une simple correction.
- source_word: στόματος
  choice: concernant la parole
  rationale: Le grec dit littéralement « de la bouche ». Dans ce contexte consacré à la conduite verbale, « concernant la parole » restitue clairement le sens en français moderne tout en signalant en note la formulation compacte de l’original.
- source_word: ἀκούσατε
  choice: Écoutez
  rationale: L’impératif appelle à recevoir attentivement l’enseignement. « Écoutez » est naturel, direct et n’ajoute pas explicitement l’idée d’obéissance contenue dans « suivez ».
- source_word: τέκνα
  choice: mes enfants
  rationale: τέκνα est un vocatif pluriel signifiant « enfants ». Le possessif, absent du grec, est idiomatiquement ajouté en français dans l’adresse d’un maître de sagesse ; la note conserve la forme stricte de l’original.
- source_word: ὁ φυλάσσων
  choice: celui qui la garde
  rationale: φυλάσσω peut signifier garder, observer ou mettre en pratique. « La garde » préserve l’image de la vigilance, et le pronom reprend l’instruction mentionnée auparavant.
- source_word: οὐ μὴ
  choice: ne sera jamais
  rationale: La double négation grecque exprime une négation fortement emphatique. « Ne sera jamais » en rend la force de manière concise et naturelle.
- source_word: ἁλῷ
  choice: pris au piège
  rationale: Le verbe signifie être pris ou capturé. « Pris au piège » convient au contexte des fautes de parole sans imposer le sens juridique plus étroit de « condamné ».
theological_decisions:
- issue: Objet implicite de « garder »
  choice: Le pronom « la » renvoie à l’instruction concernant la parole.
  alternative: Laisser le verbe sans objet, au plus près de la syntaxe grecque.
  rationale: En français, le verbe appelle ici un complément. Le rattachement à « l’instruction » est le plus immédiat et n’introduit aucune notion nouvelle.
- issue: Portée de la proposition finale
  choice: 'Une conséquence générale : observer cet enseignement empêche d’être pris au piège par les fautes de parole ou leurs suites.'
  alternative: 'Donner au verbe une portée strictement judiciaire : « ne sera jamais reconnu coupable ».'
  rationale: Le grec emploie un verbe général signifiant « être pris ». La traduction conserve cette largeur et évite de préciser une procédure judiciaire absente du verset.
- issue: Possessif dans l’apostrophe
  choice: Employer l’adresse française idiomatique « mes enfants ».
  alternative: Traduire formellement « enfants », sans possessif.
  rationale: Le possessif rend naturelle en français l’interpellation pédagogique, mais comme il n’est pas exprimé dans le grec, cette légère explicitation est documentée en note.
translation_notes:
  register: Français international moderne, clair et digne. L’adresse sapientielle est naturelle, la structure reste proche du grec, et l’image finale demeure assez large pour préserver l’ambiguïté entre le fait d’être surpris, pris ou entraîné dans les conséquences d’une faute.
