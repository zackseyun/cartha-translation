    issue: Ajout de « mes » dans l’apostrophe
    rationale: τέκνα est simplement « enfants » ; le possessif n’est pas présent dans le grec. Une note qui signale l’ajout ne supprime pas l’explicitation dans le texte lorsque celle-ci peut être évitée sans nuire au français.
  - severity: medium
    issue: « pris au piège » surdétermine ἁλῷ
    rationale: Le grec indique qu’on est pris/capturé, mais ne mentionne pas de piège. « Ne sera jamais pris » préserve mieux l’étendue sémantique, y compris sans implication juridique précise.
