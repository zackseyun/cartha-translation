translation:
  language: fr
  text: Deux sortes multiplient les péchés, et une troisième[a] attirera la colère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec laisse le nom sous-entendu après « troisième » ; il renvoie naturellement à une troisième sorte.
    reason: ambiguïté grammaticale
lexical_decisions:
- source_word: Δύο εἴδη
  choice: Deux sortes
  rationale: L’expression introduit une énumération de catégories. « Sortes » est courant et conserve l’absence, en grec, d’un complément précisant s’il s’agit de personnes, de comportements ou d’autres réalités.
- source_word: πληθύνουσιν
  choice: multiplient
  rationale: Le verbe exprime l’accroissement numérique et garde ici l’image forte de péchés rendus plus nombreux.
- source_word: ἁμαρτίας
  choice: les péchés
  rationale: Le pluriel explicite du grec est conservé.
- source_word: τὸ τρίτον
  choice: une troisième
  rationale: L’ordinal substantivé désigne un troisième élément de l’énumération sans nommer sa nature. Le français reprend naturellement le nom « sorte » de la première proposition.
- source_word: ἐπάξει
  choice: attire
  rationale: Le futur de ἐπάγω signifie faire venir ou amener. « Attire » exprime naturellement qu’une conduite fait venir la colère, sans en préciser la source.
- source_word: ὀργήν
  choice: la colère
  rationale: « Colère » rend directement ὀργή et conserve sa gravité dans un registre biblique moderne, sans ajouter « de Dieu » ni transformer le terme en « châtiment ».
theological_decisions:
- issue: Origine ou détenteur de la colère
  choice: La colère demeure sans détenteur explicitement nommé.
  alternative: la colère de Dieu / le châtiment
  rationale: Le grec dit seulement ὀργήν. Même si le contexte peut suggérer une colère divine ou ses conséquences judiciaires, la traduction ne doit pas ajouter cette précision.
- issue: Nature des trois sortes
  choice: Le référent des « sortes » reste implicite.
  alternative: trois sortes de personnes / de péchés / de comportements
  rationale: Le texte grec ne fournit aucun nom qui permettrait de trancher. La formulation française et la note préservent cette ouverture.
translation_notes:
  register: Français international moderne, sobre et sentencieux. « Une troisième » reprend naturellement « sorte » tout en conservant l’ellipse de l’original. « Attire la colère » évite le tour plus lourd « fera venir la colère » et ne précise pas indûment qu’il s’agit de la colère de Dieu.
