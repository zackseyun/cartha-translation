  yaml_path: translation/deuterocanon/sirach/023/011.yaml
  text: A man who swears many oaths will be filled with lawlessness[a], and the whip will not depart from his house. If he stumbles, his sin is upon him; and if he disregards it, he has sinned doubly. And if he swore in vain, he will not be justified[d][c][b], for his house will be filled with afflictions.
translation:
  language: fr
  text: L’homme qui multiplie les serments sera rempli d’iniquité, et le fouet[a] ne s’éloignera pas de sa maison. S’il commet une faute, son péché pèsera sur lui ; et s’il n’en tient pas compte[b], il aura péché doublement. S’il jure en vain[c], il ne sera pas reconnu juste, car sa maison sera remplie de malheurs[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le fléau ». Le grec peut désigner un fouet au sens propre ou, au sens figuré, un fléau qui châtie.
    reason: lexical_alternative
  - marker: b
    text: Ou « s’il passe outre ». Le sens paraît être qu’en traitant sa faute avec indifférence, il aggrave sa culpabilité.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « s’il jure dans le vide » ; l’expression peut évoquer un serment vain, sans valeur ou faux.
    reason: lexical_alternative
  - marker: d
    text: Le terme grec est difficile. Il peut désigner des maux qui surviennent, des épreuves imposées ou des châtiments.
    reason: textual_difficulty
lexical_decisions:
- source_word: ἀνὴρ πολύορκος
  choice: L’homme qui multiplie les serments
  rationale: Le masculin singulier représentatif est conservé, tandis que la proposition relative rend naturellement l’idée d’une personne caractérisée par des serments fréquents.
- source_word: πλησθήσεται ἀνομίας
  choice: sera rempli d’iniquité
  rationale: « Iniquité » exprime la transgression de l’ordre moral contenue dans ἀνομία sans réduire le terme à une simple erreur.
- source_word: μάστιξ
  choice: le fouet
  rationale: Le sens concret et imagé est maintenu ; une note signale la portée figurée possible de fléau ou de châtiment.
- source_word: πλημμελήσῃ
  choice: commet une faute
  rationale: Cette formulation couvre l’erreur ou la faute morale sans introduire l’idée non exprimée d’un péché involontaire.
- source_word: ἁμαρτία αὐτοῦ ἐπʼ αὐτῷ
  choice: son péché pèsera sur lui
  rationale: La tournure française conserve l’image grecque d’une faute qui demeure sur son auteur et engage sa responsabilité.
- source_word: ὑπερίδῃ
  choice: n’en tient pas compte
  rationale: Le verbe indique qu’il passe outre ou traite sa faute avec indifférence ; cette traduction reste claire sans préciser indûment le geste attendu.
- source_word: ἥμαρτεν δισσῶς
  choice: il aura péché doublement
  rationale: La formulation préserve l’idée explicite d’une culpabilité redoublée.
- source_word: διὰ κενῆς ὤμοσεν
  choice: prête un serment en vain
  rationale: L’expression rend l’image grecque du vide ou de la vanité sans la limiter avec certitude au faux serment.
- source_word: οὐ δικαιωθήσεται
  choice: il ne sera pas reconnu juste
  rationale: Cette formulation garde la valeur judiciaire et morale de δικαιόω tout en évitant de faire de ce passage sapientiel une affirmation doctrinale plus technique.
- source_word: ἐπαγωγῶν
  choice: calamités
  rationale: Le mot difficile désigne ici des maux qui s’abattent sur la maison, probablement avec une nuance punitive ; « calamités » conserve une portée assez large.
theological_decisions:
- issue: Portée de δικαιωθήσεται dans ce contexte sapientiel
  choice: il ne sera pas reconnu juste
  alternative: il ne sera pas justifié / il ne sera pas acquitté
  rationale: Le contexte porte sur la culpabilité liée aux serments et sur ses conséquences. La traduction garde la notion de verdict moral ou judiciaire sans importer un emploi doctrinal ultérieur du terme.
- issue: Nature de la faute exprimée par πλημμελήσῃ
  choice: s’il commet une faute
  alternative: s’il trébuche / s’il pèche involontairement
  rationale: Le grec permet l’idée d’erreur ou de faute, mais ne précise pas expressément qu’elle est involontaire. La traduction ne résout donc pas cette question.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme proverbial et les images concrètes du grec sont conservés, avec des notes là où le lexique demeure ouvert à plusieurs interprétations.
