revisions:
- from: Car, premièrement, elle a désobéi à la loi du Très-Haut ; deuxièmement, elle a commis une faute envers son mari ; et troisièmement, elle s’est rendue adultère dans l’inconduite sexuelle et a mis au monde des enfants conçus d’un autre homme.[a]
  to: Car, premièrement, elle a désobéi à la loi du Très-Haut ; deuxièmement, elle a commis une faute envers son mari ; et troisièmement, en se livrant à l’immoralité sexuelle, elle a commis l’adultère et a mis au monde des enfants d’un autre homme.[a]
  rationale: La révision améliore l’idiomaticité française sans modifier la structure ternaire ni la gradation des accusations. Elle conserve la portée large de πορνεία, rend explicitement l’adultère, et maintient en note la formulation plus littérale de παρέστησεν.
