review_pass:
  verdict: revise
  source_fidelity: La triple énumération, la désobéissance à la loi du Très-Haut, le manquement envers le mari et la mention finale d’enfants issus d’un autre homme sont correctement conservés. « Mis au monde » est une interprétation contextuelle défendable de παρέστησεν, à signaler en note comme le fait le projet. La formulation « conçus d’un autre homme » est toutefois moins idiomatique et moins nette que « d’un autre homme » en français courant.
  naturalness: « Elle s’est rendue adultère » est peu naturel en français moderne international. « Elle a commis l’adultère » rend clairement ἐμοιχεύθη. « En se livrant à l’immoralité sexuelle » exprime plus naturellement ἐν πορνείᾳ que « dans l’inconduite sexuelle », tout en conservant la distinction rhétorique entre les deux termes grecs.
  terminology: « Très-Haut » est approprié. « Faute envers son mari » maintient à juste titre le deuxième grief distinct de l’adultère explicitement énoncé ensuite. « Immoralité sexuelle » est un équivalent moderne, général et non confessionnel de πορνεία.
  issues:
  - severity: low
    issue: Formulation française peu idiomatique pour ἐμοιχεύθη
    rationale: « S’est rendue adultère » est grammaticalement possible mais rare et lourde. « A commis l’adultère » est plus naturel, sans introduire d’interprétation supplémentaire.
  - severity: low
    issue: Expression « enfants conçus d’un autre homme »
    rationale: En français, « conçus d’un autre homme » est moins idiomatique que « enfants d’un autre homme » et peut brouiller la relation exprimée par ἐξ. Le contexte et la note précisent suffisamment la paternité non conjugale.
