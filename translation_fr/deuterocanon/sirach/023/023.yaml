base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/023.yaml
  text: For first[a], she disobeyed the law of the Most High; and second, she committed an offense against her husband; and third, in sexual immorality she committed adultery and presented children from another man.
translation:
  language: fr
  text: Car, premièrement, elle a désobéi à la loi du Très-Haut ; deuxièmement, elle a commis une faute envers son mari ; et troisièmement, en se livrant à l’immoralité sexuelle, elle a commis l’adultère et a mis au monde des enfants d’un autre homme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « a présenté des enfants provenant d’un autre homme ». Dans ce contexte, l’expression signifie qu’elle a mis au monde des enfants d’un autre homme.'
    reason: Le verbe grec παρέστησεν signifie littéralement « a présenté » ou « a fait paraître », mais son sens contextuel renvoie ici à la mise au monde d’enfants.
lexical_decisions:
- source_word: πρῶτον μὲν ... καὶ δεύτερον ... καὶ τὸ τρίτον
  choice: premièrement… deuxièmement… et troisièmement
  rationale: Conserve l’énumération explicite des trois griefs, tandis que « Car » rend le γάρ explicatif.
- source_word: ἐν νόμῳ Ὑψίστου ἠπείθησεν
  choice: elle a désobéi à la loi du Très-Haut
  rationale: Formulation française naturelle qui exprime la désobéissance ayant pour référence la loi ; « Très-Haut » traduit le titre divin sans ajouter « Dieu ».
- source_word: εἰς ἄνδρα ἑαυτῆς ἐπλημμέλησεν
  choice: elle a commis une faute envers son mari
  rationale: Préserve le sens général de faute ou manquement sans l’identifier prématurément à l’adultère, explicité dans le troisième grief.
- source_word: ἐν πορνείᾳ
  choice: dans l’inconduite sexuelle
  rationale: Rend le sens large de πορνεία dans un français moderne et digne, sans le limiter à la prostitution.
- source_word: ἐμοιχεύθη
  choice: elle s’est rendue adultère
  rationale: Reflète la forme médio-passive tout en exprimant clairement sa participation à l’adultère.
- source_word: ἐξ ἀλλοτρίου ἀνδρὸς τέκνα παρέστησεν
  choice: a mis au monde des enfants conçus d’un autre homme
  rationale: Communique naturellement le résultat de l’union avec un homme autre que son mari ; « conçus d’un autre homme » conserve la relation exprimée par ἐξ, tandis que « mis au monde » restitue le sens contextuel de παρέστησεν.
theological_decisions:
- issue: Progression morale des trois accusations
  choice: 'Maintenir trois griefs distincts : désobéissance à la loi divine, faute envers le mari, puis adultère accompagné d’enfants conçus d’un autre homme.'
  alternative: Fusionner les deuxième et troisième griefs en une seule accusation d’infidélité conjugale.
  rationale: Le grec marque expressément une triple énumération ; la conserver respecte sa progression rhétorique et morale.
- issue: Traduction de Ὑψίστου
  choice: Très-Haut
  alternative: Dieu Très-Haut
  rationale: « Très-Haut » est le titre divin français traditionnel et n’ajoute pas le mot « Dieu », absent du texte grec.
translation_notes:
  register: Français international moderne, clair et digne. La triple structure est rendue explicitement. « Commis une faute » évite de confondre le deuxième grief avec l’adultère du troisième. La note conserve la formulation grecque plus littérale sans imposer au corps du texte une tournure peu idiomatique.
