  verdict: revise
  source_fidelity: Le grec οὕτως καὶ γυνὴ καταλιποῦσα τὸν ἄνδρα καὶ παριστῶσα κληρονόμον ἐξ ἀλλοτρίου décrit parallèlement une femme ayant quitté son mari et qui « présente » un héritier provenant d’un autre. « Issu d’un autre homme » exprime correctement l’origine et l’opposition au mari, mais l’expression peut laisser croire que l’héritier lui-même est « issu » au sens descriptif courant, plutôt que souligner l’acte de le présenter comme héritier. « D’un autre homme » après « héritier » conserve mieux la concision et l’ambiguïté juridique du grec.
  naturalness: « Il en va de même pour » est naturel et convient à la dépendance contextuelle. « Présente un héritier d’un autre homme » est une formulation sobre et compréhensible dans un registre biblique moderne. La ponctuation française place l’appel de note avant le point-virgule, sans espace avant celui-ci lorsqu’il suit directement l’appel.
  terminology: « Femme », « mari » et « héritier » sont justes. ἀλλότριος signifie littéralement « d’un autre / étranger » et, ici, renvoie vraisemblablement à un homme extérieur à l’union ; « un autre homme » est l’explicitation contextuelle prudente. La note doit présenter « d’un étranger » comme une possibilité plus littérale, sans faire de « quelqu’un qui n’est pas le mari » une définition exhaustive du mot.
  issues:
