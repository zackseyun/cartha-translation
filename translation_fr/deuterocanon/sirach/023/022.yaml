    issue: Nuance de « issu d’un autre homme »
    rationale: La traduction est globalement fidèle, mais « présente un héritier d’un autre homme » reproduit plus directement la construction grecque et laisse davantage ouverte la portée légale de « présenter ».
  - severity: low
    issue: Ponctuation de l’appel de note
    rationale: En français, l’appel de note se place avant le point-virgule ; la forme « homme[a] ; » est typographiquement moins nette.
  revised_text: Il en va de même pour une femme qui quitte son mari et présente un héritier d’un autre homme[a] ;
