  text: So also a woman who leaves her husband and presents an heir by another man;[a]
translation:
  language: fr
  text: Il en va de même pour une femme qui quitte son mari et présente un héritier d’un autre homme[a] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’un étranger ». Le grec peut désigner un homme autre que le mari, sans impliquer nécessairement qu’il soit inconnu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Il en va de même pour
  rationale: Cette tournure française marque naturellement le lien comparatif avec ce qui précède, tout en conservant la valeur de οὕτως καὶ.
- source_word: γυνὴ
  choice: une femme
  rationale: γυνή peut désigner une femme ou une épouse. La mention explicite de « son mari » établit déjà le contexte conjugal, de sorte que « une femme » évite une répétition lourde.
- source_word: καταλιποῦσα
  choice: qui quitte
  rationale: Le participe aoriste décrit ici l’action sans exiger la nuance plus forte et interprétative de « abandonne ».
- source_word: τὸν ἄνδρα
  choice: son mari
  rationale: Dans ce contexte conjugal, ἀνήρ désigne clairement l’époux ; le possessif est idiomatique en français.
- source_word: παριστῶσα
  choice: présente
  rationale: Le verbe garde l’idée de faire paraître ou de donner quelqu’un comme héritier, sans préciser au-delà du grec les circonstances de sa naissance.
- source_word: κληρονόμον
  choice: un héritier
  rationale: « Héritier » est l’équivalent juridique et familial direct de κληρονόμος.
- source_word: ἐξ ἀλλοτρίου
  choice: issu d’un autre homme
  rationale: La préposition ἐξ exprime l’origine, et ἀλλότριος désigne ici un homme autre que le mari. « Issu d’un autre homme » rend explicitement et naturellement la filiation sans réduire le terme à l’idée moderne d’un inconnu.
theological_decisions:
- issue: Portée morale et juridique de l’adultère et de la filiation
  choice: Décrire les actes et leur conséquence sans qualifier explicitement la femme d’« adultère ».
  alternative: Employer « une femme adultère » ou « qui abandonne son mari ».
  rationale: Le grec énonce la conduite — quitter son mari et présenter un héritier issu d’un autre homme — mais n’ajoute pas ici de titre moral. La traduction conserve ainsi la formulation et la tension propres au texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Il en va de même pour » assure le raccord avec le contexte précédent. Le point-virgule conserve le caractère continu de la phrase grecque transmise.
