  text: A man accustomed to words of reproach will never be disciplined all his days[a][b].
translation:
  language: fr
  text: Un homme qui s’habitue aux paroles insultantes ne sera jamais corrigé durant toute sa vie.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aux paroles de reproche » ou « aux paroles outrageantes ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec emploie une négation renforcée : littéralement, « ne sera certainement pas corrigé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος
  choice: Un homme
  rationale: Le nom grec au singulier présente ici un individu représentatif; « un homme » conserve cette forme masculine tout en restant naturel en français.
- source_word: συνεθιζόμενος
  choice: qui s’habitue
  rationale: Le participe exprime une habitude acquise et entretenue par la répétition; « qui s’habitue » en garde la dynamique.
- source_word: λόγοις ὀνειδισμοῦ
  choice: aux paroles insultantes
  rationale: ὀνειδισμός peut désigner le reproche, l’insulte ou l’outrage. Dans cette construction, « paroles insultantes » rend naturellement une manière habituelle de parler qui outrage autrui, sans exclure la nuance de reproche.[a]
- source_word: ἐν πάσαις ταῖς ἡμέραις αὐτοῦ
  choice: de toute sa vie
  rationale: Littéralement « durant tous ses jours »; l’expression française choisie transmet clairement l’étendue temporelle de l’idiome.
- source_word: οὐ μὴ παιδευθῇ
  choice: ne se laissera jamais corriger
  rationale: οὐ μή suivi du subjonctif marque une négation fortement emphatique. Le passif de παιδεύω peut évoquer l’éducation, la discipline ou la correction; ici, « se laisser corriger » exprime naturellement l’échec de la formation morale sans faire de l’homme l’agent grammatical principal.[b]
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et sapientiel. La formulation reste proche du grec tout en évitant le tour peu naturel « pendant tous ses jours ». Les deux notes préservent l’étendue sémantique de ὀνειδισμός et la force de οὐ μή.
