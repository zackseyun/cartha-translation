  source_fidelity: La tournure « ne se laissera jamais corriger » ajoute l’idée que l’homme refuse volontairement de se laisser corriger. Le grec οὐ μὴ παιδευθῇ est un passif (« ne sera absolument pas corrigé / discipliné ») et n’exprime pas ce réflexif volontaire. Le reste rend adéquatement l’habitude acquise, les paroles d’insulte ou de reproche, la portée de toute une vie et la négation emphatique.
  naturalness: « Durant toute sa vie » est plus fluide et plus nettement temporel que « de toute sa vie » dans cette phrase. « Paroles insultantes » est naturel en français international moderne.
  terminology: « Corrigé » convient au sens sapientiel et moral de παιδεύω, sans réduire indûment le terme à l’instruction scolaire ou à une discipline punitive. La note conserve utilement la force emphatique de οὐ μή.
