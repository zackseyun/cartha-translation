  text: By his lips the sinner will be caught[a], and the reviler and the proud will stumble by them.
translation:
  language: fr
  text: Par ses lèvres, le pécheur sera pris[a] ; celui qui insulte et l’orgueilleux trébucheront par elles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pécheur sera laissé » ou « sera abandonné ». Le verbe grec signifie plus littéralement « être laissé » ou « être abandonné » ; avec « ses lèvres », il peut aussi évoquer l’idée d’être laissé ou abandonné dans, ou par, ses propres paroles. Dans ce contexte, il semble indiquer que le pécheur est pris ou perdu par elles.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τοῖς χείλεσιν αὐτοῦ
  choice: Par ses lèvres
  rationale: « Par » rend naturellement la valeur instrumentale de ἐν, tandis que « lèvres » conserve l’image concrète de la parole.
- source_word: καταλειφθήσεται
  choice: sera pris
  rationale: Le verbe signifie ordinairement « être laissé » ou « être abandonné », mais le parallélisme avec « trébucheront » suggère ici que le pécheur est pris ou perdu par ses propres paroles. L’ambiguïté lexicale est signalée en note.
- source_word: ἁμαρτωλός
  choice: le pécheur
  rationale: Le singulier a une valeur générique conforme au style sapientiel.
- source_word: λοίδορος
  choice: celui qui injurie
  rationale: Cette expression actuelle et intelligible désigne une personne qui tient des propos insultants, sans recourir au terme plus rare « injurieux » comme substantif.
- source_word: ὑπερήφανος
  choice: l’orgueilleux
  rationale: Ce terme courant exprime clairement l’arrogance et l’élévation de soi impliquées par le grec.
- source_word: σκανδαλισθήσονται
  choice: trébucheront
  rationale: Le choix préserve la métaphore de la chute sans introduire un sens théologique technique étranger au contexte sapientiel.
- source_word: ἐν αὐτοῖς
  choice: par elles
  rationale: Le féminin pluriel renvoie explicitement aux « lèvres » et rend de nouveau la valeur instrumentale de ἐν.
