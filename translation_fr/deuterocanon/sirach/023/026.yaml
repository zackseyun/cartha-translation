  text: She will leave her memory for a curse, and her disgrace will not be wiped away.
translation:
  language: fr
  text: Elle laissera derrière elle un souvenir voué à la malédiction, et son déshonneur ne sera pas effacé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλείψει
  choice: laissera derrière elle
  rationale: Le futur de καταλείπω désigne ici ce qui subsistera après elle. « Laissera derrière elle » exprime clairement cette postérité mémorielle.
- source_word: εἰς κατάραν
  choice: voué à la malédiction
  rationale: 'εἰς avec l’accusatif indique ici le résultat ou la destination : son souvenir sera associé à la malédiction. Cette formulation est naturelle en français sans réduire κατάρα à une simple mauvaise réputation.'
- source_word: τὸ μνημόσυνον αὐτῆς
  choice: un souvenir
  rationale: μνημόσυνον désigne ici la mémoire durable laissée par la personne, non un monument matériel. « Souvenir » convient au français courant et s’articule naturellement avec « laisser derrière elle ».
- source_word: τὸ ὄνειδος αὐτῆς
  choice: son déshonneur
  rationale: ὄνειδος évoque l’opprobre, la honte publique et l’atteinte à l’honneur. « Déshonneur » conserve cette dimension sociale dans un registre digne et actuel.
- source_word: οὐκ ἐξαλειφθήσεται
  choice: ne sera pas effacé
  rationale: Le futur passif de ἐξαλείφω signifie enlever en essuyant, effacer. « Ne sera pas effacé » conserve l’image tout en restant idiomatique en français.
theological_decisions:
- issue: Conséquence morale durable appliquée, dans le contexte, à la femme adultère
  choice: Conserver sans atténuation l’affirmation sévère d’un souvenir maudit et d’un déshonneur persistant.
  alternative: Généraliser en parlant seulement de mauvaise réputation, ou expliciter un jugement divin.
  rationale: Le grec affirme la persistance de la malédiction attachée à son souvenir et de son déshonneur, sans préciser ici l’agent de cette sanction ni développer une doctrine du jugement. La traduction maintient cette tension sans ajout.
translation_notes:
  register: Français moderne international, sobre et proverbial. La syntaxe parallèle du grec est conservée. « Voué à la malédiction » évite le calque peu naturel « pour une malédiction » tout en maintenant la force de κατάρα.
