base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/003.yaml
  text: so that my ignorances may not multiply[a], and my sins may not increase, and I may fall before my adversaries[b], and my enemy may rejoice over me.
translation:
  language: fr
  text: afin que mes erreurs ne se multiplient pas[a], que mes péchés n’augmentent pas, que je ne tombe pas devant mes adversaires et que mon ennemi ne se réjouisse pas à mes dépens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «mes ignorances» ou «mes actes commis par ignorance». Le grec distingue ce terme de «mes péchés» dans la proposition suivante.
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : «ne jubile à mon sujet» ou «ne triomphe de moi». Le terme exprime la joie malveillante d’un ennemi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως μή
  choice: afin que… ne… pas
  rationale: Introduit le but ou la conséquence redoutée dans la continuité de la demande précédente; cette tournure est naturelle en français moderne.
- source_word: αἱ ἄγνοιαι μου
  choice: mes ignorances
  rationale: Le pluriel inhabituel maintient la distinction explicite avec «mes péchés» et désigne des manquements ou erreurs dus au fait de ne pas savoir, sans les définir techniquement comme des péchés involontaires.
- source_word: μὴ πληθύνωσιν
  choice: ne se multiplient pas
  rationale: Rend directement l’idée de devenir nombreuses et convient au sujet pluriel.
- source_word: αἱ ἁμαρτίαι μου
  choice: mes péchés
  rationale: Équivalent français courant qui conserve le poids moral et religieux de ἁμαρτίαι ainsi que son contraste avec ἄγνοιαι.
- source_word: πλεονάσωσιν
  choice: n’augmentent pas
  rationale: Exprime l’accroissement sans répéter «se multiplient» et préserve la variation verbale du grec.
- source_word: πεσοῦμαι
  choice: que je ne tombe pas
  rationale: Conserve l’image générale de la chute sans préciser indûment s’il s’agit de défaite, de honte ou de faute.
- source_word: ἔναντι τῶν ὑπεναντίων
  choice: devant mes adversaires
  rationale: Rendu concis et idiomatique de la présence face à ceux qui s’opposent au locuteur.
- source_word: ἐπιχαρεῖταί μοι
  choice: ne se réjouisse pas à mes dépens
  rationale: Restitue à la fois la joie hostile et son orientation contre le locuteur; «à mes dépens» est plus naturel ici que le calque «sur moi».
- source_word: ὁ ἐχθρός μου
  choice: mon ennemi
  rationale: Conserve le singulier du grec après le pluriel «adversaires», sans harmoniser les deux expressions.
theological_decisions:
- issue: Distinction entre ἄγνοιαι et ἁμαρτίαι
  choice: 'Maintenir deux termes distincts: «ignorances» et «péchés»'
  alternative: «erreurs» et «péchés», ou «péchés commis par ignorance»
  rationale: Le grec distingue les défaillances liées à l’ignorance des péchés, mais ne permet pas d’identifier sans reste les premières à une catégorie technique de péchés involontaires.
- issue: Nuance hostile de ἐπιχαρεῖταί μοι
  choice: «se réjouisse à mes dépens»
  alternative: «exulte à mon sujet» ou «triomphe malicieusement de moi»
  rationale: La formulation choisie rend la satisfaction hostile indiquée par le contexte tout en évitant d’accentuer excessivement la malveillance.
translation_notes:
  register: Français international moderne, digne et accessible. La structure cumulative de la prière est conservée. «Ignorances», bien qu’un peu inhabituel au pluriel, préserve une distinction lexicale importante du grec; la note en éclaire le sens.
