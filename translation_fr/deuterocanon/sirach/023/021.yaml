  yaml_path: translation/deuterocanon/sirach/023/021.yaml
  text: This man will be punished in the streets of the city[a], and where he did not suspect it[b], he will be caught.
translation:
  language: fr
  text: Cet homme sera puni sur les places de la ville[a] et, là où il ne s’y attendait pas[b], il sera pris.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les grandes rues de la ville »; le grec désigne littéralement les espaces larges ou ouverts de la ville et souligne ainsi le caractère public de la scène.
    reason: lexical_alternative
  - marker: b
    text: Ou « là où il ne le soupçonnait pas » ou « là où il ne l’avait pas imaginé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Cet homme
  rationale: Le démonstratif masculin renvoie à l’homme adultère évoqué dans le contexte immédiat. « Cet homme » conserve clairement cette reprise.
- source_word: ἐν πλατείαις πόλεως
  choice: sur les places de la ville
  rationale: Le terme πλατεῖαι désigne les espaces larges et ouverts d’une ville, notamment ses places ou ses grandes rues. « Sur les places de la ville » restitue naturellement le caractère public de la scène.
- source_word: ἐκδικηθήσεται
  choice: sera puni
  rationale: Le passif exprime ici l’exercice d’une justice punitive. « Sera puni » évite la connotation trop personnelle de « on se vengera de lui ».
- source_word: οὗ
  choice: là où
  rationale: L’adverbe relatif introduit le lieu ou les circonstances dans lesquels l’homme sera pris à l’improviste.
- source_word: οὐχ ὑπενόησεν
  choice: il ne s’y attendait pas
  rationale: ὑπονοέω peut signifier soupçonner, conjecturer ou pressentir. Cette formulation française exprime clairement l’absence d’anticipation sans surinterpréter.
- source_word: πιασθήσεται
  choice: il sera pris
  rationale: Le futur passif indique qu’il sera saisi ou capturé. « Il sera pris » conserve cette idée tout en restant sobre et idiomatique.
theological_decisions:
- issue: Référent masculin du démonstratif et des verbes
  choice: Le verset parle précisément de l’homme adultère du contexte immédiat; le masculin est donc maintenu.
  alternative: Employer une désignation neutre telle que « cette personne ».
  rationale: Les formes grecques sont masculines et le contexte identifie un homme précis. Une neutralisation effacerait cette référence textuelle.
- issue: Portée de ἐκδικηθήσεται
  choice: 'Le verbe est rendu comme un châtiment public : « sera puni ».'
  alternative: « On se vengera de lui » ou « justice sera faite contre lui ».
  rationale: Le contexte évoque une rétribution ou sanction plutôt qu’une vengeance privée. La traduction n’ajoute pas d’agent ni de précision doctrinale absents de la phrase grecque.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe garde le parallélisme des deux futurs passifs grecs. Les notes préservent l’étendue de sens de πλατεῖαι et de ὑπονοέω.
