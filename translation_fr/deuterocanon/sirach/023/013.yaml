  text: N’habitue pas ta bouche à un parler grossier et inculte, car il y a là une parole de péché.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαιδευσίαν ἀσυρῆ
  choice: des propos grossiers et incultes
  rationale: L’expression associe le manque d’éducation ou de savoir-vivre à un caractère grossier. En français, « propos » explicite naturellement ce à quoi la bouche s’habitue, sans modifier le sens.
- source_word: μὴ συνεθίσῃς τὸ στόμα σου
  choice: N’habitue pas ta bouche
  rationale: Reproduit directement l’image grecque et l’idée d’une pratique qui devient coutumière.
- source_word: λόγος ἁμαρτίας
  choice: une parole de péché
  rationale: Conserve la formulation dense et la tension du génitif grec, qui peut désigner une parole pécheresse ou une parole liée au péché.
theological_decisions:
- issue: Sens du génitif dans λόγος ἁμαρτίας
  choice: une parole de péché
  alternative: une parole pécheresse
  rationale: La formulation retenue préserve l’ambiguïté de la relation entre la parole et le péché au lieu de la réduire à une qualification morale explicite.
translation_notes:
  register: Français moderne, clair et digne. L’image concrète de la bouche est conservée; l’expression grecque abstraite est rendue par « propos grossiers et incultes » pour éviter une tournure française obscure.
