base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/002.yaml
  text: Who will set whips over my thoughts[a], and the discipline of wisdom over my heart, so that they may not spare me for my ignorances, and may not overlook their sins?
translation:
  language: fr
  text: Qui placera sur mes pensées des fouets, et sur mon cœur la discipline de la sagesse, afin qu’ils ne m’épargnent pas à cause de mes fautes commises par ignorance et qu’elle ne laisse pas passer leurs péchés[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « leurs péchés ». La formulation est difficile après « mes fautes commises par ignorance »; on peut comprendre le sens comme « mes péchés » ou supposer une irrégularité du pronom.
    reason: alternative_reading
lexical_decisions:
- source_word: τίς ἐπιστήσει
  choice: Qui placera
  rationale: La question rhétorique et le verbe exprimant l’action de placer quelque chose au-dessus sont rendus directement, sans ajouter l’idée de capacité.
- source_word: ἐπὶ τοῦ διανοήματός μου μάστιγας
  choice: des fouets sur mes pensées
  rationale: « Fouets » conserve l’image concrète et sévère de la correction; « pensées » exprime naturellement l’activité intérieure visée par διανόημα.
- source_word: ἐπὶ τῆς καρδίας μου παιδείαν σοφίας
  choice: la discipline de la sagesse sur mon cœur
  rationale: « Discipline » garde les dimensions de formation et de correction propres à παιδεία, tandis que « cœur » préserve l’anthropologie biblique sans la réduire au seul intellect.
- source_word: ἐπὶ τοῖς ἀγνοήμασίν μου
  choice: pour mes fautes commises par ignorance
  rationale: ἀγνόημα désigne une faute liée à l’ignorance. Cette formulation française est plus claire que le calque inhabituel « mes ignorances » et maintient la distinction avec ἁμαρτήματα.
- source_word: μὴ φείσωνται
  choice: qu’ils ne m’épargnent pas
  rationale: Le pluriel renvoie aux moyens de correction évoqués; le complément « me » explicite naturellement en français la personne que la discipline ne doit pas ménager.
- source_word: οὐ μὴ παρῇ
  choice: ne laissent pas passer
  rationale: Cette expression conserve l’image de ce qui ne doit pas être laissé passer et reflète la négation grecque fortement appuyée.
- source_word: τὰ ἁμαρτήματά αὐτῶν
  choice: leurs péchés
  rationale: Le pronom transmis est à la troisième personne du pluriel. Malgré sa difficulté contextuelle, il est conservé plutôt que corrigé silencieusement en « mes ».
theological_decisions:
- issue: Image d’un châtiment appliqué à la vie intérieure
  choice: Conserver « fouets » et « discipline de la sagesse » comme demande d’une correction morale rigoureuse
  alternative: Atténuer par « frein », « maîtrise » ou « direction »
  rationale: Le grec emploie une image volontairement concrète et douloureuse; l’adoucir réduirait la gravité morale de la prière.
- issue: Pronom difficile dans « leurs péchés »
  choice: Maintenir la troisième personne du pluriel dans le texte et signaler la difficulté
  alternative: Traduire « mes péchés » pour régulariser le sens
  rationale: Le texte grec fourni porte αὐτῶν, « leurs ». La tension doit rester visible, sans émendation tacite.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme de la prière grecque et son image vigoureuse, tout en rendant ἀγνοήματα par une expression française naturelle. Le pronom problématique est maintenu dans le texte et expliqué en note.
