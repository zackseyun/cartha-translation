  text: To a promiscuous man every bread is sweet[b][a]; he will not stop until he comes to his end.
translation:
  language: fr
  text: Pour l’homme débauché, tout pain est doux[a] ; il ne s’arrêtera pas jusqu’à ce qu’il arrive à sa fin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toute sorte de pain est douce ». L’image évoque probablement un appétit sans discernement, et non le pain au sens propre seulement.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « jusqu’à ce qu’il meure ». Le verbe grec peut désigner précisément la mort, tout en pouvant aussi évoquer plus largement l’arrivée à son terme.'
    reason: alternative_reading
lexical_decisions:
- source_word: πόρνῳ
  choice: qui se livre à la débauche sexuelle
  rationale: Cette formulation exprime un comportement sexuel immoral habituel sans réduire le terme à la prostitution. Elle est explicite et compréhensible en français moderne.
- source_word: πᾶς ἄρτος
  choice: tout pain
  rationale: Le grec dit littéralement « tout pain ». Le maintien de cette image préserve la portée proverbiale d’un appétit sans discernement, sans imposer dans le texte l’identité précise de ce que représente le pain.
- source_word: ἡδύς
  choice: doux
  rationale: « Doux » conserve l’image gustative et l’ironie morale du grec ἡδύς, qui peut aussi signifier « agréable ».
- source_word: οὐ μὴ κοπάσῃ
  choice: il ne s’arrêtera pas
  rationale: La forte négation grecque avec le subjonctif exprime ici la certitude qu’il ne cessera pas. Cette tournure est naturelle en français actuel.
- source_word: ἕως ἂν τελευτήσῃ
  choice: avant sa fin
  rationale: τελευτάω peut évoquer la mort ou, plus largement, le fait d’arriver à son terme. « Avant sa fin » maintient cette amplitude, tandis que la note signale la lecture explicite « avant de mourir ».
theological_decisions:
- issue: Faut-il expliciter le pain comme une image de l’appétit sexuel sans discernement ?
  choice: Conserver dans le texte principal l’image « tout pain est doux ».
  alternative: Traduire par « toute nourriture lui paraît bonne » ou expliciter le partenaire sexuel.
  rationale: Le contexte indique la débauche sexuelle, mais le grec conserve une métaphore proverbiale. L’expliciter davantage résoudrait une image que le texte laisse ouverte.
- issue: Faut-il rendre τελευτήσῃ exclusivement par la mort ?
  choice: Employer la formulation plus large « avant sa fin ».
  alternative: « avant de mourir »
  rationale: Le verbe peut désigner directement la mort, mais aussi l’arrivée au terme. La traduction principale préserve cette tension entre mort et issue finale, et la note donne le sens plus précis possible.
translation_notes:
  register: Français international moderne, digne et direct. La première proposition reste proverbiale et conserve l’image concrète du pain ; la seconde emploie une tournure naturelle tout en maintenant l’ambiguïté entre la mort et une fin plus largement comprise.
