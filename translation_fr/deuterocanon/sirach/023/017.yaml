  source_fidelity: 'Le sens général est bien rendu : πόρνῳ qualifie un homme caractérisé par une conduite sexuelle illicite, l’image de « tout pain » est conservée, et la négation renforcée exprime la persistance. Toutefois, « avant sa fin » ne rend pas correctement ἕως ἂν τελευτήσῃ, qui signifie « jusqu’à ce qu’il arrive à sa fin / jusqu’à ce qu’il meure », et non « avant sa fin ».'
  naturalness: « Pour l’homme qui se livre à la débauche sexuelle » est intelligible mais pesant et quelque peu redondant. « Pour l’homme débauché » est plus idiomatique, concis et convient au registre proverbial. « Jusqu’à ce qu’il arrive à sa fin » est naturel et rétablit la valeur temporelle du grec.
  terminology: « Homme débauché » rend πόρνος sans le réduire à la prostitution ni imposer une précision doctrinale. « Tout pain est doux » conserve fidèlement l’image grecque ; « doux » est approprié dans ce contexte. La note sur la mort doit être ajustée pour correspondre à la formulation principale.
  issues:
