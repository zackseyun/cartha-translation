  - severity: low
    issue: La formulation « se livre à la débauche sexuelle » est lourde.
    rationale: Elle transmet l’idée, mais « homme débauché » est plus naturel en français moderne et conserve le caractère proverbial et générique de ἄνθρωπος πόρνῳ.
