  text: Lord[a], Father and God of my life, do not give me haughty eyes,
translation:
  language: fr
  text: Seigneur, Père et Dieu de ma vie, ne me donne pas un regard hautain[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des yeux arrogants »; l’expression grecque peut aussi se comprendre plus littéralement comme « l’agitation des yeux » ou « un regard instable ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Seigneur
  rationale: Vocatif divin de κύριος; « Seigneur » est naturel dans la prière et correspond à l’usage biblique français courant.
- source_word: πάτερ
  choice: Père
  rationale: Vocatif direct adressé à Dieu; l’équivalent simple « Père » préserve la suite compacte des titres.
- source_word: θεὲ ζωῆς μου
  choice: Dieu de ma vie
  rationale: Cette traduction conserve l’expression génitive et son ambiguïté, sans préciser si Dieu est le maître, la source ou le soutien de la vie.
- source_word: μετεωρισμὸν ὀφθαλμῶν
  choice: un regard hautain
  rationale: L’expression associe l’idée d’élévation aux yeux et peut désigner l’orgueil manifesté par le regard. Le français idiomatique préfère ici le singulier collectif « regard ».
- source_word: μὴ δῷς μοι
  choice: ne me donne pas
  rationale: Rend directement la défense formulée avec le subjonctif aoriste de δίδωμι, tout en restant naturelle dans une prière française.
theological_decisions:
- issue: Sens moral de μετεωρισμὸν ὀφθαλμῶν
  choice: un regard hautain
  alternative: l’agitation des yeux / un regard instable
  rationale: Dans cette prière sapientielle, l’élévation des yeux évoque probablement l’arrogance. Cependant, le grec peut aussi suggérer plus littéralement l’agitation ou l’instabilité du regard; cette possibilité est conservée en note plutôt qu’écartée.
translation_notes:
  register: Français moderne, international et digne. La formulation reste proche de la structure grecque, tandis que « un regard hautain » exprime naturellement en français l’image des yeux élevés. L’ambiguïté lexicale est signalée en note.
