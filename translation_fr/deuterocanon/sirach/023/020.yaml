  text: Before all things were created[a], it was known to him; so also after they are completed.
translation:
  language: fr
  text: Avant que toutes choses soient créées, elles lui étaient connues[a] ; il en va de même après leur achèvement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Avant que toutes choses soient créées, il les connaissait ; de même après leur achèvement. » La forme grecque ἔγνωσται peut se rendre de plusieurs façons ; elle exprime ici une connaissance déjà complète.'
    reason: alternative lexicale et grammaticale
lexical_decisions:
- source_word: πρὶν ἢ
  choice: Avant que
  rationale: Introduit naturellement en français la priorité temporelle, tout en appelant le subjonctif dans la proposition qui suit.
- source_word: κτισθῆναι
  choice: soient créées
  rationale: Rend l’infinitif aoriste passif de κτίζω par une formulation française claire qui conserve le sens passif de création.
- source_word: τὰ πάντα
  choice: toutes choses
  rationale: Conserve la portée totalisante de l’expression grecque et un registre biblique digne sans ajouter explicitement « la création ».
- source_word: ἔγνωσται
  choice: elles lui étaient connues
  rationale: Le parfait grec exprime un état acquis de connaissance. Le pluriel français reprend naturellement « toutes choses », tandis que le datif αὐτῷ est conservé par « lui ».
- source_word: αὐτῷ
  choice: lui
  rationale: Préserve le pronom du grec sans remplacer explicitement son référent contextuel par « Dieu ».
- source_word: οὕτως καὶ
  choice: il en va de même
  rationale: Exprime avec naturel le parallélisme entre l’avant-création et l’après-achèvement.
- source_word: μετὰ τὸ συντελεσθῆναι
  choice: après leur achèvement
  rationale: Rend la construction temporelle avec μετά et l’idée d’accomplissement complet, en rattachant « leur » à « toutes choses ».
theological_decisions:
- issue: Référent implicite de αὐτῷ dans le contexte sapientiel
  choice: Conserver « lui », le contexte identifiant le référent comme Dieu.
  alternative: Écrire explicitement « elles étaient connues de Dieu ».
  rationale: Le grec emploie un pronom. Le maintenir évite d’ajouter au verset une identification que le contexte suffit à fournir.
- issue: Voix et portée de ἔγνωσται
  choice: Employer la tournure stative « elles lui étaient connues ».
  alternative: 'Traduire activement : « il les connaissait ».'
  rationale: La tournure retenue préserve la forme passive et l’état de connaissance complète, sans effacer l’ambiguïté grammaticale possible du parfait grec.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le parallélisme temporel, le pronom implicite pour Dieu et l’ambiguïté de la voix grecque, signalée en note.
