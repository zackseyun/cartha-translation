  verdict: revise
  source_fidelity: La traduction rend fidèlement l’impératif, le cadre social de συνεδρεύει ἀνὰ μέσον μεγιστάνων, ainsi que la succession de conséquences introduite par μή ποτε. Toutefois, « grands personnages » neutralise la référence masculine explicite de μεγιστάνων, et « par tes habitudes » est moins précis et moins idiomatique que le singulier collectif correspondant à τῷ ἐθισμῷ σου.
  naturalness: Le français est globalement naturel, mais « Prends garde de ne pas… de peur que » alourdit inutilement la construction et dissocie la mise en garde grecque. Une unique phrase avec « de peur que » restitue plus directement la période sapientielle. « Ta conduite habituelle » est plus fluide que « tes habitudes » dans ce contexte.
  terminology: « Hommes puissants » conserve à la fois le masculin du grec et l’idée de rang ou de pouvoir, sans imposer l’idée plus spécifique de noblesse héréditaire. « S’oublier » préserve une lecture contextuellement plausible, tandis que la note maintient explicitement la possibilité passive de la forme grecque.
  issues:
  - severity: medium
    issue: Référence masculine de μεγιστάνων neutralisée dans le texte principal
    rationale: « Grands personnages » peut viser des personnes de tout genre, alors que μεγιστάνων est un masculin désignant ici des hommes de haut rang. La note le signale, mais le texte principal devrait conserver cette donnée source.
  - severity: low
    issue: Construction redondante « Prends garde de ne pas… de peur que »
    rationale: La redondance n’est pas nécessaire et rend moins directement la subordonnée de crainte μή ποτε. Elle peut être supprimée sans perte de sens.
  - severity: low
    issue: « Par tes habitudes » est peu idiomatique et pluralise le singulier grec
    rationale: τῷ ἐθισμῷ σου désigne la conduite ou le comportement habituel. « Par ta conduite habituelle » est plus naturel et garde le singulier collectif.
