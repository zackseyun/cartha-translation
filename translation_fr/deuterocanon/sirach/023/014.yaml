  yaml_path: translation/deuterocanon/sirach/023/014.yaml
  text: Remember your father and your mother[a], for you sit in the midst of great men; lest you be forgotten before them, and by your habit become foolish, and wish that you had not been born[b], and curse the day of your birth.
translation:
  language: fr
  text: Souviens-toi de ton père et de ta mère, car tu sièges parmi des hommes puissants[a], de peur que tu ne t’oublies en leur présence[b], que, par ta conduite habituelle, tu ne deviennes insensé, que tu ne souhaites n’être jamais né et que tu ne maudisses le jour de ta naissance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque désigne des hommes puissants ou haut placés ; on pourrait aussi traduire : « parmi les nobles » ou « parmi les hauts dignitaires ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, selon une lecture plus passive de la forme grecque : « de peur que tu ne sois oublié devant eux ». Le sens retenu évoque la perte de retenue ou l’oubli des convenances en leur présence.'
    reason: alternative_reading
lexical_decisions:
- source_word: μνήσθητι
  choice: Souviens-toi
  rationale: L’impératif appelle à garder activement à l’esprit; «Souviens-toi» est direct et naturel.
- source_word: πατρὸς καὶ μητρός σου
  choice: de ton père et de ta mère
  rationale: Le grec nomme séparément les deux parents; la traduction conserve cette formulation concrète.
- source_word: ἀνὰ μέσον μεγιστάνων συνεδρεύει
  choice: tu sièges parmi les grands personnages
  rationale: συνεδρεύει évoque le fait de siéger avec d’autres, éventuellement en conseil; μεγιστάνων désigne des hommes de rang ou de pouvoir élevés. «Grands personnages» restitue ici le statut social sans suggérer nécessairement la noblesse héréditaire.
- source_word: ἐπιλαθῇ ἐνώπιον αὐτῶν
  choice: tu ne t’oublies en leur présence
  rationale: Dans le contexte, la tournure se comprend bien au sens réflexif de perdre sa retenue ou d’oublier la conduite qui convient. L’ambiguïté formelle avec une lecture passive est signalée en note.
- source_word: τῷ ἐθισμῷ σου
  choice: par tes habitudes
  rationale: ἐθισμός désigne une habitude ou une conduite acquise; le pluriel français exprime naturellement l’ensemble des manières habituelles sans ajouter explicitement «mauvaises».
- source_word: μωρανθῇς
  choice: tu ne deviennes insensé
  rationale: Le verbe exprime le fait de devenir sot ou insensé; «insensé» convient au registre sapientiel.
- source_word: θελήσεις εἰ μὴ ἐγεννήθης
  choice: tu ne souhaites ne jamais être né
  rationale: Cette formulation française rend idiomatiquement le regret profond exprimé par la construction grecque.
- source_word: τὴν ἡμέραν τοῦ τοκετοῦ σου μὴ καταράσῃ
  choice: tu ne maudisses le jour de ta naissance
  rationale: La proposition poursuit la série des conséquences redoutées introduites par μή ποτε; le subjonctif français l’intègre clairement à la mise en garde.
theological_decisions:
- issue: Référence sociale masculine de μεγιστάνων
  choice: les grands personnages
  alternative: les grands hommes; les nobles; les hauts dignitaires
  rationale: Le mot grec est grammaticalement masculin et vise des hommes puissants ou haut placés dans le contexte ancien. «Grands personnages» conserve l’idée de rang social tout en restant idiomatique; une note précise la référence masculine.
- issue: Ambiguïté de ἐπιλαθῇ ἐνώπιον αὐτῶν
  choice: tu ne t’oublies en leur présence
  alternative: tu ne sois oublié devant eux; tu ne passes inaperçu auprès d’eux
  rationale: 'Le contexte d’une conduite habituelle qui mène à la folie favorise le sens réflexif: perdre sa retenue devant des dignitaires. La forme grecque permet toutefois une lecture passive, conservée en note afin de ne pas effacer l’ambiguïté.'
translation_notes:
  register: Français international moderne, digne et accessible. La période grecque a été répartie en deux phrases pour plus de clarté, tout en maintenant la chaîne des conséquences redoutées. Les marqueurs [a] et [b] figurent dans le texte principal.
