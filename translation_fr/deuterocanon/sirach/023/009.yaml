  yaml_path: translation/deuterocanon/sirach/023/009.yaml
  text: Do not accustom your mouth to an oath[a], and do not become accustomed to invoking the Holy One by name.
translation:
  language: fr
  text: N’habitue pas ta bouche à prêter serment et ne prends pas l’habitude d’invoquer le Saint par son nom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne prends pas l’habitude d’employer le saint nom ». Le grec peut évoquer soit le fait de nommer ou d’invoquer le Saint, soit l’usage de son nom sacré.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅρκῳ
  choice: à prêter serment
  rationale: Le datif avec ἐθίζω indique la pratique à laquelle la bouche ne doit pas être habituée. « Prêter serment » exprime naturellement en français l’idée du substantif ὅρκος sans élargir l’interdiction à toute parole énergique.
- source_word: μὴ ἐθίσῃς τὸ στόμα σου
  choice: N’habitue pas ta bouche
  rationale: Cette formulation conserve la nuance causative de ἐθίζω, la prohibition et l’image concrète de la bouche.
- source_word: ὀνομασίᾳ
  choice: invoquer … par son nom
  rationale: ὀνομασία désigne l’action de nommer ou de faire usage d’un nom. Dans ce contexte religieux, « invoquer … par son nom » est naturel tout en laissant en note l’autre compréhension possible, celle de l’emploi du saint nom.
- source_word: τοῦ ἁγίου
  choice: le Saint
  rationale: Le génitif est compris comme une désignation révérencielle de Dieu. « Le Saint » préserve ce titre sans développer explicitement le grec en « saint nom ».
- source_word: μὴ συνεθισθῇς
  choice: ne prends pas l’habitude
  rationale: 'Cette tournure française rend naturellement le sens passif ou inchoatif du verbe composé : entrer dans une habitude bien établie.'
theological_decisions:
- issue: Référent de τοῦ ἁγίου
  choice: 'Comprendre l’expression comme un titre divin : « le Saint ».'
  alternative: La comprendre métonymiquement comme « le saint nom » ou, plus généralement, « ce qui est saint ».
  rationale: Dans cet avertissement sur la parole, le référent divin est probable, mais la construction grecque permet une nuance liée à l’usage du nom sacré. La traduction principale garde le titre et la note signale l’autre lecture.
- issue: Portée éthique de l’interdiction
  choice: Viser l’habitude de prêter serment et d’invoquer le nom divin.
  alternative: Y voir une interdiction absolue de toute forme de serment.
  rationale: La répétition des verbes d’accoutumance, ἐθίζω et συνεθίζω, met explicitement l’accent sur la pratique habituelle. La traduction n’impose donc pas une interdiction doctrinale plus large que le texte.
translation_notes:
  register: Français moderne, international et digne. L’image concrète de la bouche est conservée; « prêter serment » et « prendre l’habitude » assurent une lecture naturelle sans atténuer la mise en garde.
