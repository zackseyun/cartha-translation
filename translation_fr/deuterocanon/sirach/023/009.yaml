review_pass:
  verdict: approve
  source_fidelity: Le texte rend avec fidélité les deux interdictions grecques et conserve l’accent sur l’acquisition d’une habitude. « N’habitue pas ta bouche » reproduit la construction causative de μὴ ἐθίσῃς τὸ στόμα σου; « à prêter serment » exprime naturellement ὅρκῳ. La seconde proposition rend correctement le sens inchoatif de μὴ συνεθισθῇς et comprend plausiblement τοῦ ἁγίου comme le titre divin « le Saint ». « Invoquer le Saint par son nom » représente de manière explicite mais défendable la notion de ὀνομασία, à savoir l’usage/évocation du nom.
  naturalness: Le français est moderne, clair et d’un registre digne. « Prêter serment » et « prendre l’habitude » sont idiomatiques. La formulation « invoquer le Saint par son nom » est légèrement plus explicite que le grec, mais elle demeure naturelle et correspond au contexte ainsi qu’à l’ambiguïté signalée en note.
  terminology: « Le Saint » fonctionne comme titre révérenciel divin sans imposer la lecture métonymique « le saint nom ». La note préserve utilement l’alternative selon laquelle l’expression concerne l’emploi du nom sacré. L’ancre est placée sur l’élément interprétatif pertinent et correspond à l’unique note.
