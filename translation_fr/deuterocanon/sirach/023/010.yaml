base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/010.yaml
  text: For just as a servant being constantly examined will not be spared bruises[a], so also one who swears and names the Name continually will never be cleansed from sin.
translation:
  language: fr
  text: En effet, de même qu’un esclave soumis à un examen constant n’échappera pas aux meurtrissures, de même celui qui ne cesse de jurer et de prononcer le Nom[a] ne sera jamais purifié du péché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’invoquer sans cesse le nom ». Dans ce contexte, le grec renvoie probablement à l’emploi répété du nom divin dans les serments ou dans des paroles irrévérencieuses.
    reason: Alternative lexicale et explicitation d’une allusion probable, mais non formulée expressément dans le grec.
lexical_decisions:
- source_word: οἰκέτης
  choice: serviteur
  rationale: Le terme désigne un serviteur de maison et peut, selon le contexte social antique, impliquer la condition servile. « Serviteur » reste naturel en français et préserve ici l’image de la dépendance sans préciser davantage que le grec.
- source_word: ἐξεταζόμενος ἐνδελεχῶς
  choice: soumis à des interrogatoires continuels
  rationale: Le participe et l’adverbe expriment un examen ou un interrogatoire persistant. Cette formulation rend à la fois la répétition et la situation coercitive suggérée par les meurtrissures.
- source_word: ἀπὸ μώλωπος οὐκ ἐλαττωθήσεται
  choice: n’échappera pas aux meurtrissures
  rationale: L’expression indique que le serviteur ne restera pas exempt de marques laissées par les coups. « Meurtrissures » rend μώλωψ dans un registre digne et compréhensible.
- source_word: ὁ ὀμνύων
  choice: celui qui ne cesse de jurer
  rationale: Le participe présent, renforcé par διὰ παντός dans la proposition, décrit une pratique habituelle plutôt qu’un serment isolé.
- source_word: καὶ ὀνομάζων διὰ παντός
  choice: et de prononcer le Nom
  rationale: Dans le contexte des serments, ὀνομάζω évoque probablement l’emploi ou l’invocation du nom divin. La majuscule signale cette allusion sans ajouter explicitement « Dieu », absent du grec.
- source_word: ἀπὸ ἁμαρτίας οὐ μὴ καθαρισθῇ
  choice: ne sera jamais purifié du péché
  rationale: La construction οὐ μή marque une négation emphatique, et καθαρίζω conserve ici son sens moral et religieux de purification.
theological_decisions:
- issue: Référent de « prononcer le Nom »
  choice: Allusion au nom divin employé de façon répétée dans les serments ou la parole irrévérencieuse
  alternative: Comprendre simplement « prononcer un nom » sans référent divin explicite
  rationale: Le voisinage immédiat de ὀμνύων rend probable l’invocation du nom divin. La traduction « le Nom », accompagnée d’une note, conserve cette lecture probable tout en signalant que « divin » n’est pas exprimé dans le texte grec.
translation_notes:
  register: Français international moderne, naturel et digne. La comparaison proverbiale et son parallélisme sont conservés. « Interrogatoires » fait ressortir la dimension coercitive de l’examen répété, tandis que « le Nom » maintient l’ellipse théologique du grec.
