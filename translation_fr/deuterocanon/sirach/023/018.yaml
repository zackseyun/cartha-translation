  text: A man transgressing from his bed says in his soul[a], “Who sees me?”
translation:
  language: fr
  text: 'Un homme qui s’écarte de son lit dit en lui-même[a] : « Qui me voit ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus explicitement dans ce contexte : « qui quitte le lit conjugal ». Le grec dit littéralement qu’il « s’écarte de son lit », expression euphémique qui évoque ici une faute sexuelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος
  choice: Un homme
  rationale: Le nom est singulier et désigne ici un individu masculin représentatif dans un contexte d’infidélité sexuelle.
- source_word: παραβαίνων
  choice: qui s’écarte
  rationale: Le participe exprime le fait de franchir une limite ou de dévier. « S’écarte » conserve l’idée de faute morale tout en restant naturel avec « de son lit » et sans expliciter davantage que le grec.
- source_word: ἀπὸ τῆς κλίνης αὐτοῦ
  choice: de son lit
  rationale: κλίνη désigne un lit ou une couche. « Son lit » préserve l’euphémisme du grec; le contexte suggère le lit conjugal.
- source_word: λέγων ἐν τῇ ψυχῇ αὐτοῦ
  choice: dit en lui-même
  rationale: Il s’agit d’une formule de discours intérieur. Le français idiomatique « en lui-même » communique ce sens sans donner à « âme » une saillance artificielle.
- source_word: Τίς με ὁρᾷ;
  choice: Qui me voit ?
  rationale: Traduction directe du présent, qui conserve la conviction du personnage d’agir à l’abri des regards.
theological_decisions:
- issue: Faut-il expliciter l’adultère ou le lit conjugal dans le texte principal ?
  choice: Conserver l’expression euphémique « qui s’écarte de son lit »
  alternative: « qui quitte le lit conjugal » ou « qui commet l’adultère »
  rationale: Le contexte sexuel rend l’allusion à l’infidélité très probable, mais ce membre de phrase n’emploie pas de terme explicite pour l’adultère. La traduction maintient donc l’implicite et l’explique en note.
translation_notes:
  register: Français international moderne, sobre et digne. « Dit en lui-même » privilégie l’expression naturelle du discours intérieur; l’euphémisme du grec est maintenu dans le texte principal.
