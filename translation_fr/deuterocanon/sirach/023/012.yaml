  yaml_path: translation/deuterocanon/sirach/023/012.yaml
  text: There is a word wrapped in death; may it not be found in the inheritance of Jacob. For all these things will depart from the godly, and they will not wallow in sins.
translation:
  language: fr
  text: 'Il existe une parole enveloppée de mort[a] : qu’elle ne se trouve pas dans l’héritage de Jacob ! Car toutes ces choses s’éloigneront de ceux qui révèrent Dieu, et ceux-ci ne se vautreront pas dans les péchés.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « revêtue de mort » ou « entourée de mort ». Le grec présente l’image d’une parole enveloppée par la mort.
    reason: Alternative lexicale permettant de préserver les différentes nuances de la métaphore grecque.
lexical_decisions:
- source_word: λέξις
  choice: parole
  rationale: Dans ce contexte, le mot désigne une parole prononcée ou une forme d’expression. « Parole » conserve le singulier et reste naturel en français.
- source_word: ἀντιπεριβεβλημένη
  choice: enveloppée de
  rationale: Le participe évoque ce qui est revêtu ou entouré de quelque chose. « Enveloppée de » préserve cette image forte sans la réduire au simple adjectif « mortelle ».
- source_word: μὴ εὑρεθήτω
  choice: qu’elle ne se trouve pas
  rationale: Cette tournure rend la valeur impérative ou optative de la troisième personne sans transformer l’énoncé en ordre adressé directement au lecteur.
- source_word: κληρονομίᾳ Ἰακώβ
  choice: l’héritage de Jacob
  rationale: La traduction littérale maintient la désignation communautaire et l’arrière-plan d’alliance sans préciser davantage l’identité ou l’étendue de ce groupe.
- source_word: εὐσεβῶν
  choice: ceux qui révèrent Dieu
  rationale: Cette formulation exprime clairement la piété et le respect fidèle envers Dieu, sans l’éventuelle connotation négative de « les pieux » dans le français courant.
- source_word: ἀποστήσεται
  choice: s’éloigneront
  rationale: Le verbe indique ici une séparation ou un retrait. Le futur et le sujet « toutes ces choses » sont conservés conformément à la syntaxe grecque.
- source_word: ἐγκυλισθήσονται
  choice: ne se vautreront pas
  rationale: Le verbe évoque l’action de se rouler dans quelque chose. « Se vautrer » garde l’image concrète d’une immersion complaisante dans les péchés.
- source_word: ἐν ἁμαρτίαις
  choice: dans les péchés
  rationale: Le pluriel grec est maintenu afin d’évoquer des fautes concrètes plutôt que le péché comme notion abstraite.
theological_decisions:
- issue: Identité de « Jacob » dans « l’héritage de Jacob »
  choice: Conserver la désignation communautaire traditionnelle sans l’expliciter
  alternative: Interpréter explicitement l’expression comme Israël ethnique ou comme l’ensemble des justes
  rationale: La formulation grecque est maintenue afin de préserver sa portée communautaire et son arrière-plan d’alliance sans imposer une interprétation théologique ultérieure.
- issue: Référent du sujet dans la dernière proposition
  choice: Rendre explicitement par « ceux-ci » le renvoi aux personnes qui révèrent Dieu
  alternative: Employer simplement « ils », avec une possible ambiguïté en français
  rationale: Le masculin pluriel grec renvoie naturellement aux εὐσεβῶν, tandis que ταῦτα est neutre. « Ceux-ci » clarifie ce changement de sujet sans ajouter de contenu théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore de la parole enveloppée de mort et l’image vigoureuse de personnes qui se vautrent dans les péchés sont conservées. La tournure « ceux qui révèrent Dieu » évite à la fois l’archaïsme et la nuance parfois péjorative de « pieux ».
