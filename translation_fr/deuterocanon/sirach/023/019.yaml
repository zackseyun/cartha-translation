  text: and the fear of him is in the eyes of men,[a]
translation:
  language: fr
  text: Et les yeux des hommes sont ce qu’il craint.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est exceptionnellement condensé, et le texte peut être incertain. Littéralement : « et les yeux des hommes, sa crainte ». On peut aussi comprendre : « la crainte de lui est dans les yeux des hommes » ou « il craint les yeux des hommes ».'
    reason: Lecture alternative et incertitude textuelle.
lexical_decisions:
- source_word: ὀφθαλμοὶ
  choice: les yeux
  rationale: Le nom signifie littéralement « yeux ». Cette image concrète est conservée, plutôt que d’être transformée en « regard » ou « vue ».
- source_word: ἀνθρώπων
  choice: des hommes
  rationale: Le génitif pluriel désigne ici les êtres humains. « Des hommes » suit de près la forme grecque et convient au contexte où il est question de la crainte du regard humain.
- source_word: ὁ φόβος αὐτοῦ
  choice: ce qu’il craint
  rationale: Le groupe nominal signifie littéralement « sa crainte ». Dans cette proposition nominale très condensée, la tournure française « ce qu’il craint » exprime naturellement que les yeux des hommes constituent l’objet de sa crainte, sans déterminer davantage la nature de celle-ci.
theological_decisions:
- issue: Interprétation de la proposition grecque nominale et fortement condensée
  choice: « les yeux des hommes sont ce qu’il craint »
  alternative: « sa crainte, ce sont les yeux des hommes » ; ou, selon une autre analyse, « la crainte qu’il inspire est dans les yeux des hommes »
  rationale: L’ordre grec place « les yeux des hommes » avant « sa crainte » et permet naturellement de comprendre que le regard humain est l’objet de sa crainte. La formulation retenue rend cette lecture intelligible en français, tandis que la note signale l’autre analyse grammaticale possible et l’incertitude du texte.
translation_notes:
  register: Français moderne, digne et accessible. La phrase demeure concise, comme le grec, tandis que la note préserve l’ambiguïté réelle de la proposition.
