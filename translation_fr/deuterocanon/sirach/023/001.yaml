  text: Lord, Father and Master of my life, do not abandon me to their counsel; do not let me fall by them.
translation:
  language: fr
  text: Seigneur, père et maître de ma vie, ne m’abandonne pas à leur dessein ; ne me laisse pas tomber au milieu d’eux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à cause d’eux » ou « par eux » ; le grec peut aussi s’entendre dans un sens causal ou instrumental.'
    reason: Le texte principal rend la valeur spatiale ou associative la plus directe de ἐν αὐτοῖς, tandis que la note préserve les autres lectures possibles.
lexical_decisions:
- source_word: Κύριε
  choice: Seigneur
  rationale: Équivalent français traditionnel et naturel du vocatif grec.
- source_word: πάτερ καὶ δέσποτα ζωῆς μου
  choice: père et maître de ma vie
  rationale: Conserve les deux titres coordonnés et le complément « de ma vie », sans les fondre.
- source_word: βουλῇ αὐτῶν
  choice: leur dessein
  rationale: βουλή peut désigner un conseil, un projet ou un dessein ; ici, « dessein » rend naturellement l’idée d’un projet attribué au groupe évoqué.
- source_word: ἐν αὐτοῖς
  choice: par leur faute
  rationale: L’expression grecque est difficile dans ce contexte. Cette formulation conserve une lecture instrumentale ou causale possible, plus naturelle en français que le calque « en eux ».
theological_decisions:
- issue: Nature de l’action attribuée au groupe par ἐν αὐτοῖς
  choice: par leur faute
  alternative: au milieu d’eux / à cause d’eux
  rationale: Le grec permet difficilement de trancher entre sphère, association et cause. Le texte retient une formulation causale idiomatique tout en signalant l’ambiguïté en note.
translation_notes:
  register: Prière au registre digne et direct, en français moderne. Le tutoiement convient à l’adresse personnelle à Dieu. La ponctuation maintient le parallélisme des deux demandes.
