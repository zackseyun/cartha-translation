base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/006.yaml
  text: Do not let the appetite of the belly and sexual intercourse overtake me[b][a], and do not give me over to a shameless soul.
translation:
  language: fr
  text: Ne permets pas que l’appétit du ventre et les rapports sexuels s’emparent de moi, et ne me livre pas à une âme sans pudeur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte littéralement « à une âme impudente ». « Âme » peut aussi désigner le moi intérieur.
    reason: lexical_alternative
lexical_decisions:
- source_word: κοιλίας ὄρεξις
  choice: l’appétit du ventre
  rationale: Le génitif κοιλίας dépend de ὄρεξις et désigne ici l’appétit corporel. Cette formulation reste proche du grec tout en étant claire en français.
- source_word: συνουσιασμός
  choice: les rapports sexuels
  rationale: Le terme désigne l’union ou les relations sexuelles. « Rapports sexuels » préserve sa portée lexicale sans lui ajouter explicitement l’idée de débauche; le contexte de la prière lui donne déjà une valeur négative.
- source_word: μὴ καταλαβέτωσάν με
  choice: ne s’emparent pas de moi
  rationale: καταλαμβάνω peut exprimer l’action de saisir, gagner ou maîtriser quelqu’un. « S’emparer de moi » rend naturellement l’idée d’être dominé par ces désirs.
- source_word: ψυχὴ ἀναιδεῖ
  choice: une âme sans pudeur
  rationale: La traduction conserve ψυχή, « âme », et rend ἀναιδής par une expression française naturelle qui évoque l’absence de honte ou de retenue.
- source_word: μὴ παραδῷς με
  choice: ne me livre pas
  rationale: παραδίδωμι signifie remettre ou livrer. La tournure garde l’idée d’être abandonné au pouvoir de ce qui suit.
theological_decisions:
- issue: Portée morale de συνουσιασμός
  choice: les rapports sexuels
  alternative: la débauche sexuelle
  rationale: Le grec nomme directement l’activité sexuelle sans employer à lui seul un terme explicite de débauche. La valeur morale négative ressort du contexte, ce qui permet de préserver la tension sans surinterpréter.
- issue: Sens anthropologique de ψυχή
  choice: conserver « âme » dans le texte
  alternative: moi-même / une disposition
  rationale: Le grec emploie explicitement ψυχή. Le maintien d’« âme » préserve son image anthropologique, tandis qu’une note signale que l’expression peut viser le moi intérieur ou une disposition impudente.
translation_notes:
  register: Français moderne, sobre et digne. La coordination et l’image de la domination par les appétits sont conservées; le vocabulaire sexuel demeure direct mais non vulgaire.
