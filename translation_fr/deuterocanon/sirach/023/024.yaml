  text: She will be brought out before the assembly[a], and there will be an inspection concerning her children.
translation:
  language: fr
  text: Elle sera conduite devant l’assemblée, et ses enfants feront l’objet d’une enquête[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « une visitation frappera ses enfants » : le terme grec peut évoquer une intervention judiciaire entraînant un châtiment, et non seulement une enquête.'
    reason: Le sens d’ἐπισκοπή et la portée d’ἐπί restent ouverts entre examen officiel et visitation punitive.
lexical_decisions:
- source_word: αὕτη
  choice: Elle
  rationale: Le démonstratif féminin renvoie à la femme adultère mentionnée dans le contexte immédiat. Le pronom est naturel et sans ambiguïté dans la continuité du passage.
- source_word: ἐκκλησίαν
  choice: assemblée
  rationale: Le terme désigne ici la communauté réunie, devant laquelle la femme est publiquement exposée, sans présupposer le sens chrétien technique d’« Église ».
- source_word: ἐξαχθήσεται
  choice: sera conduite devant
  rationale: Le futur passif d’ἐξάγω exprime le fait d’être menée publiquement auprès de l’assemblée. « Devant » rend clairement la dimension de comparution publique en français.
- source_word: ἐπὶ τὰ τέκνα αὐτῆς
  choice: ses enfants feront l’objet de
  rationale: Cette tournure française présente les enfants comme l’objet de l’action annoncée, tout en évitant de déterminer d’avance si celle-ci est seulement investigatrice ou directement punitive.
- source_word: ἐπισκοπὴ
  choice: enquête
  rationale: Dans ce contexte judiciaire et communautaire, « enquête » exprime naturellement l’idée d’un examen officiel. Une note conserve le sens possible de visitation punitive porté par le grec.
- source_word: ἔσται
  choice: feront l’objet
  rationale: La construction existentielle grecque est reformulée idiomatiquement en français tout en conservant le futur et l’existence d’une mesure visant les enfants.
theological_decisions:
- issue: Faut-il rendre ἐκκλησία par un terme ecclésial ultérieur ?
  choice: assemblée
  alternative: communauté ; Église
  rationale: Le passage relève de la littérature sapientielle et évoque une comparution devant la collectivité réunie, non une institution chrétienne techniquement définie.
- issue: Quelle force donner à ἐπισκοπή ?
  choice: enquête
  alternative: inspection ; visitation ; châtiment
  rationale: Le mot peut désigner un examen officiel ou une visitation aux conséquences judiciaires. Le texte principal retient une formulation française naturelle qui ne dit pas explicitement « châtiment », tandis que la note préserve la possibilité d’un sens punitif.
translation_notes:
  register: Français international actuel, sobre et digne. « Sera conduite devant » restitue la comparution publique ; « feront l’objet d’une enquête » évite une formulation littérale lourde tout en maintenant la nuance officielle et judiciaire.
