  text: Do not glorify yourself in your father's disgrace[a], for it is no honor to you.
translation:
  language: fr
  text: Ne cherche pas à tirer honneur de la honte de ton père[a], car cela ne t’apporte aucun honneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne cherche pas à te faire honneur dans la honte de ton père. » La préposition hébraïque peut indiquer la situation dans laquelle on recherche l’honneur ou le moyen employé pour l’obtenir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתְכַּבֵּד
  choice: Ne cherche pas à te faire honneur
  rationale: Le hitpael de כבד exprime ici l’idée de rechercher ou de gagner de l’honneur pour soi-même. Cette formulation naturelle conserve la valeur réflexive sans réduire le verbe à « se vanter ».
- source_word: בְּקְלוֹן אָבִיךָ
  choice: dans la honte de ton père
  rationale: קלון désigne la honte, le déshonneur ou l’opprobre. « Dans » garde la construction hébraïque et laisse ouverte la nuance instrumentale possible de la préposition ב.
- source_word: כִּי
  choice: car
  rationale: Introduit avec concision la raison de l’interdiction, dans un registre sapientiel digne.
- source_word: לֹא כָבוֹד הוּא לָךְ
  choice: cela ne te fait pas honneur
  rationale: Rend naturellement en français la construction nominale hébraïque et maintient la reprise lexicale de la racine כבד.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La répétition de « honneur » reflète le jeu lexical hébreu entre תִּתְכַּבֵּד et כָבוֹד, tandis que la note préserve l’ambiguïté de בְּ entre valeur circonstancielle et instrumentale.
