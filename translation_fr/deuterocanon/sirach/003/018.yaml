translation:
  language: fr
  text: Abaisse-toi, quelle que soit ta grandeur, et devant Dieu tu trouveras compassion.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Plus tu es grand, plus tu dois t’humilier, et devant le Seigneur tu trouveras faveur. »'
    reason: Le parallèle grec emploie une construction comparative et « faveur », là où l’hébreu dit littéralement « rends-toi petit de toute grandeur » et « compassion ».
lexical_decisions:
- source_word: מַעֵט נַפְשְךָ
  choice: Abaisse-toi
  rationale: Littéralement « rends-toi petit » ou « diminue-toi » ; « abaisse-toi » exprime naturellement en français l’appel à renoncer à l’élévation de soi, sans ajouter une obligation absente de l’hébreu.
- source_word: מִכָּל גְּדוּלָה
  choice: quelle que soit ta grandeur
  rationale: La construction hébraïque signifie littéralement « de toute grandeur ». Cette formulation française conserve le lien entre l’abaissement volontaire et tout degré de grandeur, tout en restant idiomatique.
- source_word: רַחֲמִים
  choice: compassion
  rationale: Le pluriel hébreu désigne la compassion ou la miséricorde. « Compassion » rend directement le champ affectif du terme, tandis que le grec parallèle porte « faveur ».
theological_decisions:
- issue: Identité divine dans לִפְנֵי אֵל
  choice: devant Dieu
  alternative: devant le Seigneur
  rationale: Le texte hébreu porte אֵל, « Dieu », tandis que « Seigneur » appartient au parallèle grec. La traduction suit donc la source hébraïque principale.
- issue: Relation entre grandeur et abaissement
  choice: Abaisse-toi, quelle que soit ta grandeur
  alternative: Plus tu es grand, plus tu dois t’humilier
  rationale: L’alternative suit étroitement le grec, mais l’hébreu formule une exhortation à se faire petit par rapport à « toute grandeur ». Le choix retient cette tension sans introduire le comparatif proportionnel ni « devoir ».
translation_notes:
  register: Français moderne, sobre et sapientiel. Le tutoiement singulier correspond aux formes hébraïques. La formulation privilégie le texte hébreu attesté, avec le grec signalé en note en raison de sa divergence notable.
