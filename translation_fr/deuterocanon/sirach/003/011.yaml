  text: For a man's honor is the honor of his father, and one who dishonors his mother multiplies sin.
translation:
  language: fr
  text: L’honneur d’un homme est l’honneur de son père, et celui qui déshonore[a] sa mère multiplie le péché.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « celui qui maudit sa mère multiplie le péché ». Le verbe hébreu peut désigner précisément l’action de maudire; ici, le parallélisme entre honneur et déshonneur, ainsi que le témoin grec, appuie le sens plus large « déshonorer ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec parallèle porte : « Car la gloire d’un homme vient de l’honneur de son père, et une mère déshonorée est une honte pour ses enfants. » Sa seconde proposition reflète une forme du texte quelque peu différente de l’hébreu conservé.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּבוֹד אִישׁ
  choice: l’honneur d’un homme
  rationale: כְּבוֹד désigne ici l’honneur ou la considération sociale, et אִישׁ conserve la forme masculine singulière du proverbe hébreu.
- source_word: כִּבּוּד אָבִיו
  choice: est l’honneur de son père
  rationale: La formulation équative garde la concision et l’ellipse du texte hébreu, sans introduire explicitement l’idée de provenance suggérée par le grec.
- source_word: וּמַרְבֶּה חֵטְא
  choice: multiplie le péché
  rationale: Le hifil de רבה exprime l’accroissement causé, et חֵטְא est rendu directement par « péché ».
- source_word: מְקַלֵּל אִמּוֹ
  choice: celui qui déshonore sa mère
  rationale: Le piel de קלל peut signifier maudire, mais aussi traiter avec mépris. « Déshonore » maintient le parallélisme entre honneur et honte, tout en laissant l’acception plus étroite en note.
theological_decisions:
- issue: Sujet proverbial masculin
  choice: l’honneur d’un homme
  alternative: l’honneur d’une personne
  rationale: Le masculin singulier אִישׁ est conservé sans neutraliser la forme du texte source; l’énoncé garde sa portée proverbiale.
- issue: Sens de מְקַלֵּל dans le devoir envers la mère
  choice: celui qui déshonore sa mère
  alternative: celui qui maudit sa mère
  rationale: Le parallélisme hébreu autour de l’honneur et le témoin grec favorisent le sens plus large de mépris ou de déshonneur, sans exclure la malédiction verbale.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe proverbiale reste concise; « car » est maintenu comme articulation présente dans le parallèle grec et dans la couche de consultation anglaise, bien que le texte hébreu transmis ne comporte pas de conjonction causale explicite.
