base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/023.yaml
  text: Do not probe into what is beyond you[b][a], for what is too great for you has been shown to you.
translation:
  language: fr
  text: Ne cherche pas à approfondir ce qui te dépasse[a], car ce qui est trop grand pour toi t’a été montré[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « N’examine pas des choses trop grandes pour toi. » Le verbe hébreu est difficile ; le grec porte : « Ne sois pas indiscrètement curieux dans tes nombreuses activités. »'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu peut aussi se comprendre : « car tu as vu beaucoup de choses qui te dépassent » ; le grec appuie la traduction : « ce qui est trop grand pour toi t’a été montré ».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹתֵר מִמְּךָ
  choice: ce qui te dépasse
  rationale: L’expression désigne ce qui excède la mesure ou les capacités d’une personne. Cette formulation est naturelle en français et conserve l’idée comparative de l’hébreu.
- source_word: אַל תַּמֵּר
  choice: Ne cherche pas à approfondir
  rationale: Le verbe hébreu est difficile. Dans ce contexte, et à la lumière du grec μὴ περιεργάζου, il met en garde contre une investigation indiscrète ou excessive. « Chercher à approfondir » exprime cette démarche sans donner au conseil une portée anti-intellectuelle générale.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’interdiction et garde la concision du propos sapiential.
- source_word: רַב מִמְּךָ
  choice: ce qui est trop grand pour toi
  rationale: La phrase évoque des réalités qui dépassent la mesure ou la compétence humaine. « Trop grand pour toi » en maintient explicitement le caractère comparatif.
- source_word: הָרְאֵיתָ
  choice: t’a été montré
  rationale: La forme hébraïque peut se lire activement, « tu as vu », mais le parallèle grec ὑπεδείχθη σοι appuie nettement un sens passif. La formulation française conserve ce témoignage tout en signalant l’autre lecture en note.
theological_decisions:
- issue: Voix de הָרְאֵיתָ par rapport au parallèle grec
  choice: 'sens passif : « t’a été montré »'
  alternative: 'sens actif : « tu as vu »'
  rationale: L’hébreu permet une lecture active, tandis que le grec atteste clairement une idée passive. Le sens passif produit un avertissement cohérent contre l’investigation de réalités qui dépassent l’être humain, sans préciser qui les a révélées ni importer une doctrine ultérieure.
translation_notes:
  register: Français international moderne, sobre et sapiential. Le tutoiement singulier reflète l’adresse hébraïque. La formulation reste digne et accessible, tout en préservant dans les notes les difficultés lexicales et l’ambiguïté de la voix verbale.
