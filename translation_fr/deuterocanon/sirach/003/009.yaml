  text: A father's blessing establishes roots[a], but a mother's curse uproots a plant.
translation:
  language: fr
  text: La bénédiction d’un père affermit les racines[a], mais la malédiction d’une mère arrache la plante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle dit : « Car la bénédiction d’un père affermit les maisons des enfants, mais la malédiction d’une mère déracine les fondations. » Le témoin hébreu emploie plutôt une image agricole : « racines » et « plante ».'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּרְכַת אָב
  choice: La bénédiction d’un père
  rationale: Le groupe construit désigne la bénédiction prononcée par un père. Cette formulation française est naturelle et maintient le singulier hébreu ainsi que le parallèle avec la mère.
- source_word: תְּיַסֵּד
  choice: affermit
  rationale: Le verbe יסד exprime l’idée de fonder, d’établir solidement. « Affermit » convient à l’image végétale des racines sans la remplacer par une métaphore architecturale.
- source_word: שֹׁרֶשׁ
  choice: les racines
  rationale: L’hébreu porte l’image de la racine; le pluriel français rend naturellement sa valeur collective dans ce proverbe.
- source_word: וְקִלְלַת אֵם
  choice: mais la malédiction d’une mère
  rationale: « Mais » explicite l’antithèse poétique portée par la coordination hébraïque, tandis que « malédiction » restitue directement קִלְלָה.
- source_word: תִּנְתּשׁ
  choice: arrache
  rationale: Dans ce contexte agricole, le verbe évoque l’action d’extirper ce qui est planté. « Arrache » est idiomatique et conserve la vigueur de l’image.
- source_word: נֶטַע
  choice: la plante
  rationale: Le nom désigne ce qui a été planté. « La plante » est clair, concret et fait écho aux racines du premier membre.
theological_decisions:
- issue: Choix de l’image principale lorsque les témoins hébreu et grec diffèrent
  choice: 'Conserver l’image agricole hébraïque : les racines et la plante.'
  alternative: 'Suivre le grec : « la bénédiction d’un père affermit les maisons de ses enfants, mais la malédiction d’une mère déracine les fondations ».'
  rationale: Le témoin hébreu est ici assuré et cohérent; il gouverne donc le texte principal. La forme grecque, qui développe une image architecturale différente, demeure signalée en note afin de préserver la variation textuelle.
translation_notes:
  register: Français international moderne, simple et digne. Le rythme antithétique du proverbe est conservé, de même que l’image agricole propre au témoin hébreu.
