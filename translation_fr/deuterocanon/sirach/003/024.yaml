translation:
  language: fr
  text: Car les spéculations[a] humaines[b] sont nombreuses, et de mauvaises imaginations égarent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu est rare et peut aussi se comprendre comme « pensées », « raisonnements », « opinions » ou « suppositions ». Le grec emploie un mot qui signifie « supposition » ou « opinion ».
