    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: nombreuses
  rationale: L’adjectif quantitatif s’accorde avec « spéculations » et conserve l’accent mis sur leur grand nombre.
- source_word: עֶשְׁתּוֹנֵי
  choice: spéculations
  rationale: Ce terme hébreu rare et incertain désigne vraisemblablement des opinions ou suppositions formées par l’esprit. Le grec ὑπόλημψις appuie ce sens; « spéculations » conserve aussi la tonalité d’avertissement.
- source_word: בְּנֵי אָדָם
  choice: êtres humains
  rationale: Cette expression sémitique, littéralement « fils d’Adam/de l’homme », désigne ici l’humanité en général. « Êtres humains » en transmet naturellement la portée générique sans suggérer un titre messianique.
- source_word: דִמְיוֹנוֹת
  choice: imaginations
  rationale: Le mot désigne des productions ou représentations de l’esprit. « Imaginations » maintient la distinction avec les « spéculations » du premier membre.
- source_word: רָעוֹת
  choice: mauvaises
  rationale: L’adjectif porte ici une appréciation négative, probablement morale, également attestée par le grec πονηρά.
- source_word: מַתְעוֹת
  choice: égarent
  rationale: La forme causative exprime l’action de détourner de la bonne voie. L’emploi absolu, sans complément exprimé, reproduit la formulation concise de l’hébreu.
theological_decisions:
- issue: Portée anthropologique de בְּנֵי אָדָם
  choice: êtres humains
  alternative: fils d’Adam / fils de l’homme
  rationale: Dans ce contexte, l’expression est générique et ne constitue pas un titre christologique. La traduction retenue exprime clairement l’humanité entière, tandis qu’une note conserve l’image littérale hébraïque.
- issue: Nature des pensées condamnées
  choice: spéculations et mauvaises imaginations
  alternative: pensées et suppositions mauvaises
  rationale: Le verset ne condamne pas explicitement toute activité intellectuelle. La traduction maintient la nuance de conjectures humaines et qualifie de mauvaises les imaginations du second membre, sans élargir la portée doctrinale du texte.
translation_notes:
  register: Français moderne, sobre et sapiential. L’inversion « nombreuses sont » conserve le relief rhétorique de l’ouverture hébraïque. « Les mauvaises imaginations » est légèrement soutenu, mais reste intelligible et permet de préserver le parallélisme lexical du texte source.
