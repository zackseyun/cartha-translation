base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/002.yaml
  text: For Yahweh honored the father above the children[b][a], and he established the mother's authority over her children.
translation:
  language: fr
  text: Car le SEIGNEUR a honoré le père devant ses enfants[a], et il a affermi le droit de la mère sur ses enfants[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a donné au père la préséance sur ses enfants ». L’expression hébraïque peut évoquer la présence des enfants aussi bien que la place d’honneur reconnue au père par rapport à eux.
    reason: lexical_alternative
  - marker: b
    text: Le texte hébreu porte « ses enfants »; le parallèle grec dit ici « les fils ».
    reason: textual_variant
lexical_decisions:
- source_word: יְהֹוָה
  choice: le SEIGNEUR
  rationale: Rend le nom divin YHWH selon l’usage français respectueux représenté aussi par Κύριος dans le parallèle grec.
- source_word: כִּבֵּד
  choice: a honoré
  rationale: Le piel de כבד signifie couramment « honorer » ou « accorder du poids »; « a honoré » est précis, naturel et adapté au contexte.
- source_word: לִפְנֵי הַבָּנִים
  choice: devant ses enfants
  rationale: « Devant » conserve l’image spatiale et relationnelle de לפני sans trancher entièrement entre présence, considération et préséance. Le possessif explicite naturellement en français le rapport familial impliqué.
- source_word: וּמִשְׁפַּט הָאֵם
  choice: le droit de la mère
  rationale: משפט peut désigner le jugement, la justice ou un droit reconnu. Ici, « le droit de la mère » exprime sobrement son statut légitime dans la famille sans réduire le terme à une simple décision judiciaire.
- source_word: קִיֵּם
  choice: a affermi
  rationale: Le verbe signifie rendre ferme, confirmer ou établir. « A affermi » reste proche de l’image hébraïque et correspond au grec ἐστερέωσεν.
- source_word: עַל יְלָדֶיהָ
  choice: sur ses enfants
  rationale: על marque ici la relation ou le domaine d’exercice de ce droit; le suffixe féminin singulier est rendu par « ses », et ילדים par le terme inclusif exact « enfants ».
theological_decisions:
- issue: Maintien de la distinction entre le père et la mère
  choice: le père… le droit de la mère… ses enfants
  alternative: les parents… leur autorité
  rationale: L’hébreu nomme distinctement le père et la mère dans un parallélisme équilibré. Les fusionner en une formule collective effacerait cette distinction voulue.
- issue: Portée sociale et juridique de מִשְׁפַּט הָאֵם
  choice: le droit de la mère
  alternative: l’autorité de la mère
  rationale: « Droit » conserve la portée juridique possible de משפט et laisse ouverte la manière précise dont ce droit se manifeste; « autorité » en exprime bien l’effet pratique, mais interprète davantage.
translation_notes:
  register: Français international actuel, sobre et digne. La structure causale et le parallélisme du verset sont conservés. « Devant » maintient l’ambiguïté réelle de לפני, tandis que la note signale explicitement la lecture de préséance.
