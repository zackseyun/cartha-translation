translation:
  language: fr
  text: Un cœur lourd voit ses douleurs se multiplier[a], et celui qui agit avec démesure ajoute faute sur faute[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente une autre forme : « un cœur dur sera maltraité à la fin » et « un cœur dur sera accablé à la fin ».'
    reason: alternative_reading
  - marker: b
    text: Le terme hébreu traduit par « agit avec démesure » est difficile ; il peut aussi évoquer une conduite effrénée ou irréfléchie, l’illusion de soi ou une arrogance fanfaronne.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב כָּבֵד
  choice: un cœur lourd
  rationale: Rend littéralement l’image hébraïque, qui peut évoquer l’alourdissement intérieur, l’insensibilité ou l’obstination. La tradition grecque « cœur dur » est signalée en note.
- source_word: יִרְבּוּ מַכְאֹבָיו
  choice: multiplie ses douleurs
  rationale: Le verbe exprime l’accroissement ou la multiplication; « douleurs » conserve l’étendue de מַכְאֹב, souffrance physique ou morale.
- source_word: וּמִתְהוֹלֵל
  choice: celui qui agit avec démesure
  rationale: La forme hébraïque est difficile et peut suggérer une conduite effrénée, arrogante, irréfléchie ou marquée par l’illusion de soi. Cette formulation naturelle garde une certaine amplitude sémantique sans réduire le terme à une seule nuance.
- source_word: מוֹסִיף
  choice: ajoute
  rationale: Rend directement le participe hébreu, qui peut aussi impliquer une action répétée ou continue.
- source_word: עָוֹן עַל עָוֹן
  choice: faute sur faute
  rationale: עָוֹן peut désigner la faute, le péché ou la culpabilité. « Faute sur faute » est clair en français moderne et préserve l’image d’accumulation.
theological_decisions:
- issue: Divergence entre les témoins hébreu et grec dans la première partie du verset
  choice: 'Suivre dans le texte principal le témoin hébreu : « Un cœur lourd multiplie ses douleurs »'
  alternative: 'Le grec porte : « un cœur dur sera maltraité à la fin » et « un cœur dur sera accablé à la fin »; il contient aussi la proposition « celui qui aime le danger y tombera ».'
  rationale: Le texte hébreu conservé est ici le témoin principal et sa lecture doit rester visible. Le grec présente une formulation sensiblement différente, voire augmentée; elle est donc documentée en note plutôt qu’intégrée silencieusement au texte.
- issue: Valeur morale de עָוֹן
  choice: faute
  alternative: péché; culpabilité; iniquité
  rationale: « Faute » garde le sens moral sans trancher artificiellement entre l’acte mauvais et la culpabilité qui peut être incluse dans le terme hébreu.
translation_notes:
  register: Français international moderne, sobre et sapientiel. L’image concrète « cœur lourd » et la répétition « faute sur faute » sont conservées. Les marqueurs de notes sont placés immédiatement après les segments concernés.
