  text: Do not hurry to heal the wound of a scoffer[a], for there is no healing for it, for they were planted from an evil planting.
translation:
  language: fr
  text: 'Ne t’empresse pas de guérir la blessure d’un railleur, car elle est incurable : ils sont issus d’une mauvaise souche[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La proposition finale de l’hébreu est difficile et emploie le pluriel. Le parallèle grec porte : « car une plante de méchanceté a pris racine en lui ».'
    reason: Signaler la difficulté textuelle et préserver la lecture différente du parallèle grec.
lexical_decisions:
- source_word: אַל תָּרוּץ
  choice: Ne t’empresse pas
  rationale: Le verbe רוץ signifie littéralement « courir », mais exprime ici une action précipitée dans une défense. « Ne t’empresse pas » est naturel en français et conserve l’idée de hâte.
- source_word: לְרַפְּאוֹת מַכַּת
  choice: de guérir la blessure
  rationale: רפא désigne l’action de guérir, tandis que מכה peut désigner un coup, une atteinte ou une blessure. Avec le vocabulaire de la guérison, « blessure » rend clairement la métaphore médicale.
- source_word: לֵץ
  choice: un railleur
  rationale: Dans la littérature de sagesse, לץ désigne une personne arrogante qui tourne en dérision et résiste à la correction. « Railleur » exprime cette attitude morale dans un registre digne et actuel.
- source_word: אֵין לָהּ רְפוּאָה
  choice: elle est incurable
  rationale: Cette formulation française concise exprime fidèlement l’absence de guérison, avec le pronom féminin renvoyant naturellement à « blessure ».
- source_word: מִנֶּטַע רַע נִטְעוֹ
  choice: ils ont été plantés à partir d’une plantation mauvaise
  rationale: La traduction conserve l’image botanique, la valeur d’origine exprimée par מִן et surtout le pluriel difficile du texte hébreu transmis, sans le corriger silencieusement d’après le grec.
theological_decisions:
- issue: Désaccord textuel entre l’hébreu et le grec dans la proposition finale
  choice: Conserver dans le texte principal le pluriel hébreu, malgré l’absence d’un antécédent pluriel explicite.
  alternative: « car une plante de méchanceté a pris racine en lui »
  rationale: L’hébreu conservé a priorité, mais sa forme plurielle finale est syntaxiquement difficile. La note donne donc le parallèle grec, plus fluide et au singulier, sans effacer l’incertitude du témoignage hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation volontairement inhabituelle de la dernière proposition reflète l’irrégularité du texte hébreu plutôt que de la résoudre en silence.
