    issue: La formulation « ils ont été plantés à partir d’une plantation mauvaise » est maladroite en français.
    rationale: Elle est grammaticalement compréhensible, mais « à partir de » est mécanique dans ce contexte et « plantation mauvaise » ne rend pas naturellement le sens botanique/originel de נטע. Une correction stylistique est sûre sans résoudre l’irrégularité textuelle.
