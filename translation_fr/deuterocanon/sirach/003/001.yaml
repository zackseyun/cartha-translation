  text: Listen[a], children, to a father's instruction, and do so that you may live.
translation:
  language: fr
  text: Écoutez[a], enfants, l’instruction d’un père et agissez ainsi afin de vivre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Écoutez-moi, moi le père, enfants, et faites ainsi, afin que vous soyez sauvés. » Le témoin hébreu formule plus généralement : « l’instruction d’un père… afin de vivre ».'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: L’impératif pluriel appelle à une écoute attentive. « Écoutez » n’explicite pas prématurément l’idée d’obéir, même si la mise en pratique demandée ensuite l’implique.
- source_word: בָנִים
  choice: mes enfants
  rationale: Le masculin pluriel désigne ici les personnes auxquelles le maître de sagesse s’adresse comme un père. « Mes enfants » est une formule naturelle en français et ne restreint pas inutilement le propos aux seuls fils.
- source_word: מִשְׁפַט
  choice: l’instruction
  rationale: Dans ce contexte, le mot ne désigne pas un verdict judiciaire, mais la directive autorisée et formatrice d’un père.
- source_word: אָב
  choice: d’un père
  rationale: L’hébreu ne comporte aucun suffixe possessif. « D’un père » maintient la formulation générique du témoin hébreu sans importer le « de moi, le père » du grec.
- source_word: וַעֲשׂוּ
  choice: agissez en conséquence
  rationale: Le verbe signifie littéralement « faites ». Cette formulation française indique naturellement qu’il faut mettre en pratique l’instruction entendue, sans alourdir la phrase.
- source_word: לְמַעַן
  choice: afin de
  rationale: Cette locution exprime clairement et dignement le but visé.
- source_word: תִּחְיוּ
  choice: vivre
  rationale: Le verbe hébreu signifie « vivre ». Le grec porte une autre lecture, « être sauvés », conservée dans la note.
theological_decisions:
- issue: Divergence entre l’hébreu et le grec concernant la manière dont le père se présente
  choice: 'Suivre dans le texte la formulation générique de l’hébreu : « d’un père »'
  alternative: 'Le grec dit : « Écoutez-moi, moi qui suis le père » ou, plus naturellement, « Écoutez-moi, votre père ».'
  rationale: Le témoin hébreu est ici conservé avec une confiance élevée et constitue la base première. La formulation plus explicite du grec est signalée en note plutôt qu’introduite dans le texte.
- issue: 'Résultat visé : « vivre » ou « être sauvés »'
  choice: Traduire l’hébreu par « afin de vivre »
  alternative: Le grec porte « afin que vous soyez sauvés ».
  rationale: תִּחְיוּ signifie directement « vous viviez ». La variante grecque présente une nuance théologique réelle qui doit être conservée sans remplacer la lecture hébraïque principale.
translation_notes:
  register: Français international moderne, naturel et digne. « Mes enfants » rend l’adresse sapientielle de façon idiomatique; « agissez en conséquence » explicite sobrement le lien entre l’écoute et la mise en pratique. Le marqueur [a] figure dans le texte principal.
