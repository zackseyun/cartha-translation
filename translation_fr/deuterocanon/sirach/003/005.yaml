base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/005.yaml
  text: Whoever honors his father will rejoice in his children[b][a], and his prayer will be heard and answered.
translation:
  language: fr
  text: Qui honore son père se réjouira de son fils[a], et sa prière sera entendue et exaucée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « se réjouira par ses enfants », au pluriel, plutôt que l’hébreu « de son fils », au singulier.
    reason: alternative_reading
  - marker: b
    text: À la fin du verset, le grec porte seulement « sera entendue »; le témoin hébreu ajoute « et exaucée ».
    reason: alternative_reading
lexical_decisions:
- source_word: מְכַבֵּד
  choice: honore
  rationale: Le participe piel de כבד exprime ici le fait d’accorder à son père le poids et la considération qui lui sont dus. « Honore » est naturel en français et conserve la portée éthique du terme.
- source_word: אָבִיו
  choice: son père
  rationale: L’hébreu désigne explicitement le père; la traduction conserve cette précision.
- source_word: יִשְׂמַח
  choice: se réjouira
  rationale: Ce futur direct rend le sens de joie du verbe et convient à la formulation d’une conséquence ou promesse sapientielle.
- source_word: בִּבְנוֹ
  choice: de son fils
  rationale: L’hébreu porte le singulier « son fils ». En français, « se réjouir de son fils » exprime naturellement une joie éprouvée à son sujet, sans remplacer le singulier hébreu par le pluriel grec.
- source_word: וּתְפִלָתוֹ
  choice: et sa prière
  rationale: תְּפִלָּה est le terme courant pour la prière; cette traduction en conserve simplement le sens.
- source_word: יִשְׁמַע וְיַעֲנֶה
  choice: sera entendue et exaucée
  rationale: La tournure passive est idiomatique en français et laisse implicite, comme le texte hébreu, celui qui entend et répond. « Exaucée » rend ici l’idée d’une prière à laquelle une réponse favorable est donnée.
theological_decisions:
- issue: Promesse liée à l’honneur rendu au père
  choice: Présenter la conséquence sous la forme d’une promesse sapientielle sans nommer explicitement Dieu comme agent.
  alternative: Traduire en explicitant que Dieu entendra et exaucera la prière.
  rationale: L’action divine est vraisemblablement sous-entendue, mais l’hébreu ne nomme pas Dieu. La formulation passive préserve ce degré d’implicite et ne résout pas davantage la tension propre à la promesse.
- issue: Portée de l’exaucement de la prière
  choice: Employer « exaucée » pour וְיַעֲנֶה sans préciser la forme ni les conditions de la réponse.
  alternative: Employer « recevra une réponse », formulation moins susceptible de suggérer une réponse favorable.
  rationale: Dans ce contexte sapientiel de bénédiction, « exaucée » rend naturellement le parallélisme « entendue et répondue », tout en évitant d’ajouter une explication doctrinale absente du verset.
translation_notes:
  register: Français international actuel, sobre et digne. La construction « Qui honore… » convient au style des maximes de sagesse. Le singulier masculin du texte hébreu est maintenu, tandis que les variantes grecques pertinentes sont signalées en notes.
