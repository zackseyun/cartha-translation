  text: The heart of the wise understands the sayings of the wise[b][a], and an attentive ear rejoices in wisdom.
translation:
  language: fr
  text: Le cœur du sage comprend les maximes des sages[a], et une oreille attentive se réjouit de la sagesse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « maximes » peut aussi signifier « proverbes », « dictons » ou « paraboles »; le texte grec parallèle emploie « parabole » au singulier.
    reason: lexical_alternative
  - marker: b
    text: 'Dans la seconde partie du verset, le texte grec parallèle diffère et se lit approximativement : « et l’oreille de celui qui écoute est le désir du sage ». La traduction suit ici le texte hébreu conservé : « et une oreille attentive se réjouit de la sagesse ».'
    reason: textual_variant
lexical_decisions:
- source_word: לֵב חָכָם
  choice: Le cœur du sage
  rationale: « Cœur » conserve l’image hébraïque de la faculté intérieure qui pense et comprend. Le singulier « du sage » a ici une valeur représentative et générique.
- source_word: יָבִין
  choice: comprend
  rationale: Le verbe בין désigne ici la capacité de saisir le sens d’un enseignement; « comprend » est direct et naturel.
- source_word: מִשְׁלֵי חֲכָמִים
  choice: les maximes des sages
  rationale: משל peut désigner une maxime, un proverbe ou une parabole. « Maximes » convient au contexte sapientiel sans évoquer nécessairement le titre du livre des Proverbes.
- source_word: אֹזֶן מַקְשֶׁבֶת
  choice: une oreille attentive
  rationale: Cette formulation garde l’image concrète de l’hébreu et exprime l’écoute soutenue indiquée par מקשבת.
- source_word: לְחָכְמָה תִּשְׂמָח
  choice: se réjouit de la sagesse
  rationale: שמח exprime la joie; en français, « se réjouir de » rend naturellement l’association de cette joie à la sagesse, tout en suivant le texte hébreu.
