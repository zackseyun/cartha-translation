  text: My son[a], honor your father in word and deed, so that all blessings may come upon you.
translation:
  language: fr
  text: Mon fils, honore ton père par tes paroles et par tes actes, afin que toutes les bénédictions t’atteignent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec parallèle porte : « afin qu’une bénédiction vienne sur toi de sa part », ce qui désigne plus explicitement le père comme source de la bénédiction.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנִי
  choice: Mon fils
  rationale: L’hébreu emploie une adresse masculine singulière explicite; « Mon fils » la conserve naturellement.
- source_word: בְּמַאֲמָר וּבְמַעֲשֶׂה
  choice: par tes paroles et par tes actes
  rationale: Cette formulation française courante exprime clairement les deux domaines de l’honneur demandé. L’ordre suit l’hébreu, contrairement au grec parallèle.
- source_word: כַּבֵּד אָבִיךָ
  choice: honore ton père
  rationale: Dans ce contexte filial, כבד signifie accorder à son père l’honneur et le respect qui lui sont dus.
- source_word: עֲבוּר
  choice: afin que
  rationale: Introduit ici le but ou le résultat attendu, dans un registre digne et naturel.
- source_word: יַשִׂיגוּךָ
  choice: t’atteignent
  rationale: Rend directement l’image hébraïque de bénédictions qui atteignent ou rejoignent la personne, sans l’affaiblir en simple possession.
- source_word: כֹּל בְּרָכוֹת
  choice: toutes les bénédictions
  rationale: Préserve le pluriel et la portée globale de l’expression hébraïque.
theological_decisions:
- issue: Source des bénédictions
  choice: La source n’est pas précisée dans le texte principal.
  alternative: Le grec dit qu’une bénédiction viendra « de lui », vraisemblablement du père.
  rationale: Le témoin hébreu primaire promet que toutes les bénédictions atteindront le fils sans en nommer la source. Cette indétermination doit être conservée, tandis que la précision grecque est signalée en note.
- issue: Portée de la bénédiction
  choice: « toutes les bénédictions », au pluriel
  alternative: « une bénédiction », selon le grec
  rationale: Le pluriel hébreu כֹּל בְּרָכוֹת est textuellement explicite et ne doit pas être harmonisé avec le singulier grec.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement convient à l’adresse familiale « Mon fils ». « Par tes paroles et par tes actes » est plus idiomatique que le calque « en parole et en acte », tout en préservant le parallélisme éthique.
