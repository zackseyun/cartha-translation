  yaml_path: translation/deuterocanon/sirach/003/006.yaml
  text: Whoever honors his father will have long days[a], and whoever honors his mother repays God.
translation:
  language: fr
  text: Celui qui honore son père verra ses jours se multiplier, et la récompense de Dieu sera pour celui qui honore sa mère.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « celui qui obéit au Seigneur donnera du repos à sa mère ». L’hébreu et le grec diffèrent sensiblement dans ce second membre.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְכַבֵּד
  choice: honore
  rationale: Dans ce contexte éthique, le participe de כבד exprime l’honneur et le respect dus aux parents. « Honore » est naturel en français et conserve le lien avec le commandement traditionnel.
- source_word: אָבִיו / אִמּוֹ
  choice: son père / sa mère
  rationale: Les suffixes hébreux de troisième personne du masculin singulier sont explicitement rendus, ce qui préserve le parallélisme personnel des deux membres.
- source_word: יִרְבּוּ יָמָיו
  choice: verra ses jours se multiplier
  rationale: Cette formulation conserve l’image hébraïque littérale de jours qui deviennent nombreux, tout en restant claire et digne en français moderne.
- source_word: וּגְמוּל אֱלֹהִים עַל
  choice: et la récompense de Dieu sera pour
  rationale: La construction nominale signifie le plus naturellement que la rétribution venant de Dieu est destinée à celui qui honore sa mère. Cette lecture respecte le nom גְּמוּל et la préposition עַל sans transformer la proposition en idée de remboursement fait à Dieu.
theological_decisions:
- issue: Divergence importante entre le texte hébreu et le parallèle grec dans le second membre
  choice: 'Suivre l’hébreu conservé : Dieu récompense celui qui honore sa mère.'
  alternative: 'Suivre le grec : « celui qui obéit au Seigneur donnera du repos à sa mère »'
  rationale: L’hébreu constitue ici le texte source principal et offre un sens cohérent, tandis que le grec témoigne d’une formulation substantiellement différente. L’autre lecture est donc signalée en note plutôt que fusionnée avec le texte hébreu.
- issue: Sens de גְמוּל אֱלֹהִים עַל
  choice: Comprendre l’expression comme la récompense de Dieu accordée à celui qui honore sa mère.
  alternative: Comprendre que celui qui honore sa mère « rembourse Dieu » ou « rend à Dieu ce qu’il lui doit ».
  rationale: La syntaxe nominale et l’emploi courant de גְּמוּל avec עַל favorisent l’idée d’une rétribution qui vient sur quelqu’un ou lui est destinée. La traduction retenue évite d’imposer au texte une notion de dette envers Dieu qui n’est pas explicitement marquée.
translation_notes:
  register: Français international moderne, clair et digne. Le tour « verra ses jours se multiplier » conserve l’image sémitique sans archaïsme excessif. Le second membre reste légèrement formel afin de refléter la formulation nominale et condensée de l’hébreu.
