  text: Without the pupil[a], light is lacking; and without knowledge, wisdom is lacking.
translation:
  language: fr
  text: Sans pupille[a], la lumière fait défaut ; sans connaissance, la sagesse fait défaut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec conservé donne ici un autre proverbe : « Un cœur dur sera accablé de douleurs, et le pécheur ajoutera péché sur péché. »'
    reason: textual_variant
lexical_decisions:
- source_word: בְּאֵין
  choice: sans
  rationale: La préposition avec אֵין exprime l’absence. « Sans » est concis, naturel et conserve la forme proverbiale ainsi que le parallélisme.
- source_word: אִישׁוֹן
  choice: pupille
  rationale: Dans ce contexte associé à la lumière, le mot désigne la pupille de l’œil. « Pupille » exprime clairement le sens anatomique en français moderne.
- source_word: יֶחְסַר / תֶּחְסַר
  choice: manque
  rationale: Le verbe חסר indique un manque ou une déficience. La répétition de « manque » reproduit celle de l’hébreu et maintient l’équilibre des deux propositions.
- source_word: אוֹר
  choice: lumière
  rationale: C’est le sens premier du terme et il convient à l’image concrète de la vision.
- source_word: דַעַת
  choice: connaissance
  rationale: « Connaissance » rend directement le nom hébreu tout en le distinguant de la sagesse dans le second membre.
- source_word: חָכְמָה
  choice: sagesse
  rationale: C’est le sens courant du terme dans la littérature de sagesse et le choix français le plus naturel ici.
theological_decisions:
- issue: Divergence entre les témoins hébreu et grec de Siracide 3.27
  choice: Traduire dans le texte principal le proverbe hébreu conservé et signaler en note le proverbe grec sensiblement différent.
  alternative: 'Suivre le grec : « Un cœur dur sera accablé de peines, et le pécheur ajoutera péché sur péché. »'
  rationale: Puisque l’hébreu est conservé ici avec une confiance élevée, il constitue la base du texte principal. La divergence grecque est substantielle et doit être signalée sans remplacer ni harmoniser le témoignage hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme concis de l’hébreu est conservé, de même que la répétition de « manque ». Le marqueur [a] est placé immédiatement après « pupille », conformément à la note sur la variante textuelle.
