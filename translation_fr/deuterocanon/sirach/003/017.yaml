  text: My son[a], in your prosperity walk in humility, and you will be loved more than one who gives gifts.
translation:
  language: fr
  text: Mon fils[a], dans ta prospérité, conduis-toi avec humilité, et tu seras plus aimé que celui qui donne des présents.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec dit : « Mon enfant, accomplis tes œuvres avec douceur, et tu seras aimé par une personne agréée. » Le témoin hébreu porte plutôt : « Mon fils, dans ta prospérité, conduis-toi avec humilité, et tu seras plus aimé que celui qui donne des présents. »'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנִי
  choice: Mon fils
  rationale: L’hébreu emploie le nom masculin singulier « fils » avec le suffixe de première personne. L’adresse filiale directe est donc conservée.
- source_word: בְּעָשְׁרְךָ
  choice: dans la prospérité
  rationale: Le terme dérive de עֹשֶׁר, « richesse, prospérité ». Cette formulation exprime la condition d’aisance sans réduire indûment le sens à la seule possession d’argent.
- source_word: הִתְהַלֵּךְ
  choice: conduis-toi
  rationale: L’impératif hitpael de הלך, littéralement lié à la marche, désigne ici la manière de vivre ou de se comporter. « Conduis-toi » est naturel en français moderne.
- source_word: בַּעֲנָוָה
  choice: avec humilité
  rationale: ענוה désigne l’humilité ou la douceur. « Avec humilité » convient au contexte éthique et s’accorde idiomatiquement avec « conduis-toi ».
- source_word: וְתֵאָהֵב
  choice: et tu seras aimé
  rationale: La forme nifal exprime ici le fait de devenir l’objet de l’amour d’autrui. Le futur rend naturellement la relation entre exhortation et résultat.
- source_word: מִנּוֹתֵן מַתָּנוֹת
  choice: plus que celui qui fait des cadeaux
  rationale: Le מן comparatif suivi du participe signifie « plus que quelqu’un qui donne des présents ». Cette formulation est directe et naturelle en français.
theological_decisions:
- issue: Divergence entre le témoin hébreu conservé et le parallèle grec
  choice: 'Le texte principal suit l’hébreu : prospérité, conduite humble et comparaison avec celui qui fait des cadeaux.'
  alternative: 'Le grec peut se traduire : « Mon enfant, accomplis tes œuvres avec douceur, et tu seras aimé d’une personne estimée. »'
  rationale: Puisque le témoin hébreu est conservé et jugé très fiable, il régit le texte principal. Le parallèle grec présente toutefois une divergence substantielle qui doit être signalée sans être harmonisée.
translation_notes:
  register: Français international moderne, digne et accessible. « Conduis-toi » rend naturellement l’image hébraïque de la marche comme manière de vivre; « cadeaux » est plus courant que « présents » dans le texte principal.
