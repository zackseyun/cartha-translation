  text: and he will serve those who begot him as masters[a].
translation:
  language: fr
  text: et il servira ceux qui l’ont engendré comme des maîtres[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme des seigneurs » ; le terme grec désigne des personnes exerçant une pleine autorité et sert ici de comparaison forte pour exprimer l’honneur dû aux parents.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεσπόταις
  choice: maîtres
  rationale: Le terme désigne des personnes détenant une pleine autorité. « Maîtres » conserve ici la force de la comparaison sans suggérer directement que les parents seraient propriétaires de leur enfant.
- source_word: δουλεύσει
  choice: servira
  rationale: Le futur de δουλεύω exprime un service accompli en position subordonnée. « Servira » est naturel en français, tandis que la comparaison avec des maîtres en préserve la vigueur.
- source_word: ἐν τοῖς γεννήσασιν αὐτόν
  choice: ceux qui l’ont engendré
  rationale: Cette formulation rend explicitement le participe grec et fonde l’obligation évoquée sur le fait d’avoir donné naissance, plutôt que de le remplacer par le terme plus général « parents ».
theological_decisions:
- issue: Force de l’image de l’obligation filiale
  choice: Maintenir la comparaison selon laquelle il sert ceux qui l’ont engendré « comme des maîtres ».
  alternative: « servira fidèlement ses parents » ou « prendra soin de ceux qui lui ont donné naissance »
  rationale: Le grec associe explicitement δουλεύσει à δεσπόταις et emploie ainsi une image forte de subordination. L’atténuer en simple respect ou assistance réduirait la portée éthique du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « ceux qui l’ont engendré » reste volontairement proche du grec ; « comme des maîtres » conserve la tension et la force de l’image originale.
