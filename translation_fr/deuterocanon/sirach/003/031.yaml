  text: One who does good will be called blessed for his ways[a], and at the time of his stumbling he will find support.
translation:
  language: fr
  text: Celui qui fait le bien sera déclaré heureux à cause de sa conduite[a] et, au moment où il chancellera, il trouvera un appui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « Celui qui rend les bienfaits reçus pense à l’avenir. » Le premier membre grec diffère sensiblement de l’hébreu conservé; les deux textes s’accordent cependant sur l’appui trouvé au moment de la chute.'
    reason: alternative_reading
lexical_decisions:
- source_word: פועל טוב
  choice: Celui qui fait le bien
  rationale: Le participe masculin singulier désigne de manière générale une personne qui agit bien. Cette formulation française est naturelle et conserve le singulier sans rendre le propos exclusivement masculin.
- source_word: יקראנו
  choice: sera déclaré heureux
  rationale: La forme signifie littéralement « on l’appellera ». Dans ce contexte sapientiel, elle exprime une proclamation favorable; « sera déclaré heureux » explicite sobrement cette valeur sans suivre la leçon grecque divergente.
- source_word: בדרכיו
  choice: à cause de sa conduite
  rationale: Littéralement « dans/par ses chemins ». Le pluriel « chemins » désigne ici la manière de vivre; « conduite » restitue naturellement ce sens en français.
- source_word: בעת מוטו
  choice: au moment où il chancellera
  rationale: מוט évoque le fait de vaciller, chanceler ou tomber. « Chancellera » maintient l’image d’une perte d’équilibre sans imposer l’idée d’une ruine définitive.
- source_word: ימצא משען
  choice: il trouvera un appui
  rationale: משען désigne ce sur quoi l’on peut s’appuyer, au sens propre ou figuré. « Un appui » convient aux deux sens et correspond au grec στήριγμα.
theological_decisions:
- issue: Genre grammatical du sujet générique
  choice: Celui qui fait le bien
  alternative: L’homme qui fait le bien
  rationale: Le français emploie naturellement « celui qui » pour représenter un sujet singulier générique. La forme respecte le masculin singulier de l’hébreu sans ajouter que le proverbe ne concernerait que les hommes.
- issue: Choix entre le premier membre hébreu et sa forme grecque divergente
  choice: Suivre le texte hébreu dans le corps du verset
  alternative: « Celui qui rend les bienfaits reçus pense à l’avenir »
  rationale: Puisque le texte hébreu de ce passage est conservé avec une confiance élevée, il demeure la source principale. La variante grecque, substantiellement différente dans le premier membre, est signalée en note; les deux témoins convergent sur l’appui trouvé au moment de la chute.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme sapientiel est conservé; « conduite » rend idiomatiquement la métaphore hébraïque des « chemins », tandis que « chanceller » et « appui » maintiennent l’image du vacillement.
