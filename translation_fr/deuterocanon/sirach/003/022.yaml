  text: Consider what you have been commanded, and you have no business with hidden things.
translation:
  language: fr
  text: Réfléchis à ce qui t’a été permis[a] ; tu n’as pas à t’occuper des choses cachées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit : « ce qui t’a été permis » ou « ce pour quoi tu as reçu autorisation » ; le grec porte : « ce qui t’a été commandé ».'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּמֶּה שֶׁהוּרְשֵׁיתָ
  choice: à ce qui t’a été permis
  rationale: Le texte hébreu exprime d’abord l’idée de permission ou d’autorisation. Cette formulation française reste naturelle tout en laissant la note signaler le parallèle grec, qui présente plutôt un commandement.
- source_word: הִתְבּוֹנֵן
  choice: Réfléchis
  rationale: Le verbe appelle une attention réfléchie et soutenue. « Réfléchis » est direct, actuel et adapté au registre sapiential.
- source_word: וְאֵין לְךָ עֵסֶק
  choice: tu n’as pas à t’occuper
  rationale: Cette tournure rend naturellement l’idée que ces questions ne relèvent pas du domaine propre du destinataire, sans recourir à l’expression plus familière « ce ne sont pas tes affaires ».
- source_word: בְּנִסְתָּרוֹת
  choice: des choses cachées
  rationale: Le choix conserve le sens concret et général de réalités soustraites à la connaissance, sans introduire les connotations théologiques particulières que pourrait porter « mystères ».
theological_decisions:
- issue: Rapport entre l’hébreu הוּרְשֵׁיתָ et le grec προσετάγη
  choice: Suivre dans le texte principal le sens hébreu « ce qui t’a été permis »
  alternative: « ce qui t’a été prescrit » ou « ce qui t’a été commandé »
  rationale: L’hébreu conservé, donné avec une confiance élevée, évoque la permission ou l’autorisation, tandis que le parallèle grec exprime explicitement un commandement. La traduction principale donne priorité à l’hébreu et la note préserve honnêtement la divergence ancienne, sans l’aplanir.
- issue: Nature des « choses cachées »
  choice: Garder une désignation générale
  alternative: « les mystères »
  rationale: Le verset limite l’enquête humaine sans préciser ici une catégorie doctrinale de mystères. Une formulation générale préserve cette ouverture.
translation_notes:
  register: Français international moderne, sobre et sapiential. Le tutoiement correspond à l’adresse hébraïque au singulier. Le point-virgule met en valeur le contraste entre le domaine légitime de la réflexion et les réalités cachées.
