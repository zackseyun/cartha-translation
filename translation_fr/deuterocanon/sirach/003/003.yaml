  terminology: '« Honore », « père » et « mère » sont exacts et appropriés. « Expiés » conserve la portée de כפר sans imposer un système doctrinal ni présenter l’acte filial comme un rite expiatoire accompli par le sujet. Les ancres de notes sont correctement associées : a au nombre de « péchés », b à l’image du trésor mis en réserve.'
