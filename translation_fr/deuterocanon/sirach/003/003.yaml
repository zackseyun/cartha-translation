base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/003.yaml
  text: Whoever honors his father makes atonement for his sins[b][a], and whoever honors his mother stores up treasure.
translation:
  language: fr
  text: Celui qui honore son père voit ses péchés[a] expiés ; celui qui honore sa mère met un trésor en réserve[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « son péché » au singulier ; le parallèle grec porte « péchés ». Le singulier hébreu peut avoir un sens collectif.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « amasse un trésor ». L’image est celle d’une richesse conservée en réserve pour l’avenir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַבֵּד
  choice: honore
  rationale: Le piel de כבד exprime le fait d’accorder l’honneur dû. « Honore » est naturel, digne et plus fort que « respecte », sans la nuance excessive de « glorifie ».
- source_word: אָב
  choice: son père
  rationale: Le terme hébreu désigne précisément le père au singulier, en parallèle avec la mère dans le second membre.
- source_word: תְּכֻפַּר
  choice: obtient l’expiation
  rationale: La forme hébraïque de כפר, éclairée par le grec ἐξιλάσεται, exprime une expiation obtenue. Cette formulation française garde la force théologique du terme tout en évitant de présenter le fils comme l’agent direct du rite expiatoire.
- source_word: חַטָּאתוֹ
  choice: de ses péchés
  rationale: L’hébreu porte le singulier « son péché », susceptible d’un sens collectif, tandis que le parallèle grec emploie le pluriel. Le pluriel est naturel en français et rend probablement le sens collectif.
- source_word: וְגוֹנֵז אוֹצָר
  choice: amasse un trésor
  rationale: גנז évoque le fait de mettre en réserve, et אוצר un trésor. « Amasse un trésor » conserve clairement l’image d’une richesse accumulée sans la connotation négative de « thésaurise ».
- source_word: אִמּוֹ
  choice: sa mère
  rationale: Le suffixe possessif est explicite et le rendu maintient le parallélisme personnel avec « son père ».
theological_decisions:
- issue: Langage de l’expiation dans un contexte sapientiel
  choice: 'Conserver explicitement l’idée d’expiation : « obtient l’expiation de ses péchés »'
  alternative: « couvre ses péchés » ou « obtient le pardon de ses péchés »
  rationale: כפר et ἐξιλάσεται ont une portée expiatoire. Il convient de préserver l’affirmation forte de Ben Sira sans la réduire à un simple avantage moral ni l’intégrer à un système doctrinal postérieur.
- issue: Termes familiaux genrés
  choice: Employer « père » et « mère »
  alternative: « parents »
  rationale: Le texte nomme séparément le père et la mère, et son parallélisme dépend de cette distinction.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure en deux membres parallèles est conservée. « Expiation » maintient la tension théologique du texte source ; les notes signalent l’ambiguïté du nombre et la variante possible de la métaphore.
