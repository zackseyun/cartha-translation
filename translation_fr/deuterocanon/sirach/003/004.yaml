  text: And whoever honors his mother is like one who stores up treasure.
translation:
  language: fr
  text: Et celui qui honore sa mère est comme quelqu’un qui amasse un trésor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοξάζων
  choice: honore
  rationale: Dans ce contexte de sagesse et de devoir filial, le verbe désigne l’honneur et l’estime accordés à la mère, sans imposer le sens cultuel plus fort de « glorifier ».
- source_word: ἀποθησαυρίζων
  choice: amasse un trésor
  rationale: Le participe évoque l’action de mettre en réserve ou d’accumuler dans un trésor. « Amasse un trésor » conserve l’image concrète et reste naturel en français moderne.
- source_word: μητέρα αὐτοῦ
  choice: sa mère
  rationale: Le grec emploie explicitement le singulier dans une formulation proverbiale; « sa mère » le reproduit naturellement.
- source_word: ὡς
  choice: est comme quelqu’un qui
  rationale: La particule introduit une comparaison. L’ajout du verbe « est » et de « quelqu’un » rend la phrase nominale grecque idiomatique en français sans modifier le sens.
theological_decisions:
- issue: Nature du trésor associé à l’honneur rendu à la mère
  choice: Conserver l’image ouverte d’un trésor amassé
  alternative: Préciser qu’il s’agit d’une prospérité matérielle, d’une récompense céleste ou d’un bénéfice moral
  rationale: Le grec ne précise ni la nature ni le lieu du trésor. La traduction préserve donc l’ambiguïté de la métaphore sapientielle au lieu d’y introduire une théologie particulière de la récompense.
translation_notes:
  register: Français international moderne, simple et digne. La structure comparative ainsi que la métaphore concrète du trésor sont conservées.
