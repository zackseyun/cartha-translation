translation:
  language: fr
  text: La justice d’un père ne sera pas effacée[a] ; à la place des péchés, elle sera plantée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Car l’aumône d’un père ne sera pas oubliée et, à la place des péchés, elle sera bâtie pour toi. » Il présente une formulation quelque peu différente, notamment « aumône », « ne sera pas oubliée » et « sera bâtie pour toi ».'
    reason: alternative_reading
lexical_decisions:
- source_word: צִדְקַת אָב
  choice: la justice envers un père
  rationale: L’hébreu dit littéralement « justice de père », construction qui peut désigner la justice manifestée envers son père ou, éventuellement, la justice propre au père. Le contexte immédiat consacré aux devoirs envers les parents favorise ici le sens relationnel « envers un père », tout en gardant « justice », plus large que l’« aumône » du grec.
- source_word: לֹא תִּמָּחֶה
  choice: ne sera pas effacée
  rationale: Le nifal de מחה exprime l’idée d’effacer ou de faire disparaître, notamment comme d’un registre. « Ne sera pas effacée » restitue naturellement cette image en français moderne.
- source_word: וּתְמוּר
  choice: à la place de
  rationale: תמור marque une substitution ou un échange. « À la place de » conserve cette force sans préciser le mécanisme théologique impliqué.
- source_word: חַטָּאת
  choice: des péchés
  rationale: Dans ce contexte sapientiel, le mot désigne vraisemblablement les fautes morales plutôt qu’un sacrifice pour le péché. Le pluriel est soutenu par le parallèle grec.
- source_word: הִיא תְּנַתֵּעַ
  choice: elle sera plantée
  rationale: Le verbe hébreu est rattaché à נטע, « planter ». Le pronom féminin renvoie naturellement à « la justice ». Aucun complément « pour toi » n’est ajouté, puisqu’il n’apparaît pas dans le texte hébreu fourni.
theological_decisions:
- issue: La justice envers un père compense-t-elle les péchés ?
  choice: 'Conserver l’expression forte de substitution : « à la place des péchés »'
  alternative: Dire que cet acte fait expiation pour les péchés, les compense ou demeure simplement en mémoire malgré eux
  rationale: Le texte emploie un langage de substitution, mais n’en définit pas le mécanisme. La traduction préserve cette tension sans lui imposer une doctrine ultérieure de l’expiation ou du mérite.
- issue: Sens de צִדְקַת אָב
  choice: La justice manifestée envers un père
  alternative: La justice propre au père
  rationale: La construction hébraïque demeure concise et potentiellement ambiguë. Le contexte de l’honneur dû aux parents rend le sens filial plus probable, sans justifier de réduire la notion à la seule aumône.
translation_notes:
  register: Français international moderne, sobre et digne. Le point-virgule clarifie les deux propositions parallèles. L’image inhabituelle « elle sera plantée » est conservée parce qu’elle appartient au texte hébreu, tandis que la variante grecque est signalée en note.
