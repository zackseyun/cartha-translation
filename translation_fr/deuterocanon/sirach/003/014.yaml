review_pass:
  verdict: revise
  source_fidelity: 'La traduction du verbe « ne sera pas effacée » rend fidèlement לא תִּמָּחֶה, et « à la place des péchés » conserve la force substitutive de וּתְמוּר חַטָּאת. Toutefois, « envers un père » tranche une ambiguïté réelle de צִדְקַת אָב : le syntagme peut aussi désigner la justice du père. Il convient de la préserver. La note grecque doit également rendre προσανοικοδομηθήσεταί σοι par « sera bâtie pour toi », non par « sera ajoutée pour te bâtir ».'
  naturalness: « La justice d’un père » est une formulation française sobre et naturelle dans un registre biblique moderne. L’image « elle sera plantée » demeure insolite, mais elle est volontairement conservée pour refléter le verbe hébreu rattaché à נטע.
  terminology: « Justice », « péchés » et « effacée » sont appropriés. « Justice d’un père » maintient sans la résoudre l’ambiguïté du génitif hébreu. La variante grecque emploie bien « aumône » et l’image de la construction, distincte de celle de la plantation dans l’hébreu.
  issues:
  - severity: medium
    issue: Le texte principal résout indûment l’ambiguïté de צִדְקַת אָב.
    rationale: « La justice envers un père » impose le sens d’une conduite juste exercée à l’égard du père, alors que l’hébreu dit littéralement « justice d’un père » et peut aussi référer à la justice propre au père. Le contexte rend le premier sens plausible, mais ne justifie pas de supprimer l’autre.
  - severity: medium
    issue: La note rend inexactement la dernière proposition grecque.
    rationale: Le grec προσανοικοδομηθήσεταί σοι signifie littéralement qu’elle « sera bâtie pour toi » / « sera édifiée pour toi »; « sera ajoutée pour te bâtir » introduit un sens causatif et celui d’ajout qui ne sont pas exprimés.
  revised_text: La justice d’un père ne sera pas effacée[a] ; à la place des péchés, elle sera plantée.
