revisions:
- from: Même si un homme perd de son discernement, sois indulgent envers lui[a] et ne lui fais pas honte tous les jours de sa vie[b].
  to: Même si un homme manque de discernement, sois indulgent envers lui[a] et ne l’humilie jamais tant qu’il vit[b].
  rationale: La révision évite de présenter le manque de discernement comme nécessairement une perte progressive et clarifie en français que l'interdiction d'humilier vaut durant toute la vie de l'homme. Les notes conservent l'information lexicale et la variante grecque, sans ajouter de nuance absente des témoins.
