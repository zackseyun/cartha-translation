  text: Even if a man lacks understanding[a], be patient with him[b], and do not shame him all the days of his life.
translation:
  language: fr
  text: Même si un homme manque de discernement, sois indulgent envers lui[a] et ne l’humilie jamais tant qu’il vit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sois patient avec lui » ou « fais preuve d’indulgence envers lui ». Le grec éclaire l’expression comme un appel à la patience et à l’indulgence.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec porte : « de toute ta force ». Le texte principal suit l’hébreu : « tous les jours de sa vie ».'
    reason: textual_variant
lexical_decisions:
- source_word: וְגַם
  choice: Même si
  rationale: Dans ce contexte, la conjonction introduit une concession plutôt qu’un simple ajout; le grec κἂν confirme ce sens.
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom hébreu est masculin singulier. Cette traduction en conserve la forme tout en permettant une portée générale.
- source_word: יֶחְסַר מַדָּעוֹ
  choice: perd de son discernement
  rationale: L’hébreu évoque une diminution ou un manque de connaissance; dans le contexte du vieillissement, « perd de son discernement » est naturel sans préciser davantage la nature de ce déclin. Le grec σύνεσιν appuie le sens de compréhension ou de discernement.
- source_word: עֲזָב לוֹ
  choice: sois indulgent envers lui
  rationale: Le verbe hébreu peut exprimer l’idée de laisser ou de passer sur une faute. Le parallèle grec συγγνώμην ἔχε indique ici une attitude de patience et d’indulgence.
- source_word: וְאַל תַּכְלִים אוֹתוֹ
  choice: ne lui fais pas honte
  rationale: Cette tournure rend directement l’idée hébraïque de couvrir quelqu’un de honte ou de l’humilier, dans un français courant et digne.
- source_word: כָּל יְמֵי חַיָיו
  choice: tous les jours de sa vie
  rationale: Traduction proche de la formulation hébraïque, claire et naturelle en français.
