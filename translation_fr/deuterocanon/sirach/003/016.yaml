base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/016.yaml
  text: For one who despises his father is insolent[b][a], and one who provokes his mother is cursed by his Creator.
translation:
  language: fr
  text: Car celui qui méprise son père est présomptueux[a], et celui qui maudit sa mère irrite son Créateur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec dit : « est un blasphémateur ».'
    reason: alternative_reading
  - marker: b
    text: 'Le parallèle grec formule autrement cette proposition : « celui qui irrite sa mère est maudit par le Seigneur ».'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵזִיד
  choice: est présomptueux
  rationale: Le participe de זיד caractérise une conduite arrogante et délibérément hardie. « Est présomptueux » rend ce jugement moral sans lui donner le sens plus spécifiquement religieux de « blasphémateur » présent dans le parallèle grec.
- source_word: בּוֹזֶה אָבִיו
  choice: celui qui méprise son père
  rationale: בזה exprime le mépris ou le dédain; le suffixe de אָבִיו, « son père », est conservé.
- source_word: מְקַלֵּל אִמּוֹ
  choice: celui qui maudit sa mère
  rationale: La syntaxe hébraïque place ce groupe participial comme sujet de la seconde proposition. קלל signifie ici « maudire », et le suffixe de אִמּוֹ est explicitement rendu.
- source_word: מַכְעִיס בּוֹרְאוֹ
  choice: irrite son Créateur
  rationale: 'Le hifil de כעס signifie « mettre en colère, irriter ». בּוֹרְאוֹ désigne littéralement « son Créateur ». L’ordre français est réorganisé afin de rendre clairement la syntaxe hébraïque: celui qui maudit sa mère irrite son Créateur.'
theological_decisions:
- issue: Rapport syntaxique entre « irriter », « son Créateur » et « maudire sa mère »
  choice: celui qui maudit sa mère irrite son Créateur
  alternative: celui qui irrite sa mère est maudit par son Créateur
  rationale: Dans l’hébreu, מַכְעִיס régit בּוֹרְאוֹ (« irrite son Créateur »), tandis que מְקַלֵּל אִמּוֹ (« celui qui maudit sa mère ») constitue le sujet. Le parallèle grec présente une formulation différente, mais il ne doit pas remplacer la syntaxe claire du témoin hébreu prioritaire.
- issue: Désignation divine dans la seconde proposition
  choice: son Créateur
  alternative: le Seigneur
  rationale: Le témoin hébreu, ici clair et de haute confiance, porte explicitement בּוֹרְאוֹ, « son Créateur ». « Le Seigneur » appartient au parallèle grec et est signalé en note.
- issue: Force de מֵזִיד face au grec βλάσφημος
  choice: est présomptueux
  alternative: est un blasphémateur
  rationale: L’hébreu évoque avant tout l’arrogance présomptueuse; le grec accentue la qualification en parlant d’un blasphémateur. Le texte principal suit l’hébreu et la note conserve la tension entre les témoins.
translation_notes:
  register: Français international moderne, sobre et digne. « Présomptueux » conserve la force morale du terme hébreu; « irrite » exprime naturellement la valeur causative de כעס. Les deux propositions restent parallèles, sans sacrifier la syntaxe propre du second membre.
