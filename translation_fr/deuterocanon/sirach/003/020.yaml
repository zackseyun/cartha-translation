base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/020.yaml
  text: For the mercies of God are many[b][a], and to the humble he reveals his secret.
translation:
  language: fr
  text: Car les marques de compassion de Dieu sont nombreuses, et il révèle son secret[b] aux humbles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Car grande est la puissance souveraine du Seigneur, et il est glorifié par les humbles. » Le témoin hébreu diffère ici sensiblement du grec.'
    reason: alternative_reading
  - marker: b
    text: Ou « son conseil confidentiel ». Le mot hébreu peut désigner un secret partagé dans l’intimité, et non seulement une information cachée.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים רַחֲמֵי אֱלֹהִים
  choice: les marques de compassion de Dieu sont nombreuses
  rationale: Cette formulation conserve la pluralité et l’abondance exprimées par l’hébreu tout en évitant le tour peu naturel « les compassions sont nombreuses ». « Dieu » traduit explicitement אֱלֹהִים.
- source_word: לַעֲנָוִים
  choice: aux humbles
  rationale: « Les humbles » rend naturellement la portée morale et sociale de ענוים dans la littérature de sagesse, sans la nuance plus étroite ou traditionnelle que pourrait suggérer « les doux ».
- source_word: יְגַלֶּה
  choice: il révèle
  rationale: Le verbe exprime ici la divulgation de ce qui était caché ou confidentiel; « révèle » convient naturellement avec סוד.
- source_word: סוֹדוֹ
  choice: son secret
  rationale: « Son secret » est l’équivalent direct, mais סוד peut aussi désigner un conseil confidentiel ou une confidence; cette amplitude est signalée en note.
theological_decisions:
- issue: Divergence substantielle entre le témoin hébreu de Ben Sira et le parallèle grec
  choice: 'Suivre dans le texte principal l’hébreu : « Car les marques de compassion de Dieu sont nombreuses, et il révèle son secret aux humbles. »'
  alternative: 'Le grec porte : « Car grande est la puissance souveraine du Seigneur, et il est glorifié par les humbles. »'
  rationale: Lorsque l’hébreu de Siracide est conservé avec une forte assurance, il sert de texte principal. La forme grecque témoigne néanmoins d’une tradition sensiblement différente qui modifie le sens de l’ensemble du verset; elle est donc conservée en note plutôt qu’harmonisée ou omise.
translation_notes:
  register: Français international actuel, clair et digne. « Marques de compassion » restitue le pluriel hébreu de façon plus idiomatique que « compassions » ou « miséricordes », tandis que l’ordre de la seconde proposition reste naturel en français.
