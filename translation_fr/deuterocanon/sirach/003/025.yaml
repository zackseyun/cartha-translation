  text: A heavy heart will come to ruin in the end[b][a], and one who loves good things will be led by them.
translation:
  language: fr
  text: Un cœur lourd finira dans la ruine[b][a], et qui aime les bonnes choses sera conduit par elles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec porte : « un cœur dur sera accablé de mal à la fin ». L’hébreu dit littéralement : « un cœur lourd deviendra infect à sa fin ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « deviendra infect ». Le verbe hébreu signifie plus littéralement « sentir mauvais » ou « devenir pourri » et exprime ici une issue désastreuse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב כָּבֵד
  choice: un cœur lourd
  rationale: Rend littéralement l’hébreu, sans lui substituer « un cœur dur », lecture du parallèle grec. Dans ce contexte, l’expression peut désigner un être intérieur moralement ou spirituellement appesanti, et non simplement la tristesse.
- source_word: תִּבְאַשׁ
  choice: finira dans la ruine
  rationale: Le verbe signifie littéralement « sentir mauvais, devenir infect ou pourri ». Employé avec אַחֲרִיתוֹ, il annonce ici une issue désastreuse; cette formulation française naturelle en communique la portée tout en signalant le sens concret en note.
- source_word: אַחֲרִיתוֹ
  choice: finira
  rationale: Intègre de façon idiomatique la notion de fin ou d’issue exprimée par le nom hébreu, sans imposer le référent personnel « sa fin ».
- source_word: וְאֹוהֵב טוֹבוֹת
  choice: et qui aime les bonnes choses
  rationale: Conserve l’ouverture sémantique du pluriel hébreu טוֹבוֹת, qui peut évoquer des biens, des bienfaits ou des choses agréables, sans préciser indûment.
- source_word: יִנְהַג בָּהֶם
  choice: se laissera conduire par elles
  rationale: נהג exprime l’action de mener ou de conduire. La tournure pronominale rend naturellement l’idée que la conduite de cette personne sera orientée par les bonnes choses qu’elle aime.
theological_decisions:
- issue: Le « cœur lourd » hébreu face au « cœur dur » grec
  choice: Traduire le témoin hébreu par « un cœur lourd » dans le texte principal.
  alternative: « un cœur dur »
  rationale: L’hébreu conservé est ici le témoin principal. Le grec peut refléter une Vorlage différente ou une interprétation; sa formulation est donc conservée en note afin de ne pas effacer la tension entre les témoins.
- issue: Sujet générique du proverbe
  choice: Employer « qui aime » sans pronom masculin.
  alternative: « celui qui aime »
  rationale: Le propos est générique et ne vise pas spécifiquement un homme; la formulation retenue est naturelle en français moderne et préserve cette portée générale.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Un cœur lourd » conserve l’image inhabituelle de l’hébreu; « finira dans la ruine » rend son aboutissement de façon claire et digne. Les marqueurs [b][a] suivent immédiatement la proposition concernée.
