  text: Many are lofty and renowned[a], but mysteries are revealed to the gentle.
translation:
  language: fr
  text: Nombreux sont ceux qui sont haut placés et renommés, mais des mystères sont révélés aux doux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux personnes pleines de mansuétude » ou « aux débonnaires ». Selon le contexte, « aux humbles » est aussi possible. Le grec πραέσιν désigne des personnes douces ou débonnaires.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Beaucoup
  rationale: L’adjectif pluriel est employé substantivement. « Beaucoup » conserve la concision et la force proverbiale du grec sans ajouter un nom absent du texte.
- source_word: ὑψηλοὶ
  choice: haut placés
  rationale: Le terme signifie littéralement « élevés » ou « hauts » et désigne ici vraisemblablement le rang ou le statut. « Haut placés » exprime ce sens naturellement en français moderne.
- source_word: ἐπίδοξοι
  choice: renommés
  rationale: Le mot évoque ceux qui jouissent d’une réputation ou d’un prestige public. « Renommés » restitue clairement cette idée.
- source_word: πραέσιν
  choice: aux personnes douces
  rationale: Le datif pluriel désigne des personnes caractérisées par la douceur, la mansuétude ou l’absence d’arrogance. Cette formulation est claire en français et évite de confondre explicitement douceur et humilité.
- source_word: ἀποκαλύπτεται
  choice: sont révélés
  rationale: Le présent passif est conservé et ne précise pas qui révèle. Malgré la forme verbale grecque au singulier, l’accord français se fait avec le sujet pluriel « des mystères ».
- source_word: μυστήρια
  choice: des mystères
  rationale: Le pluriel désigne des réalités cachées ou secrètes. « Mystères » en préserve la densité et l’ambiguïté sans explicitation indue.
theological_decisions:
- issue: 'Sens de πραέσιν : douceur, mansuétude ou humilité'
  choice: aux personnes douces
  alternative: aux personnes humbles ; aux personnes pleines de mansuétude
  rationale: πραΰς décrit d’abord une disposition douce, paisible et non agressive, même si le contraste avec les personnes haut placées peut suggérer l’humilité. Le texte principal conserve le sens lexical central, tandis que la note signale les nuances possibles.
- issue: Agent implicite de la révélation
  choice: maintien du passif sans nommer l’agent
  alternative: Dieu révèle des mystères aux personnes douces
  rationale: Le grec ne nomme pas l’auteur de la révélation. Même si un agent divin peut être compris dans le contexte sapientiel, l’ajouter résoudrait une implicitation que le texte laisse ouverte.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « haut placés » rend le statut social plus clairement que le littéral « élevés » ; le passif et l’ambiguïté concernant l’auteur de la révélation sont préservés.
