  text: In the day of distress it will be remembered for your benefit; like heat upon frost[a], your sins will be blotted out.
translation:
  language: fr
  text: Au jour de la détresse, on s’en souviendra en ta faveur ; comme la chaleur sur le givre[a], tes péchés seront effacés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « comme le beau temps sur le givre, ainsi tes péchés se dissoudront ». L’hébreu lit « la chaleur sur le givre ». Dans les deux cas, l’image est celle du givre qui disparaît.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹם צָרָה
  choice: Au jour de la détresse
  rationale: צָרָה désigne la détresse, l’épreuve ou le malheur. Cette formulation garde la gravité et la structure temporelle de l’hébreu dans un français digne et naturel.
- source_word: תִּזָּכֵר לָךְ
  choice: elle sera rappelée en ta faveur
  rationale: Le féminin singulier renvoie vraisemblablement à l’action juste évoquée dans le contexte, notamment la piété filiale. לָךְ est compris comme un datif d’avantage. Le pronom « elle » préserve cette reprise grammaticale sans préciser davantage l’antécédent.
- source_word: כְּחֹם עַל כְּפוֹר
  choice: comme la chaleur sur le givre
  rationale: L’hébreu présente l’image concrète de la chaleur (חֹם) agissant sur le givre (כְּפוֹר). « Givre » rend ici plus naturellement que « gel » la matière qui disparaît sous l’effet de la chaleur.
- source_word: לְהַשְׁבִּית עֲוֹנֶיךָ
  choice: tes péchés seront effacés
  rationale: Le verbe causatif לְהַשְׁבִּית exprime le fait de faire cesser ou disparaître. « Seront effacés » traduit clairement la suppression des péchés sans transformer le verbe en « fondre », image seulement implicite dans la comparaison précédente. עָוֹן peut désigner la faute et sa culpabilité ; « péchés » convient au registre courant.
theological_decisions:
- issue: Rapport entre la piété filiale rappelée en faveur de la personne et l’effacement des péchés
  choice: Maintenir côte à côte le souvenir favorable de l’acte et l’effacement des péchés, sans expliquer leur mécanisme doctrinal.
  alternative: Interpréter explicitement l’honneur rendu aux parents comme une expiation méritoire, ou réduire la promesse à une simple aide providentielle dans l’épreuve.
  rationale: Le verset associe réellement l’acte rappelé en faveur de la personne à la disparition de ses péchés. La traduction conserve cette tension propre à la sagesse de Ben Sira sans lui imposer une théologie systématique ultérieure.
translation_notes:
  register: Français international moderne, clair et soutenu. Le tutoiement singulier correspond aux formes hébraïques. Le point-virgule conserve l’articulation poétique entre le souvenir favorable et l’image du givre.
