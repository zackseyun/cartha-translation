  text: My son[a], be strong in honoring your father, and do not forsake him all the days of your life.
translation:
  language: fr
  text: Mon fils[a], persévère à honorer ton père et ne l’abandonne pas tant que tu vivras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « Mon enfant, soutiens ton père dans sa vieillesse et ne lui cause pas de peine durant sa vie. »'
    reason: 'Variante ancienne substantielle : le grec précise la vieillesse du père et parle de ne pas l’attrister, là où l’hébreu exhorte à persévérer dans l’honneur et à ne pas l’abandonner.'
lexical_decisions:
- source_word: בְּנִי
  choice: Mon fils
  rationale: Le vocatif hébreu, masculin singulier, porte le ton paternel propre à l’enseignement sapientiel. Le grec emploie un terme plus large, « enfant », mais l’hébreu est ici le témoin principal.
- source_word: הִתְחַזֵּק בִּכִבּוּד
  choice: persévère à honorer
  rationale: L’impératif réfléchi de חזק exprime la fermeté ou l’effort soutenu, tandis que כיבוד désigne l’action d’honorer. Cette formulation française naturelle conserve l’idée d’une fidélité résolue et durable.
- source_word: אָבִיךָ
  choice: ton père
  rationale: Équivalent direct du nom avec suffixe possessif de deuxième personne du masculin singulier.
- source_word: וְאַל תַּעַזְבֵהוּ
  choice: et ne l’abandonne pas
  rationale: עזב peut signifier laisser ou abandonner. « Ne l’abandonne pas » rend clairement la portée morale et concrète de l’exhortation filiale.
- source_word: כָּל יְמֵי חַיֶּיךָ
  choice: tant que tu vivras
  rationale: Rend naturellement en français l’idiome hébreu « tous les jours de ta vie » sans en réduire la portée, qui est celle d’une obligation durant toute la vie.
theological_decisions:
- issue: Divergence entre le texte hébreu et le parallèle grec
  choice: 'Suivre dans le texte principal l’hébreu : persévérer à honorer son père et ne pas l’abandonner.'
  alternative: 'Suivre le grec : soutenir son père dans sa vieillesse et ne pas lui causer de peine durant sa vie.'
  rationale: Le texte hébreu conservé est le témoin principal et présente ici une formulation cohérente. Le grec apporte toutefois une variante ancienne substantielle, peut-être issue d’une interprétation ou d’un Vorlage différent; elle est donc conservée en note sans être fondue dans le texte principal.
translation_notes:
  register: Français international moderne, digne et accessible. « Persévère à honorer » évite le calque peu naturel « sois fort dans l’honneur de » tout en gardant l’idée hébraïque de fermeté. Le tutoiement singulier correspond à l’adresse sapientielle « Mon fils ».
