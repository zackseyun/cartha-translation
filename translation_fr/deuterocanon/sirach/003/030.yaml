  text: Water extinguishes a blazing fire[b][a]; so almsgiving makes atonement for sin.
translation:
  language: fr
  text: L’eau éteint un feu ardent ; de même, l’aumône[a] expie le péché[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la charité » ; l’hébreu צדקה peut aussi signifier « la justice », mais le parallèle grec porte « aumône » (ἐλεημοσύνη), probablement le sens visé ici.
    reason: lexical_alternative
  - marker: b
    text: Le grec porte « les péchés » au pluriel. Le singulier hébreu « le péché » peut être compris dans un sens général.
    reason: alternative_reading
lexical_decisions:
- source_word: אש לוהטת
  choice: un feu ardent
  rationale: L’expression hébraïque désigne un feu qui brûle avec intensité. « Un feu ardent » restitue naturellement cette image, confirmée par le grec φλογιζόμενον.
- source_word: יכבו מים
  choice: L’eau éteint
  rationale: Le verbe כבה signifie éteindre un feu. Le pluriel hébreu מים désigne collectivement l’eau ; le singulier français convient au style proverbial.
- source_word: כן
  choice: de même
  rationale: Ce terme établit une comparaison directe entre les deux membres du proverbe. « De même » rend clairement le rapport analogique.
- source_word: צדקה
  choice: l’aumône
  rationale: צדקה peut signifier « justice », mais désigne ici vraisemblablement l’aide concrète accordée aux pauvres. Le parallèle grec ἐλεημοσύνη confirme le sens d’« aumône » ou d’acte de miséricorde.
- source_word: תכפר
  choice: expie
  rationale: Le piel de כפר exprime l’expiation. « Expie » conserve la force théologique du texte sans la remplacer par une paraphrase plus faible comme « compense » ou « fait pardonner ».
- source_word: חטאת
  choice: le péché
  rationale: Le nom désigne ici le péché ou la faute, non un sacrifice pour le péché. Le singulier hébreu peut avoir une valeur générique.
theological_decisions:
- issue: Sens de צדקה associé au langage de l’expiation
  choice: « l’aumône expie le péché »
  alternative: « la justice expie le péché »
  rationale: Même si צדקה peut désigner la justice au sens large, le grec ἐλεημοσύνη et l’usage de Ben Sira orientent vers l’aide matérielle aux nécessiteux. Le verbe « expie » maintient, sans l’atténuer ni l’expliquer davantage, l’affirmation théologique propre au verset.
translation_notes:
  register: Français moderne, clair et digne, avec une structure proverbiale concise. Le point-virgule marque les deux membres parallèles, et « de même » rend explicite leur comparaison.
