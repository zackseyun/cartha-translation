base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/021.yaml
  text: Do not seek what is too wondrous for you[a], and do not search out what is hidden from you.
translation:
  language: fr
  text: Ne cherche pas ce qui est trop merveilleux pour toi[a], et ne cherche pas à découvrir ce qui t’est caché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, en suivant de plus près le parallèle grec : « Ne cherche pas ce qui est plus difficile que toi, et n’examine pas ce qui est plus fort que toi. » L’hébreu insiste sur ce qui est trop merveilleux et caché ; le grec, sur ce qui dépasse tes capacités.'
    reason: alternative_reading
lexical_decisions:
- source_word: פְּלָאוֹת
  choice: ce qui est trop merveilleux
  rationale: Le pluriel de פלא désigne des réalités extraordinaires ou merveilleuses. Avec מִמְּךָ et à la lumière du parallèle grec, il évoque ici ce qui dépasse la portée ou la capacité de la personne, sans perdre l’image hébraïque.
- source_word: מִמְּךָ
  choice: pour toi
  rationale: Littéralement « de toi », l’expression marque idiomatiquement ce qui dépasse la sphère ou la capacité de quelqu’un. « Trop merveilleux pour toi » rend naturellement cette valeur comparative en français.
- source_word: אַל תִּדְרוֹשׁ
  choice: ne cherche pas
  rationale: דרש peut signifier chercher, consulter ou s’enquérir. « Ne cherche pas » conserve la concision et la force de l’interdiction sans préciser indûment la forme de la recherche.
- source_word: וּמְכֻסֶּה מִמְּךָ
  choice: ce qui t’est caché
  rationale: Le participe de כסה signifie « couvert, dissimulé ». Cette formulation française est naturelle et conserve l’idée qu’une réalité demeure soustraite à la connaissance du destinataire.
- source_word: אַל תַּחְקוֹר
  choice: ne cherche pas à découvrir
  rationale: חקר exprime une recherche approfondie visant à pénétrer ou élucider une chose. « Chercher à découvrir » marque une investigation plus poussée que le simple « chercher » du premier membre.
- source_word: χαλεπότερά σου / ἰσχυρότερά σου
  choice: appui sémantique pour « trop merveilleux pour toi »
  rationale: Le grec, « ce qui est plus difficile que toi / plus fort que toi », n’est pas identique au texte hébreu, mais confirme l’idée de réalités qui dépassent les capacités humaines.
theological_decisions:
- issue: Le verset interdit-il toute recherche sur les mystères divins, ou met-il en garde contre ce qui dépasse la portée humaine ?
  choice: Une mise en garde sapientielle contre la recherche de réalités qui dépassent la portée de la personne ou qui ne lui sont pas dévoilées
  alternative: Une interdiction générale de toute recherche théologique, ou seulement une condamnation de la spéculation orgueilleuse
  rationale: L’hébreu insiste sur ce qui est « trop merveilleux » et « caché » à la personne, tandis que le grec parle de ce qui est plus difficile ou plus fort qu’elle. La traduction maintient cet appel à l’humilité sans transformer le verset en interdiction absolue de toute recherche.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme des deux interdictions est conservé, avec une légère progression de « chercher » vers « chercher à découvrir ». Le tutoiement singulier reflète les formes hébraïques de deuxième personne.
