base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/006.yaml
  text: Many have been ruined by gold[a], and by trusting in pearls; they did not find escape from evil[b], nor deliverance on the day of wrath.
translation:
  language: fr
  text: Beaucoup ont été ruinés par l’or, et celui qui se fie aux perles[a] l’a été aussi. Ils n’ont trouvé aucun moyen d’échapper au mal[b], ni d’être délivrés au jour de la fureur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut désigner des « perles », mais aussi, plus largement, des pierres ou objets précieux.
    reason: lexical_alternative
  - marker: b
    text: 'Le témoin grec diffère fortement ici : « À moins que cela ne soit envoyé par le Très-Haut lors d’une visitation, n’y attache pas ton cœur. » Le texte principal suit l’hébreu, qui affirme plutôt que la confiance placée dans les richesses ne permet d’échapper ni au mal ni au jour de la fureur.'
    reason: textual_variant
lexical_decisions:
- source_word: חבולי
  choice: ont été ruinés
  rationale: Le terme évoque littéralement des personnes blessées ou meurtries. Dans ce contexte, où l’or cause leur chute, « ruinés » exprime naturellement les dommages profonds, matériels et moraux, sans réduire le sens à une blessure physique.
- source_word: זהב
  choice: l’or
  rationale: Équivalent direct; l’or représente ici une richesse sur laquelle on risque de fonder sa sécurité.
- source_word: והבוטח על
  choice: tout comme celui qui met sa confiance dans
  rationale: L’hébreu passe brusquement du pluriel (« beaucoup ») à un participe singulier (« celui qui se confie »). Cette formulation conserve ce changement de nombre au lieu de l’effacer, tout en rendant le lien elliptique compréhensible en français.
- source_word: פנינים
  choice: les perles
  rationale: « Perles » est un sens traditionnel et défendable, mais le mot peut désigner plus largement des objets précieux, d’où la note.
- source_word: ולא מצאו להנצל מרעה
  choice: Ils n’ont trouvé aucun moyen d’échapper au mal
  rationale: Cette tournure restitue l’idée qu’ils n’ont pas réussi à obtenir l’évasion ou la délivrance recherchée. « Mal » maintient l’ambivalence entre mal moral, malheur et calamité.
- source_word: להושע
  choice: être délivrés
  rationale: Le verbe désigne le fait d’être sauvé ou secouru. « Être délivrés » garde la force du secours attendu sans imposer ici une lecture doctrinale plus étroite.
- source_word: ביום עברה
  choice: au jour de la fureur
  rationale: עברה désigne une colère débordante ou une fureur, souvent dans un contexte de jugement. « Au jour de la fureur » conserve la gravité et la coloration biblique de l’expression.
theological_decisions:
- issue: Choix du texte principal face à une divergence majeure entre l’hébreu et le grec
  choice: Suivre le témoin hébreu conservé dans le texte principal et signaler intégralement la leçon grecque en note.
  alternative: 'Traduire le grec : « À moins que cela ne soit envoyé par le Très-Haut lors d’une visitation, n’y attache pas ton cœur. »'
  rationale: Puisque le texte hébreu est conservé ici avec une confiance élevée, il constitue la base de la traduction. La divergence grecque est toutefois substantielle et doit rester visible afin de ne pas donner une fausse impression d’unanimité textuelle.
- issue: Nature du mal auquel les riches n’échappent pas
  choice: Conserver le terme général « mal » et le langage du « jour de la fureur ».
  alternative: Préciser « calamité » ou interpréter explicitement l’expression comme le jugement divin final.
  rationale: L’hébreu évoque fortement un contexte de jugement, mais ne définit pas avec précision le mal ni la portée temporelle du jour mentionné. La traduction préserve donc cette tension sans la transformer en affirmation doctrinale plus précise.
translation_notes:
  register: Français international actuel, digne et accessible. Le léger relief biblique de « au jour de la fureur » est maintenu. La rupture hébraïque entre le pluriel « beaucoup » et le singulier « celui qui » est conservée de manière intelligible plutôt que nivelée.
