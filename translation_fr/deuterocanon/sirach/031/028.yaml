  text: In all your deeds be modest[a], and no disaster will touch you.
translation:
  language: fr
  text: Dans tout ce que tu fais, sois modeste[a], et aucun malheur ne t’atteindra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente ici un texte très différent : « L’un bâtit et l’autre démolit : qu’ont-ils gagné, sinon des peines ? » Le présent verset est traduit d’après l’hébreu conservé, qui diffère nettement de la tradition grecque.'
    reason: textual_variant
lexical_decisions:
- source_word: בכל מעשיך
  choice: Dans tout ce que tu fais
  rationale: Cette formulation naturelle en français exprime la totalité des actes et de la conduite visée par l’hébreu, sans la raideur de « dans toutes tes œuvres ».
- source_word: היה
  choice: sois
  rationale: L’impératif de היה suivi d’un adjectif se rend directement et naturellement par « sois ».
- source_word: צנוע
  choice: modeste
  rationale: Le terme évoque la modestie, la réserve et une conduite mesurée. « Modeste » conserve cette amplitude sans imposer exclusivement le sens spirituel de « humble ».
- source_word: אסון
  choice: malheur
  rationale: אסון désigne un malheur grave, une calamité ou un désastre. « Malheur » convient au registre sapientiel et reste assez large pour ne pas préciser indûment la nature de l’atteinte.
- source_word: לא יגע בך
  choice: ne t’atteindra
  rationale: נגע signifie littéralement toucher ou atteindre. « Ne t’atteindra » conserve l’image d’un malheur qui parvient jusqu’à quelqu’un tout en étant idiomatique en français.
- source_word: εἷς οἰκοδομῶν καὶ εἷς καθαιρῶν, τί ὠφέλησαν πλεῖον ἢ κόπους;
  choice: signalé seulement comme variante textuelle
  rationale: Le grec présente une leçon profondément différente. Puisque l’hébreu est ici conservé avec une confiance élevée, il fonde le texte principal; la tradition grecque doit néanmoins être donnée en note.
