  text: A poor man labors until his strength is spent, and if he rests, he is still in need.
translation:
  language: fr
  text: Le pauvre peine alors que ses forces diminuent[a] ; s’il se repose, il ne trouve pas de repos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Une leçon hébraïque alternative porte : « Le pauvre peine pour son foyer ; s’il se repose, il sera dans le besoin. »'
    reason: La source hébraïque composite fournie transmet cette variante avant la leçon marquée pour le v. 4. La note distingue les deux formulations sans les harmoniser.
lexical_decisions:
- source_word: עמל עני
  choice: Le pauvre peine
  rationale: « Peiner » rend le travail pénible exprimé par עמל dans un français naturel et digne.
- source_word: לחסר כחו
  choice: jusqu’à épuiser ses forces
  rationale: La construction exprime ici la diminution ou l’épuisement de la force ; cette formulation conserve le sens sans calquer maladroitement l’hébreu.
- source_word: יהיה צריך / לא נחה לו
  choice: il reste dans le besoin
  rationale: La leçon parallèle décrit le besoin persistant lorsque le pauvre cesse de travailler. « Rester dans le besoin » est idiomatique et préserve le contraste.
theological_decisions:
- issue: Rapport entre travail, repos et pauvreté
  choice: 'Présenter sans ajout le dilemme du pauvre : le travail l’épuise, mais le repos le laisse dans le besoin.'
  alternative: Interpréter le verset comme une condamnation morale de l’oisiveté.
  rationale: Le texte formule une observation sapientielle sur la condition économique du pauvre et n’attribue explicitement aucune faute morale à son repos.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le point-virgule met en relief le contraste entre l’épuisement causé par le travail et le besoin qui persiste au repos. Le grec transmis pour cette référence présente un contenu entièrement différent ; compte tenu de la haute confiance accordée au texte hébreu composite et de son accord avec la couche anglaise auditée, la traduction suit ici l’hébreu.
