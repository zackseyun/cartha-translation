  text: For because of every matter the eye trembles[a], and from the face tears will flow.
translation:
  language: fr
  text: Car, à cause de toute chose, l’œil tremble[a], et du visage coule une larme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu conservé diffère fortement de la tradition grecque, qui lit : « Celui qui craint le Seigneur ne craindra certainement pas et ne sera pas lâche, car lui-même est son espérance. » Le texte principal suit le témoin hébreu existant.'
    reason: textual_variant
lexical_decisions:
- source_word: כי זה
  choice: Car
  rationale: La tournure hébraïque est elliptique et difficile. « Car » conserve sa valeur explicative sans reproduire artificiellement en français le redoublement causal possible.
- source_word: מפני כל דבר
  choice: à cause de toute chose
  rationale: מפני peut exprimer la cause ou la présence (« à cause de », « devant »), tandis que דבר peut désigner une chose, une affaire ou une parole. Cette formulation garde la portée générale et une part de l’ambiguïté du texte.
- source_word: תזוע עין
  choice: l’œil tremble
  rationale: Le verbe זוע évoque un mouvement de tremblement ou d’ébranlement. Le singulier concret « l’œil » reprend l’image vive de l’hébreu.
- source_word: ומפנים
  choice: et du visage
  rationale: פנים signifie littéralement « visage ». L’expression est conservée au lieu d’être normalisée en « des yeux » ou « sur les joues ».
- source_word: דמעה תדמע
  choice: coulent les larmes
  rationale: L’association emphatique du nom et du verbe apparentés ne peut être reproduite naturellement mot à mot. « coulent les larmes » restitue l’image des pleurs tout en gardant l’ordre marqué introduit par « du visage ».
theological_decisions:
- issue: Divergence majeure entre le texte hébreu conservé et la tradition grecque
  choice: Le texte principal traduit le témoin hébreu conservé.
  alternative: 'Suivre le grec : « Celui qui craint le Seigneur ne sera certainement pas intimidé ni effrayé, car il est son espérance. »'
  rationale: Les deux traditions présentent ici des textes substantiellement différents et ne doivent pas être harmonisées. Puisque l’hébreu est conservé, il sert de texte principal; la leçon grecque est signalée intégralement en note.
translation_notes:
  register: Français moderne, sobre et proverbial. La syntaxe légèrement marquée (« du visage coulent les larmes ») préserve le parallélisme et l’image corporelle de l’hébreu sans rendre la phrase incompréhensible.
