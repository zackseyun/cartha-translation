  text: Years of life are with a discerning man[a]; he will lie down until morning[b], and his life is with him.
translation:
  language: fr
  text: De longues années de vie accompagnent l’homme avisé ; il passera la nuit jusqu’au matin et aura la vie sauve[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le mot hébreu rendu par « vie » peut aussi signifier « personne » ou « âme ». Le grec présente ici une leçon entièrement différente : « Celui qui prive son prochain de ses moyens d’existence le tue. » Il semble témoigner d’une autre forme du texte ; le texte principal suit donc l’hébreu.'
    reason: lexical_alternative_and_textual_variant
lexical_decisions:
- source_word: שנות חיים
  choice: Des années de vie
  rationale: Cette formulation conserve l’expression hébraïque sans la transformer explicitement en promesse de « longue vie ».
- source_word: איש נבון
  choice: l’homme intelligent
  rationale: נבון désigne une personne douée d’intelligence et de discernement. Le singulier masculin איש est conservé.
- source_word: ילין עד בקר
  choice: il passera la nuit jusqu’au matin
  rationale: Le verbe לין évoque le fait de passer la nuit ou de demeurer pour la nuit ; cette tournure est naturelle en français et garde l’image nocturne.
- source_word: ונפשו עמו
  choice: et sa vie demeure avec lui
  rationale: נפש peut désigner la vie, la personne ou l’âme. Dans ce contexte de préservation jusqu’au matin, « vie » est le sens le plus probable, tandis que « demeure » rend explicite l’état continu impliqué par la proposition nominale.
- source_word: φονεύων τὸν πλησίον ὁ ἀφαιρούμενος συμβίωσιν
  choice: témoin de contrôle signalé en note, non suivi dans le texte principal
  rationale: Le grec présente une leçon radicalement différente, relative au meurtre du prochain par la privation de ses moyens d’existence. Puisque le texte hébreu est ici attesté avec une confiance élevée, il gouverne la traduction.
theological_decisions:
- issue: Sens anthropologique de נפש
  choice: la vie demeure avec lui
  alternative: son âme est avec lui
  rationale: Le mot נפש possède un champ sémantique plus large que le français théologique « âme ». Le contexte favorise ici la conservation de la vie, sans imposer une anthropologie dualiste.
- issue: Divergence entre les témoins hébreu et grec
  choice: suivre le témoin hébreu dans le texte principal
  alternative: 'traduire la leçon grecque : « Celui qui prive son prochain de ses moyens d’existence le tue »'
  rationale: La leçon grecque ne correspond pas matériellement à l’hébreu transmis. La priorité revient au témoin hébreu extant, tandis que la divergence majeure est documentée en note.
translation_notes:
  register: Français international actuel, digne et lisible. La tournure légèrement sentencieuse préserve la concision poétique de l’hébreu. Le marqueur [a] figure dans le texte principal et regroupe la variante grecque majeure ainsi que l’ambiguïté de נפש.
