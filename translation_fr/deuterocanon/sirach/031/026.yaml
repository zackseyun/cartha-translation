revisions:
- from: Des années de vie sont accordées à l’homme intelligent ; il passera la nuit jusqu’au matin, et sa vie demeure avec lui.[a]
  to: De longues années de vie accompagnent l’homme avisé ; il passera la nuit jusqu’au matin et aura la vie sauve[a].
  rationale: La révision remplace des formulations françaises moins naturelles ou plus interprétatives par une expression proverbiale fluide. « De longues années de vie » restitue le sens de שנות חיים sans prétendre que l’hébreu formule explicitement une promesse théologique. « Homme avisé » rend le discernement de נבון. « Aura la vie sauve » donne une équivalence idiomatique de ונפשו עמו dans ce contexte, tandis que la note conserve l’ambiguïté de נפש et documente la divergence radicale du grec.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T11:00:45Z'
review_pass:
  verdict: revise
  source_fidelity: 'La traduction suit bien le témoin hébreu : שנות חיים, איש נבון, ילין עד בקר et ונפשו עמו. Toutefois, « accordées » introduit une idée de don qui n’est pas exprimée, et « demeure » ajoute une nuance verbale absente de la proposition nominale finale.'
  naturalness: « Des années de vie sont accordées à l’homme intelligent » est un peu lourd et « sa vie demeure avec lui » n’est pas idiomatique en français actuel. Une formulation sentencieuse plus naturelle peut conserver la concision du texte.
  terminology: « Homme avisé » rend mieux איש נבון que « homme intelligent », qui évoque plus spontanément la capacité intellectuelle générale que le discernement. « Vie » convient pour נפש ici, avec une note qui maintient les autres possibilités lexicales.
  issues:
  - severity: medium
    issue: « accordées » n’est pas dans l’hébreu.
    rationale: La préposition עם (« avec ») ne comporte pas l’idée explicite d’une attribution ou d’un don. Il vaut mieux ne pas l’ajouter.
  - severity: medium
    issue: « sa vie demeure avec lui » est à la fois peu naturel et légèrement explicatif.
    rationale: ונפשו עמו est littéralement une proposition nominale, « sa vie est avec lui ». En français, « il a la vie sauve » exprime naturellement la préservation de la vie suggérée par le contexte, sans imposer le sens théologique d’« âme ».
  - severity: low
    issue: Le marqueur de note est trop éloigné du terme ambigu.
    rationale: La note explique d’abord le sens de נפש ; son ancrage doit donc suivre « vie » dans le texte principal.
