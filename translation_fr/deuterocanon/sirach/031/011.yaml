base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/011.yaml
  text: Who was tested by it and was found complete? Let it be for him a boast[a]. Who was able to transgress and did not transgress[b], and to do evil and did not desire it?
translation:
  language: fr
  text: Qui a été mis à l’épreuve par elle et s’est montré intègre ? Qu’il en tire gloire[a]. Qui pouvait s’écarter du droit chemin sans le faire[b], faire le mal sans y consentir ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le premier membre est difficile en hébreu. Le texte transmis peut aussi se comprendre plus littéralement : « Qui l’a béni, et il a été intègre durant sa vie ? Il est pour toi une gloire. » Le contexte favorise toutefois l’idée d’une personne mise à l’épreuve et reconnue intègre.'
    reason: textual_variant
  - marker: b
    text: 'Plus littéralement : « Qui pouvait s’écarter et ne s’est pas écarté, faire du tort et n’y a pas consenti ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: מי
  choice: Qui
  rationale: Conserve l’ouverture interrogative et la structure rhétorique de l’hébreu.
- source_word: ברכו
  choice: a été mis à l’épreuve par elle
  rationale: Le texte hébreu transmis est difficile. Dans le contexte de l’épreuve que constitue la richesse, cette lecture rend le sens probable sans dissimuler l’incertitude textuelle, signalée en note.
- source_word: וישלם בחייו
  choice: et s’est montré intègre
  rationale: שלם exprime ici l’intégrité morale éprouvée plutôt que la simple paix; « s’est montré » communique l’idée d’un caractère reconnu à l’épreuve.
- source_word: הוא לך לתפארת
  choice: Qu’il en tire gloire !
  rationale: La formulation hébraïque et son pronom sont instables. Cette traduction conserve la valeur honorifique et laudative du membre de phrase sans imposer une reconstruction trop précise.
- source_word: יוכל לסור ולא סר
  choice: pouvait s’écarter du droit chemin et ne l’a pas fait
  rationale: סור signifie littéralement « s’écarter ». L’ajout idiomatique « du droit chemin » explicite sobrement sa portée éthique, tandis que la note conserve la formulation plus littérale.
- source_word: ולהרע רעה
  choice: faire le mal
  rationale: Rend naturellement l’infinitif accompagné de son objet apparenté, avec sa portée morale.
- source_word: ולא אבה
  choice: et ne l’a pas voulu
  rationale: אבה désigne la volonté ou le consentement; « ne l’a pas voulu » préserve l’idée d’un refus intérieur en français courant.
theological_decisions:
- issue: Usage du témoin hébreu malgré son instabilité et son écart important avec le parallèle grec
  choice: Traduire principalement le texte hébreu conservé, tout en laissant le contexte éclairer le premier membre comme une mise à l’épreuve suivie d’une intégrité reconnue.
  alternative: Traduire littéralement ברכו par « l’a béni », ou reconstruire le verset principalement d’après le grec.
  rationale: L’hébreu demeure le témoin source principal, mais sa difficulté réelle doit être indiquée. Le parallèle grec fourni diverge fortement et ne permet pas de résoudre avec certitude la ligne hébraïque; la note maintient donc ouverte la lecture littérale transmise.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition interrogative et la tension entre possibilité de mal agir et refus volontaire sont conservées. Les incertitudes du texte hébreu ne sont pas masquées.
