  text: '[And if they press you to eat[a], leave the banquet,] and you will find rest.'
translation:
  language: fr
  text: '[Et s’ils insistent pour que tu manges[a], éloigne-toi du banquet,] et tu trouveras du repos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dans l’édition hébraïque, les mots « Et s’ils insistent pour que tu manges, éloigne-toi du banquet » figurent entre crochets. Le parallèle grec donne à cet endroit : « Celui qui prive un salarié de son salaire est celui qui répand le sang », ce qui signale une importante divergence textuelle ou un décalage dans la numérotation des versets.'
    reason: textual_variant
lexical_decisions:
- source_word: ואם יפצירו בך לאכול
  choice: Et s’ils insistent pour que tu manges
  rationale: Le verbe יפצירו exprime une insistance pressante. Cette formulation française restitue naturellement la pression exercée sur la personne sans atténuer le sens.
- source_word: סור מן הסבה
  choice: éloigne-toi du banquet
  rationale: סור indique qu’il faut se retirer ou s’écarter. Dans ce contexte, הסבה désigne le repas pris en société, probablement en position allongée; « banquet » rend clairement la scène sans imposer le détail culturel de la posture.
- source_word: ותמצא נחת
  choice: et tu trouveras le repos
  rationale: נחת peut désigner le repos, l’aisance ou le soulagement. « le repos » reste proche de l’hébreu et exprime le calme obtenu en se retirant.
theological_decisions:
- issue: Clause hébraïque entre crochets et divergence majeure du parallèle grec
  choice: Traduire en texte principal l’hébreu conservé, tout en signalant par une note son statut incertain et la divergence grecque.
  alternative: 'Le grec parallèle dit : « Celui qui prive un salarié de son salaire est comme celui qui répand le sang. »'
  rationale: L’hébreu est la source prioritaire lorsqu’il est conservé, mais les crochets éditoriaux et l’absence de correspondance avec le grec exigent de préserver explicitement l’incertitude textuelle ou l’éventuel décalage de numérotation.
translation_notes:
  register: Français international moderne, naturel et digne. Tutoiement maintenu conformément au singulier hébreu. La syntaxe conditionnelle demeure claire, et la note rend compte sans la résoudre de la forte tension entre les témoins hébreu et grec.
