base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/010.yaml
  text: Who is this[a], He has been tested in these things and has become complete; and it will be for him a ground for boasting.
translation:
  language: fr
  text: Qui est celui[a] qui s’y est attaché ? Il a connu la paix, et cela a fait sa gloire. Car l’abondance de paix durant sa vie sera pour toi un sujet de gloire.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu de ce verset est difficile. On pourrait aussi traduire le début : « Qui est-il, celui qui y est resté attaché, et qui a connu la paix ? »'
    reason: alternative_reading
  - marker: b
    text: 'Le grec présente ici un texte très différent : « Celui qui n’a pas été éprouvé sait peu. » Il pourrait représenter une autre forme du texte.'
    reason: textual_variant
lexical_decisions:
- source_word: מי הוא זה
  choice: Qui est celui
  rationale: Conserve l’ouverture interrogative et rhétorique de l’hébreu dans un français naturel.
- source_word: שנדבק בו
  choice: qui s’y est attaché
  rationale: Rend directement le verbe hébreu דבק, « s’attacher à, rester uni à », sans lui substituer le motif grec de l’épreuve.
- source_word: והיה לו שלום
  choice: Il a connu la paix
  rationale: Exprime idiomatiquement en français le fait que la paix lui est échue, tout en conservant le terme שלום.
- source_word: והיה לו תפארה
  choice: cela a fait sa gloire
  rationale: תפארה désigne la gloire, l’honneur ou ce qui fait la fierté d’une personne; « gloire » maintient le lien lexical avec la proposition suivante.
- source_word: כי ברבות שלום חייו
  choice: Car l’abondance de paix durant sa vie
  rationale: Suit le texte hébreu composite tel qu’il est transmis, malgré une syntaxe difficile, et comprend חייו comme une indication temporelle liée à la paix.
- source_word: יהיה לך לתפארת
  choice: sera pour toi un sujet de gloire
  rationale: Préserve le passage inattendu à la deuxième personne et le sens de תפארת comme honneur ou gloire.
- source_word: ὃς οὐκ ἐπειράθη ὀλίγα οἶδεν
  choice: Celui qui n’a pas été éprouvé sait peu
  rationale: La forme grecque est conservée en note comme variante textuelle nettement différente, plutôt que fusionnée silencieusement avec l’hébreu.
theological_decisions:
- issue: Désaccord majeur entre le témoin hébreu et le parallèle grec
  choice: Le texte principal traduit le témoin hébreu fourni, y compris sa dernière proposition; une note donne le grec comme variante.
  alternative: Produire un texte éclectique combinant l’interrogation et la gloire de l’hébreu avec le motif grec de l’épreuve.
  rationale: Le témoin hébreu est donné avec une confiance élevée et contient des éléments absents du grec. Une fusion créerait une formulation qui ne correspond pleinement à aucun témoin. La présentation séparée préserve honnêtement l’incertitude textuelle.
- issue: Passage de la troisième à la deuxième personne dans יהיה לך
  choice: Conserver « pour toi ».
  alternative: Harmoniser en « pour lui » afin d’unifier la personne grammaticale.
  rationale: Le changement de personne appartient au texte hébreu fourni. Le corriger sans appui manuscrit résoudrait silencieusement une difficulté réelle.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation demeure proche de l’hébreu, tandis que les difficultés syntaxiques et la variante grecque sont signalées sans les harmoniser.
