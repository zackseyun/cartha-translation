  text: Even if you sit among many[b][a], do not reach out your hand before your companion.
translation:
  language: fr
  text: Même si tu es assis parmi de nombreuses personnes[b], ne tends pas la main avant ton compagnon[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'C’est-à-dire : ne te sers pas avant une autre personne à table.'
    reason: cultural_note
  - marker: b
    text: 'Le texte grec parallèle diffère fortement ici : il évoque « les railleries des impies », qui ne sont pas faites pour gagner la faveur. La traduction suit donc le témoin hébreu, tandis que le grec est signalé comme une tradition divergente.'
    reason: textual_variant
lexical_decisions:
- source_word: וגם אם
  choice: Même si
  rationale: Rend naturellement la valeur concessive de la locution hébraïque.
- source_word: בין רבים
  choice: parmi beaucoup de convives
  rationale: Le sens littéral est « parmi beaucoup »; « convives » explicite sobrement le cadre du repas indiqué par le geste de tendre la main, sans évoquer à tort une foule indistincte.
- source_word: ישבת
  choice: tu es assis
  rationale: Le parfait hébreu prend ici une valeur générale dans une instruction conditionnelle; le présent français convient au style proverbial.
- source_word: לפני
  choice: avant
  rationale: La préposition exprime ici la priorité dans l'action plutôt qu'une simple position spatiale.
- source_word: רע
  choice: ton compagnon
  rationale: Dans ce contexte de sagesse et de repas, רֵעַ désigne la personne qui partage la table, sans imposer le sens géographique moderne de « voisin ».
- source_word: אל תושיט יד
  choice: ne tends pas la main
  rationale: Traduction proche et idiomatique qui conserve l'image concrète de l'étiquette à table.
