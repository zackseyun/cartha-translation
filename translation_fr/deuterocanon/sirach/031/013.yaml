  text: My son[a], if you sit at a great table[b], do not open your throat over it.
translation:
  language: fr
  text: Mon fils, si tu t’assieds à une grande table, ne te montre pas avide de ce qui s’y trouve[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « n’ouvre pas ta gorge sur elle »; c’est une image qui met en garde contre l’avidité ou la gloutonnerie devant une table abondante.
    reason: lexical_alternative
  - marker: b
    text: Le texte grec indiqué comme parallèle pour ce verset ne correspond pas au texte hébreu et semble avoir été rattaché ici par erreur. La traduction suit donc le témoin hébreu.
    reason: textual_variant
lexical_decisions:
- source_word: בני
  choice: Mon fils
  rationale: Le vocatif avec suffixe de première personne est rendu explicitement et conserve le ton paternel propre à l’enseignement de sagesse.
- source_word: אם
  choice: si
  rationale: La conjonction introduit une condition générale; « si » évite de présenter la situation comme certaine, contrairement à « quand ».
- source_word: על שלחן גדול
  choice: à une grande table
  rationale: Cette formulation compacte conserve l’ambiguïté de גדול, qui peut évoquer la taille, l’abondance ou le rang social, sans réduire le sens à une table luxueuse ni à la table d’un personnage important.
- source_word: ישבת
  choice: tu t’assieds
  rationale: Bien que la forme hébraïque soit un accompli, la proposition conditionnelle de portée générale appelle naturellement le présent en français.
- source_word: אל תפתח
  choice: n’ouvre pas toute grande
  rationale: La défense et l’image concrète du verbe « ouvrir » sont maintenues; « toute grande » rend perceptible l’idée d’une ouverture excessive impliquée par l’avertissement.
- source_word: גרנך
  choice: ta gorge
  rationale: גרון désigne littéralement la gorge. Le choix préserve l’image vive de l’hébreu, tandis que « ton appétit » expliciterait l’idiome et « ta bouche » serait moins précis.
- source_word: עליו
  choice: devant elle
  rationale: Dans ce contexte, la préposition renvoie à la table et exprime l’attitude adoptée face à ce qui y est servi. « Devant elle » est plus naturel en français que le calque « sur elle », tout en laissant intacte l’image de la gorge avidement ouverte.
