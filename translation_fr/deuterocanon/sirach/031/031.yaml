base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/031.yaml
  text: Listen, my son, and accept my words; do not reject me, and in the end you will find my words.
translation:
  language: fr
  text: Écoute, mon fils, et reçois mes paroles ; ne te moque pas de moi, et, à la fin, tu trouveras mes paroles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et à la fin tu trouveras mes paroles ». L’expression peut suggérer qu’avec le temps tu en reconnaîtras la valeur ou le bien-fondé.'
    reason: Conserver la formulation hébraïque et son ambiguïté, tout en indiquant avec prudence son implication possible.
lexical_decisions:
- source_word: שמע
  choice: Écoute
  rationale: Rend directement l’impératif hébreu dans une formule naturelle d’exhortation.
- source_word: וקח אמרי
  choice: et accueille mes paroles
  rationale: לקח signifie littéralement « prendre » ; avec « paroles », « accueillir » exprime naturellement l’idée de recevoir et d’accepter l’enseignement.
- source_word: ואל תלעיז עליי
  choice: ne parle pas contre moi
  rationale: Le verbe לעז évoque le fait de parler contre quelqu’un, de le décrier ou de le tourner en dérision. Cette formulation sobre conserve cette latitude sans réduire le sens au seul rejet.
- source_word: ובאחרית תמצא דברי
  choice: et à la fin tu constateras la vérité de mes paroles
  rationale: Littéralement, « à la fin tu trouveras mes paroles ». En français, l’ajout explicatif « la vérité de » rend intelligible l’idée qu’avec le recul les paroles se révéleront fondées, tout en signalant la littéralité en note.
theological_decisions:
- issue: Écart majeur entre le texte hébreu et le parallèle grec fourni
  choice: Suivre le texte hébreu à haute confiance
  alternative: Traduire le grec, qui traite de celui qui jeûne pour ses péchés puis recommence à les commettre
  rationale: La consigne donne la priorité à la preuve dans la langue originale et identifie ici un texte hébreu de haute confiance. Le grec atteste manifestement une autre tradition textuelle ou une autre numérotation.
translation_notes:
  register: Français international moderne, simple et digne, avec le ton direct d’une exhortation sapientielle. Le point-virgule maintient le parallélisme des impératifs et de leur conséquence.
