  text: Is not a little enough for an intelligent man? And on his bed he does not gasp[a][b].
translation:
  language: fr
  text: Un peu ne suffit-il pas à un homme avisé ? Et sur son lit, il ne halète pas[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu traduit par « il ne halète pas » est difficile et son sens exact demeure incertain. Dans le contexte, l’idée semble être qu’une alimentation modérée permet de se coucher sans éprouver de malaise.
    reason: textual_variant
  - marker: b
    text: Le parallèle grec fourni pour ce verset ne correspond pas à cette ligne hébraïque et semble appartenir à un autre verset. La traduction suit donc ici l’hébreu, témoin principal, tout en signalant son incertitude.
    reason: textual_variant
lexical_decisions:
- source_word: הלא
  choice: ne… pas ?
  rationale: Introduit une question rhétorique qui appelle une réponse affirmative ; cette tournure en conserve directement la force.
- source_word: די
  choice: suffit
  rationale: Exprime l’idée de suffisance ; « suffit » est naturel avec le complément de quantité « un peu ».
- source_word: אנוש
  choice: un homme
  rationale: Désigne ici un être humain mortel au singulier dans une formulation proverbiale ; « un homme » conserve la forme représentative du texte hébreu.
- source_word: נבון
  choice: avisé
  rationale: Évoque le discernement et le bon sens pratique, particulièrement appropriés dans ce contexte de modération.
- source_word: מזער
  choice: un peu
  rationale: Désigne une petite quantité ; cette formulation concise convient à la maxime.
- source_word: יצועיו
  choice: son lit
  rationale: Le terme désigne le lit ou la couche ; « lit » est l’équivalent moderne le plus clair.
- source_word: לא ישיק
  choice: il ne halète pas
  rationale: La forme hébraïque est difficile. « Haleter » conserve l’image d’une gêne corporelle sans préciser indûment qu’il s’agirait de vomir, de suffoquer ou de s’étouffer.
