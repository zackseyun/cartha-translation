  text: Years of life come from a sound stomach; one rises in the morning, and his life is with him.
translation:
  language: fr
  text: Des années de vie dépendent d’un ventre sain ; au matin, on se lève encore plein de vie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et sa vie — ou son être — est avec lui ». Le grec ancien présente ici un texte entièrement différent : « Le pain des indigents est leur vie ; celui qui les en prive est un homme de sang. »'
    reason: Préserver la portée concrète mais ouverte de נֶפֶשׁ et avertir le lecteur de la divergence majeure entre les traditions textuelles hébraïque et grecque.
lexical_decisions:
- source_word: קֶרֶב תּוֹלָל
  choice: un ventre sain
  rationale: קֶרֶב désigne ici l’intérieur du corps, particulièrement le ventre ou l’estomac. Le sens de תולל est incertain dans ce témoin, mais le contexte sapientiel et la lecture retenue par l’édition soutiennent l’idée d’un ventre en bon état. « Ventre sain » reste naturel sans réduire le terme à un organe médical précis.
- source_word: שְׁנוֹת חַיִּים
  choice: de longues années de vie
  rationale: L’expression évoque la durée de la vie. L’ajout idiomatique de « longues » rend en français la valeur implicite d’une vie prolongée, plutôt qu’un simple décompte d’années.
- source_word: וְנַפְשׁוֹ אִתּוֹ
  choice: avec toute sa vitalité
  rationale: Littéralement, « et sa vie / son être est avec lui ». Dans ce contexte de santé au réveil, « toute sa vitalité » transmet l’idée d’une personne pleinement en possession de ses forces, tout en signalant le tour littéral en note.
theological_decisions:
- issue: Sens de נֶפֶשׁ dans une maxime sur la santé
  choice: vitalité
  alternative: âme
  rationale: Le contexte porte sur la santé corporelle, la longévité et l’état au réveil. Traduire automatiquement par « âme » introduirait ici une distinction anthropologique que l’hébreu n’impose pas.
- issue: Divergence majeure entre le témoin hébreu et le grec
  choice: traduire le texte hébreu fourni et signaler la divergence
  alternative: 'suivre le grec : « Le pain des indigents est leur vie… »'
  rationale: Le texte hébreu est la source principale indiquée avec un niveau de confiance élevé, mais le parallèle grec transmet une maxime entièrement différente. Cette divergence textuelle réelle ne doit pas être harmonisée silencieusement.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le parallélisme de la maxime tout en évitant un calque obscur. « On » rend naturellement le sujet humain indéfini du second membre.
