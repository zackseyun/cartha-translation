  text: The sleeplessness of a rich man wastes away his flesh[a], and anxiety about livelihood drives away sleep.
translation:
  language: fr
  text: L’insomnie d’un homme riche consume sa chair[a], et le souci de sa subsistance chasse le sommeil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu de la première proposition est difficile. Le parallèle grec dit : « Des espoirs vains et trompeurs sont le lot de l’homme dépourvu d’intelligence, et les rêves donnent des ailes aux insensés. » Le texte principal suit le témoin hébreu conservé, tout en signalant que la transmission de ce passage est incertaine.'
    reason: textual_variant
lexical_decisions:
- source_word: שקר
  choice: l’insomnie
  rationale: La forme hébraïque transmise est difficile dans ce contexte. « L’insomnie » exprime le manque de sommeil que suggèrent le parallélisme et la seconde proposition, sans répéter artificiellement « souci ».
- source_word: עשיר
  choice: d’un homme riche
  rationale: Le nom masculin singulier désigne ici un type individuel; cette formulation est naturelle en français et conserve cette précision.
- source_word: ימחה שארו
  choice: consume sa chair
  rationale: שארו peut désigner sa « chair ». Le verbe évoque ici une détérioration physique progressive; « consume » préserve l’image avec une expression française concise et digne.
- source_word: דאגת מחיה
  choice: le souci de sa subsistance
  rationale: דאגה exprime une préoccupation anxieuse, tandis que מחיה désigne ce qui permet matériellement de vivre. « Subsistance » reste proche de cette notion.
- source_word: תפריע נומה
  choice: chasse le sommeil
  rationale: Le verbe exprime l’interruption ou l’éloignement; appliqué au sommeil, « chasse » est idiomatique et conserve la force de l’image.
