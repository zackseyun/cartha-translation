translation:
  language: fr
  text: L’œil mauvais déteste Dieu[a], et Dieu n’a rien créé de pire que lui.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « l’œil mauvais » : expression hébraïque désignant une personne avare, envieuse ou qui donne à contrecœur.'
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec diffère entièrement : « car leur espérance repose sur celui qui les sauve ». Il semble refléter une autre forme du texte.'
    reason: textual_variant
lexical_decisions:
- source_word: רע עין
  choice: l’œil mauvais
  rationale: L’expression hébraïque signifie littéralement « mauvais d’œil / œil mauvais » et désigne idiomatiquement une personne avare, envieuse ou qui donne à contrecœur. Le texte conserve l’image concrète, expliquée en note.
- source_word: שונא
  choice: déteste
  rationale: Le participe verbal signifie directement « haïr, détester ». La syntaxe la plus naturelle fait de « l’œil mauvais » le sujet qui déteste Dieu.
- source_word: אל
  choice: Dieu
  rationale: Dans ce contexte sapientiel, אל désigne Dieu; « Dieu » est la formulation française la plus claire et naturelle.
- source_word: ורע ממנו לא ברא
  choice: et il n’a rien créé de pire que lui
  rationale: La proposition est concise. Le verbe ברא relève du vocabulaire de la création et suggère Dieu comme sujet implicite. Le pronom masculin peut renvoyer à l’être humain caractérisé par « l’œil mauvais »; « lui » préserve cette ambiguïté personnelle mieux que « cela ».
theological_decisions:
- issue: Sujet et sens de la première proposition malgré la forte divergence du grec
  choice: 'Suivre le témoin hébreu : « L’œil mauvais déteste Dieu »'
  alternative: 'Le grec porte : « car leur espérance repose sur celui qui les sauve »'
  rationale: L’hébreu conservé est ici le témoin principal. Le grec ne représente pas une simple variante lexicale, mais une forme textuelle entièrement différente; cette divergence est donc signalée en note sans remplacer l’hébreu.
- issue: Sujet implicite de ברא dans la seconde proposition
  choice: 'Comprendre Dieu comme sujet : « il n’a rien créé »'
  alternative: 'Formulation passive : « rien de pire que lui n’a été créé »'
  rationale: Le contexte immédiat fournit « Dieu » comme antécédent possible du sujet implicite, et ברא évoque typiquement l’acte créateur. La formulation active demeure toutefois une interprétation syntaxique, non une précision doctrinale ajoutée.
translation_notes:
  register: Français moderne, international et digne. L’image sémitique « l’œil mauvais » est conservée pour respecter la formulation concrète de l’hébreu, avec explication en note. Les marqueurs suivent leur ordre d’apparition dans le texte.
