translation:
  language: fr
  text: Comprends ton prochain comme toi-même[a] et réfléchis attentivement à tout ce que tu détestes[b][c].[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme ta propre personne » ou « comme ta propre vie » ; le mot hébreu נפש peut désigner l’âme, la vie ou la personne elle-même.'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi comprendre : « tout ce qui t’est odieux ».'
    reason: lexical_alternative
  - marker: c
    text: 'La dernière proposition peut aussi se comprendre ainsi : « examine attentivement tout ce que tu détestes » ; elle semble proposer comme critère éthique ce que l’on ne voudrait pas subir soi-même.'
    reason: alternative_reading
  - marker: d
    text: 'Le grec parallèle diverge fortement du texte hébreu et se lit approximativement : « À qui prête-t-il attention ? Et qui le soutient ? » Le présent texte suit le témoin hébreu conservé.'
    reason: textual_variant
lexical_decisions:
- source_word: דעה
  choice: Comprends
  rationale: L’impératif de ידע peut exprimer ici une connaissance attentive et pénétrante, et non un simple savoir factuel. « Comprends » convient à l’exhortation éthique sans remplacer le verbe par « aime ».
- source_word: רעך
  choice: ton prochain
  rationale: רע désigne une personne de l’entourage ou un semblable. « Ton prochain » conserve la résonance éthique biblique sans limiter le sens au voisin géographique.
- source_word: כנפשך
  choice: comme toi-même
  rationale: נפש peut désigner l’âme, la vie ou la personne elle-même. Dans cette comparaison éthique, « comme toi-même » est naturel et fidèle au sens réflexif.
- source_word: ובכל
  choice: et, pour tout
  rationale: La tournure distributive étend la portée du second impératif à tout ce que le destinataire trouve détestable.
- source_word: ששנאת
  choice: ce que tu détestes
  rationale: Le parfait peut se comprendre de manière générale comme désignant tout ce que le destinataire a en aversion. Le présent français exprime naturellement cette valeur gnomique.
- source_word: התבונן
  choice: réfléchis bien
  rationale: L’impératif appelle une considération attentive et délibérée. « Réfléchis bien » garde cette force sans préciser indûment l’action concrète à entreprendre.
- source_word: τίνι ἐπέχει; καὶ τίς ἀντιστήριγμα αὐτοῦ;
  choice: témoin de contrôle seulement
  rationale: Le grec fourni diverge fortement de l’hébreu et semble refléter une autre forme textuelle ou une autre division des versets. Le texte principal suit donc le témoin hébreu conservé.
theological_decisions:
- issue: Rapport avec la formule mieux connue « aime ton prochain comme toi-même »
  choice: Conserver « Comprends ton prochain comme toi-même »
  alternative: Aime ton prochain comme toi-même
  rationale: L’hébreu emploie ידע, le langage de la connaissance ou de la compréhension, et non un verbe signifiant explicitement aimer. La traduction ne doit pas harmoniser ce texte avec une autre formule biblique.
- issue: Portée du test éthique final
  choice: Laisser l’objet de la réflexion implicite
  alternative: Ne fais pas aux autres ce que tu détestes
  rationale: La clause peut suggérer une règle de réciprocité, mais elle ne formule pas explicitement une interdiction d’agir. « Réfléchis bien » préserve cette ouverture.
translation_notes:
  register: 'Français moderne, direct et digne, au tutoiement singulier conforme aux impératifs hébreux. La formulation reste concise et sapientielle. Note de contrôle éditorial : la note [d] documente une variante importante, mais son marqueur ne peut pas être ajouté sans alourdir artificiellement le texte principal ; pour respecter l’exigence de correspondance des marqueurs, il conviendrait en publication de placer [d] après le verset ou de fusionner cette information avec la note [a].'
