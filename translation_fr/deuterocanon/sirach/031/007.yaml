  text: For it is a stumbling block to a fool[a], and every simpleton is ensnared by it.
translation:
  language: fr
  text: Car c’est une pierre d’achoppement pour l’insensé[a], et tout naïf s’y laisse prendre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle dit : « Car les rêves ont égaré beaucoup de gens, et ceux qui ont mis leur espoir en eux sont tombés. » Les témoins hébreu et grec diffèrent ici de façon importante.'
    reason: alternative_reading
lexical_decisions:
- source_word: תקלה
  choice: pierre d’achoppement
  rationale: Le nom désigne ce qui fait trébucher ou mène à la ruine. « Pierre d’achoppement » conserve la métaphore concrète et le registre sapientiel.
- source_word: אויל
  choice: insensé
  rationale: Terme sapientiel désignant une personne déficiente dans son jugement autant que dans sa conduite morale. « Insensé » est naturel et digne en français biblique moderne.
- source_word: פותה
  choice: naïf
  rationale: Le mot désigne une personne inexpérimentée, crédule et facile à tromper. « Naïf » restitue cette nuance sans la lourdeur de « simple d’esprit ».
- source_word: יוקש
  choice: se laisse prendre
  rationale: La forme évoque le fait d’être pris au piège. Cette tournure idiomatique conserve l’image implicite du piège et convient au sujet humain.
- source_word: בו
  choice: s’y
  rationale: Le suffixe renvoie à l’objet évoqué par le contexte. « S’y laisse prendre » rend naturellement en français la relation au piège ou au danger mentionné.
theological_decisions:
- issue: Divergence majeure entre les témoins hébreu et grec
  choice: Suivre dans le texte principal l’hébreu conservé, qui parle d’une pierre d’achoppement pour l’insensé.
  alternative: « Car les rêves ont égaré beaucoup de gens, et ceux qui ont mis leur espoir en eux sont tombés. »
  rationale: Puisque le texte hébreu est conservé avec une confiance élevée, il sert de texte principal. Le grec présente une ligne substantiellement différente sur les rêves; cette divergence textuelle réelle est signalée sans chercher à harmoniser les témoins.
translation_notes:
  register: Français international moderne, naturel et digne, avec un léger registre sapientiel. « Pierre d’achoppement » préserve l’image hébraïque; « tout naïf s’y laisse prendre » reste clair pour le lecteur ordinaire.
