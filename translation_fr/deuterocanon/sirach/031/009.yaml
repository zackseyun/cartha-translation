  text: Who is this? Let us call him blessed[a], for he has done wonders among his people.
translation:
  language: fr
  text: Qui est-il ? Proclamons-le heureux[a], car il a accompli des merveilles au milieu de son peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec diffère considérablement : « Un homme instruit a appris beaucoup de choses, et celui qui a une grande expérience exposera l’intelligence. » Il reflète probablement une autre forme du texte ou un décalage dans la correspondance des versets.'
    reason: alternative_reading
lexical_decisions:
- source_word: מי הוא זה
  choice: Qui est-il ?
  rationale: La formule hébraïque pose une question rhétorique qui désigne une personne exemplaire. « Qui est-il ? » est naturel en français et conserve l'interrogation sans ajouter explicitement « cet homme ».
- source_word: ונאשרנו
  choice: Proclamons-le heureux
  rationale: Le verbe אשר signifie ici déclarer quelqu’un heureux ou digne d’être félicité. La forme « Proclamons-le » rend la nuance volitive et le ton public de l’éloge.
- source_word: כי
  choice: car
  rationale: La conjonction introduit le motif de cette proclamation.
- source_word: הפליא לעשות
  choice: il a accompli des merveilles
  rationale: Cette construction exprime une action extraordinaire ou admirable. La formulation française conserve son registre élevé sans préciser la nature des actes.
- source_word: בעמו
  choice: au milieu de son peuple
  rationale: Cette traduction conserve la valeur locale ou relationnelle de la préposition ב, sans transformer explicitement les actes en bienfaits faits « pour » le peuple.
theological_decisions:
- issue: Divergence majeure entre le témoin hébreu et le parallèle grec fourni
  choice: Suivre dans le texte principal l’hébreu conservé et signaler la leçon grecque en note.
  alternative: « Un homme instruit a appris beaucoup de choses, et celui qui a une grande expérience exposera l’intelligence. »
  rationale: Le texte hébreu est ici conservé avec un degré élevé de confiance et constitue la source principale. Le grec présente une ligne substantiellement différente, peut-être en raison d’une autre forme textuelle ou d’un décalage dans la numérotation des versets; cette divergence doit donc rester visible sans remplacer l’hébreu.
translation_notes:
  register: Français moderne, international et digne. « Proclamons-le heureux » évite le sens courant de « bénir quelqu’un » et exprime clairement la déclaration publique de bonheur ou de félicité. La ponctuation maintient la vigueur de la question rhétorique.
