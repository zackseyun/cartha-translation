  text: Listen, my son, and do not despise me; in the end you will grasp my words.
translation:
  language: fr
  text: Écoute, mon fils, et ne me méprise pas ; à la fin, tu saisiras mes paroles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec fourni pour ce verset présente une sentence entièrement différente : « Celui qui se lave après avoir touché un mort, puis le touche de nouveau, quel profit a-t-il tiré de son bain ? » Il semble s’agir d’un important décalage dans la correspondance des versets ou d’une divergence de tradition textuelle. Le texte principal suit le témoin hébreu conservé.'
    reason: textual_variant
lexical_decisions:
- source_word: שמע
  choice: Écoute
  rationale: L’impératif appelle ici à une écoute attentive. « Écoute » est naturel et n’ajoute pas explicitement l’idée d’obéissance.
- source_word: בני
  choice: mon fils
  rationale: Le vocatif hébreu est masculin singulier ; « mon fils » en rend directement la forme et le ton sapientiel.
- source_word: תבוז
  choice: méprise
  rationale: Le verbe exprime le fait de traiter quelqu’un avec mépris ; « mépriser » conserve la force de l’exhortation.
- source_word: ובאחרית
  choice: à la fin
  rationale: Cette expression indique l’issue ultérieure ou finale. « À la fin » préserve cette portée sans préciser davantage le moment envisagé.
- source_word: תשיג
  choice: tu saisiras
  rationale: Le verbe peut signifier atteindre ou rejoindre. Avec « mes paroles », « saisir » conserve la métaphore de l’atteinte tout en exprimant l’intelligence du propos.
- source_word: אמרי
  choice: mes paroles
  rationale: « Mes paroles » rend simplement le pluriel hébreu dans un registre actuel et digne.
theological_decisions:
- issue: Divergence majeure entre le témoin hébreu et le parallèle grec
  choice: Le texte principal traduit le témoin hébreu conservé.
  alternative: 'Le grec dit : « Celui qui se lave après avoir touché un mort, puis le touche de nouveau, quel profit a-t-il tiré de son bain ? »'
  rationale: Puisque le texte hébreu de Ben Sira est ici attesté, il sert de source principale. Le grec présente une sentence entièrement différente, vraisemblablement en raison d’un décalage de numérotation ou d’une divergence de tradition textuelle ; cette différence est donc signalée sans être harmonisée.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement et « mon fils » maintiennent l’adresse personnelle du maître de sagesse. Le point-virgule articule l’exhortation et son aboutissement.
