    reason: textual_variant
lexical_decisions:
- source_word: חדל
  choice: t’arrêter
  rationale: L’impératif demande de cesser de manger. « T’arrêter » est naturel en français moderne dans le contexte d’un repas.
- source_word: ראשון
  choice: le premier
  rationale: 'Le terme est pris comme attribut de l’impératif : il s’agit de s’arrêter avant les autres, par retenue.'
- source_word: בעבור
  choice: par souci de
  rationale: Cette locution exprime ici le motif éthique de la conduite recommandée et s’accorde naturellement avec « savoir-vivre ».
- source_word: מוסר
  choice: savoir-vivre
  rationale: Le mot signifie souvent « discipline » ou « instruction » ; dans ce contexte de conduite à table, il désigne vraisemblablement les convenances et la bonne tenue.
- source_word: גרגרן
  choice: glouton
  rationale: Le substantif désigne celui qui mange avec avidité. « Glouton » conserve la brièveté et la portée morale de l’hébreu.
- source_word: פן
  choice: de peur de
  rationale: La locution introduit naturellement en français la conséquence négative redoutée.
- source_word: תמאס
  choice: provoquer le dégoût
  rationale: La forme de מאס évoque le rejet ou la répulsion. Cette traduction préserve la force sociale et affective de l’avertissement sans imposer le seul sens de mépris.
