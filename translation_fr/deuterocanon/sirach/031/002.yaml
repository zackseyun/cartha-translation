translation:
  language: fr
  text: Comme celui qui cherche à saisir une ombre et poursuit le vent, ainsi en est-il de celui qui s’attache aux rêves.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin hébreu conservé et placé ici dans l’édition de Kahana présente une ligne substantiellement différente, dont le sens précis est incertain : « רע נאמן תניד חרפה, ומסתיר סוד אוהב כנפש »; la seconde proposition peut se rendre approximativement par « celui qui garde un secret est un ami comme soi-même ». Comme l’hébreu et le grec ne concordent pas sous cette référence, le texte principal suit le témoin grec pour 31,2.'
    reason: textual_variant
  - marker: b
    text: Ou « celui qui prête attention aux rêves » ou « celui qui se cramponne aux rêves ».
    reason: lexical_alternative
lexical_decisions:
- source_word: δρασσόμενος
  choice: cherche à saisir
  rationale: Le participe évoque l’action de tenter de prendre quelque chose qui se dérobe. « Cherche à saisir » rend à la fois le geste et son caractère vain, sans suggérer que la prise réussit.
- source_word: σκιᾶς
  choice: une ombre
  rationale: « Ombre » est le sens direct et conserve l’image de quelque chose d’insaisissable.
- source_word: διώκων
  choice: poursuit
  rationale: Ce verbe préserve l’idée d’une poursuite active et continue dans un registre sobre et littéraire.
- source_word: ἄνεμον
  choice: le vent
  rationale: Cette formulation française naturelle conserve l’image proverbiale de la poursuite d’une réalité impossible à saisir.
- source_word: ὁ ἐπέχων
  choice: celui qui s’attache à
  rationale: Le verbe peut signifier tenir à, maintenir son attention sur ou s’attacher à. Dans cette comparaison, « s’attache à » exprime une adhésion persistante sans trancher entièrement entre attention et confiance.
- source_word: ἐνυπνίοις
  choice: aux rêves
  rationale: Le pluriel désigne les rêves ou visions reçues pendant le sommeil. « Rêves » est clair et n’ajoute aucune précision absente du texte.
theological_decisions:
- issue: Choix du témoin principal face au désaccord majeur entre l’hébreu et le grec
  choice: Traduire la comparaison grecque sur l’ombre, le vent et les rêves, tout en signalant le texte hébreu très différent.
  alternative: 'Le témoin hébreu de la Gueniza donné ici porte : « Un méchant fidèle suscitera la honte, et celui qui garde un secret est un ami comme soi-même. »'
  rationale: Le texte hébreu fourni ne correspond pas au contenu grec sous cette référence et semble relever d’un déplacement de verset ou d’une tradition textuelle divergente. Pour Siracide 31.2 selon cette numérotation, le grec constitue donc la base la plus défendable, tandis que la leçon hébraïque est conservée explicitement en note.
- issue: Portée de ἐπέχων appliqué aux rêves
  choice: « celui qui s’attache aux rêves »
  alternative: « celui qui prête attention aux rêves » ou « celui qui se cramponne aux rêves »
  rationale: « S’attache » conserve la tension entre l’attention accordée aux rêves et le fait de s’y tenir, sans imposer une interprétation doctrinale précise sur leur valeur.
translation_notes:
  register: Français international moderne, naturel et digne. La structure comparative est conservée, mais formulée avec « ainsi en est-il » pour assurer une lecture fluide. L’image concrète de l’ombre et du vent reste intacte.
