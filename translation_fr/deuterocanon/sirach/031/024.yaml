  - marker: c
    text: 'Ou : « visage détourné » ou « traits déformés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מכאוב
  choice: douleur
  rationale: Le nom désigne une douleur ou détresse, vraisemblablement physique dans cette série de symptômes.
- source_word: ונדד ישנה
  choice: sommeil qui s’enfuit
  rationale: Cette formulation naturelle conserve l’image hébraïque d’un sommeil qui erre ou disparaît, plutôt que de la réduire simplement à l’insomnie.
- source_word: ומער
  choice: haut-le-cœur
  rationale: La forme est difficile; dans ce contexte de malaise physique, « haut-le-cœur » exprime le mouvement de vomissement sans affirmer qu’il aboutit nécessairement.
- source_word: ותשניק
  choice: suffocation
  rationale: Le terme évoque l’étranglement ou l’obstruction; « suffocation » convient à l’énumération nominale des symptômes.
- source_word: ופני הפוכות
  choice: visage bouleversé
  rationale: Littéralement, le visage est « retourné »; « bouleversé » garde l’idée d’un aspect profondément altéré sans trancher entre visage détourné et traits déformés.
- source_word: עם איש כסיל
  choice: chez l’homme insensé
  rationale: Dans ce contexte, עם peut rattacher ces manifestations à l’insensé. « Insensé » rend la catégorie sapientielle כסיל dans un registre biblique actuel et digne.
