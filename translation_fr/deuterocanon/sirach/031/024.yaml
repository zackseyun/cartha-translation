translation:
  language: fr
  text: Douleur et sommeil qui s’enfuit[a], haut-le-cœur et suffocation[b], visage bouleversé[c] avec un homme insensé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu de cette ligne est difficile, surtout pour les symptômes du milieu et l’expression rendue par « visage bouleversé ». Le texte grec correspondant est entièrement différent, ce qui témoigne d’une divergence majeure dans la transmission du passage.
    reason: textual_variant
