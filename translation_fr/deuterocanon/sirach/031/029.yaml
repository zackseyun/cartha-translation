  text: Even if you are constrained[a], wait for delicacies patiently[b], and it will bring you rest.
translation:
  language: fr
  text: Même si vous êtes sous la contrainte[a], attendez patiemment les mets délicats[b], et cela vous procurera du repos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec porte : « L’un prie et l’autre maudit : laquelle de ces voix le Maître écoutera-t-il ? » Il témoigne ici d’une tradition textuelle très différente de l’hébreu conservé.'
    reason: alternative_reading
  - marker: b
    text: L’hébreu de ce verset est incertain et diffère profondément du témoin grec. L’expression rendue par « vous êtes sous la contrainte » peut aussi évoquer le fait d’être forcé ou soumis à une pression ; le redoublement traduit par « patiemment » souligne une attente insistante ou prolongée.
    reason: textual_variant
lexical_decisions:
- source_word: וגם אם
  choice: Même si
  rationale: Rend naturellement en français la valeur concessive produite par la combinaison de « aussi/même » et de la particule conditionnelle.
- source_word: נאנסתה
  choice: l’on vous force
  rationale: Le verbe אנס exprime ici la contrainte ou la pression. La tournure impersonnelle conserve cette idée sans introduire le sens sexuel possible dans d’autres contextes.
- source_word: במטעמים
  choice: les mets délicats
  rationale: מטעמים désigne des aliments savoureux ou recherchés; « mets délicats » convient au contexte de table et garde un registre digne.
- source_word: קוה קוה
  choice: attendez patiemment
  rationale: Le redoublement intensifie ou prolonge l’attente. Une répétition littérale serait peu naturelle en français; « patiemment » en restitue la portée.
- source_word: וינוח לך
  choice: et vous trouverez le repos
  rationale: La syntaxe hébraïque est difficile. Cette formulation rend le résultat bénéfique associé à נוח et à לך sans préciser abusivement le sujet implicite.
theological_decisions:
- issue: Divergence majeure entre le texte hébreu et le parallèle grec
  choice: Le texte principal traduit l’hébreu conservé, avec le grec signalé en note.
  alternative: '« L’un prie et l’autre maudit : laquelle de ces voix le Maître écoutera-t-il ? »'
  rationale: Puisque le Siracide est ici attesté en hébreu, celui-ci sert de texte principal. Cependant, le grec représente une tradition entièrement différente et doit être conservé explicitement pour ne pas masquer la tension textuelle.
- issue: Sujet et sens de וינוח לך
  choice: « vous trouverez le repos »
  alternative: « cela vous procurera du repos »
  rationale: L’hébreu est syntaxiquement incertain. Le choix français communique le bénéfice de l’apaisement tout en évitant d’identifier avec assurance un antécédent pour « cela ».
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement est évité dans ce verset isolé au profit du vouvoiement. La formulation reste prudente devant l’état difficile du texte hébreu et ne cherche pas à l’harmoniser avec le grec.
