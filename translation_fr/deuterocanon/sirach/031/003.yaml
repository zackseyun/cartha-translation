translation_notes:
  register: Français moderne, sobre et proverbial. La formulation garde le contraste entre l’effort d’accumuler et le plaisir pris au repos, tout en signalant l’ambiguïté temporelle ou conditionnelle de אם et l’instabilité du parallèle grec.
