  text: A rich man labors to gather wealth[a], and when he rests[b], he receives enjoyment.
translation:
  language: fr
  text: Le riche peine à amasser des biens et, lorsqu’il se repose, il goûte au plaisir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour recevoir du plaisir ». On peut aussi comprendre : « et, s’il se repose, c’est pour recevoir du plaisir ». Le texte grec transmis pour ce verset ne correspond pas à cette formulation hébraïque; la traduction suit donc ici le témoin hébreu.'
    reason: lexical_alternative_and_textual_variant
lexical_decisions:
- source_word: עמלי עשיר
  choice: Le riche peine
  rationale: עמלי, forme liée à עמל, exprime un travail pénible ou soutenu. « Peine » conserve cette nuance tout en restant naturel en français; עשיר est rendu par le singulier générique « le riche ».
- source_word: לקבץ הון
  choice: à amasser des biens
  rationale: לקבץ signifie rassembler ou accumuler, et הון désigne les richesses, les ressources ou les biens. « Amasser des biens » convient au contexte économique sans surinterpréter.
- source_word: ואם ינוח
  choice: et, lorsqu’il se repose
  rationale: ינוח signifie « il se repose ». Dans ce parallélisme, אם peut avoir une valeur temporelle (« quand/lorsque »), même si une lecture conditionnelle (« s’il ») demeure possible.
- source_word: לקבל תענוג
  choice: il goûte au plaisir
  rationale: L’expression signifie littéralement « recevoir du plaisir/de l’agrément ». « Goûter au plaisir » donne en français courant le sens d’en bénéficier ou d’en jouir, sans concrétiser indûment תענוג en « luxe ».
