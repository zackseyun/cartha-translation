  text: Stretch out your hand to the place he looks at[a], and do not reach with him into the dish.
translation:
  language: fr
  text: Tends la main vers l’endroit qu’il regarde[a], et ne la porte pas en même temps que lui dans le plat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La tradition grecque porte ici : « Heureuse l’âme de celui qui craint le Seigneur. » Le témoin hébreu conservé dans la Guéniza du Caire donne une ligne différente sur la conduite à table; la tradition textuelle est incertaine à cet endroit.'
    reason: alternative_reading
lexical_decisions:
- source_word: מקום
  choice: l’endroit
  rationale: Le nom signifie ordinairement « lieu, endroit ». Dans ce contexte de repas, il désigne l’endroit du plat sur lequel se porte l’attention de l’autre convive, sans imposer le sens plus interprétatif de « portion ».
- source_word: יביט
  choice: qu’il regarde
  rationale: Le verbe exprime l’action de regarder. Cette formulation française naturelle conserve l’idée qu’il faut tenir compte de l’endroit visé par l’autre convive.
- source_word: תושיט יד
  choice: Tends la main
  rationale: L’expression concrète convient aux règles de conduite à table et reste proche de l’hébreu dans un français actuel et digne.
- source_word: אל תחד
  choice: ne la porte pas en même temps
  rationale: La forme hébraïque est difficile dans le témoin composite. Le contexte paraît interdire de tendre simultanément la main vers le récipient commun; la traduction exprime cette portée pratique sans attribuer au mot une nuance lexicale trop précise.
- source_word: עמו
  choice: que lui
  rationale: Dans la construction « en même temps que lui », cette expression rend la simultanéité avec l’autre convive et conserve le masculin singulier de la source.
- source_word: בטנא
  choice: dans le plat
  rationale: Le nom peut désigner un panier ou un récipient. Dans le contexte d’un repas partagé, « plat » communique naturellement l’idée du récipient de service.
- source_word: φοβουμένου τὸν Κύριον μακαρία ἡ ψυχή
  choice: non retenu dans le texte principal
  rationale: Le parallèle grec présente une phrase entièrement différente. Puisque l’hébreu est conservé ici, il fonde le texte principal; la leçon grecque est signalée en note comme tradition alternative importante.
theological_decisions:
- issue: Divergence entre les traditions hébraïque et grecque de ce verset
  choice: Suivre dans le texte principal la règle de conduite à table conservée en hébreu et signaler en note la bénédiction grecque de celui qui craint le Seigneur.
  alternative: « Heureuse l’âme de celui qui craint le Seigneur. »
  rationale: L’hébreu conservé est prioritaire pour le Siracide, mais l’écart majeur avec le grec doit rester visible. La note préserve cette autre tradition sans harmonisation ni résolution artificielle.
translation_notes:
  register: Français international moderne, clair et légèrement soutenu. Le pronom « la » reprend « la main » afin d’éviter une répétition lourde. La formulation explicite la simultanéité impliquée par le contexte tout en maintenant l’incertitude lexicale dans la documentation.
