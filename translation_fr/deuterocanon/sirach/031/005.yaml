  text: One who eagerly pursues gain will not go unpunished[c][b][a], and one who loves profit will go astray by it.
translation:
  language: fr
  text: Qui poursuit le gain[b] ne restera pas impuni[a], et qui aime le profit[c] s’égarera à cause de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu conservé présente ici une maxime sur la poursuite du gain et l’amour du profit. Le grec transmet à la place : « Divinations, présages et rêves sont vains, et le cœur imagine comme celui d’une femme en travail. » Il s’agit apparemment d’une tradition textuelle très différente.'
    reason: textual_variant
  - marker: b
    text: Ou « l’or » ou « la richesse ».
    reason: lexical_alternative
  - marker: c
    text: Ou « le prix » ou « le paiement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: רודף
  choice: court après
  rationale: Le participe exprime une poursuite active et continue. « Court après » est naturel en français et fait entendre la convoitise visée par la maxime.
- source_word: חרוץ
  choice: la richesse
  rationale: Dans ce contexte économique, le nom désigne vraisemblablement les biens matériels ou le gain, plutôt que le métal au sens strict. « Richesse » reste distinct de מחיר dans le second membre.
- source_word: לא ינקה
  choice: ne restera pas impuni
  rationale: Cette tournure hébraïque signifie couramment ne pas être tenu pour innocent ou ne pas échapper au châtiment. La formulation française exprime clairement cette conséquence.
- source_word: אוהב
  choice: qui aime
  rationale: Le participe substantivé a une portée générale. « Qui aime » conserve le parallélisme avec « Qui court après ».
- source_word: מחיר
  choice: le profit
  rationale: Le mot peut désigner le prix ou le paiement. Ici, « profit » rend bien l’avantage financier recherché, sans le confondre avec חרוץ.
- source_word: בו
  choice: à cause de lui
  rationale: 'La préposition avec suffixe est comprise dans un sens causal : l’attachement au profit devient la cause de l’égarement. Le pronom renvoie explicitement au profit.'
- source_word: ישגה
  choice: s’égarera
  rationale: Le verbe évoque le fait de dévier ou de tomber dans l’erreur. « S’égarera » préserve à la fois la portée morale et pratique.
theological_decisions:
- issue: Choix entre le texte hébreu conservé et le parallèle grec divergent
  choice: Traduire la maxime attestée par l’hébreu et signaler en note la tradition grecque entièrement différente.
  alternative: 'Suivre le grec : « Divinations, présages et rêves sont vains, et le cœur a des visions comme celui d’une femme en travail. »'
  rationale: Le texte hébreu conservé est la source principale du passage. La divergence grecque est toutefois substantielle et doit être exposée sans harmonisation.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme des deux participes hébreux est rendu par deux propositions introduites par « Qui ». « Court après » communique naturellement une poursuite avide, tandis que « ne restera pas impuni » conserve la force judiciaire de l’idiome hébreu.
