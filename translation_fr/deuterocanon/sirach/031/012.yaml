  text: Therefore hold fast to his goodness[a], and the assembly will recount his praise. Bread is instruction[c][b], and wine with it.
translation:
  language: fr
  text: 'C’est pourquoi, attache-toi fermement à sa bonté[a], et l’assemblée proclamera sa louange. Instruction : pain et vin ensemble.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à sa générosité » ou « à ses bienfaits ».
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu difficile et elliptique. On peut aussi comprendre : « Le pain est une discipline, et le vin avec lui. » Le mot rendu par « instruction » peut également signifier « discipline » ou « correction ».'
    reason: textual_and_lexical_uncertainty
  - marker: c
    text: 'Le grec présente une leçon entièrement différente : « J’ai vu bien des choses au cours de mes voyages, et mon intelligence dépasse mes paroles. » Les témoins hébreu et grec divergent fortement ici.'
    reason: textual_variant
lexical_decisions:
- source_word: על כן
  choice: C’est pourquoi
  rationale: Rend naturellement le lien de conséquence introduit par l’hébreu.
- source_word: חזק טובו
  choice: attache-toi fermement à sa bonté
  rationale: חזק peut exprimer l’idée d’être fort, de saisir fermement ou de tenir bon. Cette formulation française conserve l’exhortation sans réduire טובו à la seule générosité matérielle.
- source_word: ותהלתו יספר קהל
  choice: et l’assemblée racontera ses louanges
  rationale: ספר signifie raconter ou faire le récit de quelque chose, tandis que קהל désigne une assemblée. Le pluriel français « ses louanges » est idiomatique tout en rendant le singulier collectif תהלתו.
- source_word: מוסר לחם, ויין יחדו
  choice: Instruction sur le pain et le vin ensemble
  rationale: La suite nominale peut se comprendre comme un intitulé introduisant un enseignement relatif au pain et au vin. Cette lecture respecte mieux la syntaxe concise de l’hébreu que l’identification prédicative « le pain est une instruction », tout en laissant son caractère abrupt perceptible.
theological_decisions:
- issue: Choix du témoin principal malgré la forte divergence entre l’hébreu et le grec
  choice: Traduire le texte hébreu conservé et signaler intégralement la leçon grecque en note.
  alternative: 'Suivre le grec : « J’ai vu bien des choses au cours de mes voyages, et mon intelligence dépasse mes paroles. »'
  rationale: Les deux traditions textuelles transmettent ici des contenus radicalement différents. Les fusionner créerait un texte sans appui manuscrit ; le texte principal suit donc l’hébreu fourni, tandis que la note préserve la leçon grecque comme variante substantielle.
- issue: Fonction de מוסר לחם, ויין יחדו
  choice: 'Comprendre la proposition comme un intitulé : « Instruction sur le pain et le vin ensemble. »'
  alternative: « Le pain est une discipline, et le vin avec lui. »
  rationale: L’hébreu nominal est très elliptique. La lecture comme titre convient à la construction « מוסר + nom » et au contexte d’instructions de table, mais l’autre analyse demeure possible et est donc conservée en note.
translation_notes:
  register: Français international actuel, digne et accessible. Le premier membre garde la force de l’impératif hébreu ; le dernier est rendu comme un intitulé bref afin de respecter sa syntaxe nominale et son probable rôle dans le passage, sans masquer l’autre analyse possible.
