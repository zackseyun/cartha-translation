translation:
  language: fr
  text: 'Ne dis pas : « Il en a assez » ; souviens-toi qu’un œil mauvais[a] est une mauvaise chose.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans l’usage biblique hébreu, l’« œil mauvais » peut désigner une disposition avare, mesquine, envieuse ou réticente à donner.
    reason: lexical_alternative
  - marker: b
    text: 'Le parallèle grec fourni pour ce verset dit : « L’esprit de ceux qui craignent le Seigneur vivra. » Il ne correspond pas au texte hébreu ici et reflète probablement un autre alignement du texte ou une autre numérotation des versets.'
    reason: textual_variant
lexical_decisions:
- source_word: אל תאמר
  choice: Ne dis pas
  rationale: L’impératif négatif est rendu directement, sans transformer la parole en pensée intérieure.
- source_word: ספוק עליו
  choice: Il en a assez
  rationale: ספוק exprime l’idée de suffisance, tandis que עליו renvoie vraisemblablement à une autre personne au masculin singulier. Cette formulation est naturelle en français et conserve cette référence personnelle.
- source_word: זכור
  choice: souviens-toi
  rationale: L’impératif hébreu est conservé sous une forme française directe et courante.
- source_word: רעה עין רעה
  choice: un œil mauvais est chose mauvaise
  rationale: Cette formulation maintient l’image concrète de l’œil ainsi que la répétition de רעה, tout en donnant à l’aphorisme une syntaxe française intelligible.
theological_decisions:
- issue: Sens de l’expression hébraïque « œil mauvais »
  choice: Conserver « œil mauvais » dans le texte
  alternative: avarice ; disposition envieuse ou mesquine
  rationale: L’expression peut désigner une attitude avare, envieuse ou réticente à donner, mais son image concrète et sa portée proverbiale méritent d’être préservées. Une note en précise le sens sans réduire l’ambiguïté du texte.
- issue: Divergence majeure entre le texte hébreu et le parallèle grec fourni
  choice: Traduire le texte hébreu conservé et signaler la divergence
  alternative: 'Suivre le grec : « L’esprit de ceux qui craignent le Seigneur vivra »'
  rationale: Le projet donne priorité à l’hébreu de Ben Sira lorsqu’il est conservé. Le grec fourni ne correspond pas à cette phrase et paraît relever d’un autre alignement textuel ou d’une autre numérotation.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Il en a assez » est idiomatique sans expliciter davantage le référent masculin. « Est chose mauvaise » conserve la répétition hébraïque tout en évitant l’association française du « mauvais œil » avec un sort jeté.
