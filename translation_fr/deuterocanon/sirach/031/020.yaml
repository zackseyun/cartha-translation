  text: Know that your neighbor is a man like yourself[b][a], and eat what is set before you.
translation:
  language: fr
  text: Sache que ton prochain est un homme comme toi[a], et mange ce qui est mis devant toi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi rendre l’idée de manière plus inclusive : « ton prochain est une personne comme toi ». L’hébreu dit littéralement : « un homme comme toi ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le témoin grec présente ici un texte très différent : « élevant l’âme et éclairant les yeux, donnant la guérison, la vie et la bénédiction ». L’hébreu et le grec semblent conserver deux formes différentes de ce verset.'
    reason: alternative_reading
lexical_decisions:
- source_word: דע
  choice: Sache
  rationale: L’impératif de ידע appelle ici une prise de conscience. « Sache » en conserve directement la force exhortative.
- source_word: רעך
  choice: ton prochain
  rationale: רֵעַ peut désigner l’ami, le compagnon ou le prochain. « Ton prochain » convient au rapport éthique et social exprimé par la comparaison qui suit.
- source_word: איש כמוך
  choice: un homme comme toi
  rationale: L’hébreu emploie explicitement le nom masculin איש, « homme ». Cette formulation directe en préserve la précision, tandis qu’une tournure plus inclusive est signalée en note.
- source_word: ואכול
  choice: et mange
  rationale: La conjonction suivie de l’impératif est rendue simplement, sans ajouter une valeur de conséquence absente de la formulation hébraïque.
- source_word: דבר ששם לפניך
  choice: ce qui est placé devant toi
  rationale: Dans le contexte du repas, דבר désigne ce qui est servi, et ששם לפניך ce qui est mis ou placé devant la personne. La formulation retenue est naturelle tout en restant proche de l’hébreu.
theological_decisions:
- issue: Expression genrée איש כמוך
  choice: Conserver « un homme comme toi » dans le texte principal
  alternative: « une personne comme toi » ou « quelqu’un comme toi »
  rationale: Le témoin hébreu emploie le nom masculin איש. Le texte principal garde cette donnée lexicale, sans nier la portée générale du proverbe, explicitée dans une note.
- issue: Divergence entre les témoins hébreu et grec
  choice: Suivre le texte hébreu et signaler le grec en note
  alternative: 'Traduire le grec : « élevant l’âme et éclairant les yeux, donnant guérison, vie et bénédiction »'
  rationale: Le texte hébreu est ici disponible avec une confiance élevée et constitue la source principale. Le grec transmet une formulation substantiellement différente qui ne doit pas être harmonisée silencieusement avec l’hébreu.
translation_notes:
  register: Français moderne, clair et digne, avec tutoiement conforme aux formes singulières de l’hébreu. La syntaxe paratactique et la brièveté proverbiale du texte source sont conservées.
