base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/008.yaml
  text: Blessed is the man who is found blameless[b][a], and who has not gone astray after wealth.
translation:
  language: fr
  text: Heureux l’homme qui est trouvé intègre[a] et qui ne s’est pas écarté en quête de richesse.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « intègre » désigne la droiture morale, non une perfection absolue.
    reason: lexical_clarification
  - marker: b
    text: 'Le texte hébreu de cette proposition est difficile, et le parallèle grec diffère sensiblement. On pourrait aussi traduire : « qui ne s’est pas écarté en poursuivant la richesse » ou « qui n’a pas été égaré par l’argent ».'
    reason: textual_variant
lexical_decisions:
- source_word: אשרי
  choice: Heureux
  rationale: Formule traditionnelle des béatitudes en français biblique; elle exprime une condition enviable sans réduire le propos à une émotion passagère.
- source_word: איש
  choice: l’homme
  rationale: Reproduit le masculin singulier de l’hébreu et convient au style sapientiel.
- source_word: נמצא
  choice: est trouvé
  rationale: 'Conserve le passif et la nuance évaluative du texte: cet homme se révèle ou est reconnu comme tel.'
- source_word: תמים
  choice: intègre
  rationale: Dans ce contexte moral, le mot désigne la droiture et l’intégrité, non une perfection absolue sans péché.
- source_word: ממון
  choice: la richesse
  rationale: Désigne largement les biens matériels; «richesse» est naturel et suffisamment général en français.
- source_word: לא נלוז
  choice: ne s’est pas écarté
  rationale: Rend l’idée de dévier du droit chemin tout en évitant de préciser excessivement la manière dont la richesse intervient.
- source_word: ויחר
  choice: à cause de
  rationale: La forme transmise est difficile. Cette traduction exprime prudemment une relation entre la déviation morale et la richesse, sans prétendre résoudre entièrement le problème textuel.
theological_decisions:
- issue: Difficulté textuelle de la proposition concernant la richesse
  choice: Traduire le noyau assuré de l’hébreu comme une intégrité qui n’a pas été détournée par la richesse.
  alternative: «et qui ne s’est pas écarté en poursuivant la richesse» ou «et qui n’a pas été égaré par l’argent»
  rationale: Le texte hébreu contient clairement «richesse» et «ne pas s’écarter», mais leur relation syntaxique est incertaine. Le parallèle grec diffère fortement et ne permet pas de trancher. La formulation retenue préserve le sens moral probable sans imposer une reconstruction trop précise.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure «Heureux l’homme» conserve le ton sapientiel; la seconde proposition reste fluide tout en signalant honnêtement l’incertitude textuelle.
