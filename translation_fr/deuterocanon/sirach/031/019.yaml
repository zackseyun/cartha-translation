  text: Recline like a well-bred man[a], and do not gobble[c][b], lest you become disgusting.
translation:
  language: fr
  text: Prends place à table[a] comme un homme distingué[b] ; ne dévore pas, de peur de devenir repoussant.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lors des repas officiels du monde méditerranéen antique, les convives prenaient généralement leur repas étendus sur des lits de table.
    reason: cultural_note
  - marker: b
    text: Ou « comme un homme choisi » ou « comme un homme raffiné » ; la nuance précise de l’expression hébraïque est incertaine.
    reason: lexical_alternative
  - marker: c
    text: À cet endroit, le texte grec transmis sous la référence Siracide 31.19 ne correspond pas à cette ligne hébraïque, ce qui témoigne d’un décalage entre les traditions textuelles ou leur numérotation.
    reason: textual_variant
lexical_decisions:
- source_word: הסב
  choice: Prends place à table
  rationale: Dans le contexte d’un banquet, le verbe désigne le fait de s’installer, plus précisément de s’étendre, pour manger. La formulation française est naturelle, tandis que la note conserve la posture propre aux repas antiques.
- source_word: כאיש אשר נבחר
  choice: comme un homme distingué
  rationale: נבחר signifie littéralement « choisi » et peut ici évoquer un homme de qualité, distingué ou raffiné. « Homme distingué » conserve איש et convient à l’exhortation aux bonnes manières sans surinterpréter l’origine sociale.
- source_word: תעט
  choice: ne dévore pas
  rationale: Dans ce contexte, le verbe dénonce une manière avide et inconvenante de manger. « Dévorer » exprime cette voracité dans un français courant et digne.
- source_word: תגעל
  choice: devenir repoussant
  rationale: La forme exprime le fait de devenir objet de dégoût ou d’aversion. « Devenir repoussant » préserve le résultat social du comportement sans préciser indûment qui éprouve ce dégoût.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et sapiential. « Prends place à table » évite l’étrangeté de « étends-toi à table » tout en signalant la coutume antique en note. Le point-virgule rend clairement les deux impératifs liés.
