  text: Every prudent man has recognized wisdom[a], and to the one who found her he will give praise.
translation:
  language: fr
  text: Tout homme avisé a reconnu la sagesse[a], et il adressera des louanges à celui qui l’a trouvée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Toute personne avisée a reconnu la sagesse et adressera des louanges à la personne qui l’a trouvée. » Le grec emploie des termes masculins singuliers pour la personne avisée et pour celle qui a trouvé la sagesse, ainsi qu’un pronom féminin pour la sagesse.'
    reason: Précision sur le genre grammatical et possibilité d’une formulation française épicène.
lexical_decisions:
- source_word: πᾶς
  choice: Tout
  rationale: Le singulier distributif s’accorde naturellement avec συνετός et désigne chaque homme avisé.
- source_word: συνετὸς
  choice: homme avisé
  rationale: L’adjectif substantivé masculin désigne quelqu’un doué de discernement pratique. « Avisé » est naturel en français moderne tout en conservant la forme masculine représentative du grec.
- source_word: ἔγνω
  choice: a reconnu
  rationale: L’aoriste de γινώσκω présente ici une reconnaissance accomplie de la sagesse, et non seulement un savoir abstrait.
- source_word: σοφίαν
  choice: la sagesse
  rationale: Équivalent usuel de σοφία, approprié au contexte sapientiel.
- source_word: τῷ εὑρόντι αὐτὴν
  choice: à celui qui l’a trouvée
  rationale: Le participe substantivé au datif désigne le destinataire de l’hommage. L’accord de « trouvée » reprend clairement le nom féminin « sagesse ».
- source_word: δώσει ἐξομολόγησιν
  choice: il rendra hommage
  rationale: Le futur est conservé. Dans ce contexte, ἐξομολόγησις exprime une reconnaissance élogieuse plutôt qu’une confession de faute ; « rendre hommage » est idiomatique et maintient le bénéficiaire introduit par le datif.
theological_decisions:
- issue: Représentation genrée de l’homme avisé et de la sagesse
  choice: Conserver « homme » et reprendre « sagesse » au féminin
  alternative: « Toute personne avisée a reconnu la sagesse et rendra hommage à la personne qui l’a trouvée. »
  rationale: Le grec emploie συνετός au masculin singulier comme terme substantivé et αὐτήν au féminin en référence à σοφία. La traduction principale préserve ces deux traits sans leur ajouter de portée doctrinale.
- issue: Destinataire de l’hommage
  choice: L’hommage est rendu à celui qui a trouvé la sagesse
  alternative: Comprendre l’expression comme une louange adressée directement à la sagesse
  rationale: 'Le datif τῷ εὑρόντι gouverne naturellement le destinataire de δώσει ἐξομολόγησιν : c’est celui qui l’a trouvée qui reçoit l’hommage.'
translation_notes:
  register: Français international moderne, digne et accessible. « Homme avisé » garde la forme masculine du grec ; « rendre hommage » évite le tour moins idiomatique « donner une louange » tout en conservant l’idée de reconnaissance élogieuse.
