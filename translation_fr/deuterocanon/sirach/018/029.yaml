translation:
  language: fr
  text: Ceux qui sont avisés dans leurs paroles sont eux aussi devenus sages, et ils ont fait pleuvoir des maximes précises.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils ont fait pleuvoir des maximes précises » ; le verbe grec évoque une abondance comparable à la pluie.'
