lexical_decisions:
- source_word: συνετοὶ ἐν λόγοις
  choice: ceux qui savent parler
  rationale: Rend naturellement l’idée de personnes avisées ou intelligentes dans leurs paroles, sans le calque peu idiomatique « intelligents en paroles ».
- source_word: ἐσοφίσαντο
  choice: sont eux-mêmes devenus sages
  rationale: Le moyen aoriste peut exprimer l’acquisition de la sagesse; « eux-mêmes » représente καὶ αὐτοί.
- source_word: ἀνώμβρησαν
  choice: ont répandu une pluie de
  rationale: Préserve l’image forte du verbe grec, littéralement « faire pleuvoir », plutôt que de la réduire au simple « répandre ».
- source_word: παροιμίας ἀκριβεῖς
  choice: maximes précises
  rationale: Dans ce contexte sapientiel, παροιμίαι désigne des sentences ou maximes; ἀκριβεῖς souligne leur exactitude et leur formulation rigoureuse.
