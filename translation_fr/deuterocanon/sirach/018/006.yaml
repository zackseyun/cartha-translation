  yaml_path: translation/deuterocanon/sirach/018/006.yaml
  text: It is not possible to diminish or to add[a], and it is not possible to trace out the wonders of the Lord.
translation:
  language: fr
  text: On ne peut ni diminuer ni ajouter, et l’on ne peut sonder les merveilles du Seigneur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « suivre à la trace » ou « scruter » les merveilles du Seigneur.
    reason: Alternative lexicale pour ἐξιχνιάσαι, qui peut évoquer une recherche attentive et menée jusqu’au bout, à l’image de celui qui suit une trace.
lexical_decisions:
- source_word: οὐκ ἔστιν
  choice: il n’est possible… / il est impossible…
  rationale: La tournure impersonnelle exprime l’impossibilité. La légère variation évite une répétition pesante tout en conservant le parallélisme.
- source_word: ἐλαττῶσαι
  choice: retrancher
  rationale: Dans l’antithèse avec « ajouter », « retrancher » rend naturellement l’idée d’ôter ou de diminuer, sans fournir l’objet que le grec laisse implicite.
- source_word: προσθεῖναι
  choice: ajouter
  rationale: Équivalent direct qui conserve l’opposition équilibrée avec « retrancher ».
- source_word: ἐξιχνιάσαι
  choice: sonder
  rationale: Le verbe évoque la recherche menée jusqu’au bout, comme lorsqu’on suit une trace. « Sonder » exprime ici l’idée de parvenir à connaître pleinement.
- source_word: τὰ θαυμάσια
  choice: les merveilles
  rationale: Cette formulation concise garde ouverte la référence à des œuvres, des actes ou des réalités merveilleuses.
- source_word: τοῦ κυρίου
  choice: du Seigneur
  rationale: Dans ce contexte sapientiel, κύριος est le titre divin traditionnel, rendu naturellement par « Seigneur ».
theological_decisions:
- issue: Objet sous-entendu de « retrancher » et « ajouter »
  choice: Laisser l’objet implicite.
  alternative: Ajouter « à ses œuvres », « à cela » ou « aux merveilles du Seigneur ».
  rationale: Le grec n’exprime aucun objet. Le maintenir implicite préserve la portée aphoristique et évite de restreindre le sens.
- issue: Sens métaphorique de ἐξιχνιάσαι
  choice: « sonder », avec une note signalant l’image de suivre des traces.
  alternative: « suivre à la trace », « explorer à fond » ou « comprendre pleinement ».
  rationale: « Sonder » est naturel et digne en français, tandis que la note conserve l’image et l’idée d’une recherche exhaustive.
- issue: Traduction de κύριος
  choice: Seigneur
  alternative: Maître
  rationale: Il s’agit ici du titre divin; « Seigneur » respecte l’usage biblique sans introduire de précision doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme du grec est conservé, de même que l’absence d’objet explicite après « retrancher » et « ajouter ».
