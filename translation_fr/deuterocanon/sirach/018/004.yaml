  text: Et qui pourra sonder ses hauts faits ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίς
  choice: qui
  rationale: Le pronom interrogatif introduit une question rhétorique ; « qui » en restitue directement et naturellement la force.
- source_word: ἐξιχνιάσει
  choice: pourra sonder
  rationale: Le futur grec désigne l’action de suivre une trace jusqu’au bout, donc d’examiner ou de pénétrer pleinement. « pourra sonder » conserve la forme rhétorique et l’idée d’une recherche approfondie, sans transformer explicitement la question en affirmation d’impossibilité.
- source_word: τὰ μεγαλεῖα
  choice: ses œuvres grandioses
  rationale: Le pluriel peut désigner les grandes actions ou manifestations de la grandeur divine. « œuvres grandioses » exprime cette dimension active tout en conservant la grandeur évoquée par le terme grec.
- source_word: αὐτοῦ
  choice: ses
  rationale: Le possessif renvoie naturellement à Dieu dans le contexte immédiat ; « ses » l’exprime sans ajouter son nom au texte.
theological_decisions:
- issue: Référent du pronom αὐτοῦ
  choice: « ses » renvoie à Dieu
  alternative: Répéter explicitement « de Dieu » ou « du Seigneur »
  rationale: Le contexte identifie suffisamment le référent. Garder le pronom respecte la formulation grecque et évite une explicitation doctrinale inutile.
- issue: Portée de la question rhétorique
  choice: 'Conserver la question : « qui pourra… ? »'
  alternative: 'Affirmer : « personne ne peut… »'
  rationale: La question implique l’incapacité humaine à épuiser les œuvres divines, mais le grec laisse cette conclusion sous forme rhétorique ; la traduction préserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. « Sonder » appartient à un registre biblique encore courant et rend bien l’idée d’une recherche en profondeur ; « œuvres grandioses » évite l’ambiguïté de « grandeurs », qui pourrait sembler purement abstrait.
