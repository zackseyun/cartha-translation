  text: My child[a], in good things do not add reproach, nor in any gift grief of words.
translation:
  language: fr
  text: Mon enfant, quand tu fais du bien, n’y mêle pas de reproche, et, quel que soit ton don, n’y joins pas de paroles qui font de la peine.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et, dans tout don, [ne donne pas] une peine de paroles ». Cette expression grecque condensée met en garde contre des paroles qui gâchent la générosité en causant de la peine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: Mon enfant
  rationale: Le vocatif ouvre une exhortation sapientielle chaleureuse. « Mon enfant » est naturel en français et ne précise pas un genre que le grec n’impose pas ici.
- source_word: ἐν ἀγαθοῖς
  choice: quand tu fais du bien
  rationale: Le pluriel substantivé désigne largement les bonnes actions ou les bienfaits. Cette formulation française rend le contexte de bienfaisance sans réduire l’expression aux seuls cadeaux.
- source_word: μὴ δῷς μῶμον
  choice: n’y mêle pas de reproche
  rationale: Le sens littéral est « ne donne pas de reproche », mais cette tournure serait peu naturelle. « Mêler » exprime clairement l’idée de gâter un bienfait par un élément de blâme, tout en conservant la portée interpersonnelle de μῶμον.
- source_word: ἐν πάσῃ δόσει
  choice: quel que soit ton don
  rationale: δόσις peut désigner le don ou l’acte de donner, et πάσῃ a ici une force distributive. La formulation retenue est idiomatique et maintient l’application à chaque don.
- source_word: λύπην λόγων
  choice: des paroles qui peinent
  rationale: Le grec présente une construction condensée, littéralement « peine de paroles ». La traduction explicite que les paroles causent de la peine sans préciser davantage leur nature.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme de l’exhortation est conservé, tandis que les constructions grecques très condensées sont rendues de façon idiomatique. Le tutoiement convient à l’adresse sapientielle singulière « Mon enfant ».
