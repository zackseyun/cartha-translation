  text: Before you become sick[a], humble yourself, and in the time of sins show repentance.
translation:
  language: fr
  text: Avant de tomber malade, humilie-toi ; quand tu pèches, manifeste ton repentir[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus littéralement, « manifeste un retour ». Le grec ἐπιστροφή peut évoquer le fait de revenir ou de se tourner de nouveau ; la mention des péchés conduit ici à traduire par « repentir ».
    reason: Alternative lexicale préservant l’image et l’étendue de sens de ἐπιστροφή.
lexical_decisions:
- source_word: πρὶν ἀρρωστῆσαί σε
  choice: Avant de tomber malade
  rationale: 'La tournure rend naturellement l’antériorité exprimée par πρίν et conserve la valeur ingressive de ἀρρωστέω : il s’agit de tomber malade, et non simplement d’être malade.'
- source_word: ταπεινώθητι
  choice: humilie-toi
  rationale: Bien que la forme grecque soit passive, l’impératif a ici une valeur réflexive naturelle dans l’exhortation sapientielle et appelle un abaissement volontaire.
- source_word: ἐν καιρῷ ἁμαρτημάτων
  choice: au temps des péchés
  rationale: Cette formulation conserve le pluriel de ἁμαρτημάτων et la relation temporelle quelque peu ouverte du grec, sans préciser abusivement s’il s’agit du moment où l’on pèche ou d’une période caractérisée par les péchés.
- source_word: δεῖξον
  choice: manifeste
  rationale: Le verbe exprime le fait de rendre visible ou évident. « Manifeste » convient mieux que le calque moins naturel « montre » devant un nom abstrait.
- source_word: ἐπιστροφήν
  choice: repentir
  rationale: Dans le voisinage immédiat des « péchés », le retour évoqué est moral et religieux. « Repentir » communique ce sens en français courant, tandis que le sens plus littéral de retournement ou de retour est signalé en note.
theological_decisions:
- issue: Sens de ἐπιστροφήν en rapport avec ἁμαρτημάτων
  choice: repentir
  alternative: retour, retournement
  rationale: Le contexte des péchés favorise le sens de repentir, sans exiger qu’on importe une définition doctrinale technique. La note préserve l’image fondamentale du retour.
- issue: Valeur de ταπεινώθητι
  choice: humilie-toi
  alternative: sois humilié
  rationale: L’exhortation demande vraisemblablement une démarche volontaire. Le passif littéral pourrait laisser entendre que l’humiliation serait seulement imposée de l’extérieur.
translation_notes:
  register: Français moderne, sobre et dignifié. Le parallélisme exhortatif est conservé, et le point-virgule clarifie les deux impératifs sans affaiblir leur unité.
