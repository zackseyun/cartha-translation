base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/018/022.yaml
  text: Do not be hindered from paying a vow in due time[a], and do not wait until death to be justified.
translation:
  language: fr
  text: Ne te laisse pas empêcher d’accomplir un vœu au moment voulu, et n’attends pas jusqu’à la mort pour être reconnu juste.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour être justifié » ou « pour être déclaré juste ». Le grec peut désigner plus largement le fait d’être reconnu comme étant dans son droit, sans renvoyer nécessairement au sens théologique technique plus tardif de la « justification ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμποδισθῇς
  choice: te laisse pas empêcher
  rationale: Le passif grec avertit de ne pas laisser un obstacle entraver l’accomplissement du vœu. Cette tournure conserve le passif tout en restant naturelle en français.
- source_word: ἀποδοῦναι
  choice: accomplir
  rationale: Avec εὐχήν, le verbe signifie idiomatiquement s’acquitter d’un vœu. « Accomplir un vœu » est plus naturel en français moderne que « payer un vœu ».
- source_word: εὐχήν
  choice: un vœu
  rationale: Dans la construction avec ἀποδοῦναι, εὐχή désigne très probablement un engagement fait à Dieu, plutôt qu’une simple prière.
- source_word: εὐκαίρως
  choice: au moment voulu
  rationale: Cette expression rend l’idée d’un moment approprié et opportun, sans réduire l’adverbe au seul sens de rapidité.
- source_word: μὴ μείνῃς
  choice: n’attends pas
  rationale: Dans ce contexte exhortatif, μένω évoque le fait de différer l’action plutôt qu’une simple permanence dans un lieu ou un état.
- source_word: ἕως θανάτου
  choice: jusqu’à la mort
  rationale: La formulation suit étroitement le grec et présente la mort comme la limite extrême du délai.
- source_word: δικαιωθῆναι
  choice: être reconnu juste
  rationale: Le passif de δικαιόω peut exprimer le fait d’être déclaré, montré ou reconnu juste. Cette traduction préserve le sens judiciaire ou évaluatif sans imposer d’emblée le terme doctrinal technique « justifié ».
theological_decisions:
- issue: Sens de δικαιωθῆναι dans une exhortation sapientielle
  choice: être reconnu juste
  alternative: être justifié ; être déclaré juste
  rationale: Le contexte met en garde contre le report de l’obéissance jusqu’à la mort. « Être reconnu juste » conserve la portée ouverte du grec — être trouvé dans son droit ou tenu pour juste — sans importer automatiquement les emplois théologiques techniques plus tardifs de « justification ».
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde le parallélisme des deux interdictions et l’urgence morale du grec, tout en employant l’expression française idiomatique « accomplir un vœu ».
