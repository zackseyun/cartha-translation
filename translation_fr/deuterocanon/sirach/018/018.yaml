  text: A foolish ingrate reproaches[a], and the gift of an envious man wears out the eyes.
translation:
  language: fr
  text: Un insensé ingrat fait des reproches, et le don d’un homme envieux[a] consume les yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le don de celui qui a le mauvais œil », c’est-à-dire d’un donateur envieux, mesquin ou qui donne à contrecœur. Le grec peut évoquer à la fois l’envie et le « mauvais œil ».
    reason: alternative_lexicale
lexical_decisions:
- source_word: μωρὸς
  choice: insensé
  rationale: Le terme caractérise une personne dépourvue de bon sens. « Insensé » conserve le ton proverbial et moral du grec.
- source_word: ἀχάριστος
  choice: ingrat
  rationale: L’adjectif désigne celui qui manque de reconnaissance. « Ingrat » est direct, naturel et garde la force morale de l’expression.
- source_word: ὀνειδιεῖ
  choice: fait des reproches
  rationale: Le verbe signifie adresser des reproches, outrager ou couvrir d’opprobre. Cette tournure française reste proche du grec tout en étant courante.
- source_word: δόσις
  choice: don
  rationale: Le nom peut désigner l’action de donner ou ce qui est donné. Ici, le génitif désignant le donateur favorise le sens concret de « don ».
- source_word: βασκάνου
  choice: d’un homme envieux
  rationale: Le mot peut évoquer l’envie, la malveillance du « mauvais œil » et, dans le contexte du don, une générosité réticente. « Homme envieux » rend directement le grec sans effacer les autres nuances, signalées en note.
- source_word: ἐκτήκει
  choice: consume
  rationale: Le verbe exprime l’idée de faire dépérir, fondre ou s’épuiser progressivement. « Consume » préserve cette image forte avec « les yeux ».
- source_word: ὀφθαλμούς
  choice: les yeux
  rationale: La traduction littérale maintient l’image grecque, dont le sens précis demeure suggestif plutôt que pleinement explicité.
