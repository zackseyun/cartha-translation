  yaml_path: translation/deuterocanon/sirach/018/030.yaml
  text: Do not go after your desires, and restrain yourself from your cravings;
translation:
  language: fr
  text: Ne suis pas tes désirs et retiens-toi de tes appétits.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne va pas à la suite de tes désirs et tiens-toi à l’écart de tes impulsions. »'
    reason: Alternative lexicale pour l’expression ὀπίσω … πορεύου et pour ὀρέξεις.
lexical_decisions:
- source_word: Ὀπίσω … μὴ πορεύου
  choice: Ne va pas à la suite de
  rationale: L’expression grecque évoque le fait de suivre ou de poursuivre quelque chose. Cette tournure conserve l’image tout en restant claire en français moderne.
- source_word: τῶν ἐπιθυμιῶν σου
  choice: tes désirs
  rationale: Le terme désigne largement les désirs et n’a pas nécessairement un sens sexuel. « Désirs » préserve cette étendue sémantique dans le contexte d’une mise en garde morale.
- source_word: ἀπὸ τῶν ὀρέξεών σου
  choice: de tes appétits
  rationale: ὄρεξις désigne un appétit, une inclination ou une forte impulsion. « Appétits » le distingue de ἐπιθυμίαι sans restreindre le propos aux envies alimentaires.
- source_word: κωλύου
  choice: retiens-toi
  rationale: L’impératif moyen exprime ici l’action de se contenir ou de s’empêcher soi-même. « Retiens-toi » rend naturellement cette valeur réflexive.
theological_decisions:
- issue: Portée morale du vocabulaire du désir
  choice: Employer « désirs » et « appétits » sans les limiter à la convoitise sexuelle.
  alternative: « Convoitises » et « pulsions »
  rationale: Le contexte présente ces mouvements comme devant être maîtrisés, mais les mots grecs gardent une portée générale. La traduction conserve donc l’avertissement éthique sans préciser indûment la nature des désirs.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier correspond aux formes grecques de deuxième personne du singulier. La formulation conserve le parallélisme des deux impératifs.
