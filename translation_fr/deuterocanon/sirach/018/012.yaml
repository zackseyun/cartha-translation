  text: He saw and recognized that their destruction was evil[b][a]; therefore he multiplied his atonement for them.
translation:
  language: fr
  text: Il vit et reconnut que leur ruine était malheureuse[a] ; c’est pourquoi il multiplia son expiation[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mauvaise », « funeste » ou « misérable ».
    reason: Le grec πονηρά peut caractériser cette ruine comme mauvaise, funeste ou misérable, sans préciser à lui seul s’il s’agit d’un mal moral ou d’une condition lamentable.
  - marker: b
    text: Ou « il rendit abondante son expiation ».
    reason: Le grec associe le verbe « multiplier, augmenter » au nom ἐξιλασμός, qui peut désigner l’expiation ou le moyen par lequel la faute est expiée.
lexical_decisions:
- source_word: ἶδεν
  choice: Il vit
  rationale: L’aoriste de ὁράω exprime simplement le fait de voir ou de percevoir ; « il vit » conserve cette sobriété.
- source_word: ἐπέγνω
  choice: reconnut
  rationale: Le composé suggère une connaissance ou une prise de conscience plus complète, ce qui maintient la progression entre voir et reconnaître.
- source_word: τὴν καταστροφὴν αὐτῶν
  choice: leur ruine
  rationale: καταστροφή désigne ici une issue désastreuse, une ruine ou une destruction. « Leur ruine » est proche du grec et naturel en français.
- source_word: ὅτι πονηρά
  choice: était pénible
  rationale: Le féminin πονηρά qualifie καταστροφή et peut exprimer ce qui est mauvais, funeste ou pénible. Dans ce contexte, « pénible » décrit le caractère lamentable de leur sort sans lui imposer nécessairement une qualification morale.
- source_word: διὰ τοῦτο
  choice: c’est pourquoi
  rationale: Cette locution rend clairement le lien de conséquence exprimé par le grec.
- source_word: ἐπλήθυνεν
  choice: multiplia
  rationale: Le verbe signifie littéralement augmenter ou rendre abondant ; « multiplia » conserve l’image forte du texte.
- source_word: τὸν ἐξιλασμὸν αὐτοῦ
  choice: son œuvre d’expiation
  rationale: ἐξιλασμός désigne l’expiation ou le moyen d’obtenir le pardon. « Son œuvre d’expiation » garde le poids théologique du terme tout en rendant la formulation française plus naturelle ; aucun complément « pour eux » n’est ajouté, puisqu’il n’est pas explicite en grec.
theological_decisions:
- issue: Sens de ἐξιλασμός
  choice: œuvre d’expiation
  alternative: pardon / propitiation
  rationale: « Expiation » conserve l’idée de traitement ou d’effacement de la faute portée par le terme grec. « Pardon » serait plus accessible mais moins précis, tandis que « propitiation » orienterait davantage l’interprétation et serait plus technique.
translation_notes:
  register: Français moderne, digne et lisible. La formulation reste proche de la syntaxe grecque tout en évitant une expression trop artificielle. Les notes préservent l’amplitude sémantique de πονηρά et de ἐξιλασμός.
