translation:
  language: fr
  text: Qu’est-ce que l’être humain, et quelle est son utilité[a] ? Quel est son bien[b], et quel est son mal[c] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son usage » ou « sa fonction ». Le grec χρῆσις évoque l’usage, l’emploi ou la valeur pratique, sans signifier nécessairement le « but ».
    reason: lexical_alternative
  - marker: b
    text: « Son bien » peut désigner ce qui est bon en lui, ce qui lui appartient comme bien, ou l’avantage qui vient de lui.
    reason: preserve_ambiguity
  - marker: c
    text: Le grec κακόν peut désigner le mal moral, mais aussi plus largement ce qui est mauvais, nuisible ou adverse.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: qu’est-ce que / quelle est / quel est
  rationale: L’interrogatif répété introduit des questions rhétoriques sur la condition et la valeur de l’être humain. La variation grammaticale française respecte le genre des noms tout en conservant la répétition du grec.
- source_word: ἄνθρωπος
  choice: l’être humain
  rationale: Le singulier grec est générique. « L’être humain » exprime naturellement en français moderne la personne humaine ou l’humanité considérée en un individu, sans transformer le singulier en pluriel.
- source_word: χρῆσις
  choice: utilité
  rationale: Le mot peut désigner l’usage, l’emploi ou la valeur pratique. « Utilité » garde la question abrupte du grec sans lui imposer la notion plus téléologique de « but ».
- source_word: ἀγαθόν
  choice: bien
  rationale: Le substantif neutre est opposé directement à κακόν. « Bien » préserve sa portée large, qui peut être morale, existentielle ou avantageuse.
- source_word: κακόν
  choice: mal
  rationale: En contraste avec ἀγαθόν, le terme désigne le mal ou ce qui est mauvais, nuisible ou adverse. « Mal » maintient la force et l’étendue du contraste.
- source_word: αὐτοῦ
  choice: son
  rationale: Le pronom génitif répété renvoie au singulier ἄνθρωπος. Le possessif français conserve la formulation compacte et son ambiguïté relationnelle.
theological_decisions:
- issue: Référence générique à l’humanité au singulier
  choice: l’être humain… son
  alternative: l’homme… son
  rationale: Le grec emploie ἄνθρωπος au singulier dans un sens générique, sans mettre spécifiquement l’accent sur le sexe masculin. « L’être humain » est précis, actuel et maintient le singulier ainsi que les possessifs.
- issue: Portée morale ou pragmatique de κακόν
  choice: mal
  alternative: ce qui est mauvais / tort / dommage
  rationale: Dans l’antithèse ἀγαθόν–κακόν, « mal » conserve la possible portée morale sans exclure le mal subi, le dommage ou l’adversité.
- issue: Sens de χρῆσις appliqué à l’être humain
  choice: utilité
  alternative: usage / fonction / but
  rationale: « Utilité » rend la valeur ou l’emploi pratique suggéré par le grec. « But » préciserait indûment une finalité, tandis que « usage » serait plus littéral mais moins naturel et pourrait suggérer qu’une personne est simplement un objet.
translation_notes:
  register: Formulation sapientielle brève et solennelle, mais intelligible en français international moderne. La répétition de « quel est son… » conserve le parallélisme du grec; « l’être humain » évite que le générique soit compris comme visant seulement l’homme de sexe masculin.
