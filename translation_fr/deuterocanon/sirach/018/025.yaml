  text: Remember the time of famine in the time of plenty[a], and poverty and need in the days of wealth.
translation:
  language: fr
  text: Souviens-toi du temps de la famine au temps de l’abondance[a], de la pauvreté et du dénuement aux jours de la richesse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la saison de la famine pendant la saison de l’abondance ». Le grec oppose des périodes de pénurie et de plénitude.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητι
  choice: Souviens-toi
  rationale: L’impératif aoriste appelle à une prise de conscience délibérée. « Souviens-toi » est direct, naturel et conserve la force exhortative.
- source_word: καιρὸν λιμοῦ
  choice: du temps de la famine
  rationale: καιρός désigne un temps ou une période déterminée, et λιμός une famine plutôt que la simple faim. Cette formulation maintient le contraste concret du grec.
- source_word: ἐν καιρῷ πλησμονῆς
  choice: au temps de l’abondance
  rationale: πλησμονή exprime la plénitude ou l’abondance, ici sur le plan matériel. « Abondance » forme une antithèse claire avec « famine ».
- source_word: πτωχείαν
  choice: de la pauvreté
  rationale: πτωχεία désigne l’état de pauvreté. Le terme français est précis, courant et digne.
- source_word: ἔνδειαν
  choice: du dénuement
  rationale: ἔνδεια désigne le manque, la privation ou le besoin. « Dénuement » préserve une nuance distincte de « pauvreté » et convient à la gravité du contexte.
- source_word: ἐν ἡμέραις πλούτου
  choice: aux jours de la richesse
  rationale: πλοῦτος signifie richesse ou biens. Cette expression conserve l’image temporelle et le parallélisme du grec sans les remplacer par une abstraction comme « prospérité ».
theological_decisions:
- issue: Faut-il transformer le verset en maxime générale annonçant que les temps difficiles peuvent revenir ?
  choice: 'Conserver les oppositions concrètes : famine/abondance et pauvreté/dénuement face à la richesse.'
  alternative: 'Paraphraser : « Dans les bons jours, rappelle-toi que les mauvais peuvent venir. »'
  rationale: Le grec énonce des réalités économiques précises dans un parallélisme de sagesse. Une généralisation explicative ajouterait une conclusion que le texte laisse implicite.
translation_notes:
  register: Français moderne international, naturel et digne. Le parallélisme du grec est conservé, ainsi que son vocabulaire économique concret. « Dénuement » distingue ἔνδεια de πτωχεία sans alourdir excessivement la phrase.
