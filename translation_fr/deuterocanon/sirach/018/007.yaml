  yaml_path: translation/deuterocanon/sirach/018/007.yaml
  text: When a man has finished[a], then he is just beginning; and when he stops[b], then he will be at a loss.
translation:
  language: fr
  text: Quand un être humain a fini[a], alors il commence ; et quand il s’arrête, alors il sera désemparé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « achève » ou « mène à son terme ». Le grec ne précise pas ce qui est achevé.
    reason: lexical_alternative
  - marker: b
    text: Ou « il sera perplexe » ou « il sera déconcerté ». Le grec évoque le fait d’être sans ressource, sans savoir comment avancer ou répondre.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: quand
  rationale: Introduit une condition temporelle générale. « Quand » est naturel en français et conserve la concision proverbiale.
- source_word: συντελέσῃ
  choice: arrive au terme
  rationale: Le verbe exprime l’action de mener à son terme ou d’achever. Cette formulation conserve l’ambiguïté sur ce qui est achevé tout en préparant le paradoxe avec « commence ».
- source_word: ἄνθρωπος
  choice: un être humain
  rationale: Le nom désigne ici une personne de manière générique. « Un être humain » est inclusif, digne et fidèle à la portée universelle de la maxime.
- source_word: τότε ἄρχεται
  choice: c’est alors qu’il commence
  rationale: Rend directement l’idée de commencement et souligne, par la tournure française, le contraste paradoxal avec l’arrivée au terme.
- source_word: παύσηται
  choice: il s’arrête
  rationale: Traduction simple et actuelle de la cessation, sans préciser indûment s’il s’agit du travail, de la recherche ou de la vie.
- source_word: ἀπορηθήσεται
  choice: il se trouve désemparé
  rationale: Le verbe évoque le fait d’être sans issue, sans ressource ou perplexe. « Se trouver désemparé » préserve à la fois l’impossibilité d’avancer et l’incertitude intellectuelle.
theological_decisions:
- issue: Portée de la maxime sur les limites humaines
  choice: 'Conserver un paradoxe général : lorsqu’un être humain atteint un terme, il ne fait pourtant que commencer ; lorsqu’il cesse, il demeure sans issue.'
  alternative: Limiter la phrase à l’incessant travail humain ou y voir explicitement une allusion à la mort.
  rationale: Le grec est bref et ne nomme ni le travail ni la mort. La traduction maintient donc l’ouverture et la tension de la maxime sans en imposer une interprétation particulière.
translation_notes:
  register: Français international moderne, sobre et proverbial. La répétition de « c’est alors » reproduit l’insistance de τότε et renforce le parallélisme. Le texte évite de préciser l’objet des verbes afin de préserver l’ambiguïté du grec.
