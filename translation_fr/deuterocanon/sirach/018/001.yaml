  source_fidelity: '« Celui qui vit éternellement » rend fidèlement le participe substantivé Ὁ ζῶν avec εἰς τὸν αἰῶνα, sans ajouter un titre divin absent du grec. « a créé toutes choses » correspond exactement à ἔκτισεν τὰ πάντα. « dans leur ensemble » est une solution défendable pour κοινῇ : elle exprime la considération collective ou globale sans transformer nécessairement l’adverbe en indication stricte de simultanéité.'
  naturalness: Le français est clair, digne et naturel dans un registre biblique moderne international. « Toutes choses » convient au registre légèrement élevé du texte. La tournure « dans leur ensemble », quoique plus explicative que littérale, reste lisible et évite l’ambiguïté temporelle que « ensemble » pourrait susciter.
