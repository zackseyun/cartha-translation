  text: The one who lives forever created all things at once[a].
translation:
  language: fr
  text: Celui qui vit éternellement a créé toutes choses dans leur ensemble[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « a créé toutes choses ensemble » ou « a créé toutes choses en commun ». L’adverbe grec κοινῇ est concis et peut souligner la création tout entière considérée comme un tout.'
    reason: alternative lexicale
lexical_decisions:
- source_word: Ὁ ζῶν
  choice: Celui qui vit
  rationale: Le participe présent grec avec article est substantivé. « Celui qui vit » reste naturel en français moderne tout en conservant la formulation descriptive du grec.
- source_word: εἰς τὸν αἰῶνα
  choice: éternellement
  rationale: Cette expression indique une durée sans fin. « Éternellement » s’intègre naturellement à la proposition relative et en préserve la portée.
- source_word: ἔκτισεν
  choice: a créé
  rationale: Dans ce contexte cosmologique, κτίζω désigne l’acte de faire venir à l’existence ; « créer » en est l’équivalent français le plus précis.
- source_word: τὰ πάντα
  choice: toutes choses
  rationale: L’expression grecque englobe la totalité de ce qui existe. « Toutes choses » convient au registre élevé du passage sans expliciter davantage que le texte.
- source_word: κοινῇ
  choice: dans leur ensemble
  rationale: L’adverbe peut signifier « en commun » ou « collectivement ». « Dans leur ensemble » exprime ici la totalité envisagée comme un tout, sans imposer l’idée temporelle plus précise de simultanéité.
theological_decisions:
- issue: Identification du sujet comme Dieu en l’absence d’un nom divin explicite
  choice: Celui qui vit éternellement
  alternative: Dieu, qui vit éternellement ; Le Seigneur, qui vit éternellement
  rationale: Le grec désigne le sujet par une formule participiale descriptive, sans employer θεός ni κύριος. La traduction conserve cette formulation et laisse l’identification théologique ressortir du contexte.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la désignation descriptive du sujet et maintient l’ambiguïté de κοινῇ au moyen d’une note, sans réduire ce terme à la seule idée de simultanéité.
