  yaml_path: translation/deuterocanon/sirach/018/024.yaml
  text: Remember wrath in the days of your end[b][a], and the time of vengeance at the turning away of the face.
translation:
  language: fr
  text: Souviens-toi de la colère[a] aux jours de ta fin, et du temps de la vengeance, quand le visage se détourne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « courroux ». Le mot grec désigne une forte colère; ici, le contexte évoque probablement la colère liée au jugement divin.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « lors du détournement d’un visage ». Il s’agit probablement du retrait de la faveur divine, mais le grec ne précise pas à qui appartient ce visage.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητι
  choice: Souviens-toi
  rationale: L’impératif aoriste appelle à garder présente à l’esprit une réalité décisive. « Souviens-toi » est direct, naturel et fidèle.
- source_word: θυμοῦ
  choice: colère
  rationale: θυμός peut désigner une forte colère, voire le courroux. « Colère » est moderne et digne, et laisse le contexte indiquer qu’il s’agit vraisemblablement de la colère manifestée dans le jugement.
- source_word: ἐν ἡμέραις τελευτῆς
  choice: aux jours de ta fin
  rationale: τελευτή peut signifier la fin ou la mort. Cette formulation conserve l’image grecque et son caractère solennel sans réduire explicitement la fin aux seuls jours précédant la mort.
- source_word: καιρὸν
  choice: du temps
  rationale: Dans la coordination avec « de la colère », le français appelle naturellement « du temps »; le complément « de la vengeance » identifie ce moment particulier.
- source_word: ἐκδικήσεως
  choice: vengeance
  rationale: ἐκδίκησις peut évoquer la vengeance, le châtiment ou la revendication du droit. Dans ce contexte de colère et de fin, « vengeance » rend au plus près la dimension punitive sans nommer explicitement celui qui l’exerce.
- source_word: ἐν ἀποστροφῇ προσώπου
  choice: quand le visage se détourne
  rationale: Cette tournure naturelle conserve l’image littérale du visage qui se détourne et ne précise ni l’identité de son possesseur ni la portée exacte du geste.
theological_decisions:
- issue: L’identité de celui dont relèvent la colère, la vengeance et le visage détourné
  choice: Laisser le sujet implicite dans le texte principal
  alternative: Nommer explicitement Dieu et interpréter les trois expressions comme son jugement
  rationale: Le contexte suggère fortement le jugement divin, mais le grec ne nomme pas Dieu. Le maintien de l’implicite préserve l’ambiguïté et la tension théologique du texte source.
- issue: La portée de ἐκδίκησις
  choice: Traduire par « vengeance »
  alternative: Traduire par « châtiment » ou « rétribution »
  rationale: « Vengeance » conserve le lien lexical avec l’action de faire justice et la force de l’avertissement, tout en évitant de résoudre la question de savoir s’il s’agit exclusivement d’un châtiment.
translation_notes:
  register: Français international actuel, sobre et solennel. La syntaxe reste proche du parallélisme grec, tandis que « quand le visage se détourne » évite une nominalisation lourde. Les images de la fin, de la vengeance et du visage sont conservées sans explicitation confessionnelle.
