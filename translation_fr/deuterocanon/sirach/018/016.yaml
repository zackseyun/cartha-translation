  text: Before you make a vow[a], prepare your vow[b], and do not be like one who tests Yahweh.
translation:
  language: fr
  text: Avant de faire un vœu, prépare ce que tu vas vouer[a] ; ne sois pas comme quelqu’un qui met Yahweh à l’épreuve.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu est difficile et peut aussi se comprendre plus simplement comme « prépare ton vœu ». Le sens général est qu’il faut être prêt à accomplir un vœu avant de le faire.
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec diffère fortement : « La rosée ne rafraîchit-elle pas la chaleur ? Ainsi, une parole vaut mieux qu’un don. » Il semble refléter une autre forme du texte.'
    reason: textual_variant
lexical_decisions:
- source_word: בְּטֶרֶם תִּדּוֹר
  choice: Avant de faire un vœu
  rationale: La tournure exprime clairement qu’une préparation doit précéder l’engagement. « Faire un vœu » est idiomatique en français moderne.
- source_word: הָכֵן
  choice: prépare
  rationale: L’impératif demande de se tenir prêt et de prendre les dispositions nécessaires avant de s’engager.
- source_word: נִדְרֶךָ
  choice: ton vœu
  rationale: Cette traduction directe préserve la formulation concise de l’hébreu sans préciser de manière indue s’il s’agit du contenu du vœu ou des moyens de l’accomplir.
- source_word: בַּל תִּהְיֶה
  choice: ne sois pas
  rationale: Rend naturellement en français la défense exprimée par la particule négative et le verbe.
- source_word: כִּמְנַסָּה
  choice: comme quelqu’un qui met … à l’épreuve
  rationale: Le participe issu de נסה désigne celui qui teste ou éprouve ; « mettre à l’épreuve » convient bien lorsqu’il a Dieu pour objet.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent explicitement dans le texte hébreu.
theological_decisions:
- issue: Sens de « mettre Yahweh à l’épreuve »
  choice: Conserver l’expression sans en préciser la portée
  alternative: « provoquer Yahweh » ou expliciter que le vœu irréfléchi met Dieu à l’épreuve
  rationale: Le texte établit le rapprochement sans expliquer comment un vœu non préparé constitue une mise à l’épreuve de Dieu ; la traduction conserve cette tension.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme ; « Yahweh » préserve ici le caractère de nom propre.
translation_notes:
  register: Français moderne, sobre et sapientiel. Le tutoiement singulier correspond à l’adresse individuelle de l’hébreu. La ponctuation sépare nettement les deux impératifs tout en maintenant leur lien logique.
