  text: Before you speak[a], learn; and before sickness, seek treatment.
translation:
  language: fr
  text: Avant de parler, instruis-toi ; avant la maladie, prends soin de toi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « soigne-toi » ou « prends des remèdes ». Le verbe grec peut signifier prendre soin, soigner ou traiter médicalement.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὶν ἢ λαλῆσαι
  choice: Avant de parler
  rationale: La locution temporelle πρὶν ἢ avec l’infinitif indique qu’une action doit en précéder une autre. « Avant de parler » est direct et naturel en français.
- source_word: μάνθανε
  choice: instruis-toi
  rationale: L’impératif de μανθάνω invite à apprendre ou à acquérir les connaissances nécessaires. « Instruis-toi » fonctionne sans complément exprimé et convient à l’exhortation sapientielle.
- source_word: πρὸ ἀρρωστίας
  choice: avant la maladie
  rationale: πρό marque ici l’antériorité temporelle, tandis que ἀρρωστία désigne la maladie ou l’état de faiblesse physique. La formulation concise conserve le parallélisme du grec.
- source_word: θεραπεύου
  choice: prends soin de toi
  rationale: L’impératif peut signifier prendre soin, soigner ou traiter. Dans l’expression « avant la maladie », « prends soin de toi » rend naturellement la portée préventive sans faire croire que la maladie est déjà présente.
