    rationale: Le grec dit littéralement, de façon elliptique, « ainsi [sont] quelques années dans un jour d’éternité »; il n’énonce pas « ne sont presque rien ». Cette formulation interprète légitimement l’image, mais ajoute une prédication absente de la source.
