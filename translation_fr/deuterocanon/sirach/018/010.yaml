  text: Like a drop of water from the sea and a grain of sand[b][a], so are a few years in the day of eternity.
translation:
  language: fr
  text: Comme une goutte d’eau de la mer et un grain de sable[a], ainsi en est-il de quelques années dans le jour de l’éternité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un petit caillou de sable ». Le mot grec désigne souvent un caillou, mais il évoque probablement ici un seul grain, puisqu’il est associé au sable.
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « dans le jour de l’âge ». L’expression grecque, très concise, peut désigner ici l’immensité d’une durée éternelle.'
    reason: alternative_reading
lexical_decisions:
- source_word: σταγὼν ὕδατος ἀπὸ θαλάσσης
  choice: une goutte d’eau prise à la mer
  rationale: La formulation conserve l’image d’une seule goutte provenant de l’immensité de la mer; « prise à » rend naturellement en français le rapport exprimé par ἀπό.
- source_word: ψῆφος ἄμμου
  choice: un grain de sable
  rationale: Bien que ψῆφος désigne souvent un caillou ou une petite pierre, le complément ἄμμου invite ici à comprendre une particule individuelle de sable.
- source_word: ὀλίγα ἔτη
  choice: quelques années
  rationale: Cette expression française courante rend directement la brièveté de la vie humaine.
- source_word: ἐν ἡμέρᾳ αἰῶνος
  choice: dans le jour de l’éternité
  rationale: Cette traduction garde l’image singulière et compacte du grec tout en exprimant le contraste avec l’immensité de la durée.
- source_word: οὕτως
  choice: ainsi
  rationale: « Ainsi » introduit dignement et naturellement le second terme de la comparaison.
theological_decisions:
- issue: Sens de αἰών dans l’expression ἐν ἡμέρᾳ αἰῶνος
  choice: l’éternité
  alternative: l’âge
  rationale: Le contexte oppose quelques années humaines à une durée immense. « Éternité » communique clairement ce contraste, tandis qu’une note préserve la formulation plus littérale et son ambiguïté.
- issue: Valeur implicite de la comparaison
  choice: ne sont presque rien
  alternative: sont ainsi
  rationale: Le grec juxtapose les images et « quelques années » sans expliciter leur insignifiance. Le français exige ici un lien plus naturel; « ne sont presque rien » exprime l’implication comparative sans lui attribuer une précision doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, naturel et digne. La structure comparative et les images concrètes du grec sont conservées; une légère explicitation (« ne sont presque rien ») assure une syntaxe idiomatique et rend la force de la comparaison.
