  text: If you grant your soul the pleasure it desires[a], it will make you a joy to your enemies.
translation:
  language: fr
  text: Si tu accordes à ton âme le plaisir qu’elle désire[a], cela fera de toi un sujet de joie pour tes ennemis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si tu cèdes aux désirs de ton âme, tu deviendras un sujet de jubilation pour tes ennemis. »'
    reason: Alternative lexicale qui explicite la complaisance envers les désirs et la joie malveillante des ennemis.
lexical_decisions:
- source_word: ἐὰν
  choice: Si
  rationale: Introduit directement la condition qui structure cet avertissement proverbial.
- source_word: χορηγήσεις
  choice: tu accordes
  rationale: Rend l’idée de fournir ou d’octroyer quelque chose à son âme, sans expliciter davantage l’idée contextuelle de complaisance.
- source_word: τῇ ψυχῇ σου
  choice: à ton âme
  rationale: Conserve le terme grec ψυχή et l’image de la vie intérieure, plutôt que de le réduire d’emblée à « toi-même » ou à « tes appétits ».
- source_word: εὐδοκίαν ἐπιθυμίας
  choice: le plaisir qu’elle désire
  rationale: Exprime naturellement le plaisir ou la satisfaction liés au désir, tout en évitant le sens sexuel trop étroit que pourrait suggérer « convoitise ».
- source_word: ποιήσει σε
  choice: elle fera de toi
  rationale: Le pronom reprend naturellement « ton âme » en français; la tournure conserve le sens causatif du grec.
- source_word: ἐπίχαρμα
  choice: un sujet de joie
  rationale: Désigne ce dont d’autres se réjouissent. La formule garde l’image grecque sans imposer l’interprétation plus précise de « risée ».
- source_word: τῶν ἐχθρῶν σου
  choice: pour tes ennemis
  rationale: Avec « sujet de joie », « pour » exprime idiomatiquement que les ennemis trouvent dans le sort de la personne une occasion de se réjouir.
theological_decisions:
- issue: Portée anthropologique de ψυχή
  choice: Conserver « âme » dans le texte principal
  alternative: « toi-même » ou « tes appétits »
  rationale: Le propos porte sur le désir intérieur et la maîtrise de soi, sans formuler une doctrine technique de l’âme. Le maintien d’« âme » respecte néanmoins le mot grec explicite.
- issue: Nuance hostile de ἐπίχαρμα τῶν ἐχθρῶν σου
  choice: « un sujet de joie pour tes ennemis »
  alternative: « la risée de tes ennemis » ou « quelqu’un dont tes ennemis se réjouiront »
  rationale: Le grec présente la personne comme une cause de réjouissance pour ses ennemis, probablement à la suite de sa ruine. La traduction retenue préserve cette image et sa part d’implicite.
translation_notes:
  register: Français international moderne, digne et proverbial. Le tutoiement singulier reflète l’adresse personnelle du grec. « Sujet de joie » est plus naturel que le littéral « joie » tout en préservant l’ambiguïté de ἐπίχαρμα.
