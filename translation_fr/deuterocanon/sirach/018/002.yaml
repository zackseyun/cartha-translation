translation:
  language: fr
  text: Le Seigneur seul sera reconnu juste[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sera déclaré juste», «sera justifié» ou «verra sa justice reconnue». Le verbe grec peut avoir une portée déclarative ou exprimer la reconnaissance publique de sa justice.
    reason: alternative_lexicale
lexical_decisions:
- source_word: Κύριος
  choice: Le Seigneur
  rationale: Titre usuel et naturel en français pour κύριος; l’article défini convient à l’emploi substantivé dans ce contexte.
- source_word: μόνος
  choice: seul
  rationale: 'Exprime directement l’exclusivité: nul autre ne partage cette reconnaissance.'
- source_word: δικαιωθήσεται
  choice: sera reconnu juste
  rationale: Le futur passif de δικαιόω peut exprimer une déclaration ou une confirmation de justice. «Sera reconnu juste» conserve la voix passive et la notion de justice, tout en évitant que «sera justifié» suggère nécessairement l’acquittement d’une faute.
theological_decisions:
- issue: Sens de δικαιωθήσεται dans cette brève affirmation sapientielle
  choice: sera reconnu juste
  alternative: sera justifié; sera déclaré juste; sa justice sera reconnue
  rationale: Le grec permet une valeur déclarative ou vindicative. La formulation retenue maintient cette tension sans laisser entendre que le Seigneur aurait besoin d’être rendu juste.
- issue: Signalement de validation «major_mismatch» sans témoin parallèle fourni
  choice: Traduire sobrement le texte grec transmis, sans l’étoffer
  alternative: Reconstruire un texte plus long à partir d’autres traditions textuelles
  rationale: Le texte grec fourni est grammaticalement clair. En l’absence d’autre témoin source dans la demande, aucune reconstruction n’est introduite.
translation_notes:
  register: Français international moderne, bref et solennel. «Reconnu juste» demeure accessible tout en préservant l’ambiguïté du passif grec.
