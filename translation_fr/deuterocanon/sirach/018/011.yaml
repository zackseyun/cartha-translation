lexical_decisions:
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Cette tournure exprime naturellement en français le lien causal avec le contexte précédent.
- source_word: ἐμακροθύμησεν
  choice: a été patient
  rationale: Le verbe désigne la patience prolongée ou la retenue face à la colère. Cette formulation est claire, actuelle et fidèle.
- source_word: Κύριος
  choice: le Seigneur
  rationale: Le titre divin κύριος se rend naturellement ici par « le Seigneur ».
- source_word: ἐπʼ αὐτοῖς
  choice: envers eux
  rationale: Avec l’idée de patience, « envers eux » restitue naturellement l’orientation exprimée par ἐπί.
- source_word: ἐξέχεεν
  choice: a répandu
  rationale: Le verbe signifie littéralement verser ou répandre et conserve l’image concrète du texte grec.
- source_word: τὸ ἔλεος αὐτοῦ
  choice: sa miséricorde
  rationale: ἔλεος désigne la miséricorde ou la compassion; « miséricorde » convient au registre biblique tout en restant intelligible.
- source_word: ἐπʼ αὐτοὺς
  choice: sur eux
  rationale: Cette expression préserve simplement l’image de la miséricorde répandue sur ses bénéficiaires.
theological_decisions:
- issue: Traduction du titre divin κύριος
  choice: le Seigneur
  alternative: Seigneur
  rationale: L’article défini est idiomatique en français lorsque le titre désigne Dieu dans cette construction.
- issue: Portée de ἔλεος
  choice: sa miséricorde
  alternative: sa compassion
  rationale: « Miséricorde » conserve la dimension d’une bonté accordée à ceux qui dépendent de la clémence divine, sans exclure la compassion.
translation_notes:
  register: Français international moderne, simple et digne. La métaphore de l’effusion est conservée sans formulation archaïque.
