  text: A wise man will be cautious in everything[b][a], and in days of sins he will beware of wrongdoing.
translation:
  language: fr
  text: L’homme sage se montrera prudent en toute chose[a] et, aux jours marqués par les péchés[b], il veillera à ne pas commettre de faute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « fera preuve de révérence en toute chose » : le verbe grec peut exprimer aussi bien une crainte respectueuse qu’une prudente circonspection ; le contexte favorise ici la prudence morale.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement « aux jours des péchés », c’est-à-dire probablement dans des temps marqués par le péché ou la tentation.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος σοφὸς
  choice: L’homme sage
  rationale: Le syntagme désigne, sous une forme proverbiale au masculin singulier, celui qui possède une sagesse pratique et morale. « L’homme sage » conserve cette forme représentative du grec.
- source_word: ἐν παντὶ
  choice: en toute chose
  rationale: Cette expression garde la portée générale du grec dans un français naturel et digne.
- source_word: εὐλαβηθήσεται
  choice: se montrera prudent
  rationale: Le verbe peut exprimer la circonspection ou la révérence. Le parallélisme avec l’attention portée à éviter la faute favorise ici la prudence morale, tout en signalant l’autre sens en note.
- source_word: ἐν ἡμέραις ἁμαρτιῶν
  choice: aux jours marqués par les péchés
  rationale: Cette formulation conserve l’image littérale des « jours » et le pluriel « péchés », tout en explicitant sobrement qu’il s’agit de temps caractérisés par eux.
- source_word: προσέξει ἀπὸ
  choice: il veillera à éviter
  rationale: προσέχω exprime l’attention vigilante, et ἀπό marque ici l’éloignement ou l’évitement. La tournure française restitue les deux éléments sans raideur.
- source_word: πλημμελίας
  choice: toute faute
  rationale: Le terme désigne une faute, un manquement ou un acte répréhensible. « Faute » préserve sa largeur sémantique; « toute » rend naturellement en français la portée indéfinie, sans transformer le mot en catégorie juridique précise.
theological_decisions:
- issue: Sens de εὐλαβηθήσεται dans cette maxime sapientielle
  choice: prudence morale
  alternative: révérence ou crainte respectueuse
  rationale: Le membre parallèle, qui évoque la vigilance visant à éviter une faute, oriente vers la circonspection pratique. La possibilité d’un sens religieux ou révérenciel n’est toutefois pas supprimée et figure en note.
- issue: Masculin générique de ἄνθρωπος
  choice: L’homme sage
  alternative: La personne sage
  rationale: Le français au masculin singulier reproduit la forme proverbiale et représentative du grec, sans ajouter une restriction aux seuls hommes.
- issue: Portée de ἡμέραις ἁμαρτιῶν
  choice: des temps caractérisés par les péchés
  alternative: des jours où l’individu pèche
  rationale: Le génitif demeure ambigu quant à l’auteur des péchés. La traduction évite d’attribuer explicitement ces péchés au sage et conserve l’idée générale de périodes marquées par le péché ou la tentation.
translation_notes:
  register: Français international moderne, clair et digne, avec une tournure proverbiale. Les marqueurs [a] et [b] sont placés immédiatement après les expressions qu’ils éclairent. La syntaxe reste proche du parallélisme grec sans calquer ses constructions.
