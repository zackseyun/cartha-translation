  text: 'Le nombre des jours d’un être humain est de nombreuses années : cent ans.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀριθμὸς ἡμερῶν ἀνθρώπου
  choice: Le nombre des jours d’un être humain
  rationale: Rend directement l’expression grecque tout en employant une formulation inclusive et naturelle pour ἀνθρώπου, qui désigne ici l’être humain en général.
- source_word: πολλὰ ἔτη
  choice: même s’il vit de nombreuses années
  rationale: Le grec est elliptique et littéralement proche de « de nombreuses années »; l’explicitation verbale produit une phrase française intelligible sans effacer l’idée de longévité.
- source_word: ἑκατόν
  choice: cent ans
  rationale: Le numéral isolé reprend implicitement « années »; celui-ci est donc exprimé en français.
theological_decisions:
- issue: Portée du chiffre cent
  choice: Présenter cent ans comme la mesure proverbiale d’une longue vie humaine
  alternative: Ajouter « au plus » ou « tout au plus »
  rationale: Le grec ne contient aucun équivalent explicite de « au plus ». La traduction conserve donc la formulation sentencieuse et sa tension avec les exceptions possibles, sans transformer le chiffre en plafond absolu.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe grecque très condensée est légèrement explicitée pour être naturelle, sans ajouter la notion absente de maximum absolu.
