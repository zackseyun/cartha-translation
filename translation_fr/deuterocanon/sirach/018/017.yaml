  text: Is not a word better than a good gift? And both are with a gracious man[a][b].
translation:
  language: fr
  text: Une parole ne vaut-elle pas mieux qu’un beau cadeau ? Les deux se trouvent chez un homme bienveillant[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chez un homme aimable » ou « comblé de faveur ». Le terme grec peut évoquer la bienveillance ou le fait d’être favorisé.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἰδοὺ
  choice: ne… pas ?
  rationale: La tournure introduit une question rhétorique. En français actuel, l’interrogation négative en restitue naturellement la force sans rendre littéralement ἰδού.
- source_word: λόγος
  choice: une parole
  rationale: Dans ce contexte, λόγος désigne une parole prononcée, mise en contraste avec un don matériel. « Une parole » conserve la concision proverbiale.
- source_word: ὑπὲρ
  choice: vaut… mieux que
  rationale: La préposition exprime ici la supériorité comparative. « Vaut mieux que » est idiomatique et garde la portée évaluative de la maxime.
- source_word: δόμα ἀγαθόν
  choice: un beau cadeau
  rationale: δόμα désigne un don ou un présent, et ἀγαθόν en souligne la qualité. « Beau cadeau » est naturel en français et n’ajoute pas l’idée spécifique de générosité.
- source_word: ἀμφότερα
  choice: les deux
  rationale: Le terme renvoie ensemble à la parole et au cadeau.
- source_word: παρὰ ἀνδρὶ
  choice: se trouvent chez un homme
  rationale: παρά avec le datif indique que ces deux choses sont présentes chez la personne ou caractérisent sa conduite. La formulation française exprime cette appartenance sans la réduire à la possession.
- source_word: κεχαριτωμένῳ
  choice: bienveillant
  rationale: Le participe décrit ici un homme marqué par une disposition favorable, aimable ou gracieuse. « Bienveillant » convient au contexte associant bonne parole et don, tout en évitant le sens français ambigu de « gracieux ».
theological_decisions:
- issue: Masculin singulier représentatif dans une maxime sapientielle
  choice: un homme
  alternative: une personne
  rationale: Le grec porte explicitement ἀνδρί, masculin singulier. La traduction le conserve tout en laissant à la maxime sa portée générale.
- issue: Valeur de κεχαριτωμένῳ
  choice: bienveillant
  alternative: comblé de faveur / plein de grâce
  rationale: Le contexte immédiat porte sur la qualité de la conduite humaine — parole et cadeau — plutôt que sur une affirmation explicite concernant une faveur divine reçue. La traduction évite donc de trancher théologiquement dans ce sens, tandis qu’une note signale l’étendue du terme.
translation_notes:
  register: Français international moderne, proverbial et digne. L’interrogation rhétorique est conservée; « homme » rend le masculin grec, et la note maintient l’ambiguïté de κεχαριτωμένῳ.
