  text: He has allowed no one to proclaim his works.
translation:
  language: fr
  text: Il n’a permis à personne de proclamer ses œuvres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il n’a rendu personne capable de déclarer ses œuvres » ou « Il n’a accordé à personne de proclamer ses œuvres ». Le verbe grec est rare et peut évoquer la permission, l’habilitation ou le fait de rendre possible.
    reason: Variante lexicale liée au sens incertain de ἐξεποίησεν.
lexical_decisions:
- source_word: οὐθενί
  choice: à personne
  rationale: Le datif du pronom négatif dépend de ἐξεποίησεν. « À personne » rend directement la construction grecque tout en restant naturel avec « permettre ».
- source_word: ἐξεποίησεν
  choice: n’a permis
  rationale: Ce verbe rare, suivi de l’infinitif, peut évoquer la permission, l’habilitation ou le fait de rendre possible. « N’a permis » fournit un texte courant et clair sans imposer une causalité plus forte que ne l’exige le contexte.
- source_word: ἐξαγγεῖλαι
  choice: de proclamer
  rationale: L’infinitif de ἐξαγγέλλω désigne une déclaration rendue publique. « Proclamer » en conserve mieux la force que « dire ».
- source_word: τὰ ἔργα αὐτοῦ
  choice: ses œuvres
  rationale: Traduction directe qui garde le lien traditionnel et formel avec les actes de Dieu, sans réduire le sens à des actions morales.
theological_decisions:
- issue: Portée de l’affirmation concernant les œuvres de Dieu
  choice: Le verset affirme que Dieu n’a permis à personne de proclamer ses œuvres.
  alternative: Dieu n’a rendu personne capable de proclamer ses œuvres, ou n’a chargé personne de les annoncer.
  rationale: La formulation grecque est concise, et le verbe rare ἐξεποίησεν laisse subsister une tension entre permission, habilitation et causalité. Le texte principal reste intelligible sans transformer l’énoncé en affirmation doctrinale explicite sur l’impossibilité absolue de connaître ou de raconter les œuvres divines.
translation_notes:
  register: Français international moderne, simple et digne. « Proclamer » conserve la portée publique du verbe grec; « œuvres » maintient la formulation biblique sans archaïsme marqué.
