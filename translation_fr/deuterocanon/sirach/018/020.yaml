  text: Before judgment[a], examine yourself[b], and in the hour of visitation you will find atonement.
translation:
  language: fr
  text: Avant le jugement, examine-toi ; au moment de la visite[a], tu trouveras l’expiation[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’inspection », « de la reddition de comptes » ou « de l’intervention » ; le mot grec peut évoquer un temps d’inspection, de reddition de comptes ou d’intervention, possiblement divine.
    reason: lexical_alternative
  - marker: b
    text: Ou « le moyen d’expiation » ; le terme grec évoque l’effacement de la faute et le rétablissement de la faveur.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ κρίσεως
  choice: Avant le jugement
  rationale: « Jugement » conserve le sens large d’évaluation ou de décision judiciaire, sans le réduire à une condamnation.
- source_word: ἐξέταζε σεαυτόν
  choice: examine-toi
  rationale: L’impératif appelle à un examen personnel attentif. Cette formulation est directe, naturelle et fidèle au réflexif grec.
- source_word: ἐν ὥρᾳ ἐπισκοπῆς
  choice: à l’heure de la visite
  rationale: « Visite » garde la portée biblique de ἐπισκοπή, qui peut évoquer à la fois une inspection, une reddition de comptes et une intervention divine, sans trancher entre ces nuances.
- source_word: εὑρήσεις
  choice: tu trouveras
  rationale: Le futur de εὑρίσκω signifie directement « tu trouveras » ; cette traduction évite d’introduire l’idée plus interprétative d’obtenir.
- source_word: ἐξιλασμόν
  choice: l’expiation
  rationale: « Expiation » exprime l’effacement de la faute et la restauration de la faveur, tout en conservant la portée cultuelle et réconciliatrice du terme grec.
theological_decisions:
- issue: Sens de ἐπισκοπή dans ce contexte sapientiel
  choice: la visite, avec de possibles connotations divines et judiciaires
  alternative: l’inspection ; la reddition de comptes ; l’intervention
  rationale: Le grec peut désigner un moment décisif d’examen ou d’intervention, vraisemblablement de la part de Dieu. « Visite » préserve cette tension au lieu de préciser indûment la nature de l’événement.
- issue: Portée de ἐξιλασμόν
  choice: l’expiation
  alternative: le pardon ; la propitiation ; le moyen d’expiation
  rationale: « Expiation » reste compréhensible en français biblique et conserve l’idée d’enlèvement de la faute. « Pardon » serait plus courant mais trop étroit, tandis que « propitiation » imposerait un vocabulaire plus technique.
translation_notes:
  register: Français moderne, concis et solennel. Le tutoiement singulier reproduit l’adresse directe du grec. Le point-virgule met en relief la relation entre l’examen de soi avant le jugement et l’expiation trouvée au moment de la visite.
