  text: Do not be a glutton and a drunkard[b][a], when there is nothing in your purse.
translation:
  language: fr
  text: Ne sois ni glouton ni ivrogne[a] quand tu n’as rien dans ta bourse.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin grec développe ainsi l’avertissement : « Ne deviens pas pauvre en festoyant avec de l’argent emprunté, alors que tu n’as rien dans ta bourse. »'
    reason: alternative_reading
  - marker: b
    text: Le dernier mot hébreu est difficile. Le grec lit « dans ta bourse », ce qui appuie le sens économique retenu ici.
    reason: textual_variant
lexical_decisions:
- source_word: זוֹלֵל
  choice: glouton
  rationale: Dans la littérature sapientielle hébraïque, le terme désigne couramment celui qui mange avec excès ou dilapide en festins. « Glouton » préserve ici le parallélisme avec l’ivrogne.
- source_word: וְסוֹבֵא
  choice: ni ivrogne
  rationale: Le mot désigne une personne adonnée à l’excès de boisson. La coordination française « ni… ni… » rend naturellement les deux vices visés par l’interdiction.
- source_word: וּמְאוּמָה אֵין
  choice: quand tu n’as rien
  rationale: La proposition exprime l’absence totale de ressources. « Quand » restitue naturellement sa valeur circonstancielle dans l’avertissement.
- source_word: בַּכִּים
  choice: dans ta bourse
  rationale: La forme hébraïque est difficile, mais le grec ἐν μαρσιππίῳ indique clairement une bourse ou poche à argent. Cette formulation conserve le sens économique sans intégrer l’expansion grecque sur l’emprunt.
theological_decisions:
- issue: Rapport entre le témoin hébreu principal et le parallèle grec pour le dernier mot difficile
  choice: Conserver l’interdiction hébraïque visant la gloutonnerie et l’ivrognerie, tout en rendant la fin par « dans ta bourse » à la lumière du grec.
  alternative: « Ne deviens pas pauvre en festoyant avec de l’argent emprunté, alors que tu n’as rien dans ta bourse. »
  rationale: L’hébreu demeure le texte principal là où il est conservé. Le grec éclaire utilement le mot final incertain, mais sa mention explicite de la pauvreté, des festins et de l’emprunt dépasse la formulation hébraïque transmise et n’est donc pas introduite dans le texte principal.
translation_notes:
  register: Français moderne, direct et digne. « Glouton » et « ivrogne » gardent la vigueur morale et le parallélisme du texte hébreu; « bourse » convient au cadre ancien tout en restant immédiatement compréhensible.
