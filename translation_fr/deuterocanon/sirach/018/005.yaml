  text: Who can number the might of his majesty? And who can add to recounting his mercies?[a]
translation:
  language: fr
  text: Qui pourra dénombrer la puissance de sa majesté ? Et qui pourra continuer à raconter ses actes de miséricorde ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « ajouter à raconter ». L'expression signifie poursuivre ou prolonger le récit de ses actes de miséricorde.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράτος
  choice: puissance
  rationale: Le terme désigne une force ou une puissance qui se manifeste; « puissance » convient au registre élevé et à la question rhétorique.
- source_word: μεγαλωσύνης
  choice: majesté
  rationale: Dans ce contexte divin, « majesté » exprime naturellement la grandeur souveraine et conserve le ton élevé du grec.
- source_word: ἐξαριθμήσεται
  choice: pourra dénombrer
  rationale: Le futur a ici une valeur de possibilité dans une question rhétorique; « dénombrer » rend l'idée de compter exhaustivement.
- source_word: προσθήσει
  choice: pourra continuer à
  rationale: Littéralement « ajoutera », le verbe associé à l'infinitif exprime ici le fait de prolonger encore le récit; cette tournure française restitue l'idiome sans calque obscur.
- source_word: ἐκδιηγήσασθαι
  choice: raconter
  rationale: Le composé évoque un récit développé ou détaillé; avec « continuer à », « raconter » donne en français une expression naturelle qui en conserve la portée.
- source_word: τὰ ἐλέη αὐτοῦ
  choice: ses actes de bonté
  rationale: Le pluriel désigne les manifestations concrètes de la miséricorde divine. « Actes de bonté » est plus naturel en français moderne que le pluriel abstrait « miséricordes ».
theological_decisions:
- issue: Expression de la grandeur et des bienfaits divins
  choice: « la puissance de sa majesté » et « ses actes de bonté »
  alternative: « la force de sa grandeur » et « ses miséricordes »
  rationale: Le choix retient le registre élevé du grec sans archaïsme et comprend le pluriel ἐλέη comme les manifestations multiples de la bonté divine, sans en réduire la portée à un simple sentiment.
translation_notes:
  register: Français international moderne, digne et accessible. Les deux questions rhétoriques ainsi que le parallélisme grec sont conservés; l'idiome προσθήσει ἐκδιηγήσασθαι est rendu naturellement par « continuer à raconter ».
