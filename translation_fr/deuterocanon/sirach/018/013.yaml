  rationale: 'La révision conserve l’ambiguïté et l’ampleur de πᾶσαν σάρκα par « toute chair », et distingue plus clairement la réprimande de la formation dans la série verbale. Les deux notes restent correctement ancrées : [a] après l’expression concernée et [b] après « ramène ».'
