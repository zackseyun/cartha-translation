  yaml_path: translation/deuterocanon/sirach/018/013.yaml
  text: A man's mercy is for his neighbor[a], but the Lord's mercy is for all flesh[b]; he rebukes and disciplines and teaches and turns back his flock like a shepherd.
translation:
  language: fr
  text: La miséricorde d’un être humain s’étend envers son prochain, mais celle du Seigneur envers toute chair[a] ; il reprend, éduque, enseigne et ramène[b] son troupeau comme un berger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « toute chair » ; cette expression biblique peut désigner toute l’humanité ou, plus largement, tous les êtres vivants.
    reason: lexical_alternative
  - marker: b
    text: Ou « fait revenir » ou « restaure » ; le grec exprime l’action de faire retourner, en accord avec l’image du berger qui récupère les brebis égarées.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος
  choice: miséricorde
  rationale: « Miséricorde » exprime une compassion active envers autrui et conserve le poids éthique et théologique du terme dans les deux membres du parallèle.
- source_word: ἀνθρώπου
  choice: d’un être humain
  rationale: Cette formulation garde le singulier générique et le contraste entre la compassion humaine et celle du Seigneur, sans introduire une restriction de sexe absente du contexte.
- source_word: πλησίον
  choice: son prochain
  rationale: « Prochain » est le terme français naturel dans un contexte éthique et préserve la portée relationnelle du grec.
- source_word: Κυρίου
  choice: du Seigneur
  rationale: « Seigneur » rend directement κύριος et maintient le parallélisme possessif du verset.
- source_word: πᾶσαν σάρκα
  choice: tout être de chair
  rationale: Cette expression conserve l’image biblique de la chair et sa portée vaste, tout en étant plus intelligible en français actuel que le calque « toute chair ».
- source_word: ἐλέγχων
  choice: reprend
  rationale: « Reprend » exprime la réprimande corrective sans lui donner un sens judiciaire trop précis.
- source_word: παιδεύων
  choice: corrige
  rationale: Dans cette série pastorale, « corrige » rend la dimension à la fois disciplinaire et formatrice de παιδεύω.
- source_word: διδάσκων
  choice: enseigne
  rationale: Rendu direct et naturel de l’action d’instruire.
- source_word: ἐπιστρέφων
  choice: ramène
  rationale: « Ramène » exprime le retour provoqué par le berger et convient à l’image d’un troupeau égaré, sans imposer le sens théologique technique de « convertir ».
- source_word: ὡς ποιμὴν τὸ ποίμνιον αὐτοῦ
  choice: son troupeau comme un berger
  rationale: La formulation conserve la comparaison explicite et l’image pastorale dans un ordre naturel en français.
theological_decisions:
- issue: Portée de πᾶσαν σάρκα
  choice: La miséricorde du Seigneur s’étend à « tout être de chair », expression large qui ne se limite pas explicitement à l’humanité.
  alternative: toute l’humanité ; tout être vivant
  rationale: Le grec emploie une expression biblique englobante. La conserver sous une forme française compréhensible respecte son ampleur et évite de trancher entre une référence à tous les humains et une portée plus largement créaturelle.
- issue: Valeur de ἐπιστρέφων dans l’image du berger
  choice: Le Seigneur « ramène » son troupeau.
  alternative: fait revenir ; restaure ; convertit
  rationale: « Ramène » garde l’idée concrète du retour des égarés suggérée par le berger, sans réduire le verbe à une notion doctrinale technique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme entre la miséricorde humaine et celle du Seigneur est conservé. « Tout être de chair » maintient l’idiome biblique sans l’opacité de « toute chair », et la série verbale reste concise et pastorale.
