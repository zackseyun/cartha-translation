  text: Before you pray[a], prepare yourself, and do not be like a man testing the Lord.
translation:
  language: fr
  text: Avant de prier, prépare-toi et ne sois pas comme un homme qui met le Seigneur à l’épreuve[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui tente le Seigneur ». Le verbe grec peut signifier « mettre à l’épreuve » ou « tenter » ; ici, il s’agit probablement de mettre le Seigneur à l’épreuve.'
    reason: alternative lexicale
lexical_decisions:
- source_word: πρὶν εὔξασθαι
  choice: Avant de prier
  rationale: La construction temporelle indique ce qui doit précéder la prière. Dans ce contexte sapientiel, εὔχομαι désigne naturellement le fait de prier, même si le verbe peut aussi être associé à un vœu.
- source_word: ἑτοίμασον σεαυτόν
  choice: prépare-toi
  rationale: L’impératif et le pronom réfléchi appellent à une préparation personnelle et délibérée. Cette formulation est concise, naturelle et fidèle.
- source_word: μὴ γίνου
  choice: ne sois pas
  rationale: Bien que γίνομαι puisse signifier « devenir », l’impératif présent négatif se rend ici naturellement en français par « ne sois pas ». La mise en garde contre l’adoption d’une telle attitude demeure intacte.
- source_word: ὡς ἄνθρωπος
  choice: comme un homme
  rationale: Cette traduction conserve le singulier générique masculin du grec et la forme traditionnelle d’une maxime de sagesse.
- source_word: πειράζων
  choice: qui met … à l’épreuve
  rationale: πειράζω peut signifier « éprouver », « mettre à l’épreuve » ou « tenter ». Avec le Seigneur comme objet, « mettre à l’épreuve » exprime clairement l’idée de soumettre Dieu à une exigence ou à un défi, sans effacer l’autre possibilité lexicale.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Dans ce contexte de sagesse juive, κύριος désigne Dieu ; « le Seigneur » est la traduction française habituelle et digne.
theological_decisions:
- issue: Sens de πειράζων τὸν κύριον
  choice: qui met le Seigneur à l’épreuve
  alternative: qui tente le Seigneur
  rationale: 'Le verbe grec permet les deux sens. Lorsque Dieu est l’objet, la mise à l’épreuve est probablement visée : l’être humain adopte une posture de défi envers Dieu. La note conserve néanmoins l’ambiguïté lexicale authentique.'
- issue: Valeur générique de ἄνθρωπος
  choice: un homme
  alternative: quelqu’un / une personne
  rationale: Le grec emploie un nom masculin singulier à portée générique. « Un homme » en reproduit la forme sans restreindre nécessairement l’avertissement aux hommes.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier correspond aux impératifs grecs adressés au lecteur. La formulation reste accessible tout en conservant la forme sentencieuse du texte sapientiel.
