  text: He has mercy on those who accept discipline[b][a], and on those who eagerly hasten to his judgments.
translation:
  language: fr
  text: Il fait miséricorde à ceux qui accueillent la discipline[a], et à ceux qui se hâtent vers ses jugements[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’instruction ». Le grec παιδεία peut désigner l’instruction, la formation ou la discipline corrective.
    reason: lexical_alternative
  - marker: b
    text: Ou « ses ordonnances ». Le grec κρίματα peut désigner des jugements, des décisions ou des ordonnances.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεᾷ
  choice: fait miséricorde à
  rationale: Cette expression naturelle dans le registre biblique conserve la portée morale et religieuse du verbe, qui désigne l’exercice de la compassion ou de la miséricorde.
- source_word: τοὺς ἐκδεχομένους
  choice: ceux qui accueillent
  rationale: Avec παιδείαν comme complément, « accueillent » exprime une réception volontaire et favorable, sans réduire le verbe au simple fait d’attendre.
- source_word: παιδείαν
  choice: la discipline
  rationale: Le terme grec englobe l’instruction, la formation et la correction éducative. « Discipline » préserve ici sa dimension formatrice et corrective.
- source_word: κατασπεύδοντας
  choice: ceux qui se hâtent
  rationale: Le verbe composé marque un empressement énergique. « Se hâtent » conserve l’idée de mouvement et de promptitude sans ajouter explicitement l’idée d’obéissance.
- source_word: ἐπὶ τὰ κρίματα αὐτοῦ
  choice: vers ses jugements
  rationale: Après un verbe de mouvement, ἐπί avec l’accusatif indique naturellement la direction. « Jugements » maintient l’étendue sémantique de κρίματα, qui peut désigner des décisions judiciaires aussi bien que des prescriptions.
theological_decisions:
- issue: Sens de παιδεία dans le contexte sapientiel
  choice: la discipline
  alternative: l’instruction
  rationale: « Discipline » garde la tension entre enseignement formateur et correction, sans limiter le passage à la seule transmission de connaissances.
- issue: Portée de κρίματα αὐτοῦ
  choice: ses jugements
  alternative: ses ordonnances
  rationale: Le grec peut viser les décisions judiciaires de Dieu ou ses prescriptions normatives. « Jugements » préserve cette amplitude théologique plutôt que de la réduire au domaine légal.
- issue: Orientation exprimée par ἐπί
  choice: vers ses jugements
  alternative: pour ses jugements
  rationale: La formulation directionnelle suit la construction grecque et évite d’introduire l’idée non exprimée d’observer ou d’exécuter ces jugements.
translation_notes:
  register: Français international moderne, digne et accessible. « Fait miséricorde » conserve la tonalité biblique sans archaïsme excessif. La formulation « se hâtent vers » maintient l’image directionnelle du grec, malgré son caractère légèrement soutenu.
