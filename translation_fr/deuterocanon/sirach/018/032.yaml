  text: Do not delight in a mere scrap of pleasure[b][a], for its end is poverty.
translation:
  language: fr
  text: Ne te réjouis pas d’une bribe de plaisir[b], car elle mène à la pauvreté[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La fin du verset est incertaine en hébreu. Le texte des manuscrits de la Gueniza du Caire se traduit littéralement par quelque chose comme « dont la bouche de deux est sa pauvreté », expression difficile à comprendre. Le grec porte : « Ne te réjouis pas de beaucoup de luxe et ne t’attache pas à sa dépense. » Ce parallèle divergent exprime lui aussi une mise en garde contre le coût de l’indulgence, sans résoudre directement la phrase hébraïque.'
    reason: textual_variant
  - marker: b
    text: 'Ou : « d’un peu de plaisir ». Le mot hébreu שֶׁמֶץ peut désigner un petit fragment ou une simple trace.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׂמַח
  choice: Ne te réjouis pas
  rationale: Le verbe שׂמח exprime ici le fait de trouver sa joie ou son plaisir dans quelque chose. Cette formulation reste proche de l’hébreu tout en étant naturelle en français.
- source_word: שֶׁמֶץ
  choice: une parcelle
  rationale: שֶׁמֶץ désigne une petite portion, un fragment ou une trace. « Une parcelle » conserve cette valeur diminutive sans alourdir la phrase.
- source_word: תַּעֲנוּג
  choice: de plaisir
  rationale: Le nom désigne l’agrément, le plaisir ou les délices. « Plaisir » est assez large pour ne pas imposer la notion de luxe présente dans le parallèle grec.
- source_word: אֲשֶׁר פִּי שְׂנַיִם רֵישׁוֹ
  choice: car elle finit dans la pauvreté
  rationale: La proposition hébraïque transmise est difficile à analyser. La traduction conserve l’ancrage lexical clair de רֵישׁ, « pauvreté », et rend la proposition comme l’issue de ce plaisir, conformément au mouvement du proverbe; l’incertitude est signalée en note.
