  text: From morning until evening the time changes[b][a], and all things are swift before the Lord.
translation:
  language: fr
  text: Du matin au soir, le temps change[a], et tout est rapide aux yeux du Seigneur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la saison change », « le moment change » ou « les circonstances changent » ; le grec καιρός peut désigner le temps, une saison, un moment opportun ou les circonstances, selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « tout est prompt devant le Seigneur ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ πρωΐθεν ἕως ἑσπέρας
  choice: Du matin jusqu’au soir
  rationale: Cette formulation naturelle exprime clairement toute l’étendue de la journée sans préciser excessivement qu’il s’agit de l’aube.
- source_word: μεταβάλλει
  choice: changent
  rationale: Le verbe exprime un changement ou un passage d’un état à un autre. Le pluriel s’accorde en français avec « les circonstances », tout en représentant le singulier collectif καιρός.
- source_word: καιρός
  choice: les circonstances
  rationale: Dans cette maxime sur les changements rapides qui surviennent au cours d’une journée, « les circonstances » rend naturellement la portée contextuelle de καιρός. Une note conserve les sens possibles de « temps » et de « moment ».
- source_word: πάντα
  choice: tout
  rationale: Le neutre pluriel grec a ici une portée globale. Le singulier collectif « tout » est la tournure française la plus naturelle.
- source_word: ταχινὰ
  choice: va vite
  rationale: L’adjectif désigne ce qui est rapide ou prompt. « Tout va vite » restitue ce sens dans un français idiomatique, sans lui substituer l’idée de facilité.
- source_word: ἔναντι Κυρίου
  choice: devant le Seigneur
  rationale: Cette expression concise préserve le sens de présence ou de perspective divine, sans préciser davantage si l’accent porte sur la présence du Seigneur ou sur son regard.
theological_decisions:
- issue: Sens de καιρός dans cette maxime de sagesse
  choice: les circonstances
  alternative: le temps ; le moment
  rationale: Le contexte évoque la variabilité de l’expérience humaine au cours d’une seule journée. « Les circonstances » est idiomatique en français, tandis que la note maintient l’étendue sémantique du grec.
- issue: Portée de πάντα ἐστὶν ταχινὰ ἔναντι Κυρίου
  choice: tout va vite devant le Seigneur
  alternative: tout est rapide aux yeux du Seigneur ; tout arrive promptement devant le Seigneur
  rationale: Le sens premier de ταχινός concerne la rapidité. La traduction conserve donc l’idée que les choses évoluent vite dans la perspective divine, sans transformer l’énoncé en affirmation sur la facilité de l’action pour Dieu.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Les circonstances changent » et « tout va vite » assurent une lecture naturelle, tandis que les notes signalent les principales ambiguïtés lexicales et théologiques du grec.
