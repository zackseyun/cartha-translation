  text: Was not water made sweet by wood[c][b][a], so that his power might be made known to every man?
translation:
  language: fr
  text: L’eau n’a-t-elle pas été adoucie au moyen d’un morceau de bois[b], afin de faire connaître à tout être humain sa puissance[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom possessif de l’hébreu et du grec peut renvoyer à Dieu ou au morceau de bois. Le français « sa puissance » ne tranche pas entre ces lectures.
    reason: alternative_reading
  - marker: b
    text: Allusion probable à l’épisode où de l’eau amère devint douce au moyen d’un morceau de bois (Exode 15.25).
    reason: cross_reference
lexical_decisions:
- source_word: הלא
  choice: n’a-t-elle pas
  rationale: Introduit une question rhétorique qui appelle une réponse affirmative, conformément au grec οὐκ.
- source_word: בעץ
  choice: au moyen d’un morceau de bois
  rationale: La préposition ב indique ici le moyen. « Morceau de bois » est naturel en français et reste assez général pour préserver le caractère allusif du texte.
- source_word: המתיקו מים
  choice: l’eau ... a été adoucie
  rationale: Le verbe signifie rendre doux. La tournure passive reflète bien l’absence d’agent exprimé et convient au contexte de l’eau amère devenue douce.
- source_word: בעבור להודיע
  choice: afin de faire connaître
  rationale: Exprime directement le but indiqué par בעבור suivi de l’infinitif causatif להודיע.
- source_word: כל אנוש
  choice: tout être humain
  rationale: אנוש désigne ici l’être humain en général. Cette formulation moderne conserve la portée universelle sans imposer en français un masculin pouvant être compris comme exclusif.
- source_word: כחו
  choice: sa puissance
  rationale: Le suffixe masculin singulier demeure formellement ambigu en français. Dans le contexte, il renvoie probablement à Dieu; « puissance » convient à la manifestation de la force divine.
theological_decisions:
- issue: Référent du pronom suffixe dans כחו
  choice: « sa puissance », compris principalement comme la puissance de Dieu
  alternative: La puissance du morceau de bois; éventuellement celle de Moïse
  rationale: Le contexte présente vraisemblablement le prodige comme une manifestation de la puissance divine, mais la grammaire hébraïque et le parallèle grec permettent de rattacher le pronom au bois. La note conserve cette ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique et la relation de but sont conservées. L’ordre des appels de notes suit leur position dans le texte, et l’ambiguïté théologique du pronom est explicitement maintenue.
