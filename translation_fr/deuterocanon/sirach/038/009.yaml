  yaml_path: translation/deuterocanon/sirach/038/009.yaml
  text: My son[a], in your sickness do not be negligent; pray to God[b], for he will heal you.
translation:
  language: fr
  text: Mon fils, dans ta maladie, ne te montre pas négligent[a] ; prie Dieu[b], car il te guérira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne la néglige pas » ou « ne passe pas outre ». Le parallèle grec explicite l’idée de ne pas négliger ou ignorer la maladie.'
    reason: Alternative lexicale liée à une tournure hébraïque difficile ; le grec aide à préciser le sens sans imposer un objet explicite à l’hébreu.
  - marker: b
    text: 'Le parallèle grec lit : « le Seigneur » ; le témoin hébreu lit ici : « Dieu ».'
    reason: Variante entre les témoins hébreu et grec.
lexical_decisions:
- source_word: בני
  choice: Mon fils
  rationale: Le vocatif hébreu signifie littéralement « mon fils » et conserve le ton paternel de l’enseignement de Ben Sira.
- source_word: בחולי
  choice: dans ta maladie
  rationale: Cette formulation rend directement la préposition ב et le nom חולי, tout en restant claire en français moderne.
- source_word: על תתעבר
  choice: ne sois pas négligent
  rationale: La tournure hébraïque transmise est difficile, mais le parallèle grec (« ne néglige pas / ne passe pas outre ») confirme une mise en garde contre la négligence. La traduction évite d’ajouter un complément que l’hébreu n’exprime pas explicitement.
- source_word: התפלל
  choice: prie
  rationale: Le verbe signifie simplement « prier » ; aucune amplification n’est nécessaire.
- source_word: אל אל
  choice: Dieu
  rationale: Le témoin hébreu porte אל, « Dieu ». Le grec a « le Seigneur », variante signalée en note.
- source_word: כי הוא ירפא
  choice: car il te guérira
  rationale: La conjonction introduit le motif de l’exhortation. Le complément « te » est implicite dans le contexte hébreu et explicite dans le parallèle grec.
theological_decisions:
- issue: Titre divin dans l’appel à la prière
  choice: Dieu
  alternative: le Seigneur
  rationale: Le texte hébreu, témoin principal ici, lit « Dieu », tandis que le parallèle grec lit « le Seigneur ». La leçon grecque est conservée en note sans remplacer l’hébreu dans le texte principal.
- issue: Portée de la promesse de guérison
  choice: car il te guérira
  alternative: car il guérira
  rationale: Le contexte adresse la promesse au malade, et le grec exprime explicitement « te ». La formulation conserve l’affirmation du verset sans en préciser le moyen ni le moment.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement convient au discours sapientiel d’un père à son fils. La formulation reste proche de l’hébreu tout en indiquant en notes l’ambiguïté lexicale et la variante grecque.
