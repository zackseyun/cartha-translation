translation:
  language: fr
  text: C’est de Dieu que le médecin devient sage[a], et c’est du roi qu’il reçoit des présents[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Car la guérison vient du Très-Haut. » L’hébreu se lit plus directement : « C’est de Dieu que le médecin devient sage. »'
    reason: alternative_reading
  - marker: b
    text: 'L’hébreu emploie une expression difficile qui évoque littéralement le fait de porter des charges. Dans ce contexte, elle peut désigner des présents ou une récompense ; le grec dit : « il recevra un don ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מאת אל
  choice: C’est de Dieu que vient
  rationale: Le texte hébreu nomme Dieu (אל), tandis que le grec porte « le Très-Haut ». Le texte principal suit le témoin hébreu.
- source_word: יחכם רופא
  choice: la sagesse du médecin
  rationale: L’hébreu dit littéralement que « le médecin devient sage ». La nominalisation française conserve le lien entre Dieu, la sagesse et le médecin sans produire une tournure artificielle. Le parallèle grec présente toutefois une autre lecture, centrée sur la guérison.
- source_word: מאת מלך
  choice: du roi
  rationale: Cette formulation rend naturellement l’hébreu et concorde avec le parallèle grec. Dans ce contexte, le roi peut être compris de manière générique.
- source_word: ישא משאות
  choice: il reçoit des présents
  rationale: Pris littéralement, l’hébreu évoque le fait de porter ou d’emporter des présents; dans le contexte, il s’agit vraisemblablement des dons ou de la récompense accordés au médecin. Le grec confirme explicitement l’idée de recevoir un don.
