  text: Do not set your heart on him any longer[a]; let his memory go[c][b], and remember the end.
translation:
  language: fr
  text: Ne fixe plus ton cœur sur lui[a] ; laisse son souvenir s’éloigner[b], et souviens-toi de la fin[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ne place plus ton cœur vers lui » ; dans le contexte, il s’agit de ne pas rester intérieurement fixé sur le défunt.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « détache-toi de son souvenir ». Le verbe hébreu est difficile ; l’idée semble être de dépasser le deuil plutôt que d’effacer tout souvenir du défunt.'
    reason: alternative_reading
  - marker: c
    text: 'Ou : « souviens-toi de sa fin » ou « de ta propre fin ». L’hébreu dit simplement « la fin » et peut volontairement garder une portée générale.'
    reason: alternative_reading
lexical_decisions:
- source_word: אל תשים אליו לב עוד
  choice: Ne garde pas plus longtemps ton cœur tourné vers lui
  rationale: Cette formulation conserve l’image hébraïque du cœur orienté vers quelqu’un, tout en exprimant naturellement l’exhortation à ne pas demeurer intérieurement fixé sur le défunt.
- source_word: עוד
  choice: plus longtemps
  rationale: Dans ce contexte, l’adverbe marque la cessation d’un état qui se prolonge, plutôt qu’une simple répétition.
- source_word: פרע זכרו
  choice: laisse son souvenir s’éloigner
  rationale: Le verbe hébreu est difficile. Cette traduction évite l’idée trop absolue d’effacer ou d’oublier le défunt et exprime plutôt le relâchement de l’emprise du souvenir dans le deuil.
- source_word: וזכור אחרית
  choice: et souviens-toi de la fin
  rationale: La formulation concise conserve l’indétermination de אחרית, qui peut évoquer la mort, l’issue finale ou la destinée ultime sans préciser de qui il s’agit.
theological_decisions:
- issue: Référent de « la fin » (אחרית)
  choice: Maintenir la référence générale et implicite de l’hébreu
  alternative: « souviens-toi de sa fin » ou « souviens-toi de ta propre fin »
  rationale: Le texte hébreu ne donne aucun possesseur. La traduction préserve donc la portée ouverte de l’expression, qui peut renvoyer à la fin du défunt, à celle de la personne endeuillée ou plus largement à la mortalité.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier correspond à l’exhortation sapientielle hébraïque. Les images du cœur, du souvenir et de la fin sont conservées sans durcir le commandement en injonction d’oublier le défunt.
