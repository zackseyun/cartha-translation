  text: He will apply his heart to the completion of his work[a], and his wakefulness is to bring it to perfection.
translation:
  language: fr
  text: Il consacre son cœur à achever ses ouvrages[a], et sa veille à les parfaire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Il donnera son cœur à l’achèvement d’œuvres, et sa veille pour orner jusqu’à l’achèvement. » Le grec est très concis; l’objet de « orner » est sous-entendu. Dans ce contexte artisanal, le verbe peut évoquer la mise en ordre, l’apprêt ou l’ornement final des ouvrages.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καρδίαν αὐτοῦ δώσει εἰς
  choice: Il met tout son cœur à
  rationale: Cette tournure française naturelle conserve l’image du cœur tout en exprimant l’engagement résolu et l’attention appliquée impliqués par l’idiome grec.
- source_word: συντέλειαν ἔργων
  choice: achever ses ouvrages
  rationale: Le pluriel ἔργων est conservé par « ouvrages », terme adapté au travail artisanal du contexte; « achever » rend concrètement la visée de συντέλειαν.
- source_word: ἡ ἀγρυπνία αὐτοῦ
  choice: veille
  rationale: Le verbe français restitue naturellement l’idée de rester éveillé et de consacrer une vigilance soutenue à son travail, sans imposer l’idée d’insomnie involontaire.
- source_word: κοσμῆσαι
  choice: mener à leur parfaite finition
  rationale: κοσμέω peut signifier ordonner, apprêter ou orner. Dans ce contexte artisanal, la formule exprime la mise en ordre et le soin esthétique apportés au travail final, sans réduire le verbe à la seule décoration.
- source_word: ἐπὶ συντελείας
  choice: à leur parfaite finition
  rationale: La locution vise l’aboutissement du travail. « Finition » convient au contexte artisanal, tandis que « parfaite » fait ressortir le soin impliqué par κοσμῆσαι sans transformer explicitement la notion en perfection absolue.
