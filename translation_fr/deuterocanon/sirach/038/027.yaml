  text: So too every craftsman and planner[a], who labors by night as by day.
translation:
  language: fr
  text: De même, tout artisan et concepteur[a] peine la nuit comme le jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est concis : « tout artisan et concepteur ». Le parallèle grec développe le tableau en parlant du constructeur, du maître artisan et des graveurs qui veillent pour achever leur ouvrage. Le texte principal suit l’hébreu.'
    reason: alternative_reading
lexical_decisions:
- source_word: אף
  choice: De même
  rationale: Le terme poursuit la comparaison avec les autres métiers évoqués dans le contexte.
- source_word: עשה חרש
  choice: tout artisan
  rationale: L’expression hébraïque est concise et désigne largement celui qui exerce un métier manuel qualifié, sans imposer un métier particulier.
- source_word: וחשב
  choice: et concepteur
  rationale: Le mot évoque celui qui conçoit, élabore ou exécute un ouvrage de façon experte; « concepteur » conserve cette dimension créatrice et technique.
- source_word: אשר
  choice: —
  rationale: La relation exprimée par le pronom relatif hébreu est rendue naturellement en français par la construction verbale directe après le groupe sujet.
- source_word: לילה כיום
  choice: la nuit comme le jour
  rationale: Cette tournure conserve la comparaison hébraïque et exprime un travail qui se prolonge durant la nuit.
- source_word: יגיע
  choice: peine
  rationale: Le verbe indique un travail pénible et soutenu; « peine » rend clairement l’effort sans alourdir la phrase.
