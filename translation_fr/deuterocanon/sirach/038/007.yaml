translation:
  language: fr
  text: Par eux, le médecin apaise la douleur, et le préparateur de remèdes compose un mélange.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בהם
  choice: Grâce à eux
  rationale: Le pronom renvoie aux remèdes ou substances médicinales du contexte; cette tournure exprime naturellement le moyen en français.
- source_word: רופא
  choice: le médecin
  rationale: Équivalent direct et courant du terme hébreu.
- source_word: יניח מכאוב
  choice: apaise la douleur
  rationale: יניח signifie ici faire diminuer ou calmer; «apaise» rend l’action sans affirmer nécessairement une guérison complète.
- source_word: רוקח
  choice: le préparateur de remèdes
  rationale: Dans ce contexte médical, le mot désigne celui qui compose des préparations; cette expression évite le sens moderne dominant de «parfumeur».
- source_word: עושה מרקחת
  choice: en fait une mixture
  rationale: Rend l’idée de confectionner, à partir de ces substances, une composition médicinale, tout en conservant le terme général du texte.
