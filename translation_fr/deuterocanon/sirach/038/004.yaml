  text: The Lord created medicines from the earth[b][a], and a sensible man will not despise them.
translation:
  language: fr
  text: Dieu[a] tire de la terre des remèdes[b], et l’homme doué de discernement ne les méprisera pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit « Dieu »; le parallèle grec porte « le Seigneur ».
    reason: alternative_reading
  - marker: b
    text: 'La forme verbale hébraïque est difficile dans la tradition manuscrite; le grec dit : « a créé des remèdes à partir de la terre ».'
    reason: textual_variant
lexical_decisions:
- source_word: אל
  choice: Dieu
  rationale: Le titre hébreu אֵל désigne directement Dieu. « Dieu » traduit donc en priorité le témoin hébreu, tandis que la leçon grecque « Seigneur » est signalée en note.
- source_word: מארץ
  choice: de la terre
  rationale: La préposition מִן avec אֶרֶץ indique ici l’origine matérielle des remèdes; « de la terre » est naturel en français et concorde avec le grec ἐκ γῆς.
- source_word: מצוציא
  choice: tire
  rationale: La forme hébraïque transmise est difficile, mais semble exprimer l’action de faire sortir ou de produire. « Tire de la terre » conserve cette image sans imposer la formulation plus précise « créa » du parallèle grec.
- source_word: תרופות
  choice: des remèdes
  rationale: Le nom désigne des substances ou moyens médicinaux. « Remèdes » convient au contexte ancien tout en restant courant et compréhensible.
- source_word: גבר מבין
  choice: l’homme doué de discernement
  rationale: גבר garde la forme masculine du texte, et מבין évoque moins l’intelligence abstraite que la compréhension et le jugement pratique.
- source_word: אל ימאס בם
  choice: ne les méprisera pas
  rationale: Le verbe מאס signifie rejeter ou mépriser. Le futur français rend ici la conduite caractéristique attendue de l’homme avisé et s’accorde avec le futur du parallèle grec.
theological_decisions:
- issue: Le sujet divin diffère dans sa désignation entre l’hébreu אֵל et le grec Κύριος.
  choice: Dieu
  alternative: Le Seigneur
  rationale: Puisque le texte hébreu fourni est la source première, le corps du verset traduit אֵל par « Dieu ». La variante de désignation du parallèle grec est conservée en note sans modifier le sens théologique fondamental.
- issue: La forme hébraïque difficile מצוציא face au grec ἔκτισεν (« créa »).
  choice: tire de la terre
  alternative: a créé à partir de la terre
  rationale: La formulation retenue suit le sens probable du verbe hébreu, « faire sortir », et préserve l’image de la terre comme provenance. La lecture grecque, qui explicite l’acte créateur, est documentée en note plutôt qu’introduite silencieusement.
translation_notes:
  register: Français international moderne, sobre et digne. « L’homme doué de discernement » préserve la formulation masculine représentative du texte tout en exprimant naturellement le jugement pratique. Les deux marqueurs de note figurent dans le texte principal.
