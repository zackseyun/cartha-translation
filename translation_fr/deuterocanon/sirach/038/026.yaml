  text: His diligence is to finish the foddering place[b][a]; he sets his heart on plowing the furrows.
translation:
  language: fr
  text: Il s’applique sans relâche à achever l’enclos à bétail[a] ; il met tout son cœur à travailler les sillons[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « et ses veilles sont consacrées à la nourriture des jeunes bovins ». Il confirme l’idée d’un souci constant de nourrir le bétail, tandis que l’hébreu semble désigner plutôt l’enclos ou le lieu d’alimentation.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « à briser la terre dans les sillons ». Le verbe hébreu peut désigner le travail du sol sans permettre de préciser avec certitude la technique employée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ושקידתו
  choice: Il s’applique sans relâche
  rationale: שקידה exprime une attention soutenue et assidue. Cette tournure naturelle rend ici l’idée de diligence constante dans le travail agricole.
- source_word: לכלות
  choice: à achever le travail de
  rationale: כלה signifie « achever, mener à terme ». L’ajout explicatif de « le travail de » évite l’expression peu intelligible « achever l’étable » tout en préservant l’orientation vers l’accomplissement de la tâche.
- source_word: מרבק
  choice: l’étable
  rationale: מרבק désigne un lieu où le bétail est gardé et nourri, notamment pour l’engraissement. « Étable » est courant et digne en français; la note précise la fonction d’alimentation attestée par le grec.
- source_word: לב ישית
  choice: il met tout son cœur
  rationale: Cette formulation conserve l’image hébraïque du cœur dirigé vers une tâche et communique une application résolue.
- source_word: לשדד
  choice: à travailler la terre
  rationale: Dans ce contexte agricole, שדד peut évoquer l’action de briser ou de remuer le sol. Une formulation générale préserve cette amplitude sans imposer une technique agricole trop précise.
- source_word: בתלמים
  choice: dans les sillons
  rationale: תלמים désigne les sillons ou rangées tracées par le labour. La préposition ב est rendue naturellement par « dans ».
