revisions:
- from: Celui qui pèche devant celui qui l’a fait se montrera hostile envers le médecin[a].
  to: Celui qui pèche devant son Créateur se comportera comme un étranger devant un médecin[a].
  rationale: La révision conserve la priorité au texte hébreu et son parallélisme proverbial, tout en évitant de fixer le sens disputé de יתנכר à « hostile ». « Se comportera comme un étranger » maintient l’image lexicale de l’étrangeté et laisse percevoir la distanciation ou le refus implicite sans l’imposer. La note garde la leçon grecque alternative et adapte sa citation au texte français révisé.
