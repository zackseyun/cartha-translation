  text: Whoever sins before his Maker will be defiant before a physician[a].
translation:
  language: fr
  text: Celui qui pèche devant son Créateur se comportera comme un étranger devant un médecin[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « tombera entre les mains d’un médecin ». L’hébreu dit : « se comportera comme un étranger devant un médecin ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אשר
  choice: Celui qui
  rationale: Introduit une proposition relative à portée générale et conserve naturellement le caractère proverbial de l’énoncé.
- source_word: חואט
  choice: pèche
  rationale: Le verbe חטא exprime ici le péché, avec sa portée morale et religieuse, plutôt qu’un simple tort.
- source_word: לפני
  choice: devant
  rationale: Rend directement l’idée de présence exprimée par la préposition hébraïque, sans la surinterpréter par « contre ».
- source_word: עושהו
  choice: celui qui l’a fait
  rationale: Rend littéralement et clairement le participe de עשה avec son suffixe pronominal, tout en évitant d’ajouter un titre absent du texte.
- source_word: יתנכר
  choice: se montrera hostile
  rationale: Le hitpael de נכר peut évoquer le fait de se rendre étranger, de prendre ses distances ou d’adopter une attitude hostile. Ici, « se montrera hostile » exprime cette attitude de résistance face au médecin tout en restant proche de la valeur lexicale.
- source_word: רופא
  choice: le médecin
  rationale: Terme moderne, naturel et digne pour désigner le praticien dans le contexte médical du passage. L’article défini français convient à la désignation générique.
theological_decisions:
- issue: Divergence entre l’hébreu et le grec dans le second membre
  choice: 'Suivre l’hébreu conservé : « se montrera hostile envers le médecin »'
  alternative: 'Suivre le grec : « tombera entre les mains d’un médecin »'
  rationale: Puisque le texte hébreu est conservé ici avec un degré élevé de confiance, il sert de base au texte principal. La leçon grecque, substantiellement différente, est signalée en note afin de préserver la transparence textuelle.
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde le parallélisme proverbial et la tension entre faute envers le Créateur et attitude envers le médecin, sans harmoniser la divergence entre les témoins hébreu et grec.
