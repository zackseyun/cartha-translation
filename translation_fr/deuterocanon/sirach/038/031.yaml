  text: So the potter[a], sitting at his work and turning the wheel with his feet, is continually anxious over his work, and all his labor is by number;
translation:
  language: fr
  text: 'Ainsi en va-t-il du potier, assis à son ouvrage et faisant tourner le tour avec ses pieds : il se préoccupe sans cesse de son travail, et toute sa production est comptée.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout son travail est compté ». Le grec peut désigner soit son activité, soit l’ensemble de ce qu’il produit.
    reason: ambiguïté lexicale de ἐργασία et portée de ἐνάριθμος
lexical_decisions:
- source_word: κεραμεύς
  choice: potier
  rationale: « Potier » est le terme français courant et précis pour l’artisan qui fabrique des récipients en argile.
- source_word: καθήμενος ἐν ἔργῳ αὐτοῦ
  choice: assis à son ouvrage
  rationale: Cette formulation conserve la posture concrète de l’artisan et son engagement dans la tâche, dans un français naturel et digne.
- source_word: συστρέφων ἐν ποσὶν αὐτοῦ τροχόν
  choice: faisant tourner le tour avec ses pieds
  rationale: Le grec décrit l’actionnement du tour de potier au moyen des pieds. La répétition française de « tourner » et « tour » reste idiomatique dans ce contexte artisanal.
- source_word: ἐν μερίμνῃ κεῖται διὰ παντὸς ἐπὶ τὸ ἔργον αὐτοῦ
  choice: il se préoccupe sans cesse de son travail
  rationale: « Se préoccupe » exprime le souci constant impliqué par μερίμνῃ sans imposer l’idée moderne d’une anxiété pathologique; « sans cesse » rend διὰ παντός.
- source_word: ἐνάριθμος πᾶσα ἡ ἐργασία αὐτοῦ
  choice: toute sa production est comptée
  rationale: ἐργασία peut désigner ici le produit du travail, tandis que ἐνάριθμος signifie « compté » ou « dénombré ». Cette lecture est naturelle dans le contexte de pièces fabriquées, tout en laissant l’autre portée possible en note.
