  text: And he gave man understanding[c][b][a], to glory in his might.
translation:
  language: fr
  text: Il a donné aux humains[a] l’intelligence, afin qu’ils se glorifient[b] de sa puissance[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux mortels ». L’hébreu emploie un singulier collectif désignant l’être humain en général; le grec présente un pluriel.
    reason: lexical_alternative
  - marker: b
    text: Ou « tirent gloire », voire « se vantent ». Le verbe hébreu peut exprimer aussi bien le fait de se glorifier que celui de se vanter; le contexte lui donne ici une portée de célébration.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « de sa puissance ». Le grec parallèle porte « de ses merveilles », ce qui évoque la puissance de Dieu manifestée dans ses œuvres. Dans l’hébreu seul, le possessif pourrait aussi être compris comme renvoyant à l’être humain.
    reason: alternative_reading
lexical_decisions:
- source_word: ויתן
  choice: Il a donné
  rationale: Le verbe נתן exprime ici un don accompli; le grec parallèle ἔδωκεν confirme cette lecture au passé.
- source_word: לאנוש
  choice: aux humains
  rationale: אֱנוֹשׁ désigne l’être humain, souvent avec une portée collective et une nuance de mortalité. Le pluriel français rend naturellement ce sens générique; le grec parallèle emploie également le pluriel ἀνθρώποις.
- source_word: בינה
  choice: l’intelligence
  rationale: בִּינָה signifie intelligence, compréhension ou discernement. « L’intelligence » reste proche de l’hébreu et convient au contexte des connaissances médicales.
- source_word: להתפאר
  choice: afin qu’ils se glorifient
  rationale: Le hitpael de פאר peut exprimer le fait de se glorifier, de tirer gloire ou de se vanter. « Se glorifier » conserve cette tension tout en gardant le registre élevé du passage.
- source_word: בגבורתו
  choice: de sa puissance
  rationale: גְּבוּרָה désigne la puissance, la force ou ses manifestations. « Sa puissance » traduit directement l’hébreu sans ajouter explicitement « exploits »; le grec parallèle, « ses merveilles », suggère toutefois une puissance manifestée dans les œuvres de Dieu.
theological_decisions:
- issue: Référent du suffixe possessif dans בגבורתו (« sa puissance »)
  choice: 'Le possessif renvoie à Dieu: l’intelligence donnée aux humains leur permet de se glorifier de sa puissance.'
  alternative: Dans l’hébreu pris isolément, le suffixe peut être rapporté à l’être humain, qui se glorifierait alors de sa propre force ou de ses réalisations.
  rationale: Le contexte immédiat présente Dieu comme celui qui accorde les moyens de guérison et l’intelligence; le grec parallèle, « ses merveilles », favorise fortement les œuvres merveilleuses de Dieu. L’autre possibilité est néanmoins signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le pluriel « aux humains » restitue naturellement la valeur collective de אֱנוֹשׁ. « Se glorifier » préserve l’ambivalence du verbe hébreu, tandis que la note maintient l’incertitude grammaticale concernant le possessif.
