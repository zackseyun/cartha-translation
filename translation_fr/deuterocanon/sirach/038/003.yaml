  text: A physician’s knowledge will raise his horn[a], and before nobles he will stand.
translation:
  language: fr
  text: Le savoir du médecin rehaussera son prestige, et il se tiendra devant les nobles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « devant les grands, il sera admiré ».'
    reason: alternative_reading
lexical_decisions:
- source_word: דעת
  choice: savoir
  rationale: Le nom désigne la connaissance ou la compétence acquise. « Savoir » est naturel en français et, associé au médecin, évoque sa compétence professionnelle sans surinterprétation.
- source_word: רופא
  choice: médecin
  rationale: Le terme hébreu désigne celui qui soigne. « Médecin » est le terme moderne, précis et adapté au registre sapientiel.
- source_word: תרים קרנו
  choice: rehaussera son prestige
  rationale: L’hébreu dit littéralement « élèvera sa corne », image sémitique de l’honneur, de la puissance ou du rang. « Rehaussera son prestige » transmet clairement la valeur idiomatique en français moderne, sans suivre le grec qui parle de relever la tête.
- source_word: נדיבים
  choice: nobles
  rationale: Le mot vise ici des personnes de haut rang ou éminentes. « Nobles » conserve cette dimension sociale et correspond bien au grec μεγιστάνων.
- source_word: יתיצב
  choice: il se tiendra
  rationale: Le verbe signifie se tenir debout, prendre place ou se présenter. « Il se tiendra » reste proche de l’hébreu et suggère l’accès honorable à la présence des puissants.
theological_decisions:
- issue: Divergence entre l’hébreu et le grec dans le second membre
  choice: 'Suivre l’hébreu : « il se tiendra devant les nobles »'
  alternative: 'Le grec porte : « devant les grands, il sera admiré »'
  rationale: Le texte hébreu est ici conservé avec une confiance élevée et constitue la source principale. La leçon grecque modifie sensiblement la nuance, passant de la présence auprès des élites à l’admiration qu’elles accordent au médecin ; elle est donc signalée en note plutôt que substituée au texte hébreu.
- issue: Image hébraïque de la corne élevée
  choice: Rendre idiomatiquement l’honneur accru par « rehaussera son prestige »
  alternative: « élèvera sa corne »
  rationale: En français courant, « élever sa corne » n’exprime pas spontanément l’honneur ou l’élévation sociale et risquerait d’être opaque. La traduction retient le sens attesté de l’image sans lui imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste proche de la structure parallèle de l’hébreu tout en rendant de façon intelligible son idiome de la « corne élevée ».
