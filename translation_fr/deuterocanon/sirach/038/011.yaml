  text: Present a memorial offering of soothing aroma[b][a], and enrich the arranged offering with the best of your wealth.
translation:
  language: fr
  text: Présente une offrande commémorative d’agréable odeur[a], et enrichis l’offrande préparée avec le meilleur de tes biens.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu peut se rendre littéralement par « présente un agréable mémorial ». Le contexte sacrificiel et le grec, qui parle de « parfum » et de « mémorial de fleur de farine », soutiennent la mention d’une agréable odeur.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « enrichis ce qui est disposé avec les ailes de tes richesses ». L’expression « les ailes de tes richesses » semble désigner ce qu’elles ont de meilleur ou la pleine mesure de tes moyens. Le grec présente une finale sensiblement différente : « enrichis l’offrande comme quelqu’un qui n’existe pas ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הגש
  choice: Présente
  rationale: Dans un contexte sacrificiel, l’impératif signifie apporter ou présenter une offrande. « Présente » est naturel en français et conserve la portée cultuelle.
- source_word: ניחוח
  choice: d’agréable odeur
  rationale: Le terme évoque, dans le langage sacrificiel, une odeur agréable et une offrande favorablement accueillie. Cette formulation française rend l’image cultuelle, également attestée par le grec εὐωδία.
- source_word: אזכרה
  choice: offrande commémorative
  rationale: Le mot désigne la part commémorative d’une offrande. La traduction garde à la fois l’idée de mémorial et sa fonction sacrificielle.
- source_word: ודשן
  choice: et enrichis
  rationale: Le verbe peut signifier « engraisser » ou « rendre riche, abondant ». « Enrichis » exprime ici la générosité apportée à l’offrande sans produire une image maladroite en français.
- source_word: ערוך
  choice: l’offrande préparée
  rationale: Le participe renvoie à ce qui est disposé ou préparé, vraisemblablement aux éléments placés en ordre pour le sacrifice. Le nom « offrande » est explicité d’après le contexte cultuel.
- source_word: בכנפי הוניך
  choice: avec le meilleur de tes biens
  rationale: L’expression signifie littéralement « avec les ailes/extrémités de tes richesses ». Dans ce contexte, elle semble désigner la part choisie ou la pleine mesure des ressources; la formulation retenue reste intelligible tout en signalant l’idiome dans la note.
theological_decisions:
- issue: Imagerie sacrificielle dans un enseignement de sagesse
  choice: Conserver explicitement le langage de l’offrande et du mémorial.
  alternative: Généraliser en parlant de souvenir, de prière ou d’acte de piété.
  rationale: L’hébreu et le parallèle grec emploient un vocabulaire cultuel. Le traduire comme une simple pratique spirituelle effacerait la texture théologique propre au verset.
- issue: Divergence entre le texte hébreu et le parallèle grec
  choice: Suivre le témoin hébreu dans le texte principal et documenter la leçon grecque en note.
  alternative: Adopter la finale grecque « comme quelqu’un qui n’existe plus » dans le texte principal.
  rationale: La source hébraïque fournie est de haute confiance et validée; la différence substantielle du grec doit néanmoins demeurer visible afin de ne pas résoudre silencieusement la tension textuelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire sacrificiel est conservé sans archaïsmes inutiles. « Offrande préparée » explicite le référent implicite de ערוך, tandis que les notes préservent les difficultés de l’hébreu et la divergence du grec.
