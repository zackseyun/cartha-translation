  text: Turn away from wrongdoing[a], and make your hands straight[b]; and from every sin cleanse your heart.
translation:
  language: fr
  text: Détourne-toi du mal et redresse tes mains[a] ; purifie ton cœur de toute transgression[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La proposition hébraïque est difficile dans les manuscrits conservés. Le grec porte : « redresse tes mains », image qui invite à remettre ses actes dans le droit chemin.'
    reason: textual_variant
  - marker: b
    text: Ou « de tout péché », selon le grec. Le mot hébreu peut désigner plus fortement des fautes commises en transgressant ou en se révoltant.
    reason: lexical_alternative
lexical_decisions:
- source_word: נום מעול
  choice: Détourne-toi du mal
  rationale: Le premier mot hébreu est incertain, mais le grec ἀπόστησον confirme un impératif d’éloignement. « Détourne-toi » est naturel et conserve l’appel à rompre avec עול, rendu ici largement par « mal ».
- source_word: ומהכר פנים
  choice: et redresse tes mains
  rationale: La leçon hébraïque conservée est difficile. Le grec εὔθυνον χεῖρας atteste clairement l’idée de redresser les mains, image concrète de la rectification des actes ; cette formulation préserve l’image au lieu de l’expliciter dans le corps du texte.
- source_word: ומכל פשעים
  choice: de toute transgression
  rationale: פשעים désigne des fautes ou transgressions, avec parfois une nuance de rébellion. « Toute transgression » suit de près l’hébreu, tandis que le grec emploie le terme plus général « péché ».
- source_word: טהר לב
  choice: purifie ton cœur
  rationale: טהר signifie rendre pur ou purifier. « Purifie ton cœur » restitue l’impératif et conserve la portée à la fois morale et cultuelle du terme.
theological_decisions:
- issue: Recours au parallèle grec pour la proposition hébraïque textuellement difficile
  choice: Rendre la proposition par « redresse tes mains », selon le grec, tout en signalant l’incertitude hébraïque.
  alternative: Traduire littéralement la leçon hébraïque composite, éventuellement comme une expression concernant le visage.
  rationale: 'L’hébreu demeure le témoin principal, mais sa formulation est ici obscure et signalée comme légèrement discordante. Le grec fournit une proposition cohérente dans la série d’impératifs et reflète vraisemblablement le sens visé : remettre ses actes dans le droit chemin.'
- issue: 'פשעים : transgressions ou péchés'
  choice: Conserver « transgression », plus proche de la force de l’hébreu.
  alternative: Employer « péché », conformément au grec et dans un sens moral plus général.
  rationale: Le choix ne réduit pas la faute à une catégorie doctrinale précise et maintient la nuance plus forte de l’hébreu, tandis qu’une note indique la lecture grecque.
translation_notes:
  register: Français international moderne, sobre et digne. Les impératifs restent directs. L’image biblique des « mains » est conservée, avec son sens expliqué en note ; « purifie ton cœur » maintient la résonance morale et cultuelle de l’hébreu.
