    issue: Expansion temporelle dans « qui lui était réservé »
    rationale: Le texte hébreu dit littéralement « son statut/lot » et ne comporte pas de relative ni de temps passé. Cette expansion est interprétative, même si elle est contextuellement plausible.
  - severity: low
    issue: Formulation de la note sur le grec
    rationale: Le grec μνησθεὶς τὰ ἔσχατα signifie littéralement « se souvenant des choses dernières ». « En te souvenant de la fin » réduit le pluriel et précise légèrement la formulation.
