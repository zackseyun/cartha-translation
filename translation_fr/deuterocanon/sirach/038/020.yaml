  verdict: revise
  source_fidelity: 'La structure et le sens général sont fidèles au texte hébreu : rappel du destin commun du défunt et du vivant, suivi de l’antithèse elliptique « pour lui, hier ; pour toi, aujourd’hui ». Toutefois, « qui lui était réservé » introduit un passé explicatif absent de l’hébreu et affaiblit la concision du suffixe « son ».'
  naturalness: Le français est globalement naturel et le parallélisme final est réussi. « Souviens-toi de son sort » est plus direct, plus idiomatique dans ce contexte funéraire, et conserve mieux la sobriété poétique de l’original que « le sort qui lui était réservé ».
  terminology: « Sort » convient ici au sens de destinée ou de part assignée, sans devoir suggérer le hasard; la note maintient utilement « décret » et « part assignée » comme possibilités lexicales. Dans la note grecque, τὰ ἔσχατα est pluriel (« les choses dernières » / « les réalités dernières »), non simplement « la fin ».
  issues:
