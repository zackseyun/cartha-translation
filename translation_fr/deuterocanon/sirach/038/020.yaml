  text: 'Remember his lot, for it is your lot: his yesterday, and your today.'
translation:
  language: fr
  text: 'Souviens-toi de son sort[a], car c’est aussi le tien : pour lui, hier ; pour toi, aujourd’hui.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son décret » ou « sa part assignée ». Le mot hébreu חק désigne souvent une règle ou un décret, mais il évoque ici vraisemblablement le sort assigné à tout être humain dans la mort.
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec présente une formulation différente : « Ne livre pas ton cœur à la tristesse ; écarte-la, en te souvenant des choses dernières. » Il confirme le thème de la mortalité, mais ne traduit pas ici la même formulation hébraïque.'
    reason: alternative_reading
lexical_decisions:
- source_word: זכור
  choice: Rappelle-toi
  rationale: L’impératif de זכר appelle à garder activement à l’esprit la destinée du défunt. « Rappelle-toi » est direct et naturel en français.
- source_word: חקו
  choice: le sort qui lui était réservé
  rationale: חק désigne souvent une règle, un décret ou une part fixée. Dans ce contexte de deuil et de mort, cette formulation exprime une destinée assignée sans évoquer le hasard.
- source_word: כי הוא חקך
  choice: car c’est aussi le tien
  rationale: La proposition applique au lecteur la même destinée que celle du défunt. « Aussi » explicite sobrement le caractère commun de cette condition.
- source_word: לו אתמול ולך היום
  choice: pour lui, hier ; pour toi, aujourd’hui
  rationale: Cette formulation conserve le parallélisme concis et l’ellipse poétique de l’hébreu, sans ajouter explicitement le verbe « mourir ».
theological_decisions:
- issue: Sens de חק dans un contexte de mort et de deuil
  choice: sort réservé, au sens de destinée assignée
  alternative: décret, règle ou part assignée
  rationale: Le contexte porte sur la mortalité plutôt que sur une prescription juridique. La traduction garde l’idée d’une condition fixée et commune à tous, sans en faire une question de hasard.
- issue: Degré d’explicitation de la proposition finale elliptique
  choice: 'conserver l’ellipse : « pour lui, hier ; pour toi, aujourd’hui »'
  alternative: 'expliciter : « il est mort hier, et toi, tu mourras aujourd’hui »'
  rationale: L’hébreu demeure volontairement bref et implicite. Le français retenu préserve sa tension poétique sans imposer une précision absente du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme final reste bref et solennel. « Sort qui lui était réservé » évite que « sort » soit compris comme pur hasard, tandis que la note conserve les autres valeurs possibles de חק.
