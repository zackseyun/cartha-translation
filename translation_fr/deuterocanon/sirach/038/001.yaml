  text: Honor the physician according to your need of him[a], for God has also given him a portion.
translation:
  language: fr
  text: Honore le médecin selon le besoin que tu as de lui[a], car lui aussi tient de Dieu sa part.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, d’après le grec : « Honore le médecin pour ses services, car le Seigneur l’a créé lui aussi. » L’hébreu dit plus littéralement : « car avec lui aussi se trouve une part venant de Dieu ».'
    reason: Lecture parallèle du grec et formulation littérale de l’hébreu.
lexical_decisions:
- source_word: רעי
  choice: Honore
  rationale: L’impératif hébreu peut exprimer l’estime ou les égards à témoigner. Le grec Τίμα (« honore ») confirme fortement ce sens, que « Honore » rend avec clarté et dignité.
- source_word: רופא
  choice: le médecin
  rationale: רופא désigne celui qui soigne. « Médecin » est le terme courant et digne en français moderne.
- source_word: לפני צרכו
  choice: selon le besoin que tu as de lui
  rationale: La formulation hébraïque est condensée et associe les égards envers le médecin au besoin de ses soins. Cette traduction reste proche de l’hébreu sans introduire explicitement la notion grecque d’honoraires.
- source_word: כי עם אותו חלק אל
  choice: car lui aussi tient de Dieu sa part
  rationale: La phrase hébraïque affirme littéralement qu’avec lui aussi se trouve une part venant de Dieu. « Tient de Dieu sa part » conserve חלק (« part ») et l’origine divine de la fonction du médecin dans une tournure française naturelle.
theological_decisions:
- issue: Fondement théologique des égards dus au médecin
  choice: car lui aussi tient de Dieu sa part
  alternative: car le Seigneur l’a créé lui aussi
  rationale: Le texte principal suit l’hébreu conservé, qui parle d’une « part » liée à Dieu, tandis que le grec parle de la création du médecin par le Seigneur. La variante grecque est signalée sans fusionner les deux traditions.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier correspond à l’adresse sapientielle. La formulation garde la concision de l’hébreu et place l’expansion grecque en note.
