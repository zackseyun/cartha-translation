base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/024.yaml
  text: The wisdom of a scribe comes with the opportunity for leisure, and the one who is less occupied with his work will become wise.[a]
translation:
  language: fr
  text: La sagesse du scribe s’acquiert dans les moments de loisir, et celui dont le travail est moins prenant deviendra sage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu conservé de ce verset est difficile et ne s’accorde pas clairement avec le grec. La traduction suit ici le sens plus intelligible du grec, notamment pour « scribe » et pour le lien entre la sagesse et le loisir.
    reason: textual_variant
lexical_decisions:
- source_word: חכם / יתחכם || σοφία / σοφισθήσεται
  choice: sagesse / deviendra sage
  rationale: Le texte hébreu est difficile, tandis que le parallèle grec présente clairement le thème de la sagesse acquise. Cette formulation conserve le vocabulaire sapientiel sans imposer une reconstruction incertaine de l’hébreu.
- source_word: תומך מלמד || γραμματέως
  choice: scribe
  rationale: L’expression hébraïque conservée est instable et pourrait évoquer celui qui tient un instrument agricole, mais le grec porte nettement « scribe ». Le texte principal suit ici le sens cohérent du témoin grec, tout en signalant la difficulté en note.
- source_word: ἐν εὐκαιρίᾳ σχολῆς
  choice: quand il a du temps libre
  rationale: Le grec désigne le loisir ou la disponibilité permettant l’étude. Cette tournure est claire et naturelle en français moderne.
- source_word: ὁ ἐλασσούμενος πράξει αὐτοῦ
  choice: celui qui est moins pris par son travail
  rationale: L’expression grecque décrit une personne dont les activités pratiques sont réduites. « Moins pris par son travail » rend idiomatiquement cette moindre occupation.
theological_decisions:
- issue: Choix entre l’hébreu difficile et le parallèle grec cohérent
  choice: Suivre le grec pour le sens principal et signaler l’écart textuel
  alternative: Traduire littéralement l’hébreu comme une question concernant celui qui tient la charrue et se glorifie du manche de l’aiguillon
  rationale: Le témoin hébreu reste prioritaire en principe, mais sa formulation est ici obscure et ne correspond pas nettement au grec. Le grec transmet un proverbe cohérent sur le loisir nécessaire au scribe. Ce choix est textuel et non doctrinal.
translation_notes:
  register: Français international moderne, clair et digne. « Temps libre » exprime naturellement le loisir consacré à l’étude; « moins pris par son travail » évite une formulation administrative ou archaïque.
