translation:
  language: fr
  text: afin que son travail ne cesse pas et que la réussite vienne par les êtres humains[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le mot hébreu traduit par « réussite » est difficile ici ; il peut aussi évoquer l’efficacité, la solidité ou une aide effective. Le texte grec parallèle porte : « et la paix venant de lui est sur la face de la terre ».'
    reason: Signaler l’ambiguïté lexicale de l’hébreu et la lecture différente du témoin grec.
lexical_decisions:
- source_word: למען
  choice: afin que
  rationale: Introduit naturellement en français le but ou le résultat visé.
- source_word: לא ישבות
  choice: ne cesse pas
  rationale: Rend le sens de שבת, « cesser, s’arrêter », tout en conservant la portée continue de l’activité.
- source_word: מעשהו
  choice: son travail
  rationale: Le nom désigne ici l’activité ou l’ouvrage de la personne évoquée dans le contexte; « travail » est clair et naturel.
- source_word: ותושיה
  choice: et que la réussite
  rationale: תושיה est difficile dans ce passage et peut évoquer l’efficacité, la réussite ou une aide effective. « Réussite » conserve un sens positif large sans l’identifier simplement à la paix du parallèle grec.
- source_word: מבני אדם
  choice: vienne par l’intermédiaire des êtres humains
  rationale: L’expression signifie littéralement « des fils de l’être humain ». La préposition מן peut ici marquer la provenance ou l’intermédiaire; cette formulation française exprime l’action humaine sans connotation exclusivement masculine.
theological_decisions:
- issue: Rapport entre l’hébreu ותושיה מבני אדם et le parallèle grec qui parle de paix sur la face de la terre
  choice: Traduire d’abord le texte hébreu par « que la réussite vienne par l’intermédiaire des êtres humains »
  alternative: « et la paix venant de lui est sur la face de la terre »
  rationale: L’hébreu conservé est le témoin principal, mais sa formulation est concise et son terme תושיה demeure polysémique. La variante grecque est donc signalée en note plutôt qu’introduite dans le texte.
translation_notes:
  register: Français moderne, sobre et digne. « Êtres humains » rend explicitement la valeur générique de בני אדם; la structure « afin que… et que… » explicite le lien syntaxique sous-entendu par la brève proposition nominale hébraïque.
