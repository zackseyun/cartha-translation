  text: The resting place of the dead is his dwelling[b][a]; and be comforted when his life departs.
translation:
  language: fr
  text: Quand le mort repose, laisse reposer son souvenir[b] ; console-toi lorsque sa vie[a] s’en va.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « son âme ». Le mot hébreu נפש peut désigner la vie, l’âme, la personne ou le souffle vital.'
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec présente une lecture sensiblement différente : « Souviens-toi que son jugement est comme le tien : le mien hier, le tien aujourd’hui. » Il reflète probablement une autre forme du texte que l’hébreu conservé.'
    reason: alternative_reading
lexical_decisions:
- source_word: מושבת מתו
  choice: Quand le mort repose
  rationale: La suite hébraïque est difficile, mais, dans le contexte funéraire, elle évoque le repos du défunt. Cette formulation française rend ce sens sans préciser indûment qu’il s’agit de la tombe.
- source_word: שבת זכרו
  choice: laisse aussi reposer son souvenir
  rationale: שבת peut exprimer ici l’idée de cesser ou de reposer, tandis que זכרו signifie « son souvenir » ou « sa mémoire ». La tournure conserve le parallélisme entre le repos du mort et celui de son souvenir, plutôt que d’introduire un impératif « souviens-toi » insuffisamment assuré par la forme transmise.
- source_word: והנחם
  choice: console-toi
  rationale: La forme appelle la personne en deuil à recevoir ou à trouver consolation. « Console-toi » est direct, naturel et garde la nuance réfléchie de l’hébreu.
- source_word: עם צאת
  choice: lorsque … s’en va
  rationale: עם a ici une valeur temporelle, et צאת désigne le fait de sortir ou de partir. « Lorsque … s’en va » restitue naturellement l’image hébraïque du départ au moment de la mort.
- source_word: נפשו
  choice: sa vie
  rationale: נפש peut désigner la vie, l’âme, la personne ou le souffle vital. « Sa vie » convient au contexte de la mort sans imposer une anthropologie technique; « son âme » reste signalé en note.
theological_decisions:
- issue: Sens de נפש au moment de la mort
  choice: sa vie s’en va
  alternative: son âme s’en va
  rationale: Le terme hébreu possède une large gamme de sens. Le texte principal emploie « vie » afin de ne pas trancher implicitement une question doctrinale sur la nature de l’âme, tout en conservant l’autre lecture possible en note.
- issue: Divergence entre l’hébreu conservé et le grec
  choice: Traduire l’exhortation hébraïque concernant le repos du mort, son souvenir et la consolation
  alternative: '« Souviens-toi que son sort sera aussi le tien : hier pour moi, aujourd’hui pour toi. »'
  rationale: L’hébreu est le témoin principal ici, même si sa formulation est difficile. Le grec représente une forme textuelle sensiblement différente; sa lecture est donc préservée en note plutôt que substituée au texte hébreu.
translation_notes:
  register: Français international actuel, sobre et digne. Le parallélisme du repos du défunt et du repos de son souvenir est maintenu malgré la difficulté du texte hébreu. Le tutoiement correspond à l’exhortation sapientiale adressée directement au lecteur.
