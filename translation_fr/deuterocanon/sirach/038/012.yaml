  text: Also give the physician a place[a], and do not dismiss him, for there is need of him as well.
translation:
  language: fr
  text: Fais aussi une place au médecin[a] et ne le laisse pas s’éloigner, car lui aussi est nécessaire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec ajoute, après « médecin », « car le Seigneur l’a créé », puis précise : « qu’il ne s’éloigne pas de toi ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וגם
  choice: aussi
  rationale: Rend la valeur additive de וגם et rattache naturellement cette exhortation au contexte précédent.
- source_word: לרופא
  choice: au médecin
  rationale: רופא désigne le médecin ou le guérisseur; « médecin » est ici courant, précis et adapté au registre sapientiel.
- source_word: תן מקום
  choice: fais une place
  rationale: Conserve l’image concrète de l’hébreu, littéralement « donne une place », tout en employant une tournure française idiomatique qui signifie accueillir et reconnaître le rôle du médecin.
- source_word: ולא ימוש
  choice: ne le laisse pas s’éloigner
  rationale: Le verbe מוש exprime le fait de se retirer ou de s’éloigner. Cette formulation préserve ce mouvement sans durcir le sens en « renvoyer ».
- source_word: כי גם בו צורך
  choice: car lui aussi est nécessaire
  rationale: Rend de façon naturelle la construction hébraïque exprimant le besoin et maintient l’accent de גם sur la nécessité du médecin.
theological_decisions:
- issue: Différence entre le témoin hébreu et le parallèle grec
  choice: Suivre le texte hébreu sans insérer dans le corps du verset la proposition grecque sur la création du médecin par le Seigneur.
  alternative: « Fais aussi une place au médecin, car le Seigneur l’a créé, et ne le laisse pas s’éloigner de toi, car lui aussi est nécessaire. »
  rationale: Le texte hébreu conservé ne contient pas la proposition « car le Seigneur l’a créé ». Le grec constitue un parallèle ancien important, mais son ajout doit être signalé en note plutôt qu’intégré au texte principal.
translation_notes:
  register: Français moderne, international et digne. « Fais une place » reste concret et accessible; « ne le laisse pas s’éloigner » conserve la nuance du verbe hébreu plutôt que de l’interpréter comme un renvoi explicite.
