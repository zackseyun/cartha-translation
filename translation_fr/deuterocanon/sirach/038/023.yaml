translation_notes:
  register: Français international actuel, sobre et digne. La répétition de « sagesse » est maintenue parce qu’elle structure l’énoncé hébreu. « Dégagé de ses occupations » évite à la fois le familier « moins occupé » et l’interprétation trompeuse « sans travail ».
