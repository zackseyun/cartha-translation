  text: A scribe’s wisdom increases wisdom[a], and one free from busyness will become wise.
translation:
  language: fr
  text: La sagesse du scribe fait croître la sagesse, et celui qui est dégagé de ses occupations[a] deviendra sage.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « celui qui manque d’occupation » ou « qui a peu d’affaires »; il s’agit ici d’être libre des tâches qui accaparent.'
    reason: lexical_alternative
  - marker: b
    text: Le texte grec parallèle présente ici une formulation entièrement différente, consacrée au repos d’un mort et à la consolation après son dernier souffle. La traduction suit le texte hébreu conservé.
    reason: textual_variant
lexical_decisions:
- source_word: חכמת סופר
  choice: La sagesse du scribe
  rationale: « Scribe » conserve le rôle du lettré spécialiste des textes dans le contexte, tandis que « sagesse » rend directement חכמה sans le réduire à une simple compétence technique.
- source_word: תרבה חכמה
  choice: fait croître la sagesse
  rationale: Le causatif תרבה exprime l’accroissement. « Fait croître » restitue cette valeur tout en gardant la répétition intentionnelle de « sagesse » présente dans l’hébreu.
- source_word: וחסר עסק
  choice: celui qui est dégagé de ses occupations
  rationale: Littéralement, l’expression désigne quelqu’un qui « manque d’occupation/d’affaire ». Dans ce contexte, elle évoque la disponibilité nécessaire à l’étude plutôt que le chômage ou l’absence absolue de travail.
- source_word: יתחכם
  choice: deviendra sage
  rationale: La forme verbale indique ici l’acquisition ou le développement de la sagesse; « deviendra sage » est clair et naturel en français.
