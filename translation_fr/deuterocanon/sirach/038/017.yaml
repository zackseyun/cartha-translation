base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/017.yaml
  text: My son[a], make the mourning bitter and complete the lament; perform his mourning as is fitting for him. For a day or two, because of slander, shed tears[b]; then be comforted because of grief.
translation:
  language: fr
  text: Mon fils, rends la lamentation amère et mène le deuil à son terme ; accomplis pour lui le deuil qui lui convient. Pendant un jour ou deux, verse des larmes[a] ; puis laisse-toi consoler de ton chagrin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « un jour et deux, pour les larmes ». Le grec présente une autre lecture : « un jour ou deux, à cause des critiques », probablement afin d’éviter qu’on reproche au proche de négliger le deuil convenable.'
    reason: textual_variant
  - marker: b
    text: Le mot hébreu peut habituellement signifier « faute » ou « iniquité », mais il peut évoquer ici l’affliction. Le grec porte « tristesse » ou « chagrin ».
    reason: alternative_reading
lexical_decisions:
- source_word: המר
  choice: rends tes lamentations amères
  rationale: L’impératif causatif de מרר évoque des lamentations rendues amères ou intenses. Cette formulation conserve l’image hébraïque, également attestée par le grec πίκρανον, tout en restant compréhensible en français.
- source_word: והתם מספד
  choice: mène à son terme le chant funèbre
  rationale: Le verbe demande d’accomplir entièrement la lamentation rituelle, et non d’y mettre fin prématurément. « Chant funèbre » rend ici le sens précis de מספד.
- source_word: ושית אבלו
  choice: porte son deuil
  rationale: La tournure hébraïque appelle à accomplir le deuil dû au défunt. « Porter son deuil » est idiomatique en français et garde celui-ci comme point de référence.
- source_word: כיוצא בו
  choice: comme il convient pour lui
  rationale: L’expression indique une mesure appropriée au défunt. Le grec κατὰ τὴν ἀξίαν αὐτοῦ confirme l’idée de ce qui lui convient ou lui est dû.
- source_word: יום ושנים
  choice: pendant un jour ou deux
  rationale: La formule désigne naturellement une courte durée d’un ou deux jours plutôt qu’une addition littérale de nombres.
- source_word: בעבור דמעה
  choice: verse des larmes
  rationale: L’hébreu signifie littéralement « pour les larmes ». La formulation verbale française exprime naturellement l’invitation à pleurer pendant ce bref délai.
- source_word: הנחם
  choice: laisse-toi consoler
  rationale: 'L’impératif a une valeur passive ou réfléchie : après le temps des lamentations, la personne endeuillée doit accueillir la consolation. Le grec παρακλήθητι va dans le même sens.'
- source_word: בעבור עון
  choice: de ton chagrin
  rationale: 'עון est difficile ici : son sens courant est « faute », mais le contexte funèbre et le grec λύπης favorisent le champ de l’affliction, de la peine ou du chagrin. La note conserve l’autre possibilité.'
theological_decisions:
- issue: Rapport entre le texte hébreu et le parallèle grec
  choice: Suivre l’hébreu conservé, tout en utilisant le grec pour éclairer les expressions difficiles et en signalant sa divergence à propos des larmes ou des critiques.
  alternative: Adopter directement le grec « pour éviter les critiques » dans le corps du texte.
  rationale: Le témoin hébreu est ici disponible et doit rester premier. Le grec constitue néanmoins un témoin ancien important et clarifie notamment la dernière proposition, sans justifier que sa divergence remplace silencieusement l’hébreu.
- issue: Sens de עון dans la dernière proposition
  choice: Le comprendre comme « chagrin » ou « affliction ».
  alternative: Traduire par « faute » ou « iniquité ».
  rationale: Le sens moral habituel produirait ici une relation obscure avec la consolation. Le contexte du deuil et le grec « tristesse » appuient un sens lié à l’affliction, mais l’ambiguïté lexicale est conservée en note.
translation_notes:
  register: Français international actuel, digne et accessible. Le parallélisme des impératifs et l’image de l’amertume sont maintenus, tandis que les rites de deuil sont exprimés dans une syntaxe française naturelle.
