  text: but they will sustain the order of the age[b][a], and their prayer is in the work of their craft.
translation:
  language: fr
  text: mais ils soutiendront l’ordre du monde[a], et leur prière est dans le travail de leur métier[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui est créé pour durer » ou « l’ordre de l’âge ». L’expression grecque est concise et peut désigner aussi bien l’organisation durable de la société que, plus largement, l’ordre établi du monde.
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « leur prière est dans le travail de leur métier ». Le grec peut évoquer une prière liée à leur activité, présente en elle ou tournée vers elle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: mais
  rationale: Marque le contraste avec les limites de la participation publique des artisans évoquées dans le contexte précédent.
- source_word: κτίσμα αἰῶνος
  choice: l’ordre du monde
  rationale: κτίσμα désigne ce qui est créé, façonné ou établi, tandis que αἰών peut évoquer le monde ou l’âge. Dans ce contexte social, « l’ordre du monde » est naturel tout en laissant ouverte la portée exacte de l’expression.
- source_word: στηρίσουσιν
  choice: ils affermissent
  rationale: Le futur grec peut avoir ici une valeur générale; στηρίζω signifie rendre ferme, soutenir ou établir. « Affermissent » conserve cette image sans réduire le verbe au seul entretien d’un ordre déjà constitué.
- source_word: ἡ δέησις αὐτῶν
  choice: leur prière
  rationale: δέησις désigne normalement une demande, une supplication ou une prière; « prière » est clair, courant et digne.
- source_word: ἐν ἐργασίᾳ τέχνης
  choice: accompagne le travail de leur métier
  rationale: La tournure française explicite naturellement que la prière se situe dans la sphère de leur activité artisanale, sans affirmer que le travail se substitue à toute prière verbale.
theological_decisions:
- issue: Rapport entre la prière des artisans et leur travail
  choice: La prière accompagne ou habite leur travail qualifié.
  alternative: Leur demande porte sur la réussite de leur travail; ou leur travail lui-même constitue leur prière.
  rationale: Le grec associe étroitement δέησις et ἐργασία par ἐν, sans préciser si la prière est exprimée dans le travail, porte sur lui ou l’accompagne. La formulation choisie préserve ce lien sans identifier purement et simplement travail et prière.
translation_notes:
  register: Français international moderne, sobre et digne. « Métier » convient au contexte des artisans; « art » a été réservé à la note, car il pourrait suggérer en français contemporain les beaux-arts plutôt qu’un savoir-faire technique.
