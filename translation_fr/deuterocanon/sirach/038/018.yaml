  text: For from grief disaster comes forth[a]; so a sorrowful heart wastes away in sadness.
translation:
  language: fr
  text: Car du chagrin sort le malheur[a] ; ainsi, un cœur affligé se consume dans la tristesse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Car du chagrin sort la mort, et le chagrin du cœur fait plier la force. » L’hébreu lit « malheur » plutôt que « mort » ; le texte principal suit donc le témoin hébreu, tandis que la variante grecque est conservée ici.'
    reason: alternative_reading
lexical_decisions:
- source_word: מדין
  choice: du chagrin
  rationale: La forme hébraïque est difficile isolément, mais le grec ἀπὸ λύπης confirme nettement le sens de chagrin ou douleur, approprié au contexte du deuil.
- source_word: יוצא
  choice: sort
  rationale: Ce choix conserve simplement l’image hébraïque de quelque chose qui provient ou émerge d’une autre réalité.
- source_word: אסון
  choice: le malheur
  rationale: Le terme hébreu désigne une calamité ou un grave malheur. Le grec porte « mort », variante significative signalée en note.
- source_word: כן
  choice: ainsi
  rationale: Rend la correspondance ou la conséquence établie entre les deux propositions sans la réduire à une simple coordination.
- source_word: רע לבב
  choice: un cœur affligé
  rationale: Littéralement « mauvais de cœur », l’expression décrit ici un état intérieur douloureux plutôt qu’un mal moral ; « affligé » convient au contexte et au parallèle grec.
- source_word: יכלה
  choice: se consume
  rationale: Le verbe exprime l’épuisement, la consomption ou l’arrivée à son terme ; la forme pronominale est naturelle en français dans ce contexte.
- source_word: עצבה
  choice: dans la tristesse
  rationale: Le nom évoque la douleur, le chagrin ou la tristesse ; cette formulation préserve le parallélisme affectif du vers.
