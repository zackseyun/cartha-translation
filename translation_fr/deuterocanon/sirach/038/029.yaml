  text: The sound of the hammer strikes his ear[a], and his eyes are on the form of the vessel;
translation:
  language: fr
  text: Le son du marteau frappe son oreille[a], et ses yeux sont tournés vers la forme du vase.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Le son du marteau résonne à son oreille. » Le verbe grec est difficile dans ce contexte et peut évoquer l’effet répété des coups de marteau sur l’ouïe de l’artisan.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ σφύρης
  choice: le bruit du marteau
  rationale: Dans ce contexte d’artisanat, φωνή désigne le son produit par le marteau plutôt qu’une voix; « bruit » est naturel en français.
- source_word: καινεῖ
  choice: frappe
  rationale: Le verbe est difficile ici. Avec le bruit du marteau pour sujet et l’oreille pour objet, « frappe » exprime naturellement l’impact sonore, sans imposer une interprétation trop précise.
- source_word: τὸ οὖς αὐτοῦ
  choice: son oreille
  rationale: Le singulier concret du grec est conservé et convient à l’image sensorielle.
- source_word: κατέναντι
  choice: restent fixés sur
  rationale: Le sens spatial « devant, en face de » indique ici l’attention visuelle soutenue de l’artisan; cette formulation est idiomatique en français.
- source_word: ὁμοιώματος
  choice: la forme
  rationale: « Forme » rend la ressemblance ou la configuration prise pour référence sans préciser indûment qu’il s’agit d’un patron ou d’un modèle distinct.
- source_word: σκεύους
  choice: du vase
  rationale: Dans le contexte du travail artisanal, σκεῦος désigne vraisemblablement le récipient façonné; « vase » est clair, digne et suffisamment large.
- source_word: οἱ ὀφθαλμοὶ αὐτοῦ
  choice: ses yeux
  rationale: La formulation concrète du grec est conservée.
theological_decisions: []
