  text: All these have trusted in their hands[a], and each becomes skillful in his own work.
translation:
  language: fr
  text: Tous ceux-là se fient à leurs mains[a], et chacun se montre habile dans son travail.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La tournure grecque est difficile. Elle pourrait aussi se comprendre : « ont été confiés entre leurs mains » ou « ont mis leur confiance dans leurs mains ». Le texte principal retient le sens probable selon lequel ces artisans comptent sur leur habileté manuelle.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες οὗτοι
  choice: Tous ceux-là
  rationale: Cette expression démonstrative renvoie aux artisans mentionnés précédemment sans ajouter au grec un nom comme « hommes ».
- source_word: εἰς χεῖρας αὐτῶν ἐνεπίστευσαν
  choice: se sont fiés à leurs mains
  rationale: La formulation conserve l’image des mains et comprend l’aoriste actif comme l’expression de la confiance que les artisans placent dans leur habileté manuelle. La construction grecque étant inhabituelle, l’autre analyse possible est signalée en note.
- source_word: ἕκαστος
  choice: chacun
  rationale: « Chacun » rend directement la valeur distributive du grec.
- source_word: ἐν τῷ ἔργῳ αὐτοῦ
  choice: dans son propre travail
  rationale: Le choix conserve le possessif et désigne le domaine où chacun exerce sa compétence; « propre » explicite naturellement la valeur individualisante dans ce contexte.
- source_word: σοφίζεται
  choice: acquiert du savoir-faire
  rationale: Dans le contexte des métiers manuels, le verbe désigne une sagesse pratique ou une habileté qui se développe. « Savoir-faire » maintient le lien avec la sagesse tout en restant idiomatique en français.
