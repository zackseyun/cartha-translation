translation:
  language: fr
  text: Car sa supplication peut réussir[a], et sa guérison sert à préserver la vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu פשרה est incertain ici. Le parallèle grec dit plus explicitement : « eux aussi supplieront le Seigneur, afin qu’il leur accorde le repos et la guérison pour que la vie se poursuive ».'
    reason: alternative_reading
lexical_decisions:
- source_word: פשרה
  choice: sa supplication
  rationale: Le terme hébreu est difficile dans ce contexte. Le parallèle grec emploie δεηθήσονται (« ils supplieront, prieront »), ce qui appuie le sens d’une demande adressée à Dieu. « Supplication » préserve cette dimension sans préciser davantage la forme de la prière.
- source_word: יצלח לו
  choice: peut aboutir
  rationale: Le verbe exprime l’idée de réussir ou de prospérer. « Peut aboutir » rend cette possibilité avec naturel tout en évitant de présenter le résultat comme assuré.
- source_word: ורפאות
  choice: et sa guérison
  rationale: Le pluriel hébreu peut désigner les actes ou les moyens de guérison; le grec ἴασιν confirme le champ sémantique de la guérison. Le singulier collectif est idiomatique en français et conserve la concision du texte.
- source_word: למען מחיה
  choice: contribue à préserver la vie
  rationale: La locution exprime le but de la guérison. Cette formulation française indique clairement qu’elle vise le maintien de la vie, en accord avec le grec χάριν ἐμβιώσεως.
theological_decisions:
- issue: Articulation du texte hébreu difficile avec le parallèle grec plus explicite
  choice: Traduire prioritairement l’hébreu, tout en laissant le grec éclairer פשרה comme une supplication et למען מחיה comme la préservation de la vie.
  alternative: « afin que Dieu leur accorde repos et guérison pour prolonger la vie »
  rationale: L’alternative suit plus directement le grec, mais introduit dans le corps du verset des éléments absents du témoin hébreu fourni. Le texte retenu conserve donc la structure concise et l’ambiguïté de l’hébreu, tandis que la note signale la lecture grecque.
translation_notes:
  register: Français international moderne, sobre et digne. « Supplication » garde la dimension religieuse suggérée par le grec; « peut aboutir » préserve l’incertitude du résultat. La syntaxe reste concise afin de respecter le caractère fragmentaire du témoin hébreu.
