  text: My son[a], shed tears for the dead, be bitter, and begin the lament.
translation:
  language: fr
  text: Mon fils, verse des larmes pour le mort, afflige-toi amèrement et commence une lamentation.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu porte littéralement : « afflige-toi amèrement et … une lamentation » ; le dernier verbe est difficile dans le texte hébreu conservé. Le grec parallèle lit : « et, comme quelqu’un qui souffre terriblement, commence la lamentation », ce qui appuie le sens retenu ici.'
    reason: textual_variant
lexical_decisions:
- source_word: בני
  choice: Mon fils
  rationale: Vocatif singulier avec suffixe de première personne ; « Mon fils » conserve le ton paternel de l’enseignement sapientiel.
- source_word: על המת
  choice: sur le mort
  rationale: La préposition introduit ici la personne à l’occasion de laquelle on mène deuil ; « sur le mort » est une tournure française digne et traditionnelle sans être obscure.
- source_word: הזיב דמעה
  choice: verse des larmes
  rationale: L’expression hébraïque signifie littéralement faire couler une larme ; cette formulation garde l’image concrète et l’impératif.
- source_word: התמרר
  choice: laisse éclater ton amertume
  rationale: Le hitpael exprime l’entrée ou l’engagement dans une douleur amère. La formulation française rend cette manifestation du chagrin sans réduire le verbe à un simple adverbe.
- source_word: וגהה קינה
  choice: entonne une lamentation
  rationale: קינה désigne une lamentation funèbre formelle. Le dernier verbe hébreu est difficile, tandis que le grec parallèle appuie l’idée de commencer la lamentation ; « entonne » exprime naturellement ce commencement.
