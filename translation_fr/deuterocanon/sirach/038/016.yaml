review_pass:
  verdict: revise
  source_fidelity: « Verse des larmes » rend fidèlement הזיב דמעה. « Pour le mort » exprime de façon idiomatique en français l’occasion du deuil marquée par על המת. Le réfléchi « afflige-toi amèrement » rend mieux la valeur du hitpael התמרר que « laisse éclater ton amertume », qui introduit l’idée, non explicite, d’une extériorisation. « Commence une lamentation » suit le sens que soutient le grec parallèle, tout en laissant à la note la difficulté du dernier verbe hébreu.
  naturalness: « Sur le mort » est possible dans un registre ancien, mais paraît peu naturel en français international moderne. « Pour le mort » est courant et conserve le sens funèbre. « Entonne » suppose plus précisément une mise en chant; « commence une lamentation » est plus neutre et plus proche de l’appui grec.
  terminology: « Mon fils » convient au vocatif paternel בני. « Lamentation » traduit bien קינה, sans imposer que le geste soit explicitement chanté. La note doit éviter de présenter « sois amer » comme une traduction littérale satisfaisante du hitpael; « afflige-toi amèrement » en indique mieux la force réflexive.
  issues:
  - severity: medium
    issue: « sur le mort » est une formulation peu idiomatique dans le français moderne international.
    rationale: La préposition hébraïque marque ici l’objet ou l’occasion du deuil. « Pour le mort » est naturel sans modifier ce rapport.
  - severity: medium
    issue: « laisse éclater ton amertume » ajoute une notion de manifestation extérieure.
    rationale: התמרר appelle la personne à s’affliger ou à éprouver une douleur amère; le texte ne dit pas explicitement de laisser cette amertume éclater.
  - severity: low
    issue: « entonne » spécifie une exécution chantée.
    rationale: Une qinah peut être une lamentation formelle, mais le verbe hébreu transmis est difficile. Le grec soutient « commence » sans exiger le sens précis d’« entonner ».
  revised_text: Mon fils, verse des larmes pour le mort, afflige-toi amèrement et commence une lamentation.[a]
