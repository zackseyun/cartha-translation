translation:
  language: fr
  text: Avec son bras, il façonne l’argile et, devant ses pieds, il se courbe avec force.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, le grec dit : « il pliera sa force ». Cette expression peut évoquer soit l’effort qu’il met à l’ouvrage, soit la posture courbée de l’artisan sur son travail.'
    reason: ambiguïté idiomatique
lexical_decisions:
- source_word: ἐν βραχίονι αὐτοῦ
  choice: De son bras
  rationale: Le bras est présenté comme l’instrument du travail. Cette tournure conserve l’image corporelle et manuelle du grec.
- source_word: τυπώσει
  choice: il façonne
  rationale: Avec πηλόν, le verbe désigne ici l’action de donner forme à l’argile; « façonne » est naturel et n’impose pas une technique particulière.
- source_word: πηλόν
  choice: l’argile
  rationale: Dans le contexte du travail du potier, πηλός désigne naturellement l’argile.
- source_word: πρὸ ποδῶν
  choice: devant ses pieds
  rationale: La traduction garde l’expression spatiale concrète du grec et situe le matériau ou l’ouvrage devant l’artisan.
- source_word: κάμψει ἰσχὺν αὐτοῦ
  choice: il déploie toute sa force
  rationale: L’expression grecque, littéralement « il pliera sa force », est comprimée et peu idiomatique en français. La formulation retenue exprime l’effort physique appliqué au travail tout en signalant en note l’autre lecture possible, celle de la posture courbée.
