  register: Français moderne, digne et concret. Le présent rend la description habituelle de l’artisan plus naturellement que le futur morphologique grec dans ce contexte. L’ambiguïté de κάμψει ἰσχὺν αὐτοῦ est conservée au moyen d’une traduction idiomatique accompagnée d’une note.
