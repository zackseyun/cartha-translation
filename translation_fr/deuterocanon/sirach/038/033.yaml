  text: He will apply his heart to complete the glaze[b][a], and his wakefulness is to cleanse the furnace.
translation:
  language: fr
  text: Il s’appliquera de tout cœur à achever la finition[a], et veillera à nettoyer le four[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec est difficile. Le mot traduit par « finition » signifie habituellement « don » ou « faveur »; dans ce contexte artisanal, il pourrait désigner le décor, le revêtement ou l’aspect achevé de la poterie.
    reason: alternative_reading
  - marker: b
    text: Ou « la fournaise »; dans le contexte de la poterie, il s’agit probablement du four de cuisson.
    reason: lexical_alternative
lexical_decisions:
- source_word: καρδίαν ἐπιδώσει
  choice: Il s’appliquera de tout cœur
  rationale: Cette tournure française naturelle conserve l’idée du cœur tout en exprimant l’engagement résolu de l’artisan dans sa tâche.
- source_word: συντελέσαι
  choice: à achever
  rationale: 'L’infinitif indique le but de son application : mener l’ouvrage à son terme.'
- source_word: τὸ χάρισμα
  choice: la finition
  rationale: Le sens habituel de « don » convient mal ici. Dans le contexte du potier, le terme semble désigner l’achèvement ou la finition de la pièce, sans que le grec permette d’identifier avec certitude un glaçage technique.
- source_word: ἡ ἀγρυπνία αὐτοῦ
  choice: veillera
  rationale: La formulation verbale rend naturellement l’attention éveillée ou la vigilance soutenue de l’artisan, sans imposer l’idée littérale d’insomnie.
- source_word: καθαρίσαι
  choice: à nettoyer
  rationale: Avec un four comme complément, « nettoyer » est plus idiomatique que « purifier » et évite une connotation rituelle étrangère au contexte.
- source_word: κάμινον
  choice: le four
  rationale: Dans le contexte de la poterie, κάμινος désigne vraisemblablement le four de cuisson; « four » est naturel en français et plus adapté ici que le terme général « fournaise ».
