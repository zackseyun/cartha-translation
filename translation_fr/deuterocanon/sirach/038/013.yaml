  text: For there is a time when success is in his hands[a], for he too will make supplication to God.
translation:
  language: fr
  text: Car il y a des moments où le succès est entre ses mains[a], car lui aussi adressera à Dieu une supplication.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « il y a un temps où le succès est aussi entre leurs mains ». Le témoin hébreu porte le singulier (« ses mains »), qui est retenu dans le texte.'
    reason: textual_variant
lexical_decisions:
- source_word: כי
  choice: car
  rationale: Dans les deux propositions, la conjonction donne la raison de ne pas écarter le médecin dans le contexte immédiat.
- source_word: יש עתם
  choice: il y a un temps
  rationale: Cette formulation naturelle conserve le singulier indéfini sans ajouter l'idée plus précise d'un temps fixé.
- source_word: בידו
  choice: entre ses mains
  rationale: L'expression française conserve l'image hébraïque et désigne la capacité d'action concrète du médecin.
- source_word: מצלחת
  choice: la réussite
  rationale: Le terme évoque une issue favorable ou le succès; « réussite » convient au contexte médical et concorde avec le grec εὐοδία.
- source_word: גם הוא
  choice: lui aussi
  rationale: Cette tournure souligne que le médecin, lui aussi, se tourne vers Dieu.
- source_word: אל אל
  choice: à Dieu
  rationale: La répétition s'analyse au mieux comme la préposition « à » suivie du titre divin; le français naturel n'en répète pas la forme.
- source_word: יעתיר
  choice: adressera sa supplication
  rationale: Le verbe exprime une prière instante; cette traduction en garde la force tout en restant digne et actuelle.
- source_word: ἐν χερσὶν αὐτῶν
  choice: entre ses mains
  rationale: Le grec porte le pluriel « entre leurs mains », mais le témoin hébreu principal porte le singulier, retenu dans le texte et signalé en note.
theological_decisions:
- issue: Rapport entre la compétence médicale et l'action divine
  choice: Le médecin peut connaître une réussite réelle tout en dépendant de Dieu dans la prière.
  alternative: On pourrait comprendre plus faiblement que les médecins réussissent simplement à certaines occasions, ou généraliser l'énoncé à l'ensemble des praticiens d'après le pluriel grec.
  rationale: L'hébreu et le grec maintiennent ensemble l'efficacité des moyens médicaux et le recours du médecin à Dieu, sans réduire la guérison ni à la seule technique humaine ni à la seule intervention miraculeuse.
translation_notes:
  register: Français international moderne, naturel et digne. « Adressera sa supplication » conserve l'intensité de la prière sans archaïsme marqué; « entre ses mains » maintient l'image concrète de l'hébreu.
