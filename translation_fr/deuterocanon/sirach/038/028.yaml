  rationale: La révision remplace le pluriel français peu idiomatique « ses chairs » par le collectif naturel « sa chair » et rend ἐν θέρμῃ par « dans la chaleur », afin de préserver l’ambiguïté spatiale ou circonstancielle du grec. Les deux appels de note restent correctement ancrés et les alternatives lexicales demeurent pertinentes.
