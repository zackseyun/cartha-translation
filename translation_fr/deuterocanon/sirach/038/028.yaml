  text: So the smith sits near the anvil and studies the raw iron; the vapor of the fire wastes his flesh, and he struggles with the heat of the furnace.
translation:
  language: fr
  text: Ainsi, le forgeron, assis près de l’enclume, examine le fer non travaillé[a] ; la vapeur du feu fait fondre sa chair[b], et il lutte dans la chaleur de la fournaise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le fer brut ». L’adjectif grec peut désigner ce qui est inactif ou n’a pas encore été travaillé.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « fait fondre sa chair ». L’expression grecque est très imagée ; on pourrait aussi traduire « consume sa chair ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαλκεύς
  choice: forgeron
  rationale: Terme français naturel pour l’artisan qui travaille ici le fer, sans retenir le sens plus étroit de « bronzier ».
- source_word: ἐγγὺς ἄκμονος
  choice: près de l’enclume
  rationale: Rend directement la relation spatiale et le vocabulaire propre au travail du métal.
- source_word: καταμανθάνων
  choice: examine
  rationale: Exprime l’observation attentive de la matière, de manière plus naturelle ici que « étudie ».
- source_word: ἀργῷ σιδήρῳ
  choice: le fer non travaillé
  rationale: ἀργός désigne probablement ici le fer encore inactif ou non ouvré. Cette formulation évite les connotations métallurgiques possibles de « fer brut » tout en conservant le sens contextuel.
- source_word: ἀτμὶς πυρός
  choice: la vapeur du feu
  rationale: Conserve l’image distincte de ἀτμίς sans la confondre avec θέρμη, la chaleur mentionnée ensuite.
- source_word: τήξει σάρκας αὐτοῦ
  choice: fait fondre ses chairs
  rationale: Préserve l’image forte et littérale du grec, où le futur τήξει décrit l’action de la vapeur du feu sur les chairs.
- source_word: ἐν θέρμῃ καμίνου
  choice: contre la chaleur de la fournaise
  rationale: « Fournaise » convient au contexte de la forge, et « contre » rend naturellement l’idée d’affrontement portée par le verbe.
- source_word: διαμαχήσεται
  choice: il lutte
  rationale: Restitue l’idée d’un combat pénible et soutenu contre la chaleur.
