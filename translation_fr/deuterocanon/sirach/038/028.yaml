  source_fidelity: Le texte rend correctement l’artisan, l’enclume, le fer non travaillé et l’opposition entre l’« exhalaison/vapeur » du feu (ἀτμίς) et la chaleur de la fournaise (θέρμη καμίνου). Toutefois, « contre la chaleur » interprète le datif ἐν θέρμῃ comme un adversaire direct ; « dans la chaleur » conserve plus sobrement la construction grecque et son cadre oppressant. « Ses chairs » est grammaticalement possible mais peu naturel en français contemporain pour σάρκας au sens collectif.
