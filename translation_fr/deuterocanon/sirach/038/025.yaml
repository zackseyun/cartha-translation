base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/025.yaml
  text: How can one who guides the plow become wise[b][a], who drives the ox with a goad and whose concerns are with the cattle?
translation:
  language: fr
  text: Comment celui qui conduit la charrue peut-il devenir sage[a], lui qui mène le bœuf et dont les préoccupations concernent le bétail[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le début de l’hébreu est difficile. Le grec formule plus explicitement : « Comment celui qui tient une charrue deviendra-t-il sage… ? » La traduction suit l’hébreu en s’aidant du grec pour préciser le cadre agricole.'
    reason: alternative_reading
  - marker: b
    text: 'Autre traduction possible : « dont les propos portent sur le bétail ». Le mot hébreu peut désigner soit ses préoccupations en général, soit plus précisément ce dont il parle ; le grec favorise ce second sens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אלוף ינהג
  choice: celui qui conduit … peut-il devenir sage
  rationale: Le début de l’hébreu est difficile. Le parallèle grec formule explicitement une question sur la possibilité, pour celui qui tient la charrue, de devenir sage. La traduction conserve cette question tout en rendant נהג par « conduit » dans son sens de mener ou diriger.
- source_word: לשדד
  choice: la charrue
  rationale: La racine évoque le travail qui consiste à ouvrir ou retourner le sol. Le grec mentionne explicitement la charrue, ce qui permet d’exprimer naturellement en français l’activité agricole sous-entendue par l’hébreu.
- source_word: ישובב בשור
  choice: lui qui mène le bœuf
  rationale: La forme ישובב est incertaine et peut évoquer le fait de faire aller et venir ou de diriger. Dans le contexte du labour, « mène » rend sobrement la conduite de l’animal de trait sans préciser indûment le mouvement.
- source_word: שעיותיו
  choice: dont les préoccupations vont
  rationale: Le terme peut désigner les pensées, les préoccupations ou les propos. Le choix principal garde le sens général de l’attention absorbée par le travail, tandis qu’une note signale l’interprétation plus spécifiquement verbale.
- source_word: בני בקר
  choice: au bétail
  rationale: L’expression signifie littéralement « fils du gros bétail » et désigne ici les bovins. « Bétail » est naturel en français et convient à la portée collective du contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique est conservée sans expliciter davantage le rapport entre travail manuel et sagesse. « Peut-il devenir sage » rend la force interrogative du grec tout en évitant une tournure française trop absolue.
