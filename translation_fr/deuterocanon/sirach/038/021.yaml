  text: Do not keep remembering him[a], for there is no return; you will not help him, and you will harm yourself.
translation:
  language: fr
  text: Ne continue pas à penser à lui, car il n’a pas d’espoir[a]. À quoi cela servirait-il ? Et tu te ferais du mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « car il n’a pas d’espoir » ; le texte grec parallèle porte : « car il n’y a pas de retour ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אל תזכרנו
  choice: Ne continue pas à penser à lui
  rationale: Dans le contexte du deuil, l’impératif négatif avec זכר déconseille de rester fixé sur le défunt plutôt que d’interdire tout souvenir. Cette formulation française exprime naturellement cette continuité sans effacer le sens de « se souvenir de lui ».
- source_word: כי אין לו תקוה
  choice: car il n’a plus d’espoir
  rationale: Le texte hébreu dit littéralement qu’« il n’a pas d’espoir ». « Plus » rend naturellement en français la situation irréversible du défunt sans substituer au texte hébreu la lecture grecque « il n’y a pas de retour », qui est signalée en note.
- source_word: מה תועיל
  choice: À quoi cela servirait-il ?
  rationale: La question hébraïque demande quel profit ou avantage résulterait de cette persistance dans le souvenir. Le sujet impersonnel « cela » renvoie à l’attitude précédente et évite d’ajouter l’objet « lui », explicite seulement dans le parallèle grec.
- source_word: ולך תרע
  choice: Tu te ferais du mal
  rationale: La construction indique que le endeuillé se cause du tort. Le conditionnel s’accorde naturellement en français avec la question rhétorique précédente et transmet l’avertissement réflexif confirmé par le grec.
theological_decisions:
- issue: Faut-il traduire תקוה par son sens hébreu habituel « espoir » ou adopter la lecture grecque « retour » ?
  choice: car il n’a plus d’espoir
  alternative: car il n’y a pas de retour
  rationale: L’hébreu, source principale et ici bien attestée, porte תקוה, « espoir ». Le grec exprime plutôt l’irréversibilité par « retour ». La traduction suit donc l’hébreu dans le texte principal et conserve la tension textuelle dans une note.
- issue: Faut-il préciser que le deuil ne peut pas aider le défunt ?
  choice: À quoi cela servirait-il ?
  alternative: Tu ne lui serais d’aucune aide
  rationale: L’hébreu pose une question générale sans objet explicite, tandis que le grec précise « tu ne l’aideras pas ». La formulation retenue préserve l’indétermination de l’hébreu sans imposer l’explicitation grecque.
translation_notes:
  register: Français moderne, sobre et digne. Le tutoiement conserve l’adresse individuelle de l’hébreu. La formulation évite d’interdire absolument tout souvenir du défunt et vise plutôt la fixation prolongée propre au contexte du deuil.
