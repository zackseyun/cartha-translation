  text: In the treasures of wisdom are insightful sayings[b], but godliness[c] is an abomination to a sinner.[a]
translation:
  language: fr
  text: Dans les trésors de la sagesse se trouvent des maximes de connaissance[b], mais la piété[c] est une abomination aux yeux du pécheur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'À cet endroit, la ligne hébraïque conservée dans les manuscrits de la Guéniza du Caire dit approximativement : « Il se réjouira en elle, et elle se réjouira en lui, et ne l’abandonne jamais, pour toujours et à jamais. » Comme elle ne correspond pas au texte grec, la traduction du verset suit ici le témoin grec.'
    reason: textual_variant
  - marker: b
    text: Ou « des proverbes de connaissance »; littéralement « des maximes de connaissance ».
    reason: lexical_alternative
  - marker: c
    text: Ou « la révérence envers Dieu »; le terme grec désigne la piété, c’est-à-dire le respect et la dévotion envers Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν θησαυροῖς σοφίας
  choice: Parmi les trésors de la sagesse
  rationale: Le texte hébreu conservé ne correspond pas à ce verset; le grec sert donc ici de base. « Parmi » exprime naturellement la présence de ces maximes au nombre des trésors que renferme la sagesse.
- source_word: παραβολαὶ ἐπιστήμης
  choice: des maximes pleines de discernement
  rationale: παραβολαί désigne ici des propos sapientiaux, tels que maximes ou proverbes, plutôt que les paraboles au sens évangélique; ἐπιστήμης les caractérise comme porteurs de connaissance et de discernement.
- source_word: βδέλυγμα
  choice: une abomination
  rationale: Ce terme fort désigne ce qui provoque une profonde répulsion et conserve ici sa portée morale et religieuse.
- source_word: ἁμαρτωλῷ
  choice: pour le pécheur
  rationale: 'Le datif indique le point de vue ou l''appréciation du pécheur: à ses yeux, la révérence envers Dieu est abominable.'
- source_word: θεοσέβεια
  choice: la révérence envers Dieu
  rationale: Cette formulation explicite le sens de piété ou de respect religieux dirigé vers Dieu, en français moderne et sans connotation confessionnelle particulière.
theological_decisions:
- issue: Divergence majeure entre les témoins hébreu et grec
  choice: Traduire le texte grec dans le corps du verset et signaler en note la ligne hébraïque divergente.
  alternative: 'Traduire comme texte principal la ligne hébraïque conservée: « Il se réjouira en elle, et elle se réjouira en lui; ne l''abandonne jamais. »'
  rationale: La ligne hébraïque transmise à cet emplacement ne correspond pas au contenu grec de Siracide 1.24 et paraît déplacée ou rattachée à un autre contexte. Le grec fournit ici le témoin continu correspondant au verset reçu; la note préserve honnêtement la divergence sans harmonisation.
translation_notes:
  register: Français international moderne, digne et accessible. « Maximes » maintient le registre sapiential sans évoquer exclusivement les paraboles des Évangiles. « Révérence envers Dieu » est plus explicite et naturel ici que « piété », tout en laissant cette possibilité en note.
