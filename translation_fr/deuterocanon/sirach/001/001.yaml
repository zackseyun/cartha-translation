translation:
  language: fr
  text: Toute sagesse vient de Yahweh, et elle est avec lui pour toujours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל חָכְמָה
  choice: Toute sagesse
  rationale: Le quantificateur כָּל donne une portée universelle, et חָכְמָה désigne ici la sagesse au sens sapientiel large. « Toute sagesse » est naturel en français et correspond aussi au grec πᾶσα σοφία.
- source_word: מֵיהֹוָה
  choice: vient de Yahweh
  rationale: La préposition מִן indique ici l’origine ou la provenance. Le texte hébreu porte explicitement le nom divin יהוה ; « vient de Yahweh » exprime clairement que toute sagesse a en lui sa source.
- source_word: וִעמּוֹ הִיא
  choice: et elle est avec lui
  rationale: עִם signifie « avec » et le suffixe renvoie à Yahweh. Le pronom féminin הִיא reprend חָכְמָה ; le français emploie donc naturellement « elle ». Le verbe « est », implicite dans la proposition nominale hébraïque, est également attesté dans le parallèle grec.
- source_word: לְעוֹלָמִים
  choice: pour toujours
  rationale: L’expression marque une durée sans fin. « Pour toujours » est une formulation française moderne, claire et digne, cohérente avec le grec εἰς τὸν αἰῶνα.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le témoin hébreu emploie directement le tétragramme יהוה, tandis que le parallèle grec porte Κυρίου, « Seigneur ». Le texte principal conserve le nom divin explicite de la source hébraïque, qui bénéficie ici d’une confiance élevée.
- issue: Éventuelle personnification de la sagesse
  choice: Pronom grammatical « elle » sans accentuer la personnification
  alternative: Reformuler par « celle-ci » ou répéter « la sagesse »
  rationale: Le féminin français est imposé naturellement par le nom « sagesse », comme le féminin hébreu הִיא reprend חָכְמָה. Ce seul pronom ne suffit pas à trancher si la sagesse est personnifiée dans ce verset ; la traduction préserve cette réserve.
translation_notes:
  register: Français international moderne, simple et digne. La structure brève et équilibrée de l’hébreu est conservée sans archaïsme. Aucun appel de note n’est nécessaire, puisque le nom divin attesté par la source hébraïque est rendu directement dans le texte.
