  text: Desire wisdom, keep the commandments, and the Lord will supply her[b][a] to you.
translation:
  language: fr
  text: Désire la sagesse, garde les commandements, et le Seigneur te l’accordera.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La ligne hébraïque conservée qui est fournie pour ce verset ne correspond pas à Siracide 1.25; la traduction suit donc ici le témoin grec.
    reason: textual_variant
  - marker: b
    text: 'Autre traduction possible : « Si tu désires la sagesse, garde les commandements, et le Seigneur te la donnera. » Le participe initial peut avoir une valeur conditionnelle, et le verbe traduit par « accordera » peut aussi être rendu par « donnera » ou « fournira ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιθυμήσας
  choice: Désire
  rationale: Le participe aoriste peut avoir une valeur conditionnelle (« si tu désires »), mais, dans cette suite d’exhortations, l’impératif rend naturellement sa force en français.
- source_word: σοφίαν
  choice: la sagesse
  rationale: Traduction usuelle de σοφία; le féminin français permet de conserver sans artifice la personnification présente dans le texte.
- source_word: διατήρησον
  choice: garde
  rationale: Dans le contexte des commandements, « garder » exprime l’obéissance fidèle et reste conforme au registre biblique courant.
- source_word: ἐντολάς
  choice: les commandements
  rationale: Ce choix conserve la portée éthique et religieuse du terme, avec une formulation française naturelle.
- source_word: Κύριος
  choice: le Seigneur
  rationale: Équivalent français établi de Κύριος dans ce contexte scripturaire.
- source_word: χορηγήσει
  choice: accordera
  rationale: Le verbe évoque le fait de fournir ou d’octroyer; « accordera » est naturel en français et exprime un don venant du Seigneur sans réduire le sens à une simple remise matérielle.
- source_word: σοι
  choice: te
  rationale: Le pronom datif est rendu idiomatiquement par le pronom indirect français.
- source_word: αὐτήν
  choice: l’
  rationale: Le pronom reprend clairement « la sagesse »; son référent féminin maintient la personnification, même si l’élision masque le genre à l’écrit.
theological_decisions:
- issue: Choix de la source principale pour ce verset
  choice: Traduire le témoin grec parallèle, qui correspond à Siracide 1.25.
  alternative: Traduire la ligne hébraïque fournie comme si elle appartenait à ce verset.
  rationale: La ligne hébraïque transmise dans les données (« Les anges de Dieu se réjouiront en elle… ») ne correspond pas à Siracide 1.25. Le grec constitue donc ici le témoin utilisable, et cette incertitude textuelle est signalée explicitement.
- issue: Personnification féminine de la sagesse
  choice: Faire reprendre « la sagesse » par le pronom « l’ ».
  alternative: Reformuler de manière impersonnelle ou répéter le nom.
  rationale: Le grec emploie un pronom féminin qui prolonge la personnification de la sagesse. La syntaxe française la conserve naturellement par l’antécédent féminin.
- issue: Valeur du participe initial
  choice: 'Le rendre par un impératif coordonné : « Désire ».'
  alternative: 'Le rendre conditionnellement : « Si tu désires la sagesse… ».'
  rationale: Les deux analyses sont possibles. L’impératif s’accorde bien avec διατήρησον, mais l’ambiguïté réelle est conservée dans une note.
translation_notes:
  register: Français international moderne, clair et digne. « Garde les commandements » conserve une légère résonance biblique sans être archaïque; « te l’accordera » est fluide et maintient l’idée d’un don divin.
