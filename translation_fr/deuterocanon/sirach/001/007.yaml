  text: He examined her and saw her and counted her[a], and he gave her to those who love him.
translation:
  language: fr
  text: Il l’a examinée, il l’a vue et il l’a comptée[a], puis il l’a donnée à ceux qui l’aiment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin grec parallèle porte : « Il n’y en a qu’un qui soit sage, extrêmement redoutable, assis sur son trône. » L’hébreu conservé diffère ici considérablement de la tradition grecque.'
    reason: textual_variant
lexical_decisions:
- source_word: בְחָנָהּ
  choice: l’a examinée
  rationale: Le verbe בחן exprime l’idée d’éprouver ou d’examiner. « Examinée » convient ici sans préciser au-delà de l’hébreu la nature de cet examen.
- source_word: וְרָאָהּ
  choice: l’a vue
  rationale: ראה signifie simplement « voir ». Le choix conserve la sobriété et la succession compacte des verbes hébreux.
- source_word: וְסְפָרָהּ
  choice: l’a comptée
  rationale: ספר signifie ici compter ou dénombrer. « Comptée » préserve l’image selon laquelle la sagesse est entièrement mesurée, sans la remplacer par une interprétation.
- source_word: וּנְתָנָהּ
  choice: l’a donnée
  rationale: נתן est le verbe courant « donner ». Cette traduction directe respecte le style simple de l’hébreu.
- source_word: לְאֹהֲבָיו
  choice: à ceux qui l’aiment
  rationale: Le suffixe hébreu est masculin singulier et renvoie le plus naturellement à Dieu, sujet implicite. En français, « l’ » conserve cette référence dans le contexte sans introduire explicitement un nom absent du texte.
- source_word: suffixes féminins ־הּ
  choice: la / l’…ée
  rationale: Les suffixes féminins renvoient naturellement à la sagesse, nom féminin et figure personnifiée dans le contexte. Le français en conserve le genre.
theological_decisions:
- issue: Rapport entre la ligne hébraïque et le témoin grec, qui transmet un texte très différent au sujet de l’unique sage assis sur son trône
  choice: Traduire dans le texte principal l’hébreu conservé et signaler en note la divergence majeure du grec
  alternative: 'Suivre le grec : « Il n’y en a qu’un qui soit sage, extrêmement redoutable, assis sur son trône. »'
  rationale: L’hébreu conservé est cohérent et directement traduisible; il constitue donc le texte principal. La forte divergence grecque demeure néanmoins importante pour l’histoire textuelle et doit être présentée sans être harmonisée.
- issue: Référent du suffixe dans לְאֹהֲבָיו
  choice: Comprendre le masculin singulier comme renvoyant à Dieu, sujet implicite
  alternative: Comprendre par le sens « ceux qui aiment la sagesse », malgré le genre grammatical du suffixe
  rationale: Le suffixe est masculin singulier, alors que la sagesse est féminine. La lecture la plus proche du texte est donc « ceux qui l’aiment », c’est-à-dire ceux qui aiment Dieu, sans expliciter ce dernier dans le corps du verset.
translation_notes:
  register: Français moderne, naturel et digne. La répétition de « il l’a » restitue la progression verbale de l’hébreu; « puis » marque naturellement l’aboutissement du dernier acte sans alourdir la phrase.
