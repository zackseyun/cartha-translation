  text: The fear of Yahweh gladdens the heart[a], and gives joy and favor and length of days.
translation:
  language: fr
  text: La crainte du Seigneur réjouit le cœur ; elle procure de la joie, de la faveur et une longue vie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « Pour celui qui craint le Seigneur, tout ira bien à la fin et, au jour de sa mort, il sera béni. » Le texte grec présente ici une forme sensiblement différente du verset.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְאַת יְהֹוָה
  choice: la crainte du Seigneur
  rationale: Le nom יִרְאָה désigne ici une crainte révérencielle envers Dieu, sans perdre la force du mot « crainte ». Selon la convention française retenue, le tétragramme est rendu par « le Seigneur ».
- source_word: מְשַׂמַּחַת לֵב
  choice: réjouit le cœur
  rationale: Le participe causatif מְשַׂמַּחַת signifie « rend joyeux, réjouit » et לֵב désigne le cœur, c’est-à-dire la vie intérieure de la personne.
- source_word: וְנוֹתֶנֶת שִׂמְחָה
  choice: elle donne joie
  rationale: Cette formulation conserve la coordination et l’accumulation voulues par l’hébreu, tout en restant naturelle et concise en français.
- source_word: חֵן
  choice: faveur
  rationale: חֵן peut désigner la faveur, la grâce ou le charme. « Faveur » convient à cette liste de bienfaits sans introduire une acception théologique plus spécialisée.
- source_word: אֹרֶךְ יָמִים
  choice: longue vie
  rationale: L’expression hébraïque signifie littéralement « longueur de jours » et constitue un idiome courant pour la longévité. « Longue vie » en restitue naturellement le sens en français moderne.
theological_decisions:
- issue: Divergence majeure entre le témoin hébreu et le texte grec
  choice: Le texte hébreu conservé est traduit dans le corps du verset, tandis que la forme grecque substantiellement différente est signalée en note.
  alternative: « Celui qui craint le Seigneur connaîtra une fin heureuse et, au jour de sa mort, il sera béni. »
  rationale: Le texte hébreu est cohérent et constitue la source principale lorsqu’il est conservé. La variante grecque ne doit toutefois être ni harmonisée avec lui ni passée sous silence, puisqu’elle transmet ici une sentence différente.
translation_notes:
  register: Français international moderne, clair et digne. « Crainte » conserve la tension sémantique du terme hébreu plutôt que de l’adoucir en « respect » ou « révérence ». Le point-virgule rend lisible la reprise du sujet par « elle ».
