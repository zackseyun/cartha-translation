  text: Who can count the sand of the seas[a], the drops of rain, and the days of eternity?
translation:
  language: fr
  text: Qui peut compter le sable des mers, les gouttes de pluie et les jours de l’éternité[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les jours de l’âge » ou « les jours des temps anciens ». Le mot hébreu עוֹלָם peut désigner l’éternité, un âge ou un temps ancien ; le parallèle grec appuie ici l’idée d’une durée incommensurable.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹל יַמִּים
  choice: le sable des mers
  rationale: Le nom חוֹל désigne collectivement le sable, et יַמִּים est au pluriel. Cette formulation conserve l’image et le nombre du texte hébreu, également attesté par le parallèle grec.
- source_word: נִטְפֵי מָטָר
  choice: les gouttes de pluie
  rationale: La locution construite signifie littéralement « gouttes de pluie ». Le français est naturel et garde l’image concrète de l’hébreu.
- source_word: וִימוֹת עוֹלָם
  choice: les jours de l’éternité
  rationale: Cette traduction préserve l’expression temporelle saisissante de l’hébreu et son idée de durée impossible à mesurer, tout en signalant en note la polysémie de עוֹלָם.
- source_word: מִי יִמְנֶה
  choice: Qui peut compter
  rationale: L’interrogation avec l’imparfait exprime ici une impossibilité rhétorique. « Qui peut compter » la rend clairement et naturellement en français.
theological_decisions:
- issue: Sens temporel de עוֹלָם dans l’hyperbole sapientielle
  choice: « l’éternité », pour exprimer une durée incommensurable
  alternative: « les temps anciens » ou « l’âge »
  rationale: Le contexte énumère des réalités qui échappent au calcul humain, et le parallèle grec soutient l’idée d’une durée immense ou sans borne. « Éternité » conserve cette force sans imposer ici une définition métaphysique technique.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation suit de près la structure hébraïque tout en restant naturelle. Le marqueur de note est placé après « éternité », terme directement concerné par la variante lexicale.
