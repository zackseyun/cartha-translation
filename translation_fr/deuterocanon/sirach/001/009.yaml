translation:
  language: fr
  text: parmi tous les êtres de chair[a], à la mesure de son don, et il l’a accordée à ceux qui aiment Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec tous les êtres de chair » ou « à tous les êtres de chair » ; l’expression grecque peut décrire la présence ou la répartition de la sagesse parmi l’ensemble des êtres vivants.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ πάσης σαρκός
  choice: parmi tous les êtres de chair
  rationale: μετά suivi du génitif signifie ici « avec » ou « parmi ». L’expression collective πᾶσα σάρξ est conservée sans la limiter à la seule humanité ni lui donner le sens de « nature pécheresse ».
- source_word: κατὰ τὴν δόσιν αὐτοῦ
  choice: à la mesure de son don
  rationale: κατά exprime ici la norme ou la proportion, et δόσις le don ou l’acte de donner. Cette formulation naturelle indique que la répartition dépend de ce que Dieu donne.
- source_word: ἐχορήγησεν
  choice: il l’a accordée
  rationale: χορηγέω évoque le fait de fournir ou d’octroyer. « Accorder » convient naturellement à la sagesse donnée à des bénéficiaires, sans ajouter une idée absente du grec.
- source_word: αὐτήν
  choice: l’
  rationale: Le pronom féminin renvoie à la sagesse, nom féminin et réalité personnifiée dans le contexte. En français, le pronom élidé conserve ce renvoi grammatical.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: à ceux qui l’aiment
  rationale: Le participe substantivé désigne les bénéficiaires, et le pronom masculin renvoie à Dieu dans le contexte immédiat.
theological_decisions:
- issue: Référents des deux pronoms
  choice: Le premier pronom renvoie à la sagesse, le second à Dieu.
  alternative: Rendre le premier pronom de manière impersonnelle, ou laisser le référent final moins précis.
  rationale: Le genre grammatical et le contexte de Siracide 1 présentent la sagesse comme féminine et Dieu comme celui qui la donne. La traduction préserve cette texture sans développer une doctrine supplémentaire.
- issue: Portée de « toute chair »
  choice: Ne pas restreindre l’expression à toute l’humanité.
  alternative: « parmi tous les humains »
  rationale: σάρξ peut désigner collectivement les êtres mortels ou vivants. La formulation retenue préserve cette portée possible ainsi que l’ambiguïté du texte.
translation_notes:
  register: Français international actuel, sobre et digne. Le début reste syntaxiquement lié au contexte précédent, comme dans le texte grec transmis. L’expression concrète « êtres de chair » préserve l’idiome biblique tout en restant compréhensible.
