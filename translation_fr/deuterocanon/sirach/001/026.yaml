  text: For wisdom and instruction are fear of the Lord, and his good pleasure is faith and meekness.
translation:
  language: fr
  text: Car la sagesse et l’instruction, c’est la crainte du Seigneur, et ce qui lui plaît, c’est la foi et la douceur.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le témoin hébreu conservé présenté ici est signalé comme une discordance majeure et ne correspond pas au texte de ce verset. La traduction suit donc le grec de Siracide 1,26.
    reason: textual_variant
  - marker: b
    text: 'Autre traduction possible : « et sa faveur, c’est la fidélité et la douceur ». Le grec πίστις peut aussi signifier « fidélité » ou « confiance », et πρᾳότης peut aussi se rendre par « gentillesse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφία
  choice: sagesse
  rationale: Dans le Siracide, le mot désigne largement la sagesse morale et pratique; « sagesse » est le terme français naturel et traditionnel.
- source_word: παιδεία
  choice: instruction
  rationale: Le terme peut aussi désigner l’éducation, la formation ou la discipline. « Instruction » convient au principe général énoncé ici sans introduire nécessairement une idée de châtiment.
- source_word: φόβος κυρίου
  choice: crainte du Seigneur
  rationale: Cette expression majeure de la littérature sapientielle conserve ici sa force théologique traditionnelle; elle inclut le respect révérenciel sans être réduite au seul sentiment de peur.
- source_word: ἡ εὐδοκία αὐτοῦ
  choice: ce qui lui plaît
  rationale: Cette formulation française naturelle exprime le sens probable de ce qui reçoit l’approbation du Seigneur, tout en signalant en note l’autre lecture possible, « sa faveur ».
- source_word: πίστις
  choice: foi
  rationale: « Foi » préserve le rendu principal du terme grec. Dans ce contexte sapientiel, « fidélité » reste toutefois possible et figure donc en note.
- source_word: πρᾳότης
  choice: douceur
  rationale: « Douceur » rend naturellement en français moderne la disposition paisible et non violente exprimée par le grec; « humilité » demeure une nuance possible.
theological_decisions:
- issue: Choix de la source lorsque le témoin hébreu fourni ne correspond pas au verset
  choice: Traduire le texte grec de Siracide 1.26 et signaler l’écart du témoin hébreu.
  alternative: Traduire malgré tout la ligne hébraïque fournie.
  rationale: La ligne hébraïque est explicitement signalée comme une discordance majeure et son contenu ne correspond pas à ce verset. Le grec constitue donc ici la source opératoire la plus sûre, sans dissimuler le problème textuel.
- issue: Sens de πίστις
  choice: foi
  alternative: fidélité ou confiance
  rationale: Le grec permet plusieurs nuances. « Foi » est retenu dans le texte principal, tandis que « fidélité » est préservé en note comme possibilité particulièrement pertinente dans un contexte de conduite sapientielle.
- issue: Sens de ἡ εὐδοκία αὐτοῦ
  choice: ce qui lui plaît
  alternative: sa faveur
  rationale: Le génitif peut orienter l’expression vers ce que le Seigneur approuve ou vers la faveur qu’il accorde. Le texte principal retient la première compréhension sans éliminer la seconde.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure détachée « c’est » clarifie l’équation nominale grecque sans la surinterpréter. Les expressions sapientielles « sagesse » et « crainte du Seigneur » sont conservées.
