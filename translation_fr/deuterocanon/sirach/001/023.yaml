  text: Until the right time he will conceal his words, and the lips of many will recount his understanding.[a]
translation:
  language: fr
  text: Jusqu’au moment voulu, il cachera ses paroles, et les lèvres de beaucoup feront connaître son discernement.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu conservé dans les manuscrits de la Guéniza du Caire diffère fortement du grec et se lit approximativement : « Tu placeras sur lui une couronne éternelle, et un mérite éternel parmi les saints. » Comme ce témoin hébreu présente ici une divergence majeure, le texte principal suit le grec.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἕως καιροῦ
  choice: Jusqu’au moment voulu
  rationale: Le grec καιρός désigne ici un moment opportun ou déterminé, et non simplement une durée; cette formulation reste naturelle sans préciser davantage.
- source_word: κρύψει
  choice: il cachera
  rationale: Le futur de κρύπτω exprime le fait de tenir hors de vue ou de ne pas divulguer; « cachera » est clair et direct.
- source_word: τοὺς λόγους αὐτοῦ
  choice: ses paroles
  rationale: λόγοι désigne les paroles ou propos de l’homme en question; « ses paroles » préserve la formulation du grec.
- source_word: χείλη πολλῶν
  choice: beaucoup raconteront avec leurs lèvres
  rationale: Cette tournure conserve l’image poétique des « lèvres de beaucoup » tout en évitant en français une construction raide ou ambiguë.
- source_word: ἐκδιηγήσεται
  choice: raconteront
  rationale: Le verbe signifie exposer ou relater en détail. L’accord au pluriel suit le sens collectif de « beaucoup », malgré le singulier grammatical du verbe grec accordé avec χείλη.
- source_word: σύνεσιν αὐτοῦ
  choice: l’intelligence qui est la sienne
  rationale: σύνεσις évoque l’intelligence, la compréhension ou le discernement. La formulation développée précise naturellement que cette intelligence appartient à celui dont les paroles étaient cachées.
theological_decisions:
- issue: Choix du témoin de base en présence d’une divergence majeure entre l’hébreu transmis et le grec
  choice: Suivre le parallèle grec pour le texte principal et signaler intégralement la leçon hébraïque dans une note.
  alternative: 'Traduire comme texte principal l’hébreu conservé : « Tu placeras sur lui une couronne éternelle, et un mérite éternel parmi les saints. »'
  rationale: La ligne hébraïque fournie ne correspond pas sémantiquement au Siracide 1.23 grec et le dossier la signale comme une divergence majeure. Le grec offre ici la leçon cohérente du verset, tandis que la note préserve honnêtement le témoignage hébreu sans harmonisation.
translation_notes:
  register: Français international moderne, digne et accessible. L’image grecque des lèvres est conservée sous une forme idiomatique; la divergence textuelle majeure est explicitement documentée.
