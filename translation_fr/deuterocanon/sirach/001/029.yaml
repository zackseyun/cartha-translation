translation:
  language: fr
  text: Aime la crainte du SEIGNEUR, et rends ton cœur heureux en elle ; n’aie pas peur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec conservé diffère entièrement : « Le cœur de l’homme intelligent méditera une parabole, et une oreille attentive est le désir du sage. »'
    reason: Le témoin grec parallèle présente une divergence textuelle majeure par rapport au texte hébreu retenu.
lexical_decisions:
- source_word: אֱהַב
  choice: Aime
  rationale: L’impératif hébreu exprime directement l’amour ou l’attachement ; « aime » conserve cette force sans l’affaiblir.
- source_word: יִרְאַת יְהֹוָה
  choice: la crainte du SEIGNEUR
  rationale: « Crainte » préserve le terme théologique hébreu et le jeu de mots avec la peur dans la dernière proposition. « SEIGNEUR » suit l’usage français traditionnel pour le tétragramme.
- source_word: וְאַשֵּׁר בָּהּ לִבְּךָ
  choice: et, par elle, rends ton cœur heureux
  rationale: La forme intensive et causative de la racine אשר invite ici à comprendre « rendre heureux ». « Par elle » indique que cette crainte est le moyen ou le cadre du bonheur du cœur.
- source_word: וְאַל תִּירָא
  choice: alors tu n’auras pas peur
  rationale: 'Le dernier verbe appartient à la même famille que « crainte » mais désigne ici la peur. La tournure française met en relief le paradoxe : la crainte du Seigneur délivre de la peur.'
theological_decisions:
- issue: Rapport entre la crainte du Seigneur et la peur
  choice: Distinguer « la crainte du SEIGNEUR » de « avoir peur » tout en conservant leur proximité lexicale
  alternative: Employer « respect » ou « révérence » dans la première proposition
  rationale: L’hébreu répète la racine ירא. Traduire le premier terme par « respect » ferait disparaître la tension voulue, tandis que le contexte permet au lecteur de distinguer la crainte révérencielle de la peur.
- issue: Lien logique de la dernière proposition
  choice: « alors tu n’auras pas peur »
  alternative: « et n’aie pas peur »
  rationale: La forme hébraïque est une défense, mais l’enchaînement peut aussi exprimer le résultat de l’attachement à la crainte du Seigneur. Cette formulation française rend la pensée naturelle sans effacer le paradoxe.
translation_notes:
  register: Français moderne, simple et digne. Le parallélisme et le jeu sur « crainte » et « peur » sont conservés. La formulation « rends ton cœur heureux » reste proche de la construction hébraïque tout en demeurant intelligible.
