base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/014.yaml
  text: The beginning of wisdom is the fear of Yahweh[b][a], and with the faithful she was formed in the womb.
translation:
  language: fr
  text: Le commencement de la sagesse, c’est la crainte de Yahweh ; avec les fidèles, elle a été formée dans le sein maternel.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « elle a été gardée dans le sein maternel », si le verbe hébreu est rattaché à la racine signifiant « garder, préserver » plutôt qu’à l’idée de formation ou de naissance.'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec présente un texte très différent : « Parmi les humains, elle a établi son nid comme fondement éternel, et elle sera confiée à leur descendance. » Les témoins hébreu et grec divergent ici de manière substantielle.'
    reason: alternative_reading
lexical_decisions:
- source_word: רֵאשִׁית חָכְמָה
  choice: Le commencement de la sagesse
  rationale: Le nom à l’état construit exprime naturellement ici le commencement ou le principe initial de la sagesse, conformément au langage sapientiel hébreu.
- source_word: יִרְאַת יְהֹוָה
  choice: la crainte de Yahweh
  rationale: « Crainte » conserve la force du terme hébreu sans l’adoucir en simple respect ; « Yahweh » rend directement le nom divin.
- source_word: וְעִם נֶאֱמָנִים
  choice: avec les fidèles
  rationale: La préposition signifie directement « avec », et נֶאֱמָנִים désigne ici vraisemblablement les personnes fidèles.
- source_word: נוֹצְרָה
  choice: elle a été formée
  rationale: Dans l’image du sein maternel, le sens de formation convient au contexte, mais les consonnes permettent aussi de comprendre un verbe signifiant « garder » ou « préserver » ; cette possibilité est signalée en note.
- source_word: בַבָּטֶן
  choice: dans le sein maternel
  rationale: Cette formulation française naturelle exprime clairement l’image prénatale portée par בֶּטֶן dans ce contexte.
theological_decisions:
- issue: Rendu du nom divin יְהֹוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu porte explicitement le Tétragramme ; la translittération « Yahweh » conserve le caractère de nom propre.
- issue: Divergence substantielle entre les témoins hébreu et grec
  choice: Suivre l’hébreu conservé dans le texte principal et donner le grec en note
  alternative: Adopter le texte grec comme texte principal
  rationale: Puisqu’un témoin hébreu est disponible, il sert de base ; la leçon grecque, matériellement différente plutôt que simple variante de formulation, est conservée intégralement afin de ne pas masquer la tension textuelle.
- issue: Référent féminin implicite de נוֹצְרָה
  choice: elle, renvoyant à la sagesse
  alternative: répéter « la sagesse »
  rationale: Le féminin du verbe s’accorde naturellement avec חָכְמָה, « sagesse » ; le pronom maintient cette personnification sans l’amplifier.
translation_notes:
  register: Français international moderne, digne et accessible. La construction détachée « c’est » rend naturellement la proposition nominale hébraïque. « Sein maternel » évite l’ambiguïté anatomique de « ventre ». Les appels de notes sont placés après l’ensemble de la proposition concernée.
