  text: Do not disobey the fear of the Lord, and do not come to him with a divided heart.
translation:
  language: fr
  text: Ne désobéis pas à la crainte du Seigneur[a] et ne t’approche pas de lui avec un cœur partagé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu composite indiqué pour ce verset transmet ici deux phrases différentes : « Écoutez-moi, vous qui craignez Dieu… » et « Qui désire en hériter… ? » La traduction suit le grec ancien, qui correspond à la numérotation et au contenu traditionnels de Siracide 1.27.'
    reason: Signaler honnêtement le décalage majeur entre le témoin hébreu fourni et le parallèle grec correspondant au verset.
lexical_decisions:
- source_word: μὴ ἀπειθήσῃς
  choice: Ne désobéis pas
  rationale: Rend directement l’interdiction et le sens ordinaire du verbe ἀπειθέω, « refuser d’obéir, désobéir », sans expliciter davantage la relation inhabituelle avec « la crainte ».
- source_word: φόβῳ Κυρίου
  choice: à la crainte du Seigneur
  rationale: Conserve la formulation théologique traditionnelle et la construction du grec, où la crainte du Seigneur est ce à quoi il ne faut pas désobéir.
- source_word: μὴ προσέλθῃς αὐτῷ
  choice: ne t’approche pas de lui
  rationale: Traduit naturellement le mouvement exprimé par προσέρχομαι et maintient « lui » comme renvoi au Seigneur.
- source_word: ἐν καρδίᾳ δισσῇ
  choice: avec un cœur partagé
  rationale: Exprime en français actuel un cœur divisé ou animé de dispositions contradictoires, tout en préservant la portée morale du grec δισσός.
theological_decisions:
- issue: La crainte du Seigneur comme objet d’obéissance
  choice: Ne désobéis pas à la crainte du Seigneur
  alternative: Ne te dérobe pas à la crainte du Seigneur
  rationale: Le choix retient le sens explicite de ἀπειθέω sans transformer « la crainte du Seigneur » en simple émotion ni résoudre la tension de la formulation.
- issue: Sens de « cœur double »
  choice: avec un cœur partagé
  alternative: avec un cœur double
  rationale: « Cœur partagé » est idiomatique en français moderne et conserve l’idée d’une allégeance intérieure divisée, sans imposer une interprétation doctrinale particulière.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du grec tout en étant naturelle; « cœur partagé » évite l’étrangeté de « cœur double » sans effacer l’ambivalence morale.
