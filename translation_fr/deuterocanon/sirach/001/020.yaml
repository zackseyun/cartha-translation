  text: Its roots are forever[b][a], and its branches are length of days.
translation:
  language: fr
  text: Ses racines demeurent à jamais[a], et ses branches sont une longue vie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Un homme coléreux ne pourra être justifié. » Les témoins hébreu et grec divergent considérablement dans ce verset.'
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « une longueur de jours ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁרְשֶׁיהָ
  choice: ses racines
  rationale: Le nom porte un suffixe féminin singulier renvoyant à la réalité féminine évoquée dans le contexte. « Ses racines » conserve naturellement l’image végétale en français.
- source_word: לְעוֹלָם
  choice: demeurent à jamais
  rationale: L’hébreu exprime une permanence sans fin. L’ajout de « demeurent », implicite dans la proposition nominale hébraïque, produit un français naturel tout en préservant cette valeur temporelle.
- source_word: וַעֲנָפֶיהָ
  choice: et ses branches
  rationale: « Branches » est l’équivalent courant de עֲנָפִים et maintient le parallélisme botanique avec les racines.
- source_word: אֹרֶךְ יָמִים
  choice: une longue vie
  rationale: Cette expression hébraïque signifie littéralement « longueur de jours » et désigne idiomatiquement la longévité. « Une longue vie » est clair et naturel en français moderne; la formulation littérale est signalée en note.
theological_decisions:
- issue: Divergence majeure entre le texte hébreu conservé et le parallèle grec de Siracide 1.20
  choice: Traduire dans le texte principal la ligne poétique hébraïque conservée
  alternative: 'Suivre le grec : « Un homme coléreux ne pourra être justifié. »'
  rationale: Le témoin hébreu disponible est prioritaire, mais le grec transmet ici une phrase entièrement différente, et non une simple variation de détail. La note conserve cette divergence sans chercher à l’harmoniser ni à la résoudre.
translation_notes:
  register: Français international moderne, sobre et poétique. La proposition nominale hébraïque est rendue par « demeurent » puis « sont » afin d’obtenir une syntaxe française lisible sans effacer le parallélisme entre racines et branches.
