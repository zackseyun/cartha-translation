  text: Until the appointed time, the patient one[b] will endure, and afterward joy will be repaid to him.[a]
translation:
  language: fr
  text: Jusqu’au moment fixé, la personne patiente[b] tiendra bon, puis la joie lui sera accordée en retour.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La ligne hébraïque fournie pour ce verset semble provenir d’un autre contexte. La traduction suit donc ici le grec : « Jusqu’au moment fixé, la personne patiente tiendra bon, puis la joie lui sera accordée en retour. »'
    reason: textual_variant
  - marker: b
    text: Ou « la personne qui sait attendre avec constance »; le terme grec évoque une patience persévérante.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως καιροῦ
  choice: Jusqu’au moment fixé
  rationale: Comme la ligne hébraïque fournie ne correspond manifestement pas à ce verset, la traduction suit ici le grec. καιρός désigne un moment opportun ou déterminé; « moment fixé » en conserve la nuance sans préciser qui l’a fixé.
- source_word: ἀνέξεται
  choice: tiendra bon
  rationale: Le futur moyen de ἀνέχω exprime ici le fait de supporter l’épreuve et de persévérer. « Tiendra bon » est naturel en français moderne et convient à l’attente d’une joie différée.
- source_word: μακρόθυμος
  choice: la personne patiente
  rationale: L’adjectif est substantivé et désigne une personne caractérisée par la patience ou la longanimité. Cette formulation conserve le singulier générique sans introduire un référent exclusivement masculin.
- source_word: ὕστερον
  choice: puis
  rationale: L’adverbe indique ce qui vient ensuite. « Puis » rend clairement et sobrement la succession temporelle.
- source_word: ἀναδώσει
  choice: lui sera rendue
  rationale: Le verbe signifie rendre ou donner en retour. La tournure passive exprime la joie accordée en retour tout en laissant implicite l’agent, comme dans le grec.
- source_word: εὐφροσύνη
  choice: la joie
  rationale: Le nom désigne la joie ou l’allégresse; « joie » est l’équivalent français moderne le plus direct.
theological_decisions:
- issue: Discordance majeure entre le témoin hébreu fourni et le grec à ce verset
  choice: Suivre le texte grec parallèle comme source opératoire pour ce verset et signaler la discordance en note.
  alternative: 'Traduire la ligne hébraïque fournie : « Heureux l’être humain qui s’approche d’elle et se délecte de ses préceptes. »'
  rationale: La ligne hébraïque ne correspond pas sémantiquement au Siracide 1.22 transmis en grec et semble relever d’un autre contexte. Puisque les données qualifient explicitement cette discordance de majeure, le grec constitue ici le témoin source le plus défendable, sans dissimuler l’incertitude textuelle.
translation_notes:
  register: Français international moderne, naturel et digne. « La personne patiente » évite un masculin générique inutile; « tiendra bon » rend l’endurance de manière idiomatique, tandis que la syntaxe conserve l’attente suivie de la joie reçue en retour.
