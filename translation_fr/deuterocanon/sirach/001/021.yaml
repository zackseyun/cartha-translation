translation:
  language: fr
  text: Heureux l’homme qui médite sur elle[a], et elle vaut mieux pour lui que tous les trésors.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui réfléchit profondément à elle »; le verbe hébreu peut aussi signifier « méditer », « réfléchir » ou « murmurer en méditant ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le témoin grec présente ici un texte très différent : « Car le mouvement de sa colère est sa chute. » Il reflète probablement une autre forme du texte ou un décalage dans la correspondance des versets.'
    reason: textual_variant
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heureux
  rationale: La formule de béatitude hébraïque exprime une condition enviable et heureuse. « Heureux » est à la fois naturel en français moderne et conforme au registre sapientiel.
- source_word: אֱנוֹשׁ
  choice: l’homme
  rationale: Le nom désigne ici l’être humain mortel au masculin singulier, employé de manière représentative dans une maxime de sagesse. « L’homme » conserve cette forme sans exclure la portée générale de l’énoncé.
- source_word: יֶהְגֶּה בָּהּ
  choice: qui médite sur elle
  rationale: Le verbe הגה évoque une réflexion soutenue, la méditation ou l’examen attentif. Le pronom féminin renvoie très probablement à la sagesse personnifiée; « sur elle » préserve cette référence personnelle.
- source_word: וְטוֹבָה הִיא לוֹ
  choice: et elle vaut mieux pour lui
  rationale: La conjonction וְ est rendue explicitement par « et ». Dans la construction comparative introduite par מִן, טוֹבָה exprime ici une valeur supérieure; « vaut mieux » est idiomatique et garde le pronom féminin.
- source_word: מִכָּל אוֹצָר
  choice: que tous les trésors
  rationale: אוֹצָר désigne ici le trésor ou les richesses accumulées. Le pluriel français avec « tous » rend naturellement la portée totalisante de מִכָּל.
- source_word: ἡ γὰρ ῥοπὴ τοῦ θυμοῦ αὐτοῦ πτῶσις αὐτῷ
  choice: non retenu dans le texte principal
  rationale: Le témoin grec diffère radicalement de l’hébreu conservé et semble refléter une autre forme textuelle ou un décalage dans la numérotation. Le texte principal suit donc l’hébreu, tandis que la divergence grecque est signalée en note.
theological_decisions:
- issue: Masculin singulier représentatif dans une béatitude sapientielle
  choice: l’homme
  alternative: la personne / celui qui
  rationale: L’hébreu emploie un substantif masculin singulier à portée générale. La traduction conserve cette forme grammaticale et le style traditionnel de la maxime sans restreindre son application aux seuls hommes.
- issue: Personnification féminine de la sagesse
  choice: sur elle / elle vaut mieux
  alternative: la méditer / cela vaut mieux
  rationale: Le suffixe pronominal et l’adjectif féminins, éclairés par le contexte de la sagesse personnifiée, justifient le maintien d’une référence féminine personnelle plutôt qu’une formulation neutre.
translation_notes:
  register: Français international moderne, clair et digne, avec une tournure de béatitude concise. La personnification féminine de la sagesse et la coordination explicite des deux propositions ont été conservées.
