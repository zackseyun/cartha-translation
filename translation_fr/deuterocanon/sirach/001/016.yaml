translation:
  language: fr
  text: Le commencement de la sagesse, c’est la crainte de Yahweh[a] ; elle apporte une abondance de paix, de vie et de guérison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin grec porte : « Elle a rempli toute leur maison de choses désirables, et leurs greniers de ses produits. » Ce verset diffère considérablement de la ligne hébraïque conservée.'
    reason: textual_variant
lexical_decisions:
- source_word: רֵאשִׁית חָכְמָה
  choice: Le commencement de la sagesse
  rationale: רֵאשִׁית désigne naturellement le commencement ou le principe premier. « Commencement » conserve ici l’ambiguïté entre priorité temporelle et fondement.
- source_word: יִרְאַת
  choice: la crainte de
  rationale: « Crainte » garde la force de l’hébreu et l’expression biblique consacrée, sans la réduire à la seule révérence.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Transcription du nom divin exprimé directement par le tétragramme dans le texte hébreu.
- source_word: וּמַרְבָּה
  choice: elle procure … en abondance
  rationale: La forme exprime l’idée d’accroissement ou d’abondance. Le verbe « procure » rend la relation implicite avec la crainte de Yahweh dans un français naturel.
- source_word: שָׁלוֹם
  choice: paix
  rationale: Équivalent principal, qui peut aussi évoquer plus largement le bien-être et l’intégrité.
- source_word: חַיִּים
  choice: vie
  rationale: Bien que le mot soit formellement pluriel en hébreu, il désigne couramment la vie comme réalité globale.
- source_word: וּמַרְפֵּא
  choice: guérison
  rationale: Conserve le sens restaurateur du terme, plutôt que de le réduire au seul état de santé.
theological_decisions:
- issue: Rendu du nom divin יְהֹוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom divin lui-même ; « Yahweh » le distingue du titre « Seigneur ».
- issue: Divergence majeure entre les témoins hébreu et grec
  choice: Suivre dans le texte principal la ligne hébraïque conservée et signaler le grec en note
  alternative: 'Suivre le grec : « Elle a rempli toute leur maison de ses biens désirables, et leurs réserves de ses produits. »'
  rationale: L’hébreu conservé constitue ici la source principale indiquée, mais le témoin grec présente une leçon entièrement différente qui doit rester visible afin de ne pas masquer l’incertitude textuelle.
translation_notes:
  register: Français international moderne, digne et accessible. La dislocation « Le commencement de la sagesse, c’est… » donne une formulation naturelle tout en préservant la structure de la maxime. La coordination finale reste sobre et proche de l’hébreu.
