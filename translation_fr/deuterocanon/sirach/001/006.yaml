  text: One alone is fearsome[b][a], God ruling over all her storehouses.
translation:
  language: fr
  text: À qui la racine de la sagesse a-t-elle été révélée, et qui en a connu les subtilités ?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La ligne conservée dans les manuscrits hébreux de la Gueniza du Caire diverge fortement ici : « Lui seul est redoutable, Dieu qui règne sur tous ses trésors », ou une formulation semblable. Comme ce témoin ne correspond pas à Siracide 1.6 dans la tradition grecque, le texte principal suit le grec.'
    reason: textual_variant
  - marker: b
    text: Ou « ses procédés ingénieux », « ses desseins » ou « ses œuvres complexes ». Le mot grec peut désigner des procédés habiles et parfois des ruses, mais il n’a pas nécessairement ici un sens négatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζα
  choice: racine
  rationale: Le témoin hébreu conservé ne correspond pas à ce verset dans la tradition grecque. Le grec sert donc ici de texte opératoire. « Racine » rend directement la métaphore de ῥίζα sans l’interpréter comme « source » ou « fondement ».
- source_word: σοφίας
  choice: de la sagesse
  rationale: Équivalent français courant et précis de σοφία dans ce contexte.
- source_word: τίνι ἀπεκαλύφθη
  choice: À qui … a-t-elle été révélée
  rationale: Cette formulation naturelle en français conserve la voix passive et le sens de dévoilement du verbe ἀποκαλύπτω.
- source_word: πανουργεύματα αὐτῆς
  choice: ses subtilités
  rationale: Le terme peut désigner des procédés habiles ou complexes et parfois, dans d’autres contextes, des ruses. « Subtilités » préserve ici l’idée de complexité sans attribuer à la sagesse une intention mauvaise.
- source_word: τίς ἔγνω
  choice: qui en a connu
  rationale: Le passé composé convient à la portée générale de la question rhétorique. Le pronom « en » renvoie naturellement à la sagesse et évite une répétition pesante.
theological_decisions:
- issue: Choix du texte principal lorsque le témoin hébreu diverge fortement
  choice: Traduire le parallèle grec dans le texte principal
  alternative: 'Traduire la ligne hébraïque conservée : « Lui seul est redoutable, Dieu qui règne sur tous ses trésors » ou une formulation semblable'
  rationale: La ligne hébraïque fournie est signalée comme une divergence majeure et ne correspond pas à Siracide 1.6 dans la tradition grecque. Le grec est donc retenu comme témoin principal pour ce verset, tandis que la divergence hébraïque est explicitement signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La structure interrogative et la métaphore de la racine sont conservées; « subtilités » maintient l’ambiguïté lexicale sans suggérer indûment la tromperie.
