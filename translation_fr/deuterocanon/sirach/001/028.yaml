    text: 'La ligne hébraïque conservée dans le témoin fourni dit : « Écoute toutes mes paroles et mets-les en pratique, et tu seras inscrit dans le livre de la vie. » Elle semble ne pas correspondre à ce verset; la traduction suit donc ici le texte grec.'
    reason: textual_variant
lexical_decisions:
- source_word: μὴ ὑποκριθῇς
  choice: Ne joue pas l’hypocrite
  rationale: Le verbe grec dénonce la dissimulation ou le fait d’adopter un rôle hypocrite. Cette formulation actuelle conserve l’idée de comportement feint sans employer un terme archaïque.
- source_word: ἐν στόμασιν ἀνθρώπων
  choice: devant les gens
  rationale: Le grec dit littéralement « dans les bouches des humains », expression difficile à interpréter. « Devant les gens » rend naturellement l’avertissement relatif à la conduite en société, tandis que l’image et l’ambiguïté du grec sont signalées en note.
- source_word: καὶ
  choice: et
  rationale: La coordination simple respecte le parallélisme des deux membres de phrase.
- source_word: ἐν τοῖς χείλεσί σου πρόσεχε
  choice: veille sur tes lèvres
  rationale: Cette formulation conserve l’image corporelle des lèvres ainsi que l’exhortation à surveiller sa parole; elle reste naturelle et digne en français moderne.
theological_decisions:
- issue: Choix du texte source en présence d’une discordance majeure entre l’hébreu fourni et le grec
  choice: Traduire ici le texte grec attesté pour Siracide 1.28 et signaler la leçon hébraïque en note.
  alternative: 'Traduire la ligne hébraïque fournie : « Écoute toutes mes paroles et mets-les en pratique, et tu seras inscrit dans le livre de la vie. »'
  rationale: La ligne hébraïque transmise dans le dossier ne correspond pas au contenu de Siracide 1.28 dans la tradition grecque et paraît déplacée. Le grec constitue donc ici la base textuelle la plus défendable, sans dissimuler la divergence du témoin hébreu.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier suit l’adresse grecque. La formulation privilégie une expression idiomatique dans le texte tout en conservant en note l’image inhabituelle et l’incertitude de la locution grecque.
