  text: Ne sois pas hypocrite devant les autres[a], et surveille tes lèvres.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, le grec dit : « dans les bouches des humains ». Le sens peut aussi être rendu par « parmi les gens »; l’expression exacte demeure inhabituelle.'
    reason: lexical_alternative
