  text: The root of wisdom—to whom has it been revealed? And who has known her subtleties?[a]
translation:
  language: fr
  text: La racine de la sagesse, à qui a-t-elle été révélée ? Et qui a connu ses subtilités ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « La source de la sagesse est la parole de Dieu auprès du Très-Haut, et ses voies sont des commandements éternels. » Le témoin hébreu diffère ici considérablement du grec.'
    reason: alternative_reading
lexical_decisions:
- source_word: שֹׁרֶשׁ
  choice: racine
  rationale: Le mot hébreu désigne littéralement la « racine ». Cette image concrète évoque l’origine ou le fondement de la sagesse et ne doit pas être harmonisée avec le grec πηγή, « source ».
- source_word: הַחָכְמָה
  choice: la sagesse
  rationale: Équivalent français usuel de חכמה dans la littérature sapientiale.
- source_word: לְמִי נִגְלָה
  choice: à qui a-t-elle été révélée
  rationale: Cette formulation conserve la construction passive du nifal de גלה ainsi que la valeur interrogative de לְמִי. Le pronom féminin reprend naturellement « la racine » en français.
- source_word: מַעֲרֻמֶּיהָ
  choice: ses subtilités
  rationale: Le terme peut évoquer la finesse, l’habileté ou les aspects difficiles à pénétrer. « Subtilités » préserve cette nuance sans lui donner une connotation morale négative.
- source_word: מִי יָדַע
  choice: qui en a connu
  rationale: Le passé composé rend ici naturellement l’accompli hébreu dans une question rhétorique. Le pronom « en » évite une personnification grammaticale artificielle tout en renvoyant clairement à la sagesse.
theological_decisions:
- issue: Divergence majeure entre le témoin hébreu et le parallèle grec
  choice: Traduire dans le texte principal l’hébreu conservé et signaler en note la leçon grecque substantiellement différente.
  alternative: « La source de la sagesse est la parole de Dieu dans les lieux très hauts, et ses voies sont des commandements éternels. »
  rationale: Le témoin hébreu extant gouverne le texte principal. Puisque le grec transmet non une simple variante, mais une formulation entièrement différente et théologiquement significative, la note la conserve sans harmoniser les traditions.
translation_notes:
  register: Français international moderne, naturel et digne. Les deux questions rhétoriques et la métaphore hébraïque de la racine sont conservées. La ponctuation allège la phrase sans supprimer son parallélisme poétique.
