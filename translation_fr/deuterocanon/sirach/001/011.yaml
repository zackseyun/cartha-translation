  text: The fear of Yahweh is glory and honor[a], greatness and a crown of splendor.
translation:
  language: fr
  text: La crainte du SEIGNEUR est gloire et honneur[a], grandeur et couronne de splendeur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente une leçon substantiellement différente : « La crainte du Seigneur réjouit le cœur et donne allégresse, joie et longue vie. »'
    reason: Lecture alternative importante du témoin grec.
lexical_decisions:
- source_word: יִרְאַת יְהֹוָה
  choice: la crainte du SEIGNEUR
  rationale: Le syntagme construit désigne la « crainte du SEIGNEUR », expression caractéristique de la littérature de sagesse. « Crainte » conserve l’étendue du terme hébreu, qui inclut le respect révérenciel sans s’y réduire. « SEIGNEUR » suit la convention française courante pour le nom divin יהוה.
- source_word: כָּבוֹד
  choice: gloire
  rationale: Dans cette série nominale, « gloire » rend la dignité élevée exprimée par כבוד et permet de distinguer ce terme du suivant.
- source_word: וִיקָר
  choice: et honneur
  rationale: יקר peut exprimer la valeur, le prix ou l’honneur. Ici, « honneur » forme avec « gloire » un couple français naturel tout en restant distinct de la splendeur finale.
- source_word: וּגְדֻלָּה
  choice: grandeur
  rationale: Traduction directe de גדלה, qui peut désigner la grandeur ou la majesté; « grandeur » maintient la série abstraite du texte hébreu.
- source_word: וְעֲטֶרֶת תִּפְאָרֶת
  choice: et couronne de splendeur
  rationale: La construction génitivale hébraïque est conservée. « Couronne » traduit עטרת, et « splendeur » rend תפארת sans répéter « gloire ».
- source_word: φόβος κυρίου τέρψει καρδίαν, καὶ δώσει εὐφροσύνην καὶ χαρὰν καὶ μακροημέρευσιν
  choice: non retenu dans le texte principal
  rationale: Le grec offre une leçon substantiellement différente, formulée comme une action et une promesse. Puisque le texte hébreu est ici conservé avec une confiance élevée, il fonde le texte principal; la leçon grecque est néanmoins donnée en note.
theological_decisions:
- issue: Divergence substantielle entre le texte hébreu et la version grecque de Siracide 1.11
  choice: Suivre dans le texte principal la description nominale hébraïque
  alternative: 'Suivre le grec : « La crainte du Seigneur réjouit le cœur et donne allégresse, joie et longue vie. »'
  rationale: Le témoin hébreu disponible présente une série de qualités, tandis que le grec énonce des effets de la crainte du Seigneur. La priorité donnée à l’hébreu lorsqu’il subsiste justifie le texte principal, mais l’écart réel entre les témoins doit être signalé sans chercher à les harmoniser.
translation_notes:
  register: Français international moderne, sobre et digne. La structure nominale resserrée de l’hébreu est conservée, avec l’ajout nécessaire du verbe « est » en français. Les termes élevés « gloire », « honneur », « grandeur » et « splendeur » restent accessibles et préservent la progression poétique.
