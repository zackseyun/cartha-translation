  text: She is a staff of strength and a support[a], praise and everlasting honor to everyone who walks after her.
translation:
  language: fr
  text: Elle est un bâton de puissance et un appui[a], une louange et un honneur éternel pour tous ceux qui marchent à sa suite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « La racine de la sagesse, c’est de craindre le Seigneur, et ses branches sont une longue vie. » Le témoin hébreu diffère ici considérablement de la tradition grecque.'
    reason: textual_variant
lexical_decisions:
- source_word: מַטּהֵ עֹז
  choice: un bâton de force
  rationale: מַטֶּה désigne couramment un bâton ou une verge; associé à עֹז, il présente la sagesse comme une force sur laquelle on peut s’appuyer. « Bâton de force » conserve l’image et le parallélisme poétique.
- source_word: מַשְׁעֵנָה
  choice: un appui
  rationale: Le nom désigne ce sur quoi l’on s’appuie. « Appui » est naturel en français et évite de répéter « bâton ».
- source_word: תְּהִלָּה
  choice: une source de louange
  rationale: Le sens premier est « louange ». L’ajout idiomatique de « source de » indique clairement que la sagesse procure la louange à ceux qui la suivent, sans confondre la construction avec une simple apposition peu naturelle en français.
- source_word: כְבוֹד עוֹלָם
  choice: un honneur éternel
  rationale: כְּבוֹד peut signifier « gloire » ou « honneur »; appliqué au bénéfice reçu par une personne, « honneur » convient bien. עוֹלָם exprime ici une durée sans fin ou durable.
- source_word: לְכָל הַהוֹלֵךְ אַחֲרֶיהָ
  choice: pour tous ceux qui marchent à sa suite
  rationale: La formulation conserve la métaphore hébraïque de la marche et le pronom féminin qui personnifie la sagesse, tout en restant naturelle en français.
theological_decisions:
- issue: Divergence majeure entre les témoins hébreu et grec
  choice: Traduire dans le texte principal la ligne hébraïque conservée.
  alternative: 'Grec : « La racine de la sagesse, c’est de craindre le Seigneur, et ses branches sont une longue vie. »'
  rationale: Le texte hébreu survivant est ici la source principale, mais la tradition grecque présente une forme entièrement différente du verset. La variante est donc donnée en note plutôt que fusionnée avec le texte hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La personnification féminine de la sagesse est maintenue. Le parallélisme hébreu est conservé autant que le permet une formulation française naturelle.
