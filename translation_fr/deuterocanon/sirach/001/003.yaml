  text: The height of heaven and the breadth of the earth[a], and the depth of the abyss—who can search them out?
translation:
  language: fr
  text: La hauteur du ciel, la largeur de la terre et la profondeur de l’abîme[a] — qui peut les sonder ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec ajoute « et la sagesse », ce qui donne : « La hauteur du ciel, la largeur de la terre, l’abîme et la sagesse — qui peut les sonder ? »'
    reason: textual_variant
lexical_decisions:
- source_word: רוּם שָׁמַיִם
  choice: la hauteur du ciel
  rationale: L’expression désigne l’étendue verticale du ciel. « Hauteur » conserve le parallélisme dimensionnel avec « largeur » et « profondeur ».
- source_word: רֹחַב אָרֶץ
  choice: la largeur de la terre
  rationale: Dans cette évocation cosmologique, אָרֶץ désigne la terre plutôt qu’un territoire particulier, et רֹחַב sa dimension en largeur.
- source_word: עֹמֶק תְּהוֹם
  choice: la profondeur de l’abîme
  rationale: « Profondeur » rend la dimension exprimée par עֹמֶק, tandis que « abîme » préserve la portée cosmique et mystérieuse de תְּהוֹם, également soutenue par le grec ἄβυσσον.
- source_word: מִי יַחֲקֹר
  choice: qui peut les sonder ?
  rationale: Le français idiomatique explicite la capacité sous-entendue par la question rhétorique. « Sonder » exprime une recherche approfondie et s’accorde naturellement avec des réalités dont on cherche à mesurer l’étendue; « les » reprend les trois dimensions énumérées.
theological_decisions:
- issue: Ajout grec de « et la sagesse », absent du témoin hébreu
  choice: Suivre dans le texte principal l’hébreu conservé, sans ajouter « et la sagesse ».
  alternative: Le parallèle grec ajoute « et la sagesse » après « l’abîme ».
  rationale: Le texte hébreu est ici attesté avec une confiance élevée et constitue la source principale. La variante grecque élargit sensiblement la portée de la question; elle est donc signalée en note plutôt qu’intégrée silencieusement au texte.
translation_notes:
  register: Français moderne, international et digne. La formulation conserve le rythme ternaire des dimensions cosmiques. « Sonder » est naturel tout en gardant la force de l’enquête exhaustive exprimée par le verbe hébreu.
