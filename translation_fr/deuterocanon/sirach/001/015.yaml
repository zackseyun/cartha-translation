  text: The fullness of wisdom is to fear the Lord, and it makes them drunk from its fruits[b][a].
translation:
  language: fr
  text: La plénitude de la sagesse consiste à craindre le Seigneur, et elle les enivre de ses fruits.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La ligne hébraïque conservée dans les manuscrits de la Guéniza du Caire diffère fortement à cet endroit : « Avec des hommes de vérité, elle a été établie depuis toujours, et avec leur descendance sa fidélité est sûre. » Dans l’édition citée, cette ligne est placée entre crochets et signalée comme une divergence majeure; le texte grec régit donc ici le texte principal.'
    reason: textual_variant
  - marker: b
    text: Le pronom grec est féminin et renvoie à la sagesse, souvent personnifiée dans le Siracide.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλησμονὴ σοφίας
  choice: La plénitude de la sagesse
  rationale: Le grec est retenu pour le texte principal en raison de la divergence majeure et de l’incertitude signalée du témoin hébreu. « Plénitude » conserve la force nominale de πλησμονή.
- source_word: φοβεῖσθαι τὸν κύριον
  choice: c’est de craindre le Seigneur
  rationale: La tournure explicite ce en quoi consiste la plénitude de la sagesse, tout en conservant le sens fort et traditionnel de « craindre ».
- source_word: μεθύσκει
  choice: elle les enivre
  rationale: « Enivrer » préserve l’image vive du verbe grec sans l’atténuer en simple satisfaction.
- source_word: αὐτοὺς
  choice: les
  rationale: Le pronom grec n’a pas d’antécédent explicite dans ce seul verset; le pronom français maintient cette concision et cette ambiguïté contextuelle.
- source_word: ἀπὸ τῶν καρπῶν αὐτῆς
  choice: des fruits qu’elle porte
  rationale: Cette formulation française naturelle conserve l’origine de l’enivrement exprimée par ἀπό et rend explicite, sans lourdeur, que les fruits sont ceux de la sagesse personnifiée.
theological_decisions:
- issue: Divergence entre le témoin hébreu entre crochets et le parallèle grec
  choice: Faire gouverner le grec dans le texte principal et signaler la ligne hébraïque divergente en note.
  alternative: « Avec les hommes de vérité, elle a été établie depuis toujours, et envers leur descendance sa fidélité est sûre. »
  rationale: La ligne hébraïque disponible est placée entre crochets dans l’édition citée et qualifiée de divergence majeure; elle ne correspond pas au verset grec. La transparence textuelle exige donc de traduire ici le grec tout en conservant le témoignage hébreu en note.
- issue: Personnification de la sagesse
  choice: Employer « elle » et « les fruits qu’elle porte ».
  alternative: Employer une formulation moins personnelle, telle que « ses fruits ».
  rationale: σοφία est féminin en grec et la sagesse est fréquemment personnifiée dans le Siracide; le français permet de conserver naturellement ce trait.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe proverbiale reste concise; « craindre le Seigneur » conserve la tension théologique du texte, tandis que « enivre » en maintient l’image poétique.
