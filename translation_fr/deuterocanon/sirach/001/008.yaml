translation:
  language: fr
  text: Il l’a donnée à toute chair, selon sa volonté[a], et il l’a donnée à ceux qui l’aiment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu transmis dit : « Il l’a donnée à toute chair selon sa volonté. » Le grec présente ici une formulation différente : « Le Seigneur lui-même la créa, la vit, la dénombra et la répandit sur toutes ses œuvres. »'
    reason: textual_variant
lexical_decisions:
- source_word: אֶל כָּל בָּשָׂר
  choice: à toute chair
  rationale: Cette expression rend directement l’idiome hébreu désignant l’ensemble des êtres de chair, sans le limiter silencieusement à la seule humanité. La tournure, biblique mais encore intelligible en français moderne, conserve l’étendue et l’ambiguïté du texte.
- source_word: כִּרְצוֹנוֹ
  choice: selon sa volonté
  rationale: רָצוֹן peut exprimer la volonté, le bon plaisir ou le désir. « Selon sa volonté » est naturel et digne, tout en maintenant l’idée d’une libre décision divine.
- source_word: נְתָנָהּ
  choice: Il l’a donnée
  rationale: Le texte hébreu transmis emploie נתן, « donner ». Le pronom féminin renvoie à la sagesse. La traduction suit ici le témoin hébreu plutôt que de fusionner sa formulation avec celle, sensiblement différente, du grec.
- source_word: וַיִּתְּנָהּ
  choice: et il l’a donnée
  rationale: Le verbe signifie clairement « et il la donna ». La répétition de « donnée » reproduit celle de la racine נתן dans les deux propositions hébraïques.
- source_word: לְאֹהֲבָיו
  choice: à ceux qui l’aiment
  rationale: Le participe désigne ceux qui aiment Dieu. Cette formulation est claire et naturelle, sans ajouter de nuance doctrinale absente du texte.
theological_decisions:
- issue: Divergence textuelle majeure entre le témoin hébreu et le parallèle grec
  choice: Traduire la formulation hébraïque transmise, y compris le premier verbe « donner », et signaler en note la forme grecque différente.
  alternative: « Il l’a répandue sur toute chair selon sa volonté, et il l’a donnée à ceux qui l’aiment. »
  rationale: 'Le grec ne fournit pas seulement un autre verbe : il présente une formulation globale différente (« le Seigneur lui-même la créa… et la répandit sur toutes ses œuvres »). Combiner le verbe grec avec la structure hébraïque produirait un texte hybride qui n’est attesté tel quel dans aucun des témoins fournis. Suivre le texte hébreu dans le corps et documenter le grec préserve honnêtement la divergence.'
translation_notes:
  register: Français international moderne, sobre et digne. « Toute chair » conserve l’idiome hébreu et sa portée potentiellement plus large que « toute l’humanité ». La répétition de « donnée » est intentionnelle et reflète le texte hébreu.
