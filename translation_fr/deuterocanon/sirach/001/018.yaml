    rationale: Le grec parallèle fourni ne comporte pas de sujet explicite pour ἐξώμβρισεν ; « Elle » impose donc une identification que le texte cité ne formule pas. De plus, « le savoir qui donne l’intelligence » interprète la construction « connaissance et savoir de l’intelligence ». Une note doit préserver ces ambiguïtés.
