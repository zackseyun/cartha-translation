  text: The fear of Yahweh is the beginning of wisdom[a], and she satisfies with the abundance of her produce.
translation:
  language: fr
  text: La crainte du Seigneur est le commencement de la sagesse[a], et elle rassasie de l’abondance de ses produits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « [Il/elle] a répandu la connaissance et le savoir de l’intelligence, et a élevé la gloire de ceux qui la retiennent. » Le grec diffère profondément de l’hébreu conservé ici et reflète probablement une autre forme du texte.'
    reason: alternative_reading
lexical_decisions:
- source_word: רֵאשִׁית
  choice: commencement
  rationale: Rend directement l’idée de début ou de première étape exprimée par le nom hébreu, sans lui imposer le sens plus interprétatif de « principe suprême ».
- source_word: חָכְמָה
  choice: sagesse
  rationale: Équivalent courant et naturel dans la littérature sapientielle; le féminin permet aussi de conserver la personnification hébraïque.
- source_word: יִרְאַת יְהֹוָה
  choice: la crainte du Seigneur
  rationale: Conserve la tension entre peur, profond respect et révérence dans cette formule biblique traditionnelle; « Seigneur » représente le nom divin יהוה.
- source_word: וּתְרַוֵּה
  choice: elle rassasie
  rationale: Le verbe évoque le fait d’abreuver jusqu’à satiété et, par extension, de combler. « Rassasie » exprime naturellement en français le plein contentement procuré, tout en laissant entendre l’abondance.
- source_word: בְּרֹב
  choice: par l’abondance de
  rationale: La préposition peut indiquer le moyen par lequel la sagesse rassasie; cette formulation conserve explicitement la valeur quantitative de רֹב.
- source_word: תְּבוּאָתָהּ
  choice: ses produits
  rationale: Le nom désigne ce qui est produit, le rendement ou la récolte. « Produits » garde l’image agricole sans la limiter à une récolte particulière, et le possessif renvoie à la sagesse personnifiée.
theological_decisions:
- issue: Choix du texte principal malgré l’écart entre l’hébreu et le grec
  choice: Traduire le texte hébreu conservé dans le corps du verset et signaler la forme grecque en note.
  alternative: 'Suivre le grec : « Elle a répandu la connaissance et le savoir qui donne l’intelligence, et elle a élevé la gloire de ceux qui la possèdent. »'
  rationale: Le témoin hébreu est ici disponible et intelligible, mais le grec présente une formulation profondément différente plutôt qu’une simple variante de traduction. La note préserve honnêtement cette importante divergence textuelle.
- issue: Personnification féminine de la sagesse
  choice: Employer « elle » et « ses » en référence à la sagesse.
  alternative: Neutraliser la personnification ou faire de « la crainte » le seul antécédent grammatical.
  rationale: Le suffixe féminin de תְּבוּאָתָהּ et l’usage sapientiel soutiennent une personnification féminine. Le français permet de la conserver naturellement grâce au nom féminin « sagesse ».
translation_notes:
  register: Français international moderne, digne et accessible. « Crainte » maintient la force de la formule biblique sans la réduire à la seule révérence. La personnification féminine de la sagesse est conservée. L’expression « ses produits » garde la métaphore agricole de l’hébreu.
