base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/031.yaml
  text: My son[a], do not be false in the fear of Yahweh[b], and do not draw near to him with a divided heart.
translation:
  language: fr
  text: Mon fils[a], ne sois pas insincère dans ta crainte de Yahweh, et ne t’approche pas de lui avec un cœur partagé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin hébreu porte : « Mon fils, ne sois pas insincère dans ta crainte de Yahweh, et ne t’approche pas de lui avec un cœur partagé. » À ce verset, le grec transmet plutôt : « Celui qui rend des bienfaits se souvient de ce qui suit et, au moment de sa chute, il trouvera un appui. »'
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « avec cœur et cœur », expression hébraïque désignant la duplicité ou la division intérieure.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Mon fils
  rationale: Le vocatif masculin singulier, formé de « fils » avec le suffixe de première personne, est conservé ainsi que le cadre pédagogique propre à la littérature de sagesse.
- source_word: אַל תְּכַזֵּב
  choice: ne sois pas faux
  rationale: Le verbe כזב exprime ici la fausseté ou le manque de sincérité, au-delà du seul fait de prononcer un mensonge. Cette formulation garde la portée éthique du texte.
- source_word: בְּיִרְאַת יְהֹוָה
  choice: dans ta crainte de Yahweh
  rationale: « Crainte » maintient le terme classique de la sagesse biblique sans le réduire au simple respect. Le tétragramme est rendu par le nom propre « Yahweh ».
- source_word: וְאַל תִּקְרַב אֵלָיו
  choice: et ne t’approche pas de lui
  rationale: קרב avec אֶל désigne le fait de s’approcher. La tournure française est naturelle tout en conservant la résonance relationnelle, voire cultuelle, de l’hébreu.
- source_word: בְּלֵב וָלֵב
  choice: avec un cœur partagé
  rationale: Littéralement « avec cœur et cœur », expression hébraïque évoquant la duplicité ou la division intérieure. « Un cœur partagé » en transmet clairement l’image et le sens.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte hébreu porte directement le tétragramme. « Yahweh » conserve le caractère de nom propre plutôt que de le remplacer par un titre.
- issue: Divergence majeure entre les témoins hébreu et grec
  choice: Traduire le témoin hébreu dans le corps du verset et signaler le grec en note
  alternative: Traduire le grec ou harmoniser les deux traditions
  rationale: L’hébreu conservé constitue ici la source principale demandée. Comme le grec présente une sentence entièrement différente, la note préserve cette variante sans créer artificiellement un texte composite.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme de l’avertissement hébreu est conservé. « Ne sois pas faux » maintient volontairement la portée large du verbe, et « cœur partagé » rend l’idiome sans lourdeur.
