review_pass:
  verdict: revise
  source_fidelity: Le projet suit bien le texte hébreu fourni, dont les deux distiques ne correspondent pas au grec parallèle. « Approche » rend קְרַב, et les deux comparaisons finales sont conservées. Toutefois, וְאַל תְּאַחֵר est plus explicitement rendu par « ne tarde pas », et לְנַפְשְׁךָ désigne ici naturellement la personne elle-même plutôt qu’une « âme » séparée.
  naturalness: « La vie pour ton âme » est peu idiomatique en français moderne et peut suggérer une lecture anthropologique plus étroite que ne l’impose נפש. « Tu trouveras la vie pour toi-même » est naturel tout en gardant le sens réflexif. « Et quand tu seras proche » est également plus fluide que « Lorsque tu seras proche » dans cette exhortation.
  terminology: « Homme vaillant » et « héros » rendent de manière acceptable איש חיל et גבור. La note sur la leçon grecque est nécessaire, car la divergence textuelle est majeure; elle doit rester clairement descriptive, sans préjuger de la priorité textuelle globale.
  issues:
  - severity: medium
    issue: Rendu de לְנַפְשְׁךָ
    rationale: « pour ton âme » est littéral mais peu naturel et risque d’introduire une opposition âme/corps absente du terme hébreu נפש dans ce contexte. Le réfléchi « pour toi-même » rend mieux la valeur usuelle du syntagme.
  - severity: low
    issue: Explicitation de l’interdiction וְאַל תְּאַחֵר
    rationale: « sans tarder » est acceptable, mais « et ne tarde pas » reproduit plus directement la coordination et la forme négative de l’hébreu.
  revised_text: Approche et ne tarde pas, et tu trouveras la vie pour toi-même. Et quand tu seras proche, sois comme un héros et comme un homme vaillant.[a]
  revised_footnotes:
  - marker: a
    text: 'Le texte grec transmis sous cette référence porte une sentence entièrement différente : « L’eau éteint un feu ardent, et l’aumône expie les péchés. »'
    reason: Le texte hébreu fourni diverge fortement du grec parallèle. La note signale cette variante textuelle majeure sans substituer silencieusement le grec au texte hébreu traduit.
  revision_rationale: La révision conserve le texte hébreu fourni et son parallélisme, tout en corrigeant une formulation française peu naturelle et potentiellement surinterprétative de נפש. Elle rend aussi explicitement l’interdiction « ne tarde pas ». La note textuelle est maintenue et légèrement resserrée.
