translation:
  language: fr
  text: Approche sans tarder, et tu trouveras la vie pour ton âme. Lorsque tu seras proche, sois comme un héros, comme un homme vaillant.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec transmis à cette référence porte une sentence entièrement différente : « L’eau éteint un feu ardent, et l’aumône expie les péchés. »'
    reason: Le dossier signale une divergence majeure entre le texte hébreu fourni et la tradition grecque; la note permet de conserver cette donnée textuelle sans remplacer silencieusement l’hébreu.
lexical_decisions:
- source_word: קְרַב
  choice: Approche
  rationale: Rend directement l’impératif hébreu tout en restant naturel en français moderne.
- source_word: וְאַל תְּאַחֵר
  choice: sans tarder
  rationale: Expression idiomatique qui conserve l’interdiction de différer.
- source_word: חַיִּים לְנַפְשְׁךָ
  choice: la vie pour ton âme
  rationale: Conserve le mot נֶפֶשׁ et son ambiguïté entre l’âme, la personne et la vie, sans le réduire silencieusement à « toi-même ».
- source_word: קָרוּב
  choice: proche
  rationale: Préserve la répétition conceptuelle avec l’ordre initial de s’approcher et ne précise pas de quoi ou de qui il s’agit.
- source_word: כְּגִבּוֹר וּכְאִישׁ חַיִל
  choice: comme un héros, comme un homme vaillant
  rationale: Reproduit les deux images parallèles de force et de bravoure sans les fusionner.
theological_decisions:
- issue: Rapport entre la vie et נֶפֶשׁ
  choice: « la vie pour ton âme »
  alternative: « la vie pour toi-même »
  rationale: La formulation retenue maintient la portée anthropologique et théologique possible de נֶפֶשׁ, tout en laissant ouverte sa valeur de « personne ».
- issue: Divergence textuelle majeure
  choice: Traduire le texte hébreu fourni et signaler la leçon grecque en note
  alternative: 'Suivre le grec : « L’eau éteint un feu ardent, et l’aumône expie les péchés »'
  rationale: La consigne donne priorité au témoignage hébreu original, ici présenté avec une confiance élevée. La divergence ne doit toutefois pas être dissimulée.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement correspond aux formes hébraïques au singulier. Le parallélisme de la seconde phrase et la répétition de l’idée de proximité sont conservés.
