translation:
  language: fr
  text: La crainte du Seigneur est gloire et sujet de fierté[a], joie et couronne d’allégresse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « gloire et motif de se glorifier ». Le grec accumule ici des termes voisins évoquant l’honneur et la joie.
    reason: lexical_alternative
lexical_decisions:
- source_word: φόβος
  choice: crainte
  rationale: '« La crainte du Seigneur » conserve la formule sapientielle biblique et son éventail de sens : respect profond, humble soumission et conscience de l’autorité divine.'
- source_word: κυρίου
  choice: du Seigneur
  rationale: Traduction française naturelle de la construction au génitif et conforme à l’usage biblique courant.
- source_word: δόξα
  choice: gloire
  rationale: Le terme exprime ici l’honneur et l’éclat associés à la crainte du Seigneur; « gloire » en préserve la force et la résonance biblique.
- source_word: καύχημα
  choice: sujet de fierté
  rationale: Le nom peut désigner la fierté ou ce dont on se glorifie. « Sujet de fierté » rend explicitement son sens positif ici, sans suggérer une vantardise condamnable.
- source_word: εὐφροσύνη
  choice: joie
  rationale: « Joie » est clair et naturel dans cette accumulation de biens, tout en laissant à ἀγαλλίαμα la nuance plus intense d’allégresse.
- source_word: στέφανος
  choice: couronne
  rationale: « Couronne » conserve la métaphore du στέφανος, couronne ou guirlande honorifique accordée au vainqueur.
- source_word: ἀγαλλιάματος
  choice: d’allégresse
  rationale: Le génitif caractérise vraisemblablement la couronne comme marquée par une joie exultante; « allégresse » distingue ce terme de la joie exprimée par εὐφροσύνη.
theological_decisions:
- issue: Traduction de la formule sapientielle φόβος κυρίου
  choice: La crainte du Seigneur
  alternative: Le profond respect du Seigneur
  rationale: La formulation traditionnelle reste intelligible en français moderne et préserve la tension du mot φόβος, qui ne se réduit ni à la terreur ni au seul respect.
- issue: Valeur positive de καύχημα
  choice: sujet de fierté
  alternative: motif de glorification
  rationale: Dans ce contexte, le terme désigne une fierté légitime liée au Seigneur. Cette traduction évite de lui imposer le sens moralement négatif de « vantardise ».
translation_notes:
  register: Français international moderne, simple et digne. La structure coordonnée et l’accumulation poétique du grec sont conservées, avec une légère explicitation de καύχημα pour assurer une lecture naturelle.
