  text: All her storehouses she fills with delight[b][a], and her granaries with her produce.
translation:
  language: fr
  text: Elle remplit tous ses entrepôts de biens précieux[b], et ses greniers de sa récolte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit : « Elle remplit tous ses entrepôts de biens précieux, et ses greniers de sa récolte. » Le témoin grec porte plutôt : « La couronne de la sagesse est la crainte du Seigneur, qui s’épanouit avec la paix et une santé guérissante. »'
    reason: textual_variant
  - marker: b
    text: Ou « de délices », « de choses agréables » ou « de choses désirables ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אוֹצָרֶיהָ
  choice: tous ses entrepôts
  rationale: אוֹצָר peut désigner un dépôt, un entrepôt ou un trésor. Le pluriel suffixé et le parallèle agricole avec « ses greniers » favorisent ici « tous ses entrepôts ».
- source_word: תְּמַלֵּא
  choice: elle remplit
  rationale: L’imparfait hébreu est rendu par un présent gnomique, naturel dans une maxime de sagesse. Le sujet féminin renvoie à la sagesse personnifiée dans le contexte.
- source_word: חֶמְדָּה
  choice: de biens précieux
  rationale: חֶמְדָּה exprime ce qui est désirable, précieux ou agréable. Dans l’image de lieux de stockage remplis, « biens précieux » est concret et naturel, tout en laissant les autres nuances en note.
- source_word: וַאֲסָמֶיהָ
  choice: et ses greniers
  rationale: אָסָם désigne un grenier ou un lieu où l’on conserve les récoltes. « Greniers » maintient clairement l’image agricole.
- source_word: בִּתְבוּאָתָהּ
  choice: de sa récolte
  rationale: תְּבוּאָה peut désigner le produit, le rendement ou la récolte. « Récolte » s’accorde naturellement avec « greniers » et le suffixe féminin est conservé.
- source_word: στέφανος σοφίας
  choice: non retenu dans le texte principal
  rationale: Le grec présente une leçon entièrement différente, « La couronne de la sagesse ». Puisque l’hébreu est conservé ici, il régit le texte principal; la leçon grecque est signalée en note.
theological_decisions:
- issue: Divergence majeure entre les témoins hébreu et grec de Siracide 1.17
  choice: Traduire l’hébreu conservé dans le texte principal
  alternative: 'Suivre le grec : « La couronne de la sagesse, c’est de craindre le Seigneur; elle fait fleurir la paix et une santé qui guérit. »'
  rationale: Le projet privilégie l’hébreu du Siracide lorsqu’il est disponible. La divergence ne doit toutefois pas être harmonisée ni dissimulée; la tradition grecque est donc donnée intégralement en note.
translation_notes:
  register: Français international moderne, clair et digne. L’ordre des mots a été naturalisé sans perdre le sujet féminin personnifié. L’image cohérente des entrepôts, des greniers et de la récolte est maintenue. Les marqueurs suivent l’ordre naturel [b], puis [a], chacun figurant dans le texte principal.
