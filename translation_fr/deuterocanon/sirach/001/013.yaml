  source_fidelity: 'Le texte principal suit fidèlement l’hébreu : יְרֵא est rendu par un singulier générique, אַחֲרִית est conservé par « fin », et יִתְבָּרָךְ est correctement compris au passif (« il sera béni »). « Connaîtra une fin heureuse » exprime naturellement l’issue favorable sans la réduire à la prospérité. La note doit toutefois rendre plus exactement le grec ἐν μήτρᾳ (« dans le sein maternel »), et non « dès le sein maternel ».'
  naturalness: Le français est moderne, fluide et d’un registre biblique accessible. La ponctuation et l’emploi de « le SEIGNEUR » sont cohérents. La formulation de la note est légèrement ajustée pour une traduction plus exacte du témoin grec, tout en reconnaissant que sa syntaxe est inhabituelle.
  terminology: « Craindre le SEIGNEUR » conserve convenablement l’expression biblique de la crainte révérencielle. « Béni » est le terme approprié pour יִתְבָּרָךְ. Les majuscules à « SEIGNEUR » conviennent pour le tétragramme dans cette convention éditoriale.
