  text: One who fears Yahweh—his end will be good[a]; and at the end of his days he will be blessed.
translation:
  language: fr
  text: Celui qui craint le SEIGNEUR connaîtra une fin heureuse[a] ; à la fin de ses jours, il sera béni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin grec diffère considérablement à ce verset : « Le commencement de la sagesse, c’est de craindre le Seigneur ; avec les fidèles, elle a été créée avec eux dans le sein maternel. » Le texte principal suit le témoin hébreu conservé ; la lecture grecque est indiquée en raison de cet écart important entre les sources.'
    reason: textual_variant
lexical_decisions:
- source_word: יְרֵא
  choice: Celui qui craint
  rationale: Le participe hébreu est employé comme substantif et désigne, au singulier générique, une personne caractérisée par la crainte révérencielle du Seigneur.
- source_word: יְהֹוָה
  choice: le SEIGNEUR
  rationale: Cette forme respecte l’usage français courant des traductions bibliques pour le tétragramme et la tradition révérencielle dont témoigne aussi le grec κύριον.
- source_word: תִּיטַב אַחֲרִיתוֹ
  choice: connaîtra une fin heureuse
  rationale: Cette tournure naturelle conserve l’idée hébraïque d’une fin ou d’un aboutissement qui sera bon, sans la réduire à la prospérité matérielle.
- source_word: וּבְאַחֲרִית יָמָיו
  choice: à la fin de ses jours
  rationale: La traduction garde la précision temporelle et la reprise du terme אַחֲרִית présent dans le premier membre.
- source_word: יִתְבָּרָךְ
  choice: il sera béni
  rationale: 'Le contexte et le parallélisme favorisent le sens passif : la personne qui craint le Seigneur reçoit la bénédiction. La forme peut ailleurs avoir une valeur réfléchie, mais celle-ci convient moins ici.'
theological_decisions:
- issue: Le texte grec transmis sous cette référence diffère fortement du texte hébreu conservé.
  choice: Suivre le témoin hébreu dans le texte principal et signaler intégralement la divergence grecque en note.
  alternative: Prendre le grec comme texte principal ou harmoniser les deux témoins.
  rationale: Le texte hébreu est ici conservé avec un degré élevé de confiance. La divergence grecque reste néanmoins importante pour l’histoire textuelle et ne doit être ni passée sous silence ni fondue artificiellement dans le texte hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. « Craindre le SEIGNEUR » conserve l’expression biblique traditionnelle et sa portée révérencielle. La répétition de « fin » reflète volontairement le parallélisme lexical hébreu.
