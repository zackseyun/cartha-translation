  text: Before all these, wisdom was created[b][a], and true understanding is from eternity.
translation:
  language: fr
  text: Avant toutes choses, la sagesse a été créée[a], et l’intelligence qui discerne existe depuis toujours[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu conservé porte plutôt : « Plus que toutes ces choses, la sagesse est grande. » Le grec porte : « Avant toutes choses, la sagesse a été créée. »'
    reason: alternative_reading
  - marker: b
    text: 'L’hébreu conservé porte : « et la vérité a prévalu depuis toujours », tandis que le grec parle de « l’intelligence qui discerne » existant depuis toujours.'
    reason: alternative_reading
lexical_decisions:
- source_word: προτέρα πάντων
  choice: Avant toutes choses
  rationale: Le grec exprime clairement l’antériorité de la sagesse par rapport à toutes choses. Cette formulation française est naturelle et conserve la portée primordiale du verset.
- source_word: ἔκτισται σοφία
  choice: la sagesse a été créée
  rationale: Le parfait grec présente la sagesse comme créée antérieurement, avec un état qui demeure. Le passé composé rend cette idée sans surcharger la phrase.
- source_word: σύνεσις φρονήσεως
  choice: l’intelligence qui discerne
  rationale: Les deux noms grecs associent compréhension et discernement pratique. La tournure relative restitue leur complémentarité en français courant sans réduire l’expression à la seule notion de vérité.
- source_word: ἐξ αἰῶνος
  choice: depuis toujours
  rationale: L’expression désigne une ancienneté primordiale. « Depuis toujours » est idiomatique et évite d’imposer plus précisément que le texte une notion philosophique d’éternité absolue.
- source_word: מִכָּל אֵלֶּה רַבָּה הַחָכְמָה
  choice: Plus que toutes ces choses, la sagesse est grande
  rationale: Cette traduction littérale de l’hébreu conservé est donnée en note, car son sens comparatif et son prédicat diffèrent nettement du grec.
- source_word: וְגָבְרָה הָאֱמֶת מֵעוֹלָם
  choice: la vérité prévaut depuis toujours
  rationale: 'La note conserve le témoignage hébreu proprement dit : גבר exprime la force ou la prévalence, et אמת signifie « vérité ».'
theological_decisions:
- issue: Divergence textuelle entre l’hébreu conservé et le parallèle grec dans les deux membres du verset
  choice: Le texte principal suit la structure et le sens du grec, tandis que les deux leçons hébraïques sont explicitement conservées en notes.
  alternative: « Plus que toutes ces choses, la sagesse est grande, et la vérité prévaut depuis toujours. »
  rationale: L’hébreu composite est ici placé entre crochets et diverge profondément du grec, qui offre un verset cohérent sur l’antériorité de la sagesse. Présenter le grec dans le texte et l’hébreu en notes rend la décision vérifiable sans harmoniser artificiellement les témoins.
- issue: Portée de ἐξ αἰῶνος / מֵעוֹלָם
  choice: depuis toujours
  alternative: de toute éternité
  rationale: « Depuis toujours » exprime l’ancienneté indéfinie ou primordiale commune aux expressions grecque et hébraïque, sans trancher si le verset affirme une éternité absolue au sens métaphysique.
translation_notes:
  register: Français international moderne, simple et digne. « Toutes choses » garde la solennité de la littérature sapientielle sans archaïsme marqué. Les notes signalent franchement la forte divergence des témoins au lieu de produire une formulation hybride.
