  text: A blow from a whip makes welts[a], but a blow from the tongue shatters bones.
translation:
  language: fr
  text: Le coup de fouet laisse des meurtrissures[a], mais le coup de langue brisera des os.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des marques de coups » ; le mot grec désigne les traces ou contusions laissées par des coups.
    reason: lexical_alternative
lexical_decisions:
- source_word: πληγὴ
  choice: le coup
  rationale: Dans les deux propositions, le mot désigne le coup porté plutôt que sa seule conséquence; sa répétition conserve le parallélisme grec.
- source_word: μάστιγος
  choice: de fouet
  rationale: Le génitif indique l’instrument. « Coup de fouet » est l’expression française naturelle et garde l’image concrète.
- source_word: ποιεῖ
  choice: laisse
  rationale: Dans ce contexte, « laisse » exprime naturellement l’apparition de marques causées par le fouet, tout en conservant la valeur générale du présent.
- source_word: μώλωπας
  choice: des meurtrissures
  rationale: Le terme désigne les marques ou contusions produites par des coups. « Meurtrissures » convient au registre sapientiel et couvre cette gamme de sens.
- source_word: γλώσσης
  choice: de langue
  rationale: Le grec garde l’image concrète de la langue pour désigner la parole nuisible. L’expression française « coup de langue » maintient cette métaphore et le parallèle avec le fouet.
- source_word: συγκλάσει
  choice: brisera
  rationale: Le futur grec est conservé. « Brisera » rend l’action violente du verbe sans ajouter l’idée plus spécifique d’un éclatement en fragments.
- source_word: ὀστᾶ
  choice: des os
  rationale: Le pluriel concret est maintenu dans l’image proverbiale; l’article indéfini est idiomatique en français.
