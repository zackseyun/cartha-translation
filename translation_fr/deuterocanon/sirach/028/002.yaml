    reason: textual_variant
lexical_decisions:
- source_word: ἄφες
  choice: Pardonne
  rationale: L’impératif aoriste signifie « pardonne » ou « laisse aller ». Dans le contexte d’un tort commis entre personnes, « pardonne » est le choix français le plus naturel et précis.
- source_word: ἀδίκημα
  choice: le tort qu’il t’a fait
  rationale: Le nom désigne un tort, une faute ou une injustice commise. Cette formulation explicite naturellement en français le tort causé au prochain.
- source_word: τῷ πλησίον σου
  choice: à ton prochain
  rationale: « Prochain » est l’équivalent biblique et éthique consacré de πλησίον, tout en restant compréhensible en français moderne.
- source_word: δεηθέντος σου
  choice: quand tu prieras
  rationale: Le génitif absolu exprime ici la circonstance temporelle d’une supplication adressée à Dieu. « Quand tu prieras » est clair et idiomatique.
- source_word: αἱ ἁμαρτίαι σου λυθήσονται
  choice: tes péchés seront déliés
  rationale: Le verbe λυθήσονται signifie littéralement « seront déliés » ou « libérés ». « Seront déliés » conserve l’image grecque sans la remplacer silencieusement par le terme interprétatif « pardonnés ».
theological_decisions:
- issue: Choix de la source principale pour ce verset
  choice: Traduire le parallèle grec comme texte opératoire de Siracide 28:2, avec une note signalant la discordance du témoin hébreu fourni.
  alternative: 'Traduire comme Siracide 28:2 le texte hébreu fourni : « De peur que demain il vienne et ne soit plus… »'
  rationale: Le texte hébreu fourni ne correspond ni au sens ni au contexte traditionnel de Siracide 28:2 et semble provenir d’un autre passage. Le grec transmet en revanche une lecture cohérente correspondant à cette référence. La note rend l’incertitude textuelle explicite.
- issue: Métaphore de la délivrance des péchés
  choice: Conserver « seront déliés ».
  alternative: Employer « seront pardonnés ».
  rationale: La formulation grecque emploie λύω, « délier », et non le verbe utilisé dans la première proposition pour pardonner. Conserver cette différence respecte la tension lexicale sans imposer une harmonisation théologique.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement singulier reproduit les formes grecques au singulier et convient au registre sapientiel. La ponctuation relie nettement le pardon accordé au prochain et la prière ultérieure.
