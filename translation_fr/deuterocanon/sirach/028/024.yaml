  text: See[a], fence in your property with thorns; bind up your silver and your gold.
translation:
  language: fr
  text: 'Vois : entoure ta propriété d’épines ; attache solidement ton argent et ton or.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autrement : « mets ton argent et ton or en sûreté ». Le grec emploie concrètement le verbe « attacher, lier solidement »; l’image est proverbiale et évoque la protection attentive de ce qui est précieux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδε
  choice: Vois
  rationale: Impératif bref qui attire l’attention et conserve la force directe du grec.
- source_word: περίφραξον
  choice: entoure… d’une haie
  rationale: Le verbe désigne l’action d’enclore ou de protéger par une clôture; cette formulation naturelle maintient l’image concrète.
- source_word: τὸ κτῆμά σου
  choice: ton bien
  rationale: κτῆμα désigne ce que l’on possède, notamment une propriété; le singulier « bien » préserve ici le nombre et reste assez large.
- source_word: ἀκάνθαις
  choice: d’épines
  rationale: Le datif exprime le moyen; « une haie d’épines » rend en français naturel l’enclos protecteur évoqué par le grec.
- source_word: τὸ ἀργύριόν σου
  choice: ton argent
  rationale: Le français « argent » conserve heureusement le double sens possible de métal précieux et de monnaie, tout en maintenant le parallèle avec l’or.
- source_word: καὶ τὸ χρυσίον
  choice: et ton or
  rationale: Le métal précieux est nommé explicitement; il convient de préserver cette image concrète.
- source_word: κατάδησον
  choice: mets sous clé
  rationale: Le grec signifie attacher ou lier solidement. L’expression française rend naturellement l’idée de mettre les métaux précieux en sûreté, tandis que la note conserve l’image littérale.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et proverbial. La première proposition conserve l’image rurale concrète; la seconde privilégie une expression idiomatique, avec restitution du sens littéral en note.
