base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/028/019.yaml
  text: Blessed is the one sheltered from it[a], who has not passed through its wrath, who has not drawn its yoke, and has not been bound in its chains.
translation:
  language: fr
  text: Heureux celui qui est protégé contre elle[a], qui n’est pas passé par sa fureur, qui n’a pas tiré son joug et qui n’a pas été lié dans ses chaînes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom féminin renvoie à la langue destructrice évoquée dans le contexte précédent.
    reason: Clarifier le référent du pronom, qui n’est pas nommé dans ce verset.
lexical_decisions:
- source_word: μακάριος
  choice: Heureux
  rationale: Formule naturelle des béatitudes et de la littérature de sagesse en français; elle exprime un état enviable plutôt qu’un simple sentiment passager.
- source_word: σκεπασθεὶς
  choice: qui est protégé
  rationale: Le participe passif évoque le fait d’être couvert et ainsi mis à l’abri d’un danger. « Protégé » restitue clairement cette valeur en français courant.
- source_word: ἀπʼ αὐτῆς
  choice: contre elle
  rationale: La préposition marque ici la protection contre une puissance nuisible. Le pronom féminin est conservé puisqu’il renvoie à la langue destructrice du contexte précédent.
- source_word: διῆλθεν
  choice: n’est pas passé par
  rationale: Cette expression conserve l’image de traverser ou de subir une expérience, sans la réduire au verbe abstrait « éprouver ».
- source_word: θυμῷ
  choice: fureur
  rationale: Le mot désigne ici une colère intense et destructrice. « Fureur » convient à la personnification de la langue et reste naturel en français.
- source_word: εἵλκυσεν
  choice: n’a pas tiré
  rationale: Le verbe signifie tirer ou entraîner. La traduction directe maintient l’image concrète du joug, même si elle demeure volontairement frappante.
- source_word: ζυγὸν
  choice: joug
  rationale: « Joug » conserve l’image littérale ainsi que ses connotations de servitude et d’oppression.
- source_word: δεσμοῖς
  choice: chaînes
  rationale: Le terme désigne des liens ou des entraves. « Chaînes » est concret, accessible et prolonge l’image de l’asservissement.
- source_word: ἐδέθη
  choice: n’a pas été lié
  rationale: Le passif grec est conservé et exprime le fait d’être retenu ou asservi par ces chaînes.
theological_decisions:
- issue: Référent des pronoms féminins
  choice: Conserver la personnification au féminin (« elle », « sa », « son », « ses »), en la rattachant par une note à la langue destructrice du contexte précédent.
  alternative: Employer des tournures impersonnelles comme « en être protégé » et éviter le pronom féminin explicite.
  rationale: Le grec emploie constamment le féminin, en accord avec le nom féminin désignant la langue dans le contexte. Le français permet de conserver naturellement ce genre et donc la personnification, sans imposer une interprétation doctrinale.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve les images successives du texte grec — traverser la fureur, tirer le joug, être lié dans les chaînes — même lorsque leur caractère imagé produit une expression moins ordinaire.
