translation:
  language: fr
  text: Car son joug est un joug de fer[a], et ses liens sont des liens de bronze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie ici des possessifs renvoyant à un antécédent féminin, que le contexte peut présenter comme une force personnifiée; on peut aussi comprendre plus abstraitement : « son joug… ses liens ».'
    reason: Précision sur la personnification féminine, que les possessifs français ne permettent pas de faire apparaître.
lexical_decisions:
- source_word: ζυγός
  choice: joug
  rationale: Le nom désigne concrètement un joug. Cette image d’asservissement oppressant doit être conservée plutôt que généralisée par « fardeau ».
- source_word: σιδηροῦς
  choice: de fer
  rationale: L’adjectif signifie « en fer » ou « fait de fer ». La tournure française « un joug de fer » est naturelle et garde la force proverbiale du grec.
- source_word: δεσμοί
  choice: liens
  rationale: Le terme désigne ce qui attache ou entrave. « Liens » préserve sa portée générale et la structure répétitive du grec, tandis que « chaînes » serait plus précis que la source.
- source_word: χαλκεῖοι
  choice: de bronze
  rationale: L’adjectif désigne un objet fait de bronze ou de cuivre. « De bronze » est ici l’expression française moderne la plus naturelle.
- source_word: αὐτῆς
  choice: son / ses
  rationale: Le possessif français s’accorde avec l’objet possédé et non avec son référent; « son » et « ses » peuvent donc préserver la référence féminine contextuelle, mais sans la rendre explicite dans ce verset isolé.
theological_decisions:
- issue: Maintien de la personnification féminine
  choice: Employer « son » et « ses » dans le texte, avec une note signalant que le grec renvoie à un antécédent féminin personnifié.
  alternative: Comprendre les possessifs de façon plus abstraite, en référence à la langue ou à la parole nuisible sans personnification marquée.
  rationale: Le grec répète αὐτῆς, qui renvoie à un antécédent grammaticalement féminin dans le contexte. Comme les possessifs français ne marquent pas le genre du possesseur, une note est nécessaire pour rendre perceptible l’ambiguïté entre personnification et référence abstraite sans la résoudre artificiellement.
translation_notes:
  register: Français international moderne, sobre et proverbial. La répétition « joug… joug » et « liens… liens » reproduit le parallélisme appuyé du grec; « car » conserve la relation explicative introduite par γάρ.
