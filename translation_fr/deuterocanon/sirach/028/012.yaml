translation:
  language: fr
  text: Il y avait devant lui une braise ; il souffla dessus[a], et elle s’embrasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec dit : « Si tu souffles sur une étincelle, elle s’enflammera ; si tu craches dessus, elle s’éteindra ; et l’un comme l’autre sortent de ta bouche. » Le témoin hébreu, plus court, dit : « Il y avait devant lui une braise ; il souffla dessus, et elle s’embrasa. »'
    reason: alternative_reading
lexical_decisions:
- source_word: הָיְתָה
  choice: Il y avait
  rationale: La proposition s’ouvre naturellement sur une tournure existentielle ; « Il y avait » rend simplement le sens du verbe en français.
- source_word: לְפָנָיו
  choice: devant lui
  rationale: La préposition avec suffixe masculin singulier signifie ici « devant lui ». Le pronom est conservé malgré l’absence de référent explicite dans ce témoin hébreu bref.
- source_word: גַחֶלֶת
  choice: une braise
  rationale: גחלת désigne un charbon ardent ou une braise. « Braise » est concret, naturel en français et convient à l’action de souffler pour raviver le feu.
- source_word: נָפַח בָּה
  choice: il souffla dessus
  rationale: Le verbe signifie « souffler » ou « exhaler ». La préposition renvoie à la braise ; « souffla dessus » est l’expression française idiomatique dans ce contexte.
- source_word: וּבָעֲרָה
  choice: et elle s’embrasa
  rationale: בער exprime ici le fait de prendre feu ou de brûler. « S’embrasa » restitue le déclenchement ou le ravivement de la combustion après le souffle.
- source_word: ἐὰν φυσήσῃς σπινθῆρα ἐκκαήσεται
  choice: signalé en note, sans être suivi dans le texte principal
  rationale: Le parallèle grec emploie la deuxième personne, parle d’une étincelle et développe le proverbe. Le témoin hébreu conservé reste la base du texte principal, tandis que la forme grecque est donnée en note.
