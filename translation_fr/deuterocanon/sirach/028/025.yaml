  text: And make for your words a balance and a measure[a], and make for your mouth a door and a bolt.
translation:
  language: fr
  text: Mets à tes paroles une balance et un poids[a], et à ta bouche une porte et un verrou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « balance » signifie souvent « joug » ; associé ici à « poids », il évoque plutôt un instrument de pesée. L’image invite à peser et à maîtriser ses paroles.
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγοις
  choice: paroles
  rationale: Dans cette exhortation, le terme désigne ce que l’on dit. « Paroles » est direct, naturel et conserve le pluriel grec.
- source_word: ζυγόν
  choice: balance
  rationale: Bien que ζυγός signifie souvent « joug », son association avec σταθμός évoque ici l’instrument de pesée et invite à peser ses paroles.
- source_word: σταθμόν
  choice: poids
  rationale: Le mot peut désigner un poids servant à la pesée ou un étalon. « Poids » maintient précisément l’image concrète formée avec « balance ».
- source_word: στόματί
  choice: bouche
  rationale: La traduction concrète préserve l’image d’un accès qu’il faut fermer afin de retenir la parole.
- source_word: θύραν
  choice: porte
  rationale: Équivalent direct qui conserve l’image d’une bouche dont l’accès peut être fermé.
- source_word: μοχλόν
  choice: verrou
  rationale: Le terme désigne une barre ou un dispositif servant à bloquer une porte. « Verrou » exprime naturellement en français l’idée de fermeture sûre.
- source_word: ποίησον
  choice: mets
  rationale: Dans la construction française « mettre à », cet impératif rend naturellement l’idée d’équiper les paroles et la bouche, tout en permettant de conserver le parallélisme du grec.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le parallélisme de l’exhortation et ses deux images concrètes — la pesée des paroles et la fermeture de la bouche — sont conservés. « Un poids » est préféré à « une mesure » pour rendre la collocation grecque de façon précise et naturelle.
