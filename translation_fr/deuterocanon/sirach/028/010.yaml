base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/028/010.yaml
  text: As the fuel of a fire, so it will be kindled; according to a man's strength, so will his wrath be; and according to his wealth he will raise up his anger, and according to the firmness of the conflict it will be kindled.
translation:
  language: fr
  text: À proportion du combustible, le feu s’embrasera[a] ; selon la force de l’homme, telle sera sa colère. Selon sa richesse, il fera monter sa fureur, et selon la vigueur du conflit, elle s’embrasera[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Selon le combustible du feu, ainsi il s’embrasera. » Le grec laisse le sujet du verbe sous-entendu ; la traduction l’explicite comme « le feu ».'
    reason: ambiguïté grammaticale et formulation littérale
  - marker: b
    text: 'Ou : « selon la fermeté », « la force » ou « la dureté du conflit ». Le grec peut désigner son caractère solidement établi aussi bien que sa vigueur.'
    reason: alternative lexicale
lexical_decisions:
- source_word: ὕλην
  choice: combustible
  rationale: Dans le contexte de πυρός, le mot désigne la matière qui nourrit le feu. « Combustible » est naturel en français et plus précis que « matière », sans le limiter au seul bois.
- source_word: ἐκκαυθήσεται
  choice: s’embrasera
  rationale: Le futur passif grec évoque ce qui est mis en feu ou flambe. Le français pronominal rend naturellement ce sens et conserve la métaphore aux deux occurrences.
- source_word: ἰσχὺν
  choice: force
  rationale: « Force » exprime directement la puissance ou la capacité d’un homme et convient au parallélisme proverbial.
- source_word: ἀνθρώπου
  choice: de l’homme
  rationale: Le singulier grec est générique. « De l’homme » conserve la forme proverbiale et le référent humain sans rendre le français artificiel.
- source_word: θυμὸς
  choice: colère
  rationale: Le terme désigne une vive colère. « Colère » est clair et naturel; la nuance d’intensité ressort déjà du verbe « s’embrasera ».
- source_word: πλοῦτον
  choice: richesse
  rationale: Le terme désigne ici les biens ou les moyens matériels et sociaux dont dispose quelqu’un.
- source_word: ἀνυψώσει
  choice: attisera
  rationale: Littéralement, le verbe signifie « élèvera ». Dans la métaphore du feu, « attisera » exprime naturellement l’intensification tout en liant la proposition à l’image directrice.
- source_word: ὀργὴν
  choice: fureur
  rationale: « Fureur » distingue ce terme de θυμός rendu par « colère » et exprime une colère portée à un haut degré, sans prétendre établir une différence technique rigide.
- source_word: στερέωσιν
  choice: intensité
  rationale: Avec μάχης, le substantif évoque la force, la dureté ou le caractère solidement établi du conflit. « Intensité » restitue le sens contextuel en français idiomatique.
- source_word: μάχης
  choice: conflit
  rationale: Dans ce passage consacré aux querelles et à la colère, « conflit » garde une portée interpersonnelle plus large et moins militaire que « bataille ».
theological_decisions:
- issue: Référent humain générique au singulier
  choice: de l’homme
  alternative: d’une personne
  rationale: Le grec emploie ἀνθρώπου au singulier dans une formulation proverbiale. Le choix retenu préserve cette forme et n’introduit aucune restriction doctrinale au sexe masculin.
- issue: Rapport entre θυμός et ὀργή
  choice: θυμός = « colère » ; ὀργή = « fureur »
  alternative: rendre les deux termes par « colère »
  rationale: Les deux mots ont des champs sémantiques qui se recouvrent. Une légère différenciation française reflète leur juxtaposition sans imposer une distinction théologique absolue.
- issue: Sujet implicite de ἐκκαυθήσεται dans la première proposition
  choice: expliciter « la colère »
  alternative: « il s’embrasera » ou « cela s’embrasera »
  rationale: Le grec laisse le sujet sous-entendu, mais le contexte immédiat l’identifie vraisemblablement à la colère. L’explicitation est nécessaire à la clarté du français, tandis qu’une note signale la formulation plus littérale.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La structure proverbiale et le parallélisme ont été conservés, avec une ponctuation qui rend les quatre membres lisibles. La métaphore du feu est renforcée de manière idiomatique par « alimente », « attisera » et « s’embrasera », sans supprimer l’ambiguïté signalée en note.
