revisions:
- from: Comme le combustible alimente le feu, ainsi la colère s’embrasera[a] ; elle sera à la mesure de la force de l’homme. Selon sa richesse, il attisera sa fureur, et selon l’intensité du conflit, elle s’embrasera[b].
  to: À proportion du combustible, le feu s’embrasera[a] ; selon la force de l’homme, telle sera sa colère. Selon sa richesse, il fera monter sa fureur, et selon la vigueur du conflit, elle s’embrasera[b].
  rationale: La révision rétablit la construction comparative du grec, évite d'ajouter l'image de l'attisement au verbe « faire monter », et conserve une formulation française moderne. L'explicitation de « le feu » dans le premier membre reste signalée, car le sujet du passif grec n'est pas exprimé. Les deux notes sont ancrées aux emplacements concernés.
