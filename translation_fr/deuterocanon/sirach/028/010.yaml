  verdict: revise
  source_fidelity: La reformulation « Comme le combustible alimente le feu » ne rend plus le parallélisme proportionnel κατὰ … οὕτως (« selon/à proportion de … ainsi ») ni le futur passif ἐκκαυθήσεται. « Attisera » introduit en outre une image de feu qui n'est pas portée par ἀνυψώσει, « fera monter/élèvera ». Une révision conserve mieux la structure et la progression du grec.
  naturalness: Le français du projet est globalement fluide, mais « elle sera à la mesure de la force de l’homme » alourdit le parallélisme. « À proportion de », « telle sera » et « fera monter » sont à la fois naturels dans un registre proverbial soutenu et plus proches du texte.
  terminology: « Combustible », « force », « richesse » et « conflit » conviennent. La distinction modérée entre θυμός (« colère ») et ὀργή (« fureur ») peut être conservée. Pour στερέωσις, « vigueur » est plus idiomatique que « intensité » tout en gardant l'idée de force ou de fermeté, explicitée en note.
  issues:
  - severity: medium
    issue: Perte du parallélisme de proportion dans le premier membre
    rationale: κατὰ τὴν ὕλην πυρὸς οὕτως exprime une correspondance « selon/à proportion de … ainsi », et non simplement le fait que le combustible alimente le feu.
  - severity: medium
    issue: « Attisera » surinterprète ἀνυψώσει
    rationale: Le verbe signifie littéralement « élèvera, fera monter ». L'image de l'attisement est possible comme effet interprétatif, mais elle ajoute une métaphore absente de ce verbe et affaiblit le parallélisme avec l'élévation de la colère.
  - severity: low
    issue: « Intensité du conflit » est plus étroit que στερέωσις
    rationale: στερέωσις évoque d'abord la solidité, la fermeté ou la force établie. « Vigueur » garde une portée française plus ouverte; les possibilités plus littérales sont signalées en note.
