translation:
  language: fr
  text: Un homme nourrit de la colère contre un autre homme et cherche auprès du Seigneur la guérison ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin hébreu fourni pour cette référence dit : « J’ai tout pesé sur le plateau d’une balance et je n’ai rien trouvé de plus léger que le son », texte qui ne correspond pas au contexte. La traduction suit donc ici le témoin grec de Siracide 28.3.'
    reason: textual_variant
lexical_decisions:
- source_word: ἄνθρωπος ἀνθρώπῳ
  choice: un homme… contre un autre homme
  rationale: Le grec emploie deux fois le nom singulier ἄνθρωπος et souligne ainsi le contraste entre deux êtres humains. Cette formulation conserve cette reprise et la portée représentative du singulier.
- source_word: συντηρεῖ ὀργήν
  choice: entretient sa colère
  rationale: Le verbe exprime la conservation durable d’un sentiment. « Entretient sa colère » est idiomatique en français et rend mieux cette persistance que le simple verbe « garde ».
- source_word: παρὰ Κυρίου
  choice: au Seigneur
  rationale: Avec la demande de guérison, le français exprime naturellement la source attendue par « demander au Seigneur ». Le titre κύριος est rendu par « Seigneur ».
- source_word: ζητεῖ ἴασιν
  choice: demande… de le guérir
  rationale: Cette tournure française naturelle restitue la recherche d’une guérison venant du Seigneur. Le pronom « le » renvoie au sujet de la question sans préciser si la guérison est physique, morale ou relationnelle.
theological_decisions:
- issue: Conflit entre le témoin hébreu fourni et le parallèle grec correspondant à Siracide 28.3
  choice: Traduire d’après le grec, qui correspond au contexte de l’exhortation sur la colère et le pardon.
  alternative: 'Traduire littéralement l’hébreu fourni : « J’ai tout pesé sur le plateau d’une balance et je n’ai rien trouvé de plus léger que le son. »'
  rationale: La ligne hébraïque fournie appartient manifestement à une autre sentence et ne correspond ni au contenu ni au contexte de Siracide 28.3. Le grec conserve ici le texte cohérent de ce verset. La divergence est signalée explicitement en note plutôt que dissimulée.
- issue: Portée de la guérison demandée
  choice: Conserver le terme général « guérir » sans définir la nature du mal.
  alternative: Préciser une guérison physique, morale ou spirituelle.
  rationale: Le grec ἴασις ne précise pas ici le domaine de la guérison. Le contexte crée une tension entre la colère entretenue et la guérison demandée à Dieu, qu’il convient de préserver sans l’interpréter davantage.
translation_notes:
  register: Français moderne, digne et directement intelligible. La question rhétorique est conservée, de même que la répétition « un homme… un autre homme », qui met en relief l’incohérence dénoncée.
