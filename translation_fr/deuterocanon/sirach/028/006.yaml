  source_fidelity: 'Le grec parallèle donne une série cohérente de deux impératifs : se souvenir des « dernières choses », cesser l’hostilité, se souvenir de la καταφθορά et de la mort, puis persévérer dans les commandements. Le texte français suit cette structure. « Déchéance » risque toutefois d’évoquer principalement une dégradation morale ou sociale, sens qui n’est pas requis par καταφθορά dans son association avec la mort ; « destruction » conserve mieux le champ de la ruine/périssabilité.'
