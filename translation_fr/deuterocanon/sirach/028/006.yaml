  text: Remember the end[a], and stop being hostile; remember decay and death[b], and remain in the commandments.
translation:
  language: fr
  text: Souviens-toi de la fin[a] et cesse d’être hostile ; souviens-toi de la destruction et de la mort[b], et reste attaché aux commandements.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « les dernières choses ». L’expression peut désigner la fin d’une personne ou l’issue ultime.'
    reason: lexical_alternative
  - marker: b
    text: 'Le témoin hébreu fourni à cet endroit présente un autre dicton, approximativement : « … on répond à une affaire avant de l’avoir entendue. » Cela semble indiquer un décalage dans le rattachement du texte plutôt qu’une simple variante de ce verset.'
    reason: textual_variant
lexical_decisions:
- source_word: μνήσθητι
  choice: Souviens-toi
  rationale: Impératif direct et naturel en français, conforme au style d’exhortation sapientielle.
- source_word: τὰ ἔσχατα
  choice: la fin
  rationale: Littéralement « les dernières choses » ; « la fin » exprime naturellement l’issue finale sans préciser indûment s’il s’agit de la mort personnelle ou du dénouement ultime.
- source_word: παῦσαι ἐχθραίνων
  choice: cesse toute hostilité
  rationale: La construction désigne la cessation d’une attitude ou d’une conduite hostile durable ; cette formulation garde une portée plus large que la seule haine intérieure.
- source_word: καταφθοράν
  choice: la déchéance
  rationale: Le terme peut désigner la corruption, la ruine ou le dépérissement. « Déchéance », associé à la mort, évoque l’inéluctable détérioration sans imposer exclusivement le sens moral de « corruption ».
- source_word: θάνατον
  choice: la mort
  rationale: Équivalent français courant et précis.
- source_word: ἔμμενε
  choice: reste fidèle
  rationale: Le verbe appelle à persévérer. En français, « rester fidèle aux commandements » est plus idiomatique que « demeurer dans les commandements », tout en conservant l’idée de constance.
- source_word: ἐντολαῖς
  choice: aux commandements
  rationale: Le grec n’exprime pas de possesseur ; la traduction n’ajoute donc pas « de Dieu ».
theological_decisions:
- issue: Choix du témoin textuel principal pour ce verset
  choice: Traduire le parallèle grec, qui donne ici un verset cohérent, et signaler en note le décalage du texte hébreu fourni.
  alternative: 'Traduire directement la ligne hébraïque fournie : « Et plus léger qu’un voyageur, on répond à une affaire avant de l’avoir entendue. »'
  rationale: La ligne hébraïque fournie ne correspond pas sémantiquement à Siracide 28.6 dans le grec et paraît provenir d’un autre dicton ou d’un mauvais rattachement. Le grec est donc retenu comme témoin opératoire, sans dissimuler l’incertitude de la transmission hébraïque.
- issue: Portée de τὰ ἔσχατα
  choice: « la fin », avec une note maintenant l’ambiguïté
  alternative: « ta fin » ou « les fins dernières »
  rationale: Le grec ne comporte pas de possessif et peut viser aussi bien la fin personnelle que l’issue ultime. La traduction évite d’enfermer le texte dans une interprétation eschatologique particulière.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve le rythme des impératifs du grec. « Reste fidèle » privilégie l’idiome français tout en exprimant la persévérance demandée.
