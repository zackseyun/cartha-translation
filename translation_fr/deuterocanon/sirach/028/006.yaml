  - severity: low
    issue: « cesse toute hostilité »
    rationale: Cette tournure est compréhensible, mais elle nominalise et généralise légèrement l’exhortation. « Cesse d’être hostile » reproduit plus directement l’idée de cesser une conduite hostile.
