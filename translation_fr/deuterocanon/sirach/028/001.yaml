  naturalness: « Tiendra rigoureusement le compte de ses péchés » est français, mais lourd et quelque peu administratif. Une formulation passive, « ses péchés seront scrupuleusement retenus », est plus naturelle dans ce contexte et évite d’imposer l’agent de la conservation.
