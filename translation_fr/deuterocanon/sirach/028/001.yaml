  text: The one who takes vengeance will find vengeance from the Lord, and he will surely keep his sins in mind.[a]
translation:
  language: fr
  text: Celui qui se venge recevra vengeance du Seigneur, et ses péchés seront scrupuleusement retenus.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La ligne hébraïque conservée fournie pour ce verset dit : « Ne redoute pas la détresse de demain, car tu ne sais pas ce qu’un jour enfantera. » Elle ne correspond pas au texte grec de Siracide 28.1 et semble provenir d’un autre verset ou résulter d’un décalage dans la transmission. La traduction suit donc le témoin grec pour Siracide 28.1.'
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « et, conservant ses péchés, il les conservera ». Le grec répète le même verbe pour insister. La construction permet diverses analyses du sujet; la formulation française n’en impose aucune.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐκδικῶν
  choice: Celui qui se venge
  rationale: Le participe substantivé désigne de façon générale quiconque exerce la vengeance; cette formulation est naturelle en français moderne et conserve le lien lexical avec « vengeance ».
- source_word: παρὰ Κυρίου
  choice: du Seigneur
  rationale: παρά avec le génitif indique ici la provenance; en français, « subir la vengeance du Seigneur » exprime clairement que celle-ci vient de lui.
- source_word: εὑρήσει ἐκδίκησιν
  choice: subira la vengeance
  rationale: Le grec dit littéralement « trouvera vengeance ». « Subira » rend naturellement la rencontre punitive en français tout en conservant le terme « vengeance » et son écho avec le premier membre.
- source_word: τὰς ἁμαρτίας αὐτοῦ
  choice: ses péchés
  rationale: Rend directement le sens moral de ἁμαρτίαι sans l'atténuer.
- source_word: διατηρῶν διατηρήσει
  choice: tiendra rigoureusement le compte de
  rationale: La répétition du même verbe en grec marque l'insistance. Cette expression indique que les péchés restent retenus contre la personne, plutôt qu'un simple souvenir mental; « rigoureusement » restitue la force emphatique.
theological_decisions:
- issue: Divergence entre le témoin hébreu fourni et le texte grec de Siracide 28.1
  choice: Traduire le témoin grec correspondant à Siracide 28.1
  alternative: « Ne redoute pas la détresse de demain, car tu ne sais pas ce qu'un jour enfantera. »
  rationale: La ligne hébraïque fournie ne correspond pas au contenu de Siracide 28.1 et semble provenir d'un autre contexte textuel. Le grec transmet ici le verset attendu; la divergence est donc signalée sans harmonisation dans une note.
- issue: Sujet implicite de διατηρῶν διατηρήσει
  choice: Rendre le sujet par « celui-ci », renvoyant au Seigneur
  alternative: Laisser le sujet ambigu ou le rapporter à celui qui se venge
  rationale: Dans la syntaxe et le contexte, le Seigneur est l'agent naturel qui conserve les péchés contre le vengeur. « Celui-ci » clarifie ce rattachement sans ajouter un nom absent du second membre.
translation_notes:
  register: Français international moderne, clair et digne. « Celui qui se venge » évite le masculin générique trop marqué de « l'homme qui »; « tenir le compte » communique de manière accessible l'idée de péchés conservés à charge. Les deux appels de note figurent dans le texte.
