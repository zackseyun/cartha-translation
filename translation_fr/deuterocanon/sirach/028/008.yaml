  text: Tiens-toi à l’écart des querelles, et tu commettras moins de péchés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπόσχου
  choice: Tiens-toi à l’écart de
  rationale: L’impératif aoriste moyen appelle à se retirer délibérément ou à ne pas s’engager. Cette tournure est naturelle en français moderne et conserve l’idée d’éloignement volontaire.
- source_word: μάχης
  choice: des querelles
  rationale: μάχη peut désigner un combat, un conflit ou une dispute. Ici, le contexte sapientiel vise surtout les affrontements interpersonnels qui entraînent au péché; « querelles » rend ce sens sans le limiter à la violence physique.
- source_word: ἐλαττώσεις
  choice: tu commettras moins de
  rationale: Le futur exprime le résultat attendu. Avec « péchés », cette formulation idiomatique indique clairement une diminution du nombre d’actes pécheurs, plutôt qu’une réduction de leur gravité.
- source_word: ἁμαρτίας
  choice: péchés
  rationale: Le pluriel grec désigne ici des actes de péché; le pluriel français le restitue directement.
