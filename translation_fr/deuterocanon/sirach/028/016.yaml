  text: Whoever pays attention to it will never find rest[a], nor will he settle down in peace.
translation:
  language: fr
  text: Celui qui lui prête attention ne trouvera aucun repos et ne demeurera pas dans la tranquillité.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ προσέχων αὐτῇ
  choice: Celui qui lui prête attention
  rationale: Le participe présent substantivé a une portée générale. « Prêter attention à » rend naturellement l’idée de se tourner vers la langue évoquée dans le contexte; le pronom féminin « lui » reprend son genre et son référent en français.
- source_word: οὐ μὴ εὑρῇ
  choice: ne trouvera aucun
  rationale: La construction οὐ μή avec le subjonctif exprime une négation fortement affirmée. « Ne trouvera aucun repos » en restitue clairement la force sans alourdir la phrase.
- source_word: ἀνάπαυσιν
  choice: repos
  rationale: « Repos » est l’équivalent direct et convient à l’idée de soulagement et de quiétude dans ce contexte sapientiel.
- source_word: οὐδὲ κατασκηνώσει
  choice: et ne demeurera pas
  rationale: Le verbe peut littéralement évoquer le fait de camper, puis, par extension, celui de demeurer. « Demeurera » conserve cette dimension spatiale tout en restant naturel dans l’emploi métaphorique.
- source_word: μεθʼ ἡσυχίας
  choice: dans la tranquillité
  rationale: ἡσυχία désigne le calme, le silence ou la tranquillité. Cette traduction reste proche du grec et évite de réduire le terme à la seule notion de paix.
theological_decisions: []
