  text: He has no mercy on a man like himself[b][a], yet he asks for his own sins to be forgiven?
translation:
  language: fr
  text: Il ne fait preuve d’aucune miséricorde envers son semblable[a], et pourtant il demande le pardon de ses propres péchés[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La ligne hébraïque conservée dans les manuscrits de la Guéniza du Caire et fournie ici semble ne pas correspondre à ce verset. La traduction suit donc le témoin grec.
    reason: textual_variant
  - marker: b
    text: 'Plus littéralement : « et il prie au sujet de ses péchés ? » Le grec laisse implicite l’objet précis de sa demande.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπʼ ἄνθρωπον ὅμοιον αὐτῷ
  choice: pour son semblable
  rationale: Cette formulation française naturelle exprime avec concision l’idée d’un être humain pareil à lui, sans limiter le propos aux hommes de sexe masculin.
- source_word: οὐκ ἔχει ἔλεος
  choice: n’a aucune pitié
  rationale: « Pitié » rend ici clairement ἔλεος dans le contexte éthique de la compassion et du pardon, tout en conservant la construction négative du grec.
- source_word: καὶ περὶ τῶν ἁμαρτιῶν αὐτοῦ δεῖται
  choice: et pourtant il demande le pardon de ses propres péchés
  rationale: δεῖται peut signifier demander, supplier ou prier. Le pardon demandé reste implicite en grec, mais le contexte permet de l’expliciter dans le texte principal. « Et pourtant » fait ressortir le contraste de la question rhétorique.
theological_decisions:
- issue: Choix de la source principale lorsque le témoin hébreu fourni ne correspond pas au verset
  choice: Traduire le témoin grec et signaler la discordance de l’hébreu
  alternative: Traduire malgré tout la ligne hébraïque conservée
  rationale: La ligne hébraïque fournie parle d’un convive ou d’un gendre habitant chez son beau-père et ne correspond ni à Siracide 28.4 ni à son contexte. Le grec transmet en revanche le texte cohérent de ce verset. Il sert donc ici de source effective, tandis que l’incertitude textuelle est explicitement signalée.
- issue: Explicitation de l’objet de la demande
  choice: Rendre explicite la demande de pardon
  alternative: Traduire littéralement « il prie au sujet de ses péchés »
  rationale: Le grec ne nomme pas précisément l’issue sollicitée, mais le contexte de la miséricorde et des péchés implique une demande de pardon. Une note conserve la formulation plus littérale et l’ambiguïté du témoin.
translation_notes:
  register: Français international moderne, sobre et digne. « Son semblable » est idiomatique, inclusif et fidèle à l’idée grecque d’une personne pareille à soi. La question rhétorique et la tension entre absence de pitié et demande de pardon sont préservées.
