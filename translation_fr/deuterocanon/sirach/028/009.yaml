translation:
  language: fr
  text: Car un homme coléreux attise la querelle, un homme pécheur sème le trouble entre amis, et parmi ceux qui font la paix, il lance la calomnie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυμώδης
  choice: coléreux
  rationale: L’adjectif décrit un homme porté à la colère ou au tempérament irascible. « Coléreux » exprime en français naturel une disposition habituelle plutôt qu’une colère ponctuelle.
- source_word: ἐκκαύσει μάχην
  choice: attise la querelle
  rationale: Le verbe évoque l’action d’allumer ou d’aviver un feu. « Attise » conserve cette image, tandis que « la querelle » rend μάχη dans ce contexte de conflit social.
- source_word: ἁμαρτωλός
  choice: pécheur
  rationale: « Pécheur » conserve directement la portée morale et religieuse de ἁμαρτωλός, tout en maintenant le parallélisme avec « homme coléreux ».
- source_word: ταράξει φίλους
  choice: sème le trouble entre amis
  rationale: ταράσσω signifie troubler, agiter ou bouleverser. L’ajout idiomatique de « entre » explicite naturellement en français que les relations amicales sont perturbées, sans imposer qu’il s’agisse seulement d’une émotion individuelle.
- source_word: εἰρηνευόντων
  choice: ceux qui font la paix
  rationale: Le participe peut désigner ceux qui œuvrent à la paix ou vivent en paix. Cette formulation garde la valeur verbale active tout en laissant subsister une part de l’ambiguïté contextuelle.
- source_word: ἐκβάλλει διαβολήν
  choice: il lance la calomnie
  rationale: « Lance » préserve l’image dynamique de ἐκβάλλει, et « calomnie » rend διαβολή comme parole diffamatoire ou accusation malveillante.
- source_word: ἄνθρωπος / ἀνήρ
  choice: un homme / un homme
  rationale: Les deux noms masculins singuliers appartiennent au parallélisme proverbial grec. Leur maintien respecte la forme du texte, avec une portée générale dans ce genre sapientiel.
theological_decisions:
- issue: Masculin représentatif dans une maxime de sagesse
  choice: Conserver « un homme » dans les deux premiers membres
  alternative: Employer « une personne »
  rationale: Le grec emploie successivement ἄνθρωπος et ἀνήρ au masculin singulier dans un parallélisme proverbial. « Un homme » préserve cette forme sans limiter nécessairement la portée de la maxime aux seuls hommes.
- issue: Sens de εἰρηνευόντων
  choice: « ceux qui font la paix »
  alternative: « ceux qui vivent en paix »
  rationale: La forme participiale autorise selon le contexte l’idée d’œuvrer à la paix ou d’être en paix. La traduction retenue suit la valeur active la plus immédiate sans développer une doctrine particulière de la réconciliation.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme ternaire et les images d’incendie, de trouble relationnel et de calomnie sont conservés. Aucun marqueur de note n’est requis puisqu’aucune note n’est proposée.
