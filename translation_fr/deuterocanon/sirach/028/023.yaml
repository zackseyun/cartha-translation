  yaml_path: translation/deuterocanon/sirach/028/023.yaml
  text: Those who forsake the Lord will fall into it[a], and it will burn among them and will certainly not be quenched; it will be sent against them like a lion[c][b], and like a leopard it will ravage them.
translation:
  language: fr
  text: Ceux qui abandonnent le Seigneur y tomberont[a] ; elle s’embrasera au milieu d’eux[b] et ne s’éteindra jamais. Elle sera envoyée contre eux comme un lion et, comme un léopard[c], elle les ravagera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom « y » renvoie à la puissance destructrice décrite dans le contexte précédent, en particulier aux paroles nuisibles de la langue.
    reason: cross_reference
  - marker: b
    text: 'Autre traduction possible : « elle s’embrasera en eux ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « une panthère ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ καταλείποντες Κύριον
  choice: Ceux qui abandonnent le Seigneur
  rationale: καταλείπω exprime ici le fait de délaisser ou d’abandonner. « Abandonnent » est naturel en français moderne et conserve la portée religieuse de l’expression sans ajouter de précision doctrinale.
- source_word: ἐμπεσοῦνται εἰς αὐτήν
  choice: y tomberont
  rationale: Le verbe signifie littéralement « tomber dans ». Le pronom adverbial « y » renvoie naturellement en français à la réalité féminine évoquée dans le contexte précédent, sans la nommer de nouveau ni accentuer artificiellement sa personnification.
- source_word: ἐν αὐτοῖς ἐκκαήσεται
  choice: elle s’embrasera au milieu d’eux
  rationale: ἐκκαίω évoque l’action de s’allumer ou de brûler vivement. « S’embrasera » maintient l’image du feu, tandis que « au milieu d’eux » rend ἐν αὐτοῖς sans imposer une lecture exclusivement intérieure.
- source_word: οὐ μὴ σβεσθῇ
  choice: ne s’éteindra jamais
  rationale: La construction οὐ μή avec le subjonctif exprime une négation fortement appuyée. « Jamais » en restitue l’intensité dans un français naturel.
- source_word: ἐξαποσταλήσεται ἐπʼ αὐτοῖς
  choice: elle sera envoyée contre eux
  rationale: Le futur passif signifie « sera envoyée », et ἐπί prend ici une valeur hostile que rend « contre eux ». Cette formulation reste proche du grec sans introduire l’idée plus interprétative de « déchaîner ».
- source_word: ὡς λέων
  choice: comme un lion
  rationale: Équivalent direct et naturel de la comparaison grecque.
- source_word: ὡς πάρδαλις
  choice: comme un léopard
  rationale: πάρδαλις désigne un grand félin tacheté, couramment rendu par « léopard » ; « panthère » demeure une possibilité lexicale.
- source_word: λυμανεῖται αὐτούς
  choice: elle les ravagera
  rationale: Le verbe exprime une action violente qui ruine ou dévaste. « Ravagera » s’accorde avec l’image des prédateurs sans réduire le sens à une attaque physique précise.
theological_decisions:
- issue: Référent de αὐτήν et du sujet féminin sous-entendu dans la suite du verset
  choice: Employer « y », puis « elle », en laissant le contexte précédent déterminer le référent.
  alternative: Répéter explicitement « la langue » dans le texte principal, ou employer une tournure impersonnelle.
  rationale: Le grec ne répète pas l’antécédent féminin dans ce verset. Le rendre explicite préciserait plus que le texte source ; « y » et « elle » préservent le lien contextuel ainsi que l’ambiguïté réelle de la formulation.
- issue: Portée de ἐν αὐτοῖς
  choice: « au milieu d’eux »
  alternative: « en eux »
  rationale: La préposition peut évoquer soit une présence parmi eux, soit un embrasement intérieur. Le texte principal retient le sens collectif et spatial, tandis que la note conserve l’autre lecture possible.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve les images successives du feu, du lion et du léopard, ainsi que le référent féminin laissé implicite par le grec.
