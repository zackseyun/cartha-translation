translation:
  language: fr
  text: 'Lui-même, qui est de chair, garde rancune[b] : qui fera l’expiation de ses péchés ?[c][a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu conservé de cette ligne est difficile et paraît corrompu ou très elliptique dans la tradition de la Guéniza du Caire. Le grec porte : « Lui-même, étant chair, garde sa colère ; qui fera l’expiation de ses péchés ? » La traduction suit ce sens qui peut être restitué.'
    reason: textual_variant
  - marker: b
    text: 'Ou : « entretient sa colère ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « qui pardonnera ses péchés ? » Le verbe grec exprime plus précisément l’idée de faire l’expiation ou d’effacer les fautes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקַל מֵחָתָן, אֹרֵחַ מַכְנִיס אֹרֵחַ
  choice: sens restitué d’après le parallèle grec
  rationale: Le texte hébreu conservé paraît corrompu ou fortement elliptique et ne donne pas, dans ce contexte, de proposition cohérente. Le parallèle grec complet sert donc ici de témoin principal pour restituer le sens, plutôt que de reproduire littéralement un fragment hébreu inintelligible.
- source_word: αὐτὸς σὰρξ ὢν
  choice: Lui-même, qui est de chair
  rationale: « Lui-même » rend l’insistance de αὐτός. « Qui est de chair » conserve l’image anthropologique concrète de σάρξ et évoque la fragilité mortelle sans lui imposer le sens doctrinal de « nature pécheresse ».
- source_word: διατηρεῖ μῆνιν
  choice: garde rancune
  rationale: L’expression désigne une colère que l’on conserve et nourrit. « Garde rancune » est naturel en français moderne et maintient la valeur durative du grec.
- source_word: τίς ἐξιλάσεται
  choice: qui fera l’expiation
  rationale: Le verbe ἐξιλάσκομαι relève de l’expiation ou de l’effacement des fautes, et pas seulement du pardon interpersonnel. La formulation préserve ce registre théologique sans préciser indûment qui accomplirait l’expiation.
- source_word: τὰς ἁμαρτίας αὐτοῦ
  choice: de ses péchés
  rationale: « Péchés » est l’équivalent courant de ἁμαρτίαι. Avec « faire l’expiation », la construction « de ses péchés » est idiomatique en français.
theological_decisions:
- issue: Portée anthropologique de σάρξ dans un texte de sagesse
  choice: qui est de chair
  alternative: qui est mortel
  rationale: Dans ce contexte, σάρξ souligne la condition humaine fragile et mortelle. La traduction conserve l’image biblique de la chair sans en faire un terme technique désignant une « nature pécheresse ».
- issue: Valeur de ἐξιλάσεται
  choice: fera l’expiation
  alternative: pardonnera
  rationale: Le grec porte plus précisément l’idée d’expiation, mais la question laisse ouverte l’identité de celui qui pourrait l’accomplir. La traduction ne résout pas cette tension théologique.
- issue: Rapport entre le témoin hébreu difficile et le parallèle grec
  choice: traduire le sens recouvrable du grec en signalant l’état du texte hébreu
  alternative: 'traduire littéralement le fragment hébreu : « Et indulgent envers un gendre ; un hôte fait entrer un hôte »'
  rationale: La lecture hébraïque transmise est incohérente avec le contexte et paraît textuellement altérée. Le grec fournit une ligne complète et cohérente, mais la note informe clairement le lecteur de la situation documentaire.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation garde l’image biblique de la chair et le registre théologique de l’expiation, tandis que les notes exposent sans la masquer l’incertitude du témoin hébreu.
