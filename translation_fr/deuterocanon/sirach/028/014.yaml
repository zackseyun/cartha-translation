  text: A third tongue has shaken many and scattered them from nation to nation,[a]
translation:
  language: fr
  text: Une troisième langue a ébranlé beaucoup de gens et les a dispersés de nation en nation.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une langue calomnieuse », « une langue double » ou, plus généralement, « des paroles qui divisent ». Le grec dit littéralement « une troisième langue » ; cette expression est conservée telle quelle dans le texte.
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσα τρίτη
  choice: une troisième langue
  rationale: Le grec dit littéralement « une troisième langue ». Cette formulation inhabituelle, probablement proverbiale, est conservée afin de préserver l’image et son ambiguïté plutôt que de la réduire à une interprétation.
- source_word: ἐσάλευσεν
  choice: a ébranlé
  rationale: Le verbe signifie secouer, agiter ou déstabiliser. « A ébranlé » conserve la métaphore concrète tout en exprimant naturellement les graves effets humains et sociaux évoqués.
- source_word: πολλοὺς
  choice: beaucoup
  rationale: Le substantif adjectival désigne de nombreuses personnes. En français, « en a ébranlé beaucoup » rend clairement cette valeur sans ajouter un nom absent du grec.
- source_word: διέστησεν
  choice: a dispersés
  rationale: Le verbe peut signifier séparer, éloigner ou diviser. Avec « de nation en nation », « a dispersés » exprime le déplacement et la fragmentation qui en résultent.
- source_word: ἀπὸ ἔθνους εἰς ἔθνος
  choice: de nation en nation
  rationale: Cette tournure naturelle garde la répétition de ἔθνος et exprime le passage ou la dispersion d’une nation à une autre.
theological_decisions:
- issue: Interprétation de l’expression γλῶσσα τρίτη
  choice: Conserver « une troisième langue » dans le texte principal.
  alternative: « une langue calomnieuse », « une langue double » ou, plus généralement, « des paroles qui divisent »
  rationale: Le témoin grec fourni porte littéralement « une troisième langue ». La traduction préserve cette expression énigmatique et place les principales interprétations en note, sans imposer une lecture particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La structure reste proche du grec, tandis que « en a ébranlé beaucoup » évite une formulation artificielle. Le marqueur [a] figure bien dans le texte principal.
