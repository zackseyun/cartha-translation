  text: It will never overpower the godly[a], and they will not be burned in its flame.
translation:
  language: fr
  text: Elle ne dominera jamais ceux qui révèrent Dieu[a], et ils ne seront pas brûlés dans sa flamme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Elle ne s’emparera jamais des personnes pieuses ». Le verbe grec peut exprimer l’idée de saisir, de maîtriser ou de l’emporter sur quelqu’un.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ
  choice: ne… jamais
  rationale: La négation emphatique οὐ μή avec le subjonctif aoriste exprime une forte négation portant sur l’avenir; « ne… jamais » la rend naturellement en français.
- source_word: κρατήσῃ
  choice: dominera
  rationale: κρατέω peut signifier saisir, maîtriser ou l’emporter sur. « Dominera » exprime ici la prise de pouvoir hostile sans réduire le sens à une saisie physique.
- source_word: εὐσεβῶν
  choice: ceux qui révèrent Dieu
  rationale: εὐσεβής désigne les personnes caractérisées par leur révérence religieuse. Cette formulation est claire, actuelle et évite les connotations parfois étroites de « pieux ».
- source_word: φλογὶ
  choice: flamme
  rationale: φλόξ désigne précisément une flamme et maintient l’image vive du feu.
- source_word: καήσονται
  choice: seront brûlés
  rationale: Le futur passif indique que ces personnes subissent l’action de brûler; la traduction n’ajoute pas l’idée plus forte d’une destruction complète.
theological_decisions:
- issue: Référent du pronom féminin αὐτῆς
  choice: « sa », renvoyant à la langue évoquée dans le contexte
  alternative: Comprendre le pronom comme renvoyant plus largement à sa puissance destructrice figurée par le feu
  rationale: Le grec conserve un référent féminin et une certaine personnification. Le possessif français « sa » préserve cette continuité et reste compatible avec l’image de la langue comme feu.
translation_notes:
  register: Français international moderne, digne et accessible. La structure parallèle du grec est conservée, ainsi que l’imagerie de la domination et de la flamme. Le féminin « elle » suppose le renvoi contextuel à la langue, tandis que la note maintient l’étendue sémantique de κρατέω.
