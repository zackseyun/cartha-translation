review_pass:
  verdict: revise
  source_fidelity: 'Le texte principal suit explicitement et fidèlement le grec parallèle : « Maudissez » rend καταράσθε, « celui qui chuchote » rend Ψίθυρον, « la personne à la langue double » rend δίγλωσσον, et la finale rend correctement πολλοὺς γὰρ εἰρηνεύοντας ἀπώλεσαν. La note signale à juste titre la divergence marquée de l’hébreu conservé. Toutefois, « tous deux » dans la note est plus exact que « tous les deux », et l’antécédent féminin de « elle s’éteindra » demeure opaque hors contexte : il convient d’indiquer qu’il s’agit vraisemblablement d’une étincelle/du feu évoqué au verset précédent, sans présenter cette reconstruction comme certaine.'
  naturalness: « L’homme à la langue double » est intelligible, mais légèrement calqué et genré sans nécessité. « La personne à la langue double » est plus naturel en français international moderne tout en préservant la métaphore. « Celui qui chuchote » est compréhensible, mais peut évoquer un simple faible volume de voix ; le contexte de propos malveillants est utile dans la note, sans devoir surinterpréter le texte principal.
  terminology: « Maudissez » est le rendu direct approprié de l’impératif grec. « Langue double » conserve l’image de δίγλωσσος et évite de réduire le terme à « hypocrite » ou « personne à deux visages ». Le terme « chuchote » reste volontairement proche de Ψίθυρος. La note doit distinguer clairement la leçon hébraïque difficile de la leçon grecque suivie dans le texte.
  issues:
  - severity: low
    issue: 'Expression genrée et un peu calquée : « l’homme à la langue double »'
    rationale: Le grec désigne une personne, non spécifiquement un homme. « La personne à la langue double » maintient la métaphore, le sens et un registre naturel.
  - severity: low
    issue: La note ne précise pas l’antécédent probable de « elle » dans la leçon hébraïque
    rationale: Le féminin est grammaticalement fidèle, mais obscur en français isolé. Une brève précision indiquant l’image probable de l’étincelle ou du feu du verset précédent aide le lecteur sans prétendre résoudre un texte difficile.
  - severity: low
    issue: « tous deux » est préférable à « tous les deux » dans la citation de la leçon hébraïque
    rationale: La formulation plus littérale et sobre reflète mieux la note textuelle et correspond à la traduction anglaise d’audit.
