  text: Curse the whisperer and the double-tongued[a], for they have destroyed many who were at peace.
translation:
  language: fr
  text: Maudissez celui qui chuchote et la personne à la langue double[a], car ils ont fait périr beaucoup de gens qui vivaient en paix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu conservé présente ici une leçon très différente et difficile : « Crache dessus, et elle s’éteindra », probablement dans l’image d’une étincelle ou d’un feu évoquée au verset précédent ; puis, entre crochets : « tous deux viennent de ta bouche ». Le texte principal suit le grec, qui forme dans ce contexte un avertissement cohérent contre les paroles malveillantes et trompeuses.'
    reason: alternative_reading
lexical_decisions:
- source_word: רָקַק בָּהּ וְכָבְתָה
  choice: '[lecture hébraïque en note : « Crache dessus, et elle s’éteindra »]'
  rationale: L’hébreu conservé décrit littéralement l’extinction de quelque chose par un crachat et semble prolonger l’image du feu du verset précédent. Comme cette forme diverge fortement du grec, elle est signalée sans être harmonisée.
- source_word: Ψίθυρον
  choice: celui qui chuchote
  rationale: Le grec désigne ici une personne qui répand secrètement des propos malveillants. Cette formulation garde l’image du chuchotement sans imposer le terme plus interprétatif « calomniateur ».
- source_word: δίγλωσσον
  choice: l’homme à la langue double
  rationale: Cette expression conserve la métaphore grecque de la parole duplicite tout en restant compréhensible en français moderne.
- source_word: εἰρηνεύοντας
  choice: qui vivaient en paix
  rationale: Le participe grec décrit des personnes vivant dans un état de paix; cette tournure naturelle en français en préserve la valeur verbale.
theological_decisions:
- issue: Divergence entre l’hébreu conservé et le parallèle grec
  choice: Le texte principal suit la leçon grecque, cohérente dans son avertissement contre la parole destructrice, tandis que la leçon hébraïque est donnée en note.
  alternative: « Crache dessus, et elle s’éteindra; tous deux viennent de ta bouche. »
  rationale: L’hébreu est ici difficile, partiellement placé entre crochets dans l’édition, et paraît prolonger une image du verset précédent; le grec transmet une maxime complète mais nettement différente. La note préserve cette divergence textuelle réelle au lieu de la dissimuler.
translation_notes:
  register: Français international moderne, digne et accessible. « Maudissez » rend l’impératif grec; « celui qui chuchote » évite l’archaïsme tout en conservant l’image; « l’homme à la langue double » maintient la métaphore de la duplicité.
