  text: Many have fallen by the mouth of the sword[a], but not as those who have fallen because of the tongue.
translation:
  language: fr
  text: Beaucoup sont tombés sous le tranchant de l’épée, mais ils ne sont pas aussi nombreux que ceux qui sont tombés à cause de la langue.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « dans la bouche de l’épée ». La tournure « mais non comme » peut aussi être comprise plus littéralement comme une comparaison de manière ; le contexte suggère toutefois une comparaison du nombre des victimes.
    reason: Signaler à la fois l’idiome concret du grec et l’ambiguïté réelle de la comparaison elliptique.
lexical_decisions:
- source_word: πολλοὶ
  choice: Beaucoup
  rationale: Rend directement l’adjectif quantitatif substantivé dans un français naturel et proverbial.
- source_word: ἔπεσαν
  choice: sont tombés
  rationale: Conserve l’image répétée de la chute et rend simplement l’aoriste grec.
- source_word: ἐν στόματι μαχαίρας
  choice: sous le tranchant de l’épée
  rationale: « Tranchant de l’épée » est l’équivalent idiomatique français de l’expression grecque littérale « bouche de l’épée »; « sous » convient naturellement à la formule française.
- source_word: καὶ οὐχ ὡς
  choice: mais moins nombreux que
  rationale: Dans ce parallélisme, la tournure elliptique compare le nombre des victimes; cette formulation explicite sobrement le sens sans modifier la pointe du proverbe.
- source_word: οἱ πεπτωκότες
  choice: ceux qui sont tombés
  rationale: Le participe parfait désigne ceux qui se trouvent au nombre des victimes; la répétition de « tombés » préserve le parallélisme.
- source_word: διὰ γλῶσσαν
  choice: à cause de la langue
  rationale: διά avec l’accusatif exprime ici la cause; « langue » maintient l’image concrète de la parole destructrice.
theological_decisions:
- issue: Comparaison entre les victimes de l’épée et celles de la langue
  choice: 'Comprendre οὐχ ὡς comme une comparaison quantitative elliptique: « moins nombreux que ».'
  alternative: « mais non comme ceux qui sont tombés à cause de la langue », comparaison de manière laissée plus littérale et ambiguë.
  rationale: Le contexte sapiential et πολλοὶ appellent naturellement une comparaison numérique, mais le grec demeure elliptique; la note signale cette ambiguïté plutôt que de la dissimuler.
- issue: Jeu d’images entre la bouche de l’épée et la langue
  choice: Employer l’idiome français « tranchant de l’épée » dans le texte et conserver « langue ».
  alternative: Traduire littéralement « bouche de l’épée » afin de renforcer le rapprochement bouche/langue.
  rationale: En français moderne, « bouche de l’épée » est opaque et risque d’être comprise comme une partie technique inexistante. La note conserve toutefois l’image exacte du grec et sa possible fonction rhétorique.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Beaucoup » évite l’alourdissement de « beaucoup de gens ». Le texte privilégie l’intelligibilité tout en documentant dans la note l’image littérale et l’ambiguïté syntaxique.
