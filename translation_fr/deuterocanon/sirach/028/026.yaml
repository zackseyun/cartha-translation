  text: Prends garde à ne pas glisser par elle, de peur de tomber devant celui qui te guette.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρόσεχε
  choice: Veille
  rationale: Impératif naturel qui exprime l’attention vigilante demandée.
- source_word: μὴ πῶς ὀλισθήσῃς ἐν αὐτῇ
  choice: à ne pas glisser à cause d’elle
  rationale: Le contexte immédiat renvoie à la langue; ἐν αὐτῇ peut littéralement signifier «en elle», mais en français cette formulation serait obscure. «À cause d’elle» conserve l’idée qu’elle occasionne la chute sans reprendre l’anglais révisé de manière mécanique.
- source_word: μὴ πέσῃς
  choice: de peur de tomber
  rationale: Rend clairement le second avertissement négatif coordonné au premier.
- source_word: κατέναντι ἐνεδρεύοντος
  choice: devant celui qui te guette
  rationale: ἐνεδρεύοντος désigne une personne en embuscade ou à l’affût; «qui te guette» est idiomatique et conserve la menace implicite.
