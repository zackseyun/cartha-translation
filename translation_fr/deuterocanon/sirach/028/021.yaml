  text: Its death is an evil death[b][a], and its Hades is more advantageous.
translation:
  language: fr
  text: Sa mort est une mort funeste, et son séjour des morts est plus avantageux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et son Hadès est plus avantageux ». Le grec emploie un possessif féminin, qui renvoie à un antécédent féminin dans le contexte précédent ; la relation précise ainsi exprimée demeure inhabituelle. « Séjour des morts » traduit ici Hadès, sans désigner nécessairement l’enfer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θάνατος
  choice: mort
  rationale: Le nom est répété dans le grec; sa répétition est conservée afin de maintenir le parallélisme frappant.
- source_word: πονηρός
  choice: funeste
  rationale: Dans ce contexte, l’adjectif qualifie la mort comme désastreuse et terrible. « Funeste » exprime cette force sans imposer exclusivement une nuance morale.
- source_word: αὐτῆς
  choice: sa / son
  rationale: Le pronom féminin renvoie à un antécédent féminin du contexte précédent, vraisemblablement la langue; le français exige un possessif accordé avec le nom possédé, d’où « sa mort » et « son séjour ».
- source_word: λυσιτελής
  choice: préférable
  rationale: Avec μᾶλλον, le mot indique ici qu’un sort est plus avantageux que l’autre. « Préférable » rend naturellement la comparaison implicite en français.
- source_word: μᾶλλον
  choice: préférable
  rationale: La valeur comparative de μᾶλλον est intégrée à l’adjectif français « préférable ».
- source_word: ᾅδης
  choice: séjour des morts
  rationale: Cette expression française transparente désigne le monde des morts sans le réduire à la tombe physique ni l’assimiler à l’enfer au sens doctrinal ultérieur.
theological_decisions:
- issue: Traduction de ᾅδης
  choice: séjour des morts
  alternative: Hadès
  rationale: « Séjour des morts » communique clairement le référent grec au lectorat moderne et évite d’importer la notion ultérieure d’enfer; « Hadès » demeure une traduction plus formelle possible.
- issue: Rapport exprimé par αὐτῆς dans la seconde proposition
  choice: son séjour des morts
  alternative: le séjour des morts est préférable à elle
  rationale: La construction possessive reproduit formellement le grec et préserve son étrangeté ainsi que son ambiguïté. L’autre lecture explicite davantage la comparaison, mais ajoute un complément comparatif qui n’est pas exprimé directement.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve la répétition de « mort » et l’étrange possessif de la seconde proposition plutôt que de résoudre silencieusement la tension du grec.
