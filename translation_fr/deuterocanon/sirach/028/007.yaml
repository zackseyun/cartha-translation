  text: Remember the commandments[a], and do not be angry with your neighbor; remember the covenant of the Most High, and overlook ignorance.
translation:
  language: fr
  text: Souviens-toi des commandements et ne te mets pas en colère contre ton prochain ; souviens-toi de l’alliance du Très-Haut et passe outre à l’ignorance.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « passe par-dessus l’ignorance » ; dans ce contexte, il peut s’agir de ne pas tenir rigueur d’une faute commise par ignorance.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητι
  choice: Souviens-toi
  rationale: L’impératif aoriste appelle à se rappeler activement. « Souviens-toi » est direct, naturel et digne ; le verbe est répété dans la seconde proposition pour rendre en français l’ellipse grecque.
- source_word: ἐντολῶν
  choice: des commandements
  rationale: Le génitif pluriel dépend de μνήσθητι. « Commandements » conserve la portée morale et religieuse du terme sans ajouter un complément absent du grec.
- source_word: μὴ μηνίσῃς
  choice: ne garde pas de colère
  rationale: Le verbe μηνίω désigne une colère persistante ou du ressentiment. Cette formulation française exprime mieux la durée suggérée qu’un simple « ne te mets pas en colère », tout en évitant une intensification comme « fureur ».
- source_word: τῷ πλησίον
  choice: contre ton prochain
  rationale: Dans ce contexte éthique, πλησίον signifie « prochain ». La préposition « contre » s’accorde naturellement avec l’expression « garder de la colère ».
- source_word: διαθήκην Ὑψίστου
  choice: l’alliance du Très-Haut
  rationale: διαθήκη est le terme biblique usuel pour « alliance ». Le génitif est conservé par « du Très-Haut », sans préciser s’il s’agit d’une alliance établie par lui ou avec lui.
- source_word: πάριδε
  choice: passe sur
  rationale: L’impératif signifie passer outre, ne pas tenir compte ou fermer les yeux sur quelque chose. « Passe sur » préserve l’image et l’ambiguïté du grec, précisées en note.
- source_word: ἄγνοιαν
  choice: l’ignorance
  rationale: Le substantif signifie littéralement « ignorance » ou « absence de connaissance ». Le texte principal reste formellement proche du grec, sans transformer explicitement le terme en faute involontaire.
theological_decisions:
- issue: Ellipse du verbe devant « l’alliance du Très-Haut »
  choice: Répéter « souviens-toi »
  alternative: Laisser le groupe nominal sans verbe explicite
  rationale: La répétition clarifie la syntaxe française tout en présentant les commandements et l’alliance comme les deux objets de l’exhortation initiale.
- issue: Portée de ἄγνοιαν
  choice: Conserver « l’ignorance » dans le texte et signaler en note l’application possible à une faute commise par ignorance
  alternative: Traduire directement « une faute involontaire »
  rationale: Le grec nomme l’ignorance elle-même. Une traduction interprétative résoudrait trop vite la tension entre l’état d’ignorance et l’offense qui peut en découler.
translation_notes:
  register: Français international moderne, sobre et sapientiel. « Prochain », « alliance » et « Très-Haut » conservent le registre biblique courant. Le parallélisme des deux impératifs « souviens-toi » est rendu explicitement pour assurer une lecture fluide.
