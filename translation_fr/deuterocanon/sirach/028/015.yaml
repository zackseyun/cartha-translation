  text: A third tongue has driven out strong women[a], and has deprived them of the fruit of their labor;
translation:
  language: fr
  text: Une troisième langue[a] a chassé des femmes courageuses et les a privées du fruit de leur travail.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « une troisième langue ». L’expression peut désigner une langue qui divise ou qui calomnie : la parole d’un tiers venant s’interposer entre des personnes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσα τρίτη
  choice: une langue tierce
  rationale: Rend littéralement l’expression grecque inhabituelle « troisième langue » tout en employant en français la tournure plus naturelle « langue tierce ». Dans le contexte, elle évoque vraisemblablement la parole d’un tiers qui s’interpose, divise ou calomnie; la note conserve ces possibilités sans en imposer une seule.
- source_word: γυναῖκας ἀνδρείας
  choice: des femmes courageuses
  rationale: ἀνδρείας qualifie ici des femmes fortes, vaillantes ou courageuses. « Courageuses » est naturel, digne et évite de réduire le terme à la seule force physique.
- source_word: ἐξέβαλεν
  choice: a chassé
  rationale: Le verbe signifie faire sortir, expulser ou chasser. « A chassé » conserve sa force et convient à l’effet social destructeur décrit.
- source_word: ἐστέρεσεν
  choice: a privées
  rationale: Le verbe exprime le fait de priver quelqu’un de quelque chose. Cette traduction reste proche du grec sans préciser indûment le moyen de la perte.
- source_word: τῶν πόνων αὐτῶν
  choice: du fruit de leur travail
  rationale: Littéralement « de leurs peines/travaux ». Dans cette construction, le sens vise vraisemblablement ce que leur labeur leur avait procuré; « le fruit de leur travail » l’exprime clairement en français, tout en restant proche de l’idée contextuelle.
