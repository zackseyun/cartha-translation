  text: Une querelle précipitée attise le feu, et un combat précipité fait couler le sang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρις
  choice: querelle
  rationale: Désigne ici une dispute ou un conflit; « querelle » convient au parallélisme avec le combat qui suit.
- source_word: κατασπευδομένη / κατασπεύδουσα
  choice: précipitée / précipité
  rationale: Le participe exprime ce que l’on provoque ou pousse avec empressement et précipitation. La répétition française préserve le parallélisme grec.
- source_word: ἐκκαίει πῦρ
  choice: attise le feu
  rationale: Expression française naturelle qui conserve l’image d’un feu rendu ardent, avec la nuance causative du verbe grec.
- source_word: μάχη
  choice: combat
  rationale: Terme assez large pour une lutte violente, sans préciser indûment s’il s’agit d’une rixe privée ou d’un affrontement collectif.
- source_word: ἐκχέει αἷμα
  choice: fait couler le sang
  rationale: Équivalent idiomatique et fidèle de l’image grecque « répand le sang ».
