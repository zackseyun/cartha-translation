  text: Is there not grief that reaches to death[a], when a companion as your own soul turns into an enemy?
translation:
  language: fr
  text: N’est-ce pas un chagrin qui va jusqu’à la mort, lorsqu’un compagnon qui t’est aussi cher que toi-même devient un ennemi ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הלא
  choice: N’est-ce pas
  rationale: Introduit une question rhétorique appelant une réponse affirmative, conformément au grec οὐχί.
- source_word: דין
  choice: un chagrin
  rationale: Dans ce contexte, le mot désigne une détresse affective, sens confirmé par le grec λύπη, et non un jugement juridique.
- source_word: מגיע אל מות
  choice: qui mène jusqu’à la mort
  rationale: Conserve l’idée hébraïque d’une douleur dont la portée va jusqu’à la mort, tout en restant idiomatique en français.
- source_word: רע
  choice: un compagnon
  rationale: Désigne ici une personne unie par une relation étroite; « compagnon » préserve ce sens sans surtraduire par « ami ».
- source_word: כנפשך
  choice: qui est comme ta propre vie
  rationale: Rend l’image hébraïque de la נפש au plus près dans un français intelligible; il s’agit d’une personne aussi chère que sa propre vie.
- source_word: נהפך לצר
  choice: devient un ennemi
  rationale: Exprime clairement le renversement de la relation et l’hostilité personnelle portée par צר.
