review_pass:
  verdict: revise
  source_fidelity: La question rhétorique, le chagrin et le renversement du compagnon en ennemi sont bien rendus. Toutefois, « qui mène jusqu’à la mort » suggère plus facilement en français une causalité (« qui conduit à la mort »), alors que מגיע אל מות exprime la portée extrême du chagrin. « Qui va jusqu’à la mort » conserve mieux cette étendue. « Ta propre vie » est possible pour נפש, mais l’idiome relationnel appelle une formulation française qui exprime l’intimité sans donner l’impression que le compagnon est assimilé à la vie physique du destinataire.
  naturalness: La formulation révisée est directe et naturelle en français international moderne. « Un compagnon qui t’est aussi cher que toi-même » explicite idiomatiquement la valeur de רע כנפשך tout en gardant « compagnon » pour רע.
  terminology: « Chagrin », « compagnon » et « ennemi » conviennent au registre sapientiel et aux termes hébreux dans leur contexte. La révision ne substitue pas la double désignation grecque « compagnon et ami » au texte hébreu retenu.
  issues:
  - severity: medium
    issue: « qui mène jusqu’à la mort » peut introduire une nuance causale.
    rationale: Le texte source décrit un chagrin qui atteint ou s’étend jusqu’à la mort; il n’affirme pas nécessairement que ce chagrin cause la mort.
  - severity: low
    issue: « comme ta propre vie » est peu idiomatique et peut concrétiser excessivement נפש.
    rationale: Dans cette construction, נפש exprime l’intimité et le prix d’une relation (« comme toi-même »). Une formulation relationnelle française rend mieux l’image sans en réduire le sens à la vie biologique.
