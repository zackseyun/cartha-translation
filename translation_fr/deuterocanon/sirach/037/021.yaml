  text: And with all these things[a], pray earnestly to God, who will truly direct your steps.
translation:
  language: fr
  text: Et avec tout cela[a], supplie Dieu avec ferveur, lui qui affermira vraiment tes pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin grec porte : « Car la grâce ne lui a pas été donnée par le Seigneur, parce qu’il a été privé de toute sagesse. » L’hébreu et le grec diffèrent considérablement ici ; le texte principal suit le témoin hébreu conservé.'
    reason: textual_variant
lexical_decisions:
- source_word: ועם כל אלה
  choice: Et avec tout cela
  rationale: La formulation conserve la valeur additive et le lien avec les conseils précédents, tout en restant naturelle en français.
- source_word: עתר
  choice: supplie avec ferveur
  rationale: Le verbe exprime une prière insistante, plus forte qu’un simple « prie ».
- source_word: אל אל
  choice: Dieu
  rationale: Le premier אל est la préposition « vers/à » et le second le titre divin ; « supplie Dieu » rend naturellement la construction sans suggérer un double nom.
- source_word: אשר
  choice: lui qui
  rationale: Cette tournure rattache clairement la proposition relative à Dieu dans un français fluide.
- source_word: יכין
  choice: affermira
  rationale: Le verbe signifie établir, rendre ferme ou préparer. Avec « tes pas », « affermira » préserve mieux l’image et la nuance hébraïque qu’une simple idée de direction.
- source_word: באמת
  choice: vraiment
  rationale: L’adverbe garde l’ambiguïté entre vérité, réalité et fiabilité sans imposer exclusivement la nuance de fidélité.
- source_word: צעדיך
  choice: tes pas
  rationale: La traduction littérale est idiomatique en français et conserve la métaphore du cheminement de vie.
theological_decisions:
- issue: Relation entre les témoins hébreu et grec
  choice: Le texte principal traduit l’exhortation hébraïque à supplier Dieu, qui affermira les pas.
  alternative: 'Le témoin grec porte : « Car la grâce ne lui a pas été donnée par le Seigneur, parce qu’il a été privé de toute sagesse. »'
  rationale: Lorsque le texte hébreu du Siracide est conservé avec une forte confiance, il sert de texte principal. La leçon grecque est ici substantiellement différente et doit être signalée plutôt qu’harmonisée ou substituée silencieusement.
- issue: Sens de יכין appliqué aux pas
  choice: affermira
  alternative: dirigera
  rationale: « Affermir les pas » conserve la portée fondamentale du verbe — établir ou rendre ferme — ainsi que la tension possible entre stabilité et conduite, sans réduire le sens à la seule orientation.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier correspond au suffixe hébreu de deuxième personne. « Supplie Dieu avec ferveur » exprime l’intensité de עתר ; « affermira vraiment tes pas » maintient la métaphore et la nuance proprement hébraïque.
