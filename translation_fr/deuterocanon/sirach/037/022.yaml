  text: The beginning of every deed is a word[c][b][a], and the beginning of every work is a thought.
translation:
  language: fr
  text: Le commencement de toute action est une parole[b], et le commencement de toute œuvre est une pensée[c].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin grec présente ici une autre sentence : « Il y a quelqu’un qui est sage pour lui-même, et les fruits de son intelligence sont dignes de foi dans sa bouche. »'
    reason: alternative_reading
  - marker: b
    text: Ou « une chose » ou « une affaire »; le mot hébreu dabar peut aussi avoir ces sens.
    reason: lexical_alternative
  - marker: c
    text: Ou « un projet ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ראש
  choice: le commencement de
  rationale: Dans cette maxime, ראש désigne ce qui vient en premier ou se trouve à l’origine. « Le commencement de » est naturel en français et maintient le parallélisme des deux membres.
- source_word: כל
  choice: toute
  rationale: Le singulier distributif « toute » exprime la portée générale de la maxime dans les deux membres.
- source_word: מעשה
  choice: action
  rationale: « Action » rend naturellement l’acte accompli tout en restant distinct de פועל, traduit par « œuvre ».
- source_word: דבר
  choice: une parole
  rationale: דבר peut signifier « parole », mais aussi « chose » ou « affaire ». « Une parole » convient bien au rapport entre expression, action et pensée, sans effacer l’autre possibilité, signalée en note.
- source_word: פועל
  choice: œuvre
  rationale: « Œuvre » désigne ici ce qui est réalisé et préserve une légère distinction avec מעשה, « action ».
- source_word: היא
  choice: est
  rationale: Le pronom féminin sert ici de copule et se rend clairement par « est ».
- source_word: מחשבת
  choice: une pensée
  rationale: מחשבת peut désigner une pensée, une intention ou un projet. « Une pensée » conserve le sens le plus large; « un projet » reste une possibilité lexicale indiquée en note.
theological_decisions:
- issue: Divergence entre le texte hébreu conservé et le parallèle grec
  choice: Suivre le texte hébreu dans le corps du verset et signaler en note la sentence grecque sensiblement différente.
  alternative: 'Suivre le grec : « Il y a quelqu’un qui est sage pour lui-même, et les fruits de son intelligence sont dignes de foi dans sa bouche. »'
  rationale: Puisque l’hébreu est ici conservé avec une confiance élevée, il constitue le texte principal. Le grec ne représente pas une simple variante de formulation, mais une autre sentence; les deux témoins ne doivent donc pas être harmonisés silencieusement.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme hébreu est conservé par la répétition de « Le commencement de toute… est une… », tandis que « action » et « œuvre » maintiennent la nuance entre les deux quasi-synonymes hébreux.
