  source_fidelity: La formulation « à son propre intérêt » ne rend pas le texte hébreu transmis, qui porte לנפשך (« à propos de ta vie / de ta personne », avec un suffixe de deuxième personne). Même si le grec parallèle et le contexte suggèrent une intention hostile ou intéressée, le texte français ne devrait pas transformer cette difficulté en une affirmation non ambiguë d’intérêt personnel. « Réfléchira à ton sujet » conserve plus fidèlement la référence au destinataire tout en restant idiomatique.
  naturalness: La phrase révisée est naturelle en français international moderne. « Pourquoi cela lui tomberait-il ? » préserve l’image de « tomber sur / échoir à » sans restreindre le sens à l’attribution d’un avantage, comme le fait « lui reviendrait-il ».
  terminology: Aucun terme théologique n’est en jeu. Le grec parallèle doit rester présenté comme un parallèle interprétatif et non comme une restitution certaine de l’hébreu. Les notes révisées signalent explicitement la difficulté de לנפשך et l’ambiguïté référentielle du pronom final.
