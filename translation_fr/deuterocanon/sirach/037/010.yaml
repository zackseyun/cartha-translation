translation:
  language: fr
  text: 'Car lui aussi réfléchira à ton sujet : « Pourquoi cela lui tomberait-il ? »[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est concis et quelque peu difficile. Le parallèle grec dit : « Ne consulte pas celui qui te regarde de travers, et cache ton projet à ceux qui sont jaloux de toi. » Il suggère que la réflexion de cette personne est hostile ou intéressée, sans lever toutes les difficultés du texte hébreu.'
    reason: alternative_reading
  - marker: b
    text: 'Ou, plus littéralement : « Car lui aussi réfléchira pour ta vie / ta personne : “Pourquoi cela lui tomberait-il ?” » L’expression hébraïque est incertaine dans ce contexte. Le dernier pronom peut désigner le conseiller ou une autre personne, et ce qui « tombe » peut lui échoir ou lui arriver.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כי
  choice: Car
  rationale: Introduit la raison qui motive l’avertissement donné dans le contexte et convient au style bref de la littérature de sagesse.
- source_word: גם הוא
  choice: lui aussi
  rationale: Conserve la valeur additive de l’hébreu et désigne naturellement l’autre personne.
- source_word: לנפשך
  choice: à son propre intérêt
  rationale: Le texte hébreu transmis signifie littéralement « pour ta vie / ton être » et reste difficile. Le contexte ainsi que le parallèle grec suggèrent toutefois le calcul intéressé ou malveillant du conseiller. Cette formulation exprime ce sens probable sans l’alourdir.
- source_word: יחשב
  choice: pensera
  rationale: Rend simplement l’idée de réfléchir, considérer ou calculer; le contexte fait ressortir le caractère intéressé de cette réflexion.
- source_word: למה זה
  choice: Pourquoi cela
  rationale: Restitue naturellement la tournure interrogative et son caractère rhétorique.
- source_word: אליו יפול
  choice: lui reviendrait-il
  rationale: Le verbe évoque littéralement ce qui « tombe » sur quelqu’un ou lui échoit. « Revenir à » convient à l’idée d’un lot ou d’un avantage tout en laissant une part d’ouverture au sens.
