  text: A friend fights with a stranger over a good thing[b][a], and against cities he will take up a shield.
translation:
  language: fr
  text: Celui qui aime le bien combat contre un étranger[b][a], et face à des villes, il prendra un bouclier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Un compagnon partage la peine d’un ami à cause du ventre, et face à la guerre il prendra un bouclier. » Le grec diffère sensiblement de l’hébreu dans la première proposition ainsi que par « guerre » au lieu de « villes ». Le texte principal suit le témoin hébreu conservé.'
    reason: alternative_reading
  - marker: b
    text: Le mot hébreu traduit par « bien » peut aussi signifier « bénéfice » ou « avantage ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אוהב
  choice: un ami
  rationale: Le participe signifie littéralement « celui qui aime », mais employé comme substantif dans ce contexte sapiential, il désigne naturellement un ami ou un compagnon. Le parallèle grec confirme le champ de l’amitié.
- source_word: טוב
  choice: un bien
  rationale: 'Le terme hébreu reste général : il peut désigner ce qui est bon, un bien, un bénéfice ou un avantage. « Un bien » conserve cette brièveté et cette ouverture sémantique.'
- source_word: נלחם עם זר
  choice: se bat contre un étranger
  rationale: עם peut exprimer l’association ou, avec un verbe de combat, la personne affrontée. En français actuel, « se battre contre » rend clairement le sens conflictuel sans donner à זר une portée ethnique indue.
- source_word: זר
  choice: un étranger
  rationale: Le mot désigne quelqu’un d’extérieur au cercle concerné. « Étranger » maintient cette ampleur, tandis que « ressortissant étranger » ou une formulation analogue surdéterminerait le sens.
- source_word: נגד ערים
  choice: face à des villes
  rationale: L’hébreu dit littéralement « devant, en face de, contre des villes » et demeure difficile. « Face à » préserve à la fois la valeur spatiale et l’idée de confrontation, sans corriger silencieusement « villes » d’après le grec « guerre ».
- source_word: יחזיק צנה
  choice: il saisira un bouclier
  rationale: Le verbe signifie tenir fermement ou saisir. Dans cette image militaire, « saisir un bouclier » est naturel et reste proche de l’expression hébraïque.
- source_word: צנה
  choice: bouclier
  rationale: צנה désigne un bouclier, souvent de grande taille. Le terme français général est clair et évite une précision inutile dans le corps du texte.
