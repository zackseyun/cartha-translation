translation:
  language: fr
  text: Il y a un homme sage qui est sage pour beaucoup[b], mais qui, pour lui-même, est sans valeur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu גוֹאָל est difficile. Il peut évoquer ce qui est souillé, entaché ou, dans ce contexte, sans valeur pour soi-même.
    reason: lexical_alternative
  - marker: b
    text: 'La tradition grecque donne ici une sentence différente : « La vie d’un homme se compte en jours, mais les jours d’Israël sont innombrables. » Les textes hébreu et grec ne concordent donc pas étroitement à cet endroit.'
    reason: textual_variant
lexical_decisions:
- source_word: יֵשׁ
  choice: Il y a
  rationale: La particule existentielle introduit une observation générale; « Il y a » est naturel en français moderne.
- source_word: חָכָם
  choice: un homme sage
  rationale: Le nom hébreu est au masculin singulier et présente ici un type représentatif; cette formulation conserve cette donnée grammaticale sans employer le terme plus spécialisé « sage » comme substantif.
- source_word: לְרַבִּים
  choice: pour beaucoup
  rationale: 'La préposition לְ a ici une valeur de relation ou d''avantage: sa sagesse profite à beaucoup d''autres, sans préciser davantage comment.'
- source_word: נֶחְכָּם
  choice: se montre sage
  rationale: Le nifal peut exprimer le fait de devenir sage ou de se révéler sage. Dans ce contraste entre utilité publique et échec personnel, « se montre sage » conserve la nuance verbale sans suggérer nécessairement un processus d'acquisition.
- source_word: וּלְנַפְשׁוֹ
  choice: mais qui, pour lui-même
  rationale: נֶפֶשׁ peut désigner la personne, la vie ou l'âme. Ici, le contraste est réflexif et pratique; « pour lui-même » évite une lecture métaphysique indue.
- source_word: גוֹאָל
  choice: est sans valeur
  rationale: La forme hébraïque est difficile et peut évoquer ce qui est souillé ou dégradé. Dans l'antithèse proverbiale, « sans valeur » exprime prudemment l'évaluation négative sans effacer l'incertitude, signalée en note.
