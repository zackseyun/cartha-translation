  source_fidelity: 'Le texte hébreu présente une comparaison quantitative avec מן (« plus que ») : le cœur humain fait connaître les préoccupations ou soucis intérieurs d’une personne plus que ne le feraient sept guetteurs. « Révèle » et « préoccupations », avec note d’incertitude, sont des choix défendables. En revanche, « mieux que » déplace légèrement la comparaison vers l’efficacité qualitative plutôt que de conserver le comparatif numérique.'
  naturalness: Le français est moderne, clair et proverbial. « Sept guetteurs à un poste de guet » est naturel et plus idiomatique que « à leur poste d’observation », tout en conservant le singulier de l’hébreu et sans préciser indûment une tour.
