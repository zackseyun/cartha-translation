  text: A man's heart tells of his thoughts[b][a], more than seven watchmen on a lookout.
translation:
  language: fr
  text: Le cœur d’un être humain révèle ses préoccupations[b], plus que sept guetteurs à un poste de guet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec de ce vers diffère fortement : il parle d’un homme habile en paroles, mais détesté, qui sera privé de toute nourriture.'
    reason: textual_variant
  - marker: b
    text: Le mot hébreu traduit par « préoccupations » est incertain ; on pourrait aussi comprendre « inquiétudes », « soucis » ou « pensées ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לב
  choice: cœur
  rationale: Conserve l’image anthropologique hébraïque du siège de la pensée et des sentiments, naturelle en français.
- source_word: אנוש
  choice: un être humain
  rationale: Rend le singulier générique sans exclure selon le genre et peut évoquer la condition humaine.
- source_word: יגיד
  choice: révèle
  rationale: Le hifil de נגד signifie faire connaître ou déclarer; « révèle » convient lorsque le cœur manifeste l’état intérieur.
- source_word: שעיותיו
  choice: ses préoccupations
  rationale: Le terme hébreu est incertain; ce choix couvre assez largement les soucis, inquiétudes ou pensées intérieures sans imposer la détresse de « tourments ».
- source_word: משבעה
  choice: mieux que sept
  rationale: Le מן a ici une valeur comparative; « mieux que » exprime naturellement la supériorité de discernement suggérée par l’image.
- source_word: צופים
  choice: guetteurs
  rationale: Désigne ceux qui observent attentivement; « guetteurs » est actuel et correspond à l’image du poste de surveillance.
- source_word: על מצפה
  choice: à leur poste d’observation
  rationale: מצפה désigne un lieu d’où l’on surveille; la formulation n’impose pas qu’il s’agisse précisément d’une tour.
