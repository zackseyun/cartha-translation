  text: A bad friend looks to the table[b][a], but in a time of distress he will stand aloof.
translation:
  language: fr
  text: Le mauvais ami regarde la table, mais au temps de la détresse, il se tiendra en face[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il se tiendra à l’opposé ». L’expression peut évoquer le fait de rester à l’écart ou d’adopter une position opposée dans l’épreuve.'
    reason: alternative_reading
lexical_decisions:
- source_word: מרע אוהב
  choice: le mauvais ami
  rationale: L’expression désigne un ami ou compagnon mauvais dans son rôle relationnel. Cette formulation française est naturelle et conserve l’évaluation morale du texte.
- source_word: מביט אל שלחן
  choice: a les yeux sur la table
  rationale: Cette tournure préserve l’image concrète tout en suggérant naturellement l’intérêt porté au repas ou aux avantages reçus, sans expliciter davantage que l’hébreu.
- source_word: בעת מצוקה
  choice: au temps de la détresse
  rationale: מצוקה évoque la détresse, l’adversité ou une situation difficile. La formulation est claire, digne et maintient le contraste avec la table.
- source_word: מנגד יעמד
  choice: il se tiendra en face
  rationale: Le sens spatial littéral est « se tenir en face, à l’opposé ». Ce choix conserve l’ambiguïté entre la prise de distance, le défaut de soutien et une position franchement hostile.
theological_decisions:
- issue: Degré d’hostilité du faux ami dans l’épreuve
  choice: Maintenir l’image ambiguë « se tiendra en face »
  alternative: « se tiendra à l’écart » ou « se dressera contre toi »
  rationale: Ni l’hébreu מנגד ni le grec ἀπέναντι ne tranche nettement entre éloignement et opposition active; la traduction ne doit donc pas résoudre cette tension.
translation_notes:
  register: Français international moderne, sobre et sapientiel. « A les yeux sur » rend l’intérêt intéressé de manière idiomatique; « au temps de la détresse » garde un registre digne. Le pronom « toi », absent de l’hébreu, n’est pas ajouté au corps du texte.
