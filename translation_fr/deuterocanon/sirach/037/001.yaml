  text: Every friend says[a], “I love him,” but there is a friend who is a friend in name only.
translation:
  language: fr
  text: 'Tout ami dit : « Je l’aime », mais il y a un ami qui n’est ami que de nom[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie une expression condensée, littéralement proche de « il y a un ami, ami de nom ». Le grec parallèle explicite le sens : « un ami seulement de nom ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כל אוהב
  choice: Tout ami
  rationale: אוהב peut désigner celui qui aime ou un ami. Le grec parallèle Πᾶς φίλος et le contraste portant sur l’amitié appuient ici « ami ».
- source_word: אומר
  choice: dit
  rationale: Le verbe courant « dire » conserve la simplicité proverbiale de l’hébreu sans transformer la parole en prétention explicite.
- source_word: אהבתי
  choice: Je l’aime
  rationale: La forme accomplie hébraïque se rend naturellement, dans cette déclaration directe, par un présent français. Le complément pronominal, explicité aussi par le grec, est nécessaire en français courant.
- source_word: אך
  choice: mais
  rationale: « Mais » exprime directement l’opposition entre l’affection déclarée et l’amitié purement nominale.
- source_word: יש
  choice: il y a
  rationale: Équivalent français naturel de la particule existentielle hébraïque.
- source_word: אהב שם אהב
  choice: il y a des amis qui ne le sont que de nom
  rationale: L’expression hébraïque est très condensée et répète le terme lié à « ami ». Le grec parallèle, ὀνόματι μόνον φίλος, confirme le sens « ami seulement de nom ». Le pluriel générique donne en français une maxime naturelle sans modifier la portée générale.
