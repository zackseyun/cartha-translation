  text: But a man is always fearful[a]; whom you know keeps the commandment.
translation:
  language: fr
  text: Le commencement de toute œuvre est une parole, et avant toute action vient la réflexion.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu conservé dans les manuscrits de la Guéniza du Caire est très différent et paraît perturbé. Il se lirait approximativement : « Mais un homme a toujours peur, dont tu sais qu’il observe le commandement. » Le texte principal suit ici le parallèle grec, qui forme une maxime cohérente.'
    reason: textual_variant
lexical_decisions:
- source_word: ἀρχὴ παντὸς ἔργου
  choice: Le commencement de toute œuvre
  rationale: Le grec, retenu ici en raison de l’état manifestement perturbé du témoin hébreu, exprime le point de départ de toute œuvre ou entreprise. « Commencement » et « œuvre » conservent la forme proverbiale et la distinction avec l’action mentionnée ensuite.
- source_word: λόγος
  choice: une parole
  rationale: λόγος peut désigner une parole, un propos ou une formulation raisonnée. « Une parole » reste proche du grec sans préciser indûment s’il s’agit d’un projet, d’un conseil ou d’une discussion.
- source_word: πρὸ πάσης πράξεως
  choice: avant toute action
  rationale: La préposition marque l’antériorité, et πράξις désigne ici l’action ou l’acte. « Action » est naturel en français moderne et évite de répéter « œuvre ».
- source_word: βουλή
  choice: la réflexion
  rationale: Dans ce contexte sapientiel, βουλή évoque la délibération réfléchie qui précède l’action. « Réflexion » rend naturellement cette idée en français, tout en laissant ouverte la possibilité d’un conseil reçu ou d’une délibération personnelle.
theological_decisions:
- issue: Conflit textuel majeur entre le témoin hébreu conservé et le parallèle grec
  choice: Traduire dans le texte principal la leçon grecque cohérente.
  alternative: « Mais un homme a toujours peur, celui que tu sais observer le commandement. »
  rationale: Le texte hébreu fourni est intelligible par fragments, mais sa syntaxe est difficile et son contenu ne correspond pas au parallèle grec bien formé. Puisque le dossier signale explicitement une divergence majeure et un texte hébreu probablement perturbé, le grec sert ici de source de remplacement; la leçon hébraïque est néanmoins conservée en note afin de rendre l’incertitude textuelle visible.
translation_notes:
  register: Français international moderne, sobre et proverbial. La formulation demeure proche de la structure grecque, tandis que « réflexion » rend βουλή plus naturellement que le terme technique « délibération ».
