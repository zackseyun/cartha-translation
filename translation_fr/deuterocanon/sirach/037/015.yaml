review_pass:
  verdict: revise
  source_fidelity: Le texte français suit la couche anglaise auditée, mais non le parallèle grec fourni pour Siracide 37.15. Celui-ci dit que l’âme (ou l’esprit) d’un homme lui apporte parfois plus d’indications que sept sentinelles postées en hauteur, et non qu’il faut prier le Très-Haut pour qu’il dirige son chemin. Le témoin hébreu transmis est effectivement manifestement décalé, mais il ne justifie pas de substituer au grec explicitement fourni une autre formulation grecque.
  naturalness: La phrase proposée est idiomatique et de registre approprié, mais elle traduit un autre texte. La révision conserve un français sapientiel moderne, sobre et naturel.
  terminology: « Âme » rend ψυχή de façon directe tout en pouvant désigner ici la faculté intérieure de discernement. « Sentinelles » rend σκοποί; « postées en hauteur » restitue l’idée de vigies installées sur un point élevé. La note décrit avec précision le conflit des témoins sans attribuer au grec un contenu qu’il n’a pas.
  issues:
  - severity: high
    issue: Le texte principal ne correspond pas au parallèle grec fourni.
    rationale: 'Le grec cité est : « ψυχὴ γὰρ ἀνδρὸς ἀπαγγέλλειν ἐνίοτε εἴωθεν ἢ ἑπτὰ σκοποὶ ἐπὶ μετεώρου καθήμενοι ἐπὶ σκοπῆς » : il évoque l’avis que donne parfois l’âme d’un homme, comparé à celui de sept sentinelles. La prière au Très-Haut est absente de ce texte.'
  - severity: high
    issue: La note textuelle présente de manière erronée la leçon grecque suivie.
    rationale: Elle affirme que la tradition grecque plus complète soutient la prière pour une direction divine, alors que le grec fourni contient le proverbe sur l’âme et les sentinelles. Elle doit signaler honnêtement que les témoins fournis sont fortement discordants.
  revised_text: Car l’âme d’un homme lui donne parfois plus d’indications que sept sentinelles postées en hauteur pour observer.[a]
  revised_footnotes:
  - marker: a
    text: 'Le texte hébreu conservé dans les manuscrits de la Guéniza du Caire est ici fortement décalé et dit approximativement : « Avec un homme mauvais au sujet du paiement d’un bienfait, et avec un homme cruel au sujet du bien de la chair. » Le texte principal suit le parallèle grec fourni, qui dit que l’âme d’un homme donne parfois plus d’indications que sept sentinelles assises en hauteur pour observer. Les témoins fournis sont donc en net désaccord.'
    reason: textual_variant
  revision_rationale: Une correction est nécessaire, car la traduction et sa note dépendent d’une piste anglaise qui contredit le texte grec parallèle explicitement fourni. La révision traduit ce grec, tout en conservant en note le caractère gravement discordant du témoin hébreu et sans prétendre résoudre l’histoire textuelle.
