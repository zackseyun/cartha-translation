  text: And more than all this, pray to the Most High that he may direct your way in truth.
translation:
  language: fr
  text: Et par-dessus tout, prie le Très-Haut afin qu’il dirige ton chemin dans la vérité.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu conservé dans les manuscrits de la Guéniza du Caire est ici fortement décalé et dit approximativement : « Avec un homme mauvais au sujet du paiement d’un bienfait, et avec un homme cruel au sujet du bien de la chair. » Comme cette formulation ne s’accorde pas avec le contexte, le texte principal suit la tradition grecque plus complète de ce verset.'
    reason: textual_variant
lexical_decisions:
- source_word: καὶ ἐπὶ πᾶσι τούτοις
  choice: Et par-dessus tout
  rationale: Rend naturellement la transition cumulative et emphatique du grec sans alourdir la phrase.
- source_word: δεήθητι ὑψίστου
  choice: prie le Très-Haut
  rationale: « Prier » exprime clairement la supplication, tandis que « le Très-Haut » conserve le titre divin traditionnel.
- source_word: κατευθύνῃ
  choice: dirige
  rationale: Ce verbe garde l’idée d’orienter correctement la conduite ou le parcours d’une personne.
- source_word: τὴν ὁδόν σου
  choice: ton chemin
  rationale: « Chemin » convient au langage sapiential et conserve à la fois les dimensions pratique et morale de l’image.
- source_word: ἐν ἀληθείᾳ
  choice: dans la vérité
  rationale: Traduction formellement fidèle qui préserve l’ambiguïté entre conformité à ce qui est vrai et conduite droite ou fidèle.
theological_decisions:
- issue: Conflit entre le texte hébreu conservé et la tradition grecque de ce verset
  choice: Le texte principal suit la leçon grecque attestée pour Siracide 37.15 dans la tradition textuelle plus complète.
  alternative: « Avec un homme mauvais au sujet du paiement d’un bienfait, et avec un homme cruel au sujet du bien de la chair. »
  rationale: La ligne hébraïque fournie est signalée comme fortement décalée et ne donne pas un sens cohérent dans ce contexte. La formulation grecque de 37.15, également reflétée par la couche anglaise auditée, poursuit logiquement les conseils du passage. La note signale néanmoins l’état du témoin hébreu au lieu de le dissimuler.
- issue: Portée de « dans la vérité »
  choice: Conserver la formulation ouverte « dans la vérité ».
  alternative: « sur le droit chemin » ou « avec fidélité »
  rationale: Une reformulation plus explicite résoudrait indûment la tension entre vérité, droiture et fidélité.
translation_notes:
  register: Français international actuel, sobre et digne. Le tutoiement singulier correspond à l’adresse sapientiale directe. La phrase reste accessible tout en conservant l’image biblique du chemin et la formulation théologiquement ouverte « dans la vérité ».
