  text: Do not consult with your father-in-law[a], and conceal a secret from one who is jealous.
translation:
  language: fr
  text: Ne demande pas conseil à ton beau-père[a] et cache un secret à quelqu’un de jaloux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle diffère considérablement : il recommande plutôt de fréquenter assidûment un homme pieux dont on sait qu’il observe les commandements. L’hébreu traduit ici déconseille de consulter son beau-père et de révéler un secret à une personne jalouse.'
    reason: textual_variant
lexical_decisions:
- source_word: אל תועץ
  choice: Ne demande pas conseil
  rationale: L’impératif négatif interdit de rechercher un avis. Cette formulation est naturelle en français moderne et conserve le contexte de la consultation.
- source_word: חמיך
  choice: à ton beau-père
  rationale: Le terme hébreu désigne précisément le père du conjoint; «beau-père» est l’équivalent français courant, malgré sa possible polysémie hors contexte.
- source_word: וממקנא
  choice: à celui qui est jaloux
  rationale: Avec le verbe «cacher», la préposition מן désigne la personne à laquelle on soustrait l’information. «Jaloux» conserve le sens direct, sans exclure la nuance d’envie.
- source_word: העלים סוד
  choice: cache ton secret
  rationale: L’expression signifie dissimuler ou ne pas révéler un secret. Le possessif explicite en français rend naturellement l’objet indéfini hébreu dans cette maxime adressée à la deuxième personne.
theological_decisions:
- issue: Divergence majeure entre l’hébreu conservé et le parallèle grec
  choice: Traduire directement le texte hébreu conservé
  alternative: 'Suivre le grec: fréquenter assidûment un homme pieux dont on sait qu’il observe les commandements'
  rationale: L’hébreu est ici présent et de haute confiance; il demeure donc le témoin principal. La divergence substantielle du grec est signalée en note plutôt que résolue silencieusement.
translation_notes:
  register: Français international moderne, direct et sentencieux. Le tutoiement correspond à l’adresse sapientielle au singulier. «Beau-père» est idiomatique et «cache ton secret» reste clair, digne et proche de l’hébreu.
