  text: He will speak to you of the good of your way[a], and then stand opposite to watch your downfall.
translation:
  language: fr
  text: Il te parlera de ce qu’il y a de bon dans ta voie[a], puis se tiendra en face pour regarder ton malheur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu est concis et quelque peu incertain ici. Le dernier mot peut aussi se traduire par « ta pauvreté » ou « ton dénuement ». Le texte grec parallèle présente plutôt un avertissement plus développé contre le fait de demander conseil à certaines catégories de personnes.
    reason: Signaler l’incertitude lexicale de רישך et la divergence importante du parallèle grec.
lexical_decisions:
- source_word: ואמר לך
  choice: Il te parlera
  rationale: אמר est le verbe courant pour « dire » ou « parler ». Cette formulation naturelle conserve l’adresse personnelle directe.
- source_word: מטוב דרכך
  choice: de ce qu’il y a de bon dans ta voie
  rationale: L’expression hébraïque est condensée et peut évoquer des paroles approbatrices sur la conduite choisie. Cette traduction garde l’image sapientielle de la « voie » sans expliciter davantage la flatterie.
- source_word: דרכך
  choice: ta voie
  rationale: דרך désigne une voie ou un chemin, au sens propre comme au sens figuré. « Ta voie » préserve cette métaphore traditionnelle dans un registre digne.
- source_word: וקם מנגד
  choice: puis se tiendra en face
  rationale: מנגד indique une position en face ou vis-à-vis. « Puis » rend la succession portée par la conjonction sans imposer une opposition grammaticale, tandis que la scène laisse percevoir la distance ou l’hostilité.
- source_word: להביט
  choice: pour regarder
  rationale: הביט exprime un regard attentif. « Regarder » reste proche du sens lexical sans ajouter la durée suggérée par « observer » ou « guetter ».
- source_word: רישך
  choice: ton malheur
  rationale: La forme est difficile et paraît liée à la pauvreté, au dénuement ou à une situation calamiteuse. « Ton malheur » exprime largement l’issue négative sans la préciser indûment comme une « chute ».
theological_decisions:
- issue: Choix du témoin principal malgré la divergence avec le parallèle grec
  choice: Traduire le texte hébreu conservé, en signalant sa difficulté et la forme différente du grec en note.
  alternative: Remplacer le verset par la liste grecque plus développée des personnes dont il ne faut pas suivre les conseils.
  rationale: Le témoin hébreu est présent et jugé de haute confiance, bien que condensé et incertain à la fin. Le grec sert donc de contrôle contextuel plutôt que de texte principal; la divergence réelle est conservée pour le lecteur.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier correspond aux formes hébraïques. La métaphore de la « voie » et la position « en face » sont maintenues; la note porte sur le passage entier grâce au marqueur placé après la première proposition.
