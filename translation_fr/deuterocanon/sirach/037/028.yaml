  text: For not everything is beneficial for everyone, and not every person delights in every kind of thing.[a]
translation:
  language: fr
  text: Car tout n’est pas bénéfique à tous, et tout le monde ne trouve pas son plaisir en toute chose.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu conservé dans les manuscrits de la Guéniza du Caire est difficile et ne correspond pas étroitement au grec. Il se lit littéralement : « Et il y a un sage qui se montre sage pour son peuple ; le fruit de son savoir est dans leurs corps. » En raison de cette divergence, le texte principal suit ici le témoin grec tout en signalant la leçon hébraïque.'
    reason: textual_variant
lexical_decisions:
- source_word: οὐ γὰρ πάντα πᾶσιν συμφέρει
  choice: Car tout n’est pas bénéfique à tous
  rationale: Le grec, retenu ici comme témoin principal en raison du décalage manifeste du texte hébreu conservé, exprime qu’une même chose n’est pas avantageuse pour chacun. « Bénéfique » rend naturellement συμφέρει, et « car » la valeur explicative de γάρ.
- source_word: οὐ πᾶσα ψυχὴ
  choice: toute personne ne
  rationale: Dans cet emploi, ψυχή désigne la personne elle-même plutôt qu’une composante immatérielle. La tournure conserve la portée distributive du grec sans introduire une anthropologie particulière.
- source_word: ἐν παντὶ εὐδοκεῖ
  choice: trouve son plaisir en toute chose
  rationale: εὐδοκεῖ indique ici le plaisir ou la satisfaction. Cette formulation française est claire et digne, tout en préservant la généralité de ἐν παντί.
- source_word: וְיֵשׁ חָכָם לְעַמּוֹ יֶחְכָּם
  choice: Et il y a un sage qui se montre sage pour son peuple
  rationale: Cette traduction littérale du début de la leçon hébraïque n’est pas intégrée au texte principal, car celle-ci diverge profondément du grec et semble déplacée ou textuellement instable; elle est néanmoins conservée dans la note.
- source_word: פְּרִי דַעְתּוֹ בִּגְוִיָתָם
  choice: le fruit de son savoir est dans leur corps
  rationale: La traduction littérale maintient l’étrangeté et l’ambiguïté de la leçon hébraïque conservée, sans tenter de la normaliser; elle figure dans la note de variante.
theological_decisions:
- issue: Choix du témoin textuel face à la divergence entre l’hébreu de la Guéniza et le grec
  choice: Suivre le grec dans le texte principal et signaler intégralement la leçon hébraïque en note
  alternative: 'Traduire la leçon hébraïque dans le texte principal: « Et il y a un sage qui se montre sage pour son peuple; le fruit de son savoir est dans leur corps. »'
  rationale: L’hébreu conservé ne correspond pas étroitement au grec et donne ici un énoncé difficile, tandis que le grec offre un texte cohérent dans le passage. La note rend la divergence transparente et évite d’effacer le témoin hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation évite le littéralisme trompeur de « âme » pour ψυχή et conserve la généralité sentencieuse du grec. La variante hébraïque, textuellement difficile, est présentée sans harmonisation.
