translation:
  language: fr
  text: Hélas, pensée mauvaise[a] ! Pourquoi as-tu été créée pour remplir de tromperie la face du monde ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec dit : « Hélas, pensée mauvaise ! D’où as-tu surgi pour couvrir de tromperie la terre ferme ? » Il appuie le sens « pensée/projet » pour le terme hébreu difficile ; il porte aussi « couvrir » là où l’hébreu dit « remplir ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הוי
  choice: Hélas
  rationale: Interjection de lamentation et de dénonciation, rendue naturellement en français contemporain.
- source_word: רע יאמר
  choice: pensée mauvaise
  rationale: Le texte hébreu transmis est difficile à cet endroit. Le parallèle grec πονηρὸν ἐνθύμημα (« pensée/projet mauvais ») éclaire probablement le sens d’un terme hébreu altéré ou ambigu.
- source_word: מדוע כן נוצרתי
  choice: Pourquoi as-tu été créée ?
  rationale: La forme hébraïque transmise est à la première personne, mais le contexte et le grec indiquent une apostrophe à la pensée personnifiée ; le féminin s’accorde en français avec « pensée ».
- source_word: למלא
  choice: remplir
  rationale: Traduction directe de l’infinitif hébreu ; le grec présente la variante « couvrir ».
- source_word: פני תבל
  choice: la face du monde
  rationale: Conserve l’image et l’idiome hébreux tout en restant intelligible en français.
- source_word: תרמית
  choice: tromperie
  rationale: Rend directement l’idée de duperie ou de fraude, en accord avec le grec δολιότης.
theological_decisions:
- issue: Identification de l’entité apostrophée dans un hébreu difficile
  choice: Une « pensée mauvaise » personnifiée
  alternative: Une mauvaise parole, ou un mauvais compagnon
  rationale: Le mot hébreu imprimé יאמר est difficile dans cette construction, tandis que le grec porte explicitement « pensée/projet mauvais ». Cette lecture préserve la cohérence de l’apostrophe sans imposer une interprétation doctrinale.
- issue: Rapport entre le texte hébreu et la variante grecque
  choice: « remplir » dans le texte principal
  alternative: « couvrir » selon le grec
  rationale: Le témoin hébreu porte clairement למלא, « remplir » ; la variante grecque est signalée en note plutôt que substituée au texte hébreu.
translation_notes:
  register: Français moderne, digne et accessible. L’apostrophe vive et la personnification sont conservées ; la ponctuation en deux questions rend explicite la tension rhétorique de l’hébreu sans en effacer l’ambiguïté.
