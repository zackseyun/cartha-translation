  text: There is a wise man who is despised for his words[a], and he is deprived of every pleasant food.
translation:
  language: fr
  text: Il y a un sage qui est méprisé à cause de ses paroles[a], et qui est privé de toute nourriture délicieuse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Le sage, parmi son peuple, héritera de la confiance, et son nom vivra pour toujours. » L’hébreu et le grec diffèrent considérablement ici.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֵשׁ
  choice: Il y a
  rationale: Rend simplement l’ouverture existentielle hébraïque, sans surcharger la conjonction initiale.
- source_word: חָכָם
  choice: un sage
  rationale: Le nom masculin singulier désigne ici une personne sage; « un sage » est naturel, digne et concis en français.
- source_word: בִּדְבָרוֹ
  choice: que ses paroles font mépriser
  rationale: Cette formulation donne à la préposition beth une valeur causale et rend דָּבָר par le collectif naturel « ses paroles », c’est-à-dire ce qu’il dit.
- source_word: נִמְאָס
  choice: font mépriser
  rationale: Le niphal de מאס exprime le fait d’être rejeté ou méprisé; la tournure causative française s’intègre naturellement à la proposition relative.
- source_word: וּמִכָּל מַאֲכָל תַּעֲנוּג
  choice: de toute nourriture délicieuse
  rationale: Conserve l’image concrète des aliments procurant du plaisir, sans réduire l’expression au seul sens de « mets raffinés ».
- source_word: נִבְצָר
  choice: est privé
  rationale: Avec la préposition מִן, le terme indique que cette nourriture lui est refusée ou demeure hors de sa portée.
- source_word: ὁ σοφὸς ἐν τῷ λαῷ αὐτοῦ κληρονομήσει πίστιν, καὶ τὸ ὄνομα αὐτοῦ ζήσεται εἰς τὸν αἰῶνα
  choice: signalé en note, mais non suivi dans le texte principal
  rationale: Le grec présente un texte substantiellement différent. Le témoin hébreu conservé gouverne le texte principal, tandis que la lecture grecque est donnée pour transparence.
theological_decisions:
- issue: Divergence substantielle entre les traditions textuelles hébraïque et grecque en Siracide 37.26
  choice: Traduire l’hébreu conservé dans le texte principal.
  alternative: 'Suivre le grec : « Le sage, au milieu de son peuple, héritera de la confiance, et son nom vivra pour toujours. »'
  rationale: Puisqu’un témoin hébreu est disponible, il constitue ici la source principale. La divergence grecque n’est pas harmonisée ni dissimulée, mais conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. « Un sage » évite la lourdeur de « un homme sage ». La syntaxe conserve les deux revers subis par le sage et le parallélisme de l’hébreu.
