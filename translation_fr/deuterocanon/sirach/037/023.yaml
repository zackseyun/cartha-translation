translation:
  language: fr
  text: Un homme sage instruira son propre peuple, et les fruits de son intelligence seront dignes de confiance.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu conservé est difficile et diffère fortement du grec. Le texte principal suit ici le témoin grec, plus clair : « Un homme sage instruira son propre peuple, et les fruits de son intelligence seront dignes de confiance. »'
    reason: textual_variant
  - marker: b
    text: 'Le témoin hébreu conserve littéralement une expression obscure, approximativement : « La racine — ou l’arrachement — des projets du cœur; quatre épaules(?) fleuriront. » Le texte est incertain et probablement altéré ou mal conservé.'
    reason: alternative_reading
lexical_decisions:
- source_word: עקרת תחבולות לבב
  choice: '[non retenu dans le texte principal]'
  rationale: Le texte hébreu conservé est très obscur et paraît incertain ou altéré. Plutôt que d’en imposer une interprétation conjecturale, le texte principal suit ici le témoin grec, clair et cohérent.
- source_word: ἀνὴρ σοφός
  choice: un homme sage
  rationale: Cette formulation respecte le masculin singulier explicite du grec et demeure naturelle en français.
- source_word: τὸν ἑαυτοῦ λαόν
  choice: son propre peuple
  rationale: « Peuple » rend naturellement λαός, tandis que « propre » restitue la valeur réfléchie de ἑαυτοῦ.
- source_word: παιδεύσει
  choice: instruira
  rationale: Le futur grec est conservé. Dans ce contexte sapientiel, « instruire » exprime le rôle éducatif de παιδεύω sans accentuer indûment l’idée de châtiment.
- source_word: οἱ καρποὶ
  choice: les fruits
  rationale: Le pluriel et la métaphore du grec sont maintenus.
- source_word: τῆς συνέσεως αὐτοῦ
  choice: de son intelligence
  rationale: « Intelligence » rend ici σύνεσις au sens de compréhension et de discernement, dans un registre naturel de littérature sapientielle.
- source_word: πιστοί
  choice: dignes de confiance
  rationale: Cette expression traduit la fiabilité des fruits produits par l’intelligence du sage; elle est plus explicite en français moderne que le seul adjectif « fidèles ».
theological_decisions:
- issue: Choix du témoin textuel principal
  choice: Suivre le grec dans le texte principal
  alternative: 'Traduire conjecturalement l’hébreu conservé : « La racine des projets du cœur — quatre épaules/branches fleuriront »'
  rationale: L’hébreu est fortement obscur et diverge nettement du grec. Le grec fournit une phrase intelligible sans résoudre artificiellement les difficultés de l’hébreu, lesquelles sont signalées dans les notes.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur du grec est conservé; la métaphore des « fruits » demeure intacte. Les notes exposent franchement la divergence textuelle sans présenter une reconstruction incertaine comme certaine.
