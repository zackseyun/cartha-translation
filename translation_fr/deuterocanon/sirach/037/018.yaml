  text: But with one whose heart is like your heart[a], if you stumble[b], he will be affected also.
translation:
  language: fr
  text: Mais avec celui dont le cœur est comme le tien[a], si tu trébuches, cela l’atteindra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son cœur est comme ton cœur » ; c’est-à-dire qu’il partage tes dispositions profondes ou ta manière de penser.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu est concis : « si tu trébuches, cela l’atteindra ». La nature exacte de ce qui l’atteint n’est pas précisée.'
    reason: alternative_reading
lexical_decisions:
- source_word: אך
  choice: Mais
  rationale: La particule introduit ici une restriction ou un contraste. « Mais » rend cette transition avec naturel sans préciser excessivement sa nuance.
- source_word: לבבו כלבבך
  choice: dont le cœur est comme le tien
  rationale: La formulation conserve l’image hébraïque du cœur, siège de la pensée, des intentions et des dispositions intérieures, tout en restant naturelle en français.
- source_word: אם תכשל
  choice: si tu trébuches
  rationale: « Trébucher » préserve la métaphore hébraïque et laisse ouverte l'idée d'une faute, d'un échec ou d'une difficulté.
- source_word: יגיע אליו
  choice: cela l’atteindra
  rationale: Le sujet du verbe n’est pas exprimé en hébreu. Le pronom neutre « cela » renvoie sans l’identifier précisément à ce qui résulte du faux pas, et « atteindra » conserve le mouvement exprimé par le verbe.
theological_decisions:
- issue: Portée anthropologique de לבב
  choice: cœur
  alternative: esprit; dispositions intérieures
  rationale: « Cœur » garde l’anthropologie biblique et ne réduit pas le terme à l’intellect ou aux émotions.
- issue: Sujet implicite de יגיע אליו
  choice: cela l’atteindra
  alternative: il en subira lui aussi les conséquences; ton malheur l’atteindra
  rationale: L’hébreu ne nomme pas ce qui atteint l’autre personne. La traduction conserve cette indétermination plutôt que d’imposer une conséquence particulière.
translation_notes:
  register: Français moderne, sobre et digne. Le tutoiement correspond à l’adresse sapientielle au singulier. La métaphore du cœur et celle du faux pas sont maintenues, tandis que la dernière proposition conserve l’ambiguïté du texte hébreu.
