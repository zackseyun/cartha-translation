  text: Every counselor says[b][a], “See!” but there is a counselor who trips him up.
translation:
  language: fr
  text: 'Chaque conseiller dit : « Vois ! »[a] ; mais il y a un conseiller qui marche sur lui.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu « Vois ! » est difficile. Il peut s’agir d’une brève affirmation de clairvoyance ou d’une indication donnée avec assurance. Le grec présente ici un avertissement plus développé : il faut se garder d’un conseiller, puisqu’il conseille aussi dans son propre intérêt.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « qui marche sur lui ». L’expression peut évoquer un conseiller qui lui nuit ou profite de lui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כל
  choice: Tout
  rationale: 'Rend la portée distributive de la maxime : chaque conseiller se présente comme ayant quelque chose à montrer.'
- source_word: יועץ
  choice: conseiller
  rationale: Équivalent naturel dans la littérature de sagesse, répété afin de conserver la structure hébraïque.
- source_word: אומר
  choice: dit
  rationale: Le présent convient au caractère général et proverbial de l’énoncé.
- source_word: חזה
  choice: Vois !
  rationale: Conserve la brièveté abrupte et l’ambiguïté de la forme hébraïque, qui peut exprimer une invitation à voir ou une prétention à la clairvoyance.
- source_word: אך
  choice: Mais
  rationale: Marque clairement l’opposition introduisant l’avertissement.
- source_word: דורך עליו
  choice: qui lui marche dessus
  rationale: Préserve l’image concrète de l’hébreu, littéralement « marche sur lui », sans trancher entre maltraitance, entrave et exploitation.
theological_decisions:
- issue: Choix entre le texte hébreu concis et le parallèle grec plus développé
  choice: Le texte principal suit l’hébreu conservé et maintient son caractère énigmatique.
  alternative: 'Suivre plus largement le grec : « Garde-toi d’un conseiller, car il conseillera aussi dans son propre intérêt. »'
  rationale: L’hébreu de Ben Sira est prioritaire lorsqu’il est conservé. Le grec éclaire l’idée probable d’un conseil intéressé, mais sa formulation plus longue ne doit pas remplacer silencieusement le texte hébreu.
translation_notes:
  register: Français moderne, sobre et proverbial. « Vois ! » garde la formulation abrupte de l’hébreu ; « lui marche dessus » conserve volontairement son image inhabituelle, explicitée en note.
