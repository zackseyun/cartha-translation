  text: Consult with a woman about her rival, and with a coward about his warfare;[a]
translation:
  language: fr
  text: Consulte une femme au sujet de sa rivale, et un rebelle au sujet de la guerre qu’il mène.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin hébreu est difficile ici et diffère profondément du grec, qui dit approximativement : « celui dont l’âme est accordée à la tienne et qui, si tu trébuches, souffrira avec toi » — autrement dit, un ami proche qui partage ta peine. Le mot hébreu traduit par « rebelle » est incertain dans ce contexte ; on a aussi proposé « lâche » ou « déserteur ».'
    reason: textual_variant
lexical_decisions:
- source_word: עִם
  choice: consulte
  rationale: La préposition signifie littéralement « avec », mais, dans cette série portant sur le choix des conseillers, elle désigne la personne que l’on consulte. Le verbe explicite naturellement ce rapport en français.
- source_word: אִשָּׁה
  choice: une femme
  rationale: Le nom peut signifier « femme » ou « épouse ». En l’absence de possessif ou d’autre précision, « une femme » est la traduction la moins interprétative.
- source_word: צָרָהּ
  choice: sa rivale
  rationale: Le terme peut désigner une rivale, notamment une coépouse, ou plus largement une adversaire. « Sa rivale » conserve cette portée sans imposer le sens plus étroit de « coépouse ».
- source_word: מָרֵד
  choice: un lâche
  rationale: Le mot hébreu est incertain dans ce passage fortement divergent. En lien avec la guerre, « un lâche » exprime l’idée d’un homme peu fiable au combat, tout en laissant les autres analyses possibles dans la note.
- source_word: מִלְחַמְתּוֹ
  choice: la guerre qu’il mène
  rationale: Cette formulation rend le substantif militaire et son suffixe possessif d’une manière plus naturelle que « sa guerre » en français courant.
theological_decisions:
- issue: Divergence majeure entre les témoins hébreu et grec de Siracide 37.13
  choice: Suivre dans le texte principal le témoin hébreu conservé et signaler sa difficulté ainsi que la lecture grecque en note.
  alternative: 'Traduire le grec : « celui dont l’âme est accordée à la tienne et qui, si tu trébuches, souffrira avec toi ».'
  rationale: L’hébreu conservé constitue ici le texte source principal, mais le grec témoigne d’une ligne entièrement différente et doit être présenté afin de ne pas masquer l’incertitude textuelle.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe parallèle reste proche de l’hébreu, tandis que « la guerre qu’il mène » évite la tournure moins idiomatique « sa guerre ». Le point remplace le point-virgule anglais, puisque le verset est présenté isolément.
