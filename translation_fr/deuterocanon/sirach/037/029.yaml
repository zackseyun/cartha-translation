  text: A man's life is a numbered span of days, but the life of the people of Israel is days without number.
translation:
  language: fr
  text: La vie d’un homme ne dure qu’un certain nombre de jours, mais celle du peuple d’Israël dure des jours sans nombre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « et la vie du peuple d’Israël, des jours sans nombre ». La conjonction hébraïque signifie normalement « et », mais le parallélisme exprime ici un contraste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיֵּי אִישׁ
  choice: La vie d’un homme
  rationale: Rend directement le singulier générique hébreu tout en restant naturel et digne en français.
- source_word: מִסְפַּר יָמִים
  choice: compte un certain nombre de jours
  rationale: Préserve l’idée concrète d’une durée finie et comptable, avec une syntaxe française naturelle.
- source_word: וְחַיֵּי עַם יִשְׂרָאֵל
  choice: mais la vie du peuple d’Israël
  rationale: Le waw est littéralement copulatif, mais le parallélisme lui donne ici une valeur contrastive; « mais » explicite ce contraste sans l’amplifier.
- source_word: עַם יִשְׂרָאֵל
  choice: le peuple d’Israël
  rationale: Traduction directe qui conserve le sens collectif du groupe nominal hébreu.
- source_word: יְמֵי אֵין מִסְפָּר
  choice: des jours innombrables
  rationale: Rend l’expression littérale « des jours sans nombre » de façon concise et naturelle, en maintenant l’opposition avec les jours comptés de l’individu.
theological_decisions:
- issue: Pérennité collective d’Israël opposée à la mortalité individuelle
  choice: Conserver le contraste entre la durée limitée d’un individu et les jours innombrables du peuple d’Israël.
  alternative: Comprendre seulement que l’histoire d’Israël est très longue, sans implication plus large de continuité collective.
  rationale: Le parallélisme hébreu oppose nettement « un nombre de jours » à « des jours sans nombre », mais la traduction évite d’en tirer une formulation doctrinale plus précise que le texte.
translation_notes:
  register: Français international moderne, clair et digne. La légère ellipse du second membre reflète la formulation nominale de l’hébreu et conserve son parallélisme poétique.
