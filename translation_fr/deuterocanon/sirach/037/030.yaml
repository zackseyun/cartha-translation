  text: A wise man for himself will be filled with delight[b][a], and all who see him will call him happy.
translation:
  language: fr
  text: Le sage se rassasiera de plaisir[a], et tous ceux qui le voient[b] le diront heureux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente ici une phrase très différente : « Car la multiplicité des aliments causera de la souffrance, et la gloutonnerie mènera jusqu’à la maladie bilieuse. » Le texte principal suit l’hébreu conservé dans les manuscrits de la Guéniza du Caire.'
    reason: alternative_reading
  - marker: b
    text: L’hébreu signifie « tous ceux qui le voient » ; la forme transmise du dernier mot présente apparemment une irrégularité orthographique, mais le sens ressort clairement du contexte.
    reason: textual_variant
lexical_decisions:
- source_word: חכם
  choice: le sage
  rationale: Le masculin singulier hébreu désigne une personne sage et a ici une portée proverbiale. « Le sage » est naturel, digne et fidèle à la forme du texte.
- source_word: לנפשו
  choice: sera rassasié
  rationale: Littéralement « pour lui-même / pour sa personne ». En français, la construction avec « être rassasié » exprime naturellement l’expérience personnelle du sujet; traduire séparément par « pour lui-même » serait ambigu et peu idiomatique.
- source_word: ישבע
  choice: sera rassasié
  rationale: Le verbe שבע signifie être repu, rassasié ou satisfait. « Sera rassasié » conserve l’image concrète, pertinente dans le contexte de l’alimentation, sans imposer une interprétation.
- source_word: תענוג
  choice: de plaisir
  rationale: Le nom désigne le plaisir, l’agrément ou les délices. « Plaisir » est clair et direct en français moderne.
- source_word: ויאשרוהו
  choice: le diront heureux
  rationale: Le verbe אשר signifie ici déclarer quelqu’un heureux ou bienheureux, plutôt que lui conférer une bénédiction. « Le diront heureux » restitue cette reconnaissance publique.
- source_word: כל רואינו
  choice: tous ceux qui le voient
  rationale: Malgré une irrégularité graphique apparente dans la forme transmise, le contexte et le parallélisme indiquent clairement le sens « tous ceux qui le voient ».
