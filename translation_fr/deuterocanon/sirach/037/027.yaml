  text: And there is a wise man who is wise for himself[b][a]; the fruit of his understanding is upon his own body.
translation:
  language: fr
  text: Il y a aussi un homme sage, sage pour lui-même[a] ; le fruit de son discernement rejaillit sur son propre corps[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour son être » ou « pour sa vie » ; l’expression signifie ici « pour lui-même ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut aussi désigner un cadavre dans certains contextes ; ici, il s’agit du corps vivant de la personne qui bénéficie de son discernement.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ
  choice: Il y a aussi
  rationale: La tournure existentielle introduit un autre type de sage dans la suite du propos ; « aussi » rend naturellement la liaison וְ sans la surcharger.
- source_word: חָכָם
  choice: un homme sage
  rationale: Le nom hébreu est au masculin singulier ; cette forme est conservée dans cette maxime tout en restant naturelle en français.
- source_word: לְנַפְשׁוֹ
  choice: pour lui-même
  rationale: Littéralement « pour son être / sa vie » ; dans cette construction, l’expression indique que la sagesse bénéficie au sage lui-même, sans imposer une anthropologie dualiste.
- source_word: יֶחְכָּם
  choice: sait agir avec sagesse
  rationale: Le verbe חכם exprime ici l’exercice de la sagesse à son propre égard. Cette formulation française évite l’étrange répétition « un sage qui est sage » tout en gardant la valeur pratique du verbe.
- source_word: פְּרִי
  choice: le fruit
  rationale: La métaphore concrète du résultat produit par le discernement est conservée.
- source_word: דַעְתּוֹ
  choice: son discernement
  rationale: Dans ce contexte sapientiel, דַעַת désigne une connaissance capable de guider la conduite ; « discernement » en exprime mieux la portée pratique que le seul mot « connaissance ».
- source_word: עַל
  choice: profite à
  rationale: Le sens littéral est « sur », mais le rapport contextuel est celui d’un fruit qui revient à la personne et lui fait du bien. La formulation française explicite ce rapport sans modifier l’idée.
- source_word: גְוִיָּתוֹ
  choice: son propre corps
  rationale: Bien que גְּוִיָּה puisse désigner ailleurs un cadavre, il s’agit ici du corps vivant du sage qui recueille les effets de son discernement. « propre » souligne la relation réflexive présente dans le parallélisme.
theological_decisions:
- issue: Sens anthropologique de נֶפֶשׁ
  choice: 'Valeur réflexive : « pour lui-même »'
  alternative: « pour son âme » ou « pour sa propre vie »
  rationale: Le vers décrit celui qui applique sa sagesse à sa propre personne. « Âme » risquerait d’introduire une opposition technique entre âme et corps que l’hébreu n’exige pas.
- issue: Référent de גְּוִיָּה
  choice: Le corps vivant de la personne
  alternative: « cadavre » ou, par métonymie, « personne »
  rationale: Le fruit du discernement bénéficie au sage durant sa vie ; « cadavre » donnerait ici un sens peu plausible. La traduction garde néanmoins le terme concret « corps ».
translation_notes:
  register: Français international actuel, digne et proverbial. La répétition hébraïque autour de « sage » est rendue par « sait agir avec sagesse » pour rester intelligible, tandis que l’image du « fruit » et la mention concrète du « corps » sont préservées.
