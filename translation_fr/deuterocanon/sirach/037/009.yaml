  text: Guard yourself from a counselor[a], and know beforehand what his need is.
translation:
  language: fr
  text: Méfie-toi d’un conseiller et sache d’avance quel est son besoin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « quel est son intérêt ». Le mot hébreu peut désigner un besoin au sens strict, mais aussi ce qui concerne ou motive le conseiller. Le texte grec développe autrement la pensée : « et il se tiendra en face pour voir ce qui t’arrivera. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: מיועץ
  choice: d’un conseiller
  rationale: Avec שמור נפשך, la préposition מן exprime la personne dont il faut se garder. « Conseiller » rend directement le rôle indiqué par יועץ.
- source_word: שמור נפשך
  choice: Méfie-toi
  rationale: Littéralement, « garde-toi ». Dans ce contexte d’avertissement contre les motivations possibles d’un conseiller, « méfie-toi » exprime naturellement en français la prudence demandée, sans limiter נפש à la vie physique.
- source_word: ודע לפנים
  choice: et sache d’avance
  rationale: 'לפנים a ici une valeur temporelle : il faut discerner au préalable les motivations du conseiller.'
- source_word: מה צרכו
  choice: quel est son intérêt
  rationale: צרך peut désigner un besoin, mais, dans ce contexte, aussi ce qui préoccupe ou motive personnellement le conseiller. « Son intérêt » rend cette portée tout en conservant l’ambiguïté grâce à la note.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Méfie-toi » donne à l’avertissement sa force idiomatique; « intérêt » convient au contexte des motivations d’un conseiller, tandis que la note préserve le sens plus littéral de « besoin » et signale la divergence du parallèle grec.
