review_pass:
  verdict: revise
  source_fidelity: 'La première proposition rend fidèlement le texte hébreu : חכם עם ינחל כבוד correspond bien à « Un homme sage parmi son peuple héritera de l’honneur ». Pour la seconde, « pour la vie éternelle » donne en français un sens final (« en vue de ») qui ne correspond pas naturellement à l’expression hébraïque. Celle-ci exprime la permanence du nom, avec une formulation de vie éternelle dont la portée exacte demeure ouverte. « À jamais » rend le sens idiomatique sans imposer une lecture eschatologique. La note conserve l’ambiguïté du littéral. La note sur le grec signale à juste titre une lecture très différente.'
  naturalness: '« Son nom subsistera pour la vie éternelle » est peu idiomatique et ambigu de façon fautive en français moderne : il peut suggérer que le nom subsiste afin d’obtenir la vie éternelle. « Son nom subsistera à jamais » est naturel, soutenu et convient au registre sapientiel. « Un homme sage » est acceptable et clair en français international.'
  terminology: « Honneur », « nom » et « subsistera » conviennent au contexte. La traduction principale ne doit pas transformer l’expression temporelle en affirmation explicite concernant la vie éternelle; la note peut légitimement relever les résonances possibles du syntagme hébreu. Les deux notes sont correctement ancrées après le verset.
  issues:
  - severity: medium
    issue: La formulation « pour la vie éternelle » fausse la relation syntaxique et sémantique de la dernière expression.
    rationale: En français, « pour la vie éternelle » se comprend normalement comme un but ou un bénéfice. Le nom qui « subsiste » est plutôt dit subsister « à jamais » ou « pour toujours ». Cette correction préserve la permanence exprimée par l’hébreu et évite d’imposer une interprétation eschatologique.
  - severity: low
    issue: La note a doit distinguer plus nettement le sens idiomatique de la traduction littérale.
    rationale: Le littéral « dans la vie de l’éternité » ne commande pas, dans le texte principal, « pour la vie éternelle ». La note peut signaler les résonances sans présenter cette formulation française comme l’équivalent direct requis.
