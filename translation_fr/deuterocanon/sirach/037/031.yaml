  text: A wise man among his people will inherit honor, and his name will endure for everlasting life.
translation:
  language: fr
  text: Un homme sage parmi son peuple héritera de l’honneur, et son nom subsistera à jamais.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son nom subsistera pour toujours ». L’hébreu dit littéralement « son nom se tient dans la vie de l’éternité » ; cette expression peut désigner un souvenir durable, tout en ayant aussi des résonances de vie éternelle.
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec parallèle diffère sensiblement ici : « Beaucoup sont morts par avidité, mais celui qui est attentif prolongera sa vie. » La traduction principale suit le témoin hébreu conservé.'
    reason: alternative_reading
lexical_decisions:
- source_word: חכם
  choice: un homme sage
  rationale: Le terme désigne une personne sage au masculin singulier. « Un homme sage » conserve cette forme et reste naturel en français moderne.
- source_word: עם
  choice: parmi son peuple
  rationale: Dans ce contexte social, l’expression situe le sage au sein de son peuple ou de sa communauté; le possessif implicite est rendu explicitement.
- source_word: ינחל
  choice: héritera
  rationale: Le verbe signifie couramment « hériter » ou « prendre possession »; ce choix préserve l’image concrète de l’honneur reçu en partage.
- source_word: כבוד
  choice: l’honneur
  rationale: Dans ce contexte sapientiel, « honneur » exprime mieux l’estime publique que « gloire ».
- source_word: שמו
  choice: son nom
  rationale: Traduction directe qui maintient l’image biblique du nom comme réputation ou mémoire durable.
- source_word: עומד
  choice: subsistera
  rationale: Littéralement « se tient »; appliqué à un nom, « subsistera » exprime naturellement sa permanence sans expliciter indûment « souvenir » ou « renommée ».
- source_word: בחיי עולם
  choice: pour la vie éternelle
  rationale: Littéralement « dans la vie de l’éternité ». Cette traduction garde le vocabulaire de la vie ainsi que l’ambiguïté entre mémoire perpétuelle et possible résonance de vie éternelle.
theological_decisions:
- issue: Sens de בחיי עולם
  choice: pour la vie éternelle
  alternative: pour toujours / à jamais
  rationale: L’hébreu peut évoquer soit la permanence du nom, soit une nuance plus forte liée à la vie éternelle. Le texte principal conserve le langage de la vie, tandis que la note signale l’interprétation idiomatique sans trancher la tension.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste proche de la structure hébraïque tout en étant idiomatique; elle conserve le masculin singulier et l’ambiguïté théologique de la dernière expression.
