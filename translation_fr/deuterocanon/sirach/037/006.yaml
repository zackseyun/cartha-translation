  text: Do not forget a friend in your heart[b][a], and do not neglect him when you have wealth.
translation:
  language: fr
  text: N’oublie pas un ami dans ton cœur[a], et ne le néglige pas quand tu as des biens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu peut aussi être compris : « dans le combat ». Le grec porte : « dans ton âme ».'
    reason: textual_variant
  - marker: b
    text: 'Le texte hébreu transmis peut se comprendre : « et ne l’abandonne pas quand tu as du butin ». Le grec porte : « et ne l’oublie pas dans tes biens », d’où « ne le néglige pas quand tu as des biens ».'
    reason: textual_variant
lexical_decisions:
- source_word: אל תשכח
  choice: N’oublie pas
  rationale: La prohibition hébraïque est directe; cette formulation est naturelle en français et correspond au grec μὴ ἐπιλάθῃ.
- source_word: חבר
  choice: un ami
  rationale: Le nom désigne un ami ou un compagnon; « ami » convient au contexte relationnel et correspond au grec φίλου.
- source_word: בקרב
  choice: au fond de toi
  rationale: L’hébreu peut renvoyer à l’intérieur, mais la forme non vocalisée permet aussi une autre analyse. Le grec ἐν τῇ ψυχῇ σου confirme ici l’idée de l’intériorité; « au fond de toi » la rend sans ajouter explicitement « cœur ».
- source_word: ואל תעזבהן
  choice: et ne l’oublie pas
  rationale: La forme hébraïque transmise est difficile, notamment quant au suffixe. Le grec μὴ ἀμνημονήσῃς αὐτοῦ porte clairement le sens de ne pas perdre l’ami de vue; la répétition française préserve cette nuance sans transformer le verbe en « abandonner ».
- source_word: בשללך
  choice: dans l’usage de tes biens
  rationale: La lecture hébraïque peut évoquer le butin, tandis que le grec ἐν χρήμασίν σου parle des biens ou des richesses. Cette formulation conserve le lien concret avec les possessions et l’idée éthique d’en faire profiter l’ami.
