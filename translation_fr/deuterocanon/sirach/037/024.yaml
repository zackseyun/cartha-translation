  text: Good and evil[a], life and death—over them all the tongue rules.
translation:
  language: fr
  text: 'Le bien et le mal[a], la vie et la mort : la langue règne sur tout cela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle porte : « Un homme sage sera comblé de bénédictions, et tous ceux qui le verront le déclareront heureux. » Le grec diffère ici considérablement de l’hébreu conservé.'
    reason: alternative_reading
lexical_decisions:
- source_word: טוב
  choice: le bien
  rationale: Dans l’opposition טוב ורעה, « le bien » conserve la portée générale, morale et existentielle, du terme sans la réduire à la prospérité.
- source_word: רעה
  choice: le mal
  rationale: « Le mal » préserve l’opposition globale avec « le bien »; « malheur » ou « calamité » seraient possibles dans certains contextes sapientiaux, mais seraient ici plus restrictifs.
- source_word: חיים
  choice: la vie
  rationale: Traduction directe du terme, qui forme avec « la mort » une paire englobante.
- source_word: מות
  choice: la mort
  rationale: Traduction directe et naturelle dans l’antithèse traditionnelle « la vie et la mort ».
- source_word: ומושלת
  choice: règne
  rationale: Le verbe משל exprime l’exercice d’une domination. « Règne » garde cette force et convient au style sentencieux du verset.
- source_word: בם כליל
  choice: sur eux tous
  rationale: Cette formulation rend la portée exhaustive de l’expression hébraïque et rattache la domination de la langue à tous les éléments énumérés.
- source_word: לשון
  choice: la langue
  rationale: Le nom concret est conservé comme métonymie de la parole, image courante et expressive de la littérature sapientiale.
theological_decisions:
- issue: Rapport entre le texte hébreu et le parallèle grec très divergent
  choice: 'Le texte principal traduit l’hébreu conservé : « Le bien et le mal, la vie et la mort : sur eux tous, la langue règne. »'
  alternative: 'Le grec porte plutôt : « Un homme sage sera comblé de bénédiction, et tous ceux qui le verront le déclareront heureux. »'
  rationale: Puisque le Siracide hébreu est ici conservé avec une confiance élevée, il constitue le texte principal. Le grec ne représente pas une simple variante de formulation, mais une lecture substantiellement différente; elle est donc signalée en note sans remplacer l’hébreu.
translation_notes:
  register: Français moderne, international et digne. La structure brève et antithétique de l’hébreu est maintenue; « la langue règne » conserve l’image concrète et la force aphoristique de l’original.
