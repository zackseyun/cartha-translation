  text: Do not bargain with a merchant[a], nor over buying and selling.
translation:
  language: fr
  text: Ne marchande pas avec un commerçant[a], ni à propos d’un achat ou d’une vente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle dit : « Affermis le conseil de ton cœur, car personne ne t’est plus fidèle que lui. » L’hébreu conservé diffère ici considérablement de la tradition grecque.'
    reason: alternative_reading
lexical_decisions:
- source_word: עם סוחר
  choice: avec un commerçant
  rationale: עם marque ici la personne avec laquelle on traite, et סוחר désigne quelqu’un qui pratique professionnellement le commerce.
- source_word: אל תתגר
  choice: Ne marchande pas
  rationale: Dans ce contexte commercial, le verbe évoque vraisemblablement l’action de négocier ou de marchander, plutôt qu’une contestation générale.
- source_word: ממקנה על ממכר
  choice: sur l’achat et la vente
  rationale: Les deux substantifs relèvent du vocabulaire de l’acquisition et de la vente. Cette formulation française naturelle conserve leur parallélisme commercial, sans imposer une relation plus précise que celle du texte hébreu.
- source_word: καὶ βουλὴν καρδίας στήσον
  choice: signalé en note comme variante grecque divergente
  rationale: Le grec transmet ici une sentence entièrement différente. Puisque le texte hébreu est conservé avec une confiance élevée, il fonde le texte principal, tandis que la tradition grecque reste visible en note.
theological_decisions:
- issue: Divergence majeure entre l’hébreu conservé et la tradition grecque
  choice: Suivre dans le texte principal l’interdiction hébraïque concernant le marchand et les transactions.
  alternative: 'Grec : « Affermis le conseil de ton cœur, car personne ne t’est plus fidèle que lui. »'
  rationale: La tradition hébraïque conservée constitue ici la source principale. La leçon grecque ne doit toutefois pas être harmonisée ni omise, car elle témoigne d’une transmission substantiellement différente.
translation_notes:
  register: Français moderne, international et sobre. « Commerçant » est plus courant aujourd’hui que « marchand » comme désignation générale, tandis que « marchander » rend clairement le cadre de négociation. La tournure « sur l’achat et la vente » conserve une légère densité sapientielle et l’ambiguïté syntaxique de l’hébreu.
