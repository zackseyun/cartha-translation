  - severity: low
    issue: « Inutile » caractérise les personnes plus que la futilité de leur action
    rationale: שוא peut désigner ce qui est vain, vide ou futile. La tournure « travaille/veille en vain » restitue cette valeur sans suggérer que les personnes seraient intrinsèquement dépourvues d’utilité.
