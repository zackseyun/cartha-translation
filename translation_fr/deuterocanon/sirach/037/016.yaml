  text: A vain laborer for his work[a], a vain guard for one who brings forth evil.
translation:
  language: fr
  text: Un ouvrier qui travaille en vain à son ouvrage, un gardien qui veille en vain sur celui qui fait surgir le mal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte à la place : « Et sur toutes ces choses, prie le Très-Haut afin qu’il dirige ton chemin dans la vérité. » L’hébreu et le grec diffèrent considérablement ici.'
    reason: textual_variant
lexical_decisions:
- source_word: פועל
  choice: ouvrier
  rationale: Le terme désigne concrètement celui qui accomplit un travail. « Ouvrier » conserve ce sens d’agent et convient au parallélisme avec « gardien ».
- source_word: שוא
  choice: inutile
  rationale: שוא évoque ici la vanité, le vide ou l’inefficacité. Appliqué à une personne, « inutile » est plus naturel et moins ambigu en français moderne que « vain », qui pourrait suggérer l’orgueil.
- source_word: מלאכתו
  choice: son ouvrage
  rationale: Le nom désigne le travail ou l’ouvrage de l’ouvrier. « Son ouvrage » garde le lien concret avec l’agent sans répéter « ouvrier » et « travail ».
- source_word: שומר
  choice: gardien
  rationale: La forme désigne celui qui garde ou surveille. « Gardien » restitue le substantif concret et le parallélisme avec « ouvrier ».
- source_word: מוציא רע
  choice: celui qui fait surgir le mal
  rationale: La locution signifie littéralement « celui qui fait sortir le mal ». « Fait surgir le mal » reste proche de cette formulation difficile sans la réduire à l’interprétation plus générale « malfaiteur ».
theological_decisions:
- issue: Divergence majeure entre le témoin hébreu et le texte grec parallèle
  choice: Traduire dans le texte principal l’hébreu conservé et signaler intégralement la leçon grecque en note.
  alternative: « Et par-dessus tout cela, prie le Très-Haut afin qu’il dirige ton chemin dans la vérité. »
  rationale: L’hébreu existant constitue ici le texte source principal, mais le grec transmet une phrase entièrement différente. La note préserve cette importante incertitude textuelle sans fusionner ni harmoniser les deux témoins.
translation_notes:
  register: Formulation proverbiale, brève et nominale, dans un français moderne et digne. La répétition d’« inutile » reproduit la symétrie de שוא dans les deux membres. Le caractère obscur de l’hébreu est conservé plutôt que résolu par une paraphrase.
