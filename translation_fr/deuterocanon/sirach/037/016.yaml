  verdict: revise
  source_fidelity: Le texte principal suit bien le témoin hébreu et maintient son parallélisme ainsi que l’obscurité de מוציא רע (« celui qui fait surgir le mal »). Toutefois, « inutile à celui qui » rend de façon peu claire le rapport exprimé par על (« sur / auprès de »), et l’adjectif « inutile » appliqué directement aux deux agents est moins idiomatique dans ce second membre.
  naturalness: La formulation est globalement sobre et proverbiale, mais « un gardien inutile à celui qui fait surgir le mal » est une construction peu naturelle et ambiguë en français. Une légère explicitation verbale rend les deux membres lisibles tout en conservant leur caractère elliptique et symétrique.
  terminology: « Ouvrier » et « gardien » conviennent. « En vain » rend שוא sans l’ambiguïté française de « vain » appliqué à une personne (orgueilleux), et conserve l’idée de futilité. « Très-Haut » est un rendu établi et neutre de ὕψιστος dans la note.
