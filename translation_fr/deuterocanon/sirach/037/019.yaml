translation:
  language: fr
  text: 'Il y a aussi un homme avisé, au discernement intérieur : qui se fiera à toi plus qu’à lui ?[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec est très différent : « Il y a un homme habile, instructeur de beaucoup, mais il est inutile à sa propre âme. » Il reflète probablement une autre forme hébraïque du verset ou une tradition textuelle sensiblement divergente.'
    reason: alternative_reading
  - marker: b
    text: L’hébreu, très concis, dit littéralement « conseil du cœur » et sa dernière proposition est difficile. Elle peut aussi avoir été comprise comme évoquant la confiance que l’homme avisé place dans son propre discernement.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וגם
  choice: Il y a aussi
  rationale: L’hébreu introduit un cas supplémentaire de manière elliptique ; « Il y a » explicite naturellement cette construction en français.
- source_word: עצת לבב
  choice: les réflexions du cœur
  rationale: Littéralement « le conseil du cœur ». Dans le langage sapientiel, le cœur désigne le siège de la réflexion et du discernement ; cette formulation française conserve l’image tout en restant intelligible.
- source_word: הבין
  choice: un homme avisé qui comprend
  rationale: La forme désigne ici vraisemblablement une personne douée de discernement. « Homme avisé » respecte le masculin singulier et « qui comprend » maintient le lien verbal avec les réflexions du cœur.
- source_word: מי יאמן לך
  choice: qui se fiera à toi
  rationale: La tournure exprime la confiance accordée à quelqu’un. Le pronom לך est conservé par « à toi », sans supprimer le passage à la deuxième personne.
- source_word: אמן ממנו
  choice: plus que lui
  rationale: Le texte transmis est elliptique, mais ממנו porte vraisemblablement une comparaison. La traduction conserve celle-ci sans en préciser excessivement le rapport.
theological_decisions:
- issue: Masculin singulier du personnage sapientiel
  choice: un homme avisé
  alternative: une personne avisée
  rationale: Le masculin singulier de l’hébreu est rendu directement, sans lui attribuer une portée doctrinale supplémentaire.
- issue: Relation entre l’hébreu difficile et le parallèle grec divergent
  choice: Traduire le texte hébreu en conservant sa question et sa comparaison
  alternative: 'Suivre le grec : « Il y a un homme habile, qui en instruit beaucoup, mais qui ne se rend aucun service à lui-même »'
  rationale: Puisque l’hébreu est attesté, il demeure le texte principal. Le grec représente ici une tradition nettement différente et doit être signalé plutôt que substitué au texte hébreu.
- issue: Ambiguïté de la confiance dans la proposition finale
  choice: qui se fiera à toi plus que lui ?
  alternative: dont le propre discernement est digne de confiance à ses yeux
  rationale: La formulation retenue préserve la deuxième personne, l’interrogation et la comparaison visibles dans l’hébreu, au lieu de les résoudre silencieusement en confiance dans son propre jugement.
translation_notes:
  register: Français international moderne, sobre et sapientiel. La formulation garde l’image biblique du cœur tout en l’éclairant par « réflexions » ; elle conserve également la rupture à la deuxième personne et l’ellipse comparative de l’hébreu.
