translation_notes:
  register: Français international moderne, sobre et proverbial. L’image hébraïque de la main est maintenue dans le texte principal, tandis qu’une note en donne le sens probable. La formulation « dans son propre intérêt » exprime naturellement le conseil intéressé soutenu par le parallèle grec.
