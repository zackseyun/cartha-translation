  text: Every counselor waves his hand[b][a], but there is a counselor whose advice is for himself.
translation:
  language: fr
  text: Tout conseiller agite la main[b], mais il en est un qui conseille dans son propre intérêt[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La fin de l’hébreu fourni est difficile. Le parallèle grec porte : « mais il en est un qui conseille pour lui-même », ce qui appuie le sens retenu ici.'
    reason: textual_variant
  - marker: b
    text: 'Ou, de manière plus explicite : « Tout conseiller propose ses conseils, mais certains conseillent dans leur propre intérêt. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: כל יועץ
  choice: Tout conseiller
  rationale: Le tour distributif convient à cette maxime et désigne chaque personne qui se présente comme conseillère.
- source_word: יניף יד
  choice: agite la main
  rationale: Cette formulation conserve l’image hébraïque, quelque peu obscure, du mouvement de la main; le parallèle grec indique qu’il s’agit vraisemblablement de mettre en avant ou de proposer un conseil.
- source_word: אך
  choice: mais
  rationale: La conjonction introduit le contraste et l’avertissement qui corrigent l’énoncé général.
- source_word: יש יועץ
  choice: il en est un qui conseille
  rationale: Cette tournure française naturelle rend l’existence d’un certain type de conseiller tout en évitant une répétition pesante.
- source_word: דרך אל לץ
  choice: dans son propre intérêt
  rationale: La fin du texte hébreu fourni est difficile et paraît légèrement altérée. Le grec εἰς αὐτόν, «pour lui-même», appuie l’idée d’un conseil intéressé, formulée ici en français courant sans masquer l’incertitude textuelle.
