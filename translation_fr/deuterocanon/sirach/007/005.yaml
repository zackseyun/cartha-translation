  text: Do not seek to become a ruler if you have no strength to put an end to insolence[a].
translation:
  language: fr
  text: Ne cherche pas à devenir dirigeant si tu n’as pas la force de mettre fin à l’insolence.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Ne te justifie pas devant le Seigneur et, devant un roi, ne fais pas étalage de sagesse », ce qui reflète une forme du verset très différente.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תְּבַקֵּשׁ
  choice: Ne cherche pas
  rationale: La négation suivie de בקש exprime naturellement l’interdiction de rechercher ou de poursuivre une position; « Ne cherche pas » est direct et idiomatique.
- source_word: לִהְיוֹת מוֹשֵׁל
  choice: à devenir dirigeant
  rationale: מושל désigne une personne qui gouverne ou exerce l’autorité. « Devenir dirigeant » conserve l’idée d’aspirer à cette fonction sans préciser indûment une forme particulière de gouvernement.
- source_word: חַיִל
  choice: la force
  rationale: חיל peut évoquer la force, la capacité, les moyens ou les ressources. « Force » préserve l’énergie du terme hébreu tout en pouvant désigner ici la capacité effective de gouverner.
- source_word: לְהַשְׁבִּית
  choice: de mettre fin à
  rationale: La forme causative de שבת signifie faire cesser. « Mettre fin à » exprime une cessation décisive dans un français naturel.
- source_word: זָדוֹן
  choice: l’insolence
  rationale: זדון désigne l’orgueil présomptueux, l’arrogance ou la conduite insolente. « Insolence » rend sa dimension à la fois sociale et morale.
- source_word: μὴ δικαίου ἔναντι Κυρίου, καὶ παρὰ βασιλεῖ μὴ σοφίζου
  choice: lecture secondaire signalée en note, non suivie dans le texte principal
  rationale: Le grec diverge profondément de l’hébreu conservé et paraît témoigner d’une autre forme textuelle. L’hébreu est donc traduit dans le texte principal, tandis que le grec est rendu en note.
theological_decisions:
- issue: Divergence entre les formes hébraïque et grecque de Siracide 7.5
  choice: Suivre l’hébreu conservé dans le texte principal.
  alternative: 'Suivre le grec : « Ne te justifie pas devant le Seigneur et, devant un roi, ne fais pas étalage de sagesse. »'
  rationale: Lorsque le texte hébreu du Siracide est conservé avec une bonne assurance, il sert de source principale. La divergence grecque, substantielle et théologiquement pertinente, est préservée explicitement en note plutôt que harmonisée.
translation_notes:
  register: Français international moderne, clair et digne. « Dirigeant » est choisi comme terme général pour une personne exerçant l’autorité; « tu » correspond à l’adresse sapientielle directe. La ponctuation place l’appel de note immédiatement après la proposition concernée.
