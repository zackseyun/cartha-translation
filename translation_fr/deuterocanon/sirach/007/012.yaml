  text: Do not plot violence against a brother, nor do the like against a friend or companion together.
translation:
  language: fr
  text: Ne trame pas de violence contre un frère, ni de même contre un ami et un compagnon, tous deux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּחֲרוֹשׁ
  choice: trame
  rationale: Le verbe signifie littéralement « labourer », mais prend ici le sens figuré de préparer ou machiner en secret. « Tramer » conserve l’idée d’une action délibérément ourdie tout en restant naturel en français.
- source_word: חָמָס
  choice: violence
  rationale: Rend directement le champ sémantique de la violence, du tort violent et de la brutalité, sans l’atténuer en simple tromperie.
- source_word: אָח
  choice: un frère
  rationale: Traduction formelle du terme hébreu, qui peut désigner un frère au sens propre ou, plus largement, un membre de la communauté; l’ambiguïté est conservée.
- source_word: רֵעַ וְחָבֵר
  choice: un ami ou un compagnon
  rationale: Les deux termes proches sont maintenus afin de préserver l’accumulation relationnelle de l’hébreu. « Ou » exprime naturellement en français la portée distributive de l’interdiction.
- source_word: יַחְדָּו
  choice: pareillement
  rationale: Dans cette formulation, le mot renforce l’application commune de l’interdiction aux relations mentionnées. Une traduction mécanique par « ensemble » serait ambiguë et peu naturelle en français.
theological_decisions: []
translation_notes:
  register: Impératif négatif direct, sobre et proverbial. Le français est moderne et digne; il conserve les trois désignations relationnelles et l’image de violence préméditée, sans reproduire littéralement la métaphore agricole devenue opaque.
