translation:
  language: fr
  text: 'Ne t’empresse pas de me dire : « Fais irruption ! »[a] Confie-toi à Dieu et accepte sa voie.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est difficile. Le mot peut être compris comme un impératif : « Fais irruption ! » ou « Franchis ! »; il peut aussi être pris au sens de « brèche ».'
    reason: Préserver l’incertitude lexicale et syntaxique de פָּרֶץ sans privilégier indûment le sens causatif « ouvrir une brèche ».
  - marker: b
    text: 'Le grec présente ici un texte entièrement différent : « Humilie profondément ton âme. »'
    reason: Signaler la divergence ancienne majeure avec le parallèle grec, qui est aussi à la base de la version anglaise consultative.
lexical_decisions:
- source_word: תָּאִיץ
  choice: te hâte
  rationale: Le hifil de אוץ exprime ici l’empressement ou la précipitation; « te hâte » reste naturel et proche de l’hébreu.
- source_word: פָרֶץ
  choice: Ouvre une brèche !
  rationale: La forme peut évoquer l’action de faire irruption ou d’ouvrir une brèche. L’impératif français conserve la lecture suggérée par la ponctuation de l’édition, sans préciser ce qui doit être franchi.
- source_word: גֹּל אֶל אֵל
  choice: Remets-toi à Dieu
  rationale: Littéralement, « roule vers Dieu »; il s’agit d’une image sémitique signifiant confier ou remettre son sort à Dieu.
- source_word: וּרְצֵה דַרְכּוֹ
  choice: et accepte sa voie
  rationale: רצה peut signifier agréer, accueillir favorablement ou accepter; « accepte » rend clairement l’impératif, tandis que « sa voie » conserve le référent divin.
theological_decisions:
- issue: Divergence entre le texte hébreu et le parallèle grec
  choice: Traduire le texte hébreu fourni dans le corps du verset et signaler la leçon grecque en note
  alternative: 'Suivre le grec : « Humilie profondément ton âme. »'
  rationale: La consigne donne priorité aux données de la langue originale et attribue une confiance élevée au texte hébreu, tout en signalant une discordance mineure. La divergence est substantielle et ne doit pas être harmonisée silencieusement.
- issue: Sens de l’abandon à Dieu
  choice: « Remets-toi à Dieu »
  alternative: « Confie cela à Dieu »
  rationale: L’objet de גֹּל n’est pas exprimé. La formulation retenue évite d’en introduire un arbitrairement et conserve l’appel général à s’en remettre à Dieu.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier correspond aux formes masculines singulières de l’hébreu. La formulation privilégie le témoin hébreu fourni sans masquer son caractère difficile ni la divergence du grec.
