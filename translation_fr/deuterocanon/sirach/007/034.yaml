  text: Give a gift before every living person[a], and do not withhold kindness even from the dead.
translation:
  language: fr
  text: Donne un présent devant toute personne vivante[a], et ne prive pas même un mort de ta bonté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Ne néglige pas ceux qui pleurent, et prends le deuil avec ceux qui sont en deuil. » Il témoigne ici d’une tradition textuelle sensiblement différente.'
    reason: textual_variant
lexical_decisions:
- source_word: תֵּן מַתָּן
  choice: Donne un présent
  rationale: L’impératif et son complément expriment directement l’action de donner. « Présent » garde le sens large de מַתָּן sans connotation cultuelle particulière.
- source_word: לִפְנֵי כָל חָי
  choice: devant toute personne vivante
  rationale: Rend au plus près לִפְנֵי (« devant, en présence de ») et explicite naturellement en français le référent humain de כָל חָי.
- source_word: וְגַם מִמֵּת
  choice: même à un mort
  rationale: La tournure française exprime la valeur additive et emphatique de וְגַם. Bien que מִן marque formellement la provenance ou la séparation, le verbe « refuser » appelle naturellement « à » en français.
- source_word: אַל תִּמְנַע חָסֶד
  choice: ne refuse pas ta bonté
  rationale: מנע signifie retenir ou refuser, tandis que חֶסֶד désigne ici une bonté concrète et fidèle. L’ajout possessif requis par le français rend cette qualité mise en œuvre sans en restreindre la portée à la seule miséricorde.
theological_decisions:
- issue: Rapport entre le texte hébreu et la tradition grecque divergente
  choice: Traduire le texte hébreu conservé comme texte principal.
  alternative: « Ne néglige pas ceux qui pleurent, et prends le deuil avec ceux qui sont en deuil. »
  rationale: Le texte hébreu est ici disponible et bénéficie donc de la priorité. Le grec représente une tradition textuelle sensiblement différente, qui doit être signalée sans remplacer la leçon hébraïque.
translation_notes:
  register: Français moderne, direct et proverbial, avec tutoiement singulier conforme aux impératifs hébreux. La formulation conserve l’étrangeté mesurée de « devant toute personne vivante » plutôt que de résoudre silencieusement le rapport exact exprimé par לִפְנֵי.
