base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/024.yaml
  text: Do you have daughters? Guard their chastity[a], and do not show them a cheerful face.
translation:
  language: fr
  text: As-tu des filles ? Veille sur leur corps et ne leur montre pas un visage souriant.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ne fais pas briller ton visage vers elles ». Cette expression signifie probablement : « ne sois pas trop indulgent envers elles ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנוֹת לְךָ / θυγατέρες σοί εἰσιν
  choice: As-tu des filles ?
  rationale: L’expression hébraïque elliptique, confirmée par la tournure existentielle grecque, introduit naturellement en français une question à valeur conditionnelle suivie d’une exhortation.
- source_word: נְצוֹר / πρόσεχε
  choice: Veille sur
  rationale: L’impératif hébreu signifie garder ou surveiller, tandis que le grec souligne l’attention vigilante. « Veille sur » exprime une protection attentive sans ajouter une idée étrangère au texte.
- source_word: שְׁאֵרָם / τῷ σώματι αὐτῶν
  choice: leur corps
  rationale: Le nom hébreu peut désigner la chair, et le grec l’interprète explicitement comme le corps. Cette traduction conserve le référent concret sans réduire le propos à la seule chasteté.
- source_word: וְאַל תָּאִיר אֲלֵיהֶם פָּנִים / καὶ μὴ ἱλαρώσῃς πρὸς αὐτὰς τὸ πρόσωπόν σου
  choice: ne leur montre pas un visage souriant
  rationale: La formulation garde l’image concrète du visage rendu lumineux ou joyeux, également attestée par le grec, tout en restant compréhensible en français. La note indique le sens probable de l’idiome.
theological_decisions:
- issue: Portée éthique de l’avertissement parental
  choice: Conserver l’image du visage souriant et expliquer son sens probable en note.
  alternative: Ne sois pas trop indulgent envers elles.
  rationale: La formulation imagée évite d’imposer au texte une théorie moderne précise de l’éducation. Elle maintient aussi la tension du conseil ancien, tandis que la note rend explicite son probable avertissement contre une indulgence excessive.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement singulier correspond à l’adresse hébraïque. « Leur corps » suit le texte concret, éclairé par le parallèle grec, plutôt que l’interprétation plus étroite « leur chasteté ».
