base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/028.yaml
  text: Remember that if not for them[a], you would not have come into the world[b]; and what can you do for them as they have done for you?
translation:
  language: fr
  text: Souviens-toi que, sans eux[a], tu ne serais pas venu au monde. Et que peux-tu faire pour eux qui soit à la mesure de ce qu’ils ont fait pour toi[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit de tes parents; le contexte fournit le référent du pronom.
    reason: cross_reference
  - marker: b
    text: 'Le grec formule plus explicitement la question en termes de contrepartie : « que leur rendras-tu, comme eux [ont fait] pour toi ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכוֹר
  choice: Souviens-toi
  rationale: L’impératif de זכר appelle à garder activement à l’esprit; « Souviens-toi » est direct, naturel et digne.
- source_word: לוּלֵי הֵם
  choice: sans eux
  rationale: Cette tournure rend clairement la dépendance contrefactuelle exprimée par l’hébreu, en accord avec le grec διʼ αὐτῶν.
- source_word: לֹא בָאתָ לָעוֹלָם
  choice: tu ne serais pas venu au monde
  rationale: La formulation conserve l’image hébraïque de la venue au monde tout en exprimant naturellement la valeur contrefactuelle en français.
- source_word: וּמָה אַתָּה עוֹשֶׂה לָהֶם
  choice: Et que peux-tu faire pour eux
  rationale: Le présent hébreu forme une question rhétorique. « Peux-tu » en fait ressortir la portée sans imposer trop explicitement la notion de remboursement.
- source_word: שֶׁהֵם גּוֹמְלִים לָךְ
  choice: qui soit à la mesure de ce qu’ils ont fait pour toi
  rationale: גמל peut évoquer l’action bienfaisante ou la rétribution. La formulation française exprime la comparaison et l’impossibilité implicite d’une contrepartie équivalente, sans réduire le propos à un remboursement matériel.
theological_decisions:
- issue: Référent du pronom « eux »
  choice: Conserver le pronom dans le texte et préciser en note qu’il s’agit des parents
  alternative: Insérer « tes parents » directement dans le texte
  rationale: Le contexte immédiat identifie le père et la mère, mais l’hébreu comme le grec gardent le référent sous forme pronominale. La traduction préserve cette forme.
- issue: Nature de la réciprocité envers les parents
  choice: « à la mesure de ce qu’ils ont fait pour toi »
  alternative: « comment les récompenseras-tu comme ils t’ont récompensé ? »
  rationale: Le grec explicite la contrepartie par ἀνταποδώσεις, tandis que l’hébreu emploie עשה et גמל. Le choix retient l’idée de proportion et la tension rhétorique sans introduire une doctrine particulière de la dette filiale.
translation_notes:
  register: Français international moderne, au tutoiement singulier conformément à l’adresse hébraïque. Ton sapiential, simple et digne. La première phrase suit de près l’hébreu; la seconde privilégie une formulation idiomatique qui conserve la question rhétorique et la notion de réciprocité.
