  text: Do not trade away a friend for a price[c][b][a], or a brother who is worth the gold of Ophir.
translation:
  language: fr
  text: N’échange pas un ami contre un paiement[a], ni un frère[b] qui vaut l’or d’Ophir[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « contre de l’argent ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « frère » peut désigner un frère au sens propre ou, plus largement, un proche parent ou un compagnon intime.
    reason: lexical_alternative
  - marker: c
    text: 'Le grec présente ici une lecture très différente : « Souviens-toi que la colère ne dure pas longtemps. » Le témoin hébreu conservé dans la Guéniza du Caire met plutôt en garde contre l’échange d’un ami ou d’un frère contre des richesses.'
    reason: textual_variant
lexical_decisions:
- source_word: תָּמִיר
  choice: échange
  rationale: Le hifil de מור exprime ici l’échange ou la substitution. « Échange » conserve directement l’image commerciale sans ajouter l’idée de trahison ou d’abandon.
- source_word: אוֹהֵב
  choice: ami
  rationale: Bien que le terme désigne littéralement « celui qui aime », il prend couramment dans la littérature de sagesse le sens d’ami ou de compagnon fidèle.
- source_word: בִּמְחִיר
  choice: contre un prix
  rationale: מחיר désigne un prix ou une contrepartie. Cette formulation maintient la métaphore marchande et reste moins restrictive que « contre de l’argent ».
- source_word: אָח
  choice: frère
  rationale: Le sens premier est « frère ». Le mot peut aussi désigner un proche parent ou un compagnon intime, possibilité signalée en note plutôt qu’intégrée au texte.
- source_word: תָּלוּי
  choice: qui vaut
  rationale: La forme hébraïque est difficile. Dans le parallélisme entre le prix et l’or d’Ophir, elle semble exprimer une estimation ou une comparaison de valeur. « Qui vaut » donne un sens français clair sans imposer une reconstruction technique.
- source_word: בִּזְהַב אוֹפִיר
  choice: l’or d’Ophir
  rationale: Ophir est présenté dans la Bible comme une provenance d’or particulièrement précieux. Le maintien du nom propre conserve cette résonance culturelle.
theological_decisions:
- issue: Choix entre le témoin hébreu et la lecture grecque
  choice: Le texte principal suit l’hébreu conservé dans les manuscrits de la Guéniza du Caire.
  alternative: 'Le grec lit : « Souviens-toi que la colère ne dure pas longtemps. »'
  rationale: Puisque le texte hébreu subsiste ici, il sert de source principale. La divergence radicale du grec témoigne toutefois d’une tradition textuelle instable et doit être signalée, car elle change entièrement le sens du verset.
- issue: Portée du mot אָח
  choice: Conserver « frère » dans le texte principal.
  alternative: « proche parent » ou « compagnon intime »
  rationale: Le terme concret ne doit pas être élargi sans nécessité, mais son emploi relationnel plus large demeure possible dans la littérature de sagesse.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve le registre commercial du parallélisme hébreu et maintient l’expression traditionnelle « l’or d’Ophir ». La difficulté de תָּלוּי est rendue par une expression claire mais non dogmatique.
