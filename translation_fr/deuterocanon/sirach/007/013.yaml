translation:
  language: fr
  text: Ne prends pas plaisir à ajouter mensonge à mensonge[a], car l’issue n’en sera pas bonne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « mentir sur le mensonge ». L’expression peut évoquer le fait d’ajouter mensonge à mensonge ou de répéter des mensonges. Le grec porte : « tout mensonge », ce qui peut viser plus largement la pratique du mensonge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְפֹּץ
  choice: prends plaisir
  rationale: Le verbe חפץ exprime le désir ou le plaisir que l’on trouve à quelque chose. Cette formulation française conserve la nuance volontaire de l’admonition.
- source_word: לְכַחֵש עַל כָּחַש
  choice: à ajouter mensonge à mensonge
  rationale: Littéralement, l’hébreu évoque le fait de « mentir sur le mensonge ». La traduction retient naturellement la force cumulative de la construction, sans masquer son caractère idiomatique.
- source_word: תִקְוָתוֹ
  choice: l’issue n’en
  rationale: תקוה signifie ordinairement « espoir » ou « attente » ; rapporté ici au mensonge, il désigne vraisemblablement ce qu’on peut en attendre, donc son issue.
- source_word: לֹא תִנְעָם
  choice: ne sera pas bonne
  rationale: Le verbe נעם évoque ce qui est agréable ou plaisant. « Ne sera pas bonne » rend le sens contextuel avec naturel et concorde avec le parallèle grec οὐκ εἰς ἀγαθόν, « ne mène pas au bien ».
