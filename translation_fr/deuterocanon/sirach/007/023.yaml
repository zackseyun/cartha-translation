  text: Do you have sons? Discipline them[a], and get wives for them in their youth.
translation:
  language: fr
  text: As-tu des fils ? Discipline-les[a] et trouve-leur des épouses pendant qu’ils sont jeunes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec dit : « As-tu des enfants ? Éduque-les et courbe-leur la nuque dès leur jeunesse. » Le témoin hébreu porte plutôt : « …et trouve-leur des épouses pendant qu’ils sont jeunes. »'
    reason: alternative_reading
lexical_decisions:
- source_word: בָּנִים
  choice: fils
  rationale: Le pluriel masculin désigne ici des fils; l’instruction suivante, qui parle de leur trouver des femmes, confirme ce sens précis plutôt que le sens plus général d’« enfants ».
- source_word: יַסֵּר
  choice: corrige-les
  rationale: Le verbe יסר exprime une instruction corrective. « Corrige-les » est naturel en français actuel et garde l’idée de redressement éducatif sans archaïsme.
- source_word: וְשָׂא לָהֶם נָשִׁים
  choice: trouve-leur des femmes
  rationale: L’expression hébraïque évoque le rôle parental consistant à procurer ou organiser un mariage. Cette formulation française est claire sans ajouter explicitement une institution matrimoniale absente des mots eux-mêmes.
- source_word: בִּנְעוּרֵיהֶם
  choice: pendant leur jeunesse
  rationale: L’expression situe l’action au cours de leurs jeunes années. « Pendant leur jeunesse » rend clairement cette valeur temporelle et évite de reprendre le « dès leur jeunesse » du grec, qui dépend d’une autre proposition.
theological_decisions:
- issue: Divergence entre le texte hébreu et le parallèle grec dans le second membre
  choice: 'Suivre l’hébreu : « trouve-leur des femmes pendant leur jeunesse »'
  alternative: 'Suivre le grec : « courbe-leur la nuque dès leur jeunesse »'
  rationale: Le témoin hébreu conservé est prioritaire et présente ici une leçon cohérente. Le grec témoigne d’une formulation nettement différente; elle est conservée en note afin de ne pas masquer la tension textuelle.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement conserve l’adresse individuelle de l’hébreu. « Corrige-les » rend la discipline éducative; la note signale intégralement la variante grecque substantielle.
