  text: Do not delay with those who weep[a], and mourn with those who mourn.
translation:
  language: fr
  text: Ne tarde pas à te joindre à ceux qui pleurent[a], et prends part au deuil de ceux qui sont en deuil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin grec porte : « N’hésite pas à rendre visite à un malade, car, par de tels actes, tu seras aimé. » Cette lecture diffère sensiblement de l’hébreu conservé.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּתְאַחֵר
  choice: Ne tarde pas
  rationale: La négation suivie de la forme verbale exprime une interdiction de différer ou de se tenir en retrait. « Ne tarde pas » est direct, actuel et conserve l’idée d’urgence.
- source_word: מִבּוֹכִים
  choice: à te joindre à ceux qui pleurent
  rationale: Pris strictement, מִן pourrait suggérer « loin de », mais le parallélisme avec l’appel à partager le deuil indique ici la solidarité avec ceux qui pleurent. L’ajout idiomatique « te joindre à » rend ce rapport clairement en français sans effacer la difficulté de la construction hébraïque.
- source_word: אֲבֵלִים
  choice: ceux qui sont en deuil
  rationale: Le terme désigne les personnes qui portent le deuil. Cette formulation naturelle garde le cadre concret du deuil mieux que le terme plus général « affligés ».
- source_word: תִּתְאַבָּל
  choice: prends le deuil
  rationale: La forme verbale appelle à entrer dans le deuil avec autrui. « Prends le deuil » préserve cette valeur concrète et volontaire, tandis que « afflige-toi » serait moins actuel et « pleure » ferait disparaître le lien lexical avec le deuil.
theological_decisions:
- issue: Rapport entre les témoins hébreu et grec
  choice: Le texte principal suit l’hébreu conservé et exhorte à partager les pleurs et le deuil d’autrui.
  alternative: 'Le grec porte : « N’hésite pas à rendre visite à un malade, car par de tels actes tu seras aimé. »'
  rationale: Lorsque l’hébreu du Siracide est conservé avec une bonne confiance textuelle, il sert de source principale. Le grec présente ici une lecture substantiellement différente, qui doit être signalée plutôt que fusionnée avec l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme est conservé, avec une formulation concrète qui invite à une solidarité active dans le deuil.
