  text: Do not mistreat a faithful servant[b][a], nor a hired laborer who gives himself.
translation:
  language: fr
  text: Ne maltraite pas un travailleur fidèle[a], ni un salarié qui se donne tout entier[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « un travailleur de vérité »; le grec porte : « un serviteur de maison qui travaille avec fidélité ». Il s’agit d’une personne qui travaille honnêtement et loyalement.'
    reason: lexical_alternative
