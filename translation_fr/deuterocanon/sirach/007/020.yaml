  terminology: Les choix de « travailleur », « fidèle » et « salarié » maintiennent la distinction entre les deux catégories sans imposer une lecture sociale ou théologique particulière. Les notes distinguent correctement le libellé hébreu du contrôle fourni par le grec. Les ancres [a] et [b] sont correctement placées et correspondent à leurs notes.
