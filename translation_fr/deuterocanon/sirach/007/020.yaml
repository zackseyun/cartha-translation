translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier convient à la forme sapientielle de l’exhortation. « Se donne tout entier » évite l’ambiguïté potentiellement mortelle de « donne sa vie » tout en gardant la force de ψυχή et l’idée de dévouement complet.
