    text: 'La formulation hébraïque de cette proposition est difficile. Le grec porte : « un salarié qui donne son âme [ou sa vie] ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תָּרֵעַ
  choice: Ne maltraite pas
  rationale: Le verbe רעע exprime ici le fait de faire du mal ou de traiter injustement quelqu’un. « Maltraiter » est naturel en français et concorde avec le grec κακόω.
- source_word: עוֹבֵד אֱמֶת
  choice: un travailleur fidèle
  rationale: L’expression hébraïque signifie littéralement « travailleur de vérité ». Dans ce contexte, אֱמֶת qualifie vraisemblablement un travail honnête et loyal. « Travailleur » conserve le sens large de עוֹבֵד, tandis que le grec précise « serviteur de maison ».
- source_word: וְכֵן
  choice: ni
  rationale: Après une première interdiction négative, « ni » rend naturellement en français la coordination parallèle introduite par « et de même ».
- source_word: שׁוֹמֵר
  choice: un salarié
  rationale: Le mot hébreu transmis signifie normalement « gardien » ou « celui qui garde », mais la formulation est difficile. Le parallèle grec μίσθιον, « salarié, ouvrier à gages », fournit ici un appui textuel important.
- source_word: נוֹחֵן נַפְשׁוֹ
  choice: qui se donne tout entier
  rationale: Le texte hébreu transmis est difficile, tandis que le grec porte « qui donne son âme/sa vie ». L’expression française retenue communique un engagement personnel total sans suggérer nécessairement une mort littérale.
