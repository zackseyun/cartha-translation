  source_fidelity: La traduction rend fidèlement l’interdiction אַל תָּרֵעַ par « Ne maltraite pas ». « Un travailleur fidèle » exprime naturellement עוֹבֵד אֱמֶת, dont la portée peut être celle d’un travail honnête, loyal ou fiable. Pour le second membre textuellement difficile, « un salarié » est solidement appuyé par le grec μίσθιον, et « qui se donne tout entier » transmet sans excès l’idée grecque de διδόντα ψυχὴν αὐτοῦ. La note conserve explicitement la difficulté de l’hébreu et l’alternative grecque « donne son âme [ou sa vie] ».
