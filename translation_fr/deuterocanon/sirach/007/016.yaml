translation:
  language: fr
  text: Abaisse profondément ton orgueil[a], car l’espérance de l’être humain, ce sont les vers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle dit : « Ne te compte pas parmi la multitude des pécheurs. » Il semble représenter une autre tradition textuelle, et non une simple différence de formulation.'
    reason: textual_variant
lexical_decisions:
- source_word: מְאֹד מְאֹד
  choice: profondément
  rationale: Le redoublement intensifie fortement l’impératif. « Profondément » restitue cette insistance en français naturel et digne, sans la répétition peu idiomatique « très, très ».
- source_word: הַשְׁפִּיל
  choice: Abaisse
  rationale: L’impératif hiphil de שׁפל exprime l’action de faire descendre ou de rabaisser. « Abaisse » conserve directement cette image et la force impérative.
- source_word: גַּאֲוָה
  choice: ton orgueil
  rationale: Le nom désigne l’orgueil ou la hauteur de soi. Le possessif, implicite dans l’exhortation personnelle, rend la phrase naturelle en français sans en changer la portée.
- source_word: תִקְוַת
  choice: l’espérance de
  rationale: תקוה signifie normalement « espérance » ou « attente ». La traduction conserve cette formulation frappante au lieu de l’interpréter comme « fin » ou « destinée ».
- source_word: אֱנוֹשׁ
  choice: l’être humain
  rationale: אֱנוֹשׁ évoque l’humain dans sa fragilité mortelle. « L’être humain » garde la valeur générique sans employer le masculin « l’homme », potentiellement ambigu en français actuel.
- source_word: רִמָּה
  choice: les vers
  rationale: Le terme désigne les vers ou la vermine liés à la décomposition. Le pluriel français exprime naturellement l’image de la mortalité corporelle.
theological_decisions:
- issue: Divergence majeure entre le témoin hébreu et le parallèle grec
  choice: 'Suivre l’hébreu conservé : « Abaisse profondément ton orgueil, car l’espérance de l’être humain, ce sont les vers. »'
  alternative: 'Le grec porte : « Ne te compte pas parmi la multitude des pécheurs. »'
  rationale: Le texte hébreu est ici disponible avec une confiance élevée et constitue la source principale. Le grec témoigne d’une tradition textuelle sensiblement différente, qui doit être signalée plutôt qu’harmonisée avec l’hébreu.
- issue: Formulation paradoxale « l’espérance… ce sont les vers »
  choice: Conserver littéralement la tension de l’hébreu
  alternative: Interpréter תקוה comme « fin », « sort » ou « perspective »
  rationale: Le sens usuel de תקוה est « espérance » ou « attente ». La formulation sombre et paradoxale relie l’abaissement de l’orgueil à la mortalité humaine; la résoudre par une paraphrase ferait disparaître cette tension.
translation_notes:
  register: Français moderne international, sobre et sapiential. L’impératif demeure direct; « profondément » transmet l’intensité du redoublement hébreu avec naturel. La construction « ce sont les vers » conserve la rudesse et le paradoxe du texte source.
