  source_fidelity: La première proposition hébraïque et le parallèle grec emploient tous deux le verbe concret « lier/attacher », dans une expression dont la force idiomatique est de déconseiller la répétition du péché. « Ne lie pas le péché » est trop opaque en français moderne et risque d’être compris littéralement, sans transmettre l’avertissement. « Ne commets pas deux fois le même péché » rend avec sûreté le sens de répétition; « même péché » explicite le référent normalement impliqué par « une seconde fois ». La seconde proposition conserve correctement l’idée qu’un seul péché suffit pour que l’on ne soit pas impuni. L’explicitation de « péché » après « un seul » est nécessaire en français et ne modifie pas le sens.
  naturalness: Le texte révisé est naturel, sobre et idiomatique en français international moderne. Il évite l’expression non idiomatique « lier le péché » ainsi que l’ellipse quelque peu heurtée « même pour un seul ».
