translation:
  language: fr
  text: Ne commets pas deux fois le même péché, car, même pour un seul péché, tu ne resteras pas impuni[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu ne seras pas acquitté » ou « tu ne seras pas tenu pour innocent ». L’hébreu et le grec peuvent exprimer une nuance judiciaire aussi bien que l’idée de ne pas échapper à la punition.'
    reason: Alternative lexicale préservant la portée judiciaire de לֹא תִנָּקֶה et de οὐκ ἀθῷος ἔσῃ.
lexical_decisions:
- source_word: אַל תִּקְשׁוֹר
  choice: Ne lie pas
  rationale: La prohibition directe rend אַל, tandis que « lie » conserve l’image concrète de קשר, également appuyée par le grec καταδεσμεύσῃς, sans la remplacer par l’interprétation « commettre » ou « ajouter ».
- source_word: לְשָׁנוֹת
  choice: une seconde fois
  rationale: L’infinitif exprime ici la répétition; cette formulation française est claire et correspond au grec δὶς.
- source_word: חֵטְ
  choice: le péché
  rationale: « Péché » est l’équivalent direct du nom hébreu et concorde avec le grec ἁμαρτίαν.
- source_word: כִּי
  choice: car
  rationale: « Car » maintient le lien causal bref entre l’interdiction et sa justification.
- source_word: בְאַחַת
  choice: même pour un seul
  rationale: La tournure explicite la valeur elliptique de « en/pour un » et le contraste entre la répétition envisagée et un seul péché, sans préciser davantage que le texte.
- source_word: לֹא תִנָּקֶה
  choice: tu ne resteras pas impuni
  rationale: Le nifal de נקה peut exprimer le fait d’être innocenté, déclaré quitte ou laissé impuni. Cette formulation naturelle conserve ici la force d’avertissement.
theological_decisions:
- issue: Valeur judiciaire ou pénale de לֹא תִנָּקֶה
  choice: tu ne resteras pas impuni
  alternative: tu ne seras pas acquitté / tu ne seras pas déclaré quitte
  rationale: Dans cette maxime de sagesse, la formulation pénale communique directement l’avertissement, tandis qu’une note préserve le sens judiciaire réellement possible en hébreu comme en grec.
- issue: Métaphore de l’action de lier le péché
  choice: Ne lie pas le péché
  alternative: N’ajoute pas un second péché / Ne commets pas le péché une seconde fois
  rationale: Le verbe hébreu et son parallèle grec emploient tous deux l’image de lier ou d’attacher. La conserver évite de résoudre silencieusement une expression difficile, même si elle est moins idiomatique en français.
translation_notes:
  register: Français international moderne, sobre et sapiential. Le tutoiement singulier rend l’adresse individuelle de l’hébreu. La métaphore inhabituelle « lier le péché » est volontairement conservée parce qu’elle est attestée à la fois par l’hébreu et le grec.
