  text: Do not cower before a noble[a], lest you set a bribe against your integrity.
translation:
  language: fr
  text: Ne te laisse pas intimider par un notable, de peur d’introduire un gain malhonnête dans ton intégrité.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « de peur de placer une pierre d’achoppement dans ta droiture ». L’hébreu emploie plus concrètement un terme désignant un gain avide ou malhonnête.'
    reason: alternative_reading
lexical_decisions:
- source_word: תָגוּר
  choice: te laisse pas intimider
  rationale: Dans ce contexte, גור exprime la crainte qui fait céder devant une personne influente. Cette formulation rend la déférence craintive suggérée aussi par le grec, sans réduire le terme à une peur ordinaire.
- source_word: נָדִיב
  choice: notable
  rationale: נדיב désigne ici un homme de rang ou d’influence. « Notable » conserve la nuance sociale de l’hébreu sans supposer un titre politique précis; le grec emploie δυνάστης, « puissant, dirigeant ».
- source_word: וְנָתוּן
  choice: introduire
  rationale: Le tour hébreu signifie littéralement « mettre, placer ». « Introduire » conserve l’image d’un élément corrupteur que l’on fait entrer dans son intégrité, tout en restant idiomatique en français.
- source_word: בֶּצַע
  choice: un gain malhonnête
  rationale: בצע désigne un profit recherché avec avidité ou obtenu injustement. « Gain malhonnête » reste plus proche et moins interprétatif que « pot-de-vin », même si le contexte judiciaire peut inclure la corruption.
- source_word: בִּתְמִימִיךָ
  choice: dans ton intégrité
  rationale: Le terme issu de תמים évoque la droiture, l’intégrité ou l’irréprochabilité. « Dans ton intégrité » respecte la préposition hébraïque et préserve la formulation tendue de l’image.
theological_decisions:
- issue: Interprétation de la formule hébraïque difficile וְנָתוּן בֶּצַע בִּתְמִימִיךָ à la lumière du grec καὶ θήσεις σκάνδαλον ἐν εὐθύτητί σου
  choice: Traduire directement l’hébreu comme l’introduction d’un gain malhonnête dans l’intégrité personnelle.
  alternative: « de peur de placer une pierre d’achoppement dans ta droiture », selon le grec.
  rationale: L’hébreu conservé est prioritaire et בצע évoque concrètement un profit injuste. Le grec témoigne toutefois d’une lecture plus générale portant sur un obstacle moral; cette variante est donc signalée sans harmoniser silencieusement les témoins.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier correspond à l’adresse sapientielle hébraïque. La formulation conserve volontairement l’image inhabituelle de quelque chose introduit « dans » l’intégrité, plutôt que de résoudre entièrement la difficulté du texte.
