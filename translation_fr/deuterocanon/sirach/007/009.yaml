  text: Do not be hasty in the army[a], for it is laborious work allotted by God.
translation:
  language: fr
  text: Ne te précipite pas dans l’armée[a], car c’est un travail pénible attribué par Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec porte : « Ne dis pas : “Il regardera la multitude de mes dons et, lorsque je ferai une offrande au Dieu Très-Haut, il l’acceptera.” » Cette leçon relève d’une tradition textuelle très différente de celle de l’hébreu conservé.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תָּאִיץ
  choice: Ne te précipite pas
  rationale: L’impératif négatif met en garde contre un empressement irréfléchi; cette formulation est naturelle en français et conserve l’idée de hâte.
- source_word: בַּצָּבָא
  choice: dans l’armée
  rationale: צָבָא désigne ici, selon le texte hébreu conservé, l’armée ou le service militaire. « Dans l’armée » en donne le sens direct sans harmonisation avec le grec divergent.
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: un travail pénible
  rationale: L’association de « travail » et de « service/labeur » souligne le caractère exigeant de la tâche; « travail pénible » rend clairement cette intensification.
- source_word: מֵאֵל נֶחֱלָקָה
  choice: attribué par Dieu
  rationale: Le passif de חלק exprime ce qui est réparti ou assigné, tandis que מֵאֵל peut indiquer la source ou l’agent. La formulation française conserve ici l’agence divine sans lourdeur.
theological_decisions:
- issue: Divergence substantielle entre le témoin hébreu et le parallèle grec
  choice: Le texte principal traduit le témoin hébreu conservé.
  alternative: 'Le grec porte : « Ne dis pas : “Il regardera la multitude de mes dons et, lorsque je ferai une offrande au Dieu Très-Haut, il l’acceptera.” »'
  rationale: Le texte hébreu disponible est prioritaire pour ce passage. Le grec paraît témoigner d’une autre tradition textuelle plutôt que d’une simple variante lexicale; sa leçon est donc signalée en note sans remplacer l’hébreu.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier correspond à l’adresse sapientielle. La syntaxe reste proche de l’hébreu tout en étant naturelle en français.
