base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/001.yaml
  text: Do not do evil[a], and evil will not overtake you; keep far from iniquity[b], and it will turn away from you.
translation:
  language: fr
  text: Ne fais pas le mal[a], et le mal ne te rattrapera pas ; tiens-toi loin de l’iniquité[b], et elle se détournera de toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dans la seconde proposition, le même mot hébreu peut aussi désigner un malheur ou un tort : « Ne fais pas le mal, et le malheur ne te rattrapera pas. » L’hébreu répète toutefois le même terme, tout comme le grec.'
    reason: lexical_alternative
  - marker: b
    text: 'La dernière proposition est concise en hébreu et peut aussi se comprendre : « et elle s’éloignera de toi ». L’idée est qu’en prenant ses distances avec l’iniquité, on voit celle-ci, ou le danger qui lui est lié, se détourner de soi.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּעַשׂ
  choice: Ne fais pas
  rationale: La défense formée avec עשה signifie directement « faire ». Cette tournure conserve la simplicité et la force de l’hébreu sans ajouter l’idée d’une pratique habituelle.
- source_word: רָעָה
  choice: le mal
  rationale: Le même nom est employé dans les deux propositions. « Le mal » préserve à la fois la portée morale du premier emploi et la symétrie rhétorique ; dans le second, le mot peut aussi évoquer le malheur qui en résulte.
- source_word: יַשִּׂיגְךָ
  choice: ne te rattrapera pas
  rationale: Le verbe נשׂג exprime ici l’idée d’atteindre quelqu’un en le poursuivant ou de le rattraper. La formulation française garde cette image dynamique et s’accorde avec le grec καταλάβῃ.
- source_word: הַרְחֵק מֵעָוֹן
  choice: tiens-toi loin de l’iniquité
  rationale: L’impératif appelle à prendre activement ses distances. « Tiens-toi loin » conserve la métaphore spatiale, tandis que « iniquité » rend le poids moral de עָוֹן.
- source_word: וְיֵט מִמְּךָ
  choice: et elle se détournera de toi
  rationale: La proposition hébraïque est concise. Le féminin « elle » reprend naturellement « l’iniquité » en français, tout en conservant l’idée qu’en s’en éloignant, on la voit se détourner de soi.
theological_decisions:
- issue: Mal moral ou malheur dans la répétition de רָעָה
  choice: Traduire les deux occurrences par « le mal » dans le texte principal.
  alternative: 'Traduire la seconde par « le malheur » ou « le tort » : « Ne fais pas le mal, et le malheur ne te rattrapera pas. »'
  rationale: L’hébreu répète le même terme, comme le grec parallèle. Maintenir « le mal » rend visible le lien délibéré entre l’acte mauvais et ce qui atteint son auteur, sans imposer une distinction absente du texte.
- issue: Sujet de la dernière proposition
  choice: Faire reprendre « l’iniquité » par le pronom « elle ».
  alternative: 'Comprendre plus largement que le danger ou l’effet de l’iniquité s’éloignera, et traduire : « et elle s’éloignera de toi » ou « et le mal s’éloignera de toi ».'
  rationale: Le texte ne nomme pas de nouveau sujet. La reprise du nom immédiatement précédent est grammaticalement naturelle, mais une note signale la concision et l’amplitude possibles de l’hébreu.
translation_notes:
  register: Français international moderne, direct et digne. Le parallélisme est conservé par la répétition de « le mal » ; « rattrapera » maintient l’image de poursuite, et « tiens-toi loin » celle de la distance. Les marqueurs de notes [a] et [b] figurent dans le texte.
