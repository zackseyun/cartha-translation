translation:
  language: fr
  text: Ne te décourage pas dans la prière, et ne néglige pas de faire l’aumône[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu צדקה peut aussi signifier « justice » ou « droiture » ; ici, le parallèle grec parle explicitement de « faire l’aumône », ce qui appuie le sens d’aide charitable.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתְקַצֵּר
  choice: Ne te décourage pas
  rationale: La forme hébraïque est difficile isolément, mais le parallèle grec μὴ ὀλιγοψυχήσῃς indique clairement l’idée de perdre courage ou de faiblir. « Ne te décourage pas » est naturel en français moderne sans suggérer qu’il s’agit simplement d’abréger la prière.
- source_word: בַּתְּפִלָּה
  choice: dans la prière
  rationale: L’hébreu dit littéralement « dans la prière », sans possessif exprimé. Cette formulation française reste naturelle et suit de près le texte hébreu, tandis que le grec porte « dans ta prière ».
- source_word: וּבִצְדָקָה
  choice: de faire l’aumône
  rationale: צדקה peut désigner la justice, mais aussi l’aide charitable. Dans ce contexte, le grec ἐλεημοσύνην ποιῆσαι explicite le sens de « faire l’aumône », formulation idiomatique et précise en français.
- source_word: אַל תִּתְעַבָּר
  choice: ne néglige pas
  rationale: Le verbe évoque le fait de passer outre ou de laisser de côté. Le grec μὴ παρίδῃς confirme le sens de ne pas négliger ou omettre.
