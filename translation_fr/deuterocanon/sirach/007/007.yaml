  text: Do not make yourself guilty in the assembly at the gates of God[a], and do not bring yourself down in the congregation.
translation:
  language: fr
  text: Ne te rends pas coupable dans l’assemblée, aux portes de Dieu[a], et ne provoque pas ta propre chute au sein de la communauté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Ne pèche pas au milieu de la multitude de la ville, et ne te jette pas à terre dans une foule. » Il peut refléter un autre texte hébreu sous-jacent ou une reformulation de l’expression « portes de Dieu ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּרְשִׁיעֲךָ
  choice: Ne te rends pas coupable
  rationale: Le hifil de רשע avec suffixe réfléchi exprime ici le fait d’attirer la culpabilité sur soi. Cette formulation conserve la précision de l’hébreu, plutôt que de généraliser par « ne pèche pas ».
- source_word: בַּעֲדַת
  choice: dans l’assemblée
  rationale: עֵדָה désigne un groupe réuni. « Assemblée » rend naturellement le cadre collectif et public.
- source_word: שַׁעֲרֵי אֵל
  choice: aux portes de Dieu
  rationale: La formulation inhabituelle de l’hébreu est conservée sans être normalisée d’après le grec. Elle peut évoquer le lieu public ou judiciaire des portes, placé sous le regard de Dieu.
- source_word: וְאַל תַּפִּילְךָ
  choice: et ne te fais pas tomber
  rationale: Le hifil de נפל, employé ici avec une valeur réfléchie, garde l’image d’une chute que l’on provoque soi-même. « Ne te fais pas tomber » est plus proche de cette image que « ne t’abaisse pas » ou « ne te déshonore pas ».
- source_word: בַּקְּהִלָּה
  choice: au milieu de la communauté
  rationale: קְהִלָּה désigne la communauté réunie. « Communauté » distingue le terme de עֵדָה dans le premier membre, tandis que « au milieu de » exprime clairement le cadre public.
theological_decisions:
- issue: Choix entre l’expression hébraïque inhabituelle « portes de Dieu » et le parallèle grec « multitude de la ville »
  choice: Maintenir « aux portes de Dieu » dans le texte principal
  alternative: « Ne pèche pas au milieu de la foule de la ville »
  rationale: Le témoin hébreu, ici conservé avec une confiance élevée, demeure prioritaire. Le grec peut refléter une autre leçon hébraïque ou une reformulation interprétative; son témoignage est donc signalé en note plutôt que substitué au texte hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme est conservé, ainsi que l’étrangeté réelle de « portes de Dieu ». Le second membre garde volontairement la métaphore de la chute sans préciser s’il s’agit de ruine morale, sociale ou judiciaire.
