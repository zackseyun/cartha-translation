  text: With all your strength[a], love your Maker[b], and do not forsake his ministers.
translation:
  language: fr
  text: De toute ta force[a], aime ton Créateur, et n’abandonne pas ses ministres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de toute ta puissance » ou « de toutes tes forces ».
    reason: lexical_alternative
  - marker: b
    text: 'Peut désigner plus précisément ceux qui servent Dieu dans le cadre du culte ou du Temple ; autre traduction : « ses serviteurs ».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּכָל מְאֹדְךָ
  choice: de toute ta force
  rationale: L’expression désigne l’engagement de toute la force ou puissance d’une personne. Le grec ἐν ὅλῃ δυνάμει confirme ce sens. Cette formulation conserve le singulier et l’intensité de l’hébreu.
- source_word: אֱהוֹב
  choice: aime
  rationale: Impératif direct du verbe אהב, rendu naturellement et sans développement interprétatif.
- source_word: עוֹשֶׂךָ
  choice: ton Créateur
  rationale: Le participe signifie littéralement « celui qui t’a fait ». « Ton Créateur » est concis, naturel et exprime clairement la relation personnelle au Dieu qui a créé le destinataire.
- source_word: מְשָׁרְתָיו
  choice: ses ministres
  rationale: Le terme désigne ceux qui servent ou exercent un service officiel, probablement sacré ou cultuel. « Ministres » préserve cette nuance mieux que le terme plus général « serviteurs ».
- source_word: לֹא תַעֲזֹב
  choice: n’abandonne pas
  rationale: עזב signifie couramment laisser ou abandonner. Cette traduction conserve la force morale de l’interdiction et correspond au grec μὴ ἐγκαταλίπῃς.
theological_decisions:
- issue: Référent et majuscule de עוֹשֶׂךָ
  choice: ton Créateur
  alternative: celui qui t’a fait
  rationale: Le référent est Dieu considéré comme créateur. La majuscule française signale ce référent divin sans ajouter d’idée absente du texte.
- issue: Portée de מְשָׁרְתָיו / λειτουργοὺς αὐτοῦ
  choice: ses ministres
  alternative: ses serviteurs / ceux qui le servent
  rationale: L’hébreu et le grec peuvent désigner les personnes attachées au service de Dieu, vraisemblablement dans un cadre sacré ou cultuel. « Ministres » maintient cette nuance officielle sans préciser indûment une fonction particulière.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement suit les formes hébraïques au singulier. « Créateur » est immédiatement intelligible, tandis que « ministres », précisé par une note, conserve la probable nuance cultuelle du terme source.
