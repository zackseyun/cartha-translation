translation:
  language: fr
  text: Donne une fille en mariage, et l’affaire sera réglée[a] ; unis-la[b] à un homme avisé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et l’affaire sortira », au sens où elle prendra fin. Le grec explicite : « et tu auras mené à bien une grande tâche ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « donne-la en mariage à un homme avisé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצֵא בַת
  choice: Donne une fille en mariage
  rationale: Le verbe signifie littéralement « faire sortir », mais, appliqué à une fille dans ce contexte et confirmé par le grec ἔκδου, il désigne l’action de la donner en mariage. L’absence de possessif est conservée par « une fille ».
- source_word: וְיֵצֵא עֵסֶק
  choice: et l’affaire sera réglée
  rationale: L’expression signifie littéralement que l’affaire « sortira » ou « prendra fin ». Cette formulation française rend naturellement l’idée d’une affaire menée à son terme, également soutenue par le parallèle grec.
- source_word: נָבוֹן
  choice: avisé
  rationale: Le terme qualifie une personne douée de discernement et de bon sens. « Avisé » exprime cette sagesse pratique dans un registre actuel et digne.
- source_word: חַבְּרָהּ
  choice: unis-la
  rationale: La forme issue de חבר évoque le fait de joindre ou d’attacher quelqu’un à un autre. « Unis-la » préserve cette image tout en indiquant clairement, dans le contexte, l’union matrimoniale.
