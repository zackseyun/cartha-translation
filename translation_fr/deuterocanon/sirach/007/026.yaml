  source_fidelity: 'Le premier membre hébreu se rend naturellement par « ton épouse » : אִשָּׁה לְךָ désigne ici l’épouse du destinataire. « La femme qui est à toi » reproduit trop littéralement la relation exprimée par לְךָ et produit en français une possessivité inutilement marquée. Dans le second membre, שְׂנוּאָה est formellement un participe passif (« haïe ») et ne permet pas de préciser qui éprouve cette haine. La formulation proposée par le brouillon, « celle que tu détestes », tranche cette ambiguïté. Le grec parallèle est substantiellement différent et doit demeurer en note.'
  naturalness: « Ne méprise pas ton épouse » est bref, moderne et convient au registre sapientiel. « Ne te fie pas à une épouse haïe » est une formulation soutenue mais intelligible, qui conserve la concision et la voix passive de l’hébreu.
  terminology: « Épouse » exprime explicitement le sens marital contextuellement requis sans la tournure française peu naturelle « la femme qui est à toi ». « Se fier à » rend bien אמן avec ב. « Haïe » préserve l’ambiguïté grammaticale du participe hébreu et n’attribue pas sans nécessité la haine au destinataire.
  issues:
  - severity: medium
    issue: Tournure française trop littérale dans « la femme qui est à toi »
    rationale: Cette expression est peu idiomatique en français moderne et peut suggérer une idée de possession plus forte que ne l’exige le texte. « Ton épouse » restitue le référent marital de façon naturelle.
  - severity: medium
    issue: Ambiguïté de שְׂנוּאָה supprimée
    rationale: « Celle que tu détestes » interprète le participe passif comme une haine éprouvée par le destinataire. L’hébreu ne précise pas l’agent; « une épouse haïe » conserve cette indétermination.
  - severity: low
    issue: Rendu du grec « selon ton cœur » imprécis
    rationale: κατὰ ψυχήν renvoie plus directement au désir ou au gré de la personne qu’au « cœur » au sens affectif. « Selon ton désir » est plus proche sans être lourd.
