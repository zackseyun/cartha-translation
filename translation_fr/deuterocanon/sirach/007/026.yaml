  text: Do not despise a wife who is yours[a], and do not trust one you hate.
translation:
  language: fr
  text: Ne méprise pas ton épouse[a], et ne te fie pas à une épouse haïe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec dit : « As-tu une épouse selon ton désir ? Ne la renvoie pas. » L’hébreu conservé et le grec diffèrent sensiblement dans ce verset ; le texte principal suit le témoin hébreu, tandis que cette note conserve la variante grecque.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִשָּׁה לְךָ
  choice: la femme qui est à toi
  rationale: Dans ce contexte, אִשָּׁה avec לְךָ désigne naturellement l’épouse du destinataire. Cette formulation conserve toutefois l’expression relationnelle du texte hébreu plutôt que de la réduire à un simple possessif.
- source_word: אַל תְּתַעֲבֶהָ
  choice: ne méprise pas
  rationale: Le verbe exprime une forte aversion ou un rejet. « Mépriser » est naturel en français moderne et convient au registre sapientiel, sans l’archaïsme possible de « avoir en abomination ».
- source_word: וּשְׂנוּאָה
  choice: celle que tu détestes
  rationale: La forme peut se comprendre comme « une femme détestée » ou, relationnellement, comme la femme que le destinataire déteste. La traduction retient cette seconde lecture tout en évitant de préciser davantage son identité.
- source_word: אַל תַּאֲמֵן בָּהּ
  choice: ne te fie pas à
  rationale: Le hifil de אמן suivi de ב exprime la confiance placée en quelqu’un. « Se fier à » rend directement et naturellement cette construction en français.
theological_decisions:
- issue: Divergence importante entre le témoin hébreu conservé et le parallèle grec
  choice: Le texte principal suit l’hébreu; la lecture grecque est conservée en note.
  alternative: « As-tu une femme selon ton cœur ? Ne la renvoie pas. »
  rationale: Puisque le verset est attesté en hébreu avec une confiance élevée, celui-ci sert de texte principal. Le grec présente néanmoins une formulation distincte et substantielle qui doit rester visible plutôt que d’être harmonisée silencieusement.
- issue: Portée de שְׂנוּאָה
  choice: « celle que tu détestes »
  alternative: « une femme détestée »
  rationale: La lecture relationnelle s’accorde au contraste avec « la femme qui est à toi », mais l’hébreu peut formellement être compris de manière passive. La traduction ne développe aucune conclusion doctrinale à partir de cette ambiguïté grammaticale.
translation_notes:
  register: Français international moderne, direct et digne. Le parallélisme bref de l’instruction sapientielle est conservé. « La femme qui est à toi » est légèrement marqué, mais maintient la tournure relationnelle de לְךָ et permet à la note grecque de signaler clairement la divergence textuelle.
