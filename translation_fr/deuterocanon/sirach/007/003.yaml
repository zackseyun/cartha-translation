translation:
  language: fr
  text: Ne cherche pas à recevoir de Dieu l’autorité, ni du roi une place d’honneur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin grec donne ici une maxime différente : « Mon fils, ne sème pas dans les sillons de l’injustice, et tu n’en récolteras pas sept fois autant. » Le texte principal suit le témoin hébreu conservé pour ce verset du Siracide.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תְּבַקֵּשׁ
  choice: Ne cherche pas
  rationale: Le verbe בקש peut signifier « chercher », « demander » ou « désirer ». « Ne cherche pas » conserve à la fois l’idée de démarche et celle d’ambition, sans imposer la notion d’une demande explicite.
- source_word: מֵאֵל
  choice: auprès de Dieu
  rationale: La préposition מן indique ici la provenance. « Auprès de Dieu » exprime naturellement en français le fait de chercher à obtenir quelque chose de Dieu, sans ajouter de titre divin absent de l’hébreu.
- source_word: מֶמְשֶׁלַת
  choice: le pouvoir
  rationale: ממשלה désigne le pouvoir, la domination ou l’autorité de gouverner. « Le pouvoir » est courant et garde la portée politique ou institutionnelle du terme.
- source_word: וְכֵן
  choice: ni
  rationale: Littéralement « et de même ». Dans cette coordination régie par une défense, « ni » transmet naturellement la force négative parallèle en français.
- source_word: מִמֶּלֶךְ
  choice: auprès du roi
  rationale: מן marque la provenance. L’article défini conserve la forme hébraïque et permet de comprendre « le roi » dans un sens générique.
- source_word: מוֹשַׁב כָּבוֹד
  choice: une place d’honneur
  rationale: מוֹשַׁב peut désigner un siège, une place ou une position, et כָּבוֹד l’honneur. « Une place d’honneur » préserve l’image tout en étant idiomatique en français moderne.
theological_decisions:
- issue: Rapport entre les témoins hébreu et grec de ce verset
  choice: Suivre dans le texte principal le témoin hébreu conservé et signaler en note la leçon grecque substantiellement différente.
  alternative: « Mon fils, ne sème pas dans les sillons de l’injustice, et tu n’en récolteras pas sept fois autant. »
  rationale: Lorsque l’hébreu du Siracide est conservé, il sert de source principale. Ici, le grec transmet une maxime entièrement différente; il ne faut donc ni harmoniser les deux leçons ni dissimuler leur divergence.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation garde le parallélisme de l’hébreu et emploie un vocabulaire accessible. Le marqueur [a] est placé après « pouvoir », là où il signale clairement la divergence textuelle portant sur l’ensemble du verset.
