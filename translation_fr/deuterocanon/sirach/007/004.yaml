translation:
  language: fr
  text: Ne te justifie pas devant un roi[a], et ne te montre pas intelligent devant un roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit : « Ne recherche pas auprès du Seigneur le pouvoir, ni auprès d’un roi un siège de gloire. » Le témoin hébreu suivi ici est sensiblement différent.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּצְטַדֵּק
  choice: Ne cherche pas à te justifier
  rationale: 'Le hitpael de צדק a ici une valeur réflexive : se présenter comme juste ou chercher à se justifier. « Ne cherche pas à » exprime naturellement en français l’interdiction d’une telle posture sans imposer la nuance plus accusatrice de « faire le juste ».'
- source_word: לִפְנֵי מֶלֶךְ
  choice: devant un roi
  rationale: לִפְנֵי désigne ici la présence du souverain, et l’absence d’article devant מֶלֶךְ favorise « un roi ».
- source_word: וּמִפְּנֵי מֶלֶךְ
  choice: et … devant un roi
  rationale: Le second membre est rendu parallèlement au premier. Dans ce contexte, מִפְּנֵי est compris dans un sens spatial ou relationnel, « devant, en présence de », plutôt que causal.
- source_word: אַל תִּתְבּוֹנֵן
  choice: ne fais pas étalage de ton intelligence
  rationale: Le verbe issu de בין peut exprimer le fait de se montrer avisé ou intelligent. Cette formulation française rend la manifestation sociale visée dans ce conseil, plutôt qu’une simple réflexion intérieure.
theological_decisions:
- issue: Divergence importante entre les témoins hébreu et grec
  choice: 'Traduire en priorité l’hébreu conservé : mise en garde contre l’autojustification et l’étalage d’intelligence devant un roi.'
  alternative: 'Le grec dit : « Ne demande pas au Seigneur le pouvoir, ni au roi un siège d’honneur. »'
  rationale: Puisque le texte hébreu est ici attesté avec une confiance élevée, il sert de texte principal. La leçon grecque, substantiellement différente, est signalée en note afin de préserver l’histoire textuelle sans remplacer l’hébreu.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement correspond à l’adresse sapientielle individuelle. « Faire étalage de son intelligence » est idiomatique et communique la mise en scène de sa propre perspicacité, tandis que la répétition de « devant un roi » conserve le parallélisme hébreu.
