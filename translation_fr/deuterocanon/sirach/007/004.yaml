review_pass:
  verdict: revise
  source_fidelity: Le texte français suit bien les deux impératifs hébreux et conserve « un roi », conformément à l’absence d’article. Toutefois, « Ne cherche pas à te justifier » affaiblit légèrement l’impératif direct en ajoutant l’idée de chercher à; « Ne te justifie pas » est plus proche. « Faire étalage » introduit une ostentation plus marquée que ne l’exige le verbe, dont le sens reste discuté entre montrer son discernement et se donner des airs d’avisé.
  naturalness: La formulation révisée est directe, idiomatique et d’un registre sapientiel moderne. « Ne te montre pas intelligent » exprime naturellement l’idée de se présenter comme avisé, sans réduire le verbe à une réflexion intérieure ni accentuer indûment le blâme.
  terminology: « Roi » et « Seigneur » sont appropriés. La note doit rendre ζητεῖν par « rechercher » plutôt que « demander », afin de refléter l’idée grecque de rechercher/briguer, et « siège de gloire » peut être rendu avec une formulation qui conserve le caractère honorifique sans prétendre lever son ambiguïté.
  issues:
  - severity: low
    issue: L’ajout de « cherche pas à » dans le premier impératif.
    rationale: Le texte hébreu interdit directement l’action réflexive; « Ne te justifie pas » la rend plus exactement, sans l’idée supplémentaire d’une tentative ou d’une recherche.
  - severity: medium
    issue: « Faire étalage de ton intelligence » est trop interprétatif.
    rationale: Cette expression implique une ostentation appuyée. Le hitbonen de בין peut viser le fait de se montrer intelligent ou avisé; une formulation moins chargée préserve mieux cette nuance.
  - severity: low
    issue: La note traduit le grec ζητεῖν par « demande ».
    rationale: Le grec exprime le fait de rechercher ou de briguer le pouvoir, non simplement de le demander. La note doit aussi rendre les deux compléments introduits par « auprès de ».
