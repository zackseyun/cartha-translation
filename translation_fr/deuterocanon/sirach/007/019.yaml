  text: Do not despise an intelligent wife, for her graciousness is better than pearls.
translation:
  language: fr
  text: Ne méprise pas une femme avisée[b] ; une femme gracieuse vaut mieux que des perles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Ne manque pas une femme sage et bonne, car sa grâce vaut plus que l’or. » L’hébreu a « perles » — ou peut-être « corail », « rubis » ou « pierres précieuses » — là où le grec a « or ».'
    reason: alternative_reading
  - marker: b
    text: Ou « une épouse avisée », « une femme intelligente » ou « une femme sage ». Le terme hébreu souligne le discernement et le bon sens.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּמְאַס
  choice: Ne méprise pas
  rationale: Le verbe מָאַס peut signifier rejeter ou mépriser. « Mépriser » convient au ton de l’exhortation et met en garde contre une attitude de dédain.
- source_word: אִשָּׁה מַשְׁכֶּלֶת
  choice: une femme avisée
  rationale: אִשָּׁה peut désigner une femme ou une épouse; sans déterminant possessif explicite, « femme » préserve l’ambiguïté. מַשְׁכֶּלֶת évoque l’intelligence pratique, le discernement et le bon sens, bien rendus par « avisée ».
- source_word: וְטוֹבַת חֵן
  choice: car sa grâce vaut mieux
  rationale: La tournure hébraïque est concise et quelque peu difficile. Dans ce parallélisme, elle paraît louer la grâce de cette femme; le grec soutient ce lien explicite. « Car » et « sa » rendent naturellement la relation logique sans réduire חֵן à la seule beauté physique.
- source_word: מִפְּנִינִים
  choice: que les perles
  rationale: פְּנִינִים désigne un bien précieux, diversement compris comme perles, corail, rubis ou pierres précieuses. « Perles » est une traduction traditionnelle et défendable; la divergence grecque est signalée en note.
theological_decisions:
- issue: Référent de אִשָּׁה dans l’exhortation sapientielle
  choice: femme
  alternative: épouse
  rationale: L’hébreu permet les deux sens. Le contexte peut viser la vie conjugale, mais le verset ne porte aucun possessif explicite; « femme » conserve donc la portée et l’ambiguïté du texte source.
- issue: Rapport de la seconde proposition à la femme avisée
  choice: sa grâce
  alternative: une grâce bienfaisante / la faveur
  rationale: Le membre hébreu est comprimé et peut recevoir une lecture moins explicitement possessive. Le parallèle grec, « sa grâce », favorise toutefois le rattachement à la femme, retenu dans le texte tout en reconnaissant l’ambiguïté syntaxique.
translation_notes:
  register: Français international moderne, simple et digne. « Avisée » conserve la nuance de discernement pratique sans langage technique. Les deux appels de note figurent dans le texte principal, au plus près des expressions concernées.
