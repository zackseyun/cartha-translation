  text: In all your words remember your end, and you will never sin.[a]
translation:
  language: fr
  text: Dans toutes tes paroles, souviens-toi de ta fin, et tu ne pécheras jamais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin hébreu conservé donne approximativement : « N’éloigne pas ton cœur de celui qui aime, car c’est par lui que tu seras aimé. » Sa formulation diffère profondément de la tradition grecque, suivie ici dans le texte principal.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν πᾶσι τοῖς λόγοις σου
  choice: Dans toutes tes paroles
  rationale: λόγοι peut désigner les paroles ou, plus largement, les affaires. « Toutes tes paroles » reste proche du grec et forme en français une exhortation claire.
- source_word: μιμνήσκου
  choice: souviens-toi
  rationale: L’impératif exprime l’action de garder quelque chose présent à l’esprit ; « souviens-toi » en est le rendu direct et naturel.
- source_word: τὰ ἔσχατά σου
  choice: ta fin
  rationale: L’expression signifie littéralement « tes dernières choses » ou « ta fin ». Ce choix conserve l’ambiguïté entre la mort et l’issue ultime de la vie, sans imposer une précision doctrinale absente du texte.
- source_word: καὶ εἰς τὸν αἰῶνα οὐχ ἁμαρτήσεις
  choice: et tu ne pécheras jamais
  rationale: Avec la négation, εἰς τὸν αἰῶνα a ici la valeur idiomatique de « jamais ». ἁμαρτάνω est rendu par son sens religieux et moral usuel, « pécher ».
- source_word: אַל תִּשָּׂא לֵב מֵאוֹהֵב, כִּי מִמֶּנוּ תֵּאָהֵב
  choice: lecture hébraïque divergente signalée en note
  rationale: Le témoin hébreu conservé donne un sens très différent du grec et présente une formulation difficile. Le texte principal suit donc ici le parallèle grec cohérent, tandis que la lecture hébraïque est conservée avec transparence en note.
theological_decisions:
- issue: Faut-il expliciter « ta fin » en termes de mort, de jugement ou de destinée éternelle ?
  choice: ta fin
  alternative: ta destinée finale
  rationale: Le grec ne précise pas la nature de cette fin. Le rendu retenu préserve la portée morale et eschatologique possible sans réduire l’expression à une doctrine particulière.
- issue: Choix du texte lorsque l’hébreu et le grec divergent fortement
  choice: Suivre le grec dans le texte principal et présenter l’hébreu en note
  alternative: Suivre le témoin hébreu dans le texte principal
  rationale: Bien que le témoin hébreu soit ancien et important, sa formulation est ici difficile et sans correspondance sémantique avec la tradition grecque cohérente. La note permet de ne pas dissimuler cette divergence textuelle.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier reflète les formes grecques de deuxième personne et le style sapientiel direct. La formulation garde le parallélisme bref de l’exhortation.
