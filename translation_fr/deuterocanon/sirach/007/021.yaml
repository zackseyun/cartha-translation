  text: Love an intelligent servant as yourself[a], and do not withhold freedom from him.
translation:
  language: fr
  text: Aime l’esclave qui fait preuve de discernement comme toi-même[a], et ne le prive pas de liberté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu « qui fait preuve de discernement »; le grec parallèle lit « bon » : « Aime un bon esclave comme toi-même. »'
    reason: Variante ancienne entre le témoin hébreu principal et le parallèle grec.
lexical_decisions:
- source_word: עֶבֶד
  choice: esclave
  rationale: Le terme désigne ici une personne en condition servile; la mention explicite de la liberté à ne pas lui refuser rend cette condition particulièrement saillante. « Esclave » évite d’adoucir le statut exprimé par l’hébreu.
- source_word: מַשְׂכִּיל
  choice: qui fait preuve de discernement
  rationale: Le participe décrit une personne qui comprend et agit avec intelligence. Cette formulation naturelle conserve la dimension pratique de la perspicacité, tandis que le grec parallèle porte la variante « bon ».
- source_word: חַבֵּב
  choice: aime
  rationale: L’impératif exprime une affection et une estime véritables. « Aime » est direct, digne et concorde avec le grec ἀγαπάτω.
- source_word: כְּנֶפֶשׁ
  choice: comme toi-même
  rationale: Littéralement « comme une âme/personne »; dans ce contexte, l’expression appelle à considérer l’esclave comme soi-même. La traduction idiomatique préserve la force éthique sans imposer « ta propre âme », absent du texte consonantique cité.
- source_word: וְאַל תִּמְנַע מִמֶּנוּ
  choice: et ne le prive pas
  rationale: Le verbe signifie retenir ou empêcher quelqu’un d’obtenir quelque chose. Avec « liberté », « ne le prive pas de » est idiomatique en français et rejoint le sens du grec μὴ στερήσῃς.
- source_word: חֹפֶשׁ
  choice: liberté
  rationale: Le nom désigne la libération de la condition servile. « Liberté » est clair et actuel; « affranchissement » serait plus technique et réduirait légèrement la portée du terme.
theological_decisions:
- issue: Désignation du statut social exprimé par עֶבֶד
  choice: esclave
  alternative: serviteur
  rationale: Le commandement de ne pas refuser la liberté montre qu’il s’agit d’une condition de dépendance juridique, non d’un simple service volontaire. Le choix conserve sans l’atténuer la réalité sociale du texte.
- issue: Comparaison כְּנֶפֶשׁ
  choice: comme toi-même
  alternative: comme ta propre vie / comme une âme
  rationale: L’hébreu est concis et peut évoquer l’âme, la vie ou la personne. La formulation retenue rend naturellement la comparaison personnelle, sans développer une anthropologie particulière.
translation_notes:
  register: Français moderne international, direct et digne. La syntaxe impérative de l’hébreu est conservée. « Esclave » assume explicitement le statut servile rendu manifeste par la seconde proposition; « qui fait preuve de discernement » reste accessible tout en traduisant la valeur active de מַשְׂכִּיל.
