translation:
  language: fr
  text: Ne méprise pas un homme à l’esprit amer ; souviens-toi qu’il y a quelqu’un qui élève et abaisse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu porte « élève et abaisse » ; le parallèle grec inverse l’ordre : « abaisse et élève ».'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּבֶז
  choice: Ne méprise pas
  rationale: Le verbe hébreu בזה exprime le fait de traiter quelqu’un avec mépris. « Mépriser » conserve ce sens large sans le réduire à la moquerie verbale suggérée plus précisément par le grec καταγέλα.
- source_word: לֶאֱנוֹשׁ
  choice: un homme
  rationale: אֱנוֹשׁ désigne ici un être humain singulier, avec la nuance possible de fragilité humaine. « Un homme » maintient la forme masculine représentative du texte.
- source_word: בְּמַר רוּחַ
  choice: dont l’esprit est dans l’amertume
  rationale: Cette formulation française naturelle conserve les deux éléments de l’expression hébraïque, « amertume » et « esprit », sans réduire la détresse à une simple humeur.
- source_word: זְכוֹר
  choice: souviens-toi
  rationale: Impératif direct et idiomatique, correspondant exactement à l’appel hébreu à garder cette réalité présente à l’esprit.
- source_word: כִּי יֵשׁ
  choice: qu’il y en a un
  rationale: Après « souviens-toi », cette tournure restitue naturellement la construction existentielle hébraïque tout en laissant l’agent non nommé.
- source_word: מֵרִים וּמַשְׁפִּיל
  choice: qui élève et qui abaisse
  rationale: 'La traduction suit l’ordre attesté dans le texte hébreu fourni : « élève et abaisse ». Les deux verbes expriment un renversement de condition sans préciser davantage son mode.'
theological_decisions:
- issue: Identité de celui qui élève et abaisse
  choice: Maintenir le sujet implicite avec « il y en a un »
  alternative: « Dieu élève et abaisse » ou « le Seigneur élève et abaisse »
  rationale: L’hébreu comme le grec laissent entendre un agent divin sans le nommer. Ajouter « Dieu » ou « le Seigneur » expliciterait une identification théologiquement probable, mais absente de la formulation.
- issue: Ordre des verbes de renversement
  choice: « élève et abaisse », selon l’hébreu
  alternative: « abaisse et élève », selon le parallèle grec
  rationale: La source hébraïque étant ici disponible avec une confiance élevée, son ordre est retenu. Le parallèle grec présente l’ordre inverse, qui s’accorde bien avec l’avertissement à ne pas mépriser l’affligé ; la variante est donc signalée plutôt que résolue silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « dont l’esprit est dans l’amertume » préserve l’image hébraïque tout en restant compréhensible. Le point-virgule maintient le lien étroit entre l’interdiction et son motif.
