translation:
  language: fr
  text: Tends aussi la main au pauvre[a], afin que ta bénédiction soit complète.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle dit : « Que la bonté d’un don s’étende à tout vivant, et ne refuse pas non plus ta bonté au mort. » Le témoin hébreu porte ici : « Tends aussi la main au pauvre, afin que ta bénédiction soit complète. »'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: aussi
  rationale: Rend la valeur additive de l’expression hébraïque et relie naturellement cette exhortation aux précédentes.
- source_word: לְאֶבְיוֹן
  choice: au pauvre
  rationale: אֶבְיוֹן désigne une personne pauvre ou nécessiteuse. « Au pauvre » est simple, idiomatique et conserve la portée sociale du terme.
- source_word: הוֹשִׁיט יָד
  choice: Tends la main
  rationale: Conserve l’image concrète de l’hébreu, qui évoque ici l’aide ou le don sans réduire explicitement l’expression à une seule forme de générosité.
- source_word: לְמַעַן
  choice: afin que
  rationale: Exprime clairement le rapport de but ou de résultat marqué par לְמַעַן, dans un registre digne et courant.
- source_word: תִּשְׁלַם
  choice: soit complète
  rationale: Le verbe issu de שלם peut exprimer l’accomplissement ou la plénitude. Cette traduction préserve ce sens sans imposer l’idée plus précise d’une rétribution.
- source_word: בִּרְכָתֶךָ
  choice: ta bénédiction
  rationale: Maintient l’ambiguïté de l’hébreu entre une bénédiction reçue, accordée ou concrétisée par un bienfait, plutôt que de préciser arbitrairement « don ».
theological_decisions:
- issue: Divergence importante entre les témoins hébreu et grec de Siracide 7.33
  choice: Suivre dans le texte principal le témoin hébreu conservé et signaler le grec en note.
  alternative: 'Grec : « Que la bonté d’un don s’étende à tout vivant, et ne refuse pas non plus ta bonté au mort. »'
  rationale: Le texte hébreu est ici disponible et cohérent, tandis que le grec présente une formulation sensiblement différente, probablement issue d’une autre forme textuelle. La note conserve cette variante substantielle sans l’harmoniser avec l’hébreu.
translation_notes:
  register: Français international moderne, concis et digne. L’image corporelle « tendre la main » est conservée, de même que l’ambiguïté de « bénédiction ». Le tutoiement correspond aux formes hébraïques de deuxième personne du singulier.
