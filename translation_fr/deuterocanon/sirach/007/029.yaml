translation:
  language: fr
  text: De tout ton cœur, crains Dieu, et tiens ses prêtres pour saints.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « traite ses prêtres comme saints ». Le grec parallèle porte : « admire ses prêtres », au sens de les considérer avec respect.'
    reason: Signale la portée de הַקְדִּישׁ et décrit avec plus de précision la nuance du grec θαύμαζε, sans substituer le grec au texte hébreu principal.
lexical_decisions:
- source_word: בְּכָל לִבְּך
  choice: De tout ton cœur
  rationale: Rend directement l’expression hébraïque et conserve son idée d’engagement intérieur total.
- source_word: פְּחַד
  choice: crains
  rationale: Le verbe exprime ici la crainte révérencielle; «crains» maintient la force et l’ambiguïté du terme sans l’atténuer.
- source_word: אִל
  choice: Dieu
  rationale: Équivalent naturel de אֵל dans ce contexte.
- source_word: הַקְדִישׁ
  choice: tiens … pour saints
  rationale: Le hiphil de קדש signifie littéralement traiter, reconnaître ou mettre à part comme saint. Cette formulation française préserve la dimension de sainteté, plutôt que de la réduire au seul honneur.
- source_word: כֹּהֲנָיו
  choice: ses prêtres
  rationale: Le suffixe renvoie à Dieu; «prêtres» est l’équivalent courant et précis de כֹּהֲנִים.
theological_decisions:
- issue: Sens de הַקְדִישׁ à propos des prêtres
  choice: tiens ses prêtres pour saints
  alternative: honore ses prêtres
  rationale: L’hébreu porte explicitement la racine de la sainteté. Le grec parallèle («admire/respecte») et l’anglais de consultation favorisent «honore», mais ne justifient pas d’effacer la formulation théologiquement plus forte du témoin hébreu principal.
translation_notes:
  register: Français moderne, sobre et dignifié. L’impératif «crains» garde la vigueur sapientielle du texte. «Tiens … pour saints» est idiomatique tout en restant proche de l’hébreu.
