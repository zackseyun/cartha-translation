  text: Do not chatter in the assembly of rulers[b][a], and do not repeat a word in your prayer.
translation:
  language: fr
  text: Ne bavarde pas[a] dans l’assemblée des dirigeants, et ne répète pas une parole dans ta prière[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne débite pas de paroles » ou « ne parle pas à tort et à travers ». Le parallèle grec met lui aussi en garde contre les propos oiseux ou excessifs parmi les anciens.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « ne répète pas une parole dans ta prière ». Il s’agit probablement d’une mise en garde contre les répétitions redondantes ou mécaniques, et non contre toute reprise d’une même demande.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּסַוֵּר
  choice: bavarde
  rationale: Le verbe hébreu, éclairé par le grec ἀδολέσχει, désigne ici des propos excessifs, oiseux ou inconsidérés. « Bavarde » exprime cette parole indisciplinée dans un registre actuel sans interdire simplement de parler.
- source_word: בַּעֲדַת
  choice: dans l’assemblée
  rationale: עֵדָה désigne un groupe réuni ou une assemblée. Cette formulation convient au cadre public et officiel du verset.
- source_word: שָׂרִים
  choice: des dirigeants
  rationale: שָׂרִים désigne des personnes investies d’un rang ou d’une autorité. « Dirigeants » est plus large et plus naturel aujourd’hui que « princes ».
- source_word: תִּישֶׁן דָּבָר
  choice: ne répète pas une parole
  rationale: L’expression hébraïque est difficile, mais le parallèle grec μὴ δευτερώσῃς λόγον confirme nettement l’idée de répéter une parole. La traduction conserve cette formulation concrète sans en préciser excessivement la portée.
- source_word: בַּתְּפִלָּה
  choice: dans ta prière
  rationale: L’hébreu signifie « dans la prière »; le possessif est explicitement attesté par le parallèle grec ἐν προσευχῇ σου. « Dans ta prière » est précis, personnel et naturel en français.
theological_decisions:
- issue: La seconde interdiction condamne-t-elle toute répétition dans la prière ou la répétition verbale vaine et mécanique ?
  choice: Le texte principal conserve l’interdiction littérale de répéter une parole, tandis que la note signale son interprétation probable comme mise en garde contre la redondance vaine ou mécanique.
  alternative: Comprendre le verset comme une interdiction absolue de toute répétition ou, plus largement, comme une condamnation de toute prière prolongée.
  rationale: L’hébreu et le grec visent la répétition d’une parole, mais ne définissent pas explicitement toutes les formes de répétition concernées. La formulation maintient cette tension et évite d’imposer une conclusion doctrinale.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond aux exhortations sapientielles adressées à un individu. « Bavarde » reste accessible sans être familier; « dirigeants » évite la coloration monarchique plus étroite de « princes ». La seconde proposition demeure volontairement proche de l’hébreu malgré une légère étrangeté, afin de préserver son ambiguïté.
