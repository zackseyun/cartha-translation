  text: Do not sow furrows of injustice against a brother[b][a], lest you reap it sevenfold.
translation:
  language: fr
  text: Ne sème pas des sillons d’injustice contre un frère[b], de peur d’en récolter sept fois autant[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement « le récolter » : le suffixe masculin, pris isolément, peut renvoyer à l’injustice ou au frère. La traduction le rapporte à l’injustice, conformément à l’image de ce qui est semé puis récolté.'
    reason: lexical_alternative
  - marker: b
    text: 'Le parallèle grec présente une autre forme de cette maxime : « Éloigne-toi de l’injustice, et elle s’éloignera de toi. »'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּזְרַע
  choice: Ne sème pas
  rationale: L’interdiction simple et l’image agricole sont conservées; « semer » répond naturellement à « récolter ».
- source_word: חֲרוּשֵׁי
  choice: des sillons
  rationale: Le terme renvoie au travail de la terre. « Sillons » préserve l’image concrète, bien que l’expression demeure volontairement inhabituelle.
- source_word: עָוֶל
  choice: d’injustice
  rationale: Le mot désigne ici un tort moral et relationnel; « injustice » est précis et actuel sans coloration ecclésiastique excessive.
- source_word: עַל אָח
  choice: contre un frère
  rationale: La préposition a une valeur hostile dans ce contexte. L’indéfini « un frère » suit l’hébreu sans ajouter un possessif absent.
- source_word: פֶּן
  choice: de peur de
  rationale: Cette tournure exprime clairement l’avertissement et son éventuelle conséquence en français moderne.
- source_word: תִּקְצְרֵהוּ
  choice: la récolter
  rationale: Le pronom est compris comme renvoyant à l’injustice semée, ce qui maintient la cohérence de l’image semer-récolter; l’ambiguïté grammaticale est signalée en note.
- source_word: שִׁבְעָתָיִם
  choice: au septuple
  rationale: Cette formulation concise conserve l’idée hébraïque d’une rétribution multipliée par sept.
theological_decisions:
- issue: Référent du suffixe pronominal dans תִּקְצְרֵהוּ
  choice: 'Le pronom renvoie à l’injustice semée: « la récolter au septuple »'
  alternative: 'Le suffixe peut, pris isolément, se rapporter au frère: « le récolter au septuple »; le grec offre une forme différente du proverbe.'
  rationale: Le parallélisme agricole entre semer et récolter favorise le renvoi à ce qui est semé, mais le texte hébreu ne lève pas entièrement l’ambiguïté; celle-ci doit donc rester visible en note.
translation_notes:
  register: Français international moderne, sobre et sapientiel. L’image agricole inhabituelle de l’hébreu est maintenue plutôt que remplacée par une paraphrase abstraite.
