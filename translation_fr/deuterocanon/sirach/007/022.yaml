  text: Do you have livestock? Keep your eye on it[a]; and if it is profitable[b], keep it.
translation:
  language: fr
  text: As-tu du bétail ? Veille sur lui[a] ; s’il t’est utile[b], garde-le.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vois de tes yeux ». Il s’agit de surveiller attentivement le bétail et d’en prendre soin.'
    reason: lexical_alternative
  - marker: b
    text: La nuance exacte du mot hébreu est incertaine. Le texte grec parallèle porte « utile » ; on pourrait aussi comprendre « profitable » ou « de bon rapport ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהֵמָה לְךָ
  choice: As-tu du bétail ?
  rationale: Le nom désigne ici des animaux domestiques considérés collectivement, et la construction hébraïque sans verbe exprime la possession. La question directe restitue naturellement cette tournure, en accord avec le parallèle grec.
- source_word: רְאֵה עֵינֶיךָ
  choice: Veille sur lui
  rationale: L’expression signifie littéralement « vois de tes yeux » et invite à une surveillance attentive. « Veille sur lui » en rend clairement le sens sans effacer entièrement l’idée d’attention visuelle, explicitée en note.
- source_word: אֻמָּנָה
  choice: utile
  rationale: La nuance exacte du terme hébreu est incertaine. Le grec χρήσιμα appuie fortement le sens « utile, profitable », mais « utile » évite de réduire la valeur du bétail au seul bénéfice financier.
- source_word: הַעֲמִידָהּ
  choice: garde-le
  rationale: Le causatif de עמד signifie littéralement « fais-le tenir, maintiens-le ». Dans ce contexte, il s’agit de conserver le bétail; le pronom singulier convient au collectif français « bétail ».
