base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/015.yaml
  text: Do not count yourself among the people’s dead[b][a]; remember that passing away will not pass over.
translation:
  language: fr
  text: Ne te compte pas parmi les morts du peuple[a] ; souviens-toi que le trépas ne passera à côté de personne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La tradition grecque porte : « Ne déteste pas le travail pénible ni l’agriculture créée par le Très-Haut. » Elle diffère considérablement de l’hébreu conservé ici.'
    reason: alternative_reading
  - marker: b
    text: L’hébreu de cette proposition est difficile et semble jouer sur des mots liés au fait de « passer ». Le sens probable est que le trépas, ou la condition mortelle, ne passe à côté de personne.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּחְשׁוֹבְךָ
  choice: Ne te compte pas
  rationale: Le verbe חשב exprime ici l’idée de se ranger ou de se compter dans une catégorie. Cette tournure conserve l’exhortation tout en restant naturelle en français.
- source_word: בָּמֳתֵי עָם
  choice: parmi les morts du peuple
  rationale: La formule hébraïque condensée est comprise comme désignant les morts appartenant au peuple ou à la communauté. La traduction garde cette image concrète sans la réduire à l’idée abstraite de mort.
- source_word: זְכוֹר
  choice: souviens-toi
  rationale: Équivalent direct et idiomatique de l’impératif de זכר.
- source_word: עִבָּרוֹן
  choice: le trépas
  rationale: Le substantif est difficile. « Le trépas » rend ici le passage de la vie à la mort et permet de conserver, avec le verbe suivant, le jeu étymologique autour de עבר sans imposer le sens moins assuré de « transgression » ou de « colère ».
- source_word: לֹא יִתְעַבָּר
  choice: ne passera pas outre
  rationale: La formulation conserve le motif verbal du passage et suggère que la mort ne contourne ni n’épargne personne, tout en laissant subsister l’ambiguïté de l’hébreu.
- source_word: μὴ μισήσῃς ἐπίπονον ἐργασίαν καὶ γεωργίαν ὑπὸ Ὑψίστου ἐκτισμένην
  choice: non retenu dans le texte principal
  rationale: Le grec présente une leçon substantiellement différente, sans correspondant clair dans l’hébreu conservé. Puisque le témoin hébreu est disponible avec une confiance élevée, il régit le texte principal, tandis que la tradition grecque est signalée en note.
theological_decisions:
- issue: Divergence entre le texte hébreu conservé et la tradition grecque
  choice: Suivre l’hébreu dans le texte principal et donner le grec en note
  alternative: « Ne déteste pas le travail pénible ni l’agriculture créée par le Très-Haut. »
  rationale: L’hébreu est conservé ici avec un degré élevé de confiance, mais le grec atteste une tradition très différente et matériellement importante. La note préserve cette divergence sans harmonisation.
- issue: Identification de עִבָּרוֹן
  choice: Comprendre le terme dans le champ du passage vers la mort, tout en signalant l’incertitude
  alternative: « transgression » ou « colère »
  rationale: Le rapprochement avec יתעבר favorise un jeu de mots sur עבר. Le contexte de la première proposition soutient une allusion à la mortalité, mais l’obscurité lexicale doit rester visible.
translation_notes:
  register: Français international moderne, sobre et digne. « Trépas » est légèrement soutenu mais demeure largement compréhensible et permet de distinguer l’événement de mourir des « morts » de la première proposition. La syntaxe resserrée reflète celle de l’hébreu.
