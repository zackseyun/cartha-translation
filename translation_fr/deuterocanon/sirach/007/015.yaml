  source_fidelity: 'Le texte principal suit correctement le témoin hébreu : l’interdiction de se compter parmi les morts du peuple est conservée, de même que l’exhortation à se souvenir de l’inéluctabilité de la mortalité. La note grecque rend fidèlement la tradition parallèle, substantiellement divergente. « Ne passera pas outre » laisse toutefois trop indéterminé ce qui ne serait pas « outrepassé » et ne rend pas aussi clairement l’idée que la mort ne contourne personne.'
  naturalness: « Ne te compte pas parmi les morts du peuple » et « souviens-toi » sont naturels dans un registre sobre. « Le trépas ne passera pas outre » est plus opaque et quelque peu livresque en français moderne. « Le trépas ne passera à côté de personne » est idiomatique, explicite et maintient le motif du passage.
