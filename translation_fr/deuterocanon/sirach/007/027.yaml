  text: With all your heart honor your father[a], and do not forget the labor pains of your mother.
translation:
  language: fr
  text: De tout ton cœur, honore ton père, et n’oublie pas les douleurs que ta mère a endurées en te mettant au monde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit de façon concise : « et la mère qui t’a enfanté, ne l’oublie pas ». Le grec parallèle précise : « n’oublie pas les douleurs de ta mère ».'
    reason: Lecture parallèle et formulation alternative du texte hébreu.
lexical_decisions:
- source_word: בְּכָל לִבְּךָ
  choice: De tout ton cœur
  rationale: Expression française naturelle qui conserve l’image hébraïque et l’idée d’un engagement entier et sincère.
- source_word: כַּבֵּד
  choice: honore
  rationale: Dans le cadre des relations familiales, le verbe כבד appelle à accorder au père le respect et l’importance qui lui sont dus; « honore » correspond à son emploi biblique courant.
- source_word: לְאָבִיךָ
  choice: ton père
  rationale: Rendu direct du terme familial et du suffixe possessif de deuxième personne.
- source_word: וְאֵם יוֹלַדְתְּךָ
  choice: ta mère … en te mettant au monde
  rationale: Le texte hébreu désigne littéralement « la mère qui t’a enfanté ». Cette formulation française conserve le lien personnel et l’image de l’enfantement tout en s’intégrant naturellement à la proposition.
- source_word: אַל תִּשֶּׁה
  choice: n’oublie pas
  rationale: Le grec parallèle, μὴ ἐπιλάθῃ, confirme ici le sens « ne pas oublier » du membre hébreu particulièrement concis.
- source_word: μητρὸς ὠδῖνας
  choice: les douleurs que ta mère a endurées en te mettant au monde
  rationale: Le grec explicite les douleurs de l’enfantement. La formulation choisie est claire, actuelle et digne, sans employer un vocabulaire archaïque ou excessivement clinique.
theological_decisions:
- issue: Rapport entre le témoin hébreu principal et l’explicitation du grec parallèle
  choice: Prendre l’hébreu pour base tout en laissant le grec expliciter que le lecteur ne doit pas oublier les douleurs de l’enfantement maternel.
  alternative: 'Traduire plus littéralement l’hébreu seul : « et n’oublie pas la mère qui t’a enfanté ».'
  rationale: L’hébreu conservé est prioritaire, mais sa dernière proposition est très concise. Le grec ancien fournit une lecture cohérente qui précise l’objet du souvenir sans modifier l’exhortation centrale à reconnaître ce que les parents ont fait.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reflète les formes hébraïques. La deuxième proposition est formulée avec fluidité tout en signalant en note la différence entre la concision de l’hébreu et l’explicitation grecque.
