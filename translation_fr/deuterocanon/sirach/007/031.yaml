base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/031.yaml
  text: Honor God and honor the priest[a], and give them their portion[b], as you were commanded.
translation:
  language: fr
  text: Honore Dieu et témoigne du respect au prêtre[a] ; donne-leur la part qui leur revient[b], comme cela t’a été ordonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle dit : « Crains le Seigneur et glorifie le prêtre ; donne-lui sa part, comme cela t’a été ordonné depuis le commencement », puis ajoute une liste plus détaillée des offrandes dues aux prêtres.'
    reason: alternative_reading
  - marker: b
    text: 'L’hébreu porte littéralement « leur part », au pluriel, probablement en référence aux prêtres et à ce qui leur est dû collectivement. Le grec parallèle emploie le singulier : « sa part ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּבֵּד
  choice: Honore
  rationale: L’impératif intensif de כבד signifie accorder à quelqu’un le poids et l’honneur qui lui sont dus. « Honore » est direct, digne et naturel en français.
- source_word: אֵל
  choice: Dieu
  rationale: Le titre divin hébreu אֵל est rendu simplement par « Dieu ». Le grec parallèle porte « le Seigneur », mais le texte hébreu, ici assuré, demeure la source principale.
- source_word: וַהֲדַר
  choice: témoigne du respect
  rationale: Le verbe הדר exprime ici le fait de traiter avec honneur ou dignité. Cette formulation conserve la proximité sémantique avec כבד tout en évitant une répétition pesante en français.
- source_word: כֹּהֵן
  choice: au prêtre
  rationale: 'Le singulier a une valeur générique ou institutionnelle : il désigne le prêtre en tant que représentant de la fonction sacerdotale.'
- source_word: וְתֵן
  choice: donne
  rationale: L’impératif est rendu directement, sans préciser davantage la nature juridique ou cultuelle du don.
- source_word: חֶלְקָם
  choice: la part qui leur revient
  rationale: Le suffixe possessif est pluriel en hébreu malgré le singulier « prêtre ». Cette formulation française maintient le pluriel et fait naturellement référence aux prêtres collectivement et à ce qui leur est dû.
- source_word: כַּאֲשֶׁר צֻוֵּיתָה
  choice: comme cela t’a été ordonné
  rationale: La tournure passive indique un commandement antérieurement adressé au destinataire. « Cela » renvoie naturellement à l’obligation de donner la part prescrite.
theological_decisions:
- issue: Titre divin dans la proposition principale
  choice: Suivre l’hébreu אֵל et traduire par « Dieu »
  alternative: Suivre le grec parallèle et traduire par « le Seigneur »
  rationale: Le témoin hébreu est clair et bénéficie ici de la priorité. La variante grecque est néanmoins signalée en note.
- issue: Nombre du possessif dans חֶלְקָם
  choice: 'Conserver le pluriel : « leur »'
  alternative: 'Harmoniser avec le singulier « prêtre » : « sa part »'
  rationale: Le suffixe hébreu est explicitement pluriel. Il peut viser collectivement les prêtres et leurs droits, sans qu’il soit nécessaire de résoudre la tension grammaticale par une harmonisation.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier correspond à l’adresse sapientielle hébraïque. Le point-virgule distingue les deux obligations tout en conservant leur unité. Les notes préservent les différences réelles entre l’hébreu et le grec.
