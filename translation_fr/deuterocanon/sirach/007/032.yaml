  text: Bread of the mighty and an offering of the hand[a], sacrifices of righteousness and a holy contribution.
translation:
  language: fr
  text: Pain des puissants et offrande de la main[a], sacrifices de justice et contribution sainte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec porte : « Tends aussi la main au pauvre, afin que ta bénédiction soit parfaite. » L’hébreu et le grec diffèrent considérablement ici, ce qui peut indiquer une tradition textuelle différente ou une altération du texte.'
    reason: textual_variant
lexical_decisions:
- source_word: לֶחֶם
  choice: Pain
  rationale: Le sens premier est « pain »; rien dans l’hébreu conservé n’impose de généraliser en « nourriture ».
- source_word: אַבִּירִים
  choice: des puissants
  rationale: Le terme peut désigner des êtres puissants, des nobles ou, selon le contexte, des taureaux. « Des puissants » conserve l’ambiguïté de cette expression difficile sans préciser indûment son référent.
- source_word: וּתְרוּמַת יָד
  choice: et offrande de la main
  rationale: תרומה désigne une contribution ou offrande prélevée; la formulation littérale maintient l’image hébraïque tout en évitant d’imposer un sens cultuel plus précis que le texte.
- source_word: זִבְחֵי צֶדֶק
  choice: sacrifices de justice
  rationale: Le groupe construit associe étroitement les sacrifices à la justice ou à la droiture. Cette formulation formelle préserve la tension possible entre valeur morale et validité cultuelle.
- source_word: וּתְרוּמַת קֹדֶשׁ
  choice: et contribution sainte
  rationale: L’expression désigne une contribution consacrée. « Contribution sainte » conserve le vocabulaire cultuel et le parallélisme avec l’offrande précédente.
theological_decisions:
- issue: Divergence substantielle entre l’hébreu conservé et le parallèle grec
  choice: Suivre l’hébreu dans le texte principal et donner le grec en note.
  alternative: « Tends aussi la main au pauvre, afin que ta bénédiction soit parfaite. »
  rationale: L’hébreu est ici le témoin source principal, mais le grec transmet un texte entièrement différent. La note préserve cette variante importante sans tenter de résoudre une possible corruption ou divergence de tradition textuelle.
translation_notes:
  register: Français moderne, sobre et digne. La syntaxe nominale et le parallélisme de l’hébreu sont conservés. « Pain des puissants » et « offrande de la main » demeurent volontairement énigmatiques en raison de l’incertitude du texte.
