  text: Nehemiah—may his memory be honored—who raised up our ruins[a], and healed our destruction[b], and set up doors and bars.
translation:
  language: fr
  text: Néhémie — que sa mémoire soit honorée —, qui releva nos ruines[a], guérit nos dévastations et remit en place portes et barres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec précise : « qui releva pour nous des murailles tombées, établit des portes de ville et des barres, et reconstruisit nos habitations [ou : nos emplacements] ». L’hébreu parle plus largement de « nos ruines » et de « nos dévastations »; il emploie aussi l’image de la guérison.'
    reason: alternative_reading
lexical_decisions:
- source_word: יאדר זכרו
  choice: que sa mémoire soit honorée
  rationale: Cette formulation française naturelle conserve la valeur laudative ou bénédictive de l’expression hébraïque, plutôt que d’en faire un simple constat de souvenir.
- source_word: המקים
  choice: lui qui releva
  rationale: Le causatif de קום évoque le relèvement de ce qui était tombé. « Releva » préserve cette image sans réduire d’emblée le sens à « reconstruisit ».
- source_word: חרבתינו
  choice: nos ruines
  rationale: L’hébreu désigne largement les lieux dévastés. Le grec précise des murailles tombées, mais ne doit pas remplacer la formulation plus générale du témoin hébreu.
- source_word: וירפא
  choice: répara
  rationale: Le verbe signifie littéralement « guérir ». Avec des brèches ou des parties démolies, « répara » restitue naturellement en français la métaphore de guérison appliquée aux dégâts matériels.
- source_word: הריסתינו
  choice: nos brèches
  rationale: Le terme renvoie à ce qui a été abattu ou démoli. « Brèches » convient au contexte des fortifications et distingue ce membre de « nos ruines », tout en restant moins abstrait que « notre destruction ».
- source_word: ויצב
  choice: remit en place
  rationale: Le verbe exprime l’action de placer ou d’établir. Dans un contexte de restauration, « remit en place » rend clairement la réinstallation des dispositifs de fermeture.
- source_word: דלתים ובריח
  choice: portes et barres
  rationale: Littéralement « portes et barre ». Il s’agit des battants des portes urbaines et de leurs barres de fermeture; le grec confirme ce contexte défensif.
