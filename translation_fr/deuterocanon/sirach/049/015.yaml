  source_fidelity: 'La tournure française « s’il est né un homme » ne rend pas de manière viable l’hébreu elliptique אם נולד גבר : en français, elle crée une subordonnée conditionnelle sans proposition principale et laisse croire que Joseph est le sujet de « est né ». Dans le contexte et selon l’ordre des mots, la formulation se comprend plus naturellement comme une question rhétorique : « Un homme est-il jamais né comme Joseph ? » Cette solution conserve le caractère concis et emphatique du témoin hébreu sans importer l’expansion grecque.'
  naturalness: « Un homme est-il jamais né comme Joseph ? » est un français moderne, clair et suffisamment solennel. La juxtaposition suivante, « Même son corps a reçu des soins », garde l’insistance de וגם tout en restant lisible.
  terminology: « Corps » traduit fidèlement גויתו sans anticiper « os », qui appartient au grec parallèle. « A reçu des soins » rend sobrement נפקדה dans son contexte funéraire probable. Joseph, Exode et Josué sont correctement nommés; les références bibliques françaises avec point sont appropriées.
