  text: Like Joseph[a], a man was born[b]; and even his body was cared for.
translation:
  language: fr
  text: Un homme est-il jamais né comme Joseph[a] ? Même son corps a reçu des soins[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est elliptique et difficile. Il peut se comprendre comme une question rhétorique : « Un homme est-il jamais né comme Joseph ? » Le grec parallèle développe la phrase : « Mais Joseph devint un homme, chef de ses frères, soutien du peuple, et ses os reçurent des soins. »'
    reason: alternative_reading
  - marker: b
    text: Il s’agit probablement des soins accordés plus tard à la dépouille de Joseph ; voir Exode 13.19 et Josué 24.32.
    reason: cross_reference
lexical_decisions:
- source_word: כיוסף
  choice: Comme Joseph
  rationale: Le préfixe כ exprime ici la comparaison (« comme »). La formulation hébraïque reste elliptique; la traduction conserve cette concision sans intégrer au texte principal le développement grec.
- source_word: אם נולד גבר
  choice: s’il est né un homme
  rationale: Le texte transmis porte אם, normalement « si », malgré une syntaxe abrupte. Plutôt que de corriger silencieusement en interrogatif ou de supprimer le mot, la traduction préserve cette difficulté réelle et la signale en note.
- source_word: גבר
  choice: homme
  rationale: גבר désigne un homme et peut évoquer la vigueur, mais le contexte n’impose pas « homme puissant ».
- source_word: גויתו
  choice: son corps
  rationale: גויה peut désigner le corps, notamment le corps mort. « Son corps » suit précisément l’hébreu, tandis que le grec parallèle parle de ses os.
- source_word: נפקדה
  choice: a reçu des soins
  rationale: Le passif de פקד peut exprimer le fait d’être l’objet d’attention ou de soins. Dans le contexte de Joseph, il s’agit vraisemblablement du traitement ultérieur de sa dépouille.
theological_decisions:
- issue: Texte hébreu bref face au parallèle grec développé
  choice: Suivre dans le texte principal la formulation hébraïque conservée, y compris son caractère abrupt, et donner le parallèle grec en note.
  alternative: 'Adopter dans le texte principal le grec développé : « Mais Joseph devint un homme, chef de ses frères, soutien du peuple, et ses os reçurent des soins. »'
  rationale: L’hébreu conservé a priorité comme texte source. Le grec éclaire le sens et témoigne d’une forme plus longue, mais son développement ne doit pas être introduit silencieusement dans le texte principal.
- issue: Interprétation funéraire de נפקדה
  choice: Traduire de façon contextuelle par « a reçu des soins » et expliquer le lien avec la dépouille de Joseph en note.
  alternative: Traduire plus littéralement par « a été visitée » ou « a été rappelée au souvenir ».
  rationale: Le contexte narratif de Joseph et le grec « ses os » orientent vers le soin apporté à ses restes, sans exiger que le texte principal précise « ossements » ou « sépulture ».
translation_notes:
  register: 'Français moderne, digne et lisible. La tournure inhabituelle « s’il est né un homme » est volontaire : elle conserve le אם du témoin hébreu et son ambiguïté plutôt que de le corriger sans indication. Les notes rendent compte du caractère difficile du texte et de la forme grecque plus longue.'
