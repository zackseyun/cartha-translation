base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/010.yaml
  text: And as for the twelve prophets[a], may their bones flourish from where they lie[c][b]; for they healed Jacob and delivered them by faithful hope.
translation:
  language: fr
  text: Quant aux douze prophètes, que leurs os refleurissent là où ils reposent[a] ! Car ils ont guéri Jacob et l’ont élevé dans une foi pleine d’espérance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte une expression difficile, littéralement « de dessous eux » ; le grec dit « depuis leur lieu ».
    reason: textual_variant
  - marker: b
    text: 'Le grec présente une autre lecture : « ils ont réconforté Jacob et les ont délivrés dans une foi pleine d’espérance ».'
    reason: alternative_reading
lexical_decisions:
- source_word: שנים עשר הנביאים / τῶν ιβʹ προφητῶν
  choice: les douze prophètes
  rationale: Les deux témoins disent littéralement « les douze prophètes ». « Petits prophètes » serait une désignation traditionnelle postérieure, absente du texte.
- source_word: עצמתם / τὰ ὀστᾶ
  choice: leurs os
  rationale: L’hébreu et le grec désignent concrètement les os, image qui exprime ici l’honneur accordé aux prophètes après leur mort.
- source_word: פרחת / ἀναθάλοι
  choice: refleurissent
  rationale: Le verbe évoque le fait de pousser ou de fleurir. Le préfixe « re- » rend naturellement l’image d’une nouvelle floraison depuis le lieu de sépulture.
- source_word: מתחתם / ἐκ τοῦ τόπου αὐτῶν
  choice: là où ils reposent
  rationale: L’hébreu est difficile, littéralement « de dessous eux », tandis que le grec porte « depuis leur lieu ». La formulation française conserve le contexte funéraire sans imposer une image anatomique peu claire.
- source_word: החלימו / παρεκάλεσεν
  choice: ont guéri
  rationale: Le texte hébreu signifie le plus naturellement « guérir, rendre la santé ». Le grec divergent, « réconforter/encourager », est signalé en note.
- source_word: יעקב
  choice: Jacob
  rationale: Le nom propre est conservé, tout en laissant perceptible son emploi collectif pour le peuple d’Israël.
- source_word: וישגבהו
  choice: l’ont élevé
  rationale: Le verbe hébreu, avec son objet masculin singulier, se comprend naturellement comme « l’élever, le placer en hauteur ». Cette lecture suit le témoin hébreu plutôt que le grec divergent « les délivra ».
- source_word: באמונת תקוה / ἐν πίστει ἐλπίδος
  choice: par une espérance fidèle
  rationale: Cette expression française conserve le lien resserré entre fidélité/foi et espérance, sans transformer la construction ambiguë en deux vertus coordonnées.
theological_decisions:
- issue: Divergence importante entre l’hébreu et le grec dans le dernier membre
  choice: 'Suivre en texte principal l’hébreu : « ont guéri Jacob et l’ont élevé »'
  alternative: 'Le grec peut se traduire : « ont réconforté Jacob et les ont délivrés dans une foi pleine d’espérance »'
  rationale: Puisque l’hébreu est conservé ici avec une confiance élevée, il guide le texte principal. La lecture grecque, cohérente mais sensiblement différente, demeure visible dans une note afin de ne pas effacer la tension textuelle.
- issue: Sens collectif de Jacob et variation du pronom
  choice: Conserver « Jacob » et le pronom singulier « l’ » selon l’hébreu
  alternative: Employer un pluriel selon le grec, qui traite Jacob comme représentant collectivement les Israélites
  rationale: Le singulier respecte directement la syntaxe hébraïque, tandis que la note permet de rendre compte du pluriel grec et de son interprétation collective.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure optative « que leurs os refleurissent » conserve l’image poétique. Le texte principal privilégie l’hébreu conservé, tandis que les divergences majeures du grec sont documentées sans harmonisation silencieuse.
