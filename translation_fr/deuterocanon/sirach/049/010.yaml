review_pass:
  verdict: revise
  source_fidelity: Le texte principal suit avec justesse le témoin hébreu pour « ont guéri Jacob » et pour le pronom singulier dans « l’ont élevé ». L’image des os qui refleurissent est bien conservée; « là où ils reposent » rend de façon idiomatique le sens funéraire éclairé par le grec, tout en signalant la difficulté de l’hébreu. La dernière expression demande toutefois une formulation plus proche de la relation foi/espérance portée par l’hébreu et le grec.
  naturalness: Le français est moderne, fluide et d’un registre biblique sobre. « Une espérance fidèle » est grammaticalement possible, mais suggère surtout une espérance qui serait elle-même fidèle; cette formulation rend moins nettement le terme de foi/fidélité (אמונה / πίστις) associé à l’espérance.
  terminology: « Les douze prophètes », « leurs os » et « Jacob » sont exacts et non interprétatifs. « Ont élevé » convient comme rendu prudent de l’hébreu difficile וישגבהו, sans harmonisation avec le grec. « Dans une foi pleine d’espérance » explicite légèrement, mais de manière naturelle et sans surcharge doctrinale, le lien compact entre foi et espérance attesté dans les deux témoins.
  issues:
  - severity: low
    issue: « par une espérance fidèle » affaiblit la composante de foi/fidélité du syntagme final.
    rationale: Le syntagme hébreu באמונת תקוה et le grec ἐν πίστει ἐλπίδος associent explicitement foi/fidélité et espérance. En français, « espérance fidèle » qualifie principalement l’espérance et peut ne pas faire entendre cette composante.
  revised_text: Quant aux douze prophètes, que leurs os refleurissent là où ils reposent[a] ! Car ils ont guéri Jacob et l’ont élevé dans une foi pleine d’espérance[b].
