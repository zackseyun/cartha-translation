- from: Quant aux douze prophètes, que leurs os refleurissent là où ils reposent[a] ! Car ils ont guéri Jacob et l’ont élevé par une espérance fidèle[b].
  to: Quant aux douze prophètes, que leurs os refleurissent là où ils reposent[a] ! Car ils ont guéri Jacob et l’ont élevé dans une foi pleine d’espérance[b].
  rationale: La révision se limite à la dernière expression du texte principal, afin de mieux rendre la présence de la foi/fidélité associée à l’espérance dans les témoins hébreu et grec. Le choix hébreu « ont guéri Jacob et l’ont élevé » est conservé, et la note continue de présenter sans harmonisation la lecture grecque divergente.
