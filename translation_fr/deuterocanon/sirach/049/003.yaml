  text: He directed his heart to God[b][a], and in days of violence he showed loyalty.
translation:
  language: fr
  text: Il tourna son cœur vers Dieu[a] et, aux jours de violence, il fit preuve de fidélité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « vers le Seigneur », au lieu de l’hébreu « vers Dieu ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « il fit preuve de bonté ». Le grec interprète plus explicitement : « il affermit la piété ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתם
  choice: tourna
  rationale: La forme hébraïque est quelque peu incertaine, mais le grec κατεύθυνεν soutient l’idée d’orienter ou de diriger. « Tourna son cœur vers » est naturel en français et convient à l’objet « son cœur ».
- source_word: אל אל
  choice: vers Dieu
  rationale: Le texte hébreu porte « vers Dieu », tandis que le grec lit « vers le Seigneur ». Le texte principal suit le témoin hébreu conservé.
- source_word: לבו
  choice: son cœur
  rationale: « Cœur » conserve le langage anthropologique biblique, qui englobe la volonté, la pensée et l’orientation intérieure.
- source_word: ובימי חמס
  choice: aux jours de violence
  rationale: חמס désigne couramment la violence ou l’injustice. Cette formulation garde la force sociale et morale de l’hébreu; le grec évoque plutôt les jours des impies ou des gens sans loi.
- source_word: עשה חסד
  choice: fit preuve de fidélité
  rationale: חסד peut exprimer la bonté, la loyauté ou la fidélité. « Fit preuve de fidélité » reste naturel et conserve cette amplitude, tandis qu’une note signale la lecture plus explicitement religieuse du grec.
theological_decisions:
- issue: Faut-il comprendre la dernière proposition comme de la bonté envers autrui ou comme de la piété envers Dieu ?
  choice: il fit preuve de fidélité
  alternative: il fit preuve de bonté ; il affermit la piété
  rationale: L’hébreu עשה חסד demeure ouvert à la bonté comme à la fidélité loyale, alors que le grec explicite la phrase dans le sens de la piété. Le texte principal préserve l’ambiguïté de l’hébreu sans imposer le développement interprétatif grec.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure biblique « son cœur » est conservée; « aux jours de violence » maintient la concision et la gravité de l’original.
