base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/006.yaml
  text: They set the holy city on fire[a], and made its streets desolate, by the hand of Yirmeyahu; for they afflicted him[c][b], though he had been formed in the womb as a prophet.
translation:
  language: fr
  text: Ils mirent le feu à la ville sainte et dévastèrent ses rues[c], par la main de Jérémie[a] ; car ils l’avaient maltraité, lui qui avait été formé comme prophète dès le sein maternel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par l’intermédiaire de Jérémie » ou « à cause de Jérémie ». L’expression hébraïque « par la main de » est conservée dans le texte ; la syntaxe est ici condensée.
    reason: alternative_reading
  - marker: b
    text: Cette expression rappelle l’appel de Jérémie dès le sein maternel ; voir Jérémie 1.5.
    reason: cross_reference
  - marker: c
    text: Littéralement « ses chemins » ou « ses voies » ; dans le contexte d’une ville, il s’agit de ses rues.
    reason: lexical_alternative
lexical_decisions:
- source_word: ויציתו
  choice: ils mirent le feu à
  rationale: Le verbe exprime l’action d’allumer ou d’incendier. « Mettre le feu à » est idiomatique en français moderne tout en conservant l’action destructrice.
- source_word: קרית קדש
  choice: la ville sainte
  rationale: Le groupe construit hébreu signifie naturellement « la ville sainte ». Le parallèle grec présente une formulation légèrement différente, mais le témoin hébreu est ici prioritaire.
- source_word: וישמו
  choice: dévastèrent
  rationale: Le verbe décrit la mise en désolation. « Dévastèrent » rend clairement le résultat sans lourdeur.
- source_word: ארחתיה
  choice: ses rues
  rationale: Le nom désigne littéralement des chemins ou des voies ; dans le cadre d’une ville, « rues » exprime naturellement le sens contextuel.
- source_word: ביד ירמיהו
  choice: par la main de Jérémie
  rationale: Cette traduction conserve l’image et la syntaxe comprimée de l’hébreu, sans décider si Jérémie est présenté comme agent, intermédiaire prophétique ou figure liée à l’événement.
- source_word: כי ענוהו
  choice: car ils l’avaient maltraité
  rationale: Le verbe peut signifier humilier, opprimer ou affliger. « Maltraité » traduit clairement le traitement injuste subi par Jérémie sans en préciser indûment la forme.
- source_word: מרחם נוצר נביא
  choice: avait été formé comme prophète dès le sein maternel
  rationale: La formulation conserve l’idée d’une formation ou désignation prophétique remontant au sein maternel, avec une allusion probable à Jérémie 1.5.
- source_word: ירמיהו
  choice: Jérémie
  rationale: La forme française traditionnelle est immédiatement reconnaissable et convient au registre biblique moderne international.
theological_decisions:
- issue: Rapport syntaxique entre « par la main de Jérémie », la destruction de la ville et les souffrances du prophète
  choice: Maintenir « par la main de Jérémie » dans le texte principal
  alternative: « à cause de Jérémie », « par l’intermédiaire de Jérémie » ou « comme Jérémie l’avait annoncé »
  rationale: L’hébreu est condensé, et le grec conserve lui aussi une expression correspondant à « par la main de Jérémie ». Garder l’idiome dans le texte et en expliquer l’incertitude en note évite de résoudre arbitrairement la tension.
- issue: Portée de la formation prophétique dès le sein maternel
  choice: « formé comme prophète dès le sein maternel »
  alternative: « destiné dès le sein maternel à devenir prophète »
  rationale: La traduction retenue préserve l’affirmation forte de l’hébreu sans expliciter davantage le rapport entre formation, vocation et prédestination.
translation_notes:
  register: Français moderne, digne et accessible. La phrase conserve volontairement l’étrangeté mesurée de « par la main de Jérémie », tandis que les formulations environnantes restent naturelles. Les noms bibliques suivent ici l’usage français courant.
