base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/004.yaml
  text: Except for David[a], Hezekiah, and Josiah, all of them acted corruptly; the kings of Judah abandoned the law of the Most High[b], until they came to an end.
translation:
  language: fr
  text: Tous, sauf David, Ézéchias et Josias, agirent de façon perverse[a] ; les rois de Juda abandonnèrent la loi du Très-Haut, jusqu’à leur fin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tous commirent une faute », en suivant de plus près le grec ; l’hébreu évoque littéralement le fait de corrompre ou de ruiner.'
    reason: lexical_alternative
  - marker: b
    text: 'La formule hébraïque finale est concise : « jusqu’à l’achèvement/la fin ». Le grec peut se traduire : « les rois de Juda disparurent » ou « cessèrent d’exister ».'
    reason: alternative_reading
lexical_decisions:
- source_word: לבד / παρὲξ
  choice: Tous, sauf
  rationale: Cette tournure française actuelle exprime clairement l’exception introduite par l’hébreu et confirmée par le grec.
- source_word: השחיטו / πλημμελίαν ἐπλημμέλησαν
  choice: agirent de manière corrompue
  rationale: L’hébreu, de la racine שחת au hifil, évoque l’action de corrompre ou de ruiner, tandis que le grec parle de commettre une faute. La formulation retenue conserve la portée morale sans préciser indûment la nature de la faute.
- source_word: ויעזבו / κατέλιπον
  choice: abandonnèrent
  rationale: Le verbe exprime ici un délaissement coupable, et non un simple départ ; « abandonnèrent » rend naturellement cette force.
- source_word: תורת עליון / τὸν νόμον τοῦ ὑψίστου
  choice: la loi du Très-Haut
  rationale: « Loi » convient au contexte royal et concorde avec le grec νόμος, tout en conservant « le Très-Haut » comme titre divin.
- source_word: מלכי יהודה
  choice: les rois de Juda
  rationale: Traduction directe qui préserve la référence historique et correspond au parallèle grec.
- source_word: עד תמם / ἐξέλιπον
  choice: jusqu’à leur fin
  rationale: Cette expression concise garde le caractère elliptique de l’hébreu et le sens d’aboutissement, sans décider s’il s’agit précisément de leur mort, de leur disparition ou de la fin de la royauté.
theological_decisions:
- issue: Interprétation de la proposition finale עד תמם à la lumière du grec ἐξέλιπον
  choice: 'La proposition est rattachée à l’abandon de la loi : « jusqu’à leur fin ».'
  alternative: 'Lire une proposition indépendante : « les rois de Juda disparurent » ou « cessèrent d’exister ».'
  rationale: L’hébreu est très concis, tandis que le grec explicite l’idée que les rois de Juda prirent fin. La traduction principale conserve l’ambiguïté syntaxique et la tension du texte sans préciser la forme exacte de cette fin.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste accessible tout en conservant la concision et l’ambiguïté de la dernière proposition hébraïque.
