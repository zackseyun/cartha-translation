  text: Ezekiel saw a vision[a], and described the kinds of the chariot.
translation:
  language: fr
  text: Ézékiel vit une vision[a] et décrivit les différentes formes du char.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Ézékiel, qui vit une vision de gloire qui lui fut montrée sur un char de chérubins. » L’hébreu est plus bref, et l’expression rendue par « les différentes formes du char » est peut-être condensée ou incertaine.'
    reason: alternative_reading
lexical_decisions:
- source_word: וחזקאל
  choice: Ézékiel
  rationale: Nom propre du prophète, sous sa forme française usuelle.
- source_word: ראה
  choice: vit
  rationale: Rend simplement le verbe courant « voir » au passé simple, dans un registre narratif digne et naturel.
- source_word: מראה
  choice: une vision
  rationale: Dans ce contexte prophétique, le terme désigne une perception visionnaire; le grec ὅρασιν confirme ce sens.
- source_word: ויגד
  choice: décrivit
  rationale: Le hifil de נגד signifie « annoncer, raconter, faire connaître ». Avec pour objet les aspects du char, « décrivit » donne ici un français idiomatique sans surinterpréter le contenu.
- source_word: זני
  choice: les différentes formes du
  rationale: Le mot transmis paraît signifier « sortes, espèces ». « Les différentes formes » préserve cette pluralité tout en étant plus naturel en français que « les sortes du char »; la formulation hébraïque demeure toutefois inhabituelle et possiblement incertaine.
- source_word: מרכבה
  choice: char
  rationale: Sens direct du mot hébreu. Le contexte évoque le char divin d’Ézékiel, mais le texte hébreu n’explicite ni la gloire ni les chérubins.
theological_decisions:
- issue: Faut-il développer le verset selon l’image de la gloire divine et des chérubins présente dans le grec ?
  choice: Conserver dans le texte principal la formulation concise fondée sur l’hébreu.
  alternative: « Ézékiel, qui vit une vision de gloire qui lui fut montrée sur un char de chérubins. »
  rationale: L’hébreu conservé est prioritaire, même si זני est une formulation comprimée ou incertaine. Le grec constitue un témoin important, mais son développement ne doit pas être introduit silencieusement dans le texte principal; il est donc signalé en note.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient à cette brève rétrospective historique. « Les différentes formes du char » conserve l’étrangeté réelle de l’hébreu sans produire une tournure inutilement obscure.
