  text: He also mentioned Job[a], who upheld all the ways of righteousness.
translation:
  language: fr
  text: Il mentionna aussi Job[a], qui soutint toutes les voies de la justice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec porte : « Car il se souvint des ennemis sous l’averse, et fit du bien à ceux qui aplanissent les chemins. » Le témoin hébreu mentionne plutôt Job, « qui soutint toutes les voies de la justice ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וגם
  choice: aussi
  rationale: Conserve la valeur additive de l’hébreu et relie Job aux figures précédemment évoquées.
- source_word: הזכיר
  choice: mentionna
  rationale: 'Rend directement le sens factitif ou déclaratif de זכר au hifil : faire mention de quelqu’un. « Se souvint de » correspond davantage au parallèle grec qu’au témoin hébreu.'
- source_word: את איוב
  choice: Job
  rationale: Emploie la forme française traditionnelle du nom propre.
- source_word: ומכלכל
  choice: qui resta fidèle à
  rationale: Le participe de כלכל peut exprimer l’action de soutenir, de maintenir ou de conduire. Avec « toutes les voies de la justice », cette formulation française naturelle exprime la persévérance constante de Job sans réduire le verbe à une simple aide matérielle.
- source_word: כל דרכי צדק
  choice: toutes les voies de la justice
  rationale: Conserve l’image hébraïque des voies et la portée morale de צדק. « Droiture » serait également possible, mais « justice » maintient l’éventail sémantique du terme.
theological_decisions:
- issue: Le texte hébreu et le parallèle grec présentent des formulations sensiblement différentes.
  choice: 'Le texte principal suit le témoin hébreu conservé : Job est mentionné comme celui qui resta fidèle à toutes les voies de la justice.'
  alternative: Le grec évoque le souvenir des ennemis sous l’averse et le fait de faire du bien à ceux qui rendent droits les chemins.
  rationale: Lorsque l’hébreu du Siracide est conservé avec une bonne assurance textuelle, il sert de texte principal. La tradition grecque divergente est néanmoins signalée afin de ne pas masquer la variation textuelle.
translation_notes:
  register: Français international moderne, sobre et digne. « Resta fidèle à » évite le tour peu naturel « maintint toutes les voies » tout en exprimant la persévérance suggérée par מכלכל. Le marqueur [a] est placé après « Job », là où commence la divergence majeure avec le grec.
