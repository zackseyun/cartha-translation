  text: Few have been created on earth like Enoch, and he too was taken from the earth.
translation:
  language: fr
  text: Peu d’êtres humains ont été créés sur la terre comme Hénoc[a], et lui aussi a été enlevé de la terre[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie une formulation plus absolue : « Pas même un seul n’a été créé comme Hénoc sur la terre. » Le témoin hébreu dit « peu » plutôt que « personne ».'
    reason: alternative_reading
  - marker: b
    text: Le dernier mot hébreu est difficile ici. Le grec lit « de la terre », leçon suivie dans le texte principal.
    reason: textual_variant
  - marker: c
    text: 'Autre traduction possible : « a été emporté ». La formulation rappelle le récit de la disparition d’Hénoc (voir Genèse 5.24).'
    reason: lexical_alternative
lexical_decisions:
- source_word: מעט
  choice: Peu d’êtres humains
  rationale: Le quantificateur hébreu signifie « peu » ou « un petit nombre ». L’ajout explicatif « d’êtres humains » rend la phrase naturelle en français sans adopter la négation absolue du grec.
- source_word: נוצרו
  choice: ont été créés
  rationale: La forme passive évoque des êtres formés ou créés, vraisemblablement avec Dieu comme agent implicite. « Ont été créés » correspond aussi au grec ἐκτίσθη.
- source_word: כחנוך
  choice: comme Hénoc
  rationale: Le préfixe כ exprime ici la comparaison ; « comme Hénoc » est idiomatique et précis.
- source_word: וגם הוא
  choice: et lui aussi
  rationale: Cette formulation conserve la valeur additive et emphatique de l’hébreu dans un français naturel.
- source_word: נלקח
  choice: a été enlevé
  rationale: Le verbe signifie littéralement « prendre » et, dans ce contexte, évoque la disparition exceptionnelle d’Hénoc. « A été enlevé » conserve l’idiome biblique sans préciser excessivement la destination.
- source_word: פנים
  choice: de la terre
  rationale: Le dernier mot hébreu transmis est difficile dans ce contexte. La leçon grecque ἀπὸ τῆς γῆς, « de la terre », fournit ici le sens cohérent retenu, avec signalement en note.
theological_decisions:
- issue: Degré d’explicitation de l’enlèvement d’Hénoc
  choice: a été enlevé de la terre
  alternative: a été élevé / enlevé auprès de Dieu
  rationale: La formulation retenue suit l’éclairage du grec tout en restant sobre. Elle ne précise ni le mécanisme ni la destination de l’enlèvement et préserve ainsi la retenue du texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Peu d’êtres humains » explicite le sujet humain sous-entendu afin d’éviter le tour peu naturel « peu ont été créés ». Le texte conserve la comparaison avec Hénoc et la voix passive à agent divin implicite.
