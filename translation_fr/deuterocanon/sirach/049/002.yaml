translation:
  language: fr
  text: Car il a eu pitié de notre égarement[a] et a fait disparaître les abominations du néant[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec peut se traduire plus littéralement : « Il fut guidé dans le retour du peuple », ou, selon une autre compréhension : « Il réussit lors de la repentance du peuple. » L’hébreu dit « notre égarement », tandis que le grec présente le retournement sous un jour positif.'
    reason: alternative_reading
  - marker: b
    text: 'Les « abominations du néant » désignent probablement des abominations idolâtres : en hébreu, « néant » peut servir de terme polémique pour parler des idoles.'
    reason: lexical_alternative
  - marker: c
    text: 'Le grec lit : « les abominations de l’iniquité », au lieu de l’hébreu : « les abominations du néant ».'
    reason: textual_variant
lexical_decisions:
- source_word: נחל
  choice: a eu pitié
  rationale: La forme hébraïque est difficile. Dans le contexte des réformes de Josias, cette traduction exprime une réaction miséricordieuse à l'égarement du peuple sans imposer une reconstruction trop précise.
- source_word: על משובתינו
  choice: de nos égarements
  rationale: משובה désigne couramment l'infidélité, l'apostasie ou le fait de se détourner. « Nos égarements » conserve la valeur négative de l'hébreu et le suffixe de première personne du pluriel, dans un français naturel.
- source_word: וישבת
  choice: et a fait disparaître
  rationale: Le verbe indique ici qu'il a fait cesser ou supprimé des pratiques réprouvées. « A fait disparaître » rend clairement ce résultat.
- source_word: תועבות
  choice: les abominations
  rationale: Ce terme conserve la forte réprobation morale et cultuelle de l'hébreu, notamment dans un contexte idolâtre.
- source_word: הבל
  choice: du néant
  rationale: הבל évoque ce qui est vain, vide, inconsistant, et sert souvent de terme polémique pour les idoles. « Du néant » préserve l'image hébraïque sans expliciter indûment « idoles ».
theological_decisions:
- issue: Faut-il harmoniser l'hébreu משובה avec le grec ἐπιστροφή dans un sens positif de retour ou de repentance ?
  choice: 'Conserver dans le texte principal le sens négatif de l''hébreu : « nos égarements ».'
  alternative: « leur retour », « le retour du peuple » ou « la repentance du peuple ».
  rationale: Le témoin hébreu conservé a priorité et משובה porte normalement un sens négatif. Le grec atteste toutefois une compréhension positive du retournement du peuple ; cette variante réelle est donc signalée en note.
- issue: Faut-il rendre הבל directement par « idoles » ?
  choice: Traduire par « néant ».
  alternative: « idoles », « vanité » ou « choses sans valeur ».
  rationale: Le contexte vise probablement l'idolâtrie, mais le mot hébreu demeure métaphorique et plus large. « Néant » garde cette image et évite une explicitation excessive.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste proche de l'hébreu tout en étant idiomatique. « Égarements » évite l'archaïsme de « infidélités » pris isolément et rend la dérive religieuse ; « néant » conserve la métaphore polémique de הבל.
