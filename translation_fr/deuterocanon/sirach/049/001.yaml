base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/001.yaml
  text: The name of Josiah is like blended incense[a], the work of a perfumer; his memory is sweet as honey to the mouth[b], and like music at a banquet of wine.
translation:
  language: fr
  text: Le nom de Josias est comme un encens composé d’aromates[a], préparé par un parfumeur ; son souvenir est doux comme le miel au palais, comme de la musique lors d’un banquet de vin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit : « Le souvenir de Josias est pour une composition d’encens, préparée par le travail d’un parfumeur ; dans toute bouche, il sera doux comme le miel, et comme de la musique lors d’un banquet de vin. » L’hébreu met d’abord en avant son « nom », tandis que le grec met en avant son « souvenir ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « comme un chant lors d’un banquet de vin ». Le mot hébreu peut désigner un chant, tandis que le grec a le sens plus large de « musique ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שם
  choice: Le nom
  rationale: Le témoin hébreu porte explicitement « nom ». Le sens de réputation gardée en mémoire apparaît ensuite dans « son souvenir » ; le grec met dès l’abord l’accent sur le souvenir.
- source_word: כקטורת סמים
  choice: comme un encens aromatique
  rationale: קטורת désigne l’encens et סמים les substances odorantes qui entrent dans sa composition. « Encens aromatique » est naturel en français et conserve l’image d’un encens composé.
- source_word: וממלה מעשה רוקח
  choice: préparé par le parfumeur
  rationale: La forme hébraïque וממלה est difficile, mais le contexte de composition et le grec ἐσκευασμένον soutiennent l’idée de préparation. רוקח désigne l’artisan qui compose parfums, aromates ou onguents.
- source_word: בחך כדבש ימתיק זכרו
  choice: son souvenir est doux comme le miel au palais
  rationale: חך signifie proprement « palais » et זכרו « son souvenir ». L’imparfait ימתיק peut ici exprimer une vérité descriptive ou générale ; le présent français rend naturellement cette valeur.
- source_word: וכמזמור
  choice: comme une musique
  rationale: מזמור peut être un chant accompagné de musique. Le grec μουσικά confirme ici le sens plus large de « musique », bien adapté à un banquet.
- source_word: על משתה היין
  choice: lors d’un banquet où coule le vin
  rationale: משתה היין désigne un festin ou banquet de vin. Cette formulation française restitue naturellement la scène festive sans suggérer que le vin constitue à lui seul le banquet.
