base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/012.yaml
  text: So also Yehoshua son of Jehozadak[a], who in distress raised up an altar; and they raised up a holy temple, established for everlasting glory.
translation:
  language: fr
  text: De même, Yehoshoua, fils de Yehotsadaq, qui, dans la détresse, dressa un autel[a] ; ils élevèrent un temple sacré, établi pour une gloire éternelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans l’édition hébraïque, toute la proposition « De même, Yehoshoua, fils de Yehotsadaq, qui, dans la détresse, dressa un autel » est placée entre crochets, signe que son texte est incertain. Elle ne figure pas dans le parallèle grec.
    reason: textual_variant
lexical_decisions:
- source_word: גם
  choice: De même
  rationale: Introduit Yehoshoua comme une autre figure digne de mémoire dans la série, avec une liaison naturelle en français.
- source_word: יהושע בן יהוצדק
  choice: Yehoshoua fils de Yehotsadaq
  rationale: Translittère les formes hébraïques des noms tout en employant une graphie lisible en français.
- source_word: אשר במצוק הקימו מזבח
  choice: qui, dans la détresse, dressa un autel
  rationale: « Dresser un autel » rend naturellement הקים מזבח. Le singulier français rattache la relative à Yehoshoua, bien que la forme hébraïque הקימו soit plurielle et que toute la proposition soit textuellement incertaine.
- source_word: וירימו
  choice: ils élevèrent
  rationale: Conserve le sens concret de « lever, élever » et le sujet pluriel du verbe hébreu, sans préciser davantage l’identité du groupe.
- source_word: היכל קדש
  choice: un temple saint
  rationale: היכל désigne ici le temple ; l’absence d’article favorise l’indéfini, et קדש exprime son caractère sacré.
- source_word: ומכונן
  choice: établi
  rationale: Rend l’idée d’un édifice fondé, affermi ou mis durablement en place, sous une forme concise et naturelle.
- source_word: לכבוד עולם
  choice: pour une gloire éternelle
  rationale: כבוד signifie « gloire, honneur » et עולם exprime ici une durée sans fin ou permanente.
theological_decisions:
- issue: Statut de la proposition concernant l’autel
  choice: La proposition est conservée dans le texte avec un appel de note signalant son incertitude.
  alternative: Omettre la proposition du texte principal et ne la donner qu’en note.
  rationale: Elle figure dans le témoin hébreu fourni, mais entre crochets éditoriaux, et elle manque dans le parallèle grec. La conserver tout en signalant clairement son statut évite à la fois de la supprimer sans trace et de masquer son incertitude.
- issue: Sujet pluriel de « ils élevèrent »
  choice: Maintenir le pluriel sans identifier explicitement ses référents.
  alternative: Transformer le sujet en singulier et attribuer toute l’action à Yehoshoua.
  rationale: Le texte hébreu porte un verbe pluriel, tandis que le grec évoque également ceux qui vécurent à leur époque. Une formulation plurielle préserve cette donnée sans résoudre artificiellement l’ambiguïté.
translation_notes:
  register: Français moderne, digne et accessible. Le point-virgule conserve le lien entre la proposition incertaine sur l’autel et la ligne plus sûre sur le temple, tandis que les noms suivent une translittération lisible de l’hébreu.
