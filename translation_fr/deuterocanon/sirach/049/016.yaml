  source_fidelity: Le texte hébreu nomme explicitement Sem, Seth et Énosh, puis attribue un suffixe pluriel à « gloire » (עמם). La traduction doit donc conserver ces trois noms et ne pas introduire Adam dans le texte principal. La divergence avec le grec est correctement signalée.
  naturalness: « Mais » ne correspond pas au simple waw de coordination. De plus, « au-dessus de tout être vivant, leur gloire à eux tous » est une phrase nominale lourde et ambiguë en français. Une formulation verbale rend clairement la relation de supériorité exprimée par l’hébreu.
  terminology: « Furent honorés » convient à נפקדו dans le contexte laudatif. « Gloire » rend bien תפארת. Les graphies Sem, Seth et Énosh sont appropriées en français moderne.
