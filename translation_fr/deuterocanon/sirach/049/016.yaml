  text: Shem and Seth were honored, and above every living thing was Adam’s glory.
translation:
  language: fr
  text: Sem, Seth et Énosh furent honorés, et leur gloire dépasse celle de tout être vivant.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente une forme différente du verset : « Sem et Seth furent glorifiés parmi les hommes, et Adam au-dessus de tout être vivant dans la création. » Il omet Énosh dans le premier membre et nomme Adam dans le second.'
    reason: Signaler la divergence textuelle importante avec le grec, sans introduire Adam dans le texte fondé sur l’hébreu.
lexical_decisions:
- source_word: נפקדו
  choice: furent honorés
  rationale: Dans ce contexte d’éloge des ancêtres, le verbe signifie qu’ils furent distingués ou tenus en honneur, plutôt que simplement « mentionnés ».
- source_word: תפארת
  choice: gloire
  rationale: Rend directement l’idée de splendeur, d’honneur et de prééminence portée par le substantif hébreu.
- source_word: עמם
  choice: leur gloire à eux tous
  rationale: Le texte hébreu porte littéralement « leur gloire / la gloire avec eux », avec un suffixe pluriel qui renvoie naturellement aux trois noms précédents; cette lecture diffère du grec, qui nomme Adam.
theological_decisions:
- issue: Identité de la figure suprême dans le second membre
  choice: Conserver le suffixe pluriel hébreu et rapporter la gloire à Sem, Seth et Énosh collectivement.
  alternative: 'Suivre le grec: « et, au-dessus de tout être vivant dans la création, Adam »; ou l’anglais de consultation: « la gloire d’Adam ».'
  rationale: La source hébraïque fournie, de confiance élevée, lit עמם et nomme explicitement Énosh; il ne faut pas remplacer cette donnée par la forme grecque divergente.
translation_notes:
  register: Français moderne, digne et accessible. La tournure emphatique « à eux tous » rend clairement le suffixe pluriel hébreu tout en évitant d’introduire Adam depuis la tradition grecque.
