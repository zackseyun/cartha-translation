  text: How shall we praise Zerubbabel? He was like a signet ring on the right hand[a][b].
translation:
  language: fr
  text: Comment célébrer Zorobabel ? Il était comme un anneau à cachet à la main droite[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Comment exalter Zorobabel ? » Le grec parallèle porte « exalter » ou « magnifier », tandis que l’hébreu permet aussi le sens de « louer » ou « célébrer ».
    reason: lexical_alternative
  - marker: b
    text: Ou « comme un sceau » ou « comme un cachet ». L’image évoque probablement l’honneur et une valeur particulière ; comparer l’image de l’anneau à cachet en Aggée 2.23.
    reason: cross_reference
lexical_decisions:
- source_word: מה נהללה
  choice: Comment célébrer
  rationale: L’interrogatif hébreu suivi de la forme volitive exprime une admiration rhétorique. « Comment célébrer… ? » est naturel en français moderne et peut signifier louer ou exalter, sans forcer la nuance du parallèle grec μεγαλύνωμεν.
- source_word: זרבבל
  choice: Zorobabel
  rationale: Forme française biblique usuelle du nom propre.
- source_word: כחותם
  choice: comme un anneau à cachet
  rationale: חותם désigne un sceau ou cachet. La mention de la main favorise ici l’objet porté, l’anneau à cachet, plutôt que le sceau pris abstraitement.
- source_word: על יד ימין
  choice: à la main droite
  rationale: Rend directement l’image hébraïque, confirmée par le grec ἐπὶ δεξιᾶς χειρός, dans une formulation française idiomatique.
theological_decisions:
- issue: Image métaphorique de Zorobabel comme sceau à la main droite
  choice: Conserver directement l’image de l’anneau à cachet, sans en expliciter le sens dans le corps du texte.
  alternative: comme un sceau à la main droite
  rationale: L’image peut évoquer l’honneur, le choix et la valeur particulière, notamment en écho à Aggée 2.23, mais le verset n’explicite pas ces résonances. La traduction préserve donc la métaphore et son ouverture interprétative.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique est conservée, ainsi que l’image concrète et non explicitée du cachet porté à la main droite.
