translation:
  language: fr
  text: Ils donnèrent leur corne[a] à d’autres[b], et leur gloire à une nation étrangère et insensée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « leur puissance » : dans la Bible, la corne représente souvent la force ou le pouvoir.'
    reason: lexical_alternative
  - marker: b
    text: Le grec porte « à d’autres ». L’hébreu transmis a une formulation difficile, littéralement « il donna leur corne en arrière ».
    reason: textual_variant
lexical_decisions:
- source_word: קרנם
  choice: leur corne
  rationale: Le nom hébreu קֶרֶן désigne littéralement la « corne » et, par métaphore, la force ou la puissance. Le grec κέρας confirme cette image biblique, conservée dans le texte.
- source_word: לאחור
  choice: à d’autres
  rationale: La forme hébraïque transmise signifie normalement « en arrière » et paraît difficile ici. Le parallèle grec ἑτέροις (« à d’autres ») fournit un sens cohérent, adopté dans le texte et signalé en note.
- source_word: כבודם
  choice: leur gloire
  rationale: כָּבוֹד peut exprimer la gloire, l’honneur ou la splendeur. « Gloire » maintient le registre poétique et correspond au grec δόξα.
- source_word: גוי
  choice: nation
  rationale: גּוֹי désigne ici une collectivité nationale; « nation » en conserve la portée politique et collective.
- source_word: נבל
  choice: insensée
  rationale: נָבָל exprime une folie chargée d’une condamnation morale. « Insensée » rend cette nuance dans un français digne et naturel.
- source_word: נכרי
  choice: étrangère
  rationale: נָכְרִי signifie « étranger ». L’adjectif qualifie naturellement « nation » et concorde avec le grec ἀλλοτρίῳ.
theological_decisions:
- issue: Portée métaphorique de la corne
  choice: Conserver « corne » dans le texte principal.
  alternative: Traduire explicitement par « force » ou « puissance ».
  rationale: La corne est une image biblique établie de la puissance. La conserver évite de réduire la richesse poétique et théologique du texte; la note en explicite le sens.
- issue: Leçon difficile de לאחור et divergence sur le nombre du verbe
  choice: 'Suivre le sens cohérent attesté par le grec : « Ils livrèrent leur corne à d’autres ».'
  alternative: 'Rendre strictement l’hébreu transmis : « Il plaça leur corne en arrière » ou « Il fit reculer leur corne ».'
  rationale: L’hébreu composite présente ici une formulation difficile, avec un verbe au singulier et לאחור (« en arrière »), tandis que le grec porte un verbe au pluriel et « à d’autres ». Le grec paraît conserver la lecture contextuellement intelligible; l’incertitude textuelle est rendue visible en note.
translation_notes:
  register: Français international moderne, sobre et poétique. « Livrèrent » convient à la perte volontaire ou coupable suggérée par le contexte; « insensée » garde la portée morale de נבל sans imposer une qualification doctrinale plus précise.
