  text: to uproot and to tear down and to destroy[a], to overthrow[b]; and likewise to build and to plant and to raise high.
translation:
  language: fr
  text: pour déraciner, abattre et détruire, pour démolir[b] ; et de même, pour bâtir, planter et élever[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu ajoute ici un dernier verbe positif, qui peut signifier « élever », « placer en hauteur » ou « mettre à l’abri ». Le texte grec est plus court et s’achève par « bâtir et planter ».
    reason: textual_variant
  - marker: b
    text: Cette suite de verbes fait délibérément écho à la mission prophétique confiée à Jérémie en Jérémie 1.10, bien que la formulation hébraïque du Siracide ne soit pas identique.
    reason: cross_reference
lexical_decisions:
- source_word: לנתוש
  choice: déraciner
  rationale: Le verbe נתש désigne l’action d’arracher avec les racines. « Déraciner » est naturel en français et conserve l’écho de Jérémie 1.10.
- source_word: לנתוץ
  choice: abattre
  rationale: נתץ évoque la destruction ou la mise à bas, notamment d’un ouvrage. « Abattre » garde la force concrète du terme sans anticiper le verbe suivant.
- source_word: ולהאביד
  choice: détruire
  rationale: La forme causative de אבד exprime le fait de faire périr ou de vouer à la destruction. « Détruire » en donne ici le sens direct.
- source_word: להרוס
  choice: démolir
  rationale: הרס désigne l’action de renverser ou de démolir. « Démolir » maintient l’image concrète et assume le parallélisme insistant des verbes de destruction.
- source_word: וכן
  choice: et de même
  rationale: וכן introduit le volet positif correspondant de la mission. « Et de même » rend clairement cet équilibre.
- source_word: לבנות
  choice: bâtir
  rationale: Le verbe signifie simplement « bâtir » ou « construire ». « Bâtir » convient au registre prophétique sans ajouter l’idée non exprimée de reconstruction.
- source_word: לנטע
  choice: planter
  rationale: « Planter » est l’équivalent direct de נטע et préserve le couple prophétique « bâtir et planter ».
- source_word: ולהשגיב
  choice: élever
  rationale: Le verbe issu de שגב peut évoquer l’action d’élever, de placer en hauteur ou de mettre en sûreté. « Élever » conserve cette ouverture sémantique sans choisir exclusivement entre exaltation et protection.
theological_decisions:
- issue: Écho intertextuel à la mission prophétique de Jérémie
  choice: Conserver la succession des infinitifs et sa cadence, tout en suivant le texte hébreu propre au Siracide.
  alternative: Harmoniser entièrement la formulation avec Jérémie 1.10, ou suivre la suite grecque plus courte.
  rationale: Le texte hébreu fait clairement écho à Jérémie 1.10, mais son vocabulaire n’est pas identique. La traduction maintient l’allusion sans effacer les particularités du Siracide.
- issue: Verbe final ולהשגיב absent du parallèle grec
  choice: Inclure « élever » dans le texte principal et signaler en note la leçon grecque plus courte ainsi que l’étendue possible du sens hébreu.
  alternative: Omettre le dernier verbe, ou le préciser par « mettre à l’abri » ou « exalter ».
  rationale: Le témoin hébreu conservé est prioritaire. Toutefois, l’absence d’équivalent grec et la latitude sémantique du verbe justifient une note qui préserve l’incertitude textuelle et lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition des infinitifs est maintenue pour rendre la cadence de la commission prophétique. Le point-virgule fait ressortir le passage des actions destructrices aux actions constructives.
