base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/019.yaml
  text: What offspring is honorable? Human offspring[a]. What offspring is honorable? Those who fear God[b]. What offspring is honorable? Those who keep the commandment.
translation:
  language: fr
  text: Quelle descendance est digne d’honneur ? La descendance humaine.[a] Quelle descendance est digne d’honneur ? Ceux qui craignent Dieu.[b] Quelle descendance est digne d’honneur ? Ceux qui gardent le commandement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente ici une autre suite : « Quelle descendance est indigne d’honneur ? La descendance humaine. » L’hébreu porte à la place : « Quelle descendance est digne d’honneur ? Ceux qui gardent le commandement. »'
    reason: textual_variant
  - marker: b
    text: Le grec a « ceux qui craignent le Seigneur », là où l’hébreu lit « ceux qui craignent Dieu ».
    reason: alternative_reading
lexical_decisions:
- source_word: זֶרַע / σπέρμα
  choice: descendance
  rationale: Le terme collectif est répété comme mot-clé rhétorique. « Descendance » garde le sens généalogique collectif sans employer le littéral « semence », peu naturel ici en français moderne.
- source_word: נִכְבָּד / ἔντιμον
  choice: digne d’honneur
  rationale: Cette expression rend la valeur et le statut honorable sans la possible connotation aristocratique de « noble ».
- source_word: מַה / ποῖον
  choice: quelle
  rationale: L’interrogatif introduit une classification rhétorique; « quelle descendance » est concis et naturel en français.
- source_word: לֶאֱנוֹשׂ / ἀνθρώπου
  choice: humaine
  rationale: Le mot renvoie à l’humanité de façon générique, sans portée exclusivement masculine.
- source_word: יְרֵא אֱלֹהִים / οἱ φοβούμενοι τὸν κύριον
  choice: ceux qui craignent Dieu
  rationale: Le texte hébreu, retenu comme source principale là où il subsiste, porte « Dieu »; la tournure rend naturellement le participe.
- source_word: שׂוֹמֵר מִצְוָה
  choice: ceux qui gardent le commandement
  rationale: Le singulier « le commandement » est conservé. « Garder » maintient l’idiome biblique de שמר et son sens d’observance fidèle.
theological_decisions:
- issue: Divergence majeure entre l’hébreu et le grec dans les derniers membres du verset
  choice: Suivre le texte hébreu dans le corps du verset et signaler en note la dernière ligne contrastive du grec.
  alternative: 'Le grec porte : « Quelle descendance est indigne d’honneur ? La descendance humaine. »'
  rationale: L’hébreu subsistant présente trois formulations positives et se termine par « ceux qui gardent le commandement », tandis que le grec transmet une dernière formulation négative. L’hébreu étant la source principale lorsqu’il est conservé dans le Siracide, il est suivi sans masquer la variante grecque substantielle.
- issue: Nom divin dans le deuxième membre
  choice: Dieu
  alternative: le Seigneur
  rationale: L’hébreu lit אֱלֹהִים, « Dieu », tandis que le grec parallèle lit κύριον, « le Seigneur ». La traduction principale suit l’hébreu et la note conserve la différence.
translation_notes:
  register: Français international moderne, digne et aphoristique. La triple question est maintenue pour préserver la structure rhétorique de l’hébreu; « digne d’honneur » évite de suggérer une noblesse de naissance.
