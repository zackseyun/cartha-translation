  text: For any offense[a], do not repay your neighbor with evil, and do not walk in the way of pride.
translation:
  language: fr
  text: Quelle que soit l’offense[a], ne rends pas le mal à ton prochain et ne marche pas sur la voie de l’orgueil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « Pour toute injustice, ne t’irrite pas contre ton prochain », ce qui met l’accent sur la colère ou le ressentiment plutôt que sur les représailles.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּכֵל פֶּשַׁע
  choice: Quelle que soit l’offense
  rationale: 'La locution signifie littéralement « pour/dans toute offense ». Placée devant l’interdiction, cette formulation française exprime naturellement la portée universelle : aucune offense ne justifie la riposte.'
- source_word: אַל תְּשַׁלֵּם רַע
  choice: ne rends pas le mal
  rationale: Au piel, שׁלם signifie ici « rendre, rétribuer ». « Rendre le mal » conserve clairement l’idée de représailles et constitue une expression française naturelle.
- source_word: לְרֵע
  choice: à ton prochain
  rationale: רֵעַ désigne le prochain, le compagnon ou le semblable. « Ton prochain » convient au registre sapientiel et correspond aussi au grec τῷ πλησίον.
- source_word: וְאַל תִּהֲלַךְ
  choice: et ne marche pas
  rationale: Le sens concret de הלך, « marcher », porte ici la métaphore traditionnelle de la conduite; celle-ci demeure claire en français.
- source_word: בְּדֶרֶךְ גַּאֲוָה
  choice: dans la voie de l’orgueil
  rationale: Cette traduction garde la métaphore de דֶּרֶךְ et rend גַּאֲוָה par « orgueil », qui couvre ici l’attitude hautaine ou arrogante.
theological_decisions:
- issue: Divergence entre l’hébreu et le grec dans la première interdiction
  choice: 'Le texte principal suit l’hébreu : « ne rends pas le mal »; la leçon grecque est signalée en note.'
  alternative: « ne garde pas de ressentiment contre ton prochain » ou « ne te mets pas en colère contre ton prochain »
  rationale: Le témoin hébreu, disponible et jugé sûr, interdit la rétribution mauvaise. Le grec met plutôt l’accent sur la colère ou le ressentiment. La différence est significative et ne doit pas être effacée.
translation_notes:
  register: Français international moderne, concis et digne. Le tutoiement singulier correspond à l’adresse sapientielle hébraïque. La métaphore « marcher dans la voie » est conservée parce qu’elle reste intelligible et porte la dimension de conduite habituelle.
