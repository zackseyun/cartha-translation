  text: For the hope of arrogance is sin[a], and its source pours out wickedness.
translation:
  language: fr
  text: Car l’espoir de l’arrogance, c’est le péché[a], et la source de celle-ci fait jaillir la perversité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « Car le commencement de l’orgueil, c’est le péché, et celui qui s’y attache répandra l’abomination. » Le grec présente une première proposition sensiblement différente et développe autrement la seconde.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִקְוֵה
  choice: l’espoir
  rationale: Le nom hébreu peut désigner l’espoir ou ce en quoi l’on place sa confiance. Ce choix suit le témoin hébreu, malgré la leçon grecque « commencement ».
- source_word: זָדוֹן
  choice: l’arrogance
  rationale: Le terme désigne une attitude orgueilleuse, présomptueuse ou insolente. « Arrogance » en restitue clairement la portée morale en français contemporain.
- source_word: חֵטְא
  choice: le péché
  rationale: Équivalent direct du nom hébreu, également confirmé par le grec ἁμαρτία.
- source_word: מְקוֹרָהּ
  choice: sa source
  rationale: Cette formulation conserve l’image d’une source et l’ambiguïté du suffixe féminin, qui renvoie très probablement à l’arrogance personnifiée.
- source_word: יַבִּיעַ
  choice: fait jaillir
  rationale: Le verbe évoque ce qui sourd ou jaillit d’une source. « Fait jaillir » maintient cette image en français naturel.
- source_word: זִמָּה
  choice: la perversité
  rationale: Le mot peut désigner un dessein mauvais, une conduite infâme ou la dépravation. « Perversité » conserve sa force morale sans le limiter à l’inconduite sexuelle.
theological_decisions:
- issue: Divergence entre l’hébreu מִקְוֵה (« espoir ») et le grec ἀρχή (« commencement »)
  choice: 'Suivre dans le texte principal le témoin hébreu : « l’espoir de l’arrogance, c’est le péché »'
  alternative: « le commencement de l’orgueil, c’est le péché »
  rationale: Puisque le texte hébreu est conservé ici, il reçoit la priorité. La tradition grecque témoigne toutefois d’une différence interprétative importante, signalée en note plutôt qu’harmonisée silencieusement.
translation_notes:
  register: Français international moderne, clair et digne. La tournure disloquée « c’est le péché » rend lisible la proposition nominale tout en préservant l’étrangeté significative de « l’espoir de l’arrogance ». L’image de la source est maintenue dans la seconde proposition.
