    rationale: Le suffixe féminin de מְקוֹרָהּ renvoie vraisemblablement à l’arrogance personnifiée. En français, « sa source » peut se rattacher avec un léger flottement à « le péché »; « la source de celle-ci » clarifie le référent sans résoudre de façon excessive l’ambiguïté textuelle.
  - severity: medium
    issue: « fera pleuvoir » dans la note grecque
    rationale: Cette expression est peu naturelle ici et donne à ἐξομβρήσει une coloration météorologique qui n’est pas nécessaire. « répandra » traduit sobrement l’idée de produire ou déverser l’abomination, tout en évitant une précision interprétative.
