  text: In the hand of God is the rule of the world[a], and in due time he will raise up over it the right man.
translation:
  language: fr
  text: La domination du monde est dans la main de Dieu[a], et, au moment voulu, il établira un homme sur le monde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « Dans la main du Seigneur est la réussite d’un homme, et sur le visage du scribe il placera sa gloire. » La tradition grecque diffère considérablement ici du texte hébreu conservé.'
