lexical_decisions:
- source_word: בְּיַד אֱלֹהִים
  choice: dans la main de Dieu
  rationale: Conserve la métaphore hébraïque de la main comme expression de la maîtrise ou du pouvoir, tout en suivant précisément אֱלֹהִים, « Dieu ».
- source_word: מֶמְשֶׁלֶת תֵּבֵל
  choice: le gouvernement du monde
  rationale: מֶמְשֶׁלֶת désigne ici l’exercice du pouvoir ou le gouvernement, et תֵּבֵל le monde habité. Cette formulation est naturelle en français et maintient l’idée d’autorité sur le monde.
- source_word: וְאִישׁ
  choice: l’homme qu’il faut
  rationale: אִישׁ est un masculin singulier qui désigne vraisemblablement un dirigeant individuel. Le complément « qu’il faut » exprime avec retenue son adéquation à la circonstance, suggérée par לְעֵת, sans neutraliser le genre du texte.
- source_word: לְעֵת
  choice: au moment voulu
  rationale: La locution indique le moment approprié. « Au moment voulu » est idiomatique et laisse entendre une temporalité déterminée sans développer excessivement l’expression.
- source_word: יַעֲמוֹד עָלֶיהָ
  choice: il établira sur lui
  rationale: Dans ce contexte de gouvernement, le verbe « se tenir/faire tenir » avec עַל exprime l’installation d’un homme en position d’autorité. « Établira sur » rend clairement cette fonction.
theological_decisions:
- issue: Choix du texte principal lorsque l’hébreu et le grec divergent fortement
  choice: Suivre le texte hébreu conservé dans le corps du verset.
  alternative: 'Suivre le grec : « Dans la main du Seigneur est la réussite d’un homme, et sur le visage du scribe il placera sa gloire. »'
  rationale: Le témoin hébreu est présent et donné avec une confiance élevée. La tradition grecque représente ici une forme sensiblement différente et doit être signalée plutôt que fusionnée avec l’hébreu.
- issue: Référence masculine de אִישׁ
  choice: l’homme qu’il faut
  alternative: la personne qu’il faut
  rationale: Le substantif hébreu est masculin singulier et paraît viser un dirigeant particulier. La traduction conserve ce trait sans tirer de conclusion doctrinale sur la nature de son autorité.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore « dans la main de Dieu » est conservée; « gouvernement » et « établira » rendent explicitement le contexte d’autorité sans lourdeur archaïque.
