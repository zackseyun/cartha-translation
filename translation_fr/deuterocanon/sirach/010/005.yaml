revisions:
- from: Le gouvernement du monde est dans la main de Dieu[a], et, au moment voulu, il établira sur lui l’homme qu’il faut.
  to: La domination du monde est dans la main de Dieu[a], et, au moment voulu, il établira un homme sur le monde.
  rationale: Révision limitée afin de rendre l’indéfini hébreu אִישׁ par « un homme », sans y ajouter l’idée d’un homme particulièrement approprié. « Domination » rend plus précisément l’autorité de מֶמְשֶׁלֶת, et la répétition de « le monde » évite l’ambiguïté du pronom. La note conserve la lecture grecque substantiellement divergente.
