  text: Better is one who works and has abundant wealth than one who honors himself and lacks food[a].
translation:
  language: fr
  text: Mieux vaut celui qui travaille et possède des biens en abondance que celui qui se donne de l’importance et manque de nourriture.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin grec porte : « Mon enfant, glorifie ton âme avec douceur et accorde-lui l’honneur qu’elle mérite. » Les textes hébreu et grec diffèrent considérablement ici.'
    reason: alternative_reading
lexical_decisions:
- source_word: טוֹב
  choice: Mieux vaut
  rationale: Dans cette maxime sapientielle, l’adjectif introduit une comparaison; cette tournure est naturelle et concise en français.
- source_word: עוֹבֵד
  choice: celui qui travaille
  rationale: Le verbe עבד désigne ici le fait de travailler; le contraste porte sur le travail productif et la prétention, non sur un statut servile.
- source_word: וְיוֹתֵר הוֹן
  choice: et possède des biens en abondance
  rationale: La formulation hébraïque est elliptique. הוֹן désigne les biens ou la richesse, et יותר exprime ici l’abondance; «des biens en abondance» conserve le contraste matériel sans exagérer en parlant nécessairement de grande richesse.
- source_word: מִמִּתְכַּבֵּד
  choice: que celui qui se donne de l’importance
  rationale: La forme réfléchie évoque quelqu’un qui cherche à s’honorer ou à paraître important. Cette expression française rend la prétention impliquée sans introduire un vocabulaire trop technique.
- source_word: וַחֲסַר
  choice: et manque
  rationale: La coordination simple maintient le parallélisme compact de l’hébreu.
- source_word: מַתָּן
  choice: de nourriture
  rationale: Bien que le mot puisse évoquer un don ou une provision, le contexte économique de la maxime favorise le sens concret de nourriture ou subsistance.
theological_decisions:
- issue: Divergence majeure entre les témoins hébreu et grec de Siracide 10.27
  choice: Traduire le texte hébreu conservé dans le corps du verset et signaler intégralement le grec en note.
  alternative: 'Grec : « Mon enfant, glorifie ton âme avec douceur et accorde-lui l’honneur qu’elle mérite. »'
  rationale: Le texte hébreu est le témoin principal lorsqu’il est conservé, mais le grec présente ici une leçon entièrement différente. La note préserve cette divergence textuelle importante sans tenter de fondre artificiellement les deux lectures.
translation_notes:
  register: Français international moderne, clair et digne. La structure proverbiale comparative est conservée, tandis que les expressions elliptiques de l’hébreu sont rendues dans un français naturel. Le marqueur [a] figure dans le texte principal.
