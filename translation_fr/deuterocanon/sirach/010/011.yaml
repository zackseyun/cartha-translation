  text: At a man's death[a], his inheritance is maggots and worms[b], gnats and creeping things.
translation:
  language: fr
  text: Quand un être humain meurt, il reçoit en héritage les asticots et les vers, les poux[a] et les créatures rampantes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu כִּנִּים peut aussi se traduire par « moucherons » ou, plus généralement, « vermine » ; l’insecte précis est incertain.
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec présente une liste plus générale : « des êtres rampants, des bêtes et des vers » ; il diffère ainsi de la liste hébraïque.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּמוֹת
  choice: Quand … meurt
  rationale: La préposition בְּ avec l’infinitif construit exprime ici le temps. Cette tournure est naturelle en français et conserve le sens de « lors de la mort de ».
- source_word: אָדָם
  choice: un être humain
  rationale: Le nom singulier désigne ici un individu humain de manière représentative, sans exiger qu’il s’agisse spécifiquement d’un homme de sexe masculin.
- source_word: יִנְחַל
  choice: il reçoit en héritage
  rationale: Le verbe signifie « hériter » ou « recevoir en héritage ». La formulation française maintient l’image ironique de l’héritage tout en introduisant naturellement la liste qui suit.
- source_word: רִמָּה
  choice: les asticots
  rationale: Le terme désigne couramment les larves associées à la décomposition des cadavres. « Asticots » le distingue du terme suivant, plus général.
- source_word: וְתוֹלֵעָה
  choice: et les vers
  rationale: תּוֹלֵעָה désigne généralement un ver. Une traduction distincte préserve le doublet hébreu de créatures apparentées.
- source_word: כִּנִּים
  choice: les poux
  rationale: Le mot peut désigner de petits insectes parasites ou grouillants. « Poux » est une interprétation plausible, mais l’identification précise demeure incertaine et fait l’objet d’une note.
- source_word: וָרֶמֶשׂ
  choice: et les bêtes rampantes
  rationale: רֶמֶשׂ est un terme collectif assez large pour les petites créatures qui rampent. « Bêtes rampantes » restitue cette largeur sans le limiter aux reptiles.
theological_decisions:
- issue: Portée représentative de אָדָם
  choice: un être humain
  alternative: un homme
  rationale: Dans ce proverbe, le singulier hébreu représente tout individu humain. Le français « être humain » exprime clairement cette portée générique sans ajouter une restriction sexuelle absente du contexte.
- issue: Priorité du témoin hébreu par rapport au parallèle grec
  choice: Traduire directement la liste hébraïque et signaler la variante grecque en note.
  alternative: 'Suivre le grec : « des êtres rampants, des bêtes et des vers »'
  rationale: Le texte hébreu conservé est ici le témoin principal. Le grec confirme l’idée générale, mais présente une liste différente qu’il ne faut ni substituer au texte hébreu ni passer sous silence.
translation_notes:
  register: Français international actuel, sobre et proverbial. « Reçoit en héritage » conserve l’ironie funèbre du verbe hébreu ; la coordination en série garde la force concrète de l’énumération.
