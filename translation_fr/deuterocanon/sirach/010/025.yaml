  text: Do not act wisely in doing your work, and do not boast in a time of distress.[a]
translation:
  language: fr
  text: Ne cherche pas à paraître sage en faisant ton travail, et ne te vante pas au temps de ta détresse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin hébreu conservé présente un texte très différent : « Un serviteur avisé a été élevé, et un serviteur insensé ne se lamentera pas. » Le sens du dernier verbe est incertain ; il peut aussi évoquer le fait de murmurer ou de chercher un prétexte.'
    reason: textual_variant
lexical_decisions:
- source_word: Μὴ σοφίζου
  choice: Ne fais pas étalage de sagesse
  rationale: Le moyen σοφίζου met ici en garde non contre la sagesse elle-même, mais contre l’affectation de sagesse ou le désir de paraître habile. Cette formulation évite de condamner la conduite sage tout en conservant la portée admonitive.
- source_word: ποιῆσαι τὸ ἔργον σου
  choice: en accomplissant ton travail
  rationale: L’infinitif précise le domaine où cette affectation de sagesse doit être évitée. « Accomplir ton travail » est naturel et garde l’idée d’une tâche concrète.
- source_word: μὴ δοξάζου
  choice: ne te vante pas
  rationale: Dans ce contexte, le verbe a un sens réfléchi proche de « se glorifier » ou « tirer orgueil ». « Se vanter » est clair en français moderne sans atténuer l’interdiction.
- source_word: ἐν καιρῷ στενοχωρίας σου
  choice: au temps de ta détresse
  rationale: La formulation conserve la valeur temporelle de καιρός et le sens de détresse, d’affliction ou de situation oppressante porté par στενοχωρία.
- source_word: עֶבֶד מַשְׂכּיל הוּרָם, וְעֶבֶד סָכָל לֹא יִתְאוֹנֵן
  choice: signalé en note plutôt que suivi dans le texte principal
  rationale: Le témoin hébreu conservé diverge entièrement du grec pour ce verset. Afin de ne pas fondre deux textes incompatibles, le texte principal suit ici le témoin grec fourni, tandis que la leçon hébraïque est présentée explicitement en note.
theological_decisions:
- issue: Divergence majeure entre les témoins hébreu et grec de Siracide 10.25
  choice: Le texte principal suit l’exhortation grecque concernant l’affectation de sagesse et la vantardise dans la détresse.
  alternative: 'Le témoin hébreu porte : « Un serviteur avisé sera élevé, mais un serviteur insensé ne se plaindra pas », le sens du dernier verbe restant incertain.'
  rationale: Il s’agit d’une décision textuelle plutôt que doctrinale. Les deux témoins ne peuvent pas être harmonisés sans créer un texte composite. La divergence importante est donc conservée honnêtement dans une note.
translation_notes:
  register: Français international moderne, sobre et digne. « Faire étalage de sagesse » rend l’idée d’une sagesse affectée sans laisser entendre que la sagesse véritable serait blâmable. Le tutoiement correspond aux impératifs grecs au singulier.
