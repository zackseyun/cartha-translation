  text: The beginning of a man's pride is defiance[a], and his heart turns away from his Maker.
translation:
  language: fr
  text: Le commencement de l’orgueil humain, c’est l’insolence[a], et son cœur se détourne de Celui qui l’a fait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec parallèle dit : « Le commencement de l’orgueil humain, c’est de se détourner du Seigneur, et son cœur s’est éloigné de Celui qui l’a fait. » L’hébreu est plus bref dans le premier membre; le texte est traduit ici d’après le témoin hébreu.'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּחִלַת
  choice: Le commencement de
  rationale: Conserve le sens direct du nom construit et la forme sentencieuse de l’hébreu.
- source_word: גְּאוֹן
  choice: l’orgueil
  rationale: Dans ce contexte sapientiel, le mot désigne une exaltation de soi moralement condamnable; « orgueil » est naturel et précis.
- source_word: אָדָם
  choice: humain
  rationale: אָדָם est ici générique. « L’orgueil humain » exprime la portée universelle sans limiter le propos aux hommes de sexe masculin.
- source_word: מוּעָז
  choice: l’insolence
  rationale: Le terme évoque une attitude audacieuse et effrontée. « Insolence » garde cette force morale sans ajouter un complément absent de l’hébreu.
- source_word: וּמֵעֹשֶׂהוּ
  choice: de Celui qui l’a fait
  rationale: Rend littéralement et naturellement « de son faiseur/créateur », avec Dieu comme référent contextuel, sans imposer le titre plus abstrait « Créateur ».
- source_word: יָסוּר לִבּוֹ
  choice: son cœur se détourne
  rationale: סור exprime l’action de s’écarter ou de se détourner; la formulation conserve l’image hébraïque du cœur.
theological_decisions:
- issue: Faut-il expliciter que l’insolence consiste à se détourner du Seigneur, comme dans le grec parallèle ?
  choice: Maintenir dans le texte principal la formulation plus brève de l’hébreu, « c’est l’insolence », tandis que le second membre précise la rupture avec Dieu.
  alternative: « Le commencement de l’orgueil humain, c’est de se détourner du Seigneur, et son cœur s’éloigne de Celui qui l’a fait. »
  rationale: Le témoin hébreu est ici prioritaire et n’énonce pas explicitement « du Seigneur » dans le premier membre. Le grec témoigne d’une lecture explicative utile, signalée en note, mais ne doit pas remplacer silencieusement la concision hébraïque.
translation_notes:
  register: Français international moderne, clair et digne. La tournure proverbiale est préservée. « Celui » prend une majuscule par révérence puisque le référent est Dieu; aucune majuscule n’est nécessaire au pronom possessif.
