  text: What kind of offspring is contemptible? The offspring of one who transgresses a commandment.[a]
translation:
  language: fr
  text: Quelle descendance est méprisable ? La descendance de celui qui enfreint un commandement.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « ceux qui transgressent des commandements » (au pluriel), ce qui clarifie la formulation difficile de l’hébreu.'
    reason: alternative_reading
lexical_decisions:
- source_word: זֶרַע
  choice: descendance
  rationale: Le nom peut désigner la semence ou, collectivement, les descendants. Ici, « descendance » convient au contexte généalogique et conserve la valeur collective du singulier hébreu.
- source_word: נִקְלֶה
  choice: méprisable
  rationale: Le terme qualifie ce qui est tenu pour vil ou privé d’honneur. « Méprisable » restitue la portée évaluative de la question et correspond au grec ἄτιμον.
- source_word: מַה
  choice: quelle sorte de
  rationale: Dans cette question rhétorique, l’interrogatif demande une catégorie plutôt qu’une simple identification. « Quelle sorte de » en rend naturellement la nuance.
- source_word: לֶאֱנוֹשׁ
  choice: de celui qui
  rationale: La formulation hébraïque transmise est difficile. Cette tournure française exprime le référent humain suggéré par le texte, tout en s’appuyant avec prudence sur le parallèle grec pour dégager le sens.
- source_word: עוֹבֵר
  choice: enfreint
  rationale: Avec מִצְוָה, le participe désigne celui qui viole un commandement. « Enfreint » est naturel en français moderne et conserve le registre moral et juridique.
- source_word: מִצְוָה
  choice: un commandement
  rationale: Le singulier du témoin hébreu est conservé. « Commandement » convient mieux que « ordre » au registre sapientiel et à l’arrière-plan de la Torah.
theological_decisions:
- issue: Divergence entre l’hébreu et le grec dans le second membre
  choice: Traduire prioritairement l’hébreu conservé, en maintenant le singulier « un commandement », tout en utilisant le grec comme témoin de clarification syntaxique.
  alternative: « ceux qui transgressent des commandements », selon une traduction plus directe du grec.
  rationale: L’hébreu est attesté mais sa formulation est difficile. Le grec fournit un contrôle interprétatif utile sans justifier de remplacer silencieusement le nombre ni la construction du témoin hébreu.
translation_notes:
  register: Français international moderne, clair et digne. La question rhétorique est rendue naturellement, tandis que « descendance », « méprisable » et « commandement » maintiennent le registre sapientiel.
