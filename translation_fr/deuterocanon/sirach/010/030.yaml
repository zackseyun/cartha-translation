  text: There is a poor man who is honored because of his insight[a], and there is one who is honored because of his wealth.
translation:
  language: fr
  text: Il y a un pauvre qui est honoré en raison de son discernement[a], et il y a quelqu’un qui est honoré en raison de sa richesse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle dit : « Mais celui qui est honoré dans la pauvreté, combien plus le sera-t-il dans la richesse ? Et celui qui est sans honneur dans la richesse, combien plus le sera-t-il dans la pauvreté ? » L’hébreu et le grec diffèrent ici de façon substantielle.'
    reason: alternative_reading
lexical_decisions:
- source_word: דַּל
  choice: un pauvre
  rationale: Le terme désigne ici une personne pauvre ou de faible condition. « Un pauvre » conserve le singulier représentatif et reste naturel en français moderne.
- source_word: נִכְבָּד
  choice: est honoré
  rationale: Le nifal de כבד exprime le fait d’être honoré ou tenu en estime. « Est honoré » garde la nuance sociale commune aux deux propositions.
- source_word: בִּגְלַל
  choice: à cause de
  rationale: La préposition indique le motif ou le fondement de l’honneur. « À cause de » rend directement la relation causale dans les deux membres.
- source_word: שִׂכְלוֹ
  choice: son discernement
  rationale: שכל peut évoquer l’intelligence, la prudence ou le bon sens. « Discernement » exprime une compréhension judicieuse sans élargir indûment le sens à toute la sagesse.
- source_word: עָשְׁרוֹ
  choice: sa richesse
  rationale: Le nom désigne les biens matériels ou la richesse; ce choix fait ressortir le contraste entre mérite intellectuel et statut économique.
- source_word: יֵשׁ ... וְיֵשׁ
  choice: Il y a… et il y a…
  rationale: La répétition de la construction existentielle préserve le parallélisme aphoristique de l’hébreu. « Quelqu’un » dans le second membre évite en français une formulation incomplète tout en maintenant la structure.
theological_decisions:
- issue: Divergence substantielle entre le témoin hébreu et le parallèle grec
  choice: 'Le texte principal suit l’hébreu conservé et oppose deux motifs pour lesquels une personne reçoit de l’honneur : le discernement et la richesse.'
  alternative: 'Le grec formule deux questions rhétoriques : « Mais celui qui est honoré dans la pauvreté, combien plus le sera-t-il dans la richesse ? Et celui qui est sans honneur dans la richesse, combien plus le sera-t-il dans la pauvreté ? »'
  rationale: Le témoin hébreu extant est traduit comme texte principal. La forme grecque étant substantiellement différente et pouvant représenter une autre forme textuelle, elle est signalée intégralement en note plutôt que fusionnée avec l’hébreu.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme de l’hébreu est conservé; « un pauvre » maintient le singulier masculin représentatif du texte source, tandis que « quelqu’un » rend naturellement le second sujet implicite sans lui attribuer une pauvreté absente de l’hébreu.
