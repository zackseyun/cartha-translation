revisions:
- from: L’orgueil est odieux au Seigneur comme aux humains[a], et, pour les uns comme pour l’autre, l’oppression est une faute.
  to: L’orgueil est odieux au Seigneur et aux humains[a], et l’oppression est une faute aux yeux des humains comme du Seigneur.
  rationale: La révision améliore la fluidité française et remplace une paraphrase quelque peu maladroite par une formulation claire du jugement partagé qu’exige le contexte de l’hébreu elliptique. La note est corrigée pour refléter exactement l’ambiguïté grammaticale du grec et celle, distincte, de l’hébreu, sans résoudre ces difficultés par une lecture doctrinale.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T10:21:30Z'
review_pass:
  verdict: revise
  source_fidelity: La première proposition rend fidèlement le texte hébreu. Dans la seconde, וּמִשְּׁנֵיהֶם (« des deux / de l’un et de l’autre ») est syntaxiquement elliptique et son rattachement exact demeure difficile. La formulation proposée, « pour les uns comme pour l’autre », explicite un jugement partagé de façon recevable, mais elle s’éloigne de la valeur littérale de מן (« de, venant de »). Une formulation « aux yeux des humains comme du Seigneur » conserve le sens interprétatif nécessaire en français tout en étant plus claire. Le grec présente une construction différente, avec un verbe au singulier (« il commettra »), et la note doit signaler cette différence sans la présenter comme une traduction directe et certaine de l’hébreu.
  naturalness: « L’orgueil est odieux au Seigneur et aux humains » est naturel dans un français moderne et sobre. « Pour les uns comme pour l’autre » est compréhensible, mais moins idiomatique et son antécédent est légèrement laborieux après « le Seigneur comme aux humains ». « Aux yeux des humains comme du Seigneur » est plus fluide.
  terminology: « Orgueil », « Seigneur », « humains », « oppression » et « faute » conviennent au registre sapientiel. « Seigneur » est justifié par le contexte et le parallèle grec. « Faute » rend prudemment מַעַל sans surcharger le texte d’une nuance cultuelle ou confessionnelle.
  issues:
  - severity: medium
    issue: La note présente la seconde proposition grecque comme si son sujet et son sens étaient transparents.
    rationale: Le grec πλημμελήσει est un futur à la troisième personne du singulier (« il commettra une faute »), mais son sujet n’est pas exprimé dans la proposition. La note doit conserver cette ambiguïté plutôt que d’affirmer sans réserve « il commettra des injustices » comme lecture arrêtée.
  - severity: low
    issue: « Pour les uns comme pour l’autre » est une explicitation peu naturelle de la relation elliptique de la seconde proposition.
    rationale: La formule fonctionne, mais « aux yeux des humains comme du Seigneur » rend plus clairement le jugement attribué aux deux référents, sans faire de Dieu une source de l’oppression.
  revised_text: L’orgueil est odieux au Seigneur et aux humains[a], et l’oppression est une faute aux yeux des humains comme du Seigneur.
  revised_footnotes:
  - marker: a
    text: 'Le grec se lit littéralement : « L’orgueil est haï devant le Seigneur et les humains, et, de part et d’autre, il commettra des injustices. » Le sujet de « il commettra » n’est pas exprimé. L’hébreu est également très condensé ; il présente plus naturellement l’oppression comme une faute aux yeux du Seigneur et des humains.'
    reason: alternative_reading
  revision_rationale: La révision améliore la fluidité française et remplace une paraphrase quelque peu maladroite par une formulation claire du jugement partagé qu’exige le contexte de l’hébreu elliptique. La note est corrigée pour refléter exactement l’ambiguïté grammaticale du grec et celle, distincte, de l’hébreu, sans résoudre ces difficultés par une lecture doctrinale.
