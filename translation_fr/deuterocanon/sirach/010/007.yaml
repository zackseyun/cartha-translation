  text: Pride is hateful to the Lord and to men[a], and from both comes oppressive wrongdoing.
translation:
  language: fr
  text: L’orgueil est odieux au Seigneur et aux humains[a], et l’oppression est une faute aux yeux des humains comme du Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec se lit littéralement : « L’orgueil est haï devant le Seigneur et les humains, et, de part et d’autre, il commettra des injustices. » Le sujet de « il commettra » n’est pas exprimé. L’hébreu est également très condensé ; il présente plus naturellement l’oppression comme une faute aux yeux du Seigneur et des humains.'
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂנוּאָה
  choice: est odieux
  rationale: Le participe passif exprime ce qui est haï ou tenu en aversion. « Est odieux » restitue naturellement en français cette appréciation morale forte.
- source_word: לְאָדוֹן
  choice: au Seigneur
  rationale: אָדוֹן peut désigner un maître humain, mais le contexte sapientiel et le parallèle grec Κυρίου indiquent ici Dieu.
- source_word: וַאֲנָשִׁים
  choice: comme aux humains
  rationale: אֲנָשִׁים désigne ici les êtres humains collectivement. « Aux humains » est actuel, précis et évite que « hommes » soit compris comme visant uniquement le sexe masculin.
- source_word: גַּאֲוָה
  choice: L’orgueil
  rationale: Le terme désigne l’élévation arrogante de soi; « orgueil » est l’équivalent moral le plus courant et le plus naturel.
- source_word: וּמִשְּׁנֵיהֶם
  choice: pour les uns comme pour l’autre
  rationale: La formulation renvoie aux deux parties déjà nommées, les humains et le Seigneur. Le français explicite leur jugement commun sans faire de Dieu la source d’une conduite oppressive.
- source_word: מַעַל
  choice: une faute
  rationale: מַעַל désigne un acte déloyal, une infidélité ou une transgression. « Faute » conserve ici la portée morale sans imposer un cadre exclusivement cultuel ou juridique.
- source_word: עֹשֶׁק
  choice: l’oppression
  rationale: Le nom évoque l’oppression, l’exploitation ou l’extorsion. « Oppression » en conserve directement la nuance propre.
theological_decisions:
- issue: Référent de אָדוֹן
  choice: le Seigneur, c’est-à-dire Dieu
  alternative: un maître humain
  rationale: Le parallèle grec porte Κυρίου et le contexte oppose l’évaluation divine à celle des humains; le référent divin est donc le plus solidement attesté.
- issue: Rapport de וּמִשְּׁנֵיהֶם à la seconde proposition
  choice: l’oppression est tenue pour une faute par les deux parties nommées
  alternative: une faute oppressive provient des deux parties
  rationale: Faire provenir l’oppression « des deux », dont le Seigneur, produirait une affirmation théologiquement et contextuellement incohérente. La construction hébraïque condensée se comprend plus naturellement comme un jugement partagé par Dieu et les humains, tandis que la note signale la formulation différente du grec.
translation_notes:
  register: Français international moderne, sobre et sapientiel. « Odieux » garde la force évaluative du texte; « humains » est employé au sens collectif. La seconde proposition reste concise tout en rendant intelligible la syntaxe hébraïque très resserrée.
