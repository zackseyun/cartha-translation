  text: One should not despise an intelligent poor man[a], nor honor a wrongdoer who has been exalted.
translation:
  language: fr
  text: Il ne faut pas mépriser un pauvre qui a du discernement[a], ni honorer un homme injuste élevé en dignité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La tradition grecque présente ici un texte très différent : « Un grand personnage, un juge et un chef seront honorés, mais aucun d’eux n’est plus grand que celui qui craint le Seigneur. » Le témoin hébreu suivi dans le texte principal donne plutôt une maxime qui interdit de mépriser un pauvre doué de discernement et d’honorer un homme injuste élevé en dignité.'
    reason: textual_variant
lexical_decisions:
- source_word: אֵין לִבְזוֹת
  choice: Il ne faut pas mépriser
  rationale: La construction אֵין suivie de l’infinitif exprime ici, sous forme de maxime, ce qu’il ne convient pas de faire. Cette tournure française en conserve la portée générale.
- source_word: דַּל
  choice: un pauvre
  rationale: דַּל désigne une personne pauvre, faible ou de condition modeste. « Un pauvre » garde le singulier proverbial et met en relief le statut social.
- source_word: מַשְׁכִּיל
  choice: qui a du discernement
  rationale: Le participe renvoie à la compréhension, à la perspicacité ou à la conduite avisée. « Qui a du discernement » est naturel en français et évite de réduire le terme à la seule intelligence intellectuelle.
- source_word: לְכַבֵּד
  choice: honorer
  rationale: Le piel de כבד signifie couramment accorder de l’honneur ou de la considération. « Honorer » convient au contraste avec « mépriser ».
- source_word: עַוָּל
  choice: un homme injuste
  rationale: עַוָּל désigne celui qui se caractérise par l’injustice ou l’iniquité. « Homme injuste » conserve la forme masculine singulière du proverbe sans introduire une catégorie plus forte que l’hébreu.
- source_word: אֲשֶׁר הוּרָם
  choice: qui a été élevé
  rationale: Le passif indique que cet homme a été élevé en rang ou en position. La formulation conserve le passif et l’ambiguïté quant à l’agent de cette élévation.
theological_decisions:
- issue: Choix entre le texte hébreu de la Gueniza et la tradition grecque divergente
  choice: Traduire directement la maxime hébraïque conservée et signaler la tradition grecque en note.
  alternative: « Un grand personnage, un juge et un chef seront honorés, mais aucun d’eux n’est plus grand que celui qui craint le Seigneur. »
  rationale: Le témoin hébreu, donné ici avec une confiance élevée, a priorité pour le texte principal. Toutefois, l’écart majeur avec le grec constitue une variante textuelle substantielle qui ne doit pas être dissimulée.
translation_notes:
  register: Français international moderne, clair et digne. La structure antithétique de la maxime hébraïque est conservée, avec un parallélisme entre « mépriser » et « honorer ». « Qui a du discernement » restitue la qualité exprimée par le participe sans employer un vocabulaire technique.
