  yaml_path: translation/deuterocanon/sirach/010/003.yaml
  text: As the judge of a people[a], so are his officials; and as the head of a city, so are its inhabitants.
translation:
  language: fr
  text: Tel est le juge d’un peuple[a], tels sont ses fonctionnaires ; tel est le chef d’une ville, tels sont ses habitants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle porte : « Un roi sans instruction fera périr son peuple, et une ville sera peuplée grâce au discernement des dirigeants. » Les formes hébraïque et grecque conservées de ce verset diffèrent considérablement ; le texte principal suit le témoin hébreu.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּשׁוֹפֵט עַם
  choice: Tel est le juge d’un peuple
  rationale: La tournure corrélative « Tel est… tels sont… » restitue naturellement en français la structure proverbiale comparative introduite par כְּ. שׁוֹפֵט peut désigner un juge ou un gouvernant ; « juge » conserve ici le terme hébreu sans réduire sa portée politique.
- source_word: מְלִיצָיו
  choice: ses fonctionnaires
  rationale: מֵלִיץ peut désigner un interprète, un porte-parole ou un intermédiaire. Dans ce contexte de gouvernement, « fonctionnaires » exprime le sens probable de membres ou agents de l’administration, tout en maintenant le parallélisme avec le dirigeant.
- source_word: וּכְרֹאשׁ עִיר
  choice: tel est le chef d’une ville
  rationale: רֹאשׁ signifie littéralement « tête » et, par extension, « chef ». « Chef d’une ville » est idiomatique en français et conserve la métaphore hiérarchique de l’hébreu.
- source_word: יוֹשְׁבָיו
  choice: ses habitants
  rationale: Le participe de ישׁב désigne ceux qui habitent un lieu. « Ses habitants » est concis, naturel et reprend correctement le suffixe renvoyant à la ville.
theological_decisions:
- issue: Divergence substantielle entre l’hébreu conservé et le parallèle grec
  choice: Le texte principal suit le témoin hébreu conservé, qui établit un rapport proverbial entre les dirigeants et ceux qui relèvent d’eux.
  alternative: 'Le grec porte : « Un roi sans instruction fera périr son peuple, et une ville se peuplera grâce à l’intelligence de ses dirigeants. »'
  rationale: Pour le Siracide, l’hébreu conservé, ici jugé fiable, constitue la source principale. Le grec témoigne d’une forme très différente du verset ; cette variante significative est donc signalée en note plutôt qu’intégrée ou harmonisée avec le texte principal.
translation_notes:
  register: Français moderne, digne et proverbial. La construction corrélative « Tel est… tels sont… » rend le parallélisme hébreu avec clarté. Le point-virgule marque l’équilibre des deux membres.
