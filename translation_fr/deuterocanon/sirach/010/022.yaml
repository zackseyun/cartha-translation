  text: A resident alien[a], a foreigner, a stranger, and a poor man—their glory is the fear of God.
translation:
  language: fr
  text: 'L’étranger établi, celui qui n’est pas des leurs, l’homme d’un autre peuple et le pauvre : leur gloire, c’est la crainte de Dieu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Il n’est pas juste de déshonorer un pauvre intelligent, et il ne convient pas de glorifier un homme pécheur. » L’hébreu et le grec diffèrent considérablement ici.'
    reason: alternative_reading
lexical_decisions:
- source_word: גֵּר
  choice: l’étranger établi
  rationale: Le terme désigne un non-natif qui réside durablement au sein d’une population. « Étranger établi » conserve cette nuance sociale sans suggérer un simple voyageur.
- source_word: וְזָר
  choice: celui qui n’est pas des leurs
  rationale: זָר désigne ici quelqu’un d’extérieur au cercle social ou communautaire. Cette formulation naturelle le distingue de נָכְרִי sans lui attribuer nécessairement une nationalité étrangère.
- source_word: נָכְרִי
  choice: l’homme d’un autre peuple
  rationale: נָכְרִי désigne couramment quelqu’un qui appartient à un autre peuple. Cette expression maintient la distinction avec גֵּר et זָר présente dans l’énumération hébraïque.
- source_word: וָרָשׁ
  choice: et le pauvre
  rationale: רָשׁ désigne une personne pauvre ou démunie. Le singulier de l’hébreu est conservé.
- source_word: תִּפְאֶרֶת
  choice: leur gloire
  rationale: Le nom peut évoquer la gloire, la splendeur ou ce qui confère de la dignité. « Leur gloire » convient à la formulation sentencieuse et conserve l’image de l’hébreu.
- source_word: יִרְאַת אֱלֹהִים
  choice: la crainte de Dieu
  rationale: Cette expression sapientielle désigne une crainte révérencielle qui se traduit par la piété. La formulation traditionnelle préserve à la fois sa force lexicale et sa portée théologique.
theological_decisions:
- issue: Divergence majeure entre le témoin hébreu et le parallèle grec
  choice: Le texte principal traduit le témoin hébreu conservé.
  alternative: 'Le grec porte : « Il n’est pas juste de déshonorer un pauvre qui est sensé, et il ne convient pas de glorifier un homme pécheur. »'
  rationale: Puisque le Siracide est ici attesté en hébreu, ce témoin sert de texte principal. Le grec transmet toutefois une maxime substantiellement différente ; celle-ci est donc donnée intégralement en note afin de ne pas dissimuler la divergence.
translation_notes:
  register: Français international moderne, clair et digne. L’énumération a été légèrement explicitée afin de préserver en français les distinctions entre les trois termes hébreux désignant diverses formes d’altérité sociale ou ethnique, sans les confondre.
