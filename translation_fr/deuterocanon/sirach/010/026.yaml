  text: Do not act too wisely to serve your own desire[a], and do not honor yourself in the time of your need.
translation:
  language: fr
  text: Ne fais pas le sage pour servir ton propre désir[a], et ne te donne pas d’importance au temps de ton besoin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin grec présente ici un texte très différent : « Mieux vaut celui qui travaille en toute chose que celui qui va çà et là, se glorifie et manque de pain. » Le texte hébreu conservé dans les manuscrits de la Guéniza du Caire met plutôt en garde contre une sagesse intéressée et l’importance que l’on se donne au temps du besoin.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תּתְחַכַּם
  choice: Ne fais pas le sage
  rationale: Le hitpael de חכם évoque ici le fait de se donner des airs de sage ou de jouer au plus habile. Cette formulation naturelle conserve la mise en garde contre une sagesse affectée ou intéressée, sans préciser excessivement le motif.
- source_word: לַעֲבוֹד
  choice: pour servir
  rationale: L’infinitif de עבד signifie couramment « servir » ou « travailler ». « Servir » fait ressortir avec force le désir personnel comme maître auquel on s’asservit.
- source_word: חֶפְצֶךָ
  choice: ton propre désir
  rationale: חפץ peut désigner le désir, le plaisir ou la volonté. « Ton propre désir » exprime clairement l’orientation intéressée de la conduite visée.
- source_word: וְאַל תִּתְכַּבֵּד
  choice: et ne cherche pas à te faire honorer
  rationale: Le hitpael de כבד est réflexif et peut signifier se donner de l’importance, rechercher les honneurs ou se faire honorer. La formulation française traduit cette visée réflexive plus naturellement que le calque « ne t’honore pas toi-même ».
- source_word: בְּמוֹעֵד
  choice: au temps de
  rationale: מוֹעֵד désigne un temps déterminé ou une circonstance particulière. « Au temps de » reste sobre et dignifié.
- source_word: צָרְכֶּךָ
  choice: ta détresse
  rationale: צרך peut renvoyer au besoin, au manque ou à une situation pressante. « Ta détresse » rend ici la condition de nécessité concrète, que le grec parallèle associe au manque de pain, sans introduire ce détail dans le texte hébreu.
theological_decisions:
- issue: Divergence majeure entre le texte hébreu conservé et le témoin grec
  choice: Traduire le texte hébreu conservé et signaler intégralement la lecture grecque en note.
  alternative: 'Suivre le grec : « Mieux vaut celui qui travaille en toute chose que celui qui parade, se glorifie et manque de pain. »'
  rationale: Puisque l’hébreu est conservé avec une confiance élevée, il demeure le texte principal. Toutefois, la différence du grec touche l’ensemble du verset et ne doit être ni harmonisée ni passée sous silence. La note préserve honnêtement cette importante variante textuelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier conserve l’adresse directe de l’hébreu. « Ne fais pas le sage » est idiomatique sans être familier ; « au temps de ta détresse » maintient une tonalité sapientielle sobre.
