  text: An undisciplined king will ruin a city[a], but a city is inhabited through the wisdom of its rulers.
translation:
  language: fr
  text: Un roi sans retenue mène une ville à la ruine, mais une ville est habitée grâce au discernement de ses dirigeants.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « une ville est habitée par le discernement de ses dirigeants ». Le texte grec parallèle formule l’idée autrement : selon le chef de la ville, ainsi sont tous ses habitants.'
    reason: Précision littérale et indication de la formulation différente du texte grec parallèle.
lexical_decisions:
- source_word: מֶלֶךְ
  choice: roi
  rationale: Sens politique ordinaire du terme hébreu; le singulier désigne le chef de la cité.
- source_word: פָּרוּעַ
  choice: sans retenue
  rationale: Exprime l’absence de maîtrise ou de frein. Cette formulation naturelle évite de préciser indûment qu’il serait criminel ou anarchique.
- source_word: יַשְׁחִית
  choice: mène à la ruine
  rationale: Le verbe שחת indique ici une action destructrice. « Mène à la ruine » convient à l’effet social et politique d’un mauvais gouvernement sans suggérer nécessairement une destruction totale.
- source_word: עִיר
  choice: ville
  rationale: Équivalent courant dans ce contexte civique.
- source_word: נוֹשֶׁבֶת
  choice: demeure habitée
  rationale: Conserve le sens passif de la ville habitée ou peuplée; « demeure » rend plus clairement en français l’idée de viabilité durable impliquée par le proverbe.
- source_word: בְּשֶׂכֶל
  choice: grâce au discernement
  rationale: שכל désigne l’intelligence pratique, le bon sens ou la prudence. « Discernement » convient au gouvernement de la cité, tandis que « grâce à » exprime naturellement la valeur instrumentale de בְּ.
- source_word: שָׂרֶיהָ
  choice: ses dirigeants
  rationale: Le pluriel désigne les responsables ou chefs de la ville. « Dirigeants » est moderne, clair et moins marqué historiquement que « princes ».
theological_decisions:
- issue: Rapport entre le texte hébreu et la formulation parallèle grecque
  choice: Traduire directement les deux propositions hébraïques, en conservant l’image d’une ville qui demeure habitée grâce au discernement de ses dirigeants.
  alternative: 'Suivre le grec: « Tel est le chef de la ville, tels sont tous ses habitants. »'
  rationale: Le témoin hébreu, de haute confiance, est ici la source principale. Le grec confirme le thème de l’influence des responsables sur la collectivité, mais présente une formulation sensiblement différente qui ne doit pas remplacer le texte hébreu.
- issue: Force causale de בְּשֶׂכֶל שָׂרֶיהָ
  choice: « grâce au discernement de ses dirigeants »
  alternative: « par la prudence de ses dirigeants » ou « lorsque ses dirigeants sont sages »
  rationale: La formulation retenue préserve le lien entre la stabilité démographique de la ville et la qualité pratique de sa direction, sans transformer le groupe nominal hébreu en proposition conditionnelle.
translation_notes:
  register: Français international moderne, digne et proverbial. Le parallélisme adversatif est conservé. « Sans retenue » et « discernement » restent accessibles tout en reflétant la portée morale et politique de l’hébreu.
