  text: Among brothers their chief is honored[a], and one who fears God among his people.
translation:
  language: fr
  text: Parmi les frères, leur chef est honoré[a] ; de même, parmi son peuple, celui qui craint Dieu l’est aussi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Riche, glorieux et pauvre : leur sujet de fierté est la crainte du Seigneur. » Les témoins hébreu et grec diffèrent sensiblement ici ; le texte principal suit l’hébreu conservé.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּין אַחִים
  choice: Parmi des frères
  rationale: בֵּין situe ici une personne au sein d’un groupe ; « parmi » est donc plus naturel que « entre ». אַחִים reste rendu au masculin pluriel, sans élargissement non exigé par le contexte.
- source_word: רֹאשָׁם
  choice: leur chef
  rationale: רֹאשׁ signifie littéralement « tête », mais désigne couramment le chef ou le dirigeant d’un groupe. « Leur chef » exprime clairement ce sens social.
- source_word: נִכְבָּד
  choice: est honoré
  rationale: Le nifal de כבד indique ici qu’une personne est honorée ou tenue en estime.
- source_word: וִירֵא אֱלֹהִים
  choice: de même, celui qui craint Dieu
  rationale: La formule conserve le singulier proverbial et rend explicitement le parallélisme elliptique entre les deux membres. « Dieu » suit le témoin hébreu, contrairement au grec qui porte « le Seigneur ».
- source_word: בְּעַמּוֹ
  choice: parmi son peuple
  rationale: La préposition בְּ a ici une valeur sociale et locative. Cette traduction maintient aussi le parallélisme avec « parmi des frères ».
theological_decisions:
- issue: Divergence majeure entre les témoins hébreu et grec
  choice: Le texte principal suit l’hébreu conservé.
  alternative: 'Grec : « Riche, glorieux ou pauvre, leur sujet de fierté est la crainte du Seigneur. »'
  rationale: Pour le Siracide, l’hébreu subsistant constitue la source première. Comme le grec transmet ici un texte sensiblement différent, sa lecture est signalée en note plutôt que fusionnée avec l’hébreu.
- issue: Ellipse du second membre hébreu
  choice: Ajouter « de même » pour rendre en français le rapport implicite avec « est honoré ».
  alternative: 'Traduction strictement elliptique : « et celui qui craint Dieu parmi son peuple »'
  rationale: L’hébreu omet le prédicat dans le second membre. « De même » rend naturel le parallélisme sans préciser davantage en quoi consiste l’estime accordée à celui qui craint Dieu.
translation_notes:
  register: Français international moderne, proverbial et digne. La formulation demeure proche de la structure hébraïque, tandis que « de même » clarifie sobrement l’ellipse du second membre.
