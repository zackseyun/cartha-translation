  text: Why does dust and ashes exalt itself[a], though in its life its body is lifted up?
translation:
  language: fr
  text: Pourquoi la poussière et la cendre s’enorgueilliraient-elles, alors que, durant leur vie, leur corps est élevé[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La dernière proposition de l’hébreu est difficile. Le grec parallèle dit : « Car, durant sa vie, j’ai rejeté ses entrailles », soulignant la corruption du corps et la mortalité humaines. L’hébreu pourrait lui aussi évoquer l’abaissement ou le caractère périssable du corps.'
    reason: Signaler une difficulté textuelle majeure et la lecture divergente du parallèle grec.
lexical_decisions:
- source_word: מַה יִּגְאֶה
  choice: Pourquoi… s’enorgueilliraient-elles
  rationale: La tournure interrogative exprime une réprobation rhétorique. « S’enorgueillir » rend naturellement l’idée de גאה, s’élever avec fierté.
- source_word: עָפָר וָאֵפֶר
  choice: la poussière et la cendre
  rationale: Expression biblique évoquant la fragilité et la mortalité humaines; le singulier collectif est idiomatique en français.
- source_word: אֲשֶׁר בְּחַיָּיו
  choice: alors que, durant leur vie
  rationale: Le rapport exact introduit par אֲשֶׁר est difficile; « alors que » conserve une valeur circonstancielle pouvant être comprise comme concessive sans la préciser excessivement.
- source_word: יוּרַם
  choice: est élevé
  rationale: Le passif de רום signifie littéralement être élevé ou relevé. La traduction maintient l’image verticale qui fait écho à l’orgueil.
- source_word: גִּוְיוֹ
  choice: leur corps
  rationale: גויה peut désigner le corps, voire le cadavre. « Corps » est ici le choix français le moins interprétatif.
theological_decisions:
- issue: Statut du texte hébreu difficile face au parallèle grec
  choice: Suivre le texte hébreu conservé tout en signalant la divergence grecque en note.
  alternative: 'Traduire principalement le grec : « Pourquoi la terre et la cendre s’enorgueillissent-elles ? Car, durant sa vie, j’ai rejeté ses entrailles. »'
  rationale: L’hébreu constitue le témoin principal, mais sa proposition finale est obscure. Le grec confirme le thème de la fragilité corporelle sans autoriser à remplacer silencieusement l’hébreu.
- issue: Rapport logique de la proposition finale
  choice: Employer « alors que », formulation circonstancielle laissant subsister une nuance concessive.
  alternative: Employer « parce que », « lorsque » ou « bien que ».
  rationale: אֲשֶׁר ne fixe pas sans ambiguïté le rapport logique dans ce passage textuellement difficile; une formulation relativement ouverte évite de résoudre artificiellement la tension.
translation_notes:
  register: Français moderne, digne et accessible. Le pluriel grammatical reprend les deux noms coordonnés « la poussière et la cendre », tandis que l’expression demeure une image collective de l’être humain mortel. La formulation volontairement proche de l’hébreu conserve l’étrangeté de la proposition finale.
