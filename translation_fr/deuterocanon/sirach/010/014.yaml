  text: Therefore God filled his heart and struck him[b][a], and struck him down completely.
translation:
  language: fr
  text: C’est pourquoi Dieu[b] remplit son cœur et le frappa[a] ; il l’abattit jusqu’à l’anéantir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est difficile : littéralement, quelque chose comme « Dieu remplit son cœur, frappa ». Si נגע était compris comme un nom plutôt que comme le verbe vocalisé ici, on pourrait traduire : « Dieu remplit son cœur d’un fléau ». Le grec présente une lecture différente : « C’est pourquoi le Seigneur rendit extraordinaires les châtiments et les détruisit entièrement. »'
    reason: textual_variant
  - marker: b
    text: Le grec porte « le Seigneur », tandis que le témoin hébreu porte « Dieu ».
    reason: alternative_reading
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence de ce qui précède.
- source_word: מִלֵּא לִבּוֹ
  choice: remplit son cœur
  rationale: Conserve l’image et l’incomplétude du texte hébreu transmis, sans ajouter un contenu tel que « de terreur », absent de la source.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Suit le témoin hébreu principal; le grec porte « le Seigneur », signalé en note.
- source_word: נָגַע
  choice: le frappa
  rationale: Dans ce contexte de jugement, le verbe peut exprimer une atteinte punitive plutôt qu’un simple contact. Le pronom objet est explicité en français d’après le contexte, mais la difficulté syntaxique est signalée en note.
- source_word: וַיַּכֵּהוּ
  choice: il l’abattit
  rationale: Rend la force punitive de נכה tout en évitant en français une répétition maladroite de « frapper ».
- source_word: עַד כַּלֵּה
  choice: jusqu’à l’anéantir
  rationale: Exprime l’aboutissement total de l’action destructrice; le grec parallèle confirme l’idée d’une ruine complète.
theological_decisions:
- issue: Titre divin divergent entre les témoins hébreu et grec
  choice: Dieu
  alternative: le Seigneur
  rationale: Le texte principal suit l’hébreu conservé, אֱלֹהִים, sans harmoniser avec le grec Κύριος; la variante est rendue transparente en note.
- issue: Clause hébraïque syntaxiquement difficile
  choice: Conserver « remplit son cœur » puis rendre נָגַע par « le frappa »
  alternative: '« remplit son cœur d’un fléau » ou lecture grecque: « rendit extraordinaires les châtiments »'
  rationale: La formulation maintient les éléments du texte hébreu vocalisé sans fournir arbitrairement ce dont le cœur est rempli. La note expose à la fois l’opacité de l’hébreu et la lecture sensiblement différente du grec.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe principale est légèrement lissée pour rester intelligible, mais l’étrangeté du premier membre et la divergence grecque sont explicitement conservées en notes.
