  text: Who will justify the one who sins against his own soul[a], and who will honor the one who dishonors his own life?
translation:
  language: fr
  text: Qui déclarera juste celui qui pèche contre sa propre âme[a] ? Et qui honorera celui qui déshonore sa propre vie ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu conservé dans les manuscrits de la Gueniza du Caire diffère fortement du grec et demeure difficile. Il se lit approximativement : « Mon fils, dans l’humilité, honore-toi toi-même, et il te donnera du discernement et [un] honneur perdu. » La dernière proposition est textuellement incertaine. Le texte principal suit ici le grec, dont la formulation est cohérente.'
    reason: textual_variant
lexical_decisions:
- source_word: τὸν ἁμαρτάνοντα
  choice: celui qui pèche
  rationale: Le participe présent grec a ici une portée générale. Cette formulation conserve sa force verbale et reste naturelle en français.
- source_word: εἰς τὴν ψυχὴν αὐτοῦ
  choice: contre sa propre âme
  rationale: Le grec ψυχή peut désigner l’âme, la personne ou la vie. « âme » préserve ici la distinction avec ζωή, rendu par « vie » dans le second membre.
- source_word: τίς δικαιώσει
  choice: Qui déclarera juste
  rationale: δικαιόω exprime ici l’idée de reconnaître ou déclarer quelqu’un juste. Cette tournure rend clairement la nuance morale et judiciaire sans imposer une interprétation doctrinale particulière.
- source_word: δοξάσει
  choice: honorera
  rationale: Dans ce contexte de sagesse, « honorer » exprime naturellement l’estime sociale et forme une antithèse nette avec « déshonore ».
- source_word: τὸν ἀτιμάζοντα
  choice: celui qui déshonore
  rationale: ἀτιμάζω signifie traiter sans honneur ou avec mépris. « déshonore » conserve le parallélisme lexical du grec.
- source_word: τὴν ζωὴν αὐτοῦ
  choice: sa propre vie
  rationale: ζωή signifie naturellement « vie ». « propre » souligne le caractère réflexif et maintient la distinction avec ψυχή.
theological_decisions:
- issue: Divergence majeure entre l’hébreu conservé et le parallèle grec
  choice: Suivre dans le texte principal le sens cohérent du grec
  alternative: « Mon fils, dans l’humilité, honore-toi toi-même… » ; la fin de la ligne hébraïque est difficile et incertaine.
  rationale: Le texte hébreu de la Gueniza diverge fortement du grec et sa dernière proposition paraît textuellement instable. Le grec offre un distique cohérent. La variante hébraïque est donc signalée explicitement en note plutôt que résolue silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. Les deux questions rhétoriques et le parallélisme antithétique du grec sont conservés. « Déclarera juste » est préféré à « justifiera » afin d’éviter en français courant le sens de simple excuse ou d’explication.
