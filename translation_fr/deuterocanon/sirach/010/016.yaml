  text: God erased the traces of nations[b][a], and their root to the very ground.
translation:
  language: fr
  text: Dieu a effacé les traces des nations[a] et en a extirpé la racine jusque dans les profondeurs de la terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente une autre formulation : « Le Seigneur a arraché les racines des nations et planté les humbles à leur place. » L’hébreu parle plutôt des « traces » des nations et nomme « Dieu ».'
    reason: alternative_reading
  - marker: b
    text: Le dernier terme hébreu est rare et la syntaxe de ce membre est discutée. Il peut évoquer le fond du sol ou être analysé avec une valeur verbale d’« arracher » ou de « déraciner ». La traduction rend dans tous les cas l’image d’une extirpation jusque dans les profondeurs du sol.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִקְבוֹת
  choice: les traces
  rationale: Le mot évoque littéralement les marques laissées par les talons ou les pas. « Traces » conserve cette image tout en restant naturel en français et peut suggérer l’effacement de toute survivance des nations.
- source_word: גּוֹיִם
  choice: des nations
  rationale: Dans ce contexte sapientiel, le terme désigne des peuples ou des nations, sans qu’il faille lui donner le sens théologique plus tardif de « païens ».
- source_word: טִמְטֵם
  choice: a effacé
  rationale: Le verbe exprime ici l’idée d’oblitérer ou de faire disparaître. « Effacer » convient à l’image des traces sans préciser indûment le mode du jugement.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: La traduction suit le témoin hébreu, qui porte « Dieu », plutôt que d’harmoniser avec le grec « le Seigneur ».
- source_word: וְשָׁרְשָׁם
  choice: et leur racine
  rationale: Le singulier hébreu, probablement collectif, est conservé. L’image de la racine exprime la suppression jusque dans l’origine ou la capacité de subsister.
- source_word: עַד אֶרֶץ קִעֲקָע
  choice: jusqu’au tréfonds de la terre
  rationale: Cette formulation rend l’idée d’une élimination poussée jusqu’à la profondeur extrême du sol, tout en évitant la précision géologique excessive de « roche-mère ». Le mot final est rare et son analyse exacte demeure discutée.
theological_decisions:
- issue: Divergence importante entre les images de l’hébreu et du grec
  choice: 'Suivre l’hébreu dans le texte principal : Dieu efface les « traces » des nations et leur « racine ».'
  alternative: 'Le grec dit : « Le Seigneur a arraché les racines des nations et planté les humbles à leur place. »'
  rationale: Le témoin hébreu conservé est prioritaire. Le grec confirme le thème du renversement opéré par Dieu, mais présente une formulation sensiblement différente; cette variante est donc signalée sans être introduite dans le texte principal.
- issue: Portée du jugement divin
  choice: Conserver les images d’effacement et d’extirpation totale sans préciser qu’il s’agit nécessairement d’une annihilation historique ou eschatologique.
  alternative: Expliciter le verset comme l’anéantissement complet des nations.
  rationale: Le langage est radical, mais la traduction ne doit pas résoudre au-delà du texte la nature exacte ou l’horizon du jugement évoqué.
translation_notes:
  register: Français international moderne, sobre et digne. « Tréfonds de la terre » conserve la force poétique et l’idée de profondeur extrême sans recourir au terme technique « roche-mère ». Les deux marqueurs [a] et [b] figurent dans le texte principal.
