  text: God overturned the thrones of the proud, and seated the humble in their place.
translation:
  language: fr
  text: Dieu a renversé le trône des orgueilleux[a] et fait asseoir les humbles à leur place[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « les trônes des dirigeants »; l’hébreu a : « le trône des orgueilleux ».'
    reason: Signaler une divergence substantielle entre le texte hébreu principal et le parallèle grec.
  - marker: b
    text: 'Littéralement : « sous eux », c’est-à-dire à la place des orgueilleux.'
    reason: Rendre visible l’image hébraïque tout en expliquant son sens idiomatique dans le contexte.
lexical_decisions:
- source_word: כִּסֵּא גֵאִים
  choice: le trône des orgueilleux
  rationale: Le texte hébreu porte « trône » au singulier et « orgueilleux » au pluriel. Cette formulation conserve ce contraste sans harmoniser avec le grec, qui présente « les trônes des dirigeants ».
- source_word: הָפַךְ
  choice: a renversé
  rationale: Le verbe exprime ici un bouleversement ou un renversement du pouvoir établi; « renverser » est naturel en français dans le contexte d’un trône.
- source_word: וַיֹּשֶׁב
  choice: et fait asseoir
  rationale: La forme causative signifie que Dieu installe les humbles sur le siège d’autorité; « fait asseoir » reste proche de l’image hébraïque.
- source_word: עֲנָוִים
  choice: les humbles
  rationale: Le terme désigne les personnes humbles ou modestes; « humbles » rend directement le contraste avec les orgueilleux.
- source_word: תַּחְתָּם
  choice: à leur place
  rationale: 'Littéralement « sous eux », l’expression a ici le sens idiomatique de succession ou de remplacement: les humbles prennent la place des orgueilleux.'
theological_decisions:
- issue: Identité de l’agent divin
  choice: Dieu
  alternative: le Seigneur
  rationale: Le texte hébreu lit explicitement אֱלֹהִים, « Dieu »; « le Seigneur » appartient au parallèle grec et ne doit pas remplacer la leçon hébraïque principale.
- issue: Singulier ou pluriel de « trône »
  choice: le trône
  alternative: les trônes
  rationale: Le singulier suit le texte hébreu fourni. Le pluriel du grec est signalé en note plutôt que silencieusement introduit dans le texte.
translation_notes:
  register: Français moderne, sobre et dignifié. La structure parallèle et l’opposition entre « orgueilleux » et « humbles » sont conservées. Le passé composé exprime naturellement en français l’action divine accomplie.
