  text: In the hand of God is the rule of every man, and before the lawgiver he sets his splendor.
translation:
  language: fr
  text: Le pouvoir de tout homme est dans la main de Dieu, et il place sa splendeur devant le législateur.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec dit : « Le pouvoir sur la terre est dans la main du Seigneur, et, au moment opportun, il suscitera sur elle l’homme qui convient. » Sa seconde moitié diffère sensiblement de l’hébreu et paraît refléter un autre texte hébreu sous-jacent ou une évolution interprétative.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « sa majesté » ou « son honneur ». Le référent de « sa » n’est pas entièrement certain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד אֱלֹהִים
  choice: dans la main de Dieu
  rationale: Conserve la métaphore hébraïque courante de la main comme expression de maîtrise ou de pouvoir, tout en restant claire en français. אֱלֹהִים est rendu directement par « Dieu ».
- source_word: מֶמְשֶׁלֶת כָּל גֶּבֶר
  choice: le pouvoir de tout homme
  rationale: מֶמְשֶׁלֶת désigne le pouvoir de gouverner ou la domination. « Pouvoir » convient au contexte politique et évite d’ajouter l’idée d’une institution précise. גֶּבֶר est masculin et désigne ici l’homme en tant que détenteur possible d’une autorité.
- source_word: וְלִפְנֵי
  choice: et devant
  rationale: Rend simplement le rapport spatial ou relationnel exprimé par לִפְנֵי, sans tenter de résoudre une syntaxe dont le sens demeure difficile.
- source_word: מְחוֹקֵק
  choice: le législateur
  rationale: Le terme désigne celui qui fixe ou décrète la loi. « Législateur » en conserve la force lexicale et reste naturel en français.
- source_word: יָשִׁית
  choice: il établit
  rationale: Le verbe שׂים signifie mettre, placer ou établir. « Établit » est idiomatique avec un attribut de dignité, sans expliciter davantage le mécanisme évoqué.
- source_word: הוֹדוֹ
  choice: sa splendeur
  rationale: הוֹד peut signifier splendeur, majesté ou honneur. « Splendeur » préserve la dignité élevée, probablement royale, sans réduire le terme à la seule estime sociale.
theological_decisions:
- issue: Rapport entre souveraineté divine et pouvoir politique humain
  choice: Le pouvoir exercé par tout homme demeure dans la main de Dieu.
  alternative: Dieu nomme directement chaque gouvernant, ou bien le verset ne concerne que l’autorité exercée sur la terre.
  rationale: L’hébreu affirme clairement la maîtrise de Dieu sur le pouvoir humain, mais ne précise pas comment les gouvernants sont choisis. La traduction n’ajoute donc pas une doctrine détaillée de la nomination divine.
- issue: Référent de « sa splendeur »
  choice: Conserver le pronom masculin ambigu de l’hébreu.
  alternative: Préciser qu’il s’agit de la splendeur du législateur ou de celle de Dieu.
  rationale: Le suffixe de הוֹדוֹ est masculin singulier, mais la ligne ne permet pas d’identifier son référent avec une certitude suffisante. La traduction préserve cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la métaphore de la main ainsi que l’ambiguïté de la seconde proposition hébraïque; les variantes grecque et lexicales sont signalées en notes.
