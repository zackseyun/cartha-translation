translation:
  language: fr
  text: Une légère maladie fait pâlir le médecin[a] ; un roi aujourd’hui, demain il tombera[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fait jaunir le médecin », imageant par le changement de teint l’effet visible de la maladie.'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec précise : « et un roi aujourd’hui, et demain il mourra », interprétant la « chute » de l’hébreu comme la mort.'
    reason: alternative_reading
lexical_decisions:
- source_word: שֶׁמֶץ
  choice: un soupçon
  rationale: Le nom désigne une quantité infime. « Un soupçon » est naturel en français et souligne qu’une maladie même légère suffit à affecter le médecin.
- source_word: מַחֲלָה
  choice: maladie
  rationale: Terme général désignant un état de maladie, sans en préciser la nature ni la gravité.
- source_word: יַצְהִיב
  choice: fait pâlir
  rationale: Le verbe évoque littéralement le fait de devenir jaune ou jaunâtre. « Fait pâlir » exprime naturellement en français l’altération visible du teint, tandis qu’une note conserve l’image chromatique de l’hébreu.
- source_word: רוֹפֵא
  choice: médecin
  rationale: Désigne celui qui soigne. « Médecin » convient au contexte et au registre sapiential moderne.
- source_word: מֶלֶךְ
  choice: roi
  rationale: Titre royal direct, conservé dans la tournure nominale et concise de l’hébreu.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Marque la condition présente, vivement opposée à celle du lendemain.
- source_word: וּמָחָר
  choice: demain
  rationale: La juxtaposition suffit en français à produire le contraste ; l’absence de « mais » garde la concision de l’hébreu.
- source_word: יִפּוֹל
  choice: il tombera
  rationale: Le sens premier est « tomber ». Le futur français correspond à la perspective de « demain » et préserve l’ambiguïté entre mort, chute et ruine.
theological_decisions:
- issue: La chute du roi désigne-t-elle précisément sa mort ou plus largement sa déchéance ?
  choice: il tombera
  alternative: il mourra / il arrivera à sa fin
  rationale: L’hébreu emploie יִפּוֹל, « tomber », qui peut évoquer la mort sans l’imposer. Le grec précise qu’il « mourra » ou « arrivera à sa fin ». Le texte principal conserve donc l’expression plus large de l’hébreu, et la note signale l’interprétation grecque.
translation_notes:
  register: Français moderne, sobre et proverbial. Le point-virgule et la tournure elliptique « roi aujourd’hui » gardent le parallélisme abrupt de l’hébreu. « Fait pâlir » privilégie l’idiome français, avec l’image littérale du jaunissement en note.
