  text: Kingship passes from nation to nation because of violence and arrogance[a].
translation:
  language: fr
  text: La royauté passe d’une nation à l’autre à cause de la violence et de l’orgueil[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La tradition grecque dit : « La royauté passe d’une nation à l’autre à cause de l’injustice, des actes outrageants et de l’argent. »'
    reason: 'Variante textuelle: le grec présente trois causes différentes de la double formulation hébraïque.'
lexical_decisions:
- source_word: מַלְכוּת
  choice: la royauté
  rationale: Le terme désigne ici l’exercice du pouvoir royal ou la souveraineté plutôt qu’un territoire; « la royauté » conserve ce sens abstrait et convient au transfert de domination politique.
- source_word: מִגּוֹי אֶל גּוֹי
  choice: d’une nation à l’autre
  rationale: Cette formulation naturelle en français exprime précisément le passage d’un peuple politique à un autre tout en gardant la concision proverbiale.
- source_word: תִּסֹּב
  choice: passe
  rationale: Le verbe évoque littéralement un mouvement ou un changement; dans ce contexte, « passe » rend clairement le transfert de la royauté sans surinterprétation.
- source_word: בִּגְלַל
  choice: à cause de
  rationale: La préposition introduit directement la cause; « à cause de » est l’équivalent français courant et exact.
- source_word: חֲמַס
  choice: violence
  rationale: Le mot hébreu désigne couramment la violence ou le tort violent. « Violence » suit le témoin hébreu prioritaire, malgré le grec ἀδικίας, « injustice ».
- source_word: גַּאֲוָה
  choice: orgueil
  rationale: Le terme désigne l’élévation hautaine ou l’arrogance. « Orgueil » est naturel, digne et conserve la portée morale du mot hébreu.
theological_decisions:
- issue: Différence entre les causes énumérées dans l’hébreu et dans le grec
  choice: 'Le texte principal suit l’hébreu: « la violence et l’orgueil ».'
  alternative: 'La tradition grecque donne: « l’injustice, les actes outrageants et l’argent » (ἀδικίας καὶ ὕβρεις καὶ χρήματα).'
  rationale: Le témoin hébreu est ici conservé avec un haut degré de confiance et doit donc régir le texte principal. La liste grecque, plus longue et sensiblement différente, constitue toutefois une variante textuelle importante qui mérite d’être signalée sans harmonisation.
translation_notes:
  register: Français international moderne, concis et proverbial. « La royauté » maintient le caractère abstrait de מַלְכוּת; « passe d’une nation à l’autre » est idiomatique sans effacer l’image du transfert. Le marqueur [a] figure dans le texte principal.
