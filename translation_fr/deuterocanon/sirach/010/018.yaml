  text: Arrogance and insolence are not fitting for a human being[a], much less for one born of a woman.
translation:
  language: fr
  text: L’arrogance et l’insolence ne conviennent pas à un être humain[a], encore moins à quelqu’un né d’une femme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec dit : « L’arrogance n’a pas été créée pour les êtres humains, ni la colère furieuse pour ceux qui sont nés de femmes. » Le témoin hébreu porte plutôt : « L’arrogance et l’insolence ne conviennent pas… encore moins à quelqu’un né d’une femme. »'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא נָאוֶה
  choice: ne conviennent pas
  rationale: Cette tournure exprime naturellement en français moderne ce qui n’est ni approprié ni bienséant, conformément au sens de l’hébreu, sans importer le « n’a pas été créé » du parallèle grec.
- source_word: לֶאֱנוֹשׁ
  choice: à l’être humain
  rationale: אֱנוֹשׁ désigne ici l’humain mortel. « L’être humain » garde la portée représentative du singulier et prépare le parallèle avec « celui qui est né d’une femme ».
- source_word: זָדוֹן
  choice: l’arrogance
  rationale: Le terme évoque une attitude orgueilleuse et présomptueuse. « Arrogance » la distingue de l’audace effrontée exprimée par עַזוּת.
- source_word: וְעַזוּת
  choice: l’insolence
  rationale: Le mot désigne une hardiesse effrontée ou impudente; « insolence » en restitue clairement la valeur morale négative.
- source_word: אַף
  choice: encore moins
  rationale: Dans cette construction, la particule renforce l’énoncé à propos de la personne née d’une femme. « Encore moins » rend cette progression de façon idiomatique.
- source_word: לִילוּד אִשָּׁה
  choice: à celui qui est né d’une femme
  rationale: Cette formulation conserve l’image hébraïque de la naissance humaine, qui souligne la condition mortelle et fragile, tout en restant naturelle en français.
theological_decisions:
- issue: Rapport entre le texte hébreu et le parallèle grec
  choice: Suivre dans le texte principal l’hébreu « ne conviennent pas » et « insolence ».
  alternative: « L’arrogance n’a pas été créée pour les êtres humains, ni la colère furieuse pour ceux qui sont nés de femmes. »
  rationale: Le témoin hébreu, conservé et jugé fiable ici, est prioritaire. Le grec présente deux écarts substantiels — le prédicat « n’a pas été créée » et la « colère furieuse » — qui doivent être signalés sans être intégrés silencieusement au texte principal.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste proche de la structure hébraïque tout en étant idiomatique; « être humain » évite de restreindre à tort אֱנוֹשׁ au sexe masculin.
