  text: Who will declare righteous the one who condemns himself[a], and who will honor the one who dishonors himself?
translation:
  language: fr
  text: Qui déclarera juste celui qui se condamne lui-même[a] ? Et qui honorera celui qui se déshonore lui-même ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin grec porte : « Un pauvre est honoré pour son savoir, et un riche est honoré pour sa richesse. » L’hébreu et le grec conservent ici des maximes sensiblement différentes.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַרְשִׁיעַ
  choice: se condamne
  rationale: Le hifil de רשע a couramment le sens judiciaire de « déclarer coupable, condamner ». Avec נַפְשׁוֹ, la tournure pronominale française exprime naturellement l’action dirigée contre soi-même tout en conservant cette nuance judiciaire.
- source_word: נַפְשׁוֹ
  choice: lui-même
  rationale: נפש peut désigner l’âme, la vie ou la personne elle-même. Ici, dans les deux membres parallèles, le sens réflexif est le plus naturel ; « son âme » risquerait de spiritualiser indûment l’expression.
- source_word: יַצְדִיקֶנּוּ
  choice: déclarera juste
  rationale: 'Le hifil de צדק possède ici une valeur judiciaire : reconnaître ou déclarer quelqu’un juste. Cette formulation conserve cette nuance sans charger le verbe d’un sens doctrinal plus tardif.'
- source_word: יְכַבֵּד
  choice: honorera
  rationale: Le piel de כבד signifie normalement « honorer ». Le terme convient à l’estime sociale évoquée dans le second membre.
- source_word: מַקְלֶה
  choice: se déshonore
  rationale: Issu de קלל, le participe exprime l’idée de traiter comme peu de chose, de mépriser ou de déshonorer. « Se déshonore » forme une antithèse claire et naturelle avec « honorera ».
theological_decisions:
- issue: Divergence majeure entre les témoins hébreu et grec
  choice: Le texte principal traduit l’hébreu conservé.
  alternative: 'Le grec porte : « Un pauvre est honoré pour son savoir, et un riche est honoré pour sa richesse. »'
  rationale: Puisque l’hébreu de ce vers est disponible avec une confiance élevée, il sert de texte principal. Le grec transmet toutefois une maxime entièrement différente ; cette divergence est signalée sans harmonisation afin de préserver honnêtement les deux traditions textuelles.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme des deux questions ainsi que les oppositions judiciaires (« condamne / déclarera juste ») et sociales (« honorera / se déshonore ») sont conservés.
