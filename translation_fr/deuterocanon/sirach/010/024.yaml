  text: A ruler[a], a governor, and a judge are honored, but none is greater than one who fears God.
translation:
  language: fr
  text: Un dirigeant[a], un gouverneur et un juge sont honorés, mais aucun n’est plus grand que celui qui craint Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin grec présente ici un texte très différent : « Des hommes libres serviront un esclave sage, et un homme intelligent ne se plaindra pas. »'
    reason: textual_variant
lexical_decisions:
- source_word: נָגִיד
  choice: dirigeant
  rationale: Le terme désigne une personne placée à la tête d’autres. « Dirigeant » est naturel, assez large et n’introduit pas la nuance dynastique que pourrait suggérer « prince ».
- source_word: מוֹשֶׁל
  choice: gouverneur
  rationale: Ce choix distingue le terme de נָגִיד dans l’énumération et exprime l’exercice d’une autorité sans imposer un titre royal.
- source_word: שׁוֹפֵט
  choice: juge
  rationale: Équivalent usuel et précis pour la fonction judiciaire désignée par le mot hébreu.
- source_word: נִכְבָּדוּ
  choice: sont honorés
  rationale: La forme passive plurielle indique que ces responsables reçoivent honneur et considération.
- source_word: וְאֵין גָּדוֹל
  choice: mais aucun n’est plus grand
  rationale: La formulation rend la comparaison superlative et le contraste avec les dignitaires qui viennent d’être mentionnés.
- source_word: מִיְּרֵא אֱלֹהִים
  choice: que celui qui craint Dieu
  rationale: Cette traduction conserve l’expression biblique de la crainte de Dieu, qui désigne une révérence pieuse, ainsi que la valeur représentative du singulier.
theological_decisions:
- issue: Choix entre le texte hébreu et le parallèle grec divergent
  choice: Suivre dans le texte principal l’hébreu conservé et signaler en note la leçon grecque très différente.
  alternative: 'Suivre le grec : « Des hommes libres serviront un esclave sage, et un homme intelligent ne se plaindra pas. »'
  rationale: Puisque le texte hébreu de ce passage est disponible avec une confiance élevée, il constitue la base de la traduction. Le grec ne présente pas ici une simple variation de formulation, mais une sentence différente, qui doit donc être conservée en note sans remplacer silencieusement l’hébreu.
translation_notes:
  register: Français international moderne, clair et digne. L’énumération des trois fonctions d’autorité est maintenue, ainsi que l’expression biblique « craindre Dieu ». Le marqueur de note est placé après le premier terme, conformément à la couche de consultation anglaise, tout en signalant une variante qui porte en réalité sur l’ensemble du verset.
