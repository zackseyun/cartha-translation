  source_fidelity: Le premier membre rend de manière défendable le verbe hébreu difficile וסחם par « a balayés », et « déracinés » restitue bien נתשׁ. Le second membre doit toutefois exprimer plus directement le causatif de השבית (« faire cesser / faire disparaître ») appliqué à « leur souvenir ». L’ajout de « jusqu’à » introduit une intensification qui n’est pas explicitement présente dans le texte source.
  naturalness: La formulation est globalement naturelle en français moderne. « Il a fait disparaître de la terre leur souvenir » est à la fois idiomatique et plus proche de la construction et du parallélisme de l’hébreu. La répétition de « les a » clarifie la coordination du premier membre.
  terminology: « Terre », « déracinés » et « souvenir » conviennent au registre et au sens. « Faire disparaître » rend ici avec précision l’idée de « faire cesser » sans imposer une interprétation plus forte telle que « effacer ».
