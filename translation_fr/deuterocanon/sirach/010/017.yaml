  text: He swept them from the earth and uprooted them[a], and he made their memory cease from the earth.
translation:
  language: fr
  text: Il les a balayés de la terre et les a déracinés[a] ; il a fait disparaître de la terre leur souvenir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le premier verbe hébreu est difficile ; le parallèle grec appuie l’idée de les enlever ou de les faire disparaître. Autre traduction possible : « Il les a fait disparaître de la terre et les a déracinés. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסִחָם
  choice: Il les a balayés
  rationale: Le verbe hébreu est difficile et peu courant. Le parallèle grec confirme l’idée d’une suppression complète. « Balayer » conserve une image énergique sans préciser excessivement le procédé.
- source_word: מֵאֶרֶץ
  choice: de la terre
  rationale: אֶרֶץ peut désigner un pays ou la terre. Ici, sa répétition dans les deux membres et le parallèle grec favorisent le sens général « terre ».
- source_word: וַיִּתְּשֵׁם
  choice: et déracinés
  rationale: La racine נתשׁ exprime l’action d’arracher, notamment des plantes. « Déraciner » restitue naturellement l’image d’une élimination totale.
- source_word: וַיַּשְׁבֵּת
  choice: il a effacé
  rationale: Le causatif de שׁבת signifie littéralement « faire cesser ». Avec « leur souvenir », « effacer » rend en français naturel l’idée de faire disparaître toute mémoire d’eux.
- source_word: זִכְרָם
  choice: leur souvenir
  rationale: « Souvenir » est ici plus idiomatique que « mémoire » pour désigner ce qui subsiste d’eux dans la mémoire collective.
