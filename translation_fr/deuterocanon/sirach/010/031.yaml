translation_notes:
  register: Français moderne, courant et digne. Le parallélisme antithétique et la répétition exclamative de l’hébreu sont conservés. « Dans sa richesse / dans sa pauvreté » maintient volontairement l’ambiguïté entre circonstance et cause.
