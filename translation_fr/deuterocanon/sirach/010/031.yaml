  text: How honored one is in his wealth[a], and how despised in his poverty.
translation:
  language: fr
  text: Comme il est honoré dans sa richesse, et comme il est méprisé dans sa pauvreté ![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec présente les éléments dans un autre ordre et avec une autre insistance : « Mais celui qui est honoré dans la pauvreté, combien plus dans la richesse ! Et celui qui est sans honneur dans la richesse, combien plus dans la pauvreté ! » Le texte principal suit ici le témoin hébreu.'
    reason: alternative_reading
lexical_decisions:
- source_word: נִכְבָּד
  choice: il est honoré
  rationale: Le nifal de כבד exprime ici le fait d’être honoré ou estimé. Cette formulation conserve la nuance de considération sociale.
- source_word: בְּעָשְׁרוֹ
  choice: dans sa richesse
  rationale: La préposition ב marque la situation ou la condition dans laquelle l’honneur est accordé, sans imposer explicitement un rapport de cause.
- source_word: אֵיכָכָה
  choice: comme
  rationale: La particule a ici une valeur exclamative de degré. La tournure « comme il est… ! » restitue naturellement cette force rhétorique en français.
- source_word: וְנִקְלֶה
  choice: et comme il est méprisé
  rationale: Le nifal de קלה désigne celui qui est tenu pour peu de chose ou traité avec mépris. « Méprisé » forme un contraste clair avec « honoré ».
- source_word: בְּעָנְיוֹ
  choice: dans sa pauvreté
  rationale: Comme dans le premier membre, la préposition présente la pauvreté comme la condition où se manifeste le mépris, sans préciser qu’elle en est nécessairement la cause.
