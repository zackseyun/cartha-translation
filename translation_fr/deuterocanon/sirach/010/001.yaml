  - severity: low
    issue: « d’un homme avisé »
    rationale: Le masculin du participe hébreu n’exige pas que le français généralise par « homme ». « D’une personne avisée » est plus naturel pour une maxime de portée générale et ne modifie pas le référent.
  - severity: low
    issue: « est bien organisé »
    rationale: Pour un gouvernement, « est en bon ordre » décrit plus naturellement l’état ordonné exprimé par סְדוּרָה, sans suggérer seulement une structure administrative.
