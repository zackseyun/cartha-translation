translation_notes:
  register: Français international moderne, sobre et sapientiel. Le premier membre suit prioritairement l’hébreu, qui ne porte pas explicitement « sage » auprès de « juge »; la variante grecque est conservée en note plutôt qu’intégrée silencieusement au texte.
