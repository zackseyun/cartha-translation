translation:
  language: fr
  text: Le juge d’un peuple établit son peuple[a], et le gouvernement d’une personne avisée est en bon ordre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe hébreu peut aussi se traduire par « fonde » ou, selon le contexte, « met en ordre ». Le texte grec parallèle présente une formulation différente : « un juge sage instruira son peuple ».'
    reason: La note préserve l’ambiguïté de יוֹסֵד et signale explicitement la variante de formulation du parallèle grec, y compris l’adjectif « sage » absent de l’hébreu.
lexical_decisions:
- source_word: שׁוֹפֵט עַם
  choice: le juge d’un peuple
  rationale: שׁוֹפֵט désigne naturellement un juge ou un magistrat exerçant une autorité; עַם précise le peuple dont il a la charge. Le grec κριτής confirme « juge ».
- source_word: יוֹסֵד
  choice: affermit
  rationale: Le verbe évoque l’action de fonder, d’établir ou de donner une assise stable. Avec « son peuple » comme complément et en parallèle avec un gouvernement bien organisé, « affermit » exprime naturellement cette stabilisation sans suggérer nécessairement la fondation initiale du peuple.
- source_word: עַמּוֹ
  choice: son peuple
  rationale: Le suffixe possessif est explicite; « peuple » est ici l’équivalent français le plus direct de עַם.
- source_word: מֶמְשֶׁלֶת
  choice: le gouvernement
  rationale: Le nom désigne l’exercice du pouvoir ou l’autorité gouvernementale. « Gouvernement » convient au parallélisme avec la fonction du juge et permet une formulation française naturelle.
- source_word: מֵבִין
  choice: d’un homme avisé
  rationale: Le participe masculin singulier désigne quelqu’un qui fait preuve d’intelligence et de discernement. « Homme avisé » conserve cette forme personnelle et le registre sapientiel.
- source_word: סְדוּרָה
  choice: bien organisé
  rationale: Le terme décrit ce qui est disposé avec ordre. Appliqué au gouvernement, « bien organisé » est idiomatique et conserve l’évaluation positive du texte.
