  rationale: La révision remplace un rendu interprétatif de יוֹסֵד par « établit », qui est plus proche de l’hébreu tout en laissant ouverte la nuance d’organisation que suggère le grec. Elle améliore aussi la portée générale et l’idiomaticité de la seconde proposition. La note est ajustée afin de documenter sans harmonisation la divergence significative du grec.
