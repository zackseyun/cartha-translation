  text: If you are useful to him[a], he will make use of you; and if you bow down, he will not spare you.
translation:
  language: fr
  text: Si tu lui es utile[a], il se servira de toi ; mais si tu fléchis, il ne t’épargnera pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La tradition grecque porte : « Le riche commet une injustice et, en plus, il s’emporte ; le pauvre subit l’injustice et, en plus, il doit supplier. » Le témoin hébreu conservé ici présente un avertissement différent : un homme puissant se sert de toi tant que tu lui es utile et ne t’épargne pas lorsque tu fléchis.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם תִּכְשַׁר לוֹ
  choice: si tu lui es utile
  rationale: Le verbe כשר exprime ici l’idée de convenir, d’être apte ou avantageux pour quelqu’un. Dans ce contexte de rapports de pouvoir, « lui être utile » rend naturellement la valeur pratique du terme sans lui donner un sens moral.
- source_word: יַעֲבֹד בָּךְ
  choice: il se servira de toi
  rationale: L’expression signifie littéralement qu’il travaillera avec ou au moyen de toi. « Se servir de toi » restitue l’idée d’utilisation intéressée sans imposer le terme plus fort « exploiter ».
- source_word: וְאִם תִּכְרַע
  choice: mais si tu fléchis
  rationale: כרע peut signifier se courber, plier, s’agenouiller ou s’effondrer. « Fléchir » conserve cette image tout en pouvant évoquer l’affaiblissement ou l’abaissement, sans trancher entre un geste physique et une déchéance sociale.
- source_word: לֹא יַחְמֹל עָלֶיךָ
  choice: il ne t’épargnera pas
  rationale: חמל désigne le fait d’épargner quelqu’un ou d’avoir pitié de lui. Cette formulation concise garde ensemble l’absence de compassion et ses conséquences concrètes.
theological_decisions:
- issue: Choix du témoin principal malgré la forte divergence entre l’hébreu et le grec
  choice: Traduire directement le texte hébreu conservé et signaler la tradition grecque en note
  alternative: 'Suivre le grec : « Le riche commet une injustice et, en plus, il s’emporte ; le pauvre subit l’injustice et, en plus, il doit supplier. »'
  rationale: Le témoin hébreu est ici suffisamment assuré et constitue la source principale. La tradition grecque représente toutefois une forme nettement différente du verset ; elle est donc conservée en note plutôt que fusionnée avec l’hébreu.
translation_notes:
  register: Français international actuel, direct et digne. Le tutoiement suit l’adresse à la deuxième personne du singulier en hébreu. « Fléchis » préserve volontairement l’ambiguïté entre le fait de se courber, de céder et de s’affaiblir.
