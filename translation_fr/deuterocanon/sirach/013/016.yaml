  text: What fellowship has a wolf with a lamb? So a wicked man with a righteous man[b][a], and likewise a rich man with a man brought low.
translation:
  language: fr
  text: Quel lien peut-il y avoir entre un loup et un agneau ? Ainsi du méchant et du juste, du riche et d’un homme abaissé.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « un homme abaissé ». L’expression finale est incertaine ; elle peut désigner un homme de condition modeste ou dont la situation s’est dégradée.'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec présente une forme différente du proverbe : « Toute chair se rassemble selon son espèce, et l’homme s’attachera à son semblable. » Cette lecture exprime elle aussi l’idée que chacun fréquente ses semblables.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה יְּחֻבַּר
  choice: Quelle association peut-il y avoir
  rationale: Le passif de חבר pose une question rhétorique sur la possibilité d’être uni ou associé. « Association » rend clairement le rapport relationnel sans suggérer une simple jonction physique.
- source_word: זְאֵב אֶל כֶּבֶשׂ
  choice: entre un loup et un agneau
  rationale: Le couple prédateur-proie est conservé. « Agneau » exprime naturellement la vulnérabilité suggérée par le proverbe.
- source_word: כַּךְ רָשָׁע לַצַּדִיק
  choice: Il en va de même du méchant avec le juste
  rationale: Cette formulation reproduit le parallèle analogique et rend le ל relationnel par « avec », sans ajouter une relation non explicitée.
- source_word: וְכֵן עָשִׁיר
  choice: et aussi du riche
  rationale: Le substantif masculin singulier est rendu de manière générique, en parallèle avec « le méchant » et « le juste ».
- source_word: אִישׁ נֶאֱצָל
  choice: un homme abaissé
  rationale: L’expression hébraïque est difficile. Le contraste avec le riche indique probablement un homme de condition diminuée ou inférieure ; « abaissé » préserve cette amplitude sans réduire nécessairement le sens à la pauvreté économique.
theological_decisions:
- issue: Masculins représentatifs dans un proverbe de sagesse
  choice: le méchant / le juste / le riche / un homme abaissé
  alternative: la personne méchante / la personne juste / la personne riche / une personne de condition modeste
  rationale: L’hébreu emploie des substantifs et formes masculins singuliers dans une maxime générale. La traduction conserve cette forme représentative tout en restant naturelle en français.
- issue: Priorité du témoin hébreu malgré la divergence grecque
  choice: Traduire dans le texte principal le proverbe hébreu du loup et de l’agneau
  alternative: 'Suivre le grec : « Toute chair se rassemble selon son espèce, et l’homme s’attachera à son semblable. »'
  rationale: Le texte hébreu est ici disponible avec une confiance élevée et constitue le témoin principal. Le grec transmet une forme sensiblement différente, qui mérite d’être signalée sans remplacer la lecture hébraïque.
translation_notes:
  register: Français international moderne, digne et proverbial. La question rhétorique est explicitée avec naturel, tandis que l’incertitude de la dernière expression et la variante grecque sont conservées en notes.
