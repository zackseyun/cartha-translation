  text: Be careful not to be too bold[a], and do not make yourself like those who lack understanding.
translation:
  language: fr
  text: Garde-toi d’être trop présomptueux[a], et ne te rends pas semblable à ceux qui manquent de discernement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Prends garde de ne pas être égaré, et ne sois pas humilié dans ta joie. » L’hébreu et le grec diffèrent sensiblement dans ce verset.'
    reason: textual_variant
lexical_decisions:
- source_word: הִשָּׁמֵר
  choice: Garde-toi
  rationale: L’impératif nifal de שׁמר exprime ici une mise en garde. « Garde-toi » restitue directement cette force admonitive dans un français actuel et digne.
- source_word: אַל תִּרְהַב מְאֹד
  choice: d’être trop présomptueux
  rationale: רהב peut évoquer une assurance excessive, une hardiesse arrogante ou la présomption. « Trop présomptueux » rend l’excès marqué par מְאֹד sans réduire le propos à la simple audace.
- source_word: וְאַל תִּדְמֶה
  choice: ne te rends pas semblable
  rationale: דמה signifie ici « être semblable, ressembler ». La tournure pronominale et volontaire rend naturellement l’exhortation à ne pas adopter la manière d’être du groupe visé.
- source_word: בַּחֲסֵירֵי מַדָּע
  choice: à ceux qui manquent de discernement
  rationale: L’expression désigne littéralement ceux auxquels manque la connaissance ou l’intelligence. « Discernement » convient au contexte sapiential et évite de suggérer un simple déficit d’informations.
theological_decisions:
- issue: Divergence importante entre le texte hébreu et le parallèle grec dans les deux membres du verset
  choice: Suivre l’hébreu conservé dans le texte principal et signaler le grec en note
  alternative: 'Grec : « Veille à ne pas t’égarer, et ne sois pas humilié dans ta joie. »'
  rationale: L’hébreu est ici le témoin principal disponible. Le grec présente une formulation substantiellement différente, qui doit être conservée comme variante textuelle sans être harmonisée avec l’hébreu.
translation_notes:
  register: Français moderne international, sobre et sapiential. « Présomptueux » conserve la nuance de hardiesse excessive; « discernement » rend la portée morale et intellectuelle de מַדָּע.
