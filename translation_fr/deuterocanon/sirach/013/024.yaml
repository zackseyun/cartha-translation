translation:
  language: fr
  text: 'Quand un pauvre parle, ils disent : « Qui est celui-là ? » Et s’il trébuche, eux aussi le poussent[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils contribuent eux aussi à sa chute ». Le verbe hébreu peut signifier pousser, repousser ou chasser ; dans ce contexte, il peut évoquer le fait d’aggraver la chute du pauvre au lieu de l’aider.'
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec présente ici une leçon très différente : « La richesse est bonne quand elle est sans péché, et la pauvreté est mauvaise dans la bouche de l’homme pieux. » La traduction suit le texte hébreu conservé.'
    reason: textual_variant
lexical_decisions:
- source_word: דַּל
  choice: un pauvre
  rationale: Le terme désigne une personne pauvre, faible ou de condition modeste. « Un pauvre » conserve le singulier générique et convient au style sentencieux.
- source_word: דּוֹבֵר
  choice: parle
  rationale: 'Le participe exprime ici une situation générale : chaque fois qu’un pauvre prend la parole.'
- source_word: מִי זֶה
  choice: Qui est celui-là ?
  rationale: Cette formulation naturelle en français rend la question directe ainsi que sa nuance de mépris et de mise à distance.
- source_word: נִתְקַל
  choice: trébuche
  rationale: Le verbe évoque le fait de trébucher, concrètement ou figurativement, sans préciser la nature de la défaillance.
- source_word: גַּם הֵם יֶהְדֳּפוּהוּ
  choice: eux aussi le repoussent
  rationale: Cette traduction suit de près « eux aussi » et le verbe הדף, qui signifie pousser, repousser ou chasser, sans transformer explicitement l’image en chute aggravée.
