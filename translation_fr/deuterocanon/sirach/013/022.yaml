base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/022.yaml
  text: A poor man totters[a]; he speaks, and they cry, “Away, away!”; but an intelligent man speaks[b], and there is no place for him.
translation:
  language: fr
  text: 'Un pauvre chancelle ; il parle, et on lui crie : « Va-t’en ! Va-t’en ! »[a] Il parle avec discernement, mais il n’y a pas de place pour lui[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque est brève et idiomatique. Elle évoque un cri répété de rejet ou de réprimande. Le grec explicite l’idée : lorsque l’homme de condition modeste trébuche, on lui adresse des reproches.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il n’y a pas de place pour lui ». Autrement dit, même ses paroles sensées ne trouvent ni écoute ni accueil.'
    reason: alternative_reading
lexical_decisions:
- source_word: דַּל
  choice: un pauvre
  rationale: Le terme désigne une personne pauvre, faible ou socialement défavorisée. Le singulier et la formulation proverbiale sont conservés.
- source_word: נָמוֹט
  choice: chancelle
  rationale: Le verbe évoque le fait de vaciller, de glisser ou d’être ébranlé, sans préciser si la défaillance est morale ou circonstancielle.
- source_word: גָּע גָּע יִשֶּׂא
  choice: 'on lance contre lui : « Va-t’en ! Va-t’en ! »'
  rationale: L’hébreu est très condensé. Le redoublement exprime une réaction brusque de rejet ; le sujet indéfini « on » rend naturellement la clameur sociale dirigée contre le pauvre.
- source_word: וְדִבֶּר מַשְׂכִּיל
  choice: Il parle avec discernement
  rationale: מַשְׂכִּיל peut qualifier une personne avisée ou décrire une parole pleine d’intelligence. Le parallèle grec présente le même homme défavorisé prononçant des paroles sensées ; cette traduction maintient donc le pauvre comme sujet tout en exprimant la notion de discernement.
- source_word: וְאֵין לוֹ מָקוֹם
  choice: mais il n’y a pas de place pour lui
  rationale: 'La formulation littérale conserve l’image sociale forte : malgré la valeur de ses paroles, aucune place ni audience ne lui est accordée.'
theological_decisions:
- issue: Sujet de וְדִבֶּר מַשְׂכִּיל
  choice: 'Le pauvre reste le sujet : « Il parle avec discernement »'
  alternative: « Un homme avisé parle »
  rationale: L’hébreu comprimé permet les deux analyses, mais le parallèle grec enchaîne les actions du même homme de condition modeste. Ce choix renforce la cohérence du distique sans transformer l’ambiguïté en affirmation doctrinale.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Un pauvre » conserve la singularité du texte sans employer un terme vieilli. La ponctuation met en relief le cri de rejet, tandis que « avec discernement » restitue naturellement l’idée d’une parole intelligente.
