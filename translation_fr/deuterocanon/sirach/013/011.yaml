base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/011.yaml
  text: Do not trust his ease with you[a], and do not believe his many words; for with much talk he is testing you, and while laughing with you he is probing you.
translation:
  language: fr
  text: Ne te fie pas à l’aisance qu’il montre avec toi[a], et ne crois pas ses nombreuses paroles ; car, à force de paroles, il te met à l’épreuve et, tout en riant avec toi, il te sonde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la liberté de parole avec lui », c’est-à-dire à une familiarité sans réserve ou au fait de parler trop librement en sa présence. L’hébreu porte littéralement « liberté », et le grec va dans le sens d’une parole libre ou d’égal à égal.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּבְטַח
  choice: Ne te fie pas
  rationale: Rend naturellement l’interdiction de placer sa confiance dans l’attitude de cet homme.
- source_word: לְחֹפֶשׁ עִמּוֹ
  choice: à la liberté qu’il prend avec toi
  rationale: חֹפֶשׁ désigne littéralement la liberté ; dans ce contexte relationnel, l’expression évoque une familiarité ou une franchise susceptible d’inspirer une confiance imprudente. Le grec ἰσηγορεῖσθαι confirme la nuance de parole libre ou d’égal à égal.
- source_word: וְאַל תַּאֲמִין לְרֹב שִׂיחוֹ
  choice: et ne crois pas ses nombreuses paroles
  rationale: Le verbe אמן à la forme causative signifie ici croire ou tenir pour fiables les propos entendus ; רֹב souligne leur abondance.
- source_word: כִּי מַרְבִּית שִׂיחוֹ
  choice: car, par son flot de paroles
  rationale: Cette formulation française garde l’idée d’une parole abondante employée comme moyen, sans lourdeur littérale.
- source_word: נִסּיוֹן
  choice: il te met à l’épreuve
  rationale: Le texte hébreu est condensé, mais le grec πειράσει σε explicite une action d’éprouver dirigée contre l’interlocuteur.
- source_word: וְשֹׂחֵק לְךָ
  choice: et tout en riant avec toi
  rationale: Conserve le contraste entre une apparence amicale et l’examen caché qui suit.
- source_word: וַחֲקָרֶךָ
  choice: il te sonde
  rationale: La racine חקר exprime une recherche ou un examen approfondi ; « sonder » convient au contexte d’une investigation personnelle dissimulée.
