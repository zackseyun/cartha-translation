translation:
  language: fr
  text: Tout être vivant[a] reste avec ceux de son espèce, et l’être humain est lié à ceux de son espèce.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec dit : « Tout être vivant aime ce qui lui ressemble, et tout être humain aime son prochain. » Le texte hébreu, plus elliptique, met l’accent sur l’association avec ceux de sa propre espèce.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִין
  choice: espèce
  rationale: Le terme désigne une catégorie ou une sorte. « Espèce » convient au parallélisme portant sur les êtres vivants, tout en conservant l’idée d’appartenance à un même groupe.
- source_word: כָּל בָּשָׂר
  choice: chaque espèce de chair
  rationale: La formulation conserve le mot concret « chair » et la construction condensée de l’hébreu. Dans ce contexte proverbial, elle englobe les créatures animées.
- source_word: אֶצְלוֹ
  choice: reste avec les siens
  rationale: L’expression hébraïque est elliptique et indique ici la proximité ou l’association. Cette formulation française rend cette relation sans lui attribuer explicitement l’idée d’amour présente seulement dans le parallèle grec.
- source_word: יְחֻבַּר
  choice: est lié
  rationale: Le passif de חבר exprime le fait d’être joint ou associé. « Est lié » garde la voix passive et reste naturel en français.
- source_word: אָדָם
  choice: l’être humain
  rationale: Le singulier est générique et vise l’humanité en général. « L’être humain » restitue cette portée sans introduire une restriction au sexe masculin.
theological_decisions:
- issue: Priorité du témoin hébreu face au parallèle grec dans le premier membre elliptique
  choice: Suivre l’hébreu en parlant d’espèce, de chair et d’association avec les siens.
  alternative: « Tout être vivant aime son semblable, et tout homme son prochain. »
  rationale: Le texte hébreu conservé constitue ici le témoin principal. Le grec confirme l’idée générale d’affinité, mais son verbe « aimer » et son terme « prochain » ne sont pas introduits dans le texte principal afin de ne pas effacer la formulation distincte de l’hébreu.
translation_notes:
  register: Français moderne, proverbial et digne. « Chaque espèce de chair » garde volontairement la formulation concrète et quelque peu condensée de l’hébreu; « les siens » et « ceux de son espèce » rendent clairement l’affinité exprimée par les deux membres.
