base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/020.yaml
  text: When a rich man stumbles[a], he is supported by a friend; but when a poor man stumbles[b], he is driven away from friend to friend.
translation:
  language: fr
  text: Quand un riche chancelle, un ami le soutient ; mais quand un pauvre chancelle, il est repoussé d’ami en ami[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « d’un ami à un ami ». L’hébreu suggère que le pauvre est renvoyé de l’un à l’autre plutôt que véritablement soutenu.
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec diffère considérablement : « L’abaissement est une abomination pour l’orgueilleux, et le pauvre est une abomination pour le riche. » La traduction suit ici le témoin hébreu.'
    reason: textual_variant
lexical_decisions:
- source_word: עָשִׁיר
  choice: un riche
  rationale: Le substantif singulier a une portée proverbiale. « Un riche » exprime naturellement cette généralisation tout en conservant le contraste avec « un pauvre ».
- source_word: מוּט / נָמוֹט
  choice: chancelle
  rationale: Le verbe évoque le fait de vaciller ou de perdre pied, sans nécessairement tomber tout à fait. Le même terme français dans les deux propositions préserve le parallélisme hébreu.
- source_word: נִסְמָךְ
  choice: le soutient
  rationale: La forme indique que le riche reçoit un appui. La tournure active « un ami le soutient » est naturelle en français et garde clairement l’agent exprimé par מֵרֵעַ.
- source_word: רֵעַ
  choice: ami
  rationale: « Ami » convient au contexte social du proverbe et permet de conserver le contraste entre l’aide réelle apportée au riche et le renvoi répété du pauvre.
- source_word: דַל
  choice: un pauvre
  rationale: דַל désigne ici une personne démunie ou socialement faible. « Un pauvre » maintient l’opposition socioéconomique avec עָשִׁיר.
- source_word: נִדְחָה
  choice: il est repoussé
  rationale: Le verbe exprime la mise à l’écart ou le rejet. « Est repoussé » conserve la voix passive et forme un contraste net avec « le soutient ».
- source_word: מֵרֵעַ אֶל רֵעַ
  choice: d’ami en ami
  rationale: Cette expression concise suit le mouvement de l’hébreu et suggère que le pauvre est renvoyé successivement sans recevoir de véritable secours.
theological_decisions:
- issue: Différence substantielle entre le texte hébreu et le parallèle grec
  choice: Traduire le témoin hébreu fourni comme texte principal et signaler la variante grecque en note
  alternative: 'Suivre le grec : « L’abaissement est une abomination pour l’orgueilleux, et le pauvre est une abomination pour le riche. »'
  rationale: Le témoin hébreu est ici la source originale prioritaire et son niveau de confiance est élevé. La leçon grecque, très différente, doit néanmoins rester visible afin de ne pas masquer la tension textuelle.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme est rendu par la répétition de « quand » et de « chancelle », tandis que « le soutient » et « est repoussé » font ressortir l’antithèse sociale.
