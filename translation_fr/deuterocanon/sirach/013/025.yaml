  yaml_path: translation/deuterocanon/sirach/013/025.yaml
  text: Wealth is good if there is no iniquity[b][a], and poverty is bad according to the mouth of arrogance.
translation:
  language: fr
  text: La richesse est bonne s’il n’y a pas de faute, et la pauvreté est mauvaise au dire de l’arrogance.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu traduit par « au dire de l’arrogance » dit littéralement « selon la bouche de l’arrogance ». L’expression est difficile et peut désigner la parole ou le jugement des arrogants.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec présente ici une lecture très différente : « Le cœur d’un être humain change son visage, soit en bien, soit en mal. »'
    reason: textual_variant
lexical_decisions:
- source_word: טוֹב הָעֹשֶׂר
  choice: La richesse est bonne
  rationale: Cette formulation conserve le parallélisme proverbial et l’évaluation simple exprimée par טוֹב, sans préciser de quelle manière la richesse est bonne.
- source_word: אִם אֵין עָוֹן
  choice: s’il n’y a pas de faute
  rationale: La tournure existentielle rend אֵין et laisse ouverte la relation exacte entre la richesse et la faute. « Faute » exprime ici la dimension morale de עָוֹן sans imposer exclusivement le sens de culpabilité ou celui de péché.
- source_word: וְרַע הָעוֹנִי
  choice: et la pauvreté est mauvaise
  rationale: « Mauvaise » répond directement à « bonne », tandis que « pauvreté » rend naturellement la condition désignée par הָעוֹנִי. La coordination par « et » suit le texte hébreu.
- source_word: עַל פִּי זָדוֹן
  choice: au dire de l’arrogance
  rationale: « Au dire de » restitue de façon idiomatique l’image de la bouche dans עַל פִּי, tout en maintenant l’idée de parole ou de jugement. « Arrogance » conserve la valeur abstraite de זָדוֹן et évite d’identifier trop précisément un locuteur.
theological_decisions:
- issue: Choix entre le texte hébreu et la forme grecque divergente
  choice: Traduire comme texte principal le proverbe hébreu sur la richesse et la pauvreté.
  alternative: 'Suivre le grec : « Le cœur d’un être humain change son visage, soit en bien, soit en mal. »'
  rationale: Le texte hébreu est conservé ici avec une confiance élevée et constitue la source principale. Le grec transmet une phrase substantiellement différente ; sa lecture est donc signalée en note plutôt que substituée au texte hébreu.
- issue: Portée morale de la richesse et de la pauvreté
  choice: Conserver la qualification conditionnelle de la richesse et l’énoncé difficile sur la pauvreté sans les harmoniser.
  alternative: Paraphraser en affirmant que la richesse honnêtement acquise est bonne ou que seuls les arrogants jugent la pauvreté mauvaise.
  rationale: Ces paraphrases sont plausibles, mais elles résolvent des rapports syntaxiques et moraux que l’hébreu laisse incertains.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme « bonne / mauvaise » est conservé. « Au dire de l’arrogance » reste légèrement marqué afin de refléter la difficulté de l’hébreu, expliquée en note.
