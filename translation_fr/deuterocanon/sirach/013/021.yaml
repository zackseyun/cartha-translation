  text: A rich man speaks[a], and many are his supporters; even his ugly words are made beautiful.
translation:
  language: fr
  text: Un riche parle[a], et nombreux sont ceux qui le soutiennent ; même ses paroles laides sont embellies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec diffère sensiblement : « Un riche qui chancelle est soutenu par ses amis, mais un homme humble qui tombe est repoussé même par ses amis. » Le témoin hébreu souligne plutôt l’accueil favorable réservé aux paroles d’un riche.'
    reason: alternative_reading
lexical_decisions:
- source_word: עָשִׁיר
  choice: un riche
  rationale: Le singulier hébreu présente un personnage représentatif. « Un riche » est naturel en français proverbial et conserve la référence masculine du texte.
- source_word: מְדַבֵּר
  choice: parle
  rationale: Le présent simple restitue directement la formulation proverbiale de l’hébreu.
- source_word: וְעוֹזְרָיו רַבִּים
  choice: et nombreux sont ceux qui le soutiennent
  rationale: La tournure rend littéralement l’abondance de ses aides tout en exprimant naturellement leur soutien social.
- source_word: דְבָרָיו
  choice: ses paroles
  rationale: Ce choix concret correspond au pluriel hébreu et maintient le lien avec l’acte de parler.
- source_word: מְכוֹעֲרִין
  choice: laides
  rationale: « Laides » conserve la métaphore esthétique et prépare l’opposition ironique avec l’embellissement.
- source_word: מְיוּפִּין
  choice: on les embellit
  rationale: 'La formulation française exprime la valeur passive/causative : d’autres présentent favorablement les paroles répréhensibles du riche, sans préciser l’agent absent de l’hébreu.'
