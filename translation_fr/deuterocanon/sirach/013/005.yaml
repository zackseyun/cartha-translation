  text: If you have something[a], he will speak kindly with you, and he will strip you bare without feeling pain.
translation:
  language: fr
  text: Si tu as quelque chose[a], il t’adressera des paroles aimables ; il te dépouillera et n’en éprouvera aucune peine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec porte : « Si tu lui es utile, il se servira de toi ; si tu viens à manquer, il t’abandonnera. » Il témoigne ici d’une forme du verset sensiblement différente de l’hébreu conservé.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם שַלְּךָ
  choice: S’il y a quelque chose chez toi
  rationale: La formulation hébraïque transmise est difficile. Cette traduction reste proche de l’idée de ce qui est « à toi » ou se trouve « chez toi », probablement des ressources, sans préciser davantage que le témoin hébreu. Elle laisse aussi ouverte une proximité avec l’idée grecque d’utilité.
- source_word: יֵיטִיב דְּבָרָיו עִמָּךְ
  choice: il t’adressera des paroles aimables
  rationale: Littéralement, il « rendra bonnes ses paroles avec toi ». La formulation française exprime naturellement une parole agréable ou flatteuse tout en maintenant l’accent sur les paroles.
- source_word: וִירֹשֶׁשְׁךָ
  choice: il te dépouillera
  rationale: Le verbe évoque le fait de réduire quelqu’un à la pauvreté ou de le déposséder. « Dépouiller » rend avec concision la violence prédatrice du contexte.
- source_word: וְלֹא יִכְאַב לוֹ
  choice: il n’en éprouvera aucune peine
  rationale: La proposition indique que l’exploiteur ne ressentira ni douleur ni affliction à cause de son acte. Le pronom « en » rend explicite en français le lien avec le dépouillement sans résoudre davantage la nature exacte de cette absence de peine.
theological_decisions:
- issue: Choix entre le témoin hébreu de la Guéniza du Caire et le parallèle grec sensiblement divergent
  choice: Le texte principal suit l’hébreu conservé, tandis que la forme grecque est signalée en note.
  alternative: 'Traduire principalement le grec : « Si tu lui es utile, il se servira de toi ; si tu viens à manquer, il t’abandonnera. »'
  rationale: Puisque l’hébreu est conservé pour ce verset, il demeure le texte principal. La divergence substantielle du grec constitue toutefois une véritable variante textuelle et doit être préservée plutôt qu’harmonisée silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure légèrement énigmatique « quelque chose chez toi » conserve la difficulté réelle de l’hébreu ; la note présente clairement la lecture grecque divergente.
