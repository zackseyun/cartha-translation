  text: All flesh loves its own kind[a], and every person the one like himself.
translation:
  language: fr
  text: Toute chair aime son semblable, et tout être humain aime celui qui lui ressemble.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « et tout homme aime son prochain ». L’hébreu dit plus littéralement : « celui qui lui ressemble ».'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַבָּשָׂר
  choice: Toute chair
  rationale: Rend littéralement l’expression hébraïque tout en conservant le registre concret et proverbial. Dans ce contexte, « chair » désigne largement les êtres vivants.
- source_word: יֶאֱהַב
  choice: aime
  rationale: L’imparfait hébreu exprime ici une vérité générale; le présent français convient à cette maxime.
- source_word: מִינוֹ
  choice: ceux de son espèce
  rationale: מִין désigne l’espèce, la catégorie ou le genre. Cette formulation est plus naturelle en français que « sa propre espèce » comme objet du verbe « aimer ».
- source_word: וְכָל אָדָם
  choice: et tout être humain
  rationale: אָדָם désigne ici chaque humain de façon générique. « Être humain » est précis, naturel et n’ajoute aucune restriction de sexe absente de la portée de la maxime.
- source_word: אֶת הַדּוֹמֶה לוֹ
  choice: celui qui lui ressemble
  rationale: Suit directement l’hébreu, qui parle d’une personne semblable, sans lui substituer la notion plus large de « prochain » attestée dans le grec.
theological_decisions:
- issue: Nuance différente entre l’hébreu et le grec dans le second membre
  choice: Retenir dans le texte « celui qui lui ressemble »
  alternative: « son prochain »
  rationale: Le témoin hébreu conservé est explicite et constitue ici la source principale. Le grec ancien présente une nuance notable de proximité sociale; elle est signalée en note sans remplacer le sens de ressemblance du texte hébreu.
translation_notes:
  register: Français moderne, sobre et proverbial. « Toute chair » maintient la couleur concrète de l’hébreu; la répétition de « aime » dans le second membre clarifie l’ellipse hébraïque et donne une phrase naturelle à la lecture.
