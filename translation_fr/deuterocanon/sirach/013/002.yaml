  text: Do not carry what is heavier than you, and do not associate with one richer than you.
translation:
  language: fr
  text: Ne porte pas ce qui est trop lourd pour toi, et ne te lie pas à quelqu’un de plus riche que toi.[a] Qu’est-ce qu’un tesson peut avoir en commun avec une marmite ? Elle le heurte, et il se brise. Ou qu’est-ce qu’un riche peut avoir en commun avec un pauvre ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « quelqu’un de plus puissant et de plus riche que toi ».'
    reason: Signaler la différence substantielle du parallèle grec sans l’importer dans le texte hébreu principal.
lexical_decisions:
- source_word: כָּבֵד מִמְּךָ
  choice: ce qui est trop lourd pour toi
  rationale: L’expression signifie littéralement « lourd au-delà de toi »; « trop lourd pour toi » restitue naturellement l’idée d’une charge qui dépasse les capacités de la personne.
- source_word: תִּשָּׂא
  choice: ne porte pas
  rationale: Le verbe נשׂא signifie ici « porter, soulever ». La question rhétorique hébraïque est rendue comme une mise en garde, conformément à sa fonction dans le contexte sapientiel et au parallèle grec.
- source_word: תִּתְחַבָּר
  choice: ne te lie pas
  rationale: Le hitpael de חבר exprime le fait de s’associer ou de nouer un lien. « Se lier à » est naturel en français et conserve l’idée d’une relation étroite sans en préciser indûment la nature.
- source_word: עָשִׁיר מִמְּךָ
  choice: quelqu’un de plus riche que toi
  rationale: Rend directement le comparatif hébreu, sans ajouter l’idée de puissance présente seulement dans le parallèle grec.
theological_decisions:
- issue: Portée de l’avertissement concernant la richesse
  choice: Conserver la formulation générale et non explicitée de l’hébreu
  alternative: Préciser qu’il s’agit d’éviter toute relation avec une personne riche ou puissante
  rationale: Le texte formule une maxime sapientielle concise; il ne définit ni la nature exacte de l’association ni une interdiction universelle de toute relation sociale.
- issue: Ajout grec de la puissance
  choice: Suivre l’hébreu et ne mentionner que la richesse dans le texte principal
  alternative: « quelqu’un de plus puissant et de plus riche que toi »
  rationale: Le témoin hébreu de haute confiance ne comporte que « plus riche que toi ». La variante grecque est signalée en note plutôt qu’intégrée au texte.
translation_notes:
  register: Français international moderne, sobre et proverbial. La tournure impérative rend la force exhortative des questions rhétoriques hébraïques tout en restant claire pour un lectorat général.
