translation:
  language: fr
  text: Il a besoin de toi et viendra à ton aide[a] ; il te sourira et te mettra en confiance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « il te secourra ». Le grec présente une leçon très différente : « Si tu as [quelque chose], il vivra avec toi et te videra, sans que lui-même se donne de peine. »'
    reason: textual_variant
  - marker: b
    text: 'Ou : « te rassurera ».'
    reason: translation_clarity
lexical_decisions:
- source_word: צֹרֶךְ לוֹ עִמְּךָ
  choice: Il a besoin de toi
  rationale: L’expression hébraïque construit le besoin avec עִמְּךָ (« avec toi ») et signifie naturellement qu’il a besoin de toi. Le texte grec présente à cet endroit une formulation conditionnelle différente.
- source_word: וְהָשִׁיעַ לָךְ
  choice: et viendra à ton aide
  rationale: Tel qu’il est vocalisé, l’hébreu se rattache naturellement à ישׁע, « sauver, secourir ». Cette traduction suit donc le témoin hébreu au lieu de lui imposer le sens très différent du grec, tout en signalant la divergence en note.
- source_word: וְשׁוֹחֵק לְךָ
  choice: il te sourira
  rationale: Dans cette scène de faveur intéressée, « sourire » rend naturellement שׂחק et la cordialité affichée, sans introduire explicitement une moquerie que le mot n’impose pas ici.
- source_word: וְהִבְטִיחֶךָ
  choice: te mettra en confiance
  rationale: Le hifil de בטח signifie faire éprouver de la sécurité ou de la confiance. « Mettre en confiance » conserve cette valeur causative et convient au français actuel.
- source_word: ἀποκενώσει σε
  choice: il te videra de tout
  rationale: Le parallèle grec évoque concrètement le fait d’épuiser les ressources de quelqu’un. Cette leçon n’est pas incorporée au texte principal, puisque le témoin hébreu conservé dit autre chose, mais elle est donnée dans la note textuelle.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, sobre et digne. Le texte principal suit en priorité l’hébreu vocalisé, malgré sa forte divergence avec le grec. « Mettre en confiance » conserve l’ambivalence du geste : la formule peut désigner une assurance bienveillante ou, dans le contexte, une cordialité intéressée.'
