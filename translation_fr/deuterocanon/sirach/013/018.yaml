  text: The wild beasts of the wilderness are food for the lion[b][a]; so the poor are the pasture of the rich.
translation:
  language: fr
  text: Les animaux sauvages[a] du désert sont la nourriture du lion ; de même, les pauvres sont la pâture des riches.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « les ânes sauvages du désert », si le terme hébreu est compris dans un sens plus étroit plutôt que comme désignant les animaux sauvages en général.'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec porte : « Quelle paix peut-il y avoir entre une hyène et un chien ? Et quelle paix entre un riche et un pauvre ? » Le parallèle grec conserve un proverbe différent qui souligne, lui aussi, l’hostilité entre riches et pauvres.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַאֲכַל
  choice: la nourriture de
  rationale: Le nom désigne ce qui est mangé. « La nourriture de » conserve directement l’image de prédation sans préciser davantage le mode de capture.
- source_word: אֲרִי
  choice: lion
  rationale: Équivalent français courant et précis du terme hébreu.
- source_word: פִּרְאֵי מִדְבָּר
  choice: les animaux sauvages du désert
  rationale: Cette traduction rend naturellement l’expression comme une désignation collective des animaux sauvages des terres désertiques, tout en signalant en note le sens plus étroit possible de פרא.
- source_word: כֵּן
  choice: de même
  rationale: Introduit clairement le second membre de la comparaison proverbiale.
- source_word: מַרְעִית
  choice: la pâture de
  rationale: « Pâture » garde l’image hébraïque de ce dont on se nourrit et exprime avec force, sans l’aplanir, l’exploitation métaphorique des pauvres par les riches.
- source_word: עָשִׁיר
  choice: les riches
  rationale: Le singulier hébreu a ici une valeur générique ; le pluriel français convient au contraste entre deux groupes sociaux.
- source_word: דַּלִּים
  choice: les pauvres
  rationale: Le terme désigne les personnes pauvres ou démunies ; le contexte social et le parallèle grec favorisent « les pauvres » plutôt que « les faibles ».
theological_decisions:
- issue: Divergence entre le texte hébreu conservé et le parallèle grec
  choice: Traduire dans le texte principal le proverbe hébreu fondé sur l’image de la prédation.
  alternative: « Quelle paix peut-il y avoir entre une hyène et un chien ? Et quelle paix entre un riche et un pauvre ? »
  rationale: Puisque le texte hébreu de ce verset est conservé avec un degré élevé de confiance, il demeure le témoin principal. Le grec transmet un proverbe sensiblement différent, mais portant sur la même hostilité sociale ; cette variante importante est donc conservée en note sans remplacer l’hébreu.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Pâture » est légèrement soutenu, mais reste intelligible et préserve l’image saisissante du texte hébreu.
