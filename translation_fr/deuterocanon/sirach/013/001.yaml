translation:
  language: fr
  text: Qui touche à la poix aura la main qui y collera[a], et qui fréquente un moqueur apprendra sa manière d’agir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Qui touche à la poix sera souillé, et qui fréquente un orgueilleux deviendra semblable à lui. » Le témoin hébreu dit plutôt « un moqueur » et « apprendra sa manière d’agir ».'
    reason: alternative_reading
lexical_decisions:
- source_word: נוֹגֵעַ
  choice: Qui touche
  rationale: Le participe exprime une vérité générale sous forme proverbiale. « Qui touche » est naturel et concis en français.
- source_word: בְּזֶפֶת
  choice: à la poix
  rationale: « Poix » désigne précisément une substance noire et collante et conserve l’image concrète du proverbe; « goudron » serait plus courant mais moins exact.
- source_word: תִּדְבַּק יָדוֹ
  choice: en aura la main collée
  rationale: L’hébreu dit littéralement que sa main collera. La tournure française indique naturellement que la poix adhérera à la main, sans adopter la notion grecque de souillure.
- source_word: וְחוֹבֵר
  choice: et qui fréquente
  rationale: Le verbe évoque le fait de se joindre à quelqu’un ou d’être en relation avec lui. « Fréquente » rend clairement cette association habituelle.
- source_word: לֵץ
  choice: un moqueur
  rationale: Dans la littérature sapientielle hébraïque, לֵץ désigne celui qui raille et rejette la correction. « Moqueur » est moderne et plus immédiatement compréhensible que « railleur ».
- source_word: יִלְמַד דַּרְכּוֹ
  choice: apprendra sa conduite
  rationale: Le texte hébreu dit « apprendra son chemin/sa manière ». « Sa conduite » transmet l’idée d’une manière d’agir acquise par imitation, tout en restant proche de l’hébreu.
theological_decisions:
- issue: Choix entre le témoin hébreu et le parallèle grec
  choice: 'Suivre dans le texte principal l’hébreu conservé: la main reste collée, et celui qui fréquente un moqueur apprend sa conduite.'
  alternative: 'Suivre le grec: celui qui touche à la poix sera souillé, et celui qui fréquente un orgueilleux lui deviendra semblable.'
  rationale: Le témoin hébreu est ici prioritaire. Le grec confirme le sens général du proverbe, mais déplace l’image de l’adhérence vers la souillure et décrit le compagnon comme orgueilleux plutôt que moqueur. La note conserve cette variante significative.
translation_notes:
  register: Français international moderne, proverbial et digne. La formulation reste concise. « Poix » est retenu pour sa précision malgré son caractère un peu moins courant; le contexte et l’image de la main collée en éclairent le sens.
