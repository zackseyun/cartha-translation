  text: Do not draw near[a], lest you be pushed away; and do not stay far off[b], lest you be hated.
translation:
  language: fr
  text: Ne t’approche pas, de peur d’être repoussé ; ne reste pas loin, de peur d’être détesté.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte, dans le second membre, « de peur d’être oublié » plutôt que l’hébreu « de peur d’être détesté ». Dans le premier membre, l’hébreu transmis est difficile ; le grec appuie le sens « être repoussé ».
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּתְקָרֵב
  choice: Ne t’approche pas trop
  rationale: Le verbe exprime l’action de s’approcher. L’ajout de « trop », implicite dans le contraste contextuel, évite d’interdire toute proximité et rend naturelle la mise en garde sociale.
- source_word: פֶּן
  choice: de peur de
  rationale: Cette tournure française actuelle restitue la valeur préventive de פן et maintient le parallélisme proverbial.
- source_word: תִּתְרַחֵק
  choice: être repoussé
  rationale: Le texte hébreu transmis est difficile, car la forme évoque littéralement le fait de s’éloigner ou d’être éloigné. Le passif « être repoussé », appuyé par le grec ἀπωσθῇς, exprime ici la conséquence d’une proximité excessive.
- source_word: וְאַל תִּתְרַחֵק
  choice: et ne reste pas trop loin
  rationale: Dans le second membre, la même racine רחק désigne clairement le maintien à distance. « Trop loin » fait ressortir l’équilibre entre familiarité excessive et éloignement excessif.
- source_word: תִּשָּׂנֵא
  choice: être détesté
  rationale: Le nifal de שׂנא signifie normalement « être haï, détesté ». « Détesté » est direct, naturel et conserve la force du témoin hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et proverbial. Le tutoiement correspond à l’adresse individuelle habituelle des sentences de sagesse. La répétition de « trop » explicite l’équilibre pragmatique du conseil sans effacer la difficulté textuelle, signalée en note.
