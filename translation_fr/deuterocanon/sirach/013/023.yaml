  text: When a rich man speaks[a], everyone falls silent, and they lift up his sense to the clouds.
translation:
  language: fr
  text: Quand un riche parle, tous se taisent et font monter son discernement[a] jusqu’aux nuages.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « et ils ont élevé sa parole jusqu’aux nuages ». L’hébreu dit « son discernement » ou « son intelligence » ; il est suivi ici comme témoin principal.'
    reason: alternative_reading
lexical_decisions:
- source_word: עָשִׁיר
  choice: un riche
  rationale: Le singulier masculin a une valeur générique dans cette maxime. « Un riche » est direct, naturel et fidèle au sens ordinaire du terme.
- source_word: דּוֹבֵר
  choice: parle
  rationale: Le présent rend naturellement la portée générale et proverbiale du participe hébreu.
- source_word: הַכֹּל
  choice: tous
  rationale: Ce collectif désigne l’ensemble des personnes présentes et appelle naturellement un verbe au pluriel en français.
- source_word: נִסְכָּתוּ
  choice: se taisent
  rationale: Le contexte ainsi que le parallèle grec ἐσίγησαν appuient nettement le sens de garder ou faire silence.
- source_word: שִׂכְלוֹ
  choice: son discernement
  rationale: '« Discernement » exprime la faculté de comprendre ou de juger, tout en laissant subsister l’ironie possible : la pensée du riche est démesurément célébrée.'
- source_word: עַד עָב
  choice: jusqu’aux nuages
  rationale: Cette formulation conserve l’image concrète d’une élévation excessive. Le pluriel est idiomatique en français et correspond aussi au parallèle grec.
- source_word: יַגִּיעוּ
  choice: font monter
  rationale: La forme causative exprime le fait de faire parvenir ou monter quelque chose jusqu’à un point élevé. La traduction préserve à la fois le mouvement imagé et l’idée d’exaltation.
theological_decisions: []
