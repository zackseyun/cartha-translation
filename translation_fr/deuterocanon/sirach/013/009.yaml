  text: When a noble draws near[a], keep your distance, and then he will bring you nearer still.
translation:
  language: fr
  text: Quand un notable t’invite à t’approcher[a], tiens-toi à distance, et il te fera approcher davantage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est concis et peut se traduire plus littéralement : « Approche-toi d’un notable ; tiens-toi loin. » Le parallèle grec appuie le sens retenu ici : lorsqu’un puissant t’appelle auprès de lui, reste en retrait, et il t’invitera à t’approcher davantage.'
    reason: alternative_reading
lexical_decisions:
- source_word: קָרֵב נָדִיב
  choice: Quand un notable t’invite à t’approcher
  rationale: L’hébreu est concis et peut aussi se comprendre comme un impératif (« Approche-toi d’un notable »). Le parallèle grec, προσκαλεσαμένου σε δυνάστου, appuie toutefois le sens d’une invitation émanant d’un personnage puissant. « Notable » exprime ici le rang et l’influence sans préciser indûment un titre politique.
- source_word: הֱיֶה רָחוֹק
  choice: tiens-toi à distance
  rationale: Cette formulation française naturelle conserve l’impératif de réserve prudente; elle concorde aussi avec le grec ὑποχωρῶν γίνου, qui évoque le fait de se retirer ou de rester en retrait.
- source_word: וּכְדֵי כֵן יַגִּישֶׁךָ
  choice: et il te fera approcher davantage
  rationale: Le verbe נגשׁ à valeur causative avec suffixe objet signifie ici faire avancer ou approcher quelqu’un. « Davantage » rend la progression comparative confirmée par le grec τόσῳ μᾶλλον.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Notable » désigne une personne de rang ou d’influence; la formulation maintient le conseil de réserve sociale ainsi que l’ambiguïté de l’hébreu au moyen d’une note.
