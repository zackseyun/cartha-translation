  text: Humility is abhorrent to pride[a], and the poor are abhorrent to the rich.
translation:
  language: fr
  text: L’humilité répugne à l’orgueil[a], et le pauvre répugne au riche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin grec porte : « Les ânes sauvages sont la proie des lions dans le désert ; ainsi les pauvres sont la pâture des riches. » Le texte hébreu conservé ici dit plutôt : « L’humilité répugne à l’orgueil, et le pauvre répugne au riche. »'
    reason: alternative_reading
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: répugne à
  rationale: La construction exprime une forte aversion relationnelle. « Répugne à » est naturel en français actuel et conserve cette intensité sans introduire la coloration cultuelle que pourrait suggérer « abomination ».
- source_word: גַּאֲוָה
  choice: l’orgueil
  rationale: Le nom désigne l’orgueil ou l’arrogance. « L’orgueil » rend directement l’abstraction et maintient le contraste proverbial avec l’humilité.
- source_word: עֲנָוָה
  choice: l’humilité
  rationale: Le nom abstrait désigne l’humilité, qu’il s’agisse d’une disposition ou d’une condition humble. Ce choix est clair et naturel en français moderne.
- source_word: עָשִׁיר
  choice: le riche
  rationale: Bien que le terme hébreu soit singulier, il a ici une valeur générique dans une maxime. Le singulier français « le riche » conserve cette forme et s’oppose nettement au « pauvre ».
- source_word: אֶבְיוֹן
  choice: le pauvre
  rationale: Le mot désigne une personne pauvre ou indigente. Le singulier générique « le pauvre » correspond à l’hébreu et forme un parallélisme naturel avec « le riche ».
theological_decisions:
- issue: Choix entre le texte hébreu conservé et le parallèle grec, dont l’image diffère profondément
  choice: 'Traduire directement l’hébreu : « L’humilité répugne à l’orgueil, et le pauvre répugne au riche. »'
  alternative: 'Selon le témoin grec : « Les ânes sauvages sont la proie des lions dans le désert ; ainsi les pauvres sont la pâture des riches. »'
  rationale: Le texte hébreu est conservé ici avec un degré élevé de confiance et gouverne donc le texte principal. Comme le grec transmet une maxime sensiblement différente plutôt qu’une simple variation stylistique, sa lecture est signalée en note afin de préserver l’histoire textuelle sans la substituer silencieusement à l’hébreu.
translation_notes:
  register: Français international moderne, concis et proverbial. La répétition de « répugne à » reproduit le parallélisme hébreu et sa forte expression d’aversion. Le singulier générique « le pauvre / le riche » suit la forme du texte source.
