base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/017.yaml
  text: What peace can there be between a hyena and a dog? What peace can there be between a rich man and a poor man?[a]
translation:
  language: fr
  text: Quelle paix peut-il y avoir entre une hyène et un chien ? Quelle paix peut-il y avoir entre un riche et un pauvre ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente une forme différente : « Qu’y a-t-il de commun entre un loup et un agneau ? De même, entre un pécheur et un homme pieux. » Le témoin hébreu porte plutôt « hyène ... chien » et « riche ... pauvre ».'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאַיִן
  choice: Quelle ... peut-il y avoir
  rationale: L’expression introduit une question rhétorique qui nie en pratique la possibilité d’une relation paisible ; cette tournure française en restitue naturellement la force.
- source_word: שָׁלוֹם
  choice: paix
  rationale: Le mot désigne ici des rapports paisibles ou l’harmonie ; « paix » demeure l’équivalent le plus direct et préserve la répétition du texte hébreu.
- source_word: צָבוּעַ
  choice: hyène
  rationale: En hébreu postbiblique, notamment dans le Siracide, le terme désigne couramment la hyène. Le grec présente une autre image, signalée en note sans supplanter le témoin hébreu conservé.
- source_word: כָּלֶב
  choice: chien
  rationale: Équivalent lexical direct.
- source_word: עָשִׁיר
  choice: un riche
  rationale: Le substantif masculin singulier désigne un homme riche. En français courant, « un riche » préserve le contraste proverbial sans alourdir la phrase.
- source_word: רָשׁ
  choice: un pauvre
  rationale: Le terme désigne une personne pauvre ou démunie. « Un pauvre » conserve le masculin singulier et le parallélisme social avec « un riche ».
theological_decisions:
- issue: Divergence entre le témoin hébreu conservé et le parallèle grec
  choice: Le texte principal suit l’image hébraïque (« hyène ... chien ») et l’opposition sociale (« riche ... pauvre »).
  alternative: 'Le grec porte : « Qu’y a-t-il de commun entre un loup et un agneau ? De même, entre un pécheur et un homme pieux. »'
  rationale: Le témoin hébreu existant est prioritaire pour le texte principal. La forme grecque transmet toutefois une variante substantielle, tant dans l’image animale que dans le contraste moral ; elle est donc conservée en note afin de ne pas effacer cette tension textuelle et interprétative.
translation_notes:
  register: Français moderne, international et digne. La répétition de « Quelle paix peut-il y avoir » reproduit le parallélisme rhétorique de l’hébreu. Les substantifs « un riche » et « un pauvre » sont naturels dans un proverbe et évitent la lourdeur de « un homme riche ... un homme pauvre ».
