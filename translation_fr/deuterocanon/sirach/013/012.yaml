  source_fidelity: La première expression hébraïque יִתֵּן כֹּשֶׁל évoque directement le fait de causer une chute ou un trébuchement. « Tendra un piège » est une interprétation plausible, mais elle introduit plus explicitement l’image d’un piège que ne le fait le texte. « Provoquera une chute » reste proche de l’image hébraïque tout en étant naturel. La seconde moitié conserve l’hostilité de עַל et l’intensification de קוֹשֵׂר קָשֶׁר.
  naturalness: Le français révisé est moderne, sobre et proverbial. « N’épargnera pas » est plus directement fidèle à חמל que « sera sans pitié », tout en restant fluide. « Ourdira un complot » est idiomatique et la note explicite la répétition emphatique de la racine hébraïque.
  terminology: « Homme cruel », « provoquer une chute », « n’épargner pas » et « ourdir un complot » rendent sans surcharge doctrinale les termes hébreux. La note grecque est ajustée pour rendre δεσμῶν par « chaînes », plutôt que « liens », qui est ambigu en français moderne.
