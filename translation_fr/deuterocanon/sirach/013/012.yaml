translation_notes:
  register: Français international moderne, digne et proverbial. Le futur hébreu est conservé. « Tendra un piège » privilégie une équivalence naturelle pour l’expression hébraïque obscure, tandis que les notes rendent visibles la variante grecque et la répétition emphatique finale.
