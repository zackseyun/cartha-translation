  text: A cruel man will give a stumbling block and will not spare[b][a]; against the life of many he plots a plot.
translation:
  language: fr
  text: L’homme cruel provoquera une chute et n’épargnera pas ; contre la vie de beaucoup, il ourdira un complot.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente ici une formulation sensiblement différente : « Est impitoyable celui qui ne tient pas parole, et il n’épargnera certainement pas lorsqu’il s’agira de mauvais traitements et de chaînes. » La traduction principale suit le texte hébreu conservé.'
    reason: textual_variant
  - marker: b
    text: 'Littéralement, la fin du texte hébreu dit : « contre la vie de beaucoup, il complote un complot » ; la répétition de la même racine renforce l’idée de complot.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַכְזָרִי
  choice: l’homme cruel
  rationale: L’adjectif substantivé désigne une personne cruelle ou impitoyable. Le singulier générique est conservé.
- source_word: יִתֵּן כֹּשֶׂל
  choice: tendra un piège
  rationale: L’expression hébraïque, littéralement proche de « donnera [une cause de] chute », est concise et difficile. « Tendra un piège » exprime naturellement en français l’action nuisible qui fait trébucher, sans suivre la formulation divergente du grec.
- source_word: וְלֹא יַחְמוֹל
  choice: et sera sans pitié
  rationale: חמל signifie épargner ou avoir compassion. Cette formulation française conserve l’absence de compassion et s’accorde avec le caractère proverbial du propos.
- source_word: עַל נֶפֶשׁ רַבִּים
  choice: contre la vie de beaucoup
  rationale: נפש désigne ici la vie, non une « âme » au sens doctrinal. Le singulier hébreu est maintenu devant רַבִּים, et עַל reçoit son sens hostile « contre ».
- source_word: קוֹשֵׂר קָשֶר
  choice: il complote
  rationale: La construction à racine répétée intensifie l’idée de complot. Le français ne peut reproduire naturellement « complote un complot » ; le verbe seul en restitue le sens, tandis qu’une note signale l’emphase hébraïque.
