base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/003.yaml
  text: If a rich man does wrong[a], he acts arrogantly; but if a poor man does wrong, he himself pleads for mercy.
translation:
  language: fr
  text: Si un riche commet une injustice[a], il se montre arrogant ; mais si un pauvre commet une injustice, lui, il implore grâce.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente ici un autre proverbe : « Quel rapport peut-il y avoir entre une marmite en terre cuite et un chaudron ? Elle le heurte et se brise. »'
    reason: alternative_reading
lexical_decisions:
- source_word: עָשִׁיר
  choice: un riche
  rationale: Rend directement le substantif hébreu et maintient le contraste social avec דַּל.
- source_word: יְעַוֶּה
  choice: commet une injustice
  rationale: Le verbe exprime ici l’action de faire le mal ou d’agir injustement ; cette formulation française est naturelle et conserve la dimension morale.
- source_word: יִתְנַוֶּה
  choice: se montre arrogant
  rationale: Le contexte oppose l’assurance hautaine du riche à la supplication du pauvre. La forme rare paraît désigner une attitude arrogante, sans qu’il soit nécessaire de la durcir en « se montre provocant ».
- source_word: דַּל
  choice: un pauvre
  rationale: Traduction directe du terme désignant une personne démunie ou de faible condition.
- source_word: יִתְחַנָּן
  choice: implore grâce
  rationale: La forme réfléchie/intensive exprime une supplication pour obtenir faveur ou pitié ; « implorer grâce » est idiomatique et digne.
- source_word: הוּא
  choice: lui-même
  rationale: Conserve dans les deux membres l’insistance explicite du pronom hébreu.
theological_decisions:
- issue: Divergence majeure entre le témoin hébreu et le grec
  choice: Traduire dans le texte principal le proverbe hébreu sur le riche et le pauvre.
  alternative: « Quel rapport peut-il y avoir entre une marmite de terre et un chaudron ? L’une le heurte, et l’autre se brise. »
  rationale: Le texte hébreu fourni est explicite, cohérent et signalé avec une confiance élevée. La règle de priorité à la langue originale conduit à le suivre ici. Le grec transmet un proverbe entièrement différent ; cette divergence doit être signalée en note plutôt que résolue par une harmonisation ou par la substitution silencieuse du grec.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme du texte hébreu est conservé, ainsi que l’insistance de « lui-même » dans chaque proposition. « Riche » et « pauvre » sont employés comme substantifs, conformément à l’usage courant.
