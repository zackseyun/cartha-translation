    issue: Ambiguïté référentielle de « son visage »
    rationale: En français, le possessif masculin « son » peut se rattacher grammaticalement au nom sujet « le cœur ». Le datif « lui change le visage » identifie nettement l’être humain comme porteur du visage tout en restant fidèle à l’hébreu.
  - severity: low
    issue: Formulation de la note grecque à préciser
    rationale: Le grec fait plus directement du visage joyeux le signe ou la trace d’un cœur « dans les bonnes choses ». La note révisée conserve son caractère prudent et descriptif, tout en exprimant plus exactement ce rapport.
