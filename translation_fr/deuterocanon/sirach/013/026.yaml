  text: A man's heart changes his face, whether for good or for bad.
translation:
  language: fr
  text: Le cœur d’un être humain lui change le visage, en bien comme en mal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle diffère sensiblement : il présente un visage joyeux comme le signe d’un cœur au milieu de bonnes choses, puis ajoute une proposition difficile concernant la découverte de paraboles au prix d’un travail pénible. Le texte principal suit l’hébreu, conservé ici et prioritaire pour ce verset ; le grec confirme le lien général entre la disposition intérieure et l’expression du visage, mais non la formulation exacte.'
    reason: textual_variant
lexical_decisions:
- source_word: לֵב
  choice: cœur
  rationale: Dans la littérature sapientielle hébraïque, le cœur désigne la vie intérieure, notamment la pensée et les dispositions. « Cœur » conserve ici l’image concrète qui oppose l’intérieur au visage visible.
- source_word: אֱנוֹשׁ
  choice: être humain
  rationale: Le nom désigne ici l’être humain dans sa condition commune. Cette formulation moderne garde la portée générique du singulier hébreu sans la limiter au sexe masculin.
- source_word: יְשַׁנֵּא
  choice: change
  rationale: Le verbe signifie « changer, modifier ». « Change » rend directement l’effet de la disposition intérieure sur le visage sans préciser davantage la nature de cette transformation.
- source_word: פָנָיו
  choice: son visage
  rationale: La formulation littérale et concrète convient au propos du proverbe, qui relie l’état intérieur à son expression extérieure.
- source_word: אִם לְטוֹב וְאִם לְרָע
  choice: en bien comme en mal
  rationale: Cette tournure française naturelle conserve l’opposition entre les deux effets possibles. « Mal » exprime ici le pôle négatif sans imposer nécessairement une qualification morale plus forte.
