translation_notes:
  register: Français international moderne, sobre et proverbial. La formulation reste proche de la structure hébraïque tout en employant « être humain » pour rendre la portée générique de אֱנוֹשׁ. Le marqueur de note suit la phrase entière, puisque la variante grecque concerne l’ensemble du verset.
