review_pass:
  verdict: revise
  source_fidelity: 'Le texte principal rend fidèlement l’hébreu : « cœur », « être humain », « change », « visage » et l’opposition « bien / mal » correspondent au verset. Une légère retouche rend toutefois le lien possessif plus clair en français, où « son visage » peut formellement renvoyer à « cœur ».'
  naturalness: « En bien comme en mal » est naturel et proverbial. « Lui change le visage » est plus idiomatique et évite l’ambiguïté grammaticale de « le cœur … change son visage », sans ajouter d’interprétation.
  terminology: « Cœur » préserve l’anthropologie imagée du texte hébreu. « Être humain » rend correctement la portée générique de אֱנוֹשׁ dans un français international moderne. « Mal » convient à רָע sans renforcer indûment le sens moral. La note décrit adéquatement l’écart majeur du grec, avec une formulation légèrement précisée sur le « signe » d’un cœur.
  issues:
