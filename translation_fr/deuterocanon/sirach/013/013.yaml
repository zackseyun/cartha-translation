translation:
  language: fr
  text: Tiens-toi sur tes gardes et sois prudent ; ne fréquente pas les hommes violents[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « car tu marches avec ta chute », ou « avec ta ruine ». Le témoin hébreu dit plutôt : « ne fréquente pas les hommes violents ».'
    reason: textual_variant
lexical_decisions:
- source_word: הִשָּׁמֵר
  choice: Tiens-toi sur tes gardes
  rationale: L’impératif nifal de שמר exprime l’idée de se garder soi-même et de rester vigilant. Cette tournure française naturelle conserve la force réflexive de l’avertissement.
- source_word: וֶהְיֵה זָהִיר
  choice: et sois très prudent
  rationale: זָהִיר désigne la prudence et la vigilance. « Sois prudent » traduit directement l’hébreu ; « très » reflète l’insistance attestée par le parallèle grec πρόσεχε σφοδρῶς, sans modifier le sens fondamental.
- source_word: וְאַל תִּתְהַלֵּךְ
  choice: ne fréquente pas
  rationale: Le hitpael de הלך peut signifier marcher ou aller çà et là ; avec עִם et des personnes, il évoque aussi la conduite habituelle et la fréquentation. En français moderne, « fréquenter » rend clairement l’avertissement contre leur compagnie.
- source_word: עִם
  choice: avec, exprimé par la construction « fréquenter »
  rationale: La préposition marque ici l’accompagnement ou l’association. Son sens est intégré naturellement au verbe français transitif « fréquenter ».
- source_word: אַנְשֵׁי חָמָס
  choice: les hommes violents
  rationale: חָמָס désigne la violence, le tort ou l’injustice brutale. « Hommes violents » reste concret et reproduit le masculin explicite אַנְשֵׁי.
theological_decisions:
- issue: Divergence entre les témoins hébreu et grec dans le second membre
  choice: 'Suivre l’hébreu conservé : « ne fréquente pas les hommes violents »'
  alternative: 'Grec : « car tu marches avec ta chute » ou « avec ta ruine »'
  rationale: Le témoin hébreu, source principale lorsqu’il est conservé, offre ici une exhortation sapientielle cohérente. La variante grecque, substantiellement différente, est signalée en note plutôt que substituée au texte hébreu. Son adverbe σφοδρῶς peut toutefois éclairer l’intensité du premier membre.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le point-virgule distingue les deux injonctions liées. « Fréquenter » privilégie le sens relationnel naturel en contexte sapientiel, tout en évitant une formulation française artificielle comme « marcher avec des hommes violents ».
