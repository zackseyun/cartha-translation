base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/007.yaml
  text: As long as you are useful[a], he will make sport of you; two or three times he will flatter you. Then he will look at you as if to pass beyond you[b], and he will shake his head at you.
translation:
  language: fr
  text: Tant que tu lui seras utile, il se jouera de toi[a] ; deux ou trois fois, il t’intimidera. Puis, à ta vue, il s’emportera contre toi[b], et il secouera la tête à ton égard.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut évoquer le fait de se moquer de quelqu’un, de le traiter avec désinvolture ou de jouer avec lui.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu de cette proposition est difficile, mais le verbe peut signifier « s’irriter contre ». Le témoin grec présente une formulation plus développée : après s’être servi de toi, il te verra puis te laissera. La traduction suit ici le sens le plus probable de l’hébreu.'
    reason: textual_variant
lexical_decisions:
- source_word: עַד אֲשֶׁר תּוֹעִיל
  choice: Tant que tu lui seras utile
  rationale: La proposition exprime une durée conditionnée par l’utilité de la personne interpellée. L’ajout explicite de « lui » rend en français le rapport intéressé que confirme le grec χρείαν ἔσχηκέν σου.
- source_word: יְהָתֵל בָּךְ
  choice: il se jouera de toi
  rationale: Cette tournure française conserve les nuances de manipulation, de désinvolture et de dérision portées par התל, sans réduire le sens à la seule tromperie ou à la moquerie ouverte.
- source_word: פַעֲמַיִם שָׁלֹשׁ
  choice: deux ou trois fois
  rationale: Rend directement et naturellement l’expression numérique hébraïque, qui évoque une faveur répétée mais limitée.
- source_word: יַעֲרִיצֶךָ
  choice: il te couvrira d’éloges
  rationale: Dans ce contexte intéressé, le verbe désigne une valorisation appuyée et probablement insincère. Cette expression garde l’idée d’exaltation sans faire croire à un honneur véritable.
- source_word: וּבְכֵן
  choice: Puis
  rationale: Marque naturellement le passage des attentions intéressées au rejet.
- source_word: יִרְאֲךָ לְהִתְעַבֵּר בָּךְ
  choice: il te regardera comme pour passer son chemin
  rationale: L’hébreu est difficile, mais עבר suggère l’idée de passer ou de poursuivre son chemin. Le grec, « il te verra et te laissera », confirme une scène d’abandon dédaigneux. La formulation française préserve l’image sans en forcer l’interprétation.
- source_word: וּבְרֹאשׁוֹ יָנִיעַ אֵלֶיךָ
  choice: il secouera la tête à ton sujet
  rationale: Le geste exprime vraisemblablement le mépris ou la désapprobation. « À ton sujet » rend la direction du geste sans suggérer nécessairement une proximité physique.
