translation_notes:
  register: Français international moderne, au tutoiement conformément à l’adresse hébraïque singulière. Le ton reste proverbial et digne. « Se jouer de toi » et « passer son chemin » sont courants et intelligibles, tandis que les notes préservent l’incertitude lexicale et textuelle.
