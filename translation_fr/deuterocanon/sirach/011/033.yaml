  text: Before death, do not call a man blessed, for in his end a man is made known.
translation:
  language: fr
  text: Avant la mort, ne déclare pas un homme heureux[a], car c’est à sa fin qu’un homme se révèle.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « ne déclare pas un homme bienheureux » ou « ne le tiens pas pour heureux ».'
    reason: alternative lexicale pour אַל תְּאַשֶּׁר
  - marker: b
    text: 'Le texte grec est très différent : « Méfie-toi du malfaiteur, car il trame le mal, de peur qu’il ne te couvre pour toujours d’opprobre. » Il reflète probablement une autre forme du texte ; la traduction suit ici l’hébreu.'
    reason: variante textuelle grecque
lexical_decisions:
- source_word: לִפְנֵי מָוֶת
  choice: Avant la mort
  rationale: Rend directement la locution temporelle hébraïque et conserve la concision proverbiale.
- source_word: אַל תְּאַשֶּׁר
  choice: ne proclame pas … heureux
  rationale: Le verbe אשר désigne ici le fait de déclarer quelqu’un heureux ou digne d’être félicité. « Proclamer heureux » est naturel en français biblique moderne sans imposer le sens religieux plus étroit que pourrait prendre « bienheureux ».
- source_word: גָּבֶר
  choice: un homme
  rationale: Conserve le masculin singulier représentatif du texte hébreu et son parallélisme avec אִישׁ.
- source_word: כִּי
  choice: car
  rationale: Introduit brièvement la raison de l’interdiction, conformément au style proverbial.
- source_word: בְּאַחֲרִיתוֹ
  choice: à sa fin
  rationale: Préserve la concision et l’ambivalence de אַחֲרִית entre fin de vie et issue finale.
- source_word: יִנָּכֵר
  choice: se révèle
  rationale: Exprime naturellement en français qu’à la fin l’identité, le caractère ou la condition véritable de l’homme devient manifeste, sans préciser lequel de ces aspects est visé.
- source_word: אִישׁ
  choice: un homme
  rationale: Maintient le masculin générique et la reprise parallèle de la première proposition.
theological_decisions:
- issue: Masculin générique dans le style sapientiel hébreu
  choice: Conserver « un homme » dans les deux propositions
  alternative: Employer « une personne » ou « quelqu’un »
  rationale: גָּבֶר et אִישׁ sont tous deux masculins singuliers et ont ici une portée représentative. Leur maintien respecte la forme et le parallélisme hébreux sans limiter nécessairement la maxime aux hommes.
- issue: Portée de la proposition finale
  choice: « c’est à sa fin qu’un homme se révèle »
  alternative: « à la fin de sa vie, on reconnaît un homme » ou « dans son issue, un homme devient manifeste »
  rationale: Cette formulation conserve la tension entre la manifestation du caractère d’une personne et l’évaluation de son sort final, sans trancher au-delà de l’hébreu.
- issue: Divergence du témoin grec
  choice: Suivre le texte hébreu et signaler le grec en note
  alternative: Traduire la leçon grecque concernant la méfiance envers le malfaiteur
  rationale: Le grec présente un texte entièrement différent, vraisemblablement issu d’une autre forme textuelle. Puisque l’hébreu est ici disponible avec une confiance élevée, il demeure le témoin principal.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Proclamer heureux » conserve la valeur déclarative du verbe hébreu ; la tournure clivée « c’est à sa fin que » donne une formulation française naturelle tout en soulignant que le jugement ne devient possible qu’au terme de la vie.
