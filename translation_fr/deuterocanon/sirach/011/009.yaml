  text: My son[a], do not answer a matter before you hear it, and do not speak in the midst of conversation.
translation:
  language: fr
  text: Mon fils[a], ne réponds pas avant d’avoir entendu, et ne parle pas au milieu d’une conversation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Ne te querelle pas au sujet d’une affaire dont tu n’as pas besoin, et ne siège pas en jugement avec des pécheurs. » Les témoins hébreu et grec diffèrent considérablement ici. Le texte principal suit l’hébreu conservé ; le grec représente une autre tradition textuelle.'
    reason: textual_variant
lexical_decisions:
- source_word: בְּנִי
  choice: Mon fils
  rationale: Le vocatif masculin singulier désigne le disciple comme un fils; cette forme directe et traditionnelle reste naturelle en français.
- source_word: אַל תָּשִׁיב דָּבָר טֶרֶם תִּשְׁמָע
  choice: ne réponds pas avant d’avoir écouté
  rationale: השיב signifie « répondre, répliquer »; דבר peut désigner une parole ou une affaire, mais son complément peut rester implicite en français. L’accompli « avoir écouté » exprime naturellement l’écoute préalable exigée par טֶרֶם.
- source_word: וּבְתוֹךְ שִׂיחָה
  choice: au milieu d’une conversation
  rationale: שיחה désigne la parole, l’entretien ou la conversation. La traduction n’ajoute pas « de quelqu’un d’autre », absent de l’hébreu.
- source_word: אַל תְּדַבֵּר
  choice: ne parle pas
  rationale: Traduction directe du verbe ordinaire דבר, adaptée au parallélisme de l’instruction.
- source_word: περὶ πράγματος οὗ οὐκ ἔστιν σοι χρεία μὴ ἔριζε, καὶ ἐν κρίσει ἁμαρτωλῶν μὴ σύνεδρευε
  choice: non retenu dans le texte principal
  rationale: Le grec présente ici une leçon substantiellement différente. Puisque le témoin hébreu est conservé et jugé fiable, il fonde le texte principal; la tradition grecque est signalée en note.
