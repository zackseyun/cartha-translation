  text: Do not say[a], “I have enough before me; what disaster will come upon me?”
translation:
  language: fr
  text: 'Ne dis pas[a] : « J’ai assez à ma disposition ; quel malheur m’arrivera ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Ne fais pas entrer tout le monde dans ta maison, car les embûches du trompeur sont nombreuses. » Il présente ici une forme du verset très différente.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Ne dis pas
  rationale: Rend directement l’impératif négatif du verbe אמר, sans lui substituer l’idée plus interprétative de penser.
- source_word: דַּיִּי לְפָנַי
  choice: J’ai suffisamment de biens devant moi
  rationale: דַּיִּי exprime la suffisance et לְפָנַי signifie littéralement « devant moi ». L’ajout de « biens » explicite naturellement en français ce qui se trouve à la disposition du locuteur, tout en conservant l’image spatiale hébraïque.
- source_word: מַה אָסוֹן
  choice: quel malheur
  rationale: אָסוֹן désigne un mal grave ou une calamité. « Malheur » convient à la question rhétorique et demeure naturel en français moderne.
- source_word: יְהִי עָלָי
  choice: pourrait m’arriver
  rationale: Littéralement « sera sur moi ». Dans cette question rhétorique marquant une assurance présomptueuse, le conditionnel « pourrait » rend idiomatiquement le sens sans prétendre que le locuteur annonce réellement l’avenir.
- source_word: Μὴ πάντα ἄνθρωπον εἴσαγε εἰς τὸν οἶκόν σου· πολλὰ γὰρ τὰ ἔνεδρα τοῦ δολίου
  choice: non retenu dans le texte principal
  rationale: Le grec présente une forme textuelle profondément différente. Puisque le texte hébreu est conservé ici avec une forte confiance, il régit le texte principal ; la forme grecque est signalée en note.
theological_decisions:
- issue: Divergence majeure entre les formes hébraïque et grecque de Siracide 11.29
  choice: Suivre l’hébreu dans le texte principal et donner le grec en note.
  alternative: 'Adopter comme texte principal la forme grecque : « Ne fais pas entrer n’importe qui dans ta maison, car l’homme trompeur tend de nombreux pièges. »'
  rationale: Le témoin hébreu est disponible et jugé sûr, tandis que le grec ne constitue pas une simple variante verbale, mais une autre forme du verset. Les fusionner masquerait la situation textuelle.
translation_notes:
  register: Français international moderne, clair et digne. La question finale garde le ton d’assurance présomptueuse du texte hébreu. « Biens » explicite sobrement la suffisance matérielle sous-entendue par le contexte.
