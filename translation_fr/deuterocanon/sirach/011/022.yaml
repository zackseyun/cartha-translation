translation:
  language: fr
  text: 'Et quand il dira : « J’ai trouvé le repos ; maintenant, je profiterai de mes biens[a] »,[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je mangerai de mes bonnes choses » ou « de mes biens ».'
    reason: clarification
  - marker: b
    text: 'Le texte grec diffère sensiblement : « La bénédiction du Seigneur est dans la récompense de l’homme pieux, et sa bénédiction fleurit rapidement. » L’hébreu et le grec semblent représenter ici des formes différentes du texte.'
    reason: textual_variant
lexical_decisions:
- source_word: וּבְעֵת יֹאמַר
  choice: Et quand il dira
  rationale: La tournure introduit le moment où l’homme tient ce propos. Le futur français rend naturellement le yiqtol יֹאמַר sans alourdir la phrase par un littéral « au moment où ».
- source_word: מָצָאתִי נַחַת
  choice: J’ai trouvé le repos
  rationale: Le parfait מָצָאתִי présente l’état comme désormais acquis, et נַחַת désigne le repos, l’aisance ou la tranquillité. « Le repos » reste proche de l’hébreu sans préciser indûment la nature de cette sécurité.
- source_word: וְעַתָּה
  choice: maintenant
  rationale: Ce terme marque directement la situation nouvelle que le locuteur croit pouvoir apprécier après avoir trouvé le repos.
- source_word: אֹכַל מִטּוֹבָתִי
  choice: je profiterai de mes biens
  rationale: Les formes hébraïques sont à la première personne et prolongent naturellement le discours direct. אכל מן signifie littéralement « manger de », mais peut exprimer le fait de jouir de ce que l’on possède ; « profiter de mes biens » transmet ce sens en français courant tout en signalant le littéral en note.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. Le discours direct est maintenu jusqu’à la fin, conformément aux formes hébraïques à la première personne. L’expression idiomatique « profiter de mes biens » évite en français l’étrangeté de « manger de mes biens », dont le sens littéral reste documenté en note.
