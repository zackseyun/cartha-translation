revisions:
- from: Beaucoup de ceux qui avaient été élevés ont été profondément humiliés et abaissés ensemble ; même des personnes honorées ont été livrées au pouvoir d’autrui.[a]
  to: Beaucoup de gens haut placés ont été fort méprisés et abaissés ensemble ; même des personnes honorées ont été livrées au pouvoir d’autrui.[a]
  rationale: La révision distingue le mépris intense (נִקְלוּ מְאֹד) de l’abaissement (וְהִשְׁפִּלוּ), évitant une redondance française et conservant le mouvement du dicton. Elle garde « ensemble », qui ne tranche pas davantage la nuance collective ou simultanée de יַחַד, ainsi que la note indispensable sur la lecture grecque divergente.
