  text: Many who were exalted have been greatly disgraced[a], and brought low together; even the honored have been given into another's hand.
translation:
  language: fr
  text: Beaucoup de gens haut placés ont été fort méprisés et abaissés ensemble ; même des personnes honorées ont été livrées au pouvoir d’autrui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente ici un texte sensiblement différent : « Avant d’avoir examiné, ne blâme pas ; comprends d’abord, puis reprends. » La traduction suit le témoin hébreu conservé.'
    reason: alternative_reading
lexical_decisions:
- source_word: רַבִּים נִשָּׂאִים
  choice: Beaucoup de ceux qui avaient été élevés
  rationale: Le participe passif désigne ici une élévation de rang ou de condition. Le plus-que-parfait français rend naturellement l’antériorité de cette position par rapport au renversement décrit.
- source_word: נִקְלוּ מְאֹד
  choice: ont été profondément humiliés
  rationale: Le verbe exprime le fait d’être déconsidéré ou traité comme sans importance. « Profondément humiliés » restitue le renversement social et l’intensité de מְאֹד sans suggérer seulement une émotion intérieure.
- source_word: וְהִשְׁפִּלוּ יַחַד
  choice: et abaissés ensemble
  rationale: La forme hébraïque est resserrée, mais évoque clairement l’abaissement. Cette formulation conserve le parallélisme ainsi que יַחַד, sans préciser indûment si l’action est collective ou simultanée.
- source_word: וְגַם נִכְבָּדִים
  choice: même des personnes honorées
  rationale: « Même » rend la force intensive de וְגַם. « Des personnes honorées » exprime le statut social lié à כבד sans le limiter à la noblesse héréditaire.
- source_word: נִתְּנוּ בְיָד
  choice: ont été livrées au pouvoir d’autrui
  rationale: L’expression « être donné dans la main » signifie être livré à la domination ou au contrôle de quelqu’un. Le français idiomatique explicite ce sens sans ajouter l’identité du détenteur.
theological_decisions:
- issue: Divergence substantielle entre le témoin hébreu et le parallèle grec
  choice: Traduire le texte hébreu conservé, qui décrit le renversement de personnes élevées et honorées.
  alternative: 'Suivre le grec : « Avant d’avoir examiné, ne blâme pas ; comprends d’abord, puis reprends. »'
  rationale: Le texte hébreu est extant et bénéficie donc de la priorité comme source originale selon la politique du projet. Le grec témoigne ici d’une autre forme textuelle et doit être signalé plutôt que substitué silencieusement à l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme antithétique du dicton est conservé. « Au pouvoir d’autrui » traduit clairement l’idiome hébreu sans calque maladroit, tandis que « ensemble » maintient l’ambiguïté de יַחַד.
