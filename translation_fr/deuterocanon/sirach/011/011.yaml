  text: There is[a] one who labors and toils and hurries, yet all the more he comes up short.
translation:
  language: fr
  text: Il y a quelqu’un qui peine, s’épuise et se hâte, et qui se trouve pourtant d’autant plus démuni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La ligne hébraïque fournie, issue des manuscrits de la Guéniza du Caire, ne correspond pas au parallèle grec de ce verset ; la traduction suit donc ici le témoin grec. L’hébreu fourni signifie approximativement : « Mon fils, pourquoi multiplies-tu ton oppression ? […] il ne restera pas impuni. »'
    reason: textual_variant
lexical_decisions:
- source_word: ἔστιν
  choice: Il y a
  rationale: Cette tournure existentielle introduit naturellement en français un type de personne.
- source_word: κοπιῶν
  choice: qui peine
  rationale: Le verbe exprime un travail éprouvant; « peine » reste naturel tout en préparant l’accumulation des termes d’effort.
- source_word: πονῶν
  choice: se fatigue
  rationale: Ce choix distingue le terme de κοπιῶν et rend l’idée d’effort pénible ou d’épuisement.
- source_word: σπεύδων
  choice: se hâte
  rationale: Dans cette série d’efforts croissants, le sens de hâte convient mieux que celui d’empressement.
- source_word: τόσῳ μᾶλλον
  choice: que davantage
  rationale: Avec « n’en manque », cette formulation française exprime l’intensification paradoxale indiquée par le comparatif grec.
- source_word: ὑστερεῖται
  choice: n’en manque
  rationale: Le verbe indique une insuffisance ou un manque sans préciser son domaine; cette traduction conserve cette ouverture sémantique.
theological_decisions:
- issue: Divergence entre la ligne hébraïque fournie et le parallèle grec de Siracide 11.11
  choice: Suivre dans le texte principal le témoin grec cohérent pour ce verset et signaler la divergence en note.
  alternative: « Mon fils, pourquoi multiplies-tu ton oppression ? Celui qui l’accroît ne restera pas impuni. »
  rationale: La ligne hébraïque fournie ne correspond pas au contenu transmis par le grec pour Siracide 11.11 et paraît déplacée ou textuellement problématique. Le grec fournit ici une lecture complète et cohérente; la note rend néanmoins compte avec transparence du témoin hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. L’accumulation « peine, se fatigue et se hâte » conserve les trois participes grecs, tandis que la conclusion laisse indéterminée la nature exacte du manque.
