  text: Before you investigate[a], do not find fault; examine first[b], and afterward rebuke.
translation:
  language: fr
  text: Avant d’avoir enquêté, ne juge pas hâtivement[a] ; vérifie d’abord, puis réprimande[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu signifie plus littéralement « tordre », « fausser » ou « pervertir ». « Ne juge pas hâtivement » en rend ici la portée probable, sans préciser l’objet sous-entendu.
    reason: lexical_alternative
  - marker: b
    text: 'La fin du texte hébreu est difficile. Le texte grec présente une autre formulation : « Avant d’avoir écouté, ne réponds pas, et n’interviens pas au milieu d’un discours. »'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטֶרֶם תַּחְקוֹר
  choice: Avant d’avoir enquêté
  rationale: חקר désigne une recherche ou un examen approfondi. Cette formulation temporelle rend naturellement l’idée qu’il faut établir les faits avant de réagir.
- source_word: אַל תְּסַלֵּף
  choice: ne déforme pas les faits
  rationale: סלף signifie littéralement « tordre, fausser, pervertir ». L’ajout idiomatique de « les faits » explicite en français l’objet sous-entendu sans réduire le verbe à la seule idée de critiquer ou de condamner.
- source_word: בַּקֵּר לְפָנִים
  choice: examine d’abord
  rationale: בקר appelle ici à vérifier ou examiner, et לְפָנִים indique l’antériorité dans la séquence. « Examine d’abord » est bref et naturel.
- source_word: וְאַחַר תַּזִּיף
  choice: puis réprimande
  rationale: 'La forme תַּזִּיף est difficile et son sens demeure incertain. « Réprimande » conserve le mouvement probable du texte hébreu : vérifier d’abord, puis seulement formuler un reproche.'
