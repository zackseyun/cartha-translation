  source_fidelity: La première proposition rend correctement בטרם תחקר. Toutefois, « ne déforme pas les faits » introduit « les faits », absent de l’hébreu, et restreint indûment סלף à l’altération d’informations factuelles. Dans ce contexte sapientiel, « ne juge pas hâtivement » rend de façon idiomatique la force probable d’une mise en garde contre un jugement prématuré, tout en signalant en note le sens littéral plus large de סלף. « vérifie d’abord, puis réprimande » suit la séquence בקר לפנים ואחר תזיף, avec une note indispensable sur la difficulté de תזיף et sur le parallèle grec divergent.
  naturalness: La révision emploie un français international moderne, concis et sentencieux. « Vérifie d’abord » est plus naturel ici que « examine d’abord » après « avoir enquêté », tout en préservant la distinction fonctionnelle entre enquête et vérification.
  terminology: Aucun terme théologique n’est en jeu. « Réprimande » demeure une restitution prudente du dernier verbe hébreu incertain; la note explicite que le grec atteste plutôt une défense de répondre ou d’intervenir prématurément.
