translation:
  language: fr
  text: Bien des opprimés ont siégé sur un trône[a], et quelqu’un auquel on ne pensait pas a revêtu un turban[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente une formulation différente : « Beaucoup de puissants ont été profondément déshonorés, et des hommes illustres ont été livrés aux mains de leurs compagnons. » Les deux formes décrivent un renversement de condition.'
    reason: alternative_reading
  - marker: b
    text: 'Ou, plus librement : « une personne inattendue a reçu de grands honneurs ». L’hébreu dit littéralement qu’elle « ne montait pas au cœur », puis qu’elle « a revêtu un turban », image concrète d’une élévation soudaine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים נִדְכָּאִים
  choice: Beaucoup d’opprimés
  rationale: נִדְכָּאִים désigne ceux qui ont été écrasés, humiliés ou opprimés. « D’opprimés » conserve le sens passif et convient au renversement de condition décrit ici.
- source_word: יָשְׁבוּ עַל כִּסֵּא
  choice: se sont assis sur un trône
  rationale: La formulation garde l’image concrète du texte hébreu. Dans ce contexte, כִּסֵּא évoque le trône et donc l’accession au pouvoir ou à une position élevée.
- source_word: וּבַל עָלוּ עַל לֵב
  choice: et quelqu’un auquel on ne pensait pas
  rationale: L’expression signifie littéralement que la personne « ne montait pas au cœur », c’est-à-dire qu’elle ne venait pas à l’esprit et n’était pas envisagée. Le singulier français s’accorde naturellement avec le verbe suivant.
- source_word: עָטוּ צְנִיף
  choice: a mis un turban
  rationale: Le choix préserve l’image concrète d’une coiffure marquant la dignité ou une haute fonction, sans la réduire à l’idée abstraite de recevoir des honneurs.
theological_decisions:
- issue: Priorité du texte hébreu face à une formulation grecque sensiblement différente
  choice: Traduire le texte hébreu comme une double élévation inattendue, tout en signalant la variante grecque.
  alternative: 'Suivre le grec : « Beaucoup de puissants ont été profondément déshonorés, et des hommes illustres ont été livrés aux mains d’autres personnes. »'
  rationale: Le texte hébreu fourni est de haute confiance et constitue ici la source principale. Le grec présente une autre formulation, mais conserve le thème général du renversement de condition; il est donc signalé sans remplacer l’hébreu.
translation_notes:
  register: Français moderne, international et digne. La structure en deux propositions ainsi que les images concrètes du trône et du turban sont conservées; l’idiome hébreu du cœur est rendu naturellement sans effacer son sens.
