  text: Folly and darkness are reserved for transgressors[a], and evildoers have evil with them.
translation:
  language: fr
  text: La folie et les ténèbres sont réservées aux transgresseurs[a], et le mal est avec ceux qui font le mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle porte : « Lorsqu’il dit : “J’ai trouvé le repos, et maintenant je vais manger de mes biens”, il ne sait pas quel temps passera ; il les laissera à d’autres et mourra. » Le témoin hébreu diffère ici fortement de la tradition grecque.'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׂכְלוּת
  choice: la folie
  rationale: Le nom désigne la déraison ou une conduite insensée. « Folie » est naturel dans la littérature de sagesse et conserve sa portée morale.
- source_word: וְחֹשֶׁךְ
  choice: et les ténèbres
  rationale: Cette formulation préserve l’image hébraïque et ses possibles connotations morales ou funestes sans les expliciter indûment.
- source_word: לְפוֹשְׁעִים
  choice: aux rebelles
  rationale: Le terme issu de פשע évoque une transgression conçue comme rébellion. « Rebelles » en conserve mieux le caractère volontaire que le terme plus général « pécheurs ».
- source_word: נוֹצְרָה
  choice: sont réservées
  rationale: La forme exprime ici l’idée d’une chose gardée ou tenue en réserve. Le pluriel français s’accorde naturellement avec les deux éléments coordonnés.
- source_word: וּמְרֵעִים
  choice: ceux qui font le mal
  rationale: Cette tournure transparente conserve la force verbale du participe hébreu et reste naturelle en français moderne.
- source_word: רָעָה
  choice: le mal
  rationale: Le mot peut désigner le mal moral, le malheur ou le dommage. « Le mal » maintient cette ambiguïté et fait entendre la répétition avec « font le mal ».
- source_word: עִמָּם
  choice: avec eux
  rationale: La préposition signifie le plus naturellement « avec ». Le verbe « portent » rend idiomatiquement en français l’idée que le mal les accompagne, sans la réduire à une simple possession.
theological_decisions:
- issue: Divergence marquée entre le texte hébreu de la Guéniza du Caire et la tradition grecque
  choice: Traduire le témoin hébreu conservé dans le texte principal et signaler la lecture grecque en note.
  alternative: 'Suivre le grec : « Lorsqu’il dit : “J’ai trouvé le repos, et maintenant je vais manger de mes biens”, il ne sait pas combien de temps passera ; il les laissera à d’autres et mourra. »'
  rationale: Le texte hébreu disponible est le témoin original prioritaire ici. La différence grecque est trop importante pour être harmonisée silencieusement ; elle est donc conservée comme variante dans la note.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme et la concision du texte sapientiel hébreu sont conservés ; la répétition de « mal » maintient volontairement l’ambiguïté entre faute morale et malheur qui en résulte.
