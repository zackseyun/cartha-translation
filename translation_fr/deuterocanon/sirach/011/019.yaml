  terminology: « Folie », « ténèbres », « transgresseurs », « ceux qui font le mal » et « le mal » préservent le registre moral et la densité lexicale de l’hébreu. Le terme « transgresseurs » rend plus directement פשע que « rebelles », lequel pourrait évoquer avant tout une opposition politique ou sociale. La note signale adéquatement la divergence majeure du grec sans l’harmoniser avec l’hébreu.
