  source_fidelity: 'Le texte principal suit correctement le témoin hébreu : שִׂכְלוּת (« folie »), חֹשֶׁךְ (« ténèbres »), נוֹצְרָה (« sont réservées ») et la répétition volontaire de רע dans « font le mal / le mal ». Toutefois, « portent le mal avec eux » introduit le verbe « portent », absent de l’hébreu, et transforme la formule elliptique עִמָּם (« avec eux ») en une image plus interprétative. « Le mal est avec eux » conserve mieux la concision et l’ambiguïté du texte.'
