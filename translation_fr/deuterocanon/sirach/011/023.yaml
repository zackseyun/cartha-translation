  text: Do not say, "What do I need, and what good things will be mine from now on?"[a]
translation:
  language: fr
  text: 'Ne dis pas : « De quoi ai-je besoin, et quels biens seront à moi désormais ? »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin hébreu conservé diffère fortement : « Il ne savait pas ce qui allait arriver ensuite ; il les laissa à un autre et mourut », ou formulation semblable. Le texte principal suit ici le grec, dont l’exhortation s’accorde avec le contexte, car l’hébreu paraît textuellement décalé à cet endroit.'
    reason: textual_variant
lexical_decisions:
- source_word: μὴ εἴπῃς
  choice: Ne dis pas
  rationale: L’impératif grec exprime clairement une mise en garde et s’accorde avec le contexte exhortatif. Le témoin hébreu conservé porte לֹא יָדַע, « il ne savait pas », mais son texte paraît décalé ou altéré à cet endroit.
- source_word: Τίς ἐστίν μου χρεία
  choice: De quoi ai-je besoin
  rationale: Cette formulation française naturelle rend χρεία, « besoin, nécessité », tout en conservant la question rhétorique et son assurance présomptueuse.
- source_word: τίνα ... ἔσται μου τὰ ἀγαθά
  choice: quels biens seront à moi
  rationale: « Biens » rend le sens large de τὰ ἀγαθά, qui peut désigner de bonnes choses, des avantages ou des possessions, sans limiter explicitement le propos aux seules richesses matérielles.
- source_word: ἀπὸ τοῦ νῦν
  choice: désormais
  rationale: « Désormais » exprime avec concision et dans un registre actuel la perspective temporelle de « à partir de maintenant ».
theological_decisions:
- issue: Pondération des témoins lorsque l’hébreu conservé et le grec divergent fortement
  choice: Le texte principal suit l’exhortation grecque.
  alternative: « Il ne savait pas ce qui allait arriver ensuite ; il les laissa à un autre et mourut. »
  rationale: Bien que l’hébreu conservé soit normalement privilégié pour le Siracide, sa formulation paraît ici déplacée, altérée ou issue d’une autre ligne. Le grec offre un avertissement cohérent avec le contexte immédiat. La variante hébraïque est néanmoins conservée explicitement en note afin de ne pas masquer l’incertitude textuelle.
translation_notes:
  register: Français international moderne, clair et digne. La question rhétorique reste directe, tandis que « biens » préserve l’étendue sémantique du grec sans imposer une lecture exclusivement matérielle.
