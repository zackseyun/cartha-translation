  text: There is one who is poor and perishing as he walks[a], lacking everything, yet more than a poor man.
translation:
  language: fr
  text: Le bien et le mal, la vie et la mort, la pauvreté et la richesse viennent du Seigneur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La ligne hébraïque conservée dans le témoin principal présente un texte différent qui semble ne pas correspondre à ce verset. La traduction suit ici le texte grec parallèle : « Le bien et le mal, la vie et la mort, la pauvreté et la richesse viennent du Seigneur. »'
    reason: textual_variant
lexical_decisions:
- source_word: ἀγαθὰ καὶ κακά
  choice: le bien et le mal
  rationale: Cette formulation conserve l’antithèse générale du grec, sans réduire κακά à de simples malheurs ni expliciter une nuance morale que le contexte ne tranche pas.
- source_word: ζωὴ καὶ θάνατος
  choice: la vie et la mort
  rationale: Équivalents directs et naturels qui préservent la structure parallèle.
- source_word: πτωχεία καὶ πλοῦτος
  choice: la pauvreté et la richesse
  rationale: Ces termes rendent précisément l’opposition socioéconomique du grec dans un français actuel.
- source_word: παρὰ Κυρίου ἐστίν
  choice: viennent du Seigneur
  rationale: Le verbe « viennent » exprime naturellement l’idée de provenance portée par παρά, tandis que « du Seigneur » conserve l’attribution divine sans en préciser le mécanisme.
theological_decisions:
- issue: Le Seigneur comme source du bien et du mal
  choice: Conserver sans atténuation l’affirmation selon laquelle le bien et le mal viennent du Seigneur.
  alternative: Rendre κακά par « l’adversité » ou « les malheurs » afin d’exclure explicitement le mal moral.
  rationale: Le grec oppose directement ἀγαθὰ à κακά. La traduction préserve cette tension théologique et l’ambiguïté de « mal », sans ajouter que Dieu serait l’auteur du mal moral ni restreindre le terme aux seules circonstances pénibles.
translation_notes:
  register: Français international moderne, sobre et proverbial. Les trois couples antithétiques et leur rythme parallèle sont conservés. Le texte grec sert ici de base stable en raison du décalage signalé dans le témoin hébreu.
