  yaml_path: translation/deuterocanon/sirach/011/012.yaml
  text: My son[a], if you do not run, you will not attain; and if you do not seek, you will not find.
translation:
  language: fr
  text: Mon fils[a], si tu ne cours pas, tu ne parviendras pas ; et si tu ne cherches pas, tu ne trouveras pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin grec diffère considérablement ici : il parle plutôt d’une personne indolente, ayant besoin d’aide, manquant de force et très pauvre ; les yeux du Seigneur se sont posés sur elle pour son bien, et il l’a relevée de son humiliation. Le texte principal suit ici l’hébreu, tandis que le grec témoigne d’une importante autre tradition textuelle.'
    reason: textual_variant
lexical_decisions:
- source_word: בְּנִי
  choice: Mon fils
  rationale: Le vocatif porte un suffixe de première personne du singulier et désigne explicitement un fils. « Mon fils » conserve le cadre paternel de l’instruction sapientielle.
- source_word: תָּרוּץ
  choice: tu ne cours pas
  rationale: Le verbe רוץ signifie concrètement « courir ». Cette traduction préserve l’image proverbiale d’un effort énergique sans la réduire à une interprétation comme « s’efforcer ».
- source_word: תגִּיעַ
  choice: tu n’atteindras pas ton but
  rationale: Le verbe exprime l’idée d’atteindre ou de parvenir. L’ajout idiomatique de « ton but » rend en français le complément implicite sans préciser indûment la nature de ce qui doit être atteint.
- source_word: תְּבַקֵּשׁ
  choice: tu ne cherches pas
  rationale: בקש signifie couramment « chercher ». Ce choix conserve le parallélisme proverbial avec « trouver ».
- source_word: תִמְצָא
  choice: tu ne trouveras pas
  rationale: מצא signifie normalement « trouver » ; la formulation française reproduit directement le couple chercher/trouver.
theological_decisions:
- issue: Adresse filiale genrée dans l’enseignement de sagesse
  choice: Mon fils
  alternative: Mon enfant
  rationale: L’hébreu emploie explicitement un vocatif masculin singulier. La traduction conserve cette forme et le ton traditionnel de l’instruction sapientielle.
- issue: Choix du témoin principal face à la divergence grecque
  choice: Traduire directement le proverbe hébreu conservé
  alternative: Suivre le grec, qui décrit une personne sans vigueur et pauvre que le Seigneur relève
  rationale: L’hébreu disponible présente ici un texte cohérent et doit servir de témoin principal. La divergence substantielle du grec est signalée en note plutôt qu’harmonisée ou intégrée au texte.
translation_notes:
  register: Français moderne, clair et digne, avec tutoiement singulier conforme à l’adresse « Mon fils ». Le parallélisme et l’image concrète de la course sont conservés. « Ton but » explicite légèrement en français l’objet implicite d’« atteindre », sans lui attribuer un contenu théologique particulier.
