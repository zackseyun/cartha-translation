  text: There is one who labors and toils and rushes about[a], yet all the more he falls behind.
translation:
  language: fr
  text: Il y a quelqu’un qui travaille dur, se fatigue et court en tous sens ; pourtant, il prend d’autant plus de retard.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu peut aussi se traduire : « pourtant, il est retardé » ou « il reste en arrière ». Le texte grec de ce vers est très différent : « Il a relevé sa tête, et beaucoup se sont émerveillés à son sujet. » Il témoigne donc d’une autre tradition textuelle.'
    reason: textual_variant
lexical_decisions:
- source_word: יֵשׁ
  choice: Il y a quelqu’un qui
  rationale: L’ouverture existentielle présente un type de personne sans préciser son genre ; cette tournure est naturelle en français moderne.
- source_word: עָמֵל
  choice: travaille dur
  rationale: Rend l’idée d’un travail pénible et soutenu dans une langue courante, tout en évitant le registre plus littéraire de « peine ».
- source_word: וְיָגֵעַ
  choice: se fatigue
  rationale: Conserve l’intensification proche du premier terme et exprime explicitement l’épuisement causé par l’effort.
- source_word: וָרָץ
  choice: court en tous sens
  rationale: Le sens littéral est « court » ; l’ajout idiomatique « en tous sens » fait ressortir l’activité fébrile suggérée par le contexte sapientiel sans effacer l’image de la course.
- source_word: וּכְדֵי כֵן
  choice: pourtant… d’autant plus
  rationale: L’expression hébraïque est difficile. Cette formulation rend le contraste ironique ainsi qu’une possible valeur proportionnelle ou intensive, sans prétendre lever entièrement l’incertitude.
- source_word: הוּא מִתְאַחֵר
  choice: il prend… de retard
  rationale: Rend naturellement le sens de « être retardé, rester en arrière » et maintient le contraste avec l’empressement décrit auparavant.
