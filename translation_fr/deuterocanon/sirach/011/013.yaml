  source_fidelity: 'Le texte français rend fidèlement la séquence participiale hébraïque : effort soutenu (עָמֵל), fatigue/toil (וְיָגֵעַ), course fébrile (וָרָץ), puis le résultat paradoxal d’un retard accru (וּכְדֵי כֵן הוּא מִתְאַחֵר). « Court en tous sens » est légèrement explicatif, mais demeure une représentation idiomatique défendable de la course agitée dans ce contexte proverbial. La difficulté de כְּדֵי כֵן est correctement maintenue sans fausse précision.'
