review_pass:
  verdict: revise
  source_fidelity: 'Le texte hébreu présente la sagesse du pauvre comme sujet : elle « relève sa tête » et « le fait asseoir » parmi les nobles. Le projet transmet bien l’idée générale, mais « lui fait relever la tête » peut suggérer que le pauvre accomplit lui-même l’action, et « lui donne une place » explicite plus librement l’image de le faire asseoir.'
  naturalness: « La sagesse du pauvre lui relève la tête et le fait asseoir parmi les nobles » est naturel, concis et garde l’image d’honneur restauré ainsi que celle de l’admission parmi les personnes de haut rang.
  terminology: « Pauvre » rend correctement דל dans le témoin hébreu. « Nobles » convient à נְדִיבִים dans ce contexte, confirmé par le grec μεγιστάνων. La note doit éviter « petit », terme français trop vague ici, tout en signalant que le grec peut élargir vers la basse condition ou l’humilité.
  issues:
  - severity: medium
    issue: Nuance causative de « lui fait relever la tête »
    rationale: L’hébreu attribue directement à la sagesse l’action de lever la tête du pauvre. La tournure actuelle peut se comprendre comme « elle lui fait faire le geste de relever sa propre tête ». « Lui relève la tête » conserve plus directement la relation source.
  - severity: low
    issue: Rendu atténué de תושיבנו
    rationale: « Lui donne une place » est interprétatif et affaiblit l’image explicite de faire asseoir. « Le fait asseoir » est idiomatique en français et plus proche du hiphil de ישב.
  - severity: low
    issue: Alternative « du petit » dans la note
    rationale: « Petit » n’est pas une équivalence française suffisamment nette de דל ou de ταπεινός dans ce contexte et peut évoquer un enfant ou une simple petitesse. « De l’humble » ou « de condition modeste » signale mieux l’élargissement possible du grec.
