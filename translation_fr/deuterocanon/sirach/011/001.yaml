  text: The wisdom of the poor lifts up his head[a], and seats him among nobles.
translation:
  language: fr
  text: La sagesse du pauvre lui relève la tête[a] et le fait asseoir parmi les nobles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’humble » ou « de condition modeste » ; l’hébreu dit « du pauvre », tandis que le parallèle grec peut évoquer plus largement une personne de basse condition.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכְמַת
  choice: La sagesse du
  rationale: La forme construite exprime « la sagesse de… » et maintient le lien direct avec דַּל.
- source_word: דַּל
  choice: pauvre
  rationale: Le terme hébreu désigne couramment une personne pauvre, faible ou de condition modeste. « Pauvre » conserve ici le sens socioéconomique le plus concret du témoin hébreu.
- source_word: תִּשָּׂא רֹאשׁוֹ
  choice: lui fait relever la tête
  rationale: Cette formulation naturelle en français préserve l’image hébraïque d’une dignité restaurée ou d’une élévation sociale; le parallèle grec confirme l’image de la tête élevée.
- source_word: וּבֵין
  choice: parmi
  rationale: Devant un pluriel désignant un groupe, « parmi » rend naturellement la relation exprimée.
- source_word: נְדִיבִים
  choice: les nobles
  rationale: Dans ce contexte, le mot désigne des personnes de rang élevé. Le grec parallèle, μεγιστάνων, appuie le sens de grands personnages plutôt que celui d’hommes généreux.
- source_word: תּוֹשִׁיבֶנּוּ
  choice: lui donne une place
  rationale: Le hiphil de ישב signifie littéralement « le fait asseoir ». L’expression française choisie conserve l’idée d’admission à une place d’honneur tout en restant naturelle.
theological_decisions:
- issue: Faut-il comprendre דַּל surtout au sens socioéconomique ou au sens moral de l’humilité?
  choice: pauvre
  alternative: petit; humble
  rationale: Le témoin hébreu, retenu comme source principale, favorise une désignation sociale concrète. Le grec ταπεινοῦ élargit toutefois la nuance vers la basse condition ou l’humilité; cette possibilité est donc signalée en note sans remplacer le sens principal.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « relever la tête » garde l’image source tout en étant idiomatique; « lui donne une place » explicite naturellement l’acte de faire asseoir parmi les nobles.
