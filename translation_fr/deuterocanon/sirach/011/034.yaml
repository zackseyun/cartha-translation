  text: Keep many out of your house[a], and do not bring every man into your home, for many lie in wait[b], and many are deceivers.
translation:
  language: fr
  text: Tiens beaucoup de gens à l’écart de ta maison[a], et ne fais pas entrer n’importe quel homme chez toi, car nombreux sont ceux qui sont aux aguets[b], et nombreux sont aussi les trompeurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin hébreu est suivi ici en priorité. Le texte grec parallèle se lit plutôt ainsi : « Héberge un étranger, et il te jettera dans le désordre et te rendra étranger à ce qui t’appartient. » Il reflète probablement une autre forme du texte ou un développement de l’avertissement.'
    reason: alternative_reading
  - marker: b
    text: Dans l’édition hébraïque citée, une partie de ce verset figure entre crochets, ce qui signale une reconstruction ou une incertitude dans la tradition manuscrite conservée.
    reason: textual_variant
lexical_decisions:
- source_word: מְנַע רַבִּים מִתּוֹךְ בֵּיתֶךָ
  choice: Tiens beaucoup de gens à l’écart de ta maison
  rationale: L’impératif מְנַע exprime ici le refus ou la restriction d’accès. « Tenir à l’écart » est naturel en français et conserve l’idée d’exclusion liée à l’intérieur de la maison.
- source_word: וְלֹא כָל אִישׁ לְהָבִיא אֶל בַּיִת
  choice: et ne fais pas entrer n’importe quel homme chez toi
  rationale: La formulation française rend l’avertissement contre une hospitalité sans discernement. « N’importe quel homme » conserve le masculin singulier אִישׁ tout en évitant le calque peu naturel « tout homme » dans ce contexte.
- source_word: אוֹרְבִים
  choice: ceux qui se tiennent en embuscade
  rationale: Cette expression garde l’image participiale de personnes aux aguets avec une intention nuisible, sans la réduire à une simple notion abstraite de complot.
- source_word: וְכֵן נוֹכְלִים רַבִּים הֵם
  choice: et nombreux sont aussi les trompeurs
  rationale: « Aussi » rend le lien additif וְכֵן, tandis que « trompeurs » traduit largement la ruse et la duplicité de נוֹכְלִים sans préciser indûment le type de fraude.
