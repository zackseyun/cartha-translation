  text: The bee is small among flying creatures[a], but the first of sweet produce is its fruit.
translation:
  language: fr
  text: L’abeille est petite parmi les créatures ailées[a], mais son fruit est au premier rang des produits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi les oiseaux ». Le mot hébreu peut désigner plus largement les créatures qui volent. Le grec ajoute que son fruit est au premier rang des « douceurs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלִיל
  choice: petite
  rationale: Dans ce contexte, avec בְּעוֹף et le parallèle grec μικρά, le mot exprime la petitesse. « Petite » rend clairement le contraste proverbial.
- source_word: בְּעוֹף
  choice: parmi les créatures ailées
  rationale: Le nom hébreu עוף peut désigner plus largement les êtres qui volent, et non seulement les oiseaux. Cette formulation naturelle conserve cette portée.
- source_word: דְּבֹרָה
  choice: l’abeille
  rationale: Équivalent direct et naturel dans une maxime française.
- source_word: וְרֹאשׁ
  choice: mais … au premier rang
  rationale: רֹאשׁ indique ici la primauté. « Mais » explicite le contraste entre la petitesse de l’abeille et l’excellence de ce qu’elle produit sans modifier le sens de la proposition.
- source_word: תְּנוּבוֹת
  choice: des produits
  rationale: תְּנוּבוֹת signifie les produits, rendements ou récoltes. « Produits » reste proche de l’hébreu sans ajouter la notion de douceur, présente seulement dans le parallèle grec.
- source_word: פּרִיָהּ
  choice: son fruit
  rationale: Traduction littérale de « son fruit ». L’image hébraïque est conservée, même si le référent concret est le miel; le grec la confirme également.
