translation_notes:
  register: Français moderne, international et digne. La structure proverbiale et son contraste sont conservés; la métaphore du « fruit » n’est pas explicitée en « miel ». Le texte principal suit prioritairement l’hébreu, tandis que la précision du grec sur les « douceurs » est signalée en note.
