translation_notes:
  register: Français moderne, sobre et sentencieux. Le tutoiement singulier rend les impératifs hébreux au singulier. La répétition de « un homme » conserve le parallélisme de l’original, tandis que « apparence » puis « aspect » évitent une répétition pesante sans effacer la correspondance lexicale.
