  text: Do not praise a man for his appearance[a], and do not despise a man who is ugly in his looks.
translation:
  language: fr
  text: Ne loue pas un homme pour son apparence[a], et ne méprise pas un homme dont l’aspect est laid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec dit : « Ne loue pas un homme pour sa beauté, et n’aie pas en horreur une personne pour son apparence. » Dans la première proposition, l’hébreu parle plus largement de l’« apparence », tandis que le grec précise la « beauté ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּהַלֵּלו
  choice: Ne loue pas
  rationale: Le piel de הלל signifie couramment « louer ». L’impératif négatif singulier est rendu directement et naturellement en français.
- source_word: אָדָם
  choice: un homme
  rationale: Dans ces deux propositions parallèles, אָדָם désigne un être humain individuel. « Un homme » conserve ici la forme masculine singulière du texte hébreu, également reflétée par le grec.
- source_word: בְּתָאֳרוֹ
  choice: pour son apparence
  rationale: תֹּאַר désigne la forme ou l’apparence extérieure. « Apparence » respecte la portée assez large de l’hébreu, sans la réduire à la beauté comme le fait le parallèle grec.
- source_word: וְאַל תְּתַעֵב
  choice: et ne méprise pas
  rationale: תעב exprime une forte répulsion ou un rejet. « Mépriser » est idiomatique, digne et suffisamment fort dans ce contexte, tout en évitant une formulation excessivement rare.
- source_word: מְכוֹעָר
  choice: laid
  rationale: L’adjectif signifie « laid » ou « disgracieux ». « Laid » est le terme français le plus direct et n’ajoute pas l’idée plus précise de difformité.
- source_word: בְּמַרְאֵהוּ
  choice: dont l’aspect est laid
  rationale: מַרְאֶה renvoie à ce qui est visible, à l’aspect. Cette tournure naturelle en français maintient le lien explicite entre la laideur et l’apparence extérieure.
