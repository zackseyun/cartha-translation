  text: My son[a], stand by your appointed lot and walk in it[b], and grow old in your work.
translation:
  language: fr
  text: Mon fils[a], tiens-toi dans la voie qui t’est assignée et marche-y[b] ; vieillis dans ton travail.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin grec porte : « Ne dis pas : “Je me suffis à moi-même ; quel mal pourrait désormais m’arriver ?” » L’hébreu conservé ici diffère considérablement de la tradition grecque.'
    reason: alternative_reading
  - marker: b
    text: L’hébreu בחקך est difficile. Il peut désigner « la part qui t’est attribuée », « la sphère qui t’est prescrite » ou « ta règle, ta voie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Mon fils
  rationale: Le vocatif masculin singulier conserve le cadre d’une instruction paternelle et correspond directement à l’hébreu.
- source_word: עֲמוֹד
  choice: tiens-toi
  rationale: L’impératif exprime ici le fait de demeurer fermement dans une situation ou une conduite donnée.
- source_word: בְּחֻקֶּךָ
  choice: dans la voie qui t’est assignée
  rationale: Le terme transmis est difficile. Cette formulation évoque une part, une sphère ou une conduite prescrite sans imposer le sens juridique habituel de « loi » ou « statut ».
- source_word: וּבוֹ הִתְהַלֵּךְ
  choice: et marches-y
  rationale: Le verbe désigne une conduite suivie dans la durée. « Marcher » conserve la métaphore hébraïque, naturelle dans ce registre sapientiel.
- source_word: וּבִמְלָאכְתְּךָ
  choice: dans ton travail
  rationale: מלאכה désigne largement le travail, la tâche ou l’occupation ; « travail » est clair et non restrictif.
- source_word: הִתְיַשֶּׁן
  choice: vieillis
  rationale: L’impératif appelle à persévérer avec le temps, jusqu’à la vieillesse, plutôt qu’à s’épuiser.
theological_decisions:
- issue: Divergence importante entre l’hébreu conservé et le témoin grec
  choice: Traduire l’hébreu conservé dans le texte principal et signaler le grec en note.
  alternative: 'Suivre le grec : « Ne dis pas : “Je me suffis à moi-même ; quel mal pourrait désormais m’arriver ?” »'
  rationale: L’hébreu est ici le témoin source principal, mais la différence substantielle du grec doit être préservée sans harmonisation ni résolution artificielle.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure sapientielle reste concise ; la métaphore de la marche est conservée. Les deux marqueurs de note figurent dans le texte principal.
