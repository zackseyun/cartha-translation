translation:
  language: fr
  text: Le regard du Seigneur s’est porté sur lui pour son bien[a], et le Seigneur l’a secoué pour le sortir de la poussière infecte[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le regardait avec faveur ». L’expression hébraïque associe le regard divin à une intention bénéfique.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu peut aussi évoquer « la poussière puante » ou « la poussière immonde »; l’image est forte, mais sa nuance exacte demeure incertaine.
    reason: alternative_reading
  - marker: c
    text: 'Le texte grec diffère profondément : « Le Seigneur a arraché les racines des nations et planté les humbles à leur place. » L’hébreu et le grec semblent représenter des formes textuelles substantiellement différentes.'
    reason: textual_variant
lexical_decisions:
- source_word: וְעֵין יי
  choice: Le regard du Seigneur
  rationale: L’hébreu dit littéralement « l’œil du Seigneur ». En français actuel, « le regard » conserve l’image de l’attention divine sans produire une tournure artificielle; יי est rendu par « le Seigneur ».
- source_word: צָפַתְהוּ לְטוֹב
  choice: veillait sur lui pour son bien
  rationale: Le verbe exprime l’action de regarder ou de surveiller, tandis que לְטוֹב indique une visée favorable ou bénéfique. Cette formulation préserve les deux aspects sans réduire le sens à une simple observation.
- source_word: וַיְנַעֲרֵהוּ
  choice: il l’a secoué hors de
  rationale: Le verbe נער évoque l’action vive de secouer ou de faire sortir en secouant. Le rendu conserve cette image inhabituelle plutôt que de l’aplanir en « relever » ou « retirer ».
- source_word: מֵעֲפַר צַחֲנָה
  choice: hors de la poussière infecte
  rationale: עפר signifie « poussière », et צחנה évoque une puanteur ou une saleté répugnante. « Infecte » conserve volontairement l’ambiguïté entre ce qui est nauséabond et ce qui est immonde.
theological_decisions:
- issue: Rendu de l’abréviation révérencielle יי
  choice: le Seigneur
  alternative: YHWH / Yahvé
  rationale: Le témoin hébreu emploie une forme révérencielle abrégée. « Le Seigneur » en transmet naturellement la valeur sans imposer une vocalisation du nom divin.
- issue: Nature de l’intervention divine
  choice: veillait sur lui pour son bien
  alternative: le regardait avec faveur
  rationale: Le texte associe la vigilance du regard divin à une intention bénéfique. Le rendu maintient cette tension entre observation favorable et action providentielle, sans préciser davantage le mécanisme.
translation_notes:
  register: Français international moderne, digne et imagé. « Le regard » évite le calque peu naturel « l’œil du Seigneur », tandis que « secoué hors de » conserve volontairement la vigueur étrange de la métaphore hébraïque. Les trois appels de notes figurent dans le texte dans leur ordre d’apparition.
