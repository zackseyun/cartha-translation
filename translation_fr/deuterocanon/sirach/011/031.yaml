translation:
  language: fr
  text: Un temps de malheur fait oublier le plaisir[a], et la fin d’une personne révèle quelque chose à son sujet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle dit : « Car, changeant les biens en maux, il se tient en embuscade, et il jettera le blâme sur ce qui est désirable. » Les témoins hébreu et grec diffèrent notablement ici ; le texte principal suit l’hébreu conservé, témoin prioritaire du Siracide lorsqu’il est disponible.'
    reason: textual_variant
lexical_decisions:
- source_word: עֵת רָעָה
  choice: un temps de malheur
  rationale: עֵת désigne un temps ou une période, et רָעָה évoque ici l’adversité plutôt que le mal moral. « Temps de malheur » est naturel en français et conserve la concision proverbiale.
- source_word: תְּשַׁכֵּח
  choice: fait oublier
  rationale: La forme causative de שכח indique que l’adversité provoque l’oubli du plaisir. « Fait oublier » en rend directement la valeur.
- source_word: תַּעֲנוּג
  choice: le plaisir
  rationale: Le nom désigne le plaisir, les délices ou l’agrément. « Le plaisir » est concis et idiomatique dans cette maxime.
- source_word: וְסוֹף אָדָם
  choice: et la fin d’une personne
  rationale: סוֹף peut désigner la fin ou l’issue d’une vie. אָדָם a ici une portée humaine générale et singulière ; « une personne » l’exprime clairement en français moderne sans imposer un référent masculin.
- source_word: יַגִּיד עָלָיו
  choice: révèle ce qu’elle est
  rationale: Le hifil de נגד signifie « annoncer, faire connaître », et עָלָיו renvoie à la personne. Cette formulation française exprime naturellement l’idée que sa fin fait connaître la vérité à son sujet, sans préciser davantage la nature de cette révélation.
theological_decisions:
- issue: Portée de אָדָם dans une maxime au singulier
  choice: une personne
  alternative: un homme
  rationale: Le contexte formule une vérité générale sur tout être humain, sans contraste entre les sexes. « Une personne » conserve le singulier représentatif dans un français actuel et clair.
- issue: Sens de la fin qui « parle » au sujet d’une personne
  choice: révèle ce qu’elle est
  alternative: témoigne à son sujet
  rationale: Le texte affirme que la fin d’une personne fait connaître quelque chose à son sujet, sans expliquer s’il s’agit de son caractère, de sa conduite ou de son sort. La traduction garde cette tension tout en restant naturelle.
translation_notes:
  register: Français international moderne, sobre et proverbial. La formulation conserve le parallélisme des deux propositions et rend explicitement la valeur causative du verbe hébreu.
