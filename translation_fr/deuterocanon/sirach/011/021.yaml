base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/021.yaml
  text: There is one who grows rich through affliction[b][a], and this is the reward he deserves.
translation:
  language: fr
  text: Il y a quelqu’un qui s’enrichit à force de privations[a], et c’est là la récompense qui lui revient[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’affliction », « par la souffrance » ou « à force de peine ». L’hébreu peut désigner aussi bien des difficultés subies que des privations que l’on s’impose; le parallèle grec évoque le labeur et la pauvreté.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, l’hébreu donne une expression proche de « et cela rendra sa récompense exigible ». La proposition est difficile; on peut aussi comprendre : « et c’est là la récompense qu’il mérite ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יֵשׁ
  choice: Il y en a qui
  rationale: L’ouverture existentielle introduit, selon le style sapientiel, un type de personne sans en faire une règle universelle.
- source_word: מִתְעַשּׁר
  choice: s’enrichit
  rationale: Le participe hitpael de עשר exprime le fait de devenir riche ou de s’enrichir, plutôt qu’un simple état de richesse.
- source_word: מֵהִתְעַנּוֹת
  choice: à force de privations
  rationale: Le terme peut évoquer l’affliction, la souffrance ou le fait de s’imposer des privations. Cette formulation française garde l’idée d’une dure épreuve prolongée sans imposer une lecture ascétique précise; le parallèle grec, qui parle de labeur et de pauvreté, appuie ce champ de sens.
- source_word: וְזֶה
  choice: et cela
  rationale: Le démonstratif renvoie naturellement à la situation qui vient d’être décrite.
- source_word: יְחַיֵּב שְׂכָרוֹ
  choice: lui vaudra sa récompense
  rationale: La proposition hébraïque est condensée et difficile; cette expression conserve à la fois le lien causal et l’idée d’une rétribution qui revient à la personne, sans rendre le verbe par une tournure française artificielle.
theological_decisions:
- issue: Rapport entre enrichissement, privations et rétribution dans une proposition hébraïque difficile
  choice: Le résultat des privations est présenté comme une récompense qui revient à la personne.
  alternative: « et c’est là la récompense qu’il mérite »; ou « et cela rendra sa récompense exigible »
  rationale: « Lui vaudra » exprime une rétribution due sans accentuer indûment une doctrine du mérite. La note signale que la syntaxe hébraïque demeure incertaine, tandis que le corps du texte reste lisible et fidèle à sa tension.
translation_notes:
  register: Français international actuel, sobre et digne. « Il y en a qui » conserve la forme d’observation sapientielle; « à force de privations » est courant sans être familier. Les deux notes maintiennent l’étendue lexicale et l’incertitude syntaxique du texte hébreu.
