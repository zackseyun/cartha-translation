  naturalness: '« Il y en a qui s’enrichit » n’est pas idiomatique en français standard : après « il y en a qui », le verbe s’accorde normalement au pluriel (« s’enrichissent »). Pour garder l’observation portant sur un individu, « Il y a quelqu’un qui s’enrichit » est naturel et clair. La formulation révisée est sobre et adaptée au registre sapientiel.'
