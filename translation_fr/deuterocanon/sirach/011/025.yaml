  text: Do not be astonished at evildoers[a]; run to the Lord and wait for his light.
translation:
  language: fr
  text: Ne t’étonne pas de ceux qui font le mal[a] ; cours vers le Seigneur et attends sa lumière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle dit : « Au jour du bonheur, on oublie le malheur, et au jour du malheur, on ne se souviendra pas du bonheur. » Le témoin grec diffère ici sensiblement de l’hébreu conservé.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּתְמַה
  choice: Ne sois pas déconcerté
  rationale: Le verbe exprime le fait d’être frappé d’étonnement ou troublé. « Déconcerté » rend naturellement en français l’idée de ne pas se laisser désorienter par la conduite des méchants, sans préciser qu’il s’agit de peur.
- source_word: בְּעוֹשֵׂי רָע
  choice: par ceux qui font le mal
  rationale: La formule participiale signifie littéralement « ceux qui font le mal ». Cette traduction reste proche de l’hébreu et évite de transformer l’action décrite en une catégorie figée de personnes.
- source_word: תָּרוּץ
  choice: cours
  rationale: Le verbe concret « courir » conserve l’image vive et l’urgence de l’impératif hébreu.
- source_word: לַיי
  choice: vers le Seigneur
  rationale: La graphie révérencielle représente le nom divin. « Le Seigneur » est la formulation française traditionnelle et intelligible ; « vers » convient naturellement au mouvement exprimé par « cours ».
- source_word: וְקַוֵּה
  choice: et attends
  rationale: Le verbe peut signifier attendre avec espérance. « Attends » préserve l’action sans effacer la nuance d’espoir portée par le contexte.
- source_word: לְאוֹרוֹ
  choice: sa lumière
  rationale: L’image hébraïque est conservée littéralement. Elle peut évoquer la faveur, la direction ou la délivrance divines sans imposer une seule interprétation.
theological_decisions:
- issue: Rendu du nom divin représenté par la graphie révérencielle יי
  choice: le Seigneur
  alternative: YHWH / Yahvé
  rationale: « Le Seigneur » respecte l’usage révérenciel du témoin hébreu et demeure naturel en français, sans introduire une vocalisation contestée du nom divin.
- issue: Rapport entre les témoins hébreu et grec
  choice: Suivre l’hébreu conservé dans le texte principal et signaler le grec en note
  alternative: Suivre uniquement le grec ou fusionner les deux formulations
  rationale: Le témoin grec transmet ici une sentence substantiellement différente. Une note préserve cette variante sans l’harmoniser avec l’hébreu ni remplacer le texte hébreu conservé.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement singulier correspond à l’admonestation hébraïque. La formulation garde les images concrètes de la course et de la lumière, ainsi que l’ambivalence d’une attente empreinte d’espérance.
