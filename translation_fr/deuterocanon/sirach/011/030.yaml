base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/030.yaml
  text: A good day makes one forget trouble[a], and a bad day makes one forget prosperity; and a man's end will be set before him.
translation:
  language: fr
  text: Un jour heureux fait oublier le malheur, et un jour mauvais fait oublier le bonheur ; la fin d’une personne sera sur elle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la fin d’une personne sera sur elle ». Le sens peut être que son issue finale se trouve devant elle ou vient l’atteindre. À cet endroit, le texte grec diffère fortement de l’hébreu conservé et n’éclaire pas cette proposition.'
    reason: alternative_reading
lexical_decisions:
- source_word: טוֹב יוֹם
  choice: Un jour heureux
  rationale: Littéralement « un bon jour ». Dans ce parallélisme, l’expression désigne un temps favorable ; « jour heureux » est naturel en français sans préciser indûment qu’il s’agit de prospérité matérielle.
- source_word: תִּשָּכַח רָעָה
  choice: fait oublier le malheur
  rationale: La forme verbale exprime que רָעָה est oublié. La tournure causative française rend naturellement la relation avec le jour favorable ; « malheur » désigne ici l’adversité vécue plutôt que le mal moral.
- source_word: וְרָע יוֹם
  choice: et un jour mauvais
  rationale: Cette formulation conserve l’antithèse concise entre le bon et le mauvais jour. « Jour mauvais » reste digne et compréhensible, sans moraliser nécessairement la situation.
- source_word: תִּשָׁכַח טוֹבָה
  choice: fait oublier le bonheur
  rationale: טוֹבָה désigne ici le bien éprouvé, le bien-être ou la bonne fortune. « Bonheur » forme avec « malheur » un parallélisme français clair, sans limiter le propos à la richesse.
- source_word: וְאַחֲרִית אָדָם
  choice: la fin d’une personne
  rationale: אַחֲרִית peut désigner la fin ou l’issue finale, tandis que אָדָם est ici un singulier générique. « Une personne » exprime naturellement cette portée universelle en français moderne.
- source_word: תִּהְיֶה עָלָיו
  choice: retombera sur elle
  rationale: L’hébreu dit littéralement « sera sur elle/lui ». « Retombera sur elle » conserve l’image de ce qui vient sur la personne et suggère une issue qui l’atteint, sans adopter l’interprétation plus précise « sera placée devant elle ».
theological_decisions:
- issue: Sens de la dernière proposition
  choice: la fin d’une personne retombera sur elle
  alternative: la fin d’une personne sera sur elle / lui sera présentée
  rationale: 'La construction hébraïque est concise et ambiguë : elle peut évoquer l’issue finale qui atteint la personne ou qui se trouve devant elle. La traduction retient une formulation intelligible tout en signalant l’incertitude en note ; le parallèle grec diverge et ne permet pas de trancher.'
- issue: Valeur générique de אָדָם
  choice: une personne
  alternative: un homme
  rationale: Dans ce contexte sapientiel, אָדָם représente tout être humain. « Une personne » est un singulier générique naturel en français et n’introduit aucune restriction au sexe masculin.
translation_notes:
  register: Français international moderne, sobre et sapientiel. Le parallélisme antithétique est conservé par « jour heureux / jour mauvais » et « malheur / bonheur ». Le pronom féminin « elle » reprend grammaticalement « personne », sans modifier la portée générique du texte.
