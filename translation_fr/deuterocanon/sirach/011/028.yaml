translation:
  language: fr
  text: 'Ne dis pas[a] : « Voici, j’ai fait ce que je désirais ; et maintenant, que me restera-t-il encore ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec dit : « Avant la fin, ne proclame personne heureux, et c’est dans ses enfants qu’un homme sera connu. » Le témoin hébreu avertit plutôt de ne pas dire : « J’ai fait ce que je désirais ; et maintenant, que me restera-t-il encore ? »'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Ne dis pas
  rationale: Rend directement l’interdiction exprimée par la particule négative suivie de la forme verbale à valeur jussive.
- source_word: הִנֵּה
  choice: Voici
  rationale: Conserve la force déictique qui introduit l’affirmation satisfaite, dans un registre français actuel et digne.
- source_word: עָשִׂיתִי
  choice: j’ai fait
  rationale: Le passé composé exprime naturellement l’action accomplie dont le locuteur se prévaut encore au présent.
- source_word: חֶפְצִי
  choice: ce que je désirais
  rationale: Le nom peut désigner le désir, le plaisir ou la volonté ; cette formulation reste naturelle tout en conservant l’idée d’avoir réalisé son propre souhait.
- source_word: וּמֶה עַתָּה
  choice: et maintenant, que
  rationale: Reproduit explicitement la conjonction et le passage rhétorique de l’autosatisfaction à une assurance présomptueuse.
- source_word: יֵעָזֵב לִי
  choice: pourrait-il me manquer
  rationale: Dans ce contexte de vantardise, la tournure interrogative exprime naturellement le sens contextuel de manquer ou faire défaut, tout en laissant au conditionnel la nuance rhétorique de « que pourrait-il encore me manquer ? ».
theological_decisions:
- issue: Rapport entre le texte hébreu et le parallèle grec divergent
  choice: Traduire directement le témoin hébreu conservé et signaler le grec en note.
  alternative: « Avant la fin, ne proclame personne heureux, car c’est dans ses enfants qu’un homme sera connu. »
  rationale: Le texte hébreu conservé a priorité ici. Le grec transmet une formulation substantiellement différente, apparentée par son avertissement contre un jugement prématuré ; cette divergence doit être préservée sans remplacer silencieusement l’hébreu.
translation_notes:
  register: Français international moderne, clair et digne. « Voici » conserve la valeur de הִנֵּה sans recourir à l’archaïsme « voici que ». La question finale est formulée idiomatiquement tout en préservant la présomption du locuteur.
