  text: Before you examine a man[a], do not call him blessed[b], for a man will be called blessed in his end.
translation:
  language: fr
  text: Avant d’avoir examiné quelqu’un, ne le déclare pas heureux[a], car c’est à sa fin qu’il sera déclaré heureux.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « ne le proclame pas bienheureux ». L’hébreu emploie ici le verbe « déclarer heureux », repris ensuite au passif.'
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec présente ici une leçon très différente : « D’une étincelle de feu se multipliera un tas de braises, et l’homme pécheur guette pour verser le sang. » Cette divergence témoigne d’une importante variation textuelle entre les témoins hébreu et grec.'
    reason: textual_variant
lexical_decisions:
- source_word: בְּטֶרֶם תַּחְקֹר
  choice: Avant d’avoir examiné
  rationale: Exprime naturellement en français l’antériorité exigée par בְּטֶרֶם et rend חקר par « examiner », au sens d’évaluer attentivement.
- source_word: אָדָם
  choice: quelqu’un / une personne
  rationale: אָדָם désigne ici un être humain pris individuellement. La formulation française générique évite de faire croire que la maxime ne viserait que les hommes.
- source_word: אַל תְּאַשְּׁרֵהוּ
  choice: ne le déclare pas heureux
  rationale: Le piel de אשר signifie proclamer ou tenir quelqu’un pour heureux. « Déclarer heureux » conserve le caractère évaluatif et prépare la reprise passive.
- source_word: בְּאַחֲרִיתוֹ
  choice: à sa fin
  rationale: אַחֲרִית peut désigner la fin, l’issue ou le dénouement. « À sa fin » maintient la concision et l’ambiguïté entre fin de vie et issue finale.
- source_word: יְאֻשַּׁר
  choice: sera déclarée heureuse
  rationale: La tournure passive reproduit la reprise du même verbe אשר, d’abord à l’actif puis au passif.
theological_decisions:
- issue: Portée de אָדָם dans une maxime sapientielle
  choice: quelqu’un / une personne
  alternative: un homme
  rationale: Le nom hébreu singulier a ici une portée humaine générale. Le français générique moderne transmet cette portée sans ajouter une restriction masculine.
- issue: Sens de אַחֲרִיתוֹ
  choice: à sa fin
  alternative: d’après son issue
  rationale: La formulation retenue ne tranche pas entre la fin de la vie et l’issue révélatrice d’un parcours, préservant ainsi la tension du texte hébreu.
translation_notes:
  register: Français international moderne, sobre et sapientiel. La répétition active-passive du verbe hébreu est conservée, tandis que « à sa fin » maintient l’ambiguïté de אַחֲרִית.
