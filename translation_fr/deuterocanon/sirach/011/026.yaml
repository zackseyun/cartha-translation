  text: For it is easy in the eyes of the Lord[a], in a sudden moment, to make a poor man rich.
translation:
  language: fr
  text: Car il est facile aux yeux du Seigneur[a], en un instant, de rendre riche un pauvre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Car il est facile devant le Seigneur, au jour de la mort, de rendre à chacun selon sa conduite. » Il témoigne d’une forme du verset substantiellement différente de l’hébreu conservé.'
    reason: alternative_reading
lexical_decisions:
- source_word: נֹכַח
  choice: facile
  rationale: Avec בְּעֵינֵי יי et le parallèle grec κοῦφον, le mot exprime ici l’idée que l’action ne présente aucune difficulté pour le Seigneur.
- source_word: בְּעֵינֵי יי
  choice: aux yeux du Seigneur
  rationale: Cette formulation conserve l’image hébraïque tout en restant naturelle en français; « Seigneur » rend respectueusement le nom divin écrit יי.
- source_word: בְּפֶתַע פִּתְאֹם
  choice: en un instant
  rationale: L’expression redoublée souligne la soudaineté; « en un instant » en restitue naturellement la force temporelle.
- source_word: לְהַעֲשִׁיר
  choice: rendre riche
  rationale: Le causatif hébreu indique que le Seigneur fait passer le pauvre à l’état de richesse.
- source_word: דָּל
  choice: un pauvre
  rationale: Le substantif singulier désigne ici une personne démunie; « un pauvre » est concis, idiomatique et ne précise pas inutilement le sexe en français.
- source_word: ὅτι κοῦφον ἔναντι Κυρίου
  choice: Car il est facile aux yeux du Seigneur
  rationale: Le grec confirme le sens de facilité et soutient le lien causal exprimé par « Car ».
- source_word: ἐν ἡμέρᾳ τελευτῆς ἀποδοῦναι ἀνθρώπῳ κατὰ τὰς ὁδοὺς αὐτοῦ
  choice: non retenu dans le texte principal
  rationale: Le grec présente une forme substantiellement différente du verset. Puisque l’hébreu est ici conservé avec une confiance élevée, il fonde le texte principal; la variante grecque est signalée en note.
theological_decisions:
- issue: Rendu du nom divin
  choice: le Seigneur
  alternative: Yahvé; l’Éternel
  rationale: Le texte hébreu porte יי, écriture révérencielle du nom divin. « Le Seigneur » est un rendu français traditionnel, intelligible et non confessionnellement marqué.
- issue: Concurrence entre les formes hébraïque et grecque du verset
  choice: Suivre l’hébreu conservé dans le texte principal et donner le grec en note
  alternative: Car il est facile devant le Seigneur, au jour de la mort, de rendre à chacun selon sa conduite.
  rationale: Le témoin hébreu, de confiance élevée, est prioritaire là où il subsiste. Le grec atteste toutefois une forme réellement différente, qui doit être conservée avec transparence plutôt que harmonisée.
translation_notes:
  register: Français international moderne, simple et digne. La tournure « aux yeux du Seigneur » préserve l’idiome hébreu; « en un instant » rend avec naturel l’intensité de l’expression redoublée.
