  text: Stand by your covenant and attend to it, and grow old in your work.[a]
translation:
  language: fr
  text: Le don d’un juste subsistera pour ceux qui le craignent, et sa faveur prospérera à jamais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente ici un texte très différent : « Reste attaché à ton alliance, occupe-t’en et vieillis dans ton travail. »'
    reason: Signaler honnêtement une importante variante textuelle entre le témoin hébreu et la tradition grecque.
lexical_decisions:
- source_word: מַתַּן צַדִּיק
  choice: le don d’un juste
  rationale: מַתַּן désigne un don ou ce qui est donné, et צַדִּיק est un singulier indéfini. Cette traduction suit directement le témoin hébreu sans transformer le syntagme en une notion d’alliance venue du grec.
- source_word: יַעֲמֹד
  choice: subsistera
  rationale: Le verbe עמד signifie littéralement « se tenir » et, ici, exprime la permanence. « Subsistera » est idiomatique en français et conserve cette idée.
- source_word: לִירֵאָיו
  choice: pour ceux qui le craignent
  rationale: La préposition ל est rendue par « pour », et le suffixe masculin singulier par « le ». L’antécédent apparent est le juste, mais la formulation conserve la référence pronominale du texte sans l’expliciter davantage.
- source_word: וּרְצוֹנוֹ
  choice: et sa faveur
  rationale: רצון peut désigner la volonté, le bon plaisir ou la faveur. Dans ce parallélisme avec « don », « faveur » donne un sens naturel tout en laissant ouverte la nuance de bienveillance.
- source_word: יִצְלַח לָעַד
  choice: prospérera à jamais
  rationale: צלח exprime la réussite ou la prospérité, tandis que לָעַד marque une durée perpétuelle. « Prospérera à jamais » en reproduit l’image et la portée.
theological_decisions:
- issue: Divergence substantielle entre les témoins hébreu et grec
  choice: Le texte principal suit le témoin hébreu fourni, qui parle du don du juste et de sa faveur.
  alternative: 'Le grec porte une exhortation différente : rester attaché à son alliance, s’en occuper et vieillir dans son travail.'
  rationale: Le témoin hébreu est conservé avec une confiance élevée et constitue ici la source originale prioritaire. Comme le grec ne correspond pas terme à terme et semble représenter une forme textuelle différente, sa lecture importante est signalée en note plutôt que substituée au texte hébreu.
- issue: Référent des suffixes dans « ceux qui le craignent » et « sa faveur »
  choice: Conserver les pronoms masculins singuliers sans nommer leur référent.
  alternative: Identifier explicitement le référent comme Dieu ou comme le juste.
  rationale: La grammaire renvoie naturellement au « juste » mentionné juste avant, mais le vers isolé ne permet pas d’écarter toute tension référentielle. Une explicitation introduirait une interprétation absente de l’hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. « Subsistera » et « à jamais » gardent la solennité sapientielle sans archaïsme excessif. Le marqueur [a] figure bien dans le texte principal.
