translation:
  language: fr
  text: Il l’a élevé au plus haut rang et l’a exalté[a][b], et beaucoup se sont étonnés à son sujet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « il l’a porté/élevé sur sa tête ». L’expression est obscure ; elle évoque probablement une élévation à la plus haute position ou au plus haut rang.
    reason: lexical_alternative
  - marker: b
    text: Le parallèle grec fourni pour ce verset ne correspond pas à cette ligne hébraïque ; la traduction suit donc le témoin hébreu conservé.
    reason: textual_variant
lexical_decisions:
- source_word: נָשָׂא בְּרֹאשׁוֹ
  choice: Il l’a élevé
  rationale: נשא exprime l’action de lever ou d’élever. La locution בְּרֹאשׁוֹ est difficile et signifie littéralement « sur/à sa tête »; dans ce parallélisme, elle évoque vraisemblablement une élévation à une position supérieure, rendue naturellement par « élever » sans préciser davantage.
- source_word: וַיְרֹמְמֵהוּ
  choice: et lui a donné un rang éminent
  rationale: רומם signifie élever, exalter. Cette formulation française conserve l’idée d’une élévation de statut tout en évitant la répétition peu naturelle de deux verbes presque identiques.
- source_word: וַיִּתְמְהוּ
  choice: se sont étonnés
  rationale: תמה désigne l’étonnement ou la stupéfaction; « se sont étonnés » est clair, actuel et fidèle.
- source_word: עָלָיו
  choice: à son sujet
  rationale: Avec un verbe d’étonnement, על peut désigner la personne qui suscite cet étonnement. « À son sujet » préserve cette relation sans forcer une nuance d’admiration.
- source_word: רַבִּים
  choice: beaucoup
  rationale: Le masculin pluriel substantivé désigne de nombreuses personnes; « beaucoup » garde la concision de l’hébreu.
theological_decisions:
- issue: Le sujet et l’objet masculins singuliers ne sont pas nommés dans la ligne hébraïque.
  choice: Conserver les pronoms « il » et « le/lui » sans identifier les personnes.
  alternative: Identifier le sujet comme Dieu ou le Seigneur, ou comme un dirigeant humain.
  rationale: L’hébreu ne fournit ici aucun sujet nominal explicite. La traduction préserve donc cette indétermination plutôt que d’introduire une identification théologique absente du verset.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve l’indétermination des référents et signale l’expression hébraïque difficile ainsi que la discordance du parallèle grec.
