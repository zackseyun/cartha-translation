translation:
  language: fr
  text: Ne te moque pas de quelqu’un à cause de son manteau usé[a], et ne te vante pas dans les jours d’amertume[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « d’un manteau délabré ». L’expression peut aussi désigner, par son vêtement, une personne pauvre ou démunie.'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec présente une forme différente et plus longue : « Ne te glorifie pas de la parure de tes vêtements et ne t’enorgueillis pas au jour de gloire, car les œuvres du Seigneur sont merveilleuses, et ses œuvres parmi les humains sont cachées. »'
    reason: textual_variant
lexical_decisions:
- source_word: מַעֲטֶה אֹבֵד
  choice: celui qui porte un manteau usé
  rationale: מַעֲטֶה désigne un vêtement extérieur ou un manteau, et אֹבֵד évoque ce qui se perd, se détériore ou tombe en ruine. La formulation française rend naturellement l’avertissement visant la personne reconnaissable à son vêtement délabré, sans réduire définitivement l’expression à « un pauvre ».
- source_word: אַל תְּהַתֵּל
  choice: ne te moque pas
  rationale: Le verbe התל peut exprimer la dérision ou le fait de traiter quelqu’un avec mépris. Ce sens convient à l’interdiction de juger une personne d’après son vêtement.
- source_word: וְאַל תְּקַלֵּס
  choice: et ne te vante pas
  rationale: 'קלס au piel signifie louer ou célébrer. Dans cette exhortation, le sens contextuel est réflexif : se louer soi-même, donc se vanter.'
- source_word: בִּמְרִירֵי יוֹם
  choice: dans les jours d’amertume
  rationale: L’expression hébraïque associe le jour à l’amertume et peut désigner des temps pénibles. « Jours d’amertume » conserve cette image et son étrangeté sans adopter la lecture grecque divergente « jour de gloire ».
theological_decisions:
- issue: Divergence entre l’hébreu conservé et le parallèle grec
  choice: Le texte principal suit l’exhortation hébraïque en deux membres.
  alternative: 'Le grec lit : « Ne te glorifie pas de la parure de tes vêtements et ne t’enorgueillis pas au jour de gloire, car les œuvres du Seigneur sont merveilleuses, et ses œuvres parmi les humains sont cachées. »'
  rationale: 'L’hébreu conservé est ici le témoin principal, avec un niveau de confiance élevé. Le grec témoigne cependant d’une autre forme du texte : il transforme notamment les « jours d’amertume » en « jour de gloire » et ajoute une explication absente de l’hébreu fourni. Cette variante est donc signalée sans être intégrée au texte principal.'
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier correspond aux impératifs hébreux. La formulation reste accessible tout en conservant l’image concrète du manteau et l’expression inhabituelle « jours d’amertume ».
