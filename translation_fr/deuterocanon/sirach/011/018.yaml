  text: Wisdom and understanding and the knowledge of a matter are from the Lord[a]; sin and upright ways are from the Lord.
translation:
  language: fr
  text: Il y en a un qui s’enrichit par son attention et son avarice, et voici la part de sa récompense :[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La ligne hébraïque conservée dans les manuscrits de la Guéniza du Caire présente ici une autre maxime : « La sagesse, l’intelligence et le discernement d’une chose viennent du Seigneur ; le péché et les voies droites viennent du Seigneur. » Comme elle ne correspond pas au texte grec de Siracide 11.18, la traduction suit ici le grec.'
    reason: textual_variant
lexical_decisions:
- source_word: ἔστιν πλουτῶν
  choice: Il y en a un qui s’enrichit
  rationale: Cette tournure française naturelle rend l’existence d’un certain type de personne et la valeur progressive ou résultative du participe grec.
- source_word: ἀπὸ προσοχῆς
  choice: par son attention
  rationale: Le nom grec désigne l’attention ou le soin. « Attention » reste concis et conserve une certaine ambiguïté morale, précisée ensuite par « avarice ».
- source_word: καὶ σφιγγίας αὐτοῦ
  choice: et son avarice
  rationale: Le terme évoque la parcimonie et le fait de se montrer très serré. « Avarice » est clair en français moderne et garde la nuance négative du contexte.
- source_word: καὶ αὕτη ἡ μερὶς
  choice: et voici la part
  rationale: « Part » restitue directement l’image de la portion qui revient à quelqu’un; « voici » présente naturellement le résultat annoncé.
- source_word: τοῦ μισθοῦ αὐτοῦ
  choice: de sa récompense
  rationale: Le mot peut désigner le salaire ou la récompense. Ici, « récompense » exprime ce que sa conduite lui rapporte sans imposer un cadre salarial.
theological_decisions:
- issue: Correspondance entre le texte hébreu fourni et le parallèle grec de Siracide 11.18
  choice: Traduire ici le sens du grec, tout en signalant en note la leçon hébraïque divergente.
  alternative: 'Traduire la maxime hébraïque : « La sagesse, l’intelligence et le discernement d’une chose viennent du Seigneur ; le péché et les voies droites viennent du Seigneur. »'
  rationale: La ligne hébraïque fournie ne correspond pas au texte grec de Siracide 11.18 et semble appartenir à une autre maxime. Le grec donne, dans la séquence connue du chapitre, le texte cohérent de ce verset. La divergence est donc conservée explicitement plutôt que résolue en silence.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la brièveté proverbiale du grec ainsi que l’ambiguïté relative de προσοχή, tandis que « avarice » rend clairement la coloration négative de σφιγγία.
