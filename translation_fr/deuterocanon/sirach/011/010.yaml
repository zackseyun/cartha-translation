base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/010.yaml
  text: Do not contend where there is no cause[b][a], and do not rise up in the quarrel of the arrogant.
translation:
  language: fr
  text: Ne te querelle pas sans motif[b], et ne t'engage pas dans le différend des arrogants.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente ici un texte très différent : « Mon enfant, ne t''occupe pas de trop de choses ; si tu les multiplies, tu ne seras pas déclaré innocent ; si tu poursuis, tu ne rattraperas pas ; et, en fuyant, tu n''échapperas pas. » Il reflète probablement un autre texte hébreu sous-jacent ou une divergence textuelle majeure.'
    reason: alternative_reading
  - marker: b
    text: Le sens du mot hébreu עַצָּבָה est incertain ici ; il peut évoquer la peine, le trouble ou un grief. La traduction « motif » comprend la phrase comme l'absence de raison valable de se quereller.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵין
  choice: sans
  rationale: Avec אֵין, la préposition exprime l’absence d’une réalité; « sans » rend cette circonstance avec naturel et concision en français.
- source_word: עַצָּבָה
  choice: motif
  rationale: Le nom est difficile et peut évoquer la peine, le trouble ou un grief. Avec l’interdiction de se quereller, « motif » exprime probablement l’absence de raison valable, tout en signalant l’incertitude en note.
- source_word: אַל תִּתְחָר
  choice: ne te querelle pas
  rationale: La forme évoque le fait de s’échauffer ou d’entrer en conflit. « Se quereller » communique clairement la portée pratique de l’interdiction.
- source_word: וּבְרִיב
  choice: et… dans la dispute
  rationale: רִיב désigne une querelle, un différend ou une contestation. « Dispute » convient au contexte relationnel et conserve la construction imagée de l’hébreu.
- source_word: זֵדִים
  choice: des arrogants
  rationale: זֵדִים caractérise des personnes présomptueuses ou insolentes. « Les arrogants » est actuel, clair et fidèle à la qualification morale.
- source_word: אַל תְּקוֹמֵם
  choice: ne te dresse pas
  rationale: Le verbe issu de קום signifie littéralement « se lever ». Ici, il invite à ne pas prendre position ni s’engager dans leur dispute; « ne te dresse pas » préserve l’image hébraïque sans trancher davantage.
theological_decisions:
- issue: Témoin principal et emploi du parallèle grec
  choice: Traduire l’hébreu conservé et consulter le grec comme témoin parallèle sans le suivre ici.
  alternative: 'Prendre pour texte principal la leçon grecque : « Mon enfant, que tes activités ne portent pas sur beaucoup de choses… »'
  rationale: Le texte grec diverge profondément de l’hébreu et semble refléter un autre texte hébreu sous-jacent ou une importante divergence textuelle. Puisque l’hébreu est conservé ici avec une confiance élevée, il demeure la base de la traduction; la variante grecque est néanmoins documentée.
translation_notes:
  register: Français international moderne, concis et sapiential. Le tutoiement singulier convient à l’exhortation proverbiale. « Ne te dresse pas » conserve l’image du texte hébreu, tandis que les notes rendent visibles l’incertitude lexicale et la forte divergence du grec.
