translation:
  language: fr
  text: Car les œuvres du Seigneur sont merveilleuses[a], et son œuvre demeure cachée aux humains.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec diffère considérablement ici : « Beaucoup de tyrans se sont assis par terre, mais celui auquel on ne pensait pas portait une couronne. » Les témoins hébreu et grec semblent refléter deux formes différentes du texte à cet endroit.'
    reason: textual_variant
  - marker: b
    text: L’hébreu dit littéralement « de l’être humain » ; ce singulier désigne ici l’humanité en général.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְלָאוֹת
  choice: merveilleuses
  rationale: Le terme issu de la racine פלא désigne ce qui est extraordinaire ou admirable. « Merveilleuses » conserve ce registre élevé et convient naturellement comme attribut en français.
- source_word: מַעֲשֵׂי
  choice: les œuvres de
  rationale: Le pluriel construit de מעשה désigne ici les actes ou réalisations de Dieu. « Les œuvres de » est naturel, digne et suffisamment formel.
- source_word: יי
  choice: le Seigneur
  rationale: Le témoin hébreu emploie une graphie révérencielle du nom divin. « Le Seigneur » en rend la fonction sans prétendre reproduire une graphie complète de יהוה.
- source_word: וְנֶעְלָם
  choice: échappe
  rationale: La forme nifal de עלם exprime ce qui demeure caché ou inaccessible à la perception. Avec le complément introduit par מִן, « échappe aux humains » rend idiomatiquement cette idée.
- source_word: מֵאָדָם
  choice: aux humains
  rationale: אָדָם est ici un singulier générique désignant l'humanité. Le pluriel collectif « aux humains » exprime clairement cette portée en français moderne.
- source_word: פָּעֳלוֹ
  choice: son action
  rationale: Le singulier renvoie à l'agir ou à l'œuvre de Dieu. « Son action » préserve la variation lexicale entre מַעֲשֵׂי, pluriel, et פָּעֳלוֹ, singulier.
theological_decisions:
- issue: Rendu du nom divin écrit יי dans ce témoin hébreu deutérocanonique
  choice: le Seigneur
  alternative: YHWH / le SEIGNEUR
  rationale: La graphie יי est révérencielle. « Le Seigneur » signale le titre divin de façon naturelle sans surinterpréter la forme écrite du témoin.
- issue: Portée générique de אָדָם
  choice: aux humains
  alternative: à l’homme
  rationale: Le mot hébreu est grammaticalement singulier mais vise l’humanité en général. « Aux humains » communique cette portée sans limiter le sens au sexe masculin.
- issue: Divergence substantielle entre les témoins hébreu et grec
  choice: Traduire le texte hébreu fourni et signaler le grec en note
  alternative: 'Suivre le grec : « Beaucoup de tyrans se sont assis par terre, mais celui auquel on ne pensait pas a porté une couronne. »'
  rationale: Le texte hébreu, donné comme source principale avec une confiance élevée, présente une maxime sur les œuvres insondables du Seigneur, tandis que le grec atteste ici une forme textuelle entièrement différente. La variante doit rester visible plutôt que d’être harmonisée.
translation_notes:
  register: 'Français international moderne, naturel et digne. La formulation privilégie une équivalence optimale : elle conserve le contraste entre le pluriel « les œuvres » et le singulier « son action », tout en rendant idiomatiquement l’idée de ce qui demeure inaccessible à la compréhension humaine. Tous les appels de note figurent dans le texte.'
