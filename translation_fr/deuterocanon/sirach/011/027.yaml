translation:
  language: fr
  text: La bénédiction de Dieu est le lot du juste[a][b], et au temps de son espérance, elle fleurira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit : « La bénédiction de Dieu est le lot du juste, et au temps de son espérance, elle fleurira. » Le grec présente un texte très différent : « Une heure de malheur fait oublier le bien-être, et à la fin d’un homme ses œuvres sont dévoilées. » Cette divergence semble témoigner d’une autre tradition textuelle pour ce verset.'
    reason: textual_variant
  - marker: b
    text: 'Ou : « son espérance fleurira ». Le verbe hébreu peut avoir pour sujet soit « la bénédiction », soit « son espérance ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְכַּת אֵל
  choice: La bénédiction de Dieu
  rationale: Le construit בִּרְכַּת suivi du titre divin אֵל exprime simplement la bénédiction de Dieu. L’article défini convient à la portée générale de la maxime.
- source_word: גּוֹרָל
  choice: le lot
  rationale: גּוֹרָל désigne d’abord le lot, puis la part échue à quelqu’un. « Le lot » conserve cette métaphore concrète sans imposer l’idée plus déterministe de « destin ».
- source_word: צַדִּיק
  choice: du juste
  rationale: L’adjectif substantivé désigne ici la personne juste comme figure représentative. Le singulier français reproduit naturellement cette formulation sapientielle.
- source_word: וּבְעֵת תִּקְוָתוֹ
  choice: et au temps de son espérance
  rationale: La traduction garde la locution temporelle explicite et rend תִּקְוָה par « espérance », terme naturel dans ce registre et assez large pour désigner l’attente confiante ou son objet.
- source_word: תִּפְרָח
  choice: elle fleurira
  rationale: Le verbe פרח évoque le fait de bourgeonner ou de fleurir. Le pronom féminin « elle » préserve en français l’ambiguïté entre « la bénédiction » et « son espérance », toutes deux féminines.
theological_decisions:
- issue: Référent du verbe féminin singulier תִּפְרָח
  choice: « elle fleurira », sans nommer explicitement le sujet
  alternative: « sa bénédiction fleurira » ou « son espérance fleurira »
  rationale: La bénédiction de Dieu est un antécédent naturel, mais l’espérance du juste peut aussi être comprise comme le sujet. La formulation pronominale française maintient cette ambiguïté réelle au lieu de la trancher.
- issue: Divergence profonde entre le texte hébreu et le parallèle grec
  choice: Traduire le témoin hébreu fourni et signaler la variante en note
  alternative: 'Suivre le grec : « Une heure de malheur fait oublier le bien-être, et à la fin d’un homme ses œuvres sont dévoilées. »'
  rationale: Le témoin hébreu est ici la source principale et présente un texte cohérent. La version grecque atteste toutefois une tradition textuelle très différente, qui doit rester visible pour le lecteur.
translation_notes:
  register: Français international moderne, sobre et sapientiel. « Le lot du juste » conserve l’image hébraïque tout en restant intelligible. La reprise par « elle » exploite naturellement le genre féminin des deux antécédents possibles et maintient l’ambiguïté du texte source.
