translation:
  language: fr
  text: 'Le bien et le mal[a], la vie et la mort[b], la pauvreté et la richesse : tout vient de lui[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le malheur » ou « l’adversité ». Le mot hébreu רַע peut désigner une calamité aussi bien que le mal dans un sens plus large.
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec conservé pour ce verset est très différent : « Le don du Seigneur demeure pour les personnes pieuses, et sa faveur prospérera pour toujours. » Les témoins hébreu et grec ne concordent pas étroitement ici.'
    reason: textual_variant
  - marker: c
    text: 'Littéralement : « de lui ». Le contexte désigne vraisemblablement Dieu, mais cette ligne hébraïque ne donne pas explicitement le nom divin.'
    reason: alternative_reading
lexical_decisions:
- source_word: טוֹב
  choice: le bien
  rationale: Le substantif français conserve la portée générale du terme hébreu et s’inscrit naturellement dans la série d’oppositions.
- source_word: וְרַע
  choice: et le mal
  rationale: « Le mal » rend la largeur sémantique de רַע sans la réduire à la seule adversité; une note signale les nuances possibles de malheur ou d’adversité.
- source_word: חַיִּים
  choice: la vie
  rationale: Rendu idiomatique du pluriel hébreu abstrait dans l’opposition traditionnelle entre vie et mort.
- source_word: וָמָוֶת
  choice: et la mort
  rationale: Traduction directe qui maintient l’opposition avec la vie.
- source_word: רֵישׁ
  choice: la pauvreté
  rationale: Équivalent moderne et naturel, opposé clairement à la richesse.
- source_word: וְעֹשֶׁר
  choice: et la richesse
  rationale: Terme courant et large qui correspond au contraste socioéconomique avec la pauvreté.
- source_word: מֵיי הוּא
  choice: tout vient de lui
  rationale: La tournure française rassemble idiomatiquement les réalités énumérées tout en conservant le pronom masculin non explicité de l’hébreu; la note précise que son référent est vraisemblablement Dieu selon le contexte.
theological_decisions:
- issue: Référent du pronom final
  choice: lui
  alternative: le Seigneur / Dieu
  rationale: Le texte hébreu transmis emploie un pronom sans nommer explicitement Dieu. Bien que le contexte rende le référent divin probable, le corps du texte conserve l’indétermination formelle de la source.
- issue: Portée de רַע en rapport avec la provenance divine
  choice: le mal
  alternative: le malheur / l’adversité
  rationale: רַע peut désigner aussi bien le mal au sens large que le malheur éprouvé. Le rendu principal préserve cette tension sémantique et théologique, tandis qu’une note présente les nuances contextuelles possibles.
- issue: Divergence entre les témoins hébreu et grec
  choice: traduire le texte hébreu fourni
  alternative: 'suivre le grec : « Le don du Seigneur demeure auprès des personnes pieuses, et sa faveur assurera pour toujours leur réussite »'
  rationale: Le témoin hébreu est la source principale indiquée et bénéficie d’un niveau de confiance élevé. La divergence substantielle du grec est signalée sans harmonisation.
translation_notes:
  register: Français international moderne, naturel et digne. Les trois couples antithétiques sont conservés. « Tout vient de lui » évite une construction lourde tout en maintenant le pronom non explicité; les notes préservent l’ambiguïté lexicale de רַע et la forte divergence textuelle avec le grec.
