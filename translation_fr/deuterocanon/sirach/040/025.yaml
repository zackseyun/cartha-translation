lexical_decisions:
- source_word: זהב וכסף
  choice: L’or et l’argent
  rationale: Conserve l’association traditionnelle des deux métaux, qui représentent ici les ressources matérielles.
- source_word: יעמידו רגל
  choice: assurent une base solide
  rationale: L’hébreu dit littéralement « font tenir le pied ». Cette formulation française naturelle exprime la stabilité procurée par les richesses tout en gardant l’image concrète d’un appui.
- source_word: ומשניהם
  choice: mais … vaut mieux que l’un et l’autre
  rationale: La tournure hébraïque condensée signifie littéralement « et au-delà d’eux deux »; le grec confirme une comparaison plaçant le conseil au-dessus de l’or et de l’argent.
- source_word: עצה טובה
  choice: un bon conseil
  rationale: Rend directement עצה, « conseil », et טובה, « bon », dans une expression courante et digne en français.
