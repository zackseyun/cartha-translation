base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/029.yaml
  text: A man who watches another’s table—his life is not to be counted as life[a]; he defiles his appetite with another man’s delicacies[b], but a man who knows inward restraint will beware.
translation:
  language: fr
  text: L’homme qui regarde la table d’autrui ne mène pas une vie qui mérite ce nom[a] ; il se souille par les mets d’autrui, mais l’homme qui connaît la maîtrise intérieure se tiendra sur ses gardes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sa vie ne doit pas être comptée comme une vie ». La « table d’autrui » désigne ici les provisions d’un autre, sans connotation ethnique nécessaire.'
    reason: lexical_alternative
  - marker: b
    text: 'La fin du texte hébreu est difficile ; elle dit littéralement quelque chose comme « l’homme qui connaît le secret des entrailles ». Le grec comprend : « l’homme instruit et bien formé se tiendra sur ses gardes », ce qui appuie l’idée de maîtrise intérieure et de prudence.'
    reason: alternative_reading
lexical_decisions:
- source_word: איש משגיח
  choice: L’homme qui guette
  rationale: Le participe משגיח évoque un regard attentif et intéressé. « Guette » conserve cette image tout en laissant entendre la dépendance envers la table d’autrui.
- source_word: שלחן זר
  choice: la table d’un autre
  rationale: זר peut désigner ce qui appartient à autrui, et non nécessairement ce qui est étranger au sens ethnique. Le grec ἀλλοτρίαν τράπεζαν confirme cette lecture.
- source_word: אין חייו למנות חיים
  choice: ne mène pas une vie qui mérite ce nom
  rationale: Cette formulation française naturelle restitue l’affirmation emphatique selon laquelle une telle existence ne saurait être comptée comme une vraie vie.
- source_word: מעוג לנפש מטעמו
  choice: il souille son appétit avec les mets d’un autre
  rationale: Le texte hébreu est difficile. Dans ce contexte alimentaire, נפש peut désigner l’appétit. Le parallèle grec parle de souiller sa ψυχή par les mets d’autrui et soutient cette compréhension.
- source_word: לאיש יודע סוד מעים
  choice: l’homme qui connaît la maîtrise intérieure
  rationale: Littéralement, l’hébreu évoque celui qui connaît le « secret des entrailles », expression obscure. « Maîtrise intérieure » conserve l’image de l’intériorité tout en exprimant la retenue prudente suggérée par le grec.
- source_word: φυλάξεται
  choice: se tiendra sur ses gardes
  rationale: Le futur grec signifie qu’un homme avisé se gardera ou prendra garde ; cette expression est claire et idiomatique en français.
