    rationale: Le verbe français peut suggérer une surveillance furtive ou malveillante, absente de l’hébreu משגיח et du grec βλέπων, qui décrivent plus sobrement quelqu’un qui regarde vers la table d’autrui.
  - severity: low
    issue: « souille son appétit » est une collocation française peu naturelle.
    rationale: Dans un contexte de nourriture, נפש peut certes renvoyer à l’appétit, mais le grec ψυχή et la portée réflexive de l’image se rendent plus naturellement par « il se souille », sans imposer une anthropologie particulière.
