  source_fidelity: Le sens général est bien rendu et le grec confirme l’idée d’une vie dégradée par la dépendance à la table d’autrui ainsi que la conclusion prudentielle. Toutefois, « guette » est plus chargé que משגיח/βλέπων, qui expriment d’abord le fait de regarder vers. « Souille son appétit » est possible, mais moins naturel et moins directement fidèle à נפש/ψυχή que « se souille » dans ce contexte.
  naturalness: Le registre est globalement moderne et digne. « Regarde la table d’autrui » est plus neutre et idiomatique que « guette la table d’un autre ». « Se souille par les mets d’autrui » évite la collocation peu usuelle « souiller son appétit » tout en gardant l’image alimentaire.
  terminology: « Table d’autrui », « mets » et « se tenir sur ses gardes » conviennent. « Maîtrise intérieure » demeure une interprétation recevable du crux hébreu, explicitement signalée par la note et appuyée par l’interprétation grecque; elle ne doit toutefois pas être présentée comme le sens littéral.
  issues:
