  text: For the wicked[a], evil was created, and because of them destruction will cease only when it is complete.
translation:
  language: fr
  text: Pour le méchant, le mal a été créé ; à cause de lui, la destruction ne prendra fin qu’une fois accomplie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente une forme sensiblement différente : « Toutes ces choses ont été créées pour les hommes sans loi, et c’est à cause d’eux que le déluge est survenu. »'
    reason: alternative_reading
lexical_decisions:
- source_word: על רשע
  choice: Pour le méchant
  rationale: על peut exprimer ici la relation, la destination ou l’opposition (« pour », « sur », « contre »). « Pour le méchant » reste proche de l’hébreu sans réduire le propos à la seule idée d’un châtiment dirigé contre lui. Le singulier français conserve la valeur générique du singulier hébreu.
- source_word: נבראה רעה
  choice: le mal a été créé
  rationale: רעה peut désigner le mal au sens large, notamment le malheur ou la calamité. « Le mal » préserve cette amplitude et l’expression explicite de la création, sans trancher silencieusement en faveur du mal moral ou du désastre subi.
- source_word: ובעבור
  choice: à cause de lui
  rationale: בעבור exprime couramment la cause. Le complément est elliptique dans le texte hébreu cité ; le pronom singulier reprend naturellement « le méchant ». Le grec parallèle emploie pour sa part un pluriel explicite.
- source_word: תמוש כלה
  choice: la destruction ne prendra fin qu’une fois accomplie
  rationale: מוש peut signifier s’éloigner, disparaître ou cesser, tandis que כלה évoque l’achèvement, la fin ou la destruction totale. La formulation française rend la proposition hébraïque très condensée en reliant la cessation de la destruction à son plein accomplissement, sans introduire le « déluge » propre au grec parallèle.
theological_decisions:
- issue: 'Sens de רעה : mal moral ou calamité punitive'
  choice: le mal
  alternative: le malheur ; la calamité
  rationale: Le terme hébreu demeure polysémique. Le choix général « le mal » conserve la tension entre réalité mauvaise et malheur subi, au lieu d’imposer une interprétation théologique plus étroite.
- issue: Divergence entre la finale hébraïque et le texte grec qui mentionne le déluge
  choice: Suivre l’hébreu dans le texte principal et signaler le grec en note
  alternative: « et c’est à cause d’eux que le déluge est survenu »
  rationale: Puisque l’hébreu est conservé avec une haute confiance, il régit le texte principal. La tradition grecque, matériellement différente, est néanmoins importante et doit rester visible.
- issue: Rapport entre la cessation et l’accomplissement de la destruction dans תמוש כלה
  choice: « ne prendra fin qu’une fois accomplie »
  alternative: « la destruction prendra fin » ; « elle disparaîtra entièrement »
  rationale: L’hébreu est laconique et permet plusieurs analyses de כלה. La traduction retient l’idée d’une cessation seulement au terme du processus, tout en évitant d’identifier ce processus au déluge d’après le grec.
translation_notes:
  register: Français international actuel, sobre et digne. Le singulier générique « le méchant » suit l’hébreu. La ponctuation met en relief les deux propositions parallèles, et la note conserve la variante grecque sans la mêler au texte hébreu.
