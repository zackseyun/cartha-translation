  text: A brother and a companion are for a time of trouble[a], but righteousness delivers more than both.
translation:
  language: fr
  text: Un frère et un compagnon sont là au temps de la détresse, mais la justice délivre mieux que tous les deux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle porte : « mais l’aumône — ou la miséricorde — délivre mieux que tous les deux ». Le témoin hébreu porte ici « la justice ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אח
  choice: un frère
  rationale: Le terme hébreu désigne clairement un frère. Le sens concret est conservé, en parallèle avec le compagnon.
- source_word: ושותף
  choice: et un compagnon
  rationale: שותף désigne quelqu’un qui partage ou prend part avec un autre. « Compagnon » est naturel en français et exprime ici une relation de soutien mutuel sans suggérer nécessairement une association commerciale.
- source_word: לעת צרה
  choice: sont là au temps de la détresse
  rationale: La formulation exprime leur présence et leur utilité dans une période difficile. « Au temps de la détresse » garde le ton sapiential tout en restant clair.
- source_word: ומשניהם
  choice: mieux que tous les deux
  rationale: 'Le préfixe מן marque ici la comparaison : la justice surpasse les deux soutiens qui viennent d’être nommés.'
- source_word: צדק
  choice: la justice
  rationale: Le témoin hébreu porte צדק, qui peut désigner la justice ou la droiture. « Justice » conserve le champ moral large du terme sans substituer la lecture grecque « aumône/miséricorde ».
- source_word: מצלת
  choice: délivre
  rationale: Le verbe exprime l’action d’arracher au danger ou de secourir. « Délivre » convient au registre sapiential et évite de surcharger le terme d’une portée doctrinale.
theological_decisions:
- issue: Hébreu צדק face au grec ἐλεημοσύνη dans la comparaison finale
  choice: Le texte principal suit l’hébreu avec « la justice » et signale en note la variante grecque.
  alternative: « l’aumône » ou « la miséricorde » délivre mieux que tous les deux
  rationale: Puisqu’un témoin hébreu subsiste, il sert de texte principal. La différence grecque modifie toutefois sensiblement l’accent éthique et doit donc être conservée explicitement plutôt que résolue silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. « Compagnon » est préféré à « partenaire », qui pourrait sembler commercial. La tournure « sont là » rend naturellement la valeur contextuelle de la construction nominale hébraïque.
