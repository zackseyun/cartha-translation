translation:
  language: fr
  text: Comme des broussailles sur les plantations d’un torrent[a][b], elles dépérissent à l’approche de toute pluie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « broussailles » est incertain. Le grec présente plutôt une végétation au bord de l’eau, arrachée avant toute autre herbe.
    reason: lexical_alternative
  - marker: b
    text: Un témoin hébreu plus ancien découvert à Massada semble présenter ici un texte sensiblement différent. La traduction suit le texte hébreu des manuscrits de la Guéniza du Caire.
    reason: textual_variant
lexical_decisions:
- source_word: כקרדמות
  choice: Comme des broussailles
  rationale: Le terme hébreu est rare et incertain. « Broussailles » conserve l’image d’une végétation basse et fragile sans prétendre identifier précisément une plante.
- source_word: על מטעי נחל
  choice: dans les plantations d’un torrent
  rationale: מטעי désigne des plantations et נחל un torrent ou cours d’eau, souvent saisonnier. Cette formulation garde à la fois l’image agricole et celle du bord de l’eau.
- source_word: מפני כל מטר
  choice: devant chaque pluie
  rationale: מפני peut signifier « devant », « face à » ou « à cause de ». La traduction littérale « devant » préserve ici l’ambiguïté de la relation avec la pluie.
- source_word: נדעכו
  choice: elles dépérissent
  rationale: Le verbe évoque ce qui s’éteint, s’affaiblit ou disparaît. Appliqué à la végétation, « dépérissent » rend naturellement l’image sans imposer le sens plus précis de « se dessécher ».
