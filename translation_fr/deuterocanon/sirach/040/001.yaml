base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/001.yaml
  text: Great toil is allotted[c][b][a], and a heavy burden upon the children of man—from the day they come forth from their mother’s womb until the day they return to the mother of all.
translation:
  language: fr
  text: Un grand labeur a été assigné[a], et un lourd fardeau pèse sur les humains[b] — depuis le jour où ils sortent du ventre de leur mère jusqu’au jour où ils sont ensevelis dans la mère de tous[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu est très condensé et peut aussi se comprendre comme « Dieu a assigné un grand labeur ». Le grec dit qu’un grand labeur « a été créé pour tout être humain ».
    reason: ambiguïté textuelle et lexicale
  - marker: b
    text: 'Le grec porte littéralement : « un lourd joug sur les fils d’Adam ». L’hébreu est ici plus elliptique.'
    reason: variante lexicale
  - marker: c
    text: La précision allant de la sortie du ventre maternel à l’ensevelissement se trouve dans le témoin grec; le texte hébreu conservé ici est plus court.
    reason: lecture parallèle
  - marker: d
    text: « La mère de tous » désigne figurativement la terre, lieu commun de l’ensevelissement.
    reason: note culturelle
lexical_decisions:
- source_word: עסק גדול
  choice: un grand labeur
  rationale: Le groupe hébreu désigne une activité pénible, une occupation accablante. « Labeur » exprime naturellement en français son caractère éprouvant, en accord avec le grec ἀσχολία μεγάλη.
- source_word: חלק אל
  choice: a été assigné
  rationale: Le texte hébreu transmis est très condensé et difficile. Cette formulation conserve l’idée d’un lot attribué sans imposer comme certaine l’interprétation de אל comme sujet divin; le grec exprime de son côté une condition établie pour tout être humain.
- source_word: ועל כבד
  choice: un lourd fardeau
  rationale: L’hébreu est elliptique ou textuellement incertain; le grec porte ζυγὸς βαρύς, « un joug pesant ». « Lourd fardeau » communique clairement le sens commun aux témoins sans imposer la métaphore précise du joug dans le texte principal.
- source_word: על בני אדם
  choice: pèse sur les humains
  rationale: בני אדם désigne les êtres humains, avec une possible résonance adamique. En français courant, « les humains » inclut fidèlement l’ensemble de l’humanité; la formulation plus littérale du grec est signalée en note.
- source_word: ἀφʼ ἡμέρας ἐξόδου ἐκ γαστρὸς μητρὸς αὐτῶν
  choice: depuis le jour où ils sortent du ventre de leur mère
  rationale: Cette proposition du témoin grec conserve concrètement le point de départ de l’existence humaine, sans réduire l’image au seul mot « naissance ».
- source_word: ἕως ἡμέρας ἐπὶ ταφῇ εἰς μητέρα πάντων
  choice: jusqu’au jour où ils sont ensevelis dans la mère de tous
  rationale: Le grec parle explicitement du jour de l’ensevelissement. Cette traduction garde à la fois ce sens funéraire et l’image de la terre comme « mère de tous », sans ajouter l’idée de retour qui n’est pas explicitement formulée.
theological_decisions:
- issue: Emploi du parallèle grec plus développé à côté du témoin hébreu abrégé
  choice: Conserver l’affirmation hébraïque principale et traduire la limite allant de la naissance à l’ensevelissement d’après le grec, avec une note textuelle.
  alternative: Ne traduire que la courte proposition hébraïque.
  rationale: L’hébreu demeure prioritaire là où il subsiste, tandis que le grec offre ici une forme plus complète et cohérente du verset. La note rend transparente la différence entre les témoins.
- issue: Interprétation de חלק אל
  choice: Employer une tournure passive sans nommer explicitement Dieu comme agent.
  alternative: « Dieu a assigné un grand labeur » ou « un grand labeur est la part donnée par Dieu ».
  rationale: La formulation hébraïque est comprimée et peut suggérer Dieu, mais le texte grec ne le nomme pas comme agent. La tournure passive préserve cette ambiguïté au lieu de la trancher doctrinalement.
- issue: Expression anthropologique בני אדם / υἱοὺς Ἀδάμ
  choice: « les humains » dans le texte, avec la forme grecque littérale en note.
  alternative: « les fils d’Adam » ou « les enfants des hommes ».
  rationale: « Les humains » est précis, inclusif et naturel en français moderne. La note conserve pour l’étude la résonance adamique explicite du grec.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le rythme sapientiel et l’image finale du grec, tout en évitant les archaïsmes. « Labeur » reste soutenu mais courant; « humains » rend naturellement la portée universelle de בני אדם.
