  text: Everything from the earth returns to the earth[a], and what is from above to what is above.
translation:
  language: fr
  text: Tout ce qui vient de la terre retourne à la terre[a], et ce qui vient d’en haut retourne en haut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « et ce qui vient des eaux retourne à la mer. »'
    reason: Variante textuelle importante du texte grec parallèle.
lexical_decisions:
- source_word: כל
  choice: Tout ce qui
  rationale: Le collectif hébreu a une portée générale; « Tout ce qui » rend naturellement cette valeur sans limiter le propos aux personnes.
- source_word: מארץ אל ארץ
  choice: vient de la terre retourne à la terre
  rationale: La construction exprime l’origine et le retour. La répétition de « la terre » conserve le parallélisme hébreu, tandis que « vient de » explicite sobrement la relation d’origine.
- source_word: ישוב
  choice: retourne
  rationale: שוב signifie couramment « revenir, retourner »; ce verbe convient au mouvement de retour exprimé ici.
- source_word: ואשר
  choice: et ce qui
  rationale: Le relatif est compris de façon non personnelle, conformément à la portée générale et cosmique du parallélisme.
- source_word: ממרום אל מרום
  choice: vient d’en haut retourne en haut
  rationale: Cette formulation préserve l’image verticale et l’énigmatique répétition de מרום sans préciser indûment « ciel ». Le verbe « retourne » est suppléé à partir du premier membre, comme l’exige le parallélisme elliptique.
theological_decisions:
- issue: Divergence entre le second membre hébreu et le texte grec parallèle
  choice: 'Le texte principal suit l’hébreu : « et ce qui vient d’en haut retourne en haut »'
  alternative: 'Le grec porte : « et ce qui vient des eaux retourne à la mer »'
  rationale: L’hébreu conservé est retenu comme témoin principal. Son expression concise et ambiguë est préservée, tandis que la variante grecque matériellement différente est signalée en note.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste accessible tout en conservant le parallélisme, la répétition et l’ambiguïté du second membre hébreu.
