base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/006.yaml
  text: For a little while[a], like a moment, he is quiet in vain; then, from the terrors of his heart[b], he is shaken—like one fleeing from before a pursuer.
translation:
  language: fr
  text: Pendant un bref moment, en vain, il est tranquille ; au milieu des terreurs de son cœur[b], il est agité. Il se perd un peu dans la vision de son âme[a], comme un rescapé qui fuit devant celui qui le poursuit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu de cette partie est difficile : il peut se lire plus littéralement « il s’égare un peu loin de la vision de son âme ». Le texte compare ensuite l’homme à un rescapé fuyant son poursuivant ; le grec parallèle dit de même : « comme quelqu’un qui a échappé à la face de la guerre ».'
    reason: textual_variant
  - marker: b
    text: Le grec parallèle développe l’image par « dans les sommeils, comme en un jour de veille », puis parle d’une « vision de son cœur ». La présente traduction suit l’hébreu fourni, tout en conservant l’idée d’une agitation intérieure.
    reason: alternative_reading
lexical_decisions:
- source_word: מעט … כרגע
  choice: Un peu de temps… à peine un instant
  rationale: La répétition de l’idée de brièveté est conservée dans un français naturel. « À peine » rend ici la durée infime exprimée par la comparaison avec רגע, sans alourdir la phrase.
- source_word: לריק
  choice: en vain
  rationale: L’expression indique que ce bref repos est inutile ou sans effet durable ; « en vain » conserve cette nuance.
- source_word: ישקוט
  choice: il repose
  rationale: Le verbe désigne le calme ou le repos. Dans le contexte du sommeil évoqué par le parallèle grec, « il repose » est plus naturel que « il se tient tranquille », tout en restant proche de l’hébreu.
- source_word: ומבין בהלות לבו
  choice: puis, au milieu des terreurs de son cœur
  rationale: La construction hébraïque est difficile. « Au milieu de » rend prudemment מבין et situe l’agitation dans les terreurs intérieures sans imposer un lien causal absent du texte.
- source_word: נרעש
  choice: il est secoué
  rationale: Le verbe exprime une forte agitation, émotionnelle et possiblement physique. « Il est secoué » préserve ces deux dimensions.
- source_word: כשריד בורח מפני רודף
  choice: comme un rescapé qui fuit devant un poursuivant
  rationale: שריד désigne normalement un survivant ou un rescapé. La traduction maintient cette valeur lexicale ainsi que l’image nette d’une fuite devant celui qui poursuit, tout en signalant en note la difficulté textuelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve le rythme bref du repos suivi d’une agitation soudaine. « Rescapé » garde la valeur possible de שריד, tandis que les notes rendent visibles les incertitudes des témoins sans les résoudre artificiellement.
