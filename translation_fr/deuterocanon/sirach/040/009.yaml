translation:
  language: fr
  text: Peste et effusion de sang, conflits et épée, dévastation et ruine, malheur et mort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דבר
  choice: peste
  rationale: Le nom hébreu désigne couramment une épidémie meurtrière ou une pestilence; « peste » est direct et naturel dans cette énumération de fléaux.
- source_word: דם
  choice: effusion de sang
  rationale: Littéralement « sang »; dans cette liste de calamités, l’expression française rend naturellement la violence meurtrière évoquée sans préciser indûment sa forme.
- source_word: חרחר
  choice: conflits
  rationale: Le terme évoque la lutte ou la discorde; le pluriel collectif « conflits » conserve sa portée générale et correspond au parallèle grec ἔρις.
- source_word: חרב
  choice: épée
  rationale: Traduction concrète et traditionnelle du terme hébreu, qui peut aussi représenter la guerre ou la mort violente.
- source_word: שד
  choice: dévastation
  rationale: Rend l’idée de ravage destructeur et maintient le parallélisme avec « ruine ».
- source_word: שבר
  choice: ruine
  rationale: Le terme exprime la fracture, l’effondrement ou le désastre; « ruine » convient à l’enchaînement des calamités.
- source_word: רעה
  choice: malheur
  rationale: Dans ce contexte, le mot désigne une calamité plutôt qu’une faute morale; « malheur » préserve cette valeur contextuelle.
- source_word: מות
  choice: mort
  rationale: Équivalent direct du nom hébreu et terme culminant de l’énumération.
