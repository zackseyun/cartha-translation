base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/026.yaml
  text: Wealth and strength lift up the heart[a], and the fear of God is beyond both. In the fear of God there is no lack[b], and there is no need to seek support along with it.
translation:
  language: fr
  text: La richesse et la force élèvent le cœur, et la crainte de Dieu les dépasse toutes deux[a]. Dans la crainte de Dieu, il n’y a pas de manque, et il n’est pas nécessaire de chercher un appui en plus d’elle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie une comparaison elliptique : littéralement, « et, par rapport à toutes deux, la crainte de Dieu ». Le sens est que la crainte de Dieu surpasse la richesse et la force.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « et il n’est pas nécessaire de chercher avec elle un soutien ». La phrase présente la crainte de Dieu comme ne requérant aucun appui supplémentaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חיל
  choice: la richesse
  rationale: Dans son association avec כח (« force »), חיל désigne ici le plus naturellement les biens ou les ressources matérielles. Le grec χρήματα confirme ce sens.
- source_word: כח
  choice: la force
  rationale: Traduction directe et naturelle de כח, également soutenue par le grec ἰσχύς.
- source_word: יגדלו לב
  choice: élèvent le cœur
  rationale: Cette formulation conserve la métaphore hébraïque sans décider si l’élévation évoque surtout l’assurance ou l’orgueil.
- source_word: ומשניהם
  choice: mais plus que l’une et l’autre
  rationale: 'La préposition מן porte ici un sens comparatif : la crainte de Dieu surpasse à la fois la richesse et la force. « Mais » rend naturellement en français le contraste implicite dans la comparaison, tandis que la note signale la forme hébraïque plus littérale.'
- source_word: יראת אלהים
  choice: la crainte de Dieu
  rationale: L’hébreu dit explicitement אלהים, « Dieu ». « Crainte de Dieu » conserve la formule sapientielle et sa tension entre peur, respect, émerveillement et obéissance.
- source_word: מחסור
  choice: rien ne manque
  rationale: Cette tournure française naturelle rend l’absence de manque ou de déficience exprimée par מחסור.
- source_word: ואין לבקש עמה משען
  choice: et avec elle, il n’est pas nécessaire de chercher un appui
  rationale: La traduction garde עמה (« avec elle ») et משען (« appui, soutien »), tout en exprimant naturellement que la crainte de Dieu ne requiert aucun soutien supplémentaire.
theological_decisions:
- issue: Sens de יראת אלהים
  choice: la crainte de Dieu
  alternative: le respect profond de Dieu
  rationale: La formule traditionnelle conserve toute la portée du motif sapientiel et n’atténue pas la tension entre crainte, révérence et obéissance.
- issue: Suffisance de la crainte de Dieu
  choice: avec elle, il n’est pas nécessaire de chercher un appui
  alternative: on ne cherche pas d’aide en elle
  rationale: Le suffixe de עמה signifie « avec elle », et le contexte hébreu affirme qu’aucun appui additionnel n’est nécessaire. La traduction évite de faire dire au texte qu’on ne peut trouver d’aide dans la crainte de Dieu.
translation_notes:
  register: Français international actuel, digne et accessible. La structure en deux phrases suit le mouvement du texte hébreu. Le parallélisme est conservé, ainsi que la métaphore du cœur et l’expression biblique « crainte de Dieu ».
