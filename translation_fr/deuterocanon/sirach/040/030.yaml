translation:
  language: fr
  text: Pour un homme à l’âme forte[a], la mendicité lui adoucit l’âme[b], mais au-dedans de lui elle brûle comme un feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu est difficile et peut se comprendre littéralement comme « pour un homme à l’âme forte ». Le grec porte « dans la bouche d’une personne sans honte », ce qui peut indiquer ici l’effronterie.
    reason: alternative_reading
  - marker: b
    text: Ou « la demande lui adoucit l’âme ». Le grec désigne plus précisément l’action de mendier.
    reason: lexical_alternative
lexical_decisions:
- source_word: לאיש עוז נפש
  choice: pour l’homme sans honte
  rationale: L’hébreu est difficile et signifie littéralement quelque chose comme « pour un homme fort d’âme ». Dans ce contexte, le parallèle grec (« dans la bouche d’une personne sans honte ») indique qu’il s’agit plutôt d’assurance effrontée que de courage estimable. La formulation retenue exprime clairement cette nuance morale, tandis que le sens littéral de l’hébreu est conservé en note.
- source_word: תמתיק שאלה
  choice: mendier est doux
  rationale: שאלה désigne une demande ou l’action de demander; le grec ἐπαίτησις précise ici l’idée de mendicité. « Mendier est doux » conserve l’image paradoxale de la douceur sans ajouter d’explication absente du texte.
- source_word: ובקרבו
  choice: mais au fond de lui
  rationale: קרב désigne l’intérieur du corps ou l’être intérieur. « Au fond de lui » est idiomatique en français et maintient l’opposition entre l’attrait apparent et la brûlure intérieure. La conjonction est rendue par « mais » pour exprimer ce contraste implicite.
- source_word: תבער כמו אש
  choice: cela brûle comme un feu
  rationale: Le verbe féminin peut renvoyer à שאלה, la demande ou la mendicité. « Cela » reprend naturellement en français l’action de mendier et préserve la comparaison vive sans préciser indûment la nature de la souffrance.
theological_decisions:
- issue: Interprétation de לאיש עוז נפש
  choice: une impudence sans honte
  alternative: un homme fort d’âme ou de caractère
  rationale: La lettre de l’hébreu permet une lecture positive liée à la force intérieure, mais le parallèle grec et le contexte proverbial favorisent une qualité négative, l’effronterie. La traduction suit ce sens tout en signalant l’ambiguïté textuelle en note.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Sans honte » reste accessible et dignifié; « au fond de lui » rend naturellement l’intériorité sans réduire קרב au seul ventre. Les deux notes rendent visibles les principales incertitudes du texte hébreu et l’apport du parallèle grec.
