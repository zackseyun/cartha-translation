  - severity: medium
    issue: « mendier est doux » ne reflète pas explicitement le verbe causatif « adoucir » ni le terme נפש.
    rationale: La formulation française est possible comme paraphrase, mais « la mendicité lui adoucit l’âme » représente plus exactement la relation syntaxique et l’image de l’hébreu.
