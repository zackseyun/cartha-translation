  naturalness: « Pour un homme à l’âme forte, la mendicité lui adoucit l’âme » est compréhensible, proverbial et naturel dans un registre biblique moderne. « Au-dedans de lui » rend sobrement בקרבו et « elle brûle comme un feu » maintient le référent féminin, la mendicité/demande.
  terminology: « Mendicité » est plus nominal et plus apte à porter les pronoms que l’infinitif « mendier »; il correspond bien au grec ἐπαίτησις, tout en étant précisé par une note puisque שאלה peut désigner la demande. « Âme forte » est une restitution prudente de עוז נפש, sans imposer le jugement moral négatif que suggère le grec.
