  text: Grace and beauty delight the eye[b][a], and better than both is the vegetation of the field.
translation:
  language: fr
  text: La beauté et l’apparence plaisent à l’œil[a], mais la végétation des champs vaut mieux que l’une et l’autre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie un terme qui peut désigner la forme ou l’apparence. Le grec parallèle lit « la grâce et la beauté ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu parle des pousses ou des plantes du champ; le grec évoque la verdure des semailles, c’est-à-dire une végétation fraîche plutôt que des produits déjà récoltés.
    reason: alternative_reading
lexical_decisions:
- source_word: יפי
  choice: la beauté
  rationale: Le nom désigne la beauté ou l’attrait; « beauté » est l’équivalent français moderne le plus direct.
- source_word: ותאר
  choice: et l’élégance
  rationale: תאר désigne proprement la forme ou l’apparence. Dans ce parallélisme avec « beauté », « élégance » exprime naturellement une apparence harmonieuse, tandis que la note conserve le sens plus formel; le grec χάριν appuie une nuance de grâce.
- source_word: יחמידו עין
  choice: réjouissent le regard
  rationale: Le verbe חמד peut exprimer le désir ou le plaisir pris à quelque chose. Cette formulation française idiomatique conserve ici l’idée d’un attrait visuel sans suggérer nécessairement la convoitise.
- source_word: ומשניהם
  choice: mais plus encore
  rationale: La construction établit une supériorité par rapport aux deux qualités précédentes; le grec ὑπὲρ ἀμφότερα confirme cette valeur comparative.
- source_word: צמחי שדה
  choice: la verdure des champs
  rationale: צמחי désigne ce qui pousse, les plantes ou les jeunes pousses. « La verdure des champs » rend naturellement l’image d’une végétation fraîche, également appuyée par le grec χλόην σπόρου.
