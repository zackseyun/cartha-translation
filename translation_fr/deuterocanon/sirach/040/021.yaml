  text: Flute and harp make song sweet[a], but better than both is a pure tongue.
translation:
  language: fr
  text: La flûte et la harpe rendent le chant agréable, mais une langue pure les surpasse toutes deux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec parallèle porte : « une langue agréable », ou « des paroles agréables ».'
    reason: alternative_reading
lexical_decisions:
- source_word: חליל
  choice: flûte
  rationale: Désigne un instrument à vent, probablement une flûte ou un chalumeau; « flûte » est le terme moderne le plus clair et correspond au parallèle grec αὐλός.
- source_word: נבל
  choice: harpe
  rationale: Désigne un instrument à cordes pincées; « harpe » est naturel dans le registre biblique français, tandis que le grec ψαλτήριον confirme le type général d’instrument.
- source_word: יעריבו שיר
  choice: rendent le chant agréable
  rationale: Le verbe ערב exprime ici le fait de rendre doux ou plaisant; cette formulation française conserve la valeur causative sans forcer l’image de la douceur.
- source_word: ומשניהם
  choice: mais mieux encore que toutes deux
  rationale: La construction établit une comparaison de supériorité. « Toutes deux » reprend clairement les deux instruments, et « mais mieux encore » restitue le contraste naturel en français.
- source_word: לשון
  choice: langue
  rationale: Le terme signifie littéralement « langue » et désigne ici la parole par métonymie; garder l’image concrète respecte l’hébreu et le grec γλῶσσα.
- source_word: ברה
  choice: pure
  rationale: L’adjectif hébreu signifie le plus naturellement « pure, nette ». Cette traduction conserve la nuance propre au témoin hébreu, sans l’assimiler au grec « agréable ».
theological_decisions:
- issue: Nuance différente entre l’hébreu et le grec dans le dernier membre
  choice: une langue pure
  alternative: une langue agréable / des paroles agréables
  rationale: Le texte hébreu conservé, retenu comme source principale, porte לשון ברה, « une langue pure ». Le grec parallèle a γλῶσσα ἡδεῖα, « une langue agréable/douce », nuance significative indiquée en note plutôt que substituée au texte hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation avec deux-points met en relief le dernier élément sans ajouter de contenu. « Langue pure » conserve l’image et l’ambiguïté éthique ou qualitative de l’hébreu.
