  text: From force to force[a], like a perennial wadi, and from a mighty channel[c][b], with a crash of sounds.
translation:
  language: fr
  text: De force en force, comme un torrent intarissable[c], et d’un lit puissant[b], dans un fracas de grondements[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle dit : « Les richesses des injustes se dessécheront comme un fleuve, et elles retentiront comme un grand coup de tonnerre sous la pluie. » Il reflète une forme du texte nettement différente de l’hébreu conservé.'
    reason: alternative_reading
  - marker: b
    text: Le texte hébreu de cette ligne est difficile, et le fragment de Massada correspondant est trop incomplet pour en établir la formulation avec certitude. La traduction suit l’hébreu de la Gueniza du Caire, tout en tenant compte du texte grec parallèle.
    reason: textual_variant
  - marker: c
    text: 'Autre traduction possible : « un oued au cours permanent ». Le mot hébreu נחל désigne souvent un oued ou le lit d’un torrent, et איתן suggère ici un débit durable ou intarissable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מחיל אל חיל
  choice: de force en force
  rationale: חיל peut désigner la force, la puissance, les richesses ou une armée. Dans la formulation hébraïque elliptique et avec l’image torrentielle qui suit, « de force en force » conserve la répétition et l’idée d’un élan croissant sans importer la lecture grecque différente.
- source_word: נחל איתן
  choice: un torrent intarissable
  rationale: נחל désigne souvent un torrent ou son lit, tandis que איתן évoque ici la permanence et la vigueur. « Torrent intarissable » rend naturellement en français l’image paradoxale d’un cours torrentiel au débit durable.
- source_word: אפיק אדיר
  choice: un lit puissant
  rationale: אפיק désigne le lit ou le chenal d’un cours d’eau, et אדיר sa puissance. « Lit puissant » maintient l’image topographique et le parallélisme avec le torrent.
- source_word: בחזיז קולות
  choice: dans un fracas de grondements
  rationale: La locution est rare et difficile. קולות peut désigner des sons, des voix ou des grondements de tonnerre. Cette traduction restitue la violence sonore tout en évitant d’identifier trop précisément le phénomène.
