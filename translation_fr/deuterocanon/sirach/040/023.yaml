  text: A companion and a friend conduct themselves for a time, but better than both is an intelligent wife.
translation:
  language: fr
  text: Un compagnon et un ami cheminent ensemble pour un temps[b], mais une épouse avisée vaut mieux que l’un et l’autre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit « femme », terme qui peut aussi signifier « épouse » ; le parallèle grec oriente plus précisément vers le sens conjugal.
    reason: lexical_alternative
  - marker: b
    text: Ou « au moment opportun ». L’hébreu et le parallèle grec expriment tous deux l’idée de temps ; il peut s’agir d’une durée limitée ou du moment qui convient.
    reason: alternative_reading
lexical_decisions:
- source_word: עמית
  choice: compagnon
  rationale: Le terme désigne un proche associé ou un compagnon; « compagnon » convient au contexte relationnel et se distingue de רע.
- source_word: רע
  choice: ami
  rationale: « Ami » rend naturellement la relation personnelle exprimée par רע et préserve la paire de termes apparentés, mais distincts.
- source_word: לעת
  choice: pour un temps
  rationale: Cette expression conserve la valeur temporelle de l’hébreu sans trancher entièrement entre une durée limitée et le moment opportun; la note signale l’autre nuance possible.
- source_word: ינהגו
  choice: font route
  rationale: Cette formulation française naturelle conserve l’idée dynamique de נהג — aller, mener sa conduite — sans lui ajouter explicitement la notion d’utilité.
- source_word: ומשניהם
  choice: mais mieux que l’un et l’autre vaut
  rationale: La structure comparative, confirmée par le grec ὑπὲρ ἀμφότερα, indique que la personne mentionnée ensuite surpasse les deux relations précédentes.
- source_word: אשה
  choice: épouse
  rationale: L’hébreu peut signifier « femme » ou « épouse »; le parallèle grec, γυνὴ μετὰ ἀνδρός, oriente ici vers la relation conjugale.
- source_word: משכלת
  choice: avisée
  rationale: « Avisée » exprime une intelligence pratique faite de discernement et de bon sens, conformément à la valeur sapientielle du terme.
theological_decisions:
- issue: Faut-il comprendre אשה au sens général de « femme » ou au sens conjugal d’« épouse » ?
  choice: épouse
  alternative: femme
  rationale: L’hébreu permet les deux lectures, mais le parallèle grec évoque une femme avec un homme ou mari et favorise le sens conjugal. Une note maintient visible l’ambiguïté de l’hébreu.
translation_notes:
  register: Français international moderne, sobre et sapientiel. « Font route » garde une image relationnelle dynamique sans la tournure peu naturelle « se conduisent pour un temps ». L’inversion « mieux… vaut » donne une comparaison claire et digne.
