  source_fidelity: 'Le texte principal suit correctement la ligne hébraïque conservée : l’inquiétude est liée à « toute chair » et la richesse prive de sommeil. La note signale à juste titre l’expansion du grec sans l’intégrer au texte hébreu. Une légère reformulation rend mieux en français le collectif « toute chair » et les suffixes possessifs.'
  naturalness: « Et chez tout être de chair, leur inquiétude les accompagne » est compréhensible, mais l’enchaînement d’un singulier collectif (« tout être ») avec « leur/les » est heurté. « Tout être de chair porte son inquiétude avec lui » est idiomatique, conserve l’image d’une inquiétude qui demeure avec chacun, et maintient un registre biblique sobre.
  terminology: « Être de chair », « inquiétude », « richesse » et « sommeil » conviennent au français international moderne. « Chasse son sommeil » restitue avec vivacité le verbe hébreu exprimant l’éloignement ou la perturbation du sommeil. La note emploie « bétail », traduction appropriée de κτῆνος dans ce contraste avec l’être humain.
