  text: And with all flesh their anxiety is with them[a], and their wealth drives away their sleep.
translation:
  language: fr
  text: Et tout être de chair porte son inquiétude avec lui[a], et sa richesse chasse son sommeil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle porte : « avec tout être de chair, de l’être humain jusqu’au bétail, et, pour les pécheurs, sept fois plus que cela ». Cette formulation plus longue ne figure pas dans la ligne hébraïque conservée qui est suivie ici.'
    reason: alternative_reading
lexical_decisions:
- source_word: ועם כל בשר
  choice: Et chez tout être de chair
  rationale: La préposition עם peut ici marquer l’association ou la présence « chez/parmi ». « Tout être de chair » conserve l’image collective de בשר tout en restant compréhensible en français moderne.
- source_word: דאגתם עמם
  choice: leur inquiétude les accompagne
  rationale: דאגה exprime le souci anxieux; עמם signifie littéralement « avec eux ». Le verbe « accompagne » restitue naturellement l’image d’une inquiétude qui demeure avec les êtres vivants.
- source_word: ועשרם
  choice: et leur richesse
  rationale: עשרם désigne leur richesse ou leurs biens. « Richesse » est direct, naturel et garde le lien avec les possessions comme cause d’insomnie.
- source_word: מניד שנתם
  choice: chasse leur sommeil
  rationale: La forme verbale évoque le fait de mettre en mouvement ou d’éloigner. Avec « sommeil », « chasse » préserve l’image vive du sommeil repoussé.
theological_decisions:
- issue: Priorité du texte hébreu face à la forme grecque plus longue
  choice: Le texte principal suit la ligne hébraïque conservée; la forme grecque plus développée figure en note.
  alternative: Intégrer au texte principal « de l’être humain jusqu’au bétail, et, pour les pécheurs, sept fois plus que tout cela ».
  rationale: L’hébreu est ici disponible avec une confiance élevée. Le grec constitue un témoin parallèle important, mais son développement n’est pas attesté dans la ligne hébraïque citée; la note préserve donc cette variante sans l’introduire silencieusement dans le texte.
translation_notes:
  register: Français international moderne, sobre et digne. « Être de chair » maintient l’image biblique sans employer le calque moins naturel « toute chair »; le parallélisme et la concision de l’hébreu sont conservés.
