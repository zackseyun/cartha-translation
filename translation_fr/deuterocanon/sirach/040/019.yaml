  text: Children and the building of a city establish a name[b][a], but better than both is a blameless wife.
translation:
  language: fr
  text: Des enfants et la construction d’une ville assurent une renommée[a][b], mais une épouse irréprochable vaut plus que tous deux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu de la Guéniza du Caire porte approximativement : « et de tous deux vient la sagesse » ; le grec lit : « mais, plus que tous deux, une épouse irréprochable est estimée ». La relation entre ces leçons est incertaine ; le texte principal suit ici le sens grec, qui donne une maxime comparative cohérente.'
    reason: alternative_reading
  - marker: b
    text: L’ancien rouleau de Massada est fragmentaire à cet endroit et ne conserve pas assez de texte pour permettre d’établir avec certitude la formulation finale.
    reason: textual_variant
lexical_decisions:
- source_word: ילד / τέκνα
  choice: Des enfants
  rationale: Le nom hébreu peut avoir une valeur collective, et le grec porte explicitement le pluriel. « Des enfants » est naturel en français et convient à l’énumération sapientielle.
- source_word: ועיר יעמידו שם / οἰκοδομὴ πόλεως στηρίζουσιν ὄνομα
  choice: la construction d’une ville font durer un nom
  rationale: L’hébreu transmis est difficile, tandis que le grec précise « construction d’une ville ». « Faire durer un nom » rend naturellement l’idée d’établir durablement un nom, c’est-à-dire une renommée.
- source_word: שם
  choice: un nom
  rationale: Le mot signifie ici aussi la réputation ou la renommée durable. Le maintien de « nom » préserve l’image sémitique sans rendre la phrase obscure.
- source_word: ὑπὲρ ἀμφότερα
  choice: vaut plus que l’un et l’autre
  rationale: Cette formulation exprime clairement la comparaison du grec et reste compatible avec le tour comparatif suggéré par ומשניהם.
- source_word: γυνὴ ἄμωμος
  choice: une épouse irréprochable
  rationale: Le contexte favorise « épouse » plutôt que le terme plus général « femme ». « Irréprochable » exprime une conduite sans blâme sans suggérer une perfection absolue.
theological_decisions:
- issue: Choix entre la leçon hébraïque difficile et le parallèle grec pour la dernière proposition
  choice: 'Le texte principal suit le sens cohérent du grec : « une épouse irréprochable vaut plus que l’un et l’autre ».'
  alternative: 'Traduire le texte hébreu du premier distique : « de l’un et de l’autre vient la découverte de la sagesse »; ou tenir compte du distique hébreu suivant, qui parle d’« une épouse désirable ».'
  rationale: Les témoins hébreux transmis présentent ici un agencement et des formulations difficiles, tandis que le grec conserve une maxime comparative cohérente. La note signale les leçons hébraïques au lieu de masquer l’incertitude textuelle.
translation_notes:
  register: Français international moderne, sobre et sapientiel. « Font durer un nom » conserve l’image biblique tout en explicitant sa valeur de pérennité; « vaut plus que l’un et l’autre » rend la comparaison sans raideur.
