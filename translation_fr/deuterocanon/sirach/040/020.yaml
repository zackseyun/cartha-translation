  text: Wine and strong drink gladden the heart, but better than both is the love of lovers.
translation:
  language: fr
  text: Le vin et la boisson forte réjouissent le cœur, mais plus que tous deux, l’amour des amants.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Le vin et la musique réjouissent le cœur, et plus que tous deux, l’amour de la sagesse. »'
    reason: 'Signaler une variante ancienne substantielle : « musique » au lieu de « boisson forte » et « sagesse » au lieu d’« amants ».'
lexical_decisions:
- source_word: יין
  choice: le vin
  rationale: Équivalent direct et courant du terme hébreu.
- source_word: שכר
  choice: la boisson forte
  rationale: Désigne une boisson enivrante distincte du vin ; cette formulation conserve cette distinction sans préciser une boisson particulière.
- source_word: יעליצו לב
  choice: réjouissent le cœur
  rationale: Rend naturellement l’idée de provoquer la joie intérieure exprimée par le causatif hébreu.
- source_word: אהבת דודים
  choice: l’amour des amants
  rationale: Conserve le génitif et l’ambiguïté du mot דודים, qui peut évoquer les amants, l’amour ou les marques d’affection, sans lui substituer la lecture grecque « amour de la sagesse ».
theological_decisions:
- issue: Relation comparative entre les boissons et l’amour
  choice: mais plus que tous deux
  alternative: et, venant des deux, l’amour des amants
  rationale: Le contexte comparatif et le parallèle grec appuient le sens « plus que tous deux », même si la forme hébraïque est concise ; « mais » exprime naturellement le contraste implicite.
- issue: Divergence entre le texte hébreu et le parallèle grec
  choice: Suivre le texte hébreu dans le corps du verset
  alternative: « le vin et la musique… l’amour de la sagesse »
  rationale: La source hébraïque fournie est de haute confiance et doit être traduite en priorité ; la divergence grecque, importante pour l’histoire du texte, est signalée en note.
translation_notes:
  register: Français international moderne, simple et digne. La tournure « l’amour des amants » reste volontairement proche de l’hébreu et en préserve la tension sémantique.
