translation:
  language: fr
  text: de celui qui siège sur un trône élevé[a] à celui qui retourne à la poussière et à la cendre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec porte : « de celui qui siège sur un trône dans la gloire à celui qui est abaissé dans la terre et la cendre ». Il explicite la gloire et l’abaissement, que le texte hébreu ne formule pas expressément.'
    reason: alternative_reading
lexical_decisions:
- source_word: מיושב
  choice: depuis celui qui siège
  rationale: Le préfixe מ marque le point de départ d’un éventail (« depuis »), tandis que le participe יושב décrit celui qui est assis ou siège. « Celui qui siège » convient naturellement au contexte royal du trône.
- source_word: כסא
  choice: trône
  rationale: כסא désigne couramment un trône dans un contexte d’élévation ou de royauté; le grec θρόνος confirme ce sens.
- source_word: לגבה
  choice: élevé
  rationale: Le terme exprime la hauteur ou l’exaltation. « Trône élevé » conserve à la fois la dimension spatiale et la dignité sociale, sans introduire la « gloire » explicitée seulement dans le parallèle grec.
- source_word: עד
  choice: jusqu’à
  rationale: Dans cette construction, עד indique l’autre extrémité d’un éventail allant du rang le plus élevé à la condition mortelle la plus humble.
- source_word: לשוב
  choice: celui qui retourne
  rationale: L’infinitif précédé de ל désigne ici l’autre terme de la comparaison. Cette formulation préserve l’idée biblique du retour de l’être humain à la poussière.
- source_word: עפר ואפר
  choice: la poussière et la cendre
  rationale: Cette paire biblique évoque la mortalité, l’abaissement et la fragilité humaines. Le singulier collectif est idiomatique en français et reste proche de l’hébreu.
theological_decisions:
- issue: Primauté du texte hébreu face au parallèle grec dans la description de toute l’étendue de la condition humaine
  choice: Traduire directement l’hébreu comme un contraste allant du trône élevé au retour à la poussière et à la cendre.
  alternative: « depuis celui qui siège sur un trône dans la gloire jusqu’à celui qui est abaissé dans la terre et la cendre »
  rationale: L’hébreu, témoin principal ici, formule sobrement le contraste entre le plus haut rang social et l’issue mortelle commune. Le grec confirme le sens général, mais explicite la gloire et l’abaissement; ces éléments ne sont donc pas introduits dans le texte principal.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la structure corrélative « depuis… jusqu’à… » et le contraste lapidaire de l’hébreu. « Siège » marque naturellement la dignité associée au trône; « retourne à la poussière » maintient l’écho biblique de la mortalité.
