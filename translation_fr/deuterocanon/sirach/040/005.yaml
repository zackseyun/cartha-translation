base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/005.yaml
  text: Yet envy[a], anxiety, and fear, and the dread of death, bring contention in abundance; and at the time of his rest upon his bed[b], the sleep of night changes his misery.
translation:
  language: fr
  text: Mais la jalousie, l’inquiétude, la peur et la terreur de la mort suscitent des querelles en grand nombre[a] ; et, quand il repose sur son lit, le sommeil de la nuit modifie sa détresse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu de cette proposition est condensé et son sens exact demeure incertain. Le grec présente une liste plus développée de troubles, où figurent notamment la colère et la querelle.
    reason: alternative_reading
  - marker: b
    text: Ou « change son malheur ». Le mot hébreu désigne probablement ici sa condition pénible, et non un mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: קנאה
  choice: jalousie
  rationale: Dans cette série de tourments intérieurs, le mot a un sens négatif. « Jalousie » rend naturellement קנאה et reste compatible avec le grec ζῆλος.
- source_word: דאגה
  choice: inquiétude
  rationale: Le terme désigne un souci qui trouble. « Inquiétude » est courant, précis et adapté au registre sapientiel.
- source_word: פחד
  choice: peur
  rationale: Traduction directe, sans renforcer indûment l’intensité du terme.
- source_word: אימת מות
  choice: terreur de la mort
  rationale: « Terreur » conserve la force de אימה, tandis que la construction française rend clairement le groupe nominal hébreu.
- source_word: תחרה ורב
  choice: suscitent querelles en abondance
  rationale: La formule hébraïque est condensée et difficile. Cette traduction en exprime prudemment le sens probable de conflit abondant, que soutient la mention grecque de la colère et de la querelle.
- source_word: ועת נוחו
  choice: et quand il repose
  rationale: Formulation française fluide qui conserve la valeur temporelle de עת et l’idée de repos.
- source_word: על משכבו
  choice: sur son lit
  rationale: Rendu direct et naturel de l’expression hébraïque.
- source_word: שינת לילה
  choice: le sommeil de la nuit
  rationale: Conserve la structure poétique du groupe hébreu tout en restant idiomatique en français.
- source_word: תשנה
  choice: transforme
  rationale: Le verbe signifie changer ou altérer. « Transforme » préserve ce sens sans préciser à tort si le changement améliore ou aggrave l’état.
- source_word: רעתו
  choice: sa détresse
  rationale: Dans ce contexte, רעה renvoie vraisemblablement à une condition pénible plutôt qu’au mal moral. « Détresse » garde cette portée sans surinterprétation.
theological_decisions:
- issue: Primauté du texte hébreu et recours au parallèle grec pour une proposition difficile
  choice: Suivre l’hébreu conservé, tout en laissant le grec éclairer le sens probable de תחרה ורב.
  alternative: Développer dans le texte principal la liste grecque en ajoutant explicitement colère, agitation et querelle.
  rationale: L’hébreu est ici le témoin principal. Le grec confirme le champ sémantique du trouble et du conflit, mais son énumération plus longue ne doit pas être importée sans signalement dans le texte français.
- issue: Sens de רעתו
  choice: Comprendre le mot comme la détresse ou la condition pénible de la personne.
  alternative: Le rendre par « son mal », avec une possible connotation morale.
  rationale: Le contexte porte sur les souffrances et les troubles du sommeil, non sur une faute morale. La traduction choisie évite d’introduire une lecture doctrinale étrangère au passage.
translation_notes:
  register: Français moderne, international et digne, avec une cadence sapientielle sobre. La formulation reste proche de l’hébreu tout en signalant les deux difficultés textuelles et lexicales majeures.
