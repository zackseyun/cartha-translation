- from: Mais jalousie, inquiétude et peur, terreur de la mort, suscitent querelles en abondance[a] ; et quand il repose sur son lit, le sommeil de la nuit transforme sa détresse[b].
  to: Mais la jalousie, l’inquiétude, la peur et la terreur de la mort suscitent des querelles en grand nombre[a] ; et, quand il repose sur son lit, le sommeil de la nuit modifie sa détresse[b].
  rationale: La révision corrige la coordination française, améliore une expression elliptique sans résoudre artificiellement la difficulté de תחרה ורב, et remplace « transforme » par « modifie », plus proche de תשנה. Les notes conservent explicitement les deux zones d’incertitude et l’apport limité du parallèle grec.
