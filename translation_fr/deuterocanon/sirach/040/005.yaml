  terminology: « Jalousie », « inquiétude », « peur » et « terreur de la mort » sont appropriés au registre et aux termes sources. « Détresse » convient pour רעתו, compris comme condition pénible plutôt que mal moral. Aucun enjeu doctrinal ni nom propre n’est en cause.
