  text: The offspring of violence will not go unpunished[b][a], for the root of the godless is on a jagged crag.
translation:
  language: fr
  text: Ce qui naît de la violence ne restera pas impuni, car la racine de l’impie est sur un escarpement rocheux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque est difficile et évoque littéralement une « dent » de roche, c’est-à-dire une saillie rocheuse abrupte. Le grec présente une formulation différente : « La descendance des impies ne multipliera pas ses branches, et des racines impures sont sur un rocher escarpé. »'
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: נוצר
  choice: ce qui naît
  rationale: Dans ce contexte, le terme désigne ce qui est produit ou issu de quelque chose. Le grec ἔκγονα confirme l’idée de descendance ou de produit, mais le tour français « ce qui naît » préserve une certaine amplitude du singulier hébreu.
- source_word: מחמס
  choice: de la violence
  rationale: חמס désigne couramment la violence, l’injustice brutale ou le tort. « De la violence » conserve la valeur forte du texte hébreu.
- source_word: לא ינקה
  choice: ne restera pas impuni
  rationale: À la forme négative, נקה exprime couramment l’idée de ne pas être acquitté, tenu pour innocent ou exempté de sanction. Cette formulation rend clairement la portée judiciaire de l’expression.
- source_word: שרש
  choice: la racine
  rationale: Le singulier du texte hébreu est maintenu et convient à la métaphore végétale.
- source_word: חנף
  choice: de l’impie
  rationale: חנף peut désigner l’homme impie, profane ou moralement corrompu. « L’impie » rend sa force morale et religieuse sans le réduire au sens moderne d’« hypocrite ».
- source_word: על שן תלע
  choice: sur un escarpement rocheux
  rationale: L’expression hébraïque est difficile. שן, littéralement « dent », peut évoquer une saillie rocheuse aiguë; le grec ἐπ’ ἀκροτόμου πέτρας confirme l’image d’un rocher abrupt ou taillé à pic. « Escarpement rocheux » restitue cette image en français naturel.
theological_decisions:
- issue: Priorité du texte hébreu lorsque le grec présente une formulation différente
  choice: 'Le premier membre suit l’hébreu : « Ce qui naît de la violence ne restera pas impuni »; le grec est signalé en note.'
  alternative: « La descendance des impies ne multipliera pas ses branches. »
  rationale: Le témoin hébreu conservé est prioritaire. Le grec diffère sensiblement, tout en confirmant le thème d’une croissance corrompue et précaire; sa lecture est donc préservée sans remplacer le texte hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme et les métaphores de naissance et de racine sont conservés. La formulation évite de préciser indûment si נוצר désigne exclusivement une descendance humaine ou, plus largement, le produit de la violence.
