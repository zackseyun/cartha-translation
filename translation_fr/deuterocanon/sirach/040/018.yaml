  text: Wine and strong drink sweeten life[a], but better than both is finding a treasure.
translation:
  language: fr
  text: Le vin et les boissons fortes rendent la vie douce[a], mais trouver un trésor vaut mieux que les deux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est concis : « Le vin et la boisson forte adoucissent la vie, et au-delà des deux, trouver un trésor. » Le grec exprime lui aussi une comparaison : « au-dessus des deux ».'
    reason: La seconde proposition hébraïque est elliptique ; la traduction en explicite la valeur comparative.
lexical_decisions:
- source_word: חיי
  choice: la vie
  rationale: 'Le syntagme hébreu est rendu idiomatiquement comme l’objet de ימתקו : ces boissons rendent la vie agréable.'
- source_word: יין
  choice: le vin
  rationale: Équivalent français courant et précis du breuvage fermenté issu du raisin.
- source_word: ושכר
  choice: et les boissons enivrantes
  rationale: שכר désigne largement une boisson alcoolisée autre que le vin. Le pluriel générique est naturel en français et évite de préciser sans certitude « bière » ou « boisson forte ».
- source_word: ימתקו
  choice: rendent … douce
  rationale: Préserve l’image de la douceur portée par la racine מתק, dans une tournure française naturelle.
- source_word: ומשניהם
  choice: mais … vaut mieux que l’un et les autres
  rationale: Le contexte et le grec ὑπὲρ ἀμφότερα soutiennent une comparaison de supériorité. La formule française renvoie distinctement au vin et à la catégorie plurielle des autres boissons.
- source_word: מוצא
  choice: trouver
  rationale: Rend naturellement la forme participiale ou nominale hébraïque; le grec ὁ εὑρίσκων confirme l’idée de trouver.
- source_word: אוצר
  choice: un trésor
  rationale: Le contexte vise un bien précieux plutôt qu’un entrepôt; le grec θησαυρόν confirme ce sens.
