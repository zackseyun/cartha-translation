translation_notes:
  register: Français moderne, digne et accessible. La structure « depuis… jusqu’à… » conserve la formule d’étendue du contexte. « Modeste » évite l’expression peu naturelle « petit turban », tandis que la note signale sans l’harmoniser la variante grecque.
