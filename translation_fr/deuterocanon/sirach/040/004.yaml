translation:
  language: fr
  text: depuis celui qui porte un turban et un diadème fleuri[a], jusqu’à celui qui est enveloppé d’un vêtement de peau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « depuis celui qui porte de la pourpre bleue et une couronne, jusqu’à celui qui est vêtu d’un vêtement de lin grossier ». Les témoins hébreu et grec diffèrent quant aux vêtements évoqués, tout en décrivant la même étendue sociale.'
    reason: textual_variant
lexical_decisions:
- source_word: מעוטה
  choice: modeste
  rationale: Le terme qualifie vraisemblablement צניף et évoque quelque chose de peu important ou de modeste. « Modeste » rend mieux en français naturel la valeur sociale possible que le calque « petit », sans la préciser excessivement.
- source_word: צניף
  choice: turban
  rationale: Désigne une étoffe enroulée autour de la tête. « Turban » est ici concis, naturel et compatible avec l’image vestimentaire.
- source_word: וציץ
  choice: et un diadème fleuri
  rationale: ציץ peut désigner une fleur, un ornement frontal ou un diadème. Cette formulation conserve la nuance florale de l’hébreu tout en exprimant clairement qu’il s’agit d’une parure de tête; le grec parallèle porte « couronne ».
- source_word: ועד
  choice: jusqu’à
  rationale: Marque l’autre extrémité de la gamme sociale ou matérielle décrite par le contexte.
- source_word: עוטה
  choice: est enveloppé
  rationale: Le participe exprime le fait d’être couvert ou enveloppé d’un vêtement; cette traduction préserve l’image concrète.
- source_word: שמלת עור
  choice: un vêtement de peau
  rationale: Traduction proche de l’expression hébraïque, sans décider s’il s’agit de cuir travaillé ou d’une peau plus grossière.
