translation:
  language: fr
  text: Mon enfant[a], ne mène pas une vie de mendiant[b] ; mieux vaut mourir[c] que mendier[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Mon enfant » figure dans le grec ; cette apostrophe est absente de la ligne hébraïque conservée.
    reason: textual_variant
  - marker: b
    text: L’expression hébraïque traduite par « vie de mendiant » est difficile ; le grec indique une vie passée à demander l’aumône.
    reason: lexical_alternative
  - marker: c
    text: L’hébreu dit littéralement « être recueilli », expression employée pour la mort ; le grec porte explicitement « mourir ».
    reason: idiom
  - marker: d
    text: Le dernier mot hébreu est obscur ; le grec confirme ici le sens « mendier ».
    reason: alternative_reading
lexical_decisions:
- source_word: חיי
  choice: une vie de
  rationale: Le nom à l’état construit désigne ici une manière ou une condition de vivre ; « une vie de » rend naturellement cet emploi en français.
- source_word: מכי מתן
  choice: mendiant
  rationale: L’expression hébraïque est difficile. Le parallèle grec, avec ἐπαίτησις, indique une vie passée à solliciter des dons ou des aumônes ; « mendiant » en exprime clairement le sens probable.
- source_word: אל תחי
  choice: ne mène pas
  rationale: Littéralement « ne vis pas ». Avec « une vie de mendiant », le français idiomatique demande « ne mène pas » sans modifier la force de l’interdiction.
- source_word: טוב
  choice: mieux vaut
  rationale: Le mot a ici une valeur comparative, confirmée par le grec κρεῖσσον ; « mieux vaut » est la tournure française naturelle.
- source_word: נאסף
  choice: mourir
  rationale: Littéralement « être recueilli/réuni », expression hébraïque pouvant évoquer la mort. Le grec ἀποθανεῖν en explicite directement le sens.
- source_word: כמסתולל
  choice: que mendier
  rationale: La forme hébraïque est obscure, mais le grec ἐπαιτεῖν soutient nettement le sens de « mendier ». La comparaison est ainsi rendue en français courant.
- source_word: τέκνον
  choice: Mon enfant
  rationale: Cette apostrophe figure dans le parallèle grec, mais pas dans la ligne hébraïque conservée. « Mon enfant » restitue son ton sapientiel et évite le masculin plus restrictif de « mon fils ».
