  text: Kindness will never be shaken[b][a], and righteousness will stand forever.
translation:
  language: fr
  text: La bonté ne chancellera jamais[a][b], et la justice restera ferme pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle porte : « La grâce est comme un paradis de bénédictions, et l’aumône demeure pour toujours. » Le témoin hébreu lit plutôt « la bonté… et la justice… ».'
    reason: alternative_reading
  - marker: b
    text: À cet endroit, le manuscrit de Massada présente une lecture hébraïque différente de celle des manuscrits de la Gueniza du Caire ; le fragment conservé est toutefois trop incomplet pour déterminer avec certitude l’ensemble du texte.
    reason: textual_variant
lexical_decisions:
- source_word: וחסד
  choice: La bonté
  rationale: חסד peut exprimer la bonté, la bienveillance, la fidélité ou la grâce. En l’absence d’un cadre explicitement lié à l’alliance, « bonté » rend ici naturellement la vertu éthique sans réduire l’étendue du terme.
- source_word: לעולם לא ימוט
  choice: ne chancellera jamais
  rationale: ימוט évoque ce qui chancelle, vacille ou perd sa stabilité. « Ne chancellera jamais » conserve cette image avec une formulation française claire et digne.
- source_word: וצדקה
  choice: et la justice
  rationale: צדקה désigne la justice ou la droiture et peut, dans certains usages tardifs, se rapporter à l’aumône. « Justice » suit directement le témoin hébreu, tandis que la lecture grecque « aumône » est signalée en note.
- source_word: לעד תכון
  choice: restera ferme pour toujours
  rationale: תכון, de כון, exprime l’idée d’être établi, affermi ou stable. « Restera ferme » préserve le parallélisme avec l’image du premier membre tout en étant naturel en français.
theological_decisions:
- issue: Choix entre le texte hébreu du Caire et le parallèle grec
  choice: 'Le texte principal suit l’hébreu : « la justice restera ferme pour toujours »'
  alternative: 'Le grec porte : « la grâce est comme un paradis de bénédictions, et l’aumône demeure pour toujours »'
  rationale: Le témoin hébreu est disponible avec un degré élevé de confiance et constitue ici la source première. La divergence grecque, significative sur les plans textuel et théologique, est conservée explicitement en note plutôt que harmonisée.
translation_notes:
  register: Français international moderne, accessible et digne. Le parallélisme poétique et les images de stabilité de l’hébreu sont conservés sans imposer le sens plus spécialisé d’« aumône » présent dans la tradition grecque.
