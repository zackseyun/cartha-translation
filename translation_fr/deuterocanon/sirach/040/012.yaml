  yaml_path: translation/deuterocanon/sirach/040/012.yaml
  text: Every gift and injustice will be wiped away[b][a], but faith will stand forever.
translation:
  language: fr
  text: Tout don et toute injustice seront effacés[b], mais la foi[a] subsistera pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la fidélité subsistera pour toujours ». Le mot grec peut désigner la foi ou la fidélité.
    reason: alternative_reading
  - marker: b
    text: Un ancien témoin hébreu de Massada semble refléter un terme apparenté à « prêt » là où le grec porte « don ». Le texte principal suit le grec δῶρον, mais l’hébreu témoigne peut-être d’une variante ancienne.
    reason: textual_variant
lexical_decisions:
- source_word: πᾶν
  choice: tout… toute
  rationale: Le distributif grec porte sur les deux noms singuliers; la répétition française rend clairement cette portée.
- source_word: δῶρον
  choice: don
  rationale: C’est le sens ordinaire du grec δῶρον. « Cadeau », « offrande » ou « pot-de-vin » préciseraient indûment le contexte.
- source_word: ἀδικία
  choice: injustice
  rationale: Ce terme conserve la portée morale et sociale de ἀδικία sans la réduire à une faute particulière.
- source_word: ἐξαλειφθήσεται
  choice: seront effacés
  rationale: Le verbe évoque l’effacement ou la suppression; l’accord au pluriel est requis en français avec le sujet composé.
- source_word: πίστις
  choice: foi
  rationale: « Foi » rend directement πίστις tout en laissant en note l’autre sens contextuellement plausible, « fidélité ».
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Cette expression idiomatique indique ici une permanence sans fin.
- source_word: στήσεται
  choice: subsistera
  rationale: « Subsister » exprime naturellement en français l’idée de demeurer ferme et durablement établi, portée par στήσεται.
theological_decisions:
- issue: Sens de πίστις
  choice: foi
  alternative: fidélité
  rationale: Le grec permet les deux sens. Le texte principal retient « foi », tandis que la note préserve « fidélité », particulièrement plausible dans le contraste avec l’injustice.
translation_notes:
  register: Français moderne, international et digne. La formulation reste concise, conserve le contraste du grec et évite de préciser indûment la nature du « don ».
