  text: from the day he comes out from his mother's womb until the day he returns to the mother of all the living[a].
translation:
  language: fr
  text: depuis le jour où il sort du ventre de sa mère jusqu’au jour où il retourne vers la mère de tous les vivants[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, « vers la mère de tous les vivants ». Cette image poétique désigne probablement la terre, mère commune à laquelle les humains retournent à leur mort. Le texte grec parallèle dit explicitement : « le jour de la mort ».'
    reason: Précision sur une métaphore hébraïque et indication de la variante explicative du parallèle grec.
lexical_decisions:
- source_word: מיום
  choice: depuis le jour
  rationale: La préposition מן avec יום marque le point de départ d’une durée. « Depuis le jour » exprime clairement cette limite temporelle et s’accorde avec « jusqu’au jour ».
- source_word: צאתו
  choice: où il sort
  rationale: Le terme, issu de יצא, signifie littéralement « sa sortie ». La tournure verbale conserve l’image concrète de la naissance et forme un parallèle naturel avec « où il retourne ».
- source_word: מרחם אמו
  choice: du ventre de sa mère
  rationale: « Ventre » rend ici רחם dans un français courant et concret; dans ce contexte, il désigne clairement le sein maternel.
- source_word: עד יום
  choice: jusqu’au jour
  rationale: Cette expression marque le terme de la période commencée par מיום et reproduit naturellement la structure temporelle de l’hébreu.
- source_word: שובו
  choice: où il retourne
  rationale: שוב exprime le retour. La forme verbale maintient le mouvement qui va de la naissance à la mort et répond à « où il sort ».
- source_word: אל אם כל חי
  choice: vers la mère de tout être vivant
  rationale: La traduction conserve la métaphore maternelle de l’hébreu sans la remplacer dans le texte par son interprétation probable, « la terre ». « Tout être vivant » rend naturellement le collectif כל חי.
theological_decisions:
- issue: La métaphore de la mort dans « la mère de tout être vivant »
  choice: Conserver dans le texte la métaphore hébraïque.
  alternative: « la terre » ou « la tombe »
  rationale: Le témoin hébreu parle poétiquement d’un retour vers une mère commune. Le parallèle grec explicite le terme de la vie par « le jour de la mort », mais ne justifie pas de supprimer l’image propre à l’hébreu. Une note en indique donc le sens probable sans résoudre excessivement la métaphore.
translation_notes:
  register: Français international moderne, sobre et poétique. La syntaxe parallèle « depuis le jour où… jusqu’au jour où… » suit étroitement l’hébreu tout en restant naturelle. Le verset étant un fragment syntaxique lié au contexte précédent, la minuscule initiale est conservée.
