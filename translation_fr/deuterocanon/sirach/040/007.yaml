  text: Again he prepares for battle[a], and he wakes up, and there is no terror; then he finds rest.
translation:
  language: fr
  text: 'De nouveau, il se prépare au combat[a] ; puis il se réveille : il n’y a pas de terreur, et il trouve le repos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit : « De nouveau, il dispose le combat, puis il se réveille ; il n’y a pas de terreur, et il trouve le repos. » Le parallèle grec diffère sensiblement : « Au moment de sa délivrance, il se réveille, étonné de n’éprouver aucune crainte. » Le texte principal suit le témoin hébreu conservé.'
    reason: alternative_reading
lexical_decisions:
- source_word: עוד
  choice: De nouveau
  rationale: Le mot introduit ici la répétition d’un épisode éprouvant. « De nouveau » exprime cette reprise dans un français naturel.
- source_word: עורך מלחמה
  choice: il se prépare au combat
  rationale: Le verbe ערך signifie mettre en ordre ou disposer, notamment en vue d’une bataille. Dans ce contexte onirique, « se prépare au combat » restitue naturellement l’image sans préciser indûment une tactique militaire.
- source_word: והקיץ
  choice: puis il se réveille
  rationale: Le verbe קיץ désigne le réveil après le sommeil. « Puis » rend explicitement, mais légèrement, la succession narrative portée par la coordination hébraïque.
- source_word: ואימה אין
  choice: il n’y a plus de terreur
  rationale: La proposition hébraïque, brève et sans verbe exprimé, signifie littéralement que la terreur n’est pas là. « Plus » convient au passage du rêve menaçant au réveil, sans transformer la terreur en simple objet extérieur.
- source_word: ומצא מנוח
  choice: et il trouve le repos
  rationale: מנוח désigne le repos ou l’apaisement. « Trouve le repos » conserve l’expression concrète et la progression du texte hébreu.
theological_decisions:
- issue: Rapport entre le texte hébreu et le parallèle grec sensiblement différent
  choice: Le texte principal suit le témoin hébreu conservé.
  alternative: 'Suivre le grec : « Au moment de sa délivrance, il se réveille, étonné de n’éprouver aucune crainte. »'
  rationale: Pour le Siracide, l’hébreu conservé est la source principale. La divergence grecque est néanmoins signalée afin de ne pas masquer l’incertitude de la transmission.
translation_notes:
  register: Français international moderne, sobre et digne. La ponctuation clarifie le passage de la menace rêvée au réveil sans effacer la parataxe concise de l’hébreu.
