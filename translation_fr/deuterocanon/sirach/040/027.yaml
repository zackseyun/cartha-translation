translation:
  language: fr
  text: La crainte de Dieu est comme un jardin de bénédiction[a] ; elle procure une protection plus grande que toute gloire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme un Éden de bénédiction » ; le grec parallèle dit : « comme un paradis de bénédiction ».'
    reason: lexical_alternative
  - marker: b
    text: 'La dernière proposition est très concise en hébreu. Le grec parallèle appuie l’image d’une couverture protectrice : « et ils le couvrirent plus que toute gloire ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְאַת אֱלֹהִים
  choice: la crainte de Dieu
  rationale: Suit directement l’hébreu et conserve l’expression biblique « crainte de Dieu », sans la réduire à la seule révérence. Le titre « Dieu » traduit אֱלֹהִים, tandis que le grec parallèle porte « Seigneur ».
- source_word: כְּעֵדֶן בְּרָכָה
  choice: comme un jardin de bénédiction
  rationale: עֵדֶן évoque Éden et, avec le grec παράδεισος, confirme l’image d’un jardin paradisiaque. « Jardin » rend cette image clairement en français moderne, tandis qu’une note préserve la formulation hébraïque plus littérale.
- source_word: וְעַל כָּל כָּבוֹד
  choice: supérieur à toute gloire
  rationale: עַל a ici une valeur comparative, confirmée par le grec ὑπὲρ πᾶσαν δόξαν. Cette formulation conserve la comparaison sans l’interpréter comme une simple position spatiale.
- source_word: חָפְתָה
  choice: elle offre un abri
  rationale: Le verbe exprime l’idée de couvrir et, par extension, d’abriter. Le pronom « elle » reprend naturellement « la crainte de Dieu » et évite d’ajouter un bénéficiaire que le texte hébreu concis n’explicite pas.
theological_decisions:
- issue: Titre divin dans le texte principal
  choice: Dieu
  alternative: Seigneur
  rationale: Le témoin hébreu conservé lit אֱלֹהִים, « Dieu ». Le grec Κυρίου, « Seigneur », est signalé comme parallèle mais ne remplace pas ici la lecture hébraïque.
- issue: Portée protectrice de la crainte de Dieu
  choice: elle offre un abri supérieur à toute gloire
  alternative: elle couvre plus que toute gloire
  rationale: La traduction garde l’image d’une couverture protectrice, soutenue par le grec ἐκάλυψαν αὐτόν, tout en préservant la concision et la difficulté de la comparaison au moyen d’une note.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique est conservé ; « crainte » maintient l’idiome biblique, et les notes rendent visibles l’allusion à Éden ainsi que l’ambiguïté de la proposition finale.
