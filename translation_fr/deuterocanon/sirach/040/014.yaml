  source_fidelity: Révision nécessaire. Le grec parallèle porte εὐφρανθήσεται, un futur singulier (« il se réjouira / sera dans la joie »), et non le pluriel « ils se réjouissent ». La note citait d’ailleurs ce singulier, créant une incohérence avec le texte. Le lien οὕτως se rend plus fidèlement par « ainsi » que par « mais ». Le premier membre hébreu demeure très obscur; le sens grec suivi dans le texte principal doit donc être signalé sans prétendre résoudre la lecture hébraïque.
  naturalness: « Quand il ouvrira les mains, il se réjouira » est naturel dans un registre biblique moderne et rend l’expression grecque sans la lourdeur de « à l’ouverture de ses mains ». « Ainsi, les transgresseurs disparaîtront soudain pour toujours » est clair et soutenu.
  terminology: « Les transgresseurs » rend précisément οἱ παραβαίνοντες et convient au registre sapientiel. « Disparaîtront » conserve la portée de ἐκλείψουσιν et de יתם sans ajouter l’idée d’une destruction violente. « Pour toujours » rend לנצח.
  issues:
