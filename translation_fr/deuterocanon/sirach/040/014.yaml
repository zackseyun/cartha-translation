  text: At the opening of his hands they will rejoice[b][a], but the transgressors will suddenly come to an end forever.
translation:
  language: fr
  text: Quand il ouvrira les mains, il se réjouira[a][b] ; ainsi, les transgresseurs disparaîtront soudain pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le premier membre hébreu est difficile et peut refléter une autre lecture, évoquant approximativement des « peuples » et le « pillage ». Le grec porte : « Quand il ouvrira les mains, il se réjouira. »'
    reason: alternative_reading
  - marker: b
    text: Massada ne préserve ici qu’une lecture fragmentaire ; les manuscrits hébreux de la Guéniza du Caire et le grec divergent fortement dans le premier membre.
    reason: textual_variant
lexical_decisions:
- source_word: שאתו כפים / ἐν τῷ ἀνοῖξαι αὐτὸν χεῖρας
  choice: Quand il ouvre les mains
  rationale: Le texte hébreu est difficile, probablement altéré à cet endroit. Le grec donne clairement l’idée d’ouvrir les mains. Cette formulation française est naturelle et conserve la valeur temporelle de la construction grecque.
- source_word: עם עם / εὐφρανθήσεται
  choice: ils se réjouissent
  rationale: La lecture hébraïque conservée est obscure et textuellement instable, tandis que le grec exprime clairement la joie. Le texte principal suit donc ici le témoin grec, et la divergence hébraïque est signalée en note.
- source_word: פתאם
  choice: soudain
  rationale: L’adverbe hébreu signifie directement « soudain » ou « à l’improviste » et souligne la brusquerie de la fin annoncée.
- source_word: לנצח
  choice: pour toujours
  rationale: Cette expression rend le sens temporel naturel de l’hébreu et préserve la force définitive de l’énoncé.
- source_word: יתם / ἐκλείψουσιν
  choice: disparaîtront
  rationale: L’hébreu et le grec peuvent exprimer l’idée de cesser, de prendre fin ou de disparaître. « Disparaîtront » est concis, idiomatique et n’ajoute pas l’idée d’une destruction violente.
- source_word: οἱ παραβαίνοντες
  choice: ceux qui transgressent
  rationale: Le grec désigne explicitement les personnes qui franchissent ou enfreignent une limite. La tournure verbale française reste claire et évite un substantif religieux potentiellement moins courant.
theological_decisions:
- issue: Recours au parallèle grec lorsque l’hébreu est textuellement difficile
  choice: 'Le texte principal suit le sens clair du grec dans le premier membre : « Quand il ouvre les mains, ils se réjouissent » ; il conserve dans le second les éléments sûrs de l’hébreu, notamment « soudain » et « pour toujours ».'
  alternative: Une restitution plus directement fondée sur la forme hébraïque conservée évoquerait approximativement des peuples et un pillage.
  rationale: L’hébreu demeure prioritaire lorsqu’il est intelligible, mais le premier membre de ce verset est très obscur et diverge fortement du grec. La traduction emploie donc le grec comme témoin réel du texte tout en documentant sans la masquer la lecture hébraïque difficile.
- issue: Rapport logique entre les deux membres
  choice: mais
  alternative: ainsi / de même
  rationale: Ni le texte hébreu fourni ni le grec n’imposent clairement une conjonction. « Mais » rend prudemment le contraste apparent entre la joie et la disparition finale, sans présenter cette relation comme une conséquence certaine.
translation_notes:
  register: Français international moderne, digne et accessible. La traduction évite l’expression plus littérale mais moins naturelle « à l’ouverture de ses mains ». Le pluriel « ils se réjouissent », retenu dans la couche de consultation, suppose un référent collectif qui reste implicite dans le contexte transmis ; la note signale la difficulté textuelle sous-jacente.
