    rationale: Le texte principal disait « ils se réjouissent », tandis que le grec εὐφρανθήσεται et la citation grecque de la note sont au singulier futur. La traduction doit conserver cette donnée, même si le référent du singulier reste implicite.
  - severity: low
    issue: Conjonction « mais » insuffisamment fondée
    rationale: Le grec οὕτως signifie normalement « ainsi / de même ». « Mais » introduit un contraste interprétatif qui n’est pas exprimé par le parallèle grec.
