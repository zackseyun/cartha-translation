  text: A good man will stand surety for his neighbor[a], but one who has lost shame will abandon him.
translation:
  language: fr
  text: Un homme bon se portera garant pour son prochain, mais celui qui a perdu la honte[a] l’abandonnera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’homme sans honte ». Le grec dit littéralement : « celui qui a perdu la honte ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ ἀγαθός
  choice: un homme bon
  rationale: ἀνήρ est un nom masculin singulier désignant ici un homme, et ἀγαθός exprime sa droiture morale. « Un homme bon » rend directement la formulation proverbiale grecque.
- source_word: ἐγγυήσεται
  choice: se portera garant pour
  rationale: Le verbe désigne le fait de fournir une garantie personnelle ou financière pour quelqu’un. Cette tournure française conserve la nuance juridique du contexte.
- source_word: τὸν πλησίον
  choice: son prochain
  rationale: πλησίον désigne la personne proche dans le cadre des relations sociales et morales. « Son prochain » est naturel dans un texte sapientiel et maintient cette portée relationnelle.
- source_word: ὁ ἀπολωλεκὼς αἰσχύνην
  choice: celui qui a perdu tout sentiment de honte
  rationale: Le participe parfait signifie littéralement « celui qui a perdu la honte ». La formulation retenue préserve l’image d’une retenue morale désormais perdue tout en restant idiomatique en français moderne.
- source_word: καταλείψει αὐτόν
  choice: l’abandonnera
  rationale: καταλείπω signifie laisser derrière soi ou abandonner. Le pronom masculin renvoie naturellement au prochain mentionné dans la première proposition.
theological_decisions:
- issue: Masculin singulier dans une maxime sapientielle
  choice: un homme bon
  alternative: une personne bonne
  rationale: Même si la maxime a une portée générale, le grec emploie explicitement ἀνήρ au masculin singulier. La traduction conserve cette forme sans élargir silencieusement le référent.
translation_notes:
  register: Français moderne, clair et digne. « Se porter garant » maintient le cadre financier et juridique du chapitre ; « son prochain » convient au registre sapientiel sans être archaïque.
