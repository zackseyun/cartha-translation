review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : l’exhortation porte sur la parole donnée, la fiabilité envers l’autre partie, puis la promesse de trouver ce qui est nécessaire. Toutefois, « sois fidèle » peut évoquer en français une fidélité affective ou religieuse plutôt que la fiabilité exigée par πιστώθητι. « Montre-toi digne de confiance » rend plus précisément la valeur de fiabilité sans réduire le sens.'
  naturalness: « Tiens ta parole » est l’expression française idiomatique complète. « Montre-toi digne de confiance envers lui » est naturel et plus explicite que « sois fidèle envers lui ». Le point-virgule convient au parallélisme de l’exhortation et de sa conséquence.
  terminology: La note doit être ancrée au pronom dont elle traite, non à « parole ». Sa formulation actuelle (« à son sujet ») est maladroite et ambiguë, car elle ne rend pas clairement l’alternative selon laquelle αὐτοῦ peut renvoyer abstraitement à l’engagement. La note proposée conserve cette possibilité sans la présenter comme certaine.
  issues:
  - severity: medium
    issue: « sois fidèle envers lui » est sémantiquement trop large en français moderne.
    rationale: πιστώθητι désigne ici le fait de se montrer fiable ou digne de confiance dans une relation d’obligation. « Fidèle » peut être compris comme loyal, conjugal ou religieux, et affaiblit la précision pratique du contexte.
  - severity: low
    issue: L’ancre de note est placée sur « parole », alors que la note porte sur le référent de « lui ».
    rationale: Déplacer l’ancre après « lui » rend la note immédiatement intelligible et respecte la fonction de l’appareil.
  - severity: medium
    issue: La formulation de l’alternative dans la note est imprécise.
    rationale: « À son sujet » ne traduit pas naturellement une lecture abstraite de μετʼ αὐτοῦ. « Dans cet engagement » exprime clairement l’alternative sans prétendre résoudre l’ambiguïté grecque.
