revisions:
- from: Tiens parole[a] et sois fidèle envers lui ; en tout temps, tu trouveras ce dont tu as besoin.
  to: Tiens ta parole et montre-toi digne de confiance envers lui[a] ; en tout temps, tu trouveras ce dont tu as besoin.
  rationale: La révision remplace une expression française équivoque par une formulation qui rend directement la fiabilité demandée par le grec, complète l’idiome « tenir sa parole », et corrige l’ancrage ainsi que la formulation de la note. Elle maintient le référent personnel privilégié dans le texte tout en préservant en note la lecture abstraite possible de αὐτοῦ.
