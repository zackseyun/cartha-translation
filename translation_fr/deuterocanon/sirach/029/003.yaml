  text: Keep your word[a], and be faithful to him, and at all times you will find what you need.
translation:
  language: fr
  text: Tiens ta parole et montre-toi digne de confiance envers lui[a] ; en tout temps, tu trouveras ce dont tu as besoin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, si le pronom renvoie plus abstraitement à la parole donnée ou à l’engagement : « Tiens ta parole et montre-toi digne de confiance dans cet engagement. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: στερέωσον λόγον
  choice: Tiens parole
  rationale: L’impératif signifie littéralement affermir ou rendre ferme une parole. Dans ce contexte d’engagement financier, l’expression française « tenir parole » restitue naturellement l’idée de confirmer sa parole par les actes.
- source_word: πιστώθητι
  choice: sois fidèle
  rationale: L’impératif exprime ici le fait de se montrer digne de confiance. « Sois fidèle » conserve à la fois la dimension relationnelle et morale du grec.
- source_word: μετʼ αὐτοῦ
  choice: envers lui
  rationale: Le pronom est pris au masculin et renvoie probablement à la personne concernée par l’engagement. « Envers lui » est plus idiomatique en français que le calque « avec lui » après « sois fidèle ».
- source_word: ἐν παντὶ καιρῷ
  choice: en tout temps
  rationale: 'Cette formulation naturelle et digne conserve la portée générale de l’expression grecque : à toute époque ou en toute occasion.'
- source_word: εὑρήσεις τὴν χρείαν σου
  choice: tu trouveras ce dont tu as besoin
  rationale: La traduction conserve le verbe « trouver » tout en rendant χρεία par une tournure française courante désignant ce qui est nécessaire.
theological_decisions:
- issue: Référent de αὐτοῦ dans μετʼ αὐτοῦ
  choice: La personne envers laquelle la parole a été donnée
  alternative: La parole ou l’engagement lui-même, compris de manière plus abstraite
  rationale: Le masculin αὐτοῦ et le contexte des obligations interpersonnelles favorisent un référent personnel, sans exclure totalement une lecture abstraite liée à l’engagement ; cette ambiguïté est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. « Tiens parole » est idiomatique sans être familier ; le parallélisme exhortation-promesse et l’ambiguïté du pronom grec sont préservés.
