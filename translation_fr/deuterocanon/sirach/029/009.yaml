  text: For the sake of the commandment[a], help the poor, and according to his need do not send him away empty.
translation:
  language: fr
  text: Par égard pour le commandement, viens en aide au pauvre et, selon son besoin, ne le renvoie pas les mains vides.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάριν ἐντολῆς
  choice: Par respect pour le commandement
  rationale: χάριν avec le génitif exprime ici le motif de l’action. « Par respect pour » rend ce motif de façon naturelle en français et conserve le poids normatif de ἐντολή sans préciser de quel commandement il s’agit.
- source_word: ἀντιλαβοῦ
  choice: viens en aide
  rationale: L’impératif moyen de ἀντιλαμβάνομαι évoque le fait de soutenir activement quelqu’un. « Viens en aide » en restitue clairement la force dans ce contexte.
- source_word: πένητος
  choice: au pauvre
  rationale: πένης désigne une personne pauvre ou dans le besoin. Le singulier représentatif « au pauvre » suit le grec tout en restant idiomatique.
- source_word: κατὰ τὴν ἔνδειαν αὐτοῦ
  choice: selon son besoin
  rationale: La formule indique que l’aide doit correspondre au manque réel de la personne. « Selon son besoin » conserve cette relation sans ajouter d’interprétation.
- source_word: μὴ ἀποστρέψῃς αὐτὸν κενόν
  choice: ne le renvoie pas les mains vides
  rationale: ἀποστρέφω peut signifier détourner ou renvoyer, tandis que κενόν indique que la personne repartirait sans rien recevoir. L’expression française rend concrètement et naturellement l’ensemble.
theological_decisions:
- issue: Référence du « commandement »
  choice: Conserver la désignation non précisée « le commandement »
  alternative: Préciser qu’il s’agit d’un commandement particulier de la Torah, ou généraliser en « instruction »
  rationale: Le grec emploie ἐντολῆς sans identifier un texte légal particulier. La traduction préserve donc cette indétermination et sa portée possiblement divine ou morale.
translation_notes:
  register: Français moderne, courant et digne. L’impératif « viens en aide » exprime une assistance active; « les mains vides » est une tournure concrète et immédiatement compréhensible.
