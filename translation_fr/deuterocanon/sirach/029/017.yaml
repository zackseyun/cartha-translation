  text: And one who is ungrateful in mind will abandon the one who rescued him[a].
translation:
  language: fr
  text: Et celui qui est ingrat au fond de lui-même abandonnera celui qui l’a délivré[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Et celui qui est ingrat dans sa pensée abandonnera celui qui l’a délivré. »'
    reason: La note conserve la formulation explicite de ἐν διανοίᾳ, rendue plus idiomatiquement dans le texte.
lexical_decisions:
- source_word: ἀχάριστος
  choice: ingrat
  rationale: L’adjectif exprime clairement l’absence de reconnaissance. « Ingrat » est courant, concis et conserve la portée morale du grec.
- source_word: ἐν διανοίᾳ
  choice: au fond de lui-même
  rationale: Cette tournure française naturelle rend la disposition intérieure exprimée par « dans la pensée/l’intelligence », sans réduire l’ingratitude à une simple opinion passagère.
- source_word: ἐγκαταλείψει
  choice: abandonnera
  rationale: Le futur grec signifie laisser derrière soi ou délaisser. « Abandonnera » en restitue naturellement la force.
- source_word: ῥυσάμενον
  choice: celui qui l’a délivré
  rationale: Le participe aoriste désigne la personne qui l’a arraché à une situation difficile. Le pronom « l’ » explicite en français l’objet sous-entendu par le grec.
theological_decisions:
- issue: Expression générique sans nom explicite
  choice: celui qui est ingrat
  alternative: un homme ingrat
  rationale: Le grec emploie un adjectif substantivé sans nom signifiant explicitement « homme ». « Celui qui » conserve la référence personnelle et générique sans ajouter un substantif absent du texte.
- issue: Portée intérieure de l’ingratitude
  choice: au fond de lui-même
  alternative: dans sa pensée
  rationale: La traduction retenue maintient l’accent sur la disposition intérieure tout en évitant une formulation française raide. La note signale la forme plus littérale.
translation_notes:
  register: Français international moderne, sobre et proverbial. La coordination initiale « Et » est conservée, de même que le futur à valeur de constat ou d’avertissement.
