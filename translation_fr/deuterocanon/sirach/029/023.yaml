lexical_decisions:
- source_word: ἐπὶ μικρῷ καὶ μεγάλῳ
  choice: de peu comme de beaucoup
  rationale: Avec le datif, ἐπί indique ici les circonstances ou la quantité dans lesquelles il faut garder une disposition favorable. Cette formulation française conserve le contraste entre peu et beaucoup sans préciser s’il s’agit uniquement de biens matériels.
- source_word: εὐδοκίαν
  choice: satisfait
  rationale: Le nom peut exprimer le bon plaisir, l’agrément ou la satisfaction. Dans la tournure εὐδοκίαν ἔχε, « sois satisfait » restitue naturellement l’attitude positive ou consentante demandée.
- source_word: ἔχε
  choice: sois
  rationale: L’impératif signifie littéralement « aie », mais le français exprime plus naturellement cet état par « sois satisfait », tout en gardant la force impérative.
