translation_notes:
  register: Français moderne, direct et digne. L’ordre initial reste volontairement abrupt. « Étranger de passage » évite le terme administratif « résident étranger », tandis que les notes préservent l’étrangeté et l’ambiguïté des deux expressions grecques difficiles.
