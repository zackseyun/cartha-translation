review_pass:
  verdict: revise
  source_fidelity: La traduction rend bien l’impératif abrupt, le statut précaire de πάροικε et l’idée vraisemblable d’une place d’honneur. Toutefois, « j’ai besoin du logement » transforme la construction nominale et impersonnelle χρεία τῆς ξενίας en un besoin personnel du locuteur, ce qui est moins fidèle et rend la logique de l’expulsion moins claire. « Est venu loger chez moi » est possible, mais « est arrivé chez moi comme hôte » rend plus directement la situation d’hospitalité exprimée par le parfait ἐπεξενώταί μοι.
  naturalness: Le français est globalement naturel et le ton direct convient. « Il faut un logement » est plus idiomatique ici que « j’ai besoin du logement », lequel suggère que le locuteur cherche lui-même à se loger.
  terminology: « Étranger de passage » convient à πάροικε en français moderne sans technicité administrative. « Place d’honneur » est une explicitation contextuelle raisonnable de l’expression grecque difficile, à condition que la note maintienne son caractère non certain. La note a doit corriger son pseudo-littéral « loin de la face » et éviter l’alternative imprécise « ce qui est honoré ».
  issues:
  - severity: medium
    issue: Le sujet personnel ajouté dans « j’ai besoin du logement »
    rationale: χρεία τῆς ξενίας signifie littéralement qu’il y a nécessité de logement/d’hospitalité; le grec n’énonce pas « j’ai besoin ». L’impersonnel français conserve mieux la syntaxe et l’ambiguïté quant au bénéficiaire.
  - severity: low
    issue: 'Note a: formulation du littéral et de l’alternative'
    rationale: « Loin de la face de l’honneur » ne représente pas exactement ἀπὸ προσώπου δόξης, dont l’image est « de devant la face/présence de l’honneur ». « Ce qui est honoré » déplace aussi le sens de l’expression.
  - severity: low
    issue: Rendu de ἐπεξενώταί μοι
    rationale: « Est venu loger chez moi » exprime le résultat contextuel, mais « est arrivé chez moi comme hôte » conserve plus nettement le domaine de l’hospitalité et le rapport marqué par μοι.
