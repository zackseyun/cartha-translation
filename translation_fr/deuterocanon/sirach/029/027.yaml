  text: Go out[a], sojourner, from the place of honor, for my brother has become my guest[b], and I need the lodging.
translation:
  language: fr
  text: '« Sors, étranger de passage, de la place d’honneur[a] : mon frère est arrivé chez moi comme hôte, et il faut un logement[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de devant l’honneur » ; plus littéralement, « de devant la face de l’honneur ». L’expression grecque est inhabituelle. Dans ce contexte, elle désigne probablement une place honorable ou bien en vue que l’étranger doit céder à un autre hôte.
    reason: lexical_alternative
  - marker: b
    text: On peut aussi traduire « il faut de l’hospitalité » ou « il y a nécessité de logement ». Le grec souligne la nécessité créée par l’accueil d’un autre visiteur, sans préciser explicitement à qui ce logement est nécessaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξελθε
  choice: Va-t’en
  rationale: L’impératif exprime un ordre direct et rude de partir. « Va-t’en » restitue cette force en français naturel.
- source_word: πάροικε
  choice: étranger de passage
  rationale: πάροικος désigne une personne qui réside auprès d’autres sans appartenir pleinement au lieu. Cette expression courante conserve à la fois son statut d’étranger et le caractère précaire de son séjour.
- source_word: ἀπὸ προσώπου δόξης
  choice: quitte la place d’honneur
  rationale: Littéralement, l’expression inhabituelle évoque le fait de partir « de devant la face de l’honneur ». Dans ce contexte domestique, elle désigne vraisemblablement une place honorable ou en vue, sans que cette interprétation soit présentée comme certaine.
- source_word: ἐπεξενώταί μοι
  choice: est venu loger chez moi
  rationale: Le parfait du verbe lié à l’accueil d’un étranger indique que le frère est désormais reçu ou hébergé auprès du locuteur. La formulation française exprime clairement cet état résultant.
- source_word: ὁ ἀδελφός
  choice: mon frère
  rationale: Bien que le grec emploie l’article, le datif μοι et la situation rendent le possessif naturel en français. « Frère » peut désigner ici un frère au sens propre ou un proche.
- source_word: χρεία τῆς ξενίας
  choice: j’ai besoin du logement
  rationale: χρεία exprime la nécessité, tandis que ξενία peut désigner l’hospitalité ou le logement accordé à un hôte. Le contexte où il faut libérer une place favorise le sens concret de « logement ».
