  text: Many have regarded a loan as a windfall[a], and have caused trouble for those who helped them.
translation:
  language: fr
  text: Beaucoup ont considéré un prêt comme une aubaine[a] et ont causé des ennuis à ceux qui les avaient aidés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme une trouvaille » ou « comme quelque chose qu’on a trouvé », c’est-à-dire comme un gain inattendu plutôt que comme une somme à rembourser.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Beaucoup
  rationale: Rend naturellement le pluriel indéfini et général dans une maxime de sagesse.
- source_word: ὡς εὕρεμα
  choice: comme une aubaine
  rationale: εὕρεμα désigne ce que l’on trouve, et peut évoquer un gain inattendu. Dans le contexte d’un prêt, « aubaine » exprime naturellement l’idée d’une somme traitée comme un gain gratuit, tout en conservant une note explicitant l’image grecque.
- source_word: ἐνόμισαν
  choice: ont considéré
  rationale: νομίζω signifie ici tenir ou regarder quelque chose comme tel. Le passé composé convient au constat général formulé en français moderne.
- source_word: δάνος
  choice: un prêt
  rationale: δάνος désigne directement une somme prêtée, plutôt que l’état abstrait d’endettement.
- source_word: παρέσχον πόνον
  choice: ont causé des ennuis
  rationale: Cette expression signifie littéralement procurer de la peine ou du trouble. « Causer des ennuis » est clair, naturel et suffisamment large pour préserver la portée de πόνος.
- source_word: τοῖς βοηθήσασιν αὐτοῖς
  choice: à ceux qui les avaient aidés
  rationale: Le participe aoriste désigne les personnes qui leur ont porté assistance, ici en leur accordant le prêt. Le plus-que-parfait marque naturellement que cette aide précédait les ennuis causés.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le caractère proverbial du verset et évite de préciser que les personnes aidantes sont des prêteurs, puisque le grec les désigne plus largement comme celles qui ont aidé.
