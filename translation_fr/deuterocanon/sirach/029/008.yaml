  text: But be patient with the humble[a], and do not keep him waiting for almsgiving.
translation:
  language: fr
  text: Cependant, sois patient envers l’homme de condition modeste[a], et ne le fais pas attendre avant de lui faire l’aumône[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’homme humble », « le pauvre » ou « l’homme abaissé ». Le terme grec peut évoquer aussi bien l’humilité que la modestie ou la détresse de la condition sociale.
    reason: lexical_alternative
  - marker: b
    text: Ou « ne tarde pas à lui faire l’aumône ». Le verbe grec peut signifier retarder une action ou la faire traîner.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Cependant
  rationale: Introduit une réserve ou un contraste avec l’instruction précédente, dans un français naturel et soutenu sans être archaïque.
- source_word: ἐπὶ ταπεινῷ
  choice: envers l’homme de condition modeste
  rationale: ταπεινός peut désigner une personne humble, abaissée ou socialement démunie. Dans le contexte du prêt et de l’aumône, la condition sociale est probablement au premier plan, tandis que la note conserve l’ambiguïté lexicale.
- source_word: μακροθύμησον
  choice: sois patient
  rationale: L’impératif appelle à la patience et à la longanimité envers la personne concernée; cette formulation est claire et actuelle.
- source_word: ἐπʼ ἐλεημοσύνην
  choice: pour lui donner l’aumône
  rationale: Dans l’usage judéo-grec, ἐλεημοσύνη désigne couramment un don charitable concret. La tournure verbale est plus naturelle en français moderne que « pour l’aumône ».
- source_word: μὴ παρελκύσῃς
  choice: ne le fais pas attendre
  rationale: Le verbe exprime le fait de retarder ou de faire traîner; comme son objet est une personne, cette traduction restitue naturellement la dimension personnelle.
- source_word: αὐτόν
  choice: le
  rationale: Le pronom masculin singulier renvoie à l’homme de condition modeste mentionné juste avant.
