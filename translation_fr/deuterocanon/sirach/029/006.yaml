revisions:
- from: S’il le peut, il récupérera à peine la moitié et la considérera comme une aubaine[a]. Sinon, il aura été privé de son argent et se sera acquis, à ses frais, un ennemi[b]. Celui-ci le paiera de malédictions et d’insultes et, au lieu de l’honorer, il le couvrira de honte.
  to: S’il le peut, il récupérera à peine la moitié et la considérera comme une aubaine[a]. Sinon, il sera privé de son argent et se fera, à ses frais, un ennemi[b]. Celui-ci lui rendra des malédictions et des insultes et, au lieu de lui faire honneur, le déshonorera.
  rationale: La révision conserve le sens et les deux notes du projet, tout en rendant plus directement l’antithèse grecque entre honneur et déshonneur. Les futurs simples améliorent la lisibilité française dans cette formulation proverbiale, sans attribuer au texte une accusation plus précise de fraude ni une portée doctrinale supplémentaire.
