base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/029/006.yaml
  text: If he is able[a], he will scarcely recover half, and will count it as a find; but if not, he has been deprived of his money, and has gained an enemy for nothing. He will repay him with curses and insults[b], and instead of honor he will repay him with dishonor.
translation:
  language: fr
  text: S’il le peut, il récupérera à peine la moitié et la considérera comme une aubaine[a]. Sinon, il sera privé de son argent et se fera, à ses frais, un ennemi[b]. Celui-ci lui rendra des malédictions et des insultes et, au lieu de lui faire honneur, le déshonorera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme une trouvaille » ; même la moitié récupérée est tenue pour un gain inattendu.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il se sera acquis un ennemi non gratuitement » ; le prêteur perd son argent et reçoit en plus de l’hostilité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν ἰσχύσῃ
  choice: S’il le peut
  rationale: ἰσχύω exprime ici la capacité du prêteur à obtenir un remboursement, sans préciser par quels moyens.
- source_word: μόλις κομίσεται τὸ ἥμισυ
  choice: il récupérera à peine la moitié
  rationale: κομίζω désigne ce qui est recouvré ou reçu en retour; μόλις souligne la difficulté et le faible résultat.
- source_word: λογιεῖται αὐτὸ ὡς εὕρεμα
  choice: la considérera comme une aubaine
  rationale: L’expression signifie que même la moitié recouvrée paraît être un gain inattendu; « aubaine » rend naturellement l’image de ce qui est trouvé.
- source_word: ἀπεστέρησεν αὐτὸν τῶν χρημάτων αὐτοῦ
  choice: il aura été privé de son argent
  rationale: Le passif français met en avant le résultat subi par le prêteur sans imposer l’idée plus précise d’un vol ou d’une fraude délibérée.
- source_word: ἐκτήσατο αὐτὸν ἐχθρὸν οὐ δωρεάν
  choice: se sera acquis, à ses frais, un ennemi
  rationale: κτάομαι signifie acquérir; οὐ δωρεάν indique ironiquement que cet ennemi n’a pas été acquis gratuitement, puisque le prêteur y perd son argent.
- source_word: κατάρας καὶ λοιδορίας
  choice: malédictions et insultes
  rationale: Ces termes désignent deux formes de paroles hostiles; la formulation est claire et actuelle.
- source_word: ἀποδώσει αὐτῷ
  choice: le paiera de
  rationale: 'Cette expression française conserve l’ironie d’ἀποδίδωμι: au remboursement attendu se substituent les malédictions et les insultes.'
- source_word: ἀντὶ δόξης ... ἀτιμίαν
  choice: au lieu de l’honorer, il le couvrira de honte
  rationale: La formulation rend l’opposition sociale entre δόξα, l’honneur, et ἀτιμία, le déshonneur ou la honte, dans un français naturel.
theological_decisions:
- issue: Portée morale de l’échec du prêt
  choice: Présenter les conséquences concrètes pour le prêteur et la réaction hostile du débiteur.
  alternative: Introduire une accusation explicite de fraude, une condamnation de l’intérêt ou un enseignement général sur le jugement divin.
  rationale: Le grec décrit la perte financière, l’inimitié et les outrages reçus; il ne formule pas ici de doctrine plus large sur l’usure ou le jugement.
- issue: Référents des pronoms dans la seconde moitié
  choice: Employer « Celui-ci » pour identifier l’ennemi, c’est-à-dire le débiteur devenu hostile, comme auteur des malédictions.
  alternative: Conserver une succession de pronoms potentiellement équivoque en français.
  rationale: Le contexte immédiat indique que l’homme devenu ennemi répond au prêteur par des injures; cette clarification grammaticale n’ajoute pas de thèse doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le contraste ironique entre le remboursement attendu et les outrages reçus. Les marqueurs [a] et [b] figurent dans le texte principal.
