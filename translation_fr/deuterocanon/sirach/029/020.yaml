  text: Support your neighbor according to your ability[a], and watch yourself lest you fall.
translation:
  language: fr
  text: Soutiens ton prochain selon tes moyens, et prends garde à toi, de peur de tomber.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de peur de tomber dans le malheur » ou « de peur d’être pris au piège ». Le grec ne précise pas la nature du danger.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιλαβοῦ
  choice: Soutiens
  rationale: L’impératif moyen exprime une aide active. « Soutiens » convient au contexte d’assistance pratique sans préciser indûment la forme de l’aide.
- source_word: τοῦ πλησίον
  choice: ton prochain
  rationale: Expression française consacrée et naturelle dans un contexte éthique; le génitif désigne la personne à aider.
- source_word: κατὰ δύναμίν σου
  choice: selon tes moyens
  rationale: κατά avec l’accusatif indique ici la mesure. « Selon tes moyens » rend naturellement la limite proportionnée à la capacité de chacun, probablement matérielle dans ce contexte, sans s’y restreindre absolument.
- source_word: πρόσεχε σεαυτῷ
  choice: veille sur toi-même
  rationale: Rend l’exhortation réflexive à la vigilance dans un français actuel et digne.
- source_word: μὴ ἐμπέσῃς
  choice: de peur de tomber
  rationale: Le verbe signifie littéralement « tomber dans », mais aucun complément n’est exprimé. Cette formulation conserve l’indétermination du danger.
theological_decisions:
- issue: Portée de l’avertissement μὴ ἐμπέσῃς
  choice: Avertissement général à ne pas tomber soi-même en aidant autrui
  alternative: « de peur de tomber dans le malheur » ou « de peur d’être pris au piège »
  rationale: Le grec ne nomme pas le péril. La traduction maintient donc la tension entre générosité et prudence sans réduire l’avertissement à un danger financier, moral ou juridique précis.
translation_notes:
  register: Tutoiement proverbial cohérent avec les impératifs grecs au singulier. Français moderne, direct et digne; ambiguïté finale volontairement préservée.
