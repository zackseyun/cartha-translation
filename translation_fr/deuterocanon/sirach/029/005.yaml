  text: Until he receives it[a], he will kiss his neighbor's hand, and for his neighbor’s money he will lower his voice; but at the time of repayment he will delay[b], and he will repay with words of indifference and blame the timing.
translation:
  language: fr
  text: Jusqu’à ce qu’il ait reçu l’argent, il couvrira la main de son prochain de baisers et, pour obtenir son argent, il parlera d’une voix humble[a]. Mais au moment de rembourser, il fera traîner les choses et, pour tout remboursement, il donnera des paroles désinvoltes[b], puis rejettera la faute sur les circonstances.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il abaissera sa voix », c’est-à-dire qu’il parlera sur un ton humble et soumis.'
    reason: lexical_alternative
  - marker: b
    text: 'Le verbe grec rendu ici par « donnera » fait écho au remboursement attendu : au lieu de rendre l’argent, il ne donne que des paroles marquées par l’insouciance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως οὗ λάβῃ
  choice: Jusqu’à ce qu’il ait reçu l’argent
  rationale: La proposition situe les marques de déférence avant l’obtention du prêt. « L’argent » explicite en français le complément sous-entendu par le grec et immédiatement indiqué dans la suite.
- source_word: καταφιλήσει χεῖρα αὐτοῦ
  choice: il couvrira la main de son prochain de baisers
  rationale: καταφιλέω est intensif et évoque des baisers empressés ou répétés. La formulation conserve l’image concrète de la déférence excessive; « de son prochain » identifie naturellement le référent à partir de la proposition suivante.
- source_word: ἐπὶ τῶν χρημάτων τοῦ πλησίον
  choice: pour obtenir son argent
  rationale: La préposition exprime ici le motif de cette attitude humble. Cette formulation française rend clairement que l’emprunteur cherche à obtenir l’argent du prochain sans suggérer qu’il lui appartient déjà.
- source_word: ταπεινώσει φωνήν
  choice: il parlera d’une voix humble
  rationale: Le grec dit littéralement qu’il « abaissera » ou « humiliera » sa voix. « Parler d’une voix humble » conserve la métaphore tout en exprimant la soumission affectée.
- source_word: ἐν καιρῷ ἀποδόσεως
  choice: au moment de rembourser
  rationale: ἀπόδοσις désigne ici la restitution de la somme empruntée. La tournure verbale est naturelle et précise en français moderne.
- source_word: παρελκύσει χρόνον
  choice: il fera traîner les choses
  rationale: L’expression grecque signifie littéralement prolonger ou tirer le temps. Cette locution française garde l’idée vive d’atermoiement volontaire.
- source_word: ἀποδώσει λόγους ἀκηδίας
  choice: pour tout remboursement, il donnera des paroles désinvoltes
  rationale: 'La formulation préserve l’ironie de ἀποδώσει : au lieu de rendre l’argent, il ne « rend » que des paroles. ἀκηδία exprime ici l’insouciance, la négligence ou l’indifférence; « désinvoltes » traduit ce manque de considération sans imposer la notion plus précise d’excuses.'
- source_word: τὸν καιρὸν αἰτιάσεται
  choice: rejettera la faute sur les circonstances
  rationale: καιρός peut désigner le moment opportun aussi bien que la conjoncture. « Les circonstances » restitue l’idée qu’il impute son défaut de paiement à la situation, tout en évitant le français peu naturel « blâmer le moment ».
