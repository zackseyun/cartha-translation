  text: More than a strong shield and more than a mighty spear, it will fight for you against an enemy.
translation:
  language: fr
  text: Plus qu’un bouclier solide et plus qu’une lance puissante, cela[a] combattra pour toi contre un ennemi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec ne répète pas ici le sujet. Il présente comme combattant en ta faveur ce qui est loué au verset précédent; selon le contexte, on pourrait expliciter « ta bonté » ou « ton gage ».
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ (devant ἀσπίδα et δόρυ)
  choice: plus que
  rationale: Dans cette construction comparative répétée, ὑπὲρ exprime la supériorité de valeur ou d’efficacité.
- source_word: ἀσπίδα κράτους
  choice: un bouclier robuste
  rationale: Le génitif κράτους qualifie le bouclier par sa force; « robuste » est naturel en français moderne.
- source_word: δόρυ ἀλκῆς
  choice: une lance puissante
  rationale: ἀλκή évoque la force ou la vigueur guerrière; « puissante » conserve le parallélisme sans archaïsme.
- source_word: κατέναντι ἐχθροῦ
  choice: contre un ennemi
  rationale: La locution exprime l’opposition hostile; l’absence d’article devant ἐχθροῦ permet l’indéfini.
- source_word: πολεμήσει
  choice: combattra
  rationale: Le futur actif signifie « combattre » ou « faire la guerre »; « combattra » est direct et digne.
- source_word: ὑπὲρ σοῦ
  choice: pour toi
  rationale: 'Ici, ὑπὲρ a un sens bénéficiaire: l’action est accomplie en faveur du destinataire.'
- source_word: sujet implicite de πολεμήσει
  choice: cela
  rationale: Le grec ne répète pas le sujet. « Cela » renvoie de façon neutre à ce qui est loué au verset précédent sans préciser indûment l’antécédent.
theological_decisions:
- issue: Sujet implicite repris du verset précédent
  choice: Employer le pronom neutre « cela »
  alternative: Préciser « ta bonté », « ton gage » ou employer un pronom personnel
  rationale: Le grec laisse l’antécédent sous-entendu. Une formulation neutre préserve l’ambiguïté contextuelle et la personnification au lieu de les résoudre.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme militaire est conservé; « cela » maintient volontairement l’ambiguïté du sujet grec.
