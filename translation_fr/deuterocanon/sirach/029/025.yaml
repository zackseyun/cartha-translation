  text: You will host and give drink to the ungrateful[a], and besides these things you will hear bitter words.
translation:
  language: fr
  text: Tu accueilleras des ingrats et tu leur donneras à boire ; en plus de cela, tu entendras des paroles amères[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des choses amères » ; en grec, ce qui est entendu reste implicite.
    reason: lexical_alternative
lexical_decisions:
- source_word: ξενιεῖς (ξενίζω)
  choice: tu accueilleras
  rationale: Le verbe désigne ici le fait de recevoir quelqu’un comme hôte. « Accueillir » est naturel en français et conserve le cadre de l’hospitalité.
- source_word: ποτιεῖς
  choice: tu leur donneras à boire
  rationale: Le verbe signifie faire boire ou donner quelque chose à boire. Le pronom « leur » explicite naturellement en français que les bénéficiaires sont les ingrats mentionnés.
- source_word: εἰς ἀχάριστα
  choice: des ingrats
  rationale: ἀχάριστος qualifie ceux qui sont dépourvus de reconnaissance. La tournure grecque est inhabituelle, mais le contexte indique les destinataires de l’accueil et de la boisson.
- source_word: πρὸς ἐπὶ τούτοις
  choice: en plus de cela
  rationale: Cette expression cumulative, quelque peu redondante en grec, ajoute une nouvelle peine à celles qui viennent d’être évoquées.
- source_word: πικρὰ
  choice: des paroles amères
  rationale: L’adjectif substantivé peut littéralement désigner « des choses amères ». Avec « entendre », le français appelle naturellement « paroles », tout en gardant l’image de l’amertume.
- source_word: ἀκούσει
  choice: tu entendras
  rationale: Le futur simple rend directement la forme grecque et maintient le ton d’avertissement.
