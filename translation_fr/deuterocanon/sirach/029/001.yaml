  text: He who shows mercy lends to his neighbor[a], and he who strengthens him with his hand keeps the commandments.
translation:
  language: fr
  text: Celui qui fait preuve de bonté prêtera à son prochain, et celui qui le soutient de sa main observe les commandements.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ ποιῶν ἔλεος
  choice: Celui qui fait preuve de bonté
  rationale: L’expression désigne une bonté mise en pratique, et non un simple sentiment. Cette formulation est naturelle en français moderne et conserve le caractère actif de ποιῶν.
- source_word: δανιεῖ
  choice: prêtera
  rationale: Le verbe grec est au futur de l’indicatif. « Prêtera » respecte cette forme et s’accorde avec le thème financier du chapitre.
- source_word: τῷ πλησίον
  choice: à son prochain
  rationale: Dans un contexte éthique, πλησίον désigne le prochain; ce terme français est clair et conserve la portée relationnelle du grec.
- source_word: ὁ ἐπισχύων
  choice: celui qui le soutient
  rationale: ἐπισχύω peut signifier fortifier ou soutenir. « Soutient » s’associe naturellement à l’image concrète de la main sans réduire l’expression à un secours abstrait.
- source_word: τῇ χειρὶ αὐτοῦ
  choice: de sa main
  rationale: La formulation conserve l’image grecque d’une aide concrète apportée par la main. Le possessif peut grammaticalement renvoyer au sujet; le contexte implique que la personne aidée est le prochain déjà mentionné.
- source_word: τηρεῖ ἐντολάς
  choice: observe les commandements
  rationale: τηρέω avec ἐντολάς exprime l’observance fidèle. En français, « observer les commandements » est idiomatique et garde la portée morale et religieuse de l’expression.
theological_decisions:
- issue: Faut-il rendre ἐντολάς comme de simples consignes ou comme les commandements de Dieu ?
  choice: les commandements
  alternative: des commandements / les consignes
  rationale: Dans le cadre sapiential du Siracide, le terme évoque naturellement les commandements divins. L’article français exprime cette catégorie religieuse reconnue sans ajouter de particularité confessionnelle.
- issue: Faut-il interpréter la bonté comme une disposition intérieure ou comme un acte concret ?
  choice: fait preuve de bonté
  alternative: est miséricordieux
  rationale: La construction ποιεῖν ἔλεος met l’accent sur la bonté exercée concrètement. Ce choix maintient le lien avec le prêt et l’aide pratique décrits dans le verset.
translation_notes:
  register: Français international moderne, digne et accessible. La structure proverbiale parallèle est conservée. « De sa main » maintient volontairement l’image concrète du grec plutôt que de l’expliciter par « avec ses moyens ».
