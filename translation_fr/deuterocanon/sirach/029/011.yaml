  text: Store up your treasure according to the commandments of the Most High[a], and it will profit you more than gold.
translation:
  language: fr
  text: Mets ton trésor en réserve selon les commandements du Très-Haut, et il te sera plus profitable que l’or.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θὲς
  choice: Place
  rationale: L’impératif aoriste de τίθημι signifie d’abord « mettre, placer, déposer ». Avec « trésor », « place » exprime ici l’action de mettre son bien en réserve ou de l’investir d’une certaine manière, sans ajouter explicitement l’idée d’aumône absente de ce verset.
- source_word: τὸν θησαυρόν σου
  choice: ton trésor
  rationale: θησαυρός désigne un trésor ou des richesses mises en réserve. « Ton trésor » conserve à la fois l’image économique et la portée sapientielle de ce que l’on estime précieux.
- source_word: κατʼ ἐντολὰς
  choice: conformément aux commandements
  rationale: La préposition κατά exprime ici la conformité, et ἐντολάς est bien au pluriel. Cette formulation est naturelle en français et suit précisément le grec.
- source_word: Ὑψίστου
  choice: du Très-Haut
  rationale: « Le Très-Haut » est le titre divin français traditionnel et toujours intelligible correspondant à Ὕψιστος.
- source_word: λυσιτελήσει σοι
  choice: il te sera profitable
  rationale: λυσιτελέω signifie « être avantageux, profitable ». La tournure garde la valeur économique du verbe ainsi que le bénéficiaire exprimé par σοι.
- source_word: μᾶλλον ἢ τὸ χρυσίον
  choice: plus profitable que l’or
  rationale: μᾶλλον ἤ introduit une comparaison de degré. La reprise implicite de « profitable » donne en français une comparaison complète et fidèle, sans transformer celle-ci en simple jugement de valeur (« meilleur que »).
theological_decisions:
- issue: Faut-il préciser que le trésor désigne l’aumône ?
  choice: 'Conserver la formulation générale du grec : « Place ton trésor conformément aux commandements du Très-Haut »'
  alternative: 'Expliciter : « Donne en aumône et amasse ainsi un trésor »'
  rationale: Le contexte immédiat traite du prêt et de la générosité, mais le grec de ce verset ne nomme pas explicitement l’aumône. La traduction laisse donc le contexte guider l’interprétation sans introduire cette application dans le texte même.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement correspond à l’adresse sapientielle au singulier. « Conformément aux » rend clairement la relation normative exprimée par κατά, tandis que « profitable » maintient la métaphore économique du passage.
