  text: Lose silver for a brother and a friend[a], and do not let it rust under a stone to destruction.
translation:
  language: fr
  text: Perds de l’argent pour un frère et un ami ; ne le laisse pas se détériorer sous une pierre jusqu’à sa perte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se corroder ». Le verbe grec est difficile ; l’image évoque de l’argent caché qui se détériore ou se perd au lieu de servir à aider autrui.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόλεσον
  choice: Perds
  rationale: L’impératif aoriste de ἀπόλλυμι appelle ici à consentir à la perte de biens pour autrui. « Perds » conserve la force paradoxale du grec, là où « dépense » atténuerait l’idée de renoncement.
- source_word: ἀργύριον
  choice: de l’argent
  rationale: Le mot désigne littéralement l’argent-métal, mais couramment aussi la monnaie. En français moderne, « de l’argent » garde naturellement les deux résonances dans ce contexte.
- source_word: διʼ ἀδελφὸν καὶ φίλον
  choice: pour un frère et un ami
  rationale: διά avec l’accusatif indique ici le motif ou l’intérêt de la personne concernée. L’absence d’articles et de possessifs est respectée sans ajouter « ton ».
- source_word: μὴ ἰωθῇ
  choice: ne le laisse pas rouiller
  rationale: La forme verbale est rare et difficile, mais le contexte évoque la détérioration d’un bien caché et inutilisé. « Rouiller » préserve l’image ancienne sans prétendre décrire scientifiquement l’oxydation de l’argent-métal.
- source_word: ὑπὸ τὸν λίθον
  choice: sous une pierre
  rationale: Cette traduction directe conserve l’image concrète de l’argent dissimulé ou enfoui.
- source_word: εἰς ἀπώλειαν
  choice: jusqu’à sa perte
  rationale: La locution exprime l’aboutissement funeste de cette thésaurisation. « Jusqu’à sa perte » est idiomatique tout en gardant la gravité d’ἀπώλεια.
