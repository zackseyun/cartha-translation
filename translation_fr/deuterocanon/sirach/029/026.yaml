review_pass:
  verdict: revise
  source_fidelity: 'Le sens des impératifs est globalement bien rendu : l’adresse est brusque, l’interlocuteur est traité comme un outsider, et il lui est demandé de préparer la table puis de donner à manger. « Passe ton chemin » est défendable pour Πάρελθε dans ce contexte, bien que la succession des ordres reste volontairement heurtée. « Étranger en résidence » cherche justement à expliciter πάροικε, mais n’est pas une expression française naturelle.'
  naturalness: « Étranger en résidence » est lourd et peu idiomatique en français moderne international. « Étranger » est naturel dans l’apostrophe et la note peut conserver la nuance de résident non pleinement intégré. « Dresse la table » est l’expression usuelle pour κόσμησον τράπεζαν et garde le sens pratique d’arranger/préparer la table.
  terminology: πάροικος ne correspond pas exactement à « immigré », terme moderne qui peut suggérer des catégories administratives ou sociologiques absentes du grec. La note doit plutôt proposer « résident étranger » et expliquer le statut d’habitant extérieur au plein groupe domestique ou civique.
