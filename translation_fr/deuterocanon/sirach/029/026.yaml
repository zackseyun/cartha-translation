  text: Move along[a], sojourner; set the table in order, and if you have anything in your hand, feed me with it.
translation:
  language: fr
  text: « Passe ton chemin, étranger[a] ; dresse la table et, si tu as quelque chose sous la main, donne-m’en à manger. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « résident étranger ». Le mot grec désigne une personne qui réside parmi les autres sans appartenir pleinement au groupe domestique ou à la communauté.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάρελθε
  choice: Passe ton chemin
  rationale: L’impératif de παρέρχομαι peut signifier « passer » ou « poursuivre son chemin ». Dans cette adresse brusque, « Passe ton chemin » restitue mieux la rudesse du propos qu’un simple « avance ».
- source_word: πάροικε
  choice: étranger en résidence
  rationale: πάροικος désigne une personne qui réside parmi d’autres sans appartenir pleinement à leur communauté. Cette expression conserve à la fois l’idée de résidence et le statut d’étranger, sans employer le terme administratif moderne « résident étranger ».
- source_word: κόσμησον
  choice: mets ... en ordre
  rationale: Ici, κοσμέω a le sens pratique d’arranger ou de préparer, et non celui d’orner.
- source_word: τράπεζαν
  choice: la table
  rationale: Le substantif désigne concrètement la table du foyer ; la traduction littérale est naturelle en français.
- source_word: εἴ τι ἐν τῇ χειρί σου
  choice: si tu as quelque chose sous la main
  rationale: L’expression grecque évoque concrètement ce que l’interlocuteur a en sa possession. « Sous la main » est idiomatique en français tout en conservant l’image de la main.
- source_word: ψώμισόν με
  choice: donne-m’en à manger
  rationale: ψωμίζω signifie donner à manger, notamment par bouchées. La formulation française garde la demande directe et évite le sens plus large que pourrait suggérer « nourris-moi ».
