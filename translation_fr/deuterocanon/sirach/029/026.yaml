    rationale: Cette formulation est grammaticalement compréhensible mais non idiomatique; elle alourdit une apostrophe délibérément abrupte. « Étranger » restitue naturellement l’adresse grecque, tandis que la note fournit la précision sociale.
  - severity: medium
    issue: La note propose « immigré » comme alternative.
    rationale: « Immigré » introduit une catégorie contemporaine et ne rend pas nécessairement la nuance de πάροικος, qui désigne plus largement une personne résidant parmi d’autres sans plein statut d’appartenance.
  - severity: low
    issue: « mets la table en ordre »
    rationale: Le sens est juste, mais « dresse la table » est l’équivalent français courant et direct de l’action visée par κόσμησον τράπεζαν.
