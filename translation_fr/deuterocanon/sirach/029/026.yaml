translation_notes:
  register: Français moderne, direct et digne. Le tutoiement correspond aux impératifs grecs au singulier. Les guillemets font entendre la parole impérieuse citée dans le contexte. La légère rudesse de « Passe ton chemin » est intentionnelle.
