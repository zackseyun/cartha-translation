  text: 'These things are grievous to a man who has understanding: the reproach of a household and the insult of a lender.'
translation:
  language: fr
  text: 'Ces choses sont pénibles pour une personne sensée : les reproches des gens de la maison et les insultes d’un prêteur.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαρέα
  choice: pénibles
  rationale: Exprime naturellement le poids moral et affectif de ces expériences, sans exagérer jusqu’à « insupportables ».
- source_word: ἀνθρώπῳ ἔχοντι φρόνησιν
  choice: pour une personne sensée
  rationale: Rend l’expression grecque de manière inclusive et idiomatique ; φρόνησις désigne ici le bon sens ou le discernement pratique.
- source_word: ἐπιτίμησις οἰκίας
  choice: les reproches des gens de la maison
  rationale: 'Le génitif οἰκίας peut être compris comme indiquant la provenance : les reproches venant de la maisonnée. « Gens de la maison » évite le peu naturel « reproche d’une maison ».'
- source_word: ὀνειδισμὸς δανιστοῦ
  choice: les insultes d’un prêteur
  rationale: ὀνειδισμός évoque l’outrage verbal ou l’humiliation ; « insultes » le distingue de ἐπιτίμησις. δανιστής désigne celui qui prête, vraisemblablement de l’argent.
