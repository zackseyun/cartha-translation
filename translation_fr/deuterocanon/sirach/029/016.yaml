  text: A sinner will overturn the good things of a guarantor,[a]
translation:
  language: fr
  text: Le pécheur ruinera les biens de celui qui s’est porté garant.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « renversera les bonnes choses du garant ». Le grec peut désigner largement les bonnes choses, les avantages ou les possessions du garant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαθὰ
  choice: les biens
  rationale: Le neutre pluriel peut désigner largement de bonnes choses, des avantages ou des possessions. Dans le contexte d’une garantie financière, « les biens » rend naturellement le sens probable sans exclure complètement l’idée plus générale de ce qui est bon ou avantageux.
- source_word: ἐγγύου
  choice: de celui qui s’est porté garant
  rationale: Le terme désigne une personne qui garantit l’engagement d’une autre. Cette formulation est claire en français moderne et conserve le sens juridique et financier.
- source_word: ἀνατρέψει
  choice: ruinera
  rationale: Le verbe signifie littéralement renverser ou bouleverser et peut, ici, exprimer la destruction de la situation ou des biens du garant. « Ruinera » transmet clairement cette conséquence dans un français naturel.
- source_word: ἁμαρτωλός
  choice: le pécheur
  rationale: Le singulier sans article grec a une valeur générique. « Le pécheur » constitue en français une formulation proverbiale naturelle et conserve la caractérisation morale sans ajouter de précision étrangère au texte.
theological_decisions:
- issue: Caractérisation morale du sujet
  choice: le pécheur
  alternative: une personne pécheresse
  rationale: Le verset formule un avertissement éthique et qualifie directement le sujet de pécheur. La traduction retenue préserve cette force morale sans transformer l’énoncé en affirmation doctrinale plus large.
translation_notes:
  register: Français moderne, courant et digne. « Celui qui s’est porté garant » évite le terme technique ou vieilli « caution » employé pour une personne, tandis que « ruinera les biens » exprime naturellement la portée contextuelle du grec. La note conserve l’ambiguïté plus large de ἀγαθὰ et la force littérale possible de ἀνατρέψει.
