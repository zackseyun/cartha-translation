translation:
  language: fr
  text: À la base de la vie se trouvent l’eau, le pain, le vêtement et une maison pour couvrir la nudité[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui est honteux » ou « l’indécence ». Le terme grec peut désigner la honte en général, mais aussi plus concrètement la nudité qui doit être couverte.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀρχὴ ζωῆς
  choice: À la base de la vie
  rationale: Cette formulation conserve l’idée d’un commencement ou d’un fondement exprimée par ἀρχή, tout en introduisant naturellement en français la liste des nécessités vitales.
- source_word: ὕδωρ καὶ ἄρτος
  choice: l’eau, le pain
  rationale: Traduction concrète et directe des deux premiers éléments de la liste.
- source_word: ἱμάτιον
  choice: le vêtement
  rationale: Le singulier générique français correspond au vêtement considéré comme nécessité fondamentale.
- source_word: οἶκος
  choice: une maison
  rationale: Le terme garde l’image concrète de l’habitation, sans l’élargir par interprétation à « un abri ».
- source_word: καλύπτων
  choice: qui couvre
  rationale: La proposition relative rend clairement et naturellement le participe présent qui qualifie la maison.
- source_word: ἀσχημοσύνην
  choice: la nudité
  rationale: Dans ce contexte de vêtement et d’habitation, le mot désigne vraisemblablement l’exposition corporelle qu’il convient de couvrir, tout en gardant une connotation de honte ou d’indécence signalée en note.
