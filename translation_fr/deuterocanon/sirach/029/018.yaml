revisions:
- from: Se porter garant[a] en a perdu beaucoup qui suivaient le droit chemin, et les a ballottés comme une vague de la mer ; cela a chassé de chez eux des hommes puissants, et ils ont erré parmi des nations étrangères.
  to: Le cautionnement[a] a ruiné bien des gens qui prospéraient et les a ballottés comme une vague de la mer ; il a chassé de chez eux des hommes puissants, et ils ont erré parmi des nations étrangères.
  rationale: La révision remplace l’infinitif substantivé et le verbe français ambigu « perdre » par une formulation naturelle qui rend clairement la ruine causée. Elle rend κατευθύνοντας par « qui prospéraient », sens contextuellement approprié, sans faire du verset une affirmation sur la rectitude morale. L’ancre de note est conservée et la note explicite l’alternative idiomatique française ainsi que le sens financier.
