  yaml_path: translation/deuterocanon/sirach/029/018.yaml
  text: Surety has destroyed many who were upright[a], and has shaken them like a wave of the sea; it has driven mighty men from their homes, and they wandered among foreign nations.
translation:
  language: fr
  text: Le cautionnement[a] a ruiné bien des gens qui prospéraient et les a ballottés comme une vague de la mer ; il a chassé de chez eux des hommes puissants, et ils ont erré parmi des nations étrangères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le fait de se porter garant ». Le terme grec désigne le fait de se porter garant de la dette d’une autre personne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγύη
  choice: Se porter garant
  rationale: Cette formulation française naturelle exprime l’acte de garantir la dette d’autrui, plutôt qu’une garantie au sens général.
- source_word: ἀπώλεσεν
  choice: en a perdu
  rationale: Le verbe grec indique que cette pratique a causé leur perte ou leur ruine, sans imposer l’idée de mort physique.
- source_word: κατευθύνοντας
  choice: qui suivaient le droit chemin
  rationale: Le participe peut évoquer ceux qui avancent droit ou dont la marche est bien dirigée. Cette traduction préserve l’image morale ou existentielle sans la réduire à la prospérité matérielle.
- source_word: ἐσάλευσεν
  choice: les a ballottés
  rationale: Le verbe désigne une violente mise en mouvement ou un ébranlement ; « ballottés » s’accorde naturellement avec la comparaison maritime qui suit.
- source_word: ὡς κῦμα θαλάσσης
  choice: comme une vague de la mer
  rationale: Traduction proche de l’image grecque au singulier.
- source_word: ἄνδρας δυνατούς
  choice: des hommes puissants
  rationale: Le grec emploie explicitement le nom « hommes » et les qualifie de forts, capables ou puissants.
- source_word: ἀπῴκισεν
  choice: a chassé de chez eux
  rationale: Le verbe exprime l’éloignement forcé du lieu où l’on demeure ; cette formulation prépare l’errance parmi des peuples étrangers.
- source_word: ἐπλανήθησαν
  choice: ils ont erré
  rationale: Dans ce contexte de déplacement, le sens spatial d’errer ou de vagabonder convient mieux que celui d’égarement moral.
- source_word: ἐν ἔθνεσιν ἀλλοτρίοις
  choice: parmi des nations étrangères
  rationale: Rend clairement le séjour au milieu de peuples autres que le sien.
theological_decisions:
- issue: Portée de κατευθύνοντας
  choice: qui suivaient le droit chemin
  alternative: qui prospéraient
  rationale: Le grec autorise une idée de marche droite ou de réussite. Le choix retenu conserve la métaphore de la direction et l’ambiguïté entre rectitude de conduite et cours favorable des affaires.
- issue: Langage masculin dans ἄνδρας δυνατούς
  choice: des hommes puissants
  alternative: des personnes puissantes
  rationale: Le texte grec dit explicitement ἄνδρας ; le masculin est donc conservé sans généralisation.
translation_notes:
  register: Français international moderne, clair et digne. « Se porter garant » privilégie une expression juridique et financière courante ; la phrase conserve le parallélisme et les images fortes du grec.
