review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu, mais « qui suivaient le droit chemin » privilégie indûment une lecture morale de κατευθύνοντας. Dans ce contexte sapientiel et économique, le participe peut aussi désigner ceux dont les affaires allaient bien ; « qui prospéraient » restitue mieux cette portée sans introduire une moralisation. « En a perdu beaucoup » est en outre moins précis que le grec causal (« a ruiné »).
  naturalness: La phrase est compréhensible, mais « Se porter garant en a perdu beaucoup » est lourd et l’emploi de « perdre » avec des personnes est ambigu en français moderne. « Le cautionnement a ruiné bien des gens » est plus idiomatique tout en conservant le sujet abstrait grec.
  terminology: « Cautionnement » désigne avec précision l’engagement de garantir la dette d’autrui. « Hommes puissants », « erré » et « nations étrangères » conviennent au registre et au sens du grec.
