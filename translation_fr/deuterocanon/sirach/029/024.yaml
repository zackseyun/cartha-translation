  text: A miserable life is to go from house to house[a], and where one stays as a stranger[b], he will not open his mouth.
translation:
  language: fr
  text: 'Une vie misérable : aller de maison en maison[a] ; et là où l’on séjourne comme étranger[b], on n’ouvrira pas la bouche.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Une vie misérable, de maison en maison. » Le grec est elliptique ; il évoque une existence instable, ballottée d’un foyer à l’autre.'
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec désigne le séjour de quelqu’un qui réside en un lieu sans y être pleinement chez lui, comme un étranger ou un résident de passage.
    reason: cultural_note
lexical_decisions:
- source_word: ζωὴ πονηρά
  choice: une vie misérable
  rationale: Dans ce contexte, πονηρά qualifie une existence pénible et malheureuse plutôt qu’une vie moralement mauvaise.
- source_word: ἐξ οἰκίας εἰς οἰκίαν
  choice: aller de maison en maison
  rationale: Cette formulation française naturelle conserve l’image d’un déplacement continuel et d’un logement précaire d’un foyer à l’autre.
- source_word: παροικήσει
  choice: séjourne en étranger
  rationale: παροικέω désigne le fait de résider sans être pleinement chez soi ni membre établi du foyer; « en étranger » maintient cette marginalité sociale.
- source_word: οὐκ ἀνοίξει στόμα
  choice: on n’ouvrira pas la bouche
  rationale: La traduction conserve l’expression concrète du grec, qui évoque le silence imposé par l’absence de statut ou d’assurance.
