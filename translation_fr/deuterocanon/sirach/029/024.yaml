translation_notes:
  register: Français moderne, international et digne. L’exclamation rend naturelle la phrase nominale grecque sans effacer son jugement. Le pronom indéfini « on » évite d’introduire un masculin absent du grec tout en maintenant la portée générale du proverbe.
