  text: Many[a], because of wickedness, turned away; they were afraid of being defrauded gratuitously.
translation:
  language: fr
  text: Beaucoup se sont détournés à cause de la méchanceté ; ils ont craint d’être dépouillés pour rien[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Pour rien » peut aussi se comprendre comme « sans raison » ou « en pure perte ».
    reason: ambiguïté lexicale de δωρεὰν
lexical_decisions:
- source_word: πολλοὶ
  choice: Beaucoup
  rationale: L’adjectif substantivé désigne un nombre indéfini de personnes ; « Beaucoup » le rend simplement sans ajouter un nom absent du grec.
- source_word: χάριν πονηρίας
  choice: à cause de la malhonnêteté
  rationale: Avec le génitif, χάριν exprime ici la cause. Dans le contexte des prêts et des pertes injustes, « malhonnêteté » restitue naturellement la portée morale de πονηρία, sans en faire une notion abstraite de grâce ou de faveur.
- source_word: ἀπέστρεψαν
  choice: se sont détournés
  rationale: Le verbe exprime l’idée de se détourner ou de se retirer. La formulation conserve l’absence, dans ce verset, d’un complément explicite tel que « de prêter » ou « d’aider ».
- source_word: ἀποστερηθῆναι
  choice: d’être dépouillés
  rationale: L’infinitif passif évoque le fait d’être privé injustement de ce qui appartient ou revient à quelqu’un. « Être dépouillés » convient au contexte financier tout en gardant la force du verbe.
- source_word: δωρεὰν
  choice: pour rien
  rationale: L’adverbe peut signifier « gratuitement », « sans raison » ou « en pure perte ». « Pour rien » est naturel en français et maintient une part de cette ambiguïté.
- source_word: εὐλαβήθησαν
  choice: ils ont craint
  rationale: Dans ce contexte, le verbe marque une appréhension prudente ; « ont craint » exprime clairement le motif de leur retrait.
theological_decisions:
- issue: Portée morale de πονηρίας dans le contexte des prêts
  choice: malhonnêteté
  alternative: mal ou méchanceté
  rationale: Le contexte immédiat oriente vers les pratiques déloyales liées au remboursement, mais le texte ne désigne aucun acte précis. « Malhonnêteté » garde le jugement moral sans imposer une doctrine particulière.
- issue: Sens de δωρεὰν après ἀποστερηθῆναι
  choice: pour rien
  alternative: sans raison ou en pure perte
  rationale: Le grec peut évoquer soit une injustice sans motif, soit une perte sans contrepartie. La traduction principale ne tranche pas entièrement entre ces nuances, et la note les signale.
translation_notes:
  register: Français moderne, sobre et digne. La construction reste concise et conserve le caractère général de l’énoncé ainsi que l’absence d’un complément explicite après « se sont détournés ».
