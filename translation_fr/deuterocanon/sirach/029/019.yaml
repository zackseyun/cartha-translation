  text: A sinner who falls into surety and pursues contracts will fall into lawsuits[a][b].
translation:
  language: fr
  text: Le pécheur qui s’engage comme caution[b] et qui recherche des contrats tombera dans des procès[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tombera dans des jugements » ou « dans des litiges judiciaires ». Le grec κρίσεις peut désigner de manière générale des procédures judiciaires ou des décisions de justice ; « procès » est retenu ici en raison du contexte de cautionnement et d’engagements contractuels.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit de se porter caution, c’est-à-dire de garantir la dette ou l’obligation d’une autre personne.
    reason: cultural_note
lexical_decisions:
- source_word: ἁμαρτωλός
  choice: le pécheur
  rationale: Le substantif singulier a une portée générique. « Le pécheur » conserve la caractérisation morale sans ajouter de précision étrangère au grec.
- source_word: ἐμπεσὼν εἰς ἐγγύην
  choice: qui se laisse entraîner à garantir la dette d’autrui
  rationale: ἐγγύη désigne le cautionnement, c’est-à-dire le fait de répondre de l’obligation d’un tiers. Cette formulation naturelle explicite la réalité juridique tout en gardant l’idée négative d’un engagement dans lequel on tombe.
- source_word: διώκων
  choice: qui court après
  rationale: Le participe exprime une poursuite active. « Court après » rend sa vigueur et sa nuance défavorable dans ce contexte.
- source_word: ἐργολαβίας
  choice: les contrats
  rationale: Le terme peut désigner des entreprises ou engagements contractuels. « Les contrats » est concis et convient au contexte financier, sans réduire le sens au seul travail sous contrat.
- source_word: ἐμπεσεῖται εἰς κρίσεις
  choice: tombera dans des procès
  rationale: κρίσεις peut désigner des jugements, des procédures ou des litiges judiciaires. Dans le contexte du cautionnement et des contrats, « procès » exprime naturellement la conséquence juridique tout en signalant en note l’étendue du terme grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation explicite le cautionnement pour éviter l’expression technique et peu transparente « tomber dans une caution », tandis que « court après » conserve l’intensité du participe grec.
