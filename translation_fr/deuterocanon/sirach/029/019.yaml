revisions:
- from: Le pécheur qui se laisse entraîner à garantir la dette d’autrui et qui court après les contrats tombera dans des procès[a][b].
  to: Le pécheur qui s’engage comme caution[b] et qui recherche des contrats tombera dans des procès[a].
  rationale: La révision supprime la nuance non explicitée de « se laisse entraîner », emploie une formulation juridique française claire pour ἐγγύη, améliore le naturel de la seconde proposition et replace la note culturelle sur le mot qu’elle explique. Elle conserve la caractérisation morale générique, la portée contractuelle d’ἐργολαβίαι et le sens judiciaire contextualisé de κρίσεις, sans éliminer les autres possibilités dans la note.
