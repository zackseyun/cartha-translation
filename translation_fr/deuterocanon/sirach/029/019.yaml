  naturalness: La phrase révisée est plus idiomatique en français international moderne. « Courir après les contrats » est compréhensible, mais un peu imagé et moins naturel dans ce contexte juridique; « rechercher des contrats » est clair. Le déplacement de la note culturelle auprès de « caution » rend son ancrage plus précis.
  terminology: « Pécheur », « caution », « contrats » et « procès » conviennent au registre et au contexte. « Procès » est une contextualisation recevable de κρίσεις, à condition de maintenir en note les sens plus larges de décisions ou de procédures judiciaires.
