    issue: 'Note a : « chambres fortes »'
    rationale: « Chambres fortes » est peu idiomatique dans ce contexte et restreint inutilement le sens de ταμεῖα. Une note proposant « coffres » ou « réserves » est plus naturelle et plus proche de l’ambiguïté grecque.
