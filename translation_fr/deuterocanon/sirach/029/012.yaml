  verdict: revise
  source_fidelity: Le sens de l’impératif σύγκλεισον (« enfermer », « mettre à l’abri / en réserve ») et l’image de l’aumône conservée comme un bien précieux sont maintenus. « Elle te délivrera de toute affliction » rend fidèlement ἐξελεῖταί σε ἐκ πάσης κακώσεως, sans atténuer l’efficacité que le texte attribue à l’aumône.
  naturalness: '« Dans tes trésors » est peu naturel en français : un trésor désigne normalement les biens précieux eux-mêmes, non le lieu où ils sont gardés. « Dans tes coffres » conserve l’image de biens mis sous garde et produit une formulation moderne plus idiomatique.'
  terminology: « Aumône » reste le terme le plus concis et le plus précis pour ἐλεημοσύνη dans ce contexte. « Coffres » rend de façon naturelle la valeur de réserve/trésor de ταμεῖα sans imposer le sens architectural plus étroit de « chambres ». « Affliction » convient à la portée de κακώσις, qui peut désigner le malheur, l’épreuve ou le mauvais traitement.
