    issue: « dans tes trésors »
    rationale: 'La formulation française est sémantiquement maladroite : elle suggère que l’aumône est placée parmi des objets précieux plutôt que dans un lieu de dépôt. Le grec ταμεῖα désigne ici des lieux de stockage, des réserves ou des trésors au sens de coffres.'
