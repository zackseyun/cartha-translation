  text: Store up almsgiving in your treasuries[b][a], and it will rescue you from every affliction.
translation:
  language: fr
  text: Enferme l’aumône dans tes coffres[a], et elle te délivrera de toute affliction[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Mets l’aumône en réserve dans tes réserves » ; le grec dit littéralement « Enferme l’aumône dans tes coffres » (ou « trésors »).
    reason: lexical_alternative
  - marker: b
    text: Ou « de tout mal » ou « de tout mauvais traitement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: σύγκλεισον
  choice: Enferme
  rationale: L’impératif signifie littéralement « enfermer » ou « enclore ». Avec l’image des trésors, « Enferme » conserve la métaphore concrète d’un bien mis en sûreté.
- source_word: ἐλεημοσύνην
  choice: l’aumône
  rationale: Dans l’usage juif hellénistique, le terme désigne couramment le don concret fait aux nécessiteux. « L’aumône » est précis et demeure intelligible en français moderne.
- source_word: ἐν τοῖς ταμείοις σου
  choice: dans tes trésors
  rationale: ταμεῖον peut désigner une réserve, une chambre ou un trésor. Ici, « trésors » préserve l’image figurée d’une richesse gardée en lieu sûr, sans imposer une architecture domestique précise.
- source_word: ἐξελεῖταί
  choice: te délivrera
  rationale: Le verbe exprime l’action de tirer quelqu’un hors d’un danger. « Délivrera » rend cette idée naturellement, sans renforcer indûment les connotations sotériologiques.
- source_word: ἐκ πάσης κακώσεως
  choice: de toute affliction
  rationale: κακώσις peut évoquer les mauvais traitements, l’épreuve, le malheur ou l’affliction. « Toute affliction » conserve l’ampleur de l’expression et convient au contexte sapientiel.
theological_decisions:
- issue: L’efficacité protectrice attribuée à l’aumône personnifiée
  choice: et elle te délivrera de toute affliction
  alternative: et celle-ci te délivrera de tout mal
  rationale: Le grec attribue directement à l’aumône une capacité de délivrance. La traduction maintient cette affirmation et sa tension théologique sans la réduire à une simple conséquence morale ni lui ajouter de réserve doctrinale.
translation_notes:
  register: Français moderne, digne et direct. Le tutoiement singulier reproduit les formes grecques au singulier. La métaphore volontairement frappante de l’aumône enfermée comme un trésor est conservée.
