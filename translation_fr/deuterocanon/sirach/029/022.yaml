  text: Better is the life of a poor man under shelter than splendid food in another's house[a][b].
translation:
  language: fr
  text: Mieux vaut la vie d’un pauvre sous un toit[a] que des mets somptueux chez autrui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le participe grec rendu dans l’expression « sous un toit » est difficile du point de vue textuel ou lexical; pris au sens strict, il signifie habituellement « paraissant » ou « étant considéré comme ». La traduction suit le sens apparent du proverbe : une vie pauvre mais à l’abri vaut mieux que des repas luxueux dépendant d’autrui.'
    reason: textual_variant
  - marker: b
    text: 'Autre traduction possible : « des mets somptueux parmi des étrangers » ou « dans les biens d’autrui ». Le grec peut désigner plus généralement ce qui appartient à d’autres.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρείσσων
  choice: Mieux vaut
  rationale: Formule comparative naturelle et proverbiale en français moderne.
- source_word: βίος πτωχοῦ
  choice: la vie d’un pauvre
  rationale: Le génitif dépend de βίος; « vie » conserve ici le sens large de condition ou manière de vivre.
- source_word: ὑπὸ σκέπην δοκῶν
  choice: sous un toit
  rationale: ὑπὸ σκέπην évoque un abri ou une couverture. Le participe transmis δοκῶν est difficile dans ce contexte; la traduction rend le sens apparent du proverbe sans masquer le problème, signalé en note.
- source_word: ἐδέσματα λαμπρά
  choice: des mets somptueux
  rationale: ἐδέσματα désigne des aliments préparés ou des plats, et λαμπρά leur caractère magnifique ou luxueux; « mets somptueux » convient au registre sapientiel.
- source_word: ἐν ἀλλοτρίοις
  choice: chez autrui
  rationale: L’expression peut désigner ce qui appartient à d’autres ou le milieu d’autres personnes; dans le contexte du logement et des repas, « chez autrui » reste concis et conserve l’indétermination.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « Mieux vaut… que… » conserve la forme proverbiale; « chez autrui » est idiomatique sans préciser indûment qu’il s’agit d’une maison ni introduire un genre absent de l’expression grecque.
