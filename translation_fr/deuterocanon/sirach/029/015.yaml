  text: Do not forget the kindnesses of a guarantor[b][a], for he gave his life for you.
translation:
  language: fr
  text: N’oublie pas les bienfaits d’un garant[a], car il a donné sa vie pour toi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les faveurs de celui qui s’est porté garant ». Le terme grec désigne celui qui répond de la dette ou de l’obligation d’un autre.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « son âme » ; ici, l’expression peut désigner sa vie ou sa personne, engagée en ta faveur.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτας
  choice: les bienfaits
  rationale: Le pluriel désigne ici les faveurs ou services concrets rendus par le garant. « Bienfaits » conserve cette valeur concrète et plurielle sans évoquer la grâce au sens théologique.
- source_word: ἐγγύου
  choice: de celui qui s’est porté garant pour toi
  rationale: ἐγγύος désigne la personne qui garantit la dette ou l’obligation d’une autre. Cette formulation est naturelle en français moderne et explicite le rapport avec le destinataire.
- source_word: μὴ ἐπιλάθῃ
  choice: N’oublie pas
  rationale: Traduction directe et idiomatique de l’interdiction de ne pas perdre de vue les bienfaits reçus.
- source_word: ἔδωκεν
  choice: il a donné
  rationale: Le verbe simple δίδωμι ne requiert pas ici une nuance sacrificielle ajoutée.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: sa vie
  rationale: Dans ce contexte de mise en danger personnelle, ψυχή désigne naturellement la vie ou la personne elle-même plutôt que l’âme envisagée comme composante anthropologique.
- source_word: ὑπὲρ σοῦ
  choice: pour toi
  rationale: ὑπέρ exprime ici l’action accomplie en faveur du destinataire ou à sa place; « pour toi » reste concis tout en préservant cette amplitude.
theological_decisions:
- issue: Portée de ψυχή dans l’expression τὴν ψυχὴν αὐτοῦ
  choice: sa vie
  alternative: son âme; lui-même
  rationale: Le contexte porte sur le risque assumé par un garant. « Sa vie » rend l’idiome sans transformer le verset en affirmation doctrinale sur l’âme.
- issue: Possible résonance sacrificielle de « donner sa vie pour »
  choice: Conserver la formulation naturelle sans l’interpréter davantage
  alternative: s’est exposé pour toi; s’est livré pour toi
  rationale: Le grec affirme fortement l’engagement du garant, mais le contexte immédiat est financier et social. La traduction garde la tension de l’expression sans imposer une lecture christologique ni l’exclure lexicalement.
translation_notes:
  register: 'Français international moderne, clair et digne. Le tutoiement singulier correspond à σοῦ. La répétition de « pour toi » est maintenue: la première occurrence explicite la fonction du garant, la seconde reflète directement ὑπὲρ σοῦ et souligne son engagement personnel.'
