lexical_decisions:
- source_word: δάνεισον
  choice: Prête
  rationale: Impératif singulier direct, exprimant clairement l'action de consentir un prêt.
- source_word: τῷ πλησίον
  choice: à ton prochain / ton prochain
  rationale: « Prochain » conserve la portée relationnelle et éthique de πλησίον; la répétition du grec est maintenue.
- source_word: ἐν καιρῷ χρείας αὐτοῦ
  choice: au moment où il en a besoin
  rationale: Formulation française naturelle qui rend le temps de son besoin sans réduire χρεία à une détresse extrême.
- source_word: πάλιν
  choice: à ton tour
  rationale: Dans le second membre, le terme marque la réciprocité ou le retour de l'action plutôt qu'une simple répétition temporelle.
- source_word: ἀπόδος
  choice: rembourse
  rationale: Dans le contexte d'un prêt, « rembourser » exprime précisément l'idée de rendre ce qui est dû.
- source_word: εἰς τὸν καιρόν
  choice: au moment convenu
  rationale: Rend l'échéance appropriée ou fixée du remboursement; le contexte favorise cette formulation plutôt que le vague « à temps ».
