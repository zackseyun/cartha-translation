  text: All their works are before him like the sun[a], and his eyes are continually upon their ways.
translation:
  language: fr
  text: Tous leurs actes sont devant lui comme le soleil[a], et ses yeux sont sans cesse sur leurs voies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Toutes leurs œuvres sont devant lui comme le soleil. » La comparaison semble indiquer que les actes humains sont pleinement exposés devant Dieu.'
    reason: La syntaxe de la comparaison est concise et son sens implicite ne doit pas être introduit directement dans le texte.
lexical_decisions:
- source_word: ἅπαντα τὰ ἔργα αὐτῶν
  choice: Tous leurs actes
  rationale: ἅπαντα souligne la totalité, tandis que ἔργα désigne ici l’ensemble des actes ou des œuvres humaines. « Actes » exprime clairement la conduite sans limiter le propos à des réalisations matérielles.
- source_word: ὡς ὁ ἥλιος
  choice: comme le soleil
  rationale: La formulation conserve la comparaison explicite introduite par ὡς, sans ajouter « visibles » ou « clairs », notions seulement suggérées par l’image.
- source_word: ἐναντίον αὐτοῦ
  choice: devant lui
  rationale: Cette expression rend naturellement l’idée de présence et d’exposition au regard de Dieu.
- source_word: οἱ ὀφθαλμοὶ αὐτοῦ
  choice: ses yeux
  rationale: Le rendu garde l’image anthropomorphique concrète du grec plutôt que de la remplacer par une abstraction comme « son regard ».
- source_word: ἐνδελεχεῖς
  choice: sans cesse
  rationale: L’adjectif exprime la continuité ou la constance. La locution adverbiale produit une phrase française naturelle tout en préservant cette idée.
- source_word: ἐπὶ τὰς ὁδοὺς αὐτῶν
  choice: sur leurs voies
  rationale: « Voies » maintient à la fois l’image des chemins et son sens figuré de conduite ou de manière de vivre.
theological_decisions:
- issue: Langage anthropomorphique concernant la connaissance divine
  choice: Conserver « ses yeux sont sans cesse sur leurs voies »
  alternative: « Il observe constamment leur conduite »
  rationale: Le grec parle concrètement des « yeux » de Dieu. Garder cette image respecte la forme et la tension théologique du texte sans la réduire à une formulation abstraite.
- issue: Portée de la comparaison avec le soleil
  choice: Conserver la comparaison littérale « devant lui comme le soleil »
  alternative: « parfaitement visibles devant lui »
  rationale: Le soleil évoque probablement ce qui est pleinement manifeste, mais le grec ne formule pas explicitement cette interprétation. La traduction préserve donc l’image et en explique seulement l’implication possible en note.
translation_notes:
  register: Français international moderne, simple et digne. La phrase conserve les images concrètes du soleil, des yeux et des voies, ainsi que l’étrangeté mesurée de la comparaison grecque.
