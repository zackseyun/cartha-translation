  text: He established with them an everlasting covenant[b][a], and showed them his judgments.
translation:
  language: fr
  text: Il établit avec eux une alliance perpétuelle[a] et leur montra ses jugements[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une alliance éternelle » ou « une alliance pour toujours ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ses ordonnances » ou « ses décrets ».
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκην
  choice: alliance
  rationale: Dans le grec biblique, διαθήκη désigne couramment une alliance, et non un simple accord; ce choix conserve la portée scripturaire et théologique du terme.
- source_word: αἰῶνος
  choice: perpétuelle
  rationale: Le génitif qualifie l’alliance comme durable à travers l’âge; « perpétuelle » est naturel en français dans cette formule biblique tout en laissant ouverte la nuance d’éternité ou de durée indéfinie.
- source_word: ἔστησεν
  choice: établit
  rationale: Le verbe exprime ici l’action d’instituer ou de fixer solidement; « établit » rend cette idée de mise en vigueur durable.
- source_word: μετ᾿ αὐτῶν
  choice: avec eux
  rationale: μετά suivi du génitif signifie naturellement « avec » et préserve la dimension relationnelle de l’alliance.
- source_word: τὰ κρίματα αὐτοῦ
  choice: ses jugements
  rationale: κρίματα peut désigner des jugements, des ordonnances ou des décrets. « Jugements » en conserve l’étendue sémantique et le registre juridico-biblique.
- source_word: ὑπέδειξεν
  choice: montra
  rationale: Le verbe signifie montrer ou indiquer. « Montra » est direct, fidèle et convient au parallélisme de la phrase.
theological_decisions:
- issue: La formulation de l’alliance dans un texte de sagesse
  choice: une alliance perpétuelle
  alternative: une alliance éternelle; une alliance pour toujours
  rationale: Le grec emploie explicitement le vocabulaire de l’alliance. La traduction en conserve la portée théologique sans le réduire à un accord générique, tout en signalant les nuances possibles de αἰῶνος.
- issue: Le sens de κρίματα dans le contexte de l’alliance
  choice: ses jugements
  alternative: ses ordonnances; ses décrets
  rationale: Le contexte n’impose pas un sens exclusivement législatif. « Jugements » maintient à la fois la dimension judiciaire et la force normative du terme.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif scripturaire; la syntaxe demeure claire pour un lectorat général. Les marqueurs de notes suivent immédiatement les termes concernés et corrigent l’inversion des marqueurs constatée dans la couche anglaise.
