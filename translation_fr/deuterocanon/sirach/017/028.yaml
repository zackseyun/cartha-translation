  text: From the dead[a], as from one who no longer exists, praise perishes; but one who is alive and well will praise the Lord.
translation:
  language: fr
  text: D’un mort — comme de quelqu’un qui n’existe plus — la louange[a] se perd ; celui qui est vivant et en bonne santé louera le Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’action de grâce » ; le nom grec peut aussi signifier « confession », mais le parallèle avec « louera le Seigneur » favorise ici le sens de louange ou d’action de grâce.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ νεκροῦ
  choice: Chez un mort
  rationale: Le singulier désigne ici tout mort de manière générique. « Chez un mort » exprime naturellement en français que la louange ne provient plus de lui.
- source_word: ὡς μηδὲ ὄντος
  choice: comme chez quelqu’un qui n’existe plus
  rationale: La formule conserve la comparaison rhétorique du grec sans en faire une affirmation métaphysique sur l’au-delà.
- source_word: ἀπόλλυται
  choice: disparaît
  rationale: Le verbe indique que la louange se perd ou cesse. « Disparaît » est naturel et garde la force du contraste.
- source_word: ἐξομολόγησις
  choice: la louange
  rationale: Dans ce contexte, le parallélisme avec « louera le Seigneur » favorise le sens de louange reconnaissante, tout en laissant les autres valeurs du nom grec en note.
- source_word: ζῶν καὶ ὑγιὴς
  choice: celui qui est vivant et en bonne santé
  rationale: Cette formulation restitue les deux éléments grecs et établit clairement le contraste avec le mort.
- source_word: αἰνέσει
  choice: louera
  rationale: Le futur français correspond directement au futur grec et convient à la forme proverbiale de l’énoncé.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Dans ce contexte sapientiel juif, κύριος désigne Dieu ; « le Seigneur » est la traduction française naturelle et traditionnelle.
theological_decisions:
- issue: 'Sens de ἐξομολόγησις : confession, action de grâce ou louange'
  choice: louange
  alternative: action de grâce ; confession
  rationale: Le parallèle immédiat avec αἰνέσει τὸν κύριον (« louera le Seigneur ») privilégie la louange reconnaissante plutôt qu’une confession des péchés. La note préserve néanmoins l’étendue sémantique du grec.
- issue: Portée de « comme quelqu’un qui n’existe plus »
  choice: Conserver la comparaison rhétorique
  alternative: Formuler une affirmation absolue sur l’état des morts
  rationale: Le grec emploie ὡς, « comme », et présente le mort sous l’angle de son incapacité à louer parmi les vivants ; la traduction ne doit pas transformer cette image en doctrine explicite sur l’existence après la mort.
translation_notes:
  register: Français international moderne, clair et digne. Le point-virgule met en valeur le contraste proverbial sans ajouter de conjonction absente du grec.
