  text: Who will sing praise to the Most High in Hades[c][b][a], instead of the living who give thanks?
translation:
  language: fr
  text: Qui louera le Très-Haut dans l’Hadès[a], à la place des vivants qui rendent grâce ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ici, « Hadès » désigne le domaine des morts, et non nécessairement le lieu du jugement final. On pourrait aussi traduire : « le séjour des morts ».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὑψίστῳ
  choice: le Très-Haut
  rationale: Le datif désigne celui à qui s’adresse la louange. « Le Très-Haut » conserve la valeur de titre divin.
- source_word: τίς αἰνέσει
  choice: Qui louera
  rationale: Le futur de αἰνέω signifie directement « louer ». Cette formulation respecte la question rhétorique sans ajouter l’idée de chant, absente du verbe lui-même.
- source_word: ἐν ᾅδου
  choice: dans l’Hadès
  rationale: Le grec désigne le domaine des morts. « Hadès » traduit directement le témoin grec sans réduire le terme à la tombe ni l’identifier au lieu du châtiment final.
- source_word: ἀντὶ
  choice: à la place de
  rationale: La préposition exprime ici le remplacement ou le contraste entre celui qui se trouve dans l’Hadès et les vivants.
- source_word: ζώντων καὶ διδόντων ἀνθομολόγησιν
  choice: des vivants qui rendent grâce
  rationale: Les participes décrivent les vivants comme ceux qui offrent une action de grâce. « Rendre grâce » est naturel en français et conserve la portée cultuelle de ἀνθομολόγησις.
theological_decisions:
- issue: Sens de ᾅδης dans ce contexte sapientiel
  choice: l’Hadès, compris comme le domaine des morts
  alternative: le séjour des morts ; le shéol ; la tombe
  rationale: Le verset oppose les morts aux vivants capables de louer Dieu. Le terme ne précise pas ici une doctrine du châtiment final ; la traduction conserve donc sa portée générale et la note l’explicite.
- issue: Rapport exprimé par ἀντὶ entre l’Hadès et les vivants
  choice: à la place des vivants
  alternative: plutôt que les vivants
  rationale: La formulation conserve la nuance de substitution ou de contraste du grec sans expliquer davantage la logique rhétorique du verset.
translation_notes:
  register: Français international moderne, sobre et digne. La question rhétorique et le contraste abrupt du grec sont conservés. « Louera » traduit directement αἰνέσει, sans ajouter la notion de chant.
