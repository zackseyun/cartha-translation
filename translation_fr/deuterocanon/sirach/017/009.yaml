  text: so that they might recount the mighty deeds of his works[a].
translation:
  language: fr
  text: afin qu’ils racontent les grandes choses qu’il a accomplies[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les merveilles de ses œuvres » ou « la grandeur de ses œuvres ». Le grec emploie un pluriel désignant des choses grandes ou magnifiques.
    reason: alternative lexicale
lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Introduit le but et appelle naturellement le subjonctif en français.
- source_word: διηγῶνται
  choice: qu’ils racontent
  rationale: Exprime l’action de relater ou d’exposer oralement, sans ajouter la nuance plus solennelle de « proclamer ».
- source_word: τὰ μεγαλεῖα
  choice: la grandeur
  rationale: Le pluriel grec désigne ce qui est grand ou magnifique. Avec le complément « de ses œuvres », le singulier abstrait donne en français une formulation naturelle tout en conservant l’idée de magnificence.
- source_word: τῶν ἔργων
  choice: de ses œuvres
  rationale: Rend directement le génitif grec et le sens courant de ἔργα, ici les actes accomplis par Dieu.
- source_word: αὐτοῦ
  choice: ses
  rationale: Le possessif renvoie à Dieu dans le contexte immédiat.
theological_decisions:
- issue: Référent du possessif αὐτοῦ
  choice: Dieu, d’où « ses œuvres »
  alternative: Un autre référent masculin implicite
  rationale: Le contexte de Siracide 17 traite de l’action de Dieu envers les êtres humains; aucun autre référent n’est vraisemblable ici.
translation_notes:
  register: Français international moderne, simple et digne. « Afin que » conserve nettement la valeur de but; « la grandeur de ses œuvres » évite la lourdeur d’une répétition telle que « les hauts faits de ses actes ».
