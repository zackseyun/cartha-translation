translation:
  language: fr
  text: Il posa son regard sur leurs cœurs[a], pour leur montrer la grandeur de ses œuvres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son œil », au singulier. Le grec emploie une image anthropomorphique.'
    reason: Le texte français emploie « son regard », formulation idiomatique, tandis que la note conserve le singulier et l’image concrète du grec.
lexical_decisions:
- source_word: ἔθηκεν
  choice: Il posa
  rationale: Rend directement l’aoriste de τίθημι et conserve la force concrète du verbe sans préciser indûment la durée.
- source_word: τὸν ὀφθαλμὸν αὐτοῦ
  choice: son œil
  rationale: Conserve le singulier et l’image anthropomorphique concrète du grec. « Son regard » serait plus naturel en français, mais aussi plus interprétatif.
- source_word: ἐπὶ τὰς καρδίας αὐτῶν
  choice: sur leurs cœurs
  rationale: Préserve la métaphore biblique du cœur comme siège de la vie intérieure ainsi que le pluriel grec, sans réduire le sens à l’intelligence ou à la volonté.
- source_word: δεῖξαι αὐτοῖς
  choice: afin de leur montrer
  rationale: L’infinitif exprime ici le but. « Afin de » rend explicitement cette relation, tandis que « montrer » reste proche du sens courant de δείκνυμι.
- source_word: τὸ μεγαλεῖον
  choice: la grandeur
  rationale: Rend le substantif sans le limiter à la majesté abstraite ni à un acte grandiose particulier.
- source_word: τῶν ἔργων αὐτοῦ
  choice: de ses œuvres
  rationale: « Œuvres » convient au registre sapientiel et garde la portée large des actions de Dieu.
theological_decisions:
- issue: Langage anthropomorphique appliqué à la perception divine
  choice: 'Conserver l’image concrète : « Il posa son œil sur leurs cœurs »'
  alternative: « Il posa son regard sur leurs cœurs » ou « Il veilla sur leurs cœurs »
  rationale: Le grec associe délibérément l’« œil » de Dieu aux « cœurs » humains. Maintenir cette tension évite de transformer silencieusement l’image corporelle en une abstraction théologique.
translation_notes:
  register: Français moderne, sobre et digne. La formulation inhabituelle « posa son œil » est intentionnelle afin de préserver l’image grecque ; la note fournit l’équivalent idiomatique.
