  text: He himself watches over the host of the height of heaven[b][a], and all men are earth and ashes.
translation:
  language: fr
  text: Lui-même examine la puissance de la hauteur céleste[a], et tous les êtres humains sont terre et cendre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’armée de la hauteur céleste ». Le grec δύναμις peut signifier « puissance » ou, dans l’usage biblique, désigner une force ou une armée céleste.
    reason: lexical_alternative
lexical_decisions:
- source_word: δύναμιν
  choice: l’armée
  rationale: Dans le grec biblique, δύναμις peut désigner une force organisée ou une armée céleste. « L’armée » convient ici au cadre cosmique, tout en laissant en note le sens lexical « puissance ».
- source_word: ὕψους οὐρανοῦ
  choice: des hauteurs du ciel
  rationale: Cette formulation naturelle en français conserve l’image spatiale et cosmologique du grec sans transformer ὕψους en titre divin.
- source_word: ἐπισκέπτεται
  choice: veille sur
  rationale: Le verbe exprime ici une attention active et une surveillance bienveillante, plutôt qu’une simple visite ponctuelle.
- source_word: οἱ ἄνθρωποι πάντες
  choice: tous les êtres humains
  rationale: L’expression grecque désigne l’humanité entière. Cette traduction inclusive est exacte et naturelle en français moderne.
- source_word: γῆ καὶ σποδός
  choice: terre et cendre
  rationale: Cette traduction respecte précisément les deux noms grecs, sans les assimiler à la formule biblique plus familière « poussière et cendre ».
theological_decisions:
- issue: Sens de δύναμιν dans le contexte céleste
  choice: l’armée
  alternative: la puissance
  rationale: Le sens collectif d’une armée céleste s’accorde bien au contexte, mais le grec demeure réellement ambigu; l’autre sens est donc conservé en note.
- issue: Portée de οἱ ἄνθρωποι πάντες
  choice: tous les êtres humains
  alternative: tous les hommes
  rationale: Le masculin grec a ici une portée générique. « Tous les êtres humains » exprime sans ambiguïté cette portée universelle en français contemporain.
- issue: Rapport entre les deux propositions
  choice: tandis que
  alternative: et
  rationale: La conjonction grecque καί signifie littéralement « et », mais le contexte établit un contraste entre la grandeur céleste et la fragilité humaine. « Tandis que » rend ce rapport sans ajouter de conclusion doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. « Hauteurs du ciel » garde le relief poétique du texte; « ne sont que » rend naturellement la proposition nominale qui souligne la condition fragile de toute l’humanité.
