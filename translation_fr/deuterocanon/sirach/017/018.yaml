  text: A man's almsgiving is like a seal with him[b][a], and he will preserve a person's kindness like the pupil of the eye.
translation:
  language: fr
  text: L’aumône d’un homme est comme un sceau auprès de lui[a], et il conservera le bienfait d’une personne comme la prunelle de l’œil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le contexte, « lui » peut renvoyer à Dieu, mais le grec ne le nomme pas dans ce verset.
    reason: ambiguïté du référent pronominal
  - marker: b
    text: Le sujet de « conservera » n’est pas exprimé en grec. Le contexte peut suggérer « Dieu conservera », mais la phrase elle-même ne le précise pas.
    reason: sujet implicite et lecture contextuelle possible
lexical_decisions:
- source_word: ἐλεημοσύνη
  choice: l’aumône
  rationale: Dans le grec juif hellénistique, le terme désigne couramment un acte concret de miséricorde envers les nécessiteux, notamment un don. « Aumône » conserve cette précision mieux que le terme plus général « charité ».
- source_word: ἀνδρός
  choice: d’un homme
  rationale: Le nom grec est masculin singulier et désigne ici un homme; cette formulation préserve la distinction avec le terme humain plus général ἀνθρώπου dans le second membre.
- source_word: ὡς σφραγὶς μετ᾿ αὐτοῦ
  choice: est auprès de lui comme un sceau
  rationale: « Sceau » rend directement l’image de σφραγίς. « Auprès de lui » garde le pronom masculin de μετ᾿ αὐτοῦ sans en préciser explicitement le référent, tandis que l’ajout naturel de « est » restitue en français la proposition nominale grecque.
- source_word: χάριν
  choice: la bonté
  rationale: Dans ce parallélisme avec l’aumône, χάρις désigne vraisemblablement la bonté manifestée ou un bienfait. « Bonté » reste naturel et évite la charge théologique que pourrait prendre « grâce ».
- source_word: ἀνθρώπου
  choice: d’une personne
  rationale: Ἄνθρωπος est ici le terme général pour un être humain. « D’une personne » en conserve la portée et le singulier.
- source_word: ὡς κόρην
  choice: comme la prunelle de l’œil
  rationale: Κόρη désigne littéralement la pupille. L’expression française consacrée « la prunelle de l’œil » conserve l’image corporelle et l’idée de protection attentive.
- source_word: συντηρήσει
  choice: il gardera
  rationale: Le futur actif singulier exprime l’action de conserver soigneusement ou de protéger. « Gardera » convient à la comparaison avec la prunelle de l’œil et maintient un sujet pronominal dont l’identité est expliquée en note.
theological_decisions:
- issue: Sujet non exprimé de συντηρήσει et référent de αὐτοῦ
  choice: Employer « lui » puis « il », sans nommer le sujet dans le texte
  alternative: Expliciter « Dieu » ou « le Seigneur »
  rationale: Le grec ne répète aucun nom dans ce verset. Le contexte antérieur peut faire de Dieu le référent de « lui » et le sujet de « il gardera », mais l’expliciter dans le corps du texte résoudrait une donnée que la phrase elle-même laisse implicite. La note signale donc cette lecture probable sans l’imposer.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme des deux membres et les images du sceau et de la prunelle de l’œil sont conservés. « Auprès de lui » est préféré à « avec lui », plus ambigu en français, tout en évitant de nommer explicitement Dieu.
