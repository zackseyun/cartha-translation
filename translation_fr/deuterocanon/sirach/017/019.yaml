review_pass:
  verdict: revise
  source_fidelity: Le projet rend correctement la séquence temporelle et l’image du relèvement. Toutefois, « ce qui leur est dû » puis « ce qu’ils méritent » paraphrase et diversifie indûment la répétition grecque de la famille ἀνταποδίδωμι / ἀνταπόδομα / ἀποδίδωμι. « Ce qu’ils méritent » explicite en outre l’évaluation morale au lieu de conserver le substantif grec « leur rétribution ».
  naturalness: La formulation proposée est naturelle, mais la révision reste idiomatique en français moderne et donne une structure plus resserrée, conforme aux deux verbes coordonnés du grec.
  terminology: « Rétribuer / rétribution » conserve de manière lisible le champ lexical répétitif de la réciprocité et de la rétribution. L’expression « sur leur tête » maintient l’image biblique sans imposer une interprétation doctrinale.
  issues:
  - severity: medium
    issue: Perte de la répétition lexicale grecque de la rétribution
    rationale: Le grec emploie successivement ἀνταποδώσει, ἀνταπόδομα et ἀποδώσει. Le projet passe de « rendra ce qui leur est dû » à « ce qu’ils méritent », ce qui affaiblit cette cohésion et remplace le nom « leur rétribution » par une paraphrase évaluative.
  - severity: low
    issue: Explicitation interprétative dans « ce qu’ils méritent »
    rationale: Cette expression est compatible avec le contexte judiciaire, mais elle ne correspond pas aussi étroitement au possessif αὐτῶν et au substantif ἀνταπόδομα que « leur rétribution ».
