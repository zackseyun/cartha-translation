  text: After this he will rise up and repay them[b][a], and he will bring their repayment upon their head.
translation:
  language: fr
  text: Après cela, il se lèvera[a], il les rétribuera et fera retomber leur rétribution sur leur tête[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il se dressera ». Le verbe grec signifie littéralement « se lever » et évoque une intervention décisive.
    reason: lexical_alternative
  - marker: b
    text: '« Sur leur tête » est une expression imagée : les conséquences de leurs actes retombent sur eux-mêmes.'
    reason: cultural_note
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Après cela
  rationale: Rend explicitement la succession temporelle dans un français naturel et proche du grec.
- source_word: ἐξαναστήσεται
  choice: il se lèvera
  rationale: Conserve l’image concrète du fait de se lever pour agir, sans la réduire à un simple auxiliaire d’action.
- source_word: ἀνταποδώσει αὐτοῖς
  choice: leur rendra ce qui leur est dû
  rationale: Exprime le sens réciproque de la rétribution dans un français courant et digne ; le contexte indique ici une rétribution judiciaire.
- source_word: τὸ ἀνταπόδομα αὐτῶν
  choice: ce qu’ils méritent
  rationale: Évite le calque peu naturel « leur rétribution » tout en conservant l’idée de la contrepartie correspondant à leurs actes.
- source_word: εἰς κεφαλὴν αὐτῶν ἀποδώσει
  choice: il fera retomber sur leur tête
  rationale: Préserve l’image idiomatique de la conséquence qui revient sur les personnes concernées, avec une formulation française intelligible.
theological_decisions:
- issue: Caractère personnel et rétributif de l’action divine
  choice: « il se lèvera et leur rendra ce qui leur est dû »
  alternative: « il agira contre eux et leur donnera ce qu’ils méritent »
  rationale: Le grec présente une intervention personnelle et décisive ainsi qu’une rétribution en retour. La traduction ne transforme pas ce jugement en conséquence purement impersonnelle.
- issue: Valeur de αὐτῶν dans τὸ ἀνταπόδομα αὐτῶν
  choice: « ce qu’ils méritent »
  alternative: « la rétribution de leurs actes »
  rationale: Le texte ne nomme pas explicitement leurs actes. La formulation retenue garde l’idée de rétribution sans ajouter un complément absent du grec.
translation_notes:
  register: Français international moderne, naturel et digne. La structure en deux propositions et l’image biblique de la tête sont conservées, tandis que la répétition grecque de la famille lexicale de la rétribution est rendue de façon idiomatique.
