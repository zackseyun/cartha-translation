lexical_decisions:
- source_word: προσέθηκεν
  choice: accorda en plus
  rationale: Rend l’idée d’un don ajouté tout en évitant le tour peu naturel « ajouta la connaissance à eux ».
- source_word: ἐπιστήμην
  choice: la connaissance
  rationale: Le terme désigne ici largement la connaissance ou l’intelligence, sans imposer le sens plus spécialisé de compétence technique.
- source_word: νόμον ζωῆς
  choice: la loi de vie
  rationale: Conserve de près le rapport génitif du grec et laisse ouverte la relation précise entre la loi et la vie.
- source_word: ἐκληροδότησεν
  choice: légua
  rationale: Exprime clairement la nuance d’héritage portée par le verbe grec, dans un français actuel et digne.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom datif est rendu dans les deux propositions, conformément à sa répétition en grec.
theological_decisions:
- issue: Sens de νόμον ζωῆς
  choice: la loi de vie
  alternative: la loi qui donne la vie
  rationale: La formulation principale préserve l’ambiguïté du génitif grec; l’alternative explicite une lecture possible sans l’imposer au texte.
translation_notes:
  register: Français international moderne, naturel et soutenu. « Accorda en plus » garde la notion d’ajout sans calque maladroit; « légua » maintient l’image de l’héritage.
