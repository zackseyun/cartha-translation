  yaml_path: translation/deuterocanon/sirach/017/022.yaml
  text: Return to the Most High and turn away from unrighteousness[c][b][a], and hate what is abominable intensely.
translation:
  language: fr
  text: Reviens vers le Très-Haut[a], détourne-toi de l’injustice[b] et déteste profondément ce qui est abominable.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Retourne vers le Très-Haut ». Le verbe grec exprime le retour et la réorientation vers Dieu.
    reason: lexical_alternative
  - marker: b
    text: Le mot grec peut aussi se traduire par « iniquité », « mal » ou « faute »; il désigne largement ce qui est contraire à la justice.
    reason: lexical_alternative
  - marker: c
    text: Le texte grec conservé est suivi ici de près. La transmission et la numérotation de ce passage du Siracide présentent des divergences entre les témoins et les éditions.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπάναγε
  choice: Reviens
  rationale: L’impératif appelle à revenir vers Dieu, avec une portée de repentance et de réorientation; « Reviens » est direct et naturel.
- source_word: ἐπὶ Ὕψιστον
  choice: vers le Très-Haut
  rationale: La préposition exprime ici l’orientation, tandis que « le Très-Haut » conserve le titre divin.
- source_word: ἀπόστρεφε
  choice: détourne-toi
  rationale: Le présent impératif exprime une conduite à adopter durablement; le verbe pronominal rend clairement l’éloignement moral.
- source_word: ἀπὸ ἀδικίας
  choice: de l’injustice
  rationale: ἀδικία couvre l’injustice, le mal et l’iniquité. « Injustice » est moderne et intelligible, sans limiter nécessairement le terme aux seuls rapports sociaux.
- source_word: σφόδρα
  choice: profondément
  rationale: L’adverbe intensifie le commandement. « Profondément » se joint naturellement à « déteste » en français actuel.
- source_word: μίσησον
  choice: déteste
  rationale: Le verbe grec est fort; « déteste » en conserve la vigueur sans l’atténuer.
- source_word: βδέλυγμα
  choice: ce qui est abominable
  rationale: Cette formulation naturelle garde la force morale de βδέλυγμα tout en évitant le tour moins idiomatique « déteste une abomination ».
theological_decisions:
- issue: Portée de ἀδικία dans l’exhortation au retour vers Dieu
  choice: injustice
  alternative: iniquité; mal
  rationale: Le grec demeure assez large pour désigner ce qui est contraire à la justice. « Injustice » préserve cette notion sans imposer une catégorie doctrinale particulière; une note signale les autres nuances possibles.
- issue: Force de βδέλυγμα
  choice: ce qui est abominable
  alternative: l’abomination; ce qui est détestable
  rationale: La traduction conserve la forte réprobation du grec, sans préciser indûment si l’objet relève du domaine moral, cultuel ou des deux.
translation_notes:
  register: Français international moderne, exhortatif et digne. Le parallélisme des deux impératifs est conservé, ainsi que la forte intensité de la dernière proposition.
