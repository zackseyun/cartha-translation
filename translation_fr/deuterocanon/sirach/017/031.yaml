  text: What is brighter than the sun? Yet even this fails[b][a], and flesh and blood devises evil.
translation:
  language: fr
  text: Quoi de plus lumineux que le soleil ? Pourtant, lui aussi cesse de briller[a]. Et le méchant songera à la chair et au sang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’éclipse », « disparaît » ou « vient à manquer »; le verbe grec peut exprimer la défaillance, la cessation ou l’éclipse.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί φωτεινότερον ἡλίου
  choice: Quoi de plus lumineux que le soleil ?
  rationale: Le pronom interrogatif neutre τί introduit une question rhétorique, et le génitif ἡλίου après le comparatif exprime la comparaison.
- source_word: καὶ τοῦτο ἐκλείπει
  choice: Pourtant, lui aussi cesse de briller[a]
  rationale: Dans ce contexte solaire, ἐκλείπει évoque la défaillance ou la disparition de la lumière. « Cesse de briller » reste naturel sans limiter le sens à une éclipse astronomique; « pourtant » rend la valeur contrastive de καί.
- source_word: πονηρὸς
  choice: le méchant
  rationale: L’adjectif masculin au nominatif est employé substantivement et désigne une personne mauvaise; la forme grecque fournie n’est pas l’accusatif neutre signifiant « le mal ».
- source_word: ἐνθυμήσεται
  choice: songera à
  rationale: Le futur moyen de ἐνθυμέομαι exprime ici une réflexion intérieure ou le fait d’avoir quelque chose à l’esprit; le futur grec est conservé.
- source_word: σάρκα καὶ αἷμα
  choice: la chair et au sang
  rationale: Les deux accusatifs sont les compléments de ἐνθυμήσεται dans le texte grec fourni. La formulation concrète est conservée plutôt que transformée en sujet collectif désignant l’humanité.
theological_decisions:
- issue: Rapport syntaxique entre πονηρὸς et σάρκα καὶ αἷμα
  choice: « le méchant songera à la chair et au sang »
  alternative: « la chair et le sang conçoivent le mal »
  rationale: Le grec fourni porte πονηρὸς au nominatif masculin, comme sujet, et σάρκα καὶ αἷμα à l’accusatif, comme complément. L’autre traduction exigerait normalement des formes grecques différentes et n’est donc pas imposée au texte source malgré la formulation de la couche anglaise.
translation_notes:
  register: Français moderne, sobre et digne. La question initiale est idiomatique; la dernière proposition demeure volontairement proche de la syntaxe grecque, qui diffère de l’analyse retenue dans la couche anglaise.
