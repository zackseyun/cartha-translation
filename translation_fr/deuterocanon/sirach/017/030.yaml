  text: For not everything can be among human beings[a], because a son of man is not immortal.
translation:
  language: fr
  text: Car tout ne peut pas se trouver chez les êtres humains, puisqu’un fils d’homme[a] n’est pas immortel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « un fils d’homme » : tournure de style hébraïque désignant ici un être humain mortel, et non un titre messianique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ δύναται
  choice: Car ... ne peut pas
  rationale: Le verbe δύναται exprime ici la possibilité ou la capacité; « ne peut pas » est naturel en français, tandis que γάρ introduit l’explication par « Car ».
- source_word: πάντα εἶναι ἐν ἀνθρώποις
  choice: tout ne peut pas se trouver chez les êtres humains
  rationale: La formulation grecque est condensée. « Se trouver chez » rend l’idée de présence au sein de l’humanité sans imposer une interprétation plus précise de ce que recouvre πάντα, « tout ».
- source_word: ἀνθρώποις
  choice: les êtres humains
  rationale: Le pluriel désigne ici l’humanité en général, et non uniquement les hommes de sexe masculin.
- source_word: ὅτι
  choice: puisque
  rationale: ὅτι donne la raison de l’affirmation précédente. « Puisque » rend clairement ce rapport logique sans répéter « car ».
- source_word: οὐκ ἀθάνατος
  choice: n’est pas immortel
  rationale: ἀθάνατος signifie « immortel » ou « qui ne meurt pas »; « immortel » est le terme français direct et courant.
- source_word: υἱὸς ἀνθρώπου
  choice: un fils d’homme
  rationale: La traduction littérale conserve la tournure sémitique reflétée par le grec. L’article indéfini convient à l’énoncé général et la note prévient une lecture comme titre messianique.
theological_decisions:
- issue: Faut-il rendre υἱὸς ἀνθρώπου de façon idiomatique ou conserver sa forme littérale?
  choice: un fils d’homme
  alternative: un être humain
  rationale: Dans ce contexte, l’expression désigne un humain mortel et ne fonctionne pas comme un titre messianique. La formulation littérale préserve toutefois la texture de la source; une note en explicite le sens générique.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « tout ne peut pas se trouver chez les êtres humains » conserve l’expression volontairement condensée du grec, tandis que « un fils d’homme » maintient sa couleur sémitique sans majuscules titulaires.
