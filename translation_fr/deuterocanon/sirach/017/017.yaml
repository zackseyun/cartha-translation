  text: Their injustices were not hidden from him[a], and every sin of theirs was before the Lord.
translation:
  language: fr
  text: Leurs injustices ne lui ont pas été cachées[a], et chacun de leurs péchés est devant le Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « n’ont pas échappé à son regard ». Le grec dit plus littéralement : « ne lui ont pas été cachées ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐκρύβησαν
  choice: ne lui ont pas été cachées
  rationale: Le passif grec signifie littéralement « n’ont pas été cachées ». Cette formulation conserve l’image des injustices exposées au regard de Dieu.
- source_word: αἱ ἀδικίαι αὐτῶν
  choice: leurs injustices
  rationale: ἀδικία désigne l’injustice ou une action contraire à ce qui est juste. « Leurs injustices » reste proche du grec et convient au registre sapientiel.
- source_word: ἀπ᾿ αὐτοῦ
  choice: lui
  rationale: 'Avec le verbe « cacher », le français exprime naturellement ἀπ᾿ αὐτοῦ par le pronom indirect « lui » : rien ne lui a été caché.'
- source_word: πᾶσα ἁμαρτία αὐτῶν
  choice: chacun de leurs péchés
  rationale: Le singulier distributif πᾶσα ἁμαρτία souligne chaque péché pris individuellement. « Chacun de leurs péchés » rend cette nuance plus naturellement que « tout péché d’eux ».
- source_word: ἔναντι Κυρίου
  choice: devant le Seigneur
  rationale: ἔναντι signifie « devant » ou « en présence de ». La traduction concise « devant le Seigneur » conserve l’image et rend Κυρίου par « Seigneur » conformément au texte grec.
theological_decisions:
- issue: L’omniscience divine impliquée par la mise au jour du péché humain
  choice: Le verset affirme que les injustices ne sont pas cachées à Dieu et que chaque péché demeure devant le Seigneur.
  alternative: « Aucune de leurs fautes n’a échappé au regard du Seigneur. »
  rationale: Le grec emploie l’image de ce qui n’est pas caché et se trouve devant le Seigneur. La traduction la préserve sans développer une formulation doctrinale plus explicite.
translation_notes:
  register: Français international moderne, clair et digne. La première proposition reste formellement proche du grec; la seconde emploie « chacun de leurs péchés » pour rendre naturellement la valeur distributive de πᾶσα avec le singulier.
