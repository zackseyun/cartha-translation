translation:
  language: fr
  text: Reviens au Seigneur et abandonne tes péchés ; supplie-le en sa présence[a] et réduis l’obstacle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « devant [la] face » ; cette expression signifie ici s’adresser directement à Dieu, en sa présence.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « diminue ce qui fait trébucher » ou « réduis la pierre d’achoppement ». Le grec peut désigner un obstacle ou une cause de chute morale.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐπίστρεφε
  choice: Reviens
  rationale: L’impératif exprime un retour ou un mouvement vers Dieu. « Reviens » conserve cette dimension relationnelle sans expliciter davantage par « repens-toi ».
- source_word: ἐπὶ Κύριον
  choice: au Seigneur
  rationale: Avec ἐπιστρέφω, ἐπί suivi de l’accusatif marque la direction. « Au Seigneur » est naturel en français et conserve le titre divin.
- source_word: ἀπόλειπε ἁμαρτίας
  choice: abandonne tes péchés
  rationale: ἀπολείπω appelle une séparation nette, et le pluriel ἁμαρτίας est maintenu. Le possessif, idiomatique en français, désigne les péchés de la personne exhortée.
- source_word: δεήθητι
  choice: supplie-le
  rationale: Le verbe δέομαι désigne plus précisément une prière de demande ou une supplication. Le pronom reprend naturellement « le Seigneur », implicite dans la formulation grecque condensée.
- source_word: κατὰ πρόσωπον
  choice: en sa présence
  rationale: Littéralement « devant [la] face », expression idiomatique qui évoque le fait de se tenir directement devant Dieu. « En sa présence » en restitue naturellement le sens en français.
- source_word: σμίκρυνον
  choice: réduis
  rationale: L’impératif signifie rendre plus petit, diminuer ou réduire.
- source_word: πρόσκομμα
  choice: les occasions de chute
  rationale: Le terme peut désigner un obstacle, une pierre d’achoppement ou ce qui provoque une chute morale. Cette formulation française reste concrète sans déterminer si la cause est intérieure ou extérieure.
theological_decisions:
- issue: Référent implicite de κατὰ πρόσωπον
  choice: « supplie-le en sa présence » renvoie au Seigneur mentionné juste avant
  alternative: « supplie devant sa face »
  rationale: Le grec ne répète pas explicitement le référent, mais le contexte l’indique. La formulation retenue évite une expression artificielle en français tout en préservant l’idée d’une démarche directe devant Dieu.
- issue: Portée morale de πρόσκομμα
  choice: « les occasions de chute »
  alternative: « l’obstacle » ou « ce qui fait trébucher »
  rationale: Le mot peut viser un obstacle concret ou une cause de faute morale. Le pluriel idiomatique français exprime cette portée sans identifier abusivement la nature précise de l’obstacle.
translation_notes:
  register: Français international moderne, simple et digne. Les impératifs sont directs. « Supplie-le » garde la nuance de prière insistante, tandis que « occasions de chute » rend intelligible l’image morale sans en fixer excessivement le référent.
