  text: Their eyes saw a majestic glory[a], and their ears heard the glory of his voice.
translation:
  language: fr
  text: Leurs yeux ont vu une gloire majestueuse, et leurs oreilles ont entendu la gloire de leur voix[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec transmis dit littéralement « la gloire de leur voix ». Le texte est difficile ; dans le contexte, il pourrait s’agir de la voix de Dieu.
    reason: textual_variant
lexical_decisions:
- source_word: μεγαλεῖον δόξης
  choice: la majesté de la gloire
  rationale: μεγαλεῖον désigne ici quelque chose de grandiose ou de majestueux. Cette formulation conserve le lien génitif avec δόξης et le style élevé sans ajouter un possesseur absent du grec.
- source_word: εἶδον οἱ ὀφθαλμοὶ αὐτῶν
  choice: Leurs yeux ont vu
  rationale: La traduction maintient la mention explicite des yeux ainsi que le parallélisme sensoriel avec l’oreille dans la proposition suivante.
- source_word: δόξαν φωνῆς αὐτῶν
  choice: la gloire de leur voix
  rationale: Le texte grec transmis porte αὐτῶν, « leur », et répète δόξα, « gloire ». Malgré la difficulté de l’expression, la traduction principale conserve cette lecture au lieu de la corriger tacitement.
- source_word: ἤκουσεν τὸ οὖς αὐτῶν
  choice: leur oreille a entendu
  rationale: Le grec emploie le singulier τὸ οὖς avec un possessif pluriel. Le singulier distributif reste intelligible en français et respecte la forme du texte source.
theological_decisions:
- issue: Possessif associé à « voix »
  choice: leur voix
  alternative: sa voix, c’est-à-dire la voix de Dieu
  rationale: Le grec de Swete lit explicitement αὐτῶν, « leur », même si cette lecture paraît difficile dans le contexte d’une révélation divine. La traduction conserve le texte transmis et signale en note l’interprétation contextuelle possible, sans résoudre silencieusement la tension.
translation_notes:
  register: Français moderne, soutenu et biblique. La formulation volontairement inhabituelle de la seconde proposition reflète une difficulté réelle du texte grec ; la note fournit l’interprétation contextuelle sans l’imposer au texte principal.
