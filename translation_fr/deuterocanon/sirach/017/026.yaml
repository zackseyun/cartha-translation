  text: For not everything can be in human beings, because a son of man is not immortal.
translation:
  language: fr
  text: Car tout ne peut pas se trouver chez les êtres humains, puisque un fils d’homme[a] n’est pas immortel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un être humain ». Le grec dit littéralement « un fils d’homme »; il s’agit ici d’une expression générique désignant l’être humain mortel, et non d’un titre.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Car… ne… pas
  rationale: γάρ introduit l’explication de ce qui précède; « Car » conserve ce lien argumentatif sans le surinterpréter.
- source_word: δύναται πάντα εἶναι
  choice: tout ne peut pas se trouver
  rationale: Cette formulation rend la possibilité exprimée par δύναται et donne à πάντα sa portée globale, dans un français naturel.
- source_word: ἐν ἀνθρώποις
  choice: chez les êtres humains
  rationale: Dans ce contexte collectif, ἐν se rend naturellement par « chez »; « les êtres humains » garde la référence générique et inclusive de ἀνθρώποις.
- source_word: ἀθάνατος
  choice: immortel
  rationale: Équivalent direct qui préserve le contraste entre les limites humaines et l’immortalité.
- source_word: υἱὸς ἀνθρώπου
  choice: le fils d’un être humain
  rationale: La traduction conserve l’image filiale et la valeur générique de l’expression grecque, sans en faire le titre « le Fils de l’homme ».
theological_decisions:
- issue: 'Valeur de υἱὸς ἀνθρώπου : titre ou désignation générique'
  choice: 'Désignation générique : « le fils d’un être humain »'
  alternative: « un être humain »; « le Fils de l’homme »
  rationale: Le contexte sapientiel, l’absence d’article en grec et l’affirmation de la mortalité indiquent une référence générique à l’être humain. La formulation retenue préserve néanmoins l’expression imagée du texte source et évite d’importer un titre messianique.
translation_notes:
  register: Français international moderne, digne et accessible. « Chez les êtres humains » est plus idiomatique que le calque « dans les êtres humains », tandis que « le fils d’un être humain » garde l’étrangeté signifiante de l’expression grecque sans suggérer le titre christologique traditionnel.
