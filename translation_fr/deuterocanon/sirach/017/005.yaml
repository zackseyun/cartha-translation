  text: He gave them counsel and a tongue and eyes[a], ears and a heart[b], to reason with.
translation:
  language: fr
  text: Il leur a donné la capacité de délibérer, une langue, des yeux, des oreilles et un cœur[a], afin qu’ils puissent réfléchir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans la pensée biblique, le « cœur » est aussi le siège de la réflexion et de la volonté, et non seulement des émotions.
    reason: cultural_note
lexical_decisions:
- source_word: διαβούλιον
  choice: la faculté de réfléchir
  rationale: Le nom désigne ici la capacité de délibérer et de former un jugement. Cette formulation naturelle en français exprime une faculté humaine plutôt qu’un conseil particulier.
- source_word: γλῶσσαν
  choice: une langue
  rationale: Le terme concret est conservé, conformément à l’énumération grecque des organes et facultés.
- source_word: ὀφθαλμούς
  choice: des yeux
  rationale: Le pluriel concret reproduit directement le grec sans le remplacer par la fonction abstraite de la vue.
- source_word: ὦτα
  choice: des oreilles
  rationale: Le terme concret est maintenu plutôt que d’être rendu par « l’ouïe ».
- source_word: καρδίαν
  choice: un cœur
  rationale: « Cœur » préserve l’anthropologie biblique, où cet organe représente aussi le siège de la pensée et de la volonté.
- source_word: ἔδωκεν
  choice: Il leur a donné
  rationale: Le passé composé est naturel en français moderne et rend directement l’aoriste dans ce récit des dons accordés aux humains.
- source_word: διανοεῖσθαι
  choice: pour penser
  rationale: L’infinitif exprime la finalité des dons et désigne l’activité de l’intelligence. « Penser » reste sobre et n’impose pas le sens plus étroit de raisonner.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom datif est naturellement placé devant « a donné » en français.
theological_decisions:
- issue: Sens anthropologique de καρδία
  choice: Conserver « cœur » et signaler sa portée cognitive en note.
  alternative: esprit ; intelligence
  rationale: Le grec associe explicitement le cœur à l’activité mentale. Traduire par « intelligence » effacerait l’image et réduirait la tension propre à l’anthropologie biblique.
- issue: Nature mixte de l’énumération
  choice: Conserver les organes concrets avec la faculté abstraite initiale.
  alternative: 'Transformer toute la liste en facultés abstraites : parole, vue, ouïe et intelligence.'
  rationale: Le texte grec juxtapose lui-même une capacité de délibération et des parties du corps. Cette forme ne doit pas être artificiellement uniformisée.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe compacte de l’énumération grecque est préservée, avec une légère explicitation de διαβούλιον pour éviter que « conseil » soit compris comme un avis donné.
