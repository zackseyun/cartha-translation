  text: And he clothed them with strength[a], and made them according to his image.
translation:
  language: fr
  text: Il les revêtit de force et les fit à son image[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon son image ». L’expression grecque fait écho au langage du récit de la création dans la Genèse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέδυσεν
  choice: revêtit
  rationale: Le verbe signifie littéralement « vêtir » ou « revêtir ». Avec « force » comme complément, « revêtit de force » conserve la métaphore grecque tout en restant naturel en français.
- source_word: ἰσχύν
  choice: force
  rationale: ἰσχύς désigne la force ou la vigueur. « Force » est ici l’équivalent français le plus direct, sans élargir le sens vers une notion plus abstraite de pouvoir.
- source_word: κατ᾿ εἰκόνα αὐτοῦ
  choice: à son image
  rationale: Cette formulation française, naturelle et traditionnelle, rend κατά avec l’accusatif dans ce contexte et maintient clairement l’écho au récit de la création dans la Genèse.
- source_word: ἐποίησεν
  choice: fit
  rationale: ποιέω est le verbe général « faire ». « Fit » suit directement le grec, tandis que « créa » préciserait davantage le sens que ne le fait ce verbe dans la proposition.
- source_word: αὐτούς
  choice: les
  rationale: Le pronom masculin pluriel renvoie collectivement aux êtres humains déjà mentionnés ; le pronom objet « les » en conserve la référence sans ajout.
theological_decisions:
- issue: Anthropologie liée à la Genèse dans κατ᾿ εἰκόνα αὐτοῦ
  choice: à son image
  alternative: selon son image
  rationale: « À son image » préserve le lien explicite entre l’humanité et l’image de Dieu, ainsi que l’allusion au langage de la création, sans développer doctrinalement ce que cette relation implique. La note signale la forme plus littérale de la préposition grecque.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme des deux propositions est conservé, de même que la métaphore concrète « revêtir de force ». Le passé simple convient au registre narratif biblique sans être archaïque.
