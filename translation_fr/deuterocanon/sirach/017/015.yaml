  text: For each nation he appointed a ruler[a], and Israel is the Lord’s own portion.
translation:
  language: fr
  text: À chaque nation, il a établi un dirigeant, et Israël est la part du Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑκάστῳ ἔθνει
  choice: À chaque nation
  rationale: Le datif a une valeur distributive. Cette formulation restitue directement et naturellement l’idée d’une attribution faite à chacune des nations.
- source_word: κατέστησεν
  choice: il a établi
  rationale: Le verbe exprime ici la mise en place de quelqu’un dans une fonction d’autorité. « Établi » conserve cette nuance sans préciser davantage le mode de désignation.
- source_word: ἡγούμενον
  choice: un dirigeant
  rationale: Le participe désigne une personne qui conduit ou gouverne. « Dirigeant » est courant, neutre et suffisamment large pour ne pas imposer un titre politique précis.
- source_word: μερὶς
  choice: la part
  rationale: « Part » rend le sens fondamental de μερίς et préserve l’image biblique d’appartenance ou de lot attribué, sans l’expliciter en « héritage ».
- source_word: Κυρίου
  choice: du Seigneur
  rationale: Le génitif possessif est rendu simplement; κύριος reçoit sa traduction biblique habituelle « Seigneur ».
- source_word: Ἰσραήλ
  choice: Israël
  rationale: Forme française traditionnelle et standard du nom propre.
- source_word: ἐστιν
  choice: est
  rationale: La copule grecque est conservée sans développement interprétatif.
theological_decisions:
- issue: Rapport entre les nations et Israël
  choice: Conserver la coordination « et »
  alternative: Employer « mais » pour expliciter un contraste implicite
  rationale: Le grec porte καί, normalement « et ». Même si le contexte peut suggérer un contraste entre les dirigeants assignés aux nations et la relation particulière d’Israël au Seigneur, la traduction ne l’impose pas et préserve ainsi l’ambiguïté du texte.
- issue: Sens de « part du Seigneur »
  choice: Conserver l’image concise de la « part »
  alternative: « Israël appartient en propre au Seigneur » ou « Israël est l’héritage du Seigneur »
  rationale: Ces variantes expliciteraient soit l’appartenance exclusive, soit une notion d’héritage que μερίς peut évoquer sans la formuler nécessairement. La traduction retenue maintient l’image et sa portée théologique ouverte.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase suit de près la structure grecque tout en restant naturelle. « Dirigeant » évite aussi bien l’archaïsme que l’attribution d’un titre institutionnel particulier.
