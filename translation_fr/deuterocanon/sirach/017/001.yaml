  text: The Lord created man from the earth[a], and returned him to it again.
translation:
  language: fr
  text: Le Seigneur a créé l’être humain de la terre[a], et il l’a fait retourner à la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’homme » ou « un être humain »; le grec emploie le singulier ἄνθρωπον avec une portée représentative pour l’humanité.
    reason: Alternative lexicale et précision sur la portée collective du singulier grec.
lexical_decisions:
- source_word: Κύριος
  choice: Le Seigneur
  rationale: Rendu français usuel de κύριος comme titre divin.
- source_word: ἔκτισεν
  choice: a créé
  rationale: κτίζω désigne ici l’acte créateur; « a créé » conserve la dignité et l’écho du récit de la création sans préciser indûment la manière.
- source_word: ἐκ γῆς
  choice: de la terre
  rationale: La préposition ἐκ exprime l’origine; « de la terre » est naturel en français et maintient le motif de l’origine terrestre.
- source_word: ἄνθρωπον
  choice: l’être humain
  rationale: Le singulier grec a ici une portée représentative et désigne la créature humaine; cette formulation française conserve le singulier sans le restreindre au sexe masculin.
- source_word: πάλιν
  choice: retourner
  rationale: La valeur de retour portée par πάλιν est exprimée naturellement avec le verbe « retourner », sans ajouter un « de nouveau » redondant en français.
- source_word: ἀπέστρεψεν
  choice: a fait retourner
  rationale: La construction causative rend le fait que le Seigneur ramène l’être humain vers son lieu d’origine.
- source_word: εἰς αὐτήν
  choice: à la terre
  rationale: Le pronom féminin renvoie à γῆ; répéter « la terre » évite en français un pronom potentiellement peu clair.
theological_decisions:
- issue: Portée anthropologique de ἄνθρωπον
  choice: Traduire par « l’être humain » au singulier représentatif.
  alternative: « l’homme » ou « l’humanité »
  rationale: Le grec emploie le singulier pour parler de l’humanité comme créature issue de la terre. « L’être humain » garde le singulier concret et la portée universelle, tout en laissant subsister l’éventuel écho adamique.
- issue: Agent du retour à la terre
  choice: Conserver la causalité divine par « il l’a fait retourner ».
  alternative: « il est retourné à la terre » ou « il l’a rendu à la terre »
  rationale: Le sujet de ἀπέστρεψεν reste le Seigneur et l’être humain en est l’objet; la traduction ne transforme donc pas l’énoncé en simple constat de mortalité autonome.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « la terre » clarifie le référent et souligne le mouvement circulaire du verset. Le marqueur [a] figure dans le texte principal.
