  text: And he said to them[a], “Watch yourselves against every injustice,” and he commanded each of them concerning his neighbor.
translation:
  language: fr
  text: 'Et il leur dit : « Gardez-vous de toute injustice », et il donna à chacun des instructions concernant son prochain.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσέχετε
  choice: Gardez-vous
  rationale: Avec ἀπό et un objet négatif, l’impératif exprime une mise en garde. « Gardez-vous de » est naturel en français et conserve la force réflexive et préventive de la formule grecque.
- source_word: ἀπὸ παντὸς ἀδίκου
  choice: de toute injustice
  rationale: La tournure grecque condensée peut désigner tout ce qui est injuste ou mauvais. « Toute injustice » rend clairement sa portée éthique sans lui donner un sens doctrinal technique.
- source_word: ἐνετείλατο
  choice: il donna des commandements
  rationale: Le verbe indique qu’une autorité prescrit ou ordonne quelque chose. Cette formulation conserve cette force tout en permettant de rendre naturellement le complément introduit par περί.
- source_word: ἑκάστῳ
  choice: à chacun
  rationale: 'Le datif singulier a une valeur distributive explicite : le commandement concerne chaque personne individuellement.'
- source_word: περὶ τοῦ πλησίον
  choice: au sujet de son prochain
  rationale: πλησίον désigne ici le prochain, c’est-à-dire l’autre envers qui chacun a des devoirs. Le singulier distributif du grec est conservé.
theological_decisions:
- issue: Portée éthique du langage de ἀδίκου
  choice: « toute injustice »
  alternative: « tout mal » ou « toute chose injuste »
  rationale: Dans ce contexte sapientiel, le mot vise la conduite injuste, notamment envers autrui, plutôt qu’une catégorie doctrinale technique.
- issue: Singulier distributif de « prochain »
  choice: « à chacun… son prochain »
  alternative: « à chacun… les autres »
  rationale: Le grec emploie le singulier avec une valeur distributive. Le conserver maintient la structure et la responsabilité personnelle exprimées par le texte.
translation_notes:
  register: Français moderne, digne et accessible. La formulation « Gardez-vous de » conserve le ton d’avertissement du grec. Aucun marqueur de note n’est requis, puisqu’aucune note n’est proposée.
