review_pass:
  verdict: revise
  source_fidelity: 'La première proposition est fidèle : « Gardez-vous de toute injustice » rend naturellement Προσέχετε ἀπὸ παντὸς ἀδίκου, avec une mise en garde préventive. La seconde proposition affaiblit cependant le singulier de ἐνετείλατο (« il donna à chacun des commandements ») et introduit un pluriel absent du grec. Le grec dit qu’il donna un commandement/une instruction à chacun, concernant son prochain.'
  naturalness: « Gardez-vous de » est idiomatique, quoique d’un registre biblique soutenu approprié. « Il donna à chacun des commandements » est grammaticalement possible, mais lourd et moins naturel que « il donna à chacun des instructions » ou « il prescrivit à chacun… ».
  terminology: « Injustice » et « prochain » conviennent au contexte éthique sapientiel. « Instructions » rend ἐνετείλατο sans créer le pluriel non exprimé par le grec et permet une phrase française fluide. Aucun marqueur de note n’est requis.
