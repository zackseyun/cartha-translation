translation:
  language: fr
  text: Cependant, à ceux qui se repentent, il a accordé un retour[a], et il a encouragé ceux qui manquaient de persévérance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Un retour » peut aussi se comprendre comme « une voie de retour » ou « un rétablissement ». La validation de la source signale ici une divergence importante ; la formulation exacte doit donc être considérée avec prudence, même si le sens général est clair.
    reason: lexical_alternative; textual_variant
  - marker: b
    text: 'Le grec est condensé. Littéralement, il évoque « ceux qui manquaient de persévérance » ; on peut aussi le comprendre comme : « il a encouragé à persévérer ceux qui faiblissaient ».'
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: Cependant
  rationale: Marque naturellement en français la transition adversative avec le contexte précédent.
- source_word: μετανοοῦσιν
  choice: à ceux qui se repentent
  rationale: Le participe présent substantivé désigne les personnes qui se repentent tout en conservant la valeur verbale.
- source_word: ἔδωκεν
  choice: il a accordé
  rationale: Rend δίδωμι dans une tournure française naturelle avec le complément « un retour ».
- source_word: ἐπάνοδον
  choice: un retour
  rationale: Conserve l'ouverture du nom grec, qui peut évoquer le fait de revenir, une voie de retour ou un rétablissement sans préciser davantage.
- source_word: παρεκάλεσεν
  choice: il a encouragé
  rationale: Préserve la nuance de soutien et d'exhortation de παρακαλέω sans la réduire à la consolation ou au commandement.
- source_word: ἐκλείποντας
  choice: ceux qui faiblissaient
  rationale: Exprime de façon idiomatique l'idée de défaillir ou de perdre ses forces, sans préciser si la faiblesse est physique, morale ou spirituelle.
- source_word: ὑπομονήν
  choice: à persévérer
  rationale: Dans la construction grecque compacte, l'accusatif peut exprimer ce à quoi porte l'encouragement. Cette formulation est claire en français, tandis qu'une note conserve l'autre analyse possible.
theological_decisions:
- issue: Sens de ἐπάνοδον dans le contexte de la repentance
  choice: un retour
  alternative: une voie de retour ; un rétablissement
  rationale: Le texte évoque la réponse divine à la repentance sans définir explicitement la nature du retour. La traduction n'en fait donc pas un énoncé doctrinal plus précis.
- issue: Rapport syntaxique de ὑπομονήν avec παρεκάλεσεν et ἐκλείποντας
  choice: il a encouragé à persévérer ceux qui faiblissaient
  alternative: il a réconforté par la persévérance ceux qui faiblissaient
  rationale: Le grec est condensé et admet plusieurs constructions. Le texte principal privilégie une formulation française intelligible, et la note signale l'ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. « Cependant » maintient le contraste; « faiblissaient » reste volontairement large. Les notes conservent l'incertitude lexicale, syntaxique et textuelle sans alourdir le verset.
