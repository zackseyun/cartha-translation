  text: Who will sing praise to the Most High in Hades[b][a], instead of the living who give thanks?
translation:
  language: fr
  text: Qui louera le Très-Haut dans le séjour des morts[a], à la place des vivants qui lui rendent grâce ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « dans l’Hadès » ; on pourrait aussi traduire « dans le shéol » ou « dans le tombeau ». Il s’agit ici du domaine des morts.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑψίστῳ
  choice: le Très-Haut
  rationale: Le datif désigne celui à qui la louange est adressée. « Le Très-Haut » est le titre divin usuel en français.
- source_word: τίς αἰνέσει
  choice: Qui louera
  rationale: Le pronom interrogatif et le futur de αἰνέω forment une question rhétorique. « Louera » rend directement le verbe sans ajouter explicitement l’idée de chant.
- source_word: ἐν ᾅδου
  choice: dans le séjour des morts[a]
  rationale: ᾅδης désigne ici le domaine des morts. Cette formulation française actuelle restitue le sens sans suggérer nécessairement le lieu du châtiment final.
- source_word: ἀντὶ ζώντων
  choice: à la place des vivants
  rationale: 'ἀντί exprime ici le remplacement ou le contraste : les morts sont opposés aux vivants qui peuvent louer Dieu.'
- source_word: καὶ διδόντων ἀνθομολόγησιν
  choice: qui lui rendent grâce
  rationale: Dans ce contexte cultuel, ἀνθομολόγησις évoque une reconnaissance exprimée en action de grâce ou en louange. Le relatif français rattache naturellement le participe aux vivants, et « lui » explicite le destinataire déjà nommé.
theological_decisions:
- issue: Portée de ᾅδης dans ce texte sapientiel
  choice: Le séjour des morts
  alternative: L’Hadès ; le tombeau ; le shéol
  rationale: Le verset oppose les morts aux vivants quant à leur capacité de louer Dieu. Il ne décrit pas explicitement un châtiment final ; la traduction conserve donc la notion générale de domaine des morts.
- issue: Valeur de ἀνθομολόγησις
  choice: Action de grâce reconnaissante adressée à Dieu
  alternative: Confession ; reconnaissance ; hommage
  rationale: L’association avec la louange du Très-Haut favorise le sens cultuel de gratitude, sans exclure entièrement la nuance d’aveu ou de reconnaissance portée par le terme grec.
translation_notes:
  register: Français international moderne, clair et digne. La question rhétorique et le contraste marqué par ἀντί sont conservés. « Séjour des morts » évite que « enfer » importe une conception ultérieure absente du verset.
