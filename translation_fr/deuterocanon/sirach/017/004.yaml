  text: And he placed his fear upon all flesh[a], and to rule over beasts and birds.
translation:
  language: fr
  text: Il a inspiré à toute chair[a] la crainte de l’être humain et lui a donné de dominer les bêtes et les oiseaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à tous les êtres vivants ». Le grec dit littéralement « sur toute chair »; cette expression désigne ici collectivement les créatures vivantes.
    reason: Alternative lexicale et explication de l’idiome collectif grec.
lexical_decisions:
- source_word: ἔθηκεν
  choice: a répandu
  rationale: Dans la construction « mettre la crainte de quelqu’un sur », le grec exprime le fait d’inspirer cette crainte aux créatures. « Répandre » donne en français naturel la portée étendue de ἐπὶ πάσης σαρκός sans exagérer l’intensité.
- source_word: τὸν φόβον αὐτοῦ
  choice: la crainte de l’être humain
  rationale: αὐτοῦ renvoie au représentant singulier de l’humanité mentionné dans le contexte. Répéter « l’être humain » lève une ambiguïté pronominale que « sa crainte » créerait en français, tout en conservant le singulier représentatif.
- source_word: ἐπὶ πάσης σαρκός
  choice: sur toute chair
  rationale: La formulation conserve l’expression biblique collective du grec. Ici, « chair » désigne largement les êtres vivants, et non une disposition morale.
- source_word: κατακυριεύειν
  choice: lui a donné de dominer
  rationale: L’infinitif exprime la domination accordée à l’être humain dans la série contextuelle des dons divins. Cette formulation française rend le lien implicite sans transformer le verbe en simple coordination.
- source_word: θηρίων
  choice: les bêtes
  rationale: « Bêtes » conserve la portée de θηρία et le registre biblique, tout en restant courant et compréhensible.
- source_word: πετεινῶν
  choice: les oiseaux
  rationale: « Oiseaux » est l’équivalent français naturel et précis de πετεινά dans ce contexte.
theological_decisions:
- issue: Référent du singulier αὐτοῦ et sujet implicite de κατακυριεύειν
  choice: L’être humain au singulier représentatif
  alternative: 'Employer un pluriel collectif : « leur crainte » et « leur donner de dominer »'
  rationale: Le grec maintient un référent singulier dans le contexte de la création de l’être humain. La traduction conserve cette représentation sans la masculiniser davantage que le texte français ne l’exige.
- issue: Sens collectif de σάρξ
  choice: Conserver « toute chair » avec une note explicative
  alternative: Traduire directement « tous les êtres vivants » ou « toute créature vivante »
  rationale: « Toute chair » préserve l’image et la texture du grec, tandis que la note communique le sens collectif contextuel sans réduire l’expression à une seule paraphrase.
- issue: Rapport syntaxique de κατακυριεύειν avec ἔθηκεν
  choice: 'Rendre l’infinitif comme une capacité ou autorité accordée : « lui a donné de dominer »'
  alternative: 'Coordonner littéralement : « et de dominer »'
  rationale: La coordination littérale serait bancale en français et laisserait le lien syntaxique obscur. Le contexte autorise l’explicitation minimale d’un pouvoir conféré, sans ajouter une doctrine étrangère au passage.
translation_notes:
  register: Français international moderne, digne et accessible. « Toute chair » maintient la couleur biblique; la syntaxe environnante est rendue plus naturelle afin que le verset reste immédiatement intelligible.
