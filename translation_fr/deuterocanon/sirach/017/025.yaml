  text: How great is the mercy of the Lord[a], and his atonement for those who turn to him.
translation:
  language: fr
  text: Comme elle est grande, la miséricorde du Seigneur, et quelle expiation pour ceux qui reviennent à lui !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς μεγάλη
  choice: Comme elle est grande
  rationale: Rend naturellement en français la valeur exclamative de ὡς suivi de l’adjectif, tout en accordant l’expression avec « la miséricorde ».
- source_word: ἡ ἐλεημοσύνη
  choice: la miséricorde
  rationale: Avec « du Seigneur », le terme désigne ici la compassion ou l’action miséricordieuse divine, et non l’aumône.
- source_word: τοῦ κυρίου
  choice: du Seigneur
  rationale: Dans ce contexte sapientiel juif, κύριος est un titre révérenciel désignant Dieu.
- source_word: ἐξιλασμός
  choice: expiation
  rationale: Le mot désigne l’effacement de la faute ou l’acte qui restaure la relation avec Dieu. « Expiation » conserve sa portée théologique sans préciser un mécanisme doctrinal particulier.
- source_word: τοῖς ἐπιστρέφουσιν
  choice: pour ceux qui reviennent
  rationale: « Reviennent » préserve l’image concrète du retour vers Dieu, qui peut impliquer la repentance sans la réduire à un terme technique.
- source_word: ἐπ᾿ αὐτόν
  choice: à lui
  rationale: Avec ἐπιστρέφω, cette expression indique la personne vers laquelle on revient ; « à lui » est naturel en français.
theological_decisions:
- issue: Sens de ἐξιλασμός en rapport avec le pardon divin
  choice: expiation
  alternative: pardon ; moyen d’obtenir le pardon ; propitiation
  rationale: « Expiation » maintient la densité du terme grec et son lien avec l’effacement de la faute, sans imposer une théorie confessionnelle précise. L’ellipse grecque est également conservée plutôt que transformée en affirmation explicite de possession.
translation_notes:
  register: Français moderne, digne et accessible. La tournure exclamative reproduit l’élan du grec. L’absence de verbe et de possessif devant « expiation » respecte la formulation elliptique de la source, malgré son caractère légèrement marqué en français.
