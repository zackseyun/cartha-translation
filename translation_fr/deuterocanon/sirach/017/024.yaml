  text: From the dead, as from one who no longer exists, thanksgiving perishes; but one who is alive and well will praise the Lord.
translation:
  language: fr
  text: De la part d’un mort, comme de quelqu’un qui n’existe plus, l’action de grâce disparaît[a] ; celui qui est vivant et en bonne santé louera le Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’aveu » ou « la louange reconnaissante » ; le nom grec peut désigner un aveu, une reconnaissance ou une action de grâce adressée à Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ νεκροῦ
  choice: De la part d’un mort
  rationale: ἀπό avec le génitif indique ici la provenance. Cette formulation française exprime clairement que l’action de grâce ne vient plus du mort, tout en conservant le singulier grec.
- source_word: ὡς μηδὲ ὄντος
  choice: comme de quelqu’un qui n’existe plus
  rationale: La formule rend naturellement la comparaison intensifiée du grec sans transformer cette remarque rhétorique en définition métaphysique de l’état des morts.
- source_word: ἀπόλλυται
  choice: disparaît
  rationale: Le moyen-passif peut signifier « périr », « se perdre » ou « disparaître ». Avec « action de grâce » comme sujet, « disparaît » est idiomatique et garde la vigueur de l’énoncé.
- source_word: ἐξομολόγησις
  choice: l’action de grâce
  rationale: Dans la Septante, le nom désigne souvent la reconnaissance exprimée envers Dieu ou la louange reconnaissante. « Action de grâce » maintient une distinction lexicale avec αἰνέσει tout en respectant le parallélisme.
- source_word: ζῶν καὶ ὑγιὴς
  choice: celui qui est vivant et en bonne santé
  rationale: Les adjectifs employés substantivement décrivent une personne vivante et bien portante. La formulation est actuelle, claire et digne.
- source_word: αἰνέσει
  choice: louera
  rationale: Le futur de l’indicatif est conservé et exprime directement l’opposition avec la disparition de l’action de grâce chez le mort.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Dans ce contexte scripturaire juif, κύριος désigne Dieu et se rend conventionnellement par « le Seigneur ».
theological_decisions:
- issue: Portée de « comme de quelqu’un qui n’existe plus » à propos du mort
  choice: Conserver la comparaison rhétorique sans l’expliquer dans le texte principal.
  alternative: « comme de quelqu’un qui n’est pas »
  rationale: Le verset oppose le mort au vivant quant à la possibilité de rendre grâce et de louer dans la vie présente. Il ne faut ni effacer la formulation forte du grec ni en faire une négation doctrinale explicite de toute existence après la mort.
translation_notes:
  register: Français international moderne, sobre et sapientiel. Le point-virgule préserve le contraste des deux membres. « De la part d’un mort » est préféré au calque ambigu « d’un mort » ou à « depuis les morts », et « en bonne santé » rend ὑγιής sans archaïsme.
