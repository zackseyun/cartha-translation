  text: He filled them with the knowledge of understanding[a], and showed them good and evil.
translation:
  language: fr
  text: Il les remplit d’une connaissance empreinte de discernement et leur montra le bien et le mal[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les bonnes et les mauvaises choses ». Le grec peut désigner soit les catégories morales du bien et du mal, soit ce qui est bon ou mauvais, bénéfique ou nuisible ; le contexte favorise ici le discernement moral.'
    reason: alternative lexicale
lexical_decisions:
- source_word: ἐπιστήμην συνέσεως
  choice: une connaissance pleine d’intelligence
  rationale: Le génitif συνέσεως qualifie vraisemblablement ἐπιστήμην plutôt qu’il ne désigne un second don distinct. Cette formulation française conserve ce lien tout en restant naturelle et compréhensible.
- source_word: ἐνέπλησεν
  choice: remplit
  rationale: Le verbe exprime l’idée de remplir ou de combler. « Remplit » restitue directement l’image grecque.
- source_word: αὐτούς
  choice: les
  rationale: Le pronom renvoie aux êtres humains mentionnés dans le contexte.
- source_word: ὑπέδειξεν
  choice: montra
  rationale: Le verbe signifie montrer, indiquer ou faire connaître. « Montra » convient à la construction avec un destinataire.
- source_word: ἀγαθὰ καὶ κακὰ
  choice: le bien et le mal
  rationale: L’expression peut désigner les catégories morales du bien et du mal, sens bien adapté au contexte de la capacité humaine de comprendre et de discerner, sans exclure entièrement un sens plus concret.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le datif désigne les bénéficiaires de ce qui est montré et se rend naturellement par « leur » en français.
theological_decisions:
- issue: Valeur morale ou concrète de ἀγαθὰ καὶ κακὰ
  choice: le bien et le mal
  alternative: les bonnes et les mauvaises choses
  rationale: Le contexte favorise le discernement moral, mais les adjectifs substantivés grecs peuvent aussi désigner ce qui est bon ou mauvais, bénéfique ou nuisible. La traduction principale retient la lecture morale et la note préserve l’autre possibilité.
translation_notes:
  register: Français moderne, digne et accessible. La tournure « une connaissance pleine d’intelligence » maintient la relation compacte entre ἐπιστήμη et σύνεσις sans les transformer en deux dons séparés.
