  yaml_path: translation/deuterocanon/sirach/017/002.yaml
  text: He gave them a fixed number of days and a set time[b][a], and he gave them authority over the things on it.
translation:
  language: fr
  text: Il leur a donné un nombre déterminé de jours et un temps fixé[a], et il leur a donné autorité sur ce qui se trouve sur elle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un temps assigné ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sur les choses qui sont sur elle ». Le pronom renvoie probablement à la terre mentionnée au verset précédent.
    reason: cross_reference
lexical_decisions:
- source_word: ἡμέρας ἀριθμοῦ
  choice: un nombre déterminé de jours
  rationale: Cette formulation française naturelle rend l’idée de jours comptés et limités, c’est-à-dire d’une durée de vie finie.
- source_word: καιρόν
  choice: un temps fixé
  rationale: Dans ce contexte, καιρός désigne un temps déterminé ou assigné plutôt que le temps au sens abstrait.
- source_word: ἐξουσίαν
  choice: autorité
  rationale: « Autorité » exprime un pouvoir ou un droit accordé, sans accentuer la force brute ni introduire l’idée plus interprétative de domination.
- source_word: τῶν ἐπ᾿ αὐτῆς
  choice: ce qui se trouve sur elle
  rationale: Cette expression conserve le renvoi elliptique du pronom féminin grec, qui reprend très probablement la terre mentionnée au verset précédent, sans la répéter dans le corps du texte.
theological_decisions:
- issue: Portée de l’autorité humaine dans ἐξουσίαν τῶν ἐπ᾿ αὐτῆς
  choice: Les humains reçoivent autorité sur ce qui se trouve sur la terre.
  alternative: Les humains reçoivent autorité sur la terre elle-même, ou un pouvoir général sur la vie terrestre.
  rationale: Le génitif porte naturellement sur les êtres ou les choses qui sont sur elle. Le texte conserve toutefois le pronom elliptique afin de ne pas préciser davantage que le grec la nature et l’étendue de cette autorité.
translation_notes:
  register: Français international moderne, clair et digne. « Un nombre déterminé de jours » rend l’idiome grec sans lourdeur; « ce qui se trouve sur elle » préserve l’ellipse et l’ambiguïté référentielle du texte source.
