  text: How great is the mercy of the Lord[a], and his atonement for those who turn to him.
translation:
  language: fr
  text: Qu’elle est grande, la miséricorde du Seigneur, et quelle expiation[a] pour ceux qui reviennent à lui !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « propitiation » ; le terme grec désigne l’expiation de la faute ou le moyen par lequel elle est ôtée.'
    reason: Alternative lexicale et précision du champ sémantique de ἐξιλασμός.
lexical_decisions:
- source_word: ὡς μεγάλη
  choice: Qu’elle est grande
  rationale: La tournure exclamative rend naturellement en français le ὡς accompagné de l’adjectif, sans en faire une comparaison.
- source_word: ἐλεημοσύνη
  choice: la miséricorde
  rationale: Avec « du Seigneur » et en parallèle avec ἐξιλασμός, le mot désigne ici la compassion miséricordieuse de Dieu, non l’aumône.
- source_word: τοῦ κυρίου
  choice: du Seigneur
  rationale: Rend κύριος comme titre divin selon l’usage français courant et conserve l’article grec de manière idiomatique.
- source_word: ἐξιλασμός
  choice: expiation
  rationale: « Expiation » conserve la portée du nom grec liée à l’effacement de la faute et au rétablissement de la relation, sans choisir exclusivement une théorie doctrinale particulière.
- source_word: τοῖς ἐπιστρέφουσιν
  choice: pour ceux qui reviennent
  rationale: Dans ce contexte religieux, ἐπιστρέφω évoque le retour vers Dieu et garde implicitement la dimension de repentance.
- source_word: ἐπʼ αὐτόν
  choice: à lui
  rationale: Avec le verbe de retour, cette préposition indique naturellement en français la personne vers laquelle on revient.
theological_decisions:
- issue: Sens de ἐξιλασμός
  choice: expiation
  alternative: propitiation ; moyen de pardon
  rationale: Le choix maintient la notion d’effacement de la faute et de réconciliation sans réduire le terme à la seule idée d’apaisement ni le remplacer par le simple « pardon ».
- issue: Portée de l’exclamation
  choice: Maintenir deux groupes nominaux coordonnés dans une même exclamation
  alternative: 'Reformuler avec un verbe explicite : « comme il accorde l’expiation »'
  rationale: Le grec ne précise pas explicitement l’action ni le possessif du second groupe. La formulation retenue préserve cette ellipse et évite d’ajouter une relation théologique non exprimée.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise disloquée « Qu’elle est grande, la miséricorde… » donne à l’exclamation un tour naturel, tandis que « quelle expiation » conserve l’ellipse expressive du grec.
