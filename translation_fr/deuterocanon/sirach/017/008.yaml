lexical_decisions:
- source_word: ὄνομα ἁγιασμοῦ
  choice: le saint nom
  rationale: Le génitif grec signifie littéralement « nom de sainteté ». En français courant, « le saint nom » en exprime naturellement le sens sans ajouter le possessif « son », absent du fragment grec fourni.
- source_word: αἰνέσουσιν
  choice: ils loueront
  rationale: Le futur actif est conservé directement.
theological_decisions:
- issue: Identification du possesseur du « saint nom »
  choice: Ne pas ajouter « son »
  alternative: « son saint nom »
  rationale: Le contexte peut désigner le nom de Dieu, mais le fragment grec ne comporte aucun possessif. La formulation retenue évite d'expliciter ce que cette unité textuelle laisse implicite.
translation_notes:
  register: Formulation brève, digne et naturelle. L'ordre « le saint nom » conserve la coloration biblique de l'expression grecque sans recourir au calque peu idiomatique « le nom de sainteté ».
