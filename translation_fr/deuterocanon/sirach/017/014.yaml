  text: Their ways are always before him[a]; they will not be hidden from his eyes.
translation:
  language: fr
  text: Leurs voies sont toujours devant lui[a] ; elles ne seront pas cachées à ses yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Leur conduite est toujours devant lui » ; ici, les « voies » peuvent désigner la manière de vivre, et non seulement des chemins au sens propre.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱ ὁδοὶ αὐτῶν
  choice: leurs voies
  rationale: « Voies » conserve la métaphore grecque tout en pouvant désigner, dans la littérature de sagesse, la conduite ou la manière de vivre.
- source_word: ἐναντίον αὐτοῦ
  choice: devant lui
  rationale: Cette tournure naturelle exprime la présence sous son regard et préserve l’image visuelle du grec.
- source_word: διὰ παντός
  choice: toujours
  rationale: L’expression idiomatique signifie continuellement ou en tout temps ; « toujours » est clair et concis.
- source_word: οὐ κρυβήσονται
  choice: elles ne seront pas cachées
  rationale: Le futur passif grec est rendu directement, sans le transformer en affirmation modale telle que « elles ne peuvent pas être cachées ».
- source_word: ἀπὸ τῶν ὀφθαλμῶν αὐτοῦ
  choice: à ses yeux
  rationale: L’expression française idiomatique conserve l’image anthropomorphique des yeux et le sens de ce qui n’échappe pas au regard divin.
theological_decisions:
- issue: Langage anthropomorphique concernant la connaissance divine
  choice: Conserver « devant lui » et « à ses yeux » comme images personnelles et visuelles.
  alternative: Paraphraser par « il connaît toujours leur conduite » ou « elles n’échapperont pas à son regard ».
  rationale: Le grec exprime la connaissance constante de Dieu au moyen d’une image concrète. La conserver respecte le ton sapientiel et évite de réduire cette formulation à une abstraction.
translation_notes:
  register: Français international moderne, clair et digne. « Voies » maintient la métaphore traditionnelle sans obscurcir le sens, explicité en note ; la seconde proposition conserve le parallélisme visuel du grec.
