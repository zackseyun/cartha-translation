base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/018.yaml
  text: You were called by the honored name, the one invoked over Israel; and you amassed gold like iron, and multiplied silver like lead.
translation:
  language: fr
  text: Tu as été appelé par le nom glorieux, celui qui est invoqué sur Israël[a] ; tu as amassé l’or comme du fer et multiplié l’argent comme du plomb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le nom appelé sur Israël ». Littéralement, « appelé sur Israël ». L’expression hébraïque peut évoquer un nom invoqué sur quelqu’un, porté par lui ou marquant son appartenance.
    reason: lexical_alternative
lexical_decisions:
- source_word: נקראת בשם הנכבד
  choice: Tu as été appelé par le nom glorieux
  rationale: Le passif hébreu נקראת est conservé. « Glorieux » rend la dignité et le poids exprimés par הנכבד dans un français naturel et solennel, sans préciser davantage l’identité ni la fonction du nom.
- source_word: הנקרא על ישראל
  choice: celui qui est invoqué sur Israël
  rationale: La formulation garde l’image biblique d’un nom appelé ou invoqué sur un peuple. « Sur Israël » préserve la construction hébraïque et son ambiguïté d’appartenance, de consécration ou de protection ; le parallèle grec appuie le sens d’« invoqué ».
- source_word: ותצבר
  choice: tu as amassé
  rationale: Le verbe exprime l’action d’accumuler et de mettre en réserve ; « amassé » convient au contexte des richesses royales.
- source_word: כברזל זהב
  choice: l’or comme du fer
  rationale: 'La comparaison concise est maintenue : l’abondance rend l’or aussi commun que le fer.'
- source_word: וכעפרת הרבית כסף
  choice: et multiplié l’argent comme du plomb
  rationale: עפרת désigne ici le plomb, comme le confirme le grec μόλιβος. « Multiplié » reproduit directement l’idée d’accroissement portée par הרבית tout en conservant le parallélisme poétique.
theological_decisions:
- issue: Référent et portée du « nom glorieux »
  choice: Conserver l’allusion à un nom divin associé à Israël, sans expliquer comment ce nom est porté ou invoqué.
  alternative: Préciser que Salomon porte directement le nom du Seigneur, ou interpréter la phrase uniquement comme une affirmation de l’identité d’alliance d’Israël.
  rationale: L’hébreu associe le nom glorieux à Israël, mais ne développe pas le rapport théologique exact entre ce nom, Salomon et le peuple. La traduction maintient cette tension.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le tutoiement maintient l’adresse directe à Salomon. Les comparaisons métalliques restent brèves afin de préserver le parallélisme poétique hébreu.
