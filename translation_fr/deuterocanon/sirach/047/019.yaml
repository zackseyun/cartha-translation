  text: You gave your strength to women[a], and let them rule over your body.
translation:
  language: fr
  text: Tu as livré ta vigueur aux femmes[a] et tu leur as donné pouvoir sur ton corps.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte un terme difficile, rendu ici par « vigueur » ; le grec dit « tes reins », ce qui explicite le sens sexuel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ותתן
  choice: tu as livré
  rationale: Le verbe נתן signifie fondamentalement « donner ». Dans ce reproche, « livrer » exprime naturellement en français l’idée d’une force remise au pouvoir d’autrui, sans modifier le sens de base.
- source_word: לנשים
  choice: aux femmes
  rationale: La préposition ל indique ici les destinataires de ce qui est donné ou livré.
- source_word: כסלך
  choice: ta vigueur
  rationale: Le terme hébreu est difficile. Le parallèle grec, « tes reins », confirme une référence à la puissance corporelle et sexuelle. « Vigueur » garde cette nuance sans rendre le texte excessivement anatomique ni trancher plus que ne le permet l’hébreu.
- source_word: ותמשילם
  choice: tu leur as donné pouvoir
  rationale: La forme causative de משל signifie faire régner ou donner autorité. Le suffixe masculin pluriel renvoie contextuellement aux femmes; le français emploie naturellement « leur ».
- source_word: בגויתך
  choice: sur ton corps
  rationale: גויה désigne le corps ou la personne physique. Avec l’idée de domination portée par משל, « sur ton corps » est idiomatique et rejoint le sens corporel attesté par le grec.
theological_decisions:
- issue: Interprétation de כסלך à partir du témoin hébreu et du parallèle grec
  choice: ta vigueur
  alternative: tes reins ; ta folie
  rationale: L’hébreu demeure le texte de base, mais כסלך est difficile. Le grec λαγόνας, « reins/flancs », ainsi que le contexte du reproche adressé à Salomon, favorisent le sens d’une vigueur corporelle et sexuelle plutôt que celui de « folie ». La note conserve la donnée plus anatomique du grec.
- issue: Nature du pouvoir exercé sur le corps
  choice: tu leur as donné pouvoir sur ton corps
  alternative: tu les as fait régner dans ton corps
  rationale: Cette formulation rend la construction causative et la domination impliquée, sans développer une interprétation doctrinale ou psychologique absente du verset.
translation_notes:
  register: Français international moderne, direct et digne. « Livré ta vigueur » conserve la force du reproche; « donné pouvoir sur ton corps » reste clair pour un large public tout en reflétant la structure et la tension du texte source.
