  text: And he gave a remnant to Jacob[a], and to the house of David a root from him. And Solomon lay down with his fathers[c][b], and left behind him one of his offspring.
translation:
  language: fr
  text: Il donna à Jacob un reste et, à la maison de David, une racine issue de lui.[a] Salomon se coucha avec ses pères,[b] et laissa après lui un descendant.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « une racine issue de lui », « lui » renvoyant à David. L’image évoque la continuité de la lignée davidique ; on pourrait aussi traduire « un descendant issu de lui ».
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu qui suit « Salomon se coucha » est incertain dans ce témoin. Le texte grec parallèle porte « avec ses pères », leçon suivie ici.
    reason: textual_variant
  - marker: c
    text: Ou « un héritier » ou « quelqu’un de sa descendance ». Le terme hébreu est rare ou incertain ; dans le contexte, il désigne un successeur appartenant à la lignée de Salomon.
    reason: alternative_reading
lexical_decisions:
- source_word: שארית / κατάλιμμα
  choice: un reste
  rationale: Le terme désigne ce qui subsiste ou est préservé. « Un reste » conserve la portée collective et dynastique du texte sans l’expliciter davantage.
- source_word: שרש / ῥίζαν
  choice: une racine
  rationale: L’hébreu et le grec emploient tous deux l’image concrète de la racine. La conserver maintient la métaphore de la continuité de la lignée davidique sans la réduire à une interprétation.
- source_word: וישכב ... / ἀνεπαύσατο
  choice: se coucha avec ses pères
  rationale: Dans ce contexte, le verbe hébreu appartient à une tournure traditionnelle évoquant la mort. Le complément attesté par le grec permet une formulation française intelligible qui garde la couleur de l’expression source.
- source_word: מיושש
  choice: avec ses pères
  rationale: La forme hébraïque transmise est difficile et pourrait, prise telle quelle, suggérer l’âge ou l’épuisement. Le parallèle grec lit clairement « avec ses pères » et témoigne vraisemblablement d’un texte hébreu différent; ce sens est donc retenu avec une note textuelle.
- source_word: מנון
  choice: un descendant
  rationale: Ce terme rare ou incertain désigne ici celui qui demeure après Salomon dans sa lignée. « Un descendant » exprime le sens dynastique sans préciser indûment « fils » ou « héritier ».
theological_decisions:
- issue: Portée de l’image « une racine issue de lui »
  choice: Conserver l’image d’une continuité de la maison de David sans formuler explicitement une interprétation messianique.
  alternative: Traduire directement par « un descendant issu de lui » ou préciser « une racine messianique ».
  rationale: Le verset affirme la préservation de la lignée davidique. L’image peut recevoir des résonances messianiques, mais le texte ne les explicite pas ici; la traduction laisse donc cette tension ouverte.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve les images bibliques de « reste », de « racine » et de celui qui « se couche avec ses pères », tout en signalant les principales incertitudes textuelles et lexicales.
