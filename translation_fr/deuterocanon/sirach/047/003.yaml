translation:
  language: fr
  text: Il jouait avec les jeunes lions comme avec un chevreau, et avec les ours comme avec les jeunes bêtes du Bashân.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « et avec les ours comme avec des agneaux de brebis », explicitant davantage la seconde comparaison que l’hébreu : « les petits du Bashân ».'
    reason: alternative_reading
  - marker: b
    text: Le Bashân était réputé pour ses troupeaux robustes et bien nourris; l’image évoque vraisemblablement de jeunes animaux domestiques.
    reason: cultural_note
lexical_decisions:
- source_word: לכפירים
  choice: avec les jeunes lions
  rationale: כפירים désigne de jeunes lions. La préposition ל est rendue ici par « avec », conformément au parallélisme et au grec ἐν λέουσιν.
- source_word: שחק
  choice: il jouait
  rationale: שחק exprime ici l’action de jouer; cette formulation simple conserve le contraste poétique entre les animaux dangereux et les jeunes animaux domestiques.
- source_word: כגדי
  choice: comme avec un chevreau
  rationale: גדי désigne le petit de la chèvre. L’ajout de « avec » explicite naturellement en français la comparaison elliptique de l’hébreu.
- source_word: ולדבים
  choice: et avec les ours
  rationale: La formulation prolonge le parallélisme du premier membre sans préciser indûment l’âge des ours, que l’hébreu ne spécifie pas.
- source_word: כבני בשן
  choice: comme avec les jeunes bêtes du Bashân
  rationale: Littéralement, l’expression signifie « comme [avec] les fils/petits du Bashân ». « Jeunes bêtes » conserve l’indétermination de l’espèce tout en rendant intelligible l’image pastorale; « du Bashân » maintient la référence géographique de l’hébreu.
theological_decisions:
- issue: Choix entre l’expression hébraïque « les petits du Bashân » et l’explicitation grecque « des agneaux de brebis »
  choice: Suivre l’hébreu dans le texte principal avec « les jeunes bêtes du Bashân »
  alternative: Adopter l’explicitation grecque « des agneaux »
  rationale: L’hébreu conservé est prioritaire et laisse l’espèce indéterminée. Le grec confirme l’image générale de jeunes animaux domestiques, mais l’explicite comme des agneaux; cette variante est donc signalée en note plutôt qu’intégrée au texte.
translation_notes:
  register: Français international moderne, sobre et poétique. « Jeunes lions » est plus transparent que « lionceaux » sans ajouter une nuance de très jeune âge. « Jeunes bêtes du Bashân » préserve l’ambiguïté lexicale de l’hébreu tout en restant compréhensible; l’accent circonflexe suit une graphie française traditionnelle du nom propre.
