base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/005.yaml
  text: For he called on God Most High[a], and he gave strength to his right hand[b], to drive back a man skilled in war and to raise up the horn of Israel.
translation:
  language: fr
  text: Car il invoqua le Dieu Très-Haut[a], qui donna de la force à sa main droite, pour repousser un homme expert au combat et relever la corne d’Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec parallèle porte : « le Seigneur, le Très-Haut ».'
    reason: alternative_reading
  - marker: b
    text: Dans la Bible, la « corne » est une image de la force, de la puissance ou de l’honneur.
    reason: lexical_alternative
lexical_decisions:
- source_word: קרא אל
  choice: invoqua
  rationale: Le verbe avec la préposition אל exprime ici l’appel adressé à Dieu pour obtenir son secours. « Invoqua » est naturel, précis et adapté au registre biblique.
- source_word: אל עליון
  choice: le Dieu Très-Haut
  rationale: Cette traduction suit directement l’hébreu, qui porte « Dieu Très-Haut ». Le grec parallèle lit « le Seigneur, le Très-Haut » ; cette variante est signalée en note sans remplacer le témoignage hébreu principal.
- source_word: ויתן בימינו עז
  choice: qui donna de la force à sa main droite
  rationale: La proposition relative rend explicite, sans lourdeur, que Dieu est le sujet du don et David le bénéficiaire. La main droite, image concrète de la capacité d’agir et de combattre, est conservée.
- source_word: להדוף
  choice: pour repousser
  rationale: Le verbe signifie pousser, refouler ou repousser. « Repousser » conserve sa valeur militaire sans préciser abusivement la manière dont l’adversaire est vaincu.
- source_word: איש יודע מלחמות
  choice: un homme expert au combat
  rationale: L’expression signifie littéralement un homme « connaissant les guerres ». « Expert au combat » restitue naturellement l’expérience et l’habileté militaires, avec une probable allusion à Goliath.
- source_word: ולהרים את קרן ישראל
  choice: et relever la corne d’Israël
  rationale: La corne est une image biblique de force, de puissance et d’honneur. La conserver maintient la poésie et les échos scripturaires ; une note en explique le sens.
theological_decisions:
- issue: Titre divin différent entre le texte hébreu et le parallèle grec
  choice: le Dieu Très-Haut
  alternative: le Seigneur, le Très-Haut
  rationale: L’hébreu, source principale et bien attestée ici, porte אל עליון, « Dieu Très-Haut ». Le grec témoigne d’une formulation légèrement différente, κύριον τὸν ὕψιστον, qui mérite d’être préservée en note plutôt que fusionnée silencieusement avec l’hébreu.
- issue: Référent du sujet de « donna »
  choice: Dieu donna de la force à la main droite de David
  alternative: David donna de la force à sa propre main droite
  rationale: Le contexte et le grec parallèle soutiennent nettement Dieu comme sujet et David comme bénéficiaire. La formulation française avec « qui » rend cette relation claire sans ajouter de contenu doctrinal.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste fluide tout en conservant les images concrètes de la « main droite » et de la « corne ». Les marqueurs [a] et [b] figurent tous deux dans le texte.
