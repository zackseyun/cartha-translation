translation:
  language: fr
  text: lui qui prépara une maison pour son nom[a] et établit le sanctuaire pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec fourni pour ce verset porte plutôt : « Comme tu es devenu sage dans ta jeunesse, et comme tu as été rempli d’intelligence comme un fleuve ! » Il reflète une autre ligne du contexte environnant. Le texte principal suit ici l’hébreu conservé.'
    reason: textual_variant
lexical_decisions:
- source_word: אשר
  choice: lui qui
  rationale: Introduit une proposition relative renvoyant à Salomon dans le contexte précédent; cette tournure reste naturelle même lorsque le verset est cité isolément.
- source_word: הכין
  choice: prépara
  rationale: Le verbe signifie préparer ou disposer. « Prépara » respecte cette formulation sans la réduire au seul acte de bâtir.
- source_word: בית
  choice: une maison
  rationale: Rend le sens littéral et conserve l’idiome biblique de la « maison » consacrée au nom de Dieu, tout en laissant le contexte identifier le Temple.
- source_word: לשמו
  choice: pour son nom
  rationale: Conserve l’expression hébraïque théologiquement significative sans lui substituer une explicitation telle que « pour le Seigneur ».
- source_word: ויצב
  choice: établit
  rationale: Exprime l’action de mettre fermement en place; le terme convient au sanctuaire et à la durée indiquée ensuite.
- source_word: לעד
  choice: pour toujours
  rationale: Rend directement l’idée de durée permanente sans résoudre la tension historique liée à la destruction ultérieure du Temple.
- source_word: מקדש
  choice: le sanctuaire
  rationale: Désigne le lieu sacré; l’article défini est naturel en français puisque le contexte vise le sanctuaire du Temple.
- source_word: ὡς ἐσοφίσθης ἐν νεότητί σου, καὶ ἐνεπλήσθης ὡς ποταμὸς συνέσεως
  choice: non retenu dans le texte principal
  rationale: Le parallèle grec fourni contient une autre ligne sur la sagesse de Salomon. Le texte principal suit ici le témoin hébreu, dont la leçon est donnée avec une confiance élevée, tandis que l’écart grec est signalé en note.
theological_decisions:
- issue: Langage du Temple et idiome du nom divin
  choice: Conserver « une maison pour son nom »
  alternative: « un temple pour le Seigneur » ou « une maison en l’honneur du Seigneur »
  rationale: L’hébreu associe le sanctuaire au nom de Dieu sans affirmer que Dieu y serait contenu. Garder l’idiome préserve cette nuance sans ajouter des mots absents du texte.
- issue: Portée de לעד
  choice: Traduire par « pour toujours »
  alternative: « à perpétuité » ou « pour tous les temps »
  rationale: La formulation conserve l’affirmation idéale de permanence et la tension avec l’histoire ultérieure, sans chercher à l’atténuer.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « lui qui » maintient le lien relatif avec le contexte précédent. L’expression biblique « une maison pour son nom » est volontairement conservée; la ponctuation reste sobre.
