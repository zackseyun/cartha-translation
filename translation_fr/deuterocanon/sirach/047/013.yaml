base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/013.yaml
  text: Solomon reigned in days of peace[a], and God gave him rest on every side, so that he might build a house for his name and prepare a sanctuary forever.
translation:
  language: fr
  text: Salomon régna aux jours de paix[a], et Dieu lui accorda le repos de tous côtés, afin qu’il bâtisse une maison pour son nom et prépare un sanctuaire pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La ligne hébraïque conservée est plus courte : « Salomon régna aux jours de paix, et Dieu lui accorda le repos de tous côtés. » Le texte grec ajoute la proposition indiquant le but : bâtir une maison pour le nom de Dieu et préparer un sanctuaire pour toujours.'
    reason: textual_variant
lexical_decisions:
- source_word: שְׁלֹמֹה
  choice: Salomon
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: מלך
  choice: régna
  rationale: Rend naturellement le verbe hébreu comme une action, plutôt que par « fut roi ».
- source_word: בימי שלוה
  choice: en des jours de paix
  rationale: Conserve l’image temporelle de l’hébreu et exprime une période caractérisée par la paix et la tranquillité.
- source_word: ואל הניח לו מסביב
  choice: et Dieu lui accorda le repos de tous côtés
  rationale: Le texte hébreu transmis est légèrement irrégulier, mais le grec parallèle confirme que Dieu est le sujet et exprime le repos accordé tout autour. « De tous côtés » rend מסביב de façon naturelle.
- source_word: ἵνα στήσῃ οἶκον ἐπʼ ὀνόματι αὐτοῦ
  choice: afin qu’il bâtisse une maison pour son nom
  rationale: La proposition finale, conservée dans le grec, reprend le langage de la construction du Temple tout en gardant littéralement « maison » et « pour son nom ».
- source_word: καὶ ἑτοιμάσῃ ἁγίασμα εἰς τὸν αἰῶνα
  choice: et prépare un sanctuaire pour toujours
  rationale: « Sanctuaire » convient au contexte cultuel, et « pour toujours » préserve la portée temporelle de εἰς τὸν αἰῶνα sans la préciser davantage.
theological_decisions:
- issue: Présence de la proposition relative à la construction du Temple dans le grec, mais non dans la ligne hébraïque conservée
  choice: Inclure la proposition grecque dans le texte principal et signaler la forme plus courte de l’hébreu en note
  alternative: 'Traduire seulement l’hébreu conservé : « Salomon régna en des jours de paix, et Dieu lui accorda le repos de tous côtés. »'
  rationale: L’hébreu est le témoin principal là où il subsiste, mais la ligne présente une légère difficulté textuelle et le parallèle grec direct conserve une continuation cohérente. La note maintient la transparence sans effacer la différence entre les témoins.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve les expressions bibliques « maison pour son nom » et « sanctuaire pour toujours », sans remplacer explicitement « maison » par « Temple ». Le marqueur [a] figure dans le texte principal.
