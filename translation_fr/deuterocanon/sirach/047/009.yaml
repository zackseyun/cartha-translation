  text: With songs in the gardens he made preparation before the altar[b][a], and he arranged the sound of psalm and harps.
translation:
  language: fr
  text: Avec des chants dans les jardins[a], il fit les préparatifs devant l’autel, et il régla le son des psaumes et des harpes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu « avec des chants dans les jardins » est incertain. Le texte grec porte : « Il plaça des chanteurs en face de l’autel, afin que leur son adoucisse les mélodies », ce qui peut refléter un texte hébreu différent ou une altération du texte transmis.'
    reason: textual_variant
  - marker: b
    text: Ou « lyres » ; le terme hébreu désigne un instrument à cordes.
    reason: lexical_alternative
lexical_decisions:
- source_word: בגינות שיר
  choice: Avec des chants dans les jardins
  rationale: Le texte hébreu transmis est difficile. בגינות signifie naturellement « dans les jardins », tandis que שיר désigne le chant. La traduction conserve ce sens possible sans introduire dans le texte principal les chanteurs attestés seulement par le grec; l’incertitude est signalée en note.
- source_word: הכין
  choice: il fit les préparatifs
  rationale: הכין peut signifier « préparer », « disposer » ou « établir ». Cette formulation préserve l’idée de préparation sans ajouter un complément d’objet absent de l’hébreu.
- source_word: לפני מזבח
  choice: devant l’autel
  rationale: Traduction directe de la locution prépositionnelle. Dans ce contexte cultuel, le français emploie naturellement l’article défini.
- source_word: וקול
  choice: et ... le son
  rationale: קול peut désigner la voix ou le son. La présence de termes musicaux favorise ici « le son ».
- source_word: מזמור
  choice: psaumes
  rationale: מזמור désigne un chant musical, souvent liturgique. « Psaumes » conserve cette nuance dans le contexte du culte au Temple.
- source_word: ונבלים
  choice: et des harpes
  rationale: נבלים désigne des instruments à cordes dont l’identification précise reste incertaine; « harpes » est une désignation française traditionnelle et intelligible, tandis que « lyres » demeure possible.
- source_word: תקן
  choice: il régla
  rationale: תקן exprime l’action de mettre en ordre ou d’organiser. « Régla » convient à l’organisation du son dans un cadre musical et cultuel.
theological_decisions:
- issue: Choix entre l’hébreu difficile et la formulation plus fluide du parallèle grec
  choice: Le texte principal suit l’hébreu conservé, avec une note exposant le témoignage grec.
  alternative: « Il plaça des chanteurs en face de l’autel, afin que leur voix rende les mélodies agréables. »
  rationale: L’hébreu est le témoin source fourni, mais sa première proposition est difficile et diverge fortement du grec. Suivre l’hébreu dans le texte tout en donnant le grec en note évite de résoudre silencieusement cette divergence textuelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe légèrement inhabituelle de la première proposition reflète la difficulté réelle de l’hébreu sans l’aplanir artificiellement.
