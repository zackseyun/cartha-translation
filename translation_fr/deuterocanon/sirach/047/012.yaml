revisions:
- from: À cause de lui se leva après lui un fils intelligent[a], qui vécut en sécurité.
  to: Grâce à lui, un fils intelligent lui succéda et vécut en sécurité[a].
  rationale: La révision améliore l’idiomaticité française et clarifie la succession sans dépasser le sens de l’hébreu. Elle préfère « grâce à lui » pour la causalité favorable et replace l’ancre de note afin qu’elle couvre l’ensemble de la variation entre l’hébreu et le grec. Aucune interprétation théologique ou dynastique supplémentaire n’est introduite.
