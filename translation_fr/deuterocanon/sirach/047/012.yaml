  text: Because of him there stood up after him an intelligent son[a], who lived in security.
translation:
  language: fr
  text: Grâce à lui, un fils intelligent lui succéda et vécut en sécurité[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Après lui se leva un fils intelligent et, grâce à lui, il s’établit dans l’aisance. » Le témoin hébreu porte : « et vécut en sécurité ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבַעֲבוּרוֹ
  choice: À cause de lui
  rationale: La préposition exprime ici la cause ou le bénéfice. Cette formulation conserve le lien explicite entre la situation favorable du fils et son prédécesseur, sans préciser davantage la nature de ce lien.
- source_word: עָמַד אַחֲרָיו
  choice: se leva après lui
  rationale: עָמַד signifie littéralement « se tenir debout » et peut, dans un contexte de succession, désigner celui qui se lève ou prend la place d’un autre. « Se leva après lui » garde l’image hébraïque tout en restant intelligible en français.
- source_word: בֵּן מַשְׂכִּיל
  choice: un fils intelligent
  rationale: מַשְׂכִּיל désigne une personne douée d’intelligence ou de discernement. « Intelligent » préserve cette nuance cognitive sans assimiler automatiquement le terme à la sagesse morale.
- source_word: שׁוֹכֵן לָבֶטַח
  choice: qui vécut en sécurité
  rationale: שׁוֹכֵן évoque le fait d’habiter ou de demeurer, et לָבֶטַח la sécurité. « Vécut en sécurité » est naturel en français moderne et rend le sens central de l’hébreu.
theological_decisions:
- issue: Lien entre la sécurité du fils et son prédécesseur
  choice: Le fils se lève après son prédécesseur et vit en sécurité à cause de lui.
  alternative: Selon le grec, le fils pourrait être décrit comme s’établissant au large ou dans l’aisance grâce à son prédécesseur.
  rationale: L’hébreu et le grec relient tous deux la condition favorable du fils à son prédécesseur. La traduction maintient ce lien sans lui ajouter une explication dynastique ou théologique absente du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « se leva après lui » conserve volontairement l’image de l’hébreu dans ce contexte de succession; la note signale l’écart réel du parallèle grec.
