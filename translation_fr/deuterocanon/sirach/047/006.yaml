base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/006.yaml
  text: Therefore the daughters answered him[a], and acclaimed him among the myriads. When he put on the turban, he fought[b], and all around he subdued the foe.
translation:
  language: fr
  text: C’est pourquoi les femmes lui répondirent[a] et l’acclamèrent parmi les myriades. Quand il se coiffa d’un turban, il combattit et, de tous côtés, soumit l’ennemi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Il s’agit probablement de femmes qui lui répondaient par des chants ou des acclamations après la victoire. Le grec présente une autre formulation : « Ainsi, il le glorifia parmi les myriades et le loua par les bénédictions du Seigneur, quand un diadème de gloire lui fut apporté. » Cette version souligne plus explicitement la royauté que l’hébreu, qui parle d’un « turban ».'
    reason: alternative_reading_and_cultural_note
lexical_decisions:
- source_word: על כן
  choice: C’est pourquoi
  rationale: Exprime le lien de conséquence avec les victoires et les louanges évoquées auparavant.
- source_word: ענו לו
  choice: lui répondirent
  rationale: Conserve le sens premier de ענה, « répondre », sans exclure une réponse chantée dans le contexte d’une célébration.
- source_word: בנות
  choice: les filles
  rationale: Rendu formellement proche de l’hébreu; le contexte suggère des femmes célébrant une victoire, précision donnée en note.
- source_word: ויכנוהו
  choice: l’acclamèrent
  rationale: La forme hébraïque est difficile; « acclamer » convient à l’hommage public du contexte et rejoint le témoignage grec sans lui imposer exactement son vocabulaire.
- source_word: ברבבה
  choice: parmi les myriades
  rationale: Préserve l’expression numérique hébraïque et son ampleur poétique; le grec présente également « en myriades ».
- source_word: בעטותו
  choice: Quand il se coiffa
  rationale: Rend naturellement en français l’action de mettre ou d’enrouler sur soi une coiffure, avec une valeur temporelle.
- source_word: צניף
  choice: turban
  rationale: Désigne normalement une coiffure de tissu enroulé. Le grec porte une image royale différente, conservée en note.
- source_word: נלחם
  choice: il combattit
  rationale: Rendu direct et digne du verbe martial hébreu.
- source_word: ומסביב
  choice: de tous côtés
  rationale: Exprime clairement l’étendue environnante de la victoire.
- source_word: הכניע
  choice: soumit
  rationale: Rend l’idée de contraindre l’adversaire à s’abaisser et de le réduire à la soumission.
- source_word: צר
  choice: l’ennemi
  rationale: Rend naturellement le singulier collectif désignant l’adversaire.
theological_decisions:
- issue: Rapport entre le צניף du texte hébreu et le « diadème de gloire » du parallèle grec
  choice: Le texte principal suit l’hébreu avec « turban ».
  alternative: « diadème » ou « diadème de gloire »
  rationale: Puisque l’hébreu de ce passage est conservé, il reste prioritaire. Le grec peut refléter une variante ou une interprétation accentuant la royauté de David; cette lecture significative est donc signalée en note sans remplacer l’image hébraïque.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La syntaxe demeure proche du parallélisme hébreu, tout en employant des formulations idiomatiques. « Myriades » conserve la couleur poétique et l’écho numérique du texte source.
