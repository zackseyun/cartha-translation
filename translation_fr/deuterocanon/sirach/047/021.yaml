  text: to divide the people into two tribes[b][a], and from Ephraim a lawless kingdom.
translation:
  language: fr
  text: pour diviser le peuple en deux tribus[a], et, d’Éphraïm, un royaume de violence[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit plutôt : « pour que la domination soit divisée, et que commence, à partir d’Éphraïm, un royaume désobéissant ». L’hébreu précise : « diviser le peuple en deux tribus ».'
    reason: alternative_reading
  - marker: b
    text: L’hébreu peut aussi évoquer un royaume « injuste » ou « oppressif »; le grec porte la nuance de « rebelle » ou « désobéissant ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לחלק
  choice: pour diviser
  rationale: L’infinitif exprime ici l’action de provoquer une division. « Diviser » rend directement la rupture politique; « pour » permet de conserver le caractère syntaxiquement dépendant du verset.
- source_word: העם
  choice: le peuple
  rationale: עם désigne ici le peuple considéré comme un tout avant la scission. « Le peuple » est direct et naturel.
- source_word: לשני שבטים
  choice: en deux tribus
  rationale: שבטים signifie littéralement « tribus ». La formulation hébraïque est conservée, même si elle résume de manière inhabituelle la division historique.
- source_word: ומאפרים
  choice: et, d’Éphraïm
  rationale: La préposition מן indique la provenance. La ponctuation française fait ressortir la proposition nominale elliptique de l’hébreu sans y ajouter un verbe absent du texte.
- source_word: ממלכת
  choice: un royaume
  rationale: ממלכה désigne ici un royaume ou une domination politique; « royaume » convient au contexte et correspond au parallèle grec βασιλεία.
- source_word: חמס
  choice: de violence
  rationale: Le sens premier de חמס comprend la violence et le tort commis. « Royaume de violence » conserve la force et l’étendue morale du terme hébreu sans suivre exclusivement la nuance de rébellion donnée par le grec.
theological_decisions:
- issue: Caractérisation du royaume issu d’Éphraïm
  choice: un royaume de violence
  alternative: un royaume injuste; un royaume rebelle; un royaume désobéissant
  rationale: L’hébreu חמס met au premier plan la violence ou l’injustice, tandis que le grec ἀπειθῆ souligne la désobéissance ou la rébellion. Le texte principal suit le témoin hébreu, et la note préserve l’autre nuance sans réduire la condamnation à une seule catégorie.
- issue: Ellipse verbale dans la seconde proposition
  choice: et, d’Éphraïm, un royaume de violence
  alternative: et faire surgir d’Éphraïm un royaume de violence
  rationale: L’hébreu ne contient pas de verbe explicite dans cette proposition. La traduction conserve cette ellipse plutôt que d’imposer une relation causative ou un verbe d’apparition.
translation_notes:
  register: Français international moderne, sobre et digne. Le verset demeure une proposition dépendante, conformément à l’infinitif initial, et la seconde proposition conserve l’ellipse abrupte de l’hébreu. Les virgules autour de « d’Éphraïm » facilitent la lecture sans ajouter de contenu verbal.
