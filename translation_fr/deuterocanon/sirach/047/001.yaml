  text: And after him Nathan arose[a], to stand before David.
translation:
  language: fr
  text: Après lui, Nathan se leva[a] pour se présenter devant David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle dit : « Nathan se leva pour prophétiser aux jours de David. » L’hébreu dit : « pour se présenter devant David ».'
    reason: Lecture parallèle différente du grec, signalée afin de préserver la divergence entre les témoins.
lexical_decisions:
- source_word: וגם אחריו
  choice: Après lui
  rationale: Exprime naturellement en français la succession avec la personne mentionnée auparavant. La valeur additive de וגם est portée par l’enchaînement du récit sans qu’un « aussi » peu naturel soit nécessaire.
- source_word: עמד
  choice: se leva
  rationale: Le verbe peut signifier « se tenir debout » ou « se lever ». Ici, « se leva » évoque l’entrée en scène de Nathan et concorde avec le grec ἀνέστη, tout en restant proche de l’hébreu.
- source_word: נתן
  choice: Nathan
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: להתיצב
  choice: pour se tenir
  rationale: L’infinitif hitpael exprime le fait de se placer ou de se présenter dans une position déterminée. « Se tenir » conserve sobrement cette image.
- source_word: לפני דוד
  choice: devant David
  rationale: Suit directement l’hébreu, qui décrit Nathan se tenant devant David, plutôt que la formulation temporelle du parallèle grec.
theological_decisions:
- issue: Rapport de Nathan à David dans la proposition finale
  choice: devant David
  alternative: aux jours de David
  rationale: L’hébreu conservé porte « devant David », tandis que le grec présente Nathan comme prophétisant « aux jours de David ». Le texte principal suit le témoin hébreu; la note conserve la variante grecque sans harmonisation.
translation_notes:
  register: Français international moderne, simple et digne. La répétition « se leva… se tenir » reflète les deux verbes hébreux distincts sans alourdir excessivement la phrase.
