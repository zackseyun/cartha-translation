  text: As the fat is set apart from the sacred offering[b][a], so was David from Israel.
translation:
  language: fr
  text: Comme la graisse est mise à part de l’offrande consacrée[a], ainsi David fut mis à part d’entre les fils d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est condensé : littéralement, « de ce qui est consacré ». Le grec précise « de l’offrande de paix » et rend explicite le sens séparatif : David est distingué d’entre les fils d’Israël.'
    reason: textual_variant
lexical_decisions:
- source_word: כחלב
  choice: Comme la graisse
  rationale: חֵלֶב désigne concrètement la graisse, notamment la part sacrificielle réservée. La traduction conserve l’image cultuelle plutôt que de l’abstraire en « meilleure part ».
- source_word: מורם
  choice: est mise à part
  rationale: Le participe passif de רום évoque ici une portion prélevée et réservée dans un cadre sacrificiel. « Mise à part » exprime naturellement cette séparation consacrée; le grec ἀφωρισμένον confirme ce sens.
- source_word: מקדש
  choice: de l’offrande consacrée
  rationale: L’hébreu est très condensé et peut littéralement évoquer « ce qui est saint/consacré ». Le contexte sacrificiel, confirmé par le parallèle grec, justifie « offrande consacrée » sans identifier trop précisément le type de sacrifice dans le corps du texte.
- source_word: כן דוד מישראל
  choice: ainsi David le fut du milieu d’Israël
  rationale: La reprise « le fut » restitue elliptiquement l’idée d’être mis à part. « Du milieu d’Israël » rend le sens séparatif de מישראל, explicité par le grec ἀπὸ τῶν υἱῶν Ἰσραήλ, tout en restant naturel en français.
theological_decisions:
- issue: Degré d’explicitation de la distinction ou de l’élection de David
  choice: Dire que David fut mis à part du milieu d’Israël par la reprise elliptique « le fut »
  alternative: « Ainsi David fut choisi par Dieu parmi les Israélites »
  rationale: L’image implique la distinction et la consécration de David, mais le verset ne nomme ni l’acte de choisir ni Dieu comme agent. La formulation retenue préserve cette portée sans ajouter une affirmation doctrinale absente du texte.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe parallèle conserve la brièveté proverbiale du verset; « graisse » maintient son image sacrificielle concrète, et « du milieu d’Israël » clarifie sans surinterpréter le sens séparatif.
