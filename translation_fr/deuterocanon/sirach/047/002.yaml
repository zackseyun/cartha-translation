    issue: Reprise elliptique « ainsi David le fut du milieu d’Israël »
    rationale: La construction est compréhensible, mais elle est moins fluide en français moderne et « du milieu d’Israël » est ambigu. « Fut mis à part d’entre les fils d’Israël » rend explicitement, sans surinterprétation, la séparation suggérée par l’hébreu et exprimée dans le grec parallèle.
  - severity: low
    issue: Formulation de la note sur le grec
    rationale: La note actuelle présente la formulation grecque comme une citation comparative complète. Il est préférable de signaler précisément que le grec mentionne « l’offrande de paix » et explicite « d’entre les fils d’Israël », sans lui attribuer plus que ce qu’il dit.
  revised_text: Comme la graisse est mise à part de l’offrande consacrée[a], ainsi David fut mis à part d’entre les fils d’Israël.
