review_pass:
  verdict: revise
  source_fidelity: Le sens sacrificiel concret de חֵלֶב (« graisse ») et l’idée de distinction exprimée par מורם sont bien rendus. Toutefois, « David le fut du milieu d’Israël » est une reprise elliptique un peu forcée en français et rend moins nettement la relation séparative que le grec explicite (« d’entre les fils d’Israël »).
  naturalness: « Comme la graisse est mise à part… » est naturel et convient au registre. Une formulation explicite au second membre, avec « d’entre les fils d’Israël », est plus idiomatique, plus claire et conserve le parallélisme sans ajouter d’agent divin.
  terminology: « Graisse » et « offrande consacrée » préservent utilement l’image cultuelle sans réduire indûment le terme hébreu condensé à une catégorie sacrificielle unique. La note doit éviter de donner l’impression que le grec formule une citation complète là où il rend surtout explicite le caractère séparatif.
  issues:
