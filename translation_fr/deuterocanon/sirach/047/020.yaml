base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/020.yaml
  text: You put a blemish on your honor[a], and profaned your bed[b], bringing wrath on your offspring and groaning on your couch.
translation:
  language: fr
  text: Tu as entaché ton honneur et profané ton lit[a], attirant la colère sur tes descendants et les gémissements sur ta couche[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « et profané ta descendance », au lieu de « et profané ton lit ».'
    reason: textual_variant
  - marker: b
    text: 'Le grec termine par : « et la détresse à cause de ta folie », au lieu de « et les gémissements sur ta couche ».'
    reason: textual_variant
lexical_decisions:
- source_word: ותתן מום בכבודך
  choice: Tu as entaché ton honneur
  rationale: L’expression hébraïque signifie littéralement « mettre un défaut dans/sur ton honneur ». « Entacher ton honneur » conserve l’image d’une marque déshonorante tout en étant naturel en français.
- source_word: ותחלל
  choice: et profané
  rationale: Le piel de חלל exprime la profanation ou la souillure de ce qui devait demeurer saint. « Profané » maintient ici la forte portée morale et religieuse.
- source_word: את יצועיך
  choice: ton lit
  rationale: יצוע désigne un lit ou une couche, avec ici une nette connotation sexuelle. « Ton lit » est direct et idiomatique; le grec présente à cet endroit une leçon différente, signalée en note.
- source_word: להביא אף
  choice: attirant la colère
  rationale: L’infinitif indique la conséquence de la conduite reprochée. « Attirant » rend naturellement ce rapport causal, tandis que « la colère » restitue la force de אף.
- source_word: על צאצאיך
  choice: sur tes descendants
  rationale: צאצאים désigne la descendance. « Descendants » convient au contexte dynastique et reste plus précis que le grec « enfants ».
- source_word: ואנחה על משכבך
  choice: et les gémissements sur ta couche
  rationale: אנחה évoque le soupir, la plainte ou le gémissement, et משכב le lieu où l’on se couche. Cette formulation préserve le parallélisme concret du texte hébreu et évite de répéter « lit ».
theological_decisions:
- issue: Rapport entre la faute de Salomon et les conséquences finales
  choice: Le texte relie la profanation du lit à la colère frappant les descendants et aux gémissements sur la couche de Salomon.
  alternative: La forme grecque conclut par une douleur ou une détresse causée par sa folie, sans mentionner sa couche.
  rationale: L’hébreu répète l’image du lit ou de la couche et établit ainsi un lien littéraire entre la faute sexuelle ou conjugale et ses conséquences. Cette lecture est retenue sans effacer la variante grecque, donnée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe à Salomon. Les images concrètes de l’honneur entaché, du lit profané et de la couche sont conservées; les variantes grecques sont signalées sans remplacer le texte hébreu principal.
