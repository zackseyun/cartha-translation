base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/024.yaml
  text: A broad folly and lacking understanding was Rehoboam[a], who caused the people to revolt by his counsel, until one arose—may there be no remembrance of him—Jeroboam son of Nebat[b], who sinned and caused Israel to sin.
translation:
  language: fr
  text: 'D’une grande folie et dépourvu de discernement, Roboam[a] poussa le peuple à la révolte par sa politique[b], jusqu’à ce que se lève — que nul ne garde son souvenir ! — Jéroboam, fils de Nebath, qui pécha et fit pécher Israël.


    [a] Le texte hébreu est ici très condensé, et la délimitation du verset paraît incertaine. Le texte grec parallèle présente une formulation plus développée et ajoute qu’il donna à Éphraïm une voie de péché. Cette proposition n’est pas intégrée au texte principal, car elle n’apparaît pas explicitement dans la ligne hébraïque conservée.


    [b] Autre traduction possible : « divisa le peuple par son conseil ». L’hébreu sous-jacent est difficile ; le texte grec parallèle appuie l’idée que la politique de Roboam provoqua la défection du peuple.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu est ici très condensé, et la délimitation du verset paraît incertaine. Le texte grec parallèle présente une formulation plus développée et ajoute qu’il donna à Éphraïm une voie de péché. Cette proposition n’est pas intégrée au texte principal, car elle n’apparaît pas explicitement dans la ligne hébraïque conservée.
