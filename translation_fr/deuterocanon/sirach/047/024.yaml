lexical_decisions:
- source_word: רחב אולת
  choice: plein d’une immense folie
  rationale: La formulation hébraïque transmise est condensée et difficile. Cette traduction comprend l’expression comme une caractérisation directe de Roboam, conserve l’idée d’une folie démesurée et produit un français naturel sans imposer la reconstruction grecque « folie du peuple ».
- source_word: חסר בינה
  choice: dépourvu d’intelligence
  rationale: Rend directement le manque de discernement exprimé en hébreu et concorde avec le grec ἐλαττούμενον συνέσει.
- source_word: רחבעם
  choice: Roboam
  rationale: Forme française biblique usuelle du nom propre.
- source_word: הפריע בעצתו עם
  choice: poussa le peuple à la révolte par sa politique
  rationale: Le verbe est difficile dans ce témoin. Le grec ἀπεστέτησεν λαὸν ἐκ βουλῆς αὐτοῦ confirme l’idée que la décision ou la ligne de conduite de Roboam provoqua la défection du peuple. « Politique » convient ici mieux que le littéral « conseil » pour une décision royale.
- source_word: עד אשר קם, אל יהי לו זכר
  choice: jusqu’à ce que se lève — que son souvenir disparaisse ! —
  rationale: Conserve la transition énigmatique et l’imprécation du texte hébreu, sans les lisser ni les omettre.
- source_word: ירבעם בן נבט
  choice: Jéroboam, fils de Nebath
  rationale: Formes françaises bibliques usuelles des noms propres.
- source_word: חטא והחטיא את ישראל
  choice: pécha et fit pécher Israël
  rationale: Préserve avec concision la distinction entre le verbe simple et sa forme causative.
theological_decisions:
- issue: Articulation des témoins hébreu et grec dans un passage hébreu condensé
  choice: Suivre le contenu explicite de l’hébreu, en employant le grec pour éclairer la révolte provoquée par Roboam, tout en conservant la transition vers Jéroboam et l’imprécation.
  alternative: Suivre intégralement le grec et ajouter que Jéroboam « donna à Éphraïm un chemin de péché ».
  rationale: L’hébreu demeure le témoin principal là où il est conservé. Le grec aide à comprendre une proposition difficile, mais son développement propre sur Éphraïm ne doit pas être introduit silencieusement dans le texte principal.
- issue: Identification de la personne visée par l’imprécation
  choice: Maintenir la construction hébraïque, où l’imprécation précède immédiatement le nom de Jéroboam.
  alternative: Reformuler explicitement « Jéroboam — que son souvenir disparaisse ! — » afin de lever toute ambiguïté.
  rationale: La formulation retenue respecte l’ordre du texte et sa tension syntaxique sans décider plus explicitement que la source de la portée exacte de l’incise.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase garde la vigueur du jugement sapientiel ainsi que l’incise imprécatoire, tout en évitant le calque peu naturel « une large folie ».
