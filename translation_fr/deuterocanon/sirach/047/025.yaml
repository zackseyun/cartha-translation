    rationale: 'Le grec ἀποστῆσαι αὐτοὺς ἀπὸ τῆς γῆς αὐτῶν est plus vigoureux : il s’agit de les écarter ou les chasser de leur terre. Il est préférable de conserver ce rapport avec l’expulsion du texte hébreu.'
