base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/025.yaml
  text: He gave Ephraim a stumbling block[a], to drive them from their land; and his sin grew very great, and he sold himself to every evil.
translation:
  language: fr
  text: Il donna à Éphraïm un obstacle, pour les chasser de leur terre. Son péché devint très grand, et il se vendit à tout mal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Leurs péchés se multiplièrent grandement, pour les chasser de leur terre ; ils recherchèrent toute méchanceté, jusqu’à ce que la vengeance vienne sur eux. » L’hébreu est ici au singulier et plus bref.'
    reason: alternative_reading
lexical_decisions:
- source_word: ויתן לאפרים מכשול
  choice: Il plaça devant Éphraïm un obstacle
  rationale: Cette formulation conserve l’idée concrète de מכשול, quelque chose qui provoque la chute, tout en rendant naturellement en français la construction hébraïque « donner à Éphraïm un obstacle ». « Pierre d’achoppement » ajouterait une pierre absente du texte.
- source_word: להדיחם מאדמתם
  choice: pour les chasser de leur terre
  rationale: Le verbe exprime une expulsion ou un éloignement causé. Le pluriel « les » respecte le suffixe hébreu, Éphraïm désignant ici collectivement le peuple ou le royaume.
- source_word: ותגדל חטאתו מאד
  choice: Son péché devint très grand
  rationale: Le texte hébreu conservé emploie le singulier et renvoie vraisemblablement au dirigeant mentionné dans le contexte. La variante grecque au pluriel est signalée en note.
- source_word: ולכל רעה התמכר
  choice: il se vendit à toute forme de mal
  rationale: Le verbe התמכר garde l’image forte d’une personne qui se vend elle-même. « Toute forme de mal » exprime naturellement la portée distributive de לכל רעה sans affaiblir cette métaphore.
theological_decisions:
- issue: Singulier de l’hébreu et pluriel du grec
  choice: 'Le texte principal suit l’hébreu : « Son péché devint très grand » et « il se vendit » (singulier).'
  alternative: 'Le grec lit : « Leurs péchés se multiplièrent grandement » et poursuit avec un sujet pluriel.'
  rationale: L’hébreu extant est prioritaire, mais l’écart substantiel du témoin grec doit rester visible plutôt que d’être harmonisé silencieusement.
- issue: Portée morale de התמכר
  choice: Conserver la métaphore « il se vendit à toute forme de mal ».
  alternative: « il se livra à toute forme de mal »
  rationale: La traduction retenue maintient l’image hébraïque de l’asservissement volontaire au mal sans lui imposer une formulation doctrinale ultérieure.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase reste accessible tout en conservant l’image concrète de l’obstacle et celle, plus forte, de la vente de soi au mal.
