  source_fidelity: 'La seconde moitié suit fidèlement l’hébreu conservé : singulier (« son péché », « il se vendit ») et image de la vente de soi au mal. En revanche, « Il plaça devant Éphraïm un obstacle » interprète ויתן (« il donna ») et ajoute « devant », qui ne figure pas dans le texte. « Il donna à Éphraïm un obstacle » est plus direct et conserve l’ambiguïté de la construction hébraïque.'
  naturalness: Le français est naturel et de registre approprié. « Toute forme de mal » est idiomatique, mais « tout mal » rend plus exactement לכל רעה sans difficulté. La note est claire, mais « les éloigner » affaiblit le grec ἀποστῆσαι, qui exprime l’éloignement/expulsion de leur terre.
  terminology: « Éphraïm », « obstacle », « péché » et « se vendit » conviennent. Le maintien d’« obstacle » préserve la métaphore de מכשול sans introduire l’image plus précise d’une « pierre d’achoppement ».
