base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/010.yaml
  text: He gave splendor[a], beauty, and glory to the festivals year after year; when they praised his holy name[b], before morning the court resounded.
translation:
  language: fr
  text: Il donna aux fêtes, année après année, majesté, beauté et honneur. Quand on louait son saint nom, dès le matin le sanctuaire retentissait.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La fin du verset est difficile dans l’hébreu conservé, qui pourrait se rendre littéralement : « avant le matin, le jugement retentissait ». Le grec porte plutôt : « dès le matin, le sanctuaire retentissait ».'
    reason: textual_variant
lexical_decisions:
- source_word: ויתן לחגים
  choice: Il donna aux fêtes
  rationale: נתן signifie normalement « donner » et la préposition ל marque ici ce qui reçoit cet éclat. Cette formulation directe reste naturelle en français.
- source_word: בכל שנה ושנה
  choice: année après année
  rationale: Le redoublement idiomatique exprime la répétition annuelle; « année après année » en conserve la force.
- source_word: הוד פאר וכבוד
  choice: majesté, beauté et honneur
  rationale: La traduction maintient les trois termes hébreux et leur accumulation solennelle, sans les réduire à deux quasi-synonymes.
- source_word: בהללו
  choice: Quand on louait
  rationale: La construction avec ב est comprise comme temporelle. Le sujet n’étant pas explicite dans la forme hébraïque transmise, le pronom indéfini « on » évite de le préciser artificiellement.
- source_word: את שם קדשו
  choice: son saint nom
  rationale: Expression française naturelle qui conserve l’idiome biblique et la valeur révérencielle de l’hébreu.
- source_word: לפני בקר ירן משפט
  choice: dès le matin le sanctuaire retentissait
  rationale: La fin hébraïque est difficile. Le grec parallèle, « dès le matin faire retentir le sanctuaire », fournit ici le sens contextuel le plus cohérent, lié à la louange cultuelle.
theological_decisions:
- issue: Interprétation de la proposition finale difficile dans le texte hébreu
  choice: 'Suivre le sens cultuel attesté par le grec : « dès le matin le sanctuaire retentissait »'
  alternative: Rendre littéralement l’hébreu transmis par une formule telle que « avant le matin, le jugement retentissait »
  rationale: Les mots hébreux transmis produisent une expression obscure dans ce contexte. Le parallèle grec conserve vraisemblablement le sens général de la louange matinale dans le sanctuaire, tout en justifiant une note qui signale l’incertitude textuelle.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme en deux phrases conserve la solennité de l’énumération hébraïque et rend clairement la scène de louange cultuelle.
