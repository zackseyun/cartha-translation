  text: With song[a], proverb, riddle, and saying[b], you astounded the peoples.
translation:
  language: fr
  text: Par le chant, le proverbe, l’énigme et la parole éloquente, tu as plongé les peuples dans l’étonnement.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est difficile. Littéralement, le verbe évoque le fait d’agiter ou de bouleverser. Le grec porte : « Par des chants, des proverbes, des paraboles et par l’interprétation, les contrées t’ont admiré. »'
    reason: textual_variant
lexical_decisions:
- source_word: בשיר
  choice: Par un chant
  rationale: La préposition ב peut exprimer le moyen ou le domaine. « Par un chant » rend naturellement ici la valeur instrumentale; le grec ἐν ᾠδαῖς confirme le lien avec le chant, tout en employant le pluriel.
- source_word: משל
  choice: un proverbe
  rationale: Dans un contexte sapiential, משל désigne couramment un proverbe ou une maxime. « Proverbe » est précis et accessible.
- source_word: חידה
  choice: une énigme
  rationale: חידה désigne une énigme ou une parole énigmatique. « Énigme » convient au registre littéraire et reste naturel en français moderne.
- source_word: ומליצה
  choice: et une formule éloquente
  rationale: מליצה peut désigner une expression travaillée ou éloquente, mais aussi une interprétation. « Formule éloquente » s’intègre à la liste de genres littéraires sans exclure la nuance rhétorique du terme.
- source_word: עמים
  choice: les peuples
  rationale: Le pluriel collectif עמים est rendu directement par « les peuples », sans le restreindre à des États ou nations au sens moderne.
- source_word: הסערתה
  choice: tu as plongé les peuples dans l’étonnement
  rationale: La forme hébraïque difficile évoque l’agitation ou le bouleversement causé. Cette traduction conserve l’intensité de l’image tout en tenant compte du grec, selon lequel les contrées ont été saisies d’admiration.
