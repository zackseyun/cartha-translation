translation_notes:
  register: Français international moderne, poétique mais intelligible. L’énumération conserve les quatre formes littéraires de l’hébreu. Le tour « plongé les peuples dans l’étonnement » maintient la force du verbe sans présenter comme certaine une nuance hostile que le parallèle grec ne soutient pas.
