  text: You covered the earth with your wisdom[a], and you filled the heights with song of praise.
translation:
  language: fr
  text: Tu as couvert la terre de ta sagesse[a], et tu as rempli les hauteurs d’un chant de louange.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec dit : « Ton nom est parvenu jusqu’aux îles lointaines, et tu as été aimé dans ta paix. » Le grec reflète une forme du texte sensiblement différente de l’hébreu conservé.'
    reason: alternative_reading
lexical_decisions:
- source_word: כסית
  choice: tu as couvert
  rationale: Le verbe כסה signifie couramment « couvrir ». Cette traduction conserve l’image concrète de la sagesse qui s’étend sur toute la terre.
- source_word: בחכמתך
  choice: de ta sagesse
  rationale: La préposition ב peut exprimer le moyen. En français, « couvrir de ta sagesse » est naturel et maintient cette valeur instrumentale.
- source_word: ותקלס
  choice: tu as rempli
  rationale: La forme hébraïque est difficile. Dans son association avec במרום שירה, « remplir » donne un sens cohérent à l’image, sans imposer le sens plus tardif de « louer » directement.
- source_word: במרום
  choice: les hauteurs
  rationale: מרום peut désigner un lieu élevé, les hauteurs ou le ciel. « Les hauteurs » préserve l’image poétique et l’ouverture du terme hébreu.
- source_word: שירה
  choice: un chant de louange
  rationale: שירה signifie « chant » ou « action de chanter ». « Un chant de louange » exprime naturellement en français la tonalité laudative vraisemblable dans ce contexte.
theological_decisions:
- issue: Choix entre le texte hébreu de la Gueniza du Caire et le parallèle grec divergent
  choice: Le texte principal suit le témoin hébreu conservé, tout en signalant le grec en note.
  alternative: « Ton nom est parvenu jusqu’aux îles lointaines, et tu as été aimé dans ta paix. »
  rationale: Puisque l’hébreu est conservé ici avec un degré élevé de confiance, il sert de texte principal. Le grec représente une forme textuelle sensiblement différente, peut-être issue d’un autre Vorlage ou d’un autre stade de transmission; la note maintient cette donnée visible sans confondre les deux lectures.
translation_notes:
  register: Français international moderne, poétique et digne. La structure parallèle du vers est conservée; « les hauteurs » maintient l’imagerie spatiale sans préciser qu’il s’agit nécessairement du ciel.
