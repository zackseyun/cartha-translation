base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/008.yaml
  text: In all his work he gave thanks to God Most High with words of glory[a]; with all his heart he loved his Maker[b], and every day he gave thanks to him with songs.
translation:
  language: fr
  text: Dans toutes ses œuvres, il rendit grâce à Dieu Très-Haut avec des paroles de gloire[a]. De tout son cœur, il aima celui qui l’avait fait[b], et chaque jour il lui rendit grâce par des chants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « avec des paroles de gloire » ; le grec porte de même : « avec une parole de gloire ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu poursuit : « et chaque jour il lui rendit grâce par des chants ». Le texte grec présente plutôt : « il chanta des louanges et aima celui qui l’avait fait », sans mention explicite de « chaque jour ».'
    reason: alternative_reading
lexical_decisions:
- source_word: בכל מעשהו
  choice: Dans tout ce qu’il faisait
  rationale: Cette formulation naturelle rend la portée globale du singulier collectif hébreu, qui embrasse l’ensemble de l’activité de David.
- source_word: נתן הודות
  choice: il rendait grâce
  rationale: L’expression idiomatique française communique fidèlement l’action de remercier ou d’exprimer sa reconnaissance, avec l’aspect habituel suggéré par le contexte.
- source_word: לאל עליון
  choice: au Dieu Très-Haut
  rationale: Cette expression conserve directement le titre divin עליון et demeure claire et consacrée en français moderne.
- source_word: באמרי כבוד
  choice: par des paroles de gloire
  rationale: Le choix reste proche du pluriel hébreu אמרי et du nom כבוד, sans réduire la formule à de simples « belles paroles »; le parallèle grec confirme cette construction.
- source_word: בכל לבו
  choice: De tout son cœur
  rationale: C’est l’équivalent idiomatique français de l’expression hébraïque indiquant un attachement entier.
- source_word: אוהב
  choice: il aimait
  rationale: Le participe hébreu fonctionne verbalement dans la séquence; l’imparfait français s’accorde au portrait d’une pratique durable.
- source_word: עשהו
  choice: celui qui l’avait fait
  rationale: Cette traduction personnelle et concrète reproduit plus directement « celui qui l’a fait » que le terme plus abstrait « Créateur ».
- source_word: וכבל יום
  choice: et chaque jour
  rationale: Malgré l’incertitude mineure de la forme transmise, le sens contextuel le plus probable est « chaque jour » ou « jour après jour ».
- source_word: הודה לו בזמירות
  choice: il lui rendait grâce par des chants
  rationale: « Rendait grâce » maintient le sens de הודה, tandis que « chants » rend זמירות sans imposer le terme plus précis « psaumes ».
theological_decisions:
- issue: Titre divin עליון
  choice: Dieu Très-Haut
  alternative: Dieu, le Très-Haut
  rationale: « Dieu Très-Haut » rend le titre hébreu de façon directe et traditionnelle, sans ajouter d’interprétation doctrinale.
- issue: Divergence entre le texte hébreu et le parallèle grec dans la seconde proposition
  choice: Suivre le texte hébreu en conservant l’amour du Créateur et l’action de grâce quotidienne par des chants
  alternative: 'Suivre le grec : « de tout son cœur, il chanta des louanges et aima celui qui l’avait fait »'
  rationale: Le témoin hébreu fourni est la source principale et sa lecture est intelligible; la divergence réelle du grec est signalée en note plutôt que résolue silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. L’imparfait présente les actes comme des habitudes caractéristiques de David. La tournure inhabituelle « paroles de gloire » est conservée pour refléter l’expression source, puis éclairée par une note.
