base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/022.yaml
  text: But God will not abandon mercy[a], nor let any of his words fall to the ground. He will not cut off offspring and posterity from his chosen one[b], and he will not destroy the seed of the one who loved him.
translation:
  language: fr
  text: Mais Dieu n’abandonnera pas sa miséricorde[a] et ne laissera aucune de ses paroles tomber à terre. Il ne retranchera ni descendance ni postérité à celui qu’il a choisi[b], et il ne détruira pas la lignée de celui qui l’a aimé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec parallèle dit : « Mais le Seigneur n’abandonnera certainement pas sa miséricorde et ne détruira certainement aucune de ses œuvres. » L’hébreu porte plutôt : « et ne laissera aucune de ses paroles tomber à terre ».'
    reason: textual_variant
  - marker: b
    text: 'La forme hébraïque traduite par « celui qu’il a choisi » peut aussi être comprise au pluriel : « ceux qu’il a choisis »; le grec parallèle appuie le singulier.'
    reason: alternative_reading
lexical_decisions:
- source_word: אל
  choice: Dieu
  rationale: Le témoin hébreu principal porte אל, titre divin rendu directement par « Dieu »; le grec parallèle a « le Seigneur ».
- source_word: יטוש
  choice: n’abandonnera pas
  rationale: Rend clairement l’idée de ne pas délaisser ou rejeter, dans un français moderne et digne.
- source_word: חסד
  choice: sa miséricorde
  rationale: Dans ce contexte de préservation divine, « miséricorde » convient au sens immédiat et correspond au grec ἔλεος, tout en gardant la portée relationnelle du terme.
- source_word: ולא יפיל מדבריו ארצה
  choice: et ne laissera aucune de ses paroles tomber à terre
  rationale: Conserve l’image idiomatique hébraïque selon laquelle aucune parole divine ne demeure sans effet; la divergence du grec est signalée en note.
- source_word: לא יכרית
  choice: Il ne retranchera
  rationale: « Retrancher » préserve la force d’élimination ainsi que la nuance dynastique et biblique du verbe.
- source_word: לבחיריו
  choice: à celui qu’il a choisi
  rationale: La graphie hébraïque permet éventuellement un pluriel, mais le contexte davidique et le singulier du grec soutiennent cette lecture.
- source_word: נין ונכד
  choice: ni descendance ni postérité
  rationale: Cette paire exprime la continuité de la lignée sur plusieurs générations; le doublet français en conserve l’ampleur sans imposer « fils et petit-fils ».
- source_word: זרע
  choice: la lignée
  rationale: « Lignée » rend naturellement en français moderne la postérité dynastique exprimée ici par « semence ».
- source_word: אובהו
  choice: celui qui l’a aimé
  rationale: Le participe désigne celui qui a aimé Dieu, probablement David dans le contexte; le grec confirme le passé.
- source_word: ישמיד
  choice: détruira
  rationale: Rend directement la force du verbe sans l’exagérer.
theological_decisions:
- issue: Titre divin dans la proposition initiale
  choice: Dieu
  alternative: le Seigneur
  rationale: Le texte hébreu, témoin principal, lit אל (« Dieu »), tandis que le parallèle grec lit Κύριος (« Seigneur »). Le corps du texte suit l’hébreu et la note conserve le témoignage grec.
- issue: Nombre grammatical de « choisi » dans la promesse dynastique
  choice: celui qu’il a choisi
  alternative: ceux qu’il a choisis
  rationale: La forme hébraïque peut être comprise comme plurielle, mais le contexte de la lignée de David et le singulier ἐκλεκτοῦ αὐτοῦ du grec favorisent le singulier sans effacer l’autre possibilité.
translation_notes:
  register: Français international moderne, clair et digne. L’image hébraïque « tomber à terre » est maintenue pour préserver sa force biblique; « lignée » évite le calque peu naturel « semence » tout en gardant la portée dynastique.
