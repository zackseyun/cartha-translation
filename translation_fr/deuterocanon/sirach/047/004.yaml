base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/004.yaml
  text: In his youth he struck down a warrior and removed everlasting disgrace[a]; when he raised his hand with the sling[b], he shattered the glory of Goliath.
translation:
  language: fr
  text: 'Dans sa jeunesse, il abattit un vaillant guerrier

    et fit disparaître une honte éternelle[a] ;

    en levant la main avec la fronde[b],

    il brisa la gloire de Goliath.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « il ôta l’opprobre qui pesait sur le peuple ». L’hébreu porte : « il fit disparaître une honte éternelle ».'
    reason: alternative_reading
  - marker: b
    text: Le grec mentionne explicitement un « géant » et une « pierre de fronde » ; il parle ensuite de l’orgueil de Goliath abattu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בנעוריו
  choice: Dans sa jeunesse
  rationale: Rend directement la période de jeunesse de David dans un français naturel, sans préciser davantage son âge.
- source_word: הכה גבור
  choice: il abattit un vaillant guerrier
  rationale: גבור désigne un homme fort ou un guerrier valeureux. « Abattit » exprime ici l'issue mortelle indiquée par le contexte et confirmée par le grec, sans remplacer le terme hébreu par « géant ».
- source_word: ויסר חרפת עולם
  choice: et ôta une honte éternelle
  rationale: Suit l'hébreu conservé, où עולם qualifie la honte. « Honte » restitue חרפה dans un français courant et digne, tandis qu'« éternelle » préserve la formulation forte et potentiellement ambiguë.
- source_word: בהניפו ידו
  choice: en levant la main
  rationale: Rend la circonstance de l'action avec naturel et conserve l'image concrète de la main levée.
- source_word: על קלע
  choice: avec la fronde
  rationale: La construction hébraïque est condensée. Le grec mentionne la pierre de fronde et confirme le sens instrumental ; « avec la fronde » reste fluide sans ajouter la pierre au texte principal.
- source_word: וישבר תפארת גלית
  choice: il brisa la gloire de Goliath
  rationale: תפארת peut signifier gloire, splendeur ou orgueil glorieux. « Gloire » suit de près l'hébreu et laisse entendre, dans le contexte, la renommée orgueilleuse renversée.
theological_decisions:
- issue: Divergence entre l'hébreu et le grec au sujet de la honte supprimée
  choice: 'Suivre dans le texte principal l''hébreu : « ôta une honte éternelle »'
  alternative: « ôta au peuple sa honte »
  rationale: L'hébreu conservé est prioritaire, tandis que le grec témoigne d'une formulation différente ou interprétative et mérite d'être signalé en note.
- issue: Identification de l'adversaire comme géant
  choice: Traduire גבור par « vaillant guerrier » dans le texte principal
  alternative: « géant »
  rationale: Le grec explicite « géant », mais l'hébreu dit « guerrier/homme vaillant ». Le nom de Goliath dans la suite suffit à identifier la scène sans imposer au premier membre la précision grecque.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme du verset est conservé. « Vaillant guerrier » évite l'ambiguïté possible de « un vaillant » tout en gardant la nuance de גבור ; les divergences grecques sont documentées sans remplacer l'hébreu dans le texte principal.
