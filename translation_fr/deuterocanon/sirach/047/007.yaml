translation:
  language: fr
  text: Il donna des villes parmi les Philistins[a] et, jusqu’à ce jour, il a brisé leur corne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque est très concise. On pourrait aussi comprendre : « des villes venant des Philistins » ou « des villes en Philistie ». Le texte grec parallèle souligne la défaite durable des Philistins.'
    reason: alternative_reading
  - marker: b
    text: Dans la Bible, la « corne » représente la force ou la puissance.
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתן
  choice: il établit
  rationale: Le verbe נתן signifie fondamentalement « donner, mettre, placer ». Avec « villes » et un complément de lieu, « établir » produit un français naturel tout en conservant l’idée de placer ou d’implanter, sans imposer la lecture plus précise « prendre ».
- source_word: בפלשתים
  choice: parmi les Philistins
  rationale: La préposition ב devant le nom du peuple est concise et peut évoquer un emplacement en territoire philistin ou une action exercée contre les Philistins. « Parmi les Philistins » reste proche de la forme hébraïque; la note signale les autres possibilités.
- source_word: ערים
  choice: des villes
  rationale: ערים désigne normalement des villes ou des agglomérations. « Villes » convient au contexte politique et militaire.
- source_word: ועד היום
  choice: jusqu’à ce jour
  rationale: Cette expression indique que l’effet de l’action se prolonge jusqu’au temps de l’auteur.
- source_word: שבר
  choice: il a brisé
  rationale: שבר signifie « briser ». Le passé composé, associé à « jusqu’à ce jour », exprime en français un acte dont l’effet demeure.
- source_word: קרנם
  choice: leur corne
  rationale: La traduction littérale conserve l’image biblique de la corne comme symbole de force ou de puissance; elle est également attestée dans le parallèle grec par κέρας.
theological_decisions:
- issue: Sens historique de l’action de David concernant les villes philistines
  choice: Conserver la formulation concise selon laquelle David établit des villes parmi les Philistins.
  alternative: « Il prit des villes aux Philistins » ou « Il écrasa les Philistins de tous côtés ».
  rationale: L’hébreu est prioritaire et ne précise pas explicitement que les villes furent prises. Le grec explicite une défaite militaire durable des Philistins, mais cette interprétation ne doit pas remplacer dans le texte principal l’expression plus resserrée de l’hébreu.
- issue: Métaphore de la corne
  choice: Maintenir « leur corne » dans le texte et expliquer l’image en note.
  alternative: « leur puissance » ou « leur force ».
  rationale: Le maintien de la métaphore préserve l’imagerie commune à l’hébreu et au grec sans réduire sa portée à une seule abstraction.
translation_notes:
  register: Français international moderne, sobre et digne. « Établit » rend la construction compréhensible sans effacer l’ambiguïté de l’hébreu, explicitée en note. La métaphore biblique de la corne est conservée.
