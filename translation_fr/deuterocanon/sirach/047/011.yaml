base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/011.yaml
  text: Yahweh also passed over his transgression[a], and exalted his horn forever; he gave him a decree of kingship[b], and established his throne in Jerusalem.
translation:
  language: fr
  text: Le SEIGNEUR passa aussi outre à sa transgression[a] et éleva pour toujours sa corne. Il lui donna une loi de royauté[b] et affermit son trône jusqu’à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit : « Le Seigneur enleva ses péchés. » L’hébreu dit plus littéralement : « passa outre à sa transgression ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec dit : « Il lui donna une alliance de rois et un trône de gloire en Israël. » L’hébreu porte : « une loi de royauté » et « affermit son trône jusqu’à Jérusalem ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יהוה
  choice: le SEIGNEUR
  rationale: Rend le nom divin selon la convention française biblique courante, avec les petites capitales représentées ici par des capitales.
- source_word: העביר פשעו
  choice: fit passer sa transgression
  rationale: Conserve l’image causative de l’hébreu et le sens marqué de פשע, plutôt que d’expliciter directement par « pardonna ».
- source_word: וירם לעולם קרנו
  choice: éleva sa puissance pour toujours
  rationale: Le « cor » est une métaphore biblique de force, de dignité et de puissance. « Puissance » communique naturellement cette valeur en français moderne sans réduire le sens au seul pouvoir politique.
- source_word: חוק ממלכת
  choice: un statut royal
  rationale: Préserve la valeur juridique de חוק et la dimension royale de ממלכת, dans une formulation française plus naturelle que « statut de royauté ».
- source_word: וכסאו הכין
  choice: et affermit son trône
  rationale: הכין désigne ici l’action de rendre ferme ou stable; « affermit » garde mieux cette nuance dynastique que le plus général « établit ».
- source_word: עד ירושלים
  choice: jusqu’à Jérusalem
  rationale: Suit le sens normal de עד et maintient la formulation difficile de l’hébreu, sans la remplacer silencieusement par la lecture grecque « en Israël ».
theological_decisions:
- issue: Action de Dieu à l’égard de la transgression de David
  choice: « fit passer sa transgression »
  alternative: « pardonna sa transgression » ou, selon le grec, « enleva ses péchés »
  rationale: La traduction conserve l’image propre à l’hébreu tout en laissant entendre la remise de la faute, sans développer une doctrine au-delà du verset.
- issue: Nature du don royal
  choice: « un statut royal »
  alternative: 'Selon le grec : « une alliance de rois »'
  rationale: Le témoin hébreu porte חוק ממלכת et reste prioritaire; la variante grecque, significative, est signalée en note.
- issue: Lieu ou extension du trône
  choice: « jusqu’à Jérusalem »
  alternative: 'Selon le grec : « un trône de gloire en Israël »; interprétation contextuelle possible : « à Jérusalem »'
  rationale: La formulation inhabituelle de l’hébreu est conservée plutôt que résolue silencieusement; les divergences textuelles sont documentées.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du parallélisme hébreu. « Le SEIGNEUR » suit l’usage biblique français pour le tétragramme. Les notes rendent visibles les écarts importants du parallèle grec.
