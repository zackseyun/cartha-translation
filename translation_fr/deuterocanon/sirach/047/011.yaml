revisions:
- from: Le SEIGNEUR aussi fit passer sa transgression[a] et éleva sa puissance pour toujours. Il lui donna un statut royal[b] et affermit son trône jusqu’à Jérusalem.
  to: Le SEIGNEUR passa aussi outre à sa transgression[a] et éleva pour toujours sa corne. Il lui donna une loi de royauté[b] et affermit son trône jusqu’à Jérusalem.
  rationale: La révision conserve la primauté du témoin hébreu et sa formulation ambiguë concernant Jérusalem. Elle remplace une expression française maladroite par « passa outre à », préserve la métaphore de la corne, et précise le sens juridique de חוק ממלכת sans adopter la lecture grecque « alliance de rois ». Les notes restent ancrées aux mêmes emplacements et signalent les variantes grecques importantes.
