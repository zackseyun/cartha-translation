    issue: « fit passer sa transgression »
    rationale: Cette tournure est syntaxiquement possible mais peu naturelle et ne communique pas clairement l’idée de passer outre/remettre la faute. « passa outre à sa transgression » conserve le caractère imagé et le sens contextuel.
  - severity: medium
    issue: « éleva sa puissance »
    rationale: Le texte hébreu dit littéralement « sa corne ». La substitution par « puissance » interprète et efface une métaphore royale significative qui demeure intelligible en français biblique.
  - severity: medium
    issue: « un statut royal »
    rationale: En français, l’expression évoque facilement le rang ou le régime juridique du roi. Elle ne rend pas avec assez de précision la valeur de חוק ממלכת, une prescription/loi touchant à la royauté.
