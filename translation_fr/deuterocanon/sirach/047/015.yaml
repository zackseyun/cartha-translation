  text: How wise you were in your youth[a], and instruction overflowed like the Nile.
translation:
  language: fr
  text: Comme tu étais sage dans ta jeunesse[a] ! Ton instruction débordait comme le Nil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente ici une lecture très différente : « Ton âme couvrit la terre, et tu la remplis de paraboles énigmatiques. » Il reflète probablement un texte hébreu de départ différent ou une tradition textuelle divergente.'
    reason: alternative_reading
lexical_decisions:
- source_word: מה חכמת
  choice: Comme tu étais sage
  rationale: מה a ici une valeur exclamative, et חכמת décrit l'état de sagesse de Salomon. Cette tournure française exprime naturellement l'admiration sans transformer la phrase en question.
- source_word: בנעוריך
  choice: dans ta jeunesse
  rationale: Expression temporelle directe qui renvoie aux jeunes années de Salomon et conserve un registre digne et courant.
- source_word: ותצף
  choice: débordait
  rationale: Le verbe évoque une montée ou un débordement des eaux; avec l'image du Nil, « débordait » rend bien l'idée d'une abondance qui se répand.
- source_word: כיאר
  choice: comme le Nil
  rationale: יאר désigne couramment le Nil. Garder ce nom précis préserve l'image géographique et l'évocation de ses crues abondantes.
- source_word: מוסר
  choice: instruction
  rationale: מוסר peut désigner la discipline ou l'enseignement formateur. Dans cet éloge de la sagesse de Salomon, « instruction » convient au savoir transmis ou exprimé en abondance.
theological_decisions:
- issue: Choix entre le texte hébreu conservé et la lecture grecque divergente
  choice: Suivre l'hébreu dans le texte principal et signaler le grec en note.
  alternative: « Ton âme couvrit la terre, et tu la remplis de paraboles énigmatiques. »
  rationale: L'hébreu étant conservé ici avec une confiance élevée, il constitue la base de la traduction. Le grec témoigne toutefois d'une ancienne lecture substantiellement différente, qui doit être préservée sans être fusionnée avec l'hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. L'exclamation initiale conserve la louange du texte hébreu; l'image concrète de la crue du Nil est maintenue.
