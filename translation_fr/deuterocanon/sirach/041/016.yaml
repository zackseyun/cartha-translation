base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/016.yaml
  text: 'Instruction in shame: hear[a], sons, and be ashamed according to my judgments. Not every shame is fitting to keep[b], and not every disgrace is rightly chosen.'
translation:
  language: fr
  text: 'Instruction sur la honte : écoutez, fils, et ayez honte selon mes jugements.[a] Il ne convient pas de conserver toute honte, et toute humiliation n’est pas à choisir.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Ayez donc honte à cause de ma parole », là où l’hébreu dit : « selon mes jugements ».'
    reason: alternative_reading
  - marker: b
    text: 'Le grec a : « et tout n’est pas approuvé par tous dans la foi ». Cette dernière proposition diffère sensiblement de l’hébreu conservé.'
    reason: alternative_reading
lexical_decisions:
- source_word: מוסר בשת
  choice: l’instruction sur la honte
  rationale: מוסר désigne ici une instruction formatrice propre à la littérature de sagesse. Le rapport nominal avec בשת est rendu naturellement en français par « sur la honte », sans imposer une nuance punitive.
- source_word: שמעו בנים
  choice: Écoutez, mes fils
  rationale: « Écoutez » est l’impératif naturel en français dans l’adresse d’un maître de sagesse. « Mes fils » conserve l’adresse masculine explicite בנים et explicite idiomatiquement la relation pédagogique.
- source_word: והכלמו
  choice: sachez avoir honte
  rationale: Cette formulation exhortative exprime une disposition à éprouver la honte quand elle convient, plutôt que l’ordre peu naturel « ayez honte » sans objet précis.
- source_word: על משפטי
  choice: selon mes jugements
  rationale: Le choix suit le texte hébreu, où משפטי renvoie aux jugements ou critères énoncés par le sage. « Selon » rend ici la fonction normative de על.
- source_word: לא כל בשת נאה לשמור
  choice: Toute honte ne mérite pas d’être conservée
  rationale: La tournure garde la portée distributive de לא כל et la métaphore de שמר, « garder, conserver ». « Mérite » rend de façon actuelle l’idée de ce qui est convenable ou approprié exprimée par נאה.
- source_word: ולא כל הכלם נבחר
  choice: et toute humiliation n’est pas à choisir
  rationale: « Humiliation » distingue הכלם de בשת tout en restant dans le même champ sémantique. « N’est pas à choisir » conserve l’image de la sélection portée par נבחר sans transformer le texte en approbation abstraite.
theological_decisions:
- issue: Adresse masculine בנים
  choice: mes fils
  alternative: mes enfants
  rationale: Le texte hébreu emploie explicitement le masculin pluriel dans la forme traditionnelle de l’enseignement sapiential. La traduction le conserve au lieu de le neutraliser.
- issue: Divergence entre l’hébreu et le grec dans la dernière proposition
  choice: Suivre le texte hébreu dans le corps du verset
  alternative: 'Suivre le grec : « tout n’est pas approuvé par tous dans la foi »'
  rationale: Le témoin hébreu est présent et jugé fiable. Le grec présente une fin sensiblement différente, qui doit être signalée sans remplacer silencieusement l’hébreu.
translation_notes:
  register: Français international actuel, digne et accessible, avec la cadence d’une exhortation sapientiale. La répétition de « honte » est partiellement variée par « humiliation » conformément au changement de forme hébraïque, tandis que l’ambiguïté éthique — certaines formes de honte conviennent, d’autres non — demeure intacte.
