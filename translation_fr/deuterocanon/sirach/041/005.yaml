  text: The children of the despised are an evil thing[c][b][a], and the offspring of a fool are in the terror of the wicked.
translation:
  language: fr
  text: 'La descendance de celui qu’on méprise est une chose mauvaise[a][c],

    et la postérité d’un insensé vit dans la terreur des méchants[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu du premier membre est difficile. Le grec porte plutôt : « Des enfants abominables sont des enfants de pécheurs. »'
    reason: alternative_reading
  - marker: b
    text: 'Le grec diffère davantage dans le second membre et porte approximativement : « et ils fréquentent les lieux habités par les impies. »'
    reason: alternative_reading
  - marker: c
    text: L’ancien témoin de Massada est fragmentaire à cet endroit ; le texte hébreu lisible de ce verset vient principalement des manuscrits de la Guéniza du Caire.
    reason: textual_variant
lexical_decisions:
- source_word: נין
  choice: la descendance
  rationale: Le nom désigne la progéniture ou les descendants. « La descendance » convient à sa valeur collective et forme un parallèle naturel avec נכד.
- source_word: נמאס
  choice: de celui qu’on méprise
  rationale: Le participe passif est compris comme désignant une personne méprisée ou rejetée. Cette formulation française conserve cette relation sans faire directement de la descendance elle-même l’objet du mépris.
- source_word: דבר רעים
  choice: est une chose mauvaise
  rationale: L’expression hébraïque est difficile. Comprendre דבר au sens de « chose, affaire » et רעים comme une qualification négative donne un sens cohérent tout en laissant paraître la rudesse du texte.
- source_word: נכד
  choice: la postérité
  rationale: Bien que le mot puisse désigner plus précisément un petit-enfant, son parallélisme avec נין favorise ici le sens plus large de descendance ou postérité.
- source_word: אויל
  choice: d’un insensé
  rationale: Dans la littérature de sagesse, אויל désigne une personne moralement insensée, et non simplement quelqu’un qui manque d’intelligence.
- source_word: במגור
  choice: vit dans la terreur
  rationale: מגור exprime l’effroi ou la terreur. Le verbe « vit » est un léger explicitation idiomatique du syntagme nominal hébreu « dans la terreur ».
- source_word: רשע
  choice: des méchants
  rationale: Le singulier hébreu peut avoir une portée collective. Le pluriel français exprime naturellement cette catégorie morale.
theological_decisions:
- issue: Primauté du texte hébreu malgré une formulation difficile et un parallèle grec divergent
  choice: Traduire d’abord le texte hébreu des manuscrits de la Guéniza du Caire, en signalant les divergences grecques en notes.
  alternative: 'Suivre le grec : « Les enfants des pécheurs deviennent des enfants abominables, et ils fréquentent les lieux habités par les impies. »'
  rationale: L’hébreu est conservé ici, quoique difficile, et doit donc rester le texte directeur. Le grec confirme le jugement fortement négatif du verset, mais diffère trop dans ses formulations, surtout au second membre, pour remplacer silencieusement l’hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. Le vocabulaire de sagesse (« insensé », « méchants ») est conservé, tandis que « descendance » et « postérité » rendent le parallélisme sans imposer une génération précise.
