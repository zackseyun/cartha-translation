translation:
  language: fr
  text: de fixer du regard le visage de la femme d’un autre homme[a], et de s’approcher de sa servante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu זרה peut aussi désigner « une femme étrangère » ou, selon le contexte, une femme qui n’est pas la sienne. Le grec parallèle lit « une femme mariée », ce qui appuie ici le sens « la femme d’un autre homme ».
    reason: alternative_reading
lexical_decisions:
- source_word: מהביט
  choice: de fixer du regard
  rationale: Le verbe signifie « regarder, porter le regard ». Dans cette liste de conduites honteuses, « fixer du regard » exprime un regard appuyé sans aller jusqu’à expliciter une intention sexuelle.
- source_word: אל פני
  choice: le visage de
  rationale: Cette formulation conserve l’image concrète de l’hébreu, littéralement « vers le visage de », également attestée dans la tradition grecque.
- source_word: זרה
  choice: la femme d’un autre
  rationale: L’hébreu peut désigner une femme étrangère, inconnue ou interdite. Le grec parallèle précise qu’il s’agit d’une femme mariée ; « la femme d’un autre » rend ce sens contextuel tout en laissant l’ambiguïté lexicale à la note.
- source_word: ומהתקרב
  choice: et de t’approcher
  rationale: Le verbe קרב signifie « s’approcher, venir près ». La tournure avec le pronom de deuxième personne s’intègre naturellement en français à la série d’exhortations sous-entendue par le contexte.
- source_word: שפחתה
  choice: sa servante
  rationale: שפחה désigne une servante, souvent de condition servile. « Servante » est naturel et conserve le lien domestique avec la femme mentionnée ; « esclave » reste lexicalement possible.
theological_decisions:
- issue: Sens de זרה à la lumière du parallèle grec
  choice: la femme d’un autre
  alternative: une femme étrangère / une inconnue / une femme mariée
  rationale: L’hébreu demeure plus large, tandis que le grec interprète explicitement la femme comme mariée. Le texte retient la précision contextuelle du grec, mais une note préserve l’éventail réel de l’hébreu sans transformer cette interprétation en certitude lexicale.
translation_notes:
  register: Français international moderne, sobre et digne. Le verset étant syntaxiquement rattaché à la liste précédente de ce dont il faut avoir honte, la formulation fragmentaire commençant par « de » est conservée. Le tutoiement apparaît dans « t’approcher » pour rendre naturellement l’exhortation implicite.
