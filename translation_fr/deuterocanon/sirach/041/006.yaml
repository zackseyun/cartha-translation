  source_fidelity: La seconde proposition doit rendre רֵישׁ, qui signifie normalement « pauvreté, indigence », et non « honte ». Le parallèle grec présente ici une formulation sensiblement différente, avec « opprobre »; il convient de le signaler comme lecture parallèle plutôt que de lui substituer son sens dans le texte français. « Domination » rend plus précisément ממשלת que « pouvoir », tout en conservant la relation elliptique du texte hébreu.
  naturalness: La formulation révisée reste proverbiale, claire et naturelle en français moderne. « Du fils de l’injustice vient… » conserve le singulier et la construction imagée de l’hébreu sans alourdir le verset.
  terminology: « Fils de l’injustice » respecte בן + עול; « domination du mal » rend ממשלת רע; « pauvreté » traduit ריש; « descendance » convient pour זרעו. La note distingue explicitement l’indigence du texte hébreu de l’opprobre du grec.
