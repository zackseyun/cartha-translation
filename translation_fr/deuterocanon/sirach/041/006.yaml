  - severity: low
    issue: « pouvoir » est moins spécifique que « domination » pour ממשלת.
    rationale: Le terme hébreu renvoie à la domination, à la souveraineté ou à l’exercice du gouvernement. « Domination » conserve plus nettement cette valeur.
