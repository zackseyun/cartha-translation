  text: The dominion of evil is from the child of injustice, and disgrace is always with his offspring.
translation:
  language: fr
  text: Du fils de l’injustice vient la domination du mal, et la pauvreté demeure toujours avec sa descendance.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « L’héritage des enfants des pécheurs périra, et l’opprobre subsistera avec leur descendance. » Le texte hébreu conservé est difficile et diffère sensiblement dans la seconde proposition : il parle de pauvreté ou d’indigence avec sa descendance, tandis que le grec parle d’opprobre durable.'
    reason: alternative_reading
lexical_decisions:
- source_word: מבן עול
  choice: du fils de l’injustice
  rationale: Rend directement מ־ + בן + עול. « Fils » conserve le singulier masculin du témoin hébreu, tandis qu’« injustice » exprime la faute morale désignée par עול.
- source_word: ממשלת רע
  choice: vient le pouvoir du mal
  rationale: ממשלה désigne le pouvoir, l’autorité ou la domination. La tournure verbale française rend naturellement la relation exprimée par l’hébreu compact, sans trancher davantage la nature exacte de ce pouvoir.
- source_word: וריש עם
  choice: et la honte
  rationale: Le texte hébreu transmis est difficile. Le grec ὄνειδος confirme le sens général de honte ou d’opprobre; « honte » est clair, actuel et digne.
- source_word: זרעו
  choice: sa descendance
  rationale: זרע désigne ici les descendants. « Descendance » convient mieux en français moderne que le calque « semence » et préserve la portée collective.
- source_word: תמיד
  choice: toujours
  rationale: תמיד marque la continuité ou la permanence; « toujours » en offre le rendu français le plus concis.
theological_decisions:
- issue: Primauté du témoin hébreu malgré une seconde proposition difficile
  choice: Conserver la structure et les éléments lisibles de l’hébreu, en s’aidant du grec seulement pour préciser le sens de honte durable attachée à la descendance.
  alternative: 'Suivre directement le grec : « L’héritage des enfants des pécheurs périra, et l’opprobre subsistera avec leur descendance. »'
  rationale: Le témoin hébreu est ici la source première. Le parallèle grec éclaire la seconde proposition sans justifier le remplacement de l’ensemble par sa formulation sensiblement différente.
translation_notes:
  register: Français international moderne, sobre et proverbial. La syntaxe reste proche du parallélisme hébreu tout en évitant une formulation artificielle. « Fils » est maintenu afin de respecter le singulier explicite du témoin hébreu.
