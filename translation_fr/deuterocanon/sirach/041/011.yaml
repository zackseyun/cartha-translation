  text: A man's body is vanity[a], but a gracious name will not be cut off.
translation:
  language: fr
  text: Le corps de l’être humain n’est qu’un souffle, mais un nom marqué par la bonté ne disparaîtra pas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente une autre lecture : « le nom des pécheurs ne sera pas effacé en tant que bon » ; les derniers mots peuvent aussi se comprendre au sens de « ne sera pas effacé pour de bon ». L’hébreu porte plutôt : « un nom marqué par la bonté ne sera pas retranché ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הבל
  choice: n’est qu’un souffle
  rationale: Le nom évoque ce qui est fugitif, inconsistant et passager. « Souffle » conserve l’image hébraïque et évite le sens moderne fréquent de « vanité » comme orgueil.
- source_word: אדם בגויתו
  choice: le corps de l’être humain
  rationale: גויה désigne ici le corps plutôt que le cadavre. La formulation française exprime naturellement le caractère passager de l’être humain dans sa condition corporelle, sans restreindre אדם au sexe masculin.
- source_word: אך
  choice: mais
  rationale: La conjonction marque le contraste entre la fragilité du corps et la persistance d’un bon nom.
- source_word: שם חסד
  choice: un nom marqué par la bonté
  rationale: « Nom » garde l’image biblique de la réputation, tandis que « marqué par la bonté » rend naturellement la relation concise entre שם et חסד sans lui imposer ici un sens spécifiquement covenantal.
- source_word: לא יכרת
  choice: ne disparaîtra pas
  rationale: Le verbe signifie littéralement « ne sera pas retranché ». Appliqué à un nom ou à une réputation, « ne disparaîtra pas » transmet idiomatiquement l’idée de permanence en français courant.
theological_decisions:
- issue: Divergence entre le témoin hébreu et le parallèle grec dans la seconde proposition
  choice: 'Suivre l’hébreu : « un nom marqué par la bonté ne disparaîtra pas »'
  alternative: 'Le grec peut se comprendre : « le nom des pécheurs ne sera pas effacé comme bon » ou « ne sera pas effacé pour de bon »'
  rationale: L’hébreu conservé, de haute confiance, est ici la source principale. Sa formulation positive sur la permanence d’un nom lié à la bonté diffère sensiblement de la formulation négative du grec ; cette divergence réelle est donc signalée en note plutôt que résolue silencieusement.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Souffle » rend concrètement la fragilité exprimée par הבל ; « nom » maintient la résonance biblique tout en évoquant naturellement la réputation.
