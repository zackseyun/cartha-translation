  terminology: « Maître et maîtresse », « assemblée », « transgression », « compagnon et ami » conservent correctement les contrastes du texte. Le remplacement de « faire du tort » par « commettre une faute » maintient l’ampleur sémantique de מעל sans imposer le sens spécialisé d’« infidélité » ou d’« abus de confiance ».
  issues:
