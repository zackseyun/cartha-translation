  text: Before a master and mistress[a], be ashamed of a lie; before an assembly and the people, of transgression; before a companion and a friend, of wrongdoing; and where you sojourn[c][b], of theft.
translation:
  language: fr
  text: Devant un maître et une maîtresse[a], aie honte de mentir ; devant une assemblée et le peuple, de commettre une transgression ; devant un compagnon et un ami, de commettre une faute ; et là où tu séjournes[b], de voler[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « un maître et une maîtresse » ; le grec parallèle a « un juge et un chef ». Le texte suit ici le témoin hébreu.
    reason: textual_variant
  - marker: b
    text: La tournure hébraïque est difficile ; littéralement, elle évoque « le lieu où tu séjournes » ou « le lieu où tu habites ».
    reason: textual_variant
  - marker: c
    text: Le dernier mot hébreu signifie normalement « étranger » ou « ce qui appartient à autrui ». Le membre final est obscur ; « voler » en exprime un sens contextuel probable, sans lever l’incertitude du texte hébreu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מאדון וגברת
  choice: Devant un maître et une maîtresse
  rationale: Le témoin hébreu, retenu comme source principale, désigne un maître et une maîtresse. Dans cette liste de conduites dont il faut avoir honte, la préposition מ־ se rend naturellement par « devant ».
- source_word: על שקר
  choice: de mentir
  rationale: Le nom שקר désigne le mensonge ou la fausseté. L’infinitif français exprime ici naturellement la conduite visée, sans en atténuer le sens.
- source_word: מעדה ועם
  choice: devant une assemblée et le peuple
  rationale: עדה désigne une assemblée ou une communauté réunie. « Assemblée » reste large et n’impose pas un cadre cultuel.
- source_word: על פשע
  choice: de commettre une transgression
  rationale: פשע porte l’idée d’une faute grave, d’une infraction ou d’une rébellion. « Transgression » en conserve le poids moral.
- source_word: מחבר ורע
  choice: devant un compagnon et un ami
  rationale: Les deux termes évoquent des relations sociales proches. Cette formulation conserve le parallélisme sans réduire חבר à un associé commercial.
- source_word: על מעל
  choice: de faire du tort
  rationale: מעל peut désigner une faute, une infidélité ou un abus de confiance. Dans ce contexte interpersonnel, « faire du tort » est naturel tout en restant suffisamment large.
- source_word: וממקום תגור
  choice: et là où tu séjournes
  rationale: La formulation hébraïque est difficile, mais תגור renvoie au fait de résider ou de séjourner. La traduction conserve cette nuance sans transformer le lieu en groupe de personnes.
- source_word: על זר
  choice: de voler
  rationale: זר signifie normalement « étranger » ou « ce qui appartient à autrui », mais la construction finale est obscure. Le grec parallèle appuie explicitement le sens de vol ; celui-ci est retenu dans le texte avec une note signalant l’incertitude.
