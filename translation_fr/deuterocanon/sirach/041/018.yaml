    issue: « Faire du tort » pour מעל
    rationale: Cette expression évoque spécifiquement le préjudice causé à autrui, tandis que מעל couvre plus largement une faute ou une rupture de loyauté. « Commettre une faute » préserve mieux l’ambiguïté du terme hébreu.
