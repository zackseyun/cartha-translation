  source_fidelity: 'La structure exhortative et les trois premiers membres rendent fidèlement l’hébreu. « De faire du tort » est cependant plus étroit et plus concret que מעל, qui désigne plutôt une faute, notamment une violation de la confiance. Le dernier membre hébreu demeure obscur : « de voler » peut être retenu comme sens contextuel probable, à condition que la note ne le présente pas comme assuré par le grec parallèle fourni, qui ne contient pas ce membre final.'
