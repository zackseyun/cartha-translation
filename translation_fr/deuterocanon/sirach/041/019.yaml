  text: for violating an oath and a covenant[b][a], and for leaning with your elbow over the bread.
translation:
  language: fr
  text: pour avoir violé un serment[a] et une alliance, et pour avoir posé le coude sur le pain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi désigner une malédiction ou une adjuration, car il évoque souvent un serment assorti d’une sanction.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu de cette proposition est concis et quelque peu incertain. Le grec porte plus explicitement : « avoir posé le coude sur les pains ».'
    reason: textual_variant
lexical_decisions:
- source_word: מהפר
  choice: pour avoir violé
  rationale: Le hifil de פרר exprime ici la rupture ou la violation d’un engagement. « Violé » convient naturellement au serment comme à l’alliance et conserve la portée morale du contexte.
- source_word: אלה
  choice: un serment
  rationale: אלה peut désigner un serment assorti d’une malédiction implicite. Dans cette coordination avec ברית, « serment » rend le mieux l’obligation solennelle sans effacer les autres nuances possibles.
- source_word: וברית
  choice: et une alliance
  rationale: ברית désigne normalement une alliance ou un engagement formel. « Alliance » garde la force relationnelle et solennelle du terme.
- source_word: ממטה
  choice: pour avoir posé
  rationale: Le texte hébreu est difficile. Le parallèle grec, πήξεως ἀγκῶνος, évoque le fait de fixer ou poser le coude; « posé » restitue concrètement ce geste sans lui attribuer une intention non exprimée.
- source_word: אציל
  choice: le coude
  rationale: אציל désigne l’articulation du bras, ici précisément le coude, comme le confirme le grec ἀγκών.
- source_word: אל לחם
  choice: sur le pain
  rationale: La préposition hébraïque est littéralement orientée « vers » le pain, mais le grec ἐπ᾿ ἄρτους appuie l’image du coude posé sur ou au-dessus des pains. « Sur le pain » reste concret et concis.
