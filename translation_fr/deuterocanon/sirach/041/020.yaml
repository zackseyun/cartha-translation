translation:
  language: fr
  text: Aie honte de refuser une demande[a] et de détourner le visage de ton prochain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est incertain ici et diffère fortement du grec, qui porte approximativement : « d’échanger des salutations au sujet du silence, et de regarder une femme qui est une compagne ou une courtisane ». Le texte principal suit le témoin hébreu conservé, mais l’écart est important.'
    reason: alternative_reading
lexical_decisions:
- source_word: ממנוע
  choice: de refuser
  rationale: La préposition מן avec מנע exprime ici l’idée de retenir ou de refuser. « Refuser » est naturel en français dans le contexte d’une demande.
- source_word: מתת שאלה
  choice: une demande
  rationale: 'La formulation hébraïque transmise est difficile : מתת évoque normalement le don ou l’action de donner, tandis que שאלה désigne une demande ou une requête. La traduction retient prudemment le sens général de « demande » sans reproduire une expression française obscure.'
- source_word: מהשב
  choice: de détourner
  rationale: La forme causative liée à שוב peut exprimer l’action de faire revenir ou de détourner. Avec « visage », « détourner » donne une expression française cohérente.
- source_word: אפי
  choice: le visage de
  rationale: אף peut désigner le nez, le visage ou la colère. Dans la séquence consonantique אפי רעך, la lecture « le visage de ton prochain » est grammaticalement possible et correspond au texte de consultation, mais le passage demeure incertain.
- source_word: רעך
  choice: ton prochain
  rationale: רע désigne le prochain, le compagnon ou le semblable. « Ton prochain » conserve la portée éthique du terme dans un français biblique moderne et compréhensible.
theological_decisions:
- issue: Forte divergence entre le texte hébreu transmis et le parallèle grec
  choice: Suivre prudemment l’hébreu dans le texte principal et signaler la divergence en note.
  alternative: 'Le grec porte approximativement : « d’échanger des salutations au sujet du silence, et de regarder une femme qui est une compagne/courtisane ».'
  rationale: L’hébreu conservé a priorité comme texte source, mais sa difficulté et l’écart considérable du grec interdisent de présenter cette traduction comme certaine.
- issue: Ambiguïté de אפי רעך
  choice: « le visage de ton prochain »
  alternative: « ta colère contre ton prochain » ou, plus littéralement selon une autre analyse, « la colère de ton prochain »
  rationale: La morphologie et la transmission du passage sont instables. La lecture par « visage » préserve une construction hébraïque possible et évite de corriger silencieusement le suffixe afin d’obtenir « ta colère ».
translation_notes:
  register: Français moderne, direct et digne. L’impératif « Aie honte » reprend la série d’exhortations du contexte. Le tutoiement convient à l’adresse sapientielle individuelle. La note rend explicitement compte de l’instabilité textuelle.
