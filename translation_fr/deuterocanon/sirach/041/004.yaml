base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/004.yaml
  text: This is the lot of all flesh from God[a], so why reject the decree of the Most High? Whether for a thousand years, or a hundred, or ten[d][c][b], there is no rebuke of life in Sheol.
translation:
  language: fr
  text: Tel est le lot que Dieu[a] assigne à toute chair ; pourquoi donc rejeter le décret du Très-Haut[b] ? Que l’on vive dix ans, cent ans ou mille ans[c], dans le Shéol[d], il n’y a pas de reproche au sujet de la vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit « de Dieu » ; le grec parallèle porte « du Seigneur ».
    reason: alternative_reading
  - marker: b
    text: L’hébreu transmis semble dire « la loi du Très-Haut », tandis que le grec porte « le bon plaisir du Très-Haut ». « Décret » exprime ici ce que le Très-Haut a fixé.
    reason: alternative_reading
  - marker: c
    text: 'La suite des nombres est difficile dans le témoin hébreu, qui semble mentionner « mille ans, cent et dix ». Le grec lit clairement : « dix, cent ou mille ans ».'
    reason: textual_variant
  - marker: d
    text: 'L’hébreu porte « Shéol » ; le grec parallèle porte « Hadès ». L’expression entière est obscure ; le grec lit littéralement : « dans l’Hadès, il n’y a pas de reproche de vie ».'
    reason: textual_difficulty
lexical_decisions:
- source_word: זה חלק כל בשר / τοῦτό τὸ κρίμα ... πάσῃ σαρκί
  choice: Tel est le lot assigné ... à tout être de chair
  rationale: « Lot » rend l’hébreu חלק, tandis que « tout être de chair » conserve l’image biblique de בשר / σάρξ pour l’humanité mortelle. « Assigné » explicite naturellement en français la provenance divine exprimée par מאל.
- source_word: מאל / παρὰ Κυρίου
  choice: par Dieu
  rationale: L’hébreu, témoin principal ici, porte « de Dieu »; la tournure française « lot assigné par Dieu » en exprime clairement le sens. Le grec lit « du Seigneur », signalé en note.
- source_word: תמאס / ἀπαναίνῃ
  choice: rejeter
  rationale: Le verbe hébreu מאס signifie rejeter ou mépriser; « rejeter » convient à la question rhétorique et rejoint le sens de refus porté par le grec.
- source_word: בתורת עליון / ἐν εὐδοκίᾳ Ὑψίστου
  choice: le décret du Très-Haut
  rationale: L’hébreu transmis évoque la « loi » du Très-Haut, tandis que le grec parle de son « bon plaisir ». « Décret » exprime ici une décision divine arrêtée sans effacer la divergence, laquelle est exposée en note.
- source_word: לאלף שנים מאה ועשר / εἴτε δέκα εἴτε ἑκατὸν εἴτε χίλια ἔτη
  choice: Que l’on vive dix ans, cent ans ou mille ans
  rationale: La suite numérique hébraïque est difficile, alors que le grec donne nettement dix, cent et mille ans. La formulation française suit cette série intelligible tout en signalant l’incertitude textuelle.
- source_word: איש תוכחות בשאול חיים / οὐκ ἔστιν ἐν ᾅδου ἔλεγμὸς ζωῆς
  choice: dans le Shéol il n’y a pas de reproche au sujet de la vie
  rationale: Cette formulation reste proche du grec et des éléments lisibles de l’hébreu, tout en préservant l’obscurité réelle de la proposition plutôt que de lui imposer une interprétation plus précise.
theological_decisions:
- issue: 'Désignation du séjour des morts : שאול / ᾅδης'
  choice: le Shéol
  alternative: l’Hadès ; le séjour des morts
  rationale: Puisque l’hébreu est conservé et porte שאול, « Shéol » préserve le concept du texte source sans l’assimiler à une conception ultérieure de l’au-delà. La lecture grecque est donnée en note.
- issue: Divergence entre la « loi » hébraïque et le « bon plaisir » grec
  choice: le décret du Très-Haut
  alternative: la loi du Très-Haut ; le bon plaisir du Très-Haut ; la volonté du Très-Haut
  rationale: « Décret » convient au contexte de la mortalité fixée par Dieu et sert d’équivalence contextuelle, tandis que la note rend transparente la divergence significative entre les témoins.
- issue: Sens de l’absence de « reproche de vie » dans le Shéol
  choice: formulation littérale et ouverte
  alternative: dans le Shéol, personne n’a à rendre compte de la durée de sa vie ; il n’y a pas de récrimination concernant la vie
  rationale: La syntaxe hébraïque est difficile et le grec reste concis. Une paraphrase doctrinalement plus déterminée risquerait de résoudre indûment l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La structure proverbiale et la question rhétorique sont conservées. « Shéol » maintient le terme biblique source; les divergences hébreu-grec et l’obscurité de la dernière proposition sont explicitées sans harmonisation doctrinale.
