  text: Hidden wisdom and a concealed treasure—what benefit is there in either of them?[a][b]
translation:
  language: fr
  text: 'Une sagesse cachée et un trésor dissimulé : quel avantage y a-t-il dans l’un comme dans l’autre ?[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « quel avantage y a-t-il dans les deux ? » La traduction « dans l’un comme dans l’autre » explicite en français la portée de la question rhétorique.'
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec ajoute au début : « Enfants, conservez l’instruction dans la paix », avant « une sagesse cachée et un trésor invisible… ». Le témoin hébreu retenu pour le texte principal commence par la phrase sur la sagesse cachée.'
    reason: textual_variant
lexical_decisions:
- source_word: חכמה
  choice: sagesse
  rationale: Le nom désigne ici la sagesse, conformément au parallèle grec σοφία, dans une maxime qui la compare à un bien précieux.
- source_word: טמונה
  choice: cachée
  rationale: Le participe évoque ce qui est tenu hors de vue ou mis en réserve. « Cachée » est naturel et suffisamment large, sans préciser qu’elle serait enterrée.
- source_word: אוצר
  choice: trésor
  rationale: Dans ce parallélisme, le mot désigne le bien précieux plutôt que son lieu de conservation; le grec θησαυρός confirme ce sens.
- source_word: מוסתר
  choice: dissimulé
  rationale: Ce choix restitue l’idée de ce qui est soustrait aux regards tout en évitant de répéter « caché » dans le second membre.
- source_word: מה תועלה
  choice: quel avantage y a-t-il
  rationale: Cette formulation française actuelle rend la question rhétorique portant sur l’utilité ou le profit pratique.
- source_word: בשתיהם
  choice: dans l’un comme dans l’autre
  rationale: L’hébreu dit littéralement « dans les deux ». Cette tournure française conserve la référence conjointe aux deux réalités tout en exprimant naturellement que ni l’une ni l’autre n’est profitable lorsqu’elle reste cachée.
