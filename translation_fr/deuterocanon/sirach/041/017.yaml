  text: Be ashamed before father and mother for sexual immorality[a], and before a ruler in office for lying.
translation:
  language: fr
  text: Aie honte, devant ton père et ta mère, de l’inconduite sexuelle, et devant un dirigeant en fonction[a], du mensonge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « un dirigeant assis », sans doute sur son siège d’autorité. Le grec parallèle porte : « un chef et un puissant ».'
    reason: alternative_reading
lexical_decisions:
- source_word: בוש
  choice: Aie honte
  rationale: L’impératif appelle à éprouver de la honte ou de la retenue morale. « Aie honte » conserve directement la force de l’exhortation.
- source_word: מאב ואם
  choice: devant ton père et ta mère
  rationale: Après בוש, la préposition מן désigne ici les personnes devant lesquelles on éprouve de la honte. Le grec parallèle confirme ce rapport. Le possessif est naturel en français dans cette relation familiale.
- source_word: אל זנות
  choice: de l’inconduite sexuelle
  rationale: זנות désigne largement une conduite sexuelle illicite, sans se limiter à la prostitution. « Inconduite sexuelle » garde cette portée générale dans un registre digne et actuel.
- source_word: מנשיא יושב
  choice: devant un dirigeant en fonction
  rationale: Le texte hébreu évoque littéralement un dirigeant « assis », probablement sur son siège d’autorité. « En fonction » exprime naturellement cette autorité institutionnelle, tandis que la note conserve l’image hébraïque.
- source_word: אל כחש
  choice: du mensonge
  rationale: כחש peut désigner le mensonge, la fausseté ou la tromperie. Dans cette série d’exhortations morales, « mensonge » est direct et correspond aussi au grec ψεῦδος.
