base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/001.yaml
  text: O death[a], how bitter is your remembrance to a man at ease in his possessions, to a man untroubled and prospering in everything[b], and still strong enough to enjoy pleasure.
translation:
  language: fr
  text: Ô mort, combien ton souvenir est amer pour l’homme qui vit paisiblement au milieu de ses biens[a], pour l’homme tranquille qui réussit en tout et qui a encore la force de goûter aux plaisirs[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu peut aussi se comprendre : « qui repose tranquillement dans sa situation ». Le grec parle d’un homme qui vit en paix au milieu de ce qu’il possède.'
    reason: textual_variant
  - marker: b
    text: 'Littéralement, en hébreu : « qui a encore la force de recevoir le plaisir ». Le grec porte plus précisément : « qui est encore assez vigoureux pour recevoir de la nourriture ».'
    reason: alternative_reading
lexical_decisions:
- source_word: מה מר זכרך / ὡς πικρόν σου τὸ μνημόσυνόν
  choice: combien ton souvenir est amer
  rationale: Le substantif hébreu זכר et le grec μνημόσυνον désignent le souvenir ou l’évocation de la mort. La formulation conserve l’adresse directe à la mort sans transformer le vers en affirmation générale sur son amertume.
- source_word: לאיש שוקט על מכונתו / ἀνθρώπῳ εἰρηνεύοντι ἐν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: pour l’homme qui vit paisiblement au milieu de ses biens
  rationale: L’hébreu peut évoquer un homme en repos dans sa situation établie, tandis que le grec explicite la paix dont il jouit parmi ce qu’il possède. La traduction exprime cette sécurité matérielle sans faire des biens eux-mêmes la source nécessaire de sa paix.
- source_word: איש שליו / ἀνδρὶ ἀπερισπάστῳ
  choice: pour l’homme tranquille
  rationale: שליו évoque le calme et l’absence de trouble; le grec renforce l’idée d’un homme sans préoccupations pressantes. « Tranquille » reste simple, digne et distinct de la proposition précédente.
- source_word: ומצליח בכל / καὶ εὐοδουμένῳ ἐν πᾶσιν
  choice: qui réussit en tout
  rationale: Les deux témoins présentent une réussite générale. Cette expression est plus naturelle en français moderne que « prospère en toutes choses » tout en conservant l’étendue du propos.
- source_word: ועוד בו חיל לקבל תענוג / καὶ ἔτι ἰσχύοντι ἐπιδέξασθαι τροφήν
  choice: qui a encore la force de goûter aux plaisirs
  rationale: Le texte hébreu parle littéralement de force pour recevoir le plaisir, alors que le grec précise la nourriture. Le texte principal suit l’hébreu et emploie une tournure française naturelle; une note signale le témoignage grec plus spécifique.
theological_decisions:
- issue: Masculin singulier représentatif dans איש
  choice: l’homme … l’homme
  alternative: la personne … celle qui
  rationale: Le texte source emploie explicitement le masculin singulier. Le conserver respecte sa forme représentative sans ajouter une restriction théologique aux seuls hommes.
- issue: Priorité de l’hébreu face à la précision du parallèle grec dans la proposition finale
  choice: goûter aux plaisirs
  alternative: être encore assez vigoureux pour prendre de la nourriture
  rationale: תענוג signifie « plaisir, délice », tandis que τροφή signifie « nourriture ». La différence est réelle et ne doit pas être résolue silencieusement en faveur du grec; la traduction suit donc l’hébreu et documente l’autre lecture.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’apostrophe « Ô mort » et l’exclamation préservent la force poétique du vers. « Biens », « tranquille » et « réussit en tout » sont courants et évitent un registre archaïque; les notes maintiennent visibles les incertitudes et différences entre l’hébreu et le grec.
