  text: And if you are born, you will be born for a curse; and if you die, you will be allotted to a curse.
translation:
  language: fr
  text: Si vous naissez, vous naîtrez pour la malédiction ; et si vous mourez, la malédiction sera votre lot.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γεννηθῆτε / γεννηθήσεσθε
  choice: vous naissez / vous naîtrez
  rationale: Le grec parallèle, qui paraît ici refléter la forme courte suivie par la tradition complète du verset, répète le verbe « naître » ; la répétition est conservée en français.
- source_word: εἰς κατάραν
  choice: pour la malédiction
  rationale: Cette tournure rend la destination ou l'issue funeste exprimée par εἰς sans préciser davantage le rapport causal.
- source_word: μερισθήσεσθε
  choice: sera votre lot
  rationale: Le verbe grec évoque ce qui est attribué en partage. La formulation idiomatique française conserve cette image plutôt que de répéter simplement « être maudit ».
theological_decisions:
- issue: Divergence entre le texte hébreu composite fourni et le parallèle grec
  choice: Traduire la forme courte attestée par le grec et correspondant au texte anglais audité
  alternative: 'Traduire les quatre propositions du texte hébreu fourni : désastre, gémissement, joie éternelle et malédiction'
  rationale: La validation signale une discordance mineure, mais le texte hébreu affiché présente un contenu nettement plus long et probablement composite ou déplacé. Le grec porte précisément Siracide 41.9 et soutient la forme courte transmise dans la couche anglaise auditée. Ce choix évite d'intégrer au verset des éléments dont l'emplacement textuel est incertain.
translation_notes:
  register: Français international moderne, sobre et solennel. Le parallélisme et la répétition sont maintenus, tandis que « sera votre lot » restitue naturellement l'image grecque du partage.
