translation:
  language: fr
  text: Malheur à vous, hommes méchants, qui avez abandonné la loi[a] du Très-Haut[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi se traduire par « instruction » ou « enseignement » ; « loi » correspond ici au sens lié à l’alliance et au grec parallèle.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec parallèle lit : « la loi du Dieu Très-Haut ». Le témoin hébreu principal lit simplement : « la loi du Très-Haut ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אוי / οὐαί
  choice: Malheur
  rationale: L’interjection exprime ici à la fois la dénonciation et l’annonce d’un sort funeste. « Malheur » conserve cette force prophétique mieux que « Hélas ».
- source_word: לכם / ὑμῖν
  choice: à vous
  rationale: Le complément désigne directement les destinataires; « Malheur à vous » est la tournure française naturelle.
- source_word: אנשי רשע / ἄνδρες ἀσεβεῖς
  choice: hommes méchants
  rationale: L’hébreu qualifie ces hommes par leur méchanceté, tandis que le grec souligne leur impiété. « Hommes méchants » suit le témoin hébreu sans exclure la nuance religieuse du parallèle grec.
- source_word: עזבתם / ἐγκατελίπετε
  choice: avez abandonné
  rationale: Le verbe évoque un délaissement délibéré; « abandonner » est actuel et garde la force morale de la rupture.
- source_word: תורת / νόμον
  choice: la loi
  rationale: תורה peut signifier « instruction » ou « enseignement », mais « loi » convient au contexte d’alliance et correspond au grec νόμος.
- source_word: עליון / θεοῦ Ὑψίστου
  choice: le Très-Haut
  rationale: Le texte hébreu porte uniquement le titre divin « Très-Haut »; cette forme brève respecte le témoin principal.
theological_decisions:
- issue: Titre divin עליון par rapport au grec θεοῦ Ὑψίστου
  choice: le Très-Haut
  alternative: Dieu, le Très-Haut
  rationale: Le témoin hébreu, pris comme texte principal, n’exprime pas ici le mot « Dieu ». Le grec explicite l’identité du Très-Haut; cette variante est signalée en note plutôt qu’intégrée au texte.
translation_notes:
  register: Français international moderne, clair et digne. La structure d’interpellation est conservée, ainsi que le masculin explicite des témoins hébreu et grec. Les appels de note sont placés sur les expressions qu’ils documentent.
