  text: Better is a man who hides his folly than a man who hides his wisdom[b][a]; instruction is shame.
translation:
  language: fr
  text: Mieux vaut un homme qui cache sa folie qu’un homme qui cache sa sagesse[b] ; l’instruction est une honte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La fin de l’hébreu est difficile : מוסר בשת signifie littéralement quelque chose comme « instruction/correction de honte ». Le grec ne comporte pas cette formule et s’arrête après « sa sagesse ».'
    reason: textual_variant
  - marker: b
    text: Ou « Mieux vaut une personne qui cache sa folie que quelqu’un qui cache sa sagesse ». Le texte source emploie deux fois le masculin singulier « homme » dans un sens représentatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוב
  choice: Mieux vaut
  rationale: Le contexte proverbial appelle un comparatif, confirmé par le grec κρείσσων. « Mieux vaut » est naturel et concis en français.
- source_word: איש
  choice: un homme
  rationale: L’hébreu emploie le masculin singulier איש, repris dans les deux membres de la comparaison. La note précise sa portée représentative.
- source_word: מצפין
  choice: qui cache
  rationale: Le participe répété désigne celui qui dissimule ou tient caché quelque chose. La répétition française conserve le parallélisme de l’hébreu et du grec.
- source_word: אולתו
  choice: sa folie
  rationale: « Folie » correspond au vocabulaire sapientiel de אולת et concorde avec le grec μωρία.
- source_word: חכמתו
  choice: sa sagesse
  rationale: « Sagesse » rend directement חכמה et est confirmé par le grec σοφία.
- source_word: מוסר בשת
  choice: l’instruction est une honte
  rationale: La formule hébraïque transmise est obscure. Cette traduction rend ses deux éléments sans les omettre, tout en signalant dans une note que leur rapport syntaxique demeure incertain.
