base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/002.yaml
  text: O death, how fitting is your sentence for a man who is needy and lacking strength, stumbling in everything, defiant, and having lost hope.
translation:
  language: fr
  text: Ô mort, que ton arrêt est approprié pour l’homme démuni et sans force, accablé en toutes choses, rebelle et sans espoir !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: האח למות
  choice: Ô mort
  rationale: L’hébreu interpelle directement la mort; « Ô mort » restitue cette apostrophe dans un registre digne et naturel.
- source_word: כי טוב חקיך
  choice: que ton décret convient bien
  rationale: חקיך désigne ici ce qui est fixé ou décrété par la mort; le grec parallèle τὸ κρίμα confirme l’idée d’une sentence ou d’un décret. « Convient bien » exprime la valeur contextuelle de טוב sans suggérer que la mort serait moralement bonne.
- source_word: לאיש אונים וחסר עצמה
  choice: à l’homme démuni et sans force
  rationale: La formulation hébraïque décrit un homme privé de ressources et de vigueur; le grec ἐπιδεομένῳ καὶ ἐλασσουμένῳ ἰσχύϊ appuie cette lecture.
- source_word: איש כושל ינקש בכל
  choice: qui trébuche en tout
  rationale: כושל évoque celui qui chancelle ou échoue. Le texte composite est difficile autour de ינקש, mais le grec περισπωμένῳ περὶ πάντων confirme l’idée d’un homme accablé ou empêtré en toutes choses; la formulation retenue suit de près l’hébreu transmis.
- source_word: סורב
  choice: se rebelle
  rationale: Le terme indique le refus, l’insoumission ou l’obstination; le grec ἀπειθοῦντι confirme l’idée de désobéissance ou de rébellion.
- source_word: ואובד תקוה
  choice: et a perdu tout espoir
  rationale: Traduction directe de l’expression hébraïque, également attestée par le grec ἀπολωλεκότι ὑπομονήν; en contexte, תקוה signifie l’espoir ou l’attente confiante.
theological_decisions:
- issue: La mort est dite « bonne » ou « appropriée » pour l’homme décrit
  choice: « que ton décret convient bien »
  alternative: « que ta sentence est bonne »
  rationale: Cette formulation préserve l’affirmation provocante du texte tout en rattachant טוב à l’adéquation du décret au sort de cet homme, sans transformer le verset en approbation générale de la mort.
- issue: Valeur morale de סורב
  choice: « se rebelle »
  alternative: « est obstiné »
  rationale: Le grec parallèle favorise la notion d’insoumission. Le choix ne précise pas abusivement l’objet de cette rébellion et conserve ainsi l’ambiguïté du texte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’apostrophe initiale et l’exclamation finale conservent la force rhétorique du verset. Aucun marqueur de note n’est nécessaire.
