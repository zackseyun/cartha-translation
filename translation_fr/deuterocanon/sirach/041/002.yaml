review_pass:
  verdict: revise
  source_fidelity: Le texte rend correctement l’apostrophe à la mort, l’idée que son arrêt est approprié au malheureux privé de force, ainsi que la perte d’espérance. Le grec parallèle confirme « arrêt/jugement » (κρίμα), le dénuement et le manque de force, et caractérise l’homme comme accablé par toutes choses. Pour איש כושל ינקש בכל, dont la forme hébraïque composite est difficile, « qui trébuche en tout » suit l’anglais mais est moins idiomatique et moins proche de l’idée d’être entravé/accablé que suggère le grec. סורב est un qualificatif d’insoumission; « est rebelle » le restitue sans ajouter l’idée d’une action ponctuelle.
  naturalness: « Que ton décret convient bien » est grammatical mais raide en français moderne. « Que ton arrêt est approprié » est plus idiomatique dans cette personnification judiciaire de la mort. « Accablé en toutes choses » est naturel tout en conservant l’ouverture du segment hébreu difficile.
  terminology: « Arrêt » exprime de façon claire le חק/κρίμα fixé par la mort, sans imposer une lecture théologique. « Est rebelle » conserve l’ambiguïté quant à l’objet de l’insoumission, mieux que le réfléchi « se rebelle ». Aucun nom propre, terme doctrinal ou ancre de note n’est en cause.
  issues:
  - severity: low
    issue: Formulation française peu naturelle de « ton décret convient bien ».
    rationale: La tournure est compréhensible, mais « ton arrêt est approprié » rend plus directement l’évaluation du jugement de la mort.
  - severity: medium
    issue: « Qui trébuche en tout » réduit un membre textuellement difficile à une image peu naturelle en français.
    rationale: Le grec parallèle décrit quelqu’un d’accablé ou embarrassé au sujet de toutes choses; « accablé en toutes choses » rend cette portée sans prétendre résoudre définitivement le détail hébreu.
  - severity: low
    issue: « Se rebelle » verbalise inutilement un qualificatif.
    rationale: « Est rebelle » correspond plus exactement à l’adjectif/participe transmis et ne spécifie pas un acte de révolte.
  revised_text: Ô mort, que ton arrêt est approprié pour l’homme démuni et sans force, accablé en toutes choses, rebelle et sans espoir !
