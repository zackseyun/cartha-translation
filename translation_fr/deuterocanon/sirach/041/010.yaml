  text: Everything from nothing returns to nothing[a]; so the ungodly go from emptiness to emptiness.
translation:
  language: fr
  text: Tout ce qui vient du néant retourne au néant[a] ; de même, l’impie va du vide au vide.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec dit : « Tout ce qui vient de la terre s’en ira vers la terre ; ainsi, les impies vont de la malédiction à la destruction. » Le grec reflète une forme du verset sensiblement différente de l’hébreu conservé.'
    reason: alternative_reading
lexical_decisions:
- source_word: כל מאפס אל אפס ישוב
  choice: Tout ce qui vient du néant retourne au néant
  rationale: Cette formulation française naturelle conserve le mouvement répété « du néant… au néant » et le sens proverbial de שוב, « retourner ». « Vient » explicite sobrement la relation indiquée par מן sans modifier l’image hébraïque.
- source_word: כן
  choice: de même
  rationale: Introduit clairement la comparaison entre les deux membres du verset.
- source_word: חנף
  choice: l’impie
  rationale: Dans la littérature sapientiale, le terme désigne largement celui qui manque de respect envers Dieu, et non seulement un hypocrite. Le parallèle grec ἀσεβεῖς appuie ce sens moral et religieux.
- source_word: מתהו אל תהו
  choice: va du vide au vide
  rationale: « Vide » rend la vacuité et la vanité possibles de תהו sans imposer le sens cosmologique de « chaos ». La répétition de « vide » préserve la force rhétorique de l’hébreu.
theological_decisions:
- issue: Sens de חנף
  choice: l’impie
  alternative: l’hypocrite ; celui qui est sans Dieu
  rationale: « L’impie » préserve la portée morale et religieuse générale du mot, sans la réduire à l’hypocrisie sociale. Le singulier de l’hébreu est maintenu.
- issue: Rapport entre les témoins hébreu et grec
  choice: Traduire l’hébreu dans le texte principal et signaler la forme grecque divergente en note
  alternative: Adopter dans le texte principal « de la terre à la terre » et « de la malédiction à la destruction », ou fusionner les deux formes
  rationale: L’hébreu conservé est ici le témoin principal. Le grec présente une forme substantiellement différente du verset ; elle doit être documentée sans harmonisation.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme et les répétitions de l’hébreu sont conservés, avec une syntaxe immédiatement compréhensible.
