revisions:
- from: Les enfants d’un père mauvais sont maudits[a], car, à cause de lui, ils sont couverts de honte.
  to: Les enfants maudissent un père méchant[a], car, à cause de lui, ils sont exposés à l’opprobre.
  rationale: 'La révision rétablit la relation syntaxique attestée par le contexte grec et plausible dans l’hébreu poétique : les enfants réagissent contre le père méchant, dont la conduite les voue à l’opprobre. Elle conserve dans le texte principal la force de l’hébreu (« maudissent »), tout en signalant en note la nuance moins forte du grec (« reprochent »).'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T11:01:27Z'
review_pass:
  verdict: revise
  source_fidelity: 'La phrase française inverse probablement les rôles syntaxiques. Dans l’hébreu poétique, אב רשע est placé en tête comme objet : « un père méchant, un enfant le maudit ». Le verbe יקוב est le plus naturellement actif ici, et ילד est le sujet, à valeur collective. Cette lecture est confirmée de manière nette par le grec, où les enfants se plaignent/reprochent leur père impie et seront eux-mêmes exposés à l’opprobre à cause de lui. La version proposée (« sont maudits ») suit l’analyse passive retenue dans la piste anglaise, mais elle ne rend pas adéquatement cette construction ni le parallèle grec.'
  naturalness: « Les enfants maudissent un père méchant, car, à cause de lui, ils sont exposés à l’opprobre » est idiomatique, sobre et approprié au registre sapientiel. « Exposés à l’opprobre » rend l’idée de honte publique sans suggérer qu’ils seraient eux-mêmes une honte.
  terminology: '« Père méchant » rend naturellement אב רשע sans restreindre le terme à un sens confessionnel. « Maudissent » conserve la force possible de נקב; « opprobre » rend חרפה, qui vise la disgrâce ou le déshonneur social. La note doit corriger le sens du grec : il ne dit pas que les enfants sont d’abord « blâmés », mais qu’ils reprochent/se plaignent de leur père.'
  issues:
  - severity: high
    issue: Inversion des agents dans la proposition initiale
    rationale: Le projet comprend יקוב comme un passif dont les enfants seraient le patient. Or l’ordre poétique de l’hébreu permet, et le grec parallèle confirme, la lecture où l’enfant/les enfants maudissent ou reprochent leur père méchant à cause du déshonneur qu’il leur attire.
  - severity: high
    issue: Note de bas de page grecque inexacte
    rationale: Le grec parallèle présente les enfants comme ceux qui reprochent/se plaignent de leur père impie; il ne les décrit pas simplement comme « blâmés ». Il ajoute qu’ils subiront l’opprobre à cause de lui.
  - severity: medium
    issue: « Sont couverts de honte » affaiblit et déplace la construction finale
    rationale: La finale vise l’opprobre auquel les enfants sont livrés à cause du père. « Sont exposés à l’opprobre » exprime mieux cette conséquence sociale et conserve la relation causale.
  revised_text: Les enfants maudissent un père méchant[a], car, à cause de lui, ils sont exposés à l’opprobre.
  revised_footnotes:
