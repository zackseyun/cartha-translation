translation:
  language: fr
  text: Les enfants maudissent un père méchant[a], car, à cause de lui, ils sont exposés à l’opprobre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec parallèle dit : « Les enfants reprochent à un père impie, car, à cause de lui, ils seront exposés à l’opprobre. » L’hébreu peut employer le verbe « maudire », plus fort, tandis que le grec exprime le reproche.'
    reason: alternative_reading
lexical_decisions:
- source_word: אב רשע
  choice: un père mauvais
  rationale: Le syntagme hébreu est singulier et désigne explicitement le père. « Mauvais » exprime naturellement en français courant la faute morale portée par רשע, sans ajouter une nuance confessionnelle.
- source_word: יקוב
  choice: sont maudits
  rationale: Le sens imprécatoire de נקב paraît le mieux rendre l’hébreu difficile. Le présent convient à la portée générale de la maxime. Le grec, qui met plutôt l’accent sur le blâme, est signalé en note.
- source_word: ילד
  choice: les enfants
  rationale: Le nom hébreu au singulier a ici une valeur collective, confirmée par le pluriel τέκνα du parallèle grec.
- source_word: כי בגללו
  choice: car, à cause de lui
  rationale: Cette formulation conserve le lien causal explicite et le pronom de l’hébreu tout en restant claire et naturelle.
- source_word: לחרפה
  choice: ils sont couverts de honte
  rationale: חרפה évoque la honte et l’opprobre publics. Cette tournure française rend plus naturellement l’état honteux ou déshonorant exprimé par la construction hébraïque que le calque « ils sont pour la honte ».
theological_decisions:
- issue: Faut-il privilégier la malédiction de l’hébreu ou le blâme du parallèle grec ?
  choice: Le texte principal retient « sont maudits » conformément au témoin hébreu.
  alternative: 'Le grec peut se rendre ainsi : « Les enfants d’un père impie sont blâmés, car à cause de lui ils seront couverts de honte. »'
  rationale: Lorsque l’hébreu du Siracide est conservé avec une bonne assurance, il constitue le témoin principal. La divergence de nuance du grec demeure toutefois pertinente et est préservée en note plutôt que résolue par harmonisation.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation évite le calque peu naturel « sont pour la honte », tout en conservant la causalité et la tension entre le témoin hébreu et le parallèle grec.
