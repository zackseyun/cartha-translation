    text: 'Le grec parallèle dit : « Les enfants reprochent à un père impie, car, à cause de lui, ils seront exposés à l’opprobre. » L’hébreu peut employer le verbe « maudire », plus fort, tandis que le grec exprime le reproche.'
    reason: alternative_reading
