  source_fidelity: Le brouillon conserve bien le parallélisme du texte hébreu et l’opposition entre des jours limités et des jours sans nombre. Toutefois, « Le bien de la vie dure un nombre limité de jours » attribue maladroitement la durée au « bien » et ne rend pas naturellement le tour proverbial. Une légère révision permet de faire entendre clairement le contraste temporel sans ajouter de lecture doctrinale.
