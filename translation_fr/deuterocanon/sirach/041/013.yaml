  terminology: « Bon nom » garde l’image du « nom » tout en exprimant sa valeur de réputation. La note lexicale demeure utile pour éviter une compréhension réduite au prénom ou au nom propre. La note grecque doit être ancrée au second membre, auquel elle se rapporte.
