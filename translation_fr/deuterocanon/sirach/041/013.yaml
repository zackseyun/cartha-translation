  text: The good of life is a limited number of days[b][a], but the good of a name is days without number.
translation:
  language: fr
  text: Le bonheur de vivre ne dure qu’un nombre limité de jours, mais un bon nom[a] dure des jours sans nombre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, le « nom » désigne la réputation ou l’honneur dont on garde le souvenir, et non simplement un nom personnel.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec dit : « et un bon nom subsistera pour toujours ».'
    reason: alternative_reading
lexical_decisions:
- source_word: טובת
  choice: le bien de
  rationale: Conserve dans les deux membres le groupe nominal hébreu et son parallélisme, sans introduire un comparatif absent du texte.
- source_word: חי
  choice: la vie
  rationale: Le sens abstrait « vie » convient au contraste avec la durée d’un nom et concorde avec le grec ζωῆς.
- source_word: ימי מספר
  choice: un nombre limité de jours
  rationale: Rend clairement l’idiome littéral « des jours de nombre », c’est-à-dire des jours comptés et limités.
- source_word: שם
  choice: nom
  rationale: Préserve l’image concrète de l’hébreu; ici, le nom désigne la réputation ou l’honneur dont on garde le souvenir.
- source_word: ימי אין מספר
  choice: des jours sans nombre
  rationale: Reproduit de près l’expression hébraïque et maintient son opposition formelle avec les jours comptés de la vie.
theological_decisions:
- issue: Rapport entre l’idiome hébreu et l’explicitation grecque
  choice: Conserver dans le texte principal l’opposition hébraïque entre une vie aux jours limités et un nom dont les jours sont sans nombre.
  alternative: « Un bon nom subsistera pour toujours. »
  rationale: Le témoin hébreu, ici préservé avec une confiance élevée, est prioritaire. Le grec explicite la portée temporelle du second membre; cette lecture est signalée en note sans remplacer l’image hébraïque.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le verbe « dure », employé dans les deux membres, rend la relation implicite en hébreu tout en conservant le parallélisme. Les marqueurs suivent immédiatement les expressions qu’ils éclairent.
