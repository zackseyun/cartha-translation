  text: Be concerned for your name, for it will go with you more than a thousand stores of wisdom.
translation:
  language: fr
  text: Prends soin de ton nom, car il t’accompagnera plus que des milliers de trésors de sagesse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פחד על
  choice: Soucie-toi de
  rationale: Dans ce contexte, l’expression appelle à veiller avec sérieux sur son nom; «soucie-toi de» est naturel en français et rejoint le parallèle grec φρόντισον περὶ.
- source_word: שם
  choice: réputation
  rationale: Le «nom» désigne ici le renom ou la réputation qui subsiste; rendre directement ce sens évite en français une lecture limitée au nom propre.
- source_word: ילוך
  choice: t’accompagnera
  rationale: Le verbe exprime ce qui va avec la personne ou lui demeure attaché; «t’accompagnera» conserve cette image sans la surinterpréter.
- source_word: מאלפי
  choice: mieux que mille
  rationale: La préposition מן établit ici une comparaison de valeur; «mieux que» produit une formulation française claire tout en gardant le nombre.
- source_word: אוצרות חכמה
  choice: réserves de sagesse
  rationale: «Réserves» conserve l’image de ressources accumulées, tandis que «de sagesse» suit le texte hébreu attesté, malgré la variante grecque «d’or».
theological_decisions:
- issue: Valeur durable du nom
  choice: Traduire שם par «réputation» sans préciser si elle survit après la mort.
  alternative: «nom» ou «bonne réputation»
  rationale: Le contexte valorise le renom, mais le verset ne qualifie pas explicitement ce nom de «bon» et ne développe pas ici une doctrine précise de l’au-delà.
- issue: Divergence entre l’hébreu et le grec
  choice: Suivre l’hébreu «réserves de sagesse».
  alternative: Suivre le grec «grands trésors d’or».
  rationale: L’hébreu fourni est la source principale et sa lecture est donnée avec une confiance élevée; le grec sert ici de témoin parallèle, non de remplacement.
translation_notes:
  register: Français moderne, direct et digne. L’impératif au singulier conserve l’adresse sapientielle personnelle. Aucun marqueur de note n’est requis.
