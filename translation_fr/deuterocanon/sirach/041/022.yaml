  text: for a friend[a], over words of reproach; and after giving a gift to a brother, do not reproach him.
translation:
  language: fr
  text: — d’un ami, à propos de paroles de reproche[a] ; et après avoir fait un don à un frère, ne lui adresse pas de reproches.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu de ce membre est très concis et elliptique. Le grec porte : « de la part d’amis, au sujet de paroles de reproche » ; le verbe sous-entendu dépend probablement de la liste des conduites dont il faut avoir honte.'
    reason: textual_variant
lexical_decisions:
- source_word: מאוהב
  choice: à l’égard d’un ami
  rationale: Le nom אוהב désigne ici un ami. La préposition מן s’inscrit dans la série elliptique des conduites à éviter ou dont il faut avoir honte ; « à l’égard de » restitue prudemment la relation visée sans inventer un verbe précis.
- source_word: על דברי חרפה
  choice: au sujet de paroles insultantes
  rationale: על introduit le sujet ou le motif, tandis que דברי חרפה désigne des paroles porteuses d’insulte ou d’opprobre. Cette formulation conserve le caractère elliptique de l’hébreu.
- source_word: ומאחרי מתת
  choice: et après avoir fait un don
  rationale: מאחרי exprime la postériorité et מתת peut désigner le don ou l’acte de donner. La tournure verbale donne en français une syntaxe naturelle.
- source_word: אח
  choice: à un frère
  rationale: Le sens littéral « frère » est conservé, tout en laissant ouverte son extension possible à un proche ou à un membre de la communauté.
- source_word: מנאץ
  choice: ne lui adresse pas de reproches
  rationale: La forme hébraïque est très concise et difficile. Le grec μὴ ὀνείδιζε explicite une interdiction de reprocher ou d’humilier quelqu’un après lui avoir donné. La formulation française exprime ce sens sans employer le plus fort « blasphémer ».
theological_decisions:
- issue: Recours au grec pour éclairer une ligne hébraïque elliptique
  choice: Conserver l’ellipse dans le premier membre, mais expliciter dans le second l’interdiction de faire des reproches après un don.
  alternative: Rendre toute la ligne de façon fragmentaire, ou suppléer aussi dans le premier membre une interdiction complète.
  rationale: L’hébreu conservé demeure la source principale, mais sa syntaxe est comprimée et le dossier signale une divergence majeure. Le grec atteste clairement, dans le second membre, « après avoir donné, ne fais pas de reproches ». Le premier membre reste plus ambigu et ne doit pas être artificiellement résolu.
translation_notes:
  register: Français moderne, digne et accessible. Le point-virgule maintient le parallélisme de la maxime. L’ambiguïté réelle du premier membre est signalée plutôt que résolue silencieusement.
