  text: Do not fear the decree of your death[c][b][a]; remember that those before and those after are with you.
translation:
  language: fr
  text: Ne crains pas la mort qui t’est assignée[a][c] ; souviens-toi que ceux qui t’ont précédé et ceux qui te suivront sont avec toi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu se comprend littéralement, de façon condensée, comme : « Ne crains pas la mort, ton lot fixé. » Le grec porte : « Ne crains pas le jugement de la mort. »'
    reason: alternative_reading
  - marker: b
    text: L’expression signifie vraisemblablement que ceux qui ont vécu avant toi et ceux qui vivront après toi partagent la même condition mortelle.
    reason: lexical_alternative
  - marker: c
    text: À cet endroit, le texte hébreu de la guéniza du Caire est plus complet que le témoin fragmentaire de Massada ; le grec aide à comprendre la formule hébraïque condensée concernant la mort.
    reason: textual_variant
lexical_decisions:
- source_word: אל תפחד
  choice: Ne crains pas
  rationale: L’interdiction hébraïque avec פחד appelle une exhortation directe contre la peur. Cette formulation est concise, digne et naturelle en français moderne.
- source_word: ממות חקיך
  choice: la mort qui t’est assignée
  rationale: L’hébreu associe de manière condensée « mort » à חקיך, terme pouvant évoquer ce qui est fixé, décrété ou attribué. La formulation française conserve l’idée d’une mort assignée sans imposer l’image plus judiciaire du grec κρίμα θανάτου.
- source_word: זכור
  choice: souviens-toi
  rationale: Impératif direct et idiomatique, adapté au registre sapientiel.
- source_word: ראשנים ואחרנים
  choice: ceux qui sont venus avant toi et ceux qui viendront après toi
  rationale: Cette expression rend clairement l’opposition temporelle entre les premiers et les derniers sans préciser indûment qu’il s’agit de « générations ». Le complément « avant toi / après toi » est confirmé par le parallèle grec.
- source_word: עמך
  choice: sont avec toi
  rationale: Traduction formellement proche de l’hébreu, qui laisse au lecteur l’image de la condition commune plutôt que de l’expliciter dans le corps du texte.
theological_decisions:
- issue: Expression de l’objet de la crainte face à la formulation hébraïque condensée et au parallèle grec
  choice: la mort qui t’est assignée
  alternative: le décret de la mort ; le jugement de la mort ; la mort
  rationale: Cette traduction donne la priorité à l’hébreu tout en tenant compte du grec, qui comprend la phrase en termes de jugement ou de décret. Elle préserve l’idée d’une échéance fixée sans transformer explicitement Dieu en sujet du décret ni réduire la phrase à la seule peur de mourir.
- issue: Sens de « ceux d’avant et ceux d’après sont avec toi »
  choice: Conserver l’image « sont avec toi » dans le texte
  alternative: partagent le même sort que toi
  rationale: L’explicitation du destin mortel commun est probable dans le contexte, mais l’hébreu reste plus imagé. Le texte principal garde donc cette tension, tandis que la note en indique le sens vraisemblable.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier conserve l’adresse personnelle du texte sapientiel. La syntaxe reste accessible, tout en maintenant l’image énigmatique « sont avec toi » et en signalant les difficultés textuelles dans les notes.
