base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/008/011.yaml
  text: Do not despise even his ordinary conversation[a], for from him you will learn instruction for standing before rulers.
translation:
  language: fr
  text: Ne méprise même pas ses conversations ordinaires[a], car c’est auprès de lui que tu apprendras comment te tenir devant des dirigeants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle porte : « Ne te lève pas en présence d’un homme insolent, de peur qu’il ne se poste comme en embuscade contre ta bouche. » La tradition grecque diffère ici considérablement de l’hébreu conservé.'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׂיחוֹת חוֹל
  choice: conversations ordinaires
  rationale: שִׂיחוֹת désigne des propos ou des conversations, et חוֹל évoque ici ce qui est courant, quotidien, par opposition à ce qui est élevé ou formel. « Conversations ordinaires » évite de suggérer des paroles profanes ou moralement mauvaises.
- source_word: תִבְזֶה
  choice: méprise
  rationale: Le verbe exprime le fait de tenir pour négligeable ou digne de dédain. « Mépriser » en rend directement la force.
- source_word: לְהִתְיַצֵּב לִפְנֵי שָׂרִים
  choice: comment te tenir devant des dirigeants
  rationale: L’expression décrit la manière de se présenter et de se comporter en présence de personnages investis d’autorité. Cette formulation française exprime clairement la portée pratique de l’enseignement.
- source_word: לֶקַח
  choice: tu apprendras
  rationale: לֶקַח désigne un enseignement reçu ou une leçon. Avec le verbe תלמד, le français naturel « tu apprendras » transmet l’idée sans la redondance de « apprendre un enseignement ».
- source_word: מִמֶּנּוּ
  choice: auprès de lui
  rationale: Le pronom masculin singulier est conservé. « Auprès de lui » convient naturellement à l’idée d’apprendre par la fréquentation et l’écoute de cette personne.
theological_decisions:
- issue: Choix entre le témoin hébreu et la tradition grecque divergente
  choice: Le texte principal traduit l’hébreu conservé.
  alternative: 'Le grec porte : « Ne te lève pas de devant un homme insolent, de peur qu’il ne se place en embuscade contre ta bouche. »'
  rationale: Puisque le texte hébreu est ici disponible, il demeure la source principale. Le grec diffère profondément et doit être signalé comme une autre tradition textuelle plutôt que combiné artificiellement avec l’hébreu.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier correspond à l’adresse sapientielle hébraïque. « Dirigeants » rend שָׂרִים sans limiter le terme à des princes héréditaires.
