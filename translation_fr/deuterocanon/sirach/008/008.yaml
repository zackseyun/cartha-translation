    rationale: « Ne couvre pas de honte un homme âgé » est grammatical, mais son ordre et son registre sont marqués. « Ne fais pas honte à un homme âgé » est l’expression moderne usuelle et garde la portée causative de תְּבַיֵּשׁ.
  - severity: low
    issue: Formulation de l’exhortation dans la note grecque
    rationale: « Fréquente leurs proverbes » sonne moins naturel et rend imparfaitement ἀναστρέφου. « Attache-toi à leurs proverbes » exprime mieux l’idée de s’y appliquer. « Comment servir les grands » rend explicitement l’interrogatif implicite de la construction grecque.
