  source_fidelity: 'Le texte principal suit fidèlement l’hébreu : אַל תְּבַיֵּשׁ interdit de faire subir la honte à un homme âgé, et תִמָּנֶה מִזְּקֵנִים exprime le fait d’être compté parmi les anciens. La note signale correctement la tradition grecque substantiellement divergente, sans l’intégrer au texte principal.'
  naturalness: « Ne couvre pas de honte » est compréhensible, mais reste une tournure peu idiomatique en français international moderne. « Ne fais pas honte à » est plus naturel tout en conservant le sens causatif. Dans la note, « attache-toi à leurs proverbes » rend plus naturellement l’invitation grecque à s’y appliquer.
  terminology: « Homme âgé » et « anciens » conviennent au registre et maintiennent la distinction entre l’individu âgé et le groupe des aînés. « Instruction » rend bien παιδεία. « Comment servir les grands » est plus direct et plus fidèle que « la manière de servir les grands ».
  issues:
