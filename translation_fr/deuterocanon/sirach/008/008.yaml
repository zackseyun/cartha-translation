  text: Do not shame an old man[a]; remember that you too will be numbered among the elders.
translation:
  language: fr
  text: Ne fais pas honte à un homme âgé[a] ; souviens-toi que toi aussi, tu seras compté parmi les anciens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La tradition grecque porte à la place : « Ne néglige pas le discours des sages et attache-toi à leurs proverbes ; car auprès d’eux tu apprendras l’instruction et comment servir les grands. » Le témoin hébreu conserve ici une exhortation différente au respect des personnes âgées.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תְּבַיֵּשׁ
  choice: Ne couvre pas de honte
  rationale: 'Le piel de בוש a ici une valeur causative : faire éprouver la honte ou exposer au déshonneur. Cette tournure française exprime clairement l’action exercée sur autrui.'
- source_word: אֱנוֹשׁ יָשִׁישׁ
  choice: un homme âgé
  rationale: אֱנוֹשׁ désigne un être humain ou un homme, qualifié ici par יָשִׁישׁ, « âgé ». La formulation conserve le masculin singulier concret de l’hébreu tout en restant naturelle en français moderne.
- source_word: זְכֹר
  choice: souviens-toi
  rationale: L’impératif de זכר signifie directement « souviens-toi » et maintient le lien exhortatif entre le respect dû à l’homme âgé et l’avenir du destinataire.
- source_word: תִמָּנֶה
  choice: tu seras compté
  rationale: La forme passive de מנה signifie être compté ou recensé. « Tu seras compté » préserve cette voix passive et l’idée d’intégrer un groupe.
- source_word: מִזְּקֵנִים
  choice: parmi les anciens
  rationale: La préposition מן peut ici marquer l’appartenance à un ensemble. « Les anciens » rend זְקֵנִים avec sa nuance à la fois liée à l’âge et au statut social.
theological_decisions:
- issue: Masculin singulier de l’objet et du destinataire
  choice: Conserver « un homme âgé » et le tutoiement singulier.
  alternative: Employer « une personne âgée » ou reformuler au pluriel de manière inclusive.
  rationale: L’hébreu présente un homme âgé concret et une adresse au singulier. La traduction garde cette forme sans restreindre la portée générale de l’exhortation.
- issue: Divergence substantielle entre l’hébreu et la tradition grecque
  choice: Suivre le témoin hébreu dans le texte principal et signaler le grec en note.
  alternative: Adopter le texte grec sur les propos des sages et leurs proverbes.
  rationale: Le texte hébreu conservé est clair et bénéficie ici d’une confiance élevée. Le grec atteste une admonition différente, qui ne doit pas être fusionnée silencieusement avec l’hébreu.
translation_notes:
  register: Français international moderne, digne et direct. « Couvre pas de honte » évite le possible contresens de « n’aie pas honte d’un homme âgé » ; « anciens » conserve la dimension sociale de זְקֵנִים.
