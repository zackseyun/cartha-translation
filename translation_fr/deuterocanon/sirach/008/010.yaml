  text: Do not abandon the discourse of the wise[b][a], and occupy yourself with their riddles.
translation:
  language: fr
  text: Ne délaisse pas les propos des sages, et applique-toi à leurs énigmes.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe hébreu employé ici est rare. Autre traduction possible : « consacre-toi à étudier leurs énigmes » ; l’idée est de s’investir activement dans les paroles difficiles des sages.'
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec présente ici une leçon très différente : « N’attise pas les braises d’un pécheur, de peur d’être brûlé par le feu de sa flamme. » Il témoigne d’une tradition textuelle sensiblement différente de celle de l’hébreu conservé.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּטֹּשׁ
  choice: Ne délaisse pas
  rationale: Le verbe נטש signifie quitter, délaisser ou abandonner. « Ne délaisse pas » exprime naturellement l’idée de ne pas se détourner volontairement de ces paroles.
- source_word: שִׂיחַת חֲכָמִים
  choice: les propos des sages
  rationale: שיחה peut désigner la parole, l’entretien ou le discours réfléchi. « Les propos des sages » reste proche de l’hébreu tout en étant plus naturel en français actuel que « le discours des sages » dans cette exhortation.
- source_word: וּבְחִידֹתֵיהֶם
  choice: dans leurs énigmes
  rationale: חידה désigne une énigme ou une parole difficile à comprendre. « Énigmes » conserve directement l’image propre à la littérature de sagesse.
- source_word: הִתְרַפֵּשׂ
  choice: plonge-toi
  rationale: Cette forme rare appelle à une implication active et profonde. « Plonge-toi » rend cette idée de pleine immersion dans les paroles difficiles, tout en signalant l’incertitude lexicale en note.
