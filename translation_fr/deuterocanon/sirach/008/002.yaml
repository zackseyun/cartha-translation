  text: Do not quarrel with one harder than you, lest you fall into his hand.
translation:
  language: fr
  text: 'Ne te querelle pas avec quelqu’un de plus dur que toi : pourquoi tomberais-tu entre ses mains[a] ?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans sa main » ; c’est-à-dire sous son pouvoir.'
    reason: La formulation française idiomatique emploie le pluriel et peut masquer la forme exacte de l’image hébraïque.
  - marker: b
    text: 'Le texte grec présente ici une forme différente et plus longue : « Ne te querelle pas avec un homme riche, de peur qu’il n’oppose son poids contre toi ; car l’or en a perdu beaucoup et a détourné le cœur des rois. »'
    reason: La tradition grecque diverge fortement du texte hébreu quant à l’adversaire visé et comporte deux propositions supplémentaires. « Son poids » rend l’image grecque sans imposer une interprétation telle que « influence ».
lexical_decisions:
- source_word: קָשֶׁה
  choice: plus dur
  rationale: Le terme hébreu signifie fondamentalement « dur » et peut évoquer une personne rude, inflexible ou redoutable. « Plus dur » conserve cette amplitude sans réduire le sens à la seule force physique ou à la richesse.
- source_word: תָּרִיב
  choice: te querelle pas
  rationale: Le verbe ריב désigne une dispute, une querelle ou un affrontement. La tournure pronominale est naturelle en français et convient au contexte sapientiel.
- source_word: לָמָּה תִפּוֹל
  choice: pourquoi tomberais-tu
  rationale: Le texte hébreu formule une question avec לָמָּה, « pourquoi ? », plutôt qu’une proposition finale signifiant simplement « de peur que ». Le conditionnel français exprime naturellement la conséquence envisagée.
- source_word: בְּיָדוֹ
  choice: entre ses mains
  rationale: Littéralement « dans sa main ». L’expression française « tomber entre ses mains » préserve l’image tout en exprimant clairement le fait de tomber sous le pouvoir de quelqu’un.
theological_decisions:
- issue: Nature de la supériorité de l’adversaire
  choice: plus dur que toi
  alternative: plus fort que toi / plus puissant que toi
  rationale: L’hébreu קָשֶׁה ne précise ni richesse ni autorité politique et ne désigne pas exclusivement la force physique. La traduction retenue maintient cette indétermination.
- issue: Rapport avec la forme grecque longue
  choice: Traduire le texte hébreu fourni et signaler la divergence en note
  alternative: 'Suivre le grec : « Ne te querelle pas avec un homme riche… »'
  rationale: La source hébraïque est ici donnée avec une confiance élevée et constitue le texte de départ. Le grec témoigne toutefois d’une forme sensiblement différente, qu’il convient de ne pas dissimuler.
translation_notes:
  register: Français moderne, direct et digne, avec la concision propre à une maxime sapientielle. « Plus dur » est volontairement large ; « plus coriace » serait plus familier, tandis que « plus puissant » interpréterait davantage le texte.
