  text: Do not go with a cruel man[a], lest you add weight to your own trouble.
translation:
  language: fr
  text: Ne va pas avec un homme cruel[a], de peur d’alourdir ton propre malheur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente une lecture très différente : « Ne révèle pas ton cœur à tout homme, et ne le laisse pas te rendre une faveur. » Les témoins hébreu et grec divergent donc substantiellement ici. En outre, le texte hébreu transmis porte אִם, « si », là où le contexte paraît demander עִם, « avec ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם אַכְזָרִי
  choice: avec un homme cruel
  rationale: Dans ce contexte, אִם est compris comme une graphie de עִם, « avec ». אַכְזָרִי désigne une personne cruelle ou sans pitié; le masculin singulier est conservé par « un homme cruel ».
- source_word: אַל תֵּלֵךְ
  choice: Ne va pas
  rationale: La traduction garde le sens concret de הלך, « aller, marcher », tout en formant avec « avec » une expression française naturelle.
- source_word: פֶּן
  choice: de peur de
  rationale: פֶּן introduit la conséquence indésirable que l’avertissement cherche à éviter. « De peur de » en restitue clairement la force.
- source_word: תַּכְבִּיד
  choice: alourdir
  rationale: Le hifil de כבד signifie « rendre lourd, alourdir ». Ce choix conserve l’image hébraïque du poids sans produire une tournure artificielle.
- source_word: אֶת רָעָתֶךָ
  choice: ton propre malheur
  rationale: רָעָה peut désigner le mal, le tort ou le malheur. Ici, « malheur » exprime naturellement le dommage qui retomberait sur la personne avertie; « propre » souligne le suffixe possessif de deuxième personne.
theological_decisions:
- issue: Divergence substantielle entre le témoin hébreu et le parallèle grec
  choice: Le texte principal traduit le témoin hébreu conservé; le grec figure en note comme variante.
  alternative: 'Suivre le grec : « Ne révèle pas ton cœur à n’importe qui, et qu’il ne te rende pas la pareille. »'
  rationale: Puisque le texte hébreu est conservé avec un degré élevé de confiance, il sert de texte principal. Le grec témoigne toutefois d’une tradition très différente, qui doit être signalée sans tenter d’harmoniser les deux lectures.
- issue: Ambiguïté graphique de אִם au début du texte hébreu
  choice: Comprendre אִם comme une graphie ou une transmission de עִם, « avec ».
  alternative: Traduire littéralement אִם par « si », ce qui donnerait une proposition française et hébraïque difficilement intelligible dans sa forme actuelle.
  rationale: La syntaxe de l’avertissement et le complément personnel attendu après « aller » favorisent nettement le sens « avec », tout en justifiant de signaler la difficulté textuelle.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier rend l’adresse hébraïque à la deuxième personne. « Alourdir ton propre malheur » conserve l’image du poids tout en restant compréhensible.
