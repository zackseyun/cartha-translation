  text: Do not prosper in the inheritance of a wicked man[a], lest you be burned by the sparks of his fire.
translation:
  language: fr
  text: Ne prospère pas grâce à l’héritage d’un homme mauvais[a], de peur d’être brûlé par les étincelles de son feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin grec présente ici une maxime différente : « N’engage pas de procès contre un juge, car on jugera en sa faveur selon son rang. » Le texte hébreu de la Gueniza du Caire met plutôt en garde contre le fait de prospérer grâce à l’héritage d’un homme mauvais.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּצְלַח
  choice: Ne prospère pas
  rationale: Le verbe צלח exprime couramment la réussite ou la prospérité. Cette formulation conserve la tournure inhabituelle de l’hébreu sans la réduire à une simple interdiction de prendre part à l’héritage.
- source_word: בְּנַחֲלַת
  choice: grâce à l’héritage
  rationale: נחלה désigne un héritage, un patrimoine ou un domaine héréditaire. Dans ce contexte, la préposition בְּ peut indiquer la sphère ou le moyen de la réussite; « grâce à » rend naturellement en français l’idée de tirer sa prospérité de cet héritage, tout en laissant ouverte la nature exacte de l’implication.
- source_word: רָשָׁע
  choice: d’un homme mauvais
  rationale: Le substantif masculin singulier désigne ici un individu représentatif qui agit mal. « Homme mauvais » est clair, actuel et conforme à la forme grammaticale.
- source_word: פֶּן תְּבֹעַר
  choice: de peur d’être brûlé
  rationale: La construction introduite par פן exprime la conséquence redoutée, et בער évoque ici le fait d’être embrasé ou consumé.
- source_word: בִּשְׁבִיב
  choice: par les étincelles
  rationale: שביב peut désigner une étincelle, une flamme ou un éclat de feu. Le pluriel français donne naturellement la valeur collective du terme et préserve l’image vive du danger.
- source_word: אִשּׁוֹ
  choice: de son feu
  rationale: Le suffixe masculin singulier renvoie naturellement à l’homme mauvais. La métaphore reste volontairement ouverte quant à la nature précise du danger issu de lui ou de ses biens.
theological_decisions:
- issue: Divergence substantielle entre les témoins hébreu et grec
  choice: Traduire le texte hébreu conservé comme texte principal et signaler la leçon grecque en note.
  alternative: 'Suivre le grec : « N’engage pas de procès contre un juge, car on jugera en sa faveur selon son rang. »'
  rationale: Puisque l’hébreu de Ben Sira est conservé ici avec une confiance élevée, il a priorité. Le grec transmet une maxime entièrement différente et ne doit donc pas être harmonisé silencieusement avec l’hébreu.
translation_notes:
  register: Français international moderne, direct et digne. L’impératif au singulier correspond au style personnel des maximes sapientielles. La formulation conserve l’étrangeté suggestive de l’hébreu et sa métaphore du feu, sans expliquer excessivement le lien entre l’héritage et le danger.
