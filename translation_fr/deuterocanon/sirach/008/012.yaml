  text: Do not despise hearing from those who have returned[b][a], who have heard from their fathers.
translation:
  language: fr
  text: Ne dédaigne pas d’écouter ceux qui reviennent[b], eux qui l’ont entendu de leurs pères.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La tradition grecque porte : « Ne prête pas à un homme plus fort que toi ; et si tu lui prêtes, considère cette somme comme perdue. » Elle paraît représenter une autre tradition textuelle de ce verset.'
    reason: textual_variant
  - marker: b
    text: Ou « ceux qui se repentent » ou « ceux qui sont revenus ». Le mot hébreu désigne ceux qui reviennent, mais sa nuance exacte est incertaine ici.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּמְאַס
  choice: Ne méprise pas
  rationale: Rend directement l’interdiction et conserve la forte idée de dédain portée par le verbe hébreu.
- source_word: בִּשְׁמִיעַת
  choice: l’écoute de
  rationale: Reproduit la construction nominale hébraïque tout en restant intelligible en français; le contexte suggère le fait d’écouter ce que disent les personnes mentionnées.
- source_word: שָׁבִים
  choice: ceux qui reviennent
  rationale: Conserve le sens lexical large de personnes qui reviennent, sans trancher entre un retour concret et un retour moral ou religieux.
- source_word: אֲשֶׁר שָׁמְעוּ
  choice: eux qui ont entendu
  rationale: Le relatif est repris par « eux qui » afin de rendre plus clairement la proposition descriptive, tandis que le passé composé exprime naturellement l’acquis transmis.
- source_word: מֵאֲבֹתָם
  choice: leurs pères
  rationale: Suit l’expression hébraïque littérale et préserve l’image de la transmission reçue des pères, sans la généraliser silencieusement en « ancêtres ».
theological_decisions:
- issue: Divergence complète entre le texte hébreu conservé et la tradition grecque de Siracide 8.12
  choice: Le texte hébreu constitue le texte principal.
  alternative: « Ne prête pas à un homme plus fort que toi; et si tu lui prêtes, considère cette somme comme perdue. »
  rationale: Puisque l’hébreu est conservé avec une bonne assurance, il est prioritaire. Le grec témoigne ici d’une autre sentence plutôt que d’une simple variante et doit donc être signalé en note, sans harmonisation.
- issue: Sens de שָׁבִים
  choice: ceux qui reviennent
  alternative: ceux qui se repentent / ceux qui sont revenus
  rationale: Le participe peut désigner des personnes qui reviennent et éventuellement celles qui se détournent de leur conduite passée. Le contexte ne permet pas d’imposer la nuance religieuse de repentance.
translation_notes:
  register: Français moderne, sobre et sapiential. La formulation reste volontairement proche de la syntaxe hébraïque; « l’écoute de » maintient une légère ambiguïté sur le contenu entendu, et « leurs pères » conserve la transmission intergénérationnelle explicite.
