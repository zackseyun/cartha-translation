review_pass:
  verdict: revise
  source_fidelity: 'Le texte principal rend correctement les éléments essentiels de l’hébreu : la source personnelle (« de lui »), l’acquisition de שֶׂכֶל (« discernement ») et la finalité de répondre à un פִּתְגָּם. Toutefois, « au moment où il faudra » exprime surtout une simple temporalité future et atténue la notion explicite de besoin (בְּעֵת צֹרֶךְ). « Quand tu auras besoin de répondre » restitue cette notion tout en gardant le destinataire au singulier. La note signale à juste titre la divergence substantielle du grec, mais « veille à pouvoir rembourser » ajoute la capacité de rembourser, absente de la formulation grecque, qui appelle plutôt à se considérer comme devant rembourser.'
  naturalness: « Car c’est de lui que tu recevras du discernement » est naturel dans un registre sapientiel moderne. « Quand tu auras besoin de répondre à une parole » est plus idiomatique et plus directement lié au besoin que « au moment où il faudra répondre à une parole ». « Une parole » demeure une option française digne et suffisamment large pour פִּתְגָּם.
  terminology: « Discernement » rend bien le sens de jugement pratique de שֶׂכֶל. « Parole » conserve l’ouverture sémantique de פִּתְגָּם, sans le restreindre à un proverbe ou à une question. La variante grecque est maintenue en note sans être harmonisée avec l’hébreu.
  issues:
  - severity: medium
    issue: La tournure « au moment où il faudra » n’exprime pas explicitement le besoin de בְּעֵת צֹרֶךְ.
    rationale: Elle peut se comprendre comme « lorsque le moment viendra », alors que le texte hébreu évoque un temps ou une situation de besoin. La reformulation proposée restitue ce trait sans surinterpréter.
  - severity: low
    issue: La note traduit le grec par « veille à pouvoir rembourser ».
    rationale: Cette formulation introduit l’idée de capacité (« pouvoir »). Le grec demande plutôt de se préoccuper comme quelqu’un qui devra payer; « considère-toi comme tenu de rembourser » est plus proche.
