translation:
  language: fr
  text: Car c’est de lui que tu recevras du discernement[a], quand tu auras besoin de répondre à une parole.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente ici un texte très différent : « Ne te porte pas garant au-delà de tes moyens ; et si tu te portes garant, considère-toi comme tenu de rembourser. » La traduction suit le texte hébreu de la Gueniza du Caire, conservé pour ce verset, mais cette divergence est importante.'
    reason: textual_variant
lexical_decisions:
- source_word: מִמֶּנּוּ
  choice: de lui
  rationale: 'La préposition מן avec suffixe masculin singulier indique naturellement la source personnelle : « de lui ». Le contexte environnant fournit l’antécédent humain.'
- source_word: תִּקַּח
  choice: tu recevras
  rationale: Le sens littéral est « tu prendras », mais, avec שֶׂכֶל comme objet et une personne comme source, « tu recevras » exprime naturellement l’acquisition d’une qualité de sagesse.
- source_word: שֶׂכֶל
  choice: du discernement
  rationale: Le terme désigne ici l’intelligence pratique ou le bon jugement. « Discernement » convient au registre sapientiel sans réduire le mot à l’intellect abstrait.
- source_word: בְּעֵת צֹרֶךְ
  choice: au moment où il faudra
  rationale: Cette formulation garde la valeur temporelle de בְּעֵת et rend צֹרֶךְ de façon idiomatique comme une nécessité qui se présente.
- source_word: לְהַשִׁיב
  choice: répondre
  rationale: Avec פִּתְגָּם, le verbe שׁוב à l’infinitif causatif exprime l’action de donner une réponse.
- source_word: פִּתְגָּם
  choice: une parole
  rationale: Le mot peut désigner une parole formulée, une sentence ou un propos. « Une parole » conserve cette largeur sémantique ; « proverbe » serait ici trop précis.
