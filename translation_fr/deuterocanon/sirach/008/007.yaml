  text: Do not shame a man who turns back from transgression[a]; remember that we all are guilty.
translation:
  language: fr
  text: Ne fais pas honte à un homme qui se détourne de la transgression[a] ; souviens-toi que nous sommes tous coupables.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Ne te réjouis pas de la mort de quelqu’un ; souviens-toi que nous mourons tous. » Le témoin hébreu diffère ici dans les deux parties du verset ; le texte principal suit l’hébreu conservé, tandis que la lecture grecque est donnée comme variante.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּכְלִים
  choice: Ne couvre pas de honte
  rationale: Le hifil de כלם signifie faire honte, humilier ou déshonorer. « Ne couvre pas de honte » restitue clairement l’action exercée contre autrui dans un français naturel et digne.
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom hébreu est masculin singulier. « Un homme » en conserve la forme et la portée représentative sans neutraliser le texte.
- source_word: שָׁב
  choice: qui se détourne
  rationale: Le participe de שוב exprime un mouvement de retour. Avec מִפֶּשֶׁע, « qui se détourne » rend naturellement l’idée d’abandonner la transgression, sans employer le terme théologique plus spécialisé « se repentir ».
- source_word: מִפֶּשֶׁע
  choice: de la transgression
  rationale: פשע peut désigner une transgression ou une révolte. « Transgression » conserve la gravité morale et la nuance de violation, tandis que l’article français donne à l’expression une portée générale.
- source_word: זְכֹר
  choice: souviens-toi
  rationale: Équivalent direct et idiomatique de l’impératif hébreu.
- source_word: כֻּלָּנוּ
  choice: nous sommes tous
  rationale: Cette tournure française rend naturellement l’inclusion de tous exprimée par l’hébreu.
- source_word: חַיָּבִים
  choice: coupables
  rationale: חייבים peut signifier coupables, redevables ou passibles d’une sanction. « Coupables » est naturel ici et conserve la responsabilité morale sans préciser une peine que le texte hébreu ne nomme pas.
theological_decisions:
- issue: Divergence entre le texte hébreu et le parallèle grec
  choice: souviens-toi que nous sommes tous coupables
  alternative: ne te réjouis pas au sujet d’un mort ; souviens-toi que nous mourons tous
  rationale: Le texte principal suit le témoin hébreu conservé, qui parle d’un homme se détournant de la transgression et affirme que tous sont coupables. Le grec diffère dans les deux membres du verset et met l’accent sur la mort commune à tous ; cette lecture significative est donc conservée en note sans remplacer l’hébreu.
- issue: Langage du retour moral
  choice: qui se détourne de la transgression
  alternative: qui se repent de son péché
  rationale: L’hébreu décrit littéralement un mouvement de retour hors de la transgression. La formulation retenue préserve cette image sans introduire un vocabulaire doctrinal plus technique.
translation_notes:
  register: Français international moderne, clair et digne. « Ne couvre pas de honte » garde la force interpersonnelle de l’interdiction ; « se détourne » évite une formulation française maladroite avec « revenir de » tout en conservant l’image morale du retour. Le point-virgule maintient le lien exhortatif entre les deux propositions.
