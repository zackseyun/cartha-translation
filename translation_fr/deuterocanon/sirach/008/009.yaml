  text: Do not boast over one who is dying[b][a]; remember that all of us are being gathered.
translation:
  language: fr
  text: Ne te glorifie pas aux dépens de celui qui se meurt[b] ; souviens-toi que nous serons tous recueillis[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie une forme participiale : « nous sommes tous recueillis/rassemblés ». Il s’agit d’une métaphore traditionnelle de la mort ; autre traduction possible : « nous mourrons tous ».'
    reason: lexical_alternative
  - marker: b
    text: La tradition grecque de Siracide 8.9 présente ici un texte très différent, qui invite à apprendre des propos des anciens. La présente traduction suit le témoin hébreu de la Guéniza du Caire.
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּתְהַלֵּל
  choice: Ne te glorifie pas
  rationale: Le hitpael de הלל exprime le fait de se glorifier ou de triompher. Cette formulation conserve l'idée d'une élévation de soi, ici aux dépens d'un mourant.
- source_word: עַל
  choice: aux dépens de
  rationale: Dans ce contexte, la préposition marque la personne au sujet de laquelle ou contre laquelle on se glorifie. « Aux dépens de » rend naturellement en français la nuance hostile sans réduire le verbe à la seule joie.
- source_word: גֹּוֵעַ
  choice: celui qui se meurt
  rationale: Le participe de גוע désigne une personne en train d'expirer, et non une personne déjà morte. « Se meurt » conserve cet aspect progressif dans un registre digne.
- source_word: זְכֹר
  choice: souviens-toi
  rationale: L'impératif français rend directement l'exhortation hébraïque.
- source_word: כֻּלָּנוּ
  choice: nous… tous
  rationale: Cette tournure garde la portée personnelle et inclusive de la forme hébraïque.
- source_word: נֶאֱסָפִים
  choice: serons… recueillis
  rationale: Le niphal de אסף porte ici la métaphore traditionnelle de la mort comme rassemblement ou retrait. Le futur français exprime clairement le destin commun visé par le participe hébreu, tandis que « recueillis » préserve la métaphore sans ajouter une destination absente du texte.
theological_decisions:
- issue: Métaphore funéraire de נֶאֱסָפִים
  choice: Conserver la métaphore par « nous serons tous recueillis »
  alternative: nous mourrons tous
  rationale: Expliciter simplement la mort effacerait l'image hébraïque, tandis que « recueillis auprès de nos ancêtres » ajouterait un complément que le verset ne donne pas. La traduction retenue préserve donc l'image et son ouverture.
translation_notes:
  register: Français international moderne, sobre et sapientiel. « Se meurt » apporte la dignité voulue tout en maintenant le processus exprimé par le participe. Les appels de notes sont placés immédiatement après les segments concernés.
