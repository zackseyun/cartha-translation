  text: For many has gold ruined[b][a], and it leads astray the heart of nobles.
translation:
  language: fr
  text: Car l’or a rendu beaucoup de gens téméraires, et il égare le cœur des nobles.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente ici une leçon substantiellement différente : « Ne te moque pas d’une personne sans instruction, de peur que tes ancêtres ne soient déshonorés. »'
    reason: alternative_reading
  - marker: b
    text: Ou « des personnes généreuses » ; le terme hébreu peut désigner des nobles, des princes ou des personnes généreuses.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: beaucoup
  rationale: Employé substantivement, le terme désigne un grand nombre de personnes. « Beaucoup » est naturel et concis en français.
- source_word: הִפְחִיז
  choice: a précipité dans la témérité
  rationale: Ce verbe rare et difficile exprime vraisemblablement le fait de rendre téméraire ou irréfléchi. Cette formulation conserve cette nuance sans la réduire au seul résultat « ruiner ».
- source_word: זָהָב
  choice: l’or
  rationale: Équivalent direct et naturel du terme hébreu.
- source_word: יַשְׂגֶּה
  choice: égare
  rationale: Le verbe signifie faire errer ou induire en erreur. « Égare » restitue clairement sa portée morale.
- source_word: לֵב
  choice: le cœur
  rationale: Dans l’anthropologie hébraïque, le cœur est le siège de la pensée, de la volonté et des désirs. L’image de la source est conservée.
- source_word: נְדִיבִים
  choice: des nobles
  rationale: Le terme peut désigner des nobles ou des princes, mais aussi des personnes généreuses. Le contexte de l’or favorise « nobles », tandis que l’autre nuance est signalée en note.
theological_decisions:
- issue: Priorité de l’hébreu face à la leçon grecque divergente
  choice: Le texte principal traduit l’hébreu conservé, qui avertit que l’or rend beaucoup de personnes téméraires et égare le cœur des nobles.
  alternative: 'Le grec dit : « Ne te moque pas d’une personne sans instruction, de peur que tes ancêtres ne soient déshonorés. »'
  rationale: Lorsque le texte hébreu du Siracide est conservé avec une forte fiabilité, il sert de source principale. La leçon grecque est substantiellement différente et doit donc être signalée sans remplacer silencieusement l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « précipité dans la témérité » garde la difficulté et la nuance causative du verbe hébreu rare, tandis que le second membre demeure fluide. Les marqueurs suivent l’ordre normal [a][b].
