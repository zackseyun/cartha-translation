base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/008/005.yaml
  text: Do not quarrel with a man of tongue[b][a], and do not put wood on the fire.
translation:
  language: fr
  text: Ne te querelle pas avec un homme à la langue dangereuse[b], et n’ajoute pas de bois au feu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin grec présente un texte différent : « Ne fais pas de reproches à celui qui se détourne du péché ; souviens-toi que nous sommes tous passibles de réprimande. » L’hébreu conservé ici met plutôt en garde contre une dispute avec une personne à la parole dangereuse et contre le fait d’alimenter le conflit.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement, « un homme de langue » : expression hébraïque désignant une personne dont la parole est nuisible ou querelleuse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּינָץ
  choice: Ne te querelle pas
  rationale: La négation אַל introduit une défense, et תִּינָץ désigne l’entrée dans une dispute ou un conflit. « Ne te querelle pas » est naturel en français moderne et conserve la force sapientielle de l’exhortation.
- source_word: עִם אִישׁ לָשׁוֹן
  choice: avec un homme à la langue dangereuse
  rationale: Littéralement, « avec un homme de langue ». Cette expression caractérise quelqu’un dont la parole est nuisible, provocatrice ou querelleuse. La formulation retenue reste proche de l’image hébraïque sans employer le calque peu naturel « homme de langue ».
- source_word: וְאַל תִּתֵּן עַל אֵשׁ עֵץ
  choice: et n’ajoute pas de bois au feu
  rationale: Le verbe תִּתֵּן signifie couramment « donner, mettre » ; dans ce contexte, il s’agit de placer du bois sur un feu et ainsi de l’alimenter. « Ajouter du bois au feu » préserve l’image concrète tout en étant idiomatique en français.
theological_decisions:
- issue: Divergence substantielle entre les témoins hébreu et grec
  choice: Le texte principal traduit l’hébreu conservé, qui met en garde contre une querelle avec une personne à la parole dangereuse et contre l’aggravation du conflit.
  alternative: 'Le grec porte : « Ne fais pas de reproches à celui qui se détourne du péché ; souviens-toi que nous sommes tous passibles de réprimande. »'
  rationale: Lorsque le texte hébreu du Siracide est conservé avec une forte confiance, il sert de source principale. Ici, ses deux membres forment un proverbe cohérent, le bois ajouté au feu illustrant l’escalade de la querelle. Le grec témoigne d’une forme matériellement différente du verset ; il est donc signalé sans remplacer l’hébreu.
translation_notes:
  register: Français international moderne, clair et digne. « Homme » est maintenu parce que le texte hébreu emploie אִישׁ, tandis que l’explication de la note formule la portée de manière générale. La métaphore concrète du feu est conservée, avec une syntaxe française naturelle.
