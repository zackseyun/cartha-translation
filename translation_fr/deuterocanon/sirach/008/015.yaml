  text: Do not move aside before a scoffer[a], lest he seat him as one lying in wait before you.
translation:
  language: fr
  text: Ne t’écarte pas devant un railleur[a], de peur qu’il ne l’installe devant toi comme quelqu’un à l’affût.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La seconde partie du texte hébreu est difficile. Littéralement : « pour le faire asseoir comme quelqu’un à l’affût devant toi ». Le pronom traduit par « l’ » n’a pas de référent clair. Le texte grec présente une formulation différente : il avertit de ne pas marcher avec un homme téméraire, de peur qu’il ne pèse contre toi ; car il agira selon son bon plaisir, et tu périras avec sa folie.'
    reason: Difficulté textuelle et variante entre les témoins hébreu et grec.
lexical_decisions:
- source_word: אַל תָּזוּחַ
  choice: Ne t’écarte pas
  rationale: Le verbe exprime ici l’idée de se déplacer, de s’effacer ou de céder du terrain. « Ne t’écarte pas » conserve l’image spatiale tout en restant naturel en français moderne.
- source_word: מִפְּנֵי
  choice: devant
  rationale: La préposition signifie littéralement « de devant » ou « devant, en présence de ». « Devant » maintient la relation directe entre la personne avertie et le railleur.
- source_word: לֵץ
  choice: railleur
  rationale: Dans la littérature sapientiale, le mot désigne une personne méprisante qui tourne en dérision la sagesse ou autrui. « Railleur » rend ce caractère moral plus précisément que le simple « plaisantin ».
- source_word: לְהוֹשִׁיבוֹ
  choice: qu’il ne l’installe
  rationale: L’infinitif causatif avec suffixe pronominal signifie littéralement « le faire asseoir » ou « l’installer ». Le pronom masculin demeure difficile à identifier; la traduction le conserve sans le rendre artificiellement réfléchi.
- source_word: כְּאוֹרֵב
  choice: comme un homme en embuscade
  rationale: Le participe désigne quelqu’un qui se tient caché pour surprendre ou attaquer. Cette formulation préserve clairement l’image de l’embuscade.
- source_word: לְפָנֶיךָ
  choice: devant toi
  rationale: La traduction littérale est « devant toi ». Le contexte d’embuscade lui donne une portée hostile sans qu’il soit nécessaire de traduire explicitement « contre toi ».
theological_decisions:
- issue: Priorité du témoin hébreu malgré une seconde proposition difficile
  choice: Traduire prudemment le texte hébreu en conservant son pronom ambigu et son image d’embuscade.
  alternative: 'Suivre plus librement le grec : « Ne voyage pas avec un homme téméraire, de peur qu’il ne pèse lourdement contre toi. »'
  rationale: Puisque le texte hébreu est attesté ici avec une confiance élevée, il demeure la source principale. Le grec confirme le thème général du danger que représente un homme audacieux et irréfléchi, mais son texte est trop différent pour remplacer silencieusement l’hébreu.
translation_notes:
  register: Français international moderne, sobre et sapiential. L’expression « ne t’écarte pas » garde la métaphore spatiale; « railleur » conserve la gravité morale du vocabulaire de sagesse. La légère étrangeté de la seconde proposition est volontaire, car elle reflète une difficulté réelle du texte hébreu plutôt que de la résoudre par conjecture.
