  text: Do not contend with a judge[a], for he will judge according to his own will.
translation:
  language: fr
  text: Ne plaide pas contre un juge[a], car il jugera selon sa volonté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente ici une sentence différente : « En présence d’un étranger, ne fais rien en secret, car tu ne sais pas ce qui en résultera. » Le texte principal suit le témoin hébreu de la Guéniza du Caire, puisque l’hébreu est conservé pour ce verset, mais la divergence est importante.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תּשָּׁפֵט
  choice: Ne plaide pas
  rationale: Dans cette construction avec עִם et « juge », le verbe renvoie vraisemblablement à une confrontation judiciaire. « Plaider contre » rend naturellement ce sens en français sans transformer l'exhortation en interdiction générale de juger.
- source_word: עִם שׁוֹפֵט
  choice: contre un juge
  rationale: Bien que עִם signifie littéralement « avec », le contexte adversatif du procès appelle « contre » en français.
- source_word: כִּי
  choice: car
  rationale: Introduit avec concision le motif de l'avertissement, dans un registre sapientiel digne.
- source_word: כִּרְצוֹנוֹ
  choice: selon sa volonté
  rationale: Conserve l'idée que la décision dépend de la volonté ou du bon vouloir personnel du juge, sans ajouter explicitement un jugement moral absent de l'hébreu.
- source_word: יִשְׁפֹּט
  choice: il jugera
  rationale: Rend directement le verbe שפט et maintient le cadre judiciaire ainsi que la répétition de la racine hébraïque, autant que le français le permet.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et sentencieux. « Ne plaide pas contre » est plus naturel juridiquement que le littéral « ne juge pas avec », tandis que « selon sa volonté » préserve la tension du texte sans préciser s'il s'agit de pouvoir discrétionnaire ou d'arbitraire.
