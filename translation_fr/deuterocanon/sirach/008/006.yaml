  text: Do not become familiar with a foolish man[a], lest he show contempt for nobles.
translation:
  language: fr
  text: Ne fréquente pas assidûment un homme insensé[a], de peur qu’il ne méprise les notables.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec porte : « Ne déshonore pas un homme dans sa vieillesse, car certains d’entre nous aussi vieillissent. » Le grec diffère considérablement de l’hébreu conservé dans ce verset.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תְּרַגִּיל
  choice: Ne fréquente pas assidûment
  rationale: La forme verbale issue de רגל évoque ce qui devient habituel ou régulier. Cette formulation française naturelle exprime l’idée d’une fréquentation répétée sans réduire le conseil à une simple rencontre.
- source_word: אִישׁ אֱוִיל
  choice: un homme insensé
  rationale: Le syntagme hébreu est au masculin singulier. « Insensé » conserve la portée morale propre à la littérature de sagesse sans adopter le registre insultant de « stupide ».
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Cette tournure française rend naturellement la conséquence redoutée introduite par פֶּן.
- source_word: יָבוּז
  choice: il ne méprise
  rationale: Le verbe בוז exprime le mépris ou le dédain. « Mépriser » en donne ici une traduction concise et directe.
- source_word: לִנְדִיבִים
  choice: les notables
  rationale: נְדִיבִים peut désigner des personnes de rang, des nobles ou des gens généreux. « Notables » préserve ici la nuance probable de statut social sans suggérer nécessairement une noblesse héréditaire.
theological_decisions:
- issue: Divergence substantielle entre le texte hébreu conservé et le parallèle grec
  choice: Le texte principal traduit le témoin hébreu, et la lecture grecque figure en note.
  alternative: « Ne déshonore pas un homme dans sa vieillesse, car certains d’entre nous aussi vieillissent. »
  rationale: Puisque l’hébreu est conservé avec une confiance élevée, il sert de texte principal. La différence du grec touche toutefois le contenu même du verset et doit donc rester visible plutôt que d’être harmonisée.
translation_notes:
  register: Français international moderne, digne et accessible. « Fréquente assidûment » garde l’idée d’une relation devenue habituelle; « notables » rend la nuance sociale possible de נְדִיבִים tout en laissant ouverte sa portée exacte.
