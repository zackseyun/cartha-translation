  verdict: revise
  source_fidelity: Le premier membre hébreu vise une personne « plus grande / supérieure » au garant (יָתֵר מִמְּךָ). « Qui est au-dessus de tes moyens » transforme ce référent personnel en une mesure d’obligation et fixe une interprétation qui doit rester en note. La répétition de ערב est bien rendue de manière cohérente par « se porter garant », et « considère-toi comme tenu de payer » exprime adéquatement la responsabilité implicite de כִּמְשַׁלֵּם.
  naturalness: Le français est globalement naturel et de registre approprié. « Pour quelqu’un qui est plus puissant que toi » est idiomatique et rend plus directement le comparatif personnel du texte; la note conserve les autres nuances possibles. Dans la citation grecque, « garder un secret » est plus naturel que « garder une affaire secrète ».
  terminology: « Se porter garant » est un bon équivalent moderne, juridiquement compréhensible, pour le vocabulaire de cautionnement. Aucun terme théologique n’est en jeu. La note doit présenter l’interprétation financière comme une possibilité contextuelle, non comme le sens imposé du texte.
  issues:
  - severity: medium
    issue: Le texte principal interprète יָתֵר מִמְּךָ comme une obligation « au-dessus de tes moyens ».
    rationale: L’hébreu qualifie la personne pour qui l’on se porte garant (« plus grande / supérieure à toi »), et non explicitement les moyens ou le montant de l’obligation. Cette interprétation contextuelle peut être indiquée en note, mais ne devrait pas remplacer le comparatif personnel dans le texte.
  - severity: low
    issue: La formulation de la variante grecque est peu idiomatique.
    rationale: « Garder une affaire secrète » est moins naturel et moins direct que « garder un secret » pour rendre le sens traditionnellement compris de λόγον dans ce contexte.
  revised_text: Ne te porte pas garant pour quelqu’un de plus puissant que toi[a] ; et si tu t’es porté garant, considère-toi comme tenu de payer.
