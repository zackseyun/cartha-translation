  text: Do not pledge yourself for one stronger than you; and if you have pledged yourself[a], act as one who must pay.
translation:
  language: fr
  text: Ne te porte pas garant pour quelqu’un de plus puissant que toi[a] ; et si tu t’es porté garant, considère-toi comme tenu de payer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « pour quelqu’un de plus grand que toi » ou « qui te dépasse ». Dans ce contexte de cautionnement, il peut s’agir d’une personne dont l’obligation dépasse tes moyens ou ta position. Le texte grec est différent : « Ne prends pas conseil auprès d’un insensé, car il ne pourra pas garder un secret. »'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּעֲרֹב
  choice: Ne te porte pas garant
  rationale: Le verbe ערב exprime ici le fait de se porter caution ou garant pour autrui. Cette formulation est naturelle en français moderne et conserve la portée juridique et financière.
- source_word: יָתֵר מִמְּךָ
  choice: pour quelqu’un qui est au-dessus de tes moyens
  rationale: יתר peut évoquer ce qui dépasse quelqu’un par la capacité, la puissance ou le rang. Dans le contexte d’un cautionnement, la formulation retenue exprime sans excès d’interprétation une obligation dépassant les ressources ou la position du garant.
- source_word: וְאִם עָרַבְתָּ
  choice: et si tu t’es porté garant
  rationale: La répétition du même verbe hébreu est rendue par la même expression française afin de préserver la cohésion du verset.
- source_word: כִּמְשַׁלֵּם
  choice: considère-toi comme tenu de payer
  rationale: Le préfixe comparatif כ présente le garant comme quelqu’un qui paie. La traduction explicite idiomatiquement la responsabilité effective de paiement sans affirmer que le paiement a déjà eu lieu.
