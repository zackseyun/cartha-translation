translation_notes:
  register: Français moderne, clair et digne. « Se porter garant » restitue précisément le cadre financier. « Au-dessus de tes moyens » privilégie le sens pratique du déséquilibre tout en signalant en note l’ambiguïté de l’hébreu et la variante grecque.
