translation:
  language: fr
  text: Ne te querelle pas avec un homme puissant, de peur de tomber entre ses mains.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit plus littéralement : « pourquoi serais-tu placé dans sa main ? » Le parallèle grec appuie le sens plus fluide : « de peur de tomber entre ses mains ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תָּרִיב
  choice: Ne te querelle pas
  rationale: Le verbe ריב désigne ici le fait d’entrer en conflit, éventuellement dans une contestation. « Se quereller » exprime naturellement en français moderne une opposition plus vive qu’un simple désaccord et correspond aussi au grec διαμάχου.
- source_word: עִם אִישׁ גָּדוֹל
  choice: avec un homme puissant
  rationale: גָּדוֹל signifie littéralement « grand », mais le contexte sapientiel et le grec δυνάστου indiquent une personne qui détient un pouvoir social ou politique. « Homme puissant » évite de suggérer une grandeur morale ou physique.
- source_word: לָמָּה תִשּׁוֹם עַל יָדוֹ
  choice: de peur de tomber entre ses mains
  rationale: Le texte hébreu transmis est difficile et se lit plus littéralement « pourquoi serais-tu placé dans sa main ? ». Le parallèle grec présente clairement une mise en garde, « de peur que tu ne tombes entre ses mains ». La formulation française rend ce sens probable de manière idiomatique, tout en signalant la difficulté en note.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement convient à l’adresse sapientielle individuelle. « Homme puissant » explicite la valeur sociale de גָּדוֹל, tandis que la note conserve la formulation difficile de l’hébreu.
