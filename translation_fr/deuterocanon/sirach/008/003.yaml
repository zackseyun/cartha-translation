  text: Do not quarrel with a man who has a sharp tongue, and do not pile wood on his fire.[a]
translation:
  language: fr
  text: Ne cherche pas querelle à un homme à la langue acérée et n’ajoute pas de bois à son feu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu conservé se lit approximativement : « Ne trame rien contre un homme sans ressources, de peur qu’il ne pèse ton prix et que tu ne périsses. » Le grec porte plutôt : « Ne cherche pas querelle à un homme à la langue acérée et n’ajoute pas de bois à son feu. » Comme l’hébreu est difficile à cet endroit et que le grec forme un proverbe cohérent, le texte principal suit le sens du grec tout en conservant ici l’autre lecture.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּחֲרֹשׁ עַל אִישׁ לֹא הוֹן
  choice: Ne cherche pas querelle à un homme à la langue acérée
  rationale: L’hébreu transmis est difficile et paraît signifier approximativement « Ne trame rien contre un homme sans ressources ». Le parallèle grec, μὴ διαμάχου μετὰ ἀνθρώπου γλωσσώδους, donne un avertissement cohérent contre une querelle avec un homme porté aux paroles agressives. « À la langue acérée » restitue naturellement γλωσσώδους dans ce contexte sans réduire le terme à la simple loquacité.
- source_word: μὴ ἐπιστοίβαζης ἐπὶ τὸ πῦρ αὐτοῦ ξύλα
  choice: et n’ajoute pas de bois à son feu
  rationale: Cette formulation conserve l’image grecque claire de l’ajout de combustible qui attise le conflit. Elle est idiomatique et immédiatement compréhensible en français moderne.
- source_word: פֶּן יִשְׁקֹל מְחִירְךָ וְאָבָדְתָּ
  choice: de peur qu’il ne pèse ton prix et que tu ne sois perdu
  rationale: Cette proposition hébraïque n’est pas retenue dans le texte principal, puisque celui-ci suit ici le parallèle grec cohérent, mais elle est traduite dans la note afin de préserver le témoignage hébreu et son étrangeté.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et proverbial. « Ne cherche pas querelle » est naturel et digne; « à la langue acérée » exprime une parole susceptible d’envenimer le conflit. Le tutoiement apparaît uniquement dans la traduction alternative de l’hébreu en note, conformément à la deuxième personne du singulier.
