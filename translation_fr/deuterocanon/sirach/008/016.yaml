  text: Do not lend to a man stronger than you; and if you do lend[a], regard it as lost.
translation:
  language: fr
  text: Ne prête pas à un homme plus puissant que toi ; si tu lui prêtes[a], considère ce que tu as prêté comme perdu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin grec donne ici un avertissement différent : « N’engage pas de combat avec un homme coléreux et ne traverse pas le désert avec lui […] ; là où aucun secours n’est possible, il te fera tomber. » L’hébreu conservé met plutôt en garde contre le fait de prêter à quelqu’un de plus puissant que soi.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תַּלְוֶה
  choice: Ne prête pas
  rationale: L’impératif négatif rend naturellement l’interdiction sapientielle, et le hifil de לוה désigne ici le fait de prêter.
- source_word: אִישׁ חָזָק מִמְּךָ
  choice: à un homme plus puissant que toi
  rationale: אִישׁ est explicitement masculin. Dans ce contexte financier, « plus puissant » exprime mieux que « plus fort » la supériorité qui pourrait empêcher le prêteur de recouvrer son bien.
- source_word: וְאִם הִלְוִיתָ
  choice: et si tu lui prêtes
  rationale: La proposition conditionnelle envisage le cas où l’interdiction n’aurait pas été suivie. Le pronom « lui » explicite en français le bénéficiaire déjà mentionné sans changer le sens.
- source_word: כִּמְאַבֵּד
  choice: considère cet argent comme perdu
  rationale: L’expression hébraïque est elliptique et signifie littéralement quelque chose comme « comme perdant ». La formulation française explicite l’objet du prêt et restitue clairement le conseil pratique.
theological_decisions:
- issue: Formulation masculine de אִישׁ dans l’instruction sapientielle
  choice: un homme plus puissant que toi
  alternative: quelqu’un de plus puissant que toi
  rationale: Le texte hébreu emploie le nom masculin singulier אִישׁ ; le conserver respecte sa forme sans élargir silencieusement la formulation.
- issue: Divergence substantielle entre l’hébreu et le grec
  choice: Traduire dans le texte principal l’avertissement hébreu concernant un prêt
  alternative: Suivre le grec, qui déconseille de combattre et de traverser le désert avec un homme coléreux
  rationale: Le témoin hébreu disponible est ici la source principale. La leçon grecque constitue une variante distincte qui ne doit pas être fusionnée avec elle, mais signalée en note.
translation_notes:
  register: Français moderne, direct et digne, avec tutoiement singulier conforme à l’adresse sapientielle. « Plus puissant » souligne le rapport de pouvoir impliqué par חָזָק dans ce contexte. « Cet argent » rend explicite l’objet sous-entendu de la formule hébraïque elliptique.
