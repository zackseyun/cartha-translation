  text: Those who love her love life[a], and those who seek her will obtain favor from Yahweh.
translation:
  language: fr
  text: Ceux qui l’aiment aiment la vie[a], et ceux qui la cherchent obtiendront la faveur de Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Celui qui l’aime aime la vie, et ceux qui se lèvent tôt pour elle seront comblés de joie. »'
    reason: Le parallèle grec présente une formulation différente, surtout dans le second membre du verset.
lexical_decisions:
- source_word: אֹהֲבֶיהָ
  choice: Ceux qui l’aiment
  rationale: Le participe actif avec suffixe féminin singulier renvoie à la sagesse dans le contexte; cette formulation est naturelle en français.
- source_word: אָהֲבוּ חַיִּים
  choice: aiment la vie
  rationale: Le parfait hébreu a ici une valeur générale dans une maxime. Le présent français exprime clairement cette portée gnomique, également attestée par le parallèle grec.
- source_word: וּמְבַקְשֶׁיהָ
  choice: et ceux qui la cherchent
  rationale: בקש signifie ici « chercher ». Aucun adverbe d’intensité n’est ajouté, puisque l’hébreu n’en comporte pas.
- source_word: יָפִיקוּ
  choice: obtiendront
  rationale: Dans cette construction avec רָצוֹן, le verbe exprime le fait d’obtenir ou de recevoir favorablement quelque chose.
- source_word: רָצוֹן
  choice: la faveur
  rationale: Avec la préposition מן et le nom divin, le terme désigne l’accueil favorable ou la bienveillance accordée par Dieu.
- source_word: מֵיהֹוָה
  choice: de Yahvé
  rationale: Le tétragramme est rendu par « Yahvé », forme française courante qui représente explicitement le nom divin présent dans le texte hébreu.
theological_decisions:
- issue: Divergence entre l’hébreu et le grec dans le second membre
  choice: 'Suivre l’hébreu : « obtiendront la faveur de Yahvé »'
  alternative: 'Le grec porte : « ceux qui se lèvent tôt pour elle seront comblés de joie »'
  rationale: Le témoin hébreu, conservé ici avec un degré élevé de confiance, est prioritaire. La variante grecque, substantielle, est signalée en note sans être harmonisée avec l’hébreu.
translation_notes:
  register: Français international moderne, simple et digne. La répétition « aiment… aiment » conserve l’effet rhétorique de l’hébreu. Le pronom féminin renvoie à la sagesse dans le contexte.
