  text: Do not embitter the inward parts of the poor[a], and do not cause pain to the heart of the needy.
translation:
  language: fr
  text: N’aigris pas le cœur du pauvre[a], et ne fais pas souffrir le cœur de l’indigent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les entrailles du pauvre ». En hébreu, les entrailles représentent ici le siège des émotions profondes ; le parallèle grec emploie « cœur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְמִיר
  choice: aigris
  rationale: Le causatif exprime ici l’idée de rendre amer ou d’endurcir. « Aigrir » conserve naturellement en français l’image hébraïque de l’amertume appliquée à la vie affective.
- source_word: מְעֵי
  choice: cœur
  rationale: Le terme désigne littéralement les entrailles, considérées comme le siège des émotions profondes. En français moderne, « cœur » communique naturellement cette valeur sans l’effet anatomique ou archaïque d’« entrailles »; une note conserve l’image source.
- source_word: דָךְ
  choice: pauvre
  rationale: Le mot peut désigner celui qui est écrasé, faible ou démuni. « Pauvre » convient au contexte social et reste clair pour le lecteur moderne.
- source_word: קֶרֶב
  choice: être intérieur
  rationale: Le sens premier est l’intérieur ou le milieu. Ici, dans le parallélisme avec מְעֵי, il désigne la vie intérieure; « être intérieur » préserve cette nuance sans identifier les deux termes hébreux.
- source_word: עָנִי
  choice: indigent
  rationale: Le terme peut signifier pauvre, affligé ou humble. « Indigent » souligne le dénuement et évite de répéter « pauvre », tout en restant digne et intelligible.
- source_word: תַּכְאִיב
  choice: fais souffrir
  rationale: Le causatif de כאב signifie causer de la douleur. « Ne fais pas souffrir » est une formulation française directe et naturelle.
theological_decisions:
- issue: Maintien des deux images anthropologiques hébraïques
  choice: Rendre מְעֵי par « cœur » avec une note signalant l’image des entrailles, et קֶרֶב par « être intérieur ».
  alternative: Employer « cœur » dans les deux membres, ou conserver littéralement « entrailles » dans le premier.
  rationale: Les deux mots hébreux se rapportent à la vie émotionnelle intérieure sans être identiques. Cette formulation reste naturelle en français tout en préservant leur distinction; le parallèle grec confirme l’interprétation affective par son emploi de καρδία.
translation_notes:
  register: Français international moderne, direct et digne. Le parallélisme poétique est conservé, avec une légère variation entre « pauvre » et « indigent », ainsi qu’entre « cœur » et « être intérieur ».
