  source_fidelity: 'Le texte français suit fidèlement l’hébreu conservé : l’interdiction de s’asseoir/siéger avec un juge injuste est maintenue, de même que la conséquence formulée à la deuxième personne : « tu jugeras selon son bon plaisir ». Cette dernière expression rend correctement l’idée que le jugement auquel le destinataire s’associerait serait réglé par la volonté du juge. La divergence radicale du grec est signalée sans être intégrée au texte principal.'
  naturalness: « Ne siège pas avec un juge injuste » est une formulation française claire, moderne et appropriée au contexte judiciaire. « Car, avec lui, tu jugeras selon son bon plaisir » est intelligible et conserve une sobriété proverbiale. « Selon son bon plaisir » est un peu soutenu, mais demeure usuel et exprime bien l’arbitraire visé.
  terminology: « Juge injuste » est exact pour שׁוֹפֵט עַוָּל. Le choix de « siéger » préserve l’image de participation à une instance judiciaire sans surinterpréter le texte. Le terme « bon plaisir » rend רצונו comme volonté personnelle et arbitraire, sans ajout doctrinal.
