base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/028.yaml
  text: Do not sit with an unjust judge[a], for with him judgment will be according to his pleasure.
translation:
  language: fr
  text: Ne siège pas avec un juge injuste[a], car, avec lui, tu jugeras selon son bon plaisir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente ici une lecture très différente : « Lutte pour la vérité jusqu’à la mort, et le Seigneur Dieu combattra pour toi. »'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֵּשֵׁב
  choice: Ne siège pas
  rationale: Rend directement l’image hébraïque de prendre place avec quelqu’un, tout en suggérant ici la participation à ses délibérations judiciaires.
- source_word: שׁוֹפֵט עַוָּל
  choice: un juge injuste
  rationale: « Juge » correspond au cadre judiciaire, et « injuste » exprime la perversité morale précisément dans l’exercice du jugement.
- source_word: כַאֲשֶׁר כִּרְצוֹנוֹ
  choice: selon son bon plaisir
  rationale: Cette expression française naturelle conserve l’idée d’une décision arbitraire dictée par la volonté personnelle du juge.
- source_word: תִּשְׁפּוֹט עִמּוֹ
  choice: avec lui, tu jugeras
  rationale: Le verbe hébreu est à la deuxième personne du singulier; cette traduction en maintient la forme et le sens judiciaire sans transformer la proposition en tournure impersonnelle.
theological_decisions:
- issue: Divergence majeure entre le texte hébreu et la tradition grecque
  choice: Le texte principal suit l’hébreu conservé, qui met en garde contre la participation au jugement d’un juge injuste.
  alternative: 'Le grec porte : « Lutte pour la vérité jusqu’à la mort, et le Seigneur Dieu combattra pour toi. »'
  rationale: Lorsque le texte hébreu du Siracide est conservé avec une forte confiance, il sert de base principale. La lecture grecque, substantiellement différente, est toutefois signalée afin de préserver honnêtement la pluralité textuelle.
- issue: Sujet grammatical de תִּשְׁפּוֹט
  choice: 'Conserver la deuxième personne : « tu jugeras ».'
  alternative: 'Comprendre impersonnellement : « le jugement se fera » ou « on jugera ».'
  rationale: La forme hébraïque est explicitement à la deuxième personne masculine singulière. La garder préserve la mise en garde adressée au lecteur et la tension selon laquelle s’asseoir avec le juge risque de l’associer à son jugement arbitraire.
translation_notes:
  register: Français moderne, digne et direct. « Ne siège pas » conserve l’image judiciaire de l’hébreu; « selon son bon plaisir » marque l’arbitraire sans ajouter d’interprétation confessionnelle.
