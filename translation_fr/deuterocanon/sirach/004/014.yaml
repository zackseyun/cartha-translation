base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/014.yaml
  text: Those who minister to her minister to the Holy One[a], and God loves those who love her dwelling.
translation:
  language: fr
  text: Ceux qui la servent servent le Saint[a], et Dieu aime ceux qui aiment sa demeure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « et le Seigneur aime ceux qui l’aiment ». L’hébreu semble préserver ici une leçon plus difficile faisant intervenir sa demeure.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְשָׁרְתֵי / מְשָׁרְתֶיהָ
  choice: servent / la servent
  rationale: Le verbe שרת désigne un service ou un ministère, souvent dans un cadre sacré ou officiel. « Servir » est naturel en français moderne tout en conservant ici la portée cultuelle suggérée par le contexte et le parallèle grec.
- source_word: קֹדֶשׁ
  choice: le Saint
  rationale: La formule hébraïque משרתי קדש est concise et elliptique. « Le Saint » rend la référence sacrée personnelle sans transformer le terme en abstraction; le parallèle grec ἁγίῳ appuie cette possibilité, même si l’expression hébraïque reste comprimée.
- source_word: וֵאלֹהִים
  choice: et Dieu
  rationale: Le témoin hébreu porte explicitement אֱלֹהִים. « Dieu » suit donc le texte primaire, plutôt que « le Seigneur », qui correspond au grec ὁ κύριος.
- source_word: בֵּית [מוֹשָׁבָהּ אָהֵב]
  choice: aime ceux qui aiment sa demeure
  rationale: Le texte hébreu transmis semble conserver un élément relatif à la maison ou à la demeure, bien que la syntaxe soit difficile et que les crochets signalent une incertitude éditoriale. Cette formulation garde ce trait du témoin hébreu dans un français intelligible.
- source_word: אָהֵב
  choice: aime
  rationale: « Aimer » est l’équivalent usuel de אהב et préserve la répétition rhétorique du verbe dans le second membre.
theological_decisions:
- issue: Désignation divine dans le second membre
  choice: Dieu
  alternative: le Seigneur
  rationale: Le texte hébreu primaire lit אֱלֹהִים, tandis que le parallèle grec porte ὁ κύριος. Le corps du texte suit l’hébreu.
- issue: Objet de l’amour divin dans le second membre
  choice: ceux qui aiment sa demeure
  alternative: ceux qui l’aiment
  rationale: Le témoin hébreu paraît comporter le langage de la demeure, mais son état est difficile; le grec donne la lecture plus simple « ceux qui l’aiment ». Le texte principal conserve la leçon hébraïque plus ardue et la note signale clairement l’autre tradition.
- issue: Référent de קֹדֶשׁ
  choice: le Saint
  alternative: ce qui est saint / le sanctuaire
  rationale: L’hébreu est elliptique et pourrait recevoir une compréhension impersonnelle ou cultuelle. Dans le contexte, et avec l’appui du grec au datif, « le Saint » offre une formulation française digne et cohérente, sans prétendre supprimer entièrement l’ambiguïté de la source.
translation_notes:
  register: Français international moderne, simple et digne. « Servent » évite l’ambiguïté contemporaine de « ministres » tout en maintenant le parallélisme. « Le Saint » conserve le registre sacré et la concision de l’hébreu.
