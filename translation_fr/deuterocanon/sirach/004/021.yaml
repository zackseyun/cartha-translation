translation:
  language: fr
  text: Car il y a une honte qui entraîne la faute[a], et il y a une honte qui est honneur et faveur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est condensé et peut aussi se comprendre : « qui porte la faute ». Le grec dit plus explicitement : « qui conduit au péché ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « gloire et grâce ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּשֶׁת
  choice: honte
  rationale: « Honte » conserve le poids moral et social du terme hébreu et correspond au grec αἰσχύνη. « Embarras » serait trop faible, tandis que « déshonneur » s’adapterait moins bien au contraste paradoxal des deux propositions.
- source_word: מַשְׂאֵת עָוֹן
  choice: qui entraîne la faute
  rationale: L’expression hébraïque est condensée et peut évoquer le fait de porter la faute. Le grec ἐπάγουσα ἁμαρτίαν confirme toutefois une idée de conséquence ou d’aboutissement. « Entraîne la faute » reste naturel en français sans effacer entièrement cette ambiguïté.
- source_word: עָוֹן
  choice: faute
  rationale: Le mot peut désigner l’iniquité, la faute ou la culpabilité qui en découle. « Faute » convient ici à la formulation causale tout en évitant de trancher trop nettement entre l’acte mauvais et la culpabilité.
- source_word: כָּבוֹד
  choice: honneur
  rationale: Le terme signifie honneur ou gloire. Dans ce contraste social et moral, « honneur » est plus naturel en français moderne tout en gardant la dignité du propos.
- source_word: חֵן
  choice: faveur
  rationale: Le terme désigne la faveur, la grâce ou l’agrément. « Faveur » exprime clairement l’approbation reçue sans imposer une connotation théologique ultérieure.
theological_decisions:
- issue: Sens de l’expression difficile מַשְׂאֵת עָוֹן dans la première proposition
  choice: Une certaine honte entraîne la faute ou la culpabilité.
  alternative: Une honte porte la faute ; ou, d’après le grec plus explicitement, conduit au péché.
  rationale: L’hébreu demeure le témoin principal, mais sa formulation est comprimée. Le parallèle grec appuie un sens résultatif. Le texte principal exprime donc la conséquence morale, tandis que la note conserve les autres possibilités réelles.
- issue: Nature de la honte dans la seconde proposition
  choice: La honte peut, dans certaines circonstances, être honneur et faveur.
  alternative: La honte apporte gloire et grâce.
  rationale: La formulation nominale paradoxale de l’hébreu est maintenue sans préciser quelles situations sont visées ni résoudre la tension morale du verset.
translation_notes:
  register: Français international moderne, concis et sentencieux. La répétition « il y a une honte » et le paradoxe entre honte, faute et honneur sont conservés. « Honneur et faveur » privilégie une expression naturelle sans abaisser le registre.
