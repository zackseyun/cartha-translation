  text: Whoever listens to me will judge truly[b][a], and whoever gives ear to me will dwell securely in my inner chambers.
translation:
  language: fr
  text: Celui qui m’écoute jugera selon la vérité, et celui qui me prête une oreille attentive habitera en sécurité dans mes chambres intérieures.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente une leçon différente : « Celui qui lui obéit jugera des nations, et celui qui s’approche d’elle campera avec confiance. » Le texte principal suit l’hébreu conservé; le grec aide toutefois à éclairer la difficile finale hébraïque.'
    reason: alternative_reading
  - marker: b
    text: Les « chambres intérieures » prolongent la personnification de la Sagesse en femme qui accueille chez elle la personne attentive.
    reason: cultural_note
lexical_decisions:
- source_word: שׁוֹמֵעַ לִי
  choice: Celui qui m’écoute
  rationale: שמע peut exprimer le fait d’entendre, d’écouter ou d’obéir. « M’écoute » conserve l’image auditive et laisse entendre une écoute qui engage.
- source_word: יִשׁפֹּט אֱמֶת
  choice: jugera selon la vérité
  rationale: Littéralement, « jugera vérité ». Cette formulation française rend la valeur adverbiale probable sans remplacer le texte hébreu par le grec « jugera des nations ».
- source_word: וּמַאֲזִין לִי
  choice: et celui qui me prête une oreille attentive
  rationale: מאזין souligne l’attention. Cette expression préserve le parallélisme tout en distinguant légèrement ce verbe de שומע.
- source_word: יִיחַן
  choice: habitera
  rationale: La forme évoque l’installation ou le campement; le parallèle grec κατασκηνώσει confirme le champ de l’habitation. « Habitera » est naturel et digne en français.
- source_word: בַּחֲדָרַי
  choice: dans mes chambres intérieures
  rationale: חדר désigne une chambre ou une pièce retirée. Le possessif prolonge la personnification de la Sagesse qui accueille chez elle celui qui l’écoute.
- source_word: מִבָּיִת
  choice: en sécurité
  rationale: La finale hébraïque est difficile et, prise littéralement, donnerait « de la maison ». Le grec πεποιθώς appuie l’idée d’une habitation confiante ou sûre; la traduction exprime ce sens probable tout en signalant l’incertitude en note.
theological_decisions:
- issue: Divergence entre l’hébreu et le grec dans le premier membre
  choice: 'Suivre l’hébreu : « jugera selon la vérité »'
  alternative: 'Le grec porte : « jugera des nations »'
  rationale: L’hébreu conservé est ici le témoin principal. La variante grecque, substantiellement différente, est signalée sans être substituée au texte hébreu.
- issue: Sens de la finale difficile מִבָּיִת
  choice: Rendre l’idée d’habiter en sécurité
  alternative: 'Traduction littérale mais obscure : « habitera dans mes chambres, de la maison »; grec : « campera avec confiance »'
  rationale: La syntaxe hébraïque est incertaine. Le parallèle grec éclaire probablement le sens général d’une habitation sûre, mais la note conserve la transparence sur la différence textuelle.
translation_notes:
  register: Français international moderne, courant et digne. Le parallélisme hébreu est préservé par deux expressions d’écoute distinctes. « Selon la vérité » est plus idiomatique que « vraiment » dans le contexte judiciaire. Les marqueurs [a] et [b] sont placés à la fin du verset, où ils renvoient respectivement à la variante grecque et à l’image domestique.
