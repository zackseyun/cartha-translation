  text: Contend for righteousness until death[b][a], and Yahweh will fight for you.
translation:
  language: fr
  text: Lutte pour la justice jusqu’à la mort[a][b], et Yahvé combattra pour toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Lutte jusqu’à la mort pour la droiture. » Le mot hébreu peut désigner la justice ou la droiture morale.'
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec présente ici une phrase différente : « Ne sois pas rude dans tes paroles, ni paresseux et nonchalant dans tes actes. » Le texte principal suit le témoin hébreu de la Guéniza du Caire.'
    reason: textual_variant
lexical_decisions:
- source_word: עַד הַמָּוֶת
  choice: jusqu’à la mort
  rationale: Cette expression indique jusqu’où doit aller la persévérance dans la lutte, sans préciser qu’il s’agit nécessairement du martyre.
- source_word: הִנָּצֵה
  choice: lutte
  rationale: L’impératif appelle à s’engager résolument dans un combat ou une contestation. « Lutte » est naturel en français et maintient l’écho avec « combattra » dans la seconde proposition.
- source_word: עַל הַצֶּדֶק
  choice: pour la justice
  rationale: צֶדֶק désigne ce qui est juste, tant sur le plan moral que judiciaire. « Justice » convient bien à l’exhortation, tandis que « droiture » demeure une possibilité importante signalée en note.
- source_word: וַיהֹוָה
  choice: Yahvé
  rationale: Le texte hébreu emploie directement le tétragramme; « Yahvé » en représente la forme usuelle en français biblique.
- source_word: נִלְחָם לָךְ
  choice: combattra pour toi
  rationale: La forme hébraïque est un participe, mais, après l’impératif, elle exprime naturellement la conséquence ou l’assurance à venir. Cette traduction conserve aussi le parallélisme martial.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le nom propre est conservé plutôt que remplacé par un titre, puisque l’hébreu porte explicitement le tétragramme.
- issue: Sens de צֶדֶק
  choice: justice
  alternative: droiture
  rationale: Le terme peut viser aussi bien la justice que la rectitude morale. Le texte principal retient « justice », courant et ample en français, sans exclure « droiture », indiquée en note.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement singulier reproduit l’adresse individuelle de l’hébreu. Le couple « lutte / combattra » conserve le parallélisme et l’image de combat du texte source.
