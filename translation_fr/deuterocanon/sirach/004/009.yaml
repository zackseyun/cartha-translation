  text: Be like a father to orphans[a], and in place of a husband to widows.
translation:
  language: fr
  text: Sois comme un père pour les orphelins[a], et tiens lieu de mari aux veuves.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente une leçon substantiellement différente : « Délivre l’opprimé de la main de celui qui lui fait du tort, et ne manque pas de courage quand tu rends la justice. » Cette leçon reflète probablement une autre forme textuelle du verset.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֱיֵה כְאָב
  choice: Sois comme un père
  rationale: L’impératif de היה suivi de כְ exprime ici une comparaison. « Sois comme un père » est naturel en français et préserve explicitement cette valeur comparative.
- source_word: לִיתוֹמִים
  choice: pour les orphelins
  rationale: יתומים désigne ceux qui ont perdu leur père ou leurs parents. « Orphelins » est le terme moderne le plus clair; « pour » exprime naturellement en français le rôle protecteur exercé à leur égard.
- source_word: וּתְמוּר בַּעַל
  choice: et tiens lieu de mari
  rationale: תמור indique le remplacement ou la substitution, et בעל, dans ce contexte lié aux veuves, signifie « mari ». L’expression française « tenir lieu de » rend cette substitution relationnelle sans suggérer un mariage réel.
- source_word: לְאַלְמָנוֹת
  choice: aux veuves
  rationale: אלמנות signifie clairement « veuves ». La préposition « aux » convient à la construction française « tenir lieu de mari à quelqu’un ».
- source_word: ἐξελοῦ ἀδικούμενον ἐκ χειρὸς ἀδικοῦντος
  choice: non retenu dans le texte principal
  rationale: Le grec présente une leçon substantiellement différente. Puisque le texte hébreu conservé est ici jugé fiable, il fonde le texte principal; la forme grecque est signalée en note.
theological_decisions:
- issue: Divergence entre le texte hébreu conservé et le parallèle grec
  choice: 'Suivre l’hébreu : appel à jouer un rôle paternel ou conjugal de protection envers les personnes vulnérables.'
  alternative: 'Suivre le grec : « Délivre l’opprimé de la main de celui qui lui fait du tort, et ne manque pas de courage quand tu rends la justice. »'
  rationale: L’hébreu conservé est la source première et sa lecture est ici hautement fiable. La leçon grecque témoigne toutefois d’une forme textuelle réellement différente et doit donc être conservée en note sans être harmonisée avec l’hébreu.
translation_notes:
  register: Français moderne, international et digne. « Tiens lieu de mari » préserve l’idée de substitution et de protection sans faire de l’exhortation une union conjugale littérale. Le marqueur [a] est placé après « orphelins » pour signaler que toute la formulation grecque du verset diverge à partir de ce point.
