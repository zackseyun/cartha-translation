  source_fidelity: La première proposition reflète correctement l’idiome hébreu נשא פנים (« faire preuve de partialité ») et sa construction paradoxale avec « contre toi-même ». La seconde doit rester plus proche de la répétition hébraïque de כשל / מכשול. « Jusqu’à causer ta propre chute » introduit une relation causale qui n’est pas explicitement exprimée par le texte hébreu. Le grec parallèle offre une lecture sensiblement différente (« ne sois pas honteux jusqu’à ta chute »), à conserver en note plutôt qu’à incorporer au texte principal.
  naturalness: « Ne fais pas preuve de partialité contre toi-même » est compréhensible, quoique volontairement paradoxal comme l’original. « Ne trébuche pas à cause de tes propres faux pas » est un français moderne et intelligible; sa redondance reproduit, sans la lisser excessivement, le jeu de racine de l’hébreu.
  terminology: « Partialité » convient à נשא פנים. « Faux pas » rend ici מכשול de façon idiomatique dans le parallélisme avec « trébucher », sans imposer le sens plus fort de « ruine » ou « chute ».
