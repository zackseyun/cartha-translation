base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/022.yaml
  text: Do not show partiality against yourself[a], and do not stumble to your own downfall.
translation:
  language: fr
  text: Ne fais pas preuve de partialité contre toi-même, et ne trébuche pas à cause de tes propres faux pas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu répète le vocabulaire du trébuchement; la seconde proposition peut se rendre de façon plus littérale: « ne trébuche pas dans tes trébuchements » ou « à cause de tes faux pas ». Le grec parallèle lit: « ne sois pas honteux jusqu’à ta chute ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּשָּׂא פָנֶיךָ
  choice: Ne fais pas preuve de partialité
  rationale: L’expression hébraïque נשא פנים signifie littéralement « relever le visage », mais désigne idiomatiquement le fait de favoriser quelqu’un ou de faire preuve de partialité. Le parallèle grec confirme cet emploi idiomatique.
- source_word: עַל נַפְשֶׁךָ
  choice: contre toi-même
  rationale: 'נפש désigne ici la personne elle-même; la préposition על, confortée par le grec κατά, donne à l’avertissement sa formulation paradoxale: exercer une partialité qui se retourne contre soi.'
- source_word: וְאַל תִּכָּשֵׁל
  choice: et ne trébuche pas
  rationale: Le texte hébreu transmis emploie כשל, « trébucher, chanceler ». La traduction principale suit donc directement la source hébraïque, tandis que la divergence du grec est signalée en note.
- source_word: לְמִכְשׁוֹלֶיךָ
  choice: jusqu’à causer ta propre chute
  rationale: Le syntagme hébreu est difficile et peut se rendre plus littéralement par « à cause de tes obstacles » ou « dans tes trébuchements ». La formulation choisie exprime naturellement en français l’issue funeste indiquée par מכשול, sans masquer l’incertitude textuelle, qui est précisée en note.
