  text: And God will call you son[a], and he will show you favor and deliver you from the Pit.
translation:
  language: fr
  text: Et Dieu t’appellera fils[a], il t’accordera sa faveur et te délivrera de la fosse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « tu seras comme un fils du Très-Haut, et il t’aimera plus que ta mère ». Le témoin hébreu porte plutôt : « Dieu t’appellera fils, il t’accordera sa faveur et te délivrera de la fosse. »'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵל
  choice: Et Dieu
  rationale: אל désigne ici naturellement Dieu comme sujet personnel de la promesse; « le Puissant » serait possible, mais moins direct dans ce contexte.
- source_word: יִקְרָאֲךָ בֵּן
  choice: t’appellera son fils
  rationale: L’hébreu dit littéralement « t’appellera fils ». En français, « son fils » exprime naturellement la relation impliquée par cet emploi attributif, tout en conservant le masculin singulier du texte.
- source_word: וְיָחְנְךָ
  choice: il t’accordera sa faveur
  rationale: Le verbe חנן signifie faire grâce ou accorder sa faveur. Cette formulation est claire, actuelle et met en valeur l’initiative bienveillante de Dieu.
- source_word: וְיַצִּילְךָ
  choice: te délivrera
  rationale: נצל signifie délivrer ou arracher à un danger. « Délivrer » convient au registre biblique sans être archaïque.
- source_word: מִשָׁחַת
  choice: de la Fosse
  rationale: שחת peut désigner la fosse, la tombe ou la destruction. La majuscule suggère ici le domaine de la mort sans réduire l’expression à une seule interprétation.
theological_decisions:
- issue: Langage filial appliqué à celui qui prend soin des vulnérables
  choice: Dieu t’appellera son fils
  alternative: tu seras comme un fils du Très-Haut
  rationale: Le témoin hébreu affirme directement que Dieu appellera le destinataire « fils », tandis que le grec présente une comparaison avec un fils du Très-Haut. Le texte principal suit l’hébreu, et la note conserve la variante grecque sans harmonisation.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement conserve l’adresse individuelle au masculin singulier. « Fosse » avec une majuscule garde ouverte la portée mortuaire de שחת.
