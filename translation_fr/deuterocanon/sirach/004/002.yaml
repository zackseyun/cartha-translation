  text: Do not make a needy soul despair[a], and do not ignore a crushed soul.
translation:
  language: fr
  text: Ne pousse pas au désespoir la personne dans le besoin[a], et ne te détourne pas de celle qui a l’âme accablée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec dit : « N’attriste pas une âme affamée et n’irrite pas un homme dans sa détresse. » Le témoin hébreu a un sens plus large (« personne dans le besoin » ; « âme accablée ») ; le texte principal suit donc l’hébreu, tandis que cette note conserve la nuance du grec.'
    reason: alternative_reading
lexical_decisions:
- source_word: דֹּוֶוה נֶפֶשׁ חֲסֵרָה
  choice: la personne dans le besoin
  rationale: L’expression hébraïque associe la souffrance ou l’affaiblissement (דוה) au manque (חסרה). « La personne dans le besoin » rend naturellement en français cette détresse due à la privation sans la limiter à la faim physique, comme le fait davantage le parallèle grec.
- source_word: אַל תָּפוּחַ
  choice: ne pousse pas au désespoir
  rationale: Le verbe hébreu est difficile. Dans ce contexte, il interdit d’aggraver la détresse d’une personne déjà démunie. Cette formulation conserve la force intérieure du propos, tandis que le grec λυπήσῃς appuie le sens plus général d’« affliger ».
- source_word: וְאַל תִּתְעַלֵּם
  choice: et ne te détourne pas
  rationale: Le hitpael de עלם peut évoquer le fait de se cacher ou de faire comme si l’on ne voyait pas. « Ne te détourne pas » restitue clairement cette attitude en français courant et digne.
- source_word: מִמְּדֻכְדַּךְ נָפֶשׁ
  choice: de celle qui a l’âme accablée
  rationale: מדוכדך désigne une personne écrasée, abattue ou profondément découragée. « L’âme accablée » préserve l’image intérieure et la gravité de l’hébreu sans recourir à un diagnostic psychologique moderne.
