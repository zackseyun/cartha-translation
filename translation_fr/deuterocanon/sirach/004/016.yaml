review_pass:
  verdict: revise
  source_fidelity: Le texte principal suit le grec et l’anglais, mais non le témoin hébreu fourni comme source originale pour cette unité. Ce témoin hébreu, malgré le signalement d’un possible décalage ou d’une divergence textuelle, donne explicitement une parole de la Sagesse qui accompagne puis éprouve le disciple. La divergence doit être signalée, mais il n’est pas justifié de reléguer sans réserve le texte-source à la note. La version révisée rend l’hébreu et conserve le grec comme lecture divergente.
  naturalness: '« S’il met sa confiance en elle » et « la recevra en héritage » sont naturels. En revanche, la note actuelle est typographiquement maladroite (« : «Car ») et « en me rendant méconnaissable » sonne moins idiomatique et moins précis que « en me faisant passer pour une étrangère ». La formulation révisée est fluide, moderne et garde le caractère volontairement éprouvant de l’expression hébraïque.'
  terminology: La Sagesse demeure féminine dans la lecture grecque (« elle », « la »). « Se faire passer pour une étrangère » rend le réflexif בהתנכר sans imposer un sens doctrinal. « Mettre à l’épreuve » et « épreuves » préservent le lexique de l’épreuve. Pour le grec, « recevoir en héritage » maintient le motif successoral, mais il est présenté comme lecture alternative.
  issues:
  - severity: high
    issue: Le texte principal ne traduit pas le témoin hébreu présenté comme source originale.
    rationale: Le projet de brouillon adopte la lecture grecque en raison d’une divergence et d’un probable décalage contextuel. Or le témoin hébreu fourni est lisible et reçoit une confiance élevée. Une traduction indépendante doit le rendre dans le texte, tout en signalant honnêtement la lecture grecque matériellement différente.
  - severity: medium
    issue: La note inverse la relation entre le texte principal et les témoins et présente un grec grammaticalement normalisé sans le signaler.
    rationale: Le grec transmis a une condition et un verbe principal à la deuxième personne, puis « ses descendants », ce qui produit un changement de personne dans la forme fournie. Il convient de ne pas le reproduire comme s’il s’agissait d’une phrase française parfaitement régulière sans aucune réserve.
  - severity: low
    issue: La note comporte une ponctuation française défectueuse et une formulation peu naturelle.
    rationale: Après les deux-points, la citation doit commencer par une espace et une majuscule ; « en me rendant méconnaissable » est moins naturel que l’expression révisée.
  revised_text: Car je marcherai avec lui en me faisant passer pour une étrangère, et d’abord je le mettrai à l’épreuve par des épreuves.[a]
  revised_footnotes:
  - marker: a
    text: 'Le grec porte plutôt : « Si tu mets ta confiance en elle, tu la recevras en héritage, et ses descendants la posséderont. » Il s’agit d’une lecture matériellement différente, qui s’accorde davantage avec la suite grecque habituelle du passage. Le changement de la deuxième à la troisième personne dans le grec transmis est conservé dans cette traduction.'
    reason: alternative_reading
  revision_rationale: La révision donne priorité au témoin hébreu fourni et ne masque pas sa divergence substantielle avec le grec. « En me faisant passer pour une étrangère » rend le réflexif « en se rendant étranger / méconnaissable » de façon idiomatique, sans décider si la distance est sociale, affective ou une forme de déguisement. La note, ancrée au verset, conserve la lecture grecque et son anomalie de personne plutôt que de l’harmoniser silencieusement.
