  text: If he trusts her, he will inherit her, and his descendants will possess her.[a]
translation:
  language: fr
  text: S’il met sa confiance en elle, il la recevra en héritage, et ses descendants la posséderont.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin hébreu conservé porte approximativement : «Car je marcherai avec lui en me rendant méconnaissable, et tout d’abord je l’éprouverai par des épreuves.» Cette formulation se rapproche davantage du contexte précédent, où la Sagesse met son disciple à l’épreuve. Le témoin grec dit plutôt : «S’il met sa confiance en elle, il la recevra en héritage, et ses descendants la posséderont.»'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν ἐμπιστεύσῃς
  choice: S’il met sa confiance en elle
  rationale: Le grec transmis emploie une condition liée à la confiance. Cette formulation française est naturelle et explicite que la Sagesse personnifiée est l’objet de cette confiance, bien que le pronom grec ne soit pas exprimé dans la proposition conditionnelle.
- source_word: κατακληρονομήσεις αὐτήν
  choice: il la recevra en héritage
  rationale: Le verbe appartient au champ lexical de l’héritage; «recevra en héritage» conserve cette nuance tout en évitant la tournure moins naturelle «héritera d’elle».
- source_word: ἐν κατασχέσει ἔσονται
  choice: la posséderont
  rationale: L’expression grecque indique la possession durable; le pronom reprend la Sagesse personnifiée.
- source_word: αἱ γενεαὶ αὐτοῦ
  choice: ses descendants
  rationale: Dans ce contexte de transmission future, «ses descendants» rend clairement le sens générationnel sans le calque ambigu «ses générations».
- source_word: כִּי בְהִתְנַכֵּר אֵלֵךְ עִמּוֹ, וּלְפָנִים אֶבְחָרֶנּוּ בְנִסְיוֹנוֹת
  choice: lecture hébraïque divergente signalée en note
  rationale: Le témoin hébreu conservé ne correspond pas au grec de ce verset et semble prolonger le thème précédent de la mise à l’épreuve. Cette divergence substantielle ne doit pas être effacée.
theological_decisions:
- issue: Choix du texte principal lorsque les témoins hébreu et grec divergent
  choice: Suivre le grec dans le texte principal et donner l’hébreu conservé en note.
  alternative: «Car je marcherai avec lui en me rendant méconnaissable, et tout d’abord je l’éprouverai par des épreuves.»
  rationale: Le grec fournit ici une suite cohérente propre au verset 16, tandis que l’hébreu transmis paraît correspondre davantage au contexte précédent. La note maintient honnêtement l’incertitude textuelle sans harmonisation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La personnification féminine de la Sagesse est maintenue par «elle» et «la». La note expose clairement la divergence majeure entre les témoins sans la résoudre silencieusement.
