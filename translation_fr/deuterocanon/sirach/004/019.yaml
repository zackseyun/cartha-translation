  text: If he turns away from me[a], I will cast him off and hand him over to plunderers.
translation:
  language: fr
  text: S’il se détourne de moi, je le rejetterai et le livrerai aux pillards.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « S’il s’égare, elle l’abandonnera et le livrera entre les mains de sa chute », ce qui peut refléter une autre leçon du texte source ou une traduction interprétative.'
    reason: alternative_reading
lexical_decisions:
- source_word: יָסוּר מֵאַחֲרַי
  choice: cesse de me suivre
  rationale: Littéralement « se détourne de derrière moi ». En français actuel, « cesser de me suivre » rend naturellement l’idée d’abandonner la suite de la Sagesse, sans lui donner nécessairement le sens plus fort d’une apostasie.
- source_word: אַשׁלִיכֶנּוּ
  choice: je le rejetterai
  rationale: Le verbe signifie littéralement « jeter ». « Rejeter » conserve ici la force de l’image tout en exprimant clairement, dans un registre digne et naturel, le retrait de la Sagesse.
- source_word: וְאַסְגִּירֶנּוּ
  choice: et le livrerai
  rationale: La forme causative de סגר exprime la remise de quelqu’un au pouvoir d’autrui. « Livrer » est idiomatique et garde cette nuance.
- source_word: לַשֹׁדְדִים
  choice: aux pillards
  rationale: Le nom hébreu désigne des gens qui pillent ou dépouillent. « Pillards » est précis et naturel; le grec présente une autre lecture, signalée en note.
theological_decisions:
- issue: Différence entre le texte hébreu et le parallèle grec
  choice: Suivre dans le texte principal l’hébreu « le livrerai aux pillards ».
  alternative: « le livrera entre les mains de sa chute » ou, plus idiomatiquement, « le livrera à sa ruine »
  rationale: Le texte hébreu conservé est ici explicite et bénéficie d’une forte validation. La leçon grecque peut refléter un autre texte hébreu sous-jacent ou une interprétation; elle est donc conservée en note sans remplacer la lecture hébraïque.
translation_notes:
  register: Français international moderne, clair et digne. Le passage à la première personne suit l’hébreu, où la Sagesse parle elle-même. « Cesse de me suivre » explicite sobrement l’idiome hébreu sans ajouter de portée doctrinale.
