  text: Those who hold fast to her will find honor from Yahweh[a], and they will be favored with the blessing of Yahweh.
translation:
  language: fr
  text: Ceux qui s’attachent à elle trouveront l’honneur venant de Yahweh[a], et ils seront favorisés par la bénédiction de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Celui qui la tient fermement héritera de la gloire, et partout où il entrera, le Seigneur bénira. » L’hébreu porte : « trouveront l’honneur venant de Yahweh » et « ils seront favorisés par la bénédiction de Yahweh ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְתֹמְכֶיהָ
  choice: Ceux qui s’attachent à elle
  rationale: Le verbe תמך signifie soutenir, tenir ou maintenir. Avec la Sagesse personnifiée, « s’attacher à elle » exprime naturellement une adhésion ferme; le grec κρατῶν αὐτῆς appuie cette nuance.
- source_word: יִמְצְאוּ
  choice: trouveront
  rationale: Rend directement le sens courant du verbe hébreu, sans adopter le grec « héritera ».
- source_word: כָבוֹד מֵיהֹוָה
  choice: auprès de Yahweh l’honneur
  rationale: כבוד désigne ici l’honneur ou l’estime accordée. « Auprès de » rend idiomatiquement la provenance indiquée par מן tout en gardant le lien direct avec Yahweh.
- source_word: וְיֻחַנּוּ
  choice: ils recevront la faveur
  rationale: Le passif de חנן indique qu’une faveur leur sera accordée. Cette formulation française est naturelle et conserve la valeur passive sans préciser davantage l’agent.
- source_word: בְּבִרְכַּת יְהֹוָה
  choice: avec la bénédiction de Yahweh
  rationale: La préposition ב peut être associative ou instrumentale. « Avec » préserve cette latitude sans imposer « par » ou « au moyen de ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu porte explicitement le tétragramme; « Yahweh » conserve le nom divin plutôt que de le remplacer par un titre.
- issue: Relation entre faveur et bénédiction
  choice: recevront la faveur avec la bénédiction
  alternative: seront favorisés par la bénédiction
  rationale: Le syntagme hébreu permet une lecture associative ou instrumentale. Le texte principal maintient cette ambiguïté au lieu de faire nécessairement de la bénédiction le moyen de la faveur.
translation_notes:
  register: Français international moderne, digne et accessible. La Sagesse personnifiée demeure désignée par le pronom féminin. La formulation suit prioritairement l’hébreu et signale en note la divergence substantielle du grec.
