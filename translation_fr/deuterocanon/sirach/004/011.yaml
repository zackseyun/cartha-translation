  text: Wisdom has instructed her children[a], and she bears witness for all who have understanding in her.
translation:
  language: fr
  text: La Sagesse a instruit ses enfants, et elle témoigne en faveur de tous ceux qui la comprennent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec dit : « La Sagesse a élevé ses fils et saisit ceux qui la cherchent. » L’hébreu conservé dit : « elle témoigne en faveur de tous ceux qui la comprennent ».'
    reason: alternative_reading
lexical_decisions:
- source_word: חָכְמוֹת
  choice: la Sagesse
  rationale: Bien que le nom ait une forme morphologiquement plurielle, il désigne ici la Sagesse personnifiée au singulier, comme le confirme le parallèle grec Ἡ σοφία.
- source_word: לִמְּדָה
  choice: a instruit
  rationale: Le verbe למד signifie « enseigner, instruire ». Le passé composé rend naturellement l’accompli hébreu dans cette affirmation sapientielle.
- source_word: בָנֶיהָ
  choice: ses enfants
  rationale: בנים peut désigner les fils ou, plus largement, les enfants. Ici, « ses enfants » exprime naturellement la relation entre la Sagesse personnifiée et ceux qui lui appartiennent sans restreindre indûment le référent aux hommes.
- source_word: וְתָעִיד
  choice: et elle témoigne
  rationale: Cette traduction conserve la valeur testimoniale de העיד et le présent convient à la portée générale de l’énoncé. Le parallèle grec présente une autre leçon.
- source_word: לְכָל
  choice: en faveur de tous
  rationale: Avec « témoigner », la préposition ל est rendue par l’expression française idiomatique « en faveur de », qui exprime ici un témoignage favorable tout en laissant perceptible la nuance juridique.
- source_word: מְבִינִים בָּהּ
  choice: ceux qui la comprennent
  rationale: Le participe מבינים exprime le discernement ou la compréhension. En français, « la comprennent » rend naturellement la construction avec ב et son suffixe renvoyant à la Sagesse, sans l’expression peu idiomatique « ont de l’intelligence en elle ».
theological_decisions:
- issue: Personnification féminine de la Sagesse
  choice: Conserver « la Sagesse » et le pronom féminin « elle »
  alternative: Traiter la sagesse comme une abstraction et éviter le pronom personnel
  rationale: L’hébreu présente la Sagesse comme une figure féminine ayant ses propres enfants; le grec maintient lui aussi cette personnification.
- issue: Divergence entre l’hébreu et le parallèle grec
  choice: Suivre l’hébreu dans le texte principal et signaler le grec en note
  alternative: 'Adopter le grec : « La Sagesse a élevé ses fils et saisit ceux qui la cherchent »'
  rationale: Le texte hébreu conservé est ici le témoin principal, mais la différence substantielle du grec mérite d’être rendue visible sans harmonisation.
- issue: Portée de « témoigne en faveur de »
  choice: Comprendre le témoignage comme favorable
  alternative: Traduire plus indéterminément par « témoigne à tous » ou donner à העיד une autre nuance
  rationale: La préposition ל et le contexte positif concernant ceux qui comprennent la Sagesse favorisent cette lecture, tout en conservant le champ lexical du témoignage.
translation_notes:
  register: Français international moderne, digne et accessible. L’article défini et la majuscule mettent en relief la Sagesse personnifiée. La formulation « ceux qui la comprennent » privilégie un français naturel tout en conservant le rapport direct à la Sagesse exprimé par בָּהּ.
