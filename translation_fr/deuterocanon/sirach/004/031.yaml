  text: Do not be proud in your speech[a], and slack and negligent in your work.
translation:
  language: fr
  text: Ne sois pas arrogant dans tes paroles[a], ni mou ni négligent dans ton travail.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente une autre forme de cette maxime : « Que ta main ne soit pas tendue pour recevoir et repliée quand il s’agit de rendre. »'
    reason: textual_variant
lexical_decisions:
- source_word: גַבְהָן
  choice: arrogant
  rationale: L’adjectif exprime la hauteur et l’orgueil. « Arrogant » est naturel en français moderne et convient à une attitude manifestée dans la parole.
- source_word: בִּלְשׁוֹנֶךָ
  choice: dans tes paroles
  rationale: Littéralement « dans ta langue ». L’expression vise ici la manière de parler; « dans tes paroles » restitue clairement ce sens sans réduire l’image à l’organe physique.
- source_word: רָפוּי
  choice: relâché
  rationale: Le terme évoque le manque de fermeté, d’application ou d’énergie. « Relâché » conserve cette nuance dans le domaine du travail.
- source_word: רָשִׁישׁ
  choice: négligent
  rationale: Ce mot rare renforce la critique précédente et désigne vraisemblablement un manque de soin ou de diligence. Un second adjectif préserve le redoublement hébreu.
- source_word: בִּמְלַאכְתֶּךָ
  choice: dans ton travail
  rationale: Le nom désigne largement le travail, la tâche ou l’activité. « Travail » est l’équivalent français moderne le plus direct.
- source_word: μὴ ἔστω ἡ χείρ σου ἐκτεταμένη εἰς τὸ λαβεῖν, καὶ ἐν τῷ ἀποδιδόναι συνεσταλμένη
  choice: témoin secondaire signalé en note
  rationale: Le grec présente une maxime sensiblement différente. Puisque l’hébreu est conservé avec une confiance élevée, il fonde le texte principal; la forme grecque est néanmoins préservée dans une note.
theological_decisions:
- issue: Divergence entre les formes hébraïque et grecque de Siracide 4.31
  choice: Traduire l’hébreu conservé dans le texte principal
  alternative: 'Suivre le grec : « Que ta main ne soit pas tendue pour recevoir et retirée quand il faut rendre. »'
  rationale: Le témoin hébreu est disponible et jugé très fiable. Le grec ne constitue pas une simple reformulation, mais transmet une maxime différente; les deux formes ne doivent donc pas être harmonisées silencieusement.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement singulier correspond aux formes hébraïques. Le parallélisme et les deux qualificatifs négatifs du second membre sont conservés.
