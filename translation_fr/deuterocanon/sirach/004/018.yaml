lexical_decisions:
- source_word: אִם
  choice: S’il
  rationale: Introduit une condition réelle ou éventuelle; « si » conserve cette valeur sans la transformer en simple indication temporelle.
- source_word: יָסוּר
  choice: s’écarte
  rationale: Le verbe סור évoque le fait de quitter une voie ou de dévier; « s’écarte » restitue naturellement cette image.
- source_word: וּנְטוֹתֵיהוּ
  choice: et se détourne d’elle
  rationale: La forme hébraïque est difficile. Dans le contexte, elle semble prolonger l’idée d’un éloignement à l’égard de la Sagesse personnifiée; le complément « d’elle » est contextuel plutôt qu’explicite dans la forme conservée.
- source_word: וַאֲסַרְתִיהוּ
  choice: elle l’enchaînera
  rationale: Le contexte favorise la Sagesse comme sujet féminin, mais la forme peut aussi se lire avec un sujet à la première personne; cette ambiguïté est signalée en note.
- source_word: בָאֲסוּרִים
  choice: l’enchaînera
  rationale: Le nom désigne des liens ou des entraves. Le français idiomatique « enchaîner » rend ensemble le verbe et son complément hébreu, littéralement « lier avec des liens ».
theological_decisions:
- issue: Sujet de וַאֲסַרְתִיהוּ
  choice: 'La Sagesse personnifiée: « elle l’enchaînera »'
  alternative: « je l’enchaînerai »
  rationale: La Sagesse est le sujet agissant dans le contexte immédiat. Toutefois, la vocalisation et l’analyse de la forme permettent une lecture à la première personne; la note maintient cette tension au lieu de la supprimer.
- issue: Rapport entre le texte hébreu et le parallèle grec
  choice: Le texte principal suit l’hébreu conservé.
  alternative: 'Suivre le grec: « Puis elle reviendra tout droit vers lui, le réjouira et lui révélera ses secrets. »'
  rationale: Le grec témoigne ici d’une forme du texte substantiellement différente. Puisque l’hébreu est conservé avec une confiance élevée, il demeure la base de la traduction, tandis que la variante grecque est documentée en note.
translation_notes:
  register: Français international moderne, sobre et digne. « S’écarte » conserve l’image de la déviation; « se détourne d’elle » explicite avec prudence la relation à la Sagesse indiquée par le contexte. « L’enchaînera » évite le tour peu naturel « le liera avec des liens », dont la forme littérale est néanmoins conservée en note.
