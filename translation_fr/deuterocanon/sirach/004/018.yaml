  text: S’il s’écarte et se détourne d’elle, elle l’enchaînera[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu peut aussi être compris ainsi : « je l’enchaînerai ». Littéralement, la fin du verset dit : « je le lierai » ou « elle le liera avec des liens », c’est-à-dire avec des entraves.'
    reason: Ambiguïté grammaticale et solution lexicale.
  - marker: b
