review_pass:
  verdict: revise
  source_fidelity: Le texte français suit à tort la lecture interprétative de la piste anglaise (« se détourne d’elle ») pour וּנְטוֹתֵיהוּ. Dans l’hébreu fourni, le suffixe -הו renvoie plutôt à « lui », et le mot demeure difficile; « d’elle » n’est pas exprimé. De même, וַאֲסַרְתִיהוּ se lit naturellement à la première personne dans cette forme hébraïque; le contexte peut expliquer une voix de la Sagesse, mais ne justifie pas de remplacer le « je » par « elle » dans le texte principal. La formulation révisée conserve l’incertitude de וּנְטוֹתֵיהוּ en note et rend explicitement les liens/entraves.
  naturalness: « S’il s’écarte, je me détournerai de lui et je le lierai avec des entraves » est compréhensible, sobre et idiomatique en français international moderne. La répétition sémantique entre « lier » et « entraves » rend, sans lourdeur excessive, l’expression hébraïque intensive « lier ... avec des liens ».
  terminology: « Entraves » convient pour אֲסוּרִים, sans imposer l’image plus précise de chaînes métalliques. La majuscule à « Sagesse » est évitée dans le texte principal, puisque le pronom de première personne peut être compris à partir du contexte sans transformer la ligne en une identification doctrinale explicite.
  issues:
  - severity: high
    issue: Ajout non exprimé de « d’elle » et analyse incertaine de וּנְטוֹתֵיהוּ comme un second mouvement du sujet masculin.
    rationale: La forme hébraïque porte un suffixe masculin singulier (« lui »), non un complément féminin (« d’elle »). Son analyse lexicale exacte est difficile; il convient de ne pas en tirer une relation à la Sagesse que le verset hébreu ne formule pas explicitement.
  - severity: high
    issue: Remplacement de la première personne de וַאֲסַרְתִיהוּ par « elle l’enchaînera ».
    rationale: La forme transmise se comprend directement comme « je le lierai » dans la conséquence de la condition. Le contexte de la Sagesse personnifiée peut éclairer l’identité du locuteur, mais la note, plutôt que le texte, doit signaler l’éventuelle analyse alternative.
  - severity: medium
    issue: Les ancres de notes sont placées après le point final.
    rationale: Les appels de note doivent accompagner l’élément ou la proposition annotée et précéder la ponctuation finale; la révision les place immédiatement après « entraves ».
  - severity: medium
    issue: La note a ne décrit pas correctement l’ambiguïté principale et la traduction efface « avec des liens ».
    rationale: La note actuelle présente « je l’enchaînerai » comme une simple alternative, alors que la première personne est la lecture morphologique immédiate; elle ne signale pas l’incertitude de וּנְטוֹתֵיהוּ. Le texte révisé rend aussi le complément בָאֲסוּרִים.
  revised_text: S’il s’écarte, je me détournerai de lui et je le lierai avec des entraves[a][b].
  revised_footnotes:
  - marker: a
    text: 'Le mot hébreu rendu par « je me détournerai de lui » est difficile et son sens précis est incertain. La forme suivante se lit naturellement : « je le lierai »; dans le contexte, le « je » peut être la Sagesse personnifiée. On peut aussi analyser la forme comme renvoyant à « elle » (la Sagesse). Littéralement, la dernière expression est « avec des liens » ou « avec des entraves ».'
    reason: Ambiguïté textuelle, grammaticale et lexicale.
  - marker: b
    text: 'Le texte grec est très différent : « Puis elle reviendra tout droit vers lui, le réjouira et lui révélera ses secrets. » Il reflète probablement une autre forme textuelle du Siracide.'
    reason: Variante textuelle.
  revision_rationale: La révision donne priorité à la morphologie et aux suffixes du texte hébreu transmis. Elle évite l’explicitation « d’elle », qui provient d’une reconstruction contextuelle attestée dans la piste anglaise mais non de la formulation hébraïque fournie. Elle garde le parallélisme grec uniquement en note et y signale sa divergence substantielle. Les deux notes sont entièrement rétablies et leurs ancres sont normalisées.
