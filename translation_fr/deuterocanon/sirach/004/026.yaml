review_pass:
  verdict: revise
  source_fidelity: La première proposition hébraïque appelle littéralement à ne pas avoir honte de « revenir / se détourner » de l’iniquité; « te détourner de l’iniquité » rend ce mouvement moral de façon fidèle. La seconde ne mentionne pas explicitement un fleuve dans le témoin hébreu, même si le grec lit « courant d’un fleuve ». Il convient donc de ne pas introduire « d’un fleuve » dans le texte principal.
  naturalness: « Revenir de l’iniquité » n’est pas une tournure naturelle en français moderne et peut suggérer un retour provenant d’un lieu. « Te détourner de l’iniquité » est idiomatique, conserve l’image directionnelle et garde un registre sobre. « Devant le courant » reste concis et fidèle; la note peut préciser l’explicitation grecque.
  terminology: « Iniquité » convient au registre sapientiel et à עָוֹן. La révision évite d’imposer « repentance » ou « confession », qui relèveraient d’une interprétation plus explicite ou de la seule version grecque.
  issues:
  - severity: medium
    issue: « revenir de l’iniquité » est peu idiomatique et sémantiquement équivoque.
    rationale: En français, on revient normalement à quelque chose ou de quelque part; la formule ne rend pas naturellement le fait de renoncer à une faute. « Se détourner de » exprime clairement le mouvement de retour hors du mal contenu dans שוב מן.
  - severity: low
    issue: « d’un fleuve » ajoute une précision absente de l’hébreu.
    rationale: Le grec parallèle explicite ῥοῦν ποταμοῦ, mais l’hébreu porte seulement שִׁבֹּלֶת. Le texte principal doit suivre le témoin hébreu, tandis que la note peut signaler la lecture grecque.
