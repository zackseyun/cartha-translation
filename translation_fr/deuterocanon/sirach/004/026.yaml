  text: Do not be ashamed to turn back from iniquity, and do not stand before the current of a river.
translation:
  language: fr
  text: N’aie pas honte de te détourner de l’iniquité, et ne te tiens pas devant le courant.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « N’aie pas honte de confesser tes péchés, et ne force pas le courant d’un fleuve. » L’hébreu et le grec diffèrent dans la première proposition et légèrement dans la seconde ; le texte suit ici l’hébreu. Le grec explicite le courant comme celui d’un fleuve.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֵּבוֹשׁ
  choice: N’aie pas honte
  rationale: Rend directement בוש dans une formulation française naturelle et actuelle, en accord avec le parallèle grec.
- source_word: לָשׁוּב
  choice: de revenir
  rationale: Préserve l’image concrète du retour exprimée par שוב sans la remplacer par le terme théologique plus explicite « se repentir ».
- source_word: מֵעָוֹן
  choice: de l’iniquité
  rationale: עָוֹן désigne ici la faute morale; « iniquité » en conserve le poids et s’articule naturellement avec « revenir de » dans un registre digne.
- source_word: וְאַל תַּעֲמוֹד לִפְנֵי
  choice: et ne te tiens pas devant
  rationale: Traduction formellement proche de עמד et לפני, qui maintient l’image d’une personne faisant face à une force dangereuse.
- source_word: שִׁבֹּלֶת
  choice: le courant d’un fleuve
  rationale: Dans ce contexte, שִׁבֹּלֶת désigne vraisemblablement un courant ou flot. Le grec ῥοῦν ποταμοῦ confirme et explicite l’image fluviale.
theological_decisions:
- issue: Faut-il rendre שוב par un vocabulaire explicitement pénitentiel ?
  choice: revenir de l’iniquité
  alternative: se repentir de son péché
  rationale: L’hébreu évoque un retour hors de la faute, tandis que le grec parle de confesser ses péchés. La traduction suit l’hébreu et conserve cette différence sans imposer une formule pénitentielle technique.
translation_notes:
  register: Français international moderne, concis et digne. Le tutoiement singulier correspond aux impératifs hébreux. « Revenir de l’iniquité » conserve volontairement une tournure légèrement imagée plutôt que de rendre le sens par un terme théologique plus technique.
