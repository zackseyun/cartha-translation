  text: Rescue the oppressed from his oppressors[a], and do not let your spirit grow impatient when judging rightly.
translation:
  language: fr
  text: Délivre l’opprimé de ceux qui l’oppriment[a], et ne laisse pas ton esprit s’impatienter quand tu rends un jugement juste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte plutôt : « Prête l’oreille au pauvre et réponds-lui paisiblement, avec douceur. » Le témoin hébreu parle ici de délivrer l’opprimé et de ne pas s’impatienter en rendant un jugement juste.'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹשַׁע
  choice: Délivre
  rationale: L’impératif appelle une intervention concrète en faveur d’une personne en détresse. « Délivre » exprime cette action sans privilégier ici le sens théologique que pourrait suggérer « sauve ».
- source_word: מוּצָק
  choice: l’opprimé
  rationale: Le terme désigne une personne soumise à la pression ou aux mauvais traitements. « L’opprimé » est naturel en français et convient au contexte social et judiciaire.
- source_word: מִמְּצִיקָיו
  choice: de ceux qui l’oppriment
  rationale: Cette formulation conserve le lien lexical avec « l’opprimé » et rend clairement le pluriel possessif hébreu, sans la lourdeur possible de « de ses oppresseurs ».
- source_word: וְאַל תָּקוֹץ רוּחֲךָ
  choice: et ne laisse pas ton esprit s’impatienter
  rationale: קוץ peut exprimer l’impatience, l’irritation, la lassitude ou le dégoût. Cette traduction garde la dimension intérieure de רוּחֲךָ et laisse subsister la nuance affective sans la durcir excessivement.
- source_word: בְּמִשְׁפַט יֹשֶׁר
  choice: quand tu rends un jugement juste
  rationale: La formulation française explicite naturellement l’action judiciaire contenue dans מִשְׁפָּט et rend יֹשֶׁר par « juste », tout en maintenant le lien circonstanciel avec l’exhortation précédente.
theological_decisions:
- issue: Divergence importante entre le texte hébreu et le parallèle grec
  choice: Suivre le témoin hébreu dans le texte principal et signaler le grec en note.
  alternative: « Prête l’oreille au pauvre et réponds-lui paisiblement, avec douceur. »
  rationale: Puisque le texte hébreu est conservé ici avec une confiance élevée, il sert de base. Le grec transmet néanmoins une formulation et une orientation sensiblement différentes; cette variante doit donc être préservée afin de ne pas masquer l’histoire textuelle.
translation_notes:
  register: Français moderne, international et digne, avec tutoiement sapientiel au singulier. La formulation reste concrète et accessible, tout en conservant le vocabulaire judiciaire et la tension du texte hébreu.
