  text: For if he cries out against you in the bitterness of his soul, his Maker will hear his plea.[a][b]
translation:
  language: fr
  text: Car s’il te maudit dans l’amertume de son âme, celui qui l’a créé entendra sa supplication.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La ligne hébraïque conservée dans les manuscrits de la Guéniza du Caire et citée pour ce verset ne correspond pas au texte grec. La traduction suit donc ici le témoin grec.
    reason: textual_variant
  - marker: b
    text: 'Ou : « appelle le jugement sur toi » ; le verbe grec peut désigner une parole hostile ou une malédiction dirigée contre quelqu’un.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καραμένου … σε
  choice: s’il te maudit
  rationale: Le participe grec exprime ici une parole hostile dirigée contre l’interlocuteur, vraisemblablement une malédiction ou un appel au jugement. « Te maudit » est naturel et conserve cette force, sans réduire l’expression à une simple plainte.
- source_word: ἐν πικρίᾳ ψυχῆς αὐτοῦ
  choice: dans l’amertume de son âme
  rationale: Cette traduction proche du grec maintient à la fois l’intensité affective de πικρία et le terme anthropologique ψυχή, sans l’interpréter plus étroitement comme « cœur ».
- source_word: τῆς δεήσεως αὐτοῦ
  choice: sa supplication
  rationale: « Supplication » rend la demande pressante adressée à Dieu et convient au registre digne du passage. « Prière » serait possible, mais expliciterait davantage son caractère religieux.
- source_word: ἐπακούσεται
  choice: entendra
  rationale: Le verbe indique une écoute favorable. « Entendra » conserve cette implication sans développer explicitement la réponse divine.
- source_word: ὁ ποιήσας αὐτόν
  choice: celui qui l’a créé
  rationale: La formulation rend directement le grec et désigne Dieu en tant que créateur de l’opprimé, sans ajouter un titre absent du texte.
theological_decisions:
- issue: Choix du témoin principal lorsque le texte hébreu fourni ne correspond pas au verset grec
  choice: Traduire le témoin grec pour le texte principal et signaler l’écart dans une note
  alternative: 'Traduire la ligne hébraïque fournie : « Fais aimer ta personne à l’assemblée, et devant l’autorité incline encore la tête »'
  rationale: La ligne hébraïque transmise ne correspond ni au contenu ni au contexte de Siracide 4.6 dans le témoin grec et paraît déplacée ou mal alignée. Le grec offre ici un texte cohérent avec l’avertissement concernant le pauvre opprimé. La note maintient néanmoins visible l’incertitude textuelle.
- issue: Portée de la parole de l’opprimé
  choice: « s’il te maudit »
  alternative: « s’il appelle le jugement sur toi » ou « s’il crie contre toi »
  rationale: Le grec évoque plus qu’un cri neutre, mais la nature exacte de la parole hostile peut être comprise comme une malédiction ou un appel au jugement. Le texte retient la formulation la plus directe et la note préserve l’autre lecture.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le parallélisme causal du grec. « Âme » et « supplication » maintiennent la gravité du passage sans archaïsme excessif.
