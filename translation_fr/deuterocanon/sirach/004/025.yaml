translation:
  language: fr
  text: Ne résiste pas à Dieu, mais humilie-toi devant lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle porte : « Ne contredis pas la vérité, et aie honte de ton manque d’instruction. » Le témoin hébreu dit plutôt : « Ne résiste pas à Dieu, mais humilie-toi devant Dieu. »'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּסָּרֵב
  choice: Ne résiste pas
  rationale: Le verbe exprime ici le refus ou l’opposition. « Résister » rend clairement cette attitude et forme un contraste naturel avec l’appel à s’humilier.
- source_word: עִם הָאֵל
  choice: à Dieu
  rationale: אֵל est ici un titre divin courant. La préposition עִם est rendue idiomatiquement avec le verbe français « résister à ».
- source_word: וְאֶל אֱלֹהִים
  choice: devant lui
  rationale: Avec הִכָּנֵעַ, אֶל indique l’orientation vers Dieu. « Devant lui » exprime naturellement la posture relationnelle demandée tout en évitant une répétition pesante de « Dieu ».
- source_word: הִכָּנֵעַ
  choice: humilie-toi
  rationale: La forme exprime le fait de s’abaisser ou de se soumettre. « Humilie-toi » conserve la force réflexive et le contraste avec la résistance à Dieu.
theological_decisions:
- issue: Divergence entre le témoin hébreu conservé et le texte grec parallèle
  choice: 'Le texte principal suit l’hébreu : opposition à Dieu et humiliation devant lui.'
  alternative: « Ne contredis pas la vérité, et aie honte de ton manque d’instruction. »
  rationale: L’hébreu conservé est retenu comme source principale. Comme le grec présente une formulation substantiellement différente, celle-ci est signalée en note sans harmoniser artificiellement les deux traditions.
translation_notes:
  register: Français moderne, sobre et direct. Le tutoiement singulier correspond aux impératifs hébreux. Le pronom « lui » allège la répétition sans modifier le référent divin.
