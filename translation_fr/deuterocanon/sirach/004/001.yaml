base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/001.yaml
  text: My son[a], do not mock the life of the poor[b], and do not grieve a poor and bitter soul.
translation:
  language: fr
  text: Mon fils, ne te moque pas de la vie du pauvre[a] et ne fais pas souffrir un pauvre à l’âme affligée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Ne prive pas le pauvre de sa vie », ce qui peut aussi se comprendre : « Ne prive pas le pauvre de ses moyens de subsistance. »'
    reason: Variante ancienne du premier membre, attestant une lecture différente de celle du texte hébreu.
  - marker: b
    text: Le mot hébreu traduit ici par « âme » peut aussi désigner la vie, le moi ou la personne.
    reason: Précision sur l’étendue sémantique de נֶפֶשׁ et préservation de l’ambiguïté anthropologique du texte.
lexical_decisions:
- source_word: בְּנִי
  choice: Mon fils
  rationale: Cette formule d’adresse propre à l’enseignement de sagesse désigne littéralement un fils. La traduction conserve le masculin singulier du texte hébreu sans limiter pour autant la portée générale de l’instruction.
- source_word: אַל תִּלְעַג
  choice: ne te moque pas
  rationale: Le verbe exprime la dérision ou le mépris. « Ne te moque pas » est direct, naturel en français moderne et garde la force éthique de l’interdiction.
- source_word: לְחַיֵּי עָנִי
  choice: de la vie du pauvre
  rationale: L’hébreu parle littéralement de la « vie » d’un pauvre, expression qui peut viser sa condition ou ses moyens d’existence. La formulation retenue préserve cette amplitude, tandis que la lecture grecque est signalée en note.
- source_word: וְאַל תַּדְאִיב
  choice: et ne fais pas souffrir
  rationale: Le verbe signifie causer de la douleur, de la peine ou du chagrin. « Faire souffrir » rend naturellement en français l’idée d’un tort affectif ou intérieur.
- source_word: נֶפֶשׁ
  choice: un pauvre / âme
  rationale: נפש peut désigner l’âme, la vie, le moi ou la personne. La construction française « un pauvre à l’âme amère » rend la personne comme objet du verbe tout en conservant explicitement la dimension intérieure du terme.
- source_word: עָנֵי
  choice: un pauvre
  rationale: Le mot désigne une personne pauvre, humble ou affligée. Dans ce contexte d’éthique sociale, « pauvre » est le choix le plus clair.
- source_word: וּמַר נָפֶשׁ
  choice: à l’âme amère
  rationale: L’expression signifie littéralement « amer d’âme » et décrit une personne profondément éprouvée ou accablée. « À l’âme amère » garde l’image hébraïque dans une formulation française intelligible et digne.
theological_decisions:
- issue: Rapport entre les témoins hébreu et grec dans le premier membre
  choice: 'Suivre dans le texte principal l’hébreu : « ne te moque pas de la vie du pauvre »'
  alternative: 'Suivre plus directement le grec : « ne prive pas le pauvre de sa vie », avec le sens possible de « ne le prive pas de ses moyens de subsistance »'
  rationale: L’hébreu conservé constitue ici la source principale et porte clairement le verbe de moquerie. Le grec témoigne toutefois d’une autre lecture ancienne, orientée vers la privation matérielle; cette variante importante est donc conservée en note sans remplacer silencieusement l’hébreu.
- issue: Adresse masculine dans l’enseignement de sagesse
  choice: Mon fils
  alternative: Mon enfant
  rationale: L’hébreu emploie une adresse filiale masculine singulière. La traduction conserve cette forme source plutôt que de la neutraliser.
- issue: Sens anthropologique de נֶפֶשׁ
  choice: Conserver l’image de l’« âme » dans l’expression « à l’âme amère »
  alternative: 'Rendre uniquement le sens personnel ou affectif : « une personne pauvre et accablée »'
  rationale: Le terme hébreu ne suppose pas nécessairement une opposition doctrinale entre âme et corps; il peut désigner la personne, sa vie ou son être intérieur. La traduction maintient l’image sans lui imposer une définition théologique étroite, et la note en explicite l’étendue sémantique.
translation_notes:
  register: Français international moderne, direct et digne. « Ne te moque pas » évite un tour littéraire inutile, tandis que « à l’âme amère » conserve l’image dense de l’hébreu. La répétition de « pauvre » reflète l’insistance du verset et clarifie les deux interdictions.
