  text: Do not withhold a word in the world, and do not hide your wisdom.
translation:
  language: fr
  text: Ne retiens pas une parole dans le monde[a], et ne cache pas ta sagesse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « N’empêche pas une parole au temps de la délivrance » (ou « du salut »). Le témoin hébreu lit plutôt : « dans le monde ».'
    reason: Lecture alternative due à une divergence importante entre les témoins hébreu et grec.
lexical_decisions:
- source_word: אַל תִּמְנַע
  choice: Ne retiens pas
  rationale: Le verbe מנע signifie couramment « retenir » ou « empêcher ». Cette formulation conserve la force de l’interdiction et convient au fait de ne pas garder une parole pour soi.
- source_word: דִּבֵּר
  choice: une parole
  rationale: Le terme désigne ici une parole ou un propos; le singulier concret est conservé, en accord avec le grec λόγον.
- source_word: בָּעוֹלָם
  choice: dans le monde
  rationale: Le témoin hébreu conservé porte littéralement « dans le monde ». Malgré son caractère inhabituel et la divergence du grec, cette formulation préserve la lecture hébraïque sans l’interpréter comme « en public » ou « au bon moment ».
- source_word: וְאַל תַּצְפִּין
  choice: et ne cache pas
  rationale: Le verbe צפן à cette forme exprime l’action de cacher ou de dissimuler. « Ne cache pas » est clair, actuel et parallèle à « ne retiens pas ».
- source_word: אֶת חָכְמָתֶךָ
  choice: ta sagesse
  rationale: חכמה correspond directement à « sagesse »; le possessif est maintenu, puisqu’il s’agit de la sagesse que le destinataire ne doit pas garder cachée.
theological_decisions:
- issue: Divergence entre l’hébreu et le grec dans le premier membre
  choice: 'Suivre dans le texte principal le témoin hébreu : « Ne retiens pas une parole dans le monde »'
  alternative: 'Suivre le grec : « N’empêche pas une parole au temps de la délivrance » ou « du salut »'
  rationale: L’hébreu conservé est ici le témoin principal et sa lecture est donnée avec une confiance élevée. Comme le grec présente une différence substantielle et théologiquement évocatrice, sa lecture est signalée en note plutôt que substituée silencieusement à l’hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure inhabituelle « dans le monde » est volontairement conservée afin de respecter le témoin hébreu et de ne pas effacer la tension textuelle avec le grec.
