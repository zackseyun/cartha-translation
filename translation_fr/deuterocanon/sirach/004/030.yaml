  language: fr
  text: Ne sois pas connu comme un homme au double langage[a], et n’habitue pas ta langue à cela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « possesseur de deux [choses] ». Il s’agit probablement d’une expression désignant une parole divisée ou trompeuse, d’où « homme au double langage ».'
