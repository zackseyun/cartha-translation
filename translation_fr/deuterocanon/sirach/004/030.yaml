  source_fidelity: 'La première interdiction rend correctement le nifal de קרא (« être appelé / connu comme ») et comprend de façon prudente בעל שתים à la lumière de la mention de la langue. Toutefois, « ne te fais pas appeler » introduit une nuance causative ou volontaire qui n’est pas exprimée par le passif hébreu. La seconde proposition, comprise comme l’interdiction d’accoutumer sa langue à ce double langage, est recevable, mais « à cela » rend le renvoi plus net en français. La note sur le grec doit aussi mieux rendre φαντασιοκοπῶν : « se livrer à des chimères » ne correspond pas bien ici au comportement présomptueux/arrogant envers les serviteurs.'
