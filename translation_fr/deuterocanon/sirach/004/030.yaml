lexical_decisions:
- source_word: אַל תִּקָּרֵא
  choice: Ne te fais pas appeler
  rationale: La tournure rend l’interdiction et le passif nifal de קרא dans un français actuel. « Ne sois pas appelé » serait plus littéral, mais moins naturel comme exhortation.
- source_word: בַּעַל שְׁתַּיִם
  choice: homme à double langage
  rationale: L’hébreu dit littéralement « possesseur de deux [choses] ». La mention immédiate de la langue oriente vers une parole divisée ou trompeuse. « À double langage » exprime ce sens sans l’élargir au comportement général comme le ferait « hypocrite ».
- source_word: וְאֶל לְשׁוֹנְךָ אַל תַּרְגֵּל
  choice: et n’y habitue pas ta langue
  rationale: Le verbe רגל exprime ici l’idée d’accoutumer. Le pronom « y » renvoie au double langage, tandis que « ta langue » conserve l’image concrète de l’hébreu.
