base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/005.yaml
  text: One crying out in bitter spirit and in the pain of his soul[a], and at the sound of his cry, his Rock will hear.
translation:
  language: fr
  text: Celui qui crie, l’esprit rempli d’amertume, dans la douleur de son âme[a] — au son de son cri, son Rocher l’entendra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente une autre forme du verset : « Ne détourne pas les yeux de celui qui supplie et ne donne à personne l’occasion de te maudire. » Le témoin hébreu met plutôt l’accent sur le cri de l’affligé et sur le Rocher qui l’entendra.'
    reason: alternative_reading
lexical_decisions:
- source_word: צוֹעֵק
  choice: Celui qui crie
  rationale: Le participe hébreu présente concrètement une personne en train de crier. Cette formulation française reste naturelle sans ajouter l’impératif propre au parallèle grec.
- source_word: מַר רוּחַ
  choice: l’esprit rempli d’amertume
  rationale: L’expression signifie littéralement « amer d’esprit ». La formulation choisie exprime une profonde détresse intérieure sans suggérer principalement une attitude acerbe envers autrui.
- source_word: בִּכְאֵב נַפְשׁוֹ
  choice: dans la douleur de son âme
  rationale: כאב désigne la douleur et נפש la personne ou son être intérieur. « Âme » conserve ici la profondeur de l’affliction sans imposer une anthropologie technique.
- source_word: וּבְקוֹל צַעֲקָתוֹ
  choice: au son de son cri
  rationale: Cette expression française restitue naturellement l’image auditive de l’hébreu, littéralement « à la voix de son cri ».
- source_word: יִשְׁמַע
  choice: l’entendra
  rationale: Le futur rend la valeur consécutive ou prospective du yiqtol dans cet avertissement sapientiel.
- source_word: צוּרוֹ
  choice: son Rocher
  rationale: Le mot hébreu signifie littéralement « son Rocher » et fonctionne comme un titre divin. La majuscule clarifie l’emploi personnel et théologique sans remplacer la métaphore par « Dieu ».
theological_decisions:
- issue: Rapport entre le témoin hébreu et le parallèle grec
  choice: Traduire uniquement le contenu attesté dans la ligne hébraïque et signaler en note la formulation sensiblement différente du grec.
  alternative: 'Intégrer dans le texte principal l’interdiction grecque : « Ne détourne pas les yeux de celui qui supplie. »'
  rationale: Le témoin hébreu fourni est déclaré de haute confiance et constitue la source principale. Il ne contient pas d’impératif explicite. Ajouter celui du grec au texte principal mêlerait deux formes textuelles distinctes; la note préserve cette différence réelle.
- issue: Sens de נפש
  choice: âme
  alternative: être, personne, vie
  rationale: Dans ce contexte, le terme désigne l’être personnel atteint par la douleur. « Âme » convient au registre sapientiel et garde l’expression ouverte, sans la transformer en définition doctrinale de la constitution humaine.
- issue: Identification de צוּרוֹ
  choice: Conserver le titre métaphorique « son Rocher ».
  alternative: son Dieu, son Créateur, son protecteur
  rationale: 'La métaphore divine est explicite dans l’hébreu et porte une valeur théologique propre : Dieu est refuge et fondement solide. La remplacer expliciterait ou réduirait indûment le texte.'
translation_notes:
  register: Français international moderne, digne et accessible. La phrase nominale initiale, fidèle à la forme hébraïque conservée, est reliée à la proposition principale par un tiret afin d’éviter d’ajouter un impératif absent de l’hébreu. « Rocher » est conservé comme titre divin métaphorique.
