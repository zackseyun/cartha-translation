base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/017.yaml
  text: And until his heart is filled with me[a], I will return and make him happy[b], and I will reveal my secrets to him.
translation:
  language: fr
  text: Et jusqu’à ce que son cœur soit rempli de moi[a], je reviendrai, je le rendrai heureux[b] et je lui révélerai mes secrets.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec porte : « jusqu’à ce qu’elle ait confiance en son âme » — ou « jusqu’à ce qu’il lui confie son âme » —, puis : « elle l’éprouvera par ses prescriptions ». Il conserve ainsi une formulation plus développée sur l’épreuve imposée par la Sagesse avant son retour favorable.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « je le bénirai » ou « je le déclarerai heureux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַד עֵת
  choice: Et jusqu’à ce que
  rationale: La locution marque une limite temporelle. Cette formulation française conserve la conjonction et introduit naturellement la proposition verbale.
- source_word: יִמָּלֵא לִבּוֹ בִּי
  choice: son cœur soit rempli de moi
  rationale: Le texte hébreu évoque littéralement le cœur rempli « de moi ». Comme la Sagesse personnifiée parle à la première personne, cette image est maintenue sans la réduire à la seule notion de confiance.
- source_word: אָשׁוּב
  choice: je reviendrai
  rationale: Le verbe שׁוב signifie normalement revenir ou se retourner. « Je reviendrai » est naturel et conserve l’idée d’un retour favorable de la Sagesse après l’épreuve.
- source_word: אֲאַשְּׁרֶנּוֹ
  choice: je le rendrai heureux
  rationale: La forme exprime le fait de rendre heureux ou de déclarer heureux. Le choix est clair en français moderne, tandis qu’une note conserve les nuances possibles de bénédiction et de proclamation.
- source_word: וְגָלִיתִי לוֹ
  choice: je lui révélerai
  rationale: גלה désigne ici l’action de découvrir ou de révéler quelque chose à quelqu’un. « Révéler » rend idiomatiquement cette communication.
- source_word: מִסְתָּרִי
  choice: mes secrets
  rationale: Le terme désigne ce qui est caché ou secret. Le pluriel français « mes secrets » est naturel et évite la coloration trop technique de « mystère ».
theological_decisions:
- issue: Rapport entre la ligne hébraïque et le parallèle grec plus développé, qui mentionne la confiance et l’épreuve
  choice: Traduire l’hébreu conservé dans le texte principal et signaler en note les éléments propres au grec.
  alternative: Introduire directement dans le verset la confiance, la crainte et l’épreuve décrites par le grec.
  rationale: L’hébreu extant doit gouverner le texte principal. Le grec éclaire le contexte de l’épreuve imposée par la Sagesse, mais ses propositions supplémentaires ne doivent pas être intégrées silencieusement à la formulation hébraïque.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la voix de la Sagesse personnifiée et l’image hébraïque inhabituelle du cœur rempli d’elle, sans explicitation doctrinale.
