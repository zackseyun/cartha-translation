  text: Do not abase yourself before a fool[b][a], and do not show partiality before rulers.
translation:
  language: fr
  text: Ne t’abaisse pas devant un insensé[a], et ne fais pas preuve de partialité devant les dirigeants[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « n’étends pas ta personne devant un insensé ». Le grec ancien confirme l’image de quelqu’un qui se place en dessous d’un autre, d’où « ne t’abaisse pas ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu de ce membre est difficile et pourrait aussi se comprendre en rapport avec le fait de faire confiance. Le grec ancien porte : « n’accepte pas le visage d’un dirigeant », expression qui appuie le sens de « ne fais pas preuve de partialité ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּצַּע ... נַפְשֶׁךָ
  choice: Ne t’abaisse pas
  rationale: Le verbe יצע évoque littéralement l’action d’étendre ou de coucher quelque chose, tandis que נַפְשֶׁךָ désigne ici la personne elle-même. Le grec ὑποστρώσῃς σεαυτόν confirme l’image de quelqu’un qui se met en dessous d’un autre. « Ne t’abaisse pas » en restitue naturellement le sens métaphorique sans surcharger le français.
- source_word: לְנָבָל
  choice: devant un insensé
  rationale: נבל désigne une personne insensée au sens moral, et non simplement quelqu’un qui manque d’intelligence. « Devant » convient à la posture sociale exprimée par la phrase.
- source_word: וְאַל תַּאֲמֵן
  choice: et ne fais pas preuve de partialité
  rationale: La forme hébraïque est difficile dans ce contexte et pourrait évoquer le fait de croire ou de faire confiance. Toutefois, le parallèle grec, μὴ λάβῃς πρόσωπον, correspond à l’idée d’accueillir favorablement le visage de quelqu’un, donc de lui accorder un traitement de faveur. La traduction retient ce sens tout en signalant l’incertitude.
- source_word: לִפְּנֵי מוֹשְׁלִים
  choice: devant les dirigeants
  rationale: מושלים désigne ceux qui gouvernent ou exercent l’autorité. « Dirigeants » est direct, actuel et suffisamment large; « devant » conserve le cadre d’une conduite adoptée en leur présence.
theological_decisions:
- issue: Sens du second membre, où תַּאֲמֵן ne correspond pas de manière transparente au parallèle grec
  choice: Comprendre la phrase comme une mise en garde contre la partialité envers les détenteurs du pouvoir
  alternative: « ne te fie pas aux dirigeants » ou « ne sois pas complaisant devant les dirigeants »
  rationale: Le témoin hébreu reste premier, mais son expression est ici difficile. Le grec ancien soutient nettement l’idée de « recevoir le visage » d’un puissant, idiome de favoritisme. Une note conserve l’autre possibilité sans imposer une harmonisation silencieuse.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement singulier suit l’adresse sapientielle hébraïque. « Insensé » conserve la portée morale de נבל; « dirigeants » rend l’autorité de מושלים sans coloration institutionnelle particulière. Les deux notes rendent visibles l’image littérale du premier membre et l’ambiguïté réelle du second.
