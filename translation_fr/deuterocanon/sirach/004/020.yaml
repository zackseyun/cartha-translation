  yaml_path: translation/deuterocanon/sirach/004/020.yaml
  text: My son[a], keep the proper time and beware of evil[c][b], and do not be ashamed for your own soul.
translation:
  language: fr
  text: Mon fils, respecte le moment opportun[a] et garde-toi du mal[b] ; n’aie pas honte de toi-même[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu transmis est difficile : il comporte הָמוֹן, mot qui signifie habituellement « multitude », « richesse » ou « tumulte ». Le grec porte simplement « respecte le moment opportun », sens suivi ici.'
    reason: textual_variant
  - marker: b
    text: Ou « crains le mal ». La formulation hébraïque est difficile, tandis que le grec dit clairement de se garder du mal.
    reason: lexical_alternative
  - marker: c
    text: Ou « n’aie pas honte de ton âme » ou « de ta vie ». L’hébreu נֶפֶשׁ et le grec ψυχή peuvent désigner l’âme, la personne elle-même ou la vie selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Mon fils
  rationale: L’hébreu porte une adresse directe au masculin singulier, caractéristique de l’enseignement de sagesse.
- source_word: עֵת הָמוֹן שְׁמֹר
  choice: respecte le moment opportun
  rationale: עֵת désigne un temps ou un moment ; le grec καιρόν confirme ici l’idée du moment approprié. Le mot הָמוֹן rend toutefois le texte hébreu transmis difficile et son incertitude est signalée en note.
- source_word: וּפְחַד מִרָע
  choice: garde-toi du mal
  rationale: Pris isolément, l’hébreu vocalisé pourrait évoquer la crainte du mal ; le parallèle grec φύλαξαι ἀπὸ πονηροῦ soutient nettement l’idée de se tenir sur ses gardes ou de se préserver du mal.
- source_word: וְאֶל נַפְשְׁךָ אַל תֵּבוֹשׁ
  choice: n’aie pas honte de toi-même
  rationale: Cette formulation française naturelle conserve l’exhortation personnelle. נֶפֶשׁ, comme le grec ψυχή, peut désigner la personne elle-même, l’âme ou la vie ; ces possibilités sont maintenues en note.
theological_decisions:
- issue: Nuance anthropologique de נֶפֶשׁ / ψυχή
  choice: toi-même
  alternative: ton âme ; ta vie
  rationale: « Toi-même » est naturel dans ce contexte sans imposer une conception particulière de l’âme comme partie distincte de la personne. La note préserve néanmoins les sens « âme » et « vie », qui restent possibles.
translation_notes:
  register: Français international moderne, sobre et digne. « Respecte le moment opportun » rend l’expression temporelle de façon idiomatique ; « garde-toi du mal » conserve la tonalité sapientielle. Les incertitudes textuelles et anthropologiques sont explicitées sans alourdir le verset.
