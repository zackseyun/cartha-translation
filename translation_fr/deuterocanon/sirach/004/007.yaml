translation:
  language: fr
  text: Tends l’oreille vers le pauvre[a] et réponds-lui paisiblement et avec humilité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec présente une forme très différente : « Rends-toi agréable à l’assemblée, et abaisse la tête devant un grand personnage. »'
    reason: alternative_reading
lexical_decisions:
- source_word: הַט ... אָזְנֶךָ
  choice: Tends l’oreille
  rationale: L’impératif de נטה avec « oreille » forme une image claire d’écoute attentive. « Tends l’oreille » est idiomatique en français moderne tout en restant proche de l’hébreu.
- source_word: לֶעָנִי
  choice: vers le pauvre
  rationale: עני peut désigner une personne pauvre, affligée ou vulnérable. « Le pauvre » est ici le rendu direct qui convient au contexte éthique.
- source_word: וַהֲשִׁיבֵהוּ
  choice: et réponds-lui
  rationale: Dans ce contexte d’écoute et de parole, la forme causative de שוב exprime l’idée de répondre ou de donner une réponse.
- source_word: שָׁלוֹם
  choice: avec paix
  rationale: שלום qualifie ici la manière de répondre. « Avec paix » conserve explicitement la notion hébraïque de paix sans la réduire à la seule douceur.
- source_word: בַּעֲנָוָה
  choice: et humilité
  rationale: ענוה désigne l’humilité ou la douceur. La coordination « avec paix et humilité » est naturelle en français et maintient les deux qualités distinctes.
theological_decisions:
- issue: Priorité du texte hébreu face à une forme grecque très différente
  choice: Traduire directement l’hébreu conservé et signaler la forme grecque en note.
  alternative: « Rends-toi agréable à l’assemblée, et incline la tête devant un grand personnage. »
  rationale: Le texte hébreu est ici bien attesté et constitue la source principale. Le grec témoigne d’une forme textuelle substantiellement différente, qui doit être conservée avec transparence sans remplacer silencieusement l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. L’image corporelle de l’oreille est conservée; « avec paix » maintient la coloration de שָׁלוֹם et évite de fusionner cette notion avec l’humilité.
