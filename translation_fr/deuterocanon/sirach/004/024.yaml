base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/024.yaml
  text: For wisdom is made known in speech[a], and understanding in the response of the tongue.
translation:
  language: fr
  text: Car la sagesse se révèle dans la parole, et l’intelligence dans la réponse de la langue.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « et l’instruction dans une parole de la langue ». Le témoin hébreu porte : « et l’intelligence dans la réponse de la langue ».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְאֹמֶר
  choice: dans la parole
  rationale: Le nom désigne ce qui est dit ou l’acte de parler. « Dans la parole » reste naturel, sans restreindre le sens à une maxime précise, et correspond au grec ἐν λόγῳ.
- source_word: נוֹדַעַת
  choice: se révèle
  rationale: Le nifal de ידע exprime ici le fait de devenir manifeste ou reconnaissable. « Se révèle » rend cette valeur en français idiomatique sans ajouter l’idée d’une révélation surnaturelle.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: Équivalent français courant et précis de חָכְמָה.
- source_word: וּתְבוּנָה
  choice: et l’intelligence
  rationale: תְּבוּנָה désigne la faculté de comprendre ou de discerner. « Intelligence » maintient clairement le parallélisme avec « sagesse ».
- source_word: בְּמַעֲנֵה
  choice: dans la réponse
  rationale: מַעֲנֶה signifie « réponse » ou « réplique ». Le choix conserve la forme nominale concrète et suit le témoin hébreu prioritaire.
- source_word: לָשׁוֹן
  choice: de la langue
  rationale: La traduction littérale conserve l’image corporelle de l’hébreu, également attestée par le grec γλώσσης.
theological_decisions:
- issue: Divergence entre l’hébreu et le grec dans le second membre
  choice: 'Suivre l’hébreu : « l’intelligence dans la réponse de la langue »'
  alternative: 'Selon le grec : « l’instruction dans une parole de la langue »'
  rationale: Le témoin hébreu, jugé fiable et validé, porte תְבוּנָה (« intelligence ») et מַעֲנֶה (« réponse »), tandis que le grec a παιδεία (« instruction ») et ῥῆμα (« parole, énoncé »). Le texte principal suit donc l’hébreu, et la variante grecque est signalée en note.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme hébreu est conservé, ainsi que l’image de la langue. La ponctuation place l’appel de note après l’ensemble du vers, puisque la note concerne le second membre.
