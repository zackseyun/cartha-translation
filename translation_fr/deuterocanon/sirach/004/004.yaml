  text: Do not withhold a gift from your poor man[a], and do not despise the request of the poor, nor give him occasion to curse you.
translation:
  language: fr
  text: Ne prive pas ton pauvre d’un don[a] ; ne méprise pas les demandes du démuni et ne lui donne pas de raison de te maudire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Ne repousse pas celui qui supplie dans la détresse et ne détourne pas ton visage du pauvre. » Ce témoin est plus court et ne contient pas la dernière proposition concernant la malédiction.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּמְנַע מַתָּן
  choice: Ne prive pas de don
  rationale: מנע exprime l’idée de retenir ou de refuser quelque chose, et מַתָּן désigne un don. Cette formulation reste proche de l’hébreu tout en étant naturelle en français.
- source_word: מִמִּסְכֵּנֶךָ
  choice: celui qui est pauvre et dépend de toi
  rationale: Le nom désigne une personne pauvre ou nécessiteuse, et le suffixe « ton » la place en relation avec la responsabilité du destinataire. La périphrase évite le peu naturel « ton pauvre » sans effacer cette relation.
- source_word: וְלֹא תִבְזֶה
  choice: ne méprise pas
  rationale: בזה signifie mépriser ou tenir pour insignifiant ; « mépriser » en restitue directement la force morale.
- source_word: שְׁאֵלוֹת דָּל
  choice: les demandes du démuni
  rationale: שְׁאֵלוֹת est un pluriel, « demandes » ou « requêtes », tandis que דָּל désigne le pauvre, le faible ou le démuni. Le pluriel est conservé.
- source_word: וְלֹא תִתֵּן לוֹ מָקוֹם
  choice: ne lui donne pas de raison
  rationale: L’expression signifie littéralement « ne lui donne pas de place ». Ici, « donner une raison » rend idiomatiquement l’idée de fournir un motif ou une occasion.
- source_word: לְקַלְלֶךָ
  choice: de te maudire
  rationale: Le verbe קלל signifie ici maudire. La traduction directe préserve l’avertissement du texte.
theological_decisions:
- issue: Choix entre le témoin hébreu complet et le parallèle grec plus court
  choice: Le texte principal suit l’hébreu, y compris la clause finale sur la malédiction.
  alternative: « Ne repousse pas celui qui supplie dans la détresse et ne détourne pas ton visage du pauvre. »
  rationale: Puisque l’hébreu est conservé avec une haute confiance, il constitue le texte source principal. Le grec témoigne d’une forme plus courte et sensiblement différente, signalée en note sans remplacer l’hébreu.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement singulier correspond aux formes hébraïques. « Celui qui est pauvre et dépend de toi » explicite avec retenue le suffixe possessif, difficile à rendre littéralement en français.
