  text: Then they called to God Most High[a], and spread out their hands to him.
translation:
  language: fr
  text: Alors ils invoquèrent le Dieu Très-Haut et tendirent les mains vers lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec poursuit : « et le Saint, du ciel, les entendit rapidement et les délivra par l’intermédiaire d’Ésaïe ».'
    reason: Variante longue du texte grec, absente du témoin hébreu fourni.
lexical_decisions:
- source_word: ויקראו
  choice: ils invoquèrent
  rationale: Le verbe קרא, construit ici avec אֶל, désigne l’appel adressé à Dieu dans la prière. « Invoquèrent » exprime clairement ce sens en français actuel et concorde avec le grec ἐπεκαλέσαντο.
- source_word: אל אל עליון
  choice: le Dieu Très-Haut
  rationale: Le premier אֶל est la préposition « vers/à », tandis que אֵל עֶלְיוֹן forme le titre divin « Dieu Très-Haut ». Cette formulation garde la construction compacte de l’hébreu.
- source_word: ויפרשו
  choice: tendirent
  rationale: פרש décrit ici le déploiement des mains dans un geste de prière. « Tendirent » est naturel en français et conserve la direction du geste.
- source_word: כפים
  choice: les mains
  rationale: כפים désigne littéralement les paumes, mais le français parle normalement de tendre les mains pour cette posture de prière.
- source_word: אליו
  choice: vers lui
  rationale: La préposition exprime l’orientation du geste en direction de Dieu ; « vers lui » restitue précisément cette nuance.
theological_decisions:
- issue: Rapport entre le témoin hébreu et le texte grec plus long
  choice: Le texte principal traduit uniquement la proposition hébraïque conservée.
  alternative: 'Intégrer la suite grecque : « et le Saint, du ciel, les entendit rapidement et les délivra par l’intermédiaire d’Ésaïe ».'
  rationale: Le témoin hébreu fourni est prioritaire et ne contient pas cette suite. Le grec confirme le contexte de prière, mais son ajout doit être signalé en note plutôt qu’inséré silencieusement dans le texte principal.
translation_notes:
  register: Français international moderne, digne et accessible. « Invoquèrent » rend explicitement l’appel à Dieu dans la prière ; « tendirent les mains vers lui » restitue naturellement le geste décrit en hébreu.
