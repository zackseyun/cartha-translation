  source_fidelity: 'Le participe hébreu המושח poursuit bien l’adresse à Élie et se rend naturellement par « toi qui as oint » / « toi qui as conféré l’onction ». Le segment מלא תשלומות est difficile et ne justifie pas de préciser « un homme » dans le texte français : le masculin n’est pas explicitement assuré par cette leçon composite. « Quelqu’un » préserve mieux l’incertitude tout en gardant le sens contextuel retenu. « pour te succéder » rend justement תחליף תחתיך.'
  naturalness: « Donner l’onction à » est compréhensible, mais « conférer l’onction à » est plus idiomatique dans un registre biblique moderne. La phrase révisée conserve une syntaxe fluide et parallèle.
  terminology: « Onction », « rétribution » et « prophète » sont des termes adéquats. « Conférer l’onction » rend l’acte de משח sans recourir à une formulation inutilement archaïque. La note grecque rend correctement la divergence substantielle, y compris « reproche » pour ἐλεγμός et « jugements de vengeance » pour κρίματα ἐκδικήσεως.
