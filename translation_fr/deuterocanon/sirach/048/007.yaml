translation:
  language: fr
  text: toi qui as conféré l’onction à quelqu’un pour accomplir des actes de rétribution[a][b], et à un prophète pour te succéder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulation hébraïque traduite par « quelqu’un pour accomplir des actes de rétribution » est difficile dans le texte composite des manuscrits de la Guéniza ; la traduction en donne le sens contextuel probable.
    reason: textual_variant
  - marker: b
    text: 'Le grec présente une leçon très différente : « qui entendis au Sinaï un reproche, et à l’Horeb des jugements de vengeance ».'
    reason: alternative_reading
lexical_decisions:
- source_word: המושח
  choice: toi qui as donné l’onction
  rationale: Le participe de משח poursuit l’adresse à Élie. La formulation française explicite le pronom relatif et rend l’acte de consacrer par l’onction sans employer le verbe rare « oindre ».
- source_word: מלא תשלומות
  choice: à un homme pour accomplir des actes de rétribution
  rationale: 'Le texte hébreu composite est difficile à cet endroit. Cette traduction suit le sens contextuel apparent : Élie confère l’onction à un agent chargé d’exécuter un jugement rétributif, tout en signalant l’incertitude en note.'
- source_word: ונביא
  choice: et à un prophète
  rationale: Le nom est sans article et désigne, dans le contexte, le prophète établi par Élie. La préposition « à » reprend naturellement la construction de « donner l’onction ».
- source_word: תחליף תחתיך
  choice: pour te succéder
  rationale: La combinaison de חלף et תחת exprime ici le remplacement dans une fonction. « Te succéder » est naturel en français et évite le sens purement spatial de « à ta place ».
- source_word: κρίματα ἐκδικήσεως
  choice: jugements de vengeance
  rationale: Cette expression appartient à la leçon grecque divergente, reproduite dans la note afin de préserver son caractère judiciaire et punitif.
theological_decisions:
- issue: Divergence importante entre le témoin hébreu conservé et la tradition grecque
  choice: Le texte principal suit l’hébreu, qui présente Élie donnant l’onction à un agent de rétribution et à un prophète appelé à lui succéder.
  alternative: 'Le grec porte : « qui entendis au Sinaï un reproche, et à l’Horeb des jugements de vengeance ».'
  rationale: L’hébreu conservé est prioritaire, mais la leçon grecque constitue un parallèle ancien substantiellement différent. Elle est donc donnée intégralement en note plutôt que harmonisée avec le texte principal.
translation_notes:
  register: Français international moderne, clair et digne. L’expression « donner l’onction » reste accessible tout en conservant le motif biblique de la consécration. La difficulté du segment hébreu et la divergence grecque sont explicitement préservées dans les notes.
