lexical_decisions:
- source_word: ויך
  choice: Il frappa
  rationale: Le verbe hébreu נכה signifie couramment « frapper ». Cette traduction directe garde la force de l’action sans employer un terme archaïque.
- source_word: מחנה אשור
  choice: le camp de l’Assyrie
  rationale: La construction hébraïque signifie littéralement « le camp de l’Assyrie ». La formulation reste naturelle en français et conserve la nuance du texte source.
- source_word: ויהמם
  choice: le plongea dans la confusion
  rationale: Le verbe המם exprime l’idée de provoquer la confusion, la panique ou la déroute. Le pronom singulier reprend naturellement « le camp ».
- source_word: במגפה
  choice: par un fléau
  rationale: מגפה désigne un fléau, souvent une calamité meurtrière ou une épidémie. « Par » rend clairement la valeur instrumentale de la préposition ב, sans préciser davantage la nature du fléau que ne le fait l’hébreu.
theological_decisions:
- issue: Divergence entre l’hébreu et le grec dans la seconde proposition
  choice: 'Suivre l’hébreu : « le plongea dans la confusion par un fléau »'
  alternative: 'Suivre le grec : « son ange les extermina »'
  rationale: L’hébreu, témoin principal ici et jugé fiable, mentionne la confusion causée par un fléau. Le grec attribue explicitement l’extermination à l’ange de Dieu. Le texte principal suit donc l’hébreu, tandis que la variante grecque est conservée en note afin de ne pas effacer cette différence textuelle et théologique.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche de l’hébreu tout en étant naturelle. « Fléau » préserve la portée relativement large de מגפה, tandis que la variante grecque est signalée intégralement en note.
