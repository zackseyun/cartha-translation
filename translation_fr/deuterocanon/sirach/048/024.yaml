translation:
  language: fr
  text: Par un esprit de puissance, il vit la fin[a] et consola les endeuillés de Sion[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit : « Dans un grand esprit, il vit les choses dernières. » L’hébreu dit : « Par un esprit de puissance, il vit la fin. »'
    reason: alternative_reading
  - marker: b
    text: 'Ou, d’après le grec : « ceux qui étaient en deuil dans Sion ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ברוח גבורה
  choice: Par un esprit de puissance
  rationale: La préposition ב peut exprimer le moyen ou la sphère, et גבורה désigne la puissance ou la force. Cette formulation suit prioritairement l’hébreu tout en conservant la possibilité d’une action inspirée.
- source_word: חזה
  choice: il vit
  rationale: Le verbe exprime ici une vision de caractère prophétique. « Il vit » reste direct et laisse le contexte porter cette nuance.
- source_word: אחרית
  choice: la fin
  rationale: אחרית peut désigner la fin, l’issue dernière ou l’avenir. « La fin » préserve la concision et concorde avec le grec τὰ ἔσχατα sans réduire l’ambiguïté.
- source_word: וינחם
  choice: et consola
  rationale: Dans cette forme et ce contexte, נחם signifie apporter du réconfort. « Consola » est naturel et digne en français.
- source_word: אבלי ציון
  choice: ceux qui pleuraient Sion
  rationale: Le groupe construit peut désigner les personnes endeuillées à cause de Sion. Cette traduction naturelle préserve ce rapport, tandis que le grec favorise plutôt une localisation dans Sion, signalée en note.
theological_decisions:
- issue: Nature de l’inspiration prophétique dans ברוח גבורה
  choice: Par un esprit de puissance
  alternative: Dans un grand esprit
  rationale: Le texte hébreu associe explicitement l’esprit à la puissance, tandis que le grec parle d’un « grand esprit ». Le texte principal suit l’hébreu et la note conserve le témoignage grec.
- issue: Rapport des endeuillés à Sion
  choice: ceux qui pleuraient Sion
  alternative: ceux qui étaient en deuil dans Sion
  rationale: L’hébreu permet naturellement de comprendre Sion comme l’objet du deuil, alors que le grec ἐν Σειών indique plus nettement le lieu. La divergence est maintenue en note plutôt que résolue silencieusement.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste proche de la structure hébraïque sans être artificielle; les divergences significatives du parallèle grec sont conservées en notes.
