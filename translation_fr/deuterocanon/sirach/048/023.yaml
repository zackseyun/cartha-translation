  text: In his days the sun stood still[b][a], and life was added to the king.
translation:
  language: fr
  text: De son temps, le soleil s’arrêta[b], et la vie du roi fut prolongée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire que la durée de vie du roi fut allongée ; dans le contexte, le roi est Ézékias.
    reason: cross_reference
  - marker: b
    text: Le grec emploie ici une expression difficile, avec « le soleil » comme sujet ; elle peut évoquer un soleil entravé ou arrêté et correspond à l’hébreu « le soleil s’arrêta ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עמד
  choice: s’arrêta
  rationale: Le verbe signifie littéralement « se tenir, rester debout » ; avec « le soleil », il exprime ici l’arrêt de sa course. « S’arrêta » restitue naturellement ce sens en français moderne. Le grec parallèle, difficile, évoque lui aussi une entrave ou une interruption.
- source_word: השמש
  choice: le soleil
  rationale: Traduction directe du nom hébreu défini.
- source_word: ונוסף על חיי המלך
  choice: la vie du roi fut prolongée
  rationale: L’hébreu dit littéralement qu’un ajout fut fait à la vie du roi. La formulation retenue exprime cette augmentation de durée dans un français naturel, sans ajouter l’idée non exprimée de « jours » ou d’« années ».
- source_word: המלך
  choice: du roi
  rationale: Le texte emploie le titre défini « le roi ». Le contexte permet de reconnaître Ézékias, mais son nom n’est pas substitué au titre dans le corps du verset.
theological_decisions:
- issue: Faut-il nommer explicitement Ézékias dans le texte principal ?
  choice: Conserver « le roi » dans le texte et identifier Ézékias en note.
  alternative: « le roi Ézékias » ou « Ézékias »
  rationale: L’hébreu porte seulement « le roi », et le contexte en fournit le référent. Cette solution respecte la formulation de la source sans rendre l’allusion obscure.
- issue: Comment rendre l’ajout à la vie du roi ?
  choice: « la vie du roi fut prolongée »
  alternative: « de la vie fut ajoutée au roi »
  rationale: La traduction retenue explicite seulement la valeur idiomatique de l’hébreu et évite en français une tournure susceptible de suggérer qu’une nouvelle vie distincte lui aurait été donnée.
translation_notes:
  register: 'Français international moderne, sobre et digne. La formulation privilégie une équivalence optimale : elle reste proche de l’image hébraïque pour le soleil, tout en rendant idiomatiquement l’ajout à la durée de vie du roi.'
