translation:
  language: fr
  text: De son vivant, il accomplit des prodiges et, à sa mort[a], ses œuvres furent merveilleuses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, en suivant de plus près le grec : « et à sa fin, ses œuvres furent merveilleuses ». L’hébreu porte « et dans sa mort »; la formulation de la dernière proposition est quelque peu difficile. Le grec en éclaire le sens général, celui d’œuvres merveilleuses liées à sa mort ou à sa fin.'
    reason: alternative_reading
lexical_decisions:
- source_word: בחייו
  choice: De son vivant
  rationale: Expression temporelle naturelle en français moderne, correspondant à « pendant sa vie » et au grec ἐν ζωῇ αὐτοῦ.
- source_word: עשה
  choice: il accomplit
  rationale: « Accomplir des prodiges » est idiomatique et digne, tout en conservant le sens simple de עשה.
- source_word: נפלאות
  choice: des prodiges
  rationale: Rend les actes extraordinaires désignés par נפלאות et concorde avec le grec τέρατα.
- source_word: ובמותו
  choice: et dans sa mort
  rationale: Suit de près l’hébreu, qui dit littéralement « dans sa mort », sans le remplacer silencieusement par la formulation grecque « à sa fin ».
- source_word: תמהי מעשה
  choice: ses œuvres furent merveilleuses
  rationale: La forme hébraïque finale est difficile; le grec θαυμάσια τὰ ἔργα αὐτοῦ confirme une prédication portant sur le caractère merveilleux de ses œuvres. « Œuvres » conserve la portée collective de מעשה.
theological_decisions:
- issue: Priorité du témoin hébreu malgré une difficulté dans la dernière proposition
  choice: Conserver « dans sa mort » et rendre la fin par « ses œuvres furent merveilleuses »
  alternative: « à sa fin, ses œuvres furent merveilleuses » ou « son œuvre fut étonnante »
  rationale: Le texte hébreu demeure la source principale. Le parallèle grec sert à confirmer le sens général de la proposition difficile sans effacer la formulation propre à l’hébreu.
translation_notes:
  register: Français moderne, sobre et digne. « De son vivant » est naturel; « prodiges » convient au registre biblique sans archaïsme marqué. La tournure inhabituelle « dans sa mort » est maintenue afin de préserver la lecture hébraïque, avec une note signalant le parallèle grec.
