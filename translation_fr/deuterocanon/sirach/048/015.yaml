base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/015.yaml
  text: Yet for all this the people did not turn back[a], and they did not cease from their sins[c][b], until they were uprooted from their land and were scattered throughout the earth.
translation:
  language: fr
  text: Malgré tout cela, le peuple ne revint pas[a] et ne cessa pas de pécher, jusqu’à ce qu’il soit arraché à son pays et dispersé par toute la terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne se repentit pas ». L’hébreu dit littéralement « ne revint pas » ; le parallèle grec emploie explicitement le verbe « se repentir ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dispersé dans tous les pays ». L’hébreu « par toute la terre / dans tout le pays » peut évoquer une vaste dispersion parmi de nombreux pays.
    reason: alternative_reading
lexical_decisions:
- source_word: בכל זאת
  choice: Malgré tout cela
  rationale: 'Cette formulation rend naturellement la valeur concessive du syntagme dans le contexte : en dépit de tout ce qui précède.'
- source_word: לא שב
  choice: ne revint pas
  rationale: Le verbe שוב signifie concrètement « revenir » ou « se détourner pour revenir ». Ici, le contexte lui donne un sens moral, mais « ne revint pas » conserve l’image hébraïque sans la remplacer dans le texte par le terme plus interprétatif « ne se repentit pas ».
- source_word: העם
  choice: le peuple
  rationale: Équivalent collectif courant de עם, naturel en français et approprié au contexte.
- source_word: ולא חדלו מחטאתם
  choice: et ne cessa pas de pécher
  rationale: Cette tournure française exprime avec clarté la persistance dans les péchés. Le singulier grammatical reprend le collectif « le peuple », tandis que le sens pluriel de חטאתם reste rendu par l’idée d’actes répétés.
- source_word: עד אשר נסחו מארצם
  choice: jusqu’à ce qu’il soit arraché à son pays
  rationale: Le verbe נסח évoque un enlèvement forcé ou un arrachement. « Arraché » garde la vigueur de l’hébreu et convient au contexte de l’exil.
- source_word: ויפוצו בכל הארץ
  choice: et dispersé par toute la terre
  rationale: פוץ exprime la dispersion. בכל הארץ peut désigner toute la terre ou l’ensemble des pays; dans le contexte de l’exil, « par toute la terre » rend bien l’ampleur de la dispersion tout en conservant l’ambiguïté de ארץ.
theological_decisions:
- issue: Sens moral de לא שב et parallèle grec μετενόησεν
  choice: ne revint pas
  alternative: ne se repentit pas
  rationale: Le témoin hébreu, ici disponible, reste prioritaire et conserve l’image du retour. Le grec confirme qu’il s’agit d’un retour moral vers Dieu; cette interprétation est indiquée en note sans effacer la métaphore hébraïque.
- issue: Étendue de בכל הארץ
  choice: par toute la terre
  alternative: dans tous les pays
  rationale: Le contexte d’exil favorise une dispersion étendue au-delà du pays d’origine. Le mot ארץ permet toutefois aussi une formulation distributive visant de nombreux pays, possibilité signalée en note.
- issue: Prolongement du texte grec après l’hébreu conservé
  choice: arrêt après « par toute la terre »
  alternative: ajout de « le peuple fut réduit à un très petit nombre, et un chef subsista pour la maison de David »
  rationale: Le texte principal suit le témoin hébreu conservé, conformément à la priorité de la source hébraïque. Le prolongement grec constitue une variante textuelle significative et doit être signalé sans être introduit silencieusement dans le corps du verset.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve le mouvement solennel du jugement et de l’exil, sans archaïsmes. Les deux marqueurs de note [a] et [b] figurent dans le texte principal.
