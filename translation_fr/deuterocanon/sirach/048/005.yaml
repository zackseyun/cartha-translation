  text: who raised up a corpse from death[a], and from Sheol, by the will of Yahweh.
translation:
  language: fr
  text: lui qui a relevé un mort de la mort et du séjour des morts, selon la volonté du Seigneur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec porte : « par la parole du Très-Haut » ; le témoin hébreu lit : « selon la volonté du Seigneur ».'
    reason: textual_variant
lexical_decisions:
- source_word: המקים
  choice: qui a relevé
  rationale: Le participe hifil de קום décrit ici l’action d’Élie faisant revenir un mort à la vie. « Relever » conserve l’image du relèvement sans imposer toute la portée théologique ultérieure de « ressusciter ».
- source_word: גוע
  choice: un mort
  rationale: Le terme désigne ici celui qui a expiré. « Un mort » est naturel et digne en français, tout en correspondant au singulier du parallèle grec νεκρόν.
- source_word: ממות
  choice: de la mort
  rationale: 'La préposition מן exprime la séparation ou la sortie : le mort est relevé « de la mort ». Cette formulation préserve la concision du texte hébreu.'
- source_word: ומשאול
  choice: et du séjour des morts
  rationale: שאול désigne le domaine des morts. « Séjour des morts » est clair en français moderne et évite les connotations particulières que pourraient introduire « enfer », « Hadès » ou une simple réduction à « tombe ».
- source_word: כרצון יהוה
  choice: selon la volonté du Seigneur
  rationale: L’hébreu porte littéralement « selon la volonté de YHWH ». Le texte hébreu, témoin principal, est suivi dans le corps du verset ; la variante grecque est signalée en note.
- source_word: יהוה
  choice: le Seigneur
  rationale: Le tétragramme est rendu selon l’usage français traditionnel et respectueux par « le Seigneur ».
theological_decisions:
- issue: Formule d’action divine à la fin du verset
  choice: selon la volonté du Seigneur
  alternative: par la parole du Très-Haut
  rationale: Le témoin hébreu lit כרצון יהוה, tandis que le grec porte ἐν λόγῳ Ὑψίστου. La lecture hébraïque est retenue dans le texte principal conformément à la priorité donnée à la source hébraïque, et la variante grecque est conservée en note afin de ne pas effacer la différence théologique entre volonté et parole divines.
translation_notes:
  register: Français moderne, courant et digne. La structure poétique concise est préservée. « Séjour des morts » rend le shéol de manière intelligible sans l’assimiler à l’enfer. Le marqueur de note est placé après la proposition concernée, à la fin du verset.
