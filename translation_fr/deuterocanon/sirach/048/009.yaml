translation:
  language: fr
  text: toi qui as été enlevé vers les cieux dans une tempête[a], parmi des troupes de feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « toi qui as été enlevé dans une tempête de feu, dans un char avec des chevaux de feu ». Cette formulation plus développée rend plus explicite l’allusion à l’enlèvement d’Élie en 2 Rois 2.11.'
    reason: Formulation grecque parallèle, plus développée que le témoin hébreu.
lexical_decisions:
- source_word: הנלקח
  choice: toi qui as été enlevé
  rationale: Le participe passif de לקח désigne ici Élie emporté par Dieu. « Enlevé » exprime le mouvement d’ascension confirmé par le parallèle grec, tandis que « toi qui » s’insère naturellement dans l’adresse à Élie du contexte.
- source_word: בסערה
  choice: dans une tempête
  rationale: סערה désigne une tempête ou un vent violent. « Tempête » reste proche du témoin hébreu sans lui imposer la formulation traditionnelle « tourbillon » de 2 Rois 2.11.
- source_word: מעלה
  choice: vers les cieux
  rationale: La forme exprime ici un mouvement vers le haut. « Vers les cieux » rend clairement cette direction dans le contexte de l’ascension, sans prétendre lever toute la difficulté de la forme hébraïque.
- source_word: ובגדודי אש
  choice: parmi des troupes de feu
  rationale: גדודים signifie normalement « bandes », « troupes » ou « formations ». Le texte hébreu ne mentionne explicitement ni char ni chevaux; « troupes de feu » conserve donc son image propre et sa tension avec le grec.
- source_word: שמים
  choice: les cieux
  rationale: Le pluriel hébreu שמים se rend naturellement par « les cieux » et convient au mouvement ascendant évoqué.
theological_decisions:
- issue: Faut-il harmoniser le texte hébreu avec 2 Rois 2.11 et la forme grecque plus explicite?
  choice: 'Conserver dans le texte principal l’image hébraïque moins explicite: « vers les cieux… parmi des troupes de feu »; signaler la forme grecque en note.'
  alternative: « enlevé dans une tempête de feu, sur un char tiré par des chevaux de feu »
  rationale: Le témoin hébreu conservé a priorité et ne contient explicitement ni « char » ni « chevaux ». La note rend néanmoins accessible la variante grecque ancienne et son allusion plus transparente à l’enlèvement d’Élie.
translation_notes:
  register: Français international moderne, clair et digne. Le passé composé évite un archaïsme inutile; « troupes de feu » conserve l’image inhabituelle du texte hébreu au lieu de l’assimiler silencieusement aux chars de 2 Rois.
