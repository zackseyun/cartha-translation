  text: By his word he restrained the heavens[b][a], and brought down fire three times.
translation:
  language: fr
  text: Par sa parole, il retint les cieux[a] et fit descendre le feu à trois reprises[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Par la parole du Seigneur, il ferma le ciel. » L’hébreu est ici plus condensé et difficile.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « trois feux » ; le sens paraît être qu’il fit descendre le feu à trois reprises.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בדבר אל
  choice: Par sa parole
  rationale: Le texte hébreu transmis est condensé et quelque peu difficile. Dans le contexte, la parole est celle d’Élie, sujet du passage. Cette formulation garde l’hébreu au premier plan sans introduire dans le corps du texte la précision « du Seigneur » propre au parallèle grec.
- source_word: עצר שמים
  choice: il retint les cieux
  rationale: Le verbe עצר exprime l’idée de retenir ou de fermer. La traduction conserve l’image des cieux privés de pluie sans expliciter la pluie, que ce verset hébreu ne nomme pas.
- source_word: ויורד
  choice: fit descendre
  rationale: 'Cette tournure rend clairement la valeur causative du verbe : Élie provoqua la descente du feu.'
- source_word: שלוש אשות
  choice: le feu à trois reprises
  rationale: 'L’hébreu dit littéralement « trois feux », tandis que le grec τρὶς πῦρ confirme le sens adverbial : le feu descendit en trois occasions.'
theological_decisions:
- issue: Faut-il préciser « du Seigneur » dans la première proposition d’après le parallèle grec ?
  choice: Maintenir « Par sa parole » dans le texte principal.
  alternative: « Par la parole du Seigneur, il ferma le ciel. »
  rationale: Le témoin hébreu conservé demeure prioritaire, bien que sa formulation soit difficile. Le grec explicite l’autorité divine derrière l’action d’Élie ; cette variante est signalée en note plutôt qu’intégrée silencieusement au texte.
translation_notes:
  register: Français international moderne, sobre et digne. « Les cieux » conserve l’image biblique de l’hébreu, tandis que « à trois reprises » évite l’ambiguïté que créerait en français la traduction littérale « trois feux ».
