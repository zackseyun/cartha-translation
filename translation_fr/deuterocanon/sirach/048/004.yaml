  source_fidelity: 'Le premier membre suit fidèlement l’hébreu : « Que tu es redoutable, Élie ! » rend bien l’exclamation מה נורא אתה. Le second membre est une question rhétorique dont la formulation hébraïque transmise est quelque peu inhabituelle; le parallèle grec confirme le sens général « qui est comme toi pour se glorifier / se vanter ? ». « Qui, comme toi, peut se glorifier ? » préserve mieux ce rapport comparatif que « qui peut se glorifier comme toi ? ».'
  naturalness: Le français est naturel, soutenu sans être archaïque. « Redoutable » convient ici au sens d’impressionnant et suscitant la crainte admirative. La légère réorganisation du second membre rend la question plus directement idiomatique.
  terminology: « Élie » est la forme française usuelle. « Se glorifier » maintient le registre élevé et peut exprimer ici l’idée de se prévaloir de ses hauts faits, sans imposer une lecture moralement péjorative. La note doit rendre ἐν τοῖς θαυμασίοις σου par « dans tes merveilles / prodiges », et non « par tes prodiges », qui modifie la relation exprimée par le grec.
