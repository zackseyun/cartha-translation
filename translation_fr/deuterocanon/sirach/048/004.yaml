translation:
  language: fr
  text: Que tu es redoutable[a], Élie ! Et qui, comme toi, peut se glorifier ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec dit : « Comme tu as été glorifié, Élie, dans tes prodiges ! Et qui est semblable à toi pour se glorifier ? » L’hébreu porte plus littéralement : « Que tu es redoutable, Élie ! », lecture suivie ici.'
    reason: alternative_reading
lexical_decisions:
- source_word: מה נורא
  choice: Que tu es redoutable
  rationale: La tournure exclamative hébraïque exprime une admiration saisie de crainte. « Redoutable » conserve cette dimension de crainte révérencielle, contrairement à des formulations plus faibles comme « impressionnant ».
- source_word: אתה
  choice: tu es
  rationale: Dans cette proposition nominale, le pronom indépendant appelle naturellement le présent en français. Le passé du parallèle grec ne doit pas remplacer la formulation du témoin hébreu.
- source_word: אליהו
  choice: Élie
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: ואשר כמוך יתפאר
  choice: Et qui peut se glorifier comme toi ?
  rationale: Malgré la forme transmise אשר, le contexte et le parallèle grec indiquent une question rhétorique. « Se glorifier » rend יתפאר dans un registre digne et évite la connotation uniquement péjorative de « se vanter » ; « peut » restitue naturellement en français la portée de la question.
theological_decisions:
- issue: Écart mineur entre le témoin hébreu et le parallèle grec
  choice: Suivre l’hébreu « Que tu es redoutable » tout en utilisant le grec pour confirmer la portée interrogative du second membre.
  alternative: « Comme tu as été glorifié, Élie, par tes prodiges ! Et qui est semblable à toi pour se glorifier ? »
  rationale: Le témoin hébreu disponible est prioritaire et porte explicitement la nuance de crainte admirative de נורא. Le grec atteste une formulation différente dans le premier membre, mais éclaire utilement la syntaxe rhétorique du second sans effacer la lecture hébraïque.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement convient à l’adresse directe à Élie. « Redoutable » garde l’alliance d’admiration et de crainte du texte hébreu ; « se glorifier » maintient le registre élevé de la maxime sans imposer une condamnation morale du fait de se vanter.
