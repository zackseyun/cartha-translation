translation:
  language: fr
  text: Il brisa leur bâton de pain[a] et, dans son zèle, il réduisit leur nombre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « le bâton de pain », expression hébraïque désignant le soutien ou l’approvisionnement alimentaire ; le grec parallèle dit : « il fit venir sur eux une famine ».'
    reason: Clarifie l’idiome hébraïque conservé dans le texte et signale l’interprétation explicite du parallèle grec.
lexical_decisions:
- source_word: וישבר
  choice: Il brisa
  rationale: Le verbe שבר signifie directement « briser ». Cette formulation conserve l’image concrète et le sujet singulier, Élie, implicite dans le contexte.
- source_word: מטה לחם
  choice: le bâton du pain
  rationale: L’expression hébraïque désigne ce qui soutient la vie, autrement dit les réserves ou l’approvisionnement en nourriture. La traduction conserve l’image biblique, expliquée en note; le grec parallèle, λιμόν, en confirme le sens de famine.
- source_word: ובקנאתו
  choice: et, dans son zèle
  rationale: קנאה peut exprimer la jalousie ou le zèle. Dans ce contexte relatif à l’ardeur d’Élie, « zèle » est naturel et juste, tandis que « dans » reflète la préposition ב sans imposer une causalité plus précise.
- source_word: המעיטם
  choice: il réduisit leur nombre
  rationale: Le hifil de מעט signifie rendre peu nombreux, diminuer. « Réduisit leur nombre » exprime clairement la force résultative et correspond au grec ὠλιγοποίησεν, tout en restant naturel en français.
- source_word: λιμόν
  choice: famine
  rationale: Le parallèle grec interprète explicitement l’expression hébraïque « bâton du pain » comme une famine; cette lecture est signalée dans la note sans remplacer le texte hébreu dans le corps du verset.
theological_decisions:
- issue: Traduire littéralement ou expliciter l’expression hébraïque מטה לחם
  choice: Conserver « le bâton du pain » dans le texte et expliquer en note qu’il s’agit des ressources alimentaires.
  alternative: « Il fit venir sur eux la famine » ou « Il brisa leur approvisionnement en nourriture ».
  rationale: Le témoin hébreu est prioritaire et son image mérite d’être préservée. Le grec parallèle confirme le sens idiomatique, sans obliger à effacer la métaphore hébraïque.
- issue: Portée de המעיטם
  choice: « il réduisit leur nombre »
  alternative: « il les diminua » ou « il les rendit peu nombreux ».
  rationale: La formulation retenue conserve l’idée d’une diminution du nombre sans préciser au-delà du texte le moyen ou l’étendue de cette réduction.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore biblique inhabituelle est conservée afin de rester proche de l’hébreu, mais elle est immédiatement éclairée par une note. Le passé simple convient au registre narratif et sapientiel.
