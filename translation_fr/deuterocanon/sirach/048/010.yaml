translation:
  language: fr
  text: lui qui a été désigné pour le temps fixé, afin d’apaiser la colère avant l’ardente fureur de Dieu[a], de ramener le cœur des pères vers leurs enfants[b], et de rétablir les tribus d’Israël[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit plus brièvement : « apaiser la colère avant la fureur ».'
    reason: alternative_reading
  - marker: b
    text: 'L’hébreu porte les pluriels « pères » et « fils/enfants » ; le grec a le singulier : « le cœur d’un père vers son fils ».'
    reason: textual_variant
  - marker: c
    text: Le grec lit « les tribus de Jacob » ; l’hébreu, « les tribus d’Israël ».
    reason: textual_variant
lexical_decisions:
- source_word: הכתוב נכון לעת / ὁ καταγραφεὶς ἐν ἐλεγμοῖς εἰς καιρούς
  choice: qui a été désigné pour le temps fixé
  rationale: 'L’hébreu transmis est difficile : הכתוב signifie normalement « écrit », tandis que נכון לעת évoque une personne préparée ou destinée à un moment déterminé. Le grec confirme l’idée de quelqu’un inscrit ou désigné en vue de temps fixés. Cette formulation française exprime la destination prophétique sans imposer une interprétation trop précise du passage obscur.'
- source_word: להשבית אף / κοπάσαι ὀργήν
  choice: afin d’apaiser la colère
  rationale: Le verbe hébreu signifie « faire cesser », et le grec « arrêter, calmer ». « Apaiser la colère » est naturel en français et conserve l’idée d’en arrêter les effets.
- source_word: לפני חרון אל / πρὸ θυμοῦ
  choice: avant que n’éclate la fureur de Dieu
  rationale: Le texte hébreu nomme explicitement Dieu et emploie une expression forte désignant sa colère ardente. La tournure française restitue cette image et le rapport temporel marqué par לפני.
- source_word: להשיב לב אבות על בנים / ἐπιστρέψαι καρδίαν πατρὸς πρὸς υἱόν
  choice: de ramener le cœur des pères vers leurs enfants
  rationale: Le texte hébreu porte les pluriels « pères » et « fils/enfants », tandis que le grec emploie le singulier. « Enfants » convient au sens relationnel de בנים, et « ramener le cœur » préserve l’idiome prophétique sans le réduire à une paraphrase telle que « réconcilier ».
- source_word: ולהכין שבטי ישראל / καταστῆσαι φυλὰς Ἰακώβ
  choice: de rétablir les tribus d’Israël
  rationale: להכין peut signifier préparer, affermir ou remettre en ordre, et καταστῆσαι établir. « Rétablir » convient au contexte de restauration prophétique. « Israël » suit ici l’hébreu conservé.
theological_decisions:
- issue: Articulation des témoins hébreu et grec dans un passage où l’hébreu subsiste mais présente une formulation difficile
  choice: Suivre principalement le sens du texte hébreu conservé, en utilisant le grec pour éclairer la clause initiale obscure.
  alternative: 'Traduire plus formellement le grec : « lui qui fut inscrit parmi les avertissements pour les temps fixés ».'
  rationale: L’hébreu est le témoin original direct disponible pour ce verset, mais son ouverture est difficile. Le grec soutient l’idée d’une désignation en vue d’un temps déterminé sans permettre de résoudre avec certitude chaque détail.
- issue: Formule prophétique du retour du cœur des pères
  choice: Conserver l’image « ramener le cœur » et les pluriels du texte hébreu.
  alternative: « réconcilier les pères avec leurs enfants » ou, selon le grec, « ramener le cœur d’un père vers son fils ».
  rationale: L’idiome maintient l’écho prophétique et sa portée ouverte, sans transformer l’action décrite en une interprétation sociale ou doctrinale plus développée que le texte.
- issue: Identification de la colère comme colère divine
  choice: Expliciter « de Dieu » conformément à l’hébreu.
  alternative: 'Suivre la forme grecque plus brève : « avant la fureur ».'
  rationale: Le nom אל est présent dans le témoin hébreu et doit être traduit. Cette lecture rend explicite le caractère divin de la colère sans ajout interprétatif.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la série d’infinitifs exprimant la mission prophétique. Les variantes significatives entre l’hébreu et le grec sont signalées sans surcharger le texte principal.
