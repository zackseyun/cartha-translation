base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/018.yaml
  text: In his days Sennacherib came up and sent Rabshakeh[a]; he stretched out his hand against Zion and blasphemed in his pride.
translation:
  language: fr
  text: De son temps, Sennachérib monta, envoya le Rab-Shaké, étendit sa main contre Sion et blasphéma dans son orgueil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle porte : « et il se glorifia dans son arrogance ». Le texte hébreu parle plutôt de blasphème ; c’est cette leçon qui est suivie dans le texte principal.'
    reason: alternative_reading
lexical_decisions:
- source_word: עלה
  choice: monta
  rationale: Le verbe עלה signifie couramment « monter » et peut décrire une avancée militaire. « Monta » conserve l’image directionnelle de l’hébreu, également attestée par le grec ἀνέβη.
- source_word: וישלח
  choice: envoya
  rationale: Traduction directe et naturelle de שלח dans ce récit historique.
- source_word: רבשקה
  choice: le Rab-Shaké
  rationale: Le terme est le titre assyrien traditionnellement transcrit « Rab-Shaké » en français. L’article français permet de le lire naturellement comme un titre, sans le remplacer par une fonction conjecturale.
- source_word: ויט ידו
  choice: Il étendit la main
  rationale: L’expression idiomatique נטה יד décrit ici un geste hostile. La traduction formelle garde l’image sans expliciter davantage l’action militaire.
- source_word: על ציון
  choice: contre Sion
  rationale: Dans ce contexte d’hostilité, על prend naturellement le sens de « contre ».
- source_word: ויגדף
  choice: blasphéma
  rationale: גדף désigne une parole outrageante ayant souvent une portée impie. « Blasphéma » conserve cette force théologique, plus nettement que « insulta » ou « outragea ».
- source_word: בגאונו
  choice: dans son orgueil
  rationale: גאון exprime ici l’élévation arrogante. « Dans son orgueil » est concis, digne et idiomatique.
theological_decisions:
- issue: Rapport entre la finale hébraïque (« il blasphéma dans son orgueil ») et la parallèle grecque (« il se glorifia dans son arrogance »)
  choice: 'Suivre l’hébreu conservé dans le texte principal : « et blasphéma dans son orgueil »'
  alternative: « et se glorifia dans son arrogance »
  rationale: L’hébreu est ici le témoin principal et porte explicitement le sens de parole impie par גדף. La leçon grecque présente une nuance réelle, moins directement blasphématoire, qui est signalée en note afin de préserver la variation textuelle sans l’aplanir.
- issue: Objet implicite du blasphème dans ויגדף אל בגאונו
  choice: Ne pas ajouter explicitement « contre Dieu »
  alternative: « blasphéma contre Dieu dans son orgueil »
  rationale: La construction hébraïque est difficile et peut orienter vers Dieu comme objet, mais l’ajout explicite résoudrait une ambiguïté que le texte ne formule pas sans équivoque. Le verbe « blasphéma » maintient la portée impie tout en laissant l’objet implicite.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste proche des images hébraïques tout en étant immédiatement compréhensible. « Rab-Shaké » conserve le titre historique traditionnel; la note rend compte de la divergence significative du grec.
