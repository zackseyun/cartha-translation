  text: Then a prophet arose like fire[b][a], and his words were like a burning furnace.
translation:
  language: fr
  text: Alors se leva un prophète pareil au feu[a], et ses paroles étaient comme une fournaise ardente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec précise : « Alors se leva Élie, le prophète, pareil au feu. » L’hébreu dit simplement : « un prophète se leva, pareil au feu », bien que le contexte concerne clairement Élie.'
    reason: alternative_reading
  - marker: b
    text: 'Le grec porte : « et sa parole brûlait comme une torche ». L’hébreu dit : « et ses paroles étaient comme une fournaise ardente ».'
    reason: textual_variant
lexical_decisions:
- source_word: עד אשר
  choice: Alors
  rationale: Dans ce contexte, l’expression sert de transition narrative. « Alors » rend naturellement la progression du discours sans imposer la valeur strictement limitative de « jusqu’à ce que ».
- source_word: קם
  choice: se leva
  rationale: Cette formulation naturelle et digne exprime l’apparition publique d’une figure prophétique et correspond aussi au grec ἀνέστη.
- source_word: נביא
  choice: un prophète
  rationale: L’hébreu ne donne pas ici le nom d’Élie. L’indéfini respecte donc le témoin principal, tandis que le contexte permet d’identifier le prophète.
- source_word: כאש
  choice: pareil au feu
  rationale: Cette comparaison directe conserve la force de l’image hébraïque dans un français courant et soutenu.
- source_word: ודבריו
  choice: et ses paroles
  rationale: Le pluriel explicite de l’hébreu est maintenu, malgré le singulier du parallèle grec.
- source_word: כתנור בוער
  choice: étaient comme une fournaise ardente
  rationale: « Fournaise » restitue ici avec force תנור, et « ardente » exprime בוער dans une tournure française idiomatique et poétique.
theological_decisions:
- issue: Faut-il nommer explicitement Élie dans le texte principal ?
  choice: Ne pas ajouter son nom et traduire l’hébreu par « un prophète ».
  alternative: « Alors se leva Élie, le prophète, pareil au feu »
  rationale: Le témoin hébreu principal ne nomme pas Élie, contrairement au grec. Le texte principal suit l’hébreu, et la note préserve l’autre lecture ainsi que l’identification claire donnée par le contexte.
- issue: Faut-il harmoniser le second membre avec le grec ?
  choice: Conserver le pluriel « ses paroles » et l’image hébraïque de la fournaise ardente.
  alternative: « et sa parole brûlait comme une torche »
  rationale: L’hébreu et le grec diffèrent quant au nombre et à l’image. Puisque l’hébreu est disponible et constitue ici le témoin principal, sa formulation reste dans le texte, tandis que la variante grecque est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme en deux membres et les images vigoureuses de l’hébreu sont conservés sans explicitation confessionnelle.
