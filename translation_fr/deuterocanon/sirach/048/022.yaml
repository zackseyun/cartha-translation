base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/022.yaml
  text: For Hezekiah did what was good[a], and was strong in the ways of David, as Isaiah the prophet commanded him[b], the one praised among the prophets.
translation:
  language: fr
  text: Car Ézéchias fit ce qui était bien[a] et se montra ferme dans les voies de David, comme le lui avait ordonné le prophète Ésaïe[b], celui qui est célébré parmi les prophètes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « fit ce qui plaisait au Seigneur ». L’hébreu conservé dit simplement : « fit ce qui était bien ».'
    reason: alternative_reading
  - marker: b
    text: 'Le grec décrit plutôt Ésaïe comme « le grand prophète, fidèle dans sa vision ». L’hébreu dit : « celui qui est célébré parmi les prophètes ».'
    reason: textual_variant
lexical_decisions:
- source_word: כי
  choice: Car
  rationale: Introduit naturellement une explication liée à l’éloge du contexte, tout en conservant la valeur connective de l’hébreu.
- source_word: עשה ... את הטוב
  choice: fit ce qui était bien
  rationale: Rend idiomatiquement l’expression hébraïque « fit le bien », sans ajouter « au Seigneur », absent du témoin hébreu.
- source_word: ויחזק
  choice: se montra ferme
  rationale: Exprime la valeur intransitive ou réfléchie possible de חזק sans lui attribuer un complément absent du texte.
- source_word: בדרכי דוד
  choice: dans les voies de David
  rationale: Conserve l’image biblique des « voies » pour désigner une conduite modelée sur celle de David.
- source_word: כאשר צוהו
  choice: comme le lui avait ordonné
  rationale: Préserve la force de צוה et indique clairement qu’Ésaïe avait donné cet ordre à Ézéchias.
- source_word: ישעיה הנביא
  choice: le prophète Ésaïe
  rationale: Ordre naturel en français moderne pour ce titre et ce nom propre.
- source_word: המהלל בנביאים
  choice: celui qui est célébré parmi les prophètes
  rationale: Restitue l’apposition et le sens passif du texte hébreu transmis, sans adopter la description divergente du grec.
theological_decisions:
- issue: Faut-il inclure « au Seigneur » d’après le grec ?
  choice: Omission dans le texte principal
  alternative: fit ce qui plaisait au Seigneur
  rationale: Le témoin hébreu conservé dit seulement « fit ce qui était bien ». La précision grecque est signalée en note sans remplacer la lecture hébraïque.
- issue: Description finale d’Ésaïe
  choice: celui qui est célébré parmi les prophètes
  alternative: le grand prophète, fidèle dans sa vision
  rationale: L’hébreu et le grec divergent sensiblement. Puisque l’hébreu est conservé, il régit le texte principal ; la variante grecque demeure documentée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste proche de l’hébreu tout en évitant une syntaxe artificielle ; les divergences significatives du grec sont conservées en notes.
