  yaml_path: translation/deuterocanon/sirach/048/013.yaml
  text: In his days he did not tremble before anyone[a], and no flesh mastered his spirit. No word was too wondrous for him[b], and beneath him his flesh was created.
translation:
  language: fr
  text: De son vivant, rien ne le fit trembler, et aucun mortel ne domina son esprit. Aucune chose ne lui était trop difficile[a], et dans son sommeil, son corps prophétisa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Aucune parole » ou « Aucune affaire ». Le mot hébreu peut désigner une parole, une chose ou une affaire.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec parallèle lit : « dans son sommeil, son corps prophétisa ». L’hébreu conservé est difficile et se lirait littéralement : « et sous lui sa chair fut créée ». Dans le contexte, le « sommeil » peut évoquer la mort.'
    reason: textual_variant
lexical_decisions:
- source_word: מימיו לא זע מכל
  choice: De son vivant, rien ne le fit trembler
  rationale: מימיו situe l’affirmation durant sa vie; זע exprime le fait de trembler ou d’être ébranlé, et מכל a ici une portée générale. La formulation française reste naturelle sans imposer à מכל un référent exclusivement personnel.
- source_word: ולא משל ברוחו כל בשר
  choice: et aucun mortel ne domina son esprit
  rationale: כל בשר, littéralement « toute chair », désigne les êtres humains; dans une proposition négative, « aucun mortel » en rend clairement le sens. משל ברוחו exprime l’exercice d’une domination sur son esprit.
- source_word: כל דבר לא נפלא ממנו
  choice: Aucune affaire n’était trop extraordinaire pour lui
  rationale: דבר peut désigner une parole, une chose ou une affaire. « Affaire » convient au sens large, tandis que « trop extraordinaire » conserve la valeur de נפלא sans transformer explicitement l’expression en « impossible » ou « caché ».
- source_word: καὶ ἐν κοιμήσει ἐπροφήτευσεν τὸ σῶμα αὐτοῦ
  choice: et dans son sommeil, son corps prophétisa
  rationale: Le dernier membre de l’hébreu transmis est difficile et paraît textuellement altéré. Le grec offre une lecture cohérente, rendue ici au plus près; dans ce contexte, « sommeil » évoque vraisemblablement la mort d’Élisée.
theological_decisions:
- issue: Choix du témoin textuel pour le dernier membre du verset
  choice: 'Suivre le parallèle grec: « dans son sommeil, son corps prophétisa »'
  alternative: 'Suivre littéralement l’hébreu transmis: « sous lui sa chair fut créée »'
  rationale: Le texte hébreu conservé produit ici un sens obscur et probablement altéré, tandis que le grec est cohérent avec le récit de l’efficacité posthume du corps d’Élisée. Une note signale clairement la variante au lieu de dissimuler l’incertitude.
- issue: Interprétation de κοιμήσει
  choice: Conserver l’image du « sommeil » dans le texte et expliquer son probable sens funéraire en note
  alternative: Traduire directement « dans la mort »
  rationale: Cette solution préserve la métaphore grecque et son ouverture formelle, tout en donnant au lecteur l’information contextuelle nécessaire sans surinterprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. « De son vivant » et « aucun mortel » rendent naturellement les idiomes hébreux; le dernier membre conserve l’image sobre du grec tout en documentant l’état problématique du texte hébreu.
