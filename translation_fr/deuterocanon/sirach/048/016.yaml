base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/016.yaml
  text: A remnant was left to Judah[a], and to the house of David a ruler. Some of them did what was right, but some of them greatly increased apostasy.
translation:
  language: fr
  text: Certains d’entre eux firent ce qui était droit, mais d’autres poussèrent l’infidélité à l’extrême.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « mais d’autres multiplièrent les péchés ». L’hébreu évoque plus précisément une infidélité poussée à l’extrême.'
    reason: alternative_reading
lexical_decisions:
- source_word: ויש מהם
  choice: Certains d’entre eux… mais d’autres
  rationale: La construction hébraïque répétée distingue deux groupes. Cette formulation est naturelle en français et explicite le contraste marqué par la seconde proposition.
- source_word: עשו יושר
  choice: firent ce qui était droit
  rationale: L’expression signifie littéralement agir selon la droiture. « Faire ce qui était droit » conserve l’idée morale sans introduire une terminologie confessionnelle.
- source_word: הפליאו
  choice: poussèrent très loin
  rationale: Le hifil de פלא exprime ici un degré extraordinaire ou excessif. Cette tournure française rend l’intensification sans suggérer un acte merveilleux.
- source_word: מעל
  choice: l’infidélité
  rationale: מעל désigne une rupture de fidélité, souvent envers Dieu ou l’alliance. « Infidélité » garde cette portée tout en évitant de préciser abusivement s’il s’agit d’une apostasie complète.
theological_decisions:
- issue: Portée de מעל dans le bilan moral des rois
  choice: l’infidélité
  alternative: l’apostasie ; les péchés
  rationale: Le texte hébreu emploie un terme de déloyauté ou de rupture de fidélité, plus précis que le grec « péchés ». « Infidélité » préserve cette nuance sans imposer l’idée plus étroite d’un abandon formel et total de la foi.
- issue: Délimitation du verset
  choice: Traduire uniquement le texte placé après l’indication hébraïque (טז)
  alternative: Inclure « Un petit reste fut laissé à Juda… »
  rationale: Dans la source hébraïque fournie, le numéro 16 précède « Certains d’entre eux… ». La phrase concernant le reste de Juda et la maison de David appartient donc au verset précédent, malgré son inclusion dans la couche anglaise de consultation.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme antithétique est conservé. « Poussèrent très loin l’infidélité » rend idiomatiquement l’intensification hébraïque et la note maintient la différence avec le témoin grec.
