base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/017.yaml
  text: Hezekiah fortified his city[a], and brought water into its midst; he cut through rock like bronze[b], and dammed up a reservoir in the mountains.
translation:
  language: fr
  text: Ézékias fortifia sa ville et fit venir l’eau jusqu’en son centre ; il creusa le roc comme du bronze[a] et barra un réservoir dans les montagnes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte littéralement « comme du bronze », expression difficile dans ce contexte. Le grec lit « avec du fer », ce qui conviendrait à l’action de creuser le roc.
    reason: textual_variant
  - marker: b
    text: 'La dernière expression hébraïque est très condensée. Elle peut aussi se comprendre : « il ferma un réservoir dans les montagnes ». Le grec évoque plus généralement l’aménagement de sources pour fournir de l’eau.'
    reason: alternative_reading
lexical_decisions:
- source_word: יחזקיהו
  choice: Ézékias
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: חזק עירו
  choice: fortifia sa ville
  rationale: Dans ce contexte urbain et militaire, חזק désigne le renforcement des défenses ; le grec ὠχύρωσεν confirme ce sens.
- source_word: בהטות אל תוכה מים
  choice: fit venir l’eau jusqu’en son centre
  rationale: La tournure exprime l’acheminement de l’eau vers l’intérieur de la ville, avec une formulation française naturelle qui conserve l’idée spatiale.
- source_word: ויחצב ... צורים
  choice: creusa le roc
  rationale: חצב désigne l’action de tailler ou creuser la pierre ; ici, le contexte des travaux hydrauliques favorise « creusa ». Le pluriel צורים est rendu par le collectif français « le roc ».
- source_word: כנחשת
  choice: comme du bronze
  rationale: Rendu direct du texte hébreu transmis, qui porte כ comparatif et נחשת « bronze/cuivre ». La leçon grecque « avec du fer » est signalée en note sans remplacer silencieusement l’hébreu.
- source_word: ויחסום הרים מקוה
  choice: barra dans les montagnes un réservoir
  rationale: La phrase hébraïque est condensée. חסם évoque le fait de fermer ou barrer, et מקוה un lieu où l’eau est recueillie ; « réservoir » convient au contexte hydraulique tout en gardant l’incertitude syntaxique en note.
