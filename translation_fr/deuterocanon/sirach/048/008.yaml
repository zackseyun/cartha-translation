  text: You made heard at Sinai rebukes[a], and at Horeb judgments of vengeance.
translation:
  language: fr
  text: Tu as fait entendre au Sinaï des reproches[a], et à l’Horeb des jugements de vengeance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec présente ici une lecture très différente, dont le sens est : « tu as oint des rois en vue de la rétribution, et des prophètes comme successeurs après lui ». L’hébreu et le grec semblent refléter deux formes textuelles différentes de ce verset.'
    reason: textual_variant
lexical_decisions:
- source_word: השמע
  choice: Tu as fait entendre
  rationale: Le hiphil de שמע a ici son sens causatif direct, « faire entendre ». Le sujet implicite est interpellé à la deuxième personne, conformément au contexte poétique consacré à Élie.
- source_word: בסיני
  choice: au Sinaï
  rationale: Avec un nom de lieu, ב se rend naturellement ici par « au » en français.
- source_word: תוכחות
  choice: des reproches
  rationale: תוכחות désigne des réprimandes ou reproches; « reproches » conserve la force admonitrice tout en restant naturel en français actuel.
- source_word: ובחורב
  choice: et à l’Horeb
  rationale: La coordination et la préposition locative sont rendues directement; l’article est conservé selon l’usage biblique français courant pour l’Horeb.
- source_word: משפטי
  choice: des jugements de
  rationale: Le pluriel construit de משפט est rendu formellement par « jugements de », sans préciser s’il s’agit de sentences ou d’actes judiciaires.
- source_word: נקם
  choice: vengeance
  rationale: נקם exprime la vengeance, la rétribution punitive ou l’action de venger; « vengeance » est l’équivalent lexical le plus direct et préserve la dureté du texte.
theological_decisions:
- issue: Divergence substantielle entre le témoin hébreu et le parallèle grec
  choice: 'Le texte principal suit l’hébreu conservé : « Tu as fait entendre au Sinaï des reproches, et à l’Horeb des jugements de vengeance. »'
  alternative: 'Le grec présente le sens : « oignant des rois en vue de la rétribution, et des prophètes pour lui succéder » après lui.'
  rationale: Lorsque l’hébreu du Siracide est conservé avec une confiance élevée, il constitue ici la source principale. Le grec reflète une autre forme textuelle plutôt qu’une simple différence de traduction; cette variante est donc signalée en note sans remplacer l’hébreu.
translation_notes:
  register: Français international moderne, concis et digne. Le parallélisme entre « au Sinaï » et « à l’Horeb » est maintenu, de même que la formulation forte et volontairement non atténuée « jugements de vengeance ».
