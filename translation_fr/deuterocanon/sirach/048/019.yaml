  text: Then they melted in the pride of their heart[a], and they writhed like a woman giving birth.
translation:
  language: fr
  text: Alors ils perdirent courage dans l’orgueil de leur cœur[a] et se tordirent comme une femme qui accouche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « Alors leur cœur et leurs mains furent ébranlés, et ils éprouvèrent les douleurs de l’enfantement comme des femmes qui accouchent. » Le texte principal suit le témoin hébreu, le grec étant consulté comme parallèle.'
    reason: alternative_reading
lexical_decisions:
- source_word: נמוגו
  choice: ils perdirent courage
  rationale: Le verbe évoque littéralement le fait de fondre ou de perdre sa fermeté. En français courant, « perdirent courage » restitue naturellement l’effondrement intérieur tout en laissant l’image hébraïque moins explicite.
- source_word: בגאון לבם
  choice: dans l’orgueil de leur cœur
  rationale: 'La tournure hébraïque est concise et quelque peu ambiguë : גאון peut désigner l’orgueil, l’élévation ou le gonflement. Cette traduction reste proche du texte sans trancher davantage le rapport exact entre cet orgueil et leur défaillance.'
- source_word: ויחילו
  choice: se tordirent
  rationale: Le verbe peut exprimer tremblement, torsion douloureuse ou douleurs d’enfantement. « Se tordirent » conserve la dimension corporelle de l’angoisse sans répéter explicitement l’idée d’accouchement déjà présente dans la comparaison.
- source_word: כיולדה
  choice: comme une femme qui accouche
  rationale: Le participe féminin singulier désigne naturellement une femme en train d’enfanter. La formulation est claire et actuelle.
- source_word: τότε ἐσαλεύθησαν καρδία καὶ χεῖρες αὐτῶν
  choice: Alors ils perdirent courage…
  rationale: Le grec porte « leur cœur et leurs mains furent ébranlés », expansion ou variante qui confirme l’idée de panique. Le texte principal suit toutefois le témoin hébreu.
