translation:
  language: fr
  text: qui fit descendre des rois dans la ruine[a], et des hommes honorés de leurs lits[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la fosse ». Le mot hébreu peut désigner une fosse, la ruine ou la destruction ; le grec porte « dans la destruction ».
    reason: lexical_alternative
  - marker: b
    text: L’expression peut aussi se traduire par « des notables » ou « des personnages de haut rang ». Cette ligne évoque probablement les jugements annoncés par Élie contre des rois et de hauts personnages, notamment le roi alité de 2 Rois 1.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: המוריד
  choice: qui précipita / fit descendre
  rationale: 'Le participe hiphil de ירד exprime le fait de faire descendre ou d’abattre. La répétition modulée en français rend naturellement ses deux emplois : chute des rois, puis descente concrète depuis le lit.'
- source_word: מלכים
  choice: des rois
  rationale: Le terme hébreu désigne précisément des rois, sans nécessité de généraliser en « dirigeants ».
- source_word: על שחת
  choice: vers la ruine
  rationale: שחת peut désigner la fosse ou la destruction. « Vers la ruine » conserve l’idée d’une chute menant à la perte, soutenue par le grec εἰς ἀπώλειαν, sans imposer l’image littérale de la fosse.
- source_word: ונכבדים
  choice: des hommes honorés
  rationale: נכבדים désigne des personnes qui ont du poids, de l’honneur ou de la distinction. « Hommes honorés » préserve cette portée sans limiter le groupe à une noblesse héréditaire.
- source_word: ממטותם
  choice: de leur lit
  rationale: מטותם signifie « leurs lits » ou « leurs couches ». Le singulier distributif « de leur lit » est naturel en français et maintient l’image concrète.
theological_decisions:
- issue: Lire le second membre comme un renversement général ou comme une allusion au jugement prononcé par Élie contre un roi alité.
  choice: Conserver l’image concrète d’hommes honorés que le prophète fait descendre de leur lit, sans expliciter l’allusion dans le texte.
  alternative: « des notables de leur lit de malade »
  rationale: L’hébreu et le grec mentionnent seulement le lit ou la couche. L’écho probable à 2 Rois 1 éclaire le verset, mais « malade » serait un ajout interprétatif.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme est conservé, tandis que le verbe hébreu est rendu par deux formulations françaises complémentaires afin d’éviter une tournure obscure. Tous les marqueurs de notes figurent dans le texte.
