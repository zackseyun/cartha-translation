base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/011.yaml
  text: Happy is the one who saw you and died[a], and happy are you, for you will surely live.
translation:
  language: fr
  text: Heureux celui qui t’a vu et qui est mort[a] ! Et heureux es-tu, car tu vivras certainement !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Heureux ceux qui t’ont vu et ceux qui ont été parés d’amour, car nous aussi, nous vivrons. » Le témoin hébreu porte plutôt : « Et heureux es-tu, car tu vivras certainement ! »'
    reason: alternative_reading
lexical_decisions:
- source_word: אשרי
  choice: Heureux celui qui / heureux es-tu
  rationale: La formule de béatitude hébraïque exprime un bonheur enviable. « Heureux » est naturel, digne et conserve la force exclamative du texte.
- source_word: ראך
  choice: t’a vu
  rationale: Le parfait qal de ראה avec suffixe de deuxième personne masculin singulier désigne le fait d’avoir vu Élie. Le passé composé convient au français actuel.
- source_word: ומת
  choice: et qui est mort
  rationale: Cette traduction garde la coordination explicite de l’hébreu sans lui imposer une valeur concessive comme « bien qu’il soit mort ».
- source_word: ואשריך
  choice: Et heureux es-tu
  rationale: Le suffixe de deuxième personne établit une adresse directe à Élie. La reprise conserve le parallélisme des deux béatitudes.
- source_word: כי
  choice: car
  rationale: « Car » rend simplement la valeur explicative de la conjonction, qui introduit le motif de la seconde béatitude.
- source_word: חיה תחיה
  choice: tu vivras certainement
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’affirmation. « Certainement » restitue cette intensité sans produire une tournure française artificielle.
theological_decisions:
- issue: Rapport entre les formes hébraïque et grecque du verset
  choice: Traduire dans le texte principal le témoin hébreu conservé et signaler en note la forme grecque notablement différente.
  alternative: 'Suivre le grec : « Heureux ceux qui t’ont vu et ceux qui ont été parés d’amour, car nous aussi, nous vivrons. »'
  rationale: Le texte hébreu extant est la source principale. Toutefois, le grec diffère substantiellement dans la seconde partie ; la note préserve donc cette donnée textuelle sans fusionner ni harmoniser les deux formes.
translation_notes:
  register: Français international moderne, poétique et digne. Les exclamations rendent la force des deux formules de béatitude. La coordination hébraïque est conservée sans résoudre implicitement la tension entre la mort de celui qui a vu Élie et la vie certaine promise à Élie.
