  text: He declared what would be forever[b][a], and hidden things before they came.
translation:
  language: fr
  text: Il annonça ce qui devait arriver jusqu’à l’éternité[a], ainsi que les choses cachées[b] avant qu’elles ne surviennent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour toujours » ou « jusqu’à la fin des temps ». L’hébreu עד עולם et le grec ἕως τοῦ αἰῶνος expriment une durée future sans limite clairement fixée.
    reason: lexical_alternative
  - marker: b
    text: On pourrait aussi traduire par « les choses secrètes » ou « les réalités dissimulées ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עד עולם
  choice: jusqu’à la fin des temps
  rationale: La locution hébraïque associe « jusqu’à » à un terme désignant une durée indéfinie ou l’âge à venir. Cette formulation française exprime naturellement la portée temporelle très étendue de la révélation prophétique, sans en faire une affirmation systématique d’omniscience.
- source_word: הגיד
  choice: il annonça
  rationale: Le verbe signifie faire connaître, déclarer ou raconter. « Annonça » convient au contexte prophétique et garde un registre solennel sans être archaïque.
- source_word: נהיות
  choice: ce qui devait arriver
  rationale: Le terme désigne les réalités ou événements à venir. Cette tournure est naturelle en français et concorde avec le grec τὰ ἐσόμενα.
- source_word: ונסתרות
  choice: ainsi que les choses cachées
  rationale: Le mot désigne ce qui est caché ou secret. « Choses cachées » reste proche de l’hébreu et du grec τὰ ἀπόκρυφα, sans introduire de sens technique ultérieur.
- source_word: לפני בואן
  choice: avant qu’elles ne surviennent
  rationale: Littéralement « avant leur venue ». Puisque l’antécédent comprend des événements futurs, « surviennent » rend idiomatiquement leur venue ou leur réalisation.
theological_decisions:
- issue: Portée temporelle de la connaissance prophétique
  choice: Jusqu’à la fin des temps, il annonça ce qui devait arriver
  alternative: Il annonça pour toujours ce qui devait arriver
  rationale: Le placement initial de עד עולם et le parallèle grec permettent de comprendre l’expression comme indiquant jusqu’où s’étend la révélation des événements futurs. La traduction conserve cette vaste portée sans décider que l’annonce elle-même durerait éternellement ni formuler une doctrine d’une connaissance exhaustive.
translation_notes:
  register: Français international moderne, sobre et digne. « Jusqu’à la fin des temps » est plus naturel que le calque « jusqu’à l’éternité », tandis que la note préserve l’éventail lexical de la source. Le parallélisme entre les événements futurs et les choses cachées est maintenu.
