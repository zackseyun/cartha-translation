  naturalness: La phrase est fluide et de registre approprié. La révision proposée conserve cette fluidité tout en plaçant le complément temporel auprès de « ce qui devait arriver », ce qui évite une ambiguïté syntaxique importante.
  terminology: '« Annonça » et « choses cachées » sont justes, modernes et non confessionnels. « Jusqu’à l’éternité » est ici préférable à « jusqu’à la fin des temps » : il reste plus proche de עד עולם et de ἕως τοῦ αἰῶνος sans imposer une lecture eschatologique déterminée.'
