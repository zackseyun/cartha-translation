base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/012.yaml
  text: Elijah was hidden in the storehouse[a], and Elisha was filled with his spirit. Twice as many signs, and many wonders[b], came from his mouth.
translation:
  language: fr
  text: Élie fut caché dans le trésor[a], et Élisée fut rempli de son esprit. Il accomplit deux fois plus de signes et de nombreux prodiges par chacune de ses paroles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Élie, qui fut enveloppé dans un tourbillon. » Le témoin hébreu porte plutôt : « Élie fut caché dans le trésor. »'
    reason: textual_variant
  - marker: b
    text: 'L’hébreu est très condensé. Littéralement : « double [de] signes nombreux, et [de] prodiges, tout ce qui sort de sa bouche » ; on peut aussi comprendre : « Deux fois plus de signes et de nombreux prodiges sortaient de sa bouche. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: שבאוצר נסתר
  choice: fut caché dans le trésor
  rationale: Le témoin hébreu conservé porte littéralement « fut caché dans le trésor / dépôt ». Le rendu maintient cette image énigmatique au lieu de lui substituer la tourmente du texte grec.
- source_word: ונמלא רוחו אלישע
  choice: et Élisée fut rempli de son esprit
  rationale: Le suffixe renvoie le plus naturellement à Élie, comme le confirme le grec πνεύματος αὐτοῦ. La minuscule à « esprit » évite d'expliciter une identification que le texte ne formule pas.
- source_word: פי שנים
  choice: au double
  rationale: L'expression signifie « doublement / deux fois autant » et évoque probablement la double part demandée par Élisée. « Au double » conserve cette brièveté sans préciser un terme de comparaison absent.
- source_word: אותות הרבה
  choice: des signes
  rationale: אותות désigne des signes; הרבה peut se rattacher à l'idée d'abondance, mais la syntaxe composite est comprimée et incertaine. Le double est directement rapporté aux signes dans ce rendu.
- source_word: ומופתים
  choice: et des prodiges
  rationale: « Prodiges » rend naturellement מופתים et préserve l'association biblique des signes et des prodiges.
- source_word: כל מוצא פיהו
  choice: à chacune des paroles sorties de sa bouche
  rationale: Littéralement, « chaque sortie de sa bouche ». Le français explicite qu'il s'agit de paroles tout en conservant l'image de ce qui sort de la bouche.
theological_decisions:
- issue: Divergence entre l'hébreu et le grec dans la première proposition
  choice: 'Suivre l''hébreu : « Élie fut caché dans le trésor »'
  alternative: 'Suivre le grec : « Élie, qui fut enveloppé dans une tourmente »'
  rationale: L'hébreu est le témoin principal lorsqu'il subsiste. La variante grecque, ancienne et cohérente avec 2 Rois 2, est néanmoins signalée en note.
- issue: Référent de « son esprit »
  choice: L'esprit d'Élie
  alternative: L'Esprit compris explicitement comme l'Esprit divin
  rationale: La grammaire hébraïque et le parallèle grec désignent le plus naturellement Élie comme antécédent. Le texte ne doit pas être rendu plus explicitement pneumatologique qu'il ne l'est.
- issue: Portée de פי שנים
  choice: Relier « au double » aux signes accomplis par Élisée
  alternative: Traduire par « une double part » ou « deux fois autant de signes »
  rationale: La formulation hébraïque est elliptique et fait vraisemblablement écho à la double part d'Élisée. Le rendu conserve cette allusion sans introduire un objet ou une comparaison non exprimés.
translation_notes:
  register: Français international actuel, digne et accessible. Le passé simple convient au registre narratif sapientiel. Le mot « trésor » préserve l'étrangeté du témoin hébreu; les notes rendent visibles la variante grecque et l'ambiguïté de la seconde phrase.
