  text: If he remains steadfast[a], he will leave behind a name beyond a thousand; and if he comes to rest[b], he still accomplishes them.
translation:
  language: fr
  text: S’il persévère[a], il laissera un nom qui surpassera celui de mille autres[b] ; et s’il se repose[c], il les accomplira encore[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec peut aussi se traduire par « demeure » ou « continue ».
    reason: lexical_alternative
  - marker: b
    text: Le grec transmis porte une expression abrupte, littéralement « un nom que mille ». Le sens paraît être que son nom surpassera celui de mille autres.
    reason: textual_difficulty
  - marker: c
    text: « Se repose » peut évoquer ici la mort, tout en gardant le sens plus général de repos.
    reason: alternative_reading
  - marker: d
    text: Le grec dit littéralement « il les produit » ou « il les accomplit » ; ce que désigne le pronom pluriel n’est pas précisé.
    reason: referent_ambiguity
lexical_decisions:
- source_word: ἐὰν ἐμμένῃ
  choice: S’il persévère
  rationale: ἐμμένω exprime le fait de demeurer, de continuer ou de persister. « Persévère » rend naturellement la durée et la constance suggérées dans ce contexte, sans préciser indûment qu’il s’agit de rester en vie.
- source_word: ὄνομα καταλείψει
  choice: il laissera un nom
  rationale: La formulation conserve l’image biblique du « nom » laissé après soi, c’est-à-dire une réputation ou une mémoire durable.
- source_word: ἢ χίλιοι
  choice: qui surpassera celui de mille autres
  rationale: La tournure grecque transmise est abrupte, littéralement « que mille ». Le comparatif explicité donne un sens cohérent tout en signalant la difficulté textuelle en note.
- source_word: ἐὰν ἀναπαύσηται
  choice: s’il entre dans le repos
  rationale: ἀναπαύομαι peut désigner le repos et, dans ce contexte, évoquer la mort. Cette formulation française préserve cette double possibilité.
- source_word: ἐμποιεῖ
  choice: il accomplira encore
  rationale: ἐμποιέω signifie produire, provoquer ou accomplir. Le futur convient à la construction conditionnelle française, tandis que « encore » exprime la continuation implicite de l’action ou de l’influence.
- source_word: αὐτά
  choice: ces choses
  rationale: Le pronom grec est neutre pluriel et son antécédent reste imprécis. « Ces choses » en maintient l’indétermination au lieu de nommer explicitement ses œuvres ou leurs effets.
theological_decisions:
- issue: Le repos comme possible évocation de la mort
  choice: s’il entre dans le repos
  alternative: s’il meurt
  rationale: Le passage peut évoquer l’influence durable du sage après sa mort, mais le grec emploie le verbe plus général « se reposer ». La traduction ne transforme donc pas cette implication possible en affirmation explicite.
- issue: La portée posthume des actions du sage
  choice: il accomplira encore ces choses
  alternative: ses œuvres continueront de produire leurs effets
  rationale: La seconde formulation expliquerait nettement une influence posthume, mais elle préciserait davantage que le texte grec, dont le sujet reste « il » et dont le pronom pluriel est indéterminé.
translation_notes:
  register: 'Français international moderne, digne et lisible. La syntaxe demeure concise, tandis que les notes rendent visibles les deux principales obscurités du grec : la comparaison elliptique avec « mille » et le référent indéterminé de αὐτά.'
