  text: Nations will recount his wisdom[a], and the assembly will proclaim his praise.
translation:
  language: fr
  text: Les nations raconteront sa sagesse, et l’assemblée[a] proclamera sa louange.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la communauté réunie ». Le grec ἐκκλησία désigne ici l’assemblée ou la communauté rassemblée.
    reason: lexical_alternative
lexical_decisions:
- source_word: διηγήσονται
  choice: raconteront
  rationale: Le futur de διηγέομαι exprime le fait de relater ou de raconter publiquement. « Raconteront » reste naturel tout en conservant l’idée d’un récit développé.
- source_word: ἔθνη
  choice: les nations
  rationale: Dans la Septante, ἔθνη désigne couramment les nations ou les peuples. « Les nations » évite d’introduire ici une opposition particulière entre Juifs et non-Juifs.
- source_word: σοφίαν
  choice: sagesse
  rationale: « Sagesse » est l’équivalent usuel de σοφία et en préserve ici la portée morale et intellectuelle.
- source_word: ἐξαγγελεῖ
  choice: proclamera
  rationale: Le verbe évoque une annonce publique. « Proclamera » convient au registre élevé du verset et au parallélisme des deux propositions.
- source_word: ἐκκλησία
  choice: assemblée
  rationale: Dans ce contexte juif antérieur au christianisme, ἐκκλησία désigne la communauté réunie. « Assemblée » est précis et évite l’anachronisme que pourrait produire « Église ».
- source_word: ἔπαινον
  choice: louange
  rationale: Ἔπαινος désigne l’éloge ou la louange. « Louange » s’emploie naturellement avec « proclamer » et conserve le sens d’un honneur exprimé publiquement.
- source_word: αὐτοῦ
  choice: sa
  rationale: Le pronom masculin singulier renvoie au sage évoqué dans le contexte. Le possessif français « sa » s’accorde grammaticalement avec « sagesse » et « louange » tout en conservant ce référent singulier.
theological_decisions:
- issue: Sens de ἐκκλησία dans un écrit sapientiel juif préchrétien
  choice: assemblée
  alternative: communauté réunie ; Église
  rationale: « Assemblée » rend le groupe convoqué ou réuni sans suggérer de manière anachronique l’institution chrétienne.
- issue: Référence masculine singulière de αὐτοῦ
  choice: sa
  alternative: leur
  rationale: Le grec renvoie à un individu masculin singulier, le sage du contexte ; il ne convient donc pas de neutraliser ou de pluraliser cette référence.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme du grec est conservé, ainsi que les futurs et la référence singulière au sage. Le marqueur de note est placé après « assemblée », le terme auquel la variante lexicale se rapporte.
