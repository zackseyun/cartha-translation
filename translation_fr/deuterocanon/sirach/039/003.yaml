  text: He will seek out the hidden things of proverbs[b][a], and will occupy himself with the riddles of parables.
translation:
  language: fr
  text: Il recherchera les choses cachées des proverbes[a] et s’occupera des énigmes des paraboles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce que les proverbes ont de caché ». Le grec peut désigner plus largement ce qui est caché ou obscur, et non seulement un sens dissimulé.
    reason: lexical_alternative
  - marker: b
    text: Ou « évoluera parmi les énigmes des paraboles ». Le verbe grec peut évoquer le fait de vivre ou de circuler dans un domaine, de le fréquenter, ou de s’en occuper.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόκρυφα
  choice: ce que … ont de caché
  rationale: Le substantif neutre pluriel désigne les choses cachées ou obscures. Cette tournure française reste naturelle tout en évitant de réduire explicitement le terme au seul « sens caché ».
- source_word: παροιμιῶν
  choice: les proverbes
  rationale: παροιμία désigne couramment une maxime ou une parole proverbiale ; « proverbes » est ici l’équivalent le plus direct et accessible.
- source_word: ἐκζητήσει
  choice: recherchera
  rationale: Le composé exprime une recherche attentive et approfondie. « Recherchera » en restitue la force sans alourdir la phrase.
- source_word: ἐν αἰνίγμασι
  choice: aux énigmes
  rationale: Avec ἀναστραφήσεται, ἐν indique le domaine où s’exerce l’activité. La construction « se consacrer à » donne en français une expression naturelle de cet engagement soutenu.
- source_word: παραβολῶν
  choice: des paraboles
  rationale: Dans la littérature sapientielle, παραβολή peut désigner une comparaison, une figure ou une parabole. « Paraboles » conserve l’étendue littéraire et la formulation traditionnelle.
- source_word: ἀναστραφήσεται
  choice: se consacrera
  rationale: Le verbe évoque ici le fait de vivre, d’évoluer ou de s’occuper durablement dans un domaine. « Se consacrera » exprime idiomatiquement cette fréquentation assidue, sans lui donner un sens moral absent du contexte.
