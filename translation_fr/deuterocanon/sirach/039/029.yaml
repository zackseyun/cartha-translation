  text: Fire and hail[a], famine and pestilence—these also were created for judgment.
translation:
  language: fr
  text: 'Le feu et la grêle, la famine et la peste : eux aussi ont été créés pour le jugement.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit : « toutes ces choses ont été créées pour la vengeance », ou « pour le châtiment ». L’hébreu porte : « pour le jugement ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אש
  choice: le feu
  rationale: Équivalent français courant du nom hébreu, confirmé par le grec πῦρ.
- source_word: ברד
  choice: la grêle
  rationale: Désigne naturellement le phénomène météorologique; le grec χάλαζα le confirme.
- source_word: רעב
  choice: la famine
  rationale: Dans cette liste de calamités collectives, « famine » convient mieux que « faim » et correspond au grec λιμός.
- source_word: דבר
  choice: la peste
  rationale: Le terme hébreu désigne couramment une épidémie meurtrière. « Peste » conserve ce sens de fléau sans suivre le grec plus général θάνατος, « mort ».
- source_word: גם אלה
  choice: eux aussi
  rationale: Rend clairement la valeur additive de l’expression en renvoyant aux fléaux masculins énumérés.
- source_word: למשפט
  choice: pour le jugement
  rationale: Préserve la portée judiciaire de משפט sans la réduire d’emblée au seul châtiment.
- source_word: נוצרו
  choice: ont été créés
  rationale: Rend le passif pluriel et s’accorde avec le thème de la création; l’agent divin demeure implicite comme en hébreu.
theological_decisions:
- issue: Nuance entre l’hébreu et le grec dans la proposition finale
  choice: Retenir dans le texte « pour le jugement », d’après l’hébreu.
  alternative: « pour la vengeance » ou « pour le châtiment », d’après le grec.
  rationale: L’hébreu extant porte למשפט, terme à portée judiciaire plus large. Le grec εἰς ἐκδίκησιν accentue la rétribution punitive; cette variante est donc signalée sans remplacer la lecture hébraïque principale.
translation_notes:
  register: Français international moderne, sobre et digne. L’énumération est conservée, avec deux groupes coordonnés et une ponctuation qui met en relief la conclusion. « Eux aussi » est naturel en français et reprend les quatre noms masculins.
