  text: All the works of God are good[a], and for every need he provides in its time.
translation:
  language: fr
  text: Toutes les œuvres de Dieu sont bonnes[a] ; il pourvoit à chaque besoin au moment voulu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec dit : « Toutes les œuvres du Seigneur sont très bonnes, et tout ordre se réalisera en son temps. » Le témoin hébreu porte plutôt « les œuvres de Dieu » et parle de ce qui est fourni pour chaque besoin ; le texte principal suit l’hébreu conservé, tout en tenant compte du grec.'
    reason: alternative_reading
lexical_decisions:
- source_word: מעשי אל
  choice: les œuvres de Dieu
  rationale: Le pluriel construit מעשי désigne largement ce que Dieu fait ou crée. « Œuvres » conserve la concision de l’hébreu et correspond au grec ἔργα ; אל est rendu directement par « Dieu ».
- source_word: כלם טובים
  choice: sont bonnes
  rationale: 'כלם exprime la totalité, naturellement intégrée en français par « toutes les œuvres ». טובים porte une appréciation générale : « bonnes ». Le grec ajoute « très », sans équivalent dans l’hébreu conservé.'
- source_word: לכל צורך
  choice: à chaque besoin
  rationale: צורך désigne ici un besoin ou une nécessité. « À chaque besoin » exprime naturellement en français la situation à laquelle répond la provision divine.
- source_word: בעתו
  choice: en son temps
  rationale: 'Cette formulation conserve le suffixe singulier et l’expression temporelle de l’hébreu sans préciser excessivement son référent : chaque besoin reçoit réponse au temps qui lui correspond.'
- source_word: יספיק
  choice: il pourvoit
  rationale: Le hifil de ספק exprime l’idée de fournir ce qui suffit. Le sujet n’est pas formulé explicitement en hébreu ; « il » reprend naturellement Dieu dans le contexte, tout en gardant le sens actif de provision.
theological_decisions:
- issue: Titre divin
  choice: Dieu
  alternative: le Seigneur
  rationale: Le témoin hébreu porte אל, « Dieu », tandis que le parallèle grec a Κυρίου, « du Seigneur ». La traduction principale suit l’hébreu conservé.
- issue: Sujet implicite de יספיק
  choice: Dieu comme sujet de « il pourvoit »
  alternative: « cela suffit » ou « il fournit suffisamment »
  rationale: La forme verbale singulière n’énonce pas son sujet. Le contexte rend Dieu comme sujet très probable, mais la note sur le grec signale une tradition textuelle sensiblement différente plutôt que de prétendre résoudre cette divergence.
translation_notes:
  register: Français international moderne, sobre et digne. « Pourvoir à un besoin » est idiomatique et garde l’idée d’une provision suffisante. Le point-virgule respecte le parallélisme des deux propositions.
