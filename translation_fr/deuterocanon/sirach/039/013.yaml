  terminology: « Fils » respecte le masculin explicite de υἱοὶ sans neutralisation. « Pieux » est un bon rendu non technique de ὅσιοι dans ce contexte ; « saints » et « fidèles » peuvent légitimement figurer comme alternatives en note. Aucun terme théologique ne requiert une normalisation confessionnelle.
