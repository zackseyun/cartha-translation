  yaml_path: translation/deuterocanon/sirach/039/013.yaml
  text: Listen to me[a], holy sons, and bud forth like a rose growing beside a stream in a field[b],
translation:
  language: fr
  text: Écoutez-moi, fils pieux[a], et poussez comme une rose qui grandit au bord d’un cours d’eau dans un champ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fils saints » ou « fils fidèles ». Le mot grec peut qualifier des personnes pieuses, fidèles envers Dieu ou saintes.
    reason: lexical_alternative
  - marker: b
    text: Le grec peut aussi se comprendre comme « au bord d’un cours d’eau d’un champ » ; « champ » peut plus largement désigner la campagne.
    reason: source_ambiguity
lexical_decisions:
- source_word: εἰσακούσατέ
  choice: Écoutez-moi
  rationale: L’impératif appelle à une écoute attentive. « Écoutez-moi » est direct, naturel et fidèle à l’exhortation.
- source_word: υἱοὶ
  choice: fils
  rationale: Le grec emploie explicitement le masculin pluriel. « Fils » en conserve la forme sans la neutraliser.
- source_word: ὅσιοι
  choice: pieux
  rationale: Dans ce contexte, ὅσιοι qualifie ceux qui manifestent piété et fidélité envers Dieu. « Pieux » est plus naturel en français moderne que « saints » dans cette apostrophe, tout en laissant ouverte la nuance de sainteté religieuse.
- source_word: βλαστήσατε
  choice: poussez
  rationale: Le verbe désigne l’apparition ou le développement d’une pousse. « Poussez » conserve l’image végétale et fonctionne naturellement comme exhortation.
- source_word: ῥόδον
  choice: rose
  rationale: Le sens ordinaire est « rose »; rien dans le contexte n’exige l’expansion « rosier ».
- source_word: φυόμενον
  choice: qui grandit
  rationale: Le participe décrit la croissance continue de la rose. « Qui grandit » évite de répéter immédiatement « poussez » tout en gardant cette idée.
- source_word: ἐπὶ ῥεύματος
  choice: au bord d’un ruisseau
  rationale: La préposition évoque ici la proximité d’une eau courante. « Au bord d’un ruisseau » restitue concrètement et naturellement l’image.
- source_word: ἀγροῦ
  choice: dans un champ
  rationale: ἀγρός peut désigner un champ ou la campagne. « Dans un champ » conserve le cadre rural concret, bien que le rattachement exact du génitif reste légèrement ambigu.
theological_decisions:
- issue: Sens de ὅσιοι dans l’expression υἱοὶ ὅσιοι
  choice: fils pieux
  alternative: fils saints
  rationale: « Pieux » rend clairement la conduite religieuse suggérée par ὅσιος sans imposer un sens technique de sainteté. Une note conserve l’autre nuance légitime.
- issue: Forme masculine de l’apostrophe υἱοὶ
  choice: fils
  alternative: enfants
  rationale: Le masculin explicite du grec est conservé. Le passage ne permet pas d’établir si l’auteur vise exclusivement des hommes ou emploie « fils » pour ses disciples de manière plus générale.
translation_notes:
  register: Français international moderne, digne et imagé. L’apostrophe « fils pieux » garde le ton sapientiel élevé; « poussez » rend l’exhortation végétale sans archaïsme. La structure demeure proche du grec tout en évitant une tournure française raide.
