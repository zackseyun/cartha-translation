  - severity: low
    issue: La note b présente de manière imprécise les possibilités syntaxiques de ἐπὶ ῥεύματος ἀγροῦ.
    rationale: Le génitif ἀγροῦ peut qualifier le cours d’eau ou le cadre rural ; « dans la campagne » est une possibilité de sens pour ἀγρός, mais ne doit pas être annoncé comme une formulation littérale de toute l’expression.
