  text: With the service of harp and instruments of music[c][b][a], so you shall speak with a shout of praise.
translation:
  language: fr
  text: Avec des chants accompagnés de la harpe[a] et d’instruments variés, vous parlerez ainsi dans l’acclamation[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lyre »; le mot hébreu désigne un ancien instrument à cordes dont l’équivalent moderne exact reste incertain.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans la clameur »; le terme hébreu peut désigner un cri collectif de joie ou une acclamation, et parfois une sonnerie éclatante.
    reason: lexical_alternative
  - marker: c
    text: 'Le parallèle grec est beaucoup plus développé : il appelle explicitement à bénir le Seigneur, à magnifier son nom et à le louer. Le témoin hébreu ne conserve ici que la partie relative à la musique et à l’acclamation.'
    reason: textual_variant
lexical_decisions:
- source_word: בשירות
  choice: Au son de
  rationale: Dans ce contexte musical, le terme évoque l’exécution ou l’accompagnement musical. « Au son de » exprime naturellement cette fonction en français sans imposer le sens étroit de « chants » ni le calque peu idiomatique « au service de ».
- source_word: נבל
  choice: harpe
  rationale: Le mot désigne un ancien instrument à cordes dont l’équivalent exact est incertain. « Harpe » est un terme courant et intelligible; « lyre » demeure possible.
- source_word: כלי מינים
  choice: instruments de toutes sortes
  rationale: כלי signifie « instruments » et מינים « sortes, espèces ». La traduction conserve l’idée de diversité instrumentale sans limiter indûment l’expression aux seuls instruments à cordes.
- source_word: וכן
  choice: ainsi
  rationale: L’adverbe introduit la manière dont les destinataires doivent parler ou s’exprimer.
- source_word: תאמרו
  choice: vous parlerez
  rationale: Le verbe signifie « dire, parler ». Le futur français garde la valeur verbale de la forme hébraïque et convient à la construction de la phrase.
- source_word: בתרועה
  choice: dans l’acclamation
  rationale: תרועה peut désigner une clameur joyeuse, une acclamation ou, selon le contexte, une sonnerie éclatante. « Acclamation » convient au cadre musical et cultuel tout en évitant d’ajouter explicitement « de louange », absent de l’hébreu.
theological_decisions:
- issue: Écart important entre le témoin hébreu et le parallèle grec
  choice: Traduire la courte leçon hébraïque conservée sans y ajouter les appels grecs à bénir le Seigneur et à magnifier son nom.
  alternative: Suivre le texte grec plus développé et inclure explicitement la bénédiction du Seigneur, la grandeur donnée à son nom et la louange.
  rationale: Le texte hébreu est ici le témoin principal fourni. Le grec éclaire le contexte de louange, mais ses propositions supplémentaires ne doivent pas être introduites silencieusement dans la traduction du texte hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation privilégie une expression musicale naturelle (« Au son de ») et conserve la brièveté du témoin hébreu ainsi que l’indétermination de תרועה.
