base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/030.yaml
  text: The teeth of wild beasts, and scorpions and vipers, and a sword that takes vengeance to destroy the wicked— all these were created for their purpose, and they are kept in store until the time they are appointed.
translation:
  language: fr
  text: 'Les dents des bêtes sauvages, les scorpions et les vipères[a], et l’épée qui exerce la vengeance pour détruire[b] les méchants : tous ont été créés pour leur fonction, et ils sont tenus en réserve jusqu’au moment où ils seront mobilisés[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serpents venimeux »; l’espèce exacte désignée par le mot hébreu est incertaine. Le grec emploie également un terme général pouvant désigner une vipère ou un serpent.
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu peut aussi avoir le sens plus fort d’« exterminer » ou de « vouer à la destruction ».
    reason: lexical_alternative
  - marker: c
    text: 'Autre traduction : « ils sont dans le dépôt et, au moment fixé, ils sont convoqués ». La dernière proposition est condensée en hébreu; elle décrit ces forces comme gardées en réserve jusqu’à leur mise en action.'
    reason: alternative_reading
lexical_decisions:
- source_word: חית שן
  choice: les crocs des bêtes sauvages
  rationale: L’hébreu présente littéralement la « dent des bêtes »; le singulier a une valeur collective. « Crocs » exprime naturellement ici les dents dangereuses des bêtes sauvages, sens confirmé par le grec θηρίων ὀδόντες.
- source_word: עקרב
  choice: les scorpions
  rationale: Le terme est rendu comme un collectif pluriel, conformément à l’énumération et au parallèle grec σκορπίοι.
- source_word: פתן
  choice: les vipères
  rationale: Il s’agit d’un serpent venimeux dont l’espèce exacte reste incertaine. « Vipères » est clair en français moderne et correspond au sens général du grec ἔχεις.
- source_word: חרב נקמות
  choice: l’épée qui exerce la vengeance
  rationale: Cette formulation conserve la force active de la construction hébraïque et s’accorde avec le participe grec ἐκδικοῦσα, sans rendre l’expression artificielle en français.
- source_word: להחרים
  choice: pour détruire
  rationale: Le verbe peut désigner une destruction totale ou une mise à l’interdit vouée à la destruction. « Détruire » reste intelligible et idiomatique, tandis qu’une note préserve la nuance plus forte.
- source_word: רשעים
  choice: les méchants
  rationale: Équivalent courant de ceux qui sont moralement coupables; il suit en priorité l’hébreu, sans imposer la nuance plus spécifiquement religieuse possible du grec ἀσεβεῖς.
- source_word: לצורכם
  choice: pour leur fonction
  rationale: L’expression indique la nécessité, l’usage ou le dessein auquel ces agents répondent. « Fonction » garde ce sens final large sans préciser abusivement au bénéfice de qui ils ont été créés.
- source_word: נבראו
  choice: ont été créés
  rationale: Le passif explicite l’appartenance de ces forces destructrices à l’ordre créé, sans atténuer l’affirmation théologique du texte.
- source_word: באוצר
  choice: tenus en réserve
  rationale: Littéralement « dans un dépôt/trésor ». La formulation française conserve l’idée de forces entreposées en vue d’un usage futur.
- source_word: ולעת יפקדו
  choice: jusqu’au moment où ils seront mobilisés
  rationale: פקד exprime ici l’appel, le recensement ou la mise en action au moment fixé. « Mobilisés » convient à ces agents gardés en réserve et préserve le caractère condensé de l’hébreu.
theological_decisions:
- issue: L’intégration des créatures nuisibles et des forces destructrices dans un ordre créé et gouverné en vue du jugement
  choice: Conserver explicitement « ont été créés », « tenus en réserve » et leur mobilisation future.
  alternative: Atténuer le propos en présentant seulement une observation sur les dangers naturels, ou traduire נבראו par « sont apparus ».
  rationale: L’hébreu attribue expressément création, fonction et déploiement à ces agents. La traduction préserve cette tension théologique sans chercher à justifier ni à adoucir le rapport entre création, destruction et jugement.
translation_notes:
  register: Français international moderne, digne et accessible. L’énumération garde sa vigueur poétique; « crocs », « tenus en réserve » et « mobilisés » rendent concrètement les images hébraïques sans archaïsme. Tous les appels de notes figurent dans le texte.
