  terminology: « Amonceller les eaux en un tas » rend l’image de נד et l’action de ערך de façon naturelle. « Réservoirs d’eau » suit explicitement le grec, sans transformer le terme hébreu plus général « dépôt/réservoir » en une assertion créationnelle.
