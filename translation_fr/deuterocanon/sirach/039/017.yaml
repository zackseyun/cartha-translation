  yaml_path: translation/deuterocanon/sirach/039/017.yaml
  text: At his word the waters pile up like a heap[a], and at the utterance of his mouth are storehouses of water.
translation:
  language: fr
  text: Par sa parole, il amoncelle les eaux en un tas ; à la parole de sa bouche, il y a des réservoirs d’eau[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit de façon concise : « et à la parole de sa bouche, son réservoir » (ou « son dépôt »). Le grec porte : « les réservoirs d’eau », lecture suivie ici pour clarifier le sens.'
    reason: alternative_reading
lexical_decisions:
- source_word: בדברו
  choice: À sa parole
  rationale: La préposition ב peut exprimer le moyen ou le moment. « À sa parole » conserve la concision de l’hébreu et laisse entendre à la fois le commandement comme moyen et l’effet immédiat de la parole.
- source_word: יעריך
  choice: s’amoncellent
  rationale: Le verbe ערך signifie fondamentalement « disposer, mettre en ordre ». Avec l’image de נד et l’appui du grec ἔστη, « s’amoncellent » exprime naturellement en français les eaux rassemblées en une masse dressée.
- source_word: כנד מים
  choice: les eaux… en un tas
  rationale: נד désigne une masse ou un monceau, notamment des eaux rassemblées. « En un tas » garde l’image concrète, inhabituelle mais intelligible, sans la remplacer par une interprétation comme « digue » ou « muraille ».
- source_word: ובמוצא פיו
  choice: à ce qui sort de sa bouche
  rationale: מוצא signifie littéralement « sortie » et peut désigner ce qui est prononcé. Cette formulation préserve le concret de l’hébreu et le parallélisme avec « À sa parole ».
- source_word: אוצרו
  choice: se forment les réservoirs des eaux
  rationale: L’hébreu transmis porte de façon très concise « son réservoir » ou « son dépôt », sans verbe explicite, tandis que le grec lit « réservoirs des eaux ». La traduction suit cette clarification grecque et explicite sobrement le verbe sous-entendu pour produire une phrase française naturelle.
theological_decisions:
- issue: Référent des suffixes dans « sa parole » et « sa bouche »
  choice: Dieu demeure le référent implicite, désigné seulement par les possessifs.
  alternative: Nommer explicitement Dieu dans le verset.
  rationale: Le contexte de l’hymne au Créateur identifie le référent, mais l’hébreu ne le nomme pas ici. Conserver les possessifs évite une expansion théologique inutile.
- issue: Rapport causal entre la parole divine et les réservoirs des eaux
  choice: « se forment » exprime l’effet de la parole sans préciser davantage son mode d’action.
  alternative: « s’ouvrent », « se remplissent » ou « existent ».
  rationale: Le texte est elliptique. « Se forment » rend le parallélisme créateur suggéré par le contexte tout en évitant les précisions non exprimées que seraient l’ouverture ou le remplissage.
translation_notes:
  register: Français international moderne, poétique et digne. Le rythme binaire et l’image concrète du tas d’eaux sont conservés. La seconde proposition est légèrement explicitée afin d’éviter en français une ellipse obscure, tout en signalant en note la différence entre l’hébreu transmis et le témoin grec.
