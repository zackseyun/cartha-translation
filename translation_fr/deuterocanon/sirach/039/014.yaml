  text: Raise your voices and bless together[a], and give thanks to Yahweh for all his works.
translation:
  language: fr
  text: Élevez la voix et bénissez-le tous ensemble ; rendez grâce à Yahweh pour toutes ses œuvres[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec présente une autre forme, plus développée : « Comme l’encens, répandez un parfum agréable ; fleurissez comme le lis, diffusez votre parfum et chantez un chant de louange. »'
    reason: alternative_reading
lexical_decisions:
- source_word: הרימו קולכם
  choice: Élevez la voix
  rationale: L’impératif pluriel de רום gouverne le nom collectif singulier « votre voix ». « Élevez la voix » conserve cette image hébraïque tout en restant naturel en français.
- source_word: וברכו
  choice: et bénissez-le
  rationale: Le piel de ברך signifie couramment « bénir ». Le complément « le », implicite en hébreu dans ce contexte, est exprimé en français pour éviter une tournure incomplète et renvoie à Yahweh nommé dans la proposition suivante.
- source_word: יחדו
  choice: tous ensemble
  rationale: L’adverbe exprime l’action commune. « Tous ensemble » rend clairement la portée collective de l’exhortation.
- source_word: והודו
  choice: rendez grâce
  rationale: Le hifil de ידה signifie ici « rendre grâce » dans un contexte cultuel, en conservant la nuance de reconnaissance plutôt que le seul sens de louange.
- source_word: ליהוה
  choice: à Yahweh
  rationale: Le texte hébreu porte directement le nom divin יהוה ; « Yahweh » le représente comme nom propre.
- source_word: על כל מעשיו
  choice: pour toutes ses œuvres
  rationale: מעשים désigne les œuvres ou les actes. « Œuvres » conserve le substantif et convient au registre biblique de la louange.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le Tétragramme comme nom propre. « Yahweh » préserve cette désignation sans la remplacer par un titre.
- issue: Écart substantiel entre le témoin hébreu et le parallèle grec
  choice: Le texte principal suit l’hébreu conservé ; le grec figure en note comme autre forme textuelle.
  alternative: Traduire dans le texte principal la formulation grecque plus développée.
  rationale: La ligne hébraïque, donnée avec une confiance élevée, est cohérente et constitue ici la source première. Le grec atteste toutefois une forme nettement différente qui doit être signalée sans être fusionnée avec l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La structure exhortative et le vocabulaire cultuel de l’hébreu sont conservés sans calquer sa syntaxe au détriment de la clarté.
