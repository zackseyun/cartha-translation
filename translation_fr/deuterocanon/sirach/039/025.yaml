  text: Good is allotted to the good from the beginning; so too[a], for the wicked, good and evil.
translation:
  language: fr
  text: Aux bons, le bien est attribué dès le commencement ; de même[a], aux méchants, le bien et le mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec dit : « Des biens ont été créés dès le commencement pour les bons ; de même, des maux pour les pécheurs. » Le témoin hébreu conservé ici présente une formulation plus développée : « aux méchants, le bien et le mal ».'
    reason: alternative_reading
lexical_decisions:
- source_word: טוב
  choice: le bien
  rationale: Le terme désigne largement ce qui est bon ou bénéfique. « Le bien » conserve la formulation ramassée et le contraste avec « le mal ».
- source_word: חלק
  choice: est attribué
  rationale: חלק est formellement un nom, « part » ou « lot ». Dans cette proposition nominale, « est attribué » exprime naturellement en français l’idée d’une part assignée sans surinterpréter le texte.
- source_word: מראש
  choice: dès le commencement
  rationale: Cette expression rend la portée temporelle de « depuis le commencement / dès l’origine » et correspond aussi au grec ἀπ’ ἀρχῆς.
- source_word: לרעים
  choice: aux méchants
  rationale: Le pluriel désigne ici des personnes moralement mauvaises. « Aux méchants » est naturel dans le registre sapientiel et maintient le contraste personnel avec « aux bons ».
- source_word: טוב ורע
  choice: le bien et le mal
  rationale: La traduction conserve la polarité large de l’hébreu, sans la réduire à la prospérité et à l’adversité.
theological_decisions:
- issue: Rapport entre la dernière proposition hébraïque et le parallèle grec
  choice: 'Suivre l’hébreu : « aux méchants, le bien et le mal »'
  alternative: 'Le grec porte seulement : « aux pécheurs, les maux »'
  rationale: Le témoin principal est ici l’hébreu conservé, qui contient explicitement « le bien et le mal ». Le grec est signalé en note comme variante ancienne, sans remplacer la leçon hébraïque ni résoudre sa tension.
translation_notes:
  register: Français international moderne, sobre et digne. La symétrie « aux bons / aux méchants » et la concision proverbiale de l’hébreu sont préservées ; la ponctuation supplée seulement les verbes absents de la seconde proposition.
