  text: Now with all your heart sing for joy[a], and bless the name of the Holy One.
translation:
  language: fr
  text: Maintenant, de tout votre cœur, chantez de joie et bénissez le nom du Saint[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec porte : « le nom du Seigneur »; le témoin hébreu porte : « le Saint ».'
    reason: Variante textuelle concernant le titre divin.
lexical_decisions:
- source_word: עתה
  choice: Maintenant
  rationale: Marqueur temporel et discursif qui introduit l’exhortation finale. Le témoin hébreu ne comporte pas la conjonction présente dans le grec.
- source_word: בכל לב
  choice: de tout votre cœur
  rationale: Expression idiomatique d’un engagement sans réserve. Le singulier « cœur » est naturel en français dans cette adresse collective.
- source_word: הרנינו
  choice: chantez de joie
  rationale: L’impératif de רנן exprime une joie proclamée à voix haute; cette traduction en conserve la dimension vocale et festive.
- source_word: וברכו
  choice: et bénissez
  rationale: « Bénir » préserve l’expression biblique employée lorsque des personnes célèbrent le nom de Dieu.
- source_word: את שם
  choice: le nom
  rationale: Rend directement le complément d’objet et conserve l’emploi révérenciel du « nom » pour désigner la personne et la renommée de Dieu.
- source_word: הקדוש
  choice: du Saint
  rationale: Le titre français « le Saint » rend naturellement l’hébreu substantivé « le saint [être] » sans le confondre avec l’adjectif qualifiant directement « nom ».
theological_decisions:
- issue: 'Titre divin dans la proposition finale : hébreu הקדוש contre grec Κυρίου'
  choice: du Saint
  alternative: du Seigneur
  rationale: Le texte principal suit le témoin hébreu conservé, prioritaire ici. La variante grecque est signalée en note, car elle présente un titre divin différent dans un contexte de louange.
translation_notes:
  register: Français moderne, clair et digne. Les impératifs au pluriel traduisent l’adresse collective hébraïque; « de tout votre cœur » garde une formulation idiomatique et solennelle.
