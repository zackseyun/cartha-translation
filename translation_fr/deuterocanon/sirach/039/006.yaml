base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/006.yaml
  text: If the great Lord wills[a], he will be filled with a spirit of understanding; he himself will pour forth words of wisdom like rain[b], and in prayer he will give thanks to the Lord.
translation:
  language: fr
  text: Si le grand Seigneur le veut, il sera rempli d’un esprit d’intelligence ; lui-même fera pleuvoir des paroles de sagesse[a] et, dans la prière, il rendra grâce au Seigneur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « répandra comme une pluie des paroles de sagesse ». Le verbe grec emploie l’image de la pluie.
    reason: lexical_alternative
  - marker: b
    text: Ou « confessera » ou « reconnaîtra le Seigneur ». Le verbe grec peut avoir ces sens, même si le contexte de la prière favorise ici « rendra grâce ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν Κύριος ὁ μέγας θελήσῃ
  choice: Si le grand Seigneur le veut
  rationale: La construction ἐὰν avec le subjonctif exprime une condition réelle et ouverte. « Le veut » rend directement la volonté du Seigneur, et « le grand Seigneur » conserve l’attribut grec sans lourdeur.
- source_word: πνεύματι συνέσεως ἐμπλησθήσεται
  choice: il sera rempli d’un esprit d’intelligence
  rationale: Le futur passif est conservé. « Esprit d’intelligence » rend le caractère qualitatif de l’expression et demeure clair en français moderne.
- source_word: ἀνομβρήσει ῥήματα σοφίας αὐτός
  choice: lui-même fera pleuvoir des paroles de sagesse
  rationale: « Fera pleuvoir » préserve l’image météorologique du verbe rare ἀνομβρήσει. « Lui-même » restitue l’emphase de αὐτός, et « paroles de sagesse » traduit directement ῥήματα σοφίας.
- source_word: ἐν προσευχῇ
  choice: dans la prière
  rationale: Cette formulation naturelle conserve la prière comme cadre ou domaine de l’action.
- source_word: ἐξομολογήσεται Κυρίῳ
  choice: il rendra grâce au Seigneur
  rationale: Dans ce contexte de prière, le verbe désigne probablement l’action de grâce ou la louange adressée au Seigneur. Son éventail sémantique plus large est signalé en note.
theological_decisions:
- issue: Sens de ἐξομολογήσεται dans le contexte de la prière
  choice: rendra grâce au Seigneur
  alternative: confessera ou reconnaîtra le Seigneur
  rationale: Le contexte dévotionnel favorise l’action de grâce, sans toutefois éliminer les sens possibles de confession ou de reconnaissance ; la note préserve cette ambiguïté lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le parallélisme, le futur passif, l’emphase de αὐτός et l’image vive de la pluie. Les appels de note sont placés après les expressions auxquelles ils se rapportent.
