base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/009.yaml
  text: Many will praise his understanding; it will not be blotted out forever. His remembrance will not depart[a], and his name will live for generations of generations.
translation:
  language: fr
  text: Beaucoup loueront son intelligence, qui ne sera jamais effacée ; son souvenir ne disparaîtra pas, et son nom vivra de génération en génération[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour des générations de générations » ; cette tournure souligne la continuité au fil des générations successives.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰνέσουσιν
  choice: loueront
  rationale: Le futur de αἰνέω exprime une louange formulée publiquement ; « loueront » est direct, naturel et digne.
- source_word: σύνεσιν
  choice: intelligence
  rationale: Dans ce contexte sapientiel, σύνεσις désigne la faculté de comprendre et de discerner. « Intelligence » convient ici mieux que le plus abstrait « compréhension ».
- source_word: ἕως τοῦ αἰῶνος οὐκ ἐξαλειφθήσεται
  choice: elle ne sera jamais effacée
  rationale: La tournure exprime une permanence durable, tandis que « effacée » conserve l’image concrète de ἐξαλείφω.
- source_word: μνημόσυνον
  choice: souvenir
  rationale: Le mot désigne ici le souvenir durable de la personne, en parallèle avec son nom qui continue de vivre, plutôt qu’un monument matériel.
- source_word: οὐκ ἀποστήσεται
  choice: ne disparaîtra pas
  rationale: Avec « souvenir » comme sujet, cette formulation française naturelle rend l’idée de ne pas se retirer ou cesser d’être présent.
- source_word: ὄνομα αὐτοῦ ζήσεται
  choice: son nom vivra
  rationale: La traduction littérale conserve la personnification poétique du nom et la notion de renommée persistante.
- source_word: εἰς γενεὰς γενεῶν
  choice: de génération en génération
  rationale: Cette expression française idiomatique communique clairement la succession prolongée des générations portée par la formule grecque intensifiée.
theological_decisions:
- issue: Degré de littéralité des images évoquant une renommée durable
  choice: Conserver les images de l’effacement, du souvenir et du nom qui vit.
  alternative: Résumer l’ensemble par « son héritage durera toujours ».
  rationale: Les images concrètes appartiennent à la poésie sapientielle du verset et doivent être préservées sans les réduire à l’idée abstraite d’un héritage.
- issue: Référent implicite de οὐκ ἐξαλειφθήσεται
  choice: Rattacher « elle » à « son intelligence ».
  alternative: Comprendre implicitement que c’est sa renommée ou sa mémoire qui ne sera pas effacée.
  rationale: Le nom féminin σύνεσιν est l’antécédent grammatical immédiat ; le français peut préserver ce lien, même si les propositions suivantes développent le thème plus large du souvenir durable.
translation_notes:
  register: Français international moderne, poétique mais accessible. La ponctuation distingue les trois affirmations parallèles, et la répétition des images concrètes du grec est maintenue.
