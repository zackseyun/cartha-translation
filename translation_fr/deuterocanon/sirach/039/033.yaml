  text: The works of God are all good[a], and for every need he provides in its time.
translation:
  language: fr
  text: Les œuvres de Dieu sont toutes bonnes[a], et à chaque besoin il pourvoit en son temps.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec dit : « Les œuvres du Seigneur sont toutes bonnes. » Le témoin hébreu porte ici « Dieu » plutôt que « le Seigneur ».'
    reason: alternative_reading
lexical_decisions:
- source_word: מעשה
  choice: les œuvres
  rationale: Le singulier hébreu a ici une valeur collective, confirmée par כלם (« toutes ») et par le pluriel grec τὰ ἔργα.
- source_word: אל
  choice: Dieu
  rationale: Le texte hébreu porte אל, titre divin rendu directement par « Dieu »; « le Seigneur » appartient au parallèle grec.
- source_word: טובים
  choice: bonnes
  rationale: Rend directement l’adjectif טובים sans réduire son sens à l’utilité ni le renforcer en « excellentes ».
- source_word: לכל צורך
  choice: à chaque besoin
  rationale: צורך désigne ici un besoin ou une nécessité. « À chaque besoin » exprime naturellement en français la correspondance entre le besoin et la provision divine.
- source_word: בעתו
  choice: en son temps
  rationale: Conserve le suffixe singulier et son lien possible avec le besoin ou l’occasion mentionnés, sans expliciter davantage l’expression.
- source_word: יספיק
  choice: il pourvoit
  rationale: Le verbe peut exprimer le fait de suffire ou de fournir suffisamment. Le présent général convient à la maxime, tandis que « pourvoit » garde l’idée d’une réponse suffisante au besoin.
theological_decisions:
- issue: Titre divin dans le premier membre
  choice: « Dieu » dans le texte principal
  alternative: « le Seigneur »
  rationale: Le témoin hébreu principal lit אל (« Dieu »), alors que le parallèle grec porte Κυρίου (« du Seigneur »). La traduction principale suit l’hébreu et signale la variante grecque en note.
- issue: Valeur temporelle de יספיק
  choice: 'présent général : « il pourvoit »'
  alternative: 'futur : « il pourvoira »'
  rationale: L’imparfait hébreu peut décrire une action habituelle ou générale. Dans cette affirmation sapientielle, le présent français exprime naturellement cette portée sans exclure l’action future.
translation_notes:
  register: Français international moderne, simple et digne. « Pourvoir à » est légèrement soutenu mais courant dans un contexte sapientiel. La formulation conserve le parallélisme et l’ambiguïté mesurée de « en son temps ».
