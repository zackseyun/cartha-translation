  text: He will serve among great men[a], and will appear before a ruler; he will travel through the land of foreign nations, for he has tested good and evil among men.
translation:
  language: fr
  text: Il servira parmi les grands personnages et paraîtra devant un dirigeant ; il traversera le territoire de nations étrangères, car il a éprouvé le bien et le mal parmi les humains[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car il a appris par expérience ce qui est bien et ce qui est mal parmi les humains ». Le verbe grec peut évoquer aussi bien l’expérience acquise que la mise à l’épreuve.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὰ μέσον μεγιστάνων
  choice: parmi les grands personnages
  rationale: « Parmi » rend naturellement l’expression ἀνὰ μέσον, tandis que « grands personnages » désigne des personnes éminentes ou de haut rang sans le technicisme de « magnats ».
- source_word: ὑπηρετήσει
  choice: servira
  rationale: Le verbe évoque un service ou une fonction d’assistance, ici vraisemblablement dans un cadre officiel ou de cour, sans connotation nécessairement cultuelle.
- source_word: ἔναντι ἡγουμένου ὀφθήσεται
  choice: paraîtra devant un dirigeant
  rationale: La tournure rend l’idée d’être vu ou admis en présence de quelqu’un qui gouverne, tout en conservant la formulation relativement générale de ἡγούμενος.
- source_word: ἐν γῇ ἀλλοτρίων ἐθνῶν διελεύσεται
  choice: il traversera le territoire de nations étrangères
  rationale: « Traversera » exprime le mouvement de διελεύσεται ; « territoire » restitue γῆ de façon naturelle en français dans cette construction, et le pluriel « nations » est conservé.
- source_word: ἐπείρασεν
  choice: a éprouvé
  rationale: « Éprouver » peut évoquer à la fois l’expérience vécue et la mise à l’essai, ce qui préserve en partie l’étendue sémantique du verbe grec.
- source_word: ἀγαθὰ καὶ κακὰ
  choice: le bien et le mal
  rationale: Cette traduction directe conserve la portée à la fois morale et expérientielle de l’opposition grecque sans la réduire à la prospérité et à l’adversité.
- source_word: ἐν ἀνθρώποις
  choice: parmi les humains
  rationale: ἄνθρωπος désigne ici les êtres humains en général. « Parmi les humains » exprime clairement le cadre de l’expérience humaine sans imposer une restriction aux hommes de sexe masculin.
theological_decisions:
- issue: Portée de l’expérience exprimée par ἐπείρασεν
  choice: Conserver dans le texte l’ambivalence entre expérience vécue et épreuve au moyen de « a éprouvé »
  alternative: « a fait l’expérience de » ou « a mis à l’épreuve »
  rationale: Le grec peut désigner ce que le sage a appris par expérience ou ce qu’il a examiné par l’épreuve. Le contexte ne permet pas de trancher entièrement, et aucune lecture théologique plus étroite ne doit être imposée.
- issue: Valeur générique de ἐν ἀνθρώποις
  choice: « parmi les humains »
  alternative: « parmi les hommes »
  rationale: Dans ce contexte, le nom grec a une portée humaine générale. Le choix inclusif transmet cette portée sans effacer le caractère social et concret de l’expression.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe coordonnée et le contraste « le bien et le mal » conservent le ton sapiential. « Grands personnages » et « dirigeant » maintiennent le cadre des élites et du pouvoir sans archaïsme excessif.
