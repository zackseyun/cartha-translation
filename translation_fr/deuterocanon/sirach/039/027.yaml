  text: All these things are for good to the good[a]; so also for the wicked they are turned to harm.
translation:
  language: fr
  text: Toutes ces choses font du bien aux gens de bien[a] ; de même, pour les méchants, elles se changent en mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le parallèle grec porte « les personnes pieuses », plutôt que simplement « les gens de bien ». L’hébreu dit littéralement « les bons ».
    reason: alternative_reading
lexical_decisions:
- source_word: כל אלה
  choice: Toutes ces choses
  rationale: Rend directement la portée globale du démonstratif hébreu dans un français naturel.
- source_word: לטובים ייטיבו
  choice: font du bien aux gens de bien
  rationale: Préserve le jeu lexical hébreu entre טובים et ייטיבו, ainsi que l'idée que ces choses ont un effet bénéfique sur les personnes bonnes.
- source_word: כן
  choice: de même
  rationale: Marque clairement la correspondance antithétique entre les deux membres de la phrase.
- source_word: לרעים
  choice: pour les méchants
  rationale: L'adjectif substantivé hébreu désigne ici les personnes moralement mauvaises; « les méchants » convient au registre sapientiel.
- source_word: לרעה נהפכו
  choice: elles se changent en mal
  rationale: Conserve la valeur réflexive ou résultative de נהפכו et le terme moralement ouvert רעה, qui peut désigner le mal, le malheur ou le tort.
theological_decisions:
- issue: Caractérisation morale ou religieuse des bénéficiaires
  choice: gens de bien
  alternative: personnes pieuses
  rationale: Le texte hébreu porte « les bons », tandis que le grec précise « les pieux ». La traduction principale suit l'hébreu sans effacer l'interprétation religieuse attestée par le grec, signalée en note.
- issue: Nature du résultat subi par les méchants
  choice: se changent en mal
  alternative: deviennent nuisibles
  rationale: « En mal » maintient l'ambivalence de רעה entre mal moral, malheur et effet nuisible, au lieu de la réduire au seul dommage pratique.
translation_notes:
  register: Français moderne, digne et accessible. « Gens de bien » permet de substantiver naturellement l'adjectif tout en conservant l'écho entre « bien » et « font du bien ». Le point-virgule maintient le parallélisme proverbial.
