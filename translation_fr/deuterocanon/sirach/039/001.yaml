  yaml_path: translation/deuterocanon/sirach/039/001.yaml
  text: But the one who gives himself over to it and meditates on the law of the Most High will seek out the wisdom of all the ancients[b][a], and will occupy himself with prophecies.
translation:
  language: fr
  text: Mais celui qui s’y consacre de toute son âme[a] et médite la Loi du Très-Haut recherchera la sagesse de tous les anciens et s’appliquera aux prophéties[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui livre son âme » ; autre traduction possible : « qui s’y voue entièrement ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « se consacrera aux écrits prophétiques » ; le grec dit littéralement : « s’occupera des prophéties ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πλὴν
  choice: Mais
  rationale: Marque le contraste avec les artisans décrits dans le contexte précédent, de façon naturelle et concise.
- source_word: τοῦ ἐπιδιδόντος τὴν ψυχὴν αὐτοῦ
  choice: celui qui s’y consacre de toute son âme
  rationale: Rend l’idée forte de livrer ou vouer sa personne entière, tout en fournissant par « y » le complément que le grec laisse implicite.
- source_word: διανοουμένου
  choice: médite
  rationale: Exprime une réflexion attentive et soutenue, appropriée au registre de la littérature sapientielle.
- source_word: ἐν νόμῳ Ὑψίστου
  choice: la Loi du Très-Haut
  rationale: Avec « méditer », le français construit naturellement le complément sans préposition. La majuscule à « Loi » signale ici l’enseignement divin désigné par νόμος.
- source_word: σοφίαν πάντων ἀρχαίων
  choice: la sagesse de tous les anciens
  rationale: Préserve la référence personnelle aux hommes des générations passées sans la réduire à une antiquité abstraite.
- source_word: ἐκζητήσει
  choice: recherchera
  rationale: Le préverbe intensif est bien rendu par « rechercher », qui évoque une quête attentive.
- source_word: ἐν προφητείαις ἀσχοληθήσεται
  choice: s’appliquera aux prophéties
  rationale: Rend l’engagement assidu exprimé par ἀσχολέομαι tout en conservant le sens direct de προφητείαις, sans imposer qu’il s’agisse exclusivement d’écrits.
theological_decisions:
- issue: Référent du complément implicite de ἐπιδιδόντος
  choice: Employer « s’y consacre », le pronom renvoyant contextuellement à l’étude sapientielle.
  alternative: Expliciter « se consacre à l’étude de la Loi » ou laisser la tournure sans complément.
  rationale: Le grec ne nomme pas l’objet de cette consécration. « Y » donne une phrase française complète tout en évitant de définir plus précisément que le texte ce à quoi l’homme se voue.
- issue: Portée de προφητείαις
  choice: Conserver « prophéties ».
  alternative: Traduire « écrits prophétiques ».
  rationale: Le terme grec peut viser les prophéties ou leur étude, mais il ne contient pas explicitement le mot « écrits » ; la formulation retenue préserve cette ouverture.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « de toute son âme » conserve l’image grecque sans suggérer une anthropologie technique, et « s’appliquera » exprime une étude assidue.
