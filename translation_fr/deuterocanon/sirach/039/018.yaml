  text: The desire of his will succeeds[a], and there is no hindrance to his salvation.
translation:
  language: fr
  text: Ce qu’il désire se réalise[a], et rien ne fait obstacle à son salut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Ce qui lui plaît réussit ». Le parallèle grec dit : « À son commandement, tout ce qui plaît [s’accomplit], et personne ne diminuera son salut. »'
    reason: Alternative lexicale pour la première expression et indication du témoin grec parallèle.
lexical_decisions:
- source_word: תאות רצונו
  choice: Ce qu’il désire
  rationale: La construction peut désigner le désir lui-même ou ce qui est désiré. Cette formulation idiomatique restitue naturellement l’objet de la volonté divine sans imposer une lecture plus étroite.
- source_word: יצליח
  choice: s’accomplit
  rationale: Le hifil de צלח exprime ici la réussite ou l’aboutissement. « S’accomplit » convient au dessein voulu par Dieu et évite la connotation matérielle que peut prendre « prospère » en français.
- source_word: מעצור
  choice: obstacle
  rationale: Le terme désigne ce qui retient ou empêche. « Rien ne fait obstacle » rend naturellement l’affirmation hébraïque selon laquelle il n’existe aucun empêchement.
- source_word: תשועתו
  choice: son salut
  rationale: תשועה peut signifier salut, délivrance ou victoire. « Salut » correspond directement au grec σωτήριον tout en conservant ici le sens large de l’action salvatrice de Dieu.
theological_decisions:
- issue: 'Portée de תשועתו : salut au sens doctrinal étroit ou délivrance au sens large'
  choice: son salut
  alternative: sa délivrance ; son œuvre de salut
  rationale: L’hébreu et le parallèle grec soutiennent « salut ». Le terme est conservé dans toute son amplitude biblique, sans le limiter à une formulation sotériologique ultérieure.
- issue: Rapport entre le désir de Dieu et son accomplissement
  choice: Ce qu’il désire s’accomplit
  alternative: Son désir réussit ; Ce qui lui plaît prospère
  rationale: La formulation exprime l’efficacité de la volonté divine tout en préservant l’ambiguïté de תאות entre le désir et son objet.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste accessible, tandis que « salut » conserve le poids théologique et la portée large du terme source.
