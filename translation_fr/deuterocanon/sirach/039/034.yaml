  text: Do not say[a], “This is bad[b]; what is this?” for everything will prevail in its time.
translation:
  language: fr
  text: 'Ne dis pas[a] : « Ceci est pire que cela », car toute chose se révélera bonne en son temps.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation hébraïque est difficile à cet endroit; le parallèle grec donne clairement le sens : « Ceci est pire que cela. »'
    reason: textual_variant
  - marker: b
    text: 'Autres traductions possibles : « toute chose prospérera en son temps », « toute chose sera approuvée en son temps » ou, en suivant plus littéralement l’hébreu, « toute chose prévaudra en son temps ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אל לאמר
  choice: Ne dis pas
  rationale: אל a ici une valeur prohibitive devant l’infinitif לאמר. En français courant, la tournure s’exprime naturellement par un impératif négatif.
- source_word: זה רע מה זה
  choice: Ceci est pire que cela
  rationale: L’hébreu transmis est difficile, mais le parallèle grec Τοῦτο τούτου πονηρότερον confirme une comparaison entre deux choses. Cette formulation française en préserve clairement le sens.
- source_word: כי
  choice: car
  rationale: כי introduit la raison donnée pour ne pas porter ce jugement comparatif.
- source_word: הכל
  choice: toute chose
  rationale: Le terme a une portée universelle. Le singulier collectif s’accorde naturellement avec le suffixe singulier de בעתו.
- source_word: בעתו
  choice: en son temps
  rationale: La traduction conserve le suffixe possessif et l’idée du moment propre à chaque chose, sans ajouter explicitement la notion de temps fixé.
- source_word: יגביר
  choice: se révélera bonne
  rationale: La forme hébraïque est difficile dans ce contexte. Le grec εὐδοκιμηθήσεται soutient une issue favorable, telle que « se montrer bonne », « être approuvée » ou « prospérer »; « se révélera bonne » rend ici la force évaluative du propos.
theological_decisions:
- issue: Clarification de l’hébreu difficile par le parallèle grec
  choice: Comprendre le propos comme l’interdiction de déclarer une chose pire qu’une autre, puisque chacune se révélera bonne en son temps.
  alternative: 'Traduire littéralement l’hébreu transmis : « Ne dis pas : Ceci est mauvais; qu’est-ce que ceci? car tout prévaudra en son temps. »'
  rationale: Le texte hébreu demeure prioritaire, mais sa formulation présente ici une difficulté reconnue. Le grec ancien éclaire à la fois la comparaison et la portée positive du dernier verbe, sans éliminer les autres possibilités, qui sont signalées en notes.
translation_notes:
  register: Français international moderne, simple et digne. « Ceci… cela » maintient nettement la comparaison; « toute chose » évite une discordance entre « tout » et « son temps ». Les notes rendent visibles les difficultés textuelles et lexicales sans alourdir le verset.
