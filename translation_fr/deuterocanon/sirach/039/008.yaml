  yaml_path: translation/deuterocanon/sirach/039/008.yaml
  text: He himself makes plain the instruction of his teaching[b][a], and in the law of the Lord’s covenant he will boast.
translation:
  language: fr
  text: Lui-même fait connaître l’instruction de son enseignement[a], et il se glorifiera dans la loi de l’alliance du Seigneur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rend manifeste la discipline de son enseignement ». Les termes grecs peuvent évoquer à la fois une formation qui discipline et l’action de rendre quelque chose manifeste.
    reason: lexical_alternative
  - marker: b
    text: Ou « il tirera fierté de la loi de l’alliance du Seigneur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: Lui-même
  rationale: Le pronom intensif souligne le sujet; « Lui-même » conserve cette insistance.
- source_word: ἐκφαίνει
  choice: met en lumière
  rationale: Le verbe exprime l’action de faire paraître ou de rendre manifeste; « met en lumière » garde cette nuance sans suggérer nécessairement une révélation divine.
- source_word: παιδείαν
  choice: instruction
  rationale: Dans la littérature de sagesse, le terme désigne une formation qui peut aussi comporter discipline et correction. « Instruction » convient au contexte pédagogique tout en restant accessible.
- source_word: διδασκαλίας
  choice: enseignement
  rationale: Ce choix rend directement le sens pédagogique du nom, sans la coloration technique ou confessionnelle que pourrait avoir « doctrine ».
- source_word: νόμῳ
  choice: loi
  rationale: Dans ce contexte juif sapientiel, le mot renvoie naturellement à la Loi; « loi » est la formulation biblique claire et habituelle.
- source_word: διαθήκης
  choice: alliance
  rationale: Dans l’usage biblique, le terme désigne ici l’alliance du Seigneur, non un testament.
- source_word: Κυρίου
  choice: du Seigneur
  rationale: « Seigneur » est l’équivalent biblique naturel de κύριος dans cette construction.
- source_word: καυχήσεται
  choice: il mettra sa fierté
  rationale: Le futur exprime le fait de se glorifier ou de tirer fierté de quelque chose. Cette tournure française est naturelle et évite la connotation exclusivement négative de « se vanter ».
theological_decisions:
- issue: Rapport entre « loi » et « alliance » dans ἐν νόμῳ διαθήκης Κυρίου
  choice: « dans la loi de l’alliance du Seigneur »
  alternative: « dans la loi, alliance du Seigneur » ou « dans la loi d’alliance du Seigneur »
  rationale: Le génitif relie le plus naturellement « alliance » à « loi ». La formulation retenue préserve cette relation sans préciser davantage si la loi constitue l’alliance ou si elle lui appartient.
- issue: Valeur de καυχήσεται dans un contexte religieux
  choice: « il mettra sa fierté »
  alternative: « il se glorifiera » ou « il se vantera »
  rationale: Le grec peut exprimer une fierté ou une glorification positive. Le choix retenu conserve cette possibilité sans transformer le propos en condamnation morale ni lui imposer une portée doctrinale.
translation_notes:
  register: Français international moderne, digne et lisible. La structure reste proche du grec, tandis que « mettra sa fierté » fournit une expression française naturelle. Les notes maintiennent les nuances de formation disciplinaire et de glorification.
