translation:
  language: fr
  text: Lui-même orientera son conseil et son savoir, et il méditera sur ses secrets[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses choses cachées », « ses réalités cachées » ou « ses affaires cachées ». L’expression grecque peut désigner ce qui est caché, sans préciser davantage s’il s’agit notamment d’enseignements ou d’autres réalités dissimulées.
    reason: alternative lexicale et préservation de l’ambiguïté
lexical_decisions:
- source_word: αὐτὸς
  choice: lui-même
  rationale: Le pronom est emphatique; « lui-même » conserve cette insistance sans préciser davantage l’identité du référent.
- source_word: κατευθυνεῖ
  choice: orientera
  rationale: Le verbe évoque l’action de rendre droit ou de diriger. « Orientera » reste naturel en français tout en conservant le caractère actif et ouvert de l’expression.
- source_word: βουλήν
  choice: conseil
  rationale: βουλή peut désigner le conseil, le projet ou la délibération. « Conseil » préserve cette amplitude dans le contexte sapientiel, malgré une formulation volontairement concise.
- source_word: ἐπιστήμην
  choice: savoir
  rationale: Dans la littérature de sagesse, le terme désigne la connaissance ou l’intelligence acquise. « Savoir » s’accorde naturellement avec « conseil » et évite une tournure trop abstraite.
- source_word: ἀποκρύφοις
  choice: secrets
  rationale: Employé substantivement, l’adjectif désigne ce qui est caché. « Secrets » est idiomatique en français, mais une note conserve les autres nuances possibles sans imposer un sens ésotérique.
- source_word: διανοηθήσεται
  choice: méditera sur
  rationale: Le futur moyen exprime une activité intérieure de pensée et de délibération. « Méditera sur » en rend clairement la dimension contemplative.
- source_word: αὐτοῦ
  choice: son / ses
  rationale: Les possessifs masculins singuliers reprennent naturellement le même référent que le sujet grec, sans résoudre son identité à partir du contexte élargi.
theological_decisions:
- issue: Référent des pronoms répétés
  choice: Maintenir un sujet masculin singulier avec « lui-même », « son » et « ses ».
  alternative: Employer une formulation plus impersonnelle ou expliciter l’identité du référent à partir du contexte.
  rationale: Le grec assure la cohésion grammaticale du sujet et des possessifs, mais le verset isolé ne nomme pas leur référent. La traduction conserve cette tension sans ajouter d’identification doctrinale.
- issue: Nature des « secrets »
  choice: Laisser l’expression ouverte, avec une note signalant qu’elle peut désigner des réalités, enseignements ou questions cachés.
  alternative: Préciser qu’il s’agit de mystères divins ou de pensées intérieures personnelles.
  rationale: La formule grecque est concise et ne permet pas de trancher entre ces possibilités; une explicitation dans le texte principal réduirait indûment son ambiguïté.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve le parallélisme du grec; « secrets » rend l’expression lisible tout en laissant sa portée ouverte grâce à la note.
