  text: Il conservera les récits des hommes illustres et entrera dans les détours des paraboles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διηγήσεις
  choice: les récits
  rationale: Le terme désigne des narrations ou des récits; ce choix est naturel en français et garde la portée générale du grec.
- source_word: ἀνδρῶν ὀνομαστῶν
  choice: des hommes illustres
  rationale: ὀνομαστός qualifie ceux qui sont renommés ou célèbres; «illustres» convient au registre sapientiel sans ajouter de précision.
- source_word: συντηρήσει
  choice: conservera
  rationale: Le verbe peut signifier garder, préserver ou conserver attentivement. «Conservera» maintient l'idée de transmission fidèle.
- source_word: ἐν στροφαῖς παραβολῶν
  choice: les détours des paraboles
  rationale: στροφαί évoque des tours, détours ou sinuosités. «Détours» préserve l'image et l'idée des formulations difficiles à démêler.
- source_word: συνεισελεύσεται
  choice: pénétrera
  rationale: Le grec exprime littéralement l'entrée dans quelque chose; «pénétrera» rend naturellement l'engagement intellectuel dans les détours des paraboles.
