base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/028.yaml
  text: There are spirits created for judgment[a], and in their anger they move mountains; at the time of wrath they display their might[b], and they stir up a storm from the open country.
translation:
  language: fr
  text: Il y a des esprits créés pour le jugement[a] ; dans leur colère, ils déplacent les montagnes. Au temps de la fureur, ils montrent leur puissance[b] et soulèvent une tempête venue de la campagne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des vents créés pour le châtiment ». Le mot hébreu רוחות, comme le grec πνεύματα, peut désigner des esprits ou des vents.'
    reason: lexical_alternative
  - marker: b
    text: La seconde partie du verset est placée entre crochets dans l’édition hébraïque des manuscrits de la Guéniza du Caire, ce qui signale une incertitude textuelle. Le témoin grec atteste toutefois une forme plus développée du verset.
    reason: textual_variant
lexical_decisions:
- source_word: רוחות
  choice: esprits
  rationale: Le pluriel hébreu peut désigner des « esprits » ou des « vents », tout comme le grec πνεύματα. « Esprits » convient à leur présentation comme agents créés pour le jugement, tandis qu’une note conserve l’autre sens possible.
- source_word: למשפט
  choice: pour le jugement
  rationale: Cette formulation exprime leur destination sans réduire משפט au seul châtiment.
- source_word: נוצרו
  choice: créés
  rationale: Le passif indique qu’ils ont été formés ou créés ; « créés » est clair et concorde avec le grec ἔκτισται.
- source_word: ובאפם
  choice: dans leur colère
  rationale: אף désigne ici idiomatiquement la colère, lecture confirmée par le grec θυμός.
- source_word: הרים יעתיקו
  choice: ils déplacent les montagnes
  rationale: Le verbe évoque le déplacement ou l’arrachement des montagnes ; « déplacent » préserve l’image sans préciser excessivement son mécanisme.
- source_word: בעת זעם
  choice: au temps de la fureur
  rationale: La formule rend l’occasion où cette puissance punitive se manifeste et garde l’intensité de זעם.
- source_word: גבורתם יראו
  choice: ils montrent leur puissance
  rationale: Le texte dit que leur force devient manifeste ; cette expression est naturelle en français moderne.
- source_word: וסער מן שדה יעוררו
  choice: et soulèvent une tempête venue de la campagne
  rationale: סער est une tempête et יעוררו signifie la susciter ou la soulever. שדה désigne le champ ou la campagne ouverte ; « campagne » conserve ce cadre sans lui imposer le sens plus étroit de désert.
theological_decisions:
- issue: רוחות/πνεύματα désigne-t-il des forces météorologiques ou des agents personnifiés du jugement divin ?
  choice: « esprits » dans le texte principal
  alternative: « vents créés pour le châtiment »
  rationale: Les deux sens sont possibles, et le verset associe agents créés, colère et tempête. Le texte principal retient la lecture personnifiée, tandis que la note préserve explicitement l’ambiguïté.
- issue: Faut-il inclure la seconde moitié placée entre crochets dans l’édition hébraïque composite ?
  choice: L’inclure dans le texte principal avec une note
  alternative: Omettre la proposition incertaine
  rationale: L’hébreu fourni signale une incertitude textuelle, mais le témoin grec soutient une forme plus longue du verset. L’inclusion accompagnée d’une note rend compte des deux données sans masquer la difficulté.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme poétique. « Campagne » rend שדה comme espace ouvert sans introduire l’idée non certaine de terrain désertique.
