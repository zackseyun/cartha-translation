  verdict: revise
  source_fidelity: Le sens principal rend correctement מעשה כל בשר (« les actes/l’agir de toute chair »), נגדו (« devant lui ») et l’affirmation qu’aucune chose n’est cachée à son regard. Le texte français proposé « tout être de chair » déplace toutefois légèrement l’expression collective « toute chair » vers une série d’individus et produit une formulation moins directement fidèle à l’idiome hébreu et grec.
  naturalness: « Les actes de toute chair » est à la fois plus naturel dans un registre biblique français moderne et plus proche de l’expression source que « Les actes de tout être de chair ». « À ses yeux » est idiomatique. La note grecque doit éviter « se cacher loin de ses yeux », qui n’exprime pas exactement la tournure passive et ajoute l’idée de distance.
  terminology: Conserver « chair » maintient l’idiome commun à l’hébreu et au grec sans décider si le référent est l’humanité ou l’ensemble des êtres vivants. « Actes » convient pour le collectif hébreu et concorde avec le pluriel grec ἔργα.
