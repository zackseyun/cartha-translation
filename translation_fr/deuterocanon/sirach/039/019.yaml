translation:
  language: fr
  text: Les actes de toute chair sont devant lui[a], et rien n’est caché à ses yeux.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « de toute l’humanité » ou « de tout être vivant ». Littéralement : « de toute chair » ; l’expression hébraïque a une portée large, tout comme le grec parallèle.'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec dit : « et il n’est pas possible d’être caché à ses yeux », exprimant l’impossibilité un peu plus explicitement que l’hébreu.'
    reason: alternative_reading
lexical_decisions:
- source_word: מעשה
  choice: les actes
  rationale: Le singulier construit a ici une valeur collective. « Les actes » rend naturellement les actions accomplies et correspond au grec ἔργα.
- source_word: כל בשר
  choice: tout être de chair
  rationale: Cette formulation conserve l’image biblique de la chair et la portée large de l’expression hébraïque, qui peut viser l’ensemble des êtres vivants ou l’humanité, sans imposer l’une de ces interprétations.
- source_word: נגדו
  choice: devant lui
  rationale: Rend directement l’idée de ce qui se trouve en sa présence et s’accorde avec le grec ἐνώπιον αὐτοῦ.
- source_word: אין נסתר
  choice: rien n’est caché
  rationale: Reproduit directement l’énoncé hébreu sans transformer explicitement le constat en expression de possibilité.
- source_word: מנגד עיניו
  choice: à ses yeux
  rationale: Expression française naturelle qui conserve l’idée de l’exposition au regard divin, là où un calque tel que « de devant ses yeux » serait maladroit.
theological_decisions:
- issue: Portée de כל בשר sous le regard divin
  choice: Conserver l’image large dans « tout être de chair ».
  alternative: « toute l’humanité » ou « tout être vivant »
  rationale: L’hébreu et le parallèle grec emploient tous deux « chair ». La traduction maintient donc l’ampleur et l’ambiguïté de l’expression au lieu de la limiter aux seuls humains ou de l’étendre explicitement à toute créature.
- issue: Constat ou impossibilité de se cacher
  choice: 'Suivre l’hébreu : « rien n’est caché ».'
  alternative: « rien ne peut se cacher »
  rationale: L’hébreu énonce l’absence de toute chose cachée, tandis que le grec rend l’impossibilité plus explicite. Le texte principal suit la source hébraïque et la note signale la nuance grecque.
translation_notes:
  register: Français moderne, clair et digne. « Tout être de chair » garde la couleur biblique et l’ambiguïté de l’hébreu tout en restant compréhensible ; « à ses yeux » évite un calque peu naturel.
