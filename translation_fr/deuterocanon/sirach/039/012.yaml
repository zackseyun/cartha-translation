    rationale: « Exposer ce que j’ai retenu » ajoute l’action d’exposer et transforme le choix personnel exprimé par le futur moyen en une communication d’enseignement. Cette extension contextuelle n’est pas dans le texte grec.
  - severity: low
    issue: Note a devenue interprétative et inutile
    rationale: La note présente « je ferai mon choix » comme une simple alternative alors que c’est le sens lexical direct; elle sert surtout à justifier la paraphrase du texte principal.
