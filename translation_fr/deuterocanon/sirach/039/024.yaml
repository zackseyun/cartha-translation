  text: The ways of the blameless are made straight[b][a]; but for strangers they become ruinous.
translation:
  language: fr
  text: Les voies des intègres deviennent droites ; mais, pour les étrangers, elles deviennent des obstacles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le dernier verbe hébreu est difficile. Le grec porte : « mais, pour les sans-loi, des obstacles » ; il interprète peut-être les « étrangers » comme des personnes étrangères à la voie de Dieu.'
    reason: textual_variant
lexical_decisions:
- source_word: ארחות
  choice: sentiers
  rationale: Le pluriel désigne des chemins, souvent au sens figuré de conduite ou de parcours. « Sentiers » conserve cette image en français naturel.
- source_word: תמים
  choice: l’homme intègre
  rationale: תמים évoque l’intégrité, l’entièreté morale ou l’absence de reproche. « L’homme intègre » rend ce sens sans reprendre l’interprétation grecque « les fidèles/pieux ».
- source_word: יישרו
  choice: deviennent droits
  rationale: La forme issue de ישר exprime ici que les sentiers se font droits ou s’aplanissent. Cette formulation préserve le mouvement verbal sans imposer explicitement un agent.
- source_word: כן
  choice: en revanche
  rationale: Bien que כן signifie normalement « ainsi », le parallélisme antithétique appelle en français un marqueur de contraste.
- source_word: לזרים
  choice: pour les étrangers
  rationale: זר signifie littéralement « étranger » ou « personne extérieure ». Le choix conserve l’ambiguïté hébraïque plutôt que d’adopter dans le texte l’interprétation morale du grec, « les sans-loi ».
- source_word: יסתוללו
  choice: ils deviennent des obstacles
  rationale: Le verbe hébreu est difficile. Le grec προσκόμματα (« obstacles, pierres d’achoppement ») soutient l’idée d’entrave ou de chute ; « deviennent des obstacles » exprime prudemment ce sens contextuel.
theological_decisions:
- issue: « étrangers » en hébreu ou « sans-loi » dans le grec
  choice: Maintenir « les étrangers » dans le texte principal.
  alternative: « les sans-loi »
  rationale: Le témoin hébreu, ici disponible avec une forte confiance, doit gouverner. Le grec semble expliciter moralement les « étrangers » comme ceux qui sont étrangers à l’ordre divin ; cette interprétation est signalée en note plutôt qu’intégrée au texte.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme est conservé ; « en revanche » explicite naturellement l’antithèse. La note réunit la difficulté lexicale du dernier verbe et la lecture interprétative grecque.
