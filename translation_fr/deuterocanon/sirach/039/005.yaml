base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/005.yaml
  text: He will devote his heart to rising early to the Lord who made him[a], and he will make supplication before the Most High; he will open his mouth in prayer, and he will make supplication for his sins.
translation:
  language: fr
  text: Il consacrera son cœur à rechercher dès le matin le Seigneur qui l’a fait[a], et il le suppliera devant le Très-Haut ; il ouvrira la bouche dans la prière et le suppliera au sujet de ses péchés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à se lever tôt pour le Seigneur » ; le verbe grec désigne le fait de se lever tôt et peut, dans ce contexte, évoquer une recherche empressée dès le matin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδώσει τὴν καρδίαν αὐτοῦ
  choice: Il appliquera son cœur
  rationale: La tournure conserve l’image grecque du cœur dirigé volontairement vers une activité, dans un français digne et intelligible.
- source_word: ὀρθρίσαι πρὸς Κύριον
  choice: à se lever de bon matin pour aller vers le Seigneur
  rationale: ὀρθρίσαι exprime directement le fait de se lever tôt, tandis que πρὸς garde l’orientation vers le Seigneur. La formulation française explicite naturellement cette articulation sans transformer le verbe en simple recherche.
- source_word: τὸν ποιήσαντα αὐτόν
  choice: qui l’a fait
  rationale: Rendu transparent et proche du participe grec, sans substituer le titre plus interprétatif « son Créateur ».
- source_word: ἔναντι Ὑψίστου
  choice: en présence du Très-Haut
  rationale: Cette formulation restitue la métaphore spatiale et révérencielle de ἔναντι dans un français naturel.
- source_word: δεηθήσεται
  choice: il adressera ses supplications / il suppliera
  rationale: Le verbe indique une requête insistante. La variation française évite une répétition lourde tout en maintenant la reprise du même acte dans le grec.
- source_word: ἀνοίξει στόμα αὐτοῦ ἐν προσευχῇ
  choice: il ouvrira la bouche pour prier
  rationale: La formulation préserve l’image concrète de l’ouverture de la bouche et rend idiomatiquement ἐν προσευχῇ.
- source_word: περὶ τῶν ἁμαρτιῶν αὐτοῦ
  choice: au sujet de ses péchés
  rationale: περί indique ici l’objet de la supplication. Cette traduction conserve l’indétermination du grec quant à une confession, un pardon ou une expiation.
theological_decisions:
- issue: Traduction de Κύριος dans ce contexte sapientiel grec
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » est le titre divin français usuel et conserve la force révérencielle du grec.
- issue: Portée de la supplication concernant les péchés
  choice: il suppliera au sujet de ses péchés
  alternative: il demandera pardon pour ses péchés
  rationale: Le grec ne précise ni le contenu exact de la requête ni explicitement le pardon. La traduction préserve cette ouverture théologique.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le parallélisme de la phrase et les images du cœur et de la bouche sont conservés ; la syntaxe est légèrement explicitée pour rester naturelle.
