  naturalness: Le français est sobre, moderne et idiomatique. « Il ne faut pas dire » convient bien à l’avertissement général, et le parallélisme « Pourquoi ceci ? Pourquoi cela ? » est net. Une légère correction de la note rend la formulation grecque plus exacte et moins interprétative.
