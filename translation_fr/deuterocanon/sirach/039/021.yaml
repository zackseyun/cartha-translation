  text: One should not say[a], “Why this and why that?” For everything will prevail in its time.
translation:
  language: fr
  text: 'Il ne faut pas dire[a] : « Pourquoi ceci ? Pourquoi cela ? » Car toute chose prévaudra en son temps.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Car toutes choses ont été créées pour leur usage. » L’hébreu porte : « Car toute chose prévaudra en son temps. »'
    reason: Variante importante entre les traditions textuelles hébraïque et grecque.
lexical_decisions:
- source_word: אין לאמר
  choice: Il ne faut pas dire
  rationale: Cette tournure impersonnelle rend naturellement en français moderne l’hébreu littéral « il n’y a pas à dire » et conserve la portée générale de l’avertissement.
- source_word: זה למה זה
  choice: « Pourquoi ceci ? Pourquoi cela ? »
  rationale: La répétition de זה avec למה forme deux questions rhétoriques. La formulation française conserve le parallélisme et l’idée d’une contestation portant tour à tour sur chaque chose.
- source_word: כי
  choice: Car
  rationale: Conjonction causale claire et digne, introduisant le motif de l’avertissement.
- source_word: הכל
  choice: toute chose
  rationale: Le singulier distributif français s’accorde naturellement avec le suffixe singulier de « son temps » et exprime la totalité visée.
- source_word: בעתו
  choice: en son temps
  rationale: La formule garde le suffixe possessif et l’idée du temps propre ou approprié à chaque chose, sans ajouter explicitement « fixé » ou « voulu ».
- source_word: יגבר
  choice: prévaudra
  rationale: Le verbe גבר signifie devenir fort, l’emporter ou prévaloir. « Prévaudra » préserve cette nuance de force, même si elle demeure quelque peu énigmatique dans le contexte.
theological_decisions:
- issue: Divergence entre l’hébreu et le grec dans le second membre
  choice: 'Suivre dans le texte principal l’hébreu : « Car toute chose prévaudra en son temps. »'
  alternative: « Car toutes choses ont été créées pour répondre à leurs besoins. »
  rationale: Le témoin hébreu est conservé avec une confiance élevée et constitue ici la source principale. Le grec transmet une affirmation matériellement différente sur la création et l’utilité ; cette variante importante est donc signalée en note plutôt que fusionnée avec l’hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure impersonnelle convient à une maxime sapientielle. « Prévaudra » conserve volontairement la tension et l’étrangeté du verbe hébreu au lieu de l’interpréter comme « sera utile » ou « remplira son rôle ».
