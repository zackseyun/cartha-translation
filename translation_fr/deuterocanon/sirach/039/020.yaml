  text: From eternity to eternity he looks on[a], and nothing is too wondrous or too strong for him.
translation:
  language: fr
  text: D’éternité en éternité, il regarde[a], et rien n’est trop merveilleux ni trop puissant pour lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle dit : « D’âge en âge, il a regardé, et rien n’est merveilleux devant lui » ; il ne comporte pas l’ajout hébreu « ni trop puissant ».'
    reason: textual_variant
lexical_decisions:
- source_word: מעולם ועד עולם
  choice: D’éternité en éternité
  rationale: L’expression hébraïque embrasse toute la durée. Cette formulation française conserve son ampleur solennelle sans la réduire à une période déterminée.
- source_word: יביט
  choice: il regarde
  rationale: L’imparfait hébreu peut exprimer ici une vérité générale. « Il regarde » préserve l’image visuelle et le caractère sentencieux du verset.
- source_word: נפלא
  choice: trop merveilleux
  rationale: Dans cette construction négative, « rien n’est trop merveilleux pour lui » exprime naturellement qu’aucune réalité extraordinaire ne dépasse sa connaissance ou sa capacité, tout en gardant le sens de merveille.
- source_word: חזק
  choice: trop puissant
  rationale: Le texte hébreu ajoute explicitement l’idée de force. « Puissant » convient mieux qu’un littéral « fort » pour une réalité susceptible de surpasser quelqu’un.
- source_word: ממנו
  choice: pour lui
  rationale: 'Dans la double proposition négative, « pour lui » donne en français le sens relationnel naturel : rien ne dépasse ses capacités. Un rendu comparatif comme « plus puissant que lui » modifierait la syntaxe et s’accorderait mal avec נפלא.'
theological_decisions:
- issue: Sujet implicite du verbe hébreu
  choice: Employer le pronom « il », renvoyant à Dieu dans le contexte
  alternative: Répéter explicitement « Dieu »
  rationale: L’hébreu n’énonce pas de nouveau le sujet. Le pronom requis par le français conserve cette concision sans ajouter un nom absent du verset.
- issue: Portée de נפלא et חזק
  choice: 'Conserver les deux prédicats hébreux : « trop merveilleux ni trop puissant »'
  alternative: 'Suivre le grec : « rien n’est merveilleux devant lui »'
  rationale: Le témoin hébreu principal comporte les deux termes. Les conserver maintient la tension entre ce qui dépasse l’entendement et ce qui dépasse la puissance, tandis qu’une note signale la forme grecque plus courte.
translation_notes:
  register: Français international moderne, clair et soutenu. La cadence « D’éternité en éternité » garde la solennité sapientielle ; la syntaxe reste simple et accessible.
