  text: Blessings overflowed like the Nile[b][a], and like a river they drenched the world.
translation:
  language: fr
  text: Les bénédictions ont débordé comme le Nil[a] et, comme un fleuve, elles ont abreuvé le monde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Des bénédictions, comme le Nil, ont débordé. » Le grec porte le singulier avec un possessif : « Sa bénédiction a recouvert comme un fleuve et, comme un déluge, a saturé la terre sèche. »'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « elles ont irrigué le monde » ou « elles ont saturé le monde ». Le grec lit : « et, comme un déluge, elle a saturé la terre sèche ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ברכות
  choice: les bénédictions
  rationale: Le texte hébreu porte un pluriel. Le français le conserve, tandis que la lecture grecque au singulier avec possessif est signalée en note.
- source_word: כיאור
  choice: comme le Nil
  rationale: יאר désigne couramment le Nil; cette précision préserve l’image de sa crue.
- source_word: הציפה
  choice: ont débordé
  rationale: Le verbe évoque une montée des eaux qui déborde ou submerge. « Ont débordé » restitue naturellement l’image du Nil sans ajouter de complément absent de l’hébreu.
- source_word: וכנהר
  choice: et, comme un fleuve
  rationale: La traduction conserve la seconde comparaison aquatique et la distingue clairement de la mention précise du Nil.
- source_word: תבל
  choice: le monde
  rationale: תבל désigne le monde, souvent envisagé comme la terre habitée; « le monde » est ici naturel et garde la portée ample de l’image.
- source_word: ריותה
  choice: elles ont abreuvé
  rationale: Le verbe exprime l’action d’abreuver, d’irriguer ou de saturer d’eau. « Abreuvé » garde la métaphore bénéfique tout en laissant la variante plus intense en note.
theological_decisions:
- issue: Nombre du nom « bénédiction »
  choice: 'pluriel : « les bénédictions »'
  alternative: 'singulier possessif : « sa bénédiction »'
  rationale: Le pluriel est celui du texte hébreu fourni. Le grec parallèle lit au singulier « sa bénédiction »; cette variante réelle est conservée en note plutôt que substituée au texte hébreu.
- issue: Présence d’un possessif
  choice: aucun possessif ajouté
  alternative: « ses bénédictions » ou « sa bénédiction »
  rationale: Le texte hébreu ne porte pas de suffixe possessif sur ברכות. Ne pas ajouter « ses » évite d’expliciter dans ce verset un référent seulement fourni par le contexte ou par le grec.
translation_notes:
  register: Français international moderne, digne et imagé. Le parallélisme aquatique est maintenu; « abreuvé » reste accessible tout en rendant la fécondité suggérée par רוה.
