base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/026.yaml
  text: The essentials for human life are water[a], fire, iron, and salt; wheat flour, milk, and honey; the blood of the grape, oil[b], and clothing.
translation:
  language: fr
  text: Les éléments essentiels à la vie humaine sont l’eau, le feu, le fer et le sel ; la farine fine de blé[a], le lait et le miel ; le sang du raisin[b], l’huile et les vêtements.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu transmis est difficile à cet endroit. Littéralement, il peut évoquer « la graisse du blé », c’est-à-dire sa meilleure part ; le grec porte « farine fine de blé ».
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « le sang du raisin ». L’expression peut désigner une boisson tirée du raisin, notamment le vin, mais la traduction conserve l’image du texte source.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ראש לחיי אדם
  choice: les choses essentielles à la vie humaine
  rationale: Dans ce contexte, ראש désigne ce qui est primordial ou indispensable, plutôt qu’un commencement chronologique. Cette formulation rend naturellement la portée générale de אדם et s’accorde avec le parallèle grec.
- source_word: מים, ואש וברזל ומלח
  choice: l’eau, le feu, le fer et le sel
  rationale: Traduction directe des quatre nécessités concrètes énumérées dans l’hébreu et confirmées par le grec.
- source_word: חלב חטה
  choice: la fleur de farine de blé
  rationale: Le texte hébreu transmis est difficile et pourrait se comprendre littéralement comme « la graisse du blé », c’est-à-dire sa meilleure part. Le grec σεμίδαλις πυρός appuie le sens de farine fine de blé ; « fleur de farine de blé » conserve l’idée d’une farine de qualité supérieure.
- source_word: חלב ודבש
  choice: le lait et le miel
  rationale: Le contexte alimentaire et le grec γάλα καὶ μέλι confirment ici le sens « lait » de חלב, suivi du sens ordinaire « miel » pour דבש.
- source_word: דם עינב
  choice: le sang du raisin
  rationale: La traduction conserve l’image frappante de l’hébreu, également reproduite par le grec, sans décider à tort s’il s’agit précisément de vin ou plus largement d’une boisson tirée du raisin.
- source_word: יצהר
  choice: l’huile
  rationale: יצהר désigne couramment l’huile fraîche, généralement d’olive. « L’huile » reste fidèle sans ajouter une précision qui n’est pas exprimée dans le verset.
- source_word: בגד
  choice: les vêtements
  rationale: Le singulier collectif hébreu désigne l’habillement en général ; le pluriel français est naturel dans une liste de nécessités humaines.
theological_decisions:
- issue: Portée générique de אדם
  choice: la vie humaine
  alternative: la vie de l’homme
  rationale: אדם désigne ici l’être humain en général. « La vie humaine » exprime cette portée universelle sans introduire une référence particulière au sexe masculin.
- issue: Identification du « sang du raisin »
  choice: conserver l’image sans préciser davantage
  alternative: le vin ou le jus de raisin
  rationale: Le texte nomme littéralement le « sang du raisin ». Le rendre par « vin » ou « jus de raisin » résoudrait une ambiguïté que le verset lui-même laisse ouverte.
translation_notes:
  register: Français international moderne, clair et digne. La structure en trois groupes est conservée par des points-virgules. « Fleur de farine » appartient au registre courant soigné et traduit la qualité fine indiquée par le parallèle grec.
