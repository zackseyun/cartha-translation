  text: So also his wrath will dispossess nations, and he will turn their drink into brine.
translation:
  language: fr
  text: De même, sa colère dépossédera les nations[a], et il changera leur boisson en saumure[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « sa colère recevra les nations en héritage ». L’hébreu signifie probablement ici « dépossédera les nations », ce qui correspond mieux au contexte de jugement.'
    reason: alternative_reading
  - marker: b
    text: Le grec lit « les eaux », là où l’hébreu emploie un terme plus large qui désigne une boisson ou ce que l’on boit.
    reason: lexical_alternative
lexical_decisions:
- source_word: כן
  choice: De même
  rationale: Exprime naturellement la correspondance avec le contexte précédent.
- source_word: זעמו
  choice: sa colère
  rationale: Rend l’idée de colère divine avec gravité, sans employer un terme excessivement archaïque.
- source_word: גוים
  choice: des nations
  rationale: Traduction courante et contextuellement appropriée, sans introduire la distinction plus tardive portée par « païens » ou « Gentils ».
- source_word: יוריש
  choice: dépossédera
  rationale: Le hiphil de ירש peut signifier déposséder ou chasser de leur possession; ce sens convient au contexte de jugement, tout en laissant l’autre lecture en note.
- source_word: ויהפך
  choice: et il changera
  rationale: Rend simplement la transformation annoncée dans la seconde proposition.
- source_word: למלח
  choice: en saumure
  rationale: Évoque un liquide devenu salé et impropre à la consommation, plutôt que le sel comme substance abstraite.
- source_word: משקה
  choice: leur boisson
  rationale: Suit le terme hébreu, plus large que « eaux »; le possessif est explicité d’après le contexte.
theological_decisions:
- issue: 'Sens de יוריש : déposséder ou hériter'
  choice: sa colère dépossédera des nations
  alternative: sa colère héritera des nations
  rationale: Le texte hébreu conservé est prioritaire et le sens causatif de dépossession forme un jugement cohérent; la lecture grecque notable est préservée en note.
- issue: Portée de משקה
  choice: leur boisson
  alternative: leurs eaux
  rationale: L’hébreu désigne plus généralement ce qui est bu, tandis que le grec précise « eaux »; le texte principal suit l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la densité poétique du verset ainsi que les divergences significatives entre l’hébreu et le grec.
