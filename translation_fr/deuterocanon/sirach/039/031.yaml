  text: At his command they rejoice[b][a], and in their appointed order they do not rebel against his word.
translation:
  language: fr
  text: À son commandement, ils se réjouissent[b] et, dans l’ordre qui leur est fixé, ils ne se rebellent pas contre sa parole.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sa bouche ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le parallèle grec développe ainsi la pensée : « ils seront préparés sur la terre pour répondre aux besoins et, en leur temps, ils ne transgresseront pas une parole ». Il souligne que les réalités créées remplissent leur fonction au moment fixé.'
    reason: alternative_reading
lexical_decisions:
- source_word: בצותו
  choice: À son commandement
  rationale: La préposition ב avec l’infinitif construit de צוה exprime ici la circonstance liée au commandement divin. « À son commandement » est naturel et concis, et concorde avec le grec ἐν τῇ ἐντολῇ αὐτοῦ.
- source_word: ישישו
  choice: ils se réjouissent
  rationale: Le verbe שוש/שיש exprime la joie ou l’allégresse. « Se réjouissent » restitue clairement la personnification des réalités créées.
- source_word: ובחקם
  choice: selon l’ordre qui leur est assigné
  rationale: חק peut désigner une prescription, une limite fixée ou un ordre établi. Dans ce contexte cosmique, la formulation retenue exprime leur fonction réglée sans réduire le terme à une loi juridique.
- source_word: לא ימרו פיו
  choice: ils ne se rebellent pas contre ce que dit sa bouche
  rationale: מרה signifie se rebeller ou désobéir. La formulation conserve la force du verbe et rend intelligible l’idiome hébreu פיו, littéralement « sa bouche », sans le remplacer silencieusement par « parole ».
theological_decisions:
- issue: Anthropomorphisme de la parole divine
  choice: ce que dit sa bouche
  alternative: sa parole
  rationale: L’hébreu porte littéralement « sa bouche ». La traduction conserve cette image anthropomorphique authentique tout en l’insérant dans une tournure française compréhensible.
- issue: Nature de חקם
  choice: l’ordre qui leur est assigné
  alternative: leur statut / leur cours fixé
  rationale: Le contexte évoque les réalités créées accomplissant la fonction prescrite par Dieu. Cette traduction garde la notion d’ordonnance fixée sans imposer une interprétation juridique étroite.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste accessible, tandis que « se rebeller » et l’image de la bouche préservent la vigueur et la particularité de l’hébreu.
