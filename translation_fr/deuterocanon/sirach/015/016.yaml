  text: Fire and water are set before you; whichever you choose[a], stretch out your hand to it.
translation:
  language: fr
  text: Le feu et l’eau sont placés devant toi ; étends la main vers ce que tu veux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La forme hébraïque traduite par « sont placés » est inhabituelle ; ce sens est confirmé par le grec parallèle : « il a placé devant toi ».'
    reason: textual_variant
lexical_decisions:
- source_word: מוּצָק
  choice: sont placés
  rationale: La forme hébraïque est inhabituelle et, prise isolément, pourrait évoquer ce qui est versé ou disposé. Avec לְפָנֶיךָ et le parallèle grec παρέθηκέν σοι, elle exprime ici la présentation de deux possibilités devant la personne.
- source_word: לְפָנֶיךָ
  choice: devant toi
  rationale: Rend directement l’expression spatiale hébraïque et convient naturellement à la scène d’un choix proposé.
- source_word: אֵשׁ וָמָיִם
  choice: Le feu et l’eau
  rationale: Conserve littéralement les deux réalités opposées du texte hébreu, également attestées par le grec.
- source_word: בַּאֲשֶׁר תַּחְפֹּץ
  choice: vers ce que tu veux
  rationale: חפץ exprime le vouloir ou le désir. Cette formulation française reste proche de l’hébreu et évite de préciser plus que le texte si l’objet visé est l’un ou l’autre des deux éléments.
- source_word: שְׁלַח יָדֶיךָ
  choice: étends la main
  rationale: Rend l’idiome qui décrit le geste de tendre la main vers l’option voulue. Le singulier français est naturel et concorde avec le parallèle grec.
theological_decisions:
- issue: L’action morale humaine mise en avant dans le verset
  choice: Présenter les deux possibilités comme réellement offertes et conserver l’impératif adressé à la personne.
  alternative: Atténuer la portée du choix par une formulation déterministe ou ajouter des réserves doctrinales.
  rationale: L’hébreu comme le grec placent des possibilités devant l’interlocuteur et l’invitent à tendre la main selon sa volonté. La traduction conserve cette affirmation sans résoudre par ajout les tensions théologiques qu’elle peut susciter.
translation_notes:
  register: Français moderne, international et digne. La syntaxe est simple et concrète. « Ce que tu veux » préserve le vocabulaire de la volonté, tandis que l’image du feu, de l’eau et de la main tendue reste intacte.
