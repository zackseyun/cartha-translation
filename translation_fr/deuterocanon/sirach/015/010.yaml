translation:
  language: fr
  text: La louange se dit par la bouche du sage[a], et celui qui la maîtrise l’enseignera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle porte dans le second membre : « et le Seigneur le fera réussir » (ou « la fera réussir »), leçon sensiblement différente de l’hébreu conservé.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּפֶה חָכָם
  choice: par la bouche du sage
  rationale: La préposition ב peut marquer le moyen ou la sphère. « Par la bouche » conserve l’image hébraïque, tandis que le singulier « du sage » garde la valeur générique de חָכָם sans ajouter de précision absente du texte.
- source_word: תֵּאָמֵר
  choice: se dit
  rationale: Le niphal à l’inaccompli exprime ici naturellement une vérité générale de style proverbial. « Se dit » est actuel et fluide, tout en conservant la valeur passive ou moyenne.
- source_word: תְּהִלָּה
  choice: la louange
  rationale: Le sens ordinaire est « louange », confirmé par le grec αἶνος. Le texte hébreu n’en précise pas l’objet.
- source_word: וּמשֵׁל בָּהּ
  choice: et celui qui la maîtrise
  rationale: משל exprime l’exercice d’une domination ou d’une maîtrise. Avec le pronom féminin בָּהּ, « la maîtrise » renvoie grammaticalement à « la louange », sans expliciter davantage la relation comprimée de l’hébreu.
- source_word: יִלַמְּדֶנָּה
  choice: l’enseignera
  rationale: Le verbe למד signifie « enseigner » et son suffixe féminin reprend vraisemblablement תְּהִלָּה. Le futur français reflète l’inaccompli hébreu et la structure de la maxime.
theological_decisions:
- issue: Rapport entre le deuxième membre hébreu et le texte grec parallèle
  choice: 'Suivre l’hébreu conservé : « et celui qui la maîtrise l’enseignera »'
  alternative: 'Le grec porte : « et le Seigneur le fera réussir », le pronom pouvant aussi être compris comme « la fera réussir » selon son référent.'
  rationale: Le témoin hébreu, ici conservé avec un degré élevé de confiance, constitue la source principale. Le grec atteste une leçon substantiellement différente, qui doit être signalée sans remplacer ni harmoniser l’hébreu.
translation_notes:
  register: Français international moderne, sobre et proverbial. La formulation conserve l’image de la bouche, le singulier générique « le sage » et la concision quelque peu énigmatique du second membre hébreu.
