  text: He who fears Yahweh will do this[b][a], and he who grasps the law will attain her.
translation:
  language: fr
  text: Celui qui craint le SEIGNEUR agira ainsi, et celui qui s’attache fermement à la Loi[a] atteindra la Sagesse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi être rendu par « Torah » ou, dans un sens plus large, par « instruction ».
    reason: lexical_alternative
  - marker: b
    text: La forme du dernier verbe est difficile dans le texte hébreu conservé. Le texte grec lit « l’atteindra » ; il soutient ainsi la lecture selon laquelle celui qui s’attache à la Loi parvient à la Sagesse.
    reason: textual_variant
lexical_decisions:
- source_word: יְרֵא יְהֹוָה
  choice: celui qui craint le Seigneur
  rationale: Le participe substantivé désigne « celui qui craint ». « Le Seigneur » rend le nom divin selon l’usage français biblique courant.
- source_word: יַעֲשֶׂה זֹאת
  choice: agira ainsi
  rationale: Le démonstratif féminin singulier signifie littéralement « fera cela ». « Agira ainsi » est naturel en français et conserve le renvoi contextuel sans l’expliciter.
- source_word: וְתוֹפֵשׂ תּוֹרָה
  choice: et celui qui s’attache fermement à la Loi
  rationale: תפש évoque le fait de saisir et de tenir. Cette formulation conserve l’idée de ferme adhésion sans suggérer une compréhension purement intellectuelle. « Loi » correspond au grec νόμος, tandis qu’une note signale la portée possible de « Torah » ou « instruction ».
- source_word: יַדְרִיכֶנָּה
  choice: atteindra la Sagesse
  rationale: La forme hébraïque transmise est difficile. Le parallèle grec καταλήμψεται αὐτήν soutient le sens « l’atteindra / la saisira », avec la Sagesse personnifiée comme référent féminin dans le contexte.
theological_decisions:
- issue: Référent féminin de la dernière proposition
  choice: la Sagesse, nommée explicitement
  alternative: Employer le pronom « elle », ou comprendre le verbe hébreu dans le sens d’« être guidé par elle »
  rationale: Le contexte de Siracide 14.20–15.10 personnifie la Sagesse, et le grec porte un objet féminin explicite. Nommer « la Sagesse » évite en français l’ambiguïté involontaire avec « la Loi », tout en préservant la personnification. La difficulté textuelle est signalée en note.
translation_notes:
  register: Français international moderne, digne et proverbial. « S’attache fermement » restitue la métaphore de la prise durable dans une tournure idiomatique. Les majuscules à « Loi » et « Sagesse » marquent ici la Torah et la Sagesse personnifiée.
