base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/015.yaml
  text: If you desire[a], you will keep the commandment, and to act faithfully is a matter of your good pleasure. If you trust in him[c][b], you too will live.
translation:
  language: fr
  text: Si tu le veux, tu garderas le commandement[a] ; l’intelligence consiste à faire sa volonté[b]. Si tu crois en lui[c], toi aussi, tu vivras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie le singulier « commandement » ; le parallèle grec a le pluriel « commandements ».
    reason: textual_variant
  - marker: b
    text: 'La proposition hébraïque est difficile. Littéralement : « et l’intelligence [est] de faire sa volonté ». Le parallèle grec se lit approximativement : « et accomplir la fidélité [est affaire de] bon plaisir » ; il peut refléter un texte hébreu différent ou une interprétation.'
    reason: alternative_reading
  - marker: c
    text: 'Ou : « Si tu mets ta confiance en lui ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם תַּחְפֹּץ
  choice: Si tu le veux
  rationale: חפץ exprime ici le désir ou la volonté. « Si tu le veux » rend naturellement en français la force volontaire de la condition, sans transformer le propos en affirmation abstraite sur la liberté humaine.
- source_word: תִּשְׁמֹר מִצְוָה
  choice: tu garderas le commandement
  rationale: Le texte hébreu porte le singulier מִצְוָה. « Garder le commandement » reste proche de cette forme tout en permettant un sens collectif.
- source_word: וְתָבִינָה לַעֲשׂוֹת רְצוֹנוֹ
  choice: agir avec fidélité dépend de ton bon vouloir
  rationale: La proposition hébraïque transmise est difficile. La formulation française s'appuie prudemment sur le parallèle grec, qui associe l'accomplissement de la fidélité au bon plaisir, tout en signalant l'incertitude dans une note.
- source_word: אִם תַּאֲמִין בּוֹ
  choice: Si tu mets ta confiance en lui
  rationale: אמן avec ב peut exprimer le fait de croire en quelqu'un ou de se fier à lui. « Mettre sa confiance en lui » restitue clairement cette dimension relationnelle.
- source_word: גַּם אַתָּה תִּחְיֶה
  choice: toi aussi, tu vivras
  rationale: « Toi aussi » conserve l'insistance inclusive de גַּם אַתָּה, tandis que « tu vivras » rend directement תִּחְיֶה.
theological_decisions:
- issue: Tension textuelle entre la proposition hébraïque difficile et le parallèle grec
  choice: agir avec fidélité dépend de ton bon vouloir
  alternative: et [l'intelligence] pour faire sa volonté
  rationale: L'hébreu demeure le témoin principal, mais sa formulation est ici obscure. Le grec fournit un sens cohérent centré sur la fidélité et le bon vouloir. La traduction adopte ce sens sans masquer l'existence d'une autre compréhension possible de l'hébreu.
- issue: Volonté humaine et obéissance
  choice: Si tu le veux, tu garderas
  alternative: Si tu choisis, tu peux garder
  rationale: La formulation conditionnelle conserve l'accent de Ben Sira sur la responsabilité humaine, sans renforcer le texte en une thèse philosophique ou doctrinale sur l'autonomie de la volonté.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reproduit l'adresse individuelle de l'hébreu. Le point-virgule distingue les deux membres de la première affirmation sans rompre leur étroite relation.
