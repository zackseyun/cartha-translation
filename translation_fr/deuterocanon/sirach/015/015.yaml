  to: Si tu le veux, tu garderas le commandement[a] ; l’intelligence consiste à faire sa volonté[b]. Si tu crois en lui[c], toi aussi, tu vivras.
  rationale: La révision rétablit dans le texte principal les éléments explicites de l’hébreu — « intelligence » et « sa volonté » — tout en conservant dans une note la divergence importante du grec. Elle ne tranche pas l’identité du référent de « sa volonté » ni la relation exacte entre les mots de la proposition difficile. Le conditionnel volitif, le singulier de « commandement » et l’insistance « toi aussi » sont préservés.
