base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/014.yaml
  text: God[a], from the beginning, created man, and placed him in the hand of his own violence[b]; he gave him over to the hand of his own inclination.
translation:
  language: fr
  text: Dieu, dès le commencement, créa l’être humain et le plaça au pouvoir de sa propre violence[a] ; il le livra au pouvoir de sa propre inclination.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est difficile. Le grec porte : « et il le laissa au pouvoir de son propre conseil ».'
    reason: alternative_reading
  - marker: b
    text: Ou « de sa propre disposition ». Le mot hébreu peut désigner la disposition intérieure ou l’inclination d’une personne, sans préciser ici si elle est bonne ou mauvaise.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le sujet est explicite en hébreu ; « Dieu » le rend directement.
- source_word: מִבְּרֵאשִׁית
  choice: dès le commencement
  rationale: Cette expression rend la valeur temporelle de מִן avec רֵאשִׁית, confirmée par le grec ἐξ ἀρχῆς, sans reproduire automatiquement la formule de Genèse 1.1.
- source_word: בָּרָא
  choice: créa
  rationale: Le verbe ברא signifie normalement « créer », particulièrement lorsque Dieu en est le sujet.
- source_word: אָדָם
  choice: l’être humain
  rationale: Le singulier hébreu désigne ici l’humain de manière représentative. Cette formulation conserve le singulier grammatical tout en exprimant la portée collective possible.
- source_word: וַיְשִׁיתֵהוּ
  choice: le plaça
  rationale: שית signifie couramment « placer » ou « mettre ». Le grec ἀφῆκεν suggère plutôt « laisser », différence signalée en note.
- source_word: בְּיַד
  choice: au pouvoir de
  rationale: L’expression signifie littéralement « dans la main de », mais désigne idiomatiquement le pouvoir ou la maîtrise de quelqu’un ou de quelque chose.
- source_word: חוֹתְפוֹ
  choice: sa propre violence
  rationale: Le terme hébreu est difficile et évoque une force qui saisit ou emporte. « Sa propre violence » préserve cette rudesse sans l’assimiler silencieusement au « conseil » de la version grecque.
- source_word: וַיִּתְּנֵהוּ
  choice: il le livra
  rationale: נתן construit avec ביד peut exprimer le fait de remettre ou de livrer quelqu’un au pouvoir de quelque chose.
- source_word: יִצְרוֹ
  choice: son propre penchant
  rationale: יצר peut désigner la disposition ou le penchant intérieur. « Penchant » est naturel en français et ne précise pas arbitrairement si cette disposition est bonne ou mauvaise.
theological_decisions:
- issue: L’action de Dieu et la direction morale propre de l’être humain
  choice: Le verset présente Dieu comme créateur, puis l’être humain comme livré au pouvoir de forces ou dispositions qui lui sont propres.
  alternative: Dieu laissa l’être humain à son propre conseil.
  rationale: L’hébreu et le grec convergent vers l’idée d’une direction humaine après la création, mais divergent dans leur formulation. La traduction suit l’hébreu sans transformer le passage en affirmation systématique d’une autonomie absolue ni qualifier le penchant de nécessairement mauvais.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif sapientiel. « Au pouvoir de » transmet naturellement l’image hébraïque de la main comme sphère de maîtrise, tandis que les notes conservent l’incertitude textuelle et lexicale.
