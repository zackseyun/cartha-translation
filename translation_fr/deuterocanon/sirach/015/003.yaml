  text: He will feed him with the bread of understanding[b][a], and give him the water of insight to drink.
translation:
  language: fr
  text: Elle le nourrira du pain de l’intelligence et lui donnera à boire l’eau du discernement.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec porte « l’eau de la sagesse » là où l’hébreu a « l’eau du discernement ».
    reason: textual_variant
lexical_decisions:
- source_word: וְהֶאֱכִילַתְהוּ
  choice: Elle le nourrira
  rationale: Le hifil de אכל signifie « faire manger, nourrir ». La forme verbale porte ici un sujet féminin singulier, qui renvoie dans le contexte à la Sagesse personnifiée. « Nourrir » restitue naturellement en français l’action causative sans effacer l’image du pain qui suit.
- source_word: לֶחֶם
  choice: pain
  rationale: Le terme concret « pain » est conservé, car il forme avec l’eau une paire métaphorique structurante.
- source_word: שָׂכֶל
  choice: intelligence
  rationale: שכל désigne la faculté de comprendre ou le bon sens. « Intelligence » convient à la métaphore du pain et permet de le distinguer de תבונה.
- source_word: וּמֵי
  choice: l’eau de
  rationale: Même si l’hébreu emploie formellement le pluriel « eaux », le singulier collectif « eau » est idiomatique en français dans cette image.
- source_word: תְבוּנָה
  choice: discernement
  rationale: Le mot évoque la compréhension pénétrante et la faculté de distinguer. « Discernement » préserve une nuance distincte de שכל, rendu par « intelligence ».
- source_word: תַּשְׁקֶנּוּ
  choice: lui donnera à boire
  rationale: Le verbe שקה signifie « faire boire, donner à boire ». Cette tournure est naturelle en français et maintient le sujet féminin singulier ainsi que l’objet masculin singulier.
theological_decisions:
- issue: Sujet féminin implicite et Sagesse personnifiée
  choice: Elle
  alternative: Il
  rationale: Les formes verbales hébraïques indiquent un sujet féminin singulier, et le contexte identifie celui-ci à la Sagesse personnifiée. Le pronom « elle » traduit donc les données grammaticales et contextuelles sans ajouter un nom absent du verset.
- issue: Variation entre les termes sapientiels du texte hébreu et du parallèle grec
  choice: l’eau du discernement
  alternative: l’eau de la sagesse
  rationale: Le texte hébreu, témoin principal, porte תבונה, « discernement, intelligence ». Le grec lit σοφίας, « sagesse » ; cette variante est signalée sans remplacer la lecture hébraïque.
translation_notes:
  register: Français moderne, international et digne. La formulation conserve les images parallèles du pain et de l’eau, tout en distinguant les deux termes hébreux du champ de la compréhension.
