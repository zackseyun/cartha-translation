  text: Before human beings are life and death[b][a], and whichever he chooses will be given to him.
translation:
  language: fr
  text: Devant les êtres humains[a] se trouvent la vie et la mort ; ce que chacun désire[b] lui sera donné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Pour les êtres humains » ; la préposition hébraïque permet cette lecture, mais le parallèle grec appuie le sens « devant les êtres humains ».
    reason: alternative_reading
  - marker: b
    text: Ou « choisit ». Le verbe hébreu peut exprimer le désir, la volonté ou le choix.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי אָדָם
  choice: Devant les êtres humains
  rationale: L’hébreu signifie littéralement « aux/pour les fils de l’homme », mais le parallèle grec ἔναντι ἀνθρώπων appuie l’idée d’options placées devant l’humanité. Cette formulation est naturelle en français et évite le calque « fils de l’homme ».
- source_word: חַיִּים וָמָוֶת
  choice: la vie et la mort
  rationale: Rendu direct des deux possibilités opposées ; le pluriel hébreu חַיִּים se traduit idiomatiquement par le singulier « la vie ».
- source_word: אֲשֶׁר יַחְפֹּץ
  choice: celle que chacun désire
  rationale: חפץ exprime le désir, la volonté ou le plaisir pris à quelque chose. « Celle » renvoie naturellement aux deux possibilités, tandis que « chacun » conserve la portée distributive du singulier hébreu sans rendre la phrase pesante.
- source_word: יִנָּתֵן לוֹ
  choice: lui sera donnée
  rationale: Le passif de נתן est conservé sans préciser l’agent, que le texte ne nomme pas. L’accord féminin renvoie en français à la possibilité désirée, la vie ou la mort.
theological_decisions:
- issue: Action morale humaine et passif divin implicite
  choice: Présenter la vie et la mort comme placées devant les humains, puis dire que la possibilité désirée sera donnée à chacun.
  alternative: Renforcer soit l’autonomie absolue du choix humain, soit la causalité divine en nommant Dieu comme agent.
  rationale: Le texte affirme une responsabilité humaine tout en employant un passif dont l’agent reste inexprimé. La traduction préserve cette tension sans trancher un débat doctrinal plus large.
- issue: Expression collective et reprise au singulier
  choice: Employer « les êtres humains », puis le distributif singulier « chacun » et « lui ».
  alternative: Employer « l’homme… il… lui » ou tout pluraliser en « ils… leur ».
  rationale: Ce choix rend la valeur collective de בְּנֵי אָדָם et maintient la perspective individuelle des formes singulières qui suivent.
translation_notes:
  register: Français international moderne, sobre et digne. La construction « se trouvent » explicite seulement la relation nominale sous-entendue en hébreu. Le point-virgule met en relief le lien entre les deux possibilités et leur conséquence.
