  text: The eyes of God see his works[b][a], and he knows every deed of a man.
translation:
  language: fr
  text: Les yeux de Dieu voient ses œuvres[a], et il connaît chacun des actes d’un homme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec diffère dans le premier membre : « Ses yeux sont sur ceux qui le craignent. »'
    reason: alternative_reading
  - marker: b
    text: Ou « d’une personne ». L’hébreu emploie le masculin singulier אִישׁ (« homme »), souvent utilisé dans les écrits de sagesse avec une portée générique.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי אֵל
  choice: Les yeux de Dieu
  rationale: Cette formulation conserve l’image anthropomorphique concrète de l’hébreu et rend אֵל simplement par « Dieu », sans introduire de nom divin absent du texte.
- source_word: יִרְאוּ
  choice: voient
  rationale: Le présent français exprime naturellement ici une vérité générale, là où l’imparfait hébreu a une valeur habituelle ou gnomique.
- source_word: מַעֲשָׂיו
  choice: ses œuvres
  rationale: Le suffixe masculin singulier est conservé sans en expliciter abusivement le référent. « Œuvres » maintient le caractère concret et moral de מַעֲשֶׂה.
- source_word: יַכִּיר
  choice: connaît
  rationale: Dans ce contexte de connaissance divine des actions humaines, « connaît » est plus naturel en français que « reconnaît », tout en couvrant l’idée de perception et de discernement portée par le verbe.
- source_word: כָּל מִפְעַל
  choice: chacun des actes
  rationale: Cette expression rend la distributivité de כָּל devant un nom singulier et traduit מִפְעָל par un terme courant désignant ce qui est accompli.
- source_word: אִישׁ
  choice: un homme
  rationale: Le masculin singulier de l’hébreu est maintenu dans le texte principal; dans ce contexte sapiential, il peut avoir une portée représentative ou générique.
theological_decisions:
- issue: Langage anthropomorphique décrivant la perception divine
  choice: Conserver « Les yeux de Dieu »
  alternative: « Dieu voit »
  rationale: L’image appartient au texte hébreu et exprime avec force la connaissance que Dieu a des actions humaines; il n’est pas nécessaire de l’aplanir.
- issue: Valeur de יַכִּיר appliqué à Dieu
  choice: « connaît »
  alternative: « reconnaît » ou « discerne »
  rationale: « Connaît » exprime naturellement la pleine connaissance divine sans imposer une nuance technique que le contexte ne requiert pas.
- issue: Masculin générique de אִישׁ
  choice: « un homme » dans le texte, avec explication en note
  alternative: « une personne » ou « un être humain »
  rationale: Le choix préserve la forme masculine singulière de la source tout en signalant honnêtement sa possible portée générique.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme est préservé, avec un présent gnomique naturel. Le texte conserve l’image hébraïque et évite de résoudre explicitement le référent potentiellement ambigu de « ses œuvres ».
