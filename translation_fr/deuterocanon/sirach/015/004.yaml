base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/004.yaml
  text: He will lean on her and not be shaken[c][b][a]; he will trust in her and not be put to shame.
translation:
  language: fr
  text: Il s’appuiera sur elle[a] et ne chancellera pas[b] ; il mettra sa confiance en elle et ne sera pas couvert de honte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom « elle » désigne la Sagesse, personnifiée comme une femme dans le contexte.
    reason: cross_reference
  - marker: b
    text: Ou « ne vacillera pas » ou « ne sera pas ébranlé ».
    reason: lexical_alternative
  - marker: c
    text: Ou « n’aura pas honte » ; l’expression peut aussi signifier « ne sera pas déçu », puisque sa confiance ne sera pas trompée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁעַן
  choice: Il s’appuiera
  rationale: Le verbe שׁען exprime l’action de s’appuyer sur quelqu’un ou de compter sur lui. « S’appuiera » conserve l’image concrète tout en communiquant naturellement l’idée de dépendance confiante.
- source_word: עָלֶיהָ
  choice: sur elle
  rationale: Le suffixe féminin renvoie à la Sagesse personnifiée dans le contexte. « Sur elle » respecte à la fois la construction hébraïque et cette personnification.
- source_word: וְלֹא יִמּוֹט
  choice: et ne chancellera pas
  rationale: Le verbe מוט évoque le fait de vaciller, chanceler ou perdre sa stabilité. « Ne chancellera pas » prolonge naturellement l’image de celui qui s’appuie sur un soutien ferme, sans en réduire le sens à une agitation intérieure.
- source_word: וּבָהּ יִבְטַח
  choice: il mettra sa confiance en elle
  rationale: בטח signifie se fier à quelqu’un, avoir confiance ou se sentir en sécurité. Cette formulation française exprime clairement la confiance placée dans la Sagesse et maintient le complément féminin explicite.
- source_word: וְלֹא יֵבוֹשׁ
  choice: et ne sera pas couvert de honte
  rationale: בוש peut désigner la honte publique aussi bien que la déception éprouvée lorsque la confiance placée en quelqu’un échoue. « Ne sera pas couvert de honte » préserve fortement la dimension objective et publique, en accord avec le grec καταισχυνθῇ.
theological_decisions:
- issue: Référent et genre des suffixes féminins
  choice: Employer « elle » en référence à la Sagesse personnifiée.
  alternative: Employer un pronom neutre ou reformuler sans personnification.
  rationale: L’hébreu emploie deux suffixes féminins, et le contexte immédiat présente la Sagesse comme une femme. Garder « elle » préserve cette image littéraire et théologique sans ajouter d’interprétation confessionnelle.
- issue: Portée de la honte finale
  choice: 'Conserver l’idée d’une honte subie : « ne sera pas couvert de honte ».'
  alternative: Traduire par « ne sera pas déçu » ou « n’aura pas honte ».
  rationale: Le verbe hébreu permet à la fois les nuances de honte et de déception liée à une confiance mal placée. Le texte principal retient la honte publique, soutenue par le grec, tandis que la note maintient les autres nuances possibles.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme hébraïque est conservé, ainsi que les deux images complémentaires de l’appui stable et de la confiance qui ne mène pas à la honte.
