  text: He will find gladness and joy[a], and an everlasting name will be his inheritance.
translation:
  language: fr
  text: Il trouvera l’allégresse et la joie, et un nom éternel lui sera donné en héritage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « il héritera d’un nom éternel ». La formulation hébraïque est concise et peut s’analyser de plusieurs manières; le texte grec emploie explicitement le langage de l’héritage.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂשׂוֹן
  choice: allégresse
  rationale: Le terme exprime une joie vive. « Allégresse » convient au registre poétique et permet de le distinguer du quasi-synonyme שִׂמְחָה.
- source_word: שִׂמְחָה
  choice: joie
  rationale: « Joie » est l’équivalent français courant et naturel; associé à « allégresse », il conserve le parallélisme de deux termes proches.
- source_word: יִמְצָא
  choice: trouvera
  rationale: Ce choix rend directement le sens fondamental de מצא tout en restant idiomatique en français.
- source_word: שֵׂם עוֹלָם
  choice: un nom éternel
  rationale: L’expression signifie littéralement « un nom d’éternité ». Cette traduction préserve l’image biblique du nom durable sans la réduire à la seule notion de réputation; le grec ὄνομα αἰώνιον la confirme.
- source_word: תּוֹרִישֶׁנּוּ
  choice: lui sera donné en héritage
  rationale: La forme hébraïque, compacte et susceptible de plusieurs analyses syntaxiques, appartient au champ de l’héritage. La tournure passive exprime clairement le résultat sans imposer un sujet implicite, tandis que le grec κατακληρονομήσει confirme le motif de l’héritage.
theological_decisions:
- issue: Interprétation de la proposition finale avec תּוֹרִישֶׁנּוּ et son rapport au parallèle grec
  choice: Un nom éternel sera donné à la personne en héritage.
  alternative: 'Il héritera d’un nom éternel; ou: elle lui transmettra un nom éternel.'
  rationale: La syntaxe du texte hébreu conservé est comprimée et peut se construire de plusieurs façons. Les lectures possibles convergent vers la réception d’un nom durable comme héritage; la traduction principale garde cette image sans identifier arbitrairement le sujet du verbe.
translation_notes:
  register: Français international moderne, naturel et digne. Le couple « allégresse et joie » conserve la poésie des deux quasi-synonymes hébreux. La proposition finale maintient l’ambiguïté syntaxique du témoin hébreu tout en donnant une phrase française claire.
