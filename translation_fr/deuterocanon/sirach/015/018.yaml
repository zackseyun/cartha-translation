  text: For the wisdom of Yahweh is abundant[a]; he is mighty in power and sees all things.
translation:
  language: fr
  text: Car la sagesse de Yahweh est abondante[a] ; il est puissant, plein de force, et voit tout.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu סָפְקָה peut aussi évoquer ce qui « suffit » ou « fournit » ; le grec parallèle porte « grande, abondante », ce qui appuie le sens retenu.
    reason: alternative lexicale
lexical_decisions:
- source_word: סָפְקָה
  choice: est abondante
  rationale: Le verbe hébreu peut évoquer ce qui suffit, abonde ou fournit. Avec « la sagesse de Yahweh » comme sujet et le parallèle grec πολλὴ (« grande, abondante »), « est abondante » exprime naturellement ici la profusion.
- source_word: חָכְמַת
  choice: la sagesse
  rationale: Équivalent français courant et direct de חָכְמָה dans ce contexte sapientiel.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: La translittération rend explicitement le nom divin présent dans le texte hébreu.
- source_word: אַמִּיץ גְּבוּרוֹת
  choice: puissant en force
  rationale: אַמִּיץ exprime la puissance, tandis que le pluriel גְּבוּרוֹת peut désigner la force, la puissance ou des actes puissants. Cette formulation conserve la construction resserrée de l’hébreu et s’accorde avec le parallèle grec.
- source_word: וְחוֹזֶה כֹל
  choice: et voit tout
  rationale: חוֹזֶה signifie « voit, contemple » et כֹל donne à cette perception une portée universelle. « Voit tout » est idiomatique et concis en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu porte directement le tétragramme. « Yahweh » préserve ici le nom propre sans substituer un titre.
- issue: Sens de גְּבוּרוֹת
  choice: force
  alternative: actes puissants
  rationale: Le pluriel hébreu permet un sens abstrait ou concret. Le parallèle grec ἐν δυναστείᾳ favorise ici l’idée abstraite de force ou de puissance, sans exclure entièrement l’arrière-plan des manifestations de puissance.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le parallélisme bref de l’hébreu. « Puissant en force » garde une légère solennité biblique sans employer un vocabulaire archaïque.
