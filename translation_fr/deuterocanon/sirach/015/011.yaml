  text: Do not say[a], “My transgression is from God,” for he has not done what he hates.
translation:
  language: fr
  text: 'Ne dis pas[a] : « Ma transgression vient de Dieu », car il n’a pas fait ce qu’il déteste.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente une formulation apparentée mais différente : « Ne dis pas : “C’est à cause du Seigneur que je me suis détourné”, car tu ne feras pas ce qu’il a détesté. »'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Ne dis pas
  rationale: L’impératif négatif hébreu est direct et concis ; cette formulation naturelle en français en conserve la force.
- source_word: מֵאֵל
  choice: vient de Dieu
  rationale: 'La préposition מִן indique ici le plus naturellement la source ou l’origine : il ne faut pas attribuer sa faute à Dieu. « Vient de » exprime clairement cette relation en français courant.'
- source_word: פִּשְׁעִי
  choice: ma transgression
  rationale: פשע désigne une faute grave, souvent avec une nuance de révolte volontaire. « Transgression » en préserve la gravité sans réduire le terme au simple mot général « péché ».
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’interdiction et « car » maintient la cadence sentencieuse du texte de sagesse.
- source_word: אֶת אֲשֶׁר שָׂנֵא
  choice: ce qu’il déteste
  rationale: Cette tournure rend naturellement la proposition relative hébraïque ; le sujet implicite est Dieu, mentionné dans la proposition précédente.
- source_word: לֹא עָשָה
  choice: il n’a pas fait
  rationale: Le parfait hébreu est conservé par un passé composé naturel en français. La formulation maintient l’affirmation du témoin hébreu sans l’aligner sur le futur du parallèle grec.
theological_decisions:
- issue: Le verset nie-t-il que Dieu soit la source du péché ou seulement son occasion ?
  choice: '« Ma transgression vient de Dieu » : le texte principal nie que la transgression ait son origine en Dieu.'
  alternative: « C’est à cause du Seigneur que je me suis détourné » / « Par le Seigneur, je me suis écarté »
  rationale: Le témoin hébreu principal porte מֵאֵל פִּשְׁעִי, qui indique le plus naturellement la provenance. Le grec présente une formulation apparentée mais non identique ; elle est signalée en note plutôt que fusionnée avec l’hébreu.
- issue: Force morale de פשע
  choice: transgression
  alternative: révolte ; péché ; faute
  rationale: « Transgression » conserve la gravité et la nuance possible de volonté délibérée, sans imposer une lecture politique de « révolte » ni généraliser en « péché ».
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste concise pour préserver le caractère proverbial. « Transgression » relève d’un registre biblique courant mais demeure intelligible ; « déteste » rend la vigueur de שָׂנֵא plus directement que « n’aime pas ».
