translation:
  language: fr
  text: Il n’a ordonné à personne de pécher, et il n’a pas soutenu les gens trompeurs. Il n’a pas compassion de celui qui agit avec fausseté, ni de celui qui révèle un secret.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Il n’a commandé à personne d’agir avec impiété et il n’a permis à personne de pécher. » Il ne contient pas les deux propositions finales du texte hébreu ici traduit.'
    reason: Le parallèle grec présente une forme textuelle plus brève et des formulations différentes. La note informe le lecteur de cette divergence sans remplacer le texte hébreu retenu.
lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: personne
  rationale: Le nom collectif désigne ici l’être humain en général ; dans cette proposition négative, « personne » rend naturellement sa portée universelle.
- source_word: לַחֲטֹא
  choice: de pécher
  rationale: L’infinitif hébreu exprime directement l’action de commettre le péché, sans imposer la nuance plus large « vivre dans l’impiété » du parallèle grec.
- source_word: הֶחֱלִים
  choice: a accordé aucune indulgence
  rationale: Dans ce contexte, le verbe indique que Dieu ne favorise ni ne laisse complaisamment agir les coupables. « Accorder de l’indulgence » conserve cette idée sans suggérer qu’il manquerait de compassion envers le pécheur repentant.
- source_word: אַנְשֵׁי כָזָב
  choice: aux hommes de mensonge
  rationale: 'Cette formulation garde l’image et la portée morale de l’hébreu : des personnes caractérisées par la fausseté.'
theological_decisions:
- issue: Responsabilité divine à l’égard du péché
  choice: Dieu ne commande pas de pécher et n’accorde pas son indulgence aux hommes de mensonge.
  alternative: « Il n’a commandé à personne de vivre dans l’impiété et n’a permis à personne de pécher », d’après le grec.
  rationale: Le texte principal suit prioritairement l’hébreu fourni, tout en signalant le parallèle grec. Il maintient l’affirmation que Dieu n’est ni l’auteur ni l’approbateur du péché, sans développer un système doctrinal.
translation_notes:
  register: Français moderne, digne et direct. « Hommes de mensonge » conserve l’expression imagée de l’hébreu ; « indulgence » est employé au sens de complaisance ou de tolérance accordée au mal.
