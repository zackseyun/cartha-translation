translation:
  language: fr
  text: Elle viendra à sa rencontre comme une mère et l’accueillera comme l’épouse de sa jeunesse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « comme une femme dans sa virginité », c’est-à-dire comme une jeune épouse ou une épouse vierge.'
    reason: Lecture parallèle grecque présentant une nuance différente de l’expression hébraïque.
lexical_decisions:
- source_word: וְקִדְּמַתְהוּ
  choice: Elle viendra à sa rencontre
  rationale: Le verbe קדם exprime ici le fait de se porter au-devant de quelqu’un; le grec ὑπαντήσεται confirme cette initiative. Cette tournure est naturelle en français et conserve le mouvement vers la personne.
- source_word: כָאֵם
  choice: comme une mère
  rationale: Rend directement la comparaison introduite par כ et conserve l’image maternelle.
- source_word: וּכְאֵשֶׁת נְעוּרִים
  choice: comme l’épouse de sa jeunesse
  rationale: L’expression hébraïque désigne naturellement l’épouse liée à la jeunesse d’un homme, avec les connotations d’union ancienne et d’affection conjugale. L’article défini est idiomatique en français dans l’expression « l’épouse de sa jeunesse ».
- source_word: תְּקַבְּלֶנּוּ
  choice: l’accueillera
  rationale: קבל signifie recevoir ou accepter. « Accueillera » exprime clairement ici une réception personnelle et chaleureuse, en accord avec le grec προσδέξεται.
theological_decisions:
- issue: Personnification féminine de la Sagesse au moyen d’images maternelle et conjugale
  choice: 'Conserver les pronoms et accords féminins : « Elle… l’accueillera »'
  alternative: Employer une formulation impersonnelle ou abstraire les images
  rationale: Les formes verbales hébraïques sont féminines et le verset compare explicitement la Sagesse à une mère et à une épouse. La personnification poétique doit donc rester visible.
- issue: Sens de אֵשֶׁת נְעוּרִים face au grec γυνὴ παρθενείας
  choice: 'Suivre l’hébreu dans le texte principal : « l’épouse de sa jeunesse »'
  alternative: « une jeune épouse » ou « une épouse vierge »
  rationale: Puisque l’hébreu est conservé et jugé fiable, il demeure prioritaire. Le grec témoigne néanmoins d’une nuance de jeunesse nuptiale ou de virginité, signalée en note sans harmoniser le texte principal.
translation_notes:
  register: Français moderne international, naturel et digne. « Viendra à sa rencontre » préserve l’initiative de la Sagesse; « accueillera » évite la raideur possible de « recevra » dans ce contexte affectif. Le parallélisme des deux comparaisons est maintenu.
