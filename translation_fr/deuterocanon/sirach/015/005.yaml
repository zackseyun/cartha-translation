  source_fidelity: 'Le texte rend fidèlement l’hébreu : « elle l’élèvera » correspond à וְרוֹמְמַתְהוּ, « au-dessus de ses compagnons » préserve le sens comparatif/social de מֵרֵעֵהוּ, et « au milieu de l’assemblée » rend précisément וּבְתוֹךְ קָהָל. « Elle lui ouvrira la bouche » restitue naturellement en français l’expression concrète תִּפְתַּח פִּיו, sans la réduire à une simple paraphrase (« le fera parler »). Le sujet féminin est cohérent avec la Sagesse personnifiée du contexte et avec la forme verbale féminine de תִּפְתַּח; il ne constitue pas une surinterprétation doctrinale.'
