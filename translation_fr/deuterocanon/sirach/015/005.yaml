  text: And he will exalt him above his companions[a], and in the midst of the assembly he will open his mouth.
translation:
  language: fr
  text: Elle l’élèvera au-dessus de ses compagnons[a] et, au milieu de l’assemblée, elle lui ouvrira la bouche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « au-dessus de son compagnon ». L’hébreu présente une forme au singulier, tandis que le grec parallèle exprime un sens pluriel : « ses proches » ou « ses compagnons ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוֹמְמַתְהוּ
  choice: Elle l’élèvera
  rationale: Le verbe רומם exprime l’idée d’élever ou d’exalter. « Élèvera » rend naturellement en français l’élévation de rang et l’honneur accordé. La forme verbale féminine renvoie vraisemblablement à la sagesse personnifiée dans le contexte.
- source_word: מֵרֵעֵהוּ
  choice: au-dessus de ses compagnons
  rationale: Le nom hébreu est morphologiquement au singulier, mais peut avoir ici une portée collective; le grec parallèle emploie explicitement le pluriel et confirme le sens social de pairs ou de proches.
- source_word: וּבְתוֹךְ קָהָל
  choice: au milieu de l’assemblée
  rationale: Cette formulation conserve le cadre public marqué par בְּתוֹךְ et rend קָהָל par le terme neutre « assemblée », sans lui imposer une nuance ecclésiale plus étroite.
- source_word: תִּפְתַּח פִּיו
  choice: elle lui ouvrira la bouche
  rationale: La traduction garde l’image concrète commune à l’hébreu et au grec. En français, « lui ouvrira la bouche » indique plus clairement que la sagesse rend le disciple capable de prendre publiquement la parole.
theological_decisions:
- issue: Identité du sujet des verbes
  choice: Le sujet féminin est rendu par « elle », avec pour référent contextuel la sagesse personnifiée.
  alternative: Employer un sujet masculin ou reformuler de manière impersonnelle.
  rationale: Les formes hébraïques תִּפְתַּח et, selon la lecture contextuelle, וְרוֹמְמַתְהוּ s’accordent naturellement avec la sagesse, sujet féminin du passage. La traduction n’ajoute toutefois pas le nom « sagesse » dans ce verset, afin de conserver la continuité et la légère implicitation du texte source.
- issue: Sens de l’ouverture de la bouche
  choice: Conserver l’image « elle lui ouvrira la bouche ».
  alternative: Expliciter par « elle lui donnera la parole » ou « elle le fera parler ».
  rationale: L’expression concrète peut évoquer à la fois la capacité, l’autorisation et l’assurance de parler devant l’assemblée; une paraphrase unique réduirait cette richesse.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu, tandis que « elle lui ouvrira la bouche » évite une tournure française maladroite sans effacer l’image originale.
