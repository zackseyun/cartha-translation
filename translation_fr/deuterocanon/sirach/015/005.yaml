  terminology: « Compagnons » et « assemblée » sont des choix neutres et appropriés. Ils évitent respectivement la restriction de « ami » et la coloration confessionnelle possible de « congrégation ». La note signale correctement l’écart entre le singulier morphologique hébreu et le pluriel du parallèle grec.
