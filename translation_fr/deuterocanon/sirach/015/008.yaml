translation:
  language: fr
  text: Elle est loin des moqueurs[a], et les hommes de mensonge ne se souviendront pas d’elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Elle est loin de l’orgueil, et les hommes menteurs ne se souviendront certainement pas d’elle. » L’hébreu a « moqueurs » là où le grec a « orgueil », peut-être en raison d’un texte hébreu sous-jacent différent ou d’une traduction interprétative.'
    reason: alternative_reading
lexical_decisions:
- source_word: רְחוֹקָה הִיא מִלֵּצִים
  choice: Elle se tient loin des moqueurs
  rationale: La tournure exprime une distance métaphorique. « Se tient loin de » est naturelle en français et préserve la personnification féminine de la Sagesse. לֵצִים désigne des personnes arrogantes qui tournent en dérision, d’où « moqueurs ».
- source_word: וְאַנְשֵׁי כָזָב
  choice: et les hommes de mensonge
  rationale: Cette traduction conserve l’expression hébraïque littérale et sa forme masculine plurielle, tout en restant intelligible en français. Le grec parallèle, « hommes menteurs », confirme le sens général.
- source_word: לֹא יִזְכְּרוּהָ
  choice: ne se souviendront pas d’elle
  rationale: Le verbe זכר signifie ici « se souvenir » ou « se rappeler ». Le pronom féminin renvoie à la Sagesse personnifiée; le grec parallèle appuie également le sens de souvenir.
theological_decisions:
- issue: Référent et personnification du pronom féminin
  choice: 'La Sagesse demeure personnifiée au féminin : « Elle » et « d’elle ».'
  alternative: Employer un pronom neutre ou reformuler la sagesse comme une qualité impersonnelle.
  rationale: Le contexte immédiat présente la Sagesse sous des traits personnels et féminins. Le maintien du féminin respecte cette texture littéraire et théologique sans préciser davantage son statut.
- issue: Différence entre le texte hébreu et le parallèle grec
  choice: Suivre l’hébreu « moqueurs » dans le texte principal.
  alternative: Suivre le grec, qui évoque « l’orgueil » plutôt que les « moqueurs ».
  rationale: La source hébraïque fournie est de haute confiance et nomme explicitement les moqueurs. La variante grecque est toutefois assez significative pour être signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde la personnification de la Sagesse et une légère couleur sapientielle. « Hommes de mensonge » conserve délibérément l’idiome hébreu plutôt que de le réduire à « menteurs ».
