  text: Men of falsehood will not attain her[b][a], and men of insolence will not see her.
translation:
  language: fr
  text: Les hommes de fausseté[a] ne l’atteindront pas[b], et les hommes arrogants ne la verront pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « hommes de fausseté ». Le grec lit plutôt « gens dépourvus de sens », peut-être d’après un texte hébreu différent ou comme interprétation.
    reason: alternative_reading
  - marker: b
    text: Le verbe hébreu signifie habituellement « conduire » et son emploi est difficile ici. Le grec appuie le sens « atteindre » ou « saisir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יַדְרִיכוּהָ
  choice: ne l’atteindront pas
  rationale: Le hifil de דרך signifie habituellement « conduire », mais ce sens est difficile avec la Sagesse comme objet. Le parallèle grec καταλήμψονται appuie ici l’idée de l’atteindre ou de la saisir. « Atteindre » convient au parallélisme avec « ne la verront pas » sans prétendre supprimer la difficulté de l’hébreu.
- source_word: מְתֵי שָׁוְא
  choice: les hommes de fausseté
  rationale: שָׁוְא peut désigner la fausseté, la vanité ou ce qui est sans valeur. « Hommes de fausseté » conserve l’expression hébraïque et sa portée morale; le grec présente une lecture différente, « les gens dépourvus de sens ».
- source_word: וְאַנְשֵׁי זָדוֹן
  choice: les hommes arrogants
  rationale: זָדוֹן évoque l’orgueil, l’arrogance ou la présomption rebelle. « Arrogants » est naturel en français moderne et plus précis que le terme général « méchants ».
- source_word: לֹא יִרְאוּהָ
  choice: ne la verront pas
  rationale: Le verbe ראה a ici son sens direct de « voir », également confirmé par le grec ἴδωσιν. Le féminin renvoie à la Sagesse.
theological_decisions:
- issue: Priorité du témoin hébreu face au parallèle grec dans le premier membre
  choice: Conserver le sujet du texte hébreu, « les hommes de fausseté », tout en éclairant le verbe difficile par le grec et en traduisant « ne l’atteindront pas ».
  alternative: « Les gens dépourvus de sens ne la saisiront jamais » ou, littéralement d’après le sens habituel du verbe hébreu, « Les hommes de fausseté ne la conduiront pas ».
  rationale: 'L’hébreu conservé demeure le témoin principal. Le grec constitue toutefois un apport textuel réel: il soutient un sens contextuel comme « atteindre/saisir » pour le verbe difficile, tout en attestant un sujet différent. La traduction garde donc la tension textuelle dans les notes au lieu de l’effacer.'
translation_notes:
  register: Français international moderne, sobre et digne. La répétition « les hommes » reproduit le parallélisme des deux groupes hébreux. « Arrogants » rend זָדוֹן avec naturel, tandis que les deux notes signalent sans la résoudre artificiellement la difficulté du premier membre.
