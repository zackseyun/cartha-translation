  text: Yahweh hates evil and abomination[a], and he will not permit it to those who fear him.
translation:
  language: fr
  text: Yahvé déteste le mal et l’abomination, et il ne permet pas qu’ils atteignent ceux qui le craignent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « et cela n’est pas aimé de ceux qui le craignent ». L’hébreu dit plutôt que Dieu ne permet pas que le mal et l’abomination atteignent ceux qui le craignent.'
    reason: alternative_reading
lexical_decisions:
- source_word: רָעָה
  choice: le mal
  rationale: Dans son association avec תוֹעֵבָה, le mot désigne ici le mal moral plutôt qu’un malheur ou une calamité.
- source_word: תוֹעֵבָה
  choice: l’abomination
  rationale: Ce terme fort désigne ce qui est profondément odieux ou détestable. « Abomination » en conserve la gravité et correspond au grec βδέλυγμα.
- source_word: שָׂנֵא
  choice: déteste
  rationale: Le présent rend naturellement en français la portée générale de l’énoncé. « Déteste » exprime clairement la forte aversion du verbe hébreu.
- source_word: יְהֹוָה
  choice: Yahvé
  rationale: La forme française traditionnelle « Yahvé » représente explicitement le tétragramme dans un langage biblique courant et digne.
- source_word: וְלֹא יְאַנֶּנָּה
  choice: et il ne les fait pas subir
  rationale: Le verbe hébreu exprime ici l’idée de faire arriver ou de laisser survenir la chose évoquée. « Faire subir » donne une formulation française naturelle, tandis que le pronom pluriel reprend les deux noms coordonnés; la divergence substantielle du grec est signalée en note.
- source_word: לִירֵאָיו
  choice: à ceux qui le craignent
  rationale: Cette expression biblique usuelle désigne ceux qui révèrent Dieu; elle conserve la formulation traditionnelle sans la réduire à la terreur.
theological_decisions:
- issue: Divergence entre l’hébreu conservé et le parallèle grec dans le second membre
  choice: 'Suivre l’hébreu : « il ne les fait pas subir à ceux qui le craignent »'
  alternative: 'Suivre le grec : « elles ne sont pas agréables à ceux qui le craignent »'
  rationale: L’hébreu est conservé ici avec un degré élevé de confiance et constitue donc le texte principal. Le grec présente un prédicat différent, qui est conservé en note plutôt que fondu dans la traduction.
translation_notes:
  register: Français international moderne, simple et digne. La coordination « le mal et l’abomination » garde la force des deux termes hébreux. « Faire subir » évite une tournure littérale peu naturelle comme « permettre cela à quelqu’un », tout en conservant l’idée causative du texte hébreu.
