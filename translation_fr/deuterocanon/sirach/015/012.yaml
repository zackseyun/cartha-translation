  source_fidelity: 'Le texte français suit fidèlement l’hébreu : la défense « Ne dis pas », l’accusation « C’est lui qui m’a fait trébucher », le lien causal et « des hommes violents » rendent correctement פן תאמר, הוא התקילני, כי et אנשי חמס. Le pluriel et la spécificité de « violents » sont conservés. Les notes distinguent justement les lectures grecques ἐπλάνησεν (« m’a égaré ») et ἀνδρὸς ἁμαρτωλοῦ (« d’un homme pécheur »).'
