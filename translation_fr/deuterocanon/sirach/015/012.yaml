  text: Do not say[b][a], “He made me stumble,” for he has no need of violent men.
translation:
  language: fr
  text: 'Ne dis pas : « C’est lui qui m’a fait trébucher[a] », car il n’a nul besoin des hommes violents[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec porte : « m’a égaré », expression de sens plus large que l’hébreu « m’a fait trébucher ».'
    reason: alternative_reading
  - marker: b
    text: Le parallèle grec porte « d’un homme pécheur » là où l’hébreu a « des hommes violents ».
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן תֹּאמַר
  choice: Ne dis pas
  rationale: Dans cette instruction de sagesse, פן suivi de l’imparfait exprime naturellement une défense. « Ne dis pas » en restitue clairement la force en français actuel.
- source_word: הוּא
  choice: C’est lui qui
  rationale: La tournure disloquée met en relief le pronom hébreu et rend naturelle en français l’accusation dirigée contre Dieu dans le contexte.
- source_word: הִתְקִילָנִי
  choice: m’a fait trébucher
  rationale: Cette formulation conserve l’image concrète du trébuchement portée par l’hébreu, sans lui substituer le sens plus large du parallèle grec.
- source_word: כִּי אֵין צֹרֶךְ
  choice: car il n’a nul besoin
  rationale: « Car » maintient le rapport explicatif, tandis que « n’a nul besoin » rend l’expression avec concision et dignité.
- source_word: בְּאַנְשֵׁי חָמָס
  choice: des hommes violents
  rationale: חמס désigne la violence ou le tort violent. La traduction conserve la catégorie morale précise de l’hébreu et le pluriel masculin du texte.
theological_decisions:
- issue: Faut-il décrire Dieu comme faisant trébucher ou comme égarant ?
  choice: m’a fait trébucher
  alternative: m’a égaré
  rationale: Le témoin hébreu, conservé avec une confiance élevée, commande le texte principal et emploie une image concrète de trébuchement. Le grec présente une nuance plus large, signalée en note sans effacer l’hébreu.
- issue: Faut-il rendre la dernière expression par « hommes violents » ou par « pécheur » ?
  choice: des hommes violents
  alternative: d’un homme pécheur / des pécheurs
  rationale: L’hébreu porte אַנְשֵׁי חָמָס, plus précis que le grec ἀνδρὸς ἁμαρτωλοῦ. Conserver « hommes violents » respecte la primauté du témoin hébreu tout en documentant la variante grecque.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le parallélisme sapientiel, l’image hébraïque du trébuchement et la spécificité éthique de חמס. Les deux appels de note figurent immédiatement après les expressions concernées.
