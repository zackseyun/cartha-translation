  text: Praise is not fitting in the mouth of a wicked man[a], for it has not been allotted to him by God.
translation:
  language: fr
  text: La louange ne convient pas dans la bouche d’un homme méchant[a], car elle ne lui a pas été accordée en partage par Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « pécheur », puis : « car elle n’a pas été envoyée par le Seigneur ». L’hébreu dit plus littéralement : « car elle ne lui a pas été accordée en partage par Dieu ».'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא נָאֲתָה
  choice: ne convient pas
  rationale: Exprime naturellement en français moderne l’idée de convenance morale ou de caractère approprié, plutôt qu’une simple qualité esthétique.
- source_word: תְהִלָּה
  choice: la louange
  rationale: Le nom désigne ici la louange prononcée, sans imposer l’idée plus étroite d’un chant.
- source_word: בְּפִי
  choice: dans la bouche de
  rationale: Conserve l’image concrète de l’hébreu et correspond également à l’expression du parallèle grec.
- source_word: רָשָׂע
  choice: un homme méchant
  rationale: Rend le singulier masculin hébreu et distingue le texte hébreu du grec, qui porte « pécheur ».
- source_word: נֶחְלְקָה לּוֹ
  choice: elle ne lui a pas été accordée en partage
  rationale: Préserve l’image d’une part attribuée ou allouée, plus précise que le simple verbe « donner ».
- source_word: מֵאֵל
  choice: par Dieu
  rationale: Dans cette construction passive, « par Dieu » exprime naturellement en français l’agent divin, tout en conservant l’idée que cette part vient de Dieu.
theological_decisions:
- issue: Rapport entre l’hébreu et le grec dans le second membre
  choice: 'Suivre dans le texte principal l’hébreu : la louange ne lui a pas été accordée en partage par Dieu.'
  alternative: « car elle n’a pas été envoyée par le Seigneur », selon le grec.
  rationale: Le texte hébreu conservé est ici le témoin principal et sa métaphore du partage est cohérente. Le grec semble refléter une autre lecture ou une interprétation; celle-ci est signalée en note sans remplacer l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. L’expression « dans la bouche » conserve volontairement l’image sémitique; « accordée en partage » maintient la métaphore hébraïque sans devenir obscure.
