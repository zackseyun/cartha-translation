review_pass:
  verdict: revise
  source_fidelity: Le texte français introduit « l’horizon » comme objet de « a entouré » et fait de l’arc-en-ciel le sujet et l’objet implicites des deux propositions. Or le témoin hébreu est syntaxiquement difficile et ne fournit explicitement ni cet objet ni ce référent. Le parallèle grec soutient l’image du ciel entouré et de l’objet déployé, mais ne justifie pas de les intégrer sans réserve au texte principal hébreu.
  naturalness: La formulation est fluide, mais « Dans sa gloire, il a entouré l’horizon » est moins nette en français parce que l’antécédent de « il » n’apparaît pas dans le verset. Une formulation qui signale l’ellipse contextuelle reste poétique et plus honnête sur le plan textuel.
  terminology: « Main de Dieu », au singulier, rend correctement יד אל. « Déployé » est naturel pour l’image cosmique, mais l’objet « l’ » relève du parallèle grec plutôt que de l’hébreu explicite. « Horizon » est une interprétation possible de חוק, non une donnée certaine; il convient de le présenter comme tel dans la note plutôt que de l’imposer comme objet syntaxique.
  issues:
  - severity: medium
    issue: Ajout non signalé de « l’horizon » comme objet direct.
    rationale: L’hébreu transmis ne comporte pas d’objet explicite après הקיפה. Le grec lit « le ciel », tandis que la compréhension « horizon » dérive d’une interprétation de חוק; le texte français ne doit pas fusionner ces deux lectures.
  - severity: medium
    issue: Référents de « il » et de « l’ » surdéterminés.
    rationale: L’attribution de ces pronoms à l’arc-en-ciel est contextuellement plausible, mais elle n’est pas explicitée par le texte hébreu de ce verset. Le français doit conserver cette ellipse ou l’indiquer comme interprétation.
  - severity: low
    issue: La note a ne rend pas compte de la difficulté syntaxique du texte hébreu.
    rationale: Elle explique חוק, mais pas l’absence d’objet explicite et l’écart avec la construction grecque, éléments nécessaires pour évaluer la traduction.
  revised_text: Elle l’a entouré de sa gloire[a][c], et la main de Dieu[b] l’a déployé dans sa majesté.
  revised_footnotes:
  - marker: a
    text: 'Le texte hébreu est difficile et elliptique. Il contient le mot חוק, qui peut désigner une limite fixée, un ordre établi ou un cercle; il ne nomme pas explicitement l’objet des verbes. Le parallèle grec porte : « Il a entouré le ciel d’un cercle de gloire. »'
    reason: alternative_reading
  - marker: b
    text: L’hébreu a le singulier « la main de Dieu »; le parallèle grec, le pluriel « les mains du Très-Haut ».
    reason: textual_variant
  - marker: c
    text: Le manuscrit de Massada ne conserve ici qu’un fragment (« …dans sa gloire »); le texte plus complet provient des manuscrits de la Guéniza du Caire.
    reason: textual_variant
  revision_rationale: La révision retire « l’horizon », qui imposait à la fois un sens contestable de חוק et un objet absent du témoin hébreu. « Elle » et « l’ » maintiennent l’ellipse poétique et peuvent se comprendre à partir de l’arc-en-ciel évoqué par le contexte immédiat, sans prétendre que ce référent est exprimé dans ce verset. Les notes conservent la lecture grecque et explicitent la difficulté du texte hébreu. Les trois ancres existantes sont conservées et correspondent chacune à une note.
