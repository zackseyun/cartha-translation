  text: He encircled the horizon in his glory[c][b][a], and the hand of God stretched out in his majesty.
translation:
  language: fr
  text: Dans sa gloire, il a entouré l’horizon[a][c], et la main de Dieu[b] l’a déployé dans sa majesté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement « la limite fixée » ou « le cercle prescrit ». Le parallèle grec porte : « Il a entouré le ciel d’un cercle de gloire. »'
    reason: alternative_reading
  - marker: b
    text: L’hébreu a le singulier « la main de Dieu »; le parallèle grec, le pluriel « les mains du Très-Haut ».
    reason: textual_variant
  - marker: c
    text: Le manuscrit de Massada ne conserve ici qu’un fragment (« …dans sa gloire »); le texte plus complet provient des manuscrits de la Guéniza du Caire.
    reason: textual_variant
lexical_decisions:
- source_word: חוק
  choice: l’horizon
  rationale: חוק désigne normalement ce qui est fixé ou prescrit et peut, dans ce tableau cosmique, évoquer la limite assignée au ciel, donc l’horizon. Ce choix rend l’image en français courant sans transformer le mot en « ciel », lecture propre au parallèle grec.
- source_word: הקיפה
  choice: il a entouré
  rationale: Le verbe exprime l’action de faire le tour ou d’encercler. Le sujet implicite est vraisemblablement l’arc-en-ciel évoqué dans le contexte immédiat; en français, le pronom masculin « il » s’y rapporte naturellement.
- source_word: בכבודה
  choice: dans sa gloire
  rationale: La tournure conserve la préposition et laisse « sa » renvoyer naturellement à l’arc-en-ciel, sans exclure la gloire divine manifestée par celui-ci.
- source_word: ויד אל
  choice: et la main de Dieu
  rationale: La traduction suit le singulier du texte hébreu. אל est compris ici comme le nom divin « Dieu », conformément au contexte hymnique.
- source_word: נטתה
  choice: l’a déployé
  rationale: נטה signifie étendre, tendre ou déployer. Avec « la main de Dieu » comme sujet, le complément implicite est l’arc-en-ciel; « l’a déployé » rend l’image plus clairement que l’intransitif « s’est étendue » et concorde avec l’objet explicite du parallèle grec.
- source_word: בגבה
  choice: dans sa majesté
  rationale: גבה évoque la hauteur, l’élévation ou la grandeur. « Majesté » convient au registre de louange tout en maintenant l’ambiguïté du possessif français quant à son référent exact.
theological_decisions:
- issue: Divergence entre le témoin hébreu et le parallèle grec
  choice: Le texte principal suit l’hébreu en traduisant חוק par l’image de la limite fixée (« horizon ») et יד אל au singulier (« la main de Dieu »).
  alternative: « Il a entouré le ciel d’un cercle de gloire, et les mains du Très-Haut l’ont déployé. »
  rationale: L’hébreu conservé est le témoin source principal. Le grec atteste clairement la portée cosmique du verset, mais ses formulations « ciel » et « mains du Très-Haut » ne doivent pas remplacer sans indication les lectures hébraïques différentes.
- issue: Référent du sujet de הקיפה et objet de נטתה
  choice: Le pronom « il » et le complément « l’ » renvoient à l’arc-en-ciel du contexte immédiat.
  alternative: Comprendre Dieu comme sujet de la première proposition et sa main comme s’étendant elle-même dans la seconde.
  rationale: Le parallèle grec présente le phénomène céleste comme ce qui entoure le ciel et comme l’objet déployé par les mains du Très-Haut. Cette syntaxe donne aussi au verset hébreu une progression naturelle, tout en maintenant Dieu comme auteur de la merveille.
translation_notes:
  register: Français international moderne, poétique mais accessible. « Horizon » exprime naturellement la limite cosmique fixée par חוק. « Déployé » convient à l’arc-en-ciel et évite une formulation réflexive artificielle; la majesté et l’ambiguïté poétique des possessifs sont conservées.
