base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/024.yaml
  text: Those who go down to the sea recount its far reaches[a]; when our ears hear[b], we are astonished.
translation:
  language: fr
  text: Ceux qui descendent vers la mer[b] racontent ses confins[a] ; quand nos oreilles entendent cela, nous sommes stupéfaits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « son danger » au lieu de l’hébreu « ses confins » ou « son extrémité ». Le texte principal suit le témoin hébreu conservé ; le grec peut refléter une variante ou une interprétation centrée sur les périls de la mer.
    reason: alternative_reading
  - marker: b
    text: L’expression hébraïque « ceux qui descendent vers la mer » désigne les gens qui prennent la mer.
    reason: cultural_note
lexical_decisions:
- source_word: יורדי הים
  choice: Ceux qui descendent vers la mer
  rationale: Rend littéralement l’image idiomatique hébraïque désignant les gens de mer. Le grec, « ceux qui naviguent sur la mer », en confirme le sens maritime.
- source_word: יספרו
  choice: en racontent
  rationale: Le verbe exprime l’action de rapporter ou de relater ce dont on a fait l’expérience.
- source_word: קצהו
  choice: les confins
  rationale: Le terme hébreu désigne l’extrémité, la limite ou les lointains de la mer. « Les confins » conserve cette idée sans la réduire à un point final précis.
- source_word: לשמע אזנינו
  choice: à ce qu’en entendent nos oreilles
  rationale: Cette formulation garde l’insistance sensorielle de l’hébreu, littéralement « à l’audition de nos oreilles », tout en restant intelligible en français.
- source_word: נשתומם
  choice: nous sommes stupéfaits
  rationale: Le verbe évoque une réaction de saisissement ou de profonde stupéfaction, sans imposer exclusivement l’émerveillement ou la peur.
