revisions:
- from: Telle une fournaise attisée au plus fort de la chaleur[a], le soleil embrase les montagnes par trois fois[b] ; il souffle des vapeurs de feu et, faisant jaillir ses rayons, il éblouit les yeux.
  to: Telle une fournaise attisée au plus fort de la chaleur[a], le soleil embrase les montagnes trois fois plus[b] ; soufflant des vapeurs ardentes et faisant jaillir ses rayons, il éblouit les yeux.
  rationale: La révision précise la valeur intensive de τριπλασίως par « trois fois plus », plutôt que la valeur potentiellement répétitive de « par trois fois ». Elle améliore aussi légèrement l’idiomaticité de l’image des exhalaisons ardentes, sans modifier l’équilibre retenu entre l’hébreu fragmentaire et le parallèle grec.
  reviewer_model: gpt-5.6-terra
