    issue: « Par trois fois » peut être compris comme une répétition temporelle.
    rationale: Le grec τριπλασίως est un adverbe de degré (« au triple », « trois fois plus »), non simplement une indication que l’action se produit trois fois.
  - severity: low
    issue: « Vapeurs de feu » est légèrement moins idiomatique en français moderne.
    rationale: « Vapeurs ardentes » conserve précisément le caractère πυρώδεις et s’intègre plus naturellement à la phrase.
