base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/004.yaml
  text: Like a blazing furnace in the works of heat[a], the sun scorches the mountains three times over; breathing out fiery vapors, and flashing rays[b], it dims the eyes.
translation:
  language: fr
  text: Telle une fournaise attisée au plus fort de la chaleur[a], le soleil embrase les montagnes trois fois plus[b] ; soufflant des vapeurs ardentes et faisant jaillir ses rayons, il éblouit les yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu de ce verset est difficile par endroits et ne correspond pas exactement au grec. La traduction prend l’hébreu conservé comme point de départ et s’appuie sur le témoin grec pour éclairer certaines expressions condensées ou incertaines.
    reason: textual_variant
  - marker: b
    text: « Trois fois plus » est explicite dans le texte grec, mais cette expression n’est pas clairement conservée dans la ligne hébraïque disponible.
    reason: alternative_reading
lexical_decisions:
- source_word: כור נפוח / κάμινον φυσῶν
  choice: une fournaise attisée
  rationale: L’hébreu et le grec associent la fournaise à l’action de souffler. « Attisée » restitue naturellement l’image d’un feu intensifié par l’air.
- source_word: מחם מצוק / ἐν ἔργοις καύματος
  choice: au plus fort de la chaleur
  rationale: L’hébreu est difficile et le grec offre une formulation inhabituelle, littéralement proche des « œuvres de la chaleur ». La traduction exprime une chaleur à l’œuvre et accablante sans reproduire une tournure obscure en français.
- source_word: ידליק הרים / ἐκκαίων ὄρη
  choice: embrase les montagnes
  rationale: Le verbe hébreu évoque l’allumage ou l’embrasement, confirmé par le grec. Le choix conserve la force poétique de l’image solaire.
- source_word: τριπλασίως
  choice: par trois fois
  rationale: Cet intensif est explicite dans le témoin grec, même s’il n’est pas clairement conservé dans l’hébreu disponible. « Par trois fois » maintient son sens sans le réduire à un vague « extrêmement ».
- source_word: ἀτμίδας πυρώδεις ἐμφυσῶν
  choice: il souffle des vapeurs de feu
  rationale: Le grec décrit une exhalaison ardente. Cette formulation française conserve à la fois le souffle et les vapeurs brûlantes.
- source_word: καὶ ἐκλάμπων ἀκτῖνας
  choice: faisant jaillir ses rayons
  rationale: Le grec explicite l’émission éclatante des rayons et éclaire une ligne hébraïque textuellement difficile.
- source_word: ומנורה תכוה עין / ἀμαυροῖ ὀφθαλμούς
  choice: il éblouit les yeux
  rationale: L’hébreu parle littéralement de la lampe ou du luminaire qui brûle l’œil, tandis que le grec dit qu’il obscurcit les yeux. « Éblouit » rend en français l’effet visuel commun à ces deux images sans conclure à une cécité totale.
