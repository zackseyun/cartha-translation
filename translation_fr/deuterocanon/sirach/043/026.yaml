  text: For his sake the messenger succeeds[b][a], and by his word he accomplishes his will.
translation:
  language: fr
  text: C’est pour lui que le messager réussit[a] ; par sa parole, il accomplit la volonté[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’ange réussit ». Le mot hébreu peut désigner un messager ou un ange.
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec parallèle présente une lecture plus générale : « et par sa parole toutes choses sont ordonnées ensemble » (ou « constituées ensemble »).'
    reason: alternative_reading
lexical_decisions:
- source_word: למענו
  choice: C’est pour lui que
  rationale: Cette tournure rend la valeur de référence ou de finalité de לְמַעַן (« pour lui », « en sa faveur ») sans lui donner inutilement un sens causal.
- source_word: יצלח
  choice: réussit
  rationale: Le verbe צלח exprime ici la réussite ou l’aboutissement efficace. « Réussit » est direct et naturel en français moderne.
- source_word: מלאך
  choice: le messager
  rationale: מלאך peut désigner un messager humain ou un ange. « Messager » conserve cette ouverture lexicale, tandis que l’autre possibilité est signalée en note.
- source_word: ובדבריו
  choice: par sa parole
  rationale: 'La préposition ב est comprise comme instrumentale : la parole est le moyen par lequel l’action s’accomplit. Le possessif demeure aussi peu explicité que dans l’hébreu.'
- source_word: יפעל רצון
  choice: il accomplit ce qui est voulu
  rationale: פעל signifie faire, produire ou accomplir, et רצון désigne la volonté, le désir ou le bon plaisir. Cette formulation évite d’ajouter à רצון un possessif absent de l’hébreu tout en donnant un français intelligible.
theological_decisions:
- issue: Faut-il identifier מלאך expressément comme un ange ?
  choice: le messager
  alternative: l’ange
  rationale: Le mot hébreu permet les deux sens et le verset ne tranche pas avec certitude. Le texte principal préserve donc l’ambiguïté.
- issue: À qui attribuer la parole et la volonté dans le second membre ?
  choice: Conserver les pronoms sans identifier explicitement leur référent, et ne pas ajouter de possessif à רצון
  alternative: par la parole de Dieu, il accomplit la volonté de Dieu
  rationale: Le contexte suggère une parole et une volonté divines, mais l’hébreu emploie seulement « sa parole » et רצון sans suffixe possessif. Une explicitation dogmatique dépasserait le texte.
translation_notes:
  register: Français international actuel, sobre et digne. La structure en deux membres reste proche de l’hébreu. « Ce qui est voulu » préserve l’absence de possessif avec רצון, mais rend la phrase plus naturelle qu’un calque tel que « il accomplit volonté ».
