  terminology: « Messager » conserve utilement l’ambiguïté de מלאך; la note « ange » est bien ancrée. « Parole » convient pour דבר. « Volonté » rend directement רצון sans identification doctrinale explicite du référent. La note grecque doit employer « ordonnées ensemble » ou une formulation équivalente, plutôt que suggérer une idée spécifique de maintien continu.
