    issue: « une majesté incomparable » ajoute une notion non attestée
    rationale: « Incomparable » implique que l’arc-en-ciel ne peut être comparé à rien d’autre; le texte hébreu emploie seulement מאד, un intensif (« très / extrêmement »).
  - severity: medium
    issue: La relation entre majesté et splendeur est trop librement reformulée
    rationale: « Il resplendit avec une majesté incomparable » remplace « [il est] extrêmement majestueux dans sa splendeur ». Une formulation plus proche préserve les deux termes et leur relation sans perdre la clarté.
