  text: Look at the rainbow and bless its Maker[b][a], for it is exceedingly majestic in splendor.
translation:
  language: fr
  text: Regarde l’arc-en-ciel[a] et bénis celui qui l’a fait, car il est extrêmement majestueux dans sa splendeur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’arc »; il s’agit ici de l’arc-en-ciel.'
    reason: lexical_alternative
  - marker: b
    text: Le manuscrit de Massada présente ici une formulation apparentée qui confirme l’idée de majesté et de splendeur.
    reason: textual_variant
lexical_decisions:
- source_word: ראה
  choice: Regarde
  rationale: L’impératif appelle directement le lecteur à porter son regard sur le phénomène; « Regarde » est naturel et conserve la force de l’ordre.
- source_word: קשת
  choice: l’arc-en-ciel
  rationale: Le mot signifie littéralement « arc », mais, dans ce contexte cosmologique, il désigne l’arc visible dans le ciel. « Arc-en-ciel » rend immédiatement le référent en français moderne.
- source_word: וברך
  choice: et bénis
  rationale: Le verbe ברך signifie normalement « bénir ». Ce choix conserve le vocabulaire religieux du texte, même si l’acte implique ici aussi la louange.
- source_word: עושיה
  choice: celui qui l’a fait
  rationale: Cette formulation rend naturellement en français le participe « son fabricant / celui qui l’a fait », tout en maintenant la référence implicite à Dieu sans ajouter son nom.
- source_word: כי מאד נאדרה בהוד
  choice: car il resplendit avec une majesté incomparable
  rationale: נאדרה exprime grandeur ou majesté, הוד splendeur ou éclat, et מאד intensifie l’ensemble. La formulation française restitue conjointement la grandeur et l’éclat visuel sans lourde répétition.
theological_decisions:
- issue: Identité de celui qui doit être béni
  choice: « celui qui l’a fait »
  alternative: « Dieu, qui l’a fait » ou « son Créateur »
  rationale: L’hébreu désigne implicitement Dieu par une forme signifiant « celui qui l’a fait », sans le nommer. La traduction préserve cette retenue et n’explicite pas davantage que le texte.
translation_notes:
  register: Français moderne, clair et digne, avec une cadence poétique. « Resplendit avec une majesté incomparable » évite l’expression peu idiomatique « est extrêmement majestueux en splendeur » tout en conservant les nuances conjointes de נאדרה, הוד et מאד.
