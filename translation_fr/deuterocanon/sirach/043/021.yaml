  text: It scorches the produce of the mountains with drought[b][a], and the pasture of plants with flame.
translation:
  language: fr
  text: Il brûle la production des montagnes par la sécheresse[a], et le pâturage de la végétation par la flamme.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par l’aridité » ou « par la sécheresse ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec parallèle présente une image plus développée : « Il dévorera les montagnes, embrasera le désert et fera disparaître l’herbe verte comme un feu. » Le texte hébreu suivi ici est plus concis et diffère dans ses images.'
    reason: alternative_reading
lexical_decisions:
- source_word: יבול הרים
  choice: les produits des montagnes
  rationale: יבול désigne ce que la terre produit. « Produits » conserve cette ampleur sans réduire l’image à des cultures agricoles.
- source_word: בחרב
  choice: par la sécheresse
  rationale: חֹרֶב exprime la sécheresse ou l’aridité ; « par la sécheresse » rend ici naturellement le moyen de destruction.
- source_word: ישיק
  choice: il brûle
  rationale: Dans ce parallélisme avec « flamme », le verbe décrit une action destructrice assimilable à une brûlure. « Brûle » reste direct sans préciser davantage le mécanisme.
- source_word: נוה צמחים
  choice: les pâturages verdoyants
  rationale: נוה peut désigner un pâturage ou une prairie, tandis que צמחים évoque ce qui pousse. Cette formulation française restitue naturellement l’espace couvert de végétation.
- source_word: בלהבה
  choice: par la flamme
  rationale: La préposition ב est comprise comme instrumentale ; « par la flamme » préserve la concision et le parallélisme du vers.
