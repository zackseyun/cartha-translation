  text: The sun[a], appearing in its form and hot[c][b], how awe-inspiring are the works of the Lord.
translation:
  language: fr
  text: 'Le soleil[a], se manifestant par son aspect et sa chaleur[b][c] : combien les œuvres du Seigneur sont redoutables !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec se lit : « Le soleil, proclamant lorsqu’il apparaît à son lever, instrument merveilleux, œuvre du Très-Haut. » Le témoin hébreu met plutôt l’accent sur l’aspect visible du soleil et sur sa chaleur.'
    reason: alternative_reading
  - marker: b
    text: L’expression hébraïque rendue par « se manifestant par son aspect et sa chaleur » est concise et légèrement difficile ; elle semble indiquer que l’apparence visible et la chaleur du soleil donnent à connaître les œuvres redoutables du Seigneur.
    reason: lexical_alternative
  - marker: c
    text: À cet endroit, le manuscrit de Massada ne conserve la ligne que de manière fragmentaire ; le texte hébreu plus complet retenu ici provient des manuscrits de la Gueniza du Caire.
    reason: textual_variant
lexical_decisions:
- source_word: שמש
  choice: Le soleil
  rationale: Désigne simplement l’astre solaire ; l’article défini est naturel en français.
- source_word: מביע
  choice: se manifestant
  rationale: Le participe peut évoquer le fait de faire paraître, d’exprimer ou de proclamer. « Se manifestant » conserve l’idée d’une révélation visible sans imposer une reconstruction trop précise.
- source_word: בצורתו
  choice: par son aspect
  rationale: צורה renvoie ici à la forme ou à l’apparence visible. « Aspect » est plus idiomatique que « forme » dans ce contexte tout en restant proche de l’hébreu.
- source_word: וחמה
  choice: et sa chaleur
  rationale: La formulation hébraïque non vocalisée est concise et difficile. Dans ce contexte, חמה est compris comme évoquant la chaleur du soleil ; l’ajout du possessif rend la relation naturelle en français sans développer davantage le sens.
- source_word: מה נורא
  choice: combien … sont redoutables
  rationale: נורא exprime ce qui inspire crainte et respect. « Redoutables » garde cette force solennelle sans réduire le terme à l’émerveillement.
- source_word: מעשי ה׳
  choice: les œuvres du Seigneur
  rationale: Le pluriel « œuvres » correspond à מעשי. L’abréviation révérencielle du nom divin est rendue par « le Seigneur ».
theological_decisions:
- issue: Rendu de l’abréviation du nom divin ה׳
  choice: le Seigneur
  alternative: l’Éternel
  rationale: Le texte hébreu emploie une abréviation révérencielle du nom divin. « Le Seigneur » respecte cette pratique de lecture et demeure cohérent avec le registre du Siracide, sans introduire une forme confessionnelle plus marquée.
- issue: Portée de נורא appliqué aux œuvres divines
  choice: redoutables
  alternative: admirables
  rationale: « Redoutables » préserve la tension entre crainte et révérence présente dans נורא ; « admirables » atténuerait cette dimension.
translation_notes:
  register: Français international actuel, soutenu mais accessible. La construction participiale et les deux-points conservent la formulation exclamative et condensée de l’hébreu. Les notes signalent sans les harmoniser la difficulté du texte hébreu et la différence du parallèle grec.
