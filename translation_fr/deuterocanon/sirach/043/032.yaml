  - severity: low
    issue: « Il existe » est légèrement moins idiomatique que « Il y a » dans cette affirmation générale.
    rationale: Les deux sont exacts, mais « Il y a beaucoup de… » est la formulation moderne la plus spontanée sans modifier le sens.
