  source_fidelity: Le texte hébreu conservé porte littéralement « beaucoup de merveilles telles que celles-ci ; j’ai vu peu de ses œuvres ». Le projet restitue bien l’abondance, les merveilles, le démonstratif et le singulier de ראיתי. Toutefois, « qu’une petite partie de ses œuvres » transforme « peu [d’œuvres] » en une portion indifférenciée de l’ensemble ; « peu de ses œuvres » conserve mieux le pluriel dénombrable et la valeur partitive de מן. La note a rend fidèlement compte de l’expansion grecque, y compris « cachées » et « plus grandes ».
  naturalness: « Il y a beaucoup de merveilles de ce genre » est plus direct et naturel en français international moderne que « Il existe beaucoup de… ». « Je n’en ai vu que peu » est idiomatique, concis et évite de répéter inutilement « de ses œuvres », tout en gardant l’antécédent clair dans le contexte immédiat.
  terminology: « Merveilles » convient à נפלאות et au registre contemplatif. « Œuvres » rend correctement מעשים dans ce contexte. Les notes distinguent sans les harmoniser les témoins hébreu (singulier) et grec (pluriel).
  issues:
