  text: Many such wonders exist[b][a], but I have seen only a few of his works.
translation:
  language: fr
  text: Il y a beaucoup de merveilles de ce genre[a] ; je n’en ai vu que peu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Il existe beaucoup de réalités cachées, plus grandes que celles-ci. » L’hébreu dit plus brièvement : « beaucoup de merveilles de ce genre », sans mention explicite de réalités « cachées » ni de choses « plus grandes que celles-ci ».'
    reason: alternative_reading
  - marker: b
    text: 'Le grec dit : « nous n’avons vu que peu de ses œuvres », tandis que l’hébreu conservé emploie le singulier : « j’ai vu ».'
    reason: textual_variant
lexical_decisions:
- source_word: רוב
  choice: beaucoup de
  rationale: Dans ce contexte, le mot exprime l’abondance; cette tournure française s’accorde naturellement avec le pluriel « merveilles ».
- source_word: נפלאות
  choice: merveilles
  rationale: Le terme désigne des réalités ou des œuvres extraordinaires qui suscitent l’émerveillement; « merveilles » convient au registre hymnique.
- source_word: כאלה
  choice: de ce genre
  rationale: L’expression renvoie aux phénomènes décrits auparavant et restitue clairement la valeur comparative du démonstratif.
- source_word: מעט
  choice: qu’une petite partie
  rationale: Avec מן partitif dans ממעשיו, la formule française exprime naturellement que ce qui a été vu ne représente qu’une faible part de l’ensemble des œuvres divines.
- source_word: ראיתי
  choice: je n’ai vu
  rationale: Le passé composé rend ici l’accompli hébreu comme une expérience constatée jusqu’au moment présent, tout en conservant la première personne du singulier.
- source_word: ממעשיו
  choice: de ses œuvres
  rationale: 'La préposition מן a ici une valeur partitive: le locuteur n’a vu qu’une partie de toutes les œuvres de Dieu.'
theological_decisions:
- issue: Faut-il intégrer au texte principal les précisions grecques « cachées » et « plus grandes que celles-ci »?
  choice: 'Le texte principal suit la formulation hébraïque plus brève: « beaucoup de merveilles de ce genre »; la leçon grecque est donnée en note.'
  alternative: « Il existe beaucoup de réalités cachées, plus grandes que celles-ci. »
  rationale: L’hébreu conservé est le témoin principal et ne comporte pas d’équivalent explicite de « cachées » ou de « plus grandes que celles-ci ». La note préserve néanmoins le témoignage grec sans le fondre silencieusement dans le texte.
- issue: Différence de personne entre l’hébreu et le grec
  choice: 'Conserver la première personne du singulier de l’hébreu: « je n’ai vu ».'
  alternative: « nous n’avons vu »
  rationale: Le témoin hébreu porte ראיתי, à la première personne du singulier. Le pluriel grec constitue une variante significative signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde le ton contemplatif du passage tout en donnant la priorité au témoin hébreu; les deux variantes grecques importantes sont explicitement conservées en notes.
