  source_fidelity: 'Le texte principal suit globalement l’hébreu : la valeur additive de וגם, le caractère récurrent de עתות שבות, la personnification de ממשלת et la durée exprimée par עולם sont conservés. Toutefois, « marque » introduit une action explicite qui relève plutôt de l’appui du grec (« manifestation des temps ») que de la formulation nominale et dense de l’hébreu. Une formulation nominale française permet de garder plus clairement la tension du texte hébreu, sans effacer l’écart signalé en note.'
  naturalness: « Souveraine du terme » est compréhensible en poésie, mais son apposition sans article après les deux-points est raide en français moderne. « Maîtresse de la fin » est plus naturel dans une énumération poétique tout en conservant la personnification. « Signe perpétuel » est idiomatique et rend עולם sans imposer une lecture eschatologique de « pour toujours ».
  terminology: « Lune », « temps qui reviennent », « maîtresse », « fin » et « signe perpétuel » préservent les termes importants et leur ambiguïté. « Fin » est plus direct que « terme » pour קץ; la note explicite à juste titre les possibilités calendaires de « fin/limite ». La note grecque est ajustée pour ne pas donner à entendre que le grec porte exactement la même structure que l’hébreu.
