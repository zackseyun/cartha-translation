  text: The moon also marks the returning seasons[c][b][a], a ruler of the end and a sign forever.
translation:
  language: fr
  text: 'La lune aussi : les temps qui reviennent[a][c], maîtresse de la fin[b] et signe perpétuel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec porte : « La lune, en toute chose, pour son temps fixé, manifestation des temps et signe pour toujours. » L’hébreu dit plutôt « les temps qui reviennent » et « maîtresse de la fin ».'
    reason: alternative_reading
  - marker: b
    text: L’expression hébraïque « maîtresse de la fin » est très concise. Elle peut évoquer le rôle de la lune dans l’achèvement du mois ou dans la détermination d’une limite fixée.
    reason: lexical_alternative
  - marker: c
    text: 'Le manuscrit de Massada conserve pour ce verset une leçon différente de celle des manuscrits hébreux de la Guéniza du Caire suivis ici ; le fragment préservé porte : « car le grand Seigneur l’a faite ».'
    reason: textual_variant
lexical_decisions:
- source_word: וגם
  choice: aussi
  rationale: Le terme ajoute la lune aux luminaires déjà évoqués; « aussi » en restitue naturellement la valeur additive.
- source_word: ירח
  choice: la lune
  rationale: Le nom désigne sans ambiguïté la lune; l’article défini convient en français pour l’astre.
- source_word: עתות שבות
  choice: le retour des saisons
  rationale: עתות désigne des temps ou saisons, tandis que שבות exprime leur retour. La formulation française conserve l’idée de cycles calendaires sans préciser davantage leur nature.
- source_word: ממשלת קץ
  choice: souveraine du terme
  rationale: ממשלת évoque l’exercice du pouvoir ou une autorité personnifiée, et קץ le terme, la limite ou l’achèvement. Cette expression concise garde la densité et l’ambiguïté de l’hébreu.
- source_word: ואות עולם
  choice: et signe pour toujours
  rationale: אות signifie « signe » et עולם peut exprimer une durée indéfinie ou perpétuelle. « Pour toujours » rend directement cette portée temporelle.
theological_decisions:
- issue: Pondération de l’hébreu et du parallèle grec en présence d’un léger écart textuel
  choice: Suivre en priorité l’hébreu conservé, tout en tenant compte du grec pour le sens calendaire
  alternative: 'Traduire plus près du grec : « Et la lune, en toutes choses, paraît en son temps, manifestation des temps et signe pour toujours. »'
  rationale: Puisque le texte hébreu est conservé, il constitue ici la source principale. Le grec confirme le cadre temporel, mais diffère notamment de l’hébreu « souveraine du terme »; cette particularité est donc maintenue dans le texte et signalée en note.
translation_notes:
  register: Français international moderne, poétique mais accessible. « Souveraine du terme » conserve la personnification et l’ambiguïté du texte hébreu; les notes rendent visibles les écarts du grec et de Massada.
