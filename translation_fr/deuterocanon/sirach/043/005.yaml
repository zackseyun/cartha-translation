  text: For great is the Lord who made it[b][a], and by his word he hastens its course.
translation:
  language: fr
  text: Car le Seigneur est grand, lui qui l’a fait[a] ; par sa parole, il hâte sa course[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'À Massada, seul le premier membre est conservé : « Car le Seigneur est grand, lui qui l’a fait. » Le texte hébreu de la Guéniza du Caire poursuit avec une formulation difficile ; le parallèle grec appuie le sens donné ici au second membre.'
    reason: textual_variant
  - marker: b
    text: 'Le second membre hébreu est difficile. Le grec porte : « par ses paroles, il a hâté sa course ». Autre traduction possible : « sur son ordre, il dirige sa course ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גדול
  choice: grand
  rationale: Adjectif attribut qualifiant le Seigneur ; « grand » est direct, naturel et adapté au registre hymnique.
- source_word: ה'
  choice: le Seigneur
  rationale: L’abréviation révérencielle du nom divin est rendue selon l’usage français traditionnel, sans translittération.
- source_word: עושהו
  choice: lui qui l’a fait
  rationale: Le suffixe renvoie au corps céleste évoqué dans le contexte, ici le soleil ; le pronom masculin français « l’ » convient à « soleil ».
- source_word: בדבריו
  choice: par sa parole
  rationale: Le singulier collectif « parole » exprime naturellement le moyen ou l’ordre divin, tout en restant proche de l’hébreu et du parallèle grec.
- source_word: ינצח
  choice: il hâte
  rationale: La forme hébraïque est difficile ; le grec κατέσπευσεν appuie le sens de hâter ou pousser en avant, cohérent avec le mouvement de l’astre.
- source_word: אביריו
  choice: sa course
  rationale: La lecture hébraïque est problématique dans ce contexte ; le grec πορείαν indique une course ou un parcours. « Course » convient au déplacement d’un astre sans introduire le terme technique moderne « orbite ».
theological_decisions:
- issue: Rendu du nom divin
  choice: le Seigneur
  alternative: YHWH
  rationale: Le texte hébreu porte l’abréviation révérencielle ה׳ ; « le Seigneur » est un rendu français clair et traditionnel.
- issue: Recours au parallèle grec pour le second membre textuellement difficile
  choice: 'Traduire l’hébreu à la lumière du grec : « par sa parole, il hâte sa course »'
  alternative: 'Rendre plus littéralement la lecture hébraïque difficile : « par ses paroles, son puissant l’emporte »'
  rationale: L’hébreu demeure le texte de base, mais ינצח אביריו forme ici une difficulté réelle. Le parallèle grec fournit un sens cohérent lié au mouvement de l’astre, sans effacer l’incertitude, laquelle est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La structure en deux membres et le ton hymnique sont conservés ; le point-virgule marque leur parallélisme. Le pronom masculin renvoie au soleil dans le contexte immédiat.
