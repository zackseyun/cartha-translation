  text: The Lord is exceedingly awesome[a], and his words are wondrous.
translation:
  language: fr
  text: Le Seigneur est redoutable au plus haut point, et ses paroles sont merveilleuses.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « sa puissance est merveilleuse » (ou « son autorité est merveilleuse »), au lieu de l’hébreu conservé : « ses paroles sont merveilleuses ».'
    reason: Variante du texte grec affectant le sens du second membre.
lexical_decisions:
- source_word: נורא
  choice: redoutable
  rationale: L’adjectif issu de ירא désigne celui qui inspire crainte et respect. « Redoutable » conserve cette dimension de crainte révérencielle sans employer le moderne « génial », que pourrait suggérer à tort un calque d’« awesome ».
- source_word: ה׳
  choice: Le Seigneur
  rationale: L’abréviation hébraïque représente le nom divin. « Le Seigneur » est une formulation française naturelle, conforme aussi au parallèle grec Κύριος.
- source_word: מאד מאד
  choice: au plus haut point
  rationale: Le redoublement de מאד marque une intensification extrême. Cette tournure restitue cette force dans un français naturel et soutenu, sans la répétition peu idiomatique « très, très ».
- source_word: ונפלאות
  choice: et … sont merveilleuses
  rationale: Le terme de la famille de פלא évoque ce qui est extraordinaire et suscite l’émerveillement. Le français explicite le verbe absent de la proposition nominale hébraïque.
- source_word: דבריו
  choice: ses paroles
  rationale: Le sens direct est « ses paroles » ou « ses propos ». Cette leçon hébraïque est retenue dans le texte principal malgré la variante substantielle du grec.
theological_decisions:
- issue: Rendu du nom ou titre divin ה׳
  choice: Le Seigneur
  alternative: le SEIGNEUR
  rationale: L’abréviation renvoie au nom divin, tandis que le parallèle grec emploie Κύριος. La capitale initiale suffit ici à présenter naturellement le titre en français, sans modifier son référent.
- issue: Divergence entre l’hébreu et le grec dans le second membre
  choice: ses paroles sont merveilleuses
  alternative: sa puissance souveraine est admirable
  rationale: Le texte hébreu conservé est prioritaire et porte דבריו, « ses paroles ». Le grec lit ἡ δυναστεία αὐτοῦ, qui évoque sa puissance ou son autorité souveraine. Cette variante importante est signalée en note plutôt que résolue silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. « Redoutable au plus haut point » préserve à la fois la crainte révérencielle exprimée par נורא et la forte intensification de מאד מאד.
