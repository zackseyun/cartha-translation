  text: At its shining it makes the world boil[b][a], and before its sword who can endure?
translation:
  language: fr
  text: Quand il resplendit, il fait bouillir le monde[b] ; devant son épée, qui peut tenir bon[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement « devant son épée » ; le grec porte : « devant sa chaleur ardente, qui résistera ? » Le texte conserve la métaphore hébraïque.'
    reason: alternative_reading
  - marker: b
    text: Le témoin plus ancien de Massada est fragmentaire à cet endroit. La formulation retenue repose principalement sur les manuscrits hébreux de la Guéniza du Caire, le grec servant de témoin de comparaison.
    reason: textual_variant
lexical_decisions:
- source_word: בהצהירו
  choice: Quand il resplendit
  rationale: Le terme hébreu évoque l’éclat intense du soleil. Cette formulation naturelle conserve l’image de son rayonnement, tandis que le grec comprend le moment où il est à son plus haut, « à midi ».
- source_word: ירתיח
  choice: il fait bouillir
  rationale: Le verbe hébreu désigne normalement l’action de bouillir ou de faire bouillir. Le choix garde l’image vive d’une chaleur extrême plutôt que de l’atténuer en « réchauffe ».
- source_word: תבל
  choice: le monde
  rationale: תבל désigne le monde, souvent envisagé comme la terre habitée. « Le monde » est ici idiomatique et conserve l’ampleur poétique du texte.
- source_word: חרבו
  choice: son épée
  rationale: L’hébreu porte littéralement « son épée », métaphore saisissante de la puissance tranchante et destructrice du soleil. Le grec explicite cette image par « sa chaleur ardente ».
- source_word: מי יתכלכל
  choice: qui peut tenir bon ?
  rationale: Dans ce contexte, la forme verbale exprime la capacité de se maintenir ou de résister sous une force accablante. « Tenir bon » est naturel en français et concorde avec le grec « qui résistera ? ».
