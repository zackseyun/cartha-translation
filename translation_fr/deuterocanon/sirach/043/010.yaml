  text: At his word the decree stands[b][a], and they do not fail in their watches.
translation:
  language: fr
  text: À la parole de Dieu, le décret tient ferme[a], et ils ne faiblissent pas lors de leurs veilles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le manuscrit de Massada lit : « À la parole du Seigneur, le décret tient ferme » ; il emploie « Seigneur » là où le texte hébreu transmis ici lit « Dieu ».'
    reason: textual_variant
  - marker: b
    text: Ou « ils ne se relâchent pas à leurs postes ». Le verbe hébreu est incertain ici ; le grec parallèle appuie l’idée qu’ils ne faiblissent pas et ne se relâchent pas.
    reason: lexical_alternative
lexical_decisions:
- source_word: בדבר
  choice: À sa parole
  rationale: La préposition ב peut exprimer ici la cause, le moyen ou le moment. « À sa parole » rend naturellement l’autorité de la parole divine sans ajouter dans le texte principal un titre divin qui n’est pas assuré dans le témoin hébreu de base.
- source_word: יעמד
  choice: demeure
  rationale: עמד signifie littéralement « se tenir, rester debout » et, appliqué au décret cosmique, indique qu’il reste établi et ferme. « Demeure » est idiomatique en français tout en conservant cette stabilité.
- source_word: חק
  choice: le décret
  rationale: Dans ce contexte cosmique, חק désigne une prescription ou un ordre fixé par autorité. « Décret » conserve cette idée sans donner au vers une tonalité excessivement juridique.
- source_word: ולא ישח
  choice: et ils ne faiblissent pas
  rationale: La forme hébraïque est incertaine. Le grec οὐ μὴ ἐκλυθῶσιν et la lecture de Massada exprimant l’absence de lassitude appuient le sens de ne pas faiblir, se relâcher ou manquer à sa tâche.
- source_word: באשמרותם
  choice: au cours de leurs veilles
  rationale: אשמרות peut désigner des périodes de veille ou des postes assignés. La formulation choisie préserve l’image de services ou de parcours célestes accomplis selon un ordre fixé.
theological_decisions:
- issue: Faut-il nommer explicitement le Seigneur comme auteur de la parole ?
  choice: 'Conserver la référence divine implicite : « À sa parole »'
  alternative: « À la parole du Seigneur, le décret demeure »
  rationale: Le témoin hébreu principal transmis ici ne justifie pas avec assez de certitude l’ajout explicite de « Seigneur », tandis que la lecture de Massada le nomme. Le texte principal conserve donc l’implicite et la note signale la variante.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste concise et conserve l’image cosmique des veilles assignées, tout en signalant l’incertitude textuelle et lexicale dans les notes.
