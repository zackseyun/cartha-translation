base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/020.yaml
  text: The cold of the north wind returns[a]; like rot, it freezes its spring. Over every standing body of water it settles[b], and the reservoir puts on armor like a breastplate.
translation:
  language: fr
  text: Le froid du vent du nord revient ; comme la pourriture, il glace sa source[a]. Sur toute étendue d’eau immobile, il se dépose[b], et le bassin se couvre comme d’une cuirasse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu porte littéralement l’image difficile « comme la pourriture, il glace sa source ». Le texte grec donne plus simplement : « la glace se formera à partir de l’eau ». Le texte principal suit ici l’hébreu conservé.'
    reason: alternative_reading
  - marker: b
    text: Le mot hébreu rendu par « il se dépose » est difficile ou incertain dans cette proposition. Le grec appuie l’idée que la glace vient reposer sur toute masse d’eau rassemblée.
    reason: textual_variant
lexical_decisions:
- source_word: צִנַּת
  choice: le froid de
  rationale: Le nom désigne le froid ou la froidure. « Le froid de » exprime naturellement en français sa relation avec le vent du nord.
- source_word: רוּחַ צָפוֹן
  choice: le vent du nord
  rationale: Dans ce contexte météorologique, רוּחַ signifie « vent » ; le grec βορέης confirme ce sens.
- source_word: יָשִׁיב
  choice: revient
  rationale: La forme hébraïque est concise et n’exprime aucun complément. « Revient » conserve cette indétermination et suggère le retour du froid septentrional sans ajouter d’objet.
- source_word: וְכָרָקָב
  choice: comme la pourriture
  rationale: Le texte hébreu conservé porte l’image difficile de la pourriture ou de la décomposition. Elle est maintenue plutôt que remplacée silencieusement par l’image plus claire du grec.
- source_word: יַקְפִּיא
  choice: il glace
  rationale: Le verbe signifie faire geler ou se solidifier. « Glacer » convient à l’action du froid sur une source et reste naturel en français.
- source_word: מְקוֹרוֹ
  choice: sa source
  rationale: מָקוֹר peut désigner une source ou un point d’où jaillit l’eau. « Sa source » respecte le suffixe singulier et l’image aquatique.
- source_word: מַעֲמַד מַיִם
  choice: étendue d’eau immobile
  rationale: L’expression évoque de l’eau maintenue ou rassemblée en un lieu. Cette formulation française rend l’idée sans imposer une forme précise au plan d’eau.
- source_word: יְקָרִים
  choice: il se dépose
  rationale: La forme hébraïque est difficile dans ce contexte. Le choix suit prudemment le sens de glace venant reposer sur l’eau, appuyé par le grec καταλύσει, tout en signalant l’incertitude en note.
- source_word: וּכְשִׁרְיוֹן
  choice: comme d’une cuirasse
  rationale: שִׁרְיוֹן désigne une armure, notamment une cuirasse. La formulation conserve l’image concrète d’un revêtement protecteur.
- source_word: יִלְבַּשׁ מִקְוֶה
  choice: le bassin se revêt
  rationale: מִקְוֶה désigne ici une masse d’eau rassemblée. « Bassin » est courant et « se revêt » préserve la personnification vestimentaire de l’hébreu.
