translation:
  language: fr
  text: D’un éclair, il fait voler sa neige[a] ; comme des sauterelles, elle se pose là où elle demeure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin hébreu est difficile et diffère fortement du texte grec parallèle. Celui-ci dit plutôt : « La voix de son tonnerre a réprimandé la terre », puis évoque une tempête du vent du nord et un tourbillon. Le manuscrit de Massada conserve lui aussi une autre ligne hébraïque, où l’on lit notamment « la voix du tonnerre » à la place de « d’un éclair » dans le texte de la Guéniza du Caire.'
    reason: textual_variant
lexical_decisions:
- source_word: ברשף
  choice: Dans l’éclair
  rationale: רשף désigne une flamme, une lueur ou un éclair. Dans ce contexte météorologique, « Dans l’éclair » conserve la formulation brève et son rapport circonstanciel sans préciser abusivement s’il est temporel ou instrumental.
- source_word: יניף
  choice: il secoue
  rationale: Le verbe נוף/הניף peut signifier agiter, brandir ou faire voler. Avec la neige comme complément, « secoue » restitue naturellement l’image de la neige dispersée, tout en restant proche du mouvement exprimé en hébreu.
- source_word: שלגו
  choice: sa neige
  rationale: Le suffixe pronominal hébreu signifie littéralement « sa neige ». Le possessif est conservé en français, où il reste naturel et maintient l’attribution implicite à Dieu.
- source_word: וכארבה
  choice: semblable aux sauterelles
  rationale: ארבה désigne les sauterelles, souvent envisagées comme une nuée. Le pluriel français rend clairement l’image collective suggérant l’abondance et la dispersion.
- source_word: ישכון
  choice: elle se pose
  rationale: שכן signifie habiter, demeurer ou s’établir. Appliqué à la neige, « se pose » exprime idiomatiquement son arrivée au sol, sans effacer entièrement l’idée d’installation.
- source_word: דירתו
  choice: là où elle demeure
  rationale: דירה signifie demeure ou lieu d’habitation, avec un suffixe possessif. Cette tournure conserve l’image inhabituelle de la demeure tout en produisant un français intelligible et en respectant l’incertitude du texte.
theological_decisions:
- issue: Priorité du témoin hébreu malgré la forte divergence du grec
  choice: Traduire dans le texte principal la ligne hébraïque conservée, avec une note signalant les autres témoins.
  alternative: Suivre le grec, qui évoque la voix du tonnerre, la terre, la tempête du nord et un tourbillon de vent.
  rationale: Puisqu’un texte hébreu de ce passage subsiste, il sert de base première. Toutefois, l’écart majeur avec le grec et avec le témoin de Massada doit être rendu visible afin de ne pas dissimuler l’incertitude textuelle.
translation_notes:
  register: Français international moderne, digne et accessible. La construction demeure volontairement imagée et légèrement énigmatique afin de respecter l’hébreu difficile ; le point-virgule clarifie les deux membres poétiques sans résoudre leur tension.
