  terminology: « Éclair », « neige », « sauterelles » et « demeure » sont des équivalents justes en français moderne. « Il fait voler sa neige » exprime naturellement la valeur causative de הניף mieux que « il secoue sa neige », qui peut évoquer le fait de secouer un objet tenu à la main.
