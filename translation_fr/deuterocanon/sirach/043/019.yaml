  text: He spreads frost like salt[c][b][a], and it sprouts like palm shoots.
translation:
  language: fr
  text: Il répand le givre comme du sel[a][c], et celui-ci pousse comme les bourgeons d’un palmier[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu transmis peut se comprendre littéralement comme « une brume de givre repose comme du sel », tandis que le grec porte : « il répand le givre comme du sel sur la terre ». Le texte est incertain; la traduction rend le sens général commun aux deux traditions.'
    reason: textual_variant
  - marker: b
    text: 'La fin peut aussi se traduire : « il fleurit comme les fleurs d’un palmier ». À la lumière du grec, l’image pourrait désigner du givre qui durcit en pointes de glace.'
    reason: lexical_alternative
  - marker: c
    text: Le manuscrit de Massada présente ici une leçon différente de celle des manuscrits de la Guéniza du Caire représentés par l’édition Kahana, signe que le texte hébreu a subi des perturbations à cet endroit.
    reason: textual_variant
lexical_decisions:
- source_word: אד
  choice: Il
  rationale: Dans le texte hébreu transmis, אד signifie normalement « brume » ou « vapeur », mais la formulation paraît perturbée. Le parallèle grec et le contexte de l’hymne indiquent que Dieu est le sujet implicite de l’action.
- source_word: כפור
  choice: le givre
  rationale: כפור désigne le givre ou la gelée blanche. « Givre » convient à l’image visible d’un dépôt cristallin.
- source_word: כמלח
  choice: comme du sel
  rationale: La comparaison évoque l’aspect blanc et granuleux du givre. En français, le partitif rend naturellement l’image d’une matière répandue.
- source_word: ישכון
  choice: répand
  rationale: Le sens ordinaire du verbe est « demeurer, reposer, se déposer ». Puisque le début de la ligne est textuellement incertain, « répand » exprime le mouvement général de l’image, en accord avec le grec, sans ajouter explicitement « sur la terre ».
- source_word: ויציץ
  choice: pousse
  rationale: Le verbe צוץ signifie « fleurir, bourgeonner, pousser ». « Pousse » conserve la métaphore végétale tout en pouvant évoquer des formations de glace saillantes.
- source_word: כתמר
  choice: d’un palmier
  rationale: תמר désigne le palmier, souvent le palmier-dattier. Le terme général « palmier » suffit dans cette comparaison poétique.
- source_word: ציצים
  choice: les bourgeons
  rationale: ציצים peut désigner des fleurs, des bourgeons ou des saillies florales. « Bourgeons » maintient l’image végétale et suggère une forme qui pointe.
theological_decisions:
- issue: Sujet implicite ou nom commun au début du verset
  choice: Employer le sujet divin implicite « Il »
  alternative: 'Traduire littéralement : « Une brume de givre repose comme du sel »'
  rationale: L’hébreu de cette ligne est instable, tandis que le grec présente Dieu comme sujet implicite. Le contexte attribue également les phénomènes météorologiques à Dieu. Le choix est donc cohérent sans dissimuler l’incertitude, signalée en note.
- issue: Nature de la dernière image
  choice: Conserver la métaphore végétale des bourgeons de palmier
  alternative: Comprendre, à la lumière du grec, des pointes de glace durcie
  rationale: L’hébreu emploie explicitement le vocabulaire de la floraison et du palmier. La traduction préserve cette image sans exclure qu’elle décrive visuellement des formations glacées pointues.
translation_notes:
  register: Français international moderne, poétique mais immédiatement intelligible. La répétition végétale « pousse comme les bourgeons » est conservée pour refléter l’image hébraïque, tandis que les notes exposent sans la résoudre l’incertitude textuelle.
