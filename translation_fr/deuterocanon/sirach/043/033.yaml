base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/033.yaml
  text: The Lord made everything[a], and to those who fear him he gave wisdom[b]; the praise of the fathers is everlasting.
translation:
  language: fr
  text: Le Seigneur a tout fait et il a donné la sagesse à ceux qui le craignent.[a] La louange des ancêtres d’autrefois.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux personnes pieuses », selon le grec ; l’hébreu dit plus littéralement « à ceux qui le craignent ».
    reason: alternative_reading
  - marker: b
    text: 'Cette formule est absente du grec et peut être le titre ou l’ouverture de la section suivante. L’hébreu non vocalisé permet aussi une lecture impérative : « Célèbre les ancêtres d’autrefois » ; certains comprennent עולם au sens d’« éternelle ».'
    reason: textual_variant
lexical_decisions:
- source_word: את הכל עשה ה'
  choice: Le Seigneur a tout fait
  rationale: Cette formulation rend naturellement l’objet global את הכל et le verbe עשה. « Le Seigneur » restitue ici l’abréviation révérencielle du nom divin et concorde avec le grec ὁ κύριος.
- source_word: וליראיו
  choice: à ceux qui le craignent
  rationale: Le français conserve l’expression théologique hébraïque de la crainte révérencielle de Dieu. Le grec l’interprète par « aux personnes pieuses ».
- source_word: נתן חכמה
  choice: il a donné la sagesse
  rationale: Le passé composé convient à une affirmation récapitulative en français moderne, et « sagesse » préserve le terme majeur חכמה dans le Siracide.
- source_word: שבח אבות עולם
  choice: Célèbre les ancêtres d’autrefois
  rationale: Sans vocalisation, שבח peut se lire comme un impératif, « célèbre / fais l’éloge de ». אבות עולם désigne naturellement les ancêtres des temps anciens. La formule paraît annoncer la section suivante consacrée à leur éloge.
theological_decisions:
- issue: Traduction de ה' dans le Siracide
  choice: Le Seigneur
  alternative: L’Éternel / le SEIGNEUR
  rationale: Le manuscrit emploie une abréviation révérencielle du nom divin, tandis que le parallèle grec porte « le Seigneur ». La traduction choisie demeure digne et immédiatement compréhensible sans imposer une tradition confessionnelle particulière.
- issue: Statut de la formule שבח אבות עולם
  choice: La conserver dans le texte principal comme une exhortation, avec une note textuelle
  alternative: L’omettre comme report du titre de la section suivante, ou traduire « la louange des ancêtres est éternelle »
  rationale: La formule figure dans le témoin hébreu fourni et ne doit donc pas être supprimée silencieusement. Toutefois, son absence du grec et sa ressemblance avec l’ouverture de la section suivante rendent sa place dans ce verset incertaine. La lecture impérative respecte les consonnes hébraïques et donne un sens naturel sans ajouter de verbe « être ».
translation_notes:
  register: Français international moderne, sobre et digne. La première phrase reste fluide et accessible ; « ceux qui le craignent » conserve l’idiome biblique. La seconde phrase est volontairement brève afin de refléter son caractère possible de titre ou de transition.
