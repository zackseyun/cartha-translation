base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/030.yaml
  text: As you exalt the Lord[a], lift up your voice as much as you can, for there is still more.
translation:
  language: fr
  text: Vous qui exaltez le Seigneur, élevez votre voix autant que vous le pouvez, car il y a encore davantage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit : « car il dépasse encore », précisant ainsi que le Seigneur dépasse toute louange. L’hébreu est plus bref : « car il y a encore davantage ».'
    reason: alternative_reading
lexical_decisions:
- source_word: מגדלי ה׳
  choice: Vous qui exaltez le Seigneur
  rationale: Le participe pluriel de גדל désigne ceux qui célèbrent la grandeur du Seigneur. La tournure d’adresse « Vous qui… » restitue naturellement cette forme avant l’impératif pluriel.
- source_word: הרימו קול
  choice: élevez la voix
  rationale: Cette expression concrète appelle à faire entendre la louange. « Élevez la voix » est idiomatique en français moderne et conserve l’image hébraïque.
- source_word: בכל תוכלו
  choice: autant que vous le pouvez
  rationale: La locution exprime toute l’étendue des capacités des personnes interpellées; le parallèle grec confirme ce sens.
- source_word: כי יש עוד
  choice: car il y a encore davantage
  rationale: 'La formulation reste concise et elliptique comme l’hébreu: même la louange la plus intense n’épuise pas ce qui reste à dire, sans expliciter davantage le sujet sous-entendu.'
theological_decisions:
- issue: Degré d’explicitation de la grandeur divine dans la proposition finale
  choice: car il y a encore davantage
  alternative: car il est plus grand encore / car il dépasse encore toute louange
  rationale: Le texte hébreu conservé dit brièvement qu’« il y a encore davantage », tandis que le grec rapporte explicitement ce dépassement au Seigneur. La traduction principale suit l’hébreu et la note signale l’explicitation grecque.
translation_notes:
  register: Français international moderne, direct et digne. L’adresse « Vous qui exaltez » conserve la valeur participiale de l’hébreu, et « élevez la voix » maintient son image sans archaïsme marqué.
