  text: The splendor of the heights is the clear firmament, the appearance of heaven in a vision of glory.
translation:
  language: fr
  text: La puissance des cieux accroît sa splendeur, et l’ensemble obéit pour répondre à chaque besoin. Tous diffèrent les uns des autres, et il n’en a fait aucun qui soit superflu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec transmis pour Siracide 43.1 est très différent : « La fierté des hauteurs, c’est le firmament limpide, l’aspect du ciel dans une vision de gloire. » Le texte hébreu conservé ici présente donc un important écart de contenu ou de délimitation du verset. Le dernier mot hébreu est en outre difficile; « superflu » est une interprétation contextuelle.'
    reason: Signaler honnêtement la divergence entre les témoins hébreu et grec ainsi que l’incertitude lexicale, sans remplacer silencieusement l’un par l’autre.
lexical_decisions:
- source_word: עצם שמים
  choice: la puissance des cieux
  rationale: עצם peut désigner la force, la substance ou l’essence. « Puissance » donne ici un sens naturel tout en conservant l’idée de vigueur propre aux cieux.
- source_word: מרבים הדרו
  choice: accroît sa splendeur
  rationale: Le pluriel hébreu suggère que les cieux sont le sujet collectif; הדרו renvoie à la splendeur ou à la majesté divine.
- source_word: ולכל צרך הכל ישמע
  choice: et l’ensemble obéit pour répondre à chaque besoin
  rationale: ישמע signifie littéralement « écoute » et, dans ce contexte, « obéit »; הכל est rendu collectivement par « l’ensemble ».
- source_word: כלם שונים זה מזה
  choice: Tous diffèrent les uns des autres
  rationale: Rendu direct qui préserve la diversité mutuelle exprimée par זה מזה.
- source_word: שיסוף
  choice: qui soit superflu
  rationale: Le mot ou sa forme textuelle est difficile; le contexte oppose la diversité des œuvres à l’idée qu’une d’elles serait inutile ou de trop.
theological_decisions:
- issue: Référent du possessif dans « sa splendeur »
  choice: Conserver le possessif sans nommer explicitement Dieu
  alternative: « la splendeur de Dieu »
  rationale: L’hébreu emploie simplement le suffixe « sa »; expliciter Dieu résoudrait une référence que le texte laisse implicite.
- issue: Écart majeur avec la tradition grecque
  choice: Traduire le texte hébreu fourni dans le corps du verset
  alternative: 'Suivre le grec: « La splendeur des hauteurs, c’est le firmament limpide… »'
  rationale: La consigne demande de partir d’abord du témoignage dans la langue originale; l’écart de contenu et de numérotation est signalé en note plutôt que gommé.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe reste proche de l’hébreu tout en évitant les tournures opaques. Le terme traditionnel « firmament » n’apparaît que dans la note consacrée au parallèle grec.
