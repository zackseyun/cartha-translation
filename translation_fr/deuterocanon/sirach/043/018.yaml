  text: The appearance of snow dazzles the eyes, and at its falling the heart is amazed.
translation:
  language: fr
  text: L’aspect de la neige[a] éblouit les yeux, et quand elle tombe[b], le cœur frémit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu peut aussi se comprendre comme « la blancheur »; le parallèle grec et le contexte météorologique favorisent « la neige ».
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque, littéralement liée à sa « pluie » ou à son « averse », est difficile dans ce contexte; le grec appuie le sens de la chute ou de la précipitation de la neige.
    reason: textual_variant
  - marker: c
    text: L’hébreu évoque ici un cœur qui gronde ou s’agite, tandis que le grec exprime l’étonnement. En outre, le manuscrit de Massada conserve dans cette section une ligne voisine différente (« et la vue étonne le cœur »), ce qui témoigne d’une certaine instabilité dans l’agencement de ces membres poétiques.
    reason: textual_variant
lexical_decisions:
- source_word: תואר
  choice: aspect
  rationale: Le nom désigne ici ce qui se donne à voir — l’aspect ou la forme — sans réduire le vers à la seule idée abstraite de beauté. Le grec κάλλος souligne néanmoins la splendeur de la scène.
- source_word: לבנה
  choice: neige
  rationale: Le mot hébreu peut signifier « blancheur », mais le contexte météorologique et le parallèle grec χιόνα (« neige ») appuient fortement cette lecture.
- source_word: יגהה עינים
  choice: éblouit les yeux
  rationale: Cette formulation française naturelle rend la vive luminosité qui agit sur les yeux et rejoint l’étonnement visuel exprimé par le grec.
- source_word: ממטרו
  choice: quand elle tombe
  rationale: La forme hébraïque est liée à la pluie ou à l’averse, mais, appliquée à la neige, elle évoque sa précipitation. Cette traduction évite l’expression peu naturelle « sa pluie » tout en conservant le mouvement de descente.
- source_word: יהמה לב
  choice: le cœur frémit
  rationale: Le verbe hébreu évoque le grondement, l’agitation ou le tumulte. « Frémit » conserve cette réaction intérieure vive sans la réduire explicitement à la peur; il reste compatible avec l’émerveillement indiqué par le grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. « Le cœur frémit » garde la vigueur de l’hébreu et laisse ouverte la nature exacte de l’émotion, tandis que les notes signalent les principales difficultés textuelles.
