  text: By his might he directs the lightning[b][a], and he makes the flashes prevail on high.
translation:
  language: fr
  text: Par sa puissance, il trace la voie de l’éclair[b], et fait prévaloir les éclats lumineux là-haut[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec porte : « Sur son ordre, il apaise la neige et il hâte les éclairs de son jugement. » L’hébreu et le grec diffèrent sensiblement dans ce verset.'
    reason: alternative_reading
  - marker: b
    text: Le verbe hébreu est rare et son sens est incertain ici ; il peut signifier « tracer », « diriger » ou « assigner ».
    reason: lexical_alternative
lexical_decisions:
- source_word: גבורתו
  choice: Par sa puissance
  rationale: Le nom désigne la force ou la puissance; «par» exprime naturellement ici le moyen par lequel Dieu agit.
- source_word: תתוה
  choice: il trace la voie de
  rationale: Le verbe, rare et incertain dans ce contexte, peut évoquer l’action de tracer ou de fixer un parcours. Cette formulation conserve l’image hébraïque sans réduire le sens au simple fait de diriger.
- source_word: ברק
  choice: l’éclair
  rationale: Terme hébreu courant désignant l’éclair; le singulier français convient au phénomène pris collectivement.
- source_word: ותנצח
  choice: fait triompher
  rationale: Le verbe נצח exprime l’idée de l’emporter ou de prévaloir. La tournure causative rend le parallélisme comme une action divine exercée sur les phénomènes célestes.
- source_word: זיקות
  choice: les lueurs
  rationale: Le mot peut désigner des étincelles ou des éclats lumineux. «Lueurs» reste poétique et évite de l’identifier trop précisément à de nouveaux éclairs.
- source_word: במרום
  choice: dans les hauteurs
  rationale: Rend le sens locatif de «dans la hauteur, là-haut» dans un français naturel et digne, sans imposer une cosmologie plus précise.
theological_decisions:
- issue: Choix entre le texte hébreu conservé et le parallèle grec sensiblement différent
  choice: Suivre dans le texte principal l’image hébraïque de la puissance divine qui trace la voie de l’éclair et fait prévaloir les lueurs en haut.
  alternative: «Sur son ordre, il apaise la neige et il hâte les éclairs de son jugement.»
  rationale: Puisque l’hébreu est conservé avec une confiance élevée, il constitue ici la base du texte principal. La variante grecque, qui diffère substantiellement, est néanmoins donnée en note plutôt que fondue dans l’hébreu.
translation_notes:
  register: Français international moderne, poétique mais accessible. «Trace la voie» conserve l’image concrète et l’incertitude du verbe hébreu; «dans les hauteurs» maintient le parallélisme céleste sans archaïsme marqué.
