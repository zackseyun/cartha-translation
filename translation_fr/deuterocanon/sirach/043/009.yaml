  text: The splendor of the heavens and the majesty of the stars—its light shines brightly in the heights of God[a][b].
translation:
  language: fr
  text: 'La beauté du ciel et la majesté des étoiles : sa lumière resplendit dans les hauteurs de Dieu[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: À cet endroit, le manuscrit de Massada présente une leçon initiale différente (« … la beauté ou la splendeur du ciel et la majesté d’une étoile »), tandis que le texte de la Guéniza du Caire porte « la beauté du ciel et la majesté des étoiles ». Le texte principal suit ici le texte hébreu de la Guéniza ; le grec appuie le sens collectif.
    reason: textual_variant
  - marker: b
    text: 'Le grec porte : « beauté du ciel, gloire des étoiles, ornement qui répand la lumière, dans les hauteurs, le Seigneur ». Il confirme l’image des astres comme parure lumineuse, mais le texte principal suit la formulation hébraïque conservée. En hébreu, « sa lumière » est grammaticalement au singulier ; le nom « étoile » peut toutefois avoir ici un sens collectif, comme le suggère le grec.'
    reason: alternative_reading
lexical_decisions:
- source_word: תואר
  choice: beauté
  rationale: Dans ce contexte céleste, le terme désigne l’aspect admirable et harmonieux du ciel. « Beauté » est naturel en français et conserve la force poétique du mot.
- source_word: שמים
  choice: ciel
  rationale: Le pluriel morphologique hébreu désigne couramment le ciel. Le singulier collectif est ici le tour français le plus naturel.
- source_word: הדר
  choice: splendeur
  rationale: Le mot exprime une magnificence éclatante. « Splendeur » le distingue de תואר tout en maintenant le registre élevé du verset.
- source_word: כוכב
  choice: étoiles
  rationale: Bien que la forme hébraïque citée soit singulière, elle peut avoir un sens collectif, confirmé par le pluriel ἄστρων du parallèle grec et par le contexte.
- source_word: ואורו
  choice: leur lumière
  rationale: Le suffixe hébreu est singulier, mais il renvoie vraisemblablement à l’ensemble collectif des étoiles ou du spectacle céleste. Le pluriel possessif assure une référence naturelle en français sans imposer l’image d’une seule étoile.
- source_word: מזהיר
  choice: resplendit
  rationale: Le participe évoque l’émission d’une lumière éclatante. « Resplendit » restitue cette intensité sans adverbe ajouté.
- source_word: במרומי אל
  choice: dans les hauteurs de Dieu
  rationale: Cette traduction conserve à la fois l’image spatiale des lieux élevés et la mention explicite de Dieu présente dans אל.
theological_decisions:
- issue: Traduction de אל dans במרומי אל
  choice: de Dieu
  alternative: du Puissant ; dans les hauteurs
  rationale: Le texte hébreu nomme explicitement אל. « Dieu » est la traduction française la plus directe et évite aussi bien d’effacer la référence divine que d’introduire un titre moins évident.
translation_notes:
  register: Français international moderne, poétique et digne. Les deux groupes nominaux sont équilibrés, et les deux-points rendent le mouvement descriptif de l’hébreu sans surcharger la phrase.
