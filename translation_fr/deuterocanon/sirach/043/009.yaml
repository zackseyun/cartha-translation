    issue: Le possessif pluriel « leur » ne reflète pas le suffixe singulier hébreu dans ואורו.
    rationale: Le pluriel est une interprétation possible du référent collectif, mais il résout dans le texte une question que le témoin hébreu laisse au singulier. « Sa lumière » préserve la forme source et l’ambiguïté, la note pouvant signaler le sens collectif probable.
  - severity: low
    issue: « Splendeur » pour הדר affaiblit la différenciation avec le premier terme descriptif.
    rationale: הדר désigne volontiers la majesté, la magnificence ou la gloire. « Majesté » est un équivalent français naturel et plus précis ici, tandis que « beauté » rend déjà תואר.
  - severity: low
