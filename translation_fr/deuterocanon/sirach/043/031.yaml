  text: Who has seen him and can describe him? And who can magnify him as he is?[a]
translation:
  language: fr
  text: Qui l’a vu et peut le décrire ? Qui peut le magnifier tel qu’il est ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu conservé dans les manuscrits de la Guéniza du Caire diverge ici et semble ne pas correspondre au contexte. Il dit littéralement : « Les hauteurs renouvellent leur force ; ne vous fatiguez pas, car vous ne les sonderez pas. » Le grec porte plutôt : « Qui l’a vu et peut le décrire ? Qui peut le magnifier tel qu’il est ? » Le texte principal suit le grec, qui s’accorde avec le contexte.'
    reason: textual_variant
lexical_decisions:
- source_word: τίς ἑόρακεν αὐτόν
  choice: Qui l’a vu
  rationale: Le parfait grec exprime le fait d’avoir vu. Cette formulation est naturelle en français moderne et conserve la question rhétorique.
- source_word: ἐκδιηγήσεται
  choice: pourrait le décrire
  rationale: Le verbe évoque un récit ou une description menée en détail. « Décrire » rend clairement l’idée dans ce contexte, tandis que le conditionnel souligne l’incapacité implicite sans la transformer en affirmation explicite.
- source_word: μεγαλυνεῖ
  choice: pourrait le magnifier
  rationale: « Magnifier » conserve le sens d’exalter et de proclamer la grandeur de Dieu, ainsi que la tonalité cultuelle du passage.
- source_word: καθὼς ἐστιν
  choice: tel qu’il est
  rationale: Cette expression concise préserve l’idée d’une louange qui serait à la mesure de ce que Dieu est réellement.
- source_word: מרומים החליפו כח ואל תלאו, כי לא תחקרו
  choice: variante signalée en note
  rationale: La ligne hébraïque conservée diverge fortement et semble déplacée dans ce contexte. Elle est donc documentée en note plutôt que combinée artificiellement avec le texte grec cohérent.
theological_decisions:
- issue: Divergence entre l’hébreu conservé et le parallèle grec
  choice: Le texte principal suit le grec, qui parle de l’impossibilité de voir, décrire et magnifier Dieu à la mesure de ce qu’il est.
  alternative: 'Traduire littéralement l’hébreu conservé : « Les hauteurs renouvellent leur force et ne se fatiguent pas, car vous ne pourrez pas les sonder. »'
  rationale: Le témoin hébreu fourni est explicitement marqué comme présentant une légère discordance et sa ligne paraît ne pas correspondre au contexte. Le grec offre ici une suite cohérente au discours sur la grandeur insondable de Dieu. La note maintient néanmoins la transparence textuelle.
translation_notes:
  register: Français international moderne, digne et accessible. Les deux questions rhétoriques sont conservées. « Magnifier » est légèrement soutenu, mais reste approprié au registre sapientiel et cultuel.
