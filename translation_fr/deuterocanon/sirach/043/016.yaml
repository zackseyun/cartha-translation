  text: At the sound of his thunder the earth writhes[b][a]; the blasts of the north are storm and tempest.
translation:
  language: fr
  text: Au grondement de son tonnerre, la terre se tord[b] ; les rafales du nord sont tourmente et tempête.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle porte : « À son apparition, les montagnes seront ébranlées ; par sa volonté, le vent du sud soufflera. » Il diffère considérablement de l’hébreu conservé, dont le second membre parle des rafales du nord comme de tourmente et de tempête.'
    reason: alternative_reading
  - marker: b
    text: Le verbe hébreu rendu par « se tord » peut aussi signifier « tremble » ou « est secouée » ; il suggère un mouvement convulsif, parfois associé aux douleurs de l’enfantement.
    reason: lexical_alternative
lexical_decisions:
- source_word: קול רעמו
  choice: au grondement de son tonnerre
  rationale: קול désigne ici le bruit perceptible du tonnerre. « Grondement » rend naturellement sa puissance sonore, tandis que « son tonnerre » conserve le suffixe possessif qui rapporte le phénomène à Dieu.
- source_word: יחיל
  choice: se tord
  rationale: Le verbe חול/חיל peut évoquer le tremblement, la convulsion ou les douleurs de l'enfantement. « Se tord » garde cette image corporelle vive sans imposer explicitement celle de l'accouchement.
- source_word: ארצו
  choice: la terre
  rationale: Le suffixe possessif peut donner littéralement « sa terre », mais « la terre » est plus naturel en français dans cet hymne cosmique et évite le sens plus restreint de « son pays ».
- source_word: זלעפות צפון
  choice: les rafales du nord
  rationale: זלעפות évoque des souffles violents ou furieux. « Rafales » convient au contexte météorologique, et צפון est rendu explicitement par « du nord ».
- source_word: סופה
  choice: tourmente
  rationale: Le mot désigne une violente tempête, voire un tourbillon. « Tourmente » exprime la violence du phénomène tout en permettant de distinguer les deux termes hébreux voisins.
- source_word: וסערה
  choice: et tempête
  rationale: סערה appartient au vocabulaire de l'orage, de la tempête et du tourbillon. « Tempête » est clair et actuel, et préserve l'accumulation poétique avec סופה.
theological_decisions:
- issue: Suffixes possessifs dans l'imagerie météorologique
  choice: Conserver « son » avec le tonnerre, mais rendre ארצו par « la terre ».
  alternative: « Au grondement de son tonnerre, sa terre se tord » ou « son pays tremble ».
  rationale: Le premier suffixe souligne que le tonnerre appartient à l'action de Dieu dans le contexte. Répéter le possessif devant « terre » serait moins naturel et pourrait suggérer un territoire particulier plutôt que le monde créé.
- issue: Divergence majeure entre l'hébreu et le grec
  choice: Suivre dans le texte principal l'hébreu conservé, qui parle des rafales du nord, de la tourmente et de la tempête.
  alternative: Le grec parle de montagnes ébranlées à l'apparition de Dieu et du vent du sud soufflant selon sa volonté.
  rationale: L'hébreu extant est le témoin source prioritaire du projet. La tradition grecque transmet toutefois ici un texte substantiellement différent, qui doit être conservé en note sans harmonisation.
translation_notes:
  register: Français international moderne, poétique et digne. Le rythme en deux membres et l'accumulation météorologique de l'hébreu sont conservés. Les marqueurs de notes suivent les expressions auxquelles ils se rapportent.
