  text: From them come the appointed time and the fixed seasons by statute[b][a], and the work he desired is in its cycle.
translation:
  language: fr
  text: C’est par eux que viennent le temps fixé et les périodes établies par décret ; l’œuvre qu’il a voulue suit son cycle.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu du second membre est difficile. Le texte de la Gueniza du Caire se lit approximativement : « et la chose ou l’œuvre voulue… dans son cycle ». Le grec porte : « De la lune vient le signe d’une fête, luminaire qui décroît jusqu’à son terme. »'
    reason: alternative_reading
  - marker: b
    text: 'Le manuscrit de Massada porte : « car grand est le Seigneur qui l’a faite », là où le texte de la Gueniza du Caire présente une formulation différente et plus difficile.'
    reason: textual_variant
lexical_decisions:
- source_word: בם
  choice: C’est par eux que viennent
  rationale: La préposition ב peut signifier « en » ou « par ». Dans cette formulation poétique condensée, elle présente les astres évoqués dans le contexte comme les moyens par lesquels les repères du calendrier sont déterminés. Cette traduction garde le pluriel hébreu sans le réduire explicitement à la lune.
- source_word: מועד
  choice: le temps fixé
  rationale: מועד peut désigner un moment fixé, un rendez-vous ou une fête. Le sens calendérique général convient ici, tandis que le parallèle grec atteste plus précisément la fête.
- source_word: וזמני חוק
  choice: les périodes établies par décret
  rationale: זמנים désigne des temps ou périodes, et חוק ce qui est fixé ou prescrit. La formulation française exprime à la fois l’ordre temporel et son caractère établi.
- source_word: וחפץ עשיו
  choice: l’œuvre qu’il a voulue
  rationale: Le texte consonantique transmis est obscur. Cette formulation rend prudemment l’idée d’une réalité ou œuvre voulue, sans prétendre résoudre avec certitude la morphologie difficile de עשיו.
- source_word: בתקופתו
  choice: suit son cycle
  rationale: תקופה désigne un tour, un circuit ou un cycle. Dans ce contexte astronomique, « cycle » convient au mouvement récurrent ; le verbe « suit » donne une phrase française naturelle tout en exprimant l’inscription de l’œuvre dans ce cycle.
theological_decisions:
- issue: Sujet et portée théologique du second membre
  choice: Le texte évoque de manière générale l’œuvre voulue dans l’ordre cyclique des astres.
  alternative: Le membre peut viser plus précisément la lune comme luminaire signalant les fêtes, selon le grec ; une variante de Massada paraît plutôt célébrer le Seigneur qui l’a faite.
  rationale: Le texte hébreu de la Gueniza est difficile et ne permet pas de trancher sûrement. Le corps du verset conserve donc une formulation générale, tandis que les notes signalent les autres témoins sans imposer une lecture doctrinale plus précise.
translation_notes:
  register: Français international actuel, sobre et poétique. « Temps fixé » et « périodes établies par décret » gardent le parallélisme calendérique ; la seconde proposition demeure volontairement prudente en raison de l’état du texte hébreu.
