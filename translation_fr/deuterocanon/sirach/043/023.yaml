  text: By his plan he stilled the deep[b][a], and planted islands in it.
translation:
  language: fr
  text: Par son dessein, il apaisa l’abîme[a] et y planta des îles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu est difficile ici. Le grec porte : « Par son raisonnement, il apaisa l’abîme et le planta. » La dernière expression est elle aussi difficile ; elle éclaire néanmoins le sens d’« apaisa l’abîme » et soutient l’image d’îles établies en son sein.'
    reason: textual_variant
  - marker: b
    text: Ou « des régions côtières ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מחשבתו
  choice: son dessein
  rationale: Le nom hébreu désigne la pensée, l’intention ou le projet. « Dessein » exprime ici une intention créatrice efficace et correspond aussi au grec λογισμῷ αὐτοῦ.
- source_word: משיק
  choice: apaisa
  rationale: La forme hébraïque est difficile. Le grec ἐκόπασεν indique l’idée de faire cesser ou de calmer; « apaisa » rend naturellement cette action sur les profondeurs.
- source_word: רבה
  choice: les profondeurs
  rationale: La lecture hébraïque est incertaine, tandis que le grec porte ἄβυσσον, « abîme, profondeurs ». Le pluriel français conserve l’imagerie cosmologique sans imposer une personnification.
- source_word: ויט
  choice: planta
  rationale: Le verbe semble évoquer l’action de placer ou planter, et le grec ἐφύτευσεν confirme explicitement la métaphore de la plantation.
- source_word: בתהום
  choice: y
  rationale: L’adverbe reprend naturellement « les profondeurs » et rend l’idée de localisation contenue dans la préposition hébraïque.
- source_word: איים
  choice: des îles
  rationale: איים peut désigner des îles ou des régions côtières. Dans cette scène cosmologique, « îles » donne le sens concret le plus probable, tout en signalant l’autre possibilité en note.
theological_decisions:
- issue: Tension textuelle entre l’hébreu difficile et le parallèle grec plus clair
  choice: 'Traduire d’abord l’hébreu conservé, en utilisant le grec pour éclairer le verbe obscur et stabiliser l’image: « il apaisa les profondeurs et y planta des îles ».'
  alternative: Par sa pensée, il calma l’abîme et y établit des régions côtières.
  rationale: L’hébreu demeure prioritaire, mais son état difficile justifie le recours au témoin grec. La note rend cette incertitude visible sans résoudre silencieusement la tension textuelle.
translation_notes:
  register: Français international moderne, digne et accessible. « Dessein » maintient une légère élévation poétique adaptée au contexte sapientiel; « apaisa » et « planta » gardent la vigueur de l’imagerie cosmologique.
