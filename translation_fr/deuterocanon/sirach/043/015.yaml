  text: By his power he gives strength to the clouds[b][a], to cast down hailstones.
translation:
  language: fr
  text: Par sa puissance, il donne au nuage[b] la force de précipiter des grêlons.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'À Massada, seul le début du verset est conservé : « Par sa puissance, le nuage est fort. » Le texte hébreu de la Guéniza du Caire poursuit avec les grêlons; le grec confirme également cette image.'
    reason: textual_variant
  - marker: b
    text: L’hébreu porte « le nuage » au singulier; le texte grec parallèle emploie « les nuages » au pluriel. La traduction suit ici le témoin hébreu principal.
    reason: alternative_reading
lexical_decisions:
- source_word: בכחו
  choice: Par sa puissance
  rationale: La préposition ב exprime ici naturellement le moyen; « par sa puissance » rend clairement cette valeur instrumentale en français.
- source_word: יתן
  choice: il donne
  rationale: נתן signifie d’abord « donner »; cette traduction conserve l’image selon laquelle Dieu communique une force au nuage.
- source_word: לענן
  choice: au nuage
  rationale: Le texte hébreu porte le singulier. Le singulier générique est naturel en français et maintient la priorité du témoin hébreu, malgré le pluriel du grec.
- source_word: עז
  choice: la force
  rationale: עז désigne la force ou la puissance. « La force » s’intègre naturellement à la construction française « donner… la force de ».
- source_word: להשליך
  choice: de précipiter
  rationale: L’infinitif exprime le but ou l’effet de la force donnée. « Précipiter » conserve l’idée d’un jet violent vers le bas sans employer une tournure artificielle.
- source_word: אבני אלגביש
  choice: des grêlons
  rationale: L’expression hébraïque évoque littéralement des « pierres de grêle »; « grêlons » en est l’équivalent français naturel et concret.
