  text: For this reason he created the storehouse[b][a], and made the clouds fly like birds.
translation:
  language: fr
  text: 'C’est pourquoi il créa une réserve[a][b]

    et fit voler les nuages comme des oiseaux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte littéralement « il créa une réserve » ; le grec lit plutôt « les réserves furent ouvertes », leçon qui convient également au contexte météorologique.
    reason: textual_variant
  - marker: b
    text: Ce verset repose principalement sur les manuscrits hébreux de la Guéniza du Caire ; le témoin de Massada ne le conserve pas clairement. Le grec sert ici de parallèle ancien.
    reason: cross_reference
lexical_decisions:
- source_word: למען
  choice: C’est pourquoi
  rationale: Dans ce contexte poétique, l’expression marque une conséquence ou un lien causal, comme le confirme le grec διὰ τοῦτο. « C’est pourquoi » est naturel en français moderne.
- source_word: ברא
  choice: il créa
  rationale: La lecture directe des consonnes hébraïques donne le verbe « créer ». La leçon grecque « furent ouvertes » est suffisamment importante pour être signalée en note sans remplacer silencieusement le témoin hébreu principal.
- source_word: אוצר
  choice: une réserve
  rationale: Le nom désigne un lieu où des biens sont amassés, ici vraisemblablement une réserve céleste liée aux phénomènes météorologiques. Le singulier respecte la forme hébraïque.
- source_word: ויעף
  choice: fit voler
  rationale: 'Cette tournure causative conserve l’image vive du texte hébreu : Dieu met les nuages en mouvement comme des êtres ailés.'
- source_word: עבים
  choice: les nuages
  rationale: Le terme peut évoquer des nuages épais ou chargés de pluie, mais « les nuages » rend le sens sans ajouter une précision incertaine.
- source_word: כצפרים
  choice: comme des oiseaux
  rationale: Cette traduction directe et idiomatique préserve la comparaison poétique.
theological_decisions:
- issue: Lecture du verbe hébreu ברא à la lumière du parallèle grec
  choice: Traduire le texte hébreu par « il créa »
  alternative: « les réserves furent ouvertes » selon le grec
  rationale: Le témoin hébreu conservé porte les consonnes correspondant naturellement à « il créa », tandis que le grec atteste une lecture nettement différente et contextuellement plausible. Le texte principal suit donc l’hébreu, et la note préserve la variante sans trancher artificiellement la tension textuelle.
translation_notes:
  register: Français international moderne, poétique et digne. Le passé simple convient à la formulation sapientielle concise. La mise en deux lignes souligne le parallélisme sans modifier la syntaxe.
