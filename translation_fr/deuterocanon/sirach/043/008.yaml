  terminology: « Armée d’en haut » conserve l’image de צבא et de מרום sans imposer « armée céleste » comme paraphrase. « Étendue du ciel » rend sobrement רקיע. « Instrument » est acceptable pour כלי et évite de décider entre objet, ustensile et arme.
