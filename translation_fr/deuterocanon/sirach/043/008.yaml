base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/008.yaml
  text: Month by month it renews itself—how awe-inspiring it is in its changing! A vessel of the host on high[c][b][a], from the expanse of the sky is its shining.
translation:
  language: fr
  text: 'De mois en mois[a], elle se renouvelle : comme elle est saisissante lorsqu’elle change ! Instrument de l’armée d’en haut[c][b], son éclat vient de l’étendue du ciel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Parallèle grec : « Mois après mois, selon son nom, elle croît merveilleusement dans sa transformation. » Cette formulation reflète un texte ou une interprétation différente de l’hébreu conservé : « De mois en mois, elle se renouvelle. »'
    reason: alternative_reading
  - marker: b
    text: La seconde moitié du verset est difficile et le texte est probablement incertain. Un manuscrit de Massada présente une formulation apparentée, mais différente ; le sens général associe la lune à l’armée d’en haut et à l’éclat du ciel.
    reason: textual_variant
  - marker: c
    text: 'Autre compréhension possible de l’expression hébraïque inhabituelle : « harpe des hauteurs ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חדש בחדשו הוא מתחדש
  choice: De mois en mois, elle se renouvelle
  rationale: Le redoublement de la racine חדש et la forme בחדשו expriment ici le renouvellement périodique de la lune. La tournure française garde la valeur temporelle et le sens réfléchi.
- source_word: מה נורא בהשתנותו
  choice: combien elle inspire le respect dans ses changements
  rationale: נורא désigne ce qui suscite crainte ou révérence. « Inspire le respect » restitue cette force sans suggérer principalement la terreur; le pluriel « changements » évoque naturellement les phases lunaires.
- source_word: כלי צבא נבלי מרום
  choice: Instrument de l’armée d’en haut
  rationale: כלי peut désigner un objet, un instrument ou une arme, et צבא une armée ou une troupe céleste. La suite est difficile; cette traduction conserve l’image cosmique et militaire sans imposer la lecture incertaine « harpe des hauteurs ».
- source_word: מרצף רקיע מזהירתו
  choice: son éclat vient de l’étendue du ciel
  rationale: La syntaxe et מרצף sont obscurs. « Étendue du ciel » rend רקיע dans un français courant, tandis que « son éclat vient de » restitue prudemment l’idée générale de la proposition elliptique.
theological_decisions:
- issue: Priorité du texte hébreu face au parallèle grec
  choice: Suivre le texte hébreu conservé pour le renouvellement mensuel de la lune.
  alternative: 'Suivre le grec : « Le mois porte son nom; elle croît merveilleusement dans ses transformations. »'
  rationale: L’hébreu est le témoin principal ici et répète clairement la racine חדש. Le grec paraît refléter une autre formulation ou interprétation; il est signalé en note plutôt qu’introduit dans le texte.
- issue: Interprétation de la seconde moitié textuellement difficile
  choice: Conserver une formulation prudente évoquant un instrument de l’armée céleste et l’éclat venu du ciel.
  alternative: Traduire נבלי מרום comme « harpe des hauteurs » ou lisser l’ensemble en « elle appartient à l’armée céleste ».
  rationale: Le passage hébreu est incertain. La traduction évite d’effacer son imagerie tout en refusant de transformer une solution lexicale conjecturale en affirmation certaine.
translation_notes:
  register: Français international moderne, poétique et digne. Le féminin renvoie à la lune, explicitée par le contexte. Les images obscures sont conservées autant que possible, avec les principales incertitudes placées en notes.
