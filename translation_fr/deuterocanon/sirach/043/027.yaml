base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/027.yaml
  text: 'We could say more than these[a], but there would be no end[b]; and the conclusion of the matter is: all is he.'
translation:
  language: fr
  text: 'Nous pourrions en dire bien d’autres[a], sans jamais en venir à bout ; en conclusion : il est le tout[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Nous pourrions dire encore bien des choses sans jamais arriver au bout. » Le parallèle grec explicite l’idée que même un long discours n’épuiserait pas le sujet.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « il est tout » ou « il est toute chose ». L’hébreu est très concis, et le parallèle grec confirme le sujet personnel : « lui-même est le tout ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוד כאלה
  choice: en ajouter encore de semblables
  rationale: L’expression désigne d’autres réalités du même genre que celles qui viennent d’être évoquées. « Encore » et « de semblables » conservent ensemble la valeur additive et comparative de l’hébreu.
- source_word: לא נוסף
  choice: sans jamais en finir
  rationale: Pris isolément, l’hébreu est elliptique et peut évoquer ce qu’on ne cesserait d’ajouter. Le parallèle grec explicite l’idée d’un discours qui ne parvient pas au terme du sujet.
- source_word: וקץ דבר
  choice: mais pour conclure
  rationale: קץ exprime la fin ou la conclusion, et דבר la parole, le propos ou l’affaire. Cette formulation française naturelle marque la récapitulation finale sans alourdir la phrase.
- source_word: הוא הכל
  choice: il est le tout
  rationale: Cette traduction conserve l’affirmation personnelle et très concise de l’hébreu. « Le tout » rend הכל plus formellement que « tout » ou « toute chose » et préserve la tension théologique du texte.
theological_decisions:
- issue: Portée théologique de la proposition finale
  choice: il est le tout
  alternative: il est tout / il est toute chose
  rationale: L’hébreu formule une identification doxologique compacte, et le grec confirme le sujet personnel. La traduction ne développe pas cette parole en explication métaphysique et ne réduit pas non plus sa force totalisante.
translation_notes:
  register: Français international moderne, digne et lisible. Le rythme conserve le caractère conclusif de l’énoncé, tandis que « il est le tout » maintient volontairement sa densité et son ambiguïté théologique.
