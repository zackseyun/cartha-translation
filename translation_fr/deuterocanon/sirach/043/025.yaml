base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/025.yaml
  text: There are the wonders of his marvelous works[a], every kind of living thing, and the great sea-creatures.
translation:
  language: fr
  text: Là se trouvent des merveilles, les œuvres étonnantes qu’il accomplit, toutes sortes d’êtres vivants et les grands animaux marins[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La dernière expression de l’hébreu est difficile; elle peut évoquer de grandes puissances ou de grands êtres puissants. Le grec parallèle lit « création des monstres marins », ce qui indique probablement le sens visé.
    reason: alternative_reading
lexical_decisions:
- source_word: שם
  choice: Là se trouvent
  rationale: שם signifie littéralement « là ». La tournure existentielle française rend naturellement la proposition nominale tout en conservant sa valeur locative; le grec ἐκεῖ la confirme.
- source_word: פלאות תמהי מעשהו
  choice: les merveilles de ses œuvres étonnantes
  rationale: פלאות désigne des merveilles, תמהי exprime l’étonnement, et מעשהו renvoie à ce que Dieu accomplit ou crée. Le pluriel « œuvres » convient au sens collectif et au contexte.
- source_word: מין כל חי
  choice: toutes sortes d’êtres vivants
  rationale: Cette formulation naturelle conserve l’idée classificatoire de מין et l’étendue de כל חי. Le grec ποικιλία παντὸς ζῴου va dans le même sens.
- source_word: וגבורות רבה
  choice: les grands animaux marins
  rationale: La fin du texte hébreu transmis est difficile et évoque littéralement des puissances ou êtres puissants et grands. Le parallèle grec κτίσις κητῶν et le contexte maritime indiquent vraisemblablement de grands animaux de la mer.
theological_decisions:
- issue: Recours au parallèle grec pour éclairer la dernière expression hébraïque difficile
  choice: Comprendre la dernière expression comme une référence aux grands animaux marins
  alternative: « de grandes puissances » ou « de nombreux êtres puissants »
  rationale: L’hébreu est comprimé et incertain, tandis que le grec mentionne explicitement la création des grands animaux marins. Le texte principal adopte ce sens contextuellement probable, et la note préserve l’incertitude de l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. « Là se trouvent » préserve le mouvement locatif du contexte; « êtres vivants » reste général, tandis que « grands animaux marins » évite le ton mythologique de « monstres marins ».
