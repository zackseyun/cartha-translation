  source_fidelity: La première expression hébraïque juxtapose « merveilles » et « son œuvre » plutôt qu’elle ne formule clairement « les merveilles de ses œuvres étonnantes ». Le singulier de מעשהו est mieux préservé par « son œuvre », compris collectivement. La fin hébraïque demeure difficile; « grands animaux marins » est une interprétation contextuellement bien appuyée par le grec κτίσις κητῶν, à condition que la note formule précisément l’écart textuel.
  naturalness: « Là se trouvent les merveilles de son œuvre, œuvre étonnante » serait lourd. La coordination « des merveilles et les œuvres étonnantes qu’il accomplit » est naturelle, mais explicite légèrement la relation. Une formulation appositionnelle sobre conserve mieux le caractère concis du texte.
