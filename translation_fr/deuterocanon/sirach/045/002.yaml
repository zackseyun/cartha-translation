  terminology: « Honora » rend précisément le piel de כבד sans renforcer indûment le sens en « glorifia ». « Fortifia » rend היטב le factitif de אמץ. « Les hauteurs » préserve la portée spatiale et possiblement céleste de במרומים. Dans la variante grecque, « saints » est maintenu pour ἅγιοι, sans identifier ces derniers plus précisément.
