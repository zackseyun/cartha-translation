  source_fidelity: 'Le texte principal suit fidèlement l''hébreu conservé : ויכבדהו אלהים, ויאמצהו במרומים, « Dieu l''honora et le fortifia dans les hauteurs ». La note signale à juste titre la divergence substantielle du grec. Sa formulation grecque est cependant trop interprétative dans « les terreurs qu''il inspirait aux ennemis » : le grec dit littéralement « dans les terreurs des ennemis » et ne précise pas que Moïse en est la cause.'
