  text: God honored him[a], and strengthened him in the heights.
translation:
  language: fr
  text: Dieu l’honora[a] et le fortifia dans les hauteurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente une lecture plus développée : « Il le rendit semblable à la gloire des saints et le grandit parmi les terreurs de ses ennemis. » L’hébreu porte plutôt : « Dieu l’honora et le fortifia dans les hauteurs. »'
    reason: textual_variant
lexical_decisions:
- source_word: ויכבדהו
  choice: lui accorda de l’honneur
  rationale: Le piel de כבד exprime ici l’action d’honorer, de conférer de l’honneur. Cette formulation est naturelle en français et évite le sens potentiellement plus fort de « glorifia ».
- source_word: אלהים
  choice: Dieu
  rationale: Le contexte désigne clairement le Dieu unique comme sujet.
- source_word: ויאמצהו
  choice: le fortifia
  rationale: 'Le verbe אמץ a ici une valeur factitive : rendre fort, fortifier. « Le fortifia » restitue directement cette force verbale.'
- source_word: במרומים
  choice: dans les hauteurs
  rationale: מרומים désigne les hauteurs ou les lieux élevés. La traduction conserve l’image spatiale et laisse ouverte une éventuelle portée céleste ou honorifique.
theological_decisions:
- issue: Divergence majeure entre les témoins hébreu et grec
  choice: 'Suivre dans le texte principal l’hébreu conservé : « Dieu lui accorda de l’honneur et le fortifia dans les hauteurs. »'
  alternative: 'Le grec porte : « Il le rendit semblable à la gloire des saints et le grandit par les terreurs qu’il inspirait aux ennemis. »'
  rationale: Le témoin hébreu, ici conservé avec un degré élevé de confiance, est prioritaire. La lecture grecque est toutefois substantiellement différente et doit être signalée plutôt que harmonisée ou omise.
translation_notes:
  register: Français moderne, international et digne. « Accorda de l’honneur » est plus idiomatique que « honora » dans cette construction tout en restant proche de l’hébreu. « Dans les hauteurs » préserve volontairement l’ambiguïté de l’expression hébraïque.
