base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/015.yaml
  text: Moses ordained him and anointed him with holy oil[a]. It became for him an everlasting covenant, and for his offspring[c][b], for as long as the heavens endure.
translation:
  language: fr
  text: Moïse l’établit dans sa charge sacerdotale et l’oignit d’huile sainte[a]. Ce fut pour lui une alliance éternelle, ainsi que pour sa descendance[c], aussi longtemps que les cieux subsisteront[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « remplit sa main », expression sacerdotale signifiant qu’une personne est installée ou investie dans sa charge. Le grec dit de même « remplit les mains ».
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement « comme les jours des cieux » : cette expression évoque une durée qui se prolonge autant que les cieux.'
    reason: lexical_alternative
  - marker: c
    text: 'Le texte grec se poursuit au-delà de l’hébreu conservé ici : « pour le servir et exercer le sacerdoce, et pour bénir son peuple en son nom ». Le texte principal suit l’hébreu conservé, qui constitue ici le témoin prioritaire.'
    reason: alternative_reading
lexical_decisions:
- source_word: וימלא ... את ידו
  choice: l’investit de sa charge
  rationale: L’expression hébraïque « remplir la main » est une formule technique désignant l’installation dans la charge sacerdotale. Une traduction littérale serait obscure en français. « L’investit de sa charge » en exprime naturellement le sens sans confondre cette installation avec l’onction mentionnée ensuite. Le grec conserve lui aussi l’image des mains remplies.
- source_word: וימשחהו
  choice: lui donna l’onction
  rationale: Le verbe משח désigne directement l’action d’oindre. Cette formulation française garde le caractère rituel de l’acte et correspond au grec ἔχρισεν.
- source_word: בשמן הקדש
  choice: avec l’huile sainte
  rationale: La formulation rend simplement la matière consacrée employée pour l’onction. L’article défini convient naturellement au contexte rituel en français.
- source_word: ברית עולם
  choice: une alliance éternelle
  rationale: L’expression indique une alliance durable et correspond au grec διαθήκην αἰώνιον. « Alliance éternelle » est une formulation biblique claire et actuelle en français.
- source_word: ולזרעו
  choice: ainsi que pour sa descendance
  rationale: זרע est un singulier collectif qui désigne ici les descendants. « Descendance » conserve cette valeur collective dans un français naturel.
- source_word: כימי שמים
  choice: aussi longtemps que les cieux subsisteront
  rationale: Littéralement, l’hébreu dit « comme les jours des cieux ». La traduction explicite la valeur temporelle de cette expression tout en conservant son image cosmique.
theological_decisions:
- issue: Portée de la promesse d’alliance dans le contexte sacerdotal
  choice: Présenter l’alliance comme accordée à Aaron et à sa descendance pour une durée exprimée en termes cosmiques.
  alternative: Affirmer explicitement une prêtrise absolument perpétuelle, ou limiter la promesse à la seule vie d’Aaron.
  rationale: L’hébreu rattache l’alliance à Aaron et à sa descendance et en souligne la durée, sans développer davantage ses implications doctrinales. La traduction conserve cette affirmation sans l’élargir ni la réduire.
- issue: Rendu de l’expression technique « remplir la main »
  choice: Traduire par « l’investit de sa charge » dans le texte principal.
  alternative: Traduire littéralement par « remplit sa main », ou employer « le consacra » ou « l’ordonna ».
  rationale: Le sens institutionnel et sacerdotal doit être intelligible en français. « L’investit de sa charge » évite aussi que la première action soit confondue avec l’onction explicitement mentionnée juste après.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire rituel reste précis sans archaïsme. La tournure « l’investit de sa charge » rend l’idiome sacerdotal de façon claire, tandis que la note en conserve la forme littérale. Les marqueurs [a], [b] et [c] figurent tous dans le texte principal.
