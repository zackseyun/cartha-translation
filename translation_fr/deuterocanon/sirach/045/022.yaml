  text: But in their land he will not inherit[a], and among them he will not be allotted an inheritance; the offerings of Yahweh are his portion and his inheritance among the sons of Israel.
translation:
  language: fr
  text: Mais il ne recevra pas d’héritage sur leur territoire[a], et aucune part d’héritage ne lui sera attribuée parmi eux ; les offrandes faites au SEIGNEUR sont sa part et son héritage parmi les fils d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte à la fin du verset : « car lui-même est ta part, ton héritage ». Il reflète une forme du texte différente de l’hébreu conservé, qui dit : « Les offrandes faites au SEIGNEUR sont sa part et son héritage. »'
    reason: alternative_reading
lexical_decisions:
- source_word: אך
  choice: Mais
  rationale: Introduit le contraste avec le don précédemment accordé à Aaron et à ses descendants, sans accentuation excessive.
- source_word: בארצם
  choice: dans leur pays
  rationale: Désigne le territoire appartenant à Israël. « Pays » est ici naturel en français, tandis que le contexte d’héritage conserve la dimension territoriale.
- source_word: לא ינחל
  choice: il ne recevra pas d’héritage
  rationale: Exprime naturellement en français le verbe נחל et l’idée que la lignée sacerdotale représentée par Aaron ne recevra pas de possession territoriale.
- source_word: לא יחלק נחלה
  choice: aucune part d’héritage ne lui sera attribuée
  rationale: Rend le sens contextuellement passif d’une part territoriale qui ne lui est pas assignée parmi Israël; le parallèle grec le confirme.
- source_word: אשי יהוה
  choice: Les offrandes faites au SEIGNEUR
  rationale: אשי désigne les offrandes sacrificielles, souvent offertes par le feu. Cette formulation reste lisible sans réduire indûment le terme aux seuls holocaustes.
- source_word: חלקו ונחלתו
  choice: sa part et son héritage
  rationale: Conserve le couple juridique et cultuel du texte hébreu.
- source_word: בתוך בני ישראל
  choice: au milieu des fils d’Israël
  rationale: Reproduit l’expression hébraïque et son sens collectif, avec un registre biblique encore intelligible en français moderne.
theological_decisions:
- issue: La clause finale diffère entre l’hébreu conservé et le parallèle grec.
  choice: 'Suivre l’hébreu : les offrandes faites au SEIGNEUR constituent sa part et son héritage.'
  alternative: 'Selon le grec : « car lui-même est ta part, ton héritage », ce qui identifie directement le Seigneur comme la part.'
  rationale: L’hébreu de Ben Sira est ici conservé et constitue la source principale. La variante grecque est néanmoins théologiquement significative et doit être signalée plutôt que résolue silencieusement.
translation_notes:
  register: Français international moderne, naturel et digne. Le futur est conservé dans la première proposition; la seconde est formulée passivement pour expliciter l’attribution d’une part territoriale. « SEIGNEUR » rend le tétragramme יהוה.
