  source_fidelity: 'Le sens de l’hébreu est bien représenté : absence d’héritage territorial et part sacerdotale constituée par les offrandes de YHWH. La formulation révisée rend plus explicitement la valeur territoriale de בארצם et conserve la tournure passive contextuelle pour « aucune part d’héritage ne lui sera attribuée ».'
  naturalness: La suppression de la virgule après « Mais » et le remplacement de « au milieu des fils d’Israël » par « parmi les fils d’Israël » améliorent la fluidité en français moderne sans perdre la coloration biblique. « Sur leur territoire » est plus idiomatique et plus précis que « dans leur pays » dans un contexte d’attribution foncière.
  terminology: « Offrandes faites au SEIGNEUR » rend de façon recevable אשי יהוה, terme cultuel susceptible de désigner les offrandes par le feu. « Part » et « héritage » maintiennent le couple technique du texte. La note signale correctement que le grec atteste une clause finale divergente et ne doit pas être incorporée sans indication au texte principal.
