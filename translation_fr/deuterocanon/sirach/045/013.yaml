  text: Before him there had not been such garments[a], and no foreigner will ever wear them; only his sons and his descendants throughout their generations.
translation:
  language: fr
  text: Avant lui, il n’y avait jamais eu de tels vêtements[a], et jamais aucun étranger ne les portera ; seuls ses fils et ses descendants les porteront, de génération en génération.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La seconde moitié du verset est difficile dans l’hébreu transmis. On pourrait la rendre approximativement : « Il lui a confié ou confirmé cela, ainsi qu’à ses fils ; il en sera de même pour ses fils, de génération en génération. » Le parallèle grec exprime explicitement l’idée qu’aucun étranger ne les portera et que ce privilège est réservé aux fils d’Aaron et à ses descendants.'
    reason: Signaler l’incertitude de l’hébreu tout en indiquant que le parallèle grec soutient la compréhension contextuelle du texte principal, sans supprimer l’ambiguïté.
lexical_decisions:
- source_word: לפניו
  choice: Avant lui
  rationale: Le contexte et le grec πρὸ αὐτοῦ indiquent une antériorité temporelle par rapport à Aaron.
- source_word: לא היה כן
  choice: il n’y avait jamais eu de tels
  rationale: Cette formulation française exprime naturellement l’absence de vêtements comparables auparavant, tout en gardant la concision de l’hébreu.
- source_word: כן / ὡραῖα (référent implicite)
  choice: vêtements
  rationale: L’objet est implicite dans l’hébreu transmis, mais le contexte immédiat décrit les vêtements sacerdotaux. Le grec confirme qu’il est question de ces ornements, sans obliger à ajouter « beaux » dans le texte principal.
- source_word: זר / ἀλλογενής
  choice: étranger
  rationale: Le mot désigne ici quelqu’un qui n’appartient pas à la lignée sacerdotale autorisée ; la suite précise que le droit de porter ces vêtements revient aux descendants d’Aaron.
- source_word: לעולם
  choice: jamais
  rationale: Avec la négation, « jamais » rend de façon idiomatique la portée durable de l’interdiction.
- source_word: ילבשם
  choice: ne les portera
  rationale: לבש désigne le fait de revêtir ou de porter un vêtement ; « porter » convient naturellement au contexte.
- source_word: לבניו... בניו לדורותם / τῶν υἱῶν αὐτοῦ... τὰ ἔκγονα αὐτοῦ διὰ παντός
  choice: seuls ses fils et ses descendants les porteront, de génération en génération
  rationale: Le grec explicite l’exception réservée aux fils et descendants d’Aaron, tandis que l’hébreu mentionne ses fils dans leurs générations. La répétition du verbe en français évite une phrase elliptique et ambiguë.
theological_decisions:
- issue: Exclusivité héréditaire des vêtements sacerdotaux
  choice: Le texte principal présente ces vêtements comme réservés aux fils et aux descendants d’Aaron.
  alternative: Lire l’hébreu difficile comme disant que Dieu les a confiés ou confirmés à Aaron et à ses fils, sans formuler explicitement l’exception.
  rationale: L’hébreu transmis dans la seconde moitié est difficile, mais le grec ancien exprime clairement l’exclusion de l’étranger et l’inclusion de la seule descendance d’Aaron. La note conserve l’autre possibilité sans imposer une harmonisation silencieuse.
translation_notes:
  register: Français international moderne, digne et accessible. « De génération en génération » restitue naturellement לדורותם. Le point-virgule maintient le contraste entre l’exclusion des étrangers et le privilège de la lignée d’Aaron.
