translation:
  language: fr
  text: des vêtements sacrés faits d’or, de pourpre bleue et de pourpre rouge, ouvrage d’un artisan habile ; le pectoral du jugement[a], l’éphod, la ceinture et le fil écarlate, ouvrage d’un tisserand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pectoral de la décision ». Cette expression reprend le nom du pectoral porté par le grand prêtre dans l’Exode.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: בגדי קודש
  choice: des vêtements sacrés
  rationale: Rend directement la valeur cultuelle de l’expression construite, dans un français naturel et digne.
- source_word: זהב תכלת, וארגמן
  choice: faits d’or, de pourpre bleue et de pourpre rouge
  rationale: La liste désigne des matières et couleurs prestigieuses des vêtements sacerdotaux. « Pourpre bleue » distingue תכלת de la pourpre rouge violacée ארגמן tout en restant intelligible.
- source_word: מעשה חשב
  choice: ouvrage d’un artisan habile
  rationale: L’expression évoque un travail textile élaboré et artistique sans permettre de préciser avec certitude la technique ; cette formulation évite de la réduire à la broderie.
- source_word: חשן משפט
  choice: le pectoral du jugement
  rationale: Conserve la terminologie sacerdotale d’Exode et le sens formel de משפט, sans trancher entre jugement, décision et fonction oraculaire.
- source_word: אפוד
  choice: l’éphod
  rationale: Terme cultuel technique sans équivalent descriptif français exact ; la translittération reçue évite une simplification trompeuse.
- source_word: ואזור
  choice: la ceinture
  rationale: Équivalent français moderne et clair du vêtement sacerdotal servant de ceinture ou d’écharpe nouée.
- source_word: ושני תולעת
  choice: du fil écarlate
  rationale: Désigne la matière textile teinte en écarlate ou cramoisi ; « fil écarlate » convient au contexte de tissage sans prétendre fixer exactement la nuance.
- source_word: מעשה אורג
  choice: ouvrage d’un tisserand
  rationale: Rend explicitement אורג et maintient la distinction avec l’ouvrage artistique mentionné auparavant.
theological_decisions:
- issue: Terminologie des vêtements du grand prêtre
  choice: Conserver « éphod » et « pectoral du jugement », tout en traduisant clairement les autres pièces.
  alternative: Décrire toutes les pièces sans termes techniques, par exemple « vêtement sacerdotal » et « pectoral de décision ».
  rationale: Le verset reprend le vocabulaire cultuel de la tradition sacerdotale. Les termes reçus préservent les liens intertextuels avec l’Exode et laissent subsister la portée judiciaire ou oraculaire de משפט.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase demeure une énumération dépendant du contexte précédent. Les termes techniques nécessaires sont conservés, tandis que les expressions textiles sont rendues sans archaïsme ni précision technique injustifiée.
