  text: Therefore he also established for him a statute[a], an everlasting covenant, to sustain the sanctuary.
translation:
  language: fr
  text: C’est pourquoi il établit aussi pour lui une prescription, une alliance éternelle, afin d’assurer l’entretien du sanctuaire.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle dit : « C’est pourquoi une alliance de paix fut établie pour lui, afin qu’il soit gardien des choses saintes et de son peuple, et que la dignité du sacerdoce lui appartienne, à lui et à sa descendance, pour toujours. » Le témoin hébreu est ici plus bref et met l’accent sur une prescription et une alliance éternelle destinées à assurer l’entretien du sanctuaire.'
    reason: alternative_reading
lexical_decisions:
- source_word: לכן
  choice: C’est pourquoi
  rationale: Marque clairement la conséquence de l’action zélée de Pinhas évoquée auparavant.
- source_word: גם לו הכין
  choice: il établit aussi pour lui
  rationale: Rend l’idée d’une disposition accordée spécialement à Pinhas; « établit » convient au contexte juridique et à l’alliance.
- source_word: חק
  choice: une prescription
  rationale: Conserve la portée juridique d’une règle ou part fixée, sans la réduire à un simple revenu sacerdotal.
- source_word: ברית עולם
  choice: une alliance éternelle
  rationale: Expression française naturelle qui préserve la formule durable de l’alliance.
- source_word: לכלכל
  choice: afin d’assurer la subsistance
  rationale: Exprime l’idée de pourvoir durablement aux besoins ou à l’entretien.
- source_word: מקדש
  choice: du sanctuaire
  rationale: Désigne le lieu sacré sans restreindre anachroniquement le sens au seul bâtiment du Temple.
theological_decisions:
- issue: Divergence entre l’hébreu et le grec quant au contenu de la promesse
  choice: 'Le texte principal suit l’hébreu conservé: une prescription et une alliance éternelle visant à assurer la subsistance du sanctuaire.'
  alternative: Le grec parle d’une « alliance de paix », de la garde des choses saintes et de la dignité sacerdotale accordée pour toujours à Pinhas et à sa descendance.
  rationale: L’hébreu conservé est prioritaire, mais l’expansion grecque modifie sensiblement la compréhension de la promesse et doit donc être signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu tout en étant naturelle; « prescription » maintient l’ambiguïté juridique de חק.
