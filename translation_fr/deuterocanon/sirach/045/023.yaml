base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/023.yaml
  text: And Phinehas son of Eleazar inherited a third place in might[c][b][a], because he was zealous for the God of all and stood in the breach for his people.
translation:
  language: fr
  text: Et Pinhas, fils d’Éléazar, reçut le troisième rang par sa vaillance[a], parce qu’il se montra plein de zèle pour le Dieu de tous et se tint à la brèche en faveur de son peuple[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « troisième en gloire », tandis que l’hébreu dit littéralement qu’il « reçut le troisième rang par sa vaillance ». La traduction suit ici l’hébreu.
    reason: textual_variant
  - marker: b
    text: '« Se tenir à la brèche » est une image hébraïque : elle désigne le fait d’intervenir au moment où la communauté est en danger afin de la protéger.'
    reason: cultural_note
  - marker: c
    text: 'Le grec ajoute : « et il fit l’expiation pour Israël ». Cette phrase ne figure pas dans le texte hébreu conservé ici.'
    reason: textual_variant
lexical_decisions:
- source_word: נחל שלישי
  choice: reçut le troisième rang
  rationale: Le verbe נחל signifie recevoir ou hériter, tandis que שלישי indique ici vraisemblablement une troisième place dans une succession honorifique. « Reçut le troisième rang » exprime ce sens naturellement sans suggérer un héritage foncier.
- source_word: בגבורה
  choice: par sa vaillance
  rationale: גבורה évoque la force, la bravoure ou la valeur héroïque. « Vaillance » convient à l’éloge de Pinhas et maintient la distinction avec la leçon grecque « en gloire ».
- source_word: בקנאו
  choice: parce qu’il se montra plein de zèle
  rationale: La construction avec ב et l’infinitif exprime la circonstance ou la cause de l’honneur accordé. Cette formulation rend clairement la nuance causale tout en restant naturelle en français.
- source_word: לאלוה כל
  choice: pour le Dieu de tous
  rationale: Traduction proche du titre hébreu distinctif, qui affirme la souveraineté universelle de Dieu sans le remplacer par un titre plus familier absent du texte.
- source_word: ויעמוד בפרץ
  choice: se tint sur la brèche
  rationale: L’expression hébraïque décrit quelqu’un qui intervient dans une crise pour protéger la communauté. Le français « se tenir sur la brèche » conserve l’image, bien qu’il ait aussi développé le sens plus général d’être constamment vigilant.
- source_word: עמו
  choice: en faveur de son peuple
  rationale: Le contexte de l’expression indique une intervention protectrice pour le peuple. « En faveur de » explicite cette relation sans ajouter l’idée d’une intercession verbale.
theological_decisions:
- issue: Rapport entre le zèle de Pinhas et son rang honorifique
  choice: Son rang est présenté comme résultant de son zèle pour Dieu et de son intervention en faveur du peuple.
  alternative: 'Le membre de phrase peut être compris plus faiblement comme une circonstance concomitante : « lorsqu’il se montra plein de zèle ».'
  rationale: La construction hébraïque בקנאו permet une nuance causale ou temporelle. Le contexte d’éloge favorise la causalité, mais l’ambiguïté est reconnue.
translation_notes:
  register: Français international actuel, digne et accessible. Le nom « Pinhas » suit de près la forme hébraïque. La syntaxe reste concise pour préserver le caractère sentencieux du texte, et les variantes grecques importantes sont signalées sans les intégrer au corps principal.
