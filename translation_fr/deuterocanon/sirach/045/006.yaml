  yaml_path: translation/deuterocanon/sirach/045/006.yaml
  text: He exalted Aaron[a], a holy one like himself, from the tribe of Levi[b], and made him an everlasting statute.
translation:
  language: fr
  text: Il éleva Aaron, un homme saint comme lui[a], de la tribu de Lévi, et l’établit dans une charge perpétuelle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte explicitement : « saint comme lui, son frère, de la tribu de Lévi ». La ligne hébraïque citée ne contient ni la comparaison ni « son frère » ; la comparaison est retenue dans le texte d’après ce témoin parallèle.'
    reason: alternative_reading
  - marker: b
    text: Littéralement, « pour une prescription perpétuelle » ou « comme prescription perpétuelle ». La construction hébraïque est condensée ; elle exprime vraisemblablement l’établissement durable d’Aaron dans une charge, sans en nommer ici la nature.
    reason: lexical_alternative
lexical_decisions:
- source_word: וירם
  choice: Il éleva
  rationale: Le hifil de רום exprime l’action d’élever ou d’exalter. « Il éleva » est naturel en français et conserve ici la valeur honorifique, en accord avec le grec ὕψωσεν.
- source_word: קדוש את אהרן
  choice: Aaron, un homme saint
  rationale: קדוש qualifie Aaron en apposition. « Un homme saint » rend cette valeur sans transformer l’expression en titre défini ni employer une tournure française artificielle comme « un saint ».
- source_word: ὅμοιον αὐτῷ
  choice: comme lui
  rationale: Cette comparaison figure explicitement dans le témoin grec, bien qu’elle soit absente de la ligne hébraïque conservée. La formulation française maintient l’ambiguïté du référent de « lui », que le contexte rattache à Moïse.
- source_word: למטה לוי
  choice: de la tribu de Lévi
  rationale: מַטֶּה désigne ici la tribu dans un cadre généalogique. Cette traduction correspond aussi au grec ἐκ φυλῆς Λευεί.
- source_word: וישימהו
  choice: et fit de lui
  rationale: Le verbe שׂים peut signifier placer, établir ou constituer. « Fit de lui » conserve la construction condensée avec le complément suivant sans préciser indûment la nature de la charge.
- source_word: לחק עולם
  choice: une institution perpétuelle
  rationale: חֹק peut désigner une règle, une prescription ou une institution établie; עוֹלָם marque ici la durée. « Institution perpétuelle » convient mieux à une personne constituée dans une fonction durable que « statut perpétuel », tout en préservant le registre juridique.
theological_decisions:
- issue: Identification du sujet implicite de « Il éleva »
  choice: Le pronom « Il » est conservé sans nommer explicitement son référent.
  alternative: « Dieu éleva Aaron » ou « Le Seigneur éleva Aaron »
  rationale: L’hébreu n’exprime pas le sujet du verbe. Le contexte permet de l’identifier à Dieu, mais l’introduire nommément ajouterait au verset.
- issue: Référent de « comme lui »
  choice: La comparaison du témoin grec est conservée sans expliciter son référent.
  alternative: « un homme saint comme Moïse »
  rationale: Le contexte et la lecture grecque orientent vers une comparaison avec Moïse, mais le nommer dans le corps du texte résoudrait une anaphore que la formulation transmise laisse implicite.
- issue: Portée de לחק עולם appliqué à Aaron
  choice: « fit de lui une institution perpétuelle »
  alternative: « l’établit dans un sacerdoce perpétuel »
  rationale: Le contexte est sacerdotal, mais le mot « sacerdoce » n’apparaît pas dans cette proposition. La traduction retenue garde la portée juridique et durable sans développer l’implication institutionnelle au-delà du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la formulation hébraïque, tandis que « institution perpétuelle » évite l’étrangeté de faire littéralement d’une personne un « statut ». Les ajouts propres au grec sont signalés sans effacer la divergence des témoins.
