  naturalness: « Fit de lui une institution perpétuelle » est intelligible, mais reste peu idiomatique et suggère qu’Aaron est lui-même une institution. « L’établit dans une charge perpétuelle » rend plus naturellement, en français moderne, l’effet de nomination durable impliqué par la formule juridique condensée, sans préciser de quelle charge il s’agit.
  terminology: « Homme saint » rend correctement קדוש sans employer « saint » seul, qui peut évoquer en français contemporain un saint canonisé. « Charge perpétuelle » reste institutionnel et juridique; la note conserve « prescription perpétuelle » comme rendu littéral possible de חק עולם. Les noms Aaron et Lévi sont conformes à l’usage français.
