  verdict: revise
  source_fidelity: 'La structure et le sens du témoin hébreu sont globalement bien rendus : les hommes liés à Datan et Abiram, la communauté de Coré, leur colère violente, puis la réaction judiciaire de Yahvé. Toutefois, « Yahvé le vit » ajoute un objet singulier absent de l’hébreu et oriente inutilement le référent. La formulation absolue « Yahvé vit » préserve mieux la concision du texte. « Les fit périr » rend de façon plus prudente le verbe difficile ויכלם, sans suggérer l’annihilation métaphysique ni importer le feu du grec.'
  naturalness: Le français est moderne et soutenu. « Yahvé vit, s’irrita et les fit périr » est plus naturel et plus direct que « Yahvé le vit et s’emporta ; il les anéantit ». Les formes Datan, Abiram et Coré correspondent aux usages bibliques français modernes courants.
  terminology: « Yahvé » rend adéquatement le tétragramme. « Groupe de Coré » est recevable pour עדת, bien que « assemblée » soit également possible. « Dans la violence de leur colère » communique naturellement l’intensité de בעזוז אפם. Les appels de note sont déplacés afin que la note sur le développement grec suive le groupe nominal auquel elle se rapporte, conformément à la piste d’audit anglaise.
  issues:
