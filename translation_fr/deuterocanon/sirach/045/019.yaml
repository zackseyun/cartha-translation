base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/019.yaml
  text: The men of Dathan and Abiram[a], and the company of Korah in the strength of their anger— Yahweh saw and was enraged[b], and he consumed them in the heat of his anger.
translation:
  language: fr
  text: Les hommes de Datan et d’Abiram[a], ainsi que le groupe de Coré, dans la violence de leur colère[b] — Yahvé vit, s’irrita et les fit périr dans l’ardeur de sa colère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec développe le jugement : « ils furent exterminés dans l’ardeur de la colère ; il accomplit pour eux des prodiges, afin de les consumer dans le feu de sa flamme ». Le témoin hébreu est plus court.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « dans la force de leur colère ». L’expression hébraïque est resserrée et peut aussi se rendre par « dans la fureur de leur colère ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אנשי דתן ואבירם
  choice: Les hommes de Datân et d’Abiram
  rationale: אנשי signifie littéralement « les hommes de ». Cette formulation concrète identifie ceux qui étaient associés à Datân et Abiram sans les redéfinir de manière plus interprétative comme leurs « partisans ».
- source_word: ועדת קרח
  choice: ainsi que le groupe de Coré
  rationale: עדה peut désigner une assemblée, une communauté ou un groupe. « Groupe » convient ici à la faction rebelle et évite les connotations ecclésiales que pourrait avoir « assemblée ».
- source_word: בעזוז אפם
  choice: dans la violence de leur colère
  rationale: עזוז exprime la force ou la violence, et אף la colère. La tournure française rend naturellement l’intensité de cette expression hébraïque resserrée tout en conservant son attribution la plus probable aux rebelles.
- source_word: וירא יהוה
  choice: Yahvé le vit
  rationale: ראה signifie « voir ». Le pronom « le » reprend l’ensemble de la conduite rebelle évoquée dans la proposition précédente. Le nom divin יהוה est rendu par « Yahvé ».
- source_word: ויתאנף
  choice: et s’emporta
  rationale: La forme verbale exprime le fait de se mettre en colère ou de manifester sa colère. « S’emporta » communique cette montée de colère dans un français actuel et digne.
- source_word: ויכלם
  choice: il les anéantit
  rationale: La forme hébraïque est difficile, mais le contexte du jugement et le grec συνετελέσθησαν, « ils furent menés à leur fin », soutiennent le sens d’une destruction complète. « Anéantit » reste sobre et n’introduit pas dans le texte principal le feu mentionné seulement par le grec.
- source_word: בחרון אפו
  choice: dans l’ardeur de sa colère
  rationale: חרון אף est une expression hébraïque courante pour une colère intense et brûlante. « L’ardeur de sa colère » conserve cette image en français naturel.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahvé » préserve sa fonction de nom propre sans le remplacer par un titre.
- issue: Priorité du témoin hébreu face au développement grec
  choice: Conserver dans le texte principal la formulation plus courte de l’hébreu
  alternative: Ajouter que Dieu accomplit des prodiges et les consume dans le feu de sa flamme
  rationale: L’hébreu est le témoin principal ici. Le grec aide à comprendre ויכלם comme un jugement destructeur, mais son développement sur les prodiges et le feu n’est pas introduit silencieusement dans le texte.
- issue: Référent de « leur colère » dans בעזוז אפם
  choice: La colère des rebelles
  alternative: Une formulation rattachant cette colère au jugement divin
  rationale: Le suffixe pluriel « leur » renvoie grammaticalement le plus naturellement aux hommes de Datân et d’Abiram et au groupe de Coré. La densité de la phrase et la différence du grec justifient néanmoins de signaler l’incertitude.
translation_notes:
  register: Français international moderne, clair et solennel. Les noms propres suivent les formes bibliques françaises usuelles. Le tiret conserve la tension de la syntaxe hébraïque entre l’évocation des rebelles et la réaction divine.
