  text: And he added honor to Aaron[a], and gave him his inheritance.
translation:
  language: fr
  text: Il rehaussa l’honneur d’Aaron[a] et lui donna son héritage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec poursuit : « Il leur répartit les prémices des premiers-nés et prépara pour les principaux du pain en abondance. » Le témoin hébreu est ici plus court que le grec.'
    reason: textual_variant
lexical_decisions:
- source_word: ויוסף
  choice: Il ajouta
  rationale: Le hifil de יסף signifie ici « ajouter » ou « accroître ». « Il ajouta » conserve l’image verbale de l’hébreu et correspond étroitement au grec προσέθηκεν.
- source_word: לאהרן כבודו
  choice: à l’honneur d’Aaron
  rationale: כבוד désigne ici l’honneur ou la dignité attachés à la fonction d’Aaron. Cette formulation naturelle conserve la construction hébraïque sans préciser au-delà du texte la nature de cet honneur.
- source_word: ויתן לו
  choice: et lui donna
  rationale: Traduction directe de נתן avec son complément indirect, dans un français simple et digne.
- source_word: נחלתו
  choice: son héritage
  rationale: נחלה peut désigner un héritage ou une part attribuée. « Héritage » préserve les résonances bibliques et laisse ouverte la possibilité d’une part sacerdotale plutôt que d’un domaine foncier.
- source_word: κληρονομίαν
  choice: héritage
  rationale: Le parallèle grec confirme le sens d’« héritage » ou de « part attribuée » et appuie la lecture du témoin hébreu.
theological_decisions:
- issue: Nature de l’« héritage » d’Aaron
  choice: son héritage
  alternative: la part qui lui revenait
  rationale: Le passage évoque vraisemblablement la part sacerdotale accordée à Aaron, sans nécessairement parler d’une propriété foncière. « Héritage » garde la portée biblique du terme et ne tranche pas davantage que le texte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu tout en étant naturelle; « honneur » et « héritage » conservent la densité cultuelle et théologique sans l’expliciter abusivement.
