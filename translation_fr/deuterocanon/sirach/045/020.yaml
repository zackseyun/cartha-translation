revisions:
- from: Il ajouta à l’honneur d’Aaron[a] et lui donna son héritage.
  to: Il rehaussa l’honneur d’Aaron[a] et lui donna son héritage.
  rationale: La formulation principale est rendue idiomatique sans perdre le sens d’une augmentation d’honneur. La note textuelle est conservée au même ancrage et sa citation grecque est corrigée pour refléter plus fidèlement le sens de πρώτοις et de πρωτογενημάτων.
