review_pass:
  verdict: revise
  source_fidelity: Le sens du texte hébreu est bien rendu dans l’ensemble. Toutefois, « Il ajouta à l’honneur d’Aaron » est une tournure française peu idiomatique et rend moins clairement l’idée que Dieu accorda/augmenta l’honneur d’Aaron. « Il rehaussa l’honneur d’Aaron » exprime naturellement ויוסף ... כבודו sans ajouter de précision doctrinale. « son héritage » correspond à נחלתו et conserve utilement l’ambiguïté entre héritage et part attribuée.
  naturalness: 'La révision améliore la fluidité en français international moderne tout en gardant un registre biblique sobre. La note est aussi corrigée : « en premier » ne correspond pas à πρώτοις, qui désigne les premiers/les principaux, et « premiers produits » ne reflète pas suffisamment littéralement πρωτογενημάτων.'
  terminology: « Honneur » convient pour כבודו dans ce contexte; « héritage » convient pour נחלתו. Aaron est la forme française usuelle. La note signale correctement l’expansion grecque sans la confondre avec le texte hébreu bref.
  issues:
  - severity: medium
    issue: Tournure principale peu naturelle
    rationale: « Il ajouta à l’honneur d’Aaron » calque la construction verbale mais sonne maladroitement en français. « Il rehaussa l’honneur d’Aaron » rend l’augmentation de l’honneur de façon naturelle.
  - severity: medium
    issue: Traduction imprécise de la citation grecque dans la note
    rationale: « leur prépara en premier du pain » interprète πρώτοις comme un adverbe temporel; il s’agit plutôt de « pour les premiers/les principaux ». « Premiers produits » ne restitue pas clairement πρωτογενημάτων, littéralement lié aux premiers-nés.
  revised_text: Il rehaussa l’honneur d’Aaron[a] et lui donna son héritage.
  revised_footnotes:
  - marker: a
    text: 'Le grec poursuit : « Il leur répartit les prémices des premiers-nés et prépara pour les principaux du pain en abondance. » Le témoin hébreu est ici plus court que le grec.'
    reason: textual_variant
  revision_rationale: La formulation principale est rendue idiomatique sans perdre le sens d’une augmentation d’honneur. La note textuelle est conservée au même ancrage et sa citation grecque est corrigée pour refléter plus fidèlement le sens de πρώτοις et de πρωτογενημάτων.
