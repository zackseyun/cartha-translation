  text: In his faithfulness and humility[a], he chose him from all flesh.
translation:
  language: fr
  text: Pour sa fidélité et son humilité[a], il l’a choisi parmi tous les êtres humains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Dans sa foi et sa douceur, il l’a sanctifié; il l’a choisi parmi toute chair. » Le témoin hébreu ne contient pas l’expression explicite « il l’a sanctifié »; le grec permet aussi de traduire « foi » plutôt que « fidélité ».'
    reason: alternative_reading
lexical_decisions:
- source_word: באמונתו
  choice: Pour sa fidélité
  rationale: אֱמוּנָה peut désigner la foi ou la fidélité. Associé ici à l’humilité dans l’éloge de Moïse, le terme décrit naturellement sa qualité de personne fiable et fidèle. La tournure causale « pour » exprime en français idiomatique la valeur contextuelle de בְּ.
- source_word: ובענותו
  choice: et son humilité
  rationale: עֲנָוָה recouvre l’humilité et la douceur. « Humilité » est clair, naturel et convient à la qualité morale attribuée à Moïse; le grec πραΰτης soutient aussi le sens de douceur.
- source_word: בחר בו
  choice: il l’a choisi
  rationale: Avec בחר, la préposition בְּ introduit couramment la personne choisie. « Il l’a choisi » rend directement et naturellement l’expression hébraïque.
- source_word: מכל בשר
  choice: parmi tous les êtres humains
  rationale: Littéralement « parmi toute chair ». Dans ce contexte, l’expression désigne l’ensemble des humains; cette formulation moderne en restitue clairement la portée sans l’étrangeté que pourrait avoir « toute chair » en français courant.
theological_decisions:
- issue: Sens de אמונה dans l’éloge de Moïse
  choice: fidélité
  alternative: foi
  rationale: Le contexte associe אמונה à l’humilité comme qualité personnelle de Moïse; « fidélité » préserve cette nuance éthique sans imposer une catégorie doctrinale ultérieure. Le grec ἐν πίστει permet toutefois « foi », possibilité signalée en note.
- issue: Présence du verbe « sanctifier »
  choice: Ne pas l’inclure dans le texte principal
  alternative: « il l’a sanctifié; il l’a choisi » d’après le grec
  rationale: Le témoin hébreu principal ne contient pas de verbe correspondant à ἡγίασεν. L’ajouter au texte principal ferait prévaloir la forme grecque sur le texte source fourni; la variante est donc conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Parmi tous les êtres humains » explicite l’idiome hébraïque « parmi toute chair ». La note préserve les différences importantes entre le témoin hébreu et le parallèle grec.
