base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/017.yaml
  text: And he gave him his commandments[a], and granted him authority in statute and judgment, to teach Jacob his testimonies and to enlighten Israel with his law.
translation:
  language: fr
  text: Il lui donna ses commandements[a] et lui conféra autorité en matière de prescriptions et de jugement, afin d’enseigner à Jacob ses témoignages et d’éclairer Israël par sa Loi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu conservé dans les manuscrits de la Guéniza du Caire est plus court : « Il lui donna ses commandements et lui conféra autorité en matière de prescriptions et de jugement. » Les propositions « afin d’enseigner à Jacob ses témoignages et d’éclairer Israël par sa Loi » sont attestées par le texte grec et sont incluses ici parce que la ligne hébraïque paraît abrégée.'
    reason: textual_variant
lexical_decisions:
- source_word: ויתן לו מצותיו
  choice: Il lui donna ses commandements
  rationale: Le verbe נתן signifie simplement « donner »; « commandements » conserve la portée juridique et liée à l’alliance de מצותיו. L’initiale « Il » renvoie à Dieu, tandis que « lui » renvoie à Aaron dans le contexte.
- source_word: וימשילהו
  choice: et lui conféra autorité
  rationale: La forme causative de משל exprime ici une autorité déléguée. « Conféra autorité » convient à la charge sacerdotale et juridique sans suggérer qu’Aaron aurait été établi roi.
- source_word: בחוק ומשפט
  choice: en matière de prescriptions et de jugement
  rationale: Cette formulation rend naturellement le domaine dans lequel l’autorité s’exerce. « Prescriptions » garde la valeur légale de חוק, et « jugement » préserve le caractère judiciaire de משפט.
- source_word: διδάξαι τὸν Ἰακὼβ τὰ μαρτύρια
  choice: afin d’enseigner à Jacob ses témoignages
  rationale: Le grec fournit une proposition de but absente de la ligne hébraïque conservée. « Témoignages » maintient le vocabulaire juridique et lié à l’alliance de μαρτύρια.
- source_word: καὶ ἐν νόμῳ αὐτοῦ φωτῖσαι Ἰσραήλ
  choice: et d’éclairer Israël par sa Loi
  rationale: « Éclairer » conserve la métaphore de φωτίζω; « par » exprime la fonction instrumentale de la Loi. La majuscule à « Loi » signale ici l’enseignement divin donné à Israël, sans ajouter de précision confessionnelle.
theological_decisions:
- issue: Recours au parallèle grec pour compléter l’hébreu conservé, plus court
  choice: Les propositions concernant l’enseignement de Jacob et l’éclairage d’Israël sont incluses dans le texte principal.
  alternative: 'Limiter le verset à l’hébreu conservé : « Il lui donna ses commandements et lui conféra autorité en matière de prescriptions et de jugement. »'
  rationale: Le témoin hébreu est signalé comme présentant une divergence majeure et semble abrégé, tandis que le grec transmet une continuation cohérente avec la fonction enseignante du prêtre. La note rend ce choix textuel explicite sans masquer la différence entre les témoins.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation « en matière de » explicite naturellement la préposition hébraïque comprimée sans étendre la portée de l’autorité. Le vocabulaire juridique est conservé, et la variante textuelle est signalée avec transparence.
