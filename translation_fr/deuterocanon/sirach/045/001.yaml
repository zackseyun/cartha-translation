translation:
  language: fr
  text: Aimé de Dieu et des hommes[a], Moïse, dont le souvenir est béni.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « hommes » ; le grec emploie un terme plus large qui peut aussi désigner des « êtres humains » ou des « personnes ».
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « son souvenir est pour le bien ». Dans cet emploi commémoratif, l’expression désigne un souvenir béni. Le grec porte : « dont la mémoire est dans les bénédictions ».'
    reason: lexical_alternative
  - marker: c
    text: 'Le texte grec de ce verset est plus long : avant de nommer Moïse, il ajoute que Dieu « fit sortir de lui un homme de miséricorde, qui trouva grâce aux yeux de toute chair ». Ces mots ne figurent pas dans le témoin hébreu fourni.'
    reason: textual_variant
lexical_decisions:
- source_word: אהוב
  choice: Aimé
  rationale: Rend naturellement le participe/adjectif passif « aimé », en accord avec le grec ἠγαπημένον, tout en conservant le ton honorifique.
- source_word: אלהים
  choice: Dieu
  rationale: Dans ce contexte concernant Moïse, le référent est clairement le Dieu d’Israël.
- source_word: ואנשים
  choice: et des hommes
  rationale: Suit le masculin pluriel du témoin hébreu. Le grec emploie un terme plus large pouvant signifier « êtres humains » ou « personnes », signalé en note.
- source_word: משה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom.
- source_word: זכרו לטובה
  choice: dont le souvenir est en bénédiction
  rationale: Expression française digne qui communique l’idée d’un souvenir béni. Elle reste proche de l’hébreu, littéralement « son souvenir [est] pour le bien », et concorde avec le grec « dont la mémoire est dans les bénédictions ».
theological_decisions:
- issue: Choix entre le témoin hébreu bref et le parallèle grec plus développé
  choice: Le texte principal traduit directement le témoin hébreu conservé.
  alternative: Ajouter les mots du grec selon lesquels Dieu « fit sortir de lui un homme de miséricorde, qui trouva grâce aux yeux de toute chair ».
  rationale: Le témoin hébreu fourni est prioritaire. Les éléments supplémentaires du grec ne sont pas introduits dans le corps du verset, mais leur existence est signalée en note afin de préserver la donnée textuelle.
- issue: Sens de זכרו לטובה
  choice: « dont le souvenir est en bénédiction »
  alternative: « que son souvenir soit pour le bien » ou « son souvenir est pour le bien »
  rationale: La formulation choisie exprime l’usage commémoratif sans imposer une interprétation doctrinale. Le parallèle grec soutient explicitement le champ sémantique de la bénédiction.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La syntaxe nominale brève conserve la solennité de l’hébreu. « En bénédiction » est intelligible dans un contexte commémoratif et maintient le lien avec le parallèle grec.
