base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/005.yaml
  text: He let him hear his voice[a], and brought him near into the dark cloud. He placed in his hand the commandment, a law of life and understanding, to teach Jacob his statutes[b], and Israel his testimonies and judgments.
translation:
  language: fr
  text: Il lui fit entendre sa voix[a] et le fit approcher dans la nuée obscure. Il remit entre ses mains le commandement, une loi de vie et d’intelligence, afin qu’il enseigne à Jacob ses prescriptions[b], et à Israël ses témoignages et ses jugements.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec lit « des commandements » là où l’hébreu porte « le commandement ».
    reason: textual_variant
  - marker: b
    text: 'Le grec lit : « afin qu’il enseigne l’alliance à Jacob, et ses jugements à Israël », là où l’hébreu porte : « ses prescriptions… ses témoignages et ses jugements ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וישמיעהו את קולו
  choice: Il lui fit entendre sa voix
  rationale: Le hifil de שמע exprime ici la causation. Cette formulation française naturelle conserve l’idée que Dieu a donné à Moïse d’entendre sa voix.
- source_word: ויגישהו לערפל
  choice: le fit approcher dans la nuée obscure
  rationale: Le hifil de נגש signifie « faire approcher ». ערפל désigne l’obscurité dense associée à la manifestation divine; « nuée obscure » rend à la fois l’obscurité et le cadre théophanique, sans effacer la notion d’approche.
- source_word: מצוה
  choice: le commandement
  rationale: Le singulier du texte hébreu est conservé, bien que le grec lise le pluriel. Dans le contexte du Sinaï, « commandement » convient au don concret de l’instruction divine.
- source_word: תורת חיים ותבונה
  choice: une loi de vie et d’intelligence
  rationale: תורה peut signifier « loi » ou « instruction »; son parallélisme avec מצוה et le contexte sinaïtique favorisent « loi ». תבונה désigne l’intelligence ou le discernement.
- source_word: ללמד ביעקב חוקיו
  choice: afin qu’il enseigne à Jacob ses prescriptions
  rationale: L’infinitif exprime le but. Le ב devant Jacob se rend naturellement par un complément indirect en français. « Prescriptions » restitue les règles établies exprimées par חוקים.
- source_word: ועדותיו ומשפטיו לישראל
  choice: et à Israël ses témoignages et ses jugements
  rationale: עדותיו désigne ses témoignages, avec une possible portée d’attestation d’alliance, tandis que משפטיו conserve ici sa force juridique dans « jugements ». La divergence grecque est signalée en note.
theological_decisions:
- issue: Image théophanique de ערפל
  choice: la nuée obscure
  alternative: les ténèbres épaisses; l’obscurité
  rationale: L’expression évoque la présence divine à la fois manifestée et voilée au Sinaï. « Nuée obscure » garde ensemble ces dimensions sans expliquer excessivement l’image.
- issue: Divergence entre l’hébreu et le grec dans le vocabulaire juridique
  choice: le commandement … une loi de vie et d’intelligence … ses témoignages et ses jugements
  alternative: des commandements … l’alliance et ses jugements
  rationale: L’hébreu, ici disponible avec une confiance élevée et offrant un texte cohérent, fonde le corps du verset. Les lectures grecques significatives sont néanmoins conservées dans les notes.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le rythme solennel de l’énumération hébraïque. « Remit entre ses mains » rend idiomatiquement le geste de confier, tandis que les termes juridiques restent distincts.
