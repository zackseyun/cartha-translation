translation:
  language: fr
  text: Splendeur de gloire et louange de puissance[a], délice des yeux et perfection de la beauté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec porte : « sujet de fierté et d’honneur, œuvre de puissance, ornements désirés par les yeux ». Le témoin hébreu diffère sensiblement dans sa formulation, mais les deux textes exaltent les ornements du grand prêtre.'
    reason: alternative_reading
lexical_decisions:
- source_word: הוד
  choice: splendeur
  rationale: הוד désigne la splendeur ou la majesté. « Splendeur » convient au registre poétique et reste distinct du terme suivant, כבוד.
- source_word: כבוד
  choice: gloire
  rationale: כבוד signifie couramment « gloire » ou « honneur ». « Gloire » préserve ici le ton élevé de l’éloge.
- source_word: ותהלת עז
  choice: et louange de puissance
  rationale: תהלה signifie « louange » et עז « force » ou « puissance ». La formulation française conserve la construction hébraïque, volontairement dense, sans l’assimiler à l’expansion différente du grec.
- source_word: מחמד עין
  choice: délice des yeux
  rationale: מחמד désigne ce qui est désirable ou délicieux ; associé à עין, il exprime l’attrait visuel. « Délice des yeux » est naturel et fidèle à l’image.
- source_word: ומכלל יופי
  choice: et perfection de la beauté
  rationale: מכלל peut évoquer l’achèvement, la plénitude ou la perfection. Dans cet éloge des ornements sacerdotaux, « perfection de la beauté » rend bien cette valeur superlative.
theological_decisions:
- issue: Choix entre le texte hébreu des manuscrits de la Guéniza du Caire et le parallèle grec lorsque leur formulation diffère sensiblement
  choice: Traduire l’hébreu conservé dans le texte principal et signaler la formulation grecque en note.
  alternative: 'Suivre davantage le grec : « sujet de fierté et d’honneur, œuvre de puissance, ornements désirés par les yeux ».'
  rationale: Le témoin hébreu est ici cohérent et de haute confiance, bien que les métadonnées signalent une divergence majeure avec le grec. La traduction donne donc priorité à l’hébreu sans masquer l’autre forme ancienne du verset.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe nominale et resserrée de l’hébreu est conservée, tout en employant un vocabulaire accessible.
