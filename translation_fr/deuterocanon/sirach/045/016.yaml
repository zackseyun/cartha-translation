  source_fidelity: 'Le texte principal suit fidèlement le témoin hébreu conservé : service cultuel, exercice sacerdotal, bénédiction du peuple au nom de Dieu, élection parmi tous les vivants, puis présentation d’holocaustes et de parties grasses. La note rend correctement compte, sans harmonisation, des développements importants du parallèle grec.'
