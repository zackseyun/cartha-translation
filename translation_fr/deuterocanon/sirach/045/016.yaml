  text: to minister and to serve as priest to him[a], and to bless his people in his name. He chose him from among all the living to present burnt offerings and fat portions.
translation:
  language: fr
  text: pour le servir et exercer le sacerdoce, et bénir son peuple en son nom. Il le choisit parmi tous les êtres vivants pour présenter des holocaustes et les parties grasses.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec est plus développé : « pour présenter au Seigneur une offrande, de l’encens et un parfum agréable en mémorial, afin d’accomplir l’expiation pour ton peuple ». Le témoin hébreu est ici plus bref.'
    reason: Variante textuelle importante entre le témoin hébreu et le parallèle grec.
lexical_decisions:
- source_word: לשרת
  choice: assurer son service
  rationale: Dans ce contexte cultuel, le verbe désigne le service sacré. Cette formulation reste naturelle en français tout en conservant cette nuance.
- source_word: ולכהן לו
  choice: exercer pour lui le sacerdoce
  rationale: Le verbe dérivé de « prêtre » désigne explicitement l’exercice de la fonction sacerdotale; « pour lui » conserve le complément hébreu renvoyant à Dieu.
- source_word: ולברך את עמו בשמו
  choice: et bénir son peuple en son nom
  rationale: La formulation rend directement l’acte liturgique de bénir le peuple sous l’autorité du nom divin.
- source_word: ויבחר בו מכל חי
  choice: Il le choisit parmi tous les vivants
  rationale: מכל חי a une portée plus large que « parmi tous les hommes »; « tous les vivants » préserve cette expression sans en restreindre artificiellement le sens.
- source_word: להגיש
  choice: pour présenter
  rationale: Dans un contexte sacrificiel, le verbe signifie faire approcher ou présenter une offrande; « présenter » laisse les objets suivants préciser la nature du rite.
- source_word: עלה
  choice: des holocaustes
  rationale: « Holocauste » est le terme français consacré pour l’offrande entièrement brûlée; le pluriel exprime naturellement ici la valeur collective du nom hébreu.
- source_word: וחלבים
  choice: les parties grasses
  rationale: Le pluriel désigne les portions grasses réservées au sacrifice. « Parties grasses » est plus explicite pour un lecteur moderne que le simple mot « graisses ».
- source_word: προσαγαγεῖν κάρπωσιν Κυρίῳ, θυμίαμα καὶ εὐωδίαν εἰς μνημόσυνον, ἐξιλάσκεσθαι περὶ τοῦ λαοῦ σου
  choice: non intégré au texte principal; signalé dans la note comme le parallèle grec plus développé
  rationale: Le témoin hébreu conservé est prioritaire, tandis que les éléments supplémentaires du grec doivent être présentés clairement sans produire un texte harmonisé.
theological_decisions:
- issue: Choix entre le texte hébreu bref et le parallèle grec plus développé
  choice: Suivre le texte hébreu dans le corps du verset et donner le développement grec en note.
  alternative: Traduire le grec dans le texte principal ou fusionner les deux formes textuelles.
  rationale: Le texte hébreu est conservé ici et doit gouverner la traduction. Le grec atteste toutefois une divergence substantielle portant sur l’encens, le mémorial et l’expiation; la note permet de préserver cette donnée textuelle et sa portée théologique sans l’importer silencieusement dans l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire cultuel précis (« sacerdoce », « holocaustes ») est conservé, tandis que « parties grasses » explicite le terme sacrificiel pour le lecteur actuel.
