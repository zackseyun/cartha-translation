base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/011.yaml
  text: precious stones upon the breastpiece[a], engraved like a seal in their settings—every precious stone as a memorial[b], engraved with writing according to the number of the sons of Israel.
translation:
  language: fr
  text: des pierres précieuses sur le pectoral[a], gravées à la manière d’un sceau dans leurs montures — chaque pierre précieuse servant de mémorial, avec une inscription gravée selon le nombre des fils d’Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec précise que les pierres étaient enchâssées dans une monture d’or; l’hébreu mentionne seulement leurs montures.
    reason: textual_variant
  - marker: b
    text: Le grec porte « selon le nombre des tribus d’Israël ». L’hébreu lit « fils d’Israël », ce qui renvoie probablement aux noms tribaux représentés par les pierres.
    reason: alternative_reading
lexical_decisions:
- source_word: אבני חפץ
  choice: pierres précieuses
  rationale: L’expression désigne des pierres de grande valeur; le grec λίθοις πολυτελέσιν confirme ce sens. « Pierres précieuses » est naturel et convient au contexte des vêtements sacerdotaux.
- source_word: החשן
  choice: le pectoral
  rationale: Dans le contexte sacerdotal, חשן désigne la pièce ornée de pierres portée sur la poitrine du grand prêtre. « Pectoral » est le terme français biblique précis et n’évoque pas une armure.
- source_word: פתוחי חותם
  choice: gravées comme un sceau
  rationale: La formule évoque une gravure de type sigillaire; le grec γλύμματος σφραγῖδος appuie cette compréhension. La comparaison reste explicite sans surinterprétation.
- source_word: במלואים
  choice: dans leurs montures
  rationale: Dans ce contexte, le mot renvoie à l’enchâssement des pierres. Le grec précise une monture d’or, mais l’hébreu n’exprime pas ici le métal; « montures » demeure donc sobre.
- source_word: לזכרון
  choice: servant de mémorial
  rationale: Le terme a une portée cultuelle de commémoration, également attestée par le grec εἰς μνημόσυνον. Cette formulation conserve cette fonction sans l’expliciter davantage.
- source_word: בכתב חרות
  choice: avec une inscription gravée
  rationale: L’hébreu associe l’écriture et l’action de graver. « Inscription gravée » rend naturellement les deux éléments en français.
- source_word: למספר בני ישראל
  choice: selon le nombre des fils d’Israël
  rationale: Le témoin hébreu porte « fils d’Israël », tandis que le grec lit « tribus d’Israël ». Le texte principal suit l’hébreu, et la variante grecque est signalée en note.
theological_decisions:
- issue: Fonction commémorative des pierres gravées
  choice: Les pierres ont valeur de mémorial et portent des inscriptions correspondant aux fils d’Israël.
  alternative: Lire la description principalement comme celle d’un ouvrage précieux, sans accent particulier sur sa fonction mémorielle.
  rationale: L’hébreu לזכרון et le grec εἰς μνημόσυνον expriment explicitement la fonction de mémorial. La traduction la conserve sans préciser au-delà du texte la manière dont s’exerce cette commémoration.
- issue: Référent de « fils d’Israël »
  choice: Conserver dans le texte la formulation du témoin hébreu, « fils d’Israël ».
  alternative: Employer « tribus d’Israël », conformément au grec et au référent probable des noms inscrits.
  rationale: La priorité revient au témoin hébreu extant; la variante grecque éclaire le référent probable mais ne doit pas remplacer silencieusement la formulation hébraïque.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe nominale conserve le caractère descriptif du verset dans son contexte. « Pectoral », « montures » et « mémorial » maintiennent la précision cultuelle sans archaïsme excessif.
