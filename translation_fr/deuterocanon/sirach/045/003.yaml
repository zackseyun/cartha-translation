  text: At his word the signs came quickly[a], and he strengthened him before a king. He commanded him concerning the people[c][b], and showed him his glory.
translation:
  language: fr
  text: À sa parole, les signes se produisirent rapidement[a], et il le fortifia devant un roi[b]. Il lui donna des commandements pour le peuple, et lui montra sa gloire[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Par ses paroles, il fit cesser les signes », au lieu de « les signes se produisirent rapidement ».'
    reason: textual_variant
  - marker: b
    text: 'Le grec porte : « il le glorifia devant des rois », au lieu de « il le fortifia devant un roi ».'
    reason: textual_variant
  - marker: c
    text: 'L’hébreu transmis est difficile et pourrait se lire : « et ils virent sa gloire ». Le grec soutient le sens retenu dans le texte : « et lui montra sa gloire ».'
    reason: textual_variant
lexical_decisions:
- source_word: בדבריו
  choice: À sa parole
  rationale: Rend naturellement la valeur instrumentale ou circonstancielle de ב avec דבר. Le singulier collectif « parole » convient au français, tandis que le grec présente le pluriel « par ses paroles ».
- source_word: האותות
  choice: les signes
  rationale: Correspond directement à אותות et au grec σημεῖα, sans préciser excessivement qu’il s’agit de miracles.
- source_word: מהרו
  choice: se produisirent rapidement
  rationale: Le verbe hébreu exprime la hâte. Cette formulation française conserve cette idée sans personnifier maladroitement les signes.
- source_word: ויחזקהו
  choice: il le fortifia
  rationale: Le hiphil de חזק signifie normalement « fortifier » ou « rendre fort ». Le grec divergent, « il le glorifia », est signalé en note.
- source_word: לפני מלך
  choice: devant un roi
  rationale: L’hébreu a le singulier sans article défini. Le pluriel du grec constitue une variante textuelle.
- source_word: ויצוהו אל העם
  choice: Il lui donna des commandements pour le peuple
  rationale: צוה exprime l’action de commander, tandis que אל העם indique ici vraisemblablement la destination ou l’objet des commandements. La formulation reste naturelle tout en préservant cette relation quelque peu difficile.
- source_word: ויראו את כבודו
  choice: et lui montra sa gloire
  rationale: La forme hébraïque transmise semble littéralement signifier « et ils virent sa gloire », mais le grec atteste clairement « et lui montra de sa gloire ». Vu la difficulté du texte hébreu, le sens soutenu par le grec est retenu et la divergence signalée.
theological_decisions:
- issue: Choix du témoin principal en présence d’importantes divergences entre l’hébreu et le grec
  choice: Suivre l’hébreu lorsqu’il est intelligible, mais adopter pour la dernière proposition le sens soutenu par le grec.
  alternative: 'Traduire strictement la forme hébraïque transmise : « et ils virent sa gloire » ; ou suivre entièrement le grec : « Par ses paroles, il fit cesser les signes ; il le glorifia devant des rois… »'
  rationale: Cette solution respecte la priorité du témoin hébreu sans masquer l’instabilité de sa dernière proposition. Les variantes importantes sont conservées dans les notes plutôt que résolues silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu tout en évitant les tournures obscures. Les divergences substantielles du grec sont indiquées sans harmonisation doctrinale.
