base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/025.yaml
  text: 'And his covenant was with David son of Jesse, from the tribe of Judah: the inheritance of the king is from son to son alone, but the inheritance of Aaron is also for his offspring[a].'
translation:
  language: fr
  text: 'Son alliance fut aussi avec David, fils de Jessé, de la tribu de Juda : l’héritage du roi passe uniquement de fils en fils, tandis que l’héritage d’Aaron revient aussi à sa descendance[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin hébreu de ce passage est plus court et paraît comprimé; le grec conserve le contraste développé : l’héritage royal se transmet dans une seule lignée dynastique, tandis que l’héritage d’Aaron revient à sa descendance.'
    reason: textual_variant
lexical_decisions:
- source_word: וגם בריתו עם דוד
  choice: Son alliance fut aussi avec David
  rationale: Le suffixe de בריתו est conservé par « son alliance », dont Dieu est l’antécédent implicite dans le contexte. וגם est rendu par « aussi », qui relie l’alliance davidique à l’alliance sacerdotale précédente.
- source_word: בן ישי למטה יהודה
  choice: fils de Jessé, de la tribu de Juda
  rationale: בן ישי est un patronyme ordinaire. מטה désigne ici la tribu; la formulation française est naturelle et maintient l’accent généalogique.
- source_word: κληρονομία βασιλέως
  choice: l’héritage du roi
  rationale: Le grec préserve la formulation développée absente du témoin hébreu comprimé. « Héritage » rend directement κληρονομία et maintient le parallèle concret avec Aaron.
- source_word: υἱοῦ ἐξ υἱοῦ μόνου
  choice: passe uniquement de fils en fils
  rationale: Cette formulation exprime la succession dynastique linéaire et conserve la restriction portée par μόνου, sans préciser davantage quel fils succède.
- source_word: κληρονομία Ἀαρὼν καὶ τῷ σπέρματι αὐτοῦ
  choice: l’héritage d’Aaron revient aussi à sa descendance
  rationale: « Descendance » rend σπέρμα dans son sens collectif et généalogique. « Aussi » reflète καί et le contraste avec la succession royale unique.
theological_decisions:
- issue: Articulation des témoins hébreu et grec dans un passage signalé comme fortement divergent
  choice: Traduire en priorité la clause hébraïque conservée, puis employer le parallèle grec pour restituer le contraste développé entre la royauté davidique et le sacerdoce d’Aaron.
  alternative: Ne traduire que l’hébreu transmis, y compris la clause sur le grand sacerdoce perpétuel, ou suivre exclusivement le grec.
  rationale: Le texte hébreu fourni paraît composite ou déplacé au début du verset et sa transmission est signalée comme présentant une divergence majeure. La clause davidique hébraïque correspond au début grec, tandis que le grec conserve la suite antithétique. Le texte principal suit donc la structure attestée par le grec tout en gardant le libellé hébreu là où il est disponible; la note rend la situation textuelle transparente.
translation_notes:
  register: Français international moderne, digne et lisible. « Jessé », « Juda » et « Aaron » suivent les formes françaises bibliques usuelles. Le deux-points et « tandis que » rendent clairement le parallélisme sans effacer la tension textuelle.
