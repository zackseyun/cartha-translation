base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/007.yaml
  text: He put splendor upon him and ministered to him with his glory[b][a]; he girded him with the horns of a wild ox and clothed him with bells.
translation:
  language: fr
  text: Il mit sur lui la splendeur et le servit avec sa gloire.[a] Il le ceignit des cornes d’un bœuf sauvage[b] et le revêtit de clochettes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente un texte très différent : « Il conclut avec lui une alliance éternelle, lui donna le sacerdoce du peuple, le combla d’une parure et le ceignit d’un vêtement de gloire. »'
    reason: alternative_reading
  - marker: b
    text: 'Ou peut-être : « de la force imposante d’un bœuf sauvage ». L’expression hébraïque est difficile; l’image peut désigner métaphoriquement une force élevée plutôt que des cornes faisant littéralement partie de la parure.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוד
  choice: la splendeur
  rationale: Le terme désigne une majesté éclatante et visible. « Splendeur » convient au contexte d’investiture sans le confondre avec כבוד, rendu ensuite par « gloire ».
- source_word: וישרתהו
  choice: le servit
  rationale: Le verbe שרת signifie « servir, assurer un service auprès de ». La formulation hébraïque est inhabituelle puisque Dieu paraît être le sujet; la traduction en conserve donc la tension plutôt que de l’atténuer en « l’honora » ou « l’orna ».
- source_word: בכבודו
  choice: de sa gloire
  rationale: Cette traduction conserve le suffixe possessif et rend כבוד par le terme élevé et courant « gloire ». La préposition ב peut ici exprimer le moyen ou ce dont Dieu pourvoit Aaron.
- source_word: ויאזרהו
  choice: Il le ceignit
  rationale: אזר désigne l’action de ceindre ou de mettre une ceinture, particulièrement adaptée à l’habillement cérémoniel.
- source_word: בתועפות ראם
  choice: des cornes du buffle
  rationale: תועפות peut évoquer les cornes ou une force élevée, tandis que ראם désigne un bovidé sauvage. Le texte retient l’image concrète, mais une note signale l’interprétation métaphorique possible.
- source_word: וילבישהו פעמונים
  choice: le revêtit de clochettes
  rationale: פעמונים désigne des clochettes, comme celles du vêtement sacerdotal. « Revêtit de clochettes » restitue l’image vestimentaire sans suggérer qu’un vêtement entier serait fait de cloches.
theological_decisions:
- issue: Choix entre le texte hébreu et le parallèle grec fortement divergent
  choice: Suivre le texte hébreu conservé dans le corps du verset et donner le grec en note.
  alternative: 'Suivre le grec : « Il conclut avec lui une alliance éternelle, lui donna le sacerdoce du peuple, le combla d’une parure et le ceignit d’un vêtement de gloire. »'
  rationale: L’hébreu disponible constitue ici le texte principal, mais l’écart substantiel du grec ne doit être ni harmonisé ni dissimulé. La note permet de préserver les deux formes anciennes du passage.
- issue: Dieu présenté comme servant Aaron
  choice: Conserver le sens direct « le servit », malgré son caractère surprenant.
  alternative: « l’assista », « l’honora » ou, d’après la trajectoire grecque, « le combla d’une parure »
  rationale: La syntaxe hébraïque crée une tension réelle. Employer un verbe plus explicatif résoudrait silencieusement cette difficulté et affaiblirait le témoignage du texte.
translation_notes:
  register: Français international moderne, digne et cérémoniel. « Ceignit » et « revêtit » maintiennent le registre de l’investiture sacerdotale tout en restant compréhensibles. « Buffle » est employé comme désignation traditionnelle et accessible du ראם, bovidé sauvage ancien.
