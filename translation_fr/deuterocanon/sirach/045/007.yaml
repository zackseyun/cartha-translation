  rationale: La révision corrige une tournure française qui déformait ou obscurcissait la relation exprimée par le texte hébreu, sans résoudre artificiellement l’image difficile de Dieu servant Aaron. Elle emploie aussi « bœuf sauvage », rendu plus prudent de ראם, et met la note lexicale en cohérence avec ce choix. Les deux notes restent correctement ancrées et le parallèle grec substantiellement divergent est conservé.
