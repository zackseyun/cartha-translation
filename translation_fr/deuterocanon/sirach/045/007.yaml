  source_fidelity: 'Le texte suit fidèlement l’hébreu conservé : Dieu met la splendeur sur Aaron, le sert avec/dans sa gloire, le ceint de « cornes de bœuf sauvage » et le revêt de clochettes. La construction « le servit » demeure volontairement directe malgré son caractère surprenant, tandis que la note conserve la divergence majeure du grec.'
