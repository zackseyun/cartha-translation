translation:
  language: fr
  text: et des grenades en grand nombre tout autour[a], pour faire entendre une mélodie à chacun de ses pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente un texte plus développé : « il l’entoura de grenades et de nombreuses clochettes d’or tout autour, pour faire entendre un son à ses pas […] ». Le témoin hébreu est ici plus bref : il ne mentionne que les grenades et la mélodie accompagnant ses pas.'
    reason: textual_variant
lexical_decisions:
- source_word: ורמונים
  choice: et des grenades
  rationale: Le terme hébreu désigne concrètement des grenades, ici vraisemblablement les ornements en forme de grenade du vêtement sacerdotal. La traduction conserve cette image sans ajouter les clochettes mentionnées seulement dans le grec.
- source_word: המון
  choice: en grand nombre
  rationale: Le nom exprime la multitude ou l’abondance. « En grand nombre » est naturel en français et convient aux nombreux ornements.
- source_word: סביב
  choice: tout autour
  rationale: L’adverbe indique que les ornements entouraient le vêtement.
- source_word: לתת
  choice: pour faire entendre
  rationale: L’infinitif exprime ici le but ou le résultat. Avec un nom de son musical, « faire entendre » rend l’expression plus naturellement que le littéral « donner ».
- source_word: נעינה
  choice: une mélodie
  rationale: Le mot évoque un son musical. « Mélodie » en conserve la nuance sans introduire dans le texte principal les clochettes explicites du grec.
- source_word: בצעדיו
  choice: à chacun de ses pas
  rationale: La préposition rattache le son à ses mouvements. Cette formulation française exprime clairement que le son se faisait entendre lorsqu’il marchait, sans préciser davantage son mécanisme.
theological_decisions:
- issue: Choix entre le témoin hébreu bref et la forme grecque plus développée
  choice: Le texte principal suit le témoin hébreu conservé et bref; la leçon grecque plus longue est signalée en note.
  alternative: « Il l’entoura de grenades et de nombreuses clochettes d’or tout autour, pour faire entendre un son à ses pas… »
  rationale: Puisque l’hébreu est conservé avec une confiance élevée, ses éléments déterminent le texte principal. Le grec atteste toutefois une forme sensiblement plus longue, avec des clochettes d’or et une suite relative au temple et au souvenir; cette divergence textuelle importante doit rester visible sans être intégrée silencieusement à l’hébreu.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche de l’hébreu tout en employant une expression idiomatique pour le son produit pendant la marche. Le début en minuscule et la conjonction « et » préservent le caractère continu du verset dans son contexte.
