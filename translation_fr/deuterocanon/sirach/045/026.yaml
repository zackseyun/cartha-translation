  text: And now[a], please bless Yahweh[b], the good one.
translation:
  language: fr
  text: Et maintenant[a], je vous en prie, bénissez Yahvé[b], lui qui est bon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit : « Et maintenant, je vous en prie, bénissez Yahvé, lui qui est bon. » Le témoin grec présente ici un texte très différent : « Qu’il vous donne la sagesse dans votre cœur pour juger son peuple avec justice, afin que leurs biens ne disparaissent pas, ni leur gloire au fil de leurs générations. »'
    reason: textual_variant
  - marker: b
    text: L’hébreu porte le nom divin YHWH, rendu ici par « Yahvé »; certaines traductions emploient traditionnellement « le Seigneur ».
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois la valeur temporelle et la fonction de transition du syntagme hébreu.
- source_word: בָּרֲכוּ־נָא
  choice: je vous en prie, bénissez
  rationale: L’impératif est au pluriel et la particule נָא lui donne la nuance d’une invitation pressante ou courtoise; cette tournure reste naturelle en français.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit le nom divin YHWH sous sa forme française courante, au lieu de le remplacer silencieusement par un titre.
- source_word: הַטּוֹב
  choice: lui qui est bon
  rationale: L’adjectif défini est employé en apposition ou substantivement après le nom divin; cette formulation française exprime sa portée sans l’assimiler au titre « le Bon ».
- source_word: δόῃ ὑμῖν σοφίαν ἐν καρδίᾳ ὑμῶν…
  choice: non retenu dans le texte principal
  rationale: Le grec présente ici un texte très différent. Puisque le texte hébreu est conservé avec un degré élevé de confiance, il fonde la traduction principale; la leçon grecque est signalée en note.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: L’hébreu porte explicitement le tétragramme. La translittération française préserve le nom propre sans le remplacer par un titre.
- issue: Rapport entre les témoins hébreu et grec
  choice: Suivre l’exhortation du texte hébreu dans le corps du verset et donner le grec en note
  alternative: Adopter le texte grec comme texte principal ou fusionner les deux formes
  rationale: Le témoin hébreu est ici disponible et jugé sûr, tandis que le grec atteste une forme substantiellement différente qu’il convient de préserver sans créer un texte composite.
translation_notes:
  register: Français international moderne, digne et accessible. « Je vous en prie » restitue la nuance de נָא sans raideur; « lui qui est bon » évite de transformer l’adjectif en titre théologique technique.
