  yaml_path: translation/deuterocanon/sirach/045/008.yaml
  text: He clothed him with perfect splendor[a], and adorned him with glory and strength, with trousers, tunics, and a robe[b]; and he encircled him with bells.
translation:
  language: fr
  text: Il le revêtit d’une splendeur parfaite[a] et le para de gloire et de puissance, avec des sous-vêtements[b], des tuniques et un manteau ; puis il l’entoura de clochettes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’une parure d’une beauté parfaite ». L’expression hébraïque est concise et solennelle ; elle associe l’idée d’accomplissement à celle de splendeur ou de beauté.'
    reason: lexical_alternative
  - marker: b
    text: Les témoins hébreu et grec diffèrent dans le détail des vêtements sacerdotaux. L’hébreu mentionne ici des sous-vêtements, des tuniques, un manteau et des clochettes ; le grec présente une autre suite et comprend l’éphod.
    reason: textual_variant
lexical_decisions:
- source_word: וילבישהו
  choice: Il le revêtit
  rationale: Le hifil de לבש signifie faire porter un vêtement, donc « revêtir ». Ce verbe français est naturel dans un contexte cérémoniel et évite un vocabulaire ecclésiastique plus tardif.
- source_word: כליל תפארת
  choice: d’une splendeur parfaite
  rationale: כליל exprime ici l’intégralité ou l’accomplissement, tandis que תפארת désigne la beauté éclatante, la magnificence ou la gloire. « Splendeur parfaite » conserve la formulation compacte et élevée de l’hébreu.
- source_word: ויפארהו
  choice: le para
  rationale: Le verbe פאר évoque le fait de rendre beau, splendide ou glorieux. « Parer » convient concrètement aux vêtements sacerdotaux tout en gardant la valeur honorifique.
- source_word: בכבוד ועוז
  choice: de gloire et de puissance
  rationale: כבוד signifie « gloire » ou « honneur », et עוז « force » ou « puissance ». Ce couple rend la dignité et la force symboliques de la tenue.
- source_word: מכנסים
  choice: caleçons
  rationale: Le terme désigne le vêtement sacerdotal couvrant le bas du corps. « Caleçons » est plus précis dans ce contexte ancien que « pantalons » et plus concret que le terme général « sous-vêtements ».
- source_word: כתנות
  choice: tuniques
  rationale: כתנת désigne couramment une tunique dans les descriptions bibliques de vêtements. Le pluriel de l’hébreu est conservé.
- source_word: ומעיל
  choice: et d’un manteau
  rationale: מעיל désigne un vêtement de dessus, notamment dans le costume sacerdotal. « Manteau » est clair et digne en français courant.
- source_word: ויקיפהו
  choice: il l’entoura
  rationale: Le verbe exprime l’action d’entourer ou d’encercler. Ici, les clochettes se trouvent disposées autour du vêtement ; « l’entoura » conserve cette image sans ajouter la mention de l’ourlet.
- source_word: פעמונים
  choice: clochettes
  rationale: Le nom désigne les cloches fixées au vêtement sacerdotal. « Clochettes » correspond mieux à leur taille et à leur fonction que « cloches ». L’hébreu ne précise pas ici qu’elles sont en or.
theological_decisions:
- issue: Choix du témoin principal malgré l’écart important signalé entre l’hébreu et le grec
  choice: Suivre en priorité l’hébreu conservé, qui énumère les caleçons, les tuniques, le manteau et les clochettes, en utilisant le grec comme témoin parallèle.
  alternative: Suivre la séquence grecque, qui mentionne notamment le vêtement descendant jusqu’aux pieds et l’éphod.
  rationale: Le texte hébreu est substantiel et cohérent dans ce verset. Le grec confirme le contexte de l’habillement sacerdotal et le registre élevé, mais présente une liste différente. La variante est donc signalée sans fusionner artificiellement les deux témoins.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme excessif. « Revêtit » et « para » maintiennent la dignité cérémonielle ; « caleçons » et « clochettes » rendent concrètement les pièces nommées par l’hébreu. La ponctuation relie l’énumération à la gloire et à la puissance dont Aaron est paré.
