  text: His grain offering shall be burned up whole[a], every day, twice a day.
translation:
  language: fr
  text: Son offrande de céréales sera entièrement brûlée[a], deux fois par jour, de manière régulière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec parallèle dit : « Ses sacrifices seront entièrement consumés, continuellement, deux fois par jour. » Le témoin hébreu est plus précis : « son offrande de céréales ».'
    reason: Variante du grec parallèle par rapport au témoin hébreu.
lexical_decisions:
- source_word: מנחתו
  choice: Son offrande de céréales
  rationale: Dans ce contexte sacrificiel, מִנְחָה désigne spécifiquement une offrande de céréales plutôt qu’une offrande indéterminée; le suffixe possessif est conservé.
- source_word: כליל תקטר
  choice: sera brûlée tout entière
  rationale: קטר décrit l’action de faire monter l’offrande en fumée sur l’autel, tandis que כליל indique sa consommation totale. Cette formulation évite de la confondre avec l’holocauste désigné par עֹלָה.
- source_word: בכל יום
  choice: par jour
  rationale: L’expression temporelle est intégrée à « deux fois par jour », formulation française naturelle qui conserve la fréquence quotidienne.
- source_word: צמיד
  choice: sans interruption
  rationale: Le terme exprime ici la continuité ou la régularité durable du rite; « sans interruption » distingue cette idée de la simple fréquence quotidienne.
- source_word: פעמים
  choice: deux fois
  rationale: Avec le parallèle grec δίς, le sens est clairement « deux fois ».
theological_decisions:
- issue: Spécificité de l’offrande dans le contexte sacerdotal
  choice: Suivre l’hébreu avec « offrande de céréales ».
  alternative: « Ses sacrifices » selon le grec parallèle.
  rationale: Le témoin hébreu conservé est ici prioritaire et emploie le terme spécifique מנחתו; le grec présente une formulation plus générale qui mérite d’être signalée sans remplacer le texte hébreu.
translation_notes:
  register: Français international moderne, sobre et liturgiquement digne. « Brûlée tout entière » exprime la combustion complète sans employer le terme technique « holocauste ». La cadence finale rend séparément la fréquence biquotidienne et la continuité du rite.
