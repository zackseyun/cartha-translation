base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/021.yaml
  text: He gave him the choicest holy bread[a]; they shall eat the food offerings of Yahweh. The bread of the Presence is his portion[c][b], a gift to him and to his offspring.
translation:
  language: fr
  text: Il lui a donné comme nourriture la meilleure part des choses saintes[a] ; ils mangeront les offrandes faites par le feu pour Yahvé[b]. Le pain de la Présence[c] est sa part, un don pour lui et pour sa descendance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu peut aussi se traduire plus littéralement : « Il lui a donné comme pain la première part des choses saintes. » Sa formulation est très condensée ; le grec parle plus largement des sacrifices accordés aux prêtres.'
    reason: lexical_alternative
  - marker: b
    text: Expression sacrificielle traditionnellement rendue par « offrandes consumées » ou « offrandes faites par le feu ».
    reason: lexical_alternative
  - marker: c
    text: Le « pain de la Présence » est le pain sacré placé devant Dieu, traditionnellement appelé « pain de proposition ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ראשית קדש נתן לו לחם
  choice: Il lui a donné comme nourriture la meilleure part des choses saintes
  rationale: 'La formulation hébraïque est condensée : ראשית exprime ce qui vient en premier ou constitue la part principale, קדש désigne les choses consacrées, et לחם peut désigner le pain ou, plus largement, la nourriture. Cette traduction conserve l’idée d’une part sacrée privilégiée destinée à nourrir le prêtre, sans la réduire au seul pain.'
- source_word: אשי יהוה
  choice: les offrandes de Yahvé présentées par le feu
  rationale: אשי est un terme sacrificiel lié aux offrandes faites par le feu. La formulation française reste compréhensible tout en conservant cette dimension cultuelle, et le tétragramme est rendu par « Yahvé ».
- source_word: יאכלון
  choice: ils mangeront
  rationale: Le verbe est au pluriel et vise naturellement Aaron avec la lignée sacerdotale bénéficiaire. Le futur français respecte la forme verbale et sa valeur de disposition durable.
- source_word: לחם פנים
  choice: le pain de la Présence
  rationale: Cette expression cultuelle désigne le pain placé devant Dieu. « Pain de la Présence » est transparent et plus proche de l’hébreu que l’appellation traditionnelle « pains de proposition ».
- source_word: חלקו
  choice: est sa part
  rationale: חלק désigne la part attribuée à quelqu’un. Le présent exprime simplement le droit sacerdotal énoncé dans le texte.
- source_word: ומתנה לו ולזרעו
  choice: un don pour lui et pour sa descendance
  rationale: מתנה désigne un don ou une attribution, tandis que זרעו renvoie ici à la lignée d’Aaron. « Descendance » exprime clairement la continuité familiale et sacerdotale.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu porte directement le tétragramme. « Yahvé » conserve le nom divin plutôt que de le remplacer par un titre.
- issue: Nature des biens sacrés accordés aux prêtres
  choice: la meilleure part des choses saintes / les offrandes présentées par le feu
  alternative: le meilleur pain sacré / les sacrifices du Seigneur
  rationale: L’hébreu associe une expression très condensée sur la première ou principale part sacrée à לחם, puis emploie un terme technique pour les offrandes liées au feu. La traduction maintient à la fois l’idée de nourriture sacerdotale et le cadre sacrificiel, sans harmoniser entièrement l’hébreu avec le grec, qui parle plus largement des sacrifices du Seigneur.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste fluide tout en conservant le vocabulaire cultuel. Les notes signalent la forte condensation de l’hébreu et l’écart du parallèle grec sans résoudre artificiellement cette tension.
