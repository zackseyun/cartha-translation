  verdict: revise
  source_fidelity: 'Le texte rend fidèlement les deux propositions du témoin hébreu : des « étrangers/outsiders » s’irritent contre Aaron et le jalousent au désert. L’identification de Datan, Abiram et Coré, ainsi que le doublet de colère, relève du grec et est correctement signalée en note. « Les hommes qui entouraient Datan et Abiram » risque cependant d’évoquer une proximité physique ou une action passée plutôt que l’association indiquée par οἱ περὶ.'
  naturalness: La phrase est globalement claire, mais « ils furent jaloux de lui » est moins idiomatique et moins dynamique que « le jalousèrent ». Une formulation associant explicitement ces hommes à Datan et Abiram est plus naturelle en français moderne.
  terminology: « Désert », « Datan », « Abiram » et « Coré » conviennent aux usages bibliques français. « Étrangers » préserve utilement l’ambiguïté de זרים, qui ne doit pas être interprété d’emblée comme une désignation ethnique. « Assemblée de Coré » rend directement συναγωγή sans imposer un sens ecclésial moderne.
