base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/018.yaml
  text: Strangers grew angry with him[a], and in the wilderness they were jealous of him—men of Dathan and Abiram, and the company of Korah, in fury and wrath.
translation:
  language: fr
  text: 'Des étrangers s’enflammèrent de colère contre lui[a] et, dans le désert, le jalousèrent : les hommes associés à Datan et Abiram, ainsi que l’assemblée de Coré, pleins de fureur et de colère.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin hébreu conservé est plus court : « Des étrangers s’enflammèrent de colère contre lui et, dans le désert, le jalousèrent. » Le parallèle grec précise qu’il s’agit des hommes associés à Datan et Abiram et de l’assemblée de Coré, pleins de fureur et de colère.'
    reason: textual_variant
lexical_decisions:
- source_word: ויחרו בו
  choice: s’enflammèrent de colère contre lui
  rationale: Le verbe חרה construit avec ב exprime une colère qui s’embrase contre quelqu’un. Cette formulation française conserve l’image et indique clairement l’hostilité.
- source_word: זרים
  choice: des étrangers
  rationale: Le mot désigne littéralement des étrangers ou des personnes étrangères au groupe ou à la fonction. La traduction garde cette ambiguïté sans en faire nécessairement des non-Israélites.
- source_word: ויקנאו בו
  choice: furent jaloux de lui
  rationale: קנא peut exprimer la jalousie ou le zèle. Dans ce récit d’opposition à Aaron, la jalousie personnelle convient au contexte tout en restant proche du grec ἐζήλωσαν αὐτόν.
- source_word: במדבר
  choice: dans le désert
  rationale: « Désert » est l’équivalent français courant et bibliquement naturel pour le lieu des récits de l’Exode.
- source_word: ἄνδρες οἱ περὶ Δαθὰν καὶ Ἀβειρών
  choice: les hommes qui entouraient Datan et Abiram
  rationale: La tournure rend explicitement οἱ περὶ, c’est-à-dire les hommes associés à Datan et Abiram, sans les identifier de manière plus précise que le grec.
- source_word: ἡ συναγωγὴ Κόρε
  choice: le groupe de Coré
  rationale: « Groupe » désigne naturellement la faction rassemblée autour de Coré et évite les connotations ecclésiales modernes de « assemblée » ou « congrégation ».
- source_word: ἐν θυμῷ καὶ ὀργῇ
  choice: pleins de fureur et de colère
  rationale: Cette expression conserve le doublet intensif grec et rattache naturellement les deux sentiments aux opposants nommés.
theological_decisions:
- issue: Choix entre le témoin hébreu plus court et le parallèle grec plus développé
  choice: Suivre les deux propositions hébraïques dans le texte principal et y joindre, après deux-points, l’identification et l’intensification conservées par le grec.
  alternative: 'Traduire seulement l’hébreu : « Des étrangers s’enflammèrent de colère contre lui et, dans le désert, ils furent jaloux de lui. »'
  rationale: L’hébreu conservé est prioritaire, mais le grec offre ici un développement ancien et pertinent qui nomme les opposants. La note signale clairement que cette partie n’apparaît pas dans le témoin hébreu existant, sans trancher si elle est originelle ou explicative.
translation_notes:
  register: 'Français international moderne, digne et accessible. La syntaxe reste proche du parallélisme hébreu, tandis que les deux-points introduisent clairement le développement propre au grec. Les noms suivent les formes françaises usuelles : Datan, Abiram et Coré.'
