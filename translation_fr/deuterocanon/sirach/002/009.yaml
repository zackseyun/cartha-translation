base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/009.yaml
  text: You who fear Yahweh[a], hope for good[b], and for everlasting joy and mercy.
translation:
  language: fr
  text: Vous qui craignez Yahweh, espérez le bien[a], ainsi que la joie éternelle et la miséricorde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « des biens », au pluriel.
    reason: alternative_reading
  - marker: b
    text: Le mot hébreu peut aussi se traduire par « amour fidèle » ou « bonté »; le grec parallèle porte également « miséricorde ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  choice: Vous qui craignez Yahweh
  rationale: Le participe pluriel fonctionne comme une adresse directe. Cette formulation conserve la force exhortative du vocatif et rend explicitement le nom divin.
- source_word: קַוּוּ
  choice: espérez
  rationale: L’impératif exprime une attente confiante. « Espérez » correspond à la fois à l’hébreu et au grec ἐλπίσατε, sans réduire le sens à la seule attente temporelle.
- source_word: לְטוֹב
  choice: le bien
  rationale: Le singulier hébreu désigne le bien de manière générale et ouverte. Le grec emploie toutefois un pluriel, signalé en note.
- source_word: וּלְשִׁמְחַת עוֹלָם
  choice: ainsi que la joie éternelle
  rationale: « Joie éternelle » rend naturellement שִׂמְחָה et la durée exprimée par עוֹלָם. « Ainsi que » relie clairement les compléments coordonnés de l’impératif.
- source_word: וָחֶסֶד
  choice: et la miséricorde
  rationale: Dans cette série de bienfaits espérés, « miséricorde » convient au contexte et concorde avec le grec ἐλέους, tout en laissant les autres nuances de חֶסֶד à la note.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: « Yahweh » représente directement le tétragramme hébreu, tandis que le grec parallèle suit la convention révérencielle avec Κύριον.
- issue: Priorité du témoin hébreu malgré l’écart de validation signalé
  choice: Traduire d’abord l’hébreu conservé, en contrôlant le sens par le grec
  alternative: Suivre exclusivement le grec, notamment son pluriel « des biens »
  rationale: Le texte hébreu est suffisamment stable pour servir de source principale. Le grec confirme le sens général, mais sa divergence de nombre pour « bien » mérite d’être conservée en note plutôt que nivelée.
- issue: Étendue sémantique de חֶסֶד
  choice: miséricorde
  alternative: amour fidèle
  rationale: « Miséricorde » s’accorde avec le grec et convient à un bienfait attendu de Dieu. Une traduction par « amour fidèle » mettrait davantage en avant la loyauté durable; cette possibilité demeure indiquée en note afin de ne pas supprimer l’ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. L’adresse directe et l’impératif maintiennent le ton exhortatif. Les deux notes sont placées après les mots auxquels elles se rapportent, corrigeant ainsi le décalage apparent des marqueurs dans la couche anglaise de consultation.
