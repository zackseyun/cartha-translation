  text: For the LORD is compassionate and gracious; he forgives sins and saves in a time of distress.
translation:
  language: fr
  text: Car le SEIGNEUR est compatissant et plein de grâce ; il pardonne les péchés et sauve au temps de la détresse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָחוּם
  choice: compatissant
  rationale: Rend directement l’idée de compassion et s’accorde naturellement avec le second adjectif.
- source_word: חַנּוּן
  choice: plein de grâce
  rationale: Exprime la disposition bienveillante et généreuse de Dieu sans réduire le terme à la seule pitié.
- source_word: יְהֹוָה
  choice: le SEIGNEUR
  rationale: Convention française courante pour le tétragramme, qui distingue le nom divin du simple titre « Seigneur ».
- source_word: לַעֲוֹנוֹת
  choice: les péchés
  rationale: Traduction claire et idiomatique du pluriel ; le grec parallèle ἁμαρτίας confirme ici le sens général de péchés.
- source_word: בְּעֵת צָרָה
  choice: au temps de la détresse
  rationale: Conserve la construction temporelle et le sens de צרה comme situation d’angoisse ou de détresse.
theological_decisions:
- issue: Nature du pardon exprimé par וְסוֹלֵחַ
  choice: « il pardonne les péchés »
  alternative: « il remet les fautes »
  rationale: La formulation retenue reste générale et théologiquement non restrictive, tout en étant immédiatement compréhensible.
- issue: Expression du nom divin יהוה
  choice: « le SEIGNEUR »
  alternative: « YHWH » ou « Yahvé »
  rationale: La petites capitales suivent l’usage biblique français largement reconnu sans imposer une vocalisation reconstruite.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve le parallélisme hébreu et son affirmation directe, avec une ponctuation fluide.
