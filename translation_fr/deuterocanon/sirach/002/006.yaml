  text: Trust in him[a], and he will uphold you; make your ways straight[b], and hope in him.
translation:
  language: fr
  text: Mets ta confiance en lui[a], et il te soutiendra ; rends tes chemins droits[b] et espère en lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « crois en lui » ou « fais-lui confiance ». L’hébreu et le grec peuvent exprimer une confiance sur laquelle on s’appuie, et non une simple adhésion intellectuelle.
    reason: lexical_alternative
  - marker: b
    text: 'La proposition centrale est rendue comme une exhortation, conformément à la forme impérative de l’hébreu et du grec. Certaines traductions la comprennent plutôt comme une promesse : « il dirigera » ou « il rendra droits tes chemins ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הַאֲמֵן בּוֹ / πίστευσον αὐτῷ
  choice: Mets ta confiance en lui
  rationale: L’impératif hébreu de la racine אמן au hifil, confirmé par le grec πιστεύω, exprime ici une confiance personnelle et active, non une simple adhésion intellectuelle. Cette formulation est naturelle en français et conserve l’idée d’appui confiant.
- source_word: יַחֲזִיק בְּךָ / ἀντιλήμψεται σου
  choice: il te soutiendra
  rationale: L’hébreu החזיק ב peut évoquer le fait de tenir fermement quelqu’un, de l’appuyer ou de le soutenir ; le grec ἀντιλαμβάνομαι présente également l’idée de saisir pour porter secours. « Soutiendra » restitue clairement cette aide qui affermit.
- source_word: יַשֵּׁר אָרְחוֹתֶיךָ / εὐθύνας τὰς ὁδούς σου
  choice: rends droits tes chemins
  rationale: L’hébreu et le grec présentent une forme impérative signifiant rendre droit. La traduction maintient l’exhortation adressée au lecteur ainsi que la métaphore des chemins pour désigner la conduite ou le cours de la vie.
- source_word: וְקַוֵּה אֵלָיו / καὶ ἔλπισον ἐπʼ αὐτόν
  choice: et espère en lui
  rationale: Le verbe hébreu קוה peut exprimer l’attente confiante ou l’espérance, tandis que le grec ἐλπίζω confirme nettement le sens d’espérer. « Espère en lui » rend de façon concise le témoignage conjoint des deux sources.
theological_decisions:
- issue: Sujet et valeur de la proposition centrale
  choice: 'L’impératif s’adresse au lecteur : « rends droits tes chemins »'
  alternative: 'Comprendre la proposition comme une promesse dont Dieu est le sujet : « il dirigera » ou « il rendra droits tes chemins »'
  rationale: La forme hébraïque יַשֵּׁר et le grec εὐθύνας s’inscrivent dans une suite d’impératifs. La syntaxe favorise donc la poursuite de l’exhortation adressée au lecteur, sans nier que certaines traditions de traduction ont compris Dieu comme sujet.
translation_notes:
  register: Français international moderne, sobre et digne. « Mets ta confiance » et « espère en lui » gardent le registre sapientiel sans archaïsme ; « chemins » préserve la métaphore traditionnelle de la conduite humaine.
