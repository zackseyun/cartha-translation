  text: For gold is tested in fire[a], and men who are accepted, in the furnace of affliction.
translation:
  language: fr
  text: Car l’or est éprouvé par le feu, et les êtres humains, dans le creuset de l’affliction.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le second membre hébreu est elliptique et se lit littéralement : « les êtres humains dans le creuset de l’affliction ». Le grec parallèle porte : « les êtres humains agréés dans une fournaise d’humiliation ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יִבָּחֵן
  choice: est éprouvé
  rationale: Le verbe בחן exprime la mise à l’épreuve ou la vérification. « Est éprouvé » convient au registre sapientiel et n’ajoute pas le résultat que suggérerait « est purifié ».
- source_word: זָהָב
  choice: l’or
  rationale: Équivalent français direct et naturel.
- source_word: בְּנֵי אָדָם
  choice: les êtres humains agréés
  rationale: L’expression hébraïque désigne les humains. La qualification « agréés » s’appuie sur le grec parallèle ἄνθρωποι δεκτοί, qui éclaire ici une formulation hébraïque difficile, tout en évitant le masculin générique moins inclusif « les hommes ».
- source_word: בְּכוּר
  choice: agréés / au creuset
  rationale: La forme transmise est difficile dans ce contexte. Le grec parallèle offre δεκτοί (« agréés ») et καμίνῳ (« fournaise, creuset »), ce qui permet de restituer le parallélisme entre l’or éprouvé et les personnes mises à l’épreuve.
- source_word: עֹנִי
  choice: affliction
  rationale: Le nom peut désigner l’affliction, la misère ou l’humiliation. « Affliction » conserve une portée assez large et correspond au contexte de l’épreuve.
- source_word: καμίνῳ
  choice: au creuset
  rationale: Le témoin grec explicite l’image métallurgique sous-entendue dans la ligne hébraïque. « Creuset » forme en français un parallèle naturel avec l’or éprouvé au feu.
theological_decisions:
- issue: Recours au parallèle grec pour éclairer le second membre hébraïque
  choice: Comprendre que les êtres humains agréés sont éprouvés au creuset de l’affliction
  alternative: 'Traduire mécaniquement : « et les êtres humains dans le creuset de l’affliction », ou comprendre בְּכוּר comme « premier-né » ou « choisi »'
  rationale: Le texte hébreu conservé présente une difficulté contextuelle. Le grec parallèle atteste clairement des « êtres humains agréés » dans une « fournaise d’humiliation ». La traduction garde l’ancrage hébraïque, utilise le grec comme témoin réel et préserve le parallélisme sans introduire une doctrine d’élection.
translation_notes:
  register: Français international moderne, digne et accessible. « Éprouvé » maintient la nuance de mise à l’épreuve; « creuset » conserve avec concision l’image métallurgique. La ponctuation elliptique reproduit le parallélisme du proverbe sans ajouter un second verbe absent.
