  source_fidelity: La première proposition rend fidèlement כִּי בָאֵשׁ יִבָּחֵן זָהָב. Dans le second membre, le texte hébreu conservé porte littéralement « les êtres humains dans le creuset/fourneau de l’affliction » (בני אדם בכור עני). Il ne qualifie pas explicitement les humains d’« agréés ». Cette qualification provient du grec parallèle (ἄνθρωποι δεκτοί) et ne devrait pas être intégrée sans signalement au texte principal lorsque l’hébreu offre une lecture différente et intelligible.
  naturalness: « Car l’or est éprouvé par le feu, et les êtres humains, dans le creuset de l’affliction » est un français moderne, sobre et sapientiel. L’ellipse du second membre reproduit naturellement le parallélisme proverbial sans introduire de verbe absent.
  terminology: « Éprouvé » convient à בחן. « Creuset » rend bien כור dans l’image métallurgique; « affliction » demeure une option française juste pour עני. « Êtres humains » est international et évite d’induire un genre masculin spécifique.
