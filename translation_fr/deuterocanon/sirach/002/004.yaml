  text: Accept whatever comes upon you, and in the changes of your humiliation be patient.
translation:
  language: fr
  text: Accepte tout ce qui t’arrive et, dans ton accablement[a], prends patience.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, en hébreu : « dans ton brisement ». Le grec parallèle porte : « dans les changements de ton humiliation ».'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַבָּא עָלֶיךָ
  choice: tout ce qui t’arrive
  rationale: Cette formulation naturelle rend littéralement l’idée de « tout ce qui vient sur toi » et conserve la portée indéfinie de l’hébreu. Le grec parallèle confirme qu’il s’agit de tout ce qui peut être imposé à quelqu’un.
- source_word: קַבֵּל
  choice: accepte
  rationale: L’impératif invite à recevoir sans résistance les circonstances qui surviennent. « Accepte » est plus idiomatique ici que « reçois », tandis que « accueille » suggérerait une disposition trop positive.
- source_word: וּבְשִׁבְרְךָ
  choice: dans ton accablement[a]
  rationale: L’hébreu évoque littéralement le fait d’être brisé. « Accablement » exprime en français courant une condition d’abaissement et de détresse sans réduire l’expression à une émotion passagère. La note conserve la formulation plus littérale et signale le parallèle grec divergent.
- source_word: הַאֲרֵךְ רוּחַ
  choice: prends patience
  rationale: L’expression signifie littéralement « allonge le souffle/l’esprit » et désigne une endurance patiente. « Prends patience » convient à l’exhortation et traduit naturellement l’idée confirmée par le grec μακροθύμησον.
theological_decisions:
- issue: Articulation du témoin hébreu principal et du parallèle grec dans le second membre
  choice: Le texte principal suit l’hébreu en évoquant l’état d’accablement ou de brisement, tandis qu’une note expose la divergence grecque.
  alternative: « dans les vicissitudes de ton humiliation »
  rationale: Le texte hébreu conservé ne contient pas explicitement l’idée de changements ou de vicissitudes. Le grec peut refléter une forme plus développée, mais l’introduire directement dans le texte principal donnerait la priorité au parallèle sur le témoin hébreu. La note préserve honnêtement les deux données sans les fusionner artificiellement.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement singulier reproduit l’adresse directe de l’hébreu. « Accablement » reste intelligible tout en conservant la gravité du contexte; « prends patience » donne à l’exhortation une tournure naturelle.
