  text: Woe to the heart that does not trust[a], for it also will not stand.
translation:
  language: fr
  text: 'Malheur au cœur qui ne croit pas[a] : lui non plus ne tiendra pas debout.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Malheur au cœur sans force, parce qu’il ne croit pas ; c’est pourquoi il ne sera pas protégé. » L’hébreu dit simplement « cœur » et « ne tiendra pas debout ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹי
  choice: Malheur
  rationale: Cette interjection conserve la force de lamentation et d’avertissement propre au registre sapientiel et prophétique.
- source_word: לְלֵב
  choice: au cœur
  rationale: Le « cœur » désigne ici la personne intérieure, notamment sa volonté et sa disposition. Le terme préserve l’anthropologie hébraïque et correspond au grec καρδίᾳ.
- source_word: אֲשֶׁר לֹא יַאֲמִין
  choice: qui ne croit pas
  rationale: Le verbe אמן peut exprimer le fait de croire ou de faire confiance. « Croire » demeure naturel en français sans préciser silencieusement un complément absent du texte et conserve l’ambiguïté entre conviction et confiance.
- source_word: וְאַף הוּא
  choice: lui non plus
  rationale: Cette tournure française rend l’insistance portée par וְאַף הוּא et relie naturellement l’absence de foi à sa conséquence.
- source_word: לֹא יָקוּם
  choice: ne tiendra pas debout
  rationale: Le verbe קום signifie littéralement se lever ou se tenir debout. Cette formulation conserve l’image hébraïque tout en suggérant l’incapacité à demeurer ferme.
theological_decisions:
- issue: Sens du verbe de foi ou de confiance dans l’exhortation sapientielle
  choice: qui ne croit pas
  alternative: qui ne fait pas confiance / qui n’a pas foi
  rationale: L’hébreu אמן et le grec πιστεύει couvrent ici les notions liées de croire et de faire confiance. « Croire » préserve cette amplitude sans introduire une abstraction doctrinale ni ajouter explicitement un objet absent du verset.
- issue: Conséquence exprimée par קום
  choice: ne tiendra pas debout
  alternative: ne subsistera pas / ne se relèvera pas
  rationale: 'La traduction retient l’image concrète de l’hébreu et laisse ouverte sa portée exacte : fermeté, endurance ou survie dans l’épreuve.'
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve l’image du cœur et celle de la station debout, tout en signalant en note la lecture grecque sensiblement différente.
