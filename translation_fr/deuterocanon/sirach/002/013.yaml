  source_fidelity: 'Le texte français rend fidèlement l’hébreu composite : « Malheur » reproduit אוֹי, « cœur » conserve לֵב, « qui ne croit pas » respecte l’ambivalence croire/faire confiance de יַאֲמִין sans ajouter d’objet, et « ne tiendra pas debout » maintient l’image de לֹא יָקוּם. « Lui non plus » rend de façon acceptable l’insistance de וְאַף הוּא. La note signale correctement la divergence substantielle du grec parallèle, sans la confondre avec le texte hébreu retenu.'
