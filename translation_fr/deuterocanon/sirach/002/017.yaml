base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/017.yaml
  text: Those who fear Yahweh will prepare their hearts[a], and before him they will humble their spirits.
translation:
  language: fr
  text: Ceux qui craignent Yahweh prépareront leur cœur et, devant lui, ils humilieront leur esprit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec porte : « ils humilieront leur âme ». Le témoin hébreu lit « leur esprit », retenu dans le texte.'
    reason: Variante lexicale entre les témoins hébreu et grec.
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  choice: ceux qui craignent Yahweh
  rationale: Cette formulation naturelle conserve l’expression biblique de la crainte de Dieu et rend directement le nom divin.
- source_word: יָכִינוּ לְבָבָם
  choice: prépareront leur cœur
  rationale: Le hifil de כון peut signifier « préparer », « rendre prêt » ou « affermir ». « Prépareront leur cœur » convient au contexte moral et correspond au parallèle grec ἑτοιμάσουσιν.
- source_word: לְבָבָם
  choice: leur cœur
  rationale: Le cœur désigne ici la personne intérieure, notamment sa volonté et sa pensée. La métaphore biblique reste claire en français.
- source_word: וּלְפָנָיו
  choice: devant lui
  rationale: Cette traduction directe préserve l’idée d’une attitude adoptée en sa présence.
- source_word: יַכְנִיעוּ רוּחָם
  choice: ils humilieront leur esprit
  rationale: L’hébreu mentionne explicitement « leur esprit ». Cette formulation maintient ce terme anthropologique et le sens causatif du verbe, sans le réduire à « ils s’humilieront ».
theological_decisions:
- issue: Traduction du nom divin יְהֹוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom divin plutôt que de le remplacer par un titre.
- issue: Esprit dans l’hébreu et âme dans le grec
  choice: leur esprit
  alternative: leur âme
  rationale: Le témoin hébreu, source principale ici, porte רוּחָם, « leur esprit ». Le parallèle grec lit τὰς ψυχὰς αὐτῶν, « leurs âmes » ; cette variante est signalée en note sans harmoniser les deux traditions.
translation_notes:
  register: Français international moderne, sobre et digne. Le futur et le parallélisme de l’hébreu sont conservés. Les singuliers distributifs « leur cœur » et « leur esprit » suivent la forme hébraïque et restent naturels en français.
