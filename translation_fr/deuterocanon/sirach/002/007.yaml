  text: You who fear Yahweh[a], wait for his mercy, and do not turn aside, lest you fall.
translation:
  language: fr
  text: Vous qui craignez Yahweh, attendez sa miséricorde et ne vous détournez pas, de peur de tomber.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה / οἱ φοβούμενοι Κύριον
  choice: Vous qui craignez Yahweh
  rationale: Le construit pluriel hébreu, confirmé par le participe grec employé comme adresse, interpelle directement ceux qui révèrent Dieu. « Vous qui craignez » conserve cette force exhortative, et le tétragramme est rendu par « Yahweh ».
- source_word: חַכּוּ / ἀναμείνατε
  choice: attendez
  rationale: L’impératif exprime une attente patiente orientée vers la miséricorde divine. En français, « attendre sa miséricorde » est naturel et reste plus proche du texte que « espérer en ».
- source_word: לְחַסְדּוֹ / τὸ ἔλεος αὐτοῦ
  choice: sa miséricorde
  rationale: חסד peut désigner la bonté fidèle ou l’amour constant, mais le parallèle grec ἔλεος appuie nettement « miséricorde » dans ce contexte.
- source_word: וְאַל תִּטּוּ / καὶ μὴ ἐκκλίνητε
  choice: ne vous détournez pas
  rationale: Le verbe évoque le fait de quitter une direction ou une voie. Cette formulation française préserve la métaphore sans préciser indûment la nature de l’écart.
- source_word: פֶּן תִּפֹלוּ / ἵνα μὴ πέσητε
  choice: de peur de tomber
  rationale: פן introduit ici une conséquence redoutée. « De peur de tomber » conserve la portée d’avertissement et l’ambiguïté du type de chute.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahweh » représente le nom propre plutôt que de le remplacer par un titre; le grec « Seigneur » témoigne de la tradition de substitution.
- issue: Nuance de חסד à la lumière du parallèle grec
  choice: miséricorde
  alternative: amour fidèle
  rationale: Le champ sémantique hébreu permet « amour fidèle », mais le grec ἔλεος favorise « miséricorde » ici. Le choix n’impose donc pas une nuance d’alliance plus explicite que celle mise en avant par les témoins parallèles.
translation_notes:
  register: Français international moderne, digne et directement exhortatif. La syntaxe reste concise; « craignez » exprime ici la révérence envers Dieu, tandis que « tomber » demeure volontairement non spécifié.
