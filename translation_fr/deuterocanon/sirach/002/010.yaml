base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/010.yaml
  text: 'Look to the generations of old and see: who believed in Yahweh and was put to shame? Or who trusted in him and was abandoned? Or who called on him and was not answered?[a][b]'
translation:
  language: fr
  text: 'Regardez les générations d’autrefois : qui a cru en Yahweh et a été couvert de honte ? Ou qui a placé sa confiance en lui et a été abandonné ?[a] Ou qui l’a appelé et n’a pas reçu de réponse ?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « Ou qui est demeuré dans la crainte de lui et a été abandonné ? » L’hébreu conservé porte : « qui a placé sa confiance en lui et a été abandonné ? »'
    reason: alternative_reading
  - marker: b
    text: 'Grec : « Ou qui l’a appelé, et il l’a négligé ? » L’hébreu porte : « qui l’a appelé et n’a pas reçu de réponse ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבִּיטוּ לְדוֹרוֹת רִאשׂוֹנִים
  choice: Regardez les générations d’autrefois
  rationale: L’impératif pluriel invite les destinataires à considérer les générations passées comme témoins historiques. « D’autrefois » est naturel, digne et moins archaïque que « des temps anciens ».
- source_word: הֶאֱמִין בַּיהוָה
  choice: a cru en Yahweh
  rationale: « Croire en » rend ici האמין avec sa nuance de foi et de confiance, tout en maintenant une distinction lexicale avec בטח dans la proposition suivante.
- source_word: וַיֵּבוֹשׁ
  choice: a été couvert de honte
  rationale: Cette formulation exprime la honte résultant d’une confiance qui se serait révélée vaine, conformément au sens de בוש et au parallèle grec κατῃσχύνθη.
- source_word: בָּטַח בּוֹ
  choice: a placé sa confiance en lui
  rationale: בטח désigne l’assurance et la confiance placées en quelqu’un. Cette traduction française est idiomatique et préserve la différence avec האמין.
- source_word: וְנֶעֱזַב
  choice: a été abandonné
  rationale: Le passif de עזב indique que la personne a été laissée sans secours ; « abandonné » en donne le sens directement.
- source_word: קָרָא אֵלָיו
  choice: l’a appelé
  rationale: L’expression décrit un appel adressé à Dieu, probablement dans la prière. « L’a appelé » reste direct sans ajouter explicitement une notion absente du texte.
- source_word: וְלֹא נֶעֱנָה
  choice: n’a pas reçu de réponse
  rationale: Le passif de ענה signifie que l’appelant n’a pas été répondu. Cette tournure est naturelle en français et évite la connotation plus spécifiquement favorable d’« exaucé ».
- source_word: ἐνέμεινεν τῷ φόβῳ αὐτοῦ
  choice: non retenu dans le texte principal
  rationale: Le grec présente ici une leçon différente, « est demeuré dans sa crainte ». Le texte principal suit l’hébreu conservé, de haute confiance, et signale la variante grecque en note.
- source_word: ὑπερεῖδεν αὐτόν
  choice: non retenu dans le texte principal
  rationale: Le grec demande si Dieu a négligé celui qui l’appelait, tandis que l’hébreu dit que celui-ci n’a pas reçu de réponse. La traduction suit l’hébreu et conserve la nuance grecque en note.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahweh » conserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Divergence entre les témoins hébreu et grec
  choice: Suivre l’hébreu dans le texte principal et documenter les variantes grecques
  alternative: Adopter les formulations grecques dans le texte principal
  rationale: L’hébreu est conservé ici avec un haut degré de confiance. Les différences substantielles du grec restent néanmoins visibles en notes afin de ne pas effacer l’histoire textuelle.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Les trois questions parallèles sont conservées, de même que la distinction entre האמין (« croire en ») et בטח (« placer sa confiance en »). L’ajout grec « et voyez » n’est pas introduit dans le texte principal, puisqu’il n’apparaît pas dans le témoin hébreu fourni.
