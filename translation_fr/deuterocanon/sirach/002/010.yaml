  terminology: « Yahweh » correspond au tétragramme explicite et à la convention fournie. Les choix « croire en », « placer sa confiance » et « recevoir une réponse » sont cohérents, idiomatiques et ne chargent pas le texte d’une interprétation confessionnelle. Les deux notes rendent compte avec exactitude des divergences significatives du grec et sont correctement ancrées.
