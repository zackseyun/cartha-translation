  source_fidelity: 'Le texte français suit fidèlement l’hébreu conservé : l’impératif « Regardez », les générations antérieures, puis les trois questions parallèles. « A cru en Yahweh » rend היטיב הֶאֱמִין avec une distinction justifiée par rapport à « a placé sa confiance en lui » pour בָּטַח. « A été couvert de honte », « a été abandonné » et « n’a pas reçu de réponse » rendent correctement les verbes hébreux. L’absence de l’ajout grec « et voyez » est appropriée puisque le texte principal suit l’hébreu attesté.'
