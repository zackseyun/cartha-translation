  text: Those who fear Yahweh will not rebel against his ways[a], and those who love him will keep his paths.
translation:
  language: fr
  text: Ceux qui craignent Yahweh ne se révolteront pas contre ses voies[a], et ceux qui l’aiment garderont ses sentiers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le parallèle grec porte « ne désobéiront pas à ses paroles » au lieu de l’hébreu « ne se révolteront pas contre ses voies ». Le témoin hébreu de la Guéniza du Caire est suivi ici; le grec exprime néanmoins la même idée générale d’obéissance fidèle.
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  choice: ceux qui craignent Yahweh
  rationale: Le participe désigne ceux que caractérise la crainte de Dieu. « Craignent » conserve la force propre au langage sapientiel et d’alliance, tandis que « Yahweh » rend directement le nom divin.
- source_word: לֹא יַמְרוּ
  choice: ne se révolteront pas
  rationale: Le verbe מרה exprime ordinairement la rébellion ou l’insoumission délibérée, sens plus fort qu’une simple désobéissance.
- source_word: בִּדְרָכָיו
  choice: contre ses voies
  rationale: Avec מרה, la préposition ב peut introduire ce contre quoi la rébellion est dirigée. « Contre ses voies » explicite naturellement ce rapport en français.
- source_word: וְאוֹהֲבָיו
  choice: ceux qui l’aiment
  rationale: Cette formulation française naturelle conserve le caractère personnel de l’amour exprimé par le participe et son suffixe.
- source_word: יִצְרוּ
  choice: garderont
  rationale: נצר signifie garder, préserver ou observer avec soin. « Garderont » convient au contexte d’obéissance fidèle tout en préservant l’idée de vigilance.
- source_word: אָרְחוֹתָיו
  choice: ses sentiers
  rationale: « Sentiers » rend l’image du cheminement et maintient la variation poétique avec דְּרָכָיו, traduit par « voies » dans le premier membre.
theological_decisions:
- issue: Traduction du nom divin יְהֹוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: L’hébreu porte directement le tétragramme. « Yahweh » conserve ici le nom personnel de Dieu plutôt que de le remplacer par un titre.
- issue: Force de מרה
  choice: se révolter contre
  alternative: désobéir à
  rationale: Le texte hébreu évoque une opposition rebelle, tandis que le parallèle grec formule plus directement la désobéissance. La traduction suit le témoin hébreu principal sans effacer la variante grecque, signalée en note.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme poétique est conservé par « voies » et « sentiers »; « se révolter » maintient la vigueur de l’hébreu sans alourdir la phrase.
