base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/014.yaml
  text: Woe to you who have lost hope[b][a]; what will you do at the visitation of Yahweh?
translation:
  language: fr
  text: Malheur à vous qui avez perdu l’espérance[a] ! Que ferez-vous quand le Seigneur interviendra[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « qui avez perdu la persévérance », ou « la patience », là où l’hébreu dit « l’espérance ».'
    reason: alternative_reading
  - marker: b
    text: L’hébreu peut désigner l’attention active ou l’intervention du Seigneur, souvent en vue du jugement dans un contexte comme celui-ci.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹי
  choice: Malheur à vous
  rationale: Cette formule conserve la force à la fois lamentative et menaçante de l’interjection hébraïque, dans un français biblique actuel et intelligible.
- source_word: אוֹבְדֵי תִּקְוָה
  choice: qui avez perdu l’espérance
  rationale: L’hébreu décrit le plus naturellement ceux dont l’espérance est perdue. « Espérance » convient au registre sapientiel et religieux sans modifier le sens fondamental de תִּקְוָה.
- source_word: פְקוֹד
  choice: quand … interviendra
  rationale: Le terme issu de פקד désigne l’attention active ou l’intervention de Dieu, qui peut prendre la forme du jugement ou de la faveur. Le contexte est menaçant, mais « interviendra » évite de réduire explicitement le terme à « punira ».
- source_word: יְהֹוָה
  choice: le Seigneur
  rationale: Rend le tétragramme selon l’usage français établi et la tradition juive de révérence.
theological_decisions:
- issue: Faut-il expliciter l’intervention divine comme une punition ?
  choice: quand le Seigneur interviendra
  alternative: quand le Seigneur vous punira
  rationale: La racine פקד est plus large que la seule punition. La formule choisie préserve cette amplitude sémantique, tandis que « Malheur » et la question rhétorique maintiennent clairement la portée menaçante du contexte.
- issue: Faut-il suivre l’hébreu « espérance » ou le grec « persévérance/patience » ?
  choice: espérance dans le texte principal
  alternative: persévérance ou patience
  rationale: Le témoin hébreu est disponible et prioritaire. La leçon grecque est néanmoins significative et figure en note afin de conserver la variation ancienne.
translation_notes:
  register: Français international moderne, naturel et digne. « Malheur à vous » conserve la vigueur prophétique ; « espérance » maintient le registre sapientiel. La formulation verbale « quand le Seigneur interviendra » est plus idiomatique que « lors de la visitation », tout en laissant la note préciser l’étendue du terme hébreu.
