  text: My son[a], if you draw near to serve Yahweh, prepare yourself for every trial.
translation:
  language: fr
  text: Mon fils, si tu t’approches pour servir Yahweh, prépare-toi à toute épreuve[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « prépare ton âme à toute mise à l’épreuve ». Le grec peut aussi se comprendre : « prépare ton âme à la tentation » ou « à l’épreuve ».'
    reason: La note préserve le sens littéral de נפשך et l’étendue sémantique de ניסיון / πειρασμόν.
lexical_decisions:
- source_word: בְּנִי
  choice: Mon fils
  rationale: L’hébreu est un singulier masculin explicite et conserve ici l’adresse filiale caractéristique de l’enseignement de sagesse.
- source_word: תִּקְרַב
  choice: tu t’approches
  rationale: Le verbe קרב signifie « s’approcher ». Cette formulation naturelle garde la nuance d’une démarche vers Dieu, également attestée par le grec προσέρχῃ.
- source_word: לַעֲבוֹד
  choice: pour servir
  rationale: עבד désigne le service rendu à Dieu, qui peut inclure l’obéissance et le culte. « Servir » préserve cette amplitude sans réduire le sens au seul culte.
- source_word: אֶת יְהֹוָה
  choice: Yahweh
  rationale: Le texte hébreu porte directement le tétragramme יהוה ; sa translittération préserve le nom divin plutôt que de le remplacer par un titre.
- source_word: הָכֵן
  choice: prépare-toi
  rationale: L’impératif appelle à une disposition volontaire et anticipée. En français actuel, la forme pronominale convient naturellement avec la personne tout entière.
- source_word: נַפְשְׁךָ
  choice: toi
  rationale: נפשך peut se traduire littéralement par « ton âme », mais désigne ici la personne elle-même. « Prépare-toi » évite d’imposer une lecture dualiste tout en gardant la portée globale de l’exhortation.
- source_word: לְכָל נִסָּיוֹן
  choice: à toute épreuve
  rationale: ניסיון évoque la mise à l’épreuve ou l’épreuve. « Toute épreuve » rend la portée générale de כל et convient au contexte des difficultés rencontrées dans le service de Dieu.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le nom divin lui-même. « Yahweh » le conserve, tandis que le grec parallèle Κυρίῳ reflète la tradition de substitution par « Seigneur ».
- issue: Portée anthropologique de נַפְשְׁךָ
  choice: prépare-toi
  alternative: prépare ton âme
  rationale: Le nom נפש peut désigner l’âme, la vie ou la personne. Le pronom réfléchi exprime ici la préparation de toute la personne sans trancher une question anthropologique étrangère au propos.
- issue: Sens de נִסָּיוֹן et du grec πειρασμόν
  choice: épreuve
  alternative: mise à l’épreuve ; tentation
  rationale: L’hébreu met l’accent sur l’épreuve ou le test. Le grec peut aussi signifier « tentation », mais le contexte de l’endurance dans le service de Dieu favorise « épreuve » sans supprimer l’autre possibilité lexicale.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier correspond à l’adresse personnelle « Mon fils ». La phrase garde la tonalité sapientielle sans archaïsme.
