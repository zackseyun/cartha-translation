  text: Prepare your heart[a], and be strong; and do not be alarmed in a time of calamity.
translation:
  language: fr
  text: Prépare ton cœur et affermis-toi ; ne te laisse pas troubler au jour du malheur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « ne te précipite pas au temps de l’épreuve » (ou « de l’affliction »). L’hébreu insiste sur le fait de ne pas se laisser troubler ; le grec, sur le fait de ne pas agir avec précipitation sous l’épreuve.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָכֵן
  choice: Prépare
  rationale: Le hifil de כון signifie établir, disposer ou préparer. « Prépare » suit directement l’hébreu tout en restant naturel en français ; le grec εὐθυνον ajoute l’idée de diriger ou de rendre droit.
- source_word: לִבְּךָ
  choice: ton cœur
  rationale: לֵב désigne le centre intérieur de la pensée, de la volonté et de la résolution. « Cœur » conserve l’image biblique et sa largeur de sens.
- source_word: וְהִתְחַזֵּק
  choice: affermis-toi
  rationale: La forme réfléchie de חזק invite à se fortifier et à tenir ferme. « Affermis-toi » rend cette valeur plus précisément que le simple « sois fort » et rejoint la nuance d’endurance du grec καρτέρησον.
- source_word: וְאַל תִּבָּהֵל
  choice: ne te laisse pas troubler
  rationale: בהל exprime l’effroi, le désarroi ou l’agitation. Cette formulation française rend l’avertissement contre la panique sans exagérer le degré de peur.
- source_word: בְּיוֹם אֵד
  choice: au jour du malheur
  rationale: La formule signifie littéralement « au jour du désastre/malheur ». « Au jour du malheur » préserve l’image temporelle hébraïque dans un français biblique mais accessible.
theological_decisions:
- issue: Rapport entre l’hébreu et le grec dans la dernière proposition
  choice: 'Le texte principal suit l’hébreu : « ne te laisse pas troubler » au jour du malheur.'
  alternative: 'Le grec peut se rendre : « ne te précipite pas au temps de l’épreuve » ou « de l’affliction ».'
  rationale: L’hébreu conservé, de haute confiance, met l’accent sur le désarroi, tandis que le grec μὴ σπεύσῃς met l’accent sur la précipitation. La note maintient cette différence réelle sans l’effacer ni l’imposer au texte principal.
translation_notes:
  register: Français moderne, digne et direct, avec tutoiement singulier conforme aux formes hébraïques. Le parallélisme des trois impératifs est conservé ; « au jour du malheur » maintient l’expression imagée de l’hébreu.
