  source_fidelity: « Attache-toi à lui et ne t’en éloigne pas » rend fidèlement הִדָּבֵק בּוֹ וְאַל תָּסוּר et correspond au grec parallèle. « Tu deviennes grand » restitue directement תִּגְדַּל sans imposer le sens plus interprétatif d’« être élevé ». En revanche, « dans tes derniers jours » restreint אַחֲרִיתֶךָ à la période terminale de la vie, alors que le mot peut désigner plus largement la fin ou l’issue finale.
  naturalness: Le français est direct, moderne et d’un registre approprié. « À la fin » est plus idiomatique ici que « dans tes derniers jours » et préserve mieux l’amplitude de l’expression source.
  terminology: Le pronom « lui » maintient correctement le renvoi contextuel à Dieu sans explicitation ajoutée. « Devenir grand » conserve la souplesse sémantique de גדל; il ne faut pas le remplacer par « être exalté », qui interpréterait davantage le résultat.
