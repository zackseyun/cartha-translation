  text: Cling to him and do not turn away[a], so that you may be exalted in your latter end.
translation:
  language: fr
  text: Attache-toi à lui et ne t’en éloigne pas, afin que tu deviennes grand à la fin[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « afin que tu grandisses à la fin ». Le verbe hébreu signifie « grandir » ou « devenir grand »; le grec parallèle porte « que tu sois accru » ou « que tu grandisses ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִדָּבֵק
  choice: Attache-toi
  rationale: Le verbe דבק exprime une adhésion étroite et durable. « Attache-toi » est naturel en français moderne et conserve la force relationnelle de l’exhortation; le grec κολλήθητι confirme ce sens.
- source_word: בּוֹ
  choice: à lui
  rationale: Le suffixe masculin singulier renvoie, dans le contexte immédiat, à Dieu. Le pronom français maintient ce renvoi sans ajouter le nom divin au texte.
- source_word: וְאַל תָּסוּר
  choice: et ne t’en éloigne pas
  rationale: סור peut signifier s’écarter, se détourner ou s’éloigner. Cette formulation française exprime clairement l’idée de ne pas abandonner Dieu tout en restant naturelle.
- source_word: לְמַעַן
  choice: afin que
  rationale: La locution introduit ici un but ou un résultat. « Afin que » en conserve la portée sans trancher excessivement entre ces deux nuances.
- source_word: תִּגְדַּל
  choice: tu deviennes grand
  rationale: Le qal de גדל signifie littéralement grandir ou devenir grand. Cette traduction suit plus directement l’hébreu que le passif « être élevé », tout en laissant ouverte la nature de cette grandeur.
- source_word: בְּאַחֲרִיתֶךָ
  choice: dans tes derniers jours
  rationale: אַחֲרִית peut désigner la fin, l’issue ou la dernière période de la vie. « Dans tes derniers jours » garde la perspective finale de la formule et s’accorde avec le parallèle grec ἐπʼ ἐσχάτων σου.
theological_decisions:
- issue: Référent du pronom « lui »
  choice: Le pronom renvoie à Dieu, conformément au contexte immédiat.
  alternative: Un renvoi plus général à la sagesse ou à l’instruction.
  rationale: Le contexte exhorte à mettre sa confiance dans le Seigneur, et ni l’hébreu ni le grec n’introduisent un nouvel antécédent. Le simple pronom préserve le renvoi personnel sans explicitation ajoutée.
- issue: Nature de la promesse finale
  choice: Le texte promet que le destinataire deviendra grand dans la dernière période ou à l’issue de sa vie, sans préciser la forme de cette grandeur.
  alternative: Être élevé ou honoré à la fin; connaître une croissance ou une augmentation; prospérer matériellement.
  rationale: L’hébreu גדל et le grec αὐξηθῇς évoquent la croissance ou l’accroissement, tandis que אַחֲרִית oriente vers l’issue finale. « Deviennes grand » conserve cette tension au lieu de la réduire à l’honneur, à la richesse ou à une lecture eschatologique déterminée.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reflète les formes hébraïques de deuxième personne. La syntaxe reste simple, et la note préserve l’ambiguïté entre croissance, grandeur et élévation finale.
