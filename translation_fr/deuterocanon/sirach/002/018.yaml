base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/018.yaml
  text: Let us fall into the hand of Yahweh[a], and not into the hand of man, for as his greatness is[b], so also is his mercy.
translation:
  language: fr
  text: Tombons entre les mains de Yahweh[a], et non entre celles des humains, car sa bonté fidèle[b] est à la mesure de sa grandeur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « dans la main » au singulier dans les deux membres; le grec porte « entre les mains du Seigneur… entre les mains des humains » au pluriel.
    reason: textual_variant
  - marker: b
    text: Ou « sa miséricorde ». Le mot hébreu חֶסֶד peut exprimer la bonté, l’amour loyal ou la fidélité bienveillante; le grec porte « miséricorde ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפֹּל
  choice: Tombons
  rationale: Le cohortatif pluriel exprime une exhortation volontaire. « Tombons » conserve l’image concrète commune à l’hébreu et au grec, sans l’expliciter par « confions-nous ».
- source_word: בְּיַד
  choice: entre les mains
  rationale: L’hébreu emploie le singulier « dans la main », mais l’expression française naturelle est « tomber entre les mains de ». Le grec présente d’ailleurs le pluriel dans les deux membres. La note signale la différence formelle.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Transcription du nom divin présent explicitement dans le texte hébreu, conformément à la couche de consultation fournie.
- source_word: אָדָם
  choice: des humains
  rationale: אָדָם désigne ici les êtres humains en général, par contraste avec Yahweh. Le pluriel générique est idiomatique en français et rejoint le sens du parallèle grec ἀνθρώπων.
- source_word: כְּגָדְלוֹ כֵּן חַסְדּוֹ
  choice: sa bonté fidèle est à la mesure de sa grandeur
  rationale: Cette formulation française naturelle préserve la corrélation כ...כן (« à mesure de / de même ») entre la grandeur divine et son חֶסֶד.
- source_word: חַסְדּוֹ
  choice: sa bonté fidèle
  rationale: חֶסֶד peut désigner la bonté, l’attachement loyal ou la miséricorde. « Bonté fidèle » conserve sa dimension relationnelle sans exclure la compassion; le grec ἔλεος appuie aussi « miséricorde » comme autre lecture.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte hébreu porte le Tétragramme. « Yahweh » le rend comme nom propre plutôt que de le remplacer par un titre; la capitale grecque Κυρίου reflète la tradition de lecture « Seigneur ».
- issue: Portée de חֶסֶד
  choice: bonté fidèle
  alternative: miséricorde
  rationale: Le mot hébreu garde une tension entre bonté, fidélité relationnelle et compassion. Le corps du texte privilégie une expression assez large, tandis que la note conserve l’autre possibilité, soutenue par le grec ἔλεος.
- issue: Singulier générique אָדָם
  choice: des humains
  alternative: de l’homme
  rationale: Dans ce contexte, אָדָם oppose Dieu à l’humanité, non à un homme particulier. « Des humains » rend clairement cette portée générique en français moderne.
translation_notes:
  register: Français international moderne, digne et accessible. L’expression idiomatique « tomber entre les mains » est retenue, avec la différence de nombre signalée en note. La structure comparative est rendue naturellement par « à la mesure de ».
