  text: Those who fear Yahweh will seek his favor[b][a], and those who love him will learn his law.
translation:
  language: fr
  text: Ceux qui craignent le Seigneur rechercheront sa faveur, et ceux qui l’aiment apprendront sa loi[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « son enseignement ».'
    reason: alternative lexicale pour תורה, dont le sens dépasse parfois celui d’un code juridique.
  - marker: b
    text: 'Le grec porte : « et ceux qui l’aiment seront remplis de la loi ».'
    reason: variante textuelle du parallèle grec dans le second membre.
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  choice: ceux qui craignent le Seigneur
  rationale: Cette formulation naturelle conserve le sens religieux et relationnel de la crainte de YHWH, sans le réduire à la simple peur.
- source_word: יְהֹוָה
  choice: le Seigneur
  rationale: La traduction traditionnelle du nom divin convient au registre biblique français et évite une translittération incertaine de sa prononciation.
- source_word: יְבַקְּשׁוּ
  choice: rechercheront
  rationale: Le futur rend ici l’action caractéristique exprimée par l’imparfait hébreu et correspond au futur grec ζητήσουσιν.
- source_word: רְצוֹנוֹ
  choice: sa faveur
  rationale: רצון peut désigner la faveur, l’agrément ou ce qui plaît. Le parallèle grec εὐδοκίαν appuie ici « faveur » plutôt que « volonté » au sens de commandement.
- source_word: וְאֹהֲבָיו
  choice: et ceux qui l’aiment
  rationale: Le suffixe renvoie au Seigneur; cette tournure exprime naturellement l’attachement personnel du texte hébreu.
- source_word: יִלְמְדוּ
  choice: apprendront
  rationale: Au qal, למד signifie normalement « apprendre ». Le texte principal suit donc le témoin hébreu, tandis que la divergence grecque est signalée en note.
- source_word: תוֹרָתוֹ
  choice: sa loi
  rationale: « Loi » conserve la portée traditionnelle et religieuse de תורה, confirmée par le grec νόμος; « enseignement » est indiqué en note afin de préserver l’étendue sémantique du terme.
theological_decisions:
- issue: Divergence entre l’hébreu et le grec dans le second membre
  choice: apprendront sa loi
  alternative: 'Le grec porte : « seront remplis de la loi »'
  rationale: Le témoin hébreu conservé, de haute confiance, constitue ici la source principale. La variante grecque, substantielle, est néanmoins conservée en note sans harmonisation.
translation_notes:
  register: Français international moderne, digne et accessible. « Craignent le Seigneur » conserve l’expression biblique reçue; « rechercheront » et « apprendront » rendent le parallélisme au futur. Les appels de note suivent l’ordre logique des expressions annotées.
