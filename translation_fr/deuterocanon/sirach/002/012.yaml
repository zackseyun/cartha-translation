  text: Woe to the faint of heart and the slack hands[a], and to the sinner of crooked ways.
translation:
  language: fr
  text: Malheur aux cœurs timides et aux mains défaillantes, et au pécheur dont les chemins sont tortueux[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « au méchant aux chemins tortueux ». Le grec porte : « au pécheur qui marche sur deux sentiers », évoquant peut-être une conduite partagée ou duplicité.'
    reason: Signaler la formulation littérale de l’hébreu ainsi que la variante interprétative importante du parallèle grec.
lexical_decisions:
- source_word: אוֹי
  choice: Malheur
  rationale: Conserve la force d’avertissement et de lamentation de l’interjection hébraïque dans un registre sapientiel digne.
- source_word: לְרַכֵּי לֵב
  choice: aux cœurs timides
  rationale: Littéralement « aux cœurs mous/faibles » ; le grec δειλαῖς confirme ici l’idée de crainte ou de manque de courage, et non celle de compassion.
- source_word: וּרְפֵה יָדָיִם
  choice: et aux mains défaillantes
  rationale: Maintient l’image corporelle hébraïque de mains sans vigueur ni résolution, avec une formulation française naturelle.
- source_word: וְלָרָשָׁע
  choice: et au pécheur
  rationale: רשע peut désigner le méchant ou le coupable ; « pécheur » est également soutenu par le grec ἁμαρτωλῷ.
- source_word: עִקֵּשׁ דְּרָכַיִם
  choice: dont les chemins sont tortueux
  rationale: Suit directement l’hébreu transmis, qui caractérise les chemins comme tortueux, sans imposer dans le texte principal la lecture grecque plus précise de « deux sentiers ».
theological_decisions:
- issue: Écart entre la dernière proposition hébraïque et le parallèle grec
  choice: 'Rendre dans le texte principal l’hébreu : « au pécheur dont les chemins sont tortueux »'
  alternative: « au pécheur qui marche sur deux sentiers »
  rationale: L’hébreu conservé est intelligible et doit rester prioritaire ; le grec peut témoigner d’une autre lecture ou expliciter l’idée d’une conduite partagée et duplicite. La note préserve cet écart textuel sans le résoudre abusivement.
translation_notes:
  register: Français international moderne, sobre et sapientiel. Le parallélisme concret des « cœurs » et des « mains » est conservé ; la ponctuation finale donne à l’ensemble sa force d’avertissement.
