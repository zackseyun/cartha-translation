  text: You who fear Yahweh[a], trust in him, and your reward will not be delayed.
translation:
  language: fr
  text: Vous qui craignez Yahweh, mettez votre confiance en lui, et il ne différera pas votre récompense.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « et il ne laissera pas votre récompense rester jusqu’au lendemain ». Le grec porte : « et vous ne perdrez certainement pas votre récompense ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  choice: Vous qui craignez Yahweh
  rationale: Le participe pluriel est employé comme une apostrophe dans cette série d’exhortations. « Vous qui craignez » rend naturellement l’adresse directe, et le nom divin est transcrit « Yahweh ».
- source_word: הַאֲמִינוּ בּוֹ
  choice: mettez votre confiance en lui
  rationale: L’impératif de אמן construit avec ב exprime le fait de s’appuyer sur quelqu’un avec confiance; cette formulation française convient mieux ici que le sens surtout intellectuel de « croyez-le ».
- source_word: וְהוּא לֹא יָלִין
  choice: et il ne tardera pas à
  rationale: Le texte hébreu conserve Dieu comme sujet et emploie לין, littéralement « passer la nuit, laisser jusqu’au lendemain ». La formulation choisie transmet l’idée idiomatique d’une récompense que Dieu ne remettra pas à plus tard, tout en laissant la variante grecque en note.
- source_word: שְׂכַרְכֶם
  choice: vous récompenser
  rationale: שכר désigne le salaire ou la récompense. La tournure verbale est naturelle en français et maintient Dieu comme agent, conformément au pronom explicite וְהוּא.
theological_decisions:
- issue: Rendu du nom divin יְהֹוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: L’hébreu porte explicitement le tétragramme. « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Sens de la dernière proposition face à la divergence des témoins
  choice: il ne tardera pas à vous récompenser
  alternative: vous ne perdrez certainement pas votre récompense
  rationale: Le texte principal suit l’image et la syntaxe de l’hébreu, où Dieu est sujet et où לין évoque le fait de laisser passer la nuit. Le grec présente plutôt l’assurance que les destinataires ne perdront pas leur récompense; cette véritable différence est signalée sans être effacée.
translation_notes:
  register: Français international moderne, direct et digne. L’apostrophe « Vous qui… » garde la force exhortative. La dernière proposition est rendue idiomatiquement, tandis que la note conserve l’image hébraïque et la variante grecque.
