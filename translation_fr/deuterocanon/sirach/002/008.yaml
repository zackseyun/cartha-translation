  - severity: low
    issue: La formulation littérale de la note peut être plus exacte et plus naturelle.
    rationale: « Laisser votre récompense passer la nuit » est compréhensible, mais « la laisser rester jusqu’au lendemain » exprime plus clairement l’image de לין dans cette construction. Le grec doit être qualifié de lecture parallèle, car sa construction et sa nuance diffèrent.
