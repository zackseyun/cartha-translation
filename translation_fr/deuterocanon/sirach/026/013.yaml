  naturalness: « Elle boira de toute eau à proximité » est plus naturel et plus concis que « elle ... boit de toute eau qui se trouve à proximité », tout en conservant l'image littérale. Le reste est clair dans un français international moderne.
  terminology: « voyageur assoiffé », « pieu » et « carquois » sont des équivalents précis et conservent le registre imagé du grec. Les notes maintiennent à juste titre le caractère débattu de la métaphore sans la résoudre dans le texte.
