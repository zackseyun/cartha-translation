  text: Like a thirsty traveler she opens her mouth[a], and from every nearby water she will drink; opposite every stake she will sit down[c][b], and before every arrow she will open her quiver.
translation:
  language: fr
  text: Comme un voyageur assoiffé, elle ouvre la bouche[a] et boira de toute eau à proximité. Devant chaque pieu, elle s’assiéra, et devant une flèche, elle ouvrira son carquois[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’image est métaphorique et évoque vraisemblablement une disponibilité sexuelle sans discernement : elle saisit toute occasion qui se présente.'
    reason: cultural_note
  - marker: b
    text: Le grec conserve les images concrètes du « pieu », de la « flèche » et du « carquois ». Leur portée exacte, surtout dans la dernière proposition, est discutée, mais elles prolongent vraisemblablement la métaphore sexuelle du verset.
    reason: lexical_alternative
lexical_decisions:
- source_word: διψῶν ὁδοιπόρος
  choice: un voyageur assoiffé
  rationale: Cette expression naturelle en français conserve à la fois la comparaison, la condition pressante du voyageur et l’image de celui qui est en chemin.
- source_word: ἀπὸ παντὸς ὕδατος τοῦ σύνεγγυς
  choice: de toute eau qui se trouve à proximité
  rationale: Le tour garde l’idée distributive de παντός et l’indiscrimination suggérée par l’eau disponible tout près, sans expliciter la métaphore.
- source_word: πίεται
  choice: boit
  rationale: Bien que la forme grecque soit au futur, le présent de tableau prolonge naturellement en français le présent ἀνοίγει de la comparaison. Les futurs des deux dernières propositions sont toutefois conservés.
- source_word: κατέναντι παντὸς πασσάλου
  choice: devant chaque pieu
  rationale: « Pieu » rend concrètement πάσσαλος. « Devant » représente κατέναντι sans préciser davantage une relation spatiale dont la portée figurée reste incertaine.
- source_word: καθίσεται
  choice: elle s’assiéra
  rationale: Le futur grec est conservé, avec un sujet féminin fourni par le contexte immédiat.
- source_word: ἔναντι βέλους
  choice: devant chaque flèche
  rationale: βέλους est formellement un génitif singulier sans adjectif distributif exprimé dans cette proposition. « Chaque » rend en français le caractère récurrent et indiscriminé de l’image, mais l’absence de παντός rend aussi possible « une flèche ».
- source_word: φαρέτραν
  choice: carquois
  rationale: « Carquois » est l’équivalent français courant et précis de φαρέτρα; l’image concrète est maintenue malgré son caractère saisissant.
theological_decisions:
- issue: Métaphore sexuelle dans une mise en garde sapientielle
  choice: Conserver les images concrètes de l’eau, du pieu, de la flèche et du carquois.
  alternative: Remplacer les images par une affirmation explicite sur l’indiscrimination sexuelle.
  rationale: Le grec formule la mise en garde au moyen d’images suggestives. Les expliciter dans le corps du texte résoudrait une métaphore dont certains détails, surtout dans la dernière proposition, demeurent discutés.
- issue: Sujet féminin non répété explicitement en grec
  choice: Employer « elle » pour les verbes qui l’exigent en français.
  alternative: Employer un sujet générique ou réorganiser les propositions pour éviter le pronom.
  rationale: Le contexte fournit le référent féminin; le pronom rend la syntaxe française claire sans ajouter une nouvelle identification doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste proche des images grecques sans les rendre artificiellement explicites. Le point-virgule marque le passage de la comparaison initiale aux deux images parallèles. Tous les marqueurs de notes figurent dans le texte.
