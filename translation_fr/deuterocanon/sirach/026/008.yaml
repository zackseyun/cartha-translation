  text: A wicked wife is a shaking yoke for oxen[a]; whoever takes hold of her is like one who grabs a scorpion.
translation:
  language: fr
  text: Une femme mauvaise est un joug à bœufs qui vacille[a] ; celui qui la saisit est comme quelqu’un qui empoigne un scorpion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque traduite par « joug à bœufs qui vacille » est difficile et très imagée. Elle peut évoquer un joug secoué ou instable, voire des bœufs sous un joug qui s’agite.
    reason: lexical_alternative
lexical_decisions:
- source_word: βοοζύγιον
  choice: joug à bœufs
  rationale: Le composé évoque concrètement les bœufs et leur mise sous le joug. « Joug à bœufs » conserve l’image agricole sans trancher en faveur d’un attelage entier.
- source_word: σαλευόμενον
  choice: qui vacille
  rationale: Le participe exprime un mouvement ou une instabilité. « Qui vacille » rend l’image de façon vive et naturelle, tout en laissant ouverte la nuance entre secousse et instabilité.
- source_word: γυνὴ πονηρά
  choice: une femme mauvaise
  rationale: γυνή peut désigner une femme ou une épouse. Le contexte sapientiel domestique permet « épouse », mais le grec dit plus largement « femme » ; « mauvaise » conserve ici le jugement moral sans ajouter une nuance plus forte que nécessaire.
- source_word: ὁ κρατῶν αὐτῆς
  choice: celui qui la saisit
  rationale: κρατέω peut signifier saisir, tenir fermement ou maîtriser. La comparaison suivante avec le fait d’empoigner un scorpion favorise le sens tactile de « saisir ».
- source_word: δρασσόμενος
  choice: empoigne
  rationale: Le verbe décrit l’action de saisir avec la main. « Empoigne » est concret et restitue la vigueur périlleuse de l’image.
- source_word: σκορπίου
  choice: un scorpion
  rationale: Équivalent zoologique direct ; l’indéfini convient à la comparaison générale.
