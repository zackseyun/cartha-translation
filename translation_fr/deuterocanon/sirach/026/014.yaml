  text: A wife's grace delights her husband[a], and her understanding puts flesh on his bones.
translation:
  language: fr
  text: La grâce d’une femme réjouit son mari, et son intelligence donne de la vigueur à ses os.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « engraisse ses os ». Le grec emploie une image corporelle pour exprimer l’effet nourrissant et fortifiant de l’intelligence d’une femme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: grâce
  rationale: Dans ce contexte, le terme désigne la qualité gracieuse et attirante de l’épouse, non la grâce salvatrice. « Grâce » conserve sa portée à la fois morale et esthétique.
- source_word: γυναικός
  choice: d’une femme
  rationale: Le grec peut signifier « femme » ou « épouse ». La mention de « son mari » établit clairement la relation conjugale, tandis que « d’une femme » reste naturel en français.
- source_word: τέρψει
  choice: réjouit
  rationale: Le futur grec exprime le plaisir ou la joie procurée. Le présent français convient au caractère proverbial de l’énoncé.
- source_word: ἐπιστήμη
  choice: intelligence
  rationale: Le mot peut désigner la connaissance, la compréhension ou le discernement. Ici, « intelligence » évoque une sagesse pratique plutôt qu’une simple accumulation de savoirs.
- source_word: πιανεῖ
  choice: donne de la vigueur à
  rationale: Le verbe signifie littéralement rendre gras ou bien nourri. Cette formulation française exprime l’effet fortifiant tout en conservant l’image corporelle grâce à « ses os ».
- source_word: τὰ ὀστᾶ αὐτοῦ
  choice: ses os
  rationale: La traduction littérale préserve l’image corporelle grecque, qui évoque la vitalité profonde de l’homme.
theological_decisions: []
translation_notes:
  register: Français moderne, proverbial et digne. Le parallélisme grec est conservé. « Donne de la vigueur à ses os » évite l’étrangeté excessive d’« engraisse ses os » sans supprimer l’image corporelle; la formulation littérale figure en note.
