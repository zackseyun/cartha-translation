translation:
  language: fr
  text: Heureux[a] l’homme qui a une bonne épouse ; le nombre de ses jours est doublé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Béni » ou « Fortuné ».'
    reason: Alternatives lexicales possibles pour אַשְׁרֵי, qui exprime une condition heureuse ou enviable.
lexical_decisions:
- source_word: אִשָּׁה טוֹבָה
  choice: une femme bonne
  rationale: Le syntagme signifie simplement « une femme bonne ». Dans ce contexte matrimonial, « femme » désigne naturellement l’épouse, tandis que l’ordre « femme bonne » garde la portée morale et pratique générale de l’hébreu sans introduire la nuance plus interprétative de « vertueuse ». Le grec γυναικὸς ἀγαθῆς confirme ce sens.
- source_word: אַשְׁרֵי
  choice: Heureux
  rationale: Cette formule sapientielle exprime le bonheur ou la situation enviable d’une personne. « Heureux » est naturel, digne et traditionnel dans les formulations de béatitude, sans affirmer plus explicitement que le texte une bénédiction accordée par Dieu. Le grec μακάριος appuie cette traduction.
- source_word: בַעֲלָהּ
  choice: l’époux
  rationale: Le mot désigne ici son mari. « L’époux d’une femme bonne » restitue clairement la relation conjugale et évite les connotations modernes trompeuses de « maître ». Le grec ὁ ἀνήρ confirme le sens matrimonial.
- source_word: וּמִסְפַּר יָמָיו
  choice: le nombre de ses jours
  rationale: Cette traduction conserve l’image et la formulation proverbiale de l’hébreu, également attestées par le grec ἀριθμὸς τῶν ἡμερῶν αὐτοῦ, sans réduire l’expression au seul mot « vie ».
- source_word: כִּפְלַיִם
  choice: est doublé
  rationale: Le terme signifie « double » ou « deux fois autant ». « Est doublé » est concis et idiomatique, tout en préservant la tension entre une affirmation de longévité et une image de plénitude vécue, sans trancher entre elles.
theological_decisions:
- issue: Valeur sapientielle de אַשְׁרֵי / μακάριος
  choice: Heureux
  alternative: Béni ; Fortuné
  rationale: Le verset formule une appréciation sapientielle de la condition enviable du mari plutôt qu’une déclaration explicite d’une bénédiction divine. « Heureux » garde la tonalité de béatitude sans ajouter une causalité théologique absente du texte.
translation_notes:
  register: Français international moderne, sobre et sapientiel. La formulation conserve le parallélisme concis et l’image du nombre des jours, avec un deux-points naturel en français pour relier la conséquence proverbiale.
