  text: Slander in a city[a], and an assembly of a mob, and a false accusation—all these are worse than death.
translation:
  language: fr
  text: 'La calomnie dans une ville[a], le rassemblement d’une foule et la fausse accusation : tout cela est pire que la mort.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente une liste très condensée, avec des génitifs elliptiques : littéralement, « calomnie de/dans une ville » et « rassemblement d’une foule ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαβολὴν
  choice: La calomnie
  rationale: Le nom désigne une accusation malveillante ou diffamatoire. « Calomnie » est précis, naturel et convient à cette liste de maux.
- source_word: πόλεως
  choice: dans une ville
  rationale: Le génitif est elliptique. « Dans une ville » exprime naturellement le cadre de la calomnie sans affirmer qu’elle vise la ville elle-même.
- source_word: ἐκκλησίαν
  choice: le rassemblement
  rationale: Dans ce contexte sapientiel, le terme désigne une assemblée ou un groupe réuni, sans connotation ecclésiale nécessaire.
- source_word: ὄχλου
  choice: d’une foule hostile
  rationale: ὄχλος peut désigner une foule; le contexte négatif suggère ici une masse menaçante ou tumultueuse. « Hostile » en rend la valeur défavorable sans employer le peu naturel « assemblée d’une populace ».
- source_word: καταψευσμόν
  choice: la fausse accusation
  rationale: Le mot évoque le fait de parler faussement contre quelqu’un. Cette formulation le distingue de la calomnie déjà mentionnée tout en conservant sa portée accusatoire.
- source_word: ὑπὲρ θάνατον
  choice: pire que la mort
  rationale: 'Avec μοχθηρά, cette tournure exprime une comparaison: les maux énumérés surpassent la mort en gravité.'
- source_word: πάντα
  choice: tout cela
  rationale: Le neutre pluriel récapitule les trois réalités précédentes; le singulier collectif est idiomatique en français.
- source_word: μοχθηρά
  choice: est pire
  rationale: L’adjectif signifie mauvais, pénible ou funeste. Avec ὑπὲρ θάνατον, « est pire que la mort » restitue clairement la comparaison en français moderne.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La structure en liste est conservée, mais la ponctuation et « tout cela » rendent la phrase naturelle. « Foule hostile » explicite prudemment la nuance négative de ὄχλος dans ce contexte, tandis que la note signale la formulation grecque plus elliptique.
