  source_fidelity: 'Le sens général est bien rendu : le contraste entre la justice et le péché ainsi que l’action future du Seigneur sont conservés. Toutefois, « revient de la justice au péché » est peu idiomatique en français et atténue la valeur de mouvement de retour ou de détournement du participe grec ἐπανάγων. Une formulation plus naturelle peut garder ce sens sans trancher indûment la question de son emploi actif ou intransitif.'
  naturalness: « Celui qui se détourne de la justice pour le péché » est plus naturel en français moderne que « Celui qui revient de la justice au péché ». « Le Seigneur le préparera pour l’épée » reste volontairement sobre et quelque peu imagé, conformément au grec ; il est compréhensible dans un registre biblique.
  terminology: « Justice », « péché », « le Seigneur » et « l’épée » sont des choix appropriés et cohérents avec le registre biblique français. « Justice » conserve ici le terme traditionnel pour δικαιοσύνη, sans réduire le contraste moral à un vocabulaire juridique moderne.
  issues:
