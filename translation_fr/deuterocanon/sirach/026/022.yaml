  text: One who turns back from righteousness to sin—the Lord will prepare him for the sword[a].
translation:
  language: fr
  text: Celui qui se détourne de la justice pour le péché, le Seigneur le préparera pour l’épée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le participe grec signifie littéralement « ramenant » ou « conduisant de nouveau ». Sans complément d’objet exprimé, il peut évoquer soit celui qui revient lui-même de la justice au péché, soit celui qui y entraîne quelqu’un d’autre.
    reason: ambiguïté lexicale et grammaticale
lexical_decisions:
- source_word: ἐπανάγων
  choice: celui qui revient
  rationale: Le participe signifie littéralement « ramenant » ou « reconduisant ». Dans la construction « de la justice au péché », il exprime vraisemblablement un retour moral en arrière. « Celui qui revient » est naturel en français tout en conservant le mouvement indiqué par le grec.
- source_word: δικαιοσύνης
  choice: de la justice
  rationale: « Justice » est le terme biblique français usuel pour δικαιοσύνη et désigne ici la conduite conforme au bien, opposée au péché.
- source_word: ἁμαρτίαν
  choice: au péché
  rationale: « Péché » rend directement le terme grec dans ce contexte moral et religieux.
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: Dans ce contexte sapientiel, κύριος désigne Dieu ; « le Seigneur » est la traduction biblique française habituelle.
- source_word: ἑτοιμάσει
  choice: préparera
  rationale: Cette traduction directe maintient l’image et l’action explicite du Seigneur sans préciser davantage la forme du jugement.
- source_word: εἰς ῥομφαίαν
  choice: pour l’épée
  rationale: Ῥομφαία désigne une grande épée et peut évoquer par métonymie une mort violente ou un jugement. « Pour l’épée » conserve l’image sans l’expliciter.
theological_decisions:
- issue: Nature du jugement divin dans « le Seigneur le préparera pour l’épée »
  choice: Une déclaration de jugement divin contre celui qui passe de la justice au péché.
  alternative: Une conséquence providentielle générale plutôt qu’une action punitive directe.
  rationale: Le Seigneur est explicitement le sujet du verbe futur. La traduction maintient cette initiative divine et la dureté de l’image sans développer une doctrine de la rétribution au-delà du texte.
- issue: Valeur du participe ἐπανάγων
  choice: Le comprendre comme le retour du sujet lui-même de la justice au péché.
  alternative: 'Le comprendre transitivement : « celui qui ramène [quelqu’un] de la justice au péché ».'
  rationale: Le verbe grec est formellement actif et peut être transitif, mais aucun complément d’objet n’est exprimé. Le contexte directionnel permet la lecture d’un retour personnel, retenue dans le texte, tandis que l’ambiguïté grammaticale est signalée en note.
translation_notes:
  register: Français moderne, sobre et biblique. « Justice » et « péché » préservent le contraste moral du grec. La tournure inhabituelle « préparera pour l’épée » est maintenue afin de conserver l’image et de ne pas remplacer le verbe grec par une interprétation telle que « livrera » ou « condamnera ».
