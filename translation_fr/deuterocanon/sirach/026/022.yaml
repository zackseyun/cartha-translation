    rationale: Le grec peut évoquer le fait de ramener ou de revenir en arrière ; dans ce contexte, « se détourne de la justice pour le péché » exprime naturellement le passage moral visé. Une note conserve l’ambiguïté liée à la forme active du participe et à l’absence de complément exprimé.
  - severity: low
    issue: La note actuelle présente l’alternative transitive comme si « celui qui ramène de la justice au péché » était une traduction française autonome.
    rationale: En français, « ramener » appelle normalement un complément. Il convient de signaler explicitement l’objet sous-entendu (« quelqu’un ») plutôt que de donner cette séquence elliptique comme équivalent direct.
