  text: Une femme ivre provoque une grande colère, et elle ne cachera pas sa honte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γυνὴ μέθυσος
  choice: une femme ivre
  rationale: « Femme » conserve naturellement en français l’ambiguïté de γυνή, qui peut désigner une femme ou une épouse selon le contexte; « ivre » rend directement μέθυσος.
- source_word: ὀργὴ μεγάλη
  choice: un grand sujet de colère
  rationale: La formulation prédicative grecque est très condensée (« grande colère [est] une femme ivre »). « Un grand sujet de colère » en conserve le sens sans produire en français une identification obscure entre la personne et la colère.
- source_word: ἀσχημοσύνην
  choice: indécence
  rationale: Le terme désigne ce qui est inconvenant, honteux ou contraire à la bienséance. « Indécence » garde ici la dimension de conduite honteuse sans la réduire au seul sentiment de honte.
- source_word: οὐ συγκαλύψει
  choice: elle ne cachera pas
  rationale: Le futur grec exprime qu’elle ne dissimulera pas son indécence; le futur simple français en préserve la force.
