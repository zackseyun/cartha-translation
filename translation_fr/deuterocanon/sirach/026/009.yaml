  verdict: revise
  source_fidelity: 'Le texte grec présente une tournure nominale condensée : « une femme ivre [est] une grande colère », puis affirme qu’elle ne couvrira pas sa honte / ce qui est honteux chez elle. « Un grand sujet de colère » explicite correctement la première image, mais « indécence » est trop étroitement lié à la bienséance et ne rend pas pleinement ἀσχημοσύνη, qui évoque la honte ou le déshonneur.'
  naturalness: « Une femme ivre est un grand sujet de colère » est compréhensible mais quelque peu abstrait. « Provoque une grande colère » est naturel en français moderne tout en explicitant sobrement la prédication grecque. « Elle ne cachera pas sa honte » est idiomatique et conserve le parallèle.
  terminology: « Femme » préserve l’ambiguïté de γυνή sans imposer « épouse ». « Ivre » rend μέθυσος. « Honte » rend ici ἀσχημοσύνη plus fidèlement qu’« indécence » et s’accorde avec l’image de « couvrir ».
