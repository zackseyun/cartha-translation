translation:
  language: fr
  text: 'Une lampe qui resplendit sur un chandelier sacré : telle est la beauté d’un visage sur une stature bien campée[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à un âge mûr et stable ». Le grec ἡλικία peut désigner la stature, l’âge ou une étape de la vie ; στασίμῃ évoque ce qui est stable, ferme ou bien établi.'
    reason: ambiguïté lexicale
lexical_decisions:
- source_word: λύχνος
  choice: lampe
  rationale: Le nom désigne une lampe concrète, et non la lumière prise abstraitement.
- source_word: ἐκλάμπων
  choice: qui resplendit
  rationale: Le participe exprime un éclat vif; « resplendit » conserve cette intensité dans un français naturel et poétique.
- source_word: ἐπὶ λυχνίας ἁγίας
  choice: sur un chandelier sacré
  rationale: La préposition est rendue dans son sens spatial, tandis que « sacré » préserve la nuance cultuelle ou consacrée de ἁγίας.
- source_word: κάλλος προσώπου
  choice: la beauté d’un visage
  rationale: Cette formulation concrète conserve le parallélisme poétique du grec tout en restant naturelle en français moderne.
- source_word: ἐπὶ ἡλικίᾳ στασίμῃ
  choice: sur une stature ferme
  rationale: Dans ce portrait, ἡλικία peut désigner la stature ou la constitution physique, et στασίμῃ ce qui est ferme, stable ou bien établi. Le choix conserve l’image corporelle et la construction parallèle avec la lampe posée sur son support, sans masquer l’autre lecture possible relative à l’âge.
