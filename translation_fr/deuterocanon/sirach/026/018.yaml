  source_fidelity: « Stature ferme » rend de façon trop littérale et peu idiomatique ἡλικίᾳ στασίμῃ. Ἡλικία peut désigner la stature aussi bien que l’âge/stade de vie; dans cette image corporelle, « stature bien campée » exprime naturellement une stature stable et assurée sans éliminer l’autre possibilité, signalée en note. Les images de la lampe, du chandelier consacré et de la beauté du visage sont conservées.
  naturalness: La formulation révisée demeure soutenue et poétique, mais « stature bien campée » est plus naturel et évocateur en français moderne international que « stature ferme ». La structure comparative explicite est acceptable pour rendre l’ellipse poétique grecque.
  terminology: « Lampe », « chandelier sacré » et « beauté d’un visage » sont justes. « Sacré » conserve la valeur cultuelle de ἁγίας. La note doit présenter « âge mûr et stable » comme une autre compréhension possible, plutôt que de faire de « stature » une traduction assurée du mot grec.
