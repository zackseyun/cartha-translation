  source_fidelity: 'Le premier membre est rendu de façon intelligible, mais « Grâce sur grâce : une femme réservée » reste syntaxiquement elliptique en français et laisse ambiguë la relation d’identification exprimée par le grec. « Grâce sur grâce, c’est une femme réservée » restitue plus nettement la formulation proverbiale. Le second membre suit de près οὐκ ἔστιν σταθμὸς πᾶς ἄξιος ἐγκρατοῦς ψυχῆς ; « aucune balance n’est digne » conserve volontairement la métaphore comprimée sans ajouter « mesurer la valeur ».'
  naturalness: '« Grâce sur grâce : une femme réservée » est possible comme style sentencieux, mais le deux-points produit un fragment nominal moins naturel et moins précis en français moderne. L’ajout de « c’est » rend la phrase complète tout en gardant sa concision. « Une âme qui se maîtrise » est naturel, bien que « une âme maîtresse d’elle-même » soit plus littéraire ; le texte actuel convient au registre moderne.'
  terminology: « Grâce » est lexicalement possible pour χάρις, tout en pouvant évoquer un sens religieux en français ; le contexte et la répétition permettent de l’entendre comme qualité charmante sans devoir imposer « charme ». « Réservée » rend de manière acceptable αἰσχυντηρά, dont le champ inclut la pudeur ou la modestie. La note fournit utilement « pudique », mais son explication peut être resserrée et formulée plus directement. « Balance » et « âme qui se maîtrise » rendent correctement σταθμός et ἐγκρατοῦς ψυχῆς.
