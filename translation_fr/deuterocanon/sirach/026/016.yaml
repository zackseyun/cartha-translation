  text: Grace upon grace is a modest woman[a], and no scale is worthy of a self-controlled soul.
translation:
  language: fr
  text: Grâce sur grâce, c’est une femme réservée[a] ; aucune balance n’est digne d’une âme qui se maîtrise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une femme pudique ». Le grec évoque une femme caractérisée par une retenue conforme au sens de ce qui convient.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις ἐπὶ χάριτι
  choice: Grâce sur grâce
  rationale: La répétition et l’idée d’accumulation sont conservées. « Grâce » rend la qualité plaisante ou admirable ici, sans réduire le terme à la beauté physique ; le contexte n’impose pas non plus un sens théologique technique.
- source_word: γυνὴ
  choice: une femme
  rationale: Le grec peut désigner une femme ou une épouse, mais aucun élément explicite de ce verset n’exige « épouse ».
- source_word: αἰσχυντηρά
  choice: réservée
  rationale: L’adjectif désigne une femme animée d’une retenue liée au sens de la honte convenable. « Réservée » exprime positivement cette qualité en français actuel, sans suggérer qu’elle serait humiliée.
- source_word: σταθμός
  choice: balance
  rationale: Le terme désigne ici un instrument ou un étalon de pesée. « Balance » conserve clairement la métaphore.
- source_word: πᾶς ἄξιος
  choice: aucune … n’est digne
  rationale: Cette formulation suit la construction grecque comprimée, littéralement « il n’existe aucune balance digne », sans expliciter à tort l’action de mesurer la valeur.
- source_word: ἐγκρατοῦς ψυχῆς
  choice: d’une âme qui se maîtrise
  rationale: La tournure rend l’idée de maîtrise de soi portée par ἐγκρατής tout en conservant ψυχή par « âme » ; elle est plus naturelle que « âme auto-contrôlée ».
theological_decisions:
- issue: Portée de αἰσχυντηρά comme qualité morale
  choice: réservée
  alternative: modeste ; portée à la pudeur
  rationale: Le contexte fait l’éloge d’une retenue vertueuse plutôt que d’un sentiment de honte dégradant. « Réservée » garde ce sens favorable sans imposer une conception confessionnelle particulière.
- issue: Métaphore de la valeur dans οὐκ ἔστιν σταθμὸς πᾶς ἄξιος
  choice: aucune balance n’est digne d’une âme qui se maîtrise
  alternative: aucune balance ne peut mesurer la valeur d’une âme qui se maîtrise
  rationale: La traduction retenue préserve l’étrangeté et la tension de la formulation grecque. L’alternative explicite une valeur inestimable plausible, mais ajoute l’idée de « mesurer la valeur », qui n’est pas exprimée directement.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme et la formulation condensée de l’original sont maintenus ; le point-virgule distingue les deux affirmations tout en conservant leur unité proverbiale.
