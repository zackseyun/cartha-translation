    rationale: 'Le grec juxtapose un nom abstrait et γυνή de manière proverbiale. En français, le deux-points sans verbe (« Grâce sur grâce : une femme réservée ») affaiblit la relation d’équivalence. « Grâce sur grâce, c’est une femme réservée » est une correction sûre, naturelle et fidèle.'
