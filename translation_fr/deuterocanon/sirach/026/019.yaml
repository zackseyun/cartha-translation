  source_fidelity: 'Le texte rend avec fidélité les principaux éléments du grec : στύλοι χρύσεοι (« colonnes d’or »), ἐπὶ βάσεως ἀργυρᾶς (« sur une base d’argent »), πόδες ὡραῖοι (« de beaux pieds »), ainsi que l’image difficile de στέρνοις εὐσταθοῦς. Le singulier collectif français « la poitrine » est une adaptation idiomatique acceptable du pluriel grec, sans résoudre artificiellement l’obscurité de l’image. « Une personne qui se tient ferme » rend de façon explicite et non genrée l’adjectif substantivé εὐσταθοῦς.'
