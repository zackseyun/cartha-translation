  text: Golden pillars on a silver base[a], and beautiful feet on the breast of one who stands firm.
translation:
  language: fr
  text: Des colonnes d’or sur une base d’argent, et de beaux pieds sur la poitrine d’une personne qui se tient ferme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’image grecque est condensée et difficile. Littéralement, la seconde partie dit à peu près : « de beaux pieds sur les poitrines d’une personne ferme ou stable ». La traduction comprend εὐσταθοῦς comme désignant une personne et στέρνοις comme la poitrine ou la région du thorax.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στύλοι χρύσεοι
  choice: des colonnes d’or
  rationale: « Colonnes » rend naturellement l’image architecturale de στύλοι, tandis que « d’or » indique clairement la matière exprimée par χρύσεοι.
- source_word: ἐπὶ βάσεως ἀργυρᾶς
  choice: sur une base d’argent
  rationale: La préposition ἐπί avec le génitif marque ici l’appui sur une base; βάσις est conservé concrètement par « base » et ἀργυρᾶς par « d’argent ».
- source_word: πόδες ὡραῖοι
  choice: de beaux pieds
  rationale: Le rendu garde les termes corporels concrets du grec. ὡραῖοι exprime ici la beauté ou l’agrément, sans qu’il soit nécessaire de transformer πόδες en « jambes » ou en « démarche ».
- source_word: στέρνοις
  choice: sur la poitrine
  rationale: Le pluriel grec désigne la région de la poitrine ou du thorax; le singulier collectif est plus idiomatique en français, tout en maintenant l’image difficile du texte transmis.
- source_word: εὐσταθοῦς
  choice: d’une personne qui se tient ferme
  rationale: L’adjectif au génitif peut être pris substantivement et évoque la stabilité, la fermeté ou une bonne assise. « Une personne » ne précise pas un genre que cette forme grecque, isolément, ne tranche pas.
