  text: Guard yourself against an impudent eye[b][a], and do not be surprised if she sins against you.
translation:
  language: fr
  text: Garde-toi d’un regard effronté[a], et ne sois pas surpris si elle pèche contre toi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Garde-toi derrière/loin d’un œil effronté. » La tournure grecque est difficile; le texte traduit son sens probable.'
    reason: lexical_alternative
  - marker: b
    text: Le grec n’exprime pas ici le pronom « elle »; le sujet féminin est déduit du contexte.
    reason: alternative_reading
lexical_decisions:
- source_word: ὀπίσω
  choice: de
  rationale: Avec φύλαξαι, la tournure grecque est difficile et probablement idiomatique. « Garde-toi de » exprime naturellement en français l’idée de mise en garde et d’éloignement, sans prétendre résoudre entièrement la valeur inhabituelle de ὀπίσω.
- source_word: ἀναιδοῦς
  choice: effronté
  rationale: Le mot qualifie ce qui est sans honte ou sans retenue. « Effronté » convient naturellement à « regard » et conserve la portée morale du grec.
- source_word: ὀφθαλμοῦ
  choice: regard
  rationale: Le grec dit littéralement « œil », mais en français « regard effronté » rend plus naturellement l’action et l’attitude évoquées. La formulation littérale est signalée en note.
- source_word: φύλαξαι
  choice: Garde-toi
  rationale: L’impératif aoriste de φυλάσσω appelle ici une injonction directe de prudence ou de protection. « Garde-toi » est à la fois courant et digne.
- source_word: μὴ θαυμάσῃς
  choice: ne sois pas surpris
  rationale: Dans cet avertissement, θαυμάζω exprime la surprise plutôt que l’admiration. Cette traduction correspond à la fonction pragmatique de la phrase.
- source_word: ἐὰν
  choice: si
  rationale: La conjonction introduit formellement une éventualité conditionnelle; « si » évite de présenter l’acte comme inévitable.
- source_word: εἰς σέ
  choice: contre toi
  rationale: Avec πλημμελέω, εἰς suivi de l’accusatif désigne la personne lésée. « Contre toi » rend clairement cette relation.
- source_word: πλημμελήσῃ
  choice: pèche contre toi
  rationale: Le verbe peut désigner une faute, un tort ou un péché. « Pèche contre toi » en maintient le poids moral et la dimension relationnelle.
theological_decisions:
- issue: Sujet féminin suggéré mais non exprimé dans la proposition grecque
  choice: Employer « elle » dans le texte et signaler l’inférence en note.
  alternative: Traduire sans sujet féminin explicite, par exemple « s’il y a faute contre toi ».
  rationale: Le contexte immédiat de Siracide 26 porte sur une femme ou épouse moralement dévoyée, ce qui permet d’identifier le sujet. Toutefois, le verbe grec n’exprime aucun pronom; la note préserve donc cette distinction entre texte et contexte.
translation_notes:
  register: Français international moderne, direct et digne. « Garde-toi » conserve la vigueur sapientielle de l’impératif; « regard effronté » est plus naturel que le littéral « œil effronté ». Les deux notes rendent transparentes la difficulté syntaxique et l’inférence de genre.
