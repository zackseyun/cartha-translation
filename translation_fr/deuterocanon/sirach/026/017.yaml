base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/026/017.yaml
  text: Like the sun rising in the heights of the Lord[b][a], so is the beauty of a good wife in the adornment of his house.
translation:
  language: fr
  text: 'Le soleil qui se lève dans les hauteurs du Seigneur : telle est la beauté d’une bonne épouse[b] dans la parure[a] de sa maison[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut désigner la parure, mais aussi l’ordre ou l’agencement.
    reason: lexical_alternative
  - marker: b
    text: Ou «d’une bonne femme»; dans ce contexte domestique, «épouse» paraît toutefois plus probable.
    reason: lexical_alternative
  - marker: c
    text: 'Le pronom grec traduit par «sa» est masculin : littéralement, «de sa maison à lui».'
    reason: source_form
lexical_decisions:
- source_word: ἥλιος ἀνατέλλων
  choice: le soleil qui se lève
  rationale: La proposition relative rend naturellement en français le participe grec tout en conservant l’image en mouvement.
- source_word: ἐν ὑψίστοις Κυρίου
  choice: dans les hauteurs du Seigneur
  rationale: Le pluriel ὑψίστοις désigne des lieux très élevés; le complément «du Seigneur» maintient le génitif Κυρίου sans le remplacer par «du ciel».
- source_word: κάλλος
  choice: la beauté
  rationale: Équivalent direct de κάλλος, clair et digne dans cette comparaison.
- source_word: ἀγαθῆς γυναικός
  choice: d’une bonne épouse
  rationale: γυνή peut signifier «femme» ou «épouse»; le cadre domestique favorise ici «épouse», tandis que «bonne» évite d’ajouter une qualification morale plus étroite.
- source_word: ἐν κόσμῳ
  choice: dans la parure
  rationale: κόσμος peut désigner l’ordre, l’agencement ou la parure. Dans cette image de beauté domestique, «parure» est idiomatique, tandis qu’une note préserve l’étendue du terme grec.
- source_word: οἰκίας αὐτοῦ
  choice: de sa maison
  rationale: Cette formulation suit οἰκίας αὐτοῦ de façon naturelle. Comme le possessif français ne marque pas le genre du possesseur, une note précise que le pronom grec est masculin.
theological_decisions:
- issue: Langage genré du foyer
  choice: bonne épouse … sa maison
  alternative: bonne femme … la maisonnée; bonne épouse … la maison de son mari
  rationale: Le contexte favorise le sens conjugal de γυνή, et αὐτοῦ est masculin. Le texte principal reste naturel en français, tandis que les notes signalent les ambiguïtés lexicales et la forme masculine du grec sans imposer une reconstruction explicative.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Les deux membres nominaux du grec sont reliés par «telle est», qui explicite sobrement la comparaison implicite sans ajouter l’idée de resplendissement.
