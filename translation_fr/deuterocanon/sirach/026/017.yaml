  source_fidelity: 'Le texte rend fidèlement les principaux éléments grecs : ἥλιος ἀνατέλλων (« le soleil qui se lève »), ἐν ὑψίστοις Κυρίου (« dans les hauteurs du Seigneur »), κάλλος (« beauté »), ἀγαθῆς γυναικός (« d’une bonne épouse »), ἐν κόσμῳ (« dans la parure ») et οἰκίας αὐτοῦ (« de sa maison »). « Telle est » exprime naturellement en français la comparaison implicite du grec sans ajout interprétatif. Le possessif masculin αὐτοῦ est correctement signalé, sans forcer dans le texte français un référent qui n’y est pas exprimé lexicalement.'
