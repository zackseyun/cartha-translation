  text: A good wife is a good gift[a]; she will be given into the bosom of one who fears God.
translation:
  language: fr
  text: Une bonne épouse est un bon cadeau[a] ; elle sera donnée dans le giron de celui qui craint Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Une bonne épouse est une bonne part ; elle sera donnée dans la part de ceux qui craignent le Seigneur. » L’hébreu dit « dans le giron de celui qui craint Dieu », conservant une image plus intime, le singulier et le titre « Dieu ».'
    reason: 'Lecture parallèle grecque différente : « cadeau/part », image finale, singulier/pluriel et « Dieu/Seigneur ». '
lexical_decisions:
- source_word: אִשָּׁה טוֹבָה
  choice: une bonne épouse
  rationale: אִשָּׁה peut désigner une femme ou une épouse. Le contexte conjugal du passage favorise ici « épouse », sans perdre l’adjectif répété « bonne ».
- source_word: מַתָּנָה טוֹבָה
  choice: un beau cadeau
  rationale: מַתָּנָה désigne un don ou un cadeau. « Beau cadeau » est naturel en français et rend la valeur positive de טוֹבָה, même si la répétition exacte de « bon » est légèrement atténuée.
- source_word: בְּחֵיק
  choice: pour qu’il la serre contre son cœur
  rationale: חֵיק désigne le sein, la poitrine ou le giron et évoque ici une proximité intime. Cette formulation française conserve l’image relationnelle sans employer le peu naturel « dans le sein de ».
- source_word: יֵרֵא אֱלֹהִים
  choice: celui qui craint Dieu
  rationale: La formule rend le singulier hébreu et conserve « Dieu », conformément au témoin hébreu principal, sans ajouter explicitement « homme ».
- source_word: תִּנָּתֵן
  choice: elle sera donnée
  rationale: Le niphal inaccompli est rendu par un futur passif, avec le sujet féminin explicité en français.
theological_decisions:
- issue: Titre divin dans la proposition finale
  choice: Dieu
  alternative: le Seigneur
  rationale: Le texte hébreu principal porte אֱלֹהִים, « Dieu », tandis que le parallèle grec porte Κύριον, « le Seigneur ». Le texte principal suit donc l’hébreu, et la variante grecque est signalée en note.
- issue: Image de la relation conjugale
  choice: à celui qui craint Dieu, pour qu’il la serre contre son cœur
  alternative: dans le giron de celui qui craint Dieu
  rationale: La traduction conserve l’intimité de l’image hébraïque tout en évitant de réduire la femme à un simple bien possédé. Elle ne reprend pas dans le texte principal l’idée grecque de « part » ou de « lot ».
translation_notes:
  register: Français international moderne, proverbial et digne. « Épouse » précise le sens conjugal. « Serrer contre son cœur » restitue naturellement l’image concrète de בְּחֵיק ; le point-virgule maintient le parallélisme bref du verset.
