revisions:
- from: 'Deux choses affligent mon cœur, et une troisième fait monter en moi la colère : un guerrier réduit au dénuement, des hommes de discernement rejetés comme des déchets[a], et celui qui retourne de la justice au péché — le Seigneur le destinera à l’épée.[b]'
  to: 'Mon cœur est affligé à cause de deux choses, et à cause d’une troisième la colère s’est emparée de moi : un guerrier réduit au dénuement par la pauvreté, des hommes de discernement lorsqu’ils sont traités comme des déchets[a], et celui qui retourne de la justice au péché — le Seigneur le préparera pour l’épée.[b]'
  rationale: La révision explicite la condition présente dans le grec, rapproche les verbes introductifs de leurs valeurs aspectuelles respectives et maintient l’image judiciaire de la préparation « pour l’épée ». L’ambiguïté syntaxique concernant le référent du pronom final est préservée par la note.
