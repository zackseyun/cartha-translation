review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire pour rendre plus directement les temps et la construction du grec : le cœur « est affligé » (parfait à valeur présente), tandis que la colère « s’est emparée » du locuteur (aoriste). La condition ἐὰν (« lorsqu’ils sont / s’ils sont ») doit être explicite. « Destinera » interprète ἑτοιμάσει de manière un peu trop déterministe ; « préparera pour l’épée » en préserve l’image et la portée judiciaire sans la renforcer.'
  naturalness: Le texte révisé reste naturel dans un français international moderne, avec une cadence ternaire et une conclusion abrupte conformes au style sapientiel. « Lorsqu’ils sont traités comme des déchets » est plus idiomatique et plus exact que le simple participe « rejetés ».
  terminology: « Seigneur », « justice », « péché » et « épée » conviennent au registre biblique français. « Justice » conserve ici la largeur de δικαιοσύνη, dans son opposition à ἁμαρτία, sans imposer une lecture doctrinale particulière. « Hommes de discernement » rend bien ἄνδρες συνετοί.
  issues:
