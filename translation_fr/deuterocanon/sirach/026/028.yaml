    issue: La subordonnée conditionnelle ἐὰν σκυβαλωθῶσιν n’est pas explicitement rendue.
    rationale: '« Des hommes de discernement rejetés » décrit un état, mais le grec formule explicitement le cas conditionnel : « lorsqu’ils sont traités comme des déchets ».'
  - severity: low
    issue: « Une troisième fait monter en moi la colère » affaiblit la formulation événementielle du grec.
    rationale: θυμός μοι ἐπῆλθεν signifie littéralement que la colère est venue sur le locuteur ; « la colère s’est emparée de moi » rend mieux l’aoriste et l’image.
  - severity: low
    issue: « Le destinera à l’épée » est plus interprétatif que ἑτοιμάσει εἰς ῥομφαίαν.
    rationale: Le verbe signifie « préparer » ; le conserver évite de présenter comme explicitement prédéterminé ce que le grec exprime sous l’image d’une préparation au jugement par l’épée.
