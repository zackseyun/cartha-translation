base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/026/028.yaml
  text: 'Over two things my heart is grieved[a], and over a third anger has come upon me: a warrior brought low by poverty, and men of understanding if they are treated like refuse[b], and one who turns back from righteousness to sin—the Lord will prepare him for the sword.'
translation:
  language: fr
  text: 'Mon cœur est affligé à cause de deux choses, et à cause d’une troisième la colère s’est emparée de moi : un guerrier réduit au dénuement par la pauvreté, des hommes de discernement lorsqu’ils sont traités comme des déchets[a], et celui qui retourne de la justice au péché — le Seigneur le préparera pour l’épée.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « traités comme des ordures » ou « rejetés comme du fumier » ; le verbe grec est formé sur un mot désignant des déchets et exprime un profond mépris.
    reason: lexical_alternative
  - marker: b
    text: Le pronom singulier « le » renvoie le plus naturellement à celui qui retourne de la justice au péché. La syntaxe grecque est cependant condensée, et la sentence peut aussi être comprise comme la conclusion de toute l’énumération.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐπὶ δυτὶ λελύπηται ἡ καρδία μου
  choice: Deux choses affligent mon cœur
  rationale: Cette formulation française naturelle conserve la tournure de lamentation et rend le parfait grec par un état présent d’affliction.
- source_word: καὶ ἐπὶ τῷ τρίτῳ θυμός μοι ἐπῆλθεν
  choice: et une troisième fait monter en moi la colère
  rationale: La formulation garde l’image dynamique d’une colère qui survient, sans renforcer θυμός jusqu’à la rage.
- source_word: ἀνὴρ πολεμιστὴς ὑστερῶν διʼ ἔνδειαν
  choice: un guerrier réduit au dénuement
  rationale: « Guerrier » rend directement πολεμιστής, tandis que « réduit au dénuement » exprime le manque et l’abaissement causés par l’indigence.
- source_word: ἄνδρες συνετοὶ
  choice: des hommes de discernement
  rationale: συνετός désigne l’intelligence capable de comprendre et de juger avec justesse ; « discernement » en garde la portée intellectuelle et morale.
- source_word: ἐὰν σκυβαλωθῶσιν
  choice: rejetés comme des déchets
  rationale: Le verbe, formé sur σκύβαλον, évoque un traitement dégradant réservé à ce que l’on jette. La traduction conserve à la fois le rejet et le mépris.
- source_word: ἐπανάγων ἀπὸ δικαιοσύνης ἐπὶ ἁμαρτίαν
  choice: celui qui retourne de la justice au péché
  rationale: « Retourne » garde le mouvement régressif du participe. Dans ce contexte sapientiel, « justice » désigne une conduite droite opposée au péché et sonne plus naturellement que « droiture » dans la construction « de… au… ».
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: κύριος désigne ici Dieu ; « le Seigneur » est la forme française courante sans imposer une convention typographique liée au tétragramme hébreu.
- source_word: ἑτοιμάσει εἰς ῥομφαίαν αὐτόν
  choice: le destinera à l’épée
  rationale: L’expression annonce que Dieu vouera cet homme au jugement par l’épée. « Destinera à l’épée » restitue naturellement en français la valeur de préparation ou d’assignation portée par l’idiome.
theological_decisions:
- issue: Référent du pronom singulier αὐτόν après l’énumération
  choice: Le pronom « le » renvoie le plus naturellement à celui qui retourne de la justice au péché.
  alternative: La sentence finale peut être entendue comme récapitulant l’ensemble de l’énumération.
  rationale: Le singulier suit immédiatement le participe singulier désignant celui qui retourne au péché. La syntaxe grecque reste toutefois condensée ; une note conserve donc la possibilité d’une portée plus générale.
- issue: Sens de δικαιοσύνη
  choice: justice
  alternative: droiture
  rationale: Dans ce contexte, le terme désigne la conduite juste opposée au péché. « Justice » garde le terme traditionnel et la largeur sémantique du grec, sans réduire celui-ci à une seule qualité personnelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme ternaire et la brusque sentence finale sont conservés ; le tiret marque le passage au jugement sans lisser entièrement la syntaxe grecque.
