  text: A merchant will scarcely be kept from wrongdoing[b][a], and a shopkeeper will not be declared righteous from sin.
translation:
  language: fr
  text: Un marchand échappera difficilement à la faute[a], et un petit commerçant[b] ne sera pas justifié de péché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se dégagera difficilement de la faute ». Le verbe grec peut signifier « échapper » ou « se tirer, se dégager de » quelque chose.
    reason: lexical_alternative
  - marker: b
    text: Le terme grec désigne un vendeur au détail ou un commerçant à petite échelle et pouvait avoir une connotation sociale défavorable.
    reason: cultural_note
lexical_decisions:
- source_word: Μόλις
  choice: difficilement
  rationale: Exprime qu’une chose n’arrive qu’à grand-peine ou à peine; avec « échappera », cette formulation est naturelle et conserve la force proverbiale.
- source_word: ἐξελεῖται
  choice: échappera
  rationale: La forme moyenne peut exprimer le fait de se tirer de quelque chose ou d’y échapper. Le français « échapper à » convient naturellement avec ἀπό et préserve l’ambiguïté lexicale signalée en note.
- source_word: ἔμπορος
  choice: marchand
  rationale: Désigne une personne qui pratique le commerce; « marchand » est précis, courant et neutre.
- source_word: πλημμελείας
  choice: faute
  rationale: Le terme désigne une faute, un manquement ou une mauvaise action sans préciser nécessairement une fraude commerciale.
- source_word: δικαιωθήσεται
  choice: sera déclaré juste
  rationale: Préserve la valeur déclarative ou judiciaire du passif de δικαιόω sans recourir au terme théologique potentiellement technique « justifié ».
- source_word: κάπηλος
  choice: petit commerçant
  rationale: Désigne un détaillant ou vendeur à petite échelle, terme qui pouvait porter une nuance sociale défavorable; la traduction reste intelligible sans imposer cette nuance dans le corps du texte.
- source_word: ἁμαρτίας
  choice: péché
  rationale: Conserve le sens moral et religieux explicite du terme grec plutôt que de l’atténuer en « faute » ou « offense ».
theological_decisions:
- issue: Valeur de δικαιωθήσεται dans un contexte sapientiel
  choice: ne sera pas déclaré juste
  alternative: ne sera pas justifié; ne sera pas acquitté
  rationale: La formulation garde la dimension déclarative et judiciaire du verbe, sans importer dans ce proverbe un système doctrinal ultérieur.
- issue: Construction ἀπὸ ἁμαρτίας après δικαιωθήσεται
  choice: déclaré juste du péché
  alternative: tenu pour innocent de péché; déclaré exempt de péché
  rationale: La construction grecque est inhabituelle en français. La traduction formelle en conserve la tension et n’explicite pas si le sens est l’acquittement d’un péché précis ou l’absence de péché en général.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Petit commerçant » distingue κάπηλος de ἔμπορος. La tournure volontairement formelle « déclaré juste du péché » suit de près la construction grecque et en préserve l’étrangeté ainsi que la tension judiciaire.
