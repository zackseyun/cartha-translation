  text: A woman's sexual immorality is known by the lifting of her eyes[b][a], and by her eyelids.
translation:
  language: fr
  text: L’inconduite sexuelle d’une femme se reconnaît aux mouvements de ses yeux[a] et à ses paupières[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «aux yeux levés», «au regard errant» ou «au regard hautain». Le terme grec est difficile et peut évoquer un regard levé, mobile ou suggestif.
    reason: lexical_alternative
  - marker: b
    text: Littéralement «dans ses paupières»; il s’agit sans doute de ce que révèle l’expression de son regard.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορνεία
  choice: inconduite sexuelle
  rationale: Expression française actuelle et assez large pour désigner un comportement sexuel illicite, sans réduire le terme à la prostitution.
- source_word: γυναικὸς
  choice: d’une femme
  rationale: Le génitif sans article a ici une portée générique, conforme au style proverbial.
- source_word: ἐν
  choice: à
  rationale: La préposition introduit les signes extérieurs auxquels la conduite est reconnue; «se reconnaît à» est idiomatique en français.
- source_word: μετεωρισμοῖς ὀφθαλμῶν
  choice: aux mouvements de ses yeux
  rationale: μετεωρισμοῖς est difficile et peut évoquer des yeux levés, mobiles, errants ou hautains. «Mouvements» préserve une certaine indétermination sans imposer une interprétation unique.
- source_word: βλεφάροις
  choice: à ses paupières
  rationale: Le grec nomme concrètement les paupières, probablement comme signe visible de l’expression du regard; l’image est conservée.
- source_word: γνωσθήσεται
  choice: se reconnaît
  rationale: Le futur passif grec a une valeur générale ou proverbiale; le présent français rend naturellement cette portée gnomique tout en gardant l’idée de reconnaissance.
theological_decisions:
- issue: Portée morale de πορνεία dans ce proverbe sapientiel
  choice: inconduite sexuelle
  alternative: prostitution; fornication; impudicité
  rationale: Le terme grec peut couvrir diverses conduites sexuelles illicites. La traduction choisie conserve cette largeur sans introduire une catégorie confessionnelle ou juridique plus étroite.
translation_notes:
  register: Français international moderne, sobre et proverbial. «Inconduite sexuelle» est digne et accessible; les notes maintiennent l’ambiguïté du syntagme grec sans la résoudre dans le corps du texte.
