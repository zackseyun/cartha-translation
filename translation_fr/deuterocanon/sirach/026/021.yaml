  text: Un guerrier qui manque du nécessaire[a], et des hommes avisés, s’ils sont traités comme des déchets[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En grec, cette proposition reste syntaxiquement inachevée lorsqu’on la lit isolément et semble se poursuivre dans la ligne suivante. La traduction en conserve la forme fragmentaire plutôt que d’en faire une phrase complète.
