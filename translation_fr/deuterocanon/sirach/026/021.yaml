    text: Ou « s’ils sont rejetés comme des ordures ». Le verbe grec évoque quelque chose de sale ou sans valeur que l’on jette.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ πολεμιστής
  choice: un guerrier
  rationale: Cette formulation concise conserve le masculin singulier et désigne naturellement un homme de guerre.
- source_word: ὑστερῶν διʼ ἔνδειαν
  choice: qui manque du nécessaire
  rationale: ὑστερέω exprime ici le manque ou la privation, tandis que ἔνδεια en précise la cause ou la condition. La formulation française évite d’ajouter l’idée moins directe d’un affaiblissement physique.
- source_word: ἄνδρες συνετοί
  choice: des hommes avisés
  rationale: συνετός évoque le discernement et le bon sens pratique. « Avisés » restitue cette nuance dans un français courant et digne.
- source_word: ἐὰν σκυβαλωθῶσιν
  choice: s’ils sont traités comme des déchets
  rationale: Le verbe, apparenté à σκύβαλον, évoque ce qui est tenu pour rebut, puis jeté. Cette traduction conserve l’image dégradante sans la réduire à la seule idée d’excréments.
