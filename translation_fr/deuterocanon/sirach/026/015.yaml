    rationale: Le français moderne peut comprendre « femme » comme « woman » plutôt que comme « wife », alors que le contexte immédiat favorise clairement le sens d’épouse pour γυνή.
  - severity: medium
    issue: « Réservée » affaiblit le sens de σιγηρά.
    rationale: Le grec vise plus spécifiquement le fait d’être silencieuse ou de parler peu; « réservée » peut désigner une disposition générale sans rapport nécessaire avec la parole.
  - severity: low
