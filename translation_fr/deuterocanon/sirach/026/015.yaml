  text: A quiet wife is a gift from the Lord[a], and there is no equivalent for a disciplined soul.
translation:
  language: fr
  text: Une épouse silencieuse est un don du Seigneur, et il n’y a pas d’équivalent pour une âme instruite.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour une âme bien formée » ou « disciplinée ». Le grec πεπαιδευμένης peut évoquer l’instruction aussi bien que la formation disciplinaire; « équivalent » peut aussi se rendre par « échange » ou « contrepartie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: δόσις
  choice: don
  rationale: Dans cette maxime, le mot désigne ce qui est donné plutôt que l’acte de donner.
- source_word: Κυρίου
  choice: du Seigneur
  rationale: Le génitif indique la source du don; « Seigneur » est la désignation française naturelle dans ce contexte.
- source_word: γυνὴ
  choice: femme
  rationale: Le contexte matrimonial donne ici à γυνή le sens d’épouse; en français, « une femme » peut naturellement désigner l’épouse dans une maxime.
- source_word: σιγηρά
  choice: réservée
  rationale: Le terme évoque la retenue dans la parole ou une attitude paisible, sans suggérer un mutisme absolu comme pourrait le faire « silencieuse ».
- source_word: ἀντάλλαγμα
  choice: rien n’égale
  rationale: La tournure idiomatique exprime qu’aucune contrepartie ni aucun équivalent ne peut correspondre à cette valeur.
- source_word: πεπαιδευμένης
  choice: bien formée
  rationale: Le participe de παιδεύω peut désigner une personne instruite, éduquée et disciplinée; « bien formée » conserve cette amplitude.
- source_word: ψυχῆς
  choice: âme
  rationale: Le mot vise ici la personne intérieure et son caractère; « âme » maintient le registre moral de la littérature sapientielle.
theological_decisions:
- issue: Rapport entre πεπαιδευμένης ψυχῆς et la femme de la première proposition
  choice: Conserver « âme » sans répéter explicitement « femme », tout en laissant le parallélisme relier les deux propositions.
  alternative: Expliciter « une femme à l’âme disciplinée » ou comprendre plus largement « une personne bien formée ».
  rationale: Le grec ne répète pas γυνή dans la seconde proposition. Le contexte favorise un lien avec l’épouse décrite, mais l’expression conserve grammaticalement une portée plus générale qu’il ne convient pas de supprimer.
translation_notes:
  register: Français international moderne, proverbial et digne. « Réservée » exprime positivement la retenue sans imposer le silence; « bien formée » évite de réduire παιδεύω à la seule éducation scolaire.
