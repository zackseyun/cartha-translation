  text: Whether rich or poor[a], a good heart has a cheerful face at all times.
translation:
  language: fr
  text: Riche ou pauvre[a], celui qui a bon cœur a toujours le visage joyeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Le cœur du riche comme du pauvre est bon ; en tout temps, le visage est joyeux. » Le grec est très condensé et ne précise pas explicitement le rapport entre la disposition intérieure et l’expression du visage.'
    reason: ambiguïté syntaxique
lexical_decisions:
- source_word: πλουσίου δὲ καὶ πτωχοῦ
  choice: Riche ou pauvre
  rationale: Les deux génitifs opposent la richesse et la pauvreté. La tournure française concise exprime naturellement cette alternative; δέ marque ici une transition légère qui n’exige pas nécessairement « mais ».
- source_word: καρδία ἀγαθή
  choice: celui qui a bon cœur
  rationale: « Avoir bon cœur » conserve l’image concrète du cœur comme siège des dispositions intérieures, tout en donnant une phrase française naturelle. Le grec, sans verbe, reste syntaxiquement condensé.
- source_word: ἐν παντὶ καιρῷ
  choice: toujours
  rationale: Cette expression temporelle signifie ici « en tout temps »; « toujours » est son équivalent français courant et direct.
- source_word: πρόσωπον ἱλαρόν
  choice: a le visage joyeux
  rationale: πρόσωπον désigne le visage, et ἱλαρόν une apparence joyeuse, gaie ou radieuse. « Le visage joyeux » préserve l’image sans employer le terme plus littéraire « figure ».
