translation:
  language: fr
  text: 'Mon cœur a craint trois choses, et devant un quatrième visage, j’ai supplié[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « devant le quatrième visage ». « Visage » peut aussi désigner une personne ou, selon l’expression, un quatrième élément de l’énumération.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τριῶν
  choice: Devant trois choses
  rationale: ἀπό introduit ici les causes de la crainte. Le nom « choses » est ajouté en français pour rendre le numéral intelligible sans préciser d’avance les réalités énumérées ensuite.
- source_word: εὐλαβήθη
  choice: a pris peur
  rationale: Dans ce contexte, le verbe exprime l’appréhension ou la crainte, non la révérence. « A pris peur » conserve la réaction intérieure tout en restant naturel.
- source_word: ἡ καρδία μου
  choice: mon cœur
  rationale: Le maintien de « mon cœur » préserve l’image anthropologique du grec, où le cœur est le siège de la réaction intérieure.
- source_word: ἐπὶ τῷ τετάρτῳ προσώπῳ
  choice: devant la quatrième
  rationale: πρόσωπον peut désigner le visage, la personne ou la présence. En français, « devant la quatrième » garde l’énumération et une part de l’ambiguïté sans imposer maladroitement « visage » ni préciser « personne » ou « chose ».
- source_word: ἐδεήθην
  choice: j’ai supplié
  rationale: δέομαι signifie implorer ou supplier et peut, selon le contexte, désigner une prière. « J’ai supplié » conserve l’intensité du verbe sans ajouter explicitement un destinataire absent du verset.
theological_decisions:
- issue: Interprétation de ἐπὶ τῷ τετάρτῳ προσώπῳ
  choice: devant la quatrième
  alternative: au sujet de la quatrième personne / devant le quatrième visage / à cause de la quatrième chose
  rationale: Le grec emploie littéralement πρόσωπον, « visage », terme qui peut aussi renvoyer à une personne ou à sa présence. La formulation française conserve l’indétermination du référent, que la suite éclaire, plutôt que de trancher entre « personne » et « chose ».
- issue: Portée religieuse de ἐδεήθην
  choice: j’ai supplié
  alternative: j’ai prié
  rationale: Le verbe peut décrire une supplication adressée à Dieu, mais aucun complément n’est exprimé ici. « J’ai supplié » traduit directement l’acte sans résoudre implicitement la question du destinataire.
translation_notes:
  register: Français international moderne, sobre et digne. La structure ternaire suivie d’un quatrième élément est conservée. La ponctuation finale introduit naturellement l’énumération du verset suivant.
