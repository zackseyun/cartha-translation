  yaml_path: translation/deuterocanon/sirach/026/007.yaml
  text: A jealous wife is heartache and grief when set against another woman[b][a], and a scourge of the tongue that associates with everyone.
translation:
  language: fr
  text: Une femme jalouse envers une autre femme est une douleur au cœur et un chagrin, et un fouet de la langue qui atteint tous[b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une épouse rivale envers une autre épouse ». Le grec peut évoquer la rivalité avec une autre femme, peut-être une coépouse, mais il peut aussi désigner plus généralement la jalousie dirigée contre une autre femme.'
    reason: lexical_alternative
  - marker: b
    text: La fin du verset est difficile. Littéralement, le grec parle d’« un fouet de la langue » qui communique ou entre en relation « avec tous » ; il peut s’agir d’une parole qui frappe tout le monde sans distinction.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλγος καρδίας
  choice: douleur du cœur
  rationale: Cette expression conserve l’image grecque du cœur comme siège de la souffrance intérieure, tout en restant claire en français moderne.
- source_word: πένθος
  choice: deuil
  rationale: Le mot grec désigne une profonde affliction, souvent le deuil. « Deuil » préserve sa force et forme un parallèle marqué avec « douleur du cœur ».
- source_word: γυνὴ ἀντίζηλος
  choice: une femme jalouse
  rationale: ἀντίζηλος peut exprimer la jalousie ou la rivalité. « Femme jalouse » rend le sens relationnel sans imposer la situation plus précise de deux coépouses.
- source_word: ἐπὶ γυναικί
  choice: quand elle se dresse contre une autre femme
  rationale: La tournure grecque est condensée. Cette formulation exprime l’orientation hostile ou rivale envers une autre femme tout en laissant ouverte la nature exacte de leur relation.
- source_word: μάστιξ γλώσσης
  choice: un fouet de la langue
  rationale: La traduction conserve la métaphore vive de la parole qui fouette ou blesse. Sa formulation légèrement inhabituelle correspond à celle du grec.
- source_word: πᾶσιν ἐπικοινωνοῦσα
  choice: qui atteint tout le monde
  rationale: Le participe évoque ce qui entre en relation avec tous ou s’étend à tous. Dans le contexte du fouet verbal, « atteint tout le monde » donne un sens naturel sans restreindre les victimes de cette parole.
