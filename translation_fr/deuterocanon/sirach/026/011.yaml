  text: Keep strict watch over a headstrong daughter[a], lest, finding freedom for herself, she make use of it.
translation:
  language: fr
  text: Pour une fille inflexible, mets en place une surveillance stricte, de peur que, trouvant pour elle-même quelque liberté, elle n’en fasse usage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Pour une fille inflexible, affermis une garde, de peur que, trouvant pour elle-même de la liberté, elle n’en fasse usage. » Le grec est concis; « en » renvoie à la liberté qu’elle trouve.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ θυγατρὶ ἀδιατρέπτως
  choice: Pour une fille inflexible
  rationale: ἐπί avec le datif introduit ici la personne faisant l’objet de la vigilance. ἀδιατρέπτως, forme adverbiale au sens littéral de « sans se laisser détourner », qualifie de manière concise une disposition ferme ou rétive; « inflexible » conserve cette force sans ajouter l’idée plus accusatrice d’incorrigibilité.
- source_word: στερέωσον φυλακήν
  choice: établis une surveillance rigoureuse
  rationale: L’impératif στερέωσον signifie rendre ferme ou solidement établir, et φυλακή désigne la garde ou la surveillance. La formulation française exprime naturellement l’établissement d’une garde stricte.
- source_word: ἵνα μὴ
  choice: de peur que… ne
  rationale: Cette tournure française rend naturellement la proposition finale négative grecque dans un registre digne.
- source_word: εὑροῦσα ἄνεσιν
  choice: trouvant du relâchement
  rationale: ἄνεσις peut désigner le relâchement, l’aisance ou la liberté par rapport à une contrainte. « Relâchement » maintient ici le lien avec la surveillance sans préciser indûment s’il s’agit de liberté, de facilité ou d’occasion.
- source_word: ἑαυτῇ χρήσηται
  choice: elle n’en profite
  rationale: χράομαι signifie faire usage de; le datif réfléchi ἑαυτῇ indique un usage à son propre bénéfice. « En profite » reprend idiomatiquement le relâchement trouvé, tout en conservant la concision du grec.
