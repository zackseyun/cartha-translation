lexical_decisions:
- source_word: Ἐπὶ δυτὶ
  choice: À cause de deux choses
  rationale: Avec le datif, ἐπί indique ici le motif ou l’occasion de l’affliction. Cette formulation naturelle conserve l’énumération.
- source_word: λελύπηται
  choice: est affligé
  rationale: Le parfait moyen-passif exprime un état présent résultant de l’affliction ; « est affligé » en garde la valeur stative.
- source_word: ἡ καρδία μου
  choice: mon cœur
  rationale: La traduction directe préserve l’image biblique du cœur comme siège des émotions.
- source_word: ἐπὶ τῷ τρίτῳ
  choice: à cause de la troisième
  rationale: La reprise de la même tournure grecque maintient le parallélisme et la progression vers le troisième élément.
- source_word: θυμός
  choice: la colère
  rationale: θυμός désigne ici une forte colère ; « colère » est clair et actuel sans accentuer indûment l’intensité.
- source_word: μοι ἐπῆλθεν
  choice: m’a saisi
  rationale: Cette expression idiomatique rend l’idée d’une colère qui survient et s’empare du locuteur, sans trancher entre une origine intérieure ou extérieure.
