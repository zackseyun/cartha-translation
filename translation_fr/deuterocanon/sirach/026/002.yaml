translation:
  language: fr
  text: Une femme de valeur réjouit son mari, et il passera ses années dans la douceur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « et il achèvera ses années dans la paix » ; autre lecture possible de la proposition finale.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵשֶׁת חַיִל
  choice: une femme de valeur
  rationale: L’expression désigne une épouse caractérisée par la force, la compétence et une valeur éprouvée. « Femme de valeur » reste naturel et digne en français, tout en conservant l’ampleur sémantique de חַיִל sans lui donner un sens exclusivement guerrier.
- source_word: תְּדַּשֵּׁן
  choice: réjouit
  rationale: Le verbe évoque littéralement le fait de rendre gras, prospère ou florissant. Dans ce contexte, il exprime le bien-être et la joie qu’elle procure à son mari; le parallèle grec εὐφραίνει confirme « réjouit ».
- source_word: לְבַעֲלָהּ
  choice: son mari
  rationale: בעל désigne ici sans ambiguïté le mari; la construction française directe est idiomatique.
- source_word: וּשְׁנֵי חַיָּיו
  choice: ses années
  rationale: L’hébreu dit littéralement « les années de sa vie ». « Ses années » en conserve l’accent temporel avec concision.
- source_word: יְבַלֶּה
  choice: il passera
  rationale: Le verbe signifie ici passer ou vivre le temps de sa vie. « Il passera ses années » est une formulation française claire et proche de l’hébreu.
- source_word: בַנְעִימִים
  choice: dans l’agrément
  rationale: Le terme renvoie à ce qui est agréable, doux ou délicieux. « Dans l’agrément » conserve ce sens abstrait sans le confondre avec la lecture grecque « dans la paix ».
theological_decisions:
- issue: Divergence entre l’hébreu et le grec dans la proposition finale
  choice: Suivre dans le texte principal l’hébreu « dans l’agrément »
  alternative: « dans la paix » selon le grec
  rationale: Le texte hébreu conservé est ici le témoin principal et porte l’idée d’agrément ou de douceur. Le grec peut refléter une variante ou une interprétation; sa lecture distincte est donc signalée en note sans effacer la tension textuelle.
translation_notes:
  register: Français international moderne, clair et digne. « Femme de valeur » fait écho au vocabulaire sapientiel sans archaïsme marqué; « dans l’agrément » maintient la nuance propre du témoin hébreu.
