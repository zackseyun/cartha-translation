  text: And they bowed down a second time[b][a], to receive blessing from before him.
translation:
  language: fr
  text: Ils se prosternèrent une seconde fois[b], afin de recevoir la bénédiction de sa part[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit : « afin de manifester la bénédiction venant du Très-Haut »; cette lecture interprétative désigne explicitement Dieu, plutôt que le prêtre, comme source de la bénédiction.'
    reason: alternative_reading
  - marker: b
    text: L’hébreu dit littéralement « tomber »; dans ce contexte, il s’agit de se prosterner dans l’adoration.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁנוּ
  choice: une seconde fois
  rationale: Le verbe exprime la répétition de l’acte; avec שֵׁנִית, le français naturel rend l’ensemble par « une seconde fois » sans reproduire une redondance maladroite.
- source_word: לִנְפּוֹל
  choice: se prosternèrent
  rationale: Le sens littéral est « tomber », mais le contexte liturgique et le parallèle grec προσκύνησις indiquent une prosternation cultuelle.
- source_word: שֵׁנִית
  choice: une seconde fois
  rationale: Conserve explicitement l’insistance hébraïque sur le second acte de prosternation.
- source_word: בְּרָכוֹת
  choice: la bénédiction
  rationale: Bien que la forme hébraïque soit plurielle, le singulier collectif est idiomatique en français et correspond au singulier du parallèle grec.
- source_word: לָקַחַת
  choice: recevoir
  rationale: Dans ce contexte, « recevoir » exprime naturellement l’accueil de la bénédiction, plutôt que le sens plus matériel de « prendre ».
- source_word: מִפָּנָיו
  choice: de sa présence
  rationale: Cette formulation conserve l’image hébraïque de la face ou présence et maintient l’ambiguïté du pronom, sans identifier explicitement son antécédent.
theological_decisions:
- issue: Antécédent de מִפָּנָיו et divergence du grec
  choice: 'Conserver dans le texte le pronom ambigu : « de sa présence ».'
  alternative: « du Très-Haut », selon le grec.
  rationale: L’hébreu conservé porte un suffixe pronominal de troisième personne, tandis que le grec explicite le Très-Haut comme source. La traduction principale suit l’hébreu et la note signale la lecture grecque sans résoudre silencieusement la tension.
translation_notes:
  register: Français international moderne, naturel et digne. « Se prosterner » rend clairement le geste liturgique; « de sa présence » préserve l’image hébraïque et l’ambiguïté de l’antécédent.
