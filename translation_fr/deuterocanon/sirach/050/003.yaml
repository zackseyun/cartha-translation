  source_fidelity: 'Le texte principal suit fidèlement l’hébreu conservé : la construction est située « de son temps », le passif de נבנה est conservé, et la comparaison finale avec un palais royal est maintenue. L’expression קיר פנות demeure architecturalement incertaine ; il convient de ne pas lui attribuer avec assurance le sens de « tours d’angle ». La note signale correctement l’importante divergence du grec.'
