translation:
  language: fr
  text: De son temps, fut construit le mur aux angles[b][a], demeure semblable au palais d’un roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente ici un texte très différent : « De son temps, un réservoir d’eau fut réduit ; son pourtour, en bronze, était comme la mer. » Cette leçon suppose peut-être un texte sous-jacent différent ou une ligne altérée dans l’une des traditions.'
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « le mur des angles ». L’expression hébraïque est difficile ; elle peut désigner des parties d’angle, des tours d’angle ou une enceinte fortifiée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר בְּיָמָיו
  choice: De son temps
  rationale: Rend naturellement la proposition temporelle hébraïque et situe la construction durant son exercice.
- source_word: נִבְנָה
  choice: fut construit
  rationale: Le passif de בנה signifie simplement « fut construit »; le texte n’explicite pas une reconstruction.
- source_word: קִיר / פִּנּוֹת
  choice: le mur des angles
  rationale: Traduction volontairement proche d’une expression hébraïque difficile. « Angles » conserve l’indétermination entre parties angulaires, tours d’angle et enceinte fortifiée.
- source_word: מָעוֹן
  choice: demeure
  rationale: Conserve le sens courant de lieu d’habitation tout en convenant à un édifice imposant.
- source_word: כְּהֵיכַל מֶלֶךְ
  choice: semblable au palais d’un roi
  rationale: Avec מֶלֶךְ, הֵיכָל désigne naturellement un palais; cette formulation préserve explicitement la comparaison.
- source_word: ἐν ἡμέραις αὐτοῦ ἠλαττώθη ἀποδοχεῖον ὑδάτων, χαλκὸς ὡσεὶ θαλάσσης τὸ περίμετρον
  choice: témoin de contrôle signalé en note, non suivi dans le texte principal
  rationale: Le grec diffère profondément de l’hébreu conservé et paraît refléter un texte sous-jacent différent ou une altération de transmission.
