base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/017.yaml
  text: All flesh together hurried, and they fell on their faces to the ground, to bow down before the Most High, before the Holy One of Israel.
translation:
  language: fr
  text: Tous ensemble, ils s’empressèrent, puis tombèrent face contre terre pour se prosterner devant le Très-Haut, devant le Saint d’Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל בָּשָׂר
  choice: Tous
  rationale: Dans ce contexte collectif, l’expression hébraïque désigne toutes les personnes présentes. « Tous » est naturel en français et évite l’étrangeté de « toute chair » sans réduire la portée collective.
- source_word: יַחְדָּו
  choice: ensemble
  rationale: Rend directement l’idée d’une action commune et simultanée.
- source_word: נִמְהָרוּ
  choice: s’empressèrent
  rationale: Exprime le mouvement rapide et empressé du verbe, dans un registre digne et naturel.
- source_word: וַיִּפְּלוּ עַל פְּנֵיהֶם אָרְצָה
  choice: puis tombèrent face contre terre
  rationale: Restitue l’enchaînement narratif et la posture physique indiquée par l’hébreu.
- source_word: לְהִשְׁתַּחֲוֹת
  choice: pour se prosterner
  rationale: Rend l’acte corporel d’hommage et d’adoration sans en atténuer la dimension cultuelle.
- source_word: עֶלְיוֹן
  choice: le Très-Haut
  rationale: Titre divin traditionnel, précis et immédiatement compréhensible.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: le Saint d’Israël
  rationale: Conserve littéralement ce titre divin biblique.
theological_decisions:
- issue: Relation entre « le Très-Haut » et « le Saint d’Israël »
  choice: 'Conserver les deux titres en apposition répétée : « devant le Très-Haut, devant le Saint d’Israël »'
  alternative: Les fusionner ou expliciter qu’ils désignent Dieu
  rationale: La répétition de לִפְנֵי dans l’hébreu donne solennité et parallélisme; la traduction préserve cette formulation sans ajouter d’interprétation.
- issue: Objet de la prosternation
  choice: 'Suivre le texte hébreu : « devant le Très-Haut, devant le Saint d’Israël »'
  alternative: Ajouter avec le grec « leur Seigneur, Dieu tout-puissant »
  rationale: Le témoin hébreu principal est complet et sûr ici; les expansions propres au parallèle grec ne sont donc pas introduites.
translation_notes:
  register: Français international moderne, fluide et solennel. Le pronom « ils » reprend naturellement la collectivité exprimée par « Tous ». La coordination par « puis » clarifie la succession des gestes sans surtraduire.
