base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/019.yaml
  text: And all the people of the land cried out in prayer before the Merciful One[b][a], until he finished ministering at the altar and his ordinances reached completion.
translation:
  language: fr
  text: Alors tout le peuple du pays poussa des cris de prière devant le Miséricordieux, jusqu’à ce qu’il ait achevé son service à l’autel et que les rites prescrits soient parvenus à leur terme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu de la dernière proposition est difficile. Le grec lit : « le peuple du Seigneur Très-Haut ... en prière devant le Miséricordieux, jusqu’à ce que l’ornement ou l’ordre du Seigneur soit achevé et qu’ils aient achevé son service liturgique ». Les deux textes diffèrent dans la dernière proposition.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּרֹנּוּ
  choice: poussa un grand cri
  rationale: Le verbe רנן peut désigner un cri retentissant, joyeux ou suppliant. Avec « dans la prière », cette formulation exprime une invocation collective à haute voix sans imposer l’idée d’un chant.
- source_word: כָּל עַם הָאָרֶץ
  choice: tout le peuple du pays
  rationale: Rend explicitement la portée locale de הָאָרֶץ et conserve la texture de l’hébreu; il s’agit ici de la population assemblée, non de toute l’humanité.
- source_word: בִּתְפִלָּה
  choice: dans la prière
  rationale: Traduction directe et naturelle de la préposition בְּ avec תְּפִלָּה dans ce cadre liturgique collectif.
- source_word: לִפְנֵי רַחוּם
  choice: devant le Miséricordieux
  rationale: L’hébreu emploie l’épithète divine רַחוּם sans nom explicite. La substantivation française garde la valeur de titre et n’ajoute pas « Dieu » au texte.
- source_word: עַד כַּלּוֹתוֹ לְשָׁרֵת מִזְבֵּחַ
  choice: jusqu’à ce qu’il ait achevé son service à l’autel
  rationale: Le suffixe de כַּלּוֹתוֹ renvoie naturellement au prêtre; שׁרת a ici son sens cultuel de service. Le passé antérieur du subjonctif marque clairement l’achèvement.
- source_word: וּמִשְׁפָּטָיו הִגִּיעַ אֵלָיו
  choice: et que les rites prescrits soient parvenus à leur terme
  rationale: מִשְׁפָּטָיו peut désigner les prescriptions ou procédures rituelles. La proposition hébraïque est difficile; cette traduction conserve l’image d’un déroulement atteignant son terme, sans la remplacer par l’idée plus explicative de tâches accomplies.
theological_decisions:
- issue: Titre divin רַחוּם
  choice: le Miséricordieux
  alternative: le Compatissant; le Dieu miséricordieux
  rationale: « Le Miséricordieux » préserve l’épithète divine autonome et l’accent mis sur la miséricorde, sans introduire un nom qui ne figure pas dans l’hébreu.
- issue: Sujet et sens de la dernière proposition
  choice: les rites prescrits soient parvenus à leur terme
  alternative: il acheva les devoirs qui lui étaient prescrits; ses ordonnances lui parvinrent
  rationale: Le texte hébreu est syntaxiquement et lexicalement difficile, tandis que le grec décrit l’achèvement du service liturgique. Le choix retenu exprime le probable sens d’achèvement tout en signalant la variante dans la note.
translation_notes:
  register: Français international moderne, digne et accessible. « Service à l’autel » garde la nuance cultuelle sans archaïsme excessif. La note est placée après l’ensemble de la proposition concernée; son marqueur [a] figure bien dans le texte principal.
