revisions:
- from: Alors tout le peuple du pays poussa un grand cri dans la prière devant le Miséricordieux, jusqu’à ce qu’il ait achevé son service à l’autel et que les rites prescrits soient parvenus à leur terme.[a]
  to: Alors tout le peuple du pays poussa des cris de prière devant le Miséricordieux, jusqu’à ce qu’il ait achevé son service à l’autel et que les rites prescrits soient parvenus à leur terme.[a]
  rationale: La révision améliore l’idiome français de la première proposition. Elle maintient, pour la clausule hébraïque difficile, une formulation prudente orientée vers l’achèvement rituel, sans attribuer indûment à l’hébreu la syntaxe grecque. La note est corrigée afin de signaler fidèlement la distinction grecque entre κόσμος (« ornement/ordre », sens discuté) et λειτουργία (« service liturgique »).
