  source_fidelity: 'Le sens général est bien rendu : la prière collective devant l’épithète divine רחום et l’achèvement du service cultuel sont conservés. La dernière proposition hébraïque demeure difficile; « les rites prescrits ... à leur terme » constitue une résolution interprétative raisonnable, soutenue dans son orientation générale par le grec, à condition que la note décrive ce dernier avec davantage d’exactitude.'
  naturalness: « Poussa un grand cri dans la prière » est compréhensible, mais peu idiomatique en français moderne. « Poussa des cris de prière » exprime plus naturellement la vocalisation collective sans imposer le chant ni un unique cri.
  terminology: « Le Miséricordieux » conserve correctement le titre divin autonome. « Service à l’autel » et « rites prescrits » conviennent au registre cultuel. La note doit éviter de rendre κόσμος par « service », puisque le grec distingue κόσμος du terme λειτουργία qui suit.
