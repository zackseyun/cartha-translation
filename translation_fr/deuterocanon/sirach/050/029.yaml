  text: For if one does these things[a], he will prevail in everything, for the light of the Lord is his path.
translation:
  language: fr
  text: Car, s’il met cela en pratique, il l’emportera en toute chose, parce que la lumière du Seigneur est son chemin[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit plus littéralement : « sa trace » ou « son empreinte ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ αὐτὰ ποιήσῃ
  choice: Car, s’il met cela en pratique
  rationale: La tournure conditionnelle et le lien explicatif sont conservés. « Mettre cela en pratique » exprime naturellement l’observance des enseignements évoqués auparavant, sans les préciser davantage que le grec.
- source_word: πρὸς πάντα ἰσχύσει
  choice: il l’emportera en toute chose
  rationale: Cette formulation rend la force ou l’efficacité exprimée par ἰσχύσει ainsi que la portée globale de πρὸς πάντα. Elle reste naturelle en français tout en évitant de réduire la phrase à une simple réussite matérielle.
- source_word: φῶς Κυρίου
  choice: la lumière du Seigneur
  rationale: Traduction directe qui conserve la métaphore de la lumière divine et le titre traditionnel « Seigneur ».
- source_word: τὸ ἴχνος αὐτοῦ
  choice: son chemin
  rationale: « Chemin » rend en français courant la métaphore du parcours de vie, tandis qu’une note conserve l’image grecque plus concrète de la trace ou de l’empreinte.
theological_decisions:
- issue: Sens de la métaphore τὸ ἴχνος αὐτοῦ
  choice: « La lumière du Seigneur est son chemin », compris naturellement comme la lumière divine qui caractérise ou éclaire le parcours de la personne.
  alternative: « La lumière du Seigneur est sa trace » ou « son empreinte », image plus concrète pouvant mettre l’accent sur une marque visible.
  rationale: Le grec est bref et métaphorique. Le texte principal demeure intelligible sans expliciter le rapport entre la lumière et le chemin; la note préserve l’image concrète et l’ambiguïté de l’expression originale.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde le lien logique avec le contexte, le caractère proverbial de la promesse et la métaphore théologique sans l’expliquer dans le corps du texte.
