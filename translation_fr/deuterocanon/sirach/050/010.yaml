translation_notes:
  register: Français international moderne, poétique et digne. La répétition de « tel » préserve le parallélisme hébreu. « Verdoyant », « chargé » et « luxuriant » rendent l’abondance végétale sans lourdeur technique; la divergence substantielle du grec est signalée en note.
