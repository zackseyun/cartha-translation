  text: like a flourishing olive tree heavy with berries[b][a], and like an rich tree drenching its branches.
translation:
  language: fr
  text: tel un olivier verdoyant chargé d’olives[b], et tel un arbre luxuriant qui abreuve ses branches[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte ici : « tel un cyprès s’élevant jusque dans les nuages », au lieu de l’hébreu : « tel un arbre luxuriant qui abreuve ses branches ». Le texte suit le témoin hébreu de la Guéniza du Caire, conservé à cet endroit.'
    reason: alternative_reading
  - marker: b
    text: Ou « chargé de fruits ». Le terme hébreu est rare et désigne vraisemblablement ici les fruits de l’olivier.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּזַיִת רַעֲנָן
  choice: tel un olivier verdoyant
  rationale: כְּ marque la comparaison; זַיִת désigne ici l’arbre, comme le confirment le parallélisme avec עֵץ et le grec ἐλαία. « Verdoyant » exprime la fraîcheur et la vigueur de רַעֲנָן dans un français poétique naturel.
- source_word: מָלֵא גַרְגַּר
  choice: chargé d’olives
  rationale: Littéralement « plein de gargar ». Le nom rare גַרְגַּר paraît désigner ici les fruits de l’olivier. « Chargé d’olives » conserve l’image concrète et l’idée d’abondance, sans employer le peu idiomatique « baies ».
- source_word: וּכְעֵץ שָׁמֵן
  choice: et tel un arbre luxuriant
  rationale: שָׁמֵן signifie littéralement « gras » et peut évoquer une végétation riche, vigoureuse ou bien nourrie. « Luxuriant » rend cette qualité en français moderne sans imposer l’interprétation plus étroite « arbre à huile ».
- source_word: מְרַוֶּה עָנָף
  choice: qui abreuve ses branches
  rationale: Le participe de רוה exprime l’action d’abreuver, d’irriguer ou de saturer d’eau. La formulation garde la personnification et l’image d’une humidité abondante qui nourrit les branches; le possessif, implicite dans le contexte, est nécessaire en français naturel.
