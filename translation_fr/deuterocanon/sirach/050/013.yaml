translation:
  language: fr
  text: et les offrandes du SEIGNEUR étaient dans leurs mains[a], devant toute l’assemblée d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte littéralement « les offrandes par le feu du SEIGNEUR » ; le grec a plus généralement « l’offrande du Seigneur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשֵּׁי
  choice: et les sacrifices consumés pour
  rationale: Le nom אִשֵּׁי désigne précisément des offrandes faites par le feu. « Sacrifices consumés » exprime ce caractère cultuel en français naturel, tandis que la note signale le terme plus général du parallèle grec.
- source_word: יְהֹוָה
  choice: le SEIGNEUR
  rationale: Rendu français conventionnel du tétragramme, en petites capitales simulées ici par des capitales.
- source_word: בְּיָדָם
  choice: étaient entre leurs mains
  rationale: Conserve l’image concrète du texte hébreu, où les prêtres tiennent les sacrifices.
- source_word: נֶגֶד
  choice: devant
  rationale: Exprime naturellement la présence publique et visible devant l’assemblée.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: toute l’assemblée d’Israël
  rationale: Rendu direct et idiomatique de la totalité de l’assemblée cultuelle d’Israël.
theological_decisions:
- issue: Précision du terme sacrificiel אִשֵּׁי
  choice: sacrifices consumés pour le SEIGNEUR
  alternative: offrande du Seigneur
  rationale: L’hébreu conserve la référence spécifique au feu sacrificiel, alors que le grec emploie le terme plus large προσφορά. Le texte principal suit la source hébraïque de haute confiance et la note préserve la variante de portée du parallèle grec.
translation_notes:
  register: Français moderne, digne et liturgique sans archaïsme marqué. La formulation reste proche de l’hébreu et conserve l’image concrète des sacrifices tenus en main.
