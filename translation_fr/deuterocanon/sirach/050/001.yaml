base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/001.yaml
  text: Simon son of Yohanan the priest was the glory of his brothers and the splendor of his people[a]; in his generation the house was repaired[b], and in his days the temple was strengthened.
translation:
  language: fr
  text: Simon, fils de Yohanan, le prêtre[a], était grand parmi ses frères et la gloire de son peuple. De son temps, la Maison fut restaurée[b], et le Temple fut renforcé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec lit : « Simon, fils d’Onias, le grand prêtre ». Le témoin hébreu lit ici : « Simon, fils de Yohanan, le prêtre ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « la Maison reçut les soins nécessaires ». Le verbe hébreu peut indiquer qu’un édifice a été pris en charge ou restauré ; le parallèle grec évoque plus précisément des travaux de construction sur la Maison.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדוֹל אֶחָיו
  choice: était grand parmi ses frères
  rationale: Cette formulation rend directement l’éloge hébreu, littéralement « grand parmi/de ses frères », sans le confondre avec le parallèle suivant sur la gloire du peuple.
- source_word: וְתִפְאֶרֶת עַמּוֹ
  choice: faisait la fierté de son peuple
  rationale: תִפְאֶרֶת exprime la gloire, la splendeur ou l’honneur. « Faisait la fierté » est naturel en français moderne et conserve la valeur honorifique appliquée à Simon.
- source_word: שִׁמְעוֹן בֶּן יוֹחָנָן
  choice: Simon, fils de Yohanan
  rationale: « Simon » est la forme française traditionnelle de שִׁמְעוֹן, tandis que « Yohanan » conserve directement la forme hébraïque du patronyme.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Le témoin hébreu porte simplement « le prêtre ». Le titre plus développé du grec est signalé en note plutôt qu’introduit dans le texte.
- source_word: נִפְקַד הַבָּיִת
  choice: la Maison fut restaurée
  rationale: Le niphal de פקד peut indiquer que quelque chose reçoit de l’attention ou des soins. Le contexte architectural, confirmé par le grec, favorise ici l’idée de restauration; la majuscule indique clairement le Temple sans effacer le terme hébreu distinct הַבָּיִת, « la Maison ».
- source_word: חֻזַּק הֵיכָל
  choice: le Temple fut consolidé
  rationale: חֻזַּק signifie « fut renforcé, rendu solide ». « Fut consolidé » convient naturellement à un édifice et distingue cette action de la restauration mentionnée auparavant.
theological_decisions:
- issue: Titre sacerdotal de Simon
  choice: le prêtre
  alternative: le grand prêtre / le souverain prêtre
  rationale: Le texte hébreu conservé lit הַכֹּהֵן, « le prêtre », tandis que le parallèle grec porte ἱερεὺς ὁ μέγας, littéralement « le grand prêtre », désignation du grand prêtre. Le texte principal suit l’hébreu et la variante grecque est conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme élogieux est conservé, de même que la variation entre « la Maison » et « le Temple ». Les notes rendent visibles l’écart textuel hébreu-grec et l’étendue sémantique du verbe פקד.
