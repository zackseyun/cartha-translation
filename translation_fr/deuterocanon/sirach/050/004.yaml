  text: the one who cares for his people against calamity[b][a], and strengthens his city against distress.
translation:
  language: fr
  text: lui qui veille sur son peuple pour le préserver du désastre[a] et fortifie sa ville contre l’adversité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du désastre soudain »; le grec porte « de la chute », ce qui confirme l’idée d’une protection contre la ruine.
    reason: lexical_alternative
  - marker: b
    text: Ou « contre le siège ». Le grec évoque plus précisément la mise en état de résister à un siège, tandis que l’hébreu peut aussi désigner plus largement la détresse ou la pression.
    reason: alternative_reading
lexical_decisions:
- source_word: הַדּוֹאֵג
  choice: lui qui veille sur
  rationale: Le participe de דאג exprime une préoccupation active et continue. « Veille sur » rend cette sollicitude dans un français naturel, sans la réduire à une simple inquiétude.
- source_word: לְעַמּוֹ
  choice: son peuple
  rationale: עם désigne ici collectivement le peuple; le suffixe possessif est conservé. La préposition ל est naturellement intégrée à la tournure « veille sur ».
- source_word: מֵחֶתֶף
  choice: pour le préserver du désastre
  rationale: חֶתֶף peut désigner un coup destructeur, souvent soudain. La préposition מן marque ici l’éloignement ou la protection; cette formulation explicite naturellement le rapport protecteur sans effacer la possibilité d’un désastre soudain.
- source_word: וּמְחַזֵּק
  choice: et fortifie
  rationale: Le piel de חזק signifie renforcer ou fortifier. Dans le contexte d’une ville exposée à une menace, « fortifie » restitue bien la dimension concrète tout en restant proche de l’hébreu.
- source_word: עִירוֹ
  choice: sa ville
  rationale: Traduction directe de עיר avec son suffixe possessif.
- source_word: מִצָּר
  choice: contre l’adversité
  rationale: צָר peut évoquer la détresse, la pression ou une situation critique. « Adversité » préserve cette portée relativement large, tandis que la note signale la lecture militaire possible, soutenue par le grec.
