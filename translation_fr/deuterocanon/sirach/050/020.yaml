revisions:
- from: Alors il descendit et leva les mains sur toute l’assemblée d’Israël, afin de prononcer de ses lèvres la bénédiction de Yahweh[a] et de se glorifier du nom de Yahweh[b].
  to: Alors il descendit et leva les mains au-dessus de toute l’assemblée d’Israël, la bénédiction de Yahweh sur les lèvres[a], et il se glorifia du nom de Yahweh[b].
  rationale: La révision donne priorité à la syntaxe elliptique du témoin hébreu et évite de présenter comme certaine l’explicitation fournie par le grec. Elle conserve en note l’apport réel du parallèle grec, y compris son datif « au Seigneur ». Les ancres de notes restent attachées aux expressions qu’elles expliquent.
