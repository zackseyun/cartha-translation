base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/020.yaml
  text: Then he came down and lifted up his hands over all the assembly of Israel[a], to give the blessing of Yahweh with his lips[b], and to glory in the name of Yahweh.
translation:
  language: fr
  text: Alors il descendit et leva les mains au-dessus de toute l’assemblée d’Israël, la bénédiction de Yahweh sur les lèvres[a], et il se glorifia du nom de Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu porte littéralement : « et la bénédiction de Yahweh sur/avec ses lèvres », sans verbe explicite. Le grec parallèle explicite une construction de but : « pour donner une bénédiction au Seigneur de ses lèvres ».'
    reason: Le texte hébreu est elliptique; la note indique l’éclairage syntaxique du grec et sa formulation plus précise de la bénédiction comme adressée au Seigneur, sans imposer cette lecture au texte principal.
  - marker: b
    text: 'Ou : « mettre sa fierté dans le nom de Yahweh » ou « exulter à cause du nom de Yahweh ».'
    reason: Le verbe hébreu peut exprimer le fait de se glorifier, de tirer fierté ou d’exulter; le grec parallèle emploie également un verbe pouvant signifier « se glorifier » ou « se vanter ».
lexical_decisions:
- source_word: יָרַד
  choice: descendit
  rationale: Le verbe exprime un mouvement vers le bas. « Descendit » convient au contexte solennel où le grand prêtre quitte le lieu du rite.
- source_word: וְנָשָׂא יָדָיו
  choice: et leva les mains
  rationale: Cette expression désigne le geste traditionnel de lever les mains pour prier ou bénir. La formulation est naturelle et proche de l’hébreu.
- source_word: עַל כָּל קְהַל יִשְׂרָאֵל
  choice: sur toute l’assemblée d’Israël
  rationale: קהל désigne ici la communauté officiellement rassemblée. « Assemblée » conserve la dimension publique et liturgique, tandis que « sur » rend le geste de bénédiction étendu au-dessus du peuple.
- source_word: וּבִרְכַּת יְהֹוָה בִּשְׂפָתָיו
  choice: afin de prononcer de ses lèvres la bénédiction de Yahweh
  rationale: L’hébreu transmis présente une proposition nominale condensée, littéralement « et la bénédiction de Yahweh sur/avec ses lèvres ». Le grec parallèle explicite un but au moyen de δοῦναι. « Prononcer » exprime naturellement l’acte liturgique sans dissimuler, grâce à la note, la forme plus elliptique de l’hébreu.
- source_word: וּבְשֵׁם יְהֹוָה הִתְפָּאֵר
  choice: et de se glorifier du nom de Yahweh
  rationale: Le hitpael de פאר peut exprimer le fait de se glorifier, d’exulter ou de mettre sa fierté en quelque chose. « Se glorifier du nom » garde le registre élevé et la nuance positive du contexte.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve ici le caractère personnel du nom divin, tandis que le grec parallèle le représente par Κυρίῳ, « au Seigneur ».
- issue: Sens de וּבִרְכַּת יְהֹוָה בִּשְׂפָתָיו
  choice: afin de prononcer de ses lèvres la bénédiction de Yahweh
  alternative: la bénédiction de Yahweh était sur ses lèvres
  rationale: La traduction principale adopte la relation de but explicitée par le grec, qui s’accorde avec le geste sacerdotal. La note conserve la construction nominale et l’ambiguïté du texte hébreu.
- issue: Valeur de הִתְפָּאֵר
  choice: se glorifier du nom de Yahweh
  alternative: mettre sa fierté dans le nom de Yahweh
  rationale: Le verbe peut désigner une fierté ou une exultation, sans nécessairement comporter la connotation négative de la vantardise. La formulation retenue préserve cette tension lexicale.
translation_notes:
  register: Français international moderne, digne et liturgique sans archaïsme marqué. La phrase conserve le geste sacerdotal concret et utilise une construction finale fluide. Les notes signalent à la fois la concision de l’hébreu et l’éclairage distinct du grec sans effacer leur tension.
