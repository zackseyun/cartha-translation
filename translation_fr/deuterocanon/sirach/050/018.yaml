  text: And the song gave forth its voice[a], and over the multitude they set his lamp in order.
translation:
  language: fr
  text: Le chant fit entendre sa voix[a], et sur la foule ils disposèrent sa lampe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec présente une formulation différente : « Les chantres louèrent de leurs voix ; dans la maison comble, la mélodie fut rendue douce. » Cela peut indiquer que la seconde partie de l’hébreu est textuellement difficile ou qu’elle a été transmise sous une autre forme.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֵּן הַשִּׁיר קוֹלוֹ
  choice: Le chant fit entendre sa voix
  rationale: L’expression נתן קול signifie faire entendre ou élever la voix. Cette formulation française reste naturelle tout en conservant la personnification du chant et le sens littéral de « sa voix ».
- source_word: וְעַל הֲמּוֹן
  choice: et au-dessus de la foule
  rationale: La préposition על conserve ici son image spatiale fondamentale, « au-dessus de », tandis que המון désigne naturellement la foule ou la multitude assemblée.
- source_word: הֶעֱרִיכוּ
  choice: ils disposèrent
  rationale: Le hifil de ערך signifie arranger, disposer ou mettre en ordre. « Disposèrent » rend l’action ordonnée sans préciser davantage une scène cultuelle dont le détail demeure incertain.
- source_word: נֵרוֹ
  choice: sa lampe
  rationale: נר désigne normalement une lampe, avec un suffixe masculin singulier. Le référent de « sa » reste volontairement indéterminé, comme dans l’hébreu.
theological_decisions:
- issue: Choix du témoin principal malgré une seconde proposition difficile
  choice: Traduire directement l’hébreu conservé et signaler en note le texte grec sensiblement différent.
  alternative: 'Suivre le grec : « Les psalmistes louèrent de leurs voix ; dans la maison comble, la mélodie devint douce. »'
  rationale: L’hébreu est le témoin principal lorsqu’il est conservé. Toutefois, sa seconde proposition est difficile et ne correspond pas nettement au grec ; la note préserve donc la divergence textuelle sans harmonisation ni résolution conjecturale.
translation_notes:
  register: Français international moderne, sobre et liturgique. La personnification « le chant… sa voix » et l’image énigmatique de la lampe sont maintenues afin de préserver la formulation et l’ambiguïté du texte hébreu.
