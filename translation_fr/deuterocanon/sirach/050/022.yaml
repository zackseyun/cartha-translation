base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/022.yaml
  text: And now[a], please bless Yahweh, the God of Israel, who does wondrous things on the earth, who makes man great from the womb and deals with him according to his will.
translation:
  language: fr
  text: Et maintenant, je vous en prie, bénissez Yahweh, le Dieu d’Israël, lui qui accomplit des merveilles sur la terre, qui élève l’être humain dès le sein maternel et agit envers lui selon sa volonté.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte: «et agit envers nous selon sa miséricorde», au lieu de: «et agit envers lui selon sa volonté».'
    reason: Variante ancienne significative entre les témoins hébreu et grec.
lexical_decisions:
- source_word: בָּרְכוּ נָא
  choice: je vous en prie, bénissez
  rationale: L’impératif pluriel בָּרְכוּ accompagné de נָא exprime une exhortation pressante mais courtoise. Cette tournure française en conserve à la fois l’appel et la dignité.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: La translittération rend explicitement le nom divin présent dans le texte hébreu.
- source_word: הַמַּפְלִיא לַעֲשׂוֹת
  choice: qui accomplit des merveilles
  rationale: La construction avec le participe hifil de פלא désigne des actes extraordinaires; «accomplir des merveilles» est naturel dans un registre de louange.
- source_word: בָּאָרֶץ
  choice: sur la terre
  rationale: Le contexte de louange favorise la portée générale de אֶרֶץ plutôt que le sens local de «pays».
- source_word: הַמְגַדֵּל אָדָם
  choice: qui élève l’être humain
  rationale: Le participe de גדל peut évoquer le fait de faire grandir, de rendre grand ou d’élever. «Élève» préserve cette amplitude et correspond aussi au grec ὑψοῦντα, sans réduire l’expression à la seule croissance physique.
- source_word: מֵרֶחֶם
  choice: dès le sein maternel
  rationale: Cette formulation conserve l’image concrète du texte hébreu tout en étant idiomatique en français.
- source_word: וַיַּעֲשֵׂהוּ בִּרְצוֹנוֹ
  choice: et agit envers lui selon sa volonté
  rationale: La formulation rend l’action divine à l’égard de l’être humain sans surinterpréter le verbe עשה. Elle suit la leçon hébraïque בִּרְצוֹנוֹ, tout en laissant la variante grecque à la note.
theological_decisions:
- issue: אָדָם comme nom singulier à valeur représentative
  choice: l’être humain
  alternative: l’homme
  rationale: אָדָם désigne ici la personne humaine de manière générique. «L’être humain» garde le singulier anthropologique sans donner à tort au propos une portée exclusivement masculine.
- issue: Divergence de la dernière proposition entre l’hébreu et le grec
  choice: selon sa volonté
  alternative: selon sa miséricorde
  rationale: Le témoin hébreu conservé porte בִּרְצוֹנוֹ, «selon sa volonté», et fonde donc le texte principal. Le grec κατὰ τὸ ἔλεος αὐτοῦ, «selon sa miséricorde», représente une variante ancienne importante, signalée en note plutôt que fusionnée avec l’hébreu.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe conserve le mouvement de l’exhortation et les participes descriptifs de l’hébreu, avec des formulations françaises naturelles. Le marqueur de note est placé sur la proposition concernée.
