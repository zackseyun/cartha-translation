base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/024.yaml
  text: May his mercy remain faithful with Shimon[a], and may he establish for him the covenant of Phinehas[b], which shall not be cut off from him or from his offspring as long as the days of heaven endure.
translation:
  language: fr
  text: Que sa bonté fidèle demeure auprès de Shimon[a], et qu’il établisse pour lui l’alliance de Pinhas[b], qui ne sera retranchée ni pour lui ni pour sa descendance, aussi longtemps que dureront les jours du ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec parallèle diffère sensiblement : « Qu’il nous confie sa miséricorde et qu’en ses jours il nous délivre. » Le texte hébreu conservé parle plutôt de Shimon et de l’alliance de Pinhas.'
    reason: alternative_reading
  - marker: b
    text: « L’alliance de Pinhas » renvoie à l’alliance sacerdotale durable de Nombres 25.12-13.
    reason: cross_reference
lexical_decisions:
- source_word: יֵאָמֵן עִם שִׁמְעוֹן חַסְדּוֹ
  choice: Que sa bonté fidèle demeure auprès de Shimon
  rationale: Le nifal de אמן exprime ici la fermeté ou la fidélité. Associé à חסד, il donne naturellement « bonté fidèle », tandis que « demeure auprès de » rend explicitement en français la continuité souhaitée et la relation marquée par עִם. Le nom שִׁמְעוֹן est translittéré Shimon.
- source_word: וְיָקֶם לוֹ
  choice: et qu’il établisse pour lui
  rationale: Le hiphil de קום, dans un contexte d’alliance, signifie couramment établir ou confirmer. « Établisse » conserve cette valeur formelle.
- source_word: בְּרִית פִּינְחָס
  choice: l’alliance de Pinhas
  rationale: La formulation concise conserve l’allusion à l’alliance sacerdotale liée à Pinhas en Nombres 25. La forme française « Pinhas » translittère directement le nom hébreu.
- source_word: אֲשֶׁר לֹא יִכָּרֵת לוֹ וּלְזַרְעוֹ
  choice: afin qu’elle ne soit retranchée ni de lui ni de sa descendance
  rationale: כרת est conservé par « retranchée », qui maintient la texture juridique et alliancielle de l’hébreu. Dans cette proposition de souhait, אשר est compris avec une nuance de finalité ou de résultat. זרע désigne ici la descendance.
- source_word: כִּימֵי שָׁמָיִם
  choice: aussi longtemps que dureront les jours du ciel
  rationale: Cette tournure rend clairement la durée tout en préservant l’image hébraïque des « jours du ciel ».
theological_decisions:
- issue: Rapport entre le texte hébreu concernant Shimon et la leçon grecque très différente
  choice: Suivre dans le texte principal l’hébreu conservé, qui prie pour Shimon et évoque l’alliance de Pinhas.
  alternative: 'Suivre le grec : « Qu’il nous confie sa miséricorde et qu’en ses jours il nous délivre. »'
  rationale: Puisque le texte hébreu de ce passage est conservé avec une confiance élevée, il constitue la source principale. Le grec paraît refléter une autre Vorlage ou une transmission interprétative et doit donc être signalé en note sans remplacer l’hébreu.
- issue: Valeur de חסד avec יֵאָמֵן
  choice: « sa bonté fidèle »
  alternative: « sa miséricorde demeure fidèle »
  rationale: « Bonté fidèle » exprime de manière naturelle en français l’union de la loyauté, de la bienveillance et de la stabilité portée par חסד et אמן, sans réduire le terme à une seule catégorie doctrinale.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve l’imagerie alliancielle de l’hébreu (« retranchée », « jours du ciel ») tout en évitant une construction peu naturelle comme « que sa miséricorde soit fidèle avec Shimon ».
