  source_fidelity: 'Le texte principal suit correctement l’hébreu conservé : la bonté/faveur divine est invoquée en relation avec Shimon, puis l’alliance de Pinhas est établie pour lui et sa descendance. La note a rend compte de la divergence majeure du grec. Toutefois, « afin qu’elle » transforme la relative hébraïque אשר en proposition finale, nuance qui n’est pas exprimée par le texte source.'
