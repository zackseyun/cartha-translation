  to: Que sa bonté fidèle demeure auprès de Shimon[a], et qu’il établisse pour lui l’alliance de Pinhas[b], qui ne sera retranchée ni pour lui ni pour sa descendance, aussi longtemps que dureront les jours du ciel.
