base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/005.yaml
  text: How splendid he was when he looked out from the tent[b][a], when he came out from the house of the curtain.
translation:
  language: fr
  text: Qu’il était splendide lorsqu’il regardait au-dehors depuis la tente[a], lorsqu’il sortait de la maison du rideau[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec porte : « Comme il fut glorifié dans le mouvement [ou : la procession] du peuple », au lieu de « lorsqu’il regardait au-dehors depuis la tente ». Cela témoigne d’une divergence textuelle dans le premier membre du verset.'
    reason: textual_variant
  - marker: b
    text: Ou « voile ». Le mot hébreu parokhet, comme le grec katapetasma, désigne le rideau placé devant le sanctuaire intérieur.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נֶהְדַּר
  choice: Comme il était resplendissant
  rationale: La tournure exclamative avec מַה exprime l’admiration devant une apparence éclatante et majestueuse. « Resplendissant » rend cette magnificence visible tout en gardant une tonalité digne.
- source_word: בְּהַשְׁגִּיחוֹ
  choice: lorsqu’il regardait au-dehors
  rationale: Le verbe suggère le fait de regarder depuis un lieu ou de se montrer en regardant au-dehors. Cette traduction reste proche de l’hébreu sans réduire le sens à la seule idée d’« apparaître ».
- source_word: מֵאֹהֶל
  choice: depuis la Tente
  rationale: אֹהֶל signifie littéralement « tente ». La majuscule signale ici son emploi comme désignation cultuelle, sans l’harmoniser avec « Temple » ni effacer l’imagerie héritée de la tente-sanctuaire.
- source_word: וּבְצֵאתוֹ
  choice: lorsqu’il sortait
  rationale: Cette formulation française naturelle conserve le parallélisme temporel avec la proposition précédente.
- source_word: מִבֵּית הַפָּרֹכֶת
  choice: de la maison du rideau
  rationale: La traduction conserve la construction inhabituelle mais intelligible de l’hébreu, « maison du rideau », sans ajouter « derrière » ni préciser davantage l’architecture du sanctuaire. « Rideau » rend פָּרֹכֶת, avec « voile » indiqué en note.
theological_decisions:
- issue: Association de la « tente » et de la « maison du rideau » dans l’imagerie du sanctuaire
  choice: Conserver les deux images distinctes du texte hébreu
  alternative: Uniformiser en traduisant les deux expressions par « sanctuaire » ou « Temple »
  rationale: L’hébreu juxtapose délibérément le vocabulaire de la tente et celui de la maison munie du rideau. Les uniformiser effacerait une tension réelle du texte et son évocation possible des traditions anciennes du sanctuaire.
- issue: Divergence du premier membre dans le parallèle grec
  choice: Traduire le texte hébreu dans le corps du verset et signaler le grec en note
  alternative: Adopter dans le texte principal la lecture grecque concernant le mouvement du peuple
  rationale: Le témoin hébreu fourni est la source principale et bénéficie d’une confiance élevée. La divergence grecque est néanmoins substantielle et mérite d’être conservée pour le lecteur plutôt que résolue silencieusement.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve la forme exclamative et le parallélisme de l’hébreu. « Maison du rideau » demeure volontairement littéral afin de préserver l’expression singulière du texte source.
