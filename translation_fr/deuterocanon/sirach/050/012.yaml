revisions:
- from: 'Lorsqu’il recevait les portions de la main de ses frères[a], il se tenait près des bûchers disposés[b]. Autour de lui se tenait une couronne de fils, pareils à de jeunes plants de cèdres au Liban. Ils l’entouraient comme des saules au bord d’un cours d’eau : tous les fils d’Aaron dans leur splendeur.'
  to: 'Lorsqu’il recevait les portions de la main de ses frères[a], il se tenait près des rangées préparées[b]. Autour de lui se trouvait une couronne de fils, pareils à de jeunes plants de cèdres au Liban. Ils l’entouraient comme des saules au bord d’un cours d’eau : tous les fils d’Aaron dans leur splendeur.'
  rationale: La révision supprime « bûchers », détail non exprimé par l’hébreu, tout en conservant une formulation française compréhensible dont la nuance de proximité est explicitement contrôlée par le parallèle grec. La note distingue désormais correctement le sens littéral difficile de l’hébreu et l’éclairage apporté par le grec.
