review_pass:
  verdict: revise
  source_fidelity: 'La traduction de « portions », « de la main de ses frères », « fils », « jeunes plants de cèdres », « saules » et « splendeur » suit bien l’hébreu. En revanche, « bûchers » spécifie indûment מַעֲרָכוֹת : le mot évoque des rangées ou des dispositions préparées, sans désigner explicitement des bûchers. La proximité (« près de ») est soutenue par le grec, qui situe Simon près du foyer de l’autel, et doit être présentée comme telle dans la note.'
  naturalness: Le français est globalement fluide et d’un registre approprié. « Autour de lui se tenait une couronne de fils » est cependant plus naturel comme « Autour de lui se trouvait une couronne de fils ». « Rangées préparées » reste nécessairement un peu concret et obscur, mais la note explique loyalement la difficulté sans introduire une interprétation excessive.
  terminology: « Frères » conserve correctement la lecture hébraïque, avec une note qui explicite sobrement le cadre sacerdotal. « Couronne de fils » maintient l’image et le masculin du texte; « fils d’Aaron » l’identifie ensuite. « Bûchers disposés » doit être retiré, car il transforme une expression disputée en détail matériel affirmé.
  issues:
  - severity: medium
    issue: « bûchers disposés » surinterprète מַעֲרָכוֹת.
    rationale: L’hébreu parle de dispositions/rangées préparées; dans un cadre sacrificiel, elles peuvent être liées au rite de l’autel, mais le terme ne nomme pas explicitement des bûchers. Le grec apporte « près du foyer de l’autel », non une identification des מַעֲרָכוֹת à des bûchers.
  - severity: low
    issue: La note b attribue à l’hébreu une possible valeur « près de ».
    rationale: La préposition עַל signifie d’abord « sur ». La notion de proximité provient de l’éclairage du grec et doit être distinguée de la formulation hébraïque.
  revised_text: 'Lorsqu’il recevait les portions de la main de ses frères[a], il se tenait près des rangées préparées[b]. Autour de lui se trouvait une couronne de fils, pareils à de jeunes plants de cèdres au Liban. Ils l’entouraient comme des saules au bord d’un cours d’eau : tous les fils d’Aaron dans leur splendeur.'
  revised_footnotes:
