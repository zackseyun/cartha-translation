base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/012.yaml
  text: When he received the portions from the hand of his brothers[a], and he stood at his arrangement, around him was a crown of sons, like saplings of cedars in Lebanon[b]; and they surrounded him like willows by a stream—all the sons of Aaron in their splendor.
translation:
  language: fr
  text: 'Lorsqu’il recevait les portions de la main de ses frères[a], il se tenait près des rangées préparées[b]. Autour de lui se trouvait une couronne de fils, pareils à de jeunes plants de cèdres au Liban. Ils l’entouraient comme des saules au bord d’un cours d’eau : tous les fils d’Aaron dans leur splendeur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec lit « des mains des prêtres » là où l’hébreu porte « de la main de ses frères ». Le contexte montre qu’il s’agit de ses frères dans le sacerdoce.
    reason: alternative_reading
  - marker: b
    text: L’hébreu dit littéralement qu’il se tenait « sur les rangées/dispositions préparées », expression difficile. Le grec le situe près du foyer de l’autel.
    reason: textual_variant
lexical_decisions:
- source_word: בְּקַבְּלוֹ נְתָחִים
  choice: Lorsqu’il recevait les portions
  rationale: L’infinitif construit avec בְּ exprime ici la circonstance temporelle. « Portions » convient aux morceaux d’un sacrifice sans ajouter une précision absente de l’hébreu.
- source_word: מִיַּד אֶחָיו
  choice: de la main de ses frères
  rationale: Cette formulation suit directement l’hébreu. Le contexte identifie ces « frères » comme ses collègues prêtres, tandis que le grec porte explicitement « des mains des prêtres ».
- source_word: נִצָּב עַל מַעֲרָכוֹת
  choice: il se tenait près des bûchers disposés
  rationale: מַעֲרָכוֹת désigne des dispositions ou rangées préparées et, dans le contexte cultuel, peut évoquer les bûchers de l’autel. « Près de » rend naturellement la position, éclairée par le grec qui situe le grand prêtre près du foyer de l’autel, sans faire de cette précision grecque le texte principal.
- source_word: עֲטֶרֶת בָּנִים
  choice: une couronne de fils
  rationale: La traduction conserve l’image visuelle et le masculin explicite de l’hébreu; la dernière proposition précise qu’il s’agit des fils d’Aaron.
- source_word: כִּשְׁתִילֵי אֲרָזִים
  choice: pareils à de jeunes plants de cèdres
  rationale: שְׁתִילִים évoque des plants jeunes et vigoureux; cette expression française garde l’image végétale sans les réduire à de simples arbres adultes.
- source_word: בְּעַרְבֵי נָחַל
  choice: comme des saules au bord d’un cours d’eau
  rationale: L’expression désigne des saules associés à un cours d’eau. La formulation est claire en français international et laisse ouverte la nature exacte du cours d’eau.
- source_word: בִּכְבוֹדָם
  choice: dans leur splendeur
  rationale: Le mot exprime ici leur dignité glorieuse et leur apparence solennelle; « splendeur » restitue cette dimension honorifique.
theological_decisions:
- issue: Identité des « frères »
  choice: Conserver « ses frères » dans le texte principal.
  alternative: « des mains des prêtres »
  rationale: Le témoin hébreu porte « ses frères », alors que le grec explicite « les prêtres ». La traduction respecte la lecture hébraïque tout en signalant le sens sacerdotal confirmé par le contexte.
- issue: Sens de עַל מַעֲרָכוֹת dans la scène cultuelle
  choice: « près des bûchers disposés »
  alternative: « près du foyer de l’autel » ou, plus littéralement, « sur/près des dispositions »
  rationale: L’hébreu demeure difficile et garde le vocabulaire de ce qui est mis en ordre. Le contexte sacrificiel permet de comprendre les bûchers préparés, tandis que le grec confirme la proximité de l’autel. Une note expose cette tension textuelle au lieu de la masquer.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste fluide tout en conservant les images cultuelles et poétiques de l’hébreu. Les deux difficultés textuelles importantes sont maintenues dans le texte et expliquées en notes.
