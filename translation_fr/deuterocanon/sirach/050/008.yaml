translation:
  language: fr
  text: 'comme un bourgeon parmi les branches aux jours de fête,

    comme un lis près des cours d’eau,

    comme une fleur du Liban aux jours de l’été,

    et comme un feu d’oliban sur l’offrande de céréales.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּפֶרַח
  choice: comme une fleur
  rationale: Le préfixe כְּ exprime la comparaison, et פֶּרַח désigne une fleur ou une floraison. « Fleur » est naturel, vivant et fidèle en français moderne.
- source_word: לְבָנוֹן
  choice: du Liban
  rationale: Le groupe construit פֶּרַח לְבָנוֹן associe poétiquement la fleur au Liban; « du Liban » conserve cette relation sans l’expliciter davantage.
- source_word: בִּימֵי קָיִץ
  choice: aux jours de l’été
  rationale: Cette formulation préserve l’expression hébraïque littérale « dans/aux jours de l’été » ainsi que son rythme poétique.
- source_word: וּכְאֵשׁ לְבוֹנָה
  choice: et comme un feu d’encens
  rationale: אֵשׁ est gardé comme image concrète (« feu »). לְבוֹנָה désigne l’encens, plus précisément l’oliban; « encens » est le terme cultuel courant et intelligible en français.
- source_word: עַל הַמִּנְחָה
  choice: sur l’offrande de céréales
  rationale: Dans ce contexte cultuel, מִנְחָה désigne l’offrande végétale, généralement faite de farine ou de céréales. Cette traduction est plus précise que le simple mot « offrande ».
theological_decisions:
- issue: Sens cultuel de מִנְחָה
  choice: offrande de céréales
  alternative: offrande
  rationale: Le contexte du sanctuaire appelle le sens sacrificiel précis. Le conserver maintient l’imagerie sacerdotale sans lui ajouter d’interprétation doctrinale.
- issue: Divergence entre le témoin hébreu et le parallèle grec
  choice: suivre le texte hébreu dans le corps du verset
  alternative: suivre le grec (« comme les pousses du Liban aux jours de l’été »), sans le second membre sur l’encens
  rationale: Le témoin hébreu fourni est la source principale et présente ici un texte cohérent. La tradition grecque est signalée en note afin de ne pas masquer la variation textuelle.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme des deux comparaisons est conservé, de même que le vocabulaire cultuel, sans archaïsme inutile.
