translation:
  language: fr
  text: Comme le soleil qui resplendit sur le palais du roi[a], et comme l’arc-en-ciel qui apparaît dans un nuage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le parallèle grec porte « le temple du Très-Haut » au lieu de « le palais du roi ». L’hébreu semble conserver une formulation différente, tandis que le grec explicite le cadre cultuel.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּשֶׁמֶשׁ
  choice: Comme le soleil
  rationale: Le préfixe כְּ marque la comparaison; cette tournure ouvre naturellement la double image poétique.
- source_word: מְשַׁקֶּרֶת
  choice: qui resplendit
  rationale: La forme hébraïque est inhabituelle, mais le contexte et le grec ἐκλάμπων indiquent un rayonnement éclatant; « resplendit » restitue cette image sans introduire le sens de tromperie que pourrait évoquer une autre racine.
- source_word: אֶל הֵיכַל הַמֶּלֶךְ
  choice: sur le palais du roi
  rationale: אֶל peut ici décrire la direction ou la portée de la lumière, rendue naturellement par « sur ». הֵיכַל peut désigner un palais ou un temple; avec « du roi », le sens direct « palais » est conservé dans le texte principal, tandis que la variante grecque cultuelle est signalée en note.
- source_word: וּכְקֶשֶׁת
  choice: et comme l’arc-en-ciel
  rationale: קֶשֶׁת peut signifier « arc » ou « arc-en-ciel »; la mention de la nuée impose ici l’image météorologique.
- source_word: נִרְאֲתָה
  choice: qui apparaît
  rationale: Le niphal exprime ce qui devient visible ou se montre; « apparaît » convient au mouvement de l’image poétique.
- source_word: בֶעָנָן
  choice: dans la nuée
  rationale: Le singulier hébreu est maintenu. « Nuée » donne un registre biblique digne sans être obscur et respecte l’article défini.
theological_decisions:
- issue: « palais du roi » dans l’hébreu ou « temple du Très-Haut » dans le grec
  choice: 'Le texte principal suit l’hébreu: « palais du roi ».'
  alternative: 'Le parallèle grec porte: « le temple du Très-Haut ».'
  rationale: La leçon hébraïque conservée doit gouverner le texte principal. Le grec témoigne cependant d’une variante ancienne importante, cohérente avec le cadre cultuel, qui mérite une note plutôt qu’une harmonisation silencieuse.
translation_notes:
  register: Français international moderne, poétique et digne. La structure parallèle du vers est conservée; « resplendit » et « nuée » soutiennent l’élévation du registre tout en restant aisément compréhensibles.
