base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/027.yaml
  text: Instruction in understanding and mastery of expression[a], by Shimon son of Yeshua, son of Eleazar son of Sira, who poured forth wisdom from his heart[b].
translation:
  language: fr
  text: Instruction de discernement et maîtrise de l’expression[a], par Shimon, fils de Yeshoua, fils d’Éléazar, fils de Sira, qui a fait jaillir la sagesse de son cœur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque traduite par « maîtrise de l’expression » est difficile. Elle pourrait désigner l’art d’ordonner les formes ou les tours du discours ; sa nuance exacte reste incertaine.
    reason: lexical_alternative
  - marker: b
    text: 'Le texte hébreu de la dernière proposition est incertain dans le témoin de la Gueniza. Le grec porte : « qui fit pleuvoir la sagesse de son cœur » ; il guide ici la traduction.'
    reason: textual_variant
lexical_decisions:
- source_word: מוּסַר שֵׂכֶל
  choice: Enseignement pour comprendre
  rationale: מוּסַר désigne ici un enseignement formateur, et שֵׂכֶל en précise la visée intellectuelle. Cette formulation française est naturelle dans un colophon tout en gardant le lien entre instruction et compréhension.
- source_word: וּמוֹשֵׁל אוֹפַנִּים
  choice: et maîtrise de l’expression
  rationale: La locution hébraïque est difficile et pourrait évoquer l’art d’ordonner les formes ou les tours du discours. La traduction retient son sens probable dans ce contexte sans imposer une littéralité obscure; l’incertitude est signalée en note.
- source_word: לְשִׁמְעוֹן
  choice: par Shimon
  rationale: Dans cette formule de colophon, לְ marque vraisemblablement l’attribution ou l’auteur. « Par » rend clairement cette fonction.
- source_word: נִיבַּע / הִבִּיעַ
  choice: a répandu … jaillie
  rationale: Les deux verbes hébreux appartiennent au champ de l’écoulement et de l’expression abondante. Deux termes français apparentés par l’image permettent de conserver cette métaphore sans les confondre entièrement.
- source_word: בִּפְתוֹר לְבָן / בִּתְבוּנוֹת
  choice: la sagesse jaillie de son cœur
  rationale: Le texte hébreu transmis dans la dernière proposition est incertain. Le grec, « qui fit pleuvoir la sagesse de son cœur », fournit ici le contrôle principal. La formulation française garde l’image d’un jaillissement intérieur et l’objet « sagesse ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La structure nominale conserve l’allure d’un colophon. Les noms hébreux sont translittérés sous les formes Shimon et Yeshoua, tandis qu’Éléazar et Sira suivent les formes françaises usuelles. Les notes rendent explicites les difficultés lexicale et textuelle sans alourdir le verset.
