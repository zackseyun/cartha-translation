  - severity: low
    issue: « Enseignement pour comprendre » est une paraphrase de מוּסַר שֵׂכֶל
    rationale: La tournure française suggère un but (« pour comprendre »), tandis que l’hébreu qualifie l’instruction. « Instruction de discernement » conserve mieux cette relation et reste moderne.
