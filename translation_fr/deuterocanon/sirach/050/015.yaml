translation:
  language: fr
  text: Alors les fils d’Aaron, les prêtres, poussaient des acclamations avec des trompettes façonnées au marteau.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente ici un texte plus long : le prêtre étend la main pour la libation et verse le sang de la grappe à la base de l’autel, en parfum agréable pour le Très-Haut, Roi de l’univers. Le témoin hébreu conservé ici ne contient que la ligne relative à l’acclamation au son des trompettes.'
    reason: textual_variant
  - marker: b
    text: 'Autre traduction possible : « faisaient retentir une sonnerie avec des trompettes façonnées au marteau ». Le verbe hébreu peut désigner une forte acclamation ou un signal sonore ; dans ce contexte, ce son est produit au moyen des trompettes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Marque la succession temporelle et introduit naturellement l’action liturgique suivante.
- source_word: יָרִיעוּ
  choice: faisaient retentir une acclamation
  rationale: Le verbe désigne un cri puissant, une acclamation ou un signal sonore. L’imparfait français convient à l’action rituelle répétée, tandis que « faisaient retentir » rend son expression au moyen des trompettes sans réduire le verbe à un terme technique.
- source_word: בְנֵי אֲהַרֹן
  choice: les fils d’Aaron
  rationale: Conserve la désignation sacerdotale fondée sur la lignée cultuelle.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Maintient l’apposition explicative et emphatique du texte hébreu.
- source_word: בַּחֲצֹצְרוֹת
  choice: avec des trompettes
  rationale: Rend la valeur instrumentale de la préposition et désigne les trompettes métalliques employées dans le culte.
- source_word: מִקְשֶׁה
  choice: martelées
  rationale: Évoque des objets métalliques façonnés au marteau; le terme est précis, concis et naturel en français.
theological_decisions:
- issue: Rapport entre la ligne hébraïque et le parallèle grec plus développé
  choice: Traduire dans le texte principal la seule ligne hébraïque conservée
  alternative: Intégrer d’après le grec le geste de libation et le sang de la grappe versé sur l’autel
  rationale: Le témoin hébreu disponible a priorité. Les éléments sacrificiels supplémentaires du grec constituent une variante textuelle importante, mais ne doivent pas être introduits silencieusement dans le texte principal.
translation_notes:
  register: Français international moderne, digne et accessible. L’imparfait exprime l’action liturgique habituelle ou répétée. « Trompettes martelées » conserve la nuance technique du façonnage du métal sans alourdir la phrase.
