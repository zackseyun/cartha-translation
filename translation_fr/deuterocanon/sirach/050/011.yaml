base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/011.yaml
  text: When he put on garments of honor and clothed himself in garments of splendor[a], when he went up to the altar of glory, he adorned the court of the sanctuary.
translation:
  language: fr
  text: Quand il revêtait des vêtements d’honneur et se couvrait d’habits de splendeur[a], quand il montait vers l’autel de majesté, il embellissait le parvis du sanctuaire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte ici, dans l’ensemble de la phrase : « quand il montait vers l’autel saint, il glorifiait la parure [ou : l’enceinte] du sanctuaire ». L’hébreu parle de « l’autel de majesté » et du « parvis du sanctuaire ».'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲטוֹתוֹ
  choice: quand il revêtait
  rationale: Le verbe décrit l’action de mettre un vêtement; « revêtait » est naturel dans un contexte liturgique et conserve un registre digne.
- source_word: בִּגְדֵי כָבוֹד
  choice: des vêtements d’honneur
  rationale: Cette formulation préserve le rapport nominal de l’hébreu et le sens de כבוד, ici associé à l’honneur et à la dignité.
- source_word: וְהִתְלַבְּשׁוֹ בִּגְדֵי תִפְאָרֶת
  choice: et se couvrait d’habits de splendeur
  rationale: Le tour réfléchi rend la forme hébraïque; « splendeur » exprime la beauté éclatante de תפארת tout en évitant de répéter « vêtements ».
- source_word: בַּעֲלוֹתוֹ
  choice: quand il montait vers
  rationale: Le verbe conserve le mouvement ascendant, tandis que « vers » évite de suggérer qu’il montait littéralement sur l’autel.
- source_word: מִזְבַּח הוֹד
  choice: l’autel de majesté
  rationale: La construction nominal reflète étroitement l’hébreu; « majesté » rend הוד sans le confondre avec כבוד ni תפארת dans les membres précédents.
- source_word: וַיֶּהְדַּר
  choice: il embellissait
  rationale: Le verbe signifie rendre beau ou splendide; « embellissait » exprime naturellement cette valeur causative en français.
- source_word: עֲזֶרֶת מִקְדָּשׁ
  choice: le parvis du sanctuaire
  rationale: עזרה désigne l’enceinte ou la cour sacrée; « parvis » convient au cadre du sanctuaire et reste compréhensible en français moderne.
theological_decisions:
- issue: Choix du témoin principal entre l’hébreu et le grec
  choice: 'Suivre l’hébreu conservé: « l’autel de majesté » et « le parvis du sanctuaire ».'
  alternative: 'Suivre le grec: « l’autel saint » et une formulation pouvant évoquer la parure ou l’enceinte du sanctuaire.'
  rationale: Le texte hébreu fourni est cohérent et de haute confiance. Le grec confirme la scène liturgique mais présente des écarts réels, signalés en note plutôt que résolus silencieusement.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le parallélisme vestimentaire est conservé avec une légère variation lexicale naturelle. L’imparfait rend les propositions circonstancielles hébraïques dans le cadre descriptif du passage.
