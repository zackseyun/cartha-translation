  text: Blessed is the man who meditates on these things[a], and he who takes them to heart will become wise.
translation:
  language: fr
  text: Heureux[a] l’homme qui médite ces choses ; celui qui les prend à cœur deviendra sage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Bienheureux ». La formule hébraïque אַשְׁרֵי, comme le grec μακάριος, exprime la condition heureuse ou favorable de la personne ainsi qualifiée ; « heureux » est ici la formulation française habituelle d’une béatitude sapientielle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heureux
  rationale: La formule de béatitude exprime une condition enviable et favorisée, non une simple émotion passagère. « Heureux » est la tournure française consacrée et naturelle dans la littérature de sagesse.
- source_word: אִישׁ
  choice: l’homme
  rationale: Le nom hébreu est au masculin singulier et présente ici, selon l’usage sapientiel, un individu représentatif. « L’homme » conserve cette forme sans exclure la portée générale de la maxime.
- source_word: בְּאֵלֶּה יֶהְגֶּה
  choice: qui médite ces choses
  rationale: Dans ce contexte, הגה désigne une réflexion attentive et prolongée. La préposition ב introduit le contenu sur lequel porte cette méditation ; la construction transitive est naturelle en français.
- source_word: וְנוֹתֵן עַל לִבּוֹ
  choice: Celui qui les prend à cœur
  rationale: La locution hébraïque évoque l’intériorisation et la considération sérieuse. Le pronom « les », repris de « ces choses », est également confirmé par le grec αὐτά.
- source_word: יֶחְכָּם
  choice: deviendra sage
  rationale: Le verbe exprime l’acquisition de la sagesse. Cette traduction suit directement le sens intransitif de l’hébreu, sans imposer la nuance passive que pourrait suggérer le grec.
theological_decisions:
- issue: Masculin générique dans une béatitude sapientielle
  choice: l’homme
  alternative: la personne ; celui qui
  rationale: Le texte hébreu emploie אִישׁ, masculin singulier, comme figure représentative. La traduction conserve cette donnée grammaticale tout en laissant à la maxime sa portée générale.
- issue: Primauté de l’hébreu et rôle du parallèle grec
  choice: Traduire l’hébreu conservé, avec le grec comme confirmation du pronom pluriel sous-entendu
  alternative: 'Traduire littéralement : « et mettant sur son cœur, il deviendra sage »'
  rationale: L’hébreu constitue ici le témoin principal. Le grec confirme que la seconde proposition renvoie aux enseignements précédents, ce qui autorise le pronom français « les » sans ajouter une idée étrangère.
translation_notes:
  register: Français moderne, international et digne. La première proposition est formulée comme une béatitude, avec une ponctuation qui en restitue l’élan ; la seconde garde la relation simple entre l’intériorisation de l’enseignement et l’acquisition de la sagesse.
