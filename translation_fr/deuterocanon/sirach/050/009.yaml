lexical_decisions:
- source_word: כִּכְלִי זָהָב
  choice: tel un vase d’or
  rationale: La préposition כְּ introduit une comparaison, et כְּלִי désigne ici un récipient ou un objet façonné. « Vase » conserve l’image poétique d’une pièce d’orfèvrerie.
- source_word: מְפֻתָּח
  choice: ciselé
  rationale: Le participe évoque un travail décoratif exécuté sur le métal. « Ciselé » convient naturellement à une pièce d’or ouvragée, sans préciser excessivement la technique.
- source_word: וְאַנְטִיל
  choice: et rehaussé d’antimoine
  rationale: Le terme אַנְטִיל est incertain, mais peut désigner l’antimoine ou un élément décoratif sombre. « Rehaussé de » rend idiomatiquement sa fonction ornementale probable tout en conservant « antimoine » dans le texte et en signalant l’incertitude en note.
- source_word: הַנֶּאֱחָז
  choice: fixé
  rationale: Le participe niphal exprime le fait d’être tenu, attaché ou monté. « Fixé » préserve ce sens sans imposer une technique artisanale particulière.
- source_word: עַל אַבְנֵי חֵפֶץ
  choice: sur des pierres précieuses
  rationale: אַבְנֵי signifie « pierres » et חֵפֶץ exprime ici leur caractère désirable ou précieux. Le parallèle grec confirme l’idée de pierres de grande valeur.
