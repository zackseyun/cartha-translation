  text: the inhabitants of Seir and Philistia[a], and the foolish nation that dwells in Shechem.
translation:
  language: fr
  text: les habitants de Séïr et de la Philistie[a], et la nation insensée qui habite à Sichem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « ceux qui habitent dans la montagne de Samarie, les Philistins », au lieu de « les habitants de Séïr et de la Philistie ».'
    reason: textual_variant
lexical_decisions:
- source_word: יוֹשְׁבֵי
  choice: les habitants de
  rationale: Le participe construit de ישב est employé comme substantif collectif. « Les habitants de » est naturel en français et conserve l’idée de résidence.
- source_word: שֵׂעִיר
  choice: Séïr
  rationale: Le texte hébreu donne le nom propre sans terme explicite signifiant « montagne » ; la forme française traditionnelle « Séïr » convient donc.
- source_word: וּפְלֶשֶׁת
  choice: et de la Philistie
  rationale: פְלֶשֶׁת désigne ici le pays ou la région, et non directement les Philistins. La reprise implicite de « habitants » est naturelle en français.
- source_word: גּוֹי
  choice: nation
  rationale: גוי désigne collectivement un peuple ou une nation. « Nation » maintient la nuance collective et politique du terme.
- source_word: נָבָל
  choice: insensée
  rationale: נבל exprime une folie à la fois morale et intellectuelle. « Insensée » rend cette portée péjorative avec un registre digne et actuel.
- source_word: הַדָּר
  choice: qui habite
  rationale: Le participe attributif exprime une résidence durable. « Qui habite » est idiomatique et conserve cette valeur.
- source_word: בִּשְׁכֶם
  choice: à Sichem
  rationale: « Sichem » est la forme française biblique usuelle du nom hébreu שכם ; la préposition « à » convient naturellement à un nom de ville.
theological_decisions:
- issue: Divergence entre l’hébreu et le grec dans la première désignation géographique
  choice: 'Suivre dans le texte principal l’hébreu : « les habitants de Séïr et de la Philistie »'
  alternative: « ceux qui habitent dans la montagne de Samarie, les Philistins »
  rationale: Le témoin hébreu conservé est ici donné comme sûr et validé ; il a donc priorité. La leçon grecque, substantiellement différente, est signalée en note afin de préserver la transparence textuelle.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe garde le parallélisme du verset hébreu ; « insensée » préserve la vigueur morale de נבל sans réduire le terme à un simple manque d’intelligence.
