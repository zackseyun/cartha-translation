translation:
  language: fr
  text: jusqu’à ce qu’il ait fini d’officier à l’autel et de mettre en place les dispositions du Très-Haut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit : « arranger l’offrande du Très-Haut, le Tout-Puissant ». L’hébreu est plus concis et dit littéralement : « mettre en ordre les dispositions du Très-Haut ».'
    reason: alternative_reading
lexical_decisions:
- source_word: עַד כַּלּוֹתוֹ
  choice: jusqu’à ce qu’il ait achevé
  rationale: La construction marque l’aboutissement de l’action précédente. Le subjonctif passé exprime naturellement en français cet accomplissement envisagé depuis le récit.
- source_word: לְשָׁרֵת מִזְבֵּחַ
  choice: son service à l’autel
  rationale: Dans ce contexte sacerdotal, שרת désigne le service liturgique. La tournure nominale est plus naturelle en français que « servir l’autel » et ne laisse pas entendre que l’autel lui-même serait le bénéficiaire du service.
- source_word: וּלְסַדֵּר
  choice: et disposé
  rationale: סדר signifie mettre en ordre ou disposer. Le participe passé coordonné à « achevé » rend clairement l’achèvement des deux actes.
- source_word: מַעַרְכוֹת
  choice: les offrandes
  rationale: Le nom hébreu désigne littéralement des ensembles disposés ou des arrangements. Dans le contexte immédiat de l’autel, « offrandes » donne en français un sens cultuel intelligible, également attesté par le grec προσφοράν, tandis que la formulation plus indéterminée de l’hébreu est signalée en note.
- source_word: עֶלְיוֹן
  choice: du Très-Haut
  rationale: « Le Très-Haut » est le titre divin français traditionnel, clair et actuel, correspondant à עליון.
theological_decisions:
- issue: Degré de précision à donner à מַעַרְכוֹת à la lumière du parallèle grec προσφοράν
  choice: Employer « les offrandes » dans le texte, avec une note qui conserve la formulation plus indéterminée de l’hébreu.
  alternative: « les arrangements du Très-Haut » ou « ce qui était disposé pour le Très-Haut »
  rationale: L’hébreu reste prioritaire, mais son pluriel elliptique serait obscur ou artificiel s’il était calqué en français. Le contexte de l’autel et le grec soutiennent l’interprétation cultuelle « offrandes ». La note préserve néanmoins la différence réelle entre les témoins sans imposer au texte hébreu le titre supplémentaire « Tout-Puissant ».
translation_notes:
  register: Français international moderne, digne et fluide. « Service à l’autel » conserve la dimension liturgique sans archaïsme, et « disposé les offrandes » rend naturellement le contexte cultuel tout en laissant la divergence textuelle en note.
