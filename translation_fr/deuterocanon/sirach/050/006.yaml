  text: Like a shining star from among clouds[a], and like the full moon in the days of the feast.
translation:
  language: fr
  text: Comme une étoile brillante d’entre les nuages[a], comme la pleine lune aux jours de fête.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec porte : « comme l’étoile du matin au milieu d’un nuage ». L’hébreu dit plus généralement : « comme une étoile brillante d’entre les nuages ».'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּכוֹכָב אוֹר
  choice: Comme une étoile brillante
  rationale: כְּ marque la comparaison, כוֹכָב désigne une étoile et אוֹר en souligne ici l’éclat. « Étoile brillante » est naturel en français et reste fidèle à l’hébreu, sans adopter la précision « étoile du matin » propre au parallèle grec.
- source_word: מִבֵּין עָבִים
  choice: surgissant d’entre les nuages
  rationale: La construction מִבֵּין exprime une provenance depuis l’espace situé entre ou au milieu de plusieurs éléments. « Surgissant d’entre » restitue naturellement l’image d’apparition suggérée par le contexte, tandis que עָבִים signifie « nuages ».
- source_word: וּכְיָרֵחַ מָלֵא
  choice: comme la pleine lune
  rationale: יָרֵחַ signifie « lune » et מָלֵא « pleine ». L’expression française idiomatique est « la pleine lune »; la seconde comparaison reste parallèle à la première.
- source_word: בִּימֵי מוֹעֵד
  choice: aux jours de fête
  rationale: מוֹעֵד peut désigner un temps fixé ou une fête. Dans le cadre cultuel et poétique du passage, « fête » exprime le sens probable sans identifier une célébration particulière.
theological_decisions:
- issue: Choix entre l’image hébraïque de l’éclat et la précision grecque « étoile du matin »
  choice: 'Suivre dans le texte principal l’hébreu : « une étoile brillante »'
  alternative: « l’étoile du matin au milieu d’un nuage »
  rationale: Le témoin hébreu conservé et de haute confiance porte אוֹר, qui évoque la lumière ou l’éclat, tandis que le grec a ἑωθινός, « matinal ». La priorité donnée à l’original hébreu justifie le texte principal; la variante grecque est signalée en note.
translation_notes:
  register: Français international moderne, poétique et digne. La répétition de « comme » conserve le parallélisme des deux images. « Aux jours de fête » garde la coloration cultuelle sans préciser indûment une fête particulière.
