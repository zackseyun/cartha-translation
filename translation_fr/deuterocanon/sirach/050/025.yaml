  text: With two nations my soul is disgusted[a], and the third is not a people.
translation:
  language: fr
  text: Deux nations répugnent à mon âme, et la troisième n’est pas un peuple.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « et la troisième n’est pas une nation ». L’hébreu a ici « peuple ».'
    reason: Variante lexicale entre le texte hébreu et le parallèle grec.
lexical_decisions:
- source_word: בִּשְׁנֵי גוֹיִם
  choice: Deux nations
  rationale: Le ב marque ici ce envers quoi se porte le dégoût. En français, la construction directe avec « répugner à » rend naturellement cette relation sans ajouter une valeur causale absente du texte.
- source_word: קָצָה נַפְשִׁי
  choice: répugnent à mon âme
  rationale: Cette formulation conserve explicitement נַפְשִׁי, « mon âme », ainsi que la forte idée d’aversion exprimée par קָצָה. Elle reste poétique et naturelle en français moderne.
- source_word: וְהַשְּׁלִישִׁית
  choice: et la troisième
  rationale: Le féminin ordinal renvoie elliptiquement à une entité collective sous-entendue. « La troisième » préserve cette ellipse sans préciser davantage que l’hébreu.
- source_word: אִינֶנּוּ עָם
  choice: n’est pas un peuple
  rationale: Le choix suit l’hébreu עָם, « peuple », plutôt que le grec ἔθνος, « nation ». Il conserve la pointe rhétorique qui refuse au troisième groupe le statut de peuple.
theological_decisions:
- issue: Faut-il remplacer l’expression anthropologique « mon âme » par une simple première personne ?
  choice: Conserver « mon âme » dans le texte principal.
  alternative: « Deux nations me répugnent » ou « J’ai deux nations en horreur ».
  rationale: L’hébreu emploie explicitement נַפְשִׁי, confirmé par le grec ἡ ψυχή μου. Le maintien de l’expression respecte la texture poétique sans lui imposer une définition doctrinale de l’âme.
- issue: Faut-il suivre « peuple » dans l’hébreu ou « nation » dans le parallèle grec pour la dernière proposition ?
  choice: Employer « peuple » dans le texte principal.
  alternative: « n’est pas une nation ».
  rationale: Le témoin hébreu, ici assuré, porte עָם. La variante grecque reste textuellement pertinente et est donc signalée en note.
translation_notes:
  register: Français international moderne, sobre et poétique. « Répugnent à mon âme » préserve l’idiome sémitique tout en restant intelligible; l’ordre des propositions et l’ellipse de « la troisième » maintiennent la vigueur rhétorique de l’original.
