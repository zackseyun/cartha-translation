  text: And they raised a shout and made a mighty sound heard[a], to make remembrance before the Most High.
translation:
  language: fr
  text: Ils poussèrent des cris d’acclamation et firent retentir un son puissant, pour faire mémoire devant le Très-Haut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour servir de mémorial devant le Très-Haut ». L’infinitif hébreu et le parallèle grec emploient tous deux un langage mémoriel dans un contexte liturgique.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרִיעוּ
  choice: Ils poussèrent des acclamations
  rationale: Le verbe désigne ici un cri public et cérémoniel. « Acclamations » rend naturellement sa force cultuelle sans supposer que ce premier verbe évoque nécessairement un instrument.
- source_word: וַיַּשְׁמִיעוּ
  choice: firent retentir
  rationale: Le hiphil de שמע signifie littéralement « faire entendre ». « Faire retentir » conserve la valeur causative tout en donnant une formulation française naturelle dans ce contexte sonore et liturgique.
- source_word: קוֹל אַדִּיר
  choice: un son puissant
  rationale: קוֹל peut désigner une voix ou un son. « Son » maintient cette amplitude sémantique, tandis que « puissant » restitue אַדִּיר sans limiter le passage à une parole articulée.
- source_word: לְהַזְכִּיר
  choice: pour faire mémoire
  rationale: L’infinitif hiphil de זכר possède ici une valeur mémorielle liturgique, confirmée par le grec εἰς μνημόσυνον. « Faire mémoire » conserve cette résonance sans préciser indûment qui se souvient de quoi.
- source_word: לִפְנֵי עֶלְיוֹן
  choice: devant le Très-Haut
  rationale: « Le Très-Haut » rend le titre divin עֶלְיוֹן, et « devant » correspond directement à לִפְנֵי dans le cadre cultuel.
theological_decisions:
- issue: Valeur cultuelle du langage mémoriel
  choice: pour faire mémoire devant le Très-Haut
  alternative: pour servir de mémorial devant le Très-Haut
  rationale: L’hébreu et le parallèle grec expriment tous deux une fonction mémorielle dans le culte. La formulation retenue préserve cette portée ainsi que l’ambiguïté concernant l’agent ou l’objet précis du souvenir, sans importer une interprétation doctrinale ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. « Poussèrent des acclamations » garde le caractère cérémoniel; « firent retentir » restitue naturellement le causatif hébreu; « faire mémoire » conserve la tension liturgique du texte.
