  text: In his days a reservoir was dug out[b][a], and a conduit like the sea in its abundance.
translation:
  language: fr
  text: De son temps, un réservoir fut creusé, ainsi qu’un canal[a] aussi abondant que la mer.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « canal » est incertain ; il peut désigner plus généralement un chenal ou un cours d’eau.
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec parallèle porte : « Par lui fut fondée la hauteur de la double muraille, le haut mur de soutènement de l’enceinte du sanctuaire. » Le témoin hébreu parle plutôt d’un réservoir et d’un canal, ce qui révèle une importante divergence textuelle.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּדוֹרוֹ
  choice: De son temps
  rationale: Rend idiomatiquement la période d’activité du grand prêtre, dans un français actuel et digne.
- source_word: נִכְרָה
  choice: fut creusé
  rationale: Le nifal de כרה exprime naturellement l’action passive de creuser ou d’excaver.
- source_word: מִקְוֶה
  choice: réservoir
  rationale: Dans ce contexte de grands travaux, le mot désigne vraisemblablement une importante réserve d’eau aménagée.
- source_word: שִׂיחַ
  choice: canal
  rationale: Le terme hébreu est difficile; « canal » conserve le sens probable d’un ouvrage destiné à conduire l’eau sans imposer une identification technique trop précise.
- source_word: כַּיָּם
  choice: pareil à la mer
  rationale: Conserve explicitement la comparaison du texte hébreu.
- source_word: בַּהֲמוֹנוֹ
  choice: par son abondance
  rationale: המון peut évoquer l’abondance, la multitude ou le tumulte; ici, l’abondance convient au contexte hydraulique tout en maintenant l’image de l’immensité de la mer.
theological_decisions:
- issue: Choix entre le témoin hébreu et le parallèle grec fortement divergent
  choice: Suivre dans le texte principal le témoin hébreu conservé, qui parle d’un réservoir et d’un canal.
  alternative: 'Suivre le grec: « Par lui fut fondée la hauteur de la double construction, le haut contrefort de l’enceinte du sanctuaire. »'
  rationale: Le texte hébreu est ici extant et bénéficie donc de la priorité, mais la divergence substantielle du grec est signalée afin de ne pas masquer l’incertitude de l’histoire textuelle.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste proche de la syntaxe et des images hébraïques, tout en employant un vocabulaire architectural aisément compréhensible.
