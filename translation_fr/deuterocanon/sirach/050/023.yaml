translation:
  language: fr
  text: Qu’il vous donne la sagesse du cœur[a], et que la paix soit parmi vous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec parallèle porte « la joie du cœur » au lieu de « la sagesse du cœur ».
    reason: alternative_reading
  - marker: b
    text: 'Le grec développe ainsi la bénédiction : « et que la paix soit en nos jours en Israël, comme aux jours d’autrefois ».'
    reason: textual_variant
lexical_decisions:
- source_word: יִתֵּן
  choice: Qu’il vous donne
  rationale: Dans cette bénédiction, le yiqtol a une valeur de souhait plutôt que de simple futur. La tournure française avec « qu’il… » en restitue naturellement la force.
- source_word: לָכֶם
  choice: vous
  rationale: Le pronom français « vous » exprime directement le complément pluriel du verbe.
- source_word: חָכְמַת לֵבָב
  choice: la sagesse du cœur
  rationale: Cette traduction suit le texte hébreu conservé et maintient son expression concrète, où le cœur désigne le siège du discernement intérieur.
- source_word: וִיהִי
  choice: et que… soit
  rationale: La forme est comprise comme un souhait parallèle au premier membre de la bénédiction, et non comme l’annonce d’un futur.
- source_word: שָׁלוֹם
  choice: la paix
  rationale: « Paix » est le correspondant français usuel et conserve ici les nuances d’harmonie et de bien-être.
- source_word: בֵּינֵיכֶם
  choice: parmi vous
  rationale: Avec plusieurs destinataires, « parmi vous » rend naturellement la dimension relationnelle de l’expression hébraïque.
theological_decisions:
- issue: Choix du texte principal lorsque l’hébreu et le grec divergent
  choice: Retenir dans le texte principal la leçon hébraïque « la sagesse du cœur » et la formulation brève sur la paix
  alternative: 'Suivre le grec : « la joie du cœur », avec l’ajout « la paix en nos jours en Israël, comme aux jours d’autrefois »'
  rationale: Le texte hébreu de Ben Sira étant conservé ici avec un degré élevé de confiance, il sert de base à la traduction. Les différences substantielles du parallèle grec sont signalées en notes sans être harmonisées avec l’hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme de la bénédiction est conservé par les deux tournures au subjonctif. L’expression biblique « sagesse du cœur » demeure claire sans explicitation interprétative.
