base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/020.yaml
  text: Like a sandy ascent under the feet of an old man[c][b][a], so is a sharp-tongued wife to a gentle man.
translation:
  language: fr
  text: Comme une montée sablonneuse sous les pas d’un vieillard[a], ainsi est une épouse à la langue acérée[b] pour un homme doux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu חוּץ est difficile ici; le parallèle grec dit « sablonneuse », ce qui évoque vraisemblablement un sol instable sous les pas d’un homme âgé.
    reason: textual_variant
  - marker: b
    text: Ou « une épouse bavarde ». L’hébreu dit littéralement « une épouse de langue »; le grec désigne une femme très portée à parler.
    reason: lexical_alternative
  - marker: c
    text: Ou « un homme calme » ou « paisible ». L’hébreu peut signifier « doux, tendre », tandis que le grec met l’accent sur le calme.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַעֲלֵה
  choice: Comme une montée
  rationale: Le nom dérivé de עלה désigne une montée ou un chemin ascendant; le grec ἀνάβασις confirme cette image.
- source_word: חוּץ
  choice: sablonneuse
  rationale: Le mot hébreu est difficile dans ce contexte. Le parallèle grec porte ἀμμώδης, « sablonneuse », qui rend cohérente l’image d’un sol instable pour une personne âgée.
- source_word: לְרַגְלֵי יָשִׁישׁ
  choice: sous les pas d’un vieillard
  rationale: יָשִׁישׁ désigne ici un homme âgé, non le titulaire d’une fonction. « Sous les pas » exprime naturellement en français l’expérience pénible de la marche.
- source_word: אֵשֶׁת לָשׁוֹן
  choice: une épouse à la langue acérée
  rationale: L’expression signifie littéralement « une femme/épouse de langue ». Le contexte proverbial est défavorable; « à la langue acérée » traduit un usage blessant ou pénible de la parole, tout en signalant en note l’autre possibilité, « bavarde ».
- source_word: לְאִישׁ רַךְ
  choice: pour un homme doux
  rationale: רַךְ signifie littéralement « tendre, doux »; appliqué au caractère, il peut évoquer la douceur. Le grec ἡσύχῳ appuie aussi les sens « calme » ou « paisible ».
theological_decisions:
- issue: Maintien des termes sexués dans ce proverbe sapientiel
  choice: une épouse ... un homme
  alternative: une personne bavarde ... une personne douce
  rationale: L’hébreu emploie explicitement אֵשֶׁת et אִישׁ, et le grec γυνή et ἀνήρ. La formulation sexuée et le cadre conjugal du proverbe sont donc conservés sans généralisation.
translation_notes:
  register: Français international moderne, naturel et digne. La structure comparative du proverbe est conservée. « Vieillard » est employé au sens descriptif d’homme âgé, et non comme titre. Les notes maintiennent visibles l’incertitude textuelle de חוּץ et les ambiguïtés de אֵשֶׁת לָשׁוֹן et רַךְ.
