translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme proverbial est conservé. « Plus redoutable » explicite la valeur comparative de ὑπέρ et rend intelligible l’image grecque sans résoudre silencieusement son ambiguïté; la note signale l’interprétation métonymique traditionnelle par « venin ».
