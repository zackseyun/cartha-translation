  text: There is no head above the head of a snake[a], and there is no wrath above the wrath of an enemy.
translation:
  language: fr
  text: Il n’y a pas de tête plus redoutable que celle du serpent[a], ni de colère plus redoutable que celle de l’ennemi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il n’y a pas de venin comparable au venin du serpent. » Le grec dit littéralement « tête… tête du serpent »; la traduction conserve cette image plutôt que de la remplacer par une interprétation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κεφαλή
  choice: tête
  rationale: Le grec emploie concrètement « tête » dans les deux occurrences. L’ajout comparatif « plus redoutable » rend en français naturel la construction avec ὑπέρ, sans remplacer l’image par l’interprétation « venin ».
- source_word: ὄφις
  choice: serpent
  rationale: « Serpent » est le terme français courant et digne dans ce contexte sapientiel; il restitue clairement ὄφις.
- source_word: θυμός
  choice: colère
  rationale: Ici, θυμός désigne une colère hostile et intense. « Colère » reste naturel en français moderne; le comparatif « plus redoutable » en souligne la force sans imposer l’idée d’une fureur incontrôlée.
- source_word: ἐχθρός
  choice: ennemi
  rationale: « Ennemi » est l’équivalent direct et naturel, qui conserve la portée relationnelle du grec.
- source_word: ὑπέρ
  choice: plus redoutable que
  rationale: Dans cette construction comparative, ὑπέρ indique ce qui surpasse. Une traduction littérale par « au-dessus de » serait obscure avec « tête » et peu idiomatique avec « colère »; « plus redoutable que » exprime naturellement l’idée dans les deux membres tout en maintenant leur parallélisme.
