  text: From a woman is the beginning of sin[b][a], and because of her we all die together.
translation:
  language: fr
  text: C’est d’une femme que vient le commencement du péché[b], et c’est à cause d’elle que nous mourons tous.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et à cause d’elle nous sommes tous morts » ou « nous avons tous péri ». Le verbe hébreu peut exprimer une action accomplie, tandis que le parallèle grec porte : « nous mourons tous ».'
    reason: lexical_alternative
  - marker: b
    text: Cette formule fait probablement allusion à la femme dans le récit ancien de la chute ; le verset reste toutefois très concis et n’en précise pas lui-même la portée théologique.
    reason: cross_reference
lexical_decisions:
- source_word: מֵאִשָּׁה
  choice: d’une femme
  rationale: La préposition מִן exprime ici la provenance ou l’origine. « D’une femme » est naturel en français et correspond au grec ἀπὸ γυναικός, sans transformer « femme » en « épouse ».
- source_word: תְחִלַת עָוֹן
  choice: le commencement du péché
  rationale: תְחִלָּה désigne le commencement, et עָוֹן peut signifier faute, culpabilité ou péché. Le parallèle grec ἀρχὴ ἁμαρτίας appuie ici « commencement du péché ».
- source_word: וּבִגְלָלָהּ
  choice: et c’est à cause d’elle
  rationale: בגלל marque clairement la cause. La tournure clivée donne en français une phrase naturelle tout en conservant l’insistance du pronom féminin.
- source_word: גָוַעְנוּ
  choice: nous mourons
  rationale: גוע signifie mourir ou expirer. Bien que la forme hébraïque puisse décrire une action accomplie, le présent du parallèle grec, ἀποθνήσκομεν, soutient la portée générale et actuelle de « nous mourons ».
- source_word: יַחַד
  choice: tous ensemble
  rationale: יַחַד signifie littéralement « ensemble ». « Tous ensemble » conserve cette valeur collective et tient aussi compte du grec πάντες, « tous ».
theological_decisions:
- issue: L’attribution du commencement du péché et de la mort à « une femme »
  choice: Conserver explicitement « une femme » et « à cause d’elle »
  alternative: Atténuer la formulation en parlant de « l’humanité » ou expliciter directement le nom d’Ève
  rationale: L’hébreu et le grec emploient tous deux le singulier « femme ». Le verset évoque vraisemblablement le récit de la chute, mais ne nomme pas la femme et n’en développe pas la portée théologique; la traduction conserve donc sa formulation abrupte et sa tension sans l’adoucir ni l’amplifier.
- issue: Valeur temporelle de גָוַעְנוּ
  choice: 'Présent universel : « nous mourons »'
  alternative: 'Accompli : « nous sommes tous morts » ou « nous avons tous péri »'
  rationale: La morphologie hébraïque permet une lecture accomplie, tandis que le grec présente un énoncé général au présent. Le texte principal suit ce dernier indice, et la variante est signalée en note.
translation_notes:
  register: Français moderne, international et digne. La construction « C’est d’une femme que vient… » restitue naturellement la mise en tête de מֵאִשָּׁה, tandis que « commencement » garde la tonalité proverbiale et formelle du texte.
