base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/012.yaml
  text: The fear of the Lord surpasses everything[b][a]; to whom will the one who holds fast to it be compared?
translation:
  language: fr
  text: La crainte du Seigneur surpasse tout[a] ; à qui comparera-t-on celui qui la tient fermement[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « est au-dessus de tout ». Le grec exprime sa supériorité sur toute chose.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « celui qui la possède ». Le verbe grec peut évoquer aussi bien le fait de tenir fermement que celui de posséder durablement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φόβος Κυρίου
  choice: la crainte du Seigneur
  rationale: Conserve le terme grec φόβος et l’expression théologique caractéristique de la littérature sapientielle, sans l’atténuer en simple « respect ».
- source_word: ὑπὲρ πᾶν ὑπερέβαλεν
  choice: surpasse tout
  rationale: Rend ensemble l’idée de supériorité exprimée par ὑπὲρ πᾶν et ὑπερέβαλεν. Le présent convient à la portée proverbiale de l’énoncé malgré l’aoriste grec.
- source_word: ὁ κρατῶν αὐτοῦ
  choice: celui qui la tient fermement
  rationale: κρατέω peut exprimer le fait de saisir, de garder ou de posséder avec fermeté. Le pronom féminin « la » reprend naturellement « la crainte » en français.
- source_word: τίνι ὁμοιωθήσεται
  choice: à qui comparera-t-on celui qui… ?
  rationale: La tournure française active indéfinie rend naturellement le futur passif grec tout en conservant la question rhétorique et son objet humain singulier.
theological_decisions:
- issue: Faut-il atténuer « crainte » en « respect » ou « révérence » ?
  choice: la crainte du Seigneur
  alternative: le respect du Seigneur
  rationale: Le grec emploie φόβος, et « la crainte du Seigneur » est une notion centrale de la littérature sapientielle. La conserver maintient la tension théologique du texte.
- issue: Valeur temporelle de l’aoriste ὑπερέβαλεν
  choice: surpasse
  alternative: a surpassé
  rationale: Le verset formule une vérité sapientielle générale ; le présent français en restitue naturellement la portée gnomique sans transformer l’idée.
- issue: Portée de κρατῶν
  choice: la tient fermement
  alternative: la possède
  rationale: Le choix principal maintient la nuance de prise ou d’attachement ferme, tandis que la note signale la possibilité d’une possession durable.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste proche de la structure grecque tout en employant une interrogation naturelle en français. Les deux marqueurs de note figurent dans le texte principal et suivent les expressions auxquelles ils se rapportent.
