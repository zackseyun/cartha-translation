  text: A poor man who is proud[a], and a rich man who lies[b], and an old man who commits adultery and lacks sense.
translation:
  language: fr
  text: Un pauvre orgueilleux, un riche qui ment[a], et un vieillard adultère qui manque de discernement[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi signifier « tromper » ou « nier ». Le grec porte « menteur », ce qui appuie la traduction « qui ment ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu peut aussi se traduire par « qui manque d’intelligence » ou « qui est dépourvu de connaissance » ; le grec évoque également un homme diminué en intelligence.
    reason: lexical_alternative
  - marker: c
    text: 'Le texte grec introduit cette liste par les mots : « Il y a trois sortes de personnes que je déteste, et leur manière de vivre m’irrite profondément. » Cette introduction ne figure pas dans la ligne hébraïque conservée ici.'
    reason: textual_variant
lexical_decisions:
- source_word: דַּל גֵּאֶה
  choice: un pauvre orgueilleux
  rationale: דַּל désigne ici un homme pauvre ou de condition modeste, et גֵּאֶה son orgueil ou son arrogance. La formulation nominale, concise, conserve le parallélisme hébreu.
- source_word: עָשִׁיר מְכַחֵשׁ
  choice: un riche qui ment
  rationale: עָשִׁיר signifie « riche ». Le participe מְכַחֵשׁ peut exprimer le mensonge, la tromperie ou la dénégation ; le grec ψεύστην confirme ici le sens général de « menteur ».
- source_word: זָקֵן מְנָאֵף
  choice: un vieillard adultère
  rationale: זָקֵן désigne un homme âgé plutôt qu’un responsable communautaire. מְנָאֵף qualifie celui qui commet l’adultère ; « adultère » restitue naturellement la concision de l’hébreu.
- source_word: חֲסַר דַּעַת
  choice: qui manque de discernement
  rationale: L’expression signifie littéralement qu’il est dépourvu de connaissance ou d’intelligence. Dans ce contexte moral, « discernement » rend bien le jugement défaillant ; le grec ἐλαττούμενον συνέσει va dans le même sens.
theological_decisions:
- issue: Rapport entre la ligne hébraïque conservée et la forme grecque plus développée
  choice: Traduire directement l’énumération hébraïque conservée et employer le grec comme témoin de contrôle lexical.
  alternative: 'Intégrer au verset l’introduction grecque : « Il y a trois sortes de personnes que je déteste… »'
  rationale: Le texte hébreu fourni commence directement par les trois figures, tandis que le grec contient une introduction absente de cette ligne hébraïque. La priorité donnée à l’hébreu conduit à ne pas ajouter cette proposition, tout en signalant la différence en note.
- issue: Portée morale de חֲסַר דַּעַת
  choice: « manque de discernement »
  alternative: « manque de connaissance » ou « est dépourvu d’intelligence »
  rationale: « Discernement » préserve la dimension intellectuelle et morale du syntagme sans transformer celui-ci en diagnostic ni en affirmation doctrinale.
translation_notes:
  register: Français international moderne, sobre et proverbial. Les trois groupes nominaux gardent le rythme serré de l’hébreu. « Vieillard » est choisi plutôt que « ancien » afin d’éviter l’idée d’une fonction officielle ; « qui ment » est plus courant que « menteur » tout en reflétant le participe hébreu.
