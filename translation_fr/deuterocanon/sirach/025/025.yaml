  text: A bad wife is leprosy to her husband[a]; let him drive her out of his house[c][b], and he will be healed of his leprosy.
translation:
  language: fr
  text: Une mauvaise épouse est une lèpre pour son mari[a] ; qu’il la chasse de sa maison[b][c], et il guérira de sa lèpre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traditionnellement rendu par « lèpre » désigne, dans les textes bibliques, une catégorie d’affections cutanées graves et non nécessairement la lèpre au sens médical moderne.
    reason: cultural_note
  - marker: b
    text: 'Ou : « qu’il divorce d’elle ». Plus littéralement, l’hébreu dit : « qu’il la chasse de sa maison » ; cela peut impliquer une séparation sans en préciser la forme juridique.'
    reason: alternative_reading
  - marker: c
    text: 'Le texte grec est très différent : « Ne donne pas d’issue à l’eau, ni d’autorité à une femme mauvaise. » La traduction suit ici le témoin hébreu conservé.'
    reason: textual_variant
lexical_decisions:
- source_word: אִשָּׁה רָעָה
  choice: une mauvaise épouse
  rationale: Dans ce contexte conjugal, אִשָּׁה désigne l’épouse. « Mauvaise » conserve la portée large de רָעָה sans la réduire à la seule perversité morale.
- source_word: צָרַעַת
  choice: une maladie de peau
  rationale: Le terme biblique désigne une catégorie ancienne d’affections cutanées, plus large que la maladie de Hansen aujourd’hui appelée lèpre. Cette formulation évite une identification médicale trompeuse tout en maintenant l’image d’une affection grave.
- source_word: לְבַעֲלָהּ
  choice: pour son mari
  rationale: בעל signifie ici « mari ». La préposition ל exprime naturellement en français ce que cette épouse représente pour lui.
- source_word: יְגַרְשֶׁנָּה מִבֵּיתוֹ
  choice: qu’il la chasse de chez lui
  rationale: גרש signifie concrètement chasser ou expulser, et מִבֵּיתוֹ précise « de sa maison ». La traduction ne réduit donc pas l’expression au sens juridique de divorcer.
- source_word: וְיִתְרַפֵּא מִצָּרַעְתּוֹ
  choice: et il guérira de son mal
  rationale: Le verbe רפא exprime la guérison comme résultat. « Son mal » reprend naturellement en français la métaphore de l’affection sans suggérer que le mari souffre littéralement d’une maladie cutanée.
theological_decisions:
- issue: Expulsion concrète ou divorce juridique
  choice: « qu’il la chasse de chez lui »
  alternative: « qu’il divorce d’elle »
  rationale: Le verbe גרש suivi de « de sa maison » décrit d’abord une expulsion du foyer. Traduire par « divorcer » imposerait une qualification juridique que l’hébreu ne précise pas.
- issue: Identification de צָרַעַת à la lèpre moderne
  choice: « maladie de peau » avec note
  alternative: « lèpre »
  rationale: La catégorie biblique est plus étendue que la maladie de Hansen. Le choix retenu préserve l’image pathologique tout en évitant une équivalence médicale anachronique.
translation_notes:
  register: Français international moderne, sobre et sentencieux. La tournure conserve la rudesse du propos et sa métaphore médicale sans ajouter de justification doctrinale ni transformer explicitement l’expulsion en divorce.
