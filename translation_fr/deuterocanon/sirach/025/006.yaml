  text: How beautiful is wisdom in the aged[a], and understanding and counsel in those who are honored.
translation:
  language: fr
  text: Comme elle est belle, la sagesse des personnes âgées[a], ainsi que la réflexion et le conseil chez les personnes honorées !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la sagesse des vieillards ». Le grec emploie ici un pluriel grammaticalement masculin.
    reason: Précision sur le genre grammatical et variante lexicale de γερόντων.
lexical_decisions:
- source_word: ὡς ὡραία
  choice: Comme elle est belle
  rationale: ὡς introduit ici une exclamation, et ὡραία exprime la beauté ou le caractère admirable. Cette tournure française conserve la force exclamative sans réduire le sens à « convenable ».
- source_word: γερόντων
  choice: des personnes âgées
  rationale: Le génitif pluriel désigne des personnes avancées en âge. Cette formulation moderne évite de faire de « vieillards » un terme péjoratif ou de confondre ces personnes avec des anciens exerçant une fonction.
- source_word: σοφία
  choice: sagesse
  rationale: Terme central du Siracide, σοφία garde ici son sens courant et théologiquement non spécialisé de sagesse.
- source_word: δεδοξασμένοις
  choice: chez les personnes honorées
  rationale: Le participe parfait désigne des personnes qui jouissent d'honneur ou de considération. « Honorées » rend cet état sans la connotation théologique que pourrait avoir « glorifiées ».
- source_word: διανόημα
  choice: réflexion
  rationale: Le mot peut désigner la pensée, la faculté de réfléchir ou le fruit de cette réflexion. « Réflexion » convient au parallélisme avec le conseil tout en restant naturel.
- source_word: βουλή
  choice: conseil
  rationale: Dans ce contexte sapientiel, βουλή évoque le conseil prudent ou la délibération avisée. « Conseil » conserve à la fois la portée pratique et le registre élevé.
theological_decisions:
- issue: Genre et portée de γερόντων
  choice: « des personnes âgées » dans le texte principal
  alternative: « des vieillards »
  rationale: La forme grecque est grammaticalement masculine, mais la maxime peut avoir une portée générale. Le texte principal emploie donc une formulation inclusive, tandis que la note signale la traduction masculine plus formelle afin de ne pas effacer l'ambiguïté de la source.
translation_notes:
  register: Français international moderne, digne et sapientiel. L'exclamation initiale reproduit la valeur de ὡς ὡραία. « Ainsi que » permet d'étendre naturellement l'appréciation aux deux termes coordonnés, tout en conservant l'ellipse du grec.
