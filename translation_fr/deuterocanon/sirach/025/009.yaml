base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/009.yaml
  text: Blessed is the man who lives with an intelligent wife[a], and who has not slipped with his tongue[c][b], and who has not served one unworthy of him.
translation:
  language: fr
  text: Heureux l’homme qui vit avec une épouse avisée[a], qui n’a pas trébuché en paroles[b] et qui n’a pas servi quelqu’un d’indigne de lui[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une épouse prudente » ou « une épouse sensée » ; le grec évoque une épouse douée d’intelligence pratique et de discernement.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « n’a pas trébuché par la langue » : il s’agit d’un faux pas commis en parlant.'
    reason: lexical_alternative
  - marker: c
    text: Ou « n’a pas été asservi à quelqu’un d’indigne de lui » ; le verbe grec peut exprimer aussi bien le service que la servitude.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριος
  choice: Heureux
  rationale: Formule naturelle des béatitudes en français, qui convient au ton sapientiel et exprime une condition enviable sans la réduire à un sentiment passager.
- source_word: συνοικῶν
  choice: qui vit avec
  rationale: Le participe désigne la vie commune au sein d’un foyer. Cette formulation est claire et actuelle, tandis que le contexte conjugal est précisé par « épouse ».
- source_word: γυναικὶ συνετῇ
  choice: une épouse avisée
  rationale: Dans le contexte de συνοικῶν, γυνή désigne vraisemblablement l’épouse. συνετή évoque l’intelligence pratique, le discernement et la prudence ; « avisée » maintient cet éventail de sens.
- source_word: ἐν γλώσσῃ οὐκ ὠλίσθησεν
  choice: n’a pas trébuché dans ses paroles
  rationale: La traduction conserve la métaphore du faux pas tout en exprimant naturellement en français que celui-ci concerne l’usage de la parole.
- source_word: ἐδούλευσεν
  choice: a servi
  rationale: Le verbe peut désigner le service ou l’asservissement. « Servi » préserve ici l’indétermination du type exact de dépendance sans imposer l’idée d’esclavage.
- source_word: ἀναξίῳ αὐτοῦ
  choice: quelqu’un d’indigne de lui
  rationale: Cette formulation rend directement le jugement comparatif et social du grec sans le durcir en parlant explicitement d’un « inférieur ».
theological_decisions:
- issue: Masculin singulier dans la béatitude sapientielle
  choice: l’homme
  alternative: celui qui / la personne qui
  rationale: Les formes grecques sont au masculin singulier et le cadre conjugal mentionne une épouse. « L’homme » garde cette donnée du texte au lieu de la neutraliser.
- issue: Portée de δουλεύω
  choice: a servi
  alternative: a été asservi à / a été l’esclave de
  rationale: Le grec peut porter une nuance forte de servitude, mais le contexte ne précise pas si un esclavage juridique ou un asservissement est visé. Le corps du texte retient donc le terme moins déterminé, et la note signale l’autre possibilité.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe ternaire du grec est conservée, avec une répétition claire de « qui ». La métaphore du trébuchement demeure dans le texte, tandis que les nuances lexicales principales sont documentées en notes.
