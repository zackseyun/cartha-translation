review_pass:
  verdict: revise
  source_fidelity: 'Le texte hébreu présente deux comparaisons elliptiques et parallèles : « toute blessure, et non [comme] blessure du cœur ; tout mal, et non [comme] mal d’une femme ». La révision rend explicitement en français le contraste comparatif implicite, sans en modifier la portée ni atténuer la formulation abrupte du second membre. Elle conserve les ambiguïtés de רָעָה (« mal », « malheur », « tort ») et de אִשָּׁה (« femme », éventuellement « épouse »).'
  naturalness: « Mais pas comme » est compréhensible, mais sonne comme un calque et laisse la comparaison elliptique peu naturelle en français. « Mais aucune n’est comme… / mais aucun n’est comme… » est idiomatique, proverbial et rend clairement le sens intensif de la formule.
  terminology: « Blessure », « cœur », « mal » et « femme » sont appropriés. « Mal d’une femme » conserve volontairement l’ambiguïté du génitif hébreu et ne doit pas être réduit dans le texte à un mal « causé par » elle. La note peut signaler les possibilités lexicales sans privilégier cette causalité.
  issues:
  - severity: medium
    issue: La tournure « mais pas comme » est elliptique de façon peu idiomatique en français moderne.
    rationale: Elle reproduit trop directement la forme anglaise et peut rendre le rapport comparatif moins net. L’ajout du pronom indéfini (« aucune/aucun n’est ») explicite seulement ce que la construction hébraïque implique.
  - severity: low
    issue: La note propose « le malheur causé par une femme » comme unique reformulation de l’alternative.
    rationale: « Causé par » interprète le génitif et restreint une ambiguïté que le texte ne résout pas. Une formulation possessive ou relationnelle conserve mieux l’indétermination.
