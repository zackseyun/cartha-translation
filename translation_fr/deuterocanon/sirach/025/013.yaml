  text: Any wound[a], but not like a wound of the heart; any evil, but not like the evil of a woman.
translation:
  language: fr
  text: Toute blessure, mais aucune n’est comme une blessure du cœur ; tout mal, mais aucun n’est comme le mal d’une femme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout malheur, mais aucun n’est comme le malheur d’une femme » ; le mot hébreu traduit par « mal » peut aussi signifier « malheur », « tort » ou « dommage », et « femme » peut également signifier « épouse » selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: toute / tout
  rationale: Rendu distributivement dans les deux membres. « Toute blessure » et « tout mal » conservent la portée universelle et le parallélisme proverbial de l’hébreu.
- source_word: מַכָּה
  choice: blessure
  rationale: Le terme désigne un coup ou la lésion qui en résulte. « Blessure » convient au sens propre comme au sens figuré et correspond au grec πληγή.
- source_word: הַלֵּב
  choice: du cœur
  rationale: La formulation concrète est conservée, sans réduire le cœur à l’esprit ou aux émotions seulement ; en hébreu, il peut représenter l’être intérieur.
- source_word: רָעָה
  choice: mal
  rationale: Le mot peut désigner le mal moral, mais aussi le malheur, le tort ou le dommage. « Mal » maintient cette amplitude mieux que « méchanceté », tout en restant proche du parallèle grec πονηρία.
- source_word: אִשָּׁה
  choice: une femme
  rationale: Sans marque explicite de possession ou de relation conjugale, « une femme » est la traduction la plus directe. Le sens possible « épouse » est signalé en note.
- source_word: וְלֹא כְ
  choice: mais pas comme
  rationale: 'Cette tournure garde visible la structure comparative négative du texte : toute occurrence de la première catégorie, mais aucune comparable à l’exemple cité.'
theological_decisions:
- issue: Formulation finale susceptible d’être perçue comme misogyne
  choice: Conserver dans le texte « le mal d’une femme »
  alternative: le malheur causé par une femme / le mal d’une épouse
  rationale: La traduction ne doit pas atténuer silencieusement la formulation abrupte de la source. La note expose toutefois les ambiguïtés lexicales réelles de רָעָה et אִשָּׁה, sans imposer une lecture morale ou conjugale unique.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme hébreu est maintenu par la répétition de « tout/toute » et de « mais pas comme ». La ponctuation en point-virgule distingue clairement les deux membres.
