  text: 'Three things my soul has hated[a], and I am greatly distressed by their lives:'
translation:
  language: fr
  text: 'Il y a trois choses que mon âme déteste[a], et leur vie m’afflige profondément :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec diffère profondément ici : « l’entente entre frères, l’amitié entre voisins, et une femme et un mari qui vivent en bonne harmonie ». L’hébreu et le grec semblent refléter deux formes différentes du texte à cet endroit.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלֹשׁ הֵנָה
  choice: Il y a trois choses
  rationale: Le français explicite naturellement le substantif sous-entendu et introduit la liste annoncée.
- source_word: שָׂנְאָה
  choice: déteste
  rationale: Le parfait hébreu exprime ici une aversion établie et toujours actuelle ; le présent convient au style sapientiel français.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: Cette formulation conserve l’expression hébraïque et son intensité affective sans la réduire simplement à « je ».
- source_word: וְצַר לִי מְאֹד
  choice: m’afflige profondément
  rationale: Rend de façon naturelle la vive détresse personnelle exprimée par l’hébreu.
- source_word: בְּחַיֵּיהֶם
  choice: leur vie
  rationale: Traduction proche du sens littéral « dans/par leur vie », sans imposer l’interprétation plus précise « leur manière de vivre ».
theological_decisions:
- issue: Divergence textuelle majeure entre l’hébreu et le grec en Siracide 25.2
  choice: Le texte principal traduit l’hébreu conservé et signale la forme grecque en note.
  alternative: 'Le grec porte : « l’entente entre frères, l’amitié entre voisins, et une femme et un mari qui vivent en bonne harmonie ».'
  rationale: L’hébreu conservé sert de texte source principal, mais la forme grecque transmet un contenu entièrement différent qui doit rester visible afin de ne pas masquer l’incertitude textuelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le tour « mon âme déteste » conserve la force poétique de l’hébreu ; « leur vie » maintient l’ambiguïté de בְּחַיֵּיהֶם.
