  yaml_path: translation/deuterocanon/sirach/025/019.yaml
  text: Any evil is small compared with the evil of a woman[b][a]; may the lot of a sinner fall upon her.
translation:
  language: fr
  text: Tout mal est peu de chose à côté du mal d’une femme[a] ; que le sort d’un pécheur tombe sur elle[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Tout mal est léger en comparaison du mal d’une femme. » L’hébreu et le grec expriment tous deux une comparaison.'
    reason: lexical_alternative
  - marker: b
    text: 'La dernière proposition peut aussi se comprendre comme une prédiction : « le sort d’un pécheur tombera sur elle ». Le grec, qui emploie un optatif, favorise toutefois le sens d’un souhait ou d’une imprécation retenu dans le texte.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְעַט
  choice: est peu de chose
  rationale: Dans cette proposition comparative, מְעַט exprime l’insignifiance relative. « Est peu de chose » est idiomatique en français et correspond au grec μικρά sans réduire le terme à une simple quantité.
- source_word: רָעָה
  choice: mal
  rationale: רָעָה peut désigner le mal moral, le tort ou le malheur. « Mal » conserve cette amplitude et la rudesse de la maxime, tout en concordant avec le grec κακία.
- source_word: כְרָעַת אִשָּׁה
  choice: à côté du mal d’une femme
  rationale: Le préfixe כְּ introduit ici une comparaison. « À côté de » exprime naturellement en français l’idée que tout autre mal paraît insignifiant en comparaison. אִשָּׁה reste au singulier et n’est pas précisé comme « épouse ».
- source_word: גוֹרַל
  choice: sort
  rationale: Le mot désigne d’abord ce qui est attribué par le sort, puis la part ou la destinée échue à quelqu’un. « Sort » maintient cette image et correspond au grec κλῆρος.
- source_word: חוֹטֵא
  choice: un pécheur
  rationale: Le participe substantivé désigne de manière générale une personne qui pèche. « Un pécheur » en conserve le singulier générique.
- source_word: יִפּוֹל עָלֶיהָ
  choice: que … tombe sur elle
  rationale: Le yiqtol peut avoir ici une valeur volitive. L’optatif grec ἐπιπέσοι appuie fortement cette lecture comme souhait ou imprécation plutôt que comme simple annonce future.
theological_decisions:
- issue: Valeur de la proposition verbale finale
  choice: 'Imprécation ou souhait : « que le sort d’un pécheur tombe sur elle »'
  alternative: 'Prédiction : « le sort d’un pécheur tombera sur elle »'
  rationale: Le yiqtol hébreu admet une valeur modale, et l’optatif du parallèle grec soutient nettement le sens volitif. La traduction garde donc la tension et la dureté de l’énoncé au lieu de les transformer en constat neutre.
- issue: Formulation liée au genre
  choice: Maintien du singulier « une femme »
  alternative: « une épouse » ou le pluriel « les femmes »
  rationale: Le texte hébreu emploie le singulier אִשָּׁה sans le limiter au sens d’« épouse ». La formulation culturellement dure est conservée sans l’adoucir, la généraliser davantage ni lui ajouter une précision absente de la source.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Peu de chose à côté de » rend la comparaison de façon naturelle et digne. Le point d’exclamation signale la force volitive de la dernière proposition sans ajouter de contenu. La rudesse du propos envers une femme est maintenue parce qu’elle appartient explicitement au texte source.
