  text: Happy is the husband of a prudent wife[b][a], and who does not plow with an ox and a donkey together.
translation:
  language: fr
  text: Heureux le mari d’une femme avisée[b][a], qui ne laboure pas avec un bœuf et un âne attelés ensemble.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente une lecture substantiellement différente : « Comme il est grand, celui qui a trouvé la sagesse ! Mais nul ne surpasse celui qui craint le Seigneur. »'
    reason: alternative_reading
  - marker: b
    text: Cette image fait probablement allusion à Deutéronome 22.10, qui interdit de labourer avec un bœuf et un âne attelés ensemble. Elle peut évoquer ici, sous forme proverbiale, un couple mal assorti.
    reason: cross_reference
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heureux
  rationale: La formule de béatitude hébraïque présente une situation enviable. « Heureux » est naturel en français et convient au registre sapientiel sans ajouter une nuance confessionnelle étrangère au contexte.
- source_word: בַעַל אִשָּׁה
  choice: le mari d’une femme
  rationale: Littéralement « maître/possesseur d’une femme », l’expression est un idiome désignant le mari. La traduction idiomatique évite en français une idée trompeuse de propriété.
- source_word: מַשְׁכָּלֶת
  choice: avisée
  rationale: Le terme évoque l’intelligence pratique, le discernement et le bon sens. « Avisée » exprime cette sagesse dans la conduite sans la réduire à la seule capacité intellectuelle.
- source_word: חוֹרֵשׁ
  choice: laboure
  rationale: Le participe hébreu désigne directement l’action de labourer; le présent français poursuit naturellement la caractérisation du mari déclaré heureux.
- source_word: בְּשׁוֹר וְבַחְמוֹר יַחְדָּו
  choice: avec un bœuf et un âne attelés ensemble
  rationale: La formulation conserve les deux animaux et l’idée de leur association. « Attelés » explicite ce que suppose le labour et rend clairement perceptible l’image d’un couple mal assorti, probablement liée à Deutéronome 22.10.
theological_decisions:
- issue: Divergence majeure entre le texte hébreu conservé et la tradition grecque
  choice: Suivre le texte hébreu dans le corps du verset et donner la lecture grecque en note.
  alternative: « Comme il est grand, celui qui a trouvé la sagesse ! Mais nul ne surpasse celui qui craint le Seigneur. »
  rationale: Le texte hébreu étant conservé avec une confiance élevée, il sert de texte principal. La lecture grecque, substantiellement différente, est néanmoins signalée intégralement afin de ne pas harmoniser deux traditions textuelles distinctes.
- issue: Portée proverbiale de l’image du bœuf et de l’âne
  choice: Conserver l’image agricole tout en explicitant sobrement l’attelage.
  alternative: Traduire directement l’idée comme une union mal assortie.
  rationale: L’image concrète appartient au texte et fait probablement écho à Deutéronome 22.10. Une paraphrase abstraite effacerait cette intertextualité et résoudrait trop fortement le sens figuré.
translation_notes:
  register: Français international moderne, clair et digne, avec une tournure sapientielle concise. « Femme avisée » reste courant et exprime le discernement pratique. L’image agricole est conservée plutôt que remplacée par son interprétation.
