  text: If she does not go according to your hand[b][a], cut her off from your flesh.
translation:
  language: fr
  text: Si elle ne suit pas ta direction[a], retranche-la de ta chair[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon ta main »; l’expression désigne ici le fait d’agir suivant la direction ou la volonté de quelqu’un.'
    reason: lexical_alternative
  - marker: b
    text: L’expression « retranche-la de ta chair » emploie l’image corporelle d’une séparation décisive; le grec n’utilise pas ici de terme juridique explicite pour le divorce.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ μὴ
  choice: Si… ne… pas
  rationale: Rend directement la condition négative, sans lisser la formulation en « à moins que ».
- source_word: πορεύεται
  choice: se conduit
  rationale: Le verbe signifie littéralement « aller, marcher »; dans ce contexte, il décrit la manière d’agir. « Se conduit » exprime naturellement ce sens en français sans ajouter un jugement moral absent du verbe lui-même.
- source_word: κατὰ χεῖρά σου
  choice: selon ta volonté
  rationale: Littéralement « selon ta main ». L’expression évoque ici la direction ou l’autorité exercée par la personne interpellée; « selon ta volonté » en donne un équivalent français intelligible, tandis que la note conserve l’image grecque.
- source_word: ἀπότεμε
  choice: retranche-la
  rationale: L’impératif exprime l’action énergique de couper ou d’amputer. « Retrancher » maintient cette image corporelle et l’idée d’une séparation décisive.
- source_word: ἀπὸ τῶν σαρκῶν σου
  choice: de ta propre chair
  rationale: Le grec emploie le pluriel littéral « de tes chairs », peu naturel en français. Le singulier « chair » préserve l’image d’une union corporelle et intime; « propre » explicite la valeur possessive.
- source_word: αὐτήν
  choice: la
  rationale: Le pronom féminin renvoie à la femme mentionnée dans le contexte immédiat.
theological_decisions:
- issue: Portée éthique et juridique de l’impératif
  choice: Conserver l’ordre abrupt et son image corporelle sans employer un terme juridique explicite.
  alternative: Traduire par « divorce d’avec elle » ou atténuer en « sépare-toi d’elle ».
  rationale: Le grec commande littéralement de la retrancher « de ta chair » et n’emploie aucun terme technique désignant le divorce. La traduction préserve donc la dureté et l’ambiguïté de l’image sans en imposer une interprétation juridique précise.
- issue: Sens de κατὰ χεῖρά σου
  choice: Comprendre l’expression comme l’action conforme à la direction ou à la volonté de l’interlocuteur.
  alternative: Conserver mot à mot « selon ta main » ou traduire « sous ton autorité ».
  rationale: « Selon ta main » serait opaque en français moderne, tandis que « sous ton autorité » renforcerait explicitement la notion de domination. « Selon ta volonté » reste intelligible tout en laissant la note signaler l’image et la gamme de sens.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement correspond au singulier grec. La formulation conserve la rudesse proverbiale du verset et son image de la chair, tout en expliquant en note l’idiome de la « main ».
