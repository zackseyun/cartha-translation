  terminology: « Direction » rend l’éventail sémantique de κατὰ χεῖρά σου (orientation, conduite, autorité) sans imposer exclusivement l’idée de volonté personnelle ou de domination. « Chair » préserve l’image corporelle et relationnelle sans qualifier explicitement l’acte de divorce. Les notes conservent les deux ambiguïtés importantes et leurs ancres sont correctement placées.
