  text: A woman's evil darkens a man's appearance[b][a], and makes his face gloomy like a bear.
translation:
  language: fr
  text: La méchanceté d’une femme assombrit l’apparence d’un homme[a] et assombrit son visage comme un ours.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « femme » peut aussi signifier « épouse »; le proverbe peut donc viser plus précisément la vie conjugale.
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec présente une leçon différente : « elle assombrit son visage comme un sac »; il parle apparemment du visage de la femme plutôt que de celui de l’homme.'
    reason: alternative_reading
lexical_decisions:
- source_word: רֹעַ
  choice: méchanceté
  rationale: Le nom désigne ici la malignité ou la conduite mauvaise. « Méchanceté » conserve la portée morale et la force proverbiale du texte.
- source_word: אִשָּׁה
  choice: d’une femme
  rationale: אִשָּׁה peut désigner une femme ou une épouse. En l’absence de possessif explicite, le sens générique est retenu dans le texte, avec l’autre possibilité en note.
- source_word: יַשְׁחִיר
  choice: assombrit
  rationale: La forme causative exprime le fait de rendre sombre ou noir. « Assombrit » est naturel en français et maintient l’image.
- source_word: מַרְאֶה אִישׁ
  choice: l’apparence d’un homme
  rationale: מַרְאֶה renvoie à l’aspect visible, et אִישׁ désigne explicitement un homme dans ce proverbe.
- source_word: וְיַקְדִיר פָּנָיו
  choice: rend son visage sombre
  rationale: Le verbe peut évoquer l’obscurcissement, l’air morne ou endeuillé. Cette formulation préserve à la fois l’image visuelle et sa nuance affective.
- source_word: לְדוֹב
  choice: comme celui d’un ours
  rationale: Le texte hébreu transmis porte « ours ». L’ajout idiomatique de « celui » rattache clairement la comparaison au visage, sans modifier l’image.
theological_decisions:
- issue: Formulation genrée du proverbe
  choice: « d’une femme » et « d’un homme »
  alternative: « d’une épouse » et, implicitement, de son mari
  rationale: L’hébreu emploie des termes explicitement genrés. La traduction ne les neutralise pas et laisse en note le possible cadre conjugal.
- issue: Divergence entre l’hébreu et le grec
  choice: 'Suivre l’hébreu : le visage de l’homme devient sombre « comme celui d’un ours »'
  alternative: Le grec parle du visage de la femme, assombri « comme un sac » ou « comme une toile de sac »
  rationale: Le témoin hébreu fourni est la source principale et sa leçon est intelligible. La divergence grecque, substantielle quant au pronom et à l’image, est signalée sans être harmonisée.
translation_notes:
  register: Français international moderne, sobre et proverbial. La répétition de la racine sémantique de l’obscurité est conservée sous les formes « assombrit » et « sombre ». La comparaison hébraïque avec l’ours reste volontairement abrupte.
