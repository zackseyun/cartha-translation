  text: Her husband sits among his companions[a], and without sense he groans.
translation:
  language: fr
  text: Son mari est assis parmi ses compagnons[a] et, sans comprendre, il gémit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente une lecture différente : « Son mari s’étendra à table auprès de son prochain et, après avoir entendu, il gémit amèrement. » La divergence avec l’hébreu conservé est particulièrement marquée dans la seconde partie du verset.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲלָה
  choice: son mari
  rationale: Dans ce contexte, בַּעַל avec le suffixe féminin singulier désigne le mari de la femme; « maître » ou « propriétaire » serait trompeur.
- source_word: בֵּין רֵעִים
  choice: parmi ses compagnons
  rationale: L’expression désigne un groupe d’amis ou de proches dans un cadre social. « Compagnons » conserve cette portée sans préciser abusivement le degré d’intimité.
- source_word: יֵשֵׁב
  choice: est assis
  rationale: Le verbe hébreu signifie simplement « s’asseoir/être assis ». Le grec évoque plutôt le fait de s’étendre à table, nuance laissée à la note.
- source_word: וּבְלֹא טַעֲמוֹ
  choice: sans comprendre
  rationale: טַעַם peut évoquer le goût, le jugement, le discernement ou la compréhension. Ici, « sans comprendre » rend naturellement l’idée d’une absence de compréhension tout en évitant le littéralisme obscur « sans son sens ».
- source_word: יִתְאַנָּח
  choice: il gémit
  rationale: Le verbe exprime une manifestation audible de détresse. « Gémit » en restitue mieux l’intensité que « soupire ».
theological_decisions:
- issue: Priorité du texte hébreu lorsque l’hébreu et le grec divergent
  choice: 'Le texte principal suit l’hébreu conservé : le mari est assis parmi ses compagnons et gémit sans comprendre.'
  alternative: Le grec présente le mari étendu à table auprès de son prochain et dit qu’après avoir entendu, il gémit amèrement.
  rationale: L’hébreu conservé, de haute confiance, constitue ici le témoin principal. La divergence grecque est assez importante, surtout dans le second membre, pour être signalée sans remplacer la lecture hébraïque.
translation_notes:
  register: Français international moderne, sobre et digne. La structure brève du parallélisme hébreu est conservée; « sans comprendre » privilégie une formulation idiomatique sans masquer l’incertitude sémantique de טַעַם.
