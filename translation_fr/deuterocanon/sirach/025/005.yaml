  text: If you did not desire them in your youth[b][a], how will you attain them in your old age?
translation:
  language: fr
  text: Si, dans ta jeunesse, tu ne les as pas désirés[a], comment les atteindras-tu dans ta vieillesse ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « désirés » ou « y as pris plaisir ». On pourrait aussi comprendre « recherchés ». L’objet pluriel, « les », n’est pas précisé; dans le parallèle grec, le contexte évoque le jugement et l’intelligence du conseil.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit directement la condition exprimée par la proposition initiale.
- source_word: בִּנְעֻרוֹתֶיךָ
  choice: dans ta jeunesse
  rationale: Rend naturellement en français la période de la jeunesse désignée par la forme hébraïque avec suffixe de deuxième personne du singulier.
- source_word: לֹא חֲפַצְתָּם
  choice: tu ne les as pas désirés
  rationale: חפץ signifie d’abord « désirer, prendre plaisir à ». Le pronom masculin pluriel « les » conserve l’objet implicite et non précisé de l’hébreu.
- source_word: אֵיךְ
  choice: comment
  rationale: Introduit la question rhétorique sans en expliciter davantage la portée modale.
- source_word: תַּשִּׁיגֵם
  choice: les atteindras-tu
  rationale: השיג exprime l’idée d’atteindre ou d’obtenir; « atteindre » maintient le lien avec des qualités ou acquis implicites.
- source_word: בְּזִקְנוֹתֶיךָ
  choice: dans ta vieillesse
  rationale: Formulation française idiomatique qui marque nettement le contraste avec la jeunesse.
theological_decisions:
- issue: Antécédent non exprimé du pronom pluriel
  choice: Conserver « les » sans nommer son référent dans le texte principal.
  alternative: Expliciter « la sagesse » ou « ces qualités ».
  rationale: L’hébreu ne donne qu’un suffixe pronominal pluriel. Le parallèle grec évoque le jugement et l’intelligence du conseil, mais cette indication contextuelle ne justifie pas de résoudre dans le texte l’ambiguïté de l’hébreu.
- issue: Valeur de חפץ
  choice: Traduire par « désirer » et signaler « rechercher » en note.
  alternative: Traduire directement par « rechercher ».
  rationale: « Désirer » représente plus formellement le sens lexical de חפץ; « rechercher » exprimerait davantage l’engagement pratique suggéré par la question et le contexte sapientiel.
translation_notes:
  register: Tutoiement singulier conforme aux suffixes hébreux de deuxième personne. Français actuel, sobre et proverbial; parallélisme « jeunesse / vieillesse » conservé. Le pronom pluriel demeure volontairement sans antécédent explicite.
