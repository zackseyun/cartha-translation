  text: If you did not gather in your youth[a], how then would you find anything in your old age?
translation:
  language: fr
  text: Si tu n’as rien amassé dans ta jeunesse[a], comment pourrais-tu trouver quelque chose dans ta vieillesse ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La forme du verbe grec transmise ici est difficile; la traduction en donne le sens probable : « rassembler » ou « amasser ».'
    reason: textual_variant
lexical_decisions:
- source_word: ἐν νεότητι
  choice: dans ta jeunesse
  rationale: Cette expression temporelle désigne une étape de la vie et forme un parallèle naturel avec « dans ta vieillesse ».
- source_word: οὐ συναγίοχας
  choice: tu n’as rien amassé
  rationale: La forme grecque transmise est inhabituelle et probablement altérée, mais elle est généralement rattachée au champ lexical de συνάγω, « rassembler, amasser ». « Amasser » conserve la portée proverbiale sans préciser la nature de ce qui est accumulé.
- source_word: πῶς ἂν εὕροις
  choice: comment pourrais-tu trouver
  rationale: Le conditionnel rend la valeur potentielle de ἄν avec l’optatif et préserve la force de la question rhétorique.
- source_word: ἐν τῷ γήρᾳ σου
  choice: dans ta vieillesse
  rationale: γήρας désigne la vieillesse comme étape de la vie; cette formulation reproduit l’équilibre avec « dans ta jeunesse ».
theological_decisions:
- issue: Nature de l’objet sous-entendu d’« amasser » et de « trouver »
  choice: Ne pas préciser s’il s’agit de sagesse, de biens ou de provisions; employer les indéfinis « rien » et « quelque chose » requis par le français.
  alternative: Ajouter explicitement « la sagesse » d’après le contexte, ou « des provisions » selon l’image proverbiale.
  rationale: Le grec ne nomme aucun objet. La traduction française explicite seulement l’ellipse sur le plan grammatical, sans en réduire la portée à une interprétation morale ou matérielle particulière.
- issue: Incertitude textuelle liée à la forme inhabituelle συναγίοχας
  choice: Rendre le sens probable par « amassé » et signaler l’incertitude en note.
  alternative: Traduire par « rassemblé » ou « mis de côté », ou conserver une formulation obscure.
  rationale: La leçon transmise n’est pas une forme grecque ordinaire. Une traduction intelligible accompagnée d’une note rend honnêtement à la fois le sens probable et l’incertitude du témoin.
translation_notes:
  register: Français international moderne, proverbial et digne. Le tutoiement singulier correspond aux formes grecques de deuxième personne et maintient l’adresse directe. Le parallélisme « dans ta jeunesse / dans ta vieillesse » est conservé.
