  text: The crown of the aged is much experience[a], and their boast is the fear of the Lord.
translation:
  language: fr
  text: La couronne des personnes âgées est une grande expérience[a], et leur sujet de fierté est la crainte du Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une vaste expérience » ou « une expérience étendue ». Le grec souligne l’ampleur de l’expérience acquise au fil du temps.
    reason: lexical_alternative
lexical_decisions:
- source_word: στέφανος
  choice: couronne
  rationale: Le nom désigne une couronne ou une guirlande honorifique. « Couronne » conserve clairement l’image d’honneur en français moderne.
- source_word: γερόντων
  choice: des personnes âgées
  rationale: Le génitif pluriel désigne ici les gens âgés, sans qu’il soit nécessaire d’y voir la fonction institutionnelle d’« anciens ».
- source_word: πολυπειρία
  choice: une vaste expérience
  rationale: Le composé exprime une expérience étendue, acquise au fil du temps. « Vaste expérience » restitue naturellement la force de πολυ-.
- source_word: καύχημα
  choice: fierté
  rationale: Le terme peut désigner ce dont on se glorifie ou tire fierté. « Fierté » est naturel ici et évite la connotation souvent négative de « vantardise », tout en gardant l’idée d’un motif de gloire.
- source_word: φόβος Κυρίου
  choice: la crainte du Seigneur
  rationale: Cette formule sapientielle désigne la crainte révérencielle envers Dieu. « Crainte » est maintenu afin de ne pas atténuer la tension du grec, et Κυρίου est rendu par « du Seigneur ».
theological_decisions:
- issue: Traduction de Κυρίου dans la formule sapientielle φόβος Κυρίου
  choice: du Seigneur
  alternative: de l’Éternel
  rationale: Le témoin source grec porte Κυρίου. « Seigneur » traduit directement ce terme, sans reconstruire dans le texte français le nom divin hébreu sous-jacent.
- issue: Valeur de φόβος dans la relation à Dieu
  choice: crainte
  alternative: respect révérenciel
  rationale: « Crainte » préserve le langage et la tension théologique du grec ; le remplacer par « respect » en réduirait la portée sémantique.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure présentative « c’est » rend explicitement et avec fluidité les deux propositions nominales parallèles du grec. « Personnes âgées » évite à la fois le masculin restrictif de « vieillards » et le sens institutionnel possible d’« anciens ».
