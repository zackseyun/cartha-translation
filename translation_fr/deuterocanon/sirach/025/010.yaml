  text: Blessed is the one who has found wisdom[b][a], and the one who speaks in the ears of those who hear.
translation:
  language: fr
  text: Heureux celui qui a trouvé le discernement, et celui qui s’adresse à des auditeurs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « celui qui expose/raconte dans les oreilles de ceux qui entendent ». Le participe grec peut désigner le fait de raconter, d’exposer ou d’expliquer. L’expression « dans les oreilles » est un idiome qui évoque une parole adressée à des personnes qui écoutent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: Heureux
  rationale: Formule naturelle des béatitudes et des sentences de sagesse en français; elle exprime une condition enviable sans imposer l’idée explicite d’une bénédiction prononcée.
- source_word: εὗρε
  choice: a trouvé
  rationale: Le passé composé rend naturellement l’aoriste et souligne l’acquisition désormais accomplie.
- source_word: φρόνησιν
  choice: le discernement
  rationale: φρόνησις désigne ici l’intelligence pratique, le jugement avisé ou la prudence; « discernement » conserve cette nuance sans se confondre entièrement avec la sagesse au sens large.
- source_word: διηγούμενος
  choice: celui qui expose son propos
  rationale: Le participe évoque le fait de raconter, de présenter ou d’exposer quelque chose de façon suivie. Cette formulation française reste assez large tout en étant plus précise que le simple verbe « parler »; « son propos » explicite seulement l’objet implicite en grec.
- source_word: εἰς ὦτα
  choice: aux oreilles
  rationale: Cette expression conserve l’image concrète et la direction marquée par εἰς, tout en restant compréhensible en français.
- source_word: ἀκουόντων
  choice: de ceux qui écoutent
  rationale: « Écoutent » rend le participe substantivé et laisse ouverte la question du degré d’attention ou de réceptivité des auditeurs.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La structure parallèle de la sentence est conservée. L’expression concrète « aux oreilles » maintient l’image grecque, tandis que la note signale son caractère idiomatique et l’étendue de sens du participe.
