  text: Any wound[a], but not the wound of those who hate; and any vengeance[b], but not the vengeance of enemies.
translation:
  language: fr
  text: Toute atteinte[a], mais non l’atteinte de ceux qui haïssent ; toute vengeance[b], mais non la vengeance des ennemis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Toute blessure » ou « Toute affliction ». Le nom grec peut désigner plus largement un mal, une attaque ou une souffrance infligée.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec formule une maxime elliptique, littéralement : « toute atteinte… mais non l’atteinte de ceux qui haïssent ; toute vengeance… mais non la vengeance des ennemis ». Le sens implicite est que cette hostilité est plus pénible que les autres torts.'
    reason: cultural_note
lexical_decisions:
- source_word: πᾶσαν
  choice: n’importe quelle
  rationale: 'L’adjectif est pris dans un sens distributif au sein d’une comparaison implicite : mieux vaut subir toute autre forme d’atteinte ou de vengeance que celle qui est ensuite désignée. Cette tournure restitue naturellement en français la force proverbiale de l’expression.'
- source_word: ἐπαγωγήν
  choice: atteinte
  rationale: Le nom peut désigner ce qui est amené ou infligé à quelqu’un, notamment une attaque, un dommage ou une affliction. « Atteinte » conserve cette amplitude, physique ou figurée, sans imposer le sens plus étroit de « blessure ».
- source_word: μισούντων
  choice: ceux qui haïssent
  rationale: Le participe substantivé garde un sens actif. Cette formulation est claire et naturelle, tout en évitant de préciser dans le texte l’objet de leur haine, que le grec laisse implicite.
- source_word: ἐκδίκησιν
  choice: vengeance
  rationale: Le terme évoque une rétribution exercée en retour. « Vengeance » convient au parallélisme solennel et proverbial du verset.
- source_word: ἐχθρῶν
  choice: ennemis
  rationale: Ce terme français courant rend directement le génitif pluriel et préserve l’idée d’une hostilité relationnelle.
theological_decisions:
- issue: Interprétation de la maxime comparative elliptique
  choice: Conserver la construction brève « n’importe quelle… mais pas celle de… », qui implique qu’on supporterait toute autre atteinte ou vengeance plutôt que celle de personnes hostiles.
  alternative: 'Développer la maxime sous forme d’exclamation : « Il n’est pas d’atteinte comparable à celle de ceux qui haïssent, ni de vengeance comparable à celle des ennemis. »'
  rationale: 'Le grec ne comporte pas de verbe et formule une opposition elliptique : πᾶσαν… καὶ μὴ…. La traduction retenue préserve cette concision et la tension proverbiale sans ajouter une comparaison explicitement formulée.'
- issue: Portée de ἐπαγωγή
  choice: Employer « atteinte », terme pouvant couvrir une blessure, un dommage, une attaque ou une affliction.
  alternative: Employer « blessure », plus concret, ou « affliction », plus général.
  rationale: Le contexte ne permet pas de fixer avec certitude la nature du mal infligé. Le choix principal conserve donc une ambiguïté réelle, tandis que la note signale les principales possibilités.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « n’importe quelle » et la structure sans verbe préservent le rythme sentencieux de l’original. « Ceux qui haïssent » reste volontairement général, et « atteinte » maintient l’ambiguïté lexicale du grec.
