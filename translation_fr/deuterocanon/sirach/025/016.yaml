  text: I would rather live with a lion and a dragon than dwell with a wicked woman[a].
translation:
  language: fr
  text: J’aimerais mieux habiter avec un lion et un dragon que demeurer avec une femme méchante[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec une épouse méchante ». Le grec γυνή peut désigner une femme ou une épouse selon le contexte.'
    reason: 'Alternative lexicale : γυνή peut signifier « femme » ou, dans un contexte domestique, « épouse ». La note préserve cette ambiguïté sans la résoudre dans le texte principal.'
lexical_decisions:
- source_word: συνοικῆσαι
  choice: habiter avec
  rationale: L’infinitif de συνοικέω désigne le fait de partager une habitation. « Habiter avec » est naturel en français et conserve le cadre domestique sans connotation sexuelle ajoutée.
- source_word: λέοντι
  choice: un lion
  rationale: Le datif singulier de λέων est rendu directement, en gardant le singulier vivant de la comparaison proverbiale.
- source_word: δράκοντι
  choice: un dragon
  rationale: δράκων peut désigner un dragon ou un grand serpent. « Dragon » conserve l’image forte et la correspondance lexicale traditionnelle sans la réduire à un serpent ordinaire.
- source_word: εὐδόκησα
  choice: J’aimerais mieux
  rationale: Dans la construction comparative avec ἤ, εὐδοκέω exprime ici une préférence. « J’aimerais mieux… que… » rend cette valeur de façon idiomatique tout en conservant la nuance volitive du verbe.
- source_word: ἐνοικῆσαι
  choice: demeurer
  rationale: ἐνοικέω signifie habiter ou résider. « Demeurer » maintient le sens locatif et apporte une variation digne après « habiter ».
- source_word: μετὰ γυναικὸς πονηρᾶς
  choice: avec une femme mauvaise
  rationale: γυνή peut signifier « femme » au sens général ou « épouse » selon le contexte. Sans possessif explicite, « femme » préserve l’ambiguïté lexicale; πονηρά porte ici un jugement moral, que « mauvaise » exprime naturellement en français.
theological_decisions:
- issue: Faut-il rendre γυνή par « femme » ou par « épouse » dans ce proverbe?
  choice: femme
  alternative: épouse
  rationale: Le grec permet les deux sens. Le texte ne comporte pas de possessif explicite, tandis que les verbes d’habitation rendent le sens « épouse » contextuellement plausible. Le texte principal garde donc « femme », et la note signale l’autre lecture sans trancher silencieusement.
translation_notes:
  register: Français international moderne, naturel et digne. La structure comparative proverbiale et les images au singulier sont conservées. « J’aimerais mieux » est plus actuel que « je préférerais » dans cette tournure et moins archaïque que « il me plairait davantage ».
