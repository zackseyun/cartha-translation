translation:
  language: fr
  text: 'En trois choses je suis devenue belle[a], et je me suis levée[b], belle devant le Seigneur et les humains :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « j’ai été rendue belle » ; le passif grec peut évoquer soit l’accès à un état, soit une action exercée sur la locutrice.
    reason: lexical_alternative
  - marker: b
    text: Ou « je me suis dressée » ou « je me suis tenue là » ; le grec conserve l’image concrète du fait de se lever ou de se tenir debout, et non simplement celle de paraître.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τρισὶν
  choice: En trois choses
  rationale: La préposition ἐν avec le datif indique ici le domaine ou les réalités dans lesquelles la locutrice manifeste sa beauté, tout en introduisant naturellement l’énumération qui suit.
- source_word: ὡραιώθην
  choice: je suis devenue belle
  rationale: L’aoriste passif peut exprimer l’accès à un état (« devenir belle ») ou l’action subie (« être rendue belle »). Le choix principal est naturel en français et la note conserve l’autre lecture.
- source_word: ἀνέστην
  choice: je me suis dressée
  rationale: Le verbe garde l’image concrète de se lever ou de se tenir debout et évite de l’aplatir en un simple « j’ai paru ».
- source_word: ὡραία
  choice: belle
  rationale: L’adjectif reprend explicitement le motif de la beauté présent dans ὡραιώθην. « Belle » est direct, actuel et cohérent avec le féminin grammatical de la locutrice.
- source_word: ἔναντι Κυρίου καὶ ἀνθρώπων
  choice: devant le Seigneur et devant les humains
  rationale: « Devant » rend la présence ou le regard exprimés par ἔναντι. La répétition française clarifie les deux termes coordonnés, et « les humains » exprime ici l’humanité en général sans limiter ἀνθρώπων aux hommes de sexe masculin.
theological_decisions:
- issue: Traduction de Κυρίου
  choice: le Seigneur
  alternative: l’Éternel
  rationale: Le témoin source est grec et porte κύριος, non le nom divin hébreu directement attesté dans ce verset. « Le Seigneur » traduit donc le terme sans reconstruire une forme absente.
- issue: Référent et genre de la locutrice
  choice: 'accords au féminin : « devenue », « dressée », « belle »'
  alternative: reformulation évitant de marquer le genre
  rationale: L’adjectif grec ὡραία est explicitement féminin. Le français doit préserver cet indice grammatical plutôt que le neutraliser.
- issue: Traduction générique de ἀνθρώπων
  choice: les humains
  alternative: les hommes
  rationale: Le pluriel désigne les êtres humains en général dans l’opposition entre le Seigneur et l’humanité. « Les humains » conserve cette portée sans suggérer un groupe exclusivement masculin.
translation_notes:
  register: Français international moderne, digne et accessible. La construction garde le parallélisme et l’image concrète du grec. Les accords féminins rendent ὡραία, tandis que les notes préservent les ambiguïtés aspectuelles et lexicales de ὡραιώθην et ἀνέστην.
