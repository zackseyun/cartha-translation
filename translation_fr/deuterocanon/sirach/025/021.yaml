  text: Do not fall for a woman's beauty, and do not desire a woman for what she has.
translation:
  language: fr
  text: Ne succombe pas à la beauté d’une femme, et ne désire pas une femme pour ce qu’elle possède.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle grec porte simplement : « et ne désire pas une femme. » Le texte hébreu précise qu’il s’agit de la désirer à cause de ce qu’elle possède.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּפּוֹל בְּיֹפִי
  choice: Ne succombe pas à la beauté
  rationale: Le verbe hébreu signifie littéralement « tomber ». Avec « beauté », il exprime ici le fait de se laisser captiver ou dominer. « Succomber à » conserve la métaphore tout en étant naturel en français.
- source_word: אִשָּׁה
  choice: une femme
  rationale: Le mot peut désigner une femme ou une épouse. En l’absence de contexte conjugal explicite, le sens général « une femme » convient mieux.
- source_word: וְעַל יֵש לָהּ
  choice: pour ce qu’elle possède
  rationale: La tournure hébraïque, concise, indique que le désir est motivé par ce que la femme a, notamment ses biens ou ses avantages. Cette formulation reste générale sans réduire le sens à la seule richesse.
- source_word: לֹא תַּחְמוֹד
  choice: ne désire pas
  rationale: Le verbe peut signifier « désirer » ou « convoiter ». « Désirer » préserve ici l’étendue du sens, tandis que la proposition suivante précise le caractère intéressé de ce désir.
theological_decisions:
- issue: Choix entre la formulation du témoin hébreu et celle, plus courte, du parallèle grec
  choice: 'Suivre le texte hébreu : « ne désire pas une femme pour ce qu’elle possède »'
  alternative: « ne désire pas une femme »
  rationale: Le témoin hébreu, de haute confiance, précise le motif du désir. Le grec offre une formulation plus générale. La traduction principale suit donc l’hébreu et signale la variante grecque en note.
translation_notes:
  register: Français moderne, clair et digne. « Succomber à la beauté » garde l’image de la chute sans produire une tournure artificielle. La répétition de « une femme » suit le sens du texte tel qu’il est compris ici et rend la seconde proposition immédiatement intelligible.
