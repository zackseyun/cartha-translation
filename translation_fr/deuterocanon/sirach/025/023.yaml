  text: 'Slack hands and failing knees: a wife who does not bless her husband[a].'
translation:
  language: fr
  text: 'Des mains sans force et des genoux qui fléchissent : telle est la femme qui ne rend pas son mari heureux[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui ne dit pas son mari heureux » ou « qui ne le tient pas pour heureux ». Le verbe hébreu peut aussi évoquer le fait de rendre quelqu’un heureux ou fortuné; le grec porte : « qui ne déclare pas son mari heureux ».'
    reason: Conserver l’ambiguïté lexicale de לֹא תְאַשֵּׁר entre rendre heureux et déclarer ou tenir pour heureux.
lexical_decisions:
- source_word: רִפְיוֹן יָדַיִם
  choice: des mains sans force
  rationale: רִפְיוֹן exprime le relâchement ou la faiblesse. « Sans force » restitue naturellement en français l’image concrète de mains devenues incapables d’agir, également confirmée par le grec χεῖρες παρειμέναι.
- source_word: וְכִשְׁלוֹן בִּרְכַּיִם
  choice: et des genoux qui fléchissent
  rationale: כִשְׁלוֹן vient de l’idée de trébucher ou de défaillir. Avec « genoux », la tournure verbale française évoque clairement des jambes qui se dérobent sans abandonner l’image corporelle.
- source_word: אִשָּׁה
  choice: la femme
  rationale: Le nom peut signifier « femme » ou « épouse ». La mention de « son mari » établit ici le cadre conjugal; « la femme » reste idiomatique dans la construction proverbiale française.
- source_word: לֹא תְאַשֵּׁר
  choice: qui ne rend pas … heureux
  rationale: Le piel de אשר peut exprimer le fait de déclarer, tenir pour heureux ou rendre heureux. Cette formulation française naturelle garde ici la nuance de résultat sans réduire le verbe au seul acte verbal de féliciter ou de proclamer bienheureux.
- source_word: בַּעֲלָהּ
  choice: son mari
  rationale: Dans ce contexte conjugal, בַּעַל désigne sans ambiguïté le mari; « maître » introduirait une nuance étrangère au propos immédiat.
theological_decisions:
- issue: Rapport entre le texte hébreu conservé et le parallèle grec plus développé
  choice: Traduire en priorité la ligne hébraïque et employer le grec seulement pour confirmer la structure appositionnelle et les images corporelles.
  alternative: Importer dans le verset les éléments supplémentaires du grec sur le cœur abattu, le visage sombre, la blessure du cœur et la femme mauvaise.
  rationale: Le témoin hébreu est donné avec une confiance élevée et doit gouverner la traduction. Les mots supplémentaires du grec témoignent d’une forme plus longue de la tradition, mais ne doivent pas être ajoutés à cette ligne hébraïque.
- issue: Sens de לֹא תְאַשֵּׁר
  choice: « qui ne rend pas son mari heureux », avec une note signalant la nuance possible de déclaration ou d’estimation.
  alternative: « qui ne bénit pas son mari » ou « qui ne dit pas son mari heureux ».
  rationale: Le verbe garde une tension entre effet produit et reconnaissance verbale du bonheur. Le texte principal privilégie un français clair dans le contexte de ce proverbe, tandis que la note conserve l’autre lecture, soutenue notamment par le grec οὐ μακαρίζει.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Telle est » explicite naturellement l’apposition elliptique de l’hébreu sans en modifier le sens. Les deux images corporelles sont conservées dans un parallélisme fluide.
