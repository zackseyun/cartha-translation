translation:
  language: fr
  text: Car c’est à cause d’elle qu’il y a déshonneur et honte, quand une femme subvient aux besoins de son mari[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « lorsqu’une femme pourvoit aux besoins de son mari ». Le verbe hébreu מְכַלְכֶּלֶת, comme le grec ἐπιχορηγῇ, évoque le fait de fournir les moyens matériels nécessaires ou de faire vivre quelqu’un.'
    reason: Alternative lexicale précisant le sens matériel du verbe.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication liée au contexte précédent, sans alourdir la phrase.
- source_word: בַעֲדָהּ
  choice: à cause d’elle
  rationale: Exprime ici la cause ou l’occasion du déshonneur, conformément au sens naturel de la préposition avec suffixe.
- source_word: חֶרְפָּה וּבֹשֶׁת
  choice: déshonneur et honte
  rationale: Conserve les deux termes distincts et le registre social de l’honneur et de la honte.
- source_word: אִשָּׁה
  choice: une femme
  rationale: « Femme » reste naturel en français dans une phrase où « son mari » établit sans ambiguïté la relation conjugale.
- source_word: מְכַלְכֶּלֶת
  choice: entretient
  rationale: Le verbe désigne le fait de pourvoir matériellement aux besoins de quelqu’un ou de le faire vivre; « entretient » rend ce sens de façon concise.
- source_word: אֶת בַּעֲלָהּ
  choice: son mari
  rationale: Dans ce contexte conjugal, בַּעַל signifie clairement « mari ».
theological_decisions:
- issue: Faut-il expliciter ou atténuer le jugement social patriarcal du texte ancien ?
  choice: Conserver directement l’association entre soutien matériel, déshonneur et honte.
  alternative: Ajouter une réserve historique ou adoucir le jugement.
  rationale: La traduction doit préserver la rhétorique et la tension du texte sans l’approuver explicitement, l’intensifier ni l’éditorialiser.
- issue: Lien syntaxique entre les deux propositions
  choice: quand une femme entretient son mari
  alternative: une femme qui entretient son mari
  rationale: « Quand » exprime naturellement en français la circonstance dans laquelle surviennent le déshonneur et la honte, tout en évitant de résoudre davantage que nécessaire la relation logique.
translation_notes:
  register: Français moderne, digne et accessible. La formulation maintient sans commentaire ajouté le jugement social abrupt de l’énoncé ancien. Le marqueur de note [a] figure dans le texte principal.
