  source_fidelity: 'Le texte principal suit correctement le témoin hébreu : אַשְׁרֵי introduit une béatitude, נִכְשַׁל est conservé comme une image de trébuchement appliquée à la parole, et la seconde proposition rend la subordination à une personne jugée plus méprisable. La note grecque doit toutefois éviter d’ajouter « assez longtemps », absent de ζῶν καὶ βλέπων (« vivant et voyant »).'
