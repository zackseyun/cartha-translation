base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/008.yaml
  text: Happy is the man who has not stumbled with his tongue[a], and has not served one more contemptible than himself.
translation:
  language: fr
  text: Heureux celui qui n’a pas trébuché dans ses paroles[a] et qui n’a pas servi quelqu’un de plus méprisable que lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte à la place : « un homme qui se réjouit de ses enfants, qui vit et voit la chute de ses ennemis ». Le témoin hébreu diffère ici considérablement du grec.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heureux celui qui
  rationale: La formule hébraïque de béatitude présente une condition enviable. Cette tournure est naturelle en français et n’ajoute pas une idée explicite de bénédiction divine.
- source_word: נִכְשַׁל
  choice: n’a pas trébuché
  rationale: Le verbe évoque littéralement le fait de trébucher. Conserver cette image laisse entendre, sans la surinterpréter, la faute ou le faux pas commis en parlant.
- source_word: בִּלְשׁוֹנוֹ
  choice: par sa langue
  rationale: Cette formulation concrète conserve l’image hébraïque et indique que la langue est le moyen du faux pas; « dans ses paroles » serait plus explicatif.
- source_word: עֹבֵד
  choice: n’a pas servi
  rationale: « Servir » rend largement la subordination sociale sans imposer l’idée plus précise d’esclavage ni le cadre moderne d’un emploi.
- source_word: נִקְלֶה
  choice: plus méprisable
  rationale: L’adjectif qualifie une personne tenue pour vile, déshonorée ou de peu d’estime. Le comparatif français est requis par מִמֶּנּוּ.
- source_word: מִמֶּנּוּ
  choice: que lui
  rationale: Après « plus méprisable », cette expression rend naturellement la comparaison avec le sujet en français.
theological_decisions:
- issue: Choix entre le témoin hébreu et la lecture grecque profondément divergente
  choice: Le texte principal traduit le témoin hébreu conservé.
  alternative: 'Le grec porte : « un homme qui se réjouit de ses enfants et qui vit assez longtemps pour voir la chute de ses ennemis ».'
  rationale: Puisque l’hébreu de ce passage est attesté avec une confiance élevée, il sert de texte principal. La divergence substantielle de la tradition grecque est néanmoins signalée afin de préserver honnêtement l’état des témoins sans les harmoniser.
translation_notes:
  register: Français international moderne, sobre et proverbial. La métaphore du trébuchement et l’image concrète de la langue sont conservées; le masculin singulier générique de la maxime hébraïque est rendu par « celui qui ».
