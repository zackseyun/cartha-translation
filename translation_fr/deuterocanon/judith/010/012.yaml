  verdict: revise
  source_fidelity: Le texte rend fidèlement l’arrestation, les deux questions de provenance et de destination, l’auto-identification de Judith, la fuite, le passif imminent (« vont vous être livrés ») et l’image de la dévoration. Toutefois, « À quel peuple appartiens-tu ? » restreint la question grecque Τίνων εἶ, littéralement « De qui es-tu ? / À qui es-tu ? », à l’ethnicité, alors qu’elle peut également viser l’allégeance politique. « De qui es-tu ? », soutenu par une note, conserve cette ouverture.
  naturalness: Le français est clair, moderne et d’un registre narratif approprié. « De qui es-tu ? » est légèrement plus littéral et soutenu que la formulation initiale, mais demeure naturel dans ce dialogue antique et évite une explicitation interprétative. « Je m’enfuis loin d’eux » est idiomatique et acceptable pour « je fuis de devant eux ».
  terminology: « Fille des Hébreux » préserve volontairement l’expression familiale et ethnique du grec; la note fournit l’équivalent français plus idiomatique. « Pour être dévorés » restitue avec justesse la force de εἰς κατάβρωμα sans introduire d’agent divin dans le passif.
