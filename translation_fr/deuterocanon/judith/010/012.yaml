base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/012.yaml
  text: And they seized her and asked her[a], “Who are you, and where are you coming from, and where are you going?” And she said, “I am a daughter of the Hebrews, and I am fleeing from before them[c][b], because they are about to be given over to you for consumption.”
translation:
  language: fr
  text: 'Ils se saisirent d’elle et lui demandèrent : « De qui es-tu[a] ? D’où viens-tu et où vas-tu ? » Elle répondit : « Je suis une fille des Hébreux[b] et je m’enfuis loin d’eux, car ils vont vous être livrés pour être dévorés[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « De qui es-tu ? » La question peut porter sur l’appartenance ethnique ou politique.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Je suis une femme hébraïque. » Le grec dit littéralement : « Je suis une fille des Hébreux. »'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « pour servir de nourriture ». L’expression grecque évoque vivement le fait d’être dévoré.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέλαβον
  choice: se saisirent d’elle
  rationale: Le verbe indique ici qu’on met physiquement la main sur Judith. « Se saisirent d’elle » conserve la brusquerie de l’action et convient au contexte militaire.
- source_word: Τίνων εἶ
  choice: À quel peuple appartiens-tu ?
  rationale: La tournure grecque signifie littéralement « De qui es-tu ? ». Dans ce contexte, elle interroge vraisemblablement l’appartenance ethnique ou politique ; la formulation française explicite ce sens probable sans la réduire à une simple question d’identité personnelle.
- source_word: πόθεν ἔρχῃ
  choice: D’où viens-tu
  rationale: Formulation française naturelle qui conserve la valeur directionnelle de πόθεν.
- source_word: ποῦ πορεύῃ
  choice: où vas-tu
  rationale: Traduction directe, naturelle et digne du verbe πορεύομαι dans ce contexte de déplacement.
- source_word: Θυγάτηρ εἰμὶ τῶν Ἑβραίων
  choice: Je suis une fille des Hébreux
  rationale: Cette traduction préserve l’image familiale et l’identification ethnique exprimées littéralement par θυγάτηρ, sans les aplanir en « femme hébraïque ».
- source_word: ἀποδιδράσκω ἀπὸ προσώπου αὐτῶν
  choice: je m’enfuis loin d’eux
  rationale: ἀποδιδράσκω exprime la fuite ou l’évasion. L’idiome « loin d’eux » rend naturellement ἀπὸ προσώπου αὐτῶν, littéralement « de devant leur face », sans produire un français artificiel.
- source_word: μέλλουσιν δόσθαι
  choice: ils vont vous être livrés
  rationale: La formulation garde le passif de δόσθαι ainsi que l’imminence exprimée par μέλλουσιν.
- source_word: εἰς κατάβρωμα
  choice: pour être dévorés
  rationale: κατάβρωμα désigne ce qui est mangé ou dévoré. Cette formulation conserve l’image vive et menaçante du grec tout en restant idiomatique en français.
theological_decisions:
- issue: Identification ethnique de Judith
  choice: Je suis une fille des Hébreux
  alternative: Je suis une femme hébraïque
  rationale: Le grec emploie explicitement « fille » avec un génitif désignant le peuple. La traduction conserve cette expression familiale et ethnique, sans ajouter de précision doctrinale.
- issue: Agent implicite dans « ils vont vous être livrés »
  choice: Maintien du passif sans nommer l’agent
  alternative: Dieu va vous les livrer
  rationale: Le texte grec ne précise pas qui les livrera. Nommer Dieu résoudrait indûment une ambiguïté grammaticale et théologique authentique.
translation_notes:
  register: Français international moderne, naturel et digne. Les interrogations sont resserrées pour éviter une répétition lourde de « et ». L’idiome grec « loin de leur face » est rendu de façon intelligible, tandis que l’image familiale « fille des Hébreux », le passif sans agent et la violence de « dévorés » sont préservés.
