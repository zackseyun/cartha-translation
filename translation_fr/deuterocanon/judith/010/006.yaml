  yaml_path: translation/deuterocanon/judith/010/006.yaml
  text: And they went out to the gate of the city of Bethulia[a], and found Uzziah standing there, and Chabris and Charmis, the elders of the city.
translation:
  language: fr
  text: Elles sortirent jusqu’à la porte de la ville de Béthulie et trouvèrent Ozias qui se tenait là[a], ainsi que Chabris et Charmis, les anciens de la ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui se tenait sur elle » ou « auprès d’elle », le pronom renvoyant à la porte.'
    reason: La formulation grecque ἐπʼ αὐτῇ peut être rendue plus littéralement, mais « là » exprime plus naturellement en français la position d’Ozias à la porte.
lexical_decisions:
- source_word: ἐξῆλθον
  choice: Elles sortirent
  rationale: L’aoriste de ἐξέρχομαι exprime un mouvement vers l’extérieur. Le féminin pluriel, fourni par le contexte narratif, renvoie à Judith et à sa servante.
- source_word: ἐπὶ τὴν πύλην
  choice: jusqu’à la porte
  rationale: Après un verbe de mouvement, ἐπί avec l’accusatif indique ici la direction et le point atteint. « Jusqu’à la porte » rend naturellement les deux nuances.
- source_word: τῆς πόλεως Βαιτυλουά
  choice: de la ville de Béthulie
  rationale: πόλις désigne la ville, et « Béthulie » est la forme française biblique usuelle du nom grec Βαιτυλουά.
- source_word: εὗρον
  choice: trouvèrent
  rationale: Cette traduction conserve le sens ordinaire de εὑρίσκω tout en convenant à la rencontre décrite.
- source_word: ἐφεστῶτα ἐπʼ αὐτῇ
  choice: qui se tenait là
  rationale: Le participe parfait décrit Ozias présent et debout à la porte; « se tenait là » est idiomatique en français et le lieu est clairement repris du contexte.
- source_word: Ὀζίαν
  choice: Ozias
  rationale: « Ozias » est la forme française biblique traditionnelle et reconnaissable de ce nom.
- source_word: τοὺς πρεσβυτέρους τῆς πόλεως
  choice: les anciens de la ville
  rationale: πρεσβύτεροι désigne ici les anciens exerçant une fonction de direction civique; la formulation conserve cette désignation sociale.
- source_word: Χάβρειν καὶ Χάρμειν
  choice: Chabris et Charmis
  rationale: Ces formes françaises translittèrent les noms grecs au nominatif, en retirant les marques flexionnelles de l’accusatif.
