  text: And she gave her maid a skin of wine and a flask of oil[a], and she filled a bag with barley meal and cakes of pressed figs and clean loaves; then she wrapped up all her vessels and placed them on her.
translation:
  language: fr
  text: Elle donna à sa servante une outre de vin et une petite cruche d’huile. Elle remplit un sac de farine d’orge, de gâteaux de figues pressées et de pains purs[a]. Puis elle enveloppa tous ses récipients et les posa sur sa servante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pains rituellement purs ». Le grec peut désigner des pains préparés conformément aux règles de pureté.
    reason: Préciser la possible portée alimentaire ou rituelle de καθαρῶν sans la rendre obligatoire dans le texte principal.
lexical_decisions:
- source_word: ἅβρᾳ
  choice: à sa servante
  rationale: Le terme désigne ici l’assistante de Judith. « Servante » convient au cadre social sans préciser davantage son statut.
- source_word: ἀσκοπυτίνην οἶνον
  choice: une outre de vin
  rationale: Le composé désigne un récipient en peau; cette formulation française exprime naturellement le contenant et son contenu.
- source_word: καψάκην ἐλαίου
  choice: une petite cruche d’huile
  rationale: Le nom désigne un petit récipient portatif. « Petite cruche » reste concret et courant.
- source_word: πῆραν
  choice: un sac
  rationale: Il s’agit d’un sac de voyage ou destiné aux provisions; « sac » est clair et n’ajoute aucune précision absente du grec.
- source_word: ἀλφίτων
  choice: farine d’orge
  rationale: Le pluriel renvoie à une préparation céréalière, traditionnellement de l’orge, sous forme de farine ou gruau. « Farine d’orge » est intelligible et correspond ici à une provision.
- source_word: παλάθης
  choice: gâteaux de figues pressées
  rationale: Le mot désigne une masse ou un gâteau de figues comprimées; la traduction explicite la préparation.
- source_word: ἄρτων καθαρῶν
  choice: pains purs
  rationale: καθαρός peut évoquer la pureté, notamment alimentaire ou rituelle. « Purs » préserve cette nuance mieux que « propres », qui suggérerait surtout l’hygiène, sans la rendre explicitement rituelle.
- source_word: περιεδίπλωσε
  choice: elle enveloppa
  rationale: Le verbe exprime l’action de plier ou d’envelopper autour; « enveloppa » rend directement le geste.
- source_word: τὰ ἄγγη αὐτῆς
  choice: tous ses récipients
  rationale: ἄγγη est un terme générique pour des contenants. « Récipients » est plus naturel en français moderne que « vases » dans ce contexte.
- source_word: ἐπέθηκε αὐτῇ
  choice: les chargea sur sa servante
  rationale: Le pronom renvoie naturellement à la servante. « Chargea sur » exprime qu’elle lui fit porter les objets sans ajouter « dos » ou « épaules », absents du grec.
theological_decisions:
- issue: Nuance de pureté dans ἄρτων καθαρῶν
  choice: pains purs
  alternative: pains rituellement purs; pains propres
  rationale: Le contexte peut impliquer une alimentation conforme aux exigences de pureté, mais le grec ne précise pas explicitement « rituellement ». Le texte principal conserve donc la portée ouverte de « purs », avec une note explicative.
translation_notes:
  register: Français international moderne, narratif et digne. Les objets sont nommés par des termes concrets et courants. La répétition de « sa servante » à la fin clarifie le référent du pronom grec et évite l’ambiguïté que produirait « sur elle » en français.
