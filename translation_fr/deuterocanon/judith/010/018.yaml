revisions:
- from: Il y eut alors un mouvement de foule dans le camp[a], car son arrivée avait été annoncée à grands cris parmi les tentes. Les hommes vinrent se rassembler autour d’elle tandis qu’elle se tenait devant la tente d’Holopherne, jusqu’à ce qu’on informe celui-ci de sa présence.
  to: Il y eut un mouvement de foule dans le camp[a], car son arrivée fut annoncée à grands cris dans les tentes. Ils vinrent l’entourer alors qu’elle se tenait à l’extérieur de la tente d’Holopherne, jusqu’à ce qu’ils informent Holopherne à son sujet.
  rationale: La révision rétablit la valeur explicite de « à l’extérieur », évite l’ajout de « Les hommes », aligne le temps verbal sur l’aoriste grec et conserve le sujet pluriel ainsi que le caractère général de l’information donnée à Holopherne. La note maintient l’ambiguïté de παρουσία sans imposer une interprétation.
