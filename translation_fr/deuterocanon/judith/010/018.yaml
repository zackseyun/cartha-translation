  text: And there was a rush in the camp[a], for her arrival was reported through the tents; and they came and gathered around her as she stood outside the tent of Holofernes, until they announced her to him.
translation:
  language: fr
  text: Il y eut un mouvement de foule dans le camp[a], car son arrivée fut annoncée à grands cris dans les tentes. Ils vinrent l’entourer alors qu’elle se tenait à l’extérieur de la tente d’Holopherne, jusqu’à ce qu’ils informent Holopherne à son sujet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « car sa présence fut annoncée à grands cris dans les tentes ». Le grec peut désigner aussi bien sa présence que, dans ce contexte, son arrivée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο συνδρομή
  choice: Il y eut alors un mouvement de foule
  rationale: συνδρομή évoque le fait d’accourir et de se rassembler. « Mouvement de foule » conserve cette dimension collective et soudaine sans suggérer nécessairement la panique.
- source_word: παρεμβολή
  choice: camp
  rationale: Dans ce récit militaire, παρεμβολή désigne naturellement le campement de l’armée ; « camp » est clair et courant.
- source_word: διεβοήθη
  choice: avait été annoncée à grands cris parmi
  rationale: Le passif de διαβοάω indique une nouvelle diffusée oralement et bruyamment. Cette formulation conserve la composante vocale du verbe grec.
- source_word: τὰ σκηνώματα
  choice: les tentes
  rationale: σκηνώματα désigne ici les habitations de toile du camp ; « les tentes » est direct et naturel.
- source_word: ἡ παρουσία αὐτῆς
  choice: son arrivée
  rationale: παρουσία peut désigner la présence ou la venue. Dans ce contexte narratif, « arrivée » exprime naturellement l’événement qui attire la foule, tout en signalant l’autre possibilité en note.
- source_word: ἐκύκλουν αὐτήν
  choice: se rassembler autour d’elle
  rationale: Le verbe signifie littéralement qu’ils l’entouraient. La formulation choisie préserve l’image sans introduire une nuance d’hostilité absente du contexte.
- source_word: ὡς ἱστήκει
  choice: tandis qu’elle se tenait
  rationale: La forme décrit l’état ou la position de Judith à ce moment-là ; « se tenait » convient au registre narratif.
- source_word: ἔξω τῆς σκηνῆς Ὀλοφέρνου
  choice: devant la tente d’Holopherne
  rationale: ἔξω signifie qu’elle était à l’extérieur de la tente. En français narratif, « devant la tente » rend naturellement cette position sans laisser entendre qu’elle se trouvait dedans.
- source_word: προσήγγειλαν αὐτῷ περὶ αὐτῆς
  choice: qu’on informe celui-ci de sa présence
  rationale: L’expression signifie qu’ils firent parvenir à Holopherne une information à son sujet. « Informer celui-ci de sa présence » est idiomatique et explicite le référent sans ajouter de contenu substantiel.
