review_pass:
  verdict: revise
  source_fidelity: La traduction rend bien le rassemblement dans le camp, la diffusion vocale de la nouvelle, la position de Judith et l’information transmise à Holopherne. Toutefois, « devant la tente » est moins précis que ἔξω (« à l’extérieur de »), « Les hommes » ajoute un référent explicite absent du grec, et le plus-que-parfait « avait été annoncée » ne correspond pas au simple événement exprimé par l’aoriste passif διεβοήθη.
  naturalness: Le français est globalement naturel et de registre narratif moderne. Les ajustements proposés améliorent la précision sans alourdir la phrase. « Informer Holopherne à son sujet » rend naturellement προσήγγειλαν αὐτῷ περὶ αὐτῆς sans transformer l’information en une annonce formelle de sa seule présence.
  terminology: « Camp », « tentes », « arrivée » et « mouvement de foule » sont recevables. La note conserve à juste titre l’ambiguïté lexicale de παρουσία entre « présence » et « arrivée ». « À grands cris » rend de manière appropriée la dimension vocale de διεβοήθη.
  issues:
  - severity: medium
    issue: « devant la tente » atténue ἔξω
    rationale: ἔξω indique explicitement qu’elle se trouve à l’extérieur de la tente; « devant » peut désigner seulement la position frontale et n’est pas l’équivalent le plus sûr.
  - severity: low
    issue: « Les hommes » ajoute un sujet non exprimé
    rationale: Le grec dit simplement « ils vinrent ». Le contexte permet de comprendre qui agit, mais « Les hommes » introduit une précision absente du texte.
  - severity: low
    issue: « avait été annoncée » emploie un plus-que-parfait injustifié
    rationale: L’aoriste passif διεβοήθη présente l’annonce comme un fait narratif; « fut annoncée » conserve mieux cette valeur.
  - severity: low
    issue: « qu’on informe celui-ci de sa présence » modifie légèrement la formulation et efface le sujet grec
    rationale: προσήγγειλαν αὐτῷ περὶ αὐτῆς signifie qu’ils l’informèrent à son sujet. Une formulation avec « ils » respecte mieux le sujet et conserve l’objet volontairement général.
  revised_text: Il y eut un mouvement de foule dans le camp[a], car son arrivée fut annoncée à grands cris dans les tentes. Ils vinrent l’entourer alors qu’elle se tenait à l’extérieur de la tente d’Holopherne, jusqu’à ce qu’ils informent Holopherne à son sujet.
  revised_footnotes:
  - marker: a
    text: 'Autre traduction : « car sa présence fut annoncée à grands cris dans les tentes ». Le grec peut désigner aussi bien sa présence que, dans ce contexte, son arrivée.'
    reason: lexical_alternative
  revision_rationale: La révision rétablit la valeur explicite de « à l’extérieur », évite l’ajout de « Les hommes », aligne le temps verbal sur l’aoriste grec et conserve le sujet pluriel ainsi que le caractère général de l’information donnée à Holopherne. La note maintient l’ambiguïté de παρουσία sans imposer une interprétation.
