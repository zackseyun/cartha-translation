  text: And it happened, when she stopped crying out to the God of Israel and finished all these words,
translation:
  language: fr
  text: Il arriva que, lorsqu’elle eut cessé de crier vers le Dieu d’Israël et qu’elle eut achevé de prononcer toutes ces paroles,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο ὡς
  choice: Quand
  rationale: La formule grecque introduit ici la circonstance temporelle de la suite du récit. En français moderne, « Quand » rend naturellement cette transition sans reproduire lourdement le calque « Et il arriva que ».
- source_word: ἐπαύσατο
  choice: eut cessé
  rationale: Le verbe exprime l’arrêt de l’action. Le passé antérieur convient à une proposition temporelle précédant l’action principale attendue dans la suite.
- source_word: βοῶσα
  choice: de crier
  rationale: Le participe désigne un appel vocal intense. « Crier » conserve cette force dans le contexte de la prière, sans ajouter l’idée de larmes.
- source_word: πρὸς τὸν θεὸν Ἰσραήλ
  choice: vers le Dieu d’Israël
  rationale: « Vers » garde l’orientation exprimée par πρὸς, tandis que « le Dieu d’Israël » préserve le titre biblique et sa portée relationnelle.
- source_word: συνετέλεσεν
  choice: eut achevé de prononcer
  rationale: Le verbe indique qu’elle mena son discours à son terme. L’ajout idiomatique « de prononcer » rattache clairement l’action aux paroles sans modifier le sens.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: toutes ces paroles
  rationale: Cette formulation conserve le renvoi explicite à la prière précédente et le registre biblique naturel du mot « paroles ».
theological_decisions:
- issue: Traduction du titre θεὸν Ἰσραήλ
  choice: le Dieu d’Israël
  alternative: le Dieu d’Israël / Dieu d’Israël sans article selon le contexte stylistique
  rationale: La forme avec article suit le grec et maintient l’expression biblique consacrée sans introduire d’interprétation confessionnelle.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase reste ouverte par une virgule, comme le texte source fourni, puisqu’elle introduit l’action racontée au verset suivant. La formule narrative Καὶ ἐγένετο n’est pas rendue séparément afin d’éviter un calque pesant; sa fonction est portée par la construction temporelle.
