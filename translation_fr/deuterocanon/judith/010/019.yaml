revisions:
- from: 'Ils étaient émerveillés par sa beauté et, à cause d’elle, ils étaient émerveillés par les fils d’Israël[a]. Chacun disait à son voisin : « Qui mépriserait ce peuple qui compte en son sein de telles femmes ? Car il ne serait pas bon de laisser subsister parmi eux ne serait-ce qu’un seul homme[b] : ceux qu’on laisserait pourraient déjouer par leur habileté les plans de toute la terre[c]. »'
  to: 'Ils étaient émerveillés par sa beauté et, à cause d’elle, ils étaient émerveillés par les fils d’Israël[a]. Chacun disait à son voisin : « Qui mépriserait ce peuple qui compte en son sein de telles femmes ? Car il ne serait pas bon de laisser subsister parmi eux ne serait-ce qu’un seul homme[b] : ceux qui resteraient pourraient se montrer plus rusés que toute la terre[c]. »'
  rationale: La révision supprime l’ajout interprétatif « les plans » et rend directement la construction κατασοφίσασθαι πᾶσαν τὴν γῆν par une expression française naturelle de supériorité en ruse. Elle clarifie également la référence aux survivants sans expliciter davantage que nécessaire la violence implicite du contexte.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T09:39:44Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général, la répétition de l’imparfait, le lien causal « à cause d’elle », le masculin explicite d’ἄνδρα ἕνα et la portée collective de « fils d’Israël » sont bien rendus. Toutefois, « déjouer par leur habileté les plans de toute la terre » introduit « les plans », absent de κατασοφίσασθαι πᾶσαν τὴν γῆν, et déplace l’objet direct du verbe grec : ce sont « toute la terre » / le monde entier qu’ils pourraient surpasser en ruse.'
  naturalness: Le français est globalement digne et naturel. « Ceux qu’on laisserait » est intelligible, mais « ceux qui resteraient » exprime plus clairement le participe passif οἱ ἀφεθέντες dans cette conséquence hypothétique. « Se montrer plus rusés que toute la terre » est à la fois idiomatique et plus proche du grec que la formulation avec « les plans ».
  terminology: « Beauté », « fils d’Israël », « mépriser », « peuple », « telles femmes » et « un seul homme » sont appropriés. La traduction de κατασοφίσασθαι doit conserver l’idée de supériorité rusée sans ajouter un référent tel que des « plans ».
  issues:
  - severity: medium
    issue: Ajout de « les plans » dans la dernière proposition
    rationale: Le grec dit littéralement qu’ils pourraient κατασοφίσασθαι (« surpasser en ruse », « déjouer ») « toute la terre ». Il ne mentionne ni plans ni desseins. Cet ajout interprétatif réduit l’extension directe de πᾶσαν τὴν γῆν.
  - severity: low
    issue: « Ceux qu’on laisserait » est moins net que le participe grec
    rationale: οἱ ἀφεθέντες désigne les personnes laissées/survivantes. « Ceux qui resteraient » garde cette valeur résultative tout en s’intégrant plus naturellement à la construction conditionnelle française.
