base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/019.yaml
  text: And they marveled at her beauty[a], and because of her they marveled at the sons of Israel; and each said to his neighbor, “Who would despise this people, who have such women among them? For it is not good to leave even one man from among them[b], because those who are left would be able to outwit the whole earth.”
translation:
  language: fr
  text: 'Ils étaient émerveillés par sa beauté et, à cause d’elle, ils étaient émerveillés par les fils d’Israël[a]. Chacun disait à son voisin : « Qui mépriserait ce peuple qui compte en son sein de telles femmes ? Car il ne serait pas bon de laisser subsister parmi eux ne serait-ce qu’un seul homme[b] : ceux qui resteraient pourraient se montrer plus rusés que toute la terre[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les Israélites ». Littéralement : « les fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de laisser en vie parmi eux ne serait-ce qu’un seul homme ».'
    reason: implicit_context
  - marker: c
    text: 'Ou : « pourraient se montrer plus rusés que le monde entier ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμαζον
  choice: ils étaient émerveillés
  rationale: L’imparfait répété exprime une réaction prolongée mêlant étonnement et admiration; la répétition est conservée.
- source_word: κάλλει
  choice: beauté
  rationale: Rendu direct et naturel de κάλλος dans ce contexte, où il s’agit de l’apparence de Judith.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: les fils d’Israël
  rationale: Conserve l’expression masculine traditionnelle du grec tout en signalant en note qu’elle désigne collectivement les Israélites.
- source_word: ἀπʼ αὐτῆς
  choice: à cause d’elle
  rationale: Exprime clairement que Judith est la raison pour laquelle ils s’émerveillent du peuple d’Israël.
- source_word: καταφρονήσει
  choice: mépriserait
  rationale: Le futur grec a ici une valeur rhétorique; le conditionnel français rend naturellement la question tout en conservant l’idée de mépris.
- source_word: ἐν ἑαυτῷ
  choice: en son sein
  rationale: Rend l’idée que ce peuple possède parmi ses membres des femmes telles que Judith, dans un registre digne et naturel.
- source_word: οὐ καλόν ἐστιν
  choice: il ne serait pas bon
  rationale: Préserve l’évaluation volontairement large du grec sans préciser si elle est morale, stratégique ou pratique.
- source_word: ὑπολειπέσθαι ἐξ αὐτῶν ἄνδρα ἕνα
  choice: laisser subsister parmi eux ne serait-ce qu’un seul homme
  rationale: « Laisser subsister » restitue l’idée de survivant impliquée par le contexte militaire; « ne serait-ce qu’un seul homme » conserve l’emphase et le masculin explicite.
- source_word: οἱ ἀφεθέντες
  choice: ceux qu’on laisserait
  rationale: Garde l’écho lexical avec l’idée précédente sans ajouter explicitement « en vie », qui reste implicite dans le contexte.
- source_word: δυνήσονται κατασοφίσασθαι
  choice: pourraient déjouer par leur habileté les plans de
  rationale: κατασοφίζομαι évoque le fait de prendre l’avantage par la ruse ou l’intelligence; cette formulation française rend ce sens sans réduire le verbe à une simple tromperie.
- source_word: πᾶσαν τὴν γῆν
  choice: toute la terre
  rationale: Conserve l’expression grecque et son ampleur, avec une note indiquant la traduction contextuelle possible « le monde entier ».
theological_decisions:
- issue: Langage collectif masculin désignant Israël
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le texte grec emploie une expression masculine traditionnelle. La traduction la conserve dans le corps du texte, tout en explicitant en note sa portée collective.
- issue: Masculin singulier dans l’énoncé militaire
  choice: ne serait-ce qu’un seul homme
  alternative: ne serait-ce qu’une seule personne
  rationale: ἄνδρα désigne explicitement un homme et, dans le contexte guerrier, vraisemblablement un survivant masculin; neutraliser le genre effacerait une donnée du texte.
- issue: Portée de l’extermination envisagée par les soldats
  choice: laisser subsister
  alternative: laisser en vie
  rationale: La formulation conserve la violence stratégique implicite du passage sans l’atténuer ni ajouter une précision absente du verbe lui-même.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « ils étaient émerveillés » reproduit celle du grec. Le discours direct garde un ton rhétorique et militaire sans modernisation excessive.
