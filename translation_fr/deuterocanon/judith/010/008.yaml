  text: And they said to her, “May the God of our fathers grant you favor, and bring your undertakings to completion for the boasting of the sons of Israel and the exaltation of Jerusalem.” And she bowed down to God.
translation:
  language: fr
  text: 'Ils lui dirent : « Que le Dieu de nos pères t’accorde sa faveur[a] et mène à bien tes entreprises[b], afin que les fils d’Israël s’en glorifient et que Jérusalem soit exaltée[c]. » Puis elle se prosterna devant Dieu[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « t’accorde grâce » ou « te fasse trouver faveur ». Le grec dit littéralement « te donne en faveur », expression qui évoque un accueil favorable ou la réussite.
    reason: lexical_alternative
  - marker: b
    text: Ou « tes projets » ou « tes démarches ». Le terme grec peut désigner largement ce que quelqu’un projette ou entreprend de faire.
    reason: lexical_alternative
  - marker: c
    text: Ou « pour être un sujet de fierté pour les fils d’Israël et une exaltation pour Jérusalem »; ou « pour la gloire des fils d’Israël et l’exaltation de Jérusalem ».
    reason: alternative_reading
  - marker: d
    text: Ou « s’inclina devant Dieu » ou « adora Dieu ». Le verbe grec peut désigner un geste de prosternation accompli en signe de révérence.
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη … εἰς χάριν
  choice: t’accorde sa faveur
  rationale: L’optatif exprime un souhait ou une bénédiction. « Accorder sa faveur » rend naturellement l’idiome grec sans réduire χάρις à la seule notion abstraite de grâce.
- source_word: τελειῶσαι
  choice: mène à bien
  rationale: Cette expression française actuelle communique l’idée d’achever avec succès ce que Judith projette d’accomplir.
- source_word: τὰ ἐπιτηδεύματά σου
  choice: tes entreprises
  rationale: Le terme désigne ici les actions, projets ou démarches que Judith s’apprête à entreprendre; « entreprises » en conserve l’ampleur.
- source_word: εἰς καύχημα υἱῶν Ἰσραήλ
  choice: pour que les fils d’Israël puissent en tirer fierté
  rationale: καύχημα désigne un motif de fierté ou de célébration. Cette formulation reste naturelle en français tout en préservant l’idée d’un sujet de fierté, plutôt que de l’aplanir en simple « gloire ».
- source_word: εἰς … ὕψωμα Ἰερουσαλήμ
  choice: pour que … Jérusalem en soit élevée
  rationale: La tournure conserve l’image d’élévation portée par ὕψωμα et coordonne naturellement les deux résultats visés par la bénédiction.
- source_word: προσεκύνησεν τῷ θεῷ
  choice: elle se prosterna devant Dieu
  rationale: Le verbe décrit un geste corporel de profonde révérence. « Se prosterner devant » rend ce geste sans le remplacer par le terme plus interprétatif « adorer ».
theological_decisions:
- issue: Sens des deux expressions introduites par εἰς
  choice: pour que les fils d’Israël puissent en tirer fierté et que Jérusalem en soit élevée
  alternative: pour la gloire des fils d’Israël et l’exaltation de Jérusalem
  rationale: La formulation choisie préserve le motif de fierté exprimé par καύχημα et l’image verticale de ὕψωμα, tout en produisant une bénédiction intelligible en français moderne.
- issue: Portée de προσκυνέω
  choice: elle se prosterna devant Dieu
  alternative: elle adora Dieu
  rationale: Le rendu choisi maintient l’acte visible de révérence et ne tranche pas inutilement entre le geste et sa signification cultuelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse singulière faite à Judith. « Dieu de nos pères » conserve la formule ancestrale du grec. La syntaxe explicite les deux effets coordonnés de la bénédiction sans supprimer la tension lexicale entre fierté, gloire et élévation.
