base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/004.yaml
  text: And she put sandals on her feet[a], and put on her anklets and bracelets and rings and earrings and all her jewelry; and she made herself very beautiful[b], to deceive the eyes of any men who might see her.
translation:
  language: fr
  text: Elle mit des sandales à ses pieds, se para de ses anneaux de cheville, de ses bracelets, de ses bagues, de ses boucles d’oreilles et de tous ses bijoux[a]. Elle se fit très belle afin de tromper les yeux de tout homme qui la verrait[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de toute sa parure » ou « de tous ses ornements ». Ici, le grec κόσμος désigne ce qui sert à se parer.
    reason: lexical_alternative
  - marker: b
    text: Ou « de tous les hommes qui pourraient la voir ». La tournure grecque est indéfinie et générale.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβεν σανδάλια εἰς τοὺς πόδας αὐτῆς
  choice: Elle mit des sandales à ses pieds
  rationale: Bien que ἔλαβεν signifie littéralement « prit », le contexte vestimentaire appelle en français l’expression naturelle « mettre des sandales ». La mention explicite des pieds conserve l’image grecque.
- source_word: περιέθετο
  choice: se para de
  rationale: Le moyen grec décrit Judith mettant elle-même ses ornements. « Se para de » convient à toute l’énumération et relève légèrement le registre sans être archaïque.
- source_word: χλιδῶνας
  choice: anneaux de cheville
  rationale: Dans cette liste d’ornements concrets, le mot désigne vraisemblablement des bijoux portés aux chevilles. « Anneaux de cheville » est clair et évite la confusion qu’entraînerait la répétition de « bracelets ».
- source_word: ψέλια
  choice: bracelets
  rationale: Équivalent français courant et accessible pour des bracelets ou ornements portés aux bras.
- source_word: δακτυλίους
  choice: bagues
  rationale: Dans une liste de bijoux personnels, « bagues » rend naturellement les anneaux portés aux doigts.
- source_word: ἐνώτια
  choice: boucles d’oreilles
  rationale: Expression française moderne et usuelle pour les ornements d’oreilles.
- source_word: πάντα τὸν κόσμον αὐτῆς
  choice: tous ses bijoux
  rationale: κόσμος signifie ici parure ou ensemble d’ornements, non « monde ». « Tous ses bijoux » s’accorde au contexte concret, tandis que la note conserve les possibilités plus larges.
- source_word: ἐκαλλωπίσατο σφόδρα
  choice: Elle se fit très belle
  rationale: Cette formulation idiomatique exprime l’action réfléchie d’embellissement et conserve l’intensité de σφόδρα par « très ».
- source_word: εἰς ἀπάτησιν
  choice: afin de tromper
  rationale: La tournure exprime clairement le but. Le verbe « tromper » maintient sans l’atténuer la stratégie délibérée indiquée par ἀπάτησις.
- source_word: ὀφθαλμῶν ἀνδρῶν
  choice: les yeux de tout homme
  rationale: La traduction garde l’image explicite des « yeux » au lieu de la réduire à l’idée abstraite d’attention ou de regard.
- source_word: ὅσοι ἂν ἴδωσιν αὐτήν
  choice: tout homme qui la verrait
  rationale: Cette tournure française rend la valeur indéfinie et générale de ὅσοι ἄν avec le subjonctif, sans supposer un groupe d’hommes déjà déterminé.
theological_decisions:
- issue: La finalité morale de la parure de Judith
  choice: Le texte dit explicitement qu’elle s’embellit afin de tromper les yeux des hommes susceptibles de la voir.
  alternative: Atténuer la formule en disant qu’elle voulait seulement attirer, charmer ou captiver leur regard.
  rationale: Le nom ἀπάτησις exprime la tromperie. La traduction conserve donc la stratégie intentionnelle et la tension morale du récit sans l’excuser ni la condamner par ajout interprétatif.
translation_notes:
  register: Français international moderne, naturel et digne. L’énumération concrète est conservée, avec « se para de » pour éviter une succession pesante du verbe « mettre ». Les marqueurs de notes sont placés immédiatement après les expressions auxquelles les notes se rapportent.
