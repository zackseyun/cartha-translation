revisions:
- from: Mais lorsqu’ils la virent — son visage était transformé et elle avait changé de tenue —, ils s’émerveillèrent au plus haut point[a] de sa beauté.
  to: Mais lorsqu’ils la virent, son visage avait changé, ainsi que sa tenue, et ils furent extrêmement émerveillés par sa beauté[a].
  rationale: La révision évite de transformer la description grecque de la tenue changée en une action explicitement attribuée à Judith. Elle remplace aussi une tournure française peu fluide par une expression naturelle qui conserve l’étonnement admiratif et la forte intensité du grec.
