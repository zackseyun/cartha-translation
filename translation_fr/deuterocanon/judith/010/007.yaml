  text: But when they saw her[a], and her face had been changed and her clothing altered, they marveled very greatly at her beauty,
translation:
  language: fr
  text: Mais lorsqu’ils la virent, son visage avait changé, ainsi que sa tenue, et ils furent extrêmement émerveillés par sa beauté[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec accumule ici deux expressions d’intensité : littéralement, « beaucoup, extrêmement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ εἶδον αὐτήν
  choice: Mais lorsqu’ils la virent
  rationale: ὡς suivi de l’aoriste introduit ici une proposition temporelle, tandis que δέ marque une transition narrative légèrement contrastive. « Mais lorsqu’ils » rend l’enchaînement avec naturel.
- source_word: ἦν ἠλλοιωμένον τὸ πρόσωπον αὐτῆς
  choice: son visage était transformé
  rationale: La tournure périphrastique exprime l’état résultant d’un changement. « Visage » respecte précisément πρόσωπον, et « était transformé » convient au contexte de la nouvelle apparence de Judith.
- source_word: τὴν στολὴν μεταβεβληκυῖαν
  choice: elle avait changé de tenue
  rationale: 'Le participe parfait actif féminin accusatif μεταβεβληκυῖαν se rapporte naturellement à Judith, avec τὴν στολήν comme objet : elle avait changé sa tenue. En français courant, « changer de tenue » rend cette construction plus naturellement qu’une formulation passive.'
- source_word: ἐθαύμασαν ἐπὶ τῷ κάλλει αὐτῆς
  choice: ils s’émerveillèrent de sa beauté
  rationale: θαυμάζω exprime ici l’étonnement admiratif, et κάλλος la beauté. « S’émerveiller de » conserve cette nuance sans la réduire à une simple admiration.
- source_word: ἐπὶ πολὺ σφόδρα
  choice: au plus haut point
  rationale: Les deux éléments renforcent fortement le degré. « Au plus haut point » restitue cette emphase dans un français naturel et digne, tandis qu’une note signale le redoublement grec.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. Les tirets isolent les deux changements constatés sans lisser l’enchaînement quelque peu heurté du grec. La formulation demeure proche du texte source tout en évitant un calque syntaxique peu naturel.
