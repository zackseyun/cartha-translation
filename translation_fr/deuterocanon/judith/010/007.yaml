review_pass:
  verdict: revise
  source_fidelity: La phrase rend correctement la transition narrative, le constat du changement du visage et de la tenue, ainsi que l’étonnement intense devant la beauté de Judith. Toutefois, « elle avait changé de tenue » attribue explicitement à Judith une action que le grec formule par un participe qualifiant τὴν στολήν (« sa tenue ayant changé / sa tenue changée »). Il vaut mieux conserver cette formulation non agentive.
  naturalness: Le texte est globalement naturel, mais « s’émerveillèrent au plus haut point de sa beauté » est moins idiomatique en français moderne. « Furent extrêmement émerveillés par sa beauté » exprime naturellement l’intensité sans atténuation.
  terminology: « Visage », « tenue » et « beauté » sont appropriés. « Extrêmement » rend bien la double intensification ἐπὶ πολὺ σφόδρα, dont le redoublement est utilement signalé en note.
  issues:
  - severity: medium
    issue: Attribution d’une action à Judith dans « elle avait changé de tenue »
    rationale: Le participe μεταβεβληκυῖαν est à l’accusatif féminin et qualifie τὴν στολήν ; le grec décrit la tenue comme changée plutôt qu’il n’énonce explicitement que Judith l’a changée.
  - severity: low
    issue: Tour « s’émerveillèrent au plus haut point de » peu idiomatique
    rationale: L’intensité est bien visée, mais cette collocation est raide. Une formulation avec « extrêmement émerveillés par » est plus naturelle tout en conservant le sens.
  revised_text: Mais lorsqu’ils la virent, son visage avait changé, ainsi que sa tenue, et ils furent extrêmement émerveillés par sa beauté[a].
