  terminology: « Tente » convient au προσκήνιον dans le cadre du camp, avec une note qui indique justement les autres possibilités. « Lampes d’argent » est un choix prudent pour λαμπάδες ἀργυραῖ, tout en préservant « torches » comme alternative en note. Aucun terme théologique particulier n’est en jeu.
