  text: And they reported her to him[a], and he came out into the forecourt[b], with silver lamps going before him.
translation:
  language: fr
  text: Ils lui firent un rapport à propos d’elle, puis il sortit dans l’espace devant la tente[a], tandis que des lampes d’argent[b] le précédaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme grec désigne l’endroit situé devant la tente principale ou l’espace d’audience; on pourrait aussi traduire par « vestibule de la tente » ou « avant-tente ».
    reason: lexical_alternative
  - marker: b
    text: Ou « torches d’argent »; le terme grec peut désigner des lampes ou des torches, mais la mention de l’argent évoque plutôt ici des luminaires cérémoniels.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνήγγειλαν
  choice: firent un rapport
  rationale: Le verbe désigne l’action de rapporter ou d’annoncer une information. Cette formulation conserve ici l’idée d’un compte rendu adressé au chef.
- source_word: περὶ αὐτῆς
  choice: à son sujet
  rationale: Cette traduction garde la formulation générale du grec sans préciser indûment ce qui fut rapporté concernant Judith.
- source_word: ἐξῆλθεν
  choice: sortit
  rationale: Le verbe exprime simplement le mouvement de l’intérieur vers l’extérieur.
- source_word: προσκήνιον
  choice: l’espace devant la tente
  rationale: Dans le contexte du camp, le terme désigne vraisemblablement la partie située devant la tente principale; cette formulation évite le sens théâtral moderne de « scène ».
- source_word: λαμπάδες
  choice: lampes
  rationale: Le mot peut désigner des lampes ou des torches. La mention de l’argent favorise ici l’image de luminaires cérémoniels, sans rendre l’autre sens impossible.
- source_word: ἀργυραῖ
  choice: d’argent
  rationale: L’adjectif indique naturellement que ces objets sont en argent ou caractérisés par l’argent.
- source_word: προάγον
  choice: le précédaient
  rationale: Le participe décrit les lampes avançant devant lui dans une mise en scène processionnelle; la traduction conserve cette image sans ajouter explicitement des porteurs absents du grec.
