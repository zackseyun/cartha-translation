  text: And they were going straight through the courtyard[a], and an Assyrian advance guard met her.
translation:
  language: fr
  text: Elles avançaient tout droit dans le ravin, et une avant-garde assyrienne vint à sa rencontre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit « à sa rencontre » au singulier, alors que la proposition précédente parle de Judith et de sa servante au pluriel. Le récit porte ainsi son attention sur Judith en particulier.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: Elles avançaient
  rationale: L’imparfait grec présente leur déplacement comme en cours. Le féminin pluriel renvoie naturellement à Judith et à sa servante dans le contexte.
- source_word: ἐν τῷ αὐλῶνι
  choice: dans le ravin
  rationale: Dans ce contexte extérieur à la ville, αὐλών désigne un passage encaissé, une gorge ou un ravin, plutôt qu’une cour intérieure.
- source_word: εἰς εὐθεῖαν
  choice: tout droit
  rationale: La locution adverbiale indique une progression directe, sans détour.
- source_word: συνήντησεν
  choice: vint à sa rencontre
  rationale: L’aoriste de συναντάω exprime ici la rencontre soudaine avec la garde; cette tournure est naturelle en français narratif.
- source_word: αὐτῇ
  choice: sa
  rationale: Le datif féminin singulier renvoie spécifiquement à Judith, malgré le sujet pluriel de la proposition précédente.
- source_word: προφυλακὴ τῶν Ἀσσυρίων
  choice: une avant-garde assyrienne
  rationale: προφυλακή désigne une garde placée en avant; l’adjectif « assyrienne » rend naturellement le génitif τῶν Ἀσσυρίων.
