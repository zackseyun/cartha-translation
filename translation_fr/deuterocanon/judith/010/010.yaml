  yaml_path: translation/deuterocanon/judith/010/010.yaml
  text: And they did so. Then Judith went out[a], she and her maid with her; and the men of the city kept watching her until she went down the mountain, until she passed through the valley, and they could no longer see her.
translation:
  language: fr
  text: Ils firent ainsi. Judith sortit, accompagnée de sa servante. Les hommes de la ville la regardaient jusqu’à ce qu’elle descende la montagne, jusqu’à ce qu’elle traverse la vallée[a] ; ils ne la voyaient plus.
