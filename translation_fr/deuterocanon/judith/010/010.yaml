    text: Ou « ravin » ou « défilé » (grec αὐλών).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν οὕτως
  choice: Ils firent ainsi
  rationale: Rend directement la confirmation narrative grecque dans un français actuel et digne.
- source_word: ἐξῆλθεν
  choice: sortit
  rationale: Verbe de mouvement simple et naturel, correspondant au sens courant de ἐξέρχομαι dans ce récit.
- source_word: παιδίσκη
  choice: servante
  rationale: Désigne clairement l’assistante féminine de Judith et son statut domestique, sans la nuance vieillie ou ambiguë de « bonne ».
- source_word: ἀπεσκόπευον
  choice: la suivirent du regard
  rationale: Expression française naturelle qui rend l’observation visuelle prolongée indiquée par l’imparfait grec.
- source_word: οἱ ἄνδρες τῆς πόλεως
  choice: Les hommes de la ville
  rationale: Traduction transparente qui conserve la référence explicite aux hommes.
- source_word: ἕως οὗ κατέβη τὸ ὄρος
  choice: jusqu’à ce qu’elle ait descendu la montagne
  rationale: Préserve le mouvement topographique et la limite progressive de leur observation.
- source_word: αὐλών
  choice: vallée
  rationale: Terme français général et intelligible pour un creux allongé entre des reliefs ; le grec permet toutefois un passage plus resserré, signalé en note.
- source_word: οὐκ ἔτι ἐθεώρουν αὐτήν
  choice: ils ne la virent plus
  rationale: Rend avec concision la cessation de la perception visuelle exprimée par οὐκ ἔτι.
