review_pass:
  verdict: revise
  source_fidelity: La structure de la fin du verset doit conserver les deux limites successives introduites par ἕως (« jusqu’à ce qu’elle descende la montagne, jusqu’à ce qu’elle traverse l’αὐλών »). Le plus-que-parfait/temps composé implicite de « jusqu’à ce qu’elle ait descendu » et la coordination des deux actions dans le draft atténuent cette progression. « La regardaient » rend l’imparfait ἀπεσκόπευον de façon plus directement continue.
  naturalness: La révision reste idiomatique en français international moderne. « Accompagnée de sa servante » exprime naturellement que Judith sort avec son assistante, et la répétition de « jusqu’à ce que » restitue sans lourdeur la syntaxe narrative grecque.
  terminology: « Servante » convient à παιδίσκη dans ce contexte domestique. « Hommes de la ville » conserve l’explicitation de ἄνδρες. « Vallée » est une option prudente pour αὐλών; la note conserve les possibilités topographiques plus resserrées.
  issues:
  - severity: medium
    issue: Les deux propositions temporelles grecques répétées sont fusionnées et la première est formulée au passé composé du subjonctif.
    rationale: Le grec marque successivement la descente de la montagne puis le passage par l’αὐλών comme bornes de leur observation. Les distinguer préserve plus exactement la progression du texte.
  - severity: low
    issue: « La suivirent du regard » au passé simple réduit l’aspect duratif de ἀπεσκόπευον.
    rationale: L’imparfait grec présente l’observation comme une action en cours; « la regardaient » le reflète simplement.
  revised_text: Ils firent ainsi. Judith sortit, accompagnée de sa servante. Les hommes de la ville la regardaient jusqu’à ce qu’elle descende la montagne, jusqu’à ce qu’elle traverse la vallée[a] ; ils ne la voyaient plus.
