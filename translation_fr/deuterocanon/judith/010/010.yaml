revisions:
- from: Ils firent ainsi. Judith sortit avec sa servante. Les hommes de la ville la suivirent du regard jusqu’à ce qu’elle ait descendu la montagne et traversé la vallée[a] ; après quoi, ils ne la virent plus.
  to: Ils firent ainsi. Judith sortit, accompagnée de sa servante. Les hommes de la ville la regardaient jusqu’à ce qu’elle descende la montagne, jusqu’à ce qu’elle traverse la vallée[a] ; ils ne la voyaient plus.
  rationale: La révision rétablit les deux « jusqu’à ce que » du grec et rend l’observation continue par l’imparfait français, tout en conservant le sens, le registre et l’alternative lexicale déjà signalée pour αὐλών.
  reviewer_model: gpt-5.6-terra
