  verdict: revise
  source_fidelity: 'Le texte rend fidèlement les impératifs, la sortie de la ville, les jeunes hommes et le pluriel ambigu de καθὼς ἐλάλησαν. Toutefois, « mener à leur accomplissement les paroles dont vous avez parlé avec moi » est une construction française maladroite et obscurcit légèrement le sens de εἰς τελείωσιν τῶν λόγων ὧν ἐλαλήσατε μετʼ ἐμοῦ : Judith entend accomplir ce qui a été discuté avec elle.'
  naturalness: La formulation révisée est plus idiomatique en français international moderne, tout en gardant un registre narratif digne. « Ce dont vous avez parlé avec moi » rend naturellement la relative grecque sans faire des « paroles » l’objet artificiel de « mener à l’accomplissement ».
  terminology: « Donnez l’ordre », « porte de la ville », « jeunes hommes » et « ordonnèrent » conviennent au registre et à la force des verbes grecs. La formulation finale conserve le sujet pluriel explicite du grec (« ils ») et la note préserve l’ambiguïté contextuelle sans imposer Judith comme référent grammatical.
