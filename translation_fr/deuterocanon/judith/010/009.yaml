  text: And she said to them[a], “Order the gate of the city to be opened for me, and I will go out for the fulfillment of the words that you spoke with me.” So they instructed the young men to open it for her, just as she had said.
translation:
  language: fr
  text: 'Elle leur dit[a] : « Donnez l’ordre qu’on m’ouvre la porte de la ville, et je sortirai afin d’accomplir ce dont vous avez parlé avec moi. » Ils ordonnèrent donc aux jeunes hommes de lui ouvrir, comme ils l’avaient dit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement à la fin du verset : « comme ils avaient parlé ». La formulation peut renvoyer soit à ce que Judith venait de demander, soit à ce dont ils s’étaient entretenus avec elle.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐπιτάξατε
  choice: Donnez l’ordre
  rationale: L’impératif aoriste exprime un ordre adressé aux responsables; cette tournure garde sa force tout en restant naturelle en français moderne.
- source_word: ἀνοῖξαί μοι τὴν πύλην τῆς πόλεως
  choice: qu’on m’ouvre la porte de la ville
  rationale: La proposition complétive rend naturellement l’infinitif dépendant du verbe de commandement et conserve le bénéficiaire exprimé par μοι.
- source_word: ἐξελεύσομαι
  choice: je sortirai
  rationale: Rend directement le futur de mouvement hors de la ville.
- source_word: εἰς τελείωσιν τῶν λόγων
  choice: pour mener à leur accomplissement les paroles
  rationale: Conserve à la fois l’idée de finalité, la notion d’accomplissement portée par τελείωσις et le terme concret « paroles » pour λόγοι.
- source_word: ὧν ἐλαλήσατε μετʼ ἐμοῦ
  choice: dont vous avez parlé avec moi
  rationale: La préposition μετά suggère un échange avec Judith plutôt qu’une parole simplement adressée à elle.
- source_word: συνέταξαν
  choice: ils ordonnèrent
  rationale: Le verbe désigne ici une directive donnée à des subordonnés; « ordonnèrent » en garde clairement l’autorité.
- source_word: τοῖς νεανίσκοις
  choice: aux jeunes hommes
  rationale: Traduction directe et compréhensible de νεανίσκοι, sans préciser indûment leur fonction.
- source_word: ἀνοῖξαι αὐτῇ
  choice: de lui ouvrir
  rationale: Le français permet de sous-entendre naturellement la porte déjà mentionnée, tout en conservant le datif de bénéficiaire.
- source_word: καθὼς ἐλάλησαν
  choice: comme ils l’avaient dit
  rationale: Suit le pluriel du texte grec et évite d’en remplacer silencieusement le sujet par Judith, même si le référent exact demeure contextuellement ambigu.
