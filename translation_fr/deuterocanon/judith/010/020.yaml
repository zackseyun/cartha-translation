  text: And those attending Holofernes came out[a], and all his servants, and they brought her into the tent.
translation:
  language: fr
  text: Et ceux qui dormaient auprès d’Holopherne[a] sortirent, ainsi que tous ses serviteurs, et ils la firent entrer dans la tente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ceux qui étaient couchés près d’Holopherne ». Le grec peut désigner littéralement ceux qui dormaient ou étaient couchés auprès de lui ; dans ce contexte, il s’agit probablement d’hommes chargés de son service rapproché.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: sortirent
  rationale: L’aoriste de ἐξέρχομαι exprime directement un mouvement vers l’extérieur; « sortirent » convient naturellement au récit sans imposer un point de vue absent du grec.
- source_word: οἱ παρακαθεύδοντες Ὀλοφέρνῃ
  choice: ceux qui se tenaient auprès d’Holopherne
  rationale: Le participe évoque littéralement ceux qui dorment ou sont couchés à proximité. Dans ce contexte militaire et domestique, il désigne vraisemblablement les hommes placés auprès d’Holopherne; cette formulation rend leur proximité et leur fonction sans suggérer à tort une intimité particulière.
- source_word: θεράποντες
  choice: serviteurs
  rationale: θεράπων désigne couramment un serviteur ou un homme de service. « Serviteurs » est clair, actuel et adapté au contexte.
- source_word: εἰσήγαγον
  choice: ils la firent entrer
  rationale: εἰσάγω signifie faire entrer, conduire ou amener à l’intérieur. « Firent entrer » restitue précisément le mouvement vers l’intérieur de la tente.
- source_word: σκηνήν
  choice: la tente
  rationale: σκηνή signifie directement « tente »; ce terme est transparent et naturel dans le cadre d’un camp militaire.
