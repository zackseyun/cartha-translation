base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/023.yaml
  text: When Judith came before him and his attendants[a], they all marveled at the beauty of her face; and falling on her face, she bowed down to him, and they raised her up.
translation:
  language: fr
  text: Lorsque Judith se présenta devant lui et ses serviteurs, tous s’émerveillèrent de la beauté de son visage. Elle tomba le visage contre terre et se prosterna devant lui[a], puis ils la relevèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lui rendit hommage ». Le verbe grec peut aussi signifier « adorer », mais il désigne ici une marque de respect envers un chef humain.
    reason: Variante lexicale signalant l’étendue sémantique de προσκυνέω sans imposer dans le texte principal l’idée d’un culte religieux.
lexical_decisions:
- source_word: κατὰ πρόσωπον αὐτοῦ
  choice: se présenta devant lui
  rationale: L’expression indique ici l’entrée de Judith en présence d’Holopherne. Cette formulation française est naturelle et convient au cadre de cour sans insister artificiellement sur un face-à-face littéral.
- source_word: θεραπόντων
  choice: serviteurs
  rationale: θεράπων désigne des personnes attachées au service d’un personnage important. « Serviteurs » est clair en français courant et n’impose pas la notion plus forte d’esclavage.
- source_word: ἐθαύμασαν
  choice: s’émerveillèrent
  rationale: Le verbe exprime un étonnement admiratif. « S’émerveillèrent » restitue ces deux nuances dans un registre digne et accessible.
- source_word: κάλλει τοῦ προσώπου
  choice: la beauté de son visage
  rationale: Le grec mentionne expressément la beauté du visage, et non seulement l’apparence générale.
- source_word: πεσοῦσα ἐπὶ πρόσωπον
  choice: tomba le visage contre terre
  rationale: Cette traduction conserve l’image physique et concrète de la prosternation décrite par le grec.
- source_word: προσεκύνησεν αὐτῷ
  choice: se prosterna devant lui
  rationale: Dans ce contexte où l’objet du geste est un chef humain, le verbe désigne une marque de profonde déférence. La formulation conserve le geste sans suggérer nécessairement un culte religieux.
- source_word: ἤγειραν αὐτὴν
  choice: ils la relevèrent
  rationale: Le pluriel grec renvoie naturellement aux personnes présentes. « Relevèrent » rend directement l’action sans ajouter qu’elles l’auraient seulement aidée.
theological_decisions:
- issue: Sens de προσκυνέω envers un dirigeant humain
  choice: se prosterna devant lui
  alternative: l’adora ; lui rendit hommage
  rationale: Le contexte immédiat favorise l’idée d’une prosternation respectueuse devant un chef humain plutôt que celle d’un culte rendu à une divinité. La note signale néanmoins l’étendue sémantique réelle du verbe grec.
translation_notes:
  register: Français international moderne, narratif et digne. Les propositions sont légèrement réorganisées pour éviter une longue coordination lourde, tout en conservant la succession des actes du grec. Le marqueur de note est placé après « se prosterna devant lui », expression qu’il explique.
