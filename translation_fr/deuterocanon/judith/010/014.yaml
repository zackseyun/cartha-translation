revisions:
- from: Quand les hommes eurent entendu ses paroles et contemplé attentivement son visage[a], elle leur parut d’une beauté absolument merveilleuse[b].
  to: Lorsque les hommes eurent entendu ses paroles et observé attentivement son visage[a], elle leur parut d’une beauté extraordinaire[b].
  rationale: La révision évite une nuance admirative non requise dans le verbe d’observation et remplace une intensification française maladroite par une expression naturelle qui conserve le sens de beauté extraordinairement frappante. Les deux appels de note restent correctement ancrés après les expressions qu’ils expliquent.
