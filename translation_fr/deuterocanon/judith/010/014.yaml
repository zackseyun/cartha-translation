  text: And when the men heard her words and observed her face[b][a], she was exceedingly marvelous in beauty before them.
translation:
  language: fr
  text: Lorsque les hommes eurent entendu ses paroles et observé attentivement son visage[a], elle leur parut d’une beauté extraordinaire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « examiné attentivement son visage ». Le verbe grec indique qu’ils l’observèrent avec une attention soutenue.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « elle était devant eux merveilleuse en beauté, très fortement » ; cette tournure signifie qu’à leurs yeux, elle était d’une beauté extraordinaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἤκουσαν
  choice: Quand … eurent entendu
  rationale: ὡς suivi de l’aoriste introduit ici une proposition temporelle. Le passé antérieur marque naturellement en français l’antériorité par rapport à la réaction qui suit.
- source_word: οἱ ἄνδρες
  choice: les hommes
  rationale: ἄνδρες désigne simplement les hommes. Le contexte permet de penser à des gardes, mais le verset ne les qualifie pas ainsi.
- source_word: τὰ ῥήματα αὐτῆς
  choice: ses paroles
  rationale: ῥήματα renvoie aux paroles prononcées; « ses paroles » est à la fois proche du grec et naturel dans un registre narratif digne.
- source_word: κατενόησαν
  choice: contemplé attentivement
  rationale: κατανοέω exprime une observation soutenue ou attentive. Avec « visage » comme complément, cette formulation rend la force du verbe sans réduire l’action à un simple regard.
- source_word: τὸ πρόσωπον αὐτῆς
  choice: son visage
  rationale: πρόσωπον signifie concrètement « visage » dans ce contexte, plutôt qu’une notion plus générale d’apparence.
- source_word: ἦν ἐναντίον αὐτῶν
  choice: elle leur parut
  rationale: Littéralement, elle « était devant eux ». Dans ce contexte descriptif, « elle leur parut » exprime naturellement le jugement produit à leurs yeux, sans transformer la beauté en simple illusion.
- source_word: θαυμάσιον τῷ κάλλει σφόδρα
  choice: d’une beauté absolument merveilleuse
  rationale: θαυμάσιον indique ce qui suscite l’émerveillement, τῷ κάλλει précise le domaine de la beauté et σφόδρα renforce fortement l’expression. La formulation française conserve cette intensité avec naturel.
