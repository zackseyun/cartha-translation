  yaml_path: translation/deuterocanon/judith/010/002.yaml
  text: And she rose from her prostration and called her maid Abra[a], and went down into the house in which she stayed during the days of her Sabbaths and during her festivals[b],
translation:
  language: fr
  text: Elle se releva de sa prosternation[a], appela sa servante Abra, puis descendit dans la maison où elle séjournait pendant ses jours de sabbat et ses fêtes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de sa chute ». Le nom grec peut désigner une chute, mais il renvoie probablement ici à la posture de Judith, étendue à terre pour prier.
    reason: lexical_alternative
  - marker: b
    text: Le grec parle littéralement des « jours des sabbats » et de « ses fêtes » ; ces pluriels évoquent les observances répétées du calendrier religieux.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέστη
  choice: se releva
  rationale: Le verbe exprime ici le fait que Judith se remet debout après s’être tenue à terre; « se releva » convient naturellement au récit.
- source_word: ἀπὸ τῆς πτώσεως
  choice: de sa prosternation
  rationale: πτῶσις peut désigner une chute, mais le contexte immédiat de prière indique probablement une posture volontaire à terre. « Prosternation » conserve cette dimension corporelle et religieuse.
- source_word: ἐκάλεσεν
  choice: appela
  rationale: Rend simplement l’action d’appeler Abra, sans renforcer inutilement le verbe par « convoqua ».
- source_word: τὴν Ἄβραν αὐτῆς
  choice: sa servante Abra
  rationale: L’édition présente Ἄβρα comme un nom propre. « Servante » explicite en français la fonction connue d’Abra auprès de Judith, sans employer le terme vieilli « suivante ».
- source_word: κατέβη
  choice: descendit
  rationale: Conserve le mouvement spatial vers le bas exprimé par le verbe grec.
- source_word: εἰς τὸν οἶκον
  choice: dans la maison
  rationale: εἰς marque un mouvement vers l’intérieur de la maison.
- source_word: ἐν ᾧ διέτριβεν
  choice: où elle séjournait
  rationale: διατρίβω indique qu’elle y passait du temps ou y demeurait; « séjournait » évite de suggérer nécessairement une résidence permanente.
- source_word: ἐν ταῖς ἡμέραις τῶν σαββάτων
  choice: les jours de sabbat
  rationale: Cette formulation française naturelle garde l’idée de jours de sabbat répétés portée par les pluriels grecs.
- source_word: ἐν ταῖς ἑορταῖς αὐτῆς
  choice: lors de ses fêtes
  rationale: Préserve le possessif grec et le sens de fêtes religieuses observées par Judith.
theological_decisions:
- issue: Sens dévotionnel de ἀπὸ τῆς πτώσεως
  choice: de sa prosternation
  alternative: de sa chute
  rationale: La scène précédente est une prière accomplie à terre; la prosternation est donc le sens contextuel le plus probable. Une note conserve toutefois le sens lexical plus général afin de ne pas masquer l’ambiguïté.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide tout en conservant le mouvement vers le bas, le séjour temporaire et les observances religieuses répétées.
