base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/003.yaml
  text: And she took off the sackcloth that she had been wearing[a], and removed the garments of her widowhood. She washed her body with water and anointed herself with rich perfume, arranged the hair of her head, put a headband on it, and put on her festive garments, with which she used to adorn herself during the days of her husband Manasseh’s life[c][b];
translation:
  language: fr
  text: Elle retira le sac dont elle s’était vêtue et ôta ses vêtements de veuve. Elle se lava le corps avec de l’eau, s’enduisit d’un onguent parfumé et onctueux[a], arrangea ses cheveux, posa sur sa tête un bandeau[b], puis revêtit les habits de fête dont elle se parait du vivant de son mari Manassé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’un onguent parfumé épais ». Le grec peut désigner une préparation parfumée riche ou épaisse.
    reason: lexical_alternative
  - marker: b
    text: Ou « une coiffure » ou « un turban ». Le terme grec désigne une bande ou une pièce portée sur la tête.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιείλατο τὸν σάκκον ὃν ἐνεδύκει
  choice: Elle retira le sac dont elle s’était vêtue
  rationale: Le moyen περιείλατο exprime le retrait d’un vêtement porté sur soi, tandis que le plus-que-parfait ἐνεδύκει indique qu’elle l’avait auparavant revêtu. « Le sac » conserve le terme biblique désignant l’habit de deuil ou de pénitence.
- source_word: ἐξεδύσατο τὰ ἱμάτια τῆς χηρεύσεως αὐτῆς
  choice: ôta ses vêtements de veuve
  rationale: Formulation française naturelle qui maintient la référence explicite au statut de veuve et au changement d’habillement.
- source_word: περιεκλύσατο τὸ σῶμα ὕδατι
  choice: Elle se lava le corps avec de l’eau
  rationale: Rend directement le lavage corporel sans préciser indûment qu’il s’agissait d’un bain complet.
- source_word: ἔχρισατο μύρῳ παχεῖ
  choice: s’enduisit d’une huile parfumée et généreuse
  rationale: ἔχρισατο désigne l’application sur soi; μύρον est une huile ou préparation parfumée, et παχύς peut évoquer une substance épaisse ou riche. « Généreuse » suggère ici une préparation riche sans la réduire au simple parfum liquide moderne.
- source_word: διέταξε τὰς τρίχας τῆς κεφαλῆς αὐτῆς
  choice: arrangea ses cheveux
  rationale: Le verbe signifie mettre en ordre; la formulation reste naturelle sans introduire une méthode précise comme le peignage.
- source_word: ἐπέθετο μίτραν ἐπʼ αὐτῆς
  choice: posa sur sa tête un bandeau
  rationale: μίτρα désigne une bande ou une coiffure portée sur la tête. « Bandeau » est lisible tout en laissant en note l’autre possibilité.
- source_word: τὰ ἱμάτια τῆς εὐφροσύνης αὐτῆς
  choice: les habits de fête
  rationale: εὐφροσύνη évoque la joie et la célébration; dans ce contexte vestimentaire, « habits de fête » s’oppose clairement aux vêtements de veuve.
- source_word: ἐν αἷς ἐστολίζετο
  choice: dont elle se parait
  rationale: L’imparfait français restitue l’action habituelle passée et « se parer » conserve l’idée d’ornement exprimée par le verbe grec.
- source_word: ἐν ταῖς ἡμέραις τῆς ζωῆς τοῦ ἀνδρὸς αὐτῆς Μανασσή
  choice: du vivant de son mari Manassé
  rationale: Équivalent idiomatique français de l’expression littérale « aux jours de la vie de son mari », sans perte de sens.
theological_decisions:
- issue: Symbolique du veuvage et du deuil
  choice: Conserver distinctement « le sac » et « ses vêtements de veuve »
  alternative: Fusionner en « ses vêtements de deuil »
  rationale: La formulation grecque nomme séparément le sac et les vêtements liés au veuvage. Cette distinction met en relief le passage délibéré de Judith du deuil à la parure festive, sans lui ajouter de portée doctrinale.
translation_notes:
  register: Français international moderne, digne et narratif. La syntaxe suit la progression des gestes tout en évitant les calques lourds. « Sac », « vêtements de veuve » et « habits de fête » préservent le contraste social et narratif du grec.
