base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/021.yaml
  text: And Holofernes was reclining on his bed under the canopy[a], which was woven with purple, gold, emeralds, and costly stones.
translation:
  language: fr
  text: Holopherne se reposait sur son lit, sous la tenture[a], qui était tissée de pourpre, d’or, d’émeraudes et de pierres précieuses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sous la moustiquaire » ou « à l’intérieur du rideau de lit » ; le terme grec peut désigner une couverture en filet ou en étoffe suspendue autour ou au-dessus d’un lit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπαυόμενος
  choice: se reposait
  rationale: Le participe décrit Holopherne au repos sur son lit. « Se reposait » reste proche du grec sans imposer une posture plus précise.
- source_word: κλίνης
  choice: lit
  rationale: Dans le cadre d’une chambre et avec la mention d’une tenture qui le couvre, « lit » est le sens contextuel le plus naturel.
- source_word: κωνωπίῳ
  choice: sous la tenture
  rationale: Le terme désigne une couverture de lit suspendue, qui peut être une moustiquaire ou une tenture. « Tenture » convient au caractère luxueux de l’objet, tandis que l’ambiguïté lexicale est signalée en note.
- source_word: πορφύρας
  choice: pourpre
  rationale: Le substantif désigne ici une matière ou une étoffe pourpre de grand prix; « pourpre » rend naturellement cette valeur dans l’énumération.
- source_word: χρυσίου
  choice: or
  rationale: Traduction directe; le contexte du tissage peut suggérer du fil d’or, mais le grec ne précise pas « fil ».
- source_word: σμαράγδου
  choice: émeraudes
  rationale: « Émeraudes » est l’équivalent usuel et s’intègre naturellement à la liste des matières précieuses.
- source_word: λίθων πολυτελῶν
  choice: pierres précieuses
  rationale: L’expression qualifie des pierres de grande valeur. « Pierres précieuses » est idiomatique en français et conserve l’idée de luxe.
- source_word: καθυφασμένων
  choice: tissée de
  rationale: Le participe décrit l’incorporation des matières au travail textile. « Tissée de » est naturel et évite de préciser sans certitude s’il s’agit de broderie.
