base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/015.yaml
  text: And they said to her[a], “You have saved your life by hurrying down into the presence of our lord. And now come to his tent[b], and some from among us will escort you until they hand you over into his hands.”
translation:
  language: fr
  text: 'Ils lui dirent : « Tu as sauvé ta vie[a] en te hâtant de descendre devant notre seigneur. Maintenant, approche-toi de sa tente, et quelques-uns des nôtres t’escorteront jusqu’à ce qu’ils te remettent entre ses mains[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque signifie littéralement « tu as sauvé ton âme » ; ici, « âme » a le sens de « vie ».
    reason: lexical_alternative
  - marker: b
    text: « Entre ses mains » signifie ici sous son autorité ou sous sa garde.
    reason: idiom_clarification
lexical_decisions:
- source_word: Σέσωκας τὴν ψυχήν σου
  choice: Tu as sauvé ta vie
  rationale: Le parfait de σῴζω exprime un résultat acquis, et ψυχή désigne ici la vie de Judith. Cette formulation reste proche du grec tout en étant naturelle en français.
- source_word: σπεύσασα καταβῆναι
  choice: en te hâtant de descendre
  rationale: Le participe indique la circonstance ou le moyen par lequel elle a sauvé sa vie; l’infinitif conserve le mouvement vers le bas.
- source_word: εἰς πρόσωπον τοῦ κυρίου ἡμῶν
  choice: en présence de notre seigneur
  rationale: L’expression grecque signifie se présenter devant quelqu’un. La minuscule indique qu’il s’agit d’un supérieur humain, non d’un titre divin.
- source_word: πρόσελθε ἐπὶ τὴν σκηνὴν αὐτοῦ
  choice: approche-toi de sa tente
  rationale: Dans ce contexte militaire, σκηνή désigne la tente du chef; « approche-toi » rend clairement l’impératif πρόσελθε.
- source_word: ἀφʼ ἡμῶν προπέμψουσίν σε
  choice: certains d’entre nous t’escorteront
  rationale: προπέμπω peut signifier accompagner ou escorter. Le pluriel avec ἀφ’ ἡμῶν suggère que des membres du groupe la conduiront plus loin.
- source_word: ἕως παραδῶσίν σε εἰς χεῖρας αὐτοῦ
  choice: jusqu’à ce qu’ils te remettent entre ses mains
  rationale: La traduction conserve l’image grecque tout en exprimant naturellement la remise de Judith à l’autorité et à la garde du chef.
theological_decisions:
- issue: Sens de κύριος appliqué à un dirigeant humain
  choice: notre seigneur
  alternative: notre maître
  rationale: Le contexte désigne le supérieur militaire des interlocuteurs. « seigneur » conserve le titre de respect, avec une minuscule pour éviter de l’identifier à Dieu.
translation_notes:
  register: Français international moderne, fluide et digne. Le discours conserve le ton respectueux du cadre militaire sans archaïsme inutile; les images grecques significatives sont maintenues et expliquées sobrement.
