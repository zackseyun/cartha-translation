  text: But if you stand before him, do not be afraid in your heart; instead, report according to your words, and he will treat you well.
translation:
  language: fr
  text: Mais si tu te présentes devant lui, n’aie pas peur dans ton cœur ; fais ton rapport selon tes paroles[a], et il te traitera bien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « rapporte selon tes paroles ». La tournure peut désigner le fait de présenter son propre récit ou ses propres déclarations.'
    reason: La formulation grecque ἀνάγγειλον κατὰ τὰ ῥήματά σου est inhabituelle en français si elle est traduite mot à mot ; la note en explicite la portée sans ajouter l’idée de paroles préparées d’avance.
lexical_decisions:
- source_word: ἐὰν δὲ στῇς ἐναντίον αὐτοῦ
  choice: Mais lorsque tu te tiendras devant lui
  rationale: Dans ce contexte, ἐάν avec le subjonctif peut désigner l’éventualité attendue de la comparution. « Devant lui » rend naturellement ἐναντίον αὐτοῦ.
- source_word: μὴ φοβηθῇς τῇ καρδίᾳ σου
  choice: n’aie pas peur dans ton cœur
  rationale: Conserve l’image anthropologique du grec tout en restant clair en français moderne.
- source_word: ἀνάγγειλον κατὰ τὰ ῥήματά σου
  choice: Dis-lui plutôt ce que tu avais prévu de dire
  rationale: ἀναγγέλλω signifie annoncer, rapporter ou faire savoir. L’expression inhabituelle κατὰ τὰ ῥήματά σου renvoie ici à des paroles déjà préparées ou convenues; une traduction strictement littérale, « selon tes paroles », serait peu intelligible en français.
- source_word: εὖ σε ποιήσει
  choice: il te traitera bien
  rationale: Rend l’idiome grec εὖ ποιεῖν avec un complément de personne, sans le surinterpréter comme une promesse précise de récompense.
