base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/013.yaml
  text: And I am coming into the presence of Holofernes[a], the commander-in-chief of your forces, to announce words of truth, and I will show before him the way by which he will go and gain mastery over all the hill country, and not one flesh of his men, nor a breath of life, will be lacking.
translation:
  language: fr
  text: Et moi, je viens me présenter devant Holopherne, le commandant en chef de vos forces, pour lui annoncer des paroles de vérité. Je lui montrerai la voie qu’il empruntera et par laquelle il se rendra maître de toute la région montagneuse ; parmi ses hommes, il ne manquera ni un seul corps ni un souffle de vie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « parmi ses hommes, pas une seule chair ni un souffle de vie ne manquera ».'
    reason: La note préserve l’idiome corporel frappant et quelque peu obscur du grec, où σάρξ (« chair ») est employé concrètement.
lexical_decisions:
- source_word: κἀγὼ ἔρχομαι
  choice: Et moi, je viens
  rationale: Le présent grec est conservé dans sa vivacité; «je viens» convient à la situation immédiate de Judith.
- source_word: εἰς τὸ πρόσωπον Ὀλοφέρνου
  choice: me présenter devant Holopherne
  rationale: Rend naturellement l’idée d’entrer en présence de quelqu’un, sans calquer maladroitement «vers le visage».
- source_word: ἀρχιστρατήγου δυνάμεως ὑμῶν
  choice: le commandant en chef de vos forces
  rationale: Le composé désigne le chef militaire suprême, et δύναμις renvoie ici aux forces armées.
- source_word: τοῦ ἀναγγεῖλαι ῥήματα ἀληθείας
  choice: pour lui annoncer des paroles de vérité
  rationale: L’infinitif articulé exprime le but; la construction solennelle «paroles de vérité» préserve le génitif grec.
- source_word: δείξω πρὸ προσώπου αὐτοῦ ὁδὸν
  choice: Je lui montrerai la voie
  rationale: Formulation française naturelle qui conserve l’image concrète de la voie et comprend πρὸ προσώπου αὐτοῦ comme une action accomplie devant ou auprès de lui.
- source_word: καθʼ ἣν πορεύσεται καὶ κυριεύσει
  choice: qu’il suivra pour se rendre maître
  rationale: La voie est celle par laquelle il avancera; «se rendre maître» exprime la prise de contrôle militaire de κυριεύσει.
- source_word: πάσης τῆς ὀρινῆς
  choice: de toute la région montagneuse
  rationale: ὀρινή désigne ici un territoire montagneux ou de hautes terres.
- source_word: οὐ διαφωνήσει
  choice: sans qu’il manque
  rationale: Dans cette construction, le verbe indique qu’aucun élément ne fera défaut; «manquer» conserve mieux cette nuance que «être perdu».
- source_word: τῶν ἀνδρῶν αὐτοῦ σὰρξ μία οὐδὲ πνεῦμα ζωῆς
  choice: un seul corps parmi ses hommes ni un seul souffle de vie
  rationale: «Corps» transmet en français le sens concret de σάρξ dans cette tournure inhabituelle, tandis que «souffle de vie» conserve l’expression vive du grec.
theological_decisions:
- issue: Sens de σὰρξ dans une promesse de préservation militaire
  choice: corps
  alternative: chair
  rationale: Le mot est concret et non paulinien; «corps» rend ici plus clairement la personne dans sa réalité physique, tandis qu’une note préserve l’image littérale de la «chair».
- issue: Portée de πνεῦμα ζωῆς
  choice: souffle de vie
  alternative: vie
  rationale: La formulation concrète est maintenue sans réduire l’expression à la simple idée abstraite de survie.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe est légèrement restructurée en deux phrases pour éviter une période trop lourde, tout en conservant le ton assuré et solennel du discours de Judith.
