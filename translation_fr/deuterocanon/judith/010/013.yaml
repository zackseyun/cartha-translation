  verdict: revise
  source_fidelity: 'Le projet rend fidèlement le présent vif de κἀγὼ ἔρχομαι, le but exprimé par τοῦ ἀναγγεῖλαι, le rang d’ἀρχιστράτηγος et le sens militaire de κυριεύσει. La coordination de πορεύσεται καὶ κυριεύσει doit toutefois être conservée plus explicitement : « pour se rendre maître » peut suggérer un simple but plutôt que les deux actions futures annoncées. La dernière formule garde volontairement l’idiome corporel difficile de σὰρξ μία et πνεῦμα ζωῆς, sans lui attribuer de sens doctrinal.'
  naturalness: Le français est globalement clair et de registre approprié. « Sans qu’il manque un seul corps parmi ses hommes » est cependant un peu heurté, notamment parce que « il manque » n’a pas de référent immédiatement net. Une formulation déclarative rend mieux l’assurance de Judith tout en conservant l’étrangeté contrôlée de l’image.
  terminology: « Holopherne », « commandant en chef », « forces », « paroles de vérité », « région montagneuse » et « souffle de vie » conviennent au français international moderne et au contexte. « Chair » dans la note est le bon équivalent littéral de σάρξ ; le texte principal peut employer « corps » afin de rester intelligible, avec la note signalant l’idiome grec.
