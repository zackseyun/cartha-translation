  - severity: low
    issue: La construction finale avec « sans qu’il manque » est syntaxiquement moins directe.
    rationale: Le grec formule une assurance négative. « Parmi ses hommes, il ne manquera ni un seul corps ni un souffle de vie » est plus lisible sans supprimer l’idiome délibérément concret.
