    rationale: Dans le grec, les cent hommes sont sélectionnés puis affectés auprès des femmes ; le dernier verbe, ἤγαγον, a pour objet αὐτάς (« elles ») et conserve le sujet pluriel de la narration. La relative française fusionne ces relations et déplace le sujet du dernier acte.
  revised_text: Ils choisirent parmi eux cent hommes et les affectèrent comme escorte à Judith et à sa servante ; puis ils conduisirent celles-ci à la tente d’Holopherne.
