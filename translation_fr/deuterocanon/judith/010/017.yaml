  naturalness: La formulation révisée est naturelle en français international moderne. « Celles-ci » évite l’ambiguïté référentielle qui résulterait de deux emplois successifs de « les » (les cent hommes / les deux femmes).
  terminology: « Affectèrent comme escorte » rend le sens contextuel de παρέζευξαν sans ajouter une notion de protection. « Servante », « tente » et « Holopherne » sont appropriés au registre narratif et à l’usage français.
