  text: And they selected one hundred men from among them, and they escorted her and her maid, and brought them to the tent of Holofernes.
translation:
  language: fr
  text: Ils choisirent parmi eux cent hommes et les affectèrent comme escorte à Judith et à sa servante ; puis ils conduisirent celles-ci à la tente d’Holopherne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέλεξαν ἐξ αὐτῶν
  choice: Ils choisirent parmi eux
  rationale: Cette formulation rend à la fois le choix délibéré exprimé par le verbe et la valeur partitive de ἐξ αὐτῶν, dans un français naturel.
- source_word: ἄνδρας ἑκατόν
  choice: cent hommes
  rationale: Traduction directe de la quantité et du nom, adaptée au registre narratif.
- source_word: παρέζευξαν
  choice: qui escortèrent
  rationale: Dans ce contexte militaire, le verbe désigne l’accompagnement organisé des deux femmes. « Escortèrent » en exprime clairement la fonction sans ajouter l’idée de protection de manière explicite.
- source_word: αὐτῇ
  choice: Judith
  rationale: La reprise du nom propre lève naturellement en français une possible hésitation sur l’antécédent du pronom, sans modifier le référent du grec.
- source_word: τῇ ἄβρᾳ αὐτῆς
  choice: sa servante
  rationale: ἄβρα désigne ici la femme au service de Judith qui l’accompagne. « Servante » est clair, actuel et fidèle à son statut.
- source_word: ἤγαγον αὐτὰς
  choice: les conduisirent
  rationale: Le verbe ἄγω signifie mener ou conduire; « les conduisirent » conserve l’idée d’un déplacement dirigé vers une destination.
- source_word: ἐπὶ τὴν σκηνὴν
  choice: jusqu’à la tente
  rationale: Avec un verbe de mouvement, la préposition marque ici la destination. « Jusqu’à » donne une expression française fluide sans surinterpréter l’entrée dans la tente.
- source_word: Ὀλοφέρνου
  choice: d’Holopherne
  rationale: Forme française usuelle du nom propre biblique, avec l’élision requise.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase conserve l’enchaînement du grec tout en évitant une coordination lourde; la relative rattache clairement l’escorte aux cent hommes.
