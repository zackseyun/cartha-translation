  source_fidelity: 'Le premier membre conserve correctement le sens difficile du futur passif βοηθησόμεθα ἀπό : l''orateur affirme qu''« nous » ne recevrons pas de secours des fils d''Israël. La seconde partie rend bien l''appel d''attention (ἰδού), les deux termes δύναμις et κράτος, et l''idée militaire de παράταξις. Toutefois, « pour former une solide ligne de bataille » explicite davantage que le grec : εἰς παράταξιν ἰσχυράν indique plus sobrement ce qui est requis en vue d''une formation de combat solide.'
