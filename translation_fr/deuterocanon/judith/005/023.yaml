  yaml_path: translation/deuterocanon/judith/005/023.yaml
  text: For we will not be helped by the sons of Israel; for look, they are a people in whom there is neither strength nor might for strong battle formation.
translation:
  language: fr
  text: Car nous ne recevrons aucun secours des fils d’Israël ; car, voyez, c’est un peuple qui n’a ni la force ni la puissance nécessaires à une solide formation de combat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βοηθησόμεθα ἀπό
  choice: ne nous apporteront aucun secours
  rationale: Le futur passif grec signifie littéralement « nous ne serons pas secourus par ». La tournure active retenue est plus naturelle en français tout en conservant le sens formel du texte reçu, malgré la difficulté que présente cette affirmation dans son contexte.
- source_word: ἰδού
  choice: voyez
  rationale: Rend directement l’appel à l’attention sans recourir à l’archaïsme « voici » dans une phrase où aucun nom n’est immédiatement présenté.
- source_word: δύναμις οὐδὲ κράτος
  choice: ni force ni puissance
  rationale: Conserve les deux termes grecs coordonnés et leur effet cumulatif, sans les réduire à une seule idée.
- source_word: παράταξιν ἰσχυράν
  choice: une solide ligne de bataille
  rationale: παράταξις désigne ici la disposition ordonnée des troupes au combat ; « ligne de bataille » est naturel et précis, tandis que « solide » exprime ἰσχυράν.
theological_decisions:
- issue: Sens contextuellement difficile de « nous ne serons pas secourus par les fils d’Israël »
  choice: Conserver l’idée de secours telle qu’elle apparaît dans le texte grec fourni
  alternative: Comprendre le verbe au sens contextuel de « les fils d’Israël ne pourront pas nous résister »
  rationale: Le sens ordinaire de βοηθέω est « venir en aide, secourir ». Corriger implicitement le texte selon le contexte résoudrait une tension réelle sans appui explicite dans la source fournie.
translation_notes:
  register: Français moderne, courant et digne. La syntaxe a été légèrement naturalisée, mais la difficulté sémantique du premier membre a été préservée plutôt que corrigée d’après le contexte.
