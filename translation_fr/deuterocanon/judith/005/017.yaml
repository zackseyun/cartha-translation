  yaml_path: translation/deuterocanon/judith/005/017.yaml
  text: And as long as they did not sin before their God[a], good things were with them[b], because a God who hates injustice is with them.
translation:
  language: fr
  text: Et tant qu’ils ne péchaient pas devant leur Dieu, ils jouissaient de bienfaits, car Dieu est avec eux, lui qui déteste l’injustice.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἕως
  choice: Et tant que
  rationale: Dans ce contexte, ἕως introduit la durée d’une condition; « tant que » l’exprime naturellement en français.
- source_word: οὐχ ἥμαρτον
  choice: ils ne péchaient pas
  rationale: L’imparfait français convient à la valeur durative et répétée créée par « tant que », sans transformer le verbe en état.
- source_word: ἐνώπιον τοῦ θεοῦ αὐτῶν
  choice: devant leur Dieu
  rationale: « Devant » conserve le sens spatial et évaluatif de ἐνώπιον sans préciser indûment « contre ».
- source_word: ἦν μετʼ αὐτῶν τὰ ἀγαθά
  choice: les biens étaient avec eux
  rationale: Cette formulation garde l’image grecque et l’étendue de τὰ ἀγαθά, sans la réduire à la seule prospérité matérielle ni l’expliciter en « bénédictions ».
- source_word: ὅτι
  choice: parce que
  rationale: Le connecteur introduit ici la raison de leur situation favorable.
- source_word: θεὸς μισῶν ἀδικίαν
  choice: un Dieu qui déteste l’injustice
  rationale: « Un Dieu qui… » restitue la portée qualitative du nom sans article; « déteste » est actuel et digne, tandis qu’« injustice » garde la dimension morale et juridique de ἀδικία.
- source_word: μετʼ αὐτῶν ἐστίν
  choice: est avec eux
  rationale: Le présent du grec est conservé malgré le temps passé de la proposition précédente, afin de préserver le changement de temps et sa portée caractérisante.
theological_decisions:
- issue: Changement de temps entre ἦν et ἐστίν
  choice: 'Conserver le présent final : « est avec eux »'
  alternative: 'Harmoniser au passé : « était avec eux »'
  rationale: Le grec passe d’une situation passée à une affirmation présente sur Dieu. La traduction maintient cette tension au lieu de la lisser.
- issue: Portée de τὰ ἀγαθά
  choice: « les biens »
  alternative: « la prospérité » ou « les bénédictions »
  rationale: « Les biens » préserve l’expression générale du grec et évite de décider si elle désigne surtout la prospérité matérielle ou des bienfaits divins.
- issue: Sens de ἀδικία
  choice: « injustice »
  alternative: « faute », « mal » ou « iniquité »
  rationale: « Injustice » reste large et intelligible, conserve la nuance morale et juridique, et n’importe pas un vocabulaire doctrinal plus spécialisé.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure inhabituelle « les biens étaient avec eux » est volontairement conservée pour refléter l’image grecque; aucun appel de note n’est nécessaire.
