revisions:
- from: Et tant qu’ils ne péchaient pas devant leur Dieu, les biens étaient avec eux, parce qu’un Dieu qui déteste l’injustice est avec eux.
  to: Et tant qu’ils ne péchaient pas devant leur Dieu, ils jouissaient de bienfaits, car Dieu est avec eux, lui qui déteste l’injustice.
  rationale: 'La révision remplace deux calques qui gênaient le français moderne tout en maintenant les éléments essentiels du grec: la condition temporelle, le péché devant Dieu, les réalités favorables dont le peuple jouissait, la causalité, ainsi que le présent caractérisant de la présence de Dieu et son opposition à l’injustice. Aucune note n’est requise, car les choix retenus ne masquent pas une ambiguïté textuelle significative.'
