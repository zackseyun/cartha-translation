base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/009.yaml
  text: And their God told them to go out from their sojourning and to go into the land of Canaan[a]; and they settled there[b], and became very wealthy in gold and silver and in very many livestock.
translation:
  language: fr
  text: Et leur Dieu leur dit de quitter le lieu où ils vivaient comme étrangers[a] et de se rendre au pays de Canaan. Ils s’y établirent et devinrent très riches en or, en argent et en très nombreux animaux d’élevage[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec peut désigner leur lieu de séjour ou leur condition de résidence en tant qu’étrangers.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « se multiplièrent en or, en argent et en animaux d’élevage très nombreux » ; le grec souligne le grand accroissement de leurs biens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν ... ἐξελθεῖν ... καὶ πορευθῆναι
  choice: leur dit de quitter ... et de se rendre
  rationale: La construction avec εἶπεν suivi des infinitifs exprime ici une parole directive. « Dit de » reste proche du grec sans renforcer indûment le propos en « ordonna ».
- source_word: παροικίας
  choice: pays où ils résidaient en étrangers
  rationale: παροικία désigne la condition ou le lieu de résidence de personnes vivant hors de leur patrie. Cette formulation explicite naturellement en français la nuance d’étranger résident.
- source_word: γῆν Χανάαν
  choice: pays de Canaan
  rationale: « Pays de Canaan » restitue γῆ et correspond à l’usage géographique naturel en français biblique moderne.
- source_word: κατῴκησαν
  choice: s’y établirent
  rationale: Le verbe indique qu’ils prirent résidence dans ce pays; « s’établirent » rend cette idée plus précisément que le simple « habitèrent ».
- source_word: ἐπληθύνθησαν χρυσίῳ καὶ ἀργυρίῳ
  choice: devinrent très riches en or et en argent
  rationale: Littéralement, le grec évoque une forte multiplication ou augmentation quant à ces biens. En français, « devinrent très riches » communique naturellement l’accroissement matériel impliqué par le contexte.
- source_word: κτήνεσιν πολλοῖς σφόδρα
  choice: en troupeaux extrêmement nombreux
  rationale: κτήνη désigne largement les animaux domestiques ou le bétail, tandis que πολλοῖς σφόδρα marque une quantité très grande. « Troupeaux » convient au contexte patrimonial sans limiter le mot aux bovins.
theological_decisions:
- issue: Nature de la parole divine exprimée par εἶπεν suivi d’infinitifs
  choice: Dieu leur dit de partir et de se rendre en Canaan
  alternative: Dieu leur ordonna de partir et de se rendre en Canaan
  rationale: Le contexte donne à la parole une portée directive, mais le verbe grec est « dire » et non un verbe explicite de commandement. La traduction conserve cette tension.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe est fluide sans effacer la nuance de résidence étrangère ni l’image grecque d’un accroissement considérable des possessions.
