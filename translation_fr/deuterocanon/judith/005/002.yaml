  text: And he became very angry[a], and he summoned all the rulers of Moab, the generals of Ammon, and all the satraps of the coastland[b],
translation:
  language: fr
  text: Il entra dans une violente colère[a] et convoqua tous les dirigeants de Moab, les chefs militaires d’Ammon et tous les satrapes de la région côtière[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fut saisi d’une très grande fureur ». Le grec renforce fortement l’expression de la colère.
    reason: lexical_alternative
  - marker: b
    text: Ou « du littoral » ou « de la côte ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠργίσθη θυμῷ σφόδρα
  choice: entra dans une violente colère
  rationale: Cette tournure française naturelle rend à la fois la valeur ingressive de l’aoriste et l’intensification exprimée par θυμῷ σφόδρα, sans exagérer ni affaiblir le grec.
- source_word: ἐκάλεσεν
  choice: convoqua
  rationale: Dans le contexte d’un dirigeant qui fait venir des responsables, « convoqua » exprime clairement un appel officiel et autoritaire.
- source_word: ἄρχοντας
  choice: dirigeants
  rationale: Le terme désigne des personnes exerçant l’autorité; « dirigeants » est moderne, large et adapté au contexte politique.
- source_word: στρατηγοὺς
  choice: chefs militaires
  rationale: Cette expression rend le rôle de commandement sans imposer trop précisément un grade militaire moderne comme « généraux ».
- source_word: σατράπας
  choice: satrapes
  rationale: Le terme historique français conserve la couleur politico-administrative du grec plutôt que de la réduire à « gouverneurs ».
- source_word: τῆς παραλίας
  choice: de la région côtière
  rationale: παραλία désigne ici un territoire situé le long de la côte; « région côtière » est clair et naturel en français moderne.
- source_word: Μωὰβ
  choice: Moab
  rationale: Forme française traditionnelle du nom géographique et ethnique.
- source_word: Ἀμμὼν
  choice: Ammon
  rationale: Forme française traditionnelle du nom du peuple.
