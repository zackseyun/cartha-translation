lexical_decisions:
- source_word: κατεξήρανεν
  choice: assécha
  rationale: Le verbe composé exprime l’action de rendre complètement sec. « Assécha » est naturel en français, conserve la valeur causative et convient à l’allusion au passage de la mer.
- source_word: ὁ θεὸς
  choice: Dieu
  rationale: Traduction directe du sujet grec articulé ; en français, le nom « Dieu » s’emploie ici sans article.
- source_word: τὴν ἐρυθρὰν θάλασσαν
  choice: la mer Rouge
  rationale: Le texte grec porte explicitement « la mer Rouge », désignation conventionnelle dans la tradition de la Septante.
- source_word: ἔμπροσθεν αὐτῶν
  choice: devant eux
  rationale: Cette formulation rend simplement et fidèlement la position de la mer par rapport au peuple au moment de l’intervention divine.
theological_decisions:
- issue: Désignation de la mer dans l’allusion à la sortie d’Égypte
  choice: la mer Rouge
  alternative: la mer des Roseaux
  rationale: La source immédiate est le grec de la Septante, qui lit explicitement ἐρυθρὰν θάλασσαν, « mer Rouge ». L’équivalent fondé sur la tradition hébraïque est signalé en note sans être substitué au témoignage grec dans le texte principal.
translation_notes:
  register: Français moderne, clair et digne. Le passé simple « assécha » convient au registre narratif biblique sans être archaïque ; la syntaxe reste proche du grec tout en étant naturelle.
