  text: Therefore we will indeed go up[a], and they will become food for all your army, master Holofernes.
translation:
  language: fr
  text: C’est pourquoi nous monterons bel et bien, et ils deviendront de la nourriture[a] pour toute ton armée, maître Holopherne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une proie » ou « quelque chose à dévorer » ; le grec dit littéralement qu’ils deviendront « pour être dévorés » par toute l’armée.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ δὴ
  choice: C’est pourquoi ... bel et bien
  rationale: διό introduit la conclusion, tandis que δή la souligne. « C’est pourquoi » et « bel et bien » rendent ensemble cette inférence appuyée dans un français naturel.
- source_word: ἀναβησόμεθα
  choice: nous monterons
  rationale: Le futur moyen de ἀναβαίνω désigne ici le fait de monter, vraisemblablement dans le cadre d’un mouvement militaire. « Nous monterons » conserve le sens spatial sans explicitation indue.
- source_word: ἔσονται εἰς κατάβρωμα
  choice: ils deviendront une proie
  rationale: La construction εἰμί avec εἰς et l’accusatif exprime ici un résultat. κατάβρωμα désigne ce qui est mangé ou dévoré; « une proie » restitue naturellement l’image d’une population livrée à l’armée.
- source_word: πάσης τῆς στρατειᾶς σου
  choice: pour toute ton armée
  rationale: στρατειά désigne l’armée ou la force militaire, et πάσης en exprime la totalité. La formulation est directe et idiomatique.
- source_word: δέσποτα
  choice: maître
  rationale: Le vocatif marque l’autorité du destinataire. « Maître » le distingue de κύριος et évite d’ajouter une résonance théologique absente du contexte.
- source_word: Ὀλοφέρνη
  choice: Holopherne
  rationale: La forme française traditionnelle et courante du nom propre est retenue.
theological_decisions:
- issue: Traduction de δέσποτα en apostrophe directe
  choice: maître
  alternative: seigneur; souverain
  rationale: « Maître » conserve le rapport hiérarchique sans confondre δέσποτα avec κύριος ni introduire une portée religieuse non exigée par le grec.
- issue: Image de κατάβρωμα
  choice: une proie
  alternative: de la nourriture; quelque chose à dévorer
  rationale: « Une proie » est naturel dans un contexte militaire tout en maintenant l’idée d’être livré à la dévoration. Une note conserve l’image grecque plus littérale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’ordre logique et l’emphase du grec sont conservés; l’apostrophe finale reste solennelle sans archaïsme excessif.
