  text: And it happened[a], when Achior had stopped speaking these words, that all the people around the tent and standing about began to grumble, and the nobles of Holofernes and all who lived by the seacoast and in Moab said to strike him down.
translation:
  language: fr
  text: Quand Achior eut fini de prononcer ces paroles, tout le peuple qui entourait la tente et se tenait autour se mit à murmurer. Les dignitaires d’Holopherne et tous les habitants de la région côtière et de Moab dirent alors qu’il fallait l’abattre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le frapper à mort » ou « le tuer ». Le verbe grec est violent, mais ne précise pas entièrement la manière dont ils veulent s’en prendre à lui.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ὡς
  choice: Quand
  rationale: Cette formule introduit ici la réaction qui suit. En français moderne, « Quand » restitue naturellement la transition et le rapport temporel sans conserver un calque lourd comme « Et il arriva que, lorsque ».
- source_word: ἐπαύσατο ... λαλῶν τοὺς λόγους τούτους
  choice: eut fini de prononcer ces paroles
  rationale: Le passé antérieur marque clairement l’achèvement du discours avant la réaction de la foule; « prononcer ces paroles » garde la référence explicite aux λόγους τούτους.
- source_word: ἐγόγγυσεν
  choice: se mit à murmurer
  rationale: Le verbe exprime un murmure de mécontentement ou une protestation à voix basse. La tournure « se mit à » rend naturellement la valeur initiale du récit.
- source_word: πᾶς ὁ λαὸς ὁ κυκλῶν τὴν σκηνὴν καὶ περιστὼς
  choice: tout le peuple qui entourait la tente et se tenait là
  rationale: La formulation conserve les deux participes grecs, tout en évitant en français une répétition maladroite de « autour ».
- source_word: οἱ μεγιστᾶνες Ὀλοφέρνου
  choice: les dignitaires d’Holopherne
  rationale: « Dignitaires » désigne naturellement les hommes de haut rang attachés à Holopherne, sans l’association féodale plus étroite que peut porter « nobles ».
- source_word: οἱ κατοικοῦντες τὴν παραλίαν καὶ τὴν Μωὰβ
  choice: tous les habitants de la région côtière et de Moab
  rationale: « Région côtière » rend le sens géographique de παραλία, tandis que la coordination garde distinctement le littoral et Moab.
- source_word: συγκόψαι αὐτόν
  choice: de l’abattre
  rationale: « Abattre » transmet la violence et l’issue vraisemblablement mortelle du verbe sans préciser indûment le moyen employé.
