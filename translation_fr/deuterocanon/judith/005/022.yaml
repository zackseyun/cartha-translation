revisions:
- from: Quand Achior eut fini de prononcer ces paroles, tout le peuple qui entourait la tente et se tenait là se mit à murmurer. Les dignitaires d’Holopherne et tous les habitants de la région côtière et de Moab dirent alors de l’abattre[a].
  to: Quand Achior eut fini de prononcer ces paroles, tout le peuple qui entourait la tente et se tenait autour se mit à murmurer. Les dignitaires d’Holopherne et tous les habitants de la région côtière et de Moab dirent alors qu’il fallait l’abattre[a].
  rationale: La révision corrige la construction française du discours indirect tout en maintenant l’ambiguïté lexicale de συγκόψαι et son ancrage de note. Elle remplace également « se tenait là » par une formulation qui reflète plus explicitement la seconde indication spatiale du grec.
  reviewer_model: gpt-5.6-terra
