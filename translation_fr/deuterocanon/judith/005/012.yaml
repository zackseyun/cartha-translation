  text: And they cried out to their God[a], and he struck the land of Egypt with plagues for which there was no healing; and the Egyptians drove them out from before them.
translation:
  language: fr
  text: Ils crièrent vers leur Dieu, et il frappa le pays d’Égypte de fléaux sans remède ; et les Égyptiens les chassèrent loin d’eux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de devant leur face », expression de tournure sémitique signifiant « hors de leur présence ». Le pronom renvoie très probablement aux Égyptiens, bien que sa forme grecque soit grammaticalement ambiguë.'
    reason: Précision sur l’idiome et sur le référent du pronom.
lexical_decisions:
- source_word: ἀνεβόησαν
  choice: crièrent
  rationale: Le verbe exprime un appel poussé avec force. « Crièrent vers leur Dieu » conserve à la fois l’intensité et la valeur de supplication sans ajouter explicitement l’idée de prière.
- source_word: ἐπάταξεν
  choice: frappa
  rationale: Le verbe signifie « frapper ». Ce choix moderne et direct maintient la force de l’action divine.
- source_word: γῆν Αἴγυπτον
  choice: le pays d’Égypte
  rationale: γῆ désigne ici le territoire égyptien. « Le pays d’Égypte » restitue naturellement cette portée géographique.
- source_word: πληγαῖς
  choice: de fléaux
  rationale: Dans ce contexte évoquant l’Exode, πληγαί désigne des coups ou calamités envoyés sur l’Égypte. « Fléaux » convient mieux que le sens corporel courant de « plaies » en français moderne.
- source_word: ἐν αἷς οὐκ ἦν ἴασις
  choice: contre lesquels il n’y avait aucun remède
  rationale: ἴασις signifie guérison ou cure. La formulation française garde l’image d’un mal impossible à soigner tout en se rattachant clairement aux fléaux.
- source_word: ἐξέβαλον
  choice: chassèrent
  rationale: Le verbe signifie jeter dehors ou expulser. « Chassèrent » est idiomatique et conserve la vigueur de l’expulsion.
- source_word: ἀπὸ προσώπου αὐτῶν
  choice: loin d’eux
  rationale: L’expression grecque, de tournure sémitique, signifie littéralement « de devant leur face » et désigne ici l’éloignement hors de la présence des Égyptiens. « Loin d’eux » est naturel en français, tandis que la note conserve la forme et l’ambiguïté du texte source.
theological_decisions:
- issue: Référent de αὐτῶν dans ἀπὸ προσώπου αὐτῶν
  choice: 'Le pronom renvoie vraisemblablement aux Égyptiens : ils chassèrent les Israélites loin de leur présence.'
  alternative: Le pronom pourrait, sur le seul plan grammatical, être rapporté aux Israélites.
  rationale: Le sujet immédiatement exprimé, « les Égyptiens », et l’idiome d’expulsion favorisent le premier sens. Comme le pronom grec n’élimine pas absolument l’autre analyse, la note signale cette ambiguïté sans la surcharger dans le texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme narratif et les coordinations du grec sont conservés, avec un point-virgule pour rendre la longue phrase lisible. « Celui-ci » explicite uniquement le sujet implicite de ἐπάταξεν et évite une succession de pronoms potentiellement confuse.
