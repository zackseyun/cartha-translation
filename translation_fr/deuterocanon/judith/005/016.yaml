review_pass:
  verdict: revise
  source_fidelity: La liste des peuples, la valeur collective des singuliers grecs, l’expulsion forcée et la durée de résidence sont bien rendues. Toutefois, « chassèrent devant eux » est ambigu en français et peut évoquer le fait de pousser quelqu’un devant soi, plutôt que de l’écarter de sa présence. « Chassèrent de devant eux » rend précisément l’idiome ἐκ προσώπου αὐτῶν.
  naturalness: La formulation révisée reste claire dans un français moderne soutenu. « De devant eux » est ici une locution établie et nécessaire pour éviter l’ambiguïté de « devant eux ».
  terminology: Les ethnonymes pluriels sont naturels en français et représentent correctement les collectifs grecs. « Sichémites » est un choix contextuellement justifié, à condition de conserver la note signalant que Συχέμ peut refléter Sichem ou ses habitants. « Guirgasiens » est une forme française biblique usuelle.
  issues:
  - severity: medium
    issue: « chassèrent devant eux » ne rend pas sans ambiguïté ἐκ προσώπου αὐτῶν.
    rationale: En français, chasser quelqu’un « devant soi » peut signifier le faire avancer devant soi. Le grec exprime l’éloignement « de devant / de la présence de » ceux qui expulsent. L’ajout de « de » corrige ce sens sans interprétation supplémentaire.
  revised_text: Ils chassèrent de devant eux les Cananéens, les Phérézéens, les Jébuséens, les Sichémites[a] et tous les Guirgasiens, puis ils habitèrent dans ce pays pendant de nombreux jours.
