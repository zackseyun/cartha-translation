  text: And they drove out from before them the Canaanite[a], the Perizzite, the Jebusite, the Shechemite, and all the Girgashites, and they lived in it for many days.
translation:
  language: fr
  text: Ils chassèrent de devant eux les Cananéens, les Phérézéens, les Jébuséens, les Sichémites[a] et tous les Guirgasiens, puis ils habitèrent dans ce pays pendant de nombreux jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « Sichem » ; dans cette liste, la forme peut désigner les Sichémites, ou plus généralement Sichem et ses habitants.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέβαλον
  choice: chassèrent
  rationale: Le verbe exprime une éviction forcée. « Chassèrent » est naturel en français actuel et conserve la force du récit.
- source_word: ἐκ προσώπου αὐτῶν
  choice: devant eux
  rationale: Cette tournure d’influence sémitique signifie que ces peuples furent écartés de leur présence. « Devant eux » en préserve l’image sans lourdeur excessive.
- source_word: τὸν Χαναναῖον καὶ τὸν Φερεζαῖον καὶ τὸν Ἰεβουσαῖον
  choice: les Cananéens, les Phérézéens, les Jébuséens
  rationale: Les singuliers grecs ont une valeur collective. Le pluriel est la manière naturelle de désigner ces peuples en français.
- source_word: τὸν Συχέμ
  choice: les Sichémites[a]
  rationale: Dans cette liste de peuples, le nom fonctionne vraisemblablement comme un ethnonyme collectif, mais sa forme peut aussi renvoyer à Sichem ou à ses habitants; la note conserve cette ambiguïté.
- source_word: πάντας τοὺς Γεργεσαίους
  choice: tous les Guirgasiens
  rationale: Le pluriel accompagné de πάντας appelle directement « tous les Guirgasiens ».
- source_word: κατῴκησαν
  choice: habitèrent
  rationale: Le verbe indique une résidence durable. « Habitèrent » reste proche du grec tout en étant clair et digne.
- source_word: ἐν αὐτῇ
  choice: dans ce pays
  rationale: Le pronom féminin renvoie naturellement au pays évoqué dans le contexte. L’explicitation évite un pronom français sans antécédent immédiatement clair.
- source_word: ἡμέρας πολλάς
  choice: pendant de nombreux jours
  rationale: Cette traduction garde l’image temporelle concrète du grec plutôt que de la généraliser en « longtemps ».
theological_decisions:
- issue: Rendre la dépossession sans en atténuer la force
  choice: Ils chassèrent devant eux… puis ils habitèrent dans ce pays
  alternative: Ils expulsèrent… et s’y établirent
  rationale: 'La formulation conserve sans euphémisme l’affirmation du récit: les populations antérieures sont chassées et Israël occupe ensuite le pays, sans ajouter d’évaluation théologique.'
translation_notes:
  register: Français international moderne, clair et soutenu. Les noms de peuples sont mis au pluriel selon l’usage français, tout en conservant leur valeur collective. « De nombreux jours » maintient la formulation concrète de la source.
