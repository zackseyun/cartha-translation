base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/007.yaml
  text: And formerly they lived as sojourners in Mesopotamia[a], because they were not willing to follow the gods of their fathers[b], who were in the land of the Chaldeans.
translation:
  language: fr
  text: Autrefois, ils séjournèrent en Mésopotamie[a], parce qu’ils ne voulurent pas suivre les dieux de leurs pères, qui étaient dans le pays des Chaldéens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils vécurent en étrangers en Mésopotamie ». Le verbe grec désigne le fait de résider quelque part sans y être chez soi.'
    reason: lexical_alternative
  - marker: b
    text: 'La proposition grecque peut aussi se comprendre plus littéralement : « qui étaient devenus dans le pays des Chaldéens » ; elle peut suggérer qu’ils y avaient pris naissance ou qu’ils s’y trouvaient.'
    reason: alternative_reading
lexical_decisions:
- source_word: παρῴκησαν
  choice: ils séjournèrent
  rationale: Le verbe indique qu’ils résidaient dans le pays sans y être chez eux. « Séjournèrent » exprime naturellement en français cette résidence d’étrangers, sans imposer à tort l’idée d’un passage très bref.
- source_word: τὸ πρότερον
  choice: Autrefois
  rationale: L’expression situe ce séjour dans une période antérieure du récit; « autrefois » est clair, concis et naturel.
- source_word: ἐν τῇ Μεσοποταμίᾳ
  choice: en Mésopotamie
  rationale: Forme géographique française usuelle.
- source_word: οὐκ ἐβουλήθησαν
  choice: ils ne voulurent pas
  rationale: Cette formulation conserve la dimension volontaire de βούλομαι sans renforcer le texte jusqu’à « ils refusèrent ».
- source_word: ἀκολουθῆσαι
  choice: suivre
  rationale: Le verbe garde ici son image fondamentale tout en exprimant naturellement l’adhésion religieuse, sans introduire explicitement le verbe « adorer », absent du grec.
- source_word: τοῖς θεοῖς τῶν πατέρων αὐτῶν
  choice: les dieux de leurs pères
  rationale: Traduction directe qui maintient la référence masculine précise de πατέρων et le caractère ancestral de ces dieux.
- source_word: οἳ ἐγένοντο ἐν γῇ Χαλδαίων
  choice: qui étaient dans le pays des Chaldéens
  rationale: Dans ce contexte, ἐγένοντο peut décrire la présence ou l’établissement de ces dieux dans ce pays. Cette formulation est idiomatique, tandis que la note conserve le sens plus littéral et l’ambiguïté possible.
theological_decisions:
- issue: Ne pas transformer le fait de « suivre » les dieux ancestraux en vocabulaire explicite de culte
  choice: ils ne voulurent pas suivre les dieux de leurs pères
  alternative: ils refusèrent d’adorer les dieux de leurs ancêtres
  rationale: Le grec exprime une absence de volonté de suivre, mais n’emploie pas ici de verbe signifiant explicitement « adorer ». Le choix retenu préserve la formulation et la tension du texte.
- issue: Référent et valeur de la proposition relative finale
  choice: les dieux … qui étaient dans le pays des Chaldéens
  alternative: les dieux … qui avaient pris naissance dans le pays des Chaldéens
  rationale: Le relatif masculin pluriel se rattache grammaticalement aux dieux. La valeur exacte de ἐγένοντο reste toutefois ouverte entre présence, établissement et origine; la traduction principale privilégie un français naturel et la note signale l’autre compréhension.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif biblique sans archaïsme excessif. « Pays des Chaldéens » conserve la tournure géographique du grec.
