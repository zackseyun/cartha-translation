base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/018.yaml
  text: But when they turned away from the path that he had appointed for them[a], they were utterly destroyed in many wars, to a very great extent[b], and they were taken captive into a land not their own, and the temple of their God was laid level with the ground, and their cities were seized by their adversaries.
translation:
  language: fr
  text: Mais quand ils se détournèrent de la voie qu’il avait établie pour eux[a], ils furent anéantis au cours de nombreuses guerres, avec une extrême violence[b] ; ils furent emmenés captifs dans un pays qui n’était pas le leur, le temple de leur Dieu fut rasé, et leurs villes tombèrent au pouvoir de leurs adversaires.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du chemin ». Le mot grec peut désigner une route au sens propre ou, comme ici, une manière de vivre établie par Dieu.
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque souligne fortement l’ampleur ou la gravité de leur destruction ; elle pourrait aussi être comprise comme une indication de longue durée.
    reason: source_ambiguity
lexical_decisions:
- source_word: ἀπέστησαν ἀπὸ τῆς ὁδοῦ
  choice: se détournèrent de la voie
  rationale: Cette expression naturelle restitue l’idée d’un abandon de la conduite prescrite, sans préciser davantage s’il s’agit d’une rébellion formelle ou d’une apostasie.
- source_word: διέθετο
  choice: avait établie
  rationale: Le verbe désigne ici ce que Dieu avait fixé ou disposé pour eux. « Établie » convient à une voie de conduite prescrite.
- source_word: ἐξωλεθρεύθησαν
  choice: furent décimés
  rationale: Le verbe grec est fortement intensif. Dans ce contexte, « décimés » exprime une destruction humaine massive tout en restant compatible avec la captivité des survivants mentionnée ensuite.
- source_word: ἐν πολλοῖς πολέμοις
  choice: au cours de nombreuses guerres
  rationale: Cette formulation française rend naturellement le cadre dans lequel les destructions eurent lieu et conserve le pluriel de πολέμοις.
- source_word: ἐπὶ πολὺ σφόδρα
  choice: et cela très durement
  rationale: La formule renforce fortement l’ampleur ou la gravité des pertes. Cette tournure conserve son intensité sans lui imposer explicitement une valeur temporelle.
- source_word: ᾐχμαλωτεύθησαν
  choice: furent emmenés captifs
  rationale: Le choix exprime clairement la capture forcée et le déplacement vers un autre pays.
- source_word: εἰς γῆν οὐκ ἰδίαν
  choice: dans un pays qui n’était pas le leur
  rationale: Cette traduction maintient explicitement le contraste possessif du grec plutôt que de le réduire à « un pays étranger ».
- source_word: ὁ ναὸς τοῦ θεοῦ αὐτῶν
  choice: le temple de leur Dieu
  rationale: Dans ce contexte juif, « temple » est le terme français le plus précis et le plus naturel.
- source_word: ἐγενήθη εἰς ἔδαφος
  choice: fut rasé
  rationale: « Fut rasé » exprime de façon concise et idiomatique la destruction du temple jusqu’au niveau du sol.
- source_word: ἐκρατήθησαν ὑπὸ τῶν ὑπεναντίων
  choice: tombèrent au pouvoir de leurs adversaires
  rationale: Cette formulation indique que les villes passèrent sous le contrôle de forces hostiles sans préciser indûment si elles furent seulement prises ou durablement occupées.
theological_decisions:
- issue: Agent du jugement divin
  choice: Relier les désastres à l’abandon de la voie établie par Dieu sans faire explicitement de Dieu l’agent grammatical de chaque calamité.
  alternative: Dire que Dieu les détruisit, les livra à la captivité et abandonna leurs villes à leurs ennemis.
  rationale: Le grec établit un rapport entre leur éloignement et les calamités qui suivent, mais emploie des verbes passifs et ne nomme pas Dieu comme agent direct de chacune d’elles. La traduction conserve cette tension.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit historique. La ponctuation maintient en une seule phrase la longue construction cumulative du grec, tandis que le point-virgule en clarifie la lecture.
