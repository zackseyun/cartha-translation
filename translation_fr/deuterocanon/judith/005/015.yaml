    rationale: « Détruisirent entièrement tous les habitants » est compréhensible mais peu idiomatique, car on ne « détruit » pas naturellement des personnes en français. « Anéantirent tous les habitants » rend la force du verbe grec et la totalité exprimée par πάντας.
