  source_fidelity: 'Le sens global et la chronologie sont justes : κατοίκηση en territoire amorrite, destruction de tous les gens de Heshbon par leur force, puis franchissement du Jourdain et prise de possession de la région montagneuse. « S’établirent » ajoute toutefois légèrement l’idée d’installation, là où ᾤκησαν exprime plus simplement le fait d’habiter. La tournure « détruisirent entièrement tous les habitants » est moins idiomatique en français pour des personnes.'
