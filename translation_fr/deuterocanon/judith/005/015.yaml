  text: And they lived in the land of the Amorites[a], and by their strength they destroyed all the Heshbonites; and after crossing the Jordan[b], they took possession of all the hill country.
translation:
  language: fr
  text: Ils habitèrent dans le pays des Amorites et, par leur force, anéantirent tous les habitants de Heshbon. Après avoir traversé le Jourdain, ils prirent possession de toute la région montagneuse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils héritèrent de toute la région montagneuse ». Le verbe grec peut évoquer le fait de recevoir un bien en héritage ou en possession ; ici, il désigne l’entrée en possession d’un territoire.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾤκησαν
  choice: s’établirent
  rationale: L’aoriste de οἰκέω peut désigner le fait d’habiter ou de s’établir dans un lieu. Dans cette succession d’événements, « s’établirent » exprime naturellement l’installation sur le territoire.
- source_word: γῇ Ἀμορραίων
  choice: le pays des Amorites
  rationale: Le génitif désigne le territoire associé aux Amorites. « Pays » est ici naturel et ne suggère pas nécessairement un État moderne.
- source_word: ἐξωλόθρευσαν
  choice: détruisirent entièrement
  rationale: Le verbe exprime une destruction complète. Cette formulation conserve sa force sans employer le terme moderne et potentiellement technique « exterminèrent ».
- source_word: πάντας τοὺς Ἐσεβωνείτας
  choice: tous les habitants de Heshbon
  rationale: L’ethnique grec désigne les gens de Heshbon. La périphrase est immédiatement compréhensible en français moderne et conserve la référence géographique.
- source_word: ἐν τῇ ἰσχύι αὐτῶν
  choice: par leur force
  rationale: La préposition ἐν peut ici indiquer le moyen; « par leur force » rend clairement l’idée que leur puissance leur permit d’accomplir cette destruction.
- source_word: διαβάντες τὸν Ἰορδάνην
  choice: après avoir traversé le Jourdain
  rationale: Le participe aoriste indique une action antérieure au verbe principal. La tournure française rend explicitement et naturellement cette succession.
- source_word: ἐκληρονόμησαν
  choice: prirent possession de
  rationale: κληρονομέω peut signifier hériter, recevoir en possession ou entrer en possession. Dans ce contexte territorial, « prirent possession de » est clair tout en laissant une note signaler la nuance d’héritage.
- source_word: πᾶσαν τὴν ὀρεινήν
  choice: toute la région montagneuse
  rationale: Employé substantivement, ἡ ὀρεινή désigne une région de hauteurs ou un pays montagneux. « Région montagneuse » est précis et naturel en français international.
