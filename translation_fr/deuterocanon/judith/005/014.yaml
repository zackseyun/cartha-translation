lexical_decisions:
- source_word: ἤγαγεν
  choice: conduisit
  rationale: L’aoriste de ἄγω exprime ici l’action de mener un peuple en déplacement. « Conduisit » est naturel et conserve le rôle actif du sujet.
- source_word: εἰς ὁδὸν
  choice: sur la route
  rationale: La tournure indique que le peuple est amené sur un itinéraire. « Sur la route » restitue l’image concrète sans imposer une destination précise.
- source_word: τοῦ Σεινὰ καὶ Καδής Βαρνή
  choice: du Sinaï et de Qadesh-Barnéa
  rationale: Les génitifs dépendent de « route » et peuvent désigner un itinéraire associé à ces lieux ou qui y conduit. Les formes françaises usuelles des toponymes sont retenues.
- source_word: ἐξέβαλον
  choice: chassèrent
  rationale: Dans ce contexte territorial, ἐκβάλλω désigne l’expulsion forcée des habitants. « Chassèrent » est idiomatique et garde cette force.
- source_word: πάντας
  choice: tous
  rationale: Le terme a une portée totalisante, directement conservée par « tous ».
- source_word: τοὺς κατοικοῦντας
  choice: ceux qui habitaient
  rationale: Cette formulation moderne préserve la valeur verbale du participe grec plutôt que de la réduire au nom « habitants ».
- source_word: ἐν τῇ ἐρήμῳ
  choice: dans le désert
  rationale: ἔρημος désigne ici une région inhabitée ou aride. « Désert » est le terme géographique biblique le plus naturel en français moderne.
