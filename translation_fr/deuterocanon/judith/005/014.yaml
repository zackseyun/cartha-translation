translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve le changement de sujet entre « il conduisit » et « ils chassèrent ». « Puis » rend clairement l’enchaînement narratif de καί sans alourdir la phrase. La virgule finale est maintenue puisque le verset se prolonge syntaxiquement dans le contexte.
