  text: And he led them onto the way of Sinai and Kadesh-barnea[a]; and they drove out all who were living in the wilderness[b],
translation:
  language: fr
  text: Il les conduisit sur la route du Sinaï et de Qadesh-Barnéa[a], et ils chassèrent tous ceux qui habitaient dans le désert[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur la route qui menait au Sinaï et à Qadesh-Barnéa ». L’expression grecque « la route du Sinaï et de Qadesh-Barnéa » peut désigner l’itinéraire associé à ces lieux ou celui qui y conduit.
