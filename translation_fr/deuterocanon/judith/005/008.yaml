base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/008.yaml
  text: They departed from the way of their fathers and worshiped the God of heaven[a], the God whom they had come to know. And they were driven out from before their gods, and fled to Mesopotamia[b], and lived there as foreigners for many days.
translation:
  language: fr
  text: Ils quittèrent la voie de leurs pères et adorèrent le Dieu du ciel, le Dieu qu’ils avaient appris à connaître[a]. Ils les chassèrent de devant leurs dieux[b], puis s’enfuirent en Mésopotamie et y vécurent en étrangers pendant de nombreux jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Dieu qu’ils avaient reconnu ». Le grec peut évoquer aussi bien le fait d’être parvenu à le connaître qu’une reconnaissance décisive.'
    reason: lexical_alternative
  - marker: b
    text: 'La construction grecque est condensée : le verbe est à l’actif pluriel, mais son sujet et l’antécédent précis de « les » ne sont pas explicités. « De devant leurs dieux » conserve l’expression grecque inhabituelle et rattache l’expulsion à leurs dieux.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξέβησαν ἐξ ὁδοῦ τῶν γονέων αὐτῶν
  choice: Ils quittèrent la voie de leurs pères
  rationale: L’expression conserve la métaphore grecque de la « voie » tout en indiquant naturellement l’abandon des pratiques ancestrales. « Pères » convient au registre biblique sans exclure l’idée plus large d’ancêtres.
- source_word: προσεκύνησαν
  choice: adorèrent
  rationale: Dans ce contexte religieux, le verbe désigne le culte rendu à Dieu, et non une simple prosternation ou une marque ordinaire d’hommage.
- source_word: τῷ θεῷ τοῦ οὐρανοῦ
  choice: le Dieu du ciel
  rationale: Traduction directe d’un titre biblique reconnu, naturelle en français contemporain.
- source_word: θεῷ ᾧ ἐπέγνωσαν
  choice: le Dieu qu’ils avaient appris à connaître
  rationale: Le verbe peut exprimer le fait de parvenir à la connaissance ou à la reconnaissance. Cette formulation rend l’aspect décisif du verbe à l’aoriste sans prétendre préciser davantage la nature de cette connaissance.
- source_word: ἐξέβαλον αὐτοὺς ἀπὸ προσώπου τῶν θεῶν αὐτῶν
  choice: On les chassa alors de devant leurs dieux
  rationale: Le grec emploie un actif pluriel dont le sujet n’est pas exprimé dans cette proposition condensée. Le pronom indéfini « on » maintient cet agent non identifié, tandis que « de devant leurs dieux » conserve l’image inhabituelle de ἀπὸ προσώπου.
- source_word: ἔφυγον εἰς Μεσοποταμίαν
  choice: ils s’enfuirent en Mésopotamie
  rationale: Le verbe exprime normalement la fuite, ici à la suite de l’expulsion.
- source_word: παρῴκησαν ἐκεῖ ἡμέρας πολλάς
  choice: y vécurent en étrangers pendant de nombreux jours
  rationale: παροικέω désigne un séjour en qualité d’étranger. La traduction conserve cette nuance sociale ainsi que l’expression temporelle littérale.
theological_decisions:
- issue: Abandon de la voie ancestrale et adoration du Dieu du ciel
  choice: Le texte décrit un véritable éloignement de la voie des pères et l’adoration du Dieu du ciel, sans recourir à un vocabulaire doctrinal ultérieur.
  alternative: « Ils abandonnèrent la religion de leurs ancêtres et se convertirent au vrai Dieu. »
  rationale: Cette autre formulation expliciterait excessivement la nature de leur démarche et introduirait les termes « religion », « conversion » et « vrai Dieu », absents du grec.
- issue: Nature de la connaissance de Dieu
  choice: « avaient appris à connaître »
  alternative: « avaient reconnu »
  rationale: Le grec ἐπέγνωσαν permet les deux nuances. Le texte principal privilégie l’acquisition d’une connaissance, tandis que la note préserve la possibilité d’une reconnaissance décisive.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit écrit. La métaphore de la « voie », le titre « Dieu du ciel » et la condition d’étrangers sont conservés, tandis que la syntaxe française clarifie seulement l’enchaînement narratif sans identifier l’agent de l’expulsion.
