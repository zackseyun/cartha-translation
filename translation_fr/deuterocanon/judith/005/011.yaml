base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/011.yaml
  text: And the king of Egypt rose up against them[a], and they dealt shrewdly with them in toil and brickmaking; they humbled them and made them servants.
translation:
  language: fr
  text: Le roi d’Égypte se dressa contre eux et usa de ruse contre eux[a], en leur imposant de pénibles travaux et la fabrication de briques ; ils les humilièrent et les réduisirent en esclavage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les traita avec une habileté perfide ». Le verbe grec souligne une manière d’agir rusée et calculée.'
    reason: Alternative lexicale préservant la nuance de κατεσοφίσαντο.
lexical_decisions:
- source_word: ἐπανέστη
  choice: se dressa contre
  rationale: Le verbe composé exprime ici une opposition hostile, rendue naturellement en français par « se dresser contre ».
- source_word: κατεσοφίσαντο
  choice: usa de ruse envers
  rationale: Le verbe évoque une conduite calculée et rusée à l’encontre de quelqu’un. Cette formulation conserve cette nuance sans préciser indûment la forme exacte de la manœuvre.
- source_word: ἐν πόνῳ καὶ πλίνθῳ
  choice: en leur imposant de pénibles travaux et la fabrication de briques
  rationale: Dans ce contexte d’asservissement en Égypte, πόνος désigne un travail pénible et πλίνθος les briques ou leur fabrication. La tournure explicite le rapport instrumental suggéré par ἐν et donne un français naturel.
- source_word: ἐταπείνωσαν
  choice: ils les humilièrent
  rationale: Cette traduction conserve le sens premier d’abaisser ou d’humilier, tandis que la proposition suivante concrétise leur asservissement.
- source_word: δούλους
  choice: les réduisirent en esclavage
  rationale: Le contexte est celui d’un assujettissement forcé. « Réduire en esclavage » exprime clairement le statut imposé et rend idiomatiquement ἔθεντο αὐτοὺς εἰς δούλους.
theological_decisions:
- issue: Portée du terme δούλους dans le contexte de l’oppression en Égypte
  choice: les réduisirent en esclavage
  alternative: ils en firent leurs serviteurs
  rationale: L’oppression nationale et le travail forcé rendent centrale la condition d’esclave ; « serviteurs » en atténuerait ici la gravité.
translation_notes:
  register: Français international moderne, digne et accessible. Le singulier « le roi » est suivi d’un sujet pluriel dans les deux dernières propositions, conformément aux changements de nombre du grec ; le pluriel peut désigner les Égyptiens sous l’autorité du roi.
