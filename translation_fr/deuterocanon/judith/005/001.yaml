base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/001.yaml
  text: And it was reported to Holofernes[a], the commander-in-chief of the forces of Assyria, that the sons of Israel had prepared for war, and had blocked the roads of the hill country and fortified every summit of every high mountain[b], and had set up obstacles in the plains.
translation:
  language: fr
  text: On rapporta à Holopherne, commandant en chef des forces de l’Assyrie, que les fils d’Israël[a] s’étaient préparés à la guerre, qu’ils avaient barré les routes de la région montagneuse, fortifié chaque sommet de haute montagne et placé des obstacles[b] dans les plaines.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites » ou « les enfants d’Israël ». Le grec dit littéralement « les fils d’Israël », expression ethnique conventionnelle.
    reason: lexical_alternative
  - marker: b
    text: Ou « des pièges » ou « des barricades ». Le mot grec désigne ce qui fait trébucher; dans ce contexte militaire, il s’agit d’entraves physiques dont la forme exacte n’est pas précisée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνηγγέλη
  choice: On rapporta
  rationale: L’aoriste passif indique que l’information parvint à Holopherne sans préciser qui la transmit. La tournure impersonnelle française est naturelle et fidèle à cet effet.
- source_word: ἀρχιστρατήγῳ
  choice: commandant en chef
  rationale: Le titre composé désigne le plus haut responsable militaire; « commandant en chef » en exprime précisément le rang.
- source_word: δυνάμεως Ἀσσούρ
  choice: des forces de l’Assyrie
  rationale: Dans ce contexte militaire, δύναμις désigne les forces armées; Ἀσσούρ renvoie ici à l’Assyrie.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: les fils d’Israël
  rationale: Cette formulation conserve l’expression ethnique conventionnelle du grec. Une note indique l’équivalent français plus courant « les Israélites ».
- source_word: παρεσκευάσθησαν εἰς πόλεμον
  choice: s’étaient préparés à la guerre
  rationale: Le plus-que-parfait situe naturellement ces préparatifs avant le rapport fait à Holopherne, tandis que « à la guerre » rend le sens militaire de εἰς πόλεμον.
- source_word: τὰς ὁδοὺς τῆς ὀρεινῆς
  choice: les routes de la région montagneuse
  rationale: ἡ ὀρεινή désigne une contrée montagneuse; cette formulation est claire en français international sans réduire le relief à de simples collines.
- source_word: συνέκλεισαν
  choice: avaient barré
  rationale: Dans le contexte de routes et de préparatifs défensifs, « barrer » exprime clairement l’idée de fermer ou de bloquer le passage.
- source_word: ἐτείχισαν
  choice: fortifié
  rationale: Le verbe signifie munir de fortifications ou de murailles; « fortifier » transmet naturellement l’action militaire sans imposer un ouvrage précis.
- source_word: πᾶσαν κορυφὴν ὄρους ὑψηλοῦ
  choice: chaque sommet de haute montagne
  rationale: La formulation conserve la construction distributive au singulier et l’idée de positions élevées, sans ajouter un second « chaque » absent comme mot distinct du grec.
- source_word: σκάνδαλα
  choice: des obstacles
  rationale: Bien que le terme puisse désigner ce qui fait trébucher, le contexte militaire exige ici des entraves physiques. « Obstacles » préserve l’indétermination quant à leur forme exacte.
- source_word: ἐν τοῖς πεδίοις
  choice: dans les plaines
  rationale: πέδιον désigne un terrain plat ou une plaine; le pluriel et la préposition sont rendus directement.
theological_decisions:
- issue: Désignation ethnique οἱ υἱοὶ Ἰσραήλ
  choice: les fils d’Israël
  alternative: les Israélites; les enfants d’Israël
  rationale: Il s’agit d’une désignation collective traditionnelle plutôt que d’une affirmation limitée aux seuls hommes. Le texte principal garde la forme grecque, et la note en explicite la portée ethnique.
- issue: Sens militaire de σκάνδαλα
  choice: des obstacles
  alternative: des pièges; des barricades; des entraves
  rationale: Le passage décrit des préparatifs défensifs matériels. Ce choix évite d’introduire ici le sens théologique figuré de « pierre d’achoppement » tout en maintenant l’ambiguïté sur la nature des dispositifs.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase ample conserve la progression du rapport grec, tandis que les répétitions de « que » clarifient sa syntaxe. Les termes militaires sont précis sans archaïsme, et les notes préservent les principales possibilités lexicales.
