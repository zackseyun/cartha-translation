  text: And why did they refuse to come to meet me[a], unlike all who dwell in the west?
translation:
  language: fr
  text: Et pourquoi ont-ils refusé de venir à ma rencontre[a], contrairement à tous ceux qui habitent dans les régions de l’ouest ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « ont-ils fait la sourde oreille pour ne pas venir à ma rencontre ? » L’expression grecque évoque l’image de l’oreille ; le lien précis avec l’infinitif négatif peut être compris de diverses manières.'
    reason: Alternative lexicale préservant l’image de l’oreille dans κατενωτίσαντο sans imposer une analyse unique de la construction avec l’infinitif.
lexical_decisions:
- source_word: διὰ τί
  choice: pourquoi
  rationale: Introduit directement une question portant sur la raison de leur conduite.
- source_word: κατενωτίσαντο
  choice: ont-ils refusé
  rationale: Le verbe évoque littéralement le fait de ne pas prêter l’oreille; avec τοῦ μὴ ἐλθεῖν, il exprime naturellement ici le refus de venir.
- source_word: τοῦ μὴ ἐλθεῖν
  choice: de venir
  rationale: L’infinitif articulé avec μή précise ce qu’ils ont refusé de faire. Aucun équivalent de « sortir » n’étant explicite dans le grec, il n’est pas ajouté.
- source_word: εἰς ἀπάντησίν μοι
  choice: à ma rencontre
  rationale: Rend de façon idiomatique l’idée d’aller rencontrer la personne qui parle.
- source_word: παρὰ πάντας
  choice: contrairement à tous
  rationale: παρά avec l’accusatif marque ici le contraste entre leur conduite et celle de tous les autres.
- source_word: τοὺς κατοικοῦντας ἐν δυσμαῖς
  choice: ceux qui habitent dans les régions de l’ouest
  rationale: La formulation conserve le participe substantivé et la référence géographique; le pluriel δυσμαῖς peut désigner les contrées occidentales.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « À ma rencontre » est plus idiomatique que « pour me rencontrer » dans ce contexte. « Régions de l’ouest » rend le pluriel grec sans archaïsme; la minuscule évite de transformer inutilement l’expression en nom propre.
