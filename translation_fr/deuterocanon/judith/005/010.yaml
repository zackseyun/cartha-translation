base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/010.yaml
  text: And they went down into Egypt[a], for a famine covered the face of the land of Canaan, and they lived there as sojourners until they were sustained; and there they became a very great multitude, and there was no number to their family line.
translation:
  language: fr
  text: Ils descendirent en Égypte, car une famine couvrait la face du pays de Canaan. Ils y vécurent comme étrangers jusqu’à ce qu’ils soient nourris. Là, ils devinrent une multitude considérable, et leur peuple était sans nombre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur lignée était sans nombre ». Le grec γένος peut désigner une lignée, un groupe de parenté ou un peuple issu d’un ancêtre commun.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβησαν
  choice: descendirent
  rationale: Conserve le mouvement traditionnel vers l’Égypte exprimé par le grec, naturel aussi dans le langage biblique français.
- source_word: ἐκάλυψεν ... τὸ πρόσωπον τῆς γῆς Χανααν
  choice: avait couvert toute la surface du pays de Canaan
  rationale: Préserve l’image du verbe « couvrir » et rend clairement l’expression sémitisante « la face du pays »; « toute » explicite ici la portée naturelle de cette expression.
- source_word: λιμός
  choice: la famine
  rationale: Terme précis et usuel dans un récit historique.
- source_word: παρῴκησαν ἐκεῖ
  choice: ils y vécurent comme étrangers
  rationale: Exprime le séjour en qualité d’étrangers résidents sans suggérer une installation définitive.
- source_word: μέχρις οὗ διετράφησαν
  choice: jusqu’à ce qu’ils aient de quoi subsister
  rationale: Rend naturellement l’idée passive d’être nourris ou entretenus, sans la limiter à un seul repas.
- source_word: ἐγένοντο ἐκεῖ εἰς πλῆθος πολύ
  choice: là, ils devinrent une multitude considérable
  rationale: Conserve la construction résultative et l’accent quantitatif du grec dans un français digne et courant.
- source_word: οὐκ ἦν ἀριθμὸς
  choice: étaient innombrables
  rationale: Rend l’idiome grec de façon naturelle en français tout en conservant l’idée d’impossibilité de compter.
- source_word: τοῦ γένους αὐτῶν
  choice: les membres de leur lignée
  rationale: γένος désigne ici le groupe issu d’une même ascendance; cette formulation évite les connotations modernes de « race » et permet une syntaxe française naturelle avec « innombrables ».
theological_decisions:
- issue: Portée du terme généalogique γένος
  choice: leur lignée
  alternative: leur peuple / leur famille / leur race
  rationale: Le contexte met en avant une communauté liée par l’ascendance. « Lignée » maintient cette dimension généalogique sans introduire une notion biologique moderne de race; la note conserve l’amplitude lexicale du grec.
translation_notes:
  register: Français international moderne, narratif et digne. L’équivalence optimale conserve les images significatives du grec, mais évite les calques peu naturels comme « il n’y avait pas de nombre à leur lignée ». Le marqueur [a] figure dans le texte et correspond à la note.
