review_pass:
  verdict: revise
  source_fidelity: La traduction restitue bien le mouvement vers l’Égypte, la famine, le séjour étranger et la croissance numérique. Toutefois, « toute » ajoute une totalité qui n’est pas explicitement exprimée, « avaient de quoi subsister » déplace la voix passive de διετράφησαν vers leurs propres ressources, et « les membres de leur lignée étaient innombrables » explicite des « membres » absents du grec tout en modifiant la formulation idiomatique « il n’y avait pas de nombre ».
  naturalness: Le français est globalement clair et narratif. « Vécurent comme étrangers » est naturel. « Une famine couvrait la face du pays » conserve l’image source sans être opaque, et « leur peuple était sans nombre » est idiomatique dans ce registre.
  terminology: « Égypte », « Canaan », « famine » et « lignée/peuple » conviennent. Pour γένος, « peuple » est ici une formulation française naturelle pour le groupe issu d’une ascendance commune; la note préserve les possibilités de « lignée » et de groupe de parenté. « Étaient nourris » rend sobrement le passif de διετράφησαν.
  issues:
  - severity: medium
    issue: Ajout de « toute » dans « toute la surface du pays »
    rationale: τὸ πρόσωπον τῆς γῆς est l’image de la face/surface du pays; le grec ne comporte pas un équivalent explicite de « toute ». L’ajout n’est pas nécessaire pour un français clair.
  - severity: medium
    issue: « jusqu’à ce qu’ils aient de quoi subsister » ne rend pas la voix passive
    rationale: διετράφησαν signifie qu’ils furent nourris, entretenus ou pourvus. La formulation actuelle présente plutôt la possession de moyens de subsistance.
  - severity: low
    issue: Reformulation de οὐκ ἦν ἀριθμὸς τοῦ γένους αὐτῶν
    rationale: « Les membres de leur lignée étaient innombrables » est intelligible, mais ajoute « membres » et s’éloigne de la construction portant sur leur γένος. Une formulation avec « peuple » et « sans nombre » est plus directe et naturelle.
  revised_text: Ils descendirent en Égypte, car une famine couvrait la face du pays de Canaan. Ils y vécurent comme étrangers jusqu’à ce qu’ils soient nourris. Là, ils devinrent une multitude considérable, et leur peuple était sans nombre.[a]
  revised_footnotes:
  - marker: a
    text: Ou « leur lignée était sans nombre ». Le grec γένος peut désigner une lignée, un groupe de parenté ou un peuple issu d’un ancêtre commun.
    reason: lexical_alternative
  revision_rationale: La révision retire l’intensification non exprimée (« toute »), conserve l’image de la « face du pays », rend le passif de διετράφησαν par « soient nourris » et emploie « leur peuple était sans nombre » pour γένος dans une syntaxe française idiomatique. La note maintient explicitement l’ambiguïté généalogique du terme grec.
