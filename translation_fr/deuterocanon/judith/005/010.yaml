revisions:
- from: Ils descendirent en Égypte, car la famine avait couvert toute la surface du pays de Canaan. Ils y vécurent comme étrangers jusqu’à ce qu’ils aient de quoi subsister. Là, ils devinrent une multitude considérable, et les membres de leur lignée étaient innombrables.[a]
  to: Ils descendirent en Égypte, car une famine couvrait la face du pays de Canaan. Ils y vécurent comme étrangers jusqu’à ce qu’ils soient nourris. Là, ils devinrent une multitude considérable, et leur peuple était sans nombre.[a]
  rationale: La révision retire l’intensification non exprimée (« toute »), conserve l’image de la « face du pays », rend le passif de διετράφησαν par « soient nourris » et emploie « leur peuple était sans nombre » pour γένος dans une syntaxe française idiomatique. La note maintient explicitement l’ambiguïté généalogique du terme grec.
