base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/003.yaml
  text: And he said to them, “Tell me, then, sons of Canaan, who is this people that dwells in the hill country, and which cities they inhabit, and the size of their military force, and in what their power and their strength consist, and who has risen over them as king, leading their army.”
translation:
  language: fr
  text: 'Il leur dit : « Dites-moi donc, fils de Canaan[a], quel est ce peuple qui habite la région montagneuse[b], quelles villes il habite, quel est l’effectif de ses forces[c], sur quoi reposent sa puissance et sa force, et qui s’est élevé au-dessus de lui comme roi, à la tête de son armée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Cananéens ». Le grec dit littéralement « fils de Canaan ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « qui est assis dans la région montagneuse »; il s’agit d’une manière de dire qu’il y habite.
    reason: lexical_alternative
  - marker: c
    text: Ou « quelle est l’importance de son armée » ou « combien nombreuses sont ses forces ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναγγείλατέ δή μοι
  choice: Dites-moi donc
  rationale: L’impératif demande un rapport direct; « donc » rend la valeur discursive et insistante de δή sans donner au propos un ton excessivement poli.
- source_word: υἱοὶ Χαναάν
  choice: fils de Canaan
  rationale: Conserve l’expression vocative et familiale du grec plutôt que de la réduire directement à l’ethnonyme « Cananéens ».
- source_word: ὁ λαὸς οὗτος
  choice: ce peuple
  rationale: Respecte le collectif singulier λαός dans un français naturel.
- source_word: ὁ καθήμενος ἐν τῇ ὀρεινῇ
  choice: qui habite la région montagneuse
  rationale: καθήμενος, littéralement « assis », a ici le sens idiomatique de résider; ὀρεινή désigne la région montagneuse.
- source_word: τίνες αἱ κατοικοῦσιν πόλεις
  choice: quelles villes il occupe
  rationale: La formulation grecque porte sur les villes où le peuple réside. « Occupe » convient au contexte territorial et militaire tout en restant proche de l’idée d’habitation.
- source_word: τὸ πλῆθος τῆς δυνάμεως αὐτῶν
  choice: quel est l’effectif de ses forces
  rationale: Dans ce contexte de reconnaissance militaire, πλῆθος renvoie au nombre ou à l’importance numérique, et δύναμις aux forces armées.
- source_word: ἐν τίνι τὸ κράτος αὐτῶν καὶ ἡ ἰσχὺς αὐτῶν
  choice: sur quoi reposent sa puissance et sa force
  rationale: Rend naturellement la question portant sur le fondement ou le siège de leur puissance, tout en maintenant le doublet κράτος / ἰσχύς.
- source_word: ἀνέστηκεν ἐπʼ αὐτῶν βασιλεὺς
  choice: qui s’est élevé au-dessus de lui comme roi
  rationale: Préserve l’image de ἀνίστημι et la relation exprimée par ἐπί, sans transformer implicitement la phrase en simple affirmation de gouvernement.
- source_word: ἡγούμενος στρατιᾶς αὐτῶν
  choice: à la tête de son armée
  rationale: Expression française naturelle pour le participe désignant celui qui conduit ou commande l’armée.
