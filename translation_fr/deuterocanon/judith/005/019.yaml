base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/019.yaml
  text: And now[a], having turned back to their God, they came up from the dispersion where they had been scattered there, took possession of Jerusalem, where their sanctuary was, and settled in the hill country[b], because it had been deserted.
translation:
  language: fr
  text: Et maintenant, s’étant de nouveau tournés vers leur Dieu, ils sont remontés des régions où ils avaient été dispersés[a], ont pris possession de Jérusalem, où se trouvait leur sanctuaire, et se sont établis dans la région montagneuse, car elle était déserte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la dispersion où ils avaient été dispersés là-bas ». Le grec emploie une expression de lieu redondante ou emphatique.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « inhabitée » ou « désolée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστρέψαντες ἐπὶ τὸν θεὸν αὐτῶν
  choice: s’étant de nouveau tournés vers leur Dieu
  rationale: Cette formulation conserve l’image d’un changement d’orientation et la nuance d’un retour à la fidélité envers leur propre Dieu, sans imposer le terme doctrinal plus marqué « convertis ».
- source_word: ἀνέβησαν
  choice: ils sont remontés
  rationale: Le verbe exprime une montée géographique. « Sont remontés » rend naturellement le mouvement vers le pays et ses hauteurs sans le réduire à un simple retour.
- source_word: ἐκ τῆς διασπορᾶς οὗ διεσπάρησαν ἐκεῖ
  choice: des régions où ils avaient été dispersés
  rationale: Cette expression française naturelle communique le départ depuis les lieux de la dispersion. Une note signale la formulation grecque pléonastique, qui associe οὗ et ἐκεῖ.
- source_word: κατέσχον
  choice: ont pris possession de
  rationale: Le verbe indique ici la prise et la conservation d’un territoire. Ce choix est précis sans ajouter une connotation militaire plus forte que le grec.
- source_word: τὸ ἁγίασμα
  choice: leur sanctuaire
  rationale: « Sanctuaire » rend le lieu consacré de façon naturelle et suffisamment précise, sans identifier plus étroitement le terme à l’ensemble du Temple.
- source_word: κατῳκίσθησαν
  choice: se sont établis
  rationale: Le passif grec peut décrire l’installation ou l’établissement d’une population. La tournure pronominale est idiomatique en français et convient au contexte de repeuplement.
- source_word: ἐν τῇ ὀρεινῇ
  choice: dans la région montagneuse
  rationale: L’expression grecque désigne les hautes terres ou la région des montagnes. « Région montagneuse » est claire en français international.
- source_word: ὅτι ἦν ἔρημος
  choice: car elle était déserte
  rationale: ἔρημος peut signifier désert, désolé ou inhabité. « Déserte » conserve cette amplitude et s’accorde avec le contexte de l’installation.
theological_decisions:
- issue: Portée religieuse du retour exprimé par ἐπιστρέψαντες ἐπὶ τὸν θεὸν αὐτῶν
  choice: s’étant de nouveau tournés vers leur Dieu
  alternative: étant revenus à leur Dieu
  rationale: Le texte décrit une orientation renouvelée vers le Dieu qui est déjà le leur, et non l’adoption d’une nouvelle divinité. La formulation choisie laisse entendre le retour à la fidélité sans importer une terminologie confessionnelle ultérieure.
translation_notes:
  register: Français international moderne, fluide et digne. La phrase conserve la longue coordination narrative du grec tout en évitant une redondance peu naturelle dans le corps du texte; celle-ci est documentée en note.
