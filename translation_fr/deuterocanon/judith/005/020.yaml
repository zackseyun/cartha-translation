  text: And now[a], master lord, if indeed there is an offense in this people and they are sinning against their God, and if we ascertain that this stumbling block is among them, then we will go up and make war against them;
translation:
  language: fr
  text: Et maintenant, maître et seigneur, s’il y a réellement une faute[a] dans ce peuple, s’ils pèchent contre leur Dieu et si nous constatons que cette cause de chute est parmi eux, alors nous monterons et nous leur ferons la guerre ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « erreur » ou « faute involontaire » : le mot grec peut désigner un acte répréhensible commis par ignorance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δέσποτα κύριε
  choice: maître et seigneur
  rationale: Le double vocatif s’adresse à Holoferne et non à Dieu. La traduction conserve les deux titres tout en évitant la tournure « le Seigneur », qui pourrait suggérer un titre divin.
- source_word: ἀγνόημα
  choice: faute
  rationale: Le terme désigne une erreur ou un acte répréhensible, parfois commis par ignorance. « Faute » garde cette latitude sans imposer l’idée d’une transgression volontaire.
- source_word: ἁμαρτάνουσιν εἰς τὸν θεὸν αὐτῶν
  choice: ils pèchent contre leur Dieu
  rationale: Le présent grec peut décrire une conduite en cours, et la construction avec εἰς indique ici que le péché est dirigé contre Dieu.
- source_word: ἐπισκεψόμεθα
  choice: nous vérifierons
  rationale: Le verbe exprime ici l’examen visant à établir un fait. « Vérifier » est naturel en français moderne et convient à la logique conditionnelle du propos.
- source_word: σκάνδαλον
  choice: cause de chute
  rationale: L’expression conserve l’image d’un élément qui fait tomber tout en indiquant, dans ce contexte, la faute susceptible d’entraîner la défaite du peuple.
- source_word: ἀναβησόμεθα
  choice: nous monterons les attaquer
  rationale: « Monter » préserve le sens spatial ou militaire du verbe ; l’infinitif « les attaquer » rend explicite et naturel le mouvement offensif sans faire double emploi avec la guerre mentionnée ensuite.
- source_word: ἐκπολεμήσομεν
  choice: nous leur ferons la guerre
  rationale: Le verbe composé évoque une action militaire organisée et plus forte qu’un simple combat.
theological_decisions:
- issue: Traduction de la double adresse δέσποτα κύριε
  choice: maître et seigneur
  alternative: souverain seigneur ; seigneur et maître
  rationale: Les paroles s’adressent à Holoferne. Les deux titres sont donc maintenus sans employer une graphie ou une formulation qui ferait penser au nom ou au titre divin.
- issue: Relation entre la faute du peuple et sa vulnérabilité militaire
  choice: 'Maintenir le raisonnement conditionnel : la guerre ne sera engagée que si une faute contre Dieu est constatée parmi eux.'
  alternative: Présenter leur défaite comme déjà certaine ou la faute comme déjà avérée.
  rationale: Le grec pose une hypothèse suivie d’une vérification et d’une conséquence. La traduction ne doit ni affirmer la culpabilité à l’avance ni résoudre la tension théologique entre péché et protection divine.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase garde le ton déférent et militaire du discours. « Au sein de » et « parmi eux » rendent la localisation interne de la faute, tandis que le point-virgule clarifie la progression entre constat et action.
