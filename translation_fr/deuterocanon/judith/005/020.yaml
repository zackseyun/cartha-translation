revisions:
- from: Et maintenant, maître et seigneur, s’il y a vraiment une faute[a] au sein de ce peuple et s’ils pèchent contre leur Dieu, nous vérifierons si cette cause de chute se trouve parmi eux ; alors nous monterons les attaquer et leur ferons la guerre.
  to: Et maintenant, maître et seigneur, s’il y a réellement une faute[a] dans ce peuple, s’ils pèchent contre leur Dieu et si nous constatons que cette cause de chute est parmi eux, alors nous monterons et nous leur ferons la guerre ;
  rationale: La révision rétablit explicitement la troisième condition du raisonnement grec, sans décider si la faute est volontaire ou non. Elle conserve aussi la distinction entre monter et faire la guerre, ainsi que le point-virgule final de la phrase source.
