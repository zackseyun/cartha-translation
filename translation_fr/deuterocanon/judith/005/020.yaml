review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend correctement l’adresse redoublée, la faute contre Dieu, l’examen de la situation et l’action militaire. Toutefois, le grec coordonne trois éléments conditionnels : l’existence d’une faute, le fait qu’ils pèchent, et la constatation que « cette cause de chute » est parmi eux. Le futur « nous vérifierons si » du projet affaiblit cette troisième condition et transforme légèrement la logique syntaxique.'
  naturalness: Le français est globalement naturel et de registre approprié. Une coordination explicite par « et si nous constatons » rend la progression hypothétique plus nette. « Nous monterons et nous leur ferons la guerre » conserve plus exactement les deux verbes grecs que « nous monterons les attaquer ».
  terminology: « Maître et seigneur » conserve les deux titres sans connotation de titre divin. « Faute » est un bon rendu non surinterprétatif d’ἀγνόημα; la note préserve utilement la nuance possible d’ignorance. « Cause de chute » est une solution recevable pour σκάνδαλον dans ce contexte.
  issues:
  - severity: medium
    issue: La condition liée à ἐπισκεψόμεθα n’est pas explicitement maintenue.
    rationale: Le grec enchaîne la vérification avec les autres conditions avant la conséquence militaire. « Nous vérifierons si… ; alors… » peut se lire comme une étape future indépendante plutôt que comme « si nous constatons que… ».
  - severity: low
    issue: « Monter les attaquer » explicite et fusionne deux verbes grecs distincts.
    rationale: ἀναβησόμεθα et ἐκπολεμήσομεν signifient littéralement « nous monterons et nous leur ferons la guerre ». La coordination française conserve mieux le mouvement et l’acte de guerre.
