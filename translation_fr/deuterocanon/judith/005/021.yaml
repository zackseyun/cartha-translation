base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/021.yaml
  text: But if there is no lawlessness in their nation[a], let my lord pass by, lest perhaps their Lord and their God defend them, and we become a reproach before all the earth.
translation:
  language: fr
  text: Mais s’il n’y a aucune transgression dans leur nation, que mon seigneur[a] passe son chemin, de peur que leur Seigneur, leur Dieu, ne prenne leur défense et que nous ne devenions un objet d’opprobre devant toute la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « que le seigneur passe son chemin ». Dans ce contexte, il s’agit très probablement d’une adresse respectueuse à Holopherne (« mon seigneur »), et non d’une référence à Dieu.'
    reason: alternative lexicale et ambiguïté du référent
lexical_decisions:
- source_word: ἀνομία
  choice: violation de la Loi
  rationale: Le terme exprime une conduite contraire à la loi, avec une portée morale et religieuse. Dans le contexte du discours sur la fidélité d’Israël à Dieu, la majuscule à « Loi » rend cette référence sans réduire le mot à un acte isolé.
- source_word: ἔθνος
  choice: nation
  rationale: Le mot désigne ici Israël comme collectivité nationale; « nation » conserve cette dimension politique et ethnique.
- source_word: παρελθέτω
  choice: que mon seigneur passe son chemin
  rationale: L’impératif signifie passer ou poursuivre son chemin. Le contexte indique qu’Achior s’adresse respectueusement à Holopherne; le possessif, absent du grec, est requis en français pour rendre clairement cette adresse.
- source_word: μή ποτε
  choice: de peur que… ne
  rationale: Cette tournure française naturelle rend l’avertissement portant sur une éventualité indésirable; la valeur éventuelle de ποτε est incluse dans « de peur que ».
- source_word: ὑπερασπίσῃ
  choice: prenne leur défense
  rationale: Cette expression rend le sens de défendre, protéger ou combattre en faveur de quelqu’un, tout en convenant au contexte militaire.
- source_word: ὀνειδισμός
  choice: un objet de honte
  rationale: Le nom désigne une honte publique ou un objet d’opprobre. Cette formulation fait ressortir le déshonneur subi devant autrui.
- source_word: πάσης τῆς γῆς
  choice: toute la terre
  rationale: La formule est rhétorique et expansive; cette traduction conserve au plus près l’étendue exprimée par le grec.
- source_word: κύριος
  choice: seigneur / Seigneur
  rationale: La première occurrence renvoie très probablement au supérieur humain auquel Achior s’adresse, tandis que la seconde, coordonnée à « leur Dieu », désigne la divinité d’Israël.
theological_decisions:
- issue: Référents distincts des deux occurrences de κύριος
  choice: « mon seigneur » pour Holopherne, puis « leur Seigneur » pour Dieu
  alternative: Traduire les deux occurrences par « le seigneur » et conserver l’ambiguïté formelle
  rationale: Le grec seul permet formellement une hésitation pour la première occurrence, mais la situation d’énonciation en fait très probablement une adresse respectueuse à Holopherne. La seconde occurrence est explicitement liée à « leur Dieu » et a donc un référent divin. Une note signale l’ajout interprétatif du possessif.
- issue: Portée de ἀνομία
  choice: « violation de la Loi »
  alternative: « injustice », « iniquité » ou « méfait »
  rationale: Le contexte immédiat relie le sort d’Israël à sa fidélité envers Dieu. La formulation retenue préserve la force juridique et religieuse du terme sans préciser une transgression particulière.
translation_notes:
  register: Français moderne, digne et accessible. La structure conditionnelle et l’avertissement du grec sont conservés, avec une syntaxe française naturelle. La distinction typographique entre « seigneur » humain et « Seigneur » divin clarifie les référents, tandis que la note préserve l’ambiguïté formelle du grec.
