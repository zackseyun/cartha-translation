lexical_decisions:
- source_word: ὁ λαὸς οὗτός
  choice: Ce peuple
  rationale: Le singulier collectif « ce peuple » rend directement λαός avec le démonstratif οὗτός et convient à un registre français naturel et digne.
- source_word: εἰσιν
  choice: descend
  rationale: Le grec emploie le pluriel avec ἀπόγονοι, mais le français traite normalement « ce peuple » comme un collectif grammaticalement singulier. La tournure verbale « descend de » exprime naturellement la relation généalogique.
- source_word: ἀπόγονοι
  choice: descend
  rationale: Dans la construction « descend des Chaldéens », le verbe français transmet clairement l'idée de filiation portée par le nom grec ἀπόγονοι, sans la lourdeur de « est composé de descendants ».
- source_word: Χαλδαίων
  choice: des Chaldéens
  rationale: Le génitif pluriel désigne le groupe ancestral; « des Chaldéens » est la formulation française idiomatique après « descend ».
