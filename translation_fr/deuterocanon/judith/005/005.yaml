base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/005.yaml
  text: And Achior[a], the leader of all the sons of Ammon, said to him, “Let my lord now hear a word from the mouth of your servant, and I will tell you the truth about the people who dwell in this hill country near you[b], and no falsehood will come from the mouth of your servant.”
translation:
  language: fr
  text: 'Achior, le chef de tous les fils d’Ammon[a], lui dit : « Que mon seigneur écoute donc une parole de la bouche de ton serviteur. Je te dirai la vérité au sujet du peuple qui habite cette région montagneuse près de toi, et aucun mensonge ne sortira de la bouche de ton serviteur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de tous les Ammonites ». Le grec dit littéralement « de tous les fils d’Ammon ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀχιὼρ
  choice: Achior
  rationale: Translittération traditionnelle et immédiatement reconnaissable du nom propre dans l’usage biblique français.
- source_word: ὁ ἡγούμενος
  choice: le chef
  rationale: Le participe substantivé désigne celui qui dirige. « Chef » convient au contexte politique et militaire sans préciser indûment la nature de sa fonction.
- source_word: πάντων υἱῶν Ἀμμών
  choice: de tous les fils d’Ammon
  rationale: Cette formulation conserve l’ethnonyme filial du grec et la texture de la source; « de tous les Ammonites » est indiqué en note comme équivalent idiomatique.
- source_word: Ἀκουσάτω δὴ λόγον
  choice: Que mon seigneur écoute donc une parole
  rationale: Le subjonctif français à valeur d’impératif rend la demande respectueuse à la troisième personne; « donc » restitue la légère insistance de δή.
- source_word: ὁ κύριός μου
  choice: mon seigneur
  rationale: Dans cette adresse à un supérieur humain, « mon seigneur » garde le registre déférent et solennel sans évoquer ici un titre divin.
- source_word: ἐκ στόματος τοῦ δούλου σου
  choice: de la bouche de ton serviteur
  rationale: La formulation conserve l’image répétée de la bouche. Dans cette formule d’humilité de cour, « serviteur » rend mieux la fonction discursive que « esclave ».
- source_word: ἀναγγελῶ σοι τὴν ἀλήθειαν
  choice: Je te dirai la vérité
  rationale: Rendu français naturel de l’annonce d’un rapport véridique, tout en gardant le futur et l’adresse directe.
- source_word: ὃς κατοικεῖ τὴν ὀρεινὴν ταύτην
  choice: qui habite cette région montagneuse
  rationale: ἡ ὀρεινή désigne une contrée de montagnes ou de collines; « région montagneuse » est précis, courant et géographique.
- source_word: πλησίον σοῦ οἰκούντος
  choice: près de toi
  rationale: Le grec présente le peuple comme habitant la région à proximité du lieu où réside l’interlocuteur. La formulation française en exprime le sens sans alourdir la phrase.
- source_word: οὐκ ἐξελεύσεται ψεῦδος
  choice: aucun mensonge ne sortira
  rationale: Cette traduction conserve l’image concrète d’une parole qui sort de la bouche ainsi que l’assurance solennelle formulée au futur.
theological_decisions:
- issue: Sens de κύριος dans une adresse à un être humain
  choice: mon seigneur
  alternative: mon maître
  rationale: Le contexte identifie un supérieur humain. « Mon seigneur » maintient le registre courtois sans transformer κύριος en titre divin.
- issue: Sens de δοῦλος dans une formule de déférence
  choice: ton serviteur
  alternative: ton esclave
  rationale: Bien que δοῦλος puisse désigner un esclave, il appartient ici à une formule conventionnelle d’abaissement devant un supérieur; « serviteur » communique cette fonction sans trancher une question de statut social que le passage ne met pas en avant.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours conserve le ton déférent de la cour ainsi que la répétition rhétorique de « la bouche de ton serviteur ». Le tutoiement reflète le singulier grec dans une adresse hiérarchique ancienne, tandis que « mon seigneur » en marque explicitement le respect.
