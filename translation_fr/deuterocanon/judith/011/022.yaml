    issue: Possessif ajouté dans « ton peuple »
    rationale: Le grec dit ἔμπροσθεν τοῦ λαοῦ, littéralement « devant/en avant du peuple », sans possessif. Le contexte permet d’identifier ce peuple, mais l’ajout de « ton » explicite une relation que le grec laisse implicite.
