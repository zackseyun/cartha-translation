  text: Holofernes said to her[a], “God has done well to send you ahead of the people, so that power might be in our hands[b]; but destruction is for those who have treated my lord with contempt.”
translation:
  language: fr
  text: 'Holopherne lui dit : « Dieu a bien fait de t’envoyer en avant du peuple, afin que la puissance soit entre nos mains ; mais la destruction attend ceux qui ont méprisé mon seigneur. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὖ ἐποίησεν
  choice: a bien fait
  rationale: Expression française naturelle qui conserve l’évaluation positive de l’acte de Dieu.
- source_word: ἀποστεῖλας
  choice: de t’envoyer
  rationale: Après « a bien fait », l’infinitif est idiomatique en français et rend clairement le participe aoriste grec.
- source_word: ἔμπροσθεν τοῦ λαοῦ
  choice: en avant de ton peuple
  rationale: Rend l’idée que Judith a été envoyée avant les siens. Le possessif explicite naturellement le groupe concerné dans ce contexte.
- source_word: τοῦ γενήθηναι
  choice: afin que … soit
  rationale: L’infinitif articulé exprime ici la visée ou le résultat attendu ; « afin que » en transmet clairement la valeur.
- source_word: ἐν χερσὶν ἡμῶν
  choice: entre nos mains
  rationale: Expression française courante pour la possession et la maîtrise, proche de l’image grecque.
- source_word: κράτος
  choice: la puissance
  rationale: Conserve la portée militaire et politique du terme sans la réduire à la seule force physique.
- source_word: φαυλίσασι
  choice: ont méprisé
  rationale: Le verbe désigne le fait de tenir pour peu, de déprécier ou de traiter avec mépris ; « mépriser » est concis et fidèle.
- source_word: τὸν κύριόν μου
  choice: mon seigneur
  rationale: Le titre vise ici le souverain humain d’Holopherne. La minuscule évite une référence au Dieu d’Israël.
- source_word: ἀπώλεια
  choice: la destruction
  rationale: Rend directement l’issue funeste annoncée, sans ajouter de connotation théologique ultérieure.
theological_decisions:
- issue: Référent de κύριος dans « τὸν κύριόν μου »
  choice: mon seigneur
  alternative: mon maître
  rationale: Le contexte désigne un supérieur humain, non Dieu. « Mon seigneur » conserve la valeur de titre et l’ambiguïté politique du discours d’Holopherne.
- issue: Rapport entre l’action de Dieu et la puissance des Assyriens
  choice: 'Conserver l’affirmation directe d’Holopherne : « Dieu a bien fait… afin que la puissance soit entre nos mains »'
  alternative: Atténuer ou signaler explicitement que cette affirmation est erronée
  rationale: Le grec rapporte sans commentaire l’interprétation d’Holopherne. La traduction ne doit ni la valider théologiquement ni la corriger dans le texte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase garde la solennité militaire d’Holopherne et l’opposition marquée par « mais ». Aucun appel de note n’est nécessaire, les nuances principales étant exprimées naturellement dans le texte.
