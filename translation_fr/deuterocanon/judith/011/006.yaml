base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/006.yaml
  text: And if you follow the words of your servant girl[a], God will fully accomplish the matter with you[b], and my lord will not depart from his purposes.
translation:
  language: fr
  text: Et si tu suis les paroles de ta servante[a], Dieu mènera pleinement cette entreprise à bien avec toi[b], et mon seigneur ne se détournera pas de ses desseins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu tiens compte des paroles de ta servante ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Dieu accomplira pleinement cette affaire avec toi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακολουθήσῃς
  choice: tu suis
  rationale: Le verbe exprime l’idée de suivre ou de se conformer à des paroles. « Suivre » conserve cette image tout en étant naturel en français.
- source_word: λόγοις
  choice: les paroles
  rationale: Rendu littéral qui demeure clair dans le contexte, où ces paroles constituent aussi un conseil.
- source_word: παιδίσκης
  choice: servante
  rationale: Le terme désigne ici une jeune femme en position de service. « Servante » préserve le statut social et le genre sans imposer explicitement la notion d’esclavage.
- source_word: τελείως
  choice: pleinement
  rationale: L’adverbe souligne l’accomplissement complet de l’entreprise.
- source_word: πρᾶγμα
  choice: cette entreprise
  rationale: Le nom peut désigner une affaire, une action ou une entreprise. « Cette entreprise » convient au projet envisagé sans le définir plus précisément que le grec.
- source_word: ποιήσει μετὰ σοῦ
  choice: mènera ... à bien avec toi
  rationale: Cette formulation exprime l’accomplissement de l’entreprise tout en conservant la relation générale indiquée par μετά, sans trancher entre l’idée de moyen et celle d’accompagnement.
- source_word: ὁ θεός
  choice: Dieu
  rationale: Équivalent français usuel de θεός.
- source_word: οὐκ ἀποστεῖται
  choice: ne se détournera pas
  rationale: Le verbe indique ici qu’on ne s’écartera pas ou qu’on ne renoncera pas à ses entreprises. Ce choix conserve l’image du mouvement plutôt que de la réduire à la réussite ou à l’échec.
- source_word: ὁ κύριός μου
  choice: mon seigneur
  rationale: Judith emploie un titre déférent pour un supérieur humain. La minuscule évite toute confusion avec un titre divin.
- source_word: ἐπιτηδευμάτων
  choice: desseins
  rationale: Le nom couvre les entreprises, occupations ou projets poursuivis. « Desseins » convient au contexte stratégique et au registre solennel du récit.
theological_decisions:
- issue: Référent humain de κύριος
  choice: mon seigneur
  alternative: mon maître
  rationale: Le contexte désigne un supérieur humain, non Dieu. « Mon seigneur » garde la déférence du titre grec, avec une minuscule qui signale le référent humain.
- issue: Rapport de Dieu avec le destinataire dans ποιήσει μετὰ σοῦ
  choice: mènera pleinement cette entreprise à bien avec toi
  alternative: mènera pleinement cette entreprise à bien par ton intermédiaire
  rationale: Le grec μετά avec le génitif permet de conserver une relation moins déterminée. « Avec toi » évite de décider si le destinataire est l’instrument précis de l’action divine.
translation_notes:
  register: Français international moderne, digne et narratif. Le tutoiement correspond à la deuxième personne du singulier. La formulation préserve l’ambiguïté de μετά (« avec toi ») et rend κύριος comme un titre humain en minuscule.
