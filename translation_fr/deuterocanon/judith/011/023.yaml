base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/023.yaml
  text: And now you are beautiful in your appearance and good in your words. For if you do as you have spoken[a], your God will be my God, and you will dwell in the house of King Nabuchodonosor, and you will be renowned throughout all the earth.
translation:
  language: fr
  text: Et maintenant, tu es belle d’apparence et tes paroles sont bonnes. Car, si tu fais comme tu l’as dit, ton dieu sera mon dieu[a] ; tu résideras dans la maison du roi Nabuchodonosor et tu seras renommée sur toute la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ton Dieu sera mon Dieu ». Le grec ne permet pas de trancher la question par l’emploi des majuscules ; la minuscule retenue dans le texte reflète le point de vue immédiat du locuteur païen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀστεία
  choice: belle
  rationale: Avec « par ton apparence », l’adjectif qualifie ici l’attrait visible de Judith. « Belle » exprime clairement ce compliment dans un français naturel et digne.
- source_word: εἶδος
  choice: apparence
  rationale: Le terme désigne ici l’aspect visible ou extérieur ; « apparence » maintient ce sens sans ajouter une idée étrangère au grec.
- source_word: ἀγαθὴ ἐν τοῖς λόγοις σου
  choice: tes paroles sont bonnes
  rationale: Cette formulation conserve le parallélisme du grec tout en évitant le tour peu naturel « bonne dans tes paroles ».
- source_word: ἐὰν ποιήσῃς καθὰ ἐλάλησας
  choice: si tu fais comme tu l’as dit
  rationale: Le tour français est courant et restitue fidèlement le lien entre les actes à venir de Judith et ce qu’elle vient de déclarer.
- source_word: ὁ θεός σου ἔσται μού θεός
  choice: ton dieu sera mon dieu
  rationale: Le grec ne marque pas la distinction typographique entre « Dieu » et « dieu ». La minuscule rend le point de vue immédiat du général païen, tandis qu’une note conserve l’autre lecture possible.
- source_word: καθιῇ
  choice: tu résideras
  rationale: Bien que le verbe puisse littéralement évoquer le fait de s’asseoir, son emploi avec la maison royale indique ici une résidence ou une place stable.
- source_word: οἴκῳ
  choice: maison
  rationale: « Maison » garde le terme concret du grec, tout en pouvant désigner par extension la maison royale ou sa cour.
- source_word: ὀνομαστὴ
  choice: renommée
  rationale: L’adjectif indique que Judith sera connue et notable ; « renommée » convient au ton élevé de la promesse.
- source_word: παρὰ πᾶσαν τὴν γῆν
  choice: sur toute la terre
  rationale: Cette expression conserve l’ampleur universelle de l’affirmation sans la réduire à un seul pays.
theological_decisions:
- issue: Majuscule ou minuscule pour θεός dans la déclaration d’Holopherne
  choice: ton dieu sera mon dieu
  alternative: ton Dieu sera mon Dieu
  rationale: L’écriture grecque ne tranche pas la question. La minuscule reflète le cadre païen du discours d’Holopherne sans nier que le référent est le Dieu de Judith ; la note signale explicitement l’ambiguïté typographique et théologique.
translation_notes:
  register: Français international moderne, clair et digne. Le verset conserve le parallélisme élogieux du grec, mais emploie des tours idiomatiques. Le nom « Nabuchodonosor » suit la forme française traditionnelle correspondant au grec Ναβουχοδονόσορ.
