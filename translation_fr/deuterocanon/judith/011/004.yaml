base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/004.yaml
  text: Take courage; you will live through this night and beyond. For there is no one who will wrong you; rather[a], he will treat you well, as is done for the servants of my lord King Nebuchadnezzar.
translation:
  language: fr
  text: Prends courage ! Cette nuit, tu resteras en vie, et par la suite aussi. En effet, personne ne te fera de tort ; au contraire, on te traitera bien, comme on le fait pour les serviteurs[a] de mon seigneur, le roi Nabuchodonosor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « esclaves ». Selon le contexte, le mot grec peut désigner des serviteurs ou des esclaves.
    reason: lexical_alternative
lexical_decisions:
- source_word: θάρσει
  choice: Prends courage !
  rationale: L’impératif exprime à la fois l’encouragement et le réconfort. Cette formulation est naturelle en français moderne et conserve sa force.
- source_word: ἐν τῇ νυκτὶ ταύτῃ ζήσῃ καὶ εἰς τὸ λοιπόν
  choice: Cette nuit, tu resteras en vie, et par la suite aussi
  rationale: ζάω signifie ici demeurer en vie, tandis que εἰς τὸ λοιπόν étend cette assurance au temps qui suivra. La formulation française exprime les deux horizons sans réduire le propos à la seule survie de la nuit.
- source_word: ἀδικήσει
  choice: fera de tort
  rationale: ἀδικέω peut désigner une injustice, un tort ou un mauvais traitement. « Faire du tort » préserve cette portée générale sans la limiter à une atteinte physique.
- source_word: ἀλλʼ εὖ σε ποιήσει
  choice: au contraire, on te traitera bien
  rationale: Le singulier grec à valeur indéfinie se rend naturellement par « on » en français. « Traiter bien » exprime idiomatiquement εὖ ποιεῖν dans ce contexte.
- source_word: καθὰ γίνεται
  choice: comme on le fait
  rationale: Cette tournure conserve le caractère général ou coutumier de l’expression grecque.
- source_word: τοῖς δούλοις
  choice: les serviteurs
  rationale: Dans ce contexte de cour royale, « serviteurs » convient au personnel placé au service du roi, tout en signalant en note que δοῦλος peut aussi désigner un esclave.
- source_word: τοῦ κυρίου μου βασιλέως Ναβουχοδονόσορ
  choice: de mon seigneur, le roi Nabuchodonosor
  rationale: κύριος est ici un titre social de déférence et non un titre divin. L’apposition française distingue clairement ce titre de celui de roi.
theological_decisions:
- issue: Sens de δοῦλοι dans le cadre de la cour royale
  choice: serviteurs
  alternative: esclaves
  rationale: Le passage met l’accent sur l’appartenance au service du roi et sur le traitement réservé à ses gens, sans souligner explicitement leur statut de personnes asservies. La note conserve néanmoins l’autre sens réel du terme grec.
translation_notes:
  register: Français moderne, courant et digne. Le tutoiement correspond aux formes grecques au singulier. « Mon seigneur » conserve le langage déférent de la cour sans donner à κύριος une portée divine.
