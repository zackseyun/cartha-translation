base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/019.yaml
  text: And I will lead you through the midst of Judea until you come opposite Jerusalem[a], and I will set your chariot in her midst, and you will drive them like sheep that have no shepherd, and not even a dog will growl with its tongue against you; for these things were spoken to me according to my foreknowledge, and they were reported to me[c][b], and I was sent to tell you.
translation:
  language: fr
  text: Je te conduirai à travers la Judée jusqu’en face de Jérusalem[a]. J’établirai ton char au milieu de la ville, et tu les mèneras comme des brebis qui n’ont pas de berger. Pas même un chien ne grognera contre toi de sa langue[b], car ces choses m’ont été dites conformément à ma connaissance préalable[c] et m’ont été rapportées, et j’ai été envoyée pour te les annoncer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « devant Jérusalem » ou « face à Jérusalem ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ne grognera contre toi de sa langue ». Cette expression imagée souligne l’absence totale de résistance.'
    reason: cultural_note
  - marker: c
    text: L’expression grecque désigne ici une connaissance préalable ; elle n’emploie pas nécessairement « prescience » dans un sens théologique technique.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄξω
  choice: Je te conduirai
  rationale: Le futur de ἄγω exprime ici l’action personnelle de guider Holopherne à travers le pays.
- source_word: διὰ μέσου τῆς Ἰουδαίας
  choice: à travers la Judée
  rationale: Formulation française naturelle qui conserve le parcours au cœur du territoire sans la lourdeur de « au milieu de la Judée ».
- source_word: ἕως τοῦ ἐλθεῖν ἀπέναντι Ἰερουσαλήμ
  choice: jusqu’en face de Jérusalem
  rationale: ἀπέναντι indique une position face à la ville et n’implique pas encore qu’on y entre.
- source_word: θήσω τὸν δίφρον σου
  choice: J’établirai ton char
  rationale: Dans ce contexte militaire, δίφρος désigne le char; « établir » rend l’idée de le placer ou l’installer dans la ville.
- source_word: ἐν μέσῳ αὐτῆς
  choice: au milieu de la ville
  rationale: Le pronom renvoie à Jérusalem. Répéter « la ville » évite en français l’ambiguïté d’un simple pronom féminin.
- source_word: ἄξεις αὐτούς
  choice: tu les mèneras
  rationale: Le même verbe ἄγω est repris; « mener » s’accorde naturellement avec l’image pastorale qui suit, tout en pouvant évoquer la domination.
- source_word: ὡς πρόβατα οἷς οὐκ ἔστιν ποιμήν
  choice: comme des brebis qui n’ont pas de berger
  rationale: Rend directement l’image biblique de la vulnérabilité d’un peuple privé de direction.
- source_word: οὐ γρύξει κύων τῇ γλώσσῃ αὐτοῦ
  choice: Pas même un chien ne grognera contre toi en remuant la langue
  rationale: γρύζω évoque un grognement plutôt qu’un aboiement. La mention explicite de la langue est maintenue sous une forme compréhensible.
- source_word: κατὰ πρόγνωσίν μου
  choice: selon ce que je savais d’avance
  rationale: Cette formulation conserve le sens de connaissance préalable sans donner à πρόγνωσις une valeur doctrinale technique.
- source_word: ἀπηγγέλη μοι
  choice: m’ont été rapportées
  rationale: Le passif conserve l’idée que Judith a reçu ces informations sans préciser leur source.
- source_word: ἀπεστάλην ἀναγγεῖλαί σοι
  choice: j’ai été envoyée pour te les annoncer
  rationale: Rend à la fois la mission exprimée par ἀποστέλλω et la communication formelle exprimée par ἀναγγέλλω.
theological_decisions:
- issue: Sens de πρόγνωσις dans le discours de Judith
  choice: « ce que je savais d’avance », au sens non technique de connaissance préalable
  alternative: « prescience », révélation spéciale ou prémonition
  rationale: Le passage affirme une connaissance antérieure sans en définir précisément la nature. La traduction évite d’y importer la notion théologique technique de prescience divine.
- issue: Source de ce qui a été communiqué à Judith
  choice: Conserver le passif « m’ont été rapportées » sans nommer l’agent
  alternative: Préciser que Dieu ou un messager divin le lui a révélé
  rationale: Le grec ne nomme pas l’agent; le préciser résoudrait une ambiguïté que le texte maintient.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe de Judith à Holopherne. La syntaxe reste proche du mouvement du grec tout en évitant les calques peu naturels; les ambiguïtés concernant la position devant Jérusalem, la connaissance préalable et la source du message sont préservées.
