  to: Je te conduirai à travers la Judée jusqu’en face de Jérusalem[a]. J’établirai ton char au milieu de la ville, et tu les mèneras comme des brebis qui n’ont pas de berger. Pas même un chien ne grognera contre toi de sa langue[b], car ces choses m’ont été dites conformément à ma connaissance préalable[c] et m’ont été rapportées, et j’ai été envoyée pour te les annoncer.
