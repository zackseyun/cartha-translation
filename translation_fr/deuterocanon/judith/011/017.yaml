  text: for your servant is God-fearing[a], and serves the God of heaven night and day. And now I will remain with you, my lord, and your servant will go out by night into the valley, and I will pray to God[b], and he will tell me when they have committed their sin.
translation:
  language: fr
  text: car ta servante[a] craint Dieu et sert le Dieu du ciel nuit et jour. Maintenant, je demeure auprès de toi, mon seigneur. Ta servante sortira de nuit dans le ravin[b] et je prierai Dieu ; il me dira quand ils auront commis leur péché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « femme esclave ». Le grec δούλη peut désigner une esclave, mais il sert ici de formule déférente par laquelle Judith parle d’elle-même.
    reason: lexical_alternative
  - marker: b
    text: Ou « gorge » ou « vallée ». Le grec φάραγξ désigne une dépression encaissée dont la forme exacte dépend du relief.
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλη
  choice: servante
  rationale: Le féminin « servante » convient à l’auto-désignation déférente de Judith devant Holopherne, tout en laissant en note le sens social plus fort possible de « femme esclave ».
- source_word: θεοσεβής
  choice: craint Dieu
  rationale: Cette formulation française naturelle conserve explicitement l’idée de révérence envers Dieu contenue dans le composé grec.
- source_word: θεραπεύουσα
  choice: sert
  rationale: Dans ce contexte religieux, « sert » exprime une consécration continue au Dieu du ciel sans réduire le terme au seul culte liturgique.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: nuit et jour
  rationale: Expression idiomatique qui conserve le mérisme et l’idée de continuité.
- source_word: τὸν θεὸν τοῦ οὐρανοῦ
  choice: le Dieu du ciel
  rationale: Rend directement le génitif grec et préserve ce titre biblique traditionnel.
- source_word: μενῶ παρὰ σοί
  choice: je resterai auprès de toi
  rationale: « Auprès de toi » traduit παρά avec le datif et indique que Judith demeurera dans l’entourage ou la présence d’Holopherne.
- source_word: κύριε μου
  choice: mon seigneur
  rationale: Titre humain de déférence adressé à Holopherne ; cette formulation garde le registre élevé sans impliquer ici un titre divin.
- source_word: ἐξελεύσεται
  choice: sortira
  rationale: Le futur exprime simplement le déplacement hors du camp ; « sortira » est direct et naturel.
- source_word: κατὰ νύκτα
  choice: de nuit
  rationale: Formulation concise et légèrement soutenue qui correspond à l’indication temporelle grecque.
- source_word: φάραγγα
  choice: le ravin
  rationale: Le nom grec désigne typiquement une dépression étroite, un ravin ou une gorge ; « ravin » est plus précis que « vallée » tout en restant courant.
- source_word: προσεύξομαι πρὸς τὸν θεόν
  choice: je prierai Dieu
  rationale: Expression française idiomatique pour une prière adressée à Dieu.
- source_word: ἐρεῖ μοι
  choice: il me dira
  rationale: Traduit simplement la communication personnelle exprimée par λέγω au futur.
- source_word: πότε ἐποίησαν τὸ ἁμάρτημα αὐτῶν
  choice: quand ils auront commis leur péché
  rationale: Le futur antérieur français rend naturellement le point d’accomplissement futur envisagé, tandis que « leur péché » conserve le singulier grec.
theological_decisions:
- issue: Sens de δούλη dans l’auto-désignation de Judith
  choice: servante
  alternative: femme esclave
  rationale: Le mot peut désigner une femme esclave, mais il fonctionne ici surtout comme une formule déférente à la troisième personne. La traduction principale privilégie cette fonction discursive sans effacer l’autre sens, indiqué en note.
- issue: Portée religieuse de θεραπεύουσα
  choice: sert
  alternative: rend un culte à
  rationale: « Sert » maintient l’éventail du grec entre service, dévouement et service religieux, sans imposer une lecture exclusivement liturgique.
- issue: Moment où le péché est commis
  choice: quand ils auront commis leur péché
  alternative: quand ils commettront leur péché
  rationale: La tournure avec le futur antérieur souligne l’accomplissement du péché avant que Dieu n’en informe Judith, sans préciser davantage la nature du péché.
translation_notes:
  register: Français international moderne, digne et lisible. Le passage conserve l’auto-désignation déférente à la troisième personne (« ta servante »), le titre humain « mon seigneur » et la répétition voulue entre cette auto-désignation et « je ». La ponctuation répartit les propositions longues du grec sans en modifier la logique.
