base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/013.yaml
  text: And the firstfruits of the grain and the tithes of the wine and of the oil[a], which they had set aside, having consecrated them for the priests who stand in Jerusalem before the face of our God—they have decided to consume[b], though it is not permitted for any of the people even to touch them with their hands.
translation:
  language: fr
  text: Et les prémices du grain et les dîmes du vin et de l’huile, qu’ils avaient mises en réserve et consacrées aux prêtres qui se tiennent à Jérusalem devant la face de notre Dieu[a], ils ont décidé de les consommer, alors qu’aucun membre du peuple n’est même autorisé à les toucher de ses mains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant notre Dieu », c’est-à-dire en sa présence. Le grec dit littéralement « devant la face de notre Dieu ».
    reason: lexical_alternative
  - marker: b
    text: Ou « alors qu’il ne convient à aucun membre du peuple » ou « alors qu’il n’est légitime pour aucun membre du peuple » de même les toucher de ses mains.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαρχὰς τοῦ σίτου
  choice: les prémices du grain
  rationale: « Prémices » conserve le sens cultuel de la première part offerte, tandis que « grain » préserve la portée possiblement générique de σῖτος sans la réduire au blé.
- source_word: τὰς δεκάτας τοῦ οἴνου καὶ τοῦ ἐλαίου
  choice: les dîmes du vin et de l’huile
  rationale: « Dîmes » est le terme cultuel français naturel pour δεκάτας et maintient la coordination du grec.
- source_word: ἃ ἐφυλάξαν
  choice: qu’ils avaient mises en réserve
  rationale: Dans ce contexte, φυλάσσω désigne des produits gardés à part en vue d’un usage sacré; « mises en réserve » est plus précis que le simple « gardées ».
- source_word: ἁγιάσαντες τοῖς ἱερεῦσιν
  choice: et consacrées aux prêtres
  rationale: Le participe indique leur mise à part sacrée, et le datif désigne les prêtres comme destinataires ou bénéficiaires. La coordination française rend naturellement l’antériorité déjà exprimée par le plus-que-parfait.
- source_word: τοῖς παρεστηκόσιν
  choice: qui se tiennent
  rationale: Cette formulation conserve l’image concrète de prêtres se tenant en service, sans remplacer explicitement cette image par une interprétation fonctionnelle.
- source_word: ἀπέναντι τοῦ προσώπου τοῦ θεοῦ ἡμῶν
  choice: devant la face de notre Dieu
  rationale: Le tour volontairement solennel conserve l’expression grecque d’allure sémitique et son image de présence divine.
- source_word: κεκρίκασιν ἐξαναλῶσαι
  choice: ils ont décidé de les consommer
  rationale: κεκρίκασιν exprime ici une décision arrêtée; ἐξαναλῶσαι signifie épuiser ou consommer les denrées, vraisemblablement comme provisions.
- source_word: οὐδὲ ταῖς χερσὶν καθῆκεν ἅψασθαι
  choice: il n’est permis ... de seulement les toucher de ses mains
  rationale: La traduction exprime la force normative de καθῆκεν tout en conservant l’accent grec sur le contact des mains. « Seulement » rend ici la valeur intensive de οὐδέ, c’est-à-dire « même » dans une phrase négative.
- source_word: οὐδένα τῶν ἐκ τοῦ λαοῦ
  choice: à aucun membre du peuple
  rationale: Cette formulation distingue clairement les gens du peuple des prêtres sans introduire une catégorie sociale plus précise que le grec.
theological_decisions:
- issue: Statut cultuel des produits réservés aux prêtres
  choice: Les produits ont déjà été consacrés aux prêtres de Jérusalem et ne peuvent donc pas être manipulés par les membres ordinaires du peuple.
  alternative: On pourrait comprendre qu’ils ont simplement été mis de côté pour les prêtres, sans consécration cultuelle formelle.
  rationale: La combinaison de ἐφυλάξαν, ἁγιάσαντες, de la destination sacerdotale et de l’interdiction même de les toucher soutient nettement leur statut sacré, tout en laissant le texte décrire plutôt que systématiser la règle cultuelle.
- issue: Sens normatif de καθῆκεν
  choice: « il n’est permis »
  alternative: « il n’est pas convenable » ou « il n’est pas légitime »
  rationale: Le contexte sacré donne au verbe une portée normative forte, mais une note conserve son éventail lexical sans préciser abusivement la source juridique de l’interdiction.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe suit la longue période grecque tout en la rendant fluide. « Prémices », « dîmes » et « consacrées » conservent le registre cultuel; « devant la face » maintient volontairement l’image solennelle du texte source. Tous les appels de notes [a] et [b] figurent dans le corps du verset.
