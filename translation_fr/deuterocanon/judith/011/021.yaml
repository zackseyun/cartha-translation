base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/021.yaml
  text: There is no woman like this one from one end of the earth to the other, in beauty of face and wisdom of speech.
translation:
  language: fr
  text: Il n’y a pas, d’un bout à l’autre de la terre[a], de femme comme celle-ci pour la beauté de son visage et l’intelligence de ses paroles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’un bout à l’autre du pays ». Le grec γῆ peut désigner soit la terre, soit un pays ; le sens plus large convient à l’éloge hyperbolique formulé ici.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans un beau visage et l’intelligence des paroles ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ ἔστιν
  choice: Il n’y a aucune
  rationale: Rend naturellement en français la tournure existentielle grecque niée, tout en conservant sa portée absolue.
- source_word: τοιαύτη γυνὴ
  choice: femme comme celle-ci
  rationale: Préserve à la fois l’idée de qualité portée par τοιαύτη et sa force démonstrative.
- source_word: ἀπʼ ἄκρου ἕως ἄκρου τῆς γῆς
  choice: d’un bout à l’autre de la terre
  rationale: Expression française idiomatique correspondant au mérisme grec; « terre » convient à la portée hyperbolique générale, sans exclure l’autre sens possible de γῆ.
- source_word: ἐν καλῷ προσώπῳ
  choice: par la beauté de son visage
  rationale: Exprime le domaine dans lequel elle est déclarée incomparable et rend καλός avec πρόσωπον comme une appréciation de la beauté physique.
- source_word: καὶ συνέσει λόγων
  choice: et l’intelligence de ses paroles
  rationale: σύνεσις désigne l’intelligence, le discernement ou la compréhension, tandis que λόγοι renvoie ici aux paroles; la formulation garde le lien étroit avec le grec sans réduire l’éloge à la seule éloquence.
