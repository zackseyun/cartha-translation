  text: And when I come[a], I will open the way before you, and you will go out with all your force, and there is none among them who will stand against you.
translation:
  language: fr
  text: Quand je serai venue[a], je t’ouvrirai le chemin, et tu sortiras avec toutes tes forces ; parmi eux, personne ne te résistera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Une fois venue, je t’ouvrirai d’avance. » Le verbe grec peut signifier « ouvrir d’avance » ; « le chemin » est sous-entendu d’après le contexte et n’est pas exprimé dans le texte grec.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθοῦσα
  choice: quand je serai venue
  rationale: Le participe aoriste féminin singulier se rapporte à Judith et marque une action antérieure à l’ouverture annoncée. Une proposition temporelle au futur antérieur est naturelle en français et préserve cette succession.
- source_word: προανοίσω
  choice: je t’ouvrirai le chemin
  rationale: Le futur de προανοίγω exprime l’idée d’ouvrir d’avance ou devant quelqu’un. Le complément « le chemin », non exprimé en grec, est fourni par le contexte de l’avancée militaire et rend l’expression naturelle en français, tandis que la note signale l’implicite.
- source_word: ἐξελεύσῃ
  choice: tu sortiras
  rationale: Le futur moyen de ἐξέρχομαι signifie fondamentalement sortir. « Tu sortiras » conserve cette formulation large sans imposer le sens plus précis de « partir en campagne ».
- source_word: σὺν πάσῃ τῇ δυνάμει σου
  choice: avec toutes tes forces
  rationale: Dans ce contexte militaire, δύναμις peut désigner la puissance armée ou les troupes. Le pluriel français « toutes tes forces » est idiomatique et garde à la fois la nuance de puissance et celle de forces militaires.
- source_word: οὐκ ἔστιν ὃς ἀντιστήσεταί σοι
  choice: personne ne te résistera
  rationale: ἀνθίστημι signifie se dresser contre, s’opposer ou résister. « Résistera » est naturel en français moderne et convient nettement au contexte militaire.
- source_word: ἐξ αὐτῶν
  choice: parmi eux
  rationale: 'La préposition a ici une valeur partitive : aucun membre du groupe adverse ne résistera. « Parmi eux » exprime clairement ce rapport.'
