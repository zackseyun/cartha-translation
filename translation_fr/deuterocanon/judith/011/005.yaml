base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/005.yaml
  text: And Judith said to him[a], “Receive the words of your servant, and let your maidservant speak before you[b], and I will not tell a lie to my lord this night.”
translation:
  language: fr
  text: 'Judith lui dit : « Reçois les paroles de ton esclave[a], et que ta jeune servante parle devant toi. Cette nuit, je ne dirai aucun mensonge à mon seigneur[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « servante ». Le grec peut désigner une servante ou une esclave ; « esclave » conserve ici le terme de condition plus fort employé par Judith pour s’abaisser.
    reason: lexical_alternative
  - marker: b
    text: Ou « maître ». Le mot grec désigne ici un supérieur humain, et non Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δέξαι
  choice: Accueille
  rationale: L’impératif de δέχομαι invite à recevoir favorablement ses paroles, et non simplement à les entendre.
- source_word: τὰ ῥήματα
  choice: les paroles
  rationale: ῥήματα désigne ici les paroles prononcées ; cette traduction reste directe et naturelle.
- source_word: τῆς δούλης σου
  choice: de ton esclave
  rationale: Le féminin δούλη peut désigner une servante ou une esclave. « Esclave » conserve la force du terme et l’abaissement volontaire de Judith dans cette adresse.
- source_word: λαλησάτω
  choice: que … parle
  rationale: Cette tournure rend naturellement l’impératif à la troisième personne et sa valeur de requête.
- source_word: ἡ παιδίσκη σου
  choice: ta jeune servante
  rationale: παιδίσκη désigne une fille ou une jeune femme de condition servile. « Jeune servante » préserve la nuance féminine et distingue ce terme de δούλη.
- source_word: κατὰ πρόσωπόν σου
  choice: devant toi
  rationale: Rendu idiomatique de l’expression signifiant littéralement « en face de toi », c’est-à-dire en ta présence.
- source_word: οὐκ ἀναγγελῶ ψεῦδος
  choice: je ne dirai aucun mensonge
  rationale: ἀναγγέλλω signifie annoncer ou rapporter, mais avec ψεῦδος la formulation française naturelle est « dire un mensonge ». « Aucun » exprime clairement la négation.
- source_word: τῷ κυρίῳ μου
  choice: à mon seigneur
  rationale: κύριος désigne ici un supérieur humain. « Mon seigneur » restitue l’adresse déférente sans en faire un titre divin.
- source_word: ἐν τῇ νυκτὶ ταύτῃ
  choice: Cette nuit
  rationale: La place initiale est naturelle en français et conserve la précision temporelle du grec.
theological_decisions:
- issue: Les deux désignations de Judith, δούλη et παιδίσκη
  choice: « ton esclave » puis « ta jeune servante »
  alternative: « ta servante » puis « ta servante »
  rationale: Le grec emploie deux termes féminins distincts. Les différencier préserve la rhétorique d’humilité ainsi que la nuance plus forte de condition servile portée par δούλη.
- issue: κύριος appliqué à un supérieur humain
  choice: « mon seigneur »
  alternative: « mon maître »
  rationale: Le référent est Holopherne et non Dieu. « Seigneur » exprime ici une déférence de cour ; la note signale l’autre rendu possible.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le tutoiement suit les formes grecques au singulier et convient à la scène. La distinction entre « esclave » et « jeune servante » conserve les deux auto-désignations grecques.
