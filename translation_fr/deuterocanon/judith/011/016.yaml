base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/016.yaml
  text: Therefore I[a], your servant, having learned all these things, fled from before them, and God sent me to do with you things at which the whole earth will be astonished[c][b], whenever they hear of them.
translation:
  language: fr
  text: C’est pourquoi moi, ta servante, ayant appris tout cela, je me suis enfuie loin d’eux[a], et Dieu m’a envoyée pour accomplir avec toi des choses[b] qui stupéfieront toute la terre[c], quand on en entendra parler.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de devant eux »; on peut aussi traduire : « loin de leur présence ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « pour faire avec toi des choses ». L’expression grecque reste générale et ne précise pas exactement quel rôle Holopherne doit jouer.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « le monde entier »; dans un sens plus restreint, l’expression peut aussi désigner « tout le pays ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence tirée des affirmations précédentes, tout en conservant la valeur logique du grec.
- source_word: ἡ δούλη σου
  choice: ta servante
  rationale: Judith emploie une formule de déférence envers Holopherne. « Servante » convient au registre de cour sans imposer ici l’idée d’un statut juridique d’esclave.
- source_word: ἐπιγνοῦσα ταῦτα πάντα
  choice: ayant appris tout cela
  rationale: Le participe exprime une connaissance acquise avant la fuite; « tout cela » rend naturellement la totalité visée par πάντα.
- source_word: ἀπέδρων ἀπὸ προσώπου αὐτῶν
  choice: je me suis enfuie loin d’eux
  rationale: Rend clairement le mouvement de fuite et le sens idiomatique de l’expression littérale « loin de leur face/présence ».
- source_word: ἀπέστειλέν με ὁ θεός
  choice: Dieu m’a envoyée
  rationale: Traduit directement l’affirmation de Judith sans l’atténuer ni la valider au-delà du discours rapporté.
- source_word: ποιῆσαι μετὰ σοῦ πράγματα
  choice: pour accomplir avec toi des choses
  rationale: Conserve l’ampleur indéterminée de πράγματα et l’ambiguïté de μετὰ σοῦ quant au rôle exact d’Holopherne.
- source_word: ἐκστήσεται
  choice: stupéfieront
  rationale: Exprime la forte réaction d’étonnement portée par le verbe grec dans un français naturel et soutenu.
- source_word: πᾶσα ἡ γῆ
  choice: toute la terre
  rationale: Préserve la portée rhétoriquement universelle de l’expression, sans exclure les sens contextuels « monde » ou « pays ».
- source_word: ὅσο ἐὰν ἀκούσωσιν αὐτά
  choice: quand on en entendra parler
  rationale: Formulation française idiomatique reliant la stupéfaction à la diffusion du récit de ces choses. Le sujet indéfini du grec est rendu par « on ».
theological_decisions:
- issue: Affirmation d’une mission divine dans le discours de Judith
  choice: « Dieu m’a envoyée »
  alternative: « je crois que Dieu m’a envoyée » ou « Dieu m’aurait envoyée »
  rationale: Le grec présente cette déclaration directement dans la bouche de Judith. La traduction ne doit ni affaiblir son affirmation ni résoudre la tension narrative et théologique qu’elle peut susciter.
translation_notes:
  register: Français moderne, digne et accessible. Le tutoiement correspond au singulier grec et au discours direct adressé à Holopherne. La tournure demeure solennelle sans calquer inutilement la syntaxe grecque; les notes préservent les ambiguïtés lexicales réelles.
