base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/002.yaml
  text: And now[a], if your people who live in the hill country had not treated me with contempt, I would not have raised my spear against them; but they themselves have brought these things on themselves.
translation:
  language: fr
  text: Et maintenant, si ton peuple qui habite la région montagneuse ne m’avait pas traité avec mépris[a], je n’aurais pas levé ma lance contre eux. Mais ce sont eux-mêmes qui ont attiré cela sur eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne m’avait pas dédaigné » ou « ne m’avait pas insulté ». Le verbe grec évoque le fait de traiter quelqu’un comme une personne sans importance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαός σου
  choice: ton peuple
  rationale: λαός désigne collectivement un peuple. « Ton peuple » est naturel dans cette adresse directe et conserve le singulier collectif grec.
- source_word: ὁ κατοικῶν τὴν ὀρεινήν
  choice: qui habite la région montagneuse
  rationale: Le participe au singulier s’accorde avec le collectif « peuple ». Employé substantivement, ἡ ὀρεινή désigne une région montagneuse ou les hauteurs.
- source_word: εἰ μὴ ἐφαύλισάν με
  choice: si … ne m’avait pas traité avec mépris
  rationale: Le verbe φαυλίζω exprime le fait de tenir quelqu’un pour peu de chose, de le mépriser ou de l’insulter. Le plus-que-parfait français rend naturellement la condition irréelle portant sur le passé.
- source_word: οὐκ ἂν ἦρα
  choice: je n’aurais pas levé
  rationale: Le conditionnel passé restitue l’apodose irréelle marquée par ἄν, tandis que « lever » conserve le sens concret de αἴρω.
- source_word: τὸ δόρυ μου
  choice: ma lance
  rationale: δόρυ désigne une arme d’hast. « Lance » est un équivalent français courant, digne et immédiatement compréhensible.
- source_word: ἐπʼ αὐτούς
  choice: contre eux
  rationale: Avec le geste hostile de lever une arme, ἐπί suivi de l’accusatif exprime naturellement l’action dirigée contre des personnes.
- source_word: ἀλλὰ αὐτοὶ ἑαυτοῖς ἐποίησαν ταῦτα
  choice: Mais ce sont eux-mêmes qui ont attiré cela sur eux
  rationale: Cette formulation idiomatique garde l’insistance de αὐτοί et la responsabilité réflexive exprimée par ἑαυτοῖς, sans préciser une causalité théologique absente du grec. Le singulier « cela » reprend globalement les événements évoqués par ταῦτα.
theological_decisions:
- issue: Degré d’explicitation de la responsabilité dans la dernière proposition
  choice: ce sont eux-mêmes qui ont attiré cela sur eux
  alternative: ils se sont eux-mêmes fait cela
  rationale: Le texte attribue aux habitants la responsabilité de ce qui leur arrive, mais ne nomme ni jugement divin ni destin. La traduction conserve cette responsabilité sans ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, naturel et soutenu sans archaïsme. Le tutoiement correspond au singulier σου dans l’adresse directe. Le décalage entre « ton peuple » au singulier et « eux » au pluriel reproduit l’accord selon le sens déjà présent en grec.
