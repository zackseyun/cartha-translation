base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/010.yaml
  text: Therefore[a], master lord, do not disregard his word, but lay it up in your heart, because it is true; for our people are not avenged, nor does the sword prevail against them[c][b], unless they sin against their God.
translation:
  language: fr
  text: 'Ainsi donc, maître et seigneur[a], ne néglige pas sa parole, mais garde-la dans ton cœur, car elle est vraie. En effet, notre peuple n’est pas châtié[b], et l’épée ne l’emporte pas sur lui, à moins que le peuple ne pèche contre son Dieu.


    [a] Le grec réunit ici deux titres distincts, « maître » et « seigneur ».


    [b] Le verbe grec évoque l’exécution d’un jugement, voire d’une vengeance punitive.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec réunit ici deux titres distincts, « maître » et « seigneur ».
    reason: Précise que la formulation inhabituelle reflète volontairement le double vocatif grec.
  - marker: b
    text: Le verbe grec évoque l’exécution d’un jugement, voire d’une vengeance punitive.
    reason: Signale l’étendue sémantique et la nuance judiciaire de ἐκδικάται, sans proposer une alternative française peu idiomatique.
lexical_decisions:
- source_word: διό
  choice: Ainsi donc
  rationale: Marque naturellement en français la conséquence tirée de ce qui précède.
- source_word: δέσποτα κύριε
  choice: maître et seigneur
  rationale: Conserve les deux titres grecs sans faire de l’adresse à Holopherne un titre spécifiquement divin.
- source_word: μὴ παρέλθῃς τὸν λόγον αὐτοῦ
  choice: ne néglige pas sa parole
  rationale: Rend le sens idiomatique de « passer outre à sa parole », c’est-à-dire ne pas en tenir compte.
- source_word: κατάθου αὐτὸν ἐν τῇ καρδίᾳ σου
  choice: dépose-la dans ton cœur
  rationale: Préserve l’image concrète d’une parole placée et gardée intérieurement.
- source_word: ἀληθής
  choice: vraie
  rationale: Accord avec « parole » et rendu direct de l’adjectif prédicatif.
- source_word: ἐκδικάται
  choice: n’est pas châtié
  rationale: Dans ce contexte, le verbe désigne l’exécution d’un jugement punitif contre le peuple ; « châtié » maintient le parallèle avec la défaite militaire.
- source_word: τὸ γένος ἡμῶν
  choice: notre peuple
  rationale: Désigne ici le groupe national auquel Judith appartient ; « peuple » est plus naturel et moins équivoque que « race » en français contemporain.
- source_word: κατισχύει ῥομφαία ἐπʼ αὐτούς
  choice: l’épée ne l’emporte pas sur lui
  rationale: Conserve l’image militaire de l’épée et le sens de domination ou de victoire porté par κατισχύω.
- source_word: ἐὰν μὴ ἁμάρτωσιν εἰς τὸν θεὸν αὐτῶν
  choice: à moins qu’il ne pèche contre son Dieu
  rationale: Exprime directement la condition exclusive posée par le grec, avec un référent collectif singulier naturel en français.
theological_decisions:
- issue: Double titre adressé à Holopherne
  choice: maître et seigneur
  alternative: souverain seigneur
  rationale: Les deux substantifs grecs sont représentés, mais la formulation évite d’assimiler silencieusement l’adresse humaine à un titre divin.
- issue: Condition théologique de la défaite du peuple
  choice: à moins qu’il ne pèche contre son Dieu
  alternative: s’il ne pèche pas contre son Dieu
  rationale: La tournure française exprime la seule condition sous laquelle le châtiment et la victoire de l’épée peuvent survenir, sans atténuer l’affirmation théologique du texte.
- issue: Sens judiciaire de ἐκδικάται
  choice: n’est pas châtié
  alternative: ne subit pas la justice
  rationale: Le contexte exige un jugement punitif plutôt qu’une idée selon laquelle le peuple serait vengé en sa faveur ; la note conserve toutefois la largeur judiciaire du verbe.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond au singulier grec de l’adresse. La métaphore du cœur et l’image de l’épée sont conservées ; la ponctuation en deux phrases améliore la lisibilité sans modifier le rapport logique.
