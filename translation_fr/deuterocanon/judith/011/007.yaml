base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/007.yaml
  text: For King Nebuchadnezzar[a], of all the earth, lives, and his dominion lives—he who sent you for the success of every living soul. For not only will men serve him because of you[c][b], but also the wild animals and the cattle and the birds of the sky will live under your strength for Nebuchadnezzar and all his house.
translation:
  language: fr
  text: Car le roi Nabuchodonosor, roi de toute la terre, est vivant, et sa puissance est vivante, lui qui t’a envoyé pour assurer la réussite de tout être vivant.[a] En effet, grâce à toi, non seulement les humains le serviront, mais même les animaux sauvages, le bétail et les oiseaux du ciel vivront, par ta force, pour Nabuchodonosor et toute sa maison.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque peut aussi se traduire : « pour l’heureux accomplissement de toute vie » ou « pour la prospérité de toute personne ». Ici, le mot rendu par « être vivant » ne désigne pas nécessairement l’âme immatérielle.'
    reason: lexical_alternative
  - marker: b
    text: 'La fin de la phrase est très condensée en grec. On peut aussi comprendre : « vivront sous ta puissance pour Nabuchodonosor et toute sa maison ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ζῇ ... καὶ ζῇ
  choice: est vivant ... est vivante
  rationale: Conserve la répétition emphatique de cette formule d’acclamation proche du serment, tout en respectant le genre des noms français.
- source_word: βασιλεὺς Ναβουχοδονόσορ πάσης τῆς γῆς
  choice: le roi Nabuchodonosor, roi de toute la terre
  rationale: Le second « roi » explicite en français le lien syntaxique naturel de πάσης τῆς γῆς sans réduire l’expression au simple sens de « originaire de toute la terre ».
- source_word: κράτος
  choice: puissance
  rationale: Dans ce contexte royal, le terme désigne une puissance effective, pouvant englober autorité et domination. « Puissance » permet aussi de rendre naturellement la formule « est vivante ».
- source_word: εἰς κατόρθωσιν πάσης ψυχῆς
  choice: pour assurer la réussite de tout être vivant
  rationale: κατόρθωσις évoque l’heureux accomplissement ou la réussite; ψυχή désigne ici vraisemblablement l’être vivant ou la vie, non spécifiquement une âme immatérielle.
- source_word: ἄνθρωποι
  choice: les humains
  rationale: Le contraste porte sur les êtres humains par opposition aux animaux; ce choix est précis, inclusif et naturel en français moderne.
- source_word: διὰ σὲ
  choice: grâce à toi
  rationale: διά avec l’accusatif exprime ici la cause ou le motif. « Grâce à toi » convient à la flatterie de Judith, tout en évitant le contresens instrumental « par ton intermédiaire ».
- source_word: δουλεύσουσιν
  choice: serviront
  rationale: Le verbe peut signifier être esclave ou assujetti; dans ce cadre impérial, « servir » conserve cette dépendance politique sans préciser abusivement sa forme.
- source_word: θηρία τοῦ ἀγροῦ
  choice: les animaux sauvages
  rationale: Rend clairement en français actuel les animaux non domestiqués, là où le calque « bêtes des champs » serait plus traditionnel.
- source_word: κτήνη
  choice: le bétail
  rationale: Désigne les animaux domestiques possédés ou élevés; « bétail » est concis et idiomatique.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: les oiseaux du ciel
  rationale: Expression biblique claire et naturelle, qui préserve l’image verticale du grec.
- source_word: διὰ τῆς ἰσχύος σου
  choice: par ta force
  rationale: διά suivi du génitif marque normalement le moyen; la traduction conserve donc directement la valeur instrumentale.
- source_word: ζήσονται ... Ναβουχοδονόσορ καὶ πάντα τὸν οἶκον αὐτοῦ
  choice: vivront ... pour Nabuchodonosor et toute sa maison
  rationale: Préserve la formulation hyperbolique et la compression syntaxique du grec. « Maison » garde l’ambiguïté entre maisonnée, entourage royal et maison dynastique.
theological_decisions:
- issue: Acclamation royale attribuant à Nabuchodonosor une souveraineté universelle
  choice: Conserver l’hyperbole « roi de toute la terre » ainsi que la double formule « est vivant »
  alternative: Atténuer le propos en simple compliment de cour ou traduire seulement « règne »
  rationale: Il s’agit des paroles stratégiques de Judith dans le récit. La traduction doit transmettre leur rhétorique sans présenter cette affirmation comme la voix normative du narrateur.
- issue: Sens de ψυχή
  choice: tout être vivant
  alternative: toute âme / toute personne
  rationale: Le contexte, qui enchaîne ensuite humains et animaux, favorise le sens concret de vie ou d’être vivant et ne justifie pas d’importer une conception particulière de l’âme immatérielle.
- issue: Relation finale entre la force d’Holopherne, la vie des animaux et la maison royale
  choice: Préserver la construction « vivront, par ta force, pour Nabuchodonosor et toute sa maison »
  alternative: Interpréter « sous ta puissance » ou rattacher la force uniquement au service du roi
  rationale: La phrase grecque est rhétoriquement condensée. Cette formulation garde les liens grammaticaux disponibles sans résoudre silencieusement leur portée exacte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe conserve le caractère solennel et flatteur du discours de cour. Les répétitions significatives du grec sont maintenues; les expressions devenues opaques sont rendues de manière actuelle. Tous les marqueurs de notes figurent dans le texte.
