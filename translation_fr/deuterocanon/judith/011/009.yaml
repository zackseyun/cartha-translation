base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/009.yaml
  text: And now[a], concerning the matter that Achior spoke in your council, we have heard his words, because the men of Bethulia spared him[b], and he reported to them everything that he had spoken from you.
translation:
  language: fr
  text: Et maintenant, au sujet de ce qu’Akior a dit dans ton conseil, nous avons entendu ses paroles, car les hommes de Béthulie l’ont sauvé[a], et il leur a rapporté tout ce qu’il avait déclaré devant toi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’ont gardé en vie »; le verbe grec peut désigner le fait de préserver quelqu’un ou de le maintenir en sécurité.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « tout ce qu’il avait déclaré auprès de toi », c’est-à-dire vraisemblablement en ta présence.
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: ce qu’Akior a dit
  rationale: Dans cette construction, le singulier λόγος désigne le contenu des propos d’Akior plutôt qu’un mot isolé. Cette formulation est naturelle en français et conserve la reprise par « ses paroles ».
- source_word: συνεδρείᾳ
  choice: conseil
  rationale: Le terme désigne ici une assemblée délibérante; « conseil » convient au contexte et au registre.
- source_word: ἠκούσαμεν τὰ ῥήματα αὐτοῦ
  choice: nous avons entendu ses paroles
  rationale: Le passé composé exprime naturellement en français une information entendue dont les effets demeurent présents, tandis que « paroles » rend directement ῥήματα.
- source_word: περιεποίησαντο
  choice: l’ont sauvé
  rationale: Le verbe exprime ici la préservation d’Akior et de sa vie. « Sauvé » est clair et naturel, sans préciser excessivement la manière dont il a été préservé.
- source_word: οἱ ἄνδρες Βαιτυλουά
  choice: les hommes de Béthulie
  rationale: La désignation masculine du grec est conservée, et Βαιτυλουά est rendu selon la forme française usuelle « Béthulie ».
- source_word: ἀπήγγειλεν
  choice: a rapporté
  rationale: Le verbe décrit la transmission fidèle d’informations; « rapporter » convient à la scène narrative.
- source_word: παρὰ σοί
  choice: devant toi
  rationale: Avec le verbe de parole, παρά suivi du datif indique vraisemblablement que les propos ont été tenus en présence d’Holopherne. « Devant toi » est idiomatique tout en laissant l’alternative littérale en note.
