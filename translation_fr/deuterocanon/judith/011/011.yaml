  terminology: « Mon seigneur » convient à l’adresse humaine respectueuse ; « péché » conserve la portée religieuse de ἁμάρτημα ; « acte inadmissible » rend sobrement l’ambiguïté morale de ἀτοπία. « Fondra sur eux » est une image française naturelle pour ἐπιπεσεῖται.
