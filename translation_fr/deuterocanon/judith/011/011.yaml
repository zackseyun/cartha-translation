base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/011.yaml
  text: And now[a], so that my lord may not become an outcast and ineffective, death will fall upon them, and sin has overtaken them[c][b], by which they provoke their God whenever they commit an offense.
translation:
  language: fr
  text: Et maintenant, afin que mon seigneur ne devienne pas rejeté et impuissant, la mort fondra sur eux[a], et le péché les a atteints ; dans ce péché, ils provoquent leur Dieu chaque fois qu’ils commettent un acte inadmissible[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la mort tombera sur leur face » ; cette tournure grecque est rendue ici de façon idiomatique.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « un acte déplacé », « une absurdité » ou « un acte révoltant ». Le mot grec peut désigner une conduite inconvenante, insensée ou moralement choquante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκβολος
  choice: chassé
  rationale: Le terme évoque le fait d’être jeté dehors ou expulsé. « Chassé » est naturel en français et convient à l’éventualité d’un chef repoussé dans sa campagne.
- source_word: ἄπρακτος
  choice: réduit à l’impuissance
  rationale: Le mot peut désigner quelqu’un qui ne parvient plus à agir ou à accomplir quoi que ce soit. Cette expression rend l’incapacité pratique sans réduire le sens à un simple échec.
- source_word: ἐπιπεσεῖται θάνατος ἐπὶ πρόσωπον αὐτῶν
  choice: la mort fondra sur eux
  rationale: « Fondre sur » conserve l’idée d’une irruption soudaine portée par ἐπιπίπτω, tout en rendant idiomatiquement la mention grecque de leur « face ».
- source_word: κατέλαβε
  choice: les a rattrapés
  rationale: L’aoriste présente le péché comme les ayant déjà atteints. « Rattrapés » garde l’image d’une réalité qui rejoint et saisit ses victimes.
- source_word: ἁμάρτημα
  choice: un péché
  rationale: Le contexte mentionne expressément leur Dieu ; « péché » préserve donc la portée morale et religieuse du terme.
- source_word: παροργιοῦσιν
  choice: ils provoquent
  rationale: Le verbe signifie provoquer, particulièrement provoquer la colère. Le français « provoquer leur Dieu » reste concis tout en laissant entendre cette colère.
- source_word: ἀτοπίαν
  choice: un acte inadmissible
  rationale: Le nom peut évoquer une conduite déplacée, aberrante ou moralement choquante. « Acte inadmissible » conserve cette latitude sans imposer le degré plus fort d’« outrage ».
- source_word: ὁ κύριός μου
  choice: mon seigneur
  rationale: Judith s’adresse avec déférence à Holopherne. La minuscule signale clairement qu’il s’agit d’un titre humain et non divin.
theological_decisions:
- issue: Poids moral et religieux de ἁμάρτημα
  choice: un péché
  alternative: une faute ; une transgression
  rationale: Puisque l’acte provoque explicitement « leur Dieu », « péché » maintient la dimension théologique du grec sans l’atténuer.
- issue: Valeur humaine de κύριος dans l’adresse à Holopherne
  choice: mon seigneur
  alternative: mon maître
  rationale: Le contexte est celui d’une adresse honorifique à un supérieur humain ; la minuscule évite toute assimilation au titre divin.
- issue: Rapport entre le péché et le fait de provoquer Dieu
  choice: par lui, ils provoquent leur Dieu
  alternative: dans lequel ils provoquent leur Dieu
  rationale: Le relatif grec ἐν ᾧ peut exprimer le cadre ou le moyen. « Par lui » offre un français naturel tout en conservant le péché comme moyen ou occasion de la provocation, sans préciser davantage la relation.
translation_notes:
  register: Français international actuel, digne et accessible. L’adresse « mon seigneur » conserve la déférence de Judith envers Holopherne. « La mort fondra sur eux » garde la vigueur de l’image grecque, tandis que les notes signalent les formulations littérales et l’étendue sémantique des termes ambigus.
