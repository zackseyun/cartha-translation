revisions:
- from: Il envoya aussi un message à Jérusalem, car ceux qui y habitaient avaient fait de même, afin que le conseil des anciens accorde la remise[a] à ceux qui s’étaient établis parmi eux.
  to: 'Il envoya un message à Jérusalem : ceux qui y habitaient avaient eux aussi fait ces choses, en accordant aux personnes qui s’étaient établies parmi eux la remise provenant du conseil des anciens[a].'
  rationale: La révision supprime la causalité et la finalité ajoutées par « car » et « afin que ». Elle rend ὅτι par l’introduction du contenu du message et conserve, par « en accordant », le rapport participial du grec. « Provenant du conseil des anciens » rend explicitement l’origine exprimée par παρά sans convertir indûment l’énoncé en demande adressée au conseil.
  reviewer_model: gpt-5.6-terra
