review_pass:
  verdict: revise
  source_fidelity: 'La proposition « car » ne rend pas de façon sûre le ὅτι déclaratif après « envoya un message » : le grec introduit le contenu du message (« que »), non une cause explicitement formulée. Surtout, « afin que » introduit un but absent du grec et transforme l’octroi de la remise en objectif de l’envoi. Une construction participiale permet de conserver le lien syntaxique sans ajouter cette finalité.'
  naturalness: La révision demeure naturelle en français moderne. Le deux-points introduit clairement le contenu du message, et « en accordant » restitue sobrement le participe grec sans la lourdeur d’une répétition du sujet.
  terminology: « Conseil des anciens » rend correctement γερουσία. « Remise » conserve l’indétermination de ἄφεσις dans ce contexte civique; la note présente les possibilités principales sans imposer un sens religieux ou une qualification juridique précise.
  issues:
  - severity: medium
    issue: « car » donne à ὅτι une valeur causale non assurée.
    rationale: Après ἀπεστάλακεν εἰς Ἰερουσαλήμ, ὅτι introduit plus naturellement le message communiqué. « Que » préserve cette relation discursive.
  - severity: high
    issue: « afin que » ajoute une proposition finale absente du texte source.
    rationale: Le grec ne dit pas que l’envoi avait pour but d’obtenir une décision du conseil; il associe l’octroi de l’ἄφεσις à la proposition qui suit. Cette reformulation modifie donc la relation entre les actions.
  revised_text: 'Il envoya un message à Jérusalem : ceux qui y habitaient avaient eux aussi fait ces choses, en accordant aux personnes qui s’étaient établies parmi eux la remise provenant du conseil des anciens[a].'
  revised_footnotes:
