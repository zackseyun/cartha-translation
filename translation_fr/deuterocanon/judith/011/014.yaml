  text: And he sent word to Jerusalem that those living there also had done these things[a], granting to those who had settled among them the release from the council of elders.
translation:
  language: fr
  text: 'Il envoya un message à Jérusalem : ceux qui y habitaient avaient eux aussi fait ces choses, en accordant aux personnes qui s’étaient établies parmi eux la remise provenant du conseil des anciens[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la libération », « l’exemption » ou « le pardon ». Le mot grec peut désigner le fait de libérer, de remettre une obligation ou de pardonner; ici, la mention du conseil des anciens suggère une décision administrative.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεστάλακεν
  choice: Il envoya aussi un message
  rationale: Le parfait est rendu naturellement dans le récit par un passé simple. « Un message » explicite l’envoi implicite d’une communication, tandis que καί est rendu par « aussi ».
- source_word: εἰς Ἰερουσαλήμ
  choice: à Jérusalem
  rationale: Rend naturellement le mouvement vers la ville exprimé par εἰς.
- source_word: ὅτι καὶ ἐκεῖ κατοικοῦντες ἐποίησαν ταῦτα
  choice: car ceux qui y habitaient avaient fait de même
  rationale: ὅτι est compris comme causal dans l’enchaînement. « De même » rend idiomatiquement ταῦτα en renvoyant aux actes déjà mentionnés sans les préciser davantage.
- source_word: τοὺς μετοικίσαντας αὐτοῖς
  choice: à ceux qui s’étaient établis parmi eux
  rationale: Le participe désigne des personnes venues changer de résidence et vivre auprès du groupe; « s’étaient établis parmi eux » conserve cette idée sans imposer un statut juridique technique.
- source_word: τὴν ἄφεσιν
  choice: la remise
  rationale: « Remise » garde l’étendue sémantique de ἄφεσις — libération, exemption, pardon ou remise — mieux qu’un terme français trop exclusivement administratif ou religieux.
- source_word: παρὰ τῆς γερουσίας
  choice: le conseil des anciens accorde
  rationale: γερουσία désigne un organe dirigeant formé d’anciens. La construction française active clarifie que la remise émane de ce conseil tout en conservant l’institution source.
theological_decisions:
- issue: Valeur de ἄφεσις dans un contexte civique
  choice: la remise
  alternative: la libération ; l’exemption ; le pardon ; l’amnistie
  rationale: Le contexte institutionnel favorise une mesure administrative, mais le grec ne précise pas exactement sa nature. « Remise » et la note conservent cette indétermination au lieu d’introduire une notion doctrinale de pardon ou une catégorie juridique trop précise.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase a été légèrement restructurée pour éviter l’ambiguïté française sur l’auteur de l’octroi, sans préciser la nature exacte de la remise.
