    text: Ou « la libération », « l’exemption » ou « le pardon ». Le mot grec peut désigner le fait de libérer, de remettre une obligation ou de pardonner; ici, la mention du conseil des anciens suggère une décision administrative.
    reason: lexical_alternative
  revision_rationale: La révision supprime la causalité et la finalité ajoutées par « car » et « afin que ». Elle rend ὅτι par l’introduction du contenu du message et conserve, par « en accordant », le rapport participial du grec. « Provenant du conseil des anciens » rend explicitement l’origine exprimée par παρά sans convertir indûment l’énoncé en demande adressée au conseil.
