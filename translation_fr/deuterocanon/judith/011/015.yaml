  text: And it will be that[a], when he reports it to them and they act, they will be given over to you for destruction on that day.
translation:
  language: fr
  text: 'Et voici ce qui arrivera[a] : quand il le leur annoncera et qu’ils agiront, ils te seront livrés pour être détruits ce jour-là.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Et dès qu’il le leur aura annoncé et qu’ils l’auront fait ». En grec, ὡς ἂν suivi du subjonctif peut exprimer une condition future indéterminée, et ποιήσωσιν peut se traduire plus littéralement par « ils le feront ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσται
  choice: voici ce qui arrivera
  rationale: Le futur de εἰμί introduit ici une circonstance à venir. Cette tournure française conserve cette fonction tout en évitant le calque peu naturel « il arrivera que ».
- source_word: ὡς ἂν
  choice: quand
  rationale: Avec les subjonctifs aoristes, l’expression indique une éventualité future dont la réalisation déclenche la suite. « Quand » est naturel et laisse subsister cette valeur conditionnelle.
- source_word: ἀναγγείλῃ
  choice: il le leur annoncera
  rationale: Le verbe signifie annoncer ou rapporter. Le pronom « le » reprend naturellement en français l’élément connu par le contexte, tandis que αὐτοῖς est rendu par « leur ».
- source_word: ποιήσωσιν
  choice: ils agiront
  rationale: ποιέω reste sans objet explicite. « Agir » rend leur passage à l’acte sans préciser indûment ce qu’ils feront.
- source_word: δοθήσονταί σοι
  choice: ils te seront livrés
  rationale: Cette formulation conserve le futur passif et le datif σοι, tout en exprimant naturellement la remise au pouvoir de quelqu’un dans un contexte hostile.
- source_word: εἰς ὄλεθρον
  choice: pour être détruits
  rationale: La préposition εἰς marque ici l’issue ou le but, et ὄλεθρος la destruction. La tournure explicite naturellement en français le résultat visé.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: ce jour-là
  rationale: Équivalent temporel idiomatique et précis en français moderne.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du grec, mais « voici ce qui arrivera » remplace un calque lourd. L’ambiguïté de ποιήσωσιν, sans objet explicite, est préservée dans le texte par « agiront » et signalée en note.
