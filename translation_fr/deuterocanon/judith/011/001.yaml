  text: And Holofernes said to her[a], “Take courage, woman; do not be afraid in your heart[c][b], for I have harmed no man who has chosen to serve King Nebuchadnezzar of all the earth.”
translation:
  language: fr
  text: 'Holopherne lui dit : « Prends courage, femme ! N’aie pas peur dans ton cœur, car je n’ai fait de mal à aucun de ceux qui ont choisi de servir le roi Nabuchodonosor, roi de toute la terre[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « roi de tout le pays ». L’expression traduit la prétention impériale du personnage ; le mot grec peut désigner la « terre » ou un « pays » selon le contexte.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: Θάρσησον
  choice: Courage !
  rationale: Cette exhortation brève et idiomatique restitue naturellement en français moderne l’impératif qui invite à reprendre confiance.
- source_word: γύναι
  choice: femme
  rationale: Le vocatif grec est direct et sans titre honorifique. « Femme » en conserve la simplicité, malgré sa tonalité quelque peu solennelle en français.
- source_word: μὴ φοβηθῇς τῇ καρδίᾳ σου
  choice: N’aie pas peur dans ton cœur
  rationale: La formulation garde la localisation intérieure explicitement exprimée par le datif grec, sans réduire la phrase à un simple « n’aie pas peur ».
- source_word: ἐκάκωσα
  choice: je n’ai fait de mal
  rationale: κακόω désigne largement le fait de nuire ou de maltraiter. Cette tournure française reste naturelle sans préciser indûment la nature du tort.
- source_word: ἄνθρωπον
  choice: personne
  rationale: Dans cette proposition négative, « personne » rend idiomatiquement la portée générique de ἄνθρωπον, qui ne vise pas exclusivement un homme de sexe masculin.
- source_word: ὅστις ἡρέτικεν
  choice: qui ait choisi
  rationale: Le verbe exprime ici un choix arrêté. Le subjonctif est naturel en français après « personne » dans une phrase négative.
- source_word: δουλεύειν
  choice: servir
  rationale: Dans ce contexte de soumission politique à un souverain, « servir » convient mieux que le sens plus marqué d’« être esclave ».
- source_word: βασιλεῖ Ναβουχοδονόσορ
  choice: le roi Nabuchodonosor
  rationale: Cette construction correspond à l’usage français courant pour un titre suivi du nom propre.
- source_word: πάσης τῆς γῆς
  choice: roi de toute la terre
  rationale: γῆ peut désigner la terre ou un territoire. Ici, la portée universelle convient à la prétention impériale exprimée par le personnage.
theological_decisions:
- issue: Portée de la titulature impériale de Nabuchodonosor
  choice: roi de toute la terre
  alternative: roi de tout le pays
  rationale: Le contexte favorise une prétention impériale universelle. La traduction préserve cette rhétorique du personnage sans la présenter comme une affirmation théologique validée par le narrateur.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours reste direct et légèrement solennel. L’expression sémitisante « dans ton cœur » est conservée afin de respecter l’image intérieure du grec.
