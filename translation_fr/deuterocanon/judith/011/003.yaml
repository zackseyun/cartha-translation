    text: Ou « pour la délivrance » ou « pour le salut ». Le grec porte εἰς σωτηρίαν, littéralement « en vue du salut/de la délivrance ».
    reason: Alternative lexicale ; la note conserve l’étendue de σωτηρία ainsi que la valeur de but de εἰς, sans ajouter l’idée de « trouver ».
