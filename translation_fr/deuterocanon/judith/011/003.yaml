  text: And now tell me why you fled from them and came to us[a]; for you have come for deliverance.
translation:
  language: fr
  text: Et maintenant, dis-moi pourquoi tu les as fuis et es venue vers nous ; car tu es venue pour être sauvée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour la délivrance » ou « pour le salut ». Le grec porte εἰς σωτηρίαν, littéralement « en vue du salut/de la délivrance ».
    reason: Alternative lexicale ; la note conserve l’étendue de σωτηρία ainsi que la valeur de but de εἰς, sans ajouter l’idée de « trouver ».
lexical_decisions:
- source_word: νῦν
  choice: maintenant
  rationale: L’adverbe marque le passage immédiat à la demande d’explication ; « maintenant » en restitue simplement la valeur temporelle.
- source_word: λέγε μοι
  choice: dis-moi
  rationale: Cette tournure impérative est naturelle en français et conserve le caractère direct de la demande.
- source_word: τίνος ἕνεκεν
  choice: pourquoi
  rationale: L’expression demande la raison des actions de Judith ; « pourquoi » en rend clairement et naturellement la force causale.
- source_word: ἀπέδρας ἀπʼ αὐτῶν
  choice: tu as fui loin d’eux
  rationale: Le verbe exprime la fuite et la préposition la séparation. « Loin d’eux » évite l’ambiguïté que pourrait avoir « tu les as fuis » tout en conservant le mouvement d’éloignement.
- source_word: ἦλθες πρὸς ἡμᾶς
  choice: es venue vers nous
  rationale: Le passé composé convient au récit en français moderne ; l’accord au féminin correspond à Judith, destinataire de la parole.
- source_word: ἥκεις
  choice: tu es venue
  rationale: ἥκω souligne l’arrivée et son résultat présent. Le passé composé français garde cette nuance résultative.
- source_word: εἰς σωτηρίαν
  choice: pour trouver la délivrance
  rationale: Dans ce contexte narratif, σωτηρία désigne vraisemblablement le fait d’échapper au danger. « Délivrance » conserve néanmoins l’étendue sémantique du grec, tandis que « pour trouver » rend naturellement la construction εἰς avec sa visée.
theological_decisions:
- issue: Portée de σωτηρία dans un contexte narratif sans référence théologique explicite
  choice: pour trouver la délivrance
  alternative: pour trouver le salut ; pour être sauvée
  rationale: Le propos d’Holopherne concerne apparemment la préservation de Judith, mais σωτηρία peut aussi être rendu par « salut ». Le texte principal retient une formulation narrative naturelle sans exclure la portée plus large du terme grec ; la note conserve les autres possibilités.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond à l’adresse au singulier. La coordination grecque est conservée sans répéter « pourquoi », et le point-virgule maintient le lien explicatif de γάρ.
