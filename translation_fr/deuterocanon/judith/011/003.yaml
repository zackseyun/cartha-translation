review_pass:
  verdict: revise
  source_fidelity: La phrase rend correctement la demande causale, la fuite d’auprès des siens et l’arrivée auprès des Assyriens. Toutefois, « pour trouver la délivrance » ajoute l’idée de trouver/obtenir, absente de εἰς σωτηρίαν. Une formulation de but sans ce supplément reflète plus exactement le grec tout en gardant son ambiguïté entre secours concret, délivrance et salut.
  naturalness: Le français est fluide et le tutoiement convient à l’adresse d’Holopherne à Judith. « Tu as fui loin d’eux » est intelligible, mais « loin » explicite légèrement davantage que la préposition ἀπό ; « tu les as fuis » est plus naturel et reste fidèle dans ce contexte. « Pour être sauvée » est idiomatique et évite la surcharge de « trouver ».
  terminology: σωτηρία doit conserver une portée non réduite à la seule sécurité physique et ne pas recevoir l’ajout sémantique de « trouver ». « Être sauvée » rend naturellement le but exprimé par εἰς σωτηρίαν ; la note préserve « délivrance » comme alternative narrative pertinente. Aucun enjeu de nom propre ni d’ancrage ne subsiste.
  issues:
  - severity: medium
    issue: Ajout de « trouver » dans « pour trouver la délivrance »
    rationale: εἰς σωτηρίαν exprime la destination ou le but (« pour le salut/la délivrance », « afin d’être sauvée »), non l’acte de trouver. Le verbe français ajoute une nuance d’acquisition qui n’est pas formulée par le grec.
  - severity: low
    issue: « loin d’eux » explicite la distance
    rationale: ἀπʼ αὐτῶν signifie d’eux, loin d’eux/à l’écart d’eux selon le contexte. La formulation actuelle est défendable, mais « tu les as fuis » est plus sobre et idiomatique sans perdre la séparation exprimée par ἀπό.
  revised_text: Et maintenant, dis-moi pourquoi tu les as fuis et es venue vers nous ; car tu es venue pour être sauvée[a].
  revised_footnotes:
