base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/008.yaml
  text: For we have heard of your wisdom and the cunning of your soul[a], and it has been reported throughout all the earth that you alone are good in all the kingdom, mighty in knowledge[c][b], and marvelous in the armies of war.
translation:
  language: fr
  text: Car nous avons entendu parler de ta sagesse et des habiles desseins de ton esprit[a], et l’on a annoncé par toute la terre[b] que toi seul, dans tout le royaume[c], tu es bon, puissant par la connaissance et remarquable dans les opérations militaires.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les habiles desseins de ton âme ». Le grec ψυχή peut désigner l’âme, la vie ou l’être intérieur; ici, il renvoie vraisemblablement au siège de la pensée et des intentions.
    reason: lexical_alternative
  - marker: b
    text: Ou « par tout le pays ». Le grec γῆ peut désigner soit la terre, soit un territoire particulier, selon le contexte.
    reason: lexical_alternative
  - marker: c
    text: Ou « dans chaque royaume ». Le singulier grec désigne plus probablement la totalité de son royaume que tous les royaumes sans exception.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσαμεν
  choice: nous avons entendu parler
  rationale: Le passé composé convient au discours et exprime une réputation parvenue jusqu’aux locuteurs, toujours pertinente au moment où Judith parle.
- source_word: τὴν σοφίαν σου
  choice: ta sagesse
  rationale: « Sagesse » restitue directement le sens ordinaire de σοφία dans cet éloge.
- source_word: τὰ πανουργεύματα τῆς ψυχῆς σου
  choice: les habiles desseins de ton âme
  rationale: πανουργεύματα évoque des procédés ingénieux, avec une possible nuance de ruse; « habiles desseins » conserve cette ambivalence mieux que « ruses », nettement péjoratif. « Ton âme » maintient le terme ψυχή et l’image de la vie intérieure d’où viennent les projets.
- source_word: ἀνηγγέλη
  choice: l’on a proclamé
  rationale: Cette tournure impersonnelle préserve le passif grec tout en restant naturelle; « proclamé » convient au caractère public et élogieux de l’annonce.
- source_word: πάσῃ τῇ γῇ
  choice: par toute la terre
  rationale: γῆ peut désigner la terre entière ou un territoire; le contexte d’une réputation largement répandue permet « toute la terre », sans supprimer l’autre possibilité.
- source_word: σὺ μόνος
  choice: toi seul
  rationale: La dislocation avec le pronom tonique rend naturellement l’insistance exclusive du grec.
- source_word: ἀγαθὸς
  choice: bon
  rationale: « Bon » garde le sens large du grec sans préciser indûment s’il s’agit de valeur morale, de compétence ou d’excellence.
- source_word: ἐν πάσῃ βασιλείᾳ
  choice: dans tout le royaume
  rationale: Le nom singulier βασιλείᾳ désigne vraisemblablement l’ensemble du royaume concerné, plutôt que chacun de tous les royaumes.
- source_word: δυνατὸς ἐν ἐπιστήμῃ
  choice: puissant par la connaissance
  rationale: Cette formulation conserve l’association inhabituelle entre puissance et connaissance, tout en étant plus intelligible en français que le calque « puissant en connaissance ».
- source_word: θαυμαστὸς ἐν στρατεύμασιν πολέμου
  choice: remarquable à la tête des armées de guerre
  rationale: θαυμαστός exprime ici ce qui suscite l’admiration. L’ajout idiomatique « à la tête de » explicite la relation de commandement suggérée par l’éloge adressé à Holopherne, tandis que « armées de guerre » préserve le tour militaire redondant du grec.
