  text: 'Les paroles de Judith plurent à Holopherne et à tous ceux qui le servaient. Ils admirèrent sa sagesse et dirent :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρεσαν
  choice: plurent à
  rationale: Le passé simple rend naturellement l’aoriste narratif et exprime l’accueil favorable réservé aux paroles de Judith.
- source_word: οἱ λόγοι αὐτῆς
  choice: Les paroles de Judith
  rationale: « Paroles » reste proche du grec λόγοι. La reprise du nom « Judith » est naturelle en français dans un verset isolé et lève sans excès l’ambiguïté du pronom féminin donnée par le contexte.
- source_word: ἐναντίον Ὀλοφέρνου καὶ ἐναντίον πάντων τῶν θεραπόντων αὐτοῦ
  choice: à Holopherne et à tous ceux qui le servaient
  rationale: Avec ἀρέσκω, ἐναντίον désigne ici les personnes auprès desquelles les paroles trouvent faveur. La tournure française avec « à » restitue ce rapport sans traduire mécaniquement « devant ».
- source_word: θεραπόντων
  choice: ceux qui le servaient
  rationale: Cette formulation actuelle conserve l’idée générale de personnes attachées au service d’Holopherne sans imposer le statut plus précis de « domestiques » ou de « serviteurs ».
- source_word: ἐθαύμασαν
  choice: admirèrent
  rationale: Dans ce contexte favorable, le verbe exprime un étonnement admiratif. « Admirèrent » est naturel, digne et évite le caractère vieilli de « s’émerveillèrent ».
- source_word: ἐπὶ τῇ σοφίᾳ αὐτῆς
  choice: sa sagesse
  rationale: Complément direct après « admirèrent », cette formulation française exprime naturellement ce qui provoque leur étonnement admiratif.
- source_word: καὶ εἶπαν
  choice: 'et dirent :'
  rationale: Le deux-points signale que le discours direct se poursuit au verset suivant, conformément à la syntaxe grecque.
