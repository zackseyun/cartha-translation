base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/012.yaml
  text: For when their food had run out and all water had become scarce[a], they decided to use their livestock, and they determined to consume everything that God had commanded them by his laws not to eat.
translation:
  language: fr
  text: En effet, comme leurs vivres étaient épuisés et que l’eau se faisait rare partout, ils décidèrent de se rabattre sur leur bétail[a] et résolurent de consommer tout ce que Dieu leur avait interdit de manger par ses lois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « se jeter sur leur bétail » ; l’expression implique qu’ils voulaient recourir à leurs animaux pour se nourrir.'
    reason: L’idiome grec est plus énergique et légèrement moins explicite que sa signification contextuelle.
lexical_decisions:
- source_word: ἐξέλειπεν αὐτοὺς τὰ βρώματα
  choice: leurs vivres étaient épuisés
  rationale: La tournure grecque exprime l’épuisement des ressources alimentaires. « Vivres » convient à des provisions en temps de siège, et l’imparfait décrit l’état auquel ils étaient réduits.
- source_word: ἐσπανίσθη πᾶν ὕδωρ
  choice: toute réserve d’eau était devenue rare
  rationale: Le verbe indique la raréfaction, non nécessairement la disparition totale. « Toute réserve d’eau » rend naturellement la portée générale de πᾶν ὕδωρ en français.
- source_word: ἐβουλεύσαντο
  choice: ils décidèrent
  rationale: Le verbe désigne une délibération qui aboutit à une décision.
- source_word: ἐπιβαλεῖν τοῖς κτήνεσιν αὐτῶν
  choice: s’en prendre à leur bétail
  rationale: Cette expression conserve la force de l’idiome grec, littéralement « se jeter sur », tout en laissant au contexte l’idée qu’ils comptaient utiliser leurs animaux comme nourriture.
- source_word: κτήνεσιν
  choice: bétail
  rationale: Le mot désigne ici les animaux domestiques possédés par la communauté.
- source_word: διεστείλατο αὐτοῖς ὁ θεὸς τοῖς νόμοις αὐτοῦ μὴ φαγεῖν
  choice: Dieu leur avait interdit de manger dans ses lois
  rationale: Dans ce cadre juridique, διεστείλατο exprime une prescription contraignante. La formulation française négative rend directement l’interdiction sans préciser une disposition particulière de la Torah.
- source_word: διέγνωσαν δαπανῆσαι
  choice: résolurent de consommer
  rationale: διέγνωσαν marque une résolution arrêtée, tandis que δαπανῆσαι signifie ici employer jusqu’à épuisement, donc consommer, en rapport avec des aliments interdits.
theological_decisions:
- issue: Référence aux interdits alimentaires divins
  choice: tout ce que Dieu leur avait interdit de manger dans ses lois
  alternative: tout ce que Dieu leur avait ordonné, par ses lois, de ne pas manger
  rationale: La formulation retenue exprime clairement l’interdiction divine et son inscription dans les lois de Dieu, sans identifier une prescription particulière ni ajouter une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire « vivres », « bétail » et « résolurent » convient au récit de siège sans être archaïque. La note préserve l’image du grec et explicite sobrement son implication contextuelle.
