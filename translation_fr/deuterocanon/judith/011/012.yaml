    rationale: Le grec dit littéralement que toute eau se faisait rare ; il ne mentionne pas des réserves d’eau. Une formulation sans cet ajout est préférable.
  - severity: low
    issue: Rendu de l’idiome concernant le bétail
    rationale: « S’en prendre à » peut suggérer surtout une agression hostile. « Se rabattre sur » garde l’idée contextuelle de recours désespéré et reste moins spécifiant quant à l’action exacte.
