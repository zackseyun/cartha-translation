  verdict: revise
  source_fidelity: 'Le sens général est fidèle : pénurie de vivres et d’eau, décision concernant le bétail, puis résolution de consommer les aliments interdits par les lois divines. Toutefois, « toute réserve d’eau était devenue rare » introduit l’idée de réserves, absente du grec πᾶν ὕδωρ, et l’ancre de note est placée après « eau » alors que la note porte sur l’expression relative au bétail.'
  naturalness: Le français est globalement naturel et d’un registre approprié. « L’eau se faisait rare partout » est plus idiomatique et rend mieux la portée de πᾶν ὕδωρ. « Se rabattre sur leur bétail » exprime naturellement le recours aux animaux dans la détresse sans expliciter indûment le mode précis de leur emploi.
  terminology: « Vivres », « bétail », « résolurent » et « consommer » conviennent. « Par ses lois » rend plus directement le moyen ou le cadre normatif de τοῖς νόμοις αὐτοῦ que « dans ses lois », sans modification théologique.
