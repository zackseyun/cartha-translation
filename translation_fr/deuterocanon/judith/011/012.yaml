  to: En effet, comme leurs vivres étaient épuisés et que l’eau se faisait rare partout, ils décidèrent de se rabattre sur leur bétail[a] et résolurent de consommer tout ce que Dieu leur avait interdit de manger par ses lois.
  rationale: La révision retire l’ajout de « réserve », rend πᾶν ὕδωρ par une expression française naturelle à portée générale, améliore le rendu de l’idiome grec relatif au bétail et replace l’ancre de note sur le segment qu’elle explique. Le sens des interdits alimentaires divins et la résolution de les consommer sont conservés.
