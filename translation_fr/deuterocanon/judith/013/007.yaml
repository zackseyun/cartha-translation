  text: And she went up to the bed, seized the hair of his head, and said, “Strengthen me, O God of Israel, on this day.”
translation:
  language: fr
  text: 'Elle s’approcha du lit, lui saisit les cheveux et dit : « Rends-moi forte, Dieu d’Israël, en ce jour. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγγίσασα
  choice: s’approcha
  rationale: Le participe exprime le fait de s’approcher ou de venir près du lit. « S’approcha » est naturel en français et conserve le mouvement vers celui-ci.
- source_word: τῆς κλίνης
  choice: du lit
  rationale: κλίνη peut désigner un lit ou une couche ; dans cette scène, « lit » est le terme moderne le plus clair.
- source_word: ἐδράξατο
  choice: saisit
  rationale: Le verbe exprime une prise ferme. « Saisit » rend la vigueur de l’action sans amplification.
- source_word: τῆς κόμης τῆς κεφαλῆς αὐτοῦ
  choice: les cheveux de sa tête
  rationale: Cette formulation conserve la précision et la légère redondance de la construction grecque, tout en restant compréhensible en français.
- source_word: Κραταίωσόν με
  choice: Rends-moi forte
  rationale: L’impératif demande à Dieu de la rendre forte. « Rends-moi forte » traduit directement la valeur causative et accorde naturellement l’adjectif avec Judith.
- source_word: ὁ θεὸς Ἰσραήλ
  choice: Dieu d’Israël
  rationale: Le nominatif grec a ici valeur d’apostrophe. En français moderne, l’adresse directe est solennelle sans nécessiter l’interjection archaïsante « ô ».
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: en ce jour
  rationale: Cette expression garde la spécificité temporelle et le ton solennel de la prière, sans réduire la formule au simple adverbe « aujourd’hui ».
theological_decisions:
- issue: Invocation de Judith à Dieu au moment d’une délivrance violente
  choice: 'Conserver la prière brève et directe : « Rends-moi forte, Dieu d’Israël, en ce jour. »'
  alternative: « Donne-moi de la force, Dieu d’Israël, aujourd’hui. »
  rationale: Le texte rapporte la demande sans commenter ni justifier l’acte qui suit. La traduction maintient donc l’urgence, l’adresse au Dieu d’Israël et la tension narrative et théologique, sans développement explicatif.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe reste proche du grec tout en étant naturelle ; aucune note n’est nécessaire, car les choix lexicaux n’impliquent pas de variante ou d’ambiguïté substantielle à signaler.
