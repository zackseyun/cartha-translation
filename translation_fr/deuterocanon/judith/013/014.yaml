  text: And she said to them with a loud voice, “Praise God, praise him; praise God, who has not withdrawn his mercy from the house of Israel, but has shattered our enemies by my hand in this night.”
translation:
  language: fr
  text: 'Elle leur dit d’une voix forte : « Louez Dieu, louez-le ! Louez Dieu, lui qui n’a pas détourné sa miséricorde de la maison d’Israël, mais qui, par ma main, a brisé nos ennemis cette nuit. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αἰνεῖτε
  choice: Louez
  rationale: Rend directement l’impératif grec et préserve sa triple répétition rhétorique.
- source_word: ἔλεος
  choice: bonté
  rationale: Dans ce contexte d’alliance et de délivrance, « bonté » exprime naturellement la faveur bienveillante de Dieu sans réduire le terme au seul sentiment de compassion.
- source_word: οἴκου Ἰσραήλ
  choice: maison d’Israël
  rationale: Conserve l’image collective et traditionnelle du grec dans un français intelligible.
- source_word: ἔθραυσε
  choice: a brisé
  rationale: Préserve la force concrète du verbe grec, plutôt que de l’atténuer en « vaincu ».
- source_word: διὰ χειρός μου
  choice: par ma main
  rationale: Maintient l’expression instrumentale biblique et l’affirmation explicite du rôle de Judith.
- source_word: ἐν τῇ νυκτὶ ταύτῃ
  choice: cette nuit
  rationale: Expression française naturelle qui rend la référence temporelle démonstrative du grec.
theological_decisions:
- issue: Rapport entre l’action divine et l’action de Judith
  choice: « qui, par ma main, a brisé nos ennemis »
  alternative: « dont j’ai brisé les ennemis de ma main »
  rationale: La syntaxe grecque attribue à Dieu l’action principale tout en présentant la main de Judith comme son moyen; la traduction conserve cette articulation sans l’expliquer davantage.
- issue: Portée de ἔλεος envers Israël
  choice: « n’a pas retiré sa bonté à la maison d’Israël »
  alternative: « n’a pas détourné sa miséricorde de la maison d’Israël »
  rationale: Le choix garde l’idée de fidélité bienveillante manifestée par la délivrance, sans introduire une formulation confessionnelle particulière.
translation_notes:
  register: Français moderne, digne et oralement énergique. La répétition de « Louez Dieu » est conservée, de même que les images bibliques « maison d’Israël » et « par ma main ».
