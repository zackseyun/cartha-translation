base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/011.yaml
  text: And Judith said from a distance to those guarding the gates[a], “Open up, open up the gate, for God, our God, is with us, still to show strength in Israel and power against our enemies, just as he has done today.”
translation:
  language: fr
  text: 'Judith dit de loin à ceux qui montaient la garde aux portes : « Ouvrez, ouvrez donc la porte ! Dieu, notre Dieu[a], est avec nous pour manifester encore sa force en Israël et sa puissance contre nos ennemis, comme il l’a fait aujourd’hui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « Dieu, Dieu de nous » ; la répétition est emphatique.'
    reason: La note signale directement la répétition de θεός dans le grec, rendue idiomatiquement par « Dieu, notre Dieu » dans le texte.
lexical_decisions:
- source_word: μακρόθεν
  choice: de loin
  rationale: Cette expression rend directement la distance spatiale et convient naturellement au fait que Judith s’adresse aux gardes.
- source_word: τοῖς φυλάσσουσιν ἐπὶ τῶν πυλῶν
  choice: à ceux qui montaient la garde aux portes
  rationale: La tournure décrit la fonction des personnes présentes aux portes sans leur attribuer un titre absent du grec; l’imparfait situe leur activité en cours.
- source_word: εἶπεν
  choice: cria
  rationale: Bien que le verbe signifie normalement « dit », la précision « de loin » et les impératifs répétés impliquent ici qu’elle élève la voix; « cria » produit une narration française naturelle sans modifier le contenu de ses paroles.
- source_word: Ἀνοίξατε, ἀνοίξατε δὴ τὴν πύλην
  choice: Ouvrez, ouvrez donc la porte !
  rationale: La répétition conserve l’urgence de l’appel, tandis que « donc » rend l’insistance de δὴ. Le singulier « la porte » suit le complément grec.
- source_word: μεθʼ ἡμῶν ὁ θεὸς
  choice: Dieu … est avec nous
  rationale: Le grec forme une proposition sans verbe exprimé; le français exige ici l’ajout de « est ».
- source_word: ὁ θεὸς ὁ θεὸς ἡμῶν
  choice: Dieu, notre Dieu
  rationale: La reprise de « Dieu » garde l’accent confessionnel de l’expression grecque tout en restant idiomatique en français.
- source_word: ποιῆσαι ἔτι ἰσχὺν
  choice: pour déployer encore sa force
  rationale: L’infinitif exprime le but ou l’action attendue. « Déployer sa force » rend idiomatiquement l’association grecque de ποιεῖν et ἰσχύς, et « encore » préserve l’idée de continuation portée par ἔτι.
- source_word: κράτος
  choice: puissance
  rationale: Dans ce contexte de délivrance militaire, le terme désigne une puissance effective qui l’emporte sur l’ennemi; « puissance » le distingue légèrement de ἰσχύς, rendu par « force ».
- source_word: κατὰ τῶν ἐχθρῶν ἡμῶν
  choice: contre nos ennemis
  rationale: κατά suivi du génitif a ici une valeur adversative clairement rendue par « contre ».
- source_word: καθὰ καὶ σήμερον ἐποίησεν
  choice: comme il l’a fait aujourd’hui
  rationale: Le passé composé relie naturellement en français l’action accomplie ce jour-là à la situation présente du discours.
theological_decisions:
- issue: Expression divine emphatique ὁ θεὸς ὁ θεὸς ἡμῶν
  choice: Dieu, notre Dieu
  alternative: notre Dieu
  rationale: Conserver les deux occurrences rend l’emphase du grec sans transformer la seconde en titre distinct ni ajouter une nuance doctrinale.
- issue: Rapport entre la présence de Dieu et l’infinitif ποιῆσαι
  choice: est avec nous pour déployer encore
  alternative: est avec nous, lui qui déploie encore
  rationale: La traduction maintient l’infinitif de but ou d’action attendue au lieu de le transformer en proposition descriptive qui en fixerait davantage le sens.
translation_notes:
  register: Français international actuel, digne et narratif. Les paroles directes gardent l’urgence de la répétition grecque. « Montaient la garde » et « déployer sa force » évitent à la fois l’archaïsme et une littéralité peu naturelle.
