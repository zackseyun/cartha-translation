    rationale: Le grec emploie simplement « dit ». Le contexte peut impliquer qu’elle parle assez fort pour être entendue, mais cette implication ne doit pas remplacer le verbe source.
  - severity: low
    issue: La note qualifie « Dieu, notre Dieu » de forme grecque par « Dieu, le Dieu de nous » et en tire une paraphrase interprétative.
    rationale: L’expression reproduit θεός deux fois (« Dieu, Dieu de nous »). Une note plus neutre signalera la répétition emphatique sans expliquer l’intention au-delà de ce que la forme établit.
