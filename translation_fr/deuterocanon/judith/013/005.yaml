  text: And they all went away from his presence[a], and no one was left in the bedroom, from the least to the greatest.
translation:
  language: fr
  text: Ils s’en allèrent tous de devant lui[a], et personne ne resta dans la chambre, du plus petit au plus grand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de devant lui »; c’est-à-dire en quittant sa présence.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθοσαν
  choice: s’éloignèrent
  rationale: L’aoriste de ἀπέρχομαι exprime ici le départ hors de la présence de quelqu’un. « S’éloignèrent » rend naturellement le mouvement de retrait sans préciser qu’ils sortirent nécessairement d’un lieu donné.
- source_word: ἐκ προσώπου
  choice: de sa présence
  rationale: L’expression signifie littéralement « de devant [lui] » et, dans ce contexte, désigne le fait de quitter sa présence. La tournure française choisie est naturelle tout en conservant ce sens.
- source_word: οὐδεὶς κατελείφθη
  choice: personne ne resta
  rationale: Le passif de καταλείπω indique que nul ne fut laissé sur place. « Personne ne resta » exprime clairement le résultat en français idiomatique.
- source_word: ἐν τῷ κοιτῶνι
  choice: dans la chambre
  rationale: κοιτών désigne une pièce où l’on couche, souvent une chambre privée. Dans le contexte immédiat, « la chambre » est courant, digne et suffisamment précis.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: du plus petit au plus grand
  rationale: Ce mérisme englobe tout le monde sans exception, vraisemblablement selon le rang ou l’importance. La formulation française conserve l’image et évite de la réduire à une distinction d’âge.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. Le texte garde le mérisme « du plus petit au plus grand » et évite les termes vieillis comme « chambre à coucher » au sens solennel ou « chambre nuptiale », que le grec n’impose pas ici.
