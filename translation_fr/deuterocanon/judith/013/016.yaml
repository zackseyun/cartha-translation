  yaml_path: translation/deuterocanon/judith/013/016.yaml
  text: And as the Lord lives, who guarded me on the way by which I went, my face deceived him to his destruction, and he did not commit sin with me, resulting in defilement and shame.
translation:
  language: fr
  text: Aussi vrai que le Seigneur est vivant, lui qui m’a gardée sur le chemin que j’ai suivi, mon visage[a] l’a trompé pour sa perte, et il n’a commis aucun péché avec moi qui aurait entraîné souillure et honte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mon visage ». L’expression désigne l’apparence de Judith, qui a induit Holopherne en erreur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζῇ Κύριος
  choice: Aussi vrai que le Seigneur est vivant
  rationale: Cette formule française naturelle conserve la force solennelle de la formule de serment grecque et rend κύριος par « Seigneur ».
- source_word: διεφύλαξέν με
  choice: m’a gardée
  rationale: Le verbe exprime la protection et la préservation. L’accord au féminin renvoie à Judith.
- source_word: ἐν τῇ ὁδῷ μου ᾗ ἐπορεύθην
  choice: sur le chemin que j’ai suivi
  rationale: Cette formulation conserve l’image concrète du chemin et la proposition relative, tout en restant idiomatique en français moderne.
- source_word: ἠπάτησεν αὐτὸν τὸ πρόσωπόν μου
  choice: mon visage l’a trompé
  rationale: Le grec fait littéralement de « mon visage » le sujet. Le maintien de cette image vive évite de remplacer silencieusement le terme par une interprétation comme « beauté » ou « apparence ».
- source_word: εἰς ἀπώλειαν αὐτοῦ
  choice: pour sa perte
  rationale: « Perte » exprime ici la ruine ou la destruction d’Holopherne, tandis que « pour » restitue naturellement la valeur résultative de εἰς.
- source_word: οὐκ ἐποίησεν ἁμάρτημα μετʼ ἐμοῦ
  choice: il n’a commis aucun péché avec moi
  rationale: La traduction garde le substantif explicite « péché » et la retenue du grec, sans expliciter davantage la dimension sexuelle suggérée par le contexte.
- source_word: εἰς μίασμα καὶ αἰσχύνην
  choice: qui m’aurait souillée et couverte de honte
  rationale: La formulation exprime naturellement en français le résultat évité. Elle rend μίασμα par l’idée de souillure et αἰσχύνη par la honte, en les rapportant à Judith comme l’exige le contexte immédiat.
theological_decisions:
- issue: Traduction de κύριος dans la formule de serment
  choice: Seigneur
  alternative: Maître
  rationale: Dans ce serment, κύριος est le titre divin. « Seigneur » est la désignation française consacrée et appropriée, sans ajout confessionnel.
- issue: Degré d’explicitation du péché évoqué
  choice: Conserver la formulation générale « commis aucun péché avec moi »
  alternative: Expliciter une agression ou des relations sexuelles
  rationale: Le contexte indique une atteinte sexuelle évitée, mais le grec emploie une expression plus générale. La traduction préserve cette retenue et laisse la suite préciser les conséquences de souillure et de honte.
- issue: Référent de la souillure et de la honte
  choice: Les rapporter à Judith par une proposition de conséquence irréelle
  alternative: 'Laisser les deux noms sans référent explicite : « pour la souillure et la honte »'
  rationale: Le grec ne comporte pas de pronom explicite, mais le contexte présente la souillure et la honte comme le sort que Judith aurait subi. Le conditionnel passé indique clairement qu’elles ont été évitées, sans prétendre que le péché a eu lieu.
translation_notes:
  register: Français international moderne, digne et narratif. La formule de serment est idiomatique; le reste demeure proche de la structure et des images grecques sans archaïsme ni explicitation sexuelle excessive.
