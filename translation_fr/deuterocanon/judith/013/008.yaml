review_pass:
  verdict: revise
  source_fidelity: 'Le texte grec décrit une approche du montant du lit situé près de la tête d’Holopherne, puis le retrait de l’ἀκινάκης depuis ce montant. « Décrocha » introduit de façon un peu trop précise l’idée d’un objet suspendu à un crochet, qui n’est pas explicitement indiquée. Le possessif français « son » est en outre ambigu : il peut grammaticalement renvoyer à Judith plutôt qu’à Holopherne.'
  naturalness: La phrase est globalement fluide et de registre narratif moderne. « Près de la tête d’Holopherne » rend plus nettement la relation spatiale que « à la tête d’Holopherne », qui peut évoquer en français la tête du lit. « En retira l’épée courte d’Holopherne » est clair et naturel.
  terminology: « Montant du lit » est une solution recevable pour κανών dans ce contexte. « Épée courte » rend adéquatement ἀκινάκης; la note conserve utilement la possibilité « poignard » et le caractère oriental du type d’arme.
  issues:
  - severity: medium
    issue: « en décrocha » spécifie indûment le mode de fixation de l’arme.
    rationale: καθεῖλε signifie qu’elle l’a retirée ou prise de là, avec éventuellement l’idée de la faire descendre, mais ne requiert pas qu’elle ait été accrochée.
  - severity: medium
    issue: Le possessif « son épée courte » est ambigu.
    rationale: Le génitif αὐτοῦ renvoie dans le contexte à Holopherne. En français, après « elle », « son » peut se comprendre comme renvoyant à Judith; il convient d’expliciter le possesseur.
  revised_text: Puis, s’étant approchée du montant du lit qui se trouvait près de la tête d’Holopherne, elle en retira l’épée courte d’Holopherne[a].
