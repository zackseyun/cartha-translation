  text: And approaching the bedpost that was at Holofernes’s head[a], she took down his sword from it,
translation:
  language: fr
  text: Puis, s’étant approchée du montant du lit qui se trouvait près de la tête d’Holopherne, elle en retira l’épée courte d’Holopherne[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec ἀκινάκης désigne une épée courte ou un poignard de type oriental.
