lexical_decisions:
- source_word: προσελθοῦσα
  choice: Puis elle s’approcha
  rationale: Le participe aoriste marque une action précédant le verbe principal. Une proposition coordonnée rend naturellement en français la progression du récit sans la surinterpréter.
- source_word: κανόνι τῆς κλίνης
  choice: du montant du lit
  rationale: Dans ce contexte, κανών désigne vraisemblablement une pièce rigide de la structure du lit. « Montant du lit » convient à sa position près de la tête et au fait que l’arme y était suspendue.
- source_word: πρὸς κεφαλῆς Ὀλοφέρνου
  choice: à la tête d’Holopherne
  rationale: Cette formulation conserve la relation spatiale du grec tout en restant claire et naturelle en français.
- source_word: καθεῖλε ... ἀπʼ αὐτοῦ
  choice: en décrocha
  rationale: Le verbe suggère qu’elle retire ou fait descendre l’arme de l’endroit où elle se trouvait. « Décrocha » exprime précisément l’action probable, tandis que « en » reprend le montant.
- source_word: ἀκινάκην
  choice: épée courte
  rationale: ἀκινάκης désigne plus précisément une arme courte de type oriental, entre l’épée courte et le poignard. « Épée courte » conserve davantage cette précision que le terme général « épée ».
