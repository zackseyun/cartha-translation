revisions:
- from: Puis elle s’approcha du montant du lit qui se trouvait à la tête d’Holopherne et en décrocha son épée courte[a].
  to: Puis, s’étant approchée du montant du lit qui se trouvait près de la tête d’Holopherne, elle en retira l’épée courte d’Holopherne[a].
  rationale: La révision remplace un verbe qui suppose un accrochage par « retira », explicite que l’arme est celle d’Holopherne et rend plus clairement la proximité spatiale exprimée par πρὸς κεφαλῆς. Elle maintient le choix lexical « épée courte » et son explication en note.
