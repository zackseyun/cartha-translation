  text: And Judith stood beside his bed and said in her heart[a], “Lord, God of all power, look upon the works of my hands at this hour[b], for the exaltation of Jerusalem.”
translation:
  language: fr
  text: 'Judith se tint près de son lit et dit dans son cœur[a] : « Seigneur, Dieu de toute puissance, à cette heure, porte ton regard sur les œuvres de mes mains, pour l’élévation de Jérusalem[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se dit en elle-même ». Le grec dit littéralement « dit dans son cœur », expression biblique désignant une parole ou une prière intérieure.
    reason: lexical_alternative
  - marker: b
    text: Ou « afin que Jérusalem soit élevée ». Le grec dit littéralement « pour l’élévation de Jérusalem » et évoque le fait que Jérusalem soit élevée ou relevée, sans préciser davantage le résultat visé.
    reason: alternative_reading
lexical_decisions:
- source_word: στᾶσα
  choice: se tint
  rationale: Le participe aoriste marque l’action de Judith prenant place près du lit avant de parler. « Se tint » rend naturellement la posture sans alourdir la phrase.
- source_word: παρὰ τὴν κλίνην αὐτοῦ
  choice: près de son lit
  rationale: παρά avec l’accusatif indique ici une position le long de ou auprès de quelque chose ; « lit » convient clairement au contexte.
- source_word: εἶπεν ἐν τῇ καρδίᾳ ἑαυτῆς
  choice: dit dans son cœur
  rationale: La formulation conserve l’image biblique du cœur et indique une parole ou une prière intérieure.
- source_word: Κύριε ὁ θεὸς πάσης δυνάμεως
  choice: Seigneur, Dieu de toute puissance
  rationale: L’apostrophe s’adresse à Dieu. « Toute puissance » exprime la portée globale de πάσης δυνάμεως dans un français digne et naturel.
- source_word: ἐπίβλεψον
  choice: porte ton regard sur
  rationale: L’impératif demande à Dieu d’accorder son attention à l’action de Judith ; cette tournure préserve la force directionnelle du verbe et le ton de la prière.
- source_word: ἐν τῇ ὥρᾳ ταύτῃ
  choice: en cette heure
  rationale: La tournure garde la solennité de l’expression temporelle grecque tout en restant intelligible en français moderne.
- source_word: ἐπὶ τὰ ἔργα τῶν χειρῶν μου
  choice: sur l’œuvre de mes mains
  rationale: La formulation maintient l’idiome biblique désignant ce que Judith s’apprête à accomplir. Le singulier collectif « œuvre » est plus idiomatique ici en français, malgré le pluriel grec ἔργα.
- source_word: εἰς ὕψωμα Ἰερουσαλήμ
  choice: afin que Jérusalem soit élevée
  rationale: Cette formulation restitue l’idée de mise en hauteur ou d’élévation portée par ὕψωμα, sans la réduire explicitement à la délivrance ou à la gloire.
theological_decisions:
- issue: Formule introduisant la prière intérieure de Judith
  choice: dit dans son cœur
  alternative: se dit en elle-même
  rationale: Le texte présente une parole intérieure adressée à Dieu. Garder le langage du cœur préserve l’image biblique sans transformer la prière en simple réflexion personnelle.
- issue: Sens de εἰς ὕψωμα Ἰερουσαλήμ
  choice: afin que Jérusalem soit élevée
  alternative: pour l’élévation de Jérusalem
  rationale: Le grec évoque l’élévation de Jérusalem sans nommer directement sa délivrance, sa gloire ou son honneur. La traduction conserve cette métaphore et son ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. Le tour biblique « dans son cœur » et l’image de l’élévation de Jérusalem sont conservés, tandis que la syntaxe est légèrement réorganisée pour une prière naturelle en français.
