  text: And blessed is the Lord God[a], who created the heavens and the earth, who directed you to strike the head of the ruler of our enemies.
translation:
  language: fr
  text: Et béni soit le Seigneur Dieu, qui a créé les cieux et la terre, qui t’a guidée pour infliger une blessure à la tête au chef de nos ennemis[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « qui t’a guidée vers, ou pour, une blessure à la tête du chef de nos ennemis ». La construction grecque est concise et peut exprimer la direction ou le but.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογημένος
  choice: béni soit
  rationale: Dans cette formule de bénédiction, cette tournure française naturelle conserve la force liturgique et doxologique de l’adjectif grec.
- source_word: Κύριος ὁ θεὸς
  choice: le Seigneur Dieu
  rationale: Rend les deux titres grecs sans transformer leur relation en explication.
- source_word: ἔκτισεν
  choice: a créé
  rationale: Le verbe désigne ici l’acte divin de création des cieux et de la terre.
- source_word: τοὺς οὐρανοὺς καὶ τὴν γῆν
  choice: les cieux et la terre
  rationale: Conserve le pluriel grec de « cieux » tout en restant idiomatique en français.
- source_word: κατεύθυνέν σε
  choice: t’a guidée
  rationale: Le verbe exprime l’orientation donnée par Dieu; l’accord au féminin explicite seulement le genre de Judith, destinataire du propos.
- source_word: εἰς τραῦμα κεφαλῆς
  choice: pour blesser à la tête
  rationale: Formulation française naturelle qui conserve la valeur de but de εἰς et le sens concret de τραῦμα, sans préciser davantage le mode de l’action.
- source_word: ἄρχοντος
  choice: le chef
  rationale: Dans le contexte militaire, « chef » rend clairement celui qui commande, sans imposer le sens institutionnel plus marqué de « souverain ».
- source_word: ἐχθρῶν ἡμῶν
  choice: de nos ennemis
  rationale: Rendu direct et idiomatique du génitif grec.
theological_decisions:
- issue: Action de Dieu dans l’acte accompli par Judith
  choice: lui qui t’a guidée pour blesser à la tête
  alternative: lui qui t’a conduite jusqu’à la blessure à la tête
  rationale: La traduction attribue explicitement à Dieu l’orientation de Judith, comme le fait le grec, mais évite de renforcer le verbe jusqu’à lui faire exprimer une causalité plus absolue.
- issue: Rapport entre τραῦμα et κεφαλῆς
  choice: blesser à la tête
  alternative: causer une blessure à la tête
  rationale: Le grec emploie littéralement un nom, « blessure », dans une construction elliptique. La verbalisation est plus naturelle en français, tandis que la note préserve la forme et l’ambiguïté de la source.
translation_notes:
  register: Français moderne, digne et accessible. La répétition relative est allégée par « lui qui », sans effacer l’enchaînement doxologique. La formulation conserve l’agence divine et signale en note l’expression grecque inhabituelle.
