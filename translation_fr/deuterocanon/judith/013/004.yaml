- from: Judith dit à sa servante[a] de se tenir à l’extérieur de sa chambre et de guetter sa sortie, comme les autres jours[b], car elle avait dit qu’elle sortirait pour faire sa prière. Elle parla aussi à Bagoas dans les mêmes termes.
  to: Judith dit à sa servante[a] de se tenir à l’extérieur de sa chambre et de guetter sa sortie, comme chaque jour[b], car elle déclara qu’elle sortirait pour faire sa prière. Elle parla aussi à Bagoas conformément à ces paroles.
