  text: And Judith told her female servant to stand outside her sleeping chamber and watch for her going out[a], as on previous days, for she said that she would go out for her prayer[b]; and she spoke to Bagoas according to these words.
translation:
  language: fr
  text: Judith dit à sa servante[a] de se tenir à l’extérieur de sa chambre et de guetter sa sortie, comme chaque jour[b], car elle déclara qu’elle sortirait pour faire sa prière. Elle parla aussi à Bagoas conformément à ces paroles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec désigne une esclave femme; « servante » est retenu dans le texte pour le registre narratif français.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « comme jour après jour »; l’expression indique sa pratique quotidienne.
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλῃ
  choice: servante
  rationale: Le nom désigne ici une femme attachée au service de Judith et peut impliquer le statut d’esclave. « Servante » convient au récit en français courant, tandis qu’une note signale explicitement la portée sociale possible du grec.
- source_word: στῆναι
  choice: se tenir
  rationale: L’infinitif exprime le fait de prendre ou de garder une position. « Se tenir » est plus naturel que « rester debout » sans exclure l’idée d’être postée à cet endroit.
- source_word: κοιτῶνος
  choice: chambre
  rationale: κοίτων désigne une chambre à coucher. Dans ce contexte, le français courant « chambre » suffit et évite le tour vieilli « chambre à coucher » lorsqu’il s’agit d’une pièce précise du camp.
- source_word: ἐπιτηρεῖν
  choice: guetter
  rationale: Le verbe suppose une attention soutenue. « Guetter » rend mieux cette vigilance intentionnelle que le simple « regarder ».
- source_word: τὴν ἔξοδον αὐτῆς
  choice: sa sortie
  rationale: La formule désigne le moment où Judith sortirait. « Sa sortie » est concise et conserve en français la référence pronominale du grec.
- source_word: καθάπερ καθʼ ἡμέρας
  choice: comme les autres jours
  rationale: L’expression grecque évoque la pratique quotidienne déjà établie. « Comme les autres jours » est idiomatique en français et convient à la situation narrative.
- source_word: ἐξελεύσεσθαι
  choice: qu’elle sortirait
  rationale: Le futur infinitif dépend du verbe de parole. Le conditionnel français convient au discours indirect au passé.
- source_word: ἐπὶ τὴν προσευχὴν αὐτῆς
  choice: pour faire sa prière
  rationale: Le groupe prépositionnel indique le but de la sortie. « Pour faire sa prière » conserve le nom et le possessif tout en étant naturel en français.
- source_word: κατὰ τὰ ῥήματα ταῦτα
  choice: dans les mêmes termes
  rationale: Cette locution signifie que Judith tint à Bagoas un discours conforme à ce qu’elle venait d’indiquer. « Dans les mêmes termes » en restitue le sens sans calque pesant.
