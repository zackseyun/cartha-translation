  text: And she struck his neck twice with all her strength[a], and removed his head, and rolled his body off the bed[b], and took the canopy down from the posts.
translation:
  language: fr
  text: Elle le frappa deux fois au cou de toute sa force, lui ôta la tête, fit rouler son corps hors du lit et retira la moustiquaire[a] des montants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la tenture du lit » ; le terme grec désigne une moustiquaire ou un voile suspendu au-dessus du lit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάταξεν εἰς τὸν τράχηλον αὐτοῦ
  choice: le frappa […] au cou
  rationale: πατάσσω désigne ici un coup violent, et εἰς avec le verbe de mouvement se rend naturellement par « au cou » en français.
- source_word: δὶς ἐν τῇ ἰσχύϊ αὐτῆς
  choice: deux fois […] de toute sa force
  rationale: « Deux fois » traduit directement δὶς ; « de toute sa force » exprime idiomatiquement l’intensité indiquée par ἐν τῇ ἰσχύϊ αὐτῆς.
- source_word: ἀφεῖλεν τὴν κεφαλὴν αὐτοῦ
  choice: lui ôta la tête
  rationale: Cette formulation suit le sens premier d’ἀφαιρέω, « enlever, ôter », tout en exprimant clairement la décapitation dans ce contexte.
- source_word: ἀπεκύλισεν τὸ σῶμα αὐτοῦ ἀπὸ τῆς στρωμνῆς
  choice: fit rouler son corps hors du lit
  rationale: La tournure causative rend le sens d’ἀποκυλίω, « faire rouler », tandis que « lit » est ici une traduction naturelle de στρωμνή.
- source_word: ἀφεῖλε τὸ κωνώπιον ἀπὸ τῶν στύλων
  choice: retira la moustiquaire des montants
  rationale: κωνώπιον désigne au sens propre une moustiquaire ou tenture protectrice suspendue au-dessus du lit ; στῦλοι désigne ses montants ou supports.
theological_decisions:
- issue: Degré d’explicitation de la décapitation
  choice: lui ôta la tête
  alternative: lui trancha la tête
  rationale: Le grec emploie le verbe général ἀφαιρέω, « ôter, enlever », plutôt qu’un verbe spécialisé signifiant « décapiter ». La traduction retenue préserve cette forme lexicale sans masquer le résultat de l’action.
translation_notes:
  register: Français moderne, narratif et digne. La syntaxe coordonnée conserve le rythme rapide de la succession des actes. « Moustiquaire » garde le sens concret du terme grec, avec une note signalant son emploi plus large comme tenture de lit.
