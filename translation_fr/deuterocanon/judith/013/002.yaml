  text: For they were all exhausted[a], because the drinking had gone on too long.
translation:
  language: fr
  text: Car ils étaient tous épuisés[a], parce que la séance de boisson avait duré trop longtemps.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « accablés de fatigue ». Le grec décrit l’état de lassitude qui en résultait.
    reason: lexical_alternative
lexical_decisions:
- source_word: κεκοπωμένοι
  choice: épuisés
  rationale: Le participe parfait décrit l’état de fatigue résultant dans lequel ils se trouvaient. « Épuisés » rend naturellement la force du terme grec.
- source_word: διὰ τὸ ... γεγονέναι
  choice: parce que ... s’était prolongée
  rationale: La construction infinitive articulée exprime la cause de leur état; le plus-que-parfait français marque naturellement la situation antérieure qui avait produit cet épuisement.
- source_word: ἐπὶ πλεῖον
  choice: à l’excès
  rationale: L’expression indique une extension au-delà de la mesure. Dans ce contexte, elle peut viser la durée ou l’ampleur de la consommation; « à l’excès » préserve cette latitude mieux que le seul « trop longtemps ».
- source_word: τὸν πότον
  choice: la beuverie
  rationale: πότος désigne ici la consommation collective et abondante de boisson, souvent une partie de boisson. « Beuverie » est courant et précis, sans introduire l’idée d’un repas que le mot grec n’exige pas.
- source_word: γὰρ
  choice: Car
  rationale: La conjonction introduit l’explication de la situation précédente; « Car » conserve clairement ce lien explicatif dans un registre digne.
theological_decisions: []
translation_notes:
  register: Français moderne international, naturel et digne. « Beuverie » traduit directement le contexte de consommation excessive sans élargir πότος à l’ensemble d’un banquet. La formulation conserve l’ambiguïté de ἐπὶ πλεῖον entre durée prolongée et ampleur excessive.
