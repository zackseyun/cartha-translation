revisions:
- from: 'Que Dieu t’élève à jamais par tout cela et te comble de biens, puisque tu n’as pas épargné ta vie à cause de l’humiliation de notre peuple, mais que tu t’es dressée contre notre chute en suivant un droit chemin devant notre Dieu. Et tout le peuple dit : « Qu’il en soit ainsi, qu’il en soit ainsi[a]. »'
  to: 'Que Dieu fasse pour toi de tout cela une élévation éternelle, afin de te combler de biens, puisque tu n’as pas épargné ta vie à cause de l’humiliation de notre peuple, mais que tu es sortie pour faire face à notre chute, en suivant un droit chemin devant notre Dieu. Et tout le peuple dit : « Qu’il en soit ainsi, qu’il en soit ainsi[a]. »'
  rationale: La révision resserre le premier souhait sur la construction grecque « faire de ces choses une élévation éternelle » et rétablit la valeur de finalité de l’infinitif. Pour la proposition difficile relative à πτώματι, elle conserve l’idée d’un mouvement de Judith face à la chute du peuple, sans inventer un adversaire explicite ni transformer le verbe en simple posture de résistance. La note et son ancre sont conservées.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T09:39:59Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le souhait initial doit conserver plus explicitement le fait que Dieu « fasse de » ces actions une élévation éternelle pour Judith. La proposition finale reste difficile : ἐπεξῆλθες avec le datif πτώματι ne permet pas d’identifier davantage l’objet ou le mode précis de l’action. « T’es dressée contre notre chute » est interprétatif et remplace le mouvement exprimé par le verbe grec.'
  naturalness: Le français est globalement moderne et digne. « Que Dieu fasse pour toi de tout cela une élévation éternelle » est plus proche du grec et plus clair que « t’élève à jamais par tout cela ». « Tu es sortie pour faire face à notre chute » conserve un mouvement concret tout en restant idiomatique.
  terminology: « Humiliation de notre peuple », « épargné ta vie », « droit chemin » et « notre Dieu » conviennent. L’acclamation « Qu’il en soit ainsi » restitue directement Γένοιτο sans imposer la forme liturgique « Amen » ; l’alternative peut être signalée en note.
  issues:
  - severity: medium
    issue: Le premier membre rend ποιήσαι... αὐτὰ εἰς ὕψος αἰώνιον de manière trop instrumentale.
    rationale: « T’élève ... par tout cela » présente « tout cela » comme un moyen, alors que le grec demande que Dieu fasse de « ces choses » une élévation éternelle pour Judith.
  - severity: medium
    issue: « Tu t’es dressée contre notre chute » s’éloigne du verbe ἐπεξῆλθες.
    rationale: Le grec exprime un départ ou une avancée, tandis que « se dresser » introduit une image de posture et de résistance. La relation exacte du datif demeure disputée et doit rester non spécifiée autant que possible.
  - severity: low
    issue: Le lien finalité/résultat de τοῦ ἐπισκέψασθαί σε ἐν ἀγαθοῖς est insuffisamment marqué.
    rationale: La coordination « et te comble » efface l’infinitif articulé. « Afin de te combler de biens » rend naturellement sa valeur de finalité dans le contexte de la bénédiction.
