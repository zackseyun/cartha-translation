base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/020.yaml
  text: And may God make these things for you into everlasting exaltation[a], to visit you with good things, because you did not spare your life on account of the humiliation of our people, but went out against our fallen condition, having walked straight before our God. And all the people said, “Amen, amen.”
translation:
  language: fr
  text: 'Que Dieu fasse pour toi de tout cela une élévation éternelle, afin de te combler de biens, puisque tu n’as pas épargné ta vie à cause de l’humiliation de notre peuple, mais que tu es sortie pour faire face à notre chute, en suivant un droit chemin devant notre Dieu. Et tout le peuple dit : « Qu’il en soit ainsi, qu’il en soit ainsi[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Amen, amen ». Le grec signifie littéralement : « Qu’il en soit ainsi, qu’il en soit ainsi. »'
    reason: Précise l’alternative liturgique courante tout en indiquant le sens littéral de l’acclamation grecque.
lexical_decisions:
- source_word: ποιήσαι σοι αὐτὰ ὁ θεὸς εἰς ὕψος αἰώνιον
  choice: Que Dieu t’élève à jamais par tout cela
  rationale: Cette formulation conserve l’image grecque de la hauteur et la valeur de souhait de ποιήσαι, tout en donnant à αὐτά une expression collective naturelle en français.
- source_word: τοῦ ἐπισκέψασθαί σε ἐν ἀγαθοῖς
  choice: et te comble de biens
  rationale: ἐπισκέπτομαι évoque ici l’intervention bienveillante de Dieu. « Combler de biens » rend naturellement ἐν ἀγαθοῖς sans réduire la faveur divine à un bienfait précis.
- source_word: οὐκ ἐφείσω τῆς ψυχῆς σου
  choice: tu n’as pas épargné ta vie
  rationale: Dans ce contexte de danger mortel, ψυχή désigne la vie de Judith plutôt que l’âme considérée abstraitement.
- source_word: διὰ τὴν ταπείνωσιν τοῦ γένους ἡμῶν
  choice: à cause de l’humiliation de notre peuple
  rationale: ταπείνωσις exprime l’abaissement et l’humiliation subis, tandis que γένος désigne ici la collectivité du peuple.
- source_word: ἐπεξῆλθες πτώματι ἡμῶν
  choice: tu t’es dressée contre notre chute
  rationale: La construction est difficile. ἐπεξέρχομαι peut exprimer un mouvement offensif contre quelque chose, et πτῶμα signifie littéralement la chute ou l’état de ruine. Cette traduction préserve cette tension sans préciser indûment un adversaire absent du grec.
- source_word: ἐπʼ εὐθεῖαν πορευθεῖσα
  choice: en suivant un droit chemin
  rationale: La traduction garde à la fois l’image concrète du chemin droit et sa portée morale.
- source_word: Γένοιτο, γένοιτο
  choice: Qu’il en soit ainsi, qu’il en soit ainsi
  rationale: Le souhait grec est rendu directement, avec sa répétition emphatique et sa fonction d’assentiment collectif.
theological_decisions:
- issue: Forme de l’acclamation collective Γένοιτο, γένοιτο
  choice: Qu’il en soit ainsi, qu’il en soit ainsi
  alternative: Amen, amen
  rationale: La formulation retenue traduit directement le grec et conserve sa valeur de souhait. « Amen » exprimerait bien sa fonction liturgique, mais remplacerait le lexique grec par une formule traditionnelle d’origine sémitique.
- issue: Sens de l’action de Judith face au πτῶμα du peuple
  choice: tu t’es dressée contre notre chute
  alternative: tu es sortie à cause de notre chute
  rationale: Le texte associe une action dirigée ou offensive à la chute du peuple, mais la relation exacte du datif reste difficile. La traduction conserve l’idée de résistance sans identifier la chute à un ennemi personnel.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement est conservé parce que le discours s’adresse directement à Judith. Le rythme solennel de la bénédiction et la répétition finale ont été maintenus.
