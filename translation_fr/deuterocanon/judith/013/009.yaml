  text: And when she came near to the bed, she seized the hair of his head and said, “Strengthen me, O God of Israel, on this day.”
translation:
  language: fr
  text: 'Puis, s’étant approchée du lit, elle lui saisit les cheveux et dit : « Fortifie-moi, Dieu d’Israël, en ce jour. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγγίσασα
  choice: elle s’approcha
  rationale: Le participe aoriste marque l’action qui précède la saisie; cette tournure restitue naturellement la progression du récit.
- source_word: κλίνης
  choice: du lit
  rationale: κλίνη désigne un lit ou une couche; « lit » est ici le terme moderne le plus clair.
- source_word: ἐδράξατο
  choice: saisit
  rationale: Le verbe exprime une prise ferme et résolue; « saisit » conserve la vigueur de l’action.
- source_word: τῆς κόμης τῆς κεφαλῆς αὐτοῦ
  choice: les cheveux de sa tête
  rationale: Cette formulation conserve la précision, légèrement emphatique, de la double expression grecque κόμη/κεφαλή et l’identification du possesseur masculin.
- source_word: Κραταίωσόν με
  choice: Fortifie-moi
  rationale: L’impératif demande à Dieu de rendre Judith forte; « Fortifie-moi » est direct, digne et fidèle à la forme de la prière.
- source_word: ὁ θεὸς Ἰσραήλ
  choice: Dieu d’Israël
  rationale: Le groupe est employé en apostrophe. En français, l’adresse directe se comprend naturellement sans ajouter « ô ».
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: en ce jour
  rationale: La tournure garde la solennité et l’immédiateté temporelle de l’expression grecque tout en restant intelligible.
theological_decisions:
- issue: Formule de prière et adresse divine
  choice: Dieu d’Israël
  alternative: Ô Dieu d’Israël
  rationale: Le grec a une valeur vocative. La ponctuation et l’impératif rendent cette adresse explicite en français; omettre « ô » évite un archaïsme sans atténuer la prière.
translation_notes:
  register: Français moderne, narratif et digne. Le verset conserve la brièveté de l’action et la solennité de la prière, sans archaïsme inutile.
