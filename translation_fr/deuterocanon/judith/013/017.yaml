  text: And all the people were greatly astonished[a], and bowing down they worshiped God and said with one accord, “Blessed are you, our God, who today have brought the enemies of your people to nothing.”
translation:
  language: fr
  text: 'Tout le peuple fut saisi d’un profond étonnement. Ils s’inclinèrent, adorèrent Dieu et dirent d’une seule voix : « Béni sois-tu, notre Dieu, toi qui, aujourd’hui, as réduit à néant les ennemis de ton peuple[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « as traité comme rien les ennemis de ton peuple ». Le verbe grec peut signifier tenir quelqu’un pour rien ou le réduire à l’impuissance et à la ruine.'
    reason: Alternative lexicale pour ἐξουδενώσας, dont la portée peut être évaluative ou effective.
lexical_decisions:
- source_word: ἐξέστη … σφόδρα
  choice: fut saisi d’un profond étonnement
  rationale: L’expression rend l’intensité de la réaction collective exprimée par ἐξέστη et renforcée par σφόδρα, dans un français naturel et soutenu.
- source_word: κύψαντες
  choice: ils s’inclinèrent
  rationale: Le participe décrit l’abaissement physique qui accompagne ici l’adoration, sans ajouter l’idée plus forte d’une prosternation complète.
- source_word: προσεκύνησαν
  choice: adorèrent
  rationale: Puisque Dieu est l’objet du verbe, « adorèrent » exprime clairement l’acte cultuel dans ce contexte.
- source_word: ὁμοθυμαδόν
  choice: d’une seule voix
  rationale: Cette tournure idiomatique française communique l’unanimité et l’élan commun du peuple.
- source_word: Εὐλογητὸς εἶ
  choice: Béni sois-tu
  rationale: Cette formule conserve l’acclamation doxologique directement adressée à Dieu, sans en faire une simple déclaration à son sujet.
- source_word: ἐξουδενώσας
  choice: as réduit à néant
  rationale: Dans le contexte d’une victoire, cette traduction exprime la neutralisation et l’humiliation effectives des ennemis, tout en signalant en note l’autre nuance lexicale possible.
- source_word: ἐν τῇ ἡμέρᾳ τῇ σήμερον
  choice: aujourd’hui
  rationale: « Aujourd’hui » rend naturellement en français l’expression temporelle grecque, dont l’emphase demeure perceptible grâce à sa position détachée.
- source_word: τοὺς ἐχθροὺς τοῦ λαοῦ σου
  choice: les ennemis de ton peuple
  rationale: Traduction directe qui conserve la référence définie aux adversaires du peuple appartenant à Dieu.
theological_decisions:
- issue: Forme de la louange adressée à Dieu après la victoire de Judith
  choice: « Béni sois-tu, notre Dieu » comme acclamation directe
  alternative: « Notre Dieu est béni » comme affirmation à la troisième personne
  rationale: La deuxième personne εἶ et l’apostrophe « notre Dieu » montrent que le peuple s’adresse directement à Dieu.
- issue: Portée de ἐξουδενώσας envers les ennemis
  choice: Une action de Dieu qui les réduit à néant
  alternative: Dieu les a méprisés ou traités comme insignifiants
  rationale: Le contexte de victoire favorise l’idée de leur abaissement ou de leur anéantissement effectif, mais la note préserve la nuance possible de déconsidération.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement segmentée pour éviter une longue coordination pesante. « D’une seule voix » exprime naturellement l’unanimité, et « Béni sois-tu » maintient le registre liturgique sans archaïsme excessif.
