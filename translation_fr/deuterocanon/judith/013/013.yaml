  source_fidelity: 'Le sens général est fidèle : la foule accourt, l’arrivée de Judith suscite l’étonnement, les deux femmes sont accueillies, puis entourées après qu’un feu a été allumé. La tournure « son arrivée leur paraissait extraordinaire » rend le sens, mais expliciter la proposition infinitive grecque par « qu’elle soit venue » est plus proche de τοῦ ἐλθεῖν αὐτήν et plus net en français.'
  naturalness: « Du plus petit au plus grand parmi eux » est compréhensible, mais « parmi eux » alourdit inutilement le mérisme français. « Ils accoururent tous, du plus petit au plus grand » est plus naturel tout en gardant la portée collective.
  terminology: Aucun terme théologique particulier n’est en jeu. « Accueillirent », « feu », « s’éclairer » et « autour d’elles » conviennent au registre narratif moderne. Le féminin pluriel d’« elles » préserve utilement le référent grec.
