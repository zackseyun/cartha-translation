  text: And they all ran together[a], from the least to the greatest among them, because it seemed astonishing to them that she had come; and they opened the gate and welcomed them. After lighting a fire for light, they gathered around them.
translation:
  language: fr
  text: Ils accoururent tous, du plus petit au plus grand, car ils trouvaient extraordinaire qu’elle soit venue. Ils ouvrirent la porte et les accueillirent[a]. Puis ils allumèrent un feu pour s’éclairer et se rassemblèrent autour d’elles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les pronoms « les » et « elles » désignent Judith et sa compagne.
    reason: clarification du référent pronominal
lexical_decisions:
- source_word: συνέδραμον
  choice: accoururent
  rationale: Le verbe composé exprime un mouvement convergent et empressé. « Accoururent » rend naturellement en français à la fois la hâte et le rassemblement.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου αὐτῶν
  choice: du plus petit au plus grand parmi eux
  rationale: Cette formule globale inclut toute la communauté sans décider s’il s’agit précisément de l’âge ou du rang social.
- source_word: παράδοξον
  choice: extraordinaire
  rationale: Le terme désigne ce qui déjoue les attentes et suscite l’étonnement. « Extraordinaire » conserve cette valeur sans la nuance potentiellement négative d’« étrange ».
- source_word: τοῦ ἐλθεῖν αὐτήν
  choice: son arrivée
  rationale: L’infinitif substantivé indique ici le motif ou le contenu de leur étonnement. La formulation nominale est naturelle et fidèle en français.
- source_word: ἀπεδέξαντο
  choice: accueillirent
  rationale: Le verbe signifie recevoir favorablement; « accueillirent » convient au contexte de l’ouverture de la porte.
- source_word: ἅψαντες πῦρ
  choice: ils allumèrent un feu
  rationale: Le participe exprime une action préalable ou concomitante à leur rassemblement. Une proposition coordonnée rend clairement la scène en français.
- source_word: εἰς φάσιν
  choice: pour s’éclairer
  rationale: La locution exprime le but du feu, à savoir fournir de la lumière. « Pour s’éclairer » est idiomatique sans introduire l’idée non explicitée d’un signal.
- source_word: περιεκύκλωσαν
  choice: se rassemblèrent autour
  rationale: Bien que le verbe signifie littéralement « encercler », le contexte communautaire favorise une expression spatiale non hostile.
- source_word: αὐτάς
  choice: elles / les
  rationale: Le pronom féminin pluriel renvoie à Judith et à sa compagne. Les pronoms français conservent le genre grammatical explicite du grec.
