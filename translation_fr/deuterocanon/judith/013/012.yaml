  text: And when the men of her city heard her voice, they hurried down to the gate of their city and called together the elders of the city.
translation:
  language: fr
  text: Quand les hommes de sa ville entendirent sa voix, ils se hâtèrent de descendre jusqu’à la porte de leur ville et convoquèrent les anciens de la ville.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο ὡς
  choice: Quand
  rationale: Cette tournure introduit l’événement suivant dans le récit. En français, « Quand » en exprime naturellement la valeur temporelle sans calquer lourdement l’idiome grec.
- source_word: οἱ ἄνδρες τῆς πόλεως αὐτῆς
  choice: les hommes de sa ville
  rationale: ἄνδρες désigne explicitement des hommes, tandis que αὐτῆς renvoie à Judith. Cette traduction conserve les deux éléments.
- source_word: τὴν φωνὴν αὐτῆς
  choice: sa voix
  rationale: φωνή désigne ici la voix de Judith, que les hommes reconnaissent ou entendent lorsqu’elle appelle.
- source_word: ἐσπούδασαν τοῦ καταβῆναι
  choice: ils se hâtèrent de descendre
  rationale: Le verbe exprime l’empressement et l’urgence; l’infinitif précise l’action accomplie. « Se hâter de » est naturel et dignifié.
- source_word: ἐπὶ τὴν πύλην τῆς πόλεως αὐτῶν
  choice: jusqu’à la porte de leur ville
  rationale: Dans ce contexte de déplacement, ἐπί avec l’accusatif indique la destination. « Jusqu’à » rend clairement l’arrivée à la porte, et αὐτῶν est conservé par « leur ».
- source_word: συνεκάλεσαν
  choice: convoquèrent
  rationale: Le composé signifie appeler des personnes à se réunir. « Convoquer » exprime cette action avec concision, particulièrement pour des responsables civiques.
- source_word: τοὺς πρεσβυτέρους τῆς πόλεως
  choice: les anciens de la ville
  rationale: πρεσβύτεροι désigne ici les anciens qui exercent une responsabilité dans la cité. La formulation reste proche du grec et familière au registre biblique français.
theological_decisions:
- issue: Portée genrée de ἄνδρες
  choice: les hommes de sa ville
  alternative: les habitants de sa ville
  rationale: Le grec emploie le nom masculin ἄνδρες plutôt qu’un collectif neutre. La traduction maintient cette précision sans élargir silencieusement le référent.
translation_notes:
  register: Français international moderne, narratif et dignifié. La syntaxe est fluide tout en restant proche de l’ordre et des relations du grec. Aucun appel de note n’est nécessaire.
