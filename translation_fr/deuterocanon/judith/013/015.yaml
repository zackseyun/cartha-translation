  text: And coming forward, she showed them the head from the bag and said to them, “Look, the head of Holofernes, the commander-in-chief of the army of Asshur; and look, the canopy under which he was lying in his drunkenness. And the Lord struck him down by the hand of a woman.”
translation:
  language: fr
  text: 'Puis elle s’avança, sortit la tête du sac et la leur montra. Elle leur dit : « Voici la tête d’Holopherne, commandant en chef de l’armée d’Assour ! Et voici la moustiquaire dans laquelle il était couché dans son ivresse ! Le Seigneur l’a frappé par la main d’une femme. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προελθοῦσα
  choice: elle s’avança
  rationale: Rend naturellement le participe grec indiquant que Judith s’avance avant de présenter la tête.
- source_word: πήρα
  choice: sac
  rationale: Terme courant et suffisamment large pour désigner le contenant dans lequel la tête avait été placée.
- source_word: ἀρχιστράτηγος
  choice: commandant en chef
  rationale: Restitue le rang militaire suprême exprimé par le composé grec.
- source_word: δύναμις Ἀσσούρ
  choice: l’armée d’Assour
  rationale: Dans ce contexte militaire, δύναμις désigne les forces armées; Assour conserve la forme du nom grec.
- source_word: κωνώπιον
  choice: moustiquaire
  rationale: Désigne ici la tenture ou le voile protecteur entourant le lit; « moustiquaire » est précis et compréhensible en français moderne.
- source_word: ἐν ταῖς μέθαις αὐτοῦ
  choice: dans son ivresse
  rationale: Expression française naturelle qui conserve l’état d’ébriété indiqué par le grec, malgré le pluriel idiomatique μέθαις.
- source_word: ἐν χειρὶ θηλείας
  choice: par la main d’une femme
  rationale: Préserve l’image instrumentale de la main ainsi que l’accent explicite mis sur le sexe féminin.
theological_decisions:
- issue: Attribution de la mort d’Holopherne au Seigneur
  choice: Le Seigneur l’a frappé par la main d’une femme
  alternative: Une femme l’a frappé avec l’aide du Seigneur
  rationale: La formulation retenue conserve sans l’atténuer l’action divine exprimée par ὁ κύριος comme sujet et le rôle instrumental de la femme exprimé par ἐν χειρί.
translation_notes:
  register: Français international moderne, direct et digne. La répétition de « voici » reprend l’insistance rhétorique de ἰδού. Les exclamations rendent la présentation publique et triomphale sans ajouter de contenu.
