revisions:
- from: 'Puis elle s’avança, leur montra la tête sortie du sac et leur dit : « Voici la tête d’Holopherne, commandant en chef de l’armée d’Assour ! Et voici la moustiquaire sous laquelle il était couché dans son ivresse ! Le Seigneur l’a frappé par la main d’une femme. »'
  to: 'Puis elle s’avança, sortit la tête du sac et la leur montra. Elle leur dit : « Voici la tête d’Holopherne, commandant en chef de l’armée d’Assour ! Et voici la moustiquaire dans laquelle il était couché dans son ivresse ! Le Seigneur l’a frappé par la main d’une femme. »'
  rationale: 'Révision limitée à la présentation de la tête et à la relation spatiale avec la moustiquaire, afin de refléter plus précisément le grec tout en conservant le style direct, moderne et solennel du projet. Aucune note n’est nécessaire : les difficultés sont rendues de manière intelligible dans le texte.'
