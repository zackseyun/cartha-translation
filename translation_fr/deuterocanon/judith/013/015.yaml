review_pass:
  verdict: revise
  source_fidelity: 'La formulation « la tête sortie du sac » ne rend pas nettement le grec τὴν κεφαλὴν ἐκ τῆς πήρας ἔδειξεν : elle peut suggérer que la tête était déjà sortie. Le grec dit que Judith montre la tête en la tirant/présentant hors du sac. Le reste suit fidèlement le texte, y compris l’attribution de l’action au Seigneur et le moyen « par la main d’une femme ».'
  naturalness: Le français est globalement fluide et d’un registre approprié. « Sortit la tête du sac et la leur montra » est plus idiomatique et précis que « leur montra la tête sortie du sac ». « Dans laquelle il était couché » reproduit aussi plus directement la relation spatiale de ἐν ᾧ que « sous laquelle ».
  terminology: « Holopherne », « commandant en chef », « Assour », « moustiquaire », « le Seigneur » et « par la main d’une femme » sont des choix recevables en français moderne et conservent les termes et l’accent du grec. « Moustiquaire » correspond à κωνώπιον; le relatif doit toutefois garder l’idée d’être à l’intérieur de cette tenture protectrice.
  issues:
  - severity: medium
    issue: « la tête sortie du sac »
    rationale: Cette tournure décrit un état et laisse ambigu le geste de Judith. Le grec associe « la tête » et « hors du sac » à l’action de montrer; en français, « sortit la tête du sac et la leur montra » rend explicitement et sans ajout ce mouvement de présentation.
  - severity: low
    issue: « sous laquelle il était couché »
    rationale: Le grec porte ἐν ᾧ, « dans laquelle ». Avec une moustiquaire qui entoure le lit, « dans laquelle » conserve la préposition et évite de réduire l’image à une simple couverture placée au-dessus de lui.
  revised_text: 'Puis elle s’avança, sortit la tête du sac et la leur montra. Elle leur dit : « Voici la tête d’Holopherne, commandant en chef de l’armée d’Assour ! Et voici la moustiquaire dans laquelle il était couché dans son ivresse ! Le Seigneur l’a frappé par la main d’une femme. »'
  revised_footnotes: []
