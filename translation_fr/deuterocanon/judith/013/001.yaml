base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/001.yaml
  text: When evening came[a], his servants hurried to depart; and Bagoas shut the tent from outside and excluded those in attendance from the presence of his lord, and they went away to their beds.
translation:
  language: fr
  text: Quand le soir fut venu, ses esclaves[a] s’empressèrent de se retirer. Bagoas ferma la tente de l’extérieur, écarta de la présence de son maître tous ceux qui se tenaient là, et ils regagnèrent leurs couches.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteurs ». Le grec emploie δοῦλοι, terme qui désigne des personnes placées sous l’autorité d’un maître, ici des membres de sa suite domestique.
    reason: Alternative lexicale et précision sur le statut social.
lexical_decisions:
- source_word: ὀψία
  choice: le soir
  rationale: Dans la tournure ὀψία ἐγένετο, le sens temporel naturel est « quand le soir fut venu » ; « à la tombée de la nuit » serait plus précis que ne l’exige le grec.
- source_word: ἐσπούδασαν
  choice: s’empressèrent
  rationale: Le verbe exprime l’empressement ou la hâte ; cette formulation garde un registre narratif digne et actuel.
- source_word: οἱ δοῦλοι αὐτοῦ
  choice: ses esclaves
  rationale: δοῦλοι désigne ici des membres de la maisonnée placés sous l’autorité d’un maître. « Esclaves » préserve cette réalité sociale, tandis que « serviteurs » reste une possibilité contextuelle signalée en note.
- source_word: ἀναλύειν
  choice: se retirer
  rationale: Dans ce contexte nocturne, le verbe évoque le fait de quitter le service ou de rompre la réunion ; « se retirer » est naturel en français.
- source_word: συνέκλεισεν τὴν σκηνὴν ἔξωθεν
  choice: ferma la tente de l’extérieur
  rationale: La formulation indique que Bagoas ferme la tente depuis l’extérieur, sans préciser un dispositif de fermeture.
- source_word: ἀπέκλεισεν
  choice: écarta
  rationale: Le verbe exprime l’exclusion ou l’éloignement hors de la présence du maître ; « écarta » rend clairement l’action sans lourdeur.
- source_word: τοὺς παρεστῶτας
  choice: tous ceux qui se tenaient là
  rationale: Le participe désigne les personnes présentes ou en service auprès du maître ; cette expression conserve sa nuance verbale.
- source_word: ἐκ προσώπου τοῦ κυρίου αὐτοῦ
  choice: de la présence de son maître
  rationale: ἐκ προσώπου est un idiome de retrait hors de la présence de quelqu’un. κύριος désigne ici Holopherne comme supérieur humain ; « maître » évite une lecture divine.
- source_word: ἀπῴχοντο εἰς τὰς κοίτας αὐτῶν
  choice: ils regagnèrent leurs couches
  rationale: κοίτας désigne les lits ou lieux de repos. « Regagnèrent leurs couches » préserve le pluriel et convient au registre narratif.
- source_word: Βαγώας
  choice: Bagoas
  rationale: Le nom propre grec est translittéré selon sa forme française usuelle.
theological_decisions:
- issue: Traduction de δοῦλοι dans ce récit deutérocanonique
  choice: ses esclaves
  alternative: ses serviteurs
  rationale: Le mot grec peut désigner des serviteurs, mais il marque fondamentalement une dépendance envers un maître. Dans cette suite domestique et militaire, « esclaves » conserve la réalité sociale du terme sans introduire de particularité confessionnelle.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été légèrement réorganisée pour rester naturelle, tout en conservant la progression du grec et l’ambiguïté lexicale de δοῦλοι dans une note.
