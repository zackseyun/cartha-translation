  text: But Judith was left alone in the tent[a], and Holofernes had collapsed on his bed[b], for the wine had overwhelmed him.
translation:
  language: fr
  text: Mais Judith resta seule dans la tente, tandis qu’Holopherne s’était effondré sur son lit, car le vin l’avait terrassé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπελείφθη
  choice: resta
  rationale: Dans ce contexte, l’aoriste passif indique que Judith est la seule encore présente après le départ des autres. « Resta » exprime naturellement en français le résultat narratif sans alourdir la phrase.
- source_word: μόνη
  choice: seule
  rationale: Le mot souligne que Judith se trouve sans personne d’autre dans la tente.
- source_word: σκηνῇ
  choice: tente
  rationale: Dans le cadre d’un camp militaire, « tente » est le terme français courant et précis.
- source_word: προπεπτωκὼς
  choice: s’était effondré
  rationale: Le participe parfait de προπίπτω décrit une chute dont l’état résultant persiste. « S’était effondré » rend naturellement la chute due à l’ivresse, sans imposer une position corporelle plus précise que ne l’exige le contexte.
- source_word: κλίνην
  choice: lit
  rationale: κλίνη peut désigner un lit ou une couche. « Lit » est ici clair, naturel et adapté à la scène.
- source_word: περικεχυμένος
  choice: l’avait terrassé
  rationale: La formulation grecque, littéralement proche de l’idée que le vin était répandu autour ou sur lui, décrit idiomatiquement l’emprise du vin. « L’avait terrassé » conserve le vin comme sujet et exprime clairement son effet accablant.
- source_word: οἶνος
  choice: le vin
  rationale: L’article grec et le contexte renvoient au vin qu’Holopherne vient de boire; « le vin » conserve aussi le sujet explicite de la proposition grecque.
theological_decisions: []
translation_notes:
  register: 'Français moderne international, narratif et digne. La phrase privilégie une équivalence optimale: elle suit la structure et les acteurs du grec tout en rendant idiomatiquement les deux participes. « Tandis que » clarifie le contraste de situation sans ajouter d’interprétation théologique.'
