translation:
  language: fr
  text: 'Et Ozias lui dit : « Tu es bénie, ma fille, par le Dieu Très-Haut[a], plus que toutes les femmes qui sont sur la terre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu es bénie, ma fille, devant le Dieu Très-Haut, plus que toutes les femmes qui sont sur la terre. » Le datif grec employé après « bénie » peut être compris de plusieurs manières proches.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὴ σύ
  choice: Tu es bénie
  rationale: Cette formulation française naturelle conserve la valeur déclarative et solennelle de l’adjectif prédicatif grec.
- source_word: θυγάτηρ
  choice: ma fille
  rationale: En français, « ma fille » est la forme d’adresse respectueuse et familiale la plus naturelle dans ce contexte ; le possessif est idiomatique plutôt qu’une affirmation explicite de filiation.
- source_word: τῷ θεῷ τῷ ὑψίστῳ
  choice: par le Dieu Très-Haut
  rationale: Le datif peut désigner l’agent ou la référence selon laquelle Judith est dite bénie. « Par le Dieu Très-Haut » exprime naturellement la première possibilité sans faire de Judith celle qui bénit Dieu.
- source_word: παρὰ πάσας τὰς γυναῖκας
  choice: plus que toutes les femmes
  rationale: παρά avec l’accusatif a ici une valeur comparative ; cette traduction en conserve directement la force.
- source_word: τὰς ἐπὶ τῆς γῆς
  choice: qui sont sur la terre
  rationale: La relative rend explicitement le groupe adjectival grec et maintient sa portée universelle.
- source_word: Ὀζίας
  choice: Ozias
  rationale: « Ozias » est la forme française biblique traditionnelle correspondant au grec Ὀζίας.
theological_decisions:
- issue: Valeur du datif τῷ θεῷ τῷ ὑψίστῳ dans la formule de bénédiction
  choice: Judith est déclarée bénie par le Dieu Très-Haut.
  alternative: Judith est déclarée bénie devant le Dieu Très-Haut.
  rationale: La syntaxe permet plusieurs nuances relationnelles. Le texte principal retient l’agent, lecture cohérente et naturelle en français, tandis qu’une note préserve l’autre possibilité réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la solennité de la bénédiction sans archaïsme ; la note signale l’ambiguïté authentique du datif grec.
