  text: But the people became very thirsty[a], and they compelled us to do as we had said to them, and to bring upon ourselves an oath that we will not break.
translation:
  language: fr
  text: Mais le peuple souffrait terriblement de la soif, et il nous a contraints à faire comme nous le lui avions dit[b] et à faire peser sur nous un serment[a] que nous ne violerons pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à nous lier par un serment ». Le grec dit littéralement « à faire venir sur nous un serment ».
    reason: lexical_alternative
  - marker: b
    text: Le grec porte littéralement « comme ils leur avaient dit ». La formulation est difficile; la traduction suit le sens que demande le contexte.
    reason: textual_difficulty
lexical_decisions:
- source_word: ἐδίψησεν σφόδρα
  choice: souffrait terriblement de la soif
  rationale: Cette formulation française naturelle exprime l’intensité marquée par σφόδρα sans donner à l’aoriste une valeur inchoative obligatoire.
- source_word: ἠνάγκασαν
  choice: ils nous ont contraints
  rationale: Le verbe indique une forte pression pouvant aller jusqu’à la contrainte. Le pluriel « ils » respecte la forme grecque et renvoie aux membres du peuple pris collectivement.
- source_word: ποιῆσαι ἡμᾶς καθὰ ἐλάλησαν αὐτοῖς
  choice: à faire comme nous le leur avions dit
  rationale: Le contexte renvoie à l’engagement précédemment annoncé au peuple par les dirigeants. Le grec transmis est grammaticalement difficile, puisqu’il porte littéralement une forme à la troisième personne du pluriel (« ils avaient dit ») là où le contexte appelle « nous avions dit ».
- source_word: ἐπαγαγεῖν ἐφʼ ἡμᾶς ὅρκον
  choice: à faire peser sur nous un serment
  rationale: Cette traduction conserve l’image grecque d’un serment que l’on fait venir sur soi tout en restant intelligible en français.
- source_word: ὃν οὐ παραβησόμεθα
  choice: que nous ne violerons pas
  rationale: Avec un serment pour complément, παραβαίνω signifie l’enfreindre ou le violer. « Violer un serment » convient au registre solennel du passage.
