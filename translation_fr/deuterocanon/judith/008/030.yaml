translation_notes:
  register: Français moderne, international et digne. La phrase conserve la gravité de la déclaration ainsi que l’image concrète du serment pesant sur ceux qui le prêtent; la tournure contextuelle « nous le leur avions dit » rend intelligible une construction grecque transmise sous une forme difficile.
