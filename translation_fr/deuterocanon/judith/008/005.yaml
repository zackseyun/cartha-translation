  text: And she made for herself a tent on the roof of her house[a], and put sackcloth around her waist[b], and the garments of her widowhood were upon her.
translation:
  language: fr
  text: Elle se fit une tente sur le toit de sa maison[a], mit une toile de sac autour de sa taille[b] et portait les vêtements de son veuvage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit du toit plat de la maison, qui pouvait servir d’espace de vie.
    reason: lexical_alternative
  - marker: b
    text: La toile de sac était une étoffe grossière portée en signe de deuil, de détresse ou d’humiliation.
    reason: cultural_note
lexical_decisions:
- source_word: σκηνήν
  choice: une tente
  rationale: Le terme désigne couramment une tente ou un abri temporaire. « Tente » reste direct et évite de préciser abusivement la construction.
- source_word: ἐπὶ τοῦ δώματος τοῦ οἴκου αὐτῆς
  choice: sur le toit de sa maison
  rationale: Dans ce contexte, δῶμα désigne le toit plat habitable de la maison. Cette formulation est naturelle en français moderne.
- source_word: σάκκον
  choice: une toile de sac
  rationale: Le terme désigne une étoffe grossière portée notamment en signe de deuil, de détresse ou d’humiliation. « Toile de sac » conserve l’image biblique tout en restant intelligible.
- source_word: ἐπὶ τὴν ὀσφὺν αὐτῆς
  choice: autour de la taille
  rationale: ὀσφύς renvoie aux reins ou à la taille; la tournure choisie exprime naturellement la manière de porter cette étoffe.
- source_word: τὰ ἱμάτια τῆς χηρεύσεως αὐτῆς
  choice: ses vêtements de veuve
  rationale: Cette expression concise conserve le lien explicite avec son état de veuve sans réduire nécessairement ces vêtements à de simples habits de deuil.
- source_word: ἐποίησεν αὐτῇ
  choice: s’était aménagé
  rationale: Le moyen grec signifie qu’elle fit ou installa cet abri pour elle-même. Le plus-que-parfait s’accorde naturellement au portrait rétrospectif du contexte.
- source_word: ἦν ἐπʼ αὐτῆς
  choice: avait sur elle
  rationale: La formulation maintient le caractère statif et relativement littéral de la proposition grecque, tout en étant idiomatique en français.
