base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/016.yaml
  text: But do not hold the plans of the Lord our God as security[a], for God is not like a man, to be threatened, nor like a son of man[b], to be persuaded.
translation:
  language: fr
  text: Mais vous, ne prenez pas en gage les projets du Seigneur notre Dieu[a], car Dieu n’est pas comme un homme que l’on peut menacer, ni comme un fils d’homme[b] que l’on peut persuader.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne considérez pas les projets du Seigneur notre Dieu comme une garantie ». Le grec emploie l’image d’un gage servant de garantie.'
    reason: lexical_alternative
  - marker: b
    text: Ici, « fils d’homme » est une tournure de style sémitique qui désigne un être humain ; ce n’est pas un titre messianique.
    reason: cultural_note
lexical_decisions:
- source_word: ἐνεχυράζετε
  choice: prenez en gage
  rationale: Le verbe appartient au vocabulaire du gage ou de la garantie. Cette formulation conserve l’image concrète du grec et la mise en garde contre toute tentative de soumettre les projets de Dieu à des conditions humaines.
- source_word: βουλάς
  choice: projets
  rationale: Le terme peut désigner des conseils, des desseins ou des projets. « Projets » est clair en français moderne et convient ici à ce que Dieu entend accomplir.
- source_word: κυρίου τοῦ θεοῦ ἡμῶν
  choice: du Seigneur notre Dieu
  rationale: Cette formulation conserve le titre « Seigneur » et rend naturellement en français la construction grecque.
- source_word: ἀπειληθῆναι
  choice: que l’on pourrait menacer
  rationale: Le passif grec signifie directement « être menacé ». La tournure française maintient l’idée que Dieu ne peut être soumis à une pression humaine.
- source_word: διαπεισθῆναι
  choice: que l’on pourrait persuader
  rationale: Le verbe évoque le fait d’être persuadé ou amené à céder. « Persuader » conserve le parallélisme avec « menacer » sans développer excessivement le sens.
- source_word: υἱὸς ἀνθρώπου
  choice: un fils d’homme
  rationale: La traduction littérale préserve le parallélisme rhétorique du grec. Une note précise qu’il s’agit ici d’une manière sémitique de parler d’un être humain.
theological_decisions:
- issue: Contraste anthropomorphique entre Dieu et l’être humain
  choice: Présenter Dieu comme ne pouvant être menacé ni persuadé à la manière d’un être humain.
  alternative: 'Reformuler plus librement : « Dieu n’est pas un être humain que l’on peut intimider ou manipuler. »'
  rationale: Le grec établit explicitement un parallèle entre « homme » et « fils d’homme », avec deux infinitifs passifs. La traduction conserve ce contraste et sa tension sans l’élargir en affirmation doctrinale étrangère au verset.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le parallélisme du grec, tandis que « que l’on pourrait » rend naturellement les infinitifs passifs. L’image inhabituelle du gage est maintenue dans le texte et explicitée en note.
