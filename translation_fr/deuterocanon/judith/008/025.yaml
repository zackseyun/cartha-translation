base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/025.yaml
  text: Besides all this[a], let us give thanks to the Lord our God[b], who tests us just as he also tested our fathers.
translation:
  language: fr
  text: Malgré tout cela, rendons grâce au Seigneur notre Dieu, qui nous met à l’épreuve[a], comme il a aussi mis nos pères[b] à l’épreuve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec peut aussi signifier « éprouver » ou, dans certains contextes, « tenter ». Ici, il s’agit vraisemblablement de la mise à l’épreuve du peuple par Dieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « nos ancêtres ». Le grec dit littéralement « nos pères ».
    reason: lexical_alternative
lexical_decisions:
- source_word: παρὰ ταῦτα πάντα
  choice: Malgré tout cela
  rationale: 'Dans le contexte, la locution a une valeur concessive : Judith appelle à remercier Dieu en dépit des épreuves évoquées. Cette formulation est naturelle en français et conserve le lien avec « tout cela ».'
- source_word: εὐχαριστήσωμεν
  choice: rendons grâce
  rationale: Le subjonctif exhortatif à la première personne du pluriel appelle à une action commune. « Rendons grâce » est idiomatique, digne et convient à l’objet indirect « au Seigneur notre Dieu ».
- source_word: Κυρίῳ τῷ θεῷ ἡμῶν
  choice: au Seigneur notre Dieu
  rationale: Rend directement le titre divin κύριος et le possessif communautaire, sans alourdir la phrase.
- source_word: πειράζει
  choice: nous met à l’épreuve
  rationale: πειράζω peut désigner le fait d’éprouver, de tester ou, selon le contexte, de tenter. Avec Dieu pour sujet et la comparaison avec les générations antérieures, « mettre à l’épreuve » exprime ici le sens le plus probable tout en laissant apparaître la dureté de l’expérience.
- source_word: καθὰ καὶ
  choice: comme il a aussi
  rationale: La formulation conserve à la fois la comparaison marquée par καθά et la valeur additive de καί.
- source_word: τοὺς πατέρας ἡμῶν
  choice: nos pères
  rationale: Le grec emploie explicitement le terme masculin πατέρες pour les pères ou devanciers d’Israël. Le texte principal garde cette forme, tandis qu’une note signale le sens plus large possible d’« ancêtres ».
theological_decisions:
- issue: Sens de πειράζει lorsque Dieu est le sujet
  choice: met à l’épreuve
  alternative: tente ; éprouve
  rationale: Le contexte présente l’adversité comme une épreuve comparable à celles des pères. « Met à l’épreuve » évite d’attribuer sans nécessité à Dieu l’incitation morale au mal, mais la note conserve l’étendue sémantique du verbe grec.
- issue: Portée de τοὺς πατέρας ἡμῶν
  choice: nos pères
  alternative: nos ancêtres
  rationale: « Nos pères » reproduit la forme familiale masculine du grec et son registre scripturaire. « Nos ancêtres » explicite la portée collective possible sans être imposé dans le texte.
translation_notes:
  register: Français international moderne, clair et digne. « Rendons grâce » maintient le ton exhortatif et religieux sans archaïsme excessif. La répétition de « à l’épreuve » rend explicite la comparaison entre l’action présente et passée de Dieu, conformément au grec.
