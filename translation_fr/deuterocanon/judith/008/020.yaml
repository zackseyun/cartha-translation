  naturalness: Le français est globalement fluide et de registre approprié. « Ne négligera pas » est plus directement idiomatique et sémantiquement précis ici. La reformulation de la seconde coordination évite que « ni ceux de notre peuple » ne reste elliptique ou paraisse apposé à « nous ».
  terminology: « Reconnu aucun autre dieu que lui » rend correctement ἐπέγνωμεν sans ajouter l’adoration. « Notre peuple » est un bon équivalent moderne de γένος dans ce contexte collectif ; la note conserve utilement la nuance de lignée ou de groupe d’origine.
