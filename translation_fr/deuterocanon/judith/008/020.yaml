  yaml_path: translation/deuterocanon/judith/008/020.yaml
  text: But we have acknowledged no other god except him[a]; therefore we hope that he will not disregard us[c][b], nor our people.
translation:
  language: fr
  text: Mais nous n’avons reconnu aucun autre dieu que lui[a] ; c’est pourquoi nous espérons qu’il ne nous négligera pas[b] et qu’il ne négligera personne de notre peuple[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Nous n’avons connu / admis aucun autre dieu que lui. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il ne nous ignorera pas » ou « il ne nous regardera pas de haut ».'
    reason: lexical_alternative
  - marker: c
    text: 'Grec : « de notre γένος », c’est-à-dire de notre lignée, de notre groupe d’origine ou de notre peuple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωμεν
  choice: nous n’avons reconnu
  rationale: L’aoriste de ἐπιγινώσκω peut exprimer le fait de connaître, de reconnaître ou d’admettre. Dans ce contexte confessionnel, « reconnaître » rend l’attachement exclusif à Dieu sans introduire explicitement l’idée de culte.
- source_word: ἕτερον θεὸν … πλὴν αὐτοῦ
  choice: aucun autre dieu que lui
  rationale: Cette formulation française naturelle conserve la construction d’exception et l’exclusivité de l’affirmation grecque.
- source_word: ὅθεν
  choice: c’est pourquoi
  rationale: Le terme introduit ici une conséquence tirée de la reconnaissance exclusive de Dieu.
- source_word: ἐλπίζομεν
  choice: nous espérons
  rationale: « Espérer » préserve la confiance exprimée sans transformer celle-ci en certitude absolue.
- source_word: οὐχ ὑπερόψεται
  choice: il ne nous délaissera pas
  rationale: ὑπεροράω peut signifier négliger, ne pas tenir compte de ou regarder de haut. « Délaisser » exprime naturellement ici le refus divin d’abandonner ou de négliger les siens.
- source_word: ἀπὸ τοῦ γένους ἡμῶν
  choice: ni ceux de notre peuple
  rationale: La préposition ἀπό invite à conserver l’idée de personnes issues du groupe d’appartenance. « Ceux de notre peuple » rend le sens collectif et ancestral de γένος sans employer « race », potentiellement trompeur en français contemporain.
theological_decisions:
- issue: Reconnaissance exclusive de Dieu
  choice: « aucun autre dieu que lui »
  alternative: « nous n’avons adoré aucun autre dieu que lui »
  rationale: Le grec parle de connaissance ou de reconnaissance, non explicitement d’adoration. La traduction conserve donc l’exclusivité théologique sans ajouter une notion absente du verbe.
- issue: Portée de γένος
  choice: « ceux de notre peuple »
  alternative: « notre lignée » ou « notre peuple »
  rationale: γένος évoque un groupe lié par l’origine ou la descendance. La formulation choisie préserve ce caractère communautaire tout en tenant compte de ἀπό et en évitant les connotations modernes de « race ».
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve le raisonnement du grec et son espérance confiante, sans durcir celle-ci en certitude ni expliciter une doctrine au-delà du texte.
