  naturalness: La formulation est naturelle en français moderne tout en conservant un registre narratif sobre. « Ils se rendirent à leurs postes » est idiomatique et clair. « Puis, après… » est légèrement redondant sur le plan de l’enchaînement temporel, mais reste parfaitement acceptable et ne nuit ni à la lisibilité ni à la fidélité.
