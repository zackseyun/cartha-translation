  text: And turning away from the tent[a], they went to their assigned posts.
translation:
  language: fr
  text: Puis, après s’être éloignés de la tente, ils se rendirent à leurs postes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « places assignées » ou « positions ». Le terme grec peut désigner plus largement une disposition ordonnée ou une place attribuée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστρέψαντες
  choice: après s’être éloignés
  rationale: Le participe aoriste exprime une action antérieure au verbe principal. « S’éloigner » rend ici le mouvement à partir de la tente sans imposer l’idée plus forte d’un retour.
- source_word: σκηνῆς
  choice: la tente
  rationale: σκηνή désigne couramment une tente. Dans ce cadre narratif, rien ne justifie le terme cultuel « tabernacle ».
- source_word: ἐπορεύθησαν
  choice: ils se rendirent
  rationale: Formulation narrative naturelle exprimant le déplacement vers les lieux indiqués par le complément.
- source_word: διατάξεις
  choice: postes
  rationale: διάταξις peut désigner une disposition ordonnée, une affectation ou une position assignée. « Postes » convient au mouvement vers les places ou fonctions respectives des hommes, tout en laissant l’éventail lexical en note.
- source_word: αὐτῶν
  choice: leurs
  rationale: Le possessif renvoie simplement aux sujets du verbe, sans emphase particulière.
