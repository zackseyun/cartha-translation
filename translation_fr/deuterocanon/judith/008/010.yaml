  text: And she sent her maid[a], who was in charge of all that belonged to her, and summoned Chabris and Charmis, the elders of her city.
translation:
  language: fr
  text: Et elle envoya sa servante[a], qui était chargée de tous ses biens, et convoqua Chabris et Charmis, les anciens de sa ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « domestique ». Le grec ἅβρα désigne une femme au service d’une maîtresse.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστείλασα
  choice: elle envoya
  rationale: Le participe aoriste exprime une action antérieure ou étroitement liée au verbe principal. Une proposition coordonnée rend naturellement la séquence en français.
- source_word: ἅβραν
  choice: sa servante
  rationale: Le nom désigne une femme attachée au service personnel ou domestique. « Servante » est clair, digne et actuel, sans l’archaïsme de « servante à main » ni l’ambiguïté moderne de « femme de chambre ».
- source_word: τὴν ἐφεστῶσαν πᾶσιν τοῖς ὑπάρχουσιν αὐτῆς
  choice: qui était chargée de tous ses biens
  rationale: ἐφεστῶσαν indique une responsabilité de surveillance ou de gestion, et τὰ ὑπάρχοντα désigne ici les possessions de Judith.
- source_word: ἐκάλεσεν
  choice: chercher
  rationale: Avec « envoya sa servante », le français idiomatique « envoyer quelqu’un chercher quelqu’un » exprime l’acte de faire venir les anciens. Il conserve le but de l’appel sans suggérer nécessairement un ordre officiel explicite.
- source_word: Χαβρεὶν καὶ Χαρμεῖν
  choice: Chabris et Charmis
  rationale: Translittération française des noms propres grecs, conforme à des formes couramment employées dans la tradition biblique française.
- source_word: τοὺς πρεσβυτέρους τῆς πόλεως αὐτῆς
  choice: les anciens de sa ville
  rationale: Dans ce contexte, πρεσβύτεροι désigne les responsables civiques de la ville, et non simplement des hommes âgés. « Anciens » conserve ce rôle institutionnel.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La construction « envoya sa servante chercher » évite le calque participial tout en conservant la séquence et la fonction de messagère. Le terme « anciens » garde la portée civique du grec.
