  verdict: revise
  source_fidelity: Le projet rend correctement la servante, sa responsabilité sur les biens de Judith et la fonction civique des « anciens ». Toutefois, « envoya sa servante chercher » explicite le moyen par lequel les anciens sont appelés, alors que le grec coordonne « envoya sa servante » et « convoqua/appela » sans exprimer ce complément de but. Une coordination explicite est plus fidèle à la syntaxe et à la réserve du texte source.
  naturalness: La formulation révisée est naturelle en français international moderne. « Convoqua » convient au contexte d’une invitation pressante adressée aux responsables de la ville, sans alourdir la phrase.
  terminology: « Servante » est acceptable pour ἅβρα dans ce cadre domestique; « domestique » constitue une véritable alternative lexicale moderne. « Dame de compagnie » est inadéquat, car il évoque surtout une accompagnatrice sociale et n’exprime pas nécessairement le service domestique. « Anciens » maintient correctement le sens institutionnel de πρεσβύτεροι.
  issues:
  - severity: medium
    issue: La note propose « dame de compagnie » comme alternative à « servante ».
    rationale: Cette expression ne correspond pas de manière suffisamment précise à ἅβρα, qui désigne une femme au service d’une maîtresse, c’est-à-dire une servante ou domestique.
  - severity: low
    issue: « Envoya sa servante chercher » transforme la coordination grecque en complément de but explicite.
    rationale: Le sens contextuel reste proche, mais « et convoqua » préserve plus exactement les deux actions coordonnées sans préciser que la servante est explicitement chargée d’aller les chercher.
