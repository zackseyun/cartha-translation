base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/011.yaml
  text: And they came to her[a], and she said to them, “Listen to me, rulers of those who dwell in Bethulia, for your word that you spoke against the people on this day is not right, and you have set up the oath that you spoke between God and yourselves, and said that you would hand over the city to our enemies if within these days the Lord does not turn back to help you.”
translation:
  language: fr
  text: 'Ils vinrent auprès d’elle, et elle leur dit : « Écoutez-moi donc, chefs des habitants de Béthulie. Ce que vous avez dit aujourd’hui contre le peuple[b] n’est pas juste. Vous avez établi, entre Dieu et vous, le serment que vous avez prononcé, et vous avez déclaré que vous livreriez la ville à nos ennemis si, durant ces jours-là[a], le Seigneur ne revenait pas vous secourir. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en elles »; le pronom grec renvoie probablement aux journées fixées pour le serment.'
    reason: Référence pronominale implicite dans le grec.
  - marker: b
    text: 'Ou : « devant le peuple », c’est-à-dire en sa présence.'
    reason: Le grec ἐναντίον peut avoir un sens adversatif (« contre ») ou spatial (« devant »).
lexical_decisions:
- source_word: ἄρχοντες τῶν κατοικούντων ἐν Βαιτυλουά
  choice: chefs des habitants de Béthulie
  rationale: « Chefs » désigne naturellement ceux qui exercent l’autorité, tandis que « des habitants » rend le participe substantivé sans lourdeur.
- source_word: οὐκ εὐθὺς ὁ λόγος ὑμῶν
  choice: ce que vous avez dit … n’est pas juste
  rationale: Dans ce contexte, εὐθύς exprime la rectitude morale ou pratique. Cette formulation française rend λόγος idiomatiquement tout en conservant le jugement porté par Judith.
- source_word: ἐστήσατε τὸν ὅρκον
  choice: vous avez établi … le serment
  rationale: « Établi » conserve l’idée d’instituer solennellement un serment, portée par ἵστημι, sans la tournure peu naturelle « dresser un serment ».
- source_word: ἀνὰ μέσον τοῦ θεοῦ καὶ ὑμῶν
  choice: entre Dieu et vous
  rationale: La traduction garde les deux parties liées par le serment et sa tonalité solennelle.
- source_word: ἐκδώσειν τὴν πόλιν
  choice: vous livreriez la ville
  rationale: « Livrer » exprime clairement la remise de la ville aux ennemis et convient au registre narratif.
- source_word: ἐὰν μὴ ἐν αὐταῖς
  choice: si, durant ces jours-là
  rationale: Le pronom féminin pluriel renvoie vraisemblablement aux journées fixées auparavant; l’ajout explicite de « jours » rend ce renvoi compréhensible en français.
- source_word: ἐπιστρέψῃ ὁ κύριος βοήθειαν ὑμῖν
  choice: le Seigneur ne revenait pas vous secourir
  rationale: La formulation française conserve l’idée de retour portée par ἐπιστρέφω tout en exprimant naturellement le secours destiné aux dirigeants et à la ville.
theological_decisions:
- issue: Traduction de κύριος
  choice: le Seigneur
  alternative: le Maître
  rationale: Dans ce contexte scripturaire juif, κύριος désigne Dieu. « Le Seigneur » est la formulation française usuelle et conserve la portée religieuse du titre.
- issue: Portée de ἐναντίον τοῦ λαοῦ
  choice: contre le peuple
  alternative: devant le peuple
  rationale: 'Le contexte favorise le sens adversatif : la décision dénoncée met le peuple en péril. Toutefois, le sens spatial « devant, en présence de » reste possible et est signalé en note afin de ne pas supprimer l’ambiguïté grecque.'
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct garde une solennité mesurée; les formulations archaïques ou inutilement littérales ont été évitées, tandis que les ambiguïtés réelles du grec sont signalées en note.
