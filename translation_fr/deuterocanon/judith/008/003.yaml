  text: For he happened to be binding the sheaf in the field[a], and the hot wind came upon his head, and he fell onto his bed and died in Bethulia, his city. And they buried him with his fathers in the field between Dothaim and Balamon.
translation:
  language: fr
  text: En effet, il se trouvait dans la plaine, occupé à lier une gerbe, quand le vent brûlant[a] s’abattit sur sa tête. Il tomba sur son lit et mourut à Béthulie, sa ville. On l’enterra avec ses pères dans le champ situé entre Dothaïm et Balamon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la chaleur brûlante ». Le grec καύσων peut désigner soit une chaleur ardente, soit un vent brûlant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτύγγανε … ἐπὶ τοῦ δεσμεύοντος τὸ δράγμα
  choice: il se trouvait … à lier la gerbe
  rationale: Cette formulation rend la circonstance incidente exprimée par ἐτύγγανε et l’action en cours, tout en conservant le singulier de τὸ δράγμα.
- source_word: ἐν τῷ πεδίῳ
  choice: dans la plaine
  rationale: πεδίον désigne ici un terrain plat ou une plaine. Ce choix le distingue de ἀγρός, rendu plus loin par « champ ».
- source_word: ὁ καύσων
  choice: le vent brûlant
  rationale: καύσων peut désigner un vent très chaud ou une chaleur accablante. Le sens météorologique concret est retenu dans le texte, tandis que l’autre possibilité est signalée en note.
- source_word: ἦλθεν ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: s’abattit sur sa tête
  rationale: La tournure française exprime naturellement l’arrivée soudaine du phénomène sur sa tête sans préciser davantage ses effets.
- source_word: ἔπεσεν ἐπὶ τὴν κλίνην
  choice: Il tomba sur son lit
  rationale: Traduction directe qui conserve la vivacité de la succession narrative sans transformer explicitement la chute en malaise.
- source_word: ἐτελεύτησεν
  choice: mourut
  rationale: Rendu direct et digne, sans euphémisme.
- source_word: Βαιτυλουὰ
  choice: Béthulie
  rationale: Forme française traditionnelle et largement reconnue du nom de lieu grec.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: avec ses pères
  rationale: Conserve l’expression familiale et funéraire du grec ainsi que sa résonance biblique, sans la réduire explicitement au sens plus général d’« ancêtres ».
- source_word: ἐν τῷ ἀγρῷ τῷ ἀνὰ μέσον Δωθαεὶμ καὶ Βαλαμών
  choice: dans le champ situé entre Dothaïm et Balamon
  rationale: Rend clairement le lieu de sépulture et la relation spatiale ἀνὰ μέσον, avec des formes françaises lisibles des toponymes.
