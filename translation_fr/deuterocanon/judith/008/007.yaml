  text: And she was very beautiful in appearance and lovely to behold[a]; and Manasseh her husband had left her gold and silver and male servants and female servants and livestock and fields[b], and she remained over them.
translation:
  language: fr
  text: Elle était belle d’aspect et très belle à voir. Manassé, son mari, lui avait laissé de l’or et de l’argent, des serviteurs et des servantes[a], du bétail et des champs, et elle restait à leur tête[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des esclaves, hommes et femmes ». Dans cet inventaire d’un domaine, les termes grecs peuvent désigner des serviteurs ou des esclaves de maison.
    reason: lexical_alternative
  - marker: b
    text: Ou « elle continua d’en avoir la charge ». L’expression grecque peut évoquer la possession de ces biens, leur administration, ou les deux.
    reason: alternative_reading
lexical_decisions:
- source_word: καλὴ τῷ εἴδει
  choice: belle d’apparence
  rationale: L’expression décrit l’attrait physique visible de Judith. Cette formulation reste proche du grec tout en étant claire en français moderne.
- source_word: ὡραία τῇ ὄψει σφόδρα
  choice: très agréable à regarder
  rationale: La tournure conserve l’accent mis sur l’impression visuelle et rend naturellement l’intensité de σφόδρα.
- source_word: ὑπελείπετο αὐτῇ
  choice: lui avait laissé
  rationale: Le plus-que-parfait exprime l’action antérieure du mari défunt sans imposer l’idée plus précise d’un legs testamentaire formel.
- source_word: παῖδας καὶ παιδίσκας
  choice: des serviteurs et des servantes
  rationale: Dans cet inventaire domestique, les termes désignent des dépendants ou membres du personnel de maison, avec une distinction de sexe. Une note conserve la possibilité qu’il s’agisse explicitement d’esclaves.
- source_word: κτήνη
  choice: du bétail
  rationale: Le mot désigne collectivement les animaux domestiques possédés; « bétail » est ici un équivalent français large et courant.
- source_word: ἀγρούς
  choice: des champs
  rationale: Le terme renvoie à des terres, notamment cultivées; « champs » en donne le sens direct.
- source_word: ἔμενεν ἐπ’ αὐτῶν
  choice: elle demeurait à la tête de tout cela
  rationale: Cette formulation garde l’idée de continuité et de position d’autorité, sans trancher entièrement entre possession et administration.
theological_decisions:
- issue: Statut des personnes désignées par παῖδας et παιδίσκας dans l’inventaire du domaine
  choice: des serviteurs et des servantes
  alternative: des esclaves, hommes et femmes
  rationale: Le contexte montre qu’il s’agit de dépendants attachés à la maison ou au domaine, mais ces mots grecs ne déterminent pas à eux seuls, avec une précision absolue, leur statut juridique. Le texte principal reste naturel et la note signale le sens social plus fort possible.
- issue: Portée de l’expression ἔμενεν ἐπ’ αὐτῶν
  choice: elle demeurait à la tête de tout cela
  alternative: elle continua d’en avoir la charge; elle conserva tous ces biens
  rationale: Le grec peut mettre l’accent sur l’autorité, la gestion ou la conservation des biens. La traduction maintient cette légère ambiguïté au lieu de réduire l’expression à une seule nuance.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination ample de la phrase grecque est conservée, tandis que la ponctuation et les formulations restent naturelles. Les deux notes sont placées exactement après les expressions concernées.
