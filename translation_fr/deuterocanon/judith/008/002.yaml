  text: And her husband Manasseh was from her own tribe and her own family line[a]; and he died in the days of the barley harvest.
translation:
  language: fr
  text: Son mari, Manassé, était de la même tribu et de la même lignée familiale qu’elle[a]. Il mourut au temps de la moisson de l’orge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de la même tribu et de la même maison ancestrale qu’elle ». Le grec distingue φυλή (« tribu ») de πατριά, qui désigne un groupe de parenté plus restreint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ αὐτῆς
  choice: son mari
  rationale: Avec le possessif αὐτῆς, ἀνήρ désigne naturellement le mari de Judith, et non simplement un homme.
- source_word: Μανασσης
  choice: Manassé
  rationale: Forme française biblique usuelle du nom propre grec Μανασσης.
- source_word: φυλή
  choice: tribu
  rationale: Dans ce contexte généalogique juif, φυλή désigne une division tribale d’Israël.
- source_word: πατριά
  choice: lignée familiale
  rationale: Le terme désigne un groupe de parenté plus restreint que la tribu et fondé sur l’ascendance; « lignée familiale » l’exprime clairement en français moderne.
- source_word: ἐν ἡμέραις θερισμοῦ κριθῶν
  choice: au temps de la moisson de l’orge
  rationale: Cette formulation française naturelle conserve la valeur temporelle de ἐν ἡμέραις et la précision agricole du génitif κριθῶν.
