base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/024.yaml
  text: Now[a], brothers, let us show our brothers that their life hangs on us[b], and that the holy things and the house and the altar rest on us.
translation:
  language: fr
  text: Maintenant, frères[a], montrons à nos frères que leur vie tient à nous[b], et que les choses saintes, la Maison et l’autel reposent sur nous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « frères et sœurs », si l’adresse est comprise comme inclusive plutôt que comme visant strictement des hommes.
    reason: lexical_alternative
  - marker: b
    text: Ou « leur âme »; ici, le mot désigne très probablement leur vie ou leur survie.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφοί
  choice: frères
  rationale: Le masculin pluriel du grec est conservé dans l’adresse directe. Selon le contexte, il peut toutefois avoir une portée inclusive, possibilité signalée en note.
- source_word: ἐπιδειξώμεθα
  choice: montrons
  rationale: Le subjonctif d’exhortation appelle une démonstration concrète par l’action. « Montrons » est naturel et garde cette force exhortative.
- source_word: ἐξ ἡμῶν κρέμαται
  choice: tient à nous
  rationale: Cette expression française rend la dépendance exprimée par l’image grecque de ce qui est suspendu à quelqu’un, sans recourir à une formulation artificielle comme « est suspendue à nous ».
- source_word: ἡ ψυχὴ αὐτῶν
  choice: leur vie
  rationale: Dans ce contexte de menace collective, ψυχή désigne vraisemblablement la vie ou la survie, plutôt que l’âme immatérielle. Le singulier collectif du grec est maintenu.
- source_word: τὰ ἅγια
  choice: les choses saintes
  rationale: Le neutre pluriel désigne littéralement les choses ou réalités saintes. Cette traduction préserve le pluriel et ne l’assimile pas sans nécessité au sanctuaire, puisque la Maison et l’autel sont ensuite nommés séparément.
- source_word: ὁ οἶκος
  choice: la Maison
  rationale: Le grec dit simplement « la maison »; dans ce contexte cultuel, il s’agit du Temple. La majuscule permet de conserver l’image de la Maison tout en indiquant son emploi comme désignation sacrée.
- source_word: τὸ θυσιαστήριον
  choice: l’autel
  rationale: C’est l’équivalent français courant et précis du terme cultuel grec.
- source_word: ἐπεστήρισται ἐφʼ ἡμῖν
  choice: reposent sur nous
  rationale: Le parfait grec décrit un état présent de soutien ou de dépendance. « Reposent sur nous » conserve l’image et s’accorde avec les trois éléments coordonnés.
theological_decisions:
- issue: Portée du masculin dans l’adresse fraternelle
  choice: frères
  alternative: frères et sœurs
  rationale: La forme masculine plurielle est rendue directement, sans exclure la possibilité qu’elle désigne le groupe de manière inclusive; cette possibilité est conservée en note.
- issue: Sens de ψυχή
  choice: leur vie
  alternative: leur âme
  rationale: Le passage porte sur la survie de la communauté menacée et non sur une définition théologique de l’âme. « Vie » évite donc d’introduire une distinction anthropologique étrangère au propos.
- issue: Référence de τὰ ἅγια
  choice: les choses saintes
  alternative: le sanctuaire
  rationale: Le pluriel grec reste ouvert quant à ses référents précis. Le rendre par « le sanctuaire » résoudrait cette ambiguïté et pourrait confondre ce membre avec la Maison mentionnée ensuite.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La phrase conserve la répétition de « frères », la structure ternaire finale et les images de dépendance du grec, tout en évitant des calques peu naturels.
