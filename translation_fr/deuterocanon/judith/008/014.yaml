  yaml_path: translation/deuterocanon/judith/008/014.yaml
  text: For you will not find the depths of a man's heart[a], nor will you discern the words of his mind. So how will you search out God, who made all these things, and know his mind, and understand his thought? By no means, brothers[b], provoke the Lord our God.
translation:
  language: fr
  text: Car vous ne découvrirez pas la profondeur du cœur d’un être humain[a], et vous ne discernerez pas les pensées de son esprit. Comment donc sonderez-vous Dieu, lui qui a fait toutes ces choses, connaîtrez-vous son esprit et comprendrez-vous sa pensée ? Ne provoquez surtout pas le Seigneur notre Dieu, frères[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie un masculin singulier, au sens générique : « d’un homme » ou « d’un être humain ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « frères et sœurs ». Le grec dit « frères », forme masculine qui peut s’adresser à l’ensemble de la communauté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βάθος καρδίας ἀνθρώπου
  choice: la profondeur du cœur d’un être humain
  rationale: Le singulier βάθος désigne ici la profondeur inaccessible de l’intériorité. « Être humain » rend le sens générique de ἀνθρώπου en français moderne sans limiter l’affirmation aux hommes.
- source_word: εὑρήσετε
  choice: vous ne découvrirez pas
  rationale: Le futur de l’indicatif affirme rhétoriquement l’incapacité humaine. « Découvrir » exprime ici plus naturellement que « trouver » l’accès à une réalité intérieure cachée.
- source_word: λόγους τῆς διανοίας αὐτοῦ
  choice: les paroles de son intelligence
  rationale: Cette formulation conserve la distinction entre λόγους, les paroles ou formulations intérieures, et διάνοια, la faculté de pensée ou d’intelligence, sans réduire l’expression au seul mot « pensées ».
- source_word: διαλήμψεσθε
  choice: vous ne saisirez pas
  rationale: Le verbe évoque une perception ou une compréhension qui discerne et appréhende. « Saisir » convient au contexte de l’intériorité inaccessible.
- source_word: ἐρευνήσετε
  choice: sonder
  rationale: Le verbe indique une recherche approfondie. « Sonder Dieu » est idiomatique, digne et garde l’idée d’examiner jusqu’au fond.
- source_word: ὃς ἐποίησεν τὰ πάντα ταῦτα
  choice: lui qui a fait toutes ces choses
  rationale: La traduction garde le verbe général ποιέω, « faire », ainsi que πάντα ταῦτα, sans préciser indûment « créer ».
- source_word: νοῦν αὐτοῦ
  choice: sa pensée
  rationale: νοῦς désigne ici l’esprit ou la pensée de Dieu. « Sa pensée » est naturel en français et demeure distinct du terme suivant.
- source_word: λογισμὸν αὐτοῦ
  choice: son dessein
  rationale: λογισμός peut désigner le raisonnement, la pensée ou le dessein. Dans cette série, « dessein » permet de distinguer le terme de νοῦς tout en conservant une portée assez large; l’autre possibilité est signalée dans les décisions théologiques.
- source_word: κατανοήσετε
  choice: comprendre
  rationale: « Comprendre » rend clairement l’idée d’appréhender pleinement ou attentivement.
- source_word: μηδαμῶς
  choice: Certainement pas !
  rationale: Cette expression rend l’insistance de l’adverbe négatif autonome dans un français actuel et solennel.
- source_word: ἀδελφοί
  choice: Frères
  rationale: Le vocatif masculin pluriel est rendu directement. Dans ce contexte communautaire, il peut avoir une portée inclusive, précisée en note.
- source_word: μὴ παροργίζετε
  choice: ne provoquez pas la colère
  rationale: La périphrase explicite la valeur causative de παροργίζω, « pousser à la colère », et évite l’ambiguïté française de « provoquer Dieu » employé seul.
theological_decisions:
- issue: Portée générique de ἀνθρώπου
  choice: « d’un être humain » dans le texte
  alternative: « d’un homme »
  rationale: Le propos porte sur l’incapacité humaine en général. En français moderne, « être humain » exprime sans ambiguïté cette portée représentative tout en respectant le singulier grec.
- issue: Portée de l’adresse ἀδελφοί
  choice: « Frères » dans le texte, avec une note sur sa possible portée inclusive
  alternative: « Frères et sœurs »
  rationale: La forme masculine du grec est conservée, tandis que la note préserve l’ambiguïté pragmatique quant à la composition du groupe visé.
- issue: Rapport entre νοῦς et λογισμός appliqués à Dieu
  choice: « sa pensée » et « son dessein »
  alternative: « son intelligence » et « son raisonnement »
  rationale: Le texte affirme l’impossibilité de connaître et de comprendre ce qui relève de l’esprit de Dieu, sans définir précisément s’il s’agit de son raisonnement, de son intention ou de son plan. « Dessein » garde cette amplitude, sans en faire explicitement un décret théologique.
- issue: Force rhétorique de la question sur Dieu
  choice: « Comment donc pourriez-vous… ? »
  alternative: « Comment donc sonderez-vous… ? »
  rationale: Le conditionnel français fait ressortir l’impossibilité logique déduite de la limite humaine décrite auparavant, sans modifier le sens de la forme grecque au futur.
translation_notes:
  register: 'Français international moderne, digne et oralement fluide. La phrase conserve la progression du grec : incapacité à pénétrer l’intériorité humaine, question a fortiori concernant Dieu, puis avertissement solennel. Les deux notes rendent visibles les nuances de genre grammatical et de portée inclusive.'
