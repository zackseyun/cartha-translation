  to: Car vous ne découvrirez pas la profondeur du cœur d’un être humain[a], et vous ne discernerez pas les pensées de son esprit. Comment donc sonderez-vous Dieu, lui qui a fait toutes ces choses, connaîtrez-vous son esprit et comprendrez-vous sa pensée ? Ne provoquez surtout pas le Seigneur notre Dieu, frères[b].
