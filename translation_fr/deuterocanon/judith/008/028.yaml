  text: And Ozias said to her[a], “Everything you have said, you have spoken with a good heart, and there is no one who will oppose your words.”
translation:
  language: fr
  text: 'Ozias lui dit : « Tout ce que tu as dit, tu l’as exprimé avec un cœur droit[a], et personne ne s’opposera à tes paroles. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec un bon cœur » ; cette expression évoque ici une intention droite ou sincère.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαθῇ καρδίᾳ
  choice: avec un cœur droit
  rationale: 'Cette formulation conserve l’image grecque du cœur et rend sa portée morale et dispositionnelle : Judith a parlé avec droiture et sincérité, et non simplement avec habileté.'
- source_word: ἐλάλησας
  choice: tu l’as exprimé
  rationale: Le verbe est distingué de εἶπας (« tu as dit ») afin d’éviter une répétition pesante en français tout en gardant l’idée de paroles effectivement prononcées.
- source_word: ἀντιστήσεται
  choice: s’opposera
  rationale: Ce verbe français naturel restitue l’idée de résister ou de se dresser contre les paroles de Judith.
- source_word: τοῖς λόγοις σου
  choice: à tes paroles
  rationale: Le pluriel concret du grec est conservé, avec une tournure française claire et digne.
- source_word: Πάντα ὅσα εἶπας
  choice: Tout ce que tu as dit
  rationale: Cette traduction rend directement la portée exhaustive de l’expression grecque dans un français moderne.
- source_word: Ὀζείας
  choice: Ozias
  rationale: Le nom suit la forme grecque transmise dans Judith et son usage français traditionnel.
