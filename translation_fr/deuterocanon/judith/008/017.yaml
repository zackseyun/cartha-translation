  text: Therefore[a], while we wait for the salvation that comes from him, let us call on him to help us, and he will hear our voice[b], if it is pleasing to him.
translation:
  language: fr
  text: C’est pourquoi, dans l’attente du salut qui vient de lui, faisons appel à lui pour qu’il nous vienne en aide, et il entendra notre voix[a], si cela lui est agréable.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il entendra notre voix » ; le verbe peut aussi suggérer qu’il accueillera favorablement notre appel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διόπερ
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conclusion tirée de l’argument précédent.
- source_word: ἀναμένοντες
  choice: dans l’attente
  rationale: Rend le participe circonstanciel et son idée d’attente persistante, avec une tournure française fluide.
- source_word: σωτηρίαν τὴν παρ’ αὐτοῦ
  choice: du salut qui vient de lui
  rationale: « Salut » conserve la portée théologique de σωτηρία, tandis que la relative exprime clairement l’origine indiquée par παρά avec le génitif.
- source_word: ἐπικαλεσώμεθα αὐτόν
  choice: faisons appel à lui
  rationale: Rend le subjonctif d’exhortation à la première personne et l’idée d’invocation dans un français actuel.
- source_word: εἰς βοήθειαν ἡμῶν
  choice: pour qu’il nous vienne en aide
  rationale: Exprime idiomatiquement le but de l’appel sans perdre la notion de secours.
- source_word: εἰσακούσεται τῆς φωνῆς ἡμῶν
  choice: il écoutera notre voix
  rationale: Le verbe implique ici une écoute favorable; « notre voix » maintient l’image explicite du grec.
- source_word: ἐὰν ἦν αὐτῷ ἀρεστόν
  choice: si cela lui est agréable
  rationale: Préserve la condition et la déférence envers ce qui plaît à Dieu, sans résoudre ce que reprend précisément « cela ».
theological_decisions:
- issue: Portée de σωτηρία dans un récit de délivrance collective
  choice: salut
  alternative: délivrance
  rationale: Le contexte inclut un secours concret face au danger, mais « salut » conserve l’ampleur de l’action salvatrice divine portée par le terme grec.
- issue: Condition attachée à l’écoute divine
  choice: si cela lui est agréable
  alternative: s’il le juge bon
  rationale: La formulation choisie reste proche de ἀρεστόν et maintient la tension du texte entre l’assurance de l’appel et la souveraine volonté de Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. L’exhortation collective est conservée; les formulations trop archaïques comme « invoquons-le afin qu’il nous secoure » ont été évitées.
