  text: Then Uzziah and the rulers said to her[a], “Go in peace, and may the Lord God go before you for vengeance on our enemies.”
translation:
  language: fr
  text: 'Alors Ozias et les chefs lui dirent : « Va en paix, et que le Seigneur Dieu marche devant toi pour tirer vengeance de nos ennemis[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour obtenir justice contre nos ennemis ». Le terme grec peut désigner une action de vengeance ou le rétablissement du droit ; ici, le contexte de guerre favorise l’idée de vengeance.'
    reason: Alternative lexicale préservant l’étendue de sens de ἐκδίκησις.
lexical_decisions:
- source_word: εἶπεν
  choice: dirent
  rationale: Le verbe narratif courant est rendu naturellement au pluriel en français, conformément au sujet composé « Ozias et les chefs ».
- source_word: Ὀζίας
  choice: Ozias
  rationale: « Ozias » est la forme française biblique traditionnelle correspondant au grec Ὀζίας.
- source_word: οἱ ἄρχοντες
  choice: les chefs
  rationale: Le terme désigne des personnes investies d’autorité ; « chefs » reste naturel et n’impose pas une fonction administrative trop précise.
- source_word: Πορεύου
  choice: Va
  rationale: Cet impératif de mouvement appelle une formulation directe et idiomatique.
- source_word: εἰς εἰρήνην
  choice: en paix
  rationale: Cette formule de départ ou de bénédiction se rend naturellement par « en paix », sans la réduire à la seule idée de sécurité.
- source_word: Κύριος ὁ θεὸς
  choice: le Seigneur Dieu
  rationale: La traduction suit explicitement le titre grec, sans ajouter de possessif ni réintroduire le tétragramme absent du texte grec.
- source_word: ἔμπροσθέν σου
  choice: marche devant toi
  rationale: L’expression signifie littéralement « devant toi » ; le verbe « marche » explicite le mouvement sous-entendu et convient à l’image de Dieu précédant Judith.
- source_word: εἰς ἐκδίκησιν
  choice: pour tirer vengeance
  rationale: Dans ce contexte de conflit et de délivrance militaire, l’expression conserve la force punitive de ἐκδίκησις tout en restant idiomatique en français.
- source_word: τῶν ἐχθρῶν ἡμῶν
  choice: de nos ennemis
  rationale: Avec l’expression française « tirer vengeance de », le génitif grec est rendu de façon naturelle, les ennemis étant ceux contre qui s’exerce la vengeance.
theological_decisions:
- issue: Traduction de κύριος dans un texte grec deutérocanonique
  choice: le Seigneur
  alternative: l’Éternel ; le SEIGNEUR ; le Maître
  rationale: « Le Seigneur » traduit directement κύριος et évite d’introduire explicitement le nom divin là où le texte grec porte un titre.
- issue: Portée de ἐκδίκησις
  choice: tirer vengeance
  alternative: obtenir justice ; assurer la réparation
  rationale: Le contexte militaire favorise l’idée d’une action punitive contre les ennemis. La note signale néanmoins que le mot grec peut aussi évoquer la justice rendue ou la justification.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du grec tout en étant fluide ; « marche devant toi » conserve l’image de la présence divine qui précède Judith.
