- from: 'Judith leur dit : « Écoutez-moi[a]. J’accomplirai un acte qui parviendra, de génération en génération[b], aux fils de notre peuple[c]. »'
  to: 'Judith leur dit : « Écoutez-moi[a]. J’accomplirai un acte dont la portée atteindra, de génération en génération[b], les fils de notre peuple[c]. »'
  rationale: La révision remplace une personnification syntaxiquement maladroite en français par « dont la portée atteindra », qui explicite seulement la conséquence durable déjà portée par la construction grecque. Le masculin « fils » et l’ambiguïté de sa valeur collective sont maintenus. La note sur l’expression générationnelle est légèrement ajustée pour une littéralité plus exacte.
