  text: And Judith said to them[a], “Listen to me[c][b], and I will do a deed that will reach to generation after generation among the sons of our people.”
translation:
  language: fr
  text: 'Judith leur dit : « Écoutez-moi[a]. J’accomplirai un acte dont la portée atteindra, de génération en génération[b], les fils de notre peuple[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Entendez-moi ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans les générations des générations » ; cette expression évoque une portée durable à travers les générations successives.'
    reason: lexical_alternative
  - marker: c
    text: '« Fils » peut avoir ici un sens collectif : « enfants » ou « descendants de notre peuple ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσατέ μου
  choice: Écoutez-moi
  rationale: L’impératif de ἀκούω appelle ici une écoute attentive. « Écoutez-moi » est naturel en français moderne et convient au discours direct.
- source_word: ποιήσω πρᾶγμα
  choice: J’accomplirai un acte
  rationale: πρᾶγμα désigne ici une action concrète que Judith s’apprête à entreprendre. « Accomplir un acte » rend l’expression avec naturel et dignité, sans préciser abusivement la nature de l’action.
- source_word: ἀφίξεται
  choice: qui parviendra
  rationale: Le futur de ἀφικνέομαι signifie littéralement « arriver » ou « parvenir ». « Parviendra » conserve l’image d’un acte dont la portée atteint les générations futures.
- source_word: εἰς γενεὰς γενεῶν
  choice: de génération en génération
  rationale: Cette tournure française idiomatique conserve la répétition et exprime une portée durable à travers les générations successives.
- source_word: υἱοῖς τοῦ γένους ἡμῶν
  choice: aux fils de notre peuple
  rationale: υἱοῖς est explicitement masculin pluriel, tandis que γένος désigne ici le groupe d’appartenance ou le peuple. La traduction garde « fils » dans le texte et signale en note sa possible valeur collective.
theological_decisions:
- issue: Valeur collective de υἱοῖς τοῦ γένους ἡμῶν
  choice: aux fils de notre peuple
  alternative: aux enfants de notre peuple / aux descendants de notre peuple
  rationale: Le grec emploie le masculin pluriel « fils », qui peut toutefois désigner collectivement les membres ou descendants du peuple. Le texte principal préserve la forme du grec, et la note maintient ouverte la portée collective.
- issue: Portée temporelle de εἰς γενεὰς γενεῶν
  choice: de génération en génération
  alternative: jusqu’aux générations des générations
  rationale: La traduction idiomatique française exprime la succession durable sans transformer l’expression en une durée précisément délimitée; la formulation littérale est donnée en note.
translation_notes:
  register: Français international moderne, direct et digne. La phrase est divisée en deux pour rendre naturellement la prise de parole de Judith. « Parviendra » conserve la métaphore spatiale du grec, tandis que les notes rendent visibles les principales ambiguïtés lexicales.
