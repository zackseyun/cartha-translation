    issue: Construction française peu naturelle de « un acte qui parviendra ... aux fils »
    rationale: Le grec peut présenter l’action comme « atteignant » les générations, mais en français un acte ne « parvient » pas naturellement à des personnes. « Dont la portée atteindra » préserve l’idée d’un effet durable sans surinterpréter l’action.
  - severity: low
    issue: 'Note b : « jusqu’aux générations des générations » n’est pas la formulation la plus strictement littérale'
    rationale: εἰς exprime ici l’extension vers/dans les générations à venir ; « dans les générations des générations » rend plus directement les éléments grecs, tout en laissant l’explication idiomatique dans la note.
