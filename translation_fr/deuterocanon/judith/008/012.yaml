base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/012.yaml
  text: And now[a], who are you, that you have put God to the test this day[b], and have set yourselves above God among the sons of men?
translation:
  language: fr
  text: Et maintenant, qui êtes-vous donc, vous qui, aujourd’hui, avez mis Dieu à l’épreuve et qui vous vous tenez à la place de Dieu[a] parmi les humains ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est elliptique et très condensé. On peut aussi comprendre : « qui intervenez pour Dieu parmi les humains » ou « qui prétendez parler au nom de Dieu parmi les humains ».'
    reason: alternative_reading
lexical_decisions:
- source_word: τίνες ἐστὲ ὑμεῖς
  choice: qui êtes-vous donc
  rationale: La tournure constitue une vive interpellation rhétorique. « Donc » en restitue la force sans aller jusqu’à l’expansion interprétative « pour qui vous prenez-vous ? ».
- source_word: ἐπειράσατε
  choice: avez mis Dieu à l’épreuve
  rationale: Dans ce reproche, πειράζω désigne le fait de soumettre Dieu à une épreuve de manière présomptueuse, non de l’inciter au mal.
- source_word: ἐν τῇ ἡμέρᾳ τῇ σήμερον
  choice: aujourd’hui
  rationale: Le français actuel exprime naturellement cette indication temporelle emphatique par « aujourd’hui » ; sa mise en relief entre virgules conserve l’insistance du grec.
- source_word: ὑπεῖρ τοῦ θεοῦ
  choice: vous êtes placés au-dessus de Dieu
  rationale: Cette formulation suit au plus près la valeur comparative possible de la locution transmise, tout en laissant en note l’autre compréhension, « au nom de Dieu », permise par ὑπέρ et par la construction elliptique.
- source_word: ἐν μέσῳ υἱῶν ἀνθρώπων
  choice: parmi les humains
  rationale: L’expression littérale « parmi les fils des hommes » est un sémitisme qui désigne l’humanité mortelle. « Parmi les humains » en communique clairement le sens en français moderne.
theological_decisions:
- issue: Portée du reproche concernant la prérogative divine
  choice: Judith leur reproche de s’être placés au-dessus de Dieu en lui imposant une épreuve.
  alternative: Judith leur reproche de prétendre parler ou agir au nom de Dieu parmi les humains.
  rationale: Le grec est condensé et la forme transmise admet plus d’une analyse. Le texte principal conserve la lecture comparative directe, tandis que la note signale honnêtement la lecture représentative sans trancher silencieusement la tension.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’interpellation conserve sa vigueur rhétorique ; le sémitisme « fils des hommes » est rendu par son sens courant, tandis que l’ambiguïté de la dernière proposition est documentée en note.
