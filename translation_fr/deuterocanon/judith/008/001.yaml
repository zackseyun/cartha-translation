revisions:
- from: En ces jours-là, Judith apprit la nouvelle[a]. Elle était fille de Merari, fils d’Ox, fils de Joseph, fils d’Oziel, fils d’Elkéia, fils d’Éliou, fils de Chelkéios, fils d’Éléab, fils de Nathanaël, fils de Salamiël, fils de Sarasadaï, fils d’Israël.
  to: En ces jours-là, Judith, fille de Merari, fils d’Ox, fils de Joseph, fils d’Oziel, fils d’Elkéia, fils d’Éliou, fils de Chelkéias, fils d’Éléab, fils de Nathanaël, fils de Salamiël, fils de Sarasadaï, fils d’Israël, entendit.
  rationale: La révision supprime l’objet ajouté à « entendit », conserve la syntaxe généalogique appositive du grec et corrige la translittération de Chelkéias. La note ne prétend plus que « entendit » est une traduction littérale tout en étant attachée à ce mot ; elle est supprimée du texte révisé, car la remarque sur les noms ne dispose pas d’un ancrage approprié dans ce verset sans surcharger la chaîne généalogique.
