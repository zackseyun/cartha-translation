translation_notes:
  register: Français moderne, digne et narratif. La très longue chaîne généalogique est conservée, mais divisée en une seconde phrase afin d’éviter que le verbe « apprit » reste artificiellement suspendu. Les noms sont francisés à partir des formes grecques avec accents utiles à la lecture.
