  text: And in those days Judith heard[a], the daughter of Merari son of Ox son of Joseph son of Oziel son of Elkiah son of Eliou son of Chelkias son of Eliab son of Nathanael son of Salamiel son of Sarasadai son of Israel.
translation:
  language: fr
  text: En ces jours-là, Judith, fille de Merari, fils d’Ox, fils de Joseph, fils d’Oziel, fils d’Elkéia, fils d’Éliou, fils de Chelkéias, fils d’Éléab, fils de Nathanaël, fils de Salamiël, fils de Sarasadaï, fils d’Israël, entendit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  choice: apprit la nouvelle
  rationale: Le verbe signifie littéralement « entendit ». Comme son objet est fourni par le contexte précédent plutôt que dans ce verset, « apprit la nouvelle » exprime naturellement en français qu’une information parvint à Judith, sans en préciser ici le contenu.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: En ces jours-là
  rationale: Rend directement la formule temporelle grecque tout en conservant sa cadence narrative biblique, claire en français moderne.
- source_word: θυγάτηρ
  choice: fille de
  rationale: Conserve la désignation généalogique explicite.
- source_word: υἱοῦ
  choice: fils de
  rationale: La répétition de la formule généalogique est explicite dans le grec; elle est maintenue plutôt que remplacée par « descendant de ».
- source_word: Ἰουδεὶθ
  choice: Judith
  rationale: Forme française traditionnelle et courante du nom.
- source_word: Μεραρὶ / Ὢξ / Ἰωσὴφ / Ὀζιὴλ / Ἐλκεία / Ἠλειοὺ / Χελκείου / Ἐλεὰβ / Ναθαναὴλ / Σαλαμιὴλ / Σαρασαδαὶ / Ἰσραήλ
  choice: Merari / Ox / Joseph / Oziel / Elkéia / Éliou / Chelkéios / Éléab / Nathanaël / Salamiël / Sarasadaï / Israël
  rationale: Les noms suivent au plus près les formes du témoin grec, avec une graphie adaptée au français, plutôt que d’être systématiquement rétrovertis en formes hébraïques supposées. Les formes françaises solidement établies, comme Joseph, Nathanaël et Israël, sont conservées.
