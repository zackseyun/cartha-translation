review_pass:
  verdict: revise
  source_fidelity: « apprit la nouvelle » introduit un objet (« la nouvelle ») qui n’est pas exprimé dans le grec de ce verset. Il convient de rendre ἤκουσεν sans le compléter. La forme « Chelkéios » ne rend pas correctement le nom transmis au génitif Χελκείου ; « Chelkéias » restitue de façon cohérente le nom grec (cf. angl. Chelkias).
  naturalness: 'La longue apposition généalogique peut être conservée en français dans une seule phrase : Judith est ainsi explicitement présentée comme la fille de Merari, sans que cette information devienne une seconde assertion autonome. Le verbe final reste grammatical et d’un registre biblique sobre.'
  terminology: Les désignations « fille de » et « fils de » préservent la formulation généalogique répétée du grec. Les noms suivent les formes grecques francisées, sans rétroversion systématique en formes hébraïques plus familières.
  issues:
  - severity: medium
    issue: Ajout de « la nouvelle » après « apprit »
    rationale: Ἤκουσεν est employé sans objet exprimé dans ce verset. Même si le contexte fournit ce qui a été entendu, l’ajout explicite dépasse le texte source.
  - severity: medium
    issue: Forme « Chelkéios »
    rationale: Le grec Χελκείου est une forme fléchie dans la chaîne généalogique ; la restitution française cohérente du nom est « Chelkéias », non « Chelkéios ».
  - severity: low
    issue: Découpage en deux phrases avec « Elle était fille de »
    rationale: Cette formulation est intelligible, mais affaiblit la construction appositionnelle du grec et rattache moins directement la généalogie à Judith.
  revised_text: En ces jours-là, Judith, fille de Merari, fils d’Ox, fils de Joseph, fils d’Oziel, fils d’Elkéia, fils d’Éliou, fils de Chelkéias, fils d’Éléab, fils de Nathanaël, fils de Salamiël, fils de Sarasadaï, fils d’Israël, entendit.
  revised_footnotes:
  - marker: a
    text: Plusieurs noms de la généalogie de Judith sont des formes grecques de noms mieux connus dans la tradition hébraïque ; Oziel peut notamment correspondre à Ouzziel, et Sarasadaï à Sourishaddaï. Le texte suit ici le témoin grec plutôt que de reconstituer les formes hébraïques.
    reason: Variantes de translittération des noms propres.
  revision_rationale: La révision supprime l’objet ajouté à « entendit », conserve la syntaxe généalogique appositive du grec et corrige la translittération de Chelkéias. La note ne prétend plus que « entendit » est une traduction littérale tout en étant attachée à ce mot ; elle est supprimée du texte révisé, car la remarque sur les noms ne dispose pas d’un ancrage approprié dans ce verset sans surcharger la chaîne généalogique.
