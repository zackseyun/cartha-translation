  text: And there was no one who brought an evil word against her, because she feared God greatly.
translation:
  language: fr
  text: Personne ne proférait contre elle de parole malveillante, car elle craignait grandement Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἦν ὃς ἐπήνεγκεν αὐτῇ
  choice: Personne ne pouvait lui reprocher
  rationale: La tournure grecque signifie littéralement qu’il n’y avait personne qui portât contre elle une accusation ou un grief. Cette formulation française naturelle conserve la portée judiciaire ou sociale possible de ἐπιφέρω avec le datif.
- source_word: ῥῆμα πονηρόν
  choice: la moindre mauvaise parole
  rationale: ῥῆμα désigne une parole, une déclaration ou un grief; πονηρόν la qualifie de mauvaise. «La moindre» rend idiomatiquement la négation absolue du contexte sans transformer la parole en conduite.
- source_word: ἐφοβεῖτο τὸν θεὸν σφόδρα
  choice: elle craignait profondément Dieu
  rationale: «Craindre Dieu» conserve le langage biblique de révérence et d’obéissance, tandis que «profondément» exprime l’intensité de σφόδρα dans un français actuel.
theological_decisions:
- issue: Sens de la crainte de Dieu
  choice: craignait profondément Dieu
  alternative: avait un très profond respect pour Dieu
  rationale: Le verbe φοβέομαι garde ici la notion biblique de crainte révérencielle. La traduction retenue préserve cette tension plutôt que de la réduire au seul respect.
translation_notes:
  register: Français international moderne, clair et digne. La phrase privilégie une formulation naturelle tout en conservant explicitement «mauvaise parole» et «craignait Dieu».
