  yaml_path: translation/deuterocanon/judith/008/033.yaml
  text: You stand at the gate tonight, and I will go out with my maidservant; and within the days after which you said you would hand over the city to our enemies, the Lord will visit Israel by my hand.
translation:
  language: fr
  text: Vous vous tiendrez à la porte cette nuit, et moi, je sortirai avec ma servante ; durant les jours au terme desquels vous avez dit que vous livreriez la ville à nos ennemis, le Seigneur visitera Israël par ma main.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στήσεσθε
  choice: vous vous tiendrez
  rationale: Le futur grec exprime ici l’instruction donnée aux responsables; la tournure française reste directe et naturelle.
- source_word: ἅβρας
  choice: servante
  rationale: Désigne une servante attachée personnellement à Judith; « servante » est clair et actuel, sans surinterpréter son statut.
- source_word: ἐν ταῖς ἡμέραις μεθʼ ἃς
  choice: avant la fin du délai au terme duquel
  rationale: Cette formulation rend idiomatiquement la limite temporelle indiquée par les jours fixés, sans donner à entendre que l’action se produira après leur expiration.
- source_word: παραδῶσειν
  choice: livreriez
  rationale: Rend l’idée de remettre la ville au pouvoir de l’ennemi.
- source_word: ἐπισκέψεται
  choice: interviendra en faveur de
  rationale: Dans ce contexte, le verbe évoque une visitation divine active et bienveillante; « interviendra en faveur de » communique le sens sans l’opacité de « visitera ».
- source_word: ἐν χειρί μου
  choice: par ma main
  rationale: Conserve l’image biblique de la main comme moyen d’action, importante dans le récit de Judith.
theological_decisions:
- issue: Nature et moyen de l’intervention divine
  choice: le Seigneur interviendra en faveur d’Israël par ma main
  alternative: le Seigneur visitera Israël par ma main
  rationale: Le choix explicite la valeur favorable de ἐπισκέπτομαι dans le contexte tout en maintenant la tension entre l’action souveraine du Seigneur et l’action instrumentale de Judith.
translation_notes:
  register: Français moderne, digne et narratif. La syntaxe temporelle grecque, peu naturelle si elle est calquée, est clarifiée sans fixer le moment exact de l’intervention à l’intérieur du délai. L’image « par ma main » est volontairement conservée.
