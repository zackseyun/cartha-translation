base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/009.yaml
  text: And she heard the evil words of the people against the ruler[a], because they had lost heart over the shortage of water; and she heard all the words that Ozias had spoken to them, that he had sworn to hand over the city to the Assyrians after five days.
translation:
  language: fr
  text: Judith entendit les propos malveillants que le peuple tenait contre le chef, car ils avaient perdu courage à cause de la pénurie d’eau. Elle entendit aussi tout ce qu’Ozias leur avait dit, lui qui leur avait juré de livrer la ville[a] aux Assyriens au bout de cinq jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « remettre la ville aux Assyriens ». Le verbe grec signifie littéralement « livrer » ou « remettre » et peut, dans ce contexte, évoquer la reddition de la ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥήματα … τὰ πονηρά
  choice: les mauvais propos
  rationale: Cette expression conserve l’évaluation morale négative du grec tout en désignant naturellement des paroles prononcées.
- source_word: ἐπὶ τὸν ἄρχοντα
  choice: contre le chef
  rationale: « Contre » rend l’orientation hostile des propos, et « chef » reste assez général pour ne pas attribuer au personnage une fonction politique plus précise que le grec.
- source_word: ὠλιγοψύχησαν
  choice: avaient perdu courage
  rationale: Le verbe exprime l’abattement ou le découragement; cette tournure idiomatique en restitue clairement la force affective.
- source_word: ἐπὶ τῇ σπάνει τῶν ὑδάτων
  choice: à cause du manque d’eau
  rationale: La construction indique ici la cause du découragement; le singulier collectif « eau » est naturel en français.
- source_word: πάντας τοὺς λόγους
  choice: tout ce que … avait dit
  rationale: Cette formulation française naturelle exprime la totalité des paroles sans la lourdeur de « toutes les paroles » dans cette phrase.
- source_word: ὤμοσεν
  choice: avait juré
  rationale: Le choix conserve explicitement la valeur de serment, importante dans le récit.
- source_word: παραδώσειν
  choice: livrer
  rationale: « Livrer » rend le fait de remettre la ville au pouvoir des Assyriens sans imposer exclusivement le vocabulaire technique d’une capitulation.
- source_word: μετὰ ἡμέρας πέντε
  choice: au bout de cinq jours
  rationale: Avec l’accusatif, μετά marque ici le terme d’une période de cinq jours; « au bout de » est précis et idiomatique.
theological_decisions:
- issue: Position du nom de Judith dans la phrase
  choice: Nommer Judith dès le début du verset, puis reprendre par « elle »
  alternative: 'Conserver l’ordre grec : « Elle entendit… et Judith entendit… »'
  rationale: Le grec place le nom Ἰουδεὶθ tardivement comme sujet commun des deux verbes. L’antéposer évite en français une répétition maladroite et clarifie immédiatement le sujet, sans modifier son rôle narratif.
- issue: Portée du serment d’Ozias
  choice: « lui qui leur avait juré de livrer la ville »
  alternative: « qu’il leur avait juré qu’il livrerait la ville »
  rationale: La construction retenue suit le relatif grec et maintient le lien entre Ozias et son serment, sans résoudre davantage la nuance narrative ou morale de son engagement.
translation_notes:
  register: Français international moderne, sobre et narratif. La phrase grecque très longue est divisée en deux pour la lisibilité, tout en conservant l’enchaînement des informations et la gravité du serment.
