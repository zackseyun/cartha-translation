  terminology: « Chef » demeure un équivalent général et approprié de ἄρχων. « Perdu courage », « pénurie d’eau », « juré » et « livrer la ville » conservent les éléments narratifs et sémantiques importants, sans surinterprétation militaire ou théologique.
