base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/018.yaml
  text: For in our generations no tribe or clan or people or city has arisen from among us that worships gods made by hands[a], as happened in former days; nor is there any even to this day.
translation:
  language: fr
  text: Car, au fil de nos générations, il ne s’est élevé parmi nous aucune tribu, aucun clan, aucun peuple ni aucune ville qui adore des dieux faits de mains humaines[a], comme cela arriva autrefois ; et il n’en existe pas non plus aujourd’hui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des idoles fabriquées par des humains ». Le grec dit littéralement « des dieux faits de mains », expression polémique désignant les idoles.
    reason: Alternative lexicale et explicitation de l’expression grecque.
lexical_decisions:
- source_word: ἀνέστη
  choice: il ne s’est élevé
  rationale: L’aoriste de ἀνίστημι désigne ici l’apparition ou l’émergence d’un groupe au sein du peuple, non une résurrection. « S’élever » conserve l’image grecque tout en restant intelligible.
- source_word: ἐν ταῖς γενεαῖς ἡμῶν
  choice: au cours de nos générations
  rationale: Le pluriel évoque les générations successives du peuple. « Au cours de » exprime naturellement l’étendue temporelle.
- source_word: φυλὴ οὔτε πατριὰ οὔτε δῆμος οὔτε πόλις
  choice: aucune tribu, aucun clan, aucun peuple ni aucune ville
  rationale: 'Cette série garde les différentes unités sociales du grec : tribu, groupe de parenté, population et cité. La variation « aucun/aucune… ni » produit une négation française naturelle.'
- source_word: ἐξ ἡμῶν
  choice: parmi nous
  rationale: L’expression indique une origine interne au peuple de la locutrice.
- source_word: οἱ προσκυνοῦσι
  choice: qui adore
  rationale: Avec des divinités comme complément, προσκυνέω a ici le sens religieux d’adorer. Le singulier s’accorde avec la série négative comprise distributivement.
- source_word: θεοῖς χειροποιήτοις
  choice: des dieux faits de main humaine
  rationale: Cette formulation conserve l’expression polémique littérale « dieux faits de main », tout en précisant idiomatiquement en français qu’il s’agit de mains humaines.
- source_word: καθάπερ ἐγένετο ἐν ταῖς πρότερον ἡμέραις
  choice: comme cela s’était produit autrefois
  rationale: Le plus-que-parfait marque clairement l’antériorité des jours anciens par rapport à la période évoquée, sans alourdir la phrase.
- source_word: οὐδὲ ἔστιν ἐν τῇ ἡμέρᾳ τῇ σήμερον
  choice: et il n’en existe pas non plus aujourd’hui
  rationale: La formulation préserve la coordination négative et l’insistance explicite sur le présent.
theological_decisions:
- issue: Expression anti-idolâtrique θεοῖς χειροποιήτοις
  choice: des dieux faits de main humaine
  alternative: des idoles fabriquées par des humains
  rationale: Le texte grec dit littéralement « dieux faits de main ». Le texte principal conserve cette ironie polémique et laisse en note l’interprétation explicite « idoles ».
translation_notes:
  register: Français international moderne, digne et accessible. La structure ample de la phrase grecque est conservée, avec une ponctuation qui distingue l’affirmation historique de son renforcement concernant le présent.
