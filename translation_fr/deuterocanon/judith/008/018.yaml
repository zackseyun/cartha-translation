review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : la négation porte sur chacune des unités sociales issues du peuple, leur culte de divinités « faites de mains », le contraste avec les temps anciens et la confirmation pour le présent. Une légère révision améliore l’idiomaticité sans perdre l’image de ἀνέστη ni la littéralité polémique de χειροποίητοι.'
  naturalness: « Au cours de nos générations » est compréhensible mais peu naturel en français moderne dans ce contexte. « Au fil de nos générations » exprime plus souplement la succession des générations. « Faits de main humaine » est également moins idiomatique que « faits de mains humaines ». Le passé simple dans « comme cela arriva autrefois » convient au registre narratif soutenu et évite le plus-que-parfait, qui ajoute une relation temporelle plus marquée que le grec ne l’exige.
  terminology: « Tribu », « clan », « peuple » et « ville » rendent convenablement φυλή, πατριά, δῆμος et πόλις. « Adore » est approprié pour προσκυνοῦσι avec θεοῖς. La formulation principale conserve avec justesse « dieux » plutôt que l’interprétation « idoles », celle-ci étant proposée en note.
  issues:
