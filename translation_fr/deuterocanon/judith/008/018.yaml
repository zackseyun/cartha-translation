    issue: Expression temporelle légèrement maladroite
    rationale: « Au cours de nos générations » est un calque un peu lourd de ἐν ταῖς γενεαῖς ἡμῶν. « Au fil de nos générations » est plus naturel tout en gardant l’idée de générations successives.
  - severity: low
    issue: Formulation de l’expression χειροποίητοι
    rationale: « Faits de main humaine » est possible, mais « faits de mains humaines » est plus idiomatique et conserve la référence explicite aux mains du grec.
  - severity: low
    issue: Plus-que-parfait non requis
    rationale: « S’était produit » suggère une antériorité particulière par rapport à la période déjà désignée. Le grec dit simplement que cela arriva dans les jours d’autrefois; le passé simple le rend sans surinterprétation.
