  rationale: La révision est stylistique et idiomatique. Elle maintient la structure négative, l’émergence interne « parmi nous », les quatre catégories sociales, l’expression littérale et polémique « dieux faits de mains », ainsi que l’affirmation qu’aucun tel groupe n’existe aujourd’hui. Aucun changement de sens ni ajout doctrinal n’est apporté.
