- from: Car, au cours de nos générations, il ne s’est élevé parmi nous aucune tribu, aucun clan, aucun peuple ni aucune ville qui adore des dieux faits de main humaine[a], comme cela s’était produit autrefois; et il n’en existe pas non plus aujourd’hui.
