  text: And now pray for us[a], because you are a devout woman, and the Lord will send rain to fill our cisterns, and we will not perish any longer.
translation:
  language: fr
  text: Et maintenant, prie pour nous, puisque tu es une femme dévouée à Dieu, et le Seigneur enverra la pluie pour remplir nos citernes, et nous ne serons plus démunis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « nous ne ferons plus défaut ». Le verbe peut désigner le fait de manquer, de s’épuiser ou de disparaître; dans ce contexte, il peut évoquer la fin de la pénurie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεήθητι περὶ ἡμῶν
  choice: prie pour nous
  rationale: L’impératif exprime ici une demande d’intercession. « Prie pour nous » est direct, naturel et fidèle à l’usage de περί avec un verbe de prière.
- source_word: γυνὴ εὐσεβὴς
  choice: une femme qui respecte Dieu
  rationale: εὐσεβής qualifie une personne animée de révérence et de dévotion envers Dieu. Cette formulation est claire en français courant et évite les connotations parfois étroites de « pieuse ».
- source_word: ἀποστελεῖ Κύριος τὸν ὑετόν
  choice: le Seigneur enverra la pluie
  rationale: Le futur est conservé, et Κύριος est rendu par le titre scripturaire usuel « le Seigneur ».
- source_word: εἰς πλήρωσιν τῶν λάκκων ἡμῶν
  choice: pour remplir nos citernes
  rationale: Dans le contexte d’une sécheresse, λάκκοι désigne vraisemblablement des fosses aménagées pour recueillir et conserver l’eau, donc des « citernes ».
- source_word: οὐκ ἐκλείψομεν ἔτι
  choice: nous ne manquerons plus d’eau
  rationale: ἐκλείπω peut signifier manquer, s’épuiser ou faire défaut. Le contexte des citernes rend explicite le manque d’eau, tout en conservant en note la formulation plus littérale et l’ambiguïté du grec.
theological_decisions:
- issue: Traduction de Κύριος
  choice: le Seigneur
  alternative: Seigneur
  rationale: L’article français donne une expression naturelle et préserve le titre divin du texte grec sans y introduire le tétragramme.
- issue: Degré de certitude exprimé par ἀποστελεῖ
  choice: le Seigneur enverra
  alternative: que le Seigneur envoie
  rationale: Le grec emploie un futur affirmatif plutôt qu’un souhait ou une demande. La traduction conserve cette assurance, sans préciser si elle relève d’une promesse, d’une conviction ou d’une conséquence attendue de la prière.
translation_notes:
  register: Français international moderne, digne et accessible. Tutoiement cohérent avec l’adresse grecque au singulier. La coordination répétée par « et » conserve le mouvement de la phrase source.
