- from: Et maintenant, prie pour nous, puisque tu es une femme qui respecte Dieu, et le Seigneur enverra la pluie pour remplir nos citernes, et nous ne manquerons plus d’eau.[a]
  to: Et maintenant, prie pour nous, puisque tu es une femme dévouée à Dieu, et le Seigneur enverra la pluie pour remplir nos citernes, et nous ne serons plus démunis.[a]
  rationale: La révision évite d’ajouter « d’eau », qui réduit une expression grecque lexicalement ouverte. Elle conserve le lien contextuel avec la sécheresse et les citernes par la note, tout en donnant dans le texte une formulation française naturelle. « Femme dévouée à Dieu » rend plus précisément εὐσεβής dans un registre moderne et digne.
