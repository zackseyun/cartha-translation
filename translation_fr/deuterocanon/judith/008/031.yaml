    issue: Restriction indue de οὐκ ἐκλείψομεν ἔτι à l’eau
    rationale: Le texte français explicite « d’eau », alors que le grec ne mentionne aucun complément. La pluie et les citernes favorisent l’idée de pénurie, mais ne permettent pas de limiter avec certitude l’énoncé à l’eau.
  - severity: low
    issue: Formulation de la note littérale peu naturelle
    rationale: « Nous ne ferons plus défaut » et « nous ne viendrons plus à manquer » ne sont pas des formulations françaises claires avec un sujet humain. La note doit expliquer l’ambiguïté lexicale sans présenter ces tours comme des équivalents français usuels.
  - severity: low
    issue: Nuance de εὐσεβής
    rationale: « Respecte Dieu » décrit surtout une attitude ponctuelle ou éthique; « dévouée à Dieu » rend mieux la dévotion religieuse durable exprimée par εὐσεβής.
