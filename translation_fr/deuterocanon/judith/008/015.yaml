base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/015.yaml
  text: For if he is not willing to help us within these five days[a], he himself has the authority, in whatever days he wishes, to shelter us[b], or even to destroy us before our enemies.
translation:
  language: fr
  text: Car s’il ne veut pas nous venir en aide au cours de ces cinq jours, il a lui-même l’autorité de nous mettre à l’abri[a] aux jours qu’il voudra, ou même de nous faire périr devant nos ennemis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous protéger ». Le verbe grec évoque littéralement l’action de couvrir, ici pour mettre sous protection.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « devant la face de nos ennemis ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν μὴ βούληται
  choice: s’il ne veut pas
  rationale: Cette formulation naturelle conserve la dimension volontaire de βούλομαι sans l’affaiblir en simple éventualité.
- source_word: ἐν ταῖς πέντε ἡμέραις
  choice: au cours de ces cinq jours
  rationale: La tournure renvoie clairement à la période de cinq jours déjà fixée dans le contexte, sans imposer une précision étrangère au grec.
- source_word: βοηθῆσαι ἡμῖν
  choice: nous venir en aide
  rationale: Cette expression rend le sens d’assistance de βοηθέω dans un français courant et digne, sans aller jusqu’à préciser un sauvetage complet.
- source_word: αὐτὸς ἔχει τὴν ἐξουσίαν
  choice: il a lui-même autorité
  rationale: « Autorité » exprime la prérogative souveraine de ἐξουσία, tandis que « lui-même » restitue l’emphase de αὐτός.
- source_word: ἐν αἷς θέλει ... ἡμέραις
  choice: aux jours qu’il voudra
  rationale: La formulation reste proche de l’expression grecque et souligne la liberté de Dieu quant au moment de son intervention.
- source_word: σκεπάσαι ἡμᾶς
  choice: nous mettre à l’abri
  rationale: Ce choix exprime la protection évoquée par l’image littérale de couvrir, dans un français idiomatique.
- source_word: ὀλεθρεῦσαι ἡμᾶς
  choice: nous faire périr
  rationale: La formule conserve la gravité du verbe, qui désigne la destruction ou la perte, tout en étant naturelle en français.
- source_word: πρὸ προσώπου τῶν ἐχθρῶν ἡμῶν
  choice: devant nos ennemis
  rationale: Cette traduction conserve l’idée spatiale et publique de l’expression sans ajouter que les ennemis seraient nécessairement les agents de la destruction.
theological_decisions:
- issue: Souveraineté divine sur le moment et l’issue
  choice: Dieu garde l’autorité aussi bien de protéger le peuple que de le faire périr, même s’il n’intervient pas dans le délai humainement fixé.
  alternative: Présenter Dieu comme permettant seulement que les ennemis détruisent le peuple, plutôt que comme pouvant lui-même le faire périr.
  rationale: Le grec place explicitement sous la même ἐξουσία divine les deux infinitifs coordonnés, « mettre à l’abri » et « faire périr ». La traduction maintient cette tension au lieu d’atténuer le second terme.
translation_notes:
  register: Français international moderne, fluide et digne. La syntaxe demeure proche du grec tout en évitant une tournure artificielle; les marqueurs de note sont placés sur les expressions auxquelles ils se rapportent.
