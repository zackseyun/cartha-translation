  text: For he did not test us by fire, as he did them, to examine their hearts; nor has he taken vengeance on us. Rather, the Lord scourges those who draw near to him for admonition.
translation:
  language: fr
  text: Car il ne nous a pas éprouvés par le feu[a], comme il les a éprouvés afin de sonder leurs cœurs ; il ne s’est pas non plus vengé de nous. Au contraire, le Seigneur frappe du fouet[b] ceux qui s’approchent de lui afin de les avertir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car il ne nous a pas brûlés, comme il les a brûlés pour éprouver leurs cœurs. » Le grec conserve directement l’image du feu, employée ici au sens d’une mise à l’épreuve.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « corrige » ou « châtie ». Le verbe grec signifie littéralement « fouetter, flageller » et souligne la sévérité de cette correction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπύρωσεν
  choice: a éprouvés par le feu
  rationale: Le verbe évoque littéralement l’action de brûler, mais εἰς ἔτασμόν lui donne ici la valeur d’une épreuve. Cette formulation conserve à la fois l’image du feu et la fonction probatoire.
- source_word: εἰς ἔτασμόν
  choice: afin de sonder
  rationale: La tournure exprime le but de l’épreuve. « Sonder leur cœur » est naturel en français biblique moderne et garde l’idée d’examiner l’être intérieur.
- source_word: καρδίας
  choice: cœur
  rationale: « Cœur » conserve l’anthropologie biblique de l’intériorité sans la réduire à l’intellect ou aux émotions.
- source_word: ἐξεδίκησεν
  choice: s’est vengé de
  rationale: Le verbe désigne l’exercice de la vengeance ou d’une justice punitive. Cette traduction maintient le contraste avec le traitement correctif de la proposition suivante.
- source_word: νουθέτησιν
  choice: afin de les avertir
  rationale: Le nom indique un avertissement ou une instruction corrective. La formulation française explicite naturellement le but sans le confondre avec le verbe fort μαστιγοῖ.
- source_word: μαστιγοῖ
  choice: frappe du fouet
  rationale: Le verbe signifie concrètement fouetter ou flageller. « Frappe du fouet » préserve la dureté de l’image tout en restant compréhensible et digne.
- source_word: Κύριος
  choice: le Seigneur
  rationale: Rendu français conventionnel de κύριος dans une affirmation théologique générale.
- source_word: τοὺς ἐγγίζοντας αὐτῷ
  choice: ceux qui s’approchent de lui
  rationale: Cette traduction garde le mouvement d’approche et sa possible résonance religieuse, sans préciser davantage la nature de cette proximité.
theological_decisions:
- issue: Conserver ou atténuer l’image sévère du châtiment divin
  choice: « le Seigneur frappe du fouet »
  alternative: « le Seigneur corrige » ou « discipline »
  rationale: Le grec μαστιγοῖ est concret et plus fort qu’un terme général de discipline. L’image douloureuse est donc maintenue, tandis que νουθέτησιν en indique la visée corrective.
- issue: Rapport entre vengeance et correction
  choice: Distinguer « il ne s’est pas vengé » de l’action accomplie « afin de les avertir »
  alternative: Employer « punir » puis « discipliner »
  rationale: Le verset oppose explicitement la vengeance à une intervention sévère mais orientée vers l’avertissement; des termes plus généraux risqueraient d’aplanir cette tension.
- issue: Portée de la négation dans la première proposition
  choice: « il ne nous a pas éprouvés par le feu, comme il l’a fait pour eux »
  alternative: « ce n’est pas comme il les a éprouvés par le feu… qu’il s’est vengé de nous »
  rationale: La syntaxe grecque est resserrée et peut paraître ambiguë. Le choix retenu suit la lecture contextuellement cohérente qui coordonne deux négations portant sur le traitement de « nous », sans effacer l’image appliquée à « eux ».
translation_notes:
  register: Français international moderne, courant mais digne. La phrase évite les archaïsmes (« admonester », « flageller » dans le corps du texte) tout en conservant l’image concrète et la tension théologique du grec.
