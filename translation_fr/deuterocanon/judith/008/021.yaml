  source_fidelity: La première partie rend bien la condition difficile (« si nous sommes capturés ainsi »), l’abaissement de la Judée, puis le pillage des τὰ ἅγια. « Toute la Judée sera réduite à l’impuissance » est une explicitation contextuellement sûre de καθήσεται, convenablement documentée. En revanche, « il nous fera payer de notre sang leur profanation » introduit explicitement « nous » comme objet de la sanction et formule une culpabilité personnelle que le grec ne précise pas. La relation entre ζητήσει, la profanation et ἐκ τοῦ αἵματος ἡμῶν demeure elliptique et doit rester moins résolue.
  naturalness: Le français est dans l’ensemble naturel, solennel et accessible. « Il réclamera de notre sang réparation pour leur profanation » est idiomatique dans ce registre et conserve mieux l’ellipse du grec que « il nous fera payer ».
  terminology: « Judée », « biens sacrés », « pillés » et « profanation » conviennent. « Biens sacrés » reste une représentation acceptable du pluriel τὰ ἅγια, sans réduire nécessairement le sens au sanctuaire seul.
