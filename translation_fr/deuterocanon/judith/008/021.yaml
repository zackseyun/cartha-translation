  text: For if we are captured like this[a], all Judea will be brought low, and our holy things will be plundered[d][c][b], and he will require their profanation from our blood.
translation:
  language: fr
  text: Car si nous sommes capturés dans ces conditions[a], toute la Judée sera réduite à l’impuissance[b], nos biens sacrés seront pillés[c], et il réclamera de notre sang réparation pour leur profanation[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quand nous aurons été capturés ainsi ». Le début de la phrase grecque est syntaxiquement difficile ; il annonce néanmoins les conséquences de leur capture dans la situation présente.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « toute la Judée s’assiéra ». L’image peut évoquer un pays abattu, paralysé ou laissé sans défense.'
    reason: lexical_alternative
  - marker: c
    text: Le grec dit littéralement « nos choses saintes » ; l’expression peut englober les lieux, les objets et les biens consacrés.
    reason: lexical_alternative
  - marker: d
    text: Le grec ne précise pas le sujet de « réclamera » et dit littéralement, de manière abrupte, qu’il réclamera leur profanation « de notre sang ». La traduction exprime l’idée d’une réparation exigée de leur sang, sans déterminer davantage le rapport exact entre cette profanation et leur sang. Le contexte peut faire penser à Dieu demandant compte de cette profanation.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπ' ἐν τῷ λημφθῆναι ἡμᾶς οὕτως
  choice: si nous sommes capturés dans ces conditions
  rationale: La tournure grecque est syntaxiquement difficile, mais λημφθῆναι ἡμᾶς exprime clairement le fait qu’ils soient pris. La valeur conditionnelle convient au contexte, et « capturés » correspond à la situation militaire.
- source_word: καθήσεται
  choice: sera réduite à l’impuissance
  rationale: Le verbe signifie littéralement « s’assiéra », mais décrit ici vraisemblablement la Judée abattue et incapable d’agir. La formulation française rend ce sens contextuel sans aller jusqu’à l’idée plus forte d’une destruction totale.
- source_word: πᾶσα ἡ Ἰουδαία
  choice: toute la Judée
  rationale: Ἰουδαία désigne ici le territoire, non le peuple pris comme ethnonyme.
- source_word: προνομευθήσεται
  choice: seront pillés
  rationale: Le futur passif évoque la saisie du butin par l’ennemi. « Pillés » est naturel dans ce contexte militaire.
- source_word: τὰ ἅγια ἡμῶν
  choice: nos biens sacrés
  rationale: Le neutre pluriel désigne largement ce qui est saint ou consacré, sans imposer le seul sens de sanctuaire. « Biens sacrés » reste assez large tout en étant idiomatique en français.
- source_word: ζητήσει
  choice: il nous fera payer
  rationale: Le verbe peut exprimer l’exigence ou la demande de comptes. Cette tournure rend naturellement en français l’idée d’une profanation exigée au prix de leur sang, tout en laissant le sujet singulier non identifié par un nom.
- source_word: τὴν βεβήλωσιν αὐτῶν
  choice: leur profanation
  rationale: βεβήλωσις désigne la violation du caractère sacré. « Profanation » est précis et convient au registre.
- source_word: ἐκ τοῦ αἵματος ἡμῶν
  choice: de notre sang
  rationale: La préposition ἐκ marque ici ce dont sera tiré le prix ou la réparation. « Faire payer de notre sang » restitue l’image avec une expression française naturelle, sans expliciter davantage le mécanisme du jugement.
theological_decisions:
- issue: Sujet implicite de ζητήσει
  choice: Conserver un sujet implicite rendu par « il », sans nommer Dieu
  alternative: Nommer explicitement Dieu, employer un sujet indéfini, ou comprendre l’ennemi comme sujet
  rationale: Le grec emploie un verbe à la troisième personne du singulier sans sujet exprimé. Le contexte peut orienter vers Dieu comme celui qui demande compte, mais l’ajout de son nom supprimerait une ambiguïté réelle du texte.
- issue: Rapport entre la profanation et « notre sang »
  choice: « il nous fera payer de notre sang leur profanation »
  alternative: « il demandera compte de leur profanation à notre sang » ou « il exigera de notre sang réparation pour leur profanation »
  rationale: La relation exprimée par ἐκ est dense et difficile. La traduction retenue communique une responsabilité payée au prix du sang, sans préciser au-delà du grec pourquoi ni de quelle manière ce sang est exigé.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la progression solennelle du grec, tout en rendant idiomatiquement ses deux formulations difficiles. Les notes signalent le sens littéral de καθήσεται, l’étendue possible de τὰ ἅγια et l’ambiguïté théologique du sujet de ζητήσει.
