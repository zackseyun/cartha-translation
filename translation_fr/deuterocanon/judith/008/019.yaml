  text: For this reason our fathers were handed over to the sword and to plundering, and they fell in a great slaughter before our enemies.
translation:
  language: fr
  text: C’est pourquoi nos pères ont été livrés à l’épée et au pillage, et ils sont tombés en un immense carnage devant nos ennemis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit plus littéralement : « ils sont tombés [comme] une grande masse de corps », expression évoquant un très grand nombre de morts.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν χάριν
  choice: C’est pourquoi
  rationale: Cette tournure rend naturellement la valeur causale de l’expression grecque tout en reliant clairement le verset à ce qui précède.
- source_word: ἐδόθησαν
  choice: ont été livrés
  rationale: Le passif de δίδωμι exprime ici l’abandon au pouvoir hostile ou au désastre; « livrés » conserve le passif et convient au contexte guerrier.
- source_word: εἰς ῥομφαίαν
  choice: à l’épée
  rationale: Expression française biblique et intelligible désignant la mort violente par l’épée.
- source_word: εἰς διαρπαγήν
  choice: au pillage
  rationale: Le nom désigne l’action de piller ou la mise à sac; « au pillage » maintient le parallélisme avec « à l’épée ».
- source_word: οἱ πατέρες ἡμῶν
  choice: nos pères
  rationale: Rend directement le masculin pluriel grec et conserve le langage historique ancestral du passage.
- source_word: ἔπεσον
  choice: ils sont tombés
  rationale: Conserve l’image grecque habituelle de ceux qui tombent au combat.
- source_word: πτῶμα μέγα
  choice: en un immense carnage
  rationale: La formulation grecque, littéralement proche de « une grande masse de corps tombés », est comprimée et peu naturelle en français. Cette expression transmet le grand nombre de morts sans imposer une précision étrangère au contexte.
- source_word: ἐνώπιον τῶν ἐχθρῶν ἡμῶν
  choice: devant nos ennemis
  rationale: Rend sobrement et naturellement ἐνώπιον tout en gardant la solennité du texte.
theological_decisions:
- issue: Désignation masculine des générations antérieures
  choice: nos pères
  alternative: nos ancêtres
  rationale: Le grec emploie explicitement le masculin dans un langage historique traditionnel; le conserver évite de neutraliser silencieusement le texte.
- issue: Sens de πτῶμα μέγα
  choice: ils sont tombés en un immense carnage
  alternative: ils sont tombés, formant une immense masse de morts
  rationale: Le choix principal reste naturel en français et exprime la mortalité massive du contexte militaire. Une note signale l’image littérale inhabituelle afin de préserver la texture et l’ambiguïté de l’expression grecque.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure proche du grec, tandis que l’expression difficile πτῶμα μέγα est rendue idiomatiquement et explicitée en note.
