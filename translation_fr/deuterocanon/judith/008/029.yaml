base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/029.yaml
  text: For your wisdom did not become evident only today; rather[a], from the beginning of your days all the people have known your understanding, because the disposition of your heart is good.
translation:
  language: fr
  text: Car ce n’est pas seulement aujourd’hui que ta sagesse est manifeste ; depuis tes premiers jours, tout le peuple connaît ton discernement, parce que la disposition de ton cœur[a] est bonne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « parce que la formation de ton cœur est bonne ». Le terme grec peut aussi évoquer l’inclination intérieure du cœur.'
    reason: La note rend correctement la relation grammaticale de πλάσμα τῆς καρδίας et conserve l’ambiguïté lexicale de πλάσμα.
lexical_decisions:
- source_word: οὐκ ἐν τῇ σήμερον ἡ σοφία σου πρόδηλός ἐστιν
  choice: ce n’est pas seulement aujourd’hui que ta sagesse est manifeste
  rationale: La tournure française exprime naturellement le contraste entre aujourd’hui et une réputation établie depuis longtemps. « Manifeste » rend πρόδηλος sans ajouter une idée de commencement absente de la forme verbale grecque.
- source_word: ἀλλʼ ἀπʼ ἀρχῆς ἡμερῶν σου
  choice: depuis le commencement de tes jours
  rationale: Cette formulation conserve l’image temporelle du grec tout en restant claire en français moderne.
- source_word: ἔγνω πᾶς ὁ λαὸς
  choice: tout le peuple connaît
  rationale: Le présent français rend ici la connaissance acquise autrefois et toujours actuelle de la réputation de Judith.
- source_word: τὴν σύνεσίν σου
  choice: ton discernement
  rationale: « Discernement » exprime la compréhension intelligente et pratique de σύνεσις tout en la distinguant de σοφία, rendue par « sagesse ».
- source_word: καθότι
  choice: parce que
  rationale: Le connecteur introduit naturellement en français la raison pour laquelle le peuple reconnaît son discernement.
- source_word: τὸ πλάσμα τῆς καρδίας σου
  choice: la disposition de ton cœur
  rationale: « Disposition » communique l’orientation intérieure évoquée par πλάσμα, littéralement ce qui est formé ou façonné, tandis que « cœur » préserve l’anthropologie biblique.
- source_word: ἀγαθόν
  choice: est bonne
  rationale: « Bonne » est l’équivalent direct et le moins chargé de cette appréciation morale générale.
theological_decisions:
- issue: Expression anthropologique liée au cœur
  choice: Conserver « cœur » dans « la disposition de ton cœur »
  alternative: « ton caractère est bon » ou « la disposition de ton esprit est bonne »
  rationale: Le cœur désigne ici le centre intérieur de la pensée et de l’orientation morale. Le conserver maintient l’image biblique sans imposer une anthropologie particulière.
- issue: Portée temporelle de la sagesse reconnue
  choice: « ce n’est pas seulement aujourd’hui »
  alternative: « ta sagesse n’est pas manifeste aujourd’hui »
  rationale: La négation porte sur la limitation à aujourd’hui, non sur le caractère manifeste de la sagesse. La traduction préserve donc le contraste avec la reconnaissance ancienne par tout le peuple.
translation_notes:
  register: Français international moderne, digne et accessible. Tutoiement maintenu conformément au singulier grec. Syntaxe proche du texte source, avec une ponctuation française fluide et sans archaïsmes inutiles.
