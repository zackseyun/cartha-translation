  yaml_path: translation/deuterocanon/judith/008/023.yaml
  text: For our slavery will not be turned to favor[a], but the Lord our God will make it a dishonor.
translation:
  language: fr
  text: Car notre esclavage ne débouchera pas sur la faveur[a] ; au contraire, le Seigneur notre Dieu en fera un déshonneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car notre servitude ne conduira pas à la faveur ; au contraire, le Seigneur notre Dieu en fera une honte. »'
    reason: Alternative lexicale pour δουλεία, κατευθυνθήσεται et ἀτιμία, tout en conservant l’idée d’issue exprimée par la construction grecque.
lexical_decisions:
- source_word: κατευθυνθήσεται
  choice: débouchera
  rationale: Le futur passif, construit avec εἰς, exprime ici l’orientation vers une issue. « Débouchera sur » restitue naturellement en français cette idée d’aboutissement sans imposer le sens plus interprétatif de « prospérer ».
- source_word: δουλεία
  choice: esclavage
  rationale: Le terme désigne un état d’asservissement réel. « Esclavage » en conserve la force, contrairement au terme plus atténué « servitude ».
- source_word: εἰς χάριν
  choice: sur la faveur
  rationale: Dans le contraste avec ἀτιμία, χάρις désigne ici la faveur ou la bienveillance, plutôt que la grâce au sens théologique. La préposition est intégrée à la tournure française « déboucher sur ».
- source_word: ἀτιμίαν
  choice: un déshonneur
  rationale: ἀτιμία exprime la perte d’honneur ou de considération. « Déshonneur » préserve cette dimension de statut et correspond directement à la construction résultative avec θήσει.
- source_word: θήσει αὐτήν
  choice: en fera
  rationale: 'Le verbe τίθημι a ici un sens résultatif : le Seigneur fera de cet esclavage un déshonneur. Le pronom « en » reprend clairement « notre esclavage » en français idiomatique.'
- source_word: Κύριος ὁ θεὸς ἡμῶν
  choice: le Seigneur notre Dieu
  rationale: Cette formulation française naturelle conserve tous les éléments du titre grec.
theological_decisions:
- issue: Portée de δουλεία dans le contexte de la sujétion d’Israël
  choice: esclavage
  alternative: servitude
  rationale: Le contexte évoque une condition d’asservissement et d’humiliation, non un simple service ; la traduction forte est donc maintenue.
- issue: Sens de χάρις dans un contexte non sotériologique
  choice: faveur
  alternative: grâce
  rationale: Le contraste avec le déshonneur porte sur l’accueil et le statut social résultant de l’asservissement ; « faveur » évite d’introduire une connotation sotériologique absente du passage.
- issue: Agent divin du déshonneur
  choice: « le Seigneur notre Dieu en fera un déshonneur »
  alternative: « cela tournera à notre déshonneur »
  rationale: La formulation conserve explicitement Dieu comme sujet de θήσει, sans atténuer la tension théologique du texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Débouchera sur » rend idiomatiquement l’orientation vers une issue ; le point-virgule et « au contraire » marquent nettement l’opposition grecque ἀλλά.
