base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/026.yaml
  text: Remember what he did with Abraham[a], and how he tested Isaac, and what happened to Jacob in Mesopotamia of Syria while he was shepherding the sheep of Laban[b], his mother's brother.
translation:
  language: fr
  text: Souvenez-vous de tout ce qu’il a fait à l’égard d’Abraham, de la manière dont il a mis Isaac à l’épreuve[a], et de tout ce qui est arrivé à Jacob en Mésopotamie de Syrie[b], pendant qu’il gardait les moutons de Laban, le frère de sa mère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec peut aussi se traduire par « éprouver » ou, dans certains contextes, « tenter » ; ici, il s’agit de mettre à l’épreuve, non d’inciter au mal.
    reason: lexical_alternative
  - marker: b
    text: « Mésopotamie de Syrie » reproduit l’expression géographique grecque ; on peut aussi traduire « Mésopotamie syrienne ».
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητε
  choice: Souvenez-vous
  rationale: L’impératif aoriste pluriel appelle les destinataires à se remémorer les interventions passées. « Souvenez-vous » est direct, naturel et digne.
- source_word: ὅσα ἐποίησεν μετʼ Ἀβραάμ
  choice: tout ce qu’il a fait à l’égard d’Abraham
  rationale: Le sujet, implicite en grec, est repris par « il » sans être identifié plus explicitement. « À l’égard d’Abraham » exprime les rapports et les actions concernés sans les présenter exclusivement comme favorables ou défavorables.
- source_word: ἐπείρασεν
  choice: a mis Isaac à l’épreuve
  rationale: Le verbe peut désigner le fait d’éprouver, de tester ou, selon le contexte, de tenter. Ici, « mettre à l’épreuve » indique une épreuve probatoire sans suggérer une incitation au mal.
- source_word: ὅσα ἐγένετο τῷ Ἰακώβ
  choice: tout ce qui est arrivé à Jacob
  rationale: Cette tournure française rend naturellement l’ensemble des événements qui ont touché Jacob.
- source_word: ἐν Μεσοποταμίᾳ τῆς Συρίας
  choice: en Mésopotamie de Syrie
  rationale: La formulation conserve l’expression géographique particulière du grec; une variante française plus fluide est signalée en note.
- source_word: ποιμαίνοντι τὰ πρόβατα
  choice: pendant qu’il gardait les moutons
  rationale: Le participe présent décrit l’activité continue de Jacob. « Gardait les moutons » est courant et conserve l’image pastorale concrète.
- source_word: Λαβὰν τοῦ ἀδελφοῦ τῆς μητρὸς αὐτοῦ
  choice: de Laban, le frère de sa mère
  rationale: La formulation reste proche du grec tout en indiquant clairement le lien familial sans remplacer l’expression par le terme interprétatif « oncle maternel ».
theological_decisions:
- issue: Sujet implicite des verbes concernant Abraham et Isaac
  choice: Employer le pronom « il », dont le référent divin ressort du contexte
  alternative: Nommer explicitement Dieu
  rationale: Le grec laisse le sujet implicite. Le pronom donne une phrase française naturelle tout en respectant la retenue du texte source.
- issue: Sens de ἐπείρασεν appliqué à l’action divine
  choice: a mis Isaac à l’épreuve
  alternative: a tenté Isaac
  rationale: Le contexte évoque une épreuve destinée à révéler ou éprouver la fidélité, non une incitation morale au mal. La traduction conserve néanmoins la notion d’épreuve portée par le verbe grec.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « tout ce que / tout ce qui » reflète l’insistance du grec, tandis que la syntaxe reste naturelle. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils expliquent.
