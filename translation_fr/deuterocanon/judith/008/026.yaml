  source_fidelity: 'Le texte rend fidèlement la structure de μνήσθητε suivi des trois rappels : les actes de Dieu avec Abraham, l’épreuve d’Isaac et les événements survenus à Jacob. « À l’égard d’Abraham » exprime de manière recevable le μετὰ grec sans réduire ces actes à une aide ou à une adversité. La proposition participiale finale est correctement rattachée à Jacob et à son activité de gardien des moutons de Laban.'
