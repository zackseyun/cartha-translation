  text: But you must not investigate my action, for I will not tell you until what I am doing has been completed.
translation:
  language: fr
  text: Mais vous, ne cherchez pas à découvrir ma démarche, car je ne vous en dirai rien avant que ce que je fais soit achevé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξερευνήσετε
  choice: ne cherchez pas à découvrir
  rationale: Le verbe exprime une recherche poussée visant à mettre au jour quelque chose. Cette tournure rend naturellement en français la valeur d’interdiction du futur grec dans ce contexte.
- source_word: τὴν πρᾶξίν μου
  choice: ma démarche
  rationale: πρᾶξις désigne ici l’action entreprise ou la conduite suivie par Judith. « Ma démarche » conserve la forme nominale et évoque son action en cours sans la réduire explicitement à un projet intérieur.
- source_word: οὐ γὰρ ἐρῶ ὑμῖν
  choice: car je ne vous en dirai rien
  rationale: Le futur de λέγω signifie ici que Judith ne communiquera aucune information à ses interlocuteurs. Le pronom « en » rattache naturellement la déclaration à sa démarche.
- source_word: ἕως τοῦ τελεσθῆναι
  choice: avant que … soit achevé
  rationale: La construction fixe comme terme le moment où l’action arrivera à son accomplissement. Le passif « soit achevé » respecte la voix de τελεσθῆναι tout en restant idiomatique.
- source_word: ἃ ἐγὼ ποιῶ
  choice: ce que je fais
  rationale: Cette expression garde la valeur actuelle et progressive des actes accomplis par Judith, ainsi que l’insistance discrète portée par ἐγώ.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La distinction grecque entre le nom πρᾶξις (« ma démarche ») et la proposition verbale ἃ ἐγὼ ποιῶ (« ce que je fais ») est conservée, sans préciser indûment la nature de l’action de Judith.
