  source_fidelity: 'La structure fondamentale est fidèle : les trois réalités subies sont l’objet du verbe singulier implicite, et l’image de rétribution « sur nos têtes » est conservée. Toutefois, « où nous serons esclaves » rend l’état résultant plutôt que le verbe δουλεύω (« servir / être asservis ») et atténue la nuance indéfinie de οὗ ἐὰν (« partout où »).'
  naturalness: Le français est globalement clair et de registre biblique moderne. « Mise en captivité du pays » est plus idiomatique et précis que « captivité du pays ». « Devant ceux qui nous possèdent » traduit plus directement ἐναντίον que « aux yeux de ».
  terminology: « Massacre », « héritage », « nations », « objet de mépris » et « ceux qui nous possèdent » conviennent. « Asservis » permet de rendre la condition coercitive sans transformer directement le verbe grec en une simple copule d’état.
  issues:
