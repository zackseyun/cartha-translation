  - severity: low
    issue: « Captivité du pays » est elliptique en français.
    rationale: Le grec αἰχμαλωσία τῆς γῆς peut conserver la personnification du pays, mais « mise en captivité du pays » l’exprime plus naturellement sans changer le sens.
  - severity: low
    issue: « Aux yeux de » est un peu moins direct que ἐναντίον.
    rationale: « Devant ceux qui nous possèdent » conserve le rapport de mise en présence/opposition exprimé par ἐναντίον.
