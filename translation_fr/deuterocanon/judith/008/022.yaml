base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/022.yaml
  text: and the slaughter of our brothers[a], and the captivity of the land, and the desolation of our inheritance, will return upon our own heads among the nations where we will serve as servants there[b]; and we will become a stumbling block and a reproach before those who possess us.
translation:
  language: fr
  text: Et le massacre de nos frères, la mise en captivité du pays et la dévastation de notre héritage, il les fera retomber sur nos têtes[a] parmi les nations, partout où nous serons asservis[b] ; et nous deviendrons un obstacle et un objet de mépris devant ceux qui nous possèdent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « tout cela retombera sur nos têtes ». Le verbe grec est au singulier, mais son sujet n’est pas exprimé dans cette proposition.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « partout où nous servirons là-bas ». Le grec emploie un verbe qui signifie simplement « servir », mais, dans ce contexte de captivité, il désigne probablement un service imposé, celui d’esclaves.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φόνον
  choice: massacre
  rationale: Le terme désigne ici une mise à mort violente ou une effusion de sang dans un contexte de guerre ; « massacre » en conserve la force sans imposer la qualification juridique de « meurtre ».
- source_word: ἀδελφῶν
  choice: frères
  rationale: Le masculin pluriel grec est conservé ; dans ce contexte, il peut désigner plus largement les membres du peuple d’Israël.
- source_word: αἰχμαλωσίαν τῆς γῆς
  choice: la captivité du pays
  rationale: « Captivité » exprime le fait d’être pris et soumis par l’ennemi, tandis que « pays » donne à γῆ son sens territorial dans ce contexte national.
- source_word: ἐρήμωσιν τῆς κληρονομίας ἡμῶν
  choice: la dévastation de notre héritage
  rationale: « Dévastation » rend l’idée d’un territoire ravagé ; « héritage » préserve la résonance du pays reçu en partage.
- source_word: ἐπιστρέψει εἰς κεφαλὴν ἡμῶν
  choice: il les fera retomber sur nos têtes
  rationale: Cette formulation française restitue l’expression de rétribution ou de conséquences qui retombent sur quelqu’un. Le pronom « il » représente le sujet singulier implicite sans le nommer.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: parmi les nations
  rationale: Cette traduction convient au contexte de captivité à l’étranger et évite de surcharger ἔθνη d’une interprétation confessionnelle.
- source_word: δουλεύσωμεν
  choice: nous serons esclaves
  rationale: Dans le cadre de la captivité et de la possession par des maîtres étrangers, δουλεύω exprime vraisemblablement une condition servile plutôt qu’un service volontaire.
- source_word: πρόσκομμα
  choice: un obstacle
  rationale: Le mot désigne ce qui fait trébucher. « Obstacle » conserve l’image essentielle dans un français plus naturel ici que « pierre d’achoppement ».
- source_word: ὄνειδος
  choice: un objet de mépris
  rationale: La tournure exprime à la fois le déshonneur subi et le regard méprisant porté par autrui.
- source_word: τῶν κτωμένων ἡμᾶς
  choice: ceux qui nous possèdent
  rationale: Le participe de κτάομαι indique l’acquisition ou la possession ; cette traduction reste proche du grec et maintient l’image de domination servile.
theological_decisions:
- issue: Sujet implicite de ἐπιστρέψει
  choice: Conserver un sujet singulier implicite sous la forme « il », sans le nommer.
  alternative: 'Comprendre la proposition impersonnellement : « tout cela retombera sur nos têtes » ; ou expliciter : « Dieu fera retomber… »'
  rationale: Le verbe grec est au singulier et n’a pas de sujet exprimé dans cette proposition. « Il » respecte cette donnée et la probable action divine suggérée par le contexte, sans ajouter explicitement « Dieu ».
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’enchaînement solennel du grec tout en employant une reprise pronominale naturelle en français. Les termes « héritage », « nations » et l’image de ce qui retombe « sur nos têtes » maintiennent les résonances bibliques sans archaïsme excessif.
