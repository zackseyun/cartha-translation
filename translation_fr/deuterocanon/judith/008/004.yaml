lexical_decisions:
- source_word: Ἰουδεὶθ
  choice: Judith
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: ἦν
  choice: resta
  rationale: Le verbe signifie littéralement « était », mais, avec le participe duratif χηρεύουσα et l’indication de durée, « resta » exprime naturellement en français la continuité de cet état.
- source_word: ἐν τῷ οἴκῳ αὐτῆς
  choice: chez elle
  rationale: Rend naturellement la localisation dans sa propre maison sans suggérer seulement l’intérieur du bâtiment.
- source_word: χηρεύουσα
  choice: vivant dans le veuvage
  rationale: Exprime l’état durable de veuve porté par le participe présent, sans réduire le terme au seul événement de la perte du mari.
- source_word: ἔτη τρία καὶ μῆνας τέσσορες
  choice: pendant trois ans et quatre mois
  rationale: Le français demande naturellement « pendant » pour marquer la durée indiquée par l’accusatif grec.
