  text: And she fasted all the days of her widowhood[a], except the days before Sabbaths and Sabbaths and the days before new moons and festivals and celebrations of the house of Israel.
translation:
  language: fr
  text: Elle jeûnait tous les jours de son veuvage, sauf les veilles de sabbat[a], les sabbats, les veilles de nouvelles lunes, les fêtes et les jours de réjouissance de la maison d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « les jours précédant les sabbats ». Le grec emploie ici, puis pour les nouvelles lunes, des mots composés désignant les jours qui précèdent ces observances.
    reason: Précision lexicale sur les composés προσαββάτων et προνουμηνιῶν.
lexical_decisions:
- source_word: ἐνήστευε
  choice: elle jeûnait
  rationale: L’imparfait grec exprime ici une pratique habituelle et prolongée dans le passé ; l’imparfait français la rend naturellement.
- source_word: πάσας τὰς ἡμέρας τῆς χηρεύσεως αὐτῆς
  choice: tous les jours de son veuvage
  rationale: La formulation conserve la portée temporelle de l’expression grecque, qui embrasse toute sa période de veuvage.
- source_word: χωρὶς
  choice: sauf
  rationale: Dans cette énumération, la préposition marque clairement les jours exclus de sa pratique du jeûne.
- source_word: προσαββάτων
  choice: les veilles de sabbat
  rationale: Le composé désigne les jours précédant les sabbats. « Veilles de sabbat » est idiomatique en français sans imposer le terme liturgique plus technique de « jours de préparation ».
- source_word: σαββάτων
  choice: les sabbats
  rationale: Le pluriel grec désigne les sabbats qui revenaient régulièrement ; il est conservé en français.
- source_word: προνουμηνιῶν
  choice: les veilles de nouvelle lune
  rationale: Ce composé, parallèle à προσαββάτων, désigne les jours précédant les célébrations de la nouvelle lune.
- source_word: ἑορτῶν
  choice: les fêtes
  rationale: Le terme désigne des fêtes religieuses ; « fêtes » est courant, clair et adapté au registre biblique.
- source_word: χαρμοσυνῶν
  choice: les jours de réjouissance
  rationale: Le nom évoque des occasions marquées par la joie. Cette formulation rend leur caractère temporel et festif dans la série des jours exemptés du jeûne.
- source_word: οἴκου Ἰσραήλ
  choice: de la maison d’Israël
  rationale: Cette tournure conserve l’expression biblique collective du grec au lieu de la réduire à « d’Israël ».
theological_decisions:
- issue: Nature des exceptions au jeûne de Judith
  choice: Judith jeûnait habituellement pendant son veuvage, mais non durant les jours sacrés ou joyeux énumérés.
  alternative: Comprendre les jours énumérés comme des jours où elle jeûnait spécialement.
  rationale: Dans ce contexte, χωρὶς marque naturellement l’exclusion, et le caractère festif ou sacré des jours cités confirme qu’ils interrompaient le jeûne.
- issue: Traduction des termes calendaires israélites
  choice: Décrire les jours précédant les sabbats et les nouvelles lunes par « veilles », avec une précision en note.
  alternative: Employer des désignations liturgiques techniques telles que « jours de préparation ».
  rationale: Le grec emploie des composés indiquant simplement l’antériorité. Une traduction descriptive évite d’introduire une terminologie ultérieure plus précise que le texte source.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait exprime l’habitude ; « veilles » allège l’énumération tout en maintenant la relation temporelle explicitée par les composés grecs. L’expression biblique « maison d’Israël » est conservée.
