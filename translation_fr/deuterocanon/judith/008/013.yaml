  text: And now you are testing the Lord Almighty[b][a], and you will never understand anything.
translation:
  language: fr
  text: Et maintenant, vous cherchez à sonder le Seigneur tout-puissant[a], mais vous ne comprendrez jamais rien[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous examinez » ou « vous mettez à l’épreuve le Seigneur tout-puissant ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « jusqu’à l’âge » ; expression qui signifie ici « pour toujours ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξετάζετε
  choice: vous cherchez à sonder
  rationale: Le verbe désigne ici l’action d’examiner ou de scruter. « Cherchez à sonder » exprime naturellement en français la tentative présomptueuse de pénétrer les desseins de Dieu, sans réduire le sens à celui de le mettre à l’épreuve.
- source_word: κύριον Παντοκράτορα
  choice: le Seigneur tout-puissant
  rationale: « Seigneur » rend le titre divin κύριος, et « tout-puissant » restitue Παντοκράτωρ dans une formulation française courante et digne.
- source_word: οὐθὲν
  choice: rien
  rationale: Dans la construction négative française « ne… rien », ce choix rend directement l’objet négatif grec.
- source_word: ἐπιγνώσεσθε
  choice: vous ne comprendrez
  rationale: Dans ce contexte de tentative de sonder Dieu, le verbe évoque une connaissance ou une compréhension véritable; « comprendre » transmet clairement cette portée.
- source_word: ἕως τοῦ αἰῶνος
  choice: jamais
  rationale: L’expression idiomatique signifie littéralement « jusqu’à l’éternité » et, avec la négation, produit naturellement en français le sens de « jamais ».
theological_decisions:
- issue: Portée de l’enquête humaine sur Dieu dans ἐξετάζετε
  choice: vous cherchez à sonder le Seigneur tout-puissant
  alternative: vous mettez à l’épreuve le Seigneur tout-puissant
  rationale: « Sonder » préserve l’idée de scruter Dieu et la tension entre l’enquête humaine et l’impossibilité de le comprendre pleinement, sans imposer exclusivement le motif de la tentation ou de la mise à l’épreuve.
- issue: Rendu de κύριος comme titre divin
  choice: Seigneur
  alternative: Maître
  rationale: Dans l’expression κύριον Παντοκράτορα, κύριος fonctionne comme un titre divin; « Seigneur » est le rendu français naturel et traditionnel sans ajout doctrinal.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le ton de reproche adressé à plusieurs personnes et l’ambiguïté de ἐξετάζετε entre examen approfondi et mise à l’épreuve.
