base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/001.yaml
  text: 'And when the uproar of the men around the council had ceased[a], Holofernes, commander-in-chief of the army of Asshur, said to Achior in the presence of all the assembly of foreigners:'
translation:
  language: fr
  text: 'Quand le tumulte des hommes autour du conseil eut cessé, Holopherne, commandant en chef de l’armée d’Assour[a], dit à Achior devant toute l’assemblée des étrangers :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’Assyrie ». Le grec porte le nom propre Assour, qui peut être rendu par « Assour » ou, selon l’interprétation, par le nom du royaume, « Assyrie ».
    reason: Alternative lexicale et référentielle du nom propre Ἀσσοὺρ.
lexical_decisions:
- source_word: κατέπαυσεν
  choice: se fut apaisé
  rationale: Le plus-que-parfait marque naturellement en français que le tumulte avait pris fin avant la prise de parole d’Holopherne.
- source_word: θροῦβος
  choice: tumulte
  rationale: Le terme exprime à la fois le bruit et l’agitation d’un groupe, avec un registre narratif digne et courant.
- source_word: τῶν κύκλῳ τῆς συνεδρίας
  choice: des hommes qui entouraient le conseil
  rationale: Cette formulation conserve l’image spatiale du grec tout en rendant συνεδρία par une réunion délibérative.
- source_word: ἀρχιστράτηγος
  choice: commandant en chef
  rationale: Ce titre rend le rang militaire suprême exprimé par le composé grec, plus précisément que le simple « général ».
- source_word: δυνάμεως
  choice: armée
  rationale: Dans ce contexte militaire, δύναμις désigne les forces armées placées sous le commandement d’Holopherne.
- source_word: Ἀσσοὺρ
  choice: Assour
  rationale: La translittération française conserve le nom propre grec sans décider silencieusement s’il désigne l’ancêtre, le peuple ou le royaume assyrien.
- source_word: ἐναντίον
  choice: devant
  rationale: Dans cette scène publique, « devant » signifie qu’Holopherne parle en présence de toute l’assemblée, dans un français plus direct que « en présence de ».
- source_word: παντὸς τοῦ δήμου
  choice: toute l’assemblée
  rationale: δήμος désigne ici le corps collectif réuni devant lequel la déclaration est prononcée.
- source_word: ἀλλοφύλων
  choice: des étrangers
  rationale: Le mot désigne des personnes appartenant à d’autres peuples; le contexte ne justifie pas de le spécialiser en « Philistins ».
theological_decisions:
- issue: Sens du nom Ἀσσοὺρ
  choice: Assour
  alternative: Assyrie
  rationale: Le texte grec emploie un nom propre susceptible de renvoyer à Assour ou, par extension, au royaume d’Assyrie. La translittération préserve cette latitude, tandis qu’une note signale l’autre compréhension.
translation_notes:
  register: Français international moderne, narratif et soutenu sans archaïsmes. Les noms Holopherne et Achior suivent leurs formes françaises usuelles. Le marqueur de note est placé immédiatement après « Assour », auquel la note se rapporte.
