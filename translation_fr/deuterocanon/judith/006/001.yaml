  text: Καὶ ὡς κατέπαυσεν ὁ θροῦβος τῶν ἀνδρῶν τῶν κύκλῳ τῆς συνεδρίας, εἶπεν Ὀλοφέρνης ἀρχιστράτηγος δυνάμεως Ἀσσοὺρ πρὸς Ἀχιὼρ ἐναντίον παντὸς τοῦ δήμου ἀλλοφύλων·
