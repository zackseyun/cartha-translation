  rationale: La révision remplace une formulation légèrement atténuante par « eut cessé », qui correspond à la cessation exprimée par κατέπαυσεν, et simplifie la tournure spatiale relative au conseil. La note est précisée afin de présenter « Assyrie » comme une interprétation possible sans lever l’ambiguïté du nom grec.
