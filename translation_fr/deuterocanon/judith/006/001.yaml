    issue: Nuance de κατέπαυσεν
    rationale: « Se fut apaisé » peut suggérer que le tumulte s’est calmé sans nécessairement prendre fin. Le verbe grec exprime la cessation; « eut cessé » est donc préférable.
  - severity: low
    issue: Formulation de la localisation autour du conseil
    rationale: « Des hommes autour du conseil » rend plus littéralement et plus sobrement τῶν ἀνδρῶν τῶν κύκλῳ τῆς συνεδρίας que la relative « qui entouraient le conseil ».
