  text: and my servants will bring you back to the hill country and place you in one of the cities of the mountain passes,[a]
translation:
  language: fr
  text: et mes serviteurs te ramèneront dans la région montagneuse et te déposeront dans l’une des villes situées sur les voies qui y montent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’une des villes des montées ». Il s’agit probablement des voies ascendantes donnant accès à la région montagneuse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνταποστήσουσίν σε
  choice: te ramèneront
  rationale: Le futur exprime ici le transport d’Akior vers la région à laquelle il est associé. « Ramèneront » restitue naturellement l’idée de retour portée par le composé.
- source_word: οἱ δοῦλοί μου
  choice: mes serviteurs
  rationale: Dans ce cadre militaire, il s’agit des hommes placés sous les ordres du locuteur. « Serviteurs » exprime cette subordination sans suggérer plus précisément que le contexte un statut juridique d’esclave.
- source_word: εἰς τὴν ὀρεινήν
  choice: dans la région montagneuse
  rationale: ὀρεινή désigne une contrée de montagnes ou de collines. Cette formulation géographique est claire en français international.
- source_word: θήσουσίν σε
  choice: te déposeront
  rationale: τίθημι signifie mettre ou placer. Avec une personne transportée sous escorte, « déposeront » rend concrètement l’action sans l’interpréter comme un simple établissement durable.
- source_word: ἐν μιᾷ τῶν πόλεων
  choice: dans l’une des villes
  rationale: Traduction directe de la construction partitive; πόλις peut désigner une ville ou une localité, et « ville » convient ici.
- source_word: τῶν ἀναβάσεων
  choice: situées sur les voies qui y montent
  rationale: ἀνάβασις signifie littéralement « montée » ou « voie d’ascension ». La formulation conserve l’image topographique et évite de réduire le terme, plus ambigu, à des cols de montagne.
