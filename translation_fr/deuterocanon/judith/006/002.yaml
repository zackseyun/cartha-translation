  text: Καὶ τίς εἶ σύ Ἀχιὼρ καὶ οἱ πρὸς πάντας υἱοὺς Μωὰβ καὶ οἱ μισθωτοὶ Ἐφράιμ, ὅτι ἐπροφήτευσας ἐν ἡμῖν καθὼς σήμερον, καὶ εἶπας τὸ γένος Ἰσραὴλ μὴ πολεμῆσαι, ὅτι θεὸς αὐτῶν ὑπερασπιεῖ αὐτῶν; καὶ τίς ὁ θεὸς εἰ μὴ Ναβουχοδονοσόρ; οὗτος ἀποστελεῖ τὸ κράτος αὐτοῦ καὶ ἐξολεθρεύσει αὐτοὺς ἀπὸ προσώπου τῆς γῆς, καὶ οὐ ῥύσεται αὐτοὺς ὁ θεὸς αὐτῶν.
