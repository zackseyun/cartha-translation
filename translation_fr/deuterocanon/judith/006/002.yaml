base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/002.yaml
  text: And who are you[a], Achior, and the hirelings of Ephraim among all the sons of Moab, that you have prophesied among us as you did today, and said that one should not make war against the house of Israel because their God will defend them? And who is God except Nebuchadnezzar? He himself will send his force and destroy them from the face of the earth[c][b], and their God will not rescue them.
translation:
  language: fr
  text: Qui es-tu donc, Achior, et qui sont les mercenaires d’Éphraïm parmi tous les fils de Moab[a], pour que tu aies prophétisé au milieu de nous aujourd’hui et déclaré qu’il ne fallait pas faire la guerre au peuple d’Israël[b], parce que leur Dieu prendrait leur défense ? Et qui est dieu, sinon Nabuchodonosor[c] ? Il enverra sa puissance, il les exterminera de la surface de la terre, et leur Dieu ne les délivrera pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La construction grecque de cette première phrase est difficile. Elle peut aussi être comprise comme une adresse directe à Achior et aux « mercenaires d’Éphraïm », prononcée devant tous les fils de Moab.
    reason: textual_or_syntactic_ambiguity
  - marker: b
    text: 'Littéralement : « la lignée d’Israël » ou « la descendance d’Israël » ; le grec souligne leur origine commune.'
    reason: lexical_alternative
  - marker: c
    text: Cette affirmation arrogante appartient au discours du personnage ; elle ne représente pas le jugement du narrateur.
    reason: theological_context
lexical_decisions:
- source_word: μισθωτοὶ
  choice: mercenaires
  rationale: Le terme désigne des hommes qui servent contre rémunération. « Mercenaires » convient au contexte militaire et conserve la nuance méprisante de l’invective.
- source_word: ἐπροφήτευσας
  choice: tu aies prophétisé
  rationale: Le verbe grec appartient explicitement au vocabulaire de la prophétie. La traduction conserve ce langage même si le locuteur l’emploie avec hostilité.
- source_word: τὸ γένος Ἰσραήλ
  choice: le peuple d’Israël
  rationale: γένος peut désigner une lignée, une communauté d’origine ou un peuple. « Peuple d’Israël » est naturel en français actuel, tandis qu’une note maintient la nuance généalogique.
- source_word: μὴ πολεμῆσαι
  choice: qu’il ne fallait pas faire la guerre
  rationale: Cette tournure française rend naturellement l’infinitif à valeur prohibitive dépendant de « déclaré ».
- source_word: ὑπερασπιεῖ
  choice: prendrait leur défense
  rationale: L’expression restitue l’idée de défendre ou de protéger quelqu’un contre un adversaire et convient au contexte militaire.
- source_word: θεὸς
  choice: dieu
  rationale: Dans la prétention « qui est dieu, sinon Nabuchodonosor ? », la minuscule indique qu’il s’agit du titre divin revendiqué pour le roi, non d’une affirmation du narrateur.
- source_word: τὸ κράτος αὐτοῦ
  choice: sa puissance
  rationale: κράτος désigne la force ou la puissance souveraine. Cette traduction évite de réduire le terme à la seule armée.
- source_word: ἐξολεθρεύσει
  choice: exterminera
  rationale: Le verbe exprime une destruction complète; « exterminera » en conserve la forte intensité.
- source_word: ἀπὸ προσώπου τῆς γῆς
  choice: de la surface de la terre
  rationale: Cette formulation française garde l’image et la solennité de l’expression biblique grecque.
- source_word: ῥύσεται
  choice: délivrera
  rationale: Le verbe signifie arracher ou délivrer d’un danger. « Délivrera » convient à la menace militaire immédiate sans élargir inutilement le sens.
theological_decisions:
- issue: La prétention à la divinité de Nabuchodonosor
  choice: Et qui est dieu, sinon Nabuchodonosor ?
  alternative: Et qui est Dieu, sinon Nabuchodonosor ?
  rationale: Le grec ne distingue pas les majuscules au sens moderne. La minuscule française aide à présenter cette phrase comme la prétention blasphématoire et arrogante du locuteur, sans en faire une affirmation théologique du narrateur.
- issue: L’action défensive du Dieu d’Israël
  choice: leur Dieu prendrait leur défense
  alternative: leur Dieu combattrait pour eux
  rationale: Le verbe grec affirme la protection divine sans préciser nécessairement que Dieu combat lui-même; la traduction préserve cette amplitude.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe ample et les répétitions donnent à la menace sa solennité, tandis que les notes signalent les ambiguïtés réelles du grec sans alourdir le texte principal.
