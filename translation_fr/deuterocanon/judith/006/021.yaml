  text: And Uzziah took him from the assembly into his house[a], and made a feast for the elders[b]; and they called on the God of Israel for help all that night.
translation:
  language: fr
  text: Ozias l’emmena de l’assemblée chez lui[a] et prépara un banquet pour les anciens[b]. Ils invoquèrent le Dieu d’Israël pour obtenir de l’aide pendant toute cette nuit-là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « assemblée » désigne ici la communauté réunie, et non une « Église » au sens chrétien plus tardif.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « fit une boisson » ou « fit à boire » ; l’expression désigne ici l’organisation d’un repas festif, d’un banquet.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέλαβεν αὐτὸν
  choice: le conduisit
  rationale: Le verbe exprime ici le fait de prendre quelqu’un avec soi pour l’emmener d’un lieu à un autre. « Le conduisit » rend naturellement ce déplacement.
- source_word: ἐκ τῆς ἐκκλησίας
  choice: de l’assemblée
  rationale: Dans ce récit, ἐκκλησία désigne la communauté rassemblée, sans le sens chrétien plus tardif du mot « Église ».
- source_word: εἰς οἶκον ἑαυτοῦ
  choice: jusque chez lui
  rationale: Cette tournure française naturelle exprime l’arrivée dans la demeure d’Ozias tout en complétant le mouvement depuis l’assemblée.
- source_word: ἐποίησεν πότον
  choice: prépara un banquet
  rationale: L’expression signifie littéralement qu’il « fit une beuverie/boisson », mais désigne idiomatiquement l’organisation d’un repas festif où l’on boit.
- source_word: τοῖς πρεσβυτέροις
  choice: pour les anciens
  rationale: Le contexte vise les responsables de la communauté plutôt que de simples hommes âgés.
- source_word: ἐπεκαλέσαντο
  choice: invoquèrent
  rationale: Le verbe désigne ici un appel adressé à Dieu dans la prière. « Invoquèrent » convient au registre biblique tout en restant clair.
- source_word: τὸν θεὸν Ἰσραήλ
  choice: le Dieu d’Israël
  rationale: Rendu direct du titre génitif grec.
- source_word: εἰς βοήθειαν
  choice: afin qu’il leur vienne en aide
  rationale: Cette formulation explicite en français naturel la demande d’aide adressée à Dieu, sans ajouter de contenu substantiel.
- source_word: ὅλην τὴν νύκτα ἐκείνην
  choice: pendant toute cette nuit-là
  rationale: L’accusatif marque l’étendue temporelle et souligne que l’invocation dura toute la nuit en question.
