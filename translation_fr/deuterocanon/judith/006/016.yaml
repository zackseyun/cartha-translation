  yaml_path: translation/deuterocanon/judith/006/016.yaml
  text: And he called together all the elders of the city, and all their young men and women ran together into the assembly, and they set Achior in the midst of all their people, and Uzziah asked him what had happened.
translation:
  language: fr
  text: Il convoqua tous les anciens de la ville. Tous leurs jeunes hommes ainsi que les femmes accoururent à l’assemblée. On plaça Achior au milieu de tout le peuple, et Ozias lui demanda ce qui s’était passé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεκάλεσεν
  choice: convoqua
  rationale: Le verbe exprime l’action de faire venir plusieurs personnes ensemble; « convoqua » convient au contexte civique et reste naturel.
- source_word: πρεσβυτέρους
  choice: anciens
  rationale: Dans ce contexte, il s’agit des responsables reconnus de la communauté, et non simplement d’hommes âgés.
- source_word: συνέδραμον
  choice: accoururent
  rationale: Ce choix conserve l’idée de mouvement rapide et empressé portée par le verbe grec, mieux qu’un simple « se rassemblèrent ».
- source_word: πᾶς νεανίσκος αὐτῶν
  choice: tous leurs jeunes hommes
  rationale: Le singulier distributif grec désigne collectivement les jeunes hommes de la communauté; le pluriel est idiomatique en français.
- source_word: αἱ γυναῖκες
  choice: les femmes
  rationale: La formulation suit l’article défini grec sans ajouter un possessif qui n’est pas explicitement présent.
- source_word: ἐκκλησίαν
  choice: assemblée
  rationale: Dans Judith, le terme désigne le rassemblement de la communauté et ne doit pas être chargé d’un sens ecclésial postérieur.
- source_word: ἔστησαν
  choice: On plaça
  rationale: Avec Achior comme complément et une indication de lieu, le verbe signifie qu’on le fait se tenir ou qu’on le place là; la tournure impersonnelle française évite un « ils » ambigu.
- source_word: ἐν μέσῳ παντὸς τοῦ λαοῦ αὐτῶν
  choice: au milieu de tout le peuple
  rationale: La traduction conserve l’image spatiale et publique de la scène; « le peuple » désigne naturellement ici la communauté locale déjà mentionnée.
- source_word: ἐπηρώτησεν
  choice: demanda
  rationale: Le verbe introduit simplement la question d’Ozias; « demanda » est clair et naturel dans ce récit.
- source_word: τὸ συμβεβηκός
  choice: ce qui s’était passé
  rationale: Le participe parfait substantivé renvoie à l’événement déjà survenu; cette expression restitue naturellement l’antériorité.
