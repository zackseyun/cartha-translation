lexical_decisions:
- source_word: παρεκάλεσαν
  choice: réconfortèrent
  rationale: Dans ce contexte narratif, παρακαλέω exprime vraisemblablement le soutien et le réconfort apportés à Achior. « Réconfortèrent » rend naturellement cette nuance en français, tout en signalant en note l’étendue sémantique du verbe.
- source_word: Ἀχιὼρ
  choice: Achior
  rationale: Le nom propre est conservé sous sa forme française traditionnelle.
- source_word: ἐπήνεσαν
  choice: félicitèrent
  rationale: Le verbe ἐπαινέω signifie louer ou faire l’éloge de quelqu’un. Ici, « félicitèrent » convient à une approbation directement adressée à Achior et sonne plus naturel en français narratif que « louèrent ».
- source_word: σφόδρα
  choice: vivement
  rationale: 'L’adverbe intensifie fortement le verbe précédent. « Vivement » restitue cette intensité dans une expression française courante : « féliciter vivement ».'
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La coordination simple du grec est conservée. Le choix de « réconfortèrent » privilégie le soutien apporté à Achior, tandis que la note maintient l’ambiguïté lexicale de παρακαλέω.
