  text: And they encouraged Achior[a], and praised him greatly.
translation:
  language: fr
  text: Et ils encouragèrent Achior[a] et lui adressèrent de grands éloges.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « réconfortèrent », « exhortèrent » ou « pressèrent » ; le verbe grec peut prendre ces différents sens selon le contexte.
