  source_fidelity: 'Révision nécessaire surtout pour la note a : elle qualifie à tort αὐτοῖς de « pour eux » et présente une pseudo-littéralité qui ne rend pas compte avec précision de la construction δύσκολη αὐτοῖς ἐν αὐτοῖς. Le texte révisé conserve la solution contextuelle (« là même où ils se trouvent ») tout en documentant l’ambiguïté. « Seront enivrées de leur sang » restitue plus directement la métaphore de μεθυσθήσεται. La conclusion est rapprochée de ματαιωθήσεται par « ne seront pas vaines ».'
  naturalness: Le français reste contemporain, soutenu et fluide. « Consumer par le feu » rend avec naturel la force de κατακαύσομεν. Les formulations imagées, notamment « la trace de leurs pas ne subsistera pas », sont lisibles tout en préservant le caractère rhétorique du grec.
  terminology: « Nabuchodonosor » et « seigneur de toute la terre » sont appropriés. La minuscule à « seigneur » convient à cette revendication impériale humaine. « Leurs morts », « plaines » et « frontières » correspondent au registre et aux termes géographiques du texte.
