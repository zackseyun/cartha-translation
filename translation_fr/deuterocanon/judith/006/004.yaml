    rationale: Le datif αὐτοῖς ne doit pas être glosé sans nuance par « pour eux » dans ce contexte. La séquence αὐτοῖς ἐν αὐτοῖς est grammaticalement et textuellement difficile ; il faut la signaler sans lui attribuer une valeur de bénéficiaire non établie.
  - severity: low
    issue: « Gorgées de leur sang » atténue et déplace la métaphore d’ivresse de μεθυσθήσεται.
    rationale: Cette adaptation est possible, mais « seront enivrées de leur sang » rend plus exactement l’image grecque tout en demeurant naturel dans une proclamation poétique et violente.
  - severity: low
    issue: « Ne resteront pas sans effet » interprète quelque peu ματαιωθήσεται.
    rationale: « Ne seront pas vaines » est plus proche du sens de paroles qui ne se révéleront pas vides ou futiles, sans préciser indûment la manière de leur accomplissement.
