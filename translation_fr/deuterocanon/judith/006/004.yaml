  yaml_path: translation/deuterocanon/judith/006/004.yaml
  text: For we will burn them up where they are[a], and their borders will be drenched with their blood, and their plains will be filled with their dead. The trace of their feet will not stand before us, but they will utterly perish, says King Nebuchadnezzar, lord of all the earth. For he said[b], ‘The words of his mouth will not prove empty.’
translation:
  language: fr
  text: 'Car nous les consumerons par le feu, là même où ils se trouvent[a] ; leurs frontières seront enivrées de leur sang[b], et leurs plaines seront remplies de leurs morts. La trace de leurs pas ne subsistera pas devant nous[c] ; au contraire, ils périront totalement, déclare le roi Nabuchodonosor, seigneur de toute la terre. Car il a dit : « Les paroles qu’il a prononcées ne seront pas vaines. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte la suite difficile αὐτοῖς ἐν αὐτοῖς, littéralement « à/eux … en/eux ». Dans ce contexte, elle semble indiquer qu’ils seront consumés là même où ils se trouvent ; la construction exacte demeure inhabituelle.
    reason: textual_or_grammatical_difficulty
  - marker: b
    text: 'Littéralement : « leurs frontières seront enivrées de leur sang ». Le grec emploie une vive métaphore d’ivresse pour décrire l’ampleur du carnage.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « La trace de leurs pas ne tiendra pas contre nous. » L’expression peut évoquer à la fois l’incapacité de résister et la disparition de toute trace des vaincus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαύσομεν γὰρ αὐτοῖς ἐν αὐτοῖς
  choice: Car nous les brûlerons entièrement là où ils se trouvent
  rationale: κατακαίω exprime une destruction complète par le feu. La suite pronominale au datif est inhabituelle dans le texte grec ; la traduction retient le sens locatif probable sans masquer la difficulté, signalée en note.
- source_word: τὰ ὅρια αὐτῶν
  choice: leurs frontières
  rationale: ὅρια désigne les limites, les régions frontalières ou, par extension, le territoire. « Frontières » maintient l’image géographique concrète de la menace militaire.
- source_word: μεθυσθήσεται ἐν τῷ αἵματι αὐτῶν
  choice: seront gorgées de leur sang
  rationale: Le verbe signifie littéralement « être enivré ». Appliqué à un pays, il évoque une saturation sanglante ; « gorgées » transmet cette image avec naturel, tandis que la métaphore exacte est conservée en note.
- source_word: τὰ πεδία αὐτῶν
  choice: leurs plaines
  rationale: πεδία désigne des plaines ou des étendues ouvertes. « Plaines » convient au cadre géographique et militaire.
- source_word: πληρωθήσεται νεκρῶν αὐτῶν
  choice: seront remplies de leurs morts
  rationale: νεκροί peut désigner les morts ou les cadavres. « Leurs morts » reste idiomatique et garde la force funèbre du passage.
- source_word: οὐκ ἀντιστήσεται τὸ ἴχνος τῶν ποδῶν αὐτῶν κατὰ πρόσωπον ἡμῶν
  choice: La trace de leurs pas ne subsistera pas devant nous
  rationale: La formulation grecque associe l’idée de tenir ou résister à l’image d’une trace de pas. « Ne subsistera pas » rend naturellement l’idée qu’il ne restera rien d’eux, sans effacer l’autre nuance possible, donnée en note.
- source_word: ἀλλʼ ἀπωλείᾳ ἀπολοῦνται
  choice: au contraire, ils périront totalement
  rationale: La répétition étymologique du nom et du verbe intensifie la destruction. « Périront totalement » reproduit cette insistance en français courant.
- source_word: κύριος πάσης τῆς γῆς
  choice: seigneur de toute la terre
  rationale: κύριος désigne ici la prétention impériale d’un roi humain. La minuscule distingue ce titre orgueilleux du titre divin tout en traduisant directement le grec.
- source_word: οὐ ματαιωθήσεται τὰ ῥήματα τῶν λόγων αὐτοῦ
  choice: Les paroles qu’il a prononcées ne resteront pas sans effet
  rationale: La tournure grecque est redondante, littéralement « les paroles de ses paroles ». Cette formulation française conserve l’affirmation que ses déclarations ne seront pas vaines, sans reproduire un pléonasme obscur.
theological_decisions:
- issue: Le titre κύριος appliqué à Nabuchodonosor
  choice: seigneur de toute la terre
  alternative: maître de toute la terre
  rationale: Le texte présente une revendication royale universelle, non une attribution implicite de divinité. « Seigneur » traduit κύριος, avec une minuscule qui maintient cette distinction.
- issue: L’assurance que les paroles royales ne seront pas vaines
  choice: ne resteront pas sans effet
  alternative: ne seront pas réduites à néant
  rationale: La traduction exprime la prétention du locuteur à l’accomplissement certain des paroles de Nabuchodonosor, sans approuver théologiquement cette prétention ni lui donner la forme d’une promesse divine.
translation_notes:
  register: Français international contemporain, soutenu mais accessible. Le rythme menaçant de la proclamation est conservé par des propositions coordonnées. Les images géographiques et sanglantes demeurent concrètes, tandis que les constructions grecques les plus difficiles sont rendues lisibles et documentées en notes.
