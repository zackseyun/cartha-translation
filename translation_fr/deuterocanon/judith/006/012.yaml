  text: And when the men of the city saw them on the top of the mountain, they took up their weapons and went out of the city to the top of the mountain; and every man who used a sling held back their ascent and kept throwing stones at them.
translation:
  language: fr
  text: Lorsque les hommes de la ville les virent au sommet de la montagne, ils prirent leurs armes et sortirent de la ville en direction du sommet. Tous les hommes qui maniaient la fronde[a] leur barrèrent la montée et leur lançaient des pierres.
  philosophy: optimal-equivalence
