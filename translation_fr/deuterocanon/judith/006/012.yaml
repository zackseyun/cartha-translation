    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὡς εἶδαν
  choice: Lorsque … virent
  rationale: ὡς suivi de l’aoriste introduit ici le moment qui déclenche la réaction des hommes de la ville. « Lorsque » est naturel en français sans qu’il soit nécessaire de reproduire le καί initial.
- source_word: οἱ ἄνδρες τῆς πόλεως
  choice: les hommes de la ville
  rationale: Cette formulation conserve explicitement le masculin de ἄνδρες et rend simplement le complément τῆς πόλεως.
- source_word: ἐπὶ τὴν κορυφὴν τοῦ ὄρους
  choice: au sommet de la montagne / en direction du sommet
  rationale: κορυφή désigne le sommet. Après un verbe de perception, la première occurrence se comprend comme une localisation; après le verbe de mouvement, la seconde exprime naturellement la direction.
- source_word: ἀνέλαβον τὰ ὅπλα αὐτῶν
  choice: ils prirent leurs armes
  rationale: ἀναλαμβάνω avec ὅπλα décrit le fait de prendre ses armes pour agir. La traduction française est claire et garde la nuance militaire.
- source_word: ἐπῆλθον ἔξω τῆς πόλεως
  choice: sortirent de la ville
  rationale: Avec ἔξω τῆς πόλεως, le mouvement hors de la ville est explicite. La direction vers le sommet est rendue par le complément suivant.
- source_word: πᾶς ἀνὴρ σφενδονήτης
  choice: tous les hommes qui maniaient la fronde
  rationale: La formulation conserve à la fois l’idée distributive de πᾶς, la mention explicite des hommes dans ἀνήρ et le sens spécialisé de σφενδονήτης, tout en restant naturelle en français.
- source_word: διεκράτησαν τὴν ἀνάβασιν αὐτῶν
  choice: leur barrèrent la montée
  rationale: διακρατέω exprime ici l’action de retenir ou d’empêcher l’avancée; « barrer la montée » rend de façon concise la résistance sur un accès ascendant.
- source_word: ἔβαλλον ἐν λίθοις ἐπʼ αὐτούς
  choice: leur lançaient des pierres
  rationale: L’imparfait grec ἔβαλλον présente une action en cours ou répétée. L’imparfait français garde cet aspect, et ἐν λίθοις est rendu instrumentalement.
theological_decisions: []
translation_notes:
  register: Français international actuel, narratif et digne. La répétition intégrale de « au sommet de la montagne » est légèrement allégée à la seconde occurrence sans perte de référent. Le contraste aspectuel entre l’aoriste « barrèrent » et l’imparfait « lançaient » est conservé.
