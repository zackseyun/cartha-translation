  text: And his servants seized him and led him outside the camp into the plain, and they went up from the midst of the plain into the hill country, and they came to the springs that were below Bethulia.
translation:
  language: fr
  text: Ses esclaves le saisirent et le conduisirent hors du camp, dans la plaine. Du milieu de la plaine, ils montèrent vers la région montagneuse et arrivèrent aux sources situées en contrebas de Béthulie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλοι
  choice: serviteurs
  rationale: Dans ce contexte militaire, le terme désigne les hommes placés sous l’autorité d’Holopherne. « Serviteurs » rend naturellement leur relation de dépendance sans affirmer un statut juridique que le contexte immédiat ne précise pas.
- source_word: συνέλαβον
  choice: saisirent
  rationale: Le verbe exprime ici l’action énergique de mettre la main sur quelqu’un; « saisirent » conserve cette force sans introduire la notion juridique d’une arrestation.
- source_word: παρεμβολῆς
  choice: camp
  rationale: Dans un récit militaire, παρεμβολή désigne couramment le campement d’une armée; « camp » est précis et naturel.
- source_word: πεδίον / πεδινῆς
  choice: plaine
  rationale: Le passage oppose une zone basse et plane à la région montagneuse. « Plaine » rend clairement ce contraste topographique.
- source_word: ἀπῆραν
  choice: montèrent
  rationale: Le verbe est employé sans complément d’objet exprimé et marque leur départ ou leur progression. La destination, la région montagneuse, justifie « montèrent », tout en évitant de répéter artificiellement « le ».
- source_word: ὀρεινήν
  choice: région montagneuse
  rationale: Le substantif adjectival désigne une contrée de relief élevé, en contraste avec la plaine; « région montagneuse » est idiomatique en français international.
- source_word: παρεγένοντο
  choice: arrivèrent
  rationale: Le verbe marque l’arrivée à un endroit; « arrivèrent » convient à la progression narrative.
- source_word: πηγάς
  choice: sources
  rationale: Le mot désigne ici des points d’émergence naturels de l’eau dans le paysage.
- source_word: ὑποκάτω
  choice: en contrebas de
  rationale: L’expression indique une position géographique plus basse que Béthulie; « en contrebas de » est plus précis et naturel que le simple « sous ».
- source_word: Βετυλουά
  choice: Béthulie
  rationale: La forme française traditionnelle et intelligible du nom de lieu grec Βετυλουά est « Béthulie ».
