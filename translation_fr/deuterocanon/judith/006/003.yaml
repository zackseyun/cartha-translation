base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/003.yaml
  text: But we[a], his servants, will strike them down as one man, and they will not withstand the might of our horses.
translation:
  language: fr
  text: Mais nous, ses esclaves, nous les abattrons comme un seul homme[a], et ils ne résisteront pas à la puissance de nos chevaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme s’ils n’étaient qu’un seul homme ». L’expression grecque peut souligner soit l’unité de l’action menée contre eux, soit la facilité avec laquelle ils seront vaincus.
    reason: alternative lexicale et ambiguïté de l’expression grecque
lexical_decisions:
- source_word: δοῦλοι
  choice: esclaves
  rationale: Le terme exprime une entière subordination au maître. Dans cette déclaration militaire, « esclaves » conserve plus nettement ce rapport d’appartenance que « serviteurs ».
- source_word: πατάξομεν
  choice: nous les abattrons
  rationale: Le verbe désigne ici une action violente dans un contexte guerrier. « Abattre » rend naturellement en français l’idée de frapper et de terrasser.
- source_word: ὡς ἄνθρωπον ἕνα
  choice: comme un seul homme
  rationale: 'Cette traduction conserve l’expression grecque et son ambiguïté : elle peut suggérer une action unifiée ou la facilité avec laquelle les adversaires seront vaincus comme s’ils n’étaient qu’un seul homme.'
- source_word: ὑποστήσονται
  choice: ils ne résisteront pas
  rationale: Dans ce contexte militaire, le verbe exprime le fait de tenir face à une force adverse.
- source_word: κράτος
  choice: puissance
  rationale: Le mot évoque une force manifeste et dominante au combat ; « puissance » convient à la charge ou à la force des chevaux.
- source_word: ἵππων
  choice: chevaux
  rationale: Le grec nomme explicitement les chevaux, plutôt que la cavalerie ou les cavaliers.
theological_decisions:
- issue: Traduction de δοῦλοι
  choice: esclaves
  alternative: serviteurs
  rationale: « Esclaves » préserve la force du rapport de possession et de subordination exprimé par le grec, sans atténuer le terme en fonction d’une préférence confessionnelle.
translation_notes:
  register: Français moderne, soutenu mais accessible. La reprise « nous, ses esclaves, nous… » est naturelle en français et met en relief le sujet. L’expression imagée « comme un seul homme » est conservée, avec une note pour préserver son ambiguïté.
