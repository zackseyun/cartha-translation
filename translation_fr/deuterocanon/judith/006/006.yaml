  text: and then the iron of my army and the people of my servants will pass through your sides[a], and you will fall among their wounded when they return[c][b];
translation:
  language: fr
  text: Alors, le fer de mon armée[a] et les hommes de mes serviteurs traverseront tes flancs[b] ; tu tomberas parmi leurs blessés[c] lorsqu’ils reviendront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le fer de mon armée ». Le fer désigne probablement ici, par métonymie, les armes ou la force armée ; on pourrait aussi traduire plus explicitement : « les épées de mon armée ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot grec peut désigner les côtés, les flancs ou les côtes.
    reason: lexical_alternative
  - marker: c
    text: L’expression grecque « parmi leurs blessés » est concise et conserve une ambiguïté quant au référent précis de « leurs ». Elle peut désigner les blessés associés aux hommes mentionnés, parmi lesquels l’interlocuteur tombera.
    reason: lexical_alternative
lexical_decisions:
- source_word: διελεύσεται
  choice: traverseront
  rationale: Le verbe exprime le passage à travers quelque chose ; dans cette menace militaire, « traverseront » conserve à la fois le mouvement et la violence implicite sans préciser indûment l’arme employée.
- source_word: ὁ σίδηρος
  choice: le fer
  rationale: Le grec dit littéralement « le fer », probablement par métonymie pour les armes de fer. La formulation française garde cette image vive et ne la réduit pas à la seule épée.
- source_word: τῆς στρατείας μου
  choice: de mon armée
  rationale: Dans ce contexte, στρατεία désigne la force militaire plutôt que la campagne considérée abstraitement.
- source_word: ὁ λαὸς τῶν θεραπόντων μου
  choice: les gens de mes serviteurs
  rationale: « Les gens » rend λαός sans transformer explicitement le groupe en « troupes », tandis que « serviteurs » convient au rapport de service exprimé par θεραπόντων. La tournure légèrement solennelle reflète celle du grec.
- source_word: τὰς πλευράς σου
  choice: tes flancs
  rationale: πλευρά peut désigner les côtés, les flancs ou les côtes. « Flancs » convient à la fois à une personne et, par personnification, à un groupe ou à une position militaire.
- source_word: πεσῇ
  choice: tu tomberas
  rationale: « Tomber » conserve l’expression sobre du grec, qui peut évoquer la mise hors de combat ou la mort sans trancher entre elles.
- source_word: ἐν τοῖς τραυματίαις αὐτῶν
  choice: parmi leurs blessés
  rationale: Cette traduction directe garde la formulation grecque compacte et l’ambiguïté du possessif, explicitées en note.
- source_word: ὅταν ἐπιστρέψωσιν
  choice: lorsqu’ils reviendront
  rationale: ὅταν suivi du subjonctif situe ici l’action dans un avenir indéfini. « Lorsqu’ils reviendront » est naturel en français et conserve le sens de retour.
