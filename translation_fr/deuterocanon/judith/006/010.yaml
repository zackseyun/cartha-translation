review_pass:
  verdict: revise
  source_fidelity: Le texte rend fidèlement la chaîne d’ordres et les infinitifs grecs. Toutefois, τοῖς δούλοις désigne littéralement les esclaves d’Holopherne; « serviteurs » atténue le terme et laisse indéterminé un statut que le grec exprime. « Auprès de lui » est possible dans le champ de παρίστημι, mais « dans sa tente » rend plus directement l’indication explicite ἐν τῇ σκηνῇ αὐτοῦ sans ajouter une localisation relationnelle.
  naturalness: La formulation est fluide et relève d’un français moderne et digne. « se tenaient là dans sa tente » est naturel dans ce contexte narratif et conserve l’idée de présence/attente.
  terminology: « Esclaves » restitue le sens usuel et concret de δοῦλοι. « Tente », « saisir », « ramener », « livrer aux mains de » et « fils d’Israël » sont exacts et bien adaptés. Holopherne, Achior et Bétyloua sont cohérents avec une translittération française proche du grec; la note signale utilement Béthulie.
  issues:
  - severity: medium
    issue: τοῖς δούλοις est traduit par « ses serviteurs ».
    rationale: Dans ce récit, δοῦλοι désigne les esclaves appartenant à Holopherne; « serviteurs » peut désigner de simples employés ou assistants et affaiblit la précision sociale du grec.
  - severity: low
    issue: « qui se tenaient auprès de lui dans sa tente » explicite la proximité personnelle.
    rationale: Le grec localise explicitement ces hommes dans la tente d’Holopherne. Le participe peut certes évoquer leur présence auprès de lui, mais une formulation sans cette explicitation préserve plus strictement la portée du texte.
