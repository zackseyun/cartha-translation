  text: And Holofernes ordered his servants[a], who were standing by in his tent[b], to seize Achior and take him back to Bethyloua and hand him over into the hands of the sons of Israel.
translation:
  language: fr
  text: Alors Holopherne ordonna à ses esclaves, qui se tenaient là dans sa tente, de saisir Achior, de le ramener à Bétyloua[a] et de le livrer aux mains des fils d’Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aussi appelée « Béthulie » dans la forme française traditionnelle du nom.
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque signifie littéralement « les fils d’Israël » ; elle désigne ici collectivement le peuple d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέταξεν
  choice: ordonna
  rationale: Le verbe exprime ici un ordre donné avec autorité; « ordonna » est direct, naturel et fidèle au contexte militaire.
- source_word: τοῖς δούλοις αὐτοῦ
  choice: à ses serviteurs
  rationale: Dans cette scène, le terme désigne les hommes attachés au service personnel d’Holopherne. « Serviteurs » préserve cette relation de subordination sans préciser davantage un statut juridique que le contexte immédiat ne développe pas.
- source_word: παρεστηκότες
  choice: qui se tenaient auprès de lui
  rationale: Le participe décrit des serviteurs présents et disponibles devant Holopherne; cette formulation rend à la fois la proximité et la posture d’attente.
- source_word: σκηνῇ
  choice: tente
  rationale: Dans le camp militaire du récit, σκηνή désigne une tente ordinaire, non un sanctuaire.
- source_word: συλλαβεῖν
  choice: saisir
  rationale: Le verbe implique une prise coercitive; « saisir » conserve cette force sans introduire la procédure juridique suggérée par « arrêter ».
- source_word: ἀποκαταστῆσαι
  choice: ramener
  rationale: Dans la suite d’ordres, le verbe signifie conduire Achior jusqu’à Bétyloua, lieu auquel il est renvoyé; « ramener » est idiomatique et garde l’idée de retour.
- source_word: Βετυλουὰ
  choice: Bétyloua
  rationale: Translittération française proche de la forme grecque, avec accents adaptés à la lecture en français.
- source_word: παραδοῦναι
  choice: livrer
  rationale: « Livrer » exprime clairement la remise d’Achior au pouvoir d’autrui et convient au registre narratif biblique.
- source_word: εἰς χεῖρας
  choice: aux mains de
  rationale: Cette tournure conserve l’image grecque du transfert sous le pouvoir de quelqu’un tout en restant naturelle en français.
- source_word: υἱῶν Ἰσραήλ
  choice: des fils d’Israël
  rationale: La traduction maintient l’expression filiale masculine explicite du grec et sa résonance biblique; elle désigne collectivement le peuple d’Israël.
theological_decisions:
- issue: Sens de δοῦλοι dans l’entourage d’Holopherne
  choice: ses serviteurs
  alternative: ses esclaves
  rationale: Le mot peut désigner des esclaves, mais le contexte immédiat met surtout en avant leur fonction auprès du commandant. « Serviteurs » conserve la subordination sans trancher plus précisément leur statut social.
- issue: Portée de l’expression υἱῶν Ἰσραήλ
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le grec emploie littéralement « fils »; la formulation est donc conservée, avec une note indiquant sa portée collective afin de ne pas la réduire aux seuls hommes individuellement considérés.
translation_notes:
  register: Français moderne, international et digne, avec une syntaxe narrative fluide. Les images bibliques « aux mains de » et « fils d’Israël » sont conservées, tandis que les notes éclairent le nom de lieu traditionnel et la portée collective de l’expression.
