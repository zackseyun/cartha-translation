base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/005.yaml
  text: But you[a], Achior, hireling of Ammon, who spoke these words in the day of your injustice[b], shall no longer see my face from this day until I take vengeance
translation:
  language: fr
  text: Mais toi, Achior, homme à la solde[a] d’Ammon, qui as prononcé ces paroles au jour de ton injustice[b], tu ne verras plus mon visage à partir d’aujourd’hui, jusqu’à ce que j’exerce ma vengeance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « salarié » ou « mercenaire » ; le terme grec désigne quelqu’un qui sert contre rémunération.
    reason: lexical_alternative
  - marker: b
    text: 'L’expression peut aussi se comprendre : « au jour de ta faute » ou « au temps de ton injustice ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθωτὲ
  choice: homme à la solde
  rationale: Désigne une personne qui sert contre rémunération. « Homme à la solde » est naturel en français, conserve ici la nuance méprisante de l’apostrophe et évite de préciser indûment une fonction militaire.
- source_word: τοῦ Ἀμμών
  choice: d’Ammon
  rationale: Rend directement le génitif d’appartenance ou d’origine, sans le transformer en adjectif ethnique.
- source_word: ἐλάλησας τοὺς λόγους τούτους
  choice: qui as prononcé ces paroles
  rationale: Expression française naturelle et digne qui maintient la référence explicite aux paroles précédemment dites par Achior.
- source_word: ἐν ἡμέρᾳ ἀδικίας σου
  choice: au jour de ton injustice
  rationale: Conserve la formulation inhabituelle et accusatrice du grec ainsi que l’ambiguïté d’ἀδικία entre injustice, faute et conduite déloyale.
- source_word: οὐκ ὄψῃ ἔτι τὸ πρόσωπόν μου
  choice: tu ne verras plus mon visage
  rationale: Préserve l’image sémitisante du visage et sa portée relationnelle, tout en restant idiomatique en français.
- source_word: ἀπὸ τῆς ἡμέρας ταύτης
  choice: à partir d’aujourd’hui
  rationale: Formulation actuelle et claire de la limite temporelle introduite par le grec.
- source_word: ἕως οὗ ἐκδικήσω
  choice: jusqu’à ce que j’exerce ma vengeance
  rationale: Rend la valeur punitive d’ἐκδικέω sans préciser l’objet, absent du texte grec conservé.
theological_decisions:
- issue: Sens d’ἀδικία dans une accusation royale hostile
  choice: au jour de ton injustice
  alternative: au jour de ta faute ; au temps de ton iniquité
  rationale: « Injustice » reste proche de la valeur lexicale et ne tranche pas entre culpabilité morale, offense personnelle et déloyauté politique.
- issue: Objet implicite de ἐκδικήσω
  choice: jusqu’à ce que j’exerce ma vengeance
  alternative: jusqu’à ce que je me venge ; jusqu’à ce que je punisse
  rationale: Le grec ne donne pas d’objet explicite dans le segment transmis. La traduction conserve cette suspension plutôt que d’ajouter la personne ou l’acte visé.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. L’apostrophe demeure dure et méprisante. La phrase reste ouverte à la fin, conformément au texte grec fourni, qui s’arrête après « j’exerce ma vengeance ».
