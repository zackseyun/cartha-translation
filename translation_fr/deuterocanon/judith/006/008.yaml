  text: and he will not perish until you are destroyed with them[a].
translation:
  language: fr
  text: Et il ne périra pas jusqu’à ce que tu sois anéanti avec eux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il ne sera pas détruit jusqu’à ce que tu sois entièrement détruit avec eux » — le grec emploie deux verbes de destruction, dont le second est plus intensif.'
    reason: Variante lexicale préservant la distinction entre ἀπόλλυμι et ἐξολεθρεύω sans affirmer une parenté étymologique.
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction de coordination qui maintient simplement le lien avec la proposition précédente.
- source_word: ἀπολῇ
  choice: il ne périra pas
  rationale: 'Le verbe ἀπόλλυμι est ici au moyen, avec un sens intransitif : « périr » rend naturellement l’idée de connaître la ruine sans imposer une construction passive.'
- source_word: ἕως οὗ
  choice: jusqu’à ce que
  rationale: Cette locution conjonctive exprime une limite temporelle et appelle ici naturellement le subjonctif en français.
- source_word: ἐξολεθρευθῇς
  choice: tu sois anéanti
  rationale: Le passif de ἐξολεθρεύω exprime une destruction complète. « Anéanti » conserve cette intensité dans un français actuel et digne.
- source_word: μετʼ αὐτῶν
  choice: avec eux
  rationale: Rend directement et sans ajout la notion d’accompagnement.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et solennel. Le tutoiement correspond au singulier grec. La formulation conserve la différence d’intensité entre « périr » et « être anéanti ».
