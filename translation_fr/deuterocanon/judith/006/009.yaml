  text: And if you hope in your heart that they will not be taken[a], do not let your face fall. I have spoken[b], and none of my words will fail.
translation:
  language: fr
  text: Et si tu espères dans ton cœur qu’ils ne seront pas pris[a], ne prends pas un air abattu[b]. J’ai parlé, et aucune de mes paroles ne restera sans effet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils ne seront pas capturés ». Dans ce contexte, le passif grec peut naturellement avoir un sens militaire.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, « que ton visage ne tombe pas » : expression désignant l’abattement ou le découragement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπερ
  choice: Et si
  rationale: Rend le lien avec le discours précédent et la valeur conditionnelle légèrement appuyée, sans alourdir le français.
- source_word: ἐλπίζεις τῇ καρδίᾳ σου
  choice: tu espères dans ton cœur
  rationale: Conserve l’image anthropologique grecque et exprime naturellement une espérance ou conviction intérieure.
- source_word: οὐ λημφθήσονται
  choice: ils ne seront pas pris
  rationale: Préserve le passif et l’étendue sémantique de λαμβάνω; dans ce contexte militaire, « capturés » est également possible.
- source_word: μὴ συμπεσέτω σου τὸ πρόσωπον
  choice: ne laisse pas ton visage s’abattre
  rationale: Maintient l’image corporelle grecque tout en employant une formulation compréhensible en français moderne.
- source_word: ἐλάλησα
  choice: J’ai parlé
  rationale: Le passé composé convient au caractère solennel de la déclaration et à sa conséquence présente.
- source_word: οὐδὲν διαπεσεῖται τῶν ῥημάτων μου
  choice: aucune de mes paroles ne restera sans effet
  rationale: Exprime que rien de ce qui a été annoncé ne manquera de s’accomplir, dans un français naturel et digne.
theological_decisions:
- issue: Expression imagée du découragement
  choice: ne laisse pas ton visage s’abattre
  alternative: ne sois pas abattu
  rationale: La traduction retenue préserve l’image visible du grec plutôt que de la remplacer entièrement par son interprétation émotionnelle.
- issue: Efficacité ou accomplissement des paroles annoncées
  choice: aucune de mes paroles ne restera sans effet
  alternative: aucune de mes paroles ne faillira
  rationale: La formulation indique que les paroles ne manqueront pas leur accomplissement sans préciser davantage le mécanisme, préservant ainsi la portée du grec.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond au singulier grec. Les images du cœur et du visage sont conservées, avec une note pour éclairer l’idiome moins naturel en français.
