  text: 'who were in those days: Uzziah son of Micah[a], from the tribe of Simeon, and Chabris son of Gothoniel, and Charmis son of Melchiel.'
translation:
  language: fr
  text: 'qui étaient en ces jours-là[a] : Ozias, fils de Michée, de la tribu de Siméon, Chabris, fils de Gothoniel, et Charmis, fils de Melchiel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui étaient en ces jours-là ». La formule ne précise pas elle-même s’il s’agit d’hommes exerçant une fonction ou simplement présents à ce moment-là.'
    reason: Préserver l’ambiguïté de la formule grecque sans ajouter de nuance spatiale.
lexical_decisions:
- source_word: οἳ ἦσαν ἐν ταῖς ἡμέραις ἐκείναις
  choice: qui étaient là en ce temps-là
  rationale: La tournure conserve le verbe simple « être » et l’expression temporelle du grec. « Là » rend la phrase naturelle en français sans préciser si ces hommes exerçaient une fonction ou étaient simplement présents.
- source_word: Ὀζείας
  choice: Ozias
  rationale: Forme française traditionnelle et transparente du nom grec.
- source_word: ὁ τοῦ Μειχὰ
  choice: fils de Michée
  rationale: L’article suivi du génitif exprime ici la filiation ; « fils de » est l’équivalent français naturel.
- source_word: ἐκ τῆς φυλῆς Συμεὼν
  choice: de la tribu de Siméon
  rationale: Rend clairement l’appartenance tribale exprimée par ἐκ tout en restant idiomatique.
- source_word: Χαβρεὶς
  choice: Chabris
  rationale: Translittération directe du nom grec, avec « Ch » pour le khi initial.
- source_word: ὁ τοῦ Γοθονιὴλ
  choice: fils de Gothoniel
  rationale: Explicite naturellement en français la formule grecque de filiation.
- source_word: Χαρμεὶς
  choice: Charmis
  rationale: Translittération directe du nom propre grec.
- source_word: ὁ τοῦ Μελχειήλ
  choice: fils de Melchiel
  rationale: Explicite naturellement en français la formule grecque de filiation.
theological_decisions:
- issue: Fonction ou simple présence des hommes désignés
  choice: Ne pas préciser leur fonction dans le texte
  alternative: « qui exerçaient alors leur fonction » ou « qui vivaient en ce temps-là »
  rationale: Le grec dit simplement qu’ils « étaient » en ces jours-là. Le contexte peut suggérer qu’ils détenaient une charge ou se trouvaient présents, mais le texte ne l’énonce pas explicitement.
translation_notes:
  register: Français moderne, clair et digne. Les noms propres suivent des formes françaises usuelles lorsque celles-ci sont bien établies ; les noms plus rares sont translittérés directement du grec.
