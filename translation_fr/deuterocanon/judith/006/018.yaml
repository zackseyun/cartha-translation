  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσόντες
  choice: tomba à terre
  rationale: Le participe aoriste exprime une action antérieure aux verbes principaux. « Tomba à terre » conserve le geste physique sans expliciter davantage qu’il ne s’agit d’une prosternation.
- source_word: ὁ λαός
  choice: le peuple
  rationale: Équivalent collectif courant et naturel de λαός dans ce contexte.
- source_word: προσεκύνησαν
  choice: adora
  rationale: Avec Dieu comme destinataire, le verbe désigne clairement un acte d’adoration religieuse. Le singulier s’accorde naturellement avec le collectif « le peuple ».
- source_word: τῷ θεῷ
  choice: Dieu
  rationale: Le nom s’emploie naturellement sans article en français lorsqu’il désigne Dieu.
- source_word: ἐβόησαν
  choice: ils crièrent
  rationale: Le verbe exprime un appel prononcé à haute voix et avec intensité. Le pluriel rend clairement les membres du peuple comme sujets de l’action.
- source_word: λέγοντες
  choice: ':'
  rationale: En français moderne, les deux-points introduisent naturellement les paroles annoncées par le participe « disant », sans alourdir la phrase.
theological_decisions: []
translation_notes:
  register: Français international moderne, courant et digne. La phrase est divisée en deux propositions pour éviter l’enchaînement lourd « et… et… disant », tout en conservant la succession des actions et l’ouverture sur les paroles du verset suivant.
