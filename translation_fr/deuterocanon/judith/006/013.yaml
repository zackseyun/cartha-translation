  text: And after going down below the mountain[a], they bound Achior and left him lying at the foot of the mountain, and they went away to their lord.
translation:
  language: fr
  text: Après être descendus au bas de la montagne, ils ligotèrent Achior et le laissèrent étendu[a] au pied de la montagne, puis ils s’en allèrent vers leur maître.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « jeté ». Le grec souligne qu’Achior fut laissé dans l’état où on l’avait jeté à terre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδύσαντες ὑποκάτω τοῦ ὄρους
  choice: Après être descendus en contrebas de la montagne
  rationale: Cette formulation rend le mouvement vers le bas et la position inférieure exprimés par le participe et ὑποκάτω, sans donner à entendre qu’ils passent sous la montagne.
- source_word: ἔδησαν
  choice: ils ligotèrent
  rationale: « Ligoter » exprime naturellement en français l’action d’attacher Achior pour l’immobiliser.
- source_word: ἀφῆκαν ἐρριμμένον
  choice: le laissèrent étendu[a]
  rationale: La construction décrit Achior laissé dans l’état résultant d’avoir été jeté à terre. « Étendu » convient au récit français, tandis que la note conserve la nuance plus forte du grec.
- source_word: ὑπὸ τὴν ῥίζαν τοῦ ὄρους
  choice: au pied de la montagne
  rationale: La « racine » d’une montagne désigne idiomatiquement sa base ; « au pied de la montagne » en est l’équivalent français naturel.
- source_word: ἀπῴχοντο
  choice: ils s’en allèrent
  rationale: Cette tournure rend simplement leur départ, sans préciser plus que le grec les circonstances du mouvement.
- source_word: πρὸς τὸν κύριον αὐτῶν
  choice: vers leur maître
  rationale: Dans ce contexte militaire, κύριος désigne leur supérieur humain. « Maître » est clair et naturel en français, sans suggérer un titre divin.
- source_word: τὸν Ἀχιὼρ
  choice: Achior
  rationale: Le nom propre est conservé sous sa forme française traditionnelle.
theological_decisions:
- issue: Sens de κύριος appliqué à un supérieur humain
  choice: leur maître
  alternative: leur seigneur
  rationale: Le possessif et le contexte indiquent sans ambiguïté un supérieur humain. « Maître » évite une possible lecture divine tout en gardant le rapport d’autorité.
translation_notes:
  register: Français moderne, narratif et digne. La syntaxe participiale grecque est rendue par une proposition temporelle naturelle ; la répétition de « montagne » est conservée parce qu’elle structure précisément la géographie de la scène.
