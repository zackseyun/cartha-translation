base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/019.yaml
  text: Lord[a], God of heaven, look upon their arrogance, and have mercy on the humiliation of our people, and look upon the face of those sanctified to you on this day.
translation:
  language: fr
  text: Seigneur, Dieu du ciel, considère leur arrogance, prends pitié de l’humiliation de notre peuple et porte ton regard sur le visage de ceux qui te sont consacrés[a] en ce jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui ont été sanctifiés pour toi » ou « tes saints ». Le grec désigne littéralement ceux qui ont été rendus saints ou mis à part pour toi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Seigneur
  rationale: Vocatif de κύριος adressé à Dieu ; « Seigneur » est la formulation française biblique naturelle et digne.
- source_word: ὁ θεὸς τοῦ οὐρανοῦ
  choice: Dieu du ciel
  rationale: Titre biblique conventionnel qui conserve la construction au génitif et son sens.
- source_word: κάτιδε
  choice: considère
  rationale: L’impératif demande à Dieu de regarder attentivement la situation ; « considère » rend cette nuance de regard engagé dans une prière.
- source_word: τὰς ὑπερηφανίας αὐτῶν
  choice: leur arrogance
  rationale: Le pluriel grec peut désigner les manifestations de leur orgueil ; le collectif singulier « arrogance » est naturel en français.
- source_word: ἐλέησον
  choice: prends pitié de
  rationale: Expression idiomatique et solennelle qui rend l’appel à la compassion contenu dans ἐλεέω.
- source_word: τὴν ταπείνωσιν τοῦ γένους ἡμῶν
  choice: l’humiliation de notre peuple
  rationale: ταπείνωσις évoque ici l’abaissement subi, tandis que γένος désigne la collectivité d’Israël plutôt qu’une catégorie raciale moderne.
- source_word: ἐπίβλεψον ἐπὶ τὸ πρόσωπον
  choice: porte ton regard sur
  rationale: Cette tournure française transmet l’idée de regarder avec attention ; elle évite le peu naturel « regarde sur le visage » tout en conservant l’image du regard divin tourné vers des personnes.
- source_word: τῶν ἡγιασμένων σοι
  choice: ceux qui te sont consacrés
  rationale: Le participe parfait passif de ἁγιάζω désigne ceux qui ont été mis à part pour Dieu ; « consacrés » exprime naturellement en français cette relation sans préciser indûment leur identité.
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: en ce jour
  rationale: Formulation française solennelle qui garde la valeur temporelle et déictique du grec.
theological_decisions:
- issue: Sens de τῶν ἡγιασμένων σοι
  choice: ceux qui te sont consacrés
  alternative: ceux qui ont été sanctifiés pour toi ; tes saints
  rationale: Le grec peut mettre l’accent sur la consécration, sur la sanctification accomplie ou désigner substantivement des « saints ». Le texte retient la formulation française la plus naturelle sans imposer un sens cultuel, angélique ou confessionnel plus étroit ; la note conserve les autres nuances.
translation_notes:
  register: Français international moderne, naturel et digne, avec une cadence de prière. Le parallélisme des impératifs est conservé sans reproduire mécaniquement les deux verbes grecs de vision par une répétition française lourde.
