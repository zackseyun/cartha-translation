  text: Then the sons of Israel came down from their city and confronted him[a]; and after untying him, they brought him to Bethyloua and brought him before the rulers of their city[c][b],
translation:
  language: fr
  text: Les fils d’Israël descendirent alors de leur ville et arrivèrent auprès de lui[a]. Après l’avoir détaché, ils l’emmenèrent à Béthulie et le conduisirent devant les chefs de leur ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « s’approchèrent de lui » ou « se tinrent près de lui ». Le verbe grec peut exprimer le fait de survenir, de s’approcher ou de se tenir auprès de quelqu’un.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβάντες
  choice: descendirent
  rationale: Rend le mouvement géographique exprimé par le participe aoriste de καταβαίνω, tout en l’intégrant naturellement au récit français.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: les fils d’Israël
  rationale: Conserve la désignation biblique traditionnelle et l’expression familiale masculine du grec, plutôt que de la remplacer par « les Israélites ».
- source_word: ἐπέστησαν αὐτῷ
  choice: arrivèrent auprès de lui
  rationale: ἐφίστημι peut désigner le fait de survenir, de s’approcher ou de se tenir près de quelqu’un. Cette formulation convient au contexte sans ajouter l’idée hostile d’une confrontation.
- source_word: λύσαντες αὐτόν
  choice: après l’avoir détaché
  rationale: Le contexte indique qu’Achior était attaché; « détaché » exprime concrètement l’action de λύω.
- source_word: ἀπήγαγον
  choice: ils l’emmenèrent
  rationale: Le verbe signifie conduire ou emmener quelqu’un; « emmenèrent » garde ce mouvement vers la destination indiquée.
- source_word: εἰς τὴν Βετυλουά
  choice: à Béthulie
  rationale: Emploie la forme française traditionnelle et largement reconnue du nom de lieu grec Βετυλουά.
- source_word: κατέστησαν αὐτὸν ἐπὶ τοὺς ἄρχοντας
  choice: le conduisirent devant les chefs
  rationale: Dans ce contexte, καθίστημι décrit la présentation d’Achior devant les autorités et non sa nomination à une fonction.
- source_word: οἱ ἄρχοντες
  choice: les chefs
  rationale: Désigne de façon générale les personnes qui exercent l’autorité dans la ville, sans préciser indûment leur structure politique.
