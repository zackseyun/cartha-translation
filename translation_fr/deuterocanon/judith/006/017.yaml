  yaml_path: translation/deuterocanon/judith/006/017.yaml
  text: And in answer he reported to them the words of Holofernes’ council[a], and all the words that he had spoken in the midst of the rulers of the sons of Asshur[b], and whatever boastful things Holofernes had spoken against the house of Israel.
translation:
  language: fr
  text: En réponse, il leur rapporta les propos tenus lors du conseil d’Holopherne, toutes les paroles qu’il avait lui-même prononcées au milieu des chefs des fils d’Assur[a], ainsi que toutes les paroles pleines d’arrogance qu’Holopherne avait prononcées contre la maison d’Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire les Assyriens. Le grec dit littéralement « les fils d’Assur ».
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec désigne des paroles orgueilleuses ou présomptueuses. « Contre » peut aussi se traduire, plus littéralement et plus neutralement, par « au sujet de ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: En réponse
  rationale: Conserve la valeur responsive du participe tout en employant une formule française naturelle.
- source_word: ἀπήγγειλεν
  choice: il leur rapporta
  rationale: Le verbe désigne ici la transmission fidèle d’un compte rendu.
- source_word: τὰ ῥήματα τῆς συνεδρείας Ὀλοφέρνου
  choice: les propos tenus lors du conseil d’Holopherne
  rationale: Cette formulation rend le génitif grec de manière intelligible sans confondre « conseil » au sens d’assemblée avec un avis donné.
- source_word: ἐν μέσῳ τῶν ἀρχόντων
  choice: au milieu des chefs
  rationale: Rend directement l’image spatiale grecque, tout en restant idiomatique en français.
- source_word: υἱῶν Ἀσσούρ
  choice: des fils d’Assur
  rationale: Préserve l’ethnonyme stylisé et littéral du grec plutôt que de le normaliser silencieusement en « Assyriens ».
- source_word: ἐμεγαλορρημόνησεν
  choice: avait prononcées pleines d’arrogance
  rationale: Le verbe rare évoque un discours orgueilleux et présomptueux; la tournure choisie maintient aussi la répétition des paroles dans le verset.
- source_word: εἰς τὸν οἶκον Ἰσραήλ
  choice: contre la maison d’Israël
  rationale: Dans ce contexte hostile, « contre » exprime naturellement l’orientation agressive du discours.
theological_decisions:
- issue: Désignation ethnique υἱῶν Ἀσσούρ
  choice: les fils d’Assur
  alternative: les Assyriens
  rationale: La forme littérale conserve la texture ethnogéographique du grec sans imposer une normalisation interprétative.
- issue: Portée de εἰς dans le discours arrogant d’Holopherne
  choice: contre la maison d’Israël
  alternative: au sujet de la maison d’Israël
  rationale: Le contexte de menace favorise nettement le sens hostile, mais la note signale que la préposition peut être rendue plus neutrement.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « paroles » est volontaire afin de refléter l’insistance du grec; « lui-même » clarifie que la première occurrence renvoie au rapporteur, tandis qu’Holopherne est explicitement nommé dans la dernière proposition.
