base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/010.yaml
  text: You have done all these things by your hand[a]; you have done good things for Israel, and God has been pleased with them[b]. May you be blessed by the Almighty Lord forever.
translation:
  language: fr
  text: Tu as accompli tout cela de ta propre main ; tu as fait du bien à Israël[a], et Dieu y a pris plaisir[b]. Sois bénie par le Seigneur tout-puissant pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu as fait les bonnes choses avec Israël ». Dans ce contexte, l’expression signifie probablement qu’elle a agi pour le bien d’Israël.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Dieu a pris plaisir en eux ». Le pronom peut renvoyer au bien accompli ou, moins probablement, au peuple d’Israël.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐποίησας πάντα ταῦτα ἐν χειρί σου
  choice: Tu as accompli tout cela de ta propre main
  rationale: Le passé composé convient à cette récapitulation élogieuse d’actes achevés dont les effets demeurent. « De ta propre main » restitue naturellement en français la valeur instrumentale et emphatique de l’expression grecque.
- source_word: ἐποίησας τὰ ἀγαθὰ μετὰ Ἰσραήλ
  choice: tu as fait du bien à Israël
  rationale: La tournure française idiomatique rend τὰ ἀγαθὰ sans lourdeur et comprend μετά dans son sens contextuel de relation bénéfique envers Israël, tout en signalant en note la lecture plus littérale.
- source_word: εὐδόκησεν ἐπʼ αὐτοῖς ὁ θεός
  choice: Dieu y a pris plaisir
  rationale: Cette formulation naturelle exprime l’approbation divine. Le pronom adverbial « y » garde une certaine souplesse quant à son antécédent, probablement le bien accompli.
- source_word: εὐλογημένη γίνου
  choice: Sois bénie
  rationale: L’impératif grec constitue ici une formule de bénédiction. L’accord féminin explicite que les paroles s’adressent à Judith.
- source_word: παρὰ τῷ παντοκράτορι κυρίῳ
  choice: par le Seigneur tout-puissant
  rationale: « Seigneur » rend le titre divin κύριος et « tout-puissant » traduit παντοκράτωρ. « Par » exprime la source ou l’agent de la bénédiction.
- source_word: εἰς τὸν αἰῶνα χρόνον
  choice: pour toujours
  rationale: Expression française courante et digne qui rend la durée sans fin indiquée par la formule grecque.
theological_decisions:
- issue: Valeur de κύριος dans la formule divine
  choice: Seigneur
  alternative: Maître
  rationale: Dans ce contexte de bénédiction adressée par le Dieu παντοκράτωρ, « Seigneur » est le titre divin français naturel et ne réduit pas κύριος à une simple relation humaine de maîtrise.
- issue: Force de εὐλογημένη γίνου
  choice: Sois bénie
  alternative: Puisses-tu être bénie
  rationale: L’impératif est conservé sous la forme d’une bénédiction performative naturelle en français. L’alternative expliciterait davantage la valeur de souhait, mais affaiblirait la forme impérative du grec.
- issue: Référent de ἐπʼ αὐτοῖς
  choice: le bien accompli, avec une formulation souple
  alternative: le peuple d’Israël
  rationale: Le pluriel αὐτοῖς peut reprendre τὰ ἀγαθὰ ou, moins probablement, Israël envisagé collectivement. « Dieu y a pris plaisir » évite de trancher plus nettement que le texte grec, et la note expose l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le ton solennel de l’éloge et de la bénédiction sans archaïsmes. Le féminin de « bénie » est maintenu en raison de Judith.
