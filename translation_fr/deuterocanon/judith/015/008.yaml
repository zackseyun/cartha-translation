- from: Joakim, le grand prêtre, et le conseil des fils d’Israël[a] qui habitaient à Jérusalem vinrent voir les bienfaits que le Seigneur avait accordés à Israël, ainsi que Judith, et lui adresser des paroles de paix[b].
