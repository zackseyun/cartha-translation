base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/008.yaml
  text: And Joakim the high priest and the council of the sons of Israel[a], who dwelt in Jerusalem, came to see the good things that the Lord had done for Israel[b], and to see Judith and speak peaceably with her.
translation:
  language: fr
  text: Joakim, le grand prêtre, et le conseil des fils d’Israël[a], dont les membres habitaient à Jérusalem, vinrent voir les bienfaits que le Seigneur avait accomplis pour Israël, voir Judith et lui parler de paix[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des Israélites ». Le grec dit littéralement « des fils d’Israël », désignation traditionnelle du peuple.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « parler paix avec elle ». L’expression peut évoquer une salutation, des félicitations ou des paroles bienveillantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰωακειὶμ
  choice: Joakim
  rationale: Translittération usuelle et proche de la forme grecque.
- source_word: ὁ ἱερεὺς ὁ μέγας
  choice: le grand prêtre
  rationale: Désignation française établie de la fonction sacerdotale suprême.
- source_word: ἡ γερουσία
  choice: le conseil
  rationale: Désigne ici l’assemblée dirigeante des anciens, sans connotation romaine anachronique.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: des fils d’Israël
  rationale: Conserve la désignation collective et traditionnelle explicitement présente dans le grec.
- source_word: οἱ κατοικοῦντες ἐν Ἰερουσαλήμ
  choice: qui habitaient à Jérusalem
  rationale: Rend naturellement le participe et le rattache au conseil, son antécédent grammatical immédiat.
- source_word: τὰ ἀγαθὰ ἃ ἐποίησεν Κύριος τῷ Ἰσραήλ
  choice: les bienfaits que le Seigneur avait accordés à Israël
  rationale: « Bienfaits » exprime naturellement les bonnes choses ou actions bénéfiques accomplies par Dieu; « accordés » rend le sens contextuel sans préciser indûment leur nature.
- source_word: τοῦ ἰδεῖν τὴν Ἰουδεὶθ
  choice: ainsi que Judith
  rationale: Évite en français la répétition maladroite de « voir », tout en conservant le second but de la venue.
- source_word: λαλῆσαι μετʼ αὐτῆς εἰρήνην
  choice: lui adresser des paroles de paix
  rationale: Préserve l’image et la coloration sémitique de l’expression grecque tout en restant intelligible en français moderne.
theological_decisions:
- issue: Traduction de Κύριος
  choice: le Seigneur
  alternative: Seigneur
  rationale: Forme française naturelle pour désigner Dieu dans ce contexte narratif.
- issue: Désignation collective τῶν υἱῶν Ἰσραήλ
  choice: des fils d’Israël
  alternative: des Israélites
  rationale: La formulation conserve le lien familial et traditionnel du grec sans neutraliser le texte source.
- issue: Portée de l’expression de paix
  choice: lui adresser des paroles de paix
  alternative: lui parler paisiblement
  rationale: La traduction garde explicitement εἰρήνην (« paix ») et laisse ouverte la nuance entre salutation, félicitations et discours bienveillant.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe est allégée sans effacer la structure de but du grec; l’expression inhabituelle autour de la paix est conservée sous une forme française compréhensible.
