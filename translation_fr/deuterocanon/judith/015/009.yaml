base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/009.yaml
  text: And when they entered to her[a], they all with one accord blessed her and said to her, “You are the exaltation of Jerusalem, you are the great boast of Israel[b], you are the great glory of our people.”
translation:
  language: fr
  text: 'Quand ils furent entrés en sa présence, ils la bénirent tous d’une seule voix et lui dirent : « Tu es la grandeur de Jérusalem[a], tu es la grande fierté d’Israël, tu es le grand sujet de gloire de notre peuple. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’élévation de Jérusalem » ou « la hauteur de Jérusalem » ; le mot grec évoque ce qui est élevé.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθον πρὸς αὐτήν
  choice: furent entrés en sa présence
  rationale: Cette formulation française naturelle conserve l’idée d’entrer et le mouvement vers Judith exprimé par πρός, sans suggérer nécessairement qu’il s’agit de sa demeure.
- source_word: εὐλόγησαν
  choice: bénirent
  rationale: Le verbe signifie couramment « bénir » ou « dire du bien de ». Les acclamations solennelles qui suivent justifient le maintien de « bénirent ».
- source_word: πάντες ὁμοθυμαδόν
  choice: tous d’une seule voix
  rationale: L’expression rend à la fois la totalité du groupe et son unanimité, dans un français actuel et solennel.
- source_word: ὕψωμα
  choice: la grandeur
  rationale: Le nom évoque ce qui est élevé ou exalté. « Grandeur » reste idiomatique en français tout en conservant l’image d’élévation et la valeur honorifique du titre.
- source_word: γαυρίαμα μέγα
  choice: la grande fierté
  rationale: γαυρίαμα désigne ce dont on se glorifie ou tire fierté. « Grande fierté » exprime naturellement l’acclamation publique adressée à Judith.
- source_word: καύχημα μέγα
  choice: le grand sujet de gloire
  rationale: καύχημα peut désigner un motif ou sujet de fierté et de gloire. Cette traduction conserve son caractère concret et distingue le terme de γαυρίαμα.
- source_word: τοῦ γένους ἡμῶν
  choice: de notre peuple
  rationale: γένος désigne ici la collectivité d’origine et d’appartenance. « Notre peuple » est clair et évite les connotations modernes trompeuses de « race ».
theological_decisions:
- issue: Acclamation honorifique de Judith au moyen de titres civiques et nationaux élevés
  choice: Conserver les trois titres comme une bénédiction publique solennelle adressée directement à Judith.
  alternative: Atténuer ces expressions en simples compliments ou les reformuler uniquement comme des sentiments éprouvés par la communauté.
  rationale: Le grec présente trois prédicats parallèles qui célèbrent sans détour le rôle de Judith dans la délivrance du peuple. La traduction maintient cette force sans lui ajouter de portée doctrinale étrangère au texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme répété « tu es » et le rythme ternaire de l’acclamation sont conservés. « En sa présence » relève légèrement le registre sans archaïsme marqué.
