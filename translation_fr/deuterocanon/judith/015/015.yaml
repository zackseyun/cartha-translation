base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/015.yaml
  text: And they crowned her with an olive wreath[a], she and the women with her. And she went before all the people in the dance, leading all the women, and every man of Israel followed, armed[b], with wreaths and with hymns in their mouths.
translation:
  language: fr
  text: Judith et les femmes qui l’accompagnaient se couronnèrent de rameaux d’olivier[a]. Puis elle s’avança devant tout le peuple dans une danse[b], à la tête de toutes les femmes. Tous les hommes d’Israël la suivaient en armes, portant des couronnes et des hymnes aux lèvres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, le grec mentionne « l’olivier » après le verbe « se couronner ». Dans ce contexte, il s’agit vraisemblablement de feuillage ou d’une couronne d’olivier porté lors de cette célébration de victoire.
    reason: lexical_alternative
  - marker: b
    text: Le mot grec peut désigner la danse elle-même ou une procession chorale accompagnée de danse.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐστεφανώσαντο τὴν ἐλαίαν
  choice: se couronnèrent de rameaux d’olivier
  rationale: Le moyen pluriel indique que Judith et ses compagnes se parent elles-mêmes. L’expression grecque, littéralement « couronnèrent l’olivier », est elliptique; « rameaux d’olivier » exprime naturellement la matière des couronnes sans évoquer une couronne royale.
- source_word: αὐτὴ καὶ αἱ μετʼ αὐτῆς
  choice: Judith et les femmes qui l’accompagnaient
  rationale: Le pronom féminin désigne Judith, tandis que le contexte suivant permet d’expliciter que ses compagnes sont des femmes.
- source_word: προῆλθεν παντὸς τοῦ λαοῦ
  choice: elle s’avança devant tout le peuple
  rationale: La formulation exprime son mouvement en avant et sa place en tête de la procession, sans suggérer nécessairement qu’elle sort d’un lieu.
- source_word: ἐν χορείᾳ
  choice: dans une danse
  rationale: χορεία peut désigner l’action de danser ou une danse chorale organisée. Cette traduction conserve l’image cérémonielle tout en laissant ouverte la forme précise de la danse.
- source_word: ἡγουμένη πασῶν τῶν γυναικῶν
  choice: à la tête de toutes les femmes
  rationale: Cette expression française rend clairement le rôle directeur de Judith dans la procession.
- source_word: ἐνωπλισμένοι
  choice: en armes
  rationale: La locution signifie que les hommes sont armés et convient au registre solennel d’une procession de victoire.
- source_word: μετὰ στεφάνων
  choice: portant des couronnes
  rationale: Dans ce contexte festif et victorieux, στέφανοι désigne des couronnes ou guirlandes cérémonielles, non des insignes royaux. « Portant » rend leur présence plus naturelle en français.
- source_word: ὕμνων ἐν τῷ στόματι αὐτῶν
  choice: des hymnes aux lèvres
  rationale: Cette tournure idiomatique conserve l’image concrète du grec tout en indiquant naturellement que les hommes chantent.
