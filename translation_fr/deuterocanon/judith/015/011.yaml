lexical_decisions:
- source_word: Γένοιτο
  choice: Qu’il en soit ainsi !
  rationale: 'L’optatif grec exprime ici un souhait ou un assentiment : « que cela arrive / qu’il en soit ainsi ». Cette formulation française restitue directement le sens du grec, plutôt que de le remplacer par la translittération liturgique « Amen ».'
theological_decisions:
- issue: Rendre Γένοιτο par « Amen » ou traduire explicitement l’optatif grec
  choice: Qu’il en soit ainsi !
  alternative: Amen.
  rationale: Le texte grec porte Γένοιτο, non ἀμήν. La traduction explicite conserve la forme et la nuance volitive de la source sans importer une formulation liturgique absente du texte grec.
translation_notes:
  register: Français moderne, clair et digne. Le passé simple « dit » convient au récit biblique, et la tournure « Qu’il en soit ainsi ! » reste naturelle tout en conservant la solennité de l’assentiment collectif.
