lexical_decisions:
- source_word: ἐλαφύρευσεν
  choice: pilla
  rationale: Le verbe désigne l’action de s’emparer du butin d’un ennemi vaincu. « Pilla » est naturel en français moderne et conserve clairement le cadre militaire.
- source_word: πᾶς ὁ λαός
  choice: tout le peuple
  rationale: Cette expression désigne l’ensemble du peuple ou du groupe. « Tout le peuple » reste proche du grec sans préciser indûment qu’il s’agit uniquement de l’armée.
- source_word: τὴν παρεμβολήν
  choice: le camp
  rationale: Dans ce contexte militaire, le nom désigne le campement ennemi. « Le camp » est concis, idiomatique et suffisamment précis.
- source_word: ἐφʼ ἡμέρας τριάκοντα
  choice: pendant trente jours
  rationale: La construction exprime une durée. « Pendant trente jours » la rend de façon naturelle et exacte en français.
