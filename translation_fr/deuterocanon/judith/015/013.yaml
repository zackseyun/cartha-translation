  text: And they gave Judith the tent of Holofernes[a], and all the silver vessels, and the couches, and the utensils, and all his furnishings. And she took them and placed them on her mule, and harnessed her wagons[b], and piled them on them.
translation:
  language: fr
  text: Ils donnèrent à Judith la tente d’Holopherne, tous les objets en argent, les divans, les accessoires[a] et tout son équipement. Elle les prit, les plaça sur sa mule, attela ses chariots[b] et les y entassa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « accessoires » est rare et son sens précis est incertain; il pourrait désigner plus particulièrement des tentures ou d’autres éléments de la tente.
    reason: lexical_alternative
  - marker: b
    text: Dans la dernière proposition, le grec emploie des pronoms répétés et une formulation condensée. Il est vraisemblable que Judith entasse les biens sur les chariots.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνήν
  choice: tente
  rationale: Le sens ordinaire convient au logement de campagne d’Holopherne et n’impose pas l’idée plus particulière d’un pavillon ou d’un baldaquin.
- source_word: ἀργυρώματα
  choice: objets en argent
  rationale: Le terme désigne collectivement des articles faits d’argent, sans les limiter à de la vaisselle de table.
- source_word: κλίνας
  choice: divans
  rationale: κλίνη peut désigner un lit ou un divan. « Divans » évoque ici du mobilier de luxe transportable tout en maintenant cette nuance de meuble sur lequel on s’étend.
- source_word: ὅλκια
  choice: accessoires
  rationale: Ce mot rare est d’interprétation incertaine. Le terme général « accessoires » convient à une liste d’éléments mobiliers sans imposer le sens plus étroit de tentures.
- source_word: σκευάσματα
  choice: équipement
  rationale: Ce terme large désigne des objets préparés ou du matériel; « équipement » convient au cadre d’un camp militaire et reste distinct du mot précédent.
- source_word: ἡμίονον
  choice: mule
  rationale: L’article grec est féminin; « mule » rend donc naturellement le référent sans perdre cette précision.
- source_word: ἔζευξεν
  choice: attela
  rationale: Le verbe signifie mettre sous le joug ou atteler. En français courant, on peut dire « atteler des chariots » pour les préparer au transport.
- source_word: ἁμάξας
  choice: chariots
  rationale: Le mot désigne des véhicules à roues capables de transporter le butin; « chariots » est naturel dans ce contexte ancien.
- source_word: ἐσώρευσεν
  choice: entassa
  rationale: Le verbe exprime l’action d’amonceler. « Entassa » conserve cette image concrète.
