base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/007.yaml
  text: But the sons of Israel[a], returning from the slaughter, took possession of the rest, and the villages and hamlets in the hill country and in the plain took much plunder[c][b], for there was a very great quantity.
translation:
  language: fr
  text: Mais les fils d’Israël[a], revenant du massacre, se rendirent maîtres de ceux qui restaient. Les villages et les domaines ruraux[b] de la région montagneuse et de la plaine s’emparèrent d’un abondant butin[c], car il y en avait une quantité considérable.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites ». Le grec dit littéralement « les fils d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les villages et les exploitations rurales »; le second terme grec peut désigner des habitations ou de petits établissements ruraux.
    reason: lexical_alternative
  - marker: c
    text: Ou « de nombreuses dépouilles ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... υἱοὶ Ἰσραήλ
  choice: les fils d’Israël
  rationale: Rend directement l’expression grecque tout en conservant son registre biblique. « Les Israélites » serait plus idiomatique, mais moins proche de la formulation source.
- source_word: ἀναστρέψαντες ἀπὸ τῆς κοπῆς
  choice: revenant du massacre
  rationale: Le participe exprime ici le retour après les combats; κοπή désigne, dans ce contexte militaire, l’action de tailler en pièces ou le massacre.
- source_word: ἐκυρίευσαν τῶν λοιπῶν
  choice: se rendirent maîtres de ceux qui restaient
  rationale: Le génitif τῶν λοιπῶν désigne naturellement les personnes restantes, probablement les survivants ou fuyards ennemis. Cette traduction préserve la valeur de domination de κυριεύω sans transformer implicitement le complément en biens matériels.
- source_word: αἱ κῶμαι καὶ ἐπαύλεις
  choice: les villages et les domaines ruraux
  rationale: κῶμαι désigne des villages; ἐπαύλεις peut désigner des habitations, exploitations ou établissements ruraux. « Domaines ruraux » conserve cette ampleur sémantique sans réduire nécessairement le terme à de simples hameaux.
- source_word: ἐν τῇ ὀρεινῇ καὶ πεδινῇ
  choice: de la région montagneuse et de la plaine
  rationale: Rend les deux désignations géographiques substantivées dans un français naturel et clair.
- source_word: ἐκράτησαν πολλῶν λαφύρων
  choice: s’emparèrent d’un abondant butin
  rationale: κρατέω exprime ici la saisie ou la prise de possession, tandis que λάφυρα désigne le butin de guerre. Le singulier collectif « butin » est idiomatique en français.
- source_word: ἦν γὰρ πλῆθος πολὺ σφόδρα
  choice: car il y en avait une quantité considérable
  rationale: La formule grecque accumule les marques d’abondance. Cette formulation française en conserve l’insistance sans lourdeur excessive, le pronom renvoyant au butin.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’idiome biblique « fils d’Israël » et distingue les survivants ennemis du butin. Le pluriel grec « villages et domaines ruraux » est maintenu comme sujet collectif, selon la métonymie du texte, pour désigner leurs habitants.
