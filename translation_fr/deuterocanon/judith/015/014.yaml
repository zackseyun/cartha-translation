translation_notes:
  register: Français international moderne, digne et accessible. Le singulier collectif grec est rendu par un pluriel idiomatique, avec la forme littérale signalée en note. Le nom propre « Judith » remplace le pronom à la reprise afin d’éviter une ambiguïté de référent en français.
