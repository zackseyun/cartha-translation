  text: And every woman of Israel ran together to see her[a], and they blessed her, and they made a dance for her from among themselves; and she took thyrsi in her hands and gave them to the women with her[b],
translation:
  language: fr
  text: Toutes les femmes d’Israël accoururent pour la voir[a]. Elles la bénirent et formèrent pour elle une danse, composée d’entre elles. Judith prit des thyrses[b] dans ses mains et les donna aux femmes qui l’accompagnaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « toute femme d’Israël accourut ». Le grec emploie un singulier collectif.'
    reason: lexical_alternative
  - marker: b
    text: Les « thyrses » sont des bâtons ou des baguettes de fête, souvent associés, dans le monde grec, aux cortèges et aux célébrations.
    reason: cultural_note
lexical_decisions:
- source_word: συνέδραμεν
  choice: accoururent
  rationale: Le verbe exprime un mouvement convergent et rapide. « Accoururent » en conserve la vivacité tout en s’accordant avec le pluriel idiomatique français.
- source_word: πᾶσα γυνὴ Ἰσραήλ
  choice: Toutes les femmes d’Israël
  rationale: Le grec emploie un singulier collectif, littéralement « toute femme d’Israël ». Le pluriel est plus naturel en français sans changer la portée collective.
- source_word: τοῦ ἰδεῖν αὐτήν
  choice: pour la voir
  rationale: L’infinitif grec articulé exprime ici clairement le but.
- source_word: εὐλόγησαν αὐτήν
  choice: Elles la bénirent
  rationale: « Bénirent » préserve le sens religieux et honorifique de εὐλογέω, sans le réduire à la simple louange.
- source_word: ἐποίησαν αὐτῇ χορὸν ἐξ αὐτῶν
  choice: formèrent parmi elles une ronde en son honneur
  rationale: χορός peut désigner un groupe dansant ou une danse en cercle. « Ronde » rend naturellement l’image festive; « parmi elles » indique que les femmes constituaient elles-mêmes le groupe, et « en son honneur » rend la valeur de αὐτῇ.
- source_word: θύρσους
  choice: thyrses
  rationale: Le terme désigne des bâtons ou baguettes de fête dont aucun équivalent français courant ne restitue toute la spécificité culturelle. Le nom français « thyrses » est donc conservé et expliqué en note.
- source_word: ταῖς γυναιξὶν ταῖς μετʼ αὐτῆς
  choice: aux femmes qui l’accompagnaient
  rationale: Cette formulation française naturelle rend explicitement les femmes qui se trouvaient avec Judith.
