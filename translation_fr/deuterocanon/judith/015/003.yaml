  text: And those encamped in the hill country around Bethulia turned to flight[a]; then the sons of Israel, every man a warrior[c][b], poured out against them.
translation:
  language: fr
  text: Ceux qui étaient campés dans la région montagneuse autour de Béthulie prirent la fuite[a]. Alors les fils d’Israël, tous les hommes de guerre, déferlèrent sur eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « se tournèrent vers la fuite » ; autre traduction possible : « furent mis en fuite ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « se répandirent contre eux » ; autre traduction possible : « se ruèrent sur eux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ παρεμβεβληκότες
  choice: ceux qui campaient
  rationale: Le participe parfait substantivé désigne les hommes établis dans leur camp; l’imparfait français exprime naturellement cet état résultant.
- source_word: ἐν τῇ ὀρεινῇ
  choice: dans la région montagneuse
  rationale: ὀρεινή désigne ici une région de relief, non une montagne isolée.
- source_word: κύκλῳ Βαιτυλουὰ
  choice: autour de Béthulie
  rationale: κύκλῳ marque la disposition spatiale autour de la ville.
- source_word: ἐτράπησαν εἰς φυγήν
  choice: prirent la fuite
  rationale: Cette expression française courante restitue l’idiome militaire grec sans suggérer explicitement une voix passive que la forme grecque ne tranche pas à elle seule.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: les fils d’Israël
  rationale: Conserve l’expression ethnique traditionnelle et explicitement masculine du grec.
- source_word: πᾶς ἀνὴρ πολεμιστής
  choice: tous les hommes de guerre
  rationale: Rend la valeur distributive de πᾶς avec le masculin explicite ἀνήρ et le sens militaire de πολεμιστής, dans une formulation française naturelle.
- source_word: ἐξέχυθησαν ἐπʼ αὐτούς
  choice: déferlèrent sur eux
  rationale: Le verbe français conserve l’image d’une masse qui se répand avec force tout en exprimant clairement l’assaut.
theological_decisions:
- issue: Langage ethnique et militaire masculin
  choice: les fils d’Israël, tous les hommes de guerre
  alternative: les Israélites, tous les combattants
  rationale: Le grec emploie υἱοί et ἀνήρ, deux termes explicitement masculins. La traduction en conserve la forme et la portée sans leur ajouter de précision doctrinale.
translation_notes:
  register: Français international moderne, narratif et digne. « Béthulie » suit la forme française traditionnelle. La métaphore militaire est conservée par « déferlèrent », tandis que les notes signalent les formulations plus littérales et l’ambiguïté possible de ἐτράπησαν.
