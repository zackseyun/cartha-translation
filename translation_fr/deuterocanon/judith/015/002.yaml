revisions:
- from: La terreur et la peur s’abattirent sur eux, et personne ne resta plus en présence de son compagnon ; mais, se dispersant tous à la fois[a], ils s’enfuirent par toutes les routes de la plaine et de la région montagneuse.
  to: La terreur et la peur s’abattirent sur eux, et personne ne resta plus face à son compagnon ; mais, se dispersant tous à la fois[a], ils s’enfuirent par toutes les routes de la plaine et de la région montagneuse.
  rationale: Révision limitée de « en présence de son compagnon » en « face à son compagnon », afin de refléter plus exactement la valeur spatiale de κατὰ πρόσωπον tout en conservant la fluidité du français moderne. Le reste du texte et la note expriment adéquatement les ambiguïtés lexicales du grec.
