  text: And terror and fear fell upon them[a], and no man remained standing before his neighbor any longer; but, scattering in all directions[b], they fled along every road of the plain and of the hill country.
translation:
  language: fr
  text: La terreur et la peur s’abattirent sur eux, et personne ne resta plus face à son compagnon ; mais, se dispersant tous à la fois[a], ils s’enfuirent par toutes les routes de la plaine et de la région montagneuse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’un même mouvement » ; l’adverbe grec peut aussi signifier « d’un commun accord », mais il évoque ici plus probablement une fuite collective et simultanée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέπεσεν
  choice: s’abattirent sur
  rationale: Le verbe exprime une irruption soudaine et violente. Le pluriel français est requis par le sujet coordonné « la terreur et la peur », malgré le singulier grec.
- source_word: τρόμος καὶ φόβος
  choice: la terreur et la peur
  rationale: Cette formulation conserve les deux noms grecs et leur intensité respective sans les fondre en un seul terme.
- source_word: οὐκ ἦν ἄνθρωπος μένων
  choice: personne ne resta plus
  rationale: Le grec signifie qu’aucun individu ne demeurait en place. « Personne » est naturel en français moderne et n’impose pas un masculin que ἄνθρωπος n’exige pas nécessairement ici.
- source_word: κατὰ πρόσωπον τοῦ πλησίον
  choice: en présence de son compagnon
  rationale: L’expression évoque le fait de rester devant ou face à un proche compagnon. Dans ce contexte militaire, « compagnon » convient mieux que « prochain ».
- source_word: ἐκχυθέντες
  choice: se dispersant
  rationale: Le participe signifie littéralement « étant répandus » ou « déversés » et dépeint ici les troupes qui se disloquent dans la panique.
- source_word: ὁμοθυμαδόν
  choice: tous à la fois
  rationale: Dans cette fuite désordonnée, l’adverbe indique une action collective ou simultanée, plutôt qu’une unité harmonieuse de volonté.
- source_word: ἔφευγον
  choice: ils s’enfuirent
  rationale: Le passé simple convient au récit français et rend clairement la fuite, même si l’imparfait grec présente l’action dans son déroulement.
- source_word: ἐπὶ πᾶσαν ὁδὸν
  choice: par toutes les routes
  rationale: Le singulier distributif grec désigne l’ensemble des voies empruntées pour fuir ; le pluriel est idiomatique en français.
- source_word: τοῦ πεδίου καὶ τῆς ὀρεινῆς
  choice: de la plaine et de la région montagneuse
  rationale: « Plaine » rend πεδίον, tandis que « région montagneuse » exprime naturellement ὀρεινή comme zone géographique.
