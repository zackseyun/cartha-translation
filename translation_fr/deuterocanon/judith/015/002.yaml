  register: Français international moderne, narratif et digne. La ponctuation garde la progression du grec tout en évitant une syntaxe artificielle. Le participe « se dispersant » conserve l’image de la débâcle, et la note préserve l’ambiguïté de ὁμοθυμαδόν.
