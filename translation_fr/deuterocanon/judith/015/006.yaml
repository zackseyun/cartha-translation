    issue: « les fuyards » ajoute une information au texte traduit.
    rationale: Le grec porte seulement αὐτούς, « eux ». Le contexte peut suggérer une fuite, mais le pronom ne les qualifie pas explicitement; cette explicitation réduit inutilement l’ambiguïté du texte.
  - severity: low
    issue: « emportèrent un immense butin » transforme la construction de pillage du camp en prise de butin et amplifie légèrement l’intensif.
    rationale: ἐλούτησαν σφόδρα exprime qu’ils pillèrent très abondamment; « pillèrent abondamment le camp » conserve plus directement le verbe, l’intensité et l’antécédent singulier.
