base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/006.yaml
  text: But the rest[a], those living in Bethulia, fell upon the camp of Assyria[c][b], and they pursued them and plundered it greatly.
translation:
  language: fr
  text: Mais les autres habitants de Béthulie fondirent sur le camp assyrien[a]. Ils les poursuivirent[b] et pillèrent abondamment le camp[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « le camp d’Assour ».
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque dit littéralement « ils allèrent après eux »; dans ce contexte de bataille, elle signifie « ils les poursuivirent ».
    reason: lexical_alternative
  - marker: c
    text: Ou « ils le pillèrent beaucoup » ou « ils y prirent une grande quantité de butin ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: Mais les autres
  rationale: οἱ λοιποί désigne ceux qui restaient, tandis que δέ marque ici une transition légèrement contrastive; « Mais les autres » est naturel et conserve ce mouvement.
- source_word: οἱ κατοικοῦντες Βαιτυλουὰ
  choice: ceux qui habitaient Béthulie
  rationale: Le participe κατοικοῦντες indique la résidence. L’imparfait français convient au cadre narratif, et « Béthulie » est la forme française courante du toponyme.
- source_word: ἐπέπεσαν
  choice: fondirent sur
  rationale: Le verbe exprime une attaque soudaine et hostile. « Fondirent sur » en conserve la vigueur sans lourdeur archaïque.
- source_word: τῇ παρεμβολῇ Ἀσσούρ
  choice: le camp d’Assour
  rationale: Dans ce contexte militaire, παρεμβολή signifie « camp ». Le génitif Ἀσσούρ est conservé sous la forme d’un complément du nom plutôt que transformé silencieusement en adjectif ethnique.
- source_word: ἐπορεύοντο αὐτοὺς
  choice: Ils poursuivirent les fuyards
  rationale: L’expression signifie littéralement qu’ils allèrent après eux. Dans le contexte d’une armée en déroute, « poursuivirent » rend le sens contextuel; « les fuyards » explicite le référent du pronom sans identifier à tort le camp comme objet de la poursuite.
- source_word: ἐλούτησαν σφόδρα
  choice: emportèrent un immense butin
  rationale: Le verbe rare ἐλούτησαν exprime ici le pillage ou la prise de butin, et σφόδρα en marque fortement l’ampleur. Cette formulation est idiomatique en français et évite le calque maladroit « pillèrent grandement ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Fondirent sur » préserve la vivacité de l’assaut; « immense butin » rend naturellement l’intensité de σφόδρα. Les notes signalent les formulations plus littérales et l’explicitation du pronom.
