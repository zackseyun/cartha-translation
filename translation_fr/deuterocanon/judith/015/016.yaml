    rationale: Avec l’accusatif τὴν ἐξομολόγησιν, l’analyse transitive ἐξάρχω (« entonner / commencer ») est la plus cohérente. La traduction française elle-même est bonne, mais la décision lexicale devrait être alignée sur cette analyse.
