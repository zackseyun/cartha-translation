  text: And Judith kept bringing forth this confession in all Israel[a], and all the people echoed this praise; and Judith said[b],
translation:
  language: fr
  text: 'Judith entonnait cette action de grâce[a] parmi tout Israël, et tout le peuple reprenait[b] cette louange ; et Judith dit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette confession publique » ou « cette louange reconnaissante ». Le terme grec peut désigner une reconnaissance publique, une confession ou une action de grâce.
    reason: lexical_alternative
  - marker: b
    text: 'Le verbe grec suggère une réponse vocale, possiblement antiphonale : « répondait par cette louange » est aussi possible.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆρχεν
  choice: entonnait
  rationale: L’imparfait de ἐξάρχω exprime ici le fait de commencer ou de conduire un chant. « Entonnait » est naturel en français, convient au contexte hymnique et conserve l’aspect imperfectif.
- source_word: ἐξομολόγησιν
  choice: action de grâce
  rationale: Dans le grec biblique, ἐξομολόγησις peut désigner une reconnaissance publique, une confession ou une action de grâce. Le contexte chanté favorise « action de grâce », sans la confondre avec αἴνεσις, rendu par « louange ».
- source_word: ἐν παντὶ Ἰσραήλ
  choice: dans tout Israël
  rationale: Cette formulation directe conserve l’ambiguïté entre une portée géographique et une portée communautaire.
- source_word: ὑπεφώνει
  choice: reprenait
  rationale: Le verbe évoque une réponse vocale, possiblement antiphonée. « Reprenait » rend naturellement la participation responsoriale du peuple.
- source_word: πᾶς ὁ λαὸς
  choice: tout le peuple
  rationale: Équivalent français courant et fidèle dans ce contexte collectif.
- source_word: τὴν αἴνεσιν ταύτην
  choice: cette louange
  rationale: « Louange » rend directement αἴνεσις tout en maintenant sa distinction lexicale avec ἐξομολόγησις.
- source_word: εἶπεν
  choice: dit
  rationale: Formule narrative simple qui introduit les paroles de Judith dans le verset suivant.
theological_decisions:
- issue: Faut-il harmoniser ἐξομολόγησις et αἴνεσις comme deux termes identiques pour la louange ?
  choice: 'Maintenir la distinction : « action de grâce » puis « louange »'
  alternative: Traduire les deux noms par « louange » ou par deux expressions quasi synonymes
  rationale: Le grec emploie deux substantifs distincts dans des propositions voisines. La traduction retenue respecte cette variation sans imposer à ἐξομολόγησις le sens d’un aveu de péché, peu probable dans ce contexte hymnique.
translation_notes:
  register: Français international moderne, digne et accessible. « Entonnait » et « reprenait » rendent le cadre chanté et responsorial sans alourdir la phrase. La ponctuation sépare naturellement la réponse du peuple de l’introduction du cantique de Judith.
