  source_fidelity: Le verbe ἐξῆρχεν est ici à comprendre comme une forme transitive de ἐξάρχω (« commencer / entonner, conduire »), ce que confirme son complément d’objet direct. « Entonnait » le rend bien et conserve l’imparfait. « Action de grâce » pour ἐξομολόγησιν et « louange » pour αἴνεσιν préservent utilement la distinction lexicale dans ce contexte hymnique. En revanche, « Puis » ne correspond pas au καί grec, qui coordonne simplement l’introduction des paroles suivantes.
  naturalness: La phrase est naturelle en français moderne. « Parmi tout Israël » exprime plus idiomatiquement que « dans tout Israël » la portée collective de ἐν παντὶ Ἰσραήλ, tout en laissant ouverte la nuance géographique ou communautaire. « Reprenait cette louange » convient au caractère responsorial de ὑπεφώνει.
  terminology: « Action de grâce » est approprié ici sans réduire ἐξομολόγησις à un aveu de faute ; la note conserve à juste titre les autres possibilités. « Louange » rend directement αἴνεσις. Judith et Israël sont correctement orthographiés.
