base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/004.yaml
  text: And Uzziah sent men to Bethomesthaim and Choba and Chola, and to all the territory of Israel, to report what had happened, and that all should rush out against the enemies for their destruction.
translation:
  language: fr
  text: Ozias envoya des messagers à Béthomesthaïm, à Choba, à Chola et dans tout le territoire d’Israël pour annoncer ce qui s’était passé, afin que tous se précipitent contre les ennemis pour les anéantir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « afin que tous soient répandus contre les ennemis », image d’une foule qui sort en masse pour attaquer.'
    reason: La note conserve la métaphore grecque sous-jacente à la traduction idiomatique « se précipitent ».
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: envoya
  rationale: Verbe narratif courant qui exprime directement l’envoi de personnes chargées d’une mission.
- source_word: Ὀζίας
  choice: Ozias
  rationale: Forme française traditionnelle et aisément reconnaissable du nom grec Ὀζίας.
- source_word: Βαιτομασθαΐμ
  choice: Béthomesthaïm
  rationale: Translittération française proche de la forme grecque, avec accents facilitant la lecture.
- source_word: Χωβὰι
  choice: Choba
  rationale: Translittération simple de la forme grecque transmise dans cette édition.
- source_word: Χωλὰ
  choice: Chola
  rationale: Translittération française directe de la forme grecque.
- source_word: πᾶν ὅριον Ἰσραήλ
  choice: tout le territoire d’Israël
  rationale: Dans ce contexte, ὅριον désigne l’étendue territoriale plutôt que les seules frontières.
- source_word: τοὺς ἀπαγγέλλοντας
  choice: des messagers … pour annoncer
  rationale: Le participe substantivé désigne les personnes envoyées pour transmettre la nouvelle; « messagers » rend leur fonction sans introduire leur sexe.
- source_word: ὑπὲρ τῶν συντετελεσμένων
  choice: ce qui s’était passé
  rationale: Expression française naturelle pour les événements désormais accomplis dont les messagers doivent faire le récit.
- source_word: ἵνα πάντες ἐκχυθῶσιν
  choice: demander à tous de déferler
  rationale: La formulation grecque signifie littéralement que tous soient « répandus »; « déferler » conserve l’image d’une sortie collective et massive tout en restant idiomatique dans un contexte militaire.
- source_word: τοῖς πολεμίοις
  choice: contre les ennemis
  rationale: Le datif, associé au mouvement hostile exprimé par le verbe, se rend naturellement par « contre ».
- source_word: εἰς τὴν ἀναίρεσιν αὐτῶν
  choice: afin de les anéantir
  rationale: Dans ce contexte militaire, ἀναίρεσις désigne l’élimination violente des ennemis; cette formulation exprime clairement le but sans ajouter la notion plus précise de massacre.
theological_decisions:
- issue: Langage de violence dans un récit militaire
  choice: afin de les anéantir
  alternative: pour leur destruction; afin de les tuer
  rationale: Le grec énonce explicitement le but d’éliminer les ennemis. La traduction en conserve la dureté sans l’atténuer ni la renforcer par un terme plus précis que ne l’exige le contexte.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été légèrement explicitée par « demander à » pour faire comprendre que le message transmis comportait un appel à l’action. Les toponymes suivent de près les formes grecques.
