lexical_decisions:
- source_word: Καὶ
  choice: omis comme connecteur explicite
  rationale: En français, commencer directement par « Quand » assure un enchaînement narratif naturel; rendre Καὶ par « Et » serait possible, mais plus lourd ici.
- source_word: ὡς
  choice: Quand
  rationale: Avec l’aoriste ἤκουσαν, ὡς introduit ici une proposition temporelle, sans qu’il soit nécessaire d’accentuer l’immédiateté par « dès que ».
- source_word: ἤκουσαν
  choice: apprirent la nouvelle
  rationale: Dans ce contexte narratif, le verbe désigne le fait d’entendre la nouvelle de l’événement. Cette formulation française est naturelle tout en restant proche du sens; « entendirent » laisserait trop facilement attendre un complément sonore.
- source_word: οἱ ἐν τοῖς σκηνώμασιν ὄντες
  choice: ceux qui se trouvaient dans les tentes
  rationale: La tournure conserve la portée indéfinie du participe substantivé sans ajouter « hommes », absent du grec.
- source_word: σκηνώμασιν
  choice: tentes
  rationale: Dans ce cadre militaire, « tentes » est le terme moderne et précis; « demeures » serait trop général et « tabernacles » trompeur.
- source_word: ἐξέστησαν
  choice: furent bouleversés
  rationale: Le verbe exprime une réaction intense qui fait sortir de son état ordinaire. « Bouleversés » rend mieux cette force en français courant que le plus faible « étonnés », tout en évitant de préciser arbitrairement s’il s’agit surtout de stupeur ou de confusion.
- source_word: ἐπὶ τὸ γεγονός
  choice: par ce qui s’était passé
  rationale: Cette formulation idiomatique restitue l’événement accompli exprimé par le participe parfait γεγονός et présente celui-ci comme la cause de leur réaction.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase reste concise, évite le calque « Et quand » et ne précise ni le sexe ni l’identité des personnes présentes dans les tentes.
