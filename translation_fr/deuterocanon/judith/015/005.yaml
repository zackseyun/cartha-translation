base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/005.yaml
  text: But when the sons of Israel heard[a], they all together fell upon them and kept striking them down as far as Choba. Likewise, those from Jerusalem and from all the hill country also arrived, for the things that had happened in the camp of their enemies had been reported to them; and those in Gilead and those in Galilee outflanked them with a great slaughter[c][b], until they had passed Damascus and its borders.
translation:
  language: fr
  text: Quand les fils d’Israël[a] l’apprirent, ils se jetèrent tous ensemble sur eux et les frappaient sans relâche jusqu’à Choba. Ceux de Jérusalem et ceux de toute la région montagneuse arrivèrent eux aussi, car on leur avait rapporté ce qui s’était passé dans le camp de leurs ennemis. Ceux de Galaad et ceux de Galilée les débordèrent[b] en leur infligeant de lourdes pertes[c], jusqu’à ce qu’ils aient dépassé Damas et ses frontières[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites ». Le grec dit littéralement « les fils d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: Le verbe militaire peut aussi évoquer le fait de passer au-delà d’eux ou de leur couper la route pendant la poursuite.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « d’un grand coup » ; dans ce contexte de bataille, l’expression évoque probablement de lourdes pertes.
    reason: lexical_alternative
  - marker: d
    text: Le grec ne précise pas explicitement si « ils » désigne les poursuivants ou les ennemis en fuite.
    reason: ambiguity
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: les fils d’Israël
  rationale: Cette traduction conserve l’expression familiale masculine du grec. « Les Israélites » serait plus idiomatique, mais moins transparente quant à la forme du texte source.
- source_word: ὁμοθυμαδόν
  choice: tous ensemble
  rationale: L’expression rend l’action collective et concertée dans un français actuel, sans recourir au tour plus soutenu « d’un commun accord ».
- source_word: ἐπέπεσον ἐπʼ αὐτούς
  choice: se jetèrent sur eux
  rationale: Ce tour conserve la vigueur et le caractère soudain de l’expression martiale grecque.
- source_word: ἔκοπτον αὐτούς
  choice: continuèrent à les abattre
  rationale: L’imparfait grec indique une action prolongée ou répétée; « continuèrent à » en fait entendre l’aspect, tandis que « abattre » convient au contexte militaire sans préciser l’arme employée.
- source_word: ἕως Χωβά
  choice: jusqu’à Choba
  rationale: Avec un nom de lieu, ἕως marque ici la limite spatiale de la poursuite. Le toponyme suit la forme grecque Χωβά.
- source_word: οἱ ἐξ Ἰερουσαλὴμ … καὶ ἐκ πάσης τῆς ὀρεινῆς
  choice: ceux de Jérusalem et de toute la région montagneuse
  rationale: La formulation française identifie naturellement ces groupes par leur provenance et rend ὀρεινή comme une région de relief élevé.
- source_word: τὰ γεγονότα τῇ παρεμβολῇ τῶν ἐχθρῶν αὐτῶν
  choice: ce qui s’était passé dans le camp de leurs ennemis
  rationale: La traduction garde la référence aux événements antérieurs et le sens militaire de παρεμβολή.
- source_word: ὑπερεκέρασαν αὐτούς
  choice: les débordèrent
  rationale: Dans cette poursuite militaire, le verbe composé évoque le fait de passer au-delà de l’ennemi ou de le contourner. « Déborder » conserve cette nuance tactique sans imposer avec certitude l’idée de l’encercler.
- source_word: πληγῇ μεγάλῃ
  choice: en leur infligeant de lourdes pertes
  rationale: Littéralement « d’un grand coup », l’expression désigne vraisemblablement ici les effets meurtriers d’une attaque importante; la traduction française privilégie le sens contextuel tout en signalant le tour littéral en note.
- source_word: ἕως οὗ παρῆλθον Δαμασκὸν καὶ τὰ ὅρια αὐτῆς
  choice: jusqu’à ce qu’ils aient dépassé Damas et les frontières de son territoire
  rationale: Cette formulation suit la proposition temporelle grecque et conserve l’indétermination du sujet pluriel de παρῆλθον, expliquée en note.
