    rationale: Le grec dit seulement « lorsqu’ils entendirent/apprirent »; « la nouvelle » est une explicitation non nécessaire.
  - severity: medium
    issue: « continuèrent à les abattre »
    rationale: Cette expression peut impliquer une continuité depuis une action antérieure et « abattre » peut être plus spécifique que κόπτω. Le grec emploie l’imparfait pour une action répétée ou prolongée pendant l’attaque.
  - severity: low
    issue: « les frontières de son territoire »
    rationale: « Territoire » n’est pas exprimé dans le grec. « Ses frontières » préserve la concision et l’étrangeté géographique relative du texte source.
