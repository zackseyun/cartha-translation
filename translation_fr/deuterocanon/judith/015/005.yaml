revisions:
- from: Quand les fils d’Israël[a] apprirent la nouvelle, ils se jetèrent tous ensemble sur eux et continuèrent à les abattre jusqu’à Choba. Ceux de Jérusalem et de toute la région montagneuse arrivèrent eux aussi, car on leur avait rapporté ce qui s’était passé dans le camp de leurs ennemis. Ceux de Galaad et ceux de Galilée les débordèrent[b] en leur infligeant de lourdes pertes[c], jusqu’à ce qu’ils aient dépassé Damas et les frontières de son territoire[d].
  to: Quand les fils d’Israël[a] l’apprirent, ils se jetèrent tous ensemble sur eux et les frappaient sans relâche jusqu’à Choba. Ceux de Jérusalem et ceux de toute la région montagneuse arrivèrent eux aussi, car on leur avait rapporté ce qui s’était passé dans le camp de leurs ennemis. Ceux de Galaad et ceux de Galilée les débordèrent[b] en leur infligeant de lourdes pertes[c], jusqu’à ce qu’ils aient dépassé Damas et ses frontières[d].
  rationale: La révision retire deux explicitations qui ne sont pas exigées par le grec (« la nouvelle », « territoire ») et remplace une tournure susceptible de surinterpréter l’imparfait ἔκοπτον. Elle conserve les choix lexicaux défendables ainsi que les notes nécessaires sur le verbe tactique, la grande frappe et l’antécédent ambigu du dernier pluriel.
