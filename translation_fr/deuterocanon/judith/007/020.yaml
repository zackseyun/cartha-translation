  text: And the whole camp of Assyria remained around them—the foot soldiers and chariots and their horsemen—for thirty-four days; and all the water containers of all the inhabitants of Bethulia ran out,
translation:
  language: fr
  text: Tout le camp des Assyriens resta autour d’eux — les fantassins, les chars et leurs cavaliers — pendant trente-quatre jours. Tous les récipients d’eau de tous les habitants de Béthulie furent à sec.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶσα παρεμβολὴ Ἀσσούρ
  choice: tout le camp des Assyriens
  rationale: παρεμβολή désigne ici le camp ou l’armée campée; le collectif Ἀσσούρ est rendu naturellement par «des Assyriens» en français.
- source_word: οἱ πεζοὶ
  choice: les fantassins
  rationale: Terme français courant et précis pour les soldats combattant à pied.
- source_word: ἅρματα
  choice: les chars
  rationale: Rend directement les véhicules militaires désignés par le grec, sans ajouter de précision absente du texte.
- source_word: ἐξέλιπεν ... πάντα τὰ ἀγγεῖα ... τῶν ὑδάτων
  choice: Tous les récipients d’eau ... furent alors à sec
  rationale: ἐκλείπω exprime l’épuisement ou le fait de venir à manquer. «Furent à sec» conserve la mention concrète des récipients tout en produisant une formulation française naturelle.
- source_word: Βαιτυλουά
  choice: Béthulie
  rationale: Forme française traditionnelle et largement reconnue du nom de la ville.
