translation:
  language: fr
  text: Car c’est là que tous les habitants de Baityloua puisent leur eau[a]. La soif les fera mourir, et ils livreront leur ville ; et nous, notre peuple et nous, nous monterons sur les sommets voisins des montagnes,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom de ce lieu est traditionnellement rendu par « Béthulie » dans de nombreuses versions françaises ; le grec porte Βαιτυλουά, transcrit ici plus directement « Baityloua ».
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: car
  rationale: Introduit la raison qui justifie la stratégie exposée auparavant.
- source_word: ἐκεῖθεν ὑδρεύονται
  choice: c’est là que… puisent leur eau
  rationale: Rend naturellement en français la provenance de l’eau et le sens concret du verbe ὑδρεύομαι.
- source_word: πάντες οἱ κατοικοῦντες Βαιτυλουά
  choice: tous les habitants de Baityloua
  rationale: Préserve la portée universelle et translittère directement la forme grecque du nom de lieu.
- source_word: ἀνελεῖ αὐτοὺς ἡ δίψα
  choice: La soif les fera mourir
  rationale: Conserve la soif comme sujet agent tout en exprimant clairement l’issue mortelle de ἀναιρέω dans un français naturel.
- source_word: ἐκδώσουσι τὴν πόλιν αὐτῶν
  choice: ils livreront leur ville
  rationale: Le contexte militaire implique une remise de la ville à l’ennemi; « livrer » conserve plus directement la construction transitive grecque que « se rendre ».
- source_word: ἀναβησόμεθα
  choice: nous monterons
  rationale: Préserve le mouvement ascendant sans ajouter explicitement l’idée d’une marche militaire.
- source_word: ἐπὶ τὰς πλησίον κορυφὰς τῶν ὀρέων
  choice: sur les sommets voisins des montagnes
  rationale: Rend les détails topographiques de κορυφάς, ὀρέων et la proximité exprimée par πλησίον.
