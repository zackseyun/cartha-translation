  text: And now call them, and hand over the whole city as plunder to the people of Holofernes and to all his force.
translation:
  language: fr
  text: Et maintenant, appelez-les et livrez toute la ville comme butin aux gens d’Holopherne et à toute son armée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπικαλέσασθε αὐτούς
  choice: appelez-les
  rationale: Rend directement l’impératif grec sans préciser davantage l’idée de convocation, que le contexte suffit à faire comprendre.
- source_word: ἔκδοθε
  choice: livrez
  rationale: Exprime l’action de remettre la ville au pouvoir de l’ennemi.
- source_word: εἰς προνομήν
  choice: au pillage
  rationale: 'Formulation française naturelle qui conserve la finalité indiquée par le grec : abandonner la ville comme butin à piller.'
- source_word: τῷ λαῷ Ὁλοφέρνου
  choice: des gens d’Holopherne
  rationale: « Gens » restitue ici naturellement λαός pour désigner ceux qui suivent Holopherne, sans suggérer nécessairement un peuple ethnique.
- source_word: πάσῃ τῇ δυνάμει αὐτοῦ
  choice: toute son armée
  rationale: Dans ce contexte militaire, δύναμις désigne les forces armées d’Holopherne ; le singulier collectif français « armée » correspond au grec singulier.
