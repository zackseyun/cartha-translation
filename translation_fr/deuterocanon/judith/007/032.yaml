revisions:
- from: Il dispersa le peuple vers son camp[a]. Puis il se rendit aux murailles et aux tours de leur ville, et envoya les femmes et les enfants dans leurs maisons. Dans la ville, ils étaient plongés dans une profonde détresse[b].
  to: Il dispersa le peuple dans son camp[a]. Puis il se rendit aux murailles et aux tours de leur ville, et envoya les femmes et les enfants dans leurs maisons. Les habitants de la ville étaient dans une profonde détresse[b].
  rationale: La révision rend plus exactement la destination vers le camp, corrige la note relative à cette expression et signale explicitement l’ambiguïté du singulier grec ἀπῆλθεν sans imposer dans le texte une résolution différente. Elle clarifie aussi le sujet pluriel de la dernière proposition et conserve une formulation française moderne.
