translation_notes:
  register: Français international moderne, digne et lisible. La ponctuation clarifie les mouvements successifs. Le singulier de ἀπῆλθεν est conservé afin de ne pas effacer une difficulté réelle du texte grec; le pronom peut renvoyer au responsable mentionné par les verbes singuliers, tandis que le contexte a conduit certaines traductions à comprendre un mouvement collectif du peuple.
