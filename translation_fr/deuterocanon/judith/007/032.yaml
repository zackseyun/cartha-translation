  text: And he dispersed the people to their camp[a], and they went away to the walls and towers of their city, and he sent the women and children to their houses[b]; and they were in great humiliation in the city.
translation:
  language: fr
  text: Il dispersa le peuple dans son camp[a]. Puis il se rendit aux murailles et aux tours de leur ville, et envoya les femmes et les enfants dans leurs maisons. Les habitants de la ville étaient dans une profonde détresse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte littéralement « dans son propre camp ». Le verbe suivant est au singulier (« il s’en alla/se rendit »), bien que le contexte puisse aussi faire comprendre que le peuple dispersé gagna les murailles et les tours.
    reason: textual_variant
  - marker: b
    text: 'Ou : « dans une grande humiliation » ou « dans une grande affliction ». Le grec désigne un état d’abaissement, d’accablement ou de misère.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκόρπισεν
  choice: dispersa
  rationale: Le verbe exprime la séparation et la répartition d’un groupe; « dispersa » en conserve directement le sens sans suggérer nécessairement une fuite désordonnée.
- source_word: λαόν
  choice: peuple
  rationale: Le terme désigne ici collectivement la population assemblée, et non exclusivement des soldats.
- source_word: παρεμβολήν
  choice: camp
  rationale: Dans ce cadre militaire et civique, « camp » est le terme français actuel et naturel.
- source_word: ἀπῆλθεν
  choice: il se rendit
  rationale: Le grec de l’édition Swete porte un verbe au singulier. La traduction maintient ce singulier et son ambiguïté référentielle au lieu de le convertir silencieusement en pluriel.
- source_word: τείχη
  choice: murailles
  rationale: « Murailles » désigne naturellement les fortifications d’une ville et convient mieux ici que le terme plus général « murs ».
- source_word: πύργους
  choice: tours
  rationale: Le terme architectural simple suffit; le texte ne précise pas qu’il s’agit de tours de guet.
- source_word: ἀπέστειλεν
  choice: envoya
  rationale: Le verbe indique simplement qu’il fit partir les femmes et les enfants vers leurs maisons.
- source_word: ταπεινώσει πολλῇ
  choice: profonde détresse
  rationale: L’expression décrit l’état de personnes profondément abaissées ou accablées. Dans ce contexte de siège, « profonde détresse » est naturel tout en laissant une note signaler les nuances d’humiliation et d’affliction.
