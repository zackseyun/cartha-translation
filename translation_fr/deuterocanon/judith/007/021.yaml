  text: And the cisterns were being emptied, and they did not have enough water to drink for even one day, because it was given to them to drink by measure.
translation:
  language: fr
  text: Les citernes se vidaient, et ils n’avaient pas assez d’eau à boire pour une seule journée, car on leur en donnait en quantité mesurée.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par mesure » ou « avec parcimonie » ; le grec indique que l’eau était distribuée en rations.
    reason: lexical_alternative
lexical_decisions:
- source_word: λάκκοι
  choice: citernes
  rationale: Dans le contexte du siège, il s’agit de réservoirs creusés servant à stocker l’eau, et non de simples fosses.
- source_word: ἐξεκενοῦντο
  choice: se vidaient
  rationale: L’imparfait exprime un processus en cours; cette formulation française rend naturellement l’épuisement progressif des réserves.
- source_word: οὐκ εἶχον πεῖν ... ὕδωρ
  choice: ils n’avaient pas assez d’eau pour boire
  rationale: Avec εἰς πλησμονήν, la proposition indique une quantité insuffisante plutôt qu’une absence absolue d’eau.
- source_word: εἰς πλησμονὴν
  choice: assez
  rationale: L’expression signifie littéralement « jusqu’à rassasiement » ou « à satiété »; ici, « assez » en restitue clairement le sens quantitatif.
- source_word: ἡμέραν μίαν
  choice: même pour une seule journée
  rationale: « Une seule journée » conserve la durée minimale soulignée par le grec; « même » en explicite la force rhétorique dans un français naturel.
- source_word: ἐν μέτρῳ
  choice: en quantité mesurée
  rationale: Cette expression reste proche du sens littéral « avec mesure » tout en faisant comprendre que l’eau était rationnée.
- source_word: ἐδίδοσαν αὐτοῖς πεῖν
  choice: on leur en donnait
  rationale: Le sujet pluriel non précisé se rend naturellement en français par « on », sans identifier un agent absent du texte; « en » renvoie à l’eau.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La tournure « se vidaient » maintient l’aspect progressif; « en quantité mesurée » rend le rationnement sans employer un vocabulaire administratif trop marqué.
