base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/010.yaml
  text: For this people[a], the sons of Israel, do not rely on their spears, but on the heights of their mountains, in which they themselves dwell[b]; for it is not easy to approach the summits of their mountains.
translation:
  language: fr
  text: Car ce peuple, les fils d’Israël[a], ne mettent pas leur confiance dans leurs lances, mais dans les hauteurs de leurs montagnes, où ils habitent eux-mêmes ; en effet, il n’est pas facile d’atteindre les sommets de leurs montagnes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les descendants d’Israël » ou « les Israélites ». Le grec dit littéralement « les fils d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: Ou « de monter jusqu’aux sommets de leurs montagnes ». Le verbe grec peut exprimer un mouvement vers un lieu élevé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαὸς οὗτος
  choice: ce peuple
  rationale: Rend directement le groupe national désigné dans ce discours militaire, sans employer le terme plus abstrait « nation ».
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: les fils d’Israël
  rationale: Reproduit la formulation grecque masculine plurielle et son apposition à « ce peuple » ; « descendants d’Israël » serait plus idiomatique, mais moins formellement proche.
- source_word: οὐ πέποιθαν ἐπὶ τοῖς δόρασιν αὐτῶν
  choice: ne mettent pas leur confiance dans leurs lances
  rationale: Le parfait πέποιθαν exprime une confiance établie ; « mettre sa confiance dans » est naturel en français et δόρασιν désigne concrètement les lances.
- source_word: ἀλλʼ ἐπὶ τοῖς ὕψεσι τῶν ὀρέων αὐτῶν
  choice: mais dans les hauteurs de leurs montagnes
  rationale: Préserve l’opposition entre les armes et l’avantage défensif du relief, sans donner à « hauteurs » une connotation cultuelle.
- source_word: ἐν οἷς αὐτοὶ ἐνοικοῦσιν ἐν αὐτοῖς
  choice: où ils habitent eux-mêmes
  rationale: Conserve l’emphase de αὐτοὶ tout en évitant de reproduire lourdement la redondance grecque des deux compléments locatifs.
- source_word: οὐ γὰρ ἔστιν εὐχερὲς
  choice: en effet, il n’est pas facile
  rationale: Rend simplement εὐχερές et relie naturellement l’explication à l’affirmation précédente.
- source_word: προσβῆναι
  choice: d’atteindre
  rationale: Dans ce contexte montagneux, le verbe indique l’accès ou la progression jusqu’aux sommets ; « atteindre » est précis sans exclure la nuance de montée.
- source_word: ταῖς κορυφαῖς τῶν ὀρέων αὐτῶν
  choice: les sommets de leurs montagnes
  rationale: κορυφαί désigne les parties les plus élevées ; « sommets » convient au contexte topographique et stratégique.
theological_decisions: []
