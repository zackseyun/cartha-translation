base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/022.yaml
  text: And their little children lost heart[a], and the women and the young men were failing from thirst, and they were falling in the squares of the city and in the passages of the gates[b], and there was no strength left in them.
translation:
  language: fr
  text: Leurs tout-petits perdirent courage[a] ; les femmes et les jeunes gens défaillaient de soif et tombaient sur les places de la ville et dans les passages des portes de la ville[b]. Il ne leur restait plus aucune force.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « furent abattus » ou « défaillirent ». Le grec peut évoquer la perte de courage ou l’affaiblissement intérieur ; « tout-petits » peut aussi désigner des nourrissons.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans les larges rues de la ville et dans les passages des portes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠθύμησεν
  choice: perdirent courage
  rationale: Le verbe exprime l’abattement ou la perte de courage. Cette formulation conserve la dimension intérieure sans réduire le terme à une faiblesse purement physique.
- source_word: τὰ νήπια
  choice: leurs petits enfants
  rationale: νήπια peut désigner de très jeunes enfants, y compris des nourrissons. « Petits enfants » reste naturel tout en préservant cette étendue de sens.
- source_word: ἐξέλιπον ἀπὸ τῆς δίψης
  choice: épuisés par la soif
  rationale: Dans ce contexte, le verbe à l’imparfait décrit un affaiblissement progressif causé par la soif. Le participe français s’articule naturellement avec le verbe principal « tombaient » sans perdre le rapport causal.
- source_word: ἔπιπτον
  choice: tombaient
  rationale: L’imparfait français rend l’action continue ou répétée de l’imparfait grec sans préciser davantage s’il s’agit de chutes ou d’effondrements.
- source_word: πλατείαις
  choice: places
  rationale: Le mot désigne de larges espaces publics urbains ; « places » convient au contexte et demeure naturel en français moderne.
- source_word: διόδοις τῶν πυλῶν
  choice: passages des portes
  rationale: Cette traduction proche du grec garde l’image des voies de passage associées aux portes de la ville, sans les réduire aux seules portes ni imposer l’idée de leurs abords.
- source_word: κραταίωσις
  choice: force
  rationale: Dans le contexte de la déshydratation et des chutes, « force » exprime clairement la capacité physique de tenir ou de résister.
- source_word: οὐκ ἦν κραταίωσις ἔτι ἐν αὐτοῖς
  choice: Il ne leur restait plus aucune force
  rationale: La tournure française rend à la fois la négation, la valeur temporelle de ἔτι et l’idée que la force n’était plus en eux.
