base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/030.yaml
  text: And Uzziah said to them[a], “Take courage, brothers; let us hold out for five more days, within which the Lord our God will turn his mercy toward us, for he will not abandon us forever.”
translation:
  language: fr
  text: 'Ozias leur dit : « Courage, frères ! Tenons bon encore cinq jours, au cours desquels le Seigneur notre Dieu tournera sa miséricorde vers nous, car il ne nous abandonnera pas pour toujours.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il ne nous abandonnera pas jusqu’à la fin » ou « il ne nous abandonnera pas complètement ». L’expression grecque peut évoquer un abandon définitif ou total.'
    reason: La locution εἰς τέλος présente une ambiguïté authentique entre une nuance temporelle et une nuance intensive.
lexical_decisions:
- source_word: Θαρσεῖτε
  choice: Courage !
  rationale: Cette interjection française actuelle restitue naturellement l’impératif pluriel qui exhorte les destinataires à reprendre courage.
- source_word: ἀδελφοί
  choice: frères
  rationale: Le vocatif grec est un masculin pluriel ; « frères » en conserve directement la forme et la dignité.
- source_word: διακαρτερήσωμεν
  choice: Tenons bon
  rationale: Le subjonctif d’exhortation appelle à persévérer sous la pression du siège ; « tenons bon » est naturel et précis dans ce contexte.
- source_word: ἔτι πέντε ἡμέρας
  choice: encore cinq jours
  rationale: ἔτι exprime ici la prolongation pendant cinq jours supplémentaires.
- source_word: ἐν αἷς
  choice: Pendant ce temps
  rationale: Le relatif renvoie aux cinq jours comme période au cours de laquelle l’intervention divine est attendue, sans imposer plus nettement que le grec l’idée d’une échéance stricte.
- source_word: ἐπιστρέψει ... τὸ ἔλεος αὐτοῦ ἐφʼ ἡμᾶς
  choice: tournera sa miséricorde vers nous
  rationale: La formulation conserve la construction transitive et l’orientation exprimée par ἐπί, sans ajouter explicitement l’idée d’un « retour » antérieur.
- source_word: Κύριος ὁ θεὸς ἡμῶν
  choice: le Seigneur notre Dieu
  rationale: Formulation française consacrée et naturelle qui suit exactement le titre divin grec.
- source_word: τὸ ἔλεος αὐτοῦ
  choice: sa miséricorde
  rationale: « Miséricorde » conserve la portée religieuse de ἔλεος et demeure compréhensible en français moderne.
- source_word: οὐ γὰρ ἐγκαταλείψει ἡμᾶς εἰς τέλος
  choice: car il ne nous abandonnera pas pour toujours
  rationale: « Abandonner » rend ἐγκαταλείπω ; « pour toujours » exprime idiomatiquement une valeur possible de εἰς τέλος, tandis que la note conserve l’ambiguïté entre durée finale et abandon total.
theological_decisions:
- issue: Traduction de κύριος pour désigner le Dieu d’Israël dans une source grecque deutérocanonique
  choice: Seigneur
  alternative: Éternel / SEIGNEUR
  rationale: La source porte κύριος et non le tétragramme hébreu ; « Seigneur » traduit donc formellement le texte grec sans reconstruire un autre texte sous-jacent.
- issue: Portée de εἰς τέλος
  choice: pour toujours
  alternative: jusqu’à la fin / complètement
  rationale: L’expression peut avoir une valeur temporelle ou intensive. Le texte principal emploie l’expression française la plus naturelle dans ce contexte, et la note signale les autres nuances réelles sans trancher silencieusement.
- issue: Genre de l’adresse ἀδελφοί
  choice: frères
  alternative: frères et sœurs
  rationale: Le grec emploie explicitement le masculin pluriel. La traduction conserve cette donnée grammaticale sans élargissement interprétatif.
translation_notes:
  register: Français international moderne, oral mais digne. Les phrases sont légèrement segmentées pour restituer clairement l’exhortation d’Ozias. « Courage ! » et « tenons bon » conviennent à une allocution sous siège sans archaïsme ; « miséricorde » maintient le registre biblique sans obscurité excessive.
