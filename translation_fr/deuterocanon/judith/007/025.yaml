  yaml_path: translation/deuterocanon/judith/007/025.yaml
  text: And now there is no one to help us[a]; rather, God has delivered us into their hands[c][b], to be laid low before them in thirst and great destruction.
translation:
  language: fr
  text: Et maintenant, nous n’avons personne pour nous secourir ; mais Dieu nous a vendus entre leurs mains[a], pour que nous soyons abattus devant eux, par la soif et une grande destruction[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Dieu nous a livrés entre leurs mains ». Le verbe grec signifie littéralement « vendre » : c’est une image forte exprimant le fait d’être abandonné au pouvoir de l’ennemi.'
    reason: lexical_alternative
  - marker: b
    text: Ou « pour être abattus devant eux dans la soif et une grande ruine ». Le grec permet de comprendre la soif et la destruction comme la condition ou le moyen de leur chute.
    reason: lexical_alternative
lexical_decisions:
- source_word: βοηθός
  choice: personne ne peut nous secourir
  rationale: Littéralement « il n’y a pas notre secours/notre défenseur ». Cette tournure française exprime naturellement l’absence de toute personne capable de leur venir en aide.
- source_word: πέπρακεν
  choice: nous a vendus
  rationale: Le parfait de πράσκω signifie proprement « vendre ». Le maintien de cette métaphore forte respecte l’affirmation du locuteur selon laquelle Dieu les a livrés au pouvoir de leurs ennemis.
- source_word: εἰς τὰς χεῖρας αὐτῶν
  choice: aux mains de nos ennemis
  rationale: L’expression désigne le fait d’être remis au pouvoir d’autrui. « Nos ennemis » explicite le référent contextuel du pronom sans modifier le sens.
- source_word: τοῦ καταστρωθῆναι
  choice: pour que nous tombions
  rationale: L’infinitif passif peut évoquer le fait d’être abattu, renversé ou étendu à terre. « Tombions » conserve l’image de la défaite sans imposer une modalité précise.
- source_word: ἐναντίον αὐτῶν
  choice: devant eux
  rationale: 'La locution garde ici son sens spatial et relationnel : leur chute se produit sous les yeux de leurs ennemis.'
- source_word: ἐν δίψει
  choice: consumés par la soif
  rationale: ἐν peut marquer la circonstance ou le moyen. Cette formulation française naturelle présente la soif comme la condition et la cause de leur chute.
- source_word: ἀπωλείᾳ μεγάλῃ
  choice: voués à une grande destruction
  rationale: ἀπώλεια désigne la ruine ou la destruction. La formulation conserve la gravité du grec sans introduire le sens théologique spécialisé que pourrait suggérer « perdition ».
theological_decisions:
- issue: L’action de Dieu dans la défaite du peuple
  choice: Dieu nous a vendus aux mains de nos ennemis
  alternative: Dieu nous a livrés aux mains de nos ennemis
  rationale: Le texte attribue explicitement leur situation désespérée à l’action de Dieu. « Vendus » préserve la métaphore frappante du verbe grec et la tension théologique, au lieu de l’atténuer.
translation_notes:
  register: Français international moderne, naturel et digne. La métaphore biblique de la vente est maintenue, tandis que la syntaxe est légèrement déployée pour rendre clairement la relation entre la chute, la soif et la destruction.
