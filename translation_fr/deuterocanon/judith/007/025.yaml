  source_fidelity: 'La métaphore forte de πέπρακεν (« a vendus ») est correctement maintenue. Une révision est toutefois nécessaire : « consumés » et « voués à » explicitent et amplifient des relations que le grec laisse plus condensées et ambiguës. « Entre leurs mains » restitue plus directement εἰς τὰς χεῖρας αὐτῶν, sans ajouter « nos ennemis », même si ce référent est contextuellement clair.'
  naturalness: La phrase révisée reste naturelle dans un français biblique moderne et international. « Nous n’avons personne pour nous secourir » rend clairement l’absence d’un βοηθός ; « mais » correspond sobrement à ἀλλά.
  terminology: « Vendus » préserve le sens littéral et l’image de πράσκω. « Abattus » exprime la défaite impliquée par καταστρωθῆναι sans imposer l’idée spécifique d’être « consumés ». « Grande destruction » rend ἀπωλείᾳ μεγάλῃ sans connotation théologique étrangère.
