    rationale: « Consumés par la soif et voués à une grande destruction » introduit les notions explicites de consumation et de destinée, alors que ἐν δίψει καὶ ἀπωλείᾳ μεγάλῃ peut décrire plus largement la circonstance ou le moyen de l’abattement. La traduction doit conserver cette ambiguïté.
  - severity: low
    issue: Référent explicité et idiome des mains
    rationale: « Aux mains de nos ennemis » explicite αὐτῶν et s’éloigne légèrement de l’idiome grec. « Entre leurs mains » conserve le pronom et l’image source, tout en restant idiomatique en français.
