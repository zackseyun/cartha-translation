  text: And the camp of the sons of Ammon moved on[a], and with them five thousand sons of Asshur[c][b], and they encamped in the valley and seized the waters and the springs of water of the sons of Israel.
translation:
  language: fr
  text: Le camp des fils d’Ammon se mit en route[a], accompagné de cinq mille fils d’Assour. Ils établirent leur camp dans la vallée[b] et s’emparèrent[c] des eaux et des sources d’eau des fils d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leva le camp ».
    reason: lexical_alternative
  - marker: b
    text: Le terme grec peut aussi désigner un vallon, un défilé ou une plaine encaissée, selon le relief.
    reason: lexical_alternative
  - marker: c
    text: Ou « occupèrent les premiers » ; le verbe suggère qu’ils prirent stratégiquement le contrôle des points d’eau avant les autres.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν
  choice: se mit en route
  rationale: Dans ce récit militaire, le verbe indique que le camp lève le départ et poursuit sa marche, sans imposer l’idée d’une avancée offensive.
- source_word: ἡ παρεμβολὴ
  choice: le camp
  rationale: Le nom peut désigner le campement ou la troupe qui y campe; « le camp » conserve naturellement cette double portée collective et militaire.
- source_word: υἱῶν Ἀμμών
  choice: des fils d’Ammon
  rationale: Le calque intelligible préserve la formulation ethnique du grec et fait écho à « fils d’Israël » à la fin du verset.
- source_word: χιλιάδες πέντε υἱῶν Ἀσσούρ
  choice: cinq mille fils d’Assour
  rationale: Cette formulation conserve le nombre et la désignation littérale du groupe dans le grec, sans identifier plus précisément Assour que ne le fait le texte.
- source_word: παρενέβαλον
  choice: établirent leur camp
  rationale: Rend clairement le verbe militaire désignant l’installation d’un camp, dans un français actuel et digne.
- source_word: ἐν τῷ αὐλῶνι
  choice: dans la vallée
  rationale: Dans ce contexte géographique, αὐλών désigne vraisemblablement une vallée, un vallon ou un espace creux plutôt qu’une cour architecturale.
- source_word: προκατελάβοντο
  choice: s’emparèrent
  rationale: Le verbe composé exprime une prise de possession anticipée ou stratégique; « s’emparèrent » rend l’action hostile, tandis qu’une note conserve la nuance temporelle.
- source_word: τὰ ὕδατα καὶ τὰς πηγὰς τῶν ὑδάτων
  choice: les eaux et les sources d’eau
  rationale: La traduction maintient le doublet emphatique du grec au lieu de le réduire au seul « approvisionnement en eau ».
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: des fils d’Israël
  rationale: Préserve l’expression ethnique traditionnelle du grec ainsi que son parallélisme avec « fils d’Ammon ».
