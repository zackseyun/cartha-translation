  source_fidelity: 'Le texte français rend fidèlement la succession des actions et les éléments du grec : le départ du camp ammonite, les cinq mille fils d’Assour qui l’accompagnent, leur installation dans l’αὐλών, puis la prise stratégique des eaux et de leurs sources appartenant aux fils d’Israël. Le pluriel « Ils établirent… et s’emparèrent… » correspond naturellement aux verbes grecs au pluriel après la mention des forces en présence.'
