  text: And all the people gathered against Oziah and the rulers of the city—the young men[a], the women, and the children—and they cried out with a loud voice and spoke against the elders,
translation:
  language: fr
  text: 'Tout le peuple se rassembla auprès d’Ozias et des dirigeants de la ville — les jeunes hommes, les femmes et les enfants — ; ils poussèrent de grands cris et parlèrent devant les anciens[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les prépositions grecques peuvent aussi être comprises dans un sens adversatif : « contre Ozias et les dirigeants de la ville » et « parlèrent contre les anciens ». Le contexte est celui d’une plainte publique, mais n’impose pas ce sens.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  choice: se rassembla
  rationale: L’aoriste passif à valeur intransitive décrit le rassemblement du peuple; « se rassembla » est naturel et respecte le sujet collectif singulier.
- source_word: πᾶς ὁ λαός
  choice: Tout le peuple
  rationale: Cette expression désigne l’ensemble de la communauté et se rend naturellement ainsi en français.
- source_word: ἐπὶ Ὀζείαν
  choice: contre Ozias
  rationale: Dans ce contexte de plainte publique et de pression exercée sur les autorités, ἐπί avec l’accusatif a vraisemblablement une valeur adversative.
- source_word: τοὺς ἄρχοντας τῆς πόλεως
  choice: les dirigeants de la ville
  rationale: Le terme désigne les autorités civiques; « dirigeants » exprime leur fonction sans leur attribuer une charge institutionnelle trop précise.
- source_word: οἱ νεανίσκοι
  choice: les jeunes hommes
  rationale: Le grec est masculin pluriel et distingue ce groupe des femmes et des enfants.
- source_word: τὰ παιδία
  choice: les enfants
  rationale: Traduction claire et courante du terme grec dans cette énumération.
- source_word: ἀνεβόησαν φωνῇ μεγάλῃ
  choice: Ils poussèrent de grands cris
  rationale: Cette formulation française naturelle conserve l’intensité de l’expression grecque sans calquer maladroitement « d’une grande voix ».
- source_word: εἶπαν ἐναντίον τῶν πρεσβυτέρων
  choice: parlèrent contre les anciens
  rationale: Le contexte de protestation favorise le sens adversatif de ἐναντίον; « anciens » conserve le titre communautaire traditionnel de πρεσβύτεροι.
