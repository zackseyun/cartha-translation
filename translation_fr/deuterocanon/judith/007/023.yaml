translation_notes:
  register: Français moderne, international et digne. Le singulier collectif « Tout le peuple se rassembla » est suivi d’un pluriel lorsque les groupes qui le composent deviennent le sujet implicite. La ponctuation finale par deux-points maintient le lien avec les paroles rapportées au verset suivant.
