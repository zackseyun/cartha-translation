base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/001.yaml
  text: On the next day Holofernes ordered all his army and all his people who had come for his alliance to break camp for Bethulia[a], to seize the passes of the hill country in advance[b], and to make war against the sons of Israel.
translation:
  language: fr
  text: Le lendemain, Holopherne ordonna à toute son armée et à tout son peuple, qui étaient venus se joindre à son alliance[a], de lever le camp en direction de Béthulie, d’occuper à l’avance les voies d’accès de la région montagneuse et de faire la guerre aux fils d’Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « qui étaient venus comme ses alliés ». Le grec dit littéralement : « qui étaient venus pour son alliance ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « aux Israélites ». Le grec porte « aux fils d’Israël », expression familiale traditionnelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: Le lendemain
  rationale: Expression temporelle naturelle en français, qui maintient clairement la succession narrative.
- source_word: παρήγγειλεν
  choice: ordonna
  rationale: Le verbe exprime ici un ordre donné avec autorité dans un contexte militaire.
- source_word: πάσῃ τῇ στρατείᾳ αὐτοῦ
  choice: à toute son armée
  rationale: στρατεία désigne ici l’ensemble des forces armées d’Holopherne.
- source_word: παντὶ τῷ λαῷ αὐτοῦ
  choice: à tout son peuple
  rationale: Cette formulation conserve la portée plus large de λαός sans le réduire explicitement aux seuls soldats.
- source_word: οἳ παρεγένοντο ἐπὶ τὴν συμμαχίαν αὐτοῦ
  choice: qui était venu rejoindre son alliance
  rationale: Rend de façon naturelle l’idée de personnes venues participer à l’alliance d’Holopherne, tout en signalant en note la formulation plus littérale et son autre interprétation possible.
- source_word: ἀναζευγνύειν
  choice: de lever le camp
  rationale: Dans l’usage militaire, le verbe désigne le fait de quitter le camp pour se mettre en marche.
- source_word: ἐπὶ Βαιτυλουὰ
  choice: en direction de Béthulie
  rationale: Avec un verbe de mouvement, ἐπί indique ici la direction; cette traduction n’ajoute pas une nuance hostile déjà exprimée à la fin du verset.
- source_word: τὰς ἀναβάσεις τῆς ὀρεινῆς
  choice: les voies d’accès à la région montagneuse
  rationale: ἀναβάσεις désigne littéralement des montées ou des accès ascendants; dans ce contexte stratégique, il s’agit des routes permettant d’entrer dans la région montagneuse.
- source_word: προκαταλαμβάνεσθαι
  choice: d’occuper d’avance
  rationale: Le préverbe προ- exprime l’occupation préalable ou préventive de ces accès.
- source_word: ποιεῖν πόλεμον πρὸς
  choice: de faire la guerre à
  rationale: Cette tournure française reste proche de l’expression grecque tout en étant claire et digne.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: aux fils d’Israël
  rationale: Conserve la désignation familiale traditionnelle et explicitement masculine du grec; une formulation ethnique plus courante est donnée en note.
theological_decisions:
- issue: Rendu de la désignation ethnique et familiale τοὺς υἱοὺς Ἰσραήλ
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: La formulation principale conserve l’image familiale du texte grec sans la neutraliser; la note offre l’équivalent ethnique courant sans imposer une différence doctrinale.
- issue: Portée de οἳ παρεγένοντο ἐπὶ τὴν συμμαχίαν αὐτοῦ
  choice: qui était venu rejoindre son alliance
  alternative: qui était venu comme allié d’Holopherne
  rationale: Le grec permet de comprendre soit la venue en vue de l’alliance, soit la venue en qualité d’alliés. Le texte principal reste proche de la construction grecque et la note préserve l’autre lecture.
translation_notes:
  register: Français international moderne, narratif et soutenu sans archaïsme. Les termes militaires sont concrets et accessibles. Les deux notes conservent les nuances lexicales du grec sans alourdir le texte principal.
