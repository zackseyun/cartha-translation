review_pass:
  verdict: revise
  source_fidelity: 'Le sens global est fidèle au grec : ordre militaire, départ vers Béthulie, occupation préalable des accès montagneux et guerre contre les fils d’Israël. Une correction est toutefois nécessaire : le relatif grec οἳ est au pluriel et se rapporte à l’ensemble coordonné « armée et peuple » ; le singulier « qui était venu » ne le rend pas correctement. « Se joindre à son alliance » exprime naturellement la valeur de συμμαχία sans surinterpréter la préposition ἐπί.'
  naturalness: Le français est clair et de registre narratif soutenu. « Qui étaient venus se joindre à son alliance » est plus idiomatique que « qui était venu rejoindre son alliance ». « Occuper à l’avance les voies d’accès » conserve la nuance préventive de προκαταλαμβάνεσθαι et reste naturel.
  terminology: Holopherne et Béthulie sont des formes françaises établies. « Fils d’Israël » préserve la désignation familiale du grec ; la note fournit l’équivalent usuel « Israélites ». « Région montagneuse » rend correctement ὀρεινή.
  issues:
  - severity: medium
    issue: Accord et portée de la relative
    rationale: Le texte grec emploie le relatif pluriel οἳ après « toute son armée et tout son peuple ». Le singulier français « qui était venu » ne peut représenter cette référence coordonnée et tend à limiter la relative à « peuple ».
  - severity: low
    issue: Formulation de la note a
    rationale: « Vers son alliance » n’est pas une bonne littéralité française de ἐπὶ τὴν συμμαχίαν αὐτοῦ dans ce contexte. « Pour son alliance » reflète plus directement la formulation grecque, tandis que l’alternative explicite la lecture alliée.
  revised_text: Le lendemain, Holopherne ordonna à toute son armée et à tout son peuple, qui étaient venus se joindre à son alliance[a], de lever le camp en direction de Béthulie, d’occuper à l’avance les voies d’accès de la région montagneuse et de faire la guerre aux fils d’Israël[b].
  revised_footnotes:
