  text: And each of them took up his weapons of war, and after kindling fires on their towers, they remained on guard through that whole night.
translation:
  language: fr
  text: Chacun prit son équipement de guerre. Après avoir allumé des feux sur leurs tours, ils restèrent de garde toute cette nuit-là.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναλαβόντες
  choice: prit
  rationale: Le participe aoriste exprime ici le fait de prendre son équipement en vue de l’action; « prit » est naturel en français et la succession des actions reste marquée par la coordination.
- source_word: ἕκαστος
  choice: Chacun
  rationale: Rend directement la valeur distributive du grec sans ajouter de référent masculin absent du texte.
- source_word: τὰ σκεύη τὰ πολεμικὰ αὐτῶν
  choice: son équipement de guerre
  rationale: σκεύη désigne plus largement le matériel ou l’équipement que les seules armes; le singulier collectif français est idiomatique, et « son » conserve la distribution impliquée par « chacun ».
- source_word: ἀνακαύσαντες πυράς
  choice: après avoir allumé des feux
  rationale: Cette tournure rend l’antériorité du participe aoriste par rapport au verbe principal et conserve l’image concrète des feux.
- source_word: ἐπὶ τοὺς πύργους αὐτῶν
  choice: sur leurs tours
  rationale: Dans ce contexte, ἐπί avec l’accusatif indique naturellement l’emplacement des feux sur les tours.
- source_word: ἔμενον φυλάσσοντες
  choice: ils restèrent de garde
  rationale: Rend à la fois la continuité exprimée par ἔμενον et l’activité vigilante de φυλάσσοντες dans un français militaire naturel.
- source_word: ὅλην τὴν νύκτα ἐκείνην
  choice: pendant toute cette nuit-là
  rationale: Conserve l’insistance sur la durée entière ainsi que la valeur démonstrative de ἐκείνην.
