revisions:
- from: 'Mais les fils d’Israël, quand ils virent combien ils étaient nombreux, furent profondément bouleversés. Chacun dit à son prochain : « Maintenant, ces gens vont lécher toute la surface du pays[a] ; ni les hautes montagnes, ni les ravins, ni les collines ne pourront supporter leur poids. »'
  to: 'Mais les fils d’Israël, quand ils virent combien ils étaient nombreux, furent très troublés, et chacun dit à son prochain : « Maintenant, ces hommes vont lécher[a] toute la surface du pays ; ni les hautes montagnes, ni les ravins, ni les collines ne pourront supporter leur poids. »'
  rationale: La révision harmonise le récit, remplace un démonstratif français inutilement marqué par une formulation plus proche du grec, et clarifie la note lexicale tout en préservant l’image inhabituelle et l’hyperbole du texte source. L’ancre est placée immédiatement après le verbe auquel la note se rapporte.
