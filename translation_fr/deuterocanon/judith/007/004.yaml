  yaml_path: translation/deuterocanon/judith/007/004.yaml
  text: But the sons of Israel[a], when they saw their great number, were greatly troubled, and each said to his neighbor, “Now these men will lick up the whole face of the land[b], and neither the high mountains nor the ravines nor the hills will bear their weight.”
translation:
  language: fr
  text: 'Mais les fils d’Israël, quand ils virent combien ils étaient nombreux, furent très troublés, et chacun dit à son prochain : « Maintenant, ces hommes vont lécher[a] toute la surface du pays ; ni les hautes montagnes, ni les ravins, ni les collines ne pourront supporter leur poids. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de manière plus explicite, « dévorer toute l’étendue du pays ». Le verbe grec signifie littéralement « lécher » ou « laper » et évoque l’idée de faire disparaître entièrement ce qui couvre le pays.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ υἱοὶ Ἰσραήλ
  choice: Mais les fils d’Israël
  rationale: Rend de près l’expression grecque tout en conservant son registre biblique et son sens collectif.
- source_word: ὡς ἴδον αὐτῶν τὸ πλῆθος
  choice: quand ils virent combien ils étaient nombreux
  rationale: Exprime naturellement en français l’idée de la multitude impressionnante désignée par πλῆθος.
- source_word: ἐταράχθησαν σφόδρα
  choice: furent profondément bouleversés
  rationale: Traduit l’agitation intense exprimée par ταράσσω et renforcée par σφόδρα, sans préciser indûment qu’il s’agit uniquement de terreur.
- source_word: ἕκαστος πρὸς τὸν πλησίον αὐτοῦ
  choice: Chacun dit à son prochain
  rationale: Reproduit l’expression relationnelle du grec dans un français biblique encore clair aujourd’hui.
- source_word: Νῦν ἐκλείξουσιν οὗτοι
  choice: Maintenant, ces gens vont lécher
  rationale: Conserve la métaphore frappante du verbe ἐκλείχω, qui signifie littéralement « lécher entièrement » et évoque une dévastation totale.
- source_word: τὸ πρόσωπον τῆς γῆς πάσης
  choice: toute la surface du pays
  rationale: Rend le sens concret de l’idiome « la face de toute la terre », ici compris comme l’étendue du pays, dans un français naturel.
- source_word: οὔτε τὰ ὄρη τὰ ὑψηλὰ οὔτε αἱ φάραγγες οὔτε οἱ βουνοί
  choice: ni les hautes montagnes, ni les ravins, ni les collines
  rationale: Maintient la distinction entre les trois formes de relief mentionnées dans le grec.
- source_word: ὑποστήσονται τὸ βάρος αὐτῶν
  choice: ne pourront supporter leur poids
  rationale: Préserve l’image physique d’un territoire incapable de porter le poids d’une armée immense.
