  text: And on the second day Holofernes brought out all his cavalry in front of the sons of Israel who were in Bethulia,[a]
translation:
  language: fr
  text: Le deuxième jour, Holopherne fit sortir toute sa cavalerie face aux fils d’Israël qui se trouvaient à Béthulie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux Israélites ». Le grec porte « aux fils d’Israël », désignation ethnique traditionnelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ... ἡμέρᾳ τῇ δευτέρᾳ
  choice: Le deuxième jour
  rationale: Le datif articulé a une valeur temporelle. Cette formulation rend directement la succession indiquée par le grec sans l’interpréter comme « le lendemain ».
- source_word: ἐξήγαγεν
  choice: fit sortir
  rationale: Le verbe signifie faire sortir ou conduire hors de. « Fit sortir » demeure naturel en français et n’ajoute pas l’idée plus précise d’une marche militaire.
- source_word: πᾶσαν τὴν ἵππον αὐτοῦ
  choice: toute sa cavalerie
  rationale: Dans ce contexte militaire, ἵππος est un collectif désignant les troupes montées. « Toute sa cavalerie » restitue idiomatiquement le sens et rattache clairement αὐτοῦ à Holopherne.
- source_word: κατὰ πρόσωπον
  choice: face à
  rationale: La locution exprime une position devant ou en vis-à-vis. « Face à » est concise, actuelle et convient au déploiement militaire sans préciser davantage l’intention.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: aux fils d’Israël
  rationale: Cette traduction conserve l’expression ethnique traditionnelle et la forme concrète du grec. Une note signale l’équivalent français plus idiomatique « les Israélites ».
- source_word: οἳ ἦσαν ἐν Βετυλουά
  choice: qui se trouvaient à Béthulie
  rationale: La relative identifie le groupe par son emplacement. Pour une ville, « à Béthulie » est plus naturel en français que « dans Béthulie », tandis que « se trouvaient » rend simplement ἦσαν.
