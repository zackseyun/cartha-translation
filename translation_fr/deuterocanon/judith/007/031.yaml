  text: But if these days pass and no help comes upon us, I will do according to your words.
translation:
  language: fr
  text: Mais si ces jours passent et qu’aucun secours ne nous arrive, je ferai selon vos paroles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν δὲ διέλθωσιν αὗται
  choice: Mais si ces jours passent
  rationale: Reproduit naturellement la condition et le référent féminin pluriel implicite, « ces [journées] », établi par le contexte.
- source_word: μὴ ἔλθῃ ἐφʼ ἡμᾶς βοήθεια
  choice: sans qu’aucun secours ne nous parvienne
  rationale: Exprime l’absence de secours venant jusqu’à la communauté; « parvenir » rend idiomatiquement le mouvement indiqué par ἔλθῃ ἐφ’ ἡμᾶς sans imposer le calque peu naturel « venir sur nous ».
- source_word: ποιήσω κατὰ τὰ ῥήματα ὑμῶν
  choice: je ferai ce que vous avez demandé
  rationale: Dans ce contexte, les « paroles » désignent la proposition ou l’exigence formulée par les interlocuteurs; cette tournure française en communique clairement la portée.
