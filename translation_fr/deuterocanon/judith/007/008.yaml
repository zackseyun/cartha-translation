  text: And all the rulers of the sons of Esau[a], and all the leaders of the people of Moab, and the generals of the seacoast came to him and said[b],
translation:
  language: fr
  text: 'Tous les chefs des fils d’Ésaü[a], tous les dirigeants du peuple de Moab et les commandants de la région côtière[b] s’approchèrent de lui et dirent :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Édomites » : l’expression grecque dit littéralement « fils d’Ésaü ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « littoral ».
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: s’approchèrent de lui
  rationale: Le participe aoriste introduit le verbe principal εἶπαν. La coordination française rend naturellement l’action préalable et le mouvement vers la personne.
- source_word: ἄρχοντες
  choice: chefs
  rationale: Le terme désigne ici des personnes investies d’autorité; « chefs » convient au cadre ethnopolitique et reste distinct de ἡγούμενοι.
- source_word: υἱῶν Ἠσαῦ
  choice: fils d’Ésaü
  rationale: Conserve l’expression grecque littérale et sa désignation généalogique, sans la remplacer silencieusement par l’équivalent ethnique « Édomites ».
- source_word: ἡγούμενοι
  choice: dirigeants
  rationale: Rend une fonction de direction tout en maintenant une distinction lexicale avec ἄρχοντες, traduit par « chefs ».
- source_word: λαοῦ Μωὰβ
  choice: peuple de Moab
  rationale: Reproduit clairement et sans compression la construction génitive grecque.
- source_word: στρατηγοὶ
  choice: commandants
  rationale: Désigne des responsables militaires; « commandants » est naturel, actuel et n’impose pas un grade moderne précis comme pourrait le faire « généraux ».
- source_word: παραλίας
  choice: région côtière
  rationale: Le nom désigne le littoral ou le territoire situé le long de la mer; « région côtière » conserve cette portée géographique.
- source_word: εἶπαν
  choice: dirent
  rationale: Équivalent narratif français standard du verbe grec, avec les deux-points annonçant la parole qui suit.
theological_decisions: []
