  text: And you will repay them with an evil recompense[b][a], because they rebelled and did not meet you in peace.
translation:
  language: fr
  text: Et tu leur rendras une mauvaise rétribution[a], parce qu’ils se sont révoltés et ne sont pas venus à ta rencontre en paix[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu leur rendras une mauvaise rétribution ». En grec, le verbe et le nom sont apparentés, ce qui renforce l’idée de rétribution.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ne sont pas allés à ta rencontre dans un esprit de paix ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνταποδώσεις αὐτοῖς ἀνταπόδομα πονηρόν
  choice: tu leur infligeras un châtiment terrible
  rationale: Cette formulation française naturelle exprime clairement la rétribution défavorable. La note conserve la construction grecque où le verbe et le nom apparentés renforcent l’idée de rendre à chacun selon ses actes.
- source_word: ἀνθʼ ὧν
  choice: parce que
  rationale: Dans ce contexte, la locution introduit le motif de la rétribution; « parce que » en rend clairement la valeur causale.
- source_word: ἐστασίασαν
  choice: ils se sont révoltés
  rationale: Le verbe désigne ici une attitude de rébellion ou de sédition; « se sont révoltés » en conserve la force sans ajout interprétatif.
- source_word: οὐκ ἀπήντησαν
  choice: ne sont pas venus à ta rencontre
  rationale: Le verbe peut désigner le fait d’aller ou de venir à la rencontre de quelqu’un. La formulation retenue est idiomatique et garde cette dimension de mouvement.
- source_word: τῷ προσώπῳ σου
  choice: à ta rencontre
  rationale: Littéralement « à ta face », l’expression vise la personne elle-même. Le français idiomatique n’exige pas de rendre séparément « face ».
- source_word: ἐν εἰρήνῃ
  choice: en paix
  rationale: La tournure conserve l’amplitude de l’expression grecque, qui peut évoquer une démarche pacifique, un accueil paisible ou des intentions de paix.
theological_decisions:
- issue: Nature du jugement demandé au destinataire divin
  choice: Conserver le futur adressé directement à Dieu, comme demande ou affirmation confiante de rétribution
  alternative: Transformer la phrase en impératif explicite ou en maxime générale sur la justice divine
  rationale: Le futur grec peut porter, dans ce contexte de prière, la nuance d’un appel confiant sans être formellement un impératif. Le maintien du futur préserve cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. « Châtiment terrible » évite une répétition peu idiomatique tout en maintenant la sévérité de πονηρόν; la construction grecque est signalée en note. Le futur et l’expression « en paix » restent volontairement ouverts quant à leur nuance exacte.
