  text: And now[a], master, do not fight against them as in a pitched battle, and not one man from your people will fall.
translation:
  language: fr
  text: 'Et maintenant, maître, ne les combats pas comme on livre une bataille rangée[a] : pas un seul homme de ton peuple ne tombera.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme se livre un combat en ordre de bataille ». Le grec désigne un affrontement conventionnel entre troupes rangées en formation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δέσποτα
  choice: maître
  rationale: Apostrophe adressée ici à un supérieur humain. « Maître » distingue δέσποτα de κύριος, généralement rendu par « Seigneur », tout en restant naturel dans ce contexte.
- source_word: μὴ πολέμει
  choice: ne les combats pas
  rationale: L’impératif présent précédé de μή exprime une interdiction. Le pronom « les » reprend explicitement αὐτούς.
- source_word: καθὼς γίνεται πόλεμος παρατάξεως
  choice: comme on livre une bataille rangée
  rationale: παράταξις évoque des troupes disposées en ordre de bataille. Cette formulation française naturelle conserve l’idée d’un affrontement conventionnel en formation.
- source_word: οὐ πεσεῖται
  choice: ne tombera
  rationale: Dans un contexte militaire, πίπτω signifie tomber au combat, sans que la traduction ait besoin d’expliciter davantage l’issue.
- source_word: ἀνὴρ εἷς
  choice: pas un seul homme
  rationale: La formulation garde le masculin explicite ἀνήρ et l’insistance du numéral εἷς.
- source_word: λαοῦ σου
  choice: ton peuple
  rationale: λαός désigne normalement le peuple. Malgré le contexte militaire, le grec n’emploie pas ici un terme plus précis tel que « armée » ou « troupes ».
theological_decisions:
- issue: Titre d’adresse δέσποτα et distinction avec κύριος
  choice: maître
  alternative: seigneur ; souverain
  rationale: Le locuteur s’adresse à un supérieur humain, non à Dieu. « Maître » préserve la distinction lexicale avec κύριος sans introduire de portée théologique étrangère au contexte.
translation_notes:
  register: Français moderne, international et digne. « Bataille rangée » est idiomatique et précise le caractère conventionnel du combat. Les deux propositions sont reliées par deux-points afin de rendre clairement la conséquence stratégique exprimée dans le contexte, sans ajouter de causalité explicite absente du grec.
