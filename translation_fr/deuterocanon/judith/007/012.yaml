  text: Remain by your camp, securing every man from your force, and let your servants gain control of the spring of water that comes out from the foot of the mountain,
translation:
  language: fr
  text: Reste dans ton camp, en assurant la sécurité de chaque homme de tes troupes, et que tes serviteurs[a] prennent le contrôle de la source d’eau qui sort du pied de la montagne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes hommes » ; le terme grec peut désigner des serviteurs, des assistants ou des subordonnés.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « de la racine de la montagne », c’est-à-dire de sa base.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάμεινον
  choice: Reste
  rationale: L’impératif demande de demeurer sur place. « Reste » est naturel en français moderne et convient à une consigne militaire.
- source_word: ἐπὶ τῆς παρεμβολῆς σου
  choice: près de ton camp
  rationale: παρεμβολή désigne ici le camp militaire. La préposition ἐπί avec le génitif permet une relation de proximité ; « près de » évite l’expression peu naturelle « sur ton camp ».
- source_word: ἀσφαλίζων
  choice: veille à la sécurité
  rationale: Le participe exprime l’action de mettre ou de maintenir en sûreté. Cette formulation restitue clairement la consigne sans suggérer seulement une surveillance passive.
- source_word: πάντα ἄνδρα ἐκ τῆς δυνάμεώς σου
  choice: chaque homme de ton armée
  rationale: πάντα ἄνδρα est distributif, tandis que δύναμις désigne ici la force militaire. « Armée » est plus idiomatique que « force » dans cette phrase française.
- source_word: ἐπικρατησάτωσαν
  choice: prennent le contrôle
  rationale: Le verbe signifie devenir maître de quelque chose ou s’en assurer la maîtrise ; la tournure convient à l’objectif tactique visant la source.
- source_word: οἱ παῖδές σου
  choice: tes serviteurs
  rationale: παῖδες peut désigner des serviteurs, des assistants ou des subordonnés. « Serviteurs » conserve le sens lexical direct, avec une note signalant l’alternative contextuelle.
- source_word: πηγῆς τοῦ ὕδατος
  choice: la source d’eau
  rationale: Rendu concret et naturel de la construction grecque, qui désigne une source plutôt qu’un point d’eau indéterminé.
- source_word: ἡ ἐκπορεύεται
  choice: qui jaillit
  rationale: Dans le contexte d’une source, le verbe de sortie ou de provenance se rend naturellement par « jaillit », sans altérer le mouvement indiqué.
- source_word: ἐκ τῆς ῥίζης τοῦ ὄρους
  choice: au pied de la montagne
  rationale: Littéralement « depuis la racine de la montagne » ; l’expression topographique française idiomatique est « au pied de la montagne ».
