review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : campement militaire, famine, épée et effondrement dans les espaces urbains. Toutefois, « pour les surveiller » réoriente εἰς προφυλακήν vers la surveillance des référentes féminines, alors que l’expression décrit la fonction de garde/blocus du campement, explicitée par la proposition finale empêchant toute sortie de la ville. « Près d’elles » peut convenir à l’ambiguïté du pronom féminin, mais « pour monter la garde » rend mieux le grec sans identifier le référent.'
  naturalness: Le français est globalement naturel, clair et de registre approprié. « Nous camperons près d’elles, pour monter la garde » est plus idiomatique et plus exact dans le contexte militaire que « établirons notre camp près d’elles pour les surveiller ».
  terminology: '« Dépériront », « famine », « épée », « seront étendus » et « lieu d’habitation » sont recevables. La note doit cependant conserver la voix passive du grec : « ils joncheront » fait des victimes l’agent de l’action, tandis que καταστρωθήσονται les présente comme abattues ou étendues.'
