  text: And we will encamp against them as a guard[a], so that not one man may go out from the city. And they, and their wives, and their children, will waste away in the famine, and before the sword comes upon them, they will be laid low in the streets of their dwellings.
translation:
  language: fr
  text: Nous camperons près d’elles, pour monter la garde, afin que pas un seul homme ne sorte de la ville. Eux, leurs femmes et leurs enfants dépériront dans la famine et, avant même que l’épée ne les atteigne, ils seront étendus dans les rues de leur lieu d’habitation.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils seront étendus dans les places de leur lieu d’habitation ». Le grec peut désigner de larges rues ou des places publiques, et le verbe peut évoquer le fait d’être abattu, jeté à terre ou étendu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεμβαλοῦμεν ἐπʼ αὐταῖς εἰς προφυλακὴν
  choice: Nous établirons notre camp près d’elles pour les surveiller
  rationale: παρεμβάλλω décrit l’établissement d’un camp militaire. ἐπʼ αὐταῖς reste spatialement ambigu; «près d’elles» convient mieux au contrôle des points d’eau, référent féminin probable dans le contexte, tandis que «pour les surveiller» exprime naturellement la fonction de προφυλακή.
- source_word: τοῦ μὴ ἐξελθεῖν ἐκ τῆς πόλεως ἄνδρα ἕνα
  choice: afin que pas un seul homme ne sorte de la ville
  rationale: La formulation conserve la construction de prévention et l’insistance du grec sur «un seul homme», sans la neutraliser en «personne».
- source_word: τακήσονται
  choice: dépériront
  rationale: Le verbe évoque littéralement le fait de fondre ou de se consumer; «dépériront» rend clairement l’affaiblissement progressif causé par la famine.
- source_word: ἐν τῷ λιμῷ
  choice: dans la famine
  rationale: Cette expression maintient λιμός au sens de famine et présente celle-ci comme la condition dans laquelle les habitants dépérissent.
- source_word: ῥομφαίαν
  choice: l’épée
  rationale: «L’épée» est le terme français courant et digne pour cette arme dans un contexte militaire.
- source_word: καταστρωθήσονται
  choice: ils seront étendus
  rationale: Le verbe peut évoquer le fait d’être abattu, jeté à terre ou étendu. Cette formulation conserve l’image corporelle sans préciser explicitement qu’ils seront morts.
- source_word: ἐν ταῖς πλατείαις
  choice: dans les rues
  rationale: πλατεῖαι peut désigner de larges rues ou des places publiques. «Rues» convient au texte principal, tandis que l’autre possibilité est signalée en note.
- source_word: τῆς οἰκήσεως αὐτῶν
  choice: de leur lieu d’habitation
  rationale: Cette formulation garde le sens collectif et quelque peu formel de οἴκησις, sans le réduire à leurs maisons individuelles.
