    issue: « pour les surveiller »
    rationale: Cette formulation fait de la garde une surveillance directe des référentes de αὐταῖς et affaiblit la fonction de blocus exprimée par εἰς προφυλακήν et la proposition « afin que… ». « pour monter la garde » préserve mieux le sens militaire sans résoudre l’antécédent féminin.
  - severity: low
    issue: 'Note : « ils joncheront les places »'
    rationale: Cette alternative emploie un verbe actif alors que καταστρωθήσονται est passif. Une formulation passive telle que « ils seront étendus dans les places » maintient l’image sans modifier les rôles syntaxiques.
