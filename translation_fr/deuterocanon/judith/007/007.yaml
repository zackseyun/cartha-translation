base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/007.yaml
  text: And he inspected the approaches to their city[a], and he took control of the springs of water and seized them, and he stationed camps of fighting men by them[c][b]; and he himself returned to his people.
translation:
  language: fr
  text: Il examina les voies d’accès qui montaient vers leur ville[a]. Il inspecta les sources d’eau[b] et s’en empara d’avance, puis il établit près d’elles des campements de guerriers. Quant à lui, il leva le camp et rejoignit son peuple[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les montées vers leur ville ». Le grec souligne que les voies d’accès étaient en pente.
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec est rare ; il peut aussi signifier « parcourut » ou « patrouilla autour des sources d’eau ».
    reason: lexical_alternative
  - marker: c
    text: Ou « il partit vers son peuple ». Le verbe grec peut évoquer l’action de lever le camp avant de se mettre en route.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεσκέψατο
  choice: examina
  rationale: Dans ce contexte militaire, le verbe décrit l’examen tactique des accès à la ville plutôt qu’une simple visite.
- source_word: ἀναβάσεις
  choice: les voies d’accès qui montaient vers
  rationale: Le nom signifie littéralement « montées » ou « ascensions »; cette formulation naturelle conserve le relief et l’idée des routes permettant d’atteindre la ville.
- source_word: πηγὰς τῶν ὑδάτων
  choice: les sources d’eau
  rationale: Rendu concret et proche du grec, qui désigne les points d’approvisionnement en eau visés par l’opération militaire.
- source_word: ἐφώδευεν
  choice: inspecta
  rationale: Le verbe rare peut évoquer le fait de parcourir un lieu, d’y faire une ronde ou de l’inspecter. « Inspecta » convient à la reconnaissance tactique sans introduire l’idée non explicite de fortifications.
- source_word: προκατέλαβε
  choice: s’en empara avant eux
  rationale: Le composé exprime une prise de possession anticipée. « Avant eux » rend la valeur du préfixe προ- sans préciser davantage qui devait arriver, le contexte fournissant implicitement les habitants ou défenseurs.
- source_word: ἐπέστησεν
  choice: établit
  rationale: Avec « campements », ce verbe rend naturellement l’action de placer et maintenir une présence militaire à proximité des sources.
- source_word: παρεμβολὰς
  choice: des campements
  rationale: Le terme désigne ici des camps ou installations militaires, plutôt que nécessairement les unités elles-mêmes.
- source_word: ἀνδρῶν πολεμιστῶν
  choice: de combattants
  rationale: Expression française actuelle et digne pour des hommes engagés dans le combat; le masculin grammatical reste conforme au groupe explicitement masculin du grec.
- source_word: ἀνέζευξεν
  choice: leva le camp et rejoignit
  rationale: Le verbe peut signifier lever le camp, partir ou se remettre en marche. La destination εἰς τὸν λαὸν αὐτοῦ indique qu’il rejoint les siens.
