base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/027.yaml
  text: For it is better for us to become plunder for them[a]; for we will become servants, and our lives will be spared, and we will not see with our own eyes the death of our little children[d][c][b], and our wives and our children breathing out their lives.
translation:
  language: fr
  text: 'Car il vaut mieux pour nous devenir leur butin[a] : nous deviendrons esclaves et nous resterons en vie[b], et nous ne verrons pas de nos propres yeux[c] la mort de nos tout-petits, ni nos femmes et nos enfants rendre leur dernier souffle[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devenir pour eux une proie » ou « être livrés à leur pillage ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « notre âme [ou : notre vie] vivra ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « sous nos yeux ».
    reason: lexical_alternative
  - marker: d
    text: 'Littéralement : « nos femmes et nos enfants, leur vie s’éteignant ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖσσον
  choice: il vaut mieux
  rationale: Rend naturellement en français le comparatif exprimant ce qui paraît préférable dans cette situation tragique.
- source_word: γενηθῆναι αὐτοῖς εἰς διαρπαγήν
  choice: devenir leur butin
  rationale: Conserve l’image brutale de personnes livrées à la prise des conquérants, sans la réduire au seul pillage de biens.
- source_word: δούλους
  choice: esclaves
  rationale: Le contexte est celui d’une soumission forcée après reddition ; « esclaves » exprime clairement cet asservissement.
- source_word: ζήσεται ἡ ψυχὴ ἡμῶν
  choice: nous resterons en vie
  rationale: Expression idiomatique française correspondant au sens de la formule grecque, littéralement « notre vie/âme vivra ».
- source_word: τῶν νηπίων ἡμῶν
  choice: nos tout-petits
  rationale: νήπια désigne de très jeunes enfants ; « tout-petits » préserve l’émotion du passage sans fixer un âge aussi étroit que « nourrissons ».
- source_word: ἐν ὀφθαλμοῖς ἡμῶν
  choice: de nos propres yeux
  rationale: Rend l’insistance sur le fait d’assister personnellement à la scène.
- source_word: ἐκλειπούσας τὰς ψυχὰς αὐτῶν
  choice: rendre leur dernier souffle
  rationale: Formulation française concrète et digne pour l’image de leurs vies qui s’éteignent.
theological_decisions:
- issue: Sens de δούλους dans un contexte de conquête
  choice: esclaves
  alternative: serviteurs
  rationale: La soumission envisagée est imposée par l’ennemi et opposée à la mort ; « serviteurs » atténuerait indûment la coercition.
- issue: Portée de ψυχή dans ζήσεται ἡ ψυχὴ ἡμῶν
  choice: nous resterons en vie
  alternative: notre âme vivra
  rationale: Ici, ψυχή désigne la vie de la personne plutôt qu’une affirmation doctrinale sur une composante immatérielle ; la traduction évite donc de surinterpréter.
translation_notes:
  register: Français international moderne, naturel et digne. Le deux-points et le point-virgule rendent l’enchaînement argumentatif de γάρ. « Mais » explicite le contraste déjà inhérent entre l’esclavage et la survie, tandis que « ainsi » relie cette survie au fait de ne pas assister aux morts décrites. La coordination finale reste légèrement tendue, comme en grec, tout en étant rendue intelligible en français.
