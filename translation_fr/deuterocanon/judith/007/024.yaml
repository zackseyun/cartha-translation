base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/024.yaml
  text: May God judge between you and us[a], because you have done us great injustice by not speaking peaceably with the sons of Asshur.
translation:
  language: fr
  text: Que Dieu juge entre vous et nous, car vous avez commis envers nous une grande injustice en ne parlant pas de paix avec les fils d’Assour[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec les Assyriens ». Le grec dit littéralement : « avec les fils d’Assour ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κρῖναι
  choice: Que Dieu juge
  rationale: L’optatif aoriste exprime ici un souhait ou un appel solennel; « Que Dieu juge » en restitue naturellement la valeur volitive.
- source_word: ἀνὰ μέσον ὑμῶν καὶ ἡμῶν
  choice: entre vous et nous
  rationale: Cette expression idiomatique présente Dieu comme arbitre entre deux parties; la tournure française est claire et fidèle.
- source_word: ἐποιήσατε ἐν ἡμῖν ἀδικίαν μεγάλην
  choice: vous avez commis envers nous une grande injustice
  rationale: Cette formulation conserve la gravité morale et quasi judiciaire de ἀδικία ainsi que l’orientation du tort contre les locuteurs.
- source_word: οὐ λαλήσαντες εἰρηνικὰ
  choice: en ne parlant pas de paix
  rationale: Le participe indique en quoi consiste l’injustice. « Parler de paix » conserve l’acte de parole et la possible nuance de pourparlers pacifiques sans la réduire à une simple manière aimable de parler.
- source_word: μετὰ υἱῶν Ἀσσούρ
  choice: avec les fils d’Assour
  rationale: Le texte grec dit littéralement « les fils d’Assour ». La traduction maintient cette désignation traditionnelle, tandis que la note en explicite le sens ethnique probable.
theological_decisions:
- issue: Formule d’appel au jugement divin
  choice: Que Dieu juge entre vous et nous
  alternative: Que Dieu soit juge entre vous et nous
  rationale: Le grec emploie le verbe « juger » à l’optatif. La traduction préserve l’appel direct à Dieu comme arbitre sans développer ni atténuer sa portée théologique.
translation_notes:
  register: Français international moderne, digne et direct. La formulation « parler de paix » reste naturelle tout en préservant la portée diplomatique possible de l’expression grecque.
