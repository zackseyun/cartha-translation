  yaml_path: translation/deuterocanon/judith/007/003.yaml
  text: And they encamped in the valley near Bethulia[a], by the spring, and they extended in breadth toward Dothaim as far as Belbaim, and in length from Bethulia as far as Cyamon, which is opposite Esdraelon.
translation:
  language: fr
  text: Ils établirent leur camp dans la vallée[a], près de Béthulie, auprès de la source, et ils le déployèrent en largeur en direction de Dothaïm jusqu’à Belbaïm, et en longueur depuis Béthulie jusqu’à Cyamon, qui se trouve en face d’Esdrelon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut aussi désigner une cour, mais le contexte géographique favorise ici le sens de « vallée » ou de « vallon ».
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλον
  choice: Ils établirent leur camp
  rationale: Le verbe désigne ici l’installation militaire d’un camp; cette tournure est naturelle en français moderne et conserve la valeur contextuelle du grec.
- source_word: ἐν τῷ αὐλῶνι
  choice: dans la vallée
  rationale: Dans ce cadre géographique, marqué par une source et plusieurs lieux nommés, αὐλών désigne vraisemblablement une vallée ou un vallon plutôt qu’une cour architecturale.
- source_word: πλησίον Βαιτυλουὰ
  choice: près de Béthulie
  rationale: πλησίον exprime simplement la proximité spatiale; le toponyme est transcrit sous sa forme française usuelle.
- source_word: ἐπὶ τῆς πηγῆς
  choice: à la source
  rationale: πηγή désigne une source; avec ἐπί, « à la source » rend naturellement la localisation du camp.
- source_word: παρέτειναν
  choice: leur camp s’étendait
  rationale: Le sujet implicite renvoie aux troupes ou à leur camp; expliciter « leur camp » évite en français l’impression que les soldats eux-mêmes sont mesurés, sans ajouter d’information étrangère au contexte.
- source_word: εἰς εὖρος
  choice: en largeur
  rationale: La formule introduit la première dimension du déploiement et contraste avec « en longueur ».
- source_word: ἐπὶ Δοθαειμ ἕως Βελβαΐμ
  choice: en direction de Dothaïm jusqu’à Belbaïm
  rationale: ἐπί est directionnel devant le toponyme; la formulation préserve la séquence grecque sans préciser davantage le tracé.
- source_word: εἰς μῆκος
  choice: en longueur
  rationale: Cette expression rend la seconde dimension et maintient le parallélisme avec « en largeur ».
- source_word: ἕως Βαιτυλουὰ ἕως Κυαμῶνος
  choice: depuis Béthulie jusqu’à Cyamon
  rationale: Le double ἕως délimite vraisemblablement l’étendue entre deux points; « depuis… jusqu’à… » est idiomatique en français, bien que le point de départ soit implicite dans le grec.
- source_word: ἀπέναντι Ἐσδρηλών
  choice: en face d’Esdrelon
  rationale: ἀπέναντι indique qu’un lieu est situé vis-à-vis d’un autre; « en face de » convient à la description géographique.
