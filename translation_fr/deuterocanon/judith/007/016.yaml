  text: And their words pleased Holofernes and all his attendants, and he gave orders to do as they had said.
translation:
  language: fr
  text: Leurs paroles plurent à Holopherne et à tous ceux qui étaient à son service, et il donna l’ordre de faire comme ils l’avaient dit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρεσαν
  choice: plurent à
  rationale: L’aoriste de ἀρέσκω exprime ici l’accueil favorable réservé à leur proposition. « Plurent à » conserve la construction personnelle du grec dans un français naturel et digne.
- source_word: οἱ λόγοι αὐτῶν
  choice: leurs paroles
  rationale: Cette expression désigne les paroles prononcées et, par extension, la proposition qu’elles contiennent. « Leurs paroles » reste proche du grec sans expliciter davantage que le texte source.
- source_word: θεραπόντων
  choice: ceux qui étaient à son service
  rationale: θεράπων peut désigner un serviteur, un assistant ou un homme attaché au service d’un personnage important. Cette formulation française rend la relation de service sans imposer un statut social trop précis.
- source_word: συνέταξε
  choice: il donna l’ordre
  rationale: Dans ce contexte, συντάσσω exprime une directive autoritaire. « Donner l’ordre » en restitue clairement la force.
- source_word: ποιεῖν καθὰ ἐλάλησαν
  choice: de faire comme ils l’avaient dit
  rationale: L’infinitif précise le contenu de l’ordre, tandis que καθά renvoie à ce que les interlocuteurs venaient de proposer. Cette formulation respecte la séquence temporelle et demeure idiomatique.
