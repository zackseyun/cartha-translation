  yaml_path: translation/deuterocanon/judith/007/002.yaml
  text: And on that day every one of their mighty men broke camp[a]; and their fighting force of warrior men was one hundred seventy thousand foot soldiers and twelve thousand horsemen, besides the baggage train of the men who were on foot among them[b], a very great multitude.
translation:
  language: fr
  text: 'Ce jour-là, tous leurs hommes vaillants levèrent le camp[a]. Leur force d’hommes de guerre comptait cent soixante-dix mille fantassins et douze mille cavaliers, sans compter les bagages des hommes qui étaient à pied parmi eux[b] : une multitude immense.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se mirent en route ».
    reason: lexical_alternative
  - marker: b
    text: La construction grecque de cette fin de phrase est difficile. Elle semble évoquer, en plus des effectifs militaires indiqués, les bagages et une multitude d’hommes à pied qui accompagnaient l’armée, mais leur rapport exact avec les bagages demeure incertain.
    reason: textual_difficulty
lexical_decisions:
- source_word: ἀνέζευξεν
  choice: levèrent le camp
  rationale: Le verbe désigne couramment le fait de lever le camp ou de se mettre en route. Dans ce contexte militaire, « levèrent le camp » conserve l’image concrète et reste naturel en français.
- source_word: πᾶς ἀνὴρ δυνατὸς αὐτῶν
  choice: tous leurs hommes vaillants
  rationale: « Hommes vaillants » garde la référence masculine et la valeur de force ou de capacité militaire de δυνατός, sans réduire l’expression à une simple catégorie administrative.
- source_word: ἡ δύναμις αὐτῶν ἀνδρῶν πολεμιστῶν
  choice: leur force d’hommes de guerre
  rationale: Cette formulation conserve à la fois δύναμις, la force militaire, et ἀνδρῶν πολεμιστῶν, les hommes combattants, tout en demeurant lisible.
- source_word: πεζῶν
  choice: fantassins
  rationale: Le terme désigne ici les soldats à pied, par contraste avec les cavaliers. « Fantassins » exprime clairement cette distinction militaire.
- source_word: ἵππων
  choice: cavaliers
  rationale: Bien que le mot soit littéralement lié aux chevaux, le dénombrement parallèle aux fantassins indique des troupes montées.
- source_word: χωρὶς τῆς ἀποσκευῆς
  choice: sans compter les bagages
  rationale: ἀποσκευή désigne les bagages ou l’équipement accompagnant une armée. « Sans compter » rend ici naturellement χωρίς dans un dénombrement.
- source_word: τῶν ἀνδρῶν οἳ ἦσαν πεζοὶ ἐν αὐτοῖς
  choice: des hommes qui étaient à pied parmi eux
  rationale: La traduction suit de près la construction grecque difficile sans décider si ces hommes appartenaient au train des bagages, constituaient du personnel d’accompagnement ou formaient un autre groupe.
- source_word: πλῆθος πολὺ σφόδρα
  choice: une multitude immense
  rationale: Cette expression française restitue avec dignité et naturel la forte intensification du grec.
