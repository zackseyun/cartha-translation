base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/018.yaml
  text: And the sons of Esau and the sons of Ammon went up and camped in the hill country opposite Dothaim[a], and they sent some of their men toward the south and east, opposite Egrebel, which is near Chous, which is on the wadi Mochmour. And the rest of the Assyrian army camped on the plain and covered the whole face of the land, and their tents and their baggage were encamped in a very great multitude[b], and they were exceedingly numerous.
translation:
  language: fr
  text: Les fils d’Ésaü et les fils d’Ammon montèrent et établirent leur camp dans la région montagneuse, en face de Dothaïm. Ils envoyèrent certains d’entre eux vers le sud et vers l’est[a], en face d’Égrébel, qui est près de Chous ; Chous est sur l’oued[b] de Mochmour. Le reste de l’armée assyrienne établit son camp dans la plaine et couvrit toute la surface du pays. Leurs tentes et leurs bagages étaient regroupés en très grand nombre, et ils étaient extrêmement nombreux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque traduite par « l’est » désigne littéralement la direction du soleil levant.
    reason: lexical_alternative
  - marker: b
    text: Un oued est le lit d’un cours d’eau souvent saisonnier ; on pourrait aussi traduire par « torrent ».
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέβησαν
  choice: montèrent
  rationale: Le verbe exprime d’abord un mouvement vers le haut; la mention immédiate de la région montagneuse soutient ce sens spatial sans exclure l’idée d’une progression militaire.
- source_word: οἱ υἱοὶ Ἡσαῦ καὶ οἱ υἱοὶ Ἀμμών
  choice: les fils d’Ésaü et les fils d’Ammon
  rationale: La formulation française conserve l’expression généalogique du grec, qui désigne ici les peuples issus d’Ésaü et d’Ammon.
- source_word: παρενέβαλον
  choice: établirent leur camp
  rationale: Dans ce contexte militaire, le verbe désigne l’installation d’un camp. Cette formulation est naturelle et digne en français moderne.
- source_word: ἐν τῷ ὄρει
  choice: dans la région montagneuse
  rationale: Le singulier grec peut désigner un relief montagneux ou une zone de hauteurs plutôt qu’un sommet précis.
- source_word: ἀπέστειλαν ἐξ αὐτῶν
  choice: ils envoyèrent certains d’entre eux
  rationale: Cette traduction garde la construction littérale «d’entre eux» et laisse implicite, comme le grec, la nature exacte du détachement envoyé.
- source_word: πρὸς νότον καὶ ἀπηλιώτην
  choice: vers le sud et vers l’est
  rationale: ἀπηλιώτης désigne l’est, direction du soleil levant. «L’est» fournit ici le repère géographique le plus clair.
- source_word: χειμάρρου
  choice: oued
  rationale: Le terme grec évoque un cours d’eau torrentiel, souvent saisonnier. «Oued» rend précisément cette réalité géographique proche-orientale.
- source_word: ἡ λοιπὴ στρατεία τῶν Ἀσσυρίων
  choice: le reste de l’armée assyrienne
  rationale: στρατεία désigne ici la force militaire; «armée» est l’équivalent moderne le plus naturel.
- source_word: ἐκάλυψαν πᾶν τὸ πρόσωπον τῆς γῆς
  choice: couvrit toute la surface du pays
  rationale: Le français conserve l’image d’une force couvrant la face du territoire, tout en employant une expression idiomatique.
- source_word: αἱ σκηναὶ καὶ αἱ ἀποσκευαὶ αὐτῶν κατεστρατοπέδευσαν ἐν ὄχλῳ πολλῷ
  choice: leurs tentes et leurs bagages formaient un immense campement
  rationale: Le grec attribue littéralement l’action de camper aux tentes et aux bagages. La reformulation française préserve l’image d’un camp immense sans produire une personnification maladroite.
- source_word: ἦσαν εἰς πλῆθος πολὺ σφόδρα
  choice: ils étaient extrêmement nombreux
  rationale: La formulation rend directement l’insistance très forte du grec sur leur grand nombre.
