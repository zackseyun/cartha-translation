revisions:
- from: Les fils d’Ésaü et les fils d’Ammon montèrent et établirent leur camp dans la région montagneuse, en face de Dothaïm. Ils envoyèrent certains d’entre eux vers le sud et vers l’est[a], en face d’Égrébel, qui est près de Chous, au bord de l’oued[b] Mochmour. Le reste de l’armée assyrienne établit son camp dans la plaine et couvrit toute la surface du pays. Leurs tentes et leurs bagages formaient un immense campement, et ils étaient extrêmement nombreux.
  to: Les fils d’Ésaü et les fils d’Ammon montèrent et établirent leur camp dans la région montagneuse, en face de Dothaïm. Ils envoyèrent certains d’entre eux vers le sud et vers l’est[a], en face d’Égrébel, qui est près de Chous ; Chous est sur l’oued[b] de Mochmour. Le reste de l’armée assyrienne établit son camp dans la plaine et couvrit toute la surface du pays. Leurs tentes et leurs bagages étaient regroupés en très grand nombre, et ils étaient extrêmement nombreux.
  rationale: 'La révision explicite l’antécédent de la seconde relative afin de préserver la géographie du grec : Chous est situé sur l’oued de Mochmour. Elle remplace également « formaient un immense campement » par une expression qui maintient plus directement le regroupement en très grand nombre des tentes et des bagages. Les notes sont conservées, avec une ponctuation française normalisée.'
