  terminology: 'Les ethnonymes et noms propres sont cohérents avec le grec : Ésaü, Ammon, Dothaïm, Égrébel, Chous et Mochmour. « Oued » convient à χειμάρρους, avec une note explicative utile. Aucun enjeu théologique particulier n’est présent dans ce verset.'
