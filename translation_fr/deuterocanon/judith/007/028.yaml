base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/028.yaml
  text: We call heaven and earth and our God and Lord of our fathers to witness against you[a], who avenges us according to our sins and according to the sins of our fathers[b], that he may not act according to these words today.
translation:
  language: fr
  text: Nous prenons le ciel, la terre, notre Dieu et le Seigneur de nos pères à témoin contre vous[a], lui qui nous châtie selon nos péchés et selon les fautes de nos pères[b], afin qu’il n’agisse pas aujourd’hui selon ces paroles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement, le grec dit : « nous témoignons à vous »; dans ce contexte, il s’agit vraisemblablement d’une invocation solennelle du ciel, de la terre et de Dieu comme témoins contre les auditeurs.'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec exprime une rétribution en rapport avec les péchés; on pourrait aussi traduire : « lui qui nous punit pour nos péchés et pour les fautes de nos pères ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρόμεθα ὑμῖν
  choice: Nous prenons à témoin contre vous
  rationale: La tournure grecque évoque ici une invocation solennelle de témoins à l’encontre des auditeurs. « Prendre à témoin » est naturel en français et conserve la portée quasi juridique; la note signale la traduction plus littérale du datif.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: le ciel, la terre
  rationale: Cette formulation conserve les deux témoins cosmiques et leurs articles, dans un français naturel.
- source_word: τὸν θεὸν ἡμῶν καὶ κύριον τῶν πατέρων ἡμῶν
  choice: notre Dieu et Seigneur de nos pères
  rationale: Les deux titres coordonnés sont maintenus. « Seigneur » rend κύριος comme titre divin, sans ajouter une précision absente du grec.
- source_word: ἐκδικεῖ
  choice: châtie
  rationale: Avec la mention des péchés, le verbe désigne une justice punitive exercée contre « nous ». « Châtie » évite le contresens possible de « nous venge » en français tout en préservant l’idée de rétribution.
- source_word: κατὰ τὰς ἁμαρτίας ἡμῶν καὶ κατὰ τὰ ἁμαρτήματα τῶν πατέρων ἡμῶν
  choice: à la mesure de nos péchés et des fautes de nos pères
  rationale: κατά exprime la correspondance ou la mesure. La variation « péchés / fautes » reflète sobrement les deux substantifs grecs proches, ἁμαρτίας et ἁμαρτήματα.
- source_word: ἵνα μὴ ποιήσῃ
  choice: afin qu’il n’agisse pas
  rationale: La traduction garde la valeur finale de ἵνα μή et emploie « agir » pour rendre naturellement ποιέω dans cette expression.
- source_word: κατὰ τὰ ῥήματα ταῦτα
  choice: selon ces paroles
  rationale: La formulation demeure proche du grec et renvoie aux propos qui viennent d’être prononcés.
- source_word: ἐν τῇ ἡμέρᾳ τῇ σήμερον
  choice: aujourd’hui
  rationale: Équivalent français idiomatique de la locution temporelle emphatique.
theological_decisions:
- issue: Valeur de κύριος dans ce contexte grec deutérocanonique
  choice: Seigneur
  alternative: Maître
  rationale: Le mot fonctionne comme un titre divin associé au Dieu des pères; « Seigneur » en conserve la résonance religieuse usuelle sans imposer une interprétation supplémentaire.
- issue: Sens de la rétribution divine dans ἐκδικεῖ ... κατὰ τὰς ἁμαρτίας
  choice: lui qui nous châtie à la mesure de nos péchés
  alternative: lui qui exerce sa vengeance sur nous selon nos péchés
  rationale: Le contexte indique que Dieu inflige une juste rétribution à cause des péchés. « Châtie » rend clairement cette orientation punitive, tandis qu’une traduction par « venger » pourrait suggérer à tort qu’il prend la défense du groupe.
- issue: Rapport exprimé par ἵνα μή
  choice: afin qu’il n’agisse pas
  alternative: de peur qu’il n’agisse
  rationale: « Afin que » conserve la valeur de but du grec. La construction demeure toutefois difficile quant au rapport logique précis entre l’adjuration et l’action divine; la traduction ne cherche pas à résoudre cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la solennité de l’adjuration, la relative appliquée à Dieu et la tension du dernier membre, sans explicitation confessionnelle.
