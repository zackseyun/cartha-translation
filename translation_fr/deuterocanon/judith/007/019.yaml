revisions:
- from: 'Alors les fils d’Israël crièrent vers le Seigneur leur Dieu, car ils perdaient courage[a] : tous leurs ennemis les avaient encerclés, et il leur était impossible de s’échapper du milieu d’eux.'
  to: Et les fils d’Israël crièrent vers le Seigneur leur Dieu, car leur courage avait faibli[a], car tous leurs ennemis les avaient encerclés et qu’il leur était impossible de s’échapper de leur milieu.
  rationale: La révision ajuste l’aspect du verbe grec, rend la répétition causale de ὅτι par deux « car », et remplace une expression française maladroite par « de leur milieu ». Elle conserve l’expression « les fils d’Israël », le titre « Seigneur » et l’ambiguïté anthropologique de πνεῦμα, tout en privilégiant une formulation française moderne et naturelle.
