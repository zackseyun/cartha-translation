review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : l’appel pressant au Seigneur, l’abattement intérieur, l’encerclement par tous les ennemis et l’impossibilité de fuir sont tous conservés. Toutefois, l’aoriste ὠλιγοψύχησεν décrit un état survenu, mieux rendu ici par « leur courage avait faibli » que par l’imparfait progressif « ils perdaient courage ». La seconde proposition causale est conservée explicitement.'
  naturalness: « Du milieu d’eux » est peu naturel en français et son antécédent peut être momentanément ambigu. « De leur milieu » renvoie clairement aux ennemis et garde l’image grecque d’une fuite hors de leur cercle. La coordination par « car » est plus directe que les deux-points pour reproduire la causalité répétée.
  terminology: « Les fils d’Israël », « le Seigneur leur Dieu » et « encerclés » sont justes et appropriés au registre biblique moderne. « Courage » rend idiomatiquement l’effet de ὠλιγοψυχέω, sans imposer une lecture anthropologique de πνεῦμα. La note doit éviter l’expression non idiomatique « ils perdaient cœur ».
  issues:
  - severity: medium
    issue: Aspect de « ils perdaient courage »
    rationale: 'Le grec ὠλιγοψύχησεν est un aoriste : dans cette chaîne causale, « leur courage avait faibli » rend plus exactement l’état déjà atteint qui motive leur cri.'
  - severity: medium
    issue: « s’échapper du milieu d’eux »
    rationale: La formulation est lourde et ambiguë en français. « S’échapper de leur milieu » est naturel et conserve précisément ἐκ μέσου αὐτῶν, dont le référent est « tous leurs ennemis ».
  - severity: low
    issue: Alternative de note « ils perdaient cœur »
    rationale: Cette tournure n’est pas idiomatique en français moderne. Une note peut expliciter l’image du « souffle/esprit » sans proposer une formulation française défectueuse.
