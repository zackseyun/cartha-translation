  text: And the sons of Israel cried out to the Lord their God[a], because their spirit had grown faint[b], because all their enemies had surrounded them and there was no escape from among them.
translation:
  language: fr
  text: Et les fils d’Israël crièrent vers le Seigneur leur Dieu, car leur courage avait faibli[a], car tous leurs ennemis les avaient encerclés et qu’il leur était impossible de s’échapper de leur milieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leur esprit avait perdu courage ». Autre traduction possible : « leur esprit défaillait ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: les fils d’Israël
  rationale: Cette traduction conserve l’expression familiale masculine du grec et sa résonance biblique; « les Israélites » serait plus fluide, mais moins formellement transparent.
- source_word: ἀνεβόησαν
  choice: crièrent vers
  rationale: Le verbe exprime ici un appel pressant adressé à Dieu; « crier vers » est une tournure biblique claire et naturelle en français.
- source_word: Κύριον θεὸν αὐτῶν
  choice: le Seigneur leur Dieu
  rationale: Cette formulation garde le titre divin κύριος et l’expression relationnelle du texte grec.
- source_word: ὠλιγοψύχησεν τὸ πνεῦμα αὐτῶν
  choice: ils perdaient courage
  rationale: L’expression grecque signifie que leur esprit faiblissait ou qu’ils perdaient cœur. La formulation française rend naturellement l’état intérieur sans suggérer une faiblesse physique.
- source_word: ἐκύκλωσαν
  choice: avaient encerclés
  rationale: Le plus-que-parfait indique naturellement que l’encerclement était déjà effectif au moment où le peuple cria vers Dieu.
- source_word: οὐκ ἦν διαφυγεῖν ἐκ μέσου αὐτῶν
  choice: il leur était impossible de s’échapper du milieu d’eux
  rationale: Cette formulation rend clairement la construction impersonnelle exprimant l’impossibilité de fuir, tout en conservant l’image d’une sortie hors du milieu des ennemis.
theological_decisions:
- issue: Traduction de κύριος comme titre divin
  choice: Seigneur
  alternative: Maître
  rationale: Dans cet appel à Dieu, κύριος fonctionne comme titre divin; « Seigneur » est la traduction française habituelle et adéquate.
- issue: Expression collective masculine οἱ υἱοὶ Ἰσραήλ
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le choix conserve l’expression généalogique du grec sans la neutraliser, tout en laissant la variante idiomatique dans la note.
- issue: Rendu de l’expression πνεῦμα avec ὀλιγοψυχέω
  choice: ils perdaient courage
  alternative: leur esprit défaillait
  rationale: Le français idiomatique exige ici de rendre l’ensemble de l’expression plutôt que de calquer séparément « esprit ». La note conserve le lien avec l’image grecque et évite d’en faire une affirmation anthropologique précise.
translation_notes:
  register: Français moderne, digne et lisible. La structure causale répétitive du grec est légèrement resserrée par les deux-points, sans modifier le rapport logique. « Les fils d’Israël » maintient la coloration biblique; « s’échapper du milieu d’eux » conserve l’image concrète de l’encerclement.
