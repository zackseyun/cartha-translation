  text: And there was great weeping in the midst of the whole assembly[a], all together, and they cried out to the Lord God with a loud voice.
translation:
  language: fr
  text: Il y eut de grands pleurs au milieu de toute l’assemblée, tous ensemble, et ils crièrent vers le Seigneur Dieu d’une voix forte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο
  choice: Alors, … éclata
  rationale: Dans ce récit, la formule introduit naturellement l’événement; intégrée au verbe « éclata », elle évite un calque lourd comme « il y eut ».
- source_word: κλαυθμὸς μέγας
  choice: éclata en sanglots
  rationale: Cette tournure française naturelle exprime l’intensité de μέγας et les pleurs collectifs désignés par κλαυθμός.
- source_word: ἐν μέσῳ τῆς ἐκκλησίας πάντων
  choice: toute l’assemblée
  rationale: Le génitif πάντων est compris comme englobant tous les membres de l’assemblée; « assemblée » rend le rassemblement communautaire sans connotation ecclésiale anachronique.
- source_word: ὁμοθυμαδόν
  choice: d’un même élan
  rationale: La locution exprime l’action collective et concordante, tout en restant naturelle en français moderne.
- source_word: ἐβόησαν
  choice: ils crièrent
  rationale: Le verbe indique un appel pressant et fortement exprimé, ici adressé à Dieu.
- source_word: πρὸς Κύριον τὸν θεὸν
  choice: vers le Seigneur Dieu
  rationale: « Vers » conserve l’orientation de πρὸς; « le Seigneur Dieu » rend naturellement le groupe grec sans introduire un possessif absent.
- source_word: φωνῇ μεγάλῃ
  choice: d’une voix forte
  rationale: Expression française idiomatique qui conserve explicitement l’intensité vocale.
theological_decisions:
- issue: Traduction de κύριος
  choice: Seigneur
  alternative: Éternel
  rationale: « Seigneur » traduit directement κύριος dans le texte grec fourni, sans reconstruire ni imposer un nom divin hébreu derrière la forme grecque.
- issue: Traduction de ἐκκλησία
  choice: assemblée
  alternative: communauté
  rationale: Dans ce contexte narratif, le terme désigne le peuple rassemblé; « assemblée » évite d’importer le sens institutionnel chrétien de « Église ».
translation_notes:
  register: Français international moderne, digne et narratif. La phrase privilégie une syntaxe fluide tout en maintenant l’unité collective, l’intensité des pleurs et l’appel vocal adressé à Dieu.
