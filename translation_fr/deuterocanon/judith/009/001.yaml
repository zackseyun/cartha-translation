  yaml_path: translation/deuterocanon/judith/009/001.yaml
  text: But Judith fell on her face[a], and put ashes on her head, and uncovered the sackcloth she had been wearing. And at that very time the evening incense was being offered in Jerusalem in the house of God, and Judith cried out with a loud voice to the Lord[b],
translation:
  language: fr
  text: 'Mais Judith tomba face contre terre, se mit de la cendre sur la tête et découvrit le vêtement de toile de sac qu’elle portait[a]. À cet instant même, on offrait à Jérusalem, dans la maison de Dieu, l’encens de ce soir-là[b]. Alors Judith cria d’une voix forte au Seigneur :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mit à découvert la toile de sac qu’elle portait ». Le grec indique qu’elle rendit visible la toile de sac, sans nécessairement l’enlever.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit de l’offrande d’encens prescrite pour le soir dans le sanctuaire de Jérusalem.
    reason: cultural_note
lexical_decisions:
- source_word: ἔπεσεν ἐπὶ πρόσωπον
  choice: tomba face contre terre
  rationale: L’expression décrit concrètement une prosternation dans l’humilité et la supplication. Cette formulation est naturelle en français tout en conservant l’image grecque.
- source_word: ἐπέθετο σποδὸν ἐπὶ τὴν κεφαλὴν αὐτῆς
  choice: se mit de la cendre sur la tête
  rationale: La cendre sur la tête est un geste traditionnel de deuil ou de pénitence. Le singulier collectif « de la cendre » est idiomatique en français.
- source_word: ἐγύμνωσεν ὃν ἐνεδεδύκει σάκκον
  choice: découvrit le vêtement de toile de sac qu’elle portait
  rationale: ἐγύμνωσεν signifie qu’elle mit à découvert la toile de sac déjà portée, sans indiquer nécessairement qu’elle l’enleva. « Vêtement de toile de sac » explicite naturellement la fonction de σάκκος.
- source_word: ἦν ἄρτι προσφερόμενον
  choice: À ce moment même, on offrait
  rationale: ἄρτι marque la simultanéité immédiate. La tournure impersonnelle française rend naturellement le passif progressif grec.
- source_word: εἰς τὸν οἶκον τοῦ θεοῦ
  choice: dans la maison de Dieu
  rationale: La formulation conserve l’expression grecque « maison de Dieu » tout en rendant le sens cultuel local de εἰς avec προσφέρω.
- source_word: τὸ θυμίαμα τῆς ἑσπέρας ἐκείνης
  choice: l’encens du soir
  rationale: θυμίαμα désigne précisément l’encens. « L’encens du soir » est concis et correspond au rite vespéral visé.
- source_word: ἐβόησεν φωνῇ μεγάλῃ
  choice: cria d’une voix forte
  rationale: Cette tournure conserve l’intensité de l’appel et l’expression explicite φωνῇ μεγάλῃ, dans un français actuel et digne.
- source_word: πρὸς Κύριον
  choice: vers le Seigneur
  rationale: πρός exprime ici la direction de la prière. « Vers le Seigneur » préserve cette nuance, tandis que « Seigneur » est l’équivalent cultuel approprié de Κύριος.
theological_decisions:
- issue: Traduction de Κύριος
  choice: le Seigneur
  alternative: le Maître
  rationale: Dans cette prière adressée à Dieu, « le Seigneur » est la désignation cultuelle française habituelle et ne réduit pas le terme à une simple relation sociale.
- issue: Cadre cultuel de οἶκος τοῦ θεοῦ
  choice: la maison de Dieu
  alternative: le temple de Dieu
  rationale: Le contexte renvoie au sanctuaire de Jérusalem, mais « maison de Dieu » conserve la diction propre du grec sans remplacer l’expression par son référent interprété.
- issue: Direction de la prière dans πρὸς Κύριον
  choice: vers le Seigneur
  alternative: au Seigneur
  rationale: « Vers » maintient l’orientation exprimée par πρός, sans modifier le fait que le Seigneur est le destinataire de la supplication.
translation_notes:
  register: Français international moderne, naturel et digne. Le verset conserve les gestes concrets de supplication, la simultanéité liturgique et la formulation « maison de Dieu ». La ponctuation finale introduit directement la prière qui suit.
