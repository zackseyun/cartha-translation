  verdict: revise
  source_fidelity: 'Révision nécessaire : « sont devenus puissants » réduit ἐπληθύνθησαν (« se sont multipliés / se sont accrus ») à la seule puissance et perd l’idée d’accroissement. De plus, « se sont enorgueillis de » interprète ὑψώθησαν comme de l’orgueil, alors que le grec exprime d’abord le fait d’être élevés, en lien avec le cheval et le cavalier.'
  naturalness: Le français est globalement fluide, moderne et approprié au registre priant. « Se sont élevés grâce à leurs chevaux et à leurs cavaliers » restitue plus exactement l’image sans devenir un calque pesant.
  terminology: « Assyriens », « fantassins », « bouclier », « lance », « arc », « fronde » et « le Seigneur » sont appropriés. « Brises les guerres » conserve utilement la force métaphorique de συντρίβων πολέμους.
  issues:
  - severity: medium
    issue: Perte de la notion d’accroissement dans « sont devenus puissants ».
    rationale: ἐπληθύνθησαν désigne le fait de se multiplier ou de s’accroître. La puissance est le cadre, exprimé par ἐν δυνάμει αὐτῶν, mais ne remplace pas le verbe principal.
  - severity: medium
    issue: « Se sont enorgueillis de leurs chevaux et de leurs cavaliers » surinterprète ὑψώθησαν.
    rationale: Ὑψώθησαν est un passif signifiant « ont été élevés »; le contexte peut suggérer l’orgueil, mais celui-ci est explicitement exprimé au membre suivant par ἐγαυρίασαν. Une formulation distinguant les deux verbes préserve mieux la progression du grec.
