base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/007.yaml
  text: For behold[a], the Assyrians have multiplied in their strength; they have been exalted on horse and rider; they have boasted in the arm of foot soldiers; they have hoped in shield and spear and bow and sling, and they have not known that you are the Lord[b], the one who shatters wars.
translation:
  language: fr
  text: 'Car voici : les Assyriens se sont accrus dans leur puissance ; ils se sont élevés grâce à leurs chevaux et à leurs cavaliers ; ils se sont vantés de la force de leurs fantassins ; ils ont mis leur confiance dans le bouclier, la lance, l’arc et la fronde, et ils n’ont pas reconnu que c’est toi, le Seigneur, qui brises les guerres.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « qui mets fin aux guerres ». Littéralement : « qui brises les guerres ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: Car voici
  rationale: Rend à la fois la liaison causale de γάρ et la valeur d’appel emphatique de ἰδού, dans un registre élevé mais compréhensible.
- source_word: ἐπληθύνθησαν ἐν δυνάμει αὐτῶν
  choice: sont devenus puissants
  rationale: Dans ce contexte militaire, l’expression décrit l’accroissement de leur puissance. Cette formulation française naturelle évite l’obscur « se sont multipliés dans leur force » tout en laissant ouverte la nature exacte de cet accroissement.
- source_word: ὑψώθησαν ἐφʼ ἵππῳ καὶ ἀναβάτῃ
  choice: ils se sont enorgueillis de leurs chevaux et de leurs cavaliers
  rationale: ὑψόω peut ici exprimer l’élévation orgueilleuse, tandis que ἐπί indique ce qui fonde leur assurance. Le pluriel français exprime naturellement la puissance de la cavalerie désignée collectivement en grec.
- source_word: ἐγαυρίασαν ἐν βραχίονι πεζῶν
  choice: ils se sont vantés de la force de leurs fantassins
  rationale: ἐγαυρίασαν marque une fierté arrogante. βραχίων signifie littéralement « bras », mais désigne ici clairement la force militaire ; « force de leurs fantassins » est naturel et précis.
- source_word: ἤλπισαν ἐν
  choice: ils ont mis leur confiance dans
  rationale: Avec des armes pour compléments, ἐλπίζω exprime ici l’assurance placée en elles. « Mettre sa confiance dans » est plus idiomatique en français que « espérer dans » sans effacer la nuance de dépendance.
- source_word: γαίσῳ
  choice: lance
  rationale: Terme général, clair et historiquement approprié pour cette arme d’hast, sans imposer la précision plus étroite de « javelot ».
- source_word: οὐκ ἔγνωσαν
  choice: ils n’ont pas reconnu
  rationale: 'γινώσκω peut désigner plus qu’une connaissance factuelle : ici, les Assyriens ne reconnaissent pas l’identité et l’action souveraine de Dieu.'
- source_word: συντρίβων πολέμους
  choice: qui brises les guerres
  rationale: Conserve l’image concrète et vigoureuse du grec plutôt que de la réduire au seul résultat « mettre fin aux guerres ».
theological_decisions:
- issue: Traduction de Κύριος dans la prière adressée au Dieu d’Israël
  choice: le Seigneur
  alternative: Seigneur
  rationale: Le grec emploie Κύριος avec l’article. « Le Seigneur » garde le titre divin sans introduire le tétragramme absent du texte source.
- issue: Portée de συντρίβων πολέμους
  choice: qui brises les guerres
  alternative: qui mets fin aux guerres
  rationale: La traduction retenue préserve la métaphore paradoxale et théologiquement forte selon laquelle Dieu « brise » les guerres, sans en résoudre silencieusement le sens.
translation_notes:
  register: Français international moderne, digne et adapté à une prière. Les formulations opaques calquées sur le grec ont été clarifiées, tandis que l’image finale « briser les guerres » a été conservée. Le marqueur [a] figure dans le texte après l’expression annotée.
