  rationale: La révision conserve chacun des cinq membres temporels du grec, y compris le démonstratif répété et la relation comparative de ἐκείνων. Elle améliore la précision aspectuelle de l’énumération, emploie un français naturel et maintient l’ambiguïté du référent de « celles-là ».
