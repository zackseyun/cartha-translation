  text: For you made those things before them, and those things and the things afterward and the things now and the things to come you planned[a][b], and what you planned came to be.
translation:
  language: fr
  text: Car c’est toi qui as fait les choses antérieures à celles-là ; et celles-là, les choses qui viennent après, les choses présentes et les choses à venir, tu les as conçues[a][b], et ce que tu avais conçu s’est réalisé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu y as réfléchi » ou « tu les as projetées » pour « tu les as conçues » (διενοήθης).
    reason: lexical_alternative
  - marker: b
    text: 'Le grec accumule les expressions temporelles : « les choses antérieures à celles-là », « celles-là », « les choses qui viennent après », « les choses présentes » et « les choses à venir », soulignant ainsi que l’action de Dieu embrasse tous les temps.'
    reason: literary_note
lexical_decisions:
- source_word: σὺ γὰρ
  choice: Car c’est toi qui
  rationale: « Car » conserve la valeur explicative de γάρ, tandis que la tournure disloquée « c’est toi qui » rend l’insistance portée par le pronom σὺ.
- source_word: ἐποίησας
  choice: as fait
  rationale: Le verbe ποιέω désigne ici le fait de produire ou de faire advenir. « Faire » garde cette amplitude sans imposer le terme plus technique « créer ».
- source_word: τὰ πρότερα ἐκείνων
  choice: ce qui les précédait
  rationale: Cette formulation naturelle conserve la comparaison temporelle exprimée par πρότερα avec le génitif ἐκείνων, sans préciser artificiellement le référent de « les ».
- source_word: ἐκεῖνα
  choice: ces choses-là
  rationale: Le démonstratif reprend explicitement les réalités désignées, et « ces choses-là » en conserve la valeur déictique.
- source_word: τὰ μετέπειτα
  choice: celles qui ont suivi
  rationale: Cette expression rend le sens temporel de μετέπειτα et demeure claire en français courant.
- source_word: τὰ νῦν
  choice: celles d’aujourd’hui
  rationale: La formulation exprime les réalités présentes désignées par νῦν tout en restant naturelle et digne.
- source_word: τὰ ἐπερχόμενα
  choice: celles qui sont à venir
  rationale: Cette traduction idiomatique conserve la portée future du participe ἐπερχόμενα.
- source_word: διενοήθης
  choice: tu les as projetées
  rationale: Dans ce contexte, διανοέομαι exprime une pensée délibérée ou un dessein. « Projeter » préserve cette intentionnalité sans ajouter un vocabulaire philosophique ou dogmatique.
- source_word: ἐγενήθησαν
  choice: s’est réalisé
  rationale: Le verbe γίνομαι indique ici le passage du dessein à la réalité. « Se réaliser » rend naturellement ce résultat en français.
- source_word: ἃ ἐνενοήθης
  choice: ce que tu avais projeté
  rationale: La reprise de « projeter » reflète le lien sémantique avec διενοήθης ; le plus-que-parfait marque naturellement l’antériorité du dessein par rapport à sa réalisation.
theological_decisions:
- issue: Prescience et souveraineté divines à travers le passé, le présent et l’avenir
  choice: Exprimer l’action et le dessein de Dieu sur toute la succession des temps, sans ajouter de terminologie systématique.
  alternative: Traduire les verbes de pensée par « considérer » ou « concevoir », ou rendre ἐποίησας par « créer ».
  rationale: L’enchaînement associe l’action de Dieu à sa pensée intentionnelle et à son accomplissement. « Projeter » maintient cette dimension de dessein tout en préservant la latitude du grec ; « faire » évite de transformer le passage en formule technique sur la création.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La ponctuation met en relief l’accumulation grecque tout en évitant une phrase artificiellement lourde. Le pronom de « ce qui les précédait » reste volontairement non explicité, conformément à l’ambiguïté du texte source.
