base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/010.yaml
  text: Strike servant against ruler with the deceit of my lips[a], and ruler against his attendant; shatter their arrogance by the hand of a woman.
translation:
  language: fr
  text: Frappe l’esclave contre le chef par la tromperie de mes lèvres, et le chef contre celui qui le sert ; brise leur arrogance[a] par la main d’une femme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur soulèvement » ou « leur insolence » ; le nom grec, rare, peut désigner soit leur élévation orgueilleuse, soit le fait qu’ils se dressent.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάταξον
  choice: Frappe
  rationale: Impératif direct demandant à Dieu de porter un coup, sans préciser que celui-ci entraîne nécessairement la mort.
- source_word: δοῦλον
  choice: l’esclave
  rationale: Le terme désigne une personne asservie et met en relief le renversement de la hiérarchie sociale face au chef.
- source_word: ἐκ χειλέων ἀπάτης μου
  choice: par la tromperie de mes lèvres
  rationale: La préposition exprime ici vraisemblablement le moyen. La formulation conserve l’aveu explicite de la tromperie sans ajouter « paroles », absent du grec.
- source_word: ἐπʼ ἄρχοντι
  choice: contre le chef
  rationale: Avec πάταξον, ἐπί reçoit naturellement un sens adversatif. « Chef » rend de façon courante une autorité sans lui attribuer un titre monarchique.
- source_word: ἄρχοντα
  choice: le chef
  rationale: Le mot désigne largement une personne investie d’autorité; la reprise du même terme français préserve le parallélisme grec.
- source_word: θεράποντι
  choice: celui qui le sert
  rationale: Cette expression désigne un serviteur personnel ou un homme de suite et maintient une distinction avec δοῦλος, rendu par « esclave ».
- source_word: θραῦσον
  choice: brise
  rationale: Impératif énergique exprimant une destruction décisive; « brise » reste naturel en français tout en conservant l’image.
- source_word: τὸ ἀνάστεμα
  choice: leur arrogance
  rationale: Dans ce contexte, le nom rare peut évoquer leur élévation orgueilleuse ou leur soulèvement. « Arrogance » convient à la demande d’abaissement, tandis que l’ambiguïté est signalée en note.
- source_word: ἐν χειρὶ θηλείας
  choice: par la main d’une femme
  rationale: Rend l’expression biblique d’agent et conserve explicitement l’identité féminine de l’instrument choisi.
theological_decisions:
- issue: L’action d’une femme comme moyen du renversement des puissants
  choice: par la main d’une femme
  alternative: par une femme
  rationale: Le grec souligne explicitement l’action féminine et emploie l’image de la main; il importe de ne neutraliser ni l’une ni l’autre.
- issue: Aveu de tromperie dans la prière de Judith
  choice: par la tromperie de mes lèvres
  alternative: par mes lèvres trompeuses
  rationale: La traduction maintient sans l’atténuer la tension du texte, où Judith demande que sa propre tromperie serve de moyen.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme est conservé, de même que le contraste entre l’esclave, le chef et celui qui le sert. Le marqueur [a] figure dans le texte principal.
