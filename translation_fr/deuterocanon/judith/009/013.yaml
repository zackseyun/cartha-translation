  yaml_path: translation/deuterocanon/judith/009/013.yaml
  text: And make my words and deceit become their wound and bruise[b][a], they who have devised harsh things against your covenant and your sanctified house and the summit of Zion and the house possessed by your sons.
translation:
  language: fr
  text: Et fais que ma parole et ma tromperie leur soient une blessure et une meurtrissure, à eux qui ont formé de cruels projets contre ton alliance, contre ta maison consacrée, contre le sommet de Sion et contre la demeure qui est la possession de tes fils.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque traduite par « la demeure qui est la possession de tes fils » est difficile. Elle peut désigner la demeure ou l’héritage de tes fils, c’est-à-dire le pays ou le sanctuaire appartenant au peuple de Dieu.
    reason: alternative_reading
lexical_decisions:
- source_word: δὸς λόγον μου καὶ ἀπάτην εἰς τραῦμα καὶ μώλωπα αὐτῶν
  choice: fais de mes paroles et de ma tromperie une blessure et une meurtrissure pour eux
  rationale: 'Avec εἰς, l’impératif δός exprime ici le résultat demandé : que les paroles et la tromperie de Judith deviennent pour ses ennemis un moyen de leur infliger du mal. « Paroles » est naturel en français dans ce contexte, et « tromperie » conserve sans l’atténuer la tension morale de ἀπάτη.'
- source_word: ἐβουλεύσαντο σκληρά
  choice: ont formé de cruels projets
  rationale: Le verbe désigne l’action de délibérer ou de projeter, tandis que σκληρά qualifie ici des desseins durs ou cruels. Cette formulation reste proche du grec tout en étant idiomatique.
- source_word: διαθήκης σου
  choice: ton alliance
  rationale: « Alliance » est le terme biblique français courant qui conserve la portée relationnelle et théologique de διαθήκη.
- source_word: οἴκου ἡγιασμένου σου
  choice: ta maison consacrée
  rationale: Le participe parfait passif souligne que la maison a été rendue sainte ou consacrée. « Maison consacrée » garde cette nuance verbale.
- source_word: κορυφῆς Σιὼν
  choice: le sommet de Sion
  rationale: Traduction directe de l’image spatiale exprimée par κορυφή.
- source_word: οἴκου κατασχέσεως υἱῶν σου
  choice: la demeure qui est la possession de tes fils
  rationale: La construction grecque est difficile. κατάσχεσις évoque ce qui est possédé ou tenu; cette traduction explicite légèrement la relation grammaticale sans décider si la demeure désigne le pays, l’héritage ou le sanctuaire.
theological_decisions:
- issue: La demande adressée à Dieu d’utiliser la tromperie de Judith
  choice: Conserver explicitement « ma tromperie » dans le texte principal
  alternative: « ma ruse » ou « mon stratagème »
  rationale: ἀπάτη désigne bien une tromperie. Employer un terme plus favorable atténuerait la tension théologique et morale présente dans le texte grec.
- issue: Le sens de διαθήκη
  choice: « alliance »
  alternative: « pacte »
  rationale: « Alliance » préserve l’usage biblique et théologique du terme sans le réduire à un accord ordinaire.
- issue: L’identification de la demeure possédée par les fils de Dieu
  choice: Maintenir une formulation ouverte, accompagnée d’une note
  alternative: Identifier directement cette demeure au pays, à l’héritage ou au sanctuaire
  rationale: Le grec ne permet pas de choisir avec certitude entre ces référents; la traduction ne doit pas résoudre silencieusement cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La prière conserve sa structure solennelle et l’anaphore de « contre ». « Meurtrissure » maintient le doublet concret « blessure et meurtrissure » sans tomber dans un vocabulaire médical moderne.
