    issue: λόγον μου est rendu au pluriel par « mes paroles ».
    rationale: Le grec porte le singulier λόγον (« ma parole », ou « mon discours »). Rien dans le texte source ne justifie le pluriel ; le singulier doit être conservé.
  - severity: low
    issue: La construction « une blessure et une meurtrissure pour ceux qui » est moins directement liée à αὐτῶν.
    rationale: αὐτῶν renvoie aux adversaires et s’exprime plus clairement en français par « leur soient une blessure et une meurtrissure ».
