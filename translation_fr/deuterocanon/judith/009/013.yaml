  to: Et fais que ma parole et ma tromperie leur soient une blessure et une meurtrissure, à eux qui ont formé de cruels projets contre ton alliance, contre ta maison consacrée, contre le sommet de Sion et contre la demeure qui est la possession de tes fils.[a]
