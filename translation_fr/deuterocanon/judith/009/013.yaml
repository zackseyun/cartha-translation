  source_fidelity: 'Révision mineure nécessaire : λόγον est au singulier et doit être rendu par « ma parole » plutôt que « mes paroles ». La tournure révisée conserve la valeur résultative de δὸς … εἰς et le doublet concret τραῦμα καὶ μώλωπα.'
  naturalness: Le texte est globalement naturel et d’un registre de prière soutenu accessible. « Fais que … leur soient » est plus idiomatique en français que « fais de … une blessure … pour ceux qui », tout en gardant la relation avec αὐτῶν.
  terminology: « Tromperie », « alliance », « maison consacrée », « sommet de Sion » et « meurtrissure » sont appropriés. La dernière expression demeure volontairement ouverte, avec une note qui signale sa difficulté.
  issues:
