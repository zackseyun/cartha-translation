revisions:
- from: Regarde leur arrogance ; fais tomber ta colère sur leur tête ; donne à ce que j’ai projeté de s’accomplir par ma main, la main d’une veuve.[a]
  to: Regarde leur arrogance ; fais tomber ta colère sur leurs têtes ; donne, par ma main[a], moi qui suis veuve, force à ce que j’ai projeté.
  rationale: La révision corrige la tournure française défectueuse, restitue le pluriel de « têtes » et rend plus naturellement l’auto-désignation emphatique de Judith. Elle maintient dans le texte principal la lecture selon laquelle Dieu donne force au projet par l’action de Judith, tandis que la note conserve la lecture, également plausible, où la force est donnée à sa main.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T09:39:38Z'
review_pass:
  verdict: revise
  source_fidelity: 'Les deux premières demandes rendent fidèlement βλέψον, ὑπερηφανία, ἀπόστειλον et εἰς κεφαλὰς αὐτῶν. La clause finale grecque est syntaxiquement condensée : elle demande le κράτος pour le dessein de Judith tout en associant cette action à « la main de moi, la veuve ». La révision conserve cette tension sans imposer l’une des analyses possibles.'
  naturalness: 'Le texte proposé contient une construction française maladroite et sémantiquement imprécise : « donne à ce que j’ai projeté de s’accomplir » traite le projet comme sujet autonome de son accomplissement. « par ma main, la main d’une veuve » est également redondant et peu naturel. La formulation révisée reste priante et intelligible tout en laissant perceptible la construction resserrée de l’original.'
  terminology: « Arrogance », « colère », « force » et « veuve » sont appropriés. « Sur leurs têtes » reproduit plus directement le pluriel grec et l’image de rétribution. « Force » est une bonne équivalence française de κράτος dans cette prière.
  issues:
  - severity: medium
    issue: La proposition « donne à ce que j’ai projeté de s’accomplir » est une reformulation trop libre et grammaticalement lourde de la demande portant sur κράτος.
    rationale: Le grec demande à Dieu de donner la force/puissance en lien avec ce que Judith a conçu ; il ne présente pas explicitement son projet comme un sujet qui « s’accomplit » de lui-même.
  - severity: low
    issue: « Leur tête » au singulier et « la main d’une veuve » affaiblissent ou dénaturent légèrement les formes et l’emphase du grec.
    rationale: Le texte porte « leurs têtes » et l’expression emphatique « ma main, moi qui suis veuve » ; la révision les rend plus clairement sans redoublement artificiel.
