  text: Look upon their arrogance; send your wrath upon their heads; give power to what I have planned by the hand of me[a], a widow.
translation:
  language: fr
  text: Regarde leur arrogance ; fais tomber ta colère sur leurs têtes ; donne, par ma main[a], moi qui suis veuve, force à ce que j’ai projeté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Mets dans ma main, moi qui suis veuve, la force d’accomplir ce que j’ai projeté. » La dernière proposition grecque est très resserrée et peut se comprendre de plusieurs manières proches.'
    reason: alternative_reading
lexical_decisions:
- source_word: βλέψον
  choice: Regarde
  rationale: Impératif adressé à Dieu pour lui demander de considérer la situation. « Regarde » est direct, naturel et digne en français actuel.
- source_word: ὑπερηφανίαν
  choice: arrogance
  rationale: Le terme désigne un orgueil hautain et dominateur ; « arrogance » en exprime clairement la portée morale.
- source_word: ἀπόστειλον τὴν ὀργήν σου εἰς κεφαλὰς αὐτῶν
  choice: fais tomber ta colère sur leur tête
  rationale: Le grec dit littéralement « envoie ta colère sur leurs têtes ». Cette formulation française conserve l’image du jugement qui retombe sur eux, tout en évitant une tournure peu idiomatique.
- source_word: ὃ διενοήθην
  choice: ce que j’ai projeté
  rationale: διανοέομαι exprime ici une intention ou un plan formé intérieurement. « Projeté » convient au registre de la prière sans ajouter l’idée de ruse.
- source_word: κράτος
  choice: donne … de s’accomplir
  rationale: κράτος signifie force, puissance ou capacité effective. Dans la syntaxe française, la tournure verbale exprime naturellement la demande que Dieu confère au projet sa puissance d’exécution.
- source_word: ἐν χειρί μου τῆς χήρας
  choice: par ma main, la main d’une veuve
  rationale: ἐν χειρί peut marquer l’instrument ou l’action exercée par la main. L’apposition explicite l’emphase portée sur Judith en tant que veuve et conserve l’image concrète de la main.
theological_decisions:
- issue: Construction de la proposition finale avec κράτος et ἐν χειρί μου τῆς χήρας
  choice: Demande que Dieu rende effectif le projet de Judith par sa propre main, celle d’une veuve
  alternative: « Mets dans ma main, moi qui suis veuve, la puissance d’accomplir ce que j’ai projeté. »
  rationale: L’ordre des mots grecs est resserré et permet de rattacher κράτος soit au projet, soit à la main de Judith. Le texte principal communique l’action divine qui donne efficacité au projet par la main de la veuve, tandis que la note préserve l’autre construction plausible.
translation_notes:
  register: Français international moderne, clair et digne. Les impératifs conservent la vigueur de la prière. L’image de la colère tombant sur la tête et celle de la main de la veuve sont maintenues, tandis qu’une note signale l’ambiguïté syntaxique réelle de la fin du verset.
