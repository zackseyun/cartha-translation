  text: And what I planned stood ready[a], and they said, ‘Behold, we are here; for all your ways are prepared, and your judgment is in foreknowledge.’
translation:
  language: fr
  text: 'Et les choses que tu avais projetées se tinrent prêtes et dirent : « Nous voici. » Car toutes tes voies sont prêtes, et ton jugement est dans la connaissance préalable[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ton jugement est conforme à la connaissance préalable » ou « ton jugement est dans ta connaissance préalable ». L’expression grecque est concise et peut indiquer que le jugement de Dieu se situe dans sa connaissance anticipée ou qu’il s’y conforme.'
    reason: alternative_reading
lexical_decisions:
- source_word: παρέστησαν
  choice: se présentèrent
  rationale: L’aoriste de παρίστημι exprime ici que les réalités projetées par Dieu paraissent devant lui, prêtes à s’accomplir. « Se présentèrent » conserve aussi la personnification prolongée par « dirent ».
- source_word: ἃ ἐβουλεύσω
  choice: les choses que tu avais projetées
  rationale: 'Le verbe est à la deuxième personne du singulier et s’adresse à Dieu : il faut donc traduire « tu avais projetées », non « j’avais projetées ». Le pluriel « les choses » permet de conserver l’accord conceptuel avec le verbe pluriel et avec « dirent ».'
- source_word: πάρεσμεν
  choice: Nous voici !
  rationale: Cette formule française idiomatique exprime à la fois la présence et la disponibilité immédiate contenues dans le grec.
- source_word: ὁδοί
  choice: voies
  rationale: « Voies » est naturel dans un registre biblique digne et désigne largement les manières d’agir de Dieu.
- source_word: ἕτοιμοι
  choice: sont prêtes
  rationale: L’adjectif prédicatif indique que les voies de Dieu sont déjà disposées pour leur réalisation. « Prêtes » rend directement cette idée sans introduire un agent passif absent du grec.
- source_word: κρίσις
  choice: jugement
  rationale: Le terme peut désigner une décision judiciaire ou l’exercice du jugement. « Jugement » en préserve la portée sans le réduire à une simple décision.
- source_word: πρόγνωσις
  choice: connaissance préalable
  rationale: Le nom désigne le fait de connaître d’avance. « Connaissance préalable » est plus immédiatement compréhensible en français international que « prescience », tout en restant proche du sens grec.
theological_decisions:
- issue: Rapport entre le jugement divin et πρόγνωσις
  choice: ton jugement s’inscrit dans la connaissance préalable
  alternative: ton jugement est conforme à la connaissance préalable ; ton jugement s’inscrit dans ta connaissance préalable
  rationale: La formule grecque ἐν προγνώσει est condensée et ne précise pas si la préposition marque la sphère, la norme ou un rapport instrumental. Le texte principal garde une relation générale, tandis que la note signale les autres compréhensions possibles sans trancher la tension théologique.
translation_notes:
  register: Français moderne, international et digne. La personnification inhabituelle des projets divins est conservée parce qu’elle appartient au texte grec. Le tutoiement maintient l’adresse directe de la prière. Le point d’exclamation après « Nous voici » explicite la vive déclaration de disponibilité sans modifier son contenu.
