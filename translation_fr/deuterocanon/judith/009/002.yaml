    issue: « Sein » traduit μήτρα dans les deux occurrences.
    rationale: En français moderne, « sein » évoque d’abord la poitrine ; μήτρα signifie ici « matrice, utérus ». Employer « sein » affaiblit et déplace l’image source. La note b, qui présente « délié le sein » comme littéral, reproduit la même imprécision.
