base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/002.yaml
  text: And she said[a], “O Lord, God of my father Simeon, to whom you gave a sword in his hand for vengeance against foreigners, who loosed a virgin’s womb for defilement and bared the thigh for shame and profaned the womb for disgrace—though you said, ‘It shall not be so’[c][b]; but they did it.”
translation:
  language: fr
  text: 'Elle dit : « Seigneur, Dieu de mon ancêtre Siméon[a], toi qui lui as mis une épée en main pour exercer la vengeance contre des étrangers, eux qui ont ouvert la matrice d’une vierge pour la souiller[b], mis sa cuisse à nu pour la couvrir de honte[c] et profané sa matrice pour la déshonorer — car tu avais dit : “Cela ne sera pas ainsi.” Pourtant, ils l’ont fait. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La prière fait allusion à Siméon et à l’affaire de Dina racontée en Genèse 34 ; elle présente ici sa violence comme une vengeance pour l’outrage commis.
    reason: cross_reference
  - marker: b
    text: Littéralement, le grec dit qu’ils ont « délié la matrice d’une vierge ». Cette expression euphémique désigne une atteinte sexuelle violente.
    reason: lexical_alternative
  - marker: c
    text: Mettre la cuisse à nu est ici une image de honte sexuelle, comparable aux passages bibliques où le dévoilement du corps exprime l’humiliation et la violation.
    reason: cultural_note
lexical_decisions:
- source_word: Κύριε
  choice: Seigneur
  rationale: Vocatif adressé à Dieu ; « Seigneur » convient au registre de la prière sans supposer ici un remplacement explicite du tétragramme.
- source_word: ὁ θεὸς τοῦ πατρὸς μου Συμεών
  choice: Dieu de mon ancêtre Siméon
  rationale: πατήρ peut désigner un père ancestral. « Ancêtre » évite de faire de Siméon le père immédiat de Judith tout en gardant le lien familial revendiqué.
- source_word: ᾧ ἔδωκας ἐν χειρὶ ῥομφαίαν
  choice: toi qui lui as mis une épée en main
  rationale: Formulation française naturelle qui conserve l’image concrète de l’épée placée dans la main.
- source_word: εἰς ἐκδίκησιν ἀλλογενῶν
  choice: pour exercer la vengeance contre des étrangers
  rationale: ἐκδίκησις exprime ici la vengeance ou la rétribution, et ἀλλογενεῖς désigne des gens d’une autre origine sans imposer le terme théologique « païens ».
- source_word: οἳ ἔλυσαν μήτραν παρθένου
  choice: eux qui ont ouvert le sein d’une vierge
  rationale: « Ouvert » conserve l’image corporelle et l’euphémisme violent de l’expression grecque sans réduire les trois propositions à un seul terme explicatif comme « violer ».
- source_word: εἰς μίασμα
  choice: pour le souiller
  rationale: μίασμα désigne une souillure morale ou cultuelle ; le verbe rend naturellement en français la finalité ou le résultat.
- source_word: ἐγύμνωσαν μηρὸν
  choice: mis sa cuisse à nu
  rationale: Conserve l’image de la cuisse dénudée, idiome de honte sexuelle, tout en ajoutant le possessif nécessaire à la clarté française.
- source_word: εἰς αἰσχύνην
  choice: pour la couvrir de honte
  rationale: Rend la conséquence humiliante dans un français idiomatique et rattache clairement la honte à la victime.
- source_word: ἐβεβήλωσαν μήτραν
  choice: profané son sein
  rationale: « Profané » maintient la force sacrilège de βεβηλόω, tandis que « sein » reprend l’image corporelle de μήτρα.
- source_word: εἰς ὄνειδος
  choice: pour la déshonorer
  rationale: ὄνειδος évoque l’opprobre et le déshonneur public ; la tournure verbale est fluide en français.
- source_word: εἶπας γὰρ Οὐχ οὕτως ἔσται
  choice: 'car tu avais dit : « Cela ne sera pas ainsi. »'
  rationale: Le plus-que-parfait marque naturellement l’antériorité de la parole divine. « Car » conserve γάρ, même si la logique demeure tendue.
- source_word: καὶ ἐποίησαν
  choice: Pourtant, ils l’ont fait
  rationale: Le pronom reprend l’acte interdit implicite ; « pourtant » fait entendre le contraste contextuel porté par la juxtaposition grecque.
theological_decisions:
- issue: Degré d’explicitation de la violence sexuelle
  choice: Conserver les trois images successives — ouverture du sein, cuisse mise à nu, sein profané — avec une formulation française compréhensible.
  alternative: Résumer par « ils ont violé une vierge » ou, à l’inverse, atténuer par « ils l’ont déshonorée ».
  rationale: Le grec associe violation, honte et profanation. Une désignation unique aplatirait cette accumulation rhétorique, tandis qu’une formule atténuée en diminuerait la gravité.
- issue: Identification de Siméon comme « père »
  choice: Traduire πατήρ par « ancêtre » dans ce contexte généalogique.
  alternative: « mon père Siméon »
  rationale: Judith invoque le patriarche Siméon, non son père immédiat. Le français moderne emploie moins naturellement « père » au sens d’ancêtre ; « ancêtre » rend le rapport sans ajouter de précision confessionnelle.
- issue: Portée de ἀλλογενῶν
  choice: « étrangers »
  alternative: « païens » ou « non-Juifs »
  rationale: Le terme grec indique l’altérité d’origine. « Étrangers » préserve cette largeur et évite de lui imposer une catégorie religieuse plus technique.
- issue: Rapport entre la volonté déclarée de Dieu et l’acte commis
  choice: Maintenir côte à côte « tu avais dit » et « pourtant, ils l’ont fait ».
  alternative: Reformuler comme un commandement explicite de Dieu ou comme une simple appréciation morale du narrateur.
  rationale: Le grec laisse subsister une tension entre la parole divine citée et l’action des agresseurs ; la traduction ne précise pas davantage la nature ou le moment de cette parole.
translation_notes:
  register: Français international actuel, digne et adapté à une prière solennelle. Le tutoiement de Dieu suit l’usage biblique français courant. Les images corporelles du grec sont maintenues, mais la syntaxe est clarifiée par des possessifs et des pronoms naturels en français.
