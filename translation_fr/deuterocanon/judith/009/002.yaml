revisions:
- from: 'Elle dit : « Seigneur, Dieu de mon ancêtre Siméon[a], toi qui lui as mis une épée en main pour exercer la vengeance contre des étrangers, eux qui ont ouvert le sein d’une vierge pour le souiller[b], mis sa cuisse à nu pour la couvrir de honte[c] et profané son sein pour la déshonorer — car tu avais dit : “Cela ne sera pas ainsi.” Pourtant, ils l’ont fait. »'
  to: 'Elle dit : « Seigneur, Dieu de mon ancêtre Siméon[a], toi qui lui as mis une épée en main pour exercer la vengeance contre des étrangers, eux qui ont ouvert la matrice d’une vierge pour la souiller[b], mis sa cuisse à nu pour la couvrir de honte[c] et profané sa matrice pour la déshonorer — car tu avais dit : “Cela ne sera pas ainsi.” Pourtant, ils l’ont fait. »'
  rationale: La révision se limite à remplacer « sein » par « matrice » dans le texte et dans la note b. Elle corrige le sens anatomique de μήτρα, préserve la répétition du grec et ne transforme pas les euphémismes accumulés en une formulation interprétative unique.
