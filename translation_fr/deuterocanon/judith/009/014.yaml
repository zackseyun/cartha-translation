base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/014.yaml
  text: And bring about[a], upon all your nation and every tribe, recognition, so that they may know that you are the God of all power and might[b], and there is no other who defends the people of Israel except you.
translation:
  language: fr
  text: Et fais naître, au sein de toute ta nation et de chaque tribu, la connaissance[a], afin qu’ils sachent que tu es le Dieu de toute puissance et de toute force, et qu’il n’y en a pas d’autre que toi pour défendre le peuple d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut aussi signifier « pleine connaissance » ou « reconnaissance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίησον
  choice: fais naître
  rationale: L’impératif a ici pour complément ἐπίγνωσιν et exprime l’action de produire ou de susciter cette connaissance. « Fais naître » rend cette valeur causative dans un français naturel.
- source_word: ἐπὶ πᾶν τὸ ἔθνος σου καὶ πάσης φυλῆς
  choice: dans toute ta nation et dans chaque tribu
  rationale: ἔθνος désigne ici une nation ou un peuple, tandis que φυλή signifie « tribu ». La formulation française conserve les deux groupes et la valeur distributive du singulier πάσης φυλῆς, sans imposer que « chaque tribu » soit nécessairement limitée à la nation mentionnée.
- source_word: ἐπίγνωσιν
  choice: la connaissance
  rationale: ἐπίγνωσις peut exprimer la connaissance, la pleine connaissance ou la reconnaissance. « La connaissance » s’accorde directement avec l’explication qui suit, « afin que tous sachent », tandis qu’une note signale les autres nuances possibles.
- source_word: τοῦ εἰδῆσαι
  choice: afin que tous sachent
  rationale: L’infinitif articularisé avec τοῦ indique ici le but ou le résultat. « Afin que » en rend clairement la fonction; « tous » reprend collectivement la nation et les tribus sans pronom grammaticalement ambigu.
- source_word: ὁ θεὸς πάσης δυνάμεως καὶ κράτους
  choice: le Dieu de toute puissance et de toute force
  rationale: δύναμις et κράτος appartiennent tous deux au champ de la puissance et de la force. Cette formulation maintient leur parallélisme intensif sans transformer arbitrairement κράτος en une notion plus précise de souveraineté politique.
- source_word: ὑπερασπίζων
  choice: pour défendre
  rationale: Le participe désigne celui qui prend la défense de quelqu’un ou le protège. La tournure « pour défendre » est idiomatique après l’expression existentielle française.
- source_word: τοῦ γένους Ἰσραήλ
  choice: le peuple d’Israël
  rationale: γένος peut désigner une lignée, une descendance ou un peuple. « Le peuple d’Israël » exprime naturellement ici la collectivité issue d’Israël, sans la connotation moderne problématique de « race ».
- source_word: εἰ μὴ σύ
  choice: il n’y en a pas d’autre que toi
  rationale: La construction exceptive affirme avec force que Dieu seul défend Israël. La formulation française conserve cette exclusivité.
theological_decisions:
- issue: Exclusivité de Dieu comme défenseur d’Israël
  choice: il n’y en a pas d’autre que toi pour défendre le peuple d’Israël
  alternative: toi seul défends le peuple d’Israël
  rationale: Le choix retenu suit de près la structure négative et exceptive du grec. Il maintient l’affirmation exclusive du verset sans l’étendre à une proposition doctrinale plus générale.
- issue: Portée de « chaque tribu »
  choice: dans toute ta nation et dans chaque tribu
  alternative: dans toute ta nation, dans chacune de ses tribus
  rationale: Le grec coordonne « toute ta nation » et « chaque tribu » sans préciser explicitement que les tribus appartiennent toutes à cette nation. La traduction préserve cette possible portée plus large au lieu de la résoudre.
translation_notes:
  register: Français international moderne, digne et accessible. La prière garde une tonalité solennelle sans archaïsmes. Le tutoiement correspond à l’adresse directe à Dieu. Le marqueur [a] figure dans le texte principal.
