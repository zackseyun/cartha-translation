  yaml_path: translation/deuterocanon/judith/009/012.yaml
  text: Yes[a], yes, O God of my father and God of Israel’s inheritance, Master of the heavens and of the earth, Creator of the waters[b], King of all your creation, you—hear my prayer.
translation:
  language: fr
  text: Oui, oui, ô Dieu de mon père et Dieu de l’héritage d’Israël[a], Maître[b] des cieux et de la terre, Créateur des eaux, Roi de toute ta création, toi, écoute ma supplication.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque peut aussi se comprendre comme « Dieu dont Israël est l’héritage ».
    reason: ambiguïté syntaxique et lexicale
  - marker: b
    text: Le grec emploie ici despotēs, terme qui souligne une autorité absolue et qui est plus fort que kyrios, généralement traduit par « Seigneur ».
    reason: précision lexicale
lexical_decisions:
- source_word: ναὶ ναὶ
  choice: Oui, oui
  rationale: Le redoublement de l’affirmation est conservé afin de rendre son intensité dans la prière, sans lui donner une tournure propre à un autre contexte biblique.
- source_word: ὁ θεὸς τοῦ πατρὸς μου
  choice: ô Dieu de mon père
  rationale: Le contexte de prière donne à l’expression une valeur d’adresse directe. Le singulier « mon père » suit exactement le grec.
- source_word: θεὸς κληρονομίας Ἰσραήλ
  choice: Dieu de l’héritage d’Israël
  rationale: « Héritage » rend directement κληρονομία et maintient l’ambiguïté du génitif, qui peut désigner l’héritage appartenant à Israël ou Israël comme héritage.
- source_word: δέσποτα
  choice: Maître
  rationale: « Maître » distingue δέσποτα de κύριος et conserve sa nuance d’autorité souveraine et absolue.
- source_word: τῶν οὐρανῶν καὶ τῆς γῆς
  choice: des cieux et de la terre
  rationale: Le pluriel grec « cieux » est conservé dans une formulation française naturelle et solennelle.
- source_word: κτίστα
  choice: Créateur
  rationale: Ce terme rend clairement celui qui crée et convient à l’invocation cosmique.
- source_word: τῶν ὑδάτων
  choice: des eaux
  rationale: Le pluriel explicite du grec est maintenu.
- source_word: βασιλεῦ πάσης κτίσεώς σου
  choice: Roi de toute ta création
  rationale: Dans ce contexte cosmique, κτίσις désigne collectivement la création; le possessif σου est également conservé.
- source_word: σὺ εἰσάκουσον
  choice: toi, écoute
  rationale: Le pronom détaché « toi » rend l’insistance de σὺ. « Écoute » exprime ici l’attention demandée à Dieu sans ajouter explicitement l’idée d’un accomplissement favorable.
- source_word: τῆς δεήσεώς μου
  choice: ma supplication
  rationale: « Supplication » rend la demande instante exprimée par δέησις tout en convenant au registre solennel de la prière.
theological_decisions:
- issue: Traduction de δέσποτα dans une adresse à Dieu
  choice: Maître
  alternative: Seigneur; Souverain
  rationale: « Maître » préserve la nuance forte de possession et d’autorité absolue portée par δέσποτα, sans la confondre avec le titre κύριος, habituellement rendu par « Seigneur ».
- issue: Rapport exprimé par θεὸς κληρονομίας Ἰσραήλ
  choice: Dieu de l’héritage d’Israël
  alternative: Dieu d’Israël, son héritage; Dieu dont Israël est l’héritage
  rationale: La formulation française conserve l’ambiguïté réelle du génitif grec au lieu de décider si l’héritage appartient à Israël ou si Israël constitue l’héritage de Dieu.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. L’apostrophe « ô Dieu » soutient le rythme de la prière; les titres successifs conservent la cadence du grec. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils expliquent.
