base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/004.yaml
  text: And you gave their wives as plunder[a], and their daughters into captivity, and all their spoils for division among the sons beloved by you, who also were zealous with your zeal and abhorred the defilement of their blood and called on you for help. O God, my God, hear me[b], the widow.
translation:
  language: fr
  text: Tu as livré leurs femmes comme butin, leurs filles à la captivité, et tout leur butin au partage entre les fils que tu aimais[a]. Eux aussi ont été animés de ton zèle, ont eu en horreur la souillure de leur sang[b] et t’ont appelé à leur secours. Ô Dieu, mon Dieu, écoute-moi, moi qui suis veuve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils aimés par toi »; on peut aussi traduire : « tes fils bien-aimés ».'
    reason: La note signale la forme passive et la formulation filiale explicites du grec.
  - marker: b
    text: 'Ou : « l’impureté de leur sang ». L’expression grecque peut désigner une souillure rituelle ou morale liée au sang.'
    reason: La note préserve l’ambiguïté du génitif et la portée cultuelle ou morale de μίασμα.
lexical_decisions:
- source_word: προνομὴν
  choice: pillage
  rationale: Le nom désigne le butin ou l’acte de dépouiller en contexte guerrier. « Livrer au pillage » est idiomatique en français et reste distinct de σκῦλα, rendu ensuite par « butin ».
- source_word: αἰχμαλωσίαν
  choice: captivité
  rationale: 'La tournure εἰς αἰχμαλωσίαν exprime le résultat : être livré à la captivité.'
- source_word: σκῦλα
  choice: butin
  rationale: Terme militaire courant pour les biens pris à l’ennemi; il convient au partage mentionné immédiatement après.
- source_word: διαίρεσιν
  choice: au partage
  rationale: Cette formulation rend l’idée de répartition ou d’attribution et s’intègre naturellement à la syntaxe française.
- source_word: υἱῶν ἠγαπημένων ὑπὸ σοῦ
  choice: les fils que tu aimais
  rationale: Conserve le substantif masculin explicite υἱῶν et la relation d’amour exprimée par le participe passif, dans un français naturel.
- source_word: ἐζήλωσαν τὸν ζῆλόν σου
  choice: ont été animés de ton zèle
  rationale: Préserve l’idée qu’ils participent au zèle de Dieu, tout en évitant une construction française artificielle ou le sens moderne trompeur de « jalousie ».
- source_word: ἐβδελύξαντο
  choice: ont eu en horreur
  rationale: Rend la forte répulsion morale et rituelle du verbe grec dans un registre digne mais accessible.
- source_word: μίασμα αἵματος αὐτῶν
  choice: la souillure de leur sang
  rationale: « Souillure » conserve la portée rituelle ou morale de μίασμα, tandis que le génitif « de leur sang » maintient l’ambiguïté du grec.
- source_word: ἐπεκαλέσαντό σε εἰς βοήθειαν
  choice: t’ont appelé à leur secours
  rationale: Rend naturellement l’appel adressé à Dieu en vue d’obtenir son aide.
- source_word: εἰσάκουσον ἐμοῦ
  choice: écoute-moi
  rationale: Formule française claire et habituelle pour une supplication, avec la force de l’impératif grec.
- source_word: τῆς χήρας
  choice: moi qui suis veuve
  rationale: Explicite naturellement en français l’apposition « la veuve » sans perdre l’autodésignation rhétorique de Judith.
theological_decisions:
- issue: Terme familial genré dans υἱῶν ἠγαπημένων ὑπὸ σοῦ
  choice: les fils que tu aimais
  alternative: tes enfants bien-aimés / ton peuple bien-aimé
  rationale: Le grec dit explicitement « fils ». La traduction ne neutralise pas ce terme et n’identifie pas davantage le groupe que ne le fait le texte.
- issue: Construction apparentée ἐζήλωσαν τὸν ζῆλόν σου
  choice: ont été animés de ton zèle
  alternative: ont brûlé de zèle pour toi / ont éprouvé ta jalousie
  rationale: Le choix garde le zèle comme venant de Dieu ou correspondant au sien, sans réduire la formule à une simple ferveur humaine ni imposer le sens moderne de « jalousie ».
- issue: Ambiguïté de μίασμα αἵματος αὐτῶν
  choice: la souillure de leur sang
  alternative: la souillure causée par leur sang / leur impureté de sang
  rationale: Le génitif peut porter diverses relations entre souillure et sang. La formulation retenue préserve cette tension au lieu de préciser arbitrairement sa nature rituelle ou morale.
translation_notes:
  register: Français international moderne, digne et adapté à la prière. Le rythme coordonné du grec est conservé sans lourdeur excessive. « Ô Dieu, mon Dieu » maintient la répétition emphatique, et « moi qui suis veuve » rend clairement la posture vulnérable de Judith.
