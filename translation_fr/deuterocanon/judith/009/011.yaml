base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/011.yaml
  text: For your power is not in a multitude[a], nor is your dominion among the strong; rather, you are God of the lowly, helper of the lesser, supporter of the weak, shelter of the forsaken[b], savior of those without hope.
translation:
  language: fr
  text: Car ta puissance n’est pas dans le grand nombre, ni ta domination parmi les puissants ; mais tu es le Dieu des humbles, le secours des petits, le soutien des faibles, l’abri de ceux que l’on tient pour perdus[a], le sauveur[b] de ceux qui n’ont plus d’espoir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ceux qui désespèrent » ; le grec peut désigner des personnes que l’on tient pour perdues ou des personnes plongées dans le désespoir.
    reason: lexical_alternative
  - marker: b
    text: Ou « libérateur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήθει
  choice: le grand nombre
  rationale: πλῆθος désigne une multitude ou un nombre important. « Le grand nombre » est naturel en français et conserve ici l’idée numérique sans préciser un contexte militaire.
- source_word: κράτος
  choice: puissance
  rationale: κράτος exprime la force ou la puissance effective. « Puissance » convient au registre élevé de la prière et reste distinct de la domination mentionnée ensuite.
- source_word: δυναστεία
  choice: domination
  rationale: δυναστεία désigne le pouvoir souverain ou l’exercice de l’autorité. « Domination » préserve cette dimension de pouvoir sans ajouter une notion théologique absente du grec.
- source_word: ἐν ἰσχύουσιν
  choice: sur les puissants
  rationale: Le participe substantivé désigne ceux qui ont de la force ou du pouvoir. Avec « repose », la préposition « sur » rend idiomatiquement l’idée que la domination de Dieu ne dépend pas d’eux.
- source_word: ταπεινῶν
  choice: des humbles
  rationale: ταπεινός peut désigner les humbles, les gens de condition modeste ou ceux qui ont été abaissés. « Les humbles » garde cette ouverture tout en s’insérant naturellement dans la série des personnes vulnérables.
- source_word: ἐλαττόνων
  choice: des petits
  rationale: ἐλάττων signifie « moindre, inférieur, plus petit ». « Les petits » est une expression française claire pour les personnes de moindre importance, sans transformer le comparatif en superlatif.
- source_word: βοηθός
  choice: le secours
  rationale: βοηθός désigne celui qui vient en aide. « Le secours des petits » forme en français un titre divin naturel et conserve la structure nominale de la litanie.
- source_word: ἀντιλήμπτωρ
  choice: le soutien
  rationale: Ce nom rare évoque celui qui saisit pour soutenir ou vient en aide. « Soutien » maintient l’idée d’appui et évite de le confondre avec l’image de l’abri qui suit.
- source_word: ἀσθενούντων
  choice: des faibles
  rationale: ἀσθενέω peut évoquer faiblesse, maladie ou incapacité. Dans cette énumération générale, « les faibles » conserve la portée la plus large.
- source_word: ἀπεγνωσμένων
  choice: de ceux que l’on tient pour perdus
  rationale: Le participe peut désigner ceux dont on désespère, que l’on considère comme perdus, ou ceux qui sont eux-mêmes désespérés. La formulation retenue met en valeur la nuance passive probable tout en signalant l’autre possibilité en note.
- source_word: σκεπαστής
  choice: l’abri
  rationale: σκεπαστής désigne celui qui couvre ou met à l’abri. « L’abri de » conserve l’image concrète de la protection.
- source_word: ἀπηλπισμένων
  choice: de ceux qui n’ont plus d’espoir
  rationale: Le participe désigne ceux qui ont perdu l’espoir. Cette formulation courante rend précisément leur situation sans employer une étiquette absolue.
- source_word: σωτήρ
  choice: le sauveur
  rationale: σωτήρ désigne celui qui sauve ou délivre. « Sauveur » est la correspondance directe et convient au parallélisme des titres divins.
theological_decisions:
- issue: Conserver ou développer la succession compacte de prédicats divins.
  choice: 'Maintien d’une série nominale : « le Dieu des humbles, le secours des petits, le soutien des faibles… »'
  alternative: 'Paraphraser par des verbes, par exemple : « tu aides les humbles, tu soutiens les faibles et tu sauves ceux qui n’ont plus d’espoir ».'
  rationale: Le grec accumule des désignations de Dieu dans une forme litanique. La structure nominale en préserve la force rhétorique et évite d’expliciter davantage que le texte.
- issue: Comprendre ἀπεγνωσμένων comme une situation imposée de l’extérieur ou comme un désespoir intérieur.
  choice: « ceux que l’on tient pour perdus » dans le texte, avec l’autre sens en note.
  alternative: « ceux qui désespèrent » ou « les désespérés ».
  rationale: La forme peut évoquer des personnes dont autrui désespère ou des personnes plongées dans le désespoir. Le texte retient la nuance passive probable sans supprimer l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le mouvement solennel de la prière et la série litanique du grec, tout en ajoutant les articles nécessaires à un français naturel. « Ne réside pas dans » et « ne repose pas sur » évitent une tournure trop littérale et expriment sans surinterprétation que la puissance divine ne dépend ni du nombre ni des puissants.
