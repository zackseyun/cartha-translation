base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/008.yaml
  text: Lord is your name[a]; you, shatter their strength in your power, and break their might in your wrath; for they planned to profane your holy things, to defile the tabernacle, the resting place of your glorious name[b], and to cast down with the sword the horn of your altar.
translation:
  language: fr
  text: « Seigneur », tel est ton nom. Toi, fracasse leur force par ta puissance et brise leur pouvoir dans ta colère, car ils ont projeté de profaner tes choses sacrées[a], de souiller la Demeure où repose ton nom glorieux et d’abattre par l’épée[b] la corne de ton autel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque peut désigner les objets sacrés, les lieux saints, ou l’ensemble de ce qui est consacré à Dieu.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « par le fer ». Le fer désigne probablement ici, par métonymie, une arme de fer telle qu’une épée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριος ὄνομά σοι
  choice: « Seigneur », tel est ton nom
  rationale: Rend l’énoncé grec littéralement proche de « Seigneur est ton nom », tout en lui donnant une forme française naturelle et solennelle. « Seigneur » reste ici le titre divin affirmé comme nom.
- source_word: ῥάξον
  choice: fracasse
  rationale: Exprime la violence de l’impératif aoriste et se distingue du second verbe de rupture.
- source_word: ἰσχὺν ἐν δυνάμει σου
  choice: leur force par ta puissance
  rationale: Conserve le parallélisme entre la force ennemie et la puissance divine; « par » exprime naturellement en français le moyen indiqué par ἐν.
- source_word: κατάξον τὸ κράτος αὐτῶν
  choice: brise leur pouvoir
  rationale: κατάξον demande ici de casser ou réduire la puissance adverse; « pouvoir » rend κράτος sans limiter le sens à une domination politique.
- source_word: ἐν τῷ θυμῷ σου
  choice: dans ta colère
  rationale: « Colère » est actuel, digne et suffisamment intense, sans renforcer arbitrairement θυμός en « fureur ».
- source_word: βεβηλῶσαι τὰ ἅγιά σου
  choice: profaner tes biens sacrés
  rationale: Le pluriel neutre peut désigner des objets, des espaces ou plus largement ce qui est consacré à Dieu. « Biens sacrés » préserve cette relative ampleur mieux que le seul « sanctuaire ».
- source_word: μιᾶναι τὸ σκήνωμα
  choice: souiller la Demeure
  rationale: « Souiller » garde la portée cultuelle de μιᾶναι. « Demeure » rend σκήνωμα dans le contexte du lieu sacré sans suggérer nécessairement une simple tente mobile.
- source_word: τῆς καταπαύσεως τοῦ ὀνόματος τῆς δόξης σου
  choice: où repose ton nom glorieux
  rationale: Formulation française naturelle qui conserve à la fois l’idée de repos ou de présence stable et le lien entre le nom divin et la gloire.
- source_word: καταβαλεῖν σιδήρῳ
  choice: abattre par l’épée
  rationale: καταβαλεῖν signifie faire tomber ou abattre; le « fer » désigne probablement par métonymie une arme de fer, rendue ici par « l’épée ».
- source_word: κέρας θυσιαστηρίου σου
  choice: la corne de ton autel
  rationale: Conserve l’image cultuelle concrète des saillies en forme de corne aux angles de l’autel.
theological_decisions:
- issue: Étendue de τὰ ἅγιά σου
  choice: tes biens sacrés
  alternative: ton sanctuaire
  rationale: Le grec pluriel reste susceptible d’englober des objets sacrés et des lieux saints. La traduction ne réduit donc pas sans nécessité la menace au seul bâtiment du sanctuaire.
- issue: Rapport entre la Demeure, le repos et le nom glorieux
  choice: la Demeure où repose ton nom glorieux
  alternative: la Demeure, lieu de repos du nom de ta gloire
  rationale: La formulation retenue explicite seulement la relation syntaxique nécessaire en français, sans identifier le nom à Dieu lui-même ni résoudre davantage la théologie de la présence divine.
- issue: Violence demandée dans la prière
  choice: conserver les impératifs « fracasse », « brise » et « abattre »
  alternative: atténuer par « affaiblis » ou « mets fin à »
  rationale: Le texte formule une demande violente de jugement contre ceux qui projettent une profanation. L’atténuer effacerait la tension théologique propre à la prière.
translation_notes:
  register: Français international moderne, solennel sans archaïsmes. Le tutoiement convient à la prière biblique. La majuscule à « Demeure » signale le lieu cultuel particulier sans remplacer le terme grec par une désignation confessionnelle plus précise.
