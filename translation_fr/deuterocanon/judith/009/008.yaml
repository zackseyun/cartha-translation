  naturalness: Le français est fluide, moderne et d’un registre approprié à une prière biblique. « Choses sacrées » est plus idiomatique et plus englobant que « biens sacrés » dans ce contexte. La majuscule à « Demeure » est conservée comme signal contextuel du lieu cultuel.
