  text: And Holofernes’s attendants brought her into the tent[a], and she slept until the middle of the night; then she rose at the morning watch[b],
translation:
  language: fr
  text: Les serviteurs d’Holopherne la conduisirent dans la tente, et elle dormit jusqu’au milieu de la nuit[a] ; puis elle se leva au moment de la veille du matin[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’à minuit ». Le grec dit littéralement que la nuit était en son milieu.
    reason: lexical_alternative
  - marker: b
    text: La « veille du matin » était une période de garde nocturne située peu avant l’aube.
    reason: cultural_note
lexical_decisions:
- source_word: θεράποντες
  choice: serviteurs
  rationale: Le terme désigne ici les personnes attachées au service d’Holopherne. « Serviteurs » est naturel en français et n’implique pas nécessairement l’esclavage.
- source_word: σκηνήν
  choice: tente
  rationale: Dans le contexte d’un camp militaire, σκηνή désigne naturellement une tente.
- source_word: ὕπνωσεν
  choice: elle dormit
  rationale: L’aoriste rapporte simplement qu’elle dormit ; cette formulation directe conserve le mouvement narratif.
- source_word: μέχρι μεσούσης τῆς νυκτός
  choice: jusqu’au milieu de la nuit
  rationale: Cette traduction reste proche de l’expression grecque et évite de la réduire sans nécessité au terme plus précis « minuit ».
- source_word: ἀνέστη
  choice: elle se leva
  rationale: Dans ce contexte, ἀνίστημι signifie se lever après avoir dormi.
- source_word: πρὸς τὴν ἑωθινὴν φυλακήν
  choice: au moment de la veille du matin
  rationale: La préposition πρός a ici une valeur temporelle, et φυλακή désigne une division de la nuit durant laquelle on montait la garde.
