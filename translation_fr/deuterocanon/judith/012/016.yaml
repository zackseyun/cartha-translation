base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/016.yaml
  text: And when she entered[a], Judith reclined, and the heart of Holofernes was beside itself over her; his soul was shaken. He was very eager to have relations with her[b], and he was watching for an opportunity to deceive her from the day he saw her.
translation:
  language: fr
  text: Quand elle fut entrée, Judith s’allongea pour prendre place à table[a]. Le cœur d’Holopherne perdit toute maîtrise à cause d’elle, et son âme fut ébranlée. Il désirait ardemment s’unir à elle et, depuis le jour où il l’avait vue, il guettait l’occasion de la tromper[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: À l’époque, lors d’un banquet, les convives pouvaient manger allongés, appuyés sur un divan.
    reason: cultural_note
  - marker: b
    text: Ou « de la séduire » ou « d’abuser d’elle par la ruse ». Le grec dit littéralement « de la tromper » ; dans ce contexte, cette tromperie peut comporter une manipulation sexuelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθοῦσα
  choice: Quand elle fut entrée
  rationale: Le participe aoriste introduit une action antérieure immédiate. Cette proposition temporelle exprime naturellement la succession des actions en français.
- source_word: ἀνέπεσεν
  choice: s’allongea pour prendre place à table
  rationale: Dans le contexte d’un banquet, le verbe désigne la posture ancienne consistant à manger allongé. La formulation évite de laisser croire que Judith se couche simplement pour dormir.
- source_word: ἐξέστη ἡ καρδία Ὀλοφέρνου ἐπʼ αὐτῇ
  choice: Le cœur d’Holopherne perdit toute maîtrise à cause d’elle
  rationale: L’expression décrit un cœur sorti de son état normal, emporté par l’émotion ou le désir. La traduction conserve l’image du cœur et désigne Judith comme la cause, sans préciser davantage la nature exacte du bouleversement.
- source_word: ἐσαλεύθη ἡ ψυχὴ αὐτοῦ
  choice: son âme fut ébranlée
  rationale: Cette traduction conserve le vocabulaire anthropologique de ψυχή ainsi que l’image forte d’un être intérieur secoué.
- source_word: κατενθύμως σφόδρα
  choice: désirait ardemment
  rationale: La formule exprime une très forte inclination intérieure. « Ardemment » transmet son intensité dans un registre courant et digne.
- source_word: τοῦ συγγενέσθαι μετʼ αὐτῆς
  choice: s’unir à elle
  rationale: Dans ce contexte, l’expression est un euphémisme sexuel. « S’unir à elle » en rend le sens tout en conservant la retenue du grec.
- source_word: ἐτήρει καιρόν
  choice: il guettait l’occasion
  rationale: L’imparfait grec présente une recherche continue du moment favorable. « Guettait » en restitue l’attente calculée.
- source_word: τοῦ ἀπατῆσαι αὐτήν
  choice: de la tromper
  rationale: ἀπατάω signifie fondamentalement tromper ou abuser par la ruse. Le contexte peut impliquer une manipulation sexuelle, mais la traduction principale préserve la portée plus large du verbe.
- source_word: ἀφʼ ἧς ἡμέρας εἶδεν αὐτήν
  choice: depuis le jour où il l’avait vue
  rationale: Cette formulation française naturelle conserve le point de départ temporel indiqué par le grec. Le plus-que-parfait clarifie l’antériorité par rapport au récit principal.
theological_decisions:
- issue: Expression euphémistique de l’intention sexuelle
  choice: s’unir à elle
  alternative: coucher avec elle ; avoir des relations sexuelles avec elle
  rationale: Le contexte donne à l’expression un sens sexuel, mais le grec reste euphémistique. Le choix retenu rend cette intention perceptible sans adopter une formulation plus crue ou plus explicite que la source.
- issue: Langage anthropologique de ψυχή
  choice: son âme fut ébranlée
  alternative: tout son être fut ébranlé ; il fut profondément troublé
  rationale: Le maintien du mot « âme » respecte l’image du texte et évite de réduire celle-ci à une simple description psychologique.
- issue: Nature de la tromperie projetée
  choice: la tromper
  alternative: la séduire ; abuser d’elle
  rationale: Le contexte relie la ruse au désir sexuel d’Holopherne, mais le verbe grec désigne d’abord la tromperie. La traduction ne résout donc pas abusivement l’ambiguïté en faveur d’une seule forme de manipulation.
translation_notes:
  register: Français international moderne, fluide et digne. Le texte conserve les images du « cœur » et de l’« âme », explicite discrètement la posture propre au banquet ancien et maintient la retenue de l’euphémisme sexuel grec. Les marqueurs de notes sont placés sur les expressions qu’ils expliquent.
