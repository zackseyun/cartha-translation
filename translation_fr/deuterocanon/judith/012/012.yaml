  text: For look[a], it would be shameful for us if we let such a woman go without speaking with her; for if we do not draw her in, she will laugh at us.
translation:
  language: fr
  text: 'Voyez donc : ce serait une honte pour nous de laisser partir une telle femme sans lui avoir parlé. Car si nous ne l’attirons pas à nous[a], elle se moquera de nous.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « si nous ne la séduisons pas » ou « si nous ne la gagnons pas à nous ». Le verbe grec peut désigner le fait d’attirer quelqu’un vers soi et suggère probablement ici une tentative de séduction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: Voyez donc
  rationale: Cette formule restitue l’appel emphatique de ἰδού et la valeur explicative de γάρ dans un français actuel et naturel.
- source_word: αἰσχρὸν τῷ προσώπῳ ἡμῶν
  choice: ce serait une honte pour nous
  rationale: L’expression évoque la honte qui rejaillirait sur eux et leur honneur, plutôt qu’une apparence physique ou le visage au sens propre.
- source_word: παρήσομεν
  choice: laisser partir
  rationale: Le verbe signifie ici laisser passer ou laisser s’en aller la femme.
- source_word: οὐχ ὁμιλήσαντες αὐτῇ
  choice: sans lui avoir parlé
  rationale: Le participe aoriste négatif indique qu’ils envisagent de la laisser partir sans avoir engagé la conversation avec elle.
- source_word: ἐπισπάσωμεθα
  choice: l’attirons pas à nous
  rationale: Le verbe exprime le fait de tirer ou d’attirer quelqu’un vers soi; dans ce contexte, il peut suggérer une tentative de séduction sans en préciser entièrement le moyen.
- source_word: καταγελάσεται ἡμῶν
  choice: elle se moquera de nous
  rationale: Cette formulation rend clairement l’idée de rire aux dépens de quelqu’un ou de le tourner en ridicule.
