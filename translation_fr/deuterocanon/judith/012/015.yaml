base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/015.yaml
  text: And after disrobing[a], she adorned herself with her garments and with all her feminine adornment; and her female servant came and spread out for her on the ground opposite Holofernes the fleeces that she had received from Bagoas for her daily use[c][b], so that she might recline on them while eating.
translation:
  language: fr
  text: Après s’être dévêtue[a], elle se para de ses vêtements et de tous ses ornements féminins. Son esclave[b] vint étendre pour elle, à même le sol, en face d’Holopherne, les toisons qu’elle avait reçues de Bagoas pour son usage quotidien, afin qu’elle puisse s’y allonger pour manger[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après avoir changé de vêtements »; plus littéralement, « après s’être séparée ». Le participe grec est inhabituel et semble désigner ici le retrait de sa tenue précédente avant qu’elle se pare.
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie la forme féminine du mot désignant une personne en condition d’esclavage. On traduit parfois par « servante ».
    reason: lexical_alternative
  - marker: c
    text: Dans l’usage antique évoqué ici, on prenait le repas en position allongée.
    reason: cultural_note
lexical_decisions:
- source_word: διαστασᾶσα
  choice: après s’être dévêtue
  rationale: Le participe est inhabituel et signifie littéralement quelque chose comme « s’étant séparée ». Dans la succession des gestes, il semble évoquer le retrait de la tenue précédente avant que Judith se pare; la note conserve toutefois l’incertitude lexicale.
- source_word: ἐκοσμήθη
  choice: elle se para
  rationale: Le verbe exprime ici une mise en ordre destinée à embellir, et non le simple fait de s’habiller.
- source_word: ἱματισμῷ
  choice: de ses vêtements
  rationale: Le nom collectif désigne l’habillement; le pluriel est idiomatique en français.
- source_word: παντὶ τῷ κόσμῳ τῷ γυναικείῳ
  choice: de tous ses ornements féminins
  rationale: κόσμος désigne ici la parure au sens large, sans devoir être limité aux seuls bijoux.
- source_word: δούλη
  choice: son esclave
  rationale: Le féminin de δοῦλος indique une femme en condition servile. Le français « esclave » rend ce statut sans ajouter l’adjectif redondant « femme ».
- source_word: ἔστρωσεν
  choice: vint étendre
  rationale: Le verbe décrit l’action de disposer une matière servant de couche ou de support.
- source_word: χαμαί
  choice: à même le sol
  rationale: Cette expression naturelle indique clairement que les toisons sont posées par terre.
- source_word: κώδια
  choice: les toisons
  rationale: Le terme peut désigner des toisons ou des peaux servant de couverture; « toisons » préserve le sens sans préciser indûment l’animal.
- source_word: παρὰ Βαγώου
  choice: qu’elle avait reçues de Bagoas
  rationale: παρά suivi du génitif marque ici la provenance.
- source_word: εἰς τὴν καθημερινὴν δίαιταν αὐτῆς
  choice: pour son usage quotidien
  rationale: δίαιτα peut désigner le mode de vie ou le régime habituel; dans ce contexte matériel et répétitif, « usage quotidien » reste clair sans surinterpréter.
- source_word: κατακλινομένην
  choice: s’y allonger pour manger
  rationale: Le participe évoque la posture allongée ou inclinée adoptée pendant le repas; la formulation française demeure naturelle et la note en précise le contexte culturel.
