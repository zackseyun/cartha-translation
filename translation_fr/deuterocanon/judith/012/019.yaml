  text: And taking it[a], she ate and drank before him what her maidslave had prepared.
translation:
  language: fr
  text: Elle en prit, puis mangea et but devant lui ce que son esclave[a] avait préparé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa servante ». Le grec désigne une femme esclave.
    reason: Alternative lexicale et précision sur le statut exprimé par δούλη.
lexical_decisions:
- source_word: λαβοῦσα
  choice: Elle en prit, puis
  rationale: Le participe aoriste marque une action qui précède immédiatement les verbes principaux. « En prit » restitue naturellement en français l’objet sous-entendu, déterminé par le contexte, tandis que « puis » rend l’enchaînement sans alourdir la phrase.
- source_word: ἔφαγεν καὶ ἔπιεν
  choice: mangea et but
  rationale: Les deux aoristes coordonnés décrivent simplement les actions successives de Judith; le passé simple convient au registre narratif français.
- source_word: κατέναντι αὐτοῦ
  choice: devant lui
  rationale: L’expression indique la présence spatiale de Judith face à l’homme dont il est question; « devant lui » est à la fois précis et naturel.
- source_word: ἃ ἡτοίμασεν
  choice: ce que … avait préparé
  rationale: Le relatif neutre pluriel désigne collectivement les aliments et la boisson. Le plus-que-parfait explicite en français que la préparation est antérieure au repas.
- source_word: ἡ δούλη αὐτῆς
  choice: son esclave
  rationale: δούλη est le féminin de δοῦλος et désigne ici une femme en condition servile. « Son esclave » conserve cette réalité sociale sans l’atténuer en simple service domestique.
theological_decisions:
- issue: Portée sociale de δούλη
  choice: son esclave
  alternative: sa servante
  rationale: Le grec désigne explicitement une femme esclave. Le rendu principal maintient ce sens, tandis que la note signale l’alternative française traditionnelle sans transformer le rapport social exprimé par le texte.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple maintient la tenue littéraire du récit tout en restant clair. La syntaxe est légèrement réorganisée par « puis » afin de rendre naturellement le participe grec et son rapport aux verbes principaux.
