  yaml_path: translation/deuterocanon/judith/012/004.yaml
  text: And Judith said to him[a], “As your life lives, my lord[c][b], your servant will not use up what is with me until he has accomplished by my hand what he has planned.”
translation:
  language: fr
  text: 'Judith lui dit : « Aussi vrai que tu es vivant, mon seigneur, ta servante n’épuisera pas ce que j’ai avec moi jusqu’à ce qu’il ait accompli par ma main ce qu’il a projeté.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sujet de « ait accompli » et de « a projeté » n’est pas exprimé en grec ; dans le contexte, il s’agit très probablement de Dieu agissant par l’intermédiaire de Judith. « Ce que j’ai avec moi » désigne vraisemblablement ses provisions.
    reason: alternative_reading
lexical_decisions:
- source_word: Ζῇ ἡ ψυχή σου
  choice: Aussi vrai que tu es vivant
  rationale: Cette formule de serment signifie littéralement « Ta vie vit ». La formulation française retenue en restitue naturellement la valeur solennelle sans produire un calque obscur.
- source_word: κύριέ μου
  choice: mon seigneur
  rationale: Il s’agit ici d’une adresse respectueuse à Holopherne, non d’un titre divin. « Mon seigneur » conserve le registre social et solennel.
- source_word: ἡ δούλη σου
  choice: ta servante
  rationale: Dans cette formule d’autodésignation déférente, Judith se place verbalement au service de son interlocuteur. « Ta servante » est naturel en français et préserve le registre sans affirmer à tort un statut juridique d’esclave dans la scène.
- source_word: οὐ δαπανήσει
  choice: n’épuisera pas
  rationale: Le verbe exprime le fait de dépenser ou de consommer jusqu’à épuisement. Avec les vivres implicites, « épuiser » convient mieux que le sens financier de « dépenser ».
- source_word: τὰ ὄντα μετʼ ἐμοῦ
  choice: ce que j’ai avec moi
  rationale: La formule grecque signifie littéralement « les choses qui sont avec moi ». Cette traduction reste proche tout en étant idiomatique; le contexte indique vraisemblablement les provisions de Judith.
- source_word: ἕως ἄν ποιήσῃ
  choice: avant qu’il ait accompli
  rationale: Le subjonctif après ἕως ἄν envisage un accomplissement attendu. Le pronom masculin garde le sujet implicite du grec sans le nommer.
- source_word: ἐν χειρί μου
  choice: par ma main
  rationale: Cette expression indique l’agent ou l’instrument. « Par ma main » conserve l’image biblique et souligne que l’action s’effectuera par l’intermédiaire de Judith.
- source_word: ἃ ἐβουλεύσατο
  choice: ce qu’il a projeté
  rationale: Le verbe désigne ce que quelqu’un a résolu ou conçu. « Projeté » restitue une intention délibérée tout en restant naturel.
theological_decisions:
- issue: Sujet implicite de ποιήσῃ et ἐβουλεύσατο
  choice: Conserver « il » sans identifier explicitement le sujet dans le corps du texte.
  alternative: Nommer Dieu, ou employer une tournure impersonnelle telle que « avant que s’accomplisse par ma main ce qui a été projeté ».
  rationale: Le grec porte un sujet masculin singulier non exprimé. Le contexte permet naturellement d’y voir Dieu, mais le nommer dans le texte lèverait une implicitation présente dans la source. La note rend cette lecture probable sans éliminer l’ambiguïté formelle.
translation_notes:
  register: Français international moderne, digne et narratif. La formule de serment est rendue idiomatiquement; l’adresse « mon seigneur » conserve la déférence de Judith. La syntaxe garde l’agent divin implicite et l’expression imagée « par ma main ».
