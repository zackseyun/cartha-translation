  text: And on the fourth day[a], Holofernes gave a banquet for his servants alone[b], and he did not invite any of those in attendance.
translation:
  language: fr
  text: Le quatrième jour, Holopherne donna un banquet réservé à ses esclaves[a] et n’invita aucun de ceux qui étaient chargés du service[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie doulos, terme qui peut signifier « esclave » ou « serviteur » selon le contexte. « Esclaves » préserve ici le statut de dépendance exprimé par le mot.
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque est quelque peu idiomatique; elle paraît désigner les personnes affectées aux tâches de service ou aux fonctions nécessaires.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῇ ἡμέρᾳ τῇ τετάρτῃ
  choice: Le quatrième jour
  rationale: Cette tournure grecque sert de repère temporel narratif. La formulation française est naturelle et conserve pleinement le sens.
- source_word: ἐποίησεν ... πότον
  choice: donna un banquet
  rationale: πότος désigne une réception centrée sur la boisson, un festin ou un banquet. « Donna un banquet » exprime naturellement le rôle d’hôte d’Holopherne sans réduire l’événement à une simple beuverie.
- source_word: τοῖς δούλοις αὐτοῦ μόνοις
  choice: réservé à ses esclaves
  rationale: δοῦλος peut désigner un esclave ou, selon le contexte, un serviteur. « Esclaves » préserve ici le statut de dépendance impliqué par le terme grec, tandis que « réservé à » rend clairement la restriction exprimée par μόνοις.
- source_word: οὐκ ἐκάλεσεν
  choice: n’invita
  rationale: Dans le contexte d’un banquet, « inviter » rend le sens social de l’appel plus justement que « appeler » ou « convoquer ».
- source_word: εἰς τὴν χρῆσιν οὐδένα τῶν πρὸς ταῖς χρείαις
  choice: aucun de ceux qui étaient chargés du service
  rationale: L’expression est idiomatique et quelque peu obscure. Elle semble viser des personnes affectées à des tâches pratiques ou officielles; cette traduction conserve le lien lexical avec le service sans préciser indûment leur fonction.
