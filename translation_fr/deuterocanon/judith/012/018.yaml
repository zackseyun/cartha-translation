  terminology: « Mon seigneur » convient pour κύριε dans cette adresse respectueuse. « Ma vie a été magnifiée en moi » conserve volontairement la formulation élevée et quelque peu inhabituelle de ἐμεγαλύνθη τὸ ζῆν μου ἐν ἐμοί, sans la réduire à la joie, à la prospérité ou à une exaltation explicitée.
