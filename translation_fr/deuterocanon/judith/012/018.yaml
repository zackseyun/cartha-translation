  text: And Judith said[a], “I will drink now, my lord, because my life has been magnified within me today beyond all the days since my birth.”
translation:
  language: fr
  text: 'Et Judith dit : « Je boirai donc, mon seigneur, car aujourd’hui ma vie a été magnifiée en moi plus que jamais depuis ma naissance. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίομαι
  choice: Je vais boire
  rationale: Le futur moyen de πίνω exprime ici la réponse volontaire de Judith à l’invitation. « Je vais boire » est naturel en français moderne tout en conservant cette valeur prospective et volontaire.
- source_word: δή
  choice: donc
  rationale: La particule apporte une légère insistance liée au contexte immédiat. « Donc » restitue naturellement l’idée de réponse ou d’acquiescement sans la surcharger.
- source_word: κύριε
  choice: mon seigneur
  rationale: Le vocatif marque une adresse respectueuse à Holopherne. « Mon seigneur » conserve la déférence sans suggérer qu’il s’agit d’une adresse divine.
- source_word: ἐμεγαλύνθη
  choice: a été magnifiée
  rationale: L’aoriste passif de μεγαλύνω signifie littéralement « a été rendue grande » ou « a été magnifiée ». Cette formulation élevée et inhabituelle préserve la force rhétorique du grec sans la réduire à l’idée de bonheur ou de prospérité.
- source_word: τὸ ζῆν μου
  choice: ma vie
  rationale: L’infinitif substantivé signifie littéralement « mon fait de vivre ». « Ma vie » en donne l’équivalent idiomatique le plus direct en français.
- source_word: ἐν ἐμοὶ
  choice: en moi
  rationale: La locution prépositionnelle est maintenue afin de préserver la dimension intérieure et personnelle de l’expression grecque.
- source_word: σήμερον
  choice: aujourd’hui
  rationale: Équivalent temporel courant et précis.
- source_word: παρὰ πάσας τὰς ἡμέρας
  choice: plus que durant tous les jours
  rationale: παρά avec l’accusatif exprime ici une comparaison. Cette tournure conserve explicitement le degré comparatif tout en restant compréhensible en français.
- source_word: τῆς γενέσεώς μου
  choice: écoulés depuis ma naissance
  rationale: γένεσις désigne ici la naissance ou l’origine. L’ajout d’« écoulés » explicite naturellement en français que les jours comparés sont ceux vécus depuis la naissance, sans modifier le sens.
theological_decisions:
- issue: Sens de l’affirmation selon laquelle la vie de Judith a été « magnifiée »
  choice: Conserver l’expression élevée et métaphorique « ma vie a été magnifiée en moi »
  alternative: « Je ne me suis jamais sentie aussi vivante » ou « ma vie a été plus prospère aujourd’hui que jamais »
  rationale: Le grec associe μεγαλύνω à τὸ ζῆν μου dans une formulation rhétoriquement marquée. Il ne précise pas s’il est question de joie, de vitalité, de prospérité ou d’exaltation; la traduction préserve donc cette ouverture interprétative.
translation_notes:
  register: Français international moderne, digne et légèrement soutenu, en accord avec la rhétorique du passage. La tournure inhabituelle « ma vie a été magnifiée en moi » est volontairement conservée pour refléter l’étrangeté expressive du grec. Aucun appel de note n’est nécessaire, puisqu’aucune note n’est fournie.
