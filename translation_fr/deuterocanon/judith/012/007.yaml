revisions:
- from: Holopherne donna aux gardes du corps l’ordre de ne pas l’en empêcher. Elle resta trois jours dans le camp ; chaque nuit, elle sortait dans le ravin de Béthulie[a] et se baignait[b] dans le camp, à la source.
  to: Holopherne ordonna à ses gardes du corps de ne pas l’en empêcher. Elle resta trois jours dans le camp ; chaque nuit, elle sortait dans le ravin[a] de Béthulie et se lavait[b] à la source d’eau dans le camp.
  rationale: La révision corrige l'ancrage de la note topographique, améliore la lisibilité du dernier complément locatif tout en maintenant l'énoncé difficile du grec (« dans le camp »), et choisit « se lavait », rendu contextuellement neutre de ἐβαπτίζετο. « Chaque nuit » conserve de façon justifiée la valeur habituelle de l'imparfait ἐξεπορεύετο.
