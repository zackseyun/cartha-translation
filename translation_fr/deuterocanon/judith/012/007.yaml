review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement l'ordre donné aux gardes, le séjour de trois jours et la valeur itérative probable de l'imparfait (« chaque nuit, elle sortait »). Cependant, le dernier groupe locatif grec ἐν τῇ παρεμβολῇ ἐπὶ τῆς πηγῆς τοῦ ὕδατος place explicitement l'action « dans le camp, près/à la source d'eau »; la formulation actuelle « se baignait dans le camp, à la source » est grammaticalement possible mais ambiguë et peu naturelle. « Se lavait » rend mieux ἐβαπτίζετο dans ce contexte sans imposer une immersion complète que « se baignait » peut suggérer.
  naturalness: Le français est globalement moderne et fluide. « aux gardes du corps » est acceptable, mais « à ses gardes du corps » est plus naturel et explicite en français narratif. « à la source d'eau dans le camp » clarifie la syntaxe tout en conservant la localisation difficile du grec.
  terminology: « Holopherne », « Béthulie », « gardes du corps », « camp » et « ravin » conviennent. Le choix « se lavait » évite l'association sacramentelle de « baptiser » et l'interprétation possiblement trop précise de « se baignait ». La note sur βαπτίζω est utile, mais doit être ancrée au verbe concerné et non au nom de lieu.
  issues:
  - severity: medium
    issue: Ancrage de la note a incorrect
    rationale: La note a, qui porte sur les sens possibles de φάραγξ (« vallée encaissée », « gorge »), est actuellement attachée à « Béthulie » plutôt qu'à « ravin ».
  - severity: medium
    issue: Localisation finale ambiguë et peu idiomatique
    rationale: « se baignait dans le camp, à la source » peut faire entendre une contradiction spatiale après « dans le ravin » et ne rend pas clairement que « dans le camp » qualifie le lieu de la source/action. « à la source d'eau dans le camp » conserve le grec sans résoudre artificiellement sa tension géographique.
  - severity: low
    issue: « se baignait » est légèrement plus spécifique que nécessaire
    rationale: ἐβαπτίζετο peut désigner le lavage ou l'immersion; « se lavait » est le rendu français le plus neutre dans ce contexte, sans faire de l'acte une baignade de loisir ni un baptême.
