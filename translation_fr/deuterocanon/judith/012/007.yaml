  yaml_path: translation/deuterocanon/judith/012/007.yaml
  text: And Holofernes ordered the bodyguards not to hinder her[a]. So she remained in the camp for three days, and went out at night into the valley of Bethulia[b], and washed herself at the spring of water by the camp.
translation:
  language: fr
  text: Holopherne ordonna à ses gardes du corps de ne pas l’en empêcher. Elle resta trois jours dans le camp ; chaque nuit, elle sortait dans le ravin[a] de Béthulie et se lavait[b] à la source d’eau dans le camp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vallée encaissée » ou « gorge ».
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec appartient à la même famille que le verbe traduit ailleurs par « baptiser » ; ici, il désigne le fait de se plonger dans l’eau ou de se laver.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέταξεν
  choice: donna … l’ordre
  rationale: Cette tournure française naturelle conserve la force d’autorité du verbe grec.
- source_word: σωματοφύλαξι
  choice: gardes du corps
  rationale: Le composé grec désigne précisément les gardes chargés de protéger la personne d’Holopherne.
- source_word: μὴ διακωλύειν αὐτήν
  choice: de ne pas l’en empêcher
  rationale: Le pronom « en » renvoie naturellement à l’action que Judith avait demandé l’autorisation d’accomplir, tout en gardant l’idée de ne pas lui faire obstacle.
- source_word: παρέμεινεν ἐν τῇ παρεμβολῇ ἡμέρας τρεῖς
  choice: Elle resta trois jours dans le camp
  rationale: Traduction directe et idiomatique de la durée et du cadre militaire.
- source_word: ἐξεπορεύετο κατὰ νύκτα
  choice: chaque nuit, elle sortait
  rationale: L’imparfait grec présente une action répétée durant les trois jours ; « chaque nuit » rend cette valeur habituelle plus clairement que le simple « la nuit ».
- source_word: φάραγγα
  choice: ravin
  rationale: Le mot grec désigne plus précisément une dépression étroite ou encaissée qu’une vallée au sens large ; une note conserve les autres possibilités.
- source_word: Βαιτυλοῦα
  choice: Béthulie
  rationale: Forme française traditionnelle et reconnaissable du nom de lieu.
- source_word: ἐβαπτίζετο
  choice: se baignait
  rationale: Le verbe décrit ici le fait de se plonger dans l’eau ou de se laver. « Se baignait » exprime naturellement l’action sans introduire directement le sens chrétien technique de « baptiser ».
- source_word: ἐν τῇ παρεμβολῇ ἐπὶ τῆς πηγῆς τοῦ ὕδατος
  choice: dans le camp, à la source
  rationale: Cette traduction suit l’ordre et les relations locatives du texte grec, même si la localisation peut sembler difficile après la mention du ravin. « Source » suffit naturellement en français pour πηγῆς τοῦ ὕδατος.
theological_decisions:
- issue: Sens de ἐβαπτίζετο dans ce récit antérieur au christianisme
  choice: se baignait
  alternative: s’immergeait ; se lavait
  rationale: Le contexte décrit une immersion ou ablution nocturne à une source. La traduction ne qualifie pas explicitement l’acte de baptême ni de purification rituelle, puisque le verset lui-même n’en précise pas la portée théologique.
- issue: Localisation de la baignade
  choice: dans le camp, à la source
  alternative: à la source près du camp
  rationale: Le grec reçu porte explicitement ἐν τῇ παρεμβολῇ, « dans le camp ». La difficulté géographique n’est pas résolue par l’ajout interprétatif « près du camp ».
translation_notes:
  register: Français international moderne, narratif et digne. L’imparfait et « chaque nuit » font ressortir l’action répétée. La formulation conserve la localisation donnée par le grec sans harmonisation géographique.
