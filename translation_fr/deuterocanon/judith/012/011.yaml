  source_fidelity: 'La traduction rend correctement les éléments essentiels : Bagoas, « eunuque », l’ordre de persuader, la désignation « femme hébreue », ainsi que l’invitation à venir, manger et boire. Toutefois, « qui avait la charge de tout ce qui lui appartenait » rend le possessif français ambigu : il peut se rapporter à Bagoas, alors que le grec αὐτοῦ renvoie, dans le contexte, au personnage qui parle. La construction « de venir nous rejoindre, pour manger » peut aussi présenter le repas comme un simple but, plutôt que comme le second contenu coordonné de l’invitation.'
