base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/011.yaml
  text: And he said to Bagoas the eunuch[a], who was in charge of all that belonged to him[b], “Go now and persuade the Hebrew woman who is with you to come to us and eat and drink with us.”
translation:
  language: fr
  text: 'Il dit à Bagoas, l’eunuque[a] qui était chargé de tout ce qui appartenait à celui-ci : « Va donc persuader[b] la femme hébreue qui est auprès de toi de venir auprès de nous et de manger et boire avec nous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut aussi désigner, dans certains contextes, un haut fonctionnaire de cour ; il est rendu ici littéralement.
    reason: lexical_alternative
  - marker: b
    text: Ou « convaincre » ou « presser » ; l’ordre consiste à l’amener à accepter de venir.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βαγώᾳ
  choice: Bagoas
  rationale: Le nom propre est translittéré conformément à l’usage français courant dans ce livre.
- source_word: εὐνούχῳ
  choice: l’eunuque
  rationale: Le terme grec désigne littéralement un eunuque, même s’il peut parfois s’employer plus largement pour un haut fonctionnaire de cour.
- source_word: ἐφεστηκὼς ἐπὶ πάντων τῶν αὐτοῦ
  choice: qui avait la charge de tout ce qui lui appartenait
  rationale: Cette formulation naturelle exprime l’autorité administrative exercée sur l’ensemble des biens ou des affaires d’Holopherne, sans préciser indûment l’un ou l’autre sens.
- source_word: Πεισὸν
  choice: persuader
  rationale: L’impératif demande à Bagoas d’amener Judith à accepter l’invitation; « persuader » conserve cette nuance sans suggérer une contrainte explicite.
- source_word: τὴν γυναῖκα τὴν Ἑβραίαν
  choice: la femme hébreue
  rationale: γυνή signifie ici « femme », non « épouse », et « hébreue » préserve la désignation ethnique du grec.
- source_word: ἣ ἔστιν παρὰ σοὶ
  choice: qui est auprès de toi
  rationale: Cette traduction conserve la proximité exprimée par παρά sans imposer l’idée plus précise qu’elle serait sous sa garde ou chez lui.
- source_word: τοῦ ἐλθεῖν πρὸς ἡμᾶς
  choice: de venir nous rejoindre
  rationale: L’infinitif exprime ce à quoi Bagoas doit la persuader; « nous rejoindre » rend naturellement le mouvement vers le groupe du locuteur.
- source_word: φαγεῖν καὶ πιεῖν μεθʼ ἡμῶν
  choice: pour manger et boire avec nous
  rationale: La traduction directe respecte les deux verbes et le cadre du repas sans ajouter une nuance absente du grec.
