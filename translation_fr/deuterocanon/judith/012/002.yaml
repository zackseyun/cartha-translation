base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/002.yaml
  text: And Judith said[a], “I will not eat from them, lest it become a stumbling block; instead, provision will be made for me from the things that have accompanied me.”
translation:
  language: fr
  text: 'Judith dit : « Je ne mangerai pas de ces aliments, de peur que cela ne soit une cause de chute[a] ; mais on me fournira de la nourriture de mes provisions qui m’ont accompagnée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une occasion de faute » ou « un scandale ». Le grec σκάνδαλον peut désigner ce qui fait trébucher, une offense ou une cause de chute.
    reason: Alternative lexicale permettant de conserver l’étendue sémantique du terme grec.
lexical_decisions:
- source_word: Οὐ φάγομαι
  choice: Je ne mangerai pas
  rationale: Le futur grec exprime ici directement le refus de Judith ; le futur simple français en conserve la netteté.
- source_word: ἐξ αὐτῶν
  choice: de ces aliments
  rationale: Le pronom renvoie aux aliments qui viennent d’être proposés. L’explicitation légère évite en français une référence pronominale obscure sans ajouter une nouvelle idée.
- source_word: ἵνα μὴ γένηται
  choice: de peur que cela ne devienne
  rationale: Cette tournure française exprime naturellement le résultat que Judith veut éviter et conserve la valeur prospective du grec.
- source_word: σκάνδαλον
  choice: une cause de chute
  rationale: Cette expression garde la métaphore de l’obstacle qui fait tomber ainsi que sa portée morale ou religieuse, sans la réduire à un simple embarras public.
- source_word: ἀλλʼ
  choice: mais
  rationale: La conjonction marque simplement le contraste entre les aliments refusés et les provisions de Judith.
- source_word: ἐκ τῶν ἠκολουθηκότων μοι
  choice: parmi les provisions que j’ai apportées avec moi
  rationale: Le participe désigne littéralement les choses qui ont accompagné Judith. Dans ce contexte alimentaire, « provisions » rend clairement le référent, tandis que « apportées avec moi » transmet l’idée de ce qui l’a accompagnée.
- source_word: χορηγηθήσεται
  choice: on me fournira de quoi manger
  rationale: La tournure impersonnelle française rend naturellement le futur passif grec et explicite, d’après le contexte immédiat, la nature de ce qui doit être fourni.
theological_decisions:
- issue: Portée de σκάνδαλον dans le refus de Judith
  choice: une cause de chute
  alternative: une occasion de faute ; un scandale
  rationale: Le choix retenu préserve l’image grecque et laisse ouverte la nature précise du danger moral ou religieux, au lieu de le ramener à une transgression déterminée ou à un scandale social.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct reste ferme et clair. L’expression « cause de chute » conserve la métaphore biblique sans employer une formulation archaïque.
