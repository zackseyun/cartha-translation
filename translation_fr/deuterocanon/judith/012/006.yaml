  - severity: low
    issue: Expression temporelle peu naturelle
    rationale: « Vers la veille du matin » suit de très près πρὸς, mais l’expression est raide en français actuel. « À l’approche de la veille du matin » rend le mouvement temporel sans imposer une heure précise.
