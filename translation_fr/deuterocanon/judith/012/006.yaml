  source_fidelity: 'Le sens général est fidèlement rendu : Judith se lève au moment de la veille matinale, fait transmettre une demande à Holopherne et sollicite l’autorisation de sortir pour prier. Toutefois, « donne donc l’ordre de laisser votre servante sortir » peut se comprendre comme un ordre adressé à la servante elle-même ; une formulation qui exprime explicitement l’autorisation accordée est plus exacte.'
  naturalness: « Vers la veille du matin » est un calque compréhensible, mais peu idiomatique en français moderne. « À l’approche de la veille du matin » conserve la nuance de πρὸς tout en étant plus naturel. La construction proposée pour la demande est également plus fluide.
  terminology: « Mon seigneur » rend correctement le titre humain κύριος ; « votre servante » est une bonne transposition déférente de δούλη, avec une note qui conserve l’alternative « esclave ». « Holopherne » est l’orthographe française usuelle.
