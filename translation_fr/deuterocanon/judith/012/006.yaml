base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/006.yaml
  text: And she arose toward the morning watch[a], and sent to Holofernes, saying, “Let my lord now give orders to allow your servant to go out for prayer.”
translation:
  language: fr
  text: 'Elle se leva à l’approche de la veille du matin[a] et envoya dire à Holopherne : « Que mon seigneur ordonne donc qu’on permette à votre servante[b] de sortir pour prier. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « veille du matin » est la période de garde située vers la fin de la nuit.
    reason: Clarification d’un repère temporel ancien.
  - marker: b
    text: Ou « votre esclave ». Le grec emploie δούλη, terme féminin qui peut désigner une servante ou une esclave selon le contexte.
    reason: Préservation d’une autre valeur lexicale possible.
lexical_decisions:
- source_word: ἀνέστη
  choice: elle se leva
  rationale: L’aoriste de ἀνίστημι indique ici que Judith se lève à ce moment du récit ; « se leva » convient au registre narratif.
- source_word: πρὸς τὴν ἑωθινὴν φυλακήν
  choice: vers la veille du matin
  rationale: φυλακή désigne une période de garde nocturne et ἑωθινή la situe au matin. « Vers » conserve la nuance temporelle de πρὸς sans réduire l’expression à un instant précis.
- source_word: ἀπέστειλεν πρὸς Ὁλοφέρνην λέγουσα
  choice: envoya dire à Holopherne
  rationale: Cette tournure française rend naturellement l’envoi d’un message ou d’un messager, explicité par λέγουσα.
- source_word: Ἐπιταξάτω
  choice: donne donc l’ordre
  rationale: L’impératif aoriste demande à Holopherne d’émettre un ordre ; cette formulation en conserve la force tout en restant naturelle.
- source_word: ὁ κύριός μου
  choice: mon seigneur
  rationale: κύριος est ici un titre humain de déférence adressé à Holopherne, et non un titre divin.
- source_word: ἐᾶσαι
  choice: de laisser
  rationale: Le verbe exprime la permission demandée ; « laisser » est direct et idiomatique dans cette construction.
- source_word: τὴν δούλην σου
  choice: votre servante
  rationale: Judith parle d’elle-même avec déférence. Le vouvoiement convient en français moderne à l’adresse respectueuse, tandis qu’une note conserve le sens possible d’« esclave ».
- source_word: ἐπὶ προσευχὴν ἐξελθεῖν
  choice: sortir pour prier
  rationale: La formulation rend clairement le mouvement de sortie et la valeur finale de ἐπὶ προσευχὴν.
theological_decisions:
- issue: Valeur de κύριος appliqué à un supérieur humain
  choice: mon seigneur
  alternative: mon maître
  rationale: Le référent est Holopherne. La minuscule et le contexte signalent un titre social de respect sans lui donner une portée divine.
- issue: Valeur de δούλη dans l’auto-désignation de Judith
  choice: votre servante
  alternative: votre esclave
  rationale: Dans cette demande adressée à un chef, le mot fonctionne comme une formule d’abaissement respectueux. La note maintient toutefois la nuance sociale plus forte que peut porter le grec.
translation_notes:
  register: Français international moderne, digne et narratif. Le discours respecte la déférence de Judith envers Holopherne ; « votre » transpose naturellement en français le pronom grec de deuxième personne.
