  yaml_path: translation/deuterocanon/judith/012/001.yaml
  text: And he ordered that she be brought in where his silverware was kept[b][a], and he directed that food be prepared for her from his own dishes and that she drink from his wine.
translation:
  language: fr
  text: Il ordonna qu’on la conduise à l’endroit où étaient entreposés ses objets d’argent[a], puis il prescrivit qu’on lui serve de ses plats préparés[b] et qu’elle boive de son vin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses récipients d’argent ». Le terme grec désigne de manière générale des objets en argent, peut-être ici de la vaisselle ou des récipients de service.
    reason: lexical_alternative
  - marker: b
    text: Ou « qu’on dresse pour elle une table avec ses mets ». Le verbe grec évoque littéralement le fait de disposer ou d’étaler ce qui doit être servi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: Il ordonna
  rationale: Le verbe exprime un ordre donné avec autorité. « Il ordonna » est direct, naturel et fidèle à cette force.
- source_word: εἰσαγαγεῖν αὐτήν
  choice: qu’on la conduise
  rationale: L’infinitif dépend du verbe d’ordre et suppose que des serviteurs conduisent Judith dans le lieu indiqué.
- source_word: οὗ ἔτιθετο
  choice: à l’endroit où étaient entreposés
  rationale: L’imparfait décrit ici le lieu où les objets étaient déposés ou conservés. « Étaient entreposés » rend clairement cette valeur contextuelle.
- source_word: τὰ ἀργυρώματα αὐτοῦ
  choice: ses objets d’argent
  rationale: Le nom désigne des articles faits d’argent sans préciser qu’il s’agit nécessairement de couverts. Cette formulation conserve l’étendue du terme grec.
- source_word: συνέταξεν
  choice: puis il prescrivit
  rationale: Le verbe introduit une nouvelle directive autoritaire. « Prescrivit » évite de répéter « ordonna » tout en gardant sa force.
- source_word: καταστρῶσαι αὐτῇ
  choice: qu’on lui serve
  rationale: Dans ce contexte de repas, le verbe évoque ce que l’on étale ou dispose devant quelqu’un. « Servir » exprime naturellement l’action sans la confondre avec la cuisson.
- source_word: ἀπὸ τῶν ὀψοποιημάτων αὐτοῦ
  choice: de ses plats préparés
  rationale: Le terme désigne des mets apprêtés, éventuellement des plats raffinés. « Plats préparés » reste précis sans ajouter l’idée certaine de mets délicats.
- source_word: τοῦ οἴνου αὐτοῦ πινεῖν
  choice: qu’elle boive de son vin
  rationale: Cette proposition poursuit le contenu de la directive et indique que Judith doit prendre du vin appartenant à Holopherne.
