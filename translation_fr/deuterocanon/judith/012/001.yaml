translation_notes:
  register: Français international actuel, narratif et digne. Le recours à « on » rend naturellement les infinitifs grecs dont les exécutants implicites sont les serviteurs. Les formulations génériques « objets d’argent » et « plats préparés » préservent les limites lexicales du grec, tandis que les notes signalent les lectures contextuelles plus précises.
