base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/013.yaml
  text: And Bagoas went out from the presence of Holofernes and went in to her and said[a], “Let this beautiful young woman not hesitate to come to my lord, to be honored before him, and to drink wine with us in gladness[b], and to become on this day like one of the daughters of the Assyrians who stand in the house of Nebuchadnezzar.”
translation:
  language: fr
  text: 'Bagoas sortit de la présence d’Holopherne, entra auprès d’elle et dit : « Que cette belle jeune femme[a] n’hésite donc pas à venir auprès de mon seigneur pour être honorée devant lui, à boire du vin avec nous dans la joie, et à devenir aujourd’hui comme l’une des filles des Assyriens qui se tiennent[b] dans la maison de Nabuchodonosor. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « servante »; le mot grec peut désigner une jeune femme, une servante ou une esclave. Ici, il est employé comme une adresse flatteuse.
    reason: lexical_alternative
  - marker: b
    text: Ou « qui sont au service de la maison de Nabuchodonosor ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν ... ἀπὸ προσώπου
  choice: sortit de la présence de
  rationale: Cette tournure française conserve l’idée de quitter la présence d’un supérieur et la nuance de cour portée par l’expression grecque.
- source_word: εἰσῆλθεν πρὸς αὐτήν
  choice: entra auprès d’elle
  rationale: Le verbe de mouvement est maintenu sans donner à l’expression une connotation sexuelle absente du contexte.
- source_word: Μὴ ὀκνήσῃς δὴ
  choice: Que ... n’hésite donc pas
  rationale: La formulation à la troisième personne préserve la forme grecque de cette adresse flatteuse et déférente; « donc » rend la particule δὴ.
- source_word: ἡ παιδίσκη ἡ καλὴ αὕτη
  choice: cette belle jeune femme
  rationale: « Jeune femme » convient au contexte et au registre digne, tandis qu’une note conserve le sens possible de servante attaché à παιδίσκη.
- source_word: δόξασθῆναι κατὰ πρόσωπον αὐτοῦ
  choice: pour être honorée devant lui
  rationale: Dans ce contexte de cour, δοξάζω désigne l’honneur reçu en présence d’Holopherne, non une glorification religieuse.
- source_word: πίεσαι μεθʼ ἡμῶν εἰς εὐφροσύνην οἴνου
  choice: à boire du vin avec nous dans la joie
  rationale: La traduction exprime clairement la consommation de vin et son cadre festif sans alourdir la phrase.
- source_word: γενηθήναι ... ὡς θυγάτηρ μία
  choice: à devenir ... comme l’une des filles
  rationale: « Devenir » maintient la nuance d’entrée dans un statut ou un rôle, et « l’une des filles » rend naturellement le tour grec.
- source_word: τῶν υἱῶν Ἀσσούρ
  choice: des Assyriens
  rationale: L’expression ethnique littérale « des fils d’Assour » est rendue par son équivalent français courant, « des Assyriens », sans suggérer uniquement une filiation immédiate.
- source_word: αἱ παρεστηκυῖαι ἐν οἴκῳ Ναβουχοδονόσορ
  choice: qui se tiennent dans la maison de Nabuchodonosor
  rationale: « Se tiennent » garde l’image du grec tout en pouvant évoquer des femmes attachées au service de la maison royale; la note indique l’autre compréhension possible.
theological_decisions:
- issue: Sens de κύριος dans un contexte de cour humaine
  choice: mon seigneur
  alternative: mon maître
  rationale: Le titre désigne ici Holopherne et marque son rang; la minuscule et le possessif évitent toute confusion avec un titre divin tout en conservant la déférence du grec.
translation_notes:
  register: Français international moderne, narratif et digne. L’adresse à la troisième personne, inhabituelle en français courant, est conservée pour refléter la déférence flatteuse du grec. Les noms propres suivent les formes françaises traditionnelles.
