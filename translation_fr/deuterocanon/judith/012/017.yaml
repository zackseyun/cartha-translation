lexical_decisions:
- source_word: Πίε δὴ
  choice: Bois donc
  rationale: L’impératif aoriste Πίε exprime une invitation pressante à boire, et la particule δή en renforce ici l’insistance ou l’immédiateté. « Bois donc » restitue naturellement ces deux éléments.
- source_word: γενήθητι μεθʼ ἡμῶν εἰς εὐφροσύνην
  choice: réjouis-toi avec nous
  rationale: Littéralement, la tournure invite Judith à être avec eux en vue de la joie ou de la réjouissance. « Réjouis-toi avec nous » exprime clairement la participation festive sans ajouter de détail absent du grec.
- source_word: εὐφροσύνην
  choice: réjouis-toi
  rationale: εὐφροσύνη désigne la joie, l’allégresse ou la réjouissance, souvent dans un cadre festif. La formulation verbale est idiomatique en français et conserve ce sens.
- source_word: Ὀλοφέρνης
  choice: Holopherne
  rationale: Forme française traditionnelle et courante du nom propre grec Ὀλοφέρνης.
