  text: And when she went up[a], she was praying to the Lord God of Israel to direct her way for the exaltation of the sons of his people.
translation:
  language: fr
  text: Et lorsqu’elle remonta, elle priait le Seigneur, le Dieu d’Israël, de diriger sa route en vue du relèvement des fils de son peuple.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, à la place de « relèvement » : « exaltation » ou « restauration ». Le nom grec ἀνάστημα est rare et peut évoquer une élévation de statut ou un relèvement de condition, plutôt qu’un simple mouvement physique.'
    reason: Signaler l’incertitude lexicale réelle de ἀνάστημα et préciser que les variantes concernent le nom rendu par « relèvement ».
lexical_decisions:
- source_word: ἀνέβη
  choice: fut remontée
  rationale: Le contexte immédiat de Judith 12 décrit son retour après être descendue vers la source; « remonter » rend donc naturellement le mouvement spatial de ἀναβαίνω.
- source_word: ἐδέετο
  choice: priait
  rationale: L’imparfait exprime une action en cours; devant Dieu, δέομαι désigne ici une prière instante, rendue sans lourdeur par « priait ».
- source_word: κυρίου θεοῦ Ἰσραήλ
  choice: le Seigneur, Dieu d’Israël
  rationale: Cette formulation française claire et révérencielle conserve le titre κύριος et fait de « Dieu d’Israël » l’apposition naturelle du grec.
- source_word: κατευθῦναι
  choice: de diriger
  rationale: Le verbe peut signifier rendre droit, orienter ou guider. « Diriger » garde à la fois l’image du chemin et l’idée d’une conduite divine.
- source_word: τὴν ὁδὸν αὐτῆς
  choice: sa route
  rationale: « Sa route » peut désigner aussi bien le trajet concret que le cours de sa mission, maintenant ainsi la portée possible de ὁδός.
- source_word: εἰς ἀνάστημα
  choice: pour le relèvement
  rationale: Le substantif rare ἀνάστημα évoque une élévation ou un redressement. « Relèvement » convient au salut espéré d’Israël sans préciser indûment s’il s’agit de restauration, de délivrance ou d’exaltation.
- source_word: τῶν υἱῶν τοῦ λαοῦ αὐτοῦ
  choice: des fils de son peuple
  rationale: La traduction conserve explicitement υἱῶν et la relation génitive du texte grec, dans une expression française intelligible.
theological_decisions:
- issue: Traduction de κύριος dans une formule de prière juive
  choice: Seigneur
  alternative: Éternel
  rationale: Le grec porte κύριος, non le tétragramme hébreu directement attesté dans ce texte. « Seigneur » traduit donc la forme reçue sans rétroversion confessionnelle.
- issue: Portée de ἀνάστημα
  choice: relèvement
  alternative: exaltation
  rationale: Dans le contexte de la mission de Judith en faveur d’Israël, « relèvement » préserve l’idée fondamentale d’une remise debout ou d’une amélioration de condition, tout en laissant ouverte la nature exacte du résultat.
- issue: Langage masculin de υἱῶν
  choice: fils
  alternative: enfants
  rationale: Le texte grec emploie explicitement le masculin pluriel « fils ». Le conserver évite de neutraliser silencieusement la formulation source, même si l’expression peut désigner collectivement les membres du peuple.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase suit étroitement la syntaxe grecque tout en employant une ponctuation française naturelle. « Fut remontée » tient compte du déplacement raconté dans le contexte, tandis que « priait » conserve l’aspect duratif de l’imparfait.
