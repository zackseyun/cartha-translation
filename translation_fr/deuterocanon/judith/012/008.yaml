revisions:
- from: Et lorsqu’elle fut remontée, elle priait le Seigneur, Dieu d’Israël, de diriger sa route pour le relèvement des fils de son peuple.[a]
  to: Et lorsqu’elle remonta, elle priait le Seigneur, le Dieu d’Israël, de diriger sa route en vue du relèvement des fils de son peuple.[a]
  rationale: La révision remplace la forme passive ambiguë « fut remontée » par l’actif intransitif naturel « remonta », sans perdre l’allusion contextuelle au retour de Judith depuis la source. Elle conserve l’imparfait de prière, le titre divin, le chemin figuré ou concret, l’ambiguïté de ἀνάστημα et le terme explicite « fils ». La note est clarifiée sans imposer une interprétation théologique particulière.
