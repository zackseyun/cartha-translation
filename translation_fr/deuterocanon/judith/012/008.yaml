review_pass:
  verdict: revise
  source_fidelity: 'Le sens est globalement fidèle : ἀνέβη désigne le mouvement vers le haut dans le contexte, ἐδέετο est justement rendu par un imparfait de prière, et « relèvement » conserve utilement l’ambiguïté de ἀνάστημα. Toutefois, « fut remontée » est une tournure passive ambiguë : elle peut suggérer que Judith a été remontée par quelqu’un, alors que le grec a un verbe actif intransitif. « Remonta » restitue clairement le mouvement accompli par Judith elle-même.'
  naturalness: La phrase est claire et de registre approprié, mais « lorsqu’elle fut remontée » est peu naturel en français moderne dans ce sens. « Lorsqu’elle remonta » est idiomatique et narrativement précis. « Le Seigneur, le Dieu d’Israël » rend l’apposition de manière plus explicite et naturelle.
  terminology: « Seigneur » pour κύριος, « relèvement » pour ἀνάστημα et « fils de son peuple » pour υἱῶν τοῦ λαοῦ αὐτοῦ sont des choix recevables. La note doit formuler les alternatives comme des rendus du même groupe prépositionnel afin d’éviter de laisser croire que « restauration » remplacerait l’ensemble du syntagme incluant « des fils de son peuple ».
  issues:
  - severity: medium
    issue: « fut remontée » emploie une forme passive ambiguë pour ἀνέβη.
    rationale: Le grec décrit Judith comme sujet du déplacement (« elle remonta »), non comme bénéficiaire d’une action exercée par autrui. La correction évite une modification de l’agentivité et améliore le français moderne.
  - severity: low
    issue: La note présente les alternatives de manière syntaxiquement incomplète.
    rationale: « pour la restauration des fils de son peuple » est complet, mais « pour l’exaltation » ne l’est pas au même degré. Une formulation qui indique que les alternatives portent sur « relèvement » est plus nette.
  revised_text: Et lorsqu’elle remonta, elle priait le Seigneur, le Dieu d’Israël, de diriger sa route en vue du relèvement des fils de son peuple.[a]
