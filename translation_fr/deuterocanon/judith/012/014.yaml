  text: And Judith said to him[a], “And who am I to speak back to my lord? Whatever is pleasing in his eyes, I will quickly do, and this will be my joy until the day of my death.”
translation:
  language: fr
  text: 'Judith lui dit : « Et qui suis-je, moi, pour contredire[a] mon seigneur ? Tout ce qui sera agréable à ses yeux, je m’empresserai de le faire, et ce sera pour moi une joie jusqu’au jour de ma mort. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour m’opposer à mon seigneur » ou « pour répliquer à mon seigneur » .
    reason: Alternative lexicale pour ἀντειποῦσα, qui peut désigner le fait de contredire, de s’opposer ou de répondre contre quelqu’un.
lexical_decisions:
- source_word: ἀντειποῦσα
  choice: pour contredire
  rationale: Le participe exprime l’idée de répondre contre quelqu’un, de le contredire ou de s’opposer à sa parole. « Contredire » est naturel en français et conserve la déférence rhétorique de Judith sans transformer la formule en opposition formelle.
- source_word: τῷ κυρίῳ μου
  choice: mon seigneur
  rationale: Dans ce contexte, κύριος est un titre de respect adressé à Holopherne et non un titre divin. La minuscule évite toute confusion avec Dieu.
- source_word: πᾶν ὃ ἔσται ἐν τοῖς ὀφθαλμοῖς αὐτοῦ ἀρεστόν
  choice: Tout ce qui sera agréable à ses yeux
  rationale: Cette formulation préserve l’image grecque « à ses yeux » ainsi que la valeur future de ἔσται, tout en restant intelligible en français moderne.
- source_word: σπεύσασα
  choice: je m’empresserai de le faire
  rationale: Le verbe « s’empresser » rend à la fois la promptitude et l’empressement associés au participe grec, plus naturellement qu’un simple adverbe.
- source_word: ἀγαλλίαμα
  choice: une joie
  rationale: Le nom désigne une vive joie ou un sujet de réjouissance. « Une joie » est idiomatique et digne, tout en évitant la lourdeur de « exultation ».
- source_word: ἕως ἡμέρας θανάτου μου
  choice: jusqu’au jour de ma mort
  rationale: Traduction directe qui conserve la solennité de l’expression temporelle grecque.
theological_decisions:
- issue: Sens de κύριος dans une adresse non divine
  choice: mon seigneur
  alternative: mon maître
  rationale: Il s’agit ici d’un titre social honorifique adressé à Holopherne. « Mon seigneur » maintient le registre courtois du récit, tandis que la minuscule indique clairement que le terme ne désigne pas Dieu.
translation_notes:
  register: Français international moderne, fluide et digne. La syntaxe conserve le caractère rhétorique de la question et l’image biblique « agréable à ses yeux », sans archaïsmes inutiles.
