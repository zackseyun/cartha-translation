  text: And when she went in[a], she remained in the tent purified until she brought in her food toward evening.
translation:
  language: fr
  text: Et, en entrant, elle demeurait pure[a] dans la tente jusqu’à ce qu’elle apporte sa nourriture vers le soir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « propre » ou « rituellement pure ». L’adjectif grec peut désigner la pureté dans un sens général ou rituel.
    reason: alternative lexicale
lexical_decisions:
- source_word: εἰσπορευομένη
  choice: une fois rentrée
  rationale: Le participe présent est compris temporellement. Cette formulation française exprime naturellement son retour dans la tente, sans alourdir la phrase.
- source_word: καθαρά
  choice: pure
  rationale: L’adjectif grec peut désigner une pureté générale ou rituelle. « Pure » conserve cette amplitude sémantique sans rendre explicitement technique ce qui reste implicite.
- source_word: παρέμενεν
  choice: elle demeurait
  rationale: L’imparfait grec présente une action qui se prolonge, vraisemblablement dans une pratique répétée. L’imparfait français en rend bien l’aspect.
- source_word: τῇ σκηνῇ
  choice: dans la tente
  rationale: σκηνή désigne directement une tente dans ce contexte narratif.
- source_word: μέχρι οὗ
  choice: jusqu’au moment où
  rationale: La locution introduit la limite temporelle de son séjour dans la tente.
- source_word: προσηνέγκατο
  choice: elle prenait
  rationale: Le moyen de προσφέρω, avec la nourriture pour complément, peut exprimer le fait de prendre de la nourriture. En français, « prenait sa nourriture » convient mieux au contexte qu’une formulation évoquant une offrande; le sens matériel « apportait » reste grammaticalement envisageable.
- source_word: τὴν τροφὴν αὐτῆς
  choice: sa nourriture
  rationale: Cette expression rend directement le sens large de nourriture ou d’alimentation sans le restreindre à un repas précis.
- source_word: πρὸς ἑσπέραν
  choice: vers le soir
  rationale: πρός avec une indication temporelle marque ici l’approche du soir; « vers le soir » conserve cette nuance.
theological_decisions:
- issue: Faut-il expliciter une pureté rituelle pour καθαρά ?
  choice: Employer « pure » dans le texte et signaler en note la possible dimension rituelle.
  alternative: « rituellement pure » ou « en état de pureté »
  rationale: Le contexte suggère des préoccupations de pureté rituelle, mais l’adjectif grec ne les explicite pas à lui seul. La traduction maintient donc l’ambiguïté du texte.
- issue: Sens de προσηνέγκατο avec τὴν τροφήν
  choice: « elle prenait sa nourriture »
  alternative: « elle apportait sa nourriture »
  rationale: Avec la nourriture comme complément, la forme moyenne se comprend naturellement comme le fait de prendre ou consommer de la nourriture. Cette lecture évite aussi d’introduire sans nécessité une nuance sacrificielle.
translation_notes:
  register: Français international moderne, narratif et digne. L’imparfait rend la durée et le caractère habituel de l’action; « pure » maintient sans la résoudre la tension entre pureté générale et pureté rituelle.
