review_pass:
  verdict: revise
  source_fidelity: 'La traduction de εἰσπορευομένη par « une fois rentrée » ajoute l’idée d’un retour, absente du grec, qui dit simplement qu’elle entre. Surtout, « elle prenait sa nourriture » ne rend pas de façon sûre προσηνέγκατο, forme de προσφέρω : avec τὴν τροφὴν αὐτῆς, le sens de « apporter sa nourriture » est à conserver, sans le transformer en consommation. « Pure » maintient correctement l’ambiguïté entre pureté générale et rituelle.'
  naturalness: « En entrant, elle demeurait pure dans la tente » est naturel dans un registre narratif soutenu et moderne. « Jusqu’à ce qu’elle apporte sa nourriture vers le soir » rend clairement la limite temporelle et la nuance approximative de πρὸς ἑσπέραν.
  terminology: « Pure » est un choix sobre et non confessionnel pour καθαρά. La note conserve à juste titre la possibilité d’une connotation rituelle, sans l’imposer dans le texte.
  issues:
  - severity: medium
    issue: « une fois rentrée » ajoute l’idée de retour
    rationale: εἰσπορευομένη signifie « entrant / lorsqu’elle entrait »; le préfixe français « re- » introduit un mouvement de retour que le grec n’explicite pas.
  - severity: high
    issue: « elle prenait sa nourriture » interprète προσηνέγκατο comme une prise ou consommation
    rationale: προσηνέγκατο, de προσφέρω, appelle ici le sens matériel d’apporter/porter sa nourriture. Le grec ne dit pas explicitement qu’elle la prenait ou la mangeait.
  revised_text: Et, en entrant, elle demeurait pure[a] dans la tente jusqu’à ce qu’elle apporte sa nourriture vers le soir.
  revised_footnotes:
  - marker: a
    text: Ou « propre » ou « rituellement pure ». L’adjectif grec peut désigner la pureté dans un sens général ou rituel.
