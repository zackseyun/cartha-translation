  yaml_path: translation/deuterocanon/judith/012/020.yaml
  text: And Holofernes was delighted with her[a], and he drank a very great amount of wine—as much as he had never drunk in a single day since he was born.
translation:
  language: fr
  text: Holopherne se réjouit à cause d’elle[a] et but tant de vin qu’il n’en avait jamais bu autant en un seul jour depuis sa naissance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « par elle » : Judith était la source ou la cause de sa joie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠυφράνθη
  choice: éprouva une grande joie
  rationale: Le verbe exprime le fait de devenir joyeux ou d’être réjoui. Cette formulation française naturelle rend nettement la réaction d’Holopherne sans lui ajouter une nuance étrangère.
- source_word: ἀπʼ αὐτῆς
  choice: à cause d’elle
  rationale: 'Avec ἀπό, l’expression indique ici la source ou la cause de la joie : Judith en est l’occasion. Le français « à cause d’elle » conserve cette relation causale, tout en laissant la nature exacte de son influence ouverte.'
- source_word: ἔπιεν οἶνον πολὺν σφόδρα
  choice: but une très grande quantité de vin
  rationale: πολὺν σφόδρα souligne fortement l’excès de la quantité bue. La tournure choisie en garde l’intensité dans un français courant et digne.
- source_word: ὅσον οὐκ ἔπιεν πώποτε
  choice: autant qu’il n’en avait jamais bu
  rationale: ὅσον exprime l’étendue de la quantité, suivie d’une négation portant sur toute l’expérience passée. La traduction reste proche de cette construction comparative.
- source_word: ἐν ἡμέρᾳ μιᾷ
  choice: en un seul jour
  rationale: Cette expression temporelle met l’accent sur la quantité consommée dans l’espace d’une seule journée.
- source_word: ἀφʼ οὗ ἐγεννήθη
  choice: depuis sa naissance
  rationale: L’expression couvre toute la durée de sa vie jusque-là. « Depuis sa naissance » est concise, naturelle et fidèle.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le nom est rendu sous sa forme française courante « Holopherne ». L’intensité de la consommation de vin et le lien causal, sans précision excessive, entre Judith et la joie d’Holopherne sont préservés.
