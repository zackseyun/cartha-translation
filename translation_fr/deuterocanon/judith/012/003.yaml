  source_fidelity: 'Le sens général est bien rendu : l’épuisement de ce que Judith a apporté, la question sur la possibilité de lui fournir l’équivalent, et l’absence de quelqu’un de son peuple parmi les Assyriens. Toutefois, « trouver pour toi » affaiblit le mouvement de ἐξοίσομεν (« apporter/procurer »), et l’appel de note est placé sur « semblables », alors que la note explique δύναμιν, rendu par « provisions ».'
