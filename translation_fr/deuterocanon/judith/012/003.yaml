  text: And Holofernes said to her[a], “But if the things you have with you run out, from where shall we get for you provisions like them? For there is no one with us from your nation.”
translation:
  language: fr
  text: 'Holopherne lui dit : « Mais si ce que tu as avec toi vient à manquer, d’où pourrons-nous te procurer des provisions[a] semblables ? Car il n’y a parmi nous personne de ton peuple. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la nourriture » ou « des vivres ». Le grec emploie ici de façon inhabituelle le mot δύναμις, qui signifie normalement « force » ou « puissance » et semble désigner, dans ce contexte, des moyens de subsistance.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκλίπῃ
  choice: vient à manquer
  rationale: Le verbe exprime ici l’épuisement de ce que Judith a apporté. « Vient à manquer » est naturel en français et conserve la nuance éventuelle de la proposition.
- source_word: τὰ μετὰ σοῦ ὄντα
  choice: ce que tu as avec toi
  rationale: Cette formulation reste proche de l’expression grecque, volontairement générale, sans préciser prématurément qu’il s’agit de nourriture.
- source_word: ἐξοίσομεν
  choice: pourrons-nous trouver pour toi
  rationale: Le futur de ἐκφέρω signifie littéralement « apporterons-nous ». Dans ce contexte, la question porte sur la possibilité de procurer à Judith des ressources équivalentes ; « trouver pour toi » est idiomatique sans modifier le sens pratique.
- source_word: δύναμιν
  choice: des provisions
  rationale: Bien que δύναμις signifie habituellement « force » ou « puissance », le contexte des biens emportés par Judith indique ici, de façon inhabituelle, des moyens de subsistance ou des provisions.
- source_word: ὁμοίαν αὐτοῖς
  choice: semblables
  rationale: L’adjectif exprime une correspondance avec ce que Judith a apporté. Le pluriel français s’accorde naturellement avec « provisions », même si le grec présente un singulier collectif.
- source_word: ἐκ τοῦ ἔθνους σου
  choice: de ton peuple
  rationale: ἔθνος désigne ici le groupe ethnique auquel appartient Judith. « Ton peuple » est plus naturel en français biblique moderne que « ta nation » et convient au cadre ancien.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La phrase générale « ce que tu as avec toi » préserve l’imprécision du grec, tandis que la note signale le caractère exceptionnel de δύναμις. Le nom est rendu sous la forme française courante « Holopherne ».
