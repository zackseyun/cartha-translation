  text: The Persians shuddered at her boldness[a], and the Medes were shaken by her daring.
translation:
  language: fr
  text: Les Perses frémirent devant sa hardiesse[a], et les Mèdes furent ébranlés par son audace.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie deux termes proches : « hardiesse » (τόλμα) et « audace » (θράσος). La traduction les distingue afin de conserver le parallélisme sans répétition.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφριξαν
  choice: frémirent
  rationale: Le verbe φρίσσω évoque une réaction physique de peur, un frisson ou un tremblement. « Frémirent » conserve cette image vive sans expliciter davantage que le grec.
- source_word: Πέρσαι
  choice: les Perses
  rationale: Pluriel ethnique substantivé, rendu conformément à l’usage naturel du français.
- source_word: τὴν τόλμαν αὐτῆς
  choice: devant sa hardiesse
  rationale: τόλμα désigne une disposition à oser, entre courage, hardiesse et audace. « Hardiesse » préserve cette nuance sans imposer un jugement entièrement positif ou négatif; « devant » exprime naturellement la cause du frémissement.
- source_word: Μῆδοι
  choice: les Mèdes
  rationale: Pluriel ethnique substantivé, rendu directement en français.
- source_word: τὸ θράσος αὐτῆς
  choice: par son audace
  rationale: θράσος désigne une assurance hardie qui peut aller jusqu’à la témérité ou à l’insolence. « Audace » maintient cette ambiguïté et distingue le terme de τόλμα dans le parallèle.
- source_word: ἐρράχθησαν
  choice: furent ébranlés
  rationale: La forme passive exprime le fait d’être violemment atteint ou secoué. « Furent ébranlés » conserve la force de l’image et le parallélisme avec la réaction des Perses.
