  source_fidelity: La suite des menaces est bien rendue et conserve les référents possessifs de la voix qui chante. Une légère révision améliore la valeur prospective des infinitifs grecs après εἶπεν et rend plus exactement εἰς προνομὴν (« comme butin »), plutôt que « au pillage », formulation qui évoque plus spontanément le pillage d’un lieu.
  naturalness: Le français est globalement clair et moderne. « Il a dit qu’il mettrait… » est plus idiomatique et plus directement corrélé à εἶπεν suivi d’infinitifs que le plus-que-parfait suivi d’un discours direct. « Avec l’épée » est naturel tout en gardant l’instrumental.
  terminology: « Enfants encore au sein », « tout-petits » et « dépouiller » sont appropriés. « Jeunes filles vierges » conserve l’information portée par παρθένους, même si la formulation est volontairement explicite. La note maintient à juste titre l’ambiguïté de σκυλεῦσαι sans transformer le sens principal en une affirmation explicite de viol.
