  text: He said he would set my mountains on fire[a], and kill my young men with the sword, and throw my nursing children to the ground, and give my infants as plunder, and despoil my virgins.
translation:
  language: fr
  text: Il a dit qu’il mettrait le feu à mes montagnes, tuerait mes jeunes hommes avec l’épée, jetterait à terre mes enfants encore au sein, livrerait mes tout-petits comme butin et dépouillerait mes jeunes filles vierges[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon le contexte : « violer mes jeunes filles vierges ». Le verbe grec signifie plus littéralement « dépouiller » ou « déposséder », mais, dans ce contexte de violences de guerre, il peut impliquer une violence sexuelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν + infinitifs
  choice: 'Il avait dit : « Je… »'
  rationale: Le verbe introduit les intentions déclarées de l’ennemi. Le discours direct rend naturellement en français la série d’infinitifs grecs tout en conservant leur unité rhétorique; le plus-que-parfait convient au récit rétrospectif du chant.
- source_word: ἐμπρήσειν τὰ ὅρη μου
  choice: Je mettrai le feu à mes montagnes
  rationale: ἐμπρήσειν exprime l’action d’incendier, et ὅρη désigne littéralement les montagnes. Cette formulation garde l’image vive et la première personne du peuple personnifié.
- source_word: τοὺς νεανίσκους μου ἀνελεῖν ῥομφαίᾳ
  choice: je tuerai mes jeunes hommes par l’épée
  rationale: ἀνελεῖν signifie ici tuer; νεανίσκους désigne de jeunes hommes sans préciser qu’ils sont soldats. « Par l’épée » conserve l’instrument guerrier exprimé par ῥομφαίᾳ.
- source_word: τὰ θηλάζοντά μου θήσει εἰς ἔδαφος
  choice: je jetterai à terre mes enfants encore au sein
  rationale: Le participe désigne les enfants qui tètent. Dans cette succession de violences, « jeter à terre » exprime le mouvement hostile sans renforcer le grec jusqu’à « fracasser ».
- source_word: τὰ νήπιά μου δώσει εἰς προνομὴν
  choice: je livrerai mes tout-petits au pillage
  rationale: νήπια désigne de très jeunes enfants; « tout-petits » est actuel et naturel. προνομή renvoie au butin ou au pillage; cette tournure restitue le fait de traiter les enfants comme prise de guerre.
- source_word: τὰς παρθένους σκυλεῦσαι
  choice: je dépouillerai mes jeunes filles vierges
  rationale: παρθένους indique explicitement des vierges, tandis que σκυλεῦσαι signifie d’abord dépouiller, déposséder ou piller. Le choix principal reste lexicalement large, sans exclure la possible violence sexuelle suggérée par le contexte.
theological_decisions:
- issue: Faut-il rendre explicitement sexuelle la violence commise contre les παρθένους?
  choice: je dépouillerai mes jeunes filles vierges
  alternative: je violerai mes jeunes filles vierges
  rationale: σκυλεῦσαι désigne principalement le fait de dépouiller ou de piller et n’est pas, en lui-même, un verbe explicite de viol. Le contexte d’atrocités guerrières peut toutefois inclure une violence sexuelle; la note conserve cette possibilité sans l’imposer au texte principal.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme accumulatif de la menace est conservé par une suite de propositions coordonnées. « Enfants encore au sein » évite l’archaïsme de « nourrissons à la mamelle », et « jeunes filles vierges » maintient l’information explicite de παρθένους sans employer le substantif plus raide « vierges ».
