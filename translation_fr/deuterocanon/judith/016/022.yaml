- from: Beaucoup la désirèrent, mais aucun homme n’eut de relations avec elle[a] de toute sa vie, depuis le jour où son mari Manassé mourut et fut réuni aux siens[b].
  to: Beaucoup la désirèrent, mais aucun homme n’eut de relations avec elle[a] durant tout le reste de sa vie, à partir du jour où son mari Manassé mourut et fut réuni à son peuple[b].
  rationale: La révision clarifie la portée de « depuis le jour où » et rend plus exactement l’expression funéraire grecque, tout en conservant un français moderne et la discrétion de l’euphémisme d’origine. Les notes sont maintenues aux mêmes ancrages et la seconde est resserrée afin de ne pas interpréter l’idiome au-delà du texte.
