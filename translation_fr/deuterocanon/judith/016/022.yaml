base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/022.yaml
  text: And many desired her[a], but no man knew her all the days of her life[b], from the day when Manasseh her husband died and was added to his people.
translation:
  language: fr
  text: Beaucoup la désirèrent, mais aucun homme n’eut de relations avec elle[a] durant tout le reste de sa vie, à partir du jour où son mari Manassé mourut et fut réuni à son peuple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aucun homme ne la connut » ; le grec emploie un euphémisme pour parler de relations sexuelles.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « fut ajouté à son peuple » ; formule biblique pour parler de la mort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεθύμησαν
  choice: la désirèrent
  rationale: Le verbe exprime un désir fort, ici vraisemblablement conjugal ou sexuel. « Désirèrent » en conserve l’étendue sans imposer l’idée plus crue de convoitise.
- source_word: οὐκ ἔγνω ἀνὴρ αὐτήν
  choice: aucun homme n’eut de relations avec elle
  rationale: Le grec dit littéralement qu’aucun homme « ne la connut », euphémisme sexuel qui serait obscur ou trompeur en français moderne. La formulation choisie en restitue clairement le sens tout en restant digne.
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς αὐτῆς
  choice: de toute sa vie
  rationale: Expression française naturelle qui rend la totalité temporelle indiquée par le grec. Dans le contexte, elle vise la période commençant à la mort de Manassé.
- source_word: ἀφʼ ἧς ἡμέρας
  choice: depuis le jour où
  rationale: Cette tournure marque fidèlement le point de départ temporel de son veuvage.
- source_word: προσετέθη πρὸς τὸν λαὸν αὐτοῦ
  choice: fut réuni aux siens
  rationale: La formule conserve la dignité de l’idiome funéraire et son évocation d’une réunion avec le peuple ancestral, sans préciser davantage l’état après la mort.
- source_word: Μανασσῆς
  choice: Manassé
  rationale: Forme française biblique usuelle de ce nom.
theological_decisions:
- issue: Euphémisme sexuel dans οὐκ ἔγνω ἀνὴρ αὐτήν
  choice: Exprimer le sens par « n’eut de relations avec elle » et signaler la formulation littérale en note.
  alternative: « aucun homme ne la connut »
  rationale: Le calque « connaître une femme » n’est plus spontanément compris comme un euphémisme sexuel en français courant. La traduction explicite préserve le sens, tandis que la note conserve l’image et le registre du grec.
- issue: Idiome funéraire προσετέθη πρὸς τὸν λαὸν αὐτοῦ
  choice: « fut réuni aux siens »
  alternative: « fut ajouté à son peuple »
  rationale: Le calque « ajouté à son peuple » est peu naturel en français. « Réuni aux siens » maintient l’ambiguïté théologique de l’idiome sans développer une doctrine particulière de l’au-delà.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe solennelle du verset est conservée sans calques opaques. Les deux notes rendent visibles les idiomes grecs que le texte principal traduit de façon intelligible.
