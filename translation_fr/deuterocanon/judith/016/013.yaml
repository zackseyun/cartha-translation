  yaml_path: translation/deuterocanon/judith/016/013.yaml
  text: I will sing to my God a new hymn[a]. Lord, you are great and glorious, marvelous in strength[b], unsurpassable.
translation:
  language: fr
  text: Je chanterai à mon Dieu un hymne nouveau[a]. Seigneur, tu es grand et glorieux, admirable par ta puissance, sans égal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un chant nouveau ». Le grec emploie ὕμνος, terme qui désigne plus précisément un chant de louange.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « invincible ». Le grec signifie littéralement que Dieu ne peut être surpassé ou dépassé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμνήσω
  choice: Je chanterai
  rationale: Le futur de ὑμνέω exprime ici l’action de chanter à la louange de Dieu. « Je chanterai » est naturel en français, tandis que le complément « un hymne » conserve explicitement la dimension de louange.
- source_word: τῷ θεῷ μου
  choice: pour mon Dieu
  rationale: Le datif désigne celui en l’honneur de qui l’hymne est chanté. « Pour mon Dieu » rend cette relation plus naturellement que « à mon Dieu » dans cette construction française.
- source_word: ὕμνον καινόν
  choice: un hymne nouveau
  rationale: ὕμνος désigne plus précisément un chant de louange. « Hymne » en conserve la valeur propre, et l’ordre « hymne nouveau » convient au registre biblique sans être obscur.
- source_word: Κύριε
  choice: Seigneur
  rationale: Le vocatif κύριε est une adresse directe à Dieu. « Seigneur » en est l’équivalent français courant et digne.
- source_word: μέγας καὶ ἔνδοξος
  choice: grand et glorieux
  rationale: 'Cette formulation directe préserve les deux qualités coordonnées : la grandeur et la gloire.'
- source_word: θαυμαστὸς ἐν ἰσχύι
  choice: admirable par ta puissance
  rationale: θαυμαστός désigne ce qui suscite l’émerveillement, et ἐν ἰσχύι situe cette qualité dans la force ou la puissance divine. « Par ta puissance » produit une expression française naturelle sans effacer le lien avec ἰσχύς.
- source_word: ἀνυπέρβλητος
  choice: sans égal
  rationale: L’adjectif signifie que Dieu ne peut être surpassé ou dépassé. « Sans égal » restitue cette portée générale dans un français naturel, sans la réduire au seul sens militaire d’« invincible ».
theological_decisions:
- issue: Traduction de κύριος dans une adresse directe à Dieu
  choice: Seigneur
  alternative: Ô Seigneur
  rationale: Le grec emploie le vocatif Κύριε. Le français moderne n’exige pas l’interjection « ô » pour marquer l’adresse directe.
- issue: Portée de ἀνυπέρβλητος
  choice: sans égal
  alternative: invincible
  rationale: 'Le terme peut évoquer ce qui ne peut être vaincu, surtout après la mention de la puissance, mais son sens demeure plus large : ce qui ne peut être surpassé. « Sans égal » préserve cette amplitude.'
translation_notes:
  register: Français international moderne, au registre poétique et digne. La formulation reste proche de la structure grecque tout en évitant les tournures peu naturelles ; « sans égal » conserve la force finale de l’adjectif grec.
