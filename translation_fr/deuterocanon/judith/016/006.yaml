base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/006.yaml
  text: For their mighty one did not fall by the hands of young men[a], nor did sons of Titans strike him, nor did tall giants set upon him; but Judith daughter of Merari disabled him with the beauty of her face.
translation:
  language: fr
  text: Car le puissant parmi eux n’est pas tombé sous la main de jeunes hommes ; ni des fils de Titans ne l’ont frappé, ni des géants de haute taille ne se sont jetés sur lui. Mais Judith, fille de Merari, l’a réduit à l’impuissance[a] par la beauté de son visage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’a paralysé ». Le verbe grec peut désigner le fait de priver quelqu’un de ses moyens ou de le rendre impuissant, au sens propre ou figuré.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δυνατὸς αὐτῶν
  choice: le puissant parmi eux
  rationale: Le substantif δυνατός désigne ici l’homme puissant de leur camp. Cette formulation garde la valeur élevée du grec sans lui attribuer un titre militaire absent du texte.
- source_word: ὑπὸ νεανίσκων
  choice: sous la main de jeunes hommes
  rationale: La tournure exprime clairement l’agent de sa chute tout en conservant l’image traditionnelle et poétique de la main ; νεανίσκων désigne simplement de jeunes hommes.
- source_word: υἱοὶ Τιτάνων
  choice: des fils de Titans
  rationale: La traduction directe maintient l’évocation mythique et la force rhétorique de la comparaison.
- source_word: ἐπάταξαν αὐτόν
  choice: ne l’ont pas frappé
  rationale: Le verbe signifie frapper. La traduction évite d’ajouter explicitement l’idée de mise à mort ou de défaite.
- source_word: ὑψηλοὶ γίγαντες
  choice: des géants de haute stature
  rationale: ὑψηλοί évoque concrètement la hauteur. « De haute stature » est naturel en français et conserve cette image physique.
- source_word: ἐπέθεντο αὐτῷ
  choice: ne se sont pas jetés sur lui
  rationale: La tournure rend l’idée de fondre sur quelqu’un ou de l’attaquer, avec une couleur poétique adaptée au passage.
- source_word: παρέλυσεν αὐτόν
  choice: l’a réduit à l’impuissance
  rationale: Le verbe peut signifier paralyser, relâcher ou rendre impuissant. Ici, la formulation exprime que Judith l’a privé de ses moyens sans imposer une paralysie médicale littérale.
- source_word: ἐν κάλλει προσώπου αὐτῆς
  choice: par la beauté de son visage
  rationale: La traduction conserve l’image concrète du visage exprimée par πρόσωπον et rend naturellement la valeur instrumentale de ἐν.
- source_word: Ἰουδεὶθ θυγάτηρ Μεραρεί
  choice: Judith, fille de Merari
  rationale: Cette apposition généalogique est claire, naturelle et fidèle au grec.
theological_decisions:
- issue: Langage mythique de υἱοὶ Τιτάνων et γίγαντες
  choice: Conserver explicitement « fils de Titans » et « géants de haute stature ».
  alternative: Généraliser en « héros », « guerriers puissants » ou « hommes forts ».
  rationale: Le texte grec recourt délibérément à des figures mythiques ou surhumaines pour accentuer le contraste avec Judith. Une généralisation atténuerait cet effet.
- issue: Portée de παρέλυσεν
  choice: Traduire par « l’a réduit à l’impuissance » avec une note signalant « paralysé ».
  alternative: Traduire directement par « l’a paralysé » ou interpréter plus largement par « l’a anéanti ».
  rationale: Le contexte favorise l’idée qu’Holopherne a été privé de ses moyens. Le choix principal préserve cette portée figurée, tandis que la note maintient la possibilité lexicale plus littérale.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le rythme poétique repose sur les trois négations parallèles, puis sur le contraste introduit par « Mais Judith ». « Sous la main de » conserve une légère élévation biblique tout en restant compréhensible.
