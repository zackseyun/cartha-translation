base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/003.yaml
  text: Assyria came from the mountains out of the north[a]; he came with myriads of his forces, whose multitude blocked up the wadis[b], and their horses covered the hills.
translation:
  language: fr
  text: Assur est venu des montagnes, depuis le nord ; il est venu avec des myriades de ses troupes. Leur multitude a obstrué les lits des torrents[a], et leurs chevaux[b] ont couvert les collines.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les torrents saisonniers » ; le grec peut désigner les cours d’eau qui se gonflent pendant la saison des pluies ainsi que leur lit.
    reason: Précision lexicale et géographique.
  - marker: b
    text: 'Littéralement : « leur cheval » ; le singulier grec est vraisemblablement collectif.'
    reason: Le texte principal emploie un pluriel français naturel tout en signalant la forme du grec.
lexical_decisions:
- source_word: Ἀσσούρ
  choice: Assour
  rationale: Le nom grec est conservé comme désignation personnifiée de la puissance assyrienne, plutôt que remplacé par une explicitation comme « l’Assyrien ».
- source_word: ἐξ ὀρέων ἀπὸ βορρᾶ
  choice: des montagnes, depuis le nord
  rationale: 'Cette formulation garde perceptibles les deux indications grecques : la sortie hors des montagnes et la provenance septentrionale.'
- source_word: ἐν μυριάσι δυνάμεων αὐτοῦ
  choice: avec des myriades de ses troupes
  rationale: « Myriades » maintient l’ampleur hyperbolique et le registre poétique ; « troupes » exprime ici naturellement le sens militaire de δυνάμεις.
- source_word: χειμάρρους
  choice: les lits des torrents
  rationale: Le terme désigne des cours d’eau torrentiels, souvent saisonniers ; « lits des torrents » rend concrètement les passages que la foule de l’armée obstrue.
- source_word: ἐνέφραξεν
  choice: a obstrué
  rationale: Le verbe exprime l’idée de boucher ou de fermer un passage, image préservée sans l’affaiblir en simple remplissage.
- source_word: ἡ ἵππος αὐτῶν
  choice: leurs chevaux
  rationale: Le singulier grec peut avoir une valeur collective. Le pluriel français rend cette collectivité avec moins d’interprétation que « cavalerie ».
- source_word: βουνούς
  choice: les collines
  rationale: « Collines » maintient la distinction avec ὄρη, les « montagnes » du début du verset.
theological_decisions:
- issue: Personnification d’Assour et alternance entre référents singulier et pluriel
  choice: Conserver Assour comme sujet singulier, puis employer le pluriel pour ses troupes et leurs chevaux.
  alternative: Uniformiser tout le verset au singulier ou au pluriel, ou rendre Ἀσσούρ par « l’Assyrien ».
  rationale: Le grec personnifie la puissance assyrienne tout en évoquant les éléments nombreux de son armée. La traduction conserve cette tension poétique sans l’harmoniser.
translation_notes:
  register: Français international actuel, soutenu mais accessible. La répétition « est venu » et le terme « myriades » préservent le rythme solennel du chant ; le passé composé reste naturel en français moderne.
