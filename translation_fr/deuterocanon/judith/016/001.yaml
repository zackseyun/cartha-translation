    issue: « Entonnez » est employé sans complément d’objet explicite.
    rationale: En français actuel, le verbe est normalement transitif. L’ajout de « un chant », implicitement requis par le contexte musical et admis dans la piste anglaise, rend la phrase idiomatique sans modifier le sens.
  - severity: medium
    issue: « Composez » traduit ἐναρμόσασθε de manière trop spécifique.
    rationale: Le grec peut désigner l’ajustement, l’arrangement ou l’harmonisation musicale, pas nécessairement l’acte de composer un texte ou une œuvre. « Mettez en musique » restitue plus largement cette image.
