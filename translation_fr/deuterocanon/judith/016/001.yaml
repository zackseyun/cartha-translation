base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/001.yaml
  text: Begin the song to my God with tambourines[a]; sing to the Lord with cymbals; fit to him a psalm and praise[b]; exalt and call upon his name.
translation:
  language: fr
  text: Entonnez un chant pour mon Dieu, au son des tambourins[a] ; chantez pour le Seigneur, au son des cymbales ; mettez en musique pour lui un psaume et une louange[b] ; exaltez et invoquez son nom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Donnez le signal pour mon Dieu avec les tambourins. » Le verbe grec est un commandement musical qui signifie commencer ou conduire le chant.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « chantez pour lui en harmonie un psaume et une louange ». Le verbe grec peut évoquer l’action d’ajuster, d’arranger ou d’harmoniser musicalement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξάρχετε
  choice: Entonnez
  rationale: L’impératif pluriel de ἐξάρχω désigne ici l’action de commencer ou de conduire un chant. « Entonnez » exprime naturellement cette commande musicale sans ajouter un objet absent du grec.
- source_word: τῷ θεῷ μου
  choice: pour mon Dieu
  rationale: Le datif indique ici le destinataire ou le bénéficiaire de l’exécution musicale ; « pour mon Dieu » est naturel en français et conserve le possessif personnel.
- source_word: ἐν τυμπάνοις
  choice: au son des tambourins
  rationale: τύμπανον désigne un tambour sur cadre, proche du tambourin. « Au son de » rend clairement la valeur instrumentale de ἐν en français courant.
- source_word: ᾄσατε
  choice: chantez
  rationale: Rend directement l’impératif, sans ajouter « louez », puisque la louange est explicitement mentionnée ensuite.
- source_word: τῷ κυρίῳ
  choice: pour le Seigneur
  rationale: Dans ce contexte musical, le datif désigne celui à qui le chant est adressé. « Seigneur » est la traduction biblique usuelle de κύριος.
- source_word: ἐν κυμβάλοις
  choice: au son des cymbales
  rationale: Rend la valeur instrumentale de l’expression dans un français naturel.
- source_word: ἐναρμόσασθε
  choice: composez pour lui
  rationale: Le verbe évoque l’action d’ajuster, de mettre en forme ou d’arranger musicalement. « Composez » est idiomatique avec « un psaume et une louange » tout en conservant l’idée de mise en forme musicale.
- source_word: ψαλμὸν καὶ αἶνον
  choice: un psaume et une louange
  rationale: « Psaume » conserve la portée musicale et liturgique de ψαλμός ; « louange » rend directement αἶνος sans le transformer en « hymne ».
- source_word: ὑψοῦτε
  choice: exaltez
  rationale: Dans le langage de l’adoration, le verbe appelle à proclamer la grandeur de Dieu ; « exaltez » est précis et dignifié.
- source_word: ἐπικαλεῖσθε τὸ ὄνομα αὐτοῦ
  choice: invoquez son nom
  rationale: Expression française biblique naturelle qui conserve la nuance religieuse d’appel et d’invocation.
theological_decisions:
- issue: Traduction de κύριος
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » convient au contexte d’adoration et correspond à l’usage biblique établi, sans introduire une nuance de domination étrangère au passage.
- issue: Sens de ἐναρμόσασθε
  choice: composez pour lui
  alternative: chantez pour lui en harmonie
  rationale: Le verbe permet une lecture liée à l’harmonisation, mais son objet direct, « un psaume et une louange », favorise ici l’idée d’arranger ou de mettre en forme une composition. La note maintient l’autre possibilité.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le rythme en quatre impératifs est conservé. « Entonnez » et « composez » maintiennent le cadre musical sans lourdeur archaïque ; les variantes authentiques sont signalées en notes.
