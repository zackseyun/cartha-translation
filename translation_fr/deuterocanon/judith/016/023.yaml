revisions:
- from: Sa renommée ne cessa de grandir[a]. Elle vieillit dans la maison de son mari jusqu’à l’âge de cent cinq ans, et elle rendit la liberté à sa servante[b]. Elle mourut à Béthulie, et on l’ensevelit dans la grotte de son mari Manassé.
  to: Elle continua à prendre une très grande importance[a] et vieillit dans la maison de son mari pendant cent cinq ans. Elle rendit la liberté à sa servante[b]. Elle mourut à Béthulie, et on l’ensevelit dans la grotte de son mari Manassé.
  rationale: La révision supprime l’ajout interprétatif « renommée » afin de préserver l’ambiguïté lexicale de προβαίνουσα μεγάλη σφόδρα. Elle corrige aussi « jusqu’à l’âge de cent cinq ans » en « pendant cent cinq ans », conformément à l’accusatif de durée grec. La segmentation des phrases, les noms propres et le vocabulaire funéraire sont conservés.
