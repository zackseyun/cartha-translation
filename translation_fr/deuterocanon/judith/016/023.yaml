  text: And she continued to prosper greatly[a], and she grew old in her husband's house for one hundred five years, and she set her maidservant free. Then she died in Bethulia[b], and they buried her in the cave of her husband Manasseh.
translation:
  language: fr
  text: Elle continua à prendre une très grande importance[a] et vieillit dans la maison de son mari pendant cent cinq ans. Elle rendit la liberté à sa servante[b]. Elle mourut à Béthulie, et on l’ensevelit dans la grotte de son mari Manassé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement qu’elle « avançait » ou « devenait grande », avec une forte intensification. Il ne précise pas en quoi consistait cette grandeur.
    reason: lexical_alternative
  - marker: b
    text: Le mot grec désigne une femme au service personnel. L’expression « rendit la liberté » indique ici qu’elle n’était pas libre.
    reason: lexical_alternative
lexical_decisions:
- source_word: προβαίνουσα μεγάλη σφόδρα
  choice: Sa renommée ne cessa de grandir
  rationale: Le grec décrit littéralement Judith comme « avançant » et devenant « extrêmement grande ». Dans ce contexte, la formulation française exprime naturellement l’accroissement continu de son importance ou de sa renommée, tandis qu’une note conserve l’image et l’ambiguïté du grec.
- source_word: ἐγήρασεν ... ἔτη ἑκατὸν πέντε
  choice: Elle vieillit ... jusqu’à l’âge de cent cinq ans
  rationale: La construction indique ici l’âge atteint par Judith. Cette formulation évite de laisser entendre qu’elle aurait passé cent cinq années dans la maison de son mari.
- source_word: ἐν τῷ οἴκῳ τοῦ ἀνδρὸς αὐτῆς
  choice: dans la maison de son mari
  rationale: Traduction directe et naturelle du complément de lieu, sans élargir explicitement « maison » au sens de maisonnée.
- source_word: ἀφῆκεν τὴν ἅβραν αὐτῆς ἐλευθέραν
  choice: elle rendit la liberté à sa servante
  rationale: ἅβρα désigne une femme attachée au service personnel; l’adjectif ἐλευθέραν avec ἀφῆκεν exprime clairement un affranchissement. « Rendit la liberté » restitue cette portée sans employer dans le texte principal un terme plus précis que le nom grec.
- source_word: εἰς Βαιτυλουὰ
  choice: à Béthulie
  rationale: Après le verbe « mourir », εἰς a ici une valeur locale idiomatique. « À Béthulie » est la tournure française naturelle.
- source_word: ἐν τῷ σπηλαίῳ
  choice: dans la grotte
  rationale: σπήλαιον signifie littéralement « grotte »; le contexte d’ensevelissement suffit à indiquer sa fonction funéraire.
theological_decisions:
- issue: Statut social de la servante de Judith
  choice: « servante » dans le texte, avec l’acte d’affranchissement formulé explicitement
  alternative: « esclave » ou « femme esclave »
  rationale: Le nom ἅβρα met l’accent sur la fonction de servante plutôt que d’employer le terme grec ordinaire pour « esclave ». Toutefois, l’expression « rendre la liberté » montre qu’il s’agit bien d’une personne de condition non libre; la note rend cette implication explicite sans durcir indûment le nom lui-même.
- issue: Nature de la grandeur croissante de Judith
  choice: « Sa renommée ne cessa de grandir », avec note sur le sens littéral
  alternative: « Elle devint extrêmement importante » ou « elle continua de prospérer grandement »
  rationale: Le grec ne nomme pas explicitement la renommée, la prospérité ou l’honneur. Le texte principal adopte une expression française cohérente avec la place publique de Judith dans le récit, tandis que la note signale l’indétermination de la formulation grecque.
translation_notes:
  register: Français international actuel, digne et fluide. Les phrases ont été légèrement segmentées pour éviter une accumulation de coordinations. « Ensevelit » maintient le registre narratif funéraire; « grotte » conserve l’image concrète du grec. Le marqueur [b] est placé après « servante », conformément au contenu de la note.
