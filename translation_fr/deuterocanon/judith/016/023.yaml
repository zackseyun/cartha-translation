    rationale: « devenant extrêmement grande » n’est pas la forme exacte du grec, et l’évocation de la renommée risque de renforcer l’ajout du texte. Une note plus neutre signale l’alternative lexicale sans imposer un domaine.
  revised_text: Elle continua à prendre une très grande importance[a] et vieillit dans la maison de son mari pendant cent cinq ans. Elle rendit la liberté à sa servante[b]. Elle mourut à Béthulie, et on l’ensevelit dans la grotte de son mari Manassé.
