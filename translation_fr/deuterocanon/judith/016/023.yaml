review_pass:
  verdict: revise
  source_fidelity: 'La formulation « Sa renommée ne cessa de grandir » introduit explicitement la renommée, alors que προβαίνουσα μεγάλη σφόδρα décrit Judith comme continuant à devenir/très grande sans préciser en quoi consiste cette grandeur. De plus, ἔτη ἑκατὸν πέντε est un accusatif de durée rattaché à « elle vieillit dans la maison de son mari » : « jusqu’à l’âge de » transforme cette durée en âge atteint. Le reste rend correctement la libération de l’ἅβρα, le lieu de décès et la sépulture dans la grotte de Manassé.'
  naturalness: Le français du projet est généralement fluide et d’un registre narratif approprié. « Elle continua à prendre une très grande importance » est plus naturel qu’un calque de « devenir grande », tout en évitant de réduire le sens à la seule renommée. « Pendant cent cinq ans » reflète avec naturel la durée grecque.
  terminology: « Servante » est défendable pour ἅβρα, et « rendit la liberté » communique correctement ἀφῆκεν ... ἐλευθέραν. La note doit toutefois décrire sobrement le terme et l’implication contextuelle, sans prétendre que le grec nomme directement une catégorie juridique précise. « Béthulie », « Manassé », « grotte » et « ensevelit » conviennent.
  issues:
  - severity: medium
    issue: « Sa renommée ne cessa de grandir » spécifie indûment la nature de la grandeur.
    rationale: Le grec ne mentionne ni renommée ni honneur; il affirme seulement, avec forte intensification, que Judith continuait à devenir grande/importante. La note reconnaît elle-même cette indétermination, que le texte principal devrait préserver.
  - severity: high
    issue: « jusqu’à l’âge de cent cinq ans » ne respecte pas la construction de durée.
    rationale: ἔτη ἑκατὸν πέντε est un accusatif temporel de durée (« pendant cent cinq ans »), non une expression explicite de l’âge atteint. La révision conserve donc le lien de cette durée avec son vieillissement dans la maison de son mari.
  - severity: low
