  text: Then my lowly ones shouted[a], and my weak ones were afraid and panicked; they raised their voice[b], and they were overthrown.
translation:
  language: fr
  text: Alors mes humbles poussèrent des cris[a] ; mes faibles prirent peur et furent saisis d’effroi ; ils élevèrent la voix et furent renversés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « poussèrent un cri de guerre » ; le verbe grec peut désigner un cri puissant à valeur guerrière dans ce contexte.
    reason: lexical_alternative
  - marker: b
    text: 'Le dernier membre de phrase est ambigu dans cette formulation grecque : il peut encore désigner les « humbles » et les « faibles » de Judith, ou sous-entendre que leurs adversaires furent renversés.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἠλάλαξαν
  choice: poussèrent des cris
  rationale: Le verbe désigne un cri puissant et peut, en contexte guerrier, évoquer un cri de guerre. Cette formulation française conserve sa force sans imposer cette nuance.
- source_word: οἱ ταπεινοί μου
  choice: mes humbles
  rationale: ταπεινοί peut désigner des personnes humbles, abaissées ou de condition modeste. « Mes humbles » reste concis, conserve le possessif et évite de réduire le terme à une seule situation sociale.
- source_word: οἱ ἀσθενοῦντές μου
  choice: mes faibles
  rationale: Le participe substantivé désigne ceux qui manquent de force. « Mes faibles » conserve le parallèle avec « mes humbles » sans lui donner un sens médical.
- source_word: ἐφοβήθησαν
  choice: prirent peur
  rationale: Cette expression naturelle rend l’entrée dans la peur exprimée par l’aoriste.
- source_word: ἐπτοήθησαν
  choice: furent saisis d’effroi
  rationale: Le verbe marque une alarme ou une terreur plus intense que la simple peur, ce qui maintient la progression du grec.
- source_word: ὕψωσαν τὴν φωνὴν αὐτῶν
  choice: ils élevèrent la voix
  rationale: La formule reprend naturellement en français l’expression grecque, dont « la voix » est au singulier collectif.
- source_word: ἀνετράπησαν
  choice: furent renversés
  rationale: Le passif peut évoquer le fait d’être jeté à terre, défait ou ruiné. « Furent renversés » en conserve l’image et ne précise pas indûment la nature de la défaite.
theological_decisions:
- issue: Référent du dernier verbe passif ἀνετράπησαν
  choice: Le sujet demeure exprimé par le pronom « ils », sans ajout explicatif.
  alternative: Comprendre que ce sont implicitement leurs adversaires qui furent renversés.
  rationale: La suite grecque semble grammaticalement reprendre les groupes précédents, mais sa formulation condensée peut aussi laisser entendre un changement implicite de référent vers leurs adversaires. La traduction ne résout pas cette tension en ajoutant « leurs ennemis ».
translation_notes:
  register: Français international actuel, digne et accessible. Le parallélisme des groupes possessifs et la montée de la peur vers l’effroi sont préservés ; la formulation finale conserve l’ambiguïté du texte grec.
