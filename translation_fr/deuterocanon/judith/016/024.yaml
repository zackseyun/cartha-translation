  text: And the house of Israel mourned for her seven days. And before she died, she divided her possessions among all who were nearest of kin to Manasseh her husband and to those nearest of kin of her family.
translation:
  language: fr
  text: La maison d’Israël la pleura pendant sept jours. Avant sa mort, elle répartit ses biens entre tous les proches parents de Manassé, son mari, et tous les proches parents de sa famille.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « entre tous ses plus proches parents du côté de Manassé, son mari, et les plus proches parents de sa famille ». La formulation grecque est concise, et le regroupement exact des parents peut être exprimé de plusieurs manières.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπένθησεν αὐτήν
  choice: la pleura
  rationale: Le verbe désigne ici le deuil observé pour une personne décédée. « La pleura » est naturel, digne et conserve le complément personnel du grec.
- source_word: οἶκος Ἰσραήλ
  choice: la maison d’Israël
  rationale: Cette traduction préserve l’expression collective biblique du grec, qui désigne le peuple d’Israël.
- source_word: ἡμέρας ἑπτά
  choice: pendant sept jours
  rationale: La préposition française explicite idiomatiquement la durée exprimée par l’accusatif grec.
- source_word: διεῖλεν
  choice: répartit
  rationale: Dans le contexte d’une transmission de biens, « répartit » exprime clairement l’idée de diviser et distribuer sans ajouter de précision juridique absente du texte.
- source_word: τὰ ὑπάρχοντα αὐτῆς
  choice: ses biens
  rationale: L’expression désigne ce qui lui appartenait. « Ses biens » est courant, large et adapté au contexte patrimonial.
- source_word: πρὸ τοῦ ἀποθανεῖν αὐτήν
  choice: avant de mourir
  rationale: Cette tournure rend naturellement en français l’infinitif articulé introduit par πρό et son rapport temporel.
- source_word: πᾶσι τοῖς ἔγγιστα
  choice: tous les parents les plus proches
  rationale: L’adverbe superlatif employé substantivement renvoie aux personnes les plus proches, vraisemblablement par parenté dans ce contexte de partage des biens.
- source_word: Μανασσῆ τοῦ ἀνδρὸς αὐτῆς
  choice: de Manassé, son mari
  rationale: La mise en apposition identifie clairement Manassé comme le mari de Judith tout en suivant de près l’ordre grec.
- source_word: τοῦ γένους αὐτῆς
  choice: de sa propre famille
  rationale: γένος peut désigner la famille, la parenté ou la lignée. « Sa propre famille » est accessible et marque ici le contraste avec les parents de son mari.
