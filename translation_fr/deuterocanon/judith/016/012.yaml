  source_fidelity: La première proposition rend fidèlement l’image frappante de υἱοὶ κορασίων et les verbes de violence. En revanche, « sous les rangs de bataille » n’est pas justifié par ἐκ (« de, hors de, à partir de ») et introduit une image absente du grec. « Devant la ligne de bataille » adopte la compréhension contextuelle également retenue dans la piste d’audit anglaise, tandis que la note conserve les possibilités plus proches de la préposition grecque.
  naturalness: « Les fils de jeunes filles » est un peu insolite, comme le grec, mais reste clair et convient au style poétique. « Ligne de bataille » est plus idiomatique et précis que « rangs de bataille » dans ce contexte. La phrase demeure fluide en français moderne.
  terminology: « Seigneur » rend correctement κύριος, avec maintien de « mon ». « Enfants de déserteurs » rend littéralement παῖδας αὐτομολούντων. La note ne doit pas proposer « des garçons qui désertaient », lecture grammaticalement incompatible avec le génitif αὐτομολούντων.
