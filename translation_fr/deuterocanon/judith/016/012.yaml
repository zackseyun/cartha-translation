base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/012.yaml
  text: The sons of maidens pierced them through[a], and wounded them like the children of deserters[b]; they perished before the battle line of my Lord.
translation:
  language: fr
  text: Les fils de jeunes filles les transpercèrent et les blessèrent comme des enfants de déserteurs[a] ; ils périrent devant la ligne de bataille de mon Seigneur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque est difficile, surtout par l’image qu’elle emploie. On peut aussi traduire « comme des enfants de fugitifs » ou « comme les enfants de ceux qui avaient déserté ».
    reason: ambiguïté sémantique et lexicale de παῖδας αὐτομολούντων
  - marker: b
    text: Le grec dit littéralement « de/hors de la ligne de bataille de mon Seigneur ». La valeur de ἐκ est difficile ; on peut aussi comprendre « ils périrent loin de la formation de combat de mon Seigneur ».
    reason: sens incertain de ἐκ avec παράταξις
lexical_decisions:
- source_word: υἱοὶ κορασίων
  choice: Des fils de jeunes filles
  rationale: Rend explicitement la relation filiale et conserve l’image grecque frappante. « Jeunes filles » est plus courant en français moderne que « jeunes femmes » et moins marqué stylistiquement que « vierges », sens que le grec n’impose pas.
- source_word: κατεκέντησαν
  choice: les transpercèrent
  rationale: Le composé exprime un coup pénétrant ; « transpercèrent » en restitue naturellement la force.
- source_word: ὡς παῖδας αὐτομολούντων
  choice: comme des enfants de déserteurs
  rationale: παῖδας est pris au sens d’« enfants » et le participe substantivé αὐτομολούντων au sens militaire de « déserteurs ». La construction demeure inhabituelle en grec et son image exacte reste incertaine.
- source_word: ἐτίτρωσκον
  choice: les blessèrent
  rationale: Rend simplement l’action répétée ou prolongée suggérée par l’imparfait, sans alourdir la phrase française.
- source_word: ἀπώλοντο
  choice: ils périrent
  rationale: Préserve le résultat exprimé par le verbe sans préciser davantage l’agent ou le mode de leur mort.
- source_word: ἐκ παρατάξεως
  choice: sous les rangs de bataille
  rationale: παράταξις désigne une formation ou des rangs de bataille. Avec ἐκ, « sous » peut exprimer la source de la destruction, c’est-à-dire sous l’action de cette formation, tout en évitant le peu naturel « depuis les rangs ».
- source_word: κυρίου μου
  choice: de mon Seigneur
  rationale: Conserve le possessif explicite et rend κύριος par « Seigneur » dans ce cantique adressé au Dieu souverain.
theological_decisions:
- issue: Référent et traduction de κύριος
  choice: mon Seigneur
  alternative: mon maître
  rationale: Dans le contexte hymnique, le référent est Dieu. « Mon Seigneur » conserve la portée dévotionnelle du titre sans ajouter « Dieu », absent de ce verset.
- issue: Rapport exprimé par ἐκ παρατάξεως κυρίου μου
  choice: ils périrent sous les rangs de bataille de mon Seigneur
  alternative: ils périrent loin des rangs de bataille de mon Seigneur
  rationale: 'La préposition ἐκ est difficile ici : elle peut marquer la source, l’origine ou la séparation. Le texte principal retient une lecture causale naturelle en français, tandis que la note préserve la lecture plus formelle de séparation.'
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve les images singulières du grec et signale en notes les deux difficultés majeures, sans les harmoniser ni leur imposer une interprétation confessionnelle.
