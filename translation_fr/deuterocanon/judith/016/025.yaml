  yaml_path: translation/deuterocanon/judith/016/025.yaml
  text: And there was no longer anyone to terrify the sons of Israel in the days of Judith, and for many days after she died. Amen.
translation:
  language: fr
  text: Et il n’y eut plus personne pour terroriser les fils d’Israël du vivant de Judith, ni pendant de nombreux jours après sa mort. Amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἐκφοβῶν
  choice: personne pour terroriser
  rationale: La construction substantivée désigne quiconque inspirerait une vive terreur; « terroriser » conserve la force du verbe grec.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: les fils d’Israël
  rationale: Rendu formel de l’expression grecque traditionnelle désignant le peuple d’Israël.
- source_word: ἐν ταῖς ἡμέραις Ἰουδείθ
  choice: du vivant de Judith
  rationale: Expression française naturelle qui transmet ici le sens temporel « aux jours de Judith », c’est-à-dire durant sa vie.
- source_word: μετὰ τὸ ἀποθανεῖν αὐτὴν ἡμέρας πολλάς
  choice: pendant de nombreux jours après sa mort
  rationale: Rend clairement la durée prolongée postérieure au décès de Judith, sans préciser davantage ce que le grec laisse indéterminé.
- source_word: ἀμήν
  choice: Amen
  rationale: Translittération française traditionnelle de la conclusion liturgique.
