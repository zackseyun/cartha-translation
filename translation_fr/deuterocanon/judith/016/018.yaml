  text: And when they came to Jerusalem, they worshiped God; and when the people had been purified, they offered up their burnt offerings and their freewill offerings and their gifts.
translation:
  language: fr
  text: Lorsqu’ils arrivèrent à Jérusalem, ils adorèrent Dieu. Quand le peuple eut été purifié, ils offrirent leurs holocaustes, leurs offrandes volontaires et leurs dons.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡς δὲ ἦλθον
  choice: Lorsqu’ils arrivèrent
  rationale: La locution introduit la progression du récit sans marquer ici une opposition nette. « Lorsqu’ils arrivèrent » est naturel en français et conserve la relation temporelle.
- source_word: προσεκύνησαν τῷ θεῷ
  choice: ils adorèrent Dieu
  rationale: Dans ce contexte cultuel, le verbe désigne l’hommage religieux rendu à Dieu. « Adorèrent » exprime naturellement cette adoration sans réduire le sens au seul geste de se prosterner.
- source_word: ἡνίκα
  choice: Quand
  rationale: Cette conjonction temporelle introduit simplement l’action qui précède les sacrifices.
- source_word: ἐκαθαρίσθη ὁ λαός
  choice: le peuple eut été purifié
  rationale: Le passif est conservé, et le passé antérieur indique que la purification a été accomplie avant l’offrande des sacrifices. Le contexte cultuel favorise « purifié ».
- source_word: ἀνήνεγκαν
  choice: ils offrirent
  rationale: Dans le contexte sacrificiel, ἀναφέρω signifie présenter une offrande à Dieu. « Offrirent » est l’équivalent français naturel et précis.
- source_word: τὰ ὁλοκαυτώματα αὐτῶν
  choice: leurs holocaustes
  rationale: « Holocaustes » est le terme sacrificiel traditionnel et exact pour des offrandes entièrement consumées.
- source_word: τὰ ἑκούσια αὐτῶν
  choice: leurs offrandes volontaires
  rationale: Le substantif neutre désigne des offrandes faites librement. Cette formulation explicite leur caractère volontaire tout en restant idiomatique.
- source_word: τὰ δόματα
  choice: leurs dons
  rationale: « Dons » préserve la distinction lexicale avec les holocaustes et les offrandes volontaires qui précèdent.
theological_decisions:
- issue: Nature de la purification dans ἐκαθαρίσθη ὁ λαός
  choice: Une purification rituelle du peuple avant les sacrifices
  alternative: Une purification morale générale du peuple
  rationale: L’adoration à Jérusalem et l’énumération immédiate des holocaustes, offrandes volontaires et dons orientent vers une purification cultuelle. La traduction garde toutefois le terme général « purifié » sans ajouter une précision absente du grec.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste claire pour un large lectorat, tandis que le vocabulaire cultuel précis (« purifié », « holocaustes », « offrandes volontaires ») est conservé.
