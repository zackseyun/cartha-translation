  yaml_path: translation/deuterocanon/judith/016/014.yaml
  text: Let all your creation serve you; for you spoke[a], and they came to be; you sent out your Spirit, and it formed them; and there is no one who will resist your voice.
translation:
  language: fr
  text: Que toute ta création te serve ! Car tu as parlé, et toutes choses sont venues à l’existence ; tu as envoyé ton Esprit[a], et il leur a donné forme. Nul ne résistera à ta voix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton souffle » ou « ton vent ». Dans un contexte de création, le mot grec peut avoir ces trois sens.
    reason: lexical_alternative
lexical_decisions:
- source_word: δουλευσάτω
  choice: serve
  rationale: Le verbe exprime le service et la soumission. « Serve » est naturel dans cette adresse poétique et convient aussi à la création non personnelle.
- source_word: πᾶσα ἡ κτίσις σου
  choice: toute ta création
  rationale: Le singulier avec πᾶσα présente la création comme un ensemble. Cette formulation conserve la portée collective du grec.
- source_word: εἶπας
  choice: tu as parlé
  rationale: Cette traduction garde l’image de la parole créatrice et le registre élevé du cantique.
- source_word: ἐγενήθησαν
  choice: les créatures sont venues à l’existence
  rationale: Le pluriel grec renvoie aux réalités créées. La répétition explicite de « les créatures » permet de rendre ce pluriel clairement en français après le collectif singulier « toute ta création ».
- source_word: ἀπέστειλας
  choice: tu as envoyé
  rationale: « Envoyer » rend sobrement l’action de dépêcher sans alourdir le français par une particule directionnelle superflue.
- source_word: τὸ πνεῦμά σου
  choice: ton Esprit
  rationale: Dans ce contexte de création, πνεῦμα peut désigner l’Esprit, le souffle ou le vent. « Esprit » convient au rôle d’agent créateur, tandis que la note maintient les autres sens possibles.
- source_word: ᾠκοδόμησεν
  choice: il leur a donné forme
  rationale: Le verbe signifie littéralement construire ou édifier. Dans ce contexte cosmogonique, « donner forme » exprime l’action constructive et ordonnatrice sans employer « édifier », qui évoquerait surtout en français moderne la croissance morale ou spirituelle.
- source_word: ἀντιστήσεται
  choice: ne résistera
  rationale: Le futur français correspond au futur grec et « résister » rend directement l’idée de se dresser contre.
- source_word: τῇ φωνῇ σου
  choice: à ta voix
  rationale: La traduction littérale « voix » maintient le lien poétique avec la parole créatrice, sans réduire celle-ci à un simple commandement.
theological_decisions:
- issue: Sens de πνεῦμα dans le contexte de la création
  choice: ton Esprit
  alternative: ton souffle ; ton vent
  rationale: Le terme grec réunit les notions d’esprit, de souffle et de vent. Le texte principal retient le sens personnel et théologiquement saillant d’« Esprit », mais la note préserve la polysémie réelle du grec.
- issue: Action exprimée par ᾠκοδόμησεν
  choice: il leur a donné forme
  alternative: il les a édifiées ; il les a établies
  rationale: Le contexte attribue au πνεῦμα divin une activité de construction ou d’organisation de la création. « Donné forme » conserve cette agence sans préciser davantage le mode de création.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement correspond à l’adresse directe à Dieu. La reprise « les créatures » clarifie le passage du collectif singulier grec au verbe pluriel. Le marqueur [a] est placé après « Esprit », terme auquel la note se rapporte.
