  text: The Lord Almighty nullified them by the hand of a woman[a].
translation:
  language: fr
  text: Le Seigneur tout-puissant les a réduits à néant par la main d’une femme[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par l’intermédiaire d’une femme ». L’expression grecque « par la main de » indique l’agent ou le moyen.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριος
  choice: Seigneur
  rationale: Rendu français courant et consacré du titre divin κύριος dans ce contexte.
- source_word: Παντοκράτωρ
  choice: tout-puissant
  rationale: Rend le titre divin Παντοκράτωρ de manière naturelle et traditionnelle, en exprimant la puissance souveraine de Dieu.
- source_word: ἠθέτησεν
  choice: a réduits à néant
  rationale: Dans ce contexte de victoire, l’expression traduit l’idée de rendre les ennemis impuissants et d’anéantir leur entreprise, tout en restant dans le champ sémantique de « mettre de côté, invalider, réduire à rien ».
- source_word: αὐτούς
  choice: les
  rationale: Pronom objet pluriel renvoyant aux ennemis mentionnés dans le contexte.
- source_word: ἐν χειρὶ
  choice: par la main de
  rationale: Conserve l’expression biblique d’agent ou de moyen, qui demeure intelligible en français.
- source_word: θηλείας
  choice: une femme
  rationale: Bien que le terme grec signifie littéralement « femelle », « une femme » est le rendu idiomatique requis pour une personne humaine dans ce récit.
theological_decisions:
- issue: Rendu des titres divins Κύριος Παντοκράτωρ
  choice: Le Seigneur tout-puissant
  alternative: Le Seigneur souverain de tout
  rationale: Ce choix préserve les deux éléments du grec dans une formulation française naturelle, sans développer le titre au-delà du texte.
- issue: Expression de l’agent ἐν χειρὶ θηλείας
  choice: par la main d’une femme
  alternative: par l’intermédiaire d’une femme
  rationale: Le maintien de l’image de la main préserve la formulation biblique et souligne que Dieu agit au moyen d’un agent humain inattendu, sans expliciter davantage le rapport d’action.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « par la main d’une femme » conserve volontairement l’image grecque; « réduits à néant » exprime clairement, dans le contexte de victoire, l’effet du verbe ἀθετέω.
