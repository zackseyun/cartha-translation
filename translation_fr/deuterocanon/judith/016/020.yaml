  text: And the people were rejoicing in Jerusalem before the sanctuary for three months[a], and Judith remained with them.
translation:
  language: fr
  text: Le peuple se réjouissait à Jérusalem, devant le sanctuaire[a], pendant trois mois, et Judith resta avec eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant les choses saintes » ou « en présence d’êtres saints » ; le grec dit littéralement « devant les saints [ou les choses saintes] ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐφραινόμενος
  choice: se réjouit
  rationale: Le participe avec ἦν exprime une réjouissance collective qui se prolonge; le passé simple s’accorde naturellement au récit français, tandis que le complément « pendant trois mois » en indique la durée.
- source_word: κατὰ πρόσωπον τῶν ἁγίων
  choice: devant le sanctuaire
  rationale: Dans le cadre cultuel de Jérusalem, le pluriel substantivé τὰ ἅγια désigne très probablement le sanctuaire ou l’espace sacré; « devant » conserve la valeur spatiale de κατὰ πρόσωπον.
- source_word: ἐπὶ μῆνας τρεῖς
  choice: pendant trois mois
  rationale: Rendu français idiomatique de l’expression temporelle indiquant la durée.
- source_word: κατέμεινεν
  choice: resta
  rationale: Rend simplement l’idée que Judith demeura sur place avec le peuple durant cette période.
- source_word: λαός
  choice: le peuple
  rationale: Équivalent collectif naturel, sans ajouter de précision ethnique ou politique absente du grec.
theological_decisions:
- issue: Référent de τῶν ἁγίων dans le contexte cultuel de Jérusalem
  choice: le sanctuaire
  alternative: les choses saintes; les saints
  rationale: Le contexte de Jérusalem et la construction spatiale favorisent un lieu sacré. L’ambiguïté grammaticale du pluriel substantivé demeure toutefois réelle et est signalée en note.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique courant sans archaïsme marqué. La formulation reste concise et conserve en note l’ambiguïté de τῶν ἁγίων.
