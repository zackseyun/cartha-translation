  text: And she bound up her hair with a headband[a], and took a linen garment to deceive him.
translation:
  language: fr
  text: Elle attacha ses cheveux avec un bandeau et prit un vêtement de lin pour le tromper.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « en vue de sa tromperie » ; dans le contexte, il s’agit de le tromper.'
    reason: La construction grecque εἰς ἀπάτην αὐτοῦ peut être rendue plus littéralement, mais le français courant exprime ici naturellement un but.
lexical_decisions:
- source_word: ἐδήσατο τὰς τρίχας αὐτῆς
  choice: attacha ses cheveux
  rationale: Le moyen ἐδήσατο décrit ici l’action de fixer ou d’arranger les cheveux. Le français emploie naturellement le collectif « cheveux ».
- source_word: ἐν μίτρᾳ
  choice: avec un bandeau
  rationale: Dans ce contexte, μίτρα désigne une bande ou une coiffure servant à retenir les cheveux. « Bandeau » est clair et évite les connotations modernes trompeuses de « mitre ».
- source_word: ἔλαβεν
  choice: prit
  rationale: « Prit » rend directement ἔλαβεν sans expliciter davantage que le grec si Judith saisit le vêtement ou le revêt.
- source_word: στολὴν λινῆν
  choice: un vêtement de lin
  rationale: στολή désigne un vêtement ou une robe, sans que la forme exacte soit précisée ici ; « vêtement de lin » conserve cette généralité.
- source_word: εἰς ἀπάτην αὐτοῦ
  choice: pour le tromper
  rationale: εἰς peut exprimer le but, et αὐτοῦ désigne naturellement l’homme visé par la tromperie. Cette formulation est idiomatique tout en maintenant explicitement le motif de la ruse.
theological_decisions:
- issue: Caractérisation morale de l’action de Judith
  choice: Décrire sans atténuation son intention de « le tromper »
  alternative: en vue de sa tromperie
  rationale: Le grec emploie explicitement ἀπάτη, terme de tromperie. La traduction ne doit ni justifier ni condamner l’acte au-delà de la formulation narrative.
translation_notes:
  register: Français international moderne, simple et digne. La coordination et l’ordre des actions suivent le grec. Le marqueur [a] est placé après la proposition qu’il explique, corrigeant ainsi le décalage apparent de la couche de consultation anglaise.
