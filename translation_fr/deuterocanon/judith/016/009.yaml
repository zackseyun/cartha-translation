  text: Her sandal captured his eye[a], and her beauty took his soul captive; the sword passed through his neck.
translation:
  language: fr
  text: Sa sandale s’empara de son regard, et sa beauté fit de son âme une captive ; l’épée[a] traversa son cou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le poignard traversa son cou » ; le grec désigne une épée courte ou un poignard de type oriental.
    reason: Précision lexicale sur ἀκινάκης et signalement d’une traduction possible.
lexical_decisions:
- source_word: σανδάλιον
  choice: sandale
  rationale: Le terme grec désigne précisément une sandale ; ce détail concret de la parure de Judith est conservé.
- source_word: ἥρπασε
  choice: s’empara de
  rationale: Le verbe exprime une saisie énergique. Avec « regard », cette tournure reste naturelle en français tout en préservant l’image de conquête.
- source_word: ὀφθαλμὸν
  choice: regard
  rationale: Le grec dit littéralement « œil » au singulier, mais celui-ci désigne ici par métonymie l’attention visuelle ; « regard » rend naturellement cet emploi sans réduire l’image à une simple attention.
- source_word: κάλλος
  choice: beauté
  rationale: Équivalent direct et naturel du terme grec dans ce contexte.
- source_word: ᾐχμαλώτισεν
  choice: fit … prisonnière
  rationale: Cette formulation conserve la métaphore militaire de la capture, particulièrement importante dans ce chant de victoire.
- source_word: ψυχὴν
  choice: âme
  rationale: « Âme » préserve le registre poétique et désigne l’être intérieur d’Holopherne, sans substituer au grec l’image différente du cœur.
- source_word: ἀκινάκης
  choice: épée
  rationale: Le mot désigne une épée courte ou un poignard de type oriental. « Épée » assure une lecture fluide, tandis que la précision lexicale figure en note.
- source_word: διῆλθεν
  choice: traversa
  rationale: Rend directement l’idée du passage à travers, sans expliciter davantage le geste par un verbe comme « transperça ».
- source_word: τράχηλον
  choice: cou
  rationale: Équivalent français direct du nom grec.
theological_decisions:
- issue: Force métaphorique des deux verbes de saisie dans le chant de victoire
  choice: 'Conserver l’imagerie de conquête : « s’empara de son regard » et « fit son âme prisonnière »'
  alternative: Employer un langage d’attirance plus courant, tel que « attira son regard » et « conquit son cœur »
  rationale: Le grec présente délibérément l’attirance d’Holopherne comme une défaite précédant sa mort. Garder cette tension évite de romantiser la scène et respecte sa rhétorique militaire.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme des deux premières propositions ainsi que leur vocabulaire de conquête sont conservés. Le marqueur de note est placé après « épée », le mot auquel la note se rapporte.
