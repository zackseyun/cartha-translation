base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/021.yaml
  text: After these days[a], each one returned to his own inheritance, and Judith went away to Bethulia and remained on her own property[c][b], and in her time she became renowned throughout all the land.
translation:
  language: fr
  text: Après ces jours-là, chacun repartit vers son héritage[a]. Judith s’en alla à Béthulie et demeura sur son domaine[b]. En son temps, elle devint illustre dans tout le pays[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers le lot de terre qui lui revenait » ; le grec peut désigner un héritage, un patrimoine ou une part attribuée.
    reason: lexical_alternative
  - marker: b
    text: Ou « sur sa propriété » ; le grec désigne ici les biens ou le domaine qui lui appartenaient.
    reason: lexical_alternative
  - marker: c
    text: Ou « honorée » ou « renommée » ; le terme grec associe la notoriété à l’honneur dont une personne jouit.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὰς ἡμέρας ταύτας
  choice: Après ces jours-là
  rationale: La formule introduit une transition temporelle. « Après ces jours-là » suit précisément ἡμέρας tout en restant naturel en français.
- source_word: ἀνέζευξεν
  choice: repartit
  rationale: Le verbe peut évoquer la levée du camp et le départ. Avec la destination indiquée, « repartit » exprime clairement que chacun regagne son lot.
- source_word: ἕκαστος
  choice: chacun
  rationale: « Chacun » conserve la valeur distributive du singulier grec.
- source_word: εἰς τὴν κληρονομίαν αὐτοῦ
  choice: vers son héritage
  rationale: κληρονομία désigne ici le lot patrimonial ou territorial attribué à chacun. « Héritage » maintient la résonance biblique du terme, tandis que la préposition « vers » rend le mouvement εἰς sans identifier artificiellement le lot à une simple maison.
- source_word: ἀπῆλθεν εἰς Βαιτυλουὰ
  choice: s’en alla à Béthulie
  rationale: « S’en alla » rend la nuance de départ portée par ἀπῆλθεν; « Béthulie » est la forme française usuelle du toponyme.
- source_word: κατέμεινεν
  choice: demeura
  rationale: Le verbe indique qu’elle continua d’y résider. « Demeura » convient au registre narratif digne sans être obscur.
- source_word: ἐπὶ τῆς ὑπάρξεως αὐτῆς
  choice: sur son domaine
  rationale: ὕπαρξις renvoie ici aux biens ou à la propriété de Judith. « Son domaine » exprime une propriété foncière où elle réside, sans allonger la phrase.
- source_word: κατὰ τὸν καιρὸν αὐτῆς
  choice: En son temps
  rationale: 'Cette formulation proche du grec laisse ouverte la portée exacte de l’expression: la période de sa vie ou son époque.'
- source_word: ἔνδοξος
  choice: illustre
  rationale: ἔνδοξος décrit une personne reconnue et tenue en honneur. « Illustre » associe renommée et honneur sans donner au mot un sens théologique excessif.
- source_word: ἐν πάσῃ τῇ γῇ
  choice: dans tout le pays
  rationale: Dans ce contexte, γῆ désigne le pays ou le territoire, non la terre entière.
theological_decisions:
- issue: Sens de κληρονομία dans le retour de chacun vers son territoire
  choice: héritage
  alternative: lot de terre; patrimoine
  rationale: « Héritage » préserve le langage biblique du lot familial ou territorial sans réduire celui-ci à un bien immobilier ordinaire. La note signale le sens concret possible.
- issue: Portée de ἔνδοξος appliqué à Judith
  choice: illustre
  alternative: honorée; renommée; glorieuse
  rationale: Le contexte présente la réputation honorifique de Judith dans le pays. « Illustre » maintient à la fois l’idée de renommée et celle d’honneur, sans imposer à « gloire » une portée doctrinale absente du passage.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste simple et lisible. « Béthulie » suit l’usage français biblique; « en son temps » conserve l’ambiguïté temporelle du grec.
