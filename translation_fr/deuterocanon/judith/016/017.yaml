base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/017.yaml
  text: Woe to the nations rising up against my people[a]; the Lord Almighty will take vengeance on them in the day of judgment, to put fire and worms in their flesh[b], and they will weep in pain forever.
translation:
  language: fr
  text: Malheur aux nations qui se dressent contre mon peuple[a] ! Le Seigneur Tout-Puissant se vengera d’elles au jour du jugement, en mettant du feu et des vers dans leur chair ; elles pleureront dans la douleur[b] pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les miens », « ma parenté » ou « ma nation » ; le grec γένος désigne ici le peuple auquel Judith appartient.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « dans la sensation » ou « dans la perception » ; dans ce contexte de châtiment corporel, l’expression peut désigner la douleur consciemment ressentie.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαὶ
  choice: Malheur
  rationale: Interjection française naturelle qui conserve la force prophétique, judiciaire et lamentative du grec.
- source_word: ἔθνεσιν
  choice: aux nations
  rationale: Désigne ici les peuples étrangers hostiles, sans introduire la terminologie plus marquée de « païens ».
- source_word: ἐπανισταμένοις
  choice: qui se dressent contre
  rationale: Conserve l’image d’un soulèvement hostile sans préciser indûment sa forme.
- source_word: τῷ γένει μου
  choice: mon peuple
  rationale: Dans ce contexte collectif, γένος désigne le groupe d’appartenance de Judith. « Peuple » est clair et évite les connotations modernes trompeuses de « race ».
- source_word: Κύριος Παντοκράτωρ
  choice: le Seigneur Tout-Puissant
  rationale: Rend naturellement le titre divin tout en conservant sa force traditionnelle.
- source_word: ἐκδικήσει αὐτοὺς
  choice: se vengera d’elles
  rationale: Préserve la tonalité rétributive du verbe et reprend grammaticalement « les nations » au féminin en français.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: au jour du jugement
  rationale: Formulation française idiomatique qui respecte la portée judiciaire et possiblement eschatologique de l’expression.
- source_word: δοῦναι πῦρ καὶ σκώληκας εἰς σάρκας αὐτῶν
  choice: il livrera leur chair au feu et aux vers
  rationale: Rend de façon naturelle la construction grecque difficile avec δοῦναι et εἰς, tout en conservant intégralement l’image corporelle du feu et des vers.
- source_word: κλαύσονται
  choice: elles pleureront
  rationale: Équivalent direct et naturel du verbe grec, avec reprise de « nations ».
- source_word: ἐν αἰσθήσει
  choice: dans la douleur
  rationale: αἴσθησις signifie littéralement sensation ou perception ; dans ce contexte de châtiment corporel, « douleur » en exprime vraisemblablement la valeur contextuelle sans recourir au terme doctrinal plus chargé « tourment ».
- source_word: ἕως αἰῶνος
  choice: pour toujours
  rationale: Exprime idiomatiquement la durée indéfinie ou perpétuelle portée ici par la formule grecque.
theological_decisions:
- issue: Nature et durée du châtiment
  choice: « elles pleureront dans la douleur pour toujours »
  alternative: « elles pleureront en le ressentant à jamais » ou « elles pleureront dans le tourment pour l’éternité »
  rationale: La traduction maintient la sévérité et la durée exprimées par le texte, sans transformer αἴσθησις en formulation doctrinale technique. Une note signale le sens littéral afin de préserver l’ambiguïté lexicale.
- issue: Rapport syntaxique de δοῦναι à la vengeance divine
  choice: « il livrera leur chair au feu et aux vers »
  alternative: « en mettant du feu et des vers dans leur chair »
  rationale: L’infinitif précise le contenu ou l’effet de la vengeance. La formulation retenue est plus naturelle en français, sans atténuer l’image, mais la construction grecque admet une traduction plus formelle.
translation_notes:
  register: Français international moderne, solennel mais accessible. La ponctuation met en relief l’annonce judiciaire. « Tout-Puissant » conserve le titre divin traditionnel ; les images sévères du grec ne sont ni adoucies ni systématisées.
