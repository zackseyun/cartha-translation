  yaml_path: translation/deuterocanon/judith/016/016.yaml
  text: For every sacrifice for a pleasing aroma is a small thing[a], and all fat for your whole burnt offering is very little; but the one who fears the Lord is great forever.
translation:
  language: fr
  text: Car tout sacrifice offert comme parfum agréable est peu de chose, et toute graisse destinée à un holocauste pour toi est infime ; mais celui qui craint le Seigneur est grand pour toujours[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en tout temps » ; l’expression grecque peut indiquer une continuité constante ou une permanence durable.
    reason: Alternative lexicale pour διὰ παντός, dont la portée temporelle demeure ouverte.
lexical_decisions:
- source_word: μικρὸν
  choice: est peu de chose
  rationale: L’adjectif attribut évalue la valeur relative du sacrifice. « Peu de chose » conserve ce jugement sans laisser entendre que le sacrifice serait absolument méprisable.
- source_word: θυσία
  choice: sacrifice
  rationale: Terme cultuel direct, courant et immédiatement compréhensible.
- source_word: εἰς ὀσμὴν εὐωδίας
  choice: offert comme parfum agréable
  rationale: Cette formulation naturelle conserve l’image cultuelle d’une offrande agréée, sans rendre littéralement la tournure grecque au prix d’un français pesant.
- source_word: ἐλάχιστον
  choice: est infime
  rationale: Le superlatif renforce μικρόν. « Infime » marque nettement l’intensification et maintient le parallélisme.
- source_word: στέαρ
  choice: graisse
  rationale: Le mot désigne la graisse sacrificielle ; la traduction littérale convient au contexte.
- source_word: ὁλοκαύτωμά
  choice: holocauste
  rationale: Dans le vocabulaire sacrificiel biblique, « holocauste » désigne une offrande entièrement consumée. Le contexte exclut le sens historique moderne du nom propre « la Shoah ».
- source_word: σοι
  choice: pour toi
  rationale: Le datif maintient l’adresse directe à Dieu et rattache l’holocauste à son destinataire.
- source_word: ὁ δὲ φοβούμενος τὸν κύριον
  choice: mais celui qui craint le Seigneur
  rationale: Le participe substantivé énonce une vérité générale. Cette traduction garde aussi le contraste introduit par δέ.
- source_word: μέγας
  choice: est grand
  rationale: La traduction directe préserve l’antithèse rhétorique entre la petitesse des sacrifices et la grandeur de celui qui révère Dieu.
- source_word: διὰ παντός
  choice: pour toujours
  rationale: La locution peut exprimer une continuité constante ou une permanence durable. « Pour toujours » convient à la portée sentencieuse du verset, tandis qu’une note conserve l’autre possibilité.
theological_decisions:
- issue: Valeur relative des sacrifices et crainte du Seigneur
  choice: Les sacrifices sont présentés comme peu de chose en comparaison de la grandeur de celui qui craint le Seigneur.
  alternative: Le propos pourrait souligner l’insuffisance des sacrifices dépourvus de révérence plutôt que leur faible valeur intrinsèque.
  rationale: Le grec établit explicitement une opposition entre μικρόν/ἐλάχιστον et μέγας. La traduction maintient cette tension sans transformer la phrase en condamnation générale du culte sacrificiel.
- issue: Traduction de κύριον
  choice: Seigneur
  alternative: Maître
  rationale: Dans ce contexte religieux, « Seigneur » est le titre révérenciel usuel de Dieu et correspond directement à κύριος.
- issue: Portée temporelle de διὰ παντός
  choice: pour toujours
  alternative: en tout temps
  rationale: Le contexte sapientiel permet d’entendre soit une permanence durable, soit une constance continuelle. Le texte retient la première lecture et la note signale la seconde.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme et l’opposition du grec. « Holocauste » est employé dans son sens cultuel biblique d’offrande entièrement consumée. Le marqueur [a] est placé sur l’expression temporelle qu’il explique, corrigeant ainsi le décalage présent dans la couche anglaise.
