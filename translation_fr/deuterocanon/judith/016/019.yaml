revisions:
- from: Judith consacra tout l’équipement d’Holopherne que le peuple lui avait donné. Quant au baldaquin[a] qu’elle avait pris pour elle dans sa chambre à coucher, elle le donna à Dieu comme offrande consacrée[b].
  to: Judith consacra à Dieu tout l’équipement d’Holopherne que le peuple lui avait donné, et elle donna à Dieu, comme offrande consacrée[b], le baldaquin[a] qu’elle avait pris pour elle-même dans la chambre à coucher d’Holopherne.
  rationale: La révision rend explicitement « à Dieu » pour les deux éléments dédiés et lève l’ambiguïté du possessif en identifiant la chambre comme celle d’Holopherne. Elle conserve la distinction sémantique entre la consécration (ἀνέθηκεν) et l’objet donné comme dédicace (εἰς ἀνάθημα), ainsi que les notes lexicales nécessaires pour κωνώπιον et ἀνάθημα.
