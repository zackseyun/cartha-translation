  text: And Judith dedicated to God all the equipment of Holofernes that the people had given her[b][a], and she gave to God as a dedicated offering the canopy that she had taken for herself from his bedchamber.
translation:
  language: fr
  text: Judith consacra à Dieu tout l’équipement d’Holopherne que le peuple lui avait donné, et elle donna à Dieu, comme offrande consacrée[b], le baldaquin[a] qu’elle avait pris pour elle-même dans la chambre à coucher d’Holopherne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « moustiquaire » ou « tenture de lit » (grec κωνώπιον).
    reason: lexical_alternative
  - marker: b
    text: L’expression peut aussi se traduire par « offrande votive » ou « objet consacré à Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέθηκεν
  choice: consacra
  rationale: Le verbe désigne ici l’acte de vouer ou de dédier des objets à Dieu; « consacra » exprime clairement cette destination cultuelle sans préciser un rite absent du texte.
- source_word: σκεύη
  choice: équipement
  rationale: Le pluriel peut désigner des objets, effets ou pièces d’équipement. Dans le contexte des biens d’Holopherne, « équipement » conserve cette portée générale.
- source_word: κωνώπιον
  choice: baldaquin
  rationale: Le terme désigne une moustiquaire ou une tenture disposée autour ou au-dessus d’un lit. « Baldaquin » est naturel dans ce contexte, tandis que les sens plus précis sont signalés en note.
- source_word: κοιτῶνος
  choice: chambre à coucher
  rationale: Le mot désigne la pièce où l’on dort. Cette formulation est moderne, claire et digne.
- source_word: εἰς ἀνάθημα
  choice: comme offrande consacrée
  rationale: L’expression indique un objet voué à Dieu. Cette traduction conserve le caractère cultuel de l’offrande sans la présenter comme un sacrifice.
- source_word: τῷ θεῷ
  choice: à Dieu
  rationale: Le datif indique ici le destinataire de l’objet consacré.
theological_decisions:
- issue: Langage cultuel de la consécration
  choice: Présenter les objets comme consacrés et donnés à Dieu, sans les qualifier de sacrifices.
  alternative: Employer le terme technique « offrande votive » ou rendre plus généralement par « don ».
  rationale: La combinaison de ἀνέθηκεν et ἀνάθημα marque une dédicace religieuse d’objets. « Consacra » et « offrande consacrée » préservent ce sens sans importer une procédure rituelle ou une catégorie sacrificielle non exprimée.
translation_notes:
  register: Français international moderne, narratif et digne. La reprise « Quant au baldaquin » clarifie la syntaxe grecque, qui coordonne deux actes de consécration, tout en conservant la distinction entre le verbe ἀνέθηκεν et le nom ἀνάθημα.
