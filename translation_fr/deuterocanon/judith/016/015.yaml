  yaml_path: translation/deuterocanon/judith/016/015.yaml
  text: For mountains will be shaken from their foundations with the waters[a], and rocks will melt like wax before your face; yet to those who fear you, you are gracious.
translation:
  language: fr
  text: Car les montagnes seront ébranlées jusque dans leurs fondations avec les eaux, et les rochers fondront comme la cire devant ta face[a] ; mais envers ceux qui te craignent, tu te montres favorable.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus idiomatique : « devant toi » ou « en ta présence ». Le grec dit littéralement « devant ta face ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄρη
  choice: les montagnes
  rationale: Le sens ordinaire est celui de montagnes physiques ; ce choix conserve l’imagerie cosmique et le parallèle avec les rochers.
- source_word: ἐκ θεμελίων
  choice: jusque dans leurs fondations
  rationale: La préposition ἐκ exprime ici un ébranlement qui atteint les montagnes depuis leur base même. La formulation française rend naturellement l’ampleur du bouleversement.
- source_word: σὺν ὕδασιν
  choice: avec les eaux
  rationale: σύν marque l’accompagnement. « Les eaux » convient au registre poétique et à l’image des éléments naturels.
- source_word: σαλευθήσεται
  choice: seront ébranlées
  rationale: Le futur passif de σαλεύω désigne une mise en mouvement violente. « Ébranlées » conserve à la fois la force et la voix passive.
- source_word: πέτραι
  choice: les rochers
  rationale: Dans le parallélisme avec les montagnes, πέτραι désigne de grandes masses rocheuses plutôt que de simples pierres.
- source_word: ἀπὸ προσώπου σου
  choice: devant ta face
  rationale: Cette traduction conserve l’expression concrète et anthropomorphique du grec, tout en signalant en note des formulations françaises plus idiomatiques.
- source_word: ὡς κηρός
  choice: comme la cire
  rationale: La comparaison est directe et naturelle en français ; elle préserve l’image poétique de la roche qui se liquéfie.
- source_word: τακήσονται
  choice: fondront
  rationale: Le verbe signifie fondre ou se liquéfier. « Fondront » est l’équivalent français le plus direct dans cette image.
- source_word: ἔτι δὲ
  choice: mais
  rationale: Dans ce contexte, l’expression introduit le contraste entre le bouleversement cosmique devant Dieu et sa disposition favorable envers ceux qui le craignent.
- source_word: τοῖς φοβουμένοις σε
  choice: envers ceux qui te craignent
  rationale: La formulation maintient le langage biblique de la crainte de Dieu, qui peut englober effroi, respect et révérence, sans le réduire à une seule nuance.
- source_word: εὐιλατεύεις αὐτοῖς
  choice: tu te montres favorable
  rationale: Le verbe rare exprime une disposition bienveillante ou miséricordieuse. « Tu te montres favorable » est clair en français moderne et évite le terme plus technique « propice ».
theological_decisions:
- issue: Sens de la crainte dans τοῖς φοβουμένοις σε
  choice: ceux qui te craignent
  alternative: ceux qui te révèrent
  rationale: « Craignent » conserve la tension biblique entre crainte, respect et révérence, au lieu de résoudre le sens en simple déférence.
- issue: Expression anthropomorphique ἀπὸ προσώπου σου
  choice: devant ta face
  alternative: devant toi / en ta présence
  rationale: Le texte principal garde l’image concrète de la face divine. La note offre les équivalents idiomatiques sans effacer cette image.
- issue: Portée de εὐιλατεύεις
  choice: tu te montres favorable
  alternative: tu leur fais grâce / tu leur es propice
  rationale: Le choix exprime la bienveillance divine sans imposer au verbe rare un sens technique d’expiation ou le restreindre au pardon.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement correspond à l’adresse directe à Dieu. La structure en deux volets et le contraste final sont conservés ; la ponctuation rend la longue phrase lisible sans en rompre l’unité.
