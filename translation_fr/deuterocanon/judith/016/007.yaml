  text: For she took off her widow’s clothing for the lifting up of those who were afflicted in Israel,[a]
translation:
  language: fr
  text: Car elle ôta ses vêtements de veuve pour relever ceux qui souffraient en Israël.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour l’élévation de ceux qui souffraient en Israël ». L’expression grecque est condensée et évoque le fait de porter en haut ou d’élever.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεδύσατο
  choice: elle ôta
  rationale: Le moyen indique qu’elle enlève elle-même ce qu’elle porte. « Ôta » rend l’action concrète dans un français naturel et digne.
- source_word: στολὴν χηρεύσεως αὐτῆς
  choice: ses vêtements de veuve
  rationale: L’expression désigne la tenue caractéristique de son état de veuve. Le pluriel collectif « vêtements » est idiomatique en français et « ses » rend αὐτῆς sans lourdeur.
- source_word: εἰς ὕψος
  choice: pour relever
  rationale: La formule grecque, littéralement orientée vers la hauteur ou l’élévation, est condensée. « Pour relever » conserve l’image d’élévation tout en exprimant naturellement le but dans ce contexte.
- source_word: τῶν πονούντων
  choice: ceux qui souffraient
  rationale: Le participe peut évoquer la peine, la détresse ou la souffrance. « Ceux qui souffraient » garde cette amplitude sans limiter le sens au travail pénible.
- source_word: ἐν Ἰσραήλ
  choice: en Israël
  rationale: Traduction directe de la valeur locative ou collective de l’expression.
theological_decisions:
- issue: Portée de εἰς ὕψος
  choice: pour relever ceux qui souffraient
  alternative: pour l’élévation de ceux qui souffraient
  rationale: Le grec permet une formulation plus abstraite (« élévation »), mais « relever » préserve la métaphore tout en restant clair. La note signale l’autre lecture sans préciser indûment s’il s’agit de secours, de restauration ou d’honneur.
translation_notes:
  register: Français moderne international, simple et digne. La phrase conserve le lien causal introduit par γάρ et l’image d’élévation de εἰς ὕψος, sans expliciter davantage que le grec la manière dont les personnes éprouvées sont relevées.
