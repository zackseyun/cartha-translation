  yaml_path: translation/deuterocanon/judith/016/002.yaml
  text: For the Lord is a God who shatters wars; for in his camp, in the midst of the people, he rescued me from the hand of those pursuing me.
translation:
  language: fr
  text: Car le Seigneur est un Dieu qui brise les guerres ; car, au sein de ses campements, au milieu du peuple, il m’a arrachée de la main de ceux qui me poursuivaient.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θεὸς συντρίβων πολέμους
  choice: le Dieu qui brise les guerres
  rationale: 'Reproduit l’image forte et inhabituelle du grec : Dieu ne se contente pas de mettre fin aux combats, il « brise » les guerres.'
- source_word: παρεμβολὰς αὐτοῦ
  choice: son camp
  rationale: παρεμβολή peut désigner un camp ou une armée rangée ; le singulier collectif « son camp » convient au contexte et reste naturel en français.
- source_word: ἐξείλατό με
  choice: il m’a arrachée
  rationale: Le verbe exprime une délivrance hors d’un danger. « Arrachée » conserve la vigueur de l’image et l’accord féminin renvoie à Judith, qui parle.
- source_word: ἐκ χειρὸς καταδιωκόντων με
  choice: à la main de ceux qui me poursuivaient
  rationale: Conserve l’idiome biblique « à la main de » ainsi que l’idée d’une poursuite hostile exprimée par καταδιώκω.
theological_decisions:
- issue: Relation entre « Seigneur » et « Dieu » dans θεὸς … Κύριος
  choice: le Seigneur est le Dieu qui brise les guerres
  alternative: Dieu, qui brise les guerres, est Seigneur
  rationale: Suit la compréhension syntaxique reflétée par le contexte et la tradition textuelle consultée, tout en évitant d’ajouter un titre divin absent ou une interprétation confessionnelle.
- issue: 'Localisation du salut : εἰς παρεμβολὰς αὐτοῦ ἐν μέσῳ λαοῦ'
  choice: dans son camp, au milieu du peuple
  alternative: parmi ses armées, au milieu du peuple
  rationale: Préserve les deux compléments locatifs et leur tension sans préciser artificiellement si « son » renvoie au camp de Dieu ou à celui associé à son peuple.
translation_notes:
  register: Français international moderne, solennel mais accessible. La répétition de « car » et l’image paradoxale « brise les guerres » sont maintenues pour respecter la forme poétique et l’intensité du grec.
