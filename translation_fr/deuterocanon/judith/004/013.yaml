base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/013.yaml
  text: And they covered the altar with sackcloth, and they cried out to the God of Israel together with fervor, that he might not give their little children over to plunder, and their women to spoil, and the cities of their inheritance to destruction, and the holy things to defilement and reproach, as something the nations would gloat over.
translation:
  language: fr
  text: Ils enveloppèrent l’autel d’une toile de sac et crièrent tous ensemble avec ferveur vers le Dieu d’Israël, afin qu’il ne livre pas leurs petits enfants au pillage, leurs femmes comme butin[a], les villes de leur héritage à la destruction, et les choses saintes à la profanation et à l’opprobre, pour la joie des nations[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « leurs femmes au pillage ». Le grec emploie ici le vocabulaire du butin de guerre.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « comme un sujet de jubilation pour les nations ». Dans ce contexte, il s’agit de la joie hostile que leur inspirerait le malheur d’Israël.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ θυσιαστήριον
  choice: l’autel
  rationale: Désigne l’autel où sont offerts les sacrifices; « l’autel » est naturel et suffisamment précis dans ce contexte.
- source_word: σάκκῳ περιέβαλλον
  choice: enveloppèrent ... d’une toile de sac
  rationale: περιβάλλω exprime l’action de placer quelque chose autour; cette formulation conserve l’image concrète du geste de deuil.
- source_word: ἐβόησαν ... ὁμοθυμαδὸν ἐκτενῶς
  choice: crièrent tous ensemble avec ferveur
  rationale: « Crièrent » garde la force de ἐβόησαν, tandis que « tous ensemble » et « avec ferveur » rendent respectivement l’unité et l’intensité de la supplication.
- source_word: τοῦ μὴ δοῦναι
  choice: afin qu’il ne livre pas
  rationale: La construction exprime le contenu et la visée de leur supplication; « livrer » convient au contexte de remise aux ennemis.
- source_word: τὰ νήπια ... εἰς διαρπαγήν
  choice: leurs petits enfants au pillage
  rationale: νήπια désigne de très jeunes enfants sans imposer ici le sens plus étroit de « nourrissons »; διαρπαγή évoque la saisie violente liée au pillage.
- source_word: τὰς γυναῖκας εἰς προνομήν
  choice: leurs femmes comme butin
  rationale: γυναῖκες désigne collectivement les femmes, et προνομή relève explicitement du vocabulaire du butin de guerre.
- source_word: τὰς πόλεις τῆς κληρονομίας αὐτῶν
  choice: les villes de leur héritage
  rationale: « Héritage » préserve la portée territoriale et religieuse de κληρονομία sans l’expliciter davantage.
- source_word: εἰς ἀφανισμόν
  choice: à la destruction
  rationale: ἀφανισμός exprime la ruine ou l’anéantissement; « destruction » maintient le parallélisme de la phrase.
- source_word: τὰ ἅγια
  choice: les choses saintes
  rationale: Le pluriel neutre reste ouvert et ne doit pas être réduit sans certitude au seul sanctuaire ou à ses objets.
- source_word: εἰς βεβήλωσιν καὶ ὀνειδισμόν
  choice: à la profanation et à l’opprobre
  rationale: « Profanation » rend l’atteinte au caractère sacré, et « opprobre » la honte ou l’insulte publique.
- source_word: ἐπίχαρμα τοῖς ἔθνεσιν
  choice: pour la joie des nations
  rationale: La formulation reste proche du grec et conserve la nuance contextuelle d’une joie hostile, explicitée en note.
theological_decisions:
- issue: Portée de κληρονομία dans le contexte d’Israël
  choice: héritage
  alternative: patrimoine; possession
  rationale: « Héritage » conserve la résonance historico-religieuse du terme sans ajouter une interprétation doctrinale.
- issue: Référent de τὰ ἅγια
  choice: les choses saintes
  alternative: le sanctuaire; les objets sacrés
  rationale: Le pluriel grec est plus large qu’un bâtiment unique; la traduction préserve donc l’ambiguïté du référent.
- issue: Nuance de la joie attribuée aux nations
  choice: pour la joie des nations
  alternative: un sujet de jubilation pour les nations; de quoi réjouir malicieusement les nations
  rationale: La traduction principale maintient la concision nominale du grec, tandis que la note signale le caractère hostile de cette joie.
translation_notes:
  register: Français international moderne, digne et accessible. La longue supplication coordonnée du grec est conservée, avec un rythme naturel. « Toile de sac » évite que « sac » soit compris comme un contenant; « opprobre » maintient le registre solennel du contexte cultuel.
