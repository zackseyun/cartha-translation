base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/009.yaml
  text: And the sons of Israel did as Joakim the high priest and the council of the whole people of Israel[a], who sat in Jerusalem[c][b], instructed them.
translation:
  language: fr
  text: Les fils d’Israël[a] agirent selon les instructions de Joakim, le grand prêtre, et du conseil de tout le peuple d’Israël, qui siégeaient à Jérusalem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites » ou « les enfants d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: Le grec a « avait prescrit » au singulier, puis un relatif masculin pluriel (« qui siégeaient »). La relative peut viser Joakim et le conseil ensemble, ou plus particulièrement les membres du conseil établis à Jérusalem.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: les fils d’Israël
  rationale: Cette expression reproduit l’image collective du grec et conserve sa portée identitaire; « les Israélites » serait plus idiomatique, mais moins transparent.
- source_word: ἐποίησαν … καθὰ συνέταξεν αὐτοῖς
  choice: firent ce que leur avaient prescrit
  rationale: La tournure française exprime naturellement l’idée d’agir conformément à une directive. « Prescrire » conserve ici la valeur autoritative de συντάσσω sans imposer la force plus marquée de « commander ».
- source_word: Ἰωακεὶμ
  choice: Joakim
  rationale: Translittération française proche de la forme grecque, sans harmonisation avec une forme hébraïque distincte.
- source_word: ὁ ἱερεὺς ὁ μέγας
  choice: le grand prêtre
  rationale: Désignation française usuelle de cette fonction cultuelle juive.
- source_word: ἡ γερουσία
  choice: le conseil
  rationale: Le terme désigne un corps d’anciens. « Conseil » est clair et actuel, tandis que « sénat » introduirait une coloration institutionnelle potentiellement trompeuse.
- source_word: παντὸς δήμου Ἰσραήλ
  choice: de tout le peuple d’Israël
  rationale: Cette formulation rend le sens collectif de δῆμος sans suggérer nécessairement une assemblée réunie à cet instant.
- source_word: οἱ ἐκάθηντο ἐν Ἰερουσαλήμ
  choice: qui siégeaient à Jérusalem
  rationale: « Siéger » rend naturellement καθῆμαι lorsqu’il s’agit de dirigeants ou d’un conseil, tout en évitant de transformer sans nécessité la présence institutionnelle en résidence permanente.
theological_decisions:
- issue: Désignation collective d’Israël
  choice: les fils d’Israël
  alternative: les Israélites; les enfants d’Israël
  rationale: Le calque compréhensible conserve l’image familiale et l’identité collective exprimées par le grec, sans ajouter d’interprétation confessionnelle.
- issue: Référent de la proposition relative finale
  choice: Joakim et le conseil sont présentés ensemble comme siégeant à Jérusalem
  alternative: La proposition pourrait décrire plus précisément les membres du conseil établis à Jérusalem
  rationale: Le relatif grec est au masculin pluriel (οἱ ἐκάθηντο), ce qui favorise un renvoi collectif aux dirigeants précédemment nommés, bien que le sens puisse se concentrer sur les membres du conseil. La note maintient cette légère ambiguïté.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste proche du grec tout en adoptant une concordance verbale naturelle en français. « Siégeaient » convient au contexte d’autorités réunies ou établies à Jérusalem.
