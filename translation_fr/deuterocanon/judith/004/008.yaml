  text: telling them to seize the mountain passes[a], because through them was the entrance into Judea; and it was easy to hold them back as they came up[b], since the approach was narrow enough for all the men to go two abreast.
translation:
  language: fr
  text: en leur disant d’occuper les passages en montée de la région montagneuse[a], car c’était par eux que l’on entrait en Judée. Il était facile d’arrêter ceux qui montaient[b], puisque la voie d’accès était étroite, ne laissant passer que deux hommes de front.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les montées de la région montagneuse »; il s’agit des voies qui gravissaient le relief et donnaient accès au pays.'
    reason: lexical_alternative
  - marker: b
    text: La fin de la phrase grecque est concise et difficile. La traduction comprend que la voie était si étroite que seuls deux hommes pouvaient y avancer côte à côte.
    reason: alternative_reading
lexical_decisions:
- source_word: διακατασχεῖν
  choice: occuper
  rationale: Dans ce contexte militaire, l’infinitif désigne la prise et la conservation de positions stratégiques. « Occuper » exprime naturellement les deux aspects sans suggérer nécessairement un assaut.
- source_word: τὰς ἀναβάσεις τῆς ὀρεινῆς
  choice: les passages qui montaient dans la région montagneuse
  rationale: Cette formulation garde le sens concret des « montées » tout en indiquant qu’il s’agit de voies stratégiques dans le relief montagneux.
- source_word: ἡ εἴσοδος εἰς τὴν Ἰουδαίαν
  choice: c’était par eux que l’on entrait en Judée
  rationale: Cette tournure française restitue naturellement l’idée que ces voies constituaient l’accès à la Judée.
- source_word: εὐχερῶς
  choice: Il était facile
  rationale: Rend directement l’idée de facilité liée aux conditions du terrain.
- source_word: διακωλῦσαι
  choice: d’arrêter
  rationale: Dans le contexte, le verbe signifie empêcher la progression ennemie; « arrêter » est clair, concret et militaire.
- source_word: προσβαίνοντας
  choice: ceux qui montaient
  rationale: Le participe peut évoquer l’approche ou l’avancée; « montaient » conserve ici la dimension topographique mise en avant par ἀναβάσεις.
- source_word: στενῆς τῆς προσβάσεως οὔσης
  choice: puisque la voie d’accès était étroite
  rationale: Le génitif absolu donne la raison de la facilité de la défense; « voie d’accès » rend πρόσβασις dans son sens spatial.
- source_word: ἐπʼ ἄνδρας τοὺς πάντας δύο
  choice: ne laissant passer que deux hommes de front
  rationale: Le grec transmis est concis et difficile. Le contexte favorise l’interprétation d’un passage permettant seulement à deux hommes d’avancer côte à côte, tout en justifiant une note signalant l’incertitude.
