base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/001.yaml
  text: And the sons of Israel who lived in Judea heard all that Holofernes[a], the commander-in-chief of King Nebuchadnezzar of the Assyrians, had done to the nations[b], and how he had plundered all their sanctuaries and given them over to destruction.
translation:
  language: fr
  text: Les fils d’Israël[a] qui habitaient en Judée apprirent tout ce qu’Holopherne, commandant en chef de Nabuchodonosor, roi des Assyriens, avait fait aux nations, et comment il avait pillé tous leurs sanctuaires[b] et les avait livrés à la destruction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites » ou « les enfants d’Israël ». Le grec dit littéralement « les fils d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: Ou « leurs temples », « leurs lieux sacrés » ou « leurs choses sacrées »; le grec peut désigner aussi bien des lieux que des réalités consacrées.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: les fils d’Israël
  rationale: Cette expression restitue directement l’idiome grec et sa portée identitaire, tout en restant intelligible en français moderne. Une note signale les formulations collectives plus courantes.
- source_word: οἱ κατοικοῦντες ἐν τῇ Ἰουδαίᾳ
  choice: qui habitaient en Judée
  rationale: Le participe désigne ceux qui résident dans le pays; cette relative est naturelle en français et conserve la valeur durative de l’imparfait.
- source_word: πάντα ὅσα ἐποίησεν
  choice: tout ce que … avait fait
  rationale: Le plus-que-parfait situe naturellement les actes d’Holopherne avant le moment où les habitants de Judée en apprennent la nouvelle, tout en préservant la totalité exprimée par πάντα ὅσα.
- source_word: ὁ ἀρχιστράτηγος
  choice: commandant en chef
  rationale: Le titre désigne le chef suprême de l’armée et est plus précis que le simple terme « général ».
- source_word: τοῖς ἔθνεσιν
  choice: aux nations
  rationale: Dans ce récit, le terme renvoie aux différents peuples étrangers soumis par Holopherne, sans qu’il soit nécessaire de lui donner le sens théologique plus marqué de « païens ».
- source_word: ἐσκύλευσεν
  choice: avait pillé
  rationale: Le verbe évoque l’action de dépouiller et de prendre comme butin; « piller » convient au contexte militaire et cultuel.
- source_word: τὰ ἱερὰ αὐτῶν
  choice: leurs sanctuaires
  rationale: Le neutre pluriel peut désigner des lieux ou des réalités sacrées. « Sanctuaires » correspond bien au contexte sans réduire le sens à des objets ni l’élargir à toute chose sainte.
- source_word: ἔδωκεν αὐτὰ εἰς ἀφανισμόν
  choice: les avait livrés à la destruction
  rationale: Cette formulation conserve l’image d’une remise ou d’un abandon en vue de la ruine, sans introduire une terminologie technique étrangère au passage.
theological_decisions:
- issue: Désignation identitaire οἱ υἱοὶ Ἰσραήλ
  choice: les fils d’Israël
  alternative: les Israélites; les enfants d’Israël
  rationale: Le choix maintient l’expression masculine et généalogique du grec, avec sa résonance historique et communautaire, sans la neutraliser silencieusement.
- issue: Étendue du sens de τὰ ἱερὰ αὐτῶν
  choice: leurs sanctuaires
  alternative: leurs temples; leurs choses sacrées; leurs lieux sacrés
  rationale: Le contexte favorise les lieux de culte dévastés, mais le grec demeure assez large. La traduction retient le référent probable et la note préserve l’ambiguïté lexicale.
- issue: Force de εἰς ἀφανισμόν
  choice: à la destruction
  alternative: à l’anéantissement; à la disparition complète
  rationale: « Destruction » exprime la ruine totale visée sans importer la notion technique de mise à l’interdit ni accentuer au-delà de ce qu’impose le grec.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase conserve la structure ample du grec tout en clarifiant les rapports syntaxiques. Les marqueurs de notes ont été placés après les expressions auxquelles leurs notes se rapportent.
