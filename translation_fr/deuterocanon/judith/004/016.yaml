  yaml_path: translation/deuterocanon/judith/004/016.yaml
  text: And there was ashes on their turbans, and they were crying out to the Lord with all their strength, that he might look with favor on the whole house of Israel.
translation:
  language: fr
  text: Ils avaient de la cendre sur leurs turbans et criaient vers le Seigneur de toutes leurs forces, afin qu’il porte un regard favorable sur toute la maison d’Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σποδός
  choice: de la cendre
  rationale: Le singulier collectif grec désigne la cendre répandue en signe de deuil ou de supplication; le français emploie naturellement le singulier massif.
- source_word: κιδάρεις
  choice: turbans
  rationale: Le terme désigne des coiffures de type turban; ce choix concret correspond au contexte rituel.
- source_word: ἐβόων πρὸς Κύριον
  choice: criaient vers le Seigneur
  rationale: Conserve le mouvement de l’appel adressé au Seigneur et l’intensité du verbe grec.
- source_word: ἐκ πάσης δυνάμεως
  choice: de toutes leurs forces
  rationale: Expression idiomatique française qui restitue l’idée d’un cri poussé avec toute leur puissance.
- source_word: εἰς ἀγαθὸν ἐπισκέψασθαι
  choice: afin qu’il porte un regard favorable sur
  rationale: 'Rend la finalité de εἰς et le sens contextuel de ἐπισκέπτομαι: intervenir ou considérer en vue du bien, sans préciser davantage la forme de cette faveur.'
- source_word: πᾶν οἶκον Ἰσραήλ
  choice: toute la maison d’Israël
  rationale: Maintient l’expression biblique collective et la portée de πᾶν.
theological_decisions:
- issue: Nature de l’action divine demandée
  choice: qu’il porte un regard favorable sur
  alternative: qu’il visite pour le bien
  rationale: La formulation choisie exprime la bienveillance implorée sans réduire ἐπισκέπτομαι à une simple perception ni imposer une intervention précisément définie.
translation_notes:
  register: Français moderne, digne et accessible. La construction est fluide tout en conservant l’imagerie des turbans couverts de cendre, l’intensité de la supplication et l’expression traditionnelle « maison d’Israël ».
