base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/015.yaml
  text: And Joakim the high priest[a], and all who stood before the Lord—the priests and those ministering to the Lord, with sackcloth girded around their waists—were offering the regular whole burnt offering, and the prayers, and the freewill gifts of the people[b],
translation:
  language: fr
  text: Joakim, le grand prêtre, et tous ceux qui se tenaient devant le Seigneur — les prêtres et ceux qui assuraient le service du Seigneur —, les reins ceints de sacs, offraient l’holocauste perpétuel[a], ainsi que les vœux[b] et les dons volontaires du peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’holocauste régulier » ou « continuel » ; le terme grec évoque ce qui est offert de manière constante ou régulière.
    reason: lexical_alternative
  - marker: b
    text: Ou « les prières ». Dans ce contexte cultuel, le mot grec peut aussi désigner des vœux, voire les offrandes promises par vœu.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰωακεὶμ
  choice: Joakim
  rationale: Translittération proche de la forme grecque, conforme à l’usage français possible pour ce nom dans Judith.
- source_word: ὁ ἱερεὺς ὁ μέγας
  choice: le grand prêtre
  rationale: Titre consacré et naturel en français pour la fonction désignée par l’expression grecque.
- source_word: οἱ παρεστηκότες ἐνώπιον Κυρίου
  choice: ceux qui se tenaient devant le Seigneur
  rationale: Rend la présence debout et le service cultuel suggérés par le participe parfait.
- source_word: οἱ λειτουργοῦντες Κυρίῳ
  choice: ceux qui assuraient le service du Seigneur
  rationale: Exprime le service sacré sans employer le terme plus spécialisé « liturgie ».
- source_word: σάκκους περιεζωσμένοι τὰς ὀσφύας αὐτῶν
  choice: les reins ceints d’une toile de sac
  rationale: Conserve l’image concrète et pénitentielle dans un français biblique digne mais intelligible.
- source_word: προσέφερον
  choice: offraient
  rationale: L’imparfait français reflète l’aspect duratif de l’imparfait grec.
- source_word: τὴν ὁλοκαύτωσιν τοῦ ἐνδελεχισμοῦ
  choice: l’holocauste perpétuel
  rationale: « Holocauste » désigne en français biblique une offrande entièrement brûlée; « perpétuel » rend la régularité ou continuité d’ἐνδελεχισμός sans préciser indûment « quotidien ».
- source_word: τὰς εὐχὰς
  choice: les vœux
  rationale: Dans cette énumération cultuelle, εὐχαί peut désigner des vœux; l’ambiguïté avec « prières » est signalée en note.
- source_word: τὰ ἑκούσια δόματα
  choice: les dons volontaires
  rationale: Rend directement le caractère librement consenti des dons.
theological_decisions:
- issue: Traduction de Κυρίου dans un contexte cultuel grec
  choice: Seigneur
  alternative: l’Éternel
  rationale: Le grec porte le titre κύριος sans écrire ici le nom divin hébreu; « Seigneur » respecte donc la forme du texte source.
- issue: Sens cultuel de εὐχαί
  choice: vœux
  alternative: prières
  rationale: La coordination avec l’holocauste et les dons volontaires favorise le sens cultuel de « vœux », sans exclure totalement celui de « prières »; la note préserve cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et lisible. La construction en incise conserve la longue coordination grecque tout en clarifiant que les prêtres et les desservants appartiennent au groupe qui se tient devant le Seigneur.
