  text: And Joakim the high priest[a], who was in Jerusalem in those days, wrote to those living in Bethulia and Betomesthaim, which is opposite Esdraelon, facing the plain near Dothaim,
translation:
  language: fr
  text: Le grand prêtre Joakim[a], qui se trouvait alors à Jérusalem, écrivit aux habitants de Béthulie et de Bétomesthaïm, qui est en face d’Esdrelon, en face de la plaine proche de Dothaïm,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le prêtre, le grand ».'
    reason: literal_rendering
lexical_decisions:
- source_word: ἔγραψεν
  choice: écrivit
  rationale: L’aoriste de γράφω signifie directement « écrivit ». Le texte ne précise pas explicitement qu’il s’agit d’une lettre.
- source_word: ἱερεὺς ὁ μέγας
  choice: le grand prêtre
  rationale: Cette formulation reste proche du grec, littéralement « le prêtre, le grand », tout en étant intelligible en français. Le titre français plus idiomatique « grand-prêtre » est signalé en note.
- source_word: ὃς ἦν ἐν ταῖς ἡμέραις ἐν Ἰερουσαλήμ
  choice: qui se trouvait alors à Jérusalem
  rationale: Rend naturellement la localisation et la valeur temporelle de l’expression grecque sans alourdir la phrase.
- source_word: τοῖς κατοικοῦσι
  choice: aux habitants
  rationale: Le participe désigne les personnes qui résident dans les lieux nommés ; « aux habitants » est naturel et précis en français.
- source_word: Βαιτουλουὰ
  choice: Béthulie
  rationale: Forme française traditionnelle et lisible du nom propre grec.
- source_word: Βαιτομεσθαίμ
  choice: Bétomesthaïm
  rationale: Translittération française proche de la forme grecque.
- source_word: ἀπέναντι
  choice: en face de
  rationale: Exprime directement la relation géographique d’opposition ou de vis-à-vis.
- source_word: κατὰ πρόσωπον
  choice: devant
  rationale: Conserve la seconde indication spatiale sans la confondre avec ἀπέναντι.
- source_word: τοῦ πεδίου
  choice: la plaine
  rationale: πεδίον désigne ici une étendue de terrain plat, naturellement rendue par « plaine ».
- source_word: τοῦ πλησίον Δωθάειμ
  choice: proche de Dothaïm
  rationale: Le génitif avec πλησίον indique la proximité géographique.
theological_decisions:
- issue: Rendu de ἱερεὺς ὁ μέγας
  choice: le grand prêtre
  alternative: le grand-prêtre
  rationale: Le texte principal reflète de façon transparente la tournure grecque, qui signifie littéralement « le prêtre, le grand ». La note donne le titre institutionnel français usuel sans imposer silencieusement cette normalisation.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste fluide tout en conservant les deux indications géographiques distinctes. « Ville » explicite l’antécédent féminin singulier de ἥ, qui renvoie vraisemblablement à Bétomesthaïm, sans ajouter de contenu substantiel.
