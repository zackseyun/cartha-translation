base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/014.yaml
  text: And the Lord heard their voice and looked upon their affliction[b][a], and the people were fasting for many days throughout all Judea and Jerusalem before the holy things of the Lord Almighty.
translation:
  language: fr
  text: Le Seigneur entendit leur voix[a] et regarda leur détresse. Et le peuple jeûnait pendant de nombreux jours dans toute la Judée et à Jérusalem, devant les choses saintes[b] du Seigneur tout-puissant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur cri ». Le grec dit littéralement « leur voix », expression qui peut désigner ici leur appel au secours.
    reason: lexical_alternative
  - marker: b
    text: Ou « le sanctuaire » ou « les lieux saints ». Le grec emploie un pluriel, littéralement « les choses saintes », qui peut désigner des réalités sacrées ou les espaces saints consacrés au Seigneur tout-puissant.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσήκουσεν
  choice: entendit
  rationale: Le verbe désigne ici l’écoute de la prière, avec une possible nuance d’accueil favorable, sans toutefois exprimer explicitement une intervention.
- source_word: τῆς φωνῆς αὐτῶν
  choice: leur voix
  rationale: Cette traduction conserve le sens littéral de φωνή; dans ce contexte de prière et de détresse, «leur cri» reste possible.
- source_word: ἐπεῖδεν
  choice: regarda
  rationale: Le verbe composé évoque un regard attentif porté sur leur situation, et non une simple perception visuelle.
- source_word: τὴν θλίψιν αὐτῶν
  choice: leur détresse
  rationale: «Détresse» rend naturellement la souffrance et la pression subies par le peuple.
- source_word: ἦν ὁ λαὸς νηστεύων
  choice: le peuple jeûnait
  rationale: L’imparfait français restitue la valeur durative de la construction périphrastique grecque.
- source_word: ἡμέρας πλείους
  choice: depuis de nombreux jours
  rationale: La formule indique une durée prolongée; avec l’imparfait, «depuis» exprime naturellement un jeûne qui se poursuivait.
- source_word: ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Ἰερουσαλήμ
  choice: dans toute la Judée et à Jérusalem
  rationale: La formulation française distingue naturellement la région de la ville tout en conservant l’étendue géographique du grec.
- source_word: κατὰ πρόσωπον
  choice: devant
  rationale: Cette locution signifie «devant» ou «en présence de» et convient au cadre cultuel.
- source_word: τῶν ἁγίων
  choice: les choses saintes
  rationale: Le pluriel substantivé demeure volontairement général et ne doit pas être réduit sans certitude au sanctuaire singulier.
- source_word: Κυρίου Παντοκράτορος
  choice: du Seigneur tout-puissant
  rationale: La formule rend κύριος comme titre divin et παντοκράτωρ par son équivalent français courant.
theological_decisions:
- issue: Valeur de κύριος comme titre divin
  choice: Seigneur
  alternative: Maître
  rationale: Dans ce contexte, κύριος fonctionne comme un titre divin; «Seigneur» en conserve la portée sans l’affaiblir.
- issue: Référent cultuel de τῶν ἁγίων
  choice: les choses saintes
  alternative: le sanctuaire / les lieux saints
  rationale: Le grec emploie un pluriel substantivé ambigu. La traduction conserve cette pluralité et évite d’imposer un référent architectural précis.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste fluide tout en conservant l’ambiguïté cultuelle du pluriel grec τῶν ἁγίων.
