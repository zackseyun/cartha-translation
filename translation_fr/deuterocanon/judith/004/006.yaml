  text: And they fortified the villages among them[a], and they stored up food supplies in preparation for war, because their fields had been newly harvested.
translation:
  language: fr
  text: Ils fortifièrent les villages qui s’y trouvaient[a] et constituèrent des réserves de nourriture en prévision de la guerre, car leurs champs venaient d’être moissonnés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les villages en eux ». Le pronom grec a une valeur spatiale condensée ; on peut aussi comprendre : « les villages situés parmi eux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτείχισαντο
  choice: ils fortifièrent
  rationale: Le moyen de τειχίζω exprime ici l’action de rendre les villages défendables, notamment en les entourant de murs. « Fortifièrent » reste clair sans préciser la nature exacte des ouvrages.
- source_word: τὰς ἐν αὐτοῖς κώμας
  choice: les villages qui s’y trouvaient
  rationale: κώμας désigne des villages. La tournure ἐν αὐτοῖς est spatialement condensée et son référent n’est pas explicité dans le verset ; « qui s’y trouvaient » conserve cette relative indétermination.
- source_word: παρέθεντο εἰς ἐπισιτισμὸν
  choice: constituèrent des réserves de nourriture
  rationale: Dans ce contexte, παρέθεντο indique que l’on met de côté, tandis que ἐπισιτισμός renvoie à l’approvisionnement alimentaire. La formulation française exprime naturellement une accumulation volontaire de vivres.
- source_word: εἰς παρασκευὴν πολέμου
  choice: en prévision de la guerre
  rationale: παρασκευή désigne ici la préparation ou les dispositions prises en vue d’un événement. « En prévision de la guerre » rend le but sans employer une tournure lourde.
- source_word: προσφάτως
  choice: venaient d’être
  rationale: L’adverbe indique que la moisson était toute récente. La construction « venaient d’être moissonnés » restitue cette proximité temporelle en français naturel.
- source_word: τεθερισμένα
  choice: moissonnés
  rationale: Le participe parfait passif de θερίζω décrit des champs dont la moisson est achevée, avec un résultat encore pertinent pour la constitution des réserves.
