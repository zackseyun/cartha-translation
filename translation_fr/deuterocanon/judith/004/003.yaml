  yaml_path: translation/deuterocanon/judith/004/003.yaml
  text: for they had only recently come up from the captivity[a], and all the people of Judea had only recently been gathered together[c][b], and the vessels and the altar and the house had been consecrated from the defilement.
translation:
  language: fr
  text: car ils n’étaient remontés de la captivité que récemment[a], et tout le peuple de Judée avait été rassemblé récemment ; les objets du culte, l’autel et la Maison[b] avaient été consacrés après la profanation[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’exil ».
    reason: lexical_alternative
  - marker: b
    text: La « Maison » désigne ici le Temple.
    reason: cultural_note
  - marker: c
    text: Le grec exprime leur consécration à partir d’un état de profanation, soulignant le contraste entre la profanation antérieure et leur restauration à la sainteté.
    reason: translation_note
lexical_decisions:
- source_word: προσφάτως
  choice: ne… que récemment
  rationale: Cette tournure française naturelle souligne la proximité temporelle exprimée par l’adverbe.
- source_word: ἀναβεβηκότες
  choice: étaient remontés
  rationale: Le plus-que-parfait rend la valeur résultative du participe parfait, tandis que « remonter » conserve l’orientation géographique vers la Judée.
- source_word: αἰχμαλωσίας
  choice: la captivité
  rationale: L’article grec renvoie à une captivité déterminée et connue; « captivité » conserve aussi le sens premier du terme.
- source_word: νεωστὶ
  choice: venait à peine de
  rationale: Cette expression idiomatique restitue l’insistance sur le caractère tout récent du rassemblement, sans répéter lourdement « récemment ».
- source_word: συνελέλεκτο
  choice: d’être rassemblé
  rationale: Le passif au plus-que-parfait présente le peuple comme ayant été réuni et reconstitué en communauté.
- source_word: σκεύη
  choice: les ustensiles
  rationale: Dans ce contexte cultuel, le mot désigne les objets employés dans le temple; « ustensiles » est clair et n’ajoute pas l’adjectif implicite « sacrés ».
- source_word: θυσιαστήριον
  choice: l’autel
  rationale: Équivalent français usuel pour l’autel sacrificiel.
- source_word: ὁ οἶκος
  choice: la Maison
  rationale: Le terme signifie littéralement « maison » et désigne ici le temple. La majuscule aide à signaler cet emploi révérenciel sans remplacer le mot source par son référent explicite.
- source_word: ἐκ τῆς βεβηλώσεως ἡγιασμένα
  choice: avaient été consacrés après avoir été profanés
  rationale: Cette formulation française intelligible exprime l’état restauré des objets et du sanctuaire à partir d’une profanation antérieure, tout en évitant l’étrange calque « consacrés hors de la profanation ».
theological_decisions:
- issue: Rapport entre la consécration et la profanation antérieure
  choice: avaient été consacrés après avoir été profanés
  alternative: avaient été rendus saints après la profanation
  rationale: Le grec associe la consécration accomplie à la sortie d’un état de profanation. La traduction conserve la succession et le contraste, sans préciser un rite de purification que le texte ne nomme pas.
- issue: Désignation du temple par ὁ οἶκος
  choice: la Maison
  alternative: le Temple
  rationale: « La Maison » préserve l’image et l’idiome révérenciel du grec; une note identifie clairement le référent afin d’éviter toute obscurité.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le mouvement ternaire du grec et ses deux indications de récence, tout en variant leur expression pour éviter une répétition pesante. « La Maison » garde l’idiome du texte source, explicité en note.
