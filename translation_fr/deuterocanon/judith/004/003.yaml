revisions:
- from: car ils n’étaient remontés que récemment de la captivité[a], tout le peuple de Judée venait à peine d’être rassemblé, et les ustensiles, l’autel et la Maison[b] avaient été consacrés après avoir été profanés[c].
  to: car ils n’étaient remontés de la captivité que récemment[a], et tout le peuple de Judée avait été rassemblé récemment ; les objets du culte, l’autel et la Maison[b] avaient été consacrés après la profanation[c].
  rationale: La révision conserve les deux adverbes grecs de récence et la structure ternaire de la phrase. Elle remplace « ustensiles » par « objets du culte » pour une désignation française plus précise des objets du sanctuaire. Elle rend ἐκ τῆς βεβηλώσεως par « après la profanation », formulation idiomatique qui maintient la restauration consécutive à une profanation sans imposer un mécanisme rituel ou un sens technique non explicitement formulé par le grec. La note précise la nuance de façon non calquée.
