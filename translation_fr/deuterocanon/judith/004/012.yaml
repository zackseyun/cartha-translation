  naturalness: Le français est globalement moderne, clair et d’un registre convenant au récit. « Étendirent leurs étoffes de sac » est plus direct et moins lourd que « déployèrent leurs vêtements de toile de sac ». La coordination « tous les hommes…, toutes les femmes et tous les enfants » rend aussi l’énumération grecque plus nette.
  terminology: « Le temple », « face contre terre », « cendre », « étoffes de sac » et « le Seigneur » sont appropriés. « Étoffes de sac » conserve le caractère matériel et rituel de σάκκους sans imposer que ces étoffes soient nécessairement des vêtements.
