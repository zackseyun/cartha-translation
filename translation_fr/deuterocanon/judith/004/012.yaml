  yaml_path: translation/deuterocanon/judith/004/012.yaml
  text: And every man of Israel[a], and the women and the children, those dwelling in Jerusalem, fell on their faces before the temple, and put ashes on their heads, and spread out their sackcloth before the Lord,
translation:
  language: fr
  text: Tous les hommes d’Israël, toutes les femmes et tous les enfants qui habitaient Jérusalem tombèrent face contre terre devant le temple. Ils se couvrirent la tête de cendre et étendirent leurs étoffes de sac devant le Seigneur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque est inhabituelle. Elle peut désigner le fait d’étendre leurs étoffes de sac devant le Seigneur; elle peut aussi évoquer leur propre extension ou prosternation en toile de sac, en signe de deuil et de supplication.
    reason: Préserver l’incertitude sur le geste physique décrit par ἐξέτειναν τοὺς σάκκους αὐτῶν, sans imposer que les σάκκοι soient des vêtements.
lexical_decisions:
- source_word: πᾶς ἀνὴρ Ἰσραήλ
  choice: tous les hommes d’Israël
  rationale: Le nom ἀνήρ désigne ici les hommes, distinctement des femmes et des enfants mentionnés ensuite. Le pluriel français exprime naturellement la portée distributive de πᾶς.
- source_word: γυνὴ καὶ παιδία
  choice: les femmes et les enfants
  rationale: Dans cette énumération collective, γυνή a valeur plurielle et ne précise pas le statut matrimonial; παιδία désigne les enfants sans imposer un âge plus étroit.
- source_word: οἱ κατοικοῦντες ἐν Ἰερουσαλήμ
  choice: qui habitaient Jérusalem
  rationale: La relative se rapporte naturellement à l’ensemble énuméré. En français moderne, « habiter Jérusalem » est plus fluide que « demeurer dans Jérusalem ».
- source_word: ἔπεσον κατὰ πρόσωπον τοῦ ναοῦ
  choice: tombèrent face contre terre devant le temple
  rationale: L’expression décrit une prosternation corporelle orientée vers le temple. « Face contre terre » est clair, concret et idiomatique.
- source_word: ἐσποδώσαντο τὰς κεφαλὰς αὐτῶν
  choice: se couvrirent la tête de cendre
  rationale: Le verbe évoque l’application de cendre sur la tête comme geste de deuil et de supplication. Le singulier distributif « la tête » est naturel en français.
- source_word: ἐξέτειναν τοὺς σάκκους αὐτῶν
  choice: déployèrent leurs vêtements de toile de sac
  rationale: ἐκτείνω indique l’action d’étendre ou de déployer; σάκκους désigne ici vraisemblablement des étoffes ou vêtements de deuil en toile grossière. La formulation garde l’action concrète tout en signalant l’ambiguïté par une note.
- source_word: κατὰ πρόσωπον Κυρίου
  choice: devant le Seigneur
  rationale: Cette locution biblique signifie « en présence du Seigneur ». « Devant le Seigneur » en conserve l’image et reste naturel.
- source_word: Κυρίου
  choice: le Seigneur
  rationale: Dans ce contexte juif, le titre renvoie au Dieu d’Israël; « le Seigneur » est la traduction française traditionnelle et intelligible de κύριος.
theological_decisions:
- issue: Énumération sexuée et générationnelle de l’assemblée
  choice: Conserver la mention distincte des hommes, des femmes et des enfants.
  alternative: Réunir le groupe sous la formule « tous les Israélites ».
  rationale: Le grec énumère explicitement ces trois groupes. Les fusionner effacerait un élément rhétorique et sémantique du texte.
- issue: Référent de κύριος
  choice: Traduire par « le Seigneur ».
  alternative: Employer « Dieu » ou translittérer un nom divin.
  rationale: Le texte grec porte κύριος. « Le Seigneur » traduit directement ce titre sans préciser au-delà du texte grec la forme du nom divin sous-jacent.
- issue: Nature du geste accompli avec la toile de sac
  choice: Rendre le geste concret par « déployèrent leurs vêtements de toile de sac », avec une note.
  alternative: Comprendre qu’ils s’étendirent eux-mêmes, vêtus de toile de sac.
  rationale: La construction grecque prend τοὺς σάκκους comme objet direct de ἐξέτειναν, ce qui favorise l’idée d’étendre les étoffes; l’expression demeure toutefois inhabituelle et ne permet pas de déterminer avec certitude le geste physique exact.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été divisée en deux phrases pour la lisibilité, sans modifier la succession des gestes. « Toile de sac » conserve le symbole biblique de deuil tout en restant compréhensible; « vêtements » explicite l’emploi concret probable de σάκκους sans supprimer l’autre possibilité signalée en note.
