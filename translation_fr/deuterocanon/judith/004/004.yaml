lexical_decisions:
- source_word: ἀπέστειλαν
  choice: ils envoyèrent des messagers
  rationale: Le verbe signifie simplement « envoyer », sans complément exprimé. Dans ce contexte de mobilisation et d’énumération de destinations, « des messagers » explicite sobrement le moyen implicite, tout en évitant l’expression moins naturelle « envoyer un message dans ».
- source_word: εἰς πᾶν ὅριον Σαμαρίας
  choice: dans tout le territoire de Samarie
  rationale: ὅριον peut désigner une frontière, une région ou un territoire. Avec πᾶν et parmi des destinations, le sens territorial est le plus naturel.
- source_word: Κωνὰ
  choice: Kona
  rationale: Transcription proche de la forme grecque, l’identification exacte du lieu restant incertaine.
- source_word: Βαιθωρὼν
  choice: Beth-Horon
  rationale: Forme française biblique usuelle du toponyme, avec trait d’union pour rendre lisible son caractère composé.
- source_word: Βαιλμὰιν
  choice: Belmaïm
  rationale: Transcription française lisible et proche de la forme grecque; le tréma indique que les voyelles se prononcent séparément.
- source_word: Ἰερειχὼ
  choice: Jéricho
  rationale: Forme française consacrée du toponyme bien connu.
- source_word: Χωβὰ
  choice: Choba
  rationale: Transcription directe de la forme grecque, sans identification géographique conjecturale.
- source_word: Αἰσωρὰ
  choice: Aïsora
  rationale: Transcription proche du grec; le tréma clarifie la prononciation française et l’identification du lieu demeure incertaine.
- source_word: τὸν αὐλῶνα Σαλήμ
  choice: la vallée de Salem
  rationale: αὐλών peut désigner une vallée, un vallon ou un creux assez large. « Vallée » est ici le terme français courant le plus clair, sans exclure la possibilité topographique d’une plaine encaissée.
