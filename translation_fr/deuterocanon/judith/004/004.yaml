translation:
  language: fr
  text: Ils envoyèrent des messagers dans tout le territoire de Samarie[a], ainsi qu’à Kona, Beth-Horon, Belmaïn, Jéricho, Choba, Aïsora et dans la vallée de Salem[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans toute la région de Samarie » ; le mot grec peut désigner une frontière, une région ou un territoire.
    reason: lexical_alternative
  - marker: b
    text: Ou « la plaine de Salem » ; le grec αὐλών peut désigner une vallée, un vallon ou une dépression en forme de plaine.
    reason: lexical_alternative
  - marker: c
    text: Plusieurs noms de lieux de ce verset sont transcrits d’après le grec, car leur identification exacte demeure incertaine.
