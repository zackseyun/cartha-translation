  text: And every man of Israel cried out to God with great intensity[a], and they humbled themselves with great intensity[b],
translation:
  language: fr
  text: Tous les hommes d’Israël crièrent vers Dieu avec une grande ferveur[a], et ils s’humilièrent avec une grande ferveur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec une grande intensité ». La même expression grecque est répétée dans les deux propositions pour souligner l’intensité des deux actions.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ils humilièrent leurs âmes » ; l’expression peut signifier idiomatiquement « ils s’humilièrent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεβόησαν
  choice: crièrent
  rationale: Le verbe exprime un cri puissant adressé à Dieu. « Crièrent vers Dieu » conserve à la fois la force du cri et son orientation priante.
- source_word: πᾶς ἀνὴρ Ἰσραήλ
  choice: tous les hommes d’Israël
  rationale: Cette formulation française naturelle respecte le terme masculin ἀνήρ et rend collectivement le singulier distributif grec, dont le verbe est au pluriel.
- source_word: πρὸς τὸν θεόν
  choice: vers Dieu
  rationale: Dans ce contexte de supplication, « vers Dieu » exprime naturellement le destinataire et l’orientation du cri.
- source_word: ἐν ἐκτενείᾳ μεγάλῃ
  choice: avec une grande ferveur
  rationale: L’expression désigne une application intense et soutenue. « Ferveur » convient au contexte religieux et peut porter sur les deux actions; sa répétition reproduit l’insistance du grec.
- source_word: ἐταπείνουσαν
  choice: s’humilièrent
  rationale: Le verbe signifie abaisser ou humilier. La forme pronominale est naturelle en français dans un contexte de pénitence ou de jeûne.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: s’
  rationale: Littéralement « leurs âmes », cette expression désigne ici les personnes elles-mêmes. La tournure pronominale restitue cet idiome sans imposer une distinction anthropologique au lecteur.
theological_decisions:
- issue: Portée masculine de πᾶς ἀνὴρ Ἰσραήλ
  choice: tous les hommes d’Israël
  alternative: tous les Israélites
  rationale: Le grec emploie explicitement ἀνήρ, « homme », et non un terme générique désignant le peuple; la traduction conserve donc cette précision.
- issue: Valeur de τὰς ψυχὰς αὐτῶν
  choice: ils s’humilièrent
  alternative: ils humilièrent leurs âmes
  rationale: « Leurs âmes » peut être un idiome sémitisant pour « eux-mêmes ». La traduction principale privilégie un français naturel, tandis que la note préserve la formulation littérale et son éventuelle portée.
- issue: Répétition de ἐν ἐκτενείᾳ μεγάλῃ
  choice: répéter « avec une grande ferveur » dans les deux propositions
  alternative: ne l’exprimer qu’une fois
  rationale: La répétition est emphatique dans le texte grec et porte distinctement sur le cri comme sur l’humiliation; elle est donc maintenue.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme coordonné et la répétition volontaire gardent la solennité ainsi que l’insistance du grec, sans rendre la syntaxe artificielle.
