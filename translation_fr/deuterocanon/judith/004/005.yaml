lexical_decisions:
- source_word: προκατελάβοντο
  choice: prirent position à l’avance
  rationale: Le verbe composé exprime une prise de contrôle anticipée, ici dans un contexte de préparation défensive. Cette formulation française conserve à la fois l’idée d’occupation stratégique et celle d’anticipation.
- source_word: πάσας
  choice: tous
  rationale: L’adjectif a une portée exhaustive et s’accorde naturellement en français avec « les sommets ».
- source_word: κορυφὰς
  choice: sommets
  rationale: Le terme désigne le point culminant ou la partie supérieure d’une montagne; « sommets » convient au cadre géographique et militaire.
- source_word: ὀρέων
  choice: montagnes
  rationale: C’est le sens courant du nom grec, et le contexte ne justifie pas l’affaiblissement en « collines ».
- source_word: ὑψηλῶν
  choice: hautes
  rationale: L’adjectif décrit directement les montagnes et se rend de façon naturelle et claire par « hautes ».
