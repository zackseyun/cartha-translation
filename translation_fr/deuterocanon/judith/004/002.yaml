  yaml_path: translation/deuterocanon/judith/004/002.yaml
  text: And they were very, very afraid because of him, and they were troubled about Jerusalem and the temple of the Lord their God.
translation:
  language: fr
  text: Ils furent très, très effrayés à cause de lui, et ils furent troublés au sujet de Jérusalem et du temple du Seigneur leur Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφοβήθησαν σφόδρα σφόδρα
  choice: furent très, très effrayés
  rationale: La répétition inhabituelle de σφόδρα intensifie fortement la peur; la conserver en français respecte l’emphase explicite du grec.
- source_word: ἀπὸ προσώπου αὐτοῦ
  choice: à cause de lui
  rationale: L’expression littérale «de devant sa face» fonctionne ici comme un idiome indiquant que cet homme est la cause de leur peur; la formulation retenue est naturelle sans ajouter d’interprétation.
- source_word: ἐταράχθησαν
  choice: furent bouleversés
  rationale: Le verbe exprime un trouble profond ou une vive agitation; «bouleversés» en garde la force sans le réduire à une simple inquiétude.
- source_word: περὶ Ἰερουσαλὴμ καὶ τοῦ ναοῦ
  choice: pour Jérusalem et pour le temple
  rationale: Dans ce contexte de menace, περί marque l’objet de leur préoccupation. La répétition de «pour» rend clairement en français les deux réalités concernées.
theological_decisions:
- issue: Rapport entre les titres Κυρίου et θεοῦ αὐτῶν
  choice: du Seigneur leur Dieu
  alternative: du Seigneur, leur Dieu
  rationale: Le grec présente une expression continue, «du Seigneur Dieu d’eux». Sans virgule, le français conserve naturellement l’unité du titre et évite de transformer «leur Dieu» en apposition plus nettement marquée que dans la source.
translation_notes:
  register: 'Français moderne, clair et digne. La répétition «très, très» est volontaire: elle reproduit l’insistance remarquable du texte grec plutôt que de la lisser en un simple superlatif.'
