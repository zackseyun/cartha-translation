base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/011.yaml
  text: They themselves and their wives and their little children and their livestock—and every resident alien or hired worker or purchased servant among them—put sackcloth on their waists[a][b][c].
translation:
  language: fr
  text: Eux-mêmes, leurs femmes, leurs tout-petits et leur bétail — ainsi que tout étranger résidant parmi eux[a], tout travailleur salarié ou tout esclave acheté[b] — mirent des sacs autour de leur taille[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout résident étranger » ou « tout immigré ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « acheté avec de l’argent » : il s’agit d’un esclave acquis par achat.'
    reason: lexical_alternative
  - marker: c
    text: Porter des sacs était un signe de deuil, d’humiliation ou de supplication.
    reason: cultural_note
lexical_decisions:
- source_word: νήπια
  choice: tout-petits
  rationale: Le terme désigne de très jeunes enfants sans les limiter nécessairement aux nourrissons; « tout-petits » est naturel en français moderne.
- source_word: κτήνη
  choice: bétail
  rationale: Le mot grec désigne collectivement les animaux domestiques considérés comme biens; « bétail » convient au contexte.
- source_word: πάροικος
  choice: étranger résidant parmi eux
  rationale: Cette formulation exprime à la fois l’origine étrangère et la résidence au sein de la communauté, nuance sociale portée par πάροικος.
- source_word: μισθωτός
  choice: travailleur salarié
  rationale: Le terme désigne une personne qui travaille contre rémunération; cette traduction moderne évite le désuet « mercenaire » dans ce contexte.
- source_word: ἀργυρώνητος
  choice: esclave acheté
  rationale: Le mot signifie littéralement « acheté avec de l’argent » et indique une personne acquise comme propriété; « esclave » ne masque pas ce statut.
- source_word: ἐπέθεντο σάκκους
  choice: se couvrirent ... de toile de sac
  rationale: La tournure grecque décrit le fait de revêtir le sac; « toile de sac » est l’expression française usuelle pour ce vêtement rituel.
- source_word: ἐπὶ τὰς ὀσφύας αὐτῶν
  choice: la taille
  rationale: ὀσφύες renvoie à la région des reins ou de la taille; « la taille » est clair et actuel.
theological_decisions:
- issue: Statut servile exprimé par ἀργυρώνητος
  choice: esclave acheté
  alternative: serviteur acheté; personne achetée avec de l’argent
  rationale: Le composé grec rend explicite l’acquisition par achat. Traduire « esclave » préserve cette réalité sociale sans l’adoucir ni ajouter une interprétation confessionnelle.
- issue: Relation entre les catégories πάροικος, μισθωτός et ἀργυρώνητος
  choice: catégories coordonnées, avec « ou » devant la dernière
  alternative: « étranger résident ou travailleur salarié et esclave acheté »
  rationale: La suite grecque πᾶς πάροικος ἢ μισθωτὸς καὶ ἀργυρώνητος présente une coordination irrégulière. La formulation française traite naturellement ces termes comme des catégories incluses dans « tout », sans faire d’un même individu à la fois un salarié et un esclave acheté.
translation_notes:
  register: Français international moderne, digne et accessible. Les tirets rendent lisible la longue énumération. « Tout-petits », « travailleur salarié » et « la taille » évitent un vocabulaire archaïque, tandis que « esclave acheté » conserve sans euphémisme la réalité du texte grec.
