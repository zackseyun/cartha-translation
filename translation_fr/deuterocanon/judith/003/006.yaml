  text: And he and his force went down to the coast[a], and he garrisoned the high cities, and they took chosen men from them into alliance.
translation:
  language: fr
  text: Il descendit vers la région côtière avec ses forces, plaça des garnisons dans les villes situées sur les hauteurs, et ils prirent[a] de ces villes des hommes choisis pour les faire entrer dans une alliance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie ici un verbe au pluriel (« ils prirent »), alors que les verbes précédents sont au singulier (« il descendit », « plaça »). Le pluriel peut désigner les forces agissant sous son commandement ; certaines traductions harmonisent la phrase en mettant aussi ce verbe au singulier.
    reason: Le changement de nombre dans le texte grec crée une ambiguïté grammaticale qu’il convient de conserver et d’expliquer.
lexical_decisions:
- source_word: κατέβη
  choice: descendit
  rationale: Le verbe exprime un déplacement vers le bas. « Descendit » conserve ce sens directionnel sans ajouter explicitement l’idée d’une marche militaire.
- source_word: παραλίαν
  choice: la région côtière
  rationale: παραλία peut désigner le littoral ou la région du bord de mer. « Région côtière » est naturel en français et garde cette portée géographique.
- source_word: δύναμις
  choice: ses forces
  rationale: Dans ce contexte militaire, δύναμις désigne les forces armées sous son commandement. Le pluriel français est idiomatique et évite de préciser indûment qu’il s’agit d’une armée au sens institutionnel.
- source_word: ἐφρούρησε
  choice: plaça une garnison dans
  rationale: Avec des villes comme complément, le verbe indique qu’il les fit garder militairement. Cette formulation française rend clairement l’idée sans laisser entendre qu’Holoferne montait lui-même la garde.
- source_word: πόλεις τὰς ὑψηλάς
  choice: les villes situées sur les hauteurs
  rationale: ὑψηλάς signifie littéralement « hautes ». La formulation explicite le sens topographique naturel sans transformer l’adjectif en une indication non exprimée de fortification.
- source_word: ἔλαβον
  choice: ils prirent
  rationale: La forme grecque est au pluriel, contrairement aux verbes singuliers qui précèdent. La traduction conserve ce changement de nombre au lieu de l’harmoniser silencieusement.
- source_word: ἄνδρας ἐπιλέκτους
  choice: des hommes choisis
  rationale: La traduction conserve à la fois la référence masculine explicite de ἄνδρας et l’idée de sélection portée par ἐπιλέκτους.
- source_word: ἐξ αὐτῶν
  choice: dans ces villes
  rationale: Le pronom renvoie naturellement aux villes mentionnées juste avant. Cette tournure restitue en français l’idée que les hommes en furent tirés.
- source_word: εἰς συμμαχίαν
  choice: pour les intégrer à leur alliance
  rationale: La préposition εἰς marque ici l’entrée ou l’incorporation dans une alliance. La formulation garde la dimension politico-militaire du terme.
