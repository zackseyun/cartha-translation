base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/003/002.yaml
  text: Look[a], we, the servants of Nebuchodonosor the great king, lie before you[b]; deal with us as is pleasing in your sight.
translation:
  language: fr
  text: 'Voici : nous, les serviteurs de Nabuchodonosor, le grand roi, sommes étendus devant toi ; traite-nous comme bon te semblera.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon ce qui est agréable à ton visage » ; autrement dit : « comme il te plaira ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Voici
  rationale: Particule d'appel qui attire l'attention et introduit la déclaration de soumission ; « Voici » garde cette force dans un registre digne et courant.
- source_word: παῖδες
  choice: serviteurs
  rationale: Dans cette formule de cour, le mot désigne avec déférence des subordonnés du roi, sans imposer le sens d'enfants ni préciser un statut juridique d'esclaves.
- source_word: Ναβουχοδονοσὸρ
  choice: Nabuchodonosor
  rationale: Cette forme française traditionnelle correspond directement à la forme grecque du nom dans le témoin source.
- source_word: βασιλέως μεγάλου
  choice: du grand roi
  rationale: Conserve explicitement la qualification honorifique de la titulature royale.
- source_word: παρακείμεθα ἐνώπιόν σου
  choice: nous nous tenons devant toi
  rationale: Rend naturellement la présence offerte et la posture de soumission exprimées par le parfait moyen-passif et par « devant toi », sans suggérer en français qu'ils sont physiquement couchés.
- source_word: χρῆσαι ἡμῖν
  choice: traite-nous
  rationale: Dans ce contexte de reddition, l'impératif demande au destinataire de disposer d'eux à son gré ; « traite-nous » est naturel et conserve la portée ouverte du verbe.
- source_word: καθὼς ἀρεστόν ἐστιν τῷ προσώπῳ σου
  choice: comme bon te semblera
  rationale: Expression française idiomatique qui restitue ce qui plaît au destinataire, tandis qu'une note conserve l'image grecque littérale du visage.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La reprise « nous… nous » conserve l'insistance du grec ἡμεῖς tout en restant naturelle. Le tutoiement correspond au singulier grec et au discours direct adressé à Holopherne.
