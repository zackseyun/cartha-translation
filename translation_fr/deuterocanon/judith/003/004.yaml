  yaml_path: translation/deuterocanon/judith/003/004.yaml
  text: Look[a], our cities also, and those who live in them, are your servants; come and deal with them as is good in your eyes.
translation:
  language: fr
  text: Voici que nos villes, ainsi que ceux qui les habitent, sont tes esclaves[a]. Viens donc et traite-les comme bon te semblera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteurs ». Le mot grec peut avoir les deux sens, mais il souligne probablement ici la sujétion imposée par la conquête.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Voici que
  rationale: Introduit avec emphase ce qui est présenté à Holopherne; « Voici que » garde la valeur déictique dans un registre digne et actuel.
- source_word: πόλεις
  choice: villes
  rationale: Rend directement le sens ordinaire de πόλεις, qui désigne ici les centres urbains soumis.
- source_word: οἱ κατοικοῦντες ἐν αὐταῖς
  choice: ceux qui les habitent
  rationale: Conserve la valeur verbale du participe et son lien explicite avec les villes, dans un français naturel.
- source_word: δοῦλοί
  choice: esclaves
  rationale: Dans ce contexte de capitulation devant une puissance conquérante, le terme exprime une sujétion totale; « serviteurs » en atténuerait la force.
- source_word: ἐλθὼν
  choice: Viens donc
  rationale: Le participe aoriste associé à l'impératif suivant se rend naturellement par une injonction coordonnée; « donc » marque souplement la conséquence de leur soumission.
- source_word: ἀπάντησον αὐταῖς
  choice: traite-les
  rationale: Le verbe peut littéralement évoquer le fait d'aller à la rencontre, mais avec les villes et leurs habitants comme référents dans une scène de reddition, il signifie ici agir envers eux; « traite-les » préserve cette relative ouverture.
- source_word: ὡς ἔστιν ἀγαθὸν ἐν ὀφθαλμοῖς σου
  choice: comme bon te semblera
  rationale: Rend idiomatiquement l'expression grecque signifiant agir selon son propre jugement ou bon plaisir, sans conserver un calque peu naturel en français.
theological_decisions:
- issue: Sens de δοῦλοι dans un contexte de soumission politique
  choice: esclaves
  alternative: serviteurs
  rationale: Les locuteurs offrent les villes et leurs habitants à l'autorité absolue du conquérant. « Esclaves » exprime cette sujétion coercitive, tandis que « serviteurs » pourrait suggérer un service volontaire ou seulement administratif.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation évite l'archaïsme « ce qui est bon à tes yeux » tout en gardant l'idée du pouvoir discrétionnaire d'Holopherne. Le pronom « les » reprend collectivement les villes et leurs habitants.
