base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/003/008.yaml
  text: And he tore down all their borders and cut down their sacred groves; and it had been granted to him to destroy all the gods of the land, so that all the nations might worship him alone—Nebuchadnezzar—and that all their tongues and all their tribes might call on him as god.
translation:
  language: fr
  text: Il détruisit toutes leurs frontières et abattit leurs bosquets sacrés. Il avait reçu l’autorisation de détruire tous les dieux du pays, afin que toutes les nations rendent un culte à Nabuchodonosor seul, et que tous ceux qui parlaient leurs langues, ainsi que toutes leurs tribus, l’invoquent comme dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅρια
  choice: frontières
  rationale: Le terme désigne d’abord des limites ou frontières. Cette traduction conserve l’image concrète du texte sans lui substituer une interprétation cultuelle.
- source_word: ἄλση
  choice: bosquets sacrés
  rationale: Dans ce contexte religieux, ἄλση désigne des bois ou bosquets consacrés au culte, et non de simples espaces boisés.
- source_word: ἐξολοθρεῦσαι
  choice: faire disparaître
  rationale: Rend l’idée d’élimination totale des dieux et de leur culte, tout en évitant la formulation littéralement étrange « tuer des dieux ».
- source_word: λατρεύσωσι
  choice: rendent un culte
  rationale: Le verbe exprime ici un service cultuel ou religieux, plus précisément que le simple fait de servir.
- source_word: γλῶσσαι
  choice: langues
  rationale: Traduction formelle qui préserve l’énumération distincte des nations, des langues et des tribus.
- source_word: ἐπικαλέσωνται αὐτὸν εἰς θεόν
  choice: l’invoquent comme dieu
  rationale: Conserve le sens religieux d’ἐπικαλέομαι et la prétention à la divinité exprimée par εἰς θεόν.
theological_decisions:
- issue: L’origine de l’autorisation accordée à Nabuchodonosor
  choice: « Il lui avait été donné » sans nommer celui qui l’avait accordée
  alternative: « Dieu lui avait permis »
  rationale: Le grec emploie une tournure passive sans agent explicite. La traduction préserve cette ambiguïté au lieu d’identifier théologiquement l’auteur de l’autorisation.
- issue: La prétention de Nabuchodonosor à la divinité
  choice: « à lui seul, Nabuchodonosor » et « comme dieu »
  alternative: Atténuer en « comme un dieu » ou « comme leur souverain »
  rationale: Le texte présente explicitement un culte exclusif rendu à Nabuchodonosor et son invocation en qualité de dieu; cette tension doit rester visible.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsmes. La syntaxe garde l’enchaînement solennel du grec, tandis que deux phrases facilitent la lecture. « Nabuchodonosor » est placé en apposition pour rendre clairement αὐτῷ μόνῳ τῷ Ναβουχοδονοσόρ.
