revisions:
- from: Il démolit toutes leurs frontières et abattit leurs bosquets sacrés. Il lui avait été donné de faire disparaître tous les dieux du pays, afin que toutes les nations rendent un culte à lui seul, Nabuchodonosor, et que toutes leurs langues et toutes leurs tribus l’invoquent comme dieu.
  to: Il détruisit toutes leurs frontières et abattit leurs bosquets sacrés. Il avait reçu l’autorisation de détruire tous les dieux du pays, afin que toutes les nations rendent un culte à Nabuchodonosor seul, et que tous ceux qui parlaient leurs langues, ainsi que toutes leurs tribus, l’invoquent comme dieu.
  rationale: Révision limitée à des formulations françaises plus naturelles. Le passif grec est conservé par une autorisation sans agent explicite; « détruire » traduit directement ἐξολοθρεῦσαι. L’exclusivité du culte et l’invocation de Nabuchodonosor « comme dieu » demeurent explicites. L’explicitation des locuteurs des langues évite une personnification peu naturelle en français, sans modifier le référent collectif du grec.
