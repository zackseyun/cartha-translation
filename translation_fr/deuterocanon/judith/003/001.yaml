  text: And they sent messengers to him with peaceful words[a], saying,
translation:
  language: fr
  text: 'Ils lui envoyèrent des messagers avec des paroles de paix[a], pour lui dire :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec des paroles pacifiques » ou « avec des conditions de paix ». L’expression grecque peut désigner des propos conciliants ou les conditions d’une offre de paix.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλαν
  choice: envoyèrent
  rationale: L’aoriste de ἀποστέλλω exprime ici simplement l’envoi; le passé simple convient au registre narratif français.
- source_word: πρὸς αὐτόν
  choice: lui
  rationale: Avec le verbe « envoyer », πρὸς suivi de l’accusatif désigne le destinataire; le pronom indirect est naturel en français.
- source_word: ἀγγέλους
  choice: des messagers
  rationale: Le contexte désigne des représentants humains. « Messagers » reste plus proche et moins interprétatif que « émissaires » ou « ambassadeurs ».
- source_word: λόγοις εἰρηνικοῖς
  choice: avec des paroles de paix
  rationale: Cette formulation conserve explicitement λόγοις et la valeur pacifique de εἰρηνικοῖς, sans trancher entre un discours conciliant et une proposition de paix.
- source_word: λέγοντες
  choice: en disant
  rationale: Le participe présent introduit le contenu du message; « en disant » restitue clairement son lien avec les messagers.
theological_decisions: []
