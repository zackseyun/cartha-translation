  yaml_path: translation/deuterocanon/judith/003/010.yaml
  text: And they encamped between Gaibai and the city of the Scythians[a], and he was there for a full month[c][b], to gather all the full complement of his forces.
translation:
  language: fr
  text: Ils établirent leur camp entre Gaïbaï et la ville des Scythes[a]. Il resta là un mois entier[b], afin de rassembler toutes les ressources nécessaires à ses forces[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Scythopolis » ; le grec dit littéralement « la ville des Scythes ».
    reason: alternative_reading
  - marker: b
    text: Le grec dit littéralement « un mois de jours », expression idiomatique désignant un mois entier.
    reason: lexical_alternative
  - marker: c
    text: Ou « tout l’équipement » ou « l’effectif complet » ; le terme grec peut désigner l’ensemble des ressources militaires, l’équipement complet ou l’effectif au complet.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεστρατοπέδευσαν
  choice: établirent leur camp
  rationale: Le verbe désigne l’installation d’un camp militaire; cette tournure est naturelle en français tout en conservant la portée militaire.
- source_word: ἀνὰ μέσον
  choice: entre
  rationale: Devant deux lieux, « entre » rend idiomatiquement la relation spatiale.
- source_word: Γαιβαὶ
  choice: Gaïbaï
  rationale: Translittération française directe du toponyme grec, sans l’identifier à un autre lieu conjectural.
- source_word: Σκυθῶν πόλεως
  choice: la ville des Scythes
  rationale: Rend directement la construction grecque tout en restant naturel en français; le nom traditionnel Scythopolis est signalé en note.
- source_word: ἦν ἐκεῖ
  choice: Il resta là
  rationale: Le verbe grec est au singulier et renvoie naturellement au commandant dans le contexte; « resta » exprime ici la durée indiquée par l’accusatif temporel.
- source_word: μῆνα ἡμερῶν
  choice: un mois entier
  rationale: Littéralement « un mois de jours », expression idiomatique d’origine sémitisante; « un mois entier » en communique naturellement la valeur temporelle.
- source_word: συλλέξαι
  choice: afin de rassembler
  rationale: L’infinitif articulé avec εἰς exprime le but; « afin de » le marque clairement.
- source_word: ἀπαρτίαν
  choice: l’ensemble des effectifs
  rationale: Dans ce contexte militaire, le terme évoque la totalité requise ou l’effectif complet, sans le réduire exclusivement au matériel.
- source_word: δυνάμεως αὐτοῦ
  choice: de ses forces
  rationale: δύναμις désigne ici les forces militaires plutôt que la puissance abstraite.
