lexical_decisions:
- source_word: παρεγένοντο
  choice: se rendirent auprès de
  rationale: Le verbe exprime ici le fait de venir ou d’arriver auprès de quelqu’un. « Se rendirent auprès de » convient au déplacement des messagers et reste naturel dans un récit.
- source_word: οἱ ἄνδρες
  choice: les hommes
  rationale: Le groupe nominal masculin pluriel désigne directement les hommes envoyés précédemment; la traduction conserve cette référence explicite.
- source_word: ἀπήγγειλαν
  choice: rapportèrent
  rationale: Le verbe désigne la transmission d’un message ou d’un compte rendu. « Rapportèrent » convient précisément au contexte de messagers.
- source_word: κατὰ τὰ ῥήματα ταῦτα
  choice: ces paroles
  rationale: Dans cet emploi, κατά avec l’accusatif indique que le rapport correspond aux paroles précédentes. La formulation française est fluide, tandis que la note conserve la structure plus littérale et sa possible insistance sur la conformité verbale.
