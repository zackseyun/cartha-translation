  yaml_path: translation/deuterocanon/judith/003/003.yaml
  text: Look[a], our homesteads and every field of wheat and the flocks and the herds and all the enclosures of our tents lie before you[b]; use them as pleases you.
translation:
  language: fr
  text: 'Voici[a] nos domaines ruraux, tous les champs de blé, nos troupeaux et notre gros bétail, ainsi que tous les enclos de nos tentes[b] : tout cela se trouve devant toi. Utilise-les comme bon te semble.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Regarde ». Le grec introduit ici ce que les interlocuteurs présentent au destinataire.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « tous les enclos de nos tentes ». L’expression peut désigner des espaces délimités associés au campement ou au bétail.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδοὺ
  choice: Voici
  rationale: Marque naturellement l’appel à l’attention et la présentation de biens placés devant le destinataire, sans archaïsme.
- source_word: ἐπαύλεις
  choice: domaines ruraux
  rationale: Le terme désigne des demeures ou propriétés établies à la campagne; ce choix conserve à la fois les dimensions résidentielle et agricole.
- source_word: πᾶν πεδίον πυρῶν
  choice: tous nos champs de blé
  rationale: Rend clairement les terres cultivées en blé. Le singulier distributif grec πᾶν est exprimé naturellement par le pluriel français.
- source_word: ποίμνια καὶ τὰ βουκόλια
  choice: troupeaux de petit et de gros bétail
  rationale: Explicite la distinction entre les troupeaux d’ovins ou caprins et les troupeaux de bovins, difficile à reproduire par deux emplois successifs de « troupeaux ».
- source_word: μάνδραι τῶν σκηνῶν ἡμῶν
  choice: enclos de nos tentes
  rationale: Conserve l’expression grecque inhabituelle sans préciser indûment s’il s’agit de parcs à bétail ou d’espaces délimités autour du campement.
- source_word: παράκεινται πρὸ προσώπου σου
  choice: tout est à ta disposition
  rationale: Exprime la portée idiomatique de biens placés devant quelqu’un et livrés à son usage; la métaphore spatiale demeure expliquée en note.
- source_word: χρῆσαι καθʼ ὃ ἂν ἀρέσκῃ σοι
  choice: Sers-t’en comme bon te semblera
  rationale: Rend l’invitation impérative et la liberté accordée au destinataire dans un français naturel et déférent.
