translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond au singulier grec et au discours direct adressé à un supérieur. La formulation évite des termes régionaux comme « fermes familiales » ou « exploitations », qui préciseraient excessivement ἐπαύλεις.
