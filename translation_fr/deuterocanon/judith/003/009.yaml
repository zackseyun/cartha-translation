  text: And he came to the front of Esdrelon[a], near Dothaia, which is opposite the great ridge of Judea[b],
translation:
  language: fr
  text: Il arriva en face d’Esdrélon[a], près de Dotaïa, qui se trouve vis-à-vis de la grande crête de Judée[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant Esdrélon » ; l’expression grecque peut désigner plusieurs positions spatiales très proches.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la grande scie de Judée ». Le mot « scie » est probablement employé comme image d’une crête montagneuse dentelée ou d’un escarpement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ πρόσωπον
  choice: en face de
  rationale: Avec le verbe de mouvement ἦλθεν, l’expression indique l’arrivée devant un lieu ou face à lui. « En face de » est naturel en français tout en conservant la valeur spatiale sans la préciser excessivement.
- source_word: Ἐσδρηλών
  choice: Esdrélon
  rationale: Translittération française de la forme grecque du toponyme, sans harmonisation avec le nom plus familier de Jizréel.
- source_word: πλησίον
  choice: près de
  rationale: Équivalent français courant exprimant simplement la proximité.
- source_word: Δοταίας
  choice: Dotaïa
  rationale: Translittération de la forme grecque, plutôt qu’identification ou harmonisation avec Dothân.
- source_word: ἀπέναντι
  choice: vis-à-vis de
  rationale: Rend clairement la position opposée ou en regard, tout en évitant la répétition immédiate de « en face de ».
- source_word: πρίονος
  choice: crête
  rationale: Le sens premier est « scie », mais le contexte topographique suggère l’image d’une ligne montagneuse dentelée. « Crête » transmet ce sens probable dans un français naturel.
- source_word: τῆς Ἰουδαίας
  choice: de Judée
  rationale: Forme française usuelle du nom géographique Ἰουδαία.
