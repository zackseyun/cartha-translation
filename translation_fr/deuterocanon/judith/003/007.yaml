  text: And they themselves, and all their surrounding region, received him with garlands and dances and tambourines.
translation:
  language: fr
  text: Eux-mêmes, ainsi que tous les habitants des environs, l’accueillirent avec des guirlandes[a], des danses et des tambourins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des couronnes ». Le mot grec désigne ici des couronnes ou des guirlandes de fête, et non nécessairement des couronnes royales.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδέξαντο
  choice: l’accueillirent
  rationale: Dans cette scène de réception cérémonielle, δέχομαι signifie naturellement « accueillir »; ce choix rend le sens contextuel sans ajouter d’idée étrangère.
- source_word: αὐτὸν
  choice: l’
  rationale: Le pronom objet renvoie à Holopherne dans le contexte.
- source_word: αὐτοὶ
  choice: eux-mêmes
  rationale: Le pronom grec explicite est emphatique; « eux-mêmes » en conserve la force.
- source_word: πᾶσα ἡ περίχωρος αὐτῶν
  choice: toute la région des alentours
  rationale: περίχωρος désigne la région ou le territoire environnant. Cette formulation française est collective, claire et évite de faire de la région elle-même un agent humain distinct.
- source_word: μετὰ στεφάνων
  choice: avec des guirlandes
  rationale: Dans un cadre festif, στέφανος désigne vraisemblablement des guirlandes ou couronnes végétales plutôt que des couronnes royales.
- source_word: χορῶν
  choice: des danses
  rationale: χορός peut désigner des danses, des chœurs dansants ou leurs groupes; « danses » conserve ici le caractère festif sans préciser indûment les exécutants.
- source_word: τυμπάνων
  choice: des tambourins
  rationale: τύμπανον désigne un petit tambour à main ou un instrument apparenté au tambourin; « tambourins » est naturel dans une procession festive.
theological_decisions: []
