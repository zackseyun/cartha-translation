  text: And their wounded will fill their ravines and the wadis, and a river overflowing will be filled with their dead;
translation:
  language: fr
  text: Leurs blessés rempliront leurs ravins et leurs torrents saisonniers[a], et un fleuve en crue sera rempli de leurs morts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les lits de torrents » ou « les oueds ». Le terme grec désigne un torrent, souvent saisonnier, et peut aussi désigner son chenal.
    reason: lexical_alternative
lexical_decisions:
- source_word: τραυματίαι
  choice: blessés
  rationale: Le substantif désigne les personnes blessées. « Blessés » est concis et naturel, sans élargir le sens à l’ensemble des victimes.
- source_word: πληρώσουσιν
  choice: rempliront
  rationale: Rend directement le futur de πληρόω et conserve la force de l’image.
- source_word: φάραγγας
  choice: ravins
  rationale: Le terme désigne des ravins ou des gorges ; « ravins » est précis et courant en français moderne.
- source_word: χειμάρρους
  choice: lits des torrents
  rationale: χείμαρρος peut désigner un torrent saisonnier ou son lit. « Lits des torrents » exprime clairement le chenal susceptible d’être sec ou soudainement en crue, sans recourir au régionalisme « oued » dans le corps du texte.
- source_word: ποταμὸς ἐπικλύζων
  choice: un fleuve en crue
  rationale: Le participe ἐπικλύζων évoque un cours d’eau qui déborde ou inonde. « En crue » restitue cette image de façon naturelle et concise.
- source_word: τοῖς νεκροῖς αὐτῶν
  choice: de leurs morts
  rationale: « Leurs morts » rend idiomatiquement νεκροί tout en conservant le rapport possessif explicite du grec et la dureté de l’image.
