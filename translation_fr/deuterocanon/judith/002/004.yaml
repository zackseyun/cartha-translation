  yaml_path: translation/deuterocanon/judith/002/004.yaml
  text: And it happened[a], when he had finished his plan, that Nebuchadnezzar king of the Assyrians called Holofernes, the commander-in-chief of his forces, who was second after him, and said to him[c][b],
translation:
  language: fr
  text: 'Quand il eut achevé son plan[a], Nabuchodonosor, roi des Assyriens, convoqua Holopherne, commandant en chef de ses forces[b], qui occupait le second rang après lui[c], et lui dit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son dessein » ou « sa décision » ; le grec βουλή peut désigner un plan, une résolution ou le résultat d’une délibération.
    reason: lexical_alternative
  - marker: b
    text: Ou « chef suprême de son armée » ; le terme grec désigne le plus haut commandement militaire.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « étant le deuxième après lui » ; cette expression indique qu’Holopherne venait immédiatement après le roi dans la hiérarchie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγένετο ὡς συνετέλεσεν
  choice: Quand il eut achevé d’élaborer
  rationale: La formule grecque introduit l’action qui suit une fois la délibération achevée. En français moderne, une proposition temporelle suffit naturellement sans reproduire littéralement « et il arriva ».
- source_word: τὴν βουλὴν αὐτοῦ
  choice: son plan
  rationale: βουλή peut désigner une délibération, une décision, un dessein ou un plan. Dans ce contexte politico-militaire, « plan » est clair, tout en laissant une autre nuance en note.
- source_word: ἐκάλεσεν
  choice: convoqua
  rationale: L’appel émane du roi et constitue une sommation officielle; « convoqua » exprime naturellement cette autorité en français.
- source_word: Ναβουχοδονοσὸρ βασιλεὺς Ἀσσυρίων
  choice: Nabuchodonosor, roi des Assyriens
  rationale: Cette formulation conserve l’apposition et la désignation ethnique explicite du grec.
- source_word: τὸν Ὀλοφέρνην
  choice: Holopherne
  rationale: Forme française traditionnelle et intelligible du nom propre grec Ὀλοφέρνης.
- source_word: ἀρχιστράτηγον τῆς δυνάμεως αὐτοῦ
  choice: commandant en chef de ses forces
  rationale: ἀρχιστράτηγος désigne le plus haut commandement militaire, tandis que δύναμις a ici le sens concret de forces armées.
- source_word: δεύτερον ὄντα μετʼ αὐτόν
  choice: qui occupait le second rang après lui
  rationale: La tournure rend explicitement une position hiérarchique immédiatement inférieure à celle du roi sans identifier davantage la nature de cette primauté.
- source_word: καὶ εἶπεν πρὸς αὐτόν
  choice: 'et lui dit :'
  rationale: Rendu français idiomatique de la formule qui introduit le discours direct au verset suivant.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La tournure initiale évite le calque archaïsant « Et il arriva que » tout en préservant la succession temporelle. Les noms suivent les formes françaises usuelles « Nabuchodonosor » et « Holopherne ».
