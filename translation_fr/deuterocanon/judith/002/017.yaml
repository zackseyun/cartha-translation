lexical_decisions:
- source_word: ἔλαβεν
  choice: Il prit
  rationale: 'Le sens narratif courant de λαμβάνω convient ici : il prend avec lui les animaux nécessaires à la campagne, sans que l’idée de saisie violente soit mise en avant.'
- source_word: καμήλους καὶ ὄνους καὶ ἡμιόνους
  choice: des chameaux, des ânes et des mulets
  rationale: Termes français usuels et précis pour les trois catégories d’animaux de transport.
- source_word: εἰς τὴν ἀπαρτίαν αὐτῶν
  choice: pour transporter tout leur équipement
  rationale: Dans ce contexte logistique, ἀπαρτία désigne l’ensemble de l’équipement ou des bagages. L’ajout de « transporter » explicite naturellement la fonction des bêtes de somme, tandis que « tout » reflète la nuance de complétude du terme.
- source_word: πλῆθος πολὺ σφόδρα
  choice: en très grand nombre
  rationale: Formulation française naturelle qui conserve la forte insistance quantitative de πολὺ σφόδρα.
- source_word: πρόβατα καὶ βόας καὶ αἶγας
  choice: des moutons, des bovins et des chèvres
  rationale: « Bovins » garde ici la portée collective possible de βόας sans limiter le terme aux seuls bœufs de trait.
- source_word: εἰς τὴν παρασκευὴν αὐτῶν
  choice: pour leur ravitaillement
  rationale: παρασκευή peut désigner la préparation ou les approvisionnements. La liste de bétail indique ici des ressources destinées au ravitaillement de l’armée.
- source_word: ὧν οὐκ ἦν ἀριθμός
  choice: on ne pouvait pas les compter
  rationale: Rend en français actuel l’idiome grec littéral « dont il n’y avait pas de nombre », qui exprime une quantité innombrable.
