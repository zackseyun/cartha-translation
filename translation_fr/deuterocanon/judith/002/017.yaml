  footnotes:
  - marker: a
    text: Ou « pour leur équipement » ; le grec désigne largement l’équipement complet ou les effets nécessaires à l’expédition.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour leurs provisions » ; le terme grec peut désigner la préparation ou les approvisionnements et renvoie probablement ici aux ressources de nourriture.
