  text: And he himself and all his force set out on the march to go before King Nebuchadnezzar and to cover the whole face of the land toward the west with his chariots and horsemen and his chosen foot soldiers[a].
translation:
  language: fr
  text: Lui-même et toutes ses troupes partirent en campagne, afin de marcher devant le roi Nabuchodonosor et de couvrir de ses chars, de ses cavaliers et de ses fantassins choisis toute l’étendue du pays[a], vers l’ouest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la terre entière ». Le grec γῆ peut désigner soit un pays, soit la terre ; « pays » est retenu ici en raison du contexte d’une progression militaire vers l’ouest à travers des territoires.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: partit
  rationale: Dans ce contexte militaire, le verbe désigne le départ en campagne. « Partit » est naturel et conserve l’idée fondamentale de mouvement sans ajouter celle d’une attaque.
- source_word: πᾶσα ἡ δύναμις αὐτοῦ
  choice: toutes ses forces
  rationale: δύναμις désigne ici les forces militaires, comme le confirme l’énumération des chars, cavaliers et fantassins. Le pluriel français est l’expression militaire la plus naturelle.
- source_word: εἰς πορείαν
  choice: pour se mettre en marche
  rationale: La locution exprime la mise en route, ici dans le cadre d’une campagne militaire. Cette formulation reste explicite sans surinterpréter le mouvement.
- source_word: τοῦ προελθεῖν
  choice: afin de précéder
  rationale: L’infinitif articulé exprime le but, et προέρχομαι indique ici le fait d’aller en avant de quelqu’un. « Précéder » maintient le rapport avec le roi sans préciser davantage la fonction militaire.
- source_word: καλύψαι πᾶν τὸ πρόσωπον τῆς γῆς
  choice: couvrir toute la surface du pays
  rationale: La traduction garde l’image spatiale de « couvrir » et rend πρόσωπον idiomatiquement par « surface ». Dans ce récit de progression territoriale, « pays » convient mieux au contexte, tout en laissant l’autre sens en note.
- source_word: πρὸς δυσμαῖς
  choice: vers l’ouest
  rationale: La formule indique la direction occidentale de la progression. « Vers l’ouest » est direct et naturel.
- source_word: ἅρμασι
  choice: chars
  rationale: Il s’agit du terme militaire courant pour les chars; le contexte rend inutile l’ajout de « guerre ».
- source_word: ἱππεῦσι
  choice: cavaliers
  rationale: Le mot désigne des combattants montés. « Cavaliers » est précis, courant et adapté au registre narratif.
- source_word: πεζοῖς ἐπιλέκτοις
  choice: fantassins choisis
  rationale: « Fantassins » rend les soldats à pied et « choisis » conserve explicitement l’idée de sélection portée par ἐπιλέκτοις, sans introduire la notion moderne d’unités d’élite.
