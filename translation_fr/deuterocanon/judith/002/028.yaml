  yaml_path: translation/deuterocanon/judith/002/028.yaml
  text: And fear and dread of him fell upon those living along the coast—those in Sidon and Tyre[a], those living in Assur and Ocina, and all those living in Jamnia[b]; and those living in Azotus and Ascalon were very greatly afraid of him.
translation:
  language: fr
  text: 'La crainte et le tremblement qu’il inspirait s’abattirent sur les habitants de la côte : ceux de Sidon et de Tyr, ceux qui habitaient Assur et Okeina, et tous les habitants de Jamnia ; et les habitants d’Azôtos et d’Ascalon[a] furent saisis d’une très grande peur de lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Azôtos est le nom grec d’Ashdod ; Ascalon est le nom grec d’Ashkelon.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέπεσεν
  choice: s’abattirent sur
  rationale: Le verbe exprime l’irruption soudaine de la peur; cette tournure française conserve l’image vive du grec et convient au sujet double.
- source_word: φόβος καὶ τρόμος
  choice: la peur et la terreur
  rationale: Cette paire naturelle en français maintient deux termes distincts et l’intensité du grec, sans réduire τρόμος au seul tremblement physique.
- source_word: αὐτοῦ
  choice: qu’il inspirait
  rationale: Le génitif désigne vraisemblablement celui qui est l’objet ou la cause de la peur. La formulation française rend clairement cette relation sans identifier autrement le personnage.
- source_word: τοὺς κατοικοῦντας τὴν παραλίαν
  choice: les habitants de la côte
  rationale: παραλία désigne la côte ou la région côtière; cette formulation est concise, actuelle et fidèle.
- source_word: τοὺς ὄντας ἐν Σιδῶνι καὶ Τύρῳ
  choice: ceux de Sidon et de Tyr
  rationale: Le participe ὄντας situe simplement ces personnes; la formulation évite une lourde répétition de « habiter ».
- source_word: Ἀσσούρ
  choice: Assour
  rationale: Translittération française du toponyme grec, préférable à « Assyrie », qui interpréterait le nom comme une vaste région.
- source_word: Ὀκεινὰ
  choice: Okeina
  rationale: Translittération transparente d’un toponyme dont l’identification et la forme française usuelle sont incertaines.
- source_word: Ἰεμνάν
  choice: Jamnia
  rationale: Forme française traditionnelle et reconnaissable du toponyme, correspondant au lieu généralement identifié derrière le grec.
- source_word: Ἀζώτῳ
  choice: Azôtos
  rationale: La forme conserve le nom hellénisé porté par le témoin grec; la forme biblique plus connue « Ashdod » est signalée en note.
- source_word: Ἀσκάλωνι
  choice: Ascalon
  rationale: La forme française traditionnelle suit le nom grec; « Ashkelon », issu de la forme hébraïque, est indiqué en note.
- source_word: ἐφοβήθησαν αὐτὸν σφόδρα
  choice: ils eurent extrêmement peur de lui
  rationale: La construction garde explicitement l’objet de la peur et rend la forte intensification de σφόδρα dans un français naturel.
