  text: And he summoned all his attendants and all his nobles[a], and he set before them the secret of his plan[b], and from his own mouth he declared all the evil of the land.
translation:
  language: fr
  text: Il convoqua tous ses serviteurs et tous ses hauts dignitaires, leur fit part du secret de son projet[a] et, de sa propre bouche, exposa pleinement tout le mal de la terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur révéla le secret de son dessein ». Ici, le mot grec traduit par « secret » désigne vraisemblablement une affaire confidentielle, non un « mystère » au sens théologique.
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque est difficile. Elle peut désigner tout le mal concernant la terre, ou tout le mal destiné à lui être infligé, plutôt qu’un mal dont la terre elle-même serait coupable.
    reason: alternative_reading
lexical_decisions:
- source_word: συνεκάλεσεν
  choice: convoqua
  rationale: Le verbe composé exprime l’action de faire venir plusieurs personnes ensemble; « convoqua » convient à l’autorité royale et reste naturel.
- source_word: θεράποντας
  choice: serviteurs
  rationale: Dans ce cadre de cour, le terme désigne des personnes attachées au service du roi, sans impliquer nécessairement la condition d’esclave.
- source_word: μεγιστᾶνας
  choice: hauts dignitaires
  rationale: Le mot désigne les grands personnages du royaume ou de la cour. « Hauts dignitaires » rend clairement leur rang sans archaïsme excessif.
- source_word: ἔθετο μετʼ αὐτῶν τὸ μυστήριον τῆς βουλῆς αὐτοῦ
  choice: leur confia le secret de son projet
  rationale: L’expression indique qu’il partage avec eux une affaire tenue secrète. Ici, μυστήριον a un sens politique et confidentiel, tandis que βουλή désigne son projet ou dessein.
- source_word: συνετέλεσεν
  choice: exposa pleinement
  rationale: Le verbe signifie fondamentalement « mener à son terme ». Avec « de sa bouche », il paraît décrire l’énoncé complet de ce qui avait été décidé; cette traduction conserve l’idée d’achèvement dans un français intelligible.
- source_word: πᾶσαν τὴν κακίαν τῆς γῆς
  choice: tout le mal de la terre
  rationale: La construction grecque est difficile et permet plusieurs rapports entre « mal » et « terre ». La formulation française reste volontairement proche et ne précise pas silencieusement si le mal appartient à la terre ou lui est destiné.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: de sa propre bouche
  rationale: Cette expression souligne que le roi a lui-même formulé la décision.
