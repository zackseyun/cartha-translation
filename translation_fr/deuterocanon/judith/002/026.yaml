  text: And he encircled all the sons of Midian[a], and burned their encampments[b], and plundered their sheepfolds.
translation:
  language: fr
  text: Il encercla tous les fils de Madian[a], incendia leurs campements et pilla leurs enclos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les Madianites ». Le grec dit littéralement « tous les fils de Madian ».
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire les parcs ou enceintes destinés aux animaux ; on peut aussi traduire par « bergeries ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκύκλωσεν
  choice: encercla
  rationale: Le verbe κυκλόω exprime l’action d’entourer ou d’encercler. « Encercla » conserve l’image circulaire et la portée militaire tout en restant naturel en français.
- source_word: πάντας τοὺς υἱοὺς Μαδιάμ
  choice: tous les fils de Madian
  rationale: Cette traduction garde l’expression grecque littérale et son style biblique. Dans ce contexte, elle désigne collectivement les Madianites.
- source_word: ἐνέπρησεν
  choice: incendia
  rationale: Le verbe signifie mettre le feu ou livrer aux flammes. « Incendia » est concis et n’ajoute pas l’idée d’une destruction totale.
- source_word: τὰ σκηνώματα
  choice: leurs campements
  rationale: Le terme peut évoquer des tentes ou des habitations de camp. « Campements » rend bien ici l’ensemble des installations d’un peuple nomade.
- source_word: ἐπρονόμευσεν
  choice: pilla
  rationale: Le verbe désigne l’action de prendre comme butin. « Pilla » est l’équivalent militaire le plus direct et idiomatique.
- source_word: τὰς μάνδρας
  choice: leurs enclos
  rationale: μάνδρα désigne un espace clos destiné aux animaux sans nécessairement préciser leur espèce. « Enclos » préserve cette généralité mieux que « bergeries ».
