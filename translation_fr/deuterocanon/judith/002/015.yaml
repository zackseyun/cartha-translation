  text: 'And he counted chosen men for battle formation[a], just as his lord had commanded him: one hundred twenty thousand, and twelve thousand mounted archers,'
translation:
  language: fr
  text: 'Il dénombra, pour la formation de combat, des hommes choisis, comme son maître le lui avait ordonné : cent vingt mille hommes et douze mille archers à cheval.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρίθμησεν
  choice: dénombra
  rationale: Le verbe désigne l’action de compter ou de recenser. « Dénombra » reste concret et convient au contexte militaire sans ajouter l’idée technique d’une mobilisation.
- source_word: ἐκλεκτοὺς ἄνδρας
  choice: des hommes choisis
  rationale: ἐκλεκτούς indique des personnes sélectionnées, et ἄνδρας désigne explicitement des hommes. Cette formulation est précise et naturelle.
- source_word: εἰς παράταξιν
  choice: pour le combat
  rationale: παράταξις évoque la mise en ordre ou le déploiement en vue de la bataille. « Pour le combat » transmet naturellement la fonction de cette sélection, sans lourdeur technique.
- source_word: καθότι
  choice: comme
  rationale: La conjonction marque la conformité de l’action à l’ordre reçu. « Comme » est naturel et fidèle dans ce contexte.
- source_word: ὁ κύριος αὐτοῦ
  choice: son maître
  rationale: Le référent est ici le supérieur humain d’Holopherne. « Maître » exprime l’autorité hiérarchique sans suggérer une référence divine.
- source_word: εἰς μυριάδας δέκα δύο
  choice: cent vingt mille hommes
  rationale: L’expression grecque signifie littéralement douze myriades, soit cent vingt mille. Le total est donné sous une forme immédiatement compréhensible en français; « hommes » explicite le nom sous-entendu par la construction.
- source_word: ἱππεῖς τοξότας
  choice: archers à cheval
  rationale: L’expression associe cavalerie et tir à l’arc. « Archers à cheval » est idiomatique et précis en français moderne.
- source_word: μυρίους δισχιλίους
  choice: douze mille
  rationale: Le grec additionne dix mille et deux mille. Donner directement le total produit une formulation française naturelle et exacte.
theological_decisions:
- issue: Sens de κύριος dans une hiérarchie militaire humaine
  choice: son maître
  alternative: son seigneur
  rationale: Le contexte désigne sans ambiguïté un supérieur humain, non Dieu. « Son maître » préserve le rapport d’autorité tout en évitant une majuscule ou un titre qui pourrait suggérer une référence divine.
translation_notes:
  register: Français moderne, clair et digne. La phrase conserve la structure narrative et les deux effectifs du grec, tout en privilégiant des termes militaires accessibles au grand public.
