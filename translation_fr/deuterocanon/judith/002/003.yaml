  text: And they too decided to destroy all flesh who had not followed the word of his mouth[a][b].
translation:
  language: fr
  text: Et eux aussi décidèrent de détruire toute chair qui n’avait pas suivi la parole de sa bouche[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout le monde » ou « toute l’humanité ». Le grec dit littéralement « toute chair », expression biblique conservée ici.
    reason: lexical_alternative
  - marker: b
    text: Ou « le commandement sorti de sa bouche » ou « l’ordre qu’il avait donné ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτοὶ
  choice: Et eux aussi
  rationale: Rend à la fois le lien avec le contexte et la valeur emphatique ou additive du pronom.
- source_word: ἔκριναν
  choice: décidèrent
  rationale: Dans ce récit, le verbe désigne une décision arrêtée, sans qu’il soit nécessaire d’y voir un décret juridique formel.
- source_word: ὀλεθρεῦσαι
  choice: de détruire
  rationale: Expression forte et directe de la ruine voulue, sans renforcer le grec par « exterminer » ou « anéantir ».
- source_word: πᾶσαν σάρκα
  choice: toute chair
  rationale: Conserve l’expression biblique grecque et son ampleur, au lieu de la réduire explicitement à « tout le monde » ou à « toute l’humanité ».
- source_word: οἳ οὐκ ἠκολούθησαν
  choice: qui n’avait pas suivi
  rationale: Préserve l’image verbale de « suivre »; le complément indique qu’il s’agit ici de se conformer à une parole faisant autorité. Le singulier s’accorde avec le collectif « toute chair ».
- source_word: τῷ λόγῳ
  choice: la parole
  rationale: Maintient l’étendue sémantique de λόγος, qui peut désigner ici une parole, un commandement ou un ordre.
- source_word: τοῦ στόματος αὐτοῦ
  choice: de sa bouche
  rationale: Reproduit l’expression concrète et sémitisante du grec tout en restant intelligible en français.
theological_decisions:
- issue: Valeur de σάρξ dans une expression biblique non paulinienne
  choice: toute chair
  alternative: tout le monde; toute l’humanité
  rationale: Ici, σάρξ appartient à une expression collective et ne désigne pas une « nature pécheresse ». La traduction littérale conserve l’idiome biblique et évite d’en préciser indûment la portée.
- issue: Valeur d’obéissance possible de ἀκολουθέω
  choice: suivi
  alternative: obéi à
  rationale: Le contexte suggère l’obéissance à un ordre, mais le verbe grec signifie formellement « suivre ». La formulation retenue préserve cette image et laisse subsister la nuance contextuelle.
translation_notes:
  register: Français international moderne, digne et lisible. La tournure « toute chair » et l’expression « la parole de sa bouche » sont volontairement plus bibliques que le français courant afin de préserver les images et les ambiguïtés du grec.
