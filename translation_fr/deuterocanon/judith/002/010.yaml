  yaml_path: translation/deuterocanon/judith/002/010.yaml
  text: But you[a], after going out, shall seize all their territory in advance for me, and they will surrender themselves to you; and you shall keep them for me until the day of their punishment.
translation:
  language: fr
  text: Mais toi, tu partiras et tu prendras d’avance possession, pour moi, de tout leur territoire. Ils se livreront à toi, et tu les garderas pour moi jusqu’au jour de leur châtiment[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « réprimande » ou « correction ». Le grec ἐλεγμός peut désigner une réprobation exprimée, une censure ou une correction punitive.
    reason: 'Alternative lexicale : le contexte favorise « châtiment », mais le nom grec conserve une gamme de sens plus large.'
lexical_decisions:
- source_word: ἐξελθὼν
  choice: pars
  rationale: Le participe aoriste marque une action préalable ou concomitante étroitement liée à l’ordre principal. En français, « pars et » exprime naturellement le départ qui précède la prise du territoire.
- source_word: προκαταλήμψῃ
  choice: prends d’avance possession
  rationale: Le verbe composé désigne une prise anticipée. Cette formulation conserve à la fois la nuance du préfixe προ- et la force militaire de la prise de possession.
- source_word: πᾶν ὅριον αὐτῶν
  choice: tout leur territoire
  rationale: Dans ce contexte militaire, ὅριον désigne plus naturellement l’étendue territoriale sous leur contrôle qu’une simple ligne frontalière.
- source_word: ἐκδώσουσίν σοι ἑαυτούς
  choice: ils se livreront à toi
  rationale: La construction réflexive indique qu’ils se remettront eux-mêmes au conquérant. « Se livrer » est idiomatique et peut exprimer une capitulation sans ajout explicatif.
- source_word: διατηρήσεις ἐμοὶ αὐτούς
  choice: tu me les garderas
  rationale: διατηρέω signifie garder ou conserver. Le double pronom rend clairement le datif d’intérêt ἐμοί et l’objet αὐτούς dans un français naturel.
- source_word: εἰς ἡμέραν ἐλεγμοῦ αὐτῶν
  choice: jusqu’au jour de leur châtiment
  rationale: Dans cette menace royale et militaire, « châtiment » rend la portée punitive probable de ἐλεγμός, tout en signalant en note les autres valeurs possibles du terme.
theological_decisions:
- issue: Portée de ἐλεγμός dans un contexte militaire et judiciaire
  choice: châtiment
  alternative: réprimande ou correction
  rationale: Le contexte de conquête favorise une sanction punitive, mais le grec peut aussi désigner une réprimande ou une correction disciplinaire. La note préserve cette amplitude sans introduire une notion spécifiquement eschatologique de jugement.
translation_notes:
  register: Français international moderne, direct et digne. L’impératif « pars et prends » restitue la valeur injonctive de la construction grecque sans lourdeur littérale; le vocabulaire militaire reste clair pour un lectorat général.
