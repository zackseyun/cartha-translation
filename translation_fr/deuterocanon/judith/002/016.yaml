  text: And he arranged them in the way a multitude is drawn up for war[a].
translation:
  language: fr
  text: Et il les rangea comme on met en ordre de bataille une multitude[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et il leur donna ses ordres, comme on déploie une multitude pour la guerre. » Le verbe grec traduit par « rangea » peut mettre l’accent soit sur la disposition des troupes, soit sur les ordres qui leur sont donnés; le second verbe est un terme militaire désignant leur mise en formation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διέταξεν
  choice: rangea
  rationale: Dans ce contexte militaire, le verbe désigne l’action d’organiser et de disposer des troupes, tout en pouvant aussi évoquer le fait de leur donner des ordres.
- source_word: αὐτούς
  choice: les
  rationale: Le pronom reprend directement les forces mentionnées dans le contexte précédent.
- source_word: ὃν τρόπον
  choice: comme
  rationale: Cette tournure comparative exprime la manière; « comme » est naturel en français et en conserve clairement la valeur.
- source_word: πολέμου
  choice: de bataille
  rationale: Le génitif caractérise ici une disposition militaire. L’expression française « mettre en ordre de bataille » restitue naturellement ce sens, sans limiter πόλεμος à un affrontement précis.
- source_word: πλῆθος
  choice: une multitude
  rationale: Ce choix conserve le sens général de grand nombre sans introduire le terme plus spécifique « armée », absent du grec.
- source_word: συντάσσεται
  choice: on met en ordre de bataille
  rationale: Dans un contexte militaire, le verbe décrit la mise en formation de troupes. Cette expression française rend clairement cet emploi, tandis que la construction impersonnelle traduit naturellement le présent passif grec à valeur générale.
