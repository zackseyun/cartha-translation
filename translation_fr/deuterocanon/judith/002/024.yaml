  yaml_path: translation/deuterocanon/judith/002/024.yaml
  text: And he crossed the Euphrates and passed through Mesopotamia[a], and he tore down all the high cities along the torrent Abrona[b], until he came to the sea.
translation:
  language: fr
  text: Il traversa l’Euphrate, parcourut la Mésopotamie et éventra[a] toutes les villes situées sur les hauteurs le long du torrent Abrona[b], jusqu’à ce qu’il arrive à la mer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ouvrit une brèche dans ». Le verbe grec signifie littéralement « creuser à travers » et peut décrire la percée ou la destruction de villes au cours d’une campagne militaire.
    reason: lexical_alternative
  - marker: b
    text: « Abrona » est la translittération d’un nom de lieu dans le texte grec; son identification géographique exacte demeure incertaine.
    reason: cultural_note
lexical_decisions:
- source_word: παρῆλθεν
  choice: traversa
  rationale: Avec l’Euphrate comme complément direct dans un récit de déplacement, le verbe indique naturellement la traversée du fleuve.
- source_word: διῆλθεν
  choice: parcourut
  rationale: Le composé exprime un déplacement à travers une région. « Parcourut la Mésopotamie » est naturel en français et conserve cette valeur directionnelle.
- source_word: διέσκαψε
  choice: éventra
  rationale: Le verbe signifie littéralement « creuser à travers ». Appliqué à des villes lors d’une campagne militaire, « éventra » garde l’image d’une percée destructrice sans réduire le sens à une simple excavation.
- source_word: πόλεις τὰς ὑψηλάς
  choice: les villes situées sur les hauteurs
  rationale: ὑψηλάς signifie « hautes ». Cette formulation française exprime vraisemblablement leur position élevée sans ajouter explicitement l’idée de fortifications.
- source_word: χειμάρρου
  choice: torrent
  rationale: χείμαρρος désigne un cours d’eau saisonnier ou impétueux; « torrent » est concis et convient au contexte géographique.
- source_word: Ἀβρωνᾶ
  choice: Abrona
  rationale: Le nom propre grec est translittéré, sans proposer une identification géographique incertaine.
- source_word: ἕως τοῦ ἐλθεῖν ἐπὶ θάλασσαν
  choice: jusqu’à ce qu’il arrive à la mer
  rationale: La construction avec ἕως et l’infinitif marque le terme du déplacement; cette traduction reste proche et naturelle.
