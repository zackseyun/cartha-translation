  text: For as I live[a], and by the power of my kingdom, I have spoken[b], and I will do these things by my hand.
translation:
  language: fr
  text: Car, aussi vrai que je suis vivant, et par la puissance de mon royaume[a], j’ai parlé, et je ferai tout cela par ma main[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec coordonne de manière elliptique « moi, vivant » et « la puissance de mon royaume ». La formule peut aussi être comprise comme une double attestation solennelle. Le mot traduit par « puissance » peut également signifier « force » ou « autorité souveraine ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans ma main ». Cette expression signifie ici « par ma main » et souligne l’intervention personnelle directe du roi.'
    reason: idiom_explanation
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Introduit le fondement solennel de la déclaration qui suit et convient à la valeur explicative de la formule de serment.
- source_word: ζῶν ἐγώ
  choice: aussi vrai que je suis vivant
  rationale: Rend en français naturel la formule de serment « aussi vrai que je vis », tout en conservant sa solennité.
- source_word: τὸ κράτος τῆς βασιλείας μου
  choice: la puissance de mon royaume
  rationale: κράτος désigne la force ou la puissance souveraine; « puissance » reste clair et βασιλεία garde ici son sens royal concret.
- source_word: λελάληκα
  choice: j’ai parlé
  rationale: Le passé composé restitue le parfait grec, qui présente la parole prononcée comme acquise et toujours valable.
- source_word: ποιήσω ταῦτα
  choice: j’accomplirai tout cela
  rationale: « Accomplir » exprime naturellement l’exécution future des actes annoncés; « tout cela » reprend le pluriel démonstratif sans lourdeur.
- source_word: ἐν χειρί μου
  choice: de ma main
  rationale: Conserve l’image grecque de la main et exprime l’intervention personnelle directe sans ajouter explicitement « propre ».
theological_decisions:
- issue: Formulation elliptique du serment royal
  choice: aussi vrai que je suis vivant et que demeure la puissance de mon royaume
  alternative: par ma vie et par la puissance de mon royaume
  rationale: Le grec coordonne de manière elliptique « moi, vivant » et « la puissance de mon royaume ». La formulation retenue explicite sobrement le verbe sous-entendu pour produire un serment intelligible en français, tandis que la note conserve l’autre analyse possible, instrumentale.
translation_notes:
  register: Français international actuel, solennel sans être archaïque. La structure de serment est rendue explicitement pour rester naturelle, et les images royales de la puissance et de la main sont conservées.
