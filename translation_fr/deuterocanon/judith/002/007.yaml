translation:
  language: fr
  text: et de préparer de la terre et de l’eau[a], car je marcherai contre eux dans ma colère ; je couvrirai toute la face de la terre des pieds de mon armée et je les livrerai au pillage de mon armée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « De la terre et de l’eau » désigne probablement ici des signes de soumission exigés par un roi conquérant.
