lexical_decisions:
- source_word: ἑτοιμάζειν
  choice: préparer
  rationale: L’infinitif poursuit la série d’ordres. « Préparer » conserve le sens général du grec sans préciser indûment le geste demandé.
- source_word: γῆν καὶ ὕδωρ
  choice: de la terre et de l’eau
  rationale: La formulation concrète du grec est maintenue. Elle évoque probablement des signes de soumission, sens culturel indiqué en note plutôt qu’introduit dans le texte.
- source_word: ἐξελεύσομαι
  choice: je marcherai
  rationale: Dans ce contexte de campagne militaire, « marcher contre » exprime naturellement l’idée de sortir en expédition, sans ajouter de détail étranger au texte.
- source_word: ἐν θυμῷ μου
  choice: dans ma colère
  rationale: θυμός désigne ici une colère intense. « Colère » est naturel en français moderne et convient au ton solennel de la menace royale.
- source_word: καλύψω πᾶν τὸ πρόσωπον τῆς γῆς
  choice: je couvrirai toute la face de la terre
  rationale: Cette traduction conserve l’image biblique et l’ampleur rhétorique de l’expression grecque.
- source_word: τοῖς ποσὶν τῆς δυνάμεώς μου
  choice: des pieds de mon armée
  rationale: δύναμις désigne ici la force militaire. « Armée » est clair et idiomatique, tandis que « pieds » préserve l’image concrète d’une occupation massive.
- source_word: δώσω αὐτοὺς εἰς διαρπαγὴν αὐτοῖς
  choice: je les livrerai à son pillage
  rationale: Le dernier pronom renvoie naturellement à l’armée, singulier collectif en français. Cette formulation restitue l’idée de livrer les peuples au pillage par les troupes sans reproduire une ambiguïté pronominale artificielle.
theological_decisions:
- issue: Portée idiomatique de « terre et eau »
  choice: Conserver l’expression littérale dans le texte et expliquer en note son probable sens de soumission.
  alternative: Traduire directement par « des signes de soumission ».
  rationale: Le sens culturel est probable, mais le grec présente deux réalités concrètes. La note permet de préserver à la fois la forme du texte et sa portée historique.
translation_notes:
  register: Français international moderne, naturel et digne. La menace royale conserve son ampleur rhétorique. Le point-virgule clarifie la progression de la phrase, et le marqueur [a] figure bien dans le texte principal.
