  text: And a great mixed multitude went out with them[a], like locusts and like the sand of the earth, for there was no number because of their multitude.
translation:
  language: fr
  text: 'Une foule nombreuse de gens de toutes sortes partit avec eux, pareille aux sauterelles et au sable de la terre : on ne pouvait les compter, tant ils étaient nombreux.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « car il n’y avait pas de nombre, à cause de leur multitude ». Cette expression grecque signifie qu’ils étaient innombrables.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολὺς ὁ ἐπίμικτος
  choice: une foule nombreuse de gens de toutes sortes
  rationale: Le singulier collectif désigne un groupe mêlé et très nombreux. Cette formulation française rend naturellement à la fois l’ampleur de la foule et son caractère composite, sans la charger d’une nuance péjorative.
- source_word: συνεξῆλθον αὐτοῖς
  choice: partit avec eux
  rationale: Le verbe composé exprime un départ effectué en accompagnant les autres. « Partit avec eux » reste direct et n’ajoute pas l’idée explicitement militaire de marcher en formation.
- source_word: ὡς ἀκρίς
  choice: pareille aux sauterelles
  rationale: Le singulier grec a une valeur collective. Le pluriel français restitue naturellement l’image d’une nuée innombrable.
- source_word: ὡς ἡ ἄμμος τῆς γῆς
  choice: et au sable de la terre
  rationale: La formulation conserve l’image biblique et rend γῆ de manière directe, sans trancher artificiellement entre « terre », « pays » et « sol ».
- source_word: οὐ γὰρ ἦν ἀριθμὸς ἀπὸ πλήθους αὐτῶν
  choice: on ne pouvait les compter, tant ils étaient nombreux
  rationale: Cette tournure idiomatique exprime clairement en français moderne l’absence de dénombrement causée par leur multitude, tout en maintenant le lien causal du grec.
