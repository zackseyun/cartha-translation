  text: But against those who disobey, your eye shall not spare; you shall give them over to slaughter and plunder throughout all your land.
translation:
  language: fr
  text: 'Mais ton œil n’épargnera pas ceux qui désobéissent : tu les livreras au massacre et au pillage dans tout ton pays.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀπειθοῦντας
  choice: ceux qui refusent d’obéir
  rationale: Le participe désigne ceux qui désobéissent ou refusent de se soumettre; cette formulation exprime clairement la résistance visée dans le contexte.
- source_word: οὐ φείσεται ὁ ὀφθαλμός σου
  choice: que ton œil soit sans pitié
  rationale: Conserve l’image sémitisante de l’œil qui n’épargne pas, tout en donnant en français une injonction naturelle adaptée au contexte du discours.
- source_word: δοῦναι αὐτοὺς
  choice: livre-les
  rationale: Rend l’idée de remettre des personnes à un sort déterminé et reproduit la force impérative liée à la proposition précédente.
- source_word: φόνον
  choice: massacre
  rationale: Dans ce contexte militaire, le terme désigne la mise à mort violente; « massacre » est plus idiomatique que le littéral « meurtre ».
- source_word: ἁρπαγὴν
  choice: pillage
  rationale: Désigne ici le fait d’être livré à la rapine ou au butin dans un contexte de conquête.
- source_word: ἐν πάσῃ τῇ γῇ σου
  choice: dans tout ton pays
  rationale: « Pays » rend naturellement γῆ comme territoire soumis au destinataire; πάσῃ est conservé par « tout ».
theological_decisions:
- issue: Valeur syntaxique de οὐ φείσεται et δοῦναι
  choice: 'Rendre l’ensemble comme une injonction : « que ton œil soit sans pitié : livre-les »'
  alternative: « ton œil ne les épargnera pas, afin de les livrer »
  rationale: Le contexte est celui d’un ordre, et l’infinitif δοῦναι explicite l’action commandée. La formulation française préserve l’image et la vigueur sans imposer une lecture théologique supplémentaire.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’image corporelle du grec est conservée; le vocabulaire militaire demeure direct, conformément à la violence explicite du texte source.
