  source_fidelity: La traduction de ἐπῆλθον par « partirent… et avancèrent » dédouble indûment le seul verbe grec. Surtout, ὁδὸν τριῶν ἡμερῶν désigne une distance évaluée à trois journées de marche, plutôt qu’une simple durée (« pendant trois jours »). Le reste rend fidèlement les relations topographiques, y compris l’ἀπό quelque peu abrupt.
  naturalness: Le français est globalement naturel et de registre narratif approprié. « À partir de Baïkteïlaïth » demeure un peu raide après « établirent leur camp », mais c’est une manière acceptable de conserver le « depuis/à partir de » du grec sans résoudre artificiellement la difficulté géographique.
  terminology: « Ninive », « plaine », « montagne » et « Haute-Cilicie » conviennent. La translittération cohérente « Baïkteïlaïth » est recevable. « Trois journées de marche » est le rendu français idiomatique et précis de la mesure de trajet.
