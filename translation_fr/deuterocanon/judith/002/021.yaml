lexical_decisions:
- source_word: ἐπῆλθον
  choice: partirent… et avancèrent
  rationale: Dans ce contexte de déplacement organisé d’une armée, le verbe exprime une progression depuis Ninive. Cette formulation naturelle en français rend à la fois le point de départ et l’avancée sans accentuer indûment la nuance militaire.
- source_word: ὁδὸν τριῶν ἡμερῶν
  choice: pendant trois jours
  rationale: L’expression mesure le trajet par sa durée. La formulation française est claire et idiomatique, tout en conservant l’idée d’une marche de trois jours.
- source_word: ἐπὶ πρόσωπον τοῦ πεδίου
  choice: jusqu’en face de la plaine
  rationale: La traduction conserve la valeur spatiale de πρόσωπον et évite de réduire la relation géographique à une simple arrivée dans la plaine.
- source_word: Βαικτειλαίθ / Βαικτειλαὶθ
  choice: Baïkteïlaïth
  rationale: Le nom propre est translittéré de manière cohérente dans ses deux occurrences, malgré la légère variation d’accentuation du grec.
- source_word: ἐπεστρατοπέδευσαν
  choice: ils établirent leur camp
  rationale: Le verbe désigne l’installation d’un camp, souvent militaire. Cette expression est naturelle en français moderne et garde la précision de l’action.
- source_word: ἀπὸ Βαικτειλαὶθ
  choice: à partir de Baïkteïlaïth
  rationale: La valeur normale de ἀπό, « depuis/à partir de », est maintenue malgré une géographie quelque peu difficile, plutôt que d’être lissée en « à Baïkteïlaïth ».
- source_word: πλησίον τοῦ ὄρους
  choice: près de la montagne
  rationale: Rendu spatial direct et naturel du grec.
- source_word: τοῦ ἐπʼ ἀριστερὰς
  choice: située à gauche de
  rationale: La formulation préserve l’indication relative « à gauche » sans l’interpréter comme un point cardinal tel que l’ouest.
- source_word: τῆς ἄνω Κιλικίας
  choice: la Haute-Cilicie
  rationale: L’expression est traitée comme une désignation géographique régionale et rendue sous la forme française usuelle d’un nom propre composé.
