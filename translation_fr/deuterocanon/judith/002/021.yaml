  text: And they advanced from Nineveh a journey of three days to the front of the plain of Baikteileth[a], and they encamped from Baikteileth near the mountain that is at the left hand of upper Cilicia.
translation:
  language: fr
  text: Ils avancèrent depuis Ninive sur une distance de trois journées de marche, jusqu’en face de la plaine de Baïkteïlaïth. Puis ils établirent leur camp à partir de Baïkteïlaïth, près de la montagne située à gauche de la Haute-Cilicie.[a]
