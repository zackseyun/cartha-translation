  text: And you also must not transgress a single one of your lord’s words, but you shall surely carry out exactly as I have commanded you, and you shall not delay to do them.
translation:
  language: fr
  text: Et toi aussi, tu ne transgresseras pas une seule des paroles de ton seigneur ; mais tu les exécuteras pleinement, conformément à ce que je t’ai ordonné, et tu ne tarderas pas à les accomplir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ σὺ δὲ
  choice: Et toi non plus
  rationale: Cette tournure rend la mise en relief de σὺ et la valeur additive de καί avec δέ, dans un français naturel.
- source_word: οὐ παραβήσῃ
  choice: tu n’enfreindras pas
  rationale: « Enfreindre » exprime clairement l’idée de transgresser ou de violer une parole faisant autorité, sans archaïsme inutile.
- source_word: ἓν τι τῶν ῥημάτων
  choice: une seule des paroles
  rationale: 'La formulation conserve la valeur distributive et emphatique : pas même une seule parole ne doit être violée.'
- source_word: τοῦ κυρίου σου
  choice: de ton seigneur
  rationale: Dans ce contexte, κύριος désigne un supérieur humain. La minuscule écarte une référence au Seigneur divin tout en gardant le sens hiérarchique du terme grec.
- source_word: ἐπιτελῶν ἐπιτελέσεις
  choice: tu exécuteras scrupuleusement
  rationale: La répétition intensive du verbe grec souligne l’exécution complète et certaine. « Scrupuleusement » transmet cette insistance sans reproduire une répétition maladroite en français.
- source_word: καθότι προστέταχά σοι
  choice: ce que je t’ai ordonné
  rationale: Cette formulation française exprime directement la conformité précise à l’ordre donné ; προστάσσω appartient au langage du commandement.
- source_word: οὐ μακρυνεῖς τοῦ ποιῆσαι αὐτά
  choice: tu ne tarderas pas à le faire
  rationale: Le verbe indique ici qu’il ne faut ni différer ni prolonger l’exécution. Le pronom neutre français reprend naturellement l’ensemble de ce qui a été ordonné.
theological_decisions:
- issue: Sens de κύριος appliqué à un supérieur humain
  choice: ton seigneur
  alternative: ton maître
  rationale: Le contexte décrit une hiérarchie humaine et militaire, non un titre divin. « Seigneur » avec une minuscule préserve la valeur de κύριος, tandis que « maître » risquerait d’évoquer plus fortement une relation domestique ou servile.
translation_notes:
  register: Français moderne, digne et direct, adapté à un ordre militaire. L’intensité de la construction grecque est rendue idiomatiquement par « scrupuleusement », et le parallélisme négatif puis positif est conservé.
