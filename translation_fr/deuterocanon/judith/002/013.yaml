revisions:
- from: Et toi non plus, tu n’enfreindras pas une seule des paroles de ton seigneur ; au contraire, tu exécuteras scrupuleusement ce que je t’ai ordonné et tu ne tarderas pas à le faire.
  to: Et toi aussi, tu ne transgresseras pas une seule des paroles de ton seigneur ; mais tu les exécuteras pleinement, conformément à ce que je t’ai ordonné, et tu ne tarderas pas à les accomplir.
  rationale: La révision rétablit la valeur additive et emphatique de καὶ σὺ δέ par « Et toi aussi », rend l'intensité de ἐπιτελῶν ἐπιτελέσεις par « les exécuteras pleinement », explicite la conformité de καθότι par « conformément à ce que », et maintient le pluriel de αὐτά. Aucun ajout interprétatif ni note n'est nécessaire.
