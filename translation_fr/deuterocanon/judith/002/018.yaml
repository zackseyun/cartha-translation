  text: and provisions for every man in abundance[a], and very much gold and silver from the king’s house.
translation:
  language: fr
  text: ainsi que des vivres en abondance pour chaque homme, et une très grande quantité d’or et d’argent provenant de la maison du roi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du trésor du roi » ou « de la maison royale » ; le grec dit littéralement « de la maison du roi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισιτισμὸν
  choice: des vivres
  rationale: Le nom désigne l’approvisionnement, particulièrement en nourriture. « Vivres » convient naturellement au contexte militaire sans préciser davantage la forme des provisions.
- source_word: παντὶ ἀνδρὶ
  choice: pour chaque homme
  rationale: Le grec emploie une formulation distributive au masculin singulier. Le contexte vise probablement chaque combattant, mais « homme » préserve le libellé du texte sans ajouter explicitement « soldat ».
- source_word: εἰς πλῆθος
  choice: en abondance
  rationale: Cette expression indique une quantité abondante; la tournure française est claire et idiomatique.
- source_word: χρυσίον καὶ ἀργύριον
  choice: de l’or et de l’argent
  rationale: Le grec nomme directement les deux métaux précieux, sans les qualifier explicitement de monnaie.
- source_word: ἐξ οἴκου βασιλέως
  choice: provenant de la maison du roi
  rationale: Cette traduction conserve le sens littéral de « maison du roi »; le contexte peut évoquer le trésor ou le palais, mais le grec ne désigne pas précisément l’un ou l’autre.
- source_word: σφόδρα
  choice: une très grande quantité
  rationale: Dans ce contexte, l’adverbe intensifie la quantité d’or et d’argent. Cette formulation restitue naturellement cette force en français.
