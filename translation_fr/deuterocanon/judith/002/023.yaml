  text: And he cut down Phud and Lud[a], and he plundered all the sons of Rasses and the sons of Ishmael who were opposite the wilderness[c][b], toward the south of the Chaldeans.
translation:
  language: fr
  text: Il écrasa Phoud et Loud[a], puis pilla tous les fils des Rasséens et les fils d’Ismaël[b], qui étaient en face du désert, vers le sud des Chaldéens[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Pout et Loud », selon des graphies bibliques plus familières de ces noms.
    reason: lexical_alternative
  - marker: b
    text: « Les fils d’Ismaël » peut aussi se traduire par « les Ismaélites ». Le texte principal conserve la formulation généalogique du grec.
    reason: lexical_alternative
  - marker: c
    text: 'La brève indication géographique peut aussi se comprendre ainsi : « qui étaient devant le désert, vers le sud des Chaldéens ».'
    reason: alternative_reading
lexical_decisions:
- source_word: διέκοψεν
  choice: écrasa
  rationale: Dans ce contexte militaire, le verbe exprime une défaite violente ou une dévastation. « Écrasa » est naturel en français tout en évitant de préciser indûment qu’il s’agit d’un massacre.
- source_word: τὸ Φοὺδ καὶ Λούδ
  choice: Foud et Loud
  rationale: Ces noms sont translittérés d’après les formes grecques Φούδ et Λούδ; une graphie biblique plus familière est signalée en note.
- source_word: ἐπρονόμευσεν
  choice: pilla
  rationale: Le verbe désigne l’action de prendre du butin à la guerre; « pilla » en restitue directement le sens militaire et économique.
- source_word: υἱοὺς πάντας Ῥασσεῖς
  choice: tous les fils de Rasséis
  rationale: Cette formulation conserve le terme généalogique υἱούς et translittère le nom de groupe Ῥασσεῖς, dont l’identification demeure incertaine.
- source_word: υἱοὺς Ἰσμαήλ
  choice: les fils d’Ismaël
  rationale: La traduction garde la formulation généalogique littérale du grec plutôt que de la remplacer dans le texte par l’ethnonyme « Ismaélites ».
- source_word: τοὺς κατὰ πρόσωπον τῆς ἐρήμου
  choice: qui se trouvaient en face du désert
  rationale: κατὰ πρόσωπον indique une relation spatiale comme « en face de » ou « devant ». L’ajout idiomatique « se trouvaient » rend la proposition naturelle sans fixer davantage la géographie.
- source_word: πρὸς νότον τῆς Χαλδαίων
  choice: au sud des Chaldéens
  rationale: La formule grecque condensée situe vraisemblablement les groupes au sud du territoire ou de la région associés aux Chaldéens. « Au sud des Chaldéens » reste concise et intelligible.
