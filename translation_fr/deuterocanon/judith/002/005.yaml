base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/002/005.yaml
  text: 'Thus says the great king[a], the lord of all the earth: Behold, you shall go out from my presence, and you shall take with yourself men confident in their strength, one hundred twenty thousand foot soldiers, and a multitude of horses with riders, one hundred twenty thousand.'
translation:
  language: fr
  text: '« Ainsi parle le grand roi, le seigneur de toute la terre : Voici, tu sortiras de ma présence et tu prendras avec toi des hommes qui ont confiance en leur force, soit cent vingt mille fantassins, ainsi qu’un grand nombre de chevaux avec leurs cavaliers, cent vingt mille[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « douze myriades », soit 120 000.
    reason: La note conserve la manière grecque d’exprimer ce second nombre tout en permettant une formulation naturelle dans le texte.
lexical_decisions:
- source_word: Τάδε λέγει
  choice: Voici ce que dit
  rationale: Formule française naturelle de proclamation, qui conserve le ton solennel de l’annonce royale.
- source_word: ὁ βασιλεὺς ὁ μέγας
  choice: le grand roi
  rationale: Rend directement le titre royal appositionnel et son registre élevé.
- source_word: ὁ κύριος πάσης τῆς γῆς
  choice: le seigneur de toute la terre
  rationale: « Seigneur » conserve la force de κύριος, tandis que la minuscule indique qu’il s’agit ici de la prétention d’un souverain humain. « Toute la terre » respecte la portée universelle de πάσης τῆς γῆς.
- source_word: Ἰδοὺ
  choice: omis comme interjection autonome
  rationale: En français moderne, « Voici ce que dit » porte déjà la force présentative de la proclamation; ajouter « Voici » ou « Vois » après les deux-points serait lourd. La solennité et l’attention requise demeurent perceptibles dans la formulation.
- source_word: ἐξελεύσῃ ἐκ τοῦ προσώπου μου
  choice: tu sortiras de ma présence
  rationale: Conserve le futur de commission et restitue naturellement l’idiome grec évoquant le départ depuis la présence du roi.
- source_word: λήμψῃ μετὰ σεαυτοῦ
  choice: tu prendras avec toi
  rationale: Expression française idiomatique qui rend à la fois l’action de prendre et l’idée d’accompagnement.
- source_word: ἄνδρας πεποιθότας ἐν ἰσχύι αὐτῶν
  choice: des hommes qui ont confiance en leur force
  rationale: Préserve l’idée explicite de confiance ou d’assurance, au lieu de réduire le groupe à de simples « hommes forts ».
- source_word: πεζῶν εἰς χιλιάδας ἑκατὸν εἴκοσι
  choice: cent vingt mille fantassins
  rationale: Rend clairement le sens militaire de πεζῶν et exprime le nombre selon l’usage français.
- source_word: πλῆθος ἵππων σὺν ἀναβάταις
  choice: un grand nombre de chevaux avec leurs cavaliers
  rationale: Conserve l’image concrète des chevaux accompagnés de ceux qui les montent plutôt que de la remplacer par le terme abstrait « cavalerie ».
- source_word: μυριάδας δέκα δύο
  choice: cent vingt mille
  rationale: Douze myriades correspondent à 120 000. Le total est donné sous une forme immédiatement compréhensible, tandis que l’expression grecque est signalée en note.
theological_decisions:
- issue: Traduction de κύριος à propos d’un roi humain
  choice: seigneur
  alternative: maître
  rationale: « Seigneur » préserve le titre et la portée de la revendication royale sans identifier le roi à Dieu; la minuscule marque clairement le contexte humain.
translation_notes:
  register: Français international moderne, digne et solennel, adapté à une proclamation royale. Les futurs gardent la valeur directive de l’ordre formulé comme une mission certaine. La répétition de « cent vingt mille » est maintenue parce qu’elle correspond aux deux effectifs distincts du grec.
