    issue: Omission de Ἰδού
    rationale: 'La formulation initiale « Voici ce que dit » traduit déjà Τάδε λέγει, mais elle ne rend pas l’interjection distincte Ἰδού qui introduit l’ordre royal. La répétition formelle « Ainsi parle … : Voici, … » est justifiée par le grec.'
  - severity: low
    issue: Lien syntaxique entre les hommes et l’effectif
    rationale: Après « des hommes qui ont confiance en leur force », les deux-points introduisent une énumération qui peut être comprise comme indépendante. « soit cent vingt mille fantassins » indique plus nettement que l’effectif décrit les hommes à emmener.
