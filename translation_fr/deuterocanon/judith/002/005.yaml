  to: '« Ainsi parle le grand roi, le seigneur de toute la terre : Voici, tu sortiras de ma présence et tu prendras avec toi des hommes qui ont confiance en leur force, soit cent vingt mille fantassins, ainsi qu’un grand nombre de chevaux avec leurs cavaliers, cent vingt mille[a]. »'
