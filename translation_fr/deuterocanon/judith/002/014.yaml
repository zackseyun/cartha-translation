  text: And Holofernes went out from the presence of his lord, and he called all the nobles and the generals and overseers of the Assyrian army,
translation:
  language: fr
  text: Alors Holopherne quitta la présence de son seigneur et convoqua tous les hauts dignitaires, les généraux et les responsables de l’armée assyrienne,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: quitta
  rationale: Dans ce contexte de cour, le verbe décrit le départ d’Holopherne d’auprès de son supérieur. « Quitta » exprime naturellement ce mouvement en français.
- source_word: ἀπὸ προσώπου
  choice: la présence de
  rationale: Cette tournure grecque d’influence sémitique signifie qu’Holopherne se retire de devant son supérieur. « La présence de » en conserve la tonalité formelle et courtisane.
- source_word: τοῦ κυρίου αὐτοῦ
  choice: son seigneur
  rationale: κύριος désigne ici le supérieur humain d’Holopherne. La minuscule et le contexte écartent une référence divine, tandis que « seigneur » convient au cadre royal.
- source_word: ἐκάλεσεν
  choice: convoqua
  rationale: Le contexte indique qu’Holopherne fait venir des responsables civils et militaires. « Convoqua » rend ce sens avec naturel et précision.
- source_word: δυνάστας
  choice: hauts dignitaires
  rationale: Le terme désigne les personnages puissants et haut placés du régime. « Hauts dignitaires » restitue leur statut sans leur attribuer une fonction politique trop précise.
- source_word: στρατηγοὺς
  choice: généraux
  rationale: Le terme grec désigne des chefs militaires; « généraux » est l’équivalent moderne le plus clair dans cette énumération.
- source_word: ἐπιστάτας
  choice: responsables
  rationale: Le mot désigne des personnes préposées à une fonction de surveillance ou de direction. « Responsables » préserve cette portée générale sans inventer un grade particulier.
- source_word: τῆς δυνάμεως Ἀσσούρ
  choice: de l’armée assyrienne
  rationale: Dans ce récit militaire, δύναμις désigne l’armée ou les forces armées. La formulation « armée assyrienne » rend idiomatiquement en français l’appartenance exprimée par Ἀσσούρ.
theological_decisions:
- issue: Sens de κύριος appliqué à un supérieur humain
  choice: son seigneur
  alternative: son maître
  rationale: Le mot est ici un titre humain dans un cadre de cour, non une désignation divine. « Seigneur », écrit avec une minuscule, maintient la hiérarchie et la solennité du texte sans introduire de lecture théologique.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La structure cumulative de l’énumération grecque est conservée. La virgule finale est maintenue puisque le verset se poursuit syntaxiquement dans le contexte suivant.
