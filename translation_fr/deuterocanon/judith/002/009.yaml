translation:
  language: fr
  text: Et je conduirai leurs captifs jusqu’aux extrémités de toute la terre[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur captivité », si αἰχμαλωσίαν désigne abstraitement l’état de captivité plutôt que les captifs eux-mêmes.
    reason: lexical_alternative
  - marker: b
    text: Le grec γῆ peut signifier « pays » ou « terre » ; « terre » est retenu ici, car l’expression « jusqu’aux extrémités » suggère une prétention de portée mondiale.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄξω
  choice: je conduirai
  rationale: Futur de ἄγω, « conduire » ou « amener ». « Conduirai » exprime naturellement le déplacement imposé aux captifs sans préciser davantage la manière.
- source_word: αἰχμαλωσίαν
  choice: leurs captifs
  rationale: Le nom peut désigner soit l’état de captivité, soit collectivement les personnes captives. Avec αὐτῶν et un verbe de mouvement, « leurs captifs » rend clairement le sens collectif le plus naturel dans ce contexte.
- source_word: ἐπὶ τὰ ἄκρα
  choice: jusqu’aux extrémités
  rationale: L’expression désigne les régions les plus éloignées. « Jusqu’aux extrémités » conserve la force géographique et rhétorique du grec dans un registre français digne.
- source_word: πάσης τῆς γῆς
  choice: de toute la terre
  rationale: γῆ peut signifier « pays » ou « terre ». L’association avec « les extrémités » favorise ici la portée universalisante de « toute la terre ».
