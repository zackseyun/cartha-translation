  text: And he seized the territory of Cilicia[a], and cut down all who resisted him, and came as far as the borders of Japheth, to the south, opposite Arabia.
translation:
  language: fr
  text: Il s’empara du territoire de la Cilicie et abattit tous ceux qui lui résistaient. Puis il alla jusqu’aux frontières de Japhet[a], au sud, en face de l’Arabie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « Japhet ». La localisation est incertaine. Certains interprètes rapprochent ce nom d’un lieu plus connu, mais le texte transmis est conservé ici sans correction.
    reason: alternative_reading
lexical_decisions:
- source_word: κατελάβετο
  choice: s’empara
  rationale: Le moyen de καταλαμβάνω exprime ici la prise de contrôle d’un territoire; « s’empara » rend clairement le caractère militaire et contraint de cette action.
- source_word: τὰ ὅρια τῆς Κιλικίας
  choice: du territoire de la Cilicie
  rationale: Bien que ὅρια désigne littéralement les limites ou frontières, l’expression renvoie ici par métonymie à l’étendue territoriale de la Cilicie.
- source_word: κατέκοψε
  choice: tailla en pièces
  rationale: Le verbe évoque littéralement l’action de couper et, en contexte militaire, de massacrer; cette tournure conserve sa force imagée.
- source_word: πάντας τοὺς ἀντιστάντας αὐτῷ
  choice: tous ceux qui lui résistaient
  rationale: Le participe désigne ceux qui s’opposaient activement à lui; « résistaient » est naturel et précis.
- source_word: ἦλθεν ἕως ὁρίων
  choice: alla jusqu’aux frontières
  rationale: La construction marque la limite atteinte durant l’avancée; ici, le sens concret de « frontières » convient.
- source_word: Ἰάφεθ
  choice: Japheth
  rationale: Le nom transmis par le texte grec est conservé par translittération plutôt que corrigé en un toponyme conjectural.
- source_word: τὰ πρὸς νότον
  choice: au sud
  rationale: Cette formulation française naturelle conserve l’indication géographique méridionale sans préciser indûment s’il s’agit d’une direction ou d’une position.
- source_word: κατὰ πρόσωπον τῆς Ἀραβίας
  choice: en face de l’Arabie
  rationale: L’idiome signifie « face à » ou « vis-à-vis de »; « en face de » convient à cette description géographique.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase grecque a été divisée en deux pour améliorer la lisibilité, sans modifier l’enchaînement des actions. Le toponyme incertain est maintenu et signalé en note.
