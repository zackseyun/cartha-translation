  source_fidelity: 'Le sens global est fidèlement rendu : prise de contrôle de la Cilicie, élimination violente des opposants, puis progression jusqu’aux frontières du lieu transmis par le grec, situé au sud, en face de l’Arabie. « Territoire » pour τὰ ὅρια de la Cilicie et « frontières » dans la seconde occurrence reflètent correctement les emplois contextuels distincts. « Tailla en pièces » est possible, mais « abattit » rend plus sobrement κατέκοψε sans suggérer une mutilation précise que le grec n’explicite pas.'
