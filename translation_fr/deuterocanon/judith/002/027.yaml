  yaml_path: translation/deuterocanon/judith/002/027.yaml
  text: And he went down into the plain of Damascus in the days of the wheat harvest[a], and he set all their fields on fire; their flocks and herds he gave over to destruction, and he plundered their cities and stripped bare their plains, and struck down all their young men with the edge of the sword.
translation:
  language: fr
  text: Il descendit dans la plaine de Damas au temps de la moisson du blé. Il mit le feu à tous leurs champs, voua à la destruction leurs troupeaux de petit et de gros bétail, pilla leurs villes, dépouilla entièrement leurs plaines et frappa tous leurs jeunes hommes au fil de l’épée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la bouche de l’épée », expression signifiant qu’ils furent tués par l’épée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη
  choice: descendit
  rationale: Conserve le mouvement directionnel du verbe grec dans un français naturel et soutenu.
- source_word: πεδίον Δαμασκοῦ
  choice: la plaine de Damas
  rationale: πεδίον désigne un terrain plat ou une plaine, et le génitif marque ici l’appartenance géographique.
- source_word: ἐν ἡμέραις θερισμοῦ πυρῶν
  choice: au temps de la moisson du blé
  rationale: Rend naturellement l’expression saisonnière tout en conservant la précision de πυρῶν, « blé ».
- source_word: ἐνέπρησεν πάντας τοὺς ἀγροὺς αὐτῶν
  choice: mit le feu à tous leurs champs
  rationale: Exprime clairement la valeur causative du verbe et le cadre agricole de ἀγρούς.
- source_word: τὰ ποίμνια καὶ τὰ βουκόλια
  choice: leurs troupeaux de petit et de gros bétail
  rationale: Maintient la distinction entre les troupeaux, notamment d’ovins, et les hardes ou troupeaux de bovins, sans introduire une espèce trop précise.
- source_word: ἔδωκεν εἰς ἀφανισμόν
  choice: voua à la destruction
  rationale: Reproduit la construction forte « livrer/vouer à la destruction » dans un français idiomatique.
- source_word: ἐσκύλευσεν
  choice: pilla
  rationale: Désigne directement l’action de prendre du butin dans les villes.
- source_word: τὰ πεδία αὐτῶν ἐξελίκμησεν
  choice: dépouilla entièrement leurs plaines
  rationale: Le verbe évoque l’action de nettoyer ou d’emporter complètement, comme lors du vannage; cette formulation conserve l’idée de dévastation totale sans imposer une image agricole obscure en français.
- source_word: νεανίσκους
  choice: jeunes hommes
  rationale: Rend simplement et précisément le groupe masculin désigné par le grec.
- source_word: ἐν στόματι ῥομφαίας
  choice: au fil de l’épée
  rationale: Traduit par l’idiome français usuel l’expression grecque littérale « par la bouche de l’épée ».
