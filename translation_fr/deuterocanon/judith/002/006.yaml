  text: And you shall go out to meet all the land toward the west[b][a], because they disobeyed the word of my mouth.
translation:
  language: fr
  text: Tu partiras à la rencontre de tout le pays, vers l’ouest[a], parce qu’ils n’ont pas obéi à la parole de ma bouche[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’ouest ». L’expression grecque peut désigner une direction aussi bien qu’une région.
    reason: lexical_alternative
  - marker: b
    text: L’expression « la parole de ma bouche » désigne ici une parole prononcée, notamment un ordre ou un décret.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελεύσῃ
  choice: tu partiras
  rationale: Le futur moyen de ἐξέρχομαι exprime ici, dans un ordre adressé directement, le fait de se mettre en route. « Tu partiras » est naturel en français et n’ajoute pas explicitement une nuance militaire.
- source_word: εἰς συνάντησιν
  choice: à la rencontre de
  rationale: Cette expression signifie couramment « aller à la rencontre de ». Le contexte implique une confrontation, mais la traduction conserve l’ambiguïté lexicale du grec au lieu de rendre directement « attaquer » ou « affronter ».
- source_word: πάσῃ τῇ γῇ
  choice: tout le pays
  rationale: Le singulier γῇ accompagné de πᾶς désigne ici l’ensemble d’un territoire. « Tout le pays » préserve ce sens collectif sans transformer le singulier en « tous les pays ».
- source_word: ἐπὶ δυσμᾶς
  choice: vers l’ouest
  rationale: La locution peut indiquer soit une direction occidentale, soit la région occidentale. « Vers l’ouest » rend clairement la valeur directionnelle tout en laissant l’autre possibilité en note.
- source_word: ἠπείθησαν
  choice: ils n’ont pas obéi
  rationale: L’aoriste de ἀπειθέω indique le refus ou le défaut d’obéissance. « Ils n’ont pas obéi » est direct, courant et fidèle.
- source_word: τῷ ῥήματι τοῦ στόματός μου
  choice: à la parole de ma bouche
  rationale: La traduction conserve l’expression concrète et solennelle du grec, qui désigne une parole prononcée ayant valeur d’ordre ou de décret.
