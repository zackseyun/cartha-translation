translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe fragmentaire du début est conservée plutôt que lissée, avec une note explicative. « Il prit avec lui » rend naturellement l’idée de rassembler ou d’emmener ses forces sans alourdir la phrase.
