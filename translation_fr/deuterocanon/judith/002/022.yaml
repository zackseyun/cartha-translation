  text: of the strongholds of upper Cilicia. And he took all his forces[a], the foot soldiers and the horsemen and his chariots, and went away into the hill country.
translation:
  language: fr
  text: des places fortes de la Cilicie supérieure.[a] Il emmena toutes ses forces, les fantassins, les cavaliers et ses chars, puis s’en alla dans la région montagneuse.
  philosophy: optimal-equivalence
  footnotes:
