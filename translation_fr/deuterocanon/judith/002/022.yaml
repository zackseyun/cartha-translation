lexical_decisions:
- source_word: στερᾶς
  choice: places fortes
  rationale: Dans ce contexte militaire, le terme désigne vraisemblablement des positions ou localités fortifiées. « Places fortes » est naturel en français et convient à la construction fragmentaire qui prolonge le verset précédent.
- source_word: ἄνω Κιλικίας
  choice: haute Cilicie
  rationale: ἄνω a ici un sens géographique. « Haute Cilicie » est la désignation française claire de la partie supérieure de la région.
- source_word: δύναμιν
  choice: forces
  rationale: Dans ce contexte, δύναμις désigne l’ensemble des forces armées, ensuite détaillées en fantassins, cavaliers et chars.
- source_word: πεζοὺς
  choice: fantassins
  rationale: Le mot désigne les soldats combattant à pied. « Fantassins » est précis, courant et concis.
- source_word: ἱππεῖς
  choice: cavaliers
  rationale: Le terme désigne des combattants montés. « Cavaliers » restitue directement cette réalité militaire.
- source_word: ἅρματα
  choice: chars
  rationale: Le sens militaire de « chars » est clair dans l’énumération; ajouter « de guerre » serait explicatif plutôt que nécessaire.
- source_word: ἀπῆλθεν
  choice: partit
  rationale: Le verbe exprime le départ depuis le lieu précédent. « Partit » est naturel et suffisamment précis en français.
- source_word: ὀρεινήν
  choice: région montagneuse
  rationale: Employé substantivement, l’adjectif désigne une contrée de montagnes ou de hauteurs. « Région montagneuse » reste précis sans imposer un toponyme.
