  yaml_path: translation/deuterocanon/judith/002/001.yaml
  text: And in the eighteenth year[a], on the twenty-second day of the first month, a word came in the house of Nebuchodonosor king of the Assyrians, to take vengeance on all the land[c][b], just as he had spoken.
translation:
  language: fr
  text: La dix-huitième année, le vingt-deuxième jour du premier mois, il fut question[c], dans la maison[a] de Nabuchodonosor, roi des Assyriens, de tirer vengeance de tout le pays[b], comme il l’avait dit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le palais » ou « à la cour de Nabuchodonosor ». Le grec dit littéralement « dans la maison ».
    reason: lexical_alternative
  - marker: b
    text: Ou « de toute la terre ». Le mot grec peut désigner aussi bien un pays que la terre.
    reason: lexical_alternative
  - marker: c
    text: 'Le grec dit plus littéralement : « une parole advint ». L’expression peut aussi signifier qu’une décision fut prise ou qu’un décret fut promulgué.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ ἔτει τῷ ὀκτωκαιδεκάτῳ
  choice: La dix-huitième année
  rationale: Cette tournure française concise et naturelle conserve la formule de datation grecque.
- source_word: δευτέρᾳ καὶ εἰκάδι τοῦ πρώτου μηνός
  choice: le vingt-deuxième jour du premier mois
  rationale: L’expression ordinale grecque désigne le vingt-deuxième jour; la formulation explicite évite toute ambiguïté en français moderne.
- source_word: ἐγένετο λόγος
  choice: une parole se fit entendre
  rationale: Cette formulation conserve λόγος comme « parole » et évite de préciser indûment qu’un décret officiel fut promulgué, tout en restant plus naturelle que le calque « une parole advint ».
- source_word: ἐν οἴκῳ Ναβουχοδονοσὸρ
  choice: dans la maison de Nabuchodonosor
  rationale: « Maison » reproduit le terme grec οἶκος sans trancher entre résidence royale, palais et cour; la note signale ces nuances.
- source_word: βασιλέως Ἀσσυρίων
  choice: roi des Assyriens
  rationale: Rendu direct du titre royal grec, dans l’ordre naturel du français.
- source_word: ἐκδικῆσαι
  choice: tirer vengeance de
  rationale: Cette expression rend la notion de vengeance ou de châtiment sans ajouter explicitement le pronom réfléchi absent du grec.
- source_word: πᾶσαν τὴν γῆν
  choice: tout le pays
  rationale: Dans ce contexte politique et territorial, γῆ désigne vraisemblablement le pays ou le territoire; « terre entière » demeure possible et figure en note.
- source_word: καθὼς ἐλάλησεν
  choice: comme il l’avait dit
  rationale: Formulation française courante qui conserve le renvoi aux paroles antérieures de Nabuchodonosor.
theological_decisions:
- issue: Le degré de précision à donner à ἐγένετο λόγος dans un cadre royal
  choice: une parole se fit entendre
  alternative: une décision fut prise; un décret fut promulgué
  rationale: Le grec ne précise pas s’il s’agit d’une résolution intérieure, d’un ordre oral ou d’un édit formel. Le texte principal conserve donc une certaine indétermination, et la note expose les lectures institutionnelles possibles.
- issue: La portée de γῆ
  choice: tout le pays
  alternative: toute la terre
  rationale: Le contexte narratif favorise le sens territorial, sans exclure la portée plus large que peut avoir γῆ; l’alternative est conservée en note.
- issue: Le sujet implicite de l’infinitif ἐκδικῆσαι
  choice: il fallait tirer vengeance
  alternative: pour tirer vengeance
  rationale: La tournure explicite le contenu de la parole tout en laissant le sujet de l’action dépendre du contexte, plutôt que d’ajouter « lui-même », absent du grec.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve la datation solennelle du récit. « Tirer vengeance » maintient une légère élévation de registre adaptée au cadre royal, tandis que les notes préservent les ambiguïtés lexicales du grec.
