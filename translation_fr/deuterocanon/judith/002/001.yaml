  to: La dix-huitième année, le vingt-deuxième jour du premier mois, il fut question[c], dans la maison[a] de Nabuchodonosor, roi des Assyriens, de tirer vengeance de tout le pays[b], comme il l’avait dit.
  rationale: La révision remplace l’impersonnel « il fallait », qui ajoute une obligation non exprimée, par « il fut question de », une expression française naturelle qui reflète l’apparition d’un λόγος dans la maison royale tout en conservant l’indétermination entre discussion, décision et décret. Les notes sont préservées, et la note relative à ἐγένετο λόγος est rattachée à son rendu français.
