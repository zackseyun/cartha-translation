  naturalness: Le français est soutenu et lisible. « Une parole se fit entendre » est possible, mais « il fut question ... de » rend plus naturellement en français moderne l’émergence d’un λόγος dans un contexte de cour, sans devoir recourir à l’impersonnel « il fallait ».
  terminology: « Nabuchodonosor », « roi des Assyriens », « maison » et « tirer vengeance » conviennent. « Il fut question » ne préjuge ni d’un décret officiel ni d’une résolution formelle; la note maintient les autres possibilités.
