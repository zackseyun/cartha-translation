  text: And Bagoas went in and knocked on the curtain of the tent[b][a], for he assumed that he was sleeping with Judith.
translation:
  language: fr
  text: Bagoas entra et frappa à la tenture de la tente[a], car il supposait qu’Holopherne dormait avec Judith[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « frappa le rideau de la tente ». Le grec emploie un verbe signifiant littéralement « frapper » et un nom pouvant désigner une tenture ou un rideau d’entrée.'
    reason: lexical_alternative
  - marker: b
    text: Cette proposition rapporte ce que Bagoas supposait au sujet d’Holopherne ; le grec ne présente pas cette supposition comme un fait.
    reason: cultural_note
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: entra
  rationale: L’aoriste de εἰσέρχομαι indique l’entrée de Bagoas; « entra » est naturel et fidèle dans ce récit.
- source_word: ἔκρουσε
  choice: frappa contre
  rationale: Le verbe signifie « frapper » ou « donner un coup ». Avec un rideau, « frappa contre » conserve l’action grecque sans laisser entendre qu’un rideau rigide produirait le son d’une porte.
- source_word: αὐλαίαν
  choice: rideau
  rationale: Dans le cadre d’une tente, αὐλαία désigne une tenture ou un rideau d’entrée; « rideau » est clair en français moderne.
- source_word: σκηνῆς
  choice: tente
  rationale: Le contexte narratif désigne la tente d’Holopherne; « tabernacle » introduirait à tort une connotation cultuelle.
- source_word: ὑπενόειτο
  choice: il supposait
  rationale: Cette forme exprime une supposition ou une inférence. Le sujet masculin est rendu par « il » et renvoie naturellement à Bagoas, sans transformer sa supposition en fait établi.
- source_word: καθεύδειν
  choice: qu’il dormait
  rationale: L’infinitif signifie « dormir ». La tournure française convient au discours indirect et ne précise pas davantage la nature de la situation.
- source_word: μετὰ Ἰουδείθ
  choice: avec Judith
  rationale: μετά avec le génitif signifie « avec ». Cette formulation préserve l’implication contextuelle sans l’expliciter ni l’amplifier.
- source_word: Βαγώας
  choice: Bagoas
  rationale: Le nom propre est translittéré sous sa forme française usuelle.
theological_decisions:
- issue: Statut de la présence supposée d’Holopherne avec Judith
  choice: « il supposait » présente explicitement l’idée comme l’inférence de Bagoas
  alternative: « on pensait » ou une formulation laissant croire que le narrateur affirme le fait
  rationale: Le grec ὑπενόειτο marque une supposition; la traduction ne doit pas convertir cette perception en réalité narrative.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple maintient le registre du récit écrit; l’imparfait exprime la supposition en cours. Les deux appels de note figurent dans le texte dans l’ordre [a], [b].
