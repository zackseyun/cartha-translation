- from: Bagoas entra et frappa contre le rideau de la tente[a], car il supposait qu’il dormait avec Judith[b].
  to: Bagoas entra et frappa à la tenture de la tente[a], car il supposait qu’Holopherne dormait avec Judith[b].
  rationale: La révision lève une ambiguïté grammaticale importante en français en explicitant l’antécédent d’αὐτόν, Holopherne, tout en maintenant Bagoas comme sujet de la supposition. Elle remplace aussi une collocation moins naturelle par une formulation française plus fluide, sans surinterpréter la scène ni l’expression « dormait avec Judith ». Les appels de note demeurent correctement ancrés et ordonnés.
