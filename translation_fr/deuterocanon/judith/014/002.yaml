    text: « Fils d’Assour » désigne les Assyriens. Le terme grec traduit par « avant-garde » peut aussi désigner un avant-poste ou un poste avancé.
    reason: Note culturelle et alternative lexicale préservant l’expression littérale et l’étendue de sens de προφυλακή.
