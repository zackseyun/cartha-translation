- from: 'Et voici ce qui arrivera : dès que l’aube poindra et que le soleil se lèvera sur la terre, chacun de vous prendra ses armes de guerre, et tout homme vigoureux sortira de la ville. Vous leur donnerez un chef et ferez semblant de descendre dans la plaine à la rencontre de l’avant-garde des fils d’Assour[a] ; mais vous ne descendrez pas.'
  to: Et il arrivera que, dès que l’aube poindra et que le soleil se lèvera sur la terre, chacun de vous prendra ses armes de guerre, et tout homme vigoureux sortira hors de la ville. Vous leur donnerez un chef, comme si vous descendiez dans la plaine vers l’avant-garde des fils d’Assour[a] ; mais vous ne descendrez pas.
  rationale: 'La révision évite d’ajouter l’idée d’une rencontre avec l’avant-garde et resserre la syntaxe sur la comparaison participiale grecque. Elle conserve les choix sûrs du projet : la référence masculine explicite, la terminologie militaire, l’ethnonyme littéral assorti d’une note, et la force directive des futurs.'
