base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/002.yaml
  text: And it shall be[a], when dawn breaks and the sun rises upon the earth, each of you shall take up your weapons of war, and every mighty man shall go out beyond the city. You shall appoint a leader over them, as though going down to the plain against the advance guard of the sons of Asshur[b]; but you shall not go down.
translation:
  language: fr
  text: Et il arrivera que, dès que l’aube poindra et que le soleil se lèvera sur la terre, chacun de vous prendra ses armes de guerre, et tout homme vigoureux sortira hors de la ville. Vous leur donnerez un chef, comme si vous descendiez dans la plaine vers l’avant-garde des fils d’Assour[a] ; mais vous ne descendrez pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Fils d’Assour » désigne les Assyriens. Le terme grec traduit par « avant-garde » peut aussi désigner un avant-poste ou un poste avancé.
    reason: Note culturelle et alternative lexicale préservant l’expression littérale et l’étendue de sens de προφυλακή.
lexical_decisions:
- source_word: διαφαύσῃ ὁ ὄρθρος
  choice: l’aube poindra
  rationale: Expression française naturelle et digne pour l’apparition de la première lumière, correspondant à l’idée de l’aube qui commence à luire.
- source_word: ἐξέλθῃ ὁ ἥλιος ἐπὶ τὴν γῆν
  choice: le soleil se lèvera sur la terre
  rationale: Rend naturellement le mouvement du soleil qui paraît au-dessus de la terre sans réduire γῆ à un territoire particulier.
- source_word: ἀναλήμψεσθε ἕκαστος τὰ σκεύη τὰ πολεμικά
  choice: chacun de vous prendra ses armes de guerre
  rationale: « Prendra » exprime la prise en main ; « armes de guerre » convient au contexte, même si σκεύη peut plus largement désigner l’équipement militaire.
- source_word: πᾶς ἀνὴρ ἰσχύων
  choice: tout homme vigoureux
  rationale: Préserve la référence masculine explicite de ἀνήρ et exprime l’aptitude physique ou militaire indiquée par ἰσχύων.
- source_word: ἐξελεύσεσθε ... ἔξω τῆς πόλεως
  choice: sortira de la ville
  rationale: Le français exprime naturellement par « sortir de » le mouvement vers l’extérieur de la ville.
- source_word: δώσετε ἀρχηγὸν εἰς αὐτούς
  choice: Vous leur donnerez un chef
  rationale: Traduction proche de la construction grecque, intelligible en français comme désignation d’un responsable à leur tête.
- source_word: ὡς καταβαίνοντες ἐπὶ τὸ πεδίον
  choice: ferez semblant de descendre dans la plaine
  rationale: Dans le contexte de la manœuvre décrite, ὡς indique l’apparence ou la feinte ; cette formulation rend explicitement la tactique sans modifier son contenu.
- source_word: εἰς τὴν προφυλακὴν υἱῶν Ἀσσούρ
  choice: à la rencontre de l’avant-garde des fils d’Assour
  rationale: La préposition εἰς peut indiquer la direction sans imposer à elle seule une attaque ; προφυλακή désigne ici vraisemblablement une avant-garde, tout en pouvant aussi signifier un poste avancé ou une garde avancée.
- source_word: οὐ καταβήσεσθε
  choice: vous ne descendrez pas
  rationale: Conserve le futur grec, employé ici avec une force directive, et le contraste net avec la descente simulée.
theological_decisions:
- issue: Désignation masculine dans πᾶς ἀνὴρ ἰσχύων
  choice: tout homme vigoureux
  alternative: toute personne apte au combat / tout guerrier
  rationale: Le grec emploie explicitement ἀνήρ, « homme », dans un contexte de mobilisation militaire ; la traduction ne neutralise donc pas cette référence.
- issue: Identification de υἱῶν Ἀσσούρ
  choice: fils d’Assour
  alternative: Assyriens
  rationale: La formulation littérale conserve l’expression ethnonymique grecque et son relief ancien ; la note indique clairement qu’elle désigne les Assyriens.
- issue: Valeur de εἰς devant προφυλακή
  choice: à la rencontre de
  alternative: contre / vers
  rationale: Cette solution préserve la direction vers l’avant-garde sans décider de façon excessive si le mouvement feint est simplement orienté vers elle ou hostile.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe impérative conserve les futurs du grec. « Et voici ce qui arrivera » évite un calque lourd de καὶ ἔσται, tandis que « armes de guerre », « chef » et « fils d’Assour » gardent la couleur du texte source.
