  text: And he went into the tent where Judith was staying[a], but he did not find her; and he rushed out to the people, crying out[b],
translation:
  language: fr
  text: 'Il entra dans la tente où Judith logeait[a], mais ne la trouva pas. Alors il se précipita dehors vers le peuple en criant[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « séjournait ». Le terme grec désigne le fait de loger ou de séjourner temporairement dans un lieu.
