lexical_decisions:
- source_word: εἰσῆλθεν
  choice: entra
  rationale: Le passé simple convient au récit soutenu en français et exprime directement l’entrée dans la tente.
- source_word: σκηνήν
  choice: tente
  rationale: Dans le contexte d’un camp militaire, « tente » est le terme français naturel et précis.
- source_word: καταλύουσα
  choice: logeait
  rationale: Le participe désigne le fait de séjourner temporairement en un lieu; « logeait » rend cette nuance avec naturel.
- source_word: οὐχ εὗρεν αὐτήν
  choice: ne la trouva pas
  rationale: Traduction directe qui indique simplement son absence, sans ajouter la nuance plus forte de « découvrir ».
- source_word: ἐξεπήδησεν
  choice: se précipita dehors
  rationale: Cette formulation restitue le mouvement soudain, vif et dirigé vers l’extérieur exprimé par le verbe grec.
- source_word: λαόν
  choice: le peuple
  rationale: Le grec désigne largement les gens rassemblés; « peuple » évite de restreindre indûment le référent à la foule ou aux soldats.
- source_word: κράζων
  choice: en criant
  rationale: Le gérondif conserve la simultanéité du participe grec et « criant » exprime clairement la force de la voix.
