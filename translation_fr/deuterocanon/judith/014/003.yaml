  text: And these men, after taking up their armor, will go into their camp and will rouse the commanders of the army of Assyria;
translation:
  language: fr
  text: Après avoir pris leurs armes, ceux-ci iront dans leur camp et réveilleront les commandants de l’armée d’Assyrie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναλαβόντες
  choice: Après avoir pris
  rationale: Le participe aoriste marque ici une action antérieure aux verbes principaux; cette tournure restitue clairement la succession des actions en français naturel.
- source_word: οὗτοι
  choice: ceux-ci
  rationale: Le démonstratif est maintenu avec sa valeur déictique et emphatique, sans ajouter un nom absent du grec.
- source_word: τὰς πανοπλίας αὐτῶν
  choice: leurs armes
  rationale: πανοπλία désigne l’armement complet ou l’équipement de guerre. « Leurs armes » est naturel dans ce contexte, tout en évitant le sens moderne trop étroit d’« armure ».
- source_word: παρεμβολὴν
  choice: camp
  rationale: Dans ce contexte militaire, le terme désigne le campement d’une armée.
- source_word: ἐγεροῦσι
  choice: réveilleront
  rationale: Le futur d’ἐγείρω peut signifier éveiller ou faire lever. Le contexte immédiat favorise l’action concrète de réveiller les chefs militaires.
- source_word: στρατηγοὺς
  choice: commandants
  rationale: Le terme désigne des chefs militaires sans imposer un grade moderne précis.
- source_word: δυνάμεως
  choice: armée
  rationale: Dans cette construction militaire, δύναμις renvoie à la force armée; « armée » est le rendu français le plus clair.
- source_word: Ἀσσούρ
  choice: Assyrie
  rationale: « Assyrie » est la désignation géographique et politique française habituelle dans ce contexte.
