base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/007.yaml
  text: And when they had taken him up[a], he fell at Judith’s feet and bowed before her, and he said, “Blessed are you in every dwelling of Judah and among every nation[b]; those who hear your name will be thrown into confusion.”
translation:
  language: fr
  text: 'Quand on l’eut relevé, il tomba aux pieds de Judith et se prosterna devant elle. Il dit : « Tu es bénie dans toute demeure de Juda[a] et parmi toutes les nations : ceux qui entendront ton nom seront bouleversés[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans toute tente de Juda ». Le grec peut désigner une tente ou, plus généralement, une demeure.
    reason: lexical_alternative
  - marker: b
    text: Ou « seront troublés » ou « seront jetés dans la confusion ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέλαβον
  choice: on l’eut relevé
  rationale: Dans le contexte, le verbe évoque le fait de l’aider à se relever. La tournure française conserve le mouvement concret sans lui donner le sens technique de « recevoir ».
- source_word: προσέπεσεν τοῖς ποσὶν
  choice: il tomba aux pieds de Judith
  rationale: Cette formulation naturelle conserve l’image physique ainsi que la valeur d’hommage ou de supplication.
- source_word: προσεκύνησεν τῷ προσώπῳ αὐτῆς
  choice: se prosterna devant elle
  rationale: προσκυνέω peut désigner l’adoration ou l’hommage. Ici, le geste est adressé à Judith ; « se prosterna » exprime nettement la posture sans imposer l’idée d’un culte divin.
- source_word: Εὐλογημένη σὺ
  choice: Tu es bénie
  rationale: Cette formule directe et digne restitue naturellement la bénédiction en français moderne.
- source_word: ἐν παντὶ σκηνώματι Ἰούδα
  choice: dans toute demeure de Juda
  rationale: σκηνώμα peut désigner une tente, une demeure ou une habitation. « Demeure » garde la portée générale du terme, tandis qu’une note signale son sens plus concret possible.
- source_word: ἐν παντὶ ἔθνει
  choice: parmi toutes les nations
  rationale: Le singulier distributif grec est rendu par un pluriel idiomatique qui exprime l’extension de la renommée de Judith au-delà de Juda.
- source_word: ταραχθήσονται
  choice: seront bouleversés
  rationale: Le futur passif exprime une perturbation profonde sans préciser s’il s’agit surtout de peur, de trouble ou de confusion. « Bouleversés » maintient cette latitude.
theological_decisions:
- issue: Sens de προσκυνέω dans un geste adressé à Judith
  choice: se prosterna devant elle
  alternative: l’adora / lui rendit hommage
  rationale: Puisque le geste vise une personne humaine, « se prosterna » préserve l’acte corporel et l’ambiguïté de sa portée sans transformer explicitement cet hommage en adoration divine.
translation_notes:
  register: Français international moderne, fluide et digne. Le discours conserve une tonalité solennelle sans archaïsmes. Les notes rendent visibles les principales possibilités lexicales du grec.
