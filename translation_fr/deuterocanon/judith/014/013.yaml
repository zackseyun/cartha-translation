    rationale: οἱ δοῦλοι est un article défini ; « les esclaves » rend le mépris contextuel sans ajouter l’effet déictique de « ces ».
  - severity: low
    issue: « préposé à tous ses biens » peut limiter indûment la fonction à la gestion de biens matériels.
    rationale: πάντων τῶν αὐτοῦ désigne ce qui appartenait ou relevait d’Holopherne dans un sens global. « Chargé de toutes ses affaires » conserve mieux l’étendue de la responsabilité sans imposer un titre.
