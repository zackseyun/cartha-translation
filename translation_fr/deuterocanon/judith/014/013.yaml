base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/013.yaml
  text: And they came to Holofernes’s tent[a], and said to the one over all his affairs, “Wake our lord at once, because the servants have dared to come down against us for battle, so that they may be utterly destroyed.”
translation:
  language: fr
  text: 'Ils arrivèrent à la tente d’Holopherne et dirent à celui qui était chargé de toutes ses affaires[a] : « Réveille donc immédiatement notre maître, car les esclaves ont osé descendre contre nous pour nous livrer bataille, afin d’être exterminés jusqu’au dernier. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à celui qui était préposé à tout ce qui lui appartenait », c’est-à-dire l’intendant principal ou le principal serviteur d’Holopherne.
    reason: La formulation grecque désigne une fonction de responsabilité étendue sans donner ici de titre précis.
lexical_decisions:
- source_word: παρεγένοντο
  choice: arrivèrent
  rationale: Le verbe indique ici l’arrivée à un lieu; « arrivèrent » rend clairement le mouvement narratif.
- source_word: σκηνή
  choice: tente
  rationale: Dans ce contexte militaire, il s’agit de la tente d’Holopherne, sans connotation cultuelle.
- source_word: τῷ οὔτι ἐπὶ πάντων τῶν αὐτοῦ
  choice: à celui qui était préposé à tous ses biens
  rationale: Malgré la formulation grecque transmise, quelque peu difficile, le groupe désigne l’intendant ou responsable placé au-dessus de ce qui appartient à Holopherne. Cette traduction garde la fonction sans introduire un titre absent du texte.
- source_word: Ἔγειρον δὴ
  choice: Réveille donc immédiatement
  rationale: L’impératif et la particule δὴ expriment une demande pressante; cette formulation est naturelle et énergique en français.
- source_word: κύριον
  choice: maître
  rationale: Le référent est un supérieur humain. « Maître » convient ici mieux que le titre divin « Seigneur ».
- source_word: δοῦλοι
  choice: esclaves
  rationale: Le terme est employé avec mépris pour désigner des adversaires tenus pour inférieurs; « esclaves » conserve cette force dépréciative, plus nettement que « serviteurs ».
- source_word: καταβαίνειν ἐφʼ ἡμᾶς
  choice: descendre contre nous
  rationale: Cette traduction préserve à la fois l’image spatiale de la descente et l’orientation hostile exprimée par ἐπί.
- source_word: εἰς πόλεμον
  choice: pour nous livrer bataille
  rationale: La tournure exprime ici l’engagement dans le combat; l’ajout idiomatique de « nous » explicite en français la relation déjà portée par « contre nous ».
- source_word: ἵνα ἐξολοθρευθῶσιν εἰς τέλος
  choice: afin d’être exterminés jusqu’au dernier
  rationale: ἐξολοθρεύω exprime l’extermination, et εἰς τέλος en souligne le caractère total. « Jusqu’au dernier » restitue cette emphase de façon naturelle.
theological_decisions:
- issue: Valeur de δοῦλοι dans une parole militaire méprisante
  choice: esclaves
  alternative: serviteurs
  rationale: Le contexte n’évoque pas un service honorable, mais une désignation insultante de personnes considérées comme subordonnées. « Esclaves » maintient la dureté du grec sans l’atténuer.
- issue: Rapport logique de ἵνα ἐξολοθρευθῶσιν
  choice: afin d’être exterminés
  alternative: si bien qu’ils seront exterminés
  rationale: La construction grecque peut porter une nuance de but ou de résultat envisagé. « Afin de » conserve la forme finale et l’ironie menaçante du propos sans convertir explicitement la phrase en simple prédiction.
translation_notes:
  register: Français international moderne, narratif et digne. Le discours direct garde l’urgence et le mépris militaire de l’original. « Holopherne » suit la forme française traditionnelle du nom.
