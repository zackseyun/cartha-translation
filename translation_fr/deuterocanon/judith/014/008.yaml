  text: And now tell me what you have done in these days[a]. And Judith reported to him, in the midst of the people, all that she had done[b], from the day when she went out until the time when she was speaking to them.
translation:
  language: fr
  text: Et maintenant, raconte-moi ce que tu as fait ces jours-ci. Judith lui raconta alors, au milieu du peuple[a], tout ce qu’elle avait fait depuis le jour où elle était sortie jusqu’au moment où elle s’adressait à eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant le peuple ». L’expression grecque peut désigner sa position parmi les gens ou souligner qu’elle parlait publiquement en leur présence.
    reason: lexical_alternative
  - marker: b
    text: Ou « jusqu’au moment où elle leur parla ». Le grec emploie un imparfait, qui peut mettre en relief une parole en cours ou servir simplement à faire avancer le récit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάγγειλόν μοι
  choice: raconte-moi
  rationale: L’impératif demande à Judith de relater directement les événements. « Raconte-moi » est naturel en français et conserve l’adresse personnelle exprimée par μοι.
- source_word: ὅσα ἐποίησας
  choice: tout ce que tu as fait
  rationale: ὅσα désigne l’ensemble des actes accomplis; le passé composé convient à des faits récents dont le récit est demandé maintenant.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: au cours de ces jours
  rationale: Cette formulation garde la référence temporelle du grec sans préciser indûment s’il s’agit seulement des tout derniers jours ou de toute la période écoulée.
- source_word: ἀπήγγειλεν
  choice: raconta alors
  rationale: Le verbe répond à l’ordre ἀνάγγειλον et indique qu’elle fait le récit demandé. « Alors » rend naturellement la progression narrative sans ajouter de contenu substantiel.
- source_word: ἐν μέσῳ τοῦ λαοῦ
  choice: au milieu du peuple
  rationale: La traduction conserve l’image spatiale du grec tout en laissant ouverte la possibilité d’un récit fait publiquement devant le peuple.
- source_word: πάντα ὅσα ἦν πεποιηκυῖα
  choice: tout ce qu’elle avait fait
  rationale: Le plus-que-parfait français rend l’action accomplie avant le récit, portée par la périphrase grecque au plus-que-parfait.
- source_word: ἀφʼ ἧς ἡμέρας ἐξῆλθεν
  choice: depuis le jour où elle était sortie
  rationale: « Était sortie » exprime son départ antérieur sans préciser un lieu que le grec ne nomme pas dans ce verset.
- source_word: ἕως οὗ ἐλάλει αὐτοῖς
  choice: jusqu’au moment où elle leur parlait
  rationale: L’imparfait « parlait » préserve l’aspect imperfectif de ἐλάλει et présente la prise de parole comme en cours au point terminal du récit.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste proche du grec tout en évitant les tournures inutilement archaïques. Les deux notes maintiennent les ambiguïtés réelles de la scène publique et de l’aspect verbal.
