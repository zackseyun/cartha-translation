  rationale: La révision conserve le sens, le rythme narratif et l'ambiguïté de χελωνίς. Elle rapproche le dernier membre de la construction grecque sans transformer l'énoncé en une précision anatomique absente du texte, et elle signale en note la nuance de ἐρριμμένον.
