  text: But when no one answered[a], he drew aside the curtain and went into the bedroom, and found him lying dead on the canopy[b], and his head had been taken from him.
translation:
  language: fr
  text: Mais comme personne ne répondait, il écarta la tenture, entra dans la chambre à coucher et le trouva étendu, mort, sur le baldaquin[a] ; sa tête lui avait été enlevée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur la tenture du lit » ; le mot grec peut désigner un baldaquin, un filet ou une tenture associés au lit.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sa tête avait été enlevée de lui » ; c''est-à-dire qu''il avait été décapité. Le terme rendu par « étendu » peut aussi suggérer qu''il avait été jeté là.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δʼ οὐθεὶς ἐπήκουσεν
  choice: Mais comme personne ne répondait
  rationale: Dans ce contexte, ἐπακούω désigne la réponse attendue après un appel, plutôt que le simple fait d’entendre. L’imparfait français restitue naturellement l’absence persistante de réponse.
- source_word: διαστείλας
  choice: il écarta la tenture
  rationale: Le participe exprime l’action de séparer ou d’écarter. L’objet n’est pas exprimé en grec, mais une tenture est implicitement requise par la scène et rend le geste intelligible en français.
- source_word: κοιτῶνα
  choice: la chambre à coucher
  rationale: κοιτών désigne la pièce où l’on dort. Cette formulation est moderne et claire, sans l’archaïsme de « chambre à coucher royale » ou « chambre nuptiale », notions absentes du terme.
- source_word: ἐπὶ τῆς χελώνιδος
  choice: sur le baldaquin
  rationale: Dans ce contexte, χελωνίς paraît désigner un élément de couverture ou de tenture associé au lit. « Baldaquin » reste accessible, tandis qu’une note conserve l’incertitude quant à la nature exacte de cet élément.
- source_word: ἐρριμμένον νεκρόν
  choice: gisant là, mort
  rationale: Le parfait passif de ῥίπτω présente le corps comme jeté et demeurant sur place. « Gisant là, mort » produit une narration française naturelle tout en gardant le résultat visible de l’action, sans suggérer qu’il reposait paisiblement.
- source_word: ἡ κεφαλὴ αὐτοῦ ἀφῄρητο ἀπʼ αὐτοῦ
  choice: sa tête avait été séparée de son corps
  rationale: Le grec dit littéralement que sa tête avait été retirée de lui. La formulation française explicite le référent corporel sans réduire la phrase au seul résumé « il avait été décapité ».
