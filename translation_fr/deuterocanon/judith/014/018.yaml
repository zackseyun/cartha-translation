  rationale: La révision remplace le terme surinterprétatif « ont trahi » par « ont failli », qui restitue le manquement accusé sans préciser indûment sa nature. Elle conserve « esclaves », l’insistance sur l’unique femme hébraïque et l’image explicite de la décapitation. « Regardez » est plus idiomatique, et la suppression de « plus » aligne la dernière proposition sur l’ellipse du grec.
