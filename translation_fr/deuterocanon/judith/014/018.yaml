  - severity: low
    issue: Ajout de « plus » dans « sa tête n’est plus sur lui »
    rationale: Le grec dit littéralement que la tête « n’est pas sur lui » ; l’ajout temporel est probable dans le contexte mais non nécessaire et affaiblit la littéralité saisissante de l’énoncé.
