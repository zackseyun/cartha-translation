review_pass:
  verdict: revise
  source_fidelity: 'La phrase initiale Ἠθέτησαν οἱ δοῦλοι est rendue de manière trop interprétative par « Les esclaves ont trahi ». Ἀθετέω désigne ici le fait de manquer à son devoir, d’échouer ou de faillir, sans imposer l’idée spécifique de trahison. Le reste suit fidèlement le grec : l’insistance sur une femme, la honte infligée à la maison royale, Holopherne à terre et l’image concrète de la tête absente sont conservés.'
  naturalness: Le français est globalement naturel et d’un registre narratif soutenu approprié. « Car voyez » est toutefois un peu raide dans ce cri d’alarme ; « Regardez » est plus idiomatique. « Sa tête n’est plus sur lui » est compréhensible, mais ajoute « plus », absent du grec ; « sa tête n’est pas sur lui » conserve mieux l’ellipse frappante du texte source.
  terminology: « Esclaves » est un choix défendable pour δοῦλοι dans ce contexte et la note signale correctement l’alternative « serviteurs ». « Holopherne » et « Nabuchodonosor » sont les formes françaises usuelles. « Hébreux » et « maison » sont exacts dans ce contexte.
