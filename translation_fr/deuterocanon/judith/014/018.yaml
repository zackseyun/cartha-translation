base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/018.yaml
  text: The servants have failed; one woman of the Hebrews has brought shame on the house of King Nebuchadnezzar. For look—Holofernes is lying on the ground[a], and his head is not on him.
translation:
  language: fr
  text: 'Les esclaves[a] ont failli ! Une seule femme parmi les Hébreux a couvert de honte la maison du roi Nabuchodonosor. Regardez : Holopherne gît à terre, et sa tête n’est pas sur lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteurs ». Le grec peut désigner des esclaves ou, plus généralement, des serviteurs placés sous l’autorité d’un maître.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠθέτησαν
  choice: ont trahi
  rationale: Le verbe ἀθετέω peut exprimer le rejet, l’infidélité ou le manquement à une obligation. Dans cette exclamation accusatrice, « ont trahi » restitue avec naturel la gravité du manquement sans lui donner une portée juridique ou religieuse précise.
- source_word: οἱ δοῦλοι
  choice: les esclaves
  rationale: Dans ce cadre domestique et militaire, δοῦλοι désigne des subordonnés de condition servile. « Esclaves » conserve ce statut, tandis que « serviteurs » demeure une possibilité contextuelle signalée en note.
- source_word: μία γυνὴ τῶν Ἑβραίων
  choice: une seule femme parmi les Hébreux
  rationale: Cette formulation conserve l’insistance de μία sur le fait qu’une femme à elle seule a infligé cette humiliation, tout en exprimant naturellement son appartenance au peuple hébreu.
- source_word: ἐποίησεν αἰσχύνην εἰς τὸν οἶκον
  choice: a couvert de honte la maison
  rationale: L’expression idiomatique française rend le fait d’attirer la honte publique sur une maison, comprise ici comme la maison royale ou la dynastie.
- source_word: χαμαί
  choice: gît à terre
  rationale: « Gît à terre » rend de façon concise et saisissante la position du corps indiquée par χαμαί.
- source_word: ἡ κεφαλὴ οὐκ ἔστιν ἐπʼ αὐτῷ
  choice: sa tête n’est plus sur lui
  rationale: La formulation volontairement concrète conserve l’image brutale du grec sans ajouter « sur ses épaules » ni paraphraser simplement par « il est décapité ».
theological_decisions:
- issue: Sens social de δοῦλοι dans le récit
  choice: les esclaves
  alternative: les serviteurs
  rationale: Le contexte de la maisonnée et du camp d’un chef militaire rend vraisemblable un statut servile plutôt qu’un simple emploi rémunéré. La variante plus générale est toutefois conservée en note afin de ne pas masquer l’étendue sémantique du terme.
translation_notes:
  register: Français moderne, international et digne. L’exclamation initiale garde la violence de l’accusation; « une seule femme » préserve l’insistance rhétorique du grec. La dernière proposition conserve délibérément son image abrupte plutôt que de l’atténuer.
