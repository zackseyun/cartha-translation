base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/006.yaml
  text: And they called Achior out of the house of Ozias. But when he came and saw the head of Holofernes in the hand of one man in the assembly of the people[a], he fell on his face, and his spirit failed.
translation:
  language: fr
  text: Ils appelèrent Achior hors de la maison d’Ozias. Lorsqu’il arriva et vit la tête d’Holopherne dans la main d’un homme, au milieu de l’assemblée du peuple, il tomba face contre terre et son esprit défaillit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « son souffle l’abandonna » ou « il perdit connaissance ». Le grec dit littéralement que « son esprit défaillit », expression qui décrit ici un effondrement physique ou un évanouissement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσαν
  choice: ils appelèrent
  rationale: Rend simplement le verbe narratif sans donner à l’appel la force supplémentaire qu’impliquerait « convoquèrent ».
- source_word: ἐκ τοῦ οἴκου Ὀζεία
  choice: hors de la maison d’Ozias
  rationale: Le contexte indique naturellement un lieu physique dont Achior est appelé à sortir.
- source_word: ὡς δὲ ἦλθεν
  choice: lorsqu’il arriva
  rationale: Exprime naturellement la progression narrative; δέ sert ici de transition légère plutôt que d’opposition marquée.
- source_word: ἴδεν τὴν κεφαλὴν Ὀλοφέρνου
  choice: vit la tête d’Holopherne
  rationale: Traduction directe qui conserve la construction possessive du grec.
- source_word: ἐν χειρὶ ἀνδρὸς ἑνὸς
  choice: dans la main d’un homme
  rationale: Le français indéfini rend naturellement le singulier explicite ἀνδρὸς ἑνός sans l’insistance artificielle de « d’un seul homme ».
- source_word: ἐν τῇ ἐκκλησίᾳ τοῦ λαοῦ
  choice: au milieu de l’assemblée du peuple
  rationale: Dans ce contexte préchrétien, ἐκκλησία désigne le rassemblement du peuple et non une « Église » au sens institutionnel chrétien.
- source_word: ἔπεσεν ἐπὶ πρόσωπον
  choice: il tomba face contre terre
  rationale: Expression française naturelle et concrète pour la posture décrite littéralement par le grec.
- source_word: ἐξελύθη τὸ πνεῦμα αὐτοῦ
  choice: son esprit défaillit
  rationale: Conserve l’image et l’ambiguïté de πνεῦμα tout en signalant un effondrement physique, sans imposer avec certitude la perte de connaissance.
theological_decisions:
- issue: Sens de πνεῦμα dans la réaction d’Achior
  choice: son esprit défaillit
  alternative: il perdit connaissance / son souffle l’abandonna
  rationale: Le grec peut décrire un évanouissement ou un effondrement par une expression associant l’esprit ou le souffle; la formulation retenue préserve cette latitude sans en faire une affirmation doctrinale sur l’âme.
translation_notes:
  register: Français international moderne, narratif et digne. Les noms propres suivent les formes françaises usuelles « Achior », « Ozias » et « Holopherne ». La syntaxe reste proche du grec tout en évitant des tournures artificielles.
