  text: And when she stopped speaking[a], the people shouted with a loud voice and raised a joyful cry in their city.
translation:
  language: fr
  text: Quand elle cessa de parler, le peuple poussa de grands cris[a] et fit retentir un cri de joie dans sa ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lança une grande clameur » ; le verbe grec peut désigner un cri puissant, parfois même un cri de guerre, mais il exprime ici l’explosion de joie du peuple.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐπαύσατο λαλούσα
  choice: Quand elle eut fini de parler
  rationale: La tournure temporelle introduit naturellement l’événement suivant. « Eut fini de parler » exprime en français courant et soutenu la cessation de la parole, sans lourdeur.
- source_word: ἠλάλαξεν ὁ λαὸς φωνῇ μεγάλῃ
  choice: le peuple poussa de grands cris
  rationale: Ἀλαλάζω désigne une clameur forte, parfois un cri de guerre. Ici, la réaction collective est festive; « poussa de grands cris » restitue l’intensité sans imposer une nuance militaire.
- source_word: ἔδωκεν φωνὴν εὐφρόσυνον
  choice: fit retentir un cri de joie
  rationale: L’expression grecque signifie littéralement « donna une voix joyeuse ». La formulation retenue est idiomatique en français, garde l’idée d’une manifestation vocale publique et rend εὐφρόσυνος par « de joie ».
- source_word: ἐν τῇ πόλει αὐτῶν
  choice: dans sa ville
  rationale: Le possessif grec renvoie collectivement au peuple. En français, « le peuple… sa ville » est plus naturel que « leur ville » tout en conservant le sens possessif.
