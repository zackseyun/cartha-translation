  text: And Judith said to them[a], “Listen to me, brothers, and take this head and hang it on the battlement of your wall.”
translation:
  language: fr
  text: 'Judith leur dit : « Écoutez-moi donc, frères, prenez cette tête et suspendez-la au parapet de votre muraille. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσατε δή μου
  choice: Écoutez-moi donc
  rationale: L’impératif aoriste exprime un ordre direct. « donc » rend ici l’insistance ou l’urgence portée par δή, tandis que le génitif μου dépend naturellement du verbe d’écoute.
- source_word: ἀδελφοί
  choice: frères
  rationale: Le vocatif masculin pluriel s’adresse ici aux hommes de Béthulie; « frères » conserve à la fois la forme et la proximité de l’interpellation.
- source_word: λαβόντες
  choice: prenez
  rationale: 'Le participe aoriste, antérieur sur le plan logique à l’impératif principal, se rend naturellement en français par deux impératifs coordonnés : « prenez… et suspendez-la ».'
- source_word: τὴν κεφαλὴν ταύτην
  choice: cette tête
  rationale: La formulation reste littérale sans ajouter « coupée », notion évidente dans le contexte mais absente de ces mots grecs.
- source_word: κρεμάσατε αὐτήν
  choice: suspendez-la
  rationale: Le verbe désigne l’action de faire pendre ou d’accrocher. « Suspendez-la » est naturel et digne dans ce contexte, sans réduire l’action à sa finalité d’exposition.
- source_word: ἐπὶ τῆς ἐπάλξεως
  choice: au parapet
  rationale: ἐπάλξ désigne la partie supérieure défensive d’une muraille, notamment le parapet ou le crénelage. « Parapet » est précis et immédiatement compréhensible en français.
- source_word: τοῦ τείχους ὑμῶν
  choice: de votre muraille
  rationale: τεῖχος désigne ici l’enceinte défensive de la ville. « Muraille » exprime plus clairement ce sens que le générique « mur ».
