translation_notes:
  register: Français international actuel, narratif et digne. Le singulier distributif « chaque homme » est conservé, suivi du pluriel « ils sortirent » comme dans le grec. Le terme « montées » maintient l’indétermination géographique du texte source, avec une note explicative.
