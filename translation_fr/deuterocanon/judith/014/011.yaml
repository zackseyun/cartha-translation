  text: When dawn came up, they hung the head of Holofernes from the wall, and every man of Israel took up his weapons and went out in companies to the mountain passes.
translation:
  language: fr
  text: Lorsque l’aube se leva, ils suspendirent la tête d’Holopherne à la muraille[a]. Chaque homme d’Israël prit ses armes, et tous sortirent par détachements vers les montées[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « depuis la muraille » ; l’expression grecque peut désigner le point d’où la tête fut suspendue pour être exposée.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « vers les montées » ; il peut s’agir de voies d’accès en pente ou de cols.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡνίκα
  choice: quand
  rationale: Conjonction temporelle simple qui introduit le changement de scène, sans ajouter un marqueur discursif absent du grec.
- source_word: ὁ ὄρθρος ἀνέβη
  choice: l’aube se leva
  rationale: Reproduit naturellement en français l’image grecque de l’aube qui « monte » ou « se lève ».
- source_word: ἐκρέμασαν
  choice: ils suspendirent
  rationale: Rend l’action de pendre ou d’accrocher la tête pour l’exposer, dans un registre digne et précis.
- source_word: τὴν κεφαλὴν Ὀλοφέρνου
  choice: la tête d’Holopherne
  rationale: Rendu direct du complément possessif grec.
- source_word: ἐκ τοῦ τείχους
  choice: à la muraille
  rationale: Formulation française naturelle pour une tête suspendue à l’enceinte; la préposition grecque ἐκ, plus littéralement « depuis/de la muraille », est signalée en note.
- source_word: πᾶς ἀνὴρ Ἰσραήλ
  choice: chaque homme d’Israël
  rationale: Préserve le masculin explicite et la valeur distributive du singulier grec.
- source_word: ἀνέλαβεν
  choice: prit
  rationale: Dans le contexte militaire, prendre ses armes est une tournure française naturelle; « prit » évite la lourdeur de « prit en main ».
- source_word: τὰ ὅπλα αὐτοῦ
  choice: ses armes
  rationale: ὅπλα désigne ici l’équipement offensif ou les armes, plutôt que spécifiquement une armure.
- source_word: ἐξήλθοσαν
  choice: ils sortirent
  rationale: Rend simplement le verbe de mouvement au pluriel, sans ajouter l’idée plus précise de marcher ou de partir au combat.
- source_word: κατὰ σπείρας
  choice: par détachements
  rationale: Exprime des groupes organisés à caractère militaire sans imposer un effectif technique précis.
- source_word: ἐπὶ τὰς ἀναβάσεις
  choice: vers les montées
  rationale: Conserve l’expression topographique assez ouverte du grec, qui désigne littéralement des montées et peut évoquer des voies d’accès en pente ou des cols.
