base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/010.yaml
  text: And when Achior saw all that the God of Israel had done[a], he believed in God greatly, and he circumcised the flesh of his foreskin[b], and was joined to the house of Israel to this day.
translation:
  language: fr
  text: Quand Achior vit tout ce que le Dieu d’Israël avait fait, il crut fermement en Dieu[a], se fit circoncire[b] et fut ajouté à la maison d’Israël jusqu’à ce jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « plaça toute sa confiance en Dieu ». Le verbe grec peut exprimer la foi, la croyance ou la confiance; l’adverbe souligne ici son intensité.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il circoncit la chair de son prépuce ».'
    reason: literal_rendering
lexical_decisions:
- source_word: ἰδὼν
  choice: Quand Achior vit
  rationale: Le participe aoriste introduit la circonstance temporelle des actions principales; cette tournure est naturelle en français et conserve l’enchaînement du grec.
- source_word: πάντα ὅσα ἐποίησεν
  choice: tout ce que ... avait fait
  rationale: Rend la totalité des actes divins qui viennent d’être racontés; le plus-que-parfait convient à leur antériorité par rapport à la réaction d’Achior.
- source_word: ὁ θεὸς τοῦ Ἰσραήλ
  choice: le Dieu d’Israël
  rationale: Titre génitif biblique direct, sans paraphrase.
- source_word: ἐπίστευσεν τῷ θεῷ σφόδρα
  choice: il mit pleinement sa foi en Dieu
  rationale: La tournure exprime naturellement en français l’adhésion confiante marquée par πιστεύω avec le datif, tandis que « pleinement » rend l’intensification de σφόδρα sans la formulation peu idiomatique « crut grandement ».
- source_word: περιέτεμετο τὴν σάρκα τῆς ἀκροβυστίας αὐτοῦ
  choice: se fit circoncire
  rationale: Le moyen grec et son complément concret indiquent la circoncision d’Achior. La formulation française est claire et naturelle, sans préciser indûment qui accomplit l’opération.
- source_word: προσετέθη πρὸς τὸν οἶκον Ἰσραήλ
  choice: fut intégré à la maison d’Israël
  rationale: Le passif décrit son incorporation au peuple; « maison d’Israël » conserve l’expression biblique οἶκος Ἰσραήλ.
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: jusqu’à ce jour
  rationale: Équivalent français conventionnel qui préserve le point de vue temporel du narrateur.
theological_decisions:
- issue: Valeur de πιστεύω dans un contexte d’adhésion au Dieu d’Israël
  choice: il mit pleinement sa foi en Dieu
  alternative: il plaça toute sa confiance en Dieu
  rationale: Le choix maintient explicitement le champ lexical de la foi tout en laissant paraître la dimension de confiance, sans importer une formulation doctrinale postérieure.
- issue: Incorporation d’Achior à Israël
  choice: fut intégré à la maison d’Israël
  alternative: fut ajouté à la maison d’Israël
  rationale: La traduction exprime l’incorporation communautaire affirmée par le passif grec sans introduire de terminologie technique telle que « prosélyte ».
- issue: Agent de la circoncision
  choice: se fit circoncire
  alternative: se circoncit lui-même
  rationale: La voix moyenne concerne Achior sans exiger qu’il ait matériellement pratiqué l’acte lui-même; la formulation choisie évite de trancher ce détail.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit clairement la progression du grec. « Maison d’Israël » est conservé comme expression biblique, tandis que les formulations peu naturelles ou susceptibles de surinterpréter la voix moyenne sont évitées.
