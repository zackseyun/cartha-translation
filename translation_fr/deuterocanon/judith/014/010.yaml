revisions:
- from: Quand Achior vit tout ce que le Dieu d’Israël avait fait, il mit pleinement sa foi en Dieu[a], se fit circoncire[b] et fut intégré à la maison d’Israël, jusqu’à ce jour[c].
  to: Quand Achior vit tout ce que le Dieu d’Israël avait fait, il crut fermement en Dieu[a], se fit circoncire[b] et fut ajouté à la maison d’Israël jusqu’à ce jour.
  rationale: La révision conserve le sens et les ambiguïtés du grec, améliore l’idiomaticité de l’expression de la foi, restitue plus directement le passif « fut ajouté », et corrige la note sur la formulation littérale de la circoncision. La note redondante sur « jusqu’à ce jour » est supprimée avec son appel.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T09:39:52Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens global est fidèle au grec. « Se fit circoncire » est une bonne manière française de rendre la voix moyenne sans déterminer indûment l’exécutant. Toutefois, « fut ajouté à la maison d’Israël » correspond plus directement à προσετέθη que « fut intégré », et la note b doit présenter correctement la formulation concrète du grec.
  naturalness: Le français est moderne et fluide. « Crut fermement en Dieu » est plus idiomatique que « mit pleinement sa foi en Dieu », tout en rendant l’intensif σφόδρα. « Maison d’Israël » conserve le registre biblique établi.
  terminology: « Dieu d’Israël », « foi », « circoncire » et « maison d’Israël » sont appropriés. La reformulation de l’incorporation évite la nuance administrative de « intégré » et maintient l’image et le vocabulaire du texte.
  issues:
  - severity: low
    issue: « Fut intégré » est moins proche de προσετέθη.
    rationale: Le passif de προστίθημι signifie littéralement « fut ajouté »; cette expression est également naturelle dans un registre biblique français.
  - severity: medium
    issue: La note b qualifie de littérale une formulation causative française.
    rationale: Le grec emploie le verbe « circoncire » avec le complément explicite « la chair de son prépuce »; « fit circoncire » est une interprétation française de la voix moyenne, non la formulation littérale.
  - severity: low
    issue: La note c est redondante.
    rationale: « Jusqu’à ce jour » rend déjà directement ἕως τῆς ἡμέρας ταύτης, et l’alternative proposée ne fournit pas de variante de traduction substantielle.
  revised_text: Quand Achior vit tout ce que le Dieu d’Israël avait fait, il crut fermement en Dieu[a], se fit circoncire[b] et fut ajouté à la maison d’Israël jusqu’à ce jour.
  revised_footnotes:
