review_pass:
  verdict: revise
  source_fidelity: 'Le sens et la structure de la phrase grecque sont globalement bien rendus : les fils d’Assur voient « eux », font prévenir leurs chefs, puis ces chefs se présentent devant les stratèges, les chiliarques et tous leurs gouvernants. Toutefois, la forme française usuelle du nom biblique Ἀσσοὺρ est « Assur », non « Assour ».'
  naturalness: Le français est clair et narratif. « Firent prévenir » rend plus idiomatiquement l’envoi d’une communication implicite que « envoyèrent un message », sans préciser indûment le moyen. « Chefs de milliers » est une formulation française plus naturelle pour le pluriel de χιλίαρχοι et conserve la valeur numérique.
  terminology: « Fils d’Assur » préserve la désignation ethnique du grec. « Généraux » convient à στρατηγοί. « Chefs de milliers » restitue χιλιάρχους sans importer un titre romain. « Chacun de leurs dirigeants » garde la portée distributive de πάντα ἄρχοντα.
  issues:
  - severity: medium
    issue: Nom propre « Assour »
    rationale: Dans l’usage biblique français moderne, le correspondant de Ἀσσοὺρ est « Assur ». « Assour » n’est pas la forme française standard et risque de paraître fautive ou inutilement étrangère.
  - severity: low
    issue: « chefs de mille »
    rationale: Bien que compréhensible, le pluriel « chefs de milliers » rend plus naturellement en français le pluriel χιλιάρχους, chacun étant chef d’un millier.
  - severity: low
    issue: « envoyèrent un message »
    rationale: Le grec laisse implicite ce qui est envoyé. « Firent prévenir » exprime naturellement l’action communicative sans imposer un message singulier matériel.
  revised_text: Mais quand les fils d’Assur les virent, ils firent prévenir leurs chefs. Ceux-ci allèrent trouver les généraux, les chefs de milliers et chacun de leurs dirigeants.
