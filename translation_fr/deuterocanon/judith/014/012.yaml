  yaml_path: translation/deuterocanon/judith/014/012.yaml
  text: But when the sons of Asshur saw them, they sent word to their leaders; and they came to the generals and commanders of thousands and to every one of their rulers.
translation:
  language: fr
  text: Mais quand les fils d’Assur les virent, ils firent prévenir leurs chefs. Ceux-ci allèrent trouver les généraux, les chefs de milliers et chacun de leurs dirigeants.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ... υἱοὶ Ἀσσοὺρ
  choice: les fils d’Assour
  rationale: L’expression grecque est conservée telle quelle comme désignation ethnique, plutôt que d’être réduite à « les Assyriens » ; « Assour » rend directement le nom Ἀσσούρ.
- source_word: ὡς εἶδον αὐτούς
  choice: quand ... les virent
  rationale: ὡς suivi de l’aoriste marque ici le moment de la réaction. « Quand » préserve cette valeur temporelle sans renforcer indûment le texte par « dès que ».
- source_word: διεπέμψαν
  choice: ils envoyèrent un message
  rationale: Le verbe évoque l’envoi d’une communication ou de personnes chargées de la transmettre. L’objet restant implicite en grec, cette formulation naturelle exprime l’action sans ajouter explicitement des messagers.
- source_word: ἐπὶ τοὺς ἡγουμένους αὐτῶν
  choice: à leurs chefs
  rationale: ἡγούμενοι désigne ceux qui dirigent. « Chefs » convient au cadre militaire et reste assez général.
- source_word: στρατηγοὺς
  choice: les généraux
  rationale: Dans ce contexte militaire, στρατηγοί désigne des commandants de rang élevé ; « généraux » en donne un équivalent français clair.
- source_word: χιλιάρχους
  choice: les chefs de mille
  rationale: Le terme désigne littéralement des responsables placés à la tête de mille. Cette expression maintient la valeur numérique sans importer le titre romain de « tribun ».
- source_word: ἐπὶ πάντα ἄρχοντα αὐτῶν
  choice: chacun de leurs dirigeants
  rationale: Le singulier avec πᾶς a une valeur distributive. « Chacun » la restitue plus précisément que le collectif « tous ».
