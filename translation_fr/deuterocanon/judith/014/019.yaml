  yaml_path: translation/deuterocanon/judith/014/019.yaml
  text: But when the commanders of the army of Assyria heard the words[a], they tore their tunics, and their souls were greatly troubled[b], and there arose a very great cry and outcry in the midst of the camp.
translation:
  language: fr
  text: Mais lorsque les chefs de l’armée d’Assyrie entendirent les paroles, ils déchirèrent leurs tuniques[a] ; ils furent profondément bouleversés[b], et un cri et une immense clameur s’élevèrent au milieu du camp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Déchirer ses vêtements était une manière habituelle d’exprimer le deuil, le choc ou une profonde détresse.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « leur âme fut profondément bouleversée ». Le grec emploie « âme » au singulier dans une expression collective ; on peut aussi comprendre : « leur être intérieur fut profondément troublé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἤκουσαν τὰ ῥήματα
  choice: Mais lorsque … entendirent ces paroles
  rationale: ὡς avec l’aoriste introduit ici une proposition temporelle. δέ marque une transition narrative légèrement contrastive, rendue par « Mais ». « Ces paroles » reprend naturellement ce qui vient d’être annoncé tout en conservant le sens concret de ῥήματα.
- source_word: οἱ ἄρχοντες τῆς δυνάμεως Ἀσσούρ
  choice: les chefs de l’armée d’Assyrie
  rationale: Dans ce contexte militaire, ἄρχοντες désigne les dirigeants ou commandants, et δύναμις l’armée. « Chefs » est actuel, clair et suffisamment large pour ne pas préciser indûment leur grade.
- source_word: τοὺς χιτῶνας αὐτῶν διέρρηξαν
  choice: ils déchirèrent leurs tuniques
  rationale: χιτών désigne précisément une tunique plutôt qu’un vêtement en général. La formulation conserve le geste culturel concret de deuil, de choc ou de détresse.
- source_word: ἐταράχθη αὐτῶν ἡ ψυχὴ σφόδρα
  choice: Ils furent profondément bouleversés
  rationale: Le grec emploie littéralement « leur âme » au singulier collectif. Une reproduction littérale serait peu naturelle en français avec un possesseur pluriel. La tournure choisie transmet l’état intérieur intense sans imposer ici une distinction anthropologique entre âme et esprit; la forme grecque est signalée en note.
- source_word: ἐγένετο αὐτῶν κραυγὴ καὶ βοὴ μεγάλη σφόδρα
  choice: des cris et de très fortes clameurs s’élevèrent
  rationale: κραυγή et βοή forment un doublet emphatique de cris bruyants. « Cris » et « clameurs » préservent les deux termes, tandis que « s’élevèrent » rend naturellement ἐγένετο dans ce contexte. Le pluriel français exprime idiomatiquement le tumulte collectif.
- source_word: ἐν μέσῳ τῆς παρεμβολῆς
  choice: au milieu du camp
  rationale: παρεμβολή désigne ici le campement militaire. « Au milieu du camp » suit de près la localisation grecque.
theological_decisions:
- issue: Valeur anthropologique de ψυχή
  choice: Ils furent profondément bouleversés, avec une note sur « leur âme »
  alternative: Leur âme fut profondément bouleversée / leur esprit fut profondément troublé
  rationale: ψυχή peut désigner la vie intérieure ou la personne, et le singulier est collectif. Le corps du texte reste naturel en français sans trancher en faveur d’une doctrine particulière de l’âme ou de l’esprit; la note conserve la forme et l’ambiguïté de l’original.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique littéraire sans archaïsme marqué. La syntaxe a été légèrement allégée par une nouvelle phrase, tout en conservant la progression et l’intensification du grec.
