  text: Then you and all who live within the whole territory of Israel[a], following after them[b], strike them down on their roads.
translation:
  language: fr
  text: Après les avoir suivis, vous et tous les habitants de tout le territoire d’Israël, abattez-les sur leurs routes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπακολουθήσαντες
  choice: lancez-vous à leur poursuite
  rationale: Le participe aoriste exprime une action accompagnant et précédant l’impératif principal. Dans ce contexte militaire, « se lancer à leur poursuite » rend naturellement l’idée d’aller derrière les fuyards sans réduire le verbe à une simple succession neutre.
- source_word: κατοικοῦντες
  choice: ceux qui habitent
  rationale: Le participe présent désigne les habitants établis dans le territoire; « ceux qui habitent » est courant et fidèle.
- source_word: πᾶν ὅριον Ἰσραήλ
  choice: tout le territoire d’Israël
  rationale: ὅριον peut désigner une frontière, une région ou un territoire. Avec « habiter », il s’agit ici de l’ensemble du territoire plutôt que de sa seule ligne frontalière.
- source_word: καταστρώσατε
  choice: abattez-les
  rationale: L’impératif, employé dans un contexte militaire, signifie faire tomber ou terrasser. « Abattez-les » conserve la force concrète de l’ordre.
- source_word: ἐν ταῖς ὁδοῖς αὐτῶν
  choice: sur leurs routes
  rationale: La formule désigne littéralement leurs routes ou leurs chemins, c’est-à-dire les voies empruntées pendant leur fuite. La traduction conserve cette image concrète.
