base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/005.yaml
  text: But before you do these things[a], call Achior the Ammonite to me[c][b], so that he may see and recognize the one who has treated the house of Israel with contempt and has sent him to us as if to death.
translation:
  language: fr
  text: Mais avant de faire tout cela, faites venir auprès de moi Achior l’Ammonite, afin qu’il voie et reconnaisse[a] celui qui a traité la maison d’Israël avec mépris et qui l’a envoyé[b] chez nous comme s’il l’envoyait à la mort[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie successivement deux verbes, « voir » et « reconnaître », soulignant le passage de la vue à la reconnaissance.
    reason: lexical_alternative
  - marker: b
    text: 'Le pronom « l’ » renvoie très probablement à Achior : celui qui avait méprisé la maison d’Israël l’avait envoyé chez eux comme à la mort.'
    reason: alternative_reading
  - marker: c
    text: Le grec dit plus littéralement « comme vers la mort ». La comparaison peut suggérer qu’Achior avait été livré comme un homme voué à mourir, sans l’affirmer de manière absolue.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ δὲ τοῦ ποιῆσαι ταῦτα
  choice: Mais avant de faire tout cela
  rationale: La construction temporelle avec πρό et l’infinitif articulé marque l’antériorité. « Tout cela » rend naturellement le pluriel ταῦτα en français, tandis que « mais » reprend la transition légère de δέ.
- source_word: καλέσατέ μοι
  choice: faites venir auprès de moi
  rationale: L’impératif pluriel et le datif μοι sont rendus explicitement. « Faites venir » est plus naturel ici que le calque « appelez-moi », qui pourrait évoquer un appel téléphonique en français moderne.
- source_word: Ἀχιὼρ τὸν Ἀμμανείτην
  choice: Achior l’Ammonite
  rationale: Le nom propre est translittéré selon sa forme biblique usuelle en français et le nom ethnique est traduit directement.
- source_word: ἵνα ἴδῃ ἐπιγνοῖ
  choice: afin qu’il voie et reconnaisse
  rationale: Les deux verbes au subjonctif expriment le but et une progression de la vue à l’identification ou à la pleine reconnaissance.
- source_word: τὸν ἐκφαυλίσαντα
  choice: celui qui a traité ... avec mépris
  rationale: ἐκφαυλίζω signifie tenir pour peu de chose, mépriser ou traiter avec dédain. Cette formulation est naturelle et conserve la force du terme.
- source_word: τὸν οἶκον τοῦ Ἰσραήλ
  choice: la maison d’Israël
  rationale: Cette expression biblique consacrée désigne Israël comme peuple et préserve le registre de la source.
- source_word: καὶ αὐτὸν ... ἀποστείλαντα εἰς ἡμᾶς
  choice: et qui l’a envoyé chez nous
  rationale: Le pronom αὐτόν renvoie très probablement à Achior, mais le maintien du pronom évite d’expliciter dans le texte principal ce que le grec laisse implicite. « Chez nous » rend εἰς ἡμᾶς de façon idiomatique.
- source_word: ὡς εἰς θάνατον
  choice: comme à la mort
  rationale: Cette formulation proche du grec conserve la nuance comparative ou qualificative de ὡς sans transformer l’expression en affirmation non nuancée de sa mort.
theological_decisions:
- issue: Référent du pronom αὐτόν
  choice: Maintenir « l’ » dans le texte et préciser en note qu’il s’agit très probablement d’Achior.
  alternative: Répéter directement « Achior ».
  rationale: Le contexte favorise nettement Achior, mais le grec emploie un pronom. Le conserver respecte la cohésion et l’implicite du texte sans imposer une explicitation.
- issue: Portée de ὡς εἰς θάνατον
  choice: « comme à la mort »
  alternative: « pour le faire mourir » ou « vers une mort certaine »
  rationale: Les solutions alternatives explicitent davantage le résultat ou l’intention. La traduction retenue préserve la tension de ὡς et l’image d’un envoi équivalant à une condamnation à mort.
translation_notes:
  register: Français international moderne, clair et digne, avec maintien de l’expression biblique « maison d’Israël ». Le vouvoiement collectif implicite est rendu par l’impératif pluriel « faites venir ». La légère étrangeté de « comme à la mort » est conservée pour ne pas effacer la nuance du grec, puis expliquée en note.
