  source_fidelity: 'Le sens général est fidèlement rendu : le mépris de la parole royale, le refus de participer à la guerre, l’absence de crainte et le renvoi des messagers sont conservés. Toutefois, « loin de sa présence » interprète πρὸ προσώπου αὐτοῦ comme un éloignement et peut même suggérer une expulsion. La formule grecque, littéralement « de devant lui / de sa face », doit rester plus proche et ne pas résoudre indûment la relation spatiale.'
  naturalness: Le français est clair, moderne et d’un registre approprié. « À leurs yeux, il n’était qu’un homme comme eux » est plus naturel que « comme un homme de leur rang » et exprime plus directement l’idée d’égalité contenue dans ἴσος, sans introduire une nuance de statut social.
  terminology: « Nabuchodonosor », « roi des Assyriens », « parole », « messagers » et « déshonneur » conviennent. « Les mains vides » est une bonne expression idiomatique pour κενούς dans ce contexte.
