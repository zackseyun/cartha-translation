base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/001/011.yaml
  text: And all who inhabited the whole land treated the word of Nebuchodonosor king of the Assyrians with contempt, and they did not join him for the war, because they did not fear him, but he was before them like an ordinary man, and they sent his messengers back empty, in dishonor, from before him.
translation:
  language: fr
  text: Tous les habitants de toute la terre traitèrent avec mépris la parole de Nabuchodonosor, roi des Assyriens,[a] et ils ne se joignirent pas à lui pour la guerre, car ils ne le craignaient pas. À leurs yeux, il n’était qu’un homme comme eux.[b] Ils renvoyèrent ses messagers les mains vides, dans le déshonneur, de devant lui.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « méprisèrent le message — ou l’ordre — de Nabuchodonosor ». Le mot grec peut désigner une parole, un message ou un ordre.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il était devant eux comme un homme égal ». Autrement dit, ils le considéraient comme un homme comme eux, et non comme quelqu’un qu’ils devaient craindre.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « ils firent repartir ses messagers vides, dans le déshonneur, de devant sa face ». On peut aussi traduire « de sa présence » ; la formulation grecque est conservée sans préciser davantage la relation spatiale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφαύλισαν
  choice: traitèrent avec mépris
  rationale: Le verbe exprime le fait de tenir quelque chose pour négligeable ou sans valeur. Cette formulation garde l’action dirigée contre la parole royale sans réduire le sens à une émotion personnelle.
- source_word: οἱ κατοικοῦντες πᾶσαν τὴν γῆν
  choice: tous les habitants de toute la terre
  rationale: La formulation conserve les deux marques d’universalité, πάντες et πᾶσαν, dans un français clair et solennel.
- source_word: τὸ ῥῆμα
  choice: la parole
  rationale: Ῥῆμα peut désigner une parole, un message ou un ordre. « La parole » préserve cette latitude, tandis que le contexte indique qu’il s’agit de la demande communiquée par le roi.
- source_word: οὐ συνῆλθον αὐτῷ εἰς τὸν πόλεμον
  choice: ils ne se joignirent pas à lui pour la guerre
  rationale: La tournure rend l’idée de se rassembler avec lui en vue d’une action militaire, sans transformer explicitement la demande en alliance durable.
- source_word: οὐκ ἐφοβήθησαν αὐτόν
  choice: ils ne le craignaient pas
  rationale: Rendu direct de la cause donnée pour leur refus.
- source_word: ἦν ἐναντίον αὐτῶν ὡς ἀνὴρ ἴσος
  choice: À leurs yeux, il était comme un homme de leur rang
  rationale: « À leurs yeux » rend ici la valeur relationnelle de ἐναντίον αὐτῶν, et « un homme de leur rang » exprime ἀνὴρ ἴσος sans conclure qu’il était insignifiant ou simplement ordinaire.
- source_word: ἀνέστρεψαν τοὺς ἀγγέλους αὐτοῦ κενούς
  choice: Ils renvoyèrent ses messagers les mains vides
  rationale: Dans ce contexte, ἀναστρέφω indique le renvoi, et κενούς signifie qu’ils repartirent sans avoir rien obtenu.
- source_word: ἐν ἀτιμίᾳ
  choice: dans le déshonneur
  rationale: Cette expression reste proche du grec et laisse ouverte la nuance entre traitement déshonorant et retour honteux.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: loin de sa présence
  rationale: Cette formulation française rend l’idée spatiale de « de devant sa face », tout en conservant le pronom masculin singulier du texte grec.
