  text: In the twelfth year of the reign of Nebuchadnezzar[a], who reigned over the Assyrians in Nineveh, the great city, in the days of Arphaxad, who reigned over the Medes in Ecbatana,
translation:
  language: fr
  text: La douzième année du règne de Nabuchodonosor, qui régna sur les Assyriens à Ninive, la grande ville, au temps d’Arphaxad, qui régna sur les Mèdes à Ecbatane,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec se termine par « et » et se poursuit directement au verset suivant ; la virgule rend plus naturellement en français cette phrase laissée en suspens.
    reason: structure_syntax
lexical_decisions:
- source_word: ἜΤΟΥΣ δωδεκάτου τῆς βασιλείας
  choice: La douzième année du règne
  rationale: Cette formule française naturelle exprime la datation et comprend βασιλεία comme la période d’exercice du pouvoir royal.
- source_word: Ναβουχοδονοσόρ
  choice: Nabuchodonosor
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom propre.
- source_word: ὃς ἐβασίλευσεν Ἀσσυρίων
  choice: qui régnait sur les Assyriens
  rationale: Le génitif désigne le peuple soumis à son règne; l’imparfait convient au cadre historique en cours.
- source_word: ἐν Νινευῇ τῇ πόλει τῇ μεγάλῃ
  choice: à Ninive, la grande ville
  rationale: « À » est idiomatique avec un nom de ville, tandis que l’apposition conserve l’épithète solennelle du grec.
- source_word: ἐν ταῖς ἡμέραις Ἀρφαξάδ
  choice: au temps d’Arphaxad
  rationale: Rend naturellement l’expression temporelle grecque sans archaïsme inutile.
- source_word: ὃς ἐβασίλευσεν Μήδων
  choice: qui régnait sur les Mèdes
  rationale: Le génitif pluriel Μήδων renvoie au peuple sur lequel Arphaxad exerçait son règne.
- source_word: ἐν Ἐκβατάνοις
  choice: à Ecbatane
  rationale: Emploie la forme française conventionnelle du toponyme et la préposition usuelle devant un nom de ville.
- source_word: καὶ
  choice: ','
  rationale: Le καὶ final relie directement ce fragment à la proposition du verset suivant; une virgule signale cette continuité plus naturellement en français qu’un « et » laissé en suspens.
