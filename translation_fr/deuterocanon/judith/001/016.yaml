  text: Puis il revint avec eux, lui-même et ses troupes, pendant cent vingt jours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέστρεψεν
  choice: revint
  rationale: Dans ce récit, l’aoriste de ἀναστρέφω exprime un retour. « Revint » rend naturellement ce mouvement sans lui donner de sens moral.
- source_word: μετʼ αὐτῶν
  choice: avec eux
  rationale: μετά suivi du génitif marque ici l’accompagnement ; « avec eux » en est l’équivalent direct.
- source_word: αὐτὸς
  choice: lui-même
  rationale: Le pronom explicite est emphatique et souligne la présence personnelle du chef aux côtés de ses troupes.
- source_word: ἡ δύναμις αὐτοῦ
  choice: ses troupes
  rationale: Dans ce contexte militaire, δύναμις désigne les forces armées du chef. « Ses troupes » est clair, naturel et garde une portée collective sans imposer la structure précise d’une armée.
- source_word: ἐφʼ ἡμέρας ἑκατὸν εἴκοσι
  choice: pendant cent vingt jours
  rationale: ἐπί avec l’accusatif indique une durée ; « pendant cent vingt jours » la rend directement en français courant.
