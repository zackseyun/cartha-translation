  text: as far as Tanis and Memphis[a], and all those inhabiting Egypt, as far as the borders of Ethiopia.
translation:
  language: fr
  text: jusqu’à Tanis et Memphis[a], et à tous les habitants de l’Égypte, jusqu’aux frontières de l’Éthiopie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec répète la construction « jusqu’à parvenir à » : devant Tanis et Memphis, puis devant les frontières de l’Éthiopie. La traduction rend les deux occurrences par « jusqu’à ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως τοῦ ἐλθεῖν
  choice: jusqu’à
  rationale: Dans les deux occurrences, la construction marque ici une limite spatiale. « Jusqu’à » l’exprime naturellement en français sans transformer artificiellement le déplacement en repère temporel.
- source_word: ἐπάνω
  choice: à
  rationale: Devant les noms de lieux, le terme indique le mouvement vers ces villes ou le fait de les atteindre; il n’est pas nécessaire de traduire littéralement l’idée de « dessus ».
- source_word: Τάνεως
  choice: Tanis
  rationale: Forme française usuelle du nom de cette ville égyptienne.
- source_word: Μέμφεως
  choice: Memphis
  rationale: Forme française usuelle du nom de cette ville égyptienne.
- source_word: κατοικοῦντας
  choice: ceux qui habitaient
  rationale: Cette formulation courante rend le participe désignant les personnes qui résidaient alors en Égypte; l’imparfait convient au cadre narratif passé.
- source_word: τὴν Αἴγυπτον
  choice: l’Égypte
  rationale: Le nom moderne du pays suffit et correspond directement au grec.
- source_word: ἐπὶ τὰ ὅρια
  choice: aux frontières de
  rationale: ὅρια désigne les limites territoriales; « frontières » est clair et idiomatique en français moderne.
- source_word: Αἰθιοπίας
  choice: l’Éthiopie
  rationale: La source grecque nomme directement l’Aithiopia; « Éthiopie » en est la forme française traditionnelle, sans l’identifier explicitement à Koush.
