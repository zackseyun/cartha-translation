  text: He laid its foundation to a depth of sixty cubits[a], and he made its gates, gates raised to a height of seventy cubits, and its width forty cubits, for the departures of the force of his mighty men and the formations of his foot soldiers.
translation:
  language: fr
  text: Il en posa les fondations sur soixante coudées[a]. Il fit ses portes — des portes s’élevant à une hauteur de soixante-dix coudées et larges de quarante coudées — pour les sorties de la troupe de ses vaillants guerriers et les formations de ses fantassins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « sur soixante coudées ». Le grec donne la mesure sans préciser expressément la dimension; on peut aussi comprendre « jusqu’à une profondeur de soixante coudées ».
    reason: ambiguïté_dimensionnelle
lexical_decisions:
- source_word: ἐθεμελίωσεν
  choice: posa ses fondations
  rationale: Le verbe exprime l’établissement de fondations. Cette formulation française est naturelle et conserve l’image de la construction.
- source_word: εἰς πήχεις ἑξήκοντα
  choice: sur soixante coudées
  rationale: Le grec indique une mesure ou une étendue sans nommer explicitement la dimension. « Sur » préserve cette indétermination mieux qu’une précision telle que « en profondeur ».
- source_word: πύλας διεγειρμένας
  choice: des portes s’élevant
  rationale: Le participe de διεγείρω évoque ce qui est dressé ou élevé; la tournure conserve cette image plutôt que de la réduire à « hautes portes ».
- source_word: εἰς ὕψος πηχῶν ἑβδομήκοντα
  choice: à une hauteur de soixante-dix coudées
  rationale: Rendu direct et clair de l’indication verticale explicite.
- source_word: τὸ πλάτος αὐτῆς πήχεις τεσσεράκοντα
  choice: d’une largeur de quarante coudées
  rationale: La reprise pronominale renvoie naturellement aux portes en français, comme le féminin singulier grec αὐτῆς peut reprendre collectivement πύλας.
- source_word: εἰς ἐξόδους
  choice: pour les sorties
  rationale: ἔξοδος désigne une sortie ou un départ; dans ce contexte militaire, « sorties » est à la fois naturel et suffisamment proche du grec.
- source_word: δυνάμεως
  choice: la troupe
  rationale: Dans un contexte militaire, δύναμις peut désigner une force armée. « Troupe » garde le sens collectif sans confondre ce nom avec δυνατῶν.
- source_word: δυνατῶν αὐτοῦ
  choice: ses vaillants guerriers
  rationale: δυνατοί désigne ici vraisemblablement des hommes forts ou valeureux. « Vaillants guerriers » explicite naturellement la nuance militaire.
- source_word: διατάξεις
  choice: les formations
  rationale: Dans le contexte militaire, le terme évoque l’ordonnancement des soldats en formations ou en rangs.
- source_word: τῶν πεζῶν αὐτοῦ
  choice: ses fantassins
  rationale: πεζοί désigne les soldats combattant à pied; « fantassins » est précis, moderne et courant.
