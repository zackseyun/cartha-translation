  revised_text: Il en posa les fondations sur soixante coudées[a]. Il fit ses portes — des portes s’élevant à une hauteur de soixante-dix coudées et larges de quarante coudées — pour les sorties de la troupe de ses vaillants guerriers et les formations de ses fantassins.
