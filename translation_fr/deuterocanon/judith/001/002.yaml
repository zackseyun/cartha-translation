lexical_decisions:
- source_word: ᾠκοδόμησεν
  choice: construisit
  rationale: Le verbe exprime ici une activité de construction; « construisit » est naturel et digne en français moderne.
- source_word: ἐπʼ Ἐκβατάνων καὶ κύκλῳ
  choice: autour d’Ecbatane
  rationale: La combinaison de la préposition avec κύκλῳ indique dans le contexte des fortifications entourant la ville, même si la formulation grecque est resserrée.
- source_word: τείχη
  choice: des murailles
  rationale: Dans un contexte de fortification urbaine, « murailles » rend plus précisément τείχη que le terme général « murs ».
- source_word: λίθων λελαξευμένων
  choice: en pierres taillées
  rationale: Le participe désigne des pierres travaillées par taille; cette expression est claire et courante.
- source_word: εἰς πλάτος πηχῶν τριῶν καὶ εἰς μῆκος πηχῶν ἕξ
  choice: larges de trois coudées et longues de six coudées
  rationale: Les adjectifs s’accordent naturellement avec les pierres taillées et conservent les mesures antiques sans conversion conjecturale.
- source_word: ἐποίησεν τὸ ὕψος τοῦ τείχους πηχῶν ἑβδομήκοντα
  choice: Il donna à la muraille une hauteur de soixante-dix coudées
  rationale: Cette formulation française exprime idiomatiquement l’acte de fixer la hauteur de la muraille tout en conservant la mesure exacte.
- source_word: καὶ τὸ
  choice: et sa…
  rationale: Le texte grec fourni s’interrompt au milieu de la proposition. Le possessif reprend naturellement « la muraille », tandis que les points de suspension signalent honnêtement l’inachèvement.
