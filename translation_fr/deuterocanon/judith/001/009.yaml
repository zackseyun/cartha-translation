  text: and all those in Samaria and its cities[a], and beyond the Jordan as far as Jerusalem, and Batane and Chelous and Kadesh and the river of Egypt, and Taphnas and Rameses and all the land of Goshen[b],
translation:
  language: fr
  text: ainsi que tous ceux qui étaient en Samarie et dans ses villes, et au-delà du Jourdain jusqu’à Jérusalem, à Batané, à Chélous, à Qadesh, au fleuve d’Égypte[a], à Taphnas[b], à Ramsès et dans tout le pays de Goshèn,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On trouve aussi « torrent d’Égypte » ou « ouadi d’Égypte ». Le grec porte ici « fleuve » (ποταμός), mais cette frontière reçoit diverses appellations dans la tradition biblique.
    reason: lexical_alternative
  - marker: b
    text: Taphnas est la forme grecque du lieu plus couramment appelé Tahpanès dans les Bibles françaises.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντας τοὺς ἐν Σαμαρείᾳ καὶ ταῖς πόλεσιν αὐτῆς
  choice: tous ceux de Samarie et de ses villes
  rationale: La tournure grecque est elliptique et désigne les personnes se trouvant dans ces lieux. « Tous ceux » restitue πάντας sans préciser indûment leur identité, tandis que « de Samarie et de ses villes » est naturel en français.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: ceux d’au-delà du Jourdain
  rationale: Le contexte exige de comprendre à nouveau les personnes visées par πάντας. « Au-delà du Jourdain » conserve la perspective géographique du grec sans chercher à déterminer de quel côté il s’agit.
- source_word: ἕως Ἰερουσαλήμ
  choice: jusqu’à Jérusalem
  rationale: ἕως indique ici l’étendue géographique de la liste.
- source_word: Βαττανή
  choice: Batané
  rationale: Translittération française prudente du toponyme grec, sans l’harmoniser avec Bashân.
- source_word: Χελούς
  choice: Chélous
  rationale: La localisation étant incertaine, une translittération proche du grec évite une identification conjecturale.
- source_word: Κάδης
  choice: Qadesh
  rationale: Forme française biblique reconnaissable du toponyme, qui représente convenablement le nom grec.
- source_word: τοῦ ποταμοῦ Αἰγύπτου
  choice: du fleuve d’Égypte
  rationale: Le grec porte explicitement ποταμός, « fleuve »; la traduction principale le rend directement, tout en signalant en note une autre désignation traditionnelle de cette frontière.
- source_word: Τάφνας
  choice: Taphnas
  rationale: Translittération directe de la forme grecque; la forme biblique française plus courante est donnée en note.
- source_word: Ραμεσσή
  choice: Ramsès
  rationale: Forme française usuelle et immédiatement reconnaissable du toponyme.
- source_word: πᾶσαν γῆν Γέσεμ
  choice: tout le pays de Goshèn
  rationale: « Tout le pays » restitue πᾶσαν γῆν, et « Goshèn » emploie la forme biblique française familière correspondant au référent de Γέσεμ.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. La répétition de « ceux de » explicite l’ellipse grecque afin que les toponymes ne soient pas lus comme les compléments directs d’un verbe absent dans cet extrait. Les noms incertains restent translittérés; les formes françaises bien établies sont privilégiées lorsqu’elles identifient clairement le même lieu.
