base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/001/012.yaml
  text: And Nebuchadnezzar became very angry with all this land[a], and he swore by his throne and his kingdom that he would surely avenge himself on all the territories of Cilicia and Damascus and Syria, and put them to the sword—along with all who lived in Moab and the Ammonites and all Idumea and all those in Egypt[b]—until one came to the borders of the two seas.
translation:
  language: fr
  text: Nabuchodonosor entra dans une violente colère contre tout ce pays. Il jura par son trône et son royaume qu’il se vengerait à coup sûr[a] de tous les territoires de la Cilicie, de Damas et de la Syrie, et qu’il ferait périr par l’épée leurs habitants, ainsi que tous ceux qui vivaient en Moab, les Ammonites, toute l’Idumée et tous ceux qui étaient en Égypte, jusqu’à ce qu’on arrive aux frontières des deux mers[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, la formule grecque peut se lire « s’il ne se venge pas ». Dans ce type de serment, elle exprime une résolution solennelle et catégorique.
    reason: lexical_alternative
  - marker: b
    text: L’expression « les deux mers » marque vraisemblablement les limites maritimes de l’ensemble de la région envisagée; le texte ne nomme pas ces mers.
    reason: cultural_note
lexical_decisions:
- source_word: ἐθυμώθη … σφόδρα
  choice: entra dans une violente colère
  rationale: Le verbe exprime le fait de s’irriter ou de s’emporter, et σφόδρα en renforce fortement l’intensité. Cette formulation est naturelle en français moderne.
- source_word: ἐπὶ πᾶσαν τὴν γῆν ταύτην
  choice: contre tout ce pays
  rationale: Dans ce contexte d’hostilité, ἐπί indique la cible de la colère. γῆ désigne ici le pays ou territoire évoqué.
- source_word: κατὰ τοῦ θρόνου καὶ τῆς βασιλείας αὐτοῦ
  choice: par son trône et son royaume
  rationale: Avec le verbe « jurer », κατά introduit ici ce par quoi le serment est prêté. « Royaume » rend βασιλεία dans son sens politique concret, sans exclure la notion de royauté.
- source_word: εἰ μὴ ἐκδικήσει
  choice: qu’il se vengerait à coup sûr
  rationale: Après un verbe de serment, εἰ μή constitue une formule emphatique plutôt qu’une simple condition négative. La tournure française transmet la résolution solennelle et la dimension personnelle de la vengeance.
- source_word: πάντα τὰ ὅρια
  choice: tous les territoires
  rationale: ὅρια signifie littéralement « limites » ou « frontières », mais désigne ici par métonymie les régions comprises dans ces limites.
- source_word: Κιλικίας καὶ Δαμασκηνῆς καὶ Συρίας
  choice: de la Cilicie, de Damas et de la Syrie
  rationale: La traduction conserve la série géographique du grec. Δαμασκηνῆς peut viser Damas ou sa région, ambiguïté que le nom propre laisse ouverte.
- source_word: ἀνελεῖν τῇ ῥομφαίᾳ αὐτοὺς
  choice: qu’il ferait périr par l’épée leurs habitants
  rationale: ἀναιρέω signifie ici tuer ou supprimer violemment, et ῥομφαία désigne l’épée. Le pronom αὐτούς renvoie naturellement aux populations des territoires énumérés; l’explicitation « leurs habitants » évite en français de présenter des territoires comme l’objet direct d’une mise à mort.
- source_word: τοὺς υἱοὺς Ἀμμών
  choice: les Ammonites
  rationale: L’expression littérale « fils d’Ammon » est un ethnonyme; « les Ammonites » en est l’équivalent français courant.
- source_word: Ἰδουμαίαν
  choice: l’Idumée
  rationale: Le nom français « Idumée » correspond directement à la forme géographique grecque Ἰδουμαία.
- source_word: ἕως τοῦ ἐλθεῖν ἐπὶ τὰ ὅρια τῶν δύο θαλασσῶν
  choice: jusqu’à atteindre les frontières des deux mers
  rationale: L’infinitif grec n’exprime pas explicitement son sujet. L’infinitif français conserve cette relative indétermination tout en indiquant la limite de l’avancée envisagée.
theological_decisions:
- issue: Valeur de εἰ μή dans la formule de serment
  choice: 'Formulation affirmative et emphatique : « qu’il se vengerait à coup sûr »'
  alternative: 'Traduction formelle : « s’il ne se vengeait pas » ou « à moins qu’il ne se venge »'
  rationale: La construction grecque exprime une résolution jurée énergique. Une condition négative littérale serait obscure en français et pourrait faire méprendre le sens, sans qu’une question doctrinale soit tranchée.
translation_notes:
  register: Français international moderne, narratif et digne. Les noms géographiques suivent les formes françaises usuelles. La phrase conserve l’ampleur de l’énumération grecque, tout en clarifiant ses rapports syntaxiques sans préciser l’identité des « deux mers » ni le sujet implicite du dernier infinitif.
