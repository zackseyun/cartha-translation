  text: And all who lived in the hill country joined him[a], and all who lived along the Euphrates and the Tigris and the Hydaspes, and in the plain of Ariok king of the Elymaeans[c][b]. And many nations assembled for battle with the sons of Cheleoul.
translation:
  language: fr
  text: Tous les habitants de la région montagneuse vinrent à sa rencontre[a], ainsi que tous ceux qui habitaient le long de l’Euphrate, du Tigre et de l’Hydaspe, et Ariok, roi des Élyméens, qui habitait dans la plaine[b]. De nombreux peuples se rassemblèrent en ordre de bataille avec les fils de Chéléoul[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec peut aussi signifier « allèrent à sa rencontre ». Dans ce contexte militaire et politique, il peut sous-entendre qu’ils se rallièrent à lui.
    reason: lexical_alternative
  - marker: b
    text: Ariok est aussi traditionnellement transcrit « Arioch ». Les Élyméens sont les habitants de l’Élymaïde.
    reason: cultural_note
  - marker: c
    text: Le grec peut se comprendre « en ordre de bataille avec les fils de Chéléoul » ou « pour combattre les fils de Chéléoul »; la relation exacte est ambiguë.
    reason: textual_ambiguity
lexical_decisions:
- source_word: συνήντησαν πρὸς αὐτόν
  choice: vinrent à sa rencontre
  rationale: Cette traduction conserve le sens premier de la rencontre sans transformer en certitude l’idée contextuellement possible d’un ralliement.
- source_word: οἱ κατοικοῦντες τὴν ὀρεινήν
  choice: les habitants de la région montagneuse
  rationale: Le substantif implicite désigne une zone montagneuse; cette formulation est naturelle en français moderne.
- source_word: οἱ κατοικοῦντες τὸν Εὐφράτην καὶ τὸν Τίγριν καὶ τὸν Ὑδάσπην
  choice: ceux qui habitaient le long de l’Euphrate, du Tigre et de l’Hydaspe
  rationale: « Le long de » exprime idiomatiquement l’habitation riveraine impliquée par la construction grecque.
- source_word: πεδίῳ
  choice: dans la plaine
  rationale: Le datif est compris comme locatif; « dans la plaine » est le tour français naturel.
- source_word: Ἀριὼχ
  choice: Ariok
  rationale: Translittération proche de la forme grecque, sans imposer la forme traditionnelle Arioch.
- source_word: Ἐλυμαίων
  choice: Élyméens
  rationale: Le terme renvoie aux habitants de l’Élymaïde et ne doit pas être assimilé sans explication au terme plus large « Élamites ».
- source_word: συνῆλθον
  choice: se rassemblèrent
  rationale: Le verbe indique que plusieurs groupes se réunissent, ici dans un contexte militaire.
- source_word: εἰς παράταξιν
  choice: en ordre de bataille
  rationale: παράταξις est un terme militaire désignant la disposition ou la formation des troupes pour le combat.
- source_word: υἱῶν Χελεούλ
  choice: avec les fils de Chéléoul
  rationale: « Fils » reproduit directement υἱῶν, tandis que « avec » rend la relation la plus plausible avec la formation de combat sans remplacer le groupe par des « forces ».
