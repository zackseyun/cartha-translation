  text: And in the seventeenth year he drew up his forces for battle against King Arphaxad, and he prevailed in his war, and routed all the force of Arphaxad, all his cavalry, and all his chariots,
translation:
  language: fr
  text: La dix-septième année, il déploya ses forces pour combattre le roi Arphaxad. Il prit l’avantage dans cette guerre et mit en déroute toutes les forces d’Arphaxad, toute sa cavalerie et tous ses chars.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρετάξατο ἐν τῇ δυνάμει αὐτοῦ
  choice: il déploya ses forces pour combattre
  rationale: Dans ce contexte militaire, le moyen de παρατάσσω désigne la mise en ordre de bataille, tandis que δύναμις renvoie aux troupes. Cette formulation moderne rend clairement les deux éléments sans transformer δύναμις en puissance abstraite.
- source_word: ἐκραταιώθη ἐν τῷ πολέμῳ αὐτοῦ
  choice: Il prit l’avantage dans cette guerre
  rationale: Le verbe signifie littéralement devenir fort ou être affermi. En contexte de guerre, « prendre l’avantage » exprime sa supériorité militaire tout en conservant une nuance plus progressive que « remporter la victoire ».
- source_word: ἀνέστρεψεν
  choice: mit en déroute
  rationale: Le verbe évoque ici le fait de repousser ou de faire tourner l’ennemi. « Mettre en déroute » est un équivalent militaire naturel et précis.
- source_word: πᾶσαν τὴν δύναμιν Ἀρφαξὰδ
  choice: toutes les forces d’Arphaxad
  rationale: δύναμις désigne l’ensemble des troupes d’Arphaxad. Le pluriel français « forces » est idiomatique dans un récit militaire.
- source_word: πᾶσαν τὴν ἵππον αὐτοῦ
  choice: toute sa cavalerie
  rationale: Le singulier collectif ἵππος, littéralement « cheval », désigne ici les troupes montées.
- source_word: πάντα τὰ ἅρματα αὐτοῦ
  choice: tous ses chars
  rationale: ἅρματα désigne directement les chars de guerre; « chars » suffit dans le contexte militaire.
