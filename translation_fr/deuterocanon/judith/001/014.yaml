  text: And he gained control of his cities[a], and he came as far as Ecbatana, and he seized its towers and plundered its streets[b], and he turned its splendor into disgrace.
translation:
  language: fr
  text: Il prit le contrôle de ses villes et parvint jusqu’à Ecbatane. Il s’empara de ses tours, pilla ses grandes rues[a] et transforma sa splendeur[b] en objet de honte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec peut désigner plus précisément les larges rues de la ville ou ses places publiques.
    reason: lexical_alternative
  - marker: b
    text: Ici, le mot grec signifie la parure ou la magnificence de la ville, et non le « monde ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκυρίευσεν τῶν πόλεων αὐτοῦ
  choice: Il prit le contrôle de ses villes
  rationale: κυριεύω exprime ici la maîtrise acquise dans un contexte militaire. « Prendre le contrôle » rend cette conquête sans suggérer nécessairement un gouvernement durable.
- source_word: ἀφίκετο ἕως Ἐκβατάνων
  choice: parvint jusqu’à Ecbatane
  rationale: La formulation conserve l’idée d’un déplacement ayant atteint cette ville; « Ecbatane » est la forme française usuelle du toponyme.
- source_word: ἐκράτησεν τῶν πύργων
  choice: Il s’empara de ses tours
  rationale: κρατέω avec le génitif désigne ici une prise de possession par la force. Le possessif renvoie naturellement à Ecbatane.
- source_word: ἐπρονόμευσε τὰς πλατείας αὐτῆς
  choice: pilla ses grandes rues
  rationale: Le verbe désigne le pillage, tandis que πλατεῖαι évoque les voies larges ou les places publiques d’une ville. « Grandes rues » garde cette nuance tout en restant naturel.
- source_word: τὸν κόσμον αὐτῆς
  choice: sa splendeur
  rationale: Dans ce contexte, κόσμος désigne la parure, l’ornement ou la magnificence visible de la ville, et non le monde.
- source_word: ἔθηκεν εἰς ὄνειδος αὐτῆς
  choice: transforma sa splendeur en objet de honte
  rationale: Cette formulation restitue l’inversion rhétorique entre la magnificence de la ville et l’opprobre auquel elle est réduite. « Objet de honte » exprime plus précisément ὄνειδος qu’un simple état de honte.
