  text: and those among the nations of Carmel and Gilead[a], and Upper Galilee, and the great plain of Esdraelon,
translation:
  language: fr
  text: ainsi que ceux des peuples du Carmel et de Galaad, la Haute-Galilée et la grande plaine d’Esdrelon[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte Esdrèm, nom qui désigne probablement la plaine d’Esdrelon, aussi appelée plaine de Jizréel.
    reason: Variante du nom géographique et identification probable du lieu.
lexical_decisions:
- source_word: τοὺς ἐν τοῖς ἔθνεσι
  choice: ceux qui se trouvaient parmi les peuples
  rationale: Le grec est elliptique et désigne des personnes au sein de peuples ou nations. Cette formulation conserve la référence personnelle de τοὺς sans donner à ἔθνη le sens théologiquement marqué de « païens ».
- source_word: Καρμήλου
  choice: Carmel
  rationale: Forme française traditionnelle du nom de lieu. Le texte ne précise pas explicitement « mont ».
- source_word: Γαλαὰδ
  choice: Galaad
  rationale: Forme biblique française usuelle de ce nom géographique.
- source_word: τὴν ἄνω Γαλιλαίαν
  choice: la Haute-Galilée
  rationale: ἄνω a ici un sens géographique. « Haute-Galilée » est la désignation régionale naturelle en français moderne.
- source_word: τὸ μέγα πεδίον
  choice: la grande plaine
  rationale: πεδίον désigne une étendue plane; la traduction directe préserve l’adjectif μέγα.
- source_word: Ἐσδρήμ
  choice: Esdrelon
  rationale: Le nom grec Ἐσδρήμ renvoie vraisemblablement à la plaine connue sous le nom d’Esdrelon ou de Jizréel. « Esdrelon » est la forme française traditionnelle adaptée au lieu visé.
