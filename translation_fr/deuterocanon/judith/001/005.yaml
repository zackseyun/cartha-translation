  text: And in those days King Nebuchadnezzar made war against King Arphaxad in the great plain[a], that is, in the territory of Ragae.
translation:
  language: fr
  text: En ces jours-là, le roi Nabuchodonosor fit la guerre au roi Arphaxad dans la grande plaine, c’est-à-dire sur le territoire de Raga[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les limites de Raga ». Le grec peut désigner les frontières ou le territoire de Raga.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν πόλεμον
  choice: fit la guerre
  rationale: Cette tournure rend directement l’expression grecque tout en restant naturelle et digne en français.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: En ces jours-là
  rationale: Expression temporelle française courante correspondant étroitement au grec.
- source_word: βασιλεὺς Ναβουχοδονοσὸρ
  choice: le roi Nabuchodonosor
  rationale: Le titre est traduit et le nom est donné sous sa forme française biblique usuelle.
- source_word: πρὸς βασιλέα Ἀρφαξὰδ
  choice: au roi Arphaxad
  rationale: Avec l’expression « faire la guerre », le français emploie naturellement « à » pour désigner l’adversaire; le sens hostile de πρός demeure clair.
- source_word: ἐν τῷ πεδίῳ τῷ μεγάλῳ
  choice: dans la grande plaine
  rationale: πεδίον désigne ici une étendue de terrain plat; « plaine » convient au contexte géographique et militaire.
- source_word: τοῦτʼ ἔστιν
  choice: c’est-à-dire
  rationale: Cette formule introduit naturellement en français la précision géographique du texte grec.
- source_word: τοῖς ὁρίοις Ῥαγαῦ
  choice: sur le territoire de Raga
  rationale: ὅρια peut désigner les limites, les frontières ou le territoire qu’elles circonscrivent. « Sur le territoire de » transmet naturellement le sens géographique sans réduire le terme aux seules lignes frontalières.
