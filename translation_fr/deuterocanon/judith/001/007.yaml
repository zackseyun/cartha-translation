translation_notes:
  register: Français international moderne, narratif et digne. La longue énumération du grec est conservée, mais structurée par deux-points et par « ainsi que ». « Nabuchodonosor » et « Anti-Liban » suivent les formes françaises bibliques et géographiques courantes.
