  - severity: low
    issue: Réduction de la répétition des habitants dans l’énumération occidentale
    rationale: « Ceux de… » est compréhensible, mais atténue la construction participiale répétée (τοὺς κατοικοῦντας) et rend moins nettement les différents groupes de destinataires.
