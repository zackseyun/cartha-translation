  text: And Nebuchadnezzar king of the Assyrians sent to all who lived in Persia and to all who lived toward the west—to those living in Cilicia and Damascus[a], Lebanon and Anti-Lebanon, and to all who lived along the seacoast—
translation:
  language: fr
  text: 'Nabuchodonosor, roi des Assyriens, envoya à tous les habitants de la Perse et à tous ceux qui habitaient vers l’ouest : à ceux qui habitaient en Cilicie et à Damas, au Liban et dans l’Anti-Liban, ainsi qu’à tous ceux qui habitaient le long du littoral.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: envoya des messagers
  rationale: Le verbe signifie « envoya » sans objet exprimé. En français, l’ajout explicatif « des messagers » rend naturelle l’idée d’un envoi adressé à des populations, sans préciser indûment le contenu du message.
- source_word: ἐπὶ πάντας τοὺς κατοικοῦντας
  choice: à tous les habitants / à tous ceux qui habitaient
  rationale: Avec ἀπέστειλεν et la série de destinataires géographiques, ἐπί indique ici la direction de l’envoi plutôt qu’une action hostile. La variation française évite une répétition pesante tout en conservant le sens.
- source_word: τὴν Περσίδα
  choice: la Perse
  rationale: Forme géographique française usuelle du nom de la région.
- source_word: πρὸς δυσμαῖς
  choice: vers l’ouest
  rationale: La formulation conserve l’orientation spatiale assez ouverte du grec, sans en faire artificiellement le nom d’une région déterminée.
- source_word: τοὺς κατοικοῦντας τὴν Κιλικίαν καὶ Δαμασκόν
  choice: ceux de Cilicie et de Damas
  rationale: Expression française naturelle qui représente les habitants des deux lieux énumérés par le grec.
- source_word: τὸν Λίβανον καὶ Ἀντιλίβανον
  choice: du Liban et de l’Anti-Liban
  rationale: Les formes françaises conventionnelles désignent les deux massifs; « de » sous-entend naturellement les habitants dans la série commencée par « ceux de ».
- source_word: κατὰ πρόσωπον παραλίας
  choice: le long du littoral
  rationale: Rend idiomatiquement la localisation dans la zone côtière, sans calquer l’expression grecque « à la face de ».
