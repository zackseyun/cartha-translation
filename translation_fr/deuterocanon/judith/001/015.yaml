  text: And he captured Arphaxad in the mountains of Ragau[a], and overpowered him with his javelins, and destroyed him to this day.
translation:
  language: fr
  text: Il captura Arphaxad dans les montagnes de Ragau[a], le maîtrisa avec ses javelots et l’anéantit jusqu’à ce jour-là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ragès », forme traditionnelle de ce nom de lieu dans certaines traductions; le témoin grec porte ici « Ragau ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλαβε
  choice: captura
  rationale: Dans ce récit militaire, le verbe désigne la prise d’un ennemi plutôt qu’une simple action de prendre.
- source_word: ἐν τοῖς ὄρεσι
  choice: dans les montagnes
  rationale: Cette formulation rend naturellement le pluriel grec et situe clairement l’action.
- source_word: Ῥαγαῦ
  choice: Ragau
  rationale: La translittération suit directement la forme Ῥαγαῦ du témoin grec de Swete.
- source_word: κατηνάγκισεν
  choice: le maîtrisa
  rationale: Le verbe exprime une contrainte imposée par la force. « Maîtrisa » convient au contexte guerrier sans préciser plus que le grec la manière exacte de la défaite.
- source_word: ἐν ταῖς σιβύναις αὐτοῦ
  choice: avec ses javelots
  rationale: La σιβύνη est une arme de type épieu ou javelot; « javelots » conserve ici l’image militaire concrète.
- source_word: ἐξωλέθρευσεν
  choice: l’anéantit
  rationale: Le verbe marque une destruction complète et est plus fort que le simple fait de tuer.
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: jusqu’à ce jour-là
  rationale: Cette traduction conserve la valeur du démonstratif ἐκείνης et l’étrangeté temporelle réelle de l’expression grecque, sans la transformer en « jusqu’à ce jour ».
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La phrase garde la succession rapide des trois actions reliées par καί. La tournure finale, inhabituelle en français comme en grec, est maintenue afin de ne pas résoudre silencieusement son ambiguïté.
