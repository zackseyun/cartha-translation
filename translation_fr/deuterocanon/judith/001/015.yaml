  terminology: « Captura », « maîtrisa », « javelots » et « anéantit » conviennent au contexte militaire et à la force des termes grecs. « Ragau » suit la forme du texte grec fourni. La note sur « Ragès » est exacte, utile et son ancre est correctement placée.
