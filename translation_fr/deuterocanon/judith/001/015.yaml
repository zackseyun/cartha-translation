  source_fidelity: 'Le texte rend fidèlement les trois actions coordonnées : capture d’Arphaxad, maîtrise par les javelots, puis destruction. « Dans les montagnes de Ragau » correspond précisément à ἐν τοῖς ὄρεσι Ῥαγαῦ. La finale « jusqu’à ce jour-là » conserve le démonstratif ἐκείνης et la tension temporelle inhabituelle du grec, sans l’harmoniser en « jusqu’à ce jour » ou « jusqu’à aujourd’hui ».'
