translation:
  language: fr
  text: 'Sa largeur était de cinquante coudées. Il dressa ses tours à ses portes[a] : elles avaient cent coudées de haut, et il établit sa largeur — aux fondations — à soixante coudées[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sur ses portes » ou « au-dessus de ses portes ». Le grec peut indiquer une position aux portes ou sur elles.'
    reason: ambiguïté spatiale de ἐπί avec le datif
  - marker: b
    text: 'Littéralement : « et sa largeur, il la fonda à soixante coudées ». La construction grecque est condensée; l’ajout « aux fondations » rend le verbe « fonder/établir sur des fondations » sans préciser davantage la relation architecturale.'
    reason: tournure grecque comprimée et explicitation minimale de ἐθεμελίωσεν
lexical_decisions:
- source_word: πλάτος αὐτοῦ
  choice: sa largeur
  rationale: πλάτος désigne l’étendue horizontale. « Largeur » est le terme français courant et précis; le pronom masculin grec renvoie vraisemblablement au mur mentionné dans le contexte immédiat.
- source_word: πηχῶν πεντήκοντα
  choice: cinquante coudées
  rationale: La mesure ancienne est conservée sans conversion afin de rester proche du texte source.
- source_word: πύργους
  choice: tours
  rationale: « Tours » est le terme neutre et usuel pour des ouvrages défensifs; « tourelles » serait plus spécifique.
- source_word: ἔστησεν
  choice: dressa
  rationale: Dans un contexte de construction, « dressa » rend naturellement l’idée d’ériger ou d’établir.
- source_word: ἐπὶ ταῖς πύλαις αὐτῆς
  choice: à ses portes
  rationale: ἐπί avec le datif permet ici une relation locale que le grec ne précise pas entièrement. « À ses portes » préserve cette relative indétermination.
- source_word: πηχῶν ἑκατόν
  choice: elles avaient cent coudées de haut
  rationale: Le grec juxtapose la mesure aux tours. L’ajout de « de haut » explicite en français la dimension naturellement sous-entendue.
- source_word: ἐθεμελίωσεν
  choice: il donna à ses fondations
  rationale: Le verbe signifie « poser les fondations » ou « fonder ». Cette formulation française évite le tour peu naturel « il fonda sa largeur » tout en conservant la référence à la fondation.
- source_word: εἰς πήχεις ἑξήκοντα
  choice: une largeur de soixante coudées
  rationale: εἰς marque ici l’étendue atteinte. La formulation explicite la dimension des fondations, exprimée de manière comprimée dans le grec.
