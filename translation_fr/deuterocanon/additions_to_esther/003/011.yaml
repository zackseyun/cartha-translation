translation:
  language: fr
  text: La reine Esther chercha refuge auprès du Seigneur[a], saisie par une lutte mortelle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se réfugia auprès du Seigneur ». Le verbe grec désigne le fait de fuir vers quelqu’un pour trouver refuge.
    reason: lexical_alternative
  - marker: b
    text: Ou « saisie par une lutte de mort » ou « dans l’angoisse de la mort ». L’expression grecque associe l’idée d’une lutte à celle de la mort imminente.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: '[non rendu explicitement]'
  rationale: En français, commencer directement par le sujet est plus naturel dans ce segment autonome; la continuité narrative portée par καί demeure implicite.
- source_word: Ἐσθὴρ ἡ βασίλισσα
  choice: La reine Esther
  rationale: Cet ordre est idiomatique en français et conserve le nom ainsi que le titre.
- source_word: κατέφυγεν ἐπὶ τὸν κύριον
  choice: chercha refuge auprès du Seigneur
  rationale: καταφεύγω exprime le fait de fuir vers quelqu’un pour trouver refuge. «Auprès du Seigneur» maintient le mouvement vers une personne sans réduire la formule à une fuite physique.
- source_word: ἐν ἀγῶνι θανάτου
  choice: par une lutte à mort
  rationale: ἀγών garde l’image concrète d’une lutte, tandis que θανάτου lui confère une portée mortelle. «Lutte à mort» est concise et naturelle, tout en laissant ouverte la nuance exacte du génitif.
- source_word: κατειλημμένη
  choice: saisie par
  rationale: Le participe passif indique qu’Esther est prise ou dominée par cette épreuve; «saisie» en restitue la force et s’accorde avec le féminin.
theological_decisions:
- issue: Désignation de Dieu par κύριον
  choice: le Seigneur
  alternative: l’Éternel
  rationale: Le texte grec porte κύριον et non une représentation explicite du tétragramme dans ce verset. «Le Seigneur» traduit donc directement le titre sans importer une forme confessionnelle particulière.
- issue: Nature de l’expression ἀγῶνι θανάτου
  choice: une lutte à mort
  alternative: une angoisse mortelle
  rationale: Le choix retient l’image de lutte présente dans ἀγών et ne réduit pas l’expression à un état émotionnel, tout en préservant le lien étroit avec la mort.
translation_notes:
  register: Français international actuel, digne et narratif. La formulation conserve l’intensité du grec sans durcir l’expression en interprétation psychologique ou doctrinale.
