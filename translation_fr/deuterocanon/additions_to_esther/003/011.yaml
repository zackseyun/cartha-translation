    rationale: Cette locution française désigne habituellement un combat entre personnes mené jusqu’à la mort. Elle risque donc de concrétiser et de modifier l’expression ἐν ἀγῶνι θανάτου. « Une lutte mortelle » correspond mieux à une crise ou une lutte liée à la mort, tout en restant naturelle.
  revised_text: La reine Esther chercha refuge auprès du Seigneur[a], saisie par une lutte mortelle[b].
