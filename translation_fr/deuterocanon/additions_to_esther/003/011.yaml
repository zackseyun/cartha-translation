  verdict: revise
  source_fidelity: '« Chercha refuge auprès du Seigneur » rend fidèlement κατέφυγεν ἐπὶ τὸν κύριον, en exprimant le mouvement vers Dieu et la notion de refuge. « Saisie » restitue bien la valeur passive et intensive de κατειλημμένη. Toutefois, « saisie par une lutte à mort » est moins exact et moins idiomatique : en français, « lutte à mort » évoque normalement un affrontement où les adversaires combattent jusqu’à la mort, plutôt que l’épreuve mortelle qui accable Esther. « Lutte mortelle » conserve l’image de ἀγών et le rapport étroit à θανάτου sans préciser indûment la nature du génitif.'
  naturalness: La phrase est sobre, actuelle et d’un registre narratif digne. Le remplacement de « lutte à mort » par « lutte mortelle » rend la construction avec « saisie par » plus naturelle et évite l’évocation trop concrète d’un duel. L’omission explicite de καί est acceptable dans ce verset présenté isolément.
  terminology: « La reine Esther » et « le Seigneur » sont des choix français usuels et précis. « Seigneur » traduit κύριον sans substituer une désignation confessionnelle ou le tétragramme. « Lutte mortelle » maintient la métaphore de lutte de ἀγών, plutôt que de la réduire à une simple émotion.
