  text: car j’aurais pu baiser les plantes de ses pieds pour le salut d’Israël.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour la délivrance d’Israël ».'
    reason: Alternative lexicale pour σωτηρία, qui désigne ici le sauvetage d’Israël sans imposer un sens doctrinal plus développé.
lexical_decisions:
- source_word: ἠδυνάμην
  choice: j’aurais pu
  rationale: L’imparfait de δύναμαι exprime ici une capacité envisagée dans un cadre hypothétique ou concessif. Le conditionnel passé rend cette nuance naturellement en français sans présenter le geste comme accompli.
- source_word: φιλεῖν
  choice: baiser
  rationale: Avec pour objet la plante des pieds, φιλέω désigne naturellement l’acte concret de donner un baiser en signe de soumission ou d’hommage, plutôt qu’un sentiment général d’affection.
- source_word: πέλματα ποδῶν αὐτοῦ
  choice: la plante de ses pieds
  rationale: πέλμα désigne la plante, c’est-à-dire le dessous du pied. Le singulier collectif « la plante » avec le pluriel « ses pieds » est idiomatique en français et conserve l’image corporelle saisissante.
- source_word: πρὸς σωτηρίαν Ἰσραήλ
  choice: pour le salut d’Israël
  rationale: πρός indique ici le but visé. σωτηρία peut signifier « salut » ou « délivrance » ; « salut » maintient le lien lexical tout en laissant le contexte préciser qu’il s’agit du sauvetage d’Israël.
theological_decisions:
- issue: Nature de la déclaration d’Esther concernant sa soumission au roi
  choice: Une déclaration hypothétique de sa disposition à accomplir un geste d’hommage extrême pour sauver Israël
  alternative: Le récit d’un geste effectivement accompli, ou une déclaration générale d’affection et d’honneur
  rationale: La forme verbale se comprend au mieux comme l’expression de ce qu’Esther aurait été capable de faire. La mention concrète de la plante des pieds évoque une soumission extrême plutôt qu’une affection générale.
translation_notes:
  register: Français moderne, digne et direct. « Baiser » est employé comme verbe au sens traditionnel et précis de « donner un baiser » ; il restitue mieux que « embrasser » le geste appliqué à la plante des pieds. La formulation conserve la valeur hypothétique et l’ambiguïté de σωτηρία.
