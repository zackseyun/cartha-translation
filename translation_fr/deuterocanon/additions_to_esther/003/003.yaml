translation:
  language: fr
  text: car tu as fait le ciel et la terre, et tout ce qui est merveilleux sous le ciel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout ce qui est admiré sous le ciel » ou « toute merveille sous le ciel ». Le participe grec désigne ce qui est admiré, donc merveilleux.
    reason: alternative lexicale
lexical_decisions:
- source_word: ὅτι
  choice: car
  rationale: Dans le contexte de la prière, la conjonction introduit la raison de ce qui précède. « Car » exprime naturellement cette valeur causale tout en convenant au registre soutenu du passage.
- source_word: ἐποίησας
  choice: tu as fait
  rationale: Le verbe ποιέω signifie couramment « faire ». Avec « le ciel et la terre », il désigne l’acte créateur de Dieu, sans qu’il soit nécessaire de le rendre par le terme plus explicite « créer ».
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: le ciel et la terre
  rationale: Cette expression désigne l’ensemble du monde créé. La formulation retenue est à la fois traditionnelle, claire et fidèle au grec.
- source_word: πᾶν θαυμαζόμενον
  choice: tout ce qui est merveilleux
  rationale: Le participe substantivé au singulier désigne collectivement ce qui provoque l’étonnement ou l’admiration. « Tout ce qui est merveilleux » est naturel en français et préserve cette portée, tandis qu’une note signale le sens plus littéral.
- source_word: ἐν τῇ ὑπʼ οὐρανόν
  choice: sous le ciel
  rationale: L’expression renvoie au domaine situé sous le ciel. La tournure concise « sous le ciel » est idiomatique et respecte l’image du texte grec.
theological_decisions:
- issue: Portée du langage de la création
  choice: Présenter Dieu comme celui qui a fait le ciel, la terre et tout ce qui est merveilleux sous le ciel.
  alternative: Employer « créé » ou reformuler par « toute la création sous le ciel ».
  rationale: Le grec nomme le ciel et la terre, puis ajoute tout ce qui suscite l’émerveillement sous le ciel. La traduction conserve cette vaste portée cosmique sans transformer le verbe général « faire » en formulation doctrinale plus technique.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement convient à l’adresse directe à Dieu dans la prière. « Car » maintient le lien causal avec le verset précédent; « ainsi que » clarifie l’ajout du dernier élément sans alourdir la phrase.
