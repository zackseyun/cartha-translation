base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/005.yaml
  text: You know all things; you know[a], Lord, that it was not in insolence or in pride or in ambition that I did this—refusing to bow down to the proud Haman.
translation:
  language: fr
  text: 'Toi, tu connais tout ; tu sais, Seigneur, que ce n’est ni par insolence, ni par orgueil, ni par ambition que j’ai fait cela : refuser de m’incliner devant l’orgueilleux Haman.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne pas me prosterner devant l’orgueilleux Haman ».'
    reason: Le verbe προσκυνεῖν peut désigner aussi bien le fait de s’incliner en hommage que celui de se prosterner.
lexical_decisions:
- source_word: σὺ πάντα γινώσκεις
  choice: Toi, tu connais tout
  rationale: Conserve l’insistance du pronom grec et l’étendue universelle de la connaissance divine, dans un français naturel adapté à la prière.
- source_word: σὺ οἶδας
  choice: tu sais
  rationale: Maintient la répétition emphatique des deux verbes grecs de connaissance au lieu de les fusionner.
- source_word: Κύριε
  choice: Seigneur
  rationale: Équivalent français usuel et digne de κύριος lorsqu’il s’agit d’une adresse à Dieu.
- source_word: οὐκ ἐν ὕβρει
  choice: ce n’est ni par insolence
  rationale: « Insolence » exprime le comportement outrageusement arrogant désigné par ὕβρις, tout en restant distinct d’« orgueil ».
- source_word: οὐδὲ ἐν ὑπερηφανείᾳ
  choice: ni par orgueil
  rationale: Rend directement l’idée d’élévation hautaine de soi et conserve la distinction avec ὕβρις.
- source_word: οὐδὲ ἐν φιλοδοξίᾳ
  choice: ni par ambition
  rationale: Rend clairement, en français moderne, la recherche intéressée d’honneur ou de prestige évoquée par φιλοδοξία.
- source_word: ἐποίησα τοῦτο
  choice: j’ai fait cela
  rationale: Traduction directe qui laisse à l’infinitif suivant le soin d’expliciter ce que désigne « cela ».
- source_word: τὸ μὴ προσκυνεῖν
  choice: refuser de m’incliner
  rationale: L’infinitif substantivé précise le contenu de « cela ». Cette formulation française fait ressortir le refus impliqué par la négation, tandis que la note signale le geste plus marqué possible.
- source_word: τὸν ὑπερήφανον Ἁμάν
  choice: l’orgueilleux Haman
  rationale: Conserve l’adjectif moralement caractérisant appliqué à Haman sans l’atténuer ni l’omettre.
theological_decisions:
- issue: Motif du refus de Mardochée d’honorer Haman
  choice: Le refus n’est motivé ni par l’insolence, ni par l’orgueil, ni par l’ambition ; son motif positif reste ici inexprimé.
  alternative: Présenter explicitement ce refus comme exclusivement religieux, politique ou personnel.
  rationale: Le grec nie trois motifs répréhensibles, mais ne formule pas dans ce verset la raison positive du refus. La traduction préserve cette retenue et la tension du texte.
translation_notes:
  register: Français international moderne, digne et accessible. L’adresse initiale emphatique et la répétition des verbes de connaissance sont conservées ; la série ternaire garde son rythme solennel.
