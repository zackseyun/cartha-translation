base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/002.yaml
  text: And he said[a], “Lord, Lord, King over all powers, because everything is in your authority, and there is no one who can oppose you when you desire to save Israel.”
translation:
  language: fr
  text: 'Et il dit : « Seigneur, Seigneur, roi de toutes les puissances[a], car tout est sous ton autorité, et personne ne peut s’opposer à toi lorsque tu veux sauver Israël. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « roi de toutes les dominations ». Le terme grec peut désigner diverses formes de puissance ou de souveraineté, et pas seulement des royaumes politiques.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Seigneur
  rationale: Vocatif de κύριος employé comme titre divin dans une prière. « Seigneur » est la formulation française naturelle et traditionnelle, sans ajout interprétatif.
- source_word: βασιλεῦ πάντων κρατῶν
  choice: roi de toutes les puissances
  rationale: βασιλεύς signifie « roi », tandis que le pluriel κρατῶν peut désigner des puissances, des forces ou des dominations. Cette formulation conserve la portée large du grec sans la limiter aux royaumes politiques.
- source_word: ἐν ἐξουσίᾳ σου
  choice: sous ton autorité
  rationale: ἐξουσία peut exprimer l’autorité ou le pouvoir. « Sous ton autorité » rend naturellement en français l’idée que la totalité des choses relève de la souveraineté divine.
- source_word: τὸ πᾶν
  choice: tout
  rationale: Le neutre substantivé désigne ici la totalité. « Tout » est concis, idiomatique et fidèle.
- source_word: ὁ ἀντιδρῶσων
  choice: personne ne peut s’opposer
  rationale: Le participe futur substantivé désigne celui qui s’opposera ou pourra résister. Dans ce contexte, la tournure française exprime l’impossibilité d’une opposition efficace.
- source_word: ἐν τῷ θέλειν σε
  choice: lorsque tu veux
  rationale: La construction ἐν avec l’infinitif articulé a ici une valeur temporelle ou circonstancielle. « Lorsque tu veux » préserve directement la volonté divine sans l’alourdir.
- source_word: σῶσαι τὸν Ἰσραήλ
  choice: sauver Israël
  rationale: σῴζω peut signifier sauver ou délivrer. « Sauver » convient au registre de la prière et reste proche du grec.
theological_decisions:
- issue: Répétition de l’adresse divine Κύριε, κύριε
  choice: Seigneur, Seigneur
  alternative: Ô Seigneur, Seigneur
  rationale: La répétition du grec est conservée pour rendre l’insistance et la révérence, sans ajouter une interjection absente du texte.
- issue: Portée de κρατῶν
  choice: toutes les puissances
  alternative: toutes les dominations
  rationale: Le terme peut englober la puissance et l’exercice de la domination. Le choix retenu maintient cette ampleur et n’enferme pas la souveraineté divine dans le seul domaine politique.
- issue: Nuance de ἐξουσία
  choice: autorité
  alternative: pouvoir
  rationale: « Autorité » met en relief la souveraineté légitime suggérée par le contexte royal, tout en laissant intacte l’idée de puissance.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond à l’adresse directe de la prière. La répétition solennelle « Seigneur, Seigneur » et le titre royal sont conservés, tandis que la syntaxe reste naturelle pour un lectorat contemporain.
