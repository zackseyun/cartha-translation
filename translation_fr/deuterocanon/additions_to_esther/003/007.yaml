base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/007.yaml
  text: But I did this so that I might not place the glory of man above the glory of God; and I will bow down to no one except you[a], my lord, and I will not do these things in pride.
translation:
  language: fr
  text: Mais j’ai agi ainsi pour ne pas placer la gloire d’un homme au-dessus de la gloire de Dieu. Je ne me prosternerai devant personne, excepté devant toi[a], mon Seigneur, et je ne ferai pas cela par orgueil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je n’adorerai personne excepté toi ». Le verbe grec peut désigner soit le fait de se prosterner en signe d’hommage, soit l’adoration, selon le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησα
  choice: j’ai agi
  rationale: L’aoriste désigne ici une action accomplie. « J’ai agi ainsi » est naturel en français et prépare clairement l’explication du motif.
- source_word: ἵνα μὴ θῶ
  choice: pour ne pas placer
  rationale: Cette formulation conserve l’image de τίθημι, « placer », tout en exprimant naturellement le but en français.
- source_word: δόξαν ἀνθρώπου
  choice: la gloire d’un homme
  rationale: « Gloire » maintient la répétition avec « la gloire de Dieu », tandis que « d’un homme » respecte le singulier générique ἀνθρώπου.
- source_word: ὑπεράνω
  choice: au-dessus de
  rationale: Rend directement la comparaison spatiale et hiérarchique du grec.
- source_word: οὐ προσκυνήσω
  choice: je ne me prosternerai
  rationale: προσκυνέω peut désigner la prosternation en signe d’hommage ou l’adoration. « Se prosterner » préserve l’acte concret sans trancher entièrement sa portée religieuse.
- source_word: οὐδένα πλὴν σοῦ
  choice: devant personne, excepté devant toi
  rationale: La reprise de « devant » rend explicite en français le complément naturel de « se prosterner » et conserve l’exception marquée par πλήν.
- source_word: τοῦ κυρίου μου
  choice: mon Seigneur
  rationale: Dans cette prière adressée à Dieu, κύριος fonctionne comme une désignation divine; la majuscule française le signale sans modifier le sens lexical.
- source_word: οὐ ποιήσω αὐτὰ
  choice: je ne ferai pas cela
  rationale: Bien que αὐτά soit formellement pluriel, le français idiomatique reprend ici l’ensemble de la conduite évoquée par le singulier collectif « cela ».
- source_word: ἐν ὑπερηφανίᾳ
  choice: par orgueil
  rationale: « Par orgueil » exprime naturellement le motif ou la disposition que peut marquer ἐν avec ὑπερηφανία.
theological_decisions:
- issue: Portée de προσκυνέω devant une autorité humaine
  choice: « se prosterner » dans le texte
  alternative: « adorer »
  rationale: Le contexte concerne un geste d’hommage refusé à un être humain, mais le contraste avec la gloire de Dieu lui donne une portée théologique. Le texte retient l’acte concret et la note préserve l’autre valeur possible.
- issue: Référent et statut de κύριος dans « τοῦ κυρίου μου »
  choice: « mon Seigneur », compris comme Dieu
  alternative: « mon maître », lexicalement possible hors contexte
  rationale: Le passage appartient à la prière de Mardochée et le pronom « toi » renvoie à Dieu; « Seigneur » convient donc au contexte immédiat.
- issue: Valeur de ἀνθρώπου
  choice: singulier générique « d’un homme »
  alternative: « humaine » ou « des hommes »
  rationale: Le singulier grec est maintenu afin de préserver le contraste entre la gloire d’un homme et celle de Dieu sans l’abstraire inutilement.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation répartit la longue phrase grecque en deux phrases pour la lisibilité, sans modifier son enchaînement logique. La répétition de « gloire » et l’ambiguïté de προσκυνέω sont préservées.
