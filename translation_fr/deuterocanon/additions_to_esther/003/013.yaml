base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/013.yaml
  text: And she was pleading with the Lord[a], the God of Israel, and said, “My Lord, our king, you alone are the only one; help me, who am alone and have no helper except you,”
translation:
  language: fr
  text: 'Elle suppliait le Seigneur, le Dieu d’Israël, en disant : « Mon Seigneur, notre roi, toi seul[a] ; viens à mon secours, moi qui suis seule et qui n’ai personne pour m’aider, si ce n’est toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « toi seul es ». Le grec est elliptique; il peut aussi se comprendre : « tu es seul ».'
    reason: Préserver l’ambiguïté syntaxique de σὺ εἶ μόνος sans introduire le prédicat « notre roi », qui n’est pas exprimé en grec.
lexical_decisions:
- source_word: ἐδεῖτο
  choice: suppliait
  rationale: Le verbe exprime une demande pressante et fervente; l’imparfait grec est rendu par un imparfait français qui suggère une action en cours.
- source_word: Κυρίου θεοῦ Ἰσραήλ
  choice: le Seigneur, le Dieu d’Israël
  rationale: La formulation appositionnelle conserve distinctement les deux titres divins.
- source_word: Κύριέ μου
  choice: Mon Seigneur
  rationale: Le possessif μου est explicite et souligne la relation personnelle dans l’adresse.
- source_word: ὁ βασιλεὺς ἡμῶν
  choice: notre roi
  rationale: Le titre royal appliqué à Dieu est conservé sans l’atténuer en un terme plus général.
- source_word: σὺ εἶ μόνος
  choice: toi seul l’es
  rationale: Le pronom « l’ » reprend naturellement « notre roi » en français tout en gardant l’insistance de σὺ et μόνος; une note signale l’ellipse du grec et son autre lecture possible.
- source_word: βοήθησόν μοι
  choice: Viens à mon secours
  rationale: Cette tournure française rend avec naturel et force l’impératif direct demandant une aide immédiate.
- source_word: τῇ μόνῃ
  choice: car je suis seule
  rationale: Le féminin singulier décrit la situation d’Esther; la proposition causale exprime naturellement le lien avec sa demande sans perdre l’idée de solitude.
- source_word: μὴ ἔχουσῃ βοηθὸν
  choice: je n’ai personne pour m’aider
  rationale: Cette formulation actuelle conserve la dimension personnelle de βοηθός, plutôt que de la réduire à l’idée abstraite d’aide.
- source_word: εἰ μὴ σέ
  choice: si ce n’est toi
  rationale: La tournure exprime clairement l’exclusion absolue de tout autre secours.
theological_decisions:
- issue: Titre royal divin dans la prière d’Esther
  choice: Conserver « notre roi » comme titre directement adressé à Dieu.
  alternative: notre souverain
  rationale: Le grec nomme explicitement Dieu comme roi; ce titre contribue au contraste implicite entre sa souveraineté et le pouvoir du roi terrestre.
- issue: Ellipse dans σὺ εἶ μόνος
  choice: Rendre « toi seul l’es », où « l’ » reprend « notre roi », avec une note sur l’ellipse.
  alternative: tu es seul
  rationale: Le grec n’exprime pas de complément après εἶ μόνος. La reprise du titre royal donne une phrase française intelligible, tandis que la note préserve la possibilité grammaticale d’une lecture non complétée.
translation_notes:
  register: Français international moderne, digne et accessible. « Suppliait » garde l’intensité de la prière; « viens à mon secours » et « je n’ai personne pour m’aider » restent naturels à l’oral comme à l’écrit. La ponctuation française et les guillemets sont adaptés à l’usage éditorial courant.
