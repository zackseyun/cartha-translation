  yaml_path: translation/deuterocanon/additions_to_esther/003/025.yaml
  text: And you know that I hated the glory of the lawless[a], and I abhor the bed of the uncircumcised and of every foreigner.
translation:
  language: fr
  text: Et tu sais que j’ai haï la gloire des hommes sans loi, et que j’ai en horreur le lit[a] des incirconcis et de tout étranger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le lit conjugal » ou « l’union sexuelle » ; le mot grec traduit par « lit » peut désigner, par métonymie, les relations conjugales ou sexuelles.
    reason: alternative lexicale
lexical_decisions:
- source_word: ἐμίσησα
  choice: j’ai haï
  rationale: L’aoriste exprime ici directement l’attitude passée d’Esther dans le cadre de sa prière; « haï » conserve toute la force du verbe.
- source_word: δόξαν
  choice: la gloire
  rationale: Le terme peut désigner la gloire, l’éclat ou le prestige. « La gloire » maintient le registre élevé et laisse ouverte la nuance précise.
- source_word: ἀνόμων
  choice: des hommes sans loi
  rationale: Cette formulation conserve le lien lexical avec la loi et évite de réduire le terme au sens plus général de « méchants ». Le substantif implicite est explicité naturellement en français.
- source_word: βδελύσσομαι
  choice: j’ai en horreur
  rationale: L’expression rend la vive répulsion du présent grec dans une langue française actuelle et digne.
- source_word: κοίτην
  choice: la couche
  rationale: « La couche » préserve l’image grecque tout en permettant son sens métonymique de relations conjugales ou sexuelles, sans imposer une interprétation unique.
- source_word: ἀπεριτμήτων
  choice: des incirconcis
  rationale: Le pluriel substantivé rend directement l’adjectif grec sans ajouter une désignation ethnique absente du texte.
- source_word: παντὸς ἀλλοτρίου
  choice: de tout étranger
  rationale: Dans ce contexte, associé aux incirconcis, le terme désigne le plus naturellement une personne étrangère; le singulier distributif « tout étranger » correspond au grec.
theological_decisions:
- issue: Faut-il expliciter κοίτην comme l’union sexuelle ou le lit conjugal ?
  choice: la couche
  alternative: l’union sexuelle; le lit conjugal
  rationale: Le grec emploie une image susceptible de désigner le lit, le lit conjugal ou les relations sexuelles. La traduction maintient cette ambiguïté réelle et l’explique en note.
- issue: Faut-il rendre ἀνόμων par un terme moral général ?
  choice: des hommes sans loi
  alternative: des méchants; des impies
  rationale: Le choix retenu préserve la référence propre à l’absence ou à la transgression de la loi, sans importer une catégorie théologique plus précise.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le parallélisme de la phrase grecque est conservé, avec répétition de « et que » pour une syntaxe française claire. Le marqueur de note est placé après « couche », terme auquel la note se rapporte.
