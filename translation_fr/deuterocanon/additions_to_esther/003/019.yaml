  text: to remove the decree from your mouth and to destroy your inheritance[a], and to shut the mouth of those who praise you, and to extinguish the glory of your house and your altar[d][c][b],
translation:
  language: fr
  text: pour abolir le décret prononcé par ta bouche et anéantir ton héritage[a], pour fermer la bouche de ceux qui te louent[b] et éteindre la gloire de ta maison[c] et de ton autel,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Ton héritage » désigne probablement le peuple ou ce qui appartient à Dieu.
    reason: clarification du référent implicite
  - marker: b
    text: 'Ou : « réduire au silence ceux qui te louent ». Le grec dit littéralement « fermer la bouche de ceux qui te louent ».'
    reason: alternative lexicale et explication de l’image
  - marker: c
    text: « Ta maison » désigne probablement le temple.
    reason: note culturelle et contextuelle
lexical_decisions:
- source_word: ἐξᾶραι
  choice: abolir
  rationale: Dans cette suite de desseins hostiles, le verbe exprime l’action d’ôter ou de supprimer la décision divine. « Abolir » rend naturellement l’idée de la rendre sans effet.
- source_word: ὁρισμὸν στόματός σου
  choice: la décision sortie de ta bouche
  rationale: ὁρισμός désigne une détermination arrêtée. La formulation française conserve l’image de la bouche comme source de la parole divine tout en évitant l’expression peu naturelle « décision de ta bouche ».
- source_word: ἀφανίσαι
  choice: anéantir
  rationale: Le verbe signifie faire disparaître ou détruire entièrement. « Anéantir » restitue la force de la menace.
- source_word: κληρονομίαν σου
  choice: ton héritage
  rationale: Le terme biblique peut désigner le peuple ou le bien appartenant à Dieu. « Héritage » préserve cette portée d’alliance sans préciser indûment le référent.
- source_word: ἐμφράξαι στόμα
  choice: fermer la bouche
  rationale: Cette traduction conserve l’image concrète du grec ainsi que le parallélisme entre la bouche de Dieu et celle de ses adorateurs.
- source_word: αἰνούντων σοι
  choice: de ceux qui te louent
  rationale: Le participe présent désigne les personnes qui adressent leur louange à Dieu. Cette tournure est naturelle en français moderne.
- source_word: σβέσαι
  choice: éteindre
  rationale: Le verbe s’emploie proprement pour une flamme ou une lumière et garde ici son image vive appliquée à la gloire.
- source_word: δόξαν οἴκου σου
  choice: la gloire de ta maison
  rationale: « Gloire » conserve la densité biblique de δόξα, tandis que « maison » respecte le grec sans remplacer explicitement le mot par « temple ».
- source_word: θυσιαστήριόν σου
  choice: ton autel
  rationale: Rendu français courant et direct du terme grec désignant l’autel sacrificiel.
theological_decisions:
- issue: Référent de « ton héritage »
  choice: Conserver « ton héritage » sans identifier explicitement Israël ou le peuple de Dieu.
  alternative: ton peuple ; ce qui t’appartient
  rationale: Le contexte suggère le peuple appartenant à Dieu, mais le grec laisse le référent implicite. Le terme d’alliance doit donc rester ouvert dans le texte principal.
- issue: Sens de « ta maison »
  choice: Traduire littéralement par « ta maison ».
  alternative: ton temple
  rationale: La maison désigne probablement le temple en contexte, mais le grec dit simplement « maison ». La traduction préserve cette formulation et signale l’interprétation en note.
- issue: Nature de la décision divine
  choice: Parler de « la décision sortie de ta bouche » sans en préciser le contenu.
  alternative: ton décret ; ton ordonnance
  rationale: Le grec présente une détermination faisant autorité, sans l’identifier davantage. La traduction conserve cette indétermination et l’image de la parole prononcée.
translation_notes:
  register: Français international actuel, digne et adapté à une prière solennelle. La syntaxe infinitive conserve le caractère de liste dépendant du contexte précédent. Les images répétées de la bouche, de la maison et de l’extinction sont maintenues sans explicitation confessionnelle.
