- from: Depuis ma naissance, j’ai entendu dire, au sein de la tribu de ma famille ancestrale, que toi, Seigneur, tu as pris Israël d’entre toutes les nations, et nos pères d’entre tous leurs ancêtres, pour en faire un héritage éternel, et que tu as accompli pour eux tout ce que tu avais déclaré.[a]
  to: Depuis ma naissance, j’ai entendu dire, dans la tribu de ma lignée, que toi, Seigneur, tu as pris Israël d’entre toutes les nations et nos pères d’entre tous leurs ancêtres comme un héritage éternel, et que tu as accompli pour eux tout ce que tu as dit.[a]
  rationale: La révision retire le plus-que-parfait non requis par les aoristes grecs et allège la formulation de ἐν φυλῇ πατριάς μου. Elle maintient le registre de prière, la distinction entre « nos pères » et « leurs ancêtres », ainsi que l’ambiguïté théologique et syntaxique de « comme un héritage éternel ».
