base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/015.yaml
  text: I had heard from my birth[a], in the tribe of my ancestral family, that you, Lord, took Israel from among all the nations, and our fathers from among all their ancestors, as an everlasting inheritance, and you did for them what you spoke.
translation:
  language: fr
  text: Depuis ma naissance, j’ai entendu dire, dans la tribu de ma lignée, que toi, Seigneur, tu as pris Israël d’entre toutes les nations et nos pères d’entre tous leurs ancêtres comme un héritage éternel, et que tu as accompli pour eux tout ce que tu as dit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « tu as fait pour eux tout ce que tu as dit ».'
    reason: La note préserve la formulation concrète de ἐποίησας… ἐλάλησας sans introduire une antériorité temporelle non marquée par le grec.
lexical_decisions:
- source_word: ἐγὼ ἤκουον ἐκ γενετῆς μου
  choice: Depuis ma naissance, j’ai entendu dire
  rationale: L’imparfait évoque ici une tradition reçue depuis l’origine de la vie. Cette formulation française restitue naturellement la durée sans suggérer une audition ponctuelle.
- source_word: ἐν φυλῇ πατριάς μου
  choice: au sein de la tribu de ma famille ancestrale
  rationale: φυλή désigne la tribu et πατριά la famille ou lignée issue des pères; la traduction conserve les deux niveaux de parenté.
- source_word: σύ, Κύριε
  choice: toi, Seigneur
  rationale: Le pronom emphatique et l’adresse directe sont maintenus, dans un registre actuel et digne.
- source_word: ἔλαβες τὸν Ἰσραὴλ ἐκ πάντων τῶν ἐθνῶν
  choice: tu as pris Israël d’entre toutes les nations
  rationale: « Pris d’entre » garde l’image de la sélection exprimée par λαμβάνω et ἐκ, sans expliciter davantage par « choisi ».
- source_word: τοὺς πατέρας ἡμῶν
  choice: nos pères
  rationale: Le terme masculin explicite πατέρες est conservé plutôt que neutralisé en « ancêtres ».
- source_word: ἐκ πάντων τῶν προγόνων αὐτῶν
  choice: d’entre tous leurs ancêtres
  rationale: La traduction suit la syntaxe grecque et maintient le référent naturel de αὐτῶν, à savoir « nos pères ».
- source_word: εἰς κληρονομίαν αἰώνιον
  choice: pour en faire un héritage éternel
  rationale: Cette formulation conserve le vocabulaire d’héritage et la portée durable de αἰώνιον, tout en rendant idiomatiquement le mouvement vers cette qualité ou fonction.
- source_word: ἐποίησας αὐτοῖς ὅσα ἐλάλησας
  choice: tu as accompli pour eux tout ce que tu avais déclaré
  rationale: « Accompli » exprime idiomatiquement l’action conforme à la parole antérieure; « déclaré » reste plus proche de λαλέω que « promis ». La note donne le calque plus littéral.
theological_decisions:
- issue: Langage d’élection et d’alliance dans εἰς κληρονομίαν αἰώνιον
  choice: pour en faire un héritage éternel
  alternative: comme héritage éternel / comme possession perpétuelle
  rationale: La traduction maintient l’image biblique de l’héritage et son caractère durable, sans préciser au-delà du grec la nature théologique de la possession ni son bénéficiaire ultime.
- issue: Rapport entre la parole divine et son exécution dans ἐποίησας αὐτοῖς ὅσα ἐλάλησας
  choice: tu as accompli pour eux tout ce que tu avais déclaré
  alternative: tu as fait pour eux tout ce que tu avais dit
  rationale: « Accompli » rend clairement le rapport entre parole et action sans transformer explicitement toute parole en promesse; la formulation littérale demeure documentée en note.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve la forme d’une prière et les répétitions généalogiques du grec. « Seigneur » rend Κύριε; « nos pères » préserve le terme de parenté masculin explicite.
