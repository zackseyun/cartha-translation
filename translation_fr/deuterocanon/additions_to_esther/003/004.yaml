  text: And you are Lord of all[a], and there is no one who will oppose you, O Lord.
translation:
  language: fr
  text: Tu es le Seigneur de tous, et personne ne s’opposera[a] à toi, Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « ne se dressera contre toi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Seigneur
  rationale: Dans cette prière, κύριος est un titre divin et une adresse directe à Dieu. « Seigneur » en conserve naturellement l’autorité et la portée révérencielle.
- source_word: πάντων
  choice: de tous
  rationale: 'Le génitif pluriel dépend de κύριος : « le Seigneur de tous » suit de près la construction grecque sans préciser indûment s’il s’agit de toutes les personnes ou de toutes choses.'
- source_word: οὐκ ἔστιν ὃς
  choice: personne ne
  rationale: Cette tournure exprime l’absence de quiconque susceptible de s’opposer à Dieu. « Personne ne » est idiomatique en français moderne tout en conservant la négation générale.
- source_word: ἀντιτάξεται
  choice: s’opposera
  rationale: Le futur moyen décrit le fait de prendre position contre quelqu’un. « S’opposera » est précis et naturel ; « se dressera contre » en donne une expression plus formelle.
- source_word: σοι
  choice: à toi
  rationale: Le datif complète naturellement le verbe français « s’opposer à ».
- source_word: τῷ κυρίῳ
  choice: Seigneur
  rationale: Bien que la forme grecque soit un datif avec article, elle fonctionne ici comme une adresse directe selon un usage fréquent de la langue biblique grecque.
theological_decisions:
- issue: Répétition de κύριος dans une adresse directe à Dieu
  choice: le Seigneur… Seigneur
  alternative: le Seigneur… au Seigneur
  rationale: Le contexte de prière et la syntaxe indiquent que la seconde occurrence est une apostrophe. La rendre par « au Seigneur » produirait le sens trompeur d’une opposition mettant Dieu en face du Seigneur.
translation_notes:
  register: Français international moderne, clair et digne. Le second « Seigneur » est rendu comme une apostrophe sans « ô », forme naturelle en français contemporain. L’ambiguïté possible de πάντων est préservée par « de tous ».
