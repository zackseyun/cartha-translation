base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/008.yaml
  text: And now[a], Lord God, King, God of Abraham, spare your people[b], because they are watching us for destruction and have desired to destroy your inheritance from the beginning.
translation:
  language: fr
  text: Et maintenant, Seigneur Dieu, Roi, Dieu d’Abraham, épargne ton peuple, car ils portent sur nous un regard qui vise notre destruction[a] et ils ont désiré détruire ton héritage depuis l’origine[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils ont les yeux fixés sur nous pour nous anéantir » ou « ils nous regardent en vue de notre ruine ». L’expression grecque est condensée et exprime un regard hostile dirigé vers notre destruction.
    reason: lexical_alternative
  - marker: b
    text: Ou « ton héritage depuis les temps anciens » ou « ton ancien héritage ».
    reason: alternative_reading
lexical_decisions:
- source_word: Κύριε
  choice: Seigneur
  rationale: Vocatif direct de κύριος. « Seigneur » conserve le titre biblique usuel et convient à l’invocation adressée à Dieu.
- source_word: ὁ θεὸς ὁ βασιλεὺς
  choice: Dieu, Roi
  rationale: La juxtaposition conserve la succession solennelle des titres sans imposer la reformulation plus interprétative « Dieu-Roi » ou « Dieu, le Roi ».
- source_word: φεῖσαι τοῦ λαοῦ σου
  choice: épargne ton peuple
  rationale: L’impératif de φείδομαι demande que le peuple soit préservé de la destruction. « Épargne » est précis et naturel dans une supplication.
- source_word: ἐπιβλέπουσιν ἡμῖν εἰς καταφθοράν
  choice: ils ont les yeux tournés vers nous pour notre perte
  rationale: Cette formulation française rend le regard hostile dirigé contre les locuteurs et le but funeste exprimé par εἰς καταφθοράν, tout en laissant en note d’autres manières de comprendre l’expression grecque comprimée.
- source_word: καταφθοράν
  choice: perte
  rationale: Le mot désigne une ruine ou une destruction complète. « Perte » s’intègre naturellement à la locution française, tandis que la force possible de « destruction » est signalée en note.
- source_word: ἐπεθύμησαν ἀπολέσαι
  choice: ils ont voulu détruire
  rationale: Le grec exprime un désir devenu intention hostile. « Ont voulu » est plus idiomatique en français moderne que « ont désiré » devant « détruire », sans transformer explicitement ce désir en plan arrêté.
- source_word: τὴν ἐξ ἀρχῆς κληρονομίαν σου
  choice: ton héritage depuis l’origine
  rationale: « Héritage » maintient la métaphore théologique de κληρονομία, et « depuis l’origine » rend directement ἐξ ἀρχῆς sans décider s’il s’agit du commencement absolu ou des temps anciens.
theological_decisions:
- issue: Référent de « ton héritage »
  choice: Maintien de la métaphore « ton héritage », qui désigne vraisemblablement le peuple de Dieu dans le parallèle avec « ton peuple »
  alternative: L’héritage peut aussi évoquer plus largement la terre ancestrale ou le patrimoine de l’alliance
  rationale: 'Le texte ne répète pas simplement « peuple » : il emploie κληρονομία. La traduction conserve donc cette image d’appartenance liée à l’alliance sans en préciser excessivement le référent.'
- issue: Portée de ἐξ ἀρχῆς
  choice: depuis l’origine
  alternative: depuis les temps anciens ; depuis toujours
  rationale: La formulation principale reste proche du grec et préserve sa tension temporelle. Une note indique le sens idiomatique possible d’ancienneté sans imposer l’idée d’un commencement absolu.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond aux formes grecques au singulier dans cette prière. La série vocative « Seigneur Dieu, Roi, Dieu d’Abraham » est conservée afin de respecter le rythme solennel et la structure de l’invocation.
