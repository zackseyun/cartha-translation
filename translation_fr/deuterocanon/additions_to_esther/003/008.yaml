  terminology: « Seigneur », « Dieu », « Roi », « épargne », « peuple » et « héritage » sont appropriés. « Destruction » rend mieux καταφθορά que « perte » dans ce contexte de menace d’anéantissement collectif, sans imposer un sens plus précis que le grec.
