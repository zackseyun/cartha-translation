  source_fidelity: 'La structure de la supplication et les principaux termes sont bien rendus : « Seigneur Dieu, Roi, Dieu d’Abraham », « épargne ton peuple » et « ton héritage » reflètent fidèlement le grec. Toutefois, « ils ont voulu détruire » peut, en français, suggérer une tentative ou un projet avorté, tandis que ἐπεθύμησαν exprime d’abord le désir ou l’intention. « Ils ont désiré détruire » est plus exact. La formulation de ἐπιβλέπουσιν… εἰς καταφθοράν gagne aussi à expliciter le regard hostile visant la destruction.'
