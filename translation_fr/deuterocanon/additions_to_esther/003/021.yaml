base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/021.yaml
  text: Do not hand over your scepter[a], Lord, to those who do not exist, and do not let them gloat over our downfall; instead, turn their plan against them, and make an example of the one who began this attack against us.
translation:
  language: fr
  text: Ne livre pas ton sceptre[a], Seigneur, à ceux qui n’existent pas, et qu’ils ne se moquent pas de notre chute. Retourne plutôt leur projet contre eux, et fais un exemple de celui qui a commencé contre nous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à ceux qui ne sont rien » ou « à des êtres sans réalité ». Le grec dit littéralement « à ceux qui ne sont pas ».
    reason: Alternative lexicale et préservation de l’ambiguïté théologique.
lexical_decisions:
- source_word: μὴ παραδῷς
  choice: Ne livre pas
  rationale: παραδίδωμι exprime l’action de livrer ou de remettre au pouvoir d’autrui. « Ne livre pas » est naturel et conserve ici l’idée de céder l’autorité symbolisée par le sceptre.
- source_word: τὸ σκῆπρόν σου
  choice: ton sceptre
  rationale: σκῆπτρον désigne littéralement le sceptre, emblème de l’autorité royale. L’image concrète et sa portée théologique sont conservées.
- source_word: τοῖς μὴ οὖσιν
  choice: à ceux qui n’existent pas
  rationale: La formule signifie littéralement « à ceux qui ne sont pas ». Cette traduction préserve son caractère abrupt et son ambiguïté polémique, sans la réduire à « des gens sans importance ».
- source_word: μὴ καταγελασάτωσαν
  choice: qu’ils ne se moquent pas
  rationale: καταγελάω signifie rire de quelqu’un, le tourner en dérision. « Se moquer de » restitue clairement cette hostilité en français actuel.
- source_word: ἐν τῇ πτώσει ἡμῶν
  choice: de notre chute
  rationale: πτῶσις désigne une chute et, dans ce contexte collectif, un effondrement ou une ruine. « Notre chute » conserve l’image grecque.
- source_word: στρέψον τὴν βουλὴν αὐτῶν ἐπʼ αὐτούς
  choice: Retourne plutôt leur projet contre eux
  rationale: βουλή désigne ici un projet ou un dessein hostile. « Retourner leur projet contre eux » rend directement l’effet de rétribution exprimé par στρέψον… ἐπʼ αὐτούς.
- source_word: τὸν δὲ ἀρξάμενον ἐφʼ ἡμᾶς
  choice: celui qui a commencé à agir contre nous
  rationale: Le grec dit de façon elliptique « celui qui a commencé contre nous ». « À agir » explicite seulement le verbe sous-entendu, sans préciser indûment la nature de l’hostilité.
- source_word: παραδειγμάτισον
  choice: fais un exemple de
  rationale: παραδειγματίζω peut signifier exposer publiquement à la honte ou faire de quelqu’un un exemple. La formulation retenue conserve à la fois la dimension punitive et publique sans en déterminer le moyen.
theological_decisions:
- issue: Sens de τοῖς μὴ οὖσιν
  choice: ceux qui n’existent pas
  alternative: ceux qui ne sont rien ; des êtres sans réalité
  rationale: La formule peut rabaisser les ennemis au rang de nullités ou évoquer, sur un plan polémique, leur absence de réalité ou de valeur. Le texte principal garde la formulation littérale afin de préserver cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement est employé dans la prière adressée au Seigneur. La syntaxe reste proche du grec tout en évitant une tournure artificielle ; l’ellipse de ἀρξάμενον ἐφʼ ἡμᾶς est légèrement explicitée par « à agir ».
