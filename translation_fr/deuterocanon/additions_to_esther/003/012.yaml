  terminology: « Vêtements de gloire », « détresse et deuil », « parfums somptueux », « cendres et fumier » et « cheveux tordus » correspondent bien au registre et aux termes grecs. « Somptueux » rend naturellement la nuance matérielle et ostentatoire probable de ὑπερηφάνων sans moraliser le terme. Le pluriel « cendres » est plus idiomatique en français pour σποδός dans ce contexte.
