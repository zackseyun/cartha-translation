  source_fidelity: 'La première moitié rend fidèlement le grec : le dépouillement des vêtements glorieux, les vêtements de détresse et de deuil, les parfums fastueux, la cendre et le fumier, ainsi que l’abaissement corporel sont conservés. « Se couvrit la tête » est une explicitation contextuelle acceptable de ἔπλησεν τὴν κεφαλήν, correctement documentée par une note. En revanche, la dernière proposition du projet ajoute « de son corps » et transforme le grec difficile en une relative explicative (« qu’elle parait pour les réjouissances »), alors que le texte parle littéralement de tout lieu/élément de sa parure joyeuse. Cette précision corporelle et temporelle n’est pas assurée par le grec.'
