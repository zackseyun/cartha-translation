revisions:
- from: Après avoir ôté ses vêtements de gloire, elle revêtit des vêtements de détresse et de deuil. Au lieu de parfums somptueux[a], elle se couvrit la tête de cendre et de fumier[b]. Elle humilia profondément son corps, et elle couvrit de ses cheveux entortillés chaque partie de son corps qu’elle parait pour les réjouissances[c].
  to: Après avoir ôté ses vêtements de gloire, elle revêtit des vêtements de détresse et de deuil. Au lieu de parfums somptueux[a], elle se couvrit la tête de cendres et de fumier[b]. Elle humilia profondément son corps et remplit de ses cheveux tordus chaque élément de sa parure joyeuse[c].
