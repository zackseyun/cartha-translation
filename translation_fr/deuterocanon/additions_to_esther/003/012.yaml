base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/012.yaml
  text: And taking off her garments of glory[a], she put on garments of distress and mourning; and instead of splendid perfumes, she filled her head with ashes and dung, and she humbled her body greatly[c][b], and every place of her joyful adornment she filled with the twisting of her hair.
translation:
  language: fr
  text: Après avoir ôté ses vêtements de gloire, elle revêtit des vêtements de détresse et de deuil. Au lieu de parfums somptueux[a], elle se couvrit la tête de cendres et de fumier[b]. Elle humilia profondément son corps et remplit de ses cheveux tordus chaque élément de sa parure joyeuse[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « parfums orgueilleux » ; il s’agit probablement de parfums coûteux ou ostentatoires.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « elle remplit sa tête de cendres et de fumier ».'
    reason: lexical_alternative
  - marker: c
    text: La fin de la phrase est difficile. Littéralement, elle « remplit de ses cheveux tordus chaque lieu de sa parure joyeuse ». Elle peut évoquer ce qui était auparavant paré pour la réjouissance, désormais marqué par des cheveux tordus, défaits ou en désordre, en signe de deuil.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀφελομένη τὰ ἱμάτια τῆς δόξης αὐτῆς
  choice: Après avoir ôté ses vêtements de gloire
  rationale: Le participe aoriste moyen exprime une action délibérée antérieure à l’action principale. « Vêtements de gloire » conserve le génitif grec et le contraste avec les habits de deuil.
- source_word: ἱμάτια στενοχωρίας καὶ πένθους
  choice: des vêtements de détresse et de deuil
  rationale: « Détresse » rend στενοχωρία dans un français naturel, tandis que « deuil » conserve la portée de πένθος.
- source_word: ἀντὶ τῶν ὑπερηφάνων ἡδυσμάτων
  choice: Au lieu de parfums somptueux
  rationale: ἡδύσματα désigne ici des substances odorantes ou parfums. Dans ce contexte matériel, ὑπερήφανος évoque leur caractère fastueux ou ostentatoire plutôt que l’orgueil au sens moral.
- source_word: σποδοῦ καὶ κοπριῶν
  choice: de cendre et de fumier
  rationale: Traduction directe de σποδός et κόπρια, qui maintient sans l’atténuer l’image volontairement saisissante de l’abaissement.
- source_word: ἔπλησεν τὴν κεφαλήν
  choice: elle se couvrit la tête
  rationale: Le grec dit littéralement « remplit la tête », expression peu intelligible en français. « Se couvrit la tête » communique naturellement le geste indiqué par le contexte, avec le littéral signalé en note.
- source_word: τὸ σῶμα ἐταπείνωσεν σφόδρα
  choice: Elle humilia profondément son corps
  rationale: Cette formulation conserve le verbe ταπεινόω, son objet corporel et l’intensité de σφόδρα sans préciser un rite que le texte ne nomme pas.
- source_word: πάντα τόπον κόσμου ἀγαλλιάματος αὐτῆς
  choice: chaque partie de son corps qu’elle parait pour les réjouissances
  rationale: κόσμος signifie ici parure et non « monde ». La formulation française explicite sobrement qu’il s’agit des parties de sa personne normalement ornées dans un contexte festif.
- source_word: στρεπτῶν τριχῶν αὐτῆς
  choice: ses cheveux entortillés
  rationale: στρεπτός se rapporte naturellement à ce qui est tordu ou entortillé. Le choix reste proche du grec sans trancher avec excès entre cheveux emmêlés, défaits ou tordus.
theological_decisions:
- issue: Intensité physique des gestes de deuil d’Esther
  choice: Conserver « cendre et fumier » ainsi que « humilia profondément son corps »
  alternative: Adoucir en « cendre et saleté » ou généraliser par « elle s’affligea »
  rationale: Le grec insiste sur un abaissement corporel radical. Une formulation euphémique diminuerait la force du passage.
- issue: Sens de στρεπτῶν τριχῶν αὐτῆς
  choice: Employer la formulation prudente « ses cheveux entortillés » et signaler l’incertitude en note
  alternative: Traduire de façon plus interprétative par « ses cheveux défaits » ou « ses cheveux emmêlés »
  rationale: Le détail exact de l’apparence des cheveux reste difficile à déterminer. La traduction conserve donc l’image de torsion tout en exposant le sens contextuel probable.
translation_notes:
  register: Français international moderne, digne et lisible. Le rendu conserve les images concrètes et rudes du grec. Les tournures les moins naturelles du texte source sont clarifiées avec prudence, et les ambiguïtés réelles sont documentées en notes.
