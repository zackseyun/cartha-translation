lexical_decisions:
- source_word: κίνδυνός μου
  choice: ma vie
  rationale: κίνδυνος signifie littéralement « danger » ou « péril », mais, dans cette expression, il s’agit du risque mortel auquel la personne est exposée. « Ma vie » rend naturellement le sens en français.
- source_word: ἐν χειρί μου
  choice: est entre mes mains
  rationale: Le grec dit littéralement « dans ma main ». La tournure française « entre mes mains » conserve l’image de la main tout en s’intégrant naturellement à l’expression indiquant que la vie est en jeu.
- source_word: ὅτι
  choice: car
  rationale: ὅτι introduit ici la raison ou l’explication de ce qui précède ; « car » convient à ce lien logique dans un registre biblique actuel.
