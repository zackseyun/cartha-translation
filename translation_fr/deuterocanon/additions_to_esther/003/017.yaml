translation:
  language: fr
  text: parce que nous avons rendu gloire à leurs dieux. Tu es juste, Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνθʼ ὧν
  choice: parce que
  rationale: La locution introduit ici la cause du jugement évoqué dans le contexte. « Parce que » en restitue clairement la valeur causale en français naturel.
- source_word: ἐδοξάσαμεν
  choice: nous avons rendu gloire à
  rationale: Le verbe δοξάζω exprime ici l’honneur ou la gloire accordés aux dieux étrangers. « Rendre gloire à » conserve cette idée et convient au registre confessionnel.
- source_word: τοὺς θεοὺς αὐτῶν
  choice: leurs dieux
  rationale: Traduction directe et idiomatique du pluriel accompagné du possessif, qui maintient le contraste avec le Seigneur.
- source_word: δίκαιος
  choice: juste
  rationale: Dans cette confession, δίκαιος affirme que Dieu agit avec justice et qu’il est moralement dans son droit. « Juste » exprime naturellement ces deux nuances en français.
- source_word: Κύριε
  choice: Seigneur
  rationale: Le vocatif désigne ici le Dieu d’Israël dans une prière; « Seigneur » est la forme française consacrée et naturelle.
theological_decisions:
- issue: Sens de δίκαιος dans l’adresse à Dieu
  choice: juste
  alternative: droit
  rationale: Le grec peut évoquer à la fois la rectitude morale et la justice du jugement divin. « Juste » conserve cette tension sans limiter le sens au seul domaine judiciaire.
- issue: Traduction de κύριος
  choice: Seigneur
  alternative: Maître
  rationale: Dans ce contexte de prière adressée au Dieu d’Israël, il s’agit d’un titre divin plutôt que d’un titre social générique.
translation_notes:
  register: Français moderne, sobre et digne. Le tutoiement convient à l’adresse directe à Dieu dans la tradition biblique française. Le fragment commence par une proposition causale, conformément au grec et à son rattachement au contexte précédent.
