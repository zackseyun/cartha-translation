  yaml_path: translation/deuterocanon/additions_to_esther/003/028.yaml
  text: And your servant has not rejoiced from the day of my change until now[a], except in you, Lord[b], God of Abraham.
translation:
  language: fr
  text: Et ta servante[a] ne s’est réjouie, depuis le jour de mon changement[b] jusqu’à maintenant, qu’en toi, Seigneur, Dieu d’Abraham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton esclave ». Le grec emploie la forme féminine de « esclave » ou « servante », comme humble manière de se désigner devant Dieu.
    reason: lexical_alternative
  - marker: b
    text: Le grec ne précise pas la nature de ce changement ; on pourrait aussi comprendre « depuis le jour de mon retournement » ou « depuis que ma situation a changé ».
    reason: alternative_reading
lexical_decisions:
- source_word: δούλη
  choice: servante
  rationale: Le féminin est explicitement conservé. « Servante » convient au registre humble d’une prière en français moderne, tandis que la note signale le sens plus fort possible d’« esclave ».
- source_word: ηὐφράνθη
  choice: ne s’est réjouie
  rationale: Cette expression rend directement l’idée de joie sans préciser indûment sa cause ou sa manifestation.
- source_word: ἀφʼ ἡμέρας μεταβολῆς μου
  choice: depuis le jour où tout a changé pour moi
  rationale: Formulation française naturelle qui conserve l’imprécision du grec quant à la nature exacte du changement.
- source_word: πλὴν ἐπὶ σοί
  choice: qu’en toi
  rationale: Avec la négation précédente, « ne… qu’en toi » exprime naturellement l’exception et présente Dieu comme l’unique fondement de sa joie.
- source_word: Κύριε
  choice: Seigneur
  rationale: Équivalent usuel et digne du vocatif κύριε dans une prière.
- source_word: ὁ θεὸς Ἀβραάμ
  choice: Dieu d’Abraham
  rationale: Rend directement le titre divin et sa portée traditionnelle sans ajout interprétatif.
theological_decisions:
- issue: Auto-désignation δούλη dans la prière
  choice: ta servante
  alternative: ton esclave
  rationale: « Servante » préserve le féminin et l’humilité de l’adresse tout en restant naturel dans le registre français de la prière. « Esclave » rend plus explicitement la dépendance impliquée par δούλη et demeure signalé en note.
- issue: Sens de μεταβολή dans la prière d’Esther
  choice: le jour où tout a changé pour moi
  alternative: le jour de mon changement ; le jour où mon sort a basculé
  rationale: Le grec ne précise ni la nature ni la valeur du changement. La traduction évite donc de décider s’il s’agit expressément d’un changement de rang, de situation ou de fortune.
translation_notes:
  register: Français moderne, digne et fluide, adapté à une prière. La tournure corrélative « ne… que » rend naturellement l’exception grecque. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils éclairent.
