base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/010.yaml
  text: Hear my petition and be merciful to your allotted people[a], and turn our mourning into gladness, so that, living, we may sing praise to your name, O Lord, and do not destroy the mouth of those who praise you. And all Israel cried out with all their strength[b], because their death was before their eyes.
translation:
  language: fr
  text: Écoute ma supplication et prends pitié du peuple qui est ta part[a]. Change notre deuil en joie, afin que, restés en vie, nous chantions les louanges de ton nom, Seigneur. Ne fais pas disparaître la bouche de ceux qui te louent[b]. Et tous les Israélites crièrent de toutes leurs forces, car la mort était devant leurs yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « prends pitié de ta part ». Le mot grec peut désigner un lot, une part attribuée ou un héritage; ici, il s’agit du peuple appartenant à Dieu.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Ne fais pas disparaître la bouche de ceux qui te louent », image demandant à Dieu de ne pas supprimer ni réduire au silence ses adorateurs.'
    reason: idiom_clarification
lexical_decisions:
- source_word: κουσον (ἄκουσον)
  choice: Écoute
  rationale: Impératif aoriste courant dans la prière; « Écoute » est direct, naturel et fidèle à l’appel adressé à Dieu.
- source_word: τῆς δεήσεώς μου
  choice: ma supplication
  rationale: « Supplication » exprime une demande pressante et garde ici un registre de prière digne.
- source_word: ἱλάσθητι
  choice: prends pitié
  rationale: Rend l’appel à la faveur et à la clémence divines sans introduire un vocabulaire technique de l’expiation.
- source_word: τῷ κλήρῳ σου
  choice: du peuple qui est ta part
  rationale: κλῆρος signifie littéralement « lot » ou « part attribuée »; le contexte désigne Israël comme la part appartenant à Dieu. Cette formulation rend le référent intelligible tout en conservant l’image.
- source_word: στρέψον τὸ πένθος ἡμῶν εἰς εὐφροσύνην
  choice: Change notre deuil en joie
  rationale: Formulation française naturelle qui préserve le motif du renversement du deuil en allégresse.
- source_word: ἵνα ζῶντες
  choice: afin que, restés en vie
  rationale: Le participe lie la survie à la possibilité de louer Dieu; « restés en vie » explicite sobrement cette relation.
- source_word: ὑμνῶμεν σου τὸ ὄνομα
  choice: nous chantions les louanges de ton nom
  rationale: ὑμνέω évoque spécifiquement une louange chantée; la formulation demeure idiomatique en français.
- source_word: μὴ ἀφανίσῃς στόμα αἰνούντων σου
  choice: Ne fais pas disparaître la bouche de ceux qui te louent
  rationale: Conserve l’image concrète et forte du grec; le sens contextuel est de ne pas supprimer ni réduire au silence les adorateurs.
- source_word: ἐκέκραξαν ἐξ ἰσχύος αὐτῶν
  choice: cria de toutes ses forces
  rationale: Expression française idiomatique pour un cri poussé avec toute la force disponible; l’accord singulier suit le collectif « tout Israël ».
- source_word: θάνατος αὐτῶν ἐν ὀφθαλμοῖς αὐτῶν
  choice: ils avaient leur mort devant les yeux
  rationale: Préserve le possessif répété dans le grec et l’image vive d’une mort imminente, dans un français plus naturel que « leur mort était devant leurs yeux ».
theological_decisions:
- issue: Interprétation de τῷ κλήρῳ σου
  choice: du peuple qui est ta part
  alternative: de ta part / de ton héritage / de ton lot
  rationale: Le grec conserve l’image de la part attribuée, tandis que le contexte identifie cette part au peuple d’Israël. La traduction rend les deux dimensions sans réduire κλῆρος au seul concept d’« héritage ».
- issue: Traduction de Κύριε
  choice: Seigneur
  alternative: Éternel
  rationale: Le témoin grec porte Κύριε. « Seigneur » traduit directement ce titre sans reconstruire dans le texte français un éventuel substrat hébreu.
- issue: Portée de ἱλάσθητι
  choice: prends pitié
  alternative: sois favorable / laisse-toi apaiser
  rationale: La formulation retient l’appel à la miséricorde divine tout en laissant subsister la nuance possible de propitiation ou d’apaisement signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Tutoiement maintenu dans la prière, conformément au singulier grec. La syntaxe a été légèrement segmentée pour la lisibilité, tout en préservant les images de la « part », de la bouche qui loue et de la mort placée devant les yeux.
