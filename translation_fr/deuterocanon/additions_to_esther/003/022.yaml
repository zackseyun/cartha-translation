base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/022.yaml
  text: Remember[a], Lord; make yourself known in the time of our affliction, and encourage me[b], O King of the gods and ruler over every authority.
translation:
  language: fr
  text: Souviens-toi, Seigneur ; manifeste-toi[a] au temps de notre détresse, et donne-moi du courage, ô Roi des dieux[b], toi qui domines toute autorité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fais-toi connaître ». La forme grecque peut aussi être rendue plus littéralement par « sois connu » ; dans cette prière, elle appelle Dieu à se faire connaître par son intervention.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « Roi des dieux ». Ce titre proclame la suprématie de Dieu sur toute puissance considérée comme divine.
    reason: theological_clarification
lexical_decisions:
- source_word: μνήσθητι
  choice: Souviens-toi
  rationale: L’impératif aoriste moyen appartient au langage de la prière et appelle naturellement la traduction directe « Souviens-toi », sans suggérer que Dieu aurait oublié.
- source_word: Κύριε
  choice: Seigneur
  rationale: Vocatif du titre divin κύριος; « Seigneur » est l’équivalent français courant, digne et naturel dans une prière.
- source_word: γνώρισθητι
  choice: manifeste-toi
  rationale: 'La forme passive peut avoir ici une valeur médio-passive: l’appel demande à Dieu de se faire connaître par son intervention. « Manifeste-toi » restitue cette idée avec concision tout en laissant en note l’alternative plus formelle.'
- source_word: ἐν καιρῷ θλίψεως ἡμῶν
  choice: au temps de notre détresse
  rationale: καιρός désigne ici le temps ou le moment de crise, et θλῖψις une détresse ou affliction. Cette formulation reste proche du grec et naturelle en français.
- source_word: ἐμὲ θάρσυνον
  choice: donne-moi du courage
  rationale: θαρσύνω signifie encourager ou enhardir. « Donne-moi du courage » exprime clairement la requête personnelle et son intensité en français actuel.
- source_word: Βασιλεῦ τῶν θεῶν
  choice: ô Roi des dieux
  rationale: La formulation littérale du grec est conservée afin de ne pas atténuer ce titre de suprématie divine.
- source_word: πάσης ἀρχῆς ἐπικρατῶν
  choice: toi qui domines toute autorité
  rationale: Le participe ἐπικρατῶν décrit la domination exercée sur πάσης ἀρχῆς. La proposition en apposition rend clairement son rattachement au Roi invoqué, tandis que « autorité » préserve l’étendue sémantique de ἀρχή.
theological_decisions:
- issue: Le titre divin Βασιλεῦ τῶν θεῶν
  choice: ô Roi des dieux
  alternative: ô Roi au-dessus des dieux
  rationale: Le grec dit explicitement « Roi des dieux ». La traduction conserve cette tension et exprime la suprématie du Seigneur sur toute puissance appelée divine, sans transformer le texte en affirmation polythéiste ni l’adoucir par une paraphrase.
- issue: La voix et la portée de γνώρισθητι
  choice: manifeste-toi
  alternative: fais-toi connaître / sois reconnu
  rationale: Dans cette prière, la forme demande une manifestation de Dieu au cœur de la détresse. Le réfléchi français rend naturellement cette valeur sans préciser indûment la manière de l’intervention.
- issue: Le rattachement de ἐπικρατῶν
  choice: toi qui domines toute autorité
  alternative: et souverain sur toute autorité
  rationale: Le participe nominatif s’accorde avec le Roi invoqué et le décrit comme dominant toute autorité. La proposition relative explicite ce lien grammatical sans fondre « les dieux » et « toute autorité » en un seul complément de ἐπικρατῶν.
translation_notes:
  register: Français international moderne, digne et adapté à une prière. Le point-virgule maintient l’enchaînement solennel des impératifs; « au temps de notre détresse » reste accessible sans banaliser θλῖψις. Les deux marqueurs [a] et [b] figurent dans le texte.
