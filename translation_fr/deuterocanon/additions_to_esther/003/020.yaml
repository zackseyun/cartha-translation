  text: and to open the mouth of the nations to the praises of worthless things[b][a], and for a fleshly king to be marveled at forever.
translation:
  language: fr
  text: et ouvrir la bouche des nations pour qu’elles vantent des choses vaines[a], et qu’un roi de chair[b] soit admiré à jamais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « célèbrent les qualités de choses vaines », ou « chantent les louanges des vanités ». Le grec dit plus littéralement : « vers les qualités (ou les mérites) de choses vaines » ; dans ce contexte, celles-ci peuvent désigner des idoles.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou « un roi mortel » ou « un simple roi humain ». Littéralement : « un roi de chair ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοῖξαι στόμα
  choice: ouvrir la bouche
  rationale: Conserve l’image grecque courante qui désigne le fait de donner à quelqu’un l’occasion ou la capacité de parler.
- source_word: ἐθνῶν
  choice: des nations
  rationale: Rend le terme largement, sans imposer le sens plus étroit de « non-Juifs ».
- source_word: ἀρετὰς ματαίων
  choice: qu’elles vantent des choses vaines
  rationale: Exprime naturellement en français l’attribution de qualités ou de louanges à ce qui est vain, tout en évitant d’ajouter explicitement « idoles », absent du grec.
- source_word: θαυμασθῆναι
  choice: soit admiré
  rationale: Le passif grec signifie être regardé avec admiration ou émerveillement ; « adoré » serait trop fort lexicalement.
- source_word: βασιλέα σάρκινον
  choice: un roi de chair
  rationale: Préserve l’image concrète du grec et le contraste implicite entre un souverain humain et Dieu, sans le réduire d’emblée à « mortel ».
- source_word: εἰς αἰῶνα
  choice: à jamais
  rationale: Rend l’idée d’une durée sans fin dans un registre digne et naturel.
theological_decisions:
- issue: Faut-il expliciter une référence aux idoles dans ματαίων ?
  choice: des choses vaines
  alternative: des idoles sans valeur
  rationale: Le contexte peut viser l’idolâtrie, mais le grec emploie un adjectif substantivé plus large. La traduction conserve cette généralité et laisse la note signaler la nuance possible.
- issue: Comment rendre le contraste porté par σάρκινον ?
  choice: un roi de chair
  alternative: un roi mortel / un simple roi humain
  rationale: La formulation concrète respecte la tension théologique du texte sans transformer l’image en interprétation explicative.
translation_notes:
  register: Français international actuel, digne et accessible. La structure infinitive grecque est rendue par une coordination fluide ; « roi de chair » conserve volontairement l’image inhabituelle de l’original.
