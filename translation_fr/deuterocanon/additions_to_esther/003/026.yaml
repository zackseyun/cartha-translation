base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/026.yaml
  text: You know my distress[a], that I loathe the sign of my pride, which is upon my head in the days of my appearance; I loathe it like a menstrual cloth[e][d][c][b], and I do not wear it in the days of my rest.
translation:
  language: fr
  text: 'Tu connais ma détresse[a] : j’ai en horreur l’insigne de mon orgueil[b], qui est sur ma tête aux jours où je parais[c]. Je l’ai en horreur comme un linge menstruel[d], et je ne le porte pas durant mes jours de calme[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma nécessité » ou « mon besoin ».
    reason: lexical_alternative
  - marker: b
    text: L’expression désigne probablement un ornement royal ou un emblème de rang porté sur la tête ; le grec ne précise pas de quel objet il s’agit.
    reason: cultural_note
  - marker: c
    text: Littéralement « aux jours de mon apparition » ; il s’agit vraisemblablement des occasions où elle paraît, possiblement en public ou à la cour.
    reason: lexical_alternative
  - marker: d
    text: Littéralement « un chiffon de menstrues » ; l’expression grecque est volontairement crue et marque une vive répulsion.
    reason: lexical_alternative
  - marker: e
    text: Ou « de repos », « de tranquillité » ou « de retrait » ; l’expression contraste avec les jours où Esther paraît.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάγκην
  choice: détresse
  rationale: Dans cette prière, le nom désigne la situation pressante et pénible d’Esther. « Détresse » est naturel en français et convient au contexte, tout en signalant en note les sens possibles de nécessité ou de besoin.
- source_word: βδελύσσομαι
  choice: j’ai en horreur
  rationale: Cette expression rend la forte répulsion exprimée par le verbe grec et fonctionne naturellement aux deux occurrences.
- source_word: σημεῖον τῆς ὑπερηφανίας μου
  choice: l’insigne de mon orgueil
  rationale: « Insigne » désigne naturellement une marque visible de rang sans préciser indûment qu’il s’agit d’une couronne. « Orgueil » conserve la valeur négative de ὑπερηφανία.
- source_word: ὀπτασίας
  choice: où je parais en public
  rationale: Dans ce contexte, le mot renvoie vraisemblablement aux occasions où Esther se montre publiquement ou à la cour, plutôt qu’à une vision surnaturelle.
- source_word: ῥάκος καταμηνίων
  choice: un linge menstruel
  rationale: La formulation conserve explicitement l’image graphique de la menstruation tout en adoptant un registre français digne et compréhensible.
- source_word: φορῶ
  choice: je le porte
  rationale: Le verbe « porter » est l’équivalent français naturel pour un ornement ou un emblème placé sur la tête.
- source_word: ἡσυχίας
  choice: tranquillité
  rationale: Le terme peut exprimer le calme, le repos ou le retrait de la vie publique. « Tranquillité » préserve cette amplitude et contraste avec les apparitions publiques.
theological_decisions:
- issue: Nature de l’objet rejeté par Esther
  choice: Un insigne général de son élévation royale, sans l’identifier précisément.
  alternative: Une couronne, un diadème ou une coiffure royale.
  rationale: Le grec parle d’un « signe » placé sur sa tête sans nommer l’objet. « Insigne » maintient cette indétermination.
- issue: Force de la comparaison liée à l’impureté
  choice: Conserver explicitement l’image du linge menstruel dans le texte principal.
  alternative: Employer une formulation atténuée telle que « linge impur » ou « chiffon souillé ».
  rationale: Le grec mentionne expressément les menstrues. Atténuer l’expression ferait perdre la vigueur volontaire de la répulsion exprimée par Esther.
