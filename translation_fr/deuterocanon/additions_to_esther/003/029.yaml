base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/029.yaml
  text: O God[a], who are mighty over all, hear the voice of those who have lost hope, and rescue us from the hand of those who do evil, and rescue me from my fear.
translation:
  language: fr
  text: Ô Dieu, toi qui es puissant sur tous, écoute la voix de ceux qui n’ont plus d’espoir, délivre-nous de la main de ceux qui font le mal, et délivre-moi de ma peur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de ce que je redoute ». Le grec peut désigner soit la peur éprouvée par Esther, soit le danger qu’elle redoute.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς
  choice: Ô Dieu
  rationale: Le nominatif avec article a ici valeur de vocatif dans la prière. « Ô Dieu » restitue naturellement l’adresse directe et solennelle.
- source_word: ὁ ἰσχύων ἐπὶ πάντας
  choice: toi qui es puissant au-dessus de tous
  rationale: Le participe exprime la puissance de Dieu, tandis que ἐπὶ πάντας en marque l’étendue et la suprématie. Cette formulation conserve la portée personnelle probable de πάντας sans la réduire davantage.
- source_word: εἰσάκουσον
  choice: écoute
  rationale: L’impératif demande une écoute attentive et favorable. « Écoute » est clair, actuel et adapté à la prière.
- source_word: φωνὴν ἀπηλπισμένων
  choice: la voix de ceux qui ont perdu tout espoir
  rationale: Le participe parfait évoque des personnes désormais privées d’espoir. La formulation rend cet état résultant et la détresse du grec.
- source_word: ῥῦσαι ἡμᾶς / ῥῦσαί με
  choice: délivre-nous / délivre-moi
  rationale: ῥύομαι désigne l’action d’arracher à un danger. La répétition de « délivre » préserve le parallélisme rhétorique du texte grec.
- source_word: ἐκ χειρὸς τῶν πονηρευομένων
  choice: de la main de ceux qui font le mal
  rationale: « De la main de » conserve l’image biblique de l’emprise hostile, et « ceux qui font le mal » rend l’action mauvaise sans préciser indûment sa forme.
- source_word: ἐκ τοῦ φόβου μου
  choice: de ma peur
  rationale: C’est le rendu le plus direct de la phrase grecque; il laisse ouverte la possibilité que φόβος désigne soit la peur éprouvée, soit ce qui l’inspire.
theological_decisions:
- issue: La délivrance demandée en ἐκ τοῦ φόβου μου concerne-t-elle l’émotion intérieure ou le danger redouté ?
  choice: de ma peur
  alternative: de ce que je redoute
  rationale: Le grec permet d’entendre aussi bien la peur elle-même que son objet. Le texte principal garde la formulation directe, tandis que la note préserve l’autre lecture sans trancher.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’usage courant de la prière biblique en français. La répétition de « délivre » conserve l’insistance de l’original.
