translation:
  language: fr
  text: Et maintenant, nous avons péché devant toi, et tu nous as livrés aux mains de nos ennemis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ νῦν
  choice: Et maintenant
  rationale: Conserve le lien avec la suite de la prière et la valeur temporelle, sans introduire un contraste absent du grec.
- source_word: ἡμάρτομεν
  choice: nous avons péché
  rationale: Le passé composé convient naturellement à une confession portant sur un péché commis dont les conséquences demeurent présentes.
- source_word: ἐνώπιόν σου
  choice: devant toi
  rationale: Expression française concise qui garde l'idée d'agir sous le regard et en présence de Dieu.
- source_word: παρέδωκας
  choice: tu nous as livrés
  rationale: Rend directement l'action de remettre le peuple au pouvoir de ses ennemis, avec Dieu comme sujet explicite.
- source_word: εἰς χεῖρας
  choice: aux mains de
  rationale: Préserve l'image biblique, également idiomatique en français, qui exprime le passage sous le pouvoir d'autrui.
- source_word: τῶν ἐχθρῶν ἡμῶν
  choice: nos ennemis
  rationale: Équivalent direct, naturel et contextuellement précis.
theological_decisions:
- issue: Action divine dans le jugement du peuple
  choice: La formulation affirme directement que Dieu a livré le peuple à ses ennemis.
  alternative: Atténuer l'action divine en disant que le peuple est simplement tombé au pouvoir de ses ennemis.
  rationale: Le grec παρέδωκας est à la deuxième personne du singulier et attribue explicitement l'action à Dieu; cette tension théologique doit être conservée.
translation_notes:
  register: Français moderne, sobre et digne, adapté au langage de la prière. La répétition de « nous » suit la structure grecque tout en restant naturelle.
