  text: Et il supplia le Seigneur, se souvenant de toutes les œuvres du Seigneur,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδεήθη
  choice: supplia
  rationale: Le verbe exprime ici une demande instante. « Supplia » en conserve l’intensité dans un français naturel et digne.
- source_word: Κυρίου
  choice: le Seigneur
  rationale: Après « supplier », l’article défini est requis par l’usage français. « Seigneur » convient au langage de la prière et n’impose pas la convention typographique « Éternel » ou « SEIGNEUR ».
- source_word: μνημονεύων
  choice: se souvenant
  rationale: Le participe présent indique une action accompagnant la supplication, sans décider s’il s’agit d’un souvenir intérieur ou d’une évocation formulée à voix haute.
- source_word: πάντα
  choice: toutes
  rationale: Ce choix rend directement la portée exhaustive du grec et s’accorde avec le nom féminin pluriel « œuvres ».
- source_word: τὰ ἔργα
  choice: les œuvres
  rationale: « Œuvres » garde le sens large des actes accomplis et une résonance biblique, sans limiter le terme à des exploits particuliers.
- source_word: Κυρίου
  choice: du Seigneur
  rationale: Cette formulation française naturelle préserve la répétition de « Seigneur » présente dans le grec.
theological_decisions:
- issue: Traduction de κύριος dans cette prière grecque deutérocanonique
  choice: Seigneur
  alternative: Éternel / SEIGNEUR / Maître
  rationale: Le contexte de prière soutient « Seigneur ». Le grec seul ne justifie pas ici l’introduction d’une convention française propre au nom divin, tandis que « Maître » réduirait la portée religieuse du titre.
translation_notes:
  register: Français moderne, international et digne. La structure participiale et la répétition du titre divin sont conservées. La virgule finale signale que le segment se poursuit dans le verset suivant.
