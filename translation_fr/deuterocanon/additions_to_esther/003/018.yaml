  yaml_path: translation/deuterocanon/additions_to_esther/003/018.yaml
  text: And now they were not satisfied with the bitterness of our slavery[a], but they have laid their hands upon us,
translation:
  language: fr
  text: 'Et maintenant, ils ne se sont pas contentés de l’amertume de notre esclavage : ils ont porté la main sur nous[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « ils ont posé leurs mains ». Cette expression elliptique évoque probablement une action hostile entreprise contre nous.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ἱκανώθησαν
  choice: ils ne se sont pas contentés
  rationale: Cette tournure française naturelle exprime que leur oppression antérieure ne leur a pas suffi, tout en conservant la valeur du passif grec dans le contexte.
- source_word: ἐν πικρασμῷ
  choice: de l’amertume
  rationale: πικρασμός désigne l’amertume ou ce qui rend la condition amère. Le choix reste proche du grec et évite de préciser indûment la nature de la souffrance.
- source_word: δουλείας ἡμῶν
  choice: de notre esclavage
  rationale: δουλεία désigne directement l’esclavage ou l’asservissement. « Esclavage » préserve ici la force de la plainte collective.
- source_word: ἔθηκαν τὰς χεῖρας αὐτῶν
  choice: ils ont porté la main sur nous
  rationale: Le grec dit littéralement qu’ils « ont posé leurs mains », sans complément exprimé. L’expression française traduit naturellement l’action hostile suggérée par le contexte, tandis que la note signale l’ellipse.
theological_decisions:
- issue: Portée de δουλεία dans un contexte de soumission nationale
  choice: esclavage
  alternative: servitude
  rationale: « Esclavage » rend avec force la condition de sujétion dénoncée, sans ajouter de caractéristiques historiques étrangères au passage.
- issue: Complément implicite de ἔθηκαν τὰς χεῖρας αὐτῶν
  choice: sur nous
  alternative: 'laisser la formule sans complément : « ils ont posé leurs mains »'
  rationale: Le grec demeure elliptique, mais le contexte de la prière indique une action dirigée contre les suppliants. Le complément rend la phrase intelligible en français sans trancher davantage la nature exacte de l’hostilité.
translation_notes:
  register: Français moderne, sobre et digne. La construction avec deux points restitue l’escalade marquée par ἀλλά sans alourdir la phrase. La virgule finale est conservée puisque le segment se poursuit dans le verset suivant.
