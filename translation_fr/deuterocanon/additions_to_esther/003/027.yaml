base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/027.yaml
  text: And your servant did not eat at Haman’s table[a], and I did not honor the king’s banquet, nor did I drink the wine of libations[b];
translation:
  language: fr
  text: Ton esclave[a] n’a pas mangé à la table d’Haman ; je n’ai pas honoré le banquet du roi, ni je n’ai bu le vin des libations[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « ton esclave » et emploie le terme au féminin ; « ta servante » serait une traduction plus douce.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit de vin associé à des libations, c’est-à-dire à des offrandes de boisson, et non simplement de vin ordinaire.
    reason: cultural_note
lexical_decisions:
- source_word: ἡ δούλη σου
  choice: ton esclave
  rationale: Le grec emploie le féminin de δοῦλος et exprime une forte position de subordination. « Ton esclave » en conserve la force, tandis que « ta servante » l’atténuerait.
- source_word: ἔφαγεν
  choice: n’a pas mangé
  rationale: Équivalent français direct et naturel de l’aoriste de ἐσθίω dans cette série négative.
- source_word: τράπεζαν Ἁμάν
  choice: à la table d’Haman
  rationale: Cette tournure idiomatique française conserve l’image concrète de la table et exprime naturellement le fait de partager le repas d’Haman.
- source_word: ἐδόξασα
  choice: je n’ai pas honoré
  rationale: Dans ce contexte, δοξάζω signifie traiter avec honneur ou considération. « Honoré » préserve cette idée sans donner au verbe une portée exclusivement cultuelle.
- source_word: συμπόσιον βασιλέως
  choice: le banquet du roi
  rationale: « Banquet » rend le repas festif, souvent accompagné de vin, dans un registre digne et courant.
- source_word: οἶνον σπονδῶν
  choice: le vin des libations
  rationale: La formulation conserve le génitif grec et sa nuance rituelle sans préciser au-delà du texte la nature exacte du rapport entre le vin et les libations.
theological_decisions:
- issue: Force de δούλη dans la manière dont Esther se désigne
  choice: ton esclave
  alternative: ta servante
  rationale: Le choix retenu préserve la forte subordination exprimée par le grec dans la prière d’Esther, sans adoucir le terme en fonction d’une préférence confessionnelle.
- issue: Nuance cultuelle de οἶνον σπονδῶν
  choice: le vin des libations
  alternative: le vin destiné aux libations
  rationale: Le génitif grec indique une association avec des libations, mais n’en définit pas explicitement la relation précise. La traduction conserve cette légère ambiguïté.
- issue: Passage de la troisième à la première personne
  choice: « Ton esclave n’a pas… ; je n’ai pas… »
  alternative: « Moi, ton esclave, je n’ai pas… »
  rationale: Le grec passe délibérément de ἡ δούλη σου avec un verbe à la troisième personne à deux verbes à la première personne. Le français conserve ce changement plutôt que de l’uniformiser.
translation_notes:
  register: Français international moderne, sobre et digne. La ponctuation met en relief le passage de la troisième à la première personne. « Haman » suit la forme française biblique courante du nom.
