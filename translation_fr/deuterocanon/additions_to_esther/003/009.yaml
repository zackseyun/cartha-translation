  text: Ne néglige pas ta part, celle que tu as rachetée pour toi-même du pays d’Égypte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ ὑπερίδῃς
  choice: Ne délaisse pas
  rationale: Le verbe ὑπεροράω peut signifier ne pas prendre en considération, négliger ou délaisser. Dans cette prière, « ne délaisse pas » exprime naturellement l’appel à Dieu à ne pas abandonner son peuple, sans introduire l’idée plus forte de mépris.
- source_word: τὴν μερίδα σου
  choice: la part qui est à toi
  rationale: μερίς désigne une part ou une portion. Cette formulation française conserve l’image d’une part appartenant à Dieu et ses résonances d’alliance, sans préciser abusivement « héritage » ou « peuple ».
- source_word: ἣν
  choice: celle que
  rationale: Le pronom relatif reprend μερίδα. « Celle que » évite une succession pesante de relatives et reste clair en français courant.
- source_word: σεαυτῷ
  choice: pour toi-même
  rationale: Le datif réfléchi souligne que Dieu a acquis cette part pour lui-même, comme lui appartenant en propre.
- source_word: ἐλυτρώσω
  choice: tu as rachetée
  rationale: 'ἐλυτρώσω est ici la deuxième personne du singulier de l’aoriste moyen de λυτρόομαι, en accord avec σεαυτῷ : la personne qui prie s’adresse à Dieu et dit « tu as rachetée », non « j’ai rachetée ». « Racheter » conserve la portée libératrice et théologique du verbe.'
- source_word: ἐκ γῆς Αἰγύπτου
  choice: hors du pays d’Égypte
  rationale: Cette formulation conserve la préposition exprimant la sortie ainsi que l’expression biblique complète « pays d’Égypte ».
theological_decisions:
- issue: Nuance d’appartenance liée à μερίς
  choice: la part qui est à toi
  alternative: ton héritage
  rationale: Le grec parle littéralement de « ta part ». La traduction retenue laisse entendre que le peuple appartient à Dieu sans imposer le terme plus technique d’« héritage ».
- issue: Personne grammaticale de ἐλυτρώσω et valeur de σεαυτῷ
  choice: celle que tu as rachetée pour toi-même
  alternative: celle que j’ai rachetée pour moi-même
  rationale: 'La forme ἐλυτρώσω est une deuxième personne du singulier à l’aoriste moyen, et σεαυτῷ est le réfléchi de deuxième personne. Le texte est une prière adressée à Dieu : c’est donc Dieu qui a racheté cette part pour lui-même. La première personne de la couche anglaise ne correspond pas à la morphologie grecque.'
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’image de la « part » et la répétition emphatique de l’appartenance à Dieu, tout en rendant correctement la deuxième personne du grec.
