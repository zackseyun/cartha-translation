  text: But rescue us by your hand, and help me, who am alone and have no one except you, Lord. You have knowledge of all things,
translation:
  language: fr
  text: Mais délivre-nous par ta main, et viens à mon aide, à moi qui suis seule et qui n’ai personne d’autre que toi, Seigneur. Tu as connaissance de toutes choses,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥῦσαι
  choice: délivre-nous
  rationale: L’impératif aoriste exprime une supplication urgente pour être arraché au danger. « Délivre-nous » est naturel dans une prière et conserve la portée du verbe sans la réduire à un salut exclusivement spirituel.
- source_word: ἐν χειρί σου
  choice: par ta main
  rationale: Cette formulation préserve la métaphore biblique de la main comme puissance agissante tout en exprimant clairement le moyen de la délivrance.
- source_word: βοήθησόν μοι
  choice: viens à mon aide
  rationale: Cette tournure française rend directement l’impératif et le datif, avec un registre de prière naturel et digne.
- source_word: τῇ μόνῃ
  choice: à moi qui suis seule
  rationale: Le féminin singulier renvoie à la locutrice, Esther. La construction relative explicite naturellement son isolement sans modifier le sens.
- source_word: μὴ ἔχουσῃ εἰ μὴ σέ
  choice: qui n’ai personne d’autre que toi
  rationale: Le participe poursuit la description de la locutrice démunie. « Personne d’autre que toi » restitue en français l’objet personnel implicite.
- source_word: Κύριε
  choice: Seigneur
  rationale: Dans cette adresse directe au Dieu d’Israël, « Seigneur » est le terme français biblique courant et approprié.
- source_word: πάντων γνῶσιν ἔχεις
  choice: Tu as connaissance de toutes choses
  rationale: Cette formulation conserve la construction nominale grecque, littéralement « avoir connaissance », ainsi que le registre élevé de la prière.
theological_decisions:
- issue: Traduction de κύριος dans une adresse directe à Dieu
  choice: Seigneur
  alternative: Maître
  rationale: La prière s’adresse au Dieu d’Israël. « Seigneur » est la désignation française habituelle et ne requiert aucune précision doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement convient à l’adresse biblique directe à Dieu. La phrase demeure ouverte par une virgule finale, conformément au segment grec qui se poursuit au verset suivant.
