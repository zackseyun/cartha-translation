base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/023.yaml
  text: Put fitting words in my mouth before the lion, and turn his heart to hatred against the one who is warring against us, to his destruction and that of those who are of one mind with him.
translation:
  language: fr
  text: Mets dans ma bouche des paroles appropriées devant le lion[a], et tourne son cœur à haïr celui qui nous fait la guerre, pour sa ruine[b] ainsi que celle de ceux qui sont du même avis que lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « lion » représente ici le roi ; la traduction conserve l’image employée dans la prière d’Esther.
    reason: cultural_note
  - marker: b
    text: Ou « pour sa fin » ou « pour sa destruction ».
    reason: lexical_alternative
lexical_decisions:
- source_word: δὸς
  choice: Mets
  rationale: L’impératif de δίδωμι signifie littéralement « donne »; avec « dans ma bouche », « mets » est idiomatique en français et exprime clairement l’octroi des paroles demandées.
- source_word: λόγον εὔρυθμον
  choice: des paroles appropriées
  rationale: εὔρυθμος désigne ici une parole bien agencée, heureuse et adaptée à la circonstance. Le pluriel français est naturel dans la locution « mettre des paroles dans la bouche » sans modifier le sens collectif du singulier grec.
- source_word: ἐνώπιον τοῦ λέοντος
  choice: devant le lion
  rationale: La traduction conserve l’image explicite du grec, qui désigne métaphoriquement le roi dans cette prière.
- source_word: μετάθες τὴν καρδίαν αὐτοῦ εἰς μῖσος
  choice: tourne son cœur vers la haine
  rationale: La formulation garde la métaphore du cœur comme siège de la disposition intérieure et la direction résultante marquée par εἰς.
- source_word: τοῦ πολεμοῦντος ἡμᾶς
  choice: de celui qui nous fait la guerre
  rationale: Le participe grec est actif et singulier. Cette traduction en conserve le caractère verbal ainsi que le référent individuel, vraisemblablement le principal adversaire.
- source_word: εἰς συντέλειαν αὐτοῦ
  choice: pour sa ruine
  rationale: Dans ce contexte, συντέλεια évoque une fin complète et funeste. « Pour sa ruine » rend naturellement la visée ou le résultat introduit par εἰς, tout en évitant de suggérer un déplacement spatial.
- source_word: τῶν ὁμονοούντων αὐτῷ
  choice: ceux qui partagent ses desseins
  rationale: Le participe désigne ceux qui sont du même avis ou poursuivent le même projet que lui. « Partagent ses desseins » est naturel et conserve ici l’idée d’une volonté commune, sans réduire le groupe à de simples alliés politiques.
theological_decisions:
- issue: Faut-il expliciter que « le lion » désigne le roi ?
  choice: Conserver « le lion » dans le texte principal
  alternative: Traduire « devant le roi »
  rationale: Le grec emploie délibérément cette image dans la prière. La remplacer par son référent ferait disparaître la tension littéraire entre la puissance menaçante du souverain et la demande adressée à Dieu.
- issue: Faut-il généraliser le singulier τοῦ πολεμοῦντος ἡμᾶς ?
  choice: 'Conserver le singulier : « celui qui nous fait la guerre »'
  alternative: Traduire « nos ennemis » ou « l’ennemi »
  rationale: Le singulier grec vise un adversaire déterminé, tandis que la proposition suivante mentionne séparément ceux qui partagent ses desseins. Le maintien de cette distinction évite d’élargir indûment le référent.
- issue: Valeur de εἰς devant συντέλειαν
  choice: Rendre la visée ou le résultat par « pour sa ruine »
  alternative: « jusqu’à sa fin », « vers sa destruction » ou « pour sa destruction »
  rationale: Le contexte appelle une issue funeste, mais le grec peut exprimer à la fois l’orientation vers cette fin et son résultat. « Pour sa ruine » restitue cette force sans prétendre trancher plus précisément entre but et résultat.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe de la prière et ses impératifs sont conservés; l’image du lion et le singulier visant l’adversaire ne sont pas explicités ni généralisés dans le texte principal.
