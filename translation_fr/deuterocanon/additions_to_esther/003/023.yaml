  source_fidelity: 'Le texte rend fidèlement les impératifs, l’image du « lion », le singulier de l’adversaire et l’issue funeste visant cet adversaire et ses partisans. Toutefois, « la haine de celui » est ambigu en français : il peut s’agir de la haine éprouvée par cet homme aussi bien que de la haine dirigée contre lui. Le grec exprime bien la seconde idée.'
  naturalness: La formulation est globalement naturelle, digne et accessible. « Tourne son cœur à haïr » est une expression claire et soutenue, adaptée à une prière, qui évite l’ambiguïté de construction présente dans le projet.
  terminology: « Lion », « celui qui nous fait la guerre », « ruine » et « ceux qui sont du même avis que lui » préservent l’imagerie et les distinctions du grec. « Sont du même avis que lui » rend ὁμονοοῦντες avec une proximité plus directe à l’idée de partager un même avis ou dessein.
