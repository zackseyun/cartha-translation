    issue: Ambiguïté de « tourne son cœur vers la haine de celui qui nous fait la guerre »
    rationale: En français, le complément « la haine de celui » peut recevoir une lecture subjective (« la haine que cet homme éprouve »), alors que μῖσος suivi du génitif vise ici la haine envers l’adversaire. Une reformulation explicite est sûre et conserve le sens.
