    rationale: ὁμονοοῦντες αὐτῷ désigne d’abord ceux qui sont du même avis ou d’un même esprit que lui. « Sont du même avis que lui » conserve cette portée sans préciser qu’il s’agit nécessairement de desseins ou de projets.
