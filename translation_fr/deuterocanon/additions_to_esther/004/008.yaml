  text: And God changed the king’s spirit to gentleness[a], and in anguish he sprang up from his throne and took her into his arms until she recovered[c][b], and he comforted her with peaceful words.
translation:
  language: fr
  text: Et Dieu changea l’esprit du roi, le portant à la douceur[a]. Saisi d’angoisse, le roi bondit de son trône, la prit dans ses bras jusqu’à ce qu’elle reprenne ses esprits[b], et la réconforta par des paroles apaisantes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les dispositions du roi » ou « l’état d’esprit du roi »; grec : « l’esprit ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « jusqu’à ce qu’elle se remette » ou « retrouve son équilibre ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « par des paroles de paix »; ou « par des paroles rassurantes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετέβαλεν
  choice: changea
  rationale: Le verbe exprime une transformation directement causée par Dieu; « changea » est clair et fidèle.
- source_word: τὸ πνεῦμα τοῦ βασιλέως
  choice: l’esprit du roi
  rationale: « Esprit » conserve la formulation grecque et l’idée de la disposition intérieure du roi sans la réduire à un phénomène purement psychologique.
- source_word: εἰς πραΰτητα
  choice: le portant à la douceur
  rationale: Cette tournure française naturelle indique le nouvel état vers lequel l’esprit du roi est orienté; πραΰτης désigne ici la douceur plutôt que la faiblesse.
- source_word: ἀγωνιάσας
  choice: saisi d’angoisse
  rationale: Le participe marque une vive détresse; cette expression en restitue la force tout en s’intégrant naturellement au récit.
- source_word: ἀνεπήδησεν
  choice: bondit
  rationale: Le verbe évoque un mouvement soudain vers le haut; « bondit de son trône » est vif et digne.
- source_word: ἀνέλαβεν αὐτὴν ἐπὶ τὰς ἀγκάλας αὐτοῦ
  choice: la prit dans ses bras
  rationale: Formulation idiomatique qui rend fidèlement le geste concret d’accueillir et de soutenir Esther dans ses bras.
- source_word: μέχρις οὗ κατέστη
  choice: jusqu’à ce qu’elle reprenne ses esprits
  rationale: Dans le contexte de son effondrement, la proposition indique qu’elle retrouve un état stable; le grec permet aussi l’idée plus générale de se remettre ou de retrouver son équilibre.
- source_word: παρεκάλει
  choice: la réconforta
  rationale: Dans ce contexte de détresse, le verbe désigne une parole consolante et rassurante.
- source_word: λόγοις εἰρηνικοῖς
  choice: par des paroles apaisantes
  rationale: Cette expression française naturelle communique l’effet pacifiant des paroles tout en maintenant leur lien sémantique avec la paix.
theological_decisions:
- issue: Action de Dieu sur la disposition intérieure du roi
  choice: Dieu changea l’esprit du roi, le portant à la douceur
  alternative: Dieu adoucit les dispositions du roi
  rationale: Le grec attribue explicitement à Dieu la transformation intérieure du roi. La traduction conserve « esprit », terme plus formel et théologiquement ouvert, tout en explicitant naturellement en français l’orientation vers la douceur.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « le roi » après la première phrase lève une possible ambiguïté référentielle créée en français par la succession de Dieu et du roi. Les trois marqueurs de note figurent dans le texte principal dans l’ordre [a], [b], [c].
