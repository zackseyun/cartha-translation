  text: For you are wonderful[a], Lord, and your face is full of grace.
translation:
  language: fr
  text: Car tu es merveilleux, Seigneur, et ton visage est plein de grâce.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θαυμαστὸς
  choice: merveilleux
  rationale: L’adjectif qualifie ce qui suscite l’émerveillement ou l’admiration. « Merveilleux » est naturel en français moderne et conserve la tonalité d’émerveillement.
- source_word: κύριε
  choice: Seigneur
  rationale: Dans cette adresse directe à Dieu, « Seigneur » est la traduction française naturelle et traditionnelle de κύριε.
- source_word: πρόσωπόν
  choice: visage
  rationale: Le sens concret est « visage ». Ce choix maintient l’image anthropomorphique du grec sans la remplacer par l’abstraction « présence ».
- source_word: χαρίτων
  choice: grâce
  rationale: Le génitif pluriel de χάρις peut évoquer les grâces, la faveur ou les qualités gracieuses. Le collectif singulier « grâce » produit ici une formulation française naturelle et digne tout en gardant la résonance du terme grec.
- source_word: μεστόν
  choice: plein de
  rationale: L’adjectif signifie « plein, rempli ». « Plein de » rend directement et naturellement la construction avec le génitif.
theological_decisions:
- issue: Langage anthropomorphique appliqué à Dieu
  choice: Conserver « ton visage »
  alternative: « ta présence »
  rationale: Le grec emploie directement πρόσωπον. La traduction préserve cette image au lieu de la résoudre en paraphrase abstraite.
- issue: Sens de χάρις dans la description de Dieu
  choice: Employer « grâce »
  alternative: « faveur » ou « qualités gracieuses »
  rationale: Le pluriel grec permet plusieurs nuances. « Grâce » reste naturel dans la tournure « plein de grâce » et conserve la densité théologique et relationnelle du mot sans imposer une interprétation plus étroite.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe suit étroitement le grec tout en restant idiomatique. Aucun appel de note n’est nécessaire, puisque les variantes lexicales n’affectent pas suffisamment le sens pour justifier une note dans ce verset très bref.
