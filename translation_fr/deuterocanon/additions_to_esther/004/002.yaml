  text: And when she had become visible[a], having called upon God, the overseer of all and Savior, she took the two maids[c][b],
translation:
  language: fr
  text: Devenue visible[a], après avoir invoqué Dieu, qui veille sur tout[b] et qui est le Sauveur, elle prit avec elle les deux servantes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devenue manifeste » ou « apparue ». Le grec évoque le fait de devenir visible ou remarquable, sans préciser en quoi.
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque peut aussi se traduire par « celui qui observe tout » ou « le Dieu qui voit tout ».
    reason: lexical_alternative
  - marker: c
    text: Il s’agit de deux jeunes femmes qui servaient personnellement Esther et l’accompagnaient.
    reason: cultural_note
lexical_decisions:
- source_word: γενηθεῖσα ἐπιφανής
  choice: devenue resplendissante
  rationale: Dans le contexte de l’apparition royale d’Esther, ἐπιφανής évoque le fait de paraître au grand jour avec éclat. « Resplendissante » rend cette visibilité remarquable sans introduire explicitement la gloire ou la célébrité.
- source_word: ἐπικαλεσαμένη
  choice: elle invoqua
  rationale: Le participe moyen désigne ici l’appel adressé à Dieu dans la prière. La coordination de verbes conjugués produit un français plus naturel tout en conservant l’action antérieure à la prise des servantes.
- source_word: τὸν πάντων ἐπόπτην θεὸν
  choice: Dieu, celui qui veille sur tous
  rationale: ἐπόπτης désigne celui qui observe, surveille ou veille. Cette formulation française exprime clairement l’étendue universelle de cette vigilance sans employer « surveillant », qui aurait des connotations modernes inappropriées.
- source_word: σωτῆρα
  choice: le Sauveur
  rationale: σωτήρ est un titre religieux élevé qui signifie « sauveur » ou « libérateur ». « Le Sauveur » en préserve la force nominale.
- source_word: παρέλαβεν
  choice: prit avec elle
  rationale: Dans ce contexte de déplacement, παραλαμβάνω signifie prendre quelqu’un avec soi plutôt que simplement saisir ou recevoir.
- source_word: τὰς δύο ἅβρας
  choice: les deux servantes
  rationale: ἅβρα désigne ici de jeunes femmes attachées au service personnel d’Esther. « Servantes » est naturel, digne et compréhensible en français moderne.
theological_decisions:
- issue: Rapport entre ἐπόπτην, θεὸν et σωτῆρα
  choice: Dieu, celui qui veille sur tous et le Sauveur
  alternative: Dieu qui voit tout et qui sauve
  rationale: 'La formulation retenue maintient les deux désignations nominales appliquées au même Dieu : sa vigilance universelle et son rôle de Sauveur. Elle évite de réduire σωτήρ à une simple action verbale.'
translation_notes:
  register: Français international moderne, narratif et digne. « Resplendissante » convient au cadre royal tout en laissant une note expliquer l’éventail sémantique. La syntaxe participiale grecque est légèrement restructurée pour éviter une accumulation lourde de participes en français.
