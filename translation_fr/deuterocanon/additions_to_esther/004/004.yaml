lexical_decisions:
- source_word: ἑτέρα
  choice: une autre
  rationale: Le féminin singulier désigne une autre femme, comprise dans le contexte comme une autre accompagnatrice.
- source_word: ἐπηκολούθει
  choice: la suivait
  rationale: L’imparfait exprime une action en cours ; le pronom objet explicite naturellement en français la personne suivie, Esther, sans modifier le sens.
- source_word: κουφίζουσα
  choice: en soulevant
  rationale: Le participe de κουφίζω évoque le fait d’alléger ou de soulager un poids. Appliqué à une tenue, « en soulevant » rend concrètement et naturellement le geste, tout en laissant ouverte la nuance d’allègement.
- source_word: τὴν ἔνδυσιν αὐτῆς
  choice: sa tenue
  rationale: ἔνδυσις désigne ce dont une personne est vêtue. « Sa tenue » est courant, digne et suffisamment général ; le possessif renvoie à Esther.
- source_word: καὶ αὐτὴ
  choice: et elle
  rationale: La proposition demeure inachevée dans ce segment ; la traduction conserve cette suspension sans ajouter la suite.
