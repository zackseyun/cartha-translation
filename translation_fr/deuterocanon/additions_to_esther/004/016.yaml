  text: And the king was troubled[a], and all his attendants were comforting her.
translation:
  language: fr
  text: Le roi était troublé, et toute sa suite la réconfortait.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’encourageait » ou « l’exhortait ». Le verbe grec peut exprimer le réconfort, l’encouragement ou l’exhortation.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταράσσετο
  choice: était bouleversé
  rationale: L’imparfait exprime un trouble intérieur en cours. « Était bouleversé » rend naturellement l’intensité émotionnelle sans aller jusqu’à la panique.
- source_word: πᾶσα ἡ θεραπεία αὐτοῦ
  choice: tous ceux de sa suite
  rationale: Dans ce cadre royal, le nom collectif θεραπεία désigne les personnes attachées au service du roi. Cette formulation est claire en français moderne et conserve l’idée de la totalité de son entourage de service.
- source_word: παρεκάλει αὐτήν
  choice: la réconfortaient
  rationale: παρακαλέω peut signifier exhorter, encourager ou consoler. Dans la scène, « réconfortaient » convient au soutien apporté à Esther, tout en signalant en note l’autre nuance possible.
- source_word: καί
  choice: tandis que
  rationale: La coordination grecque relie deux actions simultanées. « Tandis que » explicite naturellement cette relation en français sans modifier le contenu de la scène.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et fluide. « Ceux de sa suite » évite le caractère administratif de « préposés » et l’ambiguïté possible de « courtisans ».
