  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν δὲ τῷ διαλέγεσθαι αὐτήν
  choice: Pendant qu’elle parlait
  rationale: La construction ἐν τῷ avec l’infinitif exprime la simultanéité. « Parlait » rend naturellement διαλέγεσθαι dans ce contexte, sans surinterpréter la nature de la parole.
- source_word: ἔπεσεν
  choice: elle tomba
  rationale: Rend directement l’aoriste de πίπτω et conserve l’image concrète de la chute.
- source_word: ἀπὸ ἐκλύσεως
  choice: défaillante
  rationale: ἐκλύσις désigne ici l’épuisement ou la perte de forces causant la chute. La tournure française évite le peu naturel « tomba de défaillance » tout en préservant le rapport causal.
