  text: And he said to him[a], “I saw you, lord, like an angel of God, and my heart was troubled with fear because of your glory.”
translation:
  language: fr
  text: 'Et il lui dit : « Je t’ai vu, seigneur, comme un ange de Dieu[a], et mon cœur a été bouleversé par la crainte que m’inspirait ta gloire. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tel un ange de Dieu ». Le grec peut exprimer une comparaison nuancée, sans nécessairement identifier le roi à un ange.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶδόν
  choice: Je t’ai vu
  rationale: L’aoriste de ὁράω désigne ici une perception passée; le passé composé est naturel en français dans ce discours direct.
- source_word: κύριε
  choice: seigneur
  rationale: Il s’agit d’une adresse honorifique au roi, non d’un titre divin; la minuscule évite une identification avec Dieu.
- source_word: ὡς
  choice: comme
  rationale: Comme exprime naturellement la comparaison en français tout en laissant subsister la nuance possible de « en tant que / tel » portée par ὡς.
- source_word: ἄγγελον θεοῦ
  choice: un ange de Dieu
  rationale: Le groupe sans article se comprend naturellement de manière indéfinie, et ange convient à l’éclat céleste évoqué.
- source_word: ἐταράχθη ἡ καρδία μου
  choice: mon cœur a été bouleversé
  rationale: Cette formulation conserve l’image anthropologique grecque du cœur et rend la forte agitation intérieure indiquée par ταράσσω.
- source_word: ἀπὸ φόβου τῆς δόξης σου
  choice: par la crainte que m’inspirait ta gloire
  rationale: Cette tournure française rend la crainte comme cause du bouleversement et la gloire du roi comme source de cette crainte, sans lourdeur syntaxique.
theological_decisions:
- issue: Référent de κύριε
  choice: « seigneur » avec une minuscule, désignant le roi
  alternative: « Seigneur » avec une majuscule, pouvant évoquer Dieu
  rationale: Le contexte immédiat est la réaction d’Esther devant le roi; la minuscule préserve la valeur honorifique sans suggérer un référent divin.
- issue: Nature de la comparaison introduite par ὡς
  choice: « comme un ange de Dieu »
  alternative: « tel un ange de Dieu » ou « en ange de Dieu »
  rationale: Le texte compare l’apparence majestueuse du roi à celle d’un ange sans l’identifier explicitement comme tel; la note conserve l’amplitude sémantique de ὡς.
translation_notes:
  register: Français moderne, international et digne. Le discours direct reste naturel; « seigneur » garde la déférence de l’adresse royale, tandis que « bouleversé » rend avec force l’agitation intérieure.
