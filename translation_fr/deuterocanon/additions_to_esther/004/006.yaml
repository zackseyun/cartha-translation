  text: And after she had gone in through all the doors[a], she stood before the king; and he was sitting on the throne of his kingdom[b], and was clothed in all the splendor of his majesty.
translation:
  language: fr
  text: Après avoir franchi toutes les portes[a], elle se tint devant le roi. Celui-ci était assis sur le trône de son royaume et était revêtu de toute sa tenue d’apparat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « toutes les entrées » : dans le cadre du palais, le mot grec peut désigner des portes ou des passages successifs.'
    reason: lexical_alternative
  - marker: b
    text: Le texte grec fourni s’interrompt au milieu du dernier verbe. Le sens « était revêtu » est très probable, mais la forme complète du mot n’est pas conservée dans cet extrait.
    reason: textual_variant
lexical_decisions:
- source_word: εἰσελθοῦσα
  choice: Après avoir franchi
  rationale: Le participe aoriste a ici une valeur temporelle et décrit le mouvement qui précède l’action principale. Avec « les portes », « franchir » est plus naturel en français que « entrer par ».
- source_word: πάσας τὰς θύρας
  choice: toutes les portes
  rationale: θύρα désigne normalement une porte, mais peut évoquer ici les entrées successives du palais. La traduction conserve le pluriel et la totalité exprimée par πάσας.
- source_word: κατέστη ἐνώπιον τοῦ βασιλέως
  choice: elle se tint devant le roi
  rationale: κατέστη indique qu’elle vient prendre position et demeure debout devant le roi. « Se tint » convient au cadre solennel de la cour.
- source_word: θρόνου τῆς βασιλείας αὐτοῦ
  choice: le trône de son royaume
  rationale: Cette formulation conserve le rapport génitif du grec et évite de réduire l’expression au simple adjectif « royal ».
- source_word: πᾶσαν στολὴν τῆς ἐπιφανείας αὐτοῦ
  choice: toute sa tenue d’apparat
  rationale: στολή désigne une tenue ou un vêtement, tandis que ἐπιφάνεια évoque ici l’apparence éclatante et solennelle du roi. « Tenue d’apparat » rend naturellement l’ensemble sans donner à ἐπιφάνεια un sens théologique technique.
- source_word: ἐνεδεΒ
  choice: avait revêtu
  rationale: La forme transmise est manifestement tronquée, mais son début et la construction avec στολή indiquent très probablement un verbe signifiant « revêtir » ou « être vêtu ». Le plus-que-parfait français s’accorde avec l’état du roi au moment où Esther paraît devant lui.
