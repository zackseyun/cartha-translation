  text: And he said to her[a], “What is it, Esther? I am your brother[b]; take courage.”
translation:
  language: fr
  text: 'Et il lui dit : « Qu’y a-t-il, Esther ?[a] Je suis ton frère[b] ; prends courage. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qu’as-tu, Esther ? »'
    reason: Variante idiomatique possible de la question grecque Τί ἐστιν.
  - marker: b
    text: 'Ou : « Je suis ton proche parent », si le terme est pris dans un sens plus large que celui de frère au sens strict.'
    reason: Le grec ἀδελφός signifie littéralement « frère », mais peut, selon le contexte, désigner plus largement un membre de la parenté.
lexical_decisions:
- source_word: Τί ἐστιν
  choice: Qu’y a-t-il ?
  rationale: Cette tournure française naturelle rend directement la question idiomatique grecque sans en préciser excessivement le sens.
- source_word: ἀδελφός
  choice: frère
  rationale: Le grec dit littéralement « frère ». Le terme pouvant parfois désigner plus largement un proche parent, cette possibilité est signalée en note plutôt qu’imposée dans le texte.
- source_word: θάρσει
  choice: prends courage
  rationale: Cette formulation moderne et idiomatique conserve la force de l’impératif grec, qui appelle Esther à reprendre confiance.
- source_word: ἐγὼ ὁ ἀδελφός σου
  choice: Je suis ton frère
  rationale: Une proposition complète restitue naturellement en français le pronom explicite et le groupe nominal grecs, avec leur valeur rassurante et emphatique.
theological_decisions:
- issue: Désignation familiale du locuteur par rapport à Esther
  choice: Conserver « frère » dans le texte principal
  alternative: Traduire plus largement par « proche parent » ou « parent »
  rationale: Le grec emploie explicitement le mot « frère ». La traduction maintient cette désignation sans trancher si elle décrit ici un frère au sens strict ou une parenté plus large.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement convient à la proximité exprimée par « ton frère ». La ponctuation maintient le mouvement direct et rassurant de la parole.
