lexical_decisions:
- source_word: ἐτηρείδετο
  choice: était gardée
  rationale: L’imparfait à valeur passive exprime une situation qui se prolongeait. « Gardée » conserve l’ambiguïté entre protection, surveillance et maintien dans une certaine condition.
- source_word: τρυφερευομένη
  choice: comme une femme élevée dans le luxe
  rationale: Le participe évoque une vie délicate et luxueuse. Cette formulation française naturelle rend ici la manière dont la femme était traitée, sans réduire le sens à la seule idée d’être gâtée.
- source_word: καὶ τῇ μὲν μιᾷ ... ἡ δὲ
  choice: Et l’une… tandis que l’autre—
  rationale: La construction corrélative oppose deux femmes ou deux parties. La seconde proposition étant inachevée dans le segment grec fourni, le tiret préserve cette ouverture sans restituer des mots absents.
