  yaml_path: translation/deuterocanon/additions_to_esther/004/001.yaml
  text: And it happened on the third day[a], when she had stopped praying, that she took off the garments of her service and put on her splendor[b];
translation:
  language: fr
  text: Le troisième jour, quand elle eut fini de prier, elle ôta ses vêtements de service[a] et revêtit sa splendeur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses vêtements de dévotion » ou « les vêtements qu’elle portait pour servir ». Le grec peut désigner le service, l’assistance ou une pratique dévotionnelle.
    reason: lexical_alternative
  - marker: b
    text: Ou « sa gloire ». Il s’agit probablement ici de sa magnifique tenue royale ou de son éclat royal.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγενήθη
  choice: Le troisième jour
  rationale: La formule narrative introduit l’événement. En français moderne, elle peut rester implicite devant l’indication temporelle sans perte de sens ni tournure archaïque.
- source_word: ἐν τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: le troisième jour
  rationale: Rendu temporel idiomatique et direct.
- source_word: ὡς ἐπαύσατο προσευχομένη
  choice: quand elle eut fini de prier
  rationale: Le passé antérieur marque l’achèvement de la prière avant les actions suivantes; « finit de prier » est ici plus naturel que « cessa de prier ».
- source_word: ἐξεδύσατο τὰ ἱμάτια
  choice: elle ôta ses vêtements
  rationale: Expression française claire et digne pour l’action d’enlever des vêtements.
- source_word: τῆς θεραπείας
  choice: de service
  rationale: θεραπεία peut désigner le service, l’assistance ou une pratique dévotionnelle. « De service » conserve cette largeur sémantique sans imposer un cadre liturgique précis.
- source_word: περιεβάλετο
  choice: revêtit
  rationale: Verbe naturel dans un registre narratif soutenu, qui exprime directement l’action de se vêtir.
- source_word: τὴν δόξαν αὐτῆς
  choice: sa splendeur
  rationale: Dans le contexte d’un changement de tenue avant de paraître devant le roi, δόξα évoque vraisemblablement l’éclat visible de sa parure royale; « splendeur » garde aussi la force figurée du grec.
theological_decisions:
- issue: Sens de τῆς θεραπείας dans le changement de vêtements d’Esther
  choice: vêtements de service
  alternative: vêtements de dévotion / vêtements portés pour servir
  rationale: Le grec ne précise pas si ce service relève de l’assistance, du culte ou de la pratique dévotionnelle. Le texte principal demeure large et une note signale l’ambiguïté.
- issue: Sens de τὴν δόξαν αὐτῆς
  choice: sa splendeur
  alternative: sa gloire
  rationale: Le contexte vestimentaire favorise l’idée d’une magnificence royale visible, mais « gloire » reste une traduction littérale possible et est conservée en note.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation évite l’archaïsme « il advint » tout en conservant l’enchaînement solennel de la scène. Les deux ambiguïtés lexicales importantes sont signalées par des notes placées sur les expressions concernées.
