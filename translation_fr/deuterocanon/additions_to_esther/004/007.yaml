  yaml_path: translation/deuterocanon/additions_to_esther/004/007.yaml
  text: '...entirely covered with gold and costly stones, and he was very terrifying. And lifting up his face, blazing with splendor at the height of anger, he looked; and the queen fell and changed color in faintness, and she bent down upon the head of the delicate maidservant who was going before her.'
translation:
  language: fr
  text: … tout entier couvert d’or et de pierres précieuses[a], il était terrifiant au plus haut point. Puis il releva son visage, embrasé de majesté au paroxysme de la colère, et regarda. La reine s’effondra ; elle changea de couleur en défaillant[b] et se pencha sur la tête de la servante délicate[c] qui marchait devant elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec fourni commence au milieu d’une description. Les points de suspension signalent cette lacune, sans restituer une formule telle que « il était vêtu ».
    reason: textual_variant
  - marker: b
    text: 'Ou : « son teint changea tandis qu’elle défaillait ».'
    reason: lexical_alternative
  - marker: c
    text: Le mot grec peut désigner une servante personnelle ou une dame de compagnie.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅλος διὰ χρυσοῦ καὶ λίθων πολυτελῶν
  choice: tout entier couvert d’or et de pierres précieuses
  rationale: Le grec conservé est elliptique et décrit une apparence entièrement parée de matériaux somptueux. « Couvert de » rend la scène intelligible sans préciser un vêtement absent du segment transmis.
- source_word: φοβερὸς σφόδρα
  choice: terrifiant au plus haut point
  rationale: Cette formulation conserve la forte intensité de σφόδρα et l’effet de terreur exprimé par φοβερός.
- source_word: ἄρας τὸ πρόσωπον αὐτοῦ
  choice: il releva son visage
  rationale: Rend le mouvement corporel concret exprimé par αἴρω avec πρόσωπον, sans le réduire au simple fait de regarder vers le haut.
- source_word: πεπυρωμένον δόξῃ
  choice: embrasé de majesté
  rationale: « Embrasé » préserve l’image ardente du participe πεπυρωμένον, tandis que « majesté » convient ici à la splendeur royale de δόξα.
- source_word: ἐν ἀκμῇ θυμοῦ
  choice: au paroxysme de la colère
  rationale: ἀκμή désigne le point culminant ou la pleine intensité ; « au paroxysme » exprime cette idée avec naturel en français.
- source_word: μετέβαλε τὸ χρῶμα αὐτῆς ἐν ἐκλύσει
  choice: elle changea de couleur en défaillant
  rationale: La traduction conserve à la fois le changement visible du teint et l’affaiblissement allant jusqu’à la défaillance.
- source_word: κατέκυψεν
  choice: s’affaissa
  rationale: Le verbe décrit un mouvement vers le bas. « S’affaissa » s’accorde avec l’effondrement physique de la reine sans suggérer un geste volontaire de révérence.
- source_word: ἅβρας
  choice: servante
  rationale: Dans ce contexte, le substantif désigne une servante ou dame de compagnie. Le français « servante » est naturel et évite l’étrange calque « servante délicate ».
- source_word: τῆς προπορευομένης
  choice: qui marchait devant elle
  rationale: Le participe indique que la servante précédait la reine, vraisemblablement dans la marche ou la procession.
theological_decisions:
- issue: Début fragmentaire ou elliptique du segment grec transmis
  choice: Signaler la lacune par des points de suspension et ne traduire que les mots conservés.
  alternative: Restituer dans le texte « il était vêtu » ou une autre expression analogue.
  rationale: Le témoin fourni commence au milieu d’une description. Une restitution silencieuse ferait passer une conjecture pour un élément assuré du texte.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche du grec tout en évitant les calques les moins naturels. L’intensité dramatique et l’ambiguïté du début lacunaire sont conservées.
