  text: blushing in the full bloom of her beauty[a], and her face was cheerful as if affectionate[b], but her heart was constricted from fear.
translation:
  language: fr
  text: rougissante dans tout l’éclat de sa beauté[a] ; son visage était rayonnant, comme empreint d’affection[b], mais son cœur était serré par la peur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « rougissante au sommet de sa beauté ». Le grec associe l’idée de rougir à celle d’une beauté parvenue à son plein épanouissement.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « comme agréable » ou « comme aimé ». Le grec peut évoquer un visage avenant, agréable ou cher, et conserve ici une comparaison.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρυθριῶσα
  choice: rougissante
  rationale: Le participe présent décrit une rougeur visible. « Rougissante » conserve cette image corporelle sans préciser si elle vient de la pudeur, de l’émotion ou d’une autre cause.
- source_word: ἀκμῇ κάλλους αὐτῆς
  choice: dans tout l’éclat de sa beauté
  rationale: ἀκμή désigne ici le plein épanouissement ou le sommet de la beauté. Cette tournure française est naturelle et exprime une beauté arrivée à son plein éclat.
- source_word: ἱλαρόν
  choice: rayonnant
  rationale: Appliqué au visage, ἱλαρός évoque une expression gaie, lumineuse et avenante. « Rayonnant » convient naturellement au français tout en maintenant le contraste avec l’état intérieur.
- source_word: ὡς προσφιλές
  choice: comme aimable
  rationale: προσφιλής peut signifier aimé, cher, agréable ou aimable, et ὡς conserve une nuance comparative. La formulation volontairement inhabituelle garde cette comparaison sans réduire le sens à une simple émotion.
- source_word: ἀπεστενωμένη
  choice: était serré
  rationale: Le participe exprime l’idée d’être resserré ou comprimé. « Le cœur était serré » restitue en français l’image physique et la détresse intérieure.
- source_word: ἀπὸ τοῦ φόβου
  choice: par la peur
  rationale: ἀπό indique ici la source ou la cause de cet état. « Par la peur » est idiomatique et fidèle.
