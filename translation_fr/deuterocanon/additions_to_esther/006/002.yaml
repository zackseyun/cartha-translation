  text: For I remembered the dream that I saw concerning these matters[a], for not a word of them has passed by.
translation:
  language: fr
  text: Car je me suis souvenu du rêve que j’avais fait au sujet de ces événements[a], car pas un mot de tout cela n’a été laissé de côté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « pas un mot n’est passé d’eux ». La formule grecque est elliptique; elle peut indiquer qu’aucun détail n’a été omis, ou, selon le contexte, qu’aucun élément du rêve n’est resté sans effet.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμνήσθην
  choice: je me suis souvenu
  rationale: La forme aoriste, de sens actif, exprime naturellement le rappel d’un rêve antérieur.
- source_word: ἐνυπνίου
  choice: rêve
  rationale: Le nom désigne simplement un rêve; « vision » ajouterait une précision absente du grec.
- source_word: περὶ τῶν λόγων τούτων
  choice: au sujet de ces événements
  rationale: Dans ce contexte rétrospectif, λόγοι renvoie vraisemblablement aux faits annoncés par le rêve plutôt qu’à de simples paroles.
- source_word: οὐδὲ γὰρ παρῆλθεν ἀπʼ αὐτῶν λόγος
  choice: pas un seul élément ne s’en est trouvé sans accomplissement
  rationale: La tournure grecque, très concise, indique qu’aucun élément du rêve n’est passé ou n’a manqué; cette formulation française rend le sens événementiel sans réduire λόγος à une parole prononcée.
theological_decisions:
- issue: Portée de οὐδὲ γὰρ παρῆλθεν ἀπʼ αὐτῶν λόγος
  choice: Aucun élément du rêve ne s’est trouvé sans accomplissement.
  alternative: Pas un mot n’en est passé.
  rationale: Le contexte suggère l’accomplissement des éléments du rêve, mais l’expression grecque demeure concise et littéralement construite autour de « passer »; la note conserve cette ambiguïté.
translation_notes:
  register: Français moderne, courant et digne. « Je me suis souvenu » respecte l’aspect ponctuel de l’aoriste; « que j’avais eu » est idiomatique pour un rêve antérieur. La répétition causale de γάρ est rendue par les deux-points afin d’éviter un enchaînement lourd de deux « car » en français.
