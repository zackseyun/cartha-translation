  yaml_path: translation/deuterocanon/additions_to_esther/006/011.yaml
  text: In the fourth year of the reign of Ptolemy and Cleopatra[a], Dositheus, who said that he was a priest and a Levite, and Ptolemy his son, brought in the following letter of the Purim festival, which they said also existed and had been translated by Lysimachus son of Ptolemy[b], one of those in Jerusalem.
translation:
  language: fr
  text: La quatrième année du règne de Ptolémée et de Cléopâtre, Dosithée, qui disait être prêtre et lévite, et son fils Ptolémée apportèrent la lettre présentée ici concernant la fête de Pourim[a], dont ils dirent qu’elle existait et que Lysimaque, fils de Ptolémée, l’avait traduite[b], l’un de ceux qui étaient à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des Phrouraia », désignation grecque employée ici pour la fête juive de Pourim.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « dont ils affirmèrent l’existence et dirent que Lysimaque, fils de Ptolémée, l’avait traduite ». La formulation grecque est concise et peut mettre l’accent sur l’existence ou la disponibilité du document plutôt que sur son authenticité.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔτους τετάρτου Βασιλεύοντος Πτολεμαίου καὶ Κλεοπάτρας
  choice: La quatrième année du règne de Ptolémée et de Cléopâtre
  rationale: Cette formulation française naturelle conserve la formule chronologique grecque et présente Ptolémée et Cléopâtre comme les souverains en exercice.
- source_word: εἰσήνεγκεν
  choice: apportèrent
  rationale: Le verbe signifie « apporter, introduire ». Le pluriel est requis en français par les deux sujets coordonnés, bien que le grec emploie formellement un singulier.
- source_word: ὃς ἔφη εἶναι ἱερεὺς καὶ Λευείτης
  choice: qui disait être prêtre et lévite
  rationale: « Disait être » rapporte sobrement l’affirmation de Dosithée sans lui donner artificiellement une nuance sceptique. La coordination inhabituelle des deux titres est maintenue.
- source_word: τὴν προκειμένην ἐπιστολὴν
  choice: la lettre présentée ici
  rationale: προκειμένην désigne le document placé devant le lecteur. « Présentée ici » convient mieux à ce colophon que « suivante », puisque la note vient à la fin du livre.
- source_word: τῶν Φρουραίων
  choice: sur la fête de Pourim
  rationale: Le terme grec désigne ici la fête juive de Pourim. Le référent est rendu clairement dans le texte, tandis que la forme grecque est signalée en note.
- source_word: ἣν ἔφασαν εἶναι
  choice: Ils dirent qu’elle existait
  rationale: La tournure grecque est très concise. « Existait » exprime la disponibilité ou l’existence du document sans introduire la notion plus forte d’authenticité.
- source_word: καὶ ἑρμηνευκέναι Λυσίμαχον Πτολεμαίου
  choice: et que Lysimaque, fils de Ptolémée, l’avait traduite
  rationale: Dans ce contexte documentaire, ἑρμηνεύω signifie vraisemblablement « traduire », et le génitif Πτολεμαίου indique naturellement la filiation.
- source_word: τῶν ἐν Ἰερουσαλήμ
  choice: celui-ci était de ceux qui se trouvaient à Jérusalem
  rationale: Cette formulation restitue le pluriel substantivé grec, « ceux qui étaient à Jérusalem », tout en rattachant clairement l’expression à Lysimaque.
theological_decisions:
- issue: Valeur de ἔφη dans l’auto-identification de Dosithée
  choice: qui disait être
  alternative: qui prétendait être
  rationale: Le verbe peut parfois suggérer une prise de distance, mais rien n’impose ici une nuance de soupçon. La traduction choisie demeure neutre.
- issue: Identification des Φρουραῖα
  choice: la fête de Pourim
  alternative: les Phrouraia
  rationale: Le terme appartient à la désignation grecque de Pourim dans la tradition d’Esther. Nommer la fête dans le texte permet sa compréhension sans imposer d’interprétation doctrinale.
- issue: Sens de ἣν ἔφασαν εἶναι
  choice: Ils dirent qu’elle existait
  alternative: Ils dirent qu’elle était authentique
  rationale: Le grec affirme au minimum l’existence ou la disponibilité de la lettre. Traduire par « authentique » trancherait une ambiguïté que le texte ne résout pas explicitement.
translation_notes:
  register: 'Français international moderne, clair et digne. La syntaxe longue du colophon grec est divisée en deux phrases pour améliorer la lisibilité. Les noms suivent les formes françaises usuelles : Ptolémée, Cléopâtre, Dosithée et Lysimaque.'
