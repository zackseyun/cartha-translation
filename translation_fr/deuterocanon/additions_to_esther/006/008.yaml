  text: And these two lots came at the hour and appointed time[a], and at the day of judgment before God and all the nations,
translation:
  language: fr
  text: Et ces deux lots arrivèrent à l’heure et au moment fixé[a], au jour du jugement, devant Dieu et toutes les nations,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au temps opportun ». Le grec associe « l’heure » au « moment favorable ou fixé ». « Lots » peut aussi évoquer ici les sorts, les destins ou les parts attribuées.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δύο κλῆροι οὗτοι
  choice: ces deux lots
  rationale: « Lots » conserve l’image concrète de ce qui est attribué ou déterminé par tirage au sort, sans imposer le sens plus interprétatif de « destins ».
- source_word: ἦλθον
  choice: arrivèrent
  rationale: L’aoriste de ἔρχομαι indique simplement qu’ils parvinrent au moment en question. « Arrivèrent » est naturel en français et n’ajoute pas l’idée qu’ils auraient été jetés ou seraient tombés.
- source_word: εἰς ὥραν καὶ καιρόν
  choice: à l’heure et au moment fixé
  rationale: 'La formulation garde les deux termes grecs : ὥρα désigne l’heure, tandis que καιρός évoque ici le moment opportun ou fixé.'
- source_word: εἰς ἡμέραν κρίσεως
  choice: au jour du jugement
  rationale: κρίσις désigne ici le jugement ou la décision judiciaire; cette expression française est solennelle et idiomatique.
- source_word: ἐνώπιον τοῦ θεοῦ καὶ πᾶσι τοῖς ἔθνεσιν
  choice: devant Dieu et toutes les nations
  rationale: « Devant » rend ἐνώπιον et porte naturellement sur les deux groupes coordonnés, sans répéter une préposition absente devant le second.
theological_decisions:
- issue: Portée de κλῆροι
  choice: Maintenir l’image littérale des « lots » tout en signalant sa possible portée figurée.
  alternative: Traduire directement par « destins », « sorts » ou « parts attribuées ».
  rationale: Le passage peut investir les lots d’une signification providentielle ou judiciaire, mais le grec conserve l’image concrète. La traduction ne tranche donc pas silencieusement en faveur d’une interprétation.
- issue: Relation syntaxique de « toutes les nations » avec ἐνώπιον
  choice: Faire porter « devant » à la fois sur Dieu et sur toutes les nations.
  alternative: Répéter « devant » ou laisser « toutes les nations » sans relation syntaxique claire.
  rationale: La coordination grecque permet de comprendre les nations en parallèle avec Dieu. Une seule occurrence de « devant » respecte cette structure tout en restant claire en français.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La phrase conserve la cadence solennelle du grec ainsi que sa virgule finale implicite dans un passage qui se poursuit.
