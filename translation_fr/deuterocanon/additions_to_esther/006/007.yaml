  text: For this reason he made two lots[a], one for the people of God and one for all the nations;
translation:
  language: fr
  text: C’est pourquoi il fit deux sorts, l’un pour le peuple de Dieu et l’autre pour toutes les nations[a] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tous les non-Juifs ». Le mot grec peut désigner les nations en général, notamment lorsqu’elles sont mises en contraste avec le peuple de Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Cette tournure française naturelle conserve la valeur causale et conséquentielle du grec.
- source_word: ἐποίησεν
  choice: il fit
  rationale: Le verbe signifie simplement « faire ». Cette traduction reste proche du grec sans introduire l’idée plus précise de tirer ou de jeter les sorts.
- source_word: κλήρους δύο
  choice: deux sorts
  rationale: Dans ce contexte, κλῆρος désigne un sort servant à déterminer une issue ou une attribution ; le nombre deux structure explicitement l’opposition.
- source_word: ἕνα τῷ λαῷ τοῦ θεοῦ
  choice: l’un pour le peuple de Dieu
  rationale: Cette formulation reproduit clairement et naturellement la construction grecque ainsi que son premier terme contrastif.
- source_word: ἕνα πᾶσι τοῖς ἔθνεσιν
  choice: l’autre pour toutes les nations
  rationale: « Nations » préserve le sens collectif général de ἔθνη, tout en laissant perceptible son opposition contextuelle au peuple de Dieu.
theological_decisions:
- issue: Sens de ἔθνεσιν en contraste avec le peuple de Dieu
  choice: toutes les nations
  alternative: tous les non-Juifs
  rationale: Le grec peut désigner les nations en général ou, dans ce contraste juif, les non-Juifs. Le texte principal conserve le terme plus large et la note signale la lecture contextuelle possible sans la rendre obligatoire.
translation_notes:
  register: Français moderne, international et digne. La syntaxe parallèle « l’un… l’autre… » rend explicitement les deux ἕνα du grec. Le point-virgule final est conservé afin de respecter le caractère continu du passage.
