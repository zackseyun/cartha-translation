  text: but the nations had assembled to destroy the name of the Jews[a][b].
translation:
  language: fr
  text: mais les nations s’étaient rassemblées pour faire disparaître le nom des Juifs[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avaient été rassemblées ». Le participe grec est de forme passive.
    reason: lexical_alternative
  - marker: b
    text: « Faire disparaître le nom » est une expression biblique qui peut signifier effacer le souvenir d’un peuple ou mettre fin à son existence.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη
  choice: les nations
  rationale: Dans ce contexte, le terme désigne les peuples non juifs. « Les nations » est naturel en français biblique moderne et évite la coloration plus marquée de « les païens ».
- source_word: ἐπισυναχθέντα
  choice: s’étaient rassemblées
  rationale: Le participe est passif par la forme, mais le pronominal français exprime naturellement le rassemblement collectif sans préciser qui l’a provoqué. La possibilité d’un véritable passif est signalée en note.
- source_word: ἀπολέσαι
  choice: pour faire disparaître
  rationale: L’infinitif exprime le but. Avec « le nom », « faire disparaître » restitue plus naturellement en français la visée d’effacement tout en conservant l’image grecque.
- source_word: τὸ ὄνομα
  choice: le nom
  rationale: Le maintien de « nom » préserve l’image et l’idiome bibliques, qui peuvent évoquer l’effacement de la mémoire ou de l’existence continue d’un peuple.
- source_word: Ἰουδαίων
  choice: des Juifs
  rationale: Dans Esther, le terme désigne conventionnellement le peuple juif; « les Juifs » est la formulation française standard et claire.
theological_decisions:
- issue: Portée idiomatique de « faire disparaître le nom des Juifs »
  choice: Conserver « le nom » dans le texte principal.
  alternative: « effacer jusqu’au souvenir des Juifs » ou « exterminer les Juifs »
  rationale: L’expression vise probablement l’anéantissement de leur mémoire et de leur existence comme peuple, mais garder l’image du « nom » préserve la formulation grecque et sa tension sans la réduire à une seule explicitation.
translation_notes:
  register: Français international moderne, naturel et digne. Le plus-que-parfait rend l’antériorité narrative; « s’étaient rassemblées » reste idiomatique tout en laissant en note la valeur passive formelle du grec.
