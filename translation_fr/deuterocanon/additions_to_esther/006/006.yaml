base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/006/006.yaml
  text: But my people—that is[a], Israel—are those who cried out to God and were saved. And the Lord saved his people, and the Lord rescued us from all these evils, and God did the signs and the great wonders that have not happened among the nations.
translation:
  language: fr
  text: 'Mais mon peuple — c’est Israël — : ce sont ceux qui ont appelé Dieu à l’aide[a] et ont été sauvés. Le Seigneur a sauvé son peuple, et le Seigneur nous a délivrés de tous ces maux. Dieu a accompli les signes et les grands prodiges qui ne se sont pas produits parmi les nations.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui se sont tournés vers Dieu pour obtenir de l’aide ». La construction grecque est inhabituelle; dans ce contexte, elle indique qu’Israël a sollicité l’aide de Dieu et a été délivré par lui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνος
  choice: peuple
  rationale: Dans « mon peuple », le terme désigne la collectivité identifiée à Israël; « peuple » convient mieux que « nation » et n’évoque pas un État moderne.
- source_word: οὗτός ἐστιν Ἰσραήλ
  choice: c’est Israël
  rationale: Cette formulation française naturelle conserve l’identification explicite et emphatique du peuple du locuteur avec Israël.
- source_word: οἱ βοηθήσαντες πρὸς τὸν θεόν
  choice: ceux qui ont appelé Dieu à l’aide
  rationale: La construction grecque est inhabituelle. Le contexte montre qu’Israël sollicite l’aide de Dieu avant d’être sauvé, et non qu’il apporte de l’aide à Dieu.
- source_word: σωθέντες / ἔσωσεν
  choice: ont été sauvés / a sauvé
  rationale: La répétition de la même famille verbale en français préserve le lien lexical et thématique du grec.
- source_word: ἐρρύσατο
  choice: a délivrés
  rationale: « Délivrer de » exprime naturellement le fait d’arracher à des dangers tout en distinguant ce verbe de σῴζω.
- source_word: τῶν κακῶν τούτων
  choice: tous ces maux
  rationale: « Maux » conserve l’étendue de κακά, qui peut englober les malheurs, les dangers et les actes mauvais évoqués par le contexte.
- source_word: σημεῖα καὶ τὰ τέρατα τὰ μεγάλα
  choice: les signes et les grands prodiges
  rationale: Couple biblique français courant qui maintient la distinction entre σημεῖα et τέρατα ainsi que l’intensification par μεγάλα.
- source_word: ἃ οὐ γέγονεν ἐν τοῖς ἔθνεσιν
  choice: qui ne se sont pas produits parmi les nations
  rationale: Cette traduction conserve la négation, la valeur résultative du parfait et le contraste entre Israël et les nations sans ajouter « jamais » ou « aucune ».
- source_word: κύριος
  choice: Seigneur
  rationale: Le texte grec porte κύριος; « Seigneur » le traduit directement sans substituer la typographie réservée au nom divin hébreu.
theological_decisions:
- issue: Sens de βοηθήσαντες πρὸς τὸν θεόν
  choice: Israël a appelé Dieu à l’aide.
  alternative: Israël s’est tourné vers Dieu pour obtenir de l’aide.
  rationale: Une traduction mot à mot suggérant qu’Israël aurait aidé Dieu serait trompeuse. Le salut mentionné aussitôt après indique un appel adressé à Dieu en vue d’une délivrance.
- issue: Rapport entre σωθέντες, ἔσωσεν et ἐρρύσατο
  choice: Répéter « sauver » pour les deux formes de σῴζω, puis employer « délivrer » pour ῥύομαι.
  alternative: Employer « délivrer » puis « sauver » et « arracher » afin d’éviter toute répétition.
  rationale: La solution retenue respecte à la fois la répétition lexicale du grec et la nuance du troisième verbe, sans imposer une distinction théologique absente du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La structure disloquée « mon peuple…, ce sont ceux… » rend naturellement le passage du collectif singulier au participe pluriel grec. Les répétitions de « Seigneur » et de « sauver » sont conservées pour refléter l’insistance du texte source.
