  text: But the two dragons are I and Haman[a].
translation:
  language: fr
  text: Mais les deux dragons, c’est moi et Haman[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les deux serpents, c’est moi et Haman ». Le mot grec peut désigner des dragons ou de grands serpents.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... δύο δράκοντες
  choice: les deux dragons
  rationale: δράκων peut désigner un dragon ou un grand serpent. « Dragons » conserve l’image saisissante de la vision et rend directement le pluriel grec.
- source_word: ἐγώ εἰμι
  choice: c’est moi
  rationale: L’expression grecque signifie littéralement « je suis ». Dans cette phrase d’identification, la tournure française « c’est moi et Haman » est naturelle et conserve l’insistance portée par ἐγώ.
- source_word: Ἁμάν
  choice: Haman
  rationale: Le nom propre est transcrit selon la forme française biblique courante.
- source_word: δέ
  choice: Mais
  rationale: δέ marque ici une transition légère dans l’explication de la vision; « Mais » convient au passage à l’identification des figures symboliques.
theological_decisions:
- issue: Identification symbolique dans l’explication du rêve d’Esther
  choice: Les deux dragons sont directement identifiés au locuteur (« moi », c’est-à-dire Mardochée dans le contexte) et à Haman.
  alternative: Rendre δράκοντες par « serpents » plutôt que par « dragons ».
  rationale: Le grec formule une identification directe, sans exiger d’ajout interprétatif. La traduction maintient l’équation symbolique telle quelle; elle n’insère pas le nom de Mardochée à la place du pronom.
translation_notes:
  register: Français moderne, clair et digne. La construction disloquée « les deux dragons, c’est moi et Haman » reproduit naturellement en français l’identification emphatique du grec tout en préservant l’image symbolique.
