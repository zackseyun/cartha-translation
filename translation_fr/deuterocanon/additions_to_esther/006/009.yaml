  text: And God remembered his people[a], and vindicated his inheritance.
translation:
  language: fr
  text: Et Dieu se souvint de son peuple et rendit justice à son héritage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « justifia son héritage » ou « donna raison à son héritage ». Le verbe grec possède une portée judiciaire et peut aussi évoquer une réhabilitation publique.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμνήσθη
  choice: se souvint
  rationale: Le verbe signifie couramment « se souvenir » dans le grec biblique, souvent avec l'idée implicite d'une intervention favorable. Cette formulation conserve l'idiome biblique sans expliciter davantage l'action.
- source_word: τοῦ λαοῦ αὐτοῦ
  choice: de son peuple
  rationale: λαός désigne ici le peuple appartenant à Dieu. « Son peuple » est naturel en français et préserve la portée collective et biblique de l'expression.
- source_word: ἐδικαίωσεν
  choice: rendit justice à
  rationale: δικαιόω peut signifier justifier, déclarer juste, donner raison ou rendre justice. Avec « son héritage » comme objet, dans un contexte de délivrance collective, « rendit justice à » exprime la défense et le rétablissement opérés par Dieu tout en maintenant la dimension judiciaire du verbe.
- source_word: τὴν κληρονομίαν ἑαυτοῦ
  choice: son héritage
  rationale: κληρονομία signifie héritage, patrimoine ou possession. « Son héritage » conserve la métaphore scripturaire qui désigne le peuple comme appartenant spécialement à Dieu.
theological_decisions:
- issue: Valeur de ἐδικαίωσεν dans un contexte collectif de délivrance
  choice: rendit justice à
  alternative: justifia; donna raison à; réhabilita
  rationale: « Justifia » serait formellement proche, mais pourrait évoquer trop directement un emploi doctrinal individuel absent du contexte. « Rendit justice à » conserve la force judiciaire et la tension du verbe sans réduire l'action à une catégorie théologique ultérieure.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif biblique. La répétition de « son » conserve la structure grecque et l'identification du peuple comme héritage de Dieu.
