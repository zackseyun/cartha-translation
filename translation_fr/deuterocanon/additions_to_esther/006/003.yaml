  text: The little spring that became a river was Esther, whom the king married and made queen; and there was light and sun and abundant water.
translation:
  language: fr
  text: La petite source est devenue un fleuve ; il y avait de la lumière, du soleil et beaucoup d’eau. Ce fleuve, c’est Esther[a], que le roi a épousée et faite reine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Esther est le fleuve. »'
    reason: La note signale la formulation grecque directe derrière la tournure française d’identification.
lexical_decisions:
- source_word: ἡ μικρὰ πηγή
  choice: la petite source
  rationale: πηγή désigne une source d’eau. « Petite source » est naturel en français et conserve l’image d’un faible commencement.
- source_word: ἡ ἐγένετο ποταμός
  choice: qui est devenue un fleuve
  rationale: La proposition relative décrit la transformation de la source. Le passé composé convient à une explication rétrospective en français moderne.
- source_word: φῶς καὶ ἥλιος
  choice: de la lumière, du soleil
  rationale: Traduction directe des deux éléments symboliques, sans en préciser l’interprétation.
- source_word: ὕδωρ πολύ
  choice: de l’eau en abondance
  rationale: πολύ exprime ici une grande quantité ; « en abondance » est idiomatique et garde cette force quantitative.
- source_word: Ἐσθὴρ ἐστιν ὁ ποταμός
  choice: ce fleuve, c’est Esther
  rationale: Cette tournure française conserve le présent de ἐστιν et l’identification explicite d’Esther au fleuve, tout en reliant clairement la proposition à l’image précédente.
- source_word: ἣν ἐγάμησεν ὁ βασιλεύς
  choice: que le roi a épousée
  rationale: ἐγαμέω signifie ici prendre une femme en mariage. L’accord du participe avec le pronom féminin est requis en français.
- source_word: ἐποίησεν βασίλισσαν
  choice: faite reine
  rationale: Le verbe avec l’attribut à l’accusatif signifie que le roi l’a établie dans la condition de reine. « Faite reine » est concis et naturel.
theological_decisions:
- issue: Identification de l’image du rêve
  choice: 'Maintenir l’identification explicite du fleuve avec Esther au présent : « ce fleuve, c’est Esther »'
  alternative: « La petite source devenue un fleuve représente Esther »
  rationale: 'Le grec ne se contente pas d’indiquer une représentation symbolique : il formule directement « Esther est le fleuve ». La traduction conserve cette tension métaphorique sans ajouter un verbe interprétatif.'
- issue: Rapport des éléments « lumière, soleil et eau en abondance » avec l’identification
  choice: Les conserver dans leur ordre grec, en incise avant l’identification d’Esther
  alternative: Les déplacer après l’identification, comme dans la formulation anglaise de consultation
  rationale: Le texte grec place ces éléments entre la transformation de la source et l’explication « Esther est le fleuve ». L’incise rend cet enchaînement intelligible sans attribuer aux symboles une signification doctrinale absente du verset.
translation_notes:
  register: Français international moderne, clair et digne. L’incise préserve l’ordre inhabituel des images grecques, tandis que « ce fleuve, c’est Esther » évite une reformulation théologique et maintient le présent du texte source.
