base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/006/010.yaml
  text: And these days shall be for them in the month of Adar[a], on the fourteenth and on the fifteenth of the same month, with assembly and joy and gladness before God[b], throughout the generations forever among his people Israel.
translation:
  language: fr
  text: Ces jours seront pour eux, au mois d’Adar, les quatorzième et quinzième jours de ce même mois, avec assemblée[a], joie et allégresse devant Dieu[b], de génération en génération, pour toujours, parmi son peuple Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec un rassemblement » ou « avec une convocation ». Le grec désigne ici une assemblée communautaire, non spécialement un bâtiment de synagogue.
    reason: lexical_alternative
  - marker: b
    text: Ou « en présence de Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται αὐτοῖς αἱ ἡμέραι αὗται
  choice: Ces jours seront célébrés pour eux
  rationale: Le grec dit littéralement que « ces jours seront pour eux ». En français, l’ajout contextuel de « célébrés » rend naturellement la portée commémorative et festive de la formule sans préciser davantage le mode d’observance.
- source_word: ἐν μηνὶ Ἀδάρ
  choice: au mois d’Adar
  rationale: Conserve par translittération le nom du mois juif et emploie la tournure calendérique française courante.
- source_word: τῇ τεσσαρεσκαιδεκάτῃ καὶ τῇ πεντεκαιδεκάτῃ τοῦ αὐτοῦ μηνός
  choice: le quatorzième et le quinzième jour de ce même mois
  rationale: Explicite naturellement en français la valeur calendérique des ordinaux grecs et maintient le rappel du même mois.
- source_word: μετὰ συναγωγῆς
  choice: dans le rassemblement
  rationale: συναγωγή désigne ici l’action ou la réalité de se rassembler en communauté, non un bâtiment appelé synagogue. « Dans le rassemblement » s’intègre à la série des circonstances de la célébration.
- source_word: χαρᾶς καὶ εὐφροσύνης
  choice: la joie et l’allégresse
  rationale: Ce binôme français distingue les deux termes grecs tout en conservant leur tonalité festive et digne.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: devant Dieu
  rationale: Rendu direct et traditionnel qui préserve l’orientation explicite de la fête vers Dieu.
- source_word: εἰς γενεὰς εἰς τὸν αἰῶνα
  choice: de génération en génération, pour toujours
  rationale: 'Préserve les deux éléments de la formule grecque : la continuité à travers les générations et la durée perpétuelle.'
- source_word: ἐν τῷ λαῷ αὐτοῦ Ἰσραήλ
  choice: au sein de son peuple Israël
  rationale: « Au sein de » rend naturellement ἐν appliqué à un peuple, tandis que « son peuple Israël » conserve l’identification relationnelle du texte.
theological_decisions:
- issue: Maintien de la référence explicite à Dieu dans le cadre de la fête
  choice: devant Dieu
  alternative: en présence de Dieu
  rationale: θεοῦ est explicitement attesté dans le grec. La traduction conserve donc la dimension théologique de l’observance au lieu d’en faire une fête seulement communautaire.
- issue: Portée temporelle de εἰς γενεὰς εἰς τὸν αἰῶνα
  choice: de génération en génération, pour toujours
  alternative: à travers les générations, à jamais
  rationale: La formulation choisie maintient sans les fusionner la transmission générationnelle et l’affirmation de permanence.
- issue: Explicitation de la fonction des jours
  choice: seront célébrés pour eux
  alternative: seront pour eux
  rationale: Le grec reste formellement elliptique, mais le contexte festif immédiat indique que ces jours doivent être observés. « Célébrés » fournit en français une phrase intelligible sans imposer de pratique confessionnelle particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le rythme solennel d’une prescription commémorative, avec un vocabulaire festif clair. Les répétitions temporelles du grec sont maintenues sous une forme idiomatique.
