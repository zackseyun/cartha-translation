translation:
  language: fr
  text: 'Et Mardochée dit : « Tout cela est venu de Dieu. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Et
  rationale: Conserve le lien narratif simple, sans ajouter une nuance temporelle absente du grec.
- source_word: εἶπεν
  choice: dit
  rationale: L’aoriste de λέγω introduit ici directement les paroles de Mardochée.
- source_word: Μαρδοχαῖος
  choice: Mardochée
  rationale: Forme française traditionnelle et largement reconnue du nom propre.
- source_word: Παρὰ τοῦ θεοῦ
  choice: de Dieu
  rationale: Avec le génitif, παρά indique ici la source ou l’origine; cette formulation attribue les événements à Dieu sans préciser davantage le mode de causalité.
- source_word: ἐγένετο
  choice: viennent
  rationale: γίνομαι peut exprimer la survenue ou l’avènement; avec « de Dieu », le présent français idiomatique « viennent » rend l’origine affirmée comme conclusion sur les événements accomplis.
- source_word: ταῦτα
  choice: Ces choses
  rationale: Préserve le pluriel neutre du démonstratif et son renvoi aux événements évoqués dans le contexte.
theological_decisions:
- issue: Origine ou causalité divine exprimée par παρά avec le génitif
  choice: Ces choses viennent de Dieu
  alternative: Ces choses sont arrivées par l’action de Dieu
  rationale: Le grec présente Dieu comme la source de ce qui s’est produit, sans définir précisément le mécanisme de son action. La traduction retenue conserve cette attribution sans la développer.
translation_notes:
  register: Français moderne, simple et digne. La phrase brève conserve la structure déclarative du grec et son attribution directe des événements à Dieu.
