base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/002/002.yaml
  text: The matter was being hurried along even in Susa; but the king and Haman were reclining at table[a], while the city was in turmoil.
translation:
  language: fr
  text: L’affaire était aussi menée en toute hâte à Suse. Mais le roi et Haman buvaient[a], tandis que la ville était en plein désarroi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « festoyaient » ou « banquetaient ». Le verbe grec désigne le fait de boire, possiblement dans le cadre d’un repas festif.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσπεύδετο
  choice: était menée avec empressement
  rationale: L’imparfait passif décrit une action en cours que l’on fait avancer rapidement. Cette formulation conserve à la fois la voix passive et l’idée d’urgence dans un français naturel.
- source_word: τὸ πρᾶγμα
  choice: l’affaire
  rationale: Le terme grec reste général et peut désigner une affaire, une démarche ou une entreprise. « L’affaire » évite de préciser indûment qu’il s’agit du décret lui-même.
- source_word: καὶ εἰς Σουσάν
  choice: même à Suse
  rationale: La tournure indique que l’action s’étend également à Suse. « Même à Suse » rend naturellement cette extension avec sa nuance d’insistance.
- source_word: ἐκωθωνίζοντο
  choice: étaient allongés à table
  rationale: Le verbe évoque la posture consistant à s’allonger sur des banquettes pour prendre un repas ou participer à un banquet. Le texte principal conserve cette image culturelle, et la note donne des équivalents fonctionnels.
- source_word: ἐταράσσετο
  choice: était en plein désarroi
  rationale: L’imparfait exprime un état continu d’agitation ou de trouble. « En plein désarroi » traduit clairement le bouleversement collectif et maintient le contraste avec le roi et Haman.
- source_word: ἡ πόλις
  choice: la ville
  rationale: Traduction directe de πόλις, qui désigne ici Suse envisagée comme communauté urbaine.
