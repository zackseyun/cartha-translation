revisions:
- from: Nous avons donc donné instruction à ceux qui vous dictent le contenu des documents rédigés par Haman[a], établi à la tête des affaires et devenu notre second père[b], de les faire tous périr — femmes et enfants compris —, de les exterminer jusqu’à la racine par l’épée de leurs ennemis, sans aucune pitié ni ménagement, le quatorzième jour d’Adar, le douzième mois, de la présente année,
  to: Nous avons donc donné instruction à ceux qui vous dictent le contenu des documents rédigés par Haman[a], établi à la tête des affaires et notre second père[b], de les faire tous périr jusqu’à la racine par les épées de leurs ennemis, sans aucune pitié ni ménagement, le quatorzième jour d’Adar, le douzième mois, de la présente année,
  rationale: La révision conserve la violence explicite et exhaustive du décret, sans l’atténuer, mais rattache correctement « jusqu’à la racine » à l’unique ordre de faire périr. Elle retire l’inférence temporelle de « devenu » et rétablit le pluriel des « épées ». Les deux notes sont conservées, avec leurs ancres placées sur les expressions qu’elles expliquent.
