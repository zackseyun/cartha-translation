  verdict: revise
  source_fidelity: 'Le projet rend correctement le cadre administratif, la désignation honorifique d’Haman, la portée exterminatrice de l’ordre, l’inclusion des femmes et des enfants, l’absence de clémence et la date. Cependant, il dédouble indûment l’unique infinitif grec ἀπολέσαι : « de les faire tous périr » puis « de les exterminer » fait de ὁλορριζεί une seconde action, alors qu’il qualifie l’extermination totale.'
  naturalness: Le français est globalement soutenu et accessible. La correction supprime la redondance verbale et rend la construction plus fluide, tout en gardant l’ampleur de la phrase inachevée du décret.
  terminology: « Documents », « établi à la tête des affaires », « notre second père », « pitié ni ménagement » et « Adar » sont appropriés. « Notre second père » conserve, sans l’interpréter, l’honorifique de cour. « Par les épées de leurs ennemis » restitue le pluriel concret de μαχαίραις.
  issues:
  - severity: medium
    issue: Dédoublement de l’ordre d’extermination
    rationale: Le grec a un seul infinitif, ἀπολέσαι (« faire périr/détruire »), modifié par ὁλορριζεί (« radicalement », litt. avec l’image de la racine). Le texte proposé introduit deux infinitifs coordonnés, « faire tous périr » et « exterminer », ce qui ajoute une seconde formulation verbale non présente dans la source.
  - severity: low
    issue: « Devenu notre second père » ajoute une nuance temporelle
    rationale: δευτέρου πατρὸς ἡμῶν est un titre honorifique apposé à Haman ; le grec ne dit pas qu’il est « devenu » second père. Une apposition simple préserve mieux la formulation.
  - severity: low
    issue: Singulier collectif « l’épée »
    rationale: Le singulier est possible en français, mais le grec emploie le pluriel μαχαίραις. « Les épées de leurs ennemis » maintient l’image et le nombre de la source.
