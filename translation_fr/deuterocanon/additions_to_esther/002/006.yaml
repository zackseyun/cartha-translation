base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/002/006.yaml
  text: Therefore we have instructed those writing to you in the documents written by Haman[a], who was appointed over affairs and was our second father, to destroy all of them—together with women and children—root and branch, by the swords of their enemies, without any pity or sparing, on the fourteenth day of Adar, the twelfth month, of this present year[b],
translation:
  language: fr
  text: Nous avons donc donné instruction à ceux qui vous dictent le contenu des documents rédigés par Haman[a], établi à la tête des affaires et notre second père[b], de les faire tous périr jusqu’à la racine par les épées de leurs ennemis, sans aucune pitié ni ménagement, le quatorzième jour d’Adar, le douzième mois, de la présente année,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à ceux qui vous en dictent la formulation ». Le participe grec peut désigner des agents chargés de dicter ou de formuler des documents officiels ; le rôle administratif précis reste incertain.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « notre second père ». Il s’agit d’une expression honorifique de cour soulignant le rang élevé d’Haman.'
    reason: cultural_note
lexical_decisions:
- source_word: ὑποστεῖλαιμεν
  choice: nous avons donc donné instruction
  rationale: Dans ce contexte de décret royal, le verbe exprime l’émission d’une directive administrative. Cette formulation française est naturelle tout en conservant le caractère officiel de l’énoncé.
- source_word: τοῖς ὑπαγρευομένοις ὑμῖν
  choice: à ceux qui vous dictent le contenu
  rationale: ὑπαγορεύω évoque normalement l’action de dicter ou de fournir la formulation d’un écrit. La traduction maintient cette idée sans définir plus précisément la fonction bureaucratique des personnes concernées.
- source_word: ἐν τοῖς γεγραμμένοις ὑπʼ Ἁμὰν
  choice: des documents rédigés par Haman
  rationale: Le grec désigne des écrits officiels sans imposer le terme plus étroit de « lettres ». « Documents » convient au cadre administratif royal.
- source_word: τοῦ τεταγμένου ἐπὶ τῶν πραγμάτων
  choice: établi à la tête des affaires
  rationale: L’expression indique une nomination à la direction des affaires administratives. Cette formulation conserve le caractère officiel sans ajouter explicitement « affaires de l’État ».
- source_word: δευτέρου πατρὸς ἡμῶν
  choice: devenu notre second père
  rationale: La métaphore honorifique inhabituelle est conservée plutôt que remplacée par une fonction interprétative telle que « principal conseiller ».
- source_word: ἀπολέσαι
  choice: de les faire tous périr
  rationale: Le verbe exprime ici la destruction meurtrière de l’ensemble du groupe. « Faire périr » est direct, digne et non euphémistique.
- source_word: ὁλορριζεί
  choice: de les exterminer jusqu’à la racine
  rationale: L’adverbe exprime l’éradication totale au moyen d’une image liée à la racine. La traduction conserve à la fois la force et l’image du grec.
- source_word: ταῖς τῶν ἐχθρῶν μαχαίραις
  choice: par l’épée de leurs ennemis
  rationale: Le datif est instrumental. Le singulier collectif « l’épée » est idiomatique en français et conserve l’image violente du texte.
- source_word: ἄνευ παντὸς οἴκτου καὶ φειδοῦς
  choice: sans aucune pitié ni ménagement
  rationale: Les deux noms excluent toute compassion et toute retenue dans l’exécution. « Pitié » et « ménagement » préservent cette complémentarité.
- source_word: τῇ τεσσαρεσκαιδεκάτῃ τοῦ δωδεκάτου μηνὸς Ἀδὰρ
  choice: le quatorzième jour d’Adar, le douzième mois
  rationale: La date est exprimée en français naturel, avec conservation du nom hébreu du mois et de son rang calendaire.
- source_word: τοῦ ἐνεστῶτος ἔτους
  choice: de la présente année
  rationale: Cette formule conserve le registre administratif et solennel de l’expression grecque.
theological_decisions:
- issue: Violence exterminatrice dans le décret royal
  choice: Traduire directement l’ordre de mise à mort totale, y compris des femmes et des enfants
  alternative: Employer des termes administratifs atténués tels que « éliminer » ou « écarter »
  rationale: Le grec commande explicitement la destruction de tous, mentionne les femmes et les enfants, ajoute l’image de l’éradication jusqu’à la racine et exclut toute pitié. Une traduction euphémisante masquerait la gravité morale du passage.
translation_notes:
  register: Français international moderne, soutenu mais accessible, adapté à une lettre royale. La syntaxe conserve l’ampleur de la phrase grecque et sa virgule finale, puisque le verset se poursuit. Les formulations violentes ne sont pas atténuées. L’étrangeté de l’expression « second père » est maintenue et expliquée en note.
