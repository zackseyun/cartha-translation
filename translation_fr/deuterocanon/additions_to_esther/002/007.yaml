base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/002/007.yaml
  text: so that those who were hostile in the past and are hostile now[a], after going down violently to Hades in a single day, may for all time afterward provide us with stable and undisturbed affairs.
translation:
  language: fr
  text: afin que ceux qui étaient jadis hostiles et le sont encore aujourd’hui, après être descendus avec violence dans l’Hadès[a] en un seul jour, nous assurent désormais, jusqu’à la fin, une situation stable et sans trouble.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le séjour des morts » ou « le monde des morts ». Le grec désigne le domaine des morts, et non spécialement le lieu du châtiment final.
    reason: Alternative lexicale destinée à préserver la portée du terme grec ᾅδης sans lui imposer une interprétation doctrinale ultérieure.
lexical_decisions:
- source_word: οἱ πάλαι καὶ νῦν δυσμενεῖς
  choice: ceux qui nous étaient hostiles autrefois et le sont encore aujourd’hui
  rationale: Cette formulation rend la continuité entre πάλαι et νῦν, tout en explicitant naturellement en français la relation d’hostilité envers « nous » impliquée par le contexte.
- source_word: ἐν ἡμέρᾳ μιᾷ
  choice: en un seul jour
  rationale: La tournure souligne le caractère soudain et concentré de leur chute.
- source_word: βιαίως
  choice: avec violence
  rationale: L’expression conserve la force de l’adverbe grec sans réduire la descente à une simple mort.
- source_word: εἰς τὸν ἅδην κατελθόντες
  choice: après être descendus avec violence dans l’Hadès
  rationale: « Hadès » préserve le nom grec du séjour des morts, tandis que le participe est rendu comme une action antérieure pour clarifier la relation syntaxique.
- source_word: εἰς τὸν μετέπειτα χρόνον
  choice: désormais
  rationale: Le terme renvoie à la période qui suivra la disparition des adversaires; « désormais » l’exprime naturellement et sans lourdeur.
- source_word: εὐσταθῆ καὶ ἀτάραχα
  choice: stable et sans trouble
  rationale: Le premier adjectif évoque une situation ferme et bien établie; le second, l’absence d’agitation ou de désordre.
- source_word: παρέχωσιν ἡμῖν ... τὰ πράγματα
  choice: nous assurent ... une situation
  rationale: τὰ πράγματα désigne ici l’état général des affaires ou des circonstances. Le singulier collectif « une situation » est idiomatique en français.
- source_word: διὰ τέλους
  choice: jusqu’à la fin
  rationale: Cette traduction garde la formulation temporelle et sa possible nuance d’une continuité durable, sans préciser artificiellement de quelle « fin » il s’agit.
theological_decisions:
- issue: Traduction de ᾅδης dans un texte grec deutérocanonique
  choice: l’Hadès
  alternative: le séjour des morts; le monde des morts
  rationale: Le grec nomme explicitement l’Hadès. Le conserver évite de l’assimiler à tort au lieu du châtiment final, tout en laissant une note expliquer son sens.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la structure solennelle d’un décret royal tout en évitant les calques peu naturels. « Sans trouble » maintient la nuance politique et sociale de ἀτάραχα; « jusqu’à la fin » préserve l’ouverture sémantique de διὰ τέλους.
