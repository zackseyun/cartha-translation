base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/002/004.yaml
  text: among all the tribes throughout the inhabited world there is mixed in a certain hostile people[a], opposed in its laws to every nation, and continually disregarding the decrees of the kings[c][b], so that the blameless joint-rule directed by us may not be maintained.
translation:
  language: fr
  text: Parmi toutes les ethnies répandues dans le monde habité se trouve mêlé un certain peuple hostile, dont les lois sont contraires à celles de toute nation[a] et qui passe continuellement outre aux décrets des rois[b], de sorte que le gouvernement commun[c], dirigé par nous de manière irréprochable, ne puisse se maintenir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dont les coutumes sont contraires à celles de toute nation ». Le grec νόμοι peut désigner aussi bien des lois que des usages établis.
    reason: lexical_alternative
  - marker: b
    text: Le grec est ici syntaxiquement resserré. « Passe […] outre » traduit probablement l’idée de négliger ou d’écarter les ordres royaux.
    reason: lexical_alternative
  - marker: c
    text: Ou « le pouvoir partagé » ou « la corégence ». Le terme grec συναρχία désigne une forme d’autorité exercée en commun.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πάσαις ταῖς κατὰ τὴν οἰκουμένην φυλαῖς
  choice: Parmi toutes les ethnies répandues dans le monde habité
  rationale: « Ethnies » exprime ici les groupes humains désignés par φυλαῖς sans suggérer nécessairement les douze tribus d’Israël. « Monde habité » rend οἰκουμένη, et « répandues » restitue naturellement la portée distributive de κατὰ.
- source_word: ἀναμεμιγμένον
  choice: se trouve mêlé
  rationale: Le participe indique que ce peuple vit mêlé aux autres groupes, ce qui conserve l’image du texte sans la réduire à une simple dispersion géographique.
- source_word: δυσμενῆ λαόν τινα
  choice: un certain peuple hostile
  rationale: « Peuple » rend λαός, « hostile » conserve la caractérisation péjorative de δυσμενής, et « un certain » maintient l’indétermination de τινα.
- source_word: τοῖς νόμοις ἀντίθετον πρὸς πᾶν ἔθνος
  choice: dont les lois sont contraires à celles de toute nation
  rationale: Cette formulation française explicite la relation exprimée par le datif τοῖς νόμοις et par πρὸς πᾶν ἔθνος. νόμοι peut désigner des lois ou, plus largement, des coutumes; l’ambiguïté est signalée en note.
- source_word: τά τε τῶν βασιλέων παραπέμποντας διηνεκῶς προστάγματα
  choice: et qui passe continuellement outre aux décrets des rois
  rationale: Dans cette phrase syntaxiquement resserrée, παραπέμπω est compris au sens de négliger ou d’écarter. « Passer outre » préserve cette nuance, tandis que « décrets » convient au contexte d’un édit royal. Le pluriel « rois » est conservé.
- source_word: πρὸς τὸ μὴ κατατίθεσθαι
  choice: de sorte que ... ne puisse se maintenir
  rationale: La construction exprime ici l’effet ou la visée préventive attribuée à la conduite dénoncée. En contexte politique, « se maintenir » donne un sens naturel à κατατίθεσθαι sans imposer l’idée d’une fondation initiale.
- source_word: τὴν ὑφʼ ἡμῶν κατευθυνομένην ἀμέμπτως συναρχίαν
  choice: le gouvernement commun, dirigé par nous de manière irréprochable
  rationale: συναρχία désigne une autorité exercée en commun, un gouvernement commun ou une corégence. Cette traduction reste intelligible sans préciser qui partage le pouvoir. L’adverbe ἀμέμπτως qualifie la manière dont ce gouvernement est dirigé dans la rhétorique élogieuse de l’auteur de la lettre.
theological_decisions:
- issue: Caractère hostile de l’accusation royale
  choice: Conserver la rhétorique accusatrice et propagandiste du locuteur.
  alternative: Neutraliser la description en parlant seulement d’un peuple distinct ayant des coutumes différentes.
  rationale: Le passage rapporte une accusation portée dans une lettre royale; son langage hostile appartient à la voix du document et ne doit être ni adouci ni présenté comme une appréciation neutre du narrateur.
- issue: Sens politique de συναρχία
  choice: gouvernement commun
  alternative: corégence; pouvoir partagé
  rationale: Le terme rare peut désigner une autorité partagée. « Gouvernement commun » préserve cette portée politique tout en laissant ouverte l’identité exacte des personnes qui participent à ce gouvernement.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formulation garde le ton officiel et hostile de la lettre royale. Les termes potentiellement techniques sont rendus dans le corps du texte par des expressions courantes, avec les autres possibilités données en notes.
