  yaml_path: translation/deuterocanon/additions_to_esther/002/001.yaml
  text: 'And this is the copy of the letter: Great King Artaxerxes writes these things to the rulers and local governors of the one hundred twenty-seven provinces from India to Ethiopia[b][a], who are subject to him.'
translation:
  language: fr
  text: 'Voici la copie de la lettre : « Le grand roi Artaxerxès écrit ce qui suit aux dirigeants et aux gouverneurs locaux, qui lui sont soumis, des cent vingt-sept provinces allant de l’Inde à l’Éthiopie[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « régions » ou « territoires » ; le terme grec a un sens plus large, mais le contexte est celui de l’administration impériale.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστολῆς
  choice: lettre
  rationale: Le terme désigne couramment une lettre ou une communication écrite; « lettre » est naturel et convient au cadre administratif.
- source_word: ἀντίγραφον
  choice: copie
  rationale: Le mot désigne la copie ou la transcription d’un document; « copie » est clair et idiomatique.
- source_word: Βασιλεὺς μέγας
  choice: le grand roi
  rationale: Cette formulation conserve le titre royal et son registre solennel.
- source_word: Ἀρταξέρξης
  choice: Artaxerxès
  rationale: Forme française usuelle du nom royal.
- source_word: χωρῶν
  choice: provinces
  rationale: Dans ce contexte impérial, « provinces » exprime clairement des territoires administrés, sans nier le sens plus large de « régions » ou « territoires ».
- source_word: ἄρχουσι
  choice: dirigeants
  rationale: Le terme désigne des personnes qui exercent l’autorité; « dirigeants » préserve sa portée générale et le distingue de τοπάρχαις.
- source_word: τοπάρχαις
  choice: gouverneurs locaux
  rationale: Le mot désigne les responsables de localités ou de districts; cette traduction est accessible et restitue la fonction administrative.
- source_word: ὑποτεταγμένοις
  choice: qui lui sont soumis
  rationale: Le participe indique leur subordination; « lui » explicite naturellement que cette soumission est envers le roi.
- source_word: τάδε γράφει
  choice: écrit ce qui suit
  rationale: Cette tournure française naturelle conserve la fonction formulaire de l’expression grecque, littéralement « écrit ces choses ».
theological_decisions:
- issue: Titre royal et langage administratif dans une addition deutérocanonique
  choice: Présenter le verset comme l’en-tête formel d’une lettre impériale, sans harmonisation historique ou théologique ajoutée.
  alternative: Paraphraser le passage comme une proclamation royale générale.
  rationale: Le texte est administratif et narratif. La traduction maintient le registre formel du grec sans importer d’interprétation étrangère à la source.
translation_notes:
  register: Français international moderne, digne et accessible. Les guillemets signalent le début de la lettre citée. « Écrit ce qui suit » rend idiomatiquement la formule épistolaire grecque, tandis que l’ordre de la phrase a été légèrement réorganisé pour une lecture naturelle en français.
