  - severity: low
    issue: Rendu de πῶς ἂν ἀχθείη τοῦτο ἐπὶ πέρας
    rationale: « Comment mener cette affaire à son terme » est compréhensible, mais transforme la tournure passive grecque en infinitif actif. « Sur la manière dont cette affaire pourrait être menée à son terme » préserve l’ambiguïté de l’agent et la modalité.
