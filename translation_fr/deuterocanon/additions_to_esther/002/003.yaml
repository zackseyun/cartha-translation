base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/002/003.yaml
  text: And when I asked my counselors how this might be brought to completion[a], Haman showed us the way—he who excelled among us in prudence, had been proved unchanging in goodwill and in steadfast loyalty, and had received the second rank of honor in the kingdom.
translation:
  language: fr
  text: Après m’être renseigné auprès de mes conseillers sur la manière dont cette affaire pourrait être menée à son terme[a], Haman nous l’indiqua, lui qui s’était distingué parmi nous par sa prudence, s’était montré constant dans sa bienveillance et inébranlable dans sa fidélité, et avait reçu le second rang d’honneur dans le royaume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comment mener cette affaire à son terme ». Le grec emploie une tournure passive : « comment ceci pourrait être mené à son terme ». Après cette question, il dit littéralement : « Haman nous indiqua », sans en préciser le complément.'
    reason: La tournure passive de ἀχθείη et le complément implicite de ἐπεδείξεν autorisent ces formulations françaises.
lexical_decisions:
- source_word: πυθομένου δέ μου τῶν συμβούλων
  choice: Après que j’eus demandé à mes conseillers
  rationale: Le génitif absolu situe l’enquête du roi en préalable. « Demander à mes conseillers » est naturel en français et convient au cadre de cour.
- source_word: πῶς ἂν ἀχθείη τοῦτο ἐπὶ πέρας
  choice: comment mener cette affaire à son terme
  rationale: La tournure exprime l’aboutissement d’une chose. « Cette affaire » explicite sobrement le neutre τοῦτο, tandis que « mener… à son terme » restitue l’idiome sans lourdeur.
- source_word: σωφροσύνῃ παρʼ ἡμῖν διενέγκας
  choice: Il se distinguait parmi nous par sa prudence
  rationale: Dans ce contexte administratif, σωφροσύνη désigne surtout la prudence ou le jugement sûr; διενέγκας marque une supériorité distinctive.
- source_word: ἐν τῇ εὐνοίᾳ ἀπαραλλάκτως
  choice: invariable dans sa bienveillance
  rationale: εὔνοια exprime la bienveillance ou les bonnes dispositions, et ἀπαραλλάκτως leur caractère constant, sans variation.
- source_word: βεβαίᾳ πίστει ἀποδεδειγμένος
  choice: s’était montré… d’une fidélité ferme
  rationale: Dans le service royal, πίστις renvoie à la fidélité et à la loyauté plutôt qu’à la foi religieuse; βεβαίᾳ en souligne la solidité et ἀποδεδειγμένος le caractère démontré.
- source_word: δεύτερον τῶν βασιλείων γέρας ἀπενηνεγμένος
  choice: avait reçu le second rang d’honneur dans le royaume
  rationale: γέρας désigne un honneur ou privilège. La formulation française fait comprendre la place éminente de Haman tout en conservant l’idée explicite de second rang.
- source_word: Ἁμὰν ἐπεδείξεν ἡμῖν
  choice: Haman nous l’indiqua
  rationale: ἐπιδείκνυμι signifie montrer, indiquer ou faire connaître. Le pronom « l’ » reprend de manière non spécifiante ce qui permettrait de mener l’affaire à son terme, sans ajouter « la voie », absent du grec.
theological_decisions:
- issue: Sens de πίστις dans un contexte de cour non théologique
  choice: fidélité
  alternative: foi; loyauté
  rationale: Le roi vante ici la fiabilité de Haman dans son service. « Fidélité » conserve la valeur relationnelle de πίστις sans lui donner artificiellement un sens religieux.
translation_notes:
  register: Français international actuel, digne et lisible. La syntaxe a été divisée en deux phrases pour éviter une période excessivement lourde, tout en conservant l’enchaînement logique et les éloges officiels de la lettre royale.
