base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/002/005.yaml
  text: Therefore[a], having recognized that this nation alone stands in opposition to every man, introducing a foreign way of life in its laws, and being ill-disposed toward our affairs, accomplishing the worst evils, so that the kingdom does not attain stability[b],
translation:
  language: fr
  text: Ayant donc reconnu que cette nation est la seule à s’opposer constamment à tout être humain, s’écartant des lois par un mode de vie étranger, mal disposée envers nos affaires et produisant les pires maux, de sorte que le royaume ne jouisse pas de stabilité[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte fait partie d’une lettre royale hostile et présente comme des faits les accusations portées contre cette nation. La formulation grecque relative aux lois et au mode de vie est très condensée et peut évoquer soit un écart par rapport aux lois, soit leur modification. La dernière proposition peut aussi exprimer une finalité alléguée : « afin que le royaume ne jouisse pas de stabilité ».'
    reason: contexte_littéraire_et_ambiguïté
lexical_decisions:
- source_word: διειληφότες
  choice: ayant reconnu
  rationale: Le participe présente comme acquise la conclusion invoquée dans la lettre royale, sans en faire explicitement un décret formel.
- source_word: ἔθνος
  choice: nation
  rationale: Dans ce contexte politique hostile, « nation » désigne nettement un groupe ethnique et collectif identifiable sans la charge moderne de « race ».
- source_word: μονώτατον
  choice: la seule
  rationale: Le superlatif singularise ce peuple comme exceptionnellement isolé et opposé aux autres.
- source_word: ἐν ἀντιπαραγωγῇ ... κείμενον
  choice: s’opposer constamment
  rationale: Cette formulation naturelle rend à la fois la position antagoniste et sa continuité.
- source_word: παντὶ διὰ παντὸς ἀνθρώπῳ
  choice: constamment à tout être humain
  rationale: « Tout être humain » conserve le singulier générique de ἀνθρώπῳ, tandis que « constamment » rend διὰ παντός.
- source_word: διαγωγὴν νόμων ξενίζουσαν παραλλάσσον
  choice: adopte, dans ses lois, un mode de vie étranger
  rationale: Le grec est dense et syntaxiquement difficile. Ce choix conserve les dimensions juridique et culturelle sans affirmer plus précisément que le texte ne le permet une modification des lois.
- source_word: δυσονοοῦν τοῖς ἡμετέροις πράγμασιν
  choice: mal disposée envers nos affaires
  rationale: La tournure garde l’attitude hostile alléguée et l’étendue assez large des intérêts royaux.
- source_word: τὰ χείριστα συντελοῦν κακὰ
  choice: elle cause les pires maux
  rationale: « Causer » exprime naturellement l’idée de produire ou mener à leur accomplissement des maux, tout en conservant l’intensité du superlatif.
- source_word: πρὸς τὸ μὴ τὴν βασιλείαν εὐσταθείας τυγχάνειν
  choice: empêchant ainsi le royaume de connaître la stabilité
  rationale: Cette construction rend naturellement la conséquence ou la visée alléguée, tout en maintenant la portée politique d’εὐστάθεια.
theological_decisions:
- issue: Caractérisation royale hostile du peuple juif
  choice: Conserver les accusations comme propos de la lettre royale, sans les atténuer.
  alternative: Ajouter dans le corps du texte des marques explicites de distanciation narrative.
  rationale: Le passage rapporte une propagande hostile. La traduction doit en préserver la violence rhétorique sans présenter ces accusations comme le jugement du traducteur ou du narrateur.
- issue: Rapport entre conséquence et intention dans πρὸς τὸ μή
  choice: « empêchant ainsi »
  alternative: « afin que le royaume ne connaisse pas »
  rationale: La construction peut exprimer l’effet ou la finalité. Dans cette phrase, une conséquence alléguée s’intègre naturellement, mais l’ambiguïté mérite d’être signalée.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue période et l’enchaînement des participes conservent le ton administratif et accusateur de la lettre, avec une ponctuation qui en facilite la lecture.
