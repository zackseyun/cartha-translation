  text: But[a], unable to bear his arrogance, he made it his aim to deprive us of both our position and our life.
translation:
  language: fr
  text: Mais, ne supportant pas l’arrogance, il s’est appliqué à nous priver à la fois de notre autorité et de notre vie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de notre charge et de notre souffle (ou esprit) ». Le grec ἀρχή peut désigner l’autorité, le pouvoir ou une charge, et πνεῦμα l’esprit, le souffle ou la vie.
    reason: Alternative lexicale préservant la polysémie des deux noms grecs.
lexical_decisions:
- source_word: οὐκ ἐνέγκας
  choice: ne supportant pas
  rationale: Le participe aoriste de φέρω a ici le sens idiomatique de « supporter, tolérer ». Cette tournure française conserve son lien circonstanciel avec le verbe principal sans préciser à tort s’il est causal ou temporel.
- source_word: τὴν ὑπερηφανίαν
  choice: son arrogance
  rationale: ὑπερηφανία désigne un orgueil hautain ou une arrogance. « Arrogance » rend clairement la valeur péjorative en français actuel; le possessif reprend l’interprétation contextuelle de l’antécédent.
- source_word: ἐπετήδευσεν
  choice: il s’est appliqué à
  rationale: Le verbe exprime une démarche délibérée, le fait de poursuivre activement un but, sans affirmer que celui-ci a été atteint.
- source_word: τῆς ἀρχῆς
  choice: notre autorité
  rationale: Dans ce contexte politique, ἀρχή peut désigner le pouvoir, la charge ou l’autorité. « Autorité » conserve ce champ institutionnel sans imposer une fonction précise.
- source_word: στερῆσαι ἡμᾶς
  choice: nous priver
  rationale: στερέω signifie enlever à quelqu’un ce qu’il possède, donc « priver de »; ἡμᾶς en est le complément direct.
- source_word: καὶ τοῦ πνεύματος
  choice: et de notre vie
  rationale: πνεῦμα peut signifier l’esprit, le souffle ou le souffle vital. Après la perte de l’autorité, le contexte de menace favorise ici le sens concret de « vie », tout en signalant les autres possibilités en note.
theological_decisions:
- issue: Sens de πνεῦμα dans un contexte de menace politique
  choice: vie, au sens de souffle vital
  alternative: esprit ou souffle
  rationale: L’enchaînement entre la perte de l’autorité et celle du πνεῦμα évoque naturellement la perte de la vie. « Vie » évite d’introduire une conception théologique particulière de l’esprit, tandis que la note préserve la polysémie du grec.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination « à la fois… et… » rend la structure grecque, tandis que « s’est appliqué à » exprime l’intention délibérée sans en présumer la réussite.
