  text: Many[a], the more they were honored because of the greatest kindness of their benefactors, became more arrogant,
translation:
  language: fr
  text: Beaucoup, honorés plus fréquemment grâce à l’immense bonté de leurs bienfaiteurs, conçurent une plus haute opinion d’eux-mêmes,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « devinrent plus orgueilleux ». Le grec dit littéralement qu’ils « pensèrent plus grand », une expression qui évoque une opinion exagérément élevée de soi-même.'
