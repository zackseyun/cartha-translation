lexical_decisions:
- source_word: πολλοὶ
  choice: Beaucoup
  rationale: L’adjectif substantivé introduit une observation générale; « Beaucoup » est direct et naturel en français.
- source_word: τῇ πλείστῃ ... χρηστότητι
  choice: grâce à l’extrême bonté
  rationale: Le datif indique ici la cause ou le moyen associé aux honneurs reçus. « Extrême bonté » conserve la force superlative de πλείστῃ et le sens de bienveillance de χρηστότης.
- source_word: τῶν εὐεργετούντων
  choice: de leurs bienfaiteurs
  rationale: Le participe désigne ceux qui leur font du bien; « bienfaiteurs » en est l’équivalent idiomatique et précis.
- source_word: πυκνότερον τιμώμενοι
  choice: comblés d’honneurs
  rationale: πυκνότερον exprime littéralement une fréquence ou une intensification des marques d’honneur. « Comblés d’honneurs » rend naturellement l’idée d’honneurs multipliés, sans imposer une corrélation syntaxique absente du grec.
- source_word: μεῖζον ἐφρόνησαν
  choice: en conçurent une plus haute opinion d’eux-mêmes
  rationale: L’expression signifie littéralement qu’ils « pensèrent plus grand » et suggère l’orgueil. Cette formulation française préserve l’image mentale et l’implication morale sans la réduire au seul qualificatif « arrogants ».
