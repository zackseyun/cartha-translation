translation:
  language: fr
  text: étant fils[a] du Dieu Très-Haut, suprême et vivant, qui dirige le royaume pour nous et pour nos ancêtres selon la meilleure ordonnance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « enfants ». Le grec dit littéralement « fils » et peut désigner collectivement les membres du peuple.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans la meilleure disposition » ou « selon le meilleur ordre ». L’expression grecque évoque une organisation, un agencement ou un ordre excellent; « royaume » peut aussi être compris comme « royauté » ou « domination ».
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὺς
  choice: fils
  rationale: Le grec emploie explicitement le masculin pluriel et exprime une relation filiale collective; « fils » conserve cette formulation sans la neutraliser.
- source_word: τοῦ ὑψίστου μεγίστου ζῶντος θεοῦ
  choice: du Dieu Très-Haut, très-grand et vivant
  rationale: Cette formulation garde l’accumulation solennelle des qualificatifs divins, tout en restant intelligible en français moderne.
- source_word: κατευθύνοντος
  choice: qui dirige
  rationale: Le verbe peut évoquer à la fois la conduite et la bonne orientation; « dirige » préserve ici la dimension de gouvernement providentiel sans la préciser indûment.
- source_word: τὴν βασιλείαν
  choice: la royauté
  rationale: Dans ce contexte royal, « royauté » peut désigner l’exercice ou l’institution du pouvoir royal, tout en évitant de réduire nécessairement le terme au territoire d’un royaume.
- source_word: ἡμῖν τε καὶ τοῖς προγόνοις ἡμῶν
  choice: pour nous et pour nos ancêtres
  rationale: « Ancêtres » rend naturellement πρόγονοι en français actuel et inclut les générations antérieures sans archaïsme inutile.
- source_word: ἐν τῇ καλλίστῃ διαθέσει
  choice: selon le meilleur ordre
  rationale: La formule conserve l’idée d’une organisation ou disposition excellente; « selon » produit un français plus naturel que le calque « dans ».
theological_decisions:
- issue: Langage collectif de filiation divine
  choice: étant fils du Dieu Très-Haut
  alternative: étant enfants du Dieu Très-Haut
  rationale: « Fils » reflète le terme grec masculin explicite et maintient la force théologique de la relation filiale, tandis que la note signale la possibilité d’une portée collective plus générale.
- issue: Portée de l’action divine sur la royauté
  choice: qui dirige pour nous et pour nos ancêtres la royauté
  alternative: qui conduit le royaume pour nous et pour nos ancêtres
  rationale: Le participe présent est conservé comme action continue ou générale. « Royauté » laisse ouverte la référence au pouvoir royal ou à son exercice plutôt que d’imposer l’idée d’un territoire.
translation_notes:
  register: Fragment participial conservé comme tel (« étant »), puisque le verset appartient à une phrase plus longue. Registre soutenu mais actuel; l’accumulation des titres divins et l’ambiguïté de βασιλεία et διάθεσις sont préservées.
