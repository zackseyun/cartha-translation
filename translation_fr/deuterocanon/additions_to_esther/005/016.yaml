  naturalness: Le fragment participial convient au contexte phrastique. La séquence « du Dieu Très-Haut, très-grand et vivant » est toutefois lourde et « très-grand » est peu idiomatique dans cet emploi. « Qui dirige pour nous et pour nos ancêtres la royauté » est compréhensible, mais l’antéposition de l’objet donne une tournure moins fluide que « qui dirige le royaume pour nous et pour nos ancêtres ».
  terminology: « Fils » respecte υἱούς et la note fournit utilement l’alternative collective « enfants ». « Très-Haut » est un titre établi. « Suprême » rend le superlatif μεγίστου de façon actuelle et solennelle, sans prétendre résoudre autrement l’accumulation des épithètes. « Meilleure ordonnance » rend διάθεσις comme ordre ou agencement, avec un registre administratif et élevé approprié.
