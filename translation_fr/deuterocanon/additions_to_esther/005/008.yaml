lexical_decisions:
- source_word: προσέχειν
  choice: veiller à
  rationale: Le verbe exprime l’attention accordée à une réalité; avec la tournure temporelle qui suit, « veiller à » reste naturel tout en gardant l’idée de prendre en considération l’avenir.
- source_word: τὰ μετὰ ταῦτα
  choice: ce qui viendra ensuite
  rationale: La formulation rend clairement la portée temporelle de l’expression grecque, qui vise les événements ou conséquences ultérieurs.
- source_word: Βασιλείαν
  choice: un royaume
  rationale: « Royaume » conserve l’étendue sémantique de βασιλεία, qui peut désigner ici le domaine politique sans exclure l’idée de pouvoir royal.
- source_word: ἀτάραχον
  choice: à l’abri des troubles
  rationale: Cette expression idiomatique rend l’absence d’agitation, de désordre ou de bouleversement politique.
- source_word: τοῖς πᾶσιν ἀνθρώποις
  choice: à tous les peuples
  rationale: Dans ce contexte impérial, le pluriel français « peuples » exprime naturellement l’ensemble des populations concernées, sans limiter ἄνθρωποι aux hommes de sexe masculin.
- source_word: μετʼ εἰρήνης
  choice: vivant dans la paix
  rationale: La tournure rattache naturellement la paix à l’état stable du royaume et évite le calque peu idiomatique « avec paix ».
- source_word: παρέξεσθαι
  choice: assurer
  rationale: Dans ce contexte politique, « assurer à » exprime naturellement le fait de procurer ou garantir aux populations un royaume stable.
theological_decisions:
- issue: Portée de βασιλεία
  choice: royaume
  alternative: règne ou pouvoir royal
  rationale: Le contexte politique favorise « royaume », mais le grec conserve une possible nuance plus abstraite, signalée en note.
