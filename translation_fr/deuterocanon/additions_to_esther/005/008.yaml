  source_fidelity: 'La proposition rend bien la valeur prospective de προσέχειν εἰς τὰ μετὰ ταῦτα et l’idée d’un ordre politique sans trouble. Toutefois, τοῖς πᾶσιν ἀνθρώποις signifie littéralement « à tous les êtres humains / à tous », non « à tous les peuples » : ce dernier introduit une collectivisation absente du grec. « Vivant dans la paix » ajoute en outre un participe et rattache plus étroitement la paix au royaume, alors que μετʼ εἰρήνης accompagne plus simplement l’action de procurer/assurer. Enfin, le déterminant indéfini « un royaume » est moins fidèle que « le royaume », qui rend l’article grec.'
  naturalness: « Veiller à ce qui viendra ensuite » est possible, mais peut suggérer une vigilance active plutôt que l’attention ou la considération demandée. « Prêter attention à ce qui suivra » est plus précis et demeure naturel dans un registre soutenu. « Assurer à tous le royaume, sans troubles, dans la paix » est fluide; « à l’abri des troubles » est également recevable, mais « sans troubles » conserve une formulation plus directe.
  terminology: « Royaume » convient pour βασιλεία et la note conserve à juste titre les possibilités « règne » et « pouvoir royal ». « Tous » rend ἀνθρώποις inclusivement et sans surinterprétation ethno-politique. « Dans la paix » rend naturellement μετʼ εἰρήνης sans transformer la relation syntaxique en une qualité ajoutée du royaume.
