  register: Français international moderne, soutenu mais accessible. La phrase demeure un segment syntaxiquement lié à son contexte. « À l’abri des troubles » et « dans la paix » rendent distinctement ἀτάραχον et μετʼ εἰρήνης sans lourdeur.
