  - severity: low
    issue: « vivant dans la paix » pour μετʼ εἰρήνης
    rationale: Cette formulation ajoute une prédication participiale concernant le royaume. « Dans la paix » conserve plus directement le complément grec et son lien avec l’action d’assurer/procurer.
