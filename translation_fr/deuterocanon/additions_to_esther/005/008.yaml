  text: et de prêter attention à ce qui suivra[a], afin d’assurer à tous le royaume, sans troubles, dans la paix[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de veiller à ce qui viendra ensuite ». Le grec peut exprimer le fait de prêter attention ou de prendre en considération; avec « ce qui suit », le contexte oriente cette attention vers l’avenir.
