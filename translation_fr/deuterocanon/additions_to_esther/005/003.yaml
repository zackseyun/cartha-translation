  text: And they seek not only to mistreat those subject to us[a], but, unable to bear prosperity, they even attempt to scheme against their own benefactors;
translation:
  language: fr
  text: Et non seulement ils cherchent à faire du mal à ceux qui nous sont soumis, mais, incapables de supporter la prospérité[a], ils tentent même de comploter contre leurs propres bienfaiteurs ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’abondance » ou « la satiété » ; le grec κόρον peut évoquer une prospérité excessive, la surabondance ou le rassasiement.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποτεταγμένους
  choice: ceux qui nous sont soumis
  rationale: Le participe désigne des personnes placées sous une autorité. Cette formulation naturelle conserve la relation de subordination sans préciser indûment leur statut politique.
- source_word: ζητοῦσι κακοποιεῖν
  choice: ils cherchent à faire du mal
  rationale: La construction exprime l’intention de nuire ou de mal agir envers quelqu’un. « Faire du mal » reste clair, direct et proche du grec.
- source_word: κόρον
  choice: leur prospérité
  rationale: κόρος peut désigner la satiété, la surabondance ou l’aisance excessive. Dans ce contexte moral, « prospérité » exprime naturellement une abondance que ces personnes ne savent pas supporter, tandis que la note conserve les autres nuances possibles.
- source_word: οὐ δυνάμενοι φέρειν
  choice: incapables de supporter
  rationale: Cette expression rend directement l’idée de ne pas pouvoir porter ou endurer une situation.
- source_word: τοῖς ἑαυτῶν εὐεργέταις
  choice: contre leurs propres bienfaiteurs
  rationale: εὐεργέτης désigne une personne qui fait du bien à une autre. « Leurs propres bienfaiteurs » conserve à la fois le sens social et moral du nom ainsi que la valeur réfléchie de ἑαυτῶν.
- source_word: ἐπιχειροῦσι μηχανᾶσθαι
  choice: ils vont jusqu’à comploter contre
  rationale: ἐπιχειρέω indique qu’ils entreprennent ou tentent quelque chose, et μηχανάομαι qu’ils élaborent un dessein hostile. « Vont jusqu’à » marque la progression introduite par καί, tandis que « comploter contre » rend clairement l’hostilité envers les bienfaiteurs.
