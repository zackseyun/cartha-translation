  naturalness: Le français est globalement clair et de registre approprié. « Toutes choses » est toutefois moins naturel que « tout » en français moderne, et « faire disparaître la reconnaissance parmi les humains » est lourd. Une coordination explicite améliore à la fois la fidélité et la lisibilité.
  terminology: « Gratitude », « enflés d'orgueil », « vantardises », « jugement » et « déteste le mal » conviennent. Pour l'adjectif textuellement et lexicalement difficile, « personnes réputées exceptionnellement bonnes ou nobles » conserve l'incertitude sans introduire le jugement interprétatif « que l'on tient pour ».
