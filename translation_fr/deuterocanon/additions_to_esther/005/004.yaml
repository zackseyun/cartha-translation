base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/005/004.yaml
  text: And[a], while taking away gratitude not only from men, but also being puffed up by the boasts of those who are exceedingly good[b], they suppose they will escape the judgment of the God who always sees all things and hates evil.
translation:
  language: fr
  text: Et, non seulement enlevant aux humains leur gratitude, mais aussi enflés d’orgueil par les vantardises de personnes réputées exceptionnellement bonnes ou nobles[a], ils s’imaginent échapper au jugement[b] du Dieu qui voit toujours tout et déteste le mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La forme grecque traduite par « personnes réputées exceptionnellement bonnes ou nobles » est difficile, tant du point de vue du texte que du lexique ; elle semble désigner des personnes considérées comme éminemment bonnes ou nobles.
    reason: textual_variant
  - marker: b
    text: Ou « à la justice », « au châtiment ». Le mot grec peut désigner aussi bien la sanction judiciaire que la peine qui en résulte.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστίαν
  choice: la reconnaissance
  rationale: Le nom désigne ici la gratitude. « Reconnaissance » est naturel en français et convient à une disposition que l’on fait disparaître parmi les humains.
- source_word: ἀνταναιροῦντες
  choice: faire disparaître
  rationale: Le participe exprime l’action d’enlever ou de supprimer. Cette formulation conserve cette force sans suggérer nécessairement une destruction violente.
- source_word: κόμποις
  choice: vantardises
  rationale: Le terme évoque les propos vaniteux, la jactance ou les prétentions. « Vantardises » est clair et actuel.
- source_word: ἐπαρθέντες
  choice: enflés d’orgueil
  rationale: Le participe passif signifie littéralement être élevé et prend ici une nuance morale d’arrogance.
- source_word: ἀπεράγἀθων
  choice: ceux que l’on tient pour exceptionnellement vertueux
  rationale: La forme transmise est difficile. La traduction signale qu’il s’agit de personnes présentées ou considérées comme éminemment bonnes, sans valider leur prétention dans un contexte de vantardise.
- source_word: κατοπτεύοντος
  choice: qui voit toujours toutes choses
  rationale: Le participe désigne l’observation attentive; avec τὰ πάντα et ἀεί, il affirme une surveillance universelle et constante.
- source_word: μισοπόνηρον
  choice: déteste le mal
  rationale: L’adjectif qualifie Dieu comme opposé au mal. Une proposition verbale rend naturellement en français cette caractérisation compacte.
- source_word: δίκην
  choice: jugement
  rationale: Dans ce contexte, le mot désigne la rétribution judiciaire à laquelle les coupables pensent pouvoir échapper. « Jugement » conserve une portée assez large pour inclure justice et châtiment.
theological_decisions:
- issue: Dieu voit tout et s’oppose moralement au mal
  choice: le Dieu qui voit toujours toutes choses et déteste le mal
  alternative: le Dieu qui observe tout en tout temps, ennemi du mal
  rationale: La formulation conserve les deux attributs juxtaposés dans le grec — vigilance universelle et constante, opposition au mal — sans y importer de terminologie doctrinale ultérieure.
- issue: Nature de la δίκη divine
  choice: jugement
  alternative: châtiment
  rationale: « Jugement » préserve la dimension judiciaire sans exclure la conséquence punitive, que le contexte permet mais n’oblige pas à isoler.
translation_notes:
  register: Français international moderne, digne et accessible. « Non contents de » explicite naturellement la progression οὐ μόνον… ἀλλὰ καί sans modifier son argument. La tournure « que l’on tient pour » maintient la distance imposée par le contexte arrogant et évite de présenter comme un fait la vertu revendiquée.
