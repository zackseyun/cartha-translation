  yaml_path: translation/deuterocanon/additions_to_esther/005/011.yaml
  text: We have attained such goodwill toward every nation that he is proclaimed our father and is honored by all[a], continuing as the second person to the royal throne.
translation:
  language: fr
  text: Il a bénéficié à tel point de la bienveillance que nous témoignons envers toutes les nations qu’il est proclamé notre père et que, honoré de tous[a], il demeure le deuxième personnage après le trône royal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « devant qui tous se prosternent ». Le verbe grec peut désigner la prosternation ou l’hommage rendu à un supérieur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτυχεν ἧς ἔχομεν … φιλανθρωπίας
  choice: Il a bénéficié … de la bienveillance que nous témoignons
  rationale: ἔτυχεν est à la troisième personne du singulier et régit ici le génitif φιλανθρωπίας, repris par le relatif ἧς. La construction désigne donc la bienveillance dont « il » a bénéficié, et non une bienveillance que « nous » aurions obtenue. « Témoignons » rend naturellement la disposition favorable exprimée par ἔχομεν πρὸς.
- source_word: πρὸς πᾶν ἔθνος
  choice: à toute nation
  rationale: Dans ce contexte impérial, ἔθνος désigne chaque nation ou peuple relevant de l’horizon politique du souverain. La tournure s’intègre naturellement à « témoigner de la bienveillance à ».
- source_word: ἐπὶ τοσοῦτον ὥστε
  choice: à tel point … que
  rationale: Cette locution introduit une conséquence et se rend idiomatiquement en français par « à tel point que ».
- source_word: ἀναγορεύεσθαι … πατέρα
  choice: être proclamé notre père
  rationale: ἀναγορεύω évoque une proclamation publique ou officielle; le titre imagé « père » est conservé sans l’interpréter comme « protecteur » ou « bienfaiteur ».
- source_word: προσκυνούμενον
  choice: honoré de tous[a]
  rationale: Le verbe peut décrire la prosternation ou l’hommage rendu à un supérieur. « Honoré » convient au contexte de cour sans imposer l’idée d’un culte divin; le geste plus littéral est signalé en note.
- source_word: τὸ δεύτερον τοῦ Βασιλικοῦ θρόνου πρόσωπον
  choice: le deuxième personnage après le trône royal
  rationale: πρόσωπον désigne ici un personnage ou dignitaire, tandis que δεύτερον exprime son rang. La formulation conserve l’image inhabituelle du « trône royal » tout en indiquant clairement la seconde place.
- source_word: διατελεῖν
  choice: il demeure
  rationale: διατελέω exprime la continuité d’un état ou d’une fonction. « Demeure » restitue cette valeur durative en français courant et digne.
theological_decisions:
- issue: Portée de προσκυνούμενον dans un contexte de cour royale
  choice: honoré de tous
  alternative: devant qui tous se prosternent; vénéré de tous; adoré de tous
  rationale: Le contexte favorise l’hommage rendu à un haut dignitaire plutôt que l’adoration d’une divinité. La traduction principale évite donc de trancher dans un sens cultuel, tandis que la note conserve le sens concret possible de la prosternation.
translation_notes:
  register: 'Français international moderne, soutenu sans archaïsme, adapté au style officiel d’un décret royal. La syntaxe suit le grec contre la couche anglaise sur un point important : ἔτυχεν est à la troisième personne du singulier, de sorte que c’est le dignitaire qui bénéficie de la bienveillance du roi.'
