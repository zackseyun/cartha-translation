base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/005/024.yaml
  text: But every city or region as a whole that does not act according to these orders will be consumed with spear and fire in wrath[a]; it will be made not only impassable to men[b], but also most hateful to wild animals and birds for all time.
translation:
  language: fr
  text: Mais toute ville ou région, dans son ensemble, qui n’agira pas conformément à ces ordres sera consumée par la lance et le feu, avec colère[a] ; elle sera rendue non seulement inaccessible aux humains, mais aussi des plus odieuse aux animaux sauvages et aux oiseaux, pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par la lance et le feu ». Le grec δόρατι signifie littéralement « lance » ; certaines traductions généralisent par « épée ». L’expression « avec colère » ne précise pas de qui vient cette colère.'
    reason: Alternative instrumentale et conservation de l’ambiguïté concernant l’origine de la colère.
lexical_decisions:
- source_word: πᾶσα δὲ πόλις ἢ χώρα τὸ σύνολον
  choice: Mais toute ville ou toute région qui, dans son ensemble
  rationale: La tournure distributive « toute ville ou toute région » traduit πᾶσα ... πόλις ἢ χώρα, tandis que « dans son ensemble » conserve l’insistance de τὸ σύνολον sur la totalité.
- source_word: κατὰ ταῦτα μὴ ποιήσῃ
  choice: n’agira pas conformément à ces ordres
  rationale: Dans le contexte d’un décret royal, ποιεῖν κατὰ ταῦτα désigne le fait d’agir selon les dispositions énoncées ; « ces ordres » explicite naturellement le référent sans changer le sens.
- source_word: δόρατι καὶ πυρὶ
  choice: par la lance et par le feu
  rationale: δόρατι est le datif singulier de δόρυ, « lance ». Le français instrumental « par » convient ici et conserve l’image militaire précise plutôt que de généraliser en « épée ».
- source_word: καταναλωθήσεται μετʼ ὀργῆς
  choice: sera consumée ... dans la colère
  rationale: « Consumée » préserve l’image de destruction totale portée par καταναλίσκω et s’accorde avec le feu ; « dans la colère » maintient sans la préciser davantage la relation exprimée par μετʼ ὀργῆς.
- source_word: ἀνθρώποις ἄβατος
  choice: inaccessible aux humains
  rationale: ἄβατος décrit un lieu où l’on ne peut entrer ou passer. « Inaccessible » est naturel pour une ville ou une région dévastée, et « humains » rend la portée générique de ἀνθρώποις.
- source_word: θηρίοις καὶ πετεινοῖς
  choice: aux animaux sauvages et aux oiseaux
  rationale: θηρία désigne ici les bêtes ou animaux sauvages, et πετεινά les êtres ailés, naturellement rendus par « oiseaux ».
- source_word: εἰς τὸν ἅπαντα χρόνον
  choice: pour toujours
  rationale: Cette formulation française restitue de façon solennelle et naturelle la durée totale exprimée par εἰς τὸν ἅπαντα χρόνον.
- source_word: ἔχθιστος κατασταθήσεται
  choice: sera rendue ... tout à fait odieuse
  rationale: κατασταθήσεται exprime l’établissement dans un état, et ἔχθιστος est un superlatif très fort. « Tout à fait odieuse » communique cette intensité dans un français idiomatique.
theological_decisions:
- issue: Portée générique de ἀνθρώποις
  choice: aux humains
  alternative: aux hommes
  rationale: Le substantif grec ἄνθρωπος désigne ici les êtres humains en général, sans contraste de sexe. « Aux humains » exprime exactement cette portée en français moderne.
- issue: Instrument de destruction désigné par δόρατι
  choice: par la lance
  alternative: par l’épée
  rationale: Le texte grec nomme précisément la lance (δόρυ). La traduction conserve cette image au lieu d’introduire l’épée par généralisation traditionnelle.
- issue: Relation de μετʼ ὀργῆς avec la destruction
  choice: dans la colère
  alternative: avec fureur
  rationale: « Dans la colère » garde la valeur d’accompagnement ou de manière sans déterminer explicitement si la colère est celle du roi, des exécutants ou une caractérisation générale du jugement.
translation_notes:
  register: Français international moderne, digne et de tonalité décrétale. La phrase conserve l’ampleur et la sévérité du grec tout en évitant les archaïsmes. Le point-virgule rend clairement les deux volets de la sanction.
