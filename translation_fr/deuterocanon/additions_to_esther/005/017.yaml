  text: Therefore you will do well not to make use of the letters sent out by Haman son of Hammedatha,[a]
translation:
  language: fr
  text: Vous ferez donc bien de ne pas faire usage des lettres envoyées par Haman, fils d’Hammedatha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de ne pas agir sur la base des lettres envoyées par Haman, fils d’Hammedatha ». Le verbe grec peut signifier « faire usage de » ou « se servir de » et, dans ce contexte, peut impliquer de ne pas mettre ces lettres à exécution.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καλῶς οὖν ποιήσετε
  choice: Vous ferez donc bien
  rationale: Cette formulation naturelle conserve le futur de ποιήσετε, la valeur appréciative de καλῶς et le lien logique marqué par οὖν.
- source_word: μὴ προσχρησάμενοι
  choice: de ne pas faire usage de
  rationale: Le participe exprime la manière dont les destinataires agiront bien. « Faire usage de » rend la valeur de προσχράομαι sans préciser indûment s’il s’agit d’obéir aux lettres, de les invoquer ou de les mettre à exécution.
- source_word: τοῖς ... γράμμασιν
  choice: des lettres
  rationale: Dans ce contexte administratif royal, γράμματα désigne des communications écrites; « lettres » est direct, clair et idiomatique.
- source_word: ὑπὸ Ἁμὰν Ἁμαδάθου
  choice: par Haman, fils d’Hammedata
  rationale: Le génitif Ἁμαδάθου est compris comme patronymique; le français exige d’expliciter la relation par « fils de ».
- source_word: ἀποσταλεῖσι
  choice: envoyées
  rationale: Le participe aoriste passif qualifie les lettres. « Envoyées » transmet exactement l’idée sans ajouter une nuance absente du grec.
