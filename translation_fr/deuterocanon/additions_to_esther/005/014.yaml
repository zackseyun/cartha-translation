  yaml_path: translation/deuterocanon/additions_to_esther/005/014.yaml
  text: For by these methods he thought that[a], once he had made us desolate, he would transfer the rule of the Persians to the Macedonians.
translation:
  language: fr
  text: Car il pensait que, par ces moyens, après nous avoir laissés dévastés[a], il ferait passer la domination des Perses aux Macédoniens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après nous avoir trouvés dévastés » ou « après nous avoir réduits à un état de désolation ». La tournure participiale grecque est idiomatique; elle peut évoquer un état de dévastation déjà constaté ou envisagé comme résultant de son action.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ γὰρ τῶν τρόπων τούτων
  choice: Car il pensait que, par ces moyens
  rationale: « Car » conserve le lien explicatif de γάρ, tandis que « par ces moyens » rend naturellement τρόποι dans ce contexte de manœuvres politiques.
- source_word: ᾠήθη
  choice: il pensait
  rationale: Le verbe exprime ici une opinion ou une supposition; « il pensait » est direct et naturel en français moderne.
- source_word: λαβὼν ἡμᾶς ἐρήμους
  choice: après nous avoir réduits à la désolation
  rationale: La tournure participiale est idiomatique. Cette formulation marque l'antériorité et exprime le fait d'amener le groupe désigné par « nous » à un état de dévastation, sans imposer une image uniquement géographique.
- source_word: τὴν τῶν Περσῶν ἐπικράτησιν
  choice: la domination des Perses
  rationale: ἐπικράτησις désigne la prépondérance ou le pouvoir exercé. « Domination » convient au registre politique et reste plus proche du nom grec que « empire ».
- source_word: εἰς τοὺς Μακεδόνας μετάξει
  choice: il ferait passer … aux Macédoniens
  rationale: Le futur μετάξει, placé sous la dépendance de « il pensait », devient naturellement un conditionnel en français. « Faire passer » exprime clairement le transfert du pouvoir d'un peuple à l'autre.
theological_decisions:
- issue: Formulation historico-politique d'une addition grecque deutérocanonique
  choice: Conserver les noms précis des Perses et des Macédoniens ainsi que l'idée d'un transfert de domination.
  alternative: Généraliser en parlant du « royaume perse » transmis « aux Grecs ».
  rationale: Le grec nomme expressément les Perses et les Macédoniens et parle de leur domination; aucune harmonisation avec une formulation historique ultérieure n'est nécessaire.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la relation explicative, la succession temporelle et la formulation politique du grec, tout en évitant un calque peu naturel.
