  text: so that both now and after these things there may be deliverance for us and for the Persians who are well-disposed toward us[a], but for those plotting against us[b], a memorial of destruction.
translation:
  language: fr
  text: afin que, maintenant comme par la suite, il y ait délivrance[a] pour nous et pour les Perses qui nous sont favorables, mais, pour ceux qui complotent contre nous, un souvenir de destruction[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « salut ». Le grec σωτηρία peut exprimer l’un ou l’autre sens ; ici, il désigne vraisemblablement une préservation concrète face au danger.
    reason: lexical_alternative
  - marker: b
    text: Ou « un mémorial de destruction », voire « un rappel de leur destruction ». L’expression grecque est concise et peut désigner un souvenir durable de la ruine des conspirateurs.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: afin que
  rationale: Introduit le but ou le résultat visé et conserve l’orientation prospective de la proposition.
- source_word: μετὰ ταῦτα
  choice: par la suite
  rationale: Expression naturelle en français moderne qui maintient le contraste temporel avec « maintenant ».
- source_word: σωτηρία
  choice: délivrance
  rationale: Dans ce contexte politique et narratif, le terme désigne concrètement le fait d’échapper au danger, tout en gardant la gravité du grec.
- source_word: εὐνοοῦσιν
  choice: qui nous sont favorables
  rationale: Rend l’idée d’une disposition bienveillante sans renforcer le sens jusqu’à « partisans » ou « alliés ».
- source_word: Πέρσαις
  choice: pour les Perses
  rationale: Le datif est coordonné à ἡμῖν comme bénéficiaire de la délivrance.
- source_word: ἐπιβουλεύουσιν
  choice: qui complotent contre nous
  rationale: Exprime clairement l’intrigue hostile et l’intention malveillante du verbe grec.
- source_word: μνημόσυνον τῆς ἀπωλείας
  choice: un mémorial de destruction
  rationale: Conserve la formulation grecque compacte et solennelle sans préciser indûment s’il s’agit du souvenir de la destruction ou d’un monument attestant la ruine des conspirateurs.
theological_decisions:
- issue: Portée de σωτηρία dans un récit de cour deutérocanonique
  choice: délivrance
  alternative: salut
  rationale: Le contexte immédiat concerne la préservation face à un danger politique. « Délivrance » convient à cette situation sans exclure une action providentielle ni imposer une acception sotériologique plus technique.
- issue: Sens de μνημόσυνον τῆς ἀπωλείας
  choice: un mémorial de destruction
  alternative: un souvenir de leur destruction
  rationale: Le génitif grec est concis et peut recevoir plusieurs nuances. La traduction principale préserve cette tension au lieu d’ajouter explicitement le possessif « leur ».
translation_notes:
  register: Français moderne, digne et légèrement solennel, adapté au ton d’un décret royal. La structure nominale de la fin est conservée afin de respecter l’ellipse et l’ambiguïté du grec.
