    rationale: « des territoires des cent vingt-sept satrapies qui s’étendent » est lourd et l’antécédent de « qui s’étendent » est peu net. « des cent vingt-sept satrapies, de l’Inde à l’Éthiopie » rend plus directement la portée géographique tout en conservant les satrapies.
  - severity: low
    issue: Note littérale à préciser
    rationale: La note actuelle rend insuffisamment le verbe φρονοῦσι. « ceux qui partagent nos vues » reproduit mieux l’idée de disposition ou d’allégeance, sans imposer une interprétation doctrinale.
