base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/005/001.yaml
  text: 'The following is a copy of the letter: Great King Artaxerxes to the rulers of the provinces of the one hundred twenty-seven satrapies from India to Ethiopia[a], and to those who are loyal to our interests: greetings.'
translation:
  language: fr
  text: 'Voici la copie de la lettre : « Le Grand Roi Artaxerxès aux gouverneurs des cent vingt-sept satrapies, de l’Inde à l’Éthiopie, ainsi qu’à ceux qui soutiennent nos intérêts[a] : salutations. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « ceux qui partagent nos vues » ou « ceux qui sont favorables à nos affaires » ; c’est-à-dire ceux qui soutiennent la cause du roi.'
    reason: La formulation grecque est idiomatique ; la note signale l’image littérale de l’adhésion aux vues ou aux affaires du roi.
lexical_decisions:
- source_word: ἀντίγραφον
  choice: copie
  rationale: Le terme désigne la reproduction écrite d’un document ; « copie » convient naturellement au contexte administratif.
- source_word: τὰ ὑπογεγραμμένα
  choice: Voici
  rationale: Cette formule introduit le contenu écrit qui suit. « Voici la copie » rend l’expression de manière claire et idiomatique en français.
- source_word: Βασιλεὺς μέγας
  choice: le grand roi
  rationale: Il s’agit du titre royal persan, conservé dans une formulation française digne et naturelle.
- source_word: σατραπείαις
  choice: satrapies
  rationale: Le mot grec reprend un terme administratif perse précis ; « satrapies » en préserve la couleur historique.
- source_word: χωρῶν ἄρχουσι
  choice: dirigeants des territoires
  rationale: Cette traduction rend les responsables qui exercent leur autorité sur les unités territoriales sans leur attribuer un titre administratif plus précis que le grec.
- source_word: τοῖς τὰ ἡμέτερα φρονοῦσι
  choice: ceux qui soutiennent nos intérêts
  rationale: L’expression idiomatique désigne ceux qui sont favorables à la cause et aux affaires du roi ; la note conserve le tour plus littéral.
- source_word: χαίρειν
  choice: salut !
  rationale: Formule épistolaire grecque courante. « Salut ! » rend ici une salutation officielle brève, sans traduire littéralement par « réjouissez-vous ».
- source_word: ἑκατὸν εἴκοσι ἑπτὰ
  choice: cent vingt-sept
  rationale: Rendu direct et conforme à l’usage français contemporain.
