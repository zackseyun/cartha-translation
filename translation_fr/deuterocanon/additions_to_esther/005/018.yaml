  text: because the very man who had brought about these things was crucified at the gate of Susa with his whole household[a], since God, who rules over all, swiftly repaid him with the punishment he deserved,
translation:
  language: fr
  text: car celui-là même qui avait accompli ces choses fut crucifié aux portes de Suse avec toute sa maisonnée[a], Dieu, qui règne sur toutes choses, lui ayant rapidement infligé le châtiment qu’il méritait,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fut empalé » ou « fut pendu à un poteau ». Le verbe grec peut désigner une exécution sur un poteau ou une croix ; la méthode perse exacte ne correspondait pas nécessairement à la crucifixion romaine plus tardive.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ
  choice: car
  rationale: Introduit la cause de l’affirmation précédente; « car » convient à la continuité syntaxique de cette proposition.
- source_word: αὐτὸν τὸν ταῦτα ἐξεργασάμενον
  choice: l’homme même qui avait manigancé tout cela
  rationale: « L’homme même » conserve l’emphase de αὐτόν avec l’article. Dans ce contexte de complot nuisible, « manigancé » rend naturellement la portée de ἐξεργάζομαι sans préciser davantage les actes.
- source_word: πρὸς ταῖς Σούσων πύλαις
  choice: aux portes de Suse
  rationale: Préserve le pluriel grec et exprime le lieu indiqué par πρός avec le datif.
- source_word: ἐσταυρῶσθαι
  choice: fut mis en croix
  rationale: Rend directement le verbe grec tout en évitant d’imposer tous les détails de la crucifixion romaine; une note signale l’éventail historique possible.
- source_word: σὺν τῇ πανοικίᾳ
  choice: avec toute sa maisonnée
  rationale: « Maisonnée » englobe la famille et les dépendants, comme πανοικία, plutôt que la seule famille nucléaire.
- source_word: τὴν καταξίαν
  choice: le châtiment qu’il méritait
  rationale: Exprime la rétribution appropriée ou méritée dans ce contexte judiciaire.
- source_word: τοῦ τὰ πάντα ἐπικρατοῦντος θεοῦ
  choice: Dieu, qui domine sur toutes choses
  rationale: Conserve l’idée de maîtrise souveraine portée par ἐπικρατέω, sans ajout doctrinal.
- source_word: διὰ τάχους
  choice: rapidement
  rationale: Rend de façon idiomatique la rapidité de l’action.
- source_word: ἀποδόντος αὐτῷ κρίσιν
  choice: lui ayant rapidement infligé le châtiment qu’il méritait
  rationale: La construction exprime une rétribution judiciaire; « infligé » est naturel en français avec « châtiment », tandis que la tournure participiale conserve le lien syntaxique avec l’action de Dieu.
theological_decisions:
- issue: Action divine dans le jugement
  choice: Dieu est explicitement présenté comme infligeant rapidement au coupable le châtiment mérité.
  alternative: Atténuer l’agentivité divine en présentant seulement l’exécution comme un jugement providentiel.
  rationale: Le génitif absolu attribue directement à Dieu la rétribution judiciaire. La traduction maintient cette affirmation et sa tension théologique sans l’élargir en système doctrinal.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste volontairement ouverte par une virgule finale, puisqu’elle constitue un segment d’une phrase plus longue. « Maisonnée » conserve l’étendue du foyer antique, et « mis en croix » maintient l’image grecque avec une note historique.
