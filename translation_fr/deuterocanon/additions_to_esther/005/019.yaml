lexical_decisions:
- source_word: ἀντίγραφον
  choice: un exemplaire
  rationale: Le terme désigne une copie d’un document. « Un exemplaire » convient naturellement au contexte administratif.
- source_word: ἐπιστολῆς
  choice: lettre
  rationale: ἐπιστολή signifie couramment « lettre » ; ce choix évite de préciser excessivement qu’il s’agit d’un décret.
- source_word: ἐκθέντες
  choice: après avoir affiché
  rationale: Le participe évoque ici l’action d’exposer un document au public. La tournure conserve son rapport syntaxique avec l’infinitif qui suit.
- source_word: ἐν παντὶ τόπῳ
  choice: en tout lieu
  rationale: Cette formulation garde la valeur distributive de l’expression grecque dans un registre digne et naturel.
- source_word: μετὰ παρρησίας
  choice: publiquement
  rationale: Dans le contexte de la promulgation d’une lettre officielle, l’expression indique une diffusion ouverte et publique plutôt qu’une hardiesse psychologique.
- source_word: ἐᾶν
  choice: permettre
  rationale: L’infinitif signifie « laisser » ou « permettre » et s’inscrit ici dans une série de dispositions administratives.
- source_word: χρῆσθαι
  choice: suivre
  rationale: Littéralement « faire usage de », le verbe désigne ici le fait de vivre selon des règles ou pratiques établies. « Suivre » est idiomatique en français avec « lois ».
- source_word: τοῖς ἑαυτῶν νομίμοις
  choice: leurs propres lois
  rationale: νόμιμα peut désigner des lois, des prescriptions ou des coutumes établies. « Leurs propres lois » convient au contexte communautaire et juridique, tandis que l’autre sens est signalé en note.
