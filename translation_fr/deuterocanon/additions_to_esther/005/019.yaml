  text: And after posting a copy of this letter in every place openly[a], to permit the Jews to make use of their own laws,
translation:
  language: fr
  text: Après avoir affiché publiquement un exemplaire de cette lettre en tout lieu, permettre aux Juifs de suivre leurs propres lois[a],
  philosophy: optimal-equivalence
  footnotes:
