  yaml_path: translation/deuterocanon/additions_to_esther/005/010.yaml
  text: For Haman son of Hammedatha[a], a Macedonian, being alien to the true Persian blood and far removed from our goodwill, though he had been received by us as a guest[b],
translation:
  language: fr
  text: Car Haman, fils d’Hammedatha, un Macédonien[a], étranger au véritable sang perse[b] et très éloigné de notre bienveillance, bien qu’il ait reçu de nous l’hospitalité,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec appelle explicitement Haman « un Macédonien ». Cette désignation appartient au texte de l’addition grecque et peut refléter son cadre historique ou sa présentation polémique.
    reason: cultural_note
  - marker: b
    text: 'La construction grecque est difficile. Elle semble signifier qu’Haman n’était pas d’ascendance perse authentique; on pourrait aussi traduire plus littéralement : « étranger au sang des Perses ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἁμὰν Ἁμαδάθου
  choice: Haman, fils d’Hammedatha
  rationale: Le génitif patronymique désigne naturellement Haman comme le fils d’Hammedatha.
- source_word: Μακεδὼν
  choice: un Macédonien
  rationale: Le substantif donne explicitement à Haman une identité ethnique ou nationale dans l’addition grecque.
- source_word: ταῖς ἀληθείας ἀλλότριος τοῦ τῶν Περσῶν αἵματος
  choice: étranger au véritable sang perse
  rationale: La construction grecque transmise est difficile, mais elle présente Haman comme étranger à une ascendance perse authentique. « Sang » conserve l’image généalogique du grec, tandis que « véritable » rend prudemment la notion d’authenticité associée à ἀληθείας.
- source_word: πολὺ διεστηκὼς
  choice: très éloigné
  rationale: Le participe parfait décrit un état de profonde distance ou de séparation.
- source_word: τῆς ἡμετέρας χρηστότητος
  choice: de notre bienveillance
  rationale: Dans ce contexte royal et politique, χρηστότης désigne la bonté ou la faveur accordée par le souverain.
- source_word: ἐπιξενωθεὶς ἡμῖν
  choice: bien que nous l’ayons accueilli comme un hôte
  rationale: La forme passive évoque l’hospitalité accordée à quelqu’un; la tournure concessive fait ressortir le contraste contextuel.
theological_decisions:
- issue: Désignation ethnique d’Haman dans l’addition grecque
  choice: Conserver « un Macédonien » dans le texte principal
  alternative: Atténuer cette désignation en traduisant simplement « un étranger »
  rationale: Le texte grec porte explicitement Μακεδών. Cette indication historiquement chargée doit être traduite plutôt que corrigée à partir d’une reconstruction hypothétique.
- issue: Construction difficile autour de ἀληθείας et du sang perse
  choice: « étranger au véritable sang perse »
  alternative: « étranger au sang des Perses »
  rationale: La traduction retenue préserve la notion apparente d’authenticité sans masquer la difficulté syntaxique; une note signale que la formulation grecque est incertaine.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase reste ouverte par une virgule, conformément au grec, puisqu’elle se poursuit au verset suivant. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
