  yaml_path: translation/deuterocanon/additions_to_esther/005/015.yaml
  text: But we find that the Jews, who have been handed over to destruction by that thrice-accursed man, are not criminals, but are governed by most righteous laws,
translation:
  language: fr
  text: Mais nous constatons que les Juifs livrés à la destruction par cet homme trois fois maudit[a] ne sont pas des criminels, mais qu’ils vivent selon des lois très justes[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par cet être trois fois maudit ». Le grec emploie une insulte exceptionnellement forte pour désigner l’homme responsable.
    reason: lexical_alternative
  - marker: b
    text: Ou « organisent leur vie civique selon des lois très justes ». Le verbe grec évoque la manière de vivre ou de se conduire en tant que citoyens.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Mais nous
  rationale: δέ marque ici le contraste avec l’accusation et la politique précédentes; « Mais nous » restitue naturellement cette opposition.
- source_word: τοὺς ... Ἰουδαίους
  choice: les Juifs
  rationale: Dans le contexte grec d’Esther, le terme désigne le peuple juif comme groupe ethnique et religieux.
- source_word: ὑπὸ τοῦ τρισαλιτηρίου
  choice: par cet homme trois fois maudit
  rationale: τρισαλιτήριος est une insulte intensive rare; « trois fois maudit » en conserve la vigueur, tandis que « cet homme » explicite naturellement le référent personnel.
- source_word: παραδεδομένους εἰς ἀφανισμόν
  choice: livrés à la destruction
  rationale: La tournure conserve le passif et la destination funeste exprimée par εἰς ἀφανισμόν, sans préciser davantage que le grec.
- source_word: εὑρίσκομεν
  choice: nous constatons
  rationale: Dans ce contexte de réexamen officiel, « constater » exprime une conclusion fondée sur l’examen et convient au registre d’un décret royal.
- source_word: οὐ κακούργους ὄντας
  choice: ne sont pas des criminels
  rationale: κακοῦργος peut désigner un malfaiteur ou un criminel; le terme français convient au cadre judiciaire.
- source_word: δικαιοτάτοις ... νόμοις
  choice: des lois parfaitement justes
  rationale: Cette formulation préserve la valeur superlative de δικαιοτάτοις et sa portée à la fois juridique et morale dans un français naturel.
- source_word: πολιτευομένους
  choice: vivent selon
  rationale: Le moyen πολιτεύομαι décrit ici la manière de mener sa vie collective ou civique conformément à des lois; « vivent selon » évite d’introduire à tort une idée purement passive de gouvernement.
theological_decisions:
- issue: Valeur juridique et morale de δικαιοτάτοις
  choice: parfaitement justes
  alternative: très droites; les plus justes
  rationale: « Justes » maintient ensemble les dimensions juridique et éthique du terme, et « parfaitement » rend idiomatiquement le superlatif sans imposer une comparaison explicite absente du contexte immédiat.
- issue: Sens de πολιτευομένους avec νόμοις
  choice: vivent selon des lois
  alternative: sont régis par des lois
  rationale: Le verbe décrit plus directement la conduite civique des Juifs que l’action exercée sur eux par les lois. La traduction choisie préserve leur pratique active sans exclure l’organisation communautaire.
