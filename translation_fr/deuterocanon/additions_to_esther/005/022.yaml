  text: And so you also[a], on your appointed festivals, keep a notable day with every kind of feasting,
translation:
  language: fr
  text: Ainsi donc, vous aussi, lors de vos fêtes désignées[a], célébrez un jour remarquable avec toutes sortes de festins,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lors de vos fêtes commémoratives » ou « lors de vos fêtes portant un nom ». L’expression grecque désigne littéralement des fêtes qui portent un nom ou une désignation.
