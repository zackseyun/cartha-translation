lexical_decisions:
- source_word: καὶ ὑμεῖς οὖν
  choice: Ainsi donc, vous aussi
  rationale: Conserve à la fois le lien exprimé par καί, la conclusion marquée par οὖν et l’insistance sur ὑμεῖς, dans un français naturel.
- source_word: ἐν ταῖς ἐπωνύμοις ὑμῶν ἑορταῖς
  choice: lors de vos fêtes désignées
  rationale: « Lors de » rend naturellement l’emploi temporel de ἐν. « Désignées » préserve l’idée de fêtes portant un nom ou une désignation, sans préciser abusivement qu’elles auraient seulement été fixées par autorité.
- source_word: ἐπίσημον ἡμέραν
  choice: un jour remarquable
  rationale: ἐπίσημος qualifie ce qui est marqué, distingué ou notable ; « remarquable » conserve ce relief commémoratif.
- source_word: μετὰ πάσης εὐωχίας
  choice: avec toutes sortes de festins
  rationale: εὐωχία évoque concrètement les festins et les réjouissances de table ; le pluriel idiomatique avec « toutes sortes de » rend la portée de πάσης.
- source_word: ἄγετε
  choice: célébrez
  rationale: Dans le contexte d’un jour de fête, l’impératif signifie observer ou célébrer ce jour ; « célébrez » est actuel, clair et digne.
