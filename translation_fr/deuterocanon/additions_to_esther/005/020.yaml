  text: and to strengthen them[a], so that they might defend themselves against those who attacked them in the time of distress, on the thirteenth day of the twelfth month, Adar[b], on that same day.
translation:
  language: fr
  text: et de les soutenir[a], afin qu’ils puissent se défendre contre ceux qui les attaqueraient au temps de détresse[b], le treizième jour du douzième mois, Adar, ce jour-là même.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de les renforcer » ou « de leur prêter main-forte ».
    reason: lexical_alternative
  - marker: b
    text: 'L’expression peut aussi se comprendre de manière plus générale : « en un temps d’épreuve » ou « en un temps d’affliction ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεπισχύειν
  choice: leur prêter main-forte
  rationale: L’infinitif exprime l’apport d’un soutien ou d’un renfort supplémentaire. « Prêter main-forte » est naturel en français et convient au contexte d’une défense autorisée.
- source_word: ὅπως
  choice: afin que
  rationale: La conjonction introduit le but; « afin que » en conserve clairement la valeur finale.
- source_word: ἐν καιρῷ θλίψεως
  choice: en ce temps de détresse
  rationale: θλῖψις évoque une situation de pression, d’épreuve ou de calamité. Le démonstratif français rattache naturellement cette détresse à l’attaque mentionnée, sans exclure le sens plus général de « temps d’épreuve ».
- source_word: ἐπιθεμένους
  choice: ceux qui les attaqueraient
  rationale: Le participe a ici un sens hostile. Le conditionnel s’accorde au point de vue prospectif du décret, tandis que « attaquer » rend directement l’action violente.
- source_word: ἀμύνωνται
  choice: ils puissent se défendre
  rationale: La voix moyenne indique une action accomplie pour leur propre protection; « se défendre » en restitue simplement la portée réflexive.
- source_word: τῇ τρισκαιδεκάτῃ τοῦ δωδεκάτου μηνὸς Ἀδὰρ
  choice: le treizième jour du douzième mois, appelé Adar
  rationale: Cette formulation conserve tous les éléments de la date grecque et précise naturellement en français qu’Adar est le nom du mois.
- source_word: τῇ αὐτῇ ἡμέρᾳ
  choice: ce jour-là même
  rationale: Cette expression préserve l’insistance du grec sur l’identité exacte du jour fixé.
