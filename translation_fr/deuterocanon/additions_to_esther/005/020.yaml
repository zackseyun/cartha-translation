  source_fidelity: 'Le sens général est bien rendu : soutien accordé aux Juifs, but de l’autodéfense, adversaires hostiles et date précise. Cependant, « prêter main-forte » suggère plus précisément venir combattre à leurs côtés, tandis que συνεπισχύειν désigne le fait de leur procurer un soutien ou un surcroît de force. « Appelé Adar » ajoute aussi une explicitation absente du grec, qui présente simplement Adar comme le nom du mois.'
  naturalness: La phrase est fluide et conserve à juste titre l’infinitif initial dépendant du contexte. « En ce temps de détresse » est toutefois plus démonstratif que ἐν καιρῷ θλίψεως; « au temps de détresse » est plus proche tout en restant naturel. Le conditionnel « attaqueraient » convient au cadre prospectif du décret.
  terminology: « Se défendre », « détresse » et « Adar » sont appropriés. « Les soutenir » est un équivalent moderne, naturel et suffisamment large pour συνεπισχύειν; la note conserve les possibilités de « renforcer » et de « prêter main-forte ».
