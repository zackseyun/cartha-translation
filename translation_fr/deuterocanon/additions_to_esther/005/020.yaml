    rationale: « Appelé Adar » n’est pas requis par le grec, qui dit littéralement « du douzième mois, Adar ». L’apposition française suffit.
  - severity: low
    issue: Démonstratif dans « en ce temps de détresse »
    rationale: Le grec emploie l’expression indéfinie « en temps de détresse », sans démonstratif qui rattacherait explicitement la détresse à un moment déjà déterminé.
