    issue: « établis dans des fonctions d’autorité » est lourd en français moderne.
    rationale: « Placés à des postes d’autorité » exprime plus naturellement l’idée de personnes désignées à l’exercice d’une autorité.
  - severity: low
    issue: La construction « à qui l’on avait fait confiance, comme à des amis, pour gérer les affaires » est syntaxiquement pesante.
    rationale: « À qui l’on avait confié, en tant qu’amis, la gestion des affaires » maintient les trois éléments du grec — confiance, statut d’amis et gestion des affaires — de manière plus fluide.
