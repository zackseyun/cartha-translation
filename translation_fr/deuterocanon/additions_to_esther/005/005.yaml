revisions:
- from: Et souvent aussi[a], dans sa folie, elle a rendu complices du sang innocent[b] beaucoup de ceux qui avaient été établis dans des fonctions d’autorité et à qui l’on avait fait confiance, comme à des amis, pour gérer les affaires; elle les a accablés de malheurs irréparables,
  to: Et souvent aussi[a], par folie, elle a fait de beaucoup de ceux qui avaient été placés à des postes d’autorité, à qui l’on avait confié, en tant qu’amis, la gestion des affaires, des complices du sang innocent[b] ; elle les a accablés de malheurs irréparables,
  rationale: La révision supprime le possessif interprétatif ajouté à παρανοίᾳ, améliore l’idiomaticité française des postes d’autorité et clarifie la syntaxe dense relative aux personnes de confiance, considérées comme amies et chargées de gérer les affaires. Elle conserve l’ambiguïté du sujet féminin, le champ sémantique de la complicité et le caractère irréparable des calamités.
