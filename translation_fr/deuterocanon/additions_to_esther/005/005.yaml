    issue: « dans sa folie » introduit un possessif absent du grec.
    rationale: παρανοίᾳ est un datif sans possessif. « Sa folie » peut suggérer que le texte identifie expressément la folie comme appartenant au sujet féminin. « Par folie » est plus fidèle tout en restant naturel.
