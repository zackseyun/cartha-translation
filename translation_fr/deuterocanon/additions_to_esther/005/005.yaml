  verdict: revise
  source_fidelity: 'Le sens principal est bien rendu : le sujet féminin demeure non identifié, les hommes en fonction sont faits participants à une effusion de sang innocent, puis frappés de calamités irréparables. Toutefois, « dans sa folie » attribue plus explicitement la folie au sujet (« sa ») que ne le fait le datif nu παρανοίᾳ. « Par folie » conserve mieux l’ambiguïté circonstancielle/instrumentale du grec.'
  naturalness: La phrase est globalement claire et d’un registre soutenu accessible. « Établis dans des fonctions d’autorité » est toutefois moins idiomatique que « placés à des postes d’autorité », et la relation entre la confiance, l’amitié et la gestion des affaires gagne à être formulée plus directement.
  terminology: « Complices du sang innocent » rend convenablement μετόχους αἱμάτων ἀθώων et conserve l’expression biblique imagée. « Malheurs irréparables » rend avec justesse συμφοραῖς ἀνηκέστοις. Les notes conservent l’ambiguïté du sujet féminin et l’alternative lexicale sans imposer d’identification interprétative.
  issues:
