base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/005/005.yaml
  text: And often[a], by madness, she has made many of those appointed to positions of authority, trusted to manage affairs as friends, sharers in innocent blood, and has engulfed them in disasters beyond remedy[b],
translation:
  language: fr
  text: Et souvent aussi[a], par folie, elle a fait de beaucoup de ceux qui avaient été placés à des postes d’autorité, à qui l’on avait confié, en tant qu’amis, la gestion des affaires, des complices du sang innocent[b] ; elle les a accablés de malheurs irréparables,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En grec, le sujet des verbes est féminin singulier (« elle a fait… elle les a accablés »), mais son référent n’est pas explicitement nommé dans ce verset.
    reason: alternative_reading
  - marker: b
    text: Ou « participants au sang d’innocents ». L’expression désigne la complicité dans l’effusion de sang innocent.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάκις
  choice: souvent
  rationale: L’adverbe exprime la répétition; « souvent » est direct et naturel en français moderne.
- source_word: τῶν ἐπʼ ἐξουσίας τεταγμένων
  choice: ceux qui avaient été établis dans des fonctions d’autorité
  rationale: Le participe parfait passif indique une nomination ou une mise en fonction, et ἐξουσία désigne ici l’autorité officielle.
- source_word: τῶν πιστευθέντων χειρίζειν φίλων τὰ πράγματα
  choice: à qui l’on avait fait confiance, comme à des amis, pour gérer les affaires
  rationale: Cette formulation conserve l’idée d’hommes jugés dignes de confiance, leur qualité d’amis et la mission de gérer les affaires, sans durcir la syntaxe grecque comprimée.
- source_word: παρανοίᾳ
  choice: dans sa folie
  rationale: παρανοία évoque la folie ou le dérèglement. La tournure française exprime naturellement la circonstance ou le moyen, sans atténuer la force du terme.
- source_word: μετόχους αἱμάτων ἀθώων
  choice: complices du sang innocent
  rationale: μετόχους indique la participation ou la complicité; l’expression grecque « sang innocent » évoque la responsabilité dans l’effusion du sang d’innocents.
- source_word: καταστῆσα
  choice: elle a rendu
  rationale: 'Le participe a ici une valeur causative: elle a fait de ces personnes des participants ou complices.'
- source_word: περιέβαλε
  choice: elle les a accablés
  rationale: Le verbe signifie littéralement entourer ou envelopper; avec des malheurs, « accabler » rend naturellement l’idée d’être submergé.
- source_word: συμφοραῖς ἀνηκέστοις
  choice: de malheurs irréparables
  rationale: συμφοραί désigne des calamités ou malheurs, tandis que ἀνήκεστος signifie qu’on ne peut y remédier.
theological_decisions:
- issue: Référent du sujet féminin singulier porté par les formes verbales
  choice: Employer « elle » sans identifier le référent
  alternative: Identifier le sujet comme la Fortune, la colère du roi ou une impulsion destructrice personnifiée
  rationale: Le grec impose un sujet féminin singulier, mais le verset isolé ne le nomme pas explicitement. La traduction maintient cette ambiguïté au lieu d’ajouter une identification interprétative.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase garde l’ampleur rhétorique du grec tout en clarifiant ses groupes participiaux. Le féminin « elle » et l’expression imagée « sang innocent » sont conservés afin de ne pas résoudre les ambiguïtés du texte source.
