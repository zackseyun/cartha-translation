base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/005/007.yaml
  text: But consider whether it is possible[a], not so much from the earlier histories that we have handed down as from the things lying at your feet, while you investigate[c][b], to discern how many lawless deeds have been accomplished by the pestilence of those who rule unworthily.
translation:
  language: fr
  text: Mais voyez s’il vous est possible de discerner, non pas tant d’après les récits anciens que nous avons transmis que, en examinant ce qui est sous vos yeux[a], combien d’actes impies[b] ont été perpétrés par le fléau[c] de ceux qui exercent indignement le pouvoir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ce qui est à vos pieds »; l’expression désigne ce qui est immédiatement présent.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « iniques ». Le terme grec peut souligner aussi bien l’impiété que la profonde perversité morale.'
    reason: lexical_alternative
  - marker: c
    text: Le mot traduit par « fléau » désigne littéralement une peste; il caractérise ici de façon imagée l’action destructrice de ceux qui exercent indignement le pouvoir.
    reason: cultural_note
lexical_decisions:
- source_word: σκοπεῖτε δὲ
  choice: Mais considérez ceci
  rationale: L’impératif pluriel appelle à un examen attentif. « Considérez » rend la réflexion demandée, tandis que « ceci » permet une articulation naturelle avec la proposition qui suit.
- source_word: ἐξέστιν
  choice: vous pouvez
  rationale: Dans ce contexte, le verbe exprime la possibilité de constater ou de discerner, plutôt qu’une permission.
- source_word: ἐκ τῶν παλαιοτέρων ὡς παρεδώκαμεν ἱστοριῶν
  choice: à partir des récits anciens que nous avons transmis
  rationale: « Récits anciens » rend le caractère historique des ἱστορίαι; « que nous avons transmis » conserve explicitement παρεδώκαμεν.
- source_word: παρὰ πόδας ὑμᾶς
  choice: ce qui se trouve sous vos yeux
  rationale: L’expression signifie littéralement « à vos pieds » et désigne ici les faits immédiatement présents et accessibles à l’examen. L’idiome français « sous vos yeux » en restitue naturellement la portée.
- source_word: ἐξητοῦντας
  choice: en examinant
  rationale: Le participe évoque une recherche ou un examen approfondi; le gérondif conserve son lien circonstanciel avec les destinataires.
- source_word: ὅσα ... ἀνοσίως συντετελεσμένα
  choice: combien d’actes impies ont été perpétrés
  rationale: « Combien » rend la valeur quantitative de ὅσα. « Impies » conserve la forte condamnation morale et religieuse de ἀνοσίως, et « ont été perpétrés » exprime le résultat accompli du parfait passif.
- source_word: τῇ ... λοιμότητι
  choice: par le fléau
  rationale: Le datif est compris comme indiquant la cause ou l’agentivité. « Fléau » préserve l’image destructrice de λοιμότης tout en restant idiomatique en français.
- source_word: τῶν ἀναξία δυναστευόντων
  choice: de ceux qui exercent indignement le pouvoir
  rationale: ἀναξία fonctionne adverbialement et qualifie la manière d’exercer la domination; cette formulation évite de transformer le texte en simple description de « dirigeants indignes ».
theological_decisions:
- issue: Portée morale et religieuse de ἀνοσίως
  choice: actes impies
  alternative: actes iniques
  rationale: Le grec peut dénoncer à la fois l’irrévérence envers ce qui est saint et une grave transgression morale. « Impies » maintient la dimension religieuse sans préciser davantage la nature des actes.
- issue: Image de λοιμότης appliquée aux détenteurs du pouvoir
  choice: le fléau de ceux qui exercent indignement le pouvoir
  alternative: la corruption de ceux qui exercent indignement le pouvoir
  rationale: Le choix retient l’image vive de la peste ou du fléau, sans la réduire à la seule corruption morale ni expliquer dans le corps du texte comment fonctionne exactement la métaphore.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue période grecque est légèrement réorganisée pour être intelligible sans supprimer ses contrastes. Les images de proximité et de pestilence sont conservées sous une forme française naturelle, et l’ambivalence morale et religieuse de ἀνοσίως est signalée en note.
