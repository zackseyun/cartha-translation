base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/005/013.yaml
  text: having sought[a], by devious schemes of deceit, the destruction of Mordecai, our savior and continual benefactor, and Esther, the blameless partner of the kingdom[b], together with all their nation.
translation:
  language: fr
  text: ayant demandé, par des manœuvres retorses et des raisonnements trompeurs[b], que soient voués à la destruction Mardochée, notre sauveur[a] et bienfaiteur de toujours, ainsi qu’Esther, l’irréprochable associée à la royauté[c], avec tout leur peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « libérateur ». Ici, « sauveur » désigne Mardochée comme celui qui a sauvé ou préservé ; ce n’est pas nécessairement un titre religieux.
    reason: lexical_alternative
  - marker: b
    text: Le grec accumule des termes péjoratifs évoquant des manœuvres complexes et tortueuses, ainsi que des raisonnements fallacieux.
    reason: lexical_clarification
  - marker: c
    text: Le terme grec peut aussi se comprendre comme « royaume » ou « règne » ; l’expression présente Esther comme y ayant part.
    reason: preserved_ambiguity
lexical_decisions:
- source_word: σωτῆρα
  choice: sauveur
  rationale: Le nom grec désigne celui qui sauve ou délivre. Ici, il qualifie Mardochée en raison du salut qu’il a procuré, sans constituer nécessairement un titre religieux.
- source_word: διὰ παντὸς εὐεργέτην
  choice: bienfaiteur de toujours
  rationale: Cette expression rend à la fois la continuité marquée par διὰ παντός et la portée publique de εὐεργέτης dans le cadre royal.
- source_word: ἄμεμπτον
  choice: irréprochable
  rationale: Le terme exprime l’absence de faute ou de reproche et convient au registre officiel du passage.
- source_word: κοινωνὸν τῆς Βασιλείας
  choice: associée à la royauté
  rationale: κοινωνός exprime la participation ou le partage. « Royauté » conserve ici l’ambiguïté entre la dignité royale, le règne et le royaume, sans réduire Esther à une simple compagne personnelle.
- source_word: σὺν παντὶ τῷ τούτων ἔθνει
  choice: avec tout leur peuple
  rationale: Le démonstratif pluriel renvoie naturellement à Mardochée et Esther; « peuple » est plus idiomatique en français actuel que « nation » dans cette désignation collective.
- source_word: πολυπλόκοις μεθόδων παραλογισμοῖς
  choice: par les raisonnements trompeurs de manœuvres retorses
  rationale: 'La formulation garde les deux dimensions du groupe grec: les procédés complexes et tortueux, et la tromperie ou le raisonnement fallacieux.'
- source_word: αἰτησάμενος εἰς ἀπώλειαν
  choice: ayant demandé … que soient voués à la destruction
  rationale: Le participe indique une demande, tandis que εἰς ἀπώλειαν en exprime l’issue recherchée. Cette tournure française reste naturelle tout en conservant la structure de requête.
theological_decisions:
- issue: Emploi de « sauveur » pour Mardochée
  choice: sauveur
  alternative: libérateur; celui qui nous a sauvés
  rationale: Le mot σωτήρ possède ici son sens courant de personne qui sauve ou préserve. Le traduire directement respecte le grec sans lui imposer un sens messianique ou divin.
- issue: Référent de « leur peuple »
  choice: Le peuple commun de Mardochée et d’Esther
  alternative: son peuple; le peuple de ces gens
  rationale: Le pluriel τούτων renvoie le plus naturellement aux deux personnes nommées et les rattache ensemble au peuple visé.
- issue: Sens de βασιλεία
  choice: royauté
  alternative: royaume; règne
  rationale: Le grec peut évoquer le royaume, le pouvoir royal ou la condition royale. « Royauté » préserve mieux cette ouverture dans la formule appliquée à Esther.
translation_notes:
  register: Fragment syntaxiquement rattaché au contexte précédent. Le français conserve la forme participiale (« ayant demandé »), le ton solennel d’un décret royal et l’accumulation accusatrice du grec, tout en restant compréhensible dans un registre moderne international.
