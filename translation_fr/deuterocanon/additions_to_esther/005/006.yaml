translation:
  language: fr
  text: ayant, par le faux raisonnement de la malveillance, mal jugé la bienveillance intègre de ceux qui exercent le pouvoir[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’étant trompés sur la bienveillance pure des dirigeants ». Le grec emploie deux mots de la même famille pour « raisonnement » et « mal jugé », soulignant ainsi une conclusion erronée.
    reason: lexical_alternative
lexical_decisions:
- source_word: κακοηθείας
  choice: malveillance
  rationale: Le nom désigne ici une disposition morale mauvaise qui se manifeste par l’hostilité ou la malignité. « Malveillance » convient au registre et s’associe naturellement à un raisonnement trompeur.
- source_word: ψευδεῖ
  choice: trompeur
  rationale: L’adjectif qualifie le raisonnement de faux ou propre à égarer. « Trompeur » rend bien sa force dans cette construction française.
- source_word: παραλογισμῷ
  choice: raisonnement
  rationale: Le terme évoque un raisonnement fautif ou spécieux. Le qualificatif « trompeur » exprime déjà son caractère erroné, sans qu’il soit nécessaire de renforcer davantage le substantif.
- source_word: παραλογισαμένων
  choice: ayant mal jugé
  rationale: Le participe, apparenté à παραλογισμῷ, indique qu’une conclusion erronée a été tirée au sujet de la disposition des autorités. « Ayant mal jugé » reste clair tout en laissant la note signaler la répétition étymologique grecque.
- source_word: ἐπικρατούντων
  choice: ceux qui exercent le pouvoir
  rationale: Le participe désigne des personnes en situation de domination ou d’autorité, sans préciser une fonction officielle particulière.
- source_word: ἀκέραιον
  choice: sans mélange
  rationale: Le mot signifie littéralement non mêlé, intact ou pur. « Sans mélange » conserve cette image et ne réduit pas le sens à la seule sincérité psychologique.
- source_word: εὐγνωμοσύνην
  choice: bienveillance
  rationale: Dans ce contexte, le nom désigne la disposition favorable et généreuse des détenteurs du pouvoir plutôt que de la gratitude.
theological_decisions:
- issue: Valeur syntaxique de τῶν ἐπικρατούντων dans τὴν τῶν ἐπικρατούντων ἀκέραιον εὐγνωμοσύνην
  choice: la bienveillance appartient à ceux qui exercent le pouvoir
  alternative: la gratitude manifestée envers ceux qui exercent le pouvoir
  rationale: 'Le génitif se comprend le plus naturellement comme subjectif : les détenteurs du pouvoir sont ceux qui font preuve de bienveillance. La lecture orientant la disposition vers eux est grammaticalement possible, mais moins naturelle dans ce contexte.'
translation_notes:
  register: Fragment participial conservé comme dans le segment grec. Langue actuelle et digne ; « ceux qui exercent le pouvoir » évite de réduire le référent à un titre politique précis.
