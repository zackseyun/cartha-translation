translation:
  language: fr
  text: un homme juif qui habitait dans la ville de Suse[a], un homme important[b] qui servait à la cour du roi[c] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à Suse, la ville »; on peut aussi traduire : « à Suse » en comprenant que le grec précise qu’il s’agit de la ville.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « un grand homme »; dans ce contexte, le terme évoque probablement son rang ou son importance.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « qui exerçait ses fonctions à la cour du roi ». Le participe grec peut désigner le service ou l’assistance auprès de la cour.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος Ἰουδαῖος
  choice: un homme juif
  rationale: Le nom masculin désigne ici un homme précis, et l’adjectif indique son identité juive. Cette formulation est naturelle et fidèle en français.
- source_word: οἰκῶν
  choice: qui habitait
  rationale: Le participe exprime le fait de résider. L’imparfait convient à la présentation narrative d’une situation durable.
- source_word: ἐν Σούσοις τῇ πόλει
  choice: dans la ville de Suse
  rationale: Cette tournure française naturelle conserve à la fois le nom du lieu et la précision explicite « la ville ».
- source_word: μέγας
  choice: important
  rationale: Dans le cadre de la cour royale, l’adjectif qualifie vraisemblablement le rang ou la notabilité plutôt que la taille physique.
- source_word: θεραπεύων
  choice: qui servait
  rationale: Dans ce contexte, le participe désigne le service ou les fonctions exercées auprès de la cour, sans connotation religieuse nécessaire.
- source_word: ἐν τῇ αὐλῇ τοῦ βασιλέως
  choice: à la cour du roi
  rationale: αὐλή renvoie ici à la sphère de la cour royale; « à la cour » est l’expression française idiomatique.
