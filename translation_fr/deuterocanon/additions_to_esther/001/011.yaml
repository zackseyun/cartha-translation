  text: And when Mordecai awoke[a], after seeing this dream and what God had purposed to do, he kept it in his heart[b], and in every matter he wanted to understand it until nightfall.
translation:
  language: fr
  text: À son réveil, Mardochée, après avoir vu ce rêve et ce que Dieu avait décidé de faire, le gardait dans son cœur[a] et voulait le comprendre à tous égards[b], jusqu’à la nuit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec imprimé présente ici ce qui semble être un léger accident de copie ou d’impression (« ἐν Β τῇ καρδίᾳ »). Le sens attendu est naturellement « dans son cœur ».
    reason: textual_variant
  - marker: b
    text: Ou « en toute chose » ou, plus littéralement, « dans toute parole ». L’expression grecque demeure assez large et peut désigner tout aspect ou toute affaire lié au rêve.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεγερθείς
  choice: À son réveil
  rationale: Le participe aoriste passif marque ici la circonstance temporelle; cette tournure française est naturelle et respecte la succession du récit sans imposer l’idée qu’un agent extérieur l’aurait réveillé.
- source_word: ἑωρακώς τὸ ἐνύπνιον τοῦτο
  choice: après avoir vu ce rêve
  rationale: Le participe parfait exprime une perception accomplie antérieure à l’action principale. «Rêve» est le sens ordinaire de ἐνύπνιον et évite de surinterpréter par «vision».
- source_word: τί ὁ θεὸς βεβούλευται ποιῆσαι
  choice: ce que Dieu avait décidé de faire
  rationale: Le parfait moyen de βουλεύω exprime une intention arrêtée. «Avait décidé» restitue clairement cette résolution en français courant et digne.
- source_word: εἶχεν αὐτὸ ... τῇ καρδίᾳ
  choice: le garda dans son cœur
  rationale: Cette formulation conserve l’image anthropologique du cœur et suggère à la fois la rétention intérieure et la méditation.
- source_word: ἐν παντὶ λόγῳ
  choice: en toute chose
  rationale: λόγος peut désigner une parole, une affaire ou un aspect. Dans ce contexte, l’expression reste large; «en toute chose» en préserve l’ambiguïté mieux qu’une restriction au discours.
- source_word: ἤθελεν ἐπιγνῶναι αὐτό
  choice: chercha à en comprendre le sens
  rationale: L’imparfait indique une volonté ou une démarche prolongée, tandis que ἐπιγινώσκω évoque une connaissance approfondie. La formulation française explicite naturellement l’objet de sa réflexion sans fournir d’interprétation du rêve.
- source_word: ἕως τῆς νυκτός
  choice: jusqu’à la nuit
  rationale: La traduction garde simplement le terme grec νύξ et le point d’aboutissement temporel, sans le préciser indûment comme «soir» ou «tombée de la nuit».
theological_decisions:
- issue: Intention divine exprimée par βεβούλευται
  choice: ce que Dieu avait décidé de faire
  alternative: ce que Dieu avait projeté de faire
  rationale: «Décidé» rend l’intention arrêtée du parfait sans développer la nature du dessein divin au-delà du texte.
- issue: Image anthropologique de la καρδία
  choice: le garda dans son cœur
  alternative: le garda à l’esprit
  rationale: Le maintien de «cœur» respecte l’image biblique et sa portée à la fois cognitive, intérieure et affective, sans la réduire à une activité purement intellectuelle.
translation_notes:
  register: Français international moderne, fluide et digne. Le nom Μαρδοχαῖος est rendu selon la forme biblique française usuelle «Mardochée». La syntaxe conserve le mouvement méditatif du verset et les notes signalent à la fois l’anomalie textuelle et l’étendue sémantique de λόγος.
