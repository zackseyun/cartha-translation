  text: And behold[a], two great dragons came forward, both ready to fight; and a great sound came from them[b],
translation:
  language: fr
  text: Et voici que deux grands dragons s’avancèrent, tous deux prêts à combattre[a] ; et un grand bruit se fit entendre, venant d’eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prêts à lutter corps à corps » ; le verbe grec peut désigner plus précisément la lutte ou un combat rapproché.
    reason: lexical_alternative
  - marker: b
    text: Ou « un grand cri » ou « une grande voix » ; le mot grec peut désigner une voix, un cri ou un son.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici que
  rationale: Cette tournure naturelle en français conserve la vivacité de l’introduction à la scène visionnaire sans recourir à une formulation archaïque.
- source_word: δράκοντες μεγάλοι
  choice: deux grands dragons
  rationale: « Dragons » préserve directement l’imagerie symbolique et visionnaire du grec ; « grands » peut évoquer à la fois leur taille et leur caractère imposant.
- source_word: προῆλθον
  choice: s’avancèrent
  rationale: Le verbe exprime ici leur mouvement en avant, vers l’affrontement ; « s’avancèrent » est précis et naturel.
- source_word: ἕτοιμοι ... ἀμφότεροι
  choice: tous deux prêts
  rationale: La formulation française rend explicitement que chacun des deux dragons est prêt.
- source_word: παλαίειν
  choice: à combattre
  rationale: « Combattre » exprime naturellement l’affrontement hostile dans ce contexte, tandis que la nuance possible de lutte corps à corps est conservée en note.
- source_word: φωνὴ μεγάλη
  choice: un grand bruit
  rationale: φωνή peut désigner une voix, un cri ou un son. « Grand bruit » préserve l’intensité sans supposer qu’il s’agit de paroles articulées.
- source_word: αὐτῶν
  choice: venant d’eux
  rationale: Cette formulation rend clairement le génitif comme indiquant la source du bruit.
theological_decisions:
- issue: Nature des dragons dans la vision de Mardochée
  choice: Conserver l’image sous la forme littérale « dragons » sans l’interpréter dans le texte principal.
  alternative: Identifier les dragons à des personnages historiques, des peuples ou des royaumes.
  rationale: Ce verset présente une image symbolique mais n’en donne pas encore l’interprétation. La traduction ne doit pas anticiper l’explication ni imposer une lecture doctrinale.
translation_notes:
  register: Français international moderne, narratif et digne. « Et voici que » maintient la force visionnaire du passage ; la syntaxe reste fluide tout en suivant de près la progression du grec.
