  yaml_path: translation/deuterocanon/additions_to_esther/001/003.yaml
  text: He was from the captivity that Nebuchadnezzar king of Babylon had carried away from Jerusalem with Jeconiah king of Judea.
translation:
  language: fr
  text: Il faisait partie des déportés[a] que Nabuchodonosor, roi de Babylone, avait emmenés captifs de Jérusalem avec Jéconias, roi de Judée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Il était de la captivité »; autre traduction possible : « Il était parmi les exilés ».'
    reason: lexical_alternative
  - marker: b
    text: '« Judée » traduit la forme grecque; dans ce contexte historique, on peut aussi traduire : « Juda ».'
    reason: cultural_note
lexical_decisions:
- source_word: ἐκ τῆς αἰχμαλωσίας
  choice: faisait partie des déportés
  rationale: Littéralement « était de la captivité ». Dans ce contexte, la tournure désigne naturellement l’appartenance à la communauté emmenée en exil, sans suggérer qu’il serait né de la captivité.
- source_word: ᾐχμαλώτευσεν
  choice: avait emmenés captifs
  rationale: Le verbe signifie faire prisonnier ou emmener en captivité. Cette formulation française exprime clairement la contrainte et convient au plus-que-parfait exigé par le contexte narratif.
- source_word: Ναβουχοδονόσορ
  choice: Nabuchodonosor
  rationale: Forme française biblique traditionnelle et immédiatement reconnaissable du nom du roi babylonien.
- source_word: μετὰ Ἰεχονίου
  choice: avec Jéconias
  rationale: μετά suivi du génitif marque l’accompagnement; « avec » conserve simplement cette relation.
- source_word: τῆς Ἰουδαίας
  choice: de Judée
  rationale: Rend directement la forme grecque Ἰουδαία. Dans ce contexte royal, « de Juda » est aussi historiquement possible, d’où la note.
theological_decisions:
- issue: Expression de la déportation sans surcharge théologique
  choice: faisait partie des déportés… avait emmenés captifs
  alternative: était de la captivité… avait déportée
  rationale: Le passage donne un renseignement historique. La traduction garde le caractère forcé de l’exil tout en évitant de transformer l’expression en catégorie doctrinale.
- issue: Désignation du royaume associé à Jéconias
  choice: roi de Judée
  alternative: roi de Juda
  rationale: « Judée » suit la désignation grecque, tandis que « Juda » correspond davantage au nom historique du royaume. Le texte retient la forme grecque et signale l’autre possibilité.
translation_notes:
  register: Français international moderne, narratif et digne. « Faisait partie des déportés » évite le calque peu naturel « était de la captivité ». Les noms propres suivent les formes françaises bibliques courantes.
