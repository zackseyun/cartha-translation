  yaml_path: translation/deuterocanon/additions_to_esther/001/012.yaml
  text: And Mordecai remained in the court with Gabatha and Tharra[a], the two eunuchs of the king who were guarding the court[b],
translation:
  language: fr
  text: Mardochée resta[a] dans la cour du palais avec Gabatha et Tharra, les deux eunuques du roi qui gardaient la cour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se tint tranquille » ou « se reposa ». Le verbe grec peut exprimer le fait de rester sur place, d’être tranquille ou de se tenir au repos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡσύχασεν
  choice: resta
  rationale: Dans ce contexte locatif, le verbe exprime naturellement le fait de demeurer sur place. « Resta » conserve cette valeur sans imposer l’idée plus précise de silence, tout en laissant en note la nuance possible de calme ou de repos.
- source_word: αὐλή
  choice: cour du palais
  rationale: Le terme désigne ici la cour d’une résidence royale. La précision « du palais » rend le cadre explicite en français naturel; à la seconde occurrence, « la cour » suffit.
- source_word: μετά
  choice: avec
  rationale: La préposition marque simplement l’association de Mardochée avec les deux hommes.
- source_word: εὐνούχων
  choice: eunuques
  rationale: Le grec emploie le terme concret « eunuques »; le conserver évite de le remplacer par un titre de fonction moins précis.
- source_word: φυλασσόντων
  choice: gardaient
  rationale: Le participe présent décrit leur fonction continue de surveillance de la cour.
- source_word: Μαρδοχαῖος
  choice: Mardochée
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom grec.
- source_word: Γαβὰθα
  choice: Gabatha
  rationale: Translittération directe de la forme grecque.
- source_word: Θαῤῥὰ
  choice: Tharra
  rationale: Translittération directe de la forme grecque.
