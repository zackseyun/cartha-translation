  yaml_path: translation/deuterocanon/additions_to_esther/001/014.yaml
  text: And the king examined the two eunuchs[a], and after they confessed[b], they were led away.
translation:
  language: fr
  text: Le roi questionna[a] les deux eunuques[b] et, après qu’ils eurent avoué, ils furent emmenés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « examina » ; le verbe grec peut désigner une enquête formelle.
    reason: lexical_alternative
  - marker: b
    text: Le terme grec désigne précisément des eunuques, qui pouvaient aussi être des fonctionnaires de la cour.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἐξήτασεν
  choice: questionna
  rationale: Le verbe désigne une démarche d’examen ou d’enquête. « Questionna » est naturel en français et n’impose pas la dureté que pourrait suggérer « interrogea » dans certains contextes.
- source_word: εὐνούχους
  choice: eunuques
  rationale: Le grec désigne explicitement des eunuques. Même si ceux-ci exerçaient souvent des fonctions à la cour, traduire par le terme précis évite de généraliser.
- source_word: ὁμολογήσαντες
  choice: après qu’ils eurent avoué
  rationale: Le participe exprime un aveu ou une reconnaissance faisant suite à l’examen. La tournure rend clairement l’antériorité sans ajouter l’objet de l’aveu, absent du grec.
- source_word: ἀπήχθησαν
  choice: ils furent emmenés
  rationale: Le passif indique qu’ils furent conduits ailleurs sous autorité, sans préciser ici leur destination ni leur sort.
