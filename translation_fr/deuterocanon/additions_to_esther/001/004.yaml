  yaml_path: translation/deuterocanon/additions_to_esther/001/004.yaml
  text: 'And this was his dream: behold[a], voices and tumult, thunder and earthquake, upheaval upon the earth.'
translation:
  language: fr
  text: 'Et tel fut son rêve : voici, des voix[a] et du tumulte, des coups de tonnerre et un tremblement de terre, un bouleversement sur la terre[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des bruits » ou « des cris ». Le mot grec peut désigner aussi bien des voix que des sons.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans le pays ». Le mot grec peut désigner la terre ou un territoire particulier.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνύπνιον
  choice: rêve
  rationale: « Rêve » est le sens courant du terme et n’ajoute pas l’idée plus précise d’une vision.
- source_word: ἰδοὺ
  choice: voici
  rationale: « Voici » conserve la force vive et présentative de l’interjection grecque dans le récit du rêve.
- source_word: φωναὶ
  choice: voix
  rationale: Le mot peut désigner des voix, des cris ou des sons. « Voix » en est le rendu le plus direct, tandis que l’autre possibilité est signalée en note.
- source_word: θόρυβος
  choice: tumulte
  rationale: Le terme évoque un bruit collectif accompagné d’agitation ou de désordre ; « tumulte » convient au registre élevé du passage.
- source_word: βρονταὶ
  choice: coups de tonnerre
  rationale: Cette expression française naturelle rend le pluriel grec et suggère des manifestations répétées.
- source_word: σεισμός
  choice: un tremblement de terre
  rationale: C’est le sens usuel du nom grec dans ce contexte de phénomènes menaçants.
- source_word: τάραχος
  choice: un bouleversement
  rationale: Le mot dénote une agitation ou un désordre profond. « Bouleversement » laisse ouverte sa portée physique, sociale ou générale.
- source_word: ἐπὶ τῆς γῆς
  choice: sur la terre
  rationale: Dans cette scène associant tonnerre et séisme, « terre » restitue naturellement la portée étendue de γῆ, sans exclure en note le sens possible de « pays ».
theological_decisions:
- issue: Portée de γῆ dans le contexte du rêve
  choice: terre
  alternative: pays
  rationale: Les phénomènes évoqués favorisent une perturbation à l’échelle de la terre, mais le grec peut aussi désigner un territoire ou un pays ; cette ambiguïté est explicitement conservée en note sans imposer une lecture apocalyptique ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. La succession nominale et le présentatif « voici » préservent le caractère saisissant et fragmentaire du récit onirique grec.
