  yaml_path: translation/deuterocanon/additions_to_esther/001/001.yaml
  text: In the second year of the reign of Artaxerxes the great king[a], on the first day of Nisan, Mordecai son of Jair, son of Shimei, son of Kish, of the tribe of Benjamin, saw a dream[b],
translation:
  language: fr
  text: La deuxième année du règne d’Artaxerxès, le grand roi, le premier jour de Nisan[a], Mardochée, fils de Jaïr, fils de Shiméï, fils de Qish, de la tribu de Benjamin, eut un rêve[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec donne au mois la forme « Nisa » ; « Nisan » est la forme française courante du nom de ce mois juif.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « vit un rêve » ; on pourrait aussi traduire : « fit un rêve ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτους δευτέρου βασιλεύοντος Ἀρταξέρξου
  choice: La deuxième année du règne d’Artaxerxès
  rationale: Cette formulation française naturelle rend la datation par année de règne exprimée au moyen du génitif absolu grec.
- source_word: τοῦ μεγάλου βασιλέως
  choice: le grand roi
  rationale: Conserve littéralement le titre royal perse, sans ajouter de majuscule interprétative.
- source_word: τῇ μιᾷ τοῦ Νεισὰ
  choice: le premier jour de Nisan
  rationale: Dans cette formule calendaire, « la première de Nisa » désigne le premier jour du mois. « Nisan » est la forme française courante du nom de ce mois.
- source_word: ἐνύπνιον εἶδεν
  choice: eut un rêve
  rationale: Expression idiomatique en français moderne. Le grec dit littéralement « vit un rêve », nuance signalée en note.
- source_word: Μαρδοχαῖος ὁ τοῦ Ἰαείρου, τοῦ Σεμεείου τοῦ Κεισαίου
  choice: Mardochée, fils de Jaïr, fils de Shiméï, fils de Qish
  rationale: Les génitifs successifs indiquent une lignée. Les formes françaises usuelles des noms bibliques sont retenues.
- source_word: ἐκ φυλῆς Βενιαμείν
  choice: de la tribu de Benjamin
  rationale: Rend directement l’appartenance tribale exprimée par le grec.
