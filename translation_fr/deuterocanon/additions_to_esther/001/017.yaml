  yaml_path: translation/deuterocanon/additions_to_esther/001/017.yaml
  text: And Haman son of Hammedatha[a], the Bougaean, was honored before the king, and he was seeking to harm Mordecai and his people because of the king’s two eunuchs.
translation:
  language: fr
  text: Haman, fils d’Hammedatha, le Bougaïen[a], était en grand honneur auprès du roi, et il cherchait à faire du mal à Mardochée et à son peuple à cause des deux eunuques du roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « le Bougaïen ». Une tradition plus familière appelle Haman « l’Agaguite », mais ce témoin grec porte « Bougaïen ».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἁμὰν Ἁμαδάθου
  choice: Haman, fils d’Hammedatha
  rationale: Le génitif Ἁμαδάθου exprime naturellement la filiation. Les noms propres sont translittérés selon leurs formes françaises usuelles ou proches du grec.
- source_word: Βουγαῖος
  choice: le Bouguéen
  rationale: Cette désignation obscure est translittérée plutôt qu’interprétée ou harmonisée avec une autre tradition textuelle. L’article défini convient en français à une épithète apposée.
- source_word: ἔνδοξος ἐνώπιον τοῦ βασιλέως
  choice: hautement considéré auprès du roi
  rationale: Dans ce contexte de cour, ἔνδοξος indique le rang et l’estime dont Haman jouissait, tandis que ἐνώπιον τοῦ βασιλέως désigne sa position auprès du roi.
- source_word: ἐζήτει κακοποιῆσαι
  choice: il cherchait à faire du mal
  rationale: L’imparfait ἐζήτει exprime une intention ou une démarche persistante. « Faire du mal » conserve la portée générale de κακοποιῆσαι sans la réduire à une atteinte physique.
- source_word: τὸν Μαρδοχαῖον καὶ τὸν λαὸν αὐτοῦ
  choice: Mardochée et son peuple
  rationale: « Mardochée » est la forme française traditionnelle du nom, et λαός désigne ici le peuple auquel il appartient.
- source_word: ὑπὲρ τῶν δύο εὐνούχων τοῦ βασιλέως
  choice: à cause des deux eunuques du roi
  rationale: Dans ce contexte, ὑπέρ indique le motif de l’hostilité d’Haman. « Eunuques » rend directement le terme grec de cour εὐνούχων.
theological_decisions:
- issue: Identification de Βουγαῖος
  choice: Conserver « le Bouguéen » dans le texte
  alternative: « l’Agaguite »
  rationale: Le témoin grec fourni porte Βουγαῖος. La traduction suit cette leçon sans l’harmoniser avec la désignation plus connue d’une autre tradition textuelle; celle-ci est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde l’aspect duratif de l’imparfait grec et préserve l’obscurité de la désignation Βουγαῖος.
