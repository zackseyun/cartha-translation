base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/001/008.yaml
  text: And every righteous nation was thrown into turmoil[a], fearing their own calamities[c][b], and they prepared to perish.
translation:
  language: fr
  text: Et toute nation juste fut bouleversée[a], ses membres redoutant leurs propres malheurs[b] et se préparant à périr[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fut plongée dans le désarroi » ou « fut troublée ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « leurs propres maux » ; il peut s’agir des malheurs ou des désastres qui devaient les atteindre.
    reason: lexical_alternative
  - marker: c
    text: Ou « à être anéantis » ou « à être détruits ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταράχθη
  choice: fut bouleversée
  rationale: Le passif exprime une profonde agitation. « Fut bouleversée » reste naturel en français tout en conservant la force de la formulation grecque.
- source_word: δίκαιον
  choice: juste
  rationale: « Juste » conserve ici la portée morale de δίκαιος et s’emploie naturellement pour qualifier une nation, sans limiter le sens à la justice juridique.
- source_word: πᾶν ἔθνος
  choice: toute nation
  rationale: Le singulier distributif avec πᾶν se rend directement par « toute nation » et laisse intacte la portée de la généralisation.
- source_word: φοβούμενοι
  choice: chacun redoutait
  rationale: Le participe masculin pluriel renvoie aux membres de la nation collective. Cette formulation rend l’accord de sens intelligible en français et exprime la crainte d’un mal attendu.
- source_word: τὰ ἑαυτῶν κακά
  choice: les malheurs qui le menaçaient
  rationale: Dans ce contexte, κακά désigne des maux ou désastres redoutés. La tournure française exprime clairement qu’ils sont envisagés comme devant atteindre les personnes concernées, sans les présenter comme les maux qu’elles auraient commis.
- source_word: ἡτοιμάσθησαν
  choice: tous se préparèrent
  rationale: La forme exprime le fait de se tenir ou de se rendre prêts. « Se préparèrent » en donne une traduction idiomatique, et « tous » reprend les membres du collectif.
- source_word: ἀπολέσθαι
  choice: à périr
  rationale: L’infinitif moyen peut signifier « périr » ou « être anéanti ». « Périr » préserve la gravité et l’ambiguïté entre la mort et la ruine totale.
theological_decisions:
- issue: Portée de δίκαιον appliqué à ἔθνος
  choice: « nation juste », au sens moral d’un peuple innocent ou droit
  alternative: « nation équitable » ou lecture principalement sociale et juridique
  rationale: Le contexte oppose la droiture du peuple aux malheurs qui le menacent. « Juste » garde la dimension morale du grec biblique sans ajouter une qualification confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le passage d’un sujet collectif singulier (« toute nation ») aux personnes qui le composent est explicité par « chacun » puis « tous », afin de rendre naturellement les participes grecs au pluriel. Les variantes lexicales importantes sont conservées en notes.
