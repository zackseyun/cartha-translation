  text: And the king ordered Mordecai to serve in the court[a], and he gave him gifts on account of these things.
translation:
  language: fr
  text: Le roi ordonna à Mardochée de servir à la cour[a] et lui fit des présents à cause de ces événements.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’enceinte du palais ». Le mot grec peut désigner la cour royale, une cour intérieure ou l’enceinte du palais.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέταξεν
  choice: ordonna
  rationale: Le verbe exprime une directive investie de l’autorité royale. « Ordonna » est naturel et précis, sans transformer cette directive en nomination officielle.
- source_word: θεραπεύειν
  choice: servir
  rationale: Dans ce contexte royal, le verbe désigne le service ou l’assistance auprès de la cour, sans connotation cultuelle particulière.
- source_word: ἐν τῇ αὐλῇ
  choice: à la cour
  rationale: Cette tournure française idiomatique désigne le milieu de la cour royale. Le grec peut aussi évoquer l’enceinte ou les dépendances du palais, d’où la note.
- source_word: δόματα
  choice: des présents
  rationale: Le nom désigne des dons. « Présents » convient au registre royal et n’impose pas l’idée plus interprétative de récompense.
- source_word: περὶ τούτων
  choice: à cause de ces événements
  rationale: La locution indique ici le motif lié aux faits précédemment racontés. « Ces événements » conserve le pluriel tout en étant plus naturel que « ces choses » en français.
