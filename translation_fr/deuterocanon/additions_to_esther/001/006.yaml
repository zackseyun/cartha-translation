  - marker: b
    text: Ou « la nation juste ». L’expression grecque peut se comprendre comme un génitif (« la nation des justes ») ou comme une caractérisation plus ramassée.
    reason: alternative_reading
lexical_decisions:
- source_word: φωνῇ
  choice: cri
  rationale: Dans ce contexte guerrier, « cri » rend naturellement le son ou la clameur venant d’eux, tout en évitant de préciser le contenu de l’appel.
- source_word: ἡτοιμάσθη
  choice: fut préparée
  rationale: L’aoriste passif indique une mise en état de préparation; « fut préparée » conserve clairement cette valeur passive.
- source_word: πᾶν ἔθνος
  choice: chaque nation
  rationale: Le singulier distributif se rend naturellement par « chaque nation » et maintient l’écho avec la dernière occurrence de ἔθνος.
- source_word: εἰς πόλεμον
  choice: pour la guerre
  rationale: Cette formulation française exprime de manière concise l’orientation vers la guerre ou la préparation en vue de celle-ci.
- source_word: ὥστε πολεμῆσαι
  choice: afin de combattre
  rationale: La tournure conserve la nuance de visée ou de résultat attendu de ὥστε avec l’infinitif, sans présenter le combat comme déjà accompli.
- source_word: δικαίων ἔθνος
  choice: la nation des justes
  rationale: Cette formulation suit la construction génitive grecque, reste naturelle en français et ne remplace pas la désignation descriptive par une identification ethnique explicite.
theological_decisions:
- issue: Identification de δικαίων ἔθνος
  choice: la nation des justes
  alternative: la nation juste; la nation des Juifs
  rationale: Le grec emploie une expression descriptive et ne nomme pas explicitement Israël ou les Juifs. La traduction conserve cette formulation et l’ambiguïté entre génitif et caractérisation adjectivale.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque. Les deux marqueurs de note figurent immédiatement après les expressions concernées.
