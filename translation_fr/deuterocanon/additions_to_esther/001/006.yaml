  text: And at their cry every nation was made ready for war[b][a], so as to fight against the nation of the righteous.
translation:
  language: fr
  text: À leur cri[a], chaque nation fut préparée pour la guerre, afin de combattre la nation des justes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « voix » ou « bruit » : le grec peut désigner plus largement le son ou la clameur qu’ils produisaient.'
