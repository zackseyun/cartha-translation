  text: Light and the sun rose[b][a], and the lowly were exalted and devoured the glorious.
translation:
  language: fr
  text: La lumière et le soleil se levèrent, et les humbles[a] furent élevés et dévorèrent les illustres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les gens de condition modeste ». Le grec peut désigner une disposition humble ou une condition sociale peu élevée.
    reason: lexical_alternative
  - marker: b
    text: Ou « les honorés » ou « les nobles ». Le grec désigne des personnes qui jouissent d’honneur ou de renom.
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς
  choice: la lumière
  rationale: Conserve le substantif isolé et la force évocatrice de l’image grecque, sans le réduire à « le jour ».
- source_word: ὁ ἥλιος
  choice: le soleil
  rationale: Équivalent direct et naturel du groupe nominal grec.
- source_word: ἀνέτειλεν
  choice: se levèrent
  rationale: Le verbe décrit couramment le lever du soleil. L’accord au pluriel traite « la lumière et le soleil » comme le sujet composé du verbe grec au singulier, tournure possible en grec mais non naturelle ici en français.
- source_word: οἱ ταπεινοὶ
  choice: les gens de condition modeste
  rationale: Rend le statut inférieur suggéré par ταπεινός sans imposer l’idée d’une vertu intérieure, comme pourrait le faire « les humbles ».
- source_word: ὑψώθησαν
  choice: furent élevés
  rationale: Préserve l’image passive d’élévation et le renversement avec ceux qui occupaient une position honorable.
- source_word: κατέφαγον
  choice: dévorèrent
  rationale: Maintient la vigueur du verbe grec, plus forte que « mangèrent » ou « consumèrent », dans cette scène symbolique de victoire.
- source_word: τοὺς ἐνδόξους
  choice: les gens honorés
  rationale: Exprime ceux qui jouissent d’honneur ou de renom, sans leur attribuer nécessairement noblesse ou puissance.
theological_decisions:
- issue: Faut-il expliciter l’imagerie comme une délivrance ou une victoire historique ?
  choice: Conserver directement les images de lumière, d’élévation et de dévoration.
  alternative: Paraphraser le verset comme l’annonce de la délivrance et de la victoire des opprimés.
  rationale: Le grec demeure condensé et symbolique. L’explicitation résoudrait une image que le texte laisse ouverte.
- issue: ταπεινοί désigne-t-il les humbles de cœur ou les personnes socialement abaissées ?
  choice: « les gens de condition modeste », avec l’autre possibilité en note.
  alternative: « les humbles »
  rationale: Le contexte de renversement favorise le statut, mais le terme grec peut aussi qualifier une disposition humble ; la note préserve cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et imagé. La répétition de « les gens » évite de substantiver lourdement les adjectifs tout en préservant l’opposition entre les deux groupes.
