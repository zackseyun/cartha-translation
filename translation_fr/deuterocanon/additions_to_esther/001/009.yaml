  text: And they cried out to God[a], and from their cry there came, as it were, a great river from a little spring, abundant water.
translation:
  language: fr
  text: Et ils crièrent vers Dieu ; de leur cri surgit, comme d’une petite source, un grand fleuve aux eaux abondantes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « De leur cri se forma, comme à partir d’une petite source, un grand fleuve, beaucoup d’eau. »'
    reason: Cette formulation rend plus explicitement ἐγένετο (« se forma »), ἀπό (« à partir de ») et l’apposition emphatique ὕδωρ πολύ (« beaucoup d’eau »), tout en conservant la comparaison introduite par ὡσανεί.
lexical_decisions:
- source_word: ἐβόησαν πρὸς τὸν θεόν
  choice: ils crièrent vers Dieu
  rationale: Le verbe βοάω exprime un cri intense, ici dirigé vers Dieu comme un appel pressant. « Crièrent vers Dieu » reste naturel tout en conservant l’orientation marquée par πρός.
- source_word: ἀπὸ δὲ τῆς βοῆς αὐτῶν
  choice: de leur cri
  rationale: Cette formulation conserve le lien lexical avec « crièrent » et présente leur cri comme le point d’origine de l’image qui suit.
- source_word: ἐγένετο
  choice: naquit
  rationale: Dans cette image de source et de fleuve, « naquit » exprime naturellement l’apparition du fleuve sans faire du verbe une simple copule.
- source_word: ὡσανεὶ
  choice: comme
  rationale: « Comme » marque clairement la comparaison voulue par ὡσανεί, sans transformer la vision en description strictement littérale.
- source_word: μικρᾶς πηγῆς
  choice: une petite source
  rationale: πηγή désigne ici une source d’eau ; « petite » rend directement μικρά et maintient le contraste avec le grand fleuve.
- source_word: ποταμὸς μέγας
  choice: un grand fleuve
  rationale: Le choix restitue simplement l’ampleur du cours d’eau et son contraste avec la petite source.
- source_word: ὕδωρ πολύ
  choice: une eau abondante
  rationale: La formulation conserve le singulier collectif du grec et la valeur appositionnelle de l’expression, qui souligne l’abondance du fleuve.
theological_decisions:
- issue: Caractère de l’image du fleuve
  choice: Conserver explicitement la comparaison avec « comme »
  alternative: Présenter directement le cri comme produisant un fleuve littéral, sans marque comparative
  rationale: Le grec ὡσανεί maintient une dimension comparative ou visionnaire. La traduction ne doit pas trancher en faveur d’une lecture purement littérale.
translation_notes:
  register: Français moderne, digne et accessible. Le point-virgule clarifie les deux mouvements de la phrase, tandis que « naquit » s’accorde naturellement avec l’image de la source. L’apposition finale, volontairement légèrement littéraire, préserve la structure et l’emphase du grec.
