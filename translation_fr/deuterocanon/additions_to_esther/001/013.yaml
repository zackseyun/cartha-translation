  yaml_path: translation/deuterocanon/additions_to_esther/001/013.yaml
  text: He listened to their plans and investigated their intentions[a], and he learned that they were preparing to lay hands on King Artaxerxes. And he informed the king about them.
translation:
  language: fr
  text: Il écouta leurs projets et examina attentivement ce qui les préoccupait, puis il apprit qu’ils se préparaient à porter la main sur le roi Artaxerxès[a]. Il en informa le roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à s’en prendre au roi Artaxerxès ». L’expression grecque signifie littéralement « mettre les mains sur » quelqu’un et désigne ici une action hostile, sans en préciser la forme.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκρόασεν
  choice: écouta
  rationale: Le verbe exprime une écoute attentive plutôt que le simple fait d’entendre.
- source_word: λογισμοὺς
  choice: projets
  rationale: Dans ce contexte de complot à la cour, le terme désigne des réflexions orientées vers l’action, donc des projets.
- source_word: μερίμνας
  choice: préoccupations
  rationale: Le mot peut désigner des soucis, des préoccupations ou ce qui occupe l’esprit. Cette traduction conserve sa largeur de sens sans le réduire avec certitude à des intentions.
- source_word: ἐξηραύνησεν
  choice: approfondit
  rationale: Le verbe indique qu’il rechercha et examina soigneusement ce qui les préoccupait; « approfondit » rend cette enquête sans lourdeur.
- source_word: ἑτοιμάζουσιν
  choice: se préparaient
  rationale: L’imparfait français rend naturellement la préparation en cours dans le récit.
- source_word: τὰς χεῖρας ἐπιβαλεῖν
  choice: porter la main sur
  rationale: Cette expression française préserve l’image concrète de l’idiome grec et son caractère hostile, sans préciser indûment s’il s’agit d’une arrestation, d’une agression ou d’un assassinat.
- source_word: Ἀρταξέρξῃ τῷ βασιλεῖ
  choice: le roi Artaxerxès
  rationale: Ordre naturel et dignifié en français pour le titre et le nom royal.
- source_word: ὑπέδειξεν
  choice: les dénonça au roi
  rationale: Dans le contexte d’un complot, le verbe signifie qu’il porta leur cas à la connaissance du roi; « dénonça » est concis et naturel, tout en gardant les conspirateurs comme référent de περὶ αὐτῶν.
