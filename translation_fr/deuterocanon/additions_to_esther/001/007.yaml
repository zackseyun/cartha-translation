  text: And behold[a], a day of darkness and gloom, of affliction and distress, of misery and great turmoil upon the earth.
translation:
  language: fr
  text: 'Et voici : un jour de ténèbres et d’obscurité, de détresse et d’angoisse, de souffrance et de grand bouleversement sur la terre.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le pays ». Le grec γῆ peut désigner soit la terre en général, soit un pays particulier.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici
  rationale: Préserve la force soudaine et visionnaire de l’interjection dans un registre élevé, tout en restant naturel en français moderne.
- source_word: ἡμέρα
  choice: un jour
  rationale: L’indéfini convient à cette annonce exclamative et menaçante.
- source_word: σκότους
  choice: ténèbres
  rationale: Rend directement l’image sombre et conserve le ton solennel.
- source_word: γνόφου
  choice: obscurité
  rationale: Distingue ce terme de σκότους tout en maintenant le parallélisme poétique; « obscurité épaisse » serait également possible, mais plus lourd.
- source_word: θλίψις
  choice: détresse
  rationale: Exprime une souffrance oppressante sans introduire une connotation technique ou eschatologique.
- source_word: στενοχωρία
  choice: angoisse
  rationale: Rend l’idée de resserrement et de pression extrême, en formant avec « détresse » un couple français naturel.
- source_word: κάκωσις
  choice: souffrance
  rationale: Communique l’état pénible ou le mal subi sans imposer la présence d’un oppresseur précis.
- source_word: τάραχος μέγας
  choice: grand bouleversement
  rationale: Évoque un profond désordre collectif et conserve explicitement l’intensité de μέγας.
- source_word: ἐπὶ τῆς γῆς
  choice: sur la terre
  rationale: Convient à l’ampleur visionnaire de l’énoncé, tout en laissant signaler en note le sens plus local possible de γῆ.
theological_decisions:
- issue: Étendue géographique de γῆ dans la formule de calamité
  choice: sur la terre
  alternative: dans le pays
  rationale: Le catalogue solennel des calamités peut suggérer une portée universelle, mais le grec permet aussi une référence à un territoire particulier; la note préserve cette ambiguïté.
translation_notes:
  register: Français moderne, digne et légèrement élevé. Le rythme ternaire des couples nominaux grecs est conservé. Le deux-points après « voici » restitue la brusque présentation de la vision sans ajouter de verbe absent du grec.
