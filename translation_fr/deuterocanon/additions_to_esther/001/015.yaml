  yaml_path: translation/deuterocanon/additions_to_esther/001/015.yaml
  text: And the king wrote these words as a memorial[b][a], and Mordecai wrote concerning these words.
translation:
  language: fr
  text: Le roi écrivit ces paroles pour mémoire[a], et Mardochée écrivit au sujet de ces paroles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme mémorial » ou « en souvenir ». Le grec peut désigner ce qui sert de mémorial ou à conserver le souvenir.
    reason: lexical_alternative
  - marker: b
    text: Ou « au sujet de ces faits ». Le mot grec traduit par « paroles » peut aussi désigner des faits ou des affaires.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  choice: mit par écrit / écrivit
  rationale: Le verbe γράφω désigne directement l’action d’écrire ou de consigner. La variation française évite la lourdeur tout en conservant la répétition conceptuelle du grec.
- source_word: τοὺς λόγους τούτους
  choice: ces paroles
  rationale: λόγοι peut désigner des paroles, des propos ou, plus largement, des faits. « Ces paroles » reste proche de la forme grecque et convient à un contenu mis par écrit.
- source_word: εἰς μνημόσυνον
  choice: pour qu’on s’en souvienne
  rationale: Cette formulation naturelle rend la finalité exprimée par εἰς et le sens de mémoire ou de commémoration porté par μνημόσυνον, sans imposer l’idée d’un monument matériel.
- source_word: Μαρδοχαῖος
  choice: Mardochée
  rationale: « Mardochée » est la forme française traditionnelle et courante du nom grec Μαρδοχαῖος.
- source_word: περὶ τῶν λόγων τούτων
  choice: au sujet de ces paroles
  rationale: περί avec le génitif signifie « au sujet de » ou « concernant ». La reprise de « ces paroles » maintient le parallélisme lexical du grec.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Mit par écrit » explicite naturellement l’acte de consignation dans la première proposition; « écrivit » garde une formulation simple dans la seconde. Les notes préservent l’étendue sémantique de λόγοι et de μνημόσυνον.
