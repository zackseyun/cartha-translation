  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/006.yaml
  text: and the mercy of your promise is immeasurable and unsearchable;[a]
translation:
  language: fr
  text: et la miséricorde de ta promesse est sans mesure et insondable.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la miséricorde que tu as promise » ou « la miséricorde manifestée dans ta promesse ». Le génitif grec peut se comprendre de plusieurs manières très proches.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμέτρητόν
  choice: sans mesure
  rationale: L’adjectif désigne ce qui ne peut être mesuré. « Sans mesure » est naturel en français et conserve nettement la portée quantitative du grec.
- source_word: ἀνεξιχνίαστον
  choice: insondable
  rationale: Le terme évoque ce qu’on ne peut explorer ni suivre jusqu’au bout. « Insondable » restitue cette idée dans un registre actuel et digne.
- source_word: ἔλεος
  choice: miséricorde
  rationale: Ἔλεος désigne la miséricorde ou la compassion. « Miséricorde » convient au contexte pénitentiel de la prière et demeure courant dans le registre biblique français.
- source_word: ἐπαγγελίας
  choice: promesse
  rationale: « Promesse » est l’équivalent direct de ἐπαγγελία et conserve la construction au génitif sans en préciser excessivement la relation avec la miséricorde.
- source_word: τε καὶ
  choice: et
  rationale: Ces particules coordonnent étroitement les deux adjectifs. Le simple « et » exprime naturellement ce lien en français.
theological_decisions:
- issue: Relation entre « miséricorde » et « promesse » dans τὸ ἔλεος τῆς ἐπαγγελίας σου
  choice: « la miséricorde de ta promesse »
  alternative: « la miséricorde que tu as promise » ou « la miséricorde manifestée dans ta promesse »
  rationale: 'La formulation retenue suit la structure grecque et préserve l’ambiguïté du génitif : il peut s’agir d’une miséricorde appartenant à la promesse, promise par Dieu ou manifestée dans celle-ci.'
translation_notes:
  register: Français moderne, international et digne. « Sans mesure » et « insondable » forment une paire naturelle tout en restant proches des deux adjectifs grecs; la construction inhabituelle « miséricorde de ta promesse » est maintenue pour ne pas résoudre l’ambiguïté du texte source.
