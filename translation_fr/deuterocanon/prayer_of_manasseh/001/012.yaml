  text: I have sinned, Lord, I have sinned, and I myself know my lawless deeds;
translation:
  language: fr
  text: J’ai péché, Seigneur, j’ai péché, et moi, je connais mes violations de la loi[a] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mes iniquités ». Le terme grec désigne des actes qui enfreignent la loi ou témoignent du mépris de celle-ci.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμάρτηκα
  choice: J’ai péché
  rationale: Le parfait actif présente le péché comme accompli tout en soulignant sa portée présente. Le passé composé rend naturellement cette force dans une confession pénitentielle.
- source_word: κύριε
  choice: Seigneur
  rationale: Le vocatif de κύριος est rendu directement par « Seigneur », sans ajouter l’interjection « ô », que le grec n’exige pas.
- source_word: τὰς ἀνομίας μου
  choice: mes violations de la loi
  rationale: ἀνομία désigne le mépris ou la violation de la loi. Cette formulation française reste claire et concrète tout en conservant la référence explicite à la loi.
- source_word: ἐγὼ γινώσκω
  choice: et moi, je connais
  rationale: γινώσκω signifie d’abord « connaître », même si le contexte implique aussi la reconnaissance ou l’aveu. La construction disloquée « et moi, je » restitue sans lourdeur excessive l’accent porté par le pronom explicite ἐγώ.
theological_decisions:
- issue: Sens moral de ἀνομία dans une prière pénitentielle
  choice: violations de la loi
  alternative: iniquités
  rationale: « Violations de la loi » rend de manière transparente la dimension de transgression contenue dans ἀνομία, sans réduire le terme à une faute générique ni introduire un jargon théologique peu accessible.
- issue: Valeur de γινώσκω dans la confession
  choice: je connais
  alternative: je reconnais
  rationale: « Je reconnais » expliciterait bien la dimension confessionnelle, mais le sens cognitif simple du grec demeure possible. « Je connais » préserve cette nuance et laisse le contexte porter l’idée d’aveu.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition pénitentielle est conservée. « Et moi, je » marque l’emphase du pronom grec sans recourir à la tournure plus lourde « moi-même ».
