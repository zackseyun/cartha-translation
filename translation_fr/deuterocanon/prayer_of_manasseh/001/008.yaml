base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/008.yaml
  text: So you[a], Lord, God of the righteous, did not appoint repentance for the righteous—for Abraham and Isaac and Jacob, who did not sin against you—but you appointed repentance for me, the sinner,
translation:
  language: fr
  text: Toi donc, Seigneur, Dieu des justes, tu n’as pas établi la repentance pour les justes[a] — Abraham, Isaac et Jacob, qui n’ont pas péché contre toi —, mais tu l’as établie pour moi, le pécheur,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu n’as pas placé la repentance devant les justes ». Le verbe grec peut signifier « placer » ou « établir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ οὖν
  choice: Toi donc
  rationale: Cette tournure conserve à la fois l’insistance portée par le pronom explicite σὺ et la valeur de transition ou de conclusion de οὖν, dans un registre de prière digne.
- source_word: κύριε
  choice: Seigneur
  rationale: « Seigneur » est l’équivalent usuel de κύριε dans une adresse directe à Dieu.
- source_word: ὁ θεὸς τῶν δικαίων
  choice: Dieu des justes
  rationale: La formulation reproduit directement le complément grec et maintient le contraste lexical entre les justes et le pécheur.
- source_word: οὐκ ἔθου μετάνοιαν
  choice: tu n’as pas établi la repentance
  rationale: ἔθου peut signifier « placer » ou « établir ». « Établir la repentance » garde l’idée d’un acte divin délibéré sans ajouter explicitement les notions d’obligation ou de don.
- source_word: δικαίοις
  choice: pour les justes
  rationale: La préposition « pour » rend naturellement le datif avec la construction « établir la repentance » et préserve la répétition de la racine δικ-.
- source_word: τῷ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: Abraham, Isaac et Jacob
  rationale: Les trois noms sont en apposition aux « justes »; les tirets rendent cette identification claire sans ajouter de relation absente du grec.
- source_word: τοῖς οὐχ ἡμαρτηκόσιν σοι
  choice: qui n’ont pas péché contre toi
  rationale: Le passé composé rend naturellement le parfait du participe, tandis que « contre toi » présente Dieu comme la personne offensée par le péché.
- source_word: ἀλλ᾽ ἔθου μετάνοιαν ἐμοὶ
  choice: mais tu l’as établie pour moi
  rationale: Le contraste adversatif est conservé. Le pronom « l’ » évite une répétition pesante tout en renvoyant sans ambiguïté à la repentance.
- source_word: τῷ ἁμαρτωλῷ
  choice: le pécheur
  rationale: L’article défini et l’apposition à « moi » sont maintenus, ce qui préserve l’humilité du locuteur et l’opposition rhétorique avec « les justes ».
theological_decisions:
- issue: Le texte affirme qu’Abraham, Isaac et Jacob n’ont pas péché contre Dieu, formulation qui peut sembler en tension avec d’autres portraits bibliques des patriarches.
  choice: qui n’ont pas péché contre toi
  alternative: qui n’ont pas gravement péché contre toi; qui n’ont pas été comptés parmi les pécheurs devant toi
  rationale: Le grec οὐχ ἡμαρτηκόσιν σοι ne comporte aucune restriction. La traduction conserve donc la formulation absolue et la tension théologique du texte au lieu de l’atténuer ou de l’harmoniser.
translation_notes:
  register: Français international actuel, au tutoiement, avec un registre solennel adapté à la prière. « Repentance » conserve le terme théologique du texte, tandis que la syntaxe reste accessible. Les tirets clarifient l’apposition des noms des patriarches.
