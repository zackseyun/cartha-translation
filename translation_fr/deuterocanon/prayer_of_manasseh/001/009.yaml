base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/009.yaml
  text: For I have sinned beyond the number of the sand of the sea. My lawless deeds have multiplied[a], Lord; my lawless deeds have multiplied, and I am not worthy to look up and see the height of heaven because of the multitude of my unrighteous acts.
translation:
  language: fr
  text: Car j’ai commis plus de péchés qu’il n’y a de grains de sable de la mer. Mes transgressions se sont multipliées, Seigneur, mes transgressions se sont multipliées, et je ne suis pas digne de fixer mon regard[a] et de voir la hauteur du ciel, en raison de la multitude de mes actes injustes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de lever les yeux et de voir la hauteur du ciel ». Le verbe grec peut souligner un regard fixe ou attentif, et non simplement sa direction vers le haut.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥμαρτον ὑπὲρ ἀριθμὸν ψάμμου θαλάσσης
  choice: j’ai commis plus de péchés qu’il n’y a de grains de sable dans la mer
  rationale: La tournure comparative exprime que les péchés dépassent toute mesure évoquée par le sable marin. Cette formulation française naturelle conserve l’image biblique et la confession à la première personne.
- source_word: ἐπλήθυναν
  choice: se sont multipliées
  rationale: Le verbe indique que les transgressions sont devenues nombreuses; le passé composé convient à une confession portant sur des actes passés dont le poids demeure présent.
- source_word: ἀνομίαι
  choice: transgressions
  rationale: Le terme désigne des violations de l’ordre ou de la loi. « Transgressions » garde cette portée morale et juridique dans un registre actuel et digne.
- source_word: κύριε
  choice: Seigneur
  rationale: Le vocatif s’adresse directement à Dieu. « Seigneur » est la forme française naturelle, sans ajout d’un « ô » archaïsant.
- source_word: οὐκ εἰμὶ ἄξιος
  choice: je ne suis pas digne
  rationale: Rend directement l’affirmation d’indignité personnelle et conserve le ton solennel de la confession.
- source_word: ἀτενίσαι καὶ ἰδεῖν
  choice: fixer mon regard sur
  rationale: ἀτενίζω insiste sur un regard soutenu ou attentif, tandis que la construction avec ἰδεῖν porte sur la vision de la hauteur du ciel. La formulation évite d’introduire dans le verbe grec la seule idée directionnelle de « lever les yeux ».
- source_word: τὸ ὕψος τοῦ οὐρανοῦ
  choice: la hauteur du ciel
  rationale: Conserve le singulier et l’image de l’élévation céleste au plus près du grec.
- source_word: ἀπὸ τοῦ πλήθους τῶν ἀδικιῶν μου
  choice: tant mes actes injustes sont nombreux
  rationale: La préposition a ici une valeur causale. Cette tournure française exprime naturellement que la multitude des actes injustes est la cause de l’indignité ressentie.
- source_word: ἀδικιῶν
  choice: actes injustes
  rationale: Cette expression garde la notion de conduite contraire à la justice tout en la distinguant de ἀνομίαι, rendu par « transgressions ».
theological_decisions:
- issue: Distinction entre ἀνομίαι et ἀδικιῶν dans une même confession
  choice: Rendre ἀνομίαι par « transgressions » et ἀδικιῶν par « actes injustes »
  alternative: Rendre les deux termes par « péchés » ou par « fautes »
  rationale: Le grec emploie deux termes moraux apparentés mais distincts. Préserver cette différence maintient l’ampleur rhétorique de la confession sans imposer une distinction doctrinale plus précise que le texte.
- issue: Sens de ἀτενίσαι devant la hauteur du ciel
  choice: « fixer mon regard sur », avec une note signalant une autre formulation possible
  alternative: « lever les yeux vers »
  rationale: Le verbe souligne d’abord le regard fixe ou attentif et ne signifie pas à lui seul « regarder vers le haut ». Le contexte céleste permet l’autre formulation, mais ne justifie pas d’effacer la nuance lexicale.
- issue: Adresse divine κύριε
  choice: Seigneur
  alternative: Ô Seigneur
  rationale: L’adresse directe suffit à rendre le vocatif dans un français moderne et digne, sans coloration liturgique archaïsante.
translation_notes:
  register: Français international moderne, fluide et digne. La répétition de « mes transgressions se sont multipliées » est conservée pour respecter l’insistance confessionnelle du grec. Le contraste lexical entre « transgressions » et « actes injustes » maintient les deux termes moraux distincts de la source.
