  text: διότι ἥμαρτον ὑπὲρ ἀριθμὸν ψάμμου θαλάσσης. ἐπλήθυναν αἱ ἀνομίαι μου, κύριε, ἐπλήθυναν αἱ ἀνομίαι μου, καὶ οὐκ εἰμὶ ἄξιος ἀτενίσαι καὶ ἰδεῖν τὸ ὕψος τοῦ οὐρανοῦ ἀπὸ τοῦ πλήθους τῶν ἀδικιῶν μου.
