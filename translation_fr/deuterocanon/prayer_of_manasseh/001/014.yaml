base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/014.yaml
  text: and in me you will show your kindness[a]; for you will save me, though I am unworthy, according to your abundant mercy[b],
translation:
  language: fr
  text: et en moi tu manifesteras ta bonté[a] ; car tu me sauveras, malgré mon indignité, selon l’abondance de ta miséricorde,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « envers moi » ou « par moi » ; grec : « en moi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δείξεις
  choice: tu manifesteras
  rationale: Le futur actif de δείκνυμι signifie « montrer, faire voir ». « Manifester » est naturel avec « bonté » et exprime que cette qualité divine devient visible dans le cas du priant.
- source_word: ἐν ἐμοί
  choice: en moi
  rationale: La traduction directe de ἐν préserve l’idée que la bonté de Dieu se révèle dans la personne et le sort de Manassé, sans imposer « envers moi » ni « par moi ».
- source_word: χρηστότητά
  choice: bonté
  rationale: χρηστότης peut désigner la bonté ou la bienveillance. « Bonté » garde la portée d’un attribut divin et permet une traduction cohérente du même terme dans la prière.
- source_word: ἀνάξιον ὄντα
  choice: malgré mon indignité
  rationale: Le participe signifie littéralement « étant indigne ». La formulation concessive rend clairement le contraste implicite entre l’indignité du priant et l’acte sauveur de Dieu.
- source_word: σώσεις
  choice: tu me sauveras
  rationale: σῴζω couvre ici à la fois la délivrance et le salut ; « sauver » en conserve toute l’ampleur dans cette prière pénitentielle.
- source_word: κατὰ τὸ πολὺ ἔλεός σου
  choice: selon l’abondance de ta miséricorde
  rationale: κατά avec l’accusatif indique la mesure ou la norme, tandis que πολὺ souligne la grandeur de la miséricorde. Cette formulation reste proche du grec et idiomatique en français soutenu.
theological_decisions:
- issue: Faut-il interpréter ἐν ἐμοί comme « envers moi » ou « par moi », ou conserver sa forme directe ?
  choice: en moi
  alternative: envers moi ; par moi
  rationale: 'Le grec porte ἐν et le contexte n’oblige pas à préciser la relation. « En moi » maintient l’ambiguïté féconde : la bonté peut être manifestée dans la personne, le cas ou l’expérience de Manassé.'
- issue: Valeur de l’expression participiale ἀνάξιον ὄντα
  choice: malgré mon indignité
  alternative: alors que je suis indigne ; moi qui suis indigne
  rationale: La valeur concessive est suggérée par le contraste avec « tu me sauveras », mais elle n’implique aucune théorie particulière du mérite ; elle affirme simplement l’indignité reconnue du priant face à la miséricorde divine.
translation_notes:
  register: Français moderne, digne et accessible. Le tutoiement convient à l’adresse directe à Dieu. « Manifesteras » évite une tournure lourde avec « montrer ta bonté », tandis que « en moi » conserve volontairement la formulation et l’ambiguïté du grec.
