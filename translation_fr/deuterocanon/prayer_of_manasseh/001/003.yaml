  text: the one who bound the sea by the word of your command,[a]
translation:
  language: fr
  text: toi qui as enchaîné la mer par la parole de ton commandement,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « contenu la mer par la parole de ton commandement ». Le grec évoque plus littéralement l’action de lier ou d’entraver.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πεδήσας
  choice: toi qui as enchaîné
  rationale: Le participe aoriste évoque concrètement l’action de lier ou d’entraver. « Enchaîné » conserve cette métaphore forte tout en restant naturel en français.
- source_word: τὴν θάλασσαν
  choice: la mer
  rationale: θάλασσα désigne directement la mer ; « les eaux » élargirait inutilement le sens.
- source_word: τῷ λόγῳ
  choice: par la parole
  rationale: λόγος désigne ici une parole prononcée et investie d’autorité. « Par la parole » rend directement l’instrument exprimé par le datif.
- source_word: τοῦ προστάγματός σου
  choice: de ton commandement
  rationale: πρόσταγμα signifie un ordre ou un commandement. Cette formulation préserve la construction grecque, où la parole exprime le commandement divin.
theological_decisions:
- issue: La souveraineté divine sur la création exprimée par l’image de la mer liée
  choice: 'Conserver l’image concrète : « enchaîné la mer »'
  alternative: « contenu la mer » ou « imposé des limites à la mer »
  rationale: Le grec emploie une métaphore vive de ligotage ou d’entrave. La conserver respecte la représentation de l’autorité divine sur la mer sans introduire une explication absente du texte.
translation_notes:
  register: Français moderne, digne et directement adressé à Dieu. « Enchaîné » maintient l’image poétique du grec ; « commandement » conserve le caractère solennel et autoritatif de la parole divine.
