base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/013.yaml
  text: 'I beg you[a], pleading with you: forgive me, Lord, forgive me, and do not destroy me along with my lawless deeds, nor, being angry forever, keep my evils against me, nor condemn me in the lowest parts of the earth; for you, Lord[b], are the God of those who repent[c],'
translation:
  language: fr
  text: 'Je t’en supplie, je t’implore : pardonne-moi, Seigneur, pardonne-moi. Ne me fais pas périr avec mes actes contraires à la loi ; ne garde pas éternellement contre moi mes fautes dans ta colère[a] ; ne me condamne pas dans les profondeurs de la terre[b]. Car c’est toi, Seigneur, qui es le Dieu de ceux qui se repentent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne conserve pas éternellement mes maux contre moi dans ta colère ». Le grec peut désigner les maux ou les mauvaises actions du suppliant conservés à son détriment.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans les lieux les plus bas de la terre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτοῦμαι δεόμενός σου
  choice: Je t’en supplie, je t’implore
  rationale: Le redoublement rend les deux expressions grecques de la demande instante tout en conservant un français naturel et digne.
- source_word: ἄνες μοι
  choice: pardonne-moi
  rationale: Dans cette prière pénitentielle, le verbe demande la remise de la faute ; « pardonne-moi » est plus clair ici que le sens littéral « relâche-moi ».
- source_word: συναπολέσῃς με ταῖς ἀνομίαις μου
  choice: me fais pas périr avec mes actes contraires à ta loi
  rationale: « Avec » conserve la force du préfixe συν-, tandis que la périphrase rend la nuance de ἀνομία sans réduire le terme au mot général « péchés ».
- source_word: μηνίσας ... εἰς τὸν αἰῶνα
  choice: reste pas irrité pour toujours
  rationale: Cette formulation rattache naturellement la colère durable à l’action de garder les fautes, sans surinterpréter l’aspect du participe.
- source_word: τηρήσῃς τὰ κακά μοι
  choice: en gardant mes fautes contre moi
  rationale: La traduction conserve l’image de fautes retenues au détriment du suppliant ; « fautes » est plus idiomatique en français que « maux » dans ce contexte moral.
- source_word: ἐν τοῖς κατωτάτοις τῆς γῆς
  choice: dans les profondeurs de la terre
  rationale: Cette expression française naturelle rend les régions les plus basses évoquées par le superlatif grec.
- source_word: τῶν μετανοούντων
  choice: ceux qui se repentent
  rationale: La formulation garde la valeur verbale du participe et demeure claire en français moderne.
- source_word: κύριε
  choice: Seigneur
  rationale: Titre divin usuel et approprié à l’adresse directe dans une prière.
theological_decisions:
- issue: Sens de ἀνομία
  choice: actes contraires à ta loi
  alternative: péchés
  rationale: Le choix préserve la nuance de transgression ou d’absence de loi, plus forte que le terme générique « péchés », sans introduire de précision confessionnelle.
- issue: Nature des « profondeurs de la terre »
  choice: conserver l’image spatiale sans l’identifier davantage
  alternative: séjour des morts / enfer
  rationale: Le grec évoque les régions les plus basses de la terre, mais ne les nomme pas explicitement ; la traduction préserve cette ambiguïté.
- issue: Caractère de Dieu envers les repentants
  choice: le Dieu de ceux qui se repentent
  alternative: le Dieu des pénitents
  rationale: La formulation verbale suit le participe grec et évite un vocabulaire susceptible de recevoir un sens confessionnel plus spécialisé.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. La répétition de la supplication et de « pardonne-moi » est maintenue pour préserver l’intensité de la prière. La ponctuation répartit la longue période grecque en unités lisibles.
