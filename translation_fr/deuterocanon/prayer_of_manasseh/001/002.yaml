translation:
  language: fr
  text: toi qui as fait le ciel et la terre, avec toute leur parure[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout leur ordre » ou « tout leur ordonnancement ». Ici, le grec κόσμος désigne probablement ce qui pare ou compose de manière ordonnée le ciel et la terre, plutôt qu’une nouvelle mention du « monde ».
    reason: alternative lexicale
lexical_decisions:
- source_word: ὁ ποιήσας
  choice: toi qui as fait
  rationale: Le participe aoriste précédé de l’article désigne Dieu par son action. Dans le contexte de cette prière adressée directement à Dieu, « toi qui as fait » restitue naturellement cette valeur descriptive sans ajouter la nuance plus spécialisée de « créé ».
- source_word: τὸν οὐρανὸν
  choice: le ciel
  rationale: Dans le couple cosmologique « le ciel et la terre », οὐρανός désigne le ciel au sens biblique large, et non seulement l’atmosphère ou le firmament visible.
- source_word: τὴν γῆν
  choice: la terre
  rationale: Associé au ciel dans cette formule cosmologique, γῆ désigne la terre entière plutôt qu’un territoire particulier.
- source_word: σὺν
  choice: avec
  rationale: La préposition exprime l’accompagnement et inclut l’élément suivant dans l’œuvre accomplie par Dieu. « Avec » est direct et naturel en français.
- source_word: παντὶ τῷ κόσμῳ αὐτῶν
  choice: tout leur agencement
  rationale: κόσμος peut désigner un ordre, un arrangement ou une parure. « Tout leur agencement » évoque ici l’ensemble ordonné propre au ciel et à la terre, sans répéter maladroitement l’idée de « monde ». Le possessif rend αὐτῶν.
theological_decisions:
- issue: Sens de κόσμος dans la formule cosmologique de création
  choice: agencement
  alternative: parure ; organisation ; ensemble ordonné
  rationale: Le ciel et la terre ayant déjà été nommés, traduire κόσμος par « monde » créerait une répétition ambiguë. Le sens d’ordre ou d’arrangement convient au contexte tout en maintenant l’éventail sémantique grec dans une note.
- issue: Forme descriptive ὁ ποιήσας dans une prière adressée à Dieu
  choice: toi qui as fait
  alternative: celui qui a fait
  rationale: Bien que la forme grecque soit un participe substantivé, elle s’inscrit dans une invocation directe. Le tour français à la deuxième personne préserve cette fonction sans transformer l’expression en affirmation détachée à la troisième personne.
translation_notes:
  register: Français international moderne, digne et accessible. « Agencement » conserve la notion d’un ensemble disposé avec ordre ; la note maintient les autres nuances possibles de κόσμος. La minuscule initiale et la virgule finale respectent le caractère continu de l’invocation.
