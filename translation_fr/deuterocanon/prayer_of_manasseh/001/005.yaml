  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/005.yaml
  text: before whom all things shudder and tremble at the presence of your power[a], for the majesty of your glory is unendurable, and the wrath of your threat against sinners is unbearable[d][c][b],
translation:
  language: fr
  text: devant qui toutes choses frissonnent et tremblent en présence de ta puissance[a] ; car la majesté de ta gloire est insoutenable[b], et la colère de ta menace contre les pécheurs est impossible à supporter[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « depuis/devant la face de ta puissance » ; la locution désigne ici la présence redoutable de cette puissance.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction : « nul ne peut résister à la majesté de ta gloire ».'
    reason: lexical_alternative
  - marker: c
    text: 'Autre traduction : « la colère de ta menace contre les pécheurs est insupportable ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: devant qui
  rationale: Le pronom relatif renvoie à Dieu. « Devant qui » rend naturellement l’idée de comparution en sa présence sans transformer le relatif en une nouvelle proposition.
- source_word: πάντα
  choice: toutes choses
  rationale: Le neutre pluriel désigne ici l’ensemble de la création plutôt que les seuls êtres humains ; « toutes choses » en conserve la portée universelle.
- source_word: φρίσσει καὶ τρέμει
  choice: frissonnent et tremblent
  rationale: Les deux verbes expriment une réaction physique de crainte. Leur coordination est conservée afin de maintenir l’intensité et le parallélisme du grec.
- source_word: ἀπὸ προσώπου τῆς δυνάμεώς σου
  choice: en présence de ta puissance
  rationale: Littéralement « loin de/devant la face de ta puissance ». Ici, la locution désigne la présence redoutable de la puissance divine ; cette formulation reste claire tout en préservant l’image de la présence.
- source_word: ἄστεκτος
  choice: nul ne peut résister à
  rationale: L’adjectif qualifie ce devant quoi il est impossible de tenir ferme. La tournure verbale française exprime ce sens plus naturellement que « insoutenable » dans ce contexte.
- source_word: μεγαλοπρεπία τῆς δόξης σου
  choice: la majesté de ta gloire
  rationale: « Majesté » rend la grandeur imposante de μεγαλοπρεπία, tandis que « gloire » conserve le poids religieux usuel de δόξα.
- source_word: ἀνυπόστατος
  choice: ni soutenir
  rationale: Le mot désigne ce qu’on ne peut affronter ou supporter. « Soutenir » maintient l’image de l’incapacité à tenir face à la colère et varie légèrement le rendu du terme parallèle ἄστεκτος.
- source_word: ὀργὴ τῆς ἐπὶ ἁμαρτωλοὺς ἀπειλῆς σου
  choice: la colère de ta menace contre les pécheurs
  rationale: Cette traduction conserve la construction dense du grec, qui associe explicitement la colère divine à sa menace dirigée contre les pécheurs, sans l’adoucir en simple avertissement.
theological_decisions:
- issue: Langage anthropopathique de la colère et de la menace divines
  choice: Conserver « la colère de ta menace contre les pécheurs »
  alternative: la colère dont tu menaces les pécheurs
  rationale: Le grec attribue directement à Dieu la colère et la menace. La formulation retenue garde cette force personnelle et judiciaire, ainsi que la tension du génitif, sans développer une doctrine du jugement au-delà du texte.
- issue: Portée cosmique de πάντα
  choice: « toutes choses »
  alternative: « tous »
  rationale: Le neutre grec favorise une référence à la totalité créée. La traduction évite de limiter arbitrairement la réaction aux seuls êtres humains.
translation_notes:
  register: Registre solennel et priant, mais en français moderne. Le parallélisme du grec est maintenu, de même que la distinction entre « frissonner » et « trembler ». Les tournures verbales « nul ne peut résister » et « ni soutenir » évitent des adjectifs lourds tout en conservant la force du texte.
