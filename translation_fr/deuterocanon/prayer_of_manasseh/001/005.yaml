  naturalness: « En présence de ta puissance » convient à un registre priant moderne. « La majesté de ta gloire est insoutenable » et « la colère de ta menace ... est impossible à supporter » sont clairs, solennels et reproduisent plus directement la syntaxe prédicative du grec.
  terminology: '« Majesté », « gloire », « colère », « menace » et « pécheurs » sont appropriés. La note a du brouillon doit être corrigée : ἀπὸ προσώπου ne signifie pas littéralement « loin de la face »; la locution exprime ici la réaction suscitée par la présence ou la face de la puissance divine.'
