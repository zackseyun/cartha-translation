  text: And now I bend the knee of my heart[a], imploring the kindness from you[b];
translation:
  language: fr
  text: Et maintenant, je fléchis le genou de mon cœur[a], implorant la bonté qui vient de toi[b] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je courbe le genou de mon cœur ». Le grec conserve l’image vive d’un agenouillement intérieur.
    reason: lexical_alternative
  - marker: b
    text: Ou « ta bonté ». L’expression grecque dit littéralement « la bonté venant de toi » et souligne qu’elle procède de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Et maintenant
  rationale: Conserve à la fois la liaison exprimée par καί et l’immédiateté temporelle de νῦν.
- source_word: κλίνω
  choice: je plie
  rationale: Rend concrètement l’action de fléchir ou de courber et s’associe naturellement au « genou ».
- source_word: γόνυ καρδίας
  choice: le genou de mon cœur
  rationale: Respecte le singulier grec et maintient l’image saisissante d’un agenouillement intérieur, sans la réduire à une explication abstraite.
- source_word: δεόμενος
  choice: en implorant
  rationale: Exprime une supplication pressante dans un registre digne et naturel pour une prière.
- source_word: τῆς παρὰ σοῦ χρηστότητος
  choice: la bonté qui vient de toi
  rationale: χρηστότης peut désigner la bonté ou la bienveillance; « bonté » convient au registre de la prière, tandis que « qui vient de toi » rend explicitement παρὰ σοῦ.
theological_decisions:
- issue: Métaphore γόνυ καρδίας
  choice: Conserver « le genou de mon cœur »
  alternative: « je m’incline de tout mon cœur » ou « j’humilie mon cœur »
  rationale: La repentance est présentée par l’image corporelle d’un agenouillement intérieur. Garder cette métaphore préserve la force poétique et théologique du grec sans ajouter une interprétation.
- issue: Origine de la χρηστότης
  choice: « la bonté qui vient de toi »
  alternative: « ta bonté »
  rationale: Cette formulation préserve la nuance de παρὰ σοῦ, qui présente la bonté demandée comme procédant de Dieu, sans préciser davantage sa nature.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le mouvement de la prière grecque ainsi que sa métaphore inhabituelle; « en implorant » évite un registre trop familier, et « bonté » reste assez large pour ne pas réduire χρηστότης à la seule miséricorde.
