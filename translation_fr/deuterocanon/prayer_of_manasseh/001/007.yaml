  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/007.yaml
  text: For you are the Lord Most High[a], compassionate, patient, and abounding in mercy[b], and relenting concerning the evils of men.
translation:
  language: fr
  text: Car c’est toi, Seigneur Très-Haut, qui es compatissant, patient, riche en miséricorde et qui reviens sur les malheurs des humains.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et qui reviens sur les maux des humains ». Le grec peut désigner soit les malheurs qui frappent les humains, soit leurs mauvaises actions; le verbe peut aussi se rendre par « changer d’avis » ou « se repentir », mais, appliqué à Dieu dans ce contexte, il exprime le fait de revenir sur un jugement, non un repentir moral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος ὕψιστος
  choice: Seigneur Très-Haut
  rationale: Rend naturellement le titre divin κύριος associé à l’épithète ὕψιστος, sans affaiblir sa portée.
- source_word: εὔσπλαγχνος
  choice: compatissant
  rationale: Exprime la compassion profonde du terme tout en évitant de faire double emploi avec πολυέλεος.
- source_word: μακρόθυμος
  choice: patient
  rationale: Traduction française actuelle et concise de l’idée de patience et de longanimité.
- source_word: πολυέλεος
  choice: riche en miséricorde
  rationale: Restitue l’abondance exprimée par le composé grec dans une formule française naturelle et digne.
- source_word: μετανοῶν
  choice: qui renonces
  rationale: Dans cette prédication appliquée à Dieu, le participe évoque le fait de revenir sur un malheur ou un jugement annoncé, non un repentir moral.
- source_word: ἐπὶ κακίαις ἀνθρώπων
  choice: aux malheurs destinés aux humains
  rationale: Le pluriel κακίαις peut désigner des maux ou malheurs; avec μετανοῶν, le contexte favorise les calamités ou jugements concernant les êtres humains plutôt que leur méchanceté.
theological_decisions:
- issue: Le sens de μετανοῶν lorsqu’il est attribué à Dieu
  choice: qui renonces
  alternative: qui te repens / qui changes d’avis
  rationale: « Renoncer » préserve l’idée de réponse divine et de retrait du jugement sans suggérer que Dieu se repent d’une faute morale.
- issue: Le référent de κακίαις
  choice: les malheurs destinés aux humains
  alternative: les méchancetés des humains
  rationale: La construction μετανοεῖν ἐπί avec le datif peut exprimer le fait de renoncer à des maux ou calamités. La formulation grecque demeure comprimée; une note conserve l’autre compréhension possible.
- issue: La portée de ἀνθρώπων
  choice: humains
  alternative: hommes
  rationale: ἄνθρωπος désigne ici collectivement les êtres humains; « humains » en restitue directement la portée générique en français moderne.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure répétée « qui es… et qui… » rend explicitement les deux participes prédicatifs et assure une syntaxe naturelle. La note maintient l’ambiguïté réelle de κακίαις et la tension de μετανοῶν appliqué à Dieu.
