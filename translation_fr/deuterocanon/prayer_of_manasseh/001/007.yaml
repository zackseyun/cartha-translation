    issue: Ajout de « destinés »
    rationale: Le grec ἐπὶ κακίαις ἀνθρώπων ne dit pas que les maux sont « destinés » aux humains. Cette précision oriente l’interprétation vers des calamités projetées et réduit l’ambiguïté sémantique de κακίαις.
  - severity: low
    issue: Note à clarifier sur « te repens »
    rationale: Comme le verbe est attribué à Dieu, l’alternative lexicale doit indiquer qu’elle ne signifie pas un repentir moral; sinon la note peut créer une implication que le texte grec ne requiert pas.
