translation:
  language: fr
  text: toi qui as enfermé l’abîme et l’as scellé par ton nom redoutable et glorieux,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « impressionnant et glorieux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κλείσας
  choice: toi qui as enfermé
  rationale: Le participe aoriste qualifie la personne à qui s’adresse la prière. « Enfermé » exprime ici non seulement la fermeture, mais aussi la maîtrise et la contention de l’abîme.
- source_word: τὴν ἄβυσσον
  choice: l’abîme
  rationale: Dans le grec biblique, ἄβυσσος désigne la profondeur insondable ou l’abîme cosmique. « L’abîme » en conserve naturellement la portée.
- source_word: σφραγισάμενος
  choice: l’as scellé
  rationale: Le participe moyen décrit l’action de fermer solidement au moyen d’un sceau. « Scellé » est précis, concis et naturel en français.
- source_word: αὐτὴν
  choice: l’
  rationale: Le pronom reprend « l’abîme ». Le pronom élidé évite une répétition inutile et reste sans ambiguïté.
- source_word: τῷ ... ὀνόματί σου
  choice: de ton ... nom
  rationale: Le datif est instrumental. En français, « sceller de son nom » rend naturellement le moyen ou la marque qui constitue le sceau.
- source_word: φοβερῷ
  choice: redoutable
  rationale: φοβερός désigne ce qui inspire crainte et révérence. « Redoutable » garde cette force solennelle sans suggérer que le nom lui-même éprouve de la peur.
- source_word: ἐνδόξῳ
  choice: glorieux
  rationale: « Glorieux » transmet directement l’honneur, l’éclat et la majesté exprimés par ἔνδοξος, dans un registre adapté à la prière.
theological_decisions:
- issue: Rendu de φοβερῷ appliqué au nom de Dieu
  choice: redoutable
  alternative: impressionnant
  rationale: « Redoutable » indique que le nom divin inspire une crainte révérencielle et préserve la tension du grec. « Impressionnant » est plus courant, mais atténue quelque peu cette dimension de crainte sacrée.
translation_notes:
  register: Français moderne, digne et liturgique. L’adresse « toi qui » maintient le lien participial avec l’invocation environnante. La formulation conserve l’imagerie cosmique et la crainte révérencielle sans archaïsme excessif.
