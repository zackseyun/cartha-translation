  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/015.yaml
  text: And I will praise you continually all the days of my life[a], for all the host of the heavens sings praise to you, and yours is the glory forever[c][b]. Amen.
translation:
  language: fr
  text: Et je te louerai sans cesse pendant les jours de ma vie, car toute l’armée des cieux[a] chante tes louanges, et à toi appartient la gloire pour toujours. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute la puissance des cieux » ou « toute puissance céleste ». Le grec peut désigner collectivement l’armée ou les êtres célestes, mais aussi se comprendre comme une puissance céleste.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰνέσω
  choice: je te louerai
  rationale: Le futur de αἰνέω exprime ici l’engagement à louer Dieu. Cette formulation est claire, naturelle et adaptée à une prière.
- source_word: διὰ παντός
  choice: sans cesse
  rationale: Cette locution signifie « continuellement » ou « en tout temps ». « Sans cesse » rend l’idée avec naturel sans alourdir la phrase.
- source_word: ἐν ταῖς ἡμέραις τῆς ζωῆς μου
  choice: pendant les jours de ma vie
  rationale: Cette traduction respecte la préposition ἐν et n’ajoute pas l’idée de « tous », absente de ce groupe grec; l’idée de continuité est déjà portée par διὰ παντός.
- source_word: ὑμνεῖ
  choice: chante tes louanges
  rationale: ὑμνέω peut désigner le fait de chanter un hymne ou des louanges. Cette expression française conserve la nuance musicale.
- source_word: πᾶσα ἡ δύναμις τῶν οὐρανῶν
  choice: toute l’armée des cieux
  rationale: Dans un contexte céleste et liturgique, δύναμις peut désigner collectivement les puissances ou l’armée céleste. « L’armée des cieux » conserve cette portée personnelle et collective sans préciser davantage la nature de ces êtres.
- source_word: σοῦ ἐστιν ἡ δόξα
  choice: à toi appartient la gloire
  rationale: Cette tournure rend l’insistance du pronom σοῦ et garde la force doxologique de l’expression.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Formule française naturelle exprimant la durée sans fin dans une doxologie.
- source_word: ἀμήν
  choice: Amen
  rationale: Translittération liturgique traditionnelle, immédiatement compréhensible en français.
theological_decisions:
- issue: Sens de πᾶσα ἡ δύναμις τῶν οὐρανῶν
  choice: Référence collective à l’armée céleste qui loue Dieu
  alternative: La puissance entière des cieux, ou toute puissance céleste, loue Dieu
  rationale: L’emploi biblique grec de δύναμις dans un cadre céleste peut désigner des puissances ou des êtres célestes. Le texte principal retient le sens collectif probable, tandis que la note préserve l’ambiguïté lexicale sans imposer une angélologie détaillée.
translation_notes:
  register: Français international moderne, digne et accessible, avec une cadence liturgique sobre. La répétition des idées de louange est conservée en distinguant « louerai » et « chante tes louanges ».
