base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/010.yaml
  text: I am bent down with many iron bonds[a], so that I cannot lift up my head, and there is no relief for me; because I provoked your wrath and did what is evil before you[b], setting up abominations and multiplying offenses.
translation:
  language: fr
  text: 'Je suis courbé sous de lourdes chaînes de fer[a], au point de ne pouvoir relever la tête, et je n’ai aucun soulagement, car j’ai provoqué ta colère et fait ce qui est mal devant toi : j’ai dressé des choses abominables[b] et multiplié les offenses.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sans pouvoir me redresser», «reprendre mes esprits» ou «regarder de nouveau vers le haut»; le verbe grec peut évoquer le redressement physique ou le rétablissement.
    reason: lexical_alternative
  - marker: b
    text: Les «choses abominables» désignent probablement ici des actes ou des objets détestables liés à l’idolâtrie.
    reason: cultural_note
lexical_decisions:
- source_word: κατακαμπτόμενος
  choice: Je suis courbé
  rationale: Le participe exprime l’état d’une personne pliée ou courbée sous un poids; cette formulation conserve l’image physique et reste naturelle en français.
- source_word: πολλῷ δεσμῷ σιδηρῷ
  choice: sous de lourdes chaînes de fer
  rationale: δεσμός désigne un lien, une entrave ou une chaîne, et σιδηρῷ précise la matière. πολλῷ marque ici l’intensité ou l’ampleur de la contrainte; «de lourdes chaînes» rend naturellement cette force sans reproduire maladroitement le singulier grec.
- source_word: εἰς τὸ ἀνανεῦσαί με
  choice: au point de ne pouvoir relever la tête
  rationale: Dans le contexte immédiat d’une personne courbée sous des chaînes, ἀνανεύω évoque le fait de se redresser ou de regarder de nouveau vers le haut. Le grec ne contient pas explicitement la négation, mais la construction décrit ici l’empêchement produit par les liens; la note conserve les autres nuances possibles.
- source_word: ἄνεσις
  choice: soulagement
  rationale: Le nom peut désigner le relâchement d’une pression, le repos ou la délivrance. «Soulagement» convient à la détresse décrite sans réduire le terme à une libération physique.
- source_word: παρώργισα τὸν θυμόν σου
  choice: j’ai provoqué ta colère
  rationale: παροργίζω a une valeur causative, «provoquer à la colère». «Colère» rend θυμός avec gravité tout en restant courant et digne en français moderne.
- source_word: τὸ πονηρὸν ἐνώπιόν σου ἐποίησα
  choice: fait ce qui est mal devant toi
  rationale: Cette formulation préserve l’idiome biblique et son orientation vers Dieu, dans une langue française claire et actuelle.
- source_word: στήσας βδελύγματα
  choice: j’ai dressé des choses abominables
  rationale: στήσας indique l’action de mettre debout, dresser ou installer. βδελύγματα désigne des réalités détestables, probablement cultuelles ou idolâtres, sans que la traduction doive les identifier plus précisément que le grec.
- source_word: πληθύνας προσοχθίσματα
  choice: multiplié les offenses
  rationale: Le substantif rare désigne ce qui suscite l’aversion ou l’indignation. «Offenses» garde une portée suffisamment large et s’intègre naturellement à la confession.
theological_decisions:
- issue: Langage de la colère divine
  choice: ta colère
  alternative: ton courroux
  rationale: Le texte attribue directement à Dieu θυμός. «Colère» en conserve le sens et la gravité sans archaïsme ni ajout doctrinal.
- issue: Sens de εἰς τὸ ἀνανεῦσαί με dans l’image corporelle
  choice: au point de ne pouvoir relever la tête
  alternative: sans pouvoir reprendre mes esprits / regarder de nouveau vers le haut
  rationale: L’image immédiate est celle d’un homme courbé sous des chaînes. Le choix principal maintient cette dimension corporelle, tandis que la note signale l’ambiguïté réelle du verbe.
- issue: Portée de βδελύγματα
  choice: des choses abominables
  alternative: des idoles abominables
  rationale: Le contexte de Manassé rend probable une allusion à l’idolâtrie, mais le nom grec reste plus général. La traduction évite donc de transformer cette probabilité en précision explicite.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le mouvement de la confession grecque et son imagerie physique, tout en évitant les tournures archaïques. Les ambiguïtés de ἀνανεύω et la probable portée idolâtre de βδελύγματα sont préservées au moyen de notes.
