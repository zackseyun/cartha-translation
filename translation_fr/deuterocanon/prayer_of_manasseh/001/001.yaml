  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/001.yaml
  text: Lord Almighty[a], God of our fathers, of Abraham and Isaac and Jacob and of their righteous offspring,
translation:
  language: fr
  text: Seigneur tout-puissant, Dieu de nos pères, d’Abraham, d’Isaac et de Jacob, et de leur juste descendance[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « semence ». Le terme grec peut aussi se traduire plus littéralement ainsi, notamment dans les contextes liés à la lignée de l’alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Seigneur
  rationale: Vocatif de κύριος employé pour s’adresser à Dieu. « Seigneur » est le titre divin courant et convient au ton solennel de la prière.
- source_word: παντοκράτωρ
  choice: tout-puissant
  rationale: Rend naturellement le titre divin παντοκράτωρ en français biblique moderne, tout en conservant sa force théologique.
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Dieu de nos pères
  rationale: Conserve la formule biblique d’alliance et le masculin explicite de πατέρων.
- source_word: τοῦ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ
  choice: d’Abraham, d’Isaac et de Jacob
  rationale: La répétition française de « de » clarifie le lien génitif avec chacun des patriarches, tandis que la ponctuation donne une cadence naturelle.
- source_word: σπέρματος
  choice: descendance
  rationale: Dans ce contexte de lignée, σπέρμα désigne collectivement la postérité. « Descendance » est clair en français actuel et maintient la valeur collective du terme.
- source_word: αὐτῶν
  choice: leur
  rationale: Le pronom renvoie naturellement aux trois patriarches mentionnés, conformément à son antécédent pluriel grec.
- source_word: τοῦ δικαίου
  choice: juste
  rationale: L’adjectif qualifie la descendance. « Juste » est une traduction biblique courante de δίκαιος et s’accorde naturellement avec « descendance ».
theological_decisions:
- issue: Langage masculin de l’alliance dans τῶν πατέρων ἡμῶν
  choice: nos pères
  alternative: nos ancêtres
  rationale: Le grec dit explicitement « pères » et reprend une formule biblique traditionnelle de l’alliance; la formulation n’est donc pas neutralisée.
- issue: Valeur de σπέρμα dans un contexte de lignée
  choice: descendance
  alternative: semence
  rationale: « Descendance » exprime clairement le sens collectif visé, tandis qu’une note conserve la métaphore littérale et sa possible résonance d’alliance.
translation_notes:
  register: Français international moderne, digne et accessible, avec une cadence solennelle adaptée à une invocation. La structure génitive du grec est conservée sans produire une tournure artificielle.
