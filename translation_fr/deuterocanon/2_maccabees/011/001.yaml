    text: 'La phrase se poursuit au verset suivant : comme en grec, ce verset s’achève sur une proposition participiale qui reste en suspens.'
    reason: cross_reference
lexical_decisions:
- source_word: Μετʼ ὀλίγον δὲ παντελῶς χρονίσκον
  choice: Mais très peu de temps après
  rationale: La tournure accumule Μετʼ ὀλίγον, παντελῶς et le diminutif χρονίσκον pour souligner l’extrême brièveté de l’intervalle. Cette formulation française en restitue naturellement l’insistance.
- source_word: ἐπίτροπος τοῦ Βασιλέως
  choice: tuteur du roi
  rationale: ἐπίτροπος désigne une personne à qui est confiée la garde ou la direction des intérêts d’une autre. « Tuteur » conserve ce sens sans imposer le titre constitutionnel plus précis de « régent ».
- source_word: συγγενής
  choice: parent de celui-ci
  rationale: Le terme indique un lien de parenté. « Parent » est actuel et clair; « de celui-ci » évite que le français ne rattache ce complément à une autre personne que le roi.
- source_word: ἐπὶ τῶν πραγμάτων
  choice: chargé des affaires du royaume
  rationale: L’expression désigne une responsabilité officielle dans la conduite des affaires. L’ajout explicatif « du royaume » rend l’idiome grec intelligible dans ce contexte de cour sans lui attribuer un titre technique.
- source_word: λίαν βαρέως φέρων ἐπὶ τοῖς γεγονόσι
  choice: profondément affecté par ce qui s’était passé
  rationale: L’idiome signifie éprouver très péniblement quelque chose. Cette traduction moderne garde l’intensité de λίαν et rend τοῖς γεγονόσι par une proposition naturelle.
