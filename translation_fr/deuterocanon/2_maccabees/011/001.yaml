  text: But after a very short time[a], Lysias, the king’s guardian and kinsman and administrator of affairs, taking the events very hard[c][b],
translation:
  language: fr
  text: Mais très peu de temps après[a], Lysias, tuteur du roi[b], parent du roi et chargé des affaires, profondément affecté par ce qui s’était passé[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mais après un court délai, vraiment très bref. » L’expression grecque insiste fortement sur la brièveté de l’intervalle.'
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « tuteur » peut aussi signifier « régent », « intendant » ou « administrateur », selon la fonction officielle attribuée à Lysias.
