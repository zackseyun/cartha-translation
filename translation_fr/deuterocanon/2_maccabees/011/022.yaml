  yaml_path: translation/deuterocanon/2_maccabees/011/022.yaml
  text: 'And the king’s letter contained this: “King Antiochus to his brother Lysias[b][a], greetings.”'
translation:
  language: fr
  text: 'La lettre du roi contenait ceci[a] : « Le roi Antiochus à son frère Lysias[b], salut. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « contenait ainsi » ; cette expression introduit ici la teneur de la lettre.'
    reason: lexical_alternative
  - marker: b
    text: Le mot « frère » peut être un titre de cour exprimant une proximité politique, et non l’indication d’un lien familial au sens strict.
    reason: cultural_note
lexical_decisions:
- source_word: Ἡ ... ἐπιστολή
  choice: La lettre du roi
  rationale: ἐπιστολή désigne couramment une lettre ou un message écrit. « Lettre » est le terme moderne le plus clair, et le génitif τοῦ βασιλέως indique qu’elle vient du roi.
- source_word: περιεῖχεν οὕτως
  choice: était rédigée ainsi
  rationale: L’expression signifie littéralement que la lettre « contenait ainsi » ce qui suit, mais elle sert idiomatiquement à introduire sa teneur. « Était rédigée ainsi » conserve cette fonction dans un français naturel et digne.
- source_word: Βασιλεὺς Ἀντίοχος
  choice: Le roi Antiochos
  rationale: La séquence titre-nom constitue l’en-tête conventionnel de la lettre. « Antiochos » est la translittération française usuelle du grec Ἀντίοχος.
- source_word: τῷ ἀδελφῷ Λυσίᾳ
  choice: à son frère Lysias
  rationale: Le datif désigne le destinataire. « Son frère » rend naturellement la relation exprimée, tout en laissant une note préciser qu’ἀδελφός peut être un titre de cour plutôt qu’un lien familial littéral.
- source_word: χαίρειν
  choice: salut !
  rationale: χαίρειν est la formule épistolaire grecque conventionnelle. « Salut ! » en donne ici un équivalent français bref, reconnaissable et adapté à l’en-tête d’une lettre antique.
