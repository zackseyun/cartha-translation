  text: Portez-vous bien. Puisse-t-il en être comme nous le souhaitons ; nous aussi, nous sommes en bonne santé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρρωσθε
  choice: Portez-vous bien
  rationale: Dans une conclusion épistolaire, cet impératif pluriel fonctionne comme une formule de salutation finale. « Portez-vous bien » en conserve à la fois le caractère conventionnel et l’image de vigueur ou de santé.
- source_word: εἴη ἂν
  choice: Puisse-t-il en être
  rationale: L’optatif accompagné de ἄν exprime ici une nuance de souhait. Cette tournure française garde cette valeur sans la transformer en simple affirmation.
- source_word: ὡς βούλομεθα
  choice: comme nous le souhaitons
  rationale: βούλομαι exprime la volonté ou le souhait. « Souhaitons » convient au registre soigné d’une lettre officielle tout en restant naturel.
- source_word: καὶ αὐτοὶ δὲ
  choice: nous aussi, nous
  rationale: La reprise pronominale rend naturellement en français l’accent modéré porté par αὐτοί et la correspondance introduite par καί et δέ.
- source_word: ὑγιαίνομεν
  choice: sommes en bonne santé
  rationale: Le verbe signifie être sain ou en bonne santé. Cette formulation convient bien à la convention épistolaire.
