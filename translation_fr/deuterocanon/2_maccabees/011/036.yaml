  yaml_path: translation/deuterocanon/2_maccabees/011/036.yaml
  text: But whatever he has decided should be presented to the king, send someone at once to examine these matters, so that we may settle them as is fitting for us; for we are going on to Antioch.
translation:
  language: fr
  text: Quant à tout ce qu’il a décidé de faire présenter au roi, envoyez aussitôt quelqu’un pour examiner ces questions, afin que nous puissions les régler comme il convient pour nous[a] ; car nous sommes en route pour Antioche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « afin que nous puissions nous en occuper comme il convient pour nous ». Le grec dit littéralement : « afin que nous les ayons comme il convient pour nous » ; l’expression désigne probablement la manière appropriée de traiter ou de régler ces questions.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ δὲ
  choice: Quant à ce que
  rationale: Cette tournure rend la transition légère marquée par δέ et la relative indéfinie, sans imposer un contraste fort.
- source_word: ἔκρινεν
  choice: il a décidé
  rationale: κρίνω désigne ici une décision officielle ; le passé composé exprime naturellement en français sa pertinence présente.
- source_word: προσανενεχθῆναι τῷ Βασιλεῖ
  choice: de soumettre au roi
  rationale: Dans ce contexte administratif, le passif de προσαναφέρω évoque la présentation formelle d’une affaire à l’autorité royale.
- source_word: πέμψατέ τινα παραχρῆμα
  choice: envoyez aussitôt quelqu’un
  rationale: La formulation conserve l’impératif, l’indétermination de τις et l’urgence exprimée par παραχρῆμα.
- source_word: ἐπισκεψόμενον περὶ τούτων
  choice: pour examiner ces questions
  rationale: Le participe futur indique ici le but de l’envoi ; « examiner » convient au registre administratif.
- source_word: ἵνʼ ἔχωμεν ὡς καθήκει ἡμῖν
  choice: afin que nous puissions les régler comme il convient pour nous
  rationale: Le sens littéral de ἔχωμεν, « que nous les ayons », appelle en français une explicitation idiomatique. « Régler » exprime l’idée probable de disposer convenablement de ces affaires, tandis que la note préserve l’ambiguïté.
- source_word: ἡμεῖς γὰρ προσάγομεν πρὸς Ἀντιοχίαν
  choice: car nous sommes en route pour Antioche
  rationale: Avec une destination, προσάγομεν décrit ici un déplacement vers Antioche ; cette formulation est naturelle et n’ajoute pas de précision sur le mode de voyage.
