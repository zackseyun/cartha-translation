base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/007.yaml
  text: But Maccabeus himself[a], taking up arms first, urged the others, risking danger along with him, to come to the aid of their brothers[b]; and together they also rushed out eagerly.
translation:
  language: fr
  text: Mais le Maccabée lui-même, ayant pris les armes le premier, exhorta les autres à risquer leur vie avec lui et à venir au secours de leurs frères[a] ; puis tous ensemble s’élancèrent avec ardeur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « frères » désigne probablement les autres Juifs ou les membres de leur peuple.
    reason: note_culturelle
lexical_decisions:
- source_word: αὐτὸς δὲ πρῶτος ὁ Μακκαβαῖος
  choice: Mais le Maccabée lui-même ... le premier
  rationale: « Lui-même » rend l’emphase de αὐτός, tandis que « le premier » exprime l’initiative marquée par πρῶτος. « Mais » traduit la transition narrative δέ sans la renforcer.
- source_word: ἀναλαβὼν τὰ ὅπλα
  choice: ayant pris les armes
  rationale: Cette expression française naturelle conserve l’image militaire et la valeur antérieure du participe aoriste.
- source_word: προετρέψατο τοὺς ἄλλους
  choice: exhorta les autres
  rationale: « Exhorta » exprime l’encouragement pressant dans ce contexte militaire, sans ajouter l’idée d’un ordre.
- source_word: ἅμα αὐτῷ διακινδυνεύοντας
  choice: qui affrontaient le danger avec lui
  rationale: La proposition relative française garde le participe rattaché à « les autres » et exprime leur participation au même péril, sans en faire explicitement un second objet de l’exhortation.
- source_word: ἐπιβοηθεῖν τοῖς ἀδελφοῖς αὐτῶν
  choice: à venir au secours de leurs frères
  rationale: « Venir au secours » rend la nuance d’intervention urgente de ἐπιβοηθεῖν. Le terme concret « frères » préserve la métaphore de parenté du grec.
- source_word: ὁμοῦ δὲ καὶ προθύμως ἐξώρμησαν
  choice: puis tous ensemble s’élancèrent avec ardeur
  rationale: « Tous ensemble » restitue ὁμοῦ dans son sens collectif, tandis que « s’élancèrent avec ardeur » conserve l’énergie de ἐξώρμησαν et l’empressement de προθύμως.
theological_decisions:
- issue: Portée de ἀδελφοῖς αὐτῶν
  choice: leurs frères
  alternative: leurs compatriotes / les membres de leur peuple
  rationale: Le grec emploie littéralement le langage de la fraternité. Le contexte vise probablement d’autres Juifs ou des membres de leur peuple, mais la traduction principale conserve l’expression du texte sans en réduire la portée à une seule interprétation.
- issue: Relation syntaxique de ἅμα αὐτῷ διακινδυνεύοντας avec l’exhortation
  choice: les autres, qui affrontaient le danger avec lui
  alternative: il exhorta les autres à affronter le danger avec lui
  rationale: Le participe accusatif se rapporte grammaticalement à « les autres » et peut décrire leur participation au danger, tandis qu’une reformulation à l’infinitif en ferait plus nettement le contenu de l’exhortation. La traduction principale préserve la construction participiale et la note signale l’autre lecture possible.
translation_notes:
  register: Français international actuel, digne et narratif. Le passé simple convient au récit historique ; le vocabulaire reste accessible. La ponctuation évite le calque de la longue période grecque tout en maintenant ses rapports logiques.
