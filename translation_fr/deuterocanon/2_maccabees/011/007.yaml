revisions:
- from: Mais le Maccabée lui-même, ayant pris les armes le premier, exhorta les autres, qui affrontaient le danger avec lui[a], à venir au secours de leurs frères[b] ; puis tous ensemble s’élancèrent avec ardeur.
  to: Mais le Maccabée lui-même, ayant pris les armes le premier, exhorta les autres à risquer leur vie avec lui et à venir au secours de leurs frères[a] ; puis tous ensemble s’élancèrent avec ardeur.
  rationale: La révision rend le participe διακινδυνεύοντας par « à risquer leur vie avec lui », coordonné avec « à venir au secours ». Elle conserve ainsi le fait que les autres partagent le péril de Maccabée et le lien de cette participation avec son exhortation. La note syntaxique est supprimée, car la reformulation ne tranche pas une variante textuelle ni une ambiguïté doctrinale, tandis que la note culturelle sur « frères » demeure utile.
