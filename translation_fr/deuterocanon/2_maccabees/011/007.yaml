    text: Ici, « frères » désigne probablement les autres Juifs ou les membres de leur peuple.
    reason: note_culturelle
  revision_rationale: La révision rend le participe διακινδυνεύοντας par « à risquer leur vie avec lui », coordonné avec « à venir au secours ». Elle conserve ainsi le fait que les autres partagent le péril de Maccabée et le lien de cette participation avec son exhortation. La note syntaxique est supprimée, car la reformulation ne tranche pas une variante textuelle ni une ambiguïté doctrinale, tandis que la note culturelle sur « frères » demeure utile.
