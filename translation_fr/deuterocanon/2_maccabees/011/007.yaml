review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèlement rendu. Toutefois, « qui affrontaient le danger avec lui » présente la participation au danger comme un fait descriptif en cours et affaiblit le lien étroit du participe grec avec l’exhortation. Une coordination infinitive rend clairement les deux actions auxquelles Maccabée encourage les autres, sans ajout de sens.
  naturalness: Le français est globalement naturel et de registre narratif approprié. « Exhorta les autres à risquer leur vie avec lui et à venir au secours de leurs frères » est plus idiomatique et plus direct que la relative.
  terminology: « Maccabée », « prendre les armes », « venir au secours » et « frères » conviennent. « Risquer leur vie » rend naturellement διακινδυνεύειν dans ce contexte militaire, sans le réduire à une notion abstraite de danger.
  issues:
  - severity: medium
    issue: La relative « qui affrontaient le danger avec lui » déplace la fonction du participe grec.
    rationale: ἅμα αὐτῷ διακινδυνεύοντας qualifie bien « les autres », mais dans la construction il est étroitement associé à προετρέψατο et à l’infinitif ἐπιβοηθεῖν. La relative française tend à en faire une circonstance déjà établie plutôt qu’une action à laquelle ils sont exhortés.
  - severity: low
    issue: La note a signale une ambiguïté plus forte que ne le requiert le grec.
    rationale: Le rattachement grammatical du participe à « les autres » est net. La reformulation infinitive française explicite naturellement sa relation avec l’exhortation; une note textuelle n’est donc pas nécessaire.
  revised_text: Mais le Maccabée lui-même, ayant pris les armes le premier, exhorta les autres à risquer leur vie avec lui et à venir au secours de leurs frères[a] ; puis tous ensemble s’élancèrent avec ardeur.
  revised_footnotes:
