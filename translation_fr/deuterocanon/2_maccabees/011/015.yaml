base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/015.yaml
  text: And Maccabeus agreed to everything that Lysias urged, being concerned for what was advantageous; for whatever Maccabeus set before Lysias in writing concerning the Jews, the king granted.
translation:
  language: fr
  text: Le Maccabée donna son accord à tout ce que Lysias demandait, soucieux de ce qui était avantageux. En effet, tout ce que le Maccabée avait soumis par écrit à Lysias au sujet des Juifs, le secrétaire[a] y consentit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits portent : « le roi ».'
    reason: Signale une variante textuelle importante qui explique la formulation de nombreuses traductions et l’écart avec le texte grec fourni.
lexical_decisions:
- source_word: ἐπένευσε
  choice: donna son accord
  rationale: Exprime naturellement l’idée d’acquiescer ou de consentir.
- source_word: παρεκάλει
  choice: demandait
  rationale: Dans ce contexte de négociation, le verbe désigne les requêtes pressantes de Lysias sans surcharger le français.
- source_word: τοῦ συμφέροντος φροντίζων
  choice: soucieux de ce qui était avantageux
  rationale: Conserve la portée volontairement générale de συμφέροντος, sans préciser pour qui cet avantage valait.
- source_word: ἔδωκεν ... διὰ γραπτῶν
  choice: avait soumis par écrit
  rationale: Rend idiomatiquement la remise à Lysias de propositions écrites concernant les Juifs.
- source_word: συνεχώρησεν
  choice: l’accorda
  rationale: Le verbe signifie ici concéder ou consentir aux demandes formulées.
- source_word: ὁ γραμματεύς
  choice: le secrétaire
  rationale: Suit directement le texte grec fourni, où γραμματεύς désigne un secrétaire ou greffier.
theological_decisions:
- issue: Identité de celui qui accorde les demandes
  choice: le secrétaire
  alternative: le roi
  rationale: Le texte grec fourni porte explicitement ὁ γραμματεύς (« le secrétaire »). La leçon « le roi », attestée dans la tradition textuelle et retenue par certaines traductions, est signalée en note plutôt que substituée au texte source.
translation_notes:
  register: Français moderne, clair et digne. La formulation garde la généralité de « ce qui était avantageux » et distingue nettement l’accord initial du Maccabée de l’acceptation finale des propositions écrites.
