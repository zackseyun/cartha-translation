lexical_decisions:
- source_word: ὑγιαίνετε
  choice: Portez-vous bien
  rationale: Dans la conclusion d’une lettre, l’impératif signifie littéralement « soyez en bonne santé » et fonctionne comme une formule de congé. « Portez-vous bien » conserve à la fois le sens lexical et la valeur épistolaire naturelle en français.
- source_word: ἔτους
  choice: En l’an
  rationale: Le génitif appartient à une formule de datation; « en l’an » est la tournure française naturelle et solennelle correspondante.
- source_word: ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: cent quarante-huit
  rationale: La suite ordinale indique la 148e année de l’ère employée dans la lettre. Après « en l’an », le cardinal est idiomatique en français.
- source_word: Ξανθικοῦ
  choice: du mois de Xanthique
  rationale: Nom du mois macédonien, francisé sous la forme historique « Xanthique »; l’ajout de « mois » explicite sa fonction pour le lecteur moderne.
- source_word: πεντεκαιδεκάτῃ
  choice: le quinzième jour
  rationale: Le datif féminin s’accorde avec « jour » sous-entendu dans la formule grecque; le français explicite naturellement ce nom.
