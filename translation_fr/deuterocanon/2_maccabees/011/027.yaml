  yaml_path: translation/deuterocanon/2_maccabees/011/027.yaml
  text: 'And to the nation the king’s letter was as follows: “King Antiochus to the council of elders of the Jews and to the other Jews[b][a], greetings.”'
translation:
  language: fr
  text: 'Quant à la nation, la lettre du roi était ainsi conçue : « Le roi Antiochos au conseil des anciens[b] des Juifs et aux autres Juifs[a], salut. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au reste des Juifs ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot grec désigne un corps officiel composé d’anciens ; on pourrait aussi traduire par « sénat ».
    reason: cultural_note
lexical_decisions:
- source_word: Πρὸς δὲ τὸ ἔθνος
  choice: adressée à la nation
  rationale: πρός avec l’accusatif désigne ici les destinataires de la lettre. « Nation » conserve la portée collective et politique de ἔθνος, tandis que « adressée à » rend naturellement la relation en français.
- source_word: ἡ τοῦ βασιλέως ἐπιστολὴ τοιαύδε ἦν
  choice: La lettre du roi … était rédigée ainsi
  rationale: Cette formulation française naturelle introduit le contenu cité tout en conservant le possessif et la formule documentaire τοιαύδε ἦν.
- source_word: Βασιλεὺς Ἀντίοχος
  choice: Le roi Antiochos
  rationale: Conserve le titre placé avant le nom dans l’en-tête grec et emploie la forme française courante du nom grec Ἀντίοχος.
- source_word: τῇ γερουσίᾳ τῶν Ἰουδαίων
  choice: au conseil des anciens des Juifs
  rationale: γερουσία désigne un corps officiel d’anciens. « Conseil des anciens » est clair en français moderne et évite les connotations contemporaines que pourrait porter « sénat ».
- source_word: τοῖς ἄλλοις Ἰουδαίοις
  choice: aux autres Juifs
  rationale: Rend directement ἄλλοις et maintient la distinction entre le conseil précédemment nommé et l’ensemble plus large des Juifs.
- source_word: χαίρειν
  choice: salut !
  rationale: Dans un en-tête épistolaire, χαίρειν est une formule conventionnelle de salutation. « Salut ! » en restitue la fonction avec concision et dignité.
