base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/003.yaml
  text: and to make the sanctuary taxable in silver[a], like the other temples of the nations, and to make the high priesthood sold each year[b];
translation:
  language: fr
  text: de rendre le sanctuaire assujetti à un impôt en argent[a], comme les autres temples des nations, et de mettre chaque année la charge de grand prêtre en vente[b] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « soumis à un prélèvement en argent » ou « imposé au titre d’un tribut monétaire ». L’adjectif grec, rare, indique que le sanctuaire deviendrait une source de recettes, comme les temples païens.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « rendre chaque année la charge de grand prêtre vendable ». Le grec présente la fonction elle-même comme un bien mis en vente.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερὸν
  choice: sanctuaire
  rationale: Désigne ici l’enceinte sacrée de Jérusalem. « Sanctuaire » conserve la nuance cultuelle et permet de le distinguer de τεμένη dans la suite.
- source_word: ἀργυρολόγητον
  choice: assujetti à un impôt en argent
  rationale: Cet adjectif rare associe l’idée d’argent à celle de perception ou de prélèvement. La formulation exprime naturellement que le sanctuaire deviendrait une source de recettes monétaires, sans préciser davantage la forme du prélèvement.
- source_word: τεμένη
  choice: temples
  rationale: Dans ce contexte, le terme désigne les enceintes ou lieux sacrés des nations. « Temples » est l’équivalent français courant le plus naturel.
- source_word: πρατὴν
  choice: mettre … en vente
  rationale: L’adjectif présente la charge elle-même comme susceptible d’être vendue. La tournure verbale française rend clairement cette commercialisation.
- source_word: ἀρχιερωσύνην
  choice: la charge de grand prêtre
  rationale: Le mot désigne la fonction ou dignité, non la personne. « Charge de grand prêtre » est plus naturel en français courant que « grand-prêtrise ».
- source_word: κατʼ ἔτος
  choice: chaque année
  rationale: Rend directement la récurrence annuelle indiquée par le grec.
- source_word: ποιήσειν
  choice: rendre … et mettre
  rationale: L’infinitif a une valeur causative et régit les deux mesures. Le français demande ici deux verbes idiomatiques différents pour exprimer naturellement cette même construction.
