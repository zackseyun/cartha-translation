  text: But concerning these matters in detail[b][a], I have given orders that both these men and those from me should speak with you.
translation:
  language: fr
  text: Mais, au sujet de ces questions, j’ai donné des instructions détaillées à ces hommes comme à ceux qui viennent de ma part[a], afin qu’ils s’entretiennent avec vous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceux qui sont de chez moi » ou « ceux qui viennent de moi » ; il s’agit vraisemblablement des délégués du roi.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « confèrent avec vous » ; le verbe grec peut évoquer une discussion ou une négociation, et non une simple prise de parole.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ δὲ τούτων κατὰ μέρος
  choice: Quant aux détails de ces questions
  rationale: La formulation rend naturellement la transition δέ, le sens de ὑπέρ avec le génitif (« au sujet de ») et l’idée d’un examen détaillé ou point par point exprimée par κατὰ μέρος.
- source_word: ἐντέταλμαι
  choice: j’ai donné pour instruction
  rationale: Le parfait de ἐντέλλομαι indique qu’une instruction officielle a été donnée et demeure en vigueur. Cette tournure conserve l’autorité du contexte administratif sans durcir inutilement le ton.
- source_word: τούτους τε καὶ τοὺς παρʼ ἐμοῦ
  choice: aussi bien à ces hommes qu’à mes représentants
  rationale: La corrélation τε… καί unit deux groupes. « Ces hommes » renvoie aux personnes déjà mentionnées, tandis que « mes représentants » explicite avec naturel le sens probable, mais non entièrement exprimé, de τοὺς παρʼ ἐμοῦ.
- source_word: διαλεχθῆναι ὑμῖν
  choice: de s’entretenir avec vous
  rationale: διαλέγομαι peut désigner un échange, une discussion ou une concertation. « S’entretenir avec » convient au registre diplomatique et dépasse l’idée d’une simple prise de parole.
