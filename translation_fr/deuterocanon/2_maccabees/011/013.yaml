    issue: « qu’il venait de subir »
    rationale: Cette formulation suggère que le revers était tout récent. γεγονός signifie qu’il s’était produit, sans imposer cette nuance de proximité.
  - severity: low
    issue: « donc » dans « Il envoya donc »
    rationale: Le participe προαποστείλας marque l’antériorité par rapport à l’action qui suit, non une conclusion explicitement signalée par un connecteur inférentiel.
  - severity: low
    issue: Ancrage de la note
    rationale: Le marqueur doit être placé immédiatement après « à leurs côtés », expression concernée par l’alternative sur la fonction d’allié de Dieu.
