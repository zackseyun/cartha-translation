  text: But since he was not foolish[a], but was considering the defeat that had happened to him and had realized that the Hebrews were unconquerable, because the mighty God was fighting alongside them, he sent ahead
translation:
  language: fr
  text: Mais, comme il n’était pas insensé, et considérant le revers qui lui était arrivé, après avoir compris que les Hébreux étaient impossibles à vaincre, puisque le Dieu puissant combattait à leurs côtés[a], il envoya d’avance
  philosophy: optimal-equivalence
