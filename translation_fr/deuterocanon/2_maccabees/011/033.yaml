lexical_decisions:
- source_word: ἔρρωσθε
  choice: Portez-vous bien
  rationale: Formule de salutation finale au pluriel, qui souhaite la santé aux destinataires; cette tournure française naturelle conserve mieux sa nuance que l’expression plus générale « Adieu ».
- source_word: ἔτους
  choice: L’an
  rationale: Le génitif appartient à une formule de datation; « l’an » est la tournure française consacrée et concise.
- source_word: ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: '148'
  rationale: L’ordinal grec désigne la cent quarante-huitième année; dans une date, le français moderne emploie naturellement le nombre cardinal après « l’an ».
- source_word: Ξανθικοῦ
  choice: Xanthique
  rationale: Translittération française traditionnelle du nom grec du mois, afin de préserver la référence au calendrier macédonien.
- source_word: πεντεκαιδεκάτῃ
  choice: le quinzième jour
  rationale: Le féminin datif est sous-entendu dans la formule de datation; « jour » est explicité pour que la date soit immédiatement claire en français.
