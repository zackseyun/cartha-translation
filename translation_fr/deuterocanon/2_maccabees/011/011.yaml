  text: But springing at the enemies like lions, they struck down eleven thousand of them, and sixteen hundred cavalry; and they forced them all to flee.
translation:
  language: fr
  text: Mais, s’élançant sur les ennemis comme des lions, ils en abattirent onze mille, ainsi que mille six cents cavaliers ; ils les forcèrent tous à fuir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λεόντινων δὲ ἐντινάξαντες εἰς τοὺς πολεμίους
  choice: Mais, se jetant sur les ennemis comme des lions
  rationale: Le texte grec transmis est difficile, mais le contexte et la tradition de traduction soutiennent l’image d’un assaut semblable à celui de lions. « Se jetant sur » rend naturellement l’élan violent exprimé par ἐντινάξαντες.
- source_word: κατέστρωσαν
  choice: ils abattirent
  rationale: Le verbe évoque le fait d’étendre les adversaires à terre, donc de les tuer au combat ; « abattirent » conserve cette image sans lourdeur.
- source_word: χιλίους πρὸς τοῖς μυρίοις
  choice: onze mille fantassins
  rationale: La tournure additive signifie littéralement « mille en plus des dix mille », soit onze mille. « Fantassins » explicite le contraste implicite avec les cavaliers qui suivent.
- source_word: ἱππεῖς δὲ ἑξακοσίους πρὸς χιλίοις
  choice: et mille six cents cavaliers
  rationale: La construction additive donne mille six cents. ἱππεῖς désigne des cavaliers, formulation directe et naturelle en français.
- source_word: τοὺς δὲ πάντας ἠνάγκασαν φεύγειν
  choice: puis ils les forcèrent tous à fuir
  rationale: Rend exactement l’idée de contraindre tous les survivants à prendre la fuite ; « puis » marque la progression narrative du grec.
