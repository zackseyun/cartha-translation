revisions:
- from: Tu feras donc bien d’envoyer quelqu’un auprès d’eux et de leur donner des garanties de bonne foi[a], afin que, connaissant notre intention, ils reprennent courage et s’occupent volontiers de la sauvegarde de leurs propres intérêts.
  to: Tu feras donc bien d’envoyer auprès d’eux et de leur donner des gages de bonne foi[a], afin que, connaissant notre intention, ils reprennent courage et veillent volontiers à leurs propres affaires.
  rationale: La révision retire l’explicitation non exprimée « quelqu’un », conserve l’ambiguïté de l’objet de l’envoi, et corrige le littéral de la note. « Veiller à leurs propres affaires » restitue de façon naturelle la notion de prise en charge ou de soin de ce qui leur appartient, sans la réduire à la protection d’intérêts matériels.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T12:38:43Z'
review_pass:
  verdict: revise
  source_fidelity: 'La phrase rend correctement l’exhortation, le geste diplomatique implicite dans δοὺς δεξιάς, la « décision/intention » (προαίρεσις), le réconfort visé (εὔθυμοι) et la prise en charge de ce qui leur appartient (τῶν ἰδίων ἀντιλήψει). Toutefois, « quelqu’un » introduit explicitement un émissaire que le grec ne nomme pas. La note présente en outre une rétroversion française inexacte de la construction grecque : δοὺς δεξιάς signifie littéralement « ayant donné des mains droites », et non « leur donner les mains droites ».'
  naturalness: Le registre est naturel, diplomatique et accessible. « Reprennent courage » convient bien. « Veiller volontiers à leurs propres affaires » est plus idiomatique et un peu moins interprétatif que « s’occuper ... de la sauvegarde de leurs propres intérêts ».
  terminology: « Gages de bonne foi » rend avec précision l’idiome diplomatique des « mains droites » sans le littéralisme opaque. « Notre intention » est adéquat pour προαίρεσις. La note conserve l’ancrage [a] et explique l’idiome sans imposer une interprétation théologique ou confessionnelle.
  issues:
  - severity: low
    issue: Ajout de « quelqu’un »
    rationale: διαπεμψάμενος πρὸς αὐτούς exprime l’envoi vers les destinataires, mais ne précise pas qui ou quoi est envoyé. « Quelqu’un » est plausible dans le contexte diplomatique, mais constitue une explicitation non requise.
  - severity: low
    issue: Littéral de la note imprécis
    rationale: La note dit « leur donner les mains droites », alors que le participe grec est littéralement « ayant donné des mains droites ». L’explication idiomatique demeure juste, mais le littéral doit être corrigé.
  revised_text: Tu feras donc bien d’envoyer auprès d’eux et de leur donner des gages de bonne foi[a], afin que, connaissant notre intention, ils reprennent courage et veillent volontiers à leurs propres affaires.
  revised_footnotes:
