base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/026.yaml
  text: Therefore you will do well to send to them and give them pledges of good faith[a], so that, knowing our intention, they may be encouraged and may gladly attend to the securing of their own affairs.
translation:
  language: fr
  text: Tu feras donc bien d’envoyer auprès d’eux et de leur donner des gages de bonne foi[a], afin que, connaissant notre intention, ils reprennent courage et veillent volontiers à leurs propres affaires.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ayant donné des mains droites » ; expression diplomatique grecque désignant des assurances ou des gages de bonne foi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὖ οὖν ποιήσεις
  choice: Tu feras donc bien
  rationale: Cette tournure française naturelle conserve la valeur de conseil ou d’approbation du futur grec, plutôt que d’en faire une simple prédiction.
- source_word: διαπεμψάμενος πρὸς αὐτούς
  choice: d’envoyer quelqu’un auprès d’eux
  rationale: Le grec évoque l’envoi auprès des destinataires sans nommer expressément le porteur. Le français exige ici un complément; « quelqu’un » explicite sobrement l’intermédiaire impliqué sans préciser à tort sa fonction.
- source_word: δοὺς δεξιάς
  choice: leur donner des garanties de bonne foi
  rationale: L’expression grecque, littéralement « donner les mains droites », est un idiome diplomatique désignant des assurances ou des engagements. La traduction idiomatique en restitue clairement le sens.
- source_word: προαίρεσιν
  choice: intention
  rationale: Le terme désigne une volonté délibérée ou un dessein. « Intention » reste assez large et n’ajoute pas une bienveillance qui n’est pas explicite.
- source_word: εὔθυμοί
  choice: ils reprennent courage
  rationale: L’adjectif évoque le fait d’être confiant, rassuré ou de bon courage. Cette formulation exprime naturellement en français l’effet attendu de la démarche.
- source_word: ἡδέως διαγίνωνται
  choice: s’occupent volontiers
  rationale: Dans ce contexte administratif, l’expression concerne la manière dont ils pourront poursuivre leurs activités. « Volontiers » rend ἡδέως sans réduire le sens à une simple vie agréable.
- source_word: πρὸς τῇ τῶν ἰδίων ἀντιλήψει
  choice: de la sauvegarde de leurs propres intérêts
  rationale: ἀντίληψις peut exprimer l’aide, la prise en charge ou la protection. Ici, la formule vise vraisemblablement le soin de ce qui leur appartient ou les concerne, sans se limiter aux seuls biens matériels.
