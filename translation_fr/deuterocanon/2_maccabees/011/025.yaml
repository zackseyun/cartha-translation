base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/025.yaml
  text: Therefore[a], since we also choose that this nation should be free from disturbance, we decide that the temple should be restored to them, and that they should live according to the customs of their ancestors.
translation:
  language: fr
  text: Puisque nous souhaitons donc que cette nation soit, elle aussi, à l’abri des troubles, nous décidons que le Temple leur soit rendu et qu’ils vivent selon les coutumes de leurs ancêtres[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’ils organisent leur vie collective selon les coutumes en vigueur au temps de leurs ancêtres ».'
    reason: Alternative lexicale préservant la portée communautaire ou civique possible de πολιτεύεσθαι ainsi que la nuance temporelle possible de ἐπὶ τῶν προγόνων.
lexical_decisions:
- source_word: αἱρούμενοι
  choice: puisque nous voulons
  rationale: Le participe moyen exprime ici la volonté ou la préférence pour une ligne de conduite. La tournure causale rend naturellement en français le rapport du participe avec « nous décidons », sans effacer sa force volontaire.
- source_word: καὶ τοῦτο τὸ ἔθνος
  choice: cette nation, elle aussi
  rationale: 'La position de καί favorise son rattachement à « cette nation » : le privilège de vivre sans troubles est souhaité également pour ce peuple.'
- source_word: ἐκτὸς ταραχῆς
  choice: à l’abri des troubles
  rationale: L’expression évoque l’absence d’agitation ou de désordres, notamment dans un contexte public et administratif. Cette formulation reste naturelle sans réduire le sens à une paix intérieure.
- source_word: κρίνομεν
  choice: nous décidons
  rationale: Le verbe signifie ici prendre une décision ou statuer. « Décidons » convient au contexte gouvernemental sans transformer explicitement la déclaration en décret technique.
- source_word: τὸ ἱερὸν
  choice: le Temple
  rationale: Dans le contexte, le lieu sacré désigne le Temple de Jérusalem. La majuscule précise ce référent unique dans un français biblique courant.
- source_word: ἀποκατασταθῆναι αὐτοῖς
  choice: lui soit rendu
  rationale: L’infinitif passif indique la restitution ou le rétablissement du Temple au bénéfice de la nation. « Soit rendu » exprime clairement cette restauration d’un droit ou d’une possession antérieure.
- source_word: πολιτεύεσθαι
  choice: qu’elle organise sa vie collective
  rationale: Le verbe concerne la manière de vivre en corps constitué et peut comporter une nuance civique. Cette traduction conserve cette dimension communautaire sans affirmer une autonomie politique complète.
- source_word: κατὰ τὰ ἐπὶ τῶν προγόνων αὐτῶν ἔθη
  choice: selon les coutumes de ses ancêtres
  rationale: La formulation rend les usages hérités des ancêtres. La possible nuance temporelle, « en vigueur au temps des ancêtres », est conservée en note.
theological_decisions:
- issue: Portée de πολιτεύεσθαι par rapport à la Loi et aux coutumes juives
  choice: Décrire largement l’organisation de la vie collective selon les coutumes ancestrales
  alternative: qu’elle se gouverne selon les coutumes de ses ancêtres
  rationale: Le contexte accorde le rétablissement du Temple et la pratique des usages juifs. Même si le verbe possède une dimension civique, il ne constitue pas à lui seul une affirmation sans équivoque d’indépendance ou d’autonomie politique.
translation_notes:
  register: Français international moderne, digne et accessible. Le singulier collectif « elle » reprend naturellement « cette nation ». « Temple » garde le référent concret, tandis que « vie collective » préserve la nuance civique de πολιτεύεσθαι sans surinterprétation politique.
