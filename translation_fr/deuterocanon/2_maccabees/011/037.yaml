  text: Therefore hurry[a], and send some men[b], so that we too may learn what your intention is.
translation:
  language: fr
  text: C’est pourquoi, hâtez-vous et envoyez quelques personnes[a], afin que nous aussi, nous sachions quelle est votre position[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quelques représentants » ; le grec ne précise pas davantage de quelles personnes il s’agit.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de quelle sorte d’avis vous êtes » ; l’expression peut aussi se traduire par « quel est votre avis » ou « quelles sont vos intentions ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: C’est pourquoi
  rationale: Marque naturellement en français le lien logique avec ce qui précède.
- source_word: σπεύσατε
  choice: hâtez-vous
  rationale: L’impératif aoriste appelle une action prompte; cette formulation conserve l’urgence dans un registre digne.
- source_word: πέμψατέ τινας
  choice: envoyez quelques personnes
  rationale: τινας désigne de manière indéfinie plusieurs personnes sans préciser davantage leur identité ou leur fonction.
- source_word: ὅπως
  choice: afin que
  rationale: Introduit clairement le but de l’envoi.
- source_word: καὶ ἡμεῖς
  choice: nous aussi
  rationale: Conserve la valeur inclusive et légèrement emphatique de καί avec le pronom exprimé.
- source_word: ἐπιγνῶμεν
  choice: nous sachions
  rationale: Dans cette proposition de but, le verbe signifie parvenir à connaître ou déterminer leur position.
- source_word: ὁποῖοί ἐστε γνώμης
  choice: quelles sont vos intentions
  rationale: Rend en français naturel l’expression grecque littéralement liée à la nature de leur avis ou disposition, dans le contexte d’une négociation.
