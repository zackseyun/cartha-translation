base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/005.yaml
  text: But after entering Judea and approaching Beth-zur[a], a fortified place about five schoeni from Jerusalem[b], he was besieging it.
translation:
  language: fr
  text: Mais, après être entré en Judée et s’être approché de Bethsour, place fortifiée située à environ cinq schènes[a] de Jérusalem, il l’assiégeait[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La schène était une ancienne unité de distance dont la longueur variait selon les époques et les régions.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « il la pressait » ou « il la mettait à rude épreuve ». Dans ce contexte militaire, le verbe désigne probablement la pression exercée contre Bethsour au cours d’un siège.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: après être entré
  rationale: Le participe aoriste exprime une action antérieure à l’action principale ; cette tournure rend clairement la succession temporelle en français.
- source_word: συνεγγίσας
  choice: s’être approché de
  rationale: Le participe indique que le sujet s’est avancé jusqu’aux environs de Bethsour, sans affirmer explicitement qu’il y est entré.
- source_word: Βεθσουρῶν
  choice: Bethsour
  rationale: Forme française reconnaissable du nom sémitique transmis par le grec.
- source_word: ἐρυμνῷ χωρίῳ
  choice: place fortifiée
  rationale: ἐρυμνός évoque un lieu fort ou défendable, tandis que χωρίον désigne un endroit ; la traduction n’en fait pas plus précisément une ville ou une forteresse.
- source_word: ἀπέχοντι ὡσεὶ σχοίνους πέντε
  choice: située à environ cinq schènes de Jérusalem
  rationale: La formulation rend la distance approximative et conserve l’unité ancienne afin d’éviter une conversion moderne faussement précise.
- source_word: τοῦτο
  choice: la
  rationale: Le pronom renvoie à Bethsour, désignée en français comme une place fortifiée.
- source_word: ἔθλιβε
  choice: il l’assiégeait
  rationale: Dans ce contexte militaire, l’imparfait décrit une pression prolongée exercée contre la place ; « assiéger » en exprime naturellement le sens probable, tandis qu’une note conserve la valeur plus littérale du verbe.
