translation:
  language: fr
  text: J’ai aussi envoyé Ménélas pour vous encourager[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour vous exhorter » ou « pour faire appel à vous ». Le verbe grec peut exprimer l’encouragement, l’exhortation ou l’appel selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέπομφα
  choice: J’ai envoyé
  rationale: Le parfait actif exprime un envoi accompli dont l’effet demeure pertinent; le passé composé est naturel en français et conserve cette valeur.
- source_word: δὲ
  choice: aussi, dans l’enchaînement de la phrase
  rationale: La particule assure ici une transition légère plutôt qu’une opposition marquée; en français, la continuité est rendue naturellement sans traduire δέ par un mot distinct.
- source_word: καὶ
  choice: aussi
  rationale: 'L’adverbe garde la valeur additive: Ménélas est envoyé en complément de ce qui précède.'
- source_word: τὸν Μενέλαον
  choice: Ménélas
  rationale: Le nom propre est rendu selon sa forme française traditionnelle.
- source_word: παρακαλέσοντα
  choice: pour vous adresser un appel
  rationale: Le participe futur indique le but de l’envoi. Dans ce contexte diplomatique, παρακαλέω peut désigner un appel, une exhortation ou un encouragement; cette formulation reste naturelle sans réduire le terme à une seule nuance.
- source_word: ὑμᾶς
  choice: vous
  rationale: Le pronom désigne directement les destinataires de la lettre.
