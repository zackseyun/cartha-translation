base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/004.yaml
  text: not at all taking into account the might of God[b][a], but puffed up by the tens of thousands of foot soldiers and the thousands of horsemen and the eighty elephants.
translation:
  language: fr
  text: sans tenir le moindre compte de la puissance de Dieu[a], mais gonflé d’orgueil par les dizaines de milliers de fantassins[b], les milliers de cavaliers et les quatre-vingts éléphants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sans mesurer la force de Dieu ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec dit « les myriades de fantassins » : il peut s’agir littéralement de dizaines de milliers ou, plus généralement, d’un très grand nombre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδάμως
  choice: sans… le moindre
  rationale: Cette tournure française naturelle conserve la négation fortement emphatique de l’adverbe grec.
- source_word: ἐπιλογιζόμενος
  choice: tenir compte de
  rationale: Le participe exprime ici le fait de considérer un facteur ou de l’intégrer à son calcul; la locution convient au contexte militaire.
- source_word: τὸ τοῦ θεοῦ κράτος
  choice: la puissance de Dieu
  rationale: κράτος désigne ici la force effective de Dieu, mise en contraste avec les moyens militaires humains.
- source_word: πεφρονηματισμένος
  choice: gonflé d’orgueil
  rationale: Le participe parfait décrit un état d’assurance orgueilleuse et exaltée; cette expression en restitue l’image et la force.
- source_word: μυριάσιν τῶν πεζῶν
  choice: les dizaines de milliers de fantassins
  rationale: μυριάδες peut désigner littéralement des groupes de dix mille ou, plus largement, une multitude; la formulation garde sa valeur numérique sans imposer un total précis.
- source_word: χιλιάσι τῶν ἱππέων
  choice: les milliers de cavaliers
  rationale: La traduction conserve la structure numérique grecque et désigne clairement des combattants montés.
- source_word: ἐλέφασιν τοῖς ὀγδοήκοντα
  choice: les quatre-vingts éléphants
  rationale: Rend directement le nombre précis et maintient le parallélisme de l’énumération.
theological_decisions:
- issue: Sens de τὸ τοῦ θεοῦ κράτος dans le contraste avec la puissance militaire
  choice: la puissance de Dieu
  alternative: la force de Dieu; la souveraineté de Dieu
  rationale: « Puissance » exprime la capacité effective de Dieu sans transformer le passage en affirmation plus spécifique sur sa souveraineté royale; le contraste entre puissance divine et ressources humaines demeure intact.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le contraste serré du grec entre l’absence totale de considération pour la puissance divine et l’orgueil fondé sur les effectifs militaires.
