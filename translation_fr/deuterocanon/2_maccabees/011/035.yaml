  text: Concerning the things that Lysias, the king’s kinsman, granted to you, we also approve.
translation:
  language: fr
  text: En ce qui concerne ce que Lysias, le parent du roi, vous a accordé, nous l’approuvons également.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπὲρ ὧν
  choice: Pour ce que
  rationale: Dans ce contexte, la locution introduit l’objet de l’approbation. « Pour ce que » rend ce rapport avec concision et naturellement en français.
- source_word: Λυσίας
  choice: Lysias
  rationale: Translittération française usuelle du nom propre grec.
- source_word: ὁ συγγενὴς τοῦ βασιλέως
  choice: le parent du roi
  rationale: συγγενής désigne une personne apparentée. « Parent » est clair en français moderne et évite l’archaïsme de « proche parent » ou « membre de la parenté » sans préciser indûment le lien familial.
- source_word: συνεχώρησεν
  choice: vous a accordé
  rationale: Dans cette lettre diplomatique, le verbe exprime une concession ou une autorisation officielle; « accorder » convient au complément indirect ὑμῖν.
- source_word: ὑμῖν
  choice: vous
  rationale: Le datif désigne les bénéficiaires de ce qui a été accordé et s’intègre naturellement au tour français « vous a accordé ».
- source_word: καὶ ἡμεῖς συνευδοκοῦμεν
  choice: nous donnons nous aussi notre approbation
  rationale: Le verbe exprime une approbation conjointe. Cette formulation conserve l’idée que les auteurs ratifient les concessions de Lysias, plutôt que de signaler un simple accord abstrait.
