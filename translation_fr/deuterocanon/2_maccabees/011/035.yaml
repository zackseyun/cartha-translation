  source_fidelity: 'Le projet rend correctement les éléments essentiels : Lysias est qualifié de parent du roi, les concessions lui sont attribuées au bénéfice des destinataires, et les auteurs expriment leur approbation conjointe. Cependant, « Pour ce que » ne rend pas de façon sûre ὑπὲρ ὧν en français moderne : cette locution est archaïque et peut être comprise comme causale (« parce que »), alors que le grec introduit le sujet ou l’objet de l’approbation.'
  naturalness: « Pour ce que » n’est pas naturel dans le français international contemporain. « En ce qui concerne ce que » est clair, moderne et conserve la portée référentielle de la formule grecque. « Nous l’approuvons également » est plus direct et idiomatique que « nous donnons nous aussi notre approbation », sans perte de sens.
  terminology: « Le parent du roi » traduit sobrement συγγενής sans préciser le degré de parenté. « Accorder » convient au contexte de concession officielle, et « approuver également » rend bien συνευδοκοῦμεν, y compris la valeur additive de καί.
