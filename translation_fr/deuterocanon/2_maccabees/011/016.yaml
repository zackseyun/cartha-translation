base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/016.yaml
  text: 'For letters had been written to the Jews from Lysias[a], containing this form: “Lysias to the multitude of the Jews[b], greetings.”'
translation:
  language: fr
  text: 'En effet, des lettres avaient été écrites aux Juifs de la part de Lysias, ayant la teneur suivante[a] : « Lysias au peuple des Juifs[b], salut. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sous cette forme » ou « avec le libellé suivant ». L’expression grecque peut désigner la forme de la lettre ou sa formulation précise.
    reason: lexical_alternative
  - marker: b
    text: Ou « à la communauté des Juifs » ou « à la multitude des Juifs ». Le terme grec désigne un groupe nombreux considéré collectivement.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν γὰρ γεγραμμέναι
  choice: En effet, des lettres avaient été écrites
  rationale: La construction périphrastique exprime un état résultant antérieur, rendu naturellement par le plus-que-parfait passif. « En effet » restitue la liaison explicative marquée par γάρ.
- source_word: τοῖς Ἰουδαίοις
  choice: aux Juifs
  rationale: Dans ce contexte, le terme désigne le peuple juif comme groupe ethnoreligieux, et non simplement les habitants de la Judée.
- source_word: ἐπιστολαὶ
  choice: lettres
  rationale: Il s’agit de correspondance administrative; « lettres » est le terme moderne, direct et naturel.
- source_word: παρὰ μὲν Λυσίου
  choice: de la part de Lysias
  rationale: παρά avec le génitif indique ici la provenance. Cette tournure conserve clairement Lysias comme source des lettres.
- source_word: περιέχουσαι τὸν τρόπον τοῦτον
  choice: Elles étaient formulées ainsi
  rationale: Le participe et son complément introduisent la teneur ou la forme de la lettre citée. Cette formulation française est naturelle tout en maintenant l’ouverture entre forme et libellé.
- source_word: τῷ πλήθει τῶν Ἰουδαίων
  choice: à l’ensemble des Juifs
  rationale: πλῆθος désigne le corps collectif ou la multitude. « L’ensemble » exprime ce sens collectif sans suggérer nécessairement une assemblée institutionnelle.
- source_word: χαίρειν
  choice: salut !
  rationale: Dans l’adresse d’une lettre grecque, χαίρειν est une formule épistolaire consacrée. « Salut ! » en fournit un équivalent français bref, actuel et digne.
