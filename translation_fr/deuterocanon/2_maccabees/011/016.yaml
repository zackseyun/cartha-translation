    rationale: « Ensemble » peut désigner tous les individus sans mettre en relief le groupe collectif nombreux exprimé par πλῆθος. « Peuple » est plus idiomatique en français et s’accorde mieux avec l’adresse collective.
  - severity: low
    issue: « Elles étaient formulées ainsi » rend le lien de περιέχουσαι de manière un peu imprécise.
    rationale: Le participe signifie que les lettres contenaient la teneur ou la formule qui suit. « Ayant la teneur suivante » maintient plus directement cette relation, sans trancher indûment entre forme et libellé.
