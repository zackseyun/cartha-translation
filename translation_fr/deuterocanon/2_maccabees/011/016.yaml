revisions:
- from: 'En effet, des lettres avaient été écrites aux Juifs de la part de Lysias. Elles étaient formulées ainsi[a] : « Lysias à l’ensemble des Juifs[b], salut ! »'
  to: 'En effet, des lettres avaient été écrites aux Juifs de la part de Lysias, ayant la teneur suivante[a] : « Lysias au peuple des Juifs[b], salut. »'
  rationale: La révision resserre le lien entre les lettres et la teneur citée, et remplace « ensemble » par « peuple » afin de mieux rendre la valeur collective de πλῆθος dans un français moderne naturel. Les deux ambiguïtés lexicales signalées par les notes sont préservées.
