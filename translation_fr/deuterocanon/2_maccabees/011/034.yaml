review_pass:
  verdict: revise
  source_fidelity: 'Le texte rend fidèlement l’envoi d’une lettre par les Romains, la formule d’introduction, les noms, le destinataire collectif et la salutation épistolaire. Le sens de πρεσβυταὶ Ῥωμαίων doit toutefois être formulé de façon moins ambiguë en français : il désigne littéralement des « anciens » rattachés au peuple romain, sans imposer dans le texte une identification certaine comme ambassadeurs.'
  naturalness: « Anciens des Romains » est grammaticalement possible mais peu idiomatique et peut faire entendre une relation possessive maladroite. « Anciens du peuple romain » est plus naturel dans un en-tête officiel tout en restant proche du grec. « Ainsi rédigée » convient bien à la formule documentaire ἔχουσαν οὕτως.
  terminology: Les formes latines usuelles « Quintus Memmius » et « Titus Manius » sont appropriées. « Peuple des Juifs » restitue le caractère civique de δήμος. « Salut » est la formule française sobre et exacte pour χαίρειν. La note doit éviter « anciens romains », qui peut évoquer les Romains de l’Antiquité plutôt qu’un titre ou une fonction.
