base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/034.yaml
  text: 'The Romans also sent them a letter[a], worded as follows: “Quintus Memmius and Titus Manius, elders of the Romans, to the people of the Jews, greetings.”'
translation:
  language: fr
  text: 'Les Romains leur envoyèrent aussi une lettre, ainsi rédigée : « Quintus Memmius et Titus Manius, anciens du peuple romain[a], au peuple des Juifs, salut. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec signifie littéralement « anciens ». Dans ce contexte, le terme peut aussi désigner des envoyés du peuple romain.
    reason: alternative lexicale et possible valeur contextuelle du titre
lexical_decisions:
- source_word: Ἐπέμψαν δὲ καὶ οἱ Ῥωμαῖοι
  choice: Les Romains leur envoyèrent aussi
  rationale: L’aoriste de πέμπω exprime simplement l’envoi. « Aussi » rend καί, tandis que δέ assure ici une transition légère qu’il n’est pas nécessaire de traduire séparément.
- source_word: πρὸς αὐτούς
  choice: leur
  rationale: Le pronom complément indirect est la tournure française naturelle après « envoyèrent » et conserve le renvoi aux destinataires mentionnés dans le contexte.
- source_word: ἐπιστολήν
  choice: une lettre
  rationale: « Lettre » est le terme courant et exact, sans la connotation religieuse ou archaïque que pourrait avoir « épître ».
- source_word: ἔχουσαν οὕτως
  choice: rédigée ainsi
  rationale: Cette formule introduit le contenu du document. La formulation française est naturelle tout en gardant le caractère officiel de la citation.
- source_word: Κόιντος Μέμμιος, Τίτος Μάνιος
  choice: Quintus Memmius et Titus Manius
  rationale: Les noms sont transcrits selon leurs formes latines usuelles en français ; la coordination est explicitée pour une lecture fluide.
- source_word: πρεσβυταὶ Ῥωμαίων
  choice: anciens des Romains
  rationale: πρεσβυταί signifie littéralement « anciens ». La traduction principale évite de préciser sans certitude une fonction diplomatique que le contexte peut néanmoins suggérer.
- source_word: τῷ δήμῳ τῶν Ἰουδαίων
  choice: au peuple des Juifs
  rationale: δήμος désigne ici le peuple comme corps collectif ou civique. Cette formulation reste proche de la structure grecque et convient au style épistolaire officiel.
- source_word: χαίρειν
  choice: salut
  rationale: Dans l’ouverture d’une lettre, χαίρειν est une formule conventionnelle de salutation. « Salut » en restitue sobrement la fonction et le registre.
