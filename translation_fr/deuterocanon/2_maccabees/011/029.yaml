  text: Menelaus informed us that you wish, after coming down, to attend to your own affairs.
translation:
  language: fr
  text: Ménélas nous a fait savoir qu’il souhaitait que, après être descendus, vous soyez auprès des vôtres[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que, après être descendus, vous vous occupiez de vos propres affaires ». L’expression grecque peut désigner les siens, ses biens ou ses affaires propres.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεφάνισεν ἡμῖν
  choice: nous a fait savoir
  rationale: Le verbe signifie « faire connaître, signaler ». Cette formulation naturelle conserve l’idée d’une communication officielle adressée au roi et à son entourage.
- source_word: Μενέλαος βουλόμενος
  choice: Ménélas… souhaitait
  rationale: Le participe βουλόμενος est au nominatif masculin singulier et se rapporte grammaticalement à Ménélas. La traduction suit donc la syntaxe grecque, contrairement à une lecture qui attribuerait le souhait aux destinataires.
- source_word: κατελθόντας ὑμᾶς
  choice: que vous redescendiez
  rationale: Le participe aoriste κατελθόντας s’accorde avec ὑμᾶς et complète le souhait de Ménélas. « Redescendiez » conserve le mouvement exprimé par κατα-, sans préciser une destination que le texte laisse implicite.
- source_word: γίνεσθαι πρὸς τοῖς ἰδίοις
  choice: pour vous retrouver chez vous
  rationale: L’expression désigne le fait de se trouver auprès de ce qui est à soi ou des siens. « Chez vous » rend l’idée de retour dans son propre cadre tout en évitant de trancher abusivement entre les siens, les biens et les affaires personnelles.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible, adapté au ton d’une lettre officielle. La syntaxe fait de Ménélas le sujet de « souhaitait », conformément à la forme grecque βουλόμενος. L’expression finale reste volontairement ouverte, l’original ne permettant pas de choisir avec certitude entre le foyer, les proches et les affaires personnelles.
