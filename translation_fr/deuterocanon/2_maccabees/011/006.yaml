base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/006.yaml
  text: But when those around Maccabeus learned that he was besieging the strongholds[a], they, together with the crowds, pleaded with the Lord with lamentations and tears to send a good angel for the salvation of Israel.
translation:
  language: fr
  text: Mais lorsque les compagnons de Maccabée apprirent que Lysias assiégeait les places fortes, ils supplièrent le Seigneur, avec les foules, dans les lamentations et les larmes, d’envoyer un bon ange pour le salut d’Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour la délivrance d’Israël ». Le grec σωτηρία peut désigner le secours ou la délivrance dans une crise concrète, aussi bien que le salut dans un sens plus large.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετέλαβον
  choice: apprirent
  rationale: Dans ce contexte, le verbe indique qu’ils prirent connaissance de l’opération militaire en cours. « Apprirent » est naturel et fidèle à ce sens contextuel.
- source_word: οἱ περὶ τὸν Μακκαβαῖον
  choice: les hommes de l’entourage de Maccabée
  rationale: Cette tournure grecque désigne le groupe associé à Maccabée sans préciser davantage sa composition ni exclure nécessairement Maccabée lui-même.
- source_word: πολιορκοῦντα
  choice: assiégeait
  rationale: Le participe de πολιορκέω décrit une action de siège menée contre des lieux fortifiés; l’imparfait français en restitue l’aspect en cours.
- source_word: τὰ ὀχυρώματα
  choice: les places fortes
  rationale: ὀχύρωμα désigne un lieu fortifié. « Places fortes » conserve précisément le sens militaire dans un français courant et digne.
- source_word: μετὰ ὀδυρμῶν καὶ δακρύων
  choice: au milieu des lamentations et des larmes
  rationale: La formulation rend l’intensité de la détresse qui accompagne la supplication collective.
- source_word: ἱκέτευον
  choice: supplièrent
  rationale: Le verbe exprime une demande pressante et humble. « Supplièrent » convient au registre de la prière sans archaïsme.
- source_word: σὺν τοῖς ὄχλοις
  choice: avec la foule
  rationale: ὄχλοι renvoie ici à la masse du peuple réunie. Le singulier collectif « la foule » est idiomatique en français.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Dans cette prière juive, κύριος désigne Dieu; « le Seigneur » en préserve la forme et la portée révérencielle.
- source_word: ἀγαθὸν ἄγγελον
  choice: un bon ange
  rationale: La traduction directe conserve le qualificatif ἀγαθός sans préciser indûment de quelle manière l’ange serait favorable ou secourable.
- source_word: ἀποστεῖλαι
  choice: d’envoyer
  rationale: Rendu simple et direct de l’infinitif grec.
- source_word: πρὸς σωτηρίαν τῷ Ἰσραήλ
  choice: pour le salut d’Israël
  rationale: « Salut » garde la largeur sémantique de σωτηρία et sa résonance théologique, tandis que le contexte militaire permet aussi le sens concret de « délivrance », signalé en note.
theological_decisions:
- issue: Rendu de κύριος dans une prière juive
  choice: le Seigneur
  alternative: Dieu
  rationale: Le grec porte κύριος. « Seigneur » respecte le terme source et sa portée scripturaire sans substituer une explicitation.
- issue: Rendu de σωτηρία dans un contexte de crise militaire
  choice: salut
  alternative: délivrance
  rationale: Le contexte favorise une délivrance concrète, mais σωτηρία peut aussi porter un sens plus large. Le texte principal conserve « salut » et la note maintient l’autre possibilité.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le caractère collectif et ému de la supplication, ainsi que l’ambiguïté lexicale de σωτηρία grâce à une note.
