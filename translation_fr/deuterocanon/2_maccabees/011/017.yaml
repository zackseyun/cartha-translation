base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/017.yaml
  text: John and Absalom[a], who were sent by you, delivered the written memorandum and made request concerning the matters indicated in it.
translation:
  language: fr
  text: Jean et Absalom, que vous aviez envoyés, ont remis la communication écrite ci-dessous[a] et ont formulé une demande au sujet des points qui y étaient indiqués.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le document joint », « la communication écrite » ou « le décret écrit ci-dessous ». L’expression grecque est propre au langage des documents officiels et son sens précis demeure incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰωάνης
  choice: Jean
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom propre grec.
- source_word: Ἀβεσσαλώμ
  choice: Absalom
  rationale: Forme française usuelle du nom biblique, préférable à une translittération stricte comme « Abessalom ».
- source_word: οἱ πεμφθέντες παρʼ ὑμῶν
  choice: que vous aviez envoyés
  rationale: Rend naturellement le participe aoriste passif et παρά avec le génitif dans ce contexte d'émissaires; le plus-que-parfait marque l'envoi antérieur à la remise du document.
- source_word: ἐπιδόντες
  choice: ont remis
  rationale: Le verbe désigne ici la transmission formelle d'un document; « remettre » convient au registre diplomatique.
- source_word: τὸν ὑπογεγραμμένον χρηματισμόν
  choice: le document écrit ci-dessous
  rationale: « Document » conserve le caractère officiel sans imposer le sens plus précis de « décret »; « écrit ci-dessous » rend la valeur spatiale ou documentaire de ὑπογεγραμμένον.
- source_word: ἠξίουν
  choice: ont présenté une demande
  rationale: Expression française naturelle qui préserve le ton formel du verbe dans une correspondance officielle.
- source_word: περὶ τῶν διʼ αὐτοῦ σημαινομένων
  choice: au sujet des points qui y étaient indiqués
  rationale: « Points » désigne sobrement les questions contenues dans l'écrit, tandis que « y » maintient le document comme référent probable de αὐτοῦ.
