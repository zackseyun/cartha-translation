base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/031.yaml
  text: that the Jews may make use of their own provisions and laws[a], just as before[b]; and none of them shall in any way be harassed concerning the things done in ignorance.
translation:
  language: fr
  text: que les Juifs puissent faire usage de leurs propres provisions[a] et de leurs lois, comme auparavant ; et qu’aucun d’eux ne soit inquiété de quelque manière que ce soit au sujet des actes commis par ignorance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme grec peut désigner des dépenses, des ressources ou des provisions ; ici, il renvoie probablement aux dispositions pratiques propres au mode de vie juif, peut-être notamment à l’alimentation.
    reason: lexical_alternative
  - marker: b
    text: Ou « au sujet des choses ignorées ». L’expression grecque peut désigner des actes commis sans le savoir ou des affaires qui n’étaient pas connues.
    reason: alternative_reading
lexical_decisions:
- source_word: χρῆσθαι
  choice: puissent disposer de … et suivre
  rationale: Le verbe exprime ici l’usage autorisé. La formulation française répartit naturellement son sens entre les « provisions » et les « lois », sans réduire la permission à la seule observance rituelle.
- source_word: δαπανήμασιν
  choice: provisions
  rationale: Le terme peut désigner des dépenses, des ressources ou des provisions. Dans ce contexte, « provisions » évoque les dispositions pratiques propres au mode de vie juif, éventuellement alimentaires, tout en évitant de rendre cette précision certaine.
- source_word: νόμοις
  choice: lois
  rationale: « Lois » conserve la portée juridique et religieuse de νόμοις dans ce contexte juif, que « coutumes » affaiblirait.
- source_word: καθὰ καὶ τὸ πρότερον
  choice: comme auparavant
  rationale: Cette expression renvoie simplement à la pratique antérieure ; « comme auparavant » est naturel et fidèle.
- source_word: παρενοχληθήσεται
  choice: ne soit inquiété
  rationale: Le passif désigne le fait de subir des tracasseries ou des entraves. « Être inquiété » convient à une garantie de caractère officiel et demeure idiomatique en français.
- source_word: περὶ τῶν ἠγνοημένων
  choice: au sujet des actes commis par ignorance
  rationale: La formulation conserve l’idée d’actes accomplis sans savoir ou sans pleine connaissance, sans préciser la nature des actes ni attribuer explicitement l’ignorance à une partie déterminée.
theological_decisions:
- issue: Portée de la clause περὶ τῶν ἠγνοημένων, proche d’une amnistie
  choice: Protection générale contre les tracasseries au sujet d’actes commis par ignorance
  alternative: Protection relative à des affaires jusque-là ignorées ou à des infractions involontaires précises
  rationale: Le grec ne précise ni la nature des actes ni la personne qui ignorait. La traduction maintient cette généralité au lieu d’imposer une théorie juridique ou religieuse particulière.
translation_notes:
  register: Français international moderne, clair et digne. La construction distingue naturellement l’usage des provisions et l’observance des lois, tout en conservant les ambiguïtés de δαπανήμασιν et de τῶν ἠγνοημένων dans les notes.
