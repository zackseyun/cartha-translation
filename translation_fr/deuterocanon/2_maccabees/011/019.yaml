  yaml_path: translation/deuterocanon/2_maccabees/011/019.yaml
  text: If[a], then, you maintain your goodwill in these matters, I will also continue from now on to try to be the cause of good things for you.
translation:
  language: fr
  text: Si donc vous maintenez votre bonne volonté dans ces affaires, je m’efforcerai désormais, de mon côté, d’être à l’origine de bienfaits.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συντηρήσητε
  choice: vous maintenez
  rationale: Le verbe exprime la conservation dans la durée d’une disposition déjà présente ; « maintenir » convient au ton diplomatique de la condition.
- source_word: εὔνοιαν
  choice: bonne volonté
  rationale: Le nom désigne une disposition favorable ou bienveillante. « Bonne volonté » est naturel en français et conserve ici la nuance relationnelle.
- source_word: εἰς τὰ πράγματα
  choice: dans ces affaires
  rationale: La formule renvoie de manière générale aux affaires ou à la situation en question, sans permettre de préciser davantage le référent.
- source_word: εἰς τὸ λοιπόν
  choice: désormais
  rationale: Cette expression temporelle regarde vers l’avenir ; « désormais » en donne une traduction concise et actuelle.
- source_word: πειράσομαι
  choice: je m’efforcerai
  rationale: Le futur exprime l’intention et l’effort, non la garantie du résultat. « Je m’efforcerai » convient au registre épistolaire officiel.
- source_word: αἰτιαῖος … γίνεσθαι
  choice: d’être à l’origine de
  rationale: La tournure grecque présente le locuteur comme cause ou agent responsable. « Être à l’origine de » en préserve la force causale dans un français naturel.
- source_word: ἀγαθῶν
  choice: bienfaits
  rationale: Le pluriel substantivé reste large et désigne les bonnes choses ou avantages que le locuteur promet de favoriser ; « bienfaits » convient au contexte diplomatique.
- source_word: καί
  choice: de mon côté
  rationale: Dans l’apodose, καί marque la réponse correspondante du locuteur à la bonne volonté des destinataires ; « de mon côté » rend clairement cette réciprocité.
