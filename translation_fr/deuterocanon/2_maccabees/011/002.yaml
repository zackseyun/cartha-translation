base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/002.yaml
  text: After gathering about eighty thousand men and all the cavalry[a], he advanced against the Jews, intending to make the city a dwelling place for Greeks,
translation:
  language: fr
  text: Après avoir rassemblé environ quatre-vingt mille hommes et toute la cavalerie, il marcha contre les Juifs[a], avec l’intention de faire de la ville un lieu d’habitation pour des Grecs,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Judéens ». Le grec Ἰουδαίους peut désigner le peuple juif ou les habitants de la Judée, selon le contexte.
    reason: Alternative lexicale significative liée à la portée ethnique, religieuse ou géographique du terme grec.
lexical_decisions:
- source_word: συναθροίσας
  choice: Après avoir rassemblé
  rationale: Le participe aoriste marque une action antérieure au verbe principal. Cette tournure rend clairement la succession des actions dans un français naturel.
- source_word: περὶ τὰς ὀκτὼ μυριάδας
  choice: environ quatre-vingt mille hommes
  rationale: Une μυριάς représente dix mille unités ; huit myriades correspondent donc à quatre-vingt mille. Avec un nombre, περί exprime ici l’approximation. « Hommes » est explicité en raison du contexte militaire.
- source_word: τὴν ἵππον ἅπασαν
  choice: toute la cavalerie
  rationale: Dans un contexte militaire, ἵππος peut désigner collectivement la cavalerie plutôt que les seuls chevaux.
- source_word: παρεγένετο ἐπὶ τοὺς Ἰουδαίους
  choice: il marcha contre les Juifs
  rationale: Avec ἐπί suivi de l’accusatif, le mouvement a ici une orientation hostile. « Marcha contre » exprime sobrement cette progression militaire.
- source_word: λογιζόμενος
  choice: avec l’intention
  rationale: Dans le contexte, le participe exprime un dessein, et non une simple réflexion intérieure.
- source_word: τὴν μὲν πόλιν
  choice: de la ville
  rationale: Le nom désigne la ville mentionnée dans le contexte. La particule μέν annonce une suite contrastée dans le verset suivant ; la phrase reste donc ouverte.
- source_word: Ἕλλησιν
  choice: pour des Grecs
  rationale: Le datif indique ici les bénéficiaires ou futurs occupants du lieu. L’absence d’article favorise « des Grecs » plutôt que « les Grecs ».
- source_word: οἰκητήριον ποιήσειν
  choice: faire de la ville un lieu d’habitation
  rationale: La construction signifie transformer la ville en lieu où habiter. Cette formulation conserve l’image du grec sans préciser indûment une politique de colonisation.
theological_decisions:
- issue: Portée du nom Ἰουδαίους
  choice: les Juifs
  alternative: les Judéens
  rationale: Dans 2 Maccabées, le terme peut avoir une valeur ethnique et religieuse ou une valeur géographique. Ici, il désigne vraisemblablement le peuple pris collectivement ; « les Juifs » convient donc au texte principal, tandis que « les Judéens » demeure une traduction possible signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le caractère militaire du passage et la virgule finale, puisque la construction introduite par μέν se poursuit au verset suivant.
