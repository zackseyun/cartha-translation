base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/008.yaml
  text: And there[a], when they were near Jerusalem, a horseman appeared going before them[b], clothed in white and brandishing golden armor.
translation:
  language: fr
  text: Alors qu’ils se trouvaient là, près de Jérusalem, un cavalier[a] leur apparut, avançant devant eux[b], vêtu de blanc et brandissant une armure d’or.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte n’identifie pas explicitement ce cavalier. Sa description peut évoquer un protecteur céleste, mais la traduction ne précise pas davantage que le grec.
    reason: cultural_note
  - marker: b
    text: 'Ou : « les précédant ». Le participe grec indique qu’il avançait devant eux, sans affirmer explicitement qu’il les commandait.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτόθι
  choice: là
  rationale: Cet adverbe de lieu renvoie à l’endroit où ils se trouvent; « là » conserve ce repérage spatial sans le transformer en simple indication temporelle.
- source_word: πρὸς τοῖς Ἱεροσολύμοις
  choice: près de Jérusalem
  rationale: Avec le datif, πρός exprime ici la proximité; cette formulation est naturelle en français et situe la scène aux abords de la ville.
- source_word: ὄντων
  choice: alors qu’ils se trouvaient
  rationale: Le génitif absolu est rendu par une proposition temporelle idiomatique, avec pour sujet implicite le groupe mentionné dans le contexte.
- source_word: ἐφάνη
  choice: leur apparut
  rationale: Le verbe indique qu’une figure devient visible; « apparut » conserve le caractère soudain de la manifestation sans en préciser la nature.
- source_word: προηγούμενος αὐτῶν
  choice: avançant devant eux
  rationale: Le participe présente le cavalier en mouvement à l’avant du groupe. Cette traduction préserve l’image sans affirmer qu’il exerçait officiellement le commandement.
- source_word: ἔφιππος
  choice: un cavalier
  rationale: L’adjectif est employé substantivement pour désigner une personne montée à cheval; « un cavalier » est l’équivalent français le plus clair.
- source_word: ἐν λευκῇ ἐσθῆτι
  choice: vêtu de blanc
  rationale: La formule rend avec naturel le vêtement blanc bien visible tout en gardant un registre narratif digne.
- source_word: πανοπλίαν χρυσῆν
  choice: une armure d’or
  rationale: πανοπλία désigne l’équipement défensif complet. « Armure d’or » conserve l’image martiale et la matière ou l’apparence dorée sans employer le terme rare « panoplie ».
- source_word: κραδαίνων
  choice: brandissant
  rationale: Le verbe évoque un mouvement vigoureux et ostensible. Malgré l’association inhabituelle avec une armure, « brandissant » respecte l’image frappante du grec plutôt que de la normaliser.
theological_decisions:
- issue: Identité du cavalier
  choice: Le personnage est seulement désigné comme « un cavalier » qui apparaît.
  alternative: L’identifier explicitement comme un ange ou un guerrier céleste envoyé par Dieu.
  rationale: Le grec décrit la figure et son apparition sans l’identifier expressément. La traduction laisse donc au lecteur l’inférence possible d’un protecteur céleste.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. La construction conserve le caractère visionnaire et martial du récit, ainsi que la réserve du grec sur l’identité et la fonction du cavalier.
