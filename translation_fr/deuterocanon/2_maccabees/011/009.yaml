base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/009.yaml
  text: And all together they blessed the merciful God and were strengthened in spirit[a], being ready to wound not only men but even the fiercest wild beasts and iron walls.
translation:
  language: fr
  text: Tous ensemble, ils bénirent le Dieu miséricordieux et furent fortifiés intérieurement[a], prêts à blesser non seulement des hommes, mais aussi les bêtes sauvages les plus féroces et des murailles de fer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « furent fortifiés dans leurs âmes ». Le grec évoque un affermissement intérieur, notamment du courage.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοῦ δὲ πάντες
  choice: Tous ensemble
  rationale: Rend l’action collective et unanime exprimée par ὁμοῦ associé à πάντες.
- source_word: εὐλόγησαν
  choice: bénirent
  rationale: Conserve le sens religieux direct de « dire du bien de, bénir » appliqué à Dieu; « louèrent » serait également possible.
- source_word: τὸν ἐλεήμονα θεόν
  choice: le Dieu miséricordieux
  rationale: Expression naturelle en français qui maintient explicitement la qualité divine mise en avant par ἐλεήμονα.
- source_word: ἐπερρώσθησαν ταῖς ψυχαῖς
  choice: furent fortifiés intérieurement
  rationale: Communique le courage et l’affermissement intérieur sans faire de ψυχαῖς un terme anthropologique technique.
- source_word: τιτρώσκειν
  choice: à blesser
  rationale: Rend l’idée d’infliger une blessure et préserve l’image hyperbolique, qui s’étend des êtres vivants aux murailles.
- source_word: ἀνθρώπους
  choice: des hommes
  rationale: Convient au contexte guerrier et conserve le contraste grec entre les êtres humains et les bêtes sauvages.
- source_word: θῆρας δὲ τοὺς ἀγριωτάτους
  choice: mais même les bêtes sauvages les plus féroces
  rationale: Préserve à la fois le renforcement adversatif et le superlatif ἀγριωτάτους.
- source_word: σιδηρᾶ τείχη
  choice: des murailles de fer
  rationale: Rend directement l’image de fortifications d’une résistance extrême.
- source_word: ὄντες ἕτοιμοι
  choice: prêts
  rationale: Formulation française fluide qui rattache leur disposition au résultat de leur affermissement.
theological_decisions:
- issue: Sens de ψυχαῖς dans un contexte de préparation au combat
  choice: furent fortifiés intérieurement
  alternative: furent fortifiés dans leur âme
  rationale: Le contexte indique l’affermissement du courage et de la résolution. La formulation retenue évite d’imposer une anthropologie technique tout en conservant la dimension intérieure.
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans être archaïque. L’image hyperbolique des bêtes féroces et des murailles de fer est conservée, de même que l’ambiguïté de ψυχαῖς grâce à une note.
