  rationale: La révision remplace « mais même » par la corrélation française plus directement correspondante « mais aussi » et corrige le pluriel de l’alternative dans la note. Le sens, l’hyperbole guerrière et l’ambiguïté non technique de ψυχαῖς sont préservés.
