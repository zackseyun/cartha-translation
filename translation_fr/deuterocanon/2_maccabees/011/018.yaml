  text: So then[a], whatever had to be presented also to the king I made clear, and whatever was possible he granted.
translation:
  language: fr
  text: J’ai donc exposé clairement tout ce qui devait aussi être soumis au roi, et il a accordé tout ce qui était possible.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il a concédé tout ce qui était réalisable ». Le grec peut désigner ce qui était possible dans les circonstances, et le verbe traduit par « accordé » peut aussi signifier « concédé » ou « permis ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα μὲν οὖν
  choice: J’ai donc… tout ce qui
  rationale: « Donc » restitue la transition déductive de μὲν οὖν, tandis que « tout ce qui » rend naturellement ὅσα en français.
- source_word: ἔδει
  choice: devait
  rationale: L’imparfait de « devoir » exprime ici la nécessité passée portée par l’impersonnel ἔδει.
- source_word: καὶ τῷ βασιλεῖ
  choice: aussi… au roi
  rationale: '« Aussi » conserve la valeur additive de καί : ces questions devaient être soumises au roi en plus des démarches déjà entreprises.'
- source_word: προσενεχθῆναι
  choice: être soumis
  rationale: Dans ce contexte administratif, « soumettre » désigne naturellement le fait de porter une affaire devant une autorité.
- source_word: διεσάφησα
  choice: j’ai exposé clairement
  rationale: Cette formulation conserve l’idée de rendre une question claire et explicite, tout en convenant au registre d’une lettre officielle.
- source_word: ἃ δὲ ἦν ἐνδεχόμενα
  choice: tout ce qui était possible
  rationale: La formulation préserve la portée assez large de ἐνδεχόμενα, qui peut désigner ce qui était possible ou réalisable dans les circonstances.
- source_word: συνεχώρησεν
  choice: il a accordé
  rationale: Dans le contexte de requêtes présentées au roi, le verbe désigne vraisemblablement l’octroi de ce qui pouvait l’être, sans exclure la nuance de concession.
