  yaml_path: translation/deuterocanon/2_maccabees/011/012.yaml
  text: But most of them escaped wounded and naked[a], and Lysias himself also escaped by fleeing shamefully.
translation:
  language: fr
  text: Mais la plupart d’entre eux réussirent à s’échapper, blessés et nus[a] ; Lysias lui-même réussit aussi à s’échapper en prenant honteusement la fuite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dépouillés », si γυμνοί évoque ici des hommes privés de leurs vêtements ou de leur équipement pendant la fuite, plutôt qu’entièrement nus.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πλείονες
  choice: la plupart d’entre eux
  rationale: Le comparatif substantivé désigne ici la majeure partie du groupe. Cette tournure est naturelle en français moderne et conserve le sens quantitatif.
- source_word: τραυματίαι
  choice: blessés
  rationale: Le terme désigne des hommes ayant reçu des blessures. Employé en apposition, « blessés » exprime directement leur état sans alourdir la phrase.
- source_word: γυμνοὶ
  choice: nus
  rationale: C’est le sens direct du grec. Dans le contexte d’une déroute, le terme peut aussi évoquer des hommes dépouillés de leurs vêtements ou de leur équipement, possibilité signalée en note.
- source_word: διεσώθησαν / διεσώθη
  choice: réussirent à s’échapper / réussit à s’échapper
  rationale: διασῴζω évoque le fait de parvenir sain et sauf hors d’un danger. Dans ce récit de bataille, « réussir à s’échapper » rend clairement l’idée de survie et de fuite.
- source_word: αἰσχρῶς
  choice: honteusement
  rationale: L’adverbe porte un jugement dépréciatif sur la manière dont Lysias prend la fuite ; « honteusement » préserve explicitement cette appréciation.
- source_word: φεύγων
  choice: en prenant … la fuite
  rationale: Le participe présent indique la circonstance ou le moyen de son salut. Cette formulation française relie naturellement sa fuite à son évasion.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « réussir à s’échapper » reflète celle de διεσώθησαν / διεσώθη dans le grec, tandis que le point-virgule rend clairement les deux propositions.
