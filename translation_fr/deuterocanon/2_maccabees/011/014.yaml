base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/014.yaml
  text: He persuaded him to come to terms on all the just demands[a], and that he would also persuade the king, compelling him to become their friend.
translation:
  language: fr
  text: Il le persuada de parvenir à un accord au sujet de toutes les revendications légitimes[a], parce qu’il persuaderait aussi le roi, en obligeant celui-ci à devenir leur ami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur tous leurs droits légitimes » ou « au sujet de toutes les questions justes ». Le grec est concis et peut évoquer un accommodement ou un règlement portant sur des prétentions reconnues comme fondées.
    reason: alternative lexicale et ambiguïté de la formulation grecque
lexical_decisions:
- source_word: ἔπεισεν
  choice: Il le persuada
  rationale: L’aoriste de πείθω exprime directement l’action de persuader; le pronom objet est fourni par le contexte immédiat.
- source_word: συλλύεσθαι
  choice: de conclure un accord
  rationale: Dans ce contexte diplomatique, l’infinitif moyen évoque un règlement négocié ou un accommodement plutôt qu’une dissolution au sens littéral.
- source_word: ἐπὶ πᾶσι τοῖς δικαίοις
  choice: sur toutes les revendications légitimes
  rationale: Dans un cadre politico-juridique, τὰ δίκαια désigne vraisemblablement les droits ou prétentions reconnus comme justes; « légitimes » évite une coloration doctrinale indue.
- source_word: διότι καὶ τὸν βασιλέα πείσει
  choice: parce qu’il persuaderait aussi le roi
  rationale: διότι est conservé dans son sens causal naturel, tandis que le futur grec devient un conditionnel de perspective dans le récit au passé.
- source_word: φίλον αὐτοῖς
  choice: leur ami
  rationale: Le prédicat exprime une relation favorable, probablement aussi politique; la formulation française reste concise et fidèle.
- source_word: ἀναγκάζων γενέσθαι
  choice: en l’obligeant à devenir
  rationale: ἀναγκάζω marque une contrainte réelle; « obliger » en conserve la force sans amplification.
theological_decisions:
- issue: Sens de τοῖς δικαίοις dans un contexte politico-juridique
  choice: revendications légitimes
  alternative: questions justes / droits légitimes
  rationale: Le passage porte sur une négociation et non sur la justice comme notion doctrinale. Cette traduction rend le caractère concret de ce qui est réclamé tout en signalant que ces demandes sont tenues pour fondées.
- issue: Rapport syntaxique introduit par διότι
  choice: 'valeur causale : « parce que »'
  alternative: 'valeur complétive : « et lui assura qu’il persuaderait aussi le roi »'
  rationale: διότι porte normalement une valeur causale ou explicative. La formulation française conserve cette lecture sans effacer l’ambiguïté possible du grec comprimé.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la concision diplomatique du grec et sa tension entre persuasion et contrainte.
