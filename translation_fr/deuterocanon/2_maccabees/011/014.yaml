  source_fidelity: Le sens diplomatique de συλλύεσθαι et la valeur politico-juridique de τὰ δίκαια sont bien rendus. La lecture causale de διότι demeure possible et est conservée. Le participe ἀναγκάζων se rapporte toutefois au fait de contraindre le roi à devenir leur ami; le pronom de la version proposée peut momentanément renvoyer à l’interlocuteur initial.
  naturalness: « Conclure un accord sur toutes les revendications » est moins idiomatique que « parvenir à un accord au sujet de ». L’explicitation de l’objet de « obliger » supprime une ambiguïté référentielle inutile en français.
