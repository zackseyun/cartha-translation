lexical_decisions:
- source_word: τοῖς οὖν καταπορευομένοις
  choice: Ainsi donc, ceux qui descendront
  rationale: Le participe substantivé désigne les personnes qui se rendront vers le bas ou quitteront un lieu. « Descendront » conserve le sens directionnel sans préciser une destination absente du grec.
- source_word: μέχρι τριακάδος Ξανθικοῦ
  choice: avant le trentième jour du mois de Xanthique
  rationale: La tournure fixe une échéance au trentième jour de Xanthique. Dans ce contexte d’amnistie et de retour, « avant le » exprime naturellement en français la limite temporelle, sans convertir le calendrier antique.
- source_word: ὑπάρξει
  choice: bénéficieront
  rationale: Le futur ὑπάρξει indique ici que la garantie et l’autorisation seront acquises aux personnes concernées. Cette formulation française rend naturellement la construction existentielle avec datif.
- source_word: δεξιὰ
  choice: une garantie
  rationale: Littéralement « une main droite », δεξιά désigne dans le langage diplomatique une assurance solennelle ou un engagement donné. « Garantie » transmet clairement cette valeur idiomatique.
- source_word: μετὰ τῆς ἀδείας
  choice: et d’une autorisation
  rationale: Ἄδεια peut désigner la permission, la liberté d’agir ou l’autorisation officielle. « Autorisation » convient au registre administratif de la lettre, tandis que la note conserve la formulation plus littérale.
