  text: Therefore[a], for those who come down until the thirtieth of Xanthicus, there will be a right hand of assurance together with permission[b],
translation:
  language: fr
  text: Ainsi donc, pour ceux qui descendront jusqu’au trentième jour de Xanthique, il y aura un gage de bonne foi avec l’autorisation.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « il y aura pour ceux qui descendront jusqu’au trentième jour de Xanthique une main droite avec l’autorisation ». La « main droite » désigne ici un gage ou une assurance solennelle de bonne foi. Xanthique est un mois du calendrier macédonien employé à l’époque hellénistique.'
