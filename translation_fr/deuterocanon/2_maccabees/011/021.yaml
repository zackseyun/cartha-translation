  text: Farewell. In the one hundred forty-eighth year[a], on the twenty-fourth day of Dios Corinthios.
translation:
  language: fr
  text: Portez-vous bien. En l’an cent quarante-huit[a], le vingt-quatrième jour de Dios Corinthios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec conserve le nom de mois du calendrier macédonien « Dios Corinthios », sans donner de mois directement équivalent dans un autre calendrier.
