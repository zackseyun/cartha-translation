lexical_decisions:
- source_word: ἔρρωσθε
  choice: Portez-vous bien
  rationale: Formule épistolaire de conclusion souhaitant santé et bien-être aux destinataires; cette tournure conserve mieux que « Adieu » la valeur de l’impératif grec tout en restant naturelle en français.
- source_word: ἔτους ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: En l’an cent quarante-huit
  rationale: Rend naturellement la formule grecque de datation, avec le nombre écrit en toutes lettres conformément au ton officiel du document.
- source_word: Διὸς Κορινθίου
  choice: Dios Corinthios
  rationale: Translittération du nom de mois transmis par le grec, afin de préserver la désignation historique sans lui imposer un équivalent calendaire incertain.
- source_word: τετράδι καὶ εἰκάδι
  choice: le vingt-quatrième jour
  rationale: L’expression grecque, littéralement « le quatrième et le vingtième », désigne idiomatiquement le vingt-quatrième jour du mois.
