  text: Since our father has departed to the gods[a], and since we want those in the kingdom, being free from disturbance, to turn to the care of the Jews[b],
translation:
  language: fr
  text: Notre père étant allé rejoindre les dieux[a], nous voulons que ceux du royaume soient sans trouble en ce qui concerne l’administration concernant les Juifs[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « étant passé vers les dieux ». Il s’agit d’un euphémisme royal hellénistique pour parler de la mort; certaines traductions disent simplement : « est mort ».'
    reason: lexical_alternative
  - marker: b
    text: La fin de la phrase est très condensée en grec. Littéralement, elle exprime le souhait que ceux du royaume soient sans trouble « en ce qui concerne le soin ou l’administration des Juifs ». Elle peut aussi se comprendre plus largement comme une référence aux affaires juives.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ πατρὸς ἡμῶν
  choice: notre père
  rationale: Cette expression conserve l’idiome dynastique et officiel de la lettre sans préciser davantage l’identité ou le statut du prédécesseur.
- source_word: εἰς θεοὺς μεταστάντος
  choice: a rejoint les dieux
  rationale: Cette tournure française naturelle préserve l’euphémisme royal hellénistique et sa référence polythéiste explicite, au lieu de le réduire à « est mort ».
- source_word: βουλόμενοι
  choice: nous voulons
  rationale: Le participe exprime l’intention déclarée des auteurs de la lettre; une proposition coordonnée est plus naturelle en français moderne.
- source_word: τοὺς ἐκ τῆς βασιλείας
  choice: les habitants du royaume
  rationale: Le grec désigne collectivement ceux qui relèvent du royaume. « Habitants » reste général et évite d’ajouter la notion plus précise de « sujets ».
- source_word: ἀπερισπάστως ὄντας
  choice: à l’abri de toute agitation
  rationale: Dans ce contexte politique, l’expression évoque une situation exempte de troubles ou de perturbations, plutôt qu’une simple absence de distraction intérieure.
- source_word: γενέσθαι πρὸς τὴν τῶν Ἰουδαίων ἐπιμέλειαν
  choice: s’occupent des affaires des Juifs
  rationale: La construction grecque est condensée. Cette formulation rend naturellement l’idée d’accorder attention et soin à ce qui concerne les Juifs, tout en signalant en note l’autre nuance possible.
theological_decisions:
- issue: Maintien de la formule royale païenne relative à la mort
  choice: a rejoint les dieux
  alternative: est mort
  rationale: La lettre emploie explicitement une formule hellénistique polythéiste. La traduction la conserve comme parole du document cité, sans la normaliser selon un langage monothéiste.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe participiale grecque est restructurée en deux propositions pour être naturelle en français. La virgule finale est maintenue parce que le verset constitue le début d’une phrase qui se poursuit.
