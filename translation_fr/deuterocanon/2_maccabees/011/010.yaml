  text: They advanced in battle formation[a], having the ally from heaven before them, because the Lord had shown them mercy.
translation:
  language: fr
  text: Ils avancèrent en ordre de bataille[a], ayant devant eux l’allié venu du ciel, car le Seigneur leur avait fait miséricorde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Ils avancèrent, équipés pour le combat, l’allié venu du ciel marchant devant eux. » Le début de la phrase grecque est très condensé et peut recevoir des analyses syntaxiques légèrement différentes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πρόηγον
  choice: Ils avancèrent… avec devant eux
  rationale: L’expression participiale neutre est très condensée et difficile. Cette formulation rend naturellement le mouvement en avant tout en conservant le lien possible avec la position de l’allié céleste.
- source_word: ἐν διασκευῇ
  choice: en ordre de bataille
  rationale: La locution évoque l’équipement ou la disposition en vue du combat; « en ordre de bataille » exprime de façon idiomatique la préparation et l’organisation militaires.
- source_word: σύμμαχον
  choice: l’allié
  rationale: Le terme désigne celui qui combat aux côtés d’un autre; « allié » conserve sa portée militaire mieux qu’un mot plus général comme « secours ».
- source_word: ἀπʼ οὐρανοῦ
  choice: venu du ciel
  rationale: Dans ce contexte religieux, οὐρανός désigne le ciel comme domaine céleste. « Venu du ciel » rend ici naturellement l’origine indiquée par ἀπό.
- source_word: ἐλεήσαντος
  choice: avait fait miséricorde
  rationale: Le participe aoriste présente la miséricorde du Seigneur comme le fondement ou la circonstance de leur avance. Cette tournure préserve le motif biblique de la miséricorde.
- source_word: τοῦ κυρίου
  choice: le Seigneur
  rationale: Dans ce contexte scripturaire juif, κύριος est un titre révérencieux désignant Dieu.
theological_decisions:
- issue: Identité de « l’allié venu du ciel »
  choice: L’identité reste implicite.
  alternative: Un ange secourable, ou l’intervention directe de Dieu.
  rationale: Le grec ne précise pas qui est cet allié. La traduction conserve cette ouverture sans imposer une identification.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’image militaire et l’ambiguïté syntaxique du grec grâce à une note, sans identifier l’allié céleste.
