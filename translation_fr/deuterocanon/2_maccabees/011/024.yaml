base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/024.yaml
  text: Having heard that the Jews did not approve of my father's change to Greek ways[a], but were choosing their own way of life and asking that their lawful customs be permitted to them,
translation:
  language: fr
  text: Ayant appris que les Juifs n’approuvaient pas le changement introduit par mon père en faveur des pratiques grecques[a], mais qu’ils préféraient leur propre manière de vivre et demandaient qu’on leur permette de conserver leurs coutumes légales,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le changement introduit par mon père vers les coutumes grecques ». L’expression grecque évoque une politique d’hellénisation et non un simple changement de langue.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκηκοότες
  choice: Ayant appris
  rationale: Le participe parfait introduit le motif de la décision royale. « Ayant appris » conserve le lien participial et convient au registre officiel.
- source_word: μὴ συνεὐδοκοῦντας
  choice: n’approuvaient pas
  rationale: συνευδοκέω exprime ici l’assentiment ou l’approbation ; cette formulation est naturelle et précise en français.
- source_word: τῇ τοῦ πατρὸς εἰς τὰ Ἑλληνικὰ μεταθέσει
  choice: le passage aux coutumes grecques imposé par mon père
  rationale: μετάθεσις désigne un changement ou un transfert, et τὰ Ἑλληνικά les pratiques hellénisantes plutôt que la seule langue grecque. « Imposé par mon père » explicite naturellement le génitif d’auteur dans ce contexte politique, sans faire du père lui-même l’objet du changement.
- source_word: τὴν ἑαυτῶν ἀγωγήν
  choice: leur propre manière de vivre
  rationale: ἀγωγή désigne une conduite ou un mode de vie ; la formulation rend la dimension communautaire et culturelle.
- source_word: αἱρετίζοντας
  choice: préféraient
  rationale: Le verbe marque un choix délibéré. « Préféraient » exprime clairement le contraste avec le refus de l’hellénisation.
- source_word: ἀξιοῦν
  choice: demandaient
  rationale: Dans ce contexte, ἀξιόω introduit une requête ; « demandaient » évite de surinterpréter une revendication de droit.
- source_word: συγχωρηθῆναι αὐτοῖς τὰ νόμιμα
  choice: qu’on leur permette d’observer leurs usages traditionnels
  rationale: τὰ νόμιμα désigne les prescriptions et usages reconnus par la tradition. L’ajout idiomatique d’« observer » rend en français ce que signifie concrètement la permission demandée.
theological_decisions:
- issue: Sens de εἰς τὰ Ἑλληνικά
  choice: orientation vers les coutumes grecques, c’est-à-dire l’hellénisation culturelle
  alternative: passage à la langue grecque
  rationale: Le contexte oppose cette politique à la manière de vivre et aux usages propres des Juifs ; il s’agit donc de pratiques culturelles et religieuses, non simplement de langue.
- issue: Portée de τὰ νόμιμα
  choice: usages traditionnels
  alternative: lois légitimes
  rationale: Le neutre pluriel peut couvrir à la fois lois, prescriptions et coutumes établies. « Usages traditionnels » restitue ici cette portée sans réduire l’expression au droit civil ni lui imposer une qualification théologique.
translation_notes:
  register: Français moderne, digne et accessible, avec une syntaxe adaptée au style d’une lettre royale. La phrase reste ouverte par une virgule, conformément à sa continuité avec le verset suivant.
