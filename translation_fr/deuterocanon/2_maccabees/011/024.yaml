    issue: « usages traditionnels » réduit la nuance de τὰ νόμιμα.
    rationale: Le terme désigne des normes, lois ou coutumes reconnues. « Traditionnels » communique l’ancienneté, mais non leur caractère normatif; « coutumes légales » préserve mieux l’ambiguïté du grec.
