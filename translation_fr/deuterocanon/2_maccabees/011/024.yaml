  verdict: revise
  source_fidelity: La traduction rend bien la structure participiale, le refus de l’hellénisation, la préférence pour le mode de vie propre et la requête concernant les νόμιμα. Toutefois, « imposé par mon père » ajoute l’idée explicite d’une contrainte, absente de τῇ τοῦ πατρὸς ... μεταθέσει. « Usages traditionnels » atténue la dimension normative/juridique de τὰ νόμιμα.
  naturalness: Le français est fluide, formel et la virgule finale respecte la continuité syntaxique avec le verset suivant. La formulation révisée demeure naturelle dans le cadre d’une lettre royale.
  terminology: « Pratiques grecques » rend clairement τὰ Ἑλληνικά comme orientation culturelle hellénisante. « Coutumes légales » conserve, mieux que « usages traditionnels », la double portée coutumière et normative de τὰ νόμιμα, sans imposer une lecture confessionnelle.
