  text: And for us[a], who have undertaken the hardship of making the abridgment, the task is not easy, but a matter of sweat and sleeplessness;
translation:
  language: fr
  text: 'Pour nous qui avons assumé la peine de réaliser cet abrégé[a], la tâche n’est pas facile : elle exige sueur et nuits sans sommeil.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec ἐπιτομή désigne une version condensée d’un ouvrage, un abrégé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμῖν ... τοῖς
  choice: Pour nous qui
  rationale: Le datif et la construction article-participe désignent les rédacteurs comme ceux auxquels incombe la tâche; cette formulation est naturelle en français.
- source_word: τὴν κακοπάθειαν
  choice: la peine
  rationale: Dans ce contexte de travail rédactionnel, κακοπάθεια évoque l’effort pénible et les difficultés endurées, sans suggérer nécessairement la persécution.
- source_word: ἐπιδεδιγμένοις
  choice: avons assumé
  rationale: Le participe parfait moyen exprime une entreprise prise en charge dont l’engagement demeure actuel.
- source_word: τῆς ἐπιτομῆς
  choice: de réaliser cet abrégé
  rationale: ἐπιτομή désigne ici une œuvre condensée. « Abrégé » est courant et précis; « réaliser » explicite naturellement l’activité éditoriale sous-entendue.
- source_word: οὐ ῥᾴδιον
  choice: n’est pas facile
  rationale: Rend directement l’appréciation sobre de la difficulté.
- source_word: ἱδρῶτος ... καὶ ἀγρυπνίας
  choice: exige sueur et nuits sans sommeil
  rationale: La formulation conserve l’image concrète de l’effort physique et de la veille, tout en exprimant naturellement en français ce que coûte la tâche.
- source_word: τὸ πρᾶγμα
  choice: la tâche
  rationale: πρᾶγμα renvoie ici à l’entreprise de produire l’abrégé; « tâche » est précis dans ce contexte.
