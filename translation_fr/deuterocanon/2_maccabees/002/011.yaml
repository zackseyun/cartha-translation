base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/011.yaml
  text: And after many years had passed[a], when it pleased God, Nehemiah, having been sent by the king of Persia, sent the descendants of the priests who had hidden it to get the fire.
translation:
  language: fr
  text: Après bien des années, quand Dieu le jugea bon[a], Néhémie, envoyé par le roi de Perse, envoya les descendants des prêtres qui avaient caché le feu le chercher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « quand cela parut bon à Dieu » ; autre traduction : « quand il plut à Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διελθόντων δὲ ἐτῶν ἱκανῶν
  choice: Après bien des années
  rationale: Le génitif absolu exprime le temps écoulé. « Après bien des années » rend naturellement ἱκανῶν, qui signifie ici un nombre considérable d’années.
- source_word: ὅτε ἔδοξεν τῷ θεῷ
  choice: quand Dieu le jugea bon
  rationale: Cette formulation française naturelle conserve l’idée de ce qui paraît bon à Dieu et exprime le moment fixé par sa volonté sans renforcer le propos grec.
- source_word: ἀποσταλεὶς Νεεμίας ἀπὸ τοῦ βασιλέως τῆς Περσίδος
  choice: Néhémie, envoyé par le roi de Perse
  rationale: Le participe aoriste passif présente Néhémie comme ayant reçu sa mission du roi de Perse. En français, « envoyé par » exprime clairement cette relation.
- source_word: τοὺς ἐκγόνους τῶν ἱερέων
  choice: les descendants des prêtres
  rationale: ἐκγόνους désigne les descendants ou la postérité, sans imposer la relation plus étroite exprimée par « fils ».
- source_word: τῶν ἀποκρυψάντων
  choice: qui avaient caché le feu
  rationale: Le participe désigne les prêtres qui avaient dissimulé le feu dans le récit précédent. La répétition explicite de « le feu » évite en français une référence pronominale obscure.
- source_word: ἔπεμψεν ἐπὶ τὸ πῦρ
  choice: envoya … le chercher
  rationale: πέμπω suivi de ἐπί avec l’accusatif indique ici l’envoi en vue de retrouver ou de rapporter le feu. « Envoya … le chercher » est idiomatique et respecte le but de la mission.
theological_decisions:
- issue: Volonté divine dans ὅτε ἔδοξεν τῷ θεῷ
  choice: quand Dieu le jugea bon
  alternative: quand cela parut bon à Dieu ; quand il plut à Dieu
  rationale: Le choix retenu exprime la convenance selon le jugement de Dieu et son calendrier, tout en préservant la retenue et la nuance de l’expression grecque.
translation_notes:
  register: Français international moderne, clair et digne. La phrase suit l’ordre logique du grec tout en évitant une construction artificielle ; la reprise de « le feu » puis le pronom « le » assure une référence nette.
