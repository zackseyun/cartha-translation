- from: Nous avons veillé à rendre la lecture agréable à ceux qui désirent lire, à faciliter la mémorisation pour ceux qui ont à cœur de retenir le récit, et à être utiles à tous ceux qui le consulteront.
  to: Nous avons pris soin de procurer de l’agrément à ceux qui désirent lire, de faciliter la mémorisation pour ceux qui souhaitent le retenir en mémoire, et d’être utiles à tous ceux qui en prennent connaissance.
  rationale: La révision conserve le parallélisme des trois groupes et des trois objectifs, évite d’ajouter « le récit », et rend ἐντυγχάνουσιν de manière suffisamment large par « en prennent connaissance ». Le pronom « le » dans le membre central renvoie naturellement à l’ouvrage auquel le prologue se rapporte, sans en préciser artificiellement le genre littéraire.
