  text: we have taken care that for those who wish to read there may be enjoyment, for those who are inclined to commit it to memory ease, and for all who encounter it benefit.
translation:
  language: fr
  text: Nous avons pris soin de procurer de l’agrément à ceux qui désirent lire, de faciliter la mémorisation pour ceux qui souhaitent le retenir en mémoire, et d’être utiles à tous ceux qui en prennent connaissance.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφροντίσαμεν
  choice: Nous avons veillé à
  rationale: Exprime le soin délibéré pris par l’abréviateur, dans un français naturel et digne.
- source_word: εὐχαγωγίαν
  choice: rendre la lecture agréable
  rationale: Le terme désigne ici l’agrément ou l’aisance procurés au lecteur; la formulation relie explicitement cette qualité à l’acte de lire.
- source_word: φιλοφρονοῦσιν
  choice: ceux qui ont à cœur
  rationale: Conserve l’idée d’une disposition volontaire et favorable sans réduire le terme à un simple souhait.
- source_word: εἰς τὸ διαμνήμης ἀναλαβεῖν
  choice: retenir le récit
  rationale: Rend l’idée de prendre durablement en mémoire; «le récit» explicite en français l’objet sous-entendu en grec.
- source_word: ἐντυγχάνουσιν
  choice: ceux qui le consulteront
  rationale: Dans ce contexte littéraire, le verbe évoque ceux qui rencontrent l’ouvrage en le lisant ou en le consultant; ce choix évite de répéter «lire».
- source_word: ὠφέλειαν
  choice: être utiles
  rationale: Restitue directement l’idée de profit ou de bénéfice pour tous les usagers de l’ouvrage.
