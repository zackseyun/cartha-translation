translation:
  language: fr
  text: Après avoir ouvert la porte cachée du plafond à caissons[a], ils lancèrent des pierres et abattirent le chef[b]. Puis, après l'avoir démembré, ils jetèrent les têtes[c] à ceux qui étaient dehors.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « plafond à caissons » est rare et son sens demeure incertain ; il paraît désigner un plafond ouvragé ou un espace aménagé sous le toit.
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec est particulièrement énergique et évoque un coup dévastateur, comme celui de la foudre.
    reason: lexical_alternative
  - marker: c
    text: Le grec porte « les têtes » au pluriel, bien qu’il ait auparavant mentionné « le chef » au singulier et que le démembrement renvoie naturellement à lui. Cette irrégularité du texte ou du récit est conservée dans la traduction.
    reason: textual_variant
lexical_decisions:
- source_word: ἀνοίξαντες
  choice: Après avoir ouvert
  rationale: Le participe aoriste marque une action antérieure aux actions principales ; cette tournure en rend naturellement la succession.
- source_word: κρυπτὴν θύραν
  choice: la porte cachée
  rationale: κρυπτήν désigne ce qui est dissimulé. « Porte cachée » reste concret et naturel sans suggérer nécessairement un mécanisme de passage secret.
- source_word: τοῦ φατινώματος
  choice: du plafond à caissons
  rationale: Le terme rare φατίνωμα semble désigner un plafond ouvragé ou à panneaux. « Plafond à caissons » rend ce sens architectural probable, tandis qu’une note signale l’incertitude.
- source_word: βάλλοντες πέτρους
  choice: ils lancèrent des pierres
  rationale: Le participe indique le moyen employé pour l’attaque ; une proposition coordonnée est plus naturelle en français.
- source_word: συνεκεραύνωσαν
  choice: écrasèrent
  rationale: Le verbe, rare et très énergique, évoque un coup dévastateur comparable à la foudre. Dans le contexte d’un jet de pierres, « écrasèrent » exprime clairement la violence de l’action.
- source_word: τὸν ἡγεμόνα
  choice: le chef
  rationale: ἡγεμών peut désigner un chef, un gouverneur ou un dirigeant. Le terme général « chef » évite de préciser une fonction que ce membre de phrase ne définit pas.
- source_word: μέλη ποιήσαντες
  choice: ils les mirent en pièces
  rationale: L’expression signifie littéralement « ayant fait des membres » et décrit un démembrement. Le pronom pluriel s’accorde avec les « têtes » qui suivent, tout en laissant subsister l’irrégularité entre le chef singulier et les victimes apparemment plurielles.
- source_word: τὰς κεφαλάς
  choice: les têtes
  rationale: Le pluriel explicite du grec est conservé malgré sa difficulté après la mention du « chef » au singulier.
- source_word: τοῖς ἔξω
  choice: à ceux qui étaient dehors
  rationale: L’article substantivé au datif désigne des personnes se trouvant à l’extérieur, et non simplement la direction « dehors ».
