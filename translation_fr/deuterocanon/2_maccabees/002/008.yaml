translation:
  language: fr
  text: Notre Dieu est béni à tous égards[a], lui qui a livré ceux qui ont agi avec impiété.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le témoin grec fourni pour ce verset est exceptionnellement bref, et les données sources signalent une discordance majeure. La présente traduction suit ce texte attesté plutôt que de reconstituer une version plus longue à partir d’autres éditions.
    reason: textual_variant
lexical_decisions:
- source_word: κατὰ πάντα
  choice: en toutes choses
  rationale: Cette expression donne à la formule de bénédiction une portée globale. « En toutes choses » reste proche du grec tout en étant naturel dans un registre doxologique français.
- source_word: εὐλογητὸς
  choice: Béni
  rationale: Adjectif prédicatif courant dans les formules de louange. « Béni » conserve le registre liturgique et théologique, contrairement à « loué », qui mettrait davantage l'accent sur l'action de louer.
- source_word: ὁ θεός
  choice: Dieu
  rationale: Traduction directe du sujet grec articulé ; le français omet naturellement l'article dans la tournure possessive « notre Dieu ».
- source_word: ἔδωκεν
  choice: a livré
  rationale: Avec des personnes comme complément direct, le simple « a donné » serait obscur. « A livré » exprime naturellement la remise de personnes au jugement ou au pouvoir d'autrui sans préciser ce que le grec laisse implicite.
- source_word: τοὺς ἀσεβήσαντας
  choice: ceux qui avaient agi avec impiété
  rationale: Le participe aoriste de ἀσεβέω désigne des personnes ayant commis des actes impies. Cette formulation conserve la valeur verbale et la dimension religieuse du terme sans réduire celui-ci à une qualité permanente.
theological_decisions:
- issue: Intégrité du texte source et décalage contextuel
  choice: Traduire le court texte grec fourni comme une déclaration doxologique qui se termine par le jugement de ceux qui ont agi avec impiété, tout en signalant l'importante discordance textuelle.
  alternative: Adopter ou reconstituer une leçon plus longue attestée par d'autres éditions ou manuscrits afin de correspondre au contexte habituel de 2 Maccabées 2.8.
  rationale: Le témoin grec fourni est très bref et paraît abrupt dans ce contexte. La traduction suit néanmoins les mots transmis dans la source indiquée, sans compléter le verset à partir de témoins secondaires ; la note préserve ouvertement l'incertitude.
translation_notes:
  register: Français international moderne, digne et accessible. La formule « Béni en toutes choses soit notre Dieu » garde une tonalité doxologique ; « agir avec impiété » restitue la dimension religieuse du grec sans employer un vocabulaire confessionnel spécialisé.
