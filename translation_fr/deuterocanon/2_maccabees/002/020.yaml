  text: Plante ton peuple dans ton lieu saint[b][a], comme Moïse l’a dit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec fourni pour ce verset semble ne pas correspondre au contexte attendu de 2 Maccabées 2.20. La traduction suit donc directement le texte grec transmis, sans tenter de reconstruire une autre leçon.
