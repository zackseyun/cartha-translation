lexical_decisions:
- source_word: καταφύτευσον
  choice: Établis
  rationale: Aoriste impératif de καταφυτεύω. Le verbe évoque littéralement l’action de planter, avec l’idée d’implanter solidement. « Établis » est naturel en français dans cette prière, tandis qu’une note conserve la métaphore.
- source_word: τὸν λαόν σου
  choice: ton peuple
  rationale: λαός désigne ici un peuple comme collectivité. « Ton peuple » est la formulation française la plus directe et garde la relation exprimée par le possessif.
- source_word: εἰς τὸν τόπον τὸν ἅγιόν σου
  choice: dans ton lieu saint
  rationale: εἰς marque le mouvement vers ou l’installation dans un lieu; après « établis », « dans » est idiomatique. τόπος signifie « lieu », et ἅγιος le qualifie de saint; traduire par « terre » ajouterait une précision absente du grec.
- source_word: καθὼς εἶπεν
  choice: comme … l’a dit
  rationale: Rend simplement la comparaison καθὼς et l’aoriste de λέγω dans un français moderne et naturel. Le pronom « l’ » reprend le contenu de la parole sans en préciser davantage la nature.
- source_word: Μωσῆς
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom propre.
theological_decisions:
- issue: Intégrité du texte source et décalage contextuel
  choice: Traduire la proposition grecque fournie telle quelle, comme une demande autonome, sans lui importer le contexte attendu de 2 Maccabées 2.20.
  alternative: Reconstruire un autre texte à partir du contexte ou d’éditions secondaires.
  rationale: Le grec fourni ne correspond apparemment pas au contenu habituellement attendu à cette référence. La priorité accordée au texte source impose de traduire la leçon transmise et de signaler honnêtement l’anomalie plutôt que de la corriger tacitement.
- issue: Métaphore de la plantation
  choice: Employer « Établis » dans le texte et donner « Plante » en note.
  alternative: Traduire directement « Plante ton peuple ».
  rationale: Le grec conserve une image de plantation qui peut aussi exprimer une implantation ferme. « Établis » évite en français une tournure potentiellement déroutante tout en maintenant l’image comme possibilité explicite en note.
translation_notes:
  register: Français international moderne, digne et accessible. Tutoiement conservé dans l’adresse à Dieu. La formulation reste concise et proche de la syntaxe grecque, tout en évitant une littéralité peu naturelle.
