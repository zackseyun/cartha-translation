  text: And it was also made clear that[a], as one having wisdom[b], he offered a sacrifice for the dedication and completion of the sanctuary.
translation:
  language: fr
  text: Il était aussi précisé comment, en homme sage, il avait offert un sacrifice pour la dédicace[a] et l’achèvement[b] du sanctuaire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nouvelle dédicace » ; le contexte historique peut suggérer une dédicace renouvelée, mais le grec dit simplement « dédicace ».
    reason: lexical_alternative
  - marker: b
    text: Ou « consécration du sanctuaire » ; dans un contexte cultuel, le terme grec peut désigner l’accomplissement qui rend une chose pleinement consacrée.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεσαφείτο
  choice: il était aussi expliqué clairement
  rationale: L’imparfait passif de διασαφέω indique qu’un fait était exposé ou expliqué avec clarté. Cette formulation française conserve à la fois la valeur explicative et l’aspect imperfectif.
- source_word: ὡς σοφίαν ἔχων
  choice: comment, en homme plein de sagesse
  rationale: Après un verbe d’explication, ὡς peut introduire le contenu exposé (« comment »), tandis que σοφίαν ἔχων décrit le sujet comme possédant la sagesse. La tournure française est naturelle sans imposer une relation strictement causale.
- source_word: ἀνήνεγκεν
  choice: il avait offert
  rationale: Dans un contexte sacrificiel, ἀναφέρω signifie couramment « offrir ». Le plus-que-parfait français marque l’antériorité de l’offrande par rapport à l’explication.
- source_word: θυσίαν
  choice: un sacrifice
  rationale: Équivalent français usuel de θυσία dans un contexte cultuel.
- source_word: ἐγκαινισμοῦ
  choice: pour la dédicace
  rationale: Le génitif caractérise la destination ou la nature du sacrifice. « Dédicace » traduit le terme sans ajouter explicitement l’idée historique d’une nouvelle dédicace.
- source_word: τελειώσεως
  choice: l’achèvement
  rationale: Le mot désigne l’action de mener quelque chose à son accomplissement et peut aussi recevoir une nuance cultuelle. « Achèvement » garde son sens lexical général, la nuance de consécration étant signalée en note.
- source_word: τοῦ ἱεροῦ
  choice: du sanctuaire
  rationale: ἱερόν désigne ici le lieu sacré ou l’ensemble du sanctuaire. « Sanctuaire » convient au contexte sans réduire nécessairement le terme au seul bâtiment du Temple.
theological_decisions:
- issue: Nuance cultuelle de τελειώσεως appliqué au sanctuaire
  choice: achèvement
  alternative: consécration
  rationale: Le terme peut évoquer l’accomplissement cultuel par lequel le sanctuaire est pleinement consacré. Le texte principal conserve toutefois le sens lexical plus large et laisse l’autre possibilité en note.
- issue: Portée historique de ἐγκαινισμοῦ
  choice: dédicace
  alternative: nouvelle dédicace
  rationale: Le contexte peut suggérer une restauration suivie d’une nouvelle dédicace, mais le mot grec n’exprime pas à lui seul l’élément de répétition.
- issue: Valeur de ὡς dans la proposition rapportée
  choice: comment, en homme plein de sagesse
  alternative: que, parce qu’il possédait la sagesse
  rationale: La construction après διεσαφείτο permet de comprendre ὡς comme introduisant la manière dont l’acte fut accompli. Cette lecture évite de transformer sans nécessité le participe en cause explicite.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve la structure explicative du grec tout en évitant les tournures participiales trop lourdes. Les marqueurs de notes sont placés directement après les termes auxquels ils se rapportent.
