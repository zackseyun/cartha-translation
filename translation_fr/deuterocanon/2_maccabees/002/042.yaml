lexical_decisions:
- source_word: ἐὰν ... χρείαν ἔχητε
  choice: si vous en avez besoin
  rationale: L’expression χρείαν ἔχειν signifie « avoir besoin ». Le pronom « en » reprend naturellement en français les objets évoqués dans le contexte et implicites en grec.
- source_word: οὖν
  choice: donc
  rationale: οὖν introduit ici une conséquence ou une transition. « Donc » en conserve la force tout en restant naturel dans une lettre.
- source_word: τοὺς ἀποκομιούντας
  choice: ceux qui vous les apporteront
  rationale: Le participe désigne les personnes qui transporteront ou remettront les objets aux destinataires. Le futur français rend naturellement la valeur prospective du participe après l’impératif; « les » explicite l’objet sous-entendu en grec.
- source_word: ὑμῖν
  choice: vous
  rationale: Le datif désigne les destinataires auxquels les objets seront apportés; il est intégré naturellement au verbe français « apporter ».
- source_word: ἀποστείλατε
  choice: envoyez
  rationale: L’impératif aoriste demande une action précise; « envoyez » est le correspondant français direct et courant.
- source_word: ἐὰν οὖν ἐὰν
  choice: si donc
  rationale: Le texte transmis répète ἐὰν. La traduction donne une seule fois la condition afin de restituer le sens intelligible, tout en signalant cette irrégularité textuelle en note.
