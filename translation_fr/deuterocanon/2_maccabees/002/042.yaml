translation:
  language: fr
  text: Si donc[a] vous en avez besoin, envoyez ceux qui vous les apporteront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec répète le mot « si » (ἐὰν… ἐὰν), probablement en raison d’une irrégularité de transmission ou d’une répétition accidentelle. La traduction exprime le sens attendu.
