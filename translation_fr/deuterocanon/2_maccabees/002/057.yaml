  text: But to go into detail[a], and to make a discourse into a full walk-through, and to be overly occupied with the particulars, belongs to the originator of the history;
translation:
  language: fr
  text: Quant à entrer dans les détails[a], à développer longuement l’exposé et à s’attarder sur les points particuliers, cela incombait à l’auteur à l’origine de l’histoire ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « entrer plus avant et faire une promenade dans le discours ». Le grec emploie des images expressives pour évoquer un traitement plus approfondi et plus ample.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβατείνειν
  choice: approfondir le sujet
  rationale: Le verbe évoque littéralement le fait d’entrer ou de s’avancer dans quelque chose. Dans ce contexte rhétorique, il désigne un traitement plus poussé du sujet.
- source_word: περίπατον ποιεῖσθαι λόγῳ
  choice: développer longuement l’exposé
  rationale: L’expression signifie littéralement « faire une promenade par le discours ». La traduction exprime naturellement l’idée d’un développement ample, tandis que la note conserve l’image grecque.
- source_word: πολυπραγμονεῖν ἐν τοῖς κατὰ μέρος
  choice: s’attarder sur chaque détail
  rationale: Le verbe suggère une attention poussée, voire excessive, accordée aux éléments particuliers. « S’attarder » maintient cette nuance sans évoquer à tort l’ingérence dans les affaires d’autrui.
- source_word: τῷ τῆς ἱστορίας ἀρχηγενέτῃ
  choice: à l’auteur premier de l’histoire
  rationale: Le terme rare ἀρχηγενέτης désigne celui qui est à l’origine de l’ouvrage. « Auteur premier » le distingue de l’abréviateur qui parle ici.
- source_word: καθῆκε
  choice: cela revenait
  rationale: Le verbe indique ce qui convient à quelqu’un ou relève de sa tâche. L’imparfait français convient au partage des rôles décrit dans ce passage.
