base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/056.yaml
  text: For just as[a], in the case of a new house, the architect must take thought for the whole foundation, but the one undertaking to decorate and paint it must examine the things suitable for adornment, so also, I think, it is with us.
translation:
  language: fr
  text: En effet, de même que, pour une maison neuve, l’architecte doit veiller à l’ensemble des fondations, tandis que celui qui entreprend de l’aménager[a] et de la peindre doit examiner ce qui convient à son ornementation, de même, me semble-t-il, en va-t-il pour nous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la décorer »; le verbe grec peut désigner l’aménagement ou la préparation d’une maison, et pas seulement son ornementation.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: En effet, de même que
  rationale: Cette formulation conserve à la fois la valeur explicative de γάρ et l’introduction naturelle de la comparaison par καθάπερ.
- source_word: τῆς καινῆς οἰκίας
  choice: pour une maison neuve
  rationale: « Maison neuve » est concret et naturel en français dans ce contexte de construction et d’ornementation.
- source_word: ἀρχιτέκτονι
  choice: l’architecte
  rationale: Le terme désigne le maître responsable de la conception et de la construction; « architecte » en préserve la fonction technique.
- source_word: τῆς ὅλης καταβολῆς
  choice: à l’ensemble des fondations
  rationale: καταβολή évoque ici la pose ou l’assise fondamentale de l’édifice. Le pluriel français « fondations » est idiomatique tout en conservant l’image du travail de base dans sa totalité.
- source_word: φροντιστέον
  choice: doit veiller à
  rationale: L’adjectif verbal exprime une nécessité; « doit veiller à » rend l’attention responsable requise sans lourdeur.
- source_word: ἐγκαινίζειν
  choice: l’aménager
  rationale: Dans son association avec « peindre » et avec l’ornementation de la maison, le verbe renvoie vraisemblablement à sa mise en état ou à son aménagement plutôt qu’à une dédicace cérémonielle. Une note signale l’autre nuance possible.
- source_word: ζωγραφεῖν
  choice: la peindre
  rationale: Dans ce contexte domestique, « peindre » rend naturellement l’action d’orner par la peinture.
- source_word: τὰ ἐπιτήδεια πρὸς διακόσμησιν
  choice: ce qui convient à son ornementation
  rationale: Cette expression garde ouvert le contenu de τὰ ἐπιτήδεια, sans le limiter à des matériaux précis, et rend la finalité décorative de διακόσμησις.
- source_word: ἐξεταστέον
  choice: doit examiner
  rationale: Le second adjectif verbal exprime lui aussi l’obligation et implique un examen attentif.
- source_word: οὕτως δοκῶ καὶ ἐπὶ ἡμῶν
  choice: de même, me semble-t-il, en va-t-il pour nous
  rationale: La formulation conserve l’application de la comparaison et la réserve personnelle exprimée par δοκῶ.
