  yaml_path: translation/deuterocanon/2_maccabees/002/014.yaml
  text: And the priests made prayer when the sacrifice had been consumed[a], both the priests and all the others, with Jonathan beginning and the rest responding[b], as in Nehemiah.
translation:
  language: fr
  text: Les prêtres prièrent tandis que le sacrifice se consumait ; les prêtres et tous les autres y prirent part, Jonathan commençant et les autres répondant, comme le faisait Néhémie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est elliptique : « comme de Néhémie ». La formule peut aussi se comprendre : « à la manière de Néhémie » ou « comme dans la prière de Néhémie ».'
    reason: alternative_reading
lexical_decisions:
- source_word: προσευχὴν δὲ ἐποιήσαντο
  choice: prononcèrent une prière
  rationale: L’expression grecque signifie littéralement « firent une prière ». « Prononcèrent une prière » restitue naturellement en français l’acte de prier à voix haute indiqué par la suite du verset.
- source_word: δαπανωμένης τῆς θυσίας
  choice: pendant que le sacrifice se consumait
  rationale: 'Le participe présent au génitif décrit une action en cours et concomitante : le sacrifice était en train d’être consumé, vraisemblablement par le feu.'
- source_word: οἵ τε ἱερεῖς καὶ πάντες
  choice: les prêtres et tous les autres y prirent part
  rationale: Le grec répète « les prêtres » de manière maladroite après les avoir déjà nommés. Cette formulation conserve l’insistance sur leur participation tout en rendant explicite et naturelle l’inclusion de toute l’assemblée.
- source_word: καταρχομένου Ἰωνάθον
  choice: Jonathan commençant
  rationale: κατάρχομαι indique ici que Jonathan entame ou dirige la récitation. « Commençant » reste proche du grec sans préciser indûment la forme liturgique.
- source_word: τῶν τε λοιπῶν ἐπιφωνούντων
  choice: les autres répondant à haute voix
  rationale: ἐπιφωνέω évoque une intervention vocale, probablement une réponse collective. La traduction conserve cette dimension sans imposer l’idée plus précise d’un chant antiphoné.
- source_word: ὡς Νεεμίου
  choice: comme au temps de Néhémie
  rationale: La formule grecque est elliptique et textuellement difficile. Cette traduction fournit un sens français possible sans identifier avec certitude une prière particulière de Néhémie; l’ambiguïté est signalée en note.
theological_decisions:
- issue: Sens de la formule elliptique ὡς Νεεμίου
  choice: comme au temps de Néhémie
  alternative: comme Néhémie l’avait fait ; comme dans la prière de Néhémie ; à la manière de Néhémie
  rationale: Le génitif Νεεμίου dépend d’un élément sous-entendu et le grec ne précise ni « prière » ni « temps ». Le texte principal adopte une formulation intelligible, tandis que la note préserve les principales possibilités sans transformer l’allusion en affirmation certaine.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation clarifie la structure grecque répétitive. Le texte conserve la participation distincte de Jonathan et de l’assemblée ainsi que l’ambiguïté de l’allusion finale grâce à une note.
