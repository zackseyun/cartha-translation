translation:
  language: fr
  text: laissant à l’auteur le soin de traiter chaque sujet avec précision[a], tandis que nous nous appliquons à suivre les grandes lignes de l’abrégé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « laissant à l’auteur le soin d’examiner exactement chaque point […] et nous efforçant de suivre le tracé de l’abrégé ». Le grec emploie des termes littéraires qui opposent l’ouvrage complet à sa forme abrégée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διακριβοῦν
  choice: traiter […] avec précision
  rationale: L’infinitif substantivé désigne ici le travail détaillé et rigoureux propre à l’ouvrage complet. Cette formulation conserve à la fois l’idée de précision et celle de traitement littéraire.
- source_word: περὶ ἑκάστων
  choice: chaque sujet
  rationale: Le pluriel distributif renvoie aux différents éléments de l’histoire développée. « Chaque sujet » est naturel en français et demeure suffisamment large.
- source_word: τῷ συγγραφεῖ
  choice: à l’auteur
  rationale: Le terme désigne celui qui a composé l’ouvrage historique plus étendu, par contraste avec l’abréviateur.
- source_word: παραχωρήσαντες
  choice: laissant […] le soin
  rationale: Le participe exprime le fait de réserver ou de céder à l’auteur de l’œuvre complète la tâche du traitement approfondi.
- source_word: ἐπιπορεύεσθαι
  choice: suivre
  rationale: Avec ὑπογραμμοῖς, le verbe évoque le fait d’avancer en suivant des lignes directrices.
- source_word: ὑπογραμμοῖς
  choice: les grandes lignes
  rationale: Dans ce contexte littéraire, le mot désigne un tracé directeur ou une esquisse. « Grandes lignes » rend clairement l’image d’une structure condensée.
- source_word: ἐπιτομῆς
  choice: de l’abrégé
  rationale: Le terme technique désigne la réduction d’un ouvrage plus long. « Abrégé » est courant, précis et adapté au registre littéraire français.
- source_word: σπουδάζοντες
  choice: nous nous appliquons
  rationale: Le participe marque un effort diligent et soutenu, davantage qu’un simple désir.
