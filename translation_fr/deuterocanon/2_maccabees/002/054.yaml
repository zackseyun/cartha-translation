revisions:
- from: Car, tout comme il n’est pas facile de préparer un banquet[a], ni même de rechercher le bien d’autrui, nous supporterons néanmoins volontiers cette peine, afin de recevoir la reconnaissance du grand nombre[b].
  to: Car, de même qu’il n’est pas facile à celui qui prépare un banquet[a], ou encore à celui qui cherche à procurer un avantage à autrui, nous supporterons pourtant volontiers cette peine à cause de la reconnaissance du grand nombre[b].
  rationale: La révision élimine l’ajout de finalité (« afin de recevoir ») et rend διά par « à cause de », conformément à la relation causale ou motivante exprimée par le grec. Elle rend également explicite, dans une syntaxe française naturelle, que « préparer un banquet » et « chercher l’avantage d’autrui » qualifient les personnes auxquelles la difficulté est rapportée. Les deux appels de note et leurs textes sont conservés, avec une note b légèrement resserrée pour ne pas identifier comme explicitement des « lecteurs » des personnes que le verset désigne seulement comme « les nombreux ».
