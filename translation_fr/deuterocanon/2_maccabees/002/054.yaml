  yaml_path: translation/deuterocanon/2_maccabees/002/054.yaml
  text: For just as it is not easy for one who prepares a banquet[a], or even seeks the benefit of others, yet for the gratitude of the many we will gladly endure the hardship[b];
translation:
  language: fr
  text: Car, de même qu’il n’est pas facile à celui qui prépare un banquet[a], ou encore à celui qui cherche à procurer un avantage à autrui, nous supporterons pourtant volontiers cette peine à cause de la reconnaissance du grand nombre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un festin » ; le terme grec peut désigner un banquet ou un repas festif pris en commun.
    reason: lexical_alternative
  - marker: b
    text: La « reconnaissance du grand nombre » désigne ici les remerciements ou l’appréciation de nombreuses personnes, et non un terme sacramentel technique.
    reason: cultural_note
lexical_decisions:
- source_word: καθάπερ
  choice: Car, tout comme
  rationale: Conserve à la fois la valeur explicative du lien et l’introduction de la comparaison.
- source_word: τῷ παρασκευάζοντι συμπόσιον
  choice: de préparer un banquet
  rationale: Le datif avec οὐκ εὐχερές désigne la personne pour qui la tâche est difficile; la tournure impersonnelle française est naturelle. συμπόσιον évoque ici un banquet ou festin.
- source_word: ζητοῦντι τὴν ἑτέρων ὠφέλειαν
  choice: de rechercher le bien d’autrui
  rationale: ὠφέλεια désigne l’avantage ou le bien procuré; «le bien d’autrui» est clair, actuel et conserve la visée altruiste.
- source_word: οὐκ εὐχερές
  choice: il n’est pas facile
  rationale: Rend directement l’expression grecque de la difficulté.
- source_word: ὅμως
  choice: néanmoins
  rationale: Marque nettement la concession entre la difficulté reconnue et la résolution de poursuivre.
- source_word: διὰ τὴν τῶν πολλῶν εὐχαριστίαν
  choice: afin de recevoir la reconnaissance du grand nombre
  rationale: Dans ce contexte, εὐχαριστία renvoie à la gratitude ou à la reconnaissance des lecteurs. La formulation française explicite naturellement la relation visée par διά sans donner au mot un sens sacramentel.
- source_word: ἡδέως
  choice: volontiers
  rationale: Exprime la disposition consentante avec laquelle l’auteur accepte la peine.
- source_word: τὴν κακοπάθειαν
  choice: cette peine
  rationale: Désigne ici le labeur pénible de la rédaction; «peine» évite de suggérer une persécution ou une souffrance extrême.
- source_word: ὑποίσομεν
  choice: nous supporterons
  rationale: Le futur exprime une résolution; «supporter» convient à une peine ou à un labeur difficile.
theological_decisions:
- issue: Sens de εὐχαριστία
  choice: reconnaissance ordinaire des nombreux lecteurs
  alternative: action de grâce au sens général, ou lecture sacramentelle ultérieure
  rationale: Le contexte est celui du travail littéraire entrepris pour l’utilité des lecteurs; rien n’indique un emploi liturgique ou sacramentel technique.
translation_notes:
  register: Français international moderne, digne et accessible. La longue période grecque et son contraste sont conservés, avec une syntaxe française fluide. Les marqueurs [a] et [b] figurent tous deux dans le texte.
