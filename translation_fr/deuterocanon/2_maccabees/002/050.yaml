  text: what has been set forth by Jason of Cyrene in five books[a], we will attempt to abridge in one volume.
translation:
  language: fr
  text: Ce que Jason de Cyrène a exposé en cinq livres, nous tenterons de le condenser en un seul ouvrage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’en faire un abrégé ». Le verbe grec désigne la réduction d’un écrit plus développé en une version plus courte.
    reason: lexical_alternative
lexical_decisions:
- source_word: δηλωθέντα
  choice: a exposé
  rationale: Le participe désigne ici les faits ou éléments présentés par Jason dans son œuvre. « A exposé » convient au contexte littéraire sans imposer le sens plus étroit de « rendre clair ».
- source_word: διὰ πέντε βιβλίων
  choice: en cinq livres
  rationale: Avec le génitif, διά indique ici le cadre ou le support littéraire de l’exposé. « En cinq livres » est l’expression française naturelle.
- source_word: πειρασόμεθα
  choice: nous tenterons
  rationale: Le futur moyen exprime une entreprise formulée avec modestie. « Nous tenterons » conserve cette nuance.
- source_word: διʼ ἑνὸς συντάγματος
  choice: en un seul ouvrage
  rationale: σύνταγμα désigne une composition écrite organisée. « Un seul ouvrage » rend naturellement le contraste avec les cinq livres sans suggérer nécessairement un volume matériel.
- source_word: ἐπιτεμεῖν
  choice: le condenser
  rationale: Le verbe signifie réduire une œuvre plus longue en une version abrégée. « Condenser » est précis et immédiatement compréhensible en français moderne.
- source_word: ὑπὸ Ἰάσονος τοῦ Κυρηναίου
  choice: Jason de Cyrène
  rationale: La tournure rend naturellement le nom et l’origine géographique indiquée par Κυρηναῖος.
