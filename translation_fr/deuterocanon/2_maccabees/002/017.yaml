  text: Accept the sacrifice for all your people Israel[b][a], and preserve your portion and sanctify it.
translation:
  language: fr
  text: Accepte le sacrifice en faveur de tout ton peuple Israël[a], préserve ta part[b] et sanctifie-la.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Reçois l’offrande en faveur de tout ton peuple Israël ».'
    reason: lexical_alternative
  - marker: b
    text: '« Ta part » désigne probablement Israël en tant que peuple appartenant à Dieu ; autre traduction possible : « ton héritage ».'
    reason: alternative_reading
lexical_decisions:
- source_word: πρόσδεξαι
  choice: Accepte
  rationale: Dans cette prière, l’impératif demande à Dieu d’accueillir favorablement le sacrifice. « Accepte » exprime naturellement cette idée en français.
- source_word: θυσίαν
  choice: le sacrifice
  rationale: Le terme grec désigne une offrande sacrificielle; « sacrifice » en conserve la portée cultuelle.
- source_word: ὑπὲρ παντὸς τοῦ λαοῦ σου Ἰσραήλ
  choice: offert pour l’ensemble de ton peuple Israël
  rationale: ὑπέρ avec le génitif exprime ici le bénéfice ou la représentation. « L’ensemble de » rend la totalité indiquée par παντός sans alourdir la phrase.
- source_word: διαφύλαξον
  choice: préserve
  rationale: Le verbe signifie garder en sûreté, protéger ou préserver. « Préserve » convient au registre de la prière.
- source_word: τὴν μερίδα σου
  choice: ta part
  rationale: La traduction maintient la métaphore de la portion appartenant à Dieu sans préciser explicitement son référent.
- source_word: καθαγίασον
  choice: sanctifie-la
  rationale: Le verbe signifie rendre saint ou consacrer. Le pronom féminin reprend naturellement « ta part », objet singulier précédent.
theological_decisions:
- issue: Référent de « ta part »
  choice: Conserver la métaphore « ta part », probablement appliquée à Israël.
  alternative: ton héritage; le peuple qui t’appartient
  rationale: Le grec ne développe pas la métaphore. La conserver maintient l’écho d’appartenance à Dieu sans imposer une interprétation théologique plus précise.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond à l’adresse directe à Dieu. La formulation conserve le vocabulaire sacrificiel et la métaphore de la « part » sans en résoudre le référent dans le corps du texte.
