  yaml_path: translation/deuterocanon/2_maccabees/002/046.yaml
  text: The matters concerning Judas Maccabeus and his brothers[a], and the purification of the greatest sanctuary, and the dedication of the altar,
translation:
  language: fr
  text: Les faits concernant Judas Maccabée et ses frères, la purification du plus grand sanctuaire et la dédicace de l’autel[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « redédicace de l’autel ». Le grec dit « dédicace », mais le contexte historique est celui de la restauration de l’autel après sa profanation.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὰ … κατὰ τὸν Ἰούδαν
  choice: Les faits concernant Judas
  rationale: Le neutre pluriel avec κατά et l’accusatif introduit ce qui concerne Judas. « Les faits concernant » reste assez large sans réduire le propos à ses seuls exploits.
- source_word: Ἰούδαν τὸν Μακκαβαῖον
  choice: Judas Maccabée
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom et du surnom.
- source_word: τοὺς τούτου ἀδελφούς
  choice: ses frères
  rationale: Le terme désigne ici les frères de Judas au sens familial.
- source_word: τοῦ ἱεροῦ τοῦ μεγίστου
  choice: du plus grand sanctuaire
  rationale: ἱερόν désigne le sanctuaire ou l’ensemble du Temple; « sanctuaire » suit de près le grec, tandis que le superlatif μεγίστου est conservé sans le transformer en « très saint ».
- source_word: καθαρισμόν
  choice: purification
  rationale: Le mot exprime ici la purification rituelle du sanctuaire après sa profanation.
- source_word: βωμοῦ
  choice: autel
  rationale: Équivalent français normal de βωμός dans un contexte sacrificiel.
- source_word: ἐγκαινισμόν
  choice: dédicace
  rationale: Le nom grec désigne une inauguration ou une dédicace et n’exprime pas explicitement la répétition; la restauration historique justifie toutefois de signaler « redédicace » en note.
theological_decisions:
- issue: Portée de ἱερόν dans le contexte cultuel juif
  choice: sanctuaire
  alternative: Temple
  rationale: « Sanctuaire » reflète directement le terme grec et son caractère sacré sans déterminer plus précisément qu’il ne le fait la partie ou l’ensemble du complexe du Temple.
- issue: Dédicace ou redédicace de l’autel
  choice: dédicace
  alternative: redédicace
  rationale: Le texte grec dit « dédicace » sans élément lexical signifiant « de nouveau »; « redédicace » explicite correctement le contexte historique, mais va au-delà de la forme du mot.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure nominale et la virgule finale sont conservées parce que le verset fourni constitue le début d’une phrase qui se poursuit.
