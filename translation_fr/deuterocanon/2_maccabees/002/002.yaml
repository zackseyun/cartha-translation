  text: Having been saved by God from great dangers[a], we give him great thanks, as if arrayed against a king.
translation:
  language: fr
  text: Dieu nous ayant sauvés de grands dangers, nous le remercions vivement, comme si nous étions rangés en bataille contre un roi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme des hommes rangés en bataille contre un roi ». En grec, la comparaison finale est condensée et sa nuance militaire peut se rendre de plusieurs manières proches.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ μεγάλων κινδύνων
  choice: de grands dangers
  rationale: Le pluriel κινδύνων désigne des dangers ou des périls; cette formulation est claire et conserve le mouvement de délivrance exprimé par ἐκ.
- source_word: ὑπὸ τοῦ θεοῦ σεσωσμένοι
  choice: Dieu nous ayant sauvés
  rationale: 'La tournure rend l’agent exprimé par ὑπό et la valeur du participe parfait passif: le salut est accompli et ses effets demeurent.'
- source_word: μεγάλως εὐχαριστοῦμεν αὐτῷ
  choice: nous le remercions vivement
  rationale: « Vivement » restitue l’intensification portée par μεγάλως dans un français naturel, tandis que le pronom renvoie clairement à Dieu.
- source_word: ὡς ἂν
  choice: comme si
  rationale: La locution introduit ici une comparaison à nuance hypothétique; « comme si » en conserve le caractère sans transformer la comparaison en affirmation directe.
- source_word: πρὸς βασιλέα παρατασσόμενοι
  choice: nous étions rangés en bataille contre un roi
  rationale: παρατάσσω évoque la mise en ordre de bataille et πρός prend naturellement une valeur adversative dans ce contexte militaire.
theological_decisions:
- issue: Sens de la comparaison militaire finale
  choice: comme si nous étions rangés en bataille contre un roi
  alternative: comme des hommes rangés en bataille contre un roi
  rationale: Le texte grec présente une comparaison militaire condensée. La traduction principale conserve à la fois son caractère comparatif et son orientation adversative, sans préciser davantage le rapport entre l’action de grâce et l’affrontement.
translation_notes:
  register: Français international moderne, naturel et digne. La proposition participiale initiale conserve le lien logique du grec, tandis que « rangés en bataille » maintient son image militaire sans archaïsme excessif.
