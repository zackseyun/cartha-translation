  yaml_path: translation/deuterocanon/2_maccabees/002/032.yaml
  text: So then[a], let us begin the narrative from this point, adding only this much to what has been said before; for it is foolish to be excessive before the history and to abridge the history itself.
translation:
  language: fr
  text: 'Commençons donc le récit à partir d’ici, en ajoutant seulement ceci à ce qui précède : il serait insensé de s’étendre démesurément avant l’histoire[a] et d’abréger l’histoire elle-même.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le compte rendu » ou « le récit historique ». Le grec ἱστορία peut désigner une enquête, un compte rendu ou un récit historique, sans correspondre exactement au sens universitaire moderne du mot « histoire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐντεῦθεν οὖν
  choice: donc ici
  rationale: Rend à la fois la transition marquée par οὖν et le point de départ discursif exprimé par Ἐντεῦθεν, dans un français naturel.
- source_word: ἀρξώμεθα τῆς διηγήσεως
  choice: Commençons… le récit
  rationale: Le subjonctif exhortatif à la première personne du pluriel appelle « Commençons » ; « récit » convient au compte rendu écrit désigné par διήγησις.
- source_word: τοῖς προειρημένοις τοσοῦτον ἐπιζεύξαντες
  choice: en ajoutant seulement ceci à ce qui précède
  rationale: Exprime l’ajout limité d’une dernière remarque aux propos déjà formulés ; « seulement » explicite la portée restrictive contextuelle de τοσοῦτον.
- source_word: εὔηθες
  choice: insensé
  rationale: Dans ce contexte de méthode littéraire, le terme qualifie un manque de jugement ; « insensé » est clair, digne et suffisamment fort.
- source_word: τὸ μὲν πρὸ τῆς ἱστορίας πλεονάζειν
  choice: s’attarder longuement avant le récit historique
  rationale: πλεονάζειν indique ici que le préambule dépasse la juste mesure. Cette formulation idiomatique conserve le contraste avec l’abrègement du récit proprement dit.
- source_word: τὴν δὲ ἱστορίαν ἐπιτέμνειν
  choice: puis d’abréger le récit lui-même
  rationale: « Abréger » rend précisément l’idée de raccourcir ou retrancher ; « lui-même » souligne l’opposition entre le préambule développé et le corps du récit écourté.
