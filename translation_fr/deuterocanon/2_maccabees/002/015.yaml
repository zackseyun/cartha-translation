base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/015.yaml
  text: 'And the prayer had this form: “Lord God[a], creator of all things, the fearful and mighty and righteous and merciful one[c][b], the only king and good one,”'
translation:
  language: fr
  text: 'La prière était formulée ainsi : « Seigneur Dieu, créateur de toutes choses, toi qui inspires la crainte[a], qui es puissant, juste[b] et miséricordieux, toi, le seul roi, toi qui es bon[c], »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toi qui es redoutable ». Le grec désigne celui qui inspire la crainte ou un profond respect.
    reason: lexical_alternative
  - marker: b
    text: Ou « droit ».
    reason: lexical_alternative
  - marker: c
    text: Ou « bienveillant » ou « plein de bonté ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ ἡ προσευχὴ τὸν τρόπον ἔχουσα τοῦτον
  choice: La prière était formulée ainsi
  rationale: Cette tournure française introduit naturellement le contenu de la prière tout en rendant l’idée grecque selon laquelle elle « avait cette forme ».
- source_word: Κύριε ὁ θεός
  choice: Seigneur Dieu
  rationale: Il s’agit d’une adresse directe à Dieu. « Seigneur Dieu » est naturel en français biblique moderne et conserve le titre divin κύριος.
- source_word: ὁ πάντων κτίστης
  choice: créateur de toutes choses
  rationale: κτίστης désigne le créateur ou fondateur, et πάντων donne ici une portée universelle.
- source_word: ὁ φοβερὸς
  choice: toi qui inspires la crainte
  rationale: φοβερός qualifie celui qui suscite la crainte ou l’effroi respectueux. Cette formulation évite que « redoutable » soit compris seulement comme une menace.
- source_word: ὁ ἰσχυρὸς
  choice: qui es puissant
  rationale: ἰσχυρός exprime la force et la puissance; « puissant » convient naturellement à un attribut divin.
- source_word: δίκαιος
  choice: juste
  rationale: En français actuel, « juste » exprime clairement la rectitude morale et judiciaire de Dieu sans imposer une précision étrangère au grec.
- source_word: ἐλεήμων
  choice: miséricordieux
  rationale: Le mot désigne celui qui fait miséricorde; « miséricordieux » en est l’équivalent direct et traditionnel.
- source_word: ὁ μόνος βασιλεὺς
  choice: toi, le seul roi
  rationale: μόνος porte sur βασιλεύς et souligne l’unicité de la royauté; la reprise de « toi » restitue naturellement la valeur substantivée de l’article grec.
- source_word: χρηστός
  choice: toi qui es bon
  rationale: χρηστός peut signifier bon, bienveillant ou plein de bonté. « Bon » conserve l’amplitude du terme, tandis que la tournure avec « toi » rend son emploi substantivé sans produire le français artificiel « le bon ».
theological_decisions:
- issue: Traduction de κύριος dans l’adresse divine
  choice: Seigneur
  alternative: Maître
  rationale: Dans cette prière, κύριος est un titre divin. « Seigneur » en préserve la portée religieuse et liturgique.
- issue: Traduction de δίκαιος comme attribut divin
  choice: juste
  alternative: droit
  rationale: « Juste » conserve à la fois la rectitude morale et la dimension judiciaire possibles, sans choisir entre elles.
- issue: Portée de μόνος
  choice: le seul roi
  alternative: le seul roi et le seul bon
  rationale: La place du grec μόνος le rattache à βασιλεύς, non à χρηστός. La traduction ne l’étend donc pas au dernier attribut.
translation_notes:
  register: 'Français moderne, digne et adapté à une prière. Les reprises de « toi » rendent les articles grecs et les adjectifs substantivés sans lourdeur artificielle. Attention éditoriale : le texte grec fourni semble correspondre à 2 Maccabées 1.24 plutôt qu’à 2 Maccabées 2.15; la référence doit être vérifiée avant publication.'
