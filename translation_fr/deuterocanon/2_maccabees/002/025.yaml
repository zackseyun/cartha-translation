  text: And after enclosing it[a], the king made it a sanctuary[c][b], having tested the matter.
translation:
  language: fr
  text: Après l’avoir entouré d’une enceinte[a], le roi en fit un sanctuaire[b], après avoir examiné l’affaire.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après l’avoir clôturé » ou « après l’avoir fortifié » ; le participe grec peut évoquer une enceinte destinée à protéger le lieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « un temple » ou « un lieu saint » ; le grec ἱερόν peut désigner de manière générale un édifice ou une enceinte sacrée.
    reason: lexical_alternative
  - marker: c
    text: Le texte grec fourni pour ce verset présente une importante incertitude de correspondance avec la référence indiquée. La traduction suit directement le libellé grec transmis ici, qui devra être comparé aux éditions critiques.
    reason: textual_variant
lexical_decisions:
- source_word: περιφράξας
  choice: après l’avoir entouré d’une enceinte
  rationale: Le participe aoriste exprime une action antérieure à celle du verbe principal. « Entouré d’une enceinte » rend l’idée de clôturer ou de protéger sans préciser indûment la nature de l’ouvrage.
- source_word: ἱερὸν
  choice: un sanctuaire
  rationale: Ἱερόν peut désigner un temple, un sanctuaire ou plus largement une enceinte sacrée. « Sanctuaire » conserve cette amplitude et n’impose pas une référence au temple de Jérusalem.
- source_word: ἐποίησεν
  choice: en fit
  rationale: Le verbe ποιέω reste général et peut ici évoquer aussi bien l’aménagement que l’établissement ou la consécration. « En fit » préserve cette indétermination.
- source_word: δοκιμάσας
  choice: après avoir examiné
  rationale: Δοκιμάζω signifie mettre à l’épreuve, examiner ou vérifier. Dans ce contexte très bref, « examiner » est naturel en français et n’affirme pas explicitement un résultat favorable.
- source_word: τὸ πρᾶγμα
  choice: l’affaire
  rationale: Πρᾶγμα est un terme général pouvant désigner une chose, une question, une situation ou une affaire. « L’affaire » demeure idiomatique sans préciser ce que le contexte fourni ne précise pas.
