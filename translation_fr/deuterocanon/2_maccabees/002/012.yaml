  text: As they explained to us that they had found not fire but thick water[a], he ordered them, after drawing some out, to bring it. Then when the things for the sacrifices had been brought forward[c][b], Nehemiah ordered the priests to sprinkle the water on both the wood and what was laid upon it.
translation:
  language: fr
  text: Comme ils nous expliquèrent qu’ils n’avaient pas trouvé de feu, mais une eau épaisse[a], il leur ordonna d’en puiser et de l’apporter[b]. Lorsque ce qui était destiné aux sacrifices eut été apporté, Néhémie ordonna aux prêtres d’asperger[c] de cette eau le bois et ce qui était posé dessus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une eau dense », ou « un liquide épais ». L’expression grecque est inhabituelle et peut souligner le caractère étrange de la substance.
    reason: lexical_alternative
  - marker: b
    text: Le participe grec traduit par « en puiser » est rare et difficile. Il semble indiquer qu’ils devaient prélever une partie du liquide pour l’apporter.
    reason: textual_difficulty
  - marker: c
    text: Ou « de verser cette eau sur le bois et sur ce qui était posé dessus ».
    reason: alternative_reading
lexical_decisions:
- source_word: διεσάφησαν
  choice: ils nous expliquèrent
  rationale: Le verbe indique qu’ils ont exposé ou clarifié ce qu’ils avaient découvert. « Expliquèrent » est naturel et conserve l’idée d’une communication explicite.
- source_word: μὴ εὑρηκέναι πῦρ ἀλλὰ ὕδωρ παχύ
  choice: qu’ils n’avaient pas trouvé de feu, mais une eau épaisse
  rationale: La tournure française rend clairement le discours indirect tout en conservant l’expression grecque volontairement étrange « eau épaisse ».
- source_word: ἀποβλίψαντας
  choice: d’en puiser
  rationale: La forme est rare et difficile, mais le contexte indique qu’il faut prélever une partie du liquide afin de l’apporter. « En puiser » reste concret sans préciser excessivement le procédé.
- source_word: φέρειν
  choice: de l’apporter
  rationale: L’infinitif dépend du verbe de commandement. Le pronom reprend naturellement la quantité d’eau prélevée.
- source_word: ἀνηνέχθη τὰ τῶν θυσιῶν
  choice: ce qui était destiné aux sacrifices eut été apporté
  rationale: L’expression grecque est elliptique et désigne globalement les éléments nécessaires aux sacrifices. Cette traduction en conserve l’indétermination.
- source_word: ἐπιρᾶναι
  choice: d’asperger
  rationale: Le verbe décrit l’application du liquide sur le bois et ce qui le recouvre. « Asperger » convient au contexte sacrificiel, tandis que la possibilité d’une action plus abondante est signalée en note.
- source_word: τά τε ξύλα καὶ τὰ ἐπικείμενα
  choice: le bois et ce qui était posé dessus
  rationale: La traduction préserve la portée générale du participe substantivé et n’identifie pas plus précisément que le grec les éléments placés sur le bois.
- source_word: Νεεμίας
  choice: Néhémie
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom biblique.
theological_decisions:
- issue: Mode d’application de l’eau sur les matériaux du sacrifice
  choice: asperger de cette eau le bois et ce qui était posé dessus
  alternative: verser cette eau sur le bois et sur ce qui était posé dessus
  rationale: « Asperger » convient à la scène rituelle, mais le verbe grec peut décrire plus largement le fait de répandre ou verser un liquide. La note maintient cette latitude sans imposer une interprétation doctrinale.
- issue: Caractère inhabituel de la substance trouvée
  choice: une eau épaisse
  alternative: un liquide épais
  rationale: Le grec emploie explicitement le mot « eau » avec l’adjectif « épaisse ». Garder cette formulation insolite préserve l’étonnement et la tension du récit.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe narrative demeure soutenue sans archaïsme. Les formulations inhabituelles ou indéterminées du grec sont conservées dans le texte et explicitées brièvement en notes.
