  terminology: « Néhémie » est la forme française usuelle. « Prêtres », « sacrifices », « bois » et « asperger » conviennent au contexte sans surcharge confessionnelle. Les notes a, b et c sont bien ancrées et rendent respectivement l’alternative lexicale, la difficulté du participe ἀποβλίψαντας et l’amplitude possible de ἐπιρᾶναι.
