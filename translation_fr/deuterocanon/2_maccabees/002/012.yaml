  source_fidelity: 'Le texte français rend fidèlement la progression du grec : l’explication donnée « à nous », l’opposition frappante entre le feu absent et l’« eau épaisse », l’ordre de prélever et d’apporter le liquide, puis l’aspersion du bois et de ce qui est posé dessus. « Ce qui était destiné aux sacrifices » maintient convenablement l’ellipse de τὰ τῶν θυσιῶν sans identifier indûment les objets.'
