review_pass:
  verdict: revise
  source_fidelity: La construction grecque comporte deux propositions temporelles et un passif final sans sujet exprimé. « Se mit à briller » ajoute une nuance inchoative absente de ἀντιλάμψαντος. De plus, « elle fut consumée » oriente nécessairement le lecteur français vers un antécédent féminin saillant (la flamme ou la lumière), alors que le grec ne le nomme pas et peut renvoyer à un élément sous-entendu du contexte. Une formulation plus neutre conserve mieux cette indétermination.
  naturalness: Le français est globalement clair et de registre approprié. « Brilla » est plus direct et idiomatique que « se mit à briller » ici. « Cela fut consumé » est volontairement elliptique, mais reste lisible dans ce bref récit et, avec la note, rend honnêtement l'ellipse du grec.
  terminology: « Flamme », « autel » et « consumé » conviennent. « Fut allumée » rend explicitement le passif de ἀνήφθη sans imposer l'agent. La note conserve avec prudence la nuance possible de rayonnement en retour de ἀντιλάμπω, sans la présenter comme certaine.
  issues:
  - severity: medium
    issue: « se mit à briller » introduit un commencement de l'action.
    rationale: Le participe aoriste ἀντιλάμψαντος présente l'action de briller comme accomplie dans la circonstancielle; il ne requiert pas l'aspect inchoatif français.
  - severity: medium
    issue: Le pronom « elle » restreint l'ambiguïté du sujet sous-entendu.
    rationale: Le passif grec ἐδαπανήθη n'a pas de sujet exprimé. Le pronom féminin français le rattache nécessairement à un référent féminin, alors que l'ellipse grecque peut viser un élément contextuel non exprimé.
