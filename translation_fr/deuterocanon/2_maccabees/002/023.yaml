  yaml_path: translation/deuterocanon/2_maccabees/002/023.yaml
  text: And when this happened[a], a flame was kindled; but when the light from the altar shone forth, it was consumed.
translation:
  language: fr
  text: Quand cela se produisit, une flamme fut allumée ; mais lorsque la lumière provenant de l’autel brilla, cela fut consumé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec ne précise pas ce qui fut consumé. Il peut s’agir de la flamme ou, peut-être, de la matière qui brûlait. Le verbe rendu par « brilla » peut aussi suggérer que la lumière brillait en retour ou en réponse.
    reason: Le sujet du dernier verbe est implicite, et ἀντιλάμπω peut comporter une nuance de rayonnement en retour.
lexical_decisions:
- source_word: ὡς δὲ τοῦτο ἐγενήθη
  choice: Quand cela se produisit
  rationale: Cette tournure rend naturellement la transition temporelle et le fait qu’un événement vient de se produire.
- source_word: φλὸξ
  choice: une flamme
  rationale: Le singulier concret de φλόξ est conservé, plutôt que d’employer le terme plus général « feu ».
- source_word: ἀνήφθη
  choice: s’alluma
  rationale: Le verbe exprime l’apparition ou l’allumage de la flamme. La tournure pronominale est naturelle en français et évite le registre plus soutenu de « fut allumée ».
- source_word: ἀπὸ τοῦ θυσιαστηρίου
  choice: provenant de l’autel
  rationale: Cette formulation rattache clairement le complément à « lumière » et rend simplement l’idée d’origine.
- source_word: ἀντιλάμψαντος φωτός
  choice: lorsque la lumière … se mit à briller
  rationale: Le génitif absolu reçoit une valeur temporelle. ἀντιλάμπω peut évoquer une lumière qui brille en retour ou en réponse, mais le contexte permet aussi une expression plus générale du rayonnement; la formulation française reste naturelle sans imposer l’idée précise d’un reflet.
- source_word: ἐδαπανήθη
  choice: elle fut consumée
  rationale: Le passif de δαπανάω signifie ici « être consumé » ou « épuisé ». Le pronom conserve dans le corps du texte l’incertitude du grec quant à son sujet implicite.
theological_decisions:
- issue: Référent du verbe passif final
  choice: Maintenir un pronom dont le référent n’est pas explicitement fixé
  alternative: Nommer expressément la flamme, la matière brûlée ou un autre élément du contexte
  rationale: Le grec n’énonce pas le sujet de ἐδαπανήθη. La flamme, mentionnée immédiatement auparavant, est un référent plausible, mais le texte ne permet pas d’exclure la matière brûlée ou un élément du contexte précédent. La traduction et la note préservent cette indétermination.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe reste proche du grec tout en évitant les tournures archaïques. Le pronom final et la note signalent honnêtement l’ambiguïté du texte source.
