  text: For when our fathers were being led away into Persia[a], the devout priests secretly took some of the fire from the altar and hid it in the hollow of a dry well, where they secured it so that the place would be unknown to everyone.
translation:
  language: fr
  text: En effet, lorsque nos pères étaient emmenés en Perse, les prêtres pieux prirent secrètement du feu de l’autel et le cachèrent dans la cavité d’un puits à sec[a], où ils le mirent en sûreté, de manière que le lieu demeure inconnu de tous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans le creux d’une fosse sans eau ». Le grec formule cette description de manière condensée et quelque peu inhabituelle, en associant les idées de cavité, de puits ou de fosse, et d’absence d’eau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγοντο
  choice: étaient emmenés
  rationale: L’imparfait passif présente une action en cours et suggère un déplacement imposé, sans préciser davantage les circonstances de la déportation.
- source_word: εἰς τὴν Περσικὴν
  choice: en Perse
  rationale: L’expression désigne le territoire perse; « en Perse » est la formulation géographique naturelle en français.
- source_word: εὐσεβεῖς
  choice: pieux
  rationale: Ce terme exprime l’attachement religieux des prêtres dans un registre actuel et digne.
- source_word: λαβόντες ἀπὸ τοῦ πυρὸς τοῦ θυσιαστηρίου
  choice: prirent du feu de l’autel
  rationale: Le partitif français indique naturellement qu’ils prélevèrent une quantité de ce feu, sans laisser entendre qu’ils l’emportèrent tout entier.
- source_word: λαθραίως
  choice: secrètement
  rationale: L’adverbe indique que l’action fut accomplie à l’insu des autres; sa place auprès de « prirent » reste naturelle en français.
- source_word: κατέκρυφαν
  choice: le cachèrent
  rationale: Le verbe signifie cacher ou dissimuler; cette traduction directe n’ajoute ni enfouissement ni procédé particulier.
- source_word: ἐν κοιλώματι φρέατος τάξιν ἔχοντος ἀνύδρου
  choice: dans la cavité d’un puits à sec
  rationale: Cette formulation conserve les deux notions principales, une cavité et un puits dépourvu d’eau, tout en rendant lisible une expression grecque comprimée et inhabituelle.
- source_word: κατησφαλίσαντο
  choice: ils le mirent en sûreté
  rationale: Le moyen exprime l’action de rendre le dépôt sûr. Cette traduction ne précise pas s’ils l’ont scellé, couvert ou protégé d’une autre manière.
- source_word: ὥστε πᾶσιν ἄγνωστον εἶναι τὸν τόπον
  choice: de sorte que l’endroit resta inconnu de tous
  rationale: La tournure rend le résultat exprimé par ὥστε et conserve la portée universelle de πᾶσιν.
theological_decisions:
- issue: Portée religieuse de la conservation du feu de l’autel
  choice: Le verset rapporte que des prêtres pieux ont secrètement préservé du feu de l’autel pendant le déplacement vers la Perse, sans expliquer la signification rituelle de leur geste.
  alternative: On pourrait y voir soit la volonté d’assurer la continuité future du culte, soit simplement la conservation respectueuse d’un élément sacré.
  rationale: Le récit qualifie les prêtres de pieux, mais n’expose ici aucune théorie rituelle. La traduction laisse donc ouvertes les implications théologiques du geste.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été légèrement déployée en deux phrases pour éviter une période lourde, sans supprimer l’enchaînement logique du grec. « Puits à sec » est idiomatique, tandis que la note préserve l’ambiguïté entre puits et fosse.
