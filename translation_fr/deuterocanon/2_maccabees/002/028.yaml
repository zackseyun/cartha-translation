lexical_decisions:
- source_word: διακριβοῦν περὶ ἑκάστων
  choice: traiter avec exactitude chaque point
  rationale: L’infinitif substantivé désigne ici le traitement précis et détaillé des divers éléments du récit. Cette formulation conserve à la fois l’idée d’exactitude et celle d’un travail littéraire.
- source_word: τῷ συγγραφεῖ παραχωρήσαντες
  choice: laissant à l’auteur le soin de
  rationale: παραχωρέω indique que cette tâche est laissée au domaine ou à la responsabilité de l’auteur de l’ouvrage développé.
- source_word: ἐπιπορεύεσθαι
  choice: suivre
  rationale: Avec ὑπογραμμοῖς, le verbe exprime métaphoriquement le fait d’avancer en suivant un tracé directeur.
- source_word: τοῖς ὑπογραμμοῖς
  choice: les grandes lignes
  rationale: ὑπογραμμός peut désigner un tracé, une esquisse ou un modèle. Dans le contexte d’un abrégé, « grandes lignes » rend naturellement l’image d’un cadre directeur.
- source_word: τῆς ἐπιτομῆς
  choice: de l’abrégé
  rationale: ἐπιτομή est le terme littéraire désignant la réduction d’un ouvrage plus développé; « abrégé » est ici clair et exact en français.
- source_word: ἀτονοῦντες
  choice: nous nous épuisons
  rationale: Le verbe évoque littéralement la perte de forces ou l’épuisement. Dans ce contexte, il souligne l’effort pénible exigé par la composition de l’abrégé, plutôt qu’un simple soin méthodique.
