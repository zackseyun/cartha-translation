  text: But one should allow the one producing the epitome to aim at brevity of expression and to forgo the elaborate treatment of the subject matter[a].
translation:
  language: fr
  text: Mais il faut permettre à celui qui réalise l’abrégé[a] de rechercher la concision dans l’expression et de renoncer à un traitement détaillé du sujet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme grec peut aussi signifier « traduction »; ici, le contexte indique qu’il s’agit de l’abrégé d’une œuvre plus longue.
    reason: lexical_alternative
lexical_decisions:
- source_word: σύντομον τῆς λέξεως
  choice: la concision dans l’expression
  rationale: L’adjectif substantivé σύντομον exprime ici la brièveté ou la concision, tandis que λέξις désigne la manière de s’exprimer plutôt qu’un mot isolé.
- source_word: μεταδιώκειν
  choice: rechercher
  rationale: Le verbe évoque le fait de poursuivre activement un objectif; « rechercher » est naturel en français dans ce contexte littéraire.
- source_word: τὸ ἐξεργαστικὸν τῆς πραγματίας
  choice: un traitement détaillé du sujet
  rationale: ἐξεργαστικόν désigne une élaboration poussée ou minutieuse, et πραγματεία la matière traitée ou l’entreprise littéraire.
- source_word: παραιτεῖσθαι
  choice: renoncer à
  rationale: Le verbe signifie ici se dispenser volontairement d’une élaboration complète.
- source_word: τῷ τὴν μετάφρασιν ποιουμένῳ
  choice: à celui qui réalise l’abrégé
  rationale: Dans le prologue, l’auteur présente son ouvrage comme l’abrégé d’une œuvre en cinq livres; « abrégé » rend donc le rôle de μετάφρασις dans ce contexte, malgré son autre sens possible de « traduction ».
- source_word: συγχωρητέον
  choice: il faut permettre
  rationale: L’adjectif verbal exprime ce qui doit être accordé ou admis; cette tournure conserve la force impersonnelle et normative du grec.
theological_decisions:
- issue: Sens de μετάφρασις dans ce contexte
  choice: abrégé
  alternative: traduction
  rationale: Le contexte immédiat décrit la réduction de l’œuvre en cinq livres de Jason de Cyrène. Le choix est littéraire et contextuel, sans portée doctrinale, tandis que la note préserve l’autre valeur lexicale réelle du terme.
translation_notes:
  register: Français international moderne, clair et digne. La structure conserve le contraste entre concision de l’expression et traitement détaillé du sujet, sans alourdir la phrase.
