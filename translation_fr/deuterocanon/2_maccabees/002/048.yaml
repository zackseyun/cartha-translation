  yaml_path: translation/deuterocanon/2_maccabees/002/048.yaml
  text: and the appearances from heaven that came to those who fought bravely with zeal for Judaism[a], so that, though they were few, they plundered the whole country and drove off the barbarian hordes[c][b],
translation:
  language: fr
  text: 'et les manifestations venues du ciel[a] en faveur de ceux qui combattirent vaillamment, avec zèle, pour le judaïsme[b] : bien que peu nombreux, ils pillèrent tout le pays et poursuivirent les foules barbares[c],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « apparitions venues du ciel » ou « épiphanies célestes ».
    reason: lexical_alternative
  - marker: b
    text: Ici, le « judaïsme » désigne la religion et le mode de vie juifs défendus contre la pression étrangère.
    reason: cultural_note
  - marker: c
    text: 'L’expression « foules barbares » reprend la qualification ethnoculturelle propre au texte grec; autre traduction possible : « multitudes étrangères ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφανείας
  choice: manifestations
  rationale: Le nom désigne des apparitions ou manifestations visibles. « Manifestations » exprime ici une intervention céleste sans imposer au mot français « épiphanies » ses connotations techniques ou liturgiques.
- source_word: τὰς ἐξ οὐρανοῦ γενομένας
  choice: venues du ciel
  rationale: Cette tournure conserve à la fois l’origine céleste et l’idée que ces manifestations se sont produites.
- source_word: τοῖς ... φιλοτίμως ἀνδραγαθήσασιν
  choice: en faveur de ceux qui accomplirent avec zèle des actes de bravoure
  rationale: Le datif indique les bénéficiaires des manifestations; φιλοτίμως exprime l’ardeur ou le zèle, tandis que ἀνδραγαθέω évoque une conduite courageuse, notamment dans un cadre militaire.
- source_word: ὑπὲρ τοῦ Ἰουδαισμοῦ
  choice: pour le judaïsme
  rationale: Le terme grec désigne ici la religion et le mode de vie juifs défendus contre la pression étrangère. « Judaïsme » en est l’équivalent direct et établi.
- source_word: ὡς
  choice: ':'
  rationale: Dans cette construction, ὡς introduit le contenu ou l’illustration de leur action victorieuse. Les deux-points rendent naturellement ce lien en français sans trancher artificiellement en faveur d’un rapport strict de but ou de conséquence.
- source_word: τὴν ὅλην χώραν
  choice: tout le pays
  rationale: χώρα désigne ici l’ensemble du territoire concerné; « pays » convient au contexte militaire et politique.
- source_word: ὀλίγους ὄντας
  choice: bien que peu nombreux
  rationale: 'Le participe a une valeur concessive: leur petit nombre contraste avec l’ampleur de leurs succès.'
- source_word: λεηλατεῖν
  choice: pillèrent
  rationale: Le verbe signifie prendre du butin ou mettre au pillage; cette traduction conserve sans l’atténuer la portée militaire du terme.
- source_word: τὰ βάρβαρα πλήθη
  choice: les foules barbares
  rationale: La formulation garde l’étiquette ethnoculturelle polémique du texte grec ainsi que l’idée de multitudes, tout en évitant d’ajouter la nuance particulière de « hordes ».
- source_word: διώκειν
  choice: poursuivirent
  rationale: « Poursuivre » correspond au sens premier du verbe et préserve l’image d’une poursuite militaire sans préciser au-delà du grec que les ennemis furent définitivement chassés.
theological_decisions:
- issue: Sens de Ἰουδαϊσμός dans ce récit historique
  choice: le judaïsme
  alternative: le mode de vie juif
  rationale: Le grec nomme une identité religieuse et culturelle défendue face à l’hellénisation. Le terme direct « judaïsme » préserve cette formulation, tandis qu’une paraphrase explicative risquerait d’en réduire la portée.
- issue: Nature des interventions venues du ciel
  choice: manifestations venues du ciel
  alternative: apparitions célestes
  rationale: « Manifestations » laisse ouverte la forme exacte de ces interventions et n’enferme pas le texte dans une description visuelle plus précise que ne l’exige le grec.
- issue: Valeur syntaxique de ὡς
  choice: lien explicatif marqué par deux-points
  alternative: si bien que
  rationale: Le contexte syntaxique permet de comprendre ὡς comme introduisant ce qui est rapporté au sujet de ces combattants, plutôt que comme exprimant nécessairement une conséquence directe des manifestations célestes.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve son caractère de fragment coordonné grâce au « et » initial et à la virgule finale. Le vocabulaire militaire reste direct, et les notes signalent les termes culturellement marqués ainsi que les principales possibilités lexicales.
