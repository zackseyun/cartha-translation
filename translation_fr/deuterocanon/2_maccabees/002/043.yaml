  yaml_path: translation/deuterocanon/2_maccabees/002/043.yaml
  text: Since we are about to celebrate the purification[a], we have written to you. Therefore you will do well to observe the days.
translation:
  language: fr
  text: Puisque nous allons donc célébrer la Purification, nous vous avons écrit. Vous ferez donc bien d’observer les jours.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « célébrer les jours » ou « garder les jours ». Le même verbe grec est employé plus haut pour « célébrer la Purification ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μέλλοντες οὖν
  choice: Puisque nous allons donc
  rationale: Le participe exprime une action imminente, tandis que οὖν marque le lien logique avec le contexte. Cette formulation reste naturelle en français tout en conservant les deux nuances.
- source_word: ἄγειν
  choice: célébrer / observer
  rationale: Le même verbe grec apparaît deux fois. Dans un contexte festif, il signifie célébrer ou observer. La variation française s’adapte aux compléments « la Purification » et « ces jours », tandis que la note signale l’identité du verbe source.
- source_word: τὸν καθαρισμόν
  choice: la Purification
  rationale: Le nom signifie littéralement « purification » ou « purification rituelle ». La majuscule indique ici l’observance commémorative sans ajouter explicitement « fête », absent du grec.
- source_word: ἐγράψαμεν
  choice: nous vous avons écrit
  rationale: L’aoriste épistolaire peut se rendre par un passé composé naturel en français, adapté à une lettre que les destinataires ont sous les yeux.
- source_word: καλῶς ... ποιήσετε
  choice: vous ferez bien
  rationale: Cette tournure idiomatique exprime une recommandation courtoise et se transpose directement en français moderne.
- source_word: τὰς ἡμέρας
  choice: ces jours
  rationale: Le grec dit littéralement « les jours ». Le démonstratif français rattache naturellement les jours à la célébration qui vient d’être mentionnée, sans expliciter davantage leur nature festive.
