  - severity: medium
    issue: Rendu de ἐδηλοῦτο et de ἐπὶ Μωσῇ
    rationale: « Cela s’était manifesté au temps de Moïse » substitue « se manifester » à « être montré/rendu manifeste », et le plus-que-parfait ne reflète pas l’imparfait. La formulation proposée maintient le caractère comparatif et ne prétend pas déterminer plus précisément la relation à Moïse.
  - severity: low
    issue: Note c présentée comme littérale
    rationale: 'La formulation « comme cela se manifestait auprès de Moïse » n’est pas littérale : ἐδηλοῦτο est passif de δηλόω et signifie « était montré/rendu manifeste », tandis que ἐπί avec le datif est ici comparatif ou référentiel.'
  - severity: low
    issue: Intensif μεγάλως
    rationale: « Pleinement » est possible, mais « grandement » conserve plus directement l’intensification sans ajouter la nuance d’achèvement ou de plénitude.
