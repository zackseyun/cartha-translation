  text: And then the Lord will reveal these things[a], and the glory of the Lord and the cloud will appear, as it was shown in the case of Moses, and as Solomon also asked[d][c][b], that the place might be greatly sanctified.
translation:
  language: fr
  text: Alors le Seigneur révélera ces choses[a], et la gloire du Seigneur ainsi que la nuée[b] apparaîtront, comme cela avait été manifesté dans le cas de Moïse[c], et comme Salomon l’avait lui aussi demandé, afin que le lieu soit grandement consacré[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fera paraître ces choses » ou « mettra ces choses au jour ».'
    reason: lexical_alternative
  - marker: b
    text: La « nuée » rappelle la nuée associée à la présence divine dans les récits concernant Moïse et le sanctuaire.
    reason: cross_reference
  - marker: c
    text: 'Ou : « comme cela avait été montré dans le cas de Moïse ». Le grec établit une comparaison avec le précédent mosaïque.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou : « afin que le lieu soit pleinement consacré » ou « soit grandement sanctifié ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναδείξει
  choice: révélera
  rationale: Le verbe exprime ici l’action de faire connaître ou de mettre au jour ce qui était caché. « Révélera » est naturel en français et convient au contexte de manifestation divine.
- source_word: ταῦτα
  choice: ces choses
  rationale: Le démonstratif renvoie au contexte antérieur sans préciser davantage la nature des réalités cachées.
- source_word: ὀφθήσεται
  choice: apparaîtront
  rationale: Le passif de ὁράω a couramment le sens d’« apparaître ». Le pluriel français s’accorde naturellement avec « la gloire […] ainsi que la nuée », même si le grec emploie un verbe au singulier.
- source_word: δόξα
  choice: gloire
  rationale: « Gloire » conserve le vocabulaire biblique traditionnel et sa portée théophanique.
- source_word: νεφέλη
  choice: la nuée
  rationale: « La nuée » évoque naturellement, dans le registre biblique français, la manifestation reconnaissable de la présence divine.
- source_word: ἐπὶ Μωσῇ
  choice: au temps de Moïse
  rationale: Cette formulation française exprime le précédent mosaïque sans suggérer que la manifestation était physiquement placée sur Moïse.
- source_word: ἐδηλοῦτο
  choice: cela s’était manifesté
  rationale: Le pronom neutre « cela » évite de décider si le singulier grec reprend la gloire, la nuée ou l’ensemble de la manifestation. Le plus-que-parfait situe ce précédent avant la demande de Salomon dans le récit rapporté.
- source_word: ἠξίωσεν
  choice: avait demandé
  rationale: Dans ce contexte, le verbe désigne une requête. « Demandé » reste plus proche et moins interprétatif que « prié ».
- source_word: ὁ τόπος
  choice: le lieu
  rationale: Le rendu littéral laisse le contexte identifier le sanctuaire ou son emplacement.
- source_word: καταγιασθῇ
  choice: soit consacré
  rationale: Le verbe signifie rendre saint, sanctifier ou consacrer. Pour un lieu cultuel, « consacré » est idiomatique en français moderne.
- source_word: μεγάλως
  choice: pleinement
  rationale: L’adverbe intensifie la consécration. « Pleinement » rend cette force plus naturellement que le calque peu idiomatique « grandement consacré ».
theological_decisions:
- issue: Traduction de κύριος dans un contexte théophanique de la Septante
  choice: Seigneur
  alternative: l’Éternel
  rationale: Le texte grec porte κύριος. « Seigneur » le traduit directement sans reconstruire dans le corps du texte un éventuel nom divin hébreu sous-jacent.
- issue: Rapport entre la manifestation future, Moïse et Salomon
  choice: Conserver la comparaison historique sans l’expliciter doctrinalement
  alternative: Identifier expressément la nuée à une doctrine développée de la présence divine
  rationale: Le grec rapproche les manifestations sans expliquer davantage leur nature. La traduction maintient ce lien et laisse subsister sa portée théologique.
- issue: Référent singulier de ἐδηλοῦτο
  choice: « cela s’était manifesté »
  alternative: « elles s’étaient manifestées »
  rationale: Le neutre français préserve l’indétermination du singulier grec, qui peut viser l’ensemble de la manifestation plutôt que seulement la gloire ou la nuée.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme de la longue phrase grecque est conservé, tout en employant des tournures françaises naturelles. « Nuée », « gloire » et « consacré » maintiennent le registre biblique sans archaïsme excessif.
