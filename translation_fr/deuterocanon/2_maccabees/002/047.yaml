lexical_decisions:
- source_word: ἔτι τε
  choice: ainsi que
  rationale: La locution ajoute un nouvel élément à une énumération en cours. « Ainsi que » restitue naturellement cette valeur additive.
- source_word: τοὺς ... πολέμους
  choice: les guerres
  rationale: πολέμους désigne largement des guerres ou des conflits armés. « Les guerres » conserve ici le sens direct et le style récapitulatif.
- source_word: πρὸς
  choice: contre
  rationale: Avec πολέμους, πρὸς indique les adversaires auxquels les conflits sont opposés; « contre » exprime clairement ce rapport.
- source_word: Ἀντίοχον τὸν Ἐπιφανῆ
  choice: Antiochos Épiphane
  rationale: Le nom et l'épithète royale sont conservés sous leur forme française historique courante plutôt que de traduire Épiphane par « l'Illustre ».
- source_word: τὸν τούτου υἱὸν Εὐπάτορα
  choice: son fils Eupator
  rationale: τούτου renvoie à Antiochos. Cette formulation concise conserve explicitement le lien filial et l'identification d'Eupator.
