base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/024.yaml
  text: But when the matter became known[a], and it was reported to the king of the Persians that in the place where the priests who had been taken away had hidden the fire, water appeared, from which also those with Nehemiah purified the sacrifices[c][b],
translation:
  language: fr
  text: Mais lorsque l’affaire fut connue et qu’on rapporta au roi des Perses que, là où les prêtres qui avaient été emmenés[a] avaient caché le feu, de l’eau apparut, avec laquelle[c] Néhémie et ses compagnons[b] purifièrent les sacrifices,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les prêtres déportés ». Le participe grec indique qu’ils avaient été déplacés ou emmenés, vraisemblablement en exil.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ceux qui entouraient Néhémie », c’est-à-dire Néhémie et les personnes qui l’accompagnaient.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « à partir de laquelle ». L’expression grecque peut présenter l’eau comme la source de ce qui servit à la purification ou, plus simplement, comme le moyen employé.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: φανερὸν ἐγενήθη τὸ πρᾶγμα
  choice: l’affaire fut connue
  rationale: Cette tournure exprime naturellement en français que l’événement a été porté à la connaissance du public, tout en conservant la valeur résultative du grec.
- source_word: διηγήθη
  choice: on rapporta
  rationale: Le passif grec indique que l’information fut transmise au roi. La tournure impersonnelle française est fluide et convient au registre narratif.
- source_word: τῷ βασιλεῖ τῶν Περσῶν
  choice: au roi des Perses
  rationale: Rendu formel et direct de la construction grecque, naturel dans un récit historique.
- source_word: εἰς τὸν τόπον οὗ
  choice: là où
  rationale: Bien que εἰς soit normalement directionnel, le contexte de ἐφάνη appelle ici une expression locative. « Là où » évite une formulation française pesante.
- source_word: τὸ πῦρ ἔκρυψαν
  choice: avaient caché le feu
  rationale: Le plus-que-parfait marque clairement que le feu avait été caché avant l’apparition de l’eau et le rapport au roi.
- source_word: οἱ μεταχθέντες ἱερεῖς
  choice: les prêtres qui avaient été emmenés
  rationale: Cette formulation conserve l’idée de déplacement ou d’éloignement sans préciser davantage que le grec s’il s’agissait d’un exil ou d’une déportation.
- source_word: τὸ ὕδωρ ἐφάνη
  choice: de l’eau était apparue
  rationale: Le plus-que-parfait situe l’apparition avant le moment où l’affaire fut rapportée; l’article partitif est idiomatique en français.
- source_word: ἀφʼ οὗ
  choice: avec laquelle
  rationale: Dans ce contexte, la préposition introduit naturellement le liquide employé pour la purification. La note conserve le sens plus littéral de provenance et l’ambiguïté source/instrument.
- source_word: οἱ περὶ τὸν Νεεμίαν
  choice: Néhémie et ses compagnons
  rationale: Cette expression idiomatique grecque désigne la personne nommée et le groupe qui l’entoure. Le rendu français est naturel sans préciser l’identité des membres du groupe.
- source_word: ἥγνισαν τὰς θυσίας
  choice: purifièrent les sacrifices
  rationale: Le verbe a ici une valeur rituelle. « Purifier » conserve cette portée cultuelle sans la remplacer par l’idée plus précise de consécration.
theological_decisions:
- issue: Sens cultuel de la purification appliquée aux sacrifices
  choice: purifièrent les sacrifices
  alternative: consacrèrent les sacrifices / purifièrent les offrandes sacrificielles
  rationale: Le grec attribue grammaticalement la purification aux sacrifices eux-mêmes. Le rendu retenu préserve cette formulation et sa tension cultuelle sans expliquer à la place du texte la nature exacte du rite.
- issue: Rapport de l’eau à la purification
  choice: eau avec laquelle
  alternative: eau à partir de laquelle / dont
  rationale: Le contexte permet de comprendre ἀφʼ οὗ comme indiquant soit la provenance, soit le moyen employé. Le texte principal adopte le français le plus naturel, tandis que la note signale la formulation littérale et maintient l’ambiguïté.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase reste ouverte par une virgule, conformément au texte source fourni, qui constitue une proposition dépendante se poursuivant dans le contexte. Les formulations explicatives sont réservées aux notes afin de ne pas surinterpréter le déplacement des prêtres, la composition du groupe de Néhémie ni le rôle exact de l’eau.
