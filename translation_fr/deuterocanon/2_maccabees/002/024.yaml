  source_fidelity: 'Le sens général est fidèle. Toutefois, l’aoriste ἐφάνη (« apparut ») ne requiert pas un plus-que-parfait français (« était apparue ») : dans le discours rapporté au passé, le passé simple conserve mieux l’événement narré sans le situer artificiellement avant un autre passé. Le rapport de ἀφ’ οὗ à l’eau demeure correctement rendu par « avec laquelle », avec note d’ambiguïté.'
  naturalness: La reprise appositionnelle « de l’eau était apparue, eau avec laquelle » est lourde en français. « De l’eau apparut, avec laquelle… » est naturel et clair. La proposition reste volontairement ouverte, comme le grec fourni.
  terminology: « Roi des Perses », « prêtres ... emmenés », « Néhémie et ses compagnons » et « purifièrent les sacrifices » sont appropriés au registre narratif et au contexte cultuel. « Purifièrent » conserve la valeur rituelle sans imposer une interprétation doctrinale.
