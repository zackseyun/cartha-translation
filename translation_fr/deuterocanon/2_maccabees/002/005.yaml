  text: For as Antiochus and his friends were accompanying her to the place[a], they were bringing him there to gain control of the money[b], under the pretext of inspection.
translation:
  language: fr
  text: Car, tandis qu’il habitait avec elle, Antiochos et les amis qui l’accompagnaient le conduisaient à cet endroit[a], afin de prendre possession de la somme d’argent la plus importante[b], sous prétexte d’inspection.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec transmis est syntaxiquement difficile; l’identité des sujets et des compléments ainsi que les référents des pronoms demeurent incertains.
    reason: textual_variant
  - marker: b
    text: 'Autre traduction possible : « afin de prendre le contrôle de davantage d’argent » ou « de la plus grande somme d’argent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνοικῶν αὐτῇ
  choice: tandis qu’il habitait avec elle
  rationale: Le sens ordinaire de συνοικέω est « habiter avec ». La construction transmise est difficile, mais il vaut mieux conserver ici le sens lexical direct et le féminin explicite de αὐτῇ plutôt que d’introduire l’idée moins assurée d’accompagnement.
- source_word: παρῆγεν εἰς τὸν τόπον
  choice: le conduisaient à cet endroit
  rationale: παράγω peut signifier conduire ou amener. Le français emploie un pluriel selon le sujet composé qui suit; l’objet masculin, sous-entendu en grec, est rendu prudemment par « le ».
- source_word: οἱ σὺν αὐτῷ φίλοι
  choice: les amis qui l’accompagnaient
  rationale: Cette formulation naturelle exprime les amis ou associés présents avec Antiochos sans surcharger le texte.
- source_word: κύριον τὸ λαβεῖν
  choice: afin de prendre possession
  rationale: La tournure exprime l’obtention de la maîtrise ou de la disposition des biens; « prendre possession » garde ce sens sans réduire l’action à une simple saisie matérielle.
- source_word: τὰ χρήματα πλείονα
  choice: de la somme d’argent la plus importante
  rationale: πλείονα marque une quantité supérieure. « La somme d’argent la plus importante » conserve cette valeur comparative malgré l’irrégularité de la syntaxe.
- source_word: εἰς ἐφορῆς λόγον
  choice: sous prétexte d’inspection
  rationale: λόγον peut indiquer le motif invoqué, tandis que ἐφορά renvoie à l’inspection ou à la surveillance. Le contexte suggère une justification avancée plutôt qu’un but neutre.
