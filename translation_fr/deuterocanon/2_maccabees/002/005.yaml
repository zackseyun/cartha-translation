review_pass:
  verdict: revise
  source_fidelity: 'Le grec transmis est manifestement heurté : le participe nominatif singulier συνοικῶν et l’aoriste singulier παρῆγεν ne s’accordent pas simplement avec le sujet coordonné Ἀντίοχος καὶ οἱ ... φίλοι. La version doit signaler cette difficulté plutôt que de présenter comme certaine l’identité de tous les référents. La révision rend συνοικῶν par « vivait avec elle », conserve le féminin de αὐτῇ et évite d’ajouter un objet masculin non exprimé après παρῆγεν.'
  naturalness: 'La phrase actuelle est grammaticalement disloquée en français : « tandis qu’il habitait avec elle, Antiochos et les amis ... le conduisaient » ne permet pas d’identifier naturellement le sujet du premier verbe ni l’antécédent de « le ». La révision rend le texte lisible tout en maintenant, par une note, les incertitudes du grec.'
  terminology: « Amis qui étaient avec lui » rend sans surcharge οἱ σὺν αὐτῷ φίλοι. « Prendre possession de fonds plus importants » exprime κύριον τὸ λαβεῖν et la valeur comparative de πλείονα sans imposer indûment l’idée d’une somme unique et maximale. « Sous prétexte d’inspection » est idiomatique pour εἰς ἐφορῆς λόγον dans ce contexte.
  issues:
  - severity: medium
    issue: Construction française ambiguë et peu naturelle au début du verset.
    rationale: Le participe rendu par « tandis qu’il habitait » a un sujet non identifié, puis la proposition principale introduit un sujet pluriel et un pronom objet masculin sans antécédent clair. Cette formulation reproduit une difficulté grecque d’une manière inutilement confuse en français.
  - severity: medium
    issue: Ajout affirmatif d’un objet masculin à « le conduisaient ».
    rationale: Le texte grec transmis ne fournit pas explicitement cet objet. Puisque les référents sont incertains, il vaut mieux employer une formulation de déplacement sans objet et documenter la difficulté.
  - severity: low
    issue: « la somme d’argent la plus importante » surdétermine πλείονα.
    rationale: πλείονα est comparatif et χρήματα est pluriel ; « des fonds plus importants » préserve mieux la quantité comparative sans en faire un superlatif ni une somme unique.
  revised_text: Car, tandis qu’Antiochos vivait avec elle, lui et les amis qui étaient avec lui se rendaient au lieu[a], afin de prendre possession de fonds plus importants[b], sous prétexte d’inspection.
  revised_footnotes:
  - marker: a
    text: 'Le texte grec transmis est syntaxiquement difficile : le participe et le verbe sont au singulier, alors que le sujet nommé est coordonné. L’identité des sujets, des compléments et des référents pronominaux demeure incertaine.'
    reason: textual_variant
  - marker: b
    text: 'Autre traduction possible : « afin d’en prendre le contrôle » ou « afin de prendre possession de la plus grande somme d’argent ».'
    reason: lexical_alternative
  revision_rationale: La révision corrige l’ambiguïté grammaticale introduite en français, conserve les éléments explicitement présents dans le grec — notamment « avec elle » — et ne fournit plus comme certain un objet masculin absent du texte transmis. Elle maintient l’ambiguïté textuelle au moyen d’une note explicite et ajuste le rendu de χρήματα πλείονα à son pluriel et à sa valeur comparative.
