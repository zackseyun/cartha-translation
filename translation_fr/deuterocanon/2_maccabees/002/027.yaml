  text: Just as it is not easy for one who prepares a banquet and seeks the advantage of others[a], yet for the gratitude of the many we will gladly endure the hardship;
translation:
  language: fr
  text: De même qu’il n’est pas facile pour celui qui prépare un banquet et cherche l’intérêt des autres, nous supporterons pourtant volontiers cette peine pour la gratitude du grand nombre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à cause des remerciements du grand nombre ». Le grec désigne ici la gratitude ou les remerciements, et non le terme liturgique plus tardif « Eucharistie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: De même
  rationale: Introduit naturellement en français la comparaison avec ce qui précède.
- source_word: τῷ παρασκευάζοντι συμπόσιον
  choice: à celui qui prépare un banquet
  rationale: Le datif désigne la personne pour laquelle la tâche est difficile; « banquet » rend le repas organisé et festif.
- source_word: ζητοῦντι τὴν ἑτέρων λυσιτέλειαν
  choice: et cherche l’intérêt des autres
  rationale: Préserve le parallélisme des participes et rend λυσιτέλεια par l’idée d’avantage ou d’utilité pour autrui.
- source_word: οὐκ εὐχερές
  choice: il n’est pas facile … de mener sa tâche à bien
  rationale: Le grec porte une expression impersonnelle elliptique. L’ajout explicite « mener sa tâche à bien » produit une phrase française complète sans déterminer davantage la nature de la difficulté.
- source_word: ὅμως
  choice: Pourtant
  rationale: Marque clairement la concession et la résolution qui suivent.
- source_word: διὰ τὴν τῶν πολλῶν εὐχαριστίαν
  choice: en vue de la reconnaissance du grand nombre
  rationale: εὐχαριστία désigne ici la gratitude ou les remerciements; « du grand nombre » conserve la portée de τῶν πολλῶν.
- source_word: ἡδέως
  choice: volontiers
  rationale: Exprime la disposition favorable à accepter la difficulté, dans un registre naturel et digne.
- source_word: τὴν κακοπάθειαν ὑποίσομεν
  choice: nous supporterons … cette peine
  rationale: Rend l’idée de porter ou d’endurer le labeur pénible lié au travail de rédaction.
theological_decisions:
- issue: Sens de εὐχαριστία
  choice: reconnaissance
  alternative: Eucharistie
  rationale: Dans ce contexte juif hellénistique, le mot a son sens courant de gratitude ou de remerciement. « Eucharistie » introduirait ici un sens liturgique chrétien anachronique.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe grecque est légèrement explicitée pour éviter en français une comparaison laissée sans proposition complète; le point-virgule final du verset source est rendu par un point, puisque la suite appartient au verset suivant.
