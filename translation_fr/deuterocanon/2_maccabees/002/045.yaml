base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/045.yaml
  text: just as he promised through the law[a]. For we hope in God that he will soon have mercy on us and gather us from under heaven into the holy place[c][b]; for he rescued us from great evils and cleansed the place.
translation:
  language: fr
  text: 'comme il l’a promis par l’intermédiaire de la Loi. Car nous mettons notre espérance en Dieu : bientôt, il aura compassion de nous et nous rassemblera de partout sous le ciel[a] au lieu saint[b]. En effet, il nous a délivrés de grands malheurs[c] et il a purifié le lieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, l’expression grecque évoque ce qui se trouve « sous le ciel »; elle désigne ici les différents lieux où le peuple est dispersé.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire le site sacré de Jérusalem; dans ce contexte, il s’agit de l’aire du Temple.
    reason: cultural_note
  - marker: c
    text: Ou « de grands maux », « de grandes calamités » ou « de grandes détresses ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς ἐπηγγείλατο
  choice: comme il l’a promis
  rationale: καθώς exprime ici la conformité à la promesse. « Comme il l’a promis » est naturel en français et conserve cette valeur.
- source_word: διὰ τοῦ νόμου
  choice: par l’intermédiaire de la Loi
  rationale: διά avec le génitif marque le moyen par lequel la promesse a été transmise. Cette formulation rend l’instrumentalité sans suggérer que la Loi serait elle-même l’auteur de la promesse.
- source_word: ἐλπίζομεν ... ἐπὶ τῷ θεῷ
  choice: nous mettons notre espérance en Dieu
  rationale: La tournure grecque exprime une espérance placée en quelqu’un. Cette traduction française restitue clairement la confiance orientée vers Dieu.
- source_word: ταχέως
  choice: bientôt
  rationale: Dans cette proposition tournée vers l’avenir, l’adverbe indique que l’action divine est attendue sous peu plutôt que simplement exécutée avec rapidité.
- source_word: ἐλεήσει
  choice: il aura compassion de nous
  rationale: ἐλεέω signifie faire miséricorde ou avoir compassion. Le choix retenu est actuel, digne et compréhensible, sans affaiblir la portée religieuse.
- source_word: ἐπισυνάξει
  choice: nous rassemblera
  rationale: Le verbe désigne l’action de réunir des personnes dispersées et porte ici une nuance de restauration collective.
- source_word: ἐκ τῆς ὑπὸ τὸν οὐρανόν
  choice: de partout sous le ciel
  rationale: L’expression grecque est elliptique et désigne les régions situées sous le ciel, c’est-à-dire l’ensemble des lieux de dispersion. La formulation française explicite seulement ce qui est nécessaire à une lecture naturelle.
- source_word: εἰς τὸν ἅγιον τόπον
  choice: pour nous ramener au lieu saint
  rationale: εἰς indique le mouvement vers le lieu sacré. « Ramener » fait ressortir le contexte de rassemblement et de retour sans remplacer τόπος par « Temple » ou « sanctuaire ».
- source_word: ἐξείλατο
  choice: il nous a délivrés
  rationale: À la voix moyenne, ἐξαιρέω signifie sauver ou arracher à un danger. « Délivrer » convient au registre et préserve l’idée d’une intervention effective.
- source_word: ἐκ μεγάλων κακῶν
  choice: de grands malheurs
  rationale: κακά peut désigner des maux, des calamités ou des détresses. « Malheurs » convient ici aux afflictions subies tout en laissant subsister la largeur sémantique du grec.
- source_word: τὸν τόπον ἐκαθάρισεν
  choice: il a purifié ce lieu
  rationale: καθαρίζω peut signifier nettoyer ou purifier; dans le contexte d’un site sacré, « purifier » convient particulièrement. Le démonstratif français reprend naturellement le « lieu saint » déjà mentionné, tandis que le nom générique τόπος est conservé.
theological_decisions:
- issue: Référent de « lieu saint » et de « ce lieu »
  choice: Conserver le nom générique « lieu » dans le texte principal.
  alternative: Traduire par « sanctuaire » ou « Temple ».
  rationale: Le contexte renvoie au site sacré de Jérusalem, vraisemblablement à l’aire du Temple, mais le grec emploie τόπος et non un nom explicite du Temple. La note donne le contexte sans imposer dans le texte une précision absente de la formulation source.
- issue: Portée du rassemblement « sous le ciel »
  choice: Comprendre l’expression comme un rassemblement depuis tous les lieux de dispersion.
  alternative: Conserver mot à mot « de dessous le ciel », expression ambiguë et peu naturelle en français.
  rationale: La construction grecque est elliptique. « De partout sous le ciel » rend l’étendue géographique suggérée sans préciser des pays ou une diaspora que le texte ne nomme pas explicitement.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe a été légèrement déployée pour rendre naturelle l’expression grecque elliptique sur le rassemblement, tout en maintenant les termes génériques du texte source et ses nuances.
