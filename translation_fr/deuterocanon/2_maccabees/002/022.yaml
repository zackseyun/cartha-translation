  text: And when the things for the sacrifice had been consumed[b][a], Nehemiah ordered them to pour the remaining water on the larger stones.
translation:
  language: fr
  text: Quand ce qui servait au sacrifice eut été consumé[a], Néhémie ordonna de verser l’eau qui restait sur des pierres plus grosses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les choses du sacrifice ». L’expression grecque est elliptique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνηλώθη
  choice: eut été consumé
  rationale: Le passif indique que ce qui concernait le sacrifice avait été entièrement consommé; dans ce contexte sacrificiel, « consumé » reste naturel sans préciser davantage le moyen.
- source_word: τὰ τῆς θυσίας
  choice: ce qui servait au sacrifice
  rationale: L’expression grecque, littéralement « les choses du sacrifice », est elliptique. Cette formulation française en restitue le sens probable sans réduire le référent à une catégorie trop précise.
- source_word: τὸ περιλειπόμενον ὕδωρ
  choice: l’eau qui restait
  rationale: Rendu simple et idiomatique du participe grec, qui désigne l’eau demeurée disponible.
- source_word: ὁ Νεεμίας
  choice: Néhémie
  rationale: Forme française usuelle du nom biblique.
- source_word: ἐκέλευσεν
  choice: ordonna
  rationale: Le verbe exprime un ordre donné avec autorité; l’infinitif français permet de ne pas ajouter un destinataire absent du grec.
- source_word: λίθους μείζονας
  choice: des pierres plus grosses
  rationale: Le comparatif μείζονας est conservé par « plus grosses »; l’absence d’article en grec favorise « des » plutôt que « les ».
- source_word: καταχεῖν
  choice: verser … sur
  rationale: Le verbe composé exprime l’action de verser sur quelque chose; cette construction est idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. Le passé antérieur marque clairement que la consommation du sacrifice précède l’ordre de Néhémie. La formulation évite d’ajouter un sujet humain explicite à « ordonna », puisque le grec ne le nomme pas.
