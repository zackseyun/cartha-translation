  text: De même, Salomon célébra lui aussi les huit jours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡσαύτως
  choice: De même
  rationale: Rend directement l’adverbe de comparaison et rattache cette affirmation à l’exemple précédent.
- source_word: καὶ ὁ Σαλωμών
  choice: Salomon… lui aussi
  rationale: La tournure française « lui aussi » exprime naturellement la valeur additive de καί.
- source_word: τὰς ὀκτὼ ἡμέρας ἤγαγεν
  choice: célébra la fête pendant huit jours
  rationale: Littéralement, le grec dit qu’il « conduisit/passa les huit jours »; dans ce contexte festif, ἄγω avec une durée désigne la célébration d’une fête. L’explicitation « la fête » produit un français clair sans modifier le référent contextuel.
theological_decisions:
- issue: Nature des huit jours
  choice: Les présenter comme la durée d’une célébration festive
  alternative: « observa les huit jours » ou « passa les huit jours »
  rationale: Le verbe ἄγω employé avec des jours peut signifier les célébrer; cette lecture contextuelle évite une formulation française obscure, sans ajouter de précision confessionnelle.
translation_notes:
  register: Français international moderne, simple et digne. Le passé simple convient au registre narratif biblique écrit; la phrase reste immédiatement compréhensible.
