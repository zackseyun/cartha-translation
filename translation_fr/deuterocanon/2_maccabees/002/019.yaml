lexical_decisions:
- source_word: βάσανισον
  choice: Punis
  rationale: L’impératif aoriste demande ici que les coupables subissent une peine ou une souffrance punitive. « Punis » exprime naturellement cette dimension judiciaire sans préciser indûment la forme du châtiment.
- source_word: τοὺς καταδυναστεύοντας
  choice: ceux qui oppriment
  rationale: Le participe désigne ceux qui usent de leur pouvoir pour dominer durement autrui. « Ceux qui oppriment » est clair, actuel et fidèle à l’action continue suggérée.
- source_word: καὶ ἐξυβρίζοντας
  choice: et se livrent à des abus
  rationale: Le verbe évoque une conduite insolente et outrageante, qui peut dépasser la seule insulte verbale. « Se livrent à des abus » garde cette portée assez large en français naturel.
- source_word: ἐν ὑπερηφανίᾳ
  choice: avec arrogance
  rationale: La locution indique l’attitude dans laquelle ces actes sont commis. « Avec arrogance » conserve sa force morale et convient au français moderne.
theological_decisions:
- issue: Intégrité de la source et identification du verset
  choice: Traduire uniquement la proposition grecque fournie comme une demande adressée à Dieu, sans reconstruire un contexte absent.
  alternative: Compléter le texte d’après le contenu habituellement associé à 2 Maccabées 2.19 ou une autre tradition textuelle.
  rationale: La source grecque fournie est une brève proposition autonome et son identification est signalée comme présentant une discordance majeure. La traduction reste donc strictement attachée aux mots transmis et rend explicitement cette incertitude en note.
translation_notes:
  register: Français international moderne, digne et direct. L’impératif « Punis » conserve la forme de la prière. « Se livrent à des abus » évite de réduire ἐξυβρίζω à une parole insultante tout en restant accessible.
