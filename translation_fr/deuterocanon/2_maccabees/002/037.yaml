base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/037.yaml
  text: Just as Moses prayed to the Lord[a], and fire came down from heaven and consumed the things of the sacrifice, so also Solomon prayed to the Lord[b], and the fire came down and consumed the whole burnt offerings.
translation:
  language: fr
  text: Comme Moïse pria le Seigneur et qu’un feu descendit du ciel et consuma ce qui appartenait au sacrifice[a], ainsi Salomon pria lui aussi le Seigneur, et le feu descendit et consuma les offrandes entièrement brûlées[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les choses du sacrifice » ; l’expression peut désigner les éléments ou les offrandes liés au sacrifice.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les holocaustes ». Le terme grec désigne des offrandes entièrement consumées par le feu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσηύξατο
  choice: pria
  rationale: L’aoriste de προσεύχομαι signifie simplement « prier ». « Pria » est direct, naturel et n’ajoute aucune idée d’intensité.
- source_word: Κύριον
  choice: le Seigneur
  rationale: Le grec porte Κύριον et désigne ici le Dieu d’Israël. « Le Seigneur » traduit le témoin grec sans lui substituer la convention typographique réservée au tétragramme hébreu.
- source_word: κατέβη πῦρ ἐκ τοῦ οὐρανοῦ
  choice: un feu descendit du ciel
  rationale: Cette formulation conserve le mouvement concret du récit et reste idiomatique en français.
- source_word: τὰ τῆς θυσίας
  choice: ce qui appartenait au sacrifice
  rationale: L’expression grecque, littéralement « les choses du sacrifice », est plus large que le seul mot « sacrifice ». Le choix français en préserve l’indétermination sans être artificiel.
- source_word: ἐδαπάνησεν / ἀνήλωσεν
  choice: consuma
  rationale: Dans le contexte d’un feu agissant sur des offrandes, « consumer » est le verbe français naturel. Le même rendu dans les deux propositions maintient le parallélisme grec.
- source_word: οὕτως ... καὶ
  choice: ainsi ... lui aussi
  rationale: Cette formulation marque clairement la comparaison explicite entre Moïse et Salomon.
- source_word: ὁλοκαυτώματα
  choice: les offrandes entièrement brûlées
  rationale: Le terme désigne des offrandes intégralement consumées par le feu. Cette traduction explicite le sens cultuel tout en évitant l’ambiguïté moderne possible du mot « holocaustes ».
theological_decisions:
- issue: Rendu de κύριος lorsqu’il désigne le Dieu d’Israël
  choice: le Seigneur
  alternative: l’Éternel / le SEIGNEUR
  rationale: Le texte source grec dit Κύριον et non le tétragramme hébreu. « Le Seigneur » respecte donc le témoin fourni sans importer une convention fondée sur un autre texte.
- issue: Précision cultuelle de ὁλοκαυτώματα
  choice: les offrandes entièrement brûlées
  alternative: les holocaustes / les offrandes brûlées
  rationale: Le choix retenu conserve l’idée que ces offrandes étaient brûlées en entier, sans employer un terme susceptible d’évoquer d’abord, pour le lecteur moderne, le génocide des Juifs d’Europe.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure comparative « Comme… ainsi… » garde le parallélisme du grec. Le dernier membre du texte grec transmis est syntaxiquement resserré ; la traduction suit le sens contextuel direct, « le feu descendit et consuma », sans tenter de résoudre davantage la difficulté dans le corps du verset.
