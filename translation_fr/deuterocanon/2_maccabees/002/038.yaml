  text: And Moses said[a], “Because it was not eaten, the sin offering was consumed.”
translation:
  language: fr
  text: 'Et Moïse dit : « Parce que l’offrande pour le péché[a] n’avait pas été mangée, elle fut consumée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « ce qui concerne le péché ». L’expression grecque est un idiome biblique courant pour désigner une offrande pour le péché.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν Μωυσῆς
  choice: Et Moïse dit
  rationale: Le simple « Et » conserve la coordination narrative de καί sans imposer une progression temporelle absente du grec.
- source_word: Διὰ τὸ μὴ βεβρῶσθαι
  choice: Parce qu’elle n’avait pas été mangée
  rationale: La construction διά avec l’infinitif substantivé exprime la cause. Le plus-que-parfait français rend naturellement l’infinitif parfait passif βεβρῶσθαι et l’antériorité de l’absence de consommation.
- source_word: τὸ περὶ τῆς ἁμαρτίας
  choice: l’offrande pour le péché
  rationale: Cette expression biblique grecque désigne une offrande sacrificielle liée au péché. « Offrande pour le péché » restitue clairement la valeur cultuelle tout en évitant la formulation opaque « ce qui concerne le péché ».
- source_word: ἀνηλώθη
  choice: fut consumée
  rationale: Le passif de ἀναλίσκω signifie ici que l’offrande a été entièrement consommée ou détruite. « Fut consumée » convient au contexte sacrificiel sans préciser explicitement le moyen, que le grec ne nomme pas.
theological_decisions:
- issue: Valeur cultuelle de τὸ περὶ τῆς ἁμαρτίας
  choice: l’offrande pour le péché
  alternative: ce qui concerne le péché
  rationale: La tournure est un idiome sacrificiel de la Bible grecque. La traduction retenue communique son référent cultuel sans introduire de précision doctrinale étrangère au texte.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient à la narration biblique écrite. Le pronom féminin « elle » reprend naturellement « l’offrande », explicitée ensuite; la formulation conserve la concision et le lien causal du grec.
