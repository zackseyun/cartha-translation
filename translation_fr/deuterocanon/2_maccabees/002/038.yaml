  source_fidelity: Le sens causal de Διὰ τὸ μὴ βεβρῶσθαι est bien rendu, de même que l’idiome sacrificiel τὸ περὶ τῆς ἁμαρτίας par « l’offrande pour le péché ». « fut consumée » rend adéquatement le passif ἀνηλώθη sans imposer le moyen de cette consommation. Le plus-que-parfait français exprime convenablement l’état antérieur impliqué par l’infinitif parfait passif.
  naturalness: Le registre est sobre et naturel. Toutefois, le pronom féminin cataphorique « elle », avant que son référent ne soit exprimé, occasionne une légère gêne de lecture. Nommer l’offrande dans la proposition causale puis la reprendre par « elle » rend la phrase plus claire tout en conservant exactement le rapport causal.
  terminology: « Offrande pour le péché » est une désignation cultuelle juste, claire et non confessionnellement chargée. La note explique utilement l’alternative littérale et reste fidèle à l’idiome grec.
