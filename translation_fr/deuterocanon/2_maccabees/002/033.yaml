  text: And some of those who had followed came near to mark the way[a], but they were not able to find it.
translation:
  language: fr
  text: Quelques-uns de ceux qui avaient suivi s’approchèrent pour marquer le chemin[a], mais ils ne purent le trouver.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la route » ou « l’itinéraire ». Le grec ὁδός peut désigner un chemin, une route ou un itinéraire selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: s’approchèrent
  rationale: Le participe aoriste de προσέρχομαι exprime un mouvement vers le lieu en question. La tournure française coordonnée est naturelle et conserve ce sens directionnel.
- source_word: τινὲς τῶν συνακολουθούντων
  choice: quelques-uns de ceux qui avaient suivi
  rationale: Cette formulation rend explicitement la construction partitive et le participe, sans introduire le terme plus interprétatif « compagnons ».
- source_word: ὥστε ἐπισημήνασθαι τὴν ὁδόν
  choice: pour marquer le chemin
  rationale: Dans ce contexte, ὥστε avec l’infinitif indique le but visé. « Marquer » restitue l’idée de signaler ou de laisser un repère, tandis que « chemin » garde la souplesse de ὁδός.
- source_word: οὐκ ἠδυνήθησαν
  choice: ils ne purent
  rationale: Le passé simple convient au registre narratif français et exprime clairement l’incapacité constatée.
- source_word: εὑρεῖν
  choice: le retrouver
  rationale: Le pronom renvoie au chemin, tandis que « retrouver » exprime naturellement qu’ils cherchaient à localiser de nouveau l’itinéraire suivi. Le grec emploie simplement « trouver », possibilité signalée en note.
