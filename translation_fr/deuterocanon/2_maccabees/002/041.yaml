base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/041.yaml
  text: Likewise also Judas gathered together for us all the things that had been scattered because of the war that had occurred[b][a], and they are with us.
translation:
  language: fr
  text: De même, Judas a lui aussi rassemblé pour nous tout ce qui avait été dispersé à cause de la guerre qui avait eu lieu[a], et tout cela se trouve chez nous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce qui avait été éparpillé ». Le grec ne précise pas ici de quels éléments il s’agit, bien que le contexte laisse penser à des documents ou à des écrits rassemblés.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et cela est auprès de nous ». En grec, un sujet neutre pluriel peut être accompagné d’un verbe au singulier.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως δὲ καὶ
  choice: De même, … lui aussi
  rationale: Cette formulation naturelle en français conserve à la fois le lien comparatif avec ce qui précède et la valeur additive de καί.
- source_word: Ἰούδας
  choice: Judas
  rationale: « Judas » est la forme française traditionnelle du nom grec dans ce contexte et désigne Judas Maccabée.
- source_word: τὰ διεσπεπτωκότα … πάντα
  choice: tout ce qui avait été dispersé
  rationale: Le participe parfait décrit un ensemble demeuré dans un état de dispersion, tandis que πάντα en souligne la totalité. Le neutre reste volontairement général, sans préciser qu’il s’agit d’écrits.
- source_word: διὰ τὸν γεγονότα πόλεμον
  choice: à cause de la guerre qui avait eu lieu
  rationale: La traduction exprime la cause indiquée par διά et la valeur accomplie du participe γεγονότα sans alourdir le français.
- source_word: ἡμῖν
  choice: pour nous
  rationale: 'Le datif s’entend naturellement comme un datif d’intérêt : Judas a effectué ce rassemblement pour la communauté représentée par le narrateur.'
- source_word: ἐπισυνήγαγεν
  choice: a rassemblé
  rationale: « Rassembler » rend clairement l’idée de réunir en un même ensemble portée par le verbe composé.
- source_word: καὶ ἔστιν παρʼ ἡμῖν
  choice: et tout cela se trouve chez nous
  rationale: Cette tournure française restitue la présence ou la disponibilité actuelle des éléments auprès du groupe, tout en tenant compte du verbe grec au singulier avec un sujet neutre pluriel.
