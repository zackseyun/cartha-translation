  text: But when it happened that time had passed and the sun shone out[a], though it had been overcast, a great fire was kindled, so that everyone marveled.
translation:
  language: fr
  text: Or, lorsqu’un certain temps se fut écoulé et que le soleil se mit à briller, bien qu’il fût voilé par les nuages[a], un grand feu s’alluma, si bien que tous furent émerveillés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « alors qu’il était voilé par les nuages ». Le grec peut exprimer ici une simple circonstance plutôt qu’une opposition.'
    reason: ambiguïté syntaxique de la valeur circonstancielle ou concessive du participe
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο καὶ χρόνος διῆλθεν
  choice: Or, lorsqu’un certain temps se fut écoulé
  rationale: Cette formulation rend la transition narrative introduite par δέ ainsi que l’idée d’un laps de temps achevé, sans reproduire lourdement l’expression grecque ὡς… ἐγένετο.
- source_word: ὅ τε ἥλιος ἀνέλαμψεν
  choice: et que le soleil se mit à briller
  rationale: ἀναλάμπω exprime ici le fait de se mettre à luire ou de briller soudainement; la tournure française est naturelle et garde la progression du récit.
- source_word: ἐπινεφὴς ὤν
  choice: bien qu’il fût voilé par les nuages
  rationale: L’adjectif qualifie grammaticalement le soleil comme couvert ou voilé de nuages. La valeur concessive rend intelligible la tension avec « se mit à briller », tout en signalant en note la possibilité d’une lecture strictement circonstancielle.
- source_word: ἀνήφθη πυρὰ μεγάλη
  choice: un grand feu s’alluma
  rationale: Le passif grec signifie qu’un feu fut allumé ou prit feu. « S’alluma » est idiomatique et ne précise pas la cause de l’embrasement, que le grec ne nomme pas.
- source_word: ὥστε θαυμάσαι πάντας
  choice: si bien que tous furent émerveillés
  rationale: ὥστε avec l’infinitif marque ici le résultat, et πάντας conserve la portée universelle de « tous ».
theological_decisions:
- issue: Nature de πυρά dans le contexte
  choice: Traduire simplement par « feu »
  alternative: « feu sacrificiel » ou « brasier »
  rationale: Même si le contexte plus large peut évoquer un sacrifice, le grec dit seulement πυρά. La traduction n’ajoute donc aucune précision cultuelle absente de cette phrase.
- issue: Rapport entre l’éclat du soleil et la couverture nuageuse
  choice: Rendre ἐπινεφὴς ὤν par une proposition concessive simultanée
  alternative: Comprendre que le ciel avait auparavant été couvert
  rationale: Le participe présent indique naturellement une circonstance concomitante et ne marque pas explicitement l’antériorité. La traduction préserve ainsi l’étonnante coexistence du soleil brillant et des nuages, plutôt que de la résoudre en une simple succession météorologique.
translation_notes:
  register: Français international moderne, narratif et digne. « Or » marque la transition sans lourdeur; le passé simple et le subjonctif imparfait maintiennent un registre littéraire accessible adapté au récit biblique.
