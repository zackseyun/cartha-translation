base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/049.yaml
  text: and to recover the sanctuary renowned throughout the whole inhabited world[a], and to free the city, and to restore the laws that were about to be abolished, since the Lord was showing them mercy with all forbearance[b],
translation:
  language: fr
  text: et de reprendre possession du sanctuaire renommé dans tout le monde habité[a], de libérer la ville et de rétablir les lois qui étaient sur le point d’être abolies, car le Seigneur leur faisait miséricorde avec toute clémence[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « dans le monde entier » ; le grec dit littéralement « dans tout le monde habité ».

      '
    reason: lexical_alternative
  - marker: b
    text: 'Ou « avec toute douceur » ou « avec toute indulgence ».

      '
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβόητον
  choice: renommé
  rationale: L’adjectif désigne ce dont on parle beaucoup, donc ce qui est célèbre ou renommé. « Renommé » conserve le registre élevé et convient au sanctuaire.
- source_word: καθʼ ὅλην τὴν οἰκουμένην
  choice: dans tout le monde habité
  rationale: Cette formulation garde l’expression grecque, qui désigne le monde habité ou connu, sans lui imposer d’emblée le sens moderne de la planète entière.
- source_word: ἱερόν
  choice: sanctuaire
  rationale: Le nom désigne ici le lieu sacré de Jérusalem, vraisemblablement l’ensemble du Temple considéré dans son caractère saint. « Sanctuaire » évite de préciser davantage que le grec.
- source_word: ἀνακομίσασθαι
  choice: reprendre possession de
  rationale: Dans ce contexte, le moyen exprime l’idée de recouvrer ou de reprendre ce qui avait été perdu. « Reprendre possession de » rend naturellement la reconquête du sanctuaire.
- source_word: ἐλευθερῶσαι
  choice: libérer
  rationale: Le verbe signifie affranchir ou rendre libre; « libérer la ville » exprime clairement sa portée politique.
- source_word: τοὺς μέλλοντας καταλύεσθαι νόμους
  choice: les lois qui étaient sur le point d’être abolies
  rationale: μέλλοντας avec l’infinitif passif marque une abolition imminente; la traduction conserve à la fois la menace et sa proximité.
- source_word: ἐπανορθῶσαι
  choice: rétablir
  rationale: Le verbe signifie remettre debout, restaurer ou remettre en bon état. « Rétablir » convient particulièrement à des lois menacées d’abolition.
- source_word: τοῦ κυρίου
  choice: le Seigneur
  rationale: Le contexte attribue la miséricorde à Dieu; « le Seigneur » est la désignation française naturelle pour cette référence divine.
- source_word: μετὰ πάσης ἐπιεικείας
  choice: avec une entière clémence
  rationale: ἐπιείκεια peut évoquer la douceur, la bonté indulgente ou la clémence. Avec l’action miséricordieuse de Dieu, « une entière clémence » rend bien cette nuance sans l’aplatir.
- source_word: ἐλεημονοῦντος αὐτοῖς
  choice: leur faisait miséricorde
  rationale: Le participe au génitif présente l’action miséricordieuse du Seigneur comme la circonstance qui rend possibles les actions précédentes. L’imparfait préserve sa valeur continue.
theological_decisions:
- issue: Valeur de κύριος
  choice: le Seigneur
  alternative: le maître
  rationale: Le sujet de l’action miséricordieuse est Dieu dans ce contexte. « Le Seigneur » conserve cette référence théologique sans introduire une interprétation confessionnelle particulière.
- issue: Lien logique du génitif absolu τοῦ κυρίου… ἐλεημονοῦντος
  choice: car le Seigneur leur faisait miséricorde
  alternative: le Seigneur leur faisant miséricorde
  rationale: Le génitif absolu exprime ici la circonstance causale ou explicative de la restauration. « Car » rend cette relation naturellement, tout en laissant intacte l’idée que le succès dépend de la miséricorde divine.
translation_notes:
  register: Français moderne, courant et digne. La coordination infinitive est conservée afin que ce fragment puisse s’insérer dans la phrase plus longue du contexte. « Monde habité » garde l’image grecque, tandis que les notes signalent des formulations françaises plus idiomatiques.
