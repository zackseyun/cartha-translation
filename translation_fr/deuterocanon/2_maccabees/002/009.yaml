base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/009.yaml
  text: Since we are about to celebrate the purification of the temple on the twenty-fifth of Chislev[a], we thought it necessary to make this clear to you, so that you also may celebrate the festival of booths and of the fire, when Nehemiah, who built the temple and the altar[c][b], offered sacrifices.
translation:
  language: fr
  text: Comme nous allons célébrer, le vingt-cinq du mois de Kislev, la purification du Temple, nous avons jugé nécessaire de vous donner ces précisions, afin que vous célébriez, vous aussi, la fête des Cabanes et celle du feu[a], lorsque Néhémie, qui avait bâti le Temple et l’autel[b], offrit des sacrifices.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « celle du feu » est très concise en grec. Elle semble renvoyer à la commémoration liée aux sacrifices de Néhémie et au récit du feu rapporté dans la suite du contexte.
    reason: Note culturelle et syntaxique préservant l’ellipse du grec.
  - marker: b
    text: 'Grec : « bâti ». Le contexte historique peut conduire à comprendre « rebâti », mais le texte ne l’exprime pas explicitement.'
    reason: Alternative lexicale historiquement plausible, mais non marquée dans la source.
lexical_decisions:
- source_word: Μέλλοντες ἄγειν
  choice: Comme nous allons célébrer
  rationale: Avec une fête pour complément, ἄγω signifie « célébrer » ; μέλλοντες exprime ici l’imminence.
- source_word: ἐν τῷ Χασελεὺ πέμπτῃ καὶ εἰκάδι
  choice: le vingt-cinq du mois de Kislev
  rationale: Formulation française naturelle de la date donnée en grec ; « Kislev » est la translittération française courante du nom du mois.
- source_word: τὸν καθαρισμὸν τοῦ ἱεροῦ
  choice: la purification du Temple
  rationale: καθαρισμός désigne une purification, et ἱερόν renvoie ici au Temple ; la majuscule indique l’édifice de Jérusalem sans ajouter d’interprétation.
- source_word: δέον ἡγησάμεθα διασαφῆσαι ὑμῖν
  choice: nous avons jugé nécessaire de vous donner ces précisions
  rationale: Rend le jugement de nécessité exprimé par δέον ἡγησάμεθα et la valeur explicative de διασαφῆσαι dans un français naturel.
- source_word: ἵνα καὶ αὐτοὶ ἄγητε
  choice: afin que vous célébriez, vous aussi
  rationale: La proposition finale et l’insistance de καὶ αὐτοί sont conservées.
- source_word: σκηνοπηγίας
  choice: la fête des Cabanes
  rationale: Le terme désigne la fête juive des huttes ou cabanes ; cette traduction française en communique directement le sens.
- source_word: καὶ τοῦ πυρός
  choice: et celle du feu
  rationale: « Celle » explicite seulement l’ellipse grammaticale, tandis que « du feu » conserve la formulation brève et ambiguë du grec.
- source_word: ὅτε Νεεμίας
  choice: lorsque Néhémie
  rationale: Traduction directe de la proposition temporelle introduite par ὅτε, sans résoudre son rattachement syntaxique incertain.
- source_word: ὁ οἰκοδομήσας τό τε ἱερὸν καὶ τὸ θυσιαστήριον
  choice: qui avait bâti le Temple et l’autel
  rationale: οἰκοδομέω signifie littéralement « bâtir ». Le plus-que-parfait français situe naturellement l’action avant l’offrande, sans transformer « bâti » en « rebâti ».
- source_word: ἀνήνεγκεν θυσίας
  choice: offrit des sacrifices
  rationale: Dans un contexte cultuel, ἀναφέρω signifie offrir ou faire monter un sacrifice.
theological_decisions:
- issue: Désignation de σκηνοπηγίας
  choice: la fête des Cabanes
  alternative: la fête des Tentes ; la fête des Tabernacles
  rationale: « Cabanes » traduit le sens du nom de la fête dans un français accessible, sans privilégier le terme ecclésiastique traditionnel « Tabernacles ».
- issue: Interprétation de καὶ τοῦ πυρός
  choice: et celle du feu
  alternative: et la fête du feu ; et du feu
  rationale: Le grec est elliptique. La traduction rétablit uniquement le support grammatical attendu en français, sans préciser la nature exacte de cette célébration ni anticiper le récit suivant.
- issue: Valeur de οἰκοδομήσας
  choice: avait bâti
  alternative: avait rebâti
  rationale: Le contexte historique peut suggérer une reconstruction, mais le verbe grec ne porte pas explicitement le préfixe ou la nuance « re- » ; le texte principal conserve donc « bâti ».
- issue: Rattachement de ὅτε Νεεμίας
  choice: lorsque Néhémie… offrit des sacrifices
  alternative: la fête du feu, instituée lorsque Néhémie… offrit des sacrifices
  rationale: La syntaxe grecque est condensée et le lien précis avec les célébrations précédentes demeure difficile. La traduction garde la proposition temporelle sans ajouter « instituée » ou une autre relation absente du texte.
translation_notes:
  register: Français international moderne, digne et lisible. « Temple » et « Cabanes » reçoivent une majuscule comme désignations propres dans ce contexte. La phrase conserve la densité et les tensions syntaxiques du grec, notamment autour de « celle du feu » et de « lorsque Néhémie », tout en restant naturelle en français.
