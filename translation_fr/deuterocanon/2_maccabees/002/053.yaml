  text: And for us[a], who have undertaken the hardship of making the abridgment, the task is not easy, but one of sweat and sleeplessness;
translation:
  language: fr
  text: 'Pour nous qui avons assumé la peine de faire ce résumé[a], la tâche n’est pas facile : elle exige sueur et nuits sans sommeil.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « qui avons manifesté la peine du résumé ». L’expression grecque est quelque peu idiomatique; elle évoque le fait d’avoir pris sur soi et enduré le travail nécessaire à la réalisation du résumé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμῖν μὲν τοῖς
  choice: Pour nous qui
  rationale: Le datif et la construction avec article et participe désignent les rédacteurs en les caractérisant par le travail qu’ils ont accompli. « Pour nous qui » est naturel en français et conserve cette référence explicative.
- source_word: τὴν κακοπάθειαν
  choice: la peine
  rationale: κακοπάθεια évoque une épreuve ou un labeur pénible. Dans ce contexte de travail rédactionnel, « la peine » exprime l’effort éprouvant sans suggérer spécifiquement la persécution.
- source_word: ἐπιδεδειγμένοις
  choice: avons assumé
  rationale: Le parfait moyen-passif de ἐπιδείκνυμι signifie littéralement « avoir montré » ou « avoir manifesté ». Avec κακοπάθεια, l’expression est idiomatique et renvoie au fait d’avoir pris sur soi et enduré ce labeur; « avons assumé » en restitue le sens sans effacer la difficulté du grec.
- source_word: τῆς ἐπιτομῆς
  choice: de faire ce résumé
  rationale: ἐπιτομή désigne un abrégé ou un résumé. L’ajout verbal « faire » explicite naturellement en français qu’il s’agit du travail de réduction de l’ouvrage.
- source_word: οὐ ῥᾴδιον
  choice: n’est pas facile
  rationale: Traduction directe et courante de l’adjectif prédicatif, qui souligne la difficulté de l’entreprise.
- source_word: ἱδρῶτος δὲ καὶ ἀγρυπνίας
  choice: elle exige sueur et nuits sans sommeil
  rationale: Les génitifs caractérisent le travail par l’effort physique et les veilles qu’il impose. Cette formulation conserve l’image concrète de la sueur et rend ἀγρυπνία de façon idiomatique.
- source_word: τὸ πρᾶγμα
  choice: la tâche
  rationale: πρᾶγμα désigne ici l’entreprise en cours, c’est-à-dire la confection du résumé. « La tâche » est précis et naturel.
