  text: To go into detail and to make a circuit with the discourse[a], and to be overly busy with the particulars, belongs to the originator of the history;
translation:
  language: fr
  text: Approfondir le sujet, faire le tour du sujet dans son exposé[a] et s’occuper minutieusement des détails, voilà ce qui convient à l’auteur à l’origine de cette histoire ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « déployer longuement son exposé ». Le grec emploie une image de parcours et accumule plusieurs expressions métaphoriques pour évoquer un traitement ample et détaillé du sujet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβατεύειν
  choice: approfondir le sujet
  rationale: Dans cette série d’infinitifs, le verbe évoque une entrée poussée dans la matière plutôt qu’un déplacement concret. Cette formulation naturelle conserve l’idée d’un traitement approfondi.
- source_word: περίπατον ποιεῖσθαι λόγῳ
  choice: parcourir largement la matière dans son exposé
  rationale: L’expression, littéralement liée à l’idée de faire un parcours, est métaphorique et décrit un exposé qui se déploie largement autour du sujet. La traduction maintient l’image du parcours sans produire un français obscur.
- source_word: πολυπραγμονεῖν
  choice: examiner minutieusement
  rationale: Dans ce contexte historiographique, le verbe désigne une attention poussée, voire laborieuse, aux éléments particuliers, et non l’ingérence morale que pourrait suggérer « se mêler de ».
- source_word: ἐν τοῖς κατὰ μέρος
  choice: chaque détail
  rationale: La locution vise les éléments particuliers considérés un à un. « Chaque détail » restitue clairement cette valeur distributive en français courant.
- source_word: τῷ τῆς ἱστορίας ἀρχηγενέτῃ
  choice: à l’auteur premier du récit historique
  rationale: Le terme rare ἀρχηγενέτης désigne celui qui est à l’origine de l’histoire développée que l’abréviateur reprend. « Auteur premier » préserve cette notion d’antériorité et d’origine, tandis que « récit historique » rend ici ἱστορία sans la réduire à la discipline moderne.
- source_word: καθήκει
  choice: voilà ce qui revient à
  rationale: Le verbe indique ce qui incombe ou convient proprement à quelqu’un. Cette tournure française exprime naturellement cette attribution de rôle.
