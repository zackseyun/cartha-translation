  revision_rationale: La seule révision remplace « se manifeste » par « advienne » afin de rendre plus exactement γένηται, sans attribuer explicitement l’action à Dieu ni imposer une interprétation doctrinale. Le reste du texte est fidèle, naturel et conserve les ambiguïtés pertinentes.
