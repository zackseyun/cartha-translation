  yaml_path: translation/deuterocanon/2_maccabees/002/034.yaml
  text: But when Jeremiah learned of it[a], he reproved them and said, “The place will remain unknown until God gathers his people together and shows mercy.”
translation:
  language: fr
  text: 'Mais lorsque Jérémie l’apprit, il leur adressa des reproches et dit : « Le lieu restera inconnu jusqu’à ce que Dieu rassemble le peuple et que la miséricorde advienne[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec, plus littéralement : « jusqu’à ce que Dieu rassemble un rassemblement du peuple et que la miséricorde advienne ».'
    reason: La note signale la répétition nominale inhabituelle du grec et le fait que « la miséricorde » est le sujet grammatical de la dernière proposition, sans agent explicité.
lexical_decisions:
- source_word: ὡς δὲ
  choice: Mais lorsque
  rationale: Introduit à la fois une transition narrative et une circonstance temporelle, dans un français naturel.
- source_word: ἔγνων
  choice: l’apprit
  rationale: L’aoriste de γιγνώσκω exprime ici l’acquisition d’une information; « l’apprit » reprend naturellement l’action mentionnée auparavant.
- source_word: μεμψάμενος αὐτοῖς
  choice: il leur adressa des reproches
  rationale: Conserve la valeur de blâme du participe et son destinataire sans employer un verbe excessivement fort.
- source_word: ἄγνωστος ὁ τόπος ἔσται
  choice: Le lieu restera inconnu
  rationale: « Inconnu » traduit directement ἄγνωστος; « restera » rend en français la continuité de l’état futur suggérée par le contexte.
- source_word: ἕως ἂν συνάγῃ ὁ θεὸς ἐπισυναγωγὴν τοῦ λαοῦ
  choice: jusqu’à ce que Dieu rassemble le peuple
  rationale: La tournure grecque, littéralement proche de « rassemble un rassemblement du peuple », est rendue verbalement sans ajouter le possessif « son », absent du texte.
- source_word: ἔλεος γένηται
  choice: que la miséricorde se manifeste
  rationale: Préserve la miséricorde comme sujet grammatical et évite d’attribuer explicitement à Dieu une action que la syntaxe laisse implicite.
theological_decisions:
- issue: Agent de la dernière proposition
  choice: « que la miséricorde se manifeste »
  alternative: « que Dieu fasse miséricorde »
  rationale: Le grec fait de ἔλεος le sujet grammatical de γένηται. La formulation retenue conserve cette indétermination tout en restant idiomatique.
- issue: Rapport entre Dieu et « le peuple »
  choice: « le peuple »
  alternative: « son peuple »
  rationale: L’article défini grec désigne le peuple connu du contexte, mais aucun possessif n’est exprimé; la traduction évite donc de l’ajouter.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la tension du grec dans la dernière proposition plutôt que de préciser silencieusement l’agent de la miséricorde.
