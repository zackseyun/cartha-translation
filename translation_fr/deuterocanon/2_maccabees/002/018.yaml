base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/018.yaml
  text: Gather our dispersion, free those who are enslaved among the nations, look upon those who are despised and abhorred; and let the nations know that you are our God.
translation:
  language: fr
  text: Rassemble notre peuple dispersé[a], libère ceux qui sont réduits en esclavage parmi les nations, porte ton regard sur ceux qui sont méprisés et tenus en horreur[b] ; que les nations sachent que tu es notre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « notre dispersion ». Le nom abstrait grec peut désigner collectivement les membres du peuple qui sont dispersés.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « prends en considération ceux qui sont méprisés et tenus en horreur ». L’expression demande à Dieu de tourner son attention vers eux, sans préciser explicitement la suite donnée à ce regard.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνάγαγε τὴν διασπορὰν ἡμῶν
  choice: Rassemble notre peuple dispersé
  rationale: L’impératif appelle Dieu à réunir la communauté dispersée. Le grec emploie littéralement le nom abstrait « notre dispersion », mais le français courant désigne plus naturellement ici les personnes dispersées ; une note conserve la forme et l’ambiguïté de l’original.
- source_word: ἐλευθέρωσον τοὺς δουλεύοντας
  choice: libère ceux qui sont réduits en esclavage
  rationale: ἐλευθερόω exprime une mise en liberté, tandis que δουλεύω indique ici une condition d’asservissement plutôt qu’un service volontaire. Cette formulation rend clairement les deux éléments.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: parmi les nations
  rationale: Dans ce contexte, ἔθνη désigne les peuples au milieu desquels les membres d’Israël sont dispersés. « Les nations » reste naturel et évite la charge confessionnelle possible de « les païens ».
- source_word: τοὺς ἐξουθενημένους καὶ βδελυκτοὺς
  choice: ceux qui sont méprisés et tenus en horreur
  rationale: La première expression évoque des personnes considérées comme insignifiantes ou méprisables ; la seconde, des personnes devenues objets de répulsion. « Tenus en horreur » rend clairement la valeur passive contextuelle.
- source_word: ἔφιδε
  choice: porte ton regard sur
  rationale: L’impératif demande à Dieu de tourner son attention vers les opprimés. Cette expression garde le registre de la prière sans expliciter indûment la compassion ou l’intervention qui peuvent être sous-entendues.
- source_word: καὶ γνώτωσαν τὰ ἔθνη
  choice: que les nations sachent
  rationale: Le subjonctif français rend naturellement la force jussive du troisième impératif grec dans le prolongement de la prière.
- source_word: ὅτι σὺ ὁ θεὸς ἡμῶν
  choice: que tu es notre Dieu
  rationale: Cette formulation directe préserve la confession relationnelle et communautaire du grec.
theological_decisions:
- issue: Sens de δουλεύοντας dans la situation des Juifs vivant parmi les nations
  choice: ceux qui sont réduits en esclavage
  alternative: ceux qui servent
  rationale: Le parallélisme avec la libération demandée et le contexte d’oppression indiquent une condition de servitude, non un service volontaire.
- issue: Valeur collective du nom abstrait διασπορά
  choice: notre peuple dispersé, avec note littérale
  alternative: notre dispersion
  rationale: Le grec peut nommer par abstraction soit l’état de dispersion, soit la communauté dispersée. Le texte français exprime naturellement la lecture collective sans supprimer la forme littérale, signalée en note.
- issue: Portée de ἔφιδε
  choice: porte ton regard sur
  alternative: prends pitié de
  rationale: Le verbe demande explicitement à Dieu de regarder ou de considérer ces personnes. La compassion est plausible dans la prière, mais l’inscrire directement dans le texte résoudrait une nuance que le grec laisse implicite.
translation_notes:
  register: Français international moderne, digne et adapté à une prière. Les impératifs sont directs sans être archaïques. Le point-virgule distingue la dernière demande tout en conservant l’unité de la supplication.
