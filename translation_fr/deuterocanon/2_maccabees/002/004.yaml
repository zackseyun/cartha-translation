  yaml_path: translation/deuterocanon/2_maccabees/002/004.yaml
  text: For when the leader and the force around him[a], which seemed invincible, had arrived, they were cut down in the temple of Nanaia, because the priests attending Nanaia had used deceit.
translation:
  language: fr
  text: Car, quand le chef arriva avec les forces qui l’accompagnaient et qui semblaient invincibles[a], ils furent massacrés dans le temple de Nanaia, par une ruse des prêtres de Nanaia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui semblaient irrésistibles » ; l’expression grecque décrivant ces forces est difficile.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος
  choice: furent arrivés
  rationale: Dans la suite narrative, le participe de γίνομαι exprime le mieux ici l’arrivée du chef avec ses forces, plutôt qu’un changement d’état. Le grec emploie curieusement le singulier malgré le sujet coordonné; le français requiert le pluriel.
- source_word: ἡγεμών
  choice: chef
  rationale: Terme général désignant celui qui dirige ou commande, sans préciser indûment une fonction civile telle que « gouverneur ».
- source_word: ἡ περὶ αὐτὸν ... δύναμις
  choice: les forces qui l’accompagnaient
  rationale: Dans ce contexte militaire, δύναμις désigne des troupes; περὶ αὐτόν renvoie idiomatiquement à celles qui entourent et accompagnent le chef.
- source_word: ἀνυπόστατος δοκοῦσα εἶναι
  choice: lesquelles semblaient invincibles
  rationale: Dans le contexte militaire, l’expression décrit le mieux des forces auxquelles personne ne paraît pouvoir résister. La note conserve une autre formulation possible de cette expression difficile.
- source_word: κατεκόπησαν
  choice: ils furent abattus
  rationale: Le passif décrit une mise à mort violente. « Abattus » demeure expressif et naturel sans introduire nécessairement l’image précise d’armes tranchantes.
- source_word: ἐν τῷ τῆς Ναναίας ἱερῷ
  choice: dans le sanctuaire de Nanaia
  rationale: ἱερόν peut désigner un temple ou un sanctuaire; « sanctuaire » convient naturellement au lieu cultuel sans en préciser excessivement l’architecture.
- source_word: παραλογισμῷ χρησαμένων
  choice: avaient eu recours à la tromperie
  rationale: Le génitif absolu indique la circonstance ou le moyen du massacre; cette tournure rend clairement l’emploi d’une ruse trompeuse.
- source_word: τῶν περὶ τὴν Ναναίαν ἱερέων
  choice: les prêtres attachés au culte de Nanaia
  rationale: La construction περὶ avec l’accusatif désigne ici les prêtres associés au service cultuel de Nanaia; la formulation française explicite cette relation sans possessif ambigu.
theological_decisions:
- issue: Transcription du nom divin Ναναία
  choice: Nanaia
  alternative: Nanaïa ; Nanaya
  rationale: Il s’agit du nom propre d’une déesse; il est donc transcrit plutôt que traduit. « Nanaia » suit de près la forme grecque fournie sans lui donner une forme confessionnelle particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination du chef et des forces, suivie d’un verbe au pluriel, est maintenue. « Sanctuaire » et « attachés au culte » rendent le cadre religieux avec clarté, sans ajouter de précision étrangère au grec.
