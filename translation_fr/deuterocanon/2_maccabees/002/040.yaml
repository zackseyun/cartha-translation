base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/040.yaml
  text: The same things were also related in the records and in the memoirs concerning Nehemiah[a], and how, in founding a library, he gathered together the books about the kings and prophets, and the writings of David[b], and letters of kings concerning votive offerings.
translation:
  language: fr
  text: Les mêmes faits étaient également rapportés dans les archives et dans les mémoires concernant Néhémie, et comment Néhémie, en fondant une bibliothèque[a], rassembla les livres sur les rois et les prophètes, les écrits de David, ainsi que des lettres de rois concernant des offrandes consacrées[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « alors qu’il établissait une bibliothèque ». Le participe grec peut désigner l’action de fonder ou de mettre en place cette bibliothèque.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit de dons ou d’objets dédiés à Dieu ; on peut aussi traduire par « dons votifs » ou « objets dédiés ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξηγοῦντο
  choice: étaient racontées
  rationale: L’imparfait présente ce que rapportaient les sources écrites. « Étaient racontées » conserve le sens narratif sans imposer celui, plus technique, d’« étaient expliquées ».
- source_word: ἀναγραφαῖς
  choice: archives
  rationale: Le terme désigne ici des documents écrits ou des registres. « Archives » convient au contexte documentaire et reste naturel en français moderne.
- source_word: ὑπομνηματισμοῖς
  choice: mémoires
  rationale: Dans ce contexte, le mot renvoie vraisemblablement à des écrits destinés à conserver le souvenir d’événements, plutôt qu’à des commentaires formels.
- source_word: τοῖς κατὰ τὸν Νεεμίαν
  choice: concernant Néhémie
  rationale: Cette formulation rend la relation générale exprimée par κατά sans attribuer avec certitude la rédaction des mémoires à Néhémie lui-même.
- source_word: καταβαλλόμενος
  choice: alors qu’il constituait
  rationale: Le participe évoque l’établissement ou la mise en place de la bibliothèque. « Constituait » exprime naturellement la formation progressive d’une collection.
- source_word: βιβλιοθήκην
  choice: une bibliothèque
  rationale: C’est le sens direct du mot grec, qui peut désigner une bibliothèque ou une collection de livres.
- source_word: ἐπισυνήγαγεν
  choice: rassembla
  rationale: Le verbe exprime l’action de réunir en un même ensemble ; « rassembla » en restitue clairement la force.
- source_word: τὰ περὶ τῶν βασιλέων καὶ προφητῶν βιβλία
  choice: les livres sur les rois et les prophètes
  rationale: « Sur » traduit simplement περὶ et évite de faire de ces rois et prophètes les auteurs des livres.
- source_word: τὰ τοῦ Δαυείδ
  choice: les écrits de David
  rationale: L’expression grecque est elliptique. « Les écrits de David » la rend intelligible sans préciser qu’il s’agit nécessairement des Psaumes ni trancher la nature exacte du lien avec David.
- source_word: ἐπιστολὰς βασιλέων
  choice: des lettres de rois
  rationale: Cette traduction proche du grec préserve la possibilité de lettres écrites ou émises par des rois.
- source_word: περὶ ἀναθεμάτων
  choice: concernant des offrandes consacrées
  rationale: Dans ce contexte cultuel, ἀναθήματα désigne des objets ou des dons dédiés à Dieu, et non des « anathèmes » au sens ecclésiastique ultérieur.
theological_decisions:
- issue: Sens de ἀναθεμάτων
  choice: offrandes consacrées
  alternative: dons votifs ; objets dédiés
  rationale: Le contexte du sanctuaire favorise le sens de dons mis à part pour Dieu. Cette traduction évite le contresens théologique que produirait « anathèmes », tout en gardant ouverte la nature exacte des objets.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe explicite que Néhémie est le sujet de l’action sans affirmer qu’il est l’auteur des mémoires. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils expliquent.
