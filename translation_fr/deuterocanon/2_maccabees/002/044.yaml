base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/044.yaml
  text: But God[a], who saved all his people and gave his inheritance to all, and the kingship, and the priesthood, and the sanctification[c][b],
translation:
  language: fr
  text: Mais Dieu, qui a sauvé tout son peuple et rendu à tous son héritage[a], ainsi que la royauté[b], le sacerdoce et la consécration[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « donné à tous son héritage ». Le verbe grec peut signifier donner, rendre ou restituer.
    reason: lexical_alternative
  - marker: b
    text: Ou « le royaume » ou « la dignité royale ». Le terme grec peut désigner le règne, le pouvoir royal ou un royaume.
    reason: lexical_alternative
  - marker: c
    text: Ou « la sanctification » ou « la sainteté ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ θεός
  choice: Mais Dieu
  rationale: δέ assure ici la continuité tout en pouvant marquer un contraste léger; « Mais Dieu » conserve cette articulation dans un français naturel.
- source_word: ὁ σώσας
  choice: qui a sauvé
  rationale: Le participe aoriste présente l’action salvatrice comme accomplie; la proposition relative est idiomatique en français.
- source_word: τὸν πάντα λαὸν αὐτοῦ
  choice: tout son peuple
  rationale: La construction désigne collectivement la totalité du peuple appartenant à Dieu.
- source_word: ἀποδοὺς
  choice: rendu
  rationale: ἀποδίδωμι exprime couramment l’idée de rendre ou de restituer. Dans ce contexte de rétablissement des privilèges du peuple, « rendu » restitue cette nuance sans exclure l’idée de don.
- source_word: τὴν κληρονομίαν αὐτοῦ
  choice: son héritage
  rationale: Le possessif grec singulier renvoie le plus directement à Dieu; le français conserve toutefois la même ambiguïté référentielle formelle.
- source_word: πᾶσιν
  choice: à tous
  rationale: Cette formulation concise garde la portée distributive et renvoie naturellement à tous les membres du peuple.
- source_word: τὸ βασίλειον
  choice: la royauté
  rationale: Dans cette série institutionnelle, βασίλειον peut désigner le pouvoir, la dignité ou la fonction royale; « royauté » évite de limiter le sens à un territoire.
- source_word: τὸ ἱεράτευμα
  choice: le sacerdoce
  rationale: Terme français courant et digne pour l’institution ou la fonction sacerdotale.
- source_word: τὸν ἁγιασμόν
  choice: la consécration
  rationale: Dans une énumération comprenant royauté et sacerdoce, « consécration » exprime naturellement la dimension cultuelle de ἁγιασμός, sans effacer ses sens possibles de sainteté ou de sanctification.
theological_decisions:
- issue: Référent du possessif dans « son héritage »
  choice: Conserver « son héritage », le possessif renvoyant grammaticalement le plus naturellement à Dieu.
  alternative: « leur héritage », en comprenant l’héritage comme celui du peuple.
  rationale: Le grec αὐτοῦ est au singulier et reprend le plus directement θεός. La traduction formelle préserve l’expression sans la résoudre par une paraphrase interprétative.
- issue: Sens de βασίλειον
  choice: « la royauté »
  alternative: « le royaume » ou « la dignité royale »
  rationale: La liste peut viser des prérogatives ou institutions restaurées. « Royauté » maintient la portée abstraite sans exclure entièrement l’idée de règne.
- issue: Sens de ἁγιασμός
  choice: « la consécration »
  alternative: « la sanctification » ou « la sainteté »
  rationale: Le contexte cultuel favorise « consécration », mais le terme grec demeure polysémique; les autres valeurs sont donc signalées en note.
translation_notes:
  register: Français international moderne, digne et lisible. La structure ouverte et la virgule finale sont conservées, car ce verset forme le début d’une phrase qui se poursuit au verset suivant. Les marqueurs de note sont placés immédiatement après les expressions concernées.
