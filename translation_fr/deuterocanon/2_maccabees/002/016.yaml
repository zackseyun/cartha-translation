  text: the only provider, the only righteous one and almighty and eternal, the one who rescues Israel from every evil, who made the fathers chosen and sanctified them;
translation:
  language: fr
  text: toi, l’unique dispensateur[a], le seul juste, tout-puissant et éternel, toi qui sauves Israël de tout mal[b], qui as fait des pères des élus et les as sanctifiés[c] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bienfaiteur » ou « pourvoyeur » pour « dispensateur » (grec χορηγός).
    reason: lexical_alternative
  - marker: b
    text: Ou « de tout malheur » ou « de tout danger » pour « de tout mal » (grec ἐκ παντὸς κακοῦ).
    reason: lexical_alternative
  - marker: c
    text: Ou « consacrés » ou « rendus saints » pour « sanctifiés ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μόνος χορηγός
  choice: l’unique dispensateur
  rationale: « Dispensateur » exprime celui qui fournit et accorde ce qui est nécessaire, tout en convenant au registre solennel d’un titre divin. « Unique » rend l’exclusivité de μόνος sans alourdir la formule.
- source_word: ὁ μόνος δίκαιος
  choice: le seul juste
  rationale: L’adjectif substantivé désigne Dieu comme celui qui, seul, est juste. Cette formulation reste naturelle et conserve la portée morale et judiciaire de δίκαιος.
- source_word: παντοκράτωρ
  choice: tout-puissant
  rationale: Équivalent français consacré et immédiatement compréhensible du titre divin désignant celui qui détient toute puissance.
- source_word: αἰώνιος
  choice: éternel
  rationale: Rend directement la durée sans fin exprimée ici comme attribut divin.
- source_word: ὁ διασώζων
  choice: toi qui sauves
  rationale: διασώζω évoque le fait de sauver en faisant échapper au danger. « Sauver » est direct, naturel et suffisamment large dans ce contexte de prière.
- source_word: ἐκ παντὸς κακοῦ
  choice: de tout mal
  rationale: κακόν peut désigner le mal, le malheur ou le danger. « Tout mal » conserve cette amplitude sans réduire le sens au seul mal moral.
- source_word: τοὺς πατέρας
  choice: des pères
  rationale: Le terme désigne les pères ou ancêtres d’Israël. « Les pères » conserve la désignation traditionnelle et le caractère historique de la formule sans ajouter un possessif absent du grec.
- source_word: ὁ ποιήσας … ἐκλεκτούς
  choice: qui as fait des pères des élus
  rationale: 'Cette construction rend le double accusatif de ποιέω : Dieu a fait des pères des personnes choisies. « Élus » garde ici la force d’ἐκλεκτούς et évite la tournure peu naturelle « rendus choisis ».'
- source_word: ἡγίασας αὐτούς
  choice: les as sanctifiés
  rationale: « Sanctifier » rend l’idée de rendre saint ou de mettre à part pour Dieu, avec la densité théologique et le registre solennel du grec.
theological_decisions:
- issue: Passage des titres au discours direct
  choice: 'Lire les groupes avec article comme des appellations adressées à Dieu : « toi, l’unique dispensateur… »'
  alternative: 'Les présenter à la troisième personne : « l’unique dispensateur… celui qui sauve… »'
  rationale: La forme finie ἡγίασας est à la deuxième personne du singulier (« tu as sanctifié »). Dans cette prière, les nominaux grecs fonctionnent donc comme des appellations directes malgré leur forme nominative. Le français explicite ce mouvement par « toi » et accorde les relatives à la deuxième personne.
- issue: Relation entre l’élection et la sanctification des pères
  choice: « qui as fait des pères des élus et les as sanctifiés »
  alternative: « qui as choisi les pères et les as consacrés »
  rationale: La formulation retenue distingue l’action exprimée par ποιέω avec l’attribut ἐκλεκτούς de l’acte de sanctifier exprimé par le verbe fini ἡγίασας. Elle évite de fusionner silencieusement les deux notions.
- issue: Sens de ἁγιάζω
  choice: « sanctifiés »
  alternative: « consacrés » ou « rendus saints »
  rationale: Le terme peut évoquer à la fois la mise à part et le fait de rendre saint. « Sanctifiés » préserve cette amplitude au lieu de trancher en faveur d’un seul aspect.
translation_notes:
  register: Français international moderne, digne et liturgique sans archaïsmes syntaxiques. Le fragment conserve la ponctuation ouverte du contexte. La répétition de « toi » clarifie l’adresse directe imposée par ἡγίασας, tandis que « les pères » maintient le vocabulaire historique du passage.
