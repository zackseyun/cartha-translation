  text: Therefore let us begin the narrative from this point[a], adding only this much to what has been said before; for it is foolish to be excessive before the history[b], but to abridge the history itself.
translation:
  language: fr
  text: 'Commençons donc le récit à partir d’ici, en ajoutant seulement ceci à ce qui vient d’être dit : il serait insensé de s’étendre longuement avant le récit historique et d’abréger le récit lui-même.'
