lexical_decisions:
- source_word: Ἐντεῦθεν οὖν
  choice: donc ici
  rationale: Marque la transition logique et discursive entre la préface et le récit proprement dit, dans une tournure française naturelle.
- source_word: ἀρξώμεθα
  choice: Commençons
  rationale: Rend le subjonctif exhortatif à la première personne du pluriel.
- source_word: τῆς διηγήσεως
  choice: le récit
  rationale: Désigne la narration écrite qui va commencer; « récit » est courant, digne et précis.
- source_word: τοῖς προειρημένοις τοσοῦτον ἐπιζεύξαντες
  choice: en ajoutant seulement ceci à ce qui vient d’être dit
  rationale: Exprime l’ajout limité d’une dernière remarque aux propos précédents.
- source_word: εὔηθες
  choice: insensé
  rationale: Dans ce contexte, le terme qualifie une pratique littéraire mal avisée; « insensé » conserve la force rhétorique sans registre familier.
- source_word: τὸ μὲν πρὸ τῆς ἱστορίας πλεονάζειν
  choice: s’étendre longuement avant le récit historique
  rationale: πλεονάζειν évoque ici l’excès de développement dans les préliminaires; cette formulation est idiomatique en français.
- source_word: τὴν δὲ ἱστορίαν ἐπιτέμνειν
  choice: abréger le récit lui-même
  rationale: Préserve le contraste entre une préface trop développée et le récit principal écourté.
