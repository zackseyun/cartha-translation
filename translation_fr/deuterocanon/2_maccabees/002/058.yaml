    issue: Intensification de l’idée de traitement détaillé
    rationale: « Dans tous ses détails » peut suggérer un traitement total et exhaustif. Le grec τὸ ἐξεργαστικὸν τῆς πραγματίας désigne le caractère élaboré ou détaillé du traitement, sans exprimer explicitement « tous ».
  - severity: low
    issue: Nuance concessive de συγχωρητέον
    rationale: « Il faut accorder » rend plus précisément l’idée de concession due à l’auteur d’un abrégé que « il faut permettre », tout en restant naturel.
  revised_text: Mais il faut accorder à celui qui réalise un abrégé de rechercher la concision dans l’expression et de renoncer à un traitement détaillé du sujet.[a]
