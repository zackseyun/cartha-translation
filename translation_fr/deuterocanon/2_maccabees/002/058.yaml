base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/058.yaml
  text: But the pursuit of brevity in expression[a], and the refusal of an elaborate treatment of the subject, should be allowed to one who is making an abridgment.
translation:
  language: fr
  text: Mais il faut accorder à celui qui réalise un abrégé de rechercher la concision dans l’expression et de renoncer à un traitement détaillé du sujet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à celui qui réalise une traduction », si μετάφρασις est pris dans son sens le plus courant ; ici, le contexte favorise « abrégé » ou « résumé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: σύντομον
  choice: concision
  rationale: L’adjectif substantivé désigne ici le caractère concis du style; « concision » est naturel et précis en français.
- source_word: λέξεως
  choice: expression
  rationale: Dans ce contexte littéraire, λέξις renvoie à la manière de formuler plutôt qu’à un mot isolé.
- source_word: μεταδιώκειν
  choice: rechercher
  rationale: L’infinitif exprime ce que l’auteur de l’abrégé peut légitimement viser; « rechercher » en conserve la nuance intentionnelle.
- source_word: ἐξεργαστικὸν τῆς πραγματίας
  choice: traiter le sujet dans tous ses détails
  rationale: Cette formulation restitue naturellement l’idée d’un développement approfondi et exhaustif de la matière.
- source_word: παραιτεῖσθαι
  choice: renoncer à
  rationale: Le moyen exprime le fait d’écarter ou de ne pas entreprendre délibérément un traitement détaillé.
- source_word: τῷ τὴν μετάφρασιν ποιουμένῳ
  choice: à celui qui réalise un abrégé
  rationale: Même si μετάφρασις peut signifier « traduction », le prologue décrit ici la réduction en un ouvrage plus bref de l’œuvre de Jason de Cyrène.
- source_word: συγχωρητέον
  choice: il faut permettre
  rationale: Le verbal en -τέον exprime une nécessité ou une concession jugée légitime; cette tournure en garde la force impersonnelle.
theological_decisions:
- issue: Sens de μετάφρασις dans le contexte
  choice: abrégé
  alternative: traduction
  rationale: Le contexte du prologue porte sur la condensation d’une œuvre plus ample. Le sens « abrégé » convient donc mieux, sans effacer l’autre sens lexical possible, signalé en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le contraste grec entre la concision recherchée et le développement détaillé auquel l’abréviateur renonce.
