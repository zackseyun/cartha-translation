revisions:
- from: Mais il faut permettre à celui qui réalise un abrégé de rechercher la concision dans l’expression et de renoncer à traiter le sujet dans tous ses détails.[a]
  to: Mais il faut accorder à celui qui réalise un abrégé de rechercher la concision dans l’expression et de renoncer à un traitement détaillé du sujet.[a]
  rationale: La révision élimine l’ajout implicite d’exhaustivité et affine la nuance de concession du grec. Elle maintient l’ambiguïté lexicale de μετάφρασις en note, tout en privilégiant dans le texte le sens requis par le contexte de l’abrégé de l’œuvre de Jason de Cyrène.
