base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/001.yaml
  text: 'And those in Judea[a], and the council of elders, and Judas, to Aristobulus, teacher of King Ptolemy, who is also of the family of the anointed priests, and to the Jews in Egypt: greetings and good health.'
translation:
  language: fr
  text: 'De la part de ceux qui sont en Judée, du conseil des anciens et de Judas. À Aristobule, précepteur du roi Ptolémée et issu de la lignée des prêtres ayant reçu l’onction[a], ainsi qu’aux Juifs d’Égypte : salut et bonne santé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des prêtres oints ». Il s’agit ici de prêtres ayant reçu l’onction, et non du titre « Christ ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: ceux qui sont en Judée
  rationale: Le grec ne précise pas explicitement « les Juifs » dans cette première expression, contrairement à τοῖς ἐν Αἰγύπτῳ Ἰουδαίοις plus loin. La formulation française conserve cette portée plus large.
- source_word: γερουσία
  choice: conseil des anciens
  rationale: Le terme désigne une assemblée institutionnelle d’anciens. Cette traduction est claire en français moderne et évite « sénat », qui évoquerait une institution différente.
- source_word: διδασκάλῳ
  choice: précepteur
  rationale: Dans le rapport à un roi nommé, « précepteur » exprime naturellement la fonction d’enseignant personnel sans donner à Aristobule autorité sur Ptolémée, ambiguïté que pourrait créer « maître du roi ».
- source_word: ὄντι δὲ ἀπὸ τοῦ τῶν χριστῶν ἱερέων γένους
  choice: et issu de la lignée des prêtres ayant reçu l’onction
  rationale: γένους indique ici l’origine familiale ou la lignée. χριστῶν qualifie les prêtres comme ayant reçu l’onction et n’est pas employé comme titre christologique.
- source_word: χαίρειν καὶ ὑγιαίνειν
  choice: salut et bonne santé
  rationale: Les deux infinitifs appartiennent à la formule épistolaire de salutation et de souhait de bonne santé.
- source_word: Ἰούδας
  choice: Judas
  rationale: « Judas » est la forme française usuelle de ce nom personnel dans le contexte des livres des Maccabées.
theological_decisions:
- issue: Sens de χριστῶν dans τῶν χριστῶν ἱερέων
  choice: prêtres ayant reçu l’onction
  alternative: prêtres consacrés
  rationale: Le mot renvoie ici à l’onction sacerdotale. La traduction explicite ce sens ordinaire sans introduire le titre « Christ » ni effacer l’image concrète de l’onction.
translation_notes:
  register: Français international moderne, digne et lisible. La structure « De la part de… À… » restitue clairement la formule d’adresse grecque, qui juxtapose les expéditeurs au nominatif et les destinataires au datif. Le texte grec fourni correspond à l’ouverture d’une lettre traditionnellement située en 2 Maccabées 1.10, et non à 2.1 ; cette divergence de référence doit être vérifiée au niveau éditorial.
