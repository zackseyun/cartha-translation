  text: And when the priests of Nanea had set them out[a], and he had come with a few men into the enclosure of the sanctuary, they shut the temple as soon as Antiochus entered[c][b],
translation:
  language: fr
  text: Après que les prêtres de Nanaia les eurent exposés[a], et qu’Antiochos se fut avancé avec quelques hommes dans l’enceinte du lieu sacré, ils fermèrent le temple dès qu’il fut entré.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit simplement « les » ; les objets visés ne sont pas précisés dans ce verset.
    reason: cross_reference
  - marker: b
    text: Dans le témoin grec suivi ici, ce verset semble appartenir au récit concernant Antiochos et le temple de Nanaia, rapporté en 2 Maccabées 1.13-15, plutôt qu’au contexte immédiat du chapitre 2. Le texte est traduit tel qu’il est transmis.
    reason: textual_variant
lexical_decisions:
- source_word: προθεμένων αὐτά
  choice: eurent disposé ces objets
  rationale: Le participe aoriste indique que les prêtres avaient placé ou présenté des objets avant l’entrée d’Antiochos. « Ces objets » conserve l’imprécision du pronom grec tout en étant naturel en français.
- source_word: τῶν ἱερέων τοῦ Ναναίου
  choice: les prêtres de Nanaia
  rationale: Le génitif désigne les prêtres liés à la divinité Nanaia. Cette translittération moderne rend la forme grecque sans l’identifier davantage.
- source_word: κἀκεῖνον προσελθόντος μετʼ ὀλίγων
  choice: Antiochos se fut avancé avec quelques hommes
  rationale: Le pronom reprend Antiochos, nommé à la fin de la proposition. « Se fut avancé » rend l’approche, tandis que « hommes » explicite sobrement les compagnons sous-entendus.
- source_word: εἰς τὸν περίβολον τοῦ τεμένους
  choice: dans l’enceinte du lieu sacré
  rationale: περίβολος désigne l’espace délimité autour d’un site, et τέμενος un domaine consacré. La formulation distingue cet espace du temple mentionné ensuite.
- source_word: συγκλείσαντες τὸ ἱερόν
  choice: ils fermèrent le temple
  rationale: συγκλείω exprime l’action de fermer complètement, sans préciser un verrouillage. Ici ἱερόν est rendu par « temple » afin de le distinguer du τέμενος.
- source_word: ὡς εἰσῆλθεν Ἀντίοχος
  choice: dès qu’il fut entré
  rationale: ὡς suivi de l’aoriste a ici une valeur temporelle et souligne que la fermeture intervient au moment de l’entrée d’Antiochos.
