  source_fidelity: 'Le parallélisme est bien rendu : l’architecte porte la responsabilité de l’ensemble de l’ouvrage, tandis que celui qui se charge de son aménagement et de sa peinture examine ce qui convient à son ornementation. « L’ensemble des fondations » est toutefois une formulation trop étroite et peu idiomatique pour τῆς ὅλης καταβολῆς dans cette image, où le mot peut couvrir l’établissement de l’édifice dans son ensemble. La note doit conserver l’alternative plus spécifique de « fondation ».'
