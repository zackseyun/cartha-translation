  text: For just as the architect of a new house must take thought for the whole structure[a], but the one undertaking to decorate it with painted ornament must consider the things suitable for adornment, so also, I think, it is with us.
translation:
  language: fr
  text: En effet, de même que l’architecte d’une maison neuve doit veiller à toute la construction[a], tandis que celui qui entreprend de l’aménager et de la peindre doit examiner ce qui convient à l’ornementation, de même, me semble-t-il, en va-t-il pour nous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à toute la fondation » ou « à la pose complète des fondations ». Le terme grec peut désigner les fondations, mais peut aussi viser plus largement l’établissement de l’ensemble de la construction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: En effet, de même que
  rationale: Rend à la fois la valeur explicative de γάρ et l’introduction comparative, légèrement appuyée, de καθάπερ.
- source_word: ἀρχιτέκτονι
  choice: l’architecte
  rationale: Désigne le maître responsable de la conception et de la construction, plutôt qu’un simple ouvrier.
- source_word: τῆς ὅλης καταβολῆς
  choice: à l’ensemble des fondations
  rationale: Conserve le sens constructif de καταβολή et la portée globale de ὅλης, sans réduire la responsabilité de l’architecte à un seul élément isolé.
- source_word: φροντιστέον
  choice: doit veiller à
  rationale: Exprime naturellement en français l’obligation portée par l’adjectif verbal grec et l’idée d’attention soigneuse.
- source_word: ἐγκαινίζειν
  choice: l’aménager
  rationale: Dans son association avec ζωγραφεῖν et διακόσμησιν, le verbe évoque ici la mise en état ou l’aménagement de la maison plutôt qu’une dédicace cérémonielle; une note conserve l’autre possibilité.
- source_word: ζωγραφεῖν
  choice: la peindre
  rationale: Rend sobrement l’activité picturale sans introduire la technique plus précise, mais non explicitée, de l’encaustique.
- source_word: τὰ ἐπιτήδεια πρὸς διακόσμησιν ἐξεταστέον
  choice: doit rechercher ce qui convient à sa décoration
  rationale: Préserve l’idée d’examiner ou de déterminer les éléments appropriés à l’ornementation, dans un français fluide.
- source_word: οὕτως δοκῶ καὶ ἐπὶ ἡμῶν
  choice: de même, me semble-t-il, en va-t-il pour nous
  rationale: Maintient la conclusion de la comparaison ainsi que la réserve personnelle exprimée par δοκῶ.
