base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/018.yaml
  text: For the concern about wives and children[a], and further about brothers and relatives, weighed less with them[b], but the greatest and first fear was for the consecrated temple.
translation:
  language: fr
  text: Car le souci concernant leurs femmes et leurs enfants, ainsi que leurs frères et leurs proches, comptait moins pour eux[a] ; mais la crainte la plus grande et la première était celle qu’ils éprouvaient pour le temple consacré[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque dit littéralement que ce souci « occupait pour eux une place moindre », c’est-à-dire qu’il était moins prioritaire.
    reason: lexical_alternative
  - marker: b
    text: Ou « leur inquiétude » ou « leur vive préoccupation ». Ici, le grec peut désigner aussi bien la crainte que l’inquiétude anxieuse.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ περὶ γυναικῶν καὶ τέκνων
  choice: le souci au sujet de leurs femmes et de leurs enfants
  rationale: La construction substantivée avec περὶ et le génitif désigne ce qui les préoccupait au sujet de leur famille. « Le souci au sujet de » reste naturel tout en conservant la dimension affective du contexte.
- source_word: ἔτι δὲ ἀδελφῶν καὶ συγγενῶν
  choice: ainsi que de leurs frères et de leurs proches
  rationale: ἔτι δέ ajoute une autre catégorie de membres de la famille. « Proches » rend συγγενῶν de façon courante et inclusive dans ce contexte.
- source_word: ἐν ἥττονι μέρει κείμενος αὐτοῖς
  choice: comptait moins pour eux
  rationale: L’expression signifie littéralement que ce souci occupait pour eux une place moindre. « Comptait moins » exprime clairement une priorité relative, sans laisser entendre une absence d’attachement familial.
- source_word: μέγιστος δὲ καὶ πρῶτος
  choice: première et la plus grande
  rationale: Cette formulation conserve les deux éléments grecs, la primauté et l’intensité, dans un ordre français fluide.
- source_word: ὁ περὶ τοῦ καθηγιασμένου ναοῦ φόβος
  choice: leur crainte […] concernait le temple consacré
  rationale: φόβος garde son sens direct de « crainte », tandis que καθηγιασμένου, participe parfait, indique que le temple a été consacré.
theological_decisions:
- issue: Sens de φόβος dans un contexte militaire et religieux
  choice: crainte
  alternative: inquiétude ; vive préoccupation
  rationale: « Crainte » préserve la force du grec et laisse au contexte le soin d’exprimer qu’il s’agit d’une peur anxieuse pour le temple, plutôt que d’une crainte révérencielle.
- issue: Traduction de καθηγιασμένου ναοῦ
  choice: le temple consacré
  alternative: le temple saint ; le temple sanctifié
  rationale: « Consacré » rend la valeur verbale du participe parfait et souligne le statut cultuel conféré au temple, là où « saint » serait plus général.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase maintient le contraste rhétorique entre l’attachement à la famille et la priorité donnée au temple, sans suggérer que les liens familiaux étaient négligeables.
