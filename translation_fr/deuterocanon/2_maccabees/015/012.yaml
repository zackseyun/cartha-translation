base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/012.yaml
  text: 'His vision was like this: Onias[a], who had become high priest, a noble and good man, modest in bearing, gentle in manner, and one who spoke fittingly, and who from childhood had cultivated all the proper qualities of virtue—this man was stretching out his hands and praying for the whole body of the Jews.'
translation:
  language: fr
  text: 'Voici quelle fut sa vision : Onias, qui était devenu grand prêtre, homme noble et bon, réservé dans son maintien, doux dans sa manière d’être, s’exprimant comme il convenait et ayant cultivé dès l’enfance tout ce qui caractérise la vertu, tendait les mains et priait pour toute la communauté des Juifs.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θεωρία
  choice: vision
  rationale: Dans ce contexte de songe, le terme désigne la scène contemplée plutôt qu’une réflexion abstraite.
- source_word: γενόμενον ἀρχιερέα
  choice: qui avait été grand prêtre
  rationale: Le participe signifie littéralement « étant devenu grand prêtre »; cette formulation française exprime naturellement son statut antérieur sans l’identifier explicitement comme « ancien grand prêtre ».
- source_word: καλὸν καὶ ἀγαθόν
  choice: homme noble et bon
  rationale: Le double qualificatif porte ici sur la valeur morale et le caractère, non sur la beauté physique.
- source_word: αἰδήμονα μὲν τὴν ἀπάντησιν
  choice: réservé dans son maintien
  rationale: La tournure grecque décrit une attitude extérieure empreinte de modestie et de respect, sans qu’il soit nécessaire de la limiter à la façon d’accueillir autrui.
- source_word: πρᾶον δὲ τὸν τρόπον
  choice: doux dans sa manière d’être
  rationale: Cette expression rend le caractère doux et paisible décrit par πρᾶος.
- source_word: λαλιάν προειμένον πρεπόντως
  choice: s’exprimant avec dignité
  rationale: La phrase grecque est difficile; elle présente néanmoins sa parole comme convenable et digne. La traduction reste naturelle sans préciser excessivement le mécanisme verbal.
- source_word: ἐκ παιδὸς ἐκμεμελετηκότα
  choice: ayant cultivé dès l’enfance
  rationale: Le parfait exprime une formation assidue et durable, commencée dans l’enfance.
- source_word: πάντα τὰ τῆς ἀρετῆς ἴδια
  choice: tout ce qui caractérise la vertu
  rationale: La formulation conserve le sens des qualités propres ou caractéristiques de la vertu.
- source_word: κατεύχεσθαι
  choice: priait pour
  rationale: Le verbe désigne ici une prière en faveur d’autrui; le complément français « pour » en fait ressortir la portée intercessrice.
- source_word: τῷ παντὶ τῶν Ἰουδαίων συστήματι
  choice: pour toute la communauté des Juifs
  rationale: σύστημα présente les Juifs comme un ensemble collectif ou un corps constitué; « communauté » est clair et n’importe pas une institution particulière.
theological_decisions:
- issue: Onias représenté en train d’intercéder dans une vision
  choice: Traduire directement qu’il étendait les mains et priait pour toute la communauté des Juifs.
  alternative: Atténuer κατεύχεσθαι en disant seulement qu’il souhaitait du bien aux Juifs.
  rationale: Le grec décrit bien une prière. La traduction conserve cette représentation littéraire et théologique sans en tirer de conclusion doctrinale au-delà du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La longue description grecque est conservée dans une phrase fluide. Aucun marqueur de note n’est requis, puisque « communauté » rend directement la valeur collective de σύστημα.
