base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/005.yaml
  text: But the other said[a], “I also am a ruler upon the earth[b], the one who commands men to take up arms and to carry out the king’s business.” Yet he did not prevail to accomplish his savage purpose.
translation:
  language: fr
  text: 'Mais l’autre déclara : « Moi aussi, je suis un dirigeant sur la terre, moi qui ordonne de prendre les armes[a] et de mener à bien les affaires du roi. » Pourtant, il ne réussit pas à accomplir son odieux dessein[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « lever les armes » ; expression désignant l’action de s’armer ou de partir au combat.'
    reason: lexical_alternative
  - marker: b
    text: Ou « son cruel projet » ou « sa monstrueuse résolution ».
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάστης
  choice: un puissant
  rationale: Le nom désigne une personne qui détient et exerce le pouvoir. « Un puissant » conserve la portée générale de l’affirmation sans faire du personnage un roi ni préciser davantage son statut.
- source_word: προστατάσσων
  choice: moi qui ordonne
  rationale: Le participe exprime l’exercice caractéristique d’une autorité qui donne des ordres. La tournure française garde cette valeur descriptive tout en restant naturelle.
- source_word: αἴρειν τὰ ὅπλα
  choice: prendre les armes
  rationale: Cette expression idiomatique rend clairement l’action militaire évoquée par le grec, qui signifie littéralement lever ou prendre les armes.
- source_word: τὰς βασιλικὰς χρείας ἐπιτελεῖν
  choice: mener à bien les affaires du roi
  rationale: χρείας peut désigner les besoins, les tâches ou les affaires. La formulation retenue reste assez large pour englober le service officiel du roi sans le réduire à des ordres précis.
- source_word: ὅμως
  choice: Pourtant
  rationale: L’adverbe marque un contraste net entre la prétention au pouvoir du personnage et son échec.
- source_word: οὐ κατέσχεν ἐπιτελέσαι
  choice: il ne réussit pas à accomplir
  rationale: Dans ce contexte, la construction indique qu’il n’est pas parvenu à réaliser ce qu’il projetait. Cette formulation restitue directement son échec sans ajouter la cause.
- source_word: σχέτλιον
  choice: odieux
  rationale: L’adjectif porte un jugement fortement péjoratif et peut évoquer ce qui est cruel, effroyable ou révoltant. « Odieux » convient à un dessein et reste naturel en français contemporain.
- source_word: βούλημα
  choice: dessein
  rationale: Le terme désigne une intention délibérée, une volonté ou une résolution. « Dessein » exprime ici un projet hostile mûrement voulu sans en préciser les modalités.
theological_decisions:
- issue: Identification du locuteur comme autorité terrestre dans le contexte de la vision
  choice: Traduire sobrement son affirmation par « Moi aussi, je suis un puissant sur la terre »
  alternative: « Moi aussi, je suis souverain sur la terre » ou « Moi aussi, je détiens le pouvoir sur la terre »
  rationale: Le grec rapporte la prétention du personnage sans lui attribuer explicitement la royauté et sans demander au traducteur de déterminer plus précisément son identité ou la nature de son pouvoir. La formulation retenue préserve cette réserve et la tension narrative.
translation_notes:
  register: Français international moderne, clair et digne. La reprise « moi… moi qui » conserve l’insistance de la déclaration grecque. Les marqueurs de notes ont été placés auprès des expressions qu’ils expliquent.
