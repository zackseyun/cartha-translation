base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/037.yaml
  text: and to keep the thirteenth day of the twelfth month—called Adar in the Syrian language—as a notable day[b][a], one day before Mordecai's day.
translation:
  language: fr
  text: et d’observer le treizième jour du douzième mois — appelé Adar dans la langue locale[a] — comme un jour mémorable, la veille du jour de Mardochée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte littéralement « dans la langue du maître » ou « dans la langue seigneuriale », expression obscure dans ce contexte. On la comprend souvent comme une indication de la langue syrienne ou araméenne, de la langue du pays, ou de la langue courante.
    reason: lexical_alternative
  - marker: b
    text: Cette journée associée à Mardochée renvoie probablement à la célébration des Pourim.
    reason: cross_reference
lexical_decisions:
- source_word: ἔχειν
  choice: faire de … un jour
  rationale: Dans ce contexte calendaire, le verbe exprime le fait de tenir ou d’observer cette date comme spécialement marquée; cette tournure est naturelle en français.
- source_word: ἐπίσημον
  choice: mémorable
  rationale: L’adjectif désigne ce qui est marqué, distingué ou notable. « Mémorable » convient à une journée commémorative sans en faire explicitement une fête officielle.
- source_word: προκαδεκάτην
  choice: treizième jour
  rationale: Le terme ordinal désigne ici le treizième jour, c’est-à-dire le jour précédant le quatorzième.
- source_word: τοῦ δωδεκάτου μηνός
  choice: du douzième mois
  rationale: Rendu direct de l’expression génitive qui situe la date dans le calendrier.
- source_word: Ἀδὰρ
  choice: adar
  rationale: Le nom du mois est translittéré selon son usage français courant.
- source_word: τῇ κυριακῇ φωνῇ
  choice: dans la langue locale
  rationale: La leçon transmise est inhabituelle et signifie littéralement quelque chose comme « dans la langue du maître/seigneur ». Dans ce contexte, elle paraît introduire l’appellation vernaculaire du mois; une note conserve l’incertitude et signale la lecture « syrienne » souvent supposée.
- source_word: πρὸ μιᾶς ἡμέρας
  choice: la veille
  rationale: Expression française naturelle pour « un jour avant ».
- source_word: τῆς Μαρδοχαϊκῆς ἡμέρας
  choice: du jour de Mardochée
  rationale: L’adjectif signifie « relatif à Mardochée ». Le rendu préserve l’allusion sans identifier explicitement cette journée à une fête précise.
theological_decisions:
- issue: Nature de la journée qualifiée par ἐπίσημον
  choice: Une journée commémorative particulièrement marquée
  alternative: Une fête célébrée ou un jour férié officiel
  rationale: Le contexte indique une commémoration, mais l’adjectif grec ne précise ni statut liturgique ni statut légal.
- issue: Sens de τῇ κυριακῇ φωνῇ
  choice: dans la langue locale
  alternative: dans la langue syrienne; dans la langue officielle; littéralement, dans la langue du maître/seigneur
  rationale: La leçon grecque fournie est difficile et ne dit pas formellement « syrienne ». Le contexte appelle une indication linguistique locale; la note expose donc l’ambiguïté au lieu de corriger silencieusement le texte.
- issue: Identification du « jour de Mardochée »
  choice: Maintien de l’expression du texte
  alternative: Identification explicite avec la fête des Pourim
  rationale: L’allusion aux Pourim est probable, mais cette identification n’est pas formulée dans le verset lui-même.
translation_notes:
  register: Français international actuel, clair et digne. La syntaxe reste proche du grec tout en évitant une formulation artificielle. « Mardochée » suit la forme française traditionnelle du nom biblique; « adar » est conservé comme nom du mois.
