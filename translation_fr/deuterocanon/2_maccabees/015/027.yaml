base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/027.yaml
  text: And while fighting with their hands[a], they were praying in their hearts to God, and they struck down no fewer than thirty-five thousand and four hundred[b], having been greatly gladdened by the care of God.
translation:
  language: fr
  text: Tout en combattant de leurs mains, ils priaient Dieu dans leur cœur. Ils n’en abattirent pas moins de 35 400[a], grandement réjouis par la sollicitude de Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec exprime littéralement le nombre comme « trois myriades, cinq mille et quatre cents », soit 35 400. Dans ce témoin, la formulation autour de « cinq mille » est comprimée ou irrégulière; elle est généralement comprise comme désignant ce total.
    reason: textual_variant
  - marker: b
    text: 'Ou : « vivement encouragés par les soins providentiels de Dieu ». Le grec dit plus littéralement : « la sollicitude de Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῖς μὲν χερσὶν ἀγωνιζόμενοι
  choice: Tout en combattant de leurs mains
  rationale: « Combattre » rend naturellement ἀγωνίζομαι dans ce contexte militaire et maintient le contraste entre l’action extérieure des mains et la prière intérieure du cœur.
- source_word: ταῖς δὲ καρδίαις πρὸς τὸν θεὸν εὐχόμενοι
  choice: ils priaient Dieu dans leur cœur
  rationale: Cette formulation française exprime l’intériorité de la prière tout en conservant le contraste avec « de leurs mains ». Le singulier collectif « leur cœur » est idiomatique en français.
- source_word: κατέστρωσαν
  choice: ils en abattirent
  rationale: Dans un récit de bataille, le verbe signifie mettre à terre ou abattre. Le pronom « en » renvoie sans lourdeur aux combattants ennemis mentionnés par le contexte, sans les ajouter explicitement au texte.
- source_word: οὐδὲν ἧττον
  choice: pas moins de
  rationale: Cette expression française restitue l’insistance du grec sur le nombre minimal.
- source_word: μυριάδων πένθων καὶ τετρακισχιλίων
  choice: 35 400
  rationale: La formulation numérique transmise est comprimée ou irrégulière, mais elle vise manifestement trois myriades auxquelles s’ajoutent cinq mille quatre cents, soit 35 400.
- source_word: τῇ τοῦ θεοῦ μεγάλως ἐφρανθέντες ἐπιμελείᾳ
  choice: grandement réjouis par la sollicitude de Dieu
  rationale: « Sollicitude » rend l’idée de soin attentif exprimée par ἐπιμέλεια, tandis que « grandement réjouis » conserve l’intensité de μεγάλως et le sens de ἐφρανθέντες sans transformer explicitement cette sollicitude en terme doctrinal technique.
theological_decisions:
- issue: Faut-il traduire τοῦ θεοῦ ἐπιμελείᾳ par « sollicitude de Dieu » ou par le terme théologique « providence » ?
  choice: la sollicitude de Dieu
  alternative: la providence de Dieu / les soins providentiels de Dieu
  rationale: ἐπιμέλεια désigne d’abord le soin, l’attention ou la sollicitude. La providence divine est une interprétation contextuellement possible, mais « sollicitude » reste plus proche de l’énoncé grec et évite de préciser davantage que le texte.
translation_notes:
  register: Français international moderne, naturel et digne. La structure oppose nettement le combat mené avec les mains à la prière intérieure. « Sollicitude » est soutenu mais courant et préserve le sens du grec sans imposer le terme théologique plus technique de « providence ».
