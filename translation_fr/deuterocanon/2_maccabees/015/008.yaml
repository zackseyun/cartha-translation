base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/008.yaml
  text: And he urged those with him not to fear the attack of the nations, but to keep in mind the help that had previously come to them from heaven, and now to expect the victory that would come to them from the Almighty.
translation:
  language: fr
  text: Il exhortait ceux qui étaient avec lui à ne pas redouter l’assaut des nations, mais à garder à l’esprit les secours qui leur étaient déjà venus du ciel et à attendre maintenant la victoire qui leur viendrait du Tout-Puissant.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεκάλει
  choice: exhortait
  rationale: L’imparfait exprime une exhortation prolongée ou répétée. « Exhortait » en conserve la force dans un registre digne et naturel.
- source_word: τοὺς σὺν αὐτῷ
  choice: ceux qui étaient avec lui
  rationale: Cette formulation reste proche du grec et désigne clairement les hommes qui accompagnaient Judas, sans ajouter une qualification absente du texte.
- source_word: μὴ δειλιᾷν
  choice: à ne pas redouter
  rationale: Le verbe évoque la peur qui fait perdre courage. « Ne pas redouter » convient au contexte militaire sans introduire l’accusation explicite de lâcheté que pourrait suggérer une traduction plus littérale.
- source_word: τὴν τῶν ἐθνῶν ἔφοδον
  choice: l’assaut des nations
  rationale: ἔφοδος désigne une avancée hostile ou un assaut. « Nations » conserve le terme traditionnel pour les peuples non juifs ou étrangers sans surcharger le passage d’une interprétation confessionnelle.
- source_word: ἔχοντας δὲ κατὰ νοῦν
  choice: mais à garder à l’esprit
  rationale: La tournure française restitue naturellement l’idée d’avoir constamment en pensée les interventions antérieures.
- source_word: τὰ προγεγονότα αὐτοῖς ἀπʼ οὐρανοῦ βοηθήματα
  choice: les secours qui leur étaient déjà venus du ciel
  rationale: Le parfait προγεγονότα renvoie à des secours survenus auparavant et dont le souvenir demeure pertinent. Le pluriel « secours » respecte βοηθήματα.
- source_word: τὰ νῦν προσδοκᾷν
  choice: et à attendre maintenant
  rationale: προσδοκᾷν exprime ici une attente confiante. « Attendre » préserve cette orientation vers l’avenir sans rendre la certitude plus explicite que le grec.
- source_word: τὴν παρὰ τοῦ παντοκράτορος ἐσομένην αὐτοῖς νίκην
  choice: la victoire qui leur viendrait du Tout-Puissant
  rationale: La formulation maintient à la fois le caractère futur de la victoire et sa provenance divine, marquée par παρά.
theological_decisions:
- issue: Traduction du titre divin παντοκράτωρ
  choice: le Tout-Puissant
  alternative: le Souverain de tout
  rationale: « Le Tout-Puissant » est le titre français établi et naturel; il conserve la portée théologique du grec sans imposer une formulation philosophique étrangère au contexte.
- issue: Origine divine de la victoire
  choice: la victoire qui leur viendrait du Tout-Puissant
  alternative: la victoire que le Tout-Puissant leur accorderait
  rationale: Le choix retenu suit de plus près la construction grecque avec παρά, qui indique la provenance, et évite de préciser inutilement le mode de l’action divine.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le mouvement de l’exhortation grecque, du souvenir des secours passés à l’attente confiante de la victoire future.
