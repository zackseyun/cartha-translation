base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/030.yaml
  text: And he ordered that the head of Nikanor[a], and the hand with the shoulder, be cut off and carried to Jerusalem—he who with his whole body and soul had fought in the forefront for the citizens, and who had preserved from youth his goodwill toward his fellow countrymen.
translation:
  language: fr
  text: Et il ordonna que l’on coupe la tête de Nicanor[a], ainsi que la main avec l’épaule, et qu’on les transporte à Jérusalem — lui qui, de tout son corps et de toute son âme, avait combattu au premier rang pour ses concitoyens et qui, depuis sa jeunesse, avait gardé sa bienveillance envers ceux de son peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le bras avec l’épaule » ; le grec dit littéralement « la main avec l’épaule » et désigne probablement le membre supérieur tranché.
    reason: alternative lexicale
lexical_decisions:
- source_word: προσέταξεν
  choice: il ordonna
  rationale: L’aoriste de προστάσσω exprime un ordre donné avec autorité; « il ordonna » est naturel et digne en français.
- source_word: ὁ καθʼ ὅλον σώματι καὶ ψυχῇ πρωταγωνιστὴς
  choice: lui qui, de tout son corps et de toute son âme, avait combattu au premier rang
  rationale: La formulation conserve l’image de l’engagement corporel et intérieur total, tandis que « combattu au premier rang » rend la fonction de πρωταγωνιστής sans recourir au faux ami « protagoniste ».
- source_word: ὑπὲρ τῶν πολιτῶν
  choice: pour ses concitoyens
  rationale: πολῖται porte une nuance civique; « ses concitoyens » la restitue tout en indiquant naturellement leur relation avec Judas.
- source_word: τὴν τῆς ἡλικίας εὔνοιαν
  choice: depuis sa jeunesse, avait gardé sa bienveillance
  rationale: Dans ce contexte, τῆς ἡλικίας évoque la période de la jeunesse ou de la vie depuis laquelle cette disposition demeure; la tournure française exprime cette continuité sans rigidité littérale.
- source_word: ὁμοεθνεῖς
  choice: ceux de son peuple
  rationale: Le terme désigne les membres du même peuple ou de la même nation. Cette expression moderne évite de restreindre le sens à la citoyenneté politique.
- source_word: διαφυλάξας
  choice: avait gardé
  rationale: Le verbe marque le maintien fidèle d’une disposition dans le temps; « avait gardé » est direct et naturel.
- source_word: ἀποτεμόντας
  choice: que l’on coupe
  rationale: Le participe accusatif dépend de προσέταξεν et communique le contenu de l’ordre. La construction impersonnelle française rend clairement l’exécution demandée.
- source_word: τὴν χεῖρα σὺν τῷ ὤμῳ
  choice: la main avec l’épaule
  rationale: La traduction garde les termes explicites du grec et laisse en note la possibilité qu’il s’agisse plus largement du bras avec l’épaule.
- source_word: περιφέρειν εἰς Ἰερουσαλήμ
  choice: qu’on les transporte à Jérusalem
  rationale: Avec εἰς, le mouvement vers Jérusalem est central. « Transporter » convient à des restes humains et n’ajoute pas l’idée non certaine d’une procession publique.
theological_decisions:
- issue: Référent des deux descriptions appositives introduites par ὁ
  choice: Les descriptions se rapportent à Judas Maccabée, sujet implicite de « il ordonna ».
  alternative: Les lire comme un éloge narratif plus lâche, sans rattachement syntaxique explicite au sujet.
  rationale: La syntaxe grecque rattache naturellement les deux groupes appositifs à celui qui donne l’ordre. Le tiret préserve la forme élogieuse tout en clarifiant le lien.
- issue: Portée de σώματι καὶ ψυχῇ
  choice: « de tout son corps et de toute son âme »
  alternative: « de tout son être »
  rationale: La traduction conserve les deux termes anthropologiques et leur force rhétorique, sans leur imposer une définition doctrinale ultérieure.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le caractère solennel de l’éloge, avec un tiret pour rendre les appositions grecques sans alourdir la syntaxe. Le nom « Nicanor » suit l’usage français traditionnel.
