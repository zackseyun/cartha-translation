review_pass:
  verdict: approve
  source_fidelity: Le texte rend fidèlement l’ordre de couper la tête et la main avec l’épaule, puis de les transporter à Jérusalem. Les deux groupes descriptifs sont correctement rattachés à Judas, sujet de l’ordre. « De tout son corps et de toute son âme », « avait combattu au premier rang », « ses concitoyens », et « depuis sa jeunesse, avait gardé sa bienveillance » conservent convenablement les nuances de σώματι καὶ ψυχῇ, πρωταγωνιστής, πολῖται, ἡλικία, εὔνοια et ὁμοεθνεῖς. La note maintient à juste titre l’ambiguïté concrète de χεῖρα σὺν τῷ ὤμῳ.
  naturalness: Français moderne, clair et d’un registre convenant au récit historique solennel. La coordination « que l’on coupe … et qu’on les transporte » est naturelle et explicite quant aux objets transportés. Le tiret introduit efficacement l’éloge appositionnel.
  terminology: « Nicanor » est la forme française usuelle. « Concitoyens » restitue la valeur civique de πολιτῶν; « ceux de son peuple » convient à ὁμοεθνεῖς sans réduire indûment le terme à une citoyenneté politique. « Main avec l’épaule » respecte le libellé grec, et la note donne l’alternative nécessaire.
