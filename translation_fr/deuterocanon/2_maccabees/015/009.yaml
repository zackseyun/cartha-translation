  text: And by encouraging them from the Law and the Prophets, and also by reminding them of the struggles they had already completed, he made them more eager.
translation:
  language: fr
  text: Il les encouragea en s’appuyant sur la Loi et les Prophètes ; il leur rappela aussi les combats qu’ils avaient déjà menés à leur terme, et les rendit plus ardents.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραμυθούμενος
  choice: encouragea
  rationale: Dans ce contexte d’exhortation avant le combat, le verbe exprime l’encouragement et le réconfort ; « encouragea » est naturel et précis en français moderne.
- source_word: ἐκ τοῦ νόμου καὶ τῶν προφητῶν
  choice: en s’appuyant sur la Loi et les Prophètes
  rationale: La préposition ἐκ indique ici la source ou le fondement de l’encouragement. Les majuscules signalent les ensembles scripturaires reconnus.
- source_word: τοὺς ἀγῶνας
  choice: les combats
  rationale: Ἀγών peut désigner des luttes, des épreuves ou des combats. Le contexte militaire favorise « combats », sans exclure l’idée plus large d’efforts soutenus.
- source_word: ἐκτετελεκότες
  choice: avaient déjà menés à leur terme
  rationale: Le parfait de ἐκτελέω souligne des combats accomplis jusqu’au bout, plutôt que seulement endurés. « Menés à leur terme » conserve cette nuance d’achèvement.
- source_word: προθυμοτέρους
  choice: plus ardents
  rationale: Le comparatif exprime une disposition accrue à agir avec empressement et courage. « Plus ardents » convient au registre militaire et demeure naturel.
theological_decisions: []
