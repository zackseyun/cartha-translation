  yaml_path: translation/deuterocanon/2_maccabees/015/038.yaml
  text: So[a], since the events concerning Nicanor had turned out in this way, and from those times the city had remained in the possession of the Hebrews[b], I too will bring my account to a close here.
translation:
  language: fr
  text: Ainsi donc, puisque les événements concernant Nicanor s’étaient déroulés de cette manière et que, depuis lors, la ville était restée aux mains des Hébreux, moi aussi, je mettrai ici un terme à mon récit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῶν ... κατὰ Νικάνορα
  choice: les événements concernant Nicanor
  rationale: La tournure désigne globalement ce qui s’est passé au sujet de Nicanor. Cette formulation naturelle conserve la portée récapitulative du grec.
- source_word: χωρησάντων οὕτως
  choice: s’étaient déroulés de cette manière
  rationale: Dans ce contexte, χωρέω décrit la manière dont les événements ont suivi leur cours ou ont abouti; οὕτως renvoie à l’issue qui vient d’être racontée.
- source_word: ἀπ᾿ ἐκείνων τῶν καιρῶν
  choice: depuis lors
  rationale: Cette expression idiomatique française rend clairement le point de départ temporel et la continuité impliquée, sans reproduire artificiellement le pluriel grec.
- source_word: κρατηθείσης τῆς πόλεως ὑπὸ τῶν Ἐβραίων
  choice: la ville était restée aux mains des Hébreux
  rationale: Le passif de κρατέω exprime ici le fait que la ville demeurait sous la maîtrise ou en la possession des Hébreux. «Aux mains de» reste naturel sans préciser davantage la nature politique ou militaire de cette maîtrise.
- source_word: τῆς πόλεως
  choice: la ville
  rationale: Bien que Jérusalem soit le référent contextuel, le grec dit seulement «la ville»; la traduction conserve cette désignation.
- source_word: καὶ αὐτὸς
  choice: moi aussi
  rationale: Cette formulation préserve à la fois la coordination marquée par καί et l’insistance personnelle d’αὐτός.
- source_word: αὐτόθι τὸν λόγον καταπαύσω
  choice: je mettrai ici un terme à mon récit
  rationale: λόγος désigne ici le récit écrit, tandis que καταπαύω signifie l’arrêter ou le mener à sa fin. La formulation française est claire, digne et adaptée à la conclusion de l’ouvrage.
