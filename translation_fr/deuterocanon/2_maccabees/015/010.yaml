  yaml_path: translation/deuterocanon/2_maccabees/015/010.yaml
  text: And after stirring up their spirits[a], he urged them on[b], at the same time pointing out the godlessness of the nations and the violation of oaths.
translation:
  language: fr
  text: Après avoir réveillé leur ardeur, il les exhorta, tout en leur montrant l’impiété des nations[a] et la violation des serments.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des non-Juifs »; selon le contexte, le grec peut désigner les nations étrangères ou les païens.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς θυμοῖς διεγείρας αὐτούς
  choice: Après avoir réveillé leur ardeur
  rationale: θυμός peut désigner l’élan intérieur, le courage, la passion ou la colère. Dans cette exhortation militaire, « leur ardeur » exprime naturellement la résolution combative sans réduire le sens à la colère.
- source_word: παρήγγειλεν
  choice: il les exhorta
  rationale: Le verbe peut signifier ordonner ou donner des consignes, mais le contexte met en avant l’encouragement adressé aux combattants. « Exhorta » conserve à la fois la force directive et la tonalité mobilisatrice.
- source_word: ἅμα παρειδείκνυς
  choice: tout en leur montrant
  rationale: La tournure participiale marque une action simultanée. Cette formulation française est naturelle et garde la valeur explicative du grec.
- source_word: τὴν τῶν ἐθνῶν ἀθεσίαν
  choice: l’impiété des nations
  rationale: ἀθεσία désigne ici l’absence de respect envers Dieu ou la religion. « Impiété » rend précisément la portée religieuse et morale du terme; « nations » maintient l’ambiguïté de ἔθνη sans imposer « païens ».
- source_word: τὴν τῶν ὅρκων παράβασιν
  choice: la violation des serments
  rationale: παράβασις exprime une transgression ou une violation. Le grec ne marque pas explicitement un possessif; « des serments » préserve cette sobriété et reste idiomatique.
theological_decisions:
- issue: Traduction de ἐθνῶν
  choice: nations
  alternative: païens / non-Juifs
  rationale: Dans ce récit historique, « nations » rend directement le terme grec et laisse subsister sa dimension à la fois ethnique et religieuse, sans importer une terminologie confessionnelle plus tardive.
translation_notes:
  register: Français international moderne, digne et accessible. « Réveillé leur ardeur » convient au cadre militaire tout en préservant l’étendue sémantique de θυμός. La phrase suit étroitement la structure grecque sans lourdeur littérale.
