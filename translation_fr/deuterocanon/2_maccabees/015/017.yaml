base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/017.yaml
  text: And having been encouraged by the very noble words of Judas[a], which were able to stir them on to virtue and to make the souls of young men manly, they resolved not merely to make a campaign, but to press on bravely and, engaging with all courage, settle the matter[d][c][b], because the city and the holy things and the temple were also in danger.
translation:
  language: fr
  text: Encouragés par les très nobles paroles de Judas, capables de les pousser à la vertu[a] et de rendre viriles les âmes des jeunes gens[b], ils résolurent de ne pas se contenter de faire campagne[c], mais d’avancer vaillamment et, en engageant le combat avec toute leur vaillance, de trancher l’affaire, car la ville, les choses saintes et le Temple[d] étaient également en danger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « vers l’excellence » ou, dans ce contexte militaire, « vers la vaillance ». Le grec ἀρετή peut avoir une portée morale aussi bien que guerrière.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « rendre viriles les âmes des jeunes gens ». Le grec emploie ici une image explicitement masculine pour exprimer le courage.'
    reason: lexical_alternative
  - marker: c
    text: Il ne s’agit pas d’une décision de ne pas combattre. Ils résolurent de ne pas se contenter de partir en campagne, mais de pousser l’affrontement jusqu’à une issue décisive.
    reason: alternative_reading
  - marker: d
    text: Le grec distingue « les choses saintes » du « Temple » ; les deux expressions sont donc conservées séparément.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακληθέντες
  choice: Encouragés
  rationale: Dans ce contexte militaire, le participe passif exprime l’effet fortifiant et exhortatif des paroles de Judas. « Encouragés » est naturel en français et conserve cet élan vers l’action.
- source_word: πάνυ καλοῖς
  choice: très nobles
  rationale: καλός qualifie ici les paroles dans un sens moral élevé. « Nobles » convient mieux au contexte éthique et martial que le simple « bonnes ».
- source_word: δυναμένοις ἐπ’ ἀρετὴν παρορμῆσαι
  choice: capables de les pousser à la vertu
  rationale: ἀρετή peut désigner la vertu, l’excellence ou la vaillance. « Vertu » préserve l’ampleur morale du terme sans exclure sa résonance guerrière.
- source_word: ψυχὰς νέων ἐπανδρῶσαι
  choice: rendre viriles les âmes des jeunes gens
  rationale: La formulation conserve l’image masculine explicite de ἐπανδρόω ainsi que ψυχαί, malgré son caractère inhabituel en français moderne.
- source_word: διέγνωσαν μὴ στρατεύεσθαι
  choice: ils résolurent non pas simplement de faire campagne
  rationale: La suite montre qu’ils ne renoncent pas au combat. La négation porte donc sur l’idée de se contenter d’une campagne ordinaire, en contraste avec leur résolution d’aller jusqu’à une issue décisive.
- source_word: γενναίως δὲ ἐφέρεσθαι
  choice: mais de s’élancer vaillamment
  rationale: La tournure rend à la fois le mouvement vers l’avant exprimé par ἐφέρεσθαι et le courage de γενναίως.
- source_word: μετὰ πάσης εὐανδρείας
  choice: avec toute leur vaillance
  rationale: εὐανδρεία désigne une bravoure traditionnellement associée à la virilité. « Vaillance » convient au registre martial, tandis que πάσης est rendu par « toute ».
- source_word: ἐμπλακέντες
  choice: après avoir engagé le combat
  rationale: Dans ce contexte, le participe désigne l’entrée effective dans l’affrontement plutôt qu’un simple fait de s’empêtrer.
- source_word: κρῖναι τὰ πράγματα
  choice: trancher l’affaire
  rationale: L’expression évoque une résolution décisive de la situation. « Trancher l’affaire » garde cette force tout en restant idiomatique.
- source_word: τὴν πόλιν καὶ τὰ ἅγια καὶ τὸ ἱερὸν
  choice: la ville, les choses saintes et le Temple
  rationale: Le grec distingue τὰ ἅγια de τὸ ἱερόν. La traduction maintient donc trois éléments distincts au lieu de confondre les réalités saintes avec le Temple.
- source_word: κινδυνεύειν
  choice: étaient eux aussi en danger
  rationale: Cette formulation exprime clairement le motif de leur résolution et rend la valeur additive de καί.
theological_decisions:
- issue: Image masculine dans ψυχὰς νέων ἐπανδρῶσαι et εὐανδρείας
  choice: Conserver dans le texte l’image explicite de la virilité pour ψυχὰς νέων ἐπανδρῶσαι, tout en rendant εὐανδρεία par « vaillance ».
  alternative: « donner du courage aux jeunes gens » ou « affermir le cœur des jeunes »
  rationale: Le grec emploie volontairement un vocabulaire masculin pour exalter le courage guerrier. Une neutralisation complète effacerait un trait rhétorique réel, mais répéter une formulation littéralement masculine dans les deux expressions alourdirait excessivement le français.
- issue: Portée de la négation dans μὴ στρατεύεσθαι
  choice: « non pas simplement de faire campagne »
  alternative: « ne pas faire campagne »
  rationale: Une négation absolue contredirait les infinitifs qui suivent et la situation narrative. Le contraste indique qu’ils ne veulent pas seulement partir en campagne, mais chercher une issue décisive par un engagement courageux.
- issue: Distinction entre τὰ ἅγια et τὸ ἱερόν
  choice: « les choses saintes et le Temple »
  alternative: Réunir les deux sous « le sanctuaire »
  rationale: Le texte source coordonne deux expressions distinctes; les fusionner supprimerait une distinction présente dans le grec, même si la portée exacte de τὰ ἅγια demeure ouverte.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La phrase longue et progressive conserve l’élan rhétorique du grec. Les termes « vaillamment », « vaillance » et « trancher l’affaire » maintiennent le registre martial, tandis que la formulation inhabituelle « rendre viriles les âmes » préserve délibérément l’image du texte source.
