  terminology: « Vertu », « rendre viriles les âmes des jeunes gens », « vaillance », « les choses saintes » et « le Temple » préservent les choix terminologiques défendables et les distinctions du grec. La majuscule à « Temple » est appropriée au temple de Jérusalem dans ce contexte.
