translation_notes:
  register: Français moderne, sobre et narratif. « Quant à Nicanor » marque le contraste porté par μὲν; « plein d’assurance et d’orgueil » conserve la caractérisation morale sans lourdeur. La note maintient ouverte l’incertitude lexicale et textuelle du passage.
