  text: And Nicanor[a], in complete confidence and with arrogant pride, had decided to make a public example of those with Judas.
translation:
  language: fr
  text: Quant à Nicanor, plein d’assurance et d’arrogance, il avait décidé de faire subir un même sort[a] à ceux qui étaient avec Judas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec imprimé est difficile : littéralement, « établir un traitement commun ». On peut aussi le comprendre comme « infliger un même traitement au groupe de Judas ». Certains témoins portent une leçon très proche, « trophée », qui donnerait : « ériger un trophée contre Judas et ses hommes ».'
    reason: textual_and_lexical_alternative
lexical_decisions:
- source_word: μετὰ πάσης ἀσφαλείας
  choice: plein d’assurance
  rationale: Dans ce contexte, l’expression décrit la confiance absolue et le sentiment de sécurité de Nicanor, plutôt qu’une protection matérielle.
- source_word: ὑψαυχενῶν
  choice: et d’orgueil
  rationale: Le participe exprime une attitude hautaine et arrogante. La tournure française l’unit naturellement à l’assurance qui précède.
- source_word: διεγνώκει
  choice: il avait décidé
  rationale: Le plus-que-parfait grec présente une résolution déjà arrêtée.
- source_word: κοινὸν ... τρόπον
  choice: un sort commun
  rationale: Le texte grec fourni porte littéralement une expression proche de « une manière commune », difficile en contexte. « Un sort commun » reste intelligible sans imposer l’idée non explicite de destruction ni celle d’un exemple public.
- source_word: τῶν περὶ τὸν Ἰούδαν
  choice: à ceux qui entouraient Judas
  rationale: Cette expression désigne le groupe associé à Judas sans préciser davantage sa composition.
- source_word: συστήσασθαι
  choice: faire subir
  rationale: Avec l’expression difficile κοινὸν ... τρόπον, ce choix rend naturellement l’idée de faire advenir ou d’imposer un traitement, tout en évitant le calque « établir une manière ».
