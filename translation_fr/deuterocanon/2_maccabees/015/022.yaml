base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/022.yaml
  text: 'And he spoke[a], calling upon him in this way: “You, Master, sent your angel in the time of Hezekiah king of Judea, and he struck down a hundred eighty-five thousand in the camp of Sennacherib.”'
translation:
  language: fr
  text: 'Et il disait, en l’invoquant ainsi : « C’est toi, Maître, qui as envoyé ton ange au temps d’Ézékias, roi de Judée[a], et il fit périr cent quatre-vingt-cinq mille dans le camp de Sennachérib. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « roi de Juda ». Le grec porte « de Judée » (Ἰουδαίας), mais le personnage historique est Ézékias, roi de Juda.
    reason: Alternative lexicale et précision historique.
lexical_decisions:
- source_word: ἔλεγεν
  choice: il disait
  rationale: L’imparfait grec est conservé par un imparfait français naturel dans cette introduction narrative à la prière.
- source_word: ἐπικαλούμενος τόνδε τὸν τρόπον
  choice: en l’invoquant ainsi
  rationale: Le participe exprime l’invocation adressée à Dieu, tandis que « ainsi » introduit directement les paroles prononcées.
- source_word: Σύ, δέσποτα
  choice: C’est toi, Maître
  rationale: La tournure clivée rend l’insistance du pronom explicite Σύ. « Maître » distingue δέσποτα de κύριος et exprime l’autorité souveraine sans les confondre lexicalement.
- source_word: ἀπέστειλας τὸν ἄγγελόν σου
  choice: qui as envoyé ton ange
  rationale: « Envoyer » et « ange » correspondent directement aux termes grecs et conviennent au rappel d’une intervention divine.
- source_word: ἐπὶ Ἐζεκίου
  choice: au temps d’Ézékias
  rationale: Avec le génitif, ἐπί peut situer un événement sous le règne ou au temps d’une personne. Le contexte exclut naturellement l’idée que l’ange aurait été envoyé contre Ézékias.
- source_word: τοῦ βασιλέως τῆς Ἰουδαίας
  choice: roi de Judée
  rationale: Cette formulation traduit directement le toponyme grec Ἰουδαία tout en signalant en note la désignation historique « Juda ».
- source_word: ἀνεῖλεν
  choice: il a abattu
  rationale: Le verbe signifie ici mettre à mort. « Abattre » est clair, vigoureux et adapté au récit d’une défaite militaire.
- source_word: ἐκ τῆς παρεμβολῆς Σενναχηρείμ
  choice: dans le camp de Sennachérib
  rationale: Bien que ἐκ signifie littéralement « hors de/du milieu de », le français idiomatique situe les hommes abattus dans le camp auquel ils appartenaient.
- source_word: εἰς ἑκατὸν ὀγδοήκοντα πέντε χιλιάδας
  choice: cent quatre-vingt-cinq mille hommes
  rationale: La préposition εἰς introduit ici le total atteint. « Hommes » explicite naturellement en français les personnes comptées, sous-entendues en grec.
theological_decisions:
- issue: Rendre δέσποτα sans le confondre avec κύριος
  choice: Maître
  alternative: Seigneur ; Souverain
  rationale: « Maître » préserve la distinction lexicale entre δέσποτα et κύριος. « Souverain » expliciterait davantage l’idée d’autorité absolue, tandis que « Seigneur » effacerait cette distinction.
- issue: Sens de ἐπὶ Ἐζεκίου
  choice: au temps d’Ézékias
  alternative: contre Ézékias ; sous Ézékias
  rationale: Le souvenir biblique évoqué présente l’ange comme intervenant en faveur d’Ézékias contre l’armée de Sennachérib. La valeur temporelle de ἐπί avec le génitif respecte ce contexte sans faire de l’intervention angélique une attaque contre le roi.
translation_notes:
  register: Français international moderne, digne et accessible. La prière garde un ton solennel sans archaïsmes. La structure emphatique « C’est toi » restitue l’accent du grec, et les noms propres suivent les formes françaises bibliques usuelles.
