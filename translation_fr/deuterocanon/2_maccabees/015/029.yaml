  text: And when a cry and turmoil arose[b][a], they blessed the Sovereign in their ancestral language.
translation:
  language: fr
  text: Lorsqu’un cri et du tumulte éclatèrent, ils bénissaient le Souverain[a] dans la langue de leurs ancêtres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Puissant » ou « le Maître »; le titre grec désigne celui qui détient la puissance ou l’autorité.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « avec la voix ancestrale »; l’expression désigne probablement leur langue traditionnelle ou ancestrale.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης
  choice: quand ... s’élevèrent
  rationale: Le participe aoriste dans le génitif absolu exprime ici une circonstance temporelle; cette tournure est naturelle en français.
- source_word: κραυγῆς
  choice: des cris
  rationale: κραυγή désigne un cri puissant ou une clameur. Le pluriel français est idiomatique dans cette scène collective sans préciser indûment la nature des cris.
- source_word: ταραχῆς
  choice: de l’agitation
  rationale: Le mot désigne le trouble ou le tumulte; « agitation » conserve l’idée de désordre tout en restant clair et actuel.
- source_word: εὐλόγουν
  choice: ils bénissaient
  rationale: L’imparfait grec évoque une action en cours; « bénissaient » en conserve à la fois l’aspect et le vocabulaire de la bénédiction.
- source_word: τὸν δυνάστην
  choice: le Souverain
  rationale: δυνάστης désigne celui qui détient puissance ou autorité. Employé pour Dieu, « le Souverain » exprime dignement cette autorité sans ajouter un titre plus précis.
- source_word: τῇ πατρίῳ φωνῇ
  choice: dans leur langue ancestrale
  rationale: φωνή peut désigner ici la langue parlée, et πατρίῳ ce qui vient des ancêtres. Cette formulation moderne conserve la dimension traditionnelle et ethnique.
theological_decisions:
- issue: Rendu du titre divin τὸν δυνάστην
  choice: le Souverain
  alternative: le Puissant; le Maître
  rationale: « Le Souverain » maintient ensemble l’autorité et la puissance impliquées par le grec, sans identifier ce titre à une appellation divine plus spécifique.
translation_notes:
  register: Français international moderne, narratif et digne. L’imparfait « bénissaient » rend l’aspect du verbe grec; les notes préservent l’étendue sémantique du titre divin et l’image littérale de la voix ancestrale.
