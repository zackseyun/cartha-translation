  yaml_path: translation/deuterocanon/2_maccabees/015/014.yaml
  text: Then Onias answered and said[a], “This is Jeremiah, the prophet of God, who loves his brothers and prays much for the people and the holy city.”
translation:
  language: fr
  text: 'Alors Onias répondit : « Voici Jérémie, le prophète de Dieu, celui qui aime ses frères[a] et qui prie beaucoup pour le peuple et pour la ville sainte. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aimant les frères », c’est-à-dire « qui aime ses frères ». Le grec désigne ici l’affection fraternelle de Jérémie envers les membres de son peuple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντα δὲ τὸν Ὀνίαν εἰπεῖν
  choice: Alors Onias prit la parole et dit
  rationale: La tournure grecque introduit la réponse d’Onias. « Prit la parole » est naturel en français narratif et évite le tour redondant « répondit et dit », tout en conservant l’enchaînement du récit.
- source_word: φιλάδελφος
  choice: celui qui aime ses frères
  rationale: L’adjectif signifie littéralement « qui aime ses frères ». Cette formulation naturelle conserve l’image familiale sans la réduire à une simple bienveillance envers le peuple.
- source_word: πολλὰ προσευχόμενος
  choice: qui prie beaucoup
  rationale: Le participe présent décrit une intercession soutenue ou habituelle. « Prie beaucoup » rend directement πολλὰ sans préciser indûment s’il s’agit de fréquence ou d’intensité.
- source_word: περὶ τοῦ λαοῦ
  choice: pour le peuple
  rationale: Dans ce contexte, περί avec la prière indique ceux en faveur de qui Jérémie prie. L’article est conservé, sans ajouter le possessif « son ».
- source_word: τῆς ἁγίας πόλεως
  choice: la ville sainte
  rationale: Traduction directe et idiomatique qui préserve la qualification sacrée de la ville.
- source_word: ὁ τοῦ θεοῦ προφήτης
  choice: le prophète de Dieu
  rationale: Cette formulation suit étroitement la structure grecque et reste naturelle en français.
theological_decisions:
- issue: Portée communautaire de φιλάδελφος dans la scène visionnaire
  choice: celui qui aime ses frères
  alternative: l’ami de ses frères ; celui qui aime les siens
  rationale: Le choix maintient le langage explicitement familial du grec et laisse au contexte le soin d’indiquer qu’il s’agit des membres du peuple, sans substituer une interprétation plus générale.
- issue: Nature de l’intercession exprimée par πολλὰ προσευχόμενος
  choice: qui prie beaucoup
  alternative: qui prie souvent ; qui offre de nombreuses prières
  rationale: Le grec affirme l’ampleur de la prière sans trancher précisément entre fréquence, intensité et multiplicité. La traduction conserve cette relative ouverture.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe de présentation (« Voici Jérémie ») restitue οὗτός ἐστιν de façon naturelle. Le tour « prit la parole et dit » fluidifie l’idiome grec sans supprimer sa fonction de réponse.
