  text: But they declared[a], “The Lord lives; he himself is the ruler in heaven, the one who commanded the observance of the seventh day.”
translation:
  language: fr
  text: 'Mais ils déclarèrent : « Le Seigneur est vivant ; c’est lui, le souverain au ciel, qui a ordonné d’observer le septième jour[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le sabbat ». Le grec dit « le septième » et renvoie ici à l’observance du sabbat.
    reason: Alternative lexicale contextuelle pour τὴν ἑβδόμαδα.
lexical_decisions:
- source_word: ἀποφηναμένων
  choice: ils déclarèrent
  rationale: Le participe introduit leur réponse solennelle et affirmée. « Déclarèrent » en conserve la force mieux que le simple « dirent ».
- source_word: Ἔστιν ὁ κύριος ζῶν
  choice: Il existe un Seigneur vivant
  rationale: Dans le contexte d’une question sur l’existence d’un souverain céleste, ἔστιν a une valeur existentielle. Cette formulation conserve aussi l’épithète « vivant » sans transformer nécessairement la phrase en formule de serment.
- source_word: δυνάστης
  choice: le souverain
  rationale: Le terme désigne celui qui détient la puissance et l’autorité. « Souverain » convient à l’autorité divine tout en restant actuel et digne.
- source_word: κελεύσας
  choice: qui a ordonné
  rationale: Le participe exprime un ordre donné avec autorité. « A ordonné » rend clairement cette force contraignante.
- source_word: ἀσκεῖν
  choice: d’observer
  rationale: Dans ce contexte cultuel, le verbe signifie pratiquer ou respecter régulièrement; « observer » est l’expression française naturelle pour un jour sacré.
- source_word: τὴν ἑβδόμαδα
  choice: le septième jour
  rationale: La traduction garde l’expression grecque littérale, laquelle désigne ici l’observance du sabbat.
theological_decisions:
- issue: Valeur de Ἔστιν dans Ἔστιν ὁ κύριος ζῶν
  choice: Il existe un Seigneur vivant
  alternative: Le Seigneur est vivant / Le Seigneur vit
  rationale: Le contexte immédiat semble répondre à la question de savoir s’il existe un souverain dans le ciel. La valeur existentielle préserve ce lien, tout en laissant subsister la confession que le Seigneur est vivant.
- issue: Traduction de τὴν ἑβδόμαδα
  choice: le septième jour
  alternative: le sabbat
  rationale: Le grec emploie « le septième » plutôt que le terme habituel pour « sabbat ». Le texte principal conserve cette formulation, et la note en explicite la référence.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. La ponctuation met en relief l’identification du Seigneur vivant comme souverain céleste.
