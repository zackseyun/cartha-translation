base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/020.yaml
  text: And when all were already expecting the coming judgment[a], and the enemies had already joined battle, and the army had been drawn up, and the beasts had been suitably stationed in one part, and the cavalry posted on the flanks[b],
translation:
  language: fr
  text: Alors que tous attendaient déjà le jugement à venir[a], que les ennemis avaient déjà engagé le combat, que l’armée avait été rangée en ordre de bataille, que les bêtes avaient été placées avantageusement dans un secteur[b], et que la cavalerie avait été disposée aux ailes,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la décision imminente », « la crise à venir » ou « l’issue prochaine ».
    reason: alternative_reading
  - marker: b
    text: Il s’agit vraisemblablement des éléphants de guerre intégrés au dispositif de bataille.
    reason: cultural_note
lexical_decisions:
- source_word: προσδοκώντων
  choice: attendaient
  rationale: Le participe exprime une attente tendue; « attendaient » est naturel en français et convient à l’imminence du combat.
- source_word: τὴν ἐσομένην κρίσιν
  choice: le jugement qui allait venir
  rationale: κρίσις peut désigner le jugement, la décision ou l’issue décisive. « jugement » conserve la gravité et la possible résonance théologique du grec sans effacer l’ambiguïté, signalée en note.
- source_word: προσμιξάντων τῶν πολεμίων
  choice: les ennemis avaient déjà engagé le combat
  rationale: Dans ce contexte militaire, προσμίγνυμι indique que les forces ennemies sont entrées en contact et ont commencé l’affrontement.
- source_word: τῆς στρατιᾶς ἐκταγείσης
  choice: l’armée avait été rangée en ordre de bataille
  rationale: Le passif décrit la mise en ordre et le déploiement de l’armée; cette expression française rend clairement le sens militaire.
- source_word: τῶν θηρίων
  choice: les bêtes
  rationale: Le grec emploie le terme général « bêtes ». Le contexte permet d’y reconnaître des éléphants de guerre, mais cette précision est réservée à une note.
- source_word: ἐπὶ μέρος
  choice: à un endroit
  rationale: L’expression indique une partie ou un emplacement déterminé sans permettre de préciser davantage la configuration tactique.
- source_word: εὐκαίρως ἀποκατασταθέντων
  choice: avaient été placées à un endroit approprié
  rationale: L’adverbe exprime ici une disposition opportune ou avantageuse, tandis que le verbe concerne la mise en place.
- source_word: τῆς δὲ ἵππου
  choice: la cavalerie
  rationale: Le nom collectif désignant littéralement « le cheval » a ici son sens militaire courant de cavalerie.
- source_word: κατὰ κέρας τεταγμένης
  choice: avait été disposée sur les ailes
  rationale: κέρας désigne, dans le vocabulaire militaire, une aile de l’armée. « Sur les ailes » reste proche de l’image grecque et demeure intelligible en français moderne.
theological_decisions:
- issue: Sens de κρίσις dans un récit de bataille comportant une possible résonance théologique
  choice: jugement
  alternative: décision imminente; crise à venir; issue prochaine
  rationale: Dans le contexte immédiat, le mot vise probablement l’issue décisive de la bataille, mais « jugement » préserve aussi le poids solennel et la tension théologique possibles. La note présente les autres sens sans trancher silencieusement.
translation_notes:
  register: Français international moderne, narratif et digne. La longue construction participiale grecque est conservée sous la forme d’une proposition temporelle enchaînant les préparatifs; la virgule finale respecte le fait que la phrase se poursuit au verset suivant.
