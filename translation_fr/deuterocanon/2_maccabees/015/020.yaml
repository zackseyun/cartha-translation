    issue: Formulation de τὴν ἐσομένην κρίσιν
    rationale: « Le jugement à venir » est plus fluide que « le jugement qui allait venir » tout en gardant le caractère imminent et solennel de l’expression grecque.
  - severity: low
    issue: Formulation de κατὰ κέρας
    rationale: « Aux ailes » est plus idiomatique dans une description de déploiement militaire et garde le sens des ailes/flancs de l’armée.
