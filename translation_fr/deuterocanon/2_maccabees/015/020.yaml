- from: Alors que tous attendaient déjà le jugement qui allait venir[a], que les ennemis avaient déjà engagé le combat, que l’armée avait été rangée en ordre de bataille, que les bêtes avaient été placées à un endroit approprié[b] et que la cavalerie avait été disposée sur les ailes,
  to: Alors que tous attendaient déjà le jugement à venir[a], que les ennemis avaient déjà engagé le combat, que l’armée avait été rangée en ordre de bataille, que les bêtes avaient été placées avantageusement dans un secteur[b], et que la cavalerie avait été disposée aux ailes,
