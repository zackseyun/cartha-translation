  yaml_path: translation/deuterocanon/2_maccabees/015/003.yaml
  text: But that thrice-accursed man asked whether there is in heaven a sovereign who commanded the keeping of the sabbath day[a].
translation:
  language: fr
  text: Mais cet homme trois fois maudit demanda s’il y avait au ciel un souverain qui avait ordonné d’observer le jour du sabbat[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « si le Souverain était au ciel, lui qui avait ordonné d’observer le jour du sabbat ». Le grec peut se comprendre soit comme une description indéfinie (« y avait-il au ciel un souverain… ? »), soit comme une référence plus définie au Dieu d’Israël.'
    reason: alternative_reading
lexical_decisions:
- source_word: τρισαλιτήριος
  choice: trois fois maudit
  rationale: Cette expression conserve le préfixe intensif τρις- et la vigueur de cette épithète rare et fortement péjorative, sans l’aplatir en simple « très méchant ».
- source_word: ἐπηρώτησεν
  choice: demanda
  rationale: Le verbe introduit ici une question hostile. « Demanda » est naturel en français, tandis que le contexte et l’insulte portent la tonalité provocatrice.
- source_word: δυνάστης
  choice: souverain
  rationale: Le terme désigne celui qui détient la puissance ou l’autorité. « Souverain » garde un registre élevé sans introduire le titre divin « Seigneur ».
- source_word: προστατάξας
  choice: avait ordonné
  rationale: Le participe exprime un ordre donné avec autorité. Le plus-que-parfait situe naturellement cet ordre avant la question rapportée au passé.
- source_word: ἄγειν
  choice: d’observer
  rationale: Avec le mot « jour », le verbe signifie célébrer ou observer ce jour. « Observer » est l’expression française idiomatique dans ce contexte religieux.
- source_word: τὴν τῶν σαββάτων ἡμέραν
  choice: le jour du sabbat
  rationale: La tournure grecque, malgré sa forme littérale plus complexe, désigne le jour hebdomadaire du sabbat. Cette formulation française est claire et précise.
theological_decisions:
- issue: Référence de l’autorité céleste
  choice: un souverain au ciel
  alternative: le Souverain qui est au ciel
  rationale: La syntaxe grecque permet soit d’entendre une question sur l’existence d’un souverain céleste, soit une référence plus définie au Dieu d’Israël. Le texte principal suit la lecture indéfinie, tandis que la note conserve l’autre possibilité sans trancher la tension.
translation_notes:
  register: Français international moderne, naturel et digne. L’insulte conserve sa force rhétorique; « souverain » évite d’importer un titre confessionnel; la note explicite l’ambiguïté syntaxique réelle du grec.
