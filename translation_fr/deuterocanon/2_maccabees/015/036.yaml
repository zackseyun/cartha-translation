  text: And they all decreed by common vote that this day should by no means be left unmarked,[a]
translation:
  language: fr
  text: Tous décrétèrent, par une résolution commune, de ne laisser en aucun cas cette journée sans commémoration.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ne laisser en aucune manière cette journée sans marque distinctive », c’est-à-dire sans qu’elle soit observée ou commémorée. Le grec ἀπαρασήμαντον évoque littéralement ce qui est dépourvu de marque ou de signe distinctif.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδογμάτισαν
  choice: décidèrent
  rationale: L’aoriste exprime ici une décision collective officielle. « Décidèrent » est naturel en français moderne, tandis que le caractère formel est précisé par « vote commun ».
- source_word: πάντες
  choice: Tous
  rationale: Conserve l’insistance sur l’unanimité du groupe.
- source_word: μετὰ κοινοῦ ψηφίσματος
  choice: par un vote commun
  rationale: Rend à la fois le caractère partagé de κοινός et la dimension civique et formelle de ψήφισμα.
- source_word: μηδαμῶς
  choice: en aucun cas
  rationale: Restitue la forte négation de l’adverbe dans un français actuel et digne.
- source_word: ἐᾶσαι
  choice: laisser
  rationale: Conserve directement l’idée de permettre qu’une situation demeure telle quelle.
- source_word: ἀπαρασήμαντον
  choice: sans commémoration
  rationale: Dans le contexte d’une journée destinée à être publiquement rappelée, cette formulation transmet clairement le sens contextuel. Une note conserve toutefois l’image grecque plus littérale d’une journée laissée « sans marque distinctive ».
- source_word: τήνδε τὴν ἡμέραν
  choice: cette journée
  rationale: Rend le démonstratif qui désigne la journée précise en question; « journée » convient naturellement à une date commémorative.
