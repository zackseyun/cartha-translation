base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/001.yaml
  text: But Nicanor[a], having learned that those with Judas were in the regions of Samaria, resolved to attack them on the day of rest with complete security.
translation:
  language: fr
  text: Mais Nicanor, ayant appris que ceux qui étaient avec Judas se trouvaient dans les régions de Samarie, décida de les attaquer le jour du repos[a], en toute sécurité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Probablement le jour du sabbat ; le grec dit littéralement « le jour du repos ».
    reason: Précise le référent probable tout en conservant dans le texte la périphrase grecque.
lexical_decisions:
- source_word: μεταλαβών
  choice: ayant appris
  rationale: Avec la proposition participiale à l’accusatif qui suit, le verbe exprime ici le fait d’avoir reçu une information ou d’avoir appris quelque chose.
- source_word: τοὺς περὶ τὸν Ἰούδαν ὄντας
  choice: les hommes de Judas
  rationale: L’expression désigne le groupe associé à Judas. Cette formulation est naturelle en français et n’implique pas un lien de parenté.
- source_word: ἐν τοῖς κατὰ Σαμάρειαν τόποις
  choice: dans les régions de Samarie
  rationale: La construction désigne les territoires associés à la Samarie sans imposer une délimitation administrative précise.
- source_word: ἐβουλεύσατο
  choice: décida
  rationale: La forme moyenne évoque une délibération aboutissant à un projet arrêté; « décida » restitue clairement cette résolution.
- source_word: τῇ τῆς καταπαύσεως ἡμέρᾳ
  choice: le jour du repos
  rationale: Cette traduction conserve l’expression grecque littérale, qui n’emploie pas ici le terme habituel pour « sabbat ».
- source_word: μετὰ πάσης ἀσφαλείας
  choice: en toute sécurité
  rationale: La locution exprime l’assurance de pouvoir agir sans danger, du point de vue de Nicanor.
- source_word: ἐπιβαλεῖν
  choice: les attaquer
  rationale: Dans ce contexte militaire, le verbe signifie fondre sur quelqu’un ou l’attaquer.
theological_decisions:
- issue: Identification du « jour du repos »
  choice: Conserver « le jour du repos » dans le texte principal.
  alternative: « le jour du sabbat »
  rationale: Le référent probable est le sabbat, mais le grec emploie une périphrase signifiant littéralement « jour du repos ». La traduction préserve cette particularité et indique l’identification probable en note.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste fluide tout en conservant le rapport participial initial et l’ambiguïté lexicale concernant le jour du repos.
