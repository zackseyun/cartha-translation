base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/002.yaml
  text: But when the Jews who were being compelled to accompany him said[a], “Do not destroy them in so savage and barbarous a way; rather[b], assign honor to the day that has been specially honored in holiness by the One who watches over all,”
translation:
  language: fr
  text: 'Mais les Juifs qui étaient contraints de l’accompagner lui dirent : « Ne les fais surtout pas périr avec une telle sauvagerie et une telle barbarie ; rends plutôt honneur au jour que Celui qui veille sur toutes choses a particulièrement honoré comme jour saint. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν ... Ἰουδαίων
  choice: les Juifs
  rationale: Dans ce contexte, le terme désigne le peuple juif comme groupe ethnoreligieux, et non simplement les habitants de la Judée.
- source_word: κατὰ ἀνάγκην συνεπομένων αὐτῷ
  choice: que l’on forçait à l’accompagner
  rationale: La tournure exprime clairement la contrainte subie et le fait d’accompagner Nicanor, sans suggérer un soutien volontaire.
- source_word: Μηδαμῶς ... ἀγρίως καὶ βαρβάρως
  choice: Ne ... surtout pas ... d’une manière aussi sauvage et barbare
  rationale: « Surtout pas » rend la forte interdiction de Μηδαμῶς, tandis que les deux adverbes conservent la vigueur rhétorique du grec.
- source_word: ἀπολέσῃς
  choice: fais ... périr
  rationale: Le verbe peut signifier détruire ou tuer. « Faire périr » convient à l’action létale envisagée tout en maintenant une certaine ampleur sémantique.
- source_word: δόξαν δὲ ἀπομέρισον
  choice: accorde plutôt l’honneur qui lui est dû
  rationale: La formule grecque demande d’attribuer au jour une part d’honneur. Cette expression française naturelle explicite l’idée de respect approprié sans transformer δόξα en « gloire » théologique.
- source_word: τῇ προτετιμημένῃ ... ἡμέρᾳ
  choice: au jour ... particulièrement honoré
  rationale: Le participe parfait marque le statut distingué déjà conféré à ce jour. « Particulièrement honoré » rend mieux ce sens en français courant que « préféré ».
- source_word: ὑπὸ τοῦ πάντα ἐφορῶντος
  choice: par Celui qui veille sur toutes choses
  rationale: Cette périphrase révérencieuse conserve la référence implicite à Dieu et la nuance de regard vigilant ou de surveillance universelle.
- source_word: μεθʼ ἁγιότητος
  choice: dans la sainteté
  rationale: La traduction reste proche de l’expression grecque et préserve son caractère sacré sans préciser davantage le rapport syntaxique, qui demeure quelque peu inhabituel.
theological_decisions:
- issue: Référence implicite à Dieu dans τοῦ πάντα ἐφορῶντος
  choice: Celui qui veille sur toutes choses
  alternative: Celui qui voit toutes choses
  rationale: La majuscule signale naturellement la périphrase divine en français, sans ajouter de titre ou de formulation doctrinale absente du grec.
- issue: Statut du jour sacré
  choice: le jour que Celui qui veille sur toutes choses a particulièrement honoré dans la sainteté
  alternative: le jour privilégié dans la sainteté par Celui qui veille sur toutes choses
  rationale: La traduction exprime le rang particulier du jour sous l’action divine, sans employer « sanctifié », verbe plus précis que le texte grec. Elle maintient aussi l’expression μεθʼ ἁγιότητος plutôt que d’en résoudre entièrement la relation.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le ton pressant de la supplication, la double qualification « sauvage et barbare » et la périphrase révérencieuse désignant Dieu. Aucun marqueur de note n’est requis puisque le texte ne comporte aucune note.
