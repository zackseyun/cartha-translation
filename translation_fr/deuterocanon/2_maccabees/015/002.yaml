revisions:
- from: 'Mais les Juifs que l’on forçait à l’accompagner lui dirent : « Ne les fais surtout pas périr d’une manière aussi sauvage et barbare ; accorde plutôt l’honneur qui lui est dû au jour que Celui qui veille sur toutes choses a particulièrement honoré dans la sainteté. »'
  to: 'Mais les Juifs qui étaient contraints de l’accompagner lui dirent : « Ne les fais surtout pas périr avec une telle sauvagerie et une telle barbarie ; rends plutôt honneur au jour que Celui qui veille sur toutes choses a particulièrement honoré comme jour saint. »'
  rationale: La révision améliore l’idiomaticité française et rend plus clairement le caractère sacré du jour, sans ajouter de précision doctrinale ni résoudre au-delà du nécessaire la relation syntaxique de μετʼ ἁγιότητος.
