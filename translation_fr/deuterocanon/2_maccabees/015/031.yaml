  yaml_path: translation/deuterocanon/2_maccabees/015/031.yaml
  text: And when he arrived there[a], he called together his fellow countrymen and the priests, stood them before the altar, and sent for those from the citadel.
translation:
  language: fr
  text: Une fois arrivé là, il convoqua ses compatriotes et les prêtres, les plaça devant l’autel, puis fit venir ceux de la citadelle[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus précisément, « ceux de l’Acra », la forteresse de Jérusalem.
    reason: Alternative lexicale et précision historico-géographique.
lexical_decisions:
- source_word: παραγενόμενος δὲ ἐκεῖ
  choice: Une fois arrivé là
  rationale: Le participe aoriste marque une action antérieure aux verbes principaux. Cette tournure rend naturellement la succession temporelle; δέ assure ici une transition narrative discrète.
- source_word: συγκαλεσάμενος
  choice: il convoqua
  rationale: Le verbe exprime l’action de faire venir des personnes pour les réunir. « Convoqua » est naturel et conserve cette idée de rassemblement organisé.
- source_word: τοὺς ὁμοεθνεῖς
  choice: ses compatriotes
  rationale: ὁμοεθνής désigne des personnes appartenant au même peuple. « Ses compatriotes » préserve cette solidarité nationale sans expliciter davantage que le grec.
- source_word: τοὺς ἱερεῖς
  choice: les prêtres
  rationale: Traduction directe et usuelle du pluriel grec.
- source_word: πρὸ τοῦ θυσιαστηρίου στῆσας
  choice: les plaça devant l’autel
  rationale: στῆσας est compris transitivement, avec pour objet sous-entendu les compatriotes et les prêtres qui viennent d’être convoqués. Cette lecture rend cohérente la suite des actions et respecte l’usage transitif de ἵστημι à l’aoriste actif.
- source_word: μετεπέμψατο
  choice: fit venir
  rationale: Le moyen μεταπέμπομαι signifie envoyer chercher ou faire appeler quelqu’un afin qu’il vienne. « Fit venir » est concis et idiomatique.
- source_word: τοὺς ἐκ τῆς ἄκρας
  choice: ceux de la citadelle
  rationale: ἄκρα peut désigner une citadelle et, dans ce contexte, plus précisément l’Acra de Jérusalem. Le nom commun reste accessible dans le texte, tandis que l’identification historique est signalée en note.
theological_decisions:
- issue: Identification de ἄκρα dans la Jérusalem maccabéenne
  choice: la citadelle
  alternative: l’Acra
  rationale: Il s’agit surtout d’une question historico-géographique. Le texte principal conserve le sens commun lisible, sans effacer l’identification probable avec la forteresse appelée l’Acra, donnée en note.
- issue: Valeur transitive ou intransitive de στῆσας
  choice: les plaça devant l’autel
  alternative: se plaça devant l’autel
  rationale: La forme active στῆσας peut être transitive, et les groupes à l’accusatif précédents fournissent naturellement l’objet sous-entendu. L’alternative intransitive reste grammaticalement envisageable, mais elle est moins probable dans cette construction.
translation_notes:
  register: Français international moderne, narratif et digne. Les verbes au passé simple conviennent au registre biblique littéraire sans archaïsme. Le pronom « les » explicite en français l’objet sous-entendu de στῆσας. Le marqueur de note est placé après « citadelle », expression à laquelle la note se rapporte.
