  yaml_path: translation/deuterocanon/2_maccabees/015/026.yaml
  text: But those around Judas joined battle with the enemies with invocation and prayers[a][b].
translation:
  language: fr
  text: Mais les compagnons de Judas engagèrent le combat contre les ennemis tout en invoquant[a] et en priant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec invocation ». Dans cette proposition, le grec ne précise pas qui est invoqué.'
    reason: lexical_alternative
  - marker: b
    text: Le mot grec traduit par « priant » peut aussi signifier « faisant des vœux », selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ περὶ τὸν Ἰούδαν
  choice: Mais les hommes qui entouraient Judas
  rationale: La tournure grecque désigne les compagnons de Judas. Cette formulation naturelle en français conserve l’idée d’un groupe rassemblé autour de son chef sans préciser davantage son statut militaire.
- source_word: μετὰ ἐπικλήσεως
  choice: en invoquant Dieu
  rationale: ἐπίκλησις exprime ici une invocation religieuse. En français courant, « en invoquant Dieu » rend plus clairement cette action que le substantif abstrait « avec invocation » ; Dieu est implicite dans le contexte, mais n’est pas nommé dans cette proposition grecque, ce que signale la note.
- source_word: καὶ εὐχῶν
  choice: et en priant
  rationale: εὐχή peut désigner une prière ou un vœu. Associé à l’invocation au moment d’engager le combat, le sens de « prières » est le plus probable ; la forme verbale produit une coordination française naturelle.
- source_word: συνῆψαν
  choice: engagèrent le combat
  rationale: Dans ce contexte militaire, συνάπτω signifie entrer en combat ou livrer bataille. « Engagèrent le combat » est clair, actuel et fidèle.
- source_word: τοῖς πολεμίοις
  choice: contre les ennemis
  rationale: Le datif indique ici la partie adverse. Après « engager le combat », le français idiomatique emploie « contre ».
theological_decisions:
- issue: Force religieuse de ἐπίκλησις et objet non exprimé
  choice: Traduire explicitement l’acte religieux par « en invoquant Dieu », avec une note signalant que Dieu n’est pas nommé dans cette proposition grecque.
  alternative: « avec des invocations » ou « en lançant un appel »
  rationale: Le contexte présente l’entrée au combat dans la dépendance de l’aide divine. Nommer Dieu rend en français moderne l’implicite religieux de ἐπίκλησις, tandis que la note préserve la distinction entre ce qui est exprimé et ce qui est sous-entendu.
- issue: Ambiguïté de εὐχή
  choice: Retenir « priant » dans le texte.
  alternative: « faisant des vœux »
  rationale: La proximité d’ἐπίκλησις et la situation de combat favorisent le sens de prière, sans exclure lexicalement celui de vœu ; l’autre possibilité est donc conservée en note.
translation_notes:
  register: Français moderne, international et digne. La formulation privilégie des verbes concrets (« en invoquant… et en priant ») plutôt que deux substantifs abstraits, tout en conservant dans les notes les ambiguïtés du grec.
