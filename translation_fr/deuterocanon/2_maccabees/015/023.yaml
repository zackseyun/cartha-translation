  yaml_path: translation/deuterocanon/2_maccabees/015/023.yaml
  text: And now[a], O Sovereign of the heavens, send a good angel before us for fear and trembling.
translation:
  language: fr
  text: Et maintenant, Souverain des cieux, envoie devant nous un ange bon, pour inspirer crainte et tremblement.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « pour la crainte et le tremblement ». Le grec ne précise pas qui doit éprouver cette crainte; le contexte laisse penser qu’il s’agit des ennemis.'
    reason: alternative lexicale et ambiguïté du référent
lexical_decisions:
- source_word: δυνάστα
  choice: Souverain
  rationale: Le vocatif désigne celui qui détient le pouvoir. « Souverain » convient à l’adresse solennelle d’une prière sans réduire le terme à la seule puissance physique.
- source_word: τῶν οὐρανῶν
  choice: des cieux
  rationale: Le pluriel du grec est conservé dans une expression française naturelle et de registre élevé.
- source_word: ἀπόστειλον
  choice: envoie
  rationale: L’impératif aoriste formule directement la demande; « envoie » en restitue simplement la force.
- source_word: ἄγγελον ἀγαθὸν
  choice: un ange bon
  rationale: Dans ce contexte, ἄγγελος désigne un être angélique. L’ordre « un ange bon » reste naturel en français tout en conservant la qualification simple ἀγαθόν.
- source_word: ἔμπροσθεν ἡμῶν
  choice: devant nous
  rationale: L’expression indique que l’ange doit précéder le groupe; « devant nous » garde à la fois le sens spatial et l’écho biblique.
- source_word: εἰς δέος καὶ τρόμον
  choice: pour inspirer crainte et tremblement
  rationale: εἰς peut marquer ici le but ou l’effet attendu. La formulation française rend ce rapport intelligible sans ajouter explicitement les personnes saisies de crainte.
theological_decisions:
- issue: Référent de la crainte et du tremblement
  choice: Présenter la crainte et le tremblement comme l’effet attendu de l’envoi de l’ange, sans nommer ceux qui les éprouvent.
  alternative: Traduire plus formellement « pour la crainte et le tremblement », ou préciser que cet effet touche les ennemis.
  rationale: Le contexte militaire suggère les forces ennemies, mais le grec ne donne aucun complément explicite. La traduction préserve cette indétermination tout en exprimant naturellement la valeur finale ou résultative de εἰς.
translation_notes:
  register: Français international moderne, digne et accessible. L’adresse « Souverain des cieux » conserve la solennité de la prière; aucune précision confessionnelle n’est ajoutée.
