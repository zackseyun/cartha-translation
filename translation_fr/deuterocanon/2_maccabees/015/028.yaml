  text: But once they were relieved of the pressure, and as they withdrew with joy[c][b][a], they recognized Nikanor fallen forward with his armor.
translation:
  language: fr
  text: Mais, une fois libérés de la nécessité pressante[a], alors qu’ils se retiraient avec joie[b], ils reconnurent Nicanor, tombé en avant[c], avec son armure complète.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « libérés de la contrainte » ou « délivrés de l’urgence » ; l’expression grecque, assez idiomatique, peut désigner une nécessité, une contrainte ou une urgence.
    reason: lexical_alternative
  - marker: b
    text: Ou « tandis qu’ils partaient avec joie » ; le verbe grec peut exprimer un départ, un retrait ou la levée du camp.
    reason: lexical_alternative
  - marker: c
    text: Ou « tombé à terre » ou « étendu après être tombé » ; « tombé en avant » conserve une nuance directionnelle possible du verbe grec.
    reason: lexical_alternative
lexical_decisions:
- source_word: γεγυμνωμένοι ἀπὸ τῆς χρείας
  choice: libérés de la situation critique
  rationale: Le participe parfait passif de γυμνόω signifie littéralement « dépouillés », mais, avec ἀπό et χρεία, il exprime ici le fait d’être débarrassé d’une nécessité pressante. La formulation française rend naturellement cet idiome sans préciser indûment la nature exacte de la crise.
- source_word: ἀναλύοντες
  choice: se retiraient
  rationale: ἀναλύω peut désigner le fait de partir, de lever le camp ou de se retirer. Dans l’après-combat, « se retiraient » convient au mouvement décrit tout en évitant le sens non assuré de « revenaient ».
- source_word: ἐπέγνωσαν
  choice: reconnurent
  rationale: 'ἐπιγινώσκω exprime ici l’identification claire du combattant tombé : ils reconnaissent Nicanor.'
- source_word: προπεπτωκότα
  choice: tombé en avant
  rationale: Le parfait de προπίπτω indique que Nicanor était déjà tombé, avec une nuance directionnelle vers l’avant portée par le préverbe προ-.
- source_word: πανοπλίᾳ
  choice: toute son armure
  rationale: πανοπλία désigne l’armure ou l’équipement complet. « Toute son armure » conserve cette idée de totalité dans un français courant.
