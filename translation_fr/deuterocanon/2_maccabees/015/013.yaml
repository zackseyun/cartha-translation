  yaml_path: translation/deuterocanon/2_maccabees/015/013.yaml
  text: Then in this way there appeared a man distinguished by his gray hair and glory[b][a], and the majesty surrounding him was in some way marvelous and most splendid.
translation:
  language: fr
  text: Puis apparut un homme qui se distinguait par ses cheveux blancs et sa gloire[a] ; la grandeur qui l’entourait[b] avait quelque chose d’étonnant et d’extrêmement majestueux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un homme remarquable par sa chevelure blanche et sa gloire ». Le grec condense cette description dans un participe accompagné de deux compléments.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la supériorité autour de lui » ; l’expression désigne ici la grandeur ou l’éminence visible qui l’entourait.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶθ᾽ οὕτως
  choice: Ensuite apparut ainsi
  rationale: Rend à la fois la succession exprimée par εἶτα et la manière indiquée par οὕτως, tout en gardant le mouvement du récit visionnaire.
- source_word: ἐπιφανῆναι
  choice: apparut
  rationale: Dans le récit de la vision, l’infinitif aoriste décrit l’apparition soudaine d’une figure, sans lui attribuer une identité ou une nature que ce verset ne précise pas.
- source_word: ἄνδρα
  choice: un homme
  rationale: Équivalent direct et naturel de ἀνήρ dans ce contexte.
- source_word: πολιᾷ
  choice: ses cheveux blancs
  rationale: Le nom désigne la chevelure blanchie ou grisonnante, signe visible d’âge et de dignité. « Cheveux blancs » donne une image concrète et courante en français.
- source_word: δόξῃ
  choice: sa gloire
  rationale: « Gloire » conserve le registre biblique élevé et peut évoquer ici à la fois l’honneur et l’éclat visible.
- source_word: διαφέροντα
  choice: qui se distinguait par
  rationale: Exprime naturellement la supériorité ou la distinction signalée par le participe avec les datifs πολιᾷ et δόξῃ.
- source_word: θαυμαστὴν δέ τινα
  choice: avait quelque chose d’étonnant
  rationale: Cette formulation idiomatique rend la qualité suscitant l’étonnement ainsi que la nuance indéfinie de τινα, sans effacer la légère réserve du grec.
- source_word: μεγαλοπρεπεστάτην
  choice: d’extrêmement majestueux
  rationale: Rend la force superlative de l’adjectif et son idée de magnificence imposante dans un français actuel.
- source_word: τὴν περὶ αὐτὸν ὑπεροχήν
  choice: la grandeur qui l’entourait
  rationale: « Grandeur » communique l’éminence exceptionnelle exprimée par ὑπεροχή, tandis que « qui l’entourait » préserve la dimension spatiale ou visuelle de περὶ αὐτόν.
theological_decisions:
- issue: Nature de la figure vue en vision
  choice: Décrire simplement l’apparition d’un homme âgé, glorieux et entouré de grandeur, sans l’identifier dans ce verset.
  alternative: Présenter explicitement la figure comme un être céleste ou glorifié.
  rationale: Le grec décrit son apparence, sa dignité et la grandeur qui l’entoure, mais ne donne ici ni son nom ni sa nature. La traduction respecte cette retenue.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le ton élevé d’une vision sans archaïsmes. « Avait quelque chose d’étonnant » préserve la nuance indéfinie de τινα, et « extrêmement majestueux » restitue le superlatif grec sans surinterprétation théologique.
