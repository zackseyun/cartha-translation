  text: And for those shut up in the city, the anxiety also was no small matter, as they were troubled about the attack in the open country.
translation:
  language: fr
  text: Ceux qui étaient enfermés dans la ville éprouvaient eux aussi une vive angoisse, car l’assaut en rase campagne[a] les inquiétait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’attaque à découvert ». L’expression grecque situe l’assaut hors de la ville, en terrain ouvert, par contraste avec ceux qui y étaient enfermés.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατειλημμένοις
  choice: enfermés
  rationale: Le participe parfait passif présente les habitants comme retenus à l’intérieur de la ville par les circonstances. « Enfermés » conserve cette contrainte sans ajouter explicitement l’idée d’un siège.
- source_word: οὐ πάρεργος ἀγωνία
  choice: une vive angoisse
  rationale: L’expression signifie littéralement que l’angoisse n’était ni secondaire ni négligeable. « Une vive angoisse » en restitue naturellement l’intensité en français.
- source_word: ταρασσομένοις
  choice: les inquiétait
  rationale: Le participe exprime leur agitation devant l’assaut. La tournure verbale française relie clairement la cause à leur angoisse tout en restant naturelle.
- source_word: τῆς ἐν ὑπαίθρῳ προσβολῆς
  choice: l’assaut en rase campagne
  rationale: προσβολή désigne ici une attaque militaire, tandis que ἐν ὑπαίθρῳ situe l’action hors de la ville, en terrain découvert. « En rase campagne » rend nettement ce contraste spatial.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et narratif. La phrase est légèrement restructurée pour éviter le tour peu naturel « l’angoisse n’était pas secondaire », sans atténuer la détresse du texte grec.
