  text: And after displaying the head of the accursed Nikanor and the hand of that blasphemer[a], which he had stretched out against the holy house of the Almighty and boasted greatly[b],
translation:
  language: fr
  text: Et, après avoir montré la tête de l’infâme Nicanor[a] et la main de ce blasphémateur[b], qu’il avait tendue contre la sainte demeure du Tout-Puissant en se vantant avec arrogance,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’impur Nicanor ». Le terme grec exprime une vive réprobation religieuse et morale et peut évoquer ce qui est souillé ou abominable.
    reason: lexical_alternative
  - marker: b
    text: Ou « de cet homme injurieux ». Le terme grec peut désigner plus généralement quelqu’un qui profère des injures ou des paroles diffamatoires ; « blasphémateur » convient ici parce que l’outrage vise la demeure sainte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδειξάμενος
  choice: Puis il montra
  rationale: Le participe aoriste marque ici une action narrative antérieure à celle qui se poursuit au verset suivant. « Puis il montra » est naturel en français et conserve l’enchaînement du récit.
- source_word: μιεροῦ
  choice: infâme
  rationale: L’adjectif exprime une réprobation religieuse et morale très forte, avec l’idée de souillure ou d’abomination. « Infâme » restitue cette condamnation sans suggérer littéralement que Nicanor aurait été rituellement impur.
- source_word: δυσφήμου
  choice: blasphémateur
  rationale: Le terme peut désigner celui qui tient des propos injurieux ou diffamatoires. Le contexte d’une attaque arrogante contre le sanctuaire donne ici à l’injure une portée sacrilège, bien rendue par « blasphémateur ».
- source_word: ἐκτείνας
  choice: avait tendue
  rationale: Le plus-que-parfait indique clairement que le geste hostile de Nicanor envers le Temple avait précédé l’exposition publique de sa main.
- source_word: ἐπὶ τὸν ἅγιον ... οἶκον
  choice: contre la sainte demeure
  rationale: Dans ce contexte hostile, ἐπί suivi de l’accusatif a une valeur adversative. « Sainte demeure » conserve l’image de la maison tout en désignant naturellement le Temple.
- source_word: παντοκράτορος
  choice: du Tout-Puissant
  rationale: « Tout-Puissant » est le titre divin français établi, clair et digne, qui rend la souveraineté universelle exprimée par le grec.
- source_word: ἐμεγαλαύχησεν
  choice: en se livrant à d’arrogantes vantardises
  rationale: Le verbe exprime une fanfaronnade orgueilleuse. Cette formulation française restitue explicitement la force péjorative du terme et rattache naturellement l’action au geste de la main.
theological_decisions:
- issue: Traduction du titre divin παντοκράτωρ
  choice: le Tout-Puissant
  alternative: le Souverain de l’univers
  rationale: Le titre doit être traduit plutôt que translittéré. « Le Tout-Puissant » est l’équivalent français traditionnel et immédiatement compréhensible, sans ajouter de précision doctrinale étrangère au texte.
- issue: Portée religieuse de δυσφήμου
  choice: blasphémateur
  alternative: homme injurieux
  rationale: Le mot grec a un sens plus large que le blasphème au sens strict, mais l’objet de l’outrage est ici la demeure sainte de Dieu. Le choix principal rend cette portée religieuse, tandis que la note conserve l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase reste ouverte par une virgule, puisque le participe grec introduit une construction dont la proposition principale se poursuit au verset suivant. « Nicanor » suit la forme française usuelle du nom.
