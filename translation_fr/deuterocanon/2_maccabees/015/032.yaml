  source_fidelity: 'La structure participiale καὶ ἐπιδειξάμενος introduit une action antérieure et la phrase demeure suspendue jusqu’au verset suivant. « Puis il montra » explicite l’enchaînement, mais transforme inutilement le participe en proposition principale et ne correspond pas à la note qui affirme que la construction reste ouverte. « Et, après avoir montré » restitue directement la syntaxe narrative. La relative renvoie à la main : Nicanor l’avait étendue contre la demeure sainte et s’était vanté avec arrogance.'
  naturalness: La révision proposée est naturelle dans un récit soutenu moderne. « Se vanter avec arrogance » est plus idiomatique et moins redondant que « se livrer à d’arrogantes vantardises », tout en rendant la valeur intensive et orgueilleuse de ἐμεγαλαύχησεν.
  terminology: '« Nicanor », « blasphémateur », « sainte demeure » et « le Tout-Puissant » conviennent. « Infâme » peut être conservé pour μιεροῦ : il rend la dénonciation péjorative sans imposer une notion technique de pureté rituelle; la note conserve utilement l’alternative plus littérale « impur ».'
