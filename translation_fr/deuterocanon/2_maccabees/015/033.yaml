  yaml_path: translation/deuterocanon/2_maccabees/015/033.yaml
  text: And after cutting out the tongue of the ungodly Nikanor, he said he would throw it piece by piece to the birds, and hang up the wages of his folly opposite the temple.
translation:
  language: fr
  text: Après avoir coupé la langue de l’impie Nicanor, il déclara qu’il la jetterait morceau par morceau aux oiseaux et qu’il suspendrait en face du Temple le salaire de sa folie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le juste châtiment de sa folie ». L’expression grecque peut désigner une rétribution, c’est-à-dire ce que quelqu’un reçoit en retour de ses actes.
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσαν
  choice: la langue
  rationale: L’acte physique de la couper impose ici le sens corporel de « langue ».
- source_word: δυσσεβοῦς
  choice: l’impie
  rationale: Le terme caractérise Nicanor par son irrévérence envers Dieu; « l’impie » conserve cette portée religieuse dans un registre biblique encore courant.
- source_word: ἐκτεμών
  choice: Après avoir coupé
  rationale: Le participe aoriste marque une action antérieure à la déclaration; cette tournure restitue naturellement la succession.
- source_word: ἔφη
  choice: il déclara qu’il
  rationale: Le verbe introduit les infinitifs exprimant ce qu’il annonce vouloir faire; « déclara » convient à la solennité publique de la scène.
- source_word: μετὰ μέρος
  choice: morceau par morceau
  rationale: L’expression indique une distribution par portions et garde le caractère concret de la menace.
- source_word: τοῖς ὄρνεσιν
  choice: aux oiseaux
  rationale: Le datif désigne les destinataires des morceaux.
- source_word: τὰ δʼ ἐπίχειρα
  choice: le salaire
  rationale: Le mot désigne ce que l’on reçoit en retour de ses actes, ici sous forme de rétribution punitive; « salaire » préserve la métaphore concrète sans éliminer l’ambivalence lexicale.
- source_word: τῆς ἀνοίας
  choice: de sa folie
  rationale: ἀνοία évoque l’absence de jugement et la conduite insensée, avec ici une coloration morale.
- source_word: κατέναντι τοῦ ναοῦ
  choice: en face du Temple
  rationale: κατέναντι indique une position vis-à-vis ou en face de; « Temple » désigne naturellement ici le sanctuaire de Jérusalem.
- source_word: κρεμιάσαι
  choice: suspendrait
  rationale: L’infinitif exprime l’intention d’exposer publiquement quelque chose en le pendant; « suspendre » est précis et naturel.
theological_decisions:
- issue: Caractérisation morale et religieuse de Nicanor par δυσσεβοῦς
  choice: l’impie
  alternative: l’irrévérencieux envers Dieu
  rationale: « L’impie » conserve de façon concise le jugement religieux porté par le grec, sans le réduire à une simple insulte morale.
- issue: Nature de la rétribution exprimée par τὰ ἐπίχειρα
  choice: le salaire de sa folie
  alternative: le juste châtiment de sa folie
  rationale: La formulation retenue maintient la métaphore et l’ambiguïté entre rétribution et peine, tandis que la note explicite l’autre lecture possible.
translation_notes:
  register: Français international moderne, digne et narratif. « Temple » porte une majuscule puisqu’il s’agit du Temple de Jérusalem. La violence concrète du grec est conservée sans amplification; la syntaxe reste fluide et la rétribution demeure volontairement ambiguë.
