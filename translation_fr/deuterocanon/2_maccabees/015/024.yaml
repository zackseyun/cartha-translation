  yaml_path: translation/deuterocanon/2_maccabees/015/024.yaml
  text: Let those who come against your holy people with blasphemy be struck with terror by the greatness of your arm[c][b][a]. And thus he ended in these words.
translation:
  language: fr
  text: « Que ceux qui viennent contre ton peuple saint avec des blasphèmes soient saisis de terreur par la grandeur de ton bras[a] ! » C’est ainsi qu’il termina, par ces paroles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la grandeur de ton bras » ; le bras de Dieu est une image biblique de sa puissance en action.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « Et ainsi il conclut sur ces mots. » Le grec renvoie à ce qui vient d’être dit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγέθει βραχίονός σου
  choice: devant la puissance de ton bras
  rationale: μεγέθει désigne ici la grandeur ou la puissance imposante du bras de Dieu. Cette formulation française conserve l’image concrète du bras tout en exprimant naturellement sa force causale.
- source_word: καταπλαγήτωσαν
  choice: soient frappés de terreur
  rationale: L’impératif passif exprime le souhait qu’ils soient saisis de peur ou de consternation; « frappés de terreur » en conserve la vigueur et la voix passive.
- source_word: οἱ μετὰ βλασφημίας παραγινόμενοι
  choice: ceux qui s’avancent … en proférant des blasphèmes
  rationale: παραγίνομαι évoque ici une venue ou une avancée hostile, tandis que μετὰ βλασφημίας en précise la manière. « En proférant » rend explicite en français naturel le caractère verbal des blasphèmes sans en modifier le sens.
- source_word: ἐπὶ τὸν ἅγιον σου λαόν
  choice: contre ton peuple saint
  rationale: Dans ce contexte hostile, ἐπί avec l’accusatif signifie « contre ». L’ordre « ton peuple saint » est idiomatique en français et préserve les deux éléments grecs.
- source_word: καὶ οὕτως μὲν ἐν τούτοις ἔληξεν
  choice: C’est ainsi qu’il termina son discours
  rationale: ἔληξεν signifie qu’il mit fin ou conclut, et ἐν τούτοις renvoie aux paroles précédentes. « Son discours » fournit en français le complément nécessaire sans ajouter de contenu théologique.
theological_decisions:
- issue: Image du bras de Dieu
  choice: Conserver l’image « ton bras » dans le texte principal.
  alternative: Traduire uniquement par « ta puissance ».
  rationale: Le bras est une métaphore biblique concrète de la puissance divine en action. La conserver maintient les résonances scripturaires sans imposer une interprétation doctrinale.
translation_notes:
  register: Français international actuel, digne et accessible. Le tutoiement correspond à l’adresse directe à Dieu. La formulation conserve le ton solennel de la prière et l’image biblique du bras divin.
