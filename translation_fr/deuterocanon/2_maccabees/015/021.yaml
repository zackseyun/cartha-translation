revisions:
- from: Lorsque Maccabée vit la présence des multitudes, la grande diversité des armes et la férocité des bêtes[a] déployées à un endroit stratégique, il tendit les mains vers le ciel et invoqua le Seigneur qui accomplit des prodiges[b]. Il savait que la victoire ne dépend pas des armes, mais que le Seigneur l’accorde à ceux qui en sont dignes, quand il le juge bon.
  to: Lorsque Maccabée vit la présence des foules, la diversité de l’armement et la férocité des bêtes[a] placées en position favorable, il leva les mains vers le ciel et invoqua le Seigneur qui accomplit des prodiges[b], sachant que la victoire ne s’obtient pas par les armes, mais qu’il l’accorde à ceux qui sont dignes, selon ce qu’il juge bon.
  rationale: 'La révision corrige uniquement des nuances lexicales et syntaxiques sûres : elle évite l’intensification de « grande », rend plus idiomatiquement la scène militaire, maintient l’indétermination de « dignes », et exprime la décision divine par « selon ce qu’il juge bon ». Les notes existantes sont conservées, avec leurs ancres intactes.'
