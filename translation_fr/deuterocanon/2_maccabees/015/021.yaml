base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/021.yaml
  text: When Maccabeus saw the presence of the crowds[a], the varied array of weapons, and the savagery of the beasts positioned advantageously, he stretched out his hands to heaven and called on the wonder-working Lord, knowing that victory is not secured by weapons, but that, whenever it is judged right by him[b], he grants it to those who are worthy.
translation:
  language: fr
  text: Lorsque Maccabée vit la présence des foules, la diversité de l’armement et la férocité des bêtes[a] placées en position favorable, il leva les mains vers le ciel et invoqua le Seigneur qui accomplit des prodiges[b], sachant que la victoire ne s’obtient pas par les armes, mais qu’il l’accorde à ceux qui sont dignes, selon ce qu’il juge bon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans ce contexte, ces « bêtes » sont probablement des éléphants de guerre, mais le grec dit seulement « bêtes ».
    reason: cultural_note
  - marker: b
    text: Ou « le Seigneur qui fait des miracles ».
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιδών
  choice: vit
  rationale: Le participe présente l’évaluation par Maccabée de la situation sur le champ de bataille. « Vit » reste simple et naturel tout en pouvant inclure l’idée de constater.
- source_word: τὴν τῶν πλήθων παρουσίαν
  choice: la présence des multitudes
  rationale: Cette formulation conserve la notion de présence exprimée par παρουσία et le pluriel πλήθων, sans réduire explicitement l’expression au seul nombre des combattants.
- source_word: τῶν ὅπλων τὴν ποικίλην παρασκευήν
  choice: la grande diversité des armes
  rationale: Dans ce contexte militaire, παρασκευή désigne la préparation ou l’équipement. La formulation française rend clairement l’impression produite par l’équipement varié sans alourdir la phrase.
- source_word: θηρίων
  choice: bêtes
  rationale: Le mot grec désigne des bêtes sauvages ou redoutables. Le contexte suggère des éléphants de guerre, mais le texte ne les nomme pas explicitement; cette identification reste donc en note.
- source_word: ἐπὶ μέρος εὔκαιρον
  choice: déployées à un endroit stratégique
  rationale: L’expression indique un emplacement favorable ou opportun. « Stratégique » explicite naturellement sa portée militaire sans préciser un lieu absent du grec.
- source_word: ἀγριότητα
  choice: férocité
  rationale: « Férocité » exprime le caractère menaçant et dangereux des bêtes tout en convenant au registre narratif.
- source_word: ἀνατείνας χεῖρας εἰς τὸν οὐρανόν
  choice: il tendit les mains vers le ciel
  rationale: La traduction conserve le geste concret et traditionnel de la prière.
- source_word: τερατοποιὸν κύριον
  choice: le Seigneur qui accomplit des prodiges
  rationale: Cette tournure française naturelle rend le Seigneur comme auteur d’actes extraordinaires, tout en évitant une expression adjectivale artificielle.
- source_word: οὐκ ἐν ὅπλοις
  choice: la victoire ne dépend pas des armes
  rationale: Le grec est elliptique. Cette formulation restitue clairement le contraste entre les armes et la décision souveraine du Seigneur, sans nier que des moyens humains puissent être employés.
- source_word: καθὼς δὲ ἐὰν αὐτῷ κριθῇ
  choice: quand il le juge bon
  rationale: La formulation rend idiomatiquement l’idée que l’octroi de la victoire dépend de ce que le Seigneur estime juste ou approprié.
- source_word: τοῖς ἀξίοις περιποιεῖται τὴν νίκην
  choice: le Seigneur l’accorde à ceux qui en sont dignes
  rationale: « Accorde » exprime la victoire comme un don relevant de l’action divine. « Ceux qui en sont dignes » maintient l’évaluation présente dans ἀξίοις sans en définir doctrinalement le fondement.
theological_decisions:
- issue: Action divine et moyens militaires dans l’obtention de la victoire
  choice: La victoire ne dépend pas des armes; le Seigneur l’accorde selon son propre jugement.
  alternative: La victoire exclut absolument tout recours à des moyens humains et résulte uniquement d’une intervention miraculeuse.
  rationale: Le grec oppose les armes à la décision du Seigneur, mais le verset ne développe pas une doctrine excluant toute participation humaine. La traduction conserve la primauté de l’action divine sans aller au-delà du texte.
- issue: Dignité des bénéficiaires de la victoire
  choice: Conserver « ceux qui en sont dignes » sans expliquer sur quoi repose cette dignité.
  alternative: Présenter leur dignité comme un mérite qui leur donne mécaniquement droit à la victoire.
  rationale: ἀξίοις porte bien une appréciation de dignité, mais le verset ne précise ni ses critères ni son rapport exact avec la grâce ou le mérite. Il convient de préserver cette tension.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été légèrement réorganisée dans la dernière phrase pour nommer de nouveau « le Seigneur » et éviter un pronom ambigu. Les termes concrets du grec sont conservés lorsque leur précision compte, tandis que les ellipses sont rendues dans un français naturel.
