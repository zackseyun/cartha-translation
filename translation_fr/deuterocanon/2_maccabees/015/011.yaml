    issue: Rendu de ὑπὲρ τὰ πάντα
    rationale: « Sans pareille » peut suggérer une joie unique ou incomparablement supérieure; le grec fonctionne ici comme intensif avec ηὔφραινεν. « Au plus haut point » est plus fidèle sans surinterprétation comparative.
  - severity: low
    issue: Expression « rêve digne de foi »
    rationale: Elle est compréhensible, mais « rêve digne de confiance » est plus naturel en français international moderne et restitue exactement l’idée d’ἀξιόπιστον.
