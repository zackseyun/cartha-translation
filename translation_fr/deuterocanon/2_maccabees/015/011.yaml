base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/011.yaml
  text: And after arming each of them[a], not with the security of shields and spears so much as with encouragement from noble words, and after relating to them a trustworthy dream[b], he made them all rejoice.
translation:
  language: fr
  text: Après avoir armé chacun d’eux, non pas tant de la protection des boucliers et des lances que de l’encouragement que donnent de nobles paroles, et après leur avoir raconté un rêve digne de confiance[a], il les réjouit au plus haut point[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un rêve crédible ». Le grec qualifie le rêve de digne de confiance.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « au-delà de toutes choses »; l’expression a ici une valeur intensive.
    reason: translation_clarity
lexical_decisions:
- source_word: καθοπλίσας
  choice: Après avoir armé
  rationale: Le participe aoriste exprime une action préalable. « Armer » conserve l’image militaire et permet au contraste qui suit d’élargir le sens de cet équipement.
- source_word: οὐ τὴν ἀσπίδων καὶ λογχῶν ἀσφάλειαν, ὡς τὴν ἐν τοῖς ἀγαθοῖς λόγοις παράκλησιν
  choice: non pas tant en leur donnant la protection des boucliers et des lances qu’en les encourageant par de nobles paroles
  rationale: La tournure comparative « non pas tant… que… » restitue οὐ… ὡς sans nier que les hommes aient aussi reçu des armes. « Protection » convient à ἀσφάλεια, tandis que la formulation verbale « en les encourageant » rend παράκλησις naturellement en français.
- source_word: ἀσπίδων καὶ λογχῶν
  choice: des boucliers et des lances
  rationale: Équivalents militaires directs et courants en français moderne.
- source_word: ἐν τοῖς ἀγαθοῖς λόγοις
  choice: par de nobles paroles
  rationale: « Nobles » conserve la valeur morale et élevée de ἀγαθοῖς; « par » exprime ici le moyen ou le support de l’encouragement sans alourdir la phrase.
- source_word: προσηγησάμενος
  choice: après leur avoir raconté
  rationale: Le participe moyen désigne le fait de présenter ou raconter quelque chose aux auditeurs; le pronom « leur » rend naturellement cette orientation vers eux.
- source_word: ὄνειρον ἀξιόπιστον
  choice: un rêve digne de foi
  rationale: Cette expression traduit littéralement l’idée de ce qui mérite confiance, sans affirmer explicitement que le rêve était inspiré par Dieu.
- source_word: ὑπὲρ τὰ πάντα
  choice: sans pareille
  rationale: Pris adverbialement avec ηὔφραινεν, le syntagme intensifie la joie produite. « Sans pareille » conserve la force de l’expression sans la transformer en objet collectif.
- source_word: ηὔφραινεν
  choice: il les remplit d’une joie
  rationale: Cette formulation restitue la valeur causative de εὐφραίνω et s’accorde naturellement avec l’intensification ὑπὲρ τὰ πάντα.
theological_decisions:
- issue: Nature du rêve
  choice: un rêve digne de foi
  alternative: un rêve crédible; un rêve inspiré
  rationale: Le grec qualifie le rêve comme méritant confiance, mais n’en précise pas explicitement l’origine divine dans ce verset. La traduction conserve cette appréciation positive sans ajouter une affirmation doctrinale.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase conserve la longue progression participiale du grec tout en explicitant légèrement les rapports grammaticaux pour rester naturelle et compréhensible.
