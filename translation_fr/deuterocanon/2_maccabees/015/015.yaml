  text: 'Then Jeremiah stretched out his right hand and handed Judas a golden sword, and as he gave it he addressed him with these words:'
translation:
  language: fr
  text: 'Alors Jérémie étendit la main droite et remit à Judas une épée d’or. En la lui donnant, il lui adressa ces paroles :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προτείναντα
  choice: étendit
  rationale: Le participe de προτείνω décrit le geste de tendre la main en avant. « Étendit » garde ce mouvement dans un français naturel et digne.
- source_word: τὴν δεξιὰν
  choice: la main droite
  rationale: Le grec dit littéralement « la droite » ; « la main droite » explicite naturellement le nom sous-entendu sans ajouter d’interprétation.
- source_word: παραδοῦναι
  choice: remit
  rationale: Dans ce contexte, παραδίδω exprime la transmission de l’épée à Judas. « Remit » rend plus précisément l’idée de remise en main propre que le simple « donna ».
- source_word: Ἰούδα
  choice: Judas
  rationale: « Judas » est la forme française usuelle du nom de Judas Maccabée.
- source_word: ῥομφαίαν χρυσῆν
  choice: une épée d’or
  rationale: ῥομφαία désigne une grande épée ou lame ; « épée » est le terme générique le plus clair. « D’or » rend χρυσῆν naturellement, sans décider si l’arme était entièrement en or ou seulement d’apparence dorée.
- source_word: διδόντα
  choice: En la lui donnant
  rationale: Le participe indique que les paroles accompagnent le don. Cette tournure conserve la simultanéité et identifie clairement l’épée comme objet donné.
- source_word: προσφωνῆσαι
  choice: il lui adressa
  rationale: Le verbe signifie s’adresser directement à quelqu’un. Cette formulation préserve le ton soutenu et prépare la citation suivante.
- source_word: τάδε
  choice: ces paroles
  rationale: τάδε annonce le contenu du discours qui suit ; « ces paroles » est une formulation française idiomatique.
theological_decisions:
- issue: Présentation de Jérémie remettant une arme dans le cadre d’une vision
  choice: Rendre l’action directement, sans ajouter dans ce verset qu’elle se déroule en vision.
  alternative: Ajouter une formule telle que « dans la vision » ou « il vit alors Jérémie ».
  rationale: Le grec de ce verset raconte simplement l’action de Jérémie. Le contexte visionnaire est établi par les versets voisins ; l’expliciter ici ajouterait un élément absent de cette phrase.
translation_notes:
  register: Français international moderne, clair et digne. La phrase est scindée en deux pour éviter une accumulation participiale peu naturelle en français, tout en conservant l’ordre des actions et leur simultanéité.
