  text: Take the holy sword[a], a gift from God[b], by which you will shatter the adversaries.
translation:
  language: fr
  text: '« Prends l’épée sainte[a], don de Dieu : par elle, tu briseras les adversaires[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Reçois l’épée sainte ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les ennemis ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Λάβε
  choice: Prends
  rationale: L’impératif aoriste de λαμβάνω exprime ici un ordre direct. « Prends » est naturel et énergique en français ; « reçois » reste possible dans le cadre de la vision.
- source_word: τὴν ἁγίαν ῥομφαίαν
  choice: l’épée sainte
  rationale: ῥομφαία désigne une grande épée ou lame. « Épée » est l’équivalent français le plus naturel, et « sainte » rend directement ἁγίαν sans restreindre indûment son sens à un usage cultuel.
- source_word: δῶρον παρὰ τοῦ θεοῦ
  choice: don de Dieu
  rationale: δῶρον est en apposition à l’épée, tandis que παρά avec le génitif indique la source. « Don de Dieu » rend cette relation avec concision et naturel.
- source_word: δι’ ἧς
  choice: par elle
  rationale: Le pronom relatif renvoie à l’épée et marque le moyen. « Par elle » conserve clairement ce sens instrumental.
- source_word: θραύσεις
  choice: tu briseras
  rationale: Le futur de θραύω évoque une destruction violente. « Briser » préserve cette force sans ajouter la nuance particulière de réduction en poussière que pourrait suggérer « écraser ».
- source_word: τοὺς ὑπεναντίους
  choice: les adversaires
  rationale: ὑπεναντίος désigne ceux qui se tiennent dans l’opposition ou l’hostilité. « Adversaires » maintient cette nuance et le registre soutenu du passage.
theological_decisions:
- issue: Valeur de ἁγίαν appliqué à l’épée
  choice: sainte
  alternative: sacrée
  rationale: L’épée est présentée comme venant de Dieu et comme mise à part. « Sainte » traduit directement ἁγίαν et conserve la portée religieuse du grec sans imposer une nuance exclusivement cultuelle.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation appositive « don de Dieu » suit étroitement la syntaxe grecque, tandis que les deux-points rendent naturellement le passage de la remise de l’épée à son effet annoncé.
