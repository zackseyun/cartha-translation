base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/040.yaml
  text: For just as drinking wine by itself[a], and then again water, is unpleasant, but wine mixed with water becomes pleasing and produces delight, so also the style of the composition delights the ears of those who read the work. Here, then, will be the end.
translation:
  language: fr
  text: Car, de même qu’il est désagréable de boire du vin seul, de même l’eau est désagréable ; mais le vin mélangé à l’eau devient plaisant et procure de l’agrément. De même, l’agencement du récit charme les oreilles de ceux qui lisent l’ouvrage. Ici donc s’achèvera le récit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἶνον κατὰ μόνας πίνειν
  choice: boire du vin seul
  rationale: Rend directement l’idée de boire le vin à part, sans expliciter davantage que le grec.
- source_word: ὕδωρ πάλιν πολέμιον
  choice: ou à l’inverse de l’eau seule, est désagréable
  rationale: Le sens contextuel de πολέμιον est celui d’une boisson peu agréable prise seule; la note conserve l’image littérale de l’hostilité.
- source_word: συγκερασθεὶς
  choice: mélangé à l’eau
  rationale: Désigne simplement le mélange traditionnel du vin et de l’eau.
- source_word: ἐπιτερπῇ τὴν χάριν ἀποτελεῖ
  choice: devient plaisant et procure de l’agrément
  rationale: 'Préserve les deux éléments de la formule grecque: le caractère plaisant et l’effet agréable produit.'
- source_word: τὸ τῆς κατασκευῆς τοῦ λόγου
  choice: l’art avec lequel le récit est composé
  rationale: κατασκευή évoque ici l’élaboration littéraire du λόγος; cette formulation française reste naturelle tout en soulignant le travail de composition.
- source_word: τέρπει τὰς ἀκοὰς
  choice: charme les oreilles
  rationale: Conserve l’image auditive du grec dans une expression française intelligible et littéraire.
- source_word: τῶν ἐντυγχανόντων τῇ συντάξει
  choice: de ceux qui lisent l’ouvrage
  rationale: Dans ce contexte écrit, ἐντυγχάνω signifie lire ou prendre connaissance, et σύνταξις désigne l’ouvrage composé.
- source_word: Ἐνταῦθα δὲ ἔσται ἡ τελευτή
  choice: C’est donc ici qu’il prendra fin
  rationale: Conclusion concise et délibérée, exprimée en français moderne sans perdre la solennité de la clôture.
