  naturalness: Le texte révisé est fluide en français moderne et conserve le ton littéraire de la conclusion. « L’agencement du récit » rend plus directement la construction littéraire évoquée par κατασκευή.
  terminology: « Désagréable » convient ici à πολέμιον dans le contexte gustatif, tandis que la note maintient la formulation littérale « l’eau est hostile ». « Agencement du récit » et « charme les oreilles » préservent l’image et le registre du grec.
