  - marker: b
    text: Ou « son propre sanctuaire » ou « son propre Temple » ; le grec dit littéralement « lieu », mais le contexte désigne probablement le lieu saint préservé de toute profanation.
    reason: précision contextuelle de τόπος et nuance cultuelle de ἀμίαντος
