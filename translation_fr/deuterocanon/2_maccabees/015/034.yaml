  yaml_path: translation/deuterocanon/2_maccabees/015/034.yaml
  text: And they all blessed the manifest Lord toward heaven[a], saying, “Blessed is the one who has kept his own place undefiled.”
translation:
  language: fr
  text: 'Alors tous bénirent, vers le ciel, le Seigneur manifeste[a], en disant : « Béni soit celui qui a gardé son propre lieu sans souillure[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Seigneur qui s’est manifesté », « le Seigneur illustre » ou « le Seigneur glorieux » ; le grec peut désigner le Seigneur rendu manifeste par son intervention.
    reason: ambiguïté lexicale de ἐπιφανής
  - marker: b
    text: Ou « son propre sanctuaire » ou « son propre Temple » ; le grec dit littéralement « lieu », mais le contexte désigne probablement le lieu saint préservé de toute profanation.
    reason: précision contextuelle de τόπος et nuance cultuelle de ἀμίαντος
lexical_decisions:
- source_word: εἰς τὸν οὐρανόν
  choice: tournés vers le ciel
  rationale: La construction exprime l’orientation de la bénédiction vers le ciel. Cette formulation française naturelle conserve ce mouvement sans faire du ciel le bénéficiaire de l’action.
- source_word: εὐλόγησαν / Εὐλογητός
  choice: bénirent / Béni soit
  rationale: Le même champ lexical est maintenu dans les deux propositions afin de reproduire la reprise du grec entre le verbe et l’acclamation.
- source_word: τὸν ἐπιφανῆ κύριον
  choice: le Seigneur qui s’était manifesté
  rationale: ἐπιφανής présente ici le Seigneur comme rendu manifeste par son intervention. Une relative est plus naturelle en français que « le Seigneur manifeste » et préserve le sens événementiel probable.
- source_word: διατηρήσας
  choice: a gardé
  rationale: Le verbe désigne la conservation du lieu dans l’état précisé par ἀμίαντον. « Gardé » est concis et laisse au complément prédicatif l’idée de pureté préservée.
- source_word: τὸν ἑαυτοῦ τόπον
  choice: son propre lieu
  rationale: τόπος signifie littéralement « lieu ». Le contexte évoque vraisemblablement le sanctuaire ou le Temple, mais le texte grec n’emploie pas un terme aussi précis.
- source_word: ἀμίαντον
  choice: sans souillure
  rationale: Cette expression rend la pureté cultuelle impliquée par ἀμίαντος dans un français actuel et digne.
theological_decisions:
- issue: Faut-il préciser dans le texte que « son propre lieu » est le sanctuaire ou le Temple de Dieu ?
  choice: Conserver « son propre lieu » dans le texte principal.
  alternative: « son propre sanctuaire » ou « son propre Temple »
  rationale: Le contexte favorise fortement l’identification avec le lieu saint, mais τόπος demeure un terme général. La note fournit l’interprétation contextuelle sans effacer la portée lexicale du grec.
- issue: Comment comprendre ἐπιφανῆ appliqué au Seigneur ?
  choice: « le Seigneur qui s’était manifesté »
  alternative: « le Seigneur glorieux » ou « le Seigneur éclatant »
  rationale: Dans le contexte d’une délivrance manifeste, le terme renvoie probablement au Seigneur qui a rendu son action visible. La traduction conserve cette dimension sans réduire le mot à une qualité esthétique.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La tournure « Béni soit » convient à l’acclamation liturgique. Les deux notes signalées [a] et [b] conservent les principales ambiguïtés lexicales du grec.
