  yaml_path: translation/deuterocanon/2_maccabees/015/039.yaml
  text: And if it is well written and suitably arranged[a], that is what I myself wanted; but if it is poorly and moderately done, this was what I could achieve.
translation:
  language: fr
  text: Si c’est bien écrit et convenablement composé, c’est ce que je souhaitais moi-même ; mais si le résultat est médiocre et seulement passable[a], c’était ce que je pouvais réaliser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « si c’est réalisé de façon modeste et moyenne ». Les deux adverbes grecs peuvent exprimer un résultat inférieur, ou la modestie d’une œuvre simplement moyenne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καλῶς
  choice: bien écrit
  rationale: Dans cette conclusion où l’auteur évalue son travail littéraire, l’adverbe signifie que l’ouvrage a été bien réalisé ; « bien écrit » explicite naturellement ce contexte en français.
- source_word: εὐθίκτως τῇ συντάξει
  choice: convenablement composé
  rationale: L’expression qualifie l’agencement ou la composition de l’ouvrage. « Convenablement composé » rend à la fois l’idée de justesse et celle d’organisation littéraire.
- source_word: ἤθελον
  choice: je souhaitais
  rationale: Le verbe exprime simplement l’intention ou le désir de l’auteur. « Souhaitais » convient au registre digne et modeste du passage.
- source_word: εὐτελῶς καὶ μετρίως
  choice: le résultat est médiocre et seulement passable
  rationale: Les deux adverbes contrastent avec la réussite évoquée auparavant et présentent le résultat comme inférieur ou simplement moyen. Cette formulation française évite l’expression peu naturelle « fait médiocrement et moyennement ».
- source_word: ἐφικτὸν ἦν μοι
  choice: c’est tout ce qui était à ma portée
  rationale: L’expression indique la limite des capacités de l’auteur. La tournure française conserve cette modestie et le sens de ce qu’il lui était possible d’accomplir.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La formulation conserve le ton d’humble appréciation littéraire de l’auteur sans durcir inutilement son jugement sur son propre travail.
