lexical_decisions:
- source_word: Οἱ δὲ περὶ τὸν Νικάνορα
  choice: Mais les hommes de Nicanor
  rationale: La tournure οἱ περὶ + accusatif désigne les personnes qui entourent ou accompagnent un chef. « Les hommes de Nicanor » l’exprime naturellement en français dans ce contexte militaire, sans préciser indûment leur rang.
- source_word: μετὰ σαλπίγγων
  choice: au son des trompettes
  rationale: μετά avec le génitif indique ici l’accompagnement. La formulation idiomatique française « au son des trompettes » conserve l’idée que leur avancée était accompagnée par ces instruments, sans les identifier à des clairons modernes.
- source_word: παιάνων
  choice: chants de guerre
  rationale: παιάν peut désigner un péan, chant de triomphe ou chant martial. « Chants de guerre » est clair et adapté au contexte, tout en évitant de réduire ces chants à de simples cris.
- source_word: προσῆγον
  choice: s’avançaient
  rationale: Dans cette scène de bataille, le verbe exprime un mouvement en direction de l’adversaire. « S’avançaient » restitue naturellement cette progression militaire et la valeur imperfective de la forme grecque.
