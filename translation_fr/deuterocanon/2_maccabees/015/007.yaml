  text: But Maccabeus was continually confident, with every hope, that he would obtain help from the Lord.
translation:
  language: fr
  text: Mais Maccabée demeurait constamment confiant, dans la pleine espérance d’obtenir du Seigneur du secours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ Μακκαβαῖος
  choice: Mais Maccabée
  rationale: δὲ marque ici le contraste avec ce qui précède; « Maccabée » est la forme française usuelle du nom.
- source_word: ἦν ἀδιαλείπτως πεποιθώς
  choice: gardait sans cesse la ferme confiance
  rationale: La périphrase grecque exprime un état durable de confiance; cette formulation naturelle conserve la continuité indiquée par ἀδιαλείπτως et la force de πεποιθώς.
- source_word: μετὰ πάσης ἐλπίδος
  choice: avec une pleine espérance
  rationale: πάσης intensifie ici l’espérance dans sa totalité ou sa plénitude; « pleine espérance » est plus idiomatique en français que « toute espérance » ou « chaque espérance ».
- source_word: ἀντιλήμψεως τεύξεσθαι
  choice: qu’il obtiendrait le secours
  rationale: τεύξομαι avec le génitif signifie « obtenir, recevoir », et ἀντίλημψις désigne une aide ou un secours effectif.
- source_word: παρὰ τοῦ κυρίου
  choice: du Seigneur
  rationale: La préposition παρά indique la source du secours; « le Seigneur » rend κύριος sans ajouter une précision absente du grec.
theological_decisions:
- issue: Nature et source du secours attendu
  choice: « qu’il obtiendrait le secours du Seigneur »
  alternative: « que le Seigneur le soutiendrait »
  rationale: La formulation retenue suit explicitement la construction grecque, qui présente le secours comme reçu de la part du Seigneur, sans préciser la manière de cette intervention.
translation_notes:
  register: Français moderne, digne et accessible. La phrase conserve le contraste initial, la confiance continue de Maccabée, l’intensité de son espérance et l’origine divine du secours.
