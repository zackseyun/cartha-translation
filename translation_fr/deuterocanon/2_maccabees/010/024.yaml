  text: having heard that the Jews did not approve of their father's change to Greek ways[a], but were choosing their own way of life and requesting that their own laws be permitted to them[b],
translation:
  language: fr
  text: ayant appris que les Juifs n’approuvaient pas le passage de son père aux coutumes grecques[a], mais préféraient leur propre manière de vivre et demandaient qu’on leur permette d’observer leurs prescriptions[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le passage de son père aux usages grecs » ou « à l’hellénisme ». L’expression grecque, condensée, évoque l’adoption de pratiques culturelles grecques. « Son père » renvoie au père du personnage auquel le participe initial se rapporte dans le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « qu’on leur permette de suivre leurs lois » ou « que leurs coutumes établies leur soient permises ». Le terme grec peut désigner des prescriptions reconnues par la loi ou la coutume.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκηκοότες
  choice: ayant appris
  rationale: Le participe parfait circonstanciel marque une information déjà reçue, sans imposer une relation temporelle plus précise.
- source_word: μὴ συνεὐδοκοῦντας
  choice: n’approuvaient pas
  rationale: Le verbe exprime ici l’absence d’approbation ou de consentement à l’égard du changement mentionné.
- source_word: τῇ τοῦ πατρὸς εἰς τὰ Ἑλληνικὰ μεταθέσει
  choice: le passage de leur père aux coutumes grecques
  rationale: μετάθεσις désigne un changement ou un passage, tandis que τὰ Ἑλληνικά renvoie aux pratiques culturelles grecques plutôt qu’à la seule langue. Le singulier « leur père » est conservé, malgré le caractère condensé et contextuellement difficile de la formule grecque.
- source_word: ἀλλὰ τὴν ἑαυτῶν ἀγωγὴν αἱρετίζοντας
  choice: mais préféraient leur propre manière de vivre
  rationale: ἀγωγή désigne la conduite ou la manière de vivre, et αἱρετίζω le fait de choisir ou de préférer. « Préféraient » rend naturellement le contraste avec le refus des coutumes grecques.
- source_word: ἀξιοῦν
  choice: demandaient
  rationale: Dans ce contexte de requête, le verbe signifie demander ou solliciter, sans nécessairement impliquer une exigence.
- source_word: συγχωρηθῆναι αὐτοῖς τὰ νόμιμα
  choice: qu’on leur permette d’observer leurs prescriptions
  rationale: συγχωρέω exprime une permission accordée; τὰ νόμιμα désigne les règles et observances établies par la loi ou la coutume. L’ajout idiomatique « d’observer » explicite en français ce que signifie concrètement leur permission sans réduire le terme aux seules lois écrites.
theological_decisions:
- issue: Sens culturel de εἰς τὰ Ἑλληνικά
  choice: aux coutumes grecques
  alternative: aux usages grecs / à l’hellénisme
  rationale: Le contexte oppose les pratiques grecques à la manière de vivre et aux prescriptions juives. « Coutumes grecques » reste accessible et évite de limiter la formule à la langue ou de lui donner une technicité excessive.
- issue: Portée de τὰ νόμιμα dans le contexte juif
  choice: leurs prescriptions
  alternative: leurs lois / leurs coutumes ancestrales
  rationale: Le terme peut englober lois, règles et observances coutumières. « Prescriptions » préserve cette portée juridico-religieuse sans affirmer explicitement une origine ancestrale que ce segment ne formule pas.
- issue: Référent de τοῦ πατρός
  choice: leur père
  alternative: leur ancêtre / le père
  rationale: Le grec porte bien le singulier « du père », mais son référent demeure condensé et potentiellement dépendant du contexte. La traduction conserve cette ambiguïté au lieu de la résoudre par « ancêtres » ou « dirigeants ».
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe participiale est conservée pour permettre l’enchaînement avec le contexte plus large du verset. Le texte maintient le singulier difficile « leur père » et la portée à la fois légale et coutumière de τὰ νόμιμα.
