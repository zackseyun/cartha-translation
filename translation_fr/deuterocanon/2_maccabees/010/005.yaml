  naturalness: « Après être entré en Judée et s’être approché de Bethsour » est recevable et la phrase est claire dans un registre narratif moderne. « Il la pressait durement » reste compréhensible, mais « il exerçait une forte pression sur elle » est plus idiomatique en français actuel tout en évitant d’imposer « assiéger » comme sens unique. La note b comporte en outre une apostrophe ouvrante fautive.
  terminology: « Bethsour », « place forte » et « schènes » conviennent. La conservation de la mesure ancienne, accompagnée d’une note, évite une conversion artificiellement précise. La variante « il l’assiégeait » doit être présentée comme possibilité contextuelle, et non comme équivalent exclusif.
