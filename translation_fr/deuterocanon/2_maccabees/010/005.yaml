  text: But when he entered Judea and came near Bethsura[a], a fortified place about five schoeni from Jerusalem[b], he was pressing it hard.
translation:
  language: fr
  text: Après être entré en Judée et s’être approché de Bethsour, place forte située à environ cinq schènes[a] de Jérusalem, il la pressait durement[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le schène était une ancienne unité de distance dont la valeur variait selon les lieux et les époques ; la mesure grecque est donc conservée plutôt que convertie avec une précision trompeuse.
    reason: cultural_note
  - marker: b
    text: 'Autre traduction possible : « il l’assiégeait ». Le grec dit littéralement qu’il « la pressait », expression qui peut désigner la pression militaire exercée contre une place forte.'
    reason: lexical_alternative
  - marker: c
    text: Le texte grec fourni correspond à 2 Maccabées 11.5 dans la numérotation habituelle, et non à 10.5.
    reason: reference_mismatch
lexical_decisions:
- source_word: εἰσελθὼν ... εἰς τὴν Ἰουδαίαν
  choice: Après être entré en Judée
  rationale: Le participe aoriste marque ici une action antérieure dans le récit. Cette formulation française est naturelle tout en conservant la relation temporelle du grec.
- source_word: συνεγγίσας Βεθσουρῶν
  choice: et s’être approché de Bethsour
  rationale: συνεγγίζω signifie « s’approcher » ou « venir près de ». « Bethsour » est la forme française traditionnelle et intelligible du toponyme.
- source_word: ὄντι μὲν ἐρυμνῷ χωρίῳ
  choice: place forte
  rationale: ἐρυμνός décrit un lieu fortifié ou naturellement défendable, tandis que χωρίον désigne ici un lieu. « Place forte » rend l’idée avec concision dans un contexte militaire.
- source_word: Ἱεροσολύμων δὲ ἀπέχοντι ὡσεὶ σχοίνους πέντε
  choice: située à environ cinq schènes de Jérusalem
  rationale: ὡσεί indique une approximation. La mesure ancienne est conservée sous une forme francisée, car sa valeur variait et une conversion moderne donnerait une précision trompeuse.
- source_word: τοῦτο ἔθλιβε
  choice: il la pressait durement
  rationale: θλίβω signifie littéralement « presser », « comprimer » ou « accabler ». Dans ce contexte militaire, la formulation conserve cette image sans imposer le sens technique plus précis d’un siège formel.
