base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/002.yaml
  text: After gathering about eighty thousand men and all the cavalry[a], he came against the Jews, thinking to make the city a dwelling place for Greeks[b],
translation:
  language: fr
  text: Après avoir rassemblé environ quatre-vingt mille hommes[a] et toute la cavalerie, il marcha contre les Juifs, avec l’intention de faire de la ville un lieu d’habitation pour les Grecs[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « environ huit myriades », c’est-à-dire environ quatre-vingt mille.
    reason: lexical_alternative
  - marker: b
    text: La phrase se poursuit au verset suivant, où s’achève le projet contrasté introduit ici à propos de « la ville ».
    reason: cross_reference
lexical_decisions:
- source_word: συναθροίσας
  choice: Après avoir rassemblé
  rationale: Le participe aoriste marque une action antérieure au verbe principal. Cette formulation restitue naturellement la succession des actions.
- source_word: περὶ τὰς ὀκτὼ μυριάδας
  choice: environ quatre-vingt mille hommes
  rationale: Une μυριάς vaut dix mille, et περὶ devant un nombre exprime l’approximation. « Hommes » est explicité d’après le contexte militaire.
- source_word: τὴν ἵππον ἅπασαν
  choice: toute la cavalerie
  rationale: Dans ce contexte militaire, ἵππος désigne collectivement la cavalerie; ἅπασαν en souligne la totalité.
- source_word: παρεγένετο ἐπὶ τοὺς Ἰουδαίους
  choice: il marcha contre les Juifs
  rationale: Avec ἐπί suivi de l’accusatif dans un récit militaire, l’expression indique un mouvement hostile. « Marcha contre » est naturel et plus précis qu’une simple arrivée.
- source_word: λογιζόμενος
  choice: avec l’intention de
  rationale: Le participe exprime ici un dessein réfléchi. Cette formulation rend le projet sans en faire un décret déjà arrêté.
- source_word: τὴν μὲν πόλιν
  choice: de la ville
  rationale: La ville est définie par le contexte. La particule μέν annonce un contraste poursuivi dans le verset suivant, que la note signale.
- source_word: Ἕλλησιν
  choice: pour les Grecs
  rationale: Le datif indique les bénéficiaires ou futurs habitants; « les Grecs » est clair en français courant.
- source_word: οἰκητήριον ποιήσειν
  choice: faire de la ville un lieu d’habitation
  rationale: La tournure conserve l’idée de transformer la ville en lieu où les Grecs habiteraient, sans ajouter une nuance absente du grec.
