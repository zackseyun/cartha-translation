  yaml_path: translation/deuterocanon/2_maccabees/010/016.yaml
  text: 'For letters had been written to the Jews from Lysias[a], containing this form: “Lysias to the multitude of the Jews[b], greetings.”'
translation:
  language: fr
  text: 'En effet, des lettres avaient été écrites aux Juifs de la part de Lysias et contenaient la formule suivante[a] : « Lysias à l’ensemble des Juifs[b], salut ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « elles contenaient la teneur suivante » ou « elles étaient rédigées dans les termes suivants ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « à la multitude des Juifs » ; on pourrait aussi traduire « au corps des Juifs » ou « à l’assemblée des Juifs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν γὰρ γεγραμμέναι
  choice: En effet, des lettres avaient été écrites
  rationale: Rend naturellement la construction périphrastique au plus-que-parfait passif et conserve la valeur explicative de γάρ.
- source_word: τοῖς Ἰουδαίοις
  choice: aux Juifs
  rationale: Le datif désigne ici les destinataires des lettres.
- source_word: παρὰ μὲν Λυσίου
  choice: de la part de Lysias
  rationale: παρά avec le génitif indique la provenance; cette tournure convient à une correspondance officielle sans effacer complètement la structure de la phrase grecque.
- source_word: περιέχουσαι τὸν τρόπον τοῦτον
  choice: Elles étaient ainsi formulées
  rationale: Expression française naturelle pour introduire la teneur ou la formulation exacte d’une lettre.
- source_word: τῷ πλήθει τῶν Ἰουδαίων
  choice: à l’ensemble des Juifs
  rationale: πλῆθος désigne ici le corps collectif des Juifs; « ensemble » est naturel et n’impose pas l’idée d’une assemblée institutionnelle.
- source_word: χαίρειν
  choice: salut !
  rationale: Rend la formule épistolaire grecque conventionnelle dans un français concis et digne.
