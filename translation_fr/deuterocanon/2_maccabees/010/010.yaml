  text: As before[a], being in battle array and having the ally from heaven[b], because the Lord had shown them mercy.
translation:
  language: fr
  text: Comme auparavant[a], ils étaient en ordre de bataille et avaient pour allié l’allié venu du ciel, car le Seigneur leur fit miséricorde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «comme précédemment, bien préparés» ; ἐν διασκευῇ peut désigner plus largement la préparation ou l’équipement, et non nécessairement une formation militaire.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec est plus resserré : littéralement, «ayant l’allié venu du ciel, le Seigneur leur ayant fait miséricorde».'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πρόηγον
  choice: comme auparavant
  rationale: L’expression adverbiale renvoie vraisemblablement à une occasion antérieure et établit une comparaison avec elle.
- source_word: ἐν διασκευῇ
  choice: en ordre de bataille
  rationale: διασκευή peut désigner la préparation ou l’équipement; le contexte militaire favorise ici l’idée d’une disposition pour le combat.
- source_word: σύμμαχον
  choice: allié
  rationale: Le terme désigne proprement celui qui combat aux côtés de quelqu’un et conserve ainsi la métaphore militaire.
- source_word: τὸν ἀπʼ οὐρανοῦ σύμμαχον
  choice: l’allié venu du ciel
  rationale: Cette formulation suit le mouvement du grec sans préciser davantage l’identité du secours céleste.
- source_word: ἔχοντες
  choice: avaient
  rationale: Le participe est rendu par un verbe coordonné pour produire une phrase française naturelle tout en maintenant le lien entre leur disposition et leur appui céleste.
- source_word: ἐλεήσαντος αὐτοὺς τοῦ κυρίου
  choice: car le Seigneur leur avait fait miséricorde
  rationale: Le génitif absolu fournit vraisemblablement la raison de l’aide céleste; «faire miséricorde» garde le motif théologique du grec dans un registre digne.
theological_decisions:
- issue: Identité et portée du secours céleste
  choice: Conserver l’image militaire de «l’allié venu du ciel» sans identifier explicitement cet allié.
  alternative: «Dieu pour allié venu du ciel» ou «le secours céleste»
  rationale: Le texte associe clairement l’assistance à la miséricorde du Seigneur, mais il ne formule pas explicitement l’apposition «Dieu, leur allié»; la traduction préserve cette retenue.
- issue: Rapport logique du génitif absolu ἐλεήσαντος
  choice: Le rendre causalement par «car».
  alternative: 'Juxtaposition plus littérale: «le Seigneur leur ayant fait miséricorde»'
  rationale: Le rapport causal est naturel dans le contexte, mais la note signale la construction grecque plus resserrée afin de ne pas masquer son degré d’explicitation.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe participiale grecque est légèrement dépliée pour la lisibilité; les notes préservent les principales ambiguïtés lexicales et syntaxiques.
