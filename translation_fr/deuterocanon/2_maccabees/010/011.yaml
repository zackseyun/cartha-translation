  yaml_path: translation/deuterocanon/2_maccabees/010/011.yaml
  text: But springing at the enemies like lions[a], they laid low eleven thousand of them, and one thousand six hundred cavalry; and they forced them all to flee.
translation:
  language: fr
  text: Mais, se jetant sur les ennemis comme des lions[a], ils en abattirent onze mille, ainsi que mille six cents cavaliers, et les forcèrent tous à prendre la fuite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec transmis emploie ici une forme rare et grammaticalement difficile, qui évoque ce qui est propre aux lions; traduction possible : « avec une ardeur de lions ».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: λεόντινων
  choice: comme des lions
  rationale: Le terme rare évoque un caractère léonin. La comparaison explicite restitue naturellement en français l’image de la férocité des lions, tout en signalant en note l’irrégularité de la formulation grecque transmise.
- source_word: ἐντινάξαντες
  choice: se jetant sur
  rationale: Le participe décrit un mouvement soudain et violent contre l’ennemi; « se jetant sur » convient à l’image léonine et reste idiomatique.
- source_word: κατέστρωσαν
  choice: abattirent
  rationale: Dans ce contexte guerrier, le verbe signifie mettre à terre, terrasser ou tuer. « Abattirent » conserve cette vigueur sans préciser plus que le grec le mode de mise hors de combat.
- source_word: χιλίους πρὸς τοῖς μυρίοις
  choice: onze mille
  rationale: L’expression additive grecque signifie littéralement « mille en plus des dix mille »; le total est rendu directement en français.
- source_word: ἱππεῖς
  choice: cavaliers
  rationale: Le nom désigne ici des combattants montés comptés individuellement; « cavaliers » s’accorde naturellement avec le nombre.
- source_word: ἑξακοσίους πρὸς χιλίοις
  choice: mille six cents
  rationale: La formulation grecque, littéralement « six cents en plus de mille », exprime un total de mille six cents.
- source_word: ἠνάγκασαν φεύγειν
  choice: les forcèrent tous à prendre la fuite
  rationale: Cette tournure restitue la valeur causative de ἠνάγκασαν et l’action exprimée par l’infinitif φεύγειν dans un français narratif naturel.
