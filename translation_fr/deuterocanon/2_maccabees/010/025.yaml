base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/025.yaml
  text: Therefore[a], since we choose that this nation also should be free from disturbance, we judge that the sanctuary should be restored to them[c][b], and that they should live according to the customs of their ancestors.
translation:
  language: fr
  text: C’est pourquoi, puisque nous voulons que cette nation, elle aussi, soit à l’abri des troubles, nous décidons que le sanctuaire[a] leur soit restitué et qu’ils organisent leur vie collective[b] selon les coutumes en vigueur au temps de leurs ancêtres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Temple »; le mot grec peut désigner le sanctuaire ou l’ensemble du complexe sacré.
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec peut aussi se traduire par « règlent leur vie civique » ou, dans certains contextes, « se gouvernent ». Il concerne ici la vie de la communauté, et pas seulement la conduite privée.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱρούμενοι
  choice: puisque nous voulons
  rationale: Le participe donne le motif de la décision officielle. « Nous voulons » conserve ici l’idée d’un choix délibéré et produit une formulation administrative naturelle en français.
- source_word: ἔθνος
  choice: nation
  rationale: Dans ce contexte administratif royal, le terme désigne le peuple juif comme collectivité distincte; « nation » en préserve la portée collective et politique.
- source_word: ἐκτὸς ταραχῆς εἶναι
  choice: soit à l’abri des troubles
  rationale: Cette expression évoque l’absence d’agitation ou de désordre public. La traduction retenue est idiomatique tout en conservant cette nuance.
- source_word: κρίνομεν
  choice: nous décidons
  rationale: Dans ce document officiel, le verbe exprime une détermination administrative; « décidons » convient mieux en français moderne que le calque « jugeons », sans aller jusqu’au sens plus marqué de « décrétons ».
- source_word: τὸ ἱερὸν
  choice: le sanctuaire
  rationale: Le terme peut désigner le lieu sacré ou l’ensemble du Temple. « Sanctuaire » conserve cette latitude référentielle.
- source_word: ἀποκατασταθῆναι
  choice: soit restitué
  rationale: Le passif indique le rétablissement du sanctuaire entre les mains de ceux auxquels il appartenait. « Restitué » rend clairement cette idée contextuelle, tout en gardant la valeur de restauration.
- source_word: πολιτεύεσθαι
  choice: qu’ils organisent leur vie collective
  rationale: Le verbe dépasse la simple conduite privée et peut viser l’organisation civique ou communautaire. Cette formulation conserve cette dimension sans imposer l’idée plus précise d’autonomie politique.
- source_word: κατὰ τὰ ἐπὶ τῶν προγόνων αὐτῶν ἔθη
  choice: selon les coutumes en vigueur au temps de leurs ancêtres
  rationale: La tournure grecque renvoie non seulement à des coutumes ancestrales, mais aux pratiques qui avaient cours à l’époque des ancêtres.
theological_decisions: []
translation_notes:
  register: Style administratif royal, formel mais lisible. La syntaxe française explicite la portée collective de πολιτεύεσθαι et maintient la référence historique contenue dans ἐπὶ τῶν προγόνων, sans transformer la déclaration en affirmation explicite d’autonomie politique.
