  text: And while they were there near Jerusalem[a], a horseman appeared, going before them[b], clothed in white and brandishing golden armor.
translation:
  language: fr
  text: Alors qu’ils se trouvaient là, près de Jérusalem, un cavalier[a] vêtu de blanc apparut devant eux[b], brandissant une armure d’or.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte ne précise pas qui est ce cavalier. Sa description peut évoquer une figure céleste ou angélique, mais le grec ne l’affirme pas.
    reason: alternative_reading
  - marker: b
    text: Ou « les précédant ». Le participe grec indique qu’il était ou avançait en tête; selon le contexte, il peut aussi suggérer qu’il les guidait.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτόθι δὲ πρὸς τοῖς Ἱεροσολύμοις ὄντων
  choice: Alors qu’ils se trouvaient là, près de Jérusalem
  rationale: La tournure rend naturellement en français la construction participiale de circonstance, tout en conservant à la fois le lieu déjà évoqué par αὐτόθι et la proximité exprimée par πρὸς avec le datif.
- source_word: ἐφάνη
  choice: apparut
  rationale: Le verbe présente une manifestation soudaine ou une entrée dans le champ de vision, sans préciser davantage sa nature.
- source_word: προηγούμενος αὐτῶν
  choice: devant eux
  rationale: Cette formulation conserve l’idée que le cavalier se trouve ou avance en tête du groupe, sans imposer qu’il le commande ou le guide explicitement.
- source_word: ἔφιππος
  choice: un cavalier
  rationale: L’adjectif grec signifie qu’un personnage est monté à cheval; le nom français est ici la formulation la plus naturelle.
- source_word: ἐν λευκῇ ἐσθῆτι
  choice: vêtu de blanc
  rationale: Cette expression courante préserve l’accent visuel du grec sans préciser indûment la nature du vêtement.
- source_word: πανοπλίαν χρυσῆν
  choice: une armure d’or
  rationale: πανοπλία désigne l’équipement militaire complet ou l’armure; « armure d’or » est clair et conserve l’image sans recourir au terme rare « panoplie ».
- source_word: κραδαίνων
  choice: brandissant
  rationale: Le participe évoque un mouvement énergique, comme celui d’agiter ou de faire tournoyer un objet. « Brandissant » restitue la vigueur de l’image, même si l’objet, l’armure, demeure inhabituel.
theological_decisions:
- issue: Nature de l’apparition
  choice: Décrire le personnage simplement comme un cavalier, conformément au grec.
  alternative: L’identifier comme un ange ou comme un cavalier céleste.
  rationale: Le caractère de l’apparition et sa description peuvent suggérer une figure surnaturelle, mais le texte grec ne l’identifie pas explicitement.
translation_notes:
  register: Français international moderne, fluide et digne. La phrase conserve le caractère saisissant de l’apparition ainsi que l’étrangeté concrète de l’expression grecque « brandissant une armure d’or », sans identifier théologiquement le cavalier.
