  yaml_path: translation/deuterocanon/2_maccabees/010/035.yaml
  text: Concerning the matters that Lysias[a], the king’s kinsman, has granted to you, we also approve.
translation:
  language: fr
  text: Quant aux dispositions que Lysias, parent du roi, vous a accordées, nous les approuvons nous aussi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπὲρ ὧν
  choice: Quant aux dispositions que
  rationale: ὑπέρ suivi du relatif introduit ici l’objet de la déclaration. « Dispositions » rend naturellement, dans ce contexte diplomatique, les différents points accordés, sans donner à la préposition un sens spatial ou substitutif.
- source_word: Λυσίας
  choice: Lysias
  rationale: Translittération française usuelle du nom propre grec.
- source_word: ὁ συγγενὴς τοῦ βασιλέως
  choice: parent du roi
  rationale: συγγενής désigne une personne apparentée. « Parent du roi » conserve le lien familial tout en restant naturel en français moderne; le contexte peut aussi suggérer un titre de cour, mais le grec garde la formulation de parenté.
- source_word: συνεχώρησεν ὑμῖν
  choice: vous a accordées
  rationale: Dans ce contexte diplomatique, συγχωρέω exprime des concessions ou permissions consenties. L’accord au féminin pluriel renvoie à « dispositions ».
- source_word: καὶ ἡμεῖς συνευδοκοῦμεν
  choice: nous les approuvons nous aussi
  rationale: συνευδοκέω signifie approuver avec quelqu’un, consentir ou souscrire. La formulation exprime clairement que les auteurs se joignent à l’approbation des concessions de Lysias.
