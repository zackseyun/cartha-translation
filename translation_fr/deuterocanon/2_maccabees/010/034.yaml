base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/034.yaml
  text: 'The Romans also sent them a letter[a], worded as follows: “Quintus Memmius and Titus Manius, elders of the Romans, to the people of the Jews[b], greetings.”'
translation:
  language: fr
  text: 'Les Romains leur envoyèrent aussi une lettre ainsi rédigée : « Quintus Memmius et Titus Manius, anciens de Rome[a], au peuple juif[b], salut ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme grec peut aussi désigner plus précisément des envoyés ou des sénateurs romains, mais il signifie littéralement « anciens ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « au peuple des Juifs ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπέμψαν δὲ καὶ οἱ Ῥωμαῖοι πρὸς αὐτοὺς ἐπιστολήν
  choice: Les Romains leur envoyèrent aussi une lettre
  rationale: Rend directement l’aoriste Ἐπέμψαν, la valeur additive de καί et le collectif οἱ Ῥωμαῖοι, sans préciser indûment qu’il s’agit des autorités romaines.
- source_word: ἔχουσαν οὕτως
  choice: ainsi rédigée
  rationale: Formule française naturelle introduisant la teneur exacte de la lettre.
- source_word: Κόιντος Μέμμιος, Τίτος Μάνιος
  choice: Quintus Memmius et Titus Manius
  rationale: Translittération conventionnelle des noms latins sous leur forme française usuelle; la coordination implicite de l’énumération grecque est explicitée.
- source_word: πρεσβυταὶ Ῥωμαίων
  choice: anciens des Romains
  rationale: Préserve le sens large de πρεσβυταί et évite d’imposer l’interprétation plus précise « sénateurs » ou « envoyés ».
- source_word: τῷ δήμῳ τῶν Ἰουδαίων
  choice: au peuple juif
  rationale: Formulation française courante qui conserve la dimension collective et civique de δῆμος; la structure grecque plus littérale est signalée en note.
- source_word: χαίρειν
  choice: salut !
  rationale: Équivalent français traditionnel et idiomatique de la formule épistolaire grecque χαίρειν.
