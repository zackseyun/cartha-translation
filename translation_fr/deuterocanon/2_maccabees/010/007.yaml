base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/007.yaml
  text: But Maccabeus himself was the first to take up arms[a], and he urged the others, by risking danger together with him, to come to the aid of their brothers[b]; and together they also charged out eagerly.
translation:
  language: fr
  text: Mais Maccabée lui-même fut le premier à prendre les armes. Il exhorta les autres à braver le danger avec lui pour porter secours à leurs frères[a], et tous ensemble s’élancèrent avec ardeur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « leurs frères » peut désigner leurs compatriotes juifs.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτος
  choice: fut le premier
  rationale: L’emploi prédicatif souligne que Maccabée prit l’initiative avant les autres.
- source_word: ἀναλαβὼν τὰ ὅπλα
  choice: à prendre les armes
  rationale: Cette expression idiomatique signifie ici s’armer; «prendre les armes» est naturel en français et convient au contexte militaire.
- source_word: προετρέψατο
  choice: Il exhorta
  rationale: Le verbe exprime une vive incitation à agir; «exhorta» en conserve la force sans être inutilement archaïque.
- source_word: ἅμα αὐτῷ διακινδυνεύοντας
  choice: à braver le danger avec lui
  rationale: La formulation rend l’idée de s’exposer au danger aux côtés de Maccabée. L’infinitif français explicite naturellement le rapport entre l’exhortation et le participe grec.
- source_word: ἐπιβοηθεῖν
  choice: pour porter secours à
  rationale: Le verbe désigne le fait de venir en aide dans une situation pressante; «porter secours» en restitue la vigueur.
- source_word: τοῖς ἀδελφοῖς αὐτῶν
  choice: à leurs frères
  rationale: Le grec emploie le masculin pluriel ἀδελφοῖς. Dans ce contexte, le terme désigne vraisemblablement leurs frères juifs ou leurs compatriotes.
- source_word: ὁμοῦ
  choice: tous ensemble
  rationale: Cette expression fait ressortir le mouvement collectif marqué par l’adverbe grec.
- source_word: προθύμως
  choice: avec ardeur
  rationale: L’adverbe indique à la fois empressement, détermination et zèle.
- source_word: ἐξώρμησαν
  choice: s’élancèrent
  rationale: Le verbe évoque un départ soudain et énergique, adapté à l’action militaire sans imposer l’idée plus précise d’une charge.
theological_decisions:
- issue: Sens collectif de ἀδελφοῖς dans un contexte national et militaire
  choice: leurs frères
  alternative: leurs compatriotes / leurs frères juifs
  rationale: «Frères» conserve l’image et la forme masculine du grec, tandis que la note signale son sens collectif probable sans le réduire à une seule interprétation.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe a été légèrement réorganisée pour rendre clairement le lien entre l’exhortation, le danger partagé et le secours apporté, tout en conservant la tension du participe grec. Le signalement du décalage de référence est indispensable puisque la source grecque fournie ne correspond pas à 2 Maccabées 10.7.
