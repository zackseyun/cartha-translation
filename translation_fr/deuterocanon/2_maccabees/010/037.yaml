  text: Therefore hurry[a], and send some men, so that we too may learn what your intention is.
translation:
  language: fr
  text: Hâtez-vous donc et envoyez quelques hommes, afin que nous sachions, nous aussi, quelles sont vos dispositions.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de quelle sorte vous êtes quant à la pensée ». L’expression grecque peut désigner l’état d’esprit, l’avis, la résolution ou l’intention.'
    reason: lexical_alternative
  - marker: b
