lexical_decisions:
- source_word: διὸ
  choice: donc
  rationale: Marque naturellement en français la conséquence ou l’inférence qui relie cette demande à ce qui précède.
- source_word: σπεύσατε
  choice: Hâtez-vous
  rationale: L’impératif aoriste appelle une action prompte. « Hâtez-vous » conserve l’urgence dans un registre digne et courant.
- source_word: πέμψατέ τινας
  choice: envoyez quelques hommes
  rationale: τινας désigne un nombre indéterminé de personnes. Dans ce contexte politico-militaire, « quelques hommes » reste concis sans préciser indûment leur fonction.
- source_word: ὅπως
  choice: afin que
  rationale: Introduit ici le but de l’envoi; « afin que » exprime clairement cette relation.
- source_word: καὶ ἡμεῖς
  choice: nous aussi
  rationale: Le pronom explicite, accompagné de καί, est emphatique et inclusif; « nous aussi » en restitue naturellement la nuance.
- source_word: ἐπιγνῶμεν
  choice: nous sachions
  rationale: Le subjonctif aoriste de ἐπιγινώσκω exprime ici le fait de parvenir à connaître ou de déterminer quelque chose grâce aux envoyés.
- source_word: ὁποῖοί ἐστε γνώμης
  choice: quelles sont vos dispositions
  rationale: L’expression grecque porte sur l’état d’esprit, l’avis, la résolution ou l’intention des destinataires. « Vos dispositions » préserve cette amplitude mieux qu’un terme plus univoque.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’urgence de l’impératif et l’indétermination de γνώμη sans réduire celle-ci à la seule notion d’intention. Un signalement explicite est nécessaire, car la référence demandée et le texte grec source présentent un décalage majeur.
