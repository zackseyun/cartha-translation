lexical_decisions:
- source_word: Μετʼ ὀλίγον δὲ παντελῶς χρονίσκον
  choice: Mais très peu de temps après
  rationale: La tournure accumule des termes qui soulignent la brièveté de l’intervalle. Cette formulation en restitue naturellement l’insistance en français, tandis que « Mais » représente δέ et maintient le lien avec le contexte précédent.
- source_word: ἐπίτροπος τοῦ βασιλέως
  choice: tuteur du roi
  rationale: ἐπίτροπος désigne une personne à qui l’on confie la garde ou la supervision d’une autre. « Tuteur » conserve ici le rapport personnel au roi sans imposer le titre constitutionnel plus précis de « régent ».
- source_word: συγγενὴς
  choice: parent de celui-ci
  rationale: Le mot indique un lien de parenté. L’ajout pronominal lève naturellement en français toute ambiguïté sur le fait que Lysias est parent du roi.
- source_word: ἐπὶ τῶν πραγμάτων
  choice: chargé des affaires
  rationale: L’expression signifie littéralement « préposé aux affaires » ou « au-dessus des affaires » et semble désigner une haute responsabilité administrative, sans que l’intitulé exact de la fonction soit explicité.
- source_word: λίαν βαρέως φέρων ἐπὶ τοῖς γεγονόσι
  choice: supportant très mal ce qui s’était passé
  rationale: L’expression idiomatique βαρέως φέρειν exprime une vive contrariété ou détresse. « Supportant très mal » en conserve la force sans préciser indûment s’il s’agit surtout de chagrin ou d’indignation.
