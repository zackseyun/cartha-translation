  text: But after a very short time[a], Lysias, the king’s guardian and kinsman and the one over affairs, taking the events very hard[c][b],
translation:
  language: fr
  text: Mais très peu de temps après[a], Lysias, tuteur du roi[b], parent de celui-ci et chargé des affaires[c], supportant très mal ce qui s’était passé,
  philosophy: optimal-equivalence
