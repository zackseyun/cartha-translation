  text: But if there are matters that should be brought before the king[a], send someone at once to look into these things, so that we may act as is fitting for us; for we are going on to Antioch.
translation:
  language: fr
  text: Quant aux affaires qu’il a décidé de soumettre au roi[a], envoyez immédiatement quelqu’un pour les examiner, afin que nous puissions agir comme il convient pour nous ; car nous approchons d’Antioche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit plus littéralement : « les choses qu’il a décidé de soumettre au roi ». Le sujet de « a décidé » n’est pas exprimé dans cette phrase, et l’ensemble est assez condensé.'
    reason: ambiguïté grammaticale
lexical_decisions:
- source_word: ἃ δὲ ἔκρινεν
  choice: Quant aux points qu’il a décidé
  rationale: Le grec dit littéralement « les choses qu’il a décidé [de…] ». La tournure thématique « quant aux points » est naturelle en français et conserve le verbe au singulier ainsi que son sujet implicite, sans transformer la proposition en condition.
- source_word: προσανενεχθῆναι τῷ Βασιλεῖ
  choice: de soumettre au roi
  rationale: Le verbe évoque le fait de porter une affaire devant une autorité. « Soumettre au roi » reste formel sans préciser s’il s’agit d’un rapport oral ou écrit.
- source_word: πέμψατέ τινα παραχρῆμα
  choice: envoyez immédiatement quelqu’un
  rationale: L’impératif appelle l’envoi rapide d’une personne non précisée ; « immédiatement » rend clairement παραχρῆμα.
- source_word: ἐπισκεψόμενον περὶ τούτων
  choice: pour les examiner
  rationale: 'Le participe futur désigne la mission de la personne envoyée : examiner les points en question. Le pronom « les » évite une répétition lourde.'
- source_word: ἵνʼ ἔχωμεν ὡς καθήκει ἡμῖν
  choice: afin que nous puissions agir comme il convient pour nous
  rationale: 'L’expression grecque est elliptique : « afin que nous ayons comme il nous convient ». Le français explicite prudemment l’idée d’être en mesure d’agir, tout en conservant la notion de conduite appropriée.'
- source_word: ἡμεῖς γὰρ προσάγομεν πρὸς Ἀντιοχίαν
  choice: car nous avançons vers Antioche
  rationale: Le présent exprime une progression en direction d’Antioche. « Avançons vers » préserve à la fois le mouvement et l’aspect en cours.
