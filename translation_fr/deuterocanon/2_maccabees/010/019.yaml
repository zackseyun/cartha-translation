  yaml_path: translation/deuterocanon/2_maccabees/010/019.yaml
  text: If[a], then, you maintain your goodwill toward these matters[b], I will also try from now on to be the cause of good things.
translation:
  language: fr
  text: Si donc vous conservez votre bienveillance à l’égard de ces affaires[a], je m’efforcerai moi aussi, à l’avenir, d’être cause de bonnes choses[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à l’égard de ces choses » ou « dans ces affaires ». L’expression grecque est large et peut désigner les sujets traités ou l’entreprise dans son ensemble.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « être cause de bonnes choses »; on peut aussi traduire « procurer des bienfaits ».
    reason: lexical_alternative
lexical_decisions:
- source_word: συντηρήσητε
  choice: vous conservez
  rationale: Le verbe exprime le fait de maintenir ou de préserver dans la durée; « conservez » rend directement cette continuité dans la proposition conditionnelle.
- source_word: εἰς τὰ πράγματα
  choice: envers cette entreprise
  rationale: Le grec désigne largement les affaires ou le travail dont il est question. Dans ce contexte littéraire, « cette entreprise » reste assez large tout en étant naturel en français.
- source_word: εὔνοιαν
  choice: votre bienveillance
  rationale: εὔνοια désigne une disposition favorable, la bienveillance ou la bonne volonté; « bienveillance » convient au registre digne de la conclusion.
- source_word: εἰς τὸ λοιπόν
  choice: à l’avenir
  rationale: Cette expression indique ce qui se fera dorénavant; « à l’avenir » est clair et naturel.
- source_word: πειράσομαι
  choice: je m’efforcerai
  rationale: Le futur moyen exprime l’intention de tenter ou de faire un effort. « Je m’efforcerai » conserve cette nuance sans garantir le résultat.
- source_word: αἰτιαῖος ἀγαθῶν γίνεσθαι
  choice: d’être à l’origine de bienfaits
  rationale: La formulation conserve l’idée d’agence causale exprimée par αἰτιαῖος, tandis que « bienfaits » rend naturellement le pluriel substantivé ἀγαθῶν sans préciser indûment leur nature.
