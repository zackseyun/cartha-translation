lexical_decisions:
- source_word: πέπομφα
  choice: J’ai envoyé
  rationale: Le parfait grec présente l’envoi comme accompli avec un effet actuel; le passé composé français le rend naturellement.
- source_word: δὲ καὶ τὸν Μενέλαον
  choice: aussi Ménélas
  rationale: Dans cette brève proposition, δέ assure la transition et καί met surtout Ménélas en ajout; «aussi» restitue cet ajout sans alourdir la phrase.
- source_word: παρακαλέσοντα ὑμᾶς
  choice: pour vous exhorter
  rationale: Le participe futur exprime le but de l’envoi. «Exhorter» conserve la portée souple mais pressante de παρακαλέω, qui peut selon le contexte signifier appeler, encourager ou presser.
