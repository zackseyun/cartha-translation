  text: But Maccabeus agreed to everything that Lysias urged, being concerned for the common good; for whatever Maccabeus submitted in writing to Lysias concerning the Jews, the secretary approved.
translation:
  language: fr
  text: Mais Maccabée consentit à tout ce que Lysias lui demandait, soucieux de ce qui était avantageux. En effet, tout ce que Maccabée avait présenté par écrit à Lysias au sujet des Juifs, le secrétaire y consentit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπένευσε
  choice: consentit
  rationale: Le verbe exprime ici l’assentiment donné aux demandes de Lysias.
- source_word: παρεκάλει
  choice: lui demandait
  rationale: Dans ce contexte de négociation, le verbe désigne des demandes pressantes, sans qu’il soit nécessaire d’introduire l’idée plus forte de contrainte.
- source_word: τοῦ συμφέροντος
  choice: de ce qui était avantageux
  rationale: 'Cette formulation conserve la portée ouverte du grec : ce qui est utile ou profitable, sans ajouter explicitement « le bien commun ».'
- source_word: ἔδωκεν ... διὰ γραπτῶν
  choice: avait remis par écrit
  rationale: Rend naturellement l’idée de communiquer ou soumettre des propositions sous forme écrite.
- source_word: συνεχώρησεν
  choice: approuva
  rationale: Dans ce contexte administratif, le verbe signifie accorder ou accepter ce qui a été soumis.
- source_word: ὁ γραμματεύς
  choice: le secrétaire
  rationale: Traduction directe du titre grec, sans tenter d’identifier plus précisément le fonctionnaire.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La traduction reste proche de la syntaxe argumentative du grec tout en divisant la phrase en deux pour une lecture naturelle. Elle n’explicite pas le bénéficiaire de « ce qui était avantageux », que le texte grec laisse indéterminé.
