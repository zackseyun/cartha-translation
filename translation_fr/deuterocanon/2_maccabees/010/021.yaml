  text: Farewell[a]. In the one hundred forty-eighth year[b], on the twenty-fourth day of Dioscorinthius.
translation:
  language: fr
  text: Portez-vous bien.[a] En l’an cent quarante-huit, le vingt-quatrième jour de Dioscorinthius.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque signifie littéralement « soyez forts » ou « soyez en bonne santé » ; elle sert ici de formule de clôture d’une lettre.
    reason: lexical_alternative
  - marker: b
    text: Dioscorinthius est un nom de mois du calendrier macédonien, conservé ici par translittération.
    reason: cultural_note
lexical_decisions:
- source_word: ἔρρωσθε
  choice: Portez-vous bien
  rationale: Formule épistolaire de clôture qui souhaite santé et vigueur aux destinataires. Cette tournure française conserve le souhait exprimé tout en fonctionnant naturellement comme formule finale.
- source_word: ἔτους ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: La cent quarante-huitième année
  rationale: La formule grecque au génitif introduit la date. L’ordinal développé reproduit directement l’expression de l’année sans ajouter dans le texte principal l’identification de l’ère, absente du grec.
- source_word: Διὸς Κορινθίου
  choice: Dios Corinthios
  rationale: Nom calendérique macédonien conservé par translittération, afin de ne pas lui imposer une traduction conjecturale. « jour de » suffit à rendre explicite sa fonction dans la date.
- source_word: τετράδι καὶ εἰκάδι
  choice: le vingt-quatrième jour
  rationale: Littéralement « le quatrième et le vingtième »; il s’agit de la manière grecque ordinaire d’exprimer le vingt-quatrième jour. La formulation française en restitue naturellement le sens.
