translation_notes:
  register: Français moderne, clair et digne. La formule de salutation finale demeure idiomatique, tandis que la date suit de près la structure grecque. Le nom de mois est translittéré, et l’ère chronologique n’est pas précisée dans le texte principal puisqu’elle ne l’est pas explicitement dans la source.
