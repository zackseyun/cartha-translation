lexical_decisions:
- source_word: ὑγιαίνετε
  choice: Portez-vous bien
  rationale: Dans cette formule finale de lettre, le verbe signifie littéralement « être en bonne santé » et fonctionne comme une salutation de clôture. « Portez-vous bien » reste naturel en français tout en conservant davantage l’image grecque que le simple « Adieu ».
- source_word: ἔτους
  choice: En l’an
  rationale: Le génitif appartient à une formule de datation; « en l’an » est la tournure française idiomatique.
- source_word: ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: cent quarante-huit
  rationale: L’expression ordinale qualifie l’année; dans la formule française « en l’an cent quarante-huit », le cardinal est l’usage naturel.
- source_word: Ξανθικοῦ
  choice: Xanthique
  rationale: Nom du mois macédonien, rendu sous sa forme française traditionnelle plutôt que traduit.
- source_word: πεντεκαιδεκάτῃ
  choice: le quinze du mois
  rationale: Le datif féminin indique la date. La mention explicite du mois restitue naturellement en français l’ellipse grecque.
