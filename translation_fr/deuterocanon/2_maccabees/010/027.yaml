lexical_decisions:
- source_word: Πρὸς δὲ τὸ ἔθνος
  choice: La lettre du roi adressée à la nation
  rationale: Πρός avec l’accusatif indique ici le destinataire. « Adressée à la nation » exprime naturellement que la lettre vise collectivement le peuple juif, tout en conservant la portée politique de ἔθνος.
- source_word: ἡ τοῦ βασιλέως ἐπιστολὴ τοιαύδε ἦν
  choice: était rédigée ainsi
  rationale: Cette formule introduit le contenu de la lettre. « Était rédigée ainsi » est idiomatique en français et restitue la valeur déictique de τοιαύδε.
- source_word: Βασιλεὺς Ἀντίοχος
  choice: Le roi Antiochos
  rationale: Cette formulation conserve la place officielle du titre royal et emploie la forme française courante du nom grec Ἀντίοχος.
- source_word: γερουσίᾳ
  choice: conseil des anciens
  rationale: Le terme désigne un corps officiel composé d’anciens. « Conseil des anciens » rend clairement son caractère institutionnel sans introduire les connotations romaines de « sénat ».
- source_word: τοῖς ἄλλοις Ἰουδαίοις
  choice: aux autres Juifs
  rationale: Ἄλλοις distingue l’ensemble plus large des Juifs du conseil déjà nommé. « Aux autres Juifs » en est la traduction directe, tandis que « au reste des Juifs » demeure possible.
- source_word: χαίρειν
  choice: salut !
  rationale: Dans l’ouverture d’une lettre, χαίρειν est une formule conventionnelle de salutation. « Salut ! » convient au registre épistolaire officiel et évite le littéralisme « réjouissez-vous ».
