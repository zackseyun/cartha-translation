translation:
  language: fr
  text: 'La lettre du roi adressée à la nation était rédigée ainsi : « Le roi Antiochos au conseil des anciens[a] des Juifs et aux autres Juifs[b], salut ! »[c]'
  philosophy: optimal-equivalence
