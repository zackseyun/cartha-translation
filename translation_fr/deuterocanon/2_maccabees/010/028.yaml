  text: Farewell[a]. May it be as we would wish[b]; and we ourselves are also well.
translation:
  language: fr
  text: Portez-vous bien[a]. Puisse-t-il en être comme nous le souhaitons[b] ; quant à nous, nous sommes aussi en bonne santé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie littéralement le langage de la santé dans cette formule finale : « Portez-vous bien… et nous-mêmes sommes aussi en bonne santé. »'
    reason: lexical_alternative
  - marker: b
    text: Ce texte ressemble à la formule finale d’une lettre et ne s’enchaîne pas, sur le plan narratif, avec le contexte environnant dans de nombreuses divisions modernes des versets. Le texte grec fourni est traduit tel quel.
    reason: cultural_note
lexical_decisions:
- source_word: ἔρρωσθε
  choice: Portez-vous bien
  rationale: Impératif pluriel de ῥώννυμι employé comme formule de salutation finale. « Portez-vous bien » reste naturel en français tout en conservant l’image de la santé présente dans le grec.
- source_word: εἴη ἂν
  choice: Puisse-t-il en être
  rationale: L’optatif accompagné de ἄν exprime ici un souhait teinté de potentialité. Cette formulation française préserve le mode du souhait sans préciser ce que le grec laisse implicite.
- source_word: ὡς βούλομεθα
  choice: comme nous le souhaitons
  rationale: βούλομαι exprime la volonté ou le souhait. « Souhaitons » convient au ton courtois de cette conclusion épistolaire.
- source_word: καὶ αὐτοὶ δὲ
  choice: quant à nous, … aussi
  rationale: La tournure marque à la fois la transition, l’insistance sur le sujet et la réciprocité. Le français répartit ces nuances de manière idiomatique.
- source_word: ὑγιαίνομεν
  choice: nous sommes aussi en bonne santé
  rationale: Le verbe signifie littéralement être sain ou en bonne santé. Le choix explicite le sens concret et fait écho à la formule initiale.
