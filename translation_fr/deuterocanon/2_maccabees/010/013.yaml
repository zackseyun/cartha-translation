  text: But since he was not foolish[a], but was considering within himself the defeat that had happened to him, and had realized that the Hebrews were unconquerable because the mighty God was fighting alongside them[b], he sent ahead
translation:
  language: fr
  text: Mais, n’étant pas insensé, il mettait en balance dans son esprit le revers qui lui était arrivé et, ayant compris que les Hébreux étaient invincibles parce que le Dieu puissant combattait à leurs côtés, ayant envoyé d’avance…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἀνόους δὲ ὑπάρχων
  choice: Mais comme il n’était pas insensé
  rationale: Cette formulation conserve la litote grecque et sa valeur appréciative dans un français naturel et digne.
- source_word: πρὸς ἑαυτὸν ἀντιβάλλων
  choice: il mettait en balance dans son esprit
  rationale: Le choix exprime la réflexion intérieure et la nuance de comparaison ou de mise en regard portée par ἀντιβάλλων.
- source_word: τὸ γεγονὸς περὶ αὐτὸν ἐλάττωμα
  choice: le revers qui lui était arrivé
  rationale: « Revers » convient au contexte militaire sans réduire nécessairement ἐλάττωμα à une défaite totale.
- source_word: συννοήσας
  choice: avait compris
  rationale: Le plus-que-parfait rend naturellement l’antériorité de cette prise de conscience par rapport à l’envoi qui suit.
- source_word: ἀνικήτους εἶναι τοὺς Ἑβραίους
  choice: que les Hébreux étaient invincibles
  rationale: « Hébreux » traduit directement Ἑβραίους, tandis qu’« invincibles » conserve la force de ἀνικήτους.
- source_word: τοῦ δυναμένου θεοῦ
  choice: le Dieu puissant
  rationale: Le participe substantivé souligne la capacité ou la puissance de Dieu; « le Dieu puissant » est concis et naturel en français.
- source_word: συμμαχοῦντος αὐτοῖς
  choice: combattait à leurs côtés
  rationale: Cette expression préserve nettement la dimension militaire de συμμαχέω plutôt que de la généraliser en simple aide.
- source_word: προαποστείλας
  choice: Il envoya donc des hommes en avant
  rationale: Le verbe indique un envoi préalable. L’ajout générique « des hommes » fournit en français un complément naturel, dont l’identité est précisée par la suite de la phrase au verset suivant.
theological_decisions:
- issue: Désignation par Ἑβραίους
  choice: les Hébreux
  alternative: les Juifs
  rationale: Le grec emploie explicitement Ἑβραίους; la traduction conserve cette désignation sans l’harmoniser avec un terme plus fréquent.
- issue: Intervention divine dans le combat
  choice: parce que le Dieu puissant combattait à leurs côtés
  alternative: puisque Dieu était leur allié
  rationale: La formulation retenue maintient l’image explicite d’une participation active de Dieu au combat et le lien causal avec leur invincibilité.
- issue: Sens de τοῦ δυναμένου θεοῦ
  choice: le Dieu puissant
  alternative: le Dieu qui en a le pouvoir
  rationale: Le choix garde l’accent sur la puissance divine sans préciser un complément implicite ni introduire une interprétation doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, narratif et digne. La longue chaîne participiale grecque est légèrement restructurée pour rester lisible. Le verset demeure syntaxiquement ouvert sur la suite du récit, conformément à προαποστείλας.
