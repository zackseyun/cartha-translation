  text: But concerning these matters in detail[b][a], I have instructed both these men and those from me to speak with you.
translation:
  language: fr
  text: Mais, pour ce qui concerne ces affaires en détail[a], j’ai chargé aussi bien ces hommes que ceux de ma part[b] de s’entretenir avec vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « point par point » ou « précisément ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « ceux d’auprès de moi » ou « ceux de ma part » ; l’expression peut désigner des personnes liées au rédacteur, sans préciser leur rôle exact.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ δὲ τούτων
  choice: Mais pour ce qui concerne ces questions
  rationale: Avec le génitif τούτων, ὑπέρ introduit ici le sujet dont il est question. Cette tournure française restitue naturellement le sens thématique, tandis que « mais » rend δέ.
- source_word: κατὰ μέρος
  choice: en détail
  rationale: L’expression signifie que les questions seront traitées point par point ou de façon précise. « En détail » est idiomatique et conserve cette portée.
- source_word: ἐντέταλμαι
  choice: j’ai chargé
  rationale: Le parfait de ἐντέλλομαι exprime des instructions déjà données et toujours valables. « J’ai chargé » convient au registre diplomatique sans renforcer indûment le verbe en « j’ai ordonné ».
- source_word: τούτους τε καὶ
  choice: aussi bien ces hommes que
  rationale: La construction τε καὶ coordonne les deux groupes. « Ces hommes » désigne naturellement les personnes présentes ou déjà identifiées.
- source_word: τοὺς παρʼ ἐμοῦ
  choice: ceux qui viennent de ma part
  rationale: Le grec dit littéralement « ceux d’auprès de moi » ou « ceux de ma part ». La formulation retenue reste proche du texte et suggère leur relation au rédacteur sans ajouter explicitement qu’ils ont été envoyés.
- source_word: διαλεχθῆναι ὑμῖν
  choice: de s’entretenir avec vous
  rationale: διαλέγομαι désigne ici un échange ou une discussion. « S’entretenir avec vous » rend le caractère réciproque et le ton formel de la communication.
