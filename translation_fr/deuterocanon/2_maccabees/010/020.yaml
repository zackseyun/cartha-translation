  source_fidelity: 'Le sens général est bien rendu : ὑπὲρ δὲ τούτων introduit le sujet, κατὰ μέρος exprime un traitement détaillé, et ἐντέταλμαι correspond à des instructions déjà données. Toutefois, « ceux qui viennent de ma part » explicite un mouvement ou une mission que τοὺς παρʼ ἐμοῦ ne formule pas expressément ; le grec conserve une désignation relationnelle plus sobre (« ceux de ma part »).'
  naturalness: La phrase est claire et d’un registre diplomatique approprié. « Ces affaires » est un peu plus large et plus naturel que « ces questions » pour τούτων dans ce contexte épistolaire. La formulation légèrement littérale « ceux de ma part » est justifiée ici par la note et évite une interprétation indue.
