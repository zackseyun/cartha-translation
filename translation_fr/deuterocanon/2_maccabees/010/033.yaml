  text: Farewell[a]. In the one hundred forty-eighth year[b], on the fifteenth day of Xanthicus.
translation:
  language: fr
  text: Portez-vous bien[a]. En l’an cent quarante-huit, le quinzième jour du mois de Xanthique[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec signifie littéralement « soyez forts » ou « portez-vous bien »; dans une formule finale de lettre, il équivaut à un souhait d’adieu.
    reason: lexical_alternative
  - marker: b
    text: Xanthique était le nom d’un mois macédonien employé dans les datations de l’époque hellénistique.
    reason: cultural_note
lexical_decisions:
- source_word: ἔρρωσθε
  choice: Portez-vous bien
  rationale: Dans une formule finale de lettre, cet impératif pluriel fonctionne comme un souhait conventionnel de bonne santé et de salut plutôt que comme une exhortation littérale à la force.
- source_word: ἔτους
  choice: En l’an
  rationale: Le génitif appartient à une formule de datation; « En l’an » est une tournure française naturelle et fidèle.
- source_word: ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: cent quarante-huit
  rationale: L’expression ordinale désigne la 148e année, sans préciser dans le texte l’ère chronologique sous-entendue.
- source_word: Ξανθικοῦ
  choice: du mois de Xanthique
  rationale: Il s’agit du nom d’un mois macédonien; la forme française historique « Xanthique » permet de l’identifier clairement comme tel.
- source_word: πεντεκαιδεκάτῃ
  choice: le quinzième jour
  rationale: Dans cette formule de datation, le datif indique le jour du mois; la formulation explicite est naturelle en français.
