  text: But most of them escaped wounded and naked[a]; and Lysias himself also escaped by fleeing shamefully.
translation:
  language: fr
  text: Mais la plupart d’entre eux s’en sortirent, blessés et nus[a] ; Lysias lui-même s’en sortit aussi en fuyant honteusement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « dépouillés » : il se peut qu’ils aient fui après avoir perdu leur équipement ou leurs vêtements de dessus au combat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πλείονες
  choice: la plupart d’entre eux
  rationale: Le comparatif substantivé désigne ici la majorité du groupe ; cette tournure est naturelle en français moderne.
- source_word: τραυματίαι
  choice: blessés
  rationale: Le terme désigne des hommes blessés ; l’adjectif détaché restitue clairement leur état sans alourdir la phrase.
- source_word: γυμνοὶ
  choice: nus
  rationale: Le mot signifie directement « nus » ou « dépouillés ». La traduction littérale préserve l’image du grec, tandis qu’une note signale le sens contextuel possible.
- source_word: διεσώθησαν / διεσώθη
  choice: réussirent à s’échapper / réussit à s’échapper
  rationale: Dans ce récit militaire, le verbe exprime le fait de sortir vivant du danger et de parvenir à fuir. « Réussir à s’échapper » rend cette nuance de survie heureuse.
- source_word: αἰσχρῶς
  choice: honteusement
  rationale: L’adverbe porte un jugement de honte ou de déshonneur, conservé sans atténuation.
- source_word: φεύγων
  choice: en prenant … la fuite
  rationale: Le participe présent indique la circonstance ou le moyen de l’évasion ; cette formulation est idiomatique en français et maintient le lien avec αἰσχρῶς.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La répétition de « réussir à s’échapper » reflète celle du verbe grec, et « nus » conserve l’expression frappante du texte sans imposer son interprétation contextuelle.
