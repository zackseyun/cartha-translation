  text: Therefore[a], for those going down until the thirtieth of Xanthicus, there will be a right hand given with safe-conduct[c][b],
translation:
  language: fr
  text: Ainsi donc, à ceux qui partiront jusqu’au trentième jour du mois de Xanthique[a], on accordera la main droite avec une autorisation[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Xanthique est le nom d’un mois du calendrier macédonien employé à l’époque hellénistique.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « il y aura pour eux une main droite avec l’autorisation ». La « main droite » peut évoquer un engagement ou une garantie solennelle. Le mot grec rendu par « autorisation » peut aussi désigner une permission, une liberté ou une immunité ; dans ce contexte, il peut impliquer la possibilité de circuler sans entrave.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ainsi donc
  rationale: Rend la valeur conclusive de la particule dans un registre soutenu mais courant.
- source_word: καταπορευομένοις
  choice: ceux qui partiront
  rationale: Le verbe exprime littéralement un déplacement vers le bas ou au loin. Dans ce contexte, « partir » communique naturellement le mouvement de départ sans imposer une descente géographique incertaine.
- source_word: μέχρι τριακάδος Ξανθικοῦ
  choice: au plus tard le trentième jour du mois de Xanthique
  rationale: La tournure indique ici une échéance. L’ajout explicatif « du mois » permet au lecteur moderne de reconnaître Xanthique comme un nom de mois.
- source_word: ὑπάρξει
  choice: recevront
  rationale: Le grec dit littéralement « il y aura pour eux ». En français, « recevront » restitue naturellement cette construction possessive dans la phrase.
- source_word: δεξιὰ
  choice: la main droite en gage
  rationale: La « main droite » peut désigner, dans un contexte diplomatique, un engagement solennel ou une garantie. La métaphore est conservée et sa fonction est explicitée avec sobriété.
- source_word: μετὰ τῆς ἀδείας
  choice: de sauf-conduit
  rationale: ἀδεία peut signifier permission, liberté ou immunité. Ici, le terme désigne vraisemblablement l’assurance de pouvoir partir sans être inquiété.
