  register: Français international moderne, digne et lisible. La syntaxe reste suspendue par une virgule, car le grec transmis constitue manifestement le début ou un segment d’une phrase plus longue. Les notes préservent l’image de la main droite, l’ambiguïté directionnelle de καταπορεύομαι et la gamme de sens de ἀδεία.
