  yaml_path: translation/deuterocanon/2_maccabees/010/026.yaml
  text: Therefore you will do well to send to them and give them pledges of good faith[a], so that, knowing our intention[c][b], they may be encouraged and may live gladly with support for their own interests.
translation:
  language: fr
  text: Tu feras donc bien d’envoyer auprès d’eux et de leur donner des gages de bonne foi[a], afin que, connaissant notre intention, ils soient encouragés[b] et vivent agréablement, avec de l’aide pour leurs propres affaires[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ayant donné des mains droites » ; il s’agit d’un idiome grec désignant des assurances ou des gages de paix et de bonne foi.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « soient de bon courage » ou « soient confiants ».'
    reason: lexical_alternative
  - marker: c
    text: 'La fin de la phrase peut aussi se comprendre plus étroitement : « avec une protection pour leurs propres biens ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὖ οὖν ποιήσεις
  choice: Tu feras donc bien
  rationale: Cette tournure française naturelle conserve la valeur de conseil ou d’approbation exprimée par le futur grec.
- source_word: διαπεμψάμενος πρὸς αὐτούς
  choice: de prendre contact avec eux
  rationale: Le verbe évoque l’envoi d’un message ou de personnes auprès d’eux, sans que le complément soit précisé. La formulation française garde cette indétermination.
- source_word: δοὺς δεξιάς
  choice: de leur donner des garanties de bonne foi
  rationale: L’expression grecque signifie littéralement « donner les mains droites » et désigne un geste engageant qui garantit la paix ou la loyauté. Le sens idiomatique est rendu dans le texte, et l’image littérale est signalée en note.
- source_word: τὴν ἡμετέραν προαίρεσιν
  choice: nos intentions
  rationale: προαίρεσις désigne ici une intention délibérée ou une ligne de conduite. Le pluriel est idiomatique en français dans ce contexte diplomatique.
- source_word: εὔθυμοί τε ὦσιν
  choice: ils reprennent courage
  rationale: Le terme grec décrit des personnes rassurées, confiantes ou de bonne humeur. « Reprendre courage » exprime naturellement l’effet attendu des garanties.
- source_word: ἡδέως διαγίνωνται
  choice: poursuivent volontiers leur vie
  rationale: διαγίνομαι peut désigner le fait de continuer à vivre ou de passer son temps, tandis que ἡδέως indique une disposition agréable et volontaire.
- source_word: πρὸς τῇ τῶν ἰδίων ἀντιλήψει
  choice: en veillant à leurs propres intérêts
  rationale: ἀντίληψις peut évoquer la prise en charge, l’aide, la protection ou l’attention portée à quelque chose; τὰ ἴδια renvoie aux biens, intérêts ou affaires propres. La traduction reste générale, tandis que la note conserve les autres possibilités.
