  source_fidelity: 'Le sens général est fidèlement rendu : χρῆσθαι régit les deux datifs, νόμοις est correctement rendu par « lois », et la défense d’importuner qui que ce soit est bien conservée. Toutefois, τῶν ἠγνοημένων est un neutre substantivé de portée large (« ce qui a été fait/ignoré par ignorance ») ; « les actes commis » restreint inutilement le référent. La note doit aussi donner une véritable alternative de traduction de δαπανήμασιν, sans introduire « prendre en charge », qui exprime plutôt l’idée de payer ou d’assumer une charge.'
  naturalness: La formulation est naturelle, moderne et convient au registre administratif d’un décret. Le déplacement de « de quelque manière que ce soit » entre virgules améliore légèrement la lisibilité sans modifier l’emphase grecque.
  terminology: « Ressources » est un choix recevable pour δαπανήμασιν, dont le sens peut couvrir dépenses et moyens matériels. « Suivre leurs lois » rend idiomatiquement l’usage des lois en français, sans imposer une interprétation confessionnelle. « Inquiété » convient bien à παρενοχληθήσεται dans ce contexte.
