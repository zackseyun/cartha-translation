    rationale: « Prendre en charge leurs propres dépenses » ne correspond pas directement à χρῆσθαι + datif, qui signifie faire usage de. Une note doit présenter « dépenses » comme alternative lexicale à « ressources », non comme une paraphrase qui change la relation verbale.
