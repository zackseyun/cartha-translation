  yaml_path: translation/deuterocanon/2_maccabees/010/031.yaml
  text: that the Jews should make use of their own resources and laws as before[a], and that none of them should in any way be harassed concerning the things done in ignorance.
translation:
  language: fr
  text: que les Juifs puissent disposer de leurs propres ressources et suivre leurs lois comme auparavant[a], et qu’aucun d’eux ne soit, de quelque manière que ce soit, inquiété au sujet de ce qui a été fait par ignorance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs propres dépenses » ou « leurs propres moyens matériels » ; le terme grec peut désigner des dépenses engagées ou les ressources matérielles dont on dispose.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρῆσθαι
  choice: puissent disposer de … et suivre
  rationale: 'Le verbe χράομαι régit à la fois « ressources » et « lois ». En français, une coordination distributive évite l’expression peu naturelle « utiliser des lois » : on dispose de ressources et l’on suit des lois.'
- source_word: τοῖς ἑαυτῶν δαπανήμασιν
  choice: leurs propres ressources
  rationale: δαπάνημα peut désigner ce qui est dépensé, les frais engagés ou les moyens matériels. « Ressources » convient au contexte administratif tout en conservant une certaine largeur de sens; l’ambiguïté est signalée en note.
- source_word: νόμοις
  choice: leurs lois
  rationale: νόμος désigne directement des lois, même s’il peut parfois inclure les coutumes. Le contexte concerne la liberté accordée aux Juifs de vivre selon leur ordre propre.
- source_word: καθὰ καὶ τὸ πρότερον
  choice: comme auparavant
  rationale: Rendu idiomatique et fidèle de la référence à la pratique antérieure.
- source_word: παρενοχληθήσεται
  choice: ne soit inquiété
  rationale: Le futur passif exprime ici la teneur d’une disposition officielle. « Inquiété » signifie être importuné, poursuivi ou soumis à des tracasseries, sans surcharger le degré de contrainte.
- source_word: περὶ τῶν ἠγνοημένων
  choice: au sujet des actes commis par ignorance
  rationale: Le participe parfait passif substantivé renvoie de manière générale à ce qui a été fait sans savoir. « Actes » explicite naturellement le tour grec sans identifier davantage leur nature.
