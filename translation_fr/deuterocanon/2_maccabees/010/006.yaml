base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/006.yaml
  text: But when those around Makkabaios[a], while besieging it, gained possession of the strongholds, with lamentations and tears they, together with the crowds[b], pleaded with the Lord to send a good angel for the salvation of Israel.
translation:
  language: fr
  text: Quand Maccabée et ses hommes apprirent qu’il assiégeait les forteresses[a], ils supplièrent le Seigneur, avec la foule, au milieu des lamentations et des larmes, d’envoyer un ange bon[b] pour sauver Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « apprirent qu’il assiégeait les forteresses ». Le pronom renvoie à un personnage mentionné dans le contexte, sans le nommer ici.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « un ange bienfaisant ». Le grec dit « un ange bon », ce qui peut décrire son caractère ou le bien qu’il doit accomplir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ μετέλαβον
  choice: Quand … apprirent
  rationale: Dans cette construction suivie d’un accusatif et d’un participe, μεταλαμβάνω exprime le fait d’apprendre ou d’être informé, et non de prendre possession.
- source_word: οἱ περὶ τὸν Μακκαβαῖον
  choice: Maccabée et ses hommes
  rationale: L’expression désigne naturellement Maccabée et le groupe qui l’entoure. Cette formulation française évite un calque lourd tout en conservant le caractère collectif.
- source_word: πολιορκοῦντα αὐτὸν τὰ ὀχυρώματα
  choice: qu’il assiégeait les forteresses
  rationale: L’accusatif αὐτόν est le sujet du participe πολιορκοῦντα, tandis que τὰ ὀχυρώματα en est l’objet. La formulation conserve le pronom du grec sans lui attribuer dans ce vers seul un référent nommé.
- source_word: μετὰ ὀδυρμῶν καὶ δακρύων
  choice: au milieu des lamentations et des larmes
  rationale: Cette expression restitue l’intensité du deuil et de la supplication dans un français actuel et digne.
- source_word: ἱκέτευον
  choice: supplièrent
  rationale: Le verbe indique une demande instante et fervente, plus forte qu’une simple requête.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Dans ce contexte scripturaire juif, κύριος est le titre révérenciel désignant Dieu.
- source_word: ἀγαθὸν ἄγγελον
  choice: un ange bon
  rationale: La traduction garde le sens direct de ἀγαθός sans préciser si la bonté décrit le caractère de l’ange ou l’action bienfaisante attendue de lui.
- source_word: ἀποστεῖλαι πρὸς σωτηρίαν τῷ Ἰσραήλ
  choice: d’envoyer … pour sauver Israël
  rationale: La tournure verbale rend naturellement en français la finalité exprimée par πρὸς σωτηρίαν, ici la délivrance d’Israël.
theological_decisions:
- issue: Sens de « un ange bon »
  choice: La formule est traduite sans identifier l’ange ni définir davantage sa nature ou sa mission.
  alternative: un ange bienfaisant
  rationale: Le grec qualifie seulement l’ange de ἀγαθός. Garder « bon » préserve la sobriété et l’ambiguïté théologique du texte.
- issue: Référent de αὐτόν
  choice: Le pronom est conservé sous la forme « il » et n’est pas remplacé par un nom.
  alternative: que Lysias assiégeait les forteresses
  rationale: Même si le contexte littéraire peut identifier le référent, le membre de phrase fourni ne le nomme pas. La traduction évite donc une explicitation non présente dans ce vers.
translation_notes:
  register: 'Français international moderne, clair et digne. La syntaxe a été réorganisée pour faire apparaître correctement le discours indirect grec : les hommes de Maccabée apprennent qu’un tiers assiège les forteresses. Les marqueurs de notes sont placés sur les expressions auxquelles les notes se rapportent.'
