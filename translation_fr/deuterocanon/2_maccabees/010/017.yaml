- from: Jean et Absalom, que vous avez envoyés, ont remis la communication écrite ci-dessous[a] et ont présenté leurs demandes au sujet des points qui y étaient indiqués.
  to: Jean et Absalom, que vous avez envoyés, après avoir remis la communication écrite[a], demandaient des éclaircissements au sujet des points qui y étaient indiqués.
  rationale: La révision supprime l'indication non assurée « ci-dessous », rétablit la relation temporelle du participe ἐπιδόντες par « après avoir remis » et rend l'imparfait ἠξίουν par « demandaient ». Elle maintient l'ambiguïté documentaire et officielle de χρηματισμός ainsi que la référence du pronom au document.
