  yaml_path: translation/deuterocanon/2_maccabees/010/017.yaml
  text: John and Absalom[a], who were sent from you, after delivering the written document, asked about the matters indicated by it.
translation:
  language: fr
  text: Jean et Absalom, que vous avez envoyés, après avoir remis la communication écrite[a], demandaient des éclaircissements au sujet des points qui y étaient indiqués.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la directive écrite » ou « le message écrit »; le terme grec peut désigner une communication ou une instruction officielle.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰωάνης
  choice: Jean
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom grec Ἰωάνης.
- source_word: Ἀβεσσαλώμ
  choice: Absalom
  rationale: Forme française usuelle du nom biblique, plutôt qu’une translittération grecque comme « Abessalom ».
- source_word: οἱ πεμφθέντες παρʼ ὑμῶν
  choice: que vous avez envoyés
  rationale: La proposition relative rend naturellement le participe aoriste passif; παρά avec le génitif désigne ici les personnes à l’origine de l’envoi.
- source_word: ἐπιδόντες
  choice: ont remis
  rationale: Le participe aoriste exprime une action antérieure ou étroitement liée à la demande; la coordination au passé composé produit un français fluide sans modifier la séquence logique.
- source_word: τὸν ὑπογεγραμμένον χρηματισμόν
  choice: la communication écrite ci-dessous
  rationale: ὑπογεγραμμένον désigne ici ce qui est écrit ou reproduit plus bas, tandis que χρηματισμός peut désigner une communication officielle. « Communication » évite de préciser sans certitude qu’il s’agit d’un décret.
- source_word: ἠξίουν
  choice: ont présenté leurs demandes
  rationale: Dans ce contexte diplomatique, ἀξιόω exprime le fait de solliciter ou de demander. Cette formulation conserve la portée requérante mieux que le simple « se sont renseignés ».
- source_word: περὶ τῶν διʼ αὐτοῦ σημαινομένων
  choice: au sujet des points qui y étaient indiqués
  rationale: Le pronom renvoie naturellement à la communication; « points » rend le pluriel substantivé sans surdéterminer la nature des questions traitées.
