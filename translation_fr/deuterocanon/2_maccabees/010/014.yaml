base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/014.yaml
  text: He persuaded him to come to terms on all the just demands[a], and that he would also persuade the king[b], compelling him to become their friend.
translation:
  language: fr
  text: Il le persuada de conclure un accord sur toutes les conditions justes[a], en lui assurant qu’il persuaderait aussi le roi[b], qu’il contraindrait à devenir leur ami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec traduit par « conclure un accord » est rare et difficile dans ce témoin; le sens paraît être celui d’un règlement ou d’une réconciliation fondés sur des conditions justes.
    reason: textual_variant
  - marker: b
    text: 'Ou : « parce qu’il persuaderait aussi le roi ». Le mot grec peut introduire soit le contenu de l’assurance, soit sa raison.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεισεν
  choice: Il le persuada
  rationale: L’aoriste de πείθω exprime directement l’action de persuader. Ce choix conserve aussi le lien verbal avec πείσει plus loin dans la phrase.
- source_word: συλλύεσθαι
  choice: de conclure un accord
  rationale: Le verbe est rare et difficile dans ce témoin. Dans ce contexte diplomatique, il paraît désigner l’aboutissement à un règlement ou à une réconciliation; « conclure un accord » reste naturel sans préciser excessivement sa portée juridique.
- source_word: ἐπὶ πᾶσι τοῖς δικαίοις
  choice: sur toutes les conditions justes
  rationale: Le neutre substantivé τοῖς δικαίοις désigne ici vraisemblablement les éléments équitables ou légitimes du règlement. « Conditions justes » convient au contexte de négociation tout en préservant la valeur morale et juridique de δίκαιος.
- source_word: διότι καὶ τὸν βασιλέα πείσει
  choice: en lui assurant qu’il persuaderait aussi le roi
  rationale: διότι peut exprimer la cause ou introduire le contenu de l’assurance donnée. La formulation française retient la seconde possibilité, qui s’intègre naturellement au mouvement de la phrase, tout en signalant l’alternative en note.
- source_word: φίλον αὐτοῖς
  choice: leur ami
  rationale: φίλον avec le datif αὐτοῖς indique une disposition favorable envers eux, probablement au sens politique. « Leur ami » conserve l’expression concrète du grec.
- source_word: ἀναγκάζων γενέσθαι
  choice: qu’il contraindrait à devenir
  rationale: Le participe présent de ἀναγκάζω exprime une forte contrainte. La relative française rattache clairement cette contrainte au roi tout en gardant la vigueur du terme grec.
