review_pass:
  verdict: revise
  source_fidelity: 'Le grec dit littéralement : « Et la lettre du roi contenait ainsi : “Le roi Antiochos à son frère Lysias, salut.” » Le sens et la formule épistolaire du projet sont globalement bien rendus. Toutefois, « était rédigée ainsi » interprète et reformule περιεῖχεν (« contenait ») au lieu de le traduire directement.'
  naturalness: 'La formulation est naturelle en français moderne. « La lettre du roi contenait ceci : » est à la fois plus proche du grec et tout aussi idiomatique dans cette introduction de citation. « Salut ! » convient comme équivalent bref de la salutation épistolaire χαίρειν.'
  terminology: « Antiochos », « Lysias », « frère » et « salut » sont appropriés. La note sur « frère » préserve correctement l’ambiguïté entre parenté effective et appellation royale ou de cour, sans la résoudre.
  issues:
  - severity: low
    issue: Rendu de περιεῖχεν οὕτως
    rationale: « était rédigée ainsi » est recevable comme paraphrase, mais περιεῖχεν signifie proprement « contenait ». « contenait ceci » maintient mieux la fidélité lexicale et la fonction d’introduction de la citation.
  - severity: medium
    issue: Discordance de référence à vérifier
    rationale: Le texte grec fourni est couramment numéroté 2 Maccabées 11.22, alors que l’identifiant et la référence indiquent 2 Maccabées 10.22. Cette discordance éditoriale ne modifie pas la traduction du grec fourni, mais exige une vérification humaine avant publication.
