  text: 'And the king’s letter contained this: “King Antiochus to his brother Lysias[b][a], greetings.”'
translation:
  language: fr
  text: 'La lettre du roi était rédigée ainsi[a] : « Le roi Antiochos à son frère Lysias[b], salut ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « La lettre du roi contenait ainsi. » On peut aussi traduire : « La lettre du roi était ainsi libellée. »'
    reason: lexical_alternative
  - marker: b
    text: Le mot « frère » peut désigner un frère au sens familial ou servir de titre relationnel à la cour royale ; le grec ne précise pas davantage.
    reason: cultural_note
lexical_decisions:
- source_word: Ἡ ... ἐπιστολή
  choice: La lettre ...
  rationale: ἐπιστολή désigne ici une lettre officielle. « Lettre » est le terme moderne, naturel et précis.
- source_word: περιεῖχεν οὕτως
  choice: était rédigée ainsi
  rationale: L’expression introduit la teneur de la lettre. Cette formulation française idiomatique conserve la fonction de περιεῖχεν οὕτως sans alourdir la phrase.
- source_word: Βασιλεὺς Ἀντίοχος
  choice: Le roi Antiochos
  rationale: Βασιλεύς sert de titre à l’expéditeur. En français, l’article défini convient naturellement devant le titre royal.
- source_word: τῷ ἀδελφῷ Λυσίᾳ
  choice: à son frère Lysias
  rationale: Le datif désigne le destinataire. Le possessif, naturel dans la formule française, explicite la relation sans trancher entre parenté réelle et titre de cour.
- source_word: χαίρειν
  choice: salut !
  rationale: Dans l’ouverture d’une lettre grecque, χαίρειν est une formule épistolaire consacrée. « Salut ! » en restitue ici la brièveté, plutôt qu’un littéral trompeur comme « réjouis-toi ».
