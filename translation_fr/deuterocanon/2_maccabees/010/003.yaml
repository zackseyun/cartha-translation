lexical_decisions:
- source_word: ἱερόν
  choice: le sanctuaire
  rationale: Dans 2 Maccabées, le terme désigne couramment l’ensemble sacré du temple de Jérusalem. « Sanctuaire » en conserve la portée cultuelle sans le réduire au seul bâtiment.
- source_word: ἀργυρολόγητον
  choice: imposable
  rationale: Cet adjectif rare évoque ce qui est assujetti à une perception d’argent ou à un tribut. « Imposable » exprime clairement et sobrement cette politique fiscale.
- source_word: τεμένη
  choice: lieux sacrés
  rationale: Le mot désigne des espaces ou enceintes consacrés. « Lieux sacrés » reste naturel en français et préserve la différence lexicale avec ἱερόν sans imposer une précision architecturale absente du grec.
- source_word: ἐθνῶν
  choice: des nations
  rationale: Rendu littéral qui désigne ici les peuples non juifs tout en laissant au contexte le soin d’établir le contraste.
- source_word: πρατήν
  choice: en vente
  rationale: L’adjectif indique que la charge devait être vendue ou proposée à l’achat. « Mettre … en vente » rend naturellement en français la commercialisation scandaleuse de la fonction.
- source_word: ἀρχιερωσύνην
  choice: la charge de grand prêtre
  rationale: Le terme désigne la dignité ou la fonction de grand prêtre. « Charge de grand prêtre » est plus courant et immédiatement intelligible que « grand-prêtrise ».
- source_word: ποιήσειν
  choice: rendre … et mettre … en vente
  rationale: L’infinitif signifie littéralement « faire, rendre ». Le français adapte sa formulation à chacun des deux compléments tout en conservant leur parallélisme.
theological_decisions:
- issue: Désignation du sanctuaire de Jérusalem et des lieux de culte des nations
  choice: Traduire ἱερόν par « sanctuaire » et τεμένη par « lieux sacrés »
  alternative: Employer « temple(s) » ou « sanctuaire(s) » dans les deux cas
  rationale: Le grec emploie deux termes distincts. La traduction maintient cette différence sans accentuer artificiellement l’opposition théologique ; elle fait néanmoins ressortir que le sanctuaire de Jérusalem devait être traité comme les autres lieux cultuels.
- issue: Vénalité de la charge de grand prêtre
  choice: « mettre chaque année la charge de grand prêtre en vente »
  alternative: « rendre la grand-prêtrise vénale chaque année »
  rationale: Le choix retenu exprime directement la vente de la charge, sans employer le terme moins accessible « vénale » ni préciser un mécanisme d’attribution que le grec ne décrit pas.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le fragment conserve son ouverture par « et de », qui reflète les infinitifs grecs dépendant du contexte précédent. Le point-virgule final signale que l’énoncé se poursuit.
