translation:
  language: fr
  text: et de rendre le sanctuaire imposable[a], comme les autres lieux sacrés des nations, et de mettre chaque année la charge de grand prêtre en vente[b][c] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « assujetti à un tribut ». L’adjectif grec ἀργυρολόγητον évoque une perception d’argent ou une imposition.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « rendre la charge de grand prêtre vendable chaque année ».'
    reason: lexical_alternative
