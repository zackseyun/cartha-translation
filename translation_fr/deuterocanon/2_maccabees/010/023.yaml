  text: since our father has departed to the gods[a], and since we desire that those in the kingdom, being free from disturbance, should give attention to the affairs of the Jews,
translation:
  language: fr
  text: Notre père ayant rejoint les dieux[a], nous voulons que les gens du royaume soient sans être troublés, afin de s’occuper des affaires des Juifs,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ayant passé vers les dieux »; il s’agit d’une formule royale hellénistique désignant la mort, selon le point de vue de la cour.'
    reason: Note culturelle nécessaire pour expliquer l’euphémisme polythéiste sans l’effacer du texte.
lexical_decisions:
- source_word: ἐπὶ τοῦ πατρὸς ἡμῶν
  choice: Notre père ayant
  rationale: La construction participiale française restitue avec naturel la proposition circonstancielle grecque, dont la valeur est à la fois temporelle et contextuellement causale, sans la réduire à une seule nuance.
- source_word: εἰς θεοὺς μεταστάντος
  choice: ayant rejoint les dieux
  rationale: Cette formulation conserve l’expression explicite de la cour hellénistique et son orientation vers « les dieux », au lieu de l’aplanir en simple mention de la mort.
- source_word: βουλόμενοι
  choice: nous voulons
  rationale: Le présent exprime directement l’intention royale et convient au registre officiel de la lettre.
- source_word: τοὺς ἐκ τῆς βασιλείας
  choice: ceux qui vivent dans le royaume
  rationale: La formule désigne largement les personnes du royaume. Cette traduction reste compréhensible sans les restreindre explicitement aux fonctionnaires ou aux seuls sujets politiques.
- source_word: ἀπερισπάστως
  choice: sans être inquiétés
  rationale: L’adverbe évoque l’absence de distraction ou d’empêchement. Dans ce contexte politique et administratif, « sans être inquiétés » exprime une situation libre de troubles sans suggérer un simple état de concentration intérieure.
- source_word: γενέσθαι πρὸς τὴν τῶν Ἰουδαίων ἐπιμέλειαν
  choice: puissent … s’occuper des affaires des Juifs
  rationale: La construction grecque est resserrée. « S’occuper des affaires » rend le mouvement vers l’ἐπιμέλεια, qui peut désigner l’attention, le soin ou la gestion, sans imposer une nuance exclusivement bienveillante.
theological_decisions:
- issue: L’expression royale hellénistique εἰς θεοὺς μεταστάντος à propos de la mort
  choice: ayant rejoint les dieux
  alternative: étant mort
  rationale: Le texte rapporte le langage polythéiste de la cour séleucide; le conserver ne signifie pas que le narrateur ou la traduction l’approuve. Une formulation neutre comme « étant mort » effacerait une caractéristique réelle du texte source.
- issue: La portée de ἐπιμέλεια à l’égard des Juifs
  choice: s’occuper des affaires des Juifs
  alternative: prendre soin des Juifs
  rationale: Le terme peut exprimer le soin aussi bien que l’attention ou la gestion administrative. La traduction retenue préserve cette amplitude et évite d’attribuer avec certitude une intention bienveillante.
translation_notes:
  register: Français international actuel, digne et accessible, avec une légère tenue officielle adaptée à une lettre royale. La virgule finale est conservée parce que le verset forme une proposition qui se poursuit dans le contexte.
