base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/009.yaml
  text: And all together they blessed the merciful God and were strengthened in their souls[b][a], being ready to wound not only men but even the fiercest wild beasts and iron walls.
translation:
  language: fr
  text: Tous ensemble, ils bénirent le Dieu miséricordieux et furent fortifiés dans leur âme[a], prêts à blesser non seulement des hommes, mais même les bêtes les plus féroces et des murailles de fer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « furent fortifiés intérieurement » ; plus librement : « prirent courage ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression « blesser […] des murailles de fer » est vraisemblablement une hyperbole qui souligne leur audace extrême au combat.
    reason: cultural_note
lexical_decisions:
- source_word: ὁμοῦ δὲ πάντες
  choice: Tous ensemble
  rationale: Rend à la fois l’action collective exprimée par ὁμοῦ et la totalité marquée par πάντες, sans alourdir la phrase.
- source_word: εὐλόγησαν
  choice: bénirent
  rationale: Conserve le sens direct et le registre biblique de εὐλογέω lorsque Dieu en est l’objet.
- source_word: τὸν ἐλεήμονα θεόν
  choice: le Dieu miséricordieux
  rationale: Rendu attributif fidèle de ἐλεήμων, dans un français biblique actuel et accessible.
- source_word: ἐπερρώσθησαν ταῖς ψυχαῖς
  choice: furent fortifiés dans leur âme
  rationale: Préserve le passif ainsi que l’image de ψυχή, tout en désignant ici la force intérieure et le courage de chacun.
- source_word: τιτρώσκειν
  choice: blesser
  rationale: Reproduit le sens d’infliger une blessure et maintient l’image volontairement saisissante appliquée ensuite aux murailles.
- source_word: οὐ μόνον ἀνθρώπους θῆρας δὲ τοὺς ἀγριωτάτους καὶ σιδηρᾶ τείχη
  choice: non seulement des hommes, mais même les bêtes les plus féroces et des murailles de fer
  rationale: Conserve l’accumulation ascendante et hyperbolique du grec, de l’adversaire humain jusqu’aux bêtes féroces et aux fortifications.
- source_word: ὄντες ἕτοιμοι
  choice: prêts
  rationale: Exprime naturellement en français l’état de préparation qui résulte de leur affermissement intérieur.
theological_decisions:
- issue: Portée anthropologique de ψυχαῖς
  choice: furent fortifiés dans leur âme
  alternative: prirent courage ; furent fortifiés intérieurement
  rationale: Le contexte vise la résolution intérieure plutôt qu’une définition technique de l’âme. Le choix retenu garde néanmoins visible le vocabulaire grec sans lui imposer une doctrine anthropologique particulière.
translation_notes:
  register: Français international moderne, digne et lisible. Le tour inhabituel « blesser […] des murailles » est délibérément conservé afin de transmettre l’hyperbole et l’image du grec, avec une note explicative.
