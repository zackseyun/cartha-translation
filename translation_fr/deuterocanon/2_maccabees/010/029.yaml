translation:
  language: fr
  text: Ménélas nous a fait savoir qu’il souhaitait qu’après être descendus, vous rejoigniez les vôtres.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous vous retrouviez parmi les vôtres » ou « vous vous ralliiez à votre propre camp ». L’expression grecque est condensée.
    reason: lexical_alternative
  - marker: b
    text: La syntaxe du texte grec transmis est difficile. Cette traduction en donne le sens le plus direct tout en maintenant son degré d’incertitude.
    reason: textual_variant
lexical_decisions:
- source_word: ἐνεφάνισεν
  choice: nous a fait savoir
  rationale: Le verbe signifie « faire connaître » ou « signaler ». Cette tournure française rend naturellement la communication adressée à « nous ».
- source_word: βουλόμενος
  choice: il souhaitait
  rationale: Le participe exprime ici le souhait ou l’intention de Ménélas. La proposition conjuguée est plus naturelle en français tout en conservant ce rapport avec le verbe principal.
- source_word: κατελθόντας
  choice: après être descendus
  rationale: Le participe aoriste présente vraisemblablement cette action comme antérieure à γίνεσθαι. La traduction conserve le mouvement de descente sans préciser un lieu absent du grec.
- source_word: γίνεσθαι πρὸς τοὺς ἰδίους
  choice: vous rejoigniez les vôtres
  rationale: Littéralement, l’expression évoque le fait d’« être/devenir auprès des siens ». « Rejoindre les vôtres » en rend le sens relationnel ou collectif sans ajouter l’idée plus interprétative d’une restauration.
- source_word: τοὺς ἰδίους
  choice: les vôtres
  rationale: L’expression grecque est elliptique et désigne les personnes appartenant au groupe du destinataire. « Les vôtres » préserve cette ellipse et laisse ouverte la question de savoir s’il s’agit de ses proches, de son peuple ou de son camp.
