- source_word: ἐκ τῆς Ἰουδαϊκῆς τάξεως
  choice: qui appartenait aux rangs juifs
  rationale: Exprime naturellement l’appartenance de Rhodocos au groupe ou au corps juif.
- source_word: ἀνεζητήθη
  choice: on le rechercha
  rationale: Le passif grec indique qu’une recherche fut menée pour le retrouver.
- source_word: κατελήμφθη
  choice: on le captura
  rationale: Dans cette suite narrative, le verbe signifie qu’il fut appréhendé après avoir été recherché.
- source_word: κατεκλείσθη
  choice: on l’emprisonna
  rationale: Rend l’idée d’être enfermé sous garde, avec une formulation française directe.
