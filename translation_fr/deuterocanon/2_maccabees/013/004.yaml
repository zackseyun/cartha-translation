base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/004.yaml
  text: But the King of kings stirred up Antiochus’s anger against the wretch, and when Lysias pointed him out as being responsible for the evils and for everything, he ordered them to put him to death, taking him to Beroea, as is the custom in that place.
translation:
  language: fr
  text: Mais le Roi des rois éveilla la colère d’Antiochos contre ce misérable[a]. Lysias ayant désigné cet homme comme responsable de tous les malheurs et de tout le reste, le roi ordonna qu’on le conduise à Béroia[b] et qu’on l’y mette à mort, selon la coutume du lieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce criminel » ou « cet homme abject ». Le mot grec est une forte expression de condamnation morale.
    reason: lexical_alternative
  - marker: b
    text: Le texte indique que l’homme devait être conduit à Béroia pour y être mis à mort conformément à la coutume locale.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ δὲ βασιλεὺς τῶν βασιλέων
  choice: Mais le Roi des rois
  rationale: L’expression est un titre divin dans ce contexte. La majuscule signale cette référence à Dieu sans ajouter d’explication au texte.
- source_word: ἐξήγειρεν τὸν θυμὸν
  choice: éveilla la colère
  rationale: Cette formulation française conserve la valeur causative du verbe et le sens hostile de θυμός, tout en restant naturelle.
- source_word: ἐπὶ τὸν ἀλιτήριον
  choice: contre ce misérable
  rationale: ἀλιτήριος est un terme fortement péjoratif désignant un homme coupable ou abject. « Ce misérable » en préserve la condamnation morale sans préciser indûment la nature juridique de sa faute.
- source_word: Λυσίου ὑποδείξαντος τοῦτον
  choice: Lysias ayant désigné cet homme
  rationale: Le génitif absolu est rendu par une construction participiale naturelle; « désigné » exprime l’identification de l’homme tenu pour responsable.
- source_word: αἴτιον τῶν κακῶν εἶναι καὶ πάντων
  choice: comme responsable de tous ces malheurs
  rationale: La formulation grecque est resserrée et son ordre est inhabituel. πάντων est compris avec τῶν κακῶν, soit « tous les malheurs », lecture syntaxiquement cohérente qui évite l’expression peu naturelle et probablement trompeuse « des malheurs et de tout ».
- source_word: προσέταξεν
  choice: le roi ordonna qu’on
  rationale: Le sujet est explicité pour éviter toute confusion avec Lysias. Le personnel chargé d’exécuter l’ordre n’étant pas nommé en grec, le pronom indéfini « on » convient.
- source_word: προσαπολέσαι
  choice: qu’on l’y mette à mort
  rationale: Dans ce contexte, le verbe composé désigne clairement une mise à mort ordonnée. Le pronom « y » relie naturellement l’exécution à Béroia.
- source_word: ἀγαγόντας εἰς Βέροιαν
  choice: qu’on le conduise à Béroia
  rationale: Le participe décrit l’action préalable ou concomitante à l’exécution de l’ordre. La coordination française rend clairement la séquence.
- source_word: ὡς ἔθος ἐστὶν ἐν τῷ τόπῳ
  choice: selon la coutume du lieu
  rationale: Cette expression concise et idiomatique reste proche du grec et rattache la procédure à une pratique locale.
theological_decisions:
- issue: Référence du titre « le Roi des rois »
  choice: Titre divin désignant Dieu
  alternative: Titre royal hyperbolique appliqué à un souverain humain
  rationale: Dans le contexte narratif, le Roi des rois agit sur la colère d’Antiochos et se situe donc au-dessus de lui. Le titre désigne Dieu comme souverain des rois terrestres, sans qu’il soit nécessaire d’expliciter davantage cette providence.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase grecque longue est divisée en deux pour améliorer la lisibilité. « Antiochos » et « Béroia » suivent des translittérations françaises transparentes des noms grecs.
