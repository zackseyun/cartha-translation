  text: And at Bethsura he attacked a small garrison of the Jews[a], but was turned back, was repulsed[c][b], and was weakened.
translation:
  language: fr
  text: À Bethsoura[a], il marcha contre une petite place forte tenue par les Juifs[b], mais il fut repoussé, se heurta à une résistance et perdit des forces[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Beth-Tsour ». Le grec transcrit le nom du lieu sous la forme Βαθσούρα.
    reason: lexical_alternative
  - marker: b
    text: Le grec φρούριον peut aussi désigner une forteresse, un poste fortifié ou la garnison qui l'occupe.
    reason: lexical_alternative
  - marker: c
    text: 'La succession des verbes est brève et cumulative : il marcha contre la place, fut repoussé, rencontra un obstacle, puis vit ses forces diminuer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βαθσούροις
  choice: Bethsoura
  rationale: Cette forme française translittère directement le toponyme grec tout en restant naturelle; « Beth-Tsour » refléterait plus directement la forme sémitique.
- source_word: φρούριον ὀλίγον τῶν Ἰουδαίων
  choice: une petite place forte tenue par les Juifs
  rationale: φρούριον désigne d'abord un poste ou ouvrage fortifié; ὀλίγον en indique la faible importance, et le génitif τῶν Ἰουδαίων est naturellement explicité par « tenue par les Juifs ».
- source_word: προσῆγεν
  choice: il marcha contre
  rationale: Le verbe exprime ici un mouvement militaire dirigé contre la position; cette formulation conserve plus précisément cette nuance que le simple verbe « attaquer ».
- source_word: ἐτροποῦτο
  choice: il fut repoussé
  rationale: Le moyen-passif indique que son mouvement fut inversé ou mis en fuite, sans imposer l'idée plus forte d'une déroute complète.
- source_word: προσενέκρουσεν
  choice: se heurta à une résistance
  rationale: Le verbe évoque littéralement le fait de venir buter contre un obstacle; en contexte militaire, il indique que l'avance rencontra une opposition qui l'arrêta.
- source_word: ἡλαττονοῦτο
  choice: perdit des forces
  rationale: Le verbe signifie devenir moindre ou être diminué; l'expression française rend naturellement l'affaiblissement progressif dans ce contexte militaire.
