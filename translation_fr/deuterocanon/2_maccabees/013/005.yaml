  text: In that place there was a tower fifty cubits high[a], full of ashes, and it had all around it a circular contrivance sloping steeply down into the ashes.
translation:
  language: fr
  text: En ce lieu se trouvait une tour haute de cinquante coudées, pleine de cendres. Elle était munie d’un dispositif circulaire[a] qui, de tous côtés, descendait abruptement dans les cendres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un appareil arrondi » ou « un mécanisme circulaire ». Le terme grec désignant cet aménagement reste général, et l’adjectif peut souligner sa forme ronde plutôt qu’un mouvement de rotation.
    reason: lexical_alternative
lexical_decisions:
- source_word: πύργος
  choice: tour
  rationale: « Tour » est le sens courant du nom grec et convient à la structure décrite.
- source_word: πεντήκοντα πήχεων
  choice: haute de cinquante coudées
  rationale: Le grec indique une mesure de cinquante coudées; « haute de » explicite naturellement qu’il s’agit ici de la hauteur de la tour.
- source_word: πλήρης σποδοῦ
  choice: pleine de cendres
  rationale: La construction signifie directement « pleine de cendre(s) »; le pluriel collectif est idiomatique en français.
- source_word: ὄργανον
  choice: dispositif
  rationale: Le mot grec désigne largement un instrument ou un appareil sans en préciser la nature; « dispositif » préserve cette indétermination.
- source_word: περιφερές
  choice: circulaire
  rationale: L’adjectif décrit très probablement une forme ronde ou circulaire; une idée de rotation reste possible mais ne doit pas être imposée.
- source_word: πάντοθεν
  choice: de tous côtés
  rationale: 'Cette expression rend la valeur spatiale de l’adverbe: sur tout le pourtour ou de chaque côté.'
- source_word: ἀπόκρημνον
  choice: descendait à pic
  rationale: L’adjectif évoque une pente abrupte ou un bord escarpé; la formulation verbale donne en français une description naturelle de la descente vers les cendres.
- source_word: εἰς τὴν σποδόν
  choice: dans les cendres
  rationale: La préposition εἰς marque ici l’orientation et l’aboutissement vers l’intérieur de la masse de cendres.
