  text: But Judas kept sending in what was needed to those inside[a].
translation:
  language: fr
  text: Mais Judas envoyait à ceux qui étaient à l’intérieur ce dont ils avaient besoin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Judas envoyait à ceux qui étaient à l’intérieur ce qui était nécessaire ». L’imparfait grec peut indiquer une action continue ou répétée.
    reason: Variante lexicale et précision aspectuelle.
lexical_decisions:
- source_word: τοῖς δὲ ἔνδον
  choice: à ceux qui étaient à l’intérieur
  rationale: L’adverbe ἔνδον est employé substantivement pour désigner les personnes se trouvant dans la place assiégée. Cette formulation conserve le sens spatial sans ajouter « hommes », absent du grec.
- source_word: Ἰούδας
  choice: Judas
  rationale: La forme française traditionnelle du nom personnel Ἰούδας dans 2 Maccabées est « Judas ».
- source_word: τὰ δέοντα
  choice: ce dont ils avaient besoin
  rationale: L’expression participiale neutre plurielle désigne les choses nécessaires. La traduction reste naturelle et évite de préciser qu’il s’agissait de vivres ou de provisions, ce que le grec ne dit pas explicitement.
- source_word: εἰσεπέμπεν
  choice: faisait parvenir
  rationale: L’imparfait grec présente l’envoi comme une action en cours ou répétée dans le passé. « Faisait parvenir » rend cet aspect et le mouvement vers l’intérieur sans lourdeur.
