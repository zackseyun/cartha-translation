base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/015.yaml
  text: And after giving those around him the battle cry[a], “God’s Victory,” he attacked the royal court by night with the finest armed young men, struck down about two thousand men in the camp[b], and cut down the leading elephant together with its rider.
translation:
  language: fr
  text: Après avoir donné à ceux qui l’entouraient le mot d’ordre[a] « Victoire de Dieu », il lança de nuit, avec les meilleurs jeunes hommes bien équipés, une attaque contre l’enceinte royale. Il abattit environ deux mille hommes dans le camp et abattit l’éléphant de tête avec l’homme qui se trouvait dans sa tourelle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « signal » ou « cri de ralliement ». Le terme grec désigne un mot de passe ou un signal militaire; ici, son contenu est « Victoire de Dieu ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « celui qui se trouvait dans la maison/structure ». Il s’agit probablement de l’occupant d’une tourelle ou d’un siège monté sur l’éléphant.
    reason: cultural_note
lexical_decisions:
- source_word: ἀναδοὺς δὲ τοῖς περὶ αὐτὸν
  choice: Après avoir donné à ceux qui l’entouraient
  rationale: Le participe aoriste marque une action antérieure à l’assaut; la tournure française conserve cette succession. « Ceux qui l’entouraient » rend l’idiome sans préciser davantage leur statut.
- source_word: σύνθημα
  choice: mot d’ordre
  rationale: Dans un contexte militaire, le terme désigne un signal, un mot de passe ou une formule de ralliement. « Mot d’ordre » convient à la formule citée tout en évitant de supposer nécessairement un cri collectif.
- source_word: Θεοῦ Νίκην
  choice: Victoire de Dieu
  rationale: Cette formule nominale concise conserve le génitif grec et sa force de mot d’ordre, sans le transformer en proposition explicative.
- source_word: μετὰ νεανίσκων ἀρίστων κεκοσμημένων
  choice: avec les meilleurs jeunes hommes bien équipés
  rationale: κεκοσμημένων évoque ici des hommes équipés et disposés pour le combat; « bien équipés » restitue ce sens militaire sans réduire explicitement l’équipement aux seules armes.
- source_word: ἐπιβαλὼν νύκτωρ
  choice: il lança de nuit […] une attaque
  rationale: Le participe décrit une attaque soudaine dirigée contre un lieu; la formulation française rend directement l’action et conserve l’indication nocturne.
- source_word: τὴν βασιλικὴν αὐλήν
  choice: l’enceinte royale
  rationale: αὐλή peut désigner une cour ou un espace clos. Dans ce cadre militaire, « enceinte royale » exprime mieux un lieu que « cour royale », qui évoquerait surtout l’entourage du roi.
- source_word: τὴν παρεμβολὴν
  choice: dans le camp
  rationale: παρεμβολή est le terme courant pour un camp militaire. La préposition ajoutée en français rend naturellement le rapport entre le camp et les hommes qui y sont abattus.
- source_word: ἀνεῖλεν εἰς ἄνδρας δυσχιλίους
  choice: Il abattit environ deux mille hommes
  rationale: ἀναιρέω signifie ici mettre à mort. La construction avec εἰς devant le nombre a une valeur approximative, rendue par « environ ».
- source_word: τὸν πρωτεύοντα τῶν ἐλεφάντων
  choice: l’éléphant de tête
  rationale: La formule désigne l’éléphant qui occupe le premier rang ou la position principale; « de tête » laisse ouvertes ces deux nuances.
- source_word: σὺν τῷ κατʼ οἰκίαν ὄντι συνέθηκεν
  choice: fit tomber […] avec l’homme qui se trouvait dans sa tourelle
  rationale: L’homme est décrit comme se trouvant dans une structure assimilée à une petite maison sur l’éléphant. « Fit tomber » convient à la mise hors de combat conjointe de l’animal et de son occupant sans ajouter de détail narratif absent du grec.
theological_decisions:
- issue: Sens théologique du mot d’ordre Θεοῦ Νίκην
  choice: « Victoire de Dieu »
  alternative: « Dieu est victorieux » ou « La victoire appartient à Dieu »
  rationale: Le grec présente une formule nominale au génitif. La traduction choisie préserve sa concision et son ambiguïté grammaticale au lieu d’expliciter si Dieu remporte, donne ou possède la victoire.
translation_notes:
  register: Français international actuel, narratif et digne. Le verset conserve la cadence militaire du grec, tout en divisant la longue période en deux phrases pour assurer la clarté. Les termes techniques sont rendus de façon accessible, avec les précisions historiques placées en notes.
