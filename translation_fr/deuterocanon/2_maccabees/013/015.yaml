  naturalness: Le français est globalement naturel, clair et adapté à un récit narratif moderne. « Abattit » est plus net et plus idiomatique que « fit tomber » ici. La note sur l’occupant doit éviter de présenter comme certaine une identification qui demeure contextuelle.
  terminology: « Mot d’ordre », « Victoire de Dieu », « enceinte royale », « camp » et « éléphant de tête » conviennent. « Tourelle » est une interprétation historique plausible de l’expression grecque, mais la note doit conserver le caractère littéral et non tranché de la référence à une « maison/structure ».
