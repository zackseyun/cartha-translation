base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/014.yaml
  text: And after entrusting the outcome to the Lord of the world[a], and urging those with him to fight bravely to the death for the laws, the temple, the city, the homeland, and the commonwealth[b], he encamped near Modein.
translation:
  language: fr
  text: Après avoir confié l’issue au Seigneur du monde[a], il exhorta ceux qui étaient avec lui à combattre courageusement jusqu’à la mort pour les lois, le Temple, la ville, la patrie et l’ordre civique[b] ; il posta son armée près de Modéïn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au Seigneur de l’univers ». Le grec κόσμος peut désigner le monde ou l’univers ordonné.
    reason: lexical_alternative
  - marker: b
    text: Le terme grec traduit par « ordre civique » peut aussi désigner la constitution, la communauté politique ou le mode de vie qui lui est propre.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς δὲ τὴν ἐπιτροπὴν
  choice: Après avoir confié l’issue
  rationale: L’expression signifie littéralement remettre la charge ou la responsabilité. Dans ce contexte militaire, « confier l’issue » exprime naturellement le fait de remettre l’affaire et son résultat entre les mains de Dieu, sans évoquer une fonction administrative.
- source_word: τῷ κυρίῳ τοῦ κόσμου
  choice: au Seigneur du monde
  rationale: « Seigneur » conserve le titre biblique de souveraineté ; κόσμος désigne ici le monde, avec la nuance possible d’univers ordonné signalée en note.
- source_word: παρακαλέσας
  choice: il exhorta
  rationale: Le verbe exprime ici un appel pressant adressé aux combattants. « Exhorta » est précis, digne et courant dans un registre biblique moderne.
- source_word: τοὺς σὺν αὐτῷ
  choice: ceux qui étaient avec lui
  rationale: Traduction directe qui évite de préciser indûment s’il s’agit de compagnons, de soldats ou de l’ensemble de ses forces.
- source_word: γενναίως ἀγωνίσασθαι μέχρι θανάτου
  choice: à combattre courageusement jusqu’à la mort
  rationale: Le contexte est militaire ; ἀγωνίζομαι signifie donc « combattre ». « Jusqu’à la mort » conserve la formulation grecque et l’idée d’une détermination pouvant aller au sacrifice suprême.
- source_word: περὶ νόμων, ἱεροῦ, πόλεως, πατρίδος, πολιτείας
  choice: pour les lois, le Temple, la ville, la patrie et l’ordre civique
  rationale: περί indique ce qu’ils doivent défendre. Le pluriel « les lois » est conservé ; ἱερόν renvoie au Temple de Jérusalem. « Ordre civique » garde l’étendue politique et sociale de πολιτεία sans lui imposer le sens moderne étroit de « constitution ».
- source_word: περὶ δὲ Μωδεεὶμ
  choice: près de Modéïn
  rationale: Avec un lieu, περί situe l’action dans les environs. « Près de » ne prétend pas fixer un emplacement exact.
- source_word: ἐποιήσατο τὴν στρατιάν
  choice: il rangea son armée
  rationale: La locution décrit vraisemblablement la mise en ordre ou le déploiement des troupes. « Rangea son armée » suit plus étroitement cette valeur militaire que « campa », tout en restant naturel en français.
theological_decisions:
- issue: Titre divin κύριος dans l’expression κύριος τοῦ κόσμου
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » maintient la portée théologique et l’usage biblique habituel, tout en exprimant la souveraineté de Dieu sur le monde.
- issue: Portée de πολιτεία parmi les réalités à défendre
  choice: ordre civique
  alternative: constitution ; communauté politique ; mode de vie
  rationale: Le mot peut désigner la constitution, l’organisation de la cité, la citoyenneté ou la manière de vivre liée à celle-ci. « Ordre civique » préserve cette amplitude politico-sociale sans réduire le terme à un texte constitutionnel moderne ni à une simple conduite privée.
- issue: Objet confié au Seigneur dans τὴν ἐπιτροπήν
  choice: l’issue
  alternative: la charge ; la responsabilité ; l’affaire
  rationale: Le grec laisse ouverte la désignation exacte de ce qui est remis à Dieu. Dans le contexte, « l’issue » rend intelligiblement la confiance placée en Dieu sans attribuer au terme une notion administrative de supervision.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’enchaînement narratif des participes grecs sans lourdeur. La majuscule à « Temple » identifie le sanctuaire de Jérusalem. « Modéïn » suit une forme française usuelle du toponyme.
