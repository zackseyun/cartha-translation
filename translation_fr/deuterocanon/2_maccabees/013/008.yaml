base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/008.yaml
  text: Very justly[a]; for because he had committed many sins against the altar, whose fire and ashes were holy[b], he met his death in ashes.
translation:
  language: fr
  text: 'Ce fut parfaitement juste[a] : puisqu’il avait commis de nombreux péchés contre l’autel, dont le feu et la cendre étaient sacrés[b], il trouva la mort dans la cendre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ce fut tout à fait mérité ». Le grec souligne que son sort était juste.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec peut aussi être rendu par « purs ». La fin dit littéralement : « dans la cendre, il reçut la mort », faisant écho à ses péchés contre l’autel et sa cendre sacrée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάνυ δικαίως
  choice: Ce fut parfaitement juste
  rationale: La tournure française exprime naturellement l’insistance de πάνυ et présente le sort évoqué comme pleinement mérité, tout en gardant la valeur judiciaire et morale de δικαίως.
- source_word: συνετέλεσεν πολλὰ ... ἁμαρτήματα
  choice: il avait commis de nombreux péchés
  rationale: Dans cette construction, συνετέλεσεν désigne l’accomplissement d’actes coupables; « commis » est idiomatique, et « péchés » conserve la portée religieuse de ἁμαρτήματα.
- source_word: περὶ τὸν βωμόν
  choice: contre l’autel
  rationale: Dans le contexte d’une profanation cultuelle, « contre » rend mieux la faute dirigée envers l’autel qu’un vague « au sujet de ».
- source_word: ἁγνὸν
  choice: sacrés
  rationale: Bien que ἁγνός puisse signifier « pur », le contexte du sanctuaire met surtout en avant le caractère consacré du feu et de la cendre; « sacrés » convient naturellement aux deux noms coordonnés.
- source_word: ἐν σποδῷ
  choice: dans la cendre
  rationale: Le singulier collectif français suit le grec et préserve le contraste intentionnel entre la cendre sacrée de l’autel et la mort reçue dans la cendre.
- source_word: τὸν θάνατον ἐκομίσατο
  choice: il trouva la mort
  rationale: Cette expression française rend idiomatiquement l’idée de recevoir ou rencontrer la mort, sans effacer la portée rétributive du contexte.
theological_decisions:
- issue: Caractère cultuel du feu et de la cendre de l’autel
  choice: dont le feu et la cendre étaient sacrés
  alternative: dont le feu et la cendre étaient purs
  rationale: « Sacrés » communique leur statut consacré dans le culte, plutôt qu’une simple pureté matérielle. Le pluriel français applique naturellement le qualificatif aux deux éléments coordonnés.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve la répétition de « cendre », essentielle à l’ironie rétributive du verset, ainsi que le lien explicite entre la profanation de l’autel et le mode de sa mort.
