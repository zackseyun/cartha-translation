base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/012.yaml
  text: And when all had done the same together and had implored the merciful Lord with weeping and fasting and prostration for three days without ceasing[a], Judas encouraged them and ordered them to assemble.
translation:
  language: fr
  text: Après que tous eurent fait de même et eurent ensemble supplié le Seigneur miséricordieux avec des pleurs, des jeûnes et des prosternations, sans relâche pendant trois jours, Judas les encouragea et leur ordonna de se présenter[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de se rassembler » ou « de venir ». Dans ce contexte militaire, l’ordre peut aussi avoir le sens pratique de « se tenir prêts ».'
    reason: Le verbe grec παραγίνομαι peut désigner le fait de venir, d’arriver ou d’être présent ; le contexte autorise plusieurs formulations françaises sans imposer avec certitude une nuance militaire précise.
lexical_decisions:
- source_word: πάντων ... τὸ αὐτὸ ποιησάντων ὁμοῦ
  choice: Après que tous eurent fait de même ... ensemble
  rationale: Le génitif absolu exprime une circonstance antérieure à l’action de Judas. « Tous » et « ensemble » conservent la dimension collective, tandis que « faire de même » renvoie à l’appel précédent.
- source_word: καταξιωσάντων τὸν ἐλεήμονα κύριον
  choice: eurent ... supplié le Seigneur miséricordieux
  rationale: Dans ce contexte de prière accompagnée de larmes, de jeûne et de prostration, καταξιόω a la valeur contextuelle d’un appel pressant. « Supplié » est naturel en français et correspond à cette scène sans durcir le sens.
- source_word: τὸν ἐλεήμονα κύριον
  choice: le Seigneur miséricordieux
  rationale: « Miséricordieux » rend directement ἐλεήμων dans un registre biblique encore courant, et « Seigneur » est l’équivalent révérenciel naturel de κύριος lorsqu’il désigne Dieu.
- source_word: μετὰ κλαυθμοῦ καὶ νηστειῶν καὶ προπτώσεως
  choice: dans les larmes, le jeûne et la prostration
  rationale: La tournure française exprime naturellement les actes accompagnant la supplication. Le singulier collectif « le jeûne » évite l’artificialité de « des jeûnes » tout en pouvant couvrir la durée ou la répétition indiquée par le pluriel grec; « prostration » conserve le geste physique de προπτώσεως.
- source_word: ἐπὶ ἡμέρας τρεῖς ἀδιαλείπτως
  choice: sans relâche pendant trois jours
  rationale: ἐπὶ avec l’accusatif indique la durée, et ἀδιαλείπτως souligne la persévérance continue. L’ordre français retenu est fluide et garde les deux éléments.
- source_word: παρακαλέσας αὐτοὺς
  choice: Judas les encouragea
  rationale: παρακαλέω peut signifier encourager, exhorter ou presser. Ici, « encouragea » convient au passage de la supplication collective à l’action demandée.
- source_word: ἐκέλευσεν παραγίνεσθαι
  choice: leur ordonna de se présenter
  rationale: παραγίνομαι signifie fondamentalement venir, arriver ou être présent. « Se présenter » convient à un ordre dans un contexte militaire sans transformer explicitement celui-ci en simple préparation; les autres possibilités sont signalées en note.
theological_decisions:
- issue: Traduction de κύριον lorsqu’il désigne Dieu
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » est le titre révérenciel français usuel et préserve l’identification divine du contexte sans ajouter de précision doctrinale.
translation_notes:
  register: Français international moderne, digne et lisible. La longue période grecque est conservée en une seule phrase, mais articulée par « Après que » et une ponctuation claire. Les termes « miséricordieux » et « prostration » maintiennent le registre religieux sans archaïsme excessif.
