  text: In the one hundred forty-ninth year[a], it happened to those around Judas that Antiochus Eupator had arrived with forces against Judea,
translation:
  language: fr
  text: La cent quarante-neuvième année[a], ceux qui entouraient Judas apprirent qu’Antiochos Eupator était arrivé avec des troupes contre la Judée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « La cent quarante-neuvième année, il arriva à ceux qui entouraient Judas qu’Antiochos Eupator était arrivé avec des troupes contre la Judée. » Le verbe grec peut présenter soit l’événement qui survient au groupe de Judas, soit l’information qui lui parvient.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτῳ δὲ ἐνάτῳ καὶ τεσσερακοστῷ καὶ ἑκατοστῷ ἔτει
  choice: La cent quarante-neuvième année
  rationale: Le datif exprime la date. Cette formulation française conserve le mode de datation du texte grec sans en répéter littéralement le mot « année ».
- source_word: προσέπεσεν
  choice: apprirent
  rationale: Avec le datif désignant le groupe de Judas et le contenu qui suit, le verbe peut évoquer un fait ou une information qui leur parvient. « Apprirent » est naturel en français, tandis que la note préserve la nuance plus événementielle.
- source_word: τοῖς περὶ τὸν Ἰούδαν
  choice: ceux qui entouraient Judas
  rationale: Cette traduction reste proche de l’expression grecque et désigne les compagnons ou partisans de Judas sans ajouter explicitement « hommes ».
- source_word: Ἀντίοχον τὸν Εὐπάτορα
  choice: Antiochos Eupator
  rationale: Le nom et l’épithète royale sont rendus selon leur forme française usuelle.
- source_word: παραγεγόνα
  choice: était arrivé
  rationale: Le parfait exprime une arrivée déjà accomplie dont la situation présente demeure pertinente.
- source_word: σὺν πλήθεσιν
  choice: avec des troupes
  rationale: Dans ce contexte militaire, le pluriel πλήθη désigne des masses de soldats. « Des troupes » est idiomatique sans imposer l’idée d’une seule armée.
- source_word: ἐπὶ τὴν Ἰουδαίαν
  choice: pour attaquer la Judée
  rationale: Dans le contexte d’un mouvement militaire, ἐπί avec l’accusatif indique ici une avancée hostile. Cette formulation française exprime clairement cette orientation.
