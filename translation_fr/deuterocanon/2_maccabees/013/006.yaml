base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/006.yaml
  text: Here everyone pushes on to destruction the man guilty of temple robbery[a], or one who has committed some outstanding excess of other evils.
translation:
  language: fr
  text: Là, tous poussent à la mort celui qui s’est rendu coupable du pillage d’un temple[a], ou même celui qui a atteint un degré exceptionnel dans d’autres méfaits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrilège ». Le terme grec désigne plus précisément le fait de dépouiller ou de violer un temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνταῦθα
  choice: Là
  rationale: Renvoie au lieu décrit dans le contexte immédiat; « là » est le déictique naturel en français dans un récit.
- source_word: ἱεροσυλίας ἔνοχον
  choice: celui qui s’est rendu coupable du pillage d’un temple
  rationale: ἱεροσυλία désigne concrètement la spoliation ou la violation d’un sanctuaire, tandis que ἔνοχος exprime la culpabilité à l’égard de cette faute.
- source_word: ἢ καί τινων ἄλλων κακῶν ὑπεροχὴν πεποιημένον
  choice: ou qui a commis quelque autre méfait d’une gravité exceptionnelle
  rationale: 'Cette formulation naturelle conserve l’idée difficile de ὑπεροχή: un degré éminent ou exceptionnel dans d’autres actes mauvais, sans imposer une catégorie juridique précise.'
- source_word: ἅπαντες προωθοῦσιν
  choice: tous poussent
  rationale: Maintient la participation collective exprimée par ἅπαντες et l’image physique de προωθέω, « pousser en avant ».
- source_word: εἰς ὄλεθρον
  choice: à la mort
  rationale: Dans ce contexte d’exécution par précipitation, ὄλεθρος désigne l’issue fatale; « à la mort » est plus clair et idiomatique que « à la destruction » en français.
theological_decisions:
- issue: Portée de ἱεροσυλία
  choice: pillage d’un temple
  alternative: sacrilège
  rationale: « Sacrilège » est possible mais plus large et abstrait. Le choix retenu préserve la référence concrète à la spoliation ou violation d’un sanctuaire.
- issue: Sens de ὄλεθρος
  choice: mort
  alternative: perdition / destruction
  rationale: Le contexte décrit une mise à mort effective. « Mort » explicite cette issue sans lui donner une portée eschatologique étrangère au passage.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve le mouvement concret de l’action et rend l’expression grecque inhabituelle sur la gravité exceptionnelle du mal sans calque obscur.
