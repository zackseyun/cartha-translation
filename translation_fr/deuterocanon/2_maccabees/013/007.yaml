  source_fidelity: 'Le sens fondamental est bien rendu : τοιούτῳ μόρῳ renvoie au sort funeste précédemment décrit, παράνομος conserve une qualification morale et juridique, et la dernière proposition signifie que Ménélas n’obtint pas même la sépulture. Toutefois, « une place en terre » ajoute « place », absent du grec, et reste moins idiomatique que l’explicitation contextuelle « de sépulture », laquelle peut être équilibrée par la note littérale.'
  naturalness: « L’homme sans loi, Ménélas » est grammaticalement possible, mais l’apposition inversée est raide en français moderne. « Ménélas, l’homme sans loi » est plus naturel et conserve la force descriptive du substantif grec. « Recevoir de sépulture » est également plus naturel et précis dans ce contexte que « obtenir une place en terre ».
  terminology: « Ménélas » est la forme française établie. « L’homme sans loi » rend παράνομος sans introduire les connotations plus étroites de « criminel » ou « impie ». « Sépulture » exprime l’implication funéraire de τῆς γῆς τυγχάνειν, tandis que la note préserve l’image littérale de la terre.
