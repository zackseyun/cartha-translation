  text: By such a fate the lawless Menelaus happened to die[a], not even obtaining burial in the earth.
translation:
  language: fr
  text: C’est par un tel sort que Ménélas, l’homme sans loi, trouva la mort, sans même recevoir de sépulture[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sans même obtenir la terre » ; le sens est qu’il ne reçut même pas de sépulture.'
    reason: Le grec emploie une formule concise où « la terre » désigne implicitement la sépulture ; la note conserve cette image tout en expliquant le sens contextuel.
lexical_decisions:
- source_word: τοιούτῳ μόρῳ
  choice: par un tel sort
  rationale: μόρος évoque le sort funeste ou la destinée mortelle; le démonstratif renvoie à la mort qui vient d’être décrite. Cette formulation conserve le ton solennel et le lien avec le contexte.
- source_word: τὸν παράνομον
  choice: l’homme sans loi
  rationale: παράνομος caractérise Ménélas comme quelqu’un qui agit contre la loi. « Sans loi » maintient la portée juridique et morale sans la réduire au sens plus général de « méchant ».
- source_word: συνέβη θανεῖν
  choice: trouva la mort
  rationale: La construction signifie que cette mort lui advint. L’expression française rend naturellement l’issue funeste sans donner à « arriver » une nuance fortuite indue.
- source_word: μηδὲ τῆς γῆς τυγχάνοντα
  choice: sans même obtenir une place en terre
  rationale: τυγχάνω suivi du génitif peut signifier « obtenir »; ici, « la terre » évoque implicitement une sépulture. La formulation conserve cette image et son implicite.
- source_word: Μενέλαον
  choice: Ménélas
  rationale: Forme française traditionnelle du nom propre grec Μενέλαος.
theological_decisions:
- issue: Caractérisation morale et juridique de Ménélas par παράνομος
  choice: l’homme sans loi, Ménélas
  alternative: le criminel Ménélas; l’impie Ménélas
  rationale: « Sans loi » reflète directement la transgression de la loi sans introduire une qualification pénale ou religieuse plus précise que le grec.
translation_notes:
  register: Français moderne, digne et narratif. « Trouva la mort » convient au registre solennel du récit; « une place en terre » reste intelligible tout en préservant l’image grecque explicitée en note.
