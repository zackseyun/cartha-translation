review_pass:
  verdict: revise
  source_fidelity: La structure et le sens général sont fidèles. Toutefois, « pousser Antiochos à agir » introduit un complément (« à agir ») qui n’est pas exprimé en grec. « Exhorter Antiochos » rend directement παρεκάλει tout en conservant l’aspect duratif de l’imparfait par « ne cessait de ». La finale « qu’il serait établi dans l’autorité » reflète mieux le futur passif κατασταθήσεται et l’indétermination de ἀρχή.
  naturalness: Le français est globalement naturel et de registre narratif soutenu. « Avec beaucoup de dissimulation » est plus idiomatique que « avec une grande duplicité » dans cette construction et décrit plus précisément l’attitude feinte que le contexte attribue à Ménélas.
  terminology: « Ménélas », « Antiochos », « patrie » et « autorité » conviennent au français moderne international. « Sécurité de sa patrie » maintient le sens politique de σωτηρία sans imposer un sens sotériologique religieux. La note signale l’alternative liée à εἰρωνία sans la trancher de manière excessive.
  issues:
  - severity: medium
    issue: Complément interprétatif dans « pousser Antiochos à agir »
    rationale: παρεκάλει a pour objet Antiochos, mais le grec ne précise pas « à agir ». Le remplacer par « exhorter Antiochos » évite cet ajout tout en gardant l’idée d’une exhortation répétée.
  - severity: low
    issue: Nuance de εἰρωνία
    rationale: « Duplicité » est possible, mais désigne volontiers un trait de caractère. « Avec beaucoup de dissimulation » s’accorde plus naturellement avec μετὰ πολλῆς εἰρωνίας dans le contexte et la note conserve l’alternative « insincérité ».
  revised_text: Ménélas se joignit aussi à eux et, avec beaucoup de dissimulation[a], ne cessait d’exhorter Antiochos — non pour assurer la sécurité de sa patrie[b], mais parce qu’il pensait qu’il serait établi dans l’autorité.
