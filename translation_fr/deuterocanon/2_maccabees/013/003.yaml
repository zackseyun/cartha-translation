revisions:
- from: Ménélas se joignit aussi à eux et, avec une grande duplicité[a], ne cessait de pousser Antiochos à agir — non pour assurer la sécurité de sa patrie[b], mais parce qu’il pensait être établi au pouvoir.
  to: Ménélas se joignit aussi à eux et, avec beaucoup de dissimulation[a], ne cessait d’exhorter Antiochos — non pour assurer la sécurité de sa patrie[b], mais parce qu’il pensait qu’il serait établi dans l’autorité.
  rationale: La révision supprime l’ajout implicite « à agir », améliore l’idiome français pour la dissimulation, et rend explicitement le futur passif grec dans la dernière proposition. Les deux ancres de note sont préservées et correspondent aux termes concernés.
