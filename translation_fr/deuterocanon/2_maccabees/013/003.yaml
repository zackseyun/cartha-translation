base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/003.yaml
  text: Menelaus also joined them and[a], with great insincerity, kept urging Antiochus on—not for the safety of the fatherland[b], but because he thought he would be established in power.
translation:
  language: fr
  text: Ménélas se joignit aussi à eux et, avec beaucoup de dissimulation[a], ne cessait d’exhorter Antiochos — non pour assurer la sécurité de sa patrie[b], mais parce qu’il pensait qu’il serait établi dans l’autorité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec une grande insincérité » ; le terme grec peut désigner l’ironie ou une attitude feinte qui cache les véritables intentions.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour le bien de son pays ».
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέμιξεν
  choice: se joignit
  rationale: Le verbe exprime ici le fait de se mêler à un groupe ou de s’y associer. « Se joignit » est naturel en français narratif.
- source_word: παρεκάλει
  choice: ne cessait de pousser … à agir
  rationale: L’imparfait grec présente une action prolongée ou répétée. Dans ce contexte, le verbe désigne une exhortation pressante adressée à Antiochos.
- source_word: μετὰ πολλῆς εἰρωνίας
  choice: avec une grande duplicité
  rationale: εἰρωνία désigne ici la dissimulation de ses véritables intentions plutôt que l’ironie au sens français moderne. « Duplicité » conserve la portée morale du terme sans préciser indûment la forme de son discours.
- source_word: σωτηρίᾳ
  choice: sécurité
  rationale: Dans ce contexte politique, σωτηρία renvoie à la sauvegarde ou à la préservation de la patrie, et non spécifiquement au salut religieux.
- source_word: πατρίδος
  choice: sa patrie
  rationale: πατρίς désigne le pays natal ou ancestral. « Sa patrie » rend naturellement cette nuance en français moderne.
- source_word: ἐπὶ τῆς ἀρχῆς κατασταθήσεται
  choice: être établi au pouvoir
  rationale: La construction évoque l’installation dans une position d’autorité. Cette formulation conserve l’étendue possible de ἀρχή sans la réduire à une simple fonction ni l’amplifier en royauté.
theological_decisions:
- issue: Caractérisation morale du comportement de Ménélas dans εἰρωνία
  choice: avec une grande duplicité
  alternative: avec beaucoup de dissimulation ; avec une grande insincérité
  rationale: Le contraste explicite entre la prétendue défense de la patrie et l’ambition personnelle de Ménélas indique des motifs dissimulés. Le rendu évite le faux sens moderne que pourrait suggérer « ironie ».
- issue: Portée de ἀρχή dans la dernière proposition
  choice: être établi au pouvoir
  alternative: être nommé à une fonction ; être établi dans l’autorité
  rationale: Le grec indique une installation dans l’autorité sans déterminer précisément la charge. Le texte français maintient cette relative indétermination.
translation_notes:
  register: Français international moderne, narratif et digne. « Antiochos » suit la forme française usuelle du nom grec. Le tiret met en relief l’opposition des motifs sans ajouter d’interprétation.
