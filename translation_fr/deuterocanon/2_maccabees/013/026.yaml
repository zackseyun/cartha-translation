  yaml_path: translation/deuterocanon/2_maccabees/013/026.yaml
  text: Lysias came forward to the tribunal, made as good a defense as he could, persuaded them, calmed them, made them well-disposed, and marched back to Antioch. Thus the king’s attack and withdrawal proceeded.
translation:
  language: fr
  text: Lysias se présenta devant le tribunal[a], plaida sa cause comme les circonstances le permettaient[b], les persuada, les calma, se les rendit favorables, puis leva le camp pour retourner à Antioche. Ainsi se déroulèrent l’attaque du roi et son retrait[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant la tribune » ou « devant le siège judiciaire » (grec βῆμα).
    reason: lexical_alternative
  - marker: b
    text: L’adverbe grec est difficile ; on peut aussi comprendre « de façon convenable », « suffisamment bien » ou « du mieux qu’il put ».
    reason: lexical_alternative
  - marker: c
    text: Ou « l’assaut du roi et son départ », voire « la levée de son camp ».
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθεν
  choice: se présenta
  rationale: Le verbe signifie « s’approcher » ou « venir ». Devant un tribunal, « se présenta » exprime naturellement l’entrée en scène publique de Lysias.
- source_word: βῆμα
  choice: tribunal
  rationale: βῆμα désigne littéralement une estrade ou une tribune, et par extension le siège ou lieu du jugement. Le contexte de la défense publique favorise « tribunal », sans exclure le sens matériel signalé en note.
- source_word: ἀπελογήσατο
  choice: plaida sa cause
  rationale: Le moyen signifie présenter une défense. « Plaida sa cause » est idiomatique en français et ne suppose pas nécessairement une procédure judiciaire moderne.
- source_word: ἐνδεχομένως
  choice: comme les circonstances le permettaient
  rationale: L’adverbe difficile peut exprimer ce qui est convenable, possible ou adapté à la situation. Cette formulation conserve l’idée de possibilité circonstancielle sans affirmer qu’il fit simplement « de son mieux ».
- source_word: συνέπεισεν
  choice: les persuada
  rationale: Le verbe composé exprime une persuasion effective. Le complément implicite est rendu par « les », comme l’exige le français.
- source_word: κατεπράϋνεν
  choice: les calma
  rationale: Le verbe signifie apaiser ou calmer. « Les calma » est direct, actuel et n’ajoute pas de moyen politique ou matériel absent du grec.
- source_word: εὐμενεῖς ἐποίησεν
  choice: se les rendit favorables
  rationale: La tournure grecque signifie littéralement « les rendit bien disposés ». La formulation française préserve le résultat causatif et l’enchaînement avec les verbes précédents.
- source_word: ἀνέζευξεν
  choice: leva le camp pour retourner
  rationale: Le verbe appartient au vocabulaire militaire du départ après la levée du camp. Cette traduction conserve cette nuance tout en indiquant clairement la destination, Antioche.
- source_word: ἐφόδου
  choice: offensive
  rationale: Le nom peut désigner une attaque, un assaut ou une avance hostile. « Offensive » convient au résumé d’une opération militaire et forme une paire naturelle avec « retrait ».
- source_word: ἀναζυγῆς
  choice: retrait
  rationale: Le terme désigne le départ, la levée du camp ou le mouvement de retour d’une armée. « Retrait » évite de suggérer une déroute, que « retraite » pourrait laisser entendre.
- source_word: ἐχώρησεν
  choice: se déroulèrent
  rationale: Dans cette conclusion narrative, le verbe indique comment les événements suivirent leur cours. « Se déroulèrent » rend naturellement cette valeur récapitulative.
theological_decisions:
- issue: Le verset ne contient pas de terme doctrinal majeur; l’enjeu est de préserver les nuances judiciaires et militaires du récit.
  choice: Présenter le passage comme le résumé de la défense efficace de Lysias et du retrait militaire du roi.
  alternative: Traduire βῆμα par « estrade » et ἀναζυγή par « retraite » ou « levée du camp ».
  rationale: La traduction principale privilégie la clarté contextuelle sans transformer le retrait en défaite ni imposer à βῆμα un sens matériel ou judiciaire exclusif.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe conserve la succession rapide des actions grecques, tandis que « se les rendit favorables » évite un calque lourd. Les notes rendent visibles les ambiguïtés réelles de βῆμα, ἐνδεχομένως et ἀναζυγή.
