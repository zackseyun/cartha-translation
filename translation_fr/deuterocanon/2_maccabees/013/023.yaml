base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/023.yaml
  text: He attacked those around Judas[a], but was defeated. Having become desperate, he took action against Philip in Antioch, the one left in charge of affairs; he was thrown into confusion, appealed to the Jews, submitted, and swore to all the just terms. He was reconciled and offered sacrifice, honored the sanctuary and the place[b], and showed kindness.
translation:
  language: fr
  text: Il attaqua les hommes de Judas, mais il fut vaincu. Désespéré, il prit des mesures contre Philippe à Antioche, celui qu’il avait laissé à la tête des affaires[a]. Il fut déconcerté, fit appel aux Juifs, céda et jura d’accepter toutes les conditions justes[b]. Il se réconcilia avec eux, offrit un sacrifice, honora le sanctuaire et le lieu, et fit preuve de bienveillance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La suite grecque concernant Philippe est très condensée et difficile ; la nature exacte des mesures prises contre lui demeure incertaine.
    reason: textual_variant
  - marker: b
    text: 'Ou : « tout ce qui était juste ». L’expression peut désigner les conditions équitables de l’accord ou, plus généralement, tout ce qui était juste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέβαλεν τοῖς περὶ τὸν Ἰούδαν
  choice: Il attaqua les hommes de Judas
  rationale: προσβάλλω exprime ici une attaque militaire; l’idiome οἱ περὶ τὸν Ἰούδαν désigne le groupe ou les forces rassemblées autour de Judas.
- source_word: ἥττων ἐγένετο
  choice: il fut vaincu
  rationale: Dans ce contexte militaire, l’expression indique qu’il eut le dessous, donc qu’il subit une défaite.
- source_word: ἀπονοηθεὶς
  choice: Désespéré
  rationale: Le participe évoque un homme à bout de ressources ou poussé au désespoir après sa défaite.
- source_word: μετέλαβεν ... τὸν Φίλιππον
  choice: il prit des mesures contre Philippe
  rationale: La construction est très condensée et son sens exact demeure incertain. Cette formulation indique une intervention concernant Philippe, avec une valeur probablement hostile, sans préciser indûment sa nature.
- source_word: τὸν ἀπολελειμμένον ἐπὶ τῶν πραγμάτων
  choice: celui qu’il avait laissé à la tête des affaires
  rationale: La phrase désigne Philippe comme le responsable auquel la conduite des affaires avait été confiée.
- source_word: συνεχύθη
  choice: Bouleversé
  rationale: Le verbe passif exprime le trouble et la confusion; « bouleversé » convient au récit et reste naturel en français.
- source_word: τοὺς Ἰουδαίους παρεκάλεσεν
  choice: il fit appel aux Juifs
  rationale: παρακαλέω peut signifier exhorter, supplier ou solliciter. Le contexte diplomatique favorise la formulation large « faire appel à ».
- source_word: ὑπετάγη
  choice: céda
  rationale: Le passif indique qu’il se soumit ou consentit à céder. « Céda » rend naturellement le mouvement diplomatique sans suggérer nécessairement une soumission politique durable.
- source_word: ὤμοσεν ἐπὶ πᾶσι τοῖς δικαίοις
  choice: jura d’accepter toutes les conditions justes
  rationale: Dans le contexte d’un accord, τὰ δίκαια peut désigner ce qui est juste ou les conditions équitables du règlement.
- source_word: συνελύθη
  choice: Il se réconcilia avec eux
  rationale: Le verbe évoque ici la fin de l’hostilité et la conclusion d’un accord. Le complément « avec eux » explicite en français les partenaires déjà nommés, les Juifs.
- source_word: θυσίαν προσήγαγεν
  choice: offrit un sacrifice
  rationale: Il s’agit de la formulation cultuelle ordinaire pour la présentation d’un sacrifice.
- source_word: ἐτίμησεν τὸν νεὼ καὶ τὸν τόπον
  choice: honora le sanctuaire et le lieu
  rationale: νεώς désigne plus précisément le sanctuaire ou bâtiment sacré, tandis que τόπος reste distinct et désigne le lieu; la traduction conserve les deux termes.
- source_word: ἐφιλανθρώπησεν
  choice: fit preuve de bienveillance
  rationale: Le verbe exprime une conduite humaine, clémente ou bienveillante envers autrui.
theological_decisions:
- issue: Terminologie cultuelle de νεώς et θυσίαν προσήγαγεν
  choice: « sanctuaire » et « offrit un sacrifice »
  alternative: « Temple » et « présenta une offrande »
  rationale: Ces choix rendent les réalités cultuelles concrètes du récit sans introduire de précision doctrinale étrangère au grec.
- issue: Séquence difficile μετέλαβεν ἀπονοηθεὶς τὸν Φίλιππον ... συνεχύθη
  choice: Conserver une formulation prudente et signaler l’incertitude en note
  alternative: Préciser qu’il saisit Philippe, apprit sa révolte, se tourna vers lui ou conclut une alliance avec lui
  rationale: La syntaxe transmise est comprimée et difficile. Une traduction trop précise trancherait une ambiguïté que le texte grec fourni ne permet pas de résoudre sûrement.
- issue: Portée de ἐπὶ πᾶσι τοῖς δικαίοις
  choice: « toutes les conditions justes » avec une variante en note
  alternative: « tout ce qui était juste »
  rationale: Le contexte diplomatique permet de comprendre l’expression comme les clauses équitables d’un accord, mais le grec peut rester plus général.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases restent accessibles, tout en conservant la densité du récit grec. Les notes sont placées exactement sur les expressions auxquelles elles se rapportent.
