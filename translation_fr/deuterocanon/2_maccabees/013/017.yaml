  text: And when day was already beginning to appear[a], this had happened because the Lord’s protection had quickly come to his aid.
translation:
  language: fr
  text: Alors que le jour commençait déjà à poindre, cela s’était produit grâce à la protection que le Seigneur lui avait promptement accordée.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parce que le secours protecteur du Seigneur lui était arrivé promptement ». Le nom grec rare ἐπαρήγορασις peut évoquer une aide ou un soulagement apporté à temps.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποφαινούσης δὲ ἤδη τῆς ἡμέρας
  choice: Alors que le jour commençait déjà à poindre
  rationale: Le génitif absolu situe l’action à la première apparition du jour. « Commençait à poindre » restitue naturellement en français la nuance inchoative de ὑποφαίνω.
- source_word: τοῦτο ἐγέγονει
  choice: tout cela s’était accompli
  rationale: La forme ἐγέγονει présente l’événement comme déjà achevé au moment où le jour paraît. « Tout cela » reprend naturellement en français l’ensemble de l’action précédente que désigne τοῦτο.
- source_word: διὰ
  choice: car
  rationale: Avec l’accusatif, διὰ exprime ici la cause. « Car » relie clairement l’accomplissement à l’intervention protectrice du Seigneur.
- source_word: ἐπαρήγορασιν
  choice: rapidement venue en aide
  rationale: Ce nom rare évoque une assistance ou un soulagement qui arrive à propos, avec une probable nuance de promptitude. Une tournure verbale est plus naturelle en français tout en conservant ces deux aspects.
- source_word: αὐτῷ
  choice: lui ... en aide
  rationale: Le datif désigne le bénéficiaire de l’intervention; cette formulation française rend clairement cette relation.
- source_word: τοῦ κυρίου
  choice: du Seigneur
  rationale: Dans ce récit, κύριος désigne Dieu. « Seigneur » respecte l’usage biblique français et la continuité avec la Septante.
- source_word: σκέπην
  choice: la protection
  rationale: σκέπη peut désigner un abri, une couverture ou une protection. Dans ce contexte de délivrance militaire, « protection » exprime le sens sans imposer une image trop concrète.
theological_decisions:
- issue: Traduction de κύριος dans un récit grec deutérocanonique
  choice: le Seigneur
  alternative: le Maître
  rationale: Le terme désigne ici Dieu comme source de la délivrance. « Le Seigneur » est la formulation biblique française habituelle et préserve la portée révérencielle du grec.
- issue: Rapport entre la réussite de l’action et l’intervention divine
  choice: car la protection du Seigneur lui était rapidement venue en aide
  alternative: grâce à la protection du Seigneur, qui lui apporta une aide opportune
  rationale: La formulation maintient la causalité explicite de διὰ sans préciser davantage le mode de l’intervention divine ni résoudre excessivement l’ambiguïté du nom rare ἐπαρήγορασις.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve l’antériorité de l’action par le plus-que-parfait et rend la construction grecque dense par une proposition causale naturelle.
