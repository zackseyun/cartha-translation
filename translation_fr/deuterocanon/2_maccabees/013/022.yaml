  text: The king negotiated further with those in Bethsura[a], gave and received pledges of good faith, and went away[b],
translation:
  language: fr
  text: Le roi reprit les négociations avec ceux qui se trouvaient à Bethsoura[a] ; il échangea avec eux des gages de bonne foi[b], puis s’en alla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bethsoura peut aussi être rendu par « Beth-Tsour », d’après la forme hébraïque du nom.
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « il donna et reçut la main droite ». Cette expression désigne l’échange d’engagements ou de garanties réciproques.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδευτερολόγησεν
  choice: reprit les négociations
  rationale: Le verbe évoque littéralement le fait de parler ou de traiter une seconde fois. Dans ce contexte politico-militaire, suivi d’un échange de la main droite, il désigne naturellement la reprise des négociations.
- source_word: τοῖς ἐν Βαθσούροις
  choice: avec ceux qui se trouvaient à Bethsoura
  rationale: La tournure désigne sans autre précision les personnes présentes dans la ville; elle n’impose ni leur sexe ni leur statut militaire.
- source_word: Βαθσούροις
  choice: Bethsoura
  rationale: Cette forme française reproduit de près le nom grec; la forme hébraïsante Beth-Tsour est signalée en note.
- source_word: δεξιὰν ἔδωκεν, ἔλαβεν
  choice: Il donna et reçut la main droite
  rationale: La traduction conserve l’image grecque et l’ordre des verbes. Dans ce contexte, donner et recevoir la main droite exprime un engagement ou une garantie réciproque, ce que précise la note.
- source_word: ἀπῇει
  choice: puis s’en alla
  rationale: Formulation narrative simple et naturelle pour exprimer le départ; «puis» rend clairement la succession des actions sans ajouter de contenu substantiel.
