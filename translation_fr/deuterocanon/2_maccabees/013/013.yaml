  text: But he himself[a], after meeting with the elders, decided, before the king’s army could invade Judea and gain control of the city, to go out and decide the matter with the help of God.
translation:
  language: fr
  text: Mais, après s’être réuni en privé avec les anciens, il décida qu’avant que l’armée du roi n’envahisse la Judée et ne prenne le contrôle de la ville, ils sortiraient pour régler la situation[a] avec l’aide de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « trancher l’affaire » ou « décider de la marche à suivre ». L’expression grecque est large et désigne la résolution de la crise en cours.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθʼ ἑαυτὸν ... σὺν τοῖς πρεσβυτέροις γενόμενος
  choice: après s’être réuni en privé avec les anciens
  rationale: καθʼ ἑαυτόν indique ici une rencontre à l’écart ou privée, et non une action solitaire, puisque le texte ajoute « avec les anciens ». La tournure française exprime naturellement la consultation sans la surinterpréter.
- source_word: ἐβουλεύσατο
  choice: il décida
  rationale: Le verbe évoque une délibération qui aboutit à une résolution. Le contexte de réunion avec les anciens conserve la dimension consultative.
- source_word: πρὶν εἰσβαλεῖν τὸ στράτευμα τοῦ βασιλέως ἐπὶ τὴν Ἰουδαίαν
  choice: avant que l’armée du roi n’envahisse la Judée
  rationale: Dans ce contexte militaire, εἰσβαλεῖν désigne une entrée hostile. Le ne explétif après « avant que » relève du français soigné et n’exprime pas une négation.
- source_word: γενέσθαι τῆς πόλεως ἐγκρατεῖς
  choice: ne prenne le contrôle de la ville
  rationale: ἐγκρατεῖς exprime la maîtrise ou la possession effective de la ville. « Prendre le contrôle » est actuel et précis.
- source_word: ἐξελόντας
  choice: ils sortiraient
  rationale: Le participe accusatif pluriel renvoie au groupe engagé dans la décision, et non au seul dirigeant. Le français explicite ce sujet pluriel tout en laissant indéterminée sa composition exacte.
- source_word: κρῖναι τὰ πράγματα
  choice: régler la situation
  rationale: L’expression est large et vise à résoudre la crise en cours. « Régler la situation » reste naturel sans imposer un sens exclusivement judiciaire ou militaire.
- source_word: τῇ τοῦ θεοῦ βοηθείᾳ
  choice: avec l’aide de Dieu
  rationale: Le datif exprime le moyen ou l’assistance sur laquelle repose l’action.
theological_decisions:
- issue: Sujet implicite de ἐξελόντας κρῖναι
  choice: Le pluriel « ils » renvoie à Judas et au groupe associé à sa décision, sans en préciser davantage la composition.
  alternative: Comprendre que Judas seul devait sortir et régler la situation.
  rationale: Le pluriel ἐξελόντας favorise un sujet collectif. La traduction respecte cette donnée grammaticale sans identifier dogmatiquement tous les membres du groupe.
- issue: Portée de l’aide divine
  choice: L’action envisagée doit être menée « avec l’aide de Dieu ».
  alternative: Présenter le succès comme déjà garanti par Dieu.
  rationale: Le grec affirme la dépendance envers l’aide divine, mais ne formule pas ici une garantie explicite de victoire.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe maintient l’enchaînement temporel du grec tout en rendant explicite le sujet pluriel indiqué par ἐξελόντας. Le marqueur [a] est placé immédiatement après l’expression qu’il explique.
