  text: But the king[a], weighed down in spirit, advanced, intending to inflict on the Jews the worst things that had happened under his father.
translation:
  language: fr
  text: Mais le roi, l’esprit accablé, avançait, comptant[a] faire subir aux Juifs les pires maux qui s’étaient produits sous le règne de son père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « s’attendant à faire subir aux Juifs ». Le participe grec peut exprimer une attente ou une intention.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φρονήμασιν
  choice: l’esprit
  rationale: Le datif pluriel indique la sphère intérieure dans laquelle le roi est accablé. « L’esprit » garde cette dimension mentale et dispositionnelle sans préciser indûment la nature de ses pensées.
- source_word: βεβαρημένος
  choice: accablé
  rationale: Le participe parfait décrit un état durable de pesanteur intérieure. « Accablé » restitue naturellement en français la métaphore du poids.
- source_word: ἦρχετο
  choice: avançait
  rationale: Dans le contexte d’une campagne militaire, l’imparfait exprime le mouvement en cours du roi. « Avançait » convient mieux que le générique « venait ».
- source_word: τὰ χείριστα
  choice: les pires maux
  rationale: Le superlatif neutre pluriel est substantivé. « Les pires maux » rend la portée hostile du contexte tout en évitant de définir précisément les actes envisagés.
- source_word: τῶν ἐπὶ τοῦ πατρὸς αὐτοῦ γεγονότων
  choice: qui s’étaient produits sous le règne de son père
  rationale: ἐπί avec le génitif désigne ici l’époque ou le régime du père, tandis que γεγονότων renvoie à ce qui s’était produit. L’ajout de « règne » explicite naturellement la valeur politique de la tournure.
- source_word: ἐνδεξόμενος
  choice: comptant faire subir
  rationale: Dans ce contexte hostile, avec τοῖς Ἰουδαίοις au datif, le participe présente le roi comme envisageant de faire venir ces maux sur les Juifs. « Comptant faire subir » conserve une nuance d’intention sans la durcir en résolution absolument certaine.
