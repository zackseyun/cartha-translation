  text: He came to Ptolemais[a]. The people of Ptolemais were displeased about the terms, for they were exceedingly fearful[b], and they wanted to set aside the arrangements.
translation:
  language: fr
  text: Il arriva à Ptolémaïs. Les habitants de Ptolémaïs supportaient mal les conditions de l’accord, car ils étaient extrêmement craintifs ; ils voulurent rejeter les dispositions.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom grec traduit par « dispositions » est rare ; il peut aussi désigner les stipulations précises de l’accord. Le texte source de ce verset présente en outre une divergence importante lors de sa validation ; la traduction suit ici le grec conservé.
    reason: textual_variant
lexical_decisions:
- source_word: ἐδυσφόρουν
  choice: supportaient mal
  rationale: Le verbe exprime une réaction pénible ou mécontente. « Supportaient mal » rend naturellement cette nuance sans exagérer en parlant d’indignation.
- source_word: συνθηκῶν
  choice: conditions de l’accord
  rationale: Dans ce contexte politique, le pluriel désigne les conditions négociées d’un accord. Cette formulation est claire en français moderne et évite la coloration théologique possible de « alliances ».
- source_word: οἱ Πτολεμαεῖς
  choice: les habitants de Ptolémaïs
  rationale: Le gentilé grec désigne ici la population de la ville. La périphrase est plus immédiatement compréhensible que le rare « Ptolémaïtes ».
- source_word: ἐδειλίαζον
  choice: étaient extrêmement craintifs
  rationale: Le verbe évoque la peur ou la timidité, avec une possible nuance dépréciative. « Craintifs » préserve cette nuance sans imposer le jugement plus fort de « lâches ».
- source_word: ὑπεράγαν
  choice: extrêmement
  rationale: Cet adverbe intensif marque un degré exceptionnel et porte naturellement sur « craintifs ».
- source_word: ἀθετεῖν
  choice: rejeter
  rationale: Le verbe peut signifier écarter, invalider ou ne pas respecter. « Rejeter » exprime clairement leur intention de récuser les dispositions convenues.
- source_word: διαστάλσεις
  choice: dispositions
  rationale: Ce nom rare paraît désigner les clauses ou prescriptions particulières du règlement conclu. « Dispositions » convient au registre diplomatique tout en restant lisible.
