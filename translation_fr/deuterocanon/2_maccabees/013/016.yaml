  text: And in the end they filled the camp with fear and confusion[a], and withdrew prosperously.
translation:
  language: fr
  text: Finalement, ils remplirent le camp de crainte et de confusion, puis se retirèrent avec succès[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « alors que tout allait bien pour eux » ou « en bonne posture ». Le participe grec évoque le fait de bien réussir, de prospérer ou de connaître une situation favorable.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ τέλος
  choice: Finalement
  rationale: L’expression marque ici l’aboutissement de l’action; « Finalement » est naturel et conserve sa valeur temporelle.
- source_word: παρεμβολήν
  choice: le camp
  rationale: Dans ce contexte militaire, le nom désigne le campement ou le camp; « le camp » est la formulation française la plus concise et naturelle.
- source_word: δέους
  choice: de crainte
  rationale: Le terme exprime une peur intense sans imposer nécessairement le degré plus fort de « terreur ».
- source_word: ταραχῆς
  choice: de confusion
  rationale: Le mot évoque l’agitation et le désordre; « confusion » convient au contexte militaire tout en évitant de préciser indûment « panique ».
- source_word: ἐπλήρωσαν
  choice: ils remplirent
  rationale: Traduction directe du verbe; le camp est l’objet rempli de crainte et de confusion.
- source_word: ἐξέλυσαν
  choice: se retirèrent
  rationale: Dans ce récit militaire, le verbe indique leur départ après l’opération; « se retirèrent » rend naturellement ce mouvement sans suggérer nécessairement une défaite.
- source_word: εὐημεροῦντες
  choice: avec succès
  rationale: Le participe signifie qu’ils prospéraient ou que tout allait bien pour eux; « avec succès » en exprime idiomatiquement la portée dans ce contexte militaire, sans réduire le sens au seul maintien du bon ordre.
