  text: And when Judas learned these things, he ordered the multitude to call upon the Lord day and night, that, as at other times, so now also he might come to their aid,
translation:
  language: fr
  text: Quand Judas apprit cela, il ordonna à la foule d’invoquer le Seigneur jour et nuit, afin que, comme à d’autres moments, il leur vienne aussi maintenant en aide.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεταλαβὼν
  choice: Quand Judas apprit
  rationale: Dans ce contexte, le participe indique que Judas reçoit et prend connaissance de ces informations. « Apprit » rend naturellement cette valeur en français.
- source_word: παρήγγειλεν
  choice: il ordonna
  rationale: Le verbe exprime une directive revêtue d’autorité ; « ordonna » en conserve la force sans alourdir le récit.
- source_word: τῷ πλήθει
  choice: à la foule
  rationale: πλῆθος désigne ici l’ensemble nombreux réuni autour de Judas. « La foule » est collectif, naturel et fidèle au grec.
- source_word: διʼ ἡμέρας καὶ νυκτὸς
  choice: jour et nuit
  rationale: Cette locution idiomatique exprime une invocation continuelle et trouve un équivalent direct en français courant.
- source_word: ἐπικαλεῖσθαι τὸν κύριον
  choice: d’invoquer le Seigneur
  rationale: « Invoquer » désigne clairement l’appel adressé à Dieu dans la prière, tandis que « Seigneur » conserve la résonance scripturaire de κύριος.
- source_word: εἴ ποτε καὶ ἄλλοτε, καὶ νῦν
  choice: afin que, comme il l’avait fait en d’autres occasions, il vienne encore maintenant
  rationale: La formulation grecque, littéralement conditionnelle, évoque les interventions antérieures de Dieu et sollicite son aide présente. La comparaison française en transmet la portée sans en faire une affirmation doctrinale plus précise que le texte.
- source_word: ἐπιβοηθεῖν
  choice: vienne à leur secours
  rationale: Le verbe exprime une aide apportée en réponse à un appel pressant ; « venir à leur secours » restitue cette nuance d’intervention.
theological_decisions:
- issue: Rendu de κύριος dans une prière adressée à Dieu
  choice: le Seigneur
  alternative: le Maître
  rationale: Dans ce contexte juif de prière, « le Seigneur » est le rendu scripturaire naturel et ne réduit pas κύριος à une relation humaine de maîtrise.
- issue: Valeur de εἴ ποτε καὶ ἄλλοτε, καὶ νῦν
  choice: comme il l’avait fait en d’autres occasions, il vienne encore maintenant
  alternative: si jamais il les avait secourus auparavant, qu’il les secoure aussi maintenant
  rationale: La tournure française comparative exprime le rappel des secours divins antérieurs impliqué par l’idiome grec, tout en maintenant la demande au mode subjonctif et sans préciser la forme de l’intervention.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase conserve la continuité syntaxique du verset grec et son orientation vers la proposition suivante, tout en restant lisible isolément.
