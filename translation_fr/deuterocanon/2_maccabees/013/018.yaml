  text: But the king[a], having learned by experience the Jews’ boldness, tried to take the strongholds by stratagems[c][b],
translation:
  language: fr
  text: Mais le roi, ayant fait l’expérience de l’audace des Juifs, tenta de s’emparer[a] des positions[b] par des stratagèmes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le sens précis du verbe grec est difficile ; on pourrait aussi traduire : « attaqua les positions » ou « exerça une pression sur elles ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les lieux » ; dans ce contexte militaire, il peut s’agir de positions défendues ou de places fortes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰληφὼς πεῖραν
  choice: ayant fait l’expérience de
  rationale: Cette tournure française naturelle conserve l’idée de connaissance acquise concrètement par l’expérience.
- source_word: εὐτολμίας
  choice: audace
  rationale: « Audace » exprime la disposition à oser sans imposer la valeur nettement positive de « courage »; dans la bouche de l’adversaire, le terme peut rester ambivalent.
- source_word: κατεῖρασεν
  choice: tenta de s’emparer
  rationale: Dans ce contexte militaire, le verbe difficile paraît désigner une action menée contre des positions; cette formulation rend la visée hostile sans présenter leur prise comme accomplie.
- source_word: διὰ μεθόδων
  choice: par des stratagèmes
  rationale: Le pluriel μέθοδοι évoque ici des procédés calculés ou des manœuvres tactiques plutôt que de simples méthodes.
- source_word: τοὺς τόπους
  choice: des positions
  rationale: Littéralement « les lieux », mais le contexte militaire favorise « positions », qui suggère des emplacements défendus sans préciser qu’il s’agit nécessairement de forteresses.
