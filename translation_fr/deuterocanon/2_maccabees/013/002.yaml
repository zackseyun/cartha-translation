base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/002.yaml
  text: 'and with him Lysias[a], the guardian and overseer of affairs, each having a Greek force: eleven myriads of infantry, five thousand three hundred cavalry, twenty-two elephants[b], and three hundred scythed chariots.'
translation:
  language: fr
  text: et avec lui Lysias, le tuteur et responsable des affaires. Chacun disposait d’une armée grecque composée de cent dix mille fantassins[a], de cinq mille trois cents cavaliers, de vingt-deux éléphants et de trois cents chars munis de faux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « onze myriades de fantassins »; une myriade équivaut à dix mille.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν αὐτῷ Λυσίαν
  choice: et avec lui Lysias
  rationale: Rend directement l’accompagnement et translittère le nom propre selon l’usage français.
- source_word: τὸν ἐπίτροπον
  choice: le tuteur
  rationale: ἐπίτροπος désigne une personne à qui une tutelle ou une charge est confiée; « tuteur » conserve ce sens sans imposer le titre plus précis de « régent ».
- source_word: καὶ ἐπὶ τῶν πραγμάτων
  choice: et responsable des affaires
  rationale: L’expression indique que Lysias exerce une autorité sur les affaires du royaume; cette formulation est naturelle et ne surdétermine pas sa fonction officielle.
- source_word: ἕκαστον ἔχοντα δύναμιν Ἑλληνικὴν
  choice: Chacun disposait d’une armée grecque
  rationale: Le singulier distributif ἕκαστον se rapporte aux deux hommes. « Armée grecque » rend clairement δύναμιν Ἑλληνικήν dans ce contexte hellénistique.
- source_word: πεζῶν μυριάδας ἕνδεκα
  choice: cent dix mille fantassins
  rationale: Onze myriades correspondent exactement à 110 000 hommes; la conversion est immédiatement compréhensible en français moderne, avec une note qui signale la forme grecque.
- source_word: ἱππέων πεντακισχιλίους τριακοσίους
  choice: cinq mille trois cents cavaliers
  rationale: « Cavaliers » désigne naturellement les soldats montés et permet de conserver le dénombrement des personnes.
- source_word: ἐλέφαντας εἴκοσι δύο
  choice: vingt-deux éléphants
  rationale: Traduction directe; le contexte militaire indique qu’il s’agit d’éléphants de guerre sans qu’il soit nécessaire de l’ajouter.
- source_word: ἅρματα δὲ δρεπανηφόρα τριακόσια
  choice: trois cents chars munis de faux
  rationale: δρεπανηφόρα signifie littéralement « porteurs de faux »; cette formulation française est plus transparente que le terme technique rare « chars à faux ».
