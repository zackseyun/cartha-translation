translation_notes:
  register: Français international moderne, digne et lisible. La ponctuation sépare le titre de Lysias de la proposition distributive afin d’éviter une phrase excessivement lourde. L’ambiguïté fonctionnelle de ἐπίτροπος est conservée par « tuteur » plutôt que résolue en « régent ».
