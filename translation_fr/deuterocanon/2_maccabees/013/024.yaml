  text: And he received Maccabaeus favorably[a], and left Hegemonides as commander from Ptolemais as far as the Gerrenians,
translation:
  language: fr
  text: Il accueillit favorablement Maccabée et laissa Hégémonide comme commandant du territoire allant de Ptolémaïs jusqu’aux Gennères[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte littéralement : « de Ptolémaïs jusqu’aux Gennères ». Le dernier nom, qui peut désigner un lieu ou un peuple, est incertain du point de vue textuel et géographique dans ce témoin; la traduction en conserve donc prudemment la forme grecque.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐπεδέξατο
  choice: accueillit favorablement
  rationale: Le moyen peut exprimer un accueil favorable, et non une simple acceptation. Cette formulation rend la nuance sans surinterprétation.
- source_word: κατέλειπεν
  choice: laissa
  rationale: Le verbe signifie fondamentalement « laisser ». Le contexte suggère le maintien ou l’établissement dans une fonction, précisée par « comme commandant ».
- source_word: στρατηγόν
  choice: commandant
  rationale: Le terme désigne un chef militaire sans imposer ici un grade moderne trop précis.
- source_word: ἀπὸ Πτολεμαΐδος ἕως τῶν Γεννήρων
  choice: du territoire allant de Ptolémaïs jusqu’aux Gennères
  rationale: La tournure indique l’étendue du commandement. La forme finale est incertaine; une transcription prudente évite une identification géographique trop assurée.
- source_word: Ἡγεμονίδην
  choice: Hégémonide
  rationale: Transcription française naturelle du nom propre grec.
- source_word: Μακκαβαῖον
  choice: Maccabée
  rationale: Forme française usuelle du nom ou surnom personnel grec.
