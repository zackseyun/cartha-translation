base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/011.yaml
  text: '[they were] about to be deprived of the law and fatherland and holy temple[a], and [he urged them] not to allow the people, who had just now recovered a little[b], to become subject to the reviling nations.'
translation:
  language: fr
  text: '[ils allaient] être privés de la Loi, de leur patrie et du Temple saint, et [il les exhorta] à ne pas laisser le peuple, qui venait tout juste de connaître quelque répit, tomber sous la domination des nations qui proféraient des insultes.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des nations blasphématrices ». Le terme grec peut désigner des paroles injurieuses ou profanes.
    reason: lexical_alternative
lexical_decisions:
- source_word: στερεῖσθαι
  choice: être privés de
  rationale: Exprime directement le fait d’être dépouillés de biens fondamentaux, tout en restant naturel en français.
- source_word: νόμου
  choice: la Loi
  rationale: Dans ce contexte juif, le terme désigne la Loi ancestrale, avec sa portée religieuse et communautaire.
- source_word: πατρίδος
  choice: leur patrie
  rationale: Rend la terre ancestrale et l’appartenance collective; le possessif, implicite dans le rapport au groupe, clarifie naturellement le français.
- source_word: ἱεροῦ ἁγίου
  choice: le Temple saint
  rationale: ἱερόν désigne ici le Temple; la majuscule identifie celui de Jérusalem, et «saint» traduit ἁγίου sans amplification.
- source_word: ἄρτι βραχέως ἀνεψυγμένα
  choice: qui venait à peine de reprendre un peu souffle
  rationale: Conserve à la fois le caractère récent et limité du répit; l’image du souffle reflète le sens de soulagement ou de reprise porté par ἀναψύχω.
- source_word: λαὸν
  choice: le peuple
  rationale: Désigne collectivement le peuple juif et correspond au terme grec sans le réduire à une entité politique.
- source_word: δυσφήμοις ἔθνεσιν
  choice: les nations qui proféraient des insultes
  rationale: Préserve la valeur active de paroles injurieuses ou profanes sans trancher exclusivement en faveur du sens théologique «blasphématoires».
- source_word: ὑποχειρίους γενέσθαι
  choice: tomber sous la domination de
  rationale: Rend clairement l’idée de passer sous le pouvoir d’autrui, avec la force du grec ὑποχείριος.
theological_decisions:
- issue: Supplément des éléments syntaxiques implicites dans ce fragment dépendant du contexte précédent
  choice: Employer «[ils allaient]» et «[il les exhorta]» entre crochets
  alternative: Fondre entièrement le verset dans la syntaxe du verset précédent, ou produire un fragment sans verbes explicités
  rationale: Le grec du verset isolé est constitué de constructions infinitives dépendantes. Les crochets rendent le français intelligible tout en signalant honnêtement les éléments fournis par le contexte.
- issue: Portée de δυσφήμοις
  choice: «qui proféraient des insultes»
  alternative: «blasphématrices», «injurieuses» ou «de mauvais renom»
  rationale: Le mot peut évoquer des propos injurieux, malveillants ou profanes. La traduction retenue garde cette tension sans imposer que l’objet des paroles soit nécessairement Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. La structure coordonnée du grec est conservée, tandis que les verbes fournis par le contexte sont signalés par des crochets. «Reprendre un peu souffle» restitue de façon idiomatique le répit récent et limité du peuple.
