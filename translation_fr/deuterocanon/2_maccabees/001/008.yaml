  text: And they set the gateway on fire and poured out innocent blood; but we prayed to the Lord and were heard. We offered sacrifice and fine flour[a], lit the lamps, and set out the loaves.
translation:
  language: fr
  text: Ils incendièrent le portail et répandirent du sang innocent. Nous avons supplié le Seigneur et nous avons été exaucés. Nous avons offert un sacrifice et de la fleur de farine, nous avons apporté les lampes[a] et disposé les pains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « avons fait sortir les lampes » ou « avons amené dehors les lampes ». Dans ce contexte de reprise du culte, il peut s’agir de les préparer ou de les remettre en service, éventuellement en les allumant.
    reason: Ambiguïté lexicale et contextuelle de ἐξηγάγομεν.
lexical_decisions:
- source_word: ἐνέπυραν
  choice: incendièrent
  rationale: Le verbe exprime le fait de mettre le feu à quelque chose. « Incendièrent » restitue clairement ce sens causatif dans un français naturel.
- source_word: τὸν πυλῶνα
  choice: le portail
  rationale: πυλών désigne une porte monumentale ou l’ensemble architectural d’une entrée. « Portail » conserve cette portée sans préciser indûment une tour ou un porche.
- source_word: ἐξέχεαν αἷμα ἀθῷον
  choice: répandirent du sang innocent
  rationale: Cette formulation garde l’image concrète de l’effusion du sang et l’expression biblique naturelle en français.
- source_word: ἐδεήθημεν τοῦ κυρίου
  choice: nous avons supplié le Seigneur
  rationale: δέομαι marque ici une demande pressante. « Supplié » en exprime mieux l’intensité que le simple « prié », sans surcharge archaïque.
- source_word: εἰσηκούσθημεν
  choice: nous avons été exaucés
  rationale: Le passif indique que la supplication a reçu une réponse favorable. « Être exaucé » est idiomatique en français religieux et conserve la forme passive.
- source_word: προσηνέγκαμεν θυσίαν
  choice: nous avons offert un sacrifice
  rationale: Le syntagme décrit directement l’acte cultuel d’offrir un sacrifice; l’article indéfini est requis par le français courant.
- source_word: σεμίδαλιν
  choice: de la fleur de farine
  rationale: Le terme désigne de la farine de blé très fine employée dans les offrandes. « Fleur de farine » est précis et traditionnel tout en restant intelligible.
- source_word: ἐξηγάγομεν τοὺς λύχνους
  choice: sorti les lampes
  rationale: ἐξάγω signifie littéralement « faire sortir, sortir, amener dehors ». Cette traduction suit le grec sans lui attribuer directement le sens d’« allumer », que le contexte cultuel peut suggérer mais que le verbe n’exprime pas.
- source_word: προεθήκαμεν τοὺς ἄρτους
  choice: disposé les pains
  rationale: Le verbe signifie placer devant ou présenter. « Disposé » évoque naturellement l’arrangement rituel des pains sans ajouter un complément absent du grec.
theological_decisions:
- issue: Traduction de κύριος
  choice: le Seigneur
  alternative: le Maître
  rationale: Dans ce contexte, κύριος désigne le Dieu d’Israël. « Le Seigneur » est la désignation française naturelle et ne suppose pas ici la présence directe du tétragramme dans une source hébraïque.
- issue: Sens de ἐξηγάγομεν dans la séquence cultuelle
  choice: sorti les lampes
  alternative: allumé les lampes
  rationale: Le contexte de restauration du culte peut faire penser à la mise en service ou à l’allumage des lampes, mais le verbe grec signifie proprement les faire sortir. Le texte principal préserve donc l’action explicitement exprimée, tandis que la note signale l’interprétation contextuelle.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsmes. La syntaxe demeure concise et narrative. « Fleur de farine » conserve le vocabulaire cultuel précis; « disposé les pains » évoque le service du sanctuaire sans ajouter « devant Dieu » ou « pains de proposition », expressions absentes du grec.
