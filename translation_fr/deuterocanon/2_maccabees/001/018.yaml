base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/018.yaml
  text: Since we are about to celebrate the purification of the temple on the twenty-fifth of Chasleu[a], we thought it necessary to make this clear to you also, so that you too may celebrate the festival of booths and of the fire, when Nehemiah, after building both the temple and the altar, offered sacrifices.
translation:
  language: fr
  text: Puisque nous allons célébrer la purification du Temple le vingt-cinquième jour de Kasleu, nous avons jugé nécessaire de vous donner ces explications, afin que vous célébriez, vous aussi, la fête des Tentes et celle du feu[a], lorsque Néhémie, après avoir construit le Temple et l’autel, offrit des sacrifices.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et du feu ». Le grec est elliptique et fait probablement allusion à la commémoration racontée dans les versets suivants.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μέλλοντες ἄγειν
  choice: Puisque nous allons célébrer
  rationale: μέλλω avec l’infinitif exprime ici une intention imminente, et ἄγειν, dans un contexte de fête, signifie « célébrer ».
- source_word: ἐν τῷ Χασελεὺ πέμπτῃ καὶ εἰκάδι
  choice: le vingt-cinquième jour de Kasleu
  rationale: La formulation indique le jour et le mois. « Kasleu » translittère directement la forme grecque Χασελεύ tout en restant prononçable en français.
- source_word: τὸν καθαρισμὸν τοῦ ἱεροῦ
  choice: la purification du Temple
  rationale: καθαρισμός signifie « purification » ou « nettoyage rituel »; ἱερόν désigne ici le Temple. La majuscule française identifie clairement le sanctuaire de Jérusalem.
- source_word: δέον ἡγησάμεθα διασαφῆσαι ὑμῖν
  choice: nous avons jugé nécessaire de vous donner ces explications
  rationale: La traduction rend à la fois le jugement exprimé par ἡγησάμεθα, la nécessité de δέον et l’idée d’explication claire portée par διασαφῆσαι.
- source_word: ἵνα καὶ αὐτοὶ ἄγητε
  choice: afin que vous célébriez, vous aussi
  rationale: ἄγητε garde son sens festif, tandis que καὶ αὐτοί souligne que les destinataires doivent eux aussi prendre part à la célébration.
- source_word: σκηνοπηγίας
  choice: la fête des Tentes
  rationale: Cette expression française transparente conserve l’image des huttes ou tentes et désigne naturellement la fête juive correspondante.
- source_word: καὶ τοῦ πυρός
  choice: et celle du feu
  rationale: Le génitif grec est elliptique. « Celle du feu » complète naturellement « la fête » en français, tout en conservant l’allusion sans en préciser abusivement la nature.
- source_word: ὅτε Νεεμίας
  choice: à l’occasion où Néhémie
  rationale: ὅτε introduit l’événement historique commémoré. Cette formulation relie le feu au récit de Néhémie sans faire de la proposition une simple indication chronologique flottante.
- source_word: ὁ οἰκοδομήσας τό τε ἱερὸν καὶ τὸ θυσιαστήριον
  choice: après avoir construit le Temple et l’autel
  rationale: Le participe aoriste peut exprimer une action antérieure à l’offrande; cette traduction rend clairement cette relation naturelle.
- source_word: ἀνήνεγκεν θυσίας
  choice: offrit des sacrifices
  rationale: ἀναφέρω est employé dans son sens cultuel d’offrir un sacrifice.
theological_decisions:
- issue: Identification de σκηνοπηγίας
  choice: la fête des Tentes
  alternative: la fête des Huttes; les Tabernacles
  rationale: Le choix garde l’imagerie juive compréhensible en français moderne sans imposer une terminologie ecclésiastique traditionnelle.
- issue: Interprétation de καὶ τοῦ πυρός
  choice: et celle du feu
  alternative: et du feu; et la fête du feu
  rationale: Le grec reste elliptique et allusif. Le texte principal explicite seulement l’ellipse grammaticale requise en français; la note signale la traduction plus littérale et évite de définir avec certitude la nature de cette célébration.
- issue: Rapport temporel du participe ὁ οἰκοδομήσας
  choice: après avoir construit
  alternative: qui construisit; ayant construit
  rationale: L’aoriste participial se comprend naturellement comme antérieur à l’offrande, mais il décrit aussi Néhémie. Le choix exprime la séquence la plus probable sans ajouter de contenu doctrinal.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe épistolaire est conservée sans lourdeur excessive; les termes cultuels restent précis, et l’ellipse grecque concernant le feu est signalée en note.
