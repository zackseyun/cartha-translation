base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/021.yaml
  text: When they reported to us that they had found no fire[a], but thick water, he ordered them to draw some out and bring it. Then, when the things for the sacrifices had been brought forward[b], Nehemiah ordered the priests to sprinkle the water on both the wood and what was laid on it.
translation:
  language: fr
  text: Lorsqu’ils nous eurent fait savoir qu’ils n’avaient pas trouvé de feu, mais une eau épaisse[a], il leur ordonna d’en puiser et de l’apporter. Une fois qu’on eut apporté ce qui était destiné aux sacrifices[b], Néhémie ordonna aux prêtres de répandre cette eau sur le bois et sur ce qui était posé dessus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une eau dense » ou « un liquide épais ». L’expression grecque est inhabituelle; elle est rendue de manière assez littérale parce que le récit repose sur le caractère inattendu de cette substance.
    reason: lexical_alternative
  - marker: b
    text: Le grec dit littéralement « ce qui relevait des sacrifices », expression elliptique désignant les éléments ou le matériel liés aux offrandes sacrificielles.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεσάφησαν
  choice: eurent fait savoir
  rationale: Le verbe exprime l’idée de faire connaître clairement ou de rapporter; cette tournure convient à un récit soutenu sans ajouter un adverbe absent.
- source_word: μὴ εὑρηκέναι πῦρ ἀλλὰ ὕδωρ παχύ
  choice: n’avaient pas trouvé de feu, mais une eau épaisse
  rationale: La traduction conserve le contraste et le caractère insolite de ὕδωρ παχύ, déterminant pour la suite du récit.
- source_word: ἀποβλίψαντας
  choice: d’en puiser
  rationale: Dans le contexte, le participe désigne le prélèvement d’une certaine quantité de liquide dans le lieu où il a été trouvé.
- source_word: ἀνηνέχθη τὰ τῶν θυσιῶν
  choice: on eut apporté ce qui était destiné aux sacrifices
  rationale: Cette formulation naturelle garde l’indétermination de l’expression grecque elliptique sans la réduire aux seules offrandes.
- source_word: ἐπιρᾶναι
  choice: répandre cette eau sur
  rationale: Le verbe indique l’application du liquide sur le bois et ce qui le recouvre; « répandre sur » préserve mieux la neutralité quant à la manière et à la quantité que « asperger ».
- source_word: τά τε ξύλα καὶ τὰ ἐπικείμενα
  choice: sur le bois et sur ce qui était posé dessus
  rationale: La formulation reproduit la généralité du grec sans préciser que les objets posés sur le bois seraient des morceaux particuliers du sacrifice.
theological_decisions:
- issue: Identification de Νεεμίας
  choice: Néhémie
  alternative: Néhémias
  rationale: « Néhémie » est la forme française usuelle du nom biblique et facilite son identification; il s’agit d’une convention onomastique, non d’une interprétation doctrinale.
