base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/033.yaml
  text: But when the matter became known and it was reported to the king of the Persians that[a], in the place where the priests who had been taken away had hidden the fire, water had appeared, from which also those with Nehemiah purified the sacrifices[c][b],
translation:
  language: fr
  text: Mais lorsque l’affaire fut connue et qu’on rapporta au roi des Perses que, à l’endroit où les prêtres déportés[a] avaient caché le feu, de l’eau était apparue et qu’avec cette eau[c] les compagnons de Néhémie[b] avaient aussi purifié les sacrifices,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les prêtres qui avaient été emmenés ». Il s’agit vraisemblablement de leur déportation en exil.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ceux qui entouraient Néhémie », expression désignant le groupe associé à lui.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « à partir de laquelle » ou « dont ». Le relatif renvoie vraisemblablement à l’eau apparue et indique qu’elle a servi à la purification des sacrifices.'
    reason: cross_reference
lexical_decisions:
- source_word: φανερὸν ἐγενήθη τὸ πρᾶγμα
  choice: l’affaire fut connue
  rationale: Rend naturellement le fait que l’événement est devenu manifeste ou public, sans suggérer seulement une compréhension intellectuelle.
- source_word: διηγήθη τῷ βασιλεῖ τῶν Περσῶν
  choice: on rapporta au roi des Perses
  rationale: Le tour impersonnel français exprime clairement le passif grec et conserve la formulation complète du titre.
- source_word: οἱ μεταχθέντες ἱερεῖς
  choice: les prêtres déportés
  rationale: Le participe désigne des prêtres emmenés hors de leur pays; « déportés » est précis et naturel dans ce contexte d’exil.
- source_word: τὸ πῦρ ἔκρυψαν
  choice: avaient caché le feu
  rationale: Le plus-que-parfait marque l’antériorité de l’action par rapport à l’apparition de l’eau.
- source_word: τὸ ὕδωρ ἐφάνη
  choice: de l’eau était apparue
  rationale: Préserve le contraste narratif entre le feu caché et l’eau apparue.
- source_word: ἀφ' οὗ
  choice: avec cette eau
  rationale: Explicite en français le référent naturel, l’eau, et sa fonction instrumentale, tout en signalant l’alternative littérale en note.
- source_word: οἱ περὶ τὸν Νεεμίαν
  choice: les compagnons de Néhémie
  rationale: Rend idiomatiquement le groupe associé à Néhémie sans employer le calque peu naturel « ceux autour de Néhémie ».
- source_word: ἥγνισαν τὰς θυσίας
  choice: avaient aussi purifié les sacrifices
  rationale: Conserve le sens rituel du verbe et la portée cultuelle de θυσίαι; le plus-que-parfait s’intègre au discours rapporté.
theological_decisions:
- issue: Sens cultuel de ἥγνισαν τὰς θυσίας
  choice: purifié les sacrifices
  alternative: consacré les sacrifices
  rationale: « Purifié » conserve directement l’idée de purification rituelle sans introduire une catégorie théologique plus précise que le grec.
- issue: Référent de ἀφ' οὗ
  choice: l’eau comme moyen de purification
  alternative: l’événement dans son ensemble, au sens de « après quoi »
  rationale: Le relatif singulier a pour antécédent le plus proche τὸ ὕδωρ, et le déroulement du récit indique que cette eau a servi à purifier les sacrifices.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste ouverte par une virgule, car la syntaxe grecque se poursuit au verset suivant. Les marqueurs [a] et [b] figurent dans le texte dans l’ordre de leur apparition.
