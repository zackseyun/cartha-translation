  source_fidelity: 'Le texte rend fidèlement la progression grecque : l’affaire devient publique, elle est rapportée au roi des Perses, de l’eau apparaît à l’endroit du feu caché, puis le groupe de Néhémie purifie les sacrifices au moyen de cette eau. « Avec cette eau » explicite de façon recevable l’antécédent le plus proche de ἀφ’ οὗ, mais cette explicitation mérite une note, car le grec conserve une formulation relative plus ouverte.'
