  - severity: low
    issue: Formule chronologique française
    rationale: « La cent soixante-neuvième année » après une virgule est compréhensible mais elliptique; l’ajout de « en l’an » rend la date naturelle.
  - severity: low
    issue: Interprétation de οἱ μετʼ αὐτοῦ
    rationale: « Ses partisans » suggère une adhésion militante ou politique qui n’est pas explicitement énoncée. « Ceux qui étaient avec lui » est plus fidèle et conserve l’ouverture du texte.
