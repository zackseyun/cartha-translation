base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/007.yaml
  text: In the reign of Demetrius[a], in the one hundred sixty-ninth year, we Jews wrote to you in the distress and in the crisis that came upon us in those years[c][b], after Jason and those with him departed from the holy land and the kingdom.
translation:
  language: fr
  text: Sous le règne de Démétrios, en l’an cent soixante-neuf, nous, les Juifs, vous avons écrit[a] dans la détresse et dans la crise[b] qui nous est survenue durant ces années, depuis que Jason et ceux qui étaient avec lui se sont séparés[c] de la terre sainte et du royaume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « nous vous écrivons » : le parfait grec peut avoir une valeur épistolaire.'
    reason: lexical_alternative
  - marker: b
    text: Ou « au plus fort de l’épreuve »; le terme grec désigne le point aigu ou culminant d’une situation.
    reason: lexical_alternative
  - marker: c
    text: Ou « ont fait défection », « se sont révoltés » ou « ont apostasié »; le verbe grec peut avoir des connotations aussi bien politiques que religieuses. « Royaume » peut aussi désigner ici la royauté ou le pouvoir royal.
    reason: alternative_reading
lexical_decisions:
- source_word: βασιλεύοντος Δημητρίου
  choice: Sous le règne de Démétrios
  rationale: Rend naturellement en français la construction absolue qui situe la lettre sous un règne donné.
- source_word: ἔτους ἑκατοστοῦ ἑξηκοστοῦ ἐνάτου
  choice: la cent soixante-neuvième année
  rationale: Conserve la formule chronologique solennelle et le nombre ordinal du grec.
- source_word: ἡμεῖς οἱ Ἰουδαῖοι
  choice: nous, les Juifs
  rationale: Reproduit l’apposition emphatique tout en restant idiomatique en français moderne.
- source_word: γεγράφαμεν
  choice: vous avons écrit
  rationale: Le passé composé rend directement le parfait grec et convient à l’évocation d’une lettre antérieure, sans exclure une nuance épistolaire.
- source_word: ἐν τῇ θλίψει καὶ ἐν τῇ ἀκμῇ
  choice: au milieu de la détresse et de la crise
  rationale: « Détresse » exprime la grave affliction; « crise » rend le point aigu ou culminant suggéré par ἀκμή, dont la nuance est signalée en note.
- source_word: τῇ ἐπελθούσῃ ἡμῖν
  choice: qui nous ont frappés
  rationale: Exprime avec naturel l’irruption d’une adversité sur la communauté. Le pluriel français reprend ensemble la détresse et la crise coordonnées.
- source_word: ἐν τοῖς ἔτεσιν τούτοις
  choice: durant ces années
  rationale: Suit le démonstratif grec et indique clairement une période prolongée.
- source_word: ἀφʼ οὗ
  choice: depuis que
  rationale: Marque le point de départ temporel des événements, plus précisément que le simple « après ».
- source_word: Ἰάσων καὶ οἱ μετʼ αὐτοῦ
  choice: Jason et ses partisans
  rationale: Formulation française concise pour le chef et ceux qui se rangent avec lui; « ceux qui étaient avec lui » resterait possible.
- source_word: ἀπέστη ... ἀπό
  choice: se sont détachés de
  rationale: Préserve l’idée de rupture ou de défection sans décider si celle-ci est avant tout politique, religieuse ou géographique.
- source_word: τῆς ἁγίας γῆς καὶ τῆς βασιλείας
  choice: de la terre sainte et du royaume
  rationale: Traduction formelle qui maintient les deux réalités coordonnées et leur portée potentiellement politique et religieuse.
theological_decisions:
- issue: Portée de ἀπέστη appliqué à Jason et à ses partisans
  choice: se sont détachés
  alternative: ont fait défection; se sont révoltés; ont apostasié; se sont éloignés
  rationale: Le verbe peut évoquer à la fois une rupture politique et une infidélité religieuse. « Se sont détachés » maintient cette tension et évite de réduire le propos à une apostasie exclusivement religieuse ou à un simple déplacement.
- issue: Sens de βασιλεία
  choice: royaume
  alternative: royauté; pouvoir royal
  rationale: « Royaume » est le sens courant et concret, mais le grec peut aussi viser l’autorité royale; cette possibilité est conservée en note.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve le caractère épistolaire et chronologique du passage. Les termes « crise » et « se sont détachés » évitent de trancher des ambiguïtés réelles du grec, explicitées dans les notes.
