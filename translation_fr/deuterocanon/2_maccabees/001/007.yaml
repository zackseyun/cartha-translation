  verdict: revise
  source_fidelity: La relative grecque τῇ ἐπελθούσῃ est au singulier et qualifie directement ἀκμῇ (« crise / phase aiguë »), non l’ensemble coordonné « détresse et crise ». La version proposée au pluriel (« qui nous ont frappés ») élargit donc légèrement le référent. Le rendu de ἀπέστη par « se sont détachés » est possible, mais « ses partisans » interprète plus fortement οἱ μετʼ αὐτοῦ que ne le fait « ceux qui étaient avec lui ».
  naturalness: Le français est globalement clair et de registre approprié. Toutefois, « Sous le règne de Démétrios, la cent soixante-neuvième année » est une formule de date elliptique et peu naturelle en français moderne. « Sous le règne de Démétrios, en l’an cent soixante-neuf » est plus idiomatique tout en gardant le ton solennel.
  terminology: « Détresse », « crise », « terre sainte » et « royaume » conviennent. « Ceux qui étaient avec lui » respecte l’indétermination du grec. « Se sont séparés de » conserve une rupture grave sans imposer exclusivement une lecture de révolte politique ou d’apostasie religieuse; les possibilités restent documentées en note.
