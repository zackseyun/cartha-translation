  text: And when the priests of Nanea had set these things out[a], and he had come with a few men into the enclosure of the temple precinct, they shut the temple as soon as Antiochus entered.
translation:
  language: fr
  text: Les prêtres de Nanaia[a] ayant disposé ces choses, et Antiochos s’étant avancé avec quelques hommes dans l’enceinte du domaine sacré, ils fermèrent le temple dès qu’il y fut entré.
  philosophy: optimal-equivalence
