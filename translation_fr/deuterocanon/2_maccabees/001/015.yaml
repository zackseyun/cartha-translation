lexical_decisions:
- source_word: προθεμένων
  choice: ayant disposé
  rationale: Le participe aoriste de προτίθημι décrit ici l’action de placer ou de présenter les objets évoqués par le contexte. « Disposé » reste concret sans préciser indûment leur nature.
- source_word: αὐτά
  choice: ces choses
  rationale: Le pronom ne reprend aucun nom explicite dans ce verset. « Ces choses » conserve cette indétermination au lieu d’introduire des offrandes ou des trésors dans le texte.
- source_word: τῶν ἱερέων τοῦ Ναναίου
  choice: les prêtres de Nanaia
  rationale: Le génitif désigne naturellement les prêtres attachés à la divinité Nanaia. Cette graphie est courante en français et reste proche du nom grec.
- source_word: κἀκεῖνον προσελθόντος
  choice: celui-ci s’étant avancé
  rationale: κἀκεῖνον représente καὶ ἐκεῖνον et renvoie à Antiochos, nommé à la fin de la proposition. « Celui-ci » préserve ce renvoi sans anticiper le nom, tandis que « s’étant avancé » exprime son mouvement jusque dans l’enceinte.
- source_word: μετʼ ὀλίγων
  choice: avec quelques hommes
  rationale: Le grec dit littéralement « avec quelques-uns ». L’ajout de « hommes », naturellement implicite dans le contexte d’une petite suite, rend l’expression idiomatique en français.
- source_word: περίβολον τοῦ τεμένους
  choice: l’enceinte du domaine sacré
  rationale: περίβολος désigne un espace délimité ou clos, et τέμενος un domaine consacré. Ce rendu conserve les deux éléments spatiaux et les distingue de ἱερόν dans la suite.
- source_word: συγκλείσαντες τὸ ἱερόν
  choice: ils fermèrent le temple
  rationale: συγκλείω exprime l’action de fermer complètement, tandis que ἱερόν désigne ici le temple. La formulation française traduit clairement l’action par laquelle Antiochos est enfermé.
- source_word: ὡς εἰσῆλθεν Ἀντίοχος
  choice: dès qu’Antiochos y fut entré
  rationale: ὡς suivi de l’aoriste a ici une valeur temporelle immédiate. « Dès que » rend cette succession rapide, et « y » reprend naturellement le temple.
- source_word: Ἀντίοχος
  choice: Antiochos
  rationale: « Antiochos » est la translittération française usuelle du nom grec.
