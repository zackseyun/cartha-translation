  text: and open your heart in his law and in the commandments[a], and bring about peace;
translation:
  language: fr
  text: qu’il ouvre votre cœur à sa Loi et à ses commandements[a], et qu’il établisse la paix ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans sa Loi et dans les commandements ». Les infinitifs grecs prolongent la prière du verset précédent : « qu’il ouvre… et qu’il établisse… »'
    reason: Précision sur la formulation littérale et sur la dépendance syntaxique au verset précédent.
lexical_decisions:
- source_word: διανοίξαι
  choice: qu’il ouvre
  rationale: L’infinitif aoriste prolonge la prière du verset précédent. La tournure française avec « qu’il » rend cette dépendance naturellement et conserve la métaphore de l’ouverture intérieure.
- source_word: καρδίαν
  choice: votre cœur
  rationale: « Cœur » préserve l’image biblique de la personne intérieure, comprenant la volonté et l’intelligence, sans la réduire au seul esprit.
- source_word: ἐν τῷ νόμῳ αὐτοῦ
  choice: à sa Loi
  rationale: Avec « ouvrir le cœur », le français idiomatique emploie « à ». Cette formulation exprime la réceptivité à la Loi, là où une traduction littérale par « dans » serait obscure en français moderne.
- source_word: προστάγμασιν
  choice: ses commandements
  rationale: Le terme désigne ce qui est prescrit ou ordonné. « Commandements » est clair, courant et approprié au contexte religieux. Le possessif est repris naturellement du contexte de « sa Loi ».
- source_word: εἰρήνην
  choice: la paix
  rationale: « Paix » conserve la portée communautaire et religieuse du grec sans la réduire à un sentiment intérieur.
- source_word: ποιῆσαι
  choice: qu’il fasse régner
  rationale: Le verbe signifie littéralement « faire ». Avec « la paix », « faire régner » exprime naturellement en français l’action divine qui établit ou produit la paix, sans la ramener uniquement à une réconciliation entre adversaires.
theological_decisions:
- issue: Sujet implicite et valeur de prière hérités du verset précédent
  choice: Expliciter « qu’il » devant chacun des deux verbes afin de rendre en français la continuation de la prière.
  alternative: Conserver des infinitifs coordonnés, ou ne faire apparaître « qu’il » qu’au début de la proposition.
  rationale: Les infinitifs grecs dépendent de la prière formulée au verset précédent. Le français exige ici une construction verbale explicite pour que le verset isolé reste intelligible, sans modifier l’agent divin sous-entendu.
- issue: Valeur de ἐν avec l’ouverture du cœur
  choice: Traduire idiomatiquement par « à sa Loi et à ses commandements ».
  alternative: « dans sa Loi et dans les commandements »
  rationale: Le grec peut présenter la Loi comme la sphère dans laquelle le cœur est ouvert, mais la construction littérale serait peu naturelle et ambiguë en français. « Ouvrir le cœur à » conserve l’idée essentielle de réceptivité sans imposer une interprétation doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. La majuscule à « Loi » signale ici la Loi divine dans son sens biblique. La répétition de « qu’il » clarifie la syntaxe de prière lorsque le verset est lu isolément.
