  text: For he himself drove those arrayed for battle in the holy city out into Persia[a][b].
translation:
  language: fr
  text: Car c’est lui-même qui a chassé[a] en Perse ceux qui s’étaient rangés en ordre de bataille[b] dans la ville sainte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « expulsé » ; le verbe grec est énergique et évoque une expulsion décisive.
    reason: lexical_alternative
  - marker: b
    text: Ou « ceux qui s’étaient déployés pour le combat » ; le participe grec est un terme militaire désignant des personnes disposées en formation de combat.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: c’est lui-même qui
  rationale: La tournure emphatique restitue l’insistance du pronom grec sur l’agent sans préciser son identité au-delà du contexte immédiat.
- source_word: γὰρ
  choice: Car
  rationale: « Car » conserve la valeur explicative qui relie cette affirmation à ce qui précède.
- source_word: ἐξέβρασεν
  choice: a chassé
  rationale: Le verbe exprime une expulsion énergique et décisive. « Chasser » est naturel en français et garde cette force.
- source_word: τοὺς παρατασσομένους
  choice: ceux qui s’étaient rangés en ordre de bataille
  rationale: Le participe désigne des personnes disposées en formation militaire; cette formulation explicite ce sens sans les désigner plus précisément comme soldats ou ennemis.
- source_word: ἐν τῇ ἁγίᾳ πόλει
  choice: dans la ville sainte
  rationale: Cette traduction directe conserve à la fois la valeur locative et la désignation sacrée de la ville.
- source_word: εἰς τὴν Περσίδα
  choice: en Perse
  rationale: Avec « chasser », « en Perse » exprime naturellement le mouvement vers ce territoire indiqué par εἰς.
theological_decisions:
- issue: Insistance sur l’agent de l’expulsion
  choice: « c’est lui-même qui »
  alternative: « il »
  rationale: Le grec souligne l’action personnelle du sujet. La traduction préserve cette emphase sans ajouter d’identification ou d’interprétation théologique étrangère au verset.
translation_notes:
  register: Français international moderne, digne et accessible. La construction clivée rend l’emphase grecque de manière naturelle; le vocabulaire militaire reste précis sans devenir technique.
