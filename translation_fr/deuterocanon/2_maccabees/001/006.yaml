lexical_decisions:
- source_word: Καὶ νῦν
  choice: Et maintenant
  rationale: Rend directement le lien καί et la valeur temporelle de νῦν dans un français naturel.
- source_word: ὧδε
  choice: ici
  rationale: Le contexte favorise le sens local de l’adverbe, sans développer le grec en « dans ce lieu ».
- source_word: ἐσμεν
  choice: nous sommes
  rationale: Conserve la copule simple, sans lui ajouter l’idée de rester ou de se trouver.
- source_word: προσευχόμενοι
  choice: priant
  rationale: Le participe présent exprime une action en cours qui accompagne « nous sommes »; cette tournure préserve la structure concise du grec.
- source_word: περὶ ὑμῶν
  choice: pour vous
  rationale: Avec le verbe prier, περί suivi du génitif se rend naturellement par « pour », au sens de prier en faveur des destinataires.
