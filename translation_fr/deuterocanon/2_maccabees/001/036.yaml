  text: And the men around Nehemiah called this Nephthar[a], which is translated “Purification”; but by most people it is called Nephi.
translation:
  language: fr
  text: Les compagnons de Néhémie appelèrent cela « Nephthar », ce qui se traduit par « Purification » ; mais la plupart des gens l’appellent « Nephthi ».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσηγόρευσαν
  choice: appelèrent
  rationale: Le verbe signifie ici donner un nom ou une désignation ; « appelèrent » est naturel et fidèle.
- source_word: οἱ περὶ τὸν Νεεμίαν
  choice: ceux qui entouraient Néhémie
  rationale: Cette tournure conserve l’idiome grec tout en désignant naturellement les compagnons ou l’entourage de Néhémie.
- source_word: τοῦτο
  choice: cela
  rationale: Le démonstratif renvoie à la substance mentionnée dans le contexte précédent sans préciser davantage sa nature.
- source_word: Νεφθάρ
  choice: Nephthar
  rationale: La désignation est translittérée au plus près de la forme grecque.
- source_word: διερμηνεύεται
  choice: se traduit par
  rationale: Le verbe introduit explicitement l’explication grecque du terme étranger ; cette formulation reste proche du sens et naturelle en français.
- source_word: Καθαρισμός
  choice: Purification
  rationale: Le nom désigne l’action de purifier et peut porter une nuance rituelle ; « Purification » en conserve la forme nominale.
- source_word: καλεῖται
  choice: l’appellent
  rationale: La tournure active indéfinie est idiomatique en français et rend clairement la désignation d’usage.
- source_word: παρὰ τοῖς πολλοῖς
  choice: la plupart des gens
  rationale: L’expression indique l’usage répandu parmi la majorité.
- source_word: Νεφθί
  choice: Nephthi
  rationale: Cette translittération représente directement les consonnes et la finale de Νεφθί en français.
