  text: And now[b][a], celebrate the days of the Festival of Booths in the month of Chislev.
translation:
  language: fr
  text: Et maintenant, célébrez les jours de la fête des Tentes[a], au mois de Kislev[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, selon l’appellation traditionnelle, « fête des Tabernacles ».
    reason: lexical_alternative
  - marker: b
    text: Dans le calendrier juif, le mois de Kislev correspond approximativement à novembre-décembre.
    reason: cultural_note
lexical_decisions:
- source_word: ἄγητε
  choice: célébrez
  rationale: Dans l’expression idiomatique formée avec ἡμέρας, ἄγω signifie observer ou célébrer des jours de fête, et non les « conduire » au sens littéral.
- source_word: τὰς ἡμέρας
  choice: les jours
  rationale: Cette traduction directe conserve l’accent temporel du grec et reste naturelle avec le verbe « célébrer ».
- source_word: τῆς σκηνοπηγίας
  choice: de la fête des Tentes
  rationale: Le nom désigne la fête juive des huttes ou des tentes. « Fête des Tentes » en exprime clairement le sens en français moderne tout en identifiant la célébration.
- source_word: τοῦ Χασελεὺ μηνός
  choice: au mois de Kislev
  rationale: Le français exprime naturellement cette relation par « au mois de ». « Kislev » est la forme française usuelle du nom du mois correspondant au grec Χασελεύ.
theological_decisions:
- issue: Désignation de la fête σκηνοπηγία
  choice: fête des Tentes
  alternative: fête des Tabernacles
  rationale: « Fête des Tentes » rend le sens concret du terme grec de manière transparente. La formulation traditionnelle « fête des Tabernacles » est conservée en note sans imposer une terminologie confessionnelle.
translation_notes:
  register: Français international moderne, naturel et digne. L’exhortation elliptique καὶ νῦν ἵνα ἄγητε est rendue par un impératif français clair, sans alourdir la phrase.
