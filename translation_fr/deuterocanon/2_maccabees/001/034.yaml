  text: Then the king enclosed it and made it sacred[a], after testing the matter.
translation:
  language: fr
  text: Alors, après avoir vérifié l’affaire, le roi l’entoura d’une enceinte et le rendit sacré[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en fit un sanctuaire ». Le grec peut se comprendre soit au sens attributif (« le rendit sacré »), soit au sens substantivé (« en fit un sanctuaire »).'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιφράξας
  choice: l’entoura d’une enceinte
  rationale: Exprime concrètement l’action de délimiter et de fermer tout autour, sans préciser indûment s’il s’agissait d’un mur ou d’une clôture.
- source_word: ἱερὸν
  choice: sacré
  rationale: Pris comme attribut du complément de ἐποίησεν, le terme indique que le roi rendit sacré ce qui avait été entouré, sans nécessairement parler de la construction d’un temple.
- source_word: ἐποίησεν
  choice: rendit
  rationale: Avec l’attribut « sacré », « rendit » est l’expression française naturelle correspondant à l’idée de faire devenir.
- source_word: δοκιμάσας
  choice: après avoir vérifié
  rationale: Le participe aoriste marque ici une action antérieure; « vérifier » rend l’idée d’examiner et de reconnaître comme avéré.
- source_word: τὸ πρᾶγμα
  choice: la chose
  rationale: Conserve la désignation générale du grec, qui renvoie au phénomène ou au fait dont il vient d’être question.
theological_decisions:
- issue: Sens de ἱερὸν en rapport avec le lieu
  choice: 'Attribut adjectival : le roi rendit sacré ce qui avait été entouré.'
  alternative: 'Emploi substantivé : le roi en fit un sanctuaire.'
  rationale: L’absence d’article et la construction avec ἐποίησεν permettent naturellement la lecture attributive. L’ambiguïté réelle est toutefois signalée en note afin de ne pas exclure la lecture substantivée.
translation_notes:
  register: Français international moderne, sobre et digne. « Alors » assure la continuité narrative; « l’entoura d’une enceinte » reste concret sans déterminer la nature exacte de l’installation. L’ambiguïté syntaxique de ἱερόν est préservée par une note.
