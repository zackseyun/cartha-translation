base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/024.yaml
  text: 'And the prayer was in this form: “Lord God[a], creator of all things, the awesome and mighty and righteous and merciful one[b], the only king and good one,”'
translation:
  language: fr
  text: 'La prière était formulée ainsi : « Seigneur Dieu, créateur de toutes choses, toi qui inspires la crainte[a], toi qui es puissant, juste et miséricordieux, toi le seul roi, toi qui es bon[b], »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toi qui es redoutable ». Le grec désigne celui qui inspire la crainte, l’effroi ou un profond respect.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « toi qui es bienveillant ». Le grec χρηστός peut exprimer la bonté, la bienveillance ou la bonté agissante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ ἡ προσευχὴ τὸν τρόπον ἔχουσα τοῦτον
  choice: La prière était formulée ainsi
  rationale: Cette formulation française rend naturellement l’expression grecque qui introduit la forme ou la teneur de la prière.
- source_word: Κύριε ὁ θεός
  choice: Seigneur Dieu
  rationale: L’adresse vocative est rendue directement, sans interjection archaïsante.
- source_word: ὁ πάντων κτίστης
  choice: créateur de toutes choses
  rationale: « Créateur » rend κτίστης, tandis que « de toutes choses » explicite naturellement la portée universelle de πάντων.
- source_word: ὁ φοβερὸς
  choice: toi qui inspires la crainte
  rationale: 'Cette expression évite l’ambiguïté moderne de « craintif » et rend le sens actif de φοβερός : celui qui suscite la crainte ou l’effroi révérenciel.'
- source_word: ὁ ἰσχυρὸς
  choice: toi qui es puissant
  rationale: « Puissant » convient au langage de louange divine et rend clairement la force exprimée par ἰσχυρός.
- source_word: δίκαιος
  choice: juste
  rationale: « Juste » est le terme français courant et précis pour la droiture morale et judiciaire attribuée à Dieu.
- source_word: ἐλεήμων
  choice: miséricordieux
  rationale: Ce terme traditionnel demeure clair en français moderne et exprime la disposition à faire miséricorde.
- source_word: ὁ μόνος βασιλεὺς
  choice: toi le seul roi
  rationale: La formulation conserve sans l’atténuer l’exclusivité exprimée par μόνος.
- source_word: χρηστός
  choice: toi qui es bon
  rationale: « Bon » garde l’étendue sémantique de χρηστός, qui peut aussi évoquer la bonté bienveillante, sans la réduire à la seule gentillesse.
theological_decisions:
- issue: Valeur de κύριος dans l’adresse d’une prière juive
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur Dieu » est l’équivalent français naturel de Κύριε ὁ θεός dans une adresse liturgique et ne surcharge pas le texte.
- issue: Exclusivité exprimée par μόνος βασιλεὺς
  choice: le seul roi
  alternative: l’unique roi
  rationale: « Le seul roi » préserve directement l’affirmation de la royauté exclusive de Dieu, sans développement interprétatif.
- issue: Portée de φοβερός comme attribut divin
  choice: toi qui inspires la crainte
  alternative: toi qui es redoutable
  rationale: Le choix principal conserve l’idée que Dieu suscite la crainte ou l’effroi révérenciel, sans décider si le contexte privilégie la terreur ou l’émerveillement respectueux.
translation_notes:
  register: Français international moderne, digne et adapté à la prière. La répétition de « toi » restitue la série grecque d’attributs articulés tout en gardant une syntaxe française claire. La virgule finale signale que la prière se poursuit au verset suivant.
