  text: And from those men the king received many different gifts[a], and distributed them.
translation:
  language: fr
  text: Et le roi recevait d’eux de nombreux présents de toutes sortes[a], puis il les distribuait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de nombreuses choses diverses ». Le grec ne précise pas l’objet; « présents » est ajouté d’après le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς
  choice: d’eux
  rationale: Le pronom relatif renvoie aux personnes mentionnées dans le contexte. Avec ἐλάμβανεν, le français naturel exprime la provenance par « d’eux ».
- source_word: πολλὰ διάφορα
  choice: de nombreux présents de toutes sortes
  rationale: Le grec signifie littéralement « de nombreuses choses diverses » sans nommer l’objet. « Présents » est suppléé d’après le contexte, tandis que « de toutes sortes » rend la diversité exprimée par διάφορα.
- source_word: ἐλάμβανεν
  choice: recevait
  rationale: « Recevait » rend naturellement λαμβάνω dans ce contexte et conserve l’aspect imperfectif du verbe grec.
- source_word: μετεδίδου
  choice: les distribuait
  rationale: Le verbe μεταδίδωμι indique que le roi donnait à d’autres une part de ce qu’il avait reçu. « Distribuait » en rend clairement le sens et l’imparfait grec.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Les imparfaits rendent les deux formes verbales grecques à l’imparfait; « puis » explicite sobrement la succession des actions suggérée par καί.
