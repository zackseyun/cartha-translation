  naturalness: Les deux passés antérieurs coordonnés (« se fut produit » / « se fut écoulé ») alourdissent inutilement le récit en français moderne. Une formulation narrative plus directe conserve la succession des faits. « Alors » n’est pas nécessaire, puisque le grec enchaîne directement le soleil qui brille et l’embrasement.
