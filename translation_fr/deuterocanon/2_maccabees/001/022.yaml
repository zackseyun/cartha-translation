  text: And when this happened and some time had passed[a], and the sun shone out though it was clouded over, a great fire was kindled, so that everyone marveled.
translation:
  language: fr
  text: Après cela, quelque temps passa, et le soleil se mit à briller malgré les nuages[a] ; un grand feu s’alluma, de sorte que tous furent étonnés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « tandis que le ciel était couvert ». L’expression grecque décrit des conditions nuageuses ; dans le contexte, elle peut être comprise comme concessive : le soleil brillait malgré les nuages.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο
  choice: Quand cela se fut produit
  rationale: Rend naturellement la transition temporelle et événementielle sans reproduire servilement une formule grecque.
- source_word: χρόνος διῆλθεν
  choice: qu’un certain temps se fut écoulé
  rationale: Exprime une durée indéterminée et respecte l’antériorité narrative.
- source_word: ὅ τε ἥλιος ἀνέλαμψεν
  choice: le soleil se mit à briller
  rationale: ἀναλάμπω indique que le soleil commence à briller ou brille soudainement; cette tournure est naturelle en français moderne.
- source_word: ἐπινεφὴς ὤν
  choice: malgré les nuages
  rationale: Rend la circonstance nuageuse avec une valeur concessive vraisemblable dans le contexte, tout en signalant l’autre analyse possible en note.
- source_word: ἀνήφθη
  choice: s’alluma
  rationale: Le passif grec désigne l’embrasement du feu; le pronominal français est idiomatique sans préciser d’agent.
- source_word: πυρὰ μεγάλη
  choice: un grand feu
  rationale: Traduction directe de πυρά et μεγάλη, convenant au caractère remarquable de la scène.
- source_word: ὥστε θαυμάσαι πάντας
  choice: si bien que tous furent émerveillés
  rationale: Reproduit clairement la conséquence et conserve la portée universelle de πάντας.
