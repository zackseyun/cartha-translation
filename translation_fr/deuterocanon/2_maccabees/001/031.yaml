  yaml_path: translation/deuterocanon/2_maccabees/001/031.yaml
  text: And when the things of the sacrifice had been consumed[a], Nehemiah ordered the remaining water to be poured on larger stones.
translation:
  language: fr
  text: Lorsque les éléments du sacrifice eurent été consumés[a], Néhémie ordonna de verser l’eau restante sur des pierres plus grosses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « les choses du sacrifice » ; l’expression grecque, au pluriel, désigne les éléments liés au sacrifice plutôt que le seul rite considéré comme un événement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνηλώθη
  choice: eut été consumé
  rationale: L’aoriste passif exprime ici l’achèvement de la consommation des éléments sacrificiels, dans le contexte du feu, sans préciser davantage le mécanisme.
- source_word: τὰ τῆς θυσίας
  choice: tout ce qui concernait le sacrifice
  rationale: Le neutre pluriel substantivé avec génitif désigne plus largement ce qui appartenait au sacrifice, plutôt que le sacrifice envisagé comme seul événement. Cette formulation reste naturelle en français.
- source_word: τὸ περιλειπόμενον ὕδωρ
  choice: l’eau qui restait
  rationale: Rend simplement et naturellement le participe désignant l’eau demeurée après l’action précédente.
- source_word: ἐκέλευσεν
  choice: ordonna
  rationale: Le verbe indique une directive donnée avec autorité et convient au rôle de Néhémie dans le récit.
- source_word: λίθους μείζονας
  choice: de plus grosses pierres
  rationale: Le comparatif μείζονας porte ici sur la taille. « Plus grosses » est idiomatique pour des pierres et conserve la valeur comparative.
- source_word: καταχεῖν
  choice: de verser … sur
  rationale: L’infinitif signifie verser sur ou par-dessus. La construction française avec « ordonna de » est fluide tout en laissant implicites les exécutants, comme le grec.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le passé antérieur marque clairement l’antériorité de la consommation du sacrifice par rapport à l’ordre de Néhémie. La formulation conserve la portée large de τὰ τῆς θυσίας sans produire un calque obscur.
