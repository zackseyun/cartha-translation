base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/019.yaml
  text: For when our fathers were being led away into Persia[a], the devout priests took some of the fire from the altar and secretly hid it in the hollow of a dry well, where they secured it so that the place would be unknown to everyone.
translation:
  language: fr
  text: En effet, lorsque nos pères étaient emmenés en Perse[a], des prêtres pieux prirent secrètement du feu de l’autel et le cachèrent dans la cavité d’un puits sans eau. Ils l’y mirent en sûreté, de sorte que l’endroit demeure inconnu de tous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « étaient déportés en Perse ». Le verbe grec peut désigner le fait d’être emmené ou conduit en exil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγοντο
  choice: furent emmenés
  rationale: Dans ce contexte, le passif de ἄγω évoque l’emmenement des ancêtres en exil. « Furent emmenés » conserve l’idée de déplacement imposé sans préciser davantage ses modalités.
- source_word: Περσικὴν
  choice: en Perse
  rationale: L’adjectif substantivé désigne le territoire perse ; « la Perse » est la désignation géographique naturelle en français.
- source_word: εὐσεβεῖς
  choice: fidèles
  rationale: Le terme qualifie ici des prêtres attachés à Dieu et à leur devoir religieux. « Fidèles » est actuel et digne ; « pieux » serait également possible, mais peut sonner plus marqué en français moderne.
- source_word: λαβόντες ἀπὸ τοῦ πυρὸς τοῦ θυσιαστηρίου
  choice: prirent du feu de l’autel
  rationale: La construction indique la provenance. Le partitif français « du feu » exprime naturellement qu’ils en prélevèrent une certaine quantité.
- source_word: λαθραίως
  choice: secrètement
  rationale: L’adverbe signale que l’action fut accomplie à l’insu des autres.
- source_word: κοιλώματι φρέατος τάξιν ἔχοντος ἀνύδρου
  choice: dans la cavité d’un puits à sec
  rationale: « Cavité » rend κοιλώματι, tandis que « puits à sec » restitue de façon idiomatique la caractérisation du puits comme dépourvu d’eau.
- source_word: κατησφαλίσαντο
  choice: Ils l’y mirent en sûreté
  rationale: Le verbe exprime l’action de rendre sûr ou de protéger soigneusement. Cette formulation évite l’ambiguïté moderne de « sécuriser ».
- source_word: ὥστε πᾶσιν ἄγνωστον εἶναι τὸν τόπον
  choice: de sorte que personne ne connaisse l’endroit
  rationale: La tournure française rend naturellement la conséquence ou le but du dispositif de dissimulation, sans trancher plus que le grec entre ces deux nuances.
theological_decisions:
- issue: Formulation de l’exil en Perse
  choice: furent emmenés en Perse
  alternative: furent déportés en Perse
  rationale: La formulation retenue préserve le caractère imposé du déplacement historique sans introduire le terme plus technique de « déportation », bien que celui-ci soit contextuellement possible.
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe a été divisée en deux phrases pour préserver la clarté, tout en maintenant les relations logiques du grec. « Prêtres fidèles » exprime la dévotion religieuse sans recourir au mot « pieux », parfois moins naturel ou chargé de connotations.
