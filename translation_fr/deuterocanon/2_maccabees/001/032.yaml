  text: And when this happened[a], a flame was kindled; and when the light from the altar shone forth[b], it was consumed.
translation:
  language: fr
  text: Lorsque cela arriva, une flamme s’alluma ; et lorsque la lumière venant de l’autel brilla[a], la flamme fut consumée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « renvoya son éclat » ou « lança un éclat en retour ». Le verbe grec peut désigner une lumière qui brille ou qui répond par son éclat.
    reason: lexical_alternative
  - marker: b
    text: Le grec dit simplement « fut consumé » sans préciser le sujet. La traduction l’applique à la flamme ; d’autres comprennent le combustible ou l’offrande, voire, d’après le contexte, le liquide répandu.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς δὲ τοῦτο ἐγενήθη
  choice: Quand cela se fut produit
  rationale: ὡς avec l’aoriste introduit ici une proposition temporelle. Cette formulation marque naturellement l’antériorité immédiate sans la renforcer indûment.
- source_word: φλὸξ ἀνήφθη
  choice: une flamme s’alluma
  rationale: φλόξ désigne une flamme, et le passif aoriste ἀνήφθη exprime son allumage. La tournure pronominale est naturelle en français moderne.
- source_word: τοῦ ... ἀπὸ τοῦ θυσιαστηρίου ... φωτός
  choice: la lumière venant de l’autel
  rationale: La construction indique que la lumière provient de l’autel, sans nécessiter l’ajout de « sacrificiel ».
- source_word: ἀντιλάμψαντος
  choice: brilla
  rationale: Le verbe peut évoquer une lumière qui brille, jaillit ou répond par son éclat. « Brilla » reste naturel et ne surinterprète pas la valeur du préfixe ἀντι-; une nuance possible est signalée en note.
- source_word: ἐδαπανήθη
  choice: elle fut consumée
  rationale: Le passif signifie « fut consumé(e), épuisé(e) ». Le pronom féminin reprend naturellement « une flamme », antécédent explicite le plus proche, tout en conservant en note l’incertitude du sujet grec.
theological_decisions:
- issue: Référent implicite de ἐδαπανήθη
  choice: Le texte principal fait reprendre « elle » à « une flamme ».
  alternative: Le sujet implicite pourrait être le combustible ou l’offrande, voire, d’après le contexte plus large, le liquide répandu.
  rationale: Le grec n’exprime aucun sujet dans la dernière proposition. La flamme est l’antécédent syntaxique explicite le plus proche, mais la formulation grecque ne permet pas d’exclure d’autres référents contextuels; cette tension est donc préservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple maintient le ton narratif soutenu des livres historiques sans archaïsme marqué. Les deux marqueurs de note figurent dans le texte principal.
