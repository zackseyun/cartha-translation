  text: Torment those who oppress and insolently abuse us in their pride;[a]
translation:
  language: fr
  text: Tourmente ceux qui nous oppriment et nous maltraitent avec arrogance.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Afflige ceux qui nous oppriment et nous outragent avec arrogance » ou « Punis ceux qui nous oppriment et nous outragent avec arrogance ».'
    reason: Alternatives lexicales pour βάσανισον et ἐξυβρίζοντας ; reformulation grammaticale complète des deux possibilités.
lexical_decisions:
- source_word: βάσανισον
  choice: Tourmente
  rationale: L’impératif aoriste demande à Dieu d’infliger une souffrance ou un châtiment sévère. « Tourmente » conserve l’intensité du grec sans préciser indûment la forme du châtiment.
- source_word: τοὺς καταδυναστεύοντας
  choice: ceux qui nous oppriment
  rationale: Le participe désigne ceux qui exercent un pouvoir oppressif. L’objet « nous », implicite dans le contexte de cette prière communautaire, est exprimé pour produire un français naturel.
- source_word: ἐξυβρίζοντας
  choice: nous maltraitent
  rationale: Le verbe évoque un traitement outrageant marqué par l’insolence. « Maltraitent » rend naturellement l’action hostile, tandis que « avec arrogance » en exprime la manière.
- source_word: ἐν ὑπερηφανίᾳ
  choice: avec arrogance
  rationale: Cette tournure rend clairement la disposition hautaine ou la manière arrogante dans laquelle les adversaires agissent.
theological_decisions:
- issue: Objet implicite des deux participes
  choice: Exprimer « nous » avec les deux verbes coordonnés
  alternative: Ne l’exprimer qu’avec le second verbe, ou laisser l’objet entièrement implicite
  rationale: Le contexte est une prière communautaire portant sur les actes hostiles dirigés contre ceux qui prient. En français, expliciter l’objet commun rend la phrase idiomatique sans ajouter de nouvelle affirmation théologique.
- issue: Force de βάσανισον
  choice: Conserver la demande intense par « Tourmente »
  alternative: « Afflige » ou « Punis »
  rationale: Le grec peut désigner une souffrance sévère ou un châtiment. Le choix principal en maintient la force, tandis que la note signale les autres nuances possibles.
translation_notes:
  register: Français international moderne, digne et direct. La formulation garde la vigueur de la supplication grecque tout en restant naturelle pour un lectorat général.
