  text: and may he hear your prayers[a], and be reconciled to you[c][b], and not abandon you in an evil time.
translation:
  language: fr
  text: qu’il écoute vos supplications[a], qu’il se réconcilie avec vous[b] et qu’il ne vous abandonne pas en temps de malheur[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « prête attention à vos prières ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « s’apaise envers vous » ou « vous redevienne favorable ».'
    reason: alternative_reading
  - marker: c
    text: 'Ou : « dans un temps mauvais ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπακούσαι
  choice: qu’il écoute
  rationale: Dans le contexte de la prière, ὑπακούω exprime une écoute attentive et favorable. « Écoute » reste naturel sans aller jusqu’à « exauce », qui préciserait davantage le résultat.
- source_word: τῶν δεήσεων
  choice: vos supplications
  rationale: δέησις désigne une demande pressante adressée à Dieu. « Supplications » conserve cette nuance plus précisément que le terme général « prières ».
- source_word: καταλλαγείη
  choice: qu’il se réconcilie avec vous
  rationale: L’optatif exprime ici un souhait, et καταλλάσσω évoque le rétablissement d’une relation ou de la faveur. La formulation garde la dimension relationnelle sans préciser le moyen de cette réconciliation.
- source_word: ἐγκαταλίποι
  choice: qu’il ne vous abandonne pas
  rationale: ἐγκαταλείπω signifie laisser ou abandonner. « Abandonner » est clair, actuel et fidèle au contexte.
- source_word: ἐν καιρῷ πονηρῷ
  choice: en un temps mauvais
  rationale: La traduction demeure proche de καιρός et de πονηρός, tout en laissant ouverte la nuance entre un temps marqué par le mal et une période d’adversité.
theological_decisions:
- issue: Le sens de καταλλαγείη concernant la relation de Dieu avec les destinataires
  choice: qu’il se réconcilie avec vous
  alternative: qu’il s’apaise envers vous ; qu’il vous redevienne favorable
  rationale: « Se réconcilie » préserve l’idée d’une relation restaurée après un éloignement, sans réduire le verbe à une émotion divine ni introduire un mécanisme doctrinal absent du texte.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « qu’il » rend clairement la série d’optatifs grecs. « En un temps mauvais » conserve volontairement l’ambiguïté entre mal moral et adversité.
