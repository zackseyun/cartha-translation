- source_word: ἐπέψαλλον
  choice: chantaient
  rationale: L’imparfait présente l’action comme en cours. « Chantaient » reste naturel et suffisamment large, sans imposer la nuance plus spécifique de « psalmodiaient ».
- source_word: τοὺς ὕμνους
  choice: les hymnes
  rationale: Cette expression conserve l’article et rend directement les chants de louange probablement connus dans ce cadre liturgique.
