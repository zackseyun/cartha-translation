  text: Accept the sacrifice for all your people Israel[a], and preserve your portion and sanctify it.
translation:
  language: fr
  text: Accepte le sacrifice pour tout ton peuple Israël, préserve ta part[a] et sanctifie-la.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « ta part » désigne probablement Israël, qui appartient à Dieu ; elle pourrait toutefois aussi évoquer le pays ou le sanctuaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόσδεξαι
  choice: Accepte
  rationale: Dans cette prière, l’impératif demande à Dieu d’accueillir favorablement le sacrifice. « Accepte » exprime naturellement cette demande en français moderne.
- source_word: τὴν θυσίαν
  choice: le sacrifice offert
  rationale: θυσία désigne ici un sacrifice cultuel. L’ajout léger de « offert » rend idiomatique en français le lien avec ὑπέρ sans modifier la nature du sacrifice.
- source_word: ὑπὲρ παντὸς τοῦ λαοῦ σου Ἰσραήλ
  choice: pour tout ton peuple, Israël
  rationale: ὑπέρ indique que le sacrifice est présenté en faveur de l’ensemble du peuple. L’apposition « Israël » reproduit sans lourdeur la construction grecque.
- source_word: διαφύλαξον
  choice: préserve
  rationale: Le verbe demande à Dieu de garder sa part en sûreté et de la protéger durablement. « Préserve » conserve cette portée sans préciser la nature du danger.
- source_word: τὴν μερίδα σου
  choice: ta part
  rationale: μερίς désigne une part ou portion attribuée. « Ta part » maintient la métaphore du grec et n’impose pas le sens plus interprétatif d’« héritage ».
- source_word: καθαγίασον
  choice: sanctifie-la
  rationale: Le verbe signifie rendre saint ou consacrer. « Sanctifie-la » conserve le vocabulaire de la sainteté et le pronom reprend naturellement le singulier « ta part ».
theological_decisions:
- issue: Référent de « ta part »
  choice: La traduction laisse « ta part » désigner probablement Israël, le peuple appartenant à Dieu.
  alternative: La part de Dieu pourrait être comprise plus largement comme le pays ou le sanctuaire.
  rationale: La mention immédiate de « ton peuple, Israël » favorise le peuple comme référent, conformément au langage biblique de la part attribuée à Dieu. Toutefois, le grec ne nomme pas de nouveau le référent; le maintien de la métaphore et une note préservent donc l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement convient à l’adresse directe à Dieu et aux impératifs grecs. La formulation reste proche du texte tout en évitant une syntaxe artificielle.
