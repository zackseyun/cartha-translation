    issue: Ajout de « offert »
    rationale: θυσία signifie « sacrifice », mais le grec ne contient pas de participe ou de verbe signifiant explicitement « offert ». Le sacrifice est certes implicitement présenté à Dieu, mais cet ajout n’est pas nécessaire pour une traduction optimale-équivalente.
  - severity: low
    issue: Ponctuation de « peuple, Israël »
    rationale: Dans « ton peuple Israël », Israël identifie le peuple et fonctionne plus naturellement comme apposition non détachée en français biblique moderne. La suppression de la virgule rapproche aussi davantage la construction grecque.
