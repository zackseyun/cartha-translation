  source_fidelity: La traduction rend correctement le chef, la force qui l’accompagne, son apparente invincibilité, le massacre dans le temple de Nanaia et la ruse des prêtres. Toutefois, « une fois entrés » explicite une entrée qui n’est pas exprimée par γενόμενος (« étant venu / arrivé »), même si le contexte narratif peut la suggérer. « Arrivés » préserve mieux l’ellipse grecque.
