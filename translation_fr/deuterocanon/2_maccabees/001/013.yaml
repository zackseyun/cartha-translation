  yaml_path: translation/deuterocanon/2_maccabees/001/013.yaml
  text: For when the leader and the force around him that seemed to be invincible had entered[a], they were cut down in the temple of Nanaia[b], because the priests of Nanaia had used deceit.
translation:
  language: fr
  text: Car, lorsque le chef et les troupes qui l’accompagnaient et qui semblaient invincibles furent arrivés[a], ils furent massacrés dans le temple de Nanaia, les prêtres de Nanaia ayant employé une ruse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte littéralement « le chef étant venu »; selon le contexte, on peut aussi comprendre « lorsqu’ils furent arrivés ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ayant eu recours à la tromperie ». Le génitif absolu grec peut exprimer ici le moyen ou la cause du massacre.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος
  choice: une fois entrés
  rationale: Le participe est inhabituel au sens strict (« étant devenu »). Dans ce contexte, il introduit l’arrivée ou l’entrée du chef et de ses hommes dans le temple. Le pluriel français rattache naturellement l’entrée à l’ensemble du groupe, sujet logique de « furent massacrés », tout en signalant par une note que le grec est elliptique.
- source_word: ὁ ἡγεμών
  choice: le chef
  rationale: ἡγεμών désigne ici le dirigeant de l’expédition sans imposer le titre administratif plus précis de « gouverneur ».
- source_word: ἡ περὶ αὐτὸν ... δύναμις
  choice: les troupes qui l’accompagnaient
  rationale: Dans ce contexte militaire, δύναμις désigne une force armée, tandis que περὶ αὐτόν indique les hommes qui entourent ou accompagnent le chef. « Les troupes » est naturel en français et évite de préciser indûment la taille du contingent.
- source_word: ἀνυπόστατος δοκοῦσα εἶναι
  choice: qui semblaient invincibles
  rationale: ἀνυπόστατος qualifie ce à quoi on ne peut tenir tête; δοκοῦσα εἶναι maintient explicitement le caractère apparent de cette invincibilité.
- source_word: κατεκόπησαν
  choice: furent massacrés
  rationale: Le passif de κατακόπτω exprime une mise à mort violente, littéralement par coups ou en taillant en pièces. « Furent massacrés » conserve la force du verbe dans un français actuel sans détail graphique excessif.
- source_word: ἐν τῷ τῆς Ναναίας ἱερῷ
  choice: dans le temple de Nanaia
  rationale: ἱερόν désigne ici le sanctuaire ou temple consacré à Nanaia; « temple » convient au contexte narratif et cultuel.
- source_word: παραλογισμῷ χρησαμένων
  choice: ayant eu recours à la tromperie
  rationale: 'Le génitif absolu indique le moyen ou la circonstance causale: les prêtres ont employé une ruse. Cette formulation préserve ce lien sans le réduire exclusivement à la cause ou au moyen.'
- source_word: τῶν περὶ τὴν Ναναίαν ἱερέων
  choice: les prêtres de Nanaia
  rationale: La tournure désigne naturellement les prêtres attachés au service de Nanaia. « Prêtres de Nanaia » est clair et idiomatique en français.
