  terminology: « Chef », « troupes », « temple de Nanaia », « massacrés » et « prêtres de Nanaia » conviennent au contexte et au registre. « Employé une ruse » rend précisément παραλογισμῷ χρησαμένων sans forcer exclusivement une nuance de cause ou de moyen.
