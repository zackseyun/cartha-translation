  text: and may God do good to you[a], and remember his covenant with Abraham, Isaac, and Jacob, his faithful servants.
translation:
  language: fr
  text: Que Dieu vous fasse du bien et se souvienne de son alliance avec Abraham, Isaac et Jacob, ses fidèles serviteurs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « esclaves fidèles ». Le grec souligne ainsi leur appartenance à Dieu.'
    reason: Précision lexicale sur la force de δοῦλοι.
lexical_decisions:
- source_word: ἀγαθοποιῆσαι
  choice: vous fasse du bien
  rationale: L’infinitif aoriste poursuit ici une formule de souhait ou de prière. Cette traduction garde le sens concret d’une action bienfaisante de Dieu sans en préciser indûment la forme.
- source_word: μνησθῆναι
  choice: se souvienne
  rationale: Dans un contexte d’alliance, le verbe évoque une attention fidèle susceptible de conduire à l’action. « Se souvenir » conserve cette résonance biblique sans l’expliciter dans le texte.
- source_word: διαθήκης
  choice: alliance
  rationale: La mention d’Abraham, d’Isaac et de Jacob indique clairement l’alliance biblique plutôt qu’un accord ordinaire ou un testament.
- source_word: δούλων
  choice: serviteurs
  rationale: En français biblique courant, « serviteurs » désigne naturellement ceux qui appartiennent à Dieu et le servent. Une note signale le sens plus littéral et plus fort de « esclaves ».
- source_word: πιστῶν
  choice: fidèles
  rationale: L’adjectif qualifie Abraham, Isaac et Jacob dans leur relation à Dieu; « fidèles » rend naturellement leur loyauté et leur constance.
theological_decisions:
- issue: Traduction de δοῦλοι à propos des patriarches
  choice: serviteurs
  alternative: esclaves
  rationale: « Serviteurs » est digne et idiomatique en français dans cette désignation des patriarches, tandis que la note préserve la force de δοῦλοι, qui souligne leur appartenance à Dieu, sans imposer au texte principal les connotations modernes particulières d’« esclaves ».
translation_notes:
  register: Français international moderne, clair et digne. La coordination des deux souhaits est conservée, ainsi que la formulation traditionnelle des noms des patriarches.
