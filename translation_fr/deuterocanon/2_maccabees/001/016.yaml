  naturalness: Le français est globalement naturel et de registre approprié. La révision évite l’enchaînement un peu heurté de « Puis ils le dépecèrent » et conserve la succession participiale du grec par « après l’avoir mis en pièces ».
  terminology: « Chef » maintient utilement l’indétermination de ἡγεμών. « Chambre enfumée » reste une solution recevable pour le rare φατίνωμα, à condition que la note conserve explicitement l’incertitude. Le pluriel insolite « les têtes » doit être préservé.
