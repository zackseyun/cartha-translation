  yaml_path: translation/deuterocanon/2_maccabees/001/016.yaml
  text: After opening the hidden door of the smoke chamber[a], they threw stones and struck down the leader, and after cutting him into pieces[b], they threw the heads to those outside.
translation:
  language: fr
  text: Après avoir ouvert la porte cachée de la chambre enfumée[a], ils lancèrent des pierres et abattirent le chef[b] ; après l’avoir mis en pièces, ils jetèrent les têtes[c] à ceux qui étaient dehors.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la salle du four » ou « du lieu de la fumée ou de l’encens » ; le terme grec est rare et son sens précis demeure incertain.
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec évoque la foudre. Dans ce contexte, il peut décrire la violence avec laquelle ils l’abattirent, sans nécessairement parler d’un éclair tombé du ciel.
    reason: lexical_alternative
  - marker: c
    text: Le grec porte le pluriel « les têtes », bien que le chef mentionné soit au singulier.
    reason: textual_or_semantic_difficulty
lexical_decisions:
- source_word: ἀνοίξαντες
  choice: Après avoir ouvert
  rationale: Le participe aoriste exprime une action antérieure aux verbes principaux; cette formulation rend clairement et naturellement la succession des actes.
- source_word: τὴν τοῦ φατινώματος κρυπτὴν θύραν
  choice: la porte cachée de la chambre enfumée
  rationale: κρυπτήν signifie « cachée » ou « dissimulée ». Le rare φατίνωμα semble désigner un espace associé à la fumée ou au feu, sans que son référent exact soit assuré.
- source_word: βάλλοντες πέτρους
  choice: ils lui lancèrent des pierres
  rationale: La tournure française exprime simplement l’action violente et indique clairement que les pierres atteignent le chef.
- source_word: συνεκεραύνωσαν
  choice: foudroyèrent
  rationale: Le verbe est formé sur κεραυνός, « foudre ». « Foudroyèrent » conserve cette image vive tout en pouvant désigner, en français, le fait d’abattre brutalement.
- source_word: τὸν ἡγεμόνα
  choice: le chef
  rationale: ἡγεμών peut désigner un chef, un gouverneur ou un commandant. « Chef » préserve cette relative généralité sans préciser indûment sa fonction.
- source_word: μέλη ποιήσαντες
  choice: ils le dépecèrent
  rationale: L’expression signifie littéralement qu’ils en firent des membres ou des morceaux. « Dépecèrent » restitue avec concision la violence de la mutilation.
- source_word: τὰς κεφαλὰς
  choice: les têtes
  rationale: Le pluriel étonnant du grec est conservé au lieu d’être corrigé silencieusement en un singulier plus attendu.
- source_word: τοῖς ἔξω παρρίψαντες
  choice: jetèrent […] à ceux qui étaient dehors
  rationale: Le datif substantivé τοῖς ἔξω désigne naturellement les personnes qui se trouvent dehors; παρρίψαντες exprime l’action de jeter.
theological_decisions:
- issue: Le verbe συνεκεραύνωσαν décrit-il une intervention littérale de la foudre ou une mise à mort violente?
  choice: « foudroyèrent », avec une note signalant l’image grecque sans affirmer une intervention miraculeuse
  alternative: « abattirent » ou « frappèrent comme par la foudre »
  rationale: Le verbe évoque fortement la foudre, mais les acteurs immédiats lancent des pierres. Le choix français garde l’image et l’ambiguïté sans transformer celle-ci en miracle explicite.
translation_notes:
  register: Français international moderne, courant et digne. La phrase reste directe malgré la violence du récit. « Chambre enfumée » évite une précision technique incertaine; « foudroyèrent » conserve l’image singulière du grec; le pluriel inattendu « les têtes » est maintenu et expliqué.
