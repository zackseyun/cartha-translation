base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/011.yaml
  text: Having been saved by God from great dangers[a], we give him great thanks, as those about to array ourselves against a king.
translation:
  language: fr
  text: Sauvés par Dieu de grands dangers, nous lui exprimons une profonde reconnaissance, comme si nous nous rangions en ordre de bataille contre un roi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « comme des gens rangés en ordre de bataille contre un roi ». La comparaison grecque est condensée et son lien exact avec l’action de grâce reste incertain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ μεγάλων κινδύνων
  choice: de grands dangers
  rationale: La tournure conserve le pluriel et l’intensification de μεγάλων, dans un français naturel.
- source_word: ὑπὸ τοῦ θεοῦ σεσωσμένοι
  choice: Sauvés par Dieu
  rationale: Le participe parfait passif exprime une délivrance accomplie dont l’effet demeure, tandis que ὑπό avec le génitif désigne explicitement Dieu comme agent.
- source_word: μεγάλως εὐχαριστοῦμεν αὐτῷ
  choice: nous lui exprimons une profonde reconnaissance
  rationale: Cette formulation française actuelle rend l’intensité de μεγάλως, le sens de gratitude d’εὐχαριστέω et le complément αὐτῷ, sans lourdeur.
- source_word: ὡς ἂν
  choice: comme si
  rationale: La locution introduit ici une comparaison à nuance éventuelle ou hypothétique; « comme si » conserve cette nuance sans imposer une relation causale.
- source_word: πρὸς βασιλέα παρατασσόμενοι
  choice: nous nous rangions en ordre de bataille contre un roi
  rationale: παρατάσσω évoque la mise en ligne militaire; la forme moyenne/passive permet ici une expression pronominale, et πρός prend naturellement un sens hostile dans ce contexte.
theological_decisions:
- issue: Agent de la délivrance
  choice: Dieu est explicitement celui qui sauve les auteurs des dangers.
  alternative: Présenter la délivrance comme une circonstance providentielle sans agent explicite.
  rationale: La construction grecque ὑπὸ τοῦ θεοῦ σεσωσμένοι attribue directement le salut à Dieu; la traduction maintient cette affirmation sans l’amplifier.
- issue: Rapport entre la reconnaissance et l’image militaire
  choice: Conserver la comparaison elliptique et difficile introduite par ὡς ἂν.
  alternative: Interpréter la phrase comme « parce qu’il a combattu à nos côtés contre le roi » ou « pour avoir pris notre parti contre le roi ».
  rationale: Le grec ne formule pas explicitement ces interprétations théologiques ou causales; garder « comme si » préserve la tension et l’ambiguïté du texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Exprimer une profonde reconnaissance » évite l’archaïsme tout en rendant l’intensité de l’action de grâce. L’image militaire est explicitée uniquement dans la mesure portée par παρατάσσω.
