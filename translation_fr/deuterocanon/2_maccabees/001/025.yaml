translation:
  language: fr
  text: toi, le seul pourvoyeur[a], le seul juste, tout-puissant et éternel, toi qui délivres Israël de tout mal, qui as choisi les pères[b] et les as sanctifiés[c] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bienfaiteur » ou « celui qui pourvoit à tout ». Le grec désigne celui qui fournit ce qui est nécessaire.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « qui as fait les pères choisis » ; autre traduction possible : « qui as rendu les pères élus ».'
    reason: source_syntax_and_lexical_alternative
  - marker: c
    text: Ou « les as rendus saints » ou « les as consacrés ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μόνος χορηγός
  choice: toi, le seul pourvoyeur
  rationale: « Pourvoyeur » exprime celui qui fournit ce qui est nécessaire. La reprise de « toi » convient à l’adresse directe d’une prière et rend naturellement l’article grec substantivant.
- source_word: ὁ μόνος δίκαιος
  choice: le seul juste
  rationale: « Juste » conserve à la fois la rectitude morale et la dimension judiciaire de δίκαιος, sans alourdir le titre.
- source_word: παντοκράτωρ
  choice: tout-puissant
  rationale: Équivalent français biblique courant du titre divin, exprimant une puissance souveraine universelle.
- source_word: αἰώνιος
  choice: éternel
  rationale: Dans cette série d’attributs divins, « éternel » est l’équivalent français naturel et précis.
- source_word: ὁ διασώζων
  choice: toi qui délivres
  rationale: Le participe désigne une intervention salvatrice face au danger. « Délivrer » garde le registre biblique tout en restant actuel.
- source_word: ἐκ παντὸς κακοῦ
  choice: de tout mal
  rationale: Cette formulation préserve l’étendue de κακόν, qui peut évoquer le mal, le malheur ou le dommage, sans la réduire à un seul aspect.
- source_word: ὁ ποιήσας τοὺς πατέρας ἐκλεκτούς
  choice: qui as choisi les pères
  rationale: L’expression grecque est littéralement causative (« qui as fait les pères choisis »), mais « qui as choisi les pères » en transmet naturellement le sens en français.
- source_word: ἡγίασας αὐτούς
  choice: les as sanctifiés
  rationale: « Sanctifier » conserve le registre cultuel et théologique du verbe, qui peut signifier rendre saint ou mettre à part pour Dieu.
theological_decisions:
- issue: Identification de τοὺς πατέρας
  choice: les pères
  alternative: les ancêtres ; nos pères
  rationale: Le grec dit littéralement « les pères » et n’exprime pas le possessif « nos ». Ce choix garde la résonance historique et alliancielle sans ajouter un élément absent du texte.
- issue: Rapport entre ποιήσας et ἐκλεκτούς
  choice: qui as choisi les pères
  alternative: qui as rendu les pères élus
  rationale: La tournure française naturelle exprime l’acte de choix sans importer les connotations doctrinales que « élus » pourrait prendre. Elle préserve cependant l’idée que Dieu les a établis comme choisis.
- issue: Portée de ἡγίασας
  choice: sanctifiés
  alternative: rendus saints ; consacrés
  rationale: Le contexte de prière solennelle justifie « sanctifiés », terme assez large pour conserver la tension entre transformation en sainteté et mise à part consacrée.
translation_notes:
  register: Prière solennelle en français moderne et digne. La répétition de « toi » soutient l’adresse directe implicite dans la série grecque. « Pourvoyeur » et « sanctifiés » maintiennent le registre élevé sans archaïsme excessif.
