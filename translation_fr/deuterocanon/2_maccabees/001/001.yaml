  text: 'To the Jewish brothers in Egypt: the Jewish brothers in Jerusalem and those in the land of Judea[a], greetings and good peace.'
translation:
  language: fr
  text: 'Aux frères juifs qui sont en Égypte : les frères juifs qui sont à Jérusalem et ceux qui sont dans le pays de Judée, salutations et bonne paix.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τοῖς ἀδελφοῖς τοῖς κατʼ Αἴγυπτον Ἰουδαίοις
  choice: Aux frères juifs qui sont en Égypte
  rationale: Le datif introduit les destinataires. « Frères » traduit explicitement ἀδελφοῖς et conserve le lien familial; « qui sont en Égypte » rend naturellement la localisation exprimée par κατʼ Αἴγυπτον.
- source_word: οἱ ἀδελφοὶ οἱ ἐν Ἱεροσολύμοις Ἰουδαῖοι
  choice: les frères juifs qui sont à Jérusalem
  rationale: La formulation identifie les expéditeurs tout en conservant la répétition de « frères », importante pour la solidarité entre communautés.
- source_word: καὶ οἱ ἐν τῇ χώρᾳ τῆς Ἰουδαίας
  choice: et ceux qui sont dans le pays de Judée
  rationale: « Pays de Judée » représente χώρα τῆς Ἰουδαίας sans réduire explicitement l'expression à la seule ville ou à une désignation administrative moderne.
- source_word: χαίρειν
  choice: adressent leurs salutations
  rationale: Dans une ouverture épistolaire, χαίρειν est une formule conventionnelle de salutation. L'ajout verbal « adressent » permet une syntaxe française naturelle sans lui donner le sens littéral de « réjouissez-vous ».
- source_word: εἰρήνην ἀγαθήν
  choice: leurs vœux de paix
  rationale: Le français « bonne paix » serait peu naturel et potentiellement obscur. « Vœux de paix » conserve la valeur de salutation et la qualité positive portée par ἀγαθήν, sans élargir le sens à la prospérité.
theological_decisions:
- issue: Portée du masculin ἀδελφοῖς / ἀδελφοί dans l'adresse communautaire
  choice: frères
  alternative: frères et sœurs
  rationale: Le grec emploie à deux reprises le nom masculin « frères ». La traduction le représente directement et préserve l'écho entre destinataires et expéditeurs, sans préciser davantage que la source la composition des communautés.
- issue: Sens de la formule εἰρήνην ἀγαθήν
  choice: vœux de paix
  alternative: bonne paix
  rationale: La formule peut refléter un tour épistolaire influencé par l'usage sémitique. La traduction maintient le souhait de paix tout en évitant un calque peu intelligible; elle n'ajoute ni « prospérité » ni une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, digne et lisible. La structure d'adresse et la répétition de « frères juifs » sont conservées; la formule finale est légèrement idiomatisée afin d'être naturelle en français.
