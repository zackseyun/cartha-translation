lexical_decisions:
- source_word: ἔτους
  choice: La … année
  rationale: Le génitif appartient à une brève formule de datation. En français, un intitulé elliptique avec l’article (« La … année ») conserve mieux la concision fragmentaire du grec que l’ajout d’un verbe.
- source_word: ὀγδοηκοστοῦ καὶ ὀγδόου
  choice: quatre-vingt-huitième
  rationale: Le grec forme l’ordinal analytiquement (« quatre-vingtième et huitième ») ; l’ordinal composé est la formulation française naturelle.
- source_word: ἐν Ἱεροσολύμοις
  choice: à Jérusalem
  rationale: Pour situer un fait dans une ville, le français emploie normalement « à ». Le pluriel morphologique du toponyme grec n’est pas reproduit en français.
