revisions:
- from: Car Antiochus et les amis qui l’accompagnaient se rendirent sur les lieux, comme s’il allait l’épouser[a], afin d’obtenir une forte somme d’argent à titre de dot.
  to: Car Antiochus se rendit sur les lieux, accompagné de ses amis, pour l’épouser[a], afin d’obtenir une forte somme d’argent à titre de dot.
  rationale: La révision rétablit le singulier du verbe grec en faisant d’Antiochus le sujet de l’arrivée, avec ses amis comme accompagnateurs. Elle retire l’expression interprétative « comme si » tout en préservant, dans la note, l’ambiguïté lexicale de συνοικέω entre vie commune et mariage. Le sens de la somme recherchée à titre de dot reste inchangé.
