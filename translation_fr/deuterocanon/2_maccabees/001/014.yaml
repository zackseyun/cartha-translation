  yaml_path: translation/deuterocanon/2_maccabees/001/014.yaml
  text: For when Antiochus and his friends with him arrived at the place as though to marry her[a], in order to get the money in large amount as a dowry payment,
translation:
  language: fr
  text: Car Antiochus se rendit sur les lieux, accompagné de ses amis, pour l’épouser[a], afin d’obtenir une forte somme d’argent à titre de dot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour vivre avec elle ». Le verbe grec peut désigner le fait de vivre ensemble ou de se marier.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνοικῶν αὐτῇ
  choice: comme s’il allait l’épouser
  rationale: Le verbe συνοικέω peut désigner la vie commune ou le mariage. Dans ce contexte, la venue d’Antiochus vise à obtenir les biens présentés comme une dot; la formulation française exprime naturellement cette intention apparente sans faire passer l’union pour réelle.
- source_word: παρεγένετο εἰς τὸν τόπον
  choice: se rendirent sur les lieux
  rationale: Rend idiomatiquement le mouvement et l’arrivée à l’endroit en question. Le pluriel français tient compte d’Antiochus et des amis qui l’accompagnent.
- source_word: οἱ σὺν αὐτῷ φίλοι
  choice: les amis qui l’accompagnaient
  rationale: Conserve φίλοι au sens littéral d’« amis » tout en rendant naturellement σὺν αὐτῷ; le terme peut aussi désigner des proches ou dignitaires de la cour.
- source_word: χάριν τοῦ λαβεῖν
  choice: afin d’obtenir
  rationale: La construction exprime clairement le but; « obtenir » convient à une somme recherchée plutôt que simplement reçue.
- source_word: τὰ χρήματα πλείονα
  choice: une forte somme d’argent
  rationale: πλείονα marque une quantité grande ou supérieure. En l’absence de terme de comparaison explicite, « une forte somme » est naturel en français et garde l’accent quantitatif.
- source_word: εἰς φερνῆς λόγον
  choice: à titre de dot
  rationale: φερνή signifie « dot », tandis que λόγος indique ici la catégorie ou le titre sous lequel l’argent devait être obtenu.
theological_decisions:
- issue: Nature de l’union évoquée avec le référent féminin
  choice: Le texte principal présente un mariage apparent ou projeté sans identifier davantage « elle » dans ce verset.
  alternative: Expliciter qu’Antiochus prétendait épouser une déesse afin de piller son temple.
  rationale: Le grec emploie seulement le pronom αὐτῇ et un verbe pouvant évoquer mariage ou vie commune. Une explicitation narrative plus développée importerait dans ce verset des éléments contextuels qui n’y sont pas énoncés.
translation_notes:
  register: Français international moderne, narratif et digne. « Se rendirent sur les lieux » et « à titre de dot » gardent un registre soutenu mais courant; la note préserve l’ambiguïté lexicale du grec.
