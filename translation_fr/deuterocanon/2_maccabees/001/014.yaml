review_pass:
  verdict: revise
  source_fidelity: La forme verbale principale, παρεγένετο, est au singulier et a pour sujet Antiochus; les « amis » l’accompagnent. Le pluriel « se rendirent » attribue donc explicitement l’action principale à un sujet pluriel, alors que le grec présente Antiochus comme l’arrivant accompagné. Par ailleurs, « comme s’il allait » interprète comme simulation une tournure grecque qui exprime directement le fait ou le projet de συνοικεῖν; le contexte peut expliquer l’apparence de mariage, mais cette nuance n’est pas marquée grammaticalement dans le verset. « À titre de dot » rend convenablement εἰς φερνῆς λόγον, et « une forte somme d’argent » transmet de façon idiomatique la valeur quantitative de πλείονα.
  naturalness: La formulation proposée est fluide et de registre narratif moderne. « Antiochus se rendit sur les lieux, accompagné de ses amis » est à la fois naturelle et plus précise quant à la syntaxe grecque. « Pour l’épouser » est plus direct et évite une interprétation ajoutée.
  terminology: « Dot » est le terme exact pour φερνή. « Amis » maintient la traduction littérale de φίλοι, sans exclure que le terme puisse avoir une coloration de cour dans le contexte hellénistique. La note doit conserver l’alternative « vivre avec elle » sans y ajouter l’idée de prétexte.
  issues:
  - severity: medium
    issue: Accord pluriel de « se rendirent »
    rationale: παρεγένετο est singulier et se rapporte à Antiochus; οἱ σὺν αὐτῷ φίλοι désigne ses accompagnateurs.
  - severity: medium
    issue: Ajout de « comme si »
    rationale: Le grec συνοικῶν exprime directement l’union, la cohabitation ou le projet de mariage. La simulation relève du contexte narratif, non d’un marqueur explicite dans ce verset.
  revised_text: Car Antiochus se rendit sur les lieux, accompagné de ses amis, pour l’épouser[a], afin d’obtenir une forte somme d’argent à titre de dot.
