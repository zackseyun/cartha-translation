  text: Plant your people in your holy place[a], just as Moses said.
translation:
  language: fr
  text: Plante ton peuple dans ton lieu saint[a], comme Moïse l’a dit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Établis ton peuple dans ton lieu saint. » Le verbe grec signifie littéralement « planter » et évoque une installation ferme et durable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταφύτευσον
  choice: Plante
  rationale: Impératif aoriste de καταφυτεύω, « planter ». Le choix conserve l’image agricole d’une implantation ferme et durable, plutôt que de la remplacer dans le texte par le terme abstrait « établis ».
- source_word: τὸν λαόν σου
  choice: ton peuple
  rationale: λαός désigne ici le peuple comme communauté collective; « ton peuple » est naturel en français et convient à l’adresse faite à Dieu.
- source_word: εἰς τὸν τόπον τὸν ἅγιόν σου
  choice: dans ton lieu saint
  rationale: τόπος signifie « lieu » et ἅγιος le qualifie de saint. « Dans » exprime naturellement en français le résultat de l’implantation, sans préciser indûment s’il s’agit du pays, du sanctuaire ou du Temple.
- source_word: καθὼς εἶπεν Μωσῆς
  choice: comme Moïse l’a dit
  rationale: καθώς marque ici la conformité à la parole de Moïse, et εἶπεν signifie simplement « dit ». Le pronom « l’ » rend la tournure française naturelle sans ajouter de contenu.
theological_decisions:
- issue: Référent de « ton lieu saint »
  choice: Maintien de la formulation générale « ton lieu saint »
  alternative: ton pays saint / ton sanctuaire / le lieu saint que tu as choisi
  rationale: Le grec emploie τόπος, « lieu », sans identifier plus précisément le référent dans ce verset. La formulation retenue préserve cette indétermination et n’impose aucune lecture géographique ou cultuelle.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement correspond à l’adresse directe à Dieu dans une prière. L’image concrète de la plantation est conservée, tandis que la note explicite son sens contextuel.
