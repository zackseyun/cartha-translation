  text: Blessed in every way is our God[a], who gave up those who acted wickedly.
translation:
  language: fr
  text: Notre Dieu est béni à tous égards, lui qui a livré[a] ceux qui se sont montrés impies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « a donné ». Le grec peut signifier ici « a livré » ou « a remis », sans préciser à qui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ πάντα
  choice: à tous égards
  rationale: Cette locution adverbiale exprime naturellement en français la portée globale de l’expression grecque sans l’aplatir en une formule absolue.
- source_word: εὐλογητὸς
  choice: est béni
  rationale: « Béni » conserve le registre de louange propre à la diction religieuse grecque; la tournure déclarative évite de transformer l’énoncé en souhait.
- source_word: ἡμῶν ὁ θεός
  choice: notre Dieu
  rationale: C’est l’équivalent français naturel de la construction possessive grecque.
- source_word: ἔδωκεν
  choice: a livré
  rationale: Dans ce contexte hostile, le verbe indique vraisemblablement la remise des adversaires au pouvoir ou au jugement d’un autre. « A livré » exprime ce sens tout en laissant le destinataire implicite.
- source_word: τοὺς ἀσεβήσαντας
  choice: ceux qui ont agi avec impiété
  rationale: Le participe aoriste désigne des personnes par leur conduite impie. Cette formulation conserve la dimension morale et religieuse du verbe sans les réduire à une catégorie essentielle.
theological_decisions:
- issue: Portée de l’action divine exprimée par ἔδωκεν
  choice: Dieu est loué pour avoir livré ceux qui ont agi avec impiété, sans préciser à qui.
  alternative: Dieu a simplement « donné » ces personnes, ou les a données aux fidèles.
  rationale: Le contexte favorise l’idée d’une remise au jugement ou à la défaite, mais le grec ne nomme aucun bénéficiaire. Le texte principal conserve donc cette indétermination.
translation_notes:
  register: Français international moderne, sobre et digne. L’ordre des mots a été naturalisé; « lui qui » maintient la valeur emphatique et explicative de la proposition relative.
