translation:
  language: fr
  text: Qu’il vous donne un cœur fidèle pour l’adorer et accomplir ses volontés avec un grand cœur et une âme volontaire.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un cœur de foi » ou « un cœur croyant ». L’expression grecque peut mettre l’accent soit sur la foi, soit sur la fidélité ; le texte retient « un cœur fidèle » parce que le contexte parle d’adorer Dieu et d’accomplir ses volontés.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοίη
  choice: Qu’il vous donne
  rationale: L’optatif exprime ici un souhait ou une prière. Cette tournure française en conserve la valeur sans préciser davantage le sujet, fourni par le contexte.
- source_word: καρδίαν πίστιν
  choice: un cœur fidèle
  rationale: Dans ce contexte d’adoration et d’obéissance, πίστιν évoque vraisemblablement la fidélité ou la fermeté de l’attachement. La note maintient toutefois les lectures axées sur la foi ou la croyance.
- source_word: σέβεσθαι
  choice: l’adorer
  rationale: Le verbe désigne ici la révérence religieuse envers Dieu; « adorer » est naturel et clair en français contemporain.
- source_word: τὰ θελήματα
  choice: ses volontés
  rationale: Le pluriel grec est conservé, avec le sens concret de ce que Dieu veut, sans le réduire au singulier collectif français « sa volonté ».
- source_word: καρδίᾳ μεγάλῃ
  choice: d’un cœur généreux
  rationale: La traduction littérale « d’un grand cœur » serait ambiguë ou peu naturelle. « Généreux » exprime ici l’ampleur et la noblesse de la disposition intérieure sans lui substituer l’idée différente d’un cœur entier.
- source_word: ψυχῇ βουλομένῃ
  choice: d’une âme bien disposée
  rationale: Le participe βουλομένῃ exprime une volonté favorable et consentante. « Bien disposée » rend cette disponibilité volontaire tout en conservant ψυχή par « âme ».
theological_decisions:
- issue: Sens du vocabulaire de πίστις dans un contexte dévotionnel non paulinien
  choice: un cœur fidèle
  alternative: un cœur de foi; un cœur croyant
  rationale: L’association immédiate avec l’adoration et l’accomplissement des volontés de Dieu favorise le sens de fidélité ou d’attachement ferme, mais le grec permet aussi une insistance sur la foi; cette ambiguïté est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la structure de la bénédiction, le pluriel grec « ses volontés » et le langage anthropologique « cœur » / « âme », tout en évitant les calques peu naturels.
