base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/027.yaml
  text: Gather our dispersed people[a], free those enslaved among the nations, look upon those who are despised and abhorred; and let the nations know that you are our God.
translation:
  language: fr
  text: Rassemble ceux d’entre nous qui sont dispersés[a], libère ceux qui sont réduits en esclavage parmi les nations, porte ton regard sur ceux qui sont méprisés et abhorrés ; et que les nations sachent que tu es notre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec, littéralement : « notre dispersion ». Ici, l’expression désigne la communauté dispersée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνάγαγε
  choice: Rassemble
  rationale: L’impératif exprime l’action de réunir ceux qui ont été dispersés. « Rassemble » est naturel en français et restitue la force du verbe préfixé sans ajout redondant.
- source_word: τὴν διασπορὰν ἡμῶν
  choice: ceux d’entre nous qui sont dispersés
  rationale: Littéralement « notre dispersion ». Le nom désigne ici, par métonymie, la communauté dispersée que Dieu est prié de réunir. Cette formulation explicite les personnes visées tout en conservant l’idée de dispersion.
- source_word: ἐλευθέρωσον
  choice: libère
  rationale: L’impératif signifie mettre en liberté. « Libère » est précis, direct et convient à la prière.
- source_word: τοὺς δουλεύοντας
  choice: ceux qui sont réduits en esclavage
  rationale: Le participe de δουλεύω porte ici le sens d’asservissement, dans un contexte d’oppression au milieu des nations. Cette traduction ne l’atténue pas en simple service.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: parmi les nations
  rationale: ἔθνη désigne les peuples ou nations environnants. « Parmi les nations » reste proche du grec et évite la portée plus interprétative de « païens ».
- source_word: τοὺς ἐξουθενημένους
  choice: ceux qui sont méprisés
  rationale: Le participe passif désigne ceux qui sont tenus pour rien ou traités avec mépris. « Méprisés » en rend clairement la condition.
- source_word: καὶ βδελυκτοὺς
  choice: et abhorrés
  rationale: βδελυκτός exprime une forte répulsion. « Abhorrés » conserve cette intensité sans imposer un sens cultuel technique.
- source_word: ἔφιδε
  choice: porte ton regard sur
  rationale: L’impératif signifie regarder, considérer. Cette expression est naturelle dans une prière et n’ajoute pas explicitement l’idée de faveur.
- source_word: γνώτωσαν
  choice: que les nations sachent
  rationale: L’impératif à valeur jussive devient naturellement en français une demande introduite par « que ».
- source_word: ὅτι σὺ ὁ θεὸς ἡμῶν
  choice: que tu es notre Dieu
  rationale: La formulation rend directement la prédication grecque. Le pronom « tu », exprimé, relaie l’accent porté par σύ.
theological_decisions:
- issue: Référent de « notre dispersion »
  choice: 'Interprétation comme la communauté dispersée : « ceux d’entre nous qui sont dispersés »'
  alternative: « notre dispersion » ou « notre diaspora »
  rationale: La prière demande à Dieu de rassembler des personnes. Le grec permet que le nom abstrait désigne par métonymie la communauté dispersée ; la note conserve toutefois la forme littérale.
- issue: Portée de δουλεύοντας
  choice: « ceux qui sont réduits en esclavage »
  alternative: « ceux qui servent » ou « ceux qui sont dans la servitude »
  rationale: Le contexte de captivité et d’oppression rend saillante la notion d’asservissement. Il convient de ne pas l’affaiblir en simple service.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme de la prière et la succession des impératifs sont conservés. « Nations » maintient la portée historique et évite un terme confessionnel plus chargé.
