  yaml_path: translation/deuterocanon/2_maccabees/001/020.yaml
  text: But after many years had passed, when it seemed good to God, Nehemiah, having been sent by the king of Persia, sent for the descendants of the priests who had hidden it, to get the fire.
translation:
  language: fr
  text: Mais, bien des années plus tard, quand Dieu le jugea bon, Néhémie, envoyé par le roi de Perse, envoya les descendants des prêtres qui avaient caché le feu le chercher.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « envoya … vers/pour le feu ». La formulation grecque est concise ; dans le contexte, elle indique que Néhémie envoya ces descendants chercher le feu caché.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διελθόντων δὲ ἐτῶν ἱκανῶν
  choice: Mais bien des années plus tard
  rationale: Le génitif absolu établit le cadre temporel. « Bien des années plus tard » rend naturellement l’idée qu’un nombre considérable d’années s’était écoulé, tandis que δέ assure une transition narrative légère.
- source_word: ὅτε ἔδοξεν τῷ θεῷ
  choice: quand Dieu le jugea bon
  rationale: Cette tournure française actuelle et digne exprime l’approbation ou la décision divine indiquée par ἔδοξεν avec le datif, sans suggérer une simple apparence ni insister sur un plaisir émotionnel.
- source_word: ἀποσταλεὶς Νεεμίας ἀπὸ τοῦ βασιλέως τῆς Περσίδος
  choice: Néhémie, envoyé par le roi de Perse
  rationale: Le participe aoriste passif qualifie Néhémie et présente son envoi comme antérieur ou circonstanciel. « Par » rend naturellement l’agent personnel introduit par ἀπό.
- source_word: τοὺς ἐκγόνους τῶν ἱερέων
  choice: les descendants des prêtres
  rationale: ἐκγόνους désigne largement la descendance; « descendants » évite de restreindre indûment le sens aux seuls fils immédiats.
- source_word: τῶν ἀποκρυψάντων
  choice: qui avaient caché le feu
  rationale: Le participe se rapporte aux prêtres. L’objet, implicite en grec, est explicité d’après le contexte immédiat pour produire une phrase française claire.
- source_word: ἔπεμψεν ἐπὶ τὸ πῦρ
  choice: chargea les descendants … d’aller le chercher
  rationale: La construction grecque est concise et peut littéralement évoquer un envoi « vers/pour le feu ». Dans le contexte, elle indique que Néhémie dépêcha les descendants afin de récupérer le feu caché. « Chargea … d’aller le chercher » rend clairement cette mission sans supprimer l’ambiguïté lexicale, signalée en note.
theological_decisions:
- issue: Volonté divine dans ὅτε ἔδοξεν τῷ θεῷ
  choice: quand Dieu le jugea bon
  alternative: quand cela plut à Dieu
  rationale: Le choix retenu conserve l’idée de décision ou d’approbation divine sans accentuer la notion de plaisir affectif. Il évite également le français moins naturel et potentiellement équivoque « quand cela sembla bon à Dieu ».
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la structure narrative du grec tout en clarifiant les référents implicites nécessaires en français. La note maintient visible la concision et la latitude de la préposition grecque.
