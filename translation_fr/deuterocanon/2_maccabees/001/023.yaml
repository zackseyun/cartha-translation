base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/023.yaml
  text: And when the sacrifice had been consumed[a], the priests and all the others offered prayer, with Jonathan leading and the rest responding, as in Nehemiah's time.
translation:
  language: fr
  text: Pendant que le sacrifice se consumait, les prêtres et tous les autres adressèrent une prière. Jonathan commença et les autres répondirent, comme l’avait fait Néhémie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme au temps de Néhémie ». La fin du verset est condensée en grec ; la comparaison avec Néhémie peut porter sur son action ou, plus largement, sur une pratique associée à son époque.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσευχὴν … ἐποιήσαντο
  choice: firent une prière
  rationale: Cette tournure rend directement l’expression grecque « faire une prière » dans un registre digne et naturel, sans préciser indûment qu’elle aurait été chantée.
- source_word: δαπανωμένης τῆς θυσίας
  choice: pendant que le sacrifice se consumait
  rationale: 'Le participe présent au génitif exprime ici une action en cours et concomitante : le sacrifice est en train d’être consumé, plutôt que déjà entièrement consumé.'
- source_word: οἵ τε ἱερεῖς καὶ πάντες
  choice: les prêtres et tous les autres
  rationale: La formulation inclut les prêtres et l’ensemble des autres participants sans identifier plus précisément un groupe que le grec ne nomme pas.
- source_word: καταρχομένου Ἰωνάθον
  choice: Jonathan la dirigeait
  rationale: κατάρχομαι peut désigner celui qui commence ou prend la tête d’une action liturgique. « Dirigeait » convient au contexte de prière avec réponse, tout en restant sobre.
- source_word: τῶν τε λοιπῶν ἐπιφωνούντων
  choice: les autres répondaient
  rationale: Le verbe évoque une intervention vocale faisant suite à celle de Jonathan ; « répondaient » rend clairement cette dynamique sans imposer la forme précise d’un chant antiphoné.
- source_word: ὡς Νεεμίου
  choice: comme au temps de Néhémie
  rationale: Le grec est elliptique. Cette formulation présente la scène comme conforme au précédent associé à Néhémie, sans intégrer au corps du texte une reconstruction trop précise.
theological_decisions:
- issue: Portée de la comparaison elliptique ὡς Νεεμίου
  choice: comme au temps de Néhémie
  alternative: comme le fit Néhémie
  rationale: L’expression grecque ne précise pas explicitement si la comparaison porte sur l’époque de Néhémie, sur sa manière d’agir ou sur son rôle de meneur. Le texte retient une formulation historique intelligible et la note conserve l’autre lecture possible.
translation_notes:
  register: Français international moderne, clair et digne. Deux phrases allègent la syntaxe grecque très condensée. L’imparfait rend les actions simultanées en cours pendant que le sacrifice se consumait.
