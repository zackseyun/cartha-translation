lexical_decisions:
- source_word: διʼ ἣν αἰτίαν
  choice: C’est pourquoi
  rationale: Cette tournure rend naturellement en français moderne le lien causal avec l’événement précédent.
- source_word: οὐ μόνον ... δὲ καὶ
