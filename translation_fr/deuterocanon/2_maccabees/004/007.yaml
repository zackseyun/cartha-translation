  text: But when Seleucus passed from life[a], and Antiochus, the one called Epiphanes, took over the kingdom,
translation:
  language: fr
  text: Mais lorsque Séleucos eut quitté cette vie[a] et qu’Antiochos, surnommé Épiphane, eut pris possession du royaume,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en grec : « eut changé de vie », expression euphémistique signifiant que Séleucos mourut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μεταλλάξαντος … τὸν βίον
  choice: eut quitté cette vie
  rationale: L’expression grecque est un euphémisme désignant la mort. Cette traduction conserve sa formulation indirecte tout en restant naturelle en français moderne.
- source_word: παραλαβόντος
  choice: eut pris possession
  rationale: Dans le contexte d’une succession royale, le participe indique qu’Antiochos accède au pouvoir et prend en charge le royaume.
- source_word: τὴν βασιλείαν
  choice: du royaume
  rationale: βασιλεία peut désigner la royauté, le pouvoir royal ou le royaume. Ici, « royaume » convient à l’idée d’un domaine royal reçu lors de la succession, sans exclure la notion de pouvoir.
- source_word: Σελεύκου
  choice: Séleucos
  rationale: Forme française usuelle du nom grec.
- source_word: Ἀντιόχου
  choice: Antiochos
  rationale: Forme française usuelle du nom grec.
- source_word: τοῦ προσαγορευθέντος
  choice: surnommé
  rationale: Le participe introduit l’épithète royale d’Antiochos ; « surnommé » est concis, naturel et précis.
- source_word: Ἐπιφανοῦς
  choice: Épiphane
  rationale: Forme française traditionnelle de l’épithète royale grecque, conservée comme nom propre plutôt que traduite.
