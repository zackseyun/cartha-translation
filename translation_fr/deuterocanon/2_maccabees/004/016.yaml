base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/016.yaml
  text: 'For this reason a harsh crisis surrounded them: those whose ways they envied and whom they wanted to imitate became their enemies and punishers[a][b].'
translation:
  language: fr
  text: 'C’est pour cette raison[a] qu’une terrible détresse les cerna : ceux dont ils enviaient le mode de vie[b] et auxquels ils voulaient ressembler devinrent leurs ennemis et ceux qui les châtiaient.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à cause de ceux-ci » ; l’expression grecque peut désigner plus précisément les personnes qui viennent d’être mentionnées comme la cause de la détresse qui s’ensuit.
    reason: lexical_alternative
  - marker: b
    text: Ou « les coutumes » ou « la manière de vivre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν καὶ χάριν
  choice: C’est pour cette raison
  rationale: La locution χάριν avec le génitif exprime ici la cause. Cette formulation française est naturelle et renvoie au contexte précédent, tandis qu’une note conserve la possibilité d’un renvoi plus précis aux personnes mentionnées.
- source_word: περιεῖχεν
  choice: cerna
  rationale: Le verbe évoque ce qui entoure ou enferme. « Cerna » conserve cette image tout en convenant naturellement à une détresse qui se referme sur quelqu’un.
- source_word: χαλεπὴ περίστασις
  choice: une terrible détresse
  rationale: περίστασις désigne ici une situation critique ou une affliction pressante, et χαλεπή en souligne la gravité. « Terrible détresse » rend clairement cette intensité sans réduire l’expression à une circonstance neutre.
- source_word: ἐζήλουν
  choice: enviaient
  rationale: Le verbe peut exprimer le zèle, l’émulation ou l’envie. Dans le contexte de l’adoption réprouvée de pratiques étrangères, « enviaient » garde la coloration négative et le désir d’imitation.
- source_word: τὰς ἀγωγὰς
  choice: le mode de vie
  rationale: ἀγωγή peut désigner la conduite, les usages ou la manière de vivre. Le singulier collectif français « le mode de vie » rend naturellement l’ensemble des pratiques convoitées.
- source_word: καθʼ ἃ ἤθελον ἐξομοιοῦσθαι
  choice: auxquels ils voulaient ressembler
  rationale: ἐξομοιόομαι signifie se rendre semblable ou se conformer. La formulation retenue respecte le renvoi aux personnes sans imposer une seule catégorie de pratiques.
- source_word: πολεμίους
  choice: leurs ennemis
  rationale: Rendu direct du terme désignant des adversaires hostiles.
- source_word: τιμωρητὰς
  choice: ceux qui les châtiaient
  rationale: τιμωρητής désigne celui qui inflige une peine ou exerce une vengeance. Cette tournure est plus naturelle en français moderne que « châtieurs » et évite la connotation excessivement positive de « justiciers ».
- source_word: ἔσχον
  choice: devinrent
  rationale: Le grec dit littéralement qu’ils les « eurent » comme ennemis et agents de châtiment. « Devinrent » exprime clairement en français le retournement de leur relation.
theological_decisions:
- issue: Portée morale de l’adoption des pratiques étrangères
  choice: 'Le verset présente un retournement chargé d’ironie : les personnes dont le mode de vie était envié deviennent ennemies et infligent le châtiment.'
  alternative: Présenter plus neutralement les personnes admirées comme de futurs adversaires.
  rationale: Les termes ἐζήλουν et τιμωρητάς, ainsi que le mouvement de la phrase, soutiennent l’idée d’une rétribution ironique. La traduction en conserve la force morale sans préciser davantage la nature ou l’origine théologique du châtiment.
translation_notes:
  register: Français international moderne, digne et accessible. « Terrible détresse les cerna » conserve l’image grecque de l’affliction qui entoure, tandis que « ceux qui les châtiaient » évite un substantif français rare sans effacer la notion de peine ou de rétribution.
