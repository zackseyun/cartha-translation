revisions:
- from: Mais comme les foules se soulevaient et se remplissaient de colère, Lysimaque arma environ trois mille hommes[a] et se lança dans des violences injustes[b], sous la conduite d’un certain Auranus, avancé en âge, mais non moins en ignorance[c].
  to: Mais, tandis que les foules se soulevaient et se remplissaient de colère, Lysimaque arma environ trois mille hommes[a] et commença à commettre des actes de violence injustes[b], avec un certain Auranus à leur tête, homme avancé en âge et non moins ignorant[c].
  rationale: La révision améliore l’idiomaticité française et resserre le lien syntaxique entre Auranus et les hommes armés, sans modifier le sens. Elle maintient explicitement le jugement moral de ἀδίκων et l’ironie finale, tout en corrigeant l’explication de l’idiome grec dans la note.
