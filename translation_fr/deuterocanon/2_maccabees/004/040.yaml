base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/040.yaml
  text: But when the crowds were rising up and being filled with anger[a], Lysimachus armed about three thousand men and began unjust violence, with a certain Auranus taking the lead[c][b], a man advanced in age and no less in ignorance.
translation:
  language: fr
  text: Mais, tandis que les foules se soulevaient et se remplissaient de colère, Lysimaque arma environ trois mille hommes[a] et commença à commettre des actes de violence injustes[b], avec un certain Auranus à leur tête, homme avancé en âge et non moins ignorant[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le nombre est approximatif ; on pourrait aussi traduire : « quelque trois mille hommes ».'
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie littéralement l’expression « mains injustes », une formule qui désigne le déclenchement d’actes violents et injustes.
    reason: idiom_explanation
  - marker: c
    text: 'La formulation grecque établit un parallèle ironique : Auranus était « avancé en âge » et non moins ignorant.'
    reason: rhetorical_clarification
lexical_decisions:
- source_word: ἐπεγειρομένων
  choice: se soulevaient
  rationale: Le verbe décrit les foules qui s’agitent et passent à l’action. « Se soulevaient » conserve cette idée de mouvement collectif sans préciser une cause extérieure.
- source_word: ὄχλων
  choice: les foules
  rationale: « Foules » reste neutre, contrairement à « émeutiers » ou « populace », qui ajouteraient un jugement absent du nom grec.
- source_word: ταῖς ὀργαῖς διεμπιπλαμένων
  choice: se remplissaient de colère
  rationale: Cette formulation rend naturellement l’intensification exprimée par le verbe grec, tout en conservant le sens direct de ὀργή.
- source_word: καθοπλίσας
  choice: arma
  rationale: Le participe indique que Lysimaque équipa ces hommes d’armes avant de déclencher la violence.
- source_word: πρὸς τρισχιλίους
  choice: environ trois mille hommes
  rationale: Devant un nombre, πρός peut marquer une approximation ; « environ » rend explicitement cette nuance.
- source_word: κατήρξατο χειρῶν ἀδίκων
  choice: se lança dans des violences injustes
  rationale: L’expression signifie littéralement qu’il « commença des mains injustes ». La traduction restitue l’idée d’actions violentes et condamnables dans un français naturel.
- source_word: προηγησαμένου
  choice: sous la conduite
  rationale: Le génitif absolu présente Auranus comme celui qui mène les hommes ou ouvre la voie dans cette action.
- source_word: τινὸς Αὑρανοῦ
  choice: un certain Auranus
  rationale: τινός introduit un personnage peu connu ou non présenté auparavant ; « un certain » conserve cette fonction discursive.
- source_word: προβεβηκότος τὴν ἡλικίαν
  choice: avancé en âge
  rationale: Expression française digne et courante pour indiquer qu’Auranus était âgé.
- source_word: οὐδὲν δὲ ἧττον καὶ τὴν ἄγνοιαν
  choice: mais non moins en ignorance
  rationale: 'Cette tournure conserve le parallélisme ironique du grec : Auranus était avancé en âge, et tout autant dans l’ignorance.'
theological_decisions:
- issue: Portée morale de ἀδίκων
  choice: Conserver explicitement le jugement « injustes ».
  alternative: Employer seulement « violences » ou « recours à la force ».
  rationale: Le grec qualifie expressément ces actes d’injustes ; supprimer ce terme atténuerait le jugement narratif.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase garde l’enchaînement du grec tout en évitant un calque obscur de l’expression « mains injustes ». Le contraste final est volontairement concis afin de préserver l’ironie de l’original.
