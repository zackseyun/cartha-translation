  source_fidelity: La tournure « On vit ... atteindre » transforme la construction existentielle grecque (ἦν ... ἀκμή) en constat narratif et introduit un sujet implicite absent du texte. Une formulation existentielle rend plus directement la syntaxe et le développement conjoint de l’hellénisme et de l’ἀλλοφυλισμός.
  naturalness: Le français proposé est globalement naturel et de registre approprié. « Il y eut un tel essor ... et une telle pénétration ... » est à la fois idiomatique et plus parallèle au grec que « On vit ... atteindre ... et ... gagner ».
  terminology: « Hellénisme », « impie » et « grand prêtre » conviennent. « Coutumes étrangères » rend naturellement l’ἀλλοφυλισμός tout en laissant à la note l’explicitation contextuelle de pratiques non juives. « Pénétration » conserve la valeur d’avancée/irruption de πρόσβασις sans la réduire à une simple augmentation quantitative.
