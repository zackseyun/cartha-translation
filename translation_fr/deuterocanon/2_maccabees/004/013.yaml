base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/013.yaml
  text: And there was such a height of Hellenism and an increase of foreign ways because of the surpassing shamelessness of Jason[a], who was ungodly and not the high priest,
translation:
  language: fr
  text: Il y eut alors un tel essor de l’hellénisme et une telle pénétration de coutumes étrangères[a], à cause de l’impudence sans bornes de Jason, cet impie qui n’était pas grand prêtre,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une telle percée de pratiques étrangères ». Le terme grec rare évoque la progression de pratiques non juives.'
    reason: Alternative lexicale pour πρόσβασις et clarification contextuelle de ἀλλοφυλισμός.
lexical_decisions:
- source_word: ἀκμή
  choice: sommet
  rationale: Le nom désigne le point culminant d’un développement. « Atteindre un tel sommet » conserve cette image dans un français naturel.
- source_word: Ἑλληνισμός
  choice: hellénisme
  rationale: Le terme vise ici l’adoption de la culture et du mode de vie grecs, et non la seule appartenance ethnique. « Hellénisme » en préserve la portée historique.
- source_word: πρόσβασις
  choice: gagner tant de terrain
  rationale: Dans ce contexte, ce nom rare évoque une avancée ou une pénétration croissante. Cette tournure française rend clairement le mouvement d’expansion sans imposer un sens trop technique.
- source_word: ἀλλοφυλισμός
  choice: pratiques étrangères
  rationale: Ce terme rare désigne l’adoption de manières de vivre non juives. « Pratiques étrangères » exprime cette dimension culturelle et religieuse dans une langue accessible.
- source_word: διὰ
  choice: à cause de
  rationale: Avec l’accusatif, la préposition indique ici la cause.
- source_word: ἀσεβοῦς
  choice: impie
  rationale: L’adjectif porte un jugement religieux sévère sur Jason. « Impie » est concis, digne et fidèle à cette condamnation.
- source_word: οὐκ ἀρχιερέως
  choice: qui n’était pas grand prêtre
  rationale: La formulation conserve la négation directe et polémique de la qualité de grand prêtre, sans ajouter « véritable » dans le texte.
- source_word: ὑπερβάλλουσαν ἀναιδείαν
  choice: impudence sans bornes
  rationale: Cette expression française naturelle rend à la fois l’absence de honte exprimée par ἀναιδεία et l’intensification portée par ὑπερβάλλουσαν.
theological_decisions:
- issue: Portée de οὐκ ἀρχιερέως appliqué à Jason
  choice: '« qui n’était pas grand prêtre » : l’auteur lui dénie directement cette qualité.'
  alternative: « qui n’était pas un véritable grand prêtre » ou « qui n’avait rien d’un grand prêtre »
  rationale: Le grec formule une dénonciation abrupte de la légitimité de Jason. La traduction garde cette tension sans préciser à la place de l’auteur s’il s’agit exclusivement d’une illégitimité juridique, cultuelle ou morale.
translation_notes:
  register: Français moderne international, soutenu mais accessible. La phrase demeure ouverte par une virgule, comme le segment grec fourni, qui se poursuit au verset suivant.
