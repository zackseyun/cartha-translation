  yaml_path: translation/deuterocanon/2_maccabees/004/004.yaml
  text: When Onias saw the severity of the rivalry[a], and that Apollonius son of Menestheus, the governor of Coele-Syria and Phoenicia, was increasing Simon’s wickedness[b],
translation:
  language: fr
  text: Onias, voyant combien le conflit était grave[a] et qu’Apollonios, fils de Ménesthée, gouverneur de Cœlé-Syrie et de Phénicie[b], contribuait à accroître la méchanceté de Simon,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « combien la rivalité était grave » ou « combien la discorde était grave ».
    reason: lexical_alternative
  - marker: b
    text: Le mot grec peut aussi signifier « général » ou « commandant » ; le contexte territorial favorise ici « gouverneur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: συνορῶν
  choice: voyant
  rationale: Le participe exprime la circonstance qui motive l’action d’Onias au verset suivant. « Voyant » est naturel et garde le lien syntaxique avec la suite.
- source_word: τὸ χαλεπὸν τῆς φιλονεικίας
  choice: combien le conflit était grave
  rationale: La tournure restitue la valeur substantive de τὸ χαλεπόν et le caractère sérieux de la φιλονεικία, sans réduire celle-ci à une simple querelle ponctuelle.
- source_word: Ἀπολλώνιον Μενεσθέως
  choice: Apollonios, fils de Ménesthée
  rationale: Le génitif patronymique est explicité selon l’usage français courant.
- source_word: στρατηγόν
  choice: gouverneur
  rationale: Dans ce contexte territorial et administratif, le titre désigne le responsable de la Cœlé-Syrie et de la Phénicie, bien que le mot puisse aussi avoir un sens militaire.
- source_word: συναύξοντα
  choice: attisant
  rationale: Le verbe indique qu’Apollonios contribue à accroître le mal perpétré par Simon. « Attisant » rend cette aggravation de façon idiomatique.
- source_word: κακίαν
  choice: méchanceté
  rationale: Le terme conserve la portée morale de κακία sans la limiter à la seule malveillance intérieure.
