  text: They were indignant and deeply grieved over the man's unjust murder. But when the king returned from the regions of Cilicia[a], the Jews in the city appealed to him, and the Greeks as well, sharing in their hatred of the wicked deed,
translation:
  language: fr
  text: Ils étaient indignés et profondément affligés par le meurtre injuste de cet homme. Mais lorsque le roi revint des régions de Cilicie, les Juifs de la ville lui présentèrent leur requête, tandis que les Grecs s’associaient eux aussi à leur haine de cet acte odieux[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les Grecs aussi se joignaient à eux pour détester cet acte mauvais ». Le participe grec rare συμμισοπονηρούντων est très condensé et peut se rendre de plusieurs manières proches.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδείναζον
  choice: étaient indignés
  rationale: Le verbe exprime ici une vive réaction de douleur et de réprobation morale; « indignés » convient à son association avec ἐδυσφόρουν sans faire doublon.
- source_word: ἐδυσφόρουν
  choice: profondément affligés
  rationale: Le verbe signifie supporter péniblement, être vivement troublé ou peiné. Cette formulation rend la dimension douloureuse qui complète l’indignation.
- source_word: ἐπὶ τῷ τοῦ ἀνδρὸς ἀδίκῳ φόνῳ
  choice: par le meurtre injuste de cet homme
  rationale: φόνος désigne un meurtre, et ἄδικος en souligne le caractère injuste. « Cet homme » renvoie naturellement en français à la personne déjà mentionnée dans le contexte.
- source_word: ἐπανελθόντος
  choice: lorsque le roi revint
  rationale: Le génitif absolu a une valeur temporelle; une proposition introduite par « lorsque » est naturelle et fidèle en français.
- source_word: τῶν κατὰ Κιλικίαν τόπων
  choice: des régions de Cilicie
  rationale: La tournure désigne de manière générale les territoires ou localités de Cilicie.
- source_word: ἐνετύγχανον
  choice: lui présentèrent leur requête
  rationale: Dans le contexte d’un recours auprès d’un souverain, le verbe signifie s’adresser à lui pour le solliciter ou porter plainte. Le pronom « lui », implicite en grec, désigne clairement le roi.
- source_word: οἱ κατὰ πόλιν Ἰουδαῖοι
  choice: les Juifs de la ville
  rationale: Cette expression désigne les Juifs qui résidaient dans la ville; la formulation est concise et idiomatique.
- source_word: συμμισοπονηρούντων καὶ τῶν Ἑλλήνων
  choice: tandis que les Grecs s’associaient eux aussi à leur haine de cet acte odieux
  rationale: Le composé rare indique que les Grecs se joignaient aux Juifs dans leur détestation du mal commis. La tournure participiale grecque est rendue par une subordonnée circonstancielle sans en faire artificiellement un second verbe principal.
