  yaml_path: translation/deuterocanon/2_maccabees/004/023.yaml
  text: But after a period of three years[a], Jason sent Menelaus, the brother of the aforementioned Simon, to carry the money to the king and to deliver memoranda concerning necessary matters.
translation:
  language: fr
  text: Après trois ans, Jason envoya Ménélas, le frère de Simon déjà mentionné, porter l’argent au roi et traiter des mémorandums concernant des affaires nécessaires[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « finaliser des rapports écrits concernant des affaires nécessaires ». Le mot grec peut désigner des mémorandums, des notes ou des rapports écrits, et la portée administrative exacte de l’expression reste incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τριετῆ χρόνον
  choice: Après trois ans
  rationale: μετά avec l’accusatif exprime ici le temps écoulé. La transition légère marquée par δέ n’a pas besoin d’être rendue explicitement en français dans ce contexte narratif.
- source_word: ἀπέστειλεν
  choice: envoya
  rationale: Équivalent narratif direct et naturel de l’aoriste de ἀποστέλλω.
- source_word: Μενέλαον
  choice: Ménélas
  rationale: Forme française traditionnelle du nom grec Μενέλαος.
- source_word: τὸν τοῦ προσηνομένου Σίμωνος ἀδελφόν
  choice: frère de Simon mentionné plus haut
  rationale: προσηνομένου renvoie à une mention antérieure de Simon. Cette formulation est claire et moins administrative que « susmentionné ».
- source_word: παρακομίζοντα τὰ χρήματα τῷ βασιλεῖ
  choice: porter l’argent au roi
  rationale: Le participe indique la mission confiée à Ménélas. χρήματα désigne ici des fonds, rendus naturellement par « l’argent ».
- source_word: περὶ πραγμάτων ἀναγκαίων
  choice: concernant des affaires nécessaires
  rationale: La formulation conserve la généralité de πράγματα et le sens de nécessité porté par ἀναγκαίων, sans préciser indûment la nature ou l’urgence de ces affaires.
- source_word: ὑπομνηματισμοὺς τελέσοντα
  choice: mener à terme des mémorandums
  rationale: ὑπομνηματισμός peut désigner des mémorandums, notes ou rapports écrits, tandis que τελέω exprime leur exécution ou leur achèvement. Le choix maintient le caractère administratif et l’incertitude exacte de l’expression.
