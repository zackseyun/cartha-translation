    issue: La locution « mener à terme des mémorandums » est trop restrictive et peu naturelle.
    rationale: Elle présente les mémorandums comme des documents que Ménélas devait finir de rédiger. Le grec permet une fonction administrative plus générale ; « traiter » préserve cette indétermination.
  - severity: low
    issue: La formulation « frère de Simon mentionné plus haut » peut produire une légère hésitation de rattachement.
    rationale: « le frère de Simon déjà mentionné » établit plus clairement que « déjà mentionné » qualifie Simon.
  revised_text: Après trois ans, Jason envoya Ménélas, le frère de Simon déjà mentionné, porter l’argent au roi et traiter des mémorandums concernant des affaires nécessaires[a].
