base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/032.yaml
  text: But Menelaus[a], thinking that he had found a favorable opportunity, embezzled some of the gold vessels of the temple and gave them as a gift to Andronicus[b], and he had managed to sell others in Tyre and the surrounding cities.
translation:
  language: fr
  text: Mais Ménélas, estimant avoir trouvé une occasion favorable, détourna certains objets en or[a] appartenant au Temple et les offrit à Andronicos ; il avait déjà vendu d’autres objets à Tyr et dans les villes des environs.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « certains articles en or » ou « certains objets d’or ». Le terme grec désigne de façon générale des objets en or appartenant au Temple.
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « il se trouvait en avoir vendu d’autres à Tyr et aux villes des alentours ». La tournure grecque indique que d’autres objets avaient déjà été vendus dans cette région.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίσας
  choice: estimant
  rationale: Le participe aoriste exprime l’appréciation subjective de Ménélas; « estimant » est naturel et conserve cette nuance.
- source_word: καιρὸν εὐφυῆ
  choice: une occasion favorable
  rationale: L’expression désigne une circonstance particulièrement propice ou avantageuse.
- source_word: χρυσώματά τινα
  choice: certains objets en or
  rationale: Le terme désigne de manière générale des objets d’or; « objets » évite de préciser sans preuve qu’il s’agissait nécessairement de vases cultuels.
- source_word: τῶν τοῦ ἱεροῦ
  choice: appartenant au Temple
  rationale: Le génitif marque l’appartenance de ces objets au sanctuaire; la majuscule identifie ici le Temple de Jérusalem.
- source_word: νοσφισάμενος
  choice: détourna
  rationale: Le verbe exprime l’appropriation frauduleuse d’un bien qui ne lui appartenait pas. « Détourna » convient à des biens sacrés confiés à une institution sans imposer un vocabulaire juridique moderne trop étroit.
- source_word: ἐχαρίσατο
  choice: les offrit
  rationale: Le moyen de χαρίζομαι indique qu’il les donna comme présent ou faveur; « offrit » rend cette valeur avec concision.
- source_word: ἐτύγχανεν πεπρακὼς
  choice: il se trouvait aussi qu’il en avait vendu
  rationale: Cette tournure conserve la nuance incidente de τυγχάνω et l’antériorité du participe parfait, sans transformer celle-ci en idée de réussite ou d’habileté.
- source_word: ἕτερα
  choice: d’autres
  rationale: Le pronom renvoie naturellement à d’autres objets en or appartenant au Temple.
- source_word: εἴς τε Τύρον καὶ τὰς κύκλῳ πόλεις
  choice: à Tyr et dans les villes des environs
  rationale: Le grec emploie εἰς, mais le contexte évoque les lieux ou débouchés de la vente; cette formulation française reste fluide tout en signalant Tyr et les villes alentour.
theological_decisions:
- issue: Nature de la faute de Ménélas envers les biens du Temple
  choice: « détourna » souligne l’appropriation frauduleuse de biens sacrés
  alternative: « vola » ou « s’appropria indûment »
  rationale: Le texte condamne clairement l’usage illégitime des biens du Temple. « Détourna » préserve cette gravité sans ajouter une qualification doctrinale ni réduire le verbe à un simple vol matériel.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase grecque a été légèrement répartie en deux phrases pour éviter une coordination lourde. « Temple » est employé plutôt que « sanctuaire » pour la clarté du contexte, tandis que « objets en or » préserve l’étendue lexicale du grec.
