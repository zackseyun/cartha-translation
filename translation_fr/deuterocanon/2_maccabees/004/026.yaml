  text: And Jason[a], who had supplanted his own brother, having himself been supplanted by another, fled and went into the land of the Ammonites.
translation:
  language: fr
  text: Quant à Jason[a], qui avait supplanté son propre frère, il fut à son tour supplanté par un autre et s’enfuit au pays des Ammonites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Jason, qui avait évincé son propre frère par des manœuvres, fut à son tour évincé par un autre ». Le grec emploie le même verbe à l’actif puis au passif pour souligner l’ironie du renversement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπονοθεύσας
  choice: avait supplanté
  rationale: « Supplanter » exprime le fait d’évincer quelqu’un par des manœuvres déloyales et convient au contexte où Jason a obtenu la grande prêtrise aux dépens de son frère. Le même verbe est repris au passif pour conserver l’ironie du grec.
- source_word: ὑπονοθευθεὶς
  choice: fut à son tour supplanté
  rationale: La répétition de « supplanter » reproduit la symétrie active-passive du grec, tandis que « à son tour » met naturellement en relief le renversement ironique.
- source_word: φυγάς
  choice: s’enfuit
  rationale: Cette formulation française naturelle restitue l’idée qu’il partit en fugitif, sans alourdir la phrase par « comme fugitif ».
- source_word: ὑπῆλθεν
  choice: au pays
  rationale: Le mouvement exprimé par ὑπῆλθεν est intégré à « s’enfuit au pays », tournure idiomatique qui garde clairement la destination.
- source_word: τὴν Ἀμμανῖτιν χώραν
  choice: le pays des Ammonites
  rationale: Cette traduction rend naturellement l’adjectif ethnique et χώρα, tout en identifiant clairement le territoire concerné.
- source_word: ὁ τὸν ἴδιον ἀδελφὸν
  choice: son propre frère
  rationale: « Propre » correspond à ἴδιον et souligne la gravité de l’action commise contre un membre de sa famille.
