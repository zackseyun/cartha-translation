base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/019.yaml
  text: Jason the vile man sent Antiochians from Jerusalem as envoys, carrying three hundred silver drachmas for the sacrifice to Heracles; but those who carried them requested that they not be used for sacrifice,
translation:
  language: fr
  text: Jason, cet homme abominable, envoya des Antiochiens comme délégués de Jérusalem[a], chargés de porter trois cents drachmes d’argent pour le sacrifice d’Héraclès ; mais ces derniers demandèrent qu’elles ne soient pas utilisées pour le sacrifice,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme venant de Jérusalem » ; l’expression peut souligner qu’ils étaient envoyés en qualité de représentants de Jérusalem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μιερὸς
  choice: cet homme abominable
  rationale: L’adjectif rare et fortement péjoratif exprime une souillure morale ou religieuse. « Abominable » conserve la condamnation explicite du narrateur dans un français actuel et digne.
- source_word: θεωρούς
  choice: comme délégués
  rationale: Le terme désigne des représentants officiels, notamment envoyés à une fête ou à une cérémonie religieuse. « Délégués » rend cette fonction sans imposer un terme cultuel technique.
- source_word: ὡς ἀπʼ Ἱεροσολύμων
  choice: de Jérusalem
  rationale: La formule peut indiquer une provenance présentée ou une capacité représentative. Le texte principal reste naturel, tandis que la note conserve la nuance de ὡς.
- source_word: Ἀντιοχέας
  choice: des Antiochiens
  rationale: L’accusatif pluriel désigne des personnes liées à Antioche. « Antiochiens » reproduit directement cet ethnonyme.
- source_word: παρακομίζοντας
  choice: avec … / ceux qui transportaient
  rationale: Le participe décrit l’acheminement de l’argent. La formulation française évite une construction lourde tout en conservant l’idée de transport.
- source_word: ἀργυρίου δραχμὰς τριακοσίους
  choice: trois cents drachmes d’argent
  rationale: Cette expression garde à la fois le nombre, l’unité monétaire et la mention de l’argent métal.
- source_word: εἰς τὴν τοῦ Ἡρακλέους θυσίαν
  choice: destinées au sacrifice offert à Héraclès
  rationale: La traduction exprime clairement l’affectation des fonds et identifie Héraclès comme destinataire du sacrifice.
- source_word: ἠξίωσαν
  choice: demandèrent
  rationale: Dans ce contexte, le verbe exprime une requête. « Demandèrent » en conserve la force sans la transformer en exigence catégorique.
- source_word: μὴ χρησθαι εἰς θυσίαν
  choice: qu’elle ne soit pas utilisée pour un sacrifice
  rationale: Le singulier « cette somme » fournit en français un antécédent naturel et rend fidèlement l’interdiction d’affecter les fonds à un sacrifice.
theological_decisions:
- issue: Jugement moral du narrateur dans μιερὸς
  choice: Conserver une condamnation explicite avec « cet homme abominable »
  alternative: « cet homme souillé » ou « cet impie »
  rationale: La condamnation appartient au texte grec lui-même. Il faut donc la préserver sans l’atténuer ni lui ajouter une qualification doctrinale étrangère.
- issue: Portée de ὡς dans ὡς ἀπʼ Ἱεροσολύμων
  choice: Lecture de provenance ou de représentation dans le texte, avec ambiguïté signalée en note
  alternative: « comme venant de Jérusalem » ou « au nom de Jérusalem »
  rationale: Le grec peut marquer une provenance présentée comme telle ou une qualité représentative. La note évite de résoudre silencieusement cette tension.
translation_notes:
  register: Français international moderne, clair et digne. La phrase demeure inachevée par une virgule, conformément à l’extrait grec fourni, qui se poursuit au verset ou segment suivant.
