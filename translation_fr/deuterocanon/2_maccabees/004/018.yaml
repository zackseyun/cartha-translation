  text: Pendant que se tenaient à Tyr les jeux quadriennaux[a], en présence du roi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec πενταετηρικοῦ signifie littéralement « de cinq ans », mais, dans le vocabulaire des fêtes, il désigne couramment des jeux célébrés tous les quatre ans selon le comptage inclusif.
