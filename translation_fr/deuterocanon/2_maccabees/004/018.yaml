lexical_decisions:
- source_word: Ἀγομένου
  choice: Pendant que se tenaient
  rationale: Le génitif absolu de ἄγω décrit ici la tenue d’un concours ou de jeux. Cette tournure française restitue naturellement à la fois le cadre temporel et le déroulement de l’événement.
- source_word: πενταετηρικοῦ
  choice: quadriennaux
  rationale: Bien que le mot soit littéralement lié à une période de cinq ans, l’usage grec des fêtes désigne couramment un événement revenant tous les quatre ans selon le comptage inclusif.
- source_word: ἀγῶνος
  choice: les jeux
  rationale: Dans ce contexte de fête civique à Tyr, ἀγών désigne des concours publics. « Les jeux » est naturel et n’ajoute pas une précision exclusivement athlétique absente du verset.
- source_word: ἐν Τύρῳ
  choice: à Tyr
  rationale: Rendu locatif idiomatique du nom de la ville en français.
- source_word: τοῦ βασιλέως παρόντος
  choice: en présence du roi
  rationale: Ce second génitif absolu exprime une circonstance concomitante. La formulation reste concise et conserve le fait que le roi assistait à l’événement.
