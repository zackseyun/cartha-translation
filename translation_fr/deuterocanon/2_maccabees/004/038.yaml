  verdict: revise
  source_fidelity: La traduction rend avec exactitude le déroulement du verset, la tenue de pourpre, l’outrage impie envers Onias, la mise à mort et l’attribution explicite de la rétribution au Seigneur. Toutefois, « le Seigneur lui infligeait ainsi » introduit « ainsi », absent du grec, et l’imparfait affaiblit la valeur du participe aoriste dans le génitif absolu. La note sur ἀπεκόντισεν doit être ancrée au verbe qu’elle explique.
  naturalness: Le français est clair, narratif et d’un registre approprié. « Ôta à Andronicos son manteau de pourpre » est un peu plus direct et idiomatique que « arracha ... à Andronicos », sans ajouter une nuance de violence non certaine.
  terminology: « Andronicos », « Onias », « le Seigneur », « acte impie » et « châtiment qu’il méritait » sont appropriés. « Meurtrier souillé de sang » restitue de façon recevable la force de μιαφόνος; la note en explicite la nuance.
  issues:
