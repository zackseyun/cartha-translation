base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/038.yaml
  text: And[a], inflamed with anger, he immediately stripped off Andronikos's purple robe and tore off his garments, and after leading him around through the whole city to the very place where he had committed his impiety against Onias, there he dispatched the murderer[b], the Lord rendering to him the punishment he deserved.
translation:
  language: fr
  text: Alors, brûlant de colère, il ôta aussitôt à Andronicos son manteau de pourpre et déchira ses vêtements ; puis, après l’avoir conduit à travers toute la ville jusqu’à l’endroit même où il avait commis son acte impie contre Onias, il y mit à mort ce meurtrier souillé de sang[a], le Seigneur lui ayant rendu le châtiment qu’il méritait[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme grec désigne plus fortement qu’un simple « meurtrier » quelqu’un que le sang versé a rendu coupable et souillé.
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec peut évoquer une mise à mort au moyen d’une lance ou d’un autre trait ; ici, le sens certain est qu’il fut exécuté sur place.
    reason: lexical_alternative
lexical_decisions:
- source_word: πυρωθεὶς τοῖς θυμοῖς
  choice: brûlant de colère
  rationale: Conserve l’image du feu portée par πυρωθείς et exprime naturellement l’intensité de θυμός en français moderne.
- source_word: παραχρῆμα
  choice: aussitôt
  rationale: Marque clairement l’immédiateté de l’action et maintient le rythme narratif.
- source_word: τὴν τοῦ Ἀνδρονίκου πορφύραν
  choice: à Andronicos son manteau de pourpre
  rationale: πορφύρα désigne ici vraisemblablement un vêtement pourpre associé au rang; « manteau de pourpre » est naturel sans surspécifier sa forme exacte.
- source_word: τοὺς χιτῶνας περιρρήξας
  choice: déchira ses vêtements
  rationale: χίτων désigne une tunique ou un vêtement; le pluriel général « vêtements » rend clairement la scène, tandis que le préverbe de περιρρήγνυμι évoque l’arrachement déjà exprimé par l’ensemble de l’action.
- source_word: περιαγαγὼν καθʼ ὅλην τὴν πόλιν
  choice: Après l’avoir conduit à travers toute la ville
  rationale: Rend le déplacement public dans l’ensemble de la ville sans imposer l’idée plus interprétative d’une parade officielle.
- source_word: ἐπʼ αὐτὸν τὸν τόπον
  choice: jusqu’à l’endroit même
  rationale: « même » restitue l’insistance d’αὐτόν sur la correspondance exacte du lieu.
- source_word: οὗπερ τὸν Ὀνίαν ἠσέβησεν
  choice: où il avait commis son acte impie contre Onias
  rationale: Préserve la portée religieuse et morale d’ἀσεβέω, plus forte qu’un simple tort causé à Onias.
- source_word: τὸν μιαφόνον
  choice: ce meurtrier souillé de sang
  rationale: Rend à la fois l’idée de meurtre et celle de souillure liée au sang contenues dans le terme fortement chargé μιαφόνος.
- source_word: ἀπεκόντισεν
  choice: mit à mort
  rationale: Le verbe peut évoquer une mise à mort au moyen d’une lance ou d’un trait, mais le contexte n’établit pas assez nettement l’arme; « mit à mort » transmet sûrement le résultat sans fausse précision.
- source_word: τοῦ κυρίου τὴν ἄξιαν αὐτῷ κόλασιν ἀποδόντος
  choice: le Seigneur lui infligeait ainsi le châtiment qu’il méritait
  rationale: Rend explicitement l’attribution de la rétribution au Seigneur et le caractère mérité du châtiment, dans une syntaxe française fluide.
theological_decisions:
- issue: Rendu de κύριος dans l’affirmation du jugement divin
  choice: le Seigneur
  alternative: Dieu; le SEIGNEUR
  rationale: Le grec porte κύριος. « Le Seigneur » conserve directement ce titre sans substituer un autre nom ni introduire la convention typographique réservée ailleurs au tétragramme.
- issue: Rapport entre l’exécution humaine et la rétribution divine
  choice: le Seigneur lui infligeait ainsi le châtiment qu’il méritait
  alternative: le Seigneur lui ayant rendu le châtiment mérité
  rationale: Le génitif absolu attribue explicitement au Seigneur la portée judiciaire de l’événement. La formulation maintient cette tension entre l’acte humain raconté et le jugement divin affirmé, sans les confondre.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases ont été légèrement segmentées pour la lisibilité. Les noms propres suivent les formes françaises usuelles « Andronicos » et « Onias ». Les marqueurs [a] et [b] figurent dans le texte principal.
