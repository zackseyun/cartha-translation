  - severity: low
    issue: « Le Seigneur lui infligeait ainsi » ajoute « ainsi » et emploie un imparfait là où le génitif absolu aoriste présente l’action divine comme rétribution concomitante/accomplie.
    rationale: « Le Seigneur lui ayant rendu le châtiment qu’il méritait » suit de plus près la construction grecque sans alourdir le français.
