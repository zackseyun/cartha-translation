  source_fidelity: Le sens fiscal et administratif de ἀπαίτησις et de πρᾶξις τῶν διαφόρων est bien rendu. « Sommes dues » est une interprétation contextuellement défendable de διάφορα, sans dépasser le sens du passage. La révision rétablit plus clairement la valeur circonstancielle du génitif absolu et conserve le lien causal explicite.
  naturalness: « Relevait de lui » est peu idiomatique en français moderne; « relevait de sa compétence » est naturel et précis. Une ponctuation encadrant l’incise causale rend aussi la période plus fluide.
  terminology: « Sostrate », « commandant de la citadelle », « réclamait le paiement » et « convoqués par le roi » conviennent au registre narratif et au vocabulaire administratif. Aucune question théologique ne se pose.
