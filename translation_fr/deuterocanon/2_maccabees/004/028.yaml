base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/028.yaml
  text: But when Sostratus[a], the commander of the citadel, pressed the claim—for the handling of the revenues belonged to him—for this reason the two men were summoned by the king.
translation:
  language: fr
  text: Mais, comme Sostrate, commandant de la citadelle, réclamait le paiement — car le recouvrement des sommes dues relevait de sa compétence —, tous deux furent convoqués par le roi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιουμένου ... τὴν ἀπαίτησιν
  choice: exigeait le paiement
  rationale: La construction exprime l’action suivie de réclamer ce qui est dû. Dans ce contexte financier, « exigeait le paiement » est naturel et conserve la force de ἀπαίτησις sans supposer l’existence d’une réclamation juridique formelle.
- source_word: Σωστράτου
  choice: Sostrate
  rationale: Forme française traditionnelle et intelligible du nom grec Σώστρατος.
- source_word: τοῦ τῆς ἀκροπόλεως ἐπάρχου
  choice: commandant de la citadelle
  rationale: ἔπαρχος désigne ici le responsable militaire et administratif de la place forte; « commandant » convient au contexte, tandis que « citadelle » rend naturellement ἀκρόπολις.
- source_word: πρὸς τοῦτον γὰρ ἦν ἡ τῶν διαφόρων πρᾶξις
  choice: car le recouvrement des sommes dues relevait de lui
  rationale: πρᾶξις peut désigner l’action de percevoir ou de recouvrer, et διάφορα des sommes ou créances dues. La formulation française exprime la compétence administrative de Sostrate tout en évitant l’imprécis « revenus », qui pourrait suggérer l’ensemble des recettes ordinaires.
- source_word: διʼ ἣν αἰτίαν
  choice: C’est pourquoi
  rationale: Rend directement et naturellement le lien causal explicite.
- source_word: οἱ δύο
  choice: tous deux
  rationale: Le grec renvoie aux deux personnes précédemment mentionnées sans répéter leur identité; « tous deux » garde cette référence concise.
- source_word: ὑπὸ τοῦ βασιλέως προσεκλήθησαν
  choice: furent convoqués par le roi
  rationale: Le passif de προσκαλέω indique une convocation officielle; la voix passive et l’agent royal sont conservés.
