lexical_decisions:
- source_word: θᾶττον
  choice: au plus vite
  rationale: Rend naturellement l’idée de rapidité exprimée par le comparatif employé adverbialement.
- source_word: καταστεῖλαι τὰ πράγματα
  choice: régler la situation
  rationale: Expression française courante qui restitue l’idée de ramener les affaires troublées à l’ordre sans surinterpréter le moyen employé.
- source_word: τὸν διαδεχόμενον
  choice: pour le remplacer
  rationale: Le participe substantivé désigne ici celui qui prend la relève du roi pendant son absence; cette formulation évite de suggérer nécessairement une succession royale permanente.
- source_word: τῶν ἐν ἀξιώματι κειμένων
  choice: l’un des hauts dignitaires
  rationale: Rend le statut élevé d’Andronicos dans une langue moderne et digne.
