base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/010.yaml
  text: And when the king had given his approval, and he had gained control of the office, he immediately shifted his countrymen over to the Greek way of life.
translation:
  language: fr
  text: Après avoir obtenu l’accord du roi et pris possession de la charge, il amena aussitôt ses compatriotes à adopter le mode de vie grec[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le caractère grec » ou « l’empreinte grecque »; l’expression évoque l’adoption des modèles et des coutumes de la culture grecque.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπινεύσαντος
  choice: après avoir obtenu l’accord du roi
  rationale: Le génitif absolu exprime l’assentiment préalable du roi. « Obtenir l’accord » rend naturellement en français la valeur officielle de l’approbation.
- source_word: ἀρχῆς κρατήσας
  choice: pris possession de la charge
  rationale: L’expression indique que Jason a obtenu la maîtrise effective de la fonction convoitée. « Charge » conserve la portée institutionnelle de ἀρχή sans préciser dans le corps du verset ce que le grec laisse au contexte.
- source_word: εὐθέως
  choice: aussitôt
  rationale: Ce terme marque le caractère immédiat de l’action qui suit l’accession de Jason à la charge.
- source_word: ὁμοφύλους
  choice: ses compatriotes
  rationale: Le mot désigne ceux qui appartiennent au même peuple que Jason. « Ses compatriotes » garde cette dimension collective sans introduire une désignation absente de l’expression grecque.
- source_word: μετέστησε
  choice: amena … à adopter
  rationale: Le verbe est causatif et décrit un changement d’orientation imposé ou provoqué. Cette formulation française exprime clairement le passage à de nouvelles pratiques culturelles.
- source_word: Ἑλληνικὸν χαρακτῆρα
  choice: le mode de vie grec
  rationale: Littéralement, l’expression évoque le « caractère » ou l’« empreinte » grecque; dans ce contexte, elle désigne le modèle culturel grec plutôt qu’un trait psychologique.
theological_decisions:
- issue: Portée de l’expression culturellement chargée Ἑλληνικὸν χαρακτῆρα
  choice: le mode de vie grec
  alternative: le caractère grec / l’empreinte grecque
  rationale: La traduction retenue communique le programme d’hellénisation décrit par le texte sans réduire l’expression à quelques coutumes ni lui donner un sens psychologique. La note conserve toutefois l’image concrète du grec.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve l’enchaînement rapide des actions et laisse le contexte identifier la charge ainsi que le sujet implicite, Jason.
