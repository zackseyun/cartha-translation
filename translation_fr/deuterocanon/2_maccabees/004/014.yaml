  yaml_path: translation/deuterocanon/2_maccabees/004/014.yaml
  text: so that the priests were no longer eager for the services of the altar[a], but, despising the temple and neglecting the sacrifices, they hurried to take part in the unlawful exercise in the wrestling school after the summons to the discus throw[b];
translation:
  language: fr
  text: si bien que les prêtres ne montraient plus aucun empressement pour les services de l’autel. Au contraire, méprisant le Temple et négligeant les sacrifices, ils se hâtaient de prendre part, dans la palestre, à la prestation contraire à la Loi[a], après l’appel du disque[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque est difficile. Elle peut aussi désigner une fourniture, une contribution, une prise en charge ou un soutien financier lié aux exercices athlétiques.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « après l’appel du disque », c’est-à-dire après l’invitation à participer à cette épreuve athlétique.'
    reason: cultural_note
lexical_decisions:
- source_word: λειτουργίας
  choice: service
  rationale: Dans ce contexte cultuel, le terme désigne le service sacerdotal accompli à l’autel. « Service » est naturel en français et évite d’importer le sens ecclésiastique plus tardif de « liturgie ».
- source_word: προθύμους
  choice: ne montraient plus aucun empressement
  rationale: Cette formulation exprime la disposition enthousiaste et volontaire indiquée par l’adjectif, en contraste avec la négligence qui suit.
- source_word: νεὼ
  choice: Temple
  rationale: Le mot désigne ici le Temple de Jérusalem. La majuscule signale ce référent particulier sans ajouter d’interprétation.
- source_word: καταφρονοῦντες
  choice: méprisant
  rationale: Le participe grec exprime un mépris actif, et non une simple indifférence.
- source_word: ἀμελοῦντες
  choice: négligeant
  rationale: Le terme indique qu’ils cessent d’accorder aux sacrifices l’attention requise.
- source_word: παλαίστρῃ
  choice: palestre
  rationale: La παλαίστρα est le lieu d’entraînement, notamment à la lutte. « Palestre » conserve la précision historique; le contexte et la note sur le disque éclairent sa fonction athlétique.
- source_word: παρανόμου χορηγίας
  choice: prestation contraire à la Loi
  rationale: χορηγία peut évoquer une prestation, une fourniture ou un soutien, tandis que παράνομος marque son caractère contraire à la loi. « Prestation » maintient une part de l’indétermination du grec, explicitée en note, et « contraire à la Loi » convient au contexte juif sans préciser davantage la nature de l’interdiction.
- source_word: ἔσπευδον μετέχειν
  choice: ils se hâtaient de prendre part
  rationale: La traduction conserve à la fois l’idée de hâte et celle de participation.
- source_word: μετὰ τὴν τοῦ δίσκου πρόσκλησιν
  choice: dès que retentissait l’appel du disque
  rationale: Dans la scène athlétique, πρόσκλησις désigne l’appel invitant les participants à l’épreuve du disque. La tournure française restitue naturellement la valeur temporelle de μετά.
theological_decisions:
- issue: Portée de παρανόμου dans le contexte de l’hellénisation et de la Loi juive
  choice: contraire à la Loi
  alternative: illégale; impie; interdite par la Loi
  rationale: Le récit condamne cette participation comme incompatible avec la Loi ancestrale et les devoirs sacerdotaux. La traduction rend ce cadre sans transformer l’adjectif en qualification doctrinale plus précise telle qu’« impie ».
translation_notes:
  register: Français international moderne, digne et narratif. « Temple » est immédiatement accessible; « palestre », terme historique précis, est maintenu parce que le contexte athlétique et la note [b] en rendent le sens suffisamment clair. La ponctuation en deux phrases allège une longue période grecque sans modifier ses rapports logiques.
