base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/009.yaml
  text: In addition to these things[a], he promised to register another fifty talents beyond the one hundred, if he were granted authority to establish for himself a gymnasium and an enrollment of young men[b], and to enroll those in Jerusalem as Antiochenes.
translation:
  language: fr
  text: En outre, il promit de faire inscrire cinquante talents supplémentaires, en plus des cent, si on lui accordait l’autorisation d’établir pour lui-même un gymnase et une institution de jeunes gens[a], et d’inscrire les habitants de Jérusalem comme Antiochéens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « gymnase » et cette institution de jeunes gens étaient des institutions grecques de formation civique et physique, associées ici à l’hellénisation de Jérusalem.
    reason: cultural_note
  - marker: b
    text: 'Ou : « d’inscrire les habitants de Jérusalem comme citoyens d’Antioche ». Le grec dit littéralement « Antiochéens » et peut désigner une inscription civique ou un statut juridique lié à Antioche.'
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς δὲ τούτοις
  choice: En plus de cela
  rationale: Cette tournure rend clairement la valeur additive de l’expression grecque dans un français courant et digne.
- source_word: ὑποσχεῖτο
  choice: il promit
  rationale: Le verbe exprime ici un engagement financier proposé dans le cadre d’une demande officielle.
- source_word: ἕτερα διαγράψειν πεντήκοντα πρὸς τοῖς ἑκατόν
  choice: faire inscrire cinquante talents supplémentaires, en plus des cent
  rationale: διαγράφειν conserve une nuance administrative d’inscription ou d’enregistrement d’une somme. « Talents » est explicité d’après le contexte monétaire immédiat.
- source_word: ἐὰν ἐπιχορηγηθῇ διὰ τῆς ἐξουσίας αὐτοῦ
  choice: si l’autorisation lui était accordée
  rationale: La formulation française exprime l’octroi officiel demandé à une autorité supérieure sans préciser excessivement le référent du pronom grec.
- source_word: γυμνάσιον
  choice: un gymnase
  rationale: Le terme désigne l’institution grecque de formation physique et civique, importante dans le contexte de l’hellénisation.
- source_word: ἐφηβίαν
  choice: une organisation de jeunes gens
  rationale: ἐφηβία désigne l’institution ou le corps des éphèbes. Cette traduction reste accessible tout en gardant le caractère organisé de cette formation.
- source_word: αὐτῷ συστήσασθαι
  choice: d’établir pour lui-même
  rationale: La formulation préserve la nuance réflexive et l’idée que Jason entend mettre ces institutions en place sous son initiative.
- source_word: τοὺς ἐν Ἱεροσολύμοις Ἀντιοχεῖς ἀναγράψαι
  choice: d’inscrire les habitants de Jérusalem comme Antiochéens
  rationale: ἀναγράφειν appartient au vocabulaire administratif de l’inscription. « Comme Antiochéens » reproduit la désignation grecque sans affirmer un statut juridique plus précis que le texte.
theological_decisions:
- issue: Portée culturelle et politique de Ἀντιοχεῖς
  choice: Antiochéens
  alternative: citoyens d’Antioche
  rationale: Le contexte suggère une affiliation civique liée à Antioche, mais le grec ne précise pas formellement la nature exacte du statut. Le texte principal conserve donc la désignation littérale et la note signale l’interprétation possible.
translation_notes:
  register: Français international moderne, naturel et soutenu sans archaïsme. Les termes historiques nécessaires sont conservés et brièvement expliqués en note.
