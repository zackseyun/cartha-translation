base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/017.yaml
  text: For it is not easy to act wickedly against the divine laws[b][a]; but the time that follows will make these things clear.
translation:
  language: fr
  text: Car il n’est pas facile d’agir avec impiété contre les lois divines[a] ; mais le temps qui suivra mettra tout cela en évidence[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se montrer impie envers les lois divines ». Le verbe grec évoque une conduite irrévérencieuse ou impie.'
    reason: 'Alternative lexicale : elle préserve la nuance religieuse de ἀσεβεῖν sans réduire le terme à une attitude intérieure.'
  - marker: b
    text: 'Ou : « le temps qui suit le montrera ».'
    reason: Variante plus proche de la formulation grecque ὁ ἀκόλουθος καιρὸς δηλώσει ταῦτα.
lexical_decisions:
- source_word: ἀσεβεῖν
  choice: agir avec impiété
  rationale: L’infinitif désigne une conduite impie ou irrévérencieuse, et non une simple disposition intérieure. Cette formulation conserve la dimension religieuse du terme grec.
- source_word: εἰς τοὺς θείους νόμους
  choice: contre les lois divines
  rationale: La préposition marque ici l’orientation hostile de l’action. Le pluriel « lois » et l’adjectif « divines » rendent directement le grec dans ce contexte juif.
- source_word: οὐ ῥᾴδιον
  choice: il n’est pas sans conséquence
  rationale: Une traduction strictement littérale, « il n’est pas facile », risquerait de suggérer une difficulté pratique. Dans le contexte, l’expression avertit plutôt qu’une telle impiété n’est pas une affaire légère, comme le montrera la suite.
- source_word: ὁ ἀκόλουθος καιρός
  choice: la suite des événements
  rationale: L’expression désigne le temps qui suit. En français narratif, « la suite des événements » rend naturellement cette progression temporelle sans lui donner un sens eschatologique.
- source_word: δηλώσει
  choice: le montrera clairement
  rationale: Le verbe signifie rendre clair, manifester ou montrer. Cette formulation garde à la fois l’idée de révélation future et celle de clarification.
theological_decisions:
- issue: Portée de l’affirmation concernant l’impiété envers les lois de Dieu
  choice: L’impiété envers les lois divines n’est pas sans conséquence, et les événements ultérieurs en manifesteront la gravité.
  alternative: Il est simplement difficile, en pratique, d’agir avec impiété contre les lois divines.
  rationale: Le grec peut littéralement se comprendre comme « ce n’est pas facile », mais le contraste avec ce que la suite révélera donne à la phrase la force d’un avertissement moral. La traduction n’explicite toutefois pas un jugement divin au-delà de ce que dit le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation évite l’ambiguïté trompeuse de « il n’est pas facile » tout en conservant, en note, la proximité formelle avec le grec. Le point-virgule maintient le lien argumentatif entre le principe énoncé et sa manifestation dans la suite du récit.
