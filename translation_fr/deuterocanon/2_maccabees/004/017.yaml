  terminology: « Agir avec impiété », « contre les lois divines » et le pluriel « lois » rendent adéquatement ἀσεβεῖν, εἰς τοὺς θείους νόμους. « Divines » convient au contexte juif sans ajouter une formulation confessionnelle.
