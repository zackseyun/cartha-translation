  yaml_path: translation/deuterocanon/2_maccabees/004/012.yaml
  text: For he gladly established a gymnasium under the very citadel[a], and by bringing the noblest of our young men under the Greek cap, he was leading them on.
translation:
  language: fr
  text: Car il se fit un plaisir d’établir un gymnase au pied même de la citadelle et, soumettant les plus éminents parmi nous au pétase[a], il les y conduisait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pétase était un chapeau grec à larges bords, employé ici comme signe visible d’identité hellénistique.
    reason: Explication d’un terme culturel grec peu connu, sans remplacer l’image concrète conservée dans le texte.
lexical_decisions:
- source_word: ἡδέως
  choice: il se fit un plaisir de
  rationale: Cette tournure naturelle rend l’empressement volontaire exprimé par l’adverbe, sans exagérer l’émotion.
- source_word: ὑπʼ αὐτὴν ἀκρόπολιν
  choice: juste au-dessous de la citadelle
  rationale: ὑπό avec l’accusatif a ici un sens spatial, tandis que αὐτήν souligne la proximité immédiate.
- source_word: γυμνάσιον
  choice: gymnase
  rationale: Le mot désigne l’institution hellénistique de formation physique, sociale et culturelle, et non une simple salle de sport moderne.
- source_word: καθίδρυσεν
  choice: établir
  rationale: Le verbe convient à la fondation et à la mise en place durable d’une institution.
- source_word: τοὺς κρατίστους τῶν ἐφʼ ἡμῶν
  choice: les plus éminents des nôtres
  rationale: Cette traduction suit la formulation grecque fournie sans préciser indûment qu’il s’agit de jeunes hommes, nuance qui n’apparaît pas explicitement dans ce libellé du texte source.
- source_word: ὑποτάσσων
  choice: plaçant … sous
  rationale: La construction conserve à la fois l’image concrète de la position sous le couvre-chef et la nuance de soumission portée par le participe.
- source_word: ὑπὸ πέτασον
  choice: sous le pétase
  rationale: Le terme concret est conservé afin de ne pas remplacer le signe visible de l’identité grecque par une paraphrase abstraite sur l’hellénisation.
- source_word: ἦγεν
  choice: il les entraînait dans cette voie
  rationale: L’imparfait grec indique une action en cours; la tournure française garde l’idée de conduite progressive sans transformer l’image en simple déplacement physique.
theological_decisions:
- issue: Assimilation culturelle évoquée par ὑπὸ πέτασον
  choice: Conserver l’image concrète du pétase et suggérer le processus continu par « il les entraînait dans cette voie »
  alternative: Paraphraser par « il les amenait à adopter les coutumes grecques »
  rationale: Le texte nomme un marqueur culturel précis plutôt qu’un mode de vie abstrait. La traduction maintient donc l’image et laisse le contexte porter l’idée d’hellénisation.
- issue: Identité des personnes désignées par τοὺς κρατίστους τῶν ἐφʼ ἡμῶν
  choice: les plus éminents des nôtres
  alternative: les plus éminents de nos jeunes gens
  rationale: La formulation grecque fournie ne contient pas explicitement le mot « jeunes gens ». Le choix retenu préserve cette donnée et évite de résoudre l’identification à partir du seul contexte du gymnase.
translation_notes:
  register: Français international actuel, digne et accessible. « Gymnase » et « pétase » conservent les réalités institutionnelle et culturelle grecques; la note prévient leur compréhension dans leur sens moderne ordinaire.
