revisions:
- from: Car il se fit un plaisir d’établir un gymnase juste au-dessous de la citadelle et, plaçant les plus éminents des nôtres sous le pétase[a], il les entraînait dans cette voie.
  to: Car il se fit un plaisir d’établir un gymnase au pied même de la citadelle et, soumettant les plus éminents parmi nous au pétase[a], il les y conduisait.
  rationale: La révision retire l’ajout « dans cette voie » et rend explicitement la relation entre ὑποτάσσων, « soumettant », et ἦγεν, « il les y conduisait ». Elle conserve l’ambiguïté du groupe désigné par « les plus éminents parmi nous » et ne paraphrase pas le pétase comme une adoption générale des coutumes grecques.
