  text: But the hostility advanced so far that even murders were being committed by one of those approved by Simon,[a]
translation:
  language: fr
  text: Mais l’hostilité alla si loin que même des meurtres étaient commis par l’un de ceux que Simon avait approuvés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par l’intermédiaire d’un certain parmi ceux que Simon avait approuvés ». Le grec laisse la personne indéterminée et précise seulement qu’elle faisait partie de ceux qui avaient été éprouvés et approuvés par Simon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχθρας
  choice: l’hostilité
  rationale: ἔχθρα désigne ici une opposition hostile qui s’aggrave; « hostilité » est naturel et évite de réduire le terme au seul sentiment de haine.
- source_word: ἐπὶ τοσοῦτον προβαινούσης
  choice: alla si loin
  rationale: Cette tournure rend idiomatiquement la progression jusqu’à un degré extrême exprimée par le génitif absolu.
- source_word: διὰ τινος
  choice: par l’un
  rationale: διά avec le génitif indique l’intermédiaire ou l’agent, tandis que τις demeure indéfini; « l’un » s’accorde avec la construction partitive qui suit.
- source_word: τῶν ὑπὸ τοῦ Σίμωνος δεδοκιμασμένων
  choice: de ceux que Simon avait jugés dignes de confiance
  rationale: δεδοκιμασμένων évoque des personnes éprouvées puis approuvées. Cette formulation conserve cette idée sans leur attribuer explicitement une fonction d’agents absente du grec.
- source_word: φόνους
  choice: des meurtres
  rationale: φόνος désigne normalement un homicide coupable; le pluriel du grec est conservé.
- source_word: συντελεῖσθαι
  choice: furent commis
  rationale: Dans ce contexte, le passif exprime l’accomplissement des meurtres; « commettre des meurtres » est la collocation française la plus naturelle.
