base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/022.yaml
  text: And he was received with great splendor by Jason and the city[a], and was welcomed with a torchlight procession and shouts; then in this way he encamped in Phoenicia.
translation:
  language: fr
  text: Jason et la ville lui firent une réception grandiose, et il fut accueilli avec une procession aux flambeaux[a] et des acclamations. Puis, après cet accueil, il établit son camp en Phénicie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec des porteurs de flambeaux ». Le grec désigne littéralement le port cérémoniel de flambeaux, probablement dans le cadre d’une procession publique.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγαλομερῶς
  choice: un accueil grandiose
  rationale: L’adverbe exprime le caractère particulièrement fastueux et solennel de la réception publique. « Grandiose » est naturel en français actuel sans réduire le terme à la seule idée de luxe.
- source_word: ἀποδεχθεὶς
  choice: lui firent un accueil
  rationale: Le participe passif désigne ici la réception officielle du visiteur. La tournure active avec Jason et la ville comme sujets est plus naturelle en français et conserve le sens.
- source_word: τῆς πόλεως
  choice: toute la ville
  rationale: Dans ce contexte d’accueil public, « la ville » désigne collectivement ses habitants ou ses représentants. « Toute la ville » rend naturellement cette portée collective sans introduire un groupe précis.
- source_word: δᾳδουχίας
  choice: une procession aux flambeaux
  rationale: Le nom évoque le port cérémoniel de flambeaux. « Procession aux flambeaux » explicite de façon concise la dimension publique et organisée de l’accueil.
- source_word: βοῶν
  choice: des acclamations
  rationale: Le pluriel désigne de grands cris. Dans une réception officielle, « acclamations » rend leur fonction festive tout en gardant un registre digne.
- source_word: εἰσεδέχθη
  choice: il fut reçu
  rationale: Le verbe exprime l’accueil ou l’admission à l’intérieur. La répétition partielle de l’idée de réception reflète celle du grec tout en distinguant l’accueil général de ses manifestations cérémonielles.
- source_word: εἶθʼ οὕτως
  choice: Après cela
  rationale: L’expression assure principalement la transition vers l’action suivante. « Après cela » est idiomatique et évite le calque obscur « puis ainsi ».
- source_word: κατεστρατοπέδευσεν
  choice: il alla établir son camp
  rationale: Le verbe signifie établir un camp. Avec εἰς, la formulation française exprime à la fois le déplacement vers la Phénicie et l’installation du camp, sans ajouter de détail militaire absent du texte.
- source_word: Φοινίκην
  choice: Phénicie
  rationale: Forme géographique française traditionnelle et actuelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation conserve les deux verbes grecs successifs relatifs à l’accueil, mais emploie une tournure active puis une tournure passive afin d’éviter une lourdeur excessive. Le caractère cérémoniel de la scène reste explicite.
