base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/011.yaml
  text: And he set aside the royal provisions laid down for the Jews through John[a], the father of Eupolemus—the one who had carried out the embassy to the Romans concerning friendship and alliance—and, while abolishing the lawful institutions[b], he introduced unlawful customs.
translation:
  language: fr
  text: Il écarta les dispositions royales bienveillantes établies en faveur des Juifs par l’intermédiaire de Jean[a], père d’Eupolème, celui qui avait mené auprès des Romains la mission diplomatique pour l’amitié et l’alliance; abolissant les institutions légales[b], il introduisait des coutumes contraires à la loi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les mesures royales favorables accordées aux Juifs par l’intermédiaire de Jean ». La construction grecque associe des dispositions établies, leur caractère royal et leur orientation bienveillante envers les Juifs.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’ordre civique légal » ou « la constitution légitime ». Le terme grec peut désigner l’ensemble de l’organisation civique et des institutions reconnues d’une communauté.
    reason: lexical_alternative
  - marker: c
    text: Ou « des coutumes illégales ». Dans ce contexte, l’expression peut faire allusion à ce qui est contraire à la Loi juive, mais le grec ne le précise pas explicitement.
    reason: ambiguity_preservation
lexical_decisions:
- source_word: τὰ κείμενα ... φιλάνθρωπα βασιλικὰ
  choice: les dispositions royales bienveillantes établies
  rationale: Cette formulation rend à la fois le caractère établi ou en vigueur de τὰ κείμενα, la provenance royale de βασιλικά et la faveur exprimée par φιλάνθρωπα, sans réduire ces mesures à de simples concessions.
- source_word: διὰ Ἰωάννου
  choice: par l’intermédiaire de Jean
  rationale: διὰ avec le génitif indique ici la médiation de Jean dans l’établissement de ces dispositions.
- source_word: πρεσβείαν
  choice: la mission diplomatique
  rationale: Le terme désigne une démarche officielle auprès d’une puissance étrangère; cette expression est plus naturelle en français actuel que «ambassade» pour l’action elle-même.
- source_word: φιλίας καὶ συμμαχίας
  choice: l’amitié et l’alliance
  rationale: Ces mots conservent le vocabulaire diplomatique formel du grec.
- source_word: παρώσας
  choice: écarta
  rationale: Le verbe exprime le fait de repousser ou de mettre de côté les dispositions existantes, sans imposer l’idée plus précise d’une annulation juridique formelle.
- source_word: νομίμους ... πολιτίας
  choice: les institutions légales
  rationale: πολιτεία désigne ici l’ordre civique ou constitutionnel établi; «institutions» en préserve l’ampleur sans le réduire à une forme particulière de gouvernement.
- source_word: καταλύων
  choice: abolissant
  rationale: Le participe exprime la suppression active de l’ordre existant.
- source_word: παρανόμους ἔθισμους
  choice: des coutumes contraires à la Loi
  rationale: Dans ce contexte juif, παράνομος évoque vraisemblablement ce qui transgresse la Loi, tandis que ἔθισμοι désigne des coutumes ou pratiques établies.
- source_word: ἐκαίνιζεν
  choice: il introduisait
  rationale: L’imparfait français reflète l’aspect imperfectif du grec et le verbe exprime l’instauration de nouveautés.
theological_decisions:
- issue: Portée de πολιτεία dans le contexte juif
  choice: institutions légales
  alternative: ordre civique légal; constitution légitime
  rationale: Le passage vise l’organisation publique et normative des Juifs. «Institutions légales» garde cette portée large sans projeter une structure politique moderne précise.
- issue: Sens de παράνομος par rapport à la Torah
  choice: contraires à la Loi
  alternative: illégales; sans loi
  rationale: La majuscule signale la Loi juive, fortement impliquée par le contexte, tout en laissant la note reconnaître la traduction juridique plus générale.
- issue: Force de φιλάνθρωπα βασιλικά
  choice: dispositions royales bienveillantes
  alternative: mesures royales favorables; concessions royales
  rationale: La formulation maintient explicitement la bienveillance de φιλάνθρωπα et le caractère royal de βασιλικά, sans préciser indûment la forme juridique des mesures.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase grecque très longue est divisée en deux pour la lisibilité. «Mission diplomatique» évite l’ambiguïté moderne d’«ambassade», et l’imparfait final conserve la valeur aspectuelle de ἐκαίνιζεν.
