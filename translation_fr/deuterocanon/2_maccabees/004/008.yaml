base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/008.yaml
  text: Jason[a], the brother of Onias, undermined the high priesthood, promising the king through a petition three hundred sixty talents of silver[b], and eighty talents from some other revenue.
translation:
  language: fr
  text: 'Jason, frère d’Onias, s’empara frauduleusement de la charge de grand prêtre : par une requête adressée au roi[a], il promit trois cent soixante talents d’argent[b], ainsi que quatre-vingts talents provenant d’une autre source de revenus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lors d’une audience » ou « par une démarche auprès du roi » ; le terme grec peut désigner une requête officielle aussi bien qu’un accès personnel au roi.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « soixante talents en plus des trois cents », soit un total de trois cent soixante talents d’argent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπενόθευσεν
  choice: s’empara frauduleusement de
  rationale: Le verbe évoque une action déloyale, une falsification ou une appropriation obtenue par des moyens corrompus. Dans ce contexte, cette formulation exprime à la fois l’acquisition de la charge par Jason et le caractère moralement répréhensible de son procédé.
- source_word: ἀρχιερωσύνην
  choice: la charge de grand prêtre
  rationale: Le terme désigne la fonction ou la dignité de grand prêtre. « La charge de grand prêtre » est clair et naturel en français moderne.
- source_word: ἐπαγγειλάμενος
  choice: il promit
  rationale: 'Le participe indique le moyen employé par Jason : une promesse de paiement faite au roi. Une proposition verbale explicite rend la relation avec fluidité en français.'
- source_word: διʼ ἐντεύξεως
  choice: dans une requête
  rationale: ἔντευξις peut désigner une requête officielle, une démarche auprès du souverain ou une audience. « Dans une requête » convient au contexte politique, tandis que l’autre possibilité est signalée en note.
- source_word: ἀργυρίου
  choice: d’argent
  rationale: Le génitif indique la matière ou la forme du paiement ; « talents d’argent » est la formulation française habituelle.
- source_word: τάλαντα ἑξήκοντα πρὸς τοῖς τριακοσίοις
  choice: trois cent soixante talents d’argent
  rationale: La tournure grecque signifie littéralement « soixante talents en plus des trois cents ». Le total est exprimé naturellement dans le texte, et la structure littérale est conservée en note.
- source_word: προσόδου τινὸς ἄλλης
  choice: provenant d’une autre source de revenus
  rationale: πρόσοδος désigne un revenu ou une recette. La formulation française indique clairement qu’il s’agit d’une rentrée supplémentaire distincte.
- source_word: τάλαντα ὀγδοήκοντα
  choice: quatre-vingts talents
  rationale: Traduction directe de la somme, avec maintien de l’unité monétaire ancienne.
theological_decisions:
- issue: Portée morale de l’action de Jason envers la charge de grand prêtre
  choice: « s’empara frauduleusement de la charge de grand prêtre »
  alternative: « corrompit la dignité de grand prêtre » ou « porta atteinte à la charge de grand prêtre »
  rationale: Le récit présente une prise de fonction obtenue par des moyens déloyaux, et non une succession neutre. La formulation retenue conserve le jugement moral du verbe grec sans préciser au-delà du texte la procédure exacte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase est restructurée pour expliciter le participe grec sans atténuer la corruption attribuée à Jason. Les nombres suivent l’orthographe traditionnelle, courante dans les éditions bibliques.
