  text: Concerning these matters[a], a judicial hearing was brought against Menelaus.
translation:
  language: fr
  text: À propos de ces faits, une procédure judiciaire[a] fut engagée contre Ménélas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une affaire judiciaire s’ouvrit contre Ménélas ». La formulation grecque est concise et peut désigner, de manière générale, l’ouverture d’une affaire ou d’un examen judiciaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ τούτων
  choice: À propos de ces faits
  rationale: περί avec le génitif introduit le sujet concerné, tandis que δέ marque une transition légère. « À propos de ces faits » est naturel en français et rattache la phrase aux événements qui précèdent sans ajouter un repère temporel absent du grec.
- source_word: ἐνέστη
  choice: fut engagée
  rationale: Dans cette construction juridique avec κρίσις, le verbe exprime la mise en route ou l’ouverture d’une procédure. « Fut engagée » rend clairement cette idée en français courant.
- source_word: κρίσις
  choice: une procédure judiciaire
  rationale: κρίσις peut désigner le jugement, l’examen judiciaire ou le procès. « Procédure judiciaire » conserve ici la portée juridique sans imposer un stade procédural trop précis.
- source_word: ἐπὶ τὸν Μενέλαον
  choice: contre Ménélas
  rationale: Dans ce contexte juridique, ἐπί suivi de l’accusatif indique que l’action est dirigée contre Ménélas. « Contre Ménélas » est la formulation française idiomatique.
