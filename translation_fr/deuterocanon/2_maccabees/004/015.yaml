  text: and placing no value at all on the honors of their fathers[b][a], but considering the Greek distinctions the finest.
translation:
  language: fr
  text: Ils ne faisaient aucun cas des honneurs ancestraux[a] et considéraient les marques de prestige grecques[b] comme les plus belles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les honneurs de leurs pères » ou « les honneurs de leurs ancêtres ».
    reason: lexical_alternative
  - marker: b
    text: Le grec peut aussi se traduire par « gloires grecques », « honneurs grecs » ou « distinctions grecques »; il s’agit ici de ce qui était tenu pour prestigieux dans la culture grecque.
    reason: lexical_alternative
lexical_decisions:
- source_word: πατρῴας τιμάς
  choice: honneurs ancestraux
  rationale: L’expression désigne les honneurs, prérogatives ou valeurs reçus des pères. « Honneurs ancestraux » conserve la dimension héritée sans préciser indûment s’il s’agit de privilèges juridiques ou de coutumes.
- source_word: ἐν οὐδενὶ τεθειμένοι
  choice: ne faisaient aucun cas de
  rationale: Cette tournure idiomatique française rend l’idée de tenir quelque chose pour rien, sans renforcer le grec par un verbe explicite comme « mépriser ».
- source_word: Ἑλληνικὰς δόξας
  choice: marques de prestige grecques
  rationale: Au pluriel, δόξαι évoque ici ce qui confère gloire, renom ou distinction dans la culture grecque. « Marques de prestige » explicite naturellement cette valeur sociale tout en laissant une note signaler les équivalents plus littéraux.
- source_word: καλλίστας
  choice: les plus belles
  rationale: Le superlatif de καλός peut exprimer la beauté ou l’excellence. « Les plus belles » maintient cette largeur sémantique et le jugement fortement favorable porté par les acteurs.
- source_word: ἡγούμενοι
  choice: considéraient … comme
  rationale: Le participe exprime un jugement ou une appréciation; cette formulation est naturelle en français moderne.
theological_decisions:
- issue: Contraste chargé de valeur entre l’héritage ancestral juif et le prestige culturel grec
  choice: Exprimer nettement l’absence d’estime pour les honneurs ancestraux et la préférence accordée au prestige grec, sans ajouter un verbe comme « mépriser ».
  alternative: « méprisaient les honneurs de leurs pères et estimaient par-dessus tout les gloires grecques »
  rationale: Le grec établit une opposition tranchée, mais ne contient pas explicitement le verbe « mépriser ». La traduction préserve donc le jugement négatif et le jugement positif sans durcir la formulation.
translation_notes:
  register: Français international moderne, clair et digne. La phrase est formulée avec des verbes conjugués pour être autonome et naturelle, tout en conservant le parallélisme évaluatif du grec.
