  verdict: revise
  source_fidelity: 'La séquence générale est fidèle : présentation au roi, hommage rendu, acquisition personnelle de la grande prêtrise et surenchère de trois cents talents sur Jason. Toutefois, « par l’apparat de son pouvoir » attribue assez naturellement le pouvoir au roi en français, alors que le grec τῷ προσώπῳ τῆς ἐξουσίας reste une expression condensée, mieux rendue ici comme une apparence ou une prestance d’autorité affichée par le sujet.'
  naturalness: Le français est soutenu et lisible. « En affichant une apparence d’autorité » est plus naturel et moins chargé que « par l’apparat de son pouvoir », tout en évitant la connotation de faste cérémoniel que peut porter « apparat ».
  terminology: « Grand prêtre », « talents d’argent » et « surenchérissant ... sur l’offre de Jason » conviennent. « Fonction de grand prêtre » rend naturellement ἀρχιερωσύνη sans introduire de précision institutionnelle supplémentaire.
  issues:
