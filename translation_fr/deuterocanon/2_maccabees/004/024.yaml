    issue: Rattachement et nuance de « par l’apparat de son pouvoir »
    rationale: Le possessif « son » renvoie spontanément au roi, et « apparat » peut suggérer un faste officiel. Le grec ne comporte pas de possessif explicite et son expression « face/apparence d’autorité » est ambiguë. Une formulation sans possessif préserve mieux cette ambiguïté.
