- from: Mais, après avoir été présenté au roi[a] et l’avoir exalté par l’apparat de son pouvoir[b], il obtint pour lui-même la charge de grand prêtre en surenchérissant de trois cents talents d’argent sur l’offre de Jason.
  to: Mais, après avoir été présenté au roi[a] et l’avoir exalté en affichant une apparence d’autorité[b], il obtint pour lui-même la fonction de grand prêtre, en surenchérissant de trois cents talents d’argent sur l’offre de Jason.
  rationale: La révision remplace une expression française qui tend à attribuer explicitement le pouvoir au roi et à évoquer un faste officiel par une formulation qui conserve l’image grecque d’une apparence d’autorité. Elle maintient le ton non péjoratif de « exalter », le caractère personnel de l’obtention de la fonction et la valeur financière comparative de la surenchère.
