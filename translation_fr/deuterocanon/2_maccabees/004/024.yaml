base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/024.yaml
  text: But after being presented to the king and magnifying him by the display of his authority[a], he secured the high priesthood for himself[b], outbidding Jason by three hundred talents of silver.
translation:
  language: fr
  text: Mais, après avoir été présenté au roi[a] et l’avoir exalté en affichant une apparence d’autorité[b], il obtint pour lui-même la fonction de grand prêtre, en surenchérissant de trois cents talents d’argent sur l’offre de Jason.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après avoir été recommandé au roi ». Le grec peut désigner une présentation officielle ou une recommandation à la cour.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « par la face du pouvoir ». L’expression peut évoquer une apparence, une prestance ou une manifestation visible de l’autorité; son sens précis demeure discuté.
    reason: lexical_alternative
lexical_decisions:
- source_word: συσταθεὶς τῷ βασιλεῖ
  choice: après avoir été présenté au roi
  rationale: Le participe passif évoque une présentation ou une recommandation officielle à la cour. « Présenté au roi » est naturel en français et ne précise pas indûment la manière dont cette introduction a eu lieu.
- source_word: δοξάσας αὐτὸν
  choice: l’avoir exalté
  rationale: δοξάζω peut signifier glorifier, honorer ou exalter. « Exalter » conserve ici l’idée d’une louange appuyée sans imposer le jugement plus négatif de « flatter ».
- source_word: τῷ προσώπῳ τῆς ἐξουσίας
  choice: par l’apparat de son pouvoir
  rationale: L’expression grecque, littéralement proche de « par la face du pouvoir », est condensée et difficile. « L’apparat de son pouvoir » évoque une manifestation extérieure et impressionnante de l’autorité tout en conservant une certaine ambiguïté quant à la personne dont le pouvoir est mis en avant.
- source_word: εἰς ἑαυτὸν κατήντησεν ἀρχιερωσύνην
  choice: il obtint pour lui-même la charge de grand prêtre
  rationale: La construction indique qu’il fit parvenir à lui-même la dignité de grand prêtre, c’est-à-dire qu’il se l’assura personnellement. La mention « pour lui-même » conserve l’insistance du grec εἰς ἑαυτόν.
- source_word: ὑπερβάλλων τὸν Ἰάσονα τάλαντα ἀργυρίου τριακόσια
  choice: en surenchérissant de trois cents talents d’argent sur l’offre de Jason
  rationale: Dans ce contexte financier, ὑπερβάλλων signifie que l’offre faite dépassait celle de Jason. « Surchérir » exprime clairement cette transaction, tandis que le talent est conservé comme unité antique.
theological_decisions:
- issue: Coloration morale de la louange adressée au roi
  choice: Employer « exalter » sans qualifier explicitement l’acte de flatterie.
  alternative: « le flatter » ou « lui rendre hommage »
  rationale: Le contexte dénonce une manœuvre intéressée, mais δοξάζω n’exige pas à lui seul le sens péjoratif de « flatter ». La traduction laisse donc le récit porter son propre jugement.
- issue: Interprétation de τῷ προσώπῳ τῆς ἐξουσίας
  choice: Rendre l’expression par « l’apparat de son pouvoir ».
  alternative: « avec une prestance autoritaire » ou, littéralement, « par la face du pouvoir »
  rationale: La formulation choisie communique l’idée d’une manifestation visible et imposante du pouvoir sans transformer l’expression en un littéralisme obscur ni trancher entièrement son rattachement.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Charge de grand prêtre » est plus idiomatique que le substantif abstrait « grand-prêtrise ». La formulation conserve le caractère politique et transactionnel de la scène ainsi que l’ambiguïté de l’expression grecque relative au pouvoir.
