  text: For he saw that without royal intervention it was impossible for affairs to attain peace[c][b][a], and that Simon would not stop his folly.
translation:
  language: fr
  text: Voyant cela, il comprenait en effet que, sans l’intervention du roi[a], il était impossible de parvenir à la paix dans les affaires, et que Simon ne mettrait pas fin à sa folie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « sans la πρόνοια royale ». Ce terme peut signifier « prévoyance », « soin » ou « dispositions prises »; ici, il désigne probablement l’action concrète ou le soutien du roi.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Simon ne recevrait pas de répit dans sa folie », c’est-à-dire qu’il ne cesserait pas d’agir ainsi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοπῶν. ἐώρα γὰρ
  choice: Il constatait, en effet
  rationale: Le participe σκοπῶν dépend étroitement du contexte précédent et exprime ici l’observation ou l’examen de la situation. Cette formulation française conserve le lien logique marqué par γάρ sans créer un participe isolé peu naturel.
- source_word: βασιλικῆς προνοίας
  choice: l’intervention du roi
  rationale: πρόνοια peut désigner la prévoyance, le soin ou les dispositions prises. Dans ce contexte politique, il s’agit vraisemblablement de l’action concrète du pouvoir royal; « intervention du roi » l’exprime clairement sans imposer une nuance confessionnelle.
- source_word: τυχεῖν εἰρήνης ἐπὶ τὰ πράγματα
  choice: ramener la paix dans les affaires
  rationale: τυγχάνω avec le génitif signifie obtenir ou atteindre; avec ἐπὶ τὰ πράγματα, l’idée porte sur l’état des affaires. « Ramener la paix dans les affaires » rend naturellement en français le résultat recherché dans la situation publique.
- source_word: παῦλαν οὐ λημψόμενον
  choice: ne mettrait pas fin
  rationale: L’expression signifie littéralement que Simon « ne recevrait pas de pause » dans sa conduite. Le français idiomatique « ne mettrait pas fin » exprime qu’il ne cesserait pas de lui-même.
- source_word: ἀνοίας
  choice: folie
  rationale: ἄνοια désigne l’absence de bon sens, la déraison ou la folie. « Folie » conserve la forte appréciation morale du narrateur sans nécessairement suggérer un diagnostic clinique.
