  text: but because of the present circumstances for the outfitting of the triremes[a].
translation:
  language: fr
  text: mais, en raison des besoins actuels liés à l’équipement des trières[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en raison des circonstances présentes, en vue de l’équipement des trières » ; ou « à cause de ce qui est actuellement requis pour préparer les trières ».'
    reason: τῶν παρόντων peut désigner largement les circonstances présentes ou les nécessités du moment; la portée de εἰς τὰς τῶν τριηρέων κατασκευάς admet une expression plus directement finale ou une relation aux préparatifs.
lexical_decisions:
- source_word: ἕνεκα
  choice: en raison de
  rationale: Cette locution rend naturellement en français la valeur causale de la préposition, sans imposer une finalité plus précise.
- source_word: τῶν παρόντων
  choice: des circonstances présentes
  rationale: Le participe substantivé neutre pluriel désigne largement ce qui se présente ou la situation actuelle; cette formulation conserve cette généralité.
- source_word: κατασκευάς
  choice: équipement
  rationale: Dans le contexte naval, le terme peut désigner la préparation matérielle ou l’équipement des navires, plutôt que leur seule construction.
- source_word: τριηρέων
  choice: trières
  rationale: Le grec nomme un type précis de navire antique; « trières » en conserve la spécificité historique.
