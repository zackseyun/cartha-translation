  text: But when they also became aware of the attack by Lysimachus[a], some snatched up stones, others thick pieces of wood, and some, grabbing handfuls of the ashes lying nearby[c][b], hurled them all together at those around Lysimachus.
translation:
  language: fr
  text: Mais, lorsqu’ils eurent aussi connaissance de l’attaque de Lysimaque, les uns s’emparèrent de pierres, les autres de gros morceaux de bois, et d’autres encore prirent à pleines poignées de la cendre qui se trouvait tout près ; ils lançaient pêle-mêle ces objets sur ceux qui entouraient Lysimaque.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « ceux qui étaient autour de Lysimaque ». L’expression désigne vraisemblablement les hommes qui l’accompagnaient ou le soutenaient.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνειδότες
  choice: lorsqu’ils se rendirent compte
  rationale: Le participe exprime ici la prise de conscience qui déclenche la réaction de la foule. Cette formulation suit naturellement le mouvement du récit, tout en restant compatible avec le sens plus statique « sachant ».
- source_word: ἐπίθεσιν
  choice: attaque
  rationale: Dans ce contexte de violence ouverte, « attaque » rend clairement et simplement la force hostile du nom grec.
- source_word: συναρπάσαντες
  choice: s’emparèrent de
  rationale: Le verbe évoque une saisie soudaine et énergique de ce qui se trouvait à portée de main. « S’emparèrent de » conserve cette vigueur sans ajouter l’idée qu’ils auraient ramassé tous les objets à terre.
- source_word: ξύλων πάχη
  choice: de gros morceaux de bois
  rationale: L’expression signifie littéralement des épaisseurs ou masses de bois. Cette traduction reste concrète sans préciser indûment qu’il s’agissait de bâtons ou de poutres.
- source_word: σποδοῦ
  choice: de la cendre
  rationale: « Cendre » est le sens courant du nom grec et préserve l’image concrète du texte; « poussière » serait moins précis et « braises » suggérerait une chaleur que le grec n’impose pas.
- source_word: δραξόμενοι
  choice: prirent des poignées de
  rationale: Le verbe désigne l’action de saisir avec la main, probablement par poignées. La formulation française explicite naturellement ce geste.
- source_word: φύρδην
  choice: pêle-mêle
  rationale: L’adverbe décrit une action mêlée et désordonnée. « Pêle-mêle » conserve cette nuance sans trancher entre le mélange des projectiles et le désordre de leur lancement.
- source_word: ἐνετίνασσον
  choice: jetèrent
  rationale: Le verbe décrit des projections répétées et vigoureuses. En français, « jetèrent » reste naturel dans cette série narrative, tandis que « pêle-mêle » porte déjà l’intensité chaotique de la scène.
- source_word: τοὺς περὶ τὸν Λυσίμαχον
  choice: les gens de Lysimaque
  rationale: Cette expression idiomatique désigne ceux qui entourent ou accompagnent Lysimaque. « Les gens de Lysimaque » est naturel et ne précise pas davantage leur fonction.
