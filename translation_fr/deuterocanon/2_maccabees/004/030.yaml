base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/030.yaml
  text: While these things were underway[a], it happened that the people of Tarsus and Mallus revolted, because they were being given as a gift to Antiochis, the king’s concubine.
translation:
  language: fr
  text: Pendant que ces événements se déroulaient, il arriva que les habitants de Tarse et de Mallos se révoltèrent, parce que leurs villes étaient offertes en cadeau à Antiochis, la concubine du roi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεστηκότων
  choice: Pendant que ces événements se déroulaient
  rationale: Le génitif absolu sert ici de cadre temporel et relie cet épisode au récit précédent. Cette formulation française naturelle conserve cette fonction sans imposer le sens concret de « se tenir » ou « se rassembler ».
- source_word: συνέβη
  choice: se révoltèrent
  rationale: En français, il serait lourd de rendre séparément le tour grec « il arriva que… ». L’événement est exprimé directement par le verbe principal, sans perte de contenu narratif.
- source_word: Ταρσεῖς καὶ Μαλλῶτας
  choice: les habitants de Tarse et de Mallos
  rationale: Les formes grecques désignent les habitants de ces deux villes. « Les habitants de… » est plus clair en français moderne que des gentilés rares.
- source_word: στασιάζειν
  choice: se révoltèrent
  rationale: Le verbe évoque une agitation factieuse ou une rébellion. Dans ce contexte politique, « se révolter » rend clairement le soulèvement sans en préciser davantage la forme.
- source_word: διὰ τὸ
  choice: parce que
  rationale: La construction introduit directement la cause de la révolte.
- source_word: Ἀντιοχίδι
  choice: Antiochis
  rationale: Le nom propre est translittéré sous la forme française traditionnelle et transparente « Antiochis ».
- source_word: παλλακῇ
  choice: la concubine
  rationale: Le terme désigne une compagne de rang secondaire. « Concubine » est historiquement précis et évite les connotations modernes possibles de « maîtresse ».
- source_word: ἐν δωρεᾷ δίδοσθαι
  choice: leurs villes étaient données en cadeau
  rationale: Le passif et la valeur de don sont conservés. L’ajout explicatif « leurs villes » indique naturellement ce qui était attribué à Antiochis, puisque les sujets grammaticaux sont les habitants.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase suit le mouvement narratif du grec tout en évitant le calque lourd « il arriva que ». Aucun enjeu théologique particulier n’appelle une note.
