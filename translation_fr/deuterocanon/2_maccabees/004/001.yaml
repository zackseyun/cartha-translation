revisions:
- from: Mais Simon, dont il a été question plus haut, qui s’était fait le dénonciateur des fonds et de sa patrie, ne cessait de calomnier Onias, prétendant que celui-ci avait incité Héliodore et était devenu l’auteur de ces malheurs.[a]
  to: Mais Simon, dont il a été question plus haut, qui s’était fait le délateur au sujet des fonds et de la patrie, ne cessait de calomnier Onias, prétendant que celui-ci avait incité Héliodore et était devenu l’auteur des malheurs.[a]
  rationale: La révision améliore l’idiomaticité de la première accusation sans résoudre au-delà du texte le rapport inhabituel entre « délateur » et ses génitifs grecs. Elle retire aussi le démonstratif non exprimé dans « ces malheurs », tout en conservant la portée accusatrice introduite par « prétendant que » et l’ambiguïté de κακά signalée en note.
