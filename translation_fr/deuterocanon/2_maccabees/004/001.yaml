base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/001.yaml
  text: But the previously mentioned Simon[a], who had become an informer against the money and the homeland, kept slandering Onias, as though he were the one who had incited Heliodorus and had become the author of the troubles.
translation:
  language: fr
  text: Mais Simon, dont il a été question plus haut, qui s’était fait le délateur au sujet des fonds et de la patrie, ne cessait de calomnier Onias, prétendant que celui-ci avait incité Héliodore et était devenu l’auteur des malheurs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la cause des maux ». L’expression grecque peut désigner largement des événements nuisibles ou des malheurs, et non seulement le mal au sens moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: προειρημένος
  choice: dont il a été question plus haut
  rationale: Rend clairement le renvoi au récit précédent dans un français naturel, sans tournure archaïque.
- source_word: ἐνδείκτης
  choice: le dénonciateur
  rationale: Le terme désigne quelqu’un qui livre une information accusatrice ou hostile; « dénonciateur » conserve ici cette nuance.
- source_word: τῶν χρημάτων
  choice: des fonds
  rationale: Le pluriel grec désigne des sommes d’argent; « fonds » convient au contexte financier sans ajouter explicitement « du Temple ».
- source_word: τῆς πατρίδος
  choice: de sa patrie
  rationale: « Patrie » conserve la dimension collective et affective de πατρίς et s’intègre naturellement à la coordination.
- source_word: ἐκακολόγει
  choice: ne cessait de calomnier
  rationale: Cette formulation exprime à la fois la valeur durative de l’imparfait et le caractère diffamatoire des propos.
- source_word: ἐπισεσυκώς
  choice: avait incité
  rationale: Le participe décrit l’accusation selon laquelle Onias aurait poussé Héliodore à agir.
- source_word: τῶν κακῶν δημιουργός
  choice: l’auteur de ces malheurs
  rationale: « Auteur » maintient l’idée de responsabilité active, tandis que « malheurs » désigne les événements nuisibles sans limiter κακά au mal moral.
- source_word: καθεστηκώς
  choice: était devenu
  rationale: Rend l’état résultant exprimé par le parfait et son association avec δημιουργός.
