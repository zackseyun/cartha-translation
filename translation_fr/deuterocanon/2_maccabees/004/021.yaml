revisions:
- from: Quand Apollonios, fils de Ménesthée, eut été envoyé en Égypte pour les festivités marquant l’accession au trône du roi Philométor, Antiochos apprit qu’il était devenu étranger à ses propres affaires[a] et se préoccupa de sa sécurité personnelle. Il arriva donc à Joppé, puis se rendit à Jérusalem.
  to: Après qu’Apollonios, fils de Ménesthée, eut été envoyé en Égypte pour les festivités marquant l’accession au trône du roi Philométor, Antiochos apprit qu’Antiochos était devenu étranger à ses propres affaires[a] et se préoccupa de sa sécurité personnelle. Il arriva donc à Joppé, puis se rendit à Jérusalem.
  rationale: Révision minimale de fluidité et de désambiguïsation référentielle. L’explicitation du nom d’Antiochos ne transforme pas le sens disputé de l’expression grecque; elle précise seulement le référent de αὐτόν. La note maintient les possibilités interprétatives relatives à ses affaires ou à ses intérêts politiques.
