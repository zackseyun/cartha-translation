base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/021.yaml
  text: When Apollonius son of Menestheus had been sent to Egypt for the accession festivities of King Philometor[a], Antiochus, learning that he had become estranged from his own affairs, took thought for his own security. Therefore, after arriving at Joppa, he went on to Jerusalem.
translation:
  language: fr
  text: Après qu’Apollonios, fils de Ménesthée, eut été envoyé en Égypte pour les festivités marquant l’accession au trône du roi Philométor, Antiochos apprit qu’Antiochos était devenu étranger à ses propres affaires[a] et se préoccupa de sa sécurité personnelle. Il arriva donc à Joppé, puis se rendit à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’il se trouvait écarté de ce qui concernait ses propres intérêts ». La formulation grecque est condensée et peut évoquer, plus largement, une situation politique devenue défavorable à Antiochos.'
    reason: Préserver l’ambiguïté lexicale et syntaxique de la phrase grecque.
lexical_decisions:
- source_word: Ἀποσταλέντος
  choice: eut été envoyé
  rationale: Le participe aoriste passif fournit une circonstance antérieure à l’action principale; cette tournure rend clairement la succession narrative.
- source_word: διὰ τὰ προτοκλήρια
  choice: pour les festivités marquant l’accession au trône
  rationale: Le substantif rare désigne des célébrations liées à l’entrée officielle d’un souverain dans sa fonction; cette formulation est claire sans être excessivement interprétative.
- source_word: τοῦ φιλομήτορος βασιλέως
  choice: du roi Philométor
  rationale: Φιλομήτωρ est ici l’épithète royale historique du souverain égyptien et fonctionne comme un nom propre.
- source_word: μεταλαβὼν
  choice: apprit
  rationale: Dans ce contexte, le participe exprime l’acquisition ou la prise de connaissance d’une information.
- source_word: ἀλλότριον αὐτὸν τῶν αὐτοῦ γεγονότων πραγμάτων
  choice: qu’il était devenu étranger à ses propres affaires
  rationale: La formulation conserve autant que possible la construction grecque comprimée, le parfait γεγονότα et la nuance d’éloignement portée par ἀλλότριον, sans trancher entièrement son sens politique précis.
- source_word: τῆς καθʼ αὑτὸν ἀσφαλίας ἐφρόντιζεν
  choice: se préoccupa de sa sécurité personnelle
  rationale: La formulation exprime le souci actif d’Antiochos pour sa propre sûreté, vraisemblablement dans un contexte politique.
- source_word: παραγενόμενος … κατήντησεν
  choice: Il arriva donc à Joppé, puis se rendit à Jérusalem
  rationale: La coordination française restitue naturellement la progression géographique exprimée par le participe suivi du verbe principal.
theological_decisions:
- issue: Valeur de l’épithète Φιλομήτωρ
  choice: Philométor, traité comme une épithète royale devenue nom historique
  alternative: traduction littérale «qui aime sa mère»
  rationale: La translittération identifie clairement le roi concerné; une traduction littérale masquerait la référence historique.
- issue: Référent et portée de ἀλλότριον αὐτὸν τῶν αὐτοῦ γεγονότων πραγμάτων
  choice: conserver la formulation selon laquelle Antiochos «était devenu étranger à ses propres affaires»
  alternative: «il comprit que la situation allait à l’encontre de ses intérêts»
  rationale: Le grec est condensé et difficile. La traduction retenue préserve son ambiguïté grammaticale et politique au lieu d’imposer une explication unique.
translation_notes:
  register: 'Français international moderne, narratif et digne. Les noms propres suivent les formes françaises usuelles : Apollonios, Ménesthée, Philométor, Antiochos, Joppé et Jérusalem.'
