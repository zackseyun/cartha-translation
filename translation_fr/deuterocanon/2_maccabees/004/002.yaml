  yaml_path: translation/deuterocanon/2_maccabees/004/002.yaml
  text: and he dared to call the benefactor of the city[a], the guardian of his fellow countrymen, and the zealot for the laws, a conspirator against the state.
translation:
  language: fr
  text: et il osait traiter le bienfaiteur de la ville, le protecteur de ses compatriotes et le défenseur zélé des lois de conspirateur contre les affaires de l’État[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’homme qui complote contre les affaires publiques ». L’expression grecque a ici une portée politique et ne désigne pas une simple hostilité personnelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐεργέτην
  choice: bienfaiteur
  rationale: Dans ce contexte civique, le terme désigne celui qui rend publiquement des services à la ville; « bienfaiteur » en conserve la valeur honorifique.
- source_word: κηδεμόνα
  choice: protecteur
  rationale: Le mot évoque celui qui prend soin d’autrui et veille sur lui; « protecteur » est naturel en français et convient au parallélisme des titres élogieux.
- source_word: τῶν ὁμοεθνῶν
  choice: de ses compatriotes
  rationale: Le génitif désigne les membres du même peuple ou de la même nation; « ses compatriotes » exprime clairement cette solidarité collective.
- source_word: ζηλωτὴν τῶν νόμων
  choice: défenseur zélé des lois
  rationale: Cette formulation rend l’ardent attachement exprimé par ζηλωτής sans employer « zélote », qui pourrait être compris à tort comme le nom technique d’un parti.
- source_word: ἐπίβουλον τῶν πραγμάτων
  choice: conspirateur contre les affaires de l’État
  rationale: ἐπίβουλος désigne quelqu’un qui trame un complot, tandis que πράγματα renvoie ici aux affaires publiques ou politiques; la traduction conserve cette portée sans réduire πράγματα au seul mot « État ».
- source_word: ἐτόλμα λέγειν
  choice: il osait traiter … de
  rationale: La construction exprime l’audace de qualifier quelqu’un de manière accusatrice; « traiter … de » est idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français international actuel, clair et digne. La phrase conserve l’accumulation rhétorique des trois titres honorifiques, mise en contraste avec l’accusation finale.
