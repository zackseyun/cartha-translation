  yaml_path: translation/deuterocanon/2_maccabees/004/033.yaml
  text: And Onias[a], when he clearly recognized this, withdrew to a place of asylum at Daphne, which lies near Antioch.
translation:
  language: fr
  text: Onias, ayant clairement compris cela, se retira dans un lieu d’asile[a] à Daphné, qui se trouve près d’Antioche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un lieu de refuge ». Le grec désigne un lieu d’asile inviolable, probablement assorti d’une protection juridique et sacrée, et non seulement un endroit sûr.
    reason: lexical_alternative
lexical_decisions:
- source_word: σαφῶς ἐπεγνωκὼς
  choice: ayant clairement compris
  rationale: Le participe exprime une compréhension certaine et pleinement acquise, non un simple soupçon. Cette tournure reste naturelle en français tout en conservant la valeur circonstancielle du grec.
- source_word: ἀπήνεγκεν ἀποκεχωρηκὼς
  choice: se retira
  rationale: Dans ce contexte de fuite vers un lieu protégé, les deux formes verbales convergent vers l’idée qu’Onias s’éloigne et se met à l’abri. Une seule expression évite une répétition artificielle en français.
- source_word: εἰς ἄσυλον τόπον
  choice: dans un lieu d’asile
  rationale: « Asile » conserve mieux que le seul mot « refuge » la notion d’un lieu inviolable bénéficiant vraisemblablement d’une protection juridique ou sacrée.
- source_word: ἐπὶ Δάφνης
  choice: à Daphné
  rationale: La préposition a ici une valeur locale et introduit le nom du lieu où se trouve l’asile.
- source_word: τῆς πρὸς Ἀντιοχίας κειμένης
  choice: qui se trouve près d’Antioche
  rationale: Cette formulation identifie clairement Daphné par sa proximité avec Antioche, dans un français moderne et naturel.
