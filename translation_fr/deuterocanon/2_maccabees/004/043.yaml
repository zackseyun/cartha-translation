base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/043.yaml
  text: For this reason they wounded many of them[a], struck down some, and drove them all into flight; and they seized the temple-robber himself beside the treasury.
translation:
  language: fr
  text: Voilà pourquoi ils blessèrent beaucoup d’entre eux, en abattirent quelques-uns et les mirent tous en fuite. Quant au pillard du temple[a] lui-même, ils s’emparèrent de lui près du trésor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’homme sacrilège ». Le terme grec peut désigner celui qui commet un sacrilège, en particulier en pillant un temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ ἣν αἰτίαν
  choice: Voilà pourquoi
  rationale: Cette tournure française naturelle conserve le lien causal explicite avec la situation précédente.
- source_word: τραυματίας ἐποίησαν
  choice: ils blessèrent
  rationale: L’expression grecque signifie littéralement « rendre blessés » ; le verbe français exprime naturellement et précisément la violence physique.
- source_word: τινὰς δὲ κατέβαλον
  choice: en abattirent quelques-uns
  rationale: καταβάλλω signifie ici faire tomber ou terrasser. « Abattirent » en préserve la force sans préciser indûment qu’ils les tuèrent.
- source_word: πάντας δὲ εἰς φυγὴν συνήλασαν
  choice: les mirent tous en fuite
  rationale: Cette expression idiomatique rend clairement l’idée qu’ils forcèrent tous les autres à fuir.
- source_word: αὐτὸν δὲ τὸν ἱερόσυλον
  choice: Quant au pillard du temple lui-même
  rationale: ἱερόσυλος désigne celui qui commet un sacrilège, notamment en dépouillant un temple. « Pillard du temple » rend ici l’acte concret, tandis que « lui-même » conserve l’insistance de αὐτόν.
- source_word: παρὰ τὸ γαζοφυλάκιον
  choice: près du trésor
  rationale: γαζοφυλάκιον désigne le trésor ou la salle du trésor, et παρά marque ici la proximité spatiale sans imposer un détail architectural.
- source_word: ἐχειρώσαντο
  choice: ils s’emparèrent de lui
  rationale: Le moyen exprime le fait de mettre la main sur quelqu’un. Cette formulation évite la connotation juridique trop précise d’« arrêter ».
theological_decisions:
- issue: Sens de ἱερόσυλος dans le contexte du temple
  choice: pillard du temple
  alternative: homme sacrilège
  rationale: Le terme associe l’atteinte au sacré au dépouillement de biens sacrés. Le contexte du trésor favorise le sens concret, tandis qu’une note maintient l’autre nuance lexicale.
translation_notes:
  register: Français international moderne, narratif et digne. Les verbes restent vigoureux sans transformer « abattirent » en affirmation explicite de mise à mort. La répétition pronominale dans « ils s’emparèrent de lui » est naturelle et clarifie l’objet après la construction détachée.
