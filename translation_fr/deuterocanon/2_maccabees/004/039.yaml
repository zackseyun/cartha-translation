base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/039.yaml
  text: But when many acts of temple robbery had been committed in the city by Lysimachus[a], with the consent of Menelaus, and the report had spread outside, the crowd gathered against Lysimachus[b], since much gold had already been plundered.
translation:
  language: fr
  text: Mais comme Lysimaque avait commis dans la ville de nombreux vols de biens sacrés[a], avec le consentement de Ménélas, et que la nouvelle s’était répandue au-dehors[b], la foule se rassembla contre Lysimaque, car beaucoup d’objets en or avaient déjà été pillés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de nombreux sacrilèges » ; le terme grec désigne plus précisément le vol de biens sacrés ou appartenant au Temple.
    reason: lexical_alternative
  - marker: b
    text: Ou « le bruit s’était répandu au-dehors ». Le grec peut désigner une nouvelle, un bruit ou une rumeur.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱεροσυλημάτων
  choice: vols de biens sacrés
  rationale: Le terme désigne précisément le vol sacrilège de biens consacrés. Cette formulation conserve à la fois la notion de vol et le caractère sacré des objets, sans réduire nécessairement le référent au seul bâtiment du Temple.
- source_word: μετὰ τῆς τοῦ Μενελάου γνώμης
  choice: avec le consentement de Ménélas
  rationale: γνώμη peut exprimer l’avis, l’intention ou l’approbation. Dans ce contexte, « consentement » marque la complicité de Ménélas sans lui attribuer directement l’exécution des vols.
- source_word: διαδοθείσης ἔξω τῆς φήμης
  choice: la nouvelle s’était répandue au-dehors
  rationale: φήμη désigne une information qui circule, qu’il s’agisse d’une nouvelle, d’un bruit ou d’une rumeur. « La nouvelle » reste neutre, tandis que « au-dehors » préserve l’adverbe ἔξω sans préciser au-delà de quoi.
- source_word: ἐπισυνήχθη τὸ πλῆθος
  choice: la foule se rassembla
  rationale: Formulation française naturelle qui rend directement le rassemblement collectif exprimé par le grec.
- source_word: ἐπὶ τὸν Λυσίμαχον
  choice: contre Lysimaque
  rationale: Avec un verbe de rassemblement et dans ce contexte d’indignation publique, ἐπί suivi de l’accusatif indique vraisemblablement un mouvement hostile dirigé contre Lysimaque.
- source_word: χρυσωμάτων
  choice: objets en or
  rationale: Le mot désigne des objets ou richesses d’or. « Objets en or » rend le pluriel concret sans ajouter la précision non exprimée de vases ou d’ustensiles.
- source_word: διηρπαγμένων
  choice: avaient déjà été pillés
  rationale: Le participe parfait passif présente le pillage comme déjà accompli, avec un résultat encore pertinent; « avaient déjà été pillés » en restitue l’antériorité et la violence.
theological_decisions:
- issue: Nature de l’infraction exprimée par ἱεροσυλημάτων
  choice: Des vols de biens sacrés, et non de simples actes généraux d’impiété
  alternative: De nombreux sacrilèges
  rationale: Le sens lexical vise spécifiquement le vol de biens sacrés. La traduction explicite cette infraction historique et religieuse sans introduire d’interprétation confessionnelle.
- issue: Degré d’implication de Ménélas
  choice: Il a consenti aux actes de Lysimaque
  alternative: Il les a conseillés, ordonnés, ou en avait seulement connaissance
  rationale: Le contexte indique son approbation ou sa connivence, mais le terme γνώμη ne permet pas de préciser davantage son rôle; « consentement » préserve cette limite.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve l’enchaînement circonstanciel du grec tout en restant naturelle. « Biens sacrés » rend la précision cultuelle; « objets en or » évite de supposer qu’il s’agissait exclusivement de vases du Temple.
