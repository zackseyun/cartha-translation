  yaml_path: translation/deuterocanon/2_maccabees/004/047.yaml
  text: So Ptolemy took him and moved the king into a colonnade[b][a], as though to revive him.
translation:
  language: fr
  text: Alors Ptolémée prit le roi à part, dans une cour à colonnades, comme pour le soulager, et le fit changer d’avis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec peut signifier « déplacer »; dans ce contexte, il signifie que Ptolémée amena le roi à changer d’avis.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: Alors
  rationale: Dans l’enchaînement narratif, le mot introduit la conséquence de ce qui précède. « Alors » convient au français courant sans imposer un sens spatial.
- source_word: ἀπολαβών
  choice: emmena le roi à l’écart
  rationale: Le participe exprime ici l’action de prendre quelqu’un à part. Son complément est implicite, mais le contexte et l’accusatif τὸν βασιλέα permettent d’identifier le roi.
- source_word: εἴς τι περίστυλον
  choice: sous une colonnade
  rationale: περίστυλον désigne un espace entouré ou bordé de colonnes. « Sous une colonnade » est naturel et conserve l’image architecturale sans recourir au terme plus technique « péristyle ».
- source_word: ὡς ἀναψύχοντα
  choice: comme pour lui permettre de reprendre son souffle
  rationale: ὡς présente l’action comme une apparence ou un prétexte, tandis que ἀναψύχω évoque le fait de se rafraîchir, de reprendre des forces ou de trouver du répit. La formulation française reste idiomatique dans la scène.
- source_word: μετέθηκεν
  choice: le fit changer d’avis
  rationale: μετατίθημι peut signifier déplacer, mais aussi faire changer de position ou d’opinion. Le contexte, où Ptolémée cherche à infléchir la décision royale, favorise nettement le sens figuré.
- source_word: τὸν βασιλέα
  choice: le roi
  rationale: L’accusatif identifie la personne prise à part et amenée à changer d’avis.
- source_word: ὁ Πτολεμαῖος
  choice: Ptolémée
  rationale: Forme française traditionnelle et standard du nom grec.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La phrase explicite naturellement le complément sous-entendu de ἀπολαβών et conserve la nuance de prétexte portée par ὡς. Le rendu s’écarte de la couche anglaise là où celle-ci semble avoir rattaché μετέθηκεν au déplacement physique plutôt qu’au changement d’avis.
