revisions:
- from: Alors Ptolémée emmena le roi à l’écart, sous une colonnade, comme pour lui permettre de reprendre son souffle, et le fit changer d’avis.[a]
  to: Alors Ptolémée prit le roi à part, dans une cour à colonnades, comme pour le soulager, et le fit changer d’avis.[a]
  rationale: La révision conserve l’interprétation contextuellement fondée de μετέθηκεν comme changement d’avis, tout en rendant plus exactement le péristyle et la nuance large de soulagement ou de rafraîchissement. Elle ne dépend pas de l’analyse moins plausible de la traduction anglaise, qui comprend μετέθηκεν comme un déplacement physique.
