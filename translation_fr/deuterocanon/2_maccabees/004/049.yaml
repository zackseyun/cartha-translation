  text: Therefore those who had spoken beforehand concerning the city and the people and the sacred vessels quickly suffered the unjust penalty[a][b][c].
translation:
  language: fr
  text: Ainsi, ceux qui avaient auparavant pris la parole au sujet de la ville, des populations et des objets sacrés subirent rapidement une peine injuste[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ceux qui avaient parlé auparavant au sujet de la ville, des populations et des objets sacrés ». Le participe grec indique littéralement une prise de parole antérieure ou préalable; le contexte peut suggérer une intervention en leur faveur, sans l’exprimer explicitement.'
    reason: lexical_alternative
  - marker: b
    text: Le mot grec traduit par « populations » peut aussi désigner des communautés, des districts ou des corps civiques; sa nuance précise est incertaine ici.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταχέως οὖν
  choice: Ainsi… rapidement
  rationale: οὖν marque ici la conséquence de ce qui précède, tandis que ταχέως indique que la condamnation survint sans tarder.
- source_word: τὴν ἄδικον ζημίαν ὑπέσχον
  choice: subirent… une peine injuste
  rationale: Dans ce contexte judiciaire, ζημία désigne vraisemblablement une peine ou une condamnation dommageable; ὑπέσχον exprime le fait de la subir. « Injuste » conserve directement le jugement porté par ἄδικον.
- source_word: οἱ … προηγορήσαντες
  choice: ceux qui avaient plaidé la cause
  rationale: Dans le contexte d'une comparution devant le roi, le participe désigne ceux qui avaient parlé en faveur des intérêts mentionnés. Cette formulation française est plus précise et naturelle que « parlé auparavant », tout en signalant en note le sens plus littéral possible.
- source_word: περὶ πόλεως καὶ δήμων
  choice: de la ville, des populations
  rationale: πόλις est rendu par « ville ». Le pluriel δήμων peut désigner des populations, des communautés ou des corps civiques; « populations » maintient le pluriel sans imposer une identification plus précise.
- source_word: τῶν ἱερῶν σκευῶν
  choice: des objets sacrés
  rationale: σκεύη désigne des objets, ustensiles ou récipients employés dans le sanctuaire. « Objets sacrés » reste exact sans limiter indûment le terme aux seuls vases.
