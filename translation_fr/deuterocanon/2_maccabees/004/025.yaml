base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/025.yaml
  text: But after receiving the royal commands[a], he arrived, bringing nothing worthy of the high priesthood[c][b], but having the passions of a cruel tyrant and the rage of a barbarous beast.
translation:
  language: fr
  text: Après avoir reçu les ordres royaux, il arriva, sans rien avoir qui soit digne de la charge de grand prêtre, mais avec les emportements d’un tyran cruel et les fureurs d’une bête barbare.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie deux noms pluriels de sens voisin, rendus ici par « emportements » et « fureurs », afin d’intensifier le portrait de sa violence.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: Après avoir reçu
  rationale: Le participe aoriste exprime une action antérieure à l’arrivée; cette tournure restitue naturellement ce rapport temporel.
- source_word: τὰς βασιλικὰς ἐντολάς
  choice: les ordres royaux
  rationale: Cette expression claire et soutenue désigne les ordres émanant de l’autorité royale.
- source_word: παρεγίνετο
  choice: il arriva
  rationale: Le verbe indique sa venue sur les lieux dans le fil du récit.
- source_word: τῆς μὲν ἀρχιερωσύνης οὐδὲν ἄξιον φέρων
  choice: sans rien avoir qui soit digne de la charge de grand prêtre
  rationale: La formulation française évite de faire croire qu’il transportait des objets et exprime le jugement porté sur son absence totale de qualités convenant à cette fonction.
- source_word: ἀρχιερωσύνης
  choice: la charge de grand prêtre
  rationale: Cette formulation désigne clairement la fonction exercée, tout en restant accessible en français moderne.
- source_word: θυμοὺς
  choice: les emportements
  rationale: Le pluriel désigne des mouvements violents du tempérament; « emportements » le conserve et reste distinct de ὀργάς.
- source_word: ὠμοῦ τυράννου
  choice: d’un tyran cruel
  rationale: ὠμός évoque ici une cruauté brutale; « cruel » est direct, naturel et conforme au registre moral du passage.
- source_word: θῆρος βαρβάρου
  choice: d’une bête barbare
  rationale: La traduction conserve l’image animale et l’idée de brutalité non civilisée portée par βάρβαρος, sans en faire une désignation ethnique.
- source_word: ὀργὰς ἔχων
  choice: avec les fureurs
  rationale: « Fureurs » maintient le pluriel intensif et distingue ce second terme des « emportements ».
theological_decisions:
- issue: Caractérisation morale de Ménélas par contraste avec la charge de grand prêtre
  choice: Le texte affirme qu’il ne possède rien qui soit digne de cette charge et lui attribue au contraire un tempérament tyrannique et bestial.
  alternative: Atténuer ces paroles en les présentant comme une simple critique politique.
  rationale: Le grec établit explicitement un contraste moral tranché entre l’indignité à l’égard de la grande prêtrise et les dispositions violentes de Ménélas; la traduction conserve cette condamnation sans l’amplifier.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La construction grecque avec deux participes est rendue avec fluidité, tandis que le contraste rhétorique entre l’indignité sacerdotale et la violence tyrannique et bestiale est préservé.
