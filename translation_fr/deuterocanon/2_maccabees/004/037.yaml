base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/037.yaml
  text: So Antiochus[a], deeply grieved in soul and moved to pity, and having wept because of the self-control and great good order of the one who had died[c][b],
translation:
  language: fr
  text: Alors Antiochos, profondément affligé au fond de lui-même et ému de compassion[a], versa des larmes à cause de la maîtrise de soi et de la grande discipline[c] de celui qui était mort[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tourné vers la pitié » ou « vers la miséricorde ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « du défunt ».'
    reason: lexical_alternative
  - marker: c
    text: L’expression peut aussi être rendue par « grand sens de l’ordre », « bonne tenue » ou « bonne conduite ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ψυχικῶς … ὑπολυπηθείς
  choice: profondément affligé
  rationale: L’adverbe souligne le caractère intérieur et intense de la peine. « Profondément affligé » l’exprime naturellement en français sans la tournure plus lourde « affligé dans son âme ».
- source_word: τραπεὶς ἐπὶ ἔλεος
  choice: ému de compassion
  rationale: L’expression signifie littéralement « tourné vers la pitié ou la miséricorde ». Cette formulation française rend naturellement le changement de disposition d’Antiochos.
- source_word: δακρύσας
  choice: versa des larmes
  rationale: Cette tournure rend clairement l’aoriste participial et s’intègre avec naturel dans la phrase française.
- source_word: διὰ
  choice: à cause de
  rationale: Avec l’accusatif, la préposition exprime ici la cause.
- source_word: τοῦ μετηλλαχότος
  choice: celui qui était mort
  rationale: Le participe désigne la personne décédée. La formulation reste claire, sobre et proche du grec.
- source_word: σωφροσύνην
  choice: maîtrise de soi
  rationale: Le terme désigne la modération, la retenue ou la maîtrise personnelle. « Maîtrise de soi » conserve cette portée morale sans la réduire à la seule prudence.
- source_word: πολλὴν εὐταξίαν
  choice: conduite exemplaire
  rationale: εὐταξία évoque l’ordre, la discipline et la bonne tenue. En parlant d’une personne, « conduite exemplaire » est idiomatique et restitue la forte appréciation exprimée par πολλήν.
