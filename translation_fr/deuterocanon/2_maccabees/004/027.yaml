base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/027.yaml
  text: But Menelaus held on to the office[a], yet he made no provision at all for the money he had promised to the king.
translation:
  language: fr
  text: Mais Ménélas conservait sa charge ; pourtant, il ne prenait aucune disposition concernant les sommes qu’il avait promises au roi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus directement : « il ne versait rien des sommes qu’il avait promises au roi ». Le grec dit littéralement qu’il ne « mettait rien en ordre » concernant ces sommes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχῆς
  choice: charge
  rationale: Dans ce contexte, le mot désigne la fonction officielle, en particulier la charge de grand prêtre, plutôt que l’autorité au sens abstrait.
- source_word: ἐκράτει
  choice: conservait
  rationale: L’imparfait exprime la possession continue de la charge ; « conservait » rend naturellement cette durée sans ajouter l’idée d’un effort explicite pour s’y accrocher.
- source_word: ἐπηγγελμένων
  choice: promises
  rationale: Le participe renvoie aux sommes que Ménélas s’était auparavant engagé à fournir au roi. La formulation française garde le passif du grec sans répéter inutilement le sujet.
- source_word: χρημάτων
  choice: sommes
  rationale: Dans ce contexte financier, « sommes » désigne clairement les montants d’argent dus et s’accorde naturellement avec « promises ».
- source_word: οὐδὲν εὐτάκτει
  choice: ne prenait aucune disposition pour verser
  rationale: Cette traduction conserve l’idée fondamentale de mettre en ordre ou de prendre les dispositions nécessaires, tout en rendant explicite le rapport au versement de l’argent, sans affirmer directement qu’aucun paiement partiel n’avait eu lieu.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le contraste marqué par μὲν…δέ est rendu par « mais… pourtant ». La note préserve l’ambiguïté entre l’organisation du paiement et le paiement lui-même.
