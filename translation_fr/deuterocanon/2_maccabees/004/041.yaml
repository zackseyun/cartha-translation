  source_fidelity: 'Le sens global est bien identifié : le sujet déclenche une action violente et un certain Auranus en prend la tête; l''âge avancé de celui-ci est opposé ironiquement à son ignorance. Toutefois, « de ses mains injustes » est une formulation française peu idiomatique et le possessif n''est pas exprimé par le grec. Le nom doit être rendu Auranus, forme nominative correspondant au génitif grec Αὐρανοῦ et à l''audit anglais.'
