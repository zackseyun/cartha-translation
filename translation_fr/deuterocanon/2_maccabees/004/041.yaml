translation:
  language: fr
  text: il commença à recourir à la violence[a], tandis qu’un certain Auranus, avancé en âge mais non moins ignorant, prenait la tête.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est difficile et très condensé : littéralement, il « commença [des] mains injustes ». Le sens paraît être qu’il entreprit une action violente, Auranus prenant la tête; celui-ci était avancé en âge, mais non moins ignorant.'
    reason: textual_variant
lexical_decisions:
- source_word: κατήρξατο
  choice: il commença
  rationale: L’aoriste moyen de κατάρχομαι marque ici le commencement de l’action violente; « il commença » en conserve simplement la valeur.
- source_word: χειρῶν ἀδίκων
  choice: à porter des coups de ses mains injustes
  rationale: La tournure grecque est elliptique et difficile. Cette formulation garde l’image des mains ainsi que la qualification morale exprimée par ἀδίκων, tout en rendant explicite l’action violente impliquée.
- source_word: προηγησαμένου
  choice: sous la conduite
  rationale: Le génitif absolu présente Auranos comme celui qui marchait en tête et dirigeait l’action; « sous la conduite » est naturel en français.
- source_word: τινὸς Αὐρανοῦ
  choice: d’un certain Auranos
  rationale: τινός associé au nom propre signifie « un certain ». La forme Auranos translittère directement le grec Αὐρανός.
- source_word: προβεβηκότος τὴν ἡλικίαν
  choice: avancé en âge
  rationale: Cette expression idiomatique française rend le fait d’être parvenu à un âge avancé.
- source_word: οὐδὲν δὲ ἧττον καὶ τὴν ἄγνοιαν
  choice: mais non moins en ignorance
  rationale: La formulation conserve le parallélisme mordant et volontairement condensé du grec entre l’avancement en âge et l’ignorance.
