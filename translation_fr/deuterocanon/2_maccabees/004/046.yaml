  yaml_path: translation/deuterocanon/2_maccabees/004/046.yaml
  text: But Menelaus[a], already having been won over, promised Ptolemy son of Dorymenes a considerable amount of money to persuade the king.
translation:
  language: fr
  text: Mais Ménélas, ayant déjà gagné la faveur de Ptolémée[a], lui promit une forte somme d’argent pour persuader le roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le participe grec est difficile. Littéralement, il peut évoquer le fait d’avoir déjà été « gagné » ou amené favorablement à une cause; le contexte suggère que Ménélas s’était déjà assuré la faveur de Ptolémée.
    reason: lexical_alternative
lexical_decisions:
- source_word: λελιμμένος
  choice: en mauvaise posture
  rationale: Le participe grec est difficile, mais le contexte immédiat présente Ménélas comme près de perdre sa cause. « En mauvaise posture » rend cet état sans préciser excessivement s’il était déjà vaincu ou seulement acculé.
- source_word: ἐπηγγείλατο
  choice: promit
  rationale: Le moyen exprime ici naturellement l’engagement de verser une somme d’argent.
- source_word: χρήματα ἱκανά
  choice: une forte somme d’argent
  rationale: L’expression désigne une somme substantielle; cette formulation est naturelle et actuelle en français.
- source_word: τῷ Πτολεμαίῳ Δορυμένους
  choice: à Ptolémée, fils de Dorymène
  rationale: Le génitif Δορυμένους est compris comme un patronyme servant à identifier Ptolémée.
- source_word: πρὸς τὸ πεῖσαι τὸν βασιλέα
  choice: pour persuader le roi
  rationale: La construction avec infinitif articulé exprime le but. La formulation française conserve la concision du grec sans ajouter explicitement un sujet à l’infinitif.
