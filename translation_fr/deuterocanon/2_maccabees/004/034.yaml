revisions:
- from: C’est pourquoi Ménélas prit Andronicos à part et le pressa de faire périr Onias par traîtrise[a]. Andronicos se rendit alors auprès d’Onias et, résolu à user de ruse, lui donna des assurances accompagnées de serments et lui tendit la main droite. Bien qu’il fût l’objet de soupçons, il persuada Onias de sortir du lieu d’asile[b], puis le fit aussitôt enfermer[c], sans aucun respect pour la justice.
  to: C’est pourquoi Ménélas prit Andronicos à part et le pressa de faire périr Onias par traîtrise[a]. Andronicos se rendit alors auprès d’Onias et, l’ayant gagné par ruse, lui donna des assurances accompagnées de serments et lui tendit la main droite. Bien qu’il fût l’objet de soupçons, il persuada Onias de sortir du lieu d’asile[b], puis l’enferma aussitôt[c], sans aucun respect pour la justice.
  rationale: La révision corrige deux écarts sûrs sans résoudre excessivement les difficultés du texte grec. « L’ayant gagné par ruse » exprime de façon idiomatique l’action trompeuse visée dans le contexte, plutôt qu’une résolution intérieure non exprimée. « L’enferma » évite le causatif ajouté par « le fit enfermer » ; la note conserve la possibilité, imposée par le contexte narratif, que l’expression désigne implicitement la mise à mort.
