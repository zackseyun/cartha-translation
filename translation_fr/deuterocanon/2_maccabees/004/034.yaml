base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/034.yaml
  text: Therefore Menelaus took Andronicus aside privately and urged him to strike down Onias by treachery[a]. Andronicus went to Onias, and after winning his confidence by deceit and greeting him with oaths, giving him his right hand, though he was under suspicion, he persuaded him to come out from the place of asylum. Then he immediately shut him away[c][b], showing no regard for justice.
translation:
  language: fr
  text: C’est pourquoi Ménélas prit Andronicos à part et le pressa de faire périr Onias par traîtrise[a]. Andronicos se rendit alors auprès d’Onias et, l’ayant gagné par ruse, lui donna des assurances accompagnées de serments et lui tendit la main droite. Bien qu’il fût l’objet de soupçons, il persuada Onias de sortir du lieu d’asile[b], puis l’enferma aussitôt[c], sans aucun respect pour la justice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La leçon grecque est ici difficile, tant du point de vue du texte que du vocabulaire. D’après le contexte, Ménélas presse Andronicos d’organiser la mort d’Onias.
    reason: textual_variant
  - marker: b
    text: Ou « du sanctuaire » ou « du refuge ». Le mot grec désigne un lieu protégé et inviolable où l’on pouvait trouver asile.
    reason: lexical_alternative
  - marker: c
    text: 'Le contexte peut impliquer plus fortement : « le fit mourir » ou « l’assassina », bien que le verbe grec employé ici signifie plus littéralement fermer ou enfermer.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅθεν
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence tirée de la situation précédente.
- source_word: λαβὼν ἰδίᾳ
  choice: prit Andronicos à part
  rationale: Rend l’idée d’un entretien privé et discret, avec la nuance conspiratrice du contexte.
- source_word: παρεκάλει
  choice: le pressa
  rationale: Exprime une sollicitation insistante en vue d’un acte criminel.
- source_word: χειρόγραφον τὸν Ὀνίαν
  choice: de faire périr Onias par traîtrise
  rationale: La leçon grecque transmise est difficile et ne fournit pas une construction limpide. Le contexte indique toutefois que Ménélas pousse Andronicos à préparer la mort d’Onias; la note signale l’incertitude textuelle et lexicale.
- source_word: παραγόμενος ἐπὶ τὸν Ὀνίαν
  choice: se rendit alors auprès d’Onias
  rationale: Rend simplement le mouvement d’Andronicos vers Onias dans un français naturel.
- source_word: πεισθεὶς ἐπὶ δόλῳ
  choice: résolu à user de ruse
  rationale: Le participe grec se rapporte grammaticalement à Andronicos et l’expression associe son action à la tromperie. Cette formulation conserve cette orientation sans faire d’Onias le sujet implicite du participe.
- source_word: δεξιωθεὶς μεθʼ ὅρκων, δοὺς δεξιάν
  choice: lui donna des assurances accompagnées de serments et lui tendit la main droite
  rationale: Restitue l’apparence de confiance créée par les serments et par le geste ancien de la main droite donnée en gage.
- source_word: καίπερ ἐν ὑποψίᾳ κείμενος
  choice: Bien qu’il fût l’objet de soupçons
  rationale: Conserve l’ambiguïté du grec sur l’origine exacte des soupçons tout en rattachant grammaticalement l’expression à Andronicos.
- source_word: ἐκ τοῦ ἀσύλου προελθεῖν
  choice: de sortir du lieu d’asile
  rationale: Préserve la notion juridique et protectrice d’un endroit inviolable sans imposer exclusivement le sens cultuel de « sanctuaire ».
- source_word: παραχρῆμα
  choice: aussitôt
  rationale: Équivalent français actuel et direct de l’adverbe temporel.
- source_word: παρέκλεισεν
  choice: le fit enfermer
  rationale: Reste proche de l’idée littérale de fermer ou d’enfermer. Le contexte narratif peut impliquer la mise à mort d’Onias, mais le verbe transmis est moins explicite; cette portée est donc indiquée en note.
- source_word: οὐκ αἰδεσθεὶς τὸ δίκαιον
  choice: sans aucun respect pour la justice
  rationale: Rend clairement l’absence de considération ou de retenue devant ce qui est juste.
theological_decisions:
- issue: Nature de l’ἄσυλον
  choice: lieu d’asile
  alternative: sanctuaire; refuge
  rationale: Le mot désigne un lieu protégé et inviolable, probablement lié ici à un sanctuaire. « Lieu d’asile » maintient la dimension de protection sans réduire prématurément le terme à un édifice cultuel.
- issue: Portée de παρέκλεισεν dans le récit
  choice: le fit enfermer
  alternative: le fit mourir; l’assassina
  rationale: Le contexte plus large rapporte la mort d’Onias, mais le verbe grec de cette leçon signifie plus directement fermer ou enfermer. Le texte principal conserve cette retenue lexicale et la note donne le sens contextuel possible.
- issue: Agent et portée de πεισθεὶς ἐπὶ δόλῳ
  choice: Andronicos est présenté comme résolu à user de ruse
  alternative: Andronicos gagna trompeusement la confiance d’Onias
  rationale: Le participe au nominatif se rapporte formellement à Andronicos. La traduction évite de transformer sans indication le participe en une action dont Onias serait l’objet, tout en rendant la duplicité manifeste.
translation_notes:
  register: Français international moderne, narratif et digne. Les noms propres suivent les formes françaises usuelles « Ménélas », « Andronicos » et « Onias ». La syntaxe a été légèrement réorganisée pour rester lisible tout en conservant les ambiguïtés réelles du grec au moyen de formulations prudentes et de notes.
