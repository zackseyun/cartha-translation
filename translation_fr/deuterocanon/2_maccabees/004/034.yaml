  source_fidelity: 'La formulation « résolu à user de ruse » ne rend pas adéquatement πεισθεὶς ἐπὶ δόλῳ : elle introduit une résolution intérieure qui n’est pas exprimée. Dans le contexte narratif et conformément au sens contextuel retenu dans la piste d’audit anglaise, la ruse doit qualifier l’action par laquelle Andronicos gagne ou trompe Onias. « Le fit enfermer » ajoute en outre un causatif absent de παρέκλεισεν ; « l’enferma » est plus proche du verbe, tout en laissant la note signaler l’interprétation contextuelle plus forte.'
  naturalness: Le français est globalement naturel, sobre et adapté à un récit historique. La révision proposée conserve ce registre et rend plus clairement l’enchaînement des gestes de confiance feinte.
  terminology: « Ménélas », « Andronicos », « Onias », « lieu d’asile » et « justice » conviennent au français international moderne. « Lieu d’asile » maintient utilement la portée protectrice de ἄσυλον, sans trancher en faveur de « sanctuaire ».
