base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/005.yaml
  text: he presented himself to the king[a], not becoming an accuser of his fellow citizens, but seeking what was advantageous both publicly and privately for the whole multitude.
translation:
  language: fr
  text: il se présenta devant le roi, non comme accusateur de ses concitoyens, mais en recherchant ce qui était avantageux pour toute la population, tant collectivement que pour chacun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mais en recherchant l’intérêt commun ainsi que celui de chaque personne parmi le peuple ».'
    reason: La construction grecque finale est condensée et peut être répartie de plusieurs manières entre l’intérêt collectif et celui de chaque individu.
lexical_decisions:
- source_word: διεκοσμήθη
  choice: il se présenta
  rationale: Dans ce contexte d’audience royale, cette formulation rend naturellement l’idée de la manière dont Onias se mit en présence du roi, sans conserver le littéralisme trompeur « fut orné ».
- source_word: οὐ γινόμενος … κατήγορος
  choice: non comme accusateur
  rationale: 'Le participe décrit la manière dont il se présenta : il n’assuma pas le rôle d’accusateur. Cette tournure est plus idiomatique en français que « ne devenant pas accusateur ».'
- source_word: τῶν πολιτῶν
  choice: de ses concitoyens
  rationale: Le terme désigne les membres de la même communauté civique; « ses concitoyens » en exprime clairement la relation.
- source_word: τὸ δὲ σύμφορον
  choice: ce qui était avantageux
  rationale: Le substantif neutre désigne ce qui est utile, profitable ou conforme à l’intérêt des personnes concernées, sans préciser davantage la nature de cet avantage.
- source_word: κοινῇ καὶ κατʼ ἰδίαν
  choice: tant collectivement que pour chacun
  rationale: Cette formulation restitue l’opposition entre l’intérêt de la communauté dans son ensemble et celui de ses membres pris individuellement.
- source_word: παντὶ τῷ πλήθει
  choice: pour toute la population
  rationale: πλῆθος renvoie ici à l’ensemble du peuple ou de la population; cette expression est naturelle et conserve l’ampleur collective du grec.
theological_decisions:
- issue: Caractérisation morale de la démarche d’Onias
  choice: Onias ne se présente pas pour dénoncer ses concitoyens, mais recherche l’intérêt de l’ensemble de la population, collectivement et individuellement.
  alternative: Comprendre la fin plus strictement comme « l’intérêt commun ainsi que celui de chaque personne parmi le peuple ».
  rationale: La syntaxe finale est condensée. La traduction maintient les dimensions collective et individuelle sans attribuer à Onias des intentions plus précises que celles exprimées par le texte.
translation_notes:
  register: Français moderne, digne et accessible. La phrase conserve la caractérisation favorable d’Onias tout en rendant explicitement, de façon idiomatique, le verbe de recherche sous-entendu dans la proposition grecque elliptique.
