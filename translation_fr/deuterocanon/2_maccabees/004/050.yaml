  register: 'Français international moderne, narratif et digne. La syntaxe grecque, très chargée en participes, est répartie en deux phrases pour plus de clarté, tout en conservant la progression logique : maintien en fonction, aggravation morale, puis hostilité active envers les concitoyens.'
