  yaml_path: translation/deuterocanon/2_maccabees/004/050.yaml
  text: But Menelaus[a], because of the greed of those in power, remained in office, growing in wickedness and having become a great plotter against his fellow citizens.
translation:
  language: fr
  text: Mais Ménélas restait en fonction à cause de la cupidité de ceux qui détenaient le pouvoir. Il s’enfonçait toujours plus dans le mal et était devenu un grand comploteur contre ses concitoyens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τὰς τῶν κρατούντων πλεονεξίας
  choice: à cause de la cupidité de ceux qui détenaient le pouvoir
  rationale: διά avec l’accusatif exprime ici la cause. « Cupidité » rend πλεονεξία, tandis que la périphrase « ceux qui détenaient le pouvoir » restitue naturellement le participe κρατούντων sans préciser indûment leur titre.
- source_word: ἔμενεν ἐπὶ τῇ ἀρχῇ
  choice: restait en fonction
  rationale: L’imparfait ἔμενεν indique une situation qui se prolongeait, et ἀρχή désigne ici la charge ou la position d’autorité de Ménélas.
- source_word: ἐπιφυόμενος τῇ κακίᾳ
  choice: s’enfonçait toujours plus dans le mal
  rationale: Cette formulation française naturelle conserve l’idée d’une progression dans la κακία, comprise comme mal moral, sans réduire le participe à un simple état statique.
- source_word: μέγας τῶν πολιτῶν ἐπίβουλος καθεστώς
  choice: était devenu un grand comploteur contre ses concitoyens
  rationale: ἐπίβουλος désigne quelqu’un qui trame des complots contre autrui ; le génitif τῶν πολιτῶν indique les personnes visées. « Ses concitoyens » fait ressortir leur lien civique avec Ménélas, et « était devenu » exprime l’état résultant du parfait καθεστώς.
