  yaml_path: translation/deuterocanon/2_maccabees/004/029.yaml
  text: And Menelaus left Lysimachus[a], his own brother, as successor to the high priesthood, while Sostratus left Crates, the one over the Cyprians.
translation:
  language: fr
  text: Ménélas laissa son propre frère Lysimaque comme son successeur dans la charge de grand prêtre, tandis que Sostrate laissa Cratès à la tête des Chypriotes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « responsable des Chypriotes » ou « gouverneur des Chypriotes ». Le grec ne précise pas son titre administratif exact.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέλιπεν
  choice: laissa
  rationale: Le verbe signifie littéralement « laisser » ou « laisser derrière soi ». Dans ce contexte, le complément précise que Lysimaque est laissé comme successeur; « laissa » conserve donc la formulation grecque sans expliciter davantage une nomination.
- source_word: τῆς ἀρχιερωσύνης διάδοχον
  choice: comme successeur à la fonction de grand prêtre
  rationale: διάδοχον désigne un successeur, tandis que ἀρχιερωσύνη désigne la dignité ou la fonction de grand prêtre. Cette formulation est claire en français moderne et maintient l'idée d'une charge.
- source_word: τὸν ἑαυτοῦ ἀδελφόν
  choice: son propre frère
  rationale: L'expression réfléchie ἑαυτοῦ donne ici une certaine insistance, rendue naturellement par « son propre frère ».
- source_word: τὸν ἐπὶ τῶν Κυπρίων
  choice: responsable des Chypriotes
  rationale: La tournure signifie littéralement « celui qui était au-dessus des Chypriotes ». « Responsable des Chypriotes » reste naturelle tout en évitant de lui attribuer un titre administratif précis que le grec ne donne pas.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les noms propres suivent les formes françaises usuelles. La répétition de « laissa » reflète le parallélisme grec; la note préserve l'imprécision du titre de Cratès.
