base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/048.yaml
  text: And he released Menelaus[a], the cause of all the evil, from among the accused; but for those wretched men—who, even if they had pleaded their case before Scythians[c][b], would have been acquitted—for them he decreed death.
translation:
  language: fr
  text: Parmi les accusés, il relâcha Ménélas, responsable de tout ce mal ; mais ces malheureux — qui, même s’ils avaient plaidé leur cause devant des Scythes[a], auraient été relâchés sans condamnation —, il les condamna à mort[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les Scythes passaient pour particulièrement rudes. La comparaison souligne l’injustice du verdict : même devant eux, ces hommes auraient été relâchés sans condamnation.'
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « il prononça la mort contre eux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν μὲν τῆς ὅλης κακίας αἴτιον Μενέλαον
  choice: Ménélas, responsable de tout ce mal
  rationale: Dans cette construction, αἴτιος désigne celui qui porte la responsabilité ou qui est à l’origine du mal. « Responsable de tout ce mal » garde à la fois la portée causale et morale, dans un français naturel.
- source_word: ἀπέλυσεν τῶν κατηγορημένων
  choice: Parmi les accusés, il relâcha
  rationale: ἀπολύω signifie ici libérer ou relâcher, tandis que le génitif τῶν κατηγορημένων situe Ménélas parmi les personnes accusées. La formulation conserve cette opposition sans transformer explicitement la libération en acquittement judiciaire.
- source_word: τοῖς δὲ ταλαιπώροις
  choice: Mais ces malheureux
  rationale: ταλαίπωρος exprime une condition pitoyable et accablée. « Ces malheureux » restitue la compassion du narrateur sans suggérer la pauvreté matérielle.
- source_word: οἵτινες εἰ καὶ ἐπὶ Σκυθῶν ἔλεγον
  choice: qui ... même s’ils avaient plaidé leur cause devant des Scythes
  rationale: ἐπί avec le génitif a ici une valeur judiciaire, « devant ». Le simple verbe « parler » est elliptique dans ce contexte; « plaider leur cause » rend clairement sa portée judiciaire.
- source_word: ἀπελύθησαν ἀκατάγνωστοι
  choice: auraient été remis en liberté sans condamnation
  rationale: La combinaison associe la remise en liberté à l’absence de condamnation. Cette traduction garde les deux éléments du grec au lieu de les réduire au seul terme technique « acquittés ».
- source_word: θάνατον ἀπέκρινεν
  choice: il les condamna à mort
  rationale: Dans ce contexte judiciaire, ἀποκρίνω désigne la décision rendue. « Condamna à mort » exprime naturellement en français le jugement prononcé, tout en rendant explicite le complément implicite « les ».
