base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/007.yaml
  text: But he in no way ceased from his arrogance[a]; rather, he was filled even more with pride, breathing fire in his rage against the Jews and ordering the journey to be hastened. Then it happened that he fell from the chariot as it was rushing along, and in the hard fall[b] all the limbs of his body were wrenched out of joint.
translation:
  language: fr
  text: Mais il ne cessait nullement de faire preuve d’arrogance ; au contraire, il était encore plus rempli d’orgueil, soufflant le feu dans sa fureur contre les Juifs et ordonnant d’accélérer la marche[a]. Il arriva alors qu’il tombât du char qui filait à toute allure et que, à la suite de cette chute violente[b], tous les membres de son corps se disloquassent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’accélérer le voyage ». Le mot grec peut désigner un déplacement, un voyage ou une marche selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « tous les membres de son corps se déboîtèrent ». Le verbe grec rare évoque vraisemblablement des membres violemment déboîtés à la suite de la chute.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδαμῶς ... ἔληγεν
  choice: ne renonçait en rien
  rationale: Rend la négation fortement accentuée et l’idée qu’Antiochos ne se départait nullement de son attitude, dans un français naturel.
- source_word: ἀγερωχίας
  choice: arrogance
  rationale: Désigne ici une hauteur insolente et dominatrice ; « arrogance » est clair et actuel.
- source_word: ὑπερηφανίας ἐπεπλήρωτο
  choice: était encore plus rempli d’orgueil
  rationale: Préserve l’image de plénitude ainsi que l’intensification portée par ἔτι δὲ καί.
- source_word: πῦρ πνέων τοῖς θυμοῖς
  choice: respirant le feu dans sa fureur
  rationale: Conserve la métaphore vive du grec et exprime la violence de la colère dirigée contre les Juifs.
- source_word: κελεύων ἐποξύνειν τὴν πορίαν
  choice: il ordonna d’accélérer la marche
  rationale: ἐποξύνειν indique qu’il fait presser le déplacement ; dans ce contexte militaire et précipité, « marche » convient bien, sans exclure le sens plus général de voyage.
- source_word: ἅρματος φερομένου ῥοίζῳ
  choice: tandis que le char filait à toute allure
  rationale: Rend naturellement le mouvement rapide évoqué par φερομένου ῥοίζῳ, même si la nuance sonore de ῥοῖζος reste implicite.
- source_word: δυσχερεῖ πτώματι περιπεσόντα
  choice: cette chute violente
  rationale: Exprime la gravité pénible et brutale de la chute, tout en allégeant en français la construction participiale grecque.
- source_word: πάντα τὰ μέλη τοῦ σώματος ἀποσφύζειν
  choice: lui disloqua tous les membres du corps
  rationale: Le verbe rare semble décrire un violent déboîtement des membres ; « disloquer » conserve cette force sans préciser indûment chaque articulation.
theological_decisions:
- issue: Caractérisation morale d’Antiochos par deux termes liés à l’orgueil
  choice: Maintenir « arrogance » et « orgueil » comme deux termes distincts
  alternative: Uniformiser les deux noms grecs par « orgueil » ou « arrogance »
  rationale: Le grec emploie ἀγερωχία puis ὑπερηφανία afin de produire une intensification rhétorique. Les distinguer préserve cette progression sans lui ajouter une interprétation doctrinale.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase grecque longue est divisée pour rester claire à l’oral comme à l’écrit, tout en conservant l’escalade entre arrogance, orgueil, fureur, précipitation et chute.
