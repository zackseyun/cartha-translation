  text: But Philip[a], his companion, was carrying the body; and, because he feared Antiochus’s son[b], he went over to Ptolemy Philometor in Egypt.
translation:
  language: fr
  text: Philippe, son compagnon[a], transportait le corps. Mais, par crainte du fils d’Antiochos, il se rendit auprès de Ptolémée Philométor, en Égypte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut aussi désigner un proche élevé avec lui, c’est-à-dire un compagnon d’enfance ou un proche de la cour.
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « il fut transféré auprès de Ptolémée Philométor, en Égypte ». Le verbe grec est de forme passive.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκομίζετο
  choice: transportait
  rationale: L’imparfait exprime une action de transport en cours. « Transportait » convient naturellement au déplacement d’un corps sans suggérer que Philippe le portait lui-même dans ses bras.
- source_word: τὸ σῶμα
  choice: le corps
  rationale: Le grec emploie simplement le nom défini, sans possessif explicite. Le contexte indique qu’il s’agit du corps du roi défunt.
- source_word: σύντροφος
  choice: compagnon
  rationale: Le terme peut désigner un proche élevé avec quelqu’un, voire un compagnon de cour. « Compagnon » préserve cette latitude sans imposer un statut technique.
- source_word: εὐλαβηθεὶς
  choice: par crainte de
  rationale: Le participe indique ici que la peur ou la prudence envers le fils d’Antiochos motive le départ de Philippe.
- source_word: τὸν υἱὸν Ἀντιόχου
  choice: le fils d’Antiochos
  rationale: Traduction directe qui n’ajoute pas l’idée interprétative d’héritier.
- source_word: πρὸς Πτολεμαῖον τὸν Φιλομήτορα
  choice: auprès de Ptolémée Philométor
  rationale: πρός avec le mouvement indique que Philippe gagne la cour ou la protection de Ptolémée; « auprès de » rend cette orientation personnelle et politique.
- source_word: διεκομίσθη
  choice: il se rendit
  rationale: Bien que la forme grecque soit passive, le contexte décrit le transfert de Philippe en Égypte. « Il se rendit » donne un français naturel tout en conservant l’idée de déplacement; la forme plus littérale est signalée en note.
