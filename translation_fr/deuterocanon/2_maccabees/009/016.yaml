base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/016.yaml
  text: And the holy temple[a], which he had formerly plundered, he would adorn with the finest votive offerings, and he would restore all the sacred vessels many times over, and from his own revenues he would provide the expenses required for the sacrifices[b];
translation:
  language: fr
  text: Il ornerait le saint temple qu’il avait auparavant pillé des plus belles offrandes votives[a], restituerait tous les objets sacrés en quantité bien plus grande[b] et prendrait sur ses propres revenus en charge les dépenses nécessaires aux sacrifices.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « offrandes votives » sont des dons consacrés et placés dans un sanctuaire.
    reason: Précision lexicale sur ἀναθήματα.
  - marker: b
    text: Le grec exprime une restitution en quantité multipliée, donc bien au-delà d’un simple remplacement, sans en indiquer la mesure exacte.
    reason: πολυπλάσια souligne une restitution largement accrue sans préciser de facteur numérique.
lexical_decisions:
- source_word: ἐσκύλευεν
  choice: avait auparavant pillé
  rationale: L’imparfait grec évoque l’action antérieure d’Antiochos envers le temple; le plus-que-parfait français et « auparavant » rendent clairement le contraste avec ses promesses présentes.
- source_word: ἅγιον ναὸν
  choice: le temple saint
  rationale: Cette expression conserve à la fois la référence au temple de Jérusalem et son caractère consacré.
- source_word: καλλίστοις ἀναθήμασιν
  choice: des plus belles offrandes votives
  rationale: Le superlatif καλλίστοις est rendu par « des plus belles », tandis que « offrandes votives » précise qu’il s’agit de dons consacrés et exposés dans un sanctuaire.
- source_word: κοσμήσειν
  choice: ornerait
  rationale: Le verbe désigne l’embellissement du temple au moyen des offrandes; « orner » est naturel et digne.
- source_word: τὰ ἱερὰ σκεύη
  choice: tous les objets sacrés
  rationale: « Objets sacrés » désigne clairement les ustensiles cultuels sans laisser entendre qu’il s’agit uniquement de récipients.
- source_word: πολυπλάσια πάντα ἀποδώσειν
  choice: restituerait au multiple tous les objets sacrés
  rationale: La formulation conserve l’idée grecque d’une restitution en quantité multipliée, et non d’un simple remplacement, sans préciser un facteur absent du texte.
- source_word: τὰς ἐπιβαλλούσας πρὸς τὰς θυσίας συντάξεις
  choice: les dépenses nécessaires aux sacrifices
  rationale: Dans ce contexte financier, συντάξεις désigne les sommes à fournir, tandis que ἐπιβαλλούσας exprime ce qui est requis ou incombe pour les sacrifices.
- source_word: ἐκ τῶν ἰδίων προσόδων
  choice: sur ses propres revenus
  rationale: La tournure française conserve la nuance fiscale de πρόσοδοι et souligne qu’Antiochos promet de financer ces dépenses avec ses revenus.
- source_word: χορηγήσειν
  choice: prendrait en charge
  rationale: Le verbe grec signifie ici fournir à ses frais; « prendre en charge » explicite naturellement cette responsabilité financière.
theological_decisions:
- issue: Terminologie cultuelle du temple
  choice: 'Employer des termes explicitement cultuels : « temple saint », « offrandes votives », « objets sacrés » et « sacrifices ».'
  alternative: Généraliser par « sanctuaire », « cadeaux », « objets religieux » ou « rites ».
  rationale: Le verset concerne précisément le temple de Jérusalem, ses biens consacrés et son culte sacrificiel. Cette terminologie préserve le cadre historique et religieux sans ajouter d’interprétation confessionnelle.
- issue: Portée de la restitution multipliée
  choice: Conserver l’expression ouverte « au multiple » et l’expliquer en note.
  alternative: Préciser une restitution de la valeur, un nombre déterminé d’exemplaires ou une compensation au centuple.
  rationale: πολυπλάσια affirme une restitution multipliée, mais ne précise ni le facteur ni si l’accent porte sur le nombre ou sur la compensation; la traduction ne tranche donc pas au-delà du grec.
translation_notes:
  register: Français international moderne, clair et digne. La construction au conditionnel maintient la série de promesses rapportées dans le contexte. « Au multiple », légèrement soutenu, est conservé pour ne pas effacer l’indétermination du grec et reçoit une note explicative.
