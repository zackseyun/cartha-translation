  yaml_path: translation/deuterocanon/2_maccabees/009/027.yaml
  text: For I am convinced that[a], if he is guided by my purpose with fairness and humanity, he will deal with you accordingly.
translation:
  language: fr
  text: Car je suis convaincu que, disposé avec équité et humanité en accord avec mon dessein[a], il se comportera de même envers vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le participe grec rendu par « disposé ... en accord avec » est très condensé et difficile. Il peut aussi se comprendre comme « mis en accord avec » ou « amené à se conformer à » le dessein du locuteur.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέπεισμαι
  choice: je suis convaincu
  rationale: Le parfait exprime une conviction ferme et établie ; cette tournure est naturelle en français moderne.
- source_word: ἐπιεικῶς
  choice: avec équité
  rationale: L’adverbe évoque une attitude raisonnable, conciliante et mesurée ; « avec équité » en conserve la portée éthique sans la réduire à la douceur.
- source_word: φιλανθρώπως
  choice: avec humanité
  rationale: Le terme désigne une conduite bienveillante et humaine envers autrui ; « avec humanité » restitue directement cette nuance.
- source_word: συνσταθέντα
  choice: disposé … à suivre
  rationale: Le participe, de sens condensé et difficile, semble exprimer une disposition ou une mise en accord avec les intentions du locuteur. Cette formulation reste lisible tout en signalant l’orientation vers celles-ci.
- source_word: τῇ ἐμῇ προαιρέσει
  choice: mes intentions
  rationale: προαίρεσις renvoie ici à un dessein délibéré ou à une ligne de conduite arrêtée ; le pluriel idiomatique français convient au contexte personnel et politique.
- source_word: συνπεριενεχθήσεσθαι
  choice: il se comportera de même envers vous
  rationale: Le futur infinitif indique la manière dont il se conduira envers les destinataires, en correspondance avec l’attitude et les intentions qui viennent d’être évoquées.
