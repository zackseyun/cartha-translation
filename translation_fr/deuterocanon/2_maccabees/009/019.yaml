  text: 'King Antiochus and general[a], to the good Jewish citizens: many greetings, and health[b], and prosperity.'
translation:
  language: fr
  text: 'Antiochos, roi et général[a], aux bons citoyens juifs : nombreuses salutations, santé et prospérité[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dans le grec, le nom et les titres de l’expéditeur viennent après la formule de salutation : « Aux bons citoyens juifs… le roi Antiochos et général. » Ils sont placés en tête ici conformément à l’usage épistolaire français.'
    reason: cultural_note
  - marker: b
    text: Ou « bien-être » ; le grec signifie littéralement « bien aller » ou « réussir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς χρηστοῖς
  choice: aux estimables
  rationale: χρηστός peut exprimer la bonté, la bienveillance ou la valeur. Dans cette adresse officielle, « estimables » conserve la nuance élogieuse sans suggérer un jugement moral trop appuyé.
- source_word: Ἰουδαίοις
  choice: juifs
  rationale: Dans ce contexte, le terme désigne le peuple juif dans son identité ethnoreligieuse, et non simplement les habitants de la Judée.
- source_word: τοῖς πολίταις
  choice: citoyens
  rationale: πολίτης signifie directement « citoyen » et appartient ici à l’adresse officielle aux destinataires.
- source_word: πολλὰ χαίρειν
  choice: salutations chaleureuses
  rationale: Formule épistolaire amplifiée par πολλά. « Salutations chaleureuses » restitue naturellement en français l’intensité de l’expression, contrairement au calque « beaucoup de salutations ».
- source_word: ὑγιαίνειν
  choice: santé
  rationale: Dans cette série de souhaits épistolaires, l’infinitif exprime le vœu que les destinataires soient en bonne santé.
- source_word: εὖ πράττειν
  choice: prospérité
  rationale: L’expression signifie « bien aller » ou « réussir ». « Prospérité » est idiomatique dans une salutation officielle, tandis que « bien-être » demeure une possibilité.
- source_word: βασιλεὺς Ἀντίοχος καὶ στρατηγὸς
  choice: Le roi Antiochos, également chef de l’armée
  rationale: La formulation conserve les deux désignations tout en rendant intelligible en français la coordination grecque inhabituelle. « Chef de l’armée » exprime ici le sens militaire de στρατηγός plus naturellement que le titre français moderne « général ».
