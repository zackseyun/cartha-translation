revisions:
- from: Je gardais affectueusement à l’esprit votre respect et votre bienveillance[a] ; de retour des régions de Perse et atteint d’une maladie devenue grave[b], j’ai jugé nécessaire de veiller à votre sécurité commune[c].
  to: Je me souvenais avec affection de votre honneur et de votre bienveillance[a] ; de retour des régions de Perse et atteint d’une grave maladie[b], j’ai jugé nécessaire de veiller à la sécurité commune de vous tous[c].
  rationale: La révision remplace « respect » par « honneur », améliore la fluidité de la première proposition et évite de présenter comme une aggravation certaine ce que le grec exprime comme le caractère pénible ou grave de la maladie. Les trois ancres de notes sont conservées et leurs contenus restent alignés sur les alternatives lexicales pertinentes.
