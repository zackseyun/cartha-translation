base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/021.yaml
  text: I remembered your honor and goodwill with affection[a]; after returning from the regions of Persia and falling into an illness that has become severe, I considered it necessary to take thought for the common safety of all of you[c][b];
translation:
  language: fr
  text: Je me souvenais avec affection de votre honneur et de votre bienveillance[a] ; de retour des régions de Perse et atteint d’une grave maladie[b], j’ai jugé nécessaire de veiller à la sécurité commune de vous tous[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « votre honneur et votre bonne volonté ». Les termes grecs peuvent désigner l’honneur ou l’estime, ainsi que la bienveillance, la bonne volonté ou la faveur.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « tombé dans une maladie ayant un caractère pénible ». L’expression désigne une maladie sérieuse ou difficile à supporter.
    reason: lexical_alternative
  - marker: c
    text: Ou « à votre sécurité publique » ou « à la sécurité publique de vous tous ».
    reason: lexical_alternative
lexical_decisions:
- source_word: τιμή
  choice: respect
  rationale: Le nom peut désigner l’honneur ou l’estime. Dans le contexte relationnel d’une lettre royale adressée à un peuple, « respect » exprime naturellement l’honneur témoigné, sans le réduire explicitement à la loyauté politique.
- source_word: εὔνοια
  choice: bienveillance
  rationale: Le terme désigne une disposition favorable, la bonne volonté ou la faveur. « Bienveillance » convient au registre digne de la lettre et s’associe naturellement à « respect ».
- source_word: ἐμνημόνευον
  choice: je gardais à l’esprit
  rationale: L’imparfait grec présente un souvenir ou une considération prolongée. « Je gardais à l’esprit » en conserve mieux l’aspect que le simple passé composé.
- source_word: φιλοστόργως
  choice: affectueusement
  rationale: L’adverbe exprime un attachement chaleureux, parfois proche de l’affection familiale. « Affectueusement » garde cette chaleur sans imposer une relation familiale explicite.
- source_word: ἐπαναγαγών
  choice: de retour
  rationale: Le participe indique ici le retour du roi depuis les territoires perses. La tournure « de retour » rend naturellement la relation temporelle avec la proposition principale.
- source_word: ἐκ τῶν κατὰ τὴν Περσίδα τόπων
  choice: des régions de Perse
  rationale: La locution renvoie aux lieux ou territoires situés en Perse. « Régions de Perse » est précis et idiomatique.
- source_word: περιπεσών
  choice: atteint de
  rationale: Avec ἀσθενείᾳ, le verbe décrit le fait de tomber dans un état de maladie. « Atteint de » est naturel en français tout en conservant l’idée d’une maladie survenue.
- source_word: ἀσθενείᾳ δυσχερίαν ἔχουσῃ
  choice: une maladie devenue grave
  rationale: La construction qualifie la maladie comme pénible, difficile ou sérieuse. « Devenue grave » en transmet clairement la progression ou l’état préoccupant sans surtraduire le degré clinique.
- source_word: ἀναγκαῖον ἡγησάμην
  choice: j’ai jugé nécessaire
  rationale: Cette expression formule une appréciation suivie d’une décision. « J’ai jugé nécessaire » en respecte le registre formel.
- source_word: φροντίσαι
  choice: veiller à
  rationale: Le verbe signifie se préoccuper de, prendre soin de ou pourvoir à. « Veiller à » convient à la responsabilité politique évoquée ici.
- source_word: κοινῆς πάντων ὑμῶν ἀσφαλείας
  choice: votre sécurité commune
  rationale: ἀσφάλεια désigne la sûreté ou la sécurité, tandis que κοινῆς et πάντων ὑμῶν insistent sur son caractère partagé par tous les destinataires. La formulation française évite une répétition lourde tout en gardant le sens collectif.
