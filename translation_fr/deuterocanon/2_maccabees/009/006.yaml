  text: very justly[b][a], he who had tortured the inward parts of others with many and foreign afflictions.
translation:
  language: fr
  text: C’était tout à fait juste pour celui qui avait torturé les entrailles des autres en leur infligeant de nombreuses souffrances insolites.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot traduit par « insolites » peut aussi signifier « étranges », « inhabituelles » ou « étrangères ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πάνυ δικαίως
  choice: tout à fait juste
  rationale: πάνυ renforce δικαίως. Cette expression conserve le jugement moral explicite du grec dans un français naturel.
- source_word: σπλάγχνα
  choice: les entrailles
  rationale: Le mot désigne concrètement les organes internes. Dans ce contexte de torture physique, « entrailles » évite de réduire le terme à un sens affectif comme « cœur ».
- source_word: βασανίσαντα
  choice: avait torturé
  rationale: Le participe exprime ici un supplice grave antérieur au châtiment d’Antiochos ; le plus-que-parfait français rend clairement cette relation rétrospective.
- source_word: πολλαῖς καὶ ξενίζουσαις συμφοραῖς
  choice: en leur infligeant de nombreuses souffrances insolites
  rationale: συμφοραί évoque des maux ou souffrances, tandis que ξενίζουσαις les caractérise comme étranges ou inhabituelles. La formulation explicite naturellement en français que ces souffrances atteignaient les autres sans changer le sens contextuel.
- source_word: τὸν ... βασανίσαντα
  choice: lui qui avait torturé
  rationale: L’article et le participe grecs désignent Antiochos comme « celui qui avait torturé ». La tournure détachée « lui qui » conserve cet accent tout en s’articulant avec le jugement précédent.
theological_decisions:
- issue: Évaluation morale de la souffrance d’Antiochos
  choice: « C’était tout à fait juste » présente son châtiment comme une juste rétribution.
  alternative: « C’était bien mérité » serait plus idiomatique, mais interpréterait davantage la notion de justice en termes de mérite.
  rationale: Le grec affirme explicitement la justice du châtiment. La traduction maintient ce jugement sans l’atténuer ni développer une doctrine de la rétribution.
translation_notes:
  register: Français moderne, digne et accessible. « Entrailles » conserve le caractère concret et corporel du grec ; « lui qui » maintient l’emphase du participe substantivé. La ponctuation rend lisible une proposition grecque qui dépend étroitement du contexte précédent.
