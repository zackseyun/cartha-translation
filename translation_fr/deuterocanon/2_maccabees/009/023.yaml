  yaml_path: translation/deuterocanon/2_maccabees/009/023.yaml
  text: And seeing that my father[a], whenever he campaigned in the upper regions, appointed the one who would succeed him,
translation:
  language: fr
  text: Voyant aussi que mon père, chaque fois qu’il partait en campagne dans les régions supérieures[a], désignait celui qui devait lui succéder,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « allait camper dans les régions supérieures » ; le verbe grec signifie plus littéralement « camper », mais il peut ici désigner plus largement le fait de partir en campagne.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρῶν
  choice: Voyant
  rationale: Le participe introduit le motif du locuteur. « Voyant » reste proche du grec tout en étant naturel dans cette construction.
- source_word: ὁ πατήρ
  choice: mon père
  rationale: 'Le grec porte l’article, mais le contexte exige en français le possessif : il s’agit du père du locuteur.'
- source_word: καθʼ οὓς καιρούς
  choice: chaque fois que
  rationale: Cette tournure exprime naturellement en français la valeur répétitive ou distributive de l’expression grecque.
- source_word: εἰς τοὺς ἄνω τόπους
  choice: dans les régions supérieures
  rationale: « Régions supérieures » conserve l’indication spatiale du grec sans identifier trop précisément ces territoires comme montagneux ou intérieurs.
- source_word: ἐστρατοπέδευσεν
  choice: partait en campagne
  rationale: Le verbe signifie littéralement « camper », mais peut désigner ici une expédition militaire. « Partait en campagne » rend clairement ce sens contextuel tout en laissant la variante littérale en note.
- source_word: ἀνέδειξεν
  choice: désignait
  rationale: Dans ce contexte dynastique, le verbe indique la désignation officielle d’un successeur. « Désignait » convient mieux que « nommait », qui pourrait suggérer l’attribution d’un nom.
- source_word: τὸν διαδεξάμενον
  choice: celui qui devait lui succéder
  rationale: Cette formulation préserve la valeur verbale du participe et l’orientation future impliquée par la désignation préalable.
