base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/028.yaml
  text: So then the murderer and blasphemer[a], after suffering the worst things, just as he had treated others, came to a most pitiable end in a foreign land among the mountains.
translation:
  language: fr
  text: Ainsi donc, le meurtrier et blasphémateur, après avoir subi les pires maux, comme il avait traité les autres, connut, en terre étrangère, dans les montagnes, une fin des plus lamentables.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’extrait grec fourni s’interrompt à κατέ- au changement de ligne ; la syntaxe indique que la phrase se poursuit en évoquant l’achèvement de sa vie. La traduction restitue ce sens.
    reason: textual_variant
lexical_decisions:
- source_word: ἀνδροφόνος
  choice: meurtrier
  rationale: Le composé désigne celui qui tue des êtres humains. « Meurtrier » est naturel en français moderne et conserve la forte condamnation morale du contexte.
- source_word: βλάσφημος
  choice: blasphémateur
  rationale: Dans ce contexte, le terme vise l’impiété exprimée contre Dieu; « blasphémateur » en garde la portée religieuse.
- source_word: τὰ χείριστα παθών
  choice: après avoir subi les pires maux
  rationale: Cette formulation rend la valeur circonstancielle du participe et le superlatif χείριστα sans préciser indûment la nature des souffrances.
- source_word: ὡς ἑτέρους διέθηκεν
  choice: comme il en avait fait subir aux autres
  rationale: 'Le pronom « en » reprend les maux et exprime naturellement la réciprocité punitive: il subit ce qu’il avait infligé à autrui.'
- source_word: ἐπὶ ξένης
  choice: en terre étrangère
  rationale: La formule indique qu’il finit loin de son pays et conserve la tonalité pathétique du grec.
- source_word: ἐν τοῖς ὄρεσιν
  choice: dans les montagnes
  rationale: Traduction directe et idiomatique de la localisation exprimée par ἐν avec le datif pluriel.
- source_word: οἰκτίστῳ μόρῳ
  choice: une fin des plus lamentables
  rationale: μόρος évoque ici le destin fatal ou la mort, tandis que le superlatif οἰκτίστῳ en souligne le caractère extrêmement lamentable. « Fin » conserve cette amplitude sans réduire le syntagme à la seule manière de mourir.
- source_word: κατέ-
  choice: connut … une fin
  rationale: L’extrait visible s’arrête au début d’un mot après κατέ-, mais la syntaxe et le contexte indiquent l’achèvement de sa vie. La formulation française exprime ce sens tout en signalant la coupure dans une note.
theological_decisions:
- issue: Présentation de la mort d’Antiochos comme rétribution morale
  choice: 'La comparaison explicite est conservée: il subit les maux qu’il avait fait subir aux autres.'
  alternative: Rapporter seulement sa mort sans faire ressortir la réciprocité du jugement.
  rationale: La proposition ὡς ἑτέρους διέθηκεν établit directement cette correspondance et ne doit pas être atténuée.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La phrase conserve la solennité narrative et la structure de rétribution du grec, tout en évitant une tournure trop littérale ou peu naturelle.
