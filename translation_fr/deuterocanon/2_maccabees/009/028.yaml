  source_fidelity: La désignation « meurtrier et blasphémateur », le superlatif de τὰ χείριστα, le lieu en terre étrangère et dans les montagnes, ainsi que l’issue extrêmement pitoyable sont bien rendus. Toutefois, « comme il en avait fait subir aux autres » fait de « les pires maux » l’antécédent explicite de « en » et spécifie ainsi davantage que le grec ὡς ἑτέρους διέθηκεν, qui énonce plus largement la manière dont il avait traité les autres. Il convient de préserver cette formulation plus ouverte.
  naturalness: La phrase est globalement naturelle et de registre narratif soutenu. La suppression de « ce » et du pronom « en » rend la phrase plus sobre et plus directement calquée sur la portée du grec, sans perdre sa fluidité.
  terminology: « Meurtrier », « blasphémateur », « pires maux », « terre étrangère », « montagnes » et « une fin des plus lamentables » conviennent au français international moderne et conservent le registre du passage. La note signale correctement que le témoin fourni s’interrompt à κατέ-.
