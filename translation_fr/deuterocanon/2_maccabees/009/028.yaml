revisions:
- from: Ainsi donc, ce meurtrier et blasphémateur, après avoir subi les pires maux, comme il en avait fait subir aux autres, connut, en terre étrangère, dans les montagnes, une fin des plus lamentables.[a]
  to: Ainsi donc, le meurtrier et blasphémateur, après avoir subi les pires maux, comme il avait traité les autres, connut, en terre étrangère, dans les montagnes, une fin des plus lamentables.[a]
  rationale: La révision retire la reprise pronominale « en », qui identifiait explicitement les maux subis à ceux infligés aux autres. Elle conserve la comparaison rétributive voulue par le grec tout en laissant à διέθηκεν sa portée non spécifiée. La note est maintenue, avec une ponctuation française normalisée, car le texte grec fourni est matériellement tronqué après κατέ-.
