base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/020.yaml
  text: Farewell[a], and your children. And your own affairs—your own affairs—your own affairs will be according to your judgment. Having my hope in heaven,
translation:
  language: fr
  text: Portez-vous bien, vous et vos enfants. Et vos propres affaires — vos propres affaires — vos propres affaires[a] — seront comme vous le jugerez. Avec mon espérance tournée vers le ciel,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le témoin grec employé ici répète trois fois « vos propres affaires ». Cette répétition peut être comprise comme une insistance ; elle pourrait aussi provenir d’une duplication accidentelle lors de la transmission du texte.
    reason: textual_variant
lexical_decisions:
- source_word: ἐρρῶσθε
  choice: Portez-vous bien
  rationale: Dans une lettre, la forme exprime un souhait conventionnel de bonne santé ou de bien-être. Cette tournure française conserve ce sens sans la réduire à une formule d’adieu définitif.
- source_word: τὰ τέκνα
  choice: vos enfants
  rationale: Après l’adresse directe, l’article grec se comprend naturellement avec une valeur possessive en français. « Enfants » reste inclusif et fidèle.
- source_word: τὰ ἴδια
  choice: vos propres affaires
  rationale: Le neutre pluriel désigne ici ce qui concerne personnellement les destinataires. « Affaires » rend l’expression idiomatiquement tout en permettant d’en conserver la triple répétition.
- source_word: κατὰ γνώμην ὑμῶν
  choice: selon votre jugement
  rationale: γνώμη peut désigner l’avis, l’intention ou le jugement réfléchi. La traduction retenue préserve la formulation assez formelle et son ouverture sémantique.
- source_word: ἔσται
  choice: se régleront
  rationale: Le simple « seront » serait grammaticalement maladroit avec « affaires » en français. « Se régleront » exprime naturellement que ces affaires suivront le jugement des destinataires, sans ajouter d’agent.
- source_word: εἰς οὐρανὸν τὴν ἐλπίδα ἔχων
  choice: Mettant mon espérance dans le ciel
  rationale: La proposition participiale grecque est condensée et reste rattachée à la suite. Cette traduction garde sa valeur circonstancielle ainsi que l’orientation de l’espérance vers le ciel.
theological_decisions:
- issue: Triple répétition de τὰ ἴδια dans le témoin grec
  choice: Conserver les trois occurrences dans le texte principal
  alternative: N’en garder qu’une, en considérant les deux autres comme une duplication accidentelle de transmission
  rationale: Le témoin grec fourni porte trois occurrences. L’incertitude éventuelle sur leur origine doit être signalée plutôt que résolue silencieusement; la répétition est donc maintenue et expliquée en note.
- issue: Référent de l’espérance dirigée vers le ciel
  choice: Traduire littéralement « mon espérance dans le ciel » sans préciser davantage son objet
  alternative: Expliciter « mon espérance en Dieu » ou « dans le Dieu du ciel »
  rationale: Le grec nomme le ciel, mais n’explicite pas l’objet ultime de l’espérance. Une explicitation théologique lèverait une ambiguïté réelle du texte.
translation_notes:
  register: Français moderne, digne et lisible. La triple répétition, inhabituelle en français, est volontairement conservée en raison du témoin source et mise en relief par des tirets. Le verset se termine par une virgule parce que la proposition participiale grecque appelle la suite de la phrase.
