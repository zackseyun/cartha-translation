  yaml_path: translation/deuterocanon/2_maccabees/009/004.yaml
  text: But in his rage he thought to vent on the Jews the malice of those who had put him to flight. Therefore he ordered the charioteer[a], driving without stopping, to press on with the journey, while the judgment from heaven was accompanying him. For in his arrogance he had said, “When I arrive there, I will make Jerusalem a burial place of Jews.”
translation:
  language: fr
  text: 'Mais, emporté par la fureur, il pensait faire payer aux Juifs le mal que lui avaient fait ceux qui l’avaient mis en fuite. Il ordonna donc au conducteur du char de conduire sans relâche pour achever le trajet, tandis que le jugement venu du ciel l’accompagnait. Car, dans son arrogance, il avait déclaré : « Quand j’y serai arrivé, je ferai de Jérusalem un lieu de sépulture pour les Juifs[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un tombeau collectif de Juifs ». Le mot grec désigne un lieu où sont ensevelis de nombreux morts.
    reason: Alternative lexicale pour Πολυάνδριον, qui explicite l’idée d’un lieu de sépulture collectif sans imposer l’image plus spécifique d’une fosse commune.
lexical_decisions:
- source_word: ἐπαρθεὶς ... τῷ θυμῷ
  choice: emporté par la fureur
  rationale: Cette formulation française naturelle exprime l’idée d’un homme soulevé ou dominé par une violente colère.
- source_word: ᾤετο
  choice: il pensait
  rationale: Le verbe exprime ici son intention ou son projet, sans présenter celui-ci comme déjà réalisé.
- source_word: τῶν πεφυγαδευκότων αὐτὸν κακίαν ... ἐναπερείσασθαι
  choice: faire payer aux Juifs le mal que lui avaient fait ceux qui l’avaient mis en fuite
  rationale: La formulation rend clairement le transfert injuste sur les Juifs du tort ou de l’hostilité associés à ceux qui avaient contraint Antiochus à fuir. Elle évite le peu naturel « imposer leur méchanceté aux Juifs ».
- source_word: τὸν ἁρματηλάτην
  choice: au conducteur du char
  rationale: Le terme grec désigne précisément celui qui conduit un char; cette expression est plus immédiatement compréhensible que « aurige ».
- source_word: ἀδιαλείπτως ἐλαύνοντα καταλύειν τὴν πορείαν
  choice: de poursuivre la route sans s’arrêter
  rationale: Cette traduction restitue l’ordre de rouler continuellement afin d’achever rapidement le trajet, sans imposer au français le sens littéral ambigu de « mettre fin au voyage ».
- source_word: τῆς ἐξ οὐρανοῦ τῆς κρίσεως συνοδούσης αὐτῷ
  choice: tandis que le jugement venu du ciel l’accompagnait
  rationale: Le génitif absolu indique la simultanéité; « jugement » conserve la portée judiciaire de κρίσις et « l’accompagnait » rend directement συνοδούσης.
- source_word: ὑπερηφάνως
  choice: dans son arrogance
  rationale: Le choix exprime la hauteur insolente que le narrateur attribue à cette déclaration.
- source_word: Πολυάνδριον
  choice: un lieu de sépulture
  rationale: Le nom désigne un emplacement destiné à recevoir de nombreux morts. Le rendu principal reste large, tandis que la note signale une formulation plus explicite.
theological_decisions:
- issue: Origine divine du jugement qui atteint Antiochus
  choice: le jugement venu du ciel l’accompagnait
  alternative: le châtiment céleste le suivait
  rationale: Le texte attribue explicitement le jugement au ciel. « Jugement » préserve la dimension judiciaire de κρίσις sans la réduire à la seule souffrance, et « accompagnait » maintient l’image singulière du grec.
translation_notes:
  register: Français international moderne, narratif et digne. Le vocabulaire reste accessible; « conducteur du char » est préféré au terme spécialisé « aurige ». La citation conserve la brutalité et l’arrogance de la menace.
