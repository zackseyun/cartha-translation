revisions:
- from: 'Mais, emporté par la fureur, il pensait faire payer aux Juifs le mal que lui avaient fait ceux qui l’avaient mis en fuite. Il ordonna donc au conducteur du char de poursuivre la route sans s’arrêter, tandis que le jugement venu du ciel l’accompagnait. Car, dans son arrogance, il avait déclaré : « Quand je serai arrivé là-bas, je ferai de Jérusalem un lieu de sépulture pour les Juifs[a]. »'
  to: 'Mais, emporté par la fureur, il pensait faire payer aux Juifs le mal que lui avaient fait ceux qui l’avaient mis en fuite. Il ordonna donc au conducteur du char de conduire sans relâche pour achever le trajet, tandis que le jugement venu du ciel l’accompagnait. Car, dans son arrogance, il avait déclaré : « Quand j’y serai arrivé, je ferai de Jérusalem un lieu de sépulture pour les Juifs[a]. »'
  rationale: 'La révision précise l’ordre donné au conducteur : il doit mener le char sans arrêt afin d’achever le trajet. Elle améliore aussi la note lexicale sur Πολυάνδριον en conservant l’étendue sémantique du grec. Le reste de la formulation est maintenu, car il est fidèle, naturel et théologiquement non réducteur.'
