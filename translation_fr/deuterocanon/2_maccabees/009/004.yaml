    issue: Rendu de καταλύειν τὴν πορείαν
    rationale: « Poursuivre la route » indique la continuation, tandis que le grec évoque plus directement le fait de mener le voyage à son terme. Une formulation incluant l’achèvement du trajet conserve les deux éléments de la construction.
  - severity: low
    issue: Alternative de note « fosse commune »
    rationale: Cette expression est possible dans le contexte, mais elle peut évoquer une fosse ou un ensevelissement de crise. Πολυάνδριον désigne plus largement un lieu ou tombeau recevant de nombreux morts ; « tombeau collectif » évite cette surdétermination.
