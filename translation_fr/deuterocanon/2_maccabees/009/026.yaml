  yaml_path: translation/deuterocanon/2_maccabees/009/026.yaml
  text: Therefore I urge you and ask you, remembering the benefits shown both publicly and privately, each of you to maintain the goodwill that now exists toward me and my son.
translation:
  language: fr
  text: Je vous exhorte donc et vous demande, en vous souvenant des bienfaits accordés publiquement et en privé, de conserver, chacun de vous, la bienveillance qui existe actuellement envers moi et mon fils.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρακαλῶ ... καὶ ἀξιῶ
  choice: Je vous exhorte donc et vous demande
  rationale: 'Rend les deux verbes distincts : παρακαλέω exprime ici l’exhortation pressante, tandis que ἀξιόω introduit une demande jugée légitime.'
- source_word: τῶν εὐεργεσιῶν
  choice: des bienfaits accordés
  rationale: « Bienfaits » restitue naturellement εὐεργεσίαι; « accordés » explicite sobrement l’idée d’actions bénéfiques sans préciser dans le texte ceux qui les ont accomplies.
- source_word: κοινῇ καὶ κατʼ ἰδίαν
  choice: à tous comme à chacun en particulier
  rationale: Cette formulation française rend l’opposition entre la dimension collective et la dimension individuelle, plutôt qu’une distinction potentiellement ambiguë entre sphères publique et privée.
- source_word: συντηρεῖν
  choice: de conserver
  rationale: Le verbe signifie maintenir ou préserver un état déjà présent.
- source_word: τὴν οὖσαν εὔνοιαν
  choice: la bienveillance que vous avez actuellement
  rationale: εὔνοια désigne une disposition favorable; le participe οὖσαν marque qu’elle existe déjà au moment de la demande.
- source_word: εἰς ἐμὲ καὶ τὸν υἱόν
  choice: envers moi et mon fils
  rationale: « Envers » exprime idiomatiquement l’orientation de cette bienveillance vers les deux personnes.
