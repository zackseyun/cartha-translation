base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/002.yaml
  text: For he had entered the so-called Persepolis and attempted to rob the temple and seize control of the city[a]; therefore, when the crowds rushed to arms, they turned him back, and it happened that Antiochus, put to flight by the local inhabitants[b], made a shameful retreat.
translation:
  language: fr
  text: Il était en effet entré dans la ville appelée Persépolis et avait tenté de piller le temple et de prendre le contrôle de la ville. C’est pourquoi, les foules s’étant élancées, elles eurent recours aux armes[a]. Antiochos fut alors mis en fuite par les habitants du pays et battit honteusement en retraite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « elles se tournèrent vers le secours des armes », c’est-à-dire qu’elles eurent recours à la défense armée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσεληλύθει
  choice: était entré
  rationale: Le plus-que-parfait exprime une action antérieure aux événements racontés ensuite.
- source_word: τὴν λεγομένην Περσέπολιν
  choice: la ville appelée Persépolis
  rationale: Rend explicitement λεγομένην sans donner à tort à « soi-disant » une nuance française de doute ou d’ironie.
- source_word: ἐπεχείρησεν
  choice: avait tenté
  rationale: Le verbe indique une entreprise ou tentative, non une action menée à son terme.
- source_word: ἱεροσυλεῖν
  choice: piller le temple
  rationale: Le verbe désigne spécifiquement le dépouillement sacrilège d’un lieu saint; cette traduction conserve l’objet cultuel et reste naturelle.
- source_word: συνέχειν
  choice: prendre le contrôle de
  rationale: Dans ce contexte politico-militaire, il s’agit de s’emparer de la ville et de la tenir sous son contrôle.
- source_word: τῶν πληθῶν ὁρμησάντων
  choice: les foules s’étant élancées
  rationale: Le génitif absolu décrit le mouvement soudain et énergique de la population.
- source_word: ἐπὶ τὴν τῶν ὅπλων βοήθειαν ἐτράπησαν
  choice: elles eurent recours aux armes
  rationale: Suit la construction grecque où le sujet pluriel renvoie naturellement aux foules et exprime leur recours à la défense armée, sans importer l’idée qu’elles auraient elles-mêmes repoussé Antiochos dans cette proposition.
- source_word: τροπωθέντα
  choice: mis en fuite
  rationale: Le participe a ici son sens militaire de déroute.
- source_word: τῶν ἐγχωρίων
  choice: par les habitants du pays
  rationale: Désigne les gens du lieu dans une formulation française digne et claire.
- source_word: αἰσχύμονα τὴν ἀναζυγὴν ποιήσασθαι
  choice: dut battre honteusement en retraite
  rationale: Expression française naturelle qui conserve à la fois le retrait militaire et son caractère déshonorant; « dut » rend idiomatiquement συνέβη avec l’infinitif, sans suggérer un ordre extérieur.
