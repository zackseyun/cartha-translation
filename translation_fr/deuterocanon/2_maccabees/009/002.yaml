translation_notes:
  register: Français international moderne, narratif et digne. « La ville appelée Persépolis » évite la nuance souvent péjorative de « la soi-disant Persépolis ». La syntaxe grecque du passage sur les armes est conservée dans son sens le plus direct, avec une note donnant la forme littérale.
