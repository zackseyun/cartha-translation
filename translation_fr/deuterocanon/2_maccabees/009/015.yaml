base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/015.yaml
  text: But the Jews[a], whom he had determined not even to count worthy of burial, but to cast out with their infants for the birds to devour and for the wild beasts—he would make them all equal to the Athenians.
translation:
  language: fr
  text: Quant aux Juifs, qu’il avait décidé de ne même pas juger dignes d’une sépulture, mais de les livrer, avec leurs jeunes enfants, aux oiseaux et aux bêtes sauvages, il les rendrait tous égaux aux Athéniens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus précisément : « il leur accorderait un statut égal à celui des Athéniens », probablement en matière de privilèges civiques ou de statut juridique, plutôt que de simple considération sociale.'
    reason: alternative_reading
lexical_decisions:
- source_word: διέγνωκε
  choice: avait décidé
  rationale: Dans le contexte, le parfait exprime une décision déjà arrêtée. « Avait décidé » est naturel en français et conserve cette antériorité.
- source_word: μηδὲ ταφῆς ἀξιῶσαι
  choice: ne même pas juger dignes d’une sépulture
  rationale: 'ἀξιόω garde ici sa nuance évaluative : il ne voulait pas les considérer comme dignes de recevoir une sépulture.'
- source_word: οἰωνοβρώτους
  choice: en pâture aux oiseaux
  rationale: L’adjectif désigne ceux qui sont livrés aux oiseaux pour être dévorés. La tournure idiomatique française rend clairement cette exposition des corps.
- source_word: σὺν τοῖς νηπίοις
  choice: avec leurs tout-petits
  rationale: νήπιοι désigne de très jeunes enfants. « Tout-petits » est actuel, naturel et ne fixe pas l’âge aussi étroitement que « nourrissons ».
- source_word: ἐκρίψαι
  choice: jeter dehors
  rationale: Le verbe exprime l’action brutale de jeter ou d’abandonner dehors, en contraste avec une sépulture.
- source_word: θηρίοις
  choice: aux bêtes sauvages
  rationale: Le datif indique ici que les victimes seraient livrées aux animaux sauvages; la formulation conserve la dureté de l’image.
- source_word: πάντας αὐτοὺς ἴσους Ἀθηναίοις ποιήσειν
  choice: il les rendrait tous égaux aux Athéniens
  rationale: Cette traduction directe préserve l’indétermination du grec quant à la nature exacte de cette égalité, probablement civique ou juridique.
theological_decisions:
- issue: Portée politique ou civique de « égaux aux Athéniens »
  choice: Conserver dans le texte la comparaison littérale sans préciser le mécanisme juridique.
  alternative: Il leur accorderait à tous les mêmes droits qu’aux Athéniens.
  rationale: Le grec parle de les rendre égaux aux Athéniens, sans employer explicitement le vocabulaire de la citoyenneté ou des droits. La précision historique probable appartient donc à une note.
translation_notes:
  register: Français international moderne, clair et digne. « Tout-petits » rend naturellement νήπιοι; « en pâture » restitue de façon concise et forte l’exposition aux oiseaux et aux bêtes sauvages. Le marqueur de note est placé après la proposition qu’il éclaire.
