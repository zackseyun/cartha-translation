    rationale: Le grec associe le rejet/exposition des Juifs et de leurs jeunes enfants à leur consommation par les oiseaux et les bêtes. « En pâture » est compréhensible, mais la construction française est moins précise quant à l’acte de les livrer aux animaux. Une reformulation peut rendre cette relation sans ajouter d’interprétation.
  - severity: low
    issue: Registre de « tout-petits »
    rationale: Le terme est moderne, mais légèrement familier dans ce contexte de violence historique solennelle. « Jeunes enfants » conserve l’indétermination relative de νηπίοις et un registre plus neutre.
