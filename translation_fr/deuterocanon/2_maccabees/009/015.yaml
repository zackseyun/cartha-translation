- from: Quant aux Juifs, qu’il avait décidé de ne même pas juger dignes d’une sépulture, mais de jeter dehors avec leurs tout-petits, en pâture aux oiseaux et aux bêtes sauvages, il les rendrait tous égaux aux Athéniens.[a]
