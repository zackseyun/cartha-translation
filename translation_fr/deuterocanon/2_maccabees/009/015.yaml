  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : décision préalable, refus de sépulture, exposition avec les très jeunes enfants, et promesse de les rendre égaux aux Athéniens. Toutefois, « en pâture aux oiseaux et aux bêtes sauvages » après « jeter dehors » atténue légèrement l’action explicite d’exposition/livraison contenue dans ἐκρίψαι et peut rendre moins nette la relation des victimes aux animaux.'
  naturalness: La phrase est globalement naturelle, mais « jeter dehors avec leurs tout-petits, en pâture… » est un enchaînement un peu heurté et « tout-petits » est plus familier que le registre sobre et grave du contexte. « Les livrer, avec leurs jeunes enfants, aux oiseaux et aux bêtes sauvages » est plus fluide et explicite.
  terminology: '« Sépulture », « oiseaux », « bêtes sauvages » et « égaux aux Athéniens » conviennent. La note conserve à juste titre l’ambiguïté du grec : elle propose une portée civique ou juridique sans l’imposer au texte.'
