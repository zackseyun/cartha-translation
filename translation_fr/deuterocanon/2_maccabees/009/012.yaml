base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/012.yaml
  text: 'As his pains intensified from moment to moment[a], and he was not even able to endure his own stench, he said this: “It is right to submit to God[c][b], and for one who is mortal not to think proudly.”'
translation:
  language: fr
  text: 'Ses douleurs s’intensifiaient d’instant en instant[a] et, ne pouvant même supporter sa propre puanteur, il déclara : « Il est juste[b] de se soumettre à Dieu et, quand on est mortel, de ne pas nourrir des pensées orgueilleuses[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « instant après instant » ou « continuellement ».
    reason: lexical_alternative
  - marker: b
    text: Ou « Il est droit » ou « Il convient ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « et, étant mortel, ne pas penser orgueilleusement » ; la formulation exprime un principe général concernant les êtres humains et leur condition mortelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ στιγμὴν
  choice: d’instant en instant
  rationale: Cette tournure naturelle conserve la progression répétée exprimée par le grec, sans imposer l’idée plus générale de continuité.
- source_word: ἐπιτεινόμενος ταῖς ἀλγηδόσιν
  choice: ses douleurs s’intensifiaient
  rationale: Le participe décrit une aggravation en cours; « douleurs » convient au contexte d’une souffrance physique.
- source_word: μηδὲ τῆς ὀσμῆς αὐτοῦ ἀνέχεσθαι δυνάμενος
  choice: ne pouvant même plus supporter sa propre puanteur
  rationale: Dans le contexte de la maladie, ὀσμή désigne une odeur répugnante; « puanteur » rend clairement cette valeur négative.
- source_word: ταῦτʼ ἔφη
  choice: il déclara
  rationale: Cette introduction concise et digne annonce naturellement la parole citée.
- source_word: Δίκαιον
  choice: Il est juste
  rationale: L’adjectif employé impersonnellement peut exprimer ce qui est juste, droit ou convenable; « juste » préserve ici sa portée morale.
- source_word: ὑποτάσσεσθαι τῷ θεῷ
  choice: de se soumettre à Dieu
  rationale: La formulation exprime le fait de se placer sous l’autorité de Dieu et correspond directement au sens du grec.
- source_word: μὴ θνητὸν ὄντα
  choice: quand on est mortel, de ne pas
  rationale: Le pronom indéfini « on » rend naturellement la portée générale de la proposition grecque sans la limiter au seul locuteur.
- source_word: ὑπερήφανα φρονεῖν
  choice: nourrir des pensées orgueilleuses
  rationale: Cette expression conserve la dimension cognitive de φρονεῖν et la notion d’orgueil contenue dans l’adverbe.
theological_decisions:
- issue: Portée générale de μὴ θνητὸν ὄντα
  choice: quand on est mortel, de ne pas nourrir des pensées orgueilleuses
  alternative: étant mortel, ne pas nourrir des pensées orgueilleuses
  rationale: Le grec formule une maxime concernant la condition mortelle en général. « On » en restitue clairement la portée sans réduire la phrase à Antiochos seul.
- issue: Nuance normative de Δίκαιον
  choice: Il est juste
  alternative: Il convient
  rationale: « Juste » maintient la possible portée morale du terme, tandis que « convient » en privilégierait seulement la notion de convenance. L’autre nuance est signalée en note.
