base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/014.yaml
  text: As for the holy city[a], which he had been hurrying to make level with the ground and to build into a mass grave, he will declare it free.
translation:
  language: fr
  text: Quant à la ville sainte, vers laquelle il se hâtait pour la raser jusqu’au sol et y construire un charnier[a], il la déclarera libre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une fosse commune » ou « un tombeau pour une multitude ». Le mot grec désigne un lieu de sépulture destiné à de nombreux morts.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁγίαν πόλιν
  choice: la ville sainte
  rationale: « Ville sainte » est l’expression française naturelle et bibliquement reconnue pour désigner ici Jérusalem.
- source_word: σπεύδων παρεγίνετο
  choice: vers laquelle il se hâtait
  rationale: Cette formulation conserve à la fois l’idée du déplacement exprimée par παρεγίνετο et celle de la hâte exprimée par σπεύδων.
- source_word: ἰσόπεδον ποιῆσαι
  choice: la raser jusqu’au sol
  rationale: L’expression rend clairement l’idée de réduire entièrement la ville au niveau du sol, dans un français actuel et vigoureux.
- source_word: πολυάνδριον
  choice: un charnier
  rationale: Le terme grec désigne un lieu où reposent de nombreux morts. « Charnier » en exprime avec concision la portée macabre dans ce contexte de destruction.
- source_word: οἰκοδομῆσαι
  choice: y bâtir
  rationale: « Bâtir » conserve le sens concret du verbe grec; « y » rattache naturellement la construction projetée à l’emplacement de la ville rasée.
- source_word: ἐλευθέραν ἀναδείξει
  choice: il la déclarera libre
  rationale: Le verbe peut exprimer une désignation ou une proclamation publique. Cette traduction préserve ce sens sans préciser indûment la forme politique de la liberté promise.
theological_decisions:
- issue: Nature de la promesse d’Antiochos concernant le statut de Jérusalem
  choice: il la déclarera libre
  alternative: il la rendra libre; il la proclamera autonome
  rationale: Le grec évoque un acte futur et public relatif au statut de la ville, sans imposer la notion constitutionnelle plus précise d’autonomie ni réduire nécessairement l’acte à sa seule réalisation pratique.
translation_notes:
  register: Français international moderne, digne et direct. La phrase conserve le contraste saisissant entre le projet antérieur de destruction et la promesse de libérer la ville. Le futur « déclarera » suit la forme grecque, tandis que « vers laquelle il se hâtait » maintient explicitement le mouvement parfois absorbé dans les traductions plus idiomatiques.
