base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/025.yaml
  text: Moreover[a], considering the rulers nearby and those bordering the kingdom, who are watching for opportunities and awaiting what will happen, I have appointed my son Antiochus as king, whom, when I repeatedly went up to the upper satrapies, I often entrusted and commended to most of you[b]. And I have written to him the things written below.
translation:
  language: fr
  text: En outre, considérant les souverains proches et voisins du royaume[a], attentifs aux occasions favorables et dans l’attente de ce qui arrivera, j’ai désigné mon fils Antiochos comme roi. Lorsque je me rendais à plusieurs reprises dans les satrapies supérieures[b], je le confiais et le recommandais à la plupart d’entre vous. Je lui ai écrit ce qui suit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec accumule deux qualifications géographiques qui se recoupent : les souverains sont présentés comme proches et comme voisins du royaume.'
    reason: lexical_alternative
  - marker: b
    text: Les « satrapies » étaient des circonscriptions administratives d’origine perse. Les « satrapies supérieures » peuvent désigner globalement les provinces intérieures ou orientales du royaume.
    reason: cultural_note
lexical_decisions:
- source_word: πρὸς δὲ τούτοις
  choice: En outre
  rationale: Cette formule ajoute un nouvel élément aux considérations précédentes; « En outre » est naturel et conserve la progression du discours.
- source_word: κατανοῶν
  choice: considérant
  rationale: Le participe exprime ici une évaluation réfléchie de la situation politique, et non une simple observation visuelle.
- source_word: τοὺς παρακειμένους δυνάστας
  choice: les souverains des environs
  rationale: δυνάστας désigne des dirigeants politiques plutôt que des puissances abstraites, tandis que παρακειμένους indique leur proximité géographique.
- source_word: γειτνιῶντας τῆς βασιλείας
  choice: ceux qui sont aux frontières du royaume
  rationale: Cette formulation rend la proximité immédiate avec le territoire royal sans identifier plus précisément ces acteurs que ne le fait le grec.
- source_word: τοῖς καιροῖς ἐπέχοντας
  choice: attentifs aux occasions favorables
  rationale: καιρός peut désigner le moment opportun; l’expression suggère que ces souverains guettent une occasion politique, tout en évitant de rendre explicite une hostilité seulement implicite.
- source_word: προσδοκῶντας τὸ ἀποβησόμενον
  choice: dans l’attente de ce qui arrivera
  rationale: La traduction préserve le caractère ouvert de l’issue attendue plutôt que de préciser un résultat particulier.
- source_word: ἀναδέδειχα
  choice: j’ai désigné
  rationale: Dans le contexte d’une succession royale, le verbe indique une désignation officielle; « désigné » convient mieux que le plus général « nommé ».
- source_word: τὸν υἱὸν Ἀντίοχον βασιλέα
  choice: comme roi mon fils Antiochos
  rationale: Cette construction française rend clairement le double accusatif grec de nomination à la royauté.
- source_word: ἀνατρέχων εἰς τὰς ἄνω σατραπίας
  choice: lorsque je montais vers les satrapies supérieures
  rationale: « Montais » conserve l’orientation de ἀνατρέχων, et « satrapies » maintient le terme administratif perse présent dans le grec.
- source_word: πολλάκις
  choice: Bien des fois
  rationale: L’expression restitue la répétition indiquée par l’adverbe tout en gardant un ton épistolaire naturel.
- source_word: παρεκατετίθεμην
  choice: je l’ai confié
  rationale: Le moyen grec évoque l’action de remettre quelqu’un aux soins ou à la bienveillance d’autrui; « confié » le distingue du verbe suivant.
- source_word: συνίστων
  choice: recommandé
  rationale: Le verbe signifie ici présenter favorablement ou recommander une personne auprès d’autres personnes.
- source_word: τὰ ὑπογεγραμμένα
  choice: ce qui suit
  rationale: Cette expression française naturelle conserve la référence documentaire au contenu placé après la lettre citée.
