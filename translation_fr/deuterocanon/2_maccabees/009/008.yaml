base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/008.yaml
  text: But the one who had thought[a], in his arrogance over men, to command even the waves of the sea, and imagined that he could weigh out the heights of the mountains on a scale, was brought down to the ground and carried in a litter[b], plainly showing to all the power of God.
translation:
  language: fr
  text: Mais celui qui, dans son orgueil qui l’élevait au-dessus des humains, s’imaginait commander même aux vagues de la mer et pensait pouvoir peser sur une balance les hauteurs des montagnes, se retrouva à terre et fut transporté sur une litière, manifestant ainsi clairement à tous la puissance de Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec fourni présente ici une répétition irrégulière : « la foi, la foi, la puissance ». Il s’agit vraisemblablement d’une corruption du texte ou d’une répétition de copiste ; la traduction suit le sens manifeste de la phrase : « la puissance de Dieu ».'
    reason: textual_variant
lexical_decisions:
- source_word: ἀντιδοκῶν
  choice: s’imaginait
  rationale: Le participe décrit la prétention antérieure d’Antiochos, mise en contraste avec son humiliation. « S’imaginait » rend naturellement cette assurance présomptueuse dans le contexte.
- source_word: τοῖς τῆς θαλάσσης κύμασιν
  choice: aux vagues de la mer
  rationale: La formulation française conserve l’image et le tour élevé de l’expression grecque.
- source_word: διὰ τὴν ὑπὲρ ἀνθρώπων ὑπερηφανίαν
  choice: dans son orgueil qui l’élevait au-dessus des humains
  rationale: Cette formulation explicite sans l’aplanir l’idée d’un orgueil par lequel Antiochos se place au-dessus des êtres humains. « Humains » a ici une valeur collective correspondant à ἀνθρώπων.
- source_word: πλάστιγγι
  choice: sur une balance
  rationale: Le mot désigne une balance ou son plateau. « Sur une balance » est clair en français moderne et préserve l’image de la pesée.
- source_word: τῶν ὀρέων … ὕψη στήσειν
  choice: pouvoir peser sur une balance la hauteur des montagnes
  rationale: Avec πλάστιγγι, στήσειν évoque ici la détermination d’une mesure ou d’un poids. La traduction conserve l’hyperbole tout en restant idiomatique.
- source_word: κατὰ γῆν γενόμενος
  choice: se retrouva à terre
  rationale: Cette expression rend le renversement physique et rhétorique entre les prétentions élevées du roi et son état d’abaissement, sans ajouter explicitement un agent absent du grec.
- source_word: ἐν φορίᾳ παρεκομίζετο
  choice: fut transporté sur une litière
  rationale: φορία désigne un moyen de transport porté, notamment pour une personne incapable de marcher. « Litière » convient au cadre historique et au registre narratif.
- source_word: φανερὰν … πᾶσιν … ἐνδεικνύμενος
  choice: manifestant ainsi clairement à tous
  rationale: Le participe exprime l’effet public de son état. « Ainsi » relie naturellement cette manifestation à l’humiliation qui précède.
- source_word: τοῦ θεοῦ … δύναμιν
  choice: la puissance de Dieu
  rationale: Ce choix conserve le génitif et le ton solennel du récit.
- source_word: τὴν πίστιν τὴν πίστιν τὴν δύναμιν
  choice: la puissance
  rationale: Le texte fourni présente une répétition irrégulière de « la foi » avant « la puissance ». Le fil de la phrase désigne clairement la puissance divine rendue visible; l’anomalie est signalée en note plutôt que transformée en affirmation théologique incertaine.
theological_decisions:
- issue: Sens collectif de ἀνθρώπων
  choice: les humains
  alternative: les hommes; l’humanité
  rationale: Le pluriel grec vise ici les êtres humains en général. « Les humains » conserve cette portée collective en français moderne sans limiter indûment le référent aux hommes de sexe masculin.
- issue: Répétition anormale de πίστιν dans le texte source
  choice: Traduire dans le corps du texte le sens contextuel « la puissance de Dieu » et signaler l’anomalie en note
  alternative: Inclure « la foi » ou « la fidélité » dans le corps du texte
  rationale: La séquence « la foi, la foi, la puissance » est syntaxiquement et contextuellement irrégulière, probablement en raison d’une corruption ou d’une répétition de copiste. Ne pas lui attribuer un sens théologique précis évite de résoudre artificiellement un texte instable.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase ample et le contraste entre l’orgueil démesuré et l’abaissement ont été conservés. « Litière » maintient la couleur historique sans employer le terme clinique « brancard ».
