base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/010.yaml
  text: And no one was able to carry the man who a little earlier had seemed to touch the stars of heaven[a], because of the unbearable burden of the stench.
translation:
  language: fr
  text: Et celui qui, peu auparavant, semblait toucher les étoiles du ciel[a], personne ne pouvait le transporter, à cause du poids insupportable de la puanteur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pensait pouvoir toucher les étoiles du ciel ». Le grec peut évoquer soit une grandeur apparente, soit l’idée présomptueuse qu’il se faisait de lui-même.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν ... δοκοῦντα
  choice: celui qui ... semblait
  rationale: Le participe substantivé renvoie à Antiochos. « Celui qui » reste naturel en français tout en conservant la construction et l’ambiguïté de δοκέω.
- source_word: μικρῷ πρότερον
  choice: peu auparavant
  rationale: Cette expression situe l’action dans un passé récent; « peu auparavant » convient au registre narratif soutenu.
- source_word: τῶν οὐρανίων ἄστρων
  choice: les étoiles du ciel
  rationale: Cette formulation naturelle conserve l’image cosmique et le ton élevé du grec.
- source_word: ἅπτεσθαι
  choice: toucher
  rationale: Le sens premier est « toucher » ou « saisir ». Ici, « toucher » préserve l’image hyperbolique de l’exaltation d’Antiochos.
- source_word: παρακομίζειν
  choice: transporter
  rationale: Le verbe désigne le fait de conduire ou de porter quelqu’un d’un lieu à un autre. « Transporter » exprime clairement cette nuance en français moderne.
- source_word: διὰ τὸ τῆς ὀσμῆς ἀφόρητον βάρος
  choice: tant la puanteur pesait d’un poids insupportable
  rationale: Cette tournure conserve l’image concrète du « poids » (βάρος) tout en exprimant naturellement la force accablante de l’odeur.
theological_decisions:
- issue: Description hyperbolique de l’ancienne arrogance d’Antiochos
  choice: semblait toucher les étoiles du ciel
  alternative: pensait pouvoir toucher les étoiles du ciel
  rationale: La construction δοκοῦντα avec l’infinitif peut évoquer soit une grandeur apparente, soit l’idée présomptueuse qu’Antiochos se faisait de lui-même. Le texte principal maintient cette tension sans la trancher.
translation_notes:
  register: Français international moderne, narratif et digne. L’ordre initial met en relief le contraste ironique entre l’exaltation passée d’Antiochos et son état présent. L’image inhabituelle du poids de la puanteur est conservée plutôt qu’aplanie.
