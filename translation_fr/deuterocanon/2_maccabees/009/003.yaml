  yaml_path: translation/deuterocanon/2_maccabees/009/003.yaml
  text: But while he was at Ecbatana[b][a], news came to him of what had happened to Nicanor and those with Timothy.
translation:
  language: fr
  text: Mais, alors qu’il se trouvait dans la région d’Ecbatane[a], il apprit ce qui s’était passé concernant Nicanor et Timothée avec ses compagnons[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « près d’Ecbatane » ou « à Ecbatane ». L’expression grecque peut désigner la ville elle-même ou sa région.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ceux qui sont autour de Timothée ». L’expression désigne habituellement Timothée avec ses compagnons.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄντι δὲ αὐτῷ
  choice: Mais, alors qu’il se trouvait
  rationale: Le génitif absolu exprime ici une circonstance temporelle. Cette formulation est naturelle en français tout en conservant la valeur circonstancielle du grec.
- source_word: κατʼ Ἐκβάτανα
  choice: dans la région d’Ecbatane
  rationale: Avec un nom de lieu, κατά à l’accusatif peut indiquer le lieu ou ses environs. Cette traduction préserve la latitude géographique de l’expression.
- source_word: προσεπέσε
  choice: il apprit
  rationale: Le verbe signifie littéralement que les événements « vinrent sur » lui; dans ce contexte, il indique idiomatiquement que leur nouvelle lui parvint. « Il apprit » donne ce sens sans lourdeur.
- source_word: τὰ κατὰ Νικάνορα ... γεγονότα
  choice: ce qui était arrivé à Nicanor
  rationale: L’expression désigne les événements concernant Nicanor. Le plus-que-parfait rend l’antériorité du participe parfait γεγονότα.
- source_word: τοὺς περὶ Τιμόθεον
  choice: ceux qui entouraient Timothée
  rationale: La tournure οἱ περὶ + nom propre désigne le cercle ou le groupe associé à une personne. La formulation retenue reste proche du grec sans préciser indûment la nature militaire du groupe.
