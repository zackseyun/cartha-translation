  text: so that worms even swarmed from the body of the ungodly man[a], and while he was still alive, in pains and agonies, his flesh fell away[b], and because of his stench the whole camp was burdened by the rottenness.
translation:
  language: fr
  text: au point que des vers pullulaient même hors du corps de cet homme impie[a] et que, tandis qu’il était encore vivant, dans les douleurs et les souffrances aiguës, ses chairs se détachaient[b] ; à cause de sa puanteur, tout le camp était accablé par cette pourriture.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des vers bouillonnaient hors du corps de cet homme impie ». Le verbe grec signifie plus littéralement « remonter en bouillonnant » ou « bouillonner ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ses chairs se détachaient », alors qu’il était encore vivant ; la forme grecque présente le phénomène comme un processus en cours.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δυσσεβοῦς
  choice: homme impie
  rationale: « Impie » conserve la dimension religieuse de δυσσεβής, qui dénote le mépris de Dieu ou de ce qui lui est dû, sans réduire le terme à la méchanceté générale.
- source_word: σκώληκας ἀναζεῖν
  choice: des vers pullulaient même hors du corps
  rationale: ἀναζέω évoque littéralement ce qui bouillonne ou monte en bouillonnant. Dans ce contexte corporel, « pullulaient hors du corps » rend naturellement la profusion et l’émergence des vers, tandis que la note conserve l’image grecque plus littérale.
- source_word: ζῶντος
  choice: tandis qu’il était encore vivant
  rationale: Cette formulation explicite la valeur temporelle et souligne que la décomposition se produisait avant sa mort.
- source_word: ἐν ὀδύναις καὶ ἀλγηδόσιν
  choice: dans les douleurs et les souffrances aiguës
  rationale: Le doublet grec exprime une souffrance physique intense. Cette formulation garde les deux termes sans créer en français une répétition maladroite.
- source_word: τὰς σάρκας αὐτοῦ διαπίπτειν
  choice: ses chairs se détachaient
  rationale: Le pluriel « ses chairs » reflète τὰς σάρκας, et l’imparfait « se détachaient » rend le processus en cours exprimé par l’infinitif présent.
- source_word: ὑπὸ δὲ τῆς ὀσμῆς αὐτοῦ
  choice: à cause de sa puanteur
  rationale: ὀσμή peut désigner une odeur de façon neutre, mais le contexte de putréfaction exige ici le sens négatif clairement exprimé par « puanteur ».
- source_word: πᾶν τὸ στρατόπεδον
  choice: tout le camp
  rationale: Traduction concise et naturelle du camp militaire désigné par στρατόπεδον.
- source_word: βαρύνεσθαι τὴν σαπρίαν
  choice: était accablé par cette pourriture
  rationale: « Était accablé » maintient la métaphore de pesanteur de βαρύνω. « Cette pourriture » rend σαπρία et rattache naturellement la corruption à la puanteur précédente, tout en reconnaissant que la construction grecque est difficile.
theological_decisions:
- issue: Caractérisation morale et religieuse d’Antiochos par δυσσεβοῦς
  choice: homme impie
  alternative: homme sans respect pour Dieu ; homme mauvais
  rationale: « Impie » préserve l’orientation envers Dieu du terme grec sans ajouter d’explication doctrinale ni le réduire à une condamnation morale générale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe conserve l’enchaînement dramatique du grec et son caractère volontairement graphique. Les imparfaits rendent les infinitifs présents grecs comme des processus simultanés. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
