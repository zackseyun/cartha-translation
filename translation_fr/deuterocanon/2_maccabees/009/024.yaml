  text: so that[a], if anything unexpected should happen and some difficulty should arise, those in the country, knowing to whom the affairs have been entrusted, may not be thrown into confusion;
translation:
  language: fr
  text: afin que, si quelque chose d’imprévu se produit et qu’une difficulté survient, les habitants du pays, sachant à qui les affaires ont été confiées[a], ne soient pas plongés dans la confusion ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à qui les affaires ont été laissées ». Le parfait passif grec peut souligner soit le fait de laisser les affaires à quelqu’un, soit le fait de lui en confier la responsabilité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: afin que
  rationale: Introduit le but recherché. « Afin que » conserve clairement cette valeur finale dans un registre naturel et digne.
- source_word: ἐάν τι παράδοξον ἀποβῇ
  choice: si quelque chose d’imprévu se produit
  rationale: παράδοξον désigne ici un fait inattendu ou extraordinaire, tandis que ἀποβῇ exprime sa survenue. La formulation française reste ouverte sur la nature exacte de l’événement.
- source_word: προσπέλθῃ τι δυσχερές
  choice: qu’une difficulté survient
  rationale: δυσχερές évoque une situation difficile, pénible ou fâcheuse. « Une difficulté survient » restitue idiomatiquement l’idée sans en préciser indûment la nature.
- source_word: εἰδότες
  choice: sachant
  rationale: Le participe circonstanciel est conservé par un participe français, qui maintient le lien syntaxique compact avec « les habitants du pays ».
- source_word: οἱ κατὰ τὴν χώραν
  choice: les habitants du pays
  rationale: L’expression désigne collectivement les personnes présentes dans le territoire. « Les habitants du pays » est plus naturel en français que le calque « ceux dans le pays ».
- source_word: ᾧ καταλέλειπται τὰ πράγματα
  choice: à qui les affaires ont été confiées
  rationale: Le parfait passif indique que les affaires ont été laissées à la charge de quelqu’un, avec un résultat qui demeure. « Confiées » rend naturellement l’idée de responsabilité, tandis qu’une note préserve le sens plus littéral de « laissées ».
- source_word: μὴ ἐπιταράσσωνται
  choice: ne soient pas plongés dans la confusion
  rationale: ἐπιταράσσω exprime un trouble accentué. Dans ce contexte politique, « plongés dans la confusion » peut évoquer à la fois le désarroi et le désordre sans réduire le terme à une simple émotion.
