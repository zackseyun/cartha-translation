  text: And besides these things[a], he would also become a Jew and would visit every inhabited place[b], proclaiming the power of God.
translation:
  language: fr
  text: En outre, il deviendrait aussi juif[a] et visiterait tous les lieux habités, proclamant la puissance de Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il serait aussi juif ». Dans ce contexte, cela signifie probablement qu’il adopterait l’identité ou l’allégeance juive, plutôt qu’il ne ferait une déclaration sur son origine ethnique.'
    reason: lexical_alternative
  - marker: b
    text: « La puissance de Dieu » peut aussi se traduire par « la force de Dieu », « la puissance souveraine de Dieu » ou « la domination de Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τούτοις
  choice: En plus de cela
  rationale: Cette tournure naturelle conserve la valeur additive du grec et rattache la promesse à celles qui précèdent.
- source_word: καὶ Ἰουδαῖος ἔσεσθαι
  choice: il deviendrait même juif
  rationale: Littéralement, le grec dit qu’il « serait aussi juif ». Dans ce contexte, la formule exprime vraisemblablement l’adoption d’une identité ou d’une allégeance juive, sans imposer une notion technique ultérieure de conversion.
- source_word: πάντα τόπον οἰκητὴν
  choice: tout lieu habité
  rationale: La traduction garde la portée distributive de πάντα et le sens probable de οἰκητήν, forme inhabituelle qui qualifie ici un lieu où vivent des habitants.
- source_word: ἐπελεύσεσθαι
  choice: se rendrait dans
  rationale: Le verbe exprime ici un déplacement vers les différents lieux; « se rendre dans » reste naturel en français sans préciser indûment la manière de voyager.
- source_word: καταγγέλλοντα
  choice: proclamant
  rationale: Le participe évoque une annonce publique et solennelle, bien rendue par « proclamant ».
- source_word: τὸ τοῦ θεοῦ κράτος
  choice: la puissance de Dieu
  rationale: κράτος peut désigner la force, la puissance ou la domination. « Puissance » convient au contexte où le roi reconnaît la supériorité divine tout en laissant les autres nuances en note.
theological_decisions:
- issue: Sens de la promesse d’Antiochos d’être Ἰουδαῖος
  choice: Il promet de devenir juif, c’est-à-dire d’adopter l’identité ou l’allégeance juive.
  alternative: Il promet seulement de favoriser les Juifs ou de vivre à leur manière sans changement d’identité.
  rationale: La formulation grecque est plus forte qu’une simple manifestation de bienveillance. Elle présente une promesse extrême d’alignement sur le peuple et le Dieu qu’il avait combattus, sans définir les modalités religieuses ou juridiques de cet engagement.
- issue: Nuance de κράτος appliqué à Dieu
  choice: la puissance de Dieu
  alternative: la force de Dieu ou la domination de Dieu
  rationale: Le contexte met en avant la puissance souveraine de Dieu, mais le terme grec ne permet pas de trancher absolument entre force exercée et domination; la note préserve cette amplitude.
translation_notes:
  register: Français international moderne, digne et accessible. « Même » rend ici la force additive de καί dans cette promesse frappante. La syntaxe participiale « proclamant » conserve le lien étroit entre le déplacement annoncé et la proclamation publique.
