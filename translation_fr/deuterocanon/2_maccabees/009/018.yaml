base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/018.yaml
  text: 'But when his pains had somewhat let up[a], for the just judgment of God had come upon him, and when he recognized his own condition, he wrote to the Jews the letter written below, having the character of a petition[c][b], and reading as follows:'
translation:
  language: fr
  text: 'Mais comme ses douleurs s’atténuaient quelque peu[a] — car le juste jugement de Dieu était venu sur lui — il prit conscience de son état[b] et écrivit aux Juifs la lettre reproduite ci-dessous, qui avait la forme d’une supplication[c] et disait ceci :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le rare adverbe grec traduit par « quelque peu » est difficile à interpréter ; le sens paraît être que les douleurs diminuaient dans une certaine mesure, non qu’elles avaient pris fin.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ayant reconnu ce qui le concernait ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « qui avait le caractère d’une requête ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰουδαϊσμῶς
  choice: quelque peu
  rationale: 'Cet adverbe rare et difficile paraît ici nuancer ληγόντων : les douleurs diminuent dans une certaine mesure, sans nécessairement cesser. « Quelque peu » préserve cette réserve.'
- source_word: ληγόντων τῶν πόνων
  choice: comme ses douleurs s’atténuaient
  rationale: Le participe indique que les douleurs diminuaient. « S’atténuaient » est naturel en français et n’implique pas leur disparition complète.
- source_word: δικαία ἡ τοῦ θεοῦ κρίσις
  choice: le juste jugement de Dieu
  rationale: La formulation conserve explicitement le caractère juste de la κρίσις divine et son application à Antiochos.
- source_word: τὰ κατʼ αὐτὸν ἐπιγνούς
  choice: il prit conscience de son état
  rationale: Cette expression condensée signifie littéralement qu’il reconnut « ce qui le concernait » ; dans le contexte, elle désigne la prise de conscience de sa propre situation.
- source_word: τὴν ὑπογεγραμμένην ἐπιστολήν
  choice: la lettre reproduite ci-dessous
  rationale: Le participe annonce le texte de la lettre qui suit. « Reproduite ci-dessous » convient naturellement à cette introduction épistolaire.
- source_word: ἔχουσαν ἱκετηρίας τάξιν
  choice: qui avait la forme d’une supplication
  rationale: La traduction garde l’idée d’une lettre organisée ou présentée comme une demande suppliante, sans réduire nécessairement l’expression à un simple ton.
- source_word: περιέχουσαν δὲ οὕτως
  choice: et disait ceci
  rationale: Formule française courante pour introduire immédiatement le contenu cité d’une lettre.
theological_decisions:
- issue: Interprétation des souffrances d’Antiochos comme jugement divin
  choice: Affirmer explicitement que le juste jugement de Dieu était venu sur lui.
  alternative: Employer une formulation plus neutre qui présenterait seulement sa souffrance comme une circonstance.
  rationale: Le grec attribue expressément ce qui lui arrive à la juste κρίσις de Dieu ; la traduction ne doit pas atténuer cette affirmation théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la parenthèse causale du grec, tout en évitant une syntaxe excessivement lourde. « Supplication » maintient le registre solennel du contexte.
