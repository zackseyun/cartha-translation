    issue: « sans gloire » surinterprète ἀκόσμως
    rationale: Cette expression focalise le sens sur la honte et ajoute la notion de gloire; le grec maintient une ambiguïté entre désordre, inconvenance et ignominie.
  - severity: low
    issue: « se trouvait revenir » est peu idiomatique
    rationale: La construction est grammaticalement possible mais maladroite en français moderne; le verbe simple « revenait » convient au récit et évite une lourdeur non nécessaire.
