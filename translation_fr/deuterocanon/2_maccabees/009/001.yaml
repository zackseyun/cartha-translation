lexical_decisions:
- source_word: Περὶ δὲ τὸν καιρὸν ἐκεῖνον
  choice: Vers cette époque
  rationale: περὶ avec l’accusatif temporel exprime une approximation. « Vers cette époque » est naturel en français et conserve ce caractère approximatif; la légère transition portée par δέ n’exige pas ici de connecteur explicite.
- source_word: ἐτύγχανεν
  choice: se trouvait
  rationale: La tournure avec τυγχάνω présente la situation comme circonstancielle. « Se trouvait » en garde la nuance sans la lourdeur de « il se trouvait que ».
- source_word: Ἀντίοχος
  choice: Antiochos
  rationale: Translittération française usuelle du nom grec.
- source_word: ἀναλελυκὼς
  choice: revenir
  rationale: Dans ce contexte narratif, le participe parfait désigne le retour d’Antiochos depuis la région perse. L’infinitif après « se trouvait » produit une phrase française naturelle.
- source_word: ἀκόσμως
  choice: sans gloire
  rationale: L’adverbe évoque une manière désordonnée, inconvenante ou ignominieuse. « Sans gloire » rend bien l’humiliation du retour tout en évitant de préciser indûment s’il s’agit surtout de désordre matériel ou de honte.
- source_word: ἐκ τῶν περὶ τὴν Περσίδα τόπων
  choice: des régions situées autour de la Perse
  rationale: La formulation conserve l’imprécision géographique de τόπων et la valeur spatiale de περὶ, sans réduire l’expression au seul territoire perse.
