review_pass:
  verdict: revise
  source_fidelity: La tournure « sans gloire » interprète ἀκόσμως dans le seul sens de l’ignominie et introduit l’idée de gloire, qui n’est pas exprimée par le grec. Le terme peut aussi qualifier un retour désordonné. « Dans le désordre » conserve mieux cette portée sans trancher. « Revenait » rend naturellement le participe de retour dans cette construction circonstancielle; la nuance incidente de ἐτύγχανεν n’appelle pas en français la tournure peu idiomatique « se trouvait revenir ».
  naturalness: « Antiochos se trouvait revenir » est lourd et peu naturel en français moderne. « Antiochos revenait » est fluide et narratif. « Vers ce temps-là » restitue l’approximation temporelle de περὶ τὸν καιρόν tout en étant plus idiomatique que « Vers cette époque ».
  terminology: « Antiochos » est la forme française usuelle. « Perse » et « régions autour de la Perse » respectent l’imprécision géographique de l’expression grecque. La note doit présenter l’ignominie et l’inconvenance comme des possibilités lexicales, sans imposer l’une d’elles au texte.
  issues:
