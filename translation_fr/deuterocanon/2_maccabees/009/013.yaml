  yaml_path: translation/deuterocanon/2_maccabees/009/013.yaml
  text: 'But the polluted man kept praying to the Master who would no longer have mercy on him[b][a], saying this:'
translation:
  language: fr
  text: 'Mais l’homme souillé continuait de prier le Maître[a], qui ne lui ferait plus miséricorde, en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie ici « Maître » (despotēs), et non le terme plus courant traduit par « Seigneur » (kyrios).
    reason: lexical_alternative
lexical_decisions:
- source_word: ηὔχετο
  choice: continuait de prier
  rationale: L’imparfait exprime une action en cours; cette tournure restitue naturellement l’aspect duratif.
- source_word: ὁ μιερὸς
  choice: cet homme souillé
  rationale: L’adjectif substantivé désigne l’homme comme moralement ou rituellement impur. « Souillé » conserve cette forte connotation, tandis que « homme » est explicité naturellement en français.
- source_word: δεσπότην
  choice: le Maître
  rationale: δεσπότης souligne l’autorité absolue et se distingue de κύριος, habituellement rendu par « Seigneur ».
- source_word: οὐκέτι
  choice: plus
  rationale: Avec la négation verbale française, « ne… plus » rend la négation temporelle « désormais non ».
- source_word: ἐλεήσοντα
  choice: qui n’allait plus avoir pitié de lui
  rationale: Le participe futur qualifie le Maître et indique une action future par rapport à la prière; « allait… avoir pitié » en conserve la perspective.
- source_word: οὕτως λέγων
  choice: 'en disant :'
  rationale: Cette formulation introduit naturellement en français les paroles directes qui suivent.
theological_decisions:
- issue: Traduction de δεσπότης appliqué à Dieu
  choice: Maître
  alternative: Seigneur; Souverain
  rationale: « Maître » maintient la distinction lexicale avec κύριος et la nuance d’autorité absolue, sans ajouter les associations traditionnelles de « Seigneur ».
- issue: Portée de οὐκέτι ἐλεήσοντα
  choice: qui n’allait plus avoir pitié de lui
  alternative: qui ne devait plus lui faire miséricorde
  rationale: Le texte présente explicitement la compassion divine comme ne devant plus être accordée à cet homme. La traduction conserve cette tension sans l’atténuer ni expliquer sa cause.
translation_notes:
  register: Français moderne, international et digne. « Cet homme souillé » garde la vigueur morale et cultuelle de μιερός sans recourir à un terme archaïque. La syntaxe reste fluide et prépare la citation du verset suivant.
