base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/005.yaml
  text: But the all-seeing Lord, the God of Israel, struck him with an incurable and unseen blow; and just as he finished speaking, an unrelenting pain in his bowels seized him, with bitter torments in his inner parts,
translation:
  language: fr
  text: Mais le Seigneur qui voit tout, le Dieu d’Israël, le frappa d’un coup incurable et invisible[a]. À peine eut-il fini de parler qu’une douleur sans remède aux entrailles le saisit, ainsi que d’amers tourments intérieurs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une plaie incurable et invisible ». Le grec πληγή peut désigner un coup, une blessure ou une plaie.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « une douleur sans remède des entrailles et d’amers tourments des parties intérieures ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παντεπόπτης
  choice: qui voit tout
  rationale: Cette formulation naturelle rend directement l’idée de celui qui voit toute chose, sans recourir au terme plus rare « omnivoyant ».
- source_word: κύριος
  choice: Seigneur
  rationale: Le mot fonctionne ici comme un titre divin, en apposition à « le Dieu d’Israël ».
- source_word: ἐπάταξεν
  choice: frappa
  rationale: Le verbe exprime directement l’action de frapper et maintient l’attribution explicite du jugement à Dieu.
- source_word: ἀνιάτῳ καὶ ἀοράτῳ πληγῇ
  choice: d’un coup incurable et invisible
  rationale: « Coup » conserve l’image de la frappe divine; les deux adjectifs rendent le caractère impossible à guérir et non perceptible de l’atteinte.
- source_word: ἄρτι ... καταλήξαντος τὸν λόγον
  choice: À peine eut-il fini de parler
  rationale: Cette tournure française exprime clairement l’enchaînement immédiat entre la fin de ses paroles et le début de son supplice.
- source_word: ἔλαβεν αὐτὸν
  choice: le saisit
  rationale: Dans ce contexte, le verbe décrit une douleur qui s’empare soudainement de lui.
- source_word: ἀνήκεστος
  choice: sans remède
  rationale: L’expression garde le sens propre d’une douleur à laquelle on ne peut remédier, tout en évitant une répétition française pesante de « incurable ».
- source_word: τῶν σπλάγχνων ἀλγηδών
  choice: une douleur ... aux entrailles
  rationale: « Entrailles » conserve l’ancrage corporel et viscéral du grec dans un registre digne et intelligible.
- source_word: πικραὶ τῶν ἔνδον βάσανοι
  choice: d’amers tourments au plus profond de lui-même
  rationale: « Amers tourments » suit l’expression grecque, tandis que « au plus profond de lui-même » rend naturellement la localisation intérieure sans la réduire à une souffrance purement psychologique.
theological_decisions:
- issue: Rôle direct de Dieu dans l’affliction d’Antiochus
  choice: Dieu est présenté comme celui qui le frappe directement.
  alternative: Dire que Dieu a permis qu’il soit frappé ou atteint.
  rationale: Le grec fait explicitement du Seigneur, Dieu d’Israël, le sujet du verbe « frapper »; la traduction ne doit pas atténuer cette attribution du jugement divin.
translation_notes:
  register: Français international actuel, digne et accessible. La tournure « qui voit tout » évite un adjectif artificiel; « entrailles » préserve la vigueur concrète du texte. Les deux occurrences grecques exprimant l’impossibilité de guérir sont distinguées par « incurable » et « sans remède » afin de rester précises sans lourdeur.
