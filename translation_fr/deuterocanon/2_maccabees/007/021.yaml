base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/021.yaml
  text: And she encouraged each one of them in the language of their fathers[a], filled with a noble spirit, and, stirring her womanly reasoning with manly courage, she said to them[b],
translation:
  language: fr
  text: 'Elle encourageait chacun d’eux dans la langue de leurs ancêtres[a], pleine d’une noble détermination ; et, ayant éveillé son raisonnement féminin par une ardeur virile, elle leur disait[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la langue de leurs pères » ou « dans leur langue ancestrale ». Le grec désigne littéralement la langue héritée des pères ou des ancêtres.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec établit un contraste volontaire entre les sexes : littéralement, « ayant éveillé le raisonnement féminin par une ardeur masculine ».'
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστον
  choice: chacun d’eux
  rationale: L’accusatif singulier a une valeur distributive et indique qu’elle s’adressait à chacun individuellement.
- source_word: παρεκάλει
  choice: encourageait
  rationale: Dans ce contexte de martyre, le verbe exprime un encouragement pressant à demeurer ferme, plutôt qu’une simple consolation.
- source_word: τῇ πατρίῳ φωνῇ
  choice: dans la langue de leurs ancêtres
  rationale: πατρίῳ désigne ce qui vient des pères ou des ancêtres, et φωνῇ la langue parlée; cette formulation conserve la dimension ancestrale.
- source_word: γενναίῳ πεπληρωμένη φρονήματι
  choice: remplie d’une noble détermination
  rationale: φρόνημα peut désigner l’état d’esprit, la disposition ou la résolution; « noble détermination » exprime ici naturellement sa fermeté morale.
- source_word: τὸν θῆλυν λογισμόν
  choice: ses pensées de femme
  rationale: La formulation conserve le caractère explicitement féminin de θῆλυν et rend λογισμόν de façon naturelle sans effacer le contraste rhétorique antique.
- source_word: ἄρσενι θυμῷ
  choice: d’un courage d’homme
  rationale: θυμός désigne ici l’ardeur ou le courage plutôt que la colère; « courage d’homme » préserve le contraste explicite avec « pensées de femme ».
- source_word: διεγείρασα
  choice: animait
  rationale: Le participe décrit le fait d’éveiller ou de mettre en mouvement ses pensées; « animait » convient au registre narratif français.
- source_word: λέγουσα πρὸς αὐτούς
  choice: leur disait
  rationale: Le participe introducteur du discours direct est rendu naturellement par un verbe conjugué à l’imparfait, en continuité avec παρεκάλει.
theological_decisions:
- issue: Contraste genré dans la caractérisation de la mère
  choice: Conserver dans le texte le contraste entre « pensées de femme » et « courage d’homme ».
  alternative: Neutraliser en « faiblesse naturelle » et « ferme courage », ou atténuer en « sentiments maternels » et « forte détermination ».
  rationale: Le grec oppose délibérément θῆλυς et ἄρσην. Même si cette rhétorique reflète les représentations culturelles de l’Antiquité, la traduction ne doit pas effacer ce contraste explicite.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait maintient la continuité narrative. La ponctuation prépare le discours direct du verset suivant. Le contraste culturellement marqué du grec est conservé dans le texte et explicité en note.
