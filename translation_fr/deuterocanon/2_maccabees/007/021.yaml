    issue: λoγισμόν est rendu par « ses pensées »
    rationale: Le grec emploie un singulier et désigne le raisonnement, la réflexion ou la disposition rationnelle plutôt qu’une pluralité de pensées. Une formulation au singulier est préférable.
  - severity: low
    issue: « animait » au lieu d’un participe d’action accomplie
    rationale: 'διεγείρασα est un participe aoriste: l’auteur présente l’éveil de son raisonnement comme précédant le discours. « Ayant éveillé » préserve plus exactement cette relation.'
