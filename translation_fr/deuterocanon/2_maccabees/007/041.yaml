  text: La mère mourut la dernière[a], après ses fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Enfin, après les fils, la mère mourut. » La tournure grecque peut être comprise comme une brève indication de succession.'
