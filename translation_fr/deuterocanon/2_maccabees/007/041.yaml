lexical_decisions:
- source_word: ἐσχάτῃ
  choice: la dernière
  rationale: Le datif féminin singulier marque ici l’ordre dans lequel survient la mort. « La dernière » conserve la concision et le genre féminin du grec tout en donnant une phrase naturelle en français.
- source_word: τῶν υἱῶν
  choice: après ses fils
  rationale: υἱῶν désigne précisément les « fils ». Dans cette construction de succession, le génitif indique que la mère meurt après eux ; le possessif « ses » explicite en français le lien déjà établi par le contexte.
- source_word: ἡ μήτηρ
  choice: la mère
  rationale: Traduction directe de l’expression grecque avec article, qui désigne la mère déjà connue dans le récit.
- source_word: ἐτελεύτησεν
  choice: mourut
  rationale: Le verbe signifie ici « mourir ». Le passé simple convient à la narration et maintient la sobriété solennelle de l’énoncé grec.
