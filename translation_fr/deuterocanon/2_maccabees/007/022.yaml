base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/022.yaml
  text: I do not know how you appeared in my womb[a], nor was it I who granted you spirit and life, and it was not I who arranged the formation of each of you.
translation:
  language: fr
  text: Je ne sais pas comment vous êtes apparus dans mon sein ; ce n’est pas moi qui vous ai accordé l’esprit et la vie[a], ni moi qui ai ordonné la formation de chacun de vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le souffle et la vie ». Le mot grec peut désigner l’esprit, le souffle ou le vent ; ici, il évoque le principe qui anime la vie.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ οἶδʼ ὅπως
  choice: Je ne sais pas comment
  rationale: Cette formulation française simple et naturelle rend l’aveu d’ignorance de la mère quant au processus par lequel ses fils ont pris forme.
- source_word: εἰς τὴν ἐμὴν ἐφάνητε κοιλίαν
  choice: vous êtes apparus dans mon sein
  rationale: « Êtes apparus » conserve l’image du grec ἐφάνητε et le caractère mystérieux de leur origine, tandis que « dans mon sein » convient au registre biblique français sans être obscur.
- source_word: οὐδὲ ἐγὼ
  choice: ce n’est pas moi qui
  rationale: La tournure française marque clairement l’insistance du pronom grec et le déni d’une causalité maternelle ultime.
- source_word: τὸ πνεῦμα καὶ τὴν ζωὴν ὑμῖν ἐχαρισάμην
  choice: vous ai accordé l’esprit et la vie
  rationale: « Accordé » rend la notion de don portée par ἐχαρισάμην. « Esprit » préserve l’étendue sémantique de πνεῦμα et sa distinction d’avec « la vie ».
- source_word: τὴν ἑκάστου στοιχείωσιν
  choice: la formation de chacun de vous
  rationale: « Formation » exprime clairement la constitution ou l’organisation des éléments du corps ; « chacun de vous » restitue la valeur distributive de ἑκάστου.
- source_word: οὐκ ἐγὼ διερρύθμισα
  choice: ni moi qui ai ordonné
  rationale: « Ordonné » exprime ici l’action de disposer et d’organiser, sans suggérer un commandement verbal ; la construction conserve l’insistance sur « moi ».
theological_decisions:
- issue: Sens de πνεῦμα dans le discours de la mère sur l’origine humaine
  choice: l’esprit
  alternative: le souffle
  rationale: La coordination de πνεῦμα avec ζωή présente deux réalités liées sans les confondre. « Esprit » conserve la largeur théologique et anthropologique du grec, tandis qu’une note signale le sens possible de « souffle ».
- issue: Portée du déni de causalité par la mère
  choice: La mère nie être l’auteur ultime de l’esprit, de la vie et de la formation de ses fils.
  alternative: Elle nierait toute participation causale à leur venue au monde.
  rationale: La traduction maintient l’insistance du grec sans transformer le propos en négation de son rôle maternel ordinaire.
translation_notes:
  register: Français international moderne, digne et accessible. « Dans mon sein » maintient une tonalité biblique familière ; « ordonné la formation » conserve l’idée d’une organisation structurée sans vocabulaire trop technique.
