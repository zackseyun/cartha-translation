base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/023.yaml
  text: Therefore the Creator of the world, who formed the origin of man and devised the origin of all things, will in mercy give back to you both breath and life, since you now disregard yourselves for the sake of his laws.
translation:
  language: fr
  text: Ainsi donc, le Créateur du monde, qui a formé l’être humain dès son origine et conçu l’origine de toutes choses, vous rendra de nouveau, dans sa miséricorde, le souffle et la vie, puisque maintenant vous faites peu de cas de vous-mêmes à cause de ses lois.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τοῦ κόσμου κτίστης
  choice: le Créateur du monde
  rationale: Rend directement le titre grec et conserve sa portée cosmique.
- source_word: ἀνθρώπου γένεσιν
  choice: l’origine de l’être humain
  rationale: γένεσις désigne ici l’origine ou la venue à l’existence; «être humain» rend ἄνθρωπος de façon naturelle et générique.
- source_word: πάντων ἐξευρὼν γένεσιν
  choice: conçu l’origine de toutes choses
  rationale: ἐξευρίσκω exprime le fait de trouver, déterminer ou concevoir; «conçu» convient au contexte créateur sans surinterpréter le mécanisme.
- source_word: τὸ πνεῦμα καὶ τὴν ζωὴν
  choice: le souffle et la vie
  rationale: Dans ce contexte de restitution de la vie corporelle, πνεῦμα peut naturellement désigner le souffle; le choix préserve la distinction avec ζωή sans imposer une lecture anthropologique précise.
- source_word: ὑπερορᾶτε ἑαυτοὺς
  choice: vous renoncez à vous-mêmes
  rationale: L’expression signifie qu’ils font peu de cas de leur propre personne ou vie. «Renoncer à vous-mêmes» exprime naturellement ce mépris volontaire de leur sécurité, sans suggérer une simple distraction.
- source_word: μετʼ ἐλέους
  choice: dans sa miséricorde
  rationale: Restitue la manière bienveillante dont le Créateur rendra le souffle et la vie.
theological_decisions:
- issue: Sens de πνεῦμα dans la promesse de restitution
  choice: le souffle
  alternative: l’esprit
  rationale: Le parallélisme avec «la vie» et le contexte du retour à la vie favorisent «souffle», tout en laissant ouverte la portée exacte de cette restitution.
- issue: Portée de la promesse de rendre souffle et vie
  choice: formulation future directe, sans explicitation
  alternative: ajouter explicitement «à la résurrection»
  rationale: Le verset promet la restitution, mais ne nomme pas ici explicitement la résurrection; l’ajout résoudrait une implication contextuelle dans le corps du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe solennelle du grec est conservée, avec une formulation fluide. Aucun marqueur de note n’est requis puisque le projet ne comporte ici aucune note.
