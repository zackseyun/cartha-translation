  text: and in me and my brothers bring to an end the wrath of the Almighty that has justly been kindled against our whole nation[a].
translation:
  language: fr
  text: et que, en moi et en mes frères, prenne fin la colère du Tout-Puissant, justement enflammée contre notre peuple tout entier[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « s’arrête avec moi et mes frères ». Le grec dit littéralement « en moi et en mes frères » : la colère atteindrait en eux son point d’arrêt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στῆσαι
  choice: prenne fin
  rationale: L’infinitif aoriste causatif de ἵστημι exprime ici l’arrêt de la colère. « Prenne fin » est naturel en français et indique que celle-ci atteint son terme chez le locuteur et ses frères.
- source_word: παντοκράτορος
  choice: du Tout-Puissant
  rationale: Titre divin consacré et immédiatement compréhensible, qui rend la souveraineté et la puissance universelles exprimées par παντοκράτωρ.
- source_word: ὀργήν
  choice: la colère
  rationale: « Colère » convient au registre biblique français et conserve ici la gravité judiciaire de ὀργή sans imposer une nuance supplémentaire.
- source_word: σύμπαν ἡμῶν γένος
  choice: notre peuple tout entier
  rationale: Dans ce contexte collectif, γένος désigne le peuple juif. « Notre peuple tout entier » rend clairement la totalité marquée par σύμπαν et évite les connotations modernes problématiques de « race ».
- source_word: δικαίως
  choice: justement
  rationale: L’adverbe indique que cette colère est tenue pour moralement juste ou méritée; « justement » préserve cette affirmation sans l’amplifier.
- source_word: ἐπημμένην
  choice: enflammée
  rationale: Le participe parfait décrit une colère allumée et toujours active. « Enflammée » conserve l’image du feu et s’accorde naturellement avec « colère ».
- source_word: ἐν ἐμοὶ δὲ καὶ τοῖς ἀδελφοῖς μου
  choice: en moi et mes frères
  rationale: La formulation maintient l’image grecque inhabituelle selon laquelle la colère atteint en eux son point d’arrêt. Une note signale la tournure française plus idiomatique possible.
theological_decisions:
- issue: La souffrance des martyrs comme point où cesse le jugement divin
  choice: La colère juste du Tout-Puissant prend fin « en » celui qui parle et en ses frères.
  alternative: « s’arrête avec moi et mes frères », ou encore repose sur eux
  rationale: Le causatif στῆσαι avec ὀργήν suggère le plus naturellement que la colère est arrêtée, tandis que ἐν situe en eux son point terminal. La traduction préserve cette tension sans transformer le verset en formulation technique d’une doctrine de l’expiation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le lien avec la phrase précédente indiqué par δέ. La formulation légèrement marquée « en moi et mes frères » est conservée pour refléter l’image grecque, avec une variante idiomatique en note.
