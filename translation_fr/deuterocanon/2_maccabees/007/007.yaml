base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/007.yaml
  text: When the first had died in this way[a], they brought the second to the mockery; and after tearing off the skin of his head with the hair, they asked[b], “Will you eat before your body is punished limb by limb?”
translation:
  language: fr
  text: 'Lorsque le premier eut ainsi péri, ils amenèrent le deuxième pour en faire un objet de dérision. Après lui avoir arraché le cuir chevelu avec les cheveux[a], ils lui demandèrent : « Mangeras-tu[b] avant que ton corps ne soit puni, membre par membre ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la peau de la tête » ; « le cuir chevelu » en est l’équivalent naturel en français.'
    reason: lexical_alternative
  - marker: b
    text: Le contexte indique qu’il s’agit de manger une nourriture interdite par la loi ancestrale.
    reason: cross_reference
lexical_decisions:
- source_word: Μεταλλάξαντος
  choice: fut mort
  rationale: Dans ce contexte narratif, le verbe évoque la mort du premier frère après son supplice. « Fut mort » exprime clairement ce sens idiomatique sans introduire une image absente du grec.
- source_word: τὸν τρόπον τοῦτον
  choice: de cette manière
  rationale: Cette expression renvoie directement à la manière dont le premier frère vient de mourir.
- source_word: ἦγον ἐπὶ τὸν ἐμπαιγμόν
  choice: ils amenèrent le deuxième pour le livrer à leurs moqueries
  rationale: ἐμπαιγμός désigne la moquerie et l’humiliation infligées comme un divertissement cruel. La tournure française conserve cette dimension sans réduire la scène à de simples paroles railleuses.
- source_word: τὸ τῆς κεφαλῆς δέρμα σὺν ταῖς θριξὶν
  choice: le cuir chevelu avec les cheveux
  rationale: « Cuir chevelu » rend naturellement « la peau de la tête », tandis que « avec les cheveux » conserve la précision explicite du grec.
- source_word: περισύραντες
  choice: après lui avoir arraché
  rationale: Le verbe exprime ici un enlèvement violent par traction ou dépouillement. « Arraché » convient à l’action physique décrite.
- source_word: ἐπηρώτων
  choice: ils lui demandèrent
  rationale: Le français narratif emploie naturellement le passé simple. Le contexte ne nécessite pas de marquer explicitement la valeur durative ou répétée possible de l’imparfait grec.
- source_word: Εἰ φάγεσαι
  choice: Vas-tu manger
  rationale: La question porte sur son éventuelle acceptation de manger la nourriture interdite. Cette formulation est directe et naturelle en français.
- source_word: πρὸ τοῦ τιμωρηθῆναι
  choice: avant que ton corps soit torturé
  rationale: τιμωρέω signifie au sens large punir, mais la scène décrit concrètement un supplice corporel. « Torturé » rend ce sens contextuel et évite l’expression peu naturelle « punir un corps ».
- source_word: κατὰ μέλος
  choice: membre par membre
  rationale: Cette expression conserve la valeur distributive du grec et sa référence aux parties du corps.
- source_word: τὸ σῶμα
  choice: ton corps
  rationale: Le terme désigne concrètement le corps physique du deuxième frère, soumis au supplice.
