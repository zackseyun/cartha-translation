  text: But looking at him[a], he said, “Though you have authority among men, being mortal, you do what you want[b];
translation:
  language: fr
  text: 'Mais, le regardant, il lui dit : « Tu as autorité parmi les êtres humains[a] ; mortel[b], tu fais ce que tu veux ; »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « parmi des humains » ; le terme grec a ici une portée générique.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « périssable » ou « corruptible ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πρὸς αὐτὸν ἰδὼν εἶπεν
  choice: Mais il le regarda et lui dit
  rationale: La tournure participiale est rendue naturellement en français tout en conservant le regard direct et la transition narrative marquée par δέ.
- source_word: Ἐξουσίαν
  choice: une autorité
  rationale: ἐξουσία désigne ici l’autorité exercée par le souverain plutôt qu’une simple capacité ou force.
- source_word: ἐν ἀνθρώποις
  choice: parmi les êtres humains
  rationale: ἐν avec le datif indique ici la sphère humaine dans laquelle s’exerce cette autorité. Cette formulation restitue la portée générique de ἀνθρώποις sans la limiter aux hommes de sexe masculin.
- source_word: ἔχων
  choice: Détenant
  rationale: Le participe présent est conservé sous une forme française concise, sans imposer un lien logique plus précis que ne le fait explicitement le grec.
- source_word: ὃ θέλεις ποιεῖς
  choice: tu fais ce que tu veux
  rationale: Traduction directe, actuelle et naturelle de la proposition relative grecque.
- source_word: φθαρτὸς ὤν
  choice: bien que tu sois mortel
  rationale: Dans cette réprimande adressée à un souverain, φθαρτός souligne sa condition périssable et donc sa mortalité. La tournure concessive exprime le contraste rhétorique avec son autorité présente.
theological_decisions:
- issue: Nuance anthropologique de φθαρτὸς ὤν dans la réprimande adressée au souverain
  choice: bien que tu sois mortel
  alternative: alors que tu es périssable / corruptible
  rationale: Le passage oppose l’autorité politique du souverain à la fragilité de sa condition humaine. « Mortel » communique clairement cette opposition sans introduire une doctrine particulière de la corruption.
- issue: Rapport logique entre ἔχων, ποιεῖς et φθαρτὸς ὤν
  choice: participe descriptif pour ἔχων et concession explicite pour φθαρτὸς ὤν
  alternative: parce que tu as autorité… tout en étant périssable
  rationale: Le grec ne marque pas le rapport par une conjonction. La traduction conserve cette relative ouverture pour ἔχων, tandis que le contexte rhétorique justifie la valeur concessive de la mortalité opposée à l’exercice arbitraire de l’autorité.
translation_notes:
  register: Français international moderne, digne et direct. « Détenant » maintient la construction participiale sans lourdeur excessive. Le point-virgule final indique que la parole se poursuit dans le verset suivant.
