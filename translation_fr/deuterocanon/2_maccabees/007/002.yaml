  yaml_path: translation/deuterocanon/2_maccabees/007/002.yaml
  text: But one of them[a], becoming their spokesman, said, “What do you intend to ask and learn from us? For we are ready to die rather than transgress the ancestral laws.”
translation:
  language: fr
  text: 'Mais l’un d’eux, prenant la parole au nom des autres, dit : « Que comptes-tu nous demander et apprendre de nous ? Nous sommes prêts à mourir plutôt qu’à transgresser les lois de nos ancêtres. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἷς δὲ αὐτῶν
  choice: Mais l’un d’eux
  rationale: Le génitif partitif αὐτῶν signifie clairement « l’un d’eux » ; δέ marque ici le tournant narratif et la réaction du groupe.
- source_word: γενόμενος προήγορος
  choice: prenant la parole au nom des autres
  rationale: προήγορος désigne celui qui parle le premier ou représente les autres. Cette formulation française exprime naturellement sa fonction de porte-parole sans lui attribuer un statut permanent de chef.
- source_word: Μέλλεις ἐρωτᾷν, καὶ μανθάνειν ἡμῶν;
  choice: Que comptes-tu nous demander et apprendre de nous ?
  rationale: μέλλεις exprime ici l’intention ; la tournure interrogative française restitue le défi rhétorique. « De nous » conserve le rapport explicite de ἡμῶν avec μανθάνειν, tandis que « nous demander » rend naturellement ἐρωτᾷν dans ce contexte d’interrogatoire.
- source_word: ἕτοιμοι γάρ ἀποθνήσκειν ἐσμέν
  choice: Nous sommes prêts à mourir
  rationale: La construction avec ἕτοιμοι et l’infinitif signifie directement « être prêts à mourir ». Le γάρ explicatif peut rester implicite en français après la question, où l’enchaînement causal demeure clair.
- source_word: ἢ ... παραβαίνειν
  choice: plutôt qu’à transgresser
  rationale: 'ἢ oppose ici deux possibilités et exprime une préférence résolue : mourir plutôt que désobéir. « Transgresser » conserve la portée juridique et morale de παραβαίνειν.'
- source_word: τὰ πατρῷα νόμους
  choice: les lois de nos ancêtres
  rationale: Malgré l’irrégularité apparente de l’accord dans le texte transmis, le sens est celui des lois ancestrales. « Les lois de nos ancêtres » garde la dimension familiale et traditionnelle de πατρῷα tout en étant naturel en français moderne.
theological_decisions:
- issue: Expression de l’identité juive héritée dans πατρῷα νόμους
  choice: les lois de nos ancêtres
  alternative: les lois ancestrales
  rationale: La formulation choisie préserve la transmission communautaire et familiale de la Loi sans ajouter une précision confessionnelle absente du grec. Elle demeure plus concrète que « les lois ancestrales ».
translation_notes:
  register: Français international moderne, digne et oralement naturel. Le tutoiement correspond au singulier μέλλεις adressé au souverain et convient à la parole de défi. Aucun marqueur de note n’est requis, car aucune variante indispensable à la compréhension n’est retenue.
