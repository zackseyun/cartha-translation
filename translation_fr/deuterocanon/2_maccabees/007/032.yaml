lexical_decisions:
- source_word: ἡμεῖς
  choice: nous
  rationale: Le pronom personnel explicite est conservé pour rendre l’insistance portée sur les locuteurs.
- source_word: γὰρ
  choice: car
  rationale: « Car » restitue la valeur explicative de la particule et relie naturellement cette affirmation au contexte précédent.
- source_word: διὰ
  choice: à cause de
  rationale: Avec l’accusatif, διά exprime ici la cause ; « à cause de » en rend clairement la force causale.
- source_word: τὰς ἑαυτῶν ἁμαρτίας
  choice: nos propres péchés
  rationale: Le réfléchi ἑαυτῶν souligne que les péchés sont ceux des locuteurs eux-mêmes ; « nos propres péchés » préserve cette insistance.
- source_word: πάσχομεν
  choice: nous souffrons
  rationale: Le présent français exprime naturellement la souffrance en cours, sans ajouter une nuance absente du grec.
theological_decisions:
- issue: Cause de la souffrance des locuteurs
  choice: Leur souffrance est attribuée à leurs propres péchés.
  alternative: « Nous souffrons pour nos péchés », formulation moins explicite quant au lien causal et à l’insistance réflexive.
  rationale: Le grec attribue expressément la souffrance présente aux péchés des locuteurs eux-mêmes ; la traduction conserve cette affirmation pénitentielle sans l’atténuer ni la développer.
translation_notes:
  register: Français moderne, clair et digne. La tournure est concise et conserve la valeur explicative de γάρ ainsi que l’insistance réflexive de ἑαυτῶν.
