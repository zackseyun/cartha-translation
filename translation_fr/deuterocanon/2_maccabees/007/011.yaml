  text: And he said bravely, “From heaven I received these, and for his laws I disregard them, and from him I hope to receive them back again.”
translation:
  language: fr
  text: 'Et il déclara avec courage : « C’est du ciel que je tiens ces membres, et c’est pour ses lois que je n’en fais pas cas ; de lui, j’espère les recevoir de nouveau. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γενναίως
  choice: avec courage
  rationale: Rend naturellement l’adverbe grec, qui décrit la vaillance avec laquelle il parle face au supplice.
- source_word: ταῦτα
  choice: ces membres / les
  rationale: Le démonstratif renvoie, dans le contexte immédiat, aux parties du corps qui lui sont arrachées; « ces membres » explicite ce référent dans la première occurrence, puis les pronoms évitent une répétition lourde.
- source_word: ὑπερορῶ
  choice: je les méprise
  rationale: 'Conserve la force du verbe grec: il les tient pour négligeables et accepte de les perdre par fidélité aux lois divines.'
- source_word: πάλιν ἐλπίζω κομίσεσθαι
  choice: j’espère les recevoir de nouveau
  rationale: Préserve l’espérance explicite de recouvrer ce qui est perdu, sans préciser davantage le mode de cette restitution.
theological_decisions:
- issue: Origine divine exprimée par Ἐξ οὐρανοῦ et παρʼ αὐτοῦ
  choice: « du ciel » puis « de lui »
  alternative: « de Dieu » dans les deux cas
  rationale: Le texte grec emploie d’abord « du ciel » comme désignation indirecte, puis un pronom masculin. La traduction conserve cette progression et évite d’expliciter au-delà du texte.
- issue: Espérance de restitution corporelle
  choice: « les recevoir de nouveau »
  alternative: « les retrouver à la résurrection »
  rationale: Le contexte évoque la résurrection, mais le verset ne la nomme pas; la formulation retenue maintient l’affirmation et son degré d’implicite.
translation_notes:
  register: Français moderne, digne et oralement naturel. « Déclara avec courage » évite la tournure moins idiomatique « dit courageusement ». Le référent corporel de ταῦτα est explicité sobrement par « ces membres », compte tenu du contexte du supplice.
