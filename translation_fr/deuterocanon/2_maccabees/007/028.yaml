base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/028.yaml
  text: I beg you[a], child, look at heaven and earth and see everything in them, and know that God made them not out of existing things, and that the human race comes to be in the same way.
translation:
  language: fr
  text: 'Je t’en prie, mon enfant : regarde le ciel et la terre, vois tout ce qui s’y trouve et reconnais que Dieu n’a pas fait tout cela à partir de réalités existantes[a]. Le genre humain vient à l’existence de la même manière.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus interprétative : « à partir de rien ». Le grec dit littéralement : « non à partir de choses existantes ».'
    reason: Préciser l’alternative lexicale et préserver la formulation propre du texte grec sans masquer sa portée théologique.
lexical_decisions:
- source_word: ἀξιῶ σε
  choice: Je t’en prie
  rationale: Dans la bouche d’une mère qui exhorte son enfant avant son martyre, l’expression traduit une supplication pressante sans adopter le ton plus soutenu et potentiellement archaïque de « je t’en conjure ».
- source_word: τέκνον
  choice: mon enfant
  rationale: Le grec emploie le terme générique « enfant ». L’ajout naturel du possessif en français convient à l’adresse maternelle sans remplacer le mot source par « fils ».
- source_word: ἀναβλέψαντα εἰς τὸν οὐρανὸν καὶ τὴν γῆν
  choice: regarde le ciel et la terre
  rationale: La formulation française exprime clairement l’observation attentive des deux composantes du monde. Traduire mécaniquement la nuance de « lever les yeux » conviendrait au ciel, mais moins naturellement à la terre.
- source_word: τὰ ἐν αὐτοῖς πάντα
  choice: tout ce qui s’y trouve
  rationale: Cette tournure française actuelle conserve la portée exhaustive de πάντα et renvoie naturellement au ciel et à la terre.
- source_word: γνῶναι
  choice: reconnais
  rationale: Le verbe désigne ici le savoir auquel doit conduire l’observation. « Reconnais » rend ce mouvement de la contemplation vers la connaissance sans surinterpréter par « comprends ».
- source_word: οὐκ ἐξ ὄντων
  choice: non à partir de choses qui existaient
  rationale: La formulation suit l’expression grecque, littéralement « non à partir d’étants/de choses existantes », et évite d’introduire directement dans le texte la formule théologique ultérieure « à partir de rien ».
- source_word: ἐποίησεν
  choice: a faits
  rationale: Le verbe grec courant signifie « faire ». Ce choix reste plus proche de la source que « créer » tout en étant pleinement intelligible dans ce contexte.
- source_word: τὸ τῶν ἀνθρώπων γένος
  choice: le genre humain
  rationale: Cette expression française naturelle désigne collectivement l’humanité et correspond étroitement à la structure du grec.
- source_word: οὕτω γίγνεται
  choice: vient à l’existence de la même manière
  rationale: γίγνεται exprime la venue à l’existence plutôt que la seule naissance. « De la même manière » explicite le renvoi de οὕτω à ce qui vient d’être affirmé tout en conservant la tension du propos.
theological_decisions:
- issue: Faut-il rendre οὐκ ἐξ ὄντων par la formule doctrinale « à partir de rien » ?
  choice: non à partir de choses qui existaient
  alternative: à partir de rien
  rationale: Le grec nie que Dieu ait fait le ciel, la terre et leur contenu à partir de réalités préexistantes. La traduction principale conserve cette formulation négative au lieu de la remplacer par un raccourci doctrinal postérieur ; la note en indique l’interprétation courante.
translation_notes:
  register: 'Français international moderne, digne et accessible. Les impératifs coordonnés rendent naturellement en français les participes grecs dépendant de la supplication initiale. La répétition « regarde… vois » est conservée parce qu’elle reflète la progression du texte source : porter le regard, observer l’ensemble, puis reconnaître.'
