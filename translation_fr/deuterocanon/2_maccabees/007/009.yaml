base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/009.yaml
  text: And as he was at his last breath[a], he said, “You, accursed wretch, release us from this present life, but the King of the world will raise us up, who have died for his laws[b], into an everlasting renewal of life.”
translation:
  language: fr
  text: 'Au moment de rendre son dernier souffle, il dit : « Toi, misérable maudit[a], tu nous délivres de la vie présente ; mais le Roi du monde nous relèvera, après que nous serons morts pour ses lois, pour une vie retrouvée qui ne finira jamais[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « maudit » ou « misérable » ; le mot grec est une violente injure.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec associe « éternelle » à un nom rare signifiant le retour ou le réveil à la vie. Autre traduction : « pour une résurrection à la vie éternelle ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐσχάτῃ ... πνοῇ γενόμενος
  choice: Au moment de rendre son dernier souffle
  rationale: Cette formulation française naturelle conserve l’image concrète du dernier souffle et la valeur temporelle du participe γενόμενος.
- source_word: ἀλάστωρ
  choice: misérable maudit
  rationale: Le terme est une violente injure pouvant désigner une personne maudite ou abjecte. Cette expression conserve à la fois l’invective et la connotation de malédiction, sans retenir le sens spécialisé d’« vengeur ».
- source_word: ἐκ τοῦ παρόντος ... ζῆν ἀπολύεις
  choice: tu nous délivres de la vie présente
  rationale: Le grec dit littéralement que le persécuteur les libère du fait de vivre dans le présent. La traduction garde l’ironie de ἀπολύεις et explicite sobrement le contraste entre la vie actuelle et celle que Dieu donnera.
- source_word: ὁ τοῦ κόσμου βασιλεὺς
  choice: le Roi du monde
  rationale: Traduction directe de κόσμος qui préserve le contraste entre le souverain universel et le roi terrestre interpellé.
- source_word: ἀποθανόντας ἡμᾶς ὑπὲρ τῶν αὐτοῦ νόμων
  choice: nous qui mourons pour ses lois
  rationale: En français, le présent « mourons » exprime naturellement la mort imminente et commune des martyrs. « Pour ses lois » conserve la portée causale et l’idée de fidélité sans l’alourdir.
- source_word: εἰς αἰώνιον ἀναβίωσιν ζωῆς
  choice: pour une vie retrouvée qui ne finira jamais
  rationale: ἀναβίωσις est un nom rare désignant le retour ou le réveil à la vie. « Vie retrouvée » maintient cette nuance, tandis que « qui ne finira jamais » rend clairement αἰώνιον en français courant.
- source_word: ἀναστήσει
  choice: nous relèvera
  rationale: « Relèvera » conserve l’image et la portée résurrectionnelle du verbe ἀνίστημι sans remplacer le terme grec par une formulation doctrinale plus explicite.
theological_decisions:
- issue: La résurrection des martyrs et la formulation rare du retour à la vie
  choice: Conserver à la fois « nous relèvera » et « une vie retrouvée qui ne finira jamais »
  alternative: « nous ressuscitera pour la vie éternelle »
  rationale: Le grec juxtapose le verbe courant de relèvement, ἀναστήσει, et l’expression rare αἰώνιον ἀναβίωσιν ζωῆς. La traduction retenue préserve ce redoublement et l’espérance d’une vie après la mort sans les fondre en une formule doctrinale unique.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct reste vigoureux sans archaïsme. Les deux propositions sont mises en contraste par le point-virgule et « mais ». Tous les marqueurs de notes figurent dans le texte.
