base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/006.yaml
  text: The Lord God is watching[a], and in truth he is being moved to compassion for us, just as Moses made clear in the song that testifies openly, saying[c][b], “And he will be moved to compassion for his servants.”
translation:
  language: fr
  text: 'Le Seigneur Dieu regarde[a] et, en vérité, il est ému de compassion pour nous, comme Moïse l’a clairement déclaré par le chant, dont le témoignage est direct et accusateur, en disant : « Et il sera ému de compassion pour ses serviteurs. »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « voit ». Le présent grec présente le regard de Dieu comme actuel et continu.
    reason: lexical_alternative
  - marker: b
    text: La citation fait écho à Deutéronome 32.36. Le verbe grec peut aussi évoquer le fait d’être consolé ou de se laisser fléchir ; ici, le contexte favorise l’idée d’être ému de compassion. Le grec appelle les personnes concernées ses « esclaves », terme souvent rendu par « serviteurs » lorsqu’il décrit leur relation à Dieu. La formulation grecque qualifiant le chant évoque un témoignage direct et adverse, sans en exprimer ici le destinataire.
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: ἐφορᾷ
  choice: regarde
  rationale: Le présent exprime le regard actuel et attentif de Dieu, sans ajouter explicitement une idée de protection absente du verbe.
- source_word: ταῖς ἀληθείαις
  choice: en vérité
  rationale: Le datif pluriel a ici une valeur adverbiale idiomatique ; « en vérité » est naturel en français et rend l’insistance.
- source_word: παρακαλεῖται
  choice: il est ému de compassion
  rationale: Dans ce contexte, éclairé par la citation du cantique de Moïse, le moyen-passif exprime le fait d’être touché de pitié ou amené à compatir. La formulation conserve la voix passive et le lien lexical avec παρακληθήσεται.
- source_word: διεσάφησεν
  choice: a clairement indiqué
  rationale: Le verbe signifie rendre clair ou explicite ; cette expression est à la fois fidèle et naturelle.
- source_word: κατὰ πρόσωπον ἀντιμαρτυρούσης
  choice: qui témoigne ouvertement contre nous
  rationale: « Ouvertement » rend l’idée de κατὰ πρόσωπον, tandis que « contre nous » préserve la force adversative de ἀντιμαρτυρούσης et l’arrière-plan du cantique établi comme témoin.
- source_word: δούλοις
  choice: serviteurs
  rationale: Dans cette citation scripturaire désignant ceux qui appartiennent à Dieu, « serviteurs » est le terme français naturel et traditionnel, tout en conservant la relation de dépendance exprimée par δοῦλος.
- source_word: παρακληθήσεται
  choice: il sera ému de compassion
  rationale: Le futur passif est conservé, ainsi que le parallèle verbal avec παρακαλεῖται ; le sens de compassion convient à l’écho de Deutéronome 32.36.
theological_decisions:
- issue: Sens de παρακαλεῖται et παρακληθήσεται appliqués à Dieu
  choice: Être ému de compassion envers son peuple
  alternative: Être consolé ; se laisser fléchir ; avoir pitié
  rationale: Le contexte immédiat et l’allusion à Deutéronome 32.36 favorisent la compassion ou le fait de se laisser fléchir. La traduction garde néanmoins la forme passive inhabituelle au lieu de la normaliser en simple actif.
- issue: Force testimoniale du cantique
  choice: Le chant témoigne ouvertement contre « nous »
  alternative: Le chant témoigne ouvertement, sans complément adversatif explicite
  rationale: ἀντιμαρτυρούσης comporte une force de contre-témoignage, et le contexte de Deutéronome présente le cantique comme témoin contre le peuple. L’ajout « contre nous » explicite cette relation sans résoudre la tension entre accusation et compassion.
- issue: Traduction de δούλοις
  choice: ses serviteurs
  alternative: ses esclaves
  rationale: Les deux rendent une relation de dépendance et d’appartenance. Dans une citation solennelle concernant le peuple de Dieu, « serviteurs » est plus idiomatique en français actuel et évite que le sens sociojuridique moderne d’« esclaves » domine abusivement le contexte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit de près le mouvement du grec, mais évite les calques opaques. « Témoigne ouvertement contre nous » maintient la vigueur judiciaire du participe, tandis que « ému de compassion » préserve le parallélisme et la forme passive des deux occurrences du verbe.
