review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèlement rendu, y compris la brutalité du récit. Toutefois, « inutilisable pour les autres » est peu naturel en français et atténue légèrement la tournure personnelle et déshumanisante du grec. La portée de « respirait encore » doit aussi couvrir les deux ordres de supplice, comme dans le grec.
  naturalness: 'Une révision légère améliore nettement l’idiome : « devenu inutile aux autres », « alors qu’il vivait encore », et une formulation où la vapeur s’élève de la poêle sont plus naturelles dans un français international actuel.'
  terminology: « Feu », « poêle », « vapeur » et « mourir noblement » sont appropriés. « Feu » est plus direct et moins interprétatif que « brasier »; « vivant encore » rend ἔτι νουν sans restreindre le sens à la seule respiration.
  issues:
  - severity: medium
    issue: « inutilisable pour les autres »
    rationale: Cette expression évoque surtout un objet ou un dispositif et sonne artificielle. « Devenu inutile aux autres » est idiomatique, conserve le jugement déshumanisant et ne précise pas la fonction que le supplicié ne peut plus remplir.
  - severity: medium
    issue: Portée syntaxique de « alors qu’il respirait encore »
    rationale: Dans le projet, le complément est placé après « l’approcher du brasier » et peut paraître ne qualifier que cette action. Le grec indique qu’il devait être amené au feu et frit alors qu’il était toujours vivant.
  - severity: low
    issue: « la vapeur de la poêle se répandait abondamment »
    rationale: Le grec décrit la vapeur que la poêle dégageait en quantité considérable. « la vapeur qui s’élevait de la poêle » rend l’image plus naturellement sans modifier le degré d’intensité.
  revised_text: 'Quand il fut devenu inutile aux autres, il ordonna de l’amener au feu et de le faire frire dans une poêle alors qu’il vivait encore[a]. Quand la vapeur qui s’élevait de la poêle se répandait abondamment, ils s’encourageaient les uns les autres, avec leur mère, à mourir noblement, en disant :'
  revised_footnotes:
