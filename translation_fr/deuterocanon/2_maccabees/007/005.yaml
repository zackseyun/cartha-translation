revisions:
- from: 'Quand il fut devenu inutilisable pour les autres, le roi ordonna de l’approcher du brasier alors qu’il respirait encore[a], et de le faire frire dans la poêle. Tandis que la vapeur[b] de la poêle se répandait abondamment, avec leur mère, ils s’encourageaient les uns les autres à mourir noblement, en disant :'
  to: 'Quand il fut devenu inutile aux autres, il ordonna de l’amener au feu et de le faire frire dans une poêle alors qu’il vivait encore[a]. Quand la vapeur qui s’élevait de la poêle se répandait abondamment, ils s’encourageaient les uns les autres, avec leur mère, à mourir noblement, en disant :'
  rationale: La révision remplace une formulation française peu idiomatique, rend la portée de l’état de vie encore présente lors des deux actes ordonnés, et exprime plus naturellement l’émission de vapeur. Le marqueur [b], qui porte sur « vapeur », est maintenu; le sujet « il » est conservé, car le grec ne nomme pas ici le roi, même si le contexte l’identifie.
