base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/005.yaml
  text: 'And when he had become useless to the others[a], he ordered him to be brought to the fire while still breathing and to be fried in the pan. And when the vapor from the pan had spread considerably, they encouraged one another, together with their mother, to die nobly[b], saying this:'
translation:
  language: fr
  text: 'Quand il fut devenu inutile aux autres, il ordonna de l’amener au feu et de le faire frire dans une poêle alors qu’il vivait encore[a]. Quand la vapeur qui s’élevait de la poêle se répandait abondamment, ils s’encourageaient les uns les autres, avec leur mère, à mourir noblement, en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « alors qu’il respirait encore ». Le grec souligne que le supplice continuait avant sa mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρηστον ... τοῖς λοιποῖς γενόμενον
  choice: quand il fut devenu inutilisable pour les autres
  rationale: Cette formulation conserve le caractère brutal et déshumanisant de ἄχρηστον ainsi que le rapport explicite aux autres frères exprimé par τοῖς λοιποῖς, sans préciser en quoi il ne pouvait plus « servir ».
- source_word: ἐκέλευσεν
  choice: le roi ordonna
  rationale: « Ordonna » restitue directement la force coercitive du verbe. Le sujet, le roi, est explicité d’après le contexte immédiat pour éviter en français une référence pronominale obscure.
- source_word: τῇ πυρᾷ προσάγειν
  choice: de l’approcher du brasier
  rationale: Le brasier désigne ici le feu destiné au supplice, non un bûcher funéraire. La tournure causative française rend l’ordre de conduire la victime au feu.
- source_word: ἔτινουν
  choice: alors qu’il respirait encore
  rationale: Cette expression souligne que le supplice se poursuivait avant sa mort et conserve l’image concrète de la respiration encore présente.
- source_word: τηγανίζειν
  choice: de le faire frire dans la poêle
  rationale: Le verbe dérivé de τηγανόν évoque explicitement l’action de frire sur ou dans une poêle. La formulation française préserve la précision atroce du texte.
- source_word: τῆς ... ἀτμίδος
  choice: la vapeur
  rationale: ἀτμίς peut désigner de la vapeur ou des émanations; « vapeur » reste suffisamment large et naturel dans ce contexte.
- source_word: ἐφ’ ἱκανὸν διδούσης
  choice: se répandait abondamment
  rationale: La locution indique une émission ou une diffusion considérable. « Abondamment » rend cette ampleur sans imposer une durée précise.
- source_word: ἀλλήλους παρεκάλουν σὺν τῇ μητρὶ
  choice: avec leur mère, ils s’encourageaient les uns les autres
  rationale: La tournure conserve la réciprocité de ἀλλήλους et inclut la mère dans l’encouragement mutuel.
- source_word: γενναίως τελευτᾷν
  choice: à mourir noblement
  rationale: γενναίως associe courage et noblesse morale; « noblement » préserve ce registre d’honneur sans ajouter une catégorie doctrinale ultérieure.
theological_decisions:
- issue: Caractérisation morale de leur mort
  choice: mourir noblement
  alternative: mourir courageusement
  rationale: Le grec présente leur mort comme digne et courageuse. « Noblement » maintient la valeur morale de γενναίως sans transformer le passage en formulation doctrinale.
- issue: Sens de l’inutilité du frère supplicié par rapport aux autres
  choice: inutilisable pour les autres
  alternative: devenu inutile aux autres
  rationale: Le texte ne précise pas s’il ne pouvait plus servir d’exemple, de moyen d’intimidation ou d’objet de torture. La traduction conserve cette ambiguïté et la déshumanisation du point de vue du persécuteur.
translation_notes:
  register: Français international actuel, narratif et digne. Le vocabulaire concret du supplice est conservé sans atténuation, tandis que la syntaxe reste accessible. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
