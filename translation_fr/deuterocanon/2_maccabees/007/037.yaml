base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/037.yaml
  text: But I[a], like my brothers, give up both body and life for the laws of our fathers, calling on God quickly to become merciful to the nation, and for you, through torments and whippings[b], to confess that he alone is God.
translation:
  language: fr
  text: Mais moi, comme mes frères, je livre mon corps et ma vie[a] pour les lois de nos pères, en invoquant Dieu pour qu’il fasse bientôt grâce à la nation, et pour que toi, sous les tortures et les coups de fouet, tu reconnaisses ouvertement[b] que lui seul est Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut aussi signifier « sort » ou « destinée » ; ici, il désigne concrètement la vie livrée au martyre.
    reason: lexical_alternative
  - marker: b
    text: Ou « confesses ». Le verbe grec peut désigner une reconnaissance ou un aveu exprimé ouvertement.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: comme
  rationale: Introduit naturellement la comparaison avec les frères déjà martyrisés.
- source_word: σῶμα καὶ τύχην
  choice: mon corps et ma vie
  rationale: « Corps » rend directement σῶμα; dans ce contexte de martyre, τύχη désigne concrètement la vie ou le sort que le jeune homme abandonne.
- source_word: προδίδωμι
  choice: je livre
  rationale: Exprime ici l’abandon volontaire de soi, sans la connotation trompeuse de « trahir ».
- source_word: περὶ τῶν πατρίων νόμων
  choice: pour les lois de nos pères
  rationale: Rend la défense des lois héritées des pères tout en conservant la texture familiale du grec.
- source_word: ἐπικαλούμενοι τὸν θεόν
  choice: en appelant Dieu
  rationale: Décrit l’appel adressé à Dieu dans la prière; la forme française s’accorde avec le sujet singulier du discours, malgré le participe pluriel transmis par le texte grec.
- source_word: ἵλεων ταχὺ τῷ ἔθνει γενέσθαι
  choice: à faire bientôt grâce à notre peuple
  rationale: « Faire grâce » exprime la disposition favorable et miséricordieuse de ἵλεως; « notre peuple » identifie naturellement la collectivité juive sans donner à « nation » un sens politique moderne.
- source_word: μετὰ ἐτασμῶν καὶ μαστίγων
  choice: par les tortures et les coups de fouet
  rationale: Rend de façon claire et concrète les tourments et les flagellations servant de moyen à la reconnaissance forcée.
- source_word: ἐξομολογήσασθαι
  choice: reconnaître ouvertement
  rationale: Le verbe peut désigner une confession ou un aveu public; cette formulation conserve l’idée de reconnaissance explicite sans suggérer nécessairement une confession volontaire de foi.
- source_word: διότι μόνος αὐτὸς θεὸς ἐστίν
  choice: que lui seul est Dieu
  rationale: Préserve l’accent exclusif de μόνος αὐτός et le renvoi personnel au Dieu qui vient d’être mentionné.
theological_decisions:
- issue: La portée de la déclaration monothéiste finale
  choice: que lui seul est Dieu
  alternative: qu’il est le seul Dieu
  rationale: La formulation choisie garde l’emphase grecque sur le fait que Dieu, lui seul, est Dieu, sans développer davantage l’affirmation.
- issue: La nature de la reconnaissance imposée au roi
  choice: à reconnaître ouvertement
  alternative: à confesser
  rationale: ἐξομολογέομαι permet les deux sens. « Reconnaître ouvertement » évite de transformer une reconnaissance obtenue par les châtiments en confession de foi volontaire.
- issue: Le référent de πατρίων
  choice: les lois de nos pères
  alternative: nos lois ancestrales
  rationale: La traduction conserve l’image familiale et traditionnelle présente dans le grec, sans l’abstraire en simple héritage culturel.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’enchaînement de la prière grecque tout en explicitant en français la construction « amener quelqu’un à ». Le participe grec ἐπικαλούμενοι est pluriel, anomalie possible de transmission ou accord lié au groupe des frères; la traduction suit le locuteur singulier imposé par ἐγώ et προδίδωμι.
