  source_fidelity: 'La proposition coordonnée finale ne dit pas que Dieu « amènera » le roi à reconnaître son unicité. Le grec associe à l’invocation deux demandes : que Dieu devienne promptement favorable à la nation, et que le roi, sous les tortures et les coups de fouet, reconnaisse ouvertement que Dieu seul est Dieu. La révision évite donc de faire de Dieu l’agent explicite des supplices ou de la contrainte exercée sur le roi.'
  naturalness: 'La formulation révisée est idiomatique en français international moderne et conserve une syntaxe de prière claire : « en invoquant Dieu pour que… et pour que… ». « Sous les tortures et les coups de fouet » rend naturellement la valeur circonstancielle de μετά.'
  terminology: « Je livre mon corps et ma vie », « les lois de nos pères », « faire grâce », « reconnaître ouvertement » et « lui seul est Dieu » sont appropriés, précis et d’un registre digne. « La nation » préserve le sens collectif de τῷ ἔθνει sans ajouter le possessif absent du grec.
