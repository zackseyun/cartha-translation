translation:
  language: fr
  text: Alors le roi, pris d’une violente colère, ordonna de faire chauffer[a] des poêles et des chaudrons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chauffer à blanc » ; le verbe grec évoque une chauffe par le feu, possiblement très intense.
    reason: Alternative lexicale préservant la possibilité d’une traduction plus explicite quant au degré de chauffe.
lexical_decisions:
- source_word: Ἐκθύμως … γενόμενος
  choice: saisi d’une violente colère
  rationale: La tournure exprime l’entrée du roi dans un état de colère véhémente. Cette formulation française est naturelle et conserve à la fois la transition et l’intensité.
- source_word: ὁ βασιλεὺς
  choice: le roi
  rationale: Équivalent direct du titre grec, sans précision politique absente du texte source.
- source_word: προσέταξεν
  choice: ordonna
  rationale: Le verbe désigne un ordre donné avec autorité; « ordonna » en restitue clairement la force.
- source_word: τήγανα
  choice: des poêles
  rationale: Le nom désigne des récipients plats servant notamment à frire; « poêles » est l’équivalent moderne le plus naturel en français.
- source_word: λέβητας
  choice: des chaudrons
  rationale: Le terme désigne de grands récipients métalliques; « chaudrons » convient au contexte et évite la connotation trop domestique de « bouilloires ».
- source_word: ἐκπυροῦν
  choice: de chauffer à blanc
  rationale: Le verbe indique une chauffe par le feu, vraisemblablement très intense. « Chauffer à blanc » rend vivement cette intensité, tout en signalant en note la traduction plus générale possible.
