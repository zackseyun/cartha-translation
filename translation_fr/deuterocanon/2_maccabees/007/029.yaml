base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/029.yaml
  text: Do not fear this executioner[a], but, becoming worthy of your brothers, accept death[c][b], so that in mercy I may receive you back together with your brothers.
translation:
  language: fr
  text: Ne crains pas ce bourreau[a], mais montre-toi digne de tes frères et accepte la mort, afin que, dans la miséricorde[b], je te retrouve[c] avec tes frères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cet exécuteur ». Le grec désigne plus précisément celui qui procède à une exécution, dans un contexte qui comprend aussi la torture.
    reason: lexical_alternative
  - marker: b
    text: Il s'agit vraisemblablement de la miséricorde divine, mais Dieu n'est pas explicitement nommé dans cette proposition grecque.
    reason: alternative_reading
  - marker: c
    text: Ou « je te reçoive de nouveau » ou « je te récupère ». Le verbe exprime l'espoir de la mère d'être réunie à son fils avec ses frères.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ φοβηθῇς
  choice: Ne crains pas
  rationale: Rend directement et naturellement la défense exprimée par μή avec la forme verbale aoriste.
- source_word: τὸν δήμιον τοῦτον
  choice: ce bourreau
  rationale: δήμιος désigne ici celui qui exécute la sentence et met à mort. « Bourreau » est le terme français courant et convient aussi au contexte de torture.
- source_word: τῶν ἀδελφῶν σου ἄξιος γενόμενος
  choice: montre-toi digne de tes frères
  rationale: Cette formulation française naturelle rend l'idée de devenir digne de ses frères par sa conduite, sans confondre cette dignité avec une valeur intrinsèque.
- source_word: ἐπίδεξαι τὸν θάνατον
  choice: accepte la mort
  rationale: ἐπιδέχομαι exprime ici l'accueil ou l'acceptation volontaire de la mort.
- source_word: ἵνα
  choice: afin que
  rationale: Conserve clairement le rapport de but ou de résultat introduit par ἵνα.
- source_word: ἐν τῷ ἐλέει
  choice: dans la miséricorde
  rationale: Calque sobre de la formulation grecque, sans ajouter explicitement Dieu comme détenteur de cette miséricorde.
- source_word: σὺν τοῖς ἀδελφοῖς σου
  choice: avec tes frères
  rationale: Rend simplement l'accompagnement et la réunion avec ses frères.
- source_word: κομίσωμαί σε
  choice: je te retrouve
  rationale: κομίζω peut signifier recevoir ou recouvrer. « Je te retrouve » exprime naturellement en français l'espoir maternel d'une réunion au-delà de la mort, sans expliciter davantage son mécanisme.
theological_decisions:
- issue: Faut-il nommer explicitement Dieu dans ἐν τῷ ἐλέει ?
  choice: dans la miséricorde
  alternative: dans la miséricorde de Dieu
  rationale: Le contexte suggère la miséricorde divine, mais Dieu n'est pas explicitement nommé dans cette proposition grecque. La traduction préserve cette implication sans l'expliciter.
- issue: Portée de la restauration exprimée par κομίσωμαί σε
  choice: je te retrouve
  alternative: je te reçoive de nouveau
  rationale: Le verbe porte l'espoir d'une réunion après la mort. « Je te retrouve » conserve cette espérance implicite sans ajouter une description doctrinale précise de la résurrection.
- issue: Sens de « digne de tes frères »
  choice: montre-toi digne de tes frères
  alternative: deviens digne de tes frères
  rationale: L'exhortation appelle le fils à se montrer à la hauteur de la fidélité de ses frères. Le français idiomatique évite de suggérer qu'il serait jusque-là indigne en valeur personnelle.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le tutoiement convient à la parole d'une mère à son fils. La syntaxe exhortative reste proche du grec tout en évitant une tournure participiale lourde.
