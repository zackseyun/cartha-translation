base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/024.yaml
  text: But Antiochus[a], thinking that he was being despised and taking note of the reproachful tone, while the youngest was still alive, not only urged him with words, but also assured him with oaths that he would both make him rich and make him blessed, if he turned away from the traditions of his fathers[c][b], and that he would have him as a friend and entrust him with offices.
translation:
  language: fr
  text: Mais Antiochos, pensant qu’on le traitait avec mépris et remarquant le ton de reproche[a], alors que le plus jeune était encore en vie, ne chercha pas seulement à le persuader par des paroles, mais lui promit aussi sous serment que, s’il abandonnait les traditions de ses pères, il le rendrait riche et heureux, ferait de lui l’un de ses amis[b] et lui confierait des fonctions[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la voix qui faisait des reproches » ; on peut aussi traduire : « les paroles insultantes ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot « ami » pouvait aussi désigner un membre du cercle royal, associé ou dignitaire favorisé par le roi.
    reason: cultural_note
  - marker: c
    text: 'Ou : « des responsabilités » ; il s’agit de tâches, de charges ou de positions confiées par le roi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰόμενος καταφρονεῖσθαι
  choice: pensant qu’on le traitait avec mépris
  rationale: Rend le point de vue subjectif d’Antiochos et le passif grec dans un français naturel, tout en conservant la dimension d’honneur bafoué.
- source_word: τὴν ὀνειδίζουσαν ὑφορώμενος φωνήν
  choice: remarquant le ton de reproche
  rationale: « Ton » exprime naturellement la manière de parler désignée littéralement par « voix », et « de reproche » conserve la valeur accusatrice ou insultante du grec.
- source_word: ἔτι τοῦ νεωτέρου περιόντος
  choice: alors que le plus jeune était encore en vie
  rationale: Le génitif absolu indique une circonstance simultanée; dans le contexte des mises à mort successives, περιόντος signifie que le plus jeune survivait encore.
- source_word: οὐ μόνον διὰ λόγων ἐποιεῖτο τὴν παράκλησιν
  choice: ne se contenta pas de l’exhorter par des paroles
  rationale: La tournure française restitue l’appel pressant de παράκλησις et prépare naturellement le contraste avec les serments.
- source_word: διʼ ὅρκων ἐπίστου
  choice: il lui assura aussi avec serment
  rationale: Le verbe indique qu’Antiochos cherchait à donner foi à ses promesses au moyen de serments solennels.
- source_word: πλουτιεῖν καὶ μακαριστὸν ποιήσειν
  choice: il le rendrait riche et heureux
  rationale: « Heureux » garde la portée favorable de μακαριστός sans imposer ici une béatitude religieuse; la promesse concerne richesse et condition privilégiée.
- source_word: μεταθέμενον ἀπὸ τῶν πατρίων
  choice: s’il abandonnait les traditions de ses pères
  rationale: Le participe a une valeur conditionnelle et désigne le renoncement à l’héritage ancestral; « traditions de ses pères » préserve les dimensions familiale et religieuse sans les expliciter davantage.
- source_word: φίλον ἕξειν
  choice: Il ferait de lui l’un de ses amis
  rationale: Cette formulation demeure proche du grec tout en suggérant naturellement l’appartenance possible au cercle des « Amis » du roi.
- source_word: χρείας ἐμπιστεύσειν
  choice: lui confierait des fonctions
  rationale: Le terme peut désigner des charges, responsabilités ou affaires confiées; « fonctions » convient au contexte de patronage royal sans préciser indûment leur nature.
theological_decisions:
- issue: Portée de πατρίων dans le contexte de l’apostasie
  choice: les traditions de ses pères
  alternative: les coutumes ancestrales
  rationale: Le choix conserve le caractère transmis et familial des pratiques juives en cause, sans ajouter un vocabulaire confessionnel absent du grec.
- issue: Sens de μακαριστόν dans une promesse royale profane
  choice: heureux
  alternative: enviable; comblé; bienheureux
  rationale: « Heureux » préserve la polysémie du terme tout en évitant le sens religieux marqué de « bienheureux » et l’interprétation sociale plus étroite d’« enviable ».
- issue: Statut de φίλον dans le milieu de cour hellénistique
  choice: l’un de ses amis
  alternative: son ami; l’un de ses proches collaborateurs
  rationale: La traduction garde le terme relationnel du texte et la note signale sa possible valeur institutionnelle, sans décider que le titre technique est certain.
translation_notes:
  register: Français international actuel, narratif et digne. La phrase grecque, très longue, est divisée en deux phrases pour assurer la lisibilité sans perdre les rapports logiques. Les nuances de cour attachées à « amis » et « fonctions » sont conservées dans les notes.
