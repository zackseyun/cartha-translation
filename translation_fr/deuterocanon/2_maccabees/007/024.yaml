  verdict: revise
  source_fidelity: 'Révision mineure nécessaire : la promesse jurée porte naturellement sur l’ensemble des avantages proposés à condition que le jeune homme abandonne les traditions ancestrales. Dans le texte en deux phrases, la condition ne régit plus clairement « il ferait de lui l’un de ses amis » et « lui confierait des fonctions ». La révision rétablit ce lien sans surinterpréter le grec.'
  naturalness: Le français du projet est globalement naturel et d’un registre narratif approprié. « Ne chercha pas seulement à le persuader » et « promit sous serment » rendent plus idiomatiquement l’opposition grecque entre l’exhortation verbale et les garanties données par serments.
  terminology: « Antiochos », « traditions de ses pères », « heureux », « l’un de ses amis » et « fonctions » sont recevables. « Heureux » convient ici à μακαριστός dans le cadre d’une promesse de faveur royale, sans imposer une connotation religieuse. La note sur « amis » préserve justement la possible nuance de cour.
  issues:
