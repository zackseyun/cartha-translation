    issue: Portée syntaxique de la condition
    rationale: La phrase finale autonome (« Il ferait de lui… ») n’est plus clairement placée sous la condition « s’il abandonnait… ». Le grec présente les avantages comme faisant partie de l’assurance donnée en vue de son abandon des traditions ancestrales. Une phrase unique rend ce rapport explicite.
