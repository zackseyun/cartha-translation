    issue: Rendu de l’opposition entre paroles et serments
    rationale: « Ne se contenta pas de l’exhorter par des paroles » est intelligible, mais « ne chercha pas seulement à le persuader par des paroles, mais lui promit aussi sous serment » reflète plus directement la construction οὐ μόνον… ἀλλὰ καί et sa force promissoire.
