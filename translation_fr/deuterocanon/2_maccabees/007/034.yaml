base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/034.yaml
  text: But you[a], O unholy one, most defiled of all men, do not be vainly puffed up, inflamed with uncertain hopes, having raised your hands against the children of heaven.
translation:
  language: fr
  text: Mais toi, impie, le plus souillé de tous les hommes, ne t’enfle pas d’orgueil en vain, tout embrasé d’espérances incertaines, ayant levé les mains contre les enfants du ciel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les enfants célestes ». Le grec peut présenter ces enfants comme célestes ou comme appartenant au ciel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόσιε
  choice: impie
  rationale: Le vocatif dénonce directement celui qui transgresse ce qui est saint. « Impie » est naturel, vigoureux et conserve la dimension religieuse du grec.
- source_word: μιαρώτατε
  choice: le plus souillé
  rationale: Le superlatif de μιαρός évoque une souillure à la fois morale et religieuse. « Le plus souillé » préserve cette image plutôt que de la généraliser en « le plus abject ».
- source_word: μὴ μάτην μετεωρίζου
  choice: ne t’enfle pas d’orgueil en vain
  rationale: μετεωρίζου comporte l’image d’une élévation et, dans cette réprimande, celle d’une exaltation arrogante; μάτην en souligne la vanité et l’inutilité.
- source_word: φρυττόμενος
  choice: tout embrasé
  rationale: Le participe exprime l’idée d’être échauffé ou enflammé. « Tout embrasé » garde cette métaphore et s’intègre naturellement à la phrase.
- source_word: ἀδήλοις ἐλπίσιν
  choice: d’espérances incertaines
  rationale: ἀδήλοις désigne ce qui n’est pas manifeste ou assuré. « Incertaines » évite de préciser sans fondement qu’il s’agirait d’espérances trompeuses.
- source_word: οὐρανίους παῖδας
  choice: les enfants du ciel
  rationale: παῖδας peut désigner des enfants, des fils ou de jeunes serviteurs, tandis que οὐρανίους peut qualifier ces enfants de « célestes » ou marquer leur appartenance au ciel. Le texte retient « enfants du ciel » et signale l’autre lecture en note.
- source_word: ἐπαράμενος χεῖρας
  choice: après avoir levé les mains contre
  rationale: Le participe aoriste avec ἐπί et l’accusatif décrit un geste hostile dirigé contre eux. « Lever les mains contre » conserve l’image corporelle et exprime clairement l’agression; « après avoir » rend l’antériorité probable du participe sans rigidité excessive.
theological_decisions:
- issue: Sens de οὐρανίους dans οὐρανίους παῖδας
  choice: les enfants du ciel
  alternative: les enfants célestes
  rationale: La construction grecque permet d’entendre soit une appartenance au ciel, soit une qualité céleste. La traduction principale conserve la formulation d’appartenance sans expliciter « Dieu », absent du texte, et la note maintient l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et directement accusateur. Le rythme soutenu de l’apostrophe grecque est conservé, avec un vocabulaire compréhensible et une métaphore d’élévation rendue par « s’enfler d’orgueil ».
