  source_fidelity: Le sens de l’apostrophe, du superlatif de souillure, de l’exaltation vaine, des espérances incertaines et de l’hostilité contre les παῖδας est bien rendu. Toutefois, « après avoir levé » impose plus nettement une succession chronologique que ne l’exige le participe aoriste ἐπαράμενος, qui décrit ici le geste hostile comme circonstance associée à l’injonction.
  naturalness: Le français est soutenu, clair et naturel. « Ayant levé les mains contre » est idiomatique dans ce registre et reproduit plus sobrement la construction participiale grecque.
  terminology: « Impie », « le plus souillé », « s’enfler d’orgueil », « espérances incertaines » et « enfants du ciel » sont appropriés. La note conserve utilement l’ambiguïté de οὐρανίους entre une qualité céleste et l’idée d’appartenance au ciel.
