  text: And when this one also had died[a], they were torturing the fourth in the same way, abusing him.
translation:
  language: fr
  text: Lorsque celui-ci eut lui aussi trouvé la mort[a], ils torturaient le quatrième de la même manière, en le maltraitant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lorsque celui-ci eut lui aussi quitté la vie ». Le verbe grec peut servir d’expression respectueuse pour parler de la mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταλλάξαντος
  choice: fut mort
  rationale: Dans cette construction au génitif absolu et dans le contexte de la succession des martyrs, le verbe désigne idiomatiquement le fait de mourir. « Fut mort » est clair et garde l'antériorité par rapport au supplice du quatrième.
- source_word: τοῦτον δὲ
  choice: celui-ci … lui aussi
  rationale: « Celui-ci » reprend le frère précédent, tandis que « lui aussi » exprime la valeur additive de la combinaison avec καί.
- source_word: τὸν τέταρτον
  choice: le quatrième
  rationale: Le grec ne précise pas « frère » ; le contexte permet de conserver cette formulation elliptique sans perte de clarté.
- source_word: ὡσαύτως
  choice: de la même manière
  rationale: Cette expression indique la répétition du traitement infligé aux frères précédents.
- source_word: ἐβασάνιζον
  choice: ils se mirent à torturer
  rationale: Le verbe désigne ici une torture physique. Cette tournure française présente naturellement le début du traitement prolongé exprimé par l'imparfait grec dans la progression narrative.
- source_word: αἰκιζόμενοι
  choice: en lui faisant subir de mauvais traitements
  rationale: Le participe exprime les sévices et l'humiliation violente qui accompagnent la torture, sans se confondre entièrement avec elle. Le pronom objet est explicité d'après le contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve « le quatrième » sans ajouter « frère », reste proche de la structure grecque et évite un terme trop faible pour les sévices exprimés par αἰκιζόμενοι.
