  source_fidelity: La mort du frère précédent, exprimée par le génitif absolu μεταλλάξαντος, est correctement comprise. Toutefois, « ils se mirent à torturer » ajoute une valeur inchoative que l’imparfait ἐβασάνιζον n’exprime pas ; il convient de rendre l’action comme en cours ou répétée. Le participe αἰκιζόμενοι est bien rendu par l’idée de mauvais traitements concomitants.
  naturalness: « Fut mort » est grammatical mais raide en français moderne, et « en lui faisant subir de mauvais traitements » est lourd et redondant après « torturer ». « eut lui aussi trouvé la mort » et « en le maltraitant » sont plus fluides tout en conservant un registre digne.
  terminology: « Torturaient » rend βασανίζω dans ce contexte. « Maltraitant » conserve la nuance de sévices/violences de αἰκιζόμενοι sans la réduire à une simple souffrance ni ajouter de détail. « Le quatrième » préserve l’ellipse du grec.
