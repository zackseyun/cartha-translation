base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/030.yaml
  text: And while she was still finishing[a], the young man said, “What are you waiting for? I do not obey the king’s command, but I obey the command of the law that was given to our fathers through Moses.”
translation:
  language: fr
  text: 'Alors qu’elle achevait encore de parler, le jeune homme dit : « Qu’attendez-vous[a] ? Je n’obéis pas au commandement du roi, mais j’obéis au commandement de la Loi qui a été donnée à nos pères par l’intermédiaire de Moïse. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pourquoi attendez-vous ? »'
    reason: La question grecque elliptique peut porter soit sur ce qui est attendu, soit sur la raison du délai.
lexical_decisions:
- source_word: Ἔτι δὲ ταύτης καταληγούσης
  choice: Alors qu’elle achevait encore de parler
  rationale: Le génitif absolu exprime une action simultanée. καταλήγω évoque ici la fin de l’intervention de la mère ; « de parler » explicite naturellement en français ce qui est implicite en grec.
- source_word: ὁ νεανίας
  choice: le jeune homme
  rationale: νεανίας désigne un homme jeune ; cette formulation est naturelle en français moderne et convient au contexte narratif.
- source_word: Τίνα μένετε;
  choice: Qu’attendez-vous ?
  rationale: La question grecque est elliptique et constitue une interpellation directe des agents du roi. Cette tournure française en conserve la brièveté et la force.
- source_word: οὐχ ὑπακούω
  choice: Je n’obéis pas
  rationale: Le présent grec exprime ici un refus résolu. Le présent français préserve la forme et la portée de cette déclaration de principe.
- source_word: τοῦ προστάγματος τοῦ βασιλέως
  choice: au commandement du roi
  rationale: πρόσταγμα désigne un ordre ou un commandement. « Commandement » permet de maintenir le parallélisme rhétorique avec celui de la Loi.
- source_word: τοῦ δὲ προστάγματος ἀκούω τοῦ νόμου
  choice: mais j’obéis au commandement de la Loi
  rationale: ἀκούω avec le génitif peut signifier écouter, prêter attention ou obéir. Dans l’opposition avec ὑπακούω et en relation avec un commandement, « j’obéis » exprime clairement le sens pratique tout en gardant le contraste.
- source_word: τοῦ δοθέντος τοῖς πατράσιν ἡμῶν
  choice: qui a été donnée à nos pères
  rationale: Le participe se rapporte à « la Loi ». « Nos pères » conserve le terme ancestral masculin du grec et sa résonance liée à la transmission de l’alliance.
- source_word: διὰ Μωσῆ
  choice: par l’intermédiaire de Moïse
  rationale: διά avec le génitif marque la médiation. Cette expression française rend précisément le rôle médiateur de Moïse sans faire de lui la source ultime de la Loi.
theological_decisions:
- issue: Désignation ancestrale πατράσιν
  choice: nos pères
  alternative: nos ancêtres
  rationale: Le grec emploie explicitement le masculin pluriel et évoque la lignée ancestrale dans laquelle la Loi a été transmise. La traduction conserve cette formulation sans la neutraliser.
- issue: Rapport entre la Loi et Moïse
  choice: la Loi qui a été donnée à nos pères par l’intermédiaire de Moïse
  alternative: la Loi donnée à nos pères par Moïse
  rationale: « Par l’intermédiaire de » rend la médiation exprimée par διά avec le génitif et évite de présenter Moïse comme l’origine de la Loi, sans ajouter dans le texte l’identité de celui qui la donne.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme entre le commandement du roi et celui de la Loi est conservé, ainsi que la fermeté du présent « je n’obéis pas… j’obéis ».
