base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/008.yaml
  text: But he answered in the language of his fathers and said[a], “No.” Therefore this one also received the next torture, like the first.
translation:
  language: fr
  text: 'Mais il répondit dans la langue de ses pères[a] : « Non. » C’est pourquoi, lui aussi, subit le supplice suivant, comme le premier.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans sa langue ancestrale » ou « dans sa langue maternelle ». Le grec parle littéralement de la « langue des pères » ; l’expression peut désigner la langue ancestrale ou native.
    reason: Alternative lexicale pour une expression grecque qui associe langue, filiation et héritage ancestral.
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: répondit
  rationale: Le participe aoriste de ἀποκρίνομαι a ici son sens déponent courant, « répondre ». La tournure française coordonne naturellement ce participe avec le verbe introducteur de parole.
- source_word: τῇ πατρίῳ φωνῇ
  choice: dans la langue de ses pères
  rationale: πατρίος exprime ce qui vient des pères ou des ancêtres, tandis que φωνή peut désigner la langue parlée. Cette formulation conserve la dimension familiale et ancestrale sans préciser une langue que le grec ne nomme pas.
- source_word: προσεῖπεν
  choice: 'répondit … :'
  rationale: 'Le verbe introduit ici la parole directe. En français, traduire séparément ἀποκριθείς et προσεῖπεν par « ayant répondu, il dit » serait lourd; « répondit … : » restitue naturellement l’ensemble sans perte de sens.'
- source_word: Οὐχί
  choice: Non
  rationale: Cette négation constitue une réponse ferme. « Non » en garde la brièveté et la force sans ajouter d’intensification.
- source_word: διόπερ
  choice: C’est pourquoi
  rationale: La locution marque explicitement la conséquence du refus et relève d’un français moderne et digne.
- source_word: οὗτος
  choice: lui aussi
  rationale: Le démonstratif désigne le frère qui vient de répondre. Avec καί, « lui aussi » conserve l’insistance référentielle tout en évitant le peu naturel « celui-ci aussi ».
- source_word: τὴν ἑξῆς βάσανον
  choice: le supplice suivant
  rationale: βάσανος désigne ici une torture ou un supplice, et ἑξῆς ce qui vient ensuite dans une séquence. « Supplice suivant » convient au contexte narratif de torture.
- source_word: ὡς ὁ πρῶτος
  choice: comme le premier
  rationale: Cette formulation concise maintient la comparaison avec le premier frère sans explicitation absente du grec.
theological_decisions:
- issue: Portée identitaire de τῇ πατρίῳ φωνῇ
  choice: dans la langue de ses pères
  alternative: dans sa langue ancestrale / dans sa langue maternelle
  rationale: Le grec évoque une langue héritée des pères ou des ancêtres et souligne ainsi l’identité du martyr sous la persécution. La traduction retenue préserve cette nuance sans identifier la langue ni réduire l’expression à la seule notion moderne de langue maternelle.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe évite le calque lourd « ayant répondu… il dit »; le discours direct reste bref, et la violence du contexte est rendue sans euphémisme.
