base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/031.yaml
  text: But you[a], having become the inventor of every evil against the Hebrews, will certainly not escape the hands of God.
translation:
  language: fr
  text: Mais toi, qui es devenu l’inventeur[a] de tout mal contre les Hébreux, tu n’échapperas certainement pas aux mains de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le concepteur » ou « l’auteur » de tout mal.
    reason: Alternative lexicale pour εὑρετής, qui peut désigner celui qui invente, conçoit ou initie quelque chose.
lexical_decisions:
- source_word: σὺ δὲ
  choice: Mais toi
  rationale: δέ marque ici le contraste et le passage à une interpellation directe; « Mais toi » en conserve le ton accusateur.
- source_word: πάσης κακίας
  choice: de tout mal
  rationale: κακία désigne largement le mal ou la méchanceté. « Tout mal » maintient l’ampleur de l’accusation sans la limiter à des crimes précis.
- source_word: εὑρετὴς γενόμενος
  choice: qui es devenu l’inventeur
  rationale: εὑρετής désigne celui qui découvre, conçoit ou invente, tandis que γενόμενος exprime le fait de l’être devenu. Le terme volontairement fort présente le destinataire comme l’initiateur actif du mal.
- source_word: εἰς τοὺς Ἑβραίους
  choice: contre les Hébreux
  rationale: Dans ce contexte hostile, εἰς a naturellement le sens de « contre ». « Hébreux » conserve précisément la désignation ethnique du grec.
- source_word: οὐ μὴ διαφύγῃς
  choice: tu n’échapperas certainement pas
  rationale: La construction οὐ μή avec le subjonctif aoriste constitue une négation emphatique; « certainement pas » en restitue la force en français actuel.
- source_word: τὰς χεῖρας τοῦ θεοῦ
  choice: aux mains de Dieu
  rationale: La formulation conserve l’image concrète du grec et demeure idiomatique en français biblique moderne.
theological_decisions:
- issue: Expression anthropomorphique du jugement divin
  choice: aux mains de Dieu
  alternative: au pouvoir de Dieu / au jugement de Dieu
  rationale: Le grec emploie l’image concrète des mains. La conserver évite de réduire l’expression à une abstraction et maintient sa force théologique.
- issue: Désignation ethnique Ἑβραίους
  choice: les Hébreux
  alternative: les Juifs
  rationale: Le texte source dit précisément « Hébreux »; cette désignation est donc retenue plutôt que remplacée par un terme apparenté mais distinct.
translation_notes:
  register: Français moderne, direct et solennel. La syntaxe conserve l’interpellation accusatrice et la négation emphatique, tandis que l’expression « aux mains de Dieu » maintient l’imagerie biblique sans l’expliquer dans le corps du texte.
