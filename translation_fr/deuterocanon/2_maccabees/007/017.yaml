base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/017.yaml
  text: But do not think that our nation has been abandoned by God. But as for you[a], endure and see his great power, how it will torture you and your offspring.
translation:
  language: fr
  text: Mais ne pense pas que notre peuple ait été abandonné par Dieu. Quant à toi, tiens bon et vois comment sa grande puissance te torturera, toi et ta descendance.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comment il te torturera, toi et ta descendance », si Dieu est le sujet sous-entendu plutôt que « sa grande puissance ».'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ δόκει
  choice: ne pense pas
  rationale: L’impératif présent précédé de μή exprime naturellement une défense. « Ne pense pas » est direct et courant.
- source_word: τὸ γένος ἡμῶν
  choice: notre peuple
  rationale: Dans ce contexte collectif, γένος désigne le peuple juif. « Notre peuple » est plus naturel en français moderne que « notre race » et moins institutionnel que « notre nation ».
- source_word: ὑπὸ τοῦ θεοῦ καταλελεῖφθαι
  choice: ait été abandonné par Dieu
  rationale: Le parfait infinitif passif exprime l’état résultant d’un abandon supposé. Après « ne pense pas que », le subjonctif français convient.
- source_word: σὺ δὲ καρτέρει
  choice: Quant à toi, tiens bon
  rationale: Le pronom emphatique σὺ et δέ marquent le contraste. καρτέρει appelle la fermeté et l’endurance; « tiens bon » conserve aussi la vigueur provocatrice de l’adresse au tyran.
- source_word: θεώρει
  choice: contemple
  rationale: Le verbe signifie regarder ou observer attentivement. « Contemple » garde ici la force de l’impératif sans archaïsme excessif.
- source_word: τὸ μεγαλεῖον αὐτοῦ κράτος
  choice: sa grande puissance
  rationale: Cette formulation restitue directement la grandeur exprimée par μεγαλεῖον et la force de κράτος dans un français clair et digne.
- source_word: ὡς σὲ καὶ τὸ σπέρμα σου βασανιεῖ
  choice: elle te torturera, toi et ta descendance
  rationale: Le féminin « elle » reprend naturellement « puissance », sujet syntaxiquement plausible du futur singulier. βασανίζω garde ici son sens fort de torturer, et σπέρμα désigne la descendance.
theological_decisions:
- issue: Sujet de βασανιεῖ
  choice: La grande puissance de Dieu, reprise par « elle », est le sujet grammatical.
  alternative: 'Dieu lui-même est le sujet implicite : « il te torturera, toi et ta descendance ».'
  rationale: L’expression neutre singulière τὸ μεγαλεῖον αὐτοῦ κράτος peut servir de sujet au futur singulier. Le texte principal suit cette syntaxe de proximité, tandis que la note préserve la lecture personnelle également possible.
translation_notes:
  register: Français international moderne, direct et digne. « Tiens bon » rend l’endurance avec la pointe de défi du contexte; « contemple » maintient l’intensité de l’ordre. La répétition contrastive de δέ est rendue par « Mais » puis « Quant à toi » plutôt que par deux « mais » successifs.
