  text: For in this way you have not escaped the judgment of God[a], the all-powerful overseer.
translation:
  language: fr
  text: Car, de cette manière, tu n’as pas échappé au jugement de Dieu, le Tout-Puissant qui veille.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec transmis dans l’édition de Swete dit littéralement : « Car, de cette manière, tu as échappé au jugement de Dieu, le Tout-Puissant qui veille. » Le contexte favorise fortement le sens négatif : « tu n’as pas échappé ».'
    reason: textual_variant
lexical_decisions:
- source_word: οὕτω
  choice: de cette manière
  rationale: Renvoie à la conduite qui vient d’être décrite et conserve la valeur rétrospective de l’adverbe.
- source_word: γὰρ
  choice: car
  rationale: Maintient le lien explicatif avec la déclaration précédente.
- source_word: κρίσιν
  choice: jugement
  rationale: Exprime ici le jugement judiciaire de Dieu sans le réduire à la seule sentence ni à une notion générale de justice.
- source_word: ἐκπέφευγας
  choice: tu n’as pas échappé
  rationale: Le parfait indique un état présent résultant d’une tentative d’échapper. Bien que le grec transmis soit affirmatif, le contexte exige très probablement le sens négatif; cette difficulté textuelle est signalée en note.
- source_word: παντοκράτορος
  choice: le Tout-Puissant
  rationale: Titre divin français courant, digne et précis, qui exprime la souveraineté et la puissance sans limites.
- source_word: ἐπόπτου
  choice: qui voit tout
  rationale: Rend clairement l’idée de Dieu comme observateur auquel rien n’échappe. Cette formulation française est plus naturelle que « surveillant » ou « superviseur » dans ce contexte.
- source_word: θεοῦ
  choice: Dieu
  rationale: Rend directement le génitif dépendant de « jugement », avec les deux qualifications divines qui suivent.
theological_decisions:
- issue: Rendu des titres divins παντοκράτορος ἐπόπτου θεοῦ
  choice: Dieu, le Tout-Puissant qui voit tout
  alternative: le Dieu tout-puissant qui observe tout
  rationale: Le rendu conserve les deux attributs — puissance universelle et regard auquel rien n’échappe — sans introduire de formulation doctrinale propre à une tradition particulière.
- issue: Forme verbale affirmative transmise sans négation explicite
  choice: tu n’as pas échappé
  alternative: tu as échappé
  rationale: Le texte grec de Swete porte formellement l’affirmatif, mais celui-ci contredit fortement l’avertissement adressé au persécuteur dans le contexte immédiat. Le sens négatif est retenu dans le texte, tandis que la forme transmise est explicitement documentée en note afin de ne pas masquer la difficulté.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond à l’adresse directe au roi dans le contexte. La formulation « qui voit tout » communique naturellement la portée de ἐπόπτου et renforce l’idée qu’il est impossible de se soustraire au jugement divin.
