review_pass:
  verdict: revise
  source_fidelity: Le contraste entre la brève souffrance des frères et le châtiment futur du roi est bien rendu. Toutefois, « après avoir supporté maintenant » place νῦν de façon peu idiomatique en français, et « sont tombés sous l’alliance de Dieu pour une vie sans fin » demeure syntaxiquement opaque au point de ne pas communiquer de manière fiable le rapport condensé entre l’alliance, leur mort et la vie impérissable. Le verbe πεπτώκασιν désigne littéralement la chute, mais, dans ce contexte martyrial, peut être rendu par « sont morts », avec une note qui conserve l’image et l’ambiguïté de la construction grecque.
  naturalness: « Après avoir supporté maintenant » n’est pas naturel en français moderne. « Une vie sans fin » est compréhensible, mais « la vie éternelle » est l’expression française usuelle et reste fidèle à ἀενάου ζωῆς. La révision maintient un registre digne, direct et international.
  terminology: « Alliance de Dieu », « jugement de Dieu », « peines » et « arrogance » conviennent. « En vertu de l’alliance de Dieu » rend de façon idiomatique le cadre de l’alliance sans prétendre trancher la syntaxe inhabituelle de ὑπὸ διαθήκην θεοῦ. La note signale que le grec dit littéralement « sont tombés » et que le lien précis entre alliance et vie impérissable est condensé.
  issues:
  - severity: medium
    issue: Ordre et portée de « maintenant »
    rationale: νῦν est traduit, mais son insertion entre l’auxiliaire et le participe passé (« après avoir supporté maintenant ») est maladroite. Le français peut l’exprimer naturellement par « à présent » dans la proposition principale.
  - severity: medium
    issue: Construction française ambiguë et peu intelligible autour de l’alliance et de la vie
    rationale: « sont tombés sous l’alliance de Dieu pour une vie sans fin » calque la compacité grecque sans fournir une relation suffisamment lisible. Une formulation qui explicite prudemment le cadre de l’alliance est nécessaire, tandis que la note préserve l’ambiguïté source.
  - severity: low
    issue: Formulation de la note littérale
    rationale: « sous l’alliance de Dieu d’une vie sans fin » n’est pas du français naturel et peut donner l’impression d’une analyse grammaticale arrêtée. La note doit décrire la compacité sans imposer une seule construction.
  revised_text: Car nos frères, après avoir enduré une brève souffrance, sont à présent morts, en vertu de l’alliance de Dieu, pour la vie éternelle[a] ; mais toi, par le jugement de Dieu, tu subiras à juste titre les peines de ton arrogance.
  revised_footnotes:
