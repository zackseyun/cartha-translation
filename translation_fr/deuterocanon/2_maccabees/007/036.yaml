base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/036.yaml
  text: For our brothers[a], having now endured a brief pain, have fallen under God's covenant into everlasting life; but you, by the judgment of God, will justly bear the penalties of your arrogance.
translation:
  language: fr
  text: Car nos frères, après avoir enduré une brève souffrance, sont à présent morts, en vertu de l’alliance de Dieu, pour la vie éternelle[a] ; mais toi, par le jugement de Dieu, tu subiras à juste titre les peines de ton arrogance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est très resserré : littéralement, « sont tombés sous l’alliance de Dieu de vie impérissable ». « Sont tombés » évoque ici leur mort. Le lien exact entre l’alliance de Dieu et la vie impérissable peut aussi se comprendre comme « sous l’alliance de Dieu pour la vie éternelle ».'
    reason: alternative_reading
lexical_decisions:
- source_word: βραχὺν ἐπενέγκαντες πόνον
  choice: après avoir supporté maintenant une brève souffrance
  rationale: Le participe exprime le fait d’endurer ou de porter une souffrance. « Brève » maintient le contraste avec la vie sans fin, tandis que « maintenant » rend νῦν sans alourdir la phrase.
- source_word: ἀενάου ζωῆς
  choice: une vie sans fin
  rationale: ἀέναος désigne ce qui dure perpétuellement ou ne cesse pas. « Vie sans fin » est clair en français moderne et conserve cette valeur durative.
- source_word: ὑπὸ διαθήκην θεοῦ
  choice: sous l’alliance de Dieu
  rationale: Cette formulation conserve la préposition inhabituelle et le cadre explicite de l’alliance, sans les remplacer par une simple promesse.
- source_word: πεπτώκασιν
  choice: sont tombés
  rationale: Le parfait de πίπτω signifie littéralement « sont tombés ». Dans ce contexte de martyre, il évoque leur mort, mais l’image grecque est maintenue et expliquée en note.
- source_word: κρίσει
  choice: jugement
  rationale: « Jugement » rend directement le terme grec et convient au contexte judiciaire divin.
- source_word: δίκαια τὰ πρόστιμα
  choice: les justes peines
  rationale: πρόστιμα peut désigner des amendes ou des sanctions imposées ; ici, « peines » exprime naturellement le châtiment divin, et « justes » conserve δίκαια.
- source_word: ὑπερηφανίας
  choice: arrogance
  rationale: Le mot désigne l’orgueil hautain et dominateur du roi. « Arrogance » est actuel, accessible et moralement précis.
theological_decisions:
- issue: Le rapport entre la mort des frères, l’alliance de Dieu et la vie sans fin dans ἀενάου ζωῆς ὑπὸ διαθήκην θεοῦ πεπτώκασιν
  choice: Les frères sont « tombés sous l’alliance de Dieu pour une vie sans fin ».
  alternative: Les frères « sont morts sous l’alliance de Dieu, en vue d’une vie sans fin » ou « sont tombés sous l’alliance de Dieu d’une vie sans fin ».
  rationale: La syntaxe grecque est très resserrée et le rapport exact du génitif « de vie sans fin » avec « alliance » ou avec la destinée des martyrs demeure ambigu. Le texte principal reste lisible tout en conservant explicitement l’alliance et l’image de la chute ; la note signale l’autre construction possible sans imposer une précision doctrinale absente du grec.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le contraste rhétorique entre la brève souffrance des frères et les peines futures du roi, ainsi que le vocabulaire judiciaire et celui de l’alliance.
