    text: 'Le grec est très resserré : littéralement, « sont tombés sous l’alliance de Dieu de vie impérissable ». « Sont tombés » évoque ici leur mort. Le lien exact entre l’alliance de Dieu et la vie impérissable peut aussi se comprendre comme « sous l’alliance de Dieu pour la vie éternelle ».'
    reason: alternative_reading
