revisions:
- from: Car nos frères, après avoir supporté maintenant une brève souffrance, sont tombés sous l’alliance de Dieu pour une vie sans fin[a] ; mais toi, par le jugement de Dieu, tu subiras les justes peines de ton arrogance.
  to: Car nos frères, après avoir enduré une brève souffrance, sont à présent morts, en vertu de l’alliance de Dieu, pour la vie éternelle[a] ; mais toi, par le jugement de Dieu, tu subiras à juste titre les peines de ton arrogance.
  rationale: 'La révision corrige l’ordre peu naturel de « maintenant » et remplace un calque français difficilement intelligible par une formulation idiomatique. Elle ne présente pas « morts » comme une interprétation doctrinale : le sens contextuel de πεπτώκασιν est explicitement relié à l’image littérale de la chute dans la note. Celle-ci conserve aussi l’ambiguïté syntaxique de la séquence grecque relative à l’alliance et à la vie impérissable.'
