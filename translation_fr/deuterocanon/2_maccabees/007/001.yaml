base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/001.yaml
  text: It also happened that seven brothers, along with their mother, having been arrested, were being forced by the king to taste the unlawful flesh of swine, while being tortured with whips and cords.
translation:
  language: fr
  text: Il arriva aussi que sept frères, arrêtés avec leur mère, furent contraints par le roi à manger de la viande de porc interdite[a], tandis qu’ils étaient torturés à coups de fouets et de lanières[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à prendre part à la consommation de viande de porc interdite ». Le verbe grec peut littéralement signifier « toucher », mais il désigne ici le fait d’en prendre comme nourriture.
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « lanières » peut aussi désigner des cordes ou, plus littéralement, des nerfs employés comme instruments de torture.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνέβη δὲ καὶ
  choice: Il arriva aussi que
  rationale: Rend la transition narrative et la valeur additive de καί dans un français naturel et digne.
- source_word: ἑπτὰ ἀδελφοὺς μετὰ τῆς μητρὸς συλλημφθέντας
  choice: sept frères furent arrêtés avec leur mère
  rationale: « Frères » correspond au groupe masculin du récit; « furent arrêtés » exprime clairement la saisie coercitive, et « avec leur mère » reste naturel.
- source_word: ἀναγκάζεσθαι ὑπὸ τοῦ βασιλέως
  choice: Le roi voulut les forcer
  rationale: Reformulation active qui identifie sans ambiguïté l’agent et rend le processus coercitif exprimé par l’infinitif passif.
- source_word: ἀπὸ τῶν ἀθεμίτων υἱείων κρεῶν ἐφάπτεσθαι
  choice: à manger de la viande de porc interdite
  rationale: Dans ce contexte alimentaire, ἐφάπτεσθαι signifie prendre de cette viande comme nourriture. « Manger » est plus naturel en français que « toucher » et plus précis ici que « goûter »; « interdite » rend ἀθεμίτων sans introduire le terme distinct « impur ».
- source_word: μάστιξιν καὶ νευραῖς
  choice: à coups de fouet et de lanières
  rationale: « Fouet » rend μάστιξ et « lanières » rend naturellement νευραί, qui peut désigner des courroies ou liens, éventuellement faits de nerfs.
- source_word: αἰκιζομένους
  choice: les fit torturer
  rationale: Le contexte explicite des instruments justifie « torturer », qui restitue la violence du verbe plutôt qu’un faible « maltraiter ».
theological_decisions:
- issue: Formulation de l’interdit alimentaire juif
  choice: viande de porc interdite
  alternative: viande de porc impure
  rationale: Le grec emploie ἀθέμιτος, « interdit, contraire à la loi ou à ce qui est permis », et non un adjectif signifiant directement « impur ». La traduction conserve donc la force juridico-religieuse sans substituer une autre catégorie.
- issue: Portée de ἐφάπτεσθαι dans le contexte alimentaire
  choice: manger
  alternative: goûter; prendre part à; toucher
  rationale: 'Le sens littéral de contact ne doit pas masquer l’enjeu narratif: on veut contraindre les frères à consommer la viande. « Manger » exprime cet enjeu sans préciser une quantité.'
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe grecque très chargée est divisée en deux phrases pour assurer la clarté, sans atténuer la coercition ni la torture.
