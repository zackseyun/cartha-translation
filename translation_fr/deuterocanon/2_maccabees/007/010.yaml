  yaml_path: translation/deuterocanon/2_maccabees/007/010.yaml
  text: After him[a], the third was mocked, and when his tongue was demanded, he quickly held it out and courageously stretched out his hands.
translation:
  language: fr
  text: Après lui, le troisième fut tourné en dérision. Quand on lui réclama sa langue[a], il la tira aussitôt et tendit courageusement les mains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «quand ils lui réclamèrent sa langue». Le grec emploie un participe passif sans nommer ceux qui formulent cette exigence.
    reason: ambiguïté grammaticale concernant l’agent implicite
lexical_decisions:
- source_word: Μετὰ δὲ τοῦτον
  choice: Après lui
  rationale: La locution marque la succession des frères; «Après lui» est naturel en français et conserve la référence personnelle.
- source_word: ὁ τρίτος
  choice: le troisième
  rationale: L’adjectif ordinal est substantivé; le contexte permet de laisser «frère» sous-entendu.
- source_word: ἐνεπαίζετο
  choice: fut tourné en dérision
  rationale: Le verbe exprime les moqueries et l’humiliation, sans désigner à lui seul la torture rapportée par le contexte.
- source_word: τὴν γλῶσσαν αἰτηθεὶς
  choice: quand on lui réclama sa langue
  rationale: Le participe aoriste passif devient une proposition temporelle naturelle. «Réclama» restitue la demande coercitive du contexte, tandis que «on» respecte l’absence d’agent exprimé.
- source_word: ταχέως προέβαλλεν
  choice: il la tira aussitôt
  rationale: Avec la langue pour objet, προβάλλω signifie la faire sortir ou la présenter; «la tira» est idiomatique, et «aussitôt» exprime sa promptitude.
- source_word: τὰς χεῖρας εὐθαρσῶς προέτεινεν
  choice: tendit courageusement les mains
  rationale: La formulation conserve le mouvement volontaire des mains et la hardiesse confiante exprimée par εὐθαρσῶς.
