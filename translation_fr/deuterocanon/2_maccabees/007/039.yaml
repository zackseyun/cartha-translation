  text: But the king became furious and treated this one more cruelly than the others[a], taking the mockery bitterly.
translation:
  language: fr
  text: Mais le roi entra dans une violente colère et traita celui-ci plus cruellement que les autres, prenant très mal la raillerie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ressentant amèrement cette raillerie ». Le grec souligne la réaction amère du roi à la raillerie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκθύμως … γενόμενος
  choice: entra dans une violente colère
  rationale: Cette tournure rend de façon naturelle l’entrée dans un état de colère particulièrement intense, exprimée par l’adverbe et le participe grecs.
- source_word: τούτῳ παρὰ τοὺς ἄλλους χειρίστως ἀπήντησεν
  choice: traita celui-ci plus cruellement que les autres
  rationale: Le contexte montre qu’il s’agit de la manière dont le roi s’en prend au jeune homme; παρὰ τοὺς ἄλλους donne explicitement à χειρίστως une valeur comparative.
- source_word: πικρῶς φέρων
  choice: supportant très mal
  rationale: L’expression décrit la réaction profondément amère du roi. « Supportant très mal » est idiomatique en français moderne tout en conservant l’idée de φέρων.
- source_word: μυκτηρισμός
  choice: avoir été tourné en dérision
  rationale: Le nom désigne une raillerie méprisante dirigée contre le roi; la formulation verbale française s’intègre naturellement après « supporter très mal ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase conserve l’intensité de la colère du roi, la comparaison avec les autres frères et l’ambiguïté relative de sa réaction à la raillerie.
