    rationale: Le grec dit littéralement que le roi « portait/prenait amèrement la raillerie » (ἐπὶ τῷ μυκτηρισμῷ). Conserver « la raillerie » préserve plus directement le référent et évite d'ajouter la tournure passive « d'avoir été tourné en dérision ».
  - severity: low
    issue: La note « profondément irrité » atténue la nuance de πικρῶς.
    rationale: πικρῶς exprime ici une réaction amère, ressentie avec acrimonie ou très mal. « Irrité » recouvre surtout la colère, déjà rendue par ἐκθύμως.
