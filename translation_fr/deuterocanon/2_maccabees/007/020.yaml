base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/020.yaml
  text: But the mother was especially admirable and worthy of honorable memory[a]; seeing her seven sons perish in a single day[b], she bore it courageously because of her hopes in the Lord.
translation:
  language: fr
  text: Mais la mère était admirable au plus haut point et digne d’un souvenir honorable[a]. Voyant ses sept fils périr en un seul jour[b], elle le supportait avec courage à cause des espérances qu’elle plaçait dans le Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « digne d’un bon souvenir ».
    reason: lexical_alternative
  - marker: b
    text: Ou « mis à mort » ; le grec emploie un terme plus large, « périr », ici dans le contexte de leur exécution.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑπεραγόντως
  choice: au plus haut point
  rationale: L’adverbe intensifie fortement l’éloge; cette tournure française est naturelle et conserve cette emphase.
- source_word: ἡ μήτηρ ἀγαθὴ
  choice: la mère fut admirable
  rationale: Dans ce contexte élogieux, ἀγαθή qualifie l’excellence morale de la mère; « admirable » exprime mieux cette valeur que le littéral « bonne ».
- source_word: μνήμης ἀγαθῆς ἀξία
  choice: digne d’un souvenir honorable
  rationale: La formule désigne une personne qui mérite d’être gardée en mémoire favorablement, sans introduire la formule plus tardive « de bienheureuse mémoire ».
- source_word: ἀπολλυμένους
  choice: périr
  rationale: Le participe présent décrit les fils en train de mourir dans un contexte d’exécution; « périr » préserve la portée assez large du verbe grec.
- source_word: συνορῶσα
  choice: voyant
  rationale: Le participe indique qu’elle est témoin de l’ensemble de la scène; « voyant » conserve simplement la construction participiale.
- source_word: μιᾷ τοῦ καιροῦ ἡμέρᾳ
  choice: en un seul jour
  rationale: Cette formulation naturelle souligne que les sept morts se concentrent dans la même journée.
- source_word: εὐψύχως ἔφερεν
  choice: elle le supporta avec courage
  rationale: L’expression rend à la fois l’idée d’endurer l’épreuve et celle de le faire avec fermeté d’âme.
- source_word: διὰ τὰς ἐπὶ Κύριον ἐλπίδας
  choice: à cause des espérances qu’elle plaçait dans le Seigneur
  rationale: Le pluriel « espérances » respecte ἐλπίδας, tandis que « plaçait dans » rend leur orientation et leur appui sur le Seigneur.
- source_word: Κύριον
  choice: le Seigneur
  rationale: Cette traduction française habituelle désigne ici Dieu et convient naturellement après la préposition.
theological_decisions:
- issue: Rendu du pluriel ἐλπίδας
  choice: les espérances qu’elle plaçait dans le Seigneur
  alternative: son espérance dans le Seigneur
  rationale: Le pluriel grec est conservé afin de ne pas réduire les attentes fondées sur Dieu à une abstraction singulière ni préciser leur contenu au-delà du texte.
- issue: Nature de la mort des fils
  choice: périr
  alternative: être mis à mort
  rationale: Le contexte établit leur exécution, mais le verbe grec demeure plus large; le texte principal en conserve donc l’étendue sémantique, avec une note explicative.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’éloge appuyé de la mère, le mouvement participial du grec et le pluriel théologiquement ouvert d’« espérances », sans ajouter de précision confessionnelle.
