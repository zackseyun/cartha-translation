base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/033.yaml
  text: But if our living Lord has become angry for a little while for the sake of rebuke and discipline[b][a], he will again be reconciled with his own servants.
translation:
  language: fr
  text: Mais si, pour un court moment, notre Seigneur vivant s’est irrité en vue de la réprimande et de la discipline, il se réconciliera de nouveau[b] avec ses propres serviteurs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec doulois peut désigner des « esclaves » ou des « serviteurs », selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « il s’apaisera de nouveau envers ses propres serviteurs ».'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ
  choice: Mais si
  rationale: Rend la transition conditionnelle et son léger contraste avec le contexte précédent.
- source_word: χάριν ἐπιπλήξεως καὶ παιδίας
  choice: afin de nous reprendre et de nous corriger
  rationale: χάριν peut exprimer ici le but; les noms grecs désignent la réprimande et la discipline. La formulation verbale est naturelle en français et explicite les bénéficiaires implicites de l’action disciplinaire.
- source_word: ὁ ζῶν κύριος ἡμῶν
  choice: notre Seigneur vivant
  rationale: Conserve directement l’épithète ζῶν et le lien exprimé par ἡμῶν.
- source_word: βραχέως ἐπωργίσται
  choice: s’est irrité pour un peu de temps
  rationale: Le passé composé rend l’état résultant du parfait grec, tandis que la locution temporelle traduit βραχέως.
- source_word: καὶ πάλιν καταλλαγήσεται
  choice: il se réconciliera de nouveau
  rationale: Préserve la restauration relationnelle exprimée par le futur et la reprise signalée par πάλιν, sans préciser indûment son mécanisme.
- source_word: τοῖς ἑαυτοῦ δούλοις
  choice: avec ceux qui lui appartiennent
  rationale: Exprime l’appartenance soulignée par ἑαυτοῦ et la relation de dépendance portée par δοῦλοι, dans un français actuel et digne; une note conserve les équivalents lexicaux plus directs.
theological_decisions:
- issue: Portée de la réprimande et de la discipline divines
  choice: afin de nous reprendre et de nous corriger
  alternative: à cause de la réprimande et de la discipline
  rationale: Le contexte présente la colère temporaire du Seigneur comme disciplinaire. L’ajout de « nous » explicite la communauté visée sans attribuer au grec un mécanisme théologique supplémentaire.
- issue: Sens de καταλλαγήσεται appliqué à Dieu
  choice: il se réconciliera de nouveau avec
  alternative: il s’apaisera de nouveau envers
  rationale: La traduction retenue conserve l’image relationnelle et la tension d’un retour à la faveur après la colère; l’autre nuance possible est signalée en note.
- issue: Traduction de δοῦλοι dans la relation au Seigneur
  choice: ceux qui lui appartiennent
  alternative: ses serviteurs / ses esclaves
  rationale: Cette formulation met en avant l’appartenance marquée par ἑαυτοῦ sans effacer l’éventail sémantique de δοῦλοι, indiqué en note.
translation_notes:
  register: Français international moderne, fluide et digne. La formulation évite un calque lourd de « pour la réprimande et la discipline », tout en conservant le caractère temporaire de la colère divine et la restauration qui suit.
