revisions:
- from: Mais si notre Seigneur vivant s’est irrité pour un peu de temps afin de nous reprendre et de nous corriger, il se réconciliera de nouveau avec ceux qui lui appartiennent[a][b].
  to: Mais si, pour un court moment, notre Seigneur vivant s’est irrité en vue de la réprimande et de la discipline, il se réconciliera de nouveau[b] avec ses propres serviteurs[a].
  rationale: La révision restitue les deux noms abstraits du grec sans ajouter « nous », rend explicitement δοῦλοι par « serviteurs » tout en préservant « esclaves » comme alternative lexicale, et replace l’ancre de la note interprétative sur le verbe de réconciliation. Elle maintient l’ambiguïté légitime de καταλλαγήσεται dans la note.
