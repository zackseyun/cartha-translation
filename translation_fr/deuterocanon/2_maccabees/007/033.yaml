  source_fidelity: 'La traduction actuelle introduit deux éléments absents du grec : le pronom « nous » et l’idée explicite de correction exprimée par des verbes transitifs. Le texte grec parle plus sobrement de « réprimande et discipline ». De plus, « ceux qui lui appartiennent » atténue trop δοῦλοι, alors que le terme désigne directement ses serviteurs/esclaves.'
  naturalness: « Pour un court moment » et « en vue de la réprimande et de la discipline » sont naturels dans un registre biblique moderne et évitent le calque maladroit « pour un peu de temps ». « Ses propres serviteurs » est clair et digne en français international.
  terminology: « Seigneur vivant », « réprimande », « discipline » et « ses propres serviteurs » rendent respectivement ὁ ζῶν κύριος ἡμῶν, ἐπιπλήξεως, παιδίας et τοῖς ἑαυτοῦ δούλοις sans effacer les termes relationnels du grec. La note conserve l’alternative « esclaves ».
