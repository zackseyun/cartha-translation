base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/018.yaml
  text: After him they brought the sixth[a], and as he was about to die he said, “Do not be deceived; for we are suffering these things because of ourselves, having sinned against our own God[b]. Astonishing things have happened.”
translation:
  language: fr
  text: 'Après lui, on amena le sixième. Alors qu’il allait mourir, il dit : « Ne te fais pas davantage d’illusions[a]. Car si nous subissons tout cela, c’est par notre propre faute, parce que nous avons péché contre notre Dieu. Des choses dignes d’étonnement se sont produites[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne t’égare pas davantage » ou « Ne te laisse pas tromper ». L’expression grecque est concise et peut évoquer l’égarement, la tromperie ou une appréciation erronée.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Des choses dignes d’étonnement sont arrivées. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τοῦτον ἤγον τὸν ἕκτον
  choice: Après lui, on amena le sixième
  rationale: Μετὰ τοῦτον indique la succession. Le singulier collectif « on » rend naturellement le sujet indéterminé de ἤγον, tandis que « le sixième » évite d’ajouter « frère », absent du grec mais clair dans le contexte.
- source_word: μέλλον ἀποθνήσκειν
  choice: Au moment de mourir
  rationale: Cette formulation française exprime naturellement l’imminence portée par μέλλω suivi de l’infinitif.
- source_word: Μὴ πλανῶ μάλλον
  choice: Ne te fais pas davantage d’illusions
  rationale: πλανάω peut évoquer l’égarement, la tromperie ou l’erreur. Dans cette adresse au persécuteur, la tournure pronominale française exprime bien le fait de se méprendre, et « davantage » conserve la force de μάλλον sans trancher toute l’ambiguïté de l’expression comprimée.
- source_word: ἡμεῖς γὰρ διʼ ἑαυτοὺς ταῦτα πάσχομεν
  choice: Car si nous subissons tout cela, c’est par notre propre faute
  rationale: διά avec le pronom réfléchi indique ici la cause imputable aux locuteurs. « Par notre propre faute » rend clairement cette responsabilité et s’accorde avec le participe explicatif qui suit.
- source_word: ἁμαρτόντες εἰς τὸν ἑαυτῶν θεόν
  choice: parce que nous avons péché contre notre Dieu
  rationale: Le participe a une valeur causale dans ce contexte. « Pécher contre » rend l’offense dirigée vers Dieu, et « notre Dieu » conserve la relation exprimée par ἑαυτῶν sans alourdir la phrase.
- source_word: ἄξια θαυμασμοῦ γέγονε
  choice: Des choses dignes d’étonnement se sont produites
  rationale: Cette traduction conserve l’expression évaluative ἄξια θαυμασμοῦ et l’accompli de γέγονε. Aucun connecteur causal n’est ajouté, puisqu’il n’y en a pas dans le texte grec.
theological_decisions:
- issue: Cause de la souffrance des frères
  choice: Le locuteur attribue leur souffrance à leur propre faute, précisée comme un péché contre leur Dieu.
  alternative: Comprendre plus faiblement διʼ ἑαυτούς comme « à cause de nous-mêmes », sans accentuer explicitement la culpabilité.
  rationale: Le lien entre πάσχομεν et ἁμαρτόντες présente clairement leur péché comme cause de ce qu’ils subissent. La traduction garde cette affirmation théologique sans expliquer davantage la nature du jugement.
- issue: Lien entre le péché et les événements étonnants
  choice: Maintenir la dernière proposition sans connecteur explicite.
  alternative: Ajouter « c’est pourquoi » ou « par conséquent » pour en faire explicitement une conséquence.
  rationale: Le contexte permet une relation logique, mais le grec juxtapose la dernière proposition sans conjonction. Ne pas ajouter de connecteur préserve la tension et la concision de la source.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct reste ferme sans devenir familier. La segmentation en deux phrases allège la longue coordination grecque, tandis que les notes préservent les principales ambiguïtés lexicales.
