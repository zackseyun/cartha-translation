revisions:
- from: 'Mais, s’étant inclinée devant lui[a] tout en tournant le cruel tyran en dérision, elle parla ainsi dans sa langue ancestrale[b] : « Mon fils, aie pitié de moi. Je t’ai porté dans mon ventre pendant neuf mois, je t’ai allaité pendant trois ans, je t’ai élevé, je t’ai conduit jusqu’à l’âge que tu as aujourd’hui et j’ai pourvu à tes besoins. »'
  to: 'Mais, se penchant vers lui et tournant le cruel tyran en dérision, elle lui parla ainsi dans sa langue ancestrale : « Mon fils, aie pitié de moi, moi qui t’ai porté dans mon ventre pendant neuf mois, t’ai allaité pendant trois ans, t’ai élevé, t’ai conduit jusqu’à cet âge et ai pourvu à tes besoins. »'
  rationale: La correction remplace la fausse idée d’une inclination devant le tyran par le geste de proximité envers le fils, conforme à la syntaxe et au contexte. Elle supprime la note associée, devenue inexacte, et conserve l’intensité de la supplication maternelle ainsi que l’énumération des soins apportés.
