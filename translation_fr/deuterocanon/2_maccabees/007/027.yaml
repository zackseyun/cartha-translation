review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire du référent de αὐτῷ : dans la construction grecque, la mère se penche vers son fils et lui parle, tandis que le tyran est l’objet explicite de sa raillerie. Le texte ne dit donc pas qu’elle s’incline devant le tyran. La chaîne des participes et l’énumération des soins maternels sont conservées.'
  naturalness: « Se penchant vers lui » est naturel et précis en français actuel. « Jusqu’à cet âge » évite l’ajout interprétatif « que tu as aujourd’hui » tout en restant idiomatique. La subordonnée « moi qui… » restitue avec fluidité l’apposition participiale grecque.
  terminology: '« Cruel tyran », « langue ancestrale », « aie pitié de moi », « allaité », et « pourvu à tes besoins » rendent convenablement les termes clés sans imposer d’interprétation confessionnelle. Aucune note n’est nécessaire : le référent est clarifié par une traduction française fidèle plutôt que par une note spéculative.'
  issues:
  - severity: high
    issue: Le texte traduit προσκύψασα δὲ αὐτῷ par « s’étant inclinée devant lui » et la note identifie probablement « lui » au tyran.
    rationale: Le tyran est déjà introduit comme complément direct de χλενάσασα (« tournant le cruel tyran en dérision »), tandis que la suite rapporte les paroles adressées au fils. προσκύψασα αὐτῷ décrit le mouvement de la mère vers son fils, non une révérence envers le tyran. « Devant lui » déforme en outre le mouvement vers la personne en une posture devant elle.
  - severity: medium
    issue: La note a porte sur un référent erroné et maintient une ambiguïté que le français peut résoudre sans surcharge.
    rationale: La note affirme un sens contextuel peu probable et risque de faire comprendre une feinte de soumission absente du grec. La suppression de l’ancre et de la note résout le problème.
  - severity: low
    issue: « Jusqu’à l’âge que tu as aujourd’hui » explicite davantage que le grec.
    rationale: ταύτην renvoie simplement à « cet âge ». Cette formulation plus sobre préserve le déictique sans ajout.
