  yaml_path: translation/deuterocanon/2_maccabees/007/027.yaml
  text: 'But bending down to him[a], and mocking the cruel tyrant, she spoke in her native tongue as follows: “My son, have mercy on me, who carried you in the womb for nine months, nursed you for three years, raised you, brought you to this age[b], and cared for you.”'
translation:
  language: fr
  text: 'Mais, se penchant vers lui et tournant le cruel tyran en dérision, elle lui parla ainsi dans sa langue ancestrale : « Mon fils, aie pitié de moi, moi qui t’ai porté dans mon ventre pendant neuf mois, t’ai allaité pendant trois ans, t’ai élevé, t’ai conduit jusqu’à cet âge et ai pourvu à tes besoins. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκύψασα δὲ αὐτῷ
  choice: s’étant inclinée devant lui
  rationale: Le verbe exprime ici un geste d’inclination ou de révérence. Cette formulation conserve le geste concret et le pronom grec sans préciser au-delà du texte l’identité de son référent.
- source_word: χλενάσασα
  choice: tout en tournant … en dérision
  rationale: Le participe exprime une raillerie méprisante. « Tourner en dérision » rend clairement le défi de la mère dans un registre digne.
- source_word: τὸν ὠμὸν τύραννον
  choice: le cruel tyran
  rationale: ὠμός qualifie ici la brutalité impitoyable du tyran ; « cruel » est naturel et conserve la force morale du grec.
- source_word: τῇ πατρίᾳ φωνῇ
  choice: dans sa langue ancestrale
  rationale: L’expression désigne la langue héritée de ses pères ou de son peuple. « Langue ancestrale » maintient cette dimension familiale et ethnique.
- source_word: ἐλέησόν με
  choice: aie pitié de moi
  rationale: L’impératif constitue un appel maternel direct et chargé d’émotion. « Aie pitié de moi » est idiomatique tout en gardant sa pleine intensité.
- source_word: τὴν ἐν γαστρὶ περιενέγκασάν σε μῆνας ἐννέα
  choice: Je t’ai porté dans mon ventre pendant neuf mois
  rationale: La formulation rend concrètement la grossesse exprimée par le grec, dans un français moderne et naturel.
- source_word: θηλάσασάν σε ἔτη τρία
  choice: je t’ai allaité pendant trois ans
  rationale: θηλάζω désigne précisément l’allaitement au sein ; le français « allaiter » en donne le sens exact sans lourdeur.
- source_word: ἐκθρέψασάν σε
  choice: je t’ai élevé
  rationale: Le verbe englobe la nourriture et l’éducation qui permettent à l’enfant de grandir ; « élever » est ici la formulation française la plus naturelle.
- source_word: ἀγαγοῦσαν εἰς τὴν ἡλικίαν ταύτην
  choice: je t’ai conduit jusqu’à l’âge que tu as aujourd’hui
  rationale: Cette formulation explicite naturellement le déictique ταύτην tout en restant proche de l’image grecque d’avoir conduit l’enfant jusqu’à son âge présent.
- source_word: τροφοφορήσασαν
  choice: j’ai pourvu à tes besoins
  rationale: Le verbe évoque le fait d’entretenir et de soutenir quelqu’un en lui procurant ce qui lui est nécessaire. Cette traduction évite de répéter simplement « je t’ai élevé ».
theological_decisions:
- issue: Portée de l’appel ἐλέησόν με
  choice: aie pitié de moi
  alternative: prends pitié de moi ; montre-moi de la compassion
  rationale: Il s’agit d’une supplication maternelle, non d’une formule doctrinale technique. La traduction choisie en préserve la force et le caractère personnel.
- issue: Sens identitaire de τῇ πατρίᾳ φωνῇ
  choice: dans sa langue ancestrale
  alternative: dans sa langue maternelle ; dans la langue de ses pères
  rationale: Le grec met l’accent sur une langue reçue des ancêtres. Le choix conserve cette dimension sans identifier explicitement une langue que le verset ne nomme pas.
- issue: Référent de αὐτῷ
  choice: conserver le pronom « lui »
  alternative: devant le tyran ; vers son fils
  rationale: Le contexte favorise le tyran comme référent, mais le pronom grec ne le répète pas explicitement. Le texte principal conserve donc cette forme, tandis que la note signale le référent contextuel probable.
translation_notes:
  register: Français international actuel, narratif et digne. Le rythme de l’énumération maternelle est conservé par la répétition de « je t’ai », tandis que les termes restent accessibles à un lectorat ordinaire.
