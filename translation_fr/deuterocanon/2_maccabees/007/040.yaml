  yaml_path: translation/deuterocanon/2_maccabees/007/040.yaml
  text: And so this one also passed away in purity[b][a], having placed his full confidence in the Lord.
translation:
  language: fr
  text: Ainsi, lui aussi quitta cette vie dans la pureté[a], ayant mis toute sa confiance dans le Seigneur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mourut d’une manière pure », c’est-à-dire en demeurant pur ou sans souillure. L’adverbe grec a probablement une portée morale.
    reason: lexical_alternative
  - marker: b
    text: Ou « s’étant entièrement confié au Seigneur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὗτος οὖν
  choice: Ainsi, lui aussi
  rationale: Rend à la fois l’enchaînement exprimé par οὖν, l’addition marquée par καί et la mise en relief du personnage par οὗτος, dans un français naturel.
- source_word: καθαρῶς
  choice: dans la pureté
  rationale: L’adverbe décrit la manière ou l’état dans lequel il meurt et semble avoir ici une portée morale ou religieuse. « Dans la pureté » conserve cette nuance sans la réduire à la seule idée de noblesse.
- source_word: μετήλλαξεν
  choice: quitta cette vie
  rationale: Dans ce contexte, le verbe constitue une manière respectueuse de parler de la mort. Cette formulation française garde le caractère euphémique de l’expression grecque.
- source_word: παντελῶς
  choice: toute
  rationale: L’adverbe renforce la confiance de manière absolue. Son sens est rendu idiomatiquement par « toute sa confiance ».
- source_word: ἐπὶ τῷ κυρίῳ
  choice: dans le Seigneur
  rationale: Avec πεποιθώς, la préposition désigne celui sur qui repose la confiance. « Dans le Seigneur » est l’expression française naturelle correspondante.
- source_word: πεποιθώς
  choice: ayant mis sa confiance
  rationale: Le participe parfait présente une confiance établie qui demeure au moment de la mort. « Ayant mis sa confiance » exprime à la fois l’engagement accompli et son effet durable.
- source_word: κύριος
  choice: Seigneur
  rationale: Dans ce contexte juif grec, le terme désigne le souverain Seigneur; « Seigneur » en est la traduction française habituelle et appropriée.
theological_decisions:
- issue: Portée morale ou religieuse de καθαρῶς dans la description de la mort du martyr
  choice: La phrase indique qu’il est mort dans la pureté, fidèle et sans souillure morale.
  alternative: Comprendre seulement qu’il est mort noblement ou sans faute, sans connotation particulière de pureté.
  rationale: Le contexte immédiat est celui du martyre enduré par fidélité à la loi de Dieu. La traduction « dans la pureté » préserve cette résonance morale et religieuse sans préciser indûment s’il s’agit d’une catégorie rituelle.
translation_notes:
  register: Français international actuel, digne et accessible. « Quitta cette vie » conserve le ton respectueux du verbe grec; « dans la pureté » maintient sa nuance morale malgré une tournure légèrement marquée.
