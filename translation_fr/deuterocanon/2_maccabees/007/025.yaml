base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/025.yaml
  text: But since the young man was paying no attention at all, the king called the mother to him and urged her to become an adviser to the youth for his preservation.
translation:
  language: fr
  text: Mais comme le jeune homme ne prêtait aucune attention[a], le roi fit venir sa mère et l'exhorta à conseiller le jeune homme pour qu'il ait la vie sauve[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n'écoutait absolument pas ». Le grec souligne son refus total de prêter attention.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « en vue du salut » ou « de la délivrance ». Ici, le contexte immédiat indique qu'il s'agit d'échapper à la mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ... νεανίου
  choice: le jeune homme
  rationale: νεανίου désigne un jeune homme; cette formulation est naturelle en français moderne et convient au contexte.
- source_word: μηδαμῶς προσέχοντος
  choice: ne prêtait aucune attention
  rationale: Cette tournure restitue l'absence totale d'attention exprimée avec insistance par μηδαμῶς.
- source_word: προσκαλεσάμενος
  choice: fit venir
  rationale: Le participe indique que le roi appelle la mère auprès de lui; « fit venir » exprime naturellement l'autorité royale impliquée.
- source_word: παρῄνει
  choice: l'exhorta
  rationale: παραινέω signifie conseiller, engager ou exhorter; ici, la pression exercée par le roi justifie « exhorta ».
- source_word: γενέσθαι ... σύμβουλον
  choice: à conseiller
  rationale: La formulation verbale est plus idiomatique en français que « devenir conseillère », tout en conservant la fonction de conseil demandée à la mère.
- source_word: τοῦ μειρακίου
  choice: le jeune homme
  rationale: μειράκιον désigne un garçon ou un jeune homme. La répétition est claire en français; « son fils » ajouterait une précision que ce groupe nominal n'exprime pas lui-même.
- source_word: ἐπὶ σωτηρία
  choice: pour qu'il ait la vie sauve
  rationale: Dans le contexte immédiat, σωτηρία vise le fait d'échapper à la mort. Cette expression française naturelle préserve le sens concret sans imposer une portée spirituelle.
theological_decisions:
- issue: Portée de σωτηρία dans un récit de martyre
  choice: pour qu'il ait la vie sauve
  alternative: pour son salut / pour sa délivrance / pour sa sécurité
  rationale: Le roi cherche immédiatement à préserver la vie du jeune homme en obtenant son obéissance. La traduction retient donc le sens de sauvegarde physique, tout en signalant en note l'étendue sémantique possible du grec.
translation_notes:
  register: Français international moderne, narratif et digne. « Avoir la vie sauve » rend concrètement et naturellement l'enjeu immédiat; les notes conservent les principales possibilités lexicales du grec.
