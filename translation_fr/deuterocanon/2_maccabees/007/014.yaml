review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : le jeune homme, sur le point de mourir, oppose la mort infligée par des hommes à l’espérance d’être relevé par Dieu, puis refuse au persécuteur une « résurrection pour la vie ». La formulation révisée maintient le pluriel « espérances », l’agent divin et la portée qualifiée de εἰς ζωήν.'
  naturalness: '« Mourir de la main des hommes » est compréhensible, mais « mourir aux mains des hommes » est plus naturel en français international moderne. La juxtaposition « les espérances qui viennent de Dieu : être… » reste elliptique et quelque peu heurtée ; une formulation qui introduit explicitement le contenu de l’espérance rend la phrase plus fluide.'
  terminology: « Résurrection qui mène à la vie » rend correctement ἀνάστασις εἰς ζωήν sans trancher la question de savoir si toute résurrection est exclue. « Être ressuscité de nouveau par lui » conserve clairement la résurrection, la répétition exprimée par πάλιν et l’action de Dieu.
  issues:
  - severity: low
    issue: Formulation française de l’agent humain
    rationale: « De la main des hommes » est moins idiomatique que « aux mains des hommes » dans ce contexte de mise à mort.
  - severity: medium
    issue: Construction elliptique après les deux-points
    rationale: 'Dans « attendre les espérances qui viennent de Dieu : être de nouveau relevé par lui », l’infinitif n’est pas relié de façon suffisamment explicite aux « espérances ». Une légère restructuration améliore la lisibilité sans ajouter de contenu théologique.'
