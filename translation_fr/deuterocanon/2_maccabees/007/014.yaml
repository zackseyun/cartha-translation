base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/014.yaml
  text: 'And when he was about to die[a], he said this: “It is preferable, when dying at the hands of men, to await the hopes given by God—that one will be raised again by him[b]. But for you there will be no resurrection to life.”'
translation:
  language: fr
  text: 'Au moment de mourir, il déclara : « Il vaut mieux mourir aux mains des hommes et attendre les espérances que Dieu donne, celle d’être de nouveau ressuscité par lui. Mais pour toi, il n’y aura pas de résurrection qui mène à la vie.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « résurrection qui mène à la vie » peut désigner l’exclusion d’une résurrection bienheureuse, sans nier explicitement toute forme de résurrection.
    reason: alternative_reading
lexical_decisions:
- source_word: γενόμενος πρὸς τῷ τελευτᾷν
  choice: Au moment de mourir
  rationale: La tournure πρὸς τῷ avec l’infinitif exprime l’imminence. Cette formulation est naturelle en français et conserve la valeur temporelle.
- source_word: οὕτως ἔφη
  choice: il déclara
  rationale: Le verbe introduit directement les paroles qui suivent. « Déclara » convient au registre solennel sans alourdir le français par un déictique superflu.
- source_word: Αἱρετὸν
  choice: Il vaut mieux
  rationale: L’adjectif signifie ce qui est préférable ou digne d’être choisi. « Il vaut mieux » est idiomatique et rend clairement l’évaluation.
- source_word: μεταλλάσσοντας ἀπὸ ἀνθρώπων
  choice: mourir de la main des hommes
  rationale: Dans ce contexte, μεταλλάσσω désigne le départ de cette vie, tandis que ἀπὸ ἀνθρώπων indique l’intervention humaine. La formule française exprime naturellement une mort infligée par des hommes.
- source_word: τὰς ὑπὸ τοῦ θεοῦ προσδοκᾷν ἐλπίδας
  choice: attendre les espérances qui viennent de Dieu
  rationale: La traduction conserve le pluriel inhabituel ἐλπίδας et présente Dieu comme la source, sans ajouter l’idée explicite de promesse, absente du grec.
- source_word: πάλιν ἀναστήσεσθαι ὑπʼ αὐτοῦ
  choice: être de nouveau relevé par lui
  rationale: Le passif maintient Dieu comme agent de la résurrection. « Relevé » rend le verbe ἀνίστημι dans une langue courante tout en gardant l’image du relèvement.
- source_word: ἀνάστασις εἰς ζωὴν
  choice: résurrection qui mène à la vie
  rationale: Cette formulation préserve la qualification εἰς ζωήν et évite de faire dire au texte que toute forme de résurrection est catégoriquement exclue.
theological_decisions:
- issue: Espérance de résurrection du martyr et refus d’une résurrection à la vie pour le persécuteur
  choice: Dieu relèvera le martyr, tandis que le destinataire n’aura pas de résurrection qui mène à la vie.
  alternative: Le destinataire ne ressuscitera absolument pas, sous quelque forme que ce soit.
  rationale: 'Le complément εἰς ζωὴν qualifie explicitement ἀνάστασις. Le conserver laisse subsister la tension du texte : il peut s’agir du refus de la résurrection bienheureuse plutôt que de la négation de toute résurrection.'
translation_notes:
  register: Français moderne, digne et accessible. La phrase conserve le pluriel « les espérances », la causalité divine du relèvement et l’ambiguïté théologique de « résurrection qui mène à la vie ».
