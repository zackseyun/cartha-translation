revisions:
- from: 'Au moment de mourir, il déclara : « Il vaut mieux mourir de la main des hommes et attendre les espérances qui viennent de Dieu : être de nouveau relevé par lui. Mais pour toi, il n’y aura pas de résurrection qui mène à la vie.[a] »'
  to: 'Au moment de mourir, il déclara : « Il vaut mieux mourir aux mains des hommes et attendre les espérances que Dieu donne, celle d’être de nouveau ressuscité par lui. Mais pour toi, il n’y aura pas de résurrection qui mène à la vie.[a] »'
  rationale: La révision remplace une expression moins naturelle par « mourir aux mains des hommes » et relie explicitement l’infinitif « être de nouveau ressuscité » aux espérances attendues. Elle préserve le pluriel grec par « les espérances » tout en présentant la résurrection comme l’espérance explicitée dans la phrase. La restriction « qui mène à la vie » et sa note conservent l’ambiguïté théologique du grec.
