  text: so that the king himself and those with him were astonished at the young man's spirit, because he regarded the sufferings as nothing.
translation:
  language: fr
  text: Le roi lui-même et ceux qui étaient avec lui furent donc stupéfaits de l’esprit du jeune homme, car il ne faisait aucun cas de ses souffrances.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ψυχήν
  choice: force d’âme
  rationale: Dans ce contexte, le terme désigne la disposition intérieure et la fermeté du jeune homme plutôt que simplement son « âme » ou son « esprit ». « Force d’âme » exprime naturellement en français son courage résolu sans ajouter une notion étrangère au contexte.
- source_word: ἐνʼ οὐδενὶ ... ἐτίθετο
  choice: ne faisait aucun cas de
  rationale: Cette locution idiomatique rend le sens de « tenir pour rien, ne pas attacher d’importance à ».
- source_word: ἀλγηδόνας
  choice: souffrances
  rationale: Le pluriel grec peut désigner les douleurs ou souffrances endurées; « souffrances » convient au contexte des tortures et préserve la portée générale du terme.
- source_word: τοὺς σὺν αὐτῷ
  choice: ceux qui l’accompagnaient
  rationale: Formulation française naturelle pour les personnes qui se trouvaient avec le roi.
theological_decisions:
- issue: Sens de ψυχή
  choice: force d’âme
  alternative: âme / esprit
  rationale: Le contexte met l’accent sur la fermeté intérieure manifestée devant la souffrance. La traduction évite de transformer le passage en affirmation technique sur la constitution de la personne.
translation_notes:
  register: Français moderne, digne et fluide. La relation consécutive introduite par ὥστε est rendue par « donc », le verset formant en grec la conséquence de la scène précédente.
