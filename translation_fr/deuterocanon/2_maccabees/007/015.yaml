lexical_decisions:
- source_word: Ἐχομένως
  choice: Puis
  rationale: L’adverbe marque la succession immédiate des événements ; « Puis » est naturel et concis dans un récit.
- source_word: δὲ
  choice: non rendu séparément
  rationale: La progression portée par la particule est déjà exprimée naturellement en français par « Puis ».
- source_word: τὸν πέμπτον
  choice: le cinquième
  rationale: Le grec dit littéralement « le cinquième » et laisse « frère » sous-entendu par le contexte des sept frères.
- source_word: προσάγοντες
  choice: ils amenèrent
  rationale: Le participe indique qu’ils firent venir le cinquième auprès de ceux qui le suppliciaient ; la coordination française restitue naturellement l’enchaînement.
- source_word: ᾐκίζοντο
  choice: le torturèrent
  rationale: Le verbe désigne ici de violents sévices. Le passé simple convient à la progression narrative, tandis que le pronom objet explicite en français la personne visée.
