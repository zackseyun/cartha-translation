  text: So then, let this be enough about the mother’s compassion and the extraordinary tortures.
translation:
  language: fr
  text: Ainsi donc, que cela suffise au sujet de la tendresse maternelle[a] et des tortures extrêmes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « des sentiments profonds »; le grec emploie un pluriel et ne précise pas explicitement « maternelle », que le contexte immédiat permet de comprendre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ... περὶ τοὺς σπλαγχνισμούς
  choice: au sujet de la tendresse maternelle
  rationale: σπλαγχνισμοί désigne au sens figuré des sentiments profonds et tendres. Dans ce récit centré sur la mère, « tendresse maternelle » exprime naturellement cette affection sans employer le terme plus étroit de « compassion ».
- source_word: τὰς ὑπερβαλλούσας αἰκίας
  choice: des tortures extrêmes
  rationale: αἰκίαι désigne ici les sévices et tortures infligés aux martyrs; ὑπερβαλλούσας en souligne le caractère hors mesure. « Tortures extrêmes » est clair, concret et fidèle au contexte.
- source_word: ἐπὶ τοσούτου δεδηλώσθω
  choice: que cela suffise
  rationale: 'La combinaison de l’impératif parfait passif δεδηλώσθω et de ἐπὶ τοσούτου forme une conclusion rhétorique: que l’exposé s’arrête à ce point. « Que cela suffise » en rend idiomatiquement la fonction.'
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La tournure « Ainsi donc » conserve la transition conclusive de μὲν οὖν, tandis que « que cela suffise » évite une formulation excessivement littérale et peu naturelle.
