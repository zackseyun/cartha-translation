base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/019.yaml
  text: But as for you[a], do not suppose that you will be innocent, having attempted to fight against God.
translation:
  language: fr
  text: Mais toi, ne pense pas que tu seras innocent, toi qui as entrepris de combattre Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de t’opposer à Dieu ». Le verbe grec signifie littéralement « combattre contre Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: Mais toi
  rationale: Conserve à la fois l’opposition marquée par δέ et l’insistance du pronom σὺ, dans une adresse directe et naturelle en français.
- source_word: μὴ νομίσῃς
  choice: ne pense pas
  rationale: Rend simplement l’interdiction et l’idée d’une supposition erronée, sans alourdir la formulation.
- source_word: ἀθῷος
  choice: innocent
  rationale: Préserve le sens premier d’absence de culpabilité ou de responsabilité. « Impuni » exprimerait plutôt une conséquence possible et résoudrait trop vite l’ambiguïté.
- source_word: ἔσεσθαι
  choice: tu seras
  rationale: Rend le futur infinitif dépendant de νομίσῃς par un futur naturel en discours indirect français.
- source_word: θεομαχεῖν
  choice: combattre Dieu
  rationale: Le verbe composé désigne littéralement le fait de combattre contre Dieu. En français, « combattre Dieu » est plus idiomatique que « combattre contre Dieu » tout en gardant toute la force de l’accusation.
- source_word: ἐπιχειρήσας
  choice: toi qui as entrepris
  rationale: Rend l’aoriste participial et l’idée d’avoir entrepris l’action, tout en laissant perceptible son lien circonstanciel avec l’avertissement.
theological_decisions:
- issue: Portée de θεομαχεῖν
  choice: combattre Dieu
  alternative: s’opposer à Dieu
  rationale: La formulation retenue conserve l’image forte d’un combat dirigé contre Dieu lui-même, au lieu de l’atténuer en une opposition générale.
- issue: Portée de ἀθῷος
  choice: innocent
  alternative: impuni
  rationale: Le grec porte d’abord sur l’absence de culpabilité ou de responsabilité. Traduire par « impuni » ferait passer au premier plan le châtiment, qui est une implication contextuelle plutôt que le sens lexical certain.
translation_notes:
  register: Français international moderne, direct et digne. La reprise « toi… toi qui » maintient l’adresse emphatique du grec et intègre naturellement le participe, sans transformer explicitement sa valeur en cause ou en simple succession temporelle.
