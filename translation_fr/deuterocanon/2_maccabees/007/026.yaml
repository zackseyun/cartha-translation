  text: Après qu’il l’eut longuement pressée, elle accepta de persuader son fils.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλὰ
  choice: longuement
  rationale: Accusatif employé adverbialement avec παραινέσαντος, il exprime l’ampleur ou la persistance de l’insistance; « longuement » reste naturel en français sans préciser indûment le nombre des sollicitations.
- source_word: παραινέσαντος
  choice: qu’il l’eut… pressée
  rationale: Le génitif absolu décrit l’homme insistant auprès de la mère. Dans ce contexte coercitif, « presser » rend mieux la force de l’appel que « conseiller » ou « exhorter ».
- source_word: ἐπεδέξατο
  choice: elle accepta
  rationale: La forme moyenne exprime l’accueil d’une demande ou l’engagement à accomplir l’action indiquée par l’infinitif; « accepta » conserve cette nuance sans affirmer qu’elle était sincèrement d’accord.
- source_word: πεῖσειν
  choice: de persuader
  rationale: L’infinitif futur de πείθω indique ce qu’elle accepta d’entreprendre; « persuader » en est l’équivalent français direct.
- source_word: τὸν υἱόν
  choice: son fils
  rationale: L’article grec renvoie ici au fils de la mère; le possessif est nécessaire en français courant pour rendre clairement la relation.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. Le passé antérieur marque l’antériorité de l’insistance dans un registre écrit digne; « accepta » préserve la possibilité narrative que la mère feigne ensuite de coopérer, sans résoudre cette tension dans la traduction.
