base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/025.yaml
  text: But when this man arrived in Jerusalem and pretended to be peaceable[a], he held back until the holy day of the Sabbath; and taking the Jews off guard, he ordered those under his command to arm themselves.
translation:
  language: fr
  text: Mais quand cet homme arriva à Jérusalem, il feignit des intentions pacifiques. Il attendit jusqu’au saint jour du sabbat et, surprenant les Juifs occupés à célébrer ce jour[a], il ordonna à ceux qui étaient sous ses ordres de s’armer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est elliptique; on pourrait aussi traduire : « trouvant les Juifs en train de célébrer ce jour » ou « prenant les Juifs au dépourvu ».'
    reason: ambiguïté lexicale et syntaxique
lexical_decisions:
- source_word: παραγενόμενος
  choice: arriva
  rationale: Le participe indique son arrivée à Jérusalem dans le fil du récit; « arriva » est direct et naturel.
- source_word: τὸν εἰρηνικὸν ὑποκριθεὶς
  choice: il feignit des intentions pacifiques
  rationale: ὑποκρίνομαι exprime le fait de jouer un rôle ou de simuler, tandis que εἰρηνικός évoque une attitude pacifique; la formulation rend clairement la tromperie.
- source_word: ἐπέσχεν
  choice: Il attendit
  rationale: Dans ce contexte, le verbe désigne le fait de différer son action jusqu’au moment choisi.
- source_word: ἕως τῆς ἁγίας ἡμέρας τοῦ σαββάτου
  choice: jusqu’au saint jour du sabbat
  rationale: Cette traduction conserve explicitement la qualification ἁγίας et le nom du sabbat.
- source_word: λαβὼν ἄγοντας τοὺς Ἰουδαίους
  choice: surprenant les Juifs occupés à célébrer ce jour
  rationale: La construction grecque est elliptique. ἄγειν peut désigner la célébration ou l’observance d’un jour, tandis que λαβών peut évoquer le fait de trouver, prendre ou surprendre quelqu’un dans cette situation.
- source_word: τοῖς ὑφʼ ἑαυτὸν
  choice: à ceux qui étaient sous ses ordres
  rationale: L’expression désigne les hommes placés sous son autorité, ici dans un cadre militaire.
- source_word: ἐξοπλίαν παρήγγειλεν
  choice: il ordonna … de s’armer
  rationale: παραγγέλλω exprime un ordre, et ἐξοπλία renvoie à l’équipement militaire; « s’armer » est idiomatique et précis.
theological_decisions:
- issue: Caractère sacré du sabbat
  choice: le saint jour du sabbat
  alternative: le jour sacré du sabbat
  rationale: Le grec qualifie explicitement le jour de ἁγία, « saint ». Cette caractérisation culturelle et religieuse appartient au texte et doit être conservée sans développement doctrinal.
- issue: Vulnérabilité des Juifs pendant l’observance du sabbat
  choice: surprenant les Juifs occupés à célébrer ce jour
  alternative: trouvant les Juifs en train de célébrer ce jour
  rationale: Le grec est condensé et laisse ouverte la nuance exacte de λαβών. Le texte principal exprime l’effet tactique probable, tandis que la note signale l’ambiguïté sans imposer une explication doctrinale du comportement sabbatique.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases ont été légèrement réorganisées pour éviter une période trop lourde, tout en maintenant l’enchaînement temporel et la tromperie tactique du grec.
