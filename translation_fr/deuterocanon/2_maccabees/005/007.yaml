  text: He did not gain control of the government[a], but in the end, receiving shame from the plot[b], he again fled away to Ammanitis.
translation:
  language: fr
  text: Il ne parvint pas à obtenir le pouvoir[a] ; mais, ayant reçu la honte à l’issue de son complot, il s’enfuit de nouveau vers l’Ammanitide[b], en fugitif.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « ne réussit pas à s’emparer du pouvoir », « ne réussit pas à obtenir le gouvernement » ou « ne parvint pas à assurer son autorité ». Le verbe grec est rare dans cet emploi ; d’après le contexte, il échoua à obtenir le pouvoir qu’il recherchait.'
    reason: lexical_alternative
  - marker: b
    text: L’« Ammanitide » est la région des Ammonites.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρχῆς
  choice: du pouvoir
  rationale: Dans ce contexte politique, ἀρχή désigne l’autorité dirigeante que Jason cherchait à conquérir, et non un commencement.
- source_word: οὐκ ἐκρίτησεν
  choice: ne réussit pas à s’emparer
  rationale: Le verbe est rare et son emploi ici difficile ; le contexte indique que Jason échoua à obtenir le pouvoir convoité. Cette formulation française exprime clairement cette valeur probable.
- source_word: τὸ δὲ τέλος
  choice: mais, au terme
  rationale: τέλος peut désigner la fin ou l’issue. « Au terme » conserve l’idée d’aboutissement tout en s’intégrant naturellement à la phrase.
- source_word: τῆς ἐπιβουλῆς
  choice: de son complot
  rationale: ἐπιβουλή désigne un dessein hostile ou une intrigue. Le possessif, implicite dans le contexte narratif, identifie le complot mené par Jason.
- source_word: αἰσχύνην λαβών
  choice: il ne récolta que la honte
  rationale: La tournure grecque signifie littéralement « ayant reçu la honte ». « Ne récolta que la honte » restitue l’image d’un résultat obtenu tout en donnant une expression française naturelle.
- source_word: φυγὰς … ἀπῆλθεν
  choice: repartit en fugitif
  rationale: φυγάς souligne qu’il partit comme fugitif ou exilé. « Repartit en fugitif » préserve cette nuance, que le simple verbe « fuir » atténuerait.
- source_word: πάλιν
  choice: repartit
  rationale: Le préfixe re- exprime naturellement en français la répétition marquée par πάλιν.
- source_word: Ἀμμανῖτιν
  choice: l’Ammanitide
  rationale: Forme française du nom régional grec, désignant le territoire associé aux Ammonites.
