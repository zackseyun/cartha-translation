base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/005.yaml
  text: But when a false rumor arose that Antiochus had passed from life[a], Jason, taking no fewer than a thousand men, launched a sudden attack against the city. When those on the wall had been driven back, and at last the city was already being taken, Menelaus fled into the citadel.
translation:
  language: fr
  text: Mais une fausse rumeur se répandit, selon laquelle Antiochos avait quitté cette vie[a]. Jason rassembla alors au moins mille hommes et lança une attaque soudaine contre la ville. Ceux qui se trouvaient sur la muraille furent repoussés et, comme la ville était déjà en train d’être prise, Ménélas s’enfuit dans la citadelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avait changé de vie »; il s’agit d’une manière atténuée de dire qu’Antiochos était mort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλιάς ψευδοῦς
  choice: une fausse rumeur se répandit
  rationale: Dans ce contexte, λαλιά désigne une information qui circule. Cette formulation française naturelle restitue la naissance et la diffusion de la fausse nouvelle.
- source_word: μετηλλαχότος ... τὸν βίον
  choice: avait quitté cette vie
  rationale: Cette expression euphémique signifie qu’Antiochos était mort. « Avait quitté cette vie » conserve l’atténuation de l’idiome grec.
- source_word: παραλαβὼν
  choice: rassembla
  rationale: Le participe indique que Jason prit ou réunit avec lui une troupe. « Rassembla » convient naturellement à la constitution de cette force.
- source_word: οὐκ ἐλάττους τῶν χιλίων
  choice: au moins mille hommes
  rationale: La formule indique une limite inférieure et se rend clairement en français par « au moins ».
- source_word: ἐφνιδίως ... συνετελέσατο ἐπίθεσιν
  choice: lança une attaque soudaine
  rationale: La formulation rend à la fois l’exécution de l’assaut et son caractère brusque ou inattendu.
- source_word: τῶν ... ἐπὶ τῷ τείχει συνελασθέντων
  choice: Ceux qui se trouvaient sur la muraille furent repoussés
  rationale: Le grec ne les nomme pas explicitement comme défenseurs; la traduction conserve cette retenue tout en rendant le mouvement militaire de συνελασθέντων.
- source_word: καταλαμβανομένης τῆς πόλεως
  choice: la ville était désormais sur le point d’être prise
  rationale: Le génitif absolu présente la prise de la ville comme imminente ou déjà engagée, sans affirmer qu’elle était achevée.
- source_word: ἐφυγάδευεν
  choice: s’enfuit
  rationale: Le verbe exprime ici la fuite de Ménélas. Aucun complément de but comme « pour se réfugier » n’est ajouté.
- source_word: ἀκρόπολιν
  choice: citadelle
  rationale: Dans ce contexte, il s’agit de la partie haute fortifiée de la ville; « citadelle » est précis et accessible.
