base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/018.yaml
  text: But if we had not become involved in many sins[a], then, just as Heliodorus, who was sent by King Seleucus to inspect the treasury, was immediately scourged and turned back from his boldness when he came forward, so also would we have been struck down.
translation:
  language: fr
  text: Mais si nous ne nous étions pas retrouvés mêlés à de nombreux péchés[a], alors, comme Héliodore, que le roi Séleucos avait envoyé inspecter le trésor, fut, dès qu’il s’avança, aussitôt fouetté et mis en échec dans son audace, nous aussi, nous aurions été frappés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : «si nous ne nous étions pas trouvés mêlés à de nombreux péchés… celui-ci, s’étant avancé, fut aussitôt fouetté et mis en échec dans son audace». Le grec laisse sous-entendue la conclusion de la comparaison : ce qui est arrivé à Héliodore nous serait également arrivé.'
    reason: La syntaxe grecque laisse l’apodose implicite; la traduction l’explicite pour produire une phrase française complète.
lexical_decisions:
- source_word: συνέβην προενέχεσθαι
  choice: nous ne nous étions pas trouvés empêtrés
  rationale: La tournure rend la condition contraire aux faits portée par l’aoriste et conserve l’idée d’une implication profonde dans le péché, sans calquer lourdement le grec.
- source_word: πολλοῖς ἁμαρτήμασιν
  choice: dans de nombreux péchés
  rationale: Le datif désigne ici le domaine moral dans lequel le peuple s’est trouvé pris; «dans» est naturel en français.
- source_word: ἐπὶ τὴν ἐπίσκεψιν
  choice: pour inspecter
  rationale: La préposition avec l’accusatif exprime le but de la mission officielle.
- source_word: γαζοφυλακίου
  choice: la salle du trésor
  rationale: Le terme peut désigner le trésor ou la chambre où il est conservé. «Salle du trésor» garde la nuance spatiale sans ajouter explicitement «du Temple», fourni par le contexte.
- source_word: προαχθεὶς
  choice: dès qu’il s’avança
  rationale: Le participe est compris comme l’avancée d’Héliodore dans l’exécution de son projet. La possibilité formelle d’un sens passif demeure moins probable dans ce contexte.
- source_word: παραχρῆμα
  choice: aussitôt
  rationale: Ce choix exprime clairement l’immédiateté de la sanction.
- source_word: μαστιγωθεὶς
  choice: fut fouetté
  rationale: «Fouetté» désigne nettement le châtiment infligé à coups de fouet, dans un français actuel et digne.
- source_word: ἀνετράπη τοῦ θράσους
  choice: détourné de son audace
  rationale: La formulation conserve l’image d’un mouvement arrêté ou inversé ainsi que le caractère téméraire de son entreprise.
theological_decisions:
- issue: Apodose sous-entendue dans la comparaison conditionnelle
  choice: nous aurions nous aussi été frappés
  alternative: Laisser la phrase formellement inachevée après le sort d’Héliodore
  rationale: Le grec laisse la conséquence principale implicite, mais la comparaison indique que le même châtiment aurait atteint le peuple. L’explicitation française rend la phrase intelligible tout en signalant en note qu’elle est suppléée.
translation_notes:
  register: Français international moderne, narratif et digne. La structure conditionnelle et la tension entre les péchés du peuple et la sanction immédiate d’Héliodore sont conservées; la note distingue clairement le texte exprimé de la conséquence implicite.
