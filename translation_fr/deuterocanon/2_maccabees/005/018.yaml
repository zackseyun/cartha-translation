review_pass:
  verdict: revise
  source_fidelity: La condition contrefactuelle, l’implication dans de nombreux péchés, la mission d’Héliodore auprès du trésor, l’immédiateté du châtiment et l’apodose implicite sont bien rendues. La formulation révisée conserve explicitement le caractère suppléé de la conséquence dans la note. Pour προαχθείς, «dès qu’il s’avança» suit l’interprétation contextuelle retenue dans la piste d’audit anglaise, sans prétendre résoudre exhaustivement la valeur passive formelle du participe.
  naturalness: «Se trouver empêtré» est compréhensible, mais son registre est plus imagé et légèrement familier dans ce contexte. «Se retrouver mêlés à» est plus neutre et fluide. «Détourné de son audace» est peu idiomatique en français; «mis en échec dans son audace» rend naturellement l’idée d’une audace renversée ou brisée.
  terminology: «Héliodore», «Séleucos», «trésor», «péchés» et «audace» conviennent au français international moderne. «Trésor» est plus direct et plus usuel que «salle du trésor», tout en restant compatible avec γαζοφυλάκιον dans ce contexte.
  issues:
  - severity: medium
    issue: «détourné de son audace» est une formulation française maladroite pour ἀνετράπη τοῦ θράσους.
    rationale: Le grec évoque l’effondrement ou la mise en échec de son audace. En français, on détourne une personne d’un projet ou d’une voie, plutôt que de son audace.
  - severity: low
    issue: «nous ne nous étions pas trouvés empêtrés» a une coloration imagée et quelque peu familière.
    rationale: Le sens d’implication morale est présent, mais «nous nous étions retrouvés mêlés à» est plus neutre et soutient mieux le registre narratif digne du passage.
