revisions:
- from: Mais si nous ne nous étions pas trouvés empêtrés dans de nombreux péchés[a], alors, comme Héliodore, envoyé par le roi Séleucos pour inspecter la salle du trésor, qui, dès qu’il s’avança, fut aussitôt fouetté et détourné de son audace, nous aurions nous aussi été frappés.
  to: Mais si nous ne nous étions pas retrouvés mêlés à de nombreux péchés[a], alors, comme Héliodore, que le roi Séleucos avait envoyé inspecter le trésor, fut, dès qu’il s’avança, aussitôt fouetté et mis en échec dans son audace, nous aussi, nous aurions été frappés.
  rationale: La révision améliore surtout l’idiomaticité française de l’expression finale et atténue le caractère familier de «empêtrés», sans modifier la logique conditionnelle ni ajouter d’interprétation doctrinale. La note continue de signaler que «nous aurions été frappés» explicite une conséquence qui demeure implicite dans le grec.
