- from: Or, pendant quarante jours, il arriva que, dans presque toute la ville, on vit des cavaliers courir à travers les airs[a], vêtus de vêtements d’or et armés de lances, rangés en formations militaires[b],
  to: Pendant quarante jours, il arriva que, dans presque toute la ville, on vit[a] des cavaliers courir dans les airs, revêtus de vêtements dorés, armés de lances et disposés en formation[b],
  rationale: La révision rétablit un ancrage exact pour la note lexicale, améliore le français moderne et clarifie que la disposition en formation concerne les cavaliers. Elle maintient l'ambiguïté de φαίνεσθαι et ne surdétermine pas σπειρηδόν.
