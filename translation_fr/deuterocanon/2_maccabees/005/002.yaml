  verdict: revise
  source_fidelity: 'Le sens essentiel est bien rendu : l''événement dure quarante jours, concerne presque toute la ville et décrit des cavaliers visibles dans les airs, vêtus de vêtements dorés et munis de lances. Toutefois, « rangés en formations militaires » est grammaticalement ambigu après « lances » et surinterprète légèrement l''adverbe σπειρηδόν ; « disposés en formation » se rattache clairement aux cavaliers et conserve l''idée d''un ordre militaire sans préciser le type d''unité.'
  naturalness: La phrase est globalement claire, mais « Or » est inutilement littéraire en français international moderne, et « vêtus de vêtements d'or » est redondant et peut suggérer des habits faits d'or. « revêtus de vêtements dorés » est plus idiomatique. « Dans les airs » est également plus naturel que « à travers les airs » dans cette description.
  terminology: « Cavaliers » et « lances » conviennent. « Vêtements dorés » rend διαχρύσους sans prétendre déterminer s'il s'agit d'or massif, de dorure ou d'un éclat doré. La note sur φαίνεσθαι doit être ancrée à « vit », non à « airs », puisque c'est ce verbe qu'elle explique.
  issues:
