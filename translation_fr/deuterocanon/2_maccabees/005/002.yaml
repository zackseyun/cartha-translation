    issue: Ancrage de la note a
    rationale: La note explique φαίνεσθαι (« on vit » / « apparurent »), mais son appel est placé après « les airs », qui traduit διὰ τῶν ἀέρων. L'appel doit suivre « vit ».
  - severity: medium
    issue: « rangés en formations militaires »
    rationale: Après « armés de lances », le participe peut se lire comme qualifiant les lances, alors que σπειρηδόν décrit la disposition organisée des cavaliers. Le pluriel « formations » ajoute en outre une précision non exigée par le grec.
  - severity: low
    issue: Registre et formulation de « Or » / « vêtements d'or »
    rationale: « Or » est plus soutenu ou archaïsant que nécessaire, et « vêtements d'or » est à la fois redondant avec « vêtus » et potentiellement trop matériel pour διαχρύσους.
