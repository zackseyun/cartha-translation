  yaml_path: translation/deuterocanon/2_maccabees/005/002.yaml
  text: And throughout nearly the whole city[a], for forty days, it happened that horsemen were seen running through the air, wearing garments of gold and armed with lances drawn up in squadrons[b],
translation:
  language: fr
  text: Pendant quarante jours, il arriva que, dans presque toute la ville, on vit[a] des cavaliers courir dans les airs, revêtus de vêtements dorés, armés de lances et disposés en formation[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plutôt que « on vit » : « des cavaliers apparurent » ; le grec peut mettre l’accent soit sur leur apparition, soit sur le fait qu’ils étaient visibles.'
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque évoque une disposition militaire organisée ; on pourrait aussi traduire « en rangs » ou « par compagnies ».
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέβη
  choice: il arriva que
  rationale: Cette tournure narrative naturelle conserve la construction impersonnelle du grec.
- source_word: καθʼ ὅλην τὴν πόλιν σχεδὸν
  choice: dans presque toute la ville
  rationale: κατά avec l’accusatif exprime ici l’étendue à travers la ville, tandis que σχεδόν en limite légèrement la portée.
- source_word: ἐφʼ ἡμέρας τεσσεράκοντα
  choice: pendant quarante jours
  rationale: Rend directement et naturellement la durée exprimée en grec.
- source_word: φαίνεσθαι
  choice: on vit
  rationale: Dans ce contexte, le verbe désigne ce qui devint visible aux observateurs, tout en laissant en note l’autre nuance possible, « apparaître ».
- source_word: διὰ τῶν ἀέρων
  choice: à travers les airs
  rationale: Le pluriel français « les airs » restitue naturellement le pluriel grec et convient au caractère aérien de la scène.
- source_word: τρέχοντας ἱππεῖς
  choice: des cavaliers courir
  rationale: Cette formulation suit de près le grec, qui attribue le mouvement rapide aux cavaliers, sans ajouter explicitement l’idée d’une charge.
- source_word: διαχρύσους στολὰς ἔχοντας
  choice: vêtus de vêtements d’or
  rationale: La formulation conserve l’image éclatante du grec sans préciser indûment la matière ou la technique d’ornementation.
- source_word: λόγχας
  choice: lances
  rationale: « Lances » convient au contexte de cavaliers et correspond au sens possible de λόγχη.
- source_word: σπειρηδὸν
  choice: rangés en formations militaires
  rationale: L’adverbe évoque une disposition organisée en unités ou en rangs militaires, sans permettre d’identifier avec certitude un type précis d’unité.
- source_word: ἐξωπλισμένους
  choice: armés
  rationale: Rend avec concision l’idée d’hommes équipés d’armes.
