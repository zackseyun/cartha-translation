base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/017.yaml
  text: And Antiochus became arrogant in mind[a], not perceiving that the Master had been angered for a little while because of the sins of those dwelling in the city[c][b]; therefore there came to be disregard for the place.
translation:
  language: fr
  text: Antiochos s’enorgueillissait[a], sans comprendre que le Maître[b] s’était irrité pour peu de temps à cause des péchés des habitants de la ville. C’est pourquoi il y eut négligence à l’égard du lieu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec évoque littéralement une élévation ou une exaltation de la pensée; dans ce contexte, il décrit l’orgueil d’Antiochos.
    reason: lexical_alternative
  - marker: b
    text: « Maître » traduit le grec despotès, titre différent de kyrios (« Seigneur »).
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « il y eut un fait de passer outre au sujet du lieu » ou « le lieu fut délaissé ». Le terme grec peut désigner une négligence ou une mise de côté; le contexte l’associe à l’exposition temporaire du lieu saint à la profanation.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμετεωρίζετο τὴν διάνοιαν
  choice: s’enorgueillit dans son esprit
  rationale: L’expression grecque évoque littéralement une élévation de l’esprit et, dans ce contexte, l’exaltation orgueilleuse d’Antiochos. Cette formulation française en restitue naturellement le sens tout en maintenant la référence à sa disposition intérieure.
- source_word: οὐ συνορῶν
  choice: sans comprendre
  rationale: Le participe exprime l’incapacité d’Antiochos à discerner la véritable cause des événements; « comprendre » transmet clairement cette valeur cognitive en français courant.
- source_word: ἀπώργισται
  choice: s’était irrité
  rationale: Le parfait indique un état résultant d’une irritation antérieure. Le plus-que-parfait français convient à la relation temporelle et évite de surcharger l’anthropomorphisme.
- source_word: βραχέως
  choice: pour peu de temps
  rationale: L’adverbe limite dans le temps l’irritation du Maître, nuance théologiquement importante que la traduction exprime explicitement.
- source_word: ὁ δεσπότης
  choice: le Maître
  rationale: δεσπότης désigne le maître ou souverain détenteur d’autorité et se distingue de κύριος. « Le Maître » conserve cette distinction lexicale.
- source_word: τῶν τὴν πόλιν οἰκούντων
  choice: des habitants de la ville
  rationale: Formulation française naturelle et exacte pour le groupe participial désignant ceux qui habitent la ville.
- source_word: πάρορασις
  choice: laissé sans protection
  rationale: Le nom peut signifier le fait de fermer les yeux, de négliger ou de laisser de côté. Dans le contexte de la profanation du sanctuaire, cette formulation rend l’exposition temporaire du lieu sans préciser abusivement le mécanisme.
- source_word: περὶ τὸν τόπον
  choice: le lieu
  rationale: Le grec parle simplement du « lieu », compris en contexte comme le lieu saint. La traduction conserve cette désignation sans ajouter explicitement « sanctuaire ».
theological_decisions:
- issue: Titre divin δεσπότης
  choice: le Maître
  alternative: le Seigneur; le Souverain
  rationale: « Le Maître » maintient la différence entre δεσπότης et κύριος sans importer une distinction confessionnelle.
- issue: Responsabilité de la profanation temporaire du lieu
  choice: le lieu fut laissé sans protection
  alternative: il y eut négligence à l’égard du lieu; le lieu fut délaissé
  rationale: Le texte relie l’exposition du lieu aux péchés des habitants et à une irritation divine de courte durée. La formulation préserve cette tension sans suggérer une impuissance divine ni un abandon définitif.
- issue: Durée de l’irritation divine
  choice: pour peu de temps
  alternative: brièvement; pour un court moment
  rationale: La limitation temporelle présente dans βραχέως est conservée explicitement, sans tirer de conclusion doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure proche du mouvement argumentatif grec, tandis que les idiomes sont rendus naturellement. Les marqueurs de notes [a], [b] et [c] figurent tous dans le texte.
