  rationale: La révision remplace une paraphrase contextuelle (« laissé sans protection ») par une formulation qui correspond directement à πάρορασις tout en conservant l’ambiguïté de l’agent et du mécanisme. Elle rend également l’expression relative à la pensée d’Antiochos dans un français plus idiomatique et ajuste la note lexicale en conséquence. Les trois appels de note sont conservés et ancrés à leurs éléments respectifs.
