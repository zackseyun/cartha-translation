base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/011.yaml
  text: When the king was informed about what had happened[a], he concluded that Judea was in revolt; so, after setting out from Egypt, savage in spirit, he took the city by force of arms.
translation:
  language: fr
  text: Quand on eut exposé au roi ce qui s’était passé, il conclut que la Judée était en révolte. Il quitta donc l’Égypte, l’âme devenue féroce, et prit la ville par la force des armes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « prise par la lance », expression militaire grecque désignant la prise d’une ville au cours d’un assaut armé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Προεστώτων … τῷ Βασιλεῖ περὶ τῶν γεγονότων
  choice: Quand on eut exposé au roi ce qui s’était passé
  rationale: La construction absolue indique que les événements furent portés à la connaissance du roi. Cette formulation française reste naturelle sans préciser qui fit le rapport.
- source_word: διέλαβεν
  choice: il conclut
  rationale: Le verbe exprime ici un jugement tiré des renseignements reçus, plutôt qu’une simple perception.
- source_word: ἀποστατεῖν τὴν Ἰουδαίαν
  choice: que la Judée était en révolte
  rationale: Le contexte est celui d’une insurrection contre l’autorité royale, non d’une apostasie religieuse.
- source_word: ἀναζεύξας ἐξ Αἰγύπτου
  choice: Il quitta donc l’Égypte
  rationale: Le participe désigne le fait de lever le camp ou de se mettre en route. « Quitta » rend clairement le mouvement depuis l’Égypte sans alourdir la phrase.
- source_word: θηριωμένος τῇ ψυχῇ
  choice: l’âme devenue féroce
  rationale: La formulation conserve l’image d’un état intérieur rendu semblable à celui d’une bête sauvage, tout en restant digne et intelligible.
- source_word: ἔλαβεν τὴν μὲν πόλιν
  choice: prit la ville
  rationale: Il s’agit de l’emploi militaire courant de λαμβάνω, exprimé de façon concise en français.
- source_word: δοριαλώτον
  choice: par la force des armes
  rationale: L’adjectif signifie littéralement que la ville fut « prise par la lance »; la formulation choisie restitue naturellement l’idée d’une conquête par assaut armé.
