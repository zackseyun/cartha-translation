base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/016.yaml
  text: and with his polluted hands taking the sacred vessels[b][a], and with profane hands dragging away the things that had been dedicated by many kings for the increase and glory and honor of the place.
translation:
  language: fr
  text: De ses mains souillées, il prit les objets sacrés et, de ses mains profanes, emporta en les traînant les offrandes que de nombreux rois avaient consacrées[a] pour l’accroissement, la gloire et l’honneur du lieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « que de nombreux rois avaient installées » : le participe grec signifie plus littéralement « dressées » ou « mises en place » ; il désigne probablement ici des dons royaux déposés dans le temple comme offrandes.'
    reason: lexical_alternative
  - marker: b
    text: « Le lieu » est une manière révérencielle de désigner le temple.
    reason: cultural_note
lexical_decisions:
- source_word: μιαραῖς
  choice: souillées
  rationale: Le terme exprime une souillure rituelle et morale. « Souillées » conserve cette portée cultuelle tout en restant naturel en français.
- source_word: ἱερὰ σκεύη
  choice: objets sacrés
  rationale: La formule désigne les objets affectés au service du sanctuaire. « Objets sacrés » est clair et moins restrictif que « vases sacrés ».
- source_word: ἀνασταθέντα
  choice: avaient consacrées
  rationale: Dans ce contexte, il s’agit vraisemblablement de dons royaux déposés dans le temple comme offrandes. La note maintient le sens plus littéral possible, « avaient dressées » ou « installées ».
- source_word: πρὸς αὔξησιν καὶ δόξαν τοῦ τόπου καὶ τιμήν
  choice: pour accroître la splendeur, la gloire et l’honneur du lieu
  rationale: Cette formulation rend la finalité exprimée par πρός. « Splendeur » donne ici à αὔξησις le sens d’un embellissement ou rehaussement matériel du sanctuaire sans effacer les substantifs coordonnés.
- source_word: βεβήλοις
  choice: profanes
  rationale: « Profanes » marque précisément l’opposition cultuelle entre les mains du pillard et les objets sacrés.
- source_word: συνσύρων
  choice: emporta en les traînant
  rationale: La traduction conserve à la fois l’idée d’enlèvement et celle d’un traitement violent et indigne exprimée par le verbe.
- source_word: τοῦ τόπου
  choice: du lieu
  rationale: Le grec dit littéralement « du lieu », désignation révérencielle du temple; la note explicite cette référence sans la remplacer dans le texte.
theological_decisions:
- issue: Opposition cultuelle entre le sacré et le profane
  choice: Conserver « mains souillées », « objets sacrés » et « mains profanes »
  alternative: Employer des termes plus généraux comme « mains impures », « objets du temple » ou « mains impies »
  rationale: La répétition des mains et le contraste entre ἱερά et βέβηλος structurent l’accusation de sacrilège; ils doivent demeurer perceptibles.
- issue: Désignation du sanctuaire par τοῦ τόπου
  choice: Maintenir « du lieu » avec une note explicative
  alternative: Traduire directement « du temple »
  rationale: Cette solution préserve la formulation révérencielle et l’implicite du grec tout en assurant l’intelligibilité.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le parallélisme accusateur des deux mentions des mains et le vocabulaire cultuel du sacré, de la souillure et du profane.
