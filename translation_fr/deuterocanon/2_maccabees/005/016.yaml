  source_fidelity: 'La structure et les contrastes cultuels du grec sont bien rendus : les mains souillées/profanes s’opposent aux objets sacrés, et l’enlèvement violent est conservé. Toutefois, « splendeur » ne rend pas précisément αὔξησις (« accroissement », « augmentation », par extension rehaussement) et tend à faire double emploi avec δόξα (« gloire »).'
  naturalness: La phrase est claire et d’un registre approprié. Le déplacement de « de ses mains souillées » en tête de proposition rend plus nettement la valeur instrumentale du datif grec et rétablit le parallélisme avec « de ses mains profanes ».
