revisions:
- from: Il prit de ses mains souillées les objets sacrés et, de ses mains profanes, emporta en les traînant les offrandes que de nombreux rois avaient consacrées[a] pour accroître la splendeur, la gloire et l’honneur du lieu[b].
  to: De ses mains souillées, il prit les objets sacrés et, de ses mains profanes, emporta en les traînant les offrandes que de nombreux rois avaient consacrées[a] pour l’accroissement, la gloire et l’honneur du lieu[b].
  rationale: La révision remplace « splendeur » par « accroissement » afin de distinguer αὔξησις de « gloire » (δόξα) et de préserver la coordination du grec. Elle ajuste également l’ordre des mots pour exprimer plus clairement l’instrumentalité des « mains » et maintenir le parallélisme de la phrase.
