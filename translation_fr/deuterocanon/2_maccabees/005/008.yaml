base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/008.yaml
  text: 'So he met the end of a miserable ruin: confined with Aretas[a], the ruler of the Arabs, fleeing from city to city, pursued by all, hated as an apostate from the laws and abhorred as the destroyer of his homeland and fellow citizens[b], he was driven into Egypt.'
translation:
  language: fr
  text: 'Il connut donc une fin désastreuse : confiné chez Arétas, le souverain des Arabes[a], fuyant de ville en ville, poursuivi par tous, haï comme un apostat des lois et abhorré comme le bourreau de sa patrie et de ses concitoyens, il fut chassé[b] en Égypte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le tyran des Arabes ». Le grec peut désigner un tyran, mais aussi, plus neutralement ici, un souverain.
    reason: lexical_alternative
  - marker: b
    text: Ou « il fut jeté en Égypte ». Le verbe grec est très énergique et évoque une expulsion violente.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέρας οὖν κακῆς καταστροφῆς ἔτυχεν
  choice: Il connut donc la fin d’une ruine lamentable
  rationale: « Connut… la fin » rend naturellement l’idiome πέρας… ἔτυχεν, tandis que « ruine lamentable » exprime le désastre et la misère impliqués par κακῆς καταστροφῆς.
- source_word: ἐγκλεισθεὶς πρὸς Ἀρέταν
  choice: enfermé auprès d’Arétas
  rationale: « Enfermé » conserve l’idée d’enfermement ou de confinement sans préciser une incarcération formelle. « Auprès d’Arétas » maintient l’ouverture de πρός, qui peut indiquer la proximité, le séjour chez lui ou le fait d’être en son pouvoir.
- source_word: τὸν τῶν Ἀράβων τύραννον
  choice: le souverain des Arabes
  rationale: À l’époque hellénistique, τύραννος peut désigner un détenteur du pouvoir sans porter nécessairement le jugement moral que suggère aujourd’hui « tyran ». « Souverain » convient au registre historique.
- source_word: πόλιν ἐκ πόλεως φεύγων
  choice: fuyant de ville en ville
  rationale: Cette expression idiomatique française restitue le mouvement répété d’une ville à l’autre.
- source_word: διωκόμενος ὑπὸ πάντων
  choice: poursuivi par tous
  rationale: Le contexte indique une poursuite concrète; « poursuivi » reste plus exact et moins spécialisé que « persécuté ».
- source_word: στυγούμενος ὡς τῶν νόμων ἀποστάτης
  choice: haï comme un apostat des Lois
  rationale: « Apostat » préserve la forte accusation de rupture d’allégeance portée par ἀποστάτης. La majuscule à « Lois » signale ici l’ensemble normatif religieux propre au peuple, plutôt que des lois quelconques.
- source_word: βδελυσσόμενος ὡς πατρίδος καὶ πολιτῶν δήμιος
  choice: abhorré comme le bourreau de sa patrie et de ses concitoyens
  rationale: βδελύσσομαι exprime une profonde répulsion, bien rendue par « abhorré ». « Bourreau » conserve l’image concrète et violente de δήμιος, applicable à celui qui met à mort ou ravage.
- source_word: εἰς Αἴγυπτον ἐξεβράσθη
  choice: il fut rejeté en Égypte
  rationale: « Rejeté » garde la force d’expulsion de ἐκβράζω, littéralement susceptible d’évoquer quelque chose que l’on jette ou vomit au-dehors, sans produire en français une image excessivement étrange.
theological_decisions:
- issue: Caractérisation morale d’Arétas par τύραννον
  choice: souverain
  alternative: tyran
  rationale: Le mot grec peut servir de désignation politique relativement neutre. Le choix évite d’ajouter à Arétas une condamnation morale que le récit dirige principalement contre le personnage en fuite; l’autre sens demeure signalé en note.
- issue: Force religieuse et juridique de τῶν νόμων ἀποστάτης
  choice: un apostat des Lois
  alternative: un déserteur des Lois
  rationale: « Apostat » garde la gravité d’une rupture avec l’ordre religieux et légal ancestral sans expliciter davantage la nature théologique de cette rupture.
- issue: Métaphore violente de δήμιος
  choice: le bourreau de sa patrie et de ses concitoyens
  alternative: le destructeur de sa patrie et de ses concitoyens
  rationale: « Bourreau » préserve la dimension personnelle et meurtrière du terme grec; « destructeur » serait plus large, mais atténuerait son caractère concret.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue construction participiale du grec est conservée pour maintenir l’accumulation qui souligne la déchéance du personnage. « Arétas » suit la forme française traditionnelle; « concitoyens » rend précisément πολιτῶν.
