review_pass:
  verdict: revise
  source_fidelity: Le sens global est fidèlement rendu. Une légère révision améliore toutefois l’idiome français de πέρας ... κακῆς καταστροφῆς et rend plus nettement la force expulsive de ἐξεβράσθη. La note b actuelle ajoute « hors du pays », précision qui n’est pas exprimée par le grec.
  naturalness: « Il connut la fin d’une ruine lamentable » est compréhensible mais peu idiomatique en français moderne. « Il connut donc une fin désastreuse » est plus naturel et conserve l’idée d’un aboutissement calamiteux. « Confiné chez Arétas » est plus naturel que « enfermé auprès d’Arétas » tout en évitant de spécifier une incarcération officielle.
  terminology: « Arétas », « souverain », « apostat », « bourreau », « patrie » et « concitoyens » conviennent au registre et au grec. Le pluriel et la minuscule de « lois » reflètent directement τῶν νόμων sans imposer une interprétation typographique confessionnelle.
