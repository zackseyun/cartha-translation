  yaml_path: translation/deuterocanon/2_maccabees/005/019.yaml
  text: But the Lord did not choose the nation for the sake of the place, but the place for the sake of the nation.
translation:
  language: fr
  text: Mais ce n’est pas à cause du lieu que le Seigneur a choisi la nation ; c’est à cause de la nation qu’il a choisi le lieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλʼ
  choice: Mais
  rationale: Introduit nettement l’opposition avec l’affirmation précédente et convient au français courant et soutenu.
- source_word: διὰ
  choice: à cause de
  rationale: Avec l’accusatif, exprime ici le motif déterminant. La répétition préserve la construction antithétique sans ajouter une nuance absente du grec.
- source_word: τόπον
  choice: le lieu
  rationale: Le grec emploie le terme général « lieu ». Le contexte évoque Jérusalem et le sanctuaire, mais la traduction évite de préciser davantage que le texte.
- source_word: ἔθνος
  choice: la nation
  rationale: Désigne ici Israël comme collectivité ethnoreligieuse. « Nation » conserve le parallélisme lexical et la portée collective du grec.
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: Rendu français conventionnel et naturel du titre divin κύριος avec l’article.
- source_word: ἐξελέξατο
  choice: a choisi
  rationale: Rend simplement l’aoriste moyen de ἐκλέγομαι. Le verbe est répété en français dans les deux membres pour rendre explicite l’ellipse grecque et préserver l’équilibre rhétorique.
theological_decisions:
- issue: Rapport entre le lieu sacré et la nation choisie
  choice: Le choix du lieu par le Seigneur est présenté comme motivé par son choix de la nation, et non l’inverse.
  alternative: Le lieu aurait été choisi indépendamment, puis aurait conféré à la nation son statut particulier.
  rationale: 'L’antithèse grecque est explicite : non pas la nation à cause du lieu, mais le lieu à cause de la nation. La traduction conserve cette priorité sans développer ses implications théologiques.'
translation_notes:
  register: Français international moderne, digne et accessible. La structure en deux propositions parallèles conserve la force sentencieuse de l’original. Le point-virgule rend l’opposition plus lisible sans l’alourdir.
