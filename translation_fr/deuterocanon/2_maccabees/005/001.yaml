translation:
  language: fr
  text: Vers cette époque, Antiochos lança sa deuxième expédition en Égypte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « entreprit sa deuxième campagne en Égypte ». Le verbe grec, à la voix moyenne, peut évoquer le fait de se mettre en route ou d’envoyer une expédition ; ἔφοδος peut signifier « attaque », « campagne » ou « expédition ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ τὸν καιρὸν τοῦτον
  choice: Vers cette époque
  rationale: La tournure περί avec l’accusatif a ici un sens temporel approximatif. « Vers cette époque » est naturel en français moderne et conserve cette approximation.
- source_word: τὴν δευτέραν ἔφοδον
  choice: sa deuxième expédition
  rationale: ἔφοδος peut désigner une attaque, une campagne ou une expédition. Dans ce récit militaire, « expédition » préserve l’ampleur de l’entreprise sans la réduire à un assaut ponctuel. Le possessif explicite naturellement le lien avec Antiochos.
- source_word: ὁ Ἀντίοχος
  choice: Antiochos
  rationale: Le nom grec est translittéré selon l’usage français courant pour ce personnage.
- source_word: εἰς Αἴγυπτον
  choice: en Égypte
  rationale: Dans ce contexte de déplacement militaire, « en Égypte » rend naturellement la direction exprimée par εἰς en français.
- source_word: ἐστέλατο
  choice: lança
  rationale: Le moyen de στέλλω peut exprimer le fait d’envoyer, de mettre en route ou d’entreprendre. Avec « expédition » comme complément, « lança » donne un français idiomatique tout en marquant l’initiative d’Antiochos.
