base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/024.yaml
  text: But he sent Apollonius[a], the chief polluter, with an army of twenty-two thousand, commanding him to slaughter all those in their prime and to sell the women and the younger ones.
translation:
  language: fr
  text: Mais il envoya Apollonios le Mysarque, avec une armée de vingt-deux mille hommes, en lui ordonnant de massacrer tous ceux qui étaient dans la force de l’âge et de vendre[a] les femmes et les plus jeunes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus explicitement d’après le contexte : « vendre comme esclaves ». Le grec dit simplement « vendre », bien que l’asservissement soit probablement sous-entendu.'
    reason: Précision lexicale et contextuelle concernant πωλεῖν.
lexical_decisions:
- source_word: ἔπεμψεν
  choice: il envoya
  rationale: Rend directement l’aoriste de πέμπω dans un français naturel et digne.
- source_word: μυσάρχην
  choice: le chef de la souillure
  rationale: Ce terme rare et péjoratif désigne Apollonios par son rôle dans la profanation ou la souillure. Cette formulation conserve l’image et l’insulte du grec sans en faire un titre administratif.
- source_word: μετὰ στρατεύματος, δισμυρίους δὲ τοῖς δισχιλίοις
  choice: avec une armée de vingt-deux mille soldats
  rationale: στράτευμα désigne une force militaire, et la tournure numérique additionne vingt mille et deux mille. « Soldats » explicite naturellement en français les personnes dénombrées au sein de l’armée.
- source_word: προστάξας
  choice: en lui ordonnant
  rationale: Le participe exprime l’ordre donné à Apollonios; le pronom clarifie son destinataire sans modifier le sens.
- source_word: τοὺς ἐν ἡλικίᾳ πάντας
  choice: tous ceux qui étaient dans la force de l’âge
  rationale: La formule vise ceux qui ont atteint leur plein développement ou sont dans la vigueur de l’âge, sans définir précisément une majorité légale.
- source_word: κατασφάξαι
  choice: massacrer
  rationale: Le verbe composé exprime une mise à mort violente et collective, plus forte que le simple « tuer ».
- source_word: τὰς δὲ γυναῖκας
  choice: les femmes
  rationale: Dans cette opposition entre catégories de victimes, γυναῖκες désigne les femmes en général plutôt que seulement les épouses.
- source_word: τοὺς νεωτέρους
  choice: les plus jeunes
  rationale: Le comparatif est conservé sans réduire indûment le groupe aux seuls enfants ou aux seuls adolescents.
- source_word: πωλεῖν
  choice: vendre
  rationale: Le grec dit littéralement « vendre ». Le contexte de guerre implique très probablement la vente comme esclaves, mais cette conséquence n’est pas explicitement formulée par le verbe.
theological_decisions:
- issue: Faut-il expliciter que les captifs seraient vendus comme esclaves ?
  choice: vendre
  alternative: vendre comme esclaves
  rationale: Le contexte historique rend l’asservissement très probable, mais πωλεῖν signifie simplement « vendre ». Le texte principal préserve cette formulation, tandis qu’une note indique l’implication contextuelle.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formulation volontairement marquée « chef de la souillure » conserve le caractère rare et injurieux de μυσάρχης. « Dans la force de l’âge » préserve l’indétermination du groupe visé, et « les plus jeunes » maintient la valeur comparative du grec.
