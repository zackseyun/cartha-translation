  verdict: revise
  source_fidelity: La désignation μυσάρχην ne doit pas être comprise comme « chef de la souillure ». Il s’agit très probablement de « Mysarque », un titre lié à la Mysie (ou à son gouvernement), appliqué à Apollonios. Le reste du verset rend fidèlement l’ordre de tuer les personnes dans la force de l’âge et de vendre les femmes et les plus jeunes. « Vendre » conserve à juste titre le degré d’explicitation du grec.
  naturalness: Le texte est globalement naturel et d’un registre approprié. « Apollonios le Mysarque » est une appellation historique inhabituelle en français courant, mais c’est précisément pourquoi une note brève est préférable à une paraphrase interprétative. « Une armée de vingt-deux mille hommes » est une formulation française plus idiomatique que « vingt-deux mille soldats » tout en restant fidèle au dénombrement de la force.
  terminology: « Mysarque » restitue le titre/ethnique grec sans lui attribuer indûment le sens péjoratif de « profanateur ». La note sur vendre comme esclaves demeure utile, à condition de présenter l’asservissement comme une implication contextuelle plutôt que comme un élément exprimé par πωλεῖν.
