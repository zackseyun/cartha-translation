  - severity: low
    issue: « vingt-deux mille soldats » ajoute une désignation individuelle absente du grec.
    rationale: Le grec donne une force militaire de vingt-deux mille. « Une armée de vingt-deux mille hommes » est plus idiomatique en français et évite de préciser davantage la catégorie des personnes comptées.
