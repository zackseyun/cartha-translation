  verdict: revise
  source_fidelity: Le grec relie l’apparition au bien attendu (ἐπ᾽ ἀγαθῷ γενέσθαι) sous un verbe d’appréciation/attente. « Pensait que ... était de bon augure » rend possible une interprétation du phénomène comme signe, mais fige la construction et resserre indûment le sens sur l’augure. « Espéraient que ... serait favorable » conserve mieux l’orientation prospective et bénéfique, sans décider si le bien relève du sens du signe ou de son issue.
  naturalness: « C’est pourquoi tous espéraient que cette apparition serait favorable » est sobre, naturel en français moderne et convient au registre narratif. Il évite la formulation un peu plus interprétative « de bon augure ».
  terminology: « Apparition » rend naturellement ἐπιφάνεια dans son sens de phénomène visible et ne lui confère pas un sens théologique technique. « Favorable » rend ἐπ᾽ ἀγαθῷ de façon ouverte; la note préserve explicitement la nuance résultative possible de γενέσθαι.
  issues:
  - severity: medium
    issue: La traduction principale « pensaient que cette apparition était de bon augure » présente le phénomène comme un augure déjà établi.
    rationale: Le grec permet de comprendre que l’on attendait ou souhaitait un bien lié à l’apparition; il ne requiert pas de limiter ce bien à sa valeur d’augure. La tournure française au passé « était » atténue en outre la portée prospective que le contexte et l’infinitif peuvent exprimer.
