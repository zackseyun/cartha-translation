base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/021.yaml
  text: So Antiochus[a], after carrying off from the temple eighteen hundred talents, quickly departed for Antioch, thinking in his arrogance to make the land navigable and the sea passable on foot[b], because of the exaltation of his heart.
translation:
  language: fr
  text: Antiochos emporta donc du Temple mille huit cents talents, puis partit rapidement pour Antioche. Dans son arrogance, il s’imaginait pouvoir rendre la terre navigable et la mer praticable à pied[a], tant son cœur était enflé d’orgueil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’image est volontairement hyperbolique : Antiochos s’imaginait capable de renverser l’ordre naturel, en faisant de la terre un lieu où naviguer et de la mer un chemin où marcher.'
    reason: cultural_note
  - marker: b
    text: L’expression grecque évoque littéralement l’élévation du cœur, image d’une assurance hautaine et démesurée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀκτακόσια πρὸς τοῖς χιλίοις
  choice: mille huit cents
  rationale: L’expression signifie littéralement « huit cents en plus des mille » ; la formulation française donne clairement le total exact.
- source_word: ἀπενεγκάμενος ἐκ τοῦ ἱεροῦ
  choice: emporta du Temple
  rationale: Le participe exprime l’action d’emporter les biens du Temple. « Temple » rend ici ἱερόν sans limiter indûment le sens au sanctuaire intérieur.
- source_word: θᾶττον εἰς τὴν Ἀντιόχειαν ἐχωρίσθη
  choice: partit rapidement pour Antioche
  rationale: La tournure restitue le départ précipité vers Antioche dans un français narratif naturel.
- source_word: ἀπὸ τῆς ὑπερηφανίας
  choice: Dans son arrogance
  rationale: Le groupe indique que son imagination démesurée procède de son orgueil ; « arrogance » conserve nettement la condamnation portée par le texte.
- source_word: τὴν μὲν γῆν πλωτὴν καὶ τὸ πέλαγος πορευτὸν θέσθαι
  choice: pouvoir rendre la terre navigable et la mer praticable à pied
  rationale: La traduction préserve l’inversion hyperbolique de l’ordre naturel. « À pied » explicite le contraste impliqué entre naviguer sur la terre et se déplacer sur la mer.
- source_word: διὰ τὸν μετεωρισμὸν τῆς καρδίας
  choice: tant son cœur était enflé d’orgueil
  rationale: Cette formulation française naturelle conserve l’image biblique du cœur élevé tout en rendant explicite sa valeur péjorative de suffisance hautaine.
theological_decisions:
- issue: Idiotisme anthropologique τῆς καρδίας
  choice: son cœur
  alternative: son esprit / son être intérieur
  rationale: Le cœur demeure le siège biblique des dispositions, des intentions et de l’orgueil ; le conserver évite de réduire l’expression à une faculté purement intellectuelle.
- issue: Redoublement des expressions d’orgueil
  choice: 'conserver les deux expressions distinctes : « dans son arrogance » et « son cœur était enflé d’orgueil »'
  alternative: fusionner les deux en une seule mention de son orgueil
  rationale: Le grec présente à la fois ὑπερηφανία et μετεωρισμός τῆς καρδίας. Les maintenir préserve l’insistance rhétorique et la caractérisation morale sans les confondre.
translation_notes:
  register: Français moderne international, narratif et digne. « Temple » prend une majuscule pour désigner le Temple de Jérusalem. La syntaxe a été divisée en deux phrases pour rester claire, tout en conservant le lien causal et l’hyperbole du grec.
