base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/023.yaml
  text: and in Gerizim[a], Andronicus; and besides these, Menelaus surpassed the others in wickedness toward the citizens[b], having a hateful disposition toward the Jewish citizens.
translation:
  language: fr
  text: et à Garizim[a], Andronique. En outre, Ménélas surpassait les autres par sa perversité envers les citoyens[b], ayant une attitude hostile à l’égard des citoyens juifs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans le territoire de Garizim ». La préposition grecque peut désigner le lieu ou le ressort concerné.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dépassait les autres dans les pires choses » ; on peut aussi comprendre : « était pire que les autres ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δὲ Γαριζεὶν
  choice: et à Garizim
  rationale: Avec un nom de lieu, ἐν peut ici désigner le lieu ou le ressort confié à Andronikos. « À Garizim » est naturel en français tout en laissant ouverte la nuance précise.
- source_word: Ἀνδρόνικον
  choice: Andronikos
  rationale: Translittération française transparente du nom grec Ἀνδρόνικος, plutôt que reprise de la forme latinisée.
- source_word: πρὸς δὲ τούτοις
  choice: En plus de ceux-là
  rationale: 'Rend clairement la valeur additive de la locution : Ménélas vient s’ajouter aux responsables déjà nommés.'
- source_word: Μενέλαον
  choice: Ménélas
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom grec.
- source_word: χείριστα τῶν ἄλλων ὑπερήρτετο
  choice: surpassait tous les autres en méchanceté
  rationale: Conserve à la fois l’idée qu’il dépassait les autres et la forte condamnation morale exprimée par χείριστα.
- source_word: τοῖς πολίταις
  choice: envers les citoyens
  rationale: Le datif désigne les personnes visées ou lésées par sa conduite. « Envers » s’accorde naturellement avec « méchanceté ».
- source_word: ἀπεχθῆ ... διάθεσιν
  choice: une disposition haineuse
  rationale: διάθεσις désigne une disposition ou attitude durable, tandis que ἀπεχθής exprime l’hostilité et le caractère odieux de celle-ci.
- source_word: πρὸς τοὺς πολίτας Ἰουδαίους
  choice: à l’égard des citoyens juifs
  rationale: La traduction maintient explicitement le terme civique πολίτας ainsi que l’identification Ἰουδαίους, sans les réduire au simple mot « Juifs ».
- source_word: ἔχων
  choice: il nourrissait
  rationale: Le participe décrit l’attitude persistante de Ménélas. Une proposition coordonnée par deux-points produit un français naturel sans effacer ce lien circonstanciel.
theological_decisions:
- issue: Faut-il généraliser πολίταις / πολίτας en « peuple » ou conserver la notion civique ?
  choice: Conserver « citoyens » dans les deux occurrences.
  alternative: « peuple », « compatriotes » ou simplement « Juifs »
  rationale: La répétition grecque de πολίτης souligne l’appartenance à la communauté civique. La conserver maintient la dimension politique et sociale de l’accusation.
- issue: Force à donner à χείριστα τῶν ἄλλων ὑπερήρτετο
  choice: « surpassait tous les autres en méchanceté »
  alternative: « était pire que les autres » ou « dépassait les autres en leur faisant du mal »
  rationale: La formulation retenue garde le mouvement comparatif du verbe et le jugement moral vigoureux de χείριστα sans préciser arbitrairement les actes commis.
translation_notes:
  register: Français international actuel, digne et lisible. Le verset étant la continuation syntaxique du précédent, l’ouverture en minuscule et la formulation elliptique « et à Garizim, Andronikos » en préservent la structure. Le deux-points rend naturellement le participe grec sans transformer son rapport logique en causalité explicite.
