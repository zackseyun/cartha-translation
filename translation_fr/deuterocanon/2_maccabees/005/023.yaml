revisions:
- from: 'et à Garizim[a], Andronikos. En plus de ceux-là, Ménélas surpassait tous les autres en méchanceté envers les citoyens[b] : il nourrissait une disposition haineuse à l’égard des citoyens juifs.'
  to: et à Garizim[a], Andronique. En outre, Ménélas surpassait les autres par sa perversité envers les citoyens[b], ayant une attitude hostile à l’égard des citoyens juifs.
  rationale: La révision adopte la forme française courante « Andronique », évite l’intensification non requise « tous », et remplace une note géographique maladroite par une alternative exacte. Elle conserve l’ellipse syntaxique initiale, le vocabulaire civique répété et la force négative de l’accusation, tout en donnant au participe grec une forme française fluide qui ne crée pas de causalité supplémentaire.
