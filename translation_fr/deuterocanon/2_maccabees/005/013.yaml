  yaml_path: translation/deuterocanon/2_maccabees/005/013.yaml
  text: There was a killing of young and old, a destruction of men and women and children, and slaughters of virgins and infants.
translation:
  language: fr
  text: On mettait à mort jeunes et vieux[a] ; hommes, femmes et enfants étaient exterminés ; vierges[b] et tout-petits étaient massacrés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jeunes hommes et anciens », si ces termes d’âge sont pris dans un sens plus précis ; le contexte favorise toutefois le contraste général entre jeunes et vieux.
    reason: lexical_alternative
  - marker: b
    text: Le terme grec désigne plus précisément de jeunes femmes non mariées et vierges ; « jeunes femmes » est possible, mais moins précis.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνετο
  choice: On mettait / étaient
  rationale: L’imparfait décrit des violences en cours. La construction est répartie entre les trois membres pour produire un français naturel tout en conservant l’aspect duratif.
- source_word: νέων
  choice: jeunes
  rationale: En opposition à πρεσβυτέρων, le terme exprime ici principalement un contraste d’âge sans désigner nécessairement les seuls jeunes hommes.
- source_word: πρεσβυτέρων
  choice: vieux
  rationale: Le contexte favorise un contraste général entre jeunes et vieux plutôt que le sens institutionnel d’« anciens ».
- source_word: ἀναίρεσις
  choice: mettait à mort
  rationale: Le terme désigne ici le fait d’ôter violemment la vie. Cette locution est idiomatique et garde une formulation distincte du massacre final.
- source_word: ἀφανισμός
  choice: étaient exterminés
  rationale: Le mot évoque la destruction complète ou la disparition. « Exterminés » convient à des personnes et restitue sa grande force sans employer une tournure française maladroite.
- source_word: παρθένων
  choice: vierges
  rationale: Le grec marque spécifiquement le statut de jeunes femmes non mariées et vierges ; « vierges » préserve cette précision.
- source_word: νηπίων
  choice: tout-petits
  rationale: Le terme désigne de très jeunes enfants, notamment ceux qui ne parlent pas encore. « Tout-petits » est précis, actuel et naturel.
- source_word: σφαγαί
  choice: étaient massacrés
  rationale: Ce terme fort évoque l’égorgement ou la tuerie. « Massacrés » conserve l’intensification rhétorique du dernier membre.
