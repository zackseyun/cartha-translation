    issue: Explicitation interprétative de la réconciliation
    rationale: « Accordée par le grand Souverain » présente le grand Souverain comme l’agent explicite de la réconciliation. Le grec ἐν τῇ τοῦ μεγάλου δεσπότου καταλλαγῇ comporte un génitif dont la relation exacte doit rester ouverte dans la traduction; la note actuelle reconnaît d’ailleurs cette ambiguïté.
