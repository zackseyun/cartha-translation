base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/020.yaml
  text: Therefore even the place itself[a], after sharing in the nation's misfortunes, later also shared in its benefits; and though it had been overtaken in the wrath of the Almighty, it was restored again in the reconciliation of the great Master[b], with all glory.
translation:
  language: fr
  text: C’est pourquoi le lieu lui-même[a], après avoir partagé les malheurs de la nation, eut ensuite part à ses bienfaits. Lui qui avait été atteint par la colère du Tout-Puissant fut de nouveau rétabli, dans toute sa gloire, lors de la réconciliation avec le grand Souverain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans ce contexte, « le lieu » désigne le sanctuaire, c’est-à-dire le Temple.
    reason: contextual_clarification
  - marker: b
    text: 'Littéralement : « lors de la réconciliation du grand Souverain ». Le génitif grec peut exprimer la réconciliation avec le grand Souverain ou son retour en faveur; la formulation du texte conserve le sens relationnel sans préciser davantage. Le titre rendu par « Souverain » souligne son autorité absolue.'
    reason: source_ambiguity
lexical_decisions:
- source_word: διόπερ
  choice: C’est pourquoi
  rationale: Rend clairement la forte conclusion causale qui rattache ce verset au développement précédent.
- source_word: αὐτὸς ὁ τόπος
  choice: le lieu lui-même
  rationale: Conserve le nom général et son emphase sans remplacer dans le texte « le lieu » par l’interprétation contextuelle « le sanctuaire ».
- source_word: συμμετασχὼν τοῦ ἔθνους δυσπετημάτων
  choice: après avoir partagé les malheurs de la nation
  rationale: Le participe aoriste marque une participation aux graves épreuves vécues par la nation; « après avoir » exprime naturellement la succession narrative.
- source_word: εὐεργετημάτων ἐκοινώνησεν
  choice: eut ensuite part à ses bienfaits
  rationale: Préserve le contraste avec les malheurs et le motif répété de la participation, dans un français naturel et digne.
- source_word: καταληφθεὶς ἐν τῇ τοῦ παντοκράτορος ὀργῇ
  choice: Après avoir été atteint par la colère du Tout-Puissant
  rationale: « Atteint » convient à un lieu frappé par le jugement, tandis que « Tout-Puissant » est l’équivalent biblique français usuel de παντοκράτωρ.
- source_word: ἐν τῇ τοῦ μεγάλου δεσπότου καταλλαγῇ
  choice: lors de la réconciliation accordée par le grand Souverain
  rationale: « Réconciliation » maintient le renversement relationnel exprimé par καταλλαγή; « accordée par » explicite sobrement que le retour à la faveur procède du Souverain, conformément au contraste avec sa colère.
- source_word: μετὰ πάσης δόξης ἐπανωρθώθη
  choice: il fut de nouveau rétabli dans toute sa gloire
  rationale: Rend le passif, l’idée de restauration et la plénitude de la gloire sans alourdir la phrase.
theological_decisions:
- issue: Distinction entre les titres divins παντοκράτωρ et δεσπότης
  choice: le Tout-Puissant … le grand Souverain
  alternative: le Tout-Puissant … le grand Maître / le grand Seigneur
  rationale: Deux titres grecs différents sont employés. « Souverain » met en relief l’autorité absolue de δεσπότης et évite de l’assimiler silencieusement à κύριος.
- issue: Sens du génitif dans τοῦ μεγάλου δεσπότου καταλλαγῇ
  choice: la réconciliation accordée par le grand Souverain
  alternative: la réconciliation avec le grand Souverain / la réconciliation du grand Souverain
  rationale: Le contexte oppose la colère divine au retour de la faveur divine. La formulation choisie rend cette initiative sans suggérer que Dieu aurait lui-même besoin d’être moralement réconcilié, tout en signalant en note la formulation grecque plus compacte.
translation_notes:
  register: 'Français international moderne, soutenu sans archaïsmes. Le rythme antithétique du grec est conservé : malheurs/bienfaits, colère/réconciliation, atteinte/restauration. Les titres divins restent distincts.'
