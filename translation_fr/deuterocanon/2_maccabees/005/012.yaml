  yaml_path: translation/deuterocanon/2_maccabees/005/012.yaml
  text: And he ordered the soldiers to cut down without mercy those they encountered[b][a], and to slaughter those who went up into the houses.
translation:
  language: fr
  text: Il ordonna aux soldats d’abattre sans pitié ceux qu’ils rencontraient[a] et de massacrer ceux qui montaient dans les maisons[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui se trouvaient sur leur passage ». Le participe grec peut désigner les personnes rencontrées en chemin ; il n’implique pas nécessairement qu’elles aient attaqué les soldats.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ceux qui montaient dans les maisons » ; il peut s’agir de personnes qui gravissaient des marches pour accéder aux maisons ou à leurs parties hautes.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: Il ordonna
  rationale: L’aoriste de κελεύω exprime un ordre donné; « ordonna » est naturel et conserve toute sa force.
- source_word: κόπτειν
  choice: de frapper
  rationale: κόπτω signifie littéralement frapper ou couper. Dans ce contexte militaire meurtrier, « frapper » garde l’image de l’attaque violente sans ajouter explicitement à ce premier verbe une issue que le grec laisse au contexte.
- source_word: ἀφειδῶς
  choice: sans pitié
  rationale: L’adverbe indique qu’on agit sans épargner personne; « sans pitié » exprime clairement cette brutalité en français actuel.
- source_word: τοὺς ἐμπίπτοντας
  choice: tous ceux qu’ils rencontraient
  rationale: ἐμπίπτω peut désigner ceux sur qui l’on tombe ou que l’on rencontre. Cette formulation convient à la scène et n’insinue pas que les victimes attaquaient les soldats.
- source_word: ἀναβαίνοντας
  choice: qui montaient dans
  rationale: ἀναβαίνω signifie « monter ». La traduction maintient la dimension ascendante, qui peut évoquer des marches ou l’accès aux parties hautes des maisons.
- source_word: κατασφάζειν
  choice: de massacrer
  rationale: Le composé intensif désigne une mise à mort brutale; « massacrer » rend bien la violence et le caractère indiscriminé de l’action.
- source_word: οἰκίαις
  choice: les maisons
  rationale: Le contexte vise les bâtiments physiques; « maisons » est donc plus précis que « foyers ».
