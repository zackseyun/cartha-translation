base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/006.yaml
  text: But Jason kept carrying out merciless slaughter of his own fellow citizens[a], not understanding that prosperity against kinsmen is the greatest calamity[b], and thinking that he was winning trophies over enemies and not over his own countrymen.
translation:
  language: fr
  text: Mais Jason massacrait sans pitié ses propres concitoyens[a], sans comprendre que la réussite contre ses proches était le plus grand des malheurs[b], et s’imaginant dresser des trophées contre des ennemis, et non contre ses compatriotes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « massacrait les siens sans les épargner ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la prospérité à l’égard de ses proches est le plus grand malheur »; il s’agit d’une réussite apparente obtenue contre les siens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σφαγὰς ... ἐποίει
  choice: massacrait
  rationale: Le verbe français exprime naturellement l’action répétée et brutale indiquée par l’imparfait ἐποίει avec σφαγάς, sans affaiblir le sens en simples « meurtres ».
- source_word: τῆς πόλεως τῶν ἰδίων
  choice: ses propres concitoyens
  rationale: Cette formulation restitue l’appartenance civique et l’insistance de τῶν ἰδίων sur le fait qu’il s’agissait des siens.
- source_word: ἀφειδῶς
  choice: sans pitié
  rationale: Expression française courante et forte pour une action accomplie sans épargner personne; « sans ménagement » serait ici trop faible.
- source_word: οὐ συννοῶν
  choice: Il ne comprenait pas
  rationale: La proposition autonome allège la longue période grecque tout en conservant l’idée d’un défaut de discernement.
- source_word: τὴν εἰς τοὺς συγγενεῖς εὐημερίαν
  choice: réussir aux dépens de ses proches
  rationale: Dans le contexte militaire, εὐημερία désigne une réussite apparente. « Aux dépens de » rend le rapport hostile envers les proches sans faire de la préposition εἰς une précision artificielle.
- source_word: δυσημερίαν ... τὴν μεγίστην
  choice: le plus grand des malheurs
  rationale: « Malheur » conserve le contraste lexical avec l’apparente réussite et reste plus proche de la notion de mauvaise fortune que « désastre ».
- source_word: συγγενεῖς
  choice: ses proches
  rationale: Le terme garde la force de parenté ou d’affinité collective sans imposer le sens étroit de parents biologiques immédiats.
- source_word: τρόπαια καταβάλλεσθαι
  choice: dresser des trophées remportés sur
  rationale: La formulation conserve l’image antique du trophée de victoire dressé après le combat tout en indiquant clairement, en français moderne, la victoire qu’il commémore.
- source_word: πολεμίων
  choice: des ennemis
  rationale: Équivalent militaire direct et naturel.
- source_word: ὁμοεθνῶν
  choice: des gens de son propre peuple
  rationale: Cette expression met en relief l’appartenance commune à un même peuple et distingue ce terme de συγγενεῖς rendu plus tôt par « proches ».
theological_decisions:
- issue: Jugement moral contenu dans le renversement entre réussite apparente et malheur réel
  choice: Présenter toute réussite obtenue aux dépens des proches comme « le plus grand des malheurs »
  alternative: Traduire formellement par « la prospérité envers ses proches est la plus grande infortune »
  rationale: Le grec formule lui-même ce renversement moral. La traduction choisie le rend intelligible sans ajouter une explication doctrinale ni atténuer le jugement du narrateur.
- issue: Portée de συγγενεῖς et ὁμοεθνῶν
  choice: Distinguer « proches » de « gens de son propre peuple »
  alternative: Employer deux fois « compatriotes »
  rationale: Cette distinction préserve la tension entre la proximité de parenté ou d’affinité et l’identité ethnique ou nationale commune, sans les réduire à une seule catégorie.
translation_notes:
  register: Français international moderne, digne et narratif. La longue phrase grecque est divisée après la première proposition pour améliorer la lisibilité. Les termes « concitoyens », « proches » et « propre peuple » maintiennent les nuances civique, relationnelle et ethnique du grec.
