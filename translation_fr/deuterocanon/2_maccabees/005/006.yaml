    issue: Formulation des trophées
    rationale: « Dresser des trophées remportés sur des ennemis » attribue improprement « remportés » aux trophées. Le grec τρόπαια καταβάλλεσθαι conserve l’image de trophées que Jason croit dresser/ériger à la suite d’une victoire contre autrui.
  - severity: low
    issue: Rapport de la réussite aux proches
    rationale: « Réussir aux dépens de ses proches » interprète correctement le sens général, mais « la réussite contre ses proches » conserve plus directement l’opposition hostile et le parallélisme avec « contre des ennemis ».
