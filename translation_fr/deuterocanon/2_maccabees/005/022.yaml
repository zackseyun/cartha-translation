base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/022.yaml
  text: 'He also left overseers to mistreat the nation: in Jerusalem[a], Philip, a Phrygian by birth, but in character more barbarous than the one who appointed him[b];'
translation:
  language: fr
  text: 'Il laissa aussi des responsables chargés de maltraiter la nation : à Jérusalem, Philippe, Phrygien d’origine, mais, par son caractère, plus barbare que celui qui l’avait établi[a] ;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '« Plus barbare que celui qui l’avait établi » exprime le jugement moral de l’auteur : Philippe est présenté comme plus cruel même que le souverain qui l’avait placé dans cette fonction.'
    reason: cultural_note
lexical_decisions:
- source_word: κατέλειπεν
  choice: laissa
  rationale: Le verbe signifie « laisser derrière soi » ou « laisser en place ». Le contexte implique que des responsables sont maintenus sur place, sans qu’il soit nécessaire de traduire directement par « nomma ».
- source_word: ἐπιστάτας
  choice: des responsables
  rationale: Le terme désigne des personnes placées au-dessus d’autres et investies d’une autorité déléguée. « Responsables » est naturel en français moderne et évite de préciser indûment une fonction administrative exacte.
- source_word: τοῦ κακοῦν
  choice: chargés de maltraiter
  rationale: L’infinitif articulé exprime ici le but ou la fonction. « Chargés de maltraiter » rend à la fois cette mission assignée et l’idée de mauvais traitements durables.
- source_word: τὸ γένος
  choice: la nation
  rationale: Dans ce contexte, l’expression désigne collectivement le peuple juif dans son identité ethnique et nationale. « Nation » conserve cette dimension collective.
- source_word: τὸ μὲν γένος Φρύγα
  choice: Phrygien d’origine
  rationale: La formule indique l’origine ethnique ou géographique de Philippe. « D’origine » est idiomatique et maintient le contraste avec son caractère.
- source_word: τὸν δὲ τρόπον
  choice: d’un caractère
  rationale: τρόπος renvoie ici à la manière d’être ou au caractère, en contraste explicite avec l’origine de Philippe.
- source_word: βαρβαρώτερον ἔχοντα
  choice: plus barbare encore
  rationale: Le comparatif explicite porte un jugement moral appuyé. « Barbare » conserve la rhétorique historique du texte, tandis que « encore » rend naturellement l’intensification comparative en français.
- source_word: τοῦ καταστήσαντος
  choice: que celui qui l’avait établi
  rationale: Le participe désigne celui qui a placé Philippe dans cette fonction. « Établi » reste proche du grec et convient à une nomination officielle sans surinterpréter le titre du mandant.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. La structure contrastive « Phrygien d’origine, mais d’un caractère… » reproduit le balancement grec. Le point-virgule final est conservé puisque la phrase se poursuit au verset suivant.
