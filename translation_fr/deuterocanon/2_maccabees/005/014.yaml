  yaml_path: translation/deuterocanon/2_maccabees/005/014.yaml
  text: 'And in the three whole days[a], eighty thousand were destroyed: forty thousand by violent hands[b], and no fewer than those who were slaughtered were sold.'
translation:
  language: fr
  text: 'Durant ces trois jours entiers, quatre-vingt mille personnes périrent : quarante mille sous les coups des hommes[a], et des personnes en nombre non moindre que celui des personnes massacrées furent vendues[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, le grec porte une expression obscure : « dans les lois des mains » ; elle peut désigner ici une mort infligée par la violence ou par des mains humaines.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « furent vendues comme esclaves ». Le grec dit simplement « furent vendues », l’asservissement étant sous-entendu par le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀκτὼ ... μυριάδες
  choice: quatre-vingt mille
  rationale: Une μυριάς vaut dix mille ; ὀκτὼ μυριάδες désigne donc quatre-vingt mille personnes.
- source_word: ἐν ταῖς πάσαις ἡμέραις τρισίν
  choice: En l’espace de ces trois jours entiers
  rationale: Cette formulation naturelle restitue la durée de trois jours et l’insistance de πάσαις sur leur totalité.
- source_word: κατεφθάρησαν
  choice: périrent
  rationale: Le verbe peut exprimer soit la destruction, soit le fait de périr. Dans ce récit de massacre, « périrent » indique clairement la perte de vies sans alourdir le français par un passif peu naturel.
- source_word: τέσσαρες μὲν
  choice: quarante mille
  rationale: 'Le substantif « myriades » est sous-entendu à partir de la proposition précédente : quatre myriades correspondent à quarante mille.'
- source_word: ἐν χειρῶν νόμοις
  choice: de mort violente
  rationale: L’expression grecque transmise, littéralement liée aux « lois des mains », est obscure. Le contexte indique une mort infligée par violence humaine, sans permettre d’en préciser sûrement le moyen.
- source_word: τῶν ἐσφαγμένων
  choice: celles qui avaient été massacrées
  rationale: « Massacrées » conserve la force de σφάζω et convient au registre narratif actuel.
- source_word: ἐπράθησαν
  choice: furent vendues
  rationale: Le grec dit simplement qu’elles furent vendues. La vente comme esclaves est impliquée par le contexte, mais elle n’est pas explicitement formulée dans le verbe.
