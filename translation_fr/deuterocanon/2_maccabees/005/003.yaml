  yaml_path: translation/deuterocanon/2_maccabees/005/003.yaml
  text: and the brandishing of swords[a], and squadrons of cavalry drawn up, and attacks and counterattacks by both sides, and the movement of shields, and masses of spears, and the shooting of missiles, and the gleaming of golden ornaments[b], and all kinds of armor.
translation:
  language: fr
  text: le brandissement des épées, les escadrons de cavalerie rangés en ordre de bataille, les attaques et les charges menées de part et d’autre, le mouvement des boucliers, des masses d’armes à hampe[a], les tirs de projectiles, l’éclat des ornements d’or et toutes sortes d’armures.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme grec traduit par « armes à hampe » est difficile dans ce contexte; il pourrait désigner plus précisément des lances ou un matériel de guerre similaire.
    reason: textual_variant
lexical_decisions:
- source_word: μαχαιρῶν σπασμούς
  choice: le brandissement des épées
  rationale: σπασμός exprime ici le geste de tirer ou de manier vivement les épées. « Brandissement » restitue ce mouvement visible sans introduire l’idée distincte d’un éclat lumineux.
- source_word: ἴλας ἵππων διατεταγμένας
  choice: les escadrons de cavalerie rangés en ordre de bataille
  rationale: ἴλη désigne une unité de cavalerie, tandis que διατεταγμένας évoque son déploiement ordonné.
- source_word: προσβολὰς γινομένας καὶ καταδρομὰς ἑκατέρων
  choice: les attaques et les charges menées de part et d’autre
  rationale: προσβολή désigne une attaque; καταδρομή peut désigner une irruption, une charge ou un raid. « De part et d’autre » conserve la réciprocité exprimée par ἑκατέρων sans imposer la notion plus précise de contre-attaque.
- source_word: ἀσπίδων κινήσεις
  choice: le mouvement des boucliers
  rationale: κίνησις signifie simplement mouvement; cette traduction préserve la généralité du grec.
- source_word: καμάτων πλήθη
  choice: des masses d’armes à hampe
  rationale: καμάτων est difficile dans ce contexte. La formulation choisie maintient le sens militaire probable tout en évitant de réduire avec certitude le terme aux seules lances.
- source_word: βελῶν βολάς
  choice: les tirs de projectiles
  rationale: βέλος est un projectile au sens large et βολή son lancer ou son tir; « projectiles » évite de préciser indûment flèches ou javelots.
- source_word: χρυσέων κόσμων ἐκλάμψεις
  choice: l’éclat des ornements d’or
  rationale: κόσμος peut désigner un ornement ou un équipement décoré, et ἔκλαμψις son éclat brillant.
- source_word: παντοίους θωρακισμούς
  choice: toutes sortes d’armures
  rationale: θωρακισμός désigne l’armement défensif ou l’armure; παντοίους en souligne la diversité.
