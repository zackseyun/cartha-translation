  source_fidelity: Le texte rend fidèlement l’énumération militaire du grec. « Brandissement des épées » correspond bien à σπασμούς; « escadrons de cavalerie rangés en ordre de bataille » restitue ἴλας ἵππων διατεταγμένας. « Attaques et charges menées de part et d’autre » préserve prudemment l’ambiguïté de καταδρομάς et la réciprocité de ἑκατέρων. La traduction non restrictive de βελῶν βολάς et le traitement prudent du difficile καμάτων sont appropriés.
  naturalness: Le français est moderne, clair et soutenu. L’allègement de la répétition de « et » est naturel en français tout en conservant l’effet de liste accumulative. « Armes à hampe » est légèrement technique, mais reste intelligible et convient au registre militaire du passage.
