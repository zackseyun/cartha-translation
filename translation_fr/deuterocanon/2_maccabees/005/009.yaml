base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/009.yaml
  text: He who had made many exiles from their homeland perished in a foreign land[b][a], having gone up to the Lacedaemonians as though he would obtain protection because of the kinship.
translation:
  language: fr
  text: Celui qui avait contraint beaucoup de gens à quitter leur patrie périt en terre étrangère, s’étant rendu chez les Lacédémoniens[a] dans l’espoir d’obtenir une protection en raison de la parenté[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chez les Spartiates ». « Lacédémoniens » traduit plus littéralement le nom grec.
    reason: lexical_alternative
  - marker: b
    text: Cette « parenté » renvoie probablement au lien traditionnellement affirmé entre les Juifs et les Spartiates; voir 1 Maccabées 12.6-23.
    reason: cross_reference
lexical_decisions:
- source_word: συχνοὺς τῆς πατρίδος ἀποξενώσας
  choice: avait contraint beaucoup de gens à quitter leur patrie
  rationale: Le participe exprime le fait de rendre de nombreuses personnes étrangères à leur patrie, donc de les en chasser. Cette formulation française restitue naturellement la valeur causative sans préciser leur sexe.
- source_word: ἐπὶ ξένης
  choice: en terre étrangère
  rationale: Cette expression concise maintient le contraste ironique avec « leur patrie ».
- source_word: ἀπώλετο
  choice: périt
  rationale: Le verbe garde ici une tonalité de ruine et de jugement plus forte que le simple « mourut ».
- source_word: πρὸς Λακεδαιμονίους
  choice: chez les Lacédémoniens
  rationale: Le nom ethnique grec est rendu littéralement; « chez » convient naturellement à une recherche d’accueil et de protection.
- source_word: ἀναχθεὶς
  choice: s’était rendu
  rationale: Le participe peut exprimer le déplacement, notamment un départ ou un voyage. Le contexte n’impose pas clairement l’idée qu’il aurait été emmené de force; la formulation choisie reste donc neutre.
- source_word: ὡς ... τευξόμενος σκέπης
  choice: pensant obtenir leur protection
  rationale: ὡς avec le participe exprime ici l’attente ou la supposition du sujet; σκέπη désigne une protection ou un refuge.
- source_word: διὰ τὴν συγγένειαν
  choice: en raison de leur parenté
  rationale: « Parenté » conserve l’idée d’un lien d’ascendance, tandis que le possessif explicite naturellement en français la relation entre les groupes concernés.
theological_decisions:
- issue: Nature de la parenté entre les Juifs et les Lacédémoniens
  choice: en raison de leur parenté
  alternative: en raison de la parenté qu’ils revendiquaient
  rationale: Le grec présente la parenté sans indiquer qu’elle serait seulement prétendue. La traduction conserve cette neutralité et réserve le contexte historique à une note.
- issue: Valeur de ἀναχθεὶς
  choice: s’était rendu
  alternative: avait été emmené
  rationale: La forme passive peut suggérer qu’il fut conduit, mais elle s’emploie aussi pour le départ, notamment par mer. Comme le verset ne marque pas explicitement la contrainte, une traduction neutre préserve l’ambiguïté contextuelle.
translation_notes:
  register: Français international moderne, narratif et digne. La première phrase conserve le contraste rhétorique entre la patrie dont il avait chassé beaucoup de gens et la terre étrangère où il périt. Les deux notes sont signalées dans le texte dans l’ordre de leur apparition.
