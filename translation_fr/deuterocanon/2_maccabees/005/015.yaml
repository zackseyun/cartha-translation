base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/015.yaml
  text: But not satisfied with these things[a], he even dared to enter the most holy temple in all the earth, with Menelaus as his guide, the one who had become a traitor both to the laws and to his homeland,
translation:
  language: fr
  text: Mais, non content de ces actes, il osa même entrer dans le temple le plus saint de toute la terre[a], avec pour guide Ménélas, qui était devenu traître à la fois aux lois et à sa patrie,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le sanctuaire le plus saint de tout le pays ». Le grec γῆ peut signifier « terre » ou « pays ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἀρκεσθεὶς δὲ τούτοις
  choice: Mais, non content de ces actes
  rationale: La tournure participiale exprime l'insatisfaction devant les forfaits précédents et introduit une nouvelle escalade. « Ces actes » rend le renvoi contextuel de τούτοις plus clairement que le littéral « ces choses ».
- source_word: κατετόλμησεν
  choice: il osa même
  rationale: Le verbe souligne une audace insolente; « même » fait ressortir la progression narrative sans surcharger la formulation.
- source_word: πάσης τῆς γῆς
  choice: de toute la terre
  rationale: γῆ peut désigner la terre entière ou un pays. Le sens universel convient à la force rhétorique du superlatif, tandis que l'autre possibilité est conservée en note.
- source_word: ἁγιώτατον ἱερὸν
  choice: le temple le plus saint
  rationale: Le superlatif ἁγιώτατον est explicitement rendu, et « temple » désigne naturellement en français l'espace sacré visé par ἱερόν.
- source_word: εἰσελθεῖν
  choice: entrer dans
  rationale: Rendu direct et idiomatique de l'infinitif de mouvement.
- source_word: ὁδηγὸν ἔχων τὸν Μενέλαον
  choice: avec pour guide Ménélas
  rationale: Cette formulation française naturelle conserve le rôle d'accompagnement et de direction attribué à Ménélas.
- source_word: προδότην γεγονότα
  choice: qui était devenu traître
  rationale: '« Était devenu » rend la valeur résultative du participe parfait: Ménélas se trouvait désormais dans l''état de traître.'
- source_word: τῶν νόμων
  choice: aux lois
  rationale: Le pluriel explicite du grec est maintenu; il évoque l'ensemble des lois ancestrales.
- source_word: τῆς πατρίδος
  choice: à sa patrie
  rationale: « Patrie » rend de façon concise et digne le lien personnel et national exprimé par πατρίς.
theological_decisions:
- issue: Désignation du temple et portée de l'affirmation de sainteté
  choice: le temple le plus saint de toute la terre
  alternative: le sanctuaire le plus saint de tout le pays
  rationale: Le texte grec formule un superlatif appuyé. Le choix principal préserve sa portée universelle sans atténuer l'affirmation, tout en signalant en note l'ambiguïté réelle de γῆ.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la virgule finale parce que le verset grec se poursuit syntaxiquement. Le nom propre est francisé sous la forme usuelle « Ménélas ».
