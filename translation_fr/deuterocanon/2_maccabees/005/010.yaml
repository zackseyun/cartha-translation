  yaml_path: translation/deuterocanon/2_maccabees/005/010.yaml
  text: And after casting out a multitude unburied, he himself became unwept, and shared in no burial at all, nor in his ancestral tomb.
translation:
  language: fr
  text: Après avoir jeté dehors une multitude de morts sans sépulture, il ne fut lui-même pleuré par personne ; il n’eut part à aucune cérémonie funèbre, ni à la coutume de ses ancêtres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ni à la loi de ses ancêtres ». Le grec transmis porte « loi » ; « tombeau de ses ancêtres » reflète une autre lecture ou une correction du texte proposée dans ce contexte.'
    reason: La note conserve la difficulté textuelle tout en distinguant le sens du mot grec transmis d’une lecture alternative.
lexical_decisions:
- source_word: ἐκρίψας
  choice: après avoir jeté dehors
  rationale: Le participe aoriste exprime ici une action antérieure. « Jeter dehors » conserve la dureté du verbe et suggère l’abandon des corps sans ajouter un complément absent du grec.
- source_word: ἀτάφων
  choice: morts sans sépulture
  rationale: L’adjectif signifie « non ensevelis ». L’ajout explicatif de « morts » rend en français naturel son emploi substantivé avec « une multitude ».
- source_word: ἀπένθητος
  choice: ne fut lui-même pleuré par personne
  rationale: Cette formulation restitue le sens passif de « sans être pleuré » et souligne le retournement exprimé par le verset.
- source_word: κηδείας οὐδ᾽ ἥτινος
  choice: aucune cérémonie funèbre
  rationale: κηδεία peut désigner les funérailles ou les soins funéraires ; « cérémonie funèbre » demeure assez large, tandis que οὐδ᾽ ἥτινος renforce l’exclusion de toute forme de funérailles.
- source_word: πατρῴου νόμου
  choice: la coutume de ses ancêtres
  rationale: νόμος peut signifier loi, usage ou coutume. Dans ce contexte funéraire, « coutume » est plus naturel que « loi » sans transformer le mot grec en « tombeau ».
theological_decisions:
- issue: Sens de πατρῴου νόμου dans un contexte de funérailles
  choice: la coutume de ses ancêtres
  alternative: le tombeau de ses ancêtres
  rationale: Le texte grec fourni porte νόμου, « loi/coutume », et non τάφου, « tombeau ». La traduction suit donc le témoin grec tout en signalant en note la difficulté et l’autre compréhension attestée par le contexte.
translation_notes:
  register: Français international moderne, sobre et narratif. La phrase garde le parallélisme judiciaire entre les morts laissés sans sépulture et l’absence de deuil ou de funérailles pour leur persécuteur.
