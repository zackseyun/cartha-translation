review_pass:
  verdict: revise
  source_fidelity: Le sens coercitif de συνεκέκλεισεν et l'entrée violente exprimée par εἰσδραμών sont bien rendus. Toutefois, « sur le lieu du spectacle » introduit explicitement un lieu que θεωρία ne désigne pas nécessairement; le terme peut viser l'occasion publique ou festive elle-même. « fit tomber un grand nombre de personnes » ne dit pas assez clairement que l'action armée produit des victimes, ce qu'impose le contexte de κατέστησεν πλήθη.
  naturalness: « Enfermer ... sur le lieu » est peu idiomatique en français. « À l'occasion du spectacle » est naturel tout en laissant ouverte la possibilité d'une fête ou d'un rassemblement public. « Fit de nombreuses victimes » est une formulation narrative française claire et sobre.
  terminology: « Avec des armes » rend σὺν τοῖς ὅπλοις sans le possessif non exprimé en grec. « Spectacle » est conservé dans le texte, avec une note qui maintient les possibilités « fête » et « spectacle public ».
  issues:
  - severity: medium
    issue: Ajout spatial dans « sur le lieu du spectacle »
    rationale: Le grec ἐπὶ τὴν θεωρίαν renvoie à la θεωρία, occasion de spectacle, de rassemblement ou de fête; il ne spécifie pas de manière certaine un « lieu ».
  - severity: medium
    issue: Conséquence meurtrière insuffisamment explicite dans « fit tomber un grand nombre de personnes »
    rationale: Dans le contexte d'une irruption armée, κατέστησεν πλήθη désigne la production d'un grand nombre de victimes. La tournure actuelle peut suggérer seulement une chute physique et affaiblit le sens contextuel.
  - severity: low
    issue: Possessif ajouté dans « avec ses armes »
    rationale: Le grec dit littéralement « avec les armes »; le possessif français n'est pas nécessaire.
