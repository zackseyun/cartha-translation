revisions:
- from: Il enferma tous les Juifs sur le lieu du spectacle[a] puis, faisant irruption dans la ville avec ses armes, il fit tomber un grand nombre de personnes.
  to: Il enferma tous les Juifs à l’occasion du spectacle[a], puis, faisant irruption dans la ville avec des armes, il fit de nombreuses victimes.
  rationale: La révision élimine l'ajout non nécessaire d'un « lieu », conserve l'ambiguïté de θεωρία grâce à la note, et rend explicitement mais sans amplification la conséquence violente de l'action armée. Elle améliore également l'idiomaticité en français moderne.
