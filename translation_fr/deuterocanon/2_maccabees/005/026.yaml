translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste directe et la violence est exprimée clairement, sans amplifier le grec. « Sur le lieu du spectacle » rend plus naturellement la construction ἐπὶ τὴν θεωρίαν que « au spectacle » après le verbe « enfermer ».
