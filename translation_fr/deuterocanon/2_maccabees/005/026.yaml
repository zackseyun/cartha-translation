  yaml_path: translation/deuterocanon/2_maccabees/005/026.yaml
  text: And he confined all the Jews to the spectacle, and, rushing into the city with weapons, he brought down a considerable slaughter.
translation:
  language: fr
  text: Il enferma tous les Juifs à l’occasion du spectacle[a], puis, faisant irruption dans la ville avec des armes, il fit de nombreuses victimes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à l’occasion de la fête » ou « du spectacle public » ; le grec θεωρία peut désigner une occasion de spectacle, de rassemblement ou de célébration.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρίαν
  choice: spectacle
  rationale: Le nom peut désigner le fait de regarder, un spectacle public ou une célébration donnant lieu à un rassemblement. « Spectacle » conserve cette largeur de sens sans préciser indûment la nature de l’occasion.
- source_word: συνεκέκλεισεν
  choice: enferma
  rationale: Le verbe exprime l’action coercitive de retenir un groupe dans un espace clos ou circonscrit. « Enferma » en restitue directement la force.
- source_word: εἰσδραμὼν
  choice: faisant irruption
  rationale: Le participe décrit une entrée rapide et violente. « Faisant irruption » est naturel en français et rend cet élan offensif.
- source_word: σὺν τοῖς ὅπλοις
  choice: avec ses armes
  rationale: Le grec mentionne concrètement les armes. Le possessif est idiomatique en français dans ce contexte, sans ajouter de contenu substantiel.
- source_word: ἱκανὰ ... πλήθη
  choice: un grand nombre de personnes
  rationale: L’expression indique une quantité importante. Le substantif πλήθη, littéralement « foules/nombres », ne nomme pas explicitement un « massacre »; la formulation retenue garde cette relative indétermination.
- source_word: κατέστησεν ... πλήθη
  choice: fit tomber un grand nombre de personnes
  rationale: Dans le contexte d’une irruption armée, « fit tomber » communique les nombreuses victimes causées tout en restant proche de l’expression grecque comprimée et sans introduire explicitement un terme comme « massacre ».
