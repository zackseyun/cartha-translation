  source_fidelity: 'Le sens général est bien rendu : Judas se retire dans les montagnes avec ses compagnons, vit comme des bêtes sauvages et le groupe subsiste de nourriture végétale afin d’éviter la souillure. Toutefois, « dans un groupe d’environ dix hommes » explicite fortement l’ellipse δέκατός που γενηθεὶς. Cette interprétation est probable, mais le texte principal peut mieux préserver la formulation elliptique tout en laissant l’explicitation à la note.'
