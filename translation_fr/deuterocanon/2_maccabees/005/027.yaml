base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/027.yaml
  text: But Judas[a], who was also called Maccabeus, having become about the tenth and having withdrawn, lived in the mountains like a wild animal with those who were with him, and they continued feeding on vegetation so as not to share in the defilement.
translation:
  language: fr
  text: Mais Judas, aussi appelé Maccabée, étant devenu à peu près le dixième[a] et s’étant retiré, vivait dans les montagnes à la manière des bêtes sauvages avec ceux qui l’accompagnaient. Ils continuaient à se nourrir de nourriture végétale afin de ne pas avoir part à la souillure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque, concise et approximative, semble indiquer que Judas s’était retrouvé dans un groupe réduit à une dizaine d’hommes.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰούδας ... ὁ καὶ Μακκαβαῖος
  choice: Judas, appelé aussi Maccabée
  rationale: ὁ καὶ introduit un autre nom ou surnom. « Maccabée » est la forme française usuelle du grec Μακκαβαῖος.
- source_word: δέκατός που γενηθεὶς
  choice: s’étant retrouvé dans un groupe d’environ dix hommes[a]
  rationale: L’expression grecque est elliptique et που marque l’approximation. Elle indique vraisemblablement que Judas s’est retrouvé au sein d’un groupe réduit à une dizaine d’hommes. La note conserve la formulation plus littérale et son ambiguïté.
- source_word: ἀναχωρήσας
  choice: s’étant retiré
  rationale: Le participe exprime un retrait, possiblement devant le danger, sans imposer le sens plus précisément militaire de « battre en retraite ».
- source_word: ἐν τοῖς ὄρεσι
  choice: dans les montagnes
  rationale: Rendu locatif direct et naturel de ἐν τοῖς ὄρεσι.
- source_word: θηρίων τρόπον διέζη
  choice: vivait ... à la manière des bêtes sauvages
  rationale: La tournure conserve la comparaison explicite avec le mode de vie des animaux sauvages et s’applique naturellement à Judas ainsi qu’à ses compagnons dans le contexte.
- source_word: σὺν τοῖς μετʼ αὐτοῦ
  choice: avec ceux qui l’accompagnaient
  rationale: Le grec désigne simplement les personnes qui étaient avec Judas, sans préciser davantage leur statut.
- source_word: τὴν χορτώδη τροφὴν
  choice: de plantes
  rationale: L’expression désigne une nourriture herbacée ou végétale. « Plantes » est courant et évoque ici les végétaux disponibles dans la nature sans technicité excessive.
- source_word: σιτούμενοι διετέλουν
  choice: Ils continuaient à se nourrir
  rationale: 'La construction exprime une action durable : ils persistaient à tirer leur nourriture de ces végétaux.'
- source_word: πρὸς τῷ μὴ μετασχεῖν τοῦ μολυσμοῦ
  choice: afin de ne pas avoir part à la souillure
  rationale: μετέχω signifie participer ou avoir part à quelque chose, tandis que μολυσμός évoque une souillure à portée religieuse et morale. La formulation française préserve cette force sans la limiter à la seule impureté rituelle.
theological_decisions:
- issue: Nature de μολυσμός dans le contexte
  choice: « souillure », avec une portée religieuse et morale probable
  alternative: « impureté » au sens rituel seulement, ou « corruption » au sens général
  rationale: Dans le contexte de la persécution antiochienne, il peut s’agir de la contamination liée aux aliments ou pratiques interdits et, plus largement, à l’apostasie. « Souillure » maintient cette amplitude sans trancher entre les dimensions rituelle et morale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement déployée en deux phrases pour éviter une accumulation de participes et rendre clairement le passage du singulier au pluriel, tout en conservant le lien logique de l’original.
