  terminology: « Maccabée » est la forme française usuelle et convient. « Souillure » rend bien μολυσμός en maintenant sa portée religieuse sans réduire le terme à une impureté exclusivement rituelle. « Bêtes sauvages » restitue naturellement θηρία.
