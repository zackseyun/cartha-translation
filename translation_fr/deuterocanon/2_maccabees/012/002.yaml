  yaml_path: translation/deuterocanon/2_maccabees/012/002.yaml
  text: But of the local commanders[a], Timotheus and Apollonius son of Gennaeus, and further Hieronymus and Demophon, and besides these Nicanor the Cypriarch, would not let them live in peace.
translation:
  language: fr
  text: Parmi les commandants locaux, Timothée, Apollonios, fils de Gennaios, ainsi que Hiéronyme et Démophon, et, en plus de ceux-ci, Nicanor le Cypriarque[a], ne les laissaient pas vivre en paix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Titre grec rare désignant vraisemblablement un dirigeant ou un haut responsable lié à Chypre ; on pourrait aussi traduire : « le gouverneur de Chypre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν ... κατὰ τόπον στρατηγῶν
  choice: Quant aux commandants locaux
  rationale: La tournure française « Quant aux » introduit naturellement le groupe placé en tête, tandis que « commandants locaux » conserve le sens territorial de κατὰ τόπον sans imposer un grade militaire ou administratif trop précis.
- source_word: ὁ τοῦ Γενναίου
  choice: fils de Gennaios
  rationale: L’article suivi du génitif sert ici de patronymique. « fils de » explicite naturellement cette relation en français, et « Gennaios » translittère le nom grec.
- source_word: ἔτι δὲ
  choice: ainsi que
  rationale: Cette locution rend l’ajout de nouveaux noms dans l’énumération avec fluidité, sans accentuer excessivement la progression.
- source_word: πρὸς δὲ τούτοις
  choice: auxquels s’ajoutait
  rationale: Cette formulation marque clairement que Nicanor vient s’ajouter aux personnes déjà citées.
- source_word: ὁ Κυπριάρχης
  choice: le Cypriarque[a]
  rationale: La translittération conserve ce titre grec rare et évite de trancher sans certitude entre « gouverneur de Chypre », « chef des Chypriotes » et une autre fonction liée à Chypre. La note en éclaire le sens probable.
- source_word: οὐκ εἴων
  choice: ils ne les laissaient pas
  rationale: L’imparfait rend l’aspect duratif de l’imparfait grec et exprime une opposition persistante.
- source_word: ἡσυχίαν ἄγειν
  choice: vivre en paix
  rationale: Cette expression française naturelle rend l’idée de mener une existence tranquille, sans subir de troubles.
