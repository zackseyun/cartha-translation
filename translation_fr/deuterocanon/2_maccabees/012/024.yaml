revisions:
- from: Quant à Timothée lui-même, il tomba entre les mains des hommes de Dosithée et de Sosipater. Il les supplia, avec beaucoup de ruse[a], de le relâcher sain et sauf, car il détenait les parents de beaucoup d’entre eux et les frères de certains autres ; sinon, ceux-ci risquaient de n’être aucunement pris en considération[b].
  to: Timothée lui-même, tombé aux mains du groupe de Dosithée et de Sosipater, les supplia avec beaucoup de ruse[a] de le laisser partir sain et sauf, car il détenait les parents d’un grand nombre d’entre eux et les frères d’autres, et il arriverait que ceux-ci soient traités sans aucun égard[b].
  rationale: La révision supprime l’inférence conditionnelle explicite et le modalisateur « risquaient », afin de reproduire plus fidèlement la conséquence future formulée dans le grec. Elle remplace aussi « les hommes de » par « le groupe de », qui rend l’idiome grec relatif à des chefs et à leur entourage. Les notes sont harmonisées avec ce degré d’indétermination.
  reviewer_model: gpt-5.6-terra
