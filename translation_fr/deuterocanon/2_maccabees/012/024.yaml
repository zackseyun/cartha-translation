  text: But Timothy himself[a], having fallen into the hands of those with Dositheus and Sosipater, begged with much cunning to be let go unharmed, because he had the parents of many of them, and of others their brothers[b], and it would happen that these would be disregarded.
translation:
  language: fr
  text: Timothée lui-même, tombé aux mains du groupe de Dosithée et de Sosipater, les supplia avec beaucoup de ruse[a] de le laisser partir sain et sauf, car il détenait les parents d’un grand nombre d’entre eux et les frères d’autres, et il arriverait que ceux-ci soient traités sans aucun égard[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec beaucoup de fourberie » ou « par de nombreux artifices ». Le mot grec désigne ici probablement une supplication habile et trompeuse plutôt que la sorcellerie proprement dite.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec est condensé : Timothée fait valoir qu’il tient en son pouvoir les parents d’un grand nombre de ces hommes et les frères d’autres. Il annonce qu’il arriverait que ces proches soient traités sans aucun égard, sans préciser davantage la conséquence.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐμπεσὼν τοῖς περὶ τὸν Δωσίθεον καὶ Σωσίπατρον
  choice: il tomba entre les mains des hommes de Dosithée et de Sosipater
  rationale: Le participe signifie littéralement « étant tombé parmi/sur », mais le contexte indique que Timothée est passé au pouvoir du groupe associé aux deux chefs. La tournure française explicite naturellement cette capture.
- source_word: ἠξίου
  choice: il les supplia
  rationale: Dans la situation d’un prisonnier demandant sa libération, « supplia » exprime mieux l’insistance contextuelle que le simple « demanda ».
- source_word: μετὰ πολλῆς γοητίας
  choice: avec beaucoup de ruse
  rationale: γοητία peut évoquer la tromperie ou des procédés de charlatan. Ici, il s’agit vraisemblablement d’une plaidoirie habile et manipulatrice, non de sorcellerie au sens littéral.
- source_word: ἐξαφεῖναι ὡς σῷον αὐτόν
  choice: de le relâcher sain et sauf
  rationale: La formulation rend à la fois l’idée de libération et celle de conservation intacte exprimée par σῷον.
- source_word: διὰ τὸ πλειόνων μὲν γονεῖς, ὧν δὲ ἀδελφοὺς ἔχειν
  choice: car il détenait les parents de beaucoup d’entre eux et les frères de certains autres
  rationale: ἔχειν implique ici que Timothée garde ces proches en son pouvoir, probablement comme captifs ou otages. « Détenait » rend ce rapport de pouvoir sans ajouter leur statut exact.
- source_word: καὶ τούτους ἀλογηθῆναι συμβήσεται
  choice: sinon, ceux-ci risquaient de n’être aucunement pris en considération
  rationale: ἀλογέω signifie ne pas tenir compte de quelqu’un, le traiter comme quantité négligeable. Le français exprime la menace implicite pesant sur les proches tout en conservant une certaine indétermination.
