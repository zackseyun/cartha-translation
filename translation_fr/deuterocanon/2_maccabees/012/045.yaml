  text: for if he was looking to the splendid reward laid up for those who have fallen asleep in godliness[a], the thought was holy and devout. Therefore he made atonement for the dead[b], so that they might be released from sin.
translation:
  language: fr
  text: Car, s’il avait en vue la magnifique récompense réservée à ceux qui se sont endormis dans la piété[a], cette pensée était sainte et pieuse. C’est pourquoi il fit une expiation pour les morts[b], afin qu’ils soient délivrés du péché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « le magnifique don qui leur était réservé ». Le terme grec traduit par « récompense » est inhabituel ici; il peut aussi évoquer une offrande ou un don d’action de grâce, ou un bien réservé.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il fit une propitiation pour les morts »; ou « il fit l’expiation pour les morts ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτε
  choice: car s’il
  rationale: Conserve la valeur à la fois conditionnelle et explicative de la tournure dans son lien avec le verset précédent.
- source_word: ἐμβλέπων
  choice: avait en vue
  rationale: Rend naturellement l’idée d’une attention dirigée vers un bien futur.
- source_word: τοῖς μετʼ εὐσεβίας κοιμωμένοις
  choice: ceux qui se sont endormis dans la piété
  rationale: Préserve l’euphémisme grec du sommeil pour la mort et exprime εὐσέβεια par le terme religieux courant « piété ».
- source_word: κάλλιστον ἀποκείμενον εὐχαριστήριον
  choice: la magnifique récompense réservée
  rationale: « Magnifique » rend la valeur superlative et élogieuse de κάλλιστον; « réservée » correspond à ἀποκείμενον. Dans ce contexte, l’inhabituel εὐχαριστήριον désigne vraisemblablement un bien ou une récompense à venir, sans que son sens soit entièrement certain.
- source_word: ὁσία καὶ εὐσεβὴς ἡ ἐπίνοια
  choice: cette pensée était sainte et pieuse
  rationale: Formulation française naturelle qui conserve les deux qualifications religieuses distinctes du grec.
- source_word: ὅθεν
  choice: C’est pourquoi
  rationale: Marque clairement l’inférence tirée de l’affirmation précédente.
- source_word: περὶ τῶν τεθνηκότων
  choice: pour les morts
  rationale: Exprime idiomatiquement les bénéficiaires de l’acte sans préciser davantage la nature de la relation.
- source_word: τὸν ἐξιλασμὸν ἐποιήσατο
  choice: il accomplit un rite d’expiation
  rationale: Le nom désigne ici un acte cultuel traitant le péché. « Rite d’expiation » est clair en français et « accomplit » convient mieux que le calque « fit une expiation ».
- source_word: τῆς ἁμαρτίας ἀπολυθῆναι
  choice: afin qu’ils soient délivrés du péché
  rationale: Conserve la valeur finale de l’infinitif passif et l’image d’une libération, sans ajouter « leur », absent du grec.
theological_decisions:
- issue: Nature du bien post mortem associé au rite accompli pour les morts
  choice: Le texte affirme directement qu’un rite d’expiation fut accompli pour les morts afin qu’ils soient délivrés du péché.
  alternative: Comprendre l’acte comme purement commémoratif, ou l’inscrire explicitement dans une doctrine ultérieure de purification après la mort.
  rationale: Le grec relie explicitement l’expiation pour les morts à la délivrance du péché. La traduction maintient cette affirmation et sa tension théologique sans lui imposer un système doctrinal postérieur.
translation_notes:
  register: Français international moderne, digne et accessible. L’expression « se sont endormis » conserve l’image biblique de la mort; « rite d’expiation » maintient le caractère cultuel du grec sans importer une théorie particulière de l’expiation.
