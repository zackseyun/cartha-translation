  yaml_path: translation/deuterocanon/2_maccabees/012/028.yaml
  text: But after calling on the Sovereign[a], who with judgments shatters the forces of the enemies, they took the city under their control[c][b], and struck down twenty-five thousand of those inside.
translation:
  language: fr
  text: Mais après avoir invoqué le Souverain[a], qui, par des jugements[b], brise les forces des ennemis, ils s’emparèrent de la ville[c] et abattirent vingt-cinq mille de ceux qui s’y trouvaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le Puissant » ou « le Maître » : il s’agit ici d’un titre divin.'
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque traduite par « par des jugements » présente une forme inhabituelle dans le texte transmis ; elle semble évoquer les actes de jugement par lesquels Dieu brise les ennemis.
    reason: textual_variant
  - marker: c
    text: Ou « prirent la ville » ; littéralement, ils la prirent « sous leur main », c’est-à-dire sous leur pouvoir.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεσάμενοι
  choice: après avoir invoqué
  rationale: Le participe aoriste indique que l’invocation adressée à Dieu précède la prise de la ville. Cette formulation est naturelle en français et conserve cette succession.
- source_word: τὸν δυνάστην
  choice: le Souverain
  rationale: Employé ici comme titre divin, le terme désigne celui qui détient puissance et autorité. « Le Souverain » exprime les deux sans archaïsme.
- source_word: μετὰ κρίτους
  choice: par ses jugements
  rationale: La forme transmise est inhabituelle. Le rendu suit le sens probable d’actes de jugement par lesquels Dieu défait les ennemis, tout en signalant la difficulté en note.
- source_word: συντρίβοντα
  choice: brise
  rationale: Le participe présent décrit l’action caractéristique du Souverain. « Brise » garde l’image d’une défaite violente et complète.
- source_word: ὀλκάς
  choice: les forces
  rationale: Dans ce contexte militaire, le mot est compris comme désignant les forces ou la puissance des ennemis. « Les forces » convient à l’objet collectif de « brise », mais le terme grec demeure inhabituel dans cet emploi.
- source_word: ἔλαβον τὴν πόλιν ὑποχείριον
  choice: ils s’emparèrent de la ville
  rationale: L’expression signifie littéralement qu’ils placèrent la ville sous leur main ou leur pouvoir. Le français idiomatique exprime à la fois la capture et la domination.
- source_word: κατέστρωσαν
  choice: abattirent
  rationale: Dans un récit de guerre, le verbe signifie mettre à terre ou tuer. « Abattirent » est sobre, actuel et conserve la gravité de l’action.
- source_word: τῶν ἔνδον
  choice: de ceux qui s’y trouvaient
  rationale: La formule désigne les personnes présentes à l’intérieur de la ville sans préciser qu’il s’agissait uniquement d’hommes ou de combattants.
- source_word: εἰς μυριάδας δύο πεντακισχιλίους
  choice: vingt-cinq mille
  rationale: L’expression numérique correspond directement à vingt-cinq mille.
theological_decisions:
- issue: Titre divin τὸν δυνάστην
  choice: le Souverain
  alternative: le Puissant ; le Maître
  rationale: Le titre souligne la puissance et l’autorité de Dieu sans employer un nom divin plus spécifique absent du grec.
- issue: Moyen de l’action divine dans μετὰ κρίτους
  choice: par ses jugements
  alternative: avec puissance ; par des actes de jugement
  rationale: Le texte transmis est difficile. Le choix conserve l’idée judiciaire attestée par la forme donnée sans transformer la proposition en affirmation doctrinale plus précise que le texte.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide tout en préservant le titre divin, la violence du récit et l’incertitude du syntagme grec difficile.
