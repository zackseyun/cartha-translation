  text: But Judas pressed the pursuit more vigorously[a], and, striking down the wretches, he destroyed as many as three thousand men.
translation:
  language: fr
  text: Mais Judas poursuivait avec plus de vigueur et, abattant ces misérables, il fit périr trois myriades d’hommes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « trois myriades d’hommes », soit trente mille. Le chiffre transmis est difficile dans le contexte ; beaucoup comprennent ici trois mille hommes.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐποίει ... τὸν διωγμόν
  choice: mena la poursuite
  rationale: Cette tournure française rend naturellement l’idiome grec désignant l’action de poursuivre, sans calquer littéralement le verbe ποιεῖν.
- source_word: εὐτονώτερον
  choice: avec plus de vigueur
  rationale: Le comparatif exprime une intensification énergique de la poursuite dans un contexte militaire.
- source_word: συνετίνων
  choice: frappant
  rationale: Dans ce contexte de combat, le participe décrit une attaque violente; « frappant » reste naturel tout en évitant de préciser une arme ou une manière que le grec n’impose pas.
- source_word: τοὺς ἀλιτηρίους
  choice: ces misérables
  rationale: Le terme grec porte une forte condamnation morale. « Ces misérables » conserve la tonalité péjorative du narrateur sans lui donner une portée juridique trop précise.
- source_word: διέφθειρεν
  choice: fit périr
  rationale: Dans un récit militaire, διαφθείρω signifie détruire ou tuer. « Fit périr » exprime clairement l’issue mortelle dans un registre narratif digne.
- source_word: εἰς μυριάδας τρεῖς ἀνδρῶν
  choice: jusqu’à trois myriades d’hommes
  rationale: Le texte grec transmis indique littéralement trois myriades, soit trente mille. Le corps du texte conserve cette donnée source difficile plutôt que d’adopter silencieusement la correction contextuelle à trois mille; la note expose la difficulté.
