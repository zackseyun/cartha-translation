revisions:
- from: Après s’être emparés de la ville par la volonté de Dieu, ils se livrèrent à un massacre impossible à dénombrer. Ainsi, le lac voisin, large de deux stades[a], paraissait ruisseler, rempli de sang[b].
  to: Après s’être emparés de la ville par la volonté de Dieu, ils commirent un massacre impossible à dénombrer, au point que le lac voisin, large de deux stades[a], paraissait rempli de sang qui coulait à flots[b].
  rationale: La révision conserve l'hyperbole violente du texte et l'attribution de la prise de la ville à la volonté de Dieu, sans étendre cette attribution au massacre. Elle remplace l'image française peu naturelle d'un lac qui « ruisselle » par une formulation où le sang « coulait à flots », ce qui reflète plus clairement καταρρεῖν tout en maintenant l'apparence exprimée par φαίνεσθαι et l'ambiguïté de l'image grecque.
