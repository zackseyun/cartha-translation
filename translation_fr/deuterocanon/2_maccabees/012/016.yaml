  text: And when they had taken the city by the will of God[a], they made an immeasurable slaughter, so that the nearby lake, having a width of two stadia, appeared to be overflowing[b], filled with blood.
translation:
  language: fr
  text: Après s’être emparés de la ville par la volonté de Dieu, ils commirent un massacre impossible à dénombrer, au point que le lac voisin, large de deux stades[a], paraissait rempli de sang qui coulait à flots[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le stade était une ancienne unité de longueur. Deux stades correspondent à environ 370 mètres.
    reason: cultural_note
  - marker: b
    text: 'Ou : « paraissait rempli de sang ». La construction grecque associe l''écoulement du sang à l''image du lac qui semble rempli de sang; le rapport exact entre ces deux éléments demeure difficile à reproduire en français.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλαβόμενοι
  choice: Après s’être emparés
  rationale: Le participe aoriste moyen marque ici, dans un contexte militaire, la prise de la ville et situe cette action avant le massacre.
- source_word: τῇ τοῦ θεοῦ θελήσει
  choice: par la volonté de Dieu
  rationale: La formule conserve la valeur possible de moyen ou de conformité du datif sans développer la portée théologique de l’affirmation.
- source_word: ἀμυθήτους … σφαγάς
  choice: un massacre impossible à dénombrer
  rationale: Cette formulation française naturelle rend le pluriel grec de tueries ainsi que l’idée de quantité impossible à compter ou à raconter.
- source_word: παρακειμένην λίμνην
  choice: le lac voisin
  rationale: Le participe indique que le lac se trouvait à proximité immédiate.
- source_word: τὸ πλάτος ἔχουσαν σταδίους δύο
  choice: large de deux stades
  rationale: La tournure concise conserve la mesure ancienne et exprime explicitement la largeur.
- source_word: καταρρεῖν
  choice: ruisseler
  rationale: Le verbe évoque un écoulement vers le bas ou un flot. « Ruisseler » préserve cette image vive sans imposer l’idée plus interprétative d’un débordement.
- source_word: τὸ αἷμα πεπληρωμένην φαίνεσθαι
  choice: paraissait ruisseler, rempli de sang
  rationale: La traduction conserve à la fois l’apparence signalée par φαίνεσθαι, l’image d’écoulement et le participe exprimant que le lac était rempli de sang.
theological_decisions:
- issue: Rôle de la volonté divine dans la prise de la ville
  choice: par la volonté de Dieu
  alternative: selon la volonté de Dieu
  rationale: Le grec attribue explicitement la prise de la ville à la volonté de Dieu. La traduction maintient cette tension sans préciser si le datif exprime surtout le moyen ou la conformité, ni étendre l’affirmation au massacre qui suit.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme excessif. « Massacre impossible à dénombrer » garde l’hyperbole du grec, tandis que la ponctuation de la dernière proposition en préserve l’image dense et légèrement ambiguë.
