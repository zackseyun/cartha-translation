  - severity: low
    issue: « à rester, à l’avenir aussi, bien disposés »
    rationale: La formulation est peu naturelle en français; « désormais » rend idiomatiquement εἰς τὰ λοιπά sans introduire l’adverbe français « aussi », qui n’est pas requis par le grec.
