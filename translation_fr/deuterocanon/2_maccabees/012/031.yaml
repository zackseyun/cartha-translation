  yaml_path: translation/deuterocanon/2_maccabees/012/031.yaml
  text: After giving thanks and urging them beforehand also in the future to be well-disposed toward the nation[a], they came to Jerusalem, as the feast of weeks was approaching.
translation:
  language: fr
  text: Après les avoir remerciés et les avoir exhortés à demeurer désormais bien disposés envers le peuple, ils se rendirent à Jérusalem, alors que la fête des Semaines[a] approchait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionnellement appelée « Pentecôte ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστήσαντες
  choice: après les avoir remerciés
  rationale: Le participe aoriste exprime une action antérieure. En contexte, le pronom renvoie naturellement aux interlocuteurs, tout en gardant le sens courant de « remercier ».
- source_word: προπαρακαλέσαντες
  choice: les avoir exhortés
  rationale: « Exhorter » rend la force de παρακαλέω. La nuance d’antériorité portée par προ- est suffisamment exprimée par la construction « après les avoir… » et le contexte du départ, sans lourdeur comme « exhortés au préalable ».
- source_word: εἰς τὰ λοιπά
  choice: à l’avenir aussi
  rationale: Cette tournure idiomatique signifie « désormais / pour l’avenir ». « À l’avenir aussi » conserve explicitement l’orientation future ainsi que la valeur de continuité suggérée par le contexte.
- source_word: πρὸς τὸ γένος
  choice: envers le peuple
  rationale: Ici, γένος désigne le peuple juif comme communauté ethnique et nationale. « Le peuple » est naturel en français et évite les connotations modernes de « race ».
- source_word: εὐμενεῖς εἶναι
  choice: rester bien disposés
  rationale: εὐμενής décrit une attitude favorable. « Bien disposés » est fidèle, tandis que « rester » s’accorde naturellement avec la perspective future de εἰς τὰ λοιπά.
- source_word: παρεγενήθησαν
  choice: ils se rendirent
  rationale: Le verbe narratif indique qu’ils arrivèrent ou vinrent à Jérusalem. « Se rendirent » convient au déplacement vers cette destination dans un récit historique.
- source_word: τῆς τῶν ἑβδομάδων ἑορτῆς
  choice: la fête des Semaines
  rationale: Cette traduction reprend directement le nom descriptif grec de la fête juive, sans lui substituer le nom traditionnel ultérieur « Pentecôte ».
- source_word: οὔσης ὑπογύου
  choice: approchait
  rationale: Le génitif absolu donne la circonstance temporelle, et ὑπόγυος indique que la fête était proche. « Approchait » est naturel et clair en français.
theological_decisions:
- issue: Désignation de τῆς τῶν ἑβδομάδων ἑορτῆς
  choice: la fête des Semaines
  alternative: la Pentecôte
  rationale: Le grec donne explicitement le titre descriptif de la fête. Le texte principal le traduit directement; le nom traditionnel est conservé en note pour aider le lecteur sans remplacer la formulation de la source.
translation_notes:
  register: Français moderne, digne et narratif. Le passé simple convient au récit historique; la structure participiale grecque est rendue par « après… », et le génitif absolu par une proposition circonstancielle introduite par « car ».
