  text: But they did not catch Timotheus in those places[a], for he had then withdrawn from the places without accomplishing anything, though he had left a garrison in a certain place[b], and a very strong one at that.
translation:
  language: fr
  text: Mais ils ne purent rattraper Timothée dans ces lieux[a], car il s’en était alors retiré sans avoir rien accompli. Il avait toutefois laissé dans un certain endroit une garnison particulièrement forte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils ne parvinrent pas à rejoindre Timothée en ces lieux ». Le verbe grec peut signifier atteindre, rattraper ou saisir quelqu’un.'
    reason: lexical_alternative
  - marker: b
    text: En grec, « particulièrement forte » qualifie directement la garnison, mais l’expression peut aussi évoquer la solidité ou les fortifications de la position qu’elle occupait.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέλαβον
  choice: ne réussirent pas à capturer
  rationale: Dans ce contexte de poursuite militaire, le verbe exprime l’idée d’atteindre quelqu’un pour s’en emparer. Cette formulation française est naturelle et rend explicite l’échec de la tentative sans réduire le sens à une simple découverte.
- source_word: ἐπὶ τῶν τόπων
  choice: dans ces lieux
  rationale: Le pluriel local renvoie aux lieux mentionnés dans le contexte. « Ces lieux » conserve cette référence sans la préciser davantage.
- source_word: ἄπρακτον
  choice: sans avoir rien accompli
  rationale: L’adjectif employé adverbialement indique que Timothée est reparti sans résultat ou sans avoir mené son entreprise à bien.
- source_word: ἐκλελυκότα
  choice: s’en était alors retiré
  rationale: Le participe décrit son départ des lieux avant l’arrivée de ses poursuivants. « Se retirer » convient au cadre militaire sans suggérer plus précisément une fuite.
- source_word: καταλελοιπότα
  choice: avait toutefois laissé
  rationale: Le participe marque le contraste entre le retrait personnel de Timothée et la force qu’il avait laissée derrière lui.
- source_word: φρουράν
  choice: une garnison
  rationale: Dans ce récit militaire, le terme désigne naturellement une troupe chargée de garder ou de tenir une position.
- source_word: ἐν τινι τόπῳ
  choice: dans un certain endroit
  rationale: La formulation maintient l’indétermination du grec, sans identifier ni caractériser davantage le lieu.
- source_word: μάλιστα ὀχυράν
  choice: particulièrement forte
  rationale: L’adjectif féminin s’accorde directement avec « garnison » et μάλιστα en renforce le sens. Le contexte peut aussi évoquer le caractère fortifié de la position.
