lexical_decisions:
- source_word: ἐξῆλθεν
  choice: sortit
  rationale: L’aoriste de ἐξέρχομαι exprime simplement le fait de sortir ou de partir. « Sortit » conserve le mouvement narratif sans ajouter une nuance militaire absente du verbe lui-même.
- source_word: μετὰ
  choice: avec
  rationale: La préposition marque ici l’accompagnement ; « avec » est naturel et fidèle.
- source_word: πεζῶν
  choice: fantassins
  rationale: πεζός désigne ici des soldats à pied, par contraste avec les cavaliers. « Fantassins » rend clairement et avec concision ce sens militaire.
- source_word: τρισχιλίων
  choice: trois mille
  rationale: Le nombre cardinal est rendu directement.
- source_word: ἱππέων
  choice: cavaliers
  rationale: ἱππεύς désigne des hommes combattant à cheval. « Cavaliers » conserve la référence aux personnes et s’oppose naturellement à « fantassins ».
- source_word: τετρακοσίων
  choice: quatre cents
  rationale: Le nombre cardinal est rendu directement, avec l’accord orthographique usuel de « cents » lorsqu’il n’est suivi d’aucun autre nombre.
