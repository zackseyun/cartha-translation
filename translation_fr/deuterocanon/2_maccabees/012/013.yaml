  text: He also advanced against a certain city of bridges[a], strongly fortified and enclosed with walls, inhabited by mixed peoples; its name was Caspin.
translation:
  language: fr
  text: Il marcha aussi contre une certaine ville aux ponts[a], solidement fortifiée et entourée de murailles, qu’habitait un mélange de peuples. Elle s’appelait Caspin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une ville avec des ponts ». L’expression grecque est condensée et pourrait évoquer les ponts ou chaussées remarquables de la ville plutôt qu’un titre officiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπέβαλεν
  choice: Il marcha … contre
  rationale: Dans ce contexte militaire, le verbe exprime un mouvement hostile contre la ville sans préciser prématurément la forme exacte de l’attaque.
- source_word: ἐπί τινα πόλιν γεφυρῶν
  choice: contre une certaine ville aux ponts
  rationale: « Une certaine ville » conserve l’indéfini τινα. Le génitif γεφυρῶν est très condensé; « ville aux ponts » en maintient la valeur descriptive sans en faire avec certitude un titre officiel.
- source_word: ὀχυρὰν
  choice: solidement fortifiée
  rationale: L’adjectif désigne ici la force défensive de la ville.
- source_word: τείχεσιν περιτεφραγμένην
  choice: entourée de murailles
  rationale: Cette formulation rend naturellement l’image d’une ville ceinte d’ouvrages défensifs.
- source_word: παμμιγέσιν ἔθνεσιν κατοικουμένην
  choice: qu’habitait un mélange de peuples
  rationale: παμμιγής souligne le caractère mêlé de la population, tandis que le pluriel ἔθνεσιν est conservé par « peuples ».
- source_word: ὄνομα δὲ Κασπείν
  choice: Elle s’appelait Caspin
  rationale: Formulation française naturelle qui restitue explicitement le nom de la ville; « Caspin » suit la forme française fournie dans la couche de consultation.
