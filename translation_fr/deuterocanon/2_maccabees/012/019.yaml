  text: But Dositheus and Sosipater, commanders under Maccabaeus, went out and destroyed those left behind by Timothy in the stronghold, more than ten thousand men.
translation:
  language: fr
  text: Mais Dosithée et Sosipater, qui comptaient parmi les chefs aux côtés de Maccabée, sortirent et tuèrent plus de dix mille hommes que Timothée avait laissés dans la forteresse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν περὶ τὸν Μακκαβαῖον ἡγουμένων
  choice: qui étaient parmi les chefs placés sous les ordres de Maccabée
  rationale: Le génitif partitif rattache Dosithée et Sosipater au groupe des chefs associés à Maccabée. Cette formulation rend leur fonction militaire et leur relation avec lui sans calquer lourdement περὶ.
- source_word: ἐξοδεύσαντες
  choice: sortirent
  rationale: Le participe exprime le fait de sortir ou de partir. « Sortirent » reste proche du grec et convient au contexte militaire sans ajouter explicitement l’idée d’une marche.
- source_word: ἀπώλεσαν
  choice: tuèrent
  rationale: Avec pour objet plus de dix mille hommes, ἀπόλλυμι désigne ici leur mise à mort. « Tuèrent » est plus direct et naturel en français que « détruisirent » appliqué à des personnes.
- source_word: τοὺς ὑπὸ Τιμοθέου καταλειφθέντας
  choice: les hommes que Timothée avait laissés
  rationale: Cette traduction unit correctement ὑπὸ Τιμοθέου au participe passif καταλειφθέντας et explicite naturellement l’antériorité de l’action en français.
- source_word: ἐν τῷ ὀχυρώματι
  choice: dans la forteresse
  rationale: ὀχύρωμα désigne un ouvrage ou lieu fortifié. « Forteresse » est clair, courant et adapté au récit militaire.
- source_word: πλείους τῶν μυρίων ἀνδρῶν
  choice: plus de dix mille hommes
  rationale: Le comparatif avec μύριοι indique sans ambiguïté un nombre supérieur à dix mille; ἀνδρῶν précise qu’il s’agit d’hommes.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La phrase conserve l’enchaînement du grec tout en évitant les formulations peu idiomatiques comme « détruire des hommes ». Aucun terme confessionnel ou interprétation théologique n’est introduit.
