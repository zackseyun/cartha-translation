base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/014.yaml
  text: But those inside[a], trusting in the strength of the walls and in the supply of provisions, treated Judas and his men more arrogantly, reviling them[b], and even blaspheming and speaking what is not lawful.
translation:
  language: fr
  text: 'Mais ceux qui se trouvaient à l’intérieur, confiants dans la solidité des murailles et dans leurs réserves de vivres, traitaient Judas et ses hommes[a] avec encore plus d’insolence : ils les injuriaient, allaient jusqu’à blasphémer et disaient ce qu’il n’est pas permis de dire[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceux qui entouraient Judas », expression désignant son groupe ou ses forces.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ce qu’il ne convient pas de dire ». L’expression grecque peut avoir une portée morale ou religieuse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἔνδον
  choice: Mais ceux qui se trouvaient à l’intérieur
  rationale: L’expression désigne simplement les défenseurs qui se trouvent à l’intérieur de la place fortifiée, sans qu’il soit nécessaire de préciser davantage leur identité.
- source_word: πεποιθότες
  choice: confiants
  rationale: Le participe parfait exprime une assurance établie et durable fondée sur les défenses et les provisions.
- source_word: τῇ τῶν τειχέων ἐρυμνότητι
  choice: dans la solidité des murailles
  rationale: ἐρυμνότης évoque la force défensive ou le caractère imprenable des murailles. « Solidité » rend naturellement cette idée dans le contexte d’un siège.
- source_word: τῇ τε τῶν βρωμάτων παραθέσει
  choice: dans leurs réserves de vivres
  rationale: Dans ce contexte militaire, βρώματα et παράθεσις renvoient à la nourriture mise en réserve ou disponible pour soutenir un siège.
- source_word: ἀναυθαγέστερον ἐχρῶντο
  choice: traitaient … avec encore plus d’insolence
  rationale: Le comparatif marque une attitude accrue d’arrogance et de défi. Cette formulation conserve la comparaison sans rendre le français artificiel.
- source_word: τοῖς περὶ τὸν Ἰούδαν
  choice: Judas et ses hommes
  rationale: L’idiome grec désigne les personnes qui entourent Judas, c’est-à-dire son groupe ou ses forces. La formulation choisie est claire et naturelle dans le contexte militaire.
- source_word: λοιδοροῦντες
  choice: ils les injuriaient
  rationale: Le verbe désigne des insultes ou des outrages verbaux dirigés contre Judas et ses hommes.
- source_word: βλασφημοῦντες
  choice: allaient jusqu’à blasphémer
  rationale: « Blasphémer » maintient la possible portée religieuse du terme et « allaient jusqu’à » rend l’intensification introduite par προσέτι.
- source_word: λαλοῦντες ἃ μὴ θέμις
  choice: disaient ce qu’il n’est pas permis de dire
  rationale: θέμις concerne ce qui est permis, convenable ou sanctionné, avec une possible portée morale ou religieuse. La traduction garde cette latitude.
theological_decisions:
- issue: Portée de βλασφημοῦντες par rapport à λοιδοροῦντες
  choice: Conserver « blasphémer » comme terme distinct des simples injures.
  alternative: Rendre les deux termes comme des formes générales d’insulte ou d’outrage verbal.
  rationale: L’accumulation progresse des injures au blasphème, puis aux paroles qu’il n’est pas permis de prononcer. Maintenir « blasphémer » préserve cette intensification et la possible dimension d’impiété sans préciser l’objet du blasphème.
- issue: Force morale ou religieuse de ἃ μὴ θέμις
  choice: « ce qu’il n’est pas permis de dire »
  alternative: « ce qu’il ne convient pas de dire » ou « des paroles interdites »
  rationale: Le grec laisse ouverte la nature exacte de l’interdit. La formulation choisie conserve cette indétermination au lieu de la réduire à une simple inconvenance sociale ou à une interdiction juridique précise.
translation_notes:
  register: Français international moderne, digne et accessible. « Murailles », « vivres », « insolence » et « blasphémer » maintiennent la tonalité historique et religieuse sans archaïsme excessif. Les deux notes explicitent des nuances du grec sans alourdir le corps du verset.
