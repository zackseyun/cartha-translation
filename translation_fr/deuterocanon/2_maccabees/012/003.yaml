base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/003.yaml
  text: 'But the people of Joppa committed such a great act of impiety: they invited the Jews living among them to embark, with their wives and children, in the boats provided by them, as though there were no hostility toward them at all;'
translation:
  language: fr
  text: 'Mais les habitants de Joppé commirent un acte d’impiété d’une telle gravité : ils invitèrent les Juifs qui vivaient parmi eux à monter, avec leurs femmes et leurs enfants, dans les bateaux qu’ils avaient mis à leur disposition, comme s’il n’existait envers eux aucune hostilité.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰοππῖται
  choice: les habitants de Joppé
  rationale: Le terme désigne collectivement les membres de la cité de Joppé. Cette formulation est naturelle en français moderne.
- source_word: τηλικοῦτο συνετελέσαντο δυσσέβημα
  choice: commirent un acte d’impiété d’une telle gravité
  rationale: « Commettre » convient à un forfait, tandis que « acte d’impiété » conserve la portée morale et religieuse de δυσσέβημα. « D’une telle gravité » rend l’intensité de τηλικοῦτο avec naturel.
- source_word: παρακαλέσαντες
  choice: ils invitèrent
  rationale: Dans ce contexte de tromperie courtoise, le verbe indique une invitation ou une incitation à embarquer.
- source_word: τοὺς ἐν ἑαυτοῖς οἰκοῦντας Ἰουδαίους
  choice: les Juifs qui vivaient parmi eux
  rationale: La formulation exprime clairement que ces Juifs résidaient au sein de la population de Joppé.
- source_word: ἐμβῆναι
  choice: à monter
  rationale: Avec le complément « dans les bateaux », « monter » est une expression maritime claire et courante, moins soutenue qu’« embarquer ».
- source_word: τὰ παρακατασταθέντα ὑπʼ αὐτῶν σκάφη
  choice: dans les bateaux qu’ils avaient mis à leur disposition
  rationale: Cette traduction rend l’idée de bateaux préparés, fournis ou rendus disponibles par les habitants de Joppé, sans préciser davantage le mode de préparation.
- source_word: σὺν γυναιξὶ καὶ τέκνοις
  choice: avec leurs femmes et leurs enfants
  rationale: Le possessif, implicite dans le contexte, est nécessaire au français naturel et identifie les familles des Juifs invités.
- source_word: ὡς μηδεμίας ἐνεστώσης πρὸς αὐτοὺς δυσμενείας
  choice: comme s’ils n’éprouvaient envers eux aucune hostilité
  rationale: La tournure conserve la présentation d’une apparence trompeuse. « Aucune » rend l’insistance de μηδεμίας, et « hostilité » traduit δυσμένεια.
theological_decisions:
- issue: Portée morale et religieuse de δυσσέβημα
  choice: acte d’impiété
  alternative: méfait / acte criminel
  rationale: « Impiété » préserve l’évaluation explicitement religieuse et morale du grec, alors que les alternatives réduiraient le terme à une faute générale ou juridique.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve le mouvement narratif du grec ainsi que le contraste entre l’invitation apparemment pacifique et l’hostilité réelle. Aucun ajout explicatif ni particularisme confessionnel.
