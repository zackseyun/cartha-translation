lexical_decisions:
- source_word: τοῖς Ἰαμνίταις
  choice: les habitants de Jamnia
  rationale: Le datif désigne les personnes prises pour cible. Cette formulation est naturelle en français moderne et conserve la référence géographique.
- source_word: νυκτὸς ἐπιβαλών
  choice: attaquant de nuit
  rationale: Le participe exprime une attaque menée de nuit, avec une possible nuance d’assaut soudain, sans qu’il soit nécessaire de la renforcer dans la traduction.
- source_word: ἐνέπρησεν
  choice: il incendia
  rationale: Le verbe signifie mettre le feu à ou livrer aux flammes. « Incendia » convient aux deux compléments et au registre narratif.
- source_word: τὸν λιμένα
  choice: le port
  rationale: λιμήν désigne ici le port ou le havre. « Port » est le terme français courant dans ce contexte urbain et maritime.
- source_word: σὺν τῷ στόλῳ
  choice: ainsi que la flotte
  rationale: στόλος renvoie ici à l’ensemble des navires. La formulation rend clairement que le port et la flotte furent incendiés.
- source_word: ὥστε ἐπιφαίνεσθαι
  choice: furent visibles
  rationale: La construction exprime le résultat de l’incendie; cette tournure est idiomatique et fidèle à l’idée d’une lumière perceptible à distance.
- source_word: τὰς αὐγὰς τοῦ φέγγους
  choice: les lueurs du feu
  rationale: La phrase signifie littéralement les lueurs ou rayons de la lumière. « Du feu » explicite sobrement, d’après le contexte immédiat, la source de ces lueurs.
- source_word: εἰς τὰ Ἱεροσόλυμα
  choice: jusqu’à Jérusalem
  rationale: εἰς indique ici l’étendue jusqu’à laquelle les lueurs étaient perceptibles.
- source_word: σταδίων ὄντων διακοσίων τεσσεράκοντα
  choice: située à deux cent quarante stades
  rationale: Le génitif absolu précise la distance. La formulation française rattache naturellement cette indication à Jérusalem sans lui imposer une valeur concessive absente du grec.
