  text: And making a night attack on the people of Jamnia[a], he set the harbor and the fleet on fire, so that the rays of the light were visible as far as Jerusalem[b], it being two hundred forty stadia away.
translation:
  language: fr
  text: Après avoir attaqué de nuit les habitants de Jamnia, il incendia le port ainsi que la flotte, de sorte que les rayons de cette lumière furent visibles jusqu’à Jérusalem, distante de deux cent quarante stades[a].
