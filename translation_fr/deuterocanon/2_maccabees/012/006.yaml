base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/006.yaml
  text: 'And calling on God[a], the righteous judge, he came against the murderers of his brothers: by night he set the harbor on fire and burned the ships, and he stabbed those who had fled there.'
translation:
  language: fr
  text: Après avoir invoqué Dieu, le juste juge, il marcha contre les meurtriers de ses frères. De nuit, il incendia le port et brûla les bateaux ; quant à ceux qui s’y étaient réfugiés[a], il les transperça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui s’y étaient enfuis ensemble ».'
    reason: Le participe grec συμφυγόντας peut mettre l’accent soit sur la fuite commune vers cet endroit, soit, en contexte, sur le fait d’y avoir cherché refuge.
lexical_decisions:
- source_word: ἐπικαλεσάμενος
  choice: Après avoir invoqué
  rationale: Le participe exprime un appel adressé à Dieu avant l’action. « Invoquer » conserve clairement la portée religieuse et reste naturel en français.
- source_word: τὸν δίκαιον κριτὴν θεόν
  choice: Dieu, le juste juge
  rationale: Cette apposition française restitue naturellement le titre judiciaire et la valeur morale de δίκαιον, sans développer davantage la portée théologique de l’expression.
- source_word: παραγενόμενος ἐπὶ
  choice: il marcha contre
  rationale: Dans ce contexte d’offensive, la construction indique un mouvement dirigé contre des adversaires. « Marcha contre » exprime ce mouvement hostile avec concision.
- source_word: τοὺς μιαιφόνους τῶν ἀδελφῶν
  choice: les meurtriers de ses frères
  rationale: μιαιφόνος désigne fortement des meurtriers souillés par le sang versé. Le possessif « ses » explicite naturellement le rapport contextuel aux frères ou compatriotes tués.
- source_word: τὸν μὲν λιμένα
  choice: le port
  rationale: λιμήν peut désigner un port ou un havre. « Port » convient au lieu comprenant les embarcations visées par l’attaque.
- source_word: νύκτωρ
  choice: De nuit
  rationale: Cette tournure concise conserve la valeur adverbiale et le ton narratif.
- source_word: ἐνέπρησεν
  choice: il incendia
  rationale: Le verbe signifie mettre en feu. « Incendia » en restitue directement la valeur causative.
- source_word: τὰ σκάφη κατέφλεξεν
  choice: et brûla les bateaux
  rationale: σκάφη désigne ici des embarcations ; « bateaux » est plus exact et plus courant que le terme potentiellement trop grandiose « navires ». Le verbe κατέφλεξεν exprime leur destruction par le feu.
- source_word: τοὺς δὲ ἐκεῖ συμφυγόντας
  choice: quant à ceux qui s’y étaient réfugiés
  rationale: Le participe décrit des personnes ayant fui ensemble vers cet endroit pour y trouver refuge. La traduction principale rend clairement cette finalité implicite, tandis que la note conserve la formulation centrée sur la fuite.
- source_word: ἐξεκέντησεν
  choice: il les transperça
  rationale: Le verbe désigne l’action de percer avec une arme pointue. « Transperça » préserve la violence précise du grec sans spécifier une arme que le texte ne nomme pas.
theological_decisions:
- issue: Présentation de Dieu comme juge dans un récit de représailles militaires
  choice: Dieu, le juste juge
  alternative: Dieu, le juge qui est juste
  rationale: La traduction maintient le titre judiciaire et l’invocation de la justice divine avant l’attaque, sans transformer le récit en approbation théologique explicite de tous les actes rapportés.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le rythme narratif demeure direct ; « transperça » conserve la dureté du récit, et la note maintient la nuance lexicale du participe grec.
