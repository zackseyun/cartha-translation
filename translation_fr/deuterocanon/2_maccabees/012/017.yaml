  text: From there they marched seven hundred fifty stadia and came to Charax and to the Jews called Toubianoi[a].
translation:
  language: fr
  text: De là, ils partirent, parcoururent sept cent cinquante stades et arrivèrent à Charax, auprès des Juifs appelés Toubianoi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Juifs dits toubieniens » ; le nom grec peut aussi être rendu de manière interprétative par « Tobiades ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποσπάσαντες
  choice: ils partirent
  rationale: Le participe évoque le fait de se détacher d’un lieu et de reprendre la route. « Ils partirent » est naturel en français et n’ajoute pas explicitement l’idée d’une marche militaire.
- source_word: σταδίους ἑπτακοσίους πεντήκοντα
  choice: sept cent cinquante stades
  rationale: La mesure antique est conservée afin de respecter la précision et la couleur historique du texte grec.
- source_word: διήνυσαν
  choice: parcoururent
  rationale: Le verbe exprime l’accomplissement ou la traversée d’une distance ; « parcoururent » rend directement ce sens avec le complément de mesure.
- source_word: εἰς τὸν Χάρακα
  choice: jusqu’à Charax
  rationale: Le nom de lieu est translittéré, et « jusqu’à » marque naturellement le terme du déplacement après l’indication de distance.
- source_word: τοὺς λεγομένους Τουβιηνοὺς Ἰουδαίους
  choice: jusqu’aux Juifs appelés Toubieniens
  rationale: « Appelés » rend λεγομένους sans la nuance potentiellement péjorative de « soi-disant ». « Toubieniens » transpose le gentilé grec en une forme française lisible, tout en signalant en note d’autres rendus possibles.
