lexical_decisions:
- source_word: παραταξαμένους
  choice: Une fois les troupes rangées pour le combat
  rationale: Le participe aoriste moyen de παρατάσσω appartient au vocabulaire militaire et peut désigner la mise en ordre de bataille, avec l'engagement qui s'ensuit. Cette formulation française rend naturellement la valeur temporelle du participe sans réduire le terme au seul affrontement.
- source_word: συνέβη
  choice: il arriva
  rationale: Cette tournure impersonnelle moderne conserve la construction narrative grecque et son idée d'événement survenu.
- source_word: πεσεῖν
  choice: tombèrent
  rationale: Dans un contexte de bataille, πίπτω suggère probablement la mort, mais le grec ne dit pas explicitement « furent tués ». « Tombèrent » préserve cette retenue.
- source_word: ὀλίγους
  choice: quelques
  rationale: L'adjectif substantivé désigne un petit nombre et se rend naturellement par « quelques » devant « Juifs ».
- source_word: τῶν Ἰουδαίων
  choice: Juifs
  rationale: Dans ce contexte, « Juifs » est l'équivalent français courant de Ἰουδαῖοι et désigne les membres du groupe concerné sans alourdir la phrase.
