  text: Une fois les troupes rangées pour le combat[a], il arriva que quelques Juifs tombèrent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Une fois qu’ils eurent engagé le combat ». Le terme grec peut mettre l’accent aussi bien sur la mise en ordre de bataille que sur l’engagement militaire.'
