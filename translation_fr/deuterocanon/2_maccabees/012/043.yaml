revisions:
- from: Après avoir organisé une collecte homme par homme[a], il envoya à Jérusalem deux mille drachmes d’argent afin qu’on présente un sacrifice pour le péché. Il agit ainsi très bien et noblement, car il songeait à la résurrection.
  to: Après avoir fait une collecte par tête[a], il envoya à Jérusalem deux mille drachmes d’argent afin qu’on présente un sacrifice pour le péché, agissant de manière excellente et noble, car il réfléchissait à la résurrection.
  rationale: La révision évite de surinterpréter ποιησάμενος, améliore l’idiomaticité de la tournure distributive et rend plus explicitement la réflexion délibérée exprimée par διαλογιζόμενος. Elle conserve le but indirect de l’envoi, l’approbation explicite de l’auteur, ainsi que la formulation non augmentée « la résurrection ».
