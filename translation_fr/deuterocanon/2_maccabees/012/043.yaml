  yaml_path: translation/deuterocanon/2_maccabees/012/043.yaml
  text: And after taking up a collection man by man[a], he sent two thousand silver drachmas to Jerusalem to provide a sin offering, acting very well and nobly, because he was reasoning about the resurrection.
translation:
  language: fr
  text: Après avoir fait une collecte par tête[a], il envoya à Jérusalem deux mille drachmes d’argent afin qu’on présente un sacrifice pour le péché, agissant de manière excellente et noble, car il réfléchissait à la résurrection.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon le rôle des hommes » ou « au moyen d’une contribution imposée à chacun » ; l’expression grecque κατʼ ἀνδρολόγιον est quelque peu technique et peut désigner une répartition ou une perception individuelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιησάμενός τε κατʼ ἀνδρολόγιον
  choice: Après avoir organisé une collecte homme par homme
  rationale: Le participe marque une action préalable, tandis que κατʼ ἀνδρολόγιον a une valeur distributive et probablement technique. « Organisé une collecte » rend naturellement l’action impliquée par le contexte sans préciser à tort son mécanisme administratif exact.
- source_word: ἀργυρίου δραχμὰς δισχιλίας
  choice: deux mille drachmes d’argent
  rationale: Cette formulation conserve à la fois le montant, l’unité monétaire et la mention explicite de l’argent.
- source_word: προσαγαγεῖν
  choice: afin qu’on présente
  rationale: L’infinitif exprime le but de l’envoi. La tournure impersonnelle indique que Judas finance le sacrifice sans nécessairement le présenter lui-même.
- source_word: περὶ ἁμαρτίας θυσίαν
  choice: un sacrifice pour le péché
  rationale: Cette traduction reste proche de la construction grecque et demeure claire en français, sans imposer une terminologie confessionnelle particulière.
- source_word: πάνυ καλῶς καὶ ἀστείως πράττων
  choice: Il agit ainsi très bien et noblement
  rationale: La formulation conserve l’approbation morale appuyée de l’auteur. Ici, ἀστείως signifie finement, honorablement ou noblement, et non « avec urbanité » au sens français moderne.
- source_word: ὑπὲρ ἀναστάσεως διαλογιζόμενος
  choice: car il songeait à la résurrection
  rationale: Le participe exprime le motif de l’action. « Songeait à » rend une réflexion délibérée de manière naturelle, tout en conservant ἀνάστασις sans ajout explicatif.
theological_decisions:
- issue: Approbation par l’auteur de l’action de Judas
  choice: 'Conserver explicitement l’évaluation positive : « très bien et noblement »'
  alternative: Employer une formulation neutre ou atténuer l’approbation
  rationale: Le grec πάνυ καλῶς καὶ ἀστείως porte une appréciation nettement favorable. La traduction ne doit pas la minimiser en raison des débats confessionnels entourant la pratique décrite.
- issue: Sens de ἀνάστασις
  choice: « la résurrection »
  alternative: « la résurrection des morts »
  rationale: Le complément « des morts » est compris dans le contexte, mais n’est pas exprimé dans ce verset. La formulation retenue préserve donc la concision et l’ambiguïté exactes du grec.
- issue: Bénéficiaires du sacrifice pour le péché
  choice: Ne pas ajouter « pour les morts » dans ce verset
  alternative: « un sacrifice pour le péché des morts »
  rationale: Le contexte proche peut établir les bénéficiaires, mais la phrase grecque présente ici seulement περὶ ἁμαρτίας θυσίαν. Aucun complément théologique absent du verset n’est ajouté.
translation_notes:
  register: Français international moderne, digne et accessible. « Homme par homme » garde la référence masculine et la valeur distributive du grec, tandis que la note signale l’incertitude administrative. La syntaxe est légèrement segmentée pour assurer une lecture naturelle sans affaiblir l’enchaînement logique.
