  to: Mais lorsque la troupe de Judas apparut[a], l’effroi saisit les ennemis ; la peur s’empara aussi d’eux à la manifestation de Celui qui veille sur toutes choses. Ils s’enfuirent précipitamment, chacun emporté dans une direction différente, si bien qu’ils étaient souvent blessés par les leurs et transpercés par les pointes des épées.
