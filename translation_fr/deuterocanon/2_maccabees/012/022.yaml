base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/022.yaml
  text: But when Judas’s company first appeared[a], and dread came upon the enemies—fear also coming upon them from the appearing of the One who watches over all things—they rushed into flight, each man being driven a different way, so that they were often injured by their own men and run through by the points of their swords.
translation:
  language: fr
  text: Mais lorsque la troupe de Judas apparut[a], l’effroi saisit les ennemis ; la peur s’empara aussi d’eux à la manifestation de Celui qui veille sur toutes choses. Ils s’enfuirent précipitamment, chacun emporté dans une direction différente, si bien qu’ils étaient souvent blessés par les leurs et transpercés par les pointes des épées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se montra ». Le grec emploie ici la même famille de mots que pour la « manifestation » de Celui qui veille sur toutes choses, plus loin dans le verset.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφανείσης … ἐπιφανίας
  choice: apparut … manifestation
  rationale: Le grec reprend la même famille lexicale pour l’apparition de la troupe de Judas et la manifestation divine. Le français conserve ce lien sémantique sans forcer une répétition peu naturelle.
- source_word: σπείρης
  choice: troupe
  rationale: Le terme désigne ici une unité ou un groupe militaire sans qu’il faille lui attribuer la taille technique précise d’une cohorte.
- source_word: δέους … φόβου
  choice: l’effroi … la peur
  rationale: Deux termes français distincts maintiennent les quasi-synonymes grecs et leur intensité respective.
- source_word: τοῦ τὰ πάντα ἐφορῶντος
  choice: Celui qui veille sur toutes choses
  rationale: ἐφοράω peut exprimer le fait de regarder, d’observer ou de veiller sur. Cette formulation préserve à la fois la connaissance universelle et la nuance de surveillance providentielle.
- source_word: εἰς φυγὴν ὥρμησαν
  choice: Ils s’enfuirent précipitamment
  rationale: Cette tournure française naturelle rend l’élan soudain et paniqué exprimé par ὥρμησαν avec εἰς φυγήν.
- source_word: ἄλλος ἀλλαχῇ φερόμενος
  choice: chacun emporté dans une direction différente
  rationale: La formulation conserve la distribution individuelle, la dispersion chaotique et la nuance passive de φερόμενος.
- source_word: ὑπὸ τῶν ἰδίων βλάπτεσθαι
  choice: ils se blessaient entre eux
  rationale: « Entre eux » exprime naturellement que les combattants étaient blessés par les leurs, sans préciser davantage la nature générale du dommage.
- source_word: ταῖς τῶν ξιφῶν ἀκμαῖς ἀναπείρεσθαι
  choice: se transperçaient de la pointe de leurs épées
  rationale: La traduction restitue l’image concrète de combattants traversés ou percés par les extrémités pointues des épées.
theological_decisions:
- issue: Description divine τοῦ τὰ πάντα ἐφορῶντος
  choice: Celui qui veille sur toutes choses
  alternative: Celui qui voit toutes choses
  rationale: Le choix maintient la portée globale du regard divin ainsi que la possible nuance de vigilance providentielle, sans imposer une terminologie doctrinale technique.
- issue: Lien entre l’apparition de la troupe et la manifestation divine
  choice: Conserver les deux événements distincts tout en signalant leur vocabulaire grec commun
  alternative: Fondre la peur des ennemis en une seule réaction à l’arrivée de Judas
  rationale: La syntaxe grecque attribue l’effroi à l’apparition de la troupe et ajoute une peur liée à la manifestation de Dieu ; la traduction préserve cette tension narrative et théologique.
translation_notes:
  register: Français international moderne, narratif et digne. Les termes militaires restent accessibles ; la cadence en deux phrases évite une période excessivement lourde tout en conservant les relations logiques du grec.
