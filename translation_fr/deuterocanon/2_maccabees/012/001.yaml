  text: After these agreements had been made[a], Lysias went away to the king[b], but the Jews occupied themselves with farming.
translation:
  language: fr
  text: Une fois ces accords conclus[a], Lysias se rendit auprès du roi, tandis que les Juifs se consacraient aux travaux des champs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « établis ». Le grec souligne que ces accords étaient désormais conclus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένων
  choice: Une fois … conclus
  rationale: Le participe aoriste au génitif absolu marque ici l’achèvement des accords avant les actions principales. Cette tournure française exprime naturellement cette antériorité.
- source_word: συνθηκῶν
  choice: accords
  rationale: Le terme désigne des conventions ou accords. « Accords » reste large et n’ajoute ni caractère diplomatique trop technique ni résonance théologique particulière.
- source_word: ἀπῆε
  choice: partit
  rationale: Dans ce récit, l’imparfait grec exprime le départ de Lysias. « Partit » est naturel et suffisamment précis, sans ajouter l’idée d’un retour.
- source_word: πρὸς τὸν βασιλέα
  choice: auprès du roi
  rationale: πρός avec l’accusatif indique un mouvement en direction d’une personne. « Auprès du roi » rend la destination sans introduire le « retour », qui n’est pas explicite.
- source_word: περὶ τὴν γεωργίαν ἐγίνοντο
  choice: se consacraient aux travaux des champs
  rationale: L’expression idiomatique indique que les Juifs s’occupaient d’agriculture. Cette formulation française est naturelle, concrète et conserve la valeur durative de l’imparfait.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Le contraste marqué par μέν…δέ est rendu par « tandis que ». La formulation évite le calque peu naturel « étaient autour de l’agriculture » et n’ajoute pas que Lysias serait retourné auprès du roi.
