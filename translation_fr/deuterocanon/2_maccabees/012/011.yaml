base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/011.yaml
  text: And when a fierce battle had taken place[a], and those with Judas had prevailed because of the help from God, the nomads, having been weakened, asked Judas to give them his right hand[b], promising both to provide pasture and to be useful to them in the future.
translation:
  language: fr
  text: Après un combat acharné, les hommes de Judas eurent l’avantage grâce au secours venu de Dieu. Les nomades, affaiblis, demandèrent alors à Judas de leur tendre la main droite[a], promettant de fournir des pâturages et de leur rendre service par la suite[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Tendre la main droite » signifie ici conclure la paix ou sceller une alliance.
    reason: cultural_note
  - marker: b
    text: La formulation grecque de la fin du verset est très condensée et comporte une forme verbale inattendue. Le sens paraît être que les nomades promettaient des pâturages et une aide future.
    reason: textual_variant
lexical_decisions:
- source_word: καρτερᾶς μάχης
  choice: un combat acharné
  rationale: Dans un contexte militaire, καρτερός exprime l’intensité et la rudesse. « Acharné » est naturel en français et ne précise pas indûment l’issue du combat.
- source_word: τῶν περὶ τὸν Ἰούδαν
  choice: les hommes de Judas
  rationale: La tournure désigne le groupe qui entoure Judas, ici ses combattants. Cette formulation française est claire sans imposer une organisation militaire plus précise.
- source_word: διὰ τὴν παρὰ τοῦ θεοῦ βοήθειαν
  choice: grâce au secours venu de Dieu
  rationale: La traduction conserve à la fois le rapport causal exprimé par διά et l’origine divine du secours marquée par παρά.
- source_word: εὐημερησάντων
  choice: eurent l’avantage
  rationale: Dans le cadre du combat, le verbe indique qu’ils connurent le succès. « Eurent l’avantage » rend ce succès sans aller jusqu’à affirmer une victoire totale.
- source_word: ἐλαττωθέντες
  choice: affaiblis
  rationale: Le participe signifie qu’ils avaient été diminués ou réduits. « Affaiblis » préserve cette portée sans surtraduire par « vaincus ».
- source_word: οἱ νομάδες
  choice: les nomades
  rationale: Le nom désigne des populations nomades; la minuscule convient à cette désignation descriptive.
- source_word: ἠξίουν δοῦναι τὸν Ἰούδαν δεξιὰν αὐτοῖς
  choice: demandèrent à Judas de leur tendre la main droite
  rationale: La formulation garde l’image grecque de la main droite, tout en l’exprimant de manière idiomatique en français; une note en explique la valeur culturelle.
- source_word: ὑπισχνούμενοι
  choice: promettant
  rationale: Le participe introduit les engagements proposés par les nomades.
- source_word: βοσκήματα δώσειν
  choice: fournir des pâturages
  rationale: βοσκήματα renvoie à ce qui permet aux bêtes de paître, qu’il s’agisse de terrains ou de ressources de pâture. « Pâturages » conserve cette portée générale.
- source_word: ἐν τοῖς λοιποῖς
  choice: par la suite
  rationale: Dans ce contexte, l’expression vise leurs rapports ultérieurs et se rend naturellement par une indication temporelle.
- source_word: ὠφέλησεν αὐτούς
  choice: leur rendre service
  rationale: Le texte transmis est grammaticalement comprimé et présente une forme verbale inattendue après « promettant ». La traduction restitue prudemment le sens contextuel d’une aide future, signalé en note.
theological_decisions:
- issue: Attribution du succès militaire à l’action divine
  choice: Le groupe de Judas prend l’avantage « grâce au secours venu de Dieu ».
  alternative: Présenter le succès comme un simple résultat militaire, sans lien causal explicite avec Dieu.
  rationale: Le grec attribue expressément le succès à la βοήθεια venant de Dieu. La traduction maintient cette affirmation théologique sans l’amplifier.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases ont été légèrement segmentées pour la lisibilité, tout en conservant les rapports logiques du grec. L’image culturelle de la main droite et l’incertitude syntaxique finale sont maintenues et explicitées en notes.
