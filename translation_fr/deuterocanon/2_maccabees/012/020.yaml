translation_notes:
  register: Français international moderne, soutenu mais accessible. Le vocabulaire militaire reste non technique afin de ne pas assimiler σπεῖρα à une unité romaine précise. L’ellipse numérique finale du grec est volontairement maintenue et explicitée en note.
