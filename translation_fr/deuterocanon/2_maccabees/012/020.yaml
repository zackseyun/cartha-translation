  text: But Maccabeus[a], after arranging the troops around him in companies, stationed them over against the companies; and they charged against Timothy, who had around him twelve myriads of foot soldiers, two thousand horsemen[b], and besides these seven thousand more.
translation:
  language: fr
  text: Mais Maccabée, après avoir organisé en unités les troupes qui l’accompagnaient, les posta par unités. Ils se lancèrent alors contre Timothée, qui avait avec lui douze myriades[a] de fantassins et deux mille cavaliers, en plus des sept mille[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Une myriade vaut dix mille ; douze myriades correspondent donc à 120 000 fantassins.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec dit littéralement : « en plus des sept mille ». La formulation est elliptique et ne précise pas ici à quelle catégorie de soldats appartenaient ces sept mille hommes.'
    reason: alternative_reading
lexical_decisions:
- source_word: διατάξας τὴν περὶ αὐτὸν στρατιὰν σπειρηδόν
  choice: après avoir organisé en unités les troupes qui l’accompagnaient
  rationale: Le participe aoriste exprime une préparation antérieure à l’assaut. « Organisé en unités » rend la disposition militaire indiquée par σπειρηδόν, tandis que « qui l’accompagnaient » exprime naturellement τὴν περὶ αὐτὸν στρατιάν.
- source_word: κατέστησεν αὐτοὺς ἐπὶ τῶν σπειρῶν
  choice: les plaça face aux unités adverses
  rationale: Dans ce contexte militaire, ἐπί décrit la mise en position des hommes de Maccabée par rapport aux formations opposées. « Face à » restitue cette confrontation sans imposer le terme technique romain « cohortes ».
- source_word: ὥρμησαν
  choice: Ils se lancèrent alors contre
  rationale: Le verbe exprime un mouvement offensif soudain. Cette formulation est idiomatique en français et conserve la vigueur de l’action.
- source_word: μυριάδας δώδεκα πεζῶν
  choice: douze myriades de fantassins
  rationale: La formulation conserve l’expression numérique grecque, dont l’équivalent arithmétique est précisé en note, et « fantassins » rend clairement πεζῶν.
- source_word: ἱππεῖς δὲ δισχιλίους
  choice: deux mille cavaliers
  rationale: Traduction directe, claire et courante du terme désignant des soldats montés.
- source_word: καὶ πρὸς τοῖς ἑπτακισχιλίοις
  choice: en plus des sept mille
  rationale: 'La formule grecque est elliptique : elle ajoute ou met en relation un groupe de sept mille sans en répéter la désignation. La traduction conserve cette ellipse plutôt que de préciser arbitrairement la catégorie de ces soldats.'
