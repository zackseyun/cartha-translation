lexical_decisions:
- source_word: ἀναζεύξαντές
  choice: ils levèrent le camp
  rationale: Le participe désigne ici la levée du camp avant le départ et conserve la nuance concrète du déplacement d’une troupe.
- source_word: ὥρμησαν
  choice: partirent … en direction de
  rationale: Dans ce récit de déplacement, le verbe exprime un mouvement résolu vers une destination, sans imposer l’idée d’une attaque.
- source_word: ἐπὶ Σκυθῶν πόλιν
  choice: en direction de la ville des Scythes
  rationale: Cette formulation suit l’expression descriptive grecque plutôt que de la remplacer directement par le nom propre Scythopolis; «en direction de» rend ici la valeur directionnelle de ἐπί.
- source_word: ἀπέχουσαν
  choice: située à … de
  rationale: Cette tournure française naturelle exprime la distance qui sépare la ville de Jérusalem.
- source_word: σταδίους ἑξακοσίους
  choice: six cents stades
  rationale: L’unité ancienne est conservée pour respecter le texte source sans introduire une conversion moderne approximative.
