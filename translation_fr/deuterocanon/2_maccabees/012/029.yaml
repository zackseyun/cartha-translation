  text: Then they broke camp from there and set out for the city of the Scythians[a], six hundred stadia from Jerusalem.
translation:
  language: fr
  text: Puis ils levèrent le camp et partirent de là en direction de la ville des Scythes[a], située à six cents stades de Jérusalem.
