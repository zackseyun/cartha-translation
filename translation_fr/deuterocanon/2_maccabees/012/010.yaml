  text: From there[a], after they had gone nine stadia, while making their march against Timotheus, Arabs fell upon him, no fewer than five thousand, and five hundred horsemen.
translation:
  language: fr
  text: De là, après avoir parcouru neuf stades, tandis qu’ils marchaient contre Timothée, des Arabes tombèrent sur lui[a], au nombre d’au moins cinq mille, auxquels s’ajoutaient cinq cents cavaliers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie ici le singulier « lui » (αὐτῷ). Certaines traductions comprennent le référent de manière collective et rendent « eux », mais le texte grec transmis porte le singulier.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποστάντες
  choice: après s’être éloignés
  rationale: Le participe aoriste exprime ici l’éloignement du lieu précédent; cette formulation reste naturelle tout en conservant cette nuance.
- source_word: σταδίους ἐννέα
  choice: de neuf stades
  rationale: Le maintien de l’unité antique respecte directement le texte grec sans imposer une conversion approximative.
- source_word: ποιουμένων τὴν πορίαν
  choice: tandis qu’ils marchaient
  rationale: Le génitif absolu décrit leur progression en cours; «marchaient» convient au contexte militaire.
- source_word: ἐπὶ τὸν Τιμόθεον
  choice: contre Timothée
  rationale: Dans ce contexte militaire, ἐπί suivi de l’accusatif marque une avancée hostile contre un adversaire.
- source_word: ἐπέβαλον
  choice: tombèrent sur
  rationale: Cette expression rend l’idée d’une attaque soudaine portée par le verbe grec.
- source_word: Ἄραβες
  choice: des Arabes
  rationale: C’est l’ethnonyme français moderne et direct correspondant au grec.
- source_word: αὐτῷ
  choice: sur lui
  rationale: Le pronom grec est au singulier; la traduction le conserve sans l’harmoniser silencieusement avec le groupe qui accompagne Judas.
- source_word: οὐκ ἐλάττους τῶν πεντακισχιλίων
  choice: au nombre d’au moins cinq mille
  rationale: Cette tournure française naturelle exprime fidèlement le nombre minimal indiqué par le grec.
- source_word: ἱππεῖς δὲ πεντακόσιοι
  choice: auxquels s’ajoutaient cinq cents cavaliers
  rationale: ἱππεῖς désigne des combattants montés; la formulation distingue clairement ces cinq cents cavaliers des cinq mille Arabes mentionnés auparavant.
