  yaml_path: translation/deuterocanon/2_maccabees/012/015.yaml
  text: But those around Judas[a], having called on the great Sovereign of the world—the one who, in the time of Joshua, brought down Jericho without rams or siege engines—assaulted the wall fiercely.
translation:
  language: fr
  text: Mais ceux qui étaient avec Judas, après avoir invoqué le grand Souverain du monde — celui qui, au temps de Josué[a], avait fait s’écrouler Jéricho sans béliers ni machines de siège — ébranlèrent sauvagement la muraille.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte le nom Iêsous, forme qui désigne ici Josué, le chef d’Israël associé à la chute de Jéricho.
    reason: Précision lexicale sur un nom grec susceptible d’être confondu avec celui de Jésus.
lexical_decisions:
- source_word: οἱ δὲ περὶ τὸν Ἰούδαν
  choice: Mais les hommes qui entouraient Judas
  rationale: La tournure περὶ suivi de l’accusatif désigne le groupe associé à un chef. « Les hommes qui entouraient Judas » reste naturel en français sans préciser davantage leur statut militaire.
- source_word: ἐπικαλεσάμενοι
  choice: après avoir invoqué
  rationale: Le participe moyen exprime ici un appel adressé à Dieu. « Invoqué » rend clairement la portée religieuse de cet appel.
- source_word: τὸν μέγαν τοῦ κόσμου δυνάστην
  choice: le grand Souverain du monde
  rationale: δυνάστης désigne un puissant détenteur de l’autorité. « Souverain » conserve la majesté du titre tout en restant compréhensible.
- source_word: ἄτερ κριῶν καὶ μηχανῶν ὀργανικῶν
  choice: sans béliers ni machines de siège
  rationale: Dans ce contexte militaire, κριοί désigne les béliers, tandis que μηχαναί ὀργανικαί renvoie aux engins construits pour mener un siège.
- source_word: κατακρημνίσαντα τὴν Ἰερειχώ
  choice: avait fait s’écrouler Jéricho
  rationale: Le verbe évoque une chute violente. La formulation française rappelle naturellement l’écroulement des défenses de Jéricho sans ajouter explicitement « les murailles », absent du grec dans cette proposition.
- source_word: κατὰ τοὺς Ἰησοῦ χρόνους
  choice: au temps de Josué
  rationale: Ἰησοῦ est la forme grecque du nom porté ici par Josué. L’allusion à la chute de Jéricho rend ce référent historique certain.
- source_word: ἐνέσεισαν τῷ τείχει
  choice: ébranlèrent la muraille
  rationale: ἐνέσεισαν exprime l’idée d’imprimer une secousse ou de s’attaquer avec force. « Ébranlèrent » conserve cette image vive et convient à l’assaut d’une muraille.
- source_word: θηριωδῶς
  choice: avec une fureur sauvage
  rationale: L’adverbe signifie littéralement d’une manière bestiale ou féroce. « Avec une fureur sauvage » restitue cette intensité plus précisément que le seul adverbe « violemment ».
theological_decisions:
- issue: Identification de Ἰησοῦ dans l’allusion à Jéricho
  choice: Josué
  alternative: Jésus, selon la forme grecque identique du nom
  rationale: Le contexte renvoie sans ambiguïté au chef d’Israël associé à la chute de Jéricho. Employer la forme française « Josué » évite une confusion avec Jésus de Nazareth.
translation_notes:
  register: Français international moderne, digne et narratif. La construction participiale grecque est rendue par « après avoir invoqué » pour clarifier la succession logique, tandis que les tirets conservent l’ampleur de la description du Souverain.
