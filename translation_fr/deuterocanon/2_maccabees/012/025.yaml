  text: But when he had assured them at length that he would restore these men unharmed[b][a], they released him for the safety of their brothers.
translation:
  language: fr
  text: Mais, après leur avoir donné à plusieurs reprises l’assurance qu’il ramènerait ces hommes sains et saufs[a], ils le relâchèrent pour la sécurité de leurs frères[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec peut aussi se comprendre : « il respecterait l’engagement de ramener ces hommes sains et saufs ».'
    reason: source_ambiguity
  - marker: b
    text: 'Ou : « pour la délivrance de leurs frères » ; le terme grec peut aussi être traduit par « salut », mais il désigne ici vraisemblablement leur préservation physique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστώσαντος
  choice: après qu’il leur eut garanti
  rationale: Le participe aoriste de πιστόω exprime ici le fait de donner une garantie ou une assurance. La tournure française rend clairement le rapport temporel avec le verbe principal.
- source_word: διὰ πλειόνων
  choice: longuement
  rationale: L’expression signifie littéralement « au moyen de paroles plus nombreuses » et évoque des assurances développées ou répétées. « Longuement » est naturel en français moderne.
- source_word: τὸν ὁρισμὸν ἀποκαταστῆσαι
  choice: qu’il leur rendrait
  rationale: ὁρισμός peut désigner un engagement, une disposition arrêtée ou un accord. La traduction intègre cette idée au contenu de la garantie, tandis que la note conserve l’ambiguïté du grec.
- source_word: τούτους ἀπημάντους
  choice: ces hommes sains et saufs
  rationale: ἀπήμαντος signifie « indemne, sans dommage ». « Sains et saufs » convient au contexte de personnes retenues et menacées.
- source_word: ἀπέλυσαν αὐτόν
  choice: ils le relâchèrent
  rationale: ἀπολύω désigne directement l’action de libérer ou de laisser partir une personne détenue.
- source_word: ἕνεκα τῆς τῶν ἀδελφῶν σωτηρίας
  choice: pour la sauvegarde de leurs frères
  rationale: σωτηρία peut signifier salut, délivrance ou préservation. « Sauvegarde » garde l’idée de mise à l’abri dans ce contexte de captivité sans imposer un sens exclusivement théologique.
theological_decisions:
- issue: Sens de σωτηρία dans un récit militaire
  choice: sauvegarde
  alternative: salut ou délivrance
  rationale: Le contexte immédiat porte sur la préservation physique de proches retenus en danger. « Sauvegarde » exprime ce sens tout en signalant en note l’étendue sémantique du terme grec.
- issue: Référent de ἀδελφῶν
  choice: leurs frères
  alternative: les frères ou leurs proches
  rationale: Le grec emploie un masculin pluriel concret et le contexte précédent mentionne des frères. La traduction conserve donc « frères » sans neutraliser le référent.
- issue: Valeur de ὁρισμός
  choice: engagement implicite dans « garanti qu’il leur rendrait »
  alternative: l’accord ou la disposition arrêtée de les rendre
  rationale: La syntaxe grecque permet de percevoir un engagement ou un accord formel. Le texte principal reste idiomatique, et la note maintient cette nuance plutôt que de la supprimer.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase demeure fluide tout en conservant par des notes l’ambiguïté de ὁρισμός et la gamme de sens de σωτηρία.
