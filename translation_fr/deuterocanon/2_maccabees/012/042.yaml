  text: they turned to supplication[a], asking that the sin that had been committed might be completely blotted out. But the noble Judas urged the multitude to keep themselves free from sin, since they had seen before their eyes the things that had happened because of the sin of those who had fallen.
translation:
  language: fr
  text: Ils se tournèrent vers la supplication, demandant que le péché commis soit entièrement effacé. Mais Judas le vaillant exhorta la foule à rester sans péché[a], puisqu’ils avaient vu de leurs propres yeux ce qui était arrivé à cause du péché de ceux qui étaient tombés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à rester exempts de péché » ou « à se préserver du péché ». Le grec dit littéralement qu’ils doivent se maintenir « sans péché ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἱκεσίαν ἐτράπησαν
  choice: Ils se tournèrent vers la supplication
  rationale: La tournure conserve le mouvement exprimé par ἐτράπησαν et la valeur solennelle, insistante et pétitionnaire de ἱκεσία.
- source_word: ἀξιώσαντες
  choice: demandant
  rationale: Le participe introduit le contenu de leur requête; « demandant » est naturel et n’intensifie pas indûment le grec.
- source_word: τὸ γεγονὸς ἁμάρτημα
  choice: le péché commis
  rationale: Cette formulation rend naturellement en français le péché comme fait accompli, valeur portée par le participe parfait γεγονός.
- source_word: τελείως ἐξαλειφθῆναι
  choice: soit entièrement effacé
  rationale: « Effacé » conserve l’image de ἐξαλείφω, tandis que « entièrement » représente explicitement τελείως.
- source_word: ὁ δὲ γενναῖος Ἰούδας
  choice: Mais le noble Judas
  rationale: γενναῖος peut évoquer la noblesse ou la bravoure; « noble » maintient ici la caractérisation honorifique sans la limiter au courage militaire.
- source_word: παρεκάλεσε τὸ πλῆθος
  choice: exhorta la foule
  rationale: Dans ce contexte, παρακαλέω a une valeur exhortative; « la foule » rend τὸ πλῆθος dans un français actuel.
- source_word: συντηρεῖν αὐτοὺς ἀναμαρτήτους εἶναι
  choice: à se garder eux-mêmes sans péché
  rationale: La formulation garde la construction comprimée et la force de ἀναμαρτήτους, sans réduire l’exhortation à la seule faute précise évoquée dans le contexte.
- source_word: ὑπʼ ὄψιν ἑωρακότας
  choice: puisqu’ils avaient vu de leurs propres yeux
  rationale: La formulation exprime l’expérience visuelle directe et conserve l’accent vivant de l’idiome grec.
- source_word: τὰ γεγονότα
  choice: ce qui était arrivé
  rationale: Le substantif participial désigne les événements ou leurs conséquences; cette traduction est claire et idiomatique.
- source_word: διὰ τὴν τῶν προπεπτωκότων ἁμαρτίαν
  choice: à cause du péché de ceux qui étaient tombés
  rationale: « Ceux qui étaient tombés » préserve le contexte de la mort au combat, tout en maintenant explicitement le lien causal avec leur péché.
theological_decisions:
- issue: Portée morale de ἀναμαρτήτους
  choice: sans péché
  alternative: à l’abri du péché; exempts de péché
  rationale: Le grec emploie un adjectif fort signifiant « sans péché ». Le texte principal en conserve la tension sans la ramener silencieusement à l’évitement de cette seule transgression; la note signale des formulations françaises possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec tout en évitant les tournures archaïques; le contraste introduit par δέ et la causalité finale sont conservés.
