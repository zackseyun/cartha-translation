    issue: Discordance syntaxique et pronominale dans « exhorta la foule à se garder eux-mêmes sans péché ».
    rationale: « La foule » est grammaticalement singulier, tandis que « eux-mêmes » est pluriel. La formulation doit être corrigée; « à rester sans péché » conserve le sens de l’adjectif grec ἀναμαρτήτους et produit une phrase française naturelle.
  - severity: low
    issue: « Le noble Judas » est une tournure peu idiomatique en français contemporain.
    rationale: Le grec γενναῖος peut caractériser Judas comme courageux ou noble. « Judas le vaillant » est une épithète française plus naturelle, tout en préservant cette double coloration honorifique.
