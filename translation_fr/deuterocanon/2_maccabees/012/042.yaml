revisions:
- from: Ils se tournèrent vers la supplication, demandant que le péché commis soit entièrement effacé. Mais le noble Judas exhorta la foule à se garder eux-mêmes sans péché[a], puisqu’ils avaient vu de leurs propres yeux ce qui était arrivé à cause du péché de ceux qui étaient tombés.
  to: Ils se tournèrent vers la supplication, demandant que le péché commis soit entièrement effacé. Mais Judas le vaillant exhorta la foule à rester sans péché[a], puisqu’ils avaient vu de leurs propres yeux ce qui était arrivé à cause du péché de ceux qui étaient tombés.
  rationale: La révision corrige la discordance entre « la foule » et « eux-mêmes » sans modifier le sens. Elle remplace aussi l’épithète calquée « le noble Judas » par la formule française plus naturelle « Judas le vaillant ». La note reste ancrée sur « sans péché » et présente des équivalents qui respectent la force de ἀναμαρτήτους sans trancher au-delà du texte.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T12:39:32Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens du grec est globalement bien rendu : la supplication, la demande d’effacement complet du péché, l’exhortation de Judas et le lien causal avec le péché des morts au combat sont conservés. La construction « se garder eux-mêmes » est toutefois grammaticalement incompatible avec l’antécédent collectif singulier « la foule ».'
  naturalness: Le texte est digne et clair dans l’ensemble. « Judas le vaillant » est plus idiomatique en français biblique moderne que « le noble Judas », et « rester sans péché » rend naturellement l’état exprimé par ἀναμαρτήτους εἶναι sans l’incohérence pronominale du projet.
  terminology: « Supplication », « péché », « entièrement effacé » et « ceux qui étaient tombés » conviennent. « Vaillant » conserve la portée honorifique et courageuse de γενναῖος sans imposer une interprétation doctrinale.
  issues:
