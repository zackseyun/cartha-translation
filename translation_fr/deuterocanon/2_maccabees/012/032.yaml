  yaml_path: translation/deuterocanon/2_maccabees/012/032.yaml
  text: But after the so-called Pentecost, they moved out against Gorgias, the governor of Idumea.
translation:
  language: fr
  text: Mais après la fête appelée Pentecôte[a], ils se mirent en marche contre Gorgias, le commandant de l’Idumée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « celle qui est appelée Pentecôte ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme grec peut aussi désigner un gouverneur ou un général.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ
  choice: après
  rationale: La préposition a ici un sens temporel et situe l’expédition après la fête.
- source_word: τὴν λεγομένην πεντηκοστήν
  choice: la fête dite de la Pentecôte
  rationale: « Dite » rend λεγομένην sans la nuance sceptique que « soi-disant » aurait souvent en français moderne. L’ajout explicatif « fête » donne naturellement le référent de Pentecôte dans ce contexte.
- source_word: ὥρμησαν
  choice: ils partirent
  rationale: Le verbe désigne ici la mise en mouvement d’une troupe; « partirent » reste naturel sans imposer l’idée d’une ruée.
- source_word: ἐπὶ Γοργίαν
  choice: combattre Gorgias
  rationale: Dans ce contexte militaire, ἐπί avec l’accusatif exprime une direction hostile. Cette formulation française est plus naturelle que « partirent contre ».
- source_word: στρατηγόν
  choice: le commandant
  rationale: στρατηγός désigne couramment un chef militaire; « commandant » convient au cadre de campagne tout en évitant de préciser un grade moderne.
- source_word: Ἰδουμαίας
  choice: de l’Idumée
  rationale: « Idumée » est la forme française traditionnelle du nom géographique grec Ἰδουμαία.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Fête dite » préserve la formulation grecque sans suggérer le doute; le mouvement militaire est exprimé clairement sans surtraduire sa rapidité.
