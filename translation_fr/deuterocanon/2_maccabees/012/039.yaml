  text: On the following day[a], the men with Judas came, when the need had arisen, to gather up the bodies of those who had fallen and to restore them with their relatives to the tombs of their fathers.
translation:
  language: fr
  text: Le lendemain, ceux qui étaient avec Judas vinrent, alors que les circonstances rendaient nécessaire de recueillir les corps de ceux qui étaient tombés et de les ramener avec leurs proches dans les tombeaux de leurs ancêtres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ δὲ ἐχομένῃ
  choice: Le lendemain
  rationale: Expression temporelle idiomatique et naturelle en français, correspondant au jour suivant.
- source_word: οἱ περὶ τὸν Ἰούδαν
  choice: les hommes qui accompagnaient Judas
  rationale: Rend le groupe réuni autour de Judas sans ajouter une qualification militaire absente du grec.
- source_word: καθʼ ὃν χρόνον τὸ τῆς χρείας ἐγέγονει
  choice: puisque la nécessité s’en imposait
  rationale: Reproduit l’idée que les circonstances rendaient désormais l’action nécessaire, dans un français narratif fluide.
- source_word: τὰ σώματα τῶν προπεπτωκότων
  choice: les corps de ceux qui étaient tombés
  rationale: Conserve l’image verbale des hommes tombés, ici au combat, sans explicitation superflue.
- source_word: ἀνακομίσασθαι
  choice: relever
  rationale: Dans ce contexte, le verbe désigne la récupération des corps sur le lieu du combat; « relever » est naturel et digne en français.
- source_word: ἀποκαταστῆσαι
  choice: les ramener
  rationale: Exprime le retour des corps vers le lieu familial qui leur revient; « restaurer » serait artificiel en français dans ce contexte funéraire.
- source_word: μετὰ τῶν συγγενῶν
  choice: auprès des leurs
  rationale: Rend naturellement l’association avec les proches ou membres de la parenté, tout en évitant de préciser abusivement s’ils sont vivants ou déjà ensevelis.
- source_word: εἰς τοὺς πατρῴους τάφους
  choice: dans les tombeaux de leurs ancêtres
  rationale: Rend le sens ancestral de πατρῴους et la destination funéraire indiquée par εἰς.
theological_decisions:
- issue: Lieu d’ensevelissement et double accent familial
  choice: les ramener auprès des leurs, dans les tombeaux de leurs ancêtres
  alternative: les remettre avec leurs proches dans les tombeaux de leurs pères
  rationale: La formulation conserve séparément la mention de la parenté et celle des tombeaux ancestraux, sans les fondre en une seule idée ni imposer une interprétation doctrinale.
translation_notes:
  register: Français moderne international, narratif et digne. La phrase suit la structure du grec tout en évitant les calques peu naturels. « Auprès des leurs » préserve une légère ouverture quant au rapport exact avec les συγγενεῖς.
