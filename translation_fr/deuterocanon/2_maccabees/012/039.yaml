review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : le groupe de Judas vient récupérer les corps des morts et les ramener pour une sépulture familiale ancestrale. Toutefois, « puisque la nécessité s’en imposait » transforme de façon peu exacte la circonstance temporelle grecque en une justification causale et est maladroit. « Auprès des leurs » atténue aussi la mention explicite des συγγενεῖς (« proches/parents »).'
  naturalness: Le registre est globalement narratif et digne, mais « puisque la nécessité s’en imposait » n’est pas idiomatique dans ce contexte. Une formulation temporelle plus directe rend mieux le grec et améliore la fluidité.
  terminology: « Le lendemain », « ceux qui étaient tombés » et « tombeaux de leurs ancêtres » conviennent. « Recueillir les corps » est plus naturel et plus précis ici que « relever les corps ». « Ceux qui étaient avec Judas » préserve la portée collective de οἱ περὶ τὸν Ἰούδαν sans ajouter un titre militaire.
  issues:
  - severity: medium
    issue: Valeur de la proposition temporelle
    rationale: « Puisque » introduit normalement une cause, tandis que καθʼ ὃν χρόνον introduit ici le moment ou les circonstances où l’action était devenue nécessaire. Il faut une formulation temporelle/non causale.
  - severity: low
    issue: Référence aux συγγενεῖς insuffisamment explicite
    rationale: « Auprès des leurs » est élégant, mais moins explicite que le grec, qui nomme les proches ou parents. « Avec leurs proches » conserve cette donnée tout en laissant ouverte la nuance spatiale exacte.
  - severity: low
    issue: Verbe de récupération des corps
    rationale: Dans ce contexte funéraire, « recueillir les corps » est plus idiomatique que « relever les corps », tout en rendant adéquatement ἀνακομίσασθαι.
  revised_text: Le lendemain, ceux qui étaient avec Judas vinrent, alors que les circonstances rendaient nécessaire de recueillir les corps de ceux qui étaient tombés et de les ramener avec leurs proches dans les tombeaux de leurs ancêtres.
