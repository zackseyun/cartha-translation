  rationale: La révision conserve les deux éléments familiaux distincts du grec, les proches et les tombeaux ancestraux, tout en remplaçant la causalité artificielle de « puisque » par une indication circonstancielle. Elle n’ajoute aucune interprétation doctrinale ou militaire.
