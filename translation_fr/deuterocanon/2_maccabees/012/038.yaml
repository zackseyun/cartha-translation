  yaml_path: translation/deuterocanon/2_maccabees/012/038.yaml
  text: Then Judas[a], taking the army, came to the city of Odollam. And as the week was ending, they purified themselves there according to the custom and spent the Sabbath there.
translation:
  language: fr
  text: Puis Judas prit l’armée avec lui et arriva dans la ville d’Odollam. Comme la semaine avançait[a], ils se purifièrent là selon la coutume et y passèrent le sabbat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus littéralement, « comme la semaine survenait ». Le contexte et la mention du sabbat juste après indiquent que le septième jour approchait.
    reason: Alternative lexicale et clarification d’une expression temporelle ambiguë.
lexical_decisions:
- source_word: ἀναλαβὼν τὸ στράτευμα
  choice: prit l’armée avec lui
  rationale: Le participe exprime ici que Judas emmène le corps militaire dans la poursuite du déplacement. Cette formulation reste proche du grec tout en étant naturelle en français.
- source_word: ἧκεν
  choice: arriva
  rationale: Le verbe marque l’arrivée à un lieu; « arriva » rend cette valeur plus précisément que le simple « vint ».
- source_word: Ὀδολλὰμ πόλιν
  choice: dans la ville d’Odollam
  rationale: Le nom commun πόλις est explicitement conservé, et le toponyme est translittéré.
- source_word: τῆς ... ἑβδομάδος ἐπιβαλλούσης
  choice: comme la semaine avançait
  rationale: Cette traduction conserve l’image temporelle du grec et son imprécision relative, tandis que la note indique que le contexte évoque l’approche du septième jour.
- source_word: κατὰ τὸν ἐθισμόν
  choice: selon la coutume
  rationale: ἐθισμός désigne une pratique habituelle; « selon la coutume » est clair et digne.
- source_word: ἁγνισθέντες
  choice: ils se purifièrent
  rationale: Le verbe porte ici une nuance rituelle que « se purifièrent » préserve mieux que « se lavèrent » ou « se nettoyèrent ».
- source_word: τὸ σάββατον διῆγεν
  choice: y passèrent le sabbat
  rationale: διῆγεν signifie passer une période de temps. La traduction n’ajoute pas une précision liturgique absente du verbe.
theological_decisions:
- issue: La purification avant le sabbat
  choice: ils se purifièrent là selon la coutume
  alternative: ils se lavèrent là comme d’habitude
  rationale: Le choix maintient la portée rituelle de ἁγνισθέντες sans préciser un rite particulier que le texte ne décrit pas.
- issue: Le sens de la proposition temporelle
  choice: comme la semaine avançait
  alternative: comme le septième jour approchait
  rationale: Le grec parle littéralement de la semaine qui avance ou survient. Le contexte du sabbat permet de comprendre l’approche du septième jour, mais le texte principal conserve l’ambiguïté de l’expression.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe narrative reste fluide; le vocabulaire rituel est conservé sans ajout confessionnel.
