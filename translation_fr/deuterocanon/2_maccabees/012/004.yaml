  source_fidelity: La tournure causale « puisqu’ils voulaient » ne rend pas la valeur d’apparence ou de présentation de ὡς ἂν. De plus, « ne se doutaient de rien » interprète μηδὲν ὑπόπτον ἐχόντων comme une absence de soupçon, alors que le grec peut aussi viser l’absence de caractère ou d’intention suspecte. La révision conserve cette ambiguïté au moyen d’une formulation littérale soutenue par une note.
  naturalness: Le texte révisé demeure fluide en français narratif moderne. « Résolution publique » est plus naturel et plus institutionnel que « décision collective », tout en évitant de faire de la mesure un édit.
  terminology: « Résolution publique de la ville » rend le caractère civique et officiel de τὸ κοινὸν τῆς πόλεως ψήφισμα. « N’étaient pas moins de deux cents » préserve exactement la borne inférieure de οὐκ ἔλαττον.
