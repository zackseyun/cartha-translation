revisions:
- from: Mais, après une décision collective de la ville, ces hommes l’acceptèrent, puisqu’ils voulaient vivre en paix et ne se doutaient de rien[a]. On les emmena alors et on les noya ; ils étaient au moins deux cents.
  to: Mais, après la résolution publique de la ville, alors que ces hommes l’avaient acceptée comme s’ils voulaient vivre en paix et n’avaient rien de suspect[a], on les emmena et on les noya ; ils n’étaient pas moins de deux cents.
  rationale: 'La révision rétablit la nuance non factuelle de ὡς ἂν par « comme s’ils », sans attribuer un mobile certain aux victimes. Elle remplace l’interprétation étroite « ne se doutaient de rien » par « n’avaient rien de suspect », dont la note explicite les deux lectures possibles. La syntaxe conserve la succession des événements : résolution, acceptation, conduite des hommes, puis noyade.'
