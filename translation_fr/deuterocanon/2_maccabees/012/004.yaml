base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/004.yaml
  text: But after the common resolution of the city[a], and when these men had accepted it as though they wanted peace and had nothing suspicious in mind, they took them away and drowned them, no fewer than two hundred of them.
translation:
  language: fr
  text: Mais, après la résolution publique de la ville, alors que ces hommes l’avaient acceptée comme s’ils voulaient vivre en paix et n’avaient rien de suspect[a], on les emmena et on les noya ; ils n’étaient pas moins de deux cents.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne nourrissaient aucun dessein suspect ». La formule grecque peut désigner soit l’absence de quelque chose de suspect chez eux, soit l’absence d’intention suspecte.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ κοινὸν τῆς πόλεως ψήφισμα
  choice: une décision collective de la ville
  rationale: ψήφισμα désigne une décision officielle ou une résolution ; « décision collective » rend aussi la portée civique de κοινόν sans suggérer un édit royal.
- source_word: τούτων ἐπιδεξαμένων
  choice: ces hommes l’acceptèrent
  rationale: ἐπιδέχομαι exprime ici l’acceptation ou l’assentiment à la décision de la ville.
- source_word: ὡς ἂν εἰρηνεύειν θέλοντων
  choice: puisqu’ils voulaient vivre en paix
  rationale: La tournure présente leur désir de paix comme la disposition expliquant leur acceptation. « Vivre en paix » rend naturellement l’emploi intransitif de εἰρηνεύειν.
- source_word: μηδὲν ὑπόπτον ἐχόντων
  choice: ne se doutaient de rien
  rationale: La formule peut indiquer qu’ils n’avaient aucun soupçon, lecture naturelle dans le contexte de leur acceptation confiante. Une note conserve l’autre possibilité lexicale, selon laquelle rien de suspect ne leur était attribué.
- source_word: ἀχθέντας
  choice: on les emmena alors
  rationale: Le participe passif de ἄγω signifie qu’ils furent conduits ou emmenés ; cette formulation n’ajoute aucune destination absente du grec.
- source_word: ἐβύθισαν
  choice: on les noya
  rationale: βυθίζω signifie faire sombrer ou plonger dans les profondeurs ; avec des personnes pour objet, « noyer » exprime clairement l’action et son issue.
- source_word: ὄντας οὐκ ἔλαττον τῶν διακοσίων
  choice: ils étaient au moins deux cents
  rationale: Cette formulation idiomatique conserve la valeur de borne inférieure de οὐκ ἔλαττον.
