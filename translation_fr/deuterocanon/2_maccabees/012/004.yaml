    issue: « ne se doutaient de rien »
    rationale: Cette expression impose la lecture « ils n’avaient aucun soupçon ». μηδὲν ὑπόπτον ἐχόντων peut aussi signifier qu’ils n’avaient rien de suspect, notamment aucune intention suspecte. La traduction et la note doivent préserver cette alternative.
