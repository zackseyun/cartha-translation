revisions:
- from: Mais comme les hommes qui étaient avec Esdris combattaient depuis longtemps et étaient épuisés, Judas invoqua le Seigneur pour qu’il se manifeste comme leur allié et marche à leur tête dans le combat[a].
  to: Mais ceux qui étaient avec Esdris combattaient depuis plus longtemps et étaient épuisés ; Judas invoqua le Seigneur pour qu’il se manifeste comme allié et qu’il se manifeste comme guide dans le combat[a].
  rationale: La révision maintient la formulation française naturelle tout en rendant explicitement les deux occurrences de φανῆναι. Elle restitue également la nuance comparative de ἐπὶ πλεῖον. Aucun élément ne tranche si la manifestation demandée est visible ou métaphorique.
