base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/036.yaml
  text: But those with Esdrin were fighting for a longer time and were exhausted[a], so Judas called on the Lord to appear as an ally and as the leader of the battle.
translation:
  language: fr
  text: Mais ceux qui étaient avec Esdris combattaient depuis plus longtemps et étaient épuisés ; Judas invoqua le Seigneur pour qu’il se manifeste comme allié et qu’il se manifeste comme guide dans le combat[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour qu’il se montre comme allié et comme guide dans le combat ». Le grec répète le verbe « se manifester / apparaître » pour les deux fonctions ; προοδηγός désigne celui qui va devant pour guider.'
    reason: Alternative lexicale pour φαίνω et προοδηγός, et signalement de la répétition présente dans le grec.
lexical_decisions:
- source_word: τῶν δὲ περὶ τὸν Ἔσδριν
  choice: Mais comme les hommes qui étaient avec Esdris
  rationale: La tournure περὶ + accusatif désigne le groupe associé à Esdris, sans préciser davantage son organisation ou son rang militaire.
- source_word: ἐπὶ πλεῖον μαχομένων
  choice: combattaient depuis longtemps
  rationale: Dans ce contexte, ἐπὶ πλεῖον indique surtout la prolongation du combat; l’imparfait français restitue son déroulement continu.
- source_word: κατακόπων ὄντων
  choice: étaient épuisés
  rationale: κατάκοπος exprime une grande fatigue causée par l’effort; « épuisés » en garde la force avec naturel.
- source_word: ἐπικαλεσάμενος
  choice: invoqua
  rationale: Dans une adresse à Dieu, le verbe signifie appeler à l’aide ou invoquer; « invoqua » convient au registre biblique tout en restant courant.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Dans ce contexte juif de prière, κύριος désigne Dieu; « le Seigneur » est la formulation française naturelle et révérencielle.
- source_word: σύμμαχον φανῆναι
  choice: qu’il se manifeste comme leur allié
  rationale: σύμμαχος conserve l’image militaire de celui qui combat aux côtés d’un autre, tandis que « se manifeste » préserve la portée de φαίνω sans imposer une apparition visible.
- source_word: προοδηγὸν φανῆναι τοῦ πολέμου
  choice: marche à leur tête dans le combat
  rationale: προοδηγός désigne celui qui va devant pour guider. Cette formulation restitue concrètement cette image dans le cadre du combat, sans faire de Dieu un simple commandant humain.
theological_decisions:
- issue: Valeur de κύριος dans l’invocation
  choice: le Seigneur
  alternative: le Maître
  rationale: Judas invoque ici Dieu. « Le Seigneur » rend l’usage religieux de κύριος sans atténuer sa portée théologique.
- issue: Nature de la manifestation divine exprimée par φανῆναι
  choice: qu’il se manifeste comme leur allié
  alternative: qu’il leur apparaisse comme allié
  rationale: Le grec évoque une intervention divine rendue manifeste, mais ne précise pas s’il s’agit d’une apparition visible. « Se manifeste » maintient cette ambiguïté.
- issue: Image de Dieu comme προοδηγός
  choice: marche à leur tête dans le combat
  alternative: se montre leur guide dans le combat
  rationale: Le choix retenu préserve l’image de celui qui va devant, tout en évitant de définir la forme précise de l’intervention divine.
translation_notes:
  register: Français international moderne, clair et digne. La phrase rend le génitif absolu grec par une subordonnée causale naturelle. « Esdris » suit la forme française traditionnelle du nom grec Ἔσδριν. Le vocabulaire militaire est conservé sans surinterpréter la manière dont le Seigneur intervient.
