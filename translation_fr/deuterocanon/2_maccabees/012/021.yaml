base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/021.yaml
  text: But when Timothy learned of Judas’s advance[a], he sent the women and the rest of the baggage ahead to the place called Carnion, for the place was hard to besiege and difficult to approach because of the narrowness of all the surrounding terrain.
translation:
  language: fr
  text: Mais quand Timothée apprit que Judas avançait, il envoya d’avance les femmes et le reste des bagages au lieu appelé Carnion. En effet, ce lieu était difficile à assiéger et difficile d’accès, car tous les passages environnants étaient étroits.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « à cause de l’étroitesse de tous les lieux », expression qui paraît désigner les accès resserrés autour du site.'
    reason: La formulation grecque est générale; la traduction « passages environnants » en explicite le sens topographique probable.
lexical_decisions:
- source_word: τὴν ... ἔφοδον ... Ἰούδου
  choice: que Judas avançait
  rationale: Dans ce contexte militaire, ἔφοδος désigne l’approche ou l’avancée des forces de Judas. Cette formulation naturelle garde le mouvement menaçant sans affirmer qu’un assaut avait déjà commencé.
- source_word: μεταλαβὼν
  choice: apprit
  rationale: Le participe exprime ici le fait de recevoir une information ou d’avoir connaissance de l’avancée de Judas.
- source_word: προεξαπέστειλεν
  choice: envoya d’avance
  rationale: Le verbe composé marque explicitement un envoi préalable, avant l’arrivée de Judas.
- source_word: τὰς γυναῖκας καὶ τὴν ἄλλην ἀποσκευήν
  choice: les femmes et le reste des bagages
  rationale: ἀποσκευή désigne les bagages, les biens ou le matériel transportable; ἄλλην se rend naturellement par « le reste des » après la mention des femmes.
- source_word: εἰς τὸ λεγόμενον Κάρνιον
  choice: au lieu appelé Carnion
  rationale: La tournure identifie simplement le lieu par son nom, sans la nuance péjorative que peut avoir « prétendu » ou « soi-disant ».
- source_word: δυσπολιόρκητον
  choice: difficile à assiéger
  rationale: Le terme décrit un site qui se prête mal à un siège, dans un sens nettement militaire.
- source_word: δυσπρόσιτον
  choice: difficile d’accès
  rationale: Cette expression française rend clairement la difficulté concrète d’atteindre le lieu sans suggérer une inaccessibilité absolue.
- source_word: διὰ τὴν πάντων τῶν τόπων στενότητα
  choice: car tous les passages environnants étaient étroits
  rationale: Le grec parle littéralement de l’étroitesse de tous les lieux. Dans le contexte topographique et militaire, « passages environnants » explicite avec prudence les accès resserrés au site.
