  text: τὴν δὲ ἔφοδον μεταλαβὼν Ἰούδου, προεξαπέστειλεν ὁ Τιμόθεος τὰς γυναῖκας καὶ τὴν ἄλλην ἀποσκευήν εἰς τὸ λεγόμενον Κάρνιον· ἦν γὰρ δυσπολιόρκητον καὶ δυσπρόσιτον τὸ χωρίον διὰ τὴν πάντων τῶν τόπων στενότητα.
