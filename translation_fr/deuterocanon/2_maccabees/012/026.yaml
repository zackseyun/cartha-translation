translation:
  language: fr
  text: Puis il marcha contre Carnion et Atargation[a], et massacra vingt-cinq mille personnes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « le sanctuaire d’Atargatis »; le terme grec peut désigner un lieu consacré à cette déesse plutôt qu’une seconde ville.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « deux myriades de corps et cinq mille », soit vingt-cinq mille tués.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξελθὼν
  choice: il marcha
  rationale: Le participe signifie littéralement « étant sorti »; dans ce récit militaire, « il marcha » exprime naturellement le déplacement vers une nouvelle cible sans ajouter l’idée plus précise d’un assaut.
- source_word: ἐπὶ
  choice: contre
  rationale: Avec l’accusatif et dans ce contexte hostile, ἐπί marque le mouvement dirigé contre une cible.
- source_word: τὸ Κάρνιον
  choice: Carnion
  rationale: Le nom de lieu est translittéré sous une forme adaptée au français.
- source_word: τὸ Ἀτεργάτιον
  choice: Atargation
  rationale: La forme grecque neutre est rendue comme un nom propre; son identification possible comme sanctuaire d’Atargatis est conservée en note plutôt que tranchée dans le texte.
- source_word: κατέσφαξεν
  choice: massacra
  rationale: Le verbe désigne une mise à mort violente et massive; « massacra » en conserve la force en français courant et digne.
- source_word: μυριάδας σωμάτων δύο πεντακισχιλίους
  choice: vingt-cinq mille personnes
  rationale: L’expression numérique totalise 25 000. σωμάτων signifie littéralement « corps », mais sert ici à compter les êtres humains tués; « personnes » évite de préciser leur sexe sans fondement grammatical suffisant.
