translation:
  language: fr
  text: Tous bénirent donc les œuvres du Seigneur, le juste Juge[a], qui rend manifestes les choses cachées,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les actes du Seigneur, le juste Juge ». Le grec est elliptique; littéralement : « les choses du Seigneur, le juste juge ».'
    reason: L’expression τὰ τοῦ δικαιοκρίτου κυρίου contient un neutre pluriel elliptique. « Œuvres » l’explicite de manière sobre; « actes » est une autre explicitation possible.
lexical_decisions:
- source_word: εὐλογήσαντες
  choice: bénirent
  rationale: Le participe aoriste est rendu par un verbe conjugué pour former une phrase française naturelle. « Bénirent » conserve le sens religieux d’une parole de louange adressée à Dieu.
- source_word: τὰ τοῦ δικαιοκρίτου κυρίου
  choice: les œuvres du Seigneur, le juste Juge
  rationale: Le neutre pluriel τὰ suivi du génitif est elliptique et désigne ce qui relève du Seigneur, probablement ses actes. « Œuvres » explicite sobrement l’ellipse sans réduire la portée aux seules paroles ou décisions.
- source_word: δικαιοκρίτου
  choice: le juste Juge
  rationale: Le composé désigne celui qui juge avec justice. « Juste Juge » est clair, digne et conserve à la fois l’idée de justice et celle de jugement.
- source_word: κυρίου
  choice: Seigneur
  rationale: Dans ce contexte, κύριος est un titre divin; « Seigneur » est son équivalent biblique courant.
- source_word: τὰ κεκρυμμένα
  choice: les choses cachées
  rationale: Le participe parfait passif substantivé au pluriel est conservé par une expression nominale française, sans préciser indûment la nature de ce qui est caché.
- source_word: φανερὰ ποιοῦντος
  choice: qui rend manifestes
  rationale: Cette formulation garde la valeur causative de ποιέω et l’opposition explicite entre ce qui est caché et ce qui devient manifeste.
theological_decisions:
- issue: Interprétation de l’expression elliptique τὰ τοῦ δικαιοκρίτου κυρίου
  choice: les œuvres du Seigneur, le juste Juge
  alternative: le Seigneur, le juste Juge
  rationale: La présence de l’article neutre pluriel τὰ invite à comprendre un nom sous-entendu comme « œuvres » ou « actes ». Comme l’ellipse reste réelle, la note signale la lecture plus condensée qui prend directement le Seigneur comme objet de la bénédiction.
- issue: Titre divin κύριος
  choice: Seigneur
  alternative: Maître
  rationale: Le référent est Dieu et le contexte emploie κύριος comme titre divin; « Seigneur » respecte l’usage biblique sans introduire la nuance sociale de « Maître ».
translation_notes:
  register: Français international moderne, soutenu mais accessible. La majuscule à « Juge » marque ici un titre divin; la ponctuation finale conserve la continuité syntaxique du verset source.
