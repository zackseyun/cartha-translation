  yaml_path: translation/deuterocanon/2_maccabees/012/037.yaml
  text: Beginning the battle cry in the language of his fathers[a], with hymns[b], he shook those around Gorgias by surprise and put them to flight.
translation:
  language: fr
  text: Entonnant dans la langue de ses ancêtres[a] le cri de guerre accompagné d’hymnes, il surprit et ébranla les hommes de Gorgias, puis les mit en fuite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la langue ancestrale ». Le grec peut mettre l’accent sur la langue employée ou sur le caractère ancestral de la voix ou du cri.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταρξάμενος
  choice: Entonnant
  rationale: Le participe aoriste moyen présente l’action initiale de Judas. « Entonnant » convient naturellement à un cri accompagné d’hymnes et conserve l’idée qu’il en prend l’initiative.
- source_word: τῇ πατρίῳ φωνῇ
  choice: dans la langue de ses ancêtres
  rationale: πατρίῳ évoque ce qui est ancestral, tandis que φωνή peut désigner la voix, la parole ou la langue. Ici, la langue employée pour le cri est probablement visée, sans exclure entièrement la nuance d’une voix ou formule ancestrale.
- source_word: τὴν μεθʼ ὕμνων κραυγήν
  choice: le cri de guerre accompagné d’hymnes
  rationale: κραυγή désigne un cri puissant et prend dans ce contexte une valeur militaire; μεθʼ ὕμνων indique que des hymnes l’accompagnent. La formulation garde ensemble les dimensions guerrière et religieuse.
- source_word: ἐνσείσας
  choice: ébranla
  rationale: Le verbe signifie littéralement secouer. « Ébranla » préserve cette image vive tout en exprimant le trouble causé chez l’ennemi.
- source_word: ἀπροσδοκήτως
  choice: surprit
  rationale: L’adverbe signifie « de façon inattendue ». Le rendre par « surprit » exprime clairement l’effet tactique sans alourdir la phrase.
- source_word: τοῖς περὶ τὸν Γοργίαν
  choice: les hommes de Gorgias
  rationale: L’expression désigne le groupe ou les forces entourant Gorgias. « Les hommes de Gorgias » est naturel en français et approprié au contexte militaire.
- source_word: τροπὴν ἐποιήσατο αὐτῶν
  choice: les mit en fuite
  rationale: Dans l’usage militaire, τροπή désigne le fait de tourner le dos, la déroute ou la fuite. « Mettre en fuite » restitue clairement l’idiome grec.
theological_decisions:
- issue: Dimension religieuse du cri
  choice: Un cri de guerre accompagné d’hymnes
  alternative: Un cri de louange ou un cri chanté sous forme d’hymne
  rationale: Le grec associe κραυγή à μεθʼ ὕμνων. La traduction conserve donc à la fois l’action militaire et l’expression cultuelle, sans développer une affirmation doctrinale absente du texte.
translation_notes:
  register: Français moderne international, digne et accessible. La syntaxe participiale du grec est conservée sous une forme fluide; « cri de guerre », « hymnes » et « ébranla » maintiennent les images militaire, religieuse et physique du texte.
