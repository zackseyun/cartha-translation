  yaml_path: translation/deuterocanon/2_maccabees/012/044.yaml
  text: For if he were not expecting those who had fallen to rise again[a], it would be excessive and foolish to pray for the dead.
translation:
  language: fr
  text: Car s’il ne s’attendait pas à ce que ceux qui étaient tombés[a] ressuscitent, il serait superflu et insensé de prier pour les morts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui étaient morts » ; littéralement « ceux qui étaient tombés ».
    reason: Alternative lexicale explicitant le sens contextuel de l’image grecque.
lexical_decisions:
- source_word: προπεπτωκότας
  choice: ceux qui étaient tombés
  rationale: Le participe parfait conserve l’image grecque de personnes « tombées » tout en évoquant naturellement, dans ce contexte militaire, ceux qui sont morts au combat.
- source_word: ἀναστῆναι
  choice: ressuscitent
  rationale: Dans ce contexte, le verbe désigne sans ambiguïté le retour à la vie lors de la résurrection. « Ressuscitent » est naturel en français et ne force pas une tournure passive absente de la forme grecque.
- source_word: προσεδόκα
  choice: s’attendait
  rationale: Le verbe exprime l’attente ou l’anticipation. Ce choix convient au raisonnement conditionnel sans ajouter la nuance affective de « espérer ».
- source_word: περισσὸν
  choice: superflu
  rationale: Le terme qualifie ce qui est en trop ou inutile. « Superflu » en conserve précisément la portée sans expliciter davantage la conclusion.
- source_word: ληρῶδες
  choice: insensé
  rationale: L’adjectif évoque ce qui relève de la sottise ou du non-sens. « Insensé » restitue clairement sa force rhétorique dans un registre digne.
- source_word: ὑπὲρ νεκρῶν
  choice: pour les morts
  rationale: Avec le génitif, ὑπέρ signifie ici « pour » ou « en faveur de ». La formule française exprime naturellement la prière faite en leur faveur.
- source_word: εὔχεσθαι
  choice: prier
  rationale: Dans ce contexte, l’infinitif désigne l’acte de prier. « Prier » est la formulation française la plus directe et naturelle.
theological_decisions:
- issue: L’attente de la résurrection comme fondement de la prière pour les morts
  choice: 'Le raisonnement conditionnel est rendu directement : si les hommes tombés ne devaient pas ressusciter, prier pour les morts serait superflu et insensé.'
  alternative: Préciser qu’il s’agit de la résurrection corporelle, ou développer la nature et l’effet de cette prière.
  rationale: Le grec établit le lien entre l’attente de la résurrection et la prière pour les morts sans exposer une doctrine plus détaillée. La traduction préserve ce lien et sa tension théologique sans importer de formulation ultérieure sur l’état intermédiaire ou la purification.
translation_notes:
  register: Français international moderne, clair et digne. La structure conditionnelle demeure proche du grec, tandis que « ressuscitent » rend explicitement et naturellement le sens contextuel de ἀναστῆναι.
