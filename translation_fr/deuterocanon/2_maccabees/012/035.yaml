  text: But a certain Dositheus[a], one of Bacenor’s men, a horseman and a strong man, had hold of Gorgias; and seizing his cloak, he was dragging him along forcefully, intending to take the accursed man alive, when one of the Thracian horsemen rushed upon him and cut off his shoulder, and Gorgias escaped to Marisa.
translation:
  language: fr
  text: Mais un certain Dosithée, l’un des hommes de Bacénor, homme à cheval et robuste, tenait Gorgias. L’ayant empoigné par son manteau, il l’entraînait de force, voulant capturer vivant ce maudit, lorsqu’un des cavaliers thraces fondit sur lui et le frappa grièvement à l’épaule[a]. Gorgias s’échappa alors à Marisa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lui abattit l’épaule » ou « lui trancha l’épaule » ; le grec décrit un coup très grave porté à l’épaule, mais le résultat anatomique exact reste incertain.
    reason: Le verbe grec peut évoquer une épaule abattue ou sectionnée, sans préciser de façon incontestable l’étendue de la blessure.
lexical_decisions:
- source_word: Δωσίθεος
  choice: Dosithée
  rationale: Forme française traditionnelle et intelligible du nom grec.
- source_word: τῶν τοῦ Βακινόρος
  choice: l’un des hommes de Bacénor
  rationale: Rend l’appartenance au groupe de Bacénor sans préciser indûment le rang militaire.
- source_word: ἔφιππος ἀνὴρ καὶ καρτερός
  choice: cavalier robuste
  rationale: Expression française naturelle qui conserve à la fois le fait qu’il combat à cheval et l’idée de vigueur physique.
- source_word: εἶχεν τοῦ Γοργίου
  choice: avait saisi Gorgias
  rationale: Dans cette scène de combat, le tour grec indique que Dosithée tenait physiquement Gorgias.
- source_word: λαβόμενος τῆς χλαμύδος
  choice: l’ayant empoigné par son manteau
  rationale: χλαμύς désigne un manteau, souvent militaire; «empoigné par» exprime clairement la prise énergique.
- source_word: ἦγεν αὐτὸν εὐρώστως
  choice: il l’entraînait de force
  rationale: Le contexte implique que Dosithée tire vigoureusement Gorgias plutôt qu’il ne le conduit paisiblement.
- source_word: βουλόμενον τὸν κατάρατον λαβεῖν ζωγρείαν
  choice: voulait capturer vivant ce maudit
  rationale: Préserve l’intention de faire prisonnier vivant ainsi que la force hostile de l’épithète κατάρατος.
- source_word: τῶν ἱππέων τινὸς Θρακῶν
  choice: un des cavaliers thraces
  rationale: Rendu militaire direct et idiomatique de l’appartenance à la cavalerie thrace.
- source_word: ἐπενεχθέντος αὐτῷ
  choice: fondit sur lui
  rationale: Exprime la soudaineté et la violence du mouvement offensif.
- source_word: τὸν ὦμον καθελόντος
  choice: lui trancha l’épaule
  rationale: Conserve la violence et la possible idée de sectionnement, tout en signalant en note l’incertitude anatomique du grec.
- source_word: διέφυγεν Γοργίας εἰς Μαρισά
  choice: Gorgias s’échappa alors vers Marisa
  rationale: Rend simplement la fuite et sa destination; «alors» explicite le lien narratif sans ajouter de causalité étrangère au contexte.
