    reason: Le verbe grec peut évoquer une épaule abattue ou sectionnée, sans préciser de façon incontestable l’étendue de la blessure.
  revision_rationale: La révision conserve tous les éléments narratifs et l’intention de capture vivante. Elle rend l’attaque contre Dosithée et la gravité du coup, tout en évitant d’imposer dans le texte principal un sectionnement que le grec ne définit pas anatomiquement. La note explicite les options de lecture pertinentes.
