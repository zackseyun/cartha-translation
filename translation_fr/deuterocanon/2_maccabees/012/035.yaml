  to: Mais un certain Dosithée, l’un des hommes de Bacénor, homme à cheval et robuste, tenait Gorgias. L’ayant empoigné par son manteau, il l’entraînait de force, voulant capturer vivant ce maudit, lorsqu’un des cavaliers thraces fondit sur lui et le frappa grièvement à l’épaule[a]. Gorgias s’échappa alors à Marisa.
  rationale: La révision conserve tous les éléments narratifs et l’intention de capture vivante. Elle rend l’attaque contre Dosithée et la gravité du coup, tout en évitant d’imposer dans le texte principal un sectionnement que le grec ne définit pas anatomiquement. La note explicite les options de lecture pertinentes.
