translation_notes:
  register: Français international moderne, narratif et digne. Le nom « Judas », implicite dans la forme verbale grecque mais fourni par le contexte immédiat, est explicité pour éviter une rupture référentielle en français. Les deux notes sont placées sur les expressions grecques auxquelles elles se rapportent effectivement.
