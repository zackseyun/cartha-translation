  yaml_path: translation/deuterocanon/2_maccabees/012/027.yaml
  text: But after the rout and destruction of these men[a], he marched also against Ephron, a fortified city, in which there were mixed multitudes; and strong young men, stationed before the walls, were fighting vigorously[b], while there were many stores of engines and missiles there.
translation:
  language: fr
  text: Après les avoir mis en déroute et anéantis, Judas marcha aussi contre Éphron, une ville fortifiée. Elle abritait une population mêlée[a]. De jeunes hommes robustes, postés devant les murailles, opposaient une résistance vigoureuse, et il y avait aussi de nombreuses réserves de machines de guerre et de projectiles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque peut aussi se traduire par « des foules de toutes sortes » ou « des gens de toutes tribus » ; elle souligne le caractère composite de la population.
    reason: lexical_alternative
  - marker: b
    text: Ou « de nombreux dépôts » ou « stocks » de machines de guerre et de projectiles. Le terme grec peut aussi évoquer leur disposition ou leur mise en place.
    reason: lexical_alternative
lexical_decisions:
- source_word: τροπή καὶ ἀπώλεια
  choice: mis en déroute et anéantis
  rationale: Dans ce contexte militaire, τροπή désigne la mise en fuite ou la déroute, tandis que ἀπώλεια en souligne l’issue destructrice. La tournure verbale est naturelle en français et conserve l’intensité du binôme grec.
- source_word: ἐπεστράτευσεν καὶ ἐπὶ
  choice: marcha aussi contre
  rationale: Le verbe exprime une expédition militaire dirigée contre une cible. « Marcha contre » rend clairement le mouvement offensif.
- source_word: πόλιν ὀχυράν
  choice: une ville fortifiée
  rationale: ὀχυρά qualifie la solidité défensive de la ville ; « fortifiée » est précis et idiomatique.
- source_word: πάμφυλα πλήθη
  choice: une population mêlée
  rationale: L’expression évoque une multitude composée de gens de diverses origines ou catégories. « Population mêlée » restitue ce caractère composite sans imposer une classification ethnique précise.
- source_word: νεανίαι δὲ ῥωμαλέοι
  choice: de jeunes hommes robustes
  rationale: νεανίαι désigne de jeunes hommes et ῥωμαλέοι leur vigueur physique. « Robustes » convient au registre militaire sans ajouter explicitement « guerriers ».
- source_word: πρὸ τῶν τειχῶν καθεστῶτες
  choice: postés devant les murailles
  rationale: καθεστῶτες indique ici une position assignée ou tenue. « Postés » en exprime naturellement la portée militaire.
- source_word: εὐρώστως ἀπεμάχοντο
  choice: opposaient une résistance vigoureuse
  rationale: L’imparfait grec décrit une résistance prolongée, et εὐρώστως en marque l’énergie. Cette formulation française rend à la fois la durée et la force de l’action.
- source_word: ὀργάνων καὶ βελῶν
  choice: machines de guerre et projectiles
  rationale: Dans le contexte du siège, ὄργανα désigne vraisemblablement des engins militaires, tandis que βέλη est un terme large pour les armes lancées ou tirées.
- source_word: πολλαὶ παραθέσεις
  choice: de nombreuses réserves
  rationale: Le contexte favorise l’idée de matériel accumulé et disponible. Le mot peut toutefois évoquer plus littéralement des dispositions ou des agencements, d’où la note.
