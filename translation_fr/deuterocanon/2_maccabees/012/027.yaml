    issue: Note b imprécise et peu idiomatique
    rationale: « dispositifs de machines de guerre et de projectiles » ne constitue pas une alternative française claire. La note devrait signaler que παραθέσεις peut évoquer des dépôts, stocks ou dispositions de matériel.
