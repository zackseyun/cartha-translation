lexical_decisions:
- source_word: μεταλαβών
  choice: lorsque … apprit
  rationale: Le participe indique ici que Judas prend connaissance de ce qui s’est passé; « apprit » est naturel en français et convient au contexte.
- source_word: ὁμοεθνεῖς
  choice: ses compatriotes
  rationale: Le terme désigne ceux qui appartiennent au même peuple; « compatriotes » restitue ce lien sans lourdeur.
- source_word: ὠμότητα
  choice: la cruauté
  rationale: Équivalent direct qui conserve la force morale du grec.
- source_word: παραγγείλας
  choice: il donna ses instructions
  rationale: Le participe aoriste exprime l’action suivante dans cette phrase inachevée; une proposition coordonnée est plus naturelle en français.
- source_word: τοῖς περὶ αὐτὸν ἀνδράσιν
  choice: aux hommes qui l’entouraient
  rationale: Rend l’expression grecque désignant les hommes présents auprès de Judas, vraisemblablement ses compagnons ou soldats, sans préciser davantage que le texte.
