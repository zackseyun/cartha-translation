  yaml_path: translation/deuterocanon/2_maccabees/012/012.yaml
  text: But Judas[a], recognizing that they were truly useful to them in many ways, agreed to keep peace with them; and after giving right hands, they parted to their tents.
translation:
  language: fr
  text: Mais Judas, estimant qu’ils étaient réellement utiles à bien des égards, accepta de maintenir la paix avec eux ; puis, après s’être donné la main droite[a], ils se séparèrent pour aller vers leurs tentes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Se donner la main droite était un geste habituel par lequel on confirmait un accord ou un engagement.
    reason: cultural_note
lexical_decisions:
- source_word: ὑπολαβών
  choice: estimant
  rationale: Le participe introduit ici l’appréciation réfléchie de Judas. « Estimant » conserve la nuance de jugement sans présenter celui-ci comme une certitude imposée par le narrateur.
- source_word: ὡς ἀληθῶς
  choice: réellement
  rationale: L’adverbe renforce le caractère effectif de l’utilité reconnue ; « réellement » est naturel et garde cette insistance.
- source_word: ἐν πολλοῖς
  choice: à bien des égards
  rationale: Cette tournure rend naturellement l’idée d’une utilité dans de nombreux domaines ou sous plusieurs rapports, sans les préciser.
- source_word: χρησίμους
  choice: utiles
  rationale: « Utiles » exprime directement l’avantage pratique évoqué dans ce contexte diplomatique et militaire.
- source_word: ὑπεχώρησεν εἰρήνην ἄξειν πρὸς αὐτούς
  choice: accepta de maintenir la paix avec eux
  rationale: « Accepta » rend la concession ou l’assentiment exprimé par ὑπεχώρησεν, tandis que « maintenir la paix avec eux » traduit l’expression εἰρήνην ἄξειν sans la réduire à la seule conclusion initiale d’un traité.
- source_word: λαβόντες δεξιάς
  choice: après s’être donné la main droite
  rationale: La formulation conserve l’image concrète et réciproque du geste, tout en restant intelligible en français ; la note en précise la portée culturelle.
- source_word: εἰς τὰς σκηνὰς ἐχωρίσθησαν
  choice: ils se séparèrent pour regagner leurs tentes
  rationale: Cette traduction conserve à la fois l’idée de séparation et la destination indiquée par le grec, dans un français plus naturel que « ils se séparèrent vers leurs tentes ».
theological_decisions:
- issue: Portée diplomatique de λαβόντες δεξιάς
  choice: Conserver dans le texte l’image de la main droite donnée
  alternative: Traduire directement par « après avoir conclu un accord » ou « après s’être engagés mutuellement »
  rationale: Le geste marque vraisemblablement un engagement ou un accord, mais le grec ne définit pas plus précisément son statut juridique. Garder l’image évite de résoudre cette nuance et préserve la couleur historique du récit.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche du mouvement de la phrase grecque, tandis que « à bien des égards » et « pour regagner leurs tentes » assurent une lecture naturelle. Le pronom « ils » de χρησίμους est maintenu sans ajouter explicitement un bénéficiaire absent du grec.
