translation_notes:
  register: Français moderne, digne et narratif. La phrase demeure liée au contexte suivant, comme dans le grec. La répétition de « bienveillance/bienveillant » reflète les deux expressions grecques apparentées par leur sens, tout en distinguant la disposition favorable de l’accueil concret.
