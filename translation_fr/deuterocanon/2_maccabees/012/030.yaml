  text: And when the Jews who were settled there testified to the goodwill that the people of Scythopolis had toward them[a], and to their gentle treatment in times of misfortune,
translation:
  language: fr
  text: Les Juifs établis sur place attestant la bienveillance que les habitants de Scythopolis avaient à leur égard, ainsi que l’accueil plein de douceur qu’ils leur avaient réservé dans les temps de malheur[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque traduite par « accueil plein de douceur » signifie littéralement « rencontre douce »; selon le contexte, elle peut aussi se rendre par « traitement plein de douceur » ou « accueil bienveillant ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπομαρτυρησάντων
  choice: témoignèrent
  rationale: Le participe aoriste introduit ce que les Juifs du lieu attestent; « témoignèrent » conserve la notion de témoignage sans alourdir la phrase.
- source_word: τῶν ἐκεῖ καθεστώτων Ἰουδαίων
  choice: Les Juifs établis là
  rationale: καθεστώτων désigne ceux qui étaient établis ou résidaient sur place; cette formulation reste proche du grec et naturelle en français.
- source_word: οἱ Σκυθοπολεῖται
  choice: les habitants de Scythopolis
  rationale: L’ethnique grec désigne les gens de la ville; « habitants de Scythopolis » est immédiatement compréhensible en français moderne.
- source_word: εὔνοιαν
  choice: la bienveillance
  rationale: εὔνοια exprime une disposition favorable et bienveillante; « bienveillance » convient au contexte des relations entre groupes.
- source_word: ἐν τοῖς τῆς ἀτυχίας καιροῖς
  choice: dans les temps de malheur
  rationale: ἀτυχία évoque l’infortune ou l’adversité sans préciser davantage sa gravité; « malheur » préserve cette relative largeur de sens.
- source_word: ἥμερον ἀπάντησιν
  choice: l’accueil bienveillant
  rationale: ἀπάντησις signifie littéralement rencontre ou fait d’aller à la rencontre, tandis que ἥμερος marque la douceur; dans le contexte, « accueil bienveillant » rend naturellement la manière dont ils furent reçus, tout en signalant en note le sens littéral.
