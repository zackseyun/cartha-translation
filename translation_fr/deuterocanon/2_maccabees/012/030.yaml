revisions:
- from: Les Juifs établis là témoignèrent alors de la bienveillance que les habitants de Scythopolis leur avaient témoignée[a], et de l’accueil bienveillant qu’ils leur avaient réservé dans les temps de malheur.
  to: Les Juifs établis sur place attestant la bienveillance que les habitants de Scythopolis avaient à leur égard, ainsi que l’accueil plein de douceur qu’ils leur avaient réservé dans les temps de malheur[a],
  rationale: La révision supprime l’adverbe non justifié, maintient la syntaxe inachevée du génitif absolu grec afin de respecter la continuité avec le verset suivant, distingue les deux expressions grecques, et replace l’appel de note sur le syntagme qu’elle documente.
