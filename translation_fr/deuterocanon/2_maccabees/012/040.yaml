base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/040.yaml
  text: But under the tunic of each of the dead they found sacred tokens of the idols of Jamnia[a], which the law forbids the Jews to have[b]; and it became clear to all that for this reason these men had fallen.
translation:
  language: fr
  text: Mais sous la tunique de chacun des morts, ils trouvèrent des objets sacrés des idoles de Jamnia[a], que la Loi interdisait aux Juifs de posséder. Il devint évident pour tous que c’était pour cette raison que ces hommes étaient tombés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « objets consacrés », « offrandes votives », voire « amulettes », liés aux idoles de Jamnia.
    reason: lexical_alternative
  - marker: b
    text: Dans un contexte de combat, « étaient tombés » signifie qu’ils avaient été tués.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερώματα
  choice: objets sacrés
  rationale: Le terme désigne des objets liés au culte sans en préciser la forme. « Objets sacrés » conserve cette généralité, tandis qu’« amulettes » ou « offrandes votives » seraient plus interprétatifs.
- source_word: χιτῶνας
  choice: tunique
  rationale: χιτών désigne normalement un vêtement porté près du corps. Le singulier français correspond à la construction distributive « de chacun ».
- source_word: τῶν ἀπὸ Ἰαμνίας εἰδώλων
  choice: associés aux idoles de Jamnia
  rationale: Cette formulation exprime le lien cultuel entre les objets et les idoles tout en conservant le rapport géographique avec Jamnia, sans préciser davantage la nature exacte de ce lien.
- source_word: ἀπήργει
  choice: interdisait la possession
  rationale: Le verbe exprime ici l’exclusion ou l’interdiction. La possession, implicite dans le contexte des objets trouvés sous les vêtements, rend la proposition naturelle en français sans ajouter une pratique doctrinale particulière.
- source_word: πεπτωκέναι
  choice: étaient tombés
  rationale: Le rendu littéral préserve l’expression guerrière du grec, qui signifie dans ce contexte qu’ils avaient été tués.
- source_word: τούσδε
  choice: ces hommes
  rationale: Le démonstratif renvoie aux soldats morts; « ces hommes » explicite naturellement le référent.
- source_word: διὰ τήνδε τὴν αἰτίαν
  choice: pour cette raison
  rationale: Cette tournure française rend directement le lien causal affirmé dans la phrase.
theological_decisions:
- issue: Lien causal entre les objets idolâtres et la mort des soldats
  choice: Le texte rapporte qu’il devint évident pour tous que ces hommes étaient tombés pour cette raison.
  alternative: Présenter ce lien seulement comme une supposition de la communauté.
  rationale: Le grec affirme « il devint évident pour tous » et enchaîne avec une expression causale. La traduction conserve cette affirmation sans développer ni résoudre davantage sa portée théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple maintient un registre narratif biblique naturel sans archaïsme marqué. La formulation conserve l’ambiguïté sur la nature précise des objets et l’expression guerrière « étaient tombés ».
