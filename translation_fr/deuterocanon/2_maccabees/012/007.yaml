  text: But when the place had been closed up[a], he withdrew, intending to come again and root out the entire citizen body of the people of Joppa.
translation:
  language: fr
  text: Mais, lorsque le lieu eut été fermé, il se retira, avec l’intention de revenir et de déraciner toute la communauté civique[a] des habitants de Joppé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout le corps civique ». Le terme grec peut désigner la communauté politique organisée, le corps des citoyens ou l’État constitué.
    reason: Alternative lexicale préservant l’étendue sémantique de πολίτευμα.
lexical_decisions:
- source_word: τοῦ ... χωρίου
  choice: le lieu
  rationale: χωρίον désigne couramment un lieu, un espace ou une localité. « Le lieu » reste volontairement neutre et n’impose ni l’idée d’un district ni celle d’une place forte.
- source_word: συγκλεισθέντος
  choice: une fois ... bouclé
  rationale: Le participe aoriste passif indique que le lieu a été fermé ou encerclé. « Bouclé » est naturel dans un contexte militaire tout en laissant indéterminée la manière précise dont il a été rendu inaccessible.
- source_word: ἀνέλυσεν
  choice: il se retira
  rationale: Dans un récit de campagne, ἀναλύω peut signifier partir, lever le camp ou se retirer. Le contexte et l’intention de revenir favorisent « se retira ».
- source_word: πάλιν ἥξων
  choice: avec l’intention de revenir
  rationale: Le participe futur exprime ici le but ou l’intention. Cette formulation rend explicitement cette valeur en français naturel.
- source_word: τὸ σύμπαν ... πολίτευμα
  choice: toute la communauté civique
  rationale: πολίτευμα peut désigner le corps des citoyens, la communauté politique ou l’entité civique organisée; σύμπαν en marque la totalité. « Toute la communauté civique » conserve cette portée collective sans la réduire au seul gouvernement ni l’étendre explicitement à chaque habitant pris individuellement.
- source_word: τῶν Ἰοππιτῶν
  choice: des habitants de Joppé
  rationale: Ἰοππῖται désigne les habitants ou citoyens de Joppé. Cette tournure est plus claire en français moderne qu’un gentilé rare.
- source_word: ἐκριζῶσαι
  choice: déraciner
  rationale: ἐκριζόω signifie littéralement arracher avec les racines et, au figuré, supprimer complètement. « Déraciner » préserve la métaphore et la violence de l’intention rapportée.
theological_decisions:
- issue: La gravité et l’étendue de l’action projetée contre Joppé
  choice: Rendre l’objet collectivement par « déraciner toute la communauté civique des habitants de Joppé »
  alternative: « détruire tous les habitants de Joppé » ou « renverser tout le gouvernement de Joppé »
  rationale: Le grec vise le πολίτευμα, collectif civique et politique, qualifié dans sa totalité par τὸ σύμπαν. La traduction conserve donc la portée collective sans décider qu’il s’agit nécessairement de chaque individu ni seulement des institutions dirigeantes; elle ne tempère pas non plus la violence du verbe.
translation_notes:
  register: Français international moderne, narratif et digne. « Une fois le lieu bouclé » allège la construction participiale grecque, tandis que « déraciner » maintient son image forte. La note signale l’ambiguïté institutionnelle et collective de πολίτευμα sans imposer une lecture confessionnelle.
