  text: Après s’être aussi occupé de ceux de Jamnia, qui voulaient agir de la même manière contre les Juifs qui y habitaient,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « ceux de Jamnia, qui avaient l’intention de mettre en œuvre le même procédé contre les Juifs qui y habitaient ». La construction grecque est très condensée et la phrase se poursuit au verset suivant.'
    reason: La syntaxe suspendue et le sens possible de ἐπιτελεῖν avec τρόπον permettent une formulation qui met plus explicitement l’accent sur l’exécution du projet.
lexical_decisions:
- source_word: μεταλαβὼν
  choice: il se tourna aussi vers
  rationale: Le participe marque le passage à un autre groupe visé par l’action de Judas. Cette formulation française reste naturelle sans préciser plus que le grec la nature exacte de son intervention.
- source_word: τοὺς ἐν Ἰαμνίᾳ
  choice: les gens de Jamnia
  rationale: L’article suivi du complément de lieu désigne de façon générale les personnes concernées à Jamnia.
- source_word: τὸν αὐτὸν ... τρόπον
  choice: de la même manière
  rationale: Traduction directe de l’expression grecque, qui conserve la référence au procédé évoqué dans le contexte sans en expliciter excessivement la nature.
- source_word: ἐπιτελεῖν
  choice: agir
  rationale: Dans cette construction avec τρόπον, « agir de la même manière » rend idiomatiquement l’idée d’accomplir ou de mettre à exécution une action semblable.
- source_word: βουλομένους
  choice: qui voulaient
  rationale: Rend simplement la volonté ou l’intention exprimée par le participe grec.
- source_word: τοῖς κατοικοῦσιν Ἰουδαίοις
  choice: contre les Juifs qui y habitaient
  rationale: Le contexte hostile justifie « contre » pour expliciter la relation du datif; « qui y habitaient » rend naturellement le participe κατοικοῦσιν.
