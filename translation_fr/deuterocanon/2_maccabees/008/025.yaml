lexical_decisions:
- source_word: χρήματα
  choice: l’argent
  rationale: Dans ce contexte, il s’agit de la somme apportée par les marchands venus acheter les prisonniers escomptés; « l’argent » est donc plus précis que « les biens » ou « les richesses ».
- source_word: τῶν παραγενομένων ἐπὶ τὸν ἀγορασμὸν αὐτῶν
  choice: de ceux qui étaient venus pour les acheter
  rationale: La formulation rend naturellement l’arrivée des acheteurs et conserve comme référent de αὐτῶν les combattants juifs que l’ennemi comptait vendre comme captifs.
- source_word: συνδιώξαντες
  choice: Après les avoir poursuivis
  rationale: Le participe a ici une valeur temporelle et décrit la poursuite qui précède leur retour.
- source_word: ἐφʼ ἱκανόν
  choice: sur une distance considérable
  rationale: Dans un contexte de poursuite et de déplacement, la valeur spatiale est la plus naturelle, sans exclure une nuance de durée signalée en note.
- source_word: ἀνέλυον ἀπὸ τῆς χώρας
  choice: ils quittèrent la région
  rationale: ἀναλύω peut exprimer le départ ou le retour; avec ἀπὸ τῆς χώρας, cette traduction rend clairement leur retrait hors de la région sans préciser davantage la géographie.
- source_word: συγκλειόμενοι
  choice: contraints de rebrousser chemin
  rationale: Le participe indique qu’une contrainte les obligeait à interrompre leur avance et à repartir; la nature exacte de cette contrainte reste volontairement indéterminée.
