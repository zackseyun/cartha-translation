  text: But they took the money of those who had come to buy them. And after pursuing them for a considerable distance, they turned back from the region, being hemmed in,
translation:
  language: fr
  text: Mais ils prirent l’argent de ceux qui étaient venus pour les acheter. Après les avoir poursuivis sur une distance considérable[a], ils se retirèrent de la région, contraints de rebrousser chemin[b],
  philosophy: optimal-equivalence
  footnotes:
