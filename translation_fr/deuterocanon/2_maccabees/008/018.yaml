base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/018.yaml
  text: For they[a], he said, have put their confidence in weapons and boldness, but we have put our confidence in Almighty God, who is able with a single nod to bring down both those coming against us and the whole world.
translation:
  language: fr
  text: « Eux, dit-il, placent leur confiance dans leurs armes et leur audace ; mais nous, nous plaçons notre confiance en Dieu, le Tout-Puissant, qui peut, d’un seul signe[a], abattre aussi bien ceux qui marchent contre nous que le monde entier. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’un seul geste » ou « d’un simple mouvement de tête ». Le grec désigne un signe, notamment un mouvement de tête, et souligne que Dieu peut abattre sans effort ceux qui viennent contre nous, comme le monde entier.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπλοις
  choice: leurs armes
  rationale: Dans ce contexte militaire, ὅπλα désigne les armes ou l’équipement de guerre. « Leurs armes » est naturel en français et rend explicite le lien avec le sujet.
- source_word: τόλμαις
  choice: leur audace
  rationale: τόλμα exprime ici la hardiesse ou l’audace au combat. « Audace » conserve la vigueur du terme sans imposer l’idée d’une témérité irréfléchie.
- source_word: ἐπὶ τῷ παντοκράτορι θεῷ
  choice: dans le Dieu Tout-Puissant
  rationale: Avec πεποίθαμεν, ἐπί suivi du datif indique sur qui repose la confiance. « Dans le Dieu Tout-Puissant » est idiomatique et garde le titre divin.
- source_word: δυναμένῳ
  choice: qui peut
  rationale: Le participe qualifie Dieu et fonde la confiance placée en lui. « Qui peut » est direct, naturel et fidèle.
- source_word: τοὺς ἐρχομένους ἐφʼ ἡμᾶς
  choice: ceux qui marchent contre nous
  rationale: La formule décrit des adversaires venant contre les combattants. « Marchent contre nous » conserve à la fois le mouvement et l’hostilité sans préciser davantage le stade de l’attaque.
- source_word: τὸν ὅλον κόσμον
  choice: le monde entier
  rationale: κόσμος peut désigner le monde ou l’univers ordonné. « Le monde entier » garde ici l’ampleur rhétorique de l’affirmation tout en restant naturel.
- source_word: ἑνὶ νεύματι
  choice: d’un seul signe
  rationale: νεῦμα désigne un mouvement de tête, un geste ou un signe. « D’un seul signe » exprime clairement l’extrême facilité de l’action divine sans susciter l’image française potentiellement familière d’un simple hochement de tête.
- source_word: καταβαλεῖν
  choice: abattre
  rationale: Le verbe signifie jeter à bas, renverser ou abattre. « Abattre » convient grammaticalement aux ennemis comme au monde entier et garde la force de l’image.
- source_word: πεποίθασιν / πεποίθαμεν
  choice: mettent leur confiance / mettons notre confiance
  rationale: Les parfaits grecs expriment une confiance établie et durable. En français actuel, le présent rend naturellement cet état, tandis que la répétition préserve le parallélisme entre les deux groupes.
theological_decisions:
- issue: Rendu du titre divin παντοκράτωρ
  choice: le Dieu Tout-Puissant
  alternative: Dieu, le Maître de tout
  rationale: « Tout-Puissant » est le titre français consacré et compréhensible qui exprime la souveraine puissance de Dieu sans réduire le terme à une simple description.
- issue: Portée de κόσμος dans l’affirmation de la puissance divine
  choice: le monde entier
  alternative: l’univers entier
  rationale: Le grec permet une portée vaste. « Le monde entier » conserve l’ampleur de la déclaration sans trancher inutilement entre le monde habité et l’univers cosmique.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct est conservé. La reprise « mais nous, nous » rend l’opposition emphatique du grec ; le parallélisme de la confiance est maintenu sans calquer lourdement les parfaits grecs.
