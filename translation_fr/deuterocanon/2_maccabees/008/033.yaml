base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/033.yaml
  text: And while they were celebrating the victory in their homeland[a], they burned those who had set fire to the sacred gates, including Kallisthenes, who had fled into a certain house for shelter; and he received the reward worthy of his ungodliness.
translation:
  language: fr
  text: Pendant qu’ils célébraient leur victoire dans leur patrie, ils brûlèrent ceux qui avaient incendié les portes sacrées, ainsi que Kallisthène, qui s’était réfugié dans une habitation[a]. Il reçut ainsi le salaire que méritait son impiété.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un logement ». Le mot grec est inhabituel ici, et la nature exacte du lieu demeure incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπινίκια ... ἄγοντες
  choice: pendant qu’ils célébraient leur victoire
  rationale: L’expression désigne la célébration qui suit une victoire. Cette formulation est naturelle en français et conserve le caractère festif de l’expression grecque.
- source_word: ἐν τῇ πατρίδι
  choice: dans leur patrie
  rationale: πατρίς désigne la terre natale ou le pays d’un groupe. « Leur patrie » est précis, digne et idiomatique.
- source_word: τοὺς ἐμπρήσαντας τοὺς ἱεροὺς πυλῶνας
  choice: ceux qui avaient incendié les portes sacrées
  rationale: ἐμπρήσαντας exprime l’action de mettre le feu, et ἱερούς qualifie ces portes comme appartenant au domaine sacré sans imposer une identification architecturale plus précise.
- source_word: Καλλισθένην
  choice: Kallisthène
  rationale: Forme française usuelle du nom grec Καλλισθένης.
- source_word: ὑφήψαν
  choice: ils brûlèrent
  rationale: Le verbe signifie mettre le feu ou embraser, littéralement en allumant par-dessous. Dans ce contexte, il implique qu’ils firent périr par le feu les coupables et Kallisthène.
- source_word: εἰς ἐνοίκιον πεφευγότα
  choice: qui s’était réfugié dans une habitation
  rationale: πεφευγότα indique clairement la fuite ou le refuge. Le substantif inhabituel ἐνοίκιον semble désigner ici un logement ou une habitation; une note conserve l’incertitude lexicale.
- source_word: τὸν ἄξιον ... μισθόν
  choice: le salaire que méritait
  rationale: μισθός peut désigner un salaire, une récompense ou une rétribution. « Le salaire que méritait » préserve l’image et sa portée ironique dans ce contexte de jugement.
- source_word: δυσσεβείας
  choice: impiété
  rationale: δυσσέβεια désigne une conduite irréligieuse et outrageante envers le sacré. « Impiété » rend directement cette dimension morale et cultuelle.
theological_decisions:
- issue: Portée cultuelle de ἱεροὺς πυλῶνας
  choice: portes sacrées
  alternative: portes du Temple
  rationale: « Portes sacrées » maintient la qualification religieuse explicite tout en évitant de préciser davantage que le grec l’identification architecturale.
- issue: Jugement moral exprimé par δυσσεβείας
  choice: impiété
  alternative: irrévérence envers Dieu
  rationale: « Impiété » conserve de façon concise le jugement religieux du narrateur, sans ajouter un complément absent du texte.
- issue: Valeur rétributive de μισθόν
  choice: le salaire que méritait son impiété
  alternative: la juste rétribution de son impiété
  rationale: Le choix retenu préserve la métaphore du salaire et l’idée d’une conséquence jugée méritée, sans atténuer la tension morale du récit.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste accessible; « patrie », « portes sacrées » et « impiété » conservent le registre historique et religieux du passage sans archaïsme marqué.
