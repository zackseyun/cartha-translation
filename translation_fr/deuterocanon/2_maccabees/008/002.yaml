base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/002.yaml
  text: And they were calling on the Lord to look upon the people trampled down by all[a], and also to have mercy on the temple that had been defiled by ungodly men;
translation:
  language: fr
  text: Ils imploraient le Seigneur de porter son regard sur le peuple que tous foulaient aux pieds, et d’avoir aussi compassion du Temple profané par des hommes impies.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « souillé ». Le grec exprime que le Temple, réalité sainte, avait été traité comme profane par des hommes impies.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεκαλοῦντο
  choice: ils imploraient
  rationale: L’imparfait exprime une supplication en cours ou répétée. « Imploraient » s’intègre naturellement à la construction avec les infinitifs qui suivent et conserve la force de l’appel adressé à Dieu.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Dans cette prière adressée au Dieu d’Israël, « le Seigneur » est le titre divin français usuel, sans expliciter le tétragramme.
- source_word: ἐφιδεῖν
  choice: porter son regard sur
  rationale: L’expression dépasse la simple perception visuelle et demande au Seigneur de considérer avec attention la détresse du peuple.
- source_word: τὸν ὑπὸ πάντων καταπατούμενον λαόν
  choice: le peuple que tous foulaient aux pieds
  rationale: Cette formulation préserve l’image concrète et violente du participe présent passif ainsi que la portée générale de ὑπὸ πάντων.
- source_word: οἰκτεῖραι
  choice: avoir compassion de
  rationale: Le verbe exprime la pitié compatissante sollicitée de Dieu. « Avoir compassion de » est naturel, digne et précis dans une prière.
- source_word: τὸν ναὸν
  choice: le Temple
  rationale: Il s’agit du Temple de Jérusalem. La majuscule signale ce référent historique précis sans ajouter d’interprétation.
- source_word: βεβηλωθέντα
  choice: profané
  rationale: Le participe désigne le traitement d’une réalité sainte comme profane ou commune. « Profané » restitue directement cette atteinte au caractère sacré du Temple.
- source_word: ὑπὸ τῶν ἀσεβῶν ἀνθρώπων
  choice: par des hommes impies
  rationale: « Impies » conserve la dimension religieuse de ἀσεβῶν, tandis que « hommes » rend ici les agents humains masculins désignés par le texte.
theological_decisions:
- issue: Rendu de κύριος dans une prière au Dieu d’Israël
  choice: le Seigneur
  alternative: le Maître
  rationale: « Le Seigneur » est le titre divin traditionnel et naturel en français; il maintient la révérence du contexte sans identifier explicitement κύριος au tétragramme.
- issue: Portée de βεβηλωθέντα appliqué au Temple
  choice: profané
  alternative: souillé ou désacralisé
  rationale: '« Profané » maintient l’idée théologique centrale: ce qui était saint a été traité comme profane. La note conserve les autres nuances possibles sans réduire le terme à une impureté matérielle.'
- issue: Genre de ἀνθρώπων
  choice: des hommes
  alternative: des personnes
  rationale: Dans ce récit, l’expression vise les agents humains impies responsables de la profanation. Le masculin est conservé sans faire de leur sexe un point théologique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Ils imploraient » rend naturellement l’action continue de l’imparfait; « porter son regard sur » conserve le ton de supplication. La métaphore « foulaient aux pieds » et la tension entre sainteté et profanation sont maintenues.
