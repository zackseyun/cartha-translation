  text: He especially took the nights as allies for such attacks[b][a], and the report of his valor spread everywhere.
translation:
  language: fr
  text: Il prenait surtout les nuits pour alliées pour de telles attaques[a], et le renom de sa vaillance se répandait partout[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, le grec dit qu’« il prenait les nuits pour collaboratrices », personnifiant ainsi les nuits comme ses alliées lors de ces opérations.
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque traduite par « le renom de sa vaillance » est inhabituelle. Elle semble désigner la nouvelle ou la réputation de son courage, qui se diffusait largement.
    reason: textual_variant
lexical_decisions:
- source_word: μάλιστα
  choice: surtout
  rationale: Rend naturellement l’intensification portée par l’adverbe, sans ajouter une idée absente du grec.
- source_word: τὰς νύκτας … συνεργοὺς ἐλάμβανεν
  choice: il prenait surtout les nuits pour alliées
  rationale: Conserve la construction et la personnification du grec, où les nuits deviennent les auxiliaires de Judas.
- source_word: πρὸς τὰς τοιαύτας ἐπιβολὰς
  choice: dans de telles attaques
  rationale: Dans ce contexte militaire, « attaques » exprime clairement les entreprises hostiles désignées par ἐπιβολάς; « dans » indique la fonction des nuits au cours de ces opérations.
- source_word: ἡ ἁλὴ τῆς εὐανδρείας αὐτοῦ
  choice: le renom de sa vaillance
  rationale: L’expression grecque transmise est inhabituelle; le contexte indique vraisemblablement une réputation de courage guerrier qui se propage.
- source_word: διηχεῖτο πανταχῇ
  choice: se répandait partout
  rationale: Restitue en français courant le mouvement de diffusion suggéré par le verbe, dont l’image première peut être celle d’un retentissement.
