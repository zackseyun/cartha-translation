base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/011.yaml
  text: So he immediately sent to the cities along the coast[a], inviting them to buy Jewish bodies, promising to hand over ninety bodies for a talent[b]; but he did not expect the punishment from the Almighty that was about to come upon him.
translation:
  language: fr
  text: Il envoya aussitôt dans les villes côtières, les invitant à acheter des corps juifs[a] et promettant d’en livrer quatre-vingt-dix pour un talent. Mais il ne s’attendait pas au châtiment[b] du Tout-Puissant qui allait le rattraper.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « corps ». Il s’agit de Juifs traités comme une marchandise à vendre ; certaines traductions disent « personnes » ou explicitent « esclaves ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « à la justice du Tout-Puissant qui allait le rattraper ». Le mot grec peut désigner soit la justice en action, soit le châtiment qui en résulte.'
    reason: alternative_reading
lexical_decisions:
- source_word: παραθαλασσίους πόλεις
  choice: villes côtières
  rationale: L’adjectif désigne des villes situées au bord de la mer. « Villes côtières » est précis, naturel et actuel.
- source_word: προκαλούμενος ἐπʼ ἀγορασμόν
  choice: une invitation à acheter
  rationale: Dans ce contexte commercial, le participe exprime une sollicitation adressée à d’éventuels acheteurs. La tournure nominale s’intègre naturellement au verbe « envoya ».
- source_word: Ἰουδαίων σωμάτων
  choice: des corps juifs
  rationale: Le grec dit littéralement « corps » et présente avec brutalité les Juifs comme une marchandise. « Personnes juives » atténuerait cet effet, tandis que « esclaves juifs » expliciterait une implication sans la traduire directement.
- source_word: ἐνενήκοντα σώματα ταλάντου παραχωρήσειν
  choice: d’en livrer quatre-vingt-dix pour un talent
  rationale: 'La formulation rend le tarif proposé : quatre-vingt-dix captifs contre un talent. Le pronom « en » évite une répétition lourde tout en renvoyant clairement aux « corps juifs ».'
- source_word: οὐ προσδεχόμενος
  choice: il ne s’attendait pas
  rationale: Cette expression rend naturellement l’idée qu’il n’anticipait pas ce qui allait lui arriver et n’en tenait pas compte.
- source_word: τὴν ... μέλλουσαν παρακολουθήσειν αὐτῷ δίκην
  choice: au châtiment ... qui allait le rattraper
  rationale: δίκη peut désigner la justice exercée ou le châtiment qui en résulte. Ici, « châtiment » convient au contexte de rétribution, et « le rattraper » restitue l’image de quelque chose qui suit quelqu’un de près jusqu’à l’atteindre.
- source_word: τοῦ παντοκράτορος
  choice: du Tout-Puissant
  rationale: « Le Tout-Puissant » est l’équivalent français consacré de ce titre divin, qui souligne la souveraine puissance de Dieu.
theological_decisions:
- issue: Portée du titre divin παντοκράτωρ
  choice: le Tout-Puissant
  alternative: le Souverain de tout
  rationale: Le choix retenu est idiomatique et traditionnel en français, tout en conservant l’accent du titre grec sur la puissance souveraine de Dieu.
- issue: Valeur de δίκη dans l’annonce de la rétribution divine
  choice: châtiment
  alternative: justice
  rationale: Le contexte met en avant ce qui va atteindre Nicanor en conséquence de ses actes. Toutefois, le grec permet aussi de comprendre la justice divine en action; cette ambiguïté est signalée en note.
- issue: Maintien de l’expression objectivante σώματα
  choice: corps juifs
  alternative: personnes juives; esclaves juifs
  rationale: Le maintien de « corps » préserve la violence morale du langage marchand sans adoucir le texte ni rendre explicite, dans le corps du verset, le statut servile seulement impliqué par le contexte.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve le vocabulaire volontairement déshumanisant du commerce de captifs, tout en employant une syntaxe fluide. « Talent » est maintenu comme unité monétaire antique, sans conversion conjecturale.
