  text: having appointed his brothers to lead each division[a], Simon and Joseph and Jonathan, assigning to each one a thousand men in addition to five hundred,
translation:
  language: fr
  text: Il plaça ses frères à la tête de chaque division — Simon, Joseph et Jonathan — et confia à chacun mille hommes, plus cinq cents[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en grec : « mille, plus cinq cents », soit 1 500 hommes sous les ordres de chacun.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τάξας
  choice: Il plaça
  rationale: Le participe aoriste exprime ici une mesure préparatoire prise par Judas. « Il plaça » rend naturellement l’action d’affecter des chefs dans un cadre militaire, tout en laissant la phrase ouverte sur la suite du contexte.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: ses frères
  rationale: Le sens familial ordinaire de ἀδελφοί convient aux trois hommes nommés; rien dans le contexte n’impose le sens élargi de « proches ».
- source_word: προηγουμένους
  choice: à la tête
  rationale: Le participe signifie littéralement qu’ils vont devant; dans ce contexte militaire, il indique qu’ils commandent les unités.
- source_word: ἑκάτερας τάξεως
  choice: de chaque division
  rationale: τάξις désigne ici une unité ou formation militaire. « Division » est clair en français moderne; « chaque » rend la distribution voulue, malgré la forme grecque ἑκάτερας, souvent associée à chacun de deux ensembles.
- source_word: ὑποτάξας
  choice: confia
  rationale: Le verbe décrit le placement de soldats sous l’autorité de chaque chef. « Confia » exprime cette attribution de commandement sans suggérer une soumission morale.
- source_word: ἑκάστῳ
  choice: à chacun
  rationale: Le terme distribue les effectifs entre les trois frères nommés.
- source_word: χιλίους πρὸς τοῖς πεντακοσίοις
  choice: mille hommes, plus cinq cents
  rationale: Cette formulation conserve la construction additive du grec tout en fournissant « hommes », implicite dans le dénombrement militaire.
