  text: After carefully stripping them of their arms[a], they put everything in the proper places, but they carried the rest of the spoils to Jerusalem.
translation:
  language: fr
  text: Après les avoir soigneusement dépouillés de leurs armes[a], ils placèrent tout dans des lieux appropriés, mais ils emportèrent à Jérusalem le reste du butin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « après avoir recueilli leurs armes ». Le participe grec peut mettre l’accent soit sur le fait de dépouiller les vaincus de leurs armes, soit sur le rassemblement de celles-ci.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁπλολογήσαντες
  choice: les avoir dépouillés de leurs armes
  rationale: Le participe, construit sur ὅπλον, désigne le fait de prendre ou de recueillir les armes des vaincus. Cette formulation concrète convient bien au complément αὐτούς, tout en laissant en note l’autre nuance possible.
- source_word: ἐπιμελῶς
  choice: soigneusement
  rationale: L’adverbe exprime une action accomplie avec soin et attention; « soigneusement » est naturel et précis en français moderne.
- source_word: πάντα συνέθηκαν
  choice: ils mirent le tout
  rationale: συντίθημι exprime ici la mise en place ou le dépôt des objets. « Mirent le tout » reste proche du grec sans préciser davantage que le contexte.
- source_word: εἰς τοὺς ἐπικαίρους τόπους
  choice: dans des endroits appropriés
  rationale: ἐπίκαιρος peut signifier convenable, adapté ou opportun. « Endroits appropriés » préserve cette latitude sans imposer l’idée plus précise de lieux stratégiques.
- source_word: τὰ δὲ λοιπὰ τῶν σκύλων
  choice: le reste du butin
  rationale: σκῦλα désigne les prises de guerre; « butin » est courant, clair et adapté au contexte militaire. λοιπά indique ce qui restait après la mise à part précédente.
- source_word: ἤνεγκαν εἰς Ἰεροσόλυμα
  choice: ils emportèrent à Jérusalem
  rationale: L’aoriste de φέρω indique ici le transport matériel. « Emportèrent à Jérusalem » rend naturellement le mouvement vers la ville.
