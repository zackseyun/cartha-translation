  yaml_path: translation/deuterocanon/2_maccabees/008/019.yaml
  text: And he also recounted to them the help that had come to their forefathers[a], and the one against Sennacherib[b], how a hundred eighty-five thousand were destroyed.
translation:
  language: fr
  text: 'Il leur rappela aussi les secours accordés à leurs ancêtres[a], ainsi que celui qui eut lieu contre Sennachérib : comment cent quatre-vingt-cinq mille avaient péri.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut aussi se traduire par « aides » ou « délivrances ».
    reason: lexical_alternative
  - marker: b
    text: Allusion à la destruction de l’armée de Sennachérib au temps d’Ézékias ; voir 2 Rois 19.35 et Ésaïe 37.36.
    reason: cross_reference
lexical_decisions:
- source_word: προσαναλεξάμενος
  choice: rappela
  rationale: Le participe décrit Judas évoquant oralement devant ses hommes des interventions passées. « Rappela » rend naturellement cette fonction d’encouragement par le souvenir, sans alourdir la phrase.
- source_word: ἀντιλήμψεις
  choice: secours
  rationale: Le terme désigne des actes d’aide ou de soutien dans une situation critique. « Secours » garde cette largeur de sens tout en convenant au contexte de délivrance militaire.
- source_word: ἐπὶ τῶν προγόνων γενομένας
  choice: intervenus en faveur de leurs ancêtres
  rationale: La formulation exprime des secours qui se sont produits à l’égard des ancêtres. « En faveur de » communique le bénéfice reçu sans nommer explicitement l’agent divin, absent de cette proposition grecque.
- source_word: τὴν ἐπὶ Σεναχηρεὶμ
  choice: notamment celui contre Sennachérib
  rationale: L’article féminin reprend elliptiquement l’idée d’un secours. « Notamment » explicite avec naturel que cet épisode particulier appartient aux secours déjà mentionnés, tandis que « contre » conserve l’orientation hostile de ἐπί dans ce contexte.
- source_word: ἑκατὸν ὀγδοήκοντα πέντε χιλιάδες
  choice: cent quatre-vingt-cinq mille hommes
  rationale: Le nombre est rendu directement. « Hommes » explicite le référent humain sous-entendu par le récit militaire et par le verbe « périr ».
- source_word: ὡς ἀπώλοντο
  choice: comment ... avaient péri
  rationale: ὡς introduit ici le contenu de ce qui est rappelé. « Avaient péri » conserve la voix non explicitement agentive du grec et évite d’ajouter que Dieu les aurait directement détruits dans cette proposition.
theological_decisions:
- issue: Agent divin implicite dans les secours ancestraux et la mort de l’armée de Sennachérib
  choice: Ne pas ajouter explicitement « Dieu » dans le texte principal.
  alternative: « les secours que Dieu avait accordés à leurs ancêtres » et « comment Dieu avait fait périr cent quatre-vingt-cinq mille hommes »
  rationale: L’épisode évoque clairement, dans son arrière-plan biblique, une délivrance divine. Toutefois, cette proposition grecque ne nomme pas Dieu. La traduction maintient l’allusion et l’implication théologique sans transformer l’implicite en affirmation explicite.
- issue: Portée de ἀπώλοντο
  choice: Employer la tournure non agentive « avaient péri ».
  alternative: « avaient été anéantis » ou « Dieu avait fait périr »
  rationale: Le moyen ἀπώλοντο indique qu’ils périrent, sans énoncer ici l’agent. Cette formulation préserve la retenue grammaticale du texte tout en gardant la gravité de l’événement.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure de remémoration du grec, tout en rendant explicite le lien elliptique entre les « secours » et l’épisode de Sennachérib. Le nom « Sennachérib » suit la forme française biblique usuelle.
