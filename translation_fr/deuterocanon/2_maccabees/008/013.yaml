  yaml_path: translation/deuterocanon/2_maccabees/008/013.yaml
  text: But those who had become cowardly and distrusted the justice of God kept slipping away and going into exile[a].
translation:
  language: fr
  text: Mais ceux qui cédaient à la lâcheté et ne se fiaient pas au jugement de Dieu[a] s’enfuyaient et s’exilaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la justice de Dieu » ; dans ce contexte, l’expression peut aussi évoquer la vengeance exercée par Dieu.
    reason: Alternative lexicale permettant de préserver l’étendue sémantique de δίκη et la tension entre justice, jugement et rétribution.
lexical_decisions:
- source_word: δειλανδροῦντες
  choice: ceux qui cédaient à la lâcheté
  rationale: Le participe exprime un manque de courage avec une nuance de reproche. Cette formulation naturelle conserve cette force sans être excessivement littérale.
- source_word: ἀπιστοῦντες
  choice: ne se fiaient pas
  rationale: Avec pour objet le jugement de Dieu, le verbe désigne ici un manque de confiance dans son intervention plutôt qu’une simple incroyance abstraite.
- source_word: δίκην
  choice: jugement
  rationale: Le terme peut désigner la justice, le jugement ou l’action punitive. « Jugement » conserve ici l’idée large d’une intervention judiciaire de Dieu sans la réduire à la vengeance.
- source_word: διεδίδρασκον ἑαυτούς
  choice: s’enfuyaient
  rationale: L’imparfait grec présente une fuite en cours ou répétée; le français « s’enfuyaient » rend naturellement l’idée de se mettre soi-même hors d’atteinte.
- source_word: ἐξετόπιζον
  choice: quittaient leur pays
  rationale: Le verbe évoque le fait de partir de son lieu ou d’être déplacé. Cette traduction exprime le déracinement sans suggérer nécessairement un exil officiellement imposé.
theological_decisions:
- issue: Sens de τὴν τοῦ θεοῦ δίκην
  choice: le jugement de Dieu
  alternative: la justice de Dieu; la vengeance de Dieu
  rationale: L’expression peut viser soit la justice divine comme principe, soit son action judiciaire concrète contre les ennemis. « Jugement » maintient cette amplitude, tandis que la note signale les autres nuances possibles.
translation_notes:
  register: Français international moderne, clair et digne. Le reproche porté par δειλανδροῦντες est conservé, et les deux imparfaits sont rendus comme des actions en cours. « Quittaient leur pays » évite le sens administratif que pourrait suggérer « partaient en exil ».
