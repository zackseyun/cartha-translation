base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/010.yaml
  text: But Nikanor undertook to pay to the king the tribute owed to the Romans[a], amounting to two thousand talents[b], from the captivity of the Jews.
translation:
  language: fr
  text: Mais Nicanor s’engagea à verser au roi le tribut dû aux Romains[a], qui s’élevait à deux mille talents, au moyen de la captivité des Juifs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « le tribut au roi, pour les Romains ». Le grec est condensé ; dans le contexte, Nicanor proposait de couvrir par là l’obligation financière du roi envers les Romains.'
    reason: alternative_reading
  - marker: b
    text: La captivité des Juifs est présentée comme la source des fonds. Le grec ne précise pas si la somme devait provenir de leur vente, de leur rançon ou d’un autre moyen.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδιωτεύσατο
  choice: s’engagea
  rationale: Dans ce contexte, le verbe indique que Nicanor assume personnellement l’engagement de réunir et de verser la somme. « S’engagea » est naturel en français sans préciser à tort la forme administrative de cet engagement.
- source_word: φόρον
  choice: tribut
  rationale: Le terme désigne ici un paiement imposé dans un rapport de dépendance politique; « tribut » convient mieux que le terme général « impôt ».
- source_word: τῷ βασιλεῖ
  choice: au roi
  rationale: Traduction directe du datif désignant le bénéficiaire immédiat du versement.
- source_word: τοῖς ις Ῥωμαίοις
  choice: destiné aux Romains
  rationale: La formule grecque est très compacte et rattache le tribut dû au roi aux Romains. « Destiné aux Romains » exprime le sens contextuel sans effacer entièrement cette compression, signalée en note.
- source_word: ὄντα τάλαντων δισχιλίων
  choice: qui s’élevait à deux mille talents
  rationale: Cette formulation française rend naturellement le participe et la valeur monétaire, tout en conservant l’unité antique sans conversion conjecturale.
- source_word: ἐκ τῆς τῶν Ἰουδαίων αἰχμαλωσίας
  choice: avec le produit de la capture des Juifs
  rationale: La préposition ἐκ indique la source des fonds. « Le produit de la capture » fait comprendre que Nicanor comptait tirer cette somme des prisonniers juifs, sans limiter le procédé à leur vente plutôt qu’à une rançon.
- source_word: ἐκπληρώσειν
  choice: verser
  rationale: Dans ce contexte financier, l’infinitif signifie acquitter ou fournir la somme due. « Verser » convient au paiement d’un tribut et s’intègre naturellement à la phrase.
theological_decisions:
- issue: Rapport syntaxique de τοῖς ις Ῥωμαίοις avec « le roi » et « le tribut »
  choice: le tribut versé au roi est destiné aux Romains
  alternative: « le tribut au roi, pour les Romains »
  rationale: Le grec est condensé et peut se rendre plus littéralement par une formule ambiguë. Le contexte indique vraisemblablement que Nicanor voulait couvrir l’obligation du roi envers Rome. La note conserve la formulation plus littérale au lieu de présenter l’explicitation comme absolument certaine.
- issue: Moyen envisagé pour réunir les fonds
  choice: tirer un produit de la capture des Juifs
  alternative: « grâce à la captivité des Juifs »
  rationale: Le grec nomme la capture ou captivité comme source de la somme, mais ne précise pas explicitement s’il s’agit de vente, d’esclavage ou de rançon. La traduction et la note maintiennent cette indétermination.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve le ton administratif et brutal du récit. « Nicanor » suit une graphie française courante; « talents » est maintenu comme unité monétaire antique. Les notes rendent visibles à la fois la syntaxe grecque compacte et l’imprécision du mode de profit envisagé.
