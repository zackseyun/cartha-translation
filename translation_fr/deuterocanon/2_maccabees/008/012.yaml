  yaml_path: translation/deuterocanon/2_maccabees/008/012.yaml
  text: But news of Nicanor’s advance came to Judas[a]; and when he had shared with those with him the presence of the army camp[b],
translation:
  language: fr
  text: Mais Judas apprit l’avancée de Nicanor[a] et, après avoir informé ceux qui étaient avec lui de l’arrivée de l’armée[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’attaque de Nicanor ». Le mot grec peut désigner une avancée, une attaque ou un assaut.
    reason: lexical_alternative
  - marker: b
    text: Ou « de la présence de l’armée ». L’expression grecque, très condensée, peut évoquer soit l’arrivée de l’armée, soit sa présence à proximité ; le terme traduit par « armée » peut aussi désigner un camp militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέπεσεν
  choice: apprit
  rationale: Dans cette construction idiomatique, le verbe indique qu’une information parvint à Judas. « Judas apprit » est naturel en français et rend clairement ce sens implicite.
- source_word: περὶ τῆς τοῦ Νικάνορος ἐφόδου
  choice: l’avancée de Nicanor
  rationale: ἐφόδος peut désigner une avancée hostile, une attaque ou un assaut. Comme l’action militaire n’est pas encore décrite comme engagée, « avancée » préserve la menace sans anticiper l’attaque.
- source_word: μεταδόντος
  choice: après avoir informé
  rationale: Le génitif absolu exprime une action de Judas consistant à communiquer l’information. « Informé » est plus idiomatique ici que le calque « fait partager ».
- source_word: τοῖς σὺν αὐτῷ
  choice: ceux qui étaient avec lui
  rationale: Rendu direct qui ne précise pas davantage l’identité de ses compagnons.
- source_word: τὴν παρουσίαν τοῦ στρατοπέδου
  choice: de l’arrivée de l’armée
  rationale: παρουσία peut signifier « présence » ou « arrivée », et στρατόπεδον « camp » ou « armée ». Dans ce contexte, « arrivée de l’armée » donne un français naturel tout en conservant l’ambiguïté contextuelle dans une note.
