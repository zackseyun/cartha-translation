base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/036.yaml
  text: And the one who had undertaken to pay tribute to the Romans from the capture of those in Jerusalem kept proclaiming that the Jews had as their defender one who fought for them[a], and that for this reason the Jews were invulnerable[b], because they followed the laws that had been commanded to them.
translation:
  language: fr
  text: Et celui qui s’était engagé à verser aux Romains un tribut tiré de la mise en captivité des habitants de Jérusalem[a] proclamait que les Juifs avaient un défenseur qui combattait pour eux[b] et que, pour cette raison, ils étaient invulnérables, parce qu’ils observaient les lois qui leur avaient été prescrites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tiré de la capture des habitants de Jérusalem ». Il comptait financer le tribut grâce aux profits que leur mise en captivité devait rapporter.'
    reason: lexical_alternative
  - marker: b
    text: Le défenseur n’est pas nommé ici ; le contexte laisse entendre qu’il s’agit de Dieu, qui combat en faveur des Juifs.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ... ἀναδεξάμενος
  choice: celui qui s’était engagé
  rationale: Le participe aoriste moyen substantivé renvoie à Nicanor et exprime la prise en charge d’une obligation; « s’était engagé » garde cette idée sans expliciter davantage la nature du contrat.
- source_word: φόρον
  choice: tribut
  rationale: Le terme désigne ici un versement dû à la puissance romaine; « tribut » conserve sa portée politique et impériale.
- source_word: ἀπὸ τῆς τῶν ἐν Ἱεροσολύμοις αἰχμαλωσίας
  choice: tiré de la capture des habitants de Jérusalem
  rationale: La formule indique la source escomptée du tribut, à savoir les profits provenant de la mise en captivité des habitants; « capture » préserve le caractère événementiel possible d’αἰχμαλωσία.
- source_word: κατορθώσασθαι
  choice: verser
  rationale: Littéralement « mener à bonne fin » ou « acquitter »; dans ce contexte financier, le verbe porte sur l’exécution du paiement promis.
- source_word: κατήγγελλεν
  choice: proclamait désormais
  rationale: L’imparfait présente une déclaration prolongée ou répétée. « Désormais » rend naturellement le retournement narratif, tandis que l’imparfait français conserve l’aspect duratif.
- source_word: ὑπέρμαχον ἔχειν
  choice: avaient un défenseur qui combattait pour eux
  rationale: ὑπέρμαχος désigne celui qui prend activement le parti d’autrui au combat; cette formulation garde à la fois la défense et l’action guerrière.
- source_word: ἀτρώτους
  choice: invulnérables
  rationale: Le mot signifie « qui ne peut être blessé »; « invulnérables » est naturel en français et convient au contexte militaire.
- source_word: διὰ τὸ ἀκολουθεῖν
  choice: parce qu’ils observaient
  rationale: La construction prépositionnelle avec infinitif exprime la cause; « parce que » en rend clairement la valeur, et « observer » est idiomatique avec des lois.
- source_word: τοῖς ἑαυτῶν προστεταγμένοις νόμοις
  choice: les lois qui leur avaient été prescrites
  rationale: Le participe parfait passif indique des lois imposées ou prescrites avec autorité; le plus-que-parfait passif en restitue l’état résultant.
theological_decisions:
- issue: Identité du défenseur des Juifs dans ὑπέρμαχον ἔχειν
  choice: Maintenir le défenseur grammaticalement indéfini tout en laissant entendre Dieu dans le contexte
  alternative: Nommer explicitement Dieu comme celui qui combat pour les Juifs
  rationale: Le passage implique vraisemblablement Dieu, mais ne le nomme pas dans cette proposition. La traduction préserve donc l’implicite et la tension du grec.
- issue: Rapport entre l’invulnérabilité et l’observance de la Loi
  choice: Conserver le lien causal affirmé par Nicanor
  alternative: Atténuer ce lien en parlant seulement d’une association entre fidélité et protection
  rationale: διὰ τὸ exprime explicitement la cause dans le discours rapporté. La traduction restitue cette affirmation sans en faire une doctrine générale indépendante du contexte narratif.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve la structure argumentative du grec tout en évitant une syntaxe trop lourde. « Habitants de Jérusalem » explicite naturellement οἱ ἐν Ἱεροσολύμοις sans ajouter de groupe non présent dans le texte.
