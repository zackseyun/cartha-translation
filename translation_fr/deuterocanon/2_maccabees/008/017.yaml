  text: having set before their eyes the lawless outrage committed by them against the holy place, and the abuse of the city that had been mocked, and also the overthrow of the ancestral way of life.
translation:
  language: fr
  text: En gardant devant les yeux l’outrage qu’ils avaient commis contre le lieu saint, au mépris de la loi, les mauvais traitements infligés à la ville tournée en dérision, ainsi que la destruction du mode de vie hérité de leurs ancêtres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὸ ὀφθαλμῶν λαβόντας
  choice: garder devant les yeux
  rationale: Conserve l’image grecque tout en exprimant naturellement l’idée de maintenir ces faits présents à l’esprit.
- source_word: ἀνόμως
  choice: au mépris de la Loi
  rationale: Le terme signifie que l’acte est contraire à la loi; dans ce contexte juif, la majuscule indique naturellement la Loi religieuse sans surcharger la traduction.
- source_word: ὕβριν
  choice: l’outrage
  rationale: Rend la violence insolente et profanatrice impliquée par le grec.
- source_word: αἰκισμόν
  choice: les sévices infligés
  rationale: Exprime les mauvais traitements et les outrages subis par la ville, avec davantage de précision que le terme général « abus ».
- source_word: προγονικῆς πολιτείας
  choice: le mode de vie hérité de leurs ancêtres
  rationale: πολιτεία peut désigner l’ordre civique, les institutions ou la manière de vivre; cette formulation préserve ici sa portée sociale et religieuse sans la réduire à une simple constitution politique.
- source_word: κατάλυσιν
  choice: l’abolition
  rationale: Rend l’idée de suppression ou de démantèlement complet de l’ordre ancestral.
theological_decisions:
- issue: Portée religieuse de ἀνόμως
  choice: au mépris de la Loi
  alternative: illégalement
  rationale: Le contexte de la profanation du lieu saint et de la suppression du mode de vie ancestral favorise une référence à la Loi juive, tout en maintenant le sens fondamental d’une action contraire à la loi.
- issue: Sens de πολιτεία
  choice: mode de vie hérité de leurs ancêtres
  alternative: institutions ancestrales
  rationale: Le grec garde une certaine amplitude entre régime, ordre collectif et conduite de vie; « mode de vie » convient au contexte sans imposer une lecture exclusivement politique.
translation_notes:
  register: Français international moderne, clair et digne. La phrase est formulée comme une proposition autonome (« Ils devaient… »), bien que le grec soit participial et se rattache syntaxiquement au contexte précédent. Le parallélisme ternaire de l’original est conservé.
