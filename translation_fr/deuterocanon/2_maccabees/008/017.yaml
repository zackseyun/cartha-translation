revisions:
- from: Ils devaient garder devant les yeux l’outrage commis au mépris de la Loi contre le lieu saint, les sévices infligés à la ville tournée en dérision, ainsi que l’abolition du mode de vie hérité de leurs ancêtres.
  to: En gardant devant les yeux l’outrage qu’ils avaient commis contre le lieu saint, au mépris de la loi, les mauvais traitements infligés à la ville tournée en dérision, ainsi que la destruction du mode de vie hérité de leurs ancêtres.
  rationale: La révision supprime la modalité ajoutée et rend la construction participiale du grec par « En gardant devant les yeux ». Elle conserve l’image, le parallélisme et l’ampleur sociale et religieuse de πολιτεία, tout en évitant de surdéterminer ἀνόμως par une majuscule confessionnelle.
