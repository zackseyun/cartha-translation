base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/016.yaml
  text: Then Maccabeus[a], after gathering those with him, about six thousand in number, urged them not to be terrified by the enemy, nor to fear the great multitude of the nations that had come against them unjustly, but to fight bravely,
translation:
  language: fr
  text: Après avoir rassemblé ceux qui étaient avec lui, au nombre de six mille, Maccabée les exhorta à ne pas se laisser terrifier par les captifs[a], ni à redouter la multitude des nations qui étaient venues contre eux injustement, mais à combattre courageusement,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par les prisonniers » ou « par les captifs ». La formulation grecque est difficile ici ; le contexte peut faire penser aux forces ennemies.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Συναγαγὼν
  choice: rassembla
  rationale: Le participe aoriste exprime une action antérieure ou concomitante à l’exhortation. Une coordination avec « et » donne en français un récit naturel sans perdre la séquence.
- source_word: τοὺς περὶ αὐτὸν ὄντας
  choice: ceux qui étaient avec lui
  rationale: Expression proche du grec et idiomatique en français, moins interprétative que « ses hommes ».
- source_word: ἀριθμὸν ἑξακισχιλίους
  choice: au nombre d’environ six mille
  rationale: « Au nombre de » rend explicitement l’indication numérique. « Environ » convient à la présentation d’un effectif arrondi, bien que le grec donne littéralement six mille.
- source_word: παρεκάλει
  choice: les exhorta
  rationale: Dans ce discours militaire, le verbe désigne une incitation pressante; « exhorta » conserve le ton soutenu sans lui imposer un sens exclusivement religieux.
- source_word: μὴ καταπλαγῆναι
  choice: à ne pas se laisser terrifier
  rationale: Le verbe évoque le fait d’être frappé ou submergé par la peur; la tournure française exprime bien cette réaction de panique.
- source_word: τοῖς δεσμίοις
  choice: par les prisonniers
  rationale: C’est le sens lexical direct du grec transmis, malgré sa difficulté dans le contexte. La traduction conserve cette difficulté plutôt que de remplacer silencieusement le mot par « ennemis ».
- source_word: μηδὲ εὐλαβεῖσθαι
  choice: ni à redouter
  rationale: Le verbe exprime ici la crainte face à un danger; « redouter » forme un parallèle naturel avec « se laisser terrifier ».
- source_word: τὴν … πολυπληθείαν
  choice: la multitude
  rationale: Le nom met l’accent sur le très grand nombre; « multitude » en conserve la force sans ajouter un adjectif absent du texte.
- source_word: τῶν … ἐθνῶν
  choice: des nations
  rationale: Dans ce contexte, le terme désigne des peuples étrangers hostiles. « Nations » préserve sa portée ethnique et politique sans la techniciser en « païens » ou « Gentils ».
- source_word: ἀδίκως παραγενομένων ἐπʼ αὐτοὺς
  choice: qui étaient venues les attaquer injustement
  rationale: Cette formulation rend l’arrivée hostile indiquée par ἐπί et conserve le jugement moral porté par ἀδίκως.
- source_word: ἀγωνίσασθαι γενναίως
  choice: à combattre courageusement
  rationale: Le contexte est militaire; « combattre » est donc précis, et « courageusement » exprime la vaillance indiquée par l’adverbe.
theological_decisions:
- issue: Sens de ἐθνῶν dans le contexte militaire juif
  choice: nations
  alternative: païens / Gentils / peuples
  rationale: « Nations » maintient le sens ethnique et politique probable tout en évitant d’importer une catégorie théologique chrétienne plus tardive.
- issue: Traitement de τοῖς δεσμίοις, lecture lexicalement claire mais contextuellement difficile
  choice: prisonniers dans le texte, avec note explicative
  alternative: ennemis
  rationale: Le grec attesté signifie normalement « prisonniers » ou « captifs ». Le contexte peut faire penser aux forces ennemies, mais remplacer le terme dans le texte résoudrait une tension réelle de la source. La note expose donc l’alternative sans modifier silencieusement le grec.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme conserve la structure d’une exhortation militaire. La difficulté textuelle de δεσμίοις est maintenue dans le corps du verset et explicitée en note plutôt que résolue par conjecture.
