base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/023.yaml
  text: He also brought Eleazar[a], and after bringing forward the holy book and giving the watchword[b], “God’s Help,” he himself led the first company and engaged Nicanor.
translation:
  language: fr
  text: Il fit aussi avancer Éléazar. Puis, après avoir présenté le livre sacré et donné comme mot d’ordre « Secours de Dieu »[a], il prit lui-même la tête de la première troupe[b] et engagea le combat contre Nicanor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formule grecque est condensée. On peut aussi comprendre : « Aide de Dieu » ou « Dieu est secours ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme grec désigne une unité militaire ; on pourrait aussi traduire par « première compagnie » ou « première cohorte ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι δὲ καὶ Ἐλεάζαρον
  choice: Il désigna aussi Éléazar
  rationale: L’accusatif « Éléazar » prolonge naturellement le verbe προεστήσατο du verset précédent. La reprise explicite de « désigna » donne en français une phrase complète sans faire d’Éléazar, à tort, le sujet des actions suivantes.
- source_word: παραγαγὼν τὴν ἱερὰν βίβλον
  choice: après avoir présenté le livre sacré
  rationale: Le participe aoriste indique une action antérieure au combat. « Présenté » rend l’idée de faire avancer ou d’exposer le livre devant les troupes, tandis que « livre sacré » évite de préciser sans preuve qu’il s’agissait matériellement d’un rouleau.
- source_word: σύνθημα
  choice: mot d’ordre
  rationale: Dans ce cadre militaire, le terme désigne un signe verbal convenu ou un mot de ralliement. « Mot d’ordre » est naturel en français et conserve cette fonction.
- source_word: θεοῦ Βοηθείας
  choice: Secours de Dieu
  rationale: Cette formule grecque condensée sert de contenu au mot d’ordre. « Secours de Dieu » conserve le rapport génitival et la brièveté d’une formule de ralliement.
- source_word: τῆς πρώτης σπείρης
  choice: la première troupe
  rationale: σπεῖρα désigne ici une unité militaire. « Troupe » reste clair sans imposer l’organisation romaine précise que pourrait suggérer « cohorte ».
- source_word: αὐτὸς προηγούμενος
  choice: il prit lui-même la tête
  rationale: La tournure souligne que Judas conduisit personnellement l’unité, vraisemblablement depuis l’avant. Le français garde à la fois l’emphase de αὐτός et l’idée de direction.
- source_word: συνέβαλε τῷ Νικάνορι
  choice: engagea le combat contre Nicanor
  rationale: Dans un récit militaire, συμβάλλω avec le datif exprime l’entrée en affrontement. Cette formulation est plus précise que « attaqua », qui rendrait l’action trop unilatérale.
theological_decisions:
- issue: Sujet implicite de la chaîne participiale et du verbe principal
  choice: 'Judas demeure le sujet des actions : il présente le livre, donne le mot d’ordre, prend la tête de la troupe et combat Nicanor.'
  alternative: Éléazar pourrait être compris comme le sujet des actions qui suivent si l’on détachait la phrase de son contexte.
  rationale: Éléazar est à l’accusatif et complète naturellement le verbe du verset précédent, tandis que les participes et le verbe principal poursuivent les actions du sujet narratif, Judas. Cette lecture respecte la syntaxe sans attribuer à Éléazar un rôle que la forme grecque donnée ne soutient pas.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase explicite le verbe sous-entendu avec Éléazar à partir du contexte immédiat, tout en conservant l’enchaînement militaire et la concision du mot d’ordre.
