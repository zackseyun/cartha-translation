  text: But they killed the commander among those with Timothy, a thoroughly worthless man who had caused the Jews much distress.
translation:
  language: fr
  text: Mais ils tuèrent le chef de tribu qui se trouvait parmi l’entourage de Timothée, un homme tout à fait méprisable qui avait beaucoup fait souffrir les Juifs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάρχην
  choice: chef de tribu
  rationale: Le terme désigne littéralement le dirigeant d’une tribu ou d’un groupe ethnique; cette traduction conserve cette précision plutôt que de généraliser en « commandant ».
- source_word: τῶν περὶ Τιμόθεον
  choice: qui se trouvait parmi les hommes de Timothée
  rationale: La tournure grecque désigne l’entourage ou les partisans de Timothée; « parmi » évite d’affirmer qu’il commandait nécessairement tout ce groupe.
- source_word: ἀνυπόστατον
  choice: sans scrupules
  rationale: Dans ce contexte, l’adjectif porte un jugement moral très négatif; « sans scrupules » est naturel et dignifié, sans recourir à une formulation obscure.
- source_word: πολλὰ ... ἐπιλελυπηκότα
  choice: avait fait beaucoup de mal aux Juifs
  rationale: Le parfait périphrastique décrit les nombreux torts et chagrins qu’il leur avait déjà causés; cette formulation française en rend clairement la portée.
