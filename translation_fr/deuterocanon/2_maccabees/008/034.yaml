  text: But Nikanor[a], that utterly defiled man, who had brought three thousand merchants for the sale of the Jews,
translation:
  language: fr
  text: Mais Nicanor, cet homme trois fois maudit[a], qui avait amené trois mille marchands en vue de la vente des Juifs,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cet homme entièrement souillé » ou « cet homme absolument abject ». L’adjectif grec est rare, fortement péjoratif, et comporte un élément intensif signifiant littéralement « trois fois » venant renforcer l’insulte.
    reason: lexical_alternative
lexical_decisions:
- source_word: τρισαλιτήριος
  choice: trois fois maudit
  rationale: Le composé rare est une invective très forte. « Trois fois » rend explicitement l’élément intensif τρις-, tandis que « maudit » conserve la portée morale et religieuse de ἀλιτήριος dans un français naturel et solennel.
- source_word: Νικάνωρ
  choice: Nicanor
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom grec.
- source_word: τρισχιλίους ἐμπόρους
  choice: trois mille marchands
  rationale: Rend directement le nombre et le terme commercial désignant ceux qui devaient acheter les captifs.
- source_word: ἐπὶ τὴν πρᾶσιν τῶν Ἰουδαίων
  choice: en vue de la vente des Juifs
  rationale: La tournure exprime le but de leur venue et garde explicitement les Juifs comme objets de la vente projetée.
- source_word: ἀγαγών
  choice: qui avait amené
  rationale: Le plus-que-parfait situe naturellement cette action comme antérieure à la suite du récit, et la relative restitue le participe grec.
theological_decisions:
- issue: Sens de l’invective rare τρισαλιτήριος
  choice: trois fois maudit
  alternative: entièrement souillé ; absolument abject
  rationale: La traduction conserve à la fois l’intensification par τρις- et la dimension morale ou religieuse du terme, sans réduire l’expression à une simple insulte émotionnelle.
translation_notes:
  register: Français international moderne, digne et intelligible. La phrase demeure ouverte par une virgule, conformément au fragment grec, qui se poursuit au verset suivant dans son contexte syntaxique.
