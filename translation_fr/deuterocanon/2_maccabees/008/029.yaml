base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/029.yaml
  text: After doing these things[a], and making a common prayer of supplication[b], they begged the merciful Lord to be fully reconciled to his servants.
translation:
  language: fr
  text: Après avoir fait cela et adressé ensemble une supplication, ils implorèrent le Seigneur miséricordieux d’être pleinement réconcilié[a] avec ses serviteurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « définitivement » ou « jusqu’au bout ». L’expression grecque peut souligner soit la plénitude de la réconciliation, soit son caractère final.
    reason: alternative_reading
lexical_decisions:
- source_word: διαπραξάμενοι
  choice: Après avoir fait cela
  rationale: Le participe aoriste récapitule les actions précédentes comme accomplies, sans qu’il soit nécessaire de préciser davantage leur résultat.
- source_word: κοινὴν ἱκετίαν ποιησάμενοι
  choice: élevé ensemble une supplication
  rationale: Cette formulation française naturelle exprime à la fois le caractère collectif de κοινήν et la prière instante désignée par ἱκετίαν.
- source_word: ἐλεήμονα κύριον
  choice: le Seigneur miséricordieux
  rationale: « Seigneur » rend le titre divin κύριον, tandis que « miséricordieux » conserve la disposition exprimée par ἐλεήμονα.
- source_word: ἠξίουν
  choice: ils demandèrent
  rationale: Dans ce contexte de supplication, le verbe désigne une demande pressante. La phrase précédente porte déjà l’intensité, ce qui permet d’éviter la redondance de « supplièrent ».
- source_word: εἰς τέλος
  choice: pleinement
  rationale: L’expression peut marquer l’achèvement ou l’intensité de la réconciliation. « Pleinement » convient bien au contexte tout en laissant l’autre nuance en note.
- source_word: καταλλαγῆναι
  choice: de se réconcilier
  rationale: Le passif exprime ici le rétablissement de la relation ou de la faveur du Seigneur envers son peuple, sans réduire le sens à un simple apaisement émotionnel.
- source_word: τοῖς αὐτοῦ δούλοις
  choice: avec ses serviteurs
  rationale: Quand il désigne la relation des fidèles à Dieu, « serviteurs » est le terme français biblique naturel et digne; il conserve l’idée d’appartenance et de dépendance sans suggérer principalement l’institution sociale de l’esclavage.
theological_decisions:
- issue: Sens de la réconciliation divine
  choice: de se réconcilier avec ses serviteurs
  alternative: de s’apaiser envers ses serviteurs
  rationale: « Se réconcilier » préserve la dimension relationnelle de καταλλάσσω et la tension du texte, qui présente les humains demandant à Dieu de rétablir pleinement sa faveur.
- issue: Portée de εἰς τέλος
  choice: pleinement
  alternative: définitivement / jusqu’au bout
  rationale: Le contexte favorise une réconciliation menée à son plein accomplissement, mais l’expression grecque peut aussi comporter une nuance temporelle ou finale; celle-ci est signalée en note.
- issue: Traduction de δοῦλοις appliqué aux fidèles
  choice: serviteurs
  alternative: esclaves
  rationale: « Serviteurs » est idiomatique en français pour la dépendance envers Dieu. Le mot grec peut littéralement désigner des esclaves, mais ce rendu risquerait ici de faire passer le statut social au premier plan.
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe reste proche de l’enchaînement grec tout en évitant les tournures lourdes; « élevé ensemble une supplication » rend naturellement la prière collective.
