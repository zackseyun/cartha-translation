  source_fidelity: 'Révision nécessaire : καταλλαγῆναι est un infinitif passif dont le sujet est « le Seigneur ». « De se réconcilier » est possible en français, mais efface cette voix passive et peut suggérer une réconciliation strictement réciproque. « D’être pleinement réconcilié avec ses serviteurs » conserve plus exactement la construction et la tension relationnelle du grec.'
