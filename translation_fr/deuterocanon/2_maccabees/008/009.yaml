base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/009.yaml
  text: But he quickly selected Nicanor son of Patroclus[a], one of his chief Friends, and sent him, having assigned to him no fewer than twenty thousand from the nations of every tribe to wipe out the whole Jewish people. They also appointed with him Gorgias, a military man experienced in matters of war[c][b],
translation:
  language: fr
  text: Mais il choisit rapidement Nicanor, fils de Patrocle, l’un des principaux Amis[a], et l’envoya après avoir placé sous ses ordres pas moins de vingt mille hommes issus de peuples de toutes sortes[b], afin d’exterminer tout le peuple de Judée[c]. On lui adjoignit aussi Gorgias, un général qui avait une solide expérience des opérations militaires.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « principaux Amis » désigne probablement un titre de cour porté par de hauts dignitaires du roi, et non simplement ses amis personnels.
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque est inhabituelle ; elle peut désigner des troupes d’origines ethniques diverses ou des peuples de toutes sortes.
    reason: lexical_alternative
  - marker: c
    text: 'Autre traduction possible : « afin d’extirper toute la population de Judée ».'
    reason: alternative_reading
lexical_decisions:
- source_word: προχειρισάμενος
  choice: choisit
  rationale: Le participe exprime ici le choix ou la désignation de Nicanor pour une mission; « choisit » est naturel et reste proche du grec.
- source_word: τῶν πρώτων φίλων
  choice: l’un des principaux Amis
  rationale: Dans le langage de cour hellénistique, « Amis » peut désigner des associés de haut rang du souverain; la majuscule signale cet emploi probablement titulaire.
- source_word: ὑποτάξας
  choice: après avoir placé sous ses ordres
  rationale: Le verbe indique que les forces sont mises sous l’autorité militaire de Nicanor.
- source_word: παμφύλων ἔθνη
  choice: des hommes issus de peuples de toutes sortes
  rationale: La tournure grecque inhabituelle évoque des forces d’origines diverses. L’ajout de « hommes » explicite naturellement ce que dénombre « vingt mille » sans réduire ἔθνη à de simples unités militaires.
- source_word: οὐκ ἐλάττους τῶν δισμυρίων
  choice: pas moins de vingt mille
  rationale: Expression quantitative française idiomatique correspondant exactement au comparatif grec.
- source_word: τὸ πᾶν τῆς Ἰουδαίας ἐξᾶραι γένος
  choice: afin d’exterminer tout le peuple de Judée
  rationale: ἐξᾶραι exprime ici l’élimination totale; γένος désigne collectivement le peuple, tandis que le génitif « de Judée » est conservé plutôt que transformé sans nécessité en adjectif ethnique.
- source_word: συνέστησαν δὲ αὐτῷ καὶ Γοργίαν
  choice: On lui adjoignit aussi Gorgias
  rationale: Le verbe indique que Gorgias fut placé aux côtés de Nicanor. Le sujet pluriel indéfini du grec se rend naturellement par « on ».
- source_word: ἄνδρα στρατηγὸν
  choice: un général
  rationale: στρατηγός désigne directement un chef ou commandant militaire; « général » est clair et respecte l’apposition grecque.
- source_word: εὖ πολεμικαῖς χρείαις ἔχοντα πεῖραν
  choice: qui avait une solide expérience des opérations militaires
  rationale: La formulation rend l’expérience pratique et éprouvée de Gorgias dans les affaires de guerre.
theological_decisions:
- issue: Sens collectif de γένος dans un projet d’anéantissement ethnique
  choice: peuple de Judée
  alternative: race de Judée; nation de Judée; peuple juif
  rationale: « Peuple » conserve le sens collectif ethnonational sans les connotations biologiques modernes de « race ». « De Judée » maintient l’ambiguïté formelle du génitif grec.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit le mouvement de la phrase grecque tout en évitant une accumulation pesante de participes. « Amis » prend une majuscule pour signaler son probable emploi comme titre de cour.
