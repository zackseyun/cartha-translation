  yaml_path: translation/deuterocanon/2_maccabees/008/028.yaml
  text: But after the Sabbath[a], having distributed some of the spoils to those who had been oppressed, and to the widows and the orphans[b], they divided the rest among themselves and their children.
translation:
  language: fr
  text: Mais après le sabbat, après avoir distribué une part du butin aux personnes maltraitées, aux veuves et aux orphelins, ils se partagèrent le reste avec leurs enfants.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ δὲ τὸ σάββατον
  choice: Mais après le sabbat
  rationale: μετά avec l’accusatif situe l’action après le sabbat. δέ marque ici une transition légère; « Mais » conserve l’articulation avec le verset précédent sans créer une opposition forte.
- source_word: τοῖς ἠκισμένοις
  choice: aux personnes maltraitées
  rationale: Le participe parfait passif désigne des personnes ayant subi de mauvais traitements, des violences ou des torts. « personnes maltraitées » reste large et naturel sans imposer une catégorie sociale technique.
- source_word: ταῖς χήραις καὶ τοῖς ὀρφανοῖς
  choice: aux veuves et aux orphelins
  rationale: Ces équivalents directs préservent les catégories sociales explicitement nommées dans le grec.
- source_word: μερίσαντες ἀπὸ τῶν σκύλων
  choice: ils prélevèrent sur le butin une part qu’ils distribuèrent
  rationale: μερίζω exprime le partage ou la distribution, tandis que ἀπό indique qu’une part est tirée du butin. Cette formulation française explicite naturellement la relation syntaxique sans ajouter d’idée étrangère.
- source_word: τὰ λοιπὰ
  choice: le reste
  rationale: L’expression désigne ce qui demeurait du butin après la première distribution.
- source_word: αὐτοὶ καὶ τὰ παιδία
  choice: eux et leurs enfants
  rationale: αὐτοί renvoie aux combattants et τὰ παιδία à leurs enfants ou jeunes dépendants. Le possessif est fourni par le contexte et rend la relation naturellement en français.
- source_word: διεμερίσαντο
  choice: ils se partagèrent
  rationale: Le moyen de διαμερίζω convient à l’idée qu’ils répartirent entre eux et leurs enfants ce qui restait.
theological_decisions:
- issue: Priorité donnée aux personnes vulnérables dans la répartition du butin
  choice: Le texte indique qu’une part du butin fut d’abord distribuée aux personnes maltraitées, aux veuves et aux orphelins, avant le partage du reste.
  alternative: Traduire plus formellement « ayant partagé du butin » sans préciser qu’une part en fut prélevée.
  rationale: La construction μερίσαντες ἀπὸ τῶν σκύλων, suivie de τὰ λοιπά, établit qu’une portion fut distribuée d’abord et que le reliquat fut ensuite partagé. Cette précision découle de la syntaxe grecque, non d’une interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’ordre des actions tout en évitant une succession pesante de participes. « Butin » est le terme militaire courant et précis; « personnes maltraitées » préserve l’étendue de ἠκισμένοις.
