translation_notes:
  register: Français international moderne, digne et narratif. « Cœlé-Syrie » conserve la désignation historique usuelle. La coordination grecque, assez lourde littéralement, est rendue par l’expression fluide « allait de succès en succès », qui préserve l’idée d’une réussite croissante ou répétée.
