base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/008.yaml
  text: But when Philip saw that the man was gradually making progress and advancing all the more often in successes, he wrote to Ptolemy, the governor of Coele-Syria and Phoenicia, to come to the aid of the king’s cause.
translation:
  language: fr
  text: Mais Philippe, voyant que cet homme[a] progressait peu à peu et connaissait des succès de plus en plus fréquents, écrivit à Ptolémée, gouverneur de la Cœlé-Syrie et de la Phénicie, pour qu’il vienne soutenir la cause du roi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit de Judas Maccabée, dont parle le contexte.
    reason: cross_reference
  - marker: b
    text: Ou « les intérêts du roi » ou « les affaires du roi ». L’expression grecque peut désigner l’ensemble de la cause royale, et non une seule opération militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνιδὼν
  choice: voyant
  rationale: Le participe exprime la constatation qui motive l’action de Philippe. « Voyant » est naturel et conserve cette relation circonstancielle.
- source_word: κατὰ μικρόν
  choice: peu à peu
  rationale: Cette locution indique une progression graduelle; « peu à peu » en restitue clairement le mouvement par étapes.
- source_word: εἰς προκοπὴν ἐρχόμενον
  choice: progressait
  rationale: La formulation grecque décrit l’accès à une situation d’avancement. « Progressait » est idiomatique et n’impose pas l’idée particulière de prospérité matérielle.
- source_word: τὸν ἄνδρα
  choice: cet homme
  rationale: Le grec désigne explicitement « l’homme » déjà évoqué. Le démonstratif français assure une reprise naturelle sans insérer son nom dans le corps du verset.
- source_word: πυκνότερον ... ἐν ταῖς εὐημερίαις προβαίνοντα
  choice: allait de succès en succès
  rationale: La tournure française rend naturellement l’accumulation ou la fréquence croissante des résultats favorables, sans la raideur d’une traduction mot à mot.
- source_word: στρατηγὸν
  choice: gouverneur
  rationale: Dans ce contexte, le terme désigne la fonction territoriale de Ptolémée sur la Cœlé-Syrie et la Phénicie, même si elle comporte une autorité militaire.
- source_word: ἐπιβοηθεῖν
  choice: pour qu’il vienne soutenir
  rationale: Le verbe composé implique une intervention en renfort; cette formulation conserve l’idée de venir apporter son aide.
- source_word: τοῖς τοῦ βασιλέως πράγματι
  choice: la cause du roi
  rationale: Le syntagme renvoie ici aux affaires ou intérêts royaux dans le conflit. « La cause du roi » convient au cadre politico-militaire tout en restant assez large.
