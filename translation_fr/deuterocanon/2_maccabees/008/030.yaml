base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/030.yaml
  text: And after crushing the forces around Timothy and Bacchides[a], they killed more than twenty thousand of them, gained firm control of very high strongholds, and divided the plentiful plunder, making themselves equal sharers with the oppressed and orphans and widows, and even with the elderly.
translation:
  language: fr
  text: Après avoir écrasé les troupes de Timothée et de Bacchidès, ils en tuèrent plus de vingt mille, s’assurèrent fermement la maîtrise de forteresses très élevées et répartirent un abondant butin, se réservant une part égale à celle des personnes ayant subi des sévices, des orphelins, des veuves et même des personnes âgées.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre compréhension possible : « en donnant aux personnes ayant subi des sévices, aux orphelins, aux veuves et même aux personnes âgées une part égale à la leur ». Le pronom grec peut renvoyer soit aux combattants, soit aux bénéficiaires du partage.'
    reason: La syntaxe grecque permet deux analyses du référent de αὐτούς ; la note préserve cette ambiguïté sans l’effacer.
lexical_decisions:
- source_word: συνερείσαντες
  choice: après avoir écrasé
  rationale: Le participe exprime une défaite violente et décisive; « écrasé » conserve cette force dans un récit militaire.
- source_word: τοὺς περὶ Τιμόθεον καὶ Βακχίδην
  choice: les troupes de Timothée et de Bacchidès
  rationale: La tournure οἱ περὶ suivie de noms désigne le groupe associé aux personnages nommés; « les troupes de » rend naturellement ici le contexte militaire sans réduire l’expression aux deux chefs eux-mêmes.
- source_word: ὑπὲρ τοὺς δισμυρίους αὐτῶν ἀνεῖλον
  choice: ils en tuèrent plus de vingt mille
  rationale: ὑπέρ avec l’accusatif signifie « plus de », δισμύριοι « vingt mille », et ἀναιρέω désigne ici le fait de tuer au combat. Le pronom « en » reprend les troupes vaincues.
- source_word: ὀχυρωμάτων ὑψηλῶν εὖ μάλα ἐγκρατεῖς ἐγένοντο
  choice: prirent solidement possession de forteresses très élevées
  rationale: ἐγκρατεῖς γενέσθαι indique l’acquisition d’une maîtrise ou possession effective; εὖ μάλα renforce ὑψηλῶν. « Forteresses » convient à des ouvrages ou places fortifiés.
- source_word: λάφυρα πλείονος
  choice: un abondant butin
  rationale: L’expression désigne une grande quantité de dépouilles prises à l’ennemi; le collectif « butin » est idiomatique en français.
- source_word: ἐμερίσαντο
  choice: répartirent
  rationale: Le verbe signifie diviser ou distribuer en parts; « répartirent » s’accorde naturellement avec le partage qui suit.
- source_word: ἰσομοίρους αὐτοὺς ... ποιήσαντες
  choice: en se donnant une part égale à celle de
  rationale: 'Cette formulation suit la lecture où αὐτούς renvoie au groupe agissant: les combattants ne se réservent pas davantage que les personnes vulnérables. La syntaxe grecque admet toutefois une autre compréhension, signalée en note.'
- source_word: τοῖς ἠκισμένοις
  choice: les victimes de mauvais traitements
  rationale: Le terme renvoie à des personnes maltraitées ou violentées. Cette traduction demeure précise sans déterminer davantage la nature des sévices.
- source_word: πρεσβυτέροις
  choice: les personnes âgées
  rationale: Dans cette liste de bénéficiaires vulnérables, le mot désigne vraisemblablement les gens âgés plutôt que les titulaires d’une fonction communautaire.
theological_decisions:
- issue: Référent de αὐτούς dans ἰσομοίρους αὐτοὺς ... ποιήσαντες
  choice: Les combattants se donnent la même part qu’aux victimes de mauvais traitements, aux orphelins, aux veuves et aux personnes âgées.
  alternative: Ils donnent à ces groupes vulnérables une part égale à la leur.
  rationale: Le pronom peut reprendre le groupe qui accomplit les actions, avec une valeur proche du réfléchi, mais il peut aussi être compris comme visant les bénéficiaires. Le texte principal retient la première analyse tout en conservant l’ambiguïté réelle dans une note.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire militaire reste direct; la longue coordination du grec est conservée sous une forme lisible. « Personnes âgées » évite de suggérer une charge officielle, tandis que « victimes de mauvais traitements » rend le sens concret du grec.
