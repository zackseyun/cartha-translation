base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/020.yaml
  text: 'And the engagement in Babylonia against the Galatians had gone this way: when all who came to the need were eight thousand[a], together with four thousand Macedonians, and the Macedonians were at a loss, the six thousand destroyed the one hundred twenty thousand because of the help coming to them from heaven, and they received great advantage.'
translation:
  language: fr
  text: 'Il leur rappela aussi le combat livré en Babylonie contre les Galates[a] : tous ceux qui étaient venus répondre à l’urgence étaient huit mille, avec quatre mille Macédoniens. Alors que les Macédoniens se trouvaient démunis, les six mille firent périr les cent vingt mille grâce au secours qui leur venait du ciel, et ils en retirèrent un avantage considérable.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Gaulois ». Le terme grec peut désigner les Galates d’Anatolie ou, plus largement, les peuples celtes appelés Gaulois.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ τὴν … παράταξιν
  choice: Il leur rappela aussi le combat
  rationale: L’accusatif dépend du verbe « rappela » au verset précédent; celui-ci est repris en français afin que le verset forme une phrase intelligible. « Combat » rend naturellement le sens militaire de παράταξις sans suggérer une campagne prolongée.
- source_word: Γαλάτας
  choice: Galates
  rationale: « Galates » rend directement l’ethnonyme grec, tandis que l’autre désignation historique possible est signalée en note.
- source_word: ἐπὶ τὴν χρείαν ἦλθον
  choice: étaient venus répondre à l’urgence
  rationale: La formulation conserve l’idée d’une nécessité pressante sans préciser indûment qu’ils venaient nécessairement porter secours à un groupe déterminé.
- source_word: ἀπορουμένων
  choice: se trouvaient démunis
  rationale: Le participe évoque le manque de ressources et une situation sans issue; « démunis » maintient ce sens pratique sans le réduire à la seule perplexité psychologique.
- source_word: ἀπώλεσαν
  choice: anéantirent
  rationale: Dans ce contexte militaire, le verbe exprime une destruction massive; « anéantirent » en restitue la force sans détailler le mode exact.
- source_word: δώδεκα μυριάδας
  choice: les cent vingt mille
  rationale: Le nombre est exprimé selon l’usage français courant tout en conservant exactement la quantité donnée par le grec, soit douze myriades.
- source_word: διὰ τὴν γινομένην αὐτοῖς ἀπʼ οὐρανοῦ βοήθειαν
  choice: grâce au secours qui leur venait du ciel
  rationale: Cette formulation préserve l’origine céleste explicite du secours et la réserve révérencielle du texte, sans remplacer « du ciel » par une mention directe de Dieu.
- source_word: ὠφέλειαν πολλὴν ἔλαβον
  choice: ils en retirèrent un avantage considérable
  rationale: ὠφέλεια désigne largement un bénéfice ou un avantage. Cette traduction n’impose pas l’idée plus précise d’un butin matériel.
theological_decisions:
- issue: Nature du « secours venant du ciel »
  choice: Conserver la formulation indirecte « du ciel »
  alternative: Expliciter « le secours de Dieu » ou y voir seulement une fortune providentielle
  rationale: Dans ce registre juif grec, le ciel peut désigner avec révérence l’origine divine de l’intervention. La traduction maintient néanmoins l’expression exacte et son degré de réserve au lieu d’expliciter davantage.
- issue: Discordance apparente entre huit mille, quatre mille et six mille
  choice: Conserver tous les nombres tels qu’ils figurent dans le texte source
  alternative: Harmoniser ou expliquer les effectifs dans le corps du verset
  rationale: Le rapport entre ces effectifs demeure difficile dans le grec transmis. Le modifier résoudrait artificiellement une tension textuelle réelle.
translation_notes:
  register: Français international moderne, digne et narratif. La reprise de « Il leur rappela » explicite uniquement la dépendance syntaxique au verset précédent. Les effectifs, malgré leur enchaînement difficile, restent inchangés; le texte évite aussi de réduire l’« avantage » à un butin.
