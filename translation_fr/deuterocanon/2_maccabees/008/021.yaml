  text: With these words he encouraged them and made them ready to die for the laws and the fatherland[a], and he formed the army into four parts.
translation:
  language: fr
  text: Par ces paroles, il leur donna courage et les rendit prêts à mourir pour les lois et pour la patrie. Puis il répartit l’armée en quatre parties[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il fit de l’armée quelque chose de quatre parties »; ou : « il la répartit en quatre divisions ».'
    reason: La note conserve l’ancre du dossier et rend visible la tournure grecque avec τι, sans introduire une désignation militaire plus précise que le texte.
lexical_decisions:
- source_word: ἐφʼ οἷς
  choice: Par ces paroles
  rationale: La tournure renvoie à l’exhortation précédente et en indique l’effet. « Par ces paroles » exprime naturellement cette valeur instrumentale en français.
- source_word: εὐθαρσεῖς αὐτοὺς παραστήσας
  choice: il leur donna courage
  rationale: L’expression signifie littéralement qu’il les mit dans un état de confiance ou de courage. La formulation causative française restitue ce sens sans lourdeur.
- source_word: ἑτοίμους ... ἀποθνήσκειν
  choice: les rendit prêts à mourir
  rationale: Cette traduction conserve sans l’atténuer la disposition à mourir exprimée par l’infinitif grec.
- source_word: ὑπὲρ τῶν νόμων καὶ τῆς πατρίδος
  choice: pour les lois et pour la patrie
  rationale: « Pour » exprime ici la cause défendue. Le pluriel « les lois » suit le grec, et « la patrie » garde la force ancestrale et collective de πατρίς dans un français actuel.
- source_word: τετραμερές τι ἐποίησεν τὸ στράτευμα
  choice: il répartit l’armée en quatre corps
  rationale: La formulation idiomatique décrit l’organisation de l’armée en quatre parties. « Corps » convient à des divisions militaires, tandis que la note signale la forme plus littérale et la légère approximation portée par τι.
theological_decisions:
- issue: Sens de πατρίς dans l’association entre fidélité aux lois et attachement national
  choice: la patrie
  alternative: le pays ancestral
  rationale: « La patrie » conserve la portée affective, collective et ancestrale du terme grec sans ajouter au texte une définition doctrinale ou politique particulière.
translation_notes:
  register: 'Français international moderne, clair et digne. La syntaxe participiale grecque est déployée en deux propositions pour faciliter la lecture, sans modifier la succession logique : encouragement et préparation au sacrifice, puis organisation de l’armée.'
