base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/015.yaml
  text: and not because of them[a], but because of the covenants made with their fathers[b], and because of the invocation of his majestic and magnificent name over them.
translation:
  language: fr
  text: et non à cause d’eux[a], mais à cause des alliances conclues avec leurs ancêtres, et parce que son nom auguste et majestueux avait été invoqué sur eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « non pour leur bien ».'
    reason: Alternative lexicale pour la nuance bénéficiaire possible de διʼ αὐτούς, tandis que le texte principal rend directement la valeur causale.
  - marker: b
    text: 'Littéralement : « à cause de l’invocation sur eux de son nom auguste et majestueux » ; cette expression indique que le peuple est placé sous le nom de Dieu et lui appartient.'
    reason: Note culturelle et idiomatique expliquant l’image biblique du nom divin invoqué sur un peuple.
lexical_decisions:
- source_word: εἰ μὴ διʼ αὐτούς
  choice: sinon à cause d’eux-mêmes, du moins
  rationale: Dans la phrase dépendante qui se poursuit depuis le verset précédent, εἰ μή marque ici le contraste entre ce que le peuple ne peut invoquer en sa faveur et les deux motifs qui suivent. « À cause d’eux-mêmes » conserve la valeur causale de διά et explicite naturellement le pronom en français.
- source_word: διὰ τὰς πρὸς τοὺς πατέρας αὐτῶν διαθήκας
  choice: à cause des alliances conclues avec leurs ancêtres
  rationale: « Alliances » convient au contexte scripturaire de διαθῆκαι. « Conclues avec » rend idiomatiquement la relation exprimée par πρός, tandis que « ancêtres » est ici plus naturel que le littéral « pères » pour désigner les générations ancestrales.
- source_word: ἕνεκα
  choice: parce que
  rationale: ἕνεκα introduit le second motif de l’intervention demandée. La tournure verbale française permet de rendre clairement le substantif d’action ἐπίκλησις sans lourdeur.
- source_word: τῆς ἐπʼ αὐτοὺς ἐπικλήσεως
  choice: avait été invoqué sur eux
  rationale: La formulation conserve l’idée du nom divin invoqué ou prononcé sur le peuple ainsi que la relation exprimée par ἐπί. Elle évite de réduire l’expression à la seule réputation de Dieu.
- source_word: τοῦ σεμνοῦ καὶ μεγαλοπρεποῦς ὀνόματος αὐτοῦ
  choice: son nom auguste et majestueux
  rationale: « Auguste » restitue la dignité sacrée de σεμνός, et « majestueux » la grandeur imposante de μεγαλοπρεπής, dans un registre élevé mais compréhensible.
theological_decisions:
- issue: Fondement de l’intervention divine demandée
  choice: 'Le texte oppose l’absence de mérite propre du peuple aux deux motifs explicitement nommés : les alliances avec ses ancêtres et le nom de Dieu invoqué sur lui.'
  alternative: Reformuler le second motif comme un simple souci de la réputation de Dieu, ou fondre les deux motifs en une idée générale de fidélité divine.
  rationale: Le grec maintient deux motifs distincts après la négation initiale. La traduction les préserve sans développer une doctrine du mérite, de l’élection ou de l’alliance au-delà de ce que dit le verset.
- issue: Portée de l’invocation du nom divin
  choice: Conserver l’image selon laquelle le nom de Dieu a été invoqué « sur » le peuple.
  alternative: Dire seulement que le peuple « porte » le nom de Dieu.
  rationale: L’alternative explique l’idiome mais en fixe davantage le sens. Le texte principal garde donc l’image grecque et la note en éclaire la portée.
translation_notes:
  register: Français international actuel, digne et lisible. Le verset étant syntaxiquement lié à la prière commencée au verset précédent, l’ouverture « et, sinon… du moins… » conserve son caractère dépendant. Les termes « alliances », « nom » et « invoqué sur eux » maintiennent le vocabulaire et l’imagerie scripturaires sans archaïsme excessif.
