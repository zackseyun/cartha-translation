base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/014.yaml
  text: But they were selling all that remained[a], and at the same time were imploring the Lord to rescue those who had been sold by the ungodly Nikanor before he encountered them.
translation:
  language: fr
  text: Mais ils vendaient tout ce qui leur restait et, en même temps, suppliaient le Seigneur de délivrer ceux que l’impie Nicanor avait vendus[a] avant de les rencontrer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: D’après le contexte, il s’agit de personnes vendues comme esclaves ; le grec dit simplement « vendues ».
    reason: Précision contextuelle d’une ellipse lexicale sans l’introduire dans le texte principal.
lexical_decisions:
- source_word: τὰ περιλελειμμένα πάντα
  choice: tout ce qui leur restait
  rationale: Le participe parfait substantivé avec πάντα désigne l’ensemble de leurs biens restants. Cette formulation française est naturelle sans préciser davantage la nature de ces biens.
- source_word: ἐπώλουν
  choice: vendaient
  rationale: L’imparfait grec présente l’action comme en cours ou répétée ; l’imparfait français en conserve l’aspect duratif.
- source_word: ὁμοῦ δὲ
  choice: et, en même temps
  rationale: ὁμοῦ marque ici la simultanéité entre la vente de leurs biens et leur supplication.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Dans cette prière, κύριος désigne Dieu ; « le Seigneur » est la formulation française consacrée et appropriée.
- source_word: ἠξίουν
  choice: suppliaient
  rationale: Dans un contexte de prière face à une menace pressante, le verbe exprime une demande insistante plutôt qu’une simple requête.
- source_word: ῥύσασθαι
  choice: de délivrer
  rationale: Le verbe évoque l’action d’arracher quelqu’un à un danger. « Délivrer » convient au registre biblique tout en restant courant et sans imposer ici un sens sotériologique plus large.
- source_word: τοὺς ... πεπραμένους
  choice: ceux ... [qu’il] avait vendus
  rationale: Le participe parfait indique une vente antérieure dont le résultat demeure. Le texte grec ne précise pas explicitement « comme esclaves » ; cette implication contextuelle est donc signalée en note seulement.
- source_word: ὑπὸ τοῦ δυσσεβοῦς Νικάνορος
  choice: par l’impie Nicanor
  rationale: « Impie » conserve la forte appréciation morale et religieuse de δυσσεβής. « Nicanor » suit la forme française traditionnelle du nom.
- source_word: πρὶν συντυχεῖν
  choice: avant même de les rencontrer
  rationale: πρίν suivi de l’infinitif situe la rencontre comme non encore réalisée au moment de la vente. Le sujet sous-entendu est naturellement Nicanor ; « rencontrer » préserve la relative neutralité du grec sans expliciter davantage le caractère militaire de l’affrontement.
theological_decisions:
- issue: Traduction de κύριος dans une prière adressée à Dieu
  choice: le Seigneur
  alternative: le maître
  rationale: Le contexte identifie clairement Dieu comme destinataire de la supplication. « Le Seigneur » rend normalement κύριος dans cet emploi.
- issue: Faut-il expliciter la vente comme une vente en esclavage ?
  choice: avait vendus
  alternative: avait vendus comme esclaves
  rationale: Le contexte indique fortement une vente en esclavage, mais πεπραμένους signifie littéralement « vendus » sans complément. Le texte principal conserve cette sobriété, tandis que la note rend l’implication accessible.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la simultanéité des deux actions, l’aspect imperfectif et l’étrangeté historique de la vente anticipée des futurs captifs. Le marqueur [a] est placé immédiatement après « vendus », terme auquel la note se rapporte.
