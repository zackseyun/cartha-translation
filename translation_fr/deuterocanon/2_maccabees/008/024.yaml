base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/024.yaml
  text: But with the Almighty as their ally, they slaughtered more than nine thousand of the enemy, and they wounded and maimed most of Nicanor’s army, and forced them all to flee.
translation:
  language: fr
  text: Mais, ayant le Tout-Puissant pour allié, ils massacrèrent plus de neuf mille ennemis, blessèrent et mutilèrent la plupart des soldats de Nicanor, et les forcèrent tous à fuir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ παντοκράτορος
  choice: le Tout-Puissant
  rationale: Titre divin consacré en français, il exprime la souveraine puissance de Dieu sans ajouter de précision étrangère au grec.
- source_word: συμμάχου
  choice: pour allié
  rationale: Le terme désigne celui qui combat aux côtés de quelqu’un; « allié » conserve nettement le cadre militaire.
- source_word: κατέσφαξαν
  choice: massacrèrent
  rationale: Le verbe est particulièrement fort et violent; « massacrèrent » en restitue l’intensité dans ce récit de bataille.
- source_word: ὑπὲρ τοὺς ἐννακισχιλίους
  choice: plus de neuf mille
  rationale: ὑπέρ suivi de l’accusatif marque ici le dépassement d’un nombre.
- source_word: τραυματίας
  choice: blessèrent
  rationale: Dans la construction grecque, le terme décrit ceux que l’action rend blessés; la formulation verbale est naturelle en français.
- source_word: τοῖς μέλεσιν ἀπηρεῖς
  choice: mutilèrent
  rationale: L’expression décrit des personnes gravement atteintes dans leurs membres; « mutilèrent » rend cette séquelle corporelle durable avec concision.
- source_word: τὸ πλεῖον μέρος τῆς τοῦ Νικάνορος στρατειᾶς
  choice: la plupart des soldats de Nicanor
  rationale: Cette formulation rend clairement la majorité de la force militaire placée sous le commandement de Nicanor, tout en évitant de faire grammaticalement de « l’armée » l’objet de « blesser ».
- source_word: πάντας δὲ φεύγειν ἠνάγκασαν
  choice: et les forcèrent tous à fuir
  rationale: La tournure conserve la contrainte exprimée par ἠνάγκασαν et le mouvement de fuite exprimé par φεύγειν.
theological_decisions:
- issue: Traduction du titre divin παντοκράτωρ dans un contexte de délivrance militaire
  choice: le Tout-Puissant
  alternative: le Souverain de tout
  rationale: « Le Tout-Puissant » est le titre français établi et fidèle à l’accent porté sur la puissance suprême de Dieu; il n’introduit aucune interprétation confessionnelle supplémentaire.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste vive et narrative. « Massacrèrent » préserve la violence du verbe grec, tandis que « ayant le Tout-Puissant pour allié » maintient explicitement l’image militaire de l’assistance divine.
