  text: For it was the day before the Sabbath[a], and for that reason they did not continue pursuing them for long.
translation:
  language: fr
  text: En effet, c’était la veille du sabbat[a] ; c’est pourquoi ils ne continuèrent pas longtemps à les poursuivre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque traduite par « la veille du sabbat » est difficile sur les plans textuel et lexical dans le texte de Swete (« ἡ πρὸ τοῦ σαββάτου δίκη »). La traduction suit le sens clair du contexte : l’approche du sabbat limitait la durée de la poursuite.'
    reason: textual_variant
lexical_decisions:
- source_word: ἦν γὰρ
  choice: En effet, c’était
  rationale: γάρ introduit l’explication de l’interruption de la poursuite ; « En effet » exprime naturellement ce lien causal en français.
- source_word: ἡ πρὸ τοῦ σαββάτου δίκη
  choice: la veille du sabbat
  rationale: 'Le libellé grec transmis par Swete est difficile, car δίκη a normalement le sens de « justice », « peine » ou « procès ». Le contexte et πρὸ τοῦ σαββάτου indiquent toutefois clairement un repère temporel : le jour précédant le sabbat.'
- source_word: διʼ ἣν αἰτίαν
  choice: c’est pourquoi
  rationale: Cette tournure restitue clairement et naturellement la conséquence causale exprimée par le grec.
- source_word: οὐκ ἐμακροτόνησαν
  choice: ils ne prolongèrent pas
  rationale: Le verbe indique qu’ils ne firent pas durer longtemps l’action exprimée par le participe qui suit.
- source_word: κατατρέχοντες αὐτούς
  choice: leur poursuite
  rationale: Le participe désigne l’action de poursuivre des adversaires. La nominalisation française évite une tournure lourde tout en conservant le sens militaire.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. « La veille du sabbat » est plus naturel que « le jour avant le sabbat » ; le point-virgule met en relief le rapport logique entre le calendrier sabbatique et l’arrêt rapide de la poursuite.
