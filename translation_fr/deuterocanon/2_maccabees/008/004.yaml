  text: and also to remember the lawless destruction of the innocent infants[a], and the blasphemies committed against his name[b], and to hate evil.
translation:
  language: fr
  text: et de se souvenir aussi de la destruction contraire à la loi des nourrissons innocents[a], des blasphèmes commis contre son nom, et de haïr le mal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des nourrissons sans péché ». Le mot grec signifie littéralement « sans péché », mais il souligne probablement ici leur innocence en tant que victimes.
    reason: lexical_alternative
  - marker: b
    text: Ou « d’avoir le mal en horreur » ou « d’abhorrer la méchanceté ». Le verbe grec est rare et exprime une forte hostilité envers le mal.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνησθῆναι
  choice: se souvenir
  rationale: L’infinitif s’inscrit dans la suite des demandes adressées à Dieu; « se souvenir » est direct et naturel en français.
- source_word: ἀναμαρτήτων
  choice: innocents
  rationale: Le mot signifie littéralement « sans péché »; dans ce contexte de victimes très jeunes, « innocents » exprime leur absence de culpabilité sans transformer la formule en affirmation doctrinale sur l’impeccabilité.
- source_word: νηπίων
  choice: nourrissons
  rationale: Le terme désigne de très jeunes enfants; « nourrissons » garde cette précision et la gravité du passage.
- source_word: παρανόμου
  choice: injuste
  rationale: L’adjectif qualifie ce qui se fait au mépris de la loi et du droit. « Injuste » rend naturellement ici la condamnation morale et juridique, sans le ton administratif de « illégal ».
- source_word: ἀπωλίας
  choice: destruction
  rationale: Le nom peut désigner la destruction, la ruine ou la perte. « Destruction » demeure proche du grec, tandis que le contexte indique qu’il s’agit d’une mise à mort.
- source_word: βλασφημιῶν
  choice: blasphèmes
  rationale: Puisque l’offense vise le nom de Dieu, « blasphèmes » conserve le sens religieux précis et la force du terme.
- source_word: γενομένων εἰς τὸ ὄνομα αὐτοῦ
  choice: proférés contre son nom
  rationale: Littéralement, il s’agit de blasphèmes « survenus » ou « commis » contre son nom. « Proférés contre son nom » est idiomatique et explicite leur orientation hostile.
- source_word: μισοπνηρῆσαι
  choice: prendre le mal en haine
  rationale: Ce verbe rare exprime une forte hostilité envers le mal. La tournure française conserve la nuance dynamique possible tout en restant solennelle et intelligible.
theological_decisions:
- issue: Portée de ἀναμαρτήτων appliqué aux très jeunes victimes
  choice: nourrissons innocents
  alternative: nourrissons sans péché
  rationale: « Sans péché » reproduirait plus littéralement la forme grecque, mais pourrait être entendu comme une prise de position doctrinale absolue. Dans le contexte, « innocents » préserve le contraste moral entre les victimes et leurs meurtriers.
- issue: Nuance de μισοπνηρῆσαι
  choice: prendre le mal en haine
  alternative: haïr le mal
  rationale: Le verbe peut simplement signifier « haïr le mal », mais la mémoire des atrocités peut aussi conduire à cette réaction. La formulation retenue garde cette légère nuance dynamique sans la rendre certaine.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la coordination infinitive du contexte et le ton de supplication, tout en évitant les formulations administratives ou confessionnelles.
