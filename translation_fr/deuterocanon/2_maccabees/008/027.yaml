base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/027.yaml
  text: After they had collected their weapons and stripped the spoils from the enemies[a], they devoted themselves to the Sabbath, abundantly blessing and giving thanks to the Lord who had preserved them to this day[b], having appointed for them the beginning of mercy.
translation:
  language: fr
  text: Après avoir ramassé les armes et dépouillé les ennemis de leur butin, ils se consacrèrent au sabbat[a], bénissant abondamment le Seigneur et lui rendant grâce, lui qui les avait préservés jusqu’à ce jour et qui leur avait accordé un commencement de miséricorde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils s’occupèrent de l’observance du sabbat ». L’expression grecque peut aussi suggérer qu’ils se tournèrent vers le sabbat au moment où il arrivait.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « leur avait accordé un premier signe de miséricorde ». Le grec peut indiquer que cette délivrance marquait le début d’une faveur divine renouvelée.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁπλολογήσαντες δὲ αὐτοὺς
  choice: Après avoir ramassé leurs armes
  rationale: Le verbe rare ὁπλολογέω désigne ici la collecte des armes après le combat. « Ramassé leurs armes » reste naturel et ne précise pas davantage que le grec à qui elles appartenaient.
- source_word: τὰ σκῦλα ἐκδύσαντες τῶν πολεμίων
  choice: dépouillé les ennemis de leurs biens
  rationale: La tournure grecque évoque concrètement le fait de retirer aux vaincus ce qui peut être pris comme butin. Cette formulation française restitue l’action sans la lourdeur de « dépouiller les dépouilles ».
- source_word: περὶ τὸ σάββατον ἐγίνοντο
  choice: ils se consacrèrent au sabbat
  rationale: L’expression est idiomatique et indique qu’ils tournèrent leur attention vers l’observance du sabbat, vraisemblablement à son arrivée. La note conserve cette nuance temporelle possible.
- source_word: περισσῶς
  choice: avec ferveur
  rationale: L’adverbe intensifie la bénédiction et l’action de grâce. « Avec ferveur » exprime naturellement en français l’abondance et l’intensité de leur louange.
- source_word: εὐλογοῦντες καὶ ἐξομολογούμενοι
  choice: bénissant … et rendant grâce
  rationale: « Bénissant » conserve le sens direct de εὐλογέω, tandis que, dans ce contexte cultuel de délivrance, ἐξομολογέομαι désigne une reconnaissance publique et reconnaissante adressée à Dieu.
- source_word: τῷ κυρίῳ
  choice: au Seigneur
  rationale: Dans ce contexte biblique et théologique, κύριος désigne le Dieu d’Israël et se traduit naturellement par « le Seigneur ».
- source_word: τῷ διασώζοντι εἰς τὴν ἡμέραν ταύτην
  choice: qui les avait préservés jusqu’à ce jour
  rationale: Le participe présente l’action protectrice du Seigneur comme s’étendant jusqu’au jour présent du récit.
- source_word: ἀρχὴν ἐλέους τάξαντος αὐτοῖς
  choice: avait disposé pour eux un commencement de miséricorde
  rationale: « Disposé pour eux » rend l’idée d’établir ou d’assigner portée par τάσσω, tandis que « un commencement de miséricorde » préserve l’étrangeté féconde et l’ouverture théologique de la formule grecque.
theological_decisions:
- issue: Sens de ἀρχὴν ἐλέους τάξαντος αὐτοῖς
  choice: La délivrance constitue « un commencement de miséricorde » disposé par Dieu pour eux.
  alternative: La délivrance est le premier signe de la miséricorde divine ou le début d’une faveur renouvelée.
  rationale: Le texte présente cette victoire comme un début, sans affirmer qu’elle constitue déjà une restauration complète. La traduction maintient cette tension et n’ajoute ni renouvellement explicite de l’alliance ni accomplissement total.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme participial grec est allégé sans perdre la succession des actions. « Sabbat », « Seigneur » et « miséricorde » conservent le registre biblique courant; la formulation finale demeure volontairement légèrement marquée afin de préserver l’ambiguïté théologique du grec.
