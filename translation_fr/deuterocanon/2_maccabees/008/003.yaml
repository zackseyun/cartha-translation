  text: and to have mercy also on the city that was being destroyed and was about to be leveled to the ground[a], and to hear the blood crying out to him[b];
translation:
  language: fr
  text: et de faire aussi miséricorde à la ville que l’on détruisait et qui allait être rasée jusqu’au sol, et d’entendre le sang criant vers lui[a][b] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « les sangs », un pluriel qui peut souligner l’ampleur de l’effusion de sang ou la culpabilité liée au sang versé.
    reason: lexical_alternative
  - marker: b
    text: L’image du sang qui crie vers Dieu fait probablement écho à un motif biblique où le sang innocent crie vers Dieu.
    reason: cross_reference
lexical_decisions:
- source_word: ἐλεῆσαι
  choice: avoir pitié
  rationale: L’infinitif exprime la suite de la prière commencée dans le contexte précédent. « Avoir pitié » est naturel en français actuel et conserve l’idée de compassion sans affaiblir le verbe en simple émotion.
- source_word: καταφθειρομένην
  choice: que l’on détruisait
  rationale: Le participe présent indique une destruction en cours. Cette tournure française reste fluide et évite la lourdeur de « en train d’être détruite ».
- source_word: πόλιν
  choice: la ville
  rationale: Le grec emploie le nom commun, même si le contexte désigne Jérusalem ; la traduction ne remplace donc pas ce nom par le toponyme.
- source_word: μέλλουσαν ἰσόπεδον γίνεσθαι
  choice: qui allait être rasée jusqu’au sol
  rationale: μέλλουσαν marque l’imminence, tandis que ἰσόπεδον γίνεσθαι décrit la ville rendue plane, au niveau du sol. « Rasée jusqu’au sol » restitue naturellement l’image en français.
- source_word: τῶν ... αἱμάτων
  choice: le sang
  rationale: Le grec emploie le pluriel littéral « les sangs », qui peut évoquer une effusion de sang multiple ou en intensifier l’horreur. Le français biblique et courant emploie naturellement le singulier collectif « le sang » dans cette image.
- source_word: καταβοώντων πρὸς αὐτόν
  choice: qui criait vers lui
  rationale: Le participe qualifie « le sang » et conserve l’image concrète d’un sang qui élève sa plainte vers Dieu. L’imparfait s’accorde avec le singulier collectif choisi en français.
- source_word: εἰσακοῦσαι
  choice: entendre
  rationale: Dans le langage de la prière, le verbe peut suggérer une écoute favorable, mais « entendre » en garde la formulation directe et laisse cette nuance ouverte.
theological_decisions:
- issue: Possible écho biblique du sang qui crie vers Dieu
  choice: Conserver l’image concrète « le sang qui criait vers lui » sans préciser l’objet de ce cri.
  alternative: « le sang des victimes qui criait vers lui pour obtenir justice »
  rationale: Le grec ne nomme pas explicitement les victimes et n’ajoute ni « justice » ni « vengeance ». La formulation retenue préserve donc l’écho biblique et sa tension théologique sans l’expliciter.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe infinitive et le point-virgule signalent que le verset poursuit la prière du contexte précédent. « Que l’on détruisait » rend le processus en cours sans identifier un agent que le grec ne nomme pas.
