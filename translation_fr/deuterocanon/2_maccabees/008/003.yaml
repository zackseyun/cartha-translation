    issue: « avoir pitié » pour ἐλεῆσαι
    rationale: La formule peut évoquer surtout un sentiment de compassion ou de commisération. Dans une prière, « faire miséricorde » représente plus précisément l’appel grec, sans imposer une lecture confessionnelle.
  - severity: low
    issue: Imparfait « qui criait » pour le participe présent καταβοώντων
    rationale: L’imparfait est possible, mais « criant » conserve plus nettement le caractère actuel et imagé du participe grec, tandis que la structure reste naturelle en français biblique.
  - severity: low
    issue: 'Note b : « appelle Dieu à intervenir »'
    rationale: Le grec ne formule pas explicitement une demande d’intervention. La note peut signaler l’écho biblique sans expliciter l’effet attendu.
