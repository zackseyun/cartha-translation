  text: And coming upon cities and countryside unexpectedly[a], he would set them on fire; and by seizing strategic places, he put not a few of the enemies to flight,
translation:
  language: fr
  text: Arrivant à l’improviste dans des villes et des campagnes, il y mettait le feu, s’emparant de lieux stratégiques[a] et mettant en fuite bon nombre de ses ennemis,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « positions avantageuses » pour « lieux stratégiques » (ἐπικαίρους τόπους).
    reason: lexical_alternative
lexical_decisions:
- source_word: πόλεις
  choice: villes
  rationale: Rend naturellement les agglomérations urbaines et maintient le contraste avec les campagnes.
- source_word: χώρας
  choice: campagnes
  rationale: Dans son opposition à πόλεις, le terme désigne ici les territoires ruraux plutôt que des pays au sens politique.
- source_word: ἀπροσδοκήτως
  choice: à l’improviste
  rationale: Exprime une arrivée inattendue, sans préciser davantage la manière de l’attaque.
- source_word: ἐρχόμενος
  choice: arrivant
  rationale: Le participe garde la relation circonstancielle avec l’action principale et convient à des incursions répétées.
- source_word: ἐνεπίμπρα
  choice: il les incendiait
  rationale: L’imparfait français restitue l’action répétée ou habituelle de l’imparfait grec, tandis qu’« incendier » conserve la force transitive du verbe.
- source_word: ἐπικαίρους τόπους
  choice: lieux stratégiques
  rationale: Dans ce contexte militaire, l’expression désigne des emplacements avantageux ou décisifs sur le plan tactique.
- source_word: ἀπολαμβάνων
  choice: s’emparant de
  rationale: Rend la prise de contrôle de ces lieux dans un contexte militaire.
- source_word: οὐκ ὀλίγους
  choice: bon nombre de
  rationale: Transmet idiomatiquement en français la litote grecque, qui signifie qu’un nombre important d’ennemis fut mis en fuite.
- source_word: τῶν πολεμίων
  choice: d’ennemis
  rationale: Conserve le pluriel grec avec une formulation française naturelle.
- source_word: τροπούμενος
  choice: il mettait en fuite
  rationale: Préserve le sens militaire de faire tourner les ennemis et les contraindre à fuir.
