- from: Arrivant à l’improviste dans des villes et des campagnes, il les incendiait ; s’emparant de lieux stratégiques[a], il mettait en fuite bon nombre d’ennemis,
  to: Arrivant à l’improviste dans des villes et des campagnes, il y mettait le feu, s’emparant de lieux stratégiques[a] et mettant en fuite bon nombre de ses ennemis,
  rationale: La révision rétablit le parallélisme des participes grecs et emploie une formulation française plus naturelle pour l’incendie de villes et de territoires ruraux. Elle conserve le registre narratif, le vocabulaire militaire, l’ambiguïté limitée du texte et la ponctuation ouverte du verset.
